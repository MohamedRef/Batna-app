lecture: hb.L09
lessons:
  # ------------------------------------------------------------------
  - id: hb.L09.lesson1
    title: "المية بتتجمع في البطن ليه؟"
    hook: "الكلية شايفة إن الجسم «عطشان» وهو غرقان مية: أغرب سوء تفاهم في الطب."
    minutes: 9
    pages: [145, 148]
    topics: [causes, pathophysiology]
    goals:
      - "تعرّف الـ ascites وتقسم أسبابها لـ normal و diseased peritoneum"
      - "تفرق بين الـ mechanical والـ biochemical factors"
      - "تحكي الـ peripheral arterial vasodilatation hypothesis خطوة خطوة"
    status: unverified
    steps:
      - kind: explain
        page: 145
        title: "نبدأ بالتعريف"
        quote: "Ascites is accumulation of free sterile fluid within the peritoneal cavity."
        text: |
          الـ ascites هي تجمّع **free sterile fluid** جوه الـ **peritoneal cavity**.

          خد بالك من الكلمتين: **free** (مش محبوس في كيس) و **sterile** (مش صديد). لو اتلوّث يبقى عندنا مضاعفة اسمها **SBP** وهنوصلها في آخر درس.

          الكتاب بيقسم الأسباب لعيلتين حسب حالة الـ peritoneum نفسه:
          - **Normal peritoneum:** المشكلة جاية من برّه (ضغط أو بروتين أو هرمونات).
          - **Diseased peritoneum:** الغشاء نفسه عيّان (عدوى أو ورم أو التهاب).
      - kind: sort
        page: 146
        prompt: "حط كل سبب في العيلة بتاعته:"
        bins: ["Normal peritoneum", "Diseased peritoneum"]
        cards:
          - { text: "Cirrhosis (portal hypertension)", bin: 0 }
          - { text: "Constrictive pericarditis", bin: 0 }
          - { text: "Nephrotic syndrome", bin: 0 }
          - { text: "Meig's syndrome", bin: 0 }
          - { text: "Tuberculosis", bin: 1 }
          - { text: "Primary mesothelioma", bin: 1 }
          - { text: "Familial mediterranean fever", bin: 1 }
          - { text: "Chylous ascites", bin: 0 }
        why: "الـ **normal peritoneum** فيها 6 مجموعات: portal hypertension، cardiac، hypoproteinemia، pancreatic، endocrine (زي Meig's)، و miscellaneous (chylous، bile، nephrogenic، urine). الـ **diseased peritoneum** 3 بس: infections (TB)، malignant (mesothelioma)، و other rare (FMF)."
      - kind: mnemonic
        page: 146
        word: "IMO"
        parts:
          - { key: "I", text: "Infections: TB, Fitz-Hugh-Curtis, fungal (Coccidioidomycosis), HIV-associated peritonitis, Whipple's disease" }
          - { key: "M", text: "Malignant: primary mesothelioma, pseudomyxoma peritonei, HCC, massive hepatic metastases, intra-abdominal tumors" }
          - { key: "O", text: "Other rare: FMF, collagen vascular disease, granulomatous and eosinophilic peritonitis" }
        hook: |
          **IMO** يعني In My Opinion، والـ peritoneum بيقولك: في رأيي أنا اللي عيّان مش الكبد! تلات مجموعات بس، والباقي كله normal peritoneum.
      - kind: explain
        page: 146
        title: "عيلتين من العوامل"
        text: |
          المية بتطلع من الشعيرات لما يحصل حاجتين مع بعض:

          **Mechanical factors** (فيزيا Starling):
          - **Hydrostatic pressure ↑:** portal hypertension، ضيق الـ IVC عند الـ diaphragm، أو block في الـ hepatic veins.
          - **Colloid osmotic pressure ↓:** nephrotic، protein-losing enteropathy، hepatic insufficiency.
          - **Capillary permeability** مضطربة.
          - **Lymph** بيتكوّن أكتر من قدرة الـ drainage.

          **Biochemical factors** (الكلية بتحبس Na والمية):
          - **Anti-natriuretic ↑:** RAAS، ADH، thromboxane، endothelin، catecholamines، endotoxemia.
          - **Natriuretic ↓:** atrial و renal natriuretic factors، kallikrein-kinin، PGE2، prostacyclin.
      - kind: check
        page: 146
        question: "Which of these is a NATRIURETIC factor that falls in ascites?"
        options:
          - "Prostaglandin E2"
          - "Endothelin"
          - "Thromboxane"
          - "Catecholamines"
        answer: 0
        why:
          - "صح: PGE2 مع prostacyclin و kallikrein-kinin والـ natriuretic peptides بيطلّعوا Na، ونقصهم بيحبس الملح."
          - "الـ endothelin من الـ **anti-natriuretic** اللي بتزيد."
          - "الـ thromboxane برضه **anti-natriuretic**."
          - "الـ catecholamines (الـ SNS) **anti-natriuretic**."
      - kind: explain
        page: 147
        title: "في الـ cirrhosis: أول جرس إنذار"
        quote: "The development of ascites in patients with cirrhosis is the most frequent first decompensating event."
        text: |
          الـ ascites هي **most frequent first decompensating event** في الـ cirrhosis. وحوالي **60%** من الـ compensated cirrhosis بيعملوا ascites خلال **10 سنين** لو مفيش علاج.

          النظرية المقبولة أكتر حاجة: **peripheral arterial vasodilatation hypothesis**. تعالى نشوفها مرسومة.
      - kind: figure
        page: 147
        title: "الـ peripheral arterial vasodilatation hypothesis"
        alt: "A vertical chain: portal hypertension, then vasodilators accumulate (NO, CO, glucagon, prostaglandins, endocannabinoids), then splanchnic and systemic arterial vasodilatation, arterial underfilling, baroreceptors activate RAAS, SNS and ADH, renal vasoconstriction with sodium and water retention, portal hypertension localizes the fluid to the peritoneum, ascites and dilutional hyponatremia."
        caption: "الـ portal hypertension بتظهر مرتين: في الأول هي اللي بتطلّع الـ vasodilators، وفي الآخر هي الـ **localizing factor** اللي بتخلي المية تروح البطن بالذات."
        svg: |
          <svg viewBox="0 0 330 494" xmlns="http://www.w3.org/2000/svg">
          <defs><marker id="L09a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
          <rect x="12" y="10" width="306" height="40" rx="7" class="fg-bad"/>
          <text x="165" y="27" text-anchor="middle" class="t-b">Portal hypertension</text>
          <text x="165" y="42" text-anchor="middle" class="t-sm">the starting point</text>
          <path d="M165 52v16" class="fg-arrow" marker-end="url(#L09a)"/>
          <rect x="12" y="72" width="306" height="40" rx="7" class="fg-box"/>
          <text x="165" y="89" text-anchor="middle" class="t-b">Vasodilators pile up</text>
          <text x="165" y="104" text-anchor="middle" class="t-sm">NO, CO, glucagon, prostaglandins, endocannabinoids</text>
          <path d="M165 114v16" class="fg-arrow" marker-end="url(#L09a)"/>
          <rect x="12" y="134" width="306" height="40" rx="7" class="fg-box"/>
          <text x="165" y="151" text-anchor="middle" class="t-b">Arterial vasodilatation</text>
          <text x="165" y="166" text-anchor="middle" class="t-sm">splanchnic + systemic; gut bacteria add more NO</text>
          <path d="M165 176v16" class="fg-arrow" marker-end="url(#L09a)"/>
          <rect x="12" y="196" width="306" height="40" rx="7" class="fg-box"/>
          <text x="165" y="213" text-anchor="middle" class="t-b">Arterial underfilling</text>
          <text x="165" y="228" text-anchor="middle" class="t-sm">normal blood volume, much bigger arterial bed</text>
          <path d="M165 238v16" class="fg-arrow" marker-end="url(#L09a)"/>
          <rect x="12" y="258" width="306" height="40" rx="7" class="fg-acc"/>
          <text x="165" y="275" text-anchor="middle" class="t-b">Baroreceptors fire</text>
          <text x="165" y="290" text-anchor="middle" class="t-sm">RAAS + SNS + ADH switched on</text>
          <path d="M165 300v16" class="fg-arrow" marker-end="url(#L09a)"/>
          <rect x="12" y="320" width="306" height="40" rx="7" class="fg-box"/>
          <text x="165" y="337" text-anchor="middle" class="t-b">Renal vasoconstriction</text>
          <text x="165" y="352" text-anchor="middle" class="t-sm">Na and water retained: hypervolemia</text>
          <path d="M165 362v16" class="fg-arrow" marker-end="url(#L09a)"/>
          <rect x="12" y="382" width="306" height="40" rx="7" class="fg-acc"/>
          <text x="165" y="399" text-anchor="middle" class="t-b">Portal hypertension localizes it</text>
          <text x="165" y="414" text-anchor="middle" class="t-sm">fluid transudes into the peritoneal cavity</text>
          <path d="M165 424v16" class="fg-arrow" marker-end="url(#L09a)"/>
          <rect x="12" y="444" width="306" height="40" rx="7" class="fg-bad"/>
          <text x="165" y="461" text-anchor="middle" class="t-b">ASCITES</text>
          <text x="165" y="476" text-anchor="middle" class="t-sm">and ADH: free water kept, Na &lt; 130 (dilutional)</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 147
        text: |
          تخيّل شقة فيها 4 أوض والمية بتاعتها على قدها. فجأة المقاول وسّع الأوض لـ 8 (**vasodilatation**). المية هي هي، بس دلوقتي الحنفيات ناشفة (**underfilling**).

          الـ baroreceptors (البوّاب) يتصل بالكلية: «إلحقي، مفيش مية!». الكلية تقفل البلاعات وتحبس **Na** والمية. والمية الزيادة؟ بتتسرّب من أضعف ماسورة في البيت، وهي الـ **portal system** اللي ضغطها عالي، فتنزل البطن.
      - kind: order
        page: 147
        prompt: "رتّب السلسلة من أولها:"
        steps:
          - "Portal hypertension"
          - "Accumulation of endogenous vasodilators (NO and others)"
          - "Splanchnic and systemic arterial vasodilatation"
          - "Arterial underfilling"
          - "RAAS, SNS and ADH activation"
          - "Renal Na and water retention"
          - "Fluid transudes into the peritoneum"
        why: "الـ trigger هو تراكم الـ vasodilators بسبب الـ PH. الـ underfilling بيشغّل الـ baroreceptors، والـ vasoconstrictor systems بتحبس Na ومية، والـ PH (localizing factor) بتوجّه المية للبطن."
      - kind: reveal
        page: 147
        prompt: "مريض ascites عنده **Na 127**. هو عنده مية زيادة ولا ناقصة؟ وليه الصوديوم واطي؟"
        answer: |
          عنده مية **زيادة** (hypervolemic). الـ **ADH** المتنشط بيقلل الـ **tubular free water clearance**، فالمية بتتحبس أكتر من الملح والصوديوم يتخفف.

          ده اللي الكتاب بيسميه **dilutional hyponatremia**، وحدّه **serum Na < 130 mmol/L**. ومش علاجه إنك تديله ملح!
      - kind: aside
        tone: tip
        page: 147
        text: |
          ومتنساش الـ **gut bacteria**: الـ **bacterial translocation** للـ mesenteric lymph nodes بتزوّد الـ endotoxin، فيطلع **pro-inflammatory cytokines** و **nitric oxide**، فالـ splanchnic vasodilatation تزيد. نفس البكتيريا دي هنقابلها تاني في الـ HRS والـ SBP.
      - kind: try
        items: [hb.L09.002, hb.L09.014, hb.L09.012]
    recap:
      - "Ascites = **free sterile fluid** في الـ peritoneal cavity."
      - "Normal peritoneum: 6 مجموعات. Diseased peritoneum: **IMO** (Infections، Malignant، Other rare)."
      - "Mechanical (Starling) + biochemical (Na retention) factors."
      - "في الـ cirrhosis: vasodilators → underfilling → RAAS/SNS/ADH → Na ومية → PH بتوجّهها للبطن."
      - "ADH → dilutional hyponatremia (Na < 130)."
    practice: [hb.L09.001, hb.L09.002, hb.L09.003, hb.L09.004, hb.L09.005, hb.L09.006, hb.L09.007, hb.L09.008, hb.L09.009, hb.L09.010, hb.L09.011, hb.L09.012, hb.L09.013, hb.L09.014, hb.L09.015, hb.L09.016, hb.L09.017, hb.L09.175, hb.L09.185]

  # ------------------------------------------------------------------
  - id: hb.L09.lesson2
    title: "تكشف على البطن: أسطى الـ grades"
    hook: "لتر ولا اتنين مستخبيين قبل ما إيدك تحس بحاجة. اعرف إمتى تشوفهم وإمتى تخاف."
    minutes: 7
    pages: [148, 149]
    topics: [clinical]
    goals:
      - "تعدّ علامات الـ ascites في الكشف"
      - "تدرّج الـ ascites (1، 2، 3) وتعرّف الـ tense ascites"
      - "تشرح الـ hepatic hydrothorax وعلاجه وتعرّف الـ complicated ascites"
    status: unverified
    steps:
      - kind: explain
        page: 148
        title: "إيه اللي بتشوفه؟"
        text: |
          الـ ascites ممكن تظهر **فجأة** أو تزحف على **شهور** مع انتفاخ (flatulent distension).

          - لازم يبقى فيه **على الأقل 1–2 لتر** قبل ما تتلقط بالكشف.
          - في الـ cirrhosis، الـ **ascites بتسبق الـ peripheral edema**.

          العلامات: البطن بتكبر، **full flanks**، **wide subcostal angle**، **divarication of the recti**، السُرّة **shifted downward** و **everted** مع umbilical hernia، hernias تانية، و **scrotal swelling**.
      - kind: reveal
        page: 148
        prompt: "ليه في الـ cirrhosis البطن بتتملي قبل الرجلين، عكس الـ heart failure؟"
        answer: |
          لأن الـ **portal hypertension** هي الـ **localizing factor**: المية الزيادة بتتسرب من الـ splanchnic bed الأول، فتنزل البطن قبل ما تلحق الـ peripheral tissues.

          (الشرح ده من الـ physiology اللي في الدرس اللي فات؛ الكتاب بيكتفي بإن الـ ascites بتسبق الـ edema.)
      - kind: mnemonic
        page: 148
        word: "UST"
        parts:
          - { key: "U", text: "Grade 1 (mild): seen on Ultrasound only" }
          - { key: "S", text: "Grade 2 (moderate): symmetrical distension, flank bulging, Shifting dullness" }
          - { key: "T", text: "Grade 3 (severe): marked distension with a fluid Thrill" }
        hook: |
          اقراها **«أُسطى»** 😄: يا أسطى، الـ grade 1 بالـ **U**ltrasound، الـ 2 بالـ **S**hifting dullness، والـ 3 بالـ fluid **T**hrill. حرف لكل درجة وبالترتيب.
      - kind: check
        page: 148
        question: "A cirrhotic has symmetrical abdominal distension with flank bulging and shifting dullness, but no fluid thrill. Grade?"
        options:
          - "Grade 1"
          - "Grade 2"
          - "Grade 3"
          - "Tense ascites"
        answer: 1
        why:
          - "Grade 1 مش بتبان غير بالـ ultrasound، ودي باينة بالكشف."
          - "صح: moderate symmetrical distension + flank bulging + shifting dullness = **grade 2**."
          - "Grade 3 محتاجة **fluid thrill** و marked distension."
          - "الـ tense محتاجة **pressure manifestations** (dyspnea، early satiety…)."
      - kind: explain
        page: 149
        title: "Tense ascites"
        text: |
          الـ **tense ascites** هي severe ascites بترفع الـ **intra-abdominal pressure** لدرجة إنها تعمل **pressure manifestations**:
          - **Dyspnea**
          - **Early satiety**
          - **Functional IVC block** و congested neck veins
          - احتمال **rupture of umbilical hernia**
      - kind: aside
        tone: joke
        text: |
          الـ tense ascites زي أتوبيس النقل العام الساعة 8 الصبح: الكل مزنوق، الحجاب الحاجز مش لاقي مكان يتنفس، والمعدة بتقولك «شبعت» من أول لقمة. 🚌
      - kind: explain
        page: 149
        title: "Hepatic hydrothorax: المية طلعت الدور اللي فوق"
        text: |
          - غالبًا **right-sided effusion**؛ الـ ascitic fluid بيعدّي من **diaphragmatic defects** للـ pleural space.
          - ممكن يعمل **dyspnea**.
          - السائل شبه الـ ascites: **transudate** (low protein) و **high serum-pleural albumin gradient (≥1.1 g/dl)**.
          - ممكن يتعقّد بـ **spontaneous bacterial empyema**، وده يتعالج زي الـ **SBP**.
          - العلاج نفس علاج الـ ascites. لو **refractory**: **TIPS** كـ bridge to LT، والـ **LT** هي best option. الـ **repetitive thoracentesis** والـ **pleurodesis** لو كل ده فشل.
      - kind: check
        page: 149
        question: "Refractory hepatic hydrothorax: what does the book call the best option?"
        options:
          - "Liver transplantation"
          - "Pleurodesis"
          - "Repeated thoracentesis"
          - "Chest tube drainage"
        answer: 0
        why:
          - "صح: **LT** هي best option، و TIPS ممكن تبقى bridge ليها."
          - "الـ pleurodesis تتجرّب بس لو العلاجات التانية فشلت."
          - "الـ repetitive thoracentesis برضه آخر حل، مش الأحسن."
          - "الكتاب مش بيذكر الـ chest tube كعلاج هنا."
      - kind: sort
        page: 149
        prompt: "مين يخلي الـ ascites «complicated»؟"
        bins: ["Complicated ascites", "Not in the definition"]
        cards:
          - { text: "Refractory ascites", bin: 0 }
          - { text: "Dilutional hyponatremia", bin: 0 }
          - { text: "Hepatorenal syndrome", bin: 0 }
          - { text: "SBP", bin: 0 }
          - { text: "Umbilical hernia", bin: 1 }
          - { text: "Grade 3 ascites", bin: 1 }
        why: "الكتاب بيعرّف الـ **complicated ascites** بأربعة: refractory، dilutional hyponatremia، HRS، و SBP. الـ hernia والـ grade 3 علامات حجم، مش complications بالتعريف ده."
      - kind: try
        items: [hb.L09.021, hb.L09.023, hb.L09.027]
    recap:
      - "لازم 1–2 لتر قبل ما تتلقط بالكشف؛ والـ ascites بتسبق الـ edema في الـ cirrhosis."
      - "الـ grades: **UST** (Ultrasound، Shifting dullness، Thrill)."
      - "Tense = pressure manifestations: dyspnea، early satiety، IVC block، hernia rupture."
      - "Hepatic hydrothorax: يمين، transudate، gradient ≥1.1؛ empyema زي SBP؛ LT هي الأحسن."
      - "Complicated = refractory + hyponatremia + HRS + SBP."
    practice: [hb.L09.018, hb.L09.019, hb.L09.020, hb.L09.021, hb.L09.022, hb.L09.023, hb.L09.024, hb.L09.025, hb.L09.026, hb.L09.027, hb.L09.028, hb.L09.176, hb.L09.191]

  # ------------------------------------------------------------------
  - id: hb.L09.lesson3
    title: "البزل بيقولك إيه؟ SAAG وأصحابه"
    hook: "سرنجة مية واحدة بتقولك السبب، وفيه عدوى ولا لأ، وفيه ورم ولا لأ."
    minutes: 9
    pages: [149, 151]
    topics: [diagnosis]
    goals:
      - "تعرف إمتى تعمل diagnostic paracentesis"
      - "تقرا الـ ascitic fluid analysis: cells، protein، SAAG، LDH"
      - "تعرف الـ special tests والـ prognosis"
    status: unverified
    steps:
      - kind: explain
        page: 149
        title: "التشخيص: من الكشف للسونار"
        text: |
          - الكشف الكويس بيلاقي الـ **free fluid**.
          - الـ **sonography** بتشوف لحد **100 mL** بس (الكتاب كاتبها «100 m»، والمقصود mL).
          - الـ **CT** بس لو فيه مشكلة في الـ **differential diagnosis**.
      - kind: explain
        page: 150
        title: "مين يتبزل؟ وإيه اللي نطلبه؟"
        text: |
          **Diagnostic paracentesis** عند **أول ظهور** لـ grade 2 أو 3، ولما نشك في complication زي الـ **SBP**.

          **Biochemical analysis:**
          - **Appearance:** transparent، tinged yellow، hemorrhagic، أو chylous.
          - **Cell count + differential:** **PMN ≥250/mm³** في الـ SBP، و **lymphocytes** في الـ TB.
          - **Total protein:** واطي **<1.5 g/dL** في الـ cirrhosis، وعالي **>2.5 g/dL** في الـ heart failure والـ malignancy.
          - **Albumin:** علشان نحسب الـ **SAAG**.
          - **LDH:** عالي في الـ malignant ascites.

          **Culture:** 10–20 mL في **زجاجتين blood culture** (aerobic + anaerobic) **at the bedside**.

          **Cytology:** خلي بالك، الـ normal peritoneal epithelial cells ممكن تشبه الـ malignant cells فيحصل **over-diagnosis** للكانسر.
      - kind: reveal
        page: 150
        prompt: "ليه نحط الـ ascitic fluid في blood culture bottles جنب السرير بدل ما نبعته في أنبوبة؟"
        answer: |
          الكتاب بيقول ده هو الصح (**inoculated at the bedside**). والسبب العملي إن عدد البكتيريا في الـ ascites قليل جدًا، فالـ inoculation الفوري في bottles بيزوّد فرصة إن الـ culture تطلع positive.
      - kind: figure
        page: 150
        title: "تقرا الـ SAAG إزاي"
        alt: "SAAG equals serum albumin minus ascitic albumin. At or above 1.1 g/dL means portal hypertension; below 1.1 means a non-portal-hypertension cause. Below that, total protein under 1.5 g/dL fits cirrhosis and above 2.5 g/dL fits heart failure or malignancy. A box notes that portal hypertension plus a second cause still gives a SAAG of 1.1 or more."
        caption: "الـ SAAG بيقيس **الضغط**، والـ total protein بيقيس **الغشاء**: في الـ cirrhosis الـ sinusoids اتعملها capillarization فبتمسك البروتين، فالمية فقيرة. في الـ cardiac الـ sinusoids طبيعية وبتسرّب بروتين، فالمية غنية."
        svg: |
          <svg viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
          <defs><marker id="L09b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
          <rect x="40" y="10" width="250" height="52" rx="8" class="fg-acc"/>
          <text x="165" y="32" text-anchor="middle" class="t-b">SAAG = serum albumin</text>
          <text x="165" y="50" text-anchor="middle" class="t-b">minus ascitic albumin (g/dL)</text>
          <path d="M120 64l-50 40" class="fg-arrow" marker-end="url(#L09b)"/>
          <path d="M210 64l50 40" class="fg-arrow" marker-end="url(#L09b)"/>
