  # ---------- p363-364: management ----------
  - id: neph.L11.069
    kind: enumerate
    topic: aki-rx
    prompt: Mention the general measures in managing pregnancy-related AKI.
    points:
      - Identify the underlying cause
      - Intravenous fluid resuscitation
      - Timely dialysis if needed
      - Prompt delivery if necessary
    pass: 4
    hook: "«السبب، المية، الغسيل، الولادة»: identify the underlying cause، IV fluid resuscitation، dialysis في وقتها لو لزم، وprompt delivery لو لازم."
    src: { page: 363, quote: "Management of AKI in pregnancy Management of AKI in pregnancy should be done by a multidisciplinary team consisting of nephrologists, obstetricians, and neonatologists. General measures to treat pregnancy-related AKI include identification of the underlying cause of kidney injury, intravenous fluid resuscitation, timely initiation of dialysis if needed, and prompt delivery of fetus, if necessary. Intravenous fluid resuscitation is critical with prerenal causes of AKI but should be performed with caution due to the risk of developing pulmonary edema in women with preeclampsia or endotoxin-mediated injury. The treatment for other complications of kidney injury is similar to non- pregnant patients, for instance, use of alkali therapy for metabolic acidosis, loop diuretics for volume overload, blood transfusion for anemia, and potassium binders for hyperkalemia. Since pregnancy is a state of physiological respiratory alkalosis, arterial or venous blood gas should be used to diagnose metabolic acidosis along with a comprehensive metabolic panel. The specific treatment of AKI depends on the underlying cause of the injury. Treatment for glomerulonephritis includes steroid and immunosuppressive therapy, and risk and benefits should be weighted when therapy is initiated in a pregnant woman.(4)" }
    status: unverified
    tags: [high-yield]
