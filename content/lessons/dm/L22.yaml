            <rect x="10" y="58" width="184" height="22" rx="4" class="fg-dot-good"/>
            <text x="202" y="74" class="t-sm">23.0% IPE</text>
            <text x="10" y="100" class="t-sm t-acc">−25% · NNT 21</text>
            <text x="10" y="130" class="t-b">CV death, MI, stroke</text>
