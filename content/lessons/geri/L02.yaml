  - id: geri.L02.lesson3
    title: "الـ UTI عند الكبار: عالِج المريض مش المزرعة"
    hook: "نص الستات الكبار في دور الرعاية مزرعتهم إيجابية. لو عالجتهم كلهم، هتعمل resistance ومش هتفيد حد."
    minutes: 10
    pages: [35, 38]
    topics: [uti, male]
    goals:
      - "تعرف الميكروبات حسب المريض"
      - "تعدّ الـ risk factors"
      - "تعرف إمتى تعالج الـ asymptomatic bacteriuria"
      - "تشك في الـ catheter-associated urinary tract infection (CAUTI) لما يجي atypical"
    status: unverified
    steps:
      - kind: table
        page: 35
        quote: "Bacteriuria: Bacteria in urine (symptomatic, Asymptomatic) Pyuria: Pus cells in the urine (Bacteria, sterile)"
        title: "الكلمات"
        columns: [Term, Meaning]
        rows:
          - [Bacteriuria, "Bacteria in urine, with or without symptoms"]
          - [Pyuria, "Pus cells; bacterial or sterile"]
          - [Dysuria, "Discomfort on micturition"]
          - [Frequency, "Frequent bladder emptying"]
          - [Pyelonephritis, "Loin pain, tenderness, fever, pyuria ± hematuria"]
        hide: [[0, 1], [4, 1]]
      - kind: explain
        remind: [geri.L02.043, geri.L02.057]
        page: 35
        title: "مين الميكروب؟"
        quote: "Bacterial\n  E coli > 80% in women.\n  Enterococcus fecal is common in elderly men.\n  Psendemonas-Klebsiella: more after catheterization\n  Rare: Mycobacterim TB."
        text: |
          **Bacterial:**
          - ==E. coli==: أكتر من **80%** عند الستات
          - ==Enterococcus faecalis==: شائع عند **الرجالة الكبار**
          - **Pseudomonas و Klebsiella**: أكتر بعد الـ **catheter**
          - نادر: **tuberculosis (TB)**

          **Non-bacterial:** fungi بعد antibiotics أو catheter أو immunocompromise، و chlamydia، و **Trichomonas vaginalis**.

          ليه كل ميكروب في مكانه؟ التفسير المقبول (مش في الكتاب):
          - **E. coli** عايش في الأمعاء، والـ urethra عند الست قصيرة وقريبة من الـ perineum، فبيوصل بسهولة.
          - الـ **catheter** بيتحط في المستشفى، فبيدخّل ميكروبات المستشفى زي **Pseudomonas و Klebsiella**، وبيعمل سطح يتلزق عليه الـ biofilm.
          - الـ **antibiotics** بتموّت البكتيريا الطيبة، فالـ **fungi** تلاقي المكان فاضي.
      - kind: match
        page: 35
        quote: "Bacterial\n  E coli > 80% in women.\n  Enterococcus fecal is common in elderly men.\n  Psendemonas-Klebsiella: more after catheterization\n  Rare: Mycobacterim TB."
        prompt: "وصّل الميكروب بالمريض:"
        pairs:
          - ["E. coli", "Older woman, >80%"]
          - ["Enterococcus faecalis", "Elderly man"]
          - ["Pseudomonas, Klebsiella", "After a catheter"]
          - ["Fungi", "After antibiotics"]
        why: "الـ catheter والـ antibiotics بيغيّروا الـ flora، فبتطلع ميكروبات hospital وفطريات."
      - kind: explain
        remind: [geri.L02.046]
        page: 36
        title: "الـ risk factors"
        quote: "Risk factors\n  1- Female\n    Short urethra\n    Transperineal contamination.\n    Sexual activity\n    Prolapse\n    Vaginal infection.\n    Senile vaginitis\n    Pregnancy\n    Estrogen ↓↓\n    Disappearance of colonizing lactobacilli\n    Vaginal pH.\n  2- Stones:\n    Persistant infection ± obstruction.\n  3- Obstruction:\n    Urethral strictures\n    SPH\n    Neurogenic bladder\n    Drugs: anticholinergic"
        text: |
          1. **Female:** urethra قصيرة، transperineal contamination، sexual activity، ==prolapse==، vaginal infection و senile vaginitis، pregnancy، و ==estrogen deficiency==: الـ lactobacilli بتختفي والـ vaginal pH بيتغير.
          2. **Stones:** infection مستمرة ± obstruction.
          3. **Obstruction:** urethral stricture، **benign prostatic hyperplasia (BPH)**، neurogenic bladder، و **anticholinergic** drugs.
          4. **Vesicoureteric reflux.**
          5. **Congenital anomalies.**
          6. **Instrumentation.**

          الفكرة اللي بتجمعهم: البول لازم **يجري ويفضى**. أي حاجة بتخلّي البول **يقف** (stone، obstruction، reflux) أو بتدخّل ميكروب من برّه (instrumentation) بتعمل UTI، لأن البول الواقف زي مية راكدة بيتكاثر فيها الميكروب.
      - kind: reveal
        page: 36
        quote: "Risk factors\n  1- Female\n    Short urethra\n    Transperineal contamination.\n    Sexual activity\n    Prolapse\n    Vaginal infection.\n    Senile vaginitis\n    Pregnancy\n    Estrogen ↓↓\n    Disappearance of colonizing lactobacilli\n    Vaginal pH.\n  2- Stones:\n    Persistant infection ± obstruction.\n  3- Obstruction:\n    Urethral strictures\n    SPH\n    Neurogenic bladder\n    Drugs: anticholinergic"
        prompt: "إزاي نقص الـ estrogen بعد سن اليأس بيجيب UTI؟"
        answer: |
          الـ **estrogen** بيخلّي خلايا المهبل مليانة **glycogen**، والـ **lactobacilli** بتاكله وتعمل **lactic acid** فالـ pH يبقى حامضي ويمنع الـ E. coli.

          من غير estrogen: مفيش glycogen ← الـ lactobacilli تختفي ← الـ pH يعلى ← الـ E. coli تستوطن وتطلع للمثانة. (تفسير فسيولوجي؛ الكتاب بيذكر الـ lactobacilli والـ pH.)
      - kind: aside
        tone: trap
        page: 36
        quote: "Risk factors\n  1- Female\n    Short urethra\n    Transperineal contamination.\n    Sexual activity\n    Prolapse\n    Vaginal infection.\n    Senile vaginitis\n    Pregnancy\n    Estrogen ↓↓\n    Disappearance of colonizing lactobacilli\n    Vaginal pH.\n  2- Stones:\n    Persistant infection ± obstruction.\n  3- Obstruction:\n    Urethral strictures\n    SPH\n    Neurogenic bladder\n    Drugs: anticholinergic"
        text: "الكتاب كاتب **senile prostatic hypertrophy (SPH)** في الـ obstruction، والمقصود **BPH**، يعني تضخم البروستاتا. والدوا الـ **anticholinergic** زي أدوية الـ overactive bladder أو بعض الـ antidepressants ممكن يحبس البول ويجيب urinary tract infection (UTI) عند الحاج."
      - kind: explain
        page: 38
        title: "Asymptomatic bacteriuria: سيبها"
        quote: "Treatment of asymptomatic bacteriuria is rarely indicated in elderly unless a patient is about to undergo a procedure involving the urinary tract."
        text: |
          الـ **asymptomatic bacteriuria** عند الكبار ==نادرًا ما بتتعالج==.

          الاستثناء في الكتاب: لو هيعمل ==procedure على المسالك البولية==.

          ليه؟ العلاج مش بيقلل الوفيات ولا الأعراض، وبيزوّد الـ resistance والـ C. difficile والآثار الجانبية.
      - kind: update
        page: 38
        quote: "Treatment of asymptomatic bacteriuria is rarely indicated in elderly unless a patient is about to undergo a procedure involving the urinary tract."
        text: "الـ Infectious Diseases Society of America (IDSA) 2019 بتعالج الـ asymptomatic bacteriuria (ASB) في الحمل وقبل urologic procedures فيها mucosal trauma بس، وبتقول ما تعملش screening للكبار، حتى في دور الرعاية أو مع delirium من غير systemic signs. نفس رسالة الكتاب."
        ref: "IDSA asymptomatic bacteriuria guideline, 2019"
      - kind: explain
        remind: [geri.L02.052]
        page: 38
        title: "الـ catheter: العدو الساكت"
        quote: "Catheter associated UTI in elderly\n  40% of nosocomial infections\n  4% will become bacteremic\n  Present with Atypical manifestations as\n    Lower abdominal discomfort\n    Restlessness\n    Loss of appetite\n  Empiric treatment with flouro-quinolones"
        text: |
          الـ **catheter-associated urinary tract infection (CAUTI)**:
          - ==40%== من الـ nosocomial infections
          - **4%** بيعملوا bacteremia
          - بيجي ==atypical==: lower abdominal discomfort، restlessness، loss of appetite
          - العلاج الـ empiric في الكتاب: **fluoroquinolones**

          ليه atypical؟ الكبير مش بيقدر يحس أو يقول "بيحرقني"، وجسمه مش بيعمل حرارة عالية بسهولة. فالعدوى بتبان على **سلوكه**: قلق، مش بياكل، وجع مش واضح في البطن.
      - kind: update
