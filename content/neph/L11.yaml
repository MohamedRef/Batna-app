  - id: neph.L11.204
    kind: mcq
    topic: tx-delivery
    stem: "A kidney transplant recipient on prednisolone 5 mg, tacrolimus and azathioprine goes into spontaneous labor at 38 weeks. What is correct?"
    options:
      - Elective cesarean because the graft blocks the birth canal
      - Vaginal delivery with hydrocortisone 100 mg every 6 h, and she may breastfeed
      - Stop tacrolimus during labor
      - Vaginal delivery, but breastfeeding is forbidden on tacrolimus
