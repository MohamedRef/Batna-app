items:
  # ---------- p70-71: physiology and cascade ----------
  - id: hem.L05.001
    kind: card
    topic: cascade
    front: How does normal coagulation work, in the lecture's words?
    back: A series of amplification reactions in which procoagulant proteins (factors) circulate as inert precursors until converted to their active form.
    src: { page: 70, quote: "Normal coagulation results from a series of amplification reactions in which procoagulant. Proteins (factors) circulate in plasma as inert precursors" }
    status: unverified
  - id: hem.L05.002
    kind: card
    topic: cascade
    front: What does the cascade theory say?
    back: Each coagulation factor is converted to its active form by the preceding factor, in a series of biochemical chain reactions.
    src: { page: 70, quote: "According to the cascade theory, each coagulation factor in converted to its active form by the preceding factor" }
    status: unverified
  - id: hem.L05.003
    kind: card
    topic: cascade
    front: Where do the intrinsic and extrinsic systems both end?
    back: In the generation of thrombin, which converts fibrinogen to fibrin.
    src: { page: 71, quote: "Eventually, both the extrinsic and internsic system lead to generation of the enzyme thrombin which converts fibrinogen to fibrin." }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.004
    kind: card
    topic: cascade
    front: Why is the extrinsic pathway called "extrinsic"?
    back: It is initiated when factor III (tissue thromboplastin), a substance not found in the blood, enters the vascular system.
    src: { page: 71, quote: "this pathway is intiated where factor III (tissue thromboplastin), a substance not found in the blood enters the vascular system." }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.005
    kind: order
    topic: cascade
    prompt: "Order the intrinsic pathway as drawn in the lecture's figure (Coagulation & Clot Stabilization, p71)."
    steps:
      - Collagen or other activators activate factor XII
      - Active XII activates XI (with Ca²⁺)
      - Active XI activates IX (with Ca²⁺)
      - Active IX with VIII, Ca²⁺ and phospholipid activates X
      - Active X with V, Ca²⁺ and phospholipid turns prothrombin into thrombin
      - Thrombin turns fibrinogen into fibrin
      - Active XIII cross-links the fibrin
    src: { page: 71, quote: "Hemostasis: Coagulation & Clot Stabilization" }
    status: unverified
  - id: hem.L05.006
    kind: card
    topic: cascade
    front: How does the extrinsic pathway reach factor X (p71 figure)?
    back: Damage exposes tissue factor (III); tissue factor with active VII activates X (and also IX).
    src: { page: 71, quote: "The term ―externsic is used because this pathway is intiated where factor III (tissue thromboplastin)" }
    status: unverified
  - id: hem.L05.007
    kind: cloze
    topic: cascade
    text: "In the lecture's figure, {{c1::thrombin}} gives positive feedback to the intrinsic pathway and to factor VII, and activates factor {{c2::XIII}} to make cross-linked fibrin (clot stabilization)."
    src: { page: 71, quote: "Hemostasis: Coagulation & Clot Stabilization" }
    status: unverified
  # ---------- p71: factors ----------
  - id: hem.L05.008
    kind: table
    topic: factors
    title: The coagulation factors (p71)
    columns: [Factor, Descriptive name]
    rows:
      - [I, Fibrinogen]
      - [II, Prothrombin]
      - [III, Tissue factor]
      - [V, Labile factor]
      - [VII, Proconvertin]
      - [VIII, Antihemophilic globulin (AHG)]
      - [IX, Christmas factor]
      - [X, Stuart-Prower factor]
      - [XI, Plasma thromboplastin antecedent]
      - [XII, Hageman factor]
      - [XIII, Fibrin-stabilizing factor]
    blanks: [[3, 1], [4, 1], [5, 1], [6, 1], [7, 1], [9, 1], [10, 1]]
    src: { page: 71, quote: "The coagulation factors" }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.009
    kind: card
    topic: factors
    front: Which two contact proteins does the factor table list after XIII?
    back: Prekallikrein and HMWK (high-molecular-weight kininogen).
    src: { page: 71, quote: "Prekallikrein. HMWK." }
    status: unverified
  # ---------- p72: inhibitors ----------
  - id: hem.L05.010
    kind: enumerate
    topic: inhibitors
    prompt: Enumerate the natural coagulation factor inhibitors.
    points:
      - Tissue factor pathway inhibitor
      - Antithrombin III
      - Protein C and protein S
      - Thrombin–thrombomodulin complex (activates protein C)
    pass: 4
    src: { page: 72, quote: "Coagulation factor inhibitors 1. Tissue factor pathway inhibitors which is present in the plasma and platelet" }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.011
    kind: card
    topic: inhibitors
    front: What does tissue factor pathway inhibitor (TFPI) inhibit, and where is it found?
    back: Factors Xa and VIIa and tissue factor, limiting the main in vivo pathway; it is in plasma and platelets and accumulates at the injury site from local platelet activation.
    src: { page: 72, quote: "It inhibits factors Xa and VIIa and tissue factor to limit the main in vivo pathway." }
    status: unverified
  - id: hem.L05.012
    kind: card
    topic: inhibitors
    front: Which is the most potent natural anticoagulant, and what potentiates it?
    back: Antithrombin III; it inactivates serine proteases by combining with them, and heparin markedly potentiates it.
    src: { page: 72, quote: "Antithrombin III, most potent. It inactivate seriene proteases by combining with them. Heparin potentiates its action markedly." }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.013
    kind: order
    topic: inhibitors
    prompt: Order the protein C pathway.
    steps:
      - Thrombin binds thrombomodulin on the endothelium
      - The complex activates vitamin K-dependent protein C
      - Activated protein C, with protein S, inactivates factors V and VIII
      - Thrombin generation stops
    src: { page: 72, quote: "Thrombin binds to an endothelial surface receptor thrombomodulin. The resulting complex activate the vitamin K dependent serine protease C" }
    status: unverified
  - id: hem.L05.014
    kind: cloze
    topic: inhibitors
    text: "Activated protein C with the help of {{c1::protein S}} inactivates factors {{c2::V and VIII}}."
    src: { page: 72, quote: "with the help of PS they inactivate V and VIII preventing thrombin synthesis." }
    status: unverified
  # ---------- p72-73: fibrinolysis ----------
  - id: hem.L05.015
    kind: card
    topic: fibrinolysis
    front: What is plasminogen, and what converts it?
    back: A globulin proenzyme in blood and tissue fluid, converted to plasmin by activators from the vessel wall or tissue.
    src: { page: 72, quote: "Plasminogen is a globulin proenzyme in the blood and tissue fluid, is converted to the plasmin by activators." }
    status: unverified
  - id: hem.L05.016
    kind: card
    topic: fibrinolysis
    front: What is the most important route of plasminogen activation?
    back: Release of tissue plasminogen activator (tPA) from the endothelium; tPA is a serine protease that binds fibrin.
    src: { page: 72, quote: "The most important route follows the release of tPA (Tissue plasminogen activator) from endothelium." }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.017
    kind: card
    topic: fibrinolysis
    front: How does activated protein C affect fibrinolysis?
    back: It stimulates fibrinolysis by destroying tPA inhibitors.
    src: { page: 72, quote: "Activated protein C stimulates fibrinolysis by destroying tPA inhibitors." }
    status: unverified
  - id: hem.L05.018
    kind: enumerate
    topic: fibrinolysis
    prompt: What can plasmin digest?
    points: [Fibrinogen, Fibrin, Factor V, Factor VIII]
    pass: 4
    src: { page: 72, quote: "Plasmin in Capable of digesting fibrinogen, fibrin, factor V and VIII." }
    status: unverified
  - id: hem.L05.019
    kind: card
    topic: fibrinolysis
    front: Besides making fibrin, what else does thrombin do in the p73 figure?
    back: It also activates the fibrinolytic side, so plasmin breaks the fibrin polymer into fibrin fragments.
    src: { page: 73, quote: "Thrombin Fibrinogen Plasmin Fibrinolysis" }
    status: unverified
  # ---------- p73: screening tests ----------
  - id: hem.L05.020
    kind: table
    topic: screening
    title: Screening tests for coagulation disorders (p73)
    columns: [Test, Prolonged by, Disorders]
    rows:
      - [Thrombin time, "Thrombin inhibition by heparin; fibrinogen deficiency or abnormality", "DIC or heparin therapy"]
      - [PT, "Low VII, X, II, I", "Liver disease, warfarin, plus the conditions above"]
      - [APTT, "Low XII, XI, IX, VIII, X, V, II or fibrinogen", "Hemophilia, Christmas disease, plus the conditions above"]
    blanks: [[0, 2], [1, 1], [1, 2], [2, 2]]
    src: { page: 73, quote: "Screening tests used in the diagnosis of coagulation disorders" }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.021
    kind: mcq
    topic: screening
    stem: A 9-year-old boy bleeds for hours after a tooth extraction. PT normal, APTT prolonged, thrombin time normal, platelets 260,000/mm³. Which disorder fits the lecture's screening table?
    options:
      - Hemophilia (A or B)
      - Warfarin therapy
      - DIC
      - Heparin therapy
      - Liver disease
    answer: 0
    why:
      - "Correct: an isolated long APTT points to hemophilia or Christmas disease (p73)."
      - "Warfarin prolongs the PT first."
      - "DIC prolongs PT, APTT and TT with low platelets."
      - "Heparin prolongs the thrombin time."
      - "Liver disease prolongs the PT."
    src: { page: 73, quote: "Screening tests used in the diagnosis of coagulation disorders" }
    status: unverified
  - id: hem.L05.022
    kind: mcq
    topic: screening
    stem: An inpatient on an unfractionated heparin infusion has a prolonged APTT and a prolonged thrombin time. Fibrinogen is normal. What explains the long thrombin time?
    options:
      - Thrombin inhibited by heparin
      - Factor VII deficiency
      - Factor VIII deficiency
      - Vitamin K deficiency
      - Factor XIII deficiency
    answer: 0
    why:
      - "Correct: the thrombin time is prolonged by inhibition of thrombin by heparin (p73)."
      - "Factor VII deficiency prolongs the PT only."
      - "Factor VIII deficiency prolongs the APTT, not the TT."
      - "Vitamin K deficiency prolongs PT and APTT, not the TT."
      - "None of the screening tests in the table detect XIII deficiency."
    src: { page: 73, quote: "Screening tests used in the diagnosis of coagulation disorders" }
    status: unverified
  # ---------- p73-74: deficiencies ----------
  - id: hem.L05.023
    kind: enumerate
    topic: deficiencies
    prompt: Enumerate the most common congenital coagulation factor deficiencies.
    points: [Hemophilia A, Von Willebrand disease, Christmas disease (hemophilia B), Fibrinogen abnormalities]
    pass: 4
    src: { page: 73, quote: "the most common of them are. 1. Haemophilia A. 2. Von Willbroad disease. 3. Christmas disease. 4. Fibrinogen abnormalities" }
    status: unverified
  - id: hem.L05.024
    kind: enumerate
    topic: deficiencies
    prompt: Enumerate the acquired causes of coagulation factor deficiency.
    points: [Vitamin K deficiency, Liver disease, Consumption coagulopathy (DIC), Circulating inhibitors]
    pass: 4
    src: { page: 74, quote: "Acquired – due to: 1. Vitamin K deficiency 2. Liver disease 3. Consumption coagulopathy 4. Circulating inhibitors." }
    status: unverified
    tags: [high-yield]
  # ---------- p74-76: hemophilia ----------
  - id: hem.L05.025
    kind: card
    topic: hemophilia
    front: How is hemophilia A inherited?
    back: X-linked recessive; it affects males and is transmitted by females.
    src: { page: 74, quote: "Haemophilia A is inherited as X-linbed recessive disorder affecting males and transmitted by female." }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.026
    kind: card
    topic: hemophilia
    front: Where is the factor VIII gene?
    back: At the tip of the long arm of the X chromosome (the book prints "xq2.6").
    src: { page: 74, quote: "factor VIII gene which lies at the tip of the long arm of the x-chromosome (xq2.6 region)." }
    status: unverified
    update:
      text: "The F8 gene is at Xq28."
      ref: "NCBI Gene F8 (current human genome assembly)"
  - id: hem.L05.027
    kind: card
    topic: hemophilia
    front: Factor VIII activity and VWF in hemophilia A?
    back: Factor VIII clotting activity (FVIII:C) is low or absent; VWF and VWF antigen are normal.
    src: { page: 74, quote: "The plasma level of factor VIII clotting activity (F VIII C) is low or absent, VWF and VWF Ag normal." }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.028
    kind: table
    topic: hemophilia
    title: Hemophilia severity by factor VIII activity (p74)
    columns: [Bleeding, VIII activity]
    rows:
      - ["Severe bleeds after trivial trauma", "<1%"]
      - ["Moderate to severe post-traumatic bleeds", "1–5%"]
      - ["Mild tendency; excessive loss after surgery", "5–25%"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 74, quote: "VIII activity < 1% - sever bleeds after trival trauma. VIII activity 1-5% - moderate to sever post-traumatic bleeds." }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L05.029
    kind: enumerate
    topic: hemophilia
    prompt: Enumerate the common bleeding sites in hemophilia A.
    points: [Into synovial joints, Into muscle (especially severe cases), From gums and tooth sockets, Epistaxis]
    pass: 4
    src: { page: 74, quote: "Common bleeds: Into-synovial join. Into muscle (especially in sever cases) From gums and teeth sockets Epistaxis" }
    status: unverified
  - id: hem.L05.030
    kind: enumerate
    topic: hemophilia
    prompt: Enumerate the complications of hemophilia A.
    points:
      - Arthritis from repeated hemorrhages
      - Peripheral nerve compression and pseudotumor
      - FVIII antibodies (inhibitors)
      - Chronic liver disease (hepatitis B or C)
      - AIDS from contaminated FVIII in the early 1980s
    pass: 4
    src: { page: 75, quote: "Arthritis, secondary to repeated haemorrhages 2. Peripheral nerve compression and pseudotumour. 3. FVIII antibodies/inhibitors in 5-10% of patients." }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.031
    kind: cloze
    topic: hemophilia
    text: "FVIII antibodies (inhibitors) develop in {{c1::5–10%}} of hemophilia A patients."
    src: { page: 75, quote: "FVIII antibodies/inhibitors in 5-10% of patients." }
    status: unverified
    tags: [numbers]
  - id: hem.L05.032
    kind: card
    topic: hemophilia
    front: Why did many older hemophilia patients get chronic liver disease and AIDS?
    back: Previous exposure to hepatitis B or C, and retroviral contamination of FVIII concentrates in the early 1980s.
    src: { page: 75, quote: "Acquired immunodeficiency syndrome (AIDS) – due to retroviral contamination of FVIII in the early 1980s." }
    status: unverified
  - id: hem.L05.033
    kind: card
    topic: hemophilia
    front: When should factor VIII be given in hemophilia A?
    back: Prophylactically before any operation, and at the earliest sign of spontaneous or post-traumatic bleeding.
    src: { page: 75, quote: "It should be given prophylodically before any type of operation. 2. It should be given at the earlist sign of spontaneous or post-traumtic bleeding." }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.034
    kind: cloze
    topic: hemophilia
    text: "Treatment is IV factor VIII concentrate to keep plasma VIII activity between {{c1::5 and 100%}}, according to the {{c2::severity of injury or extent of surgery}}."
    src: { page: 76, quote: "Treatment consists of I.V injection of factor VIII in a concentrated form to maintain plasma factor VIII activity between 5 and 100%" }
    status: unverified
    tags: [numbers]
  - id: hem.L05.035
    kind: card
    topic: hemophilia
    front: How does desmopressin help in hemophilia A, and for whom?
    back: It releases FVIII from endothelial cells, raising the plasma level; it is an alternative in mild hemophiliacs.
    src: { page: 76, quote: "Desmopressin provides an alternative means of increasing the plasma factor VIII level in mild haemophilics." }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.036
    kind: card
    topic: hemophilia
    front: What is hemophilia B?
    back: Christmas disease, a quantitative or qualitative defect of factor IX; similar in every aspect to hemophilia A, including X-linked inheritance, but much less common.
    src: { page: 76, quote: "It results from a quantitative or qualitative defect in factor IX. 2. It is similar in every aspect to haemophilic A" }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.037
    kind: card
    topic: hemophilia
    front: How is bleeding treated in hemophilia B?
    back: Fresh frozen plasma or factor IX concentrate.
    src: { page: 76, quote: "Bleeding is treated by fresh frozen plasma or factor IX concentrate." }
    status: unverified
  - id: hem.L05.038
    kind: mcq
    topic: hemophilia
    stem: A 22-year-old man with known hemophilia A has FVIII activity of 12%. He needs a dental extraction. Which treatment does the lecture offer as an alternative to factor VIII concentrate?
    options:
      - Desmopressin
      - Vitamin K
      - Cryoprecipitate only, never factor VIII
      - Platelet transfusion
      - Heparin
    answer: 0
    why:
      - "Correct: in mild hemophilia (5–25%) desmopressin releases FVIII from endothelial cells (p76)."
      - "Vitamin K corrects II, VII, IX and X, not VIII."
      - "Cryoprecipitate is for urgent cases when concentrate is unavailable (lecture 6)."
      - "Platelets are normal in hemophilia."
      - "Heparin would worsen bleeding."
    src: { page: 76, quote: "Desmopressin provides an alternative means of increasing the plasma factor VIII level in mild haemophilics." }
    status: unverified
  - id: hem.L05.039
    kind: mcq
    topic: hemophilia
    stem: A 14-year-old boy has a hot swollen right knee after minor sport injury. His maternal uncle had the same problem. FVIII activity is 0.5%. Which statement about his disease is right?
    options:
      - It is severe; bleeds follow trivial trauma
      - His VWF antigen will be low
      - His father must be a carrier
      - Bleeding is treated with vitamin K
      - Joint bleeds are rare in hemophilia
    answer: 0
    why:
      - "Correct: VIII activity below 1% means severe bleeds after trivial trauma (p74)."
      - "VWF and VWF Ag are normal in hemophilia A (p74)."
      - "It is X-linked: transmitted by females (his mother), not his father."
      - "Treatment is factor VIII concentrate (p76)."
      - "Bleeding into synovial joints is the first of the common bleeds (p74)."
    src: { page: 74, quote: "VIII activity < 1% - sever bleeds after trival trauma." }
    status: unverified
  - id: hem.L05.040
    kind: mcq
    topic: hemophilia
    stem: A 30-year-old man with severe hemophilia A no longer responds to his usual factor VIII doses during a joint bleed. What is the most likely reason?
    options:
      - FVIII antibodies (inhibitors)
      - New vitamin K deficiency
      - Development of hemophilia B
      - Thrombocytopenia from desmopressin
      - Factor VIII gene moved to the short arm
    answer: 0
    why:
      - "Correct: FVIII inhibitors develop in 5–10% of patients (p75); lecture 6 lists rFVIIa for high inhibitor levels."
      - "Vitamin K deficiency does not cause FVIII resistance."
      - "Hemophilia B is a different inherited defect."
      - "Desmopressin is for mild disease and is not the issue."
      - "The gene does not move; this is nonsense."
    src: { page: 75, quote: "FVIII antibodies/inhibitors in 5-10% of patients." }
    status: unverified
  # ---------- p76-77: vitamin K ----------
  - id: hem.L05.041
    kind: card
    topic: vitamin-k
    front: Which factors make up the prothrombin complex, and where are they made?
    back: Factors II, VII, IX and X, made in the liver; vitamin K is needed for their synthesis.
    src: { page: 76, quote: "The prothrombin complex or group which consist of factors II, VII, IX, X which are produced in the liver." }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.042
    kind: card
    topic: vitamin-k
    front: What does vitamin K actually do to factors II, VII, IX and X?
    back: A vitamin K-dependent carboxylase adds carboxyl (-COOH) groups to the proteins in the final step of synthesis; these are needed for efficient function.
    src: { page: 76, quote: "involve a vitamin K-dependent carboxylase, which adden carboxyl (-COOH) group to the proteins" }
    status: unverified
  - id: hem.L05.043
    kind: enumerate
    topic: vitamin-k
    prompt: Enumerate the causes of vitamin K deficiency.
    points:
      - Impaired absorption (biliary obstruction, pancreatic disease, other steatorrhea)
      - Oral anticoagulants
      - Prolonged broad-spectrum antibiotics with low intake in severely ill patients
      - Hemorrhagic disease of the newborn
    pass: 4
    src: { page: 77, quote: "Secondary to oral anticoagulants 3- Prolonged treatment with broad spectrum antibiotics in association with low dietary intake in severly ill patients." }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.044
    kind: card
    topic: vitamin-k
    front: Where do we get vitamin K from?
    back: Green vegetables and bacterial synthesis in the gut.
    src: { page: 77, quote: "N.B vit K is obtained form green vegetables and bacterial synthesis in the gut" }
    status: unverified
  - id: hem.L05.045
    kind: card
    topic: vitamin-k
    front: Why do broad-spectrum antibiotics cause vitamin K deficiency in very ill patients?
    back: They remove the gut bacteria that synthesize vitamin K, while the patient eats little green vegetables (low dietary intake).
    src: { page: 77, quote: "Prolonged treatment with broad spectrum antibiotics in association with low dietary intake in severly ill patients." }
    status: unverified
  - id: hem.L05.046
    kind: card
    topic: vitamin-k
    front: Clinical features and lab findings of vitamin K deficiency?
    back: Bruises, ecchymoses and mucous membrane bleeding; PT and APTT both increased.
    src: { page: 77, quote: "Bruises, echymoses and mucous membrane bleeding. Lab findings PT increased APTT increased" }
    status: unverified
  - id: hem.L05.047
    kind: cloze
    topic: vitamin-k
    text: "Vitamin K deficiency is treated with vitamin K ({{c1::10–20 mg}} in adults) and {{c2::fresh frozen plasma}}."
    src: { page: 77, quote: "Vitamin K (10-20 mg in adults/6h). Fresh frozen plasma." }
    status: unverified
    tags: [numbers]
  # ---------- p77-78: liver disease ----------
  - id: hem.L05.048
    kind: enumerate
    topic: vitamin-k
    prompt: Enumerate the mechanisms of the bleeding tendency in liver disease.
    points:
      - Impaired synthesis of vitamin K-dependent factors (II, VII, IX, X)
      - Impaired synthesis of factor V and fibrinogen
      - Thrombocytopenia (folate depletion, alcohol, hypersplenism)
      - Fibrinolysis
    pass: 4
    src: { page: 77, quote: "Impaired synthesis of factors V and fibrinogen. 3. Thrombocytopenia-due to folate depletion, alcoholism and/or hypersplenism. 4. Fibrinolysis." }
    status: unverified
    tags: [high-yield]
  - id: hem.L05.049
    kind: card
    topic: vitamin-k
    front: Which factor deficiency separates liver disease from simple vitamin K deficiency?
    back: "Factor V (and fibrinogen): the liver makes them, but they do not need vitamin K; liver disease has these additional clotting defects."
    src: { page: 77, quote: "Diagnosis As for vitamin K deficiency but with additional clotting defects." }
    status: unverified
  - id: hem.L05.050
    kind: card
    topic: vitamin-k
    front: "Bleeding in liver disease: how severe, and how is it treated?"
    back: Usually mild, though severe bleeds may occur from varices; treat the primary cause, vitamin K (may be relatively ineffective alone) and fresh frozen plasma.
    src: { page: 78, quote: "Vitamin K (which alone may be relatively ineffective) fresh frozen plasma." }
    status: unverified
  - id: hem.L05.051
    kind: mcq
    topic: vitamin-k
    stem: A 45-year-old woman has painless jaundice from a pancreatic head mass and pale stools. INR 2.4. Which treatment best corrects her coagulopathy?
    options:
      - Parenteral vitamin K
      - Desmopressin
      - Platelet transfusion
      - Factor VIII concentrate
      - Heparin
    answer: 0
    why:
      - "Correct: biliary obstruction impairs vitamin K absorption; vitamin K (and FFP if bleeding) treats it (p76–77)."
      - "Desmopressin raises FVIII, which is not the problem."
      - "There is no thrombocytopenia here."
      - "FVIII is not vitamin K-dependent."
      - "Heparin would worsen bleeding."
    src: { page: 76, quote: "Impaired absorption due to: a. Biliary obstruction. b. Pancreatic disease. c. Steatorahea of other causes." }
    status: unverified
  - id: hem.L05.052
    kind: mcq
    topic: vitamin-k
    stem: A man with decompensated cirrhosis has a prolonged PT that does not correct after 3 days of vitamin K. Factor V is low. Why?
    options:
      - The liver cannot make the factors, so vitamin K alone may be ineffective
      - He has hemophilia B
      - Vitamin K was given in too high a dose
      - He has an isolated factor VIII inhibitor
      - Factor V is vitamin K-dependent
    answer: 0
    why:
      - "Correct: in liver disease synthesis itself fails; vitamin K alone may be relatively ineffective (p78), and V and fibrinogen are low too (p77)."
      - "Hemophilia B is inherited and prolongs only the APTT."
      - "A higher dose would not fix failed synthesis."
