      - kind: figure
        page: 68
        quote: "\"Harvard\" style for writing references\nAt the end of the paper (in the reference list), the order is strictly alphabetical, regardless of the chronology.\nIn the text of the paper, references are cited by giving in parentheses ( ) the name of the author and the year of publication. When the author's name is part of a sentence, only the year is put in parentheses.\nWhen several references are given together, they should be listed in chronological order and separated by a semicolon ;\n\"Harvard\" In-Text (Author and date)\n\"Harvard\" In-list (Alphabetical)"
