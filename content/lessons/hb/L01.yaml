  - id: hb.L01.lesson4
    title: "إزاي تتأكد إنه cirrhosis؟"
    hook: "من تحليل دم بسيط لحد الـ biopsy: أدوات التشخيص، وليه الـ FibroScan ساعات بيكدب."
    minutes: 9
    pages: [9, 13]
    topics: [diagnosis, labs]
    goals:
      - "تفرّق بين أدوات التشخيص الـ non-invasive والـ biopsy (الـ gold standard)"
      - "تعرف إمتى الـ FibroScan بيدّي رقم أعلى من الحقيقة"
      - "تربط كل سبب بالتحليل اللي بيكشفه"
    status: unverified
    steps:
      - kind: explain
        page: 9
        title: "الفكرة"
        text: |
          الـ diagnosis بيعتمد على إنك تثبت **widespread nodules in the liver combined with fibrosis**. نفس كلمتين التعريف.

          الأدوات خانتين: حاجات **non-invasive** آمنة تتكرر (blood scores، **TE**، imaging)، و **liver biopsy** اللي هي **gold standard** بس **invasive**.
      - kind: figure
        page: 10
        title: "خانتين: من غير إبرة، وبإبرة"
        alt: "Two groups. Non-invasive: blood scores (APRI, FIB-4), transient elastography (FibroScan, the most widely validated tool for advanced fibrosis and cirrhosis), and imaging (US, CT, MRI, MRCP). Invasive: liver biopsy, the gold standard, which also shows etiology and activity."
        caption: "التلاتة اللي فوق كلهم **non-invasive**، ومن غير ترتيب بينهم: الـ **TE** هو أكتر واحد متجرّب للـ advanced fibrosis، والـ imaging بيشوف شكل الكبد ومضاعفاته. الـ **biopsy** لوحده **invasive** وهو الـ **gold standard**."
