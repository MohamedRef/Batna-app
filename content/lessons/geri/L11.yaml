            options: ["Moderate", "Severe", "Mild, no antibiotic", "Not an exacerbation"]
            answer: 0
            why: "2 من 3 من غير respiratory failure = moderate."
          - question: "Does he have risk factors?"
            options: ["Yes: age over 65 and antibiotics within 3 months", "No", "Only if FEV1 is under 30%", "Only if he smokes"]
            answer: 0
            why: "السن فوق 65 و antibiotic في آخر 3 شهور، الاتنين risk factors."
          - question: "Which antibiotic?"
            options: ["Piperacillin-tazobactam or a fluoroquinolone, with sputum culture", "Doxycycline", "Azithromycin", "No antibiotic"]
            answer: 0
            why: "Moderate + risk factors = antipseudomonal، واطلب sputum culture."
      - kind: aside
        tone: exam
        page: 204
        quote: "The preferred bronchodilator is a short-acting inhaled â2-agonist (SABA) with or without a short acting anticholinergic.(SAMA)."
        text: "كل exacerbation محتاجة تصعيد الـ bronchodilator، وممكن يكفي لوحده في الـ mild. المفضّل SABA مع أو من غير SAMA، والـ nebulizer ممكن يبقى أحسن وأريح من الـ MDI."
      - kind: figure
        page: 205
        quote: "Please note 90% saturation vs 60 mmHg PaO2."
        title: "الـ dissociation curve"
        alt: "Oxygen dissociation curve: saturation on the y-axis, PaO2 on the x-axis. The curve is steep below 60 mmHg and flat above it. A marked point at PaO2 60 and saturation 90 percent sits at the knee. A shaded band shows the target 88 to 92 percent. A note on the flat part: PaO2 can fall from 140 to 65 with little change in saturation."
