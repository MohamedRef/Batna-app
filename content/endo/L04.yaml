  # ---------- MCQs ----------
  - id: endo.L04.185
    kind: mcq
    topic: cv-hormones
    stem: Which natriuretic peptide is secreted by the endothelium rather than the heart?
    options: [C-type natriuretic peptide, Atrial natriuretic peptide, Brain natriuretic peptide, Adrenomedullin]
    answer: 0
    why:
      - "Correct: CNP comes from the endothelium."
      - ANP comes from the heart.
      - BNP comes from the heart.
      - Adrenomedullin is not a natriuretic peptide.
    src: { page: 43, quote: "C-type natriuretic Secreted by endothelium" }
    status: unverified
  - id: endo.L04.186
    kind: mcq
    topic: cv-hormones
    stem: Which cardiovascular hormone is a potent hypertensive agent acting directly on vascular smooth muscle?
    options: [Endothelin, Adrenomedullin, Nitric oxide, C-type natriuretic peptide]
    answer: 0
    why:
      - "Correct: endothelins act directly on VSMCs to raise pressure."
      - Adrenomedullin is linked to hypotension.
      - NO is a vasodilator.
      - Natriuretic peptides lower pressure.
    src: { page: 44, quote: "The ETs are potent hypertensive agents that exert their effects directly on the VSMCs" }
    status: unverified
  - id: endo.L04.187
    kind: mcq
    topic: cv-hormones
    stem: The hypotension of septic shock may be partly due to which peptide made by adrenal chromaffin cells?
    options: [Adrenomedullin, Endothelin-1, Neuropeptide Y, Angiotensin II]
    answer: 0
    why:
      - "Correct: AM may cause the hypotension of inflammation and septic shock."
      - Endothelin raises pressure.
      - NPY is a vasoconstrictor.
      - Angiotensin II is a vasoconstrictor.
    src: { page: 44, quote: "AM may be responsible for the hypotension of inflammation, septic shock, and atherosclerosis." }
    status: unverified
  - id: endo.L04.188
    kind: mcq
    topic: oestrogen
    stem: Which oestrogen effect works against its cardiovascular protection?
    options: [Promotes blood clot formation, Raises HDL, Lowers LDL, Calcium-channel blocking effect]
    answer: 0
    why:
      - "Correct: oestrogen increases coagulability."
      - Raising HDL is protective.
      - Lowering LDL is protective.
      - Calcium-channel blockade is listed as protective.
    src: { page: 44, quote: "It causes some changes that have the opposite effect: Promotes blood clot formation." }
    status: unverified
  - id: endo.L04.189
    kind: mcq
    topic: heart-failure
    stem: In heart failure, which hormone level is used as an index of global sympathetic outflow and predicts prognosis?
    options: [Venous plasma noradrenaline, Plasma renin, Serum aldosterone, Neuropeptide Y]
    answer: 0
    why:
      - "Correct: very high venous noradrenaline means a worse prognosis."
      - Renin is high in renal venous blood but is not the stated prognostic index.
      - Aldosterone is activated but not the stated index.
      - NPY correlates with noradrenaline but is not the index.
    src: { page: 45, quote: "Plasma noradrenaline levels, which are often taken as an index of \"global sympathetic outflow\" have been shown to predict prognosis." }
    status: unverified
