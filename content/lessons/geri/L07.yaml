        page: 114
        quote: "Falls Risk Assessment Tool (FRAT)\nPART 1: FALL RISK STATUS\n| Risk factor | Level | Risk score |\n|---|---|---|\n| Recent falls (to score this, complete history of falls, overleaf) | none in last 12 months | 2 |\n| | one or more between 3 and 12 months ago | 4 |\n| | one or more in last 3 months | 6 |\n| | one or more in last 3 months whilst inpatient / resident | 8 |\n| Medications (Sedatives, Anti-Depressants, Anti-Parkinson's, Diuretics, Anti-hypertensives, hypnotics) | not taking any of these | 1 |\n| | taking one | 2 |\n| | taking two | 3 |\n| | taking more than two | 4 |\n| Psychological (Anxiety, Depression, ↓Cooperation, ↓Insight or ↓Judgement esp. re mobility) | does not appear to have any of these | 1 |\n| | appears mildly affected by one or more | 2 |\n| | appears moderately affected by one or more | 3 |\n| | appears severely affected by one or more | 4 |\n| Cognitive status (AMTS: Hodkinson Abbreviated Mental Test Score) | AMTS 9 or 10 / 10 OR intact | 1 |\n| | AMTS 7-8 mildly impaired | 2 |\n| | AMTS 5-6 mod impaired | 3 |\n| | AMTS 4 or less severely impaired | 4 |\n(Low Risk: 5-11 Medium: Risk: 12-15 High Risk: 16-20) RISK SCORE /20\nAutomatic High Risk Status: (if ticked then circle HIGH risk below)\nRecent change in functional status and / or medications affecting safe mobility (or anticipated)\nDizziness / postural hypotension\nFALL RISK STATUS: (Circle): LOW / MEDIUM / HIGH. IMPORTANT: IF HIGH, COMMENCE FALL ALERT\nPART 2: RISK FACTOR CHECKLIST\n| Risk factor | Check (Y/N) |\n|---|---|\n| Vision | Reports / observed difficulty seeing - objects / signs / finding way around |\n| Mobility | Mobility status unknown or appears unsafe / impulsive / forgets gait aid |\n| Transfers | Transfer status unknown or appears unsafe ie. over-reaches, impulsive |\n| Behaviours | Observed or reported agitation, confusion, disorientation; Difficulty following instructions or non-compliant (observed or known) |\n| Activities of Daily Living (A.D.L's) | Observed risk-taking behaviours, or reported from referrer / previous facility; Observed unsafe use of equipment; Unsafe footwear / inappropriate clothing |\n| Environment | Difficulties with orientation to environment i.e. areas between bed / bathroom / dining room |\n| Nutrition | Underweight / low appetite |\n| Continence | Reported or known urgency / nocturia / accidents |\n| Other | |"
