schema: batna.lesson/v1
lecture: res.L20
lessons:
- id: res.L20.lesson1
  title: 'التقييم النقدي: تقرا البحث بعين المفتّش'
  hook: كل يوم بيطلع بحث بيقول «الدوا ده معجزة». إزاي تعرف تصدّق ولا لأ في 10 دقايق؟
  minutes: 8
  pages:
  - 2
  - 11
  topics:
  - appraisal
  - structure
  goals:
  - تعرّف الـ critical appraisal وأهم مكوّنين فيه
  - تطابق نوع السؤال بالتصميم المناسب
  - تقسّم المقال بالـ article dissector وتعرف الـ identifiers
  status: unverified
  steps:
  - kind: explain
    page: 2
    quote: A systematic process used to identify the strengths and weaknesses of a research article in order to assess the usefulness (clinical impact), applicability and validity of research findings.
    title: يعني إيه critical appraisal؟
    text: |-
      ==Critical appraisal== = عملية **systematic** (بخطوات ثابتة، مش بالمزاج) بتطلّع بيها **نقاط القوة والضعف** في البحث.

      الهدف إنك تحكم على 3 حاجات في النتايج:
      - **Usefulness**: ليها **clinical impact**؟ هتفرق مع العيان؟
      - **Applicability**: تنفع تتطبق عندك؟
      - **Validity**: صح أصلًا ولا فيها لعبة؟
  - kind: explain
    page: 2
    quote: |-
      The most important components of a critical appraisal are:
      The appropriateness of the study design for the research question
      Careful assessment of the key methodological features of this design.
    title: أهم سؤالين
    text: |-
      أهم مكوّنين في أي appraisal:

      - **التصميم مناسب للسؤال؟** (the appropriateness of the ==study design== for the research question)
      - **التصميم اتنفّذ صح؟** (careful assessment of the key ==methodological features==)

      يعني بحث بـ RCT ممتاز بس على سؤال عن prevalence؟ غلط من الأساس.
  - kind: aside
    tone: analogy
    text: 'زي ما بتفحص عربية مستعملة: الأول تشوف هي أصلًا العربية اللي محتاجها (عيلة ولا نقل؟) = التصميم مناسب للسؤال. وبعدين تفتح الموتور = الـ methodological features.'
  - kind: table
    page: 3
    quote: |-
      Question type & study design
      | Question | Study Design |
      |---|---|
      | Prevalence | Cross-sectional study |
      | Diagnosis | Comparison w gold standard |
      | Etiology & risk factors | Cohort or case-control |
      | Incidence & prognosis | Cohort study |
      | Intervention | RCT |
      In each case, SR of all available studies better than individual study
    title: كل سؤال وله تصميم
    columns:
    - Question
    - Study design
    rows:
    - - Prevalence
      - Cross-sectional study
    - - Diagnosis
      - Comparison w gold standard
    - - Etiology & risk factors
      - Cohort or case-control
    - - Incidence & prognosis
      - Cohort study
    - - Intervention
      - RCT
    hide:
    - - 0
      - 1
    - - 3
      - 1
    - - 4
      - 1
  - kind: aside
    tone: exam
    text: 'وفي كل الحالات دي: **SR of all available studies** (systematic review لكل الدراسات المتاحة) أحسن من أي **individual study** لوحدها.'
    page: 3
    quote: In each case, SR of all available studies better than individual study
  - kind: check
    page: 4
    quote: |-
      Which is the best epidemiological design to study the accuracy of a diagnostic test?
      A. Cross-sectional study
      B. Case-control study
      C. Cohort study
      D. Cross sectional comparison with gold standard test
    question: Which is the best epidemiological design to study the accuracy of a diagnostic test?
    options:
    - Cross sectional comparison with gold standard test
    - Case-control study
    - Cohort study
    - Cross-sectional study alone
    answer: 0
    why:
    - 'صح: سؤال diagnosis = مقارنة بالـ gold standard.'
    - الـ case-control للـ etiology.
    - الـ cohort للـ incidence والـ prognosis.
    - من غير gold standard مفيش حاجة تقيس عليها دقة الاختبار.
  - kind: figure
    page: 6
    quote: |-
      Introduction: Article identifiers; Study type, PICO, objective; Review of literature; Methods: study design
      Discussion: Results; Important statistics
      Conclusion: Relevance; Pertinent (+)s and (–)s; Future research
      The article dissector. This algorithm serves as the basic approach to dissecting an article. The article is divided into three main parts: the introduction, discussion, and conclusion.
    title: الـ article dissector
    alt: 'Three brackets on the left labelled Introduction, Discussion and Conclusion. Introduction groups four boxes: article identifiers; study type, PICO, objective; review of literature; methods: study
      design. Discussion groups results and important statistics. Conclusion groups relevance, pertinent pluses and minuses, and future research. Arrows run down through all nine boxes.'
    caption: 'المقال بيتشرّح لـ **3 أجزاء**: مقدمة (4 عناصر)، مناقشة (النتايج والإحصاء)، وخاتمة (الأهمية، الإيجابيات والسلبيات، والبحث الجاي).'
    svg: |
      <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
        <defs><marker id="L20a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
        <rect x="8" y="8" width="96" height="134" rx="8" class="fg-acc"/><text x="56" y="80" text-anchor="middle" class="t-sm t-b">Introduction</text>
        <rect x="8" y="152" width="96" height="62" rx="8" class="fg-good"/><text x="56" y="188" text-anchor="middle" class="t-sm t-b">Discussion</text>
        <rect x="8" y="224" width="96" height="98" rx="8" class="fg-bad"/><text x="56" y="278" text-anchor="middle" class="t-sm t-b">Conclusion</text>
        <g class="t-sm">
        <rect x="120" y="10" width="200" height="26" rx="6" class="fg-box"/><text x="220" y="28" text-anchor="middle">Article identifiers</text>
        <rect x="120" y="44" width="200" height="26" rx="6" class="fg-box"/><text x="220" y="62" text-anchor="middle">Study type, PICO, objective</text>
        <rect x="120" y="78" width="200" height="26" rx="6" class="fg-box"/><text x="220" y="96" text-anchor="middle">Review of literature</text>
        <rect x="120" y="112" width="200" height="26" rx="6" class="fg-box"/><text x="220" y="130" text-anchor="middle">Methods: study design</text>
        <rect x="120" y="154" width="200" height="26" rx="6" class="fg-box"/><text x="220" y="172" text-anchor="middle">Results</text>
        <rect x="120" y="188" width="200" height="26" rx="6" class="fg-box"/><text x="220" y="206" text-anchor="middle">Important statistics</text>
        <rect x="120" y="226" width="200" height="26" rx="6" class="fg-box"/><text x="220" y="244" text-anchor="middle">Relevance</text>
        <rect x="120" y="260" width="200" height="26" rx="6" class="fg-box"/><text x="220" y="278" text-anchor="middle">Pertinent (+)s and (−)s</text>
        <rect x="120" y="294" width="200" height="26" rx="6" class="fg-box"/><text x="220" y="312" text-anchor="middle">Future research</text>
        </g>
