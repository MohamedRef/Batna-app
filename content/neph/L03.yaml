  # ---------- p78-79: diuretic resistance ----------
  - id: neph.L03.083
    kind: enumerate
    topic: resistance
    prompt: Proposed causes of diuretic resistance in CRS?
    points:
      - Rebound sodium reabsorption as the diuretic wears off
      - Excess sodium intake
      - Remodelling of thiazide and mineralocorticoid receptors (more distal Na reabsorption)
      - Reduced tubular secretion (organic acids compete for the transporter)
      - Reduced protein binding (hypoalbuminemia, metabolic acidosis)
    pass: 4
    hook: "المدرّ مش جايب نتيجة لأن: «الكلية بترجّع، الملح داخل، الآخر اتعلّم، الباب زحمة، والبروتين مش شايل» = rebound Na reabsorption لما المفعول يخلص، Na intake زيادة، remodelling لـ thiazide وmineralocorticoid receptors (distal reabsorption أكتر)، tubular secretion أقل (organic acids بتزاحم على الـ transporter)، وprotein binding أقل (hypoalbuminemia، metabolic acidosis)."
    src: { page: 78, quote: "There are many proposed causes of diuretic resistance including; rebound sodium reabsorption as the diuretic effects wears off, excess sodium intake." }
    status: unverified
    tags: [high-yield]
  - id: neph.L03.084
    kind: card
    topic: resistance
    front: Why is tubular secretion of loop diuretics reduced in renal impairment?
    back: Elevated endogenous organic acids competitively inhibit the transporter that secretes them.
    src: { page: 79, quote: "Reduced tubular secretion of loop diuretics due to competitive inhibition of the transporter by elevated levels of endogenous organic acids in renal impairment." }
    status: unverified
  - id: neph.L03.085
    kind: card
    topic: resistance
    front: Two causes of reduced protein binding of loop diuretics?
    back: Hypoalbuminemia and metabolic acidosis.
    src: { page: 79, quote: "Reduced protein binding of loop diuretics due to hypoalbuminemia and metabolic acidosis." }
    status: unverified
  - id: neph.L03.086
    kind: card
    topic: resistance
    front: How may small-volume hypertonic saline help in CRS?
    back: It may improve diuretic responsiveness and renal function, possibly by damping neurohormonal activation.
    src: { page: 79, quote: "Small-volume hypertonic saline may also improve diuretic responsiveness and renal function in patients with CRS, potentially by amelioration of neurohormonal activation.12" }
    status: unverified
  - id: neph.L03.087
    kind: card
    topic: resistance
    front: "Dopamine in AKI: what does it do and what is the evidence?"
    back: It has cardiac inotropic and direct kidney effects that can enhance diuresis in some patients, but it has not improved clinical or renal outcomes in AKI.
    src: { page: 79, quote: "Dopamine has cardiac inotropic and direct kidney effects that can enhance kidney function and diuresis in some patients, but dopamine has not improved clinical or renal outcomes in patients with AKI." }
    status: unverified
    tags: [high-yield]
  - id: neph.L03.088
    kind: card
    topic: resistance
    front: Which CRS patients benefit from inotropes, and why avoid them empirically?
    back: Those with hypotension or objective evidence of reduced cardiac output. Empirical use is avoided because of potential toxicity.
    src: { page: 79, quote: "Inotropic therapy is most likely to be effective in patients with CRS with hypotension or objective evidence of reduced cardiac output, and empirical use of inotropes should be avoided due to their potential toxicity." }
    status: unverified
  - id: neph.L03.089
    kind: mcq
    topic: resistance
    stem: A 66-year-old man with ADHF, albumin 2.2 g/dL, bicarbonate 16 mmol/L and creatinine 3.1 mg/dL responds poorly to high-dose IV furosemide. Which pair of mechanisms best explains his resistance?
    options:
      - Less protein binding (low albumin, acidosis) and less tubular secretion
      - Ototoxicity and hypersensitivity reactions to high-dose furosemide
      - Excess potassium intake with hypermagnesemia blunting the loop effect
      - Dopamine deficiency reducing renal blood flow and natriuresis
    answer: 0
    why:
      - "Correct: hypoalbuminemia and metabolic acidosis cut protein binding, and organic acids of renal impairment block tubular secretion (p79)."
      - These are nonrenal adverse effects of diuretics, not resistance mechanisms.
      - Excess sodium, not potassium, intake causes resistance; hypomagnesemia is a diuretic side effect.
      - Dopamine is a possible treatment, not a cause, and has not improved outcomes in AKI.
    src: { page: 79, quote: "Reduced protein binding of loop diuretics due to hypoalbuminemia and metabolic acidosis." }
    status: unverified
  - id: neph.L03.090
    kind: card
    topic: resistance
