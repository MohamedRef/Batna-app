      - "تعرف علاج الـ GCA الفوري"
    status: unverified
    steps:
      - kind: explain
        page: 152
        title: "Polymyalgia rheumatica"
        quote: "The main symptom is musclestiffness in the morning that lasts longer than 45 minutes."
        text: |
          Pain و stiffness و inflammation في عضلات **الكتفين والرقبة والوراك**.

          - العَرَض الأساسي: ==morning stiffness أكتر من 45 دقيقة==.
          - كمان: سخونية وعرق، fatigue، anorexia، weight loss، depression.
          - السبب مش معروف (genetic + environmental).
      - kind: aside
        tone: exam
        page: 152
        quote: "Most people who are diagnosed with the condition are over 70. It‘s extremely rare in people younger than 50."
        text: "أغلبهم **فوق 70**، و ==نادر جدًا تحت 50==، وفي الستات أكتر. يعني شاب عنده 35 بتيبس كتاف؟ دوّر على حاجة تانية."
      - kind: explain
        page: 153
        title: "التشخيص والعلاج"
        quote: "Prednisone 10 to15 mg/day can relief pain and stiffness. If symptoms improve patient can take the drug for one year."
        text: |
          **مفيش test specific**. اطلب: **ESR و CRP**، RF و anti-CCP، thyroid، kidney و liver functions (علشان تستبعد).

          العلاج: ==prednisone 10–15 mg/day==، ولو تحسّن ياخده **سنة**.
