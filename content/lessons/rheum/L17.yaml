        title: "المفاصل"
        quote: "Joints involved are\n  The axial skeleton (SIJs, intervertebral disc spaces,the apophyseal and costovertebral joints).\n  Shoulder girdle (glenohumeral, acromioclavicular, and sternoclavicular joints).\n  Costosternal junctions.\n  Manubriosternal joint.\n  Symphysis pubis.\n  Temporomandibular joint.\n  Large proximal synovial joints, (hips, knees, shoulders).\n  Small peripheral joints are infrequently involved."
        text: |
          - **Axial**: الـ sacroiliac joints (SIJs)، الـ disc spaces، الـ apophyseal، الـ costovertebral
          - **Shoulder girdle**: glenohumeral، acromioclavicular، sternoclavicular
