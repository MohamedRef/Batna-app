  - id: hem.L08.lesson1
    title: "كروموزوم قصير عمل مشكلة كبيرة: الـ Philadelphia"
    hook: "حتة من كروموزوم 9 راحت لـ 22، فطلع enzyme ما بيبطلش يشتغل."
    minutes: 8
    pages: [116, 117]
    topics: [cml-definition, bcr-abl]
    goals:
      - "تعرّف الـ CML وتحفظ أرقامها"
      - "تشرح الـ Ph1 والـ BCR/ABL والـ P210"
      - "تعرف دور الـ PP2A في الـ blast crisis وليه ممكن يبقى علاج"
    status: unverified
    steps:
      - kind: explain
        page: 116
        title: "مصنع neutrophils من غير فرامل"
        quote: "It is an acquired malignant disease characterized by over production of cells of the granulocytic series, especially the neutrophilic series, leading to marked splenomegaly and very high white blood cell counts. Basophilia and thrombocytosis are common. A characteristic cytogenetic abnormality, the Philadelphia (Ph1) chromosome, is present in the bone marrow cells in more than 95% of cases. The Ph1 chromosome occurs in erythroid, myeloid, monocytes, rarely T lypmphocytes cells, but not in marrow fibroblasts. This distribution places the abnormality in CML close to the plaripotent stem cells."
        text: |
          الـ **chronic myeloid leukaemia (CML)** مرض خبيث **acquired** فيه ==overproduction== للـ **granulocytic series**، خصوصًا الـ neutrophils.

          النتيجة:
          - **Marked splenomegaly**
          - **White blood cell (WBC) عالي جدًا**
          - **Basophilia** و **thrombocytosis** شائعين

          ليه الطحال بيكبر كده؟ التفسير المقبول (مش في الكتاب): الطحال بيفلتر الدم، فلما الدم يبقى مليان granulocytes بالآلاف بتتحجز فيه، وكمان بيرجع يعمل دم زي ما كان بيعمل في الجنين (extramedullary haematopoiesis). فالحجم بيكبر مع حجم المرض.

          والسبب؟ غالبًا **مفيش سبب** معروف. الوحيد اللي الكتاب بيذكره: ==ionizing radiation== (اللي نجيوا من القنبلة الذرية سنة 1945).
      - kind: table
        page: 116
        quote: "CML is diagnosed in 1 or 2 persons per 100,000 per year with slight male preponderance. The median age at diagnosis is approximately 45 to 50 years. The Ph1 chromosome results from a balanced translocation of material between the long arms of chromosomes 9 and 22. As more chromosomal material is lost from chromosome 22 than is gained from chromosome 9. the Ph1 chromosome is a shortened long arm of chromosome 22. The break, which occurs at band q34 of"
        title: "أرقام الـ CML"
        columns: [Fact, Number]
        rows:
          - ["Incidence", "1–2 per 100,000 per year"]
          - ["Sex", "Slight male preponderance"]
          - ["Median age", "45–50 years"]
          - ["Ph1 present", ">95%"]
          - ["After atomic bomb", "Peak 5–12 years, dose related"]
        hide: [[0, 1], [2, 1], [3, 1]]
      - kind: figure
        page: 116
        quote: "CML is diagnosed in 1 or 2 persons per 100,000 per year with slight male preponderance. The median age at diagnosis is approximately 45 to 50 years. The Ph1 chromosome results from a balanced translocation of material between the long arms of chromosomes 9 and 22. As more chromosomal material is lost from chromosome 22 than is gained from chromosome 9. the Ph1 chromosome is a shortened long arm of chromosome 22. The break, which occurs at band q34 of"
        title: "9 و22 بيبدّلوا"
        alt: "Chromosomes 9 and 22 drawn side by side before and after the translocation. The ABL segment from 9q34 moves onto chromosome 22 next to BCR, forming a short chromosome 22 labelled Ph1 that carries the BCR-ABL fusion gene, which makes the P210 tyrosine kinase."
        caption: "الـ **abelson tyrosine kinase (ABL)** من 9q34 بيروح جنب الـ **breakpoint cluster region (BCR)** على 22، و22 بيطلع ==أقصر==: ده الـ Ph1."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L08a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head-acc"/></marker></defs>
            <text x="85" y="18" text-anchor="middle" class="t-sm t-b">Before</text>
            <text x="245" y="18" text-anchor="middle" class="t-sm t-b">After</text>
            <rect x="45" y="30" width="26" height="150" rx="12" class="fg-box"/>
            <rect x="45" y="150" width="26" height="30" rx="8" class="fg-acc"/>
            <text x="58" y="198" text-anchor="middle" class="t-sm">9</text>
            <text x="20" y="170" text-anchor="middle" class="t-sm t-acc t-b">ABL</text>
            <rect x="100" y="70" width="26" height="110" rx="12" class="fg-box"/>
            <rect x="100" y="120" width="26" height="14" class="fg-bad"/>
            <text x="113" y="198" text-anchor="middle" class="t-sm">22</text>
            <text x="150" y="131" text-anchor="middle" class="t-sm t-bad t-b">BCR</text>
            <path d="M165 105 L190 105" class="fg-arrow-acc" marker-end="url(#L08a)"/>
            <rect x="205" y="30" width="26" height="150" rx="12" class="fg-box"/>
            <rect x="205" y="150" width="26" height="30" rx="8" class="fg-thin"/>
            <text x="218" y="198" text-anchor="middle" class="t-sm">9q+</text>
            <rect x="265" y="100" width="26" height="62" rx="12" class="fg-box"/>
            <rect x="265" y="120" width="26" height="14" class="fg-bad"/>
            <rect x="265" y="134" width="26" height="28" rx="6" class="fg-acc"/>
            <text x="278" y="180" text-anchor="middle" class="t-sm t-b">Ph1</text>
            <rect x="60" y="225" width="210" height="34" rx="10" class="fg-acc"/>
            <text x="165" y="247" text-anchor="middle" class="t-sm t-b">BCR-ABL → P210 tyrosine kinase</text>
            <text x="165" y="285" text-anchor="middle" class="t-sm t-mut">kinase always ON → proliferation</text>
          </svg>
      - kind: explain
        page: 117
        title: "الجين الهجين"
        quote: "the long arm of chromosome 9, allows translocation of the cellular oncogene C- AB1 to a position on chromosome 22 called the breakpoint cluster region (bcr)."
        text: |
          - الكسر في **9q34** بينقل الـ oncogene ==c-ABL== لمكان على 22 اسمه **breakpoint cluster region (bcr)**.
          - الاتنين جنب بعض بيعملوا **hybrid gene BCR/ABL**.
          - الجين ده بيعمل بروتين جديد **210 kDa** اسمه ==P210==: **tyrosine kinase** بيشغّل الانقسام من غير كنترول.

          ليه kinase بالذات خطير؟ التفسير المقبول (مش في الكتاب): الـ tyrosine kinase زي مفتاح الكهربا بتاع رسالة «اتقسمي». الطبيعي إنه يشتغل لما يجيله growth factor ويطفي بعدها. الـ BCR بيلزق في الـ ABL فيخليه ==شغال على طول==، فالخلية بتسمع «اتقسمي» من غير ما حد يطلب. وعشان كده العلاج بعدين (الـ TKI) بيقفل المفتاح ده نفسه.
      - kind: reveal
        page: 116
        quote: "It is an acquired malignant disease characterized by over production of cells of the granulocytic series, especially the neutrophilic series, leading to marked splenomegaly and very high white blood cell counts. Basophilia and thrombocytosis are common. A characteristic cytogenetic abnormality, the Philadelphia (Ph1) chromosome, is present in the bone marrow cells in more than 95% of cases. The Ph1 chromosome occurs in erythroid, myeloid, monocytes, rarely T lypmphocytes cells, but not in marrow fibroblasts. This distribution places the abnormality in CML close to the plaripotent stem cells."
        prompt: "الـ Ph1 بيتلاقي في الـ erythroid والـ myeloid والـ monocytes ونادرًا T cells، بس مش في الـ marrow fibroblasts. ده معناه إيه؟"
        answer: |
          إن الخلل حصل في خلية ==قبل== ما السلالات دي تتفرق، يعني قريب من الـ **pluripotent stem cell**.

          الـ fibroblasts مش من الـ hematopoietic stem cell أصلًا، علشان كده سليمة.
      - kind: check
        page: 116
        quote: "It is an acquired malignant disease characterized by over production of cells of the granulocytic series, especially the neutrophilic series, leading to marked splenomegaly and very high white blood cell counts. Basophilia and thrombocytosis are common. A characteristic cytogenetic abnormality, the Philadelphia (Ph1) chromosome, is present in the bone marrow cells in more than 95% of cases. The Ph1 chromosome occurs in erythroid, myeloid, monocytes, rarely T lypmphocytes cells, but not in marrow fibroblasts. This distribution places the abnormality in CML close to the plaripotent stem cells."
        question: "The Ph1 chromosome in CML is:"
        options:
          - "A shortened chromosome 22 from a balanced t(9;22)"
          - "A long chromosome 9 from t(15;17)"
          - "Present in about 50% of cases"
          - "Found in marrow fibroblasts"
        answer: 0
        why:
          - "صح: translocation balanced بين 9 و22، و22 بيخسر أكتر ما بياخد فيقصر."
          - "الـ t(15;17) بتاعة الـ acute promyelocytic leukaemia (APL)."
          - "الـ Ph1 موجود في أكتر من 95%."
          - "الـ fibroblasts مفيهاش Ph1."
      - kind: explain
        page: 117
        title: "الـ PP2A: الفرامل اللي اتشالت"
        quote: "A phosphatase regulating many cellular functions, is genetically inactivated in many types of cancer. PP2A activity is suppressed in blast crisis but not chronic phase CML cells through the BCR/ABL induced expression of its inhibitor, SET."
        text: |
          الخلية الطبيعية محتاجة توازن بين ==kinase== (بيشغّل) و ==phosphatase== (بيطفي).

          - الـ **protein phosphatase 2A (PP2A)** phosphatase فيه **tumour suppressor activity**.
          - في الـ **blast crisis** (مش الـ chronic phase) الـ BCR/ABL بيزوّد الـ inhibitor بتاعه **SET**، فالـ PP2A يقف.
          - لو رجعنا الـ PP2A ← الـ BCR/ABL يتكتم، حتى الـ **T315I**.
          - **Forskolin** بيشغّل PP2A: فكرة علاج للـ blast crisis والـ imatinib-resistant CML.

          ليه ده مهم؟ لأن الـ kinase بيحط phosphate والـ phosphatase بيشيله. يعني لو مش قادر تقفل الـ kinase (زي في الـ T315I)، ممكن ==تقوّي اللي بيشيل== الـ phosphate بداله.
      - kind: aside
        tone: analogy
        page: 117
        quote: "Restoration of PP2A activity inhibits BCR/ABL expression/activity, hence impairing wild type and T315, BCR/ABL leukemogenesis."
        text: "تخيل عربية دواسة البنزين فيها لزقت (**BCR/ABL**). الـ chronic phase لسه فيها فرامل (**PP2A**). في الـ blast crisis الـ **SET** قطع سلك الفرامل. الـ forskolin بيحاول يرجّع السلك."
      - kind: check
        page: 117
        quote: "enhanced PP2A activity, a bolished BCR/ABL phosphorylation and induced down regulation of BCR/ABL in imatinib-sensitive and resistant cells."
        question: "In CML blast cells, what did forskolin do in the book?"
        options:
          - "Raised PP2A activity and lowered BCR/ABL"
          - "Blocked the SET gene directly"
          - "Worked only in imatinib-sensitive cells"
          - "Raised BCR/ABL phosphorylation"
        answer: 0
        why:
          - "صح: الـ forskolin شغّل الـ PP2A، فالـ BCR/ABL phosphorylation راح والـ BCR/ABL نفسه قلّ."
          - "الكتاب بيقول إنه activator للـ PP2A، مش إنه بيوقف الـ SET."
          - "اشتغل في الـ sensitive والـ resistant الاتنين، وده سبب الأمل."
          - "العكس: الـ phosphorylation اتلغى."
      - kind: aside
        tone: exam
        page: 117
        quote: "BCR/ABL fusion gene is found in 25% of normal adults without CML. A tight control of kinase and phosphatase activity is fundamental for normal cell growth, survival and differentiation leukemia is often associated with expression of oncoproteins with aberrant kinase activity. By contrast, PP2A."
        text: "معلومة كتاب غريبة بيحبوا يسألوها: الـ **BCR/ABL** بيتلاقي في ==25%== من الكبار الطبيعيين من غير CML."
      - kind: try
        items: [hem.L08.003, hem.L08.008, hem.L08.010, hem.L08.012, hem.L08.015]
    recap:
