  - id: rheum.L14.lesson1
    title: "العضم: بنك فيه سحب وإيداع"
    hook: "العضم مش حجر. كل يوم فيه osteoclast بيسحب و osteoblast بيودّع، والـ osteoporosis هي لما السحب يغلب."
    minutes: 8
    pages: [221, 222]
    topics: [definition, biology]
    goals:
      - "تعرف تعريف الـ osteoporosis وليه الكسور في الأماكن دي"
      - "تفهم نوعين العضم والـ remodeling واللي بيأثر فيه"
    status: unverified
    steps:
      - kind: explain
        page: 221
        quote: "Osteoporosis is a systemic skeletal disorder characterized by:\n  Decreased bone mass.\n  Microarchitectural deterioration of bone tissue.\n  Increased bone fragility and risk of fractures.\n    Bone strength reflects both bone density and bone quality."
        title: "التعريف"
        text: |
          الـ ==osteoporosis== **systemic skeletal disorder** فيه:

          - **Decreased bone mass**.
          - **Microarchitectural deterioration**.
          - **Increased fragility** وخطر الكسر.

          وقوة العضم = **bone density + bone quality**، مش الكثافة لوحدها.

          التفسير المقبول (مش في الكتاب): يعني ممكن رقم الـ density يبان مقبول والعضم برضه يتكسر، عشان الـ quality (الـ microarchitecture) هي كمان باظت.
      - kind: reveal
        page: 221
        quote: "Bone strength reflects both bone density and bone quality."
        prompt: "ليه الكتاب بيقول قوة العضم = density + quality، مش الكثافة بس؟"
        answer: |
          الكتاب بيعرّف الـ osteoporosis بحاجتين: ==decreased bone mass== و ==microarchitectural deterioration==. الأولى كمية، والتانية شكل.

          التفسير المقبول (مش في الكتاب): تخيّل كوبري حديد. ممكن يبقى فيه نفس وزن الحديد، بس لو العوارض الصغيرة اللي بتربطه اتقطعت، هيقع أسهل. الـ DEXA بيقيس الكمية بس، علشان كده في ناس الـ T-score بتاعهم مش وحش وبيتكسروا.
      - kind: figure
        page: 221
        quote: "Fracture sites typically include:\n  Vertebral bodies (spine).\n  Proximal femur (hip).\n  Distal forearm (Colles' fracture)."
        title: "التلات أماكن الكلاسيك"
        alt: "A simple skeleton outline with three red marks: the vertebral bodies of the spine, the proximal femur at the hip, and the distal forearm at the wrist labelled Colles."
        caption: "العمود الفقري، رأس الفخذ، والرسغ (Colles'). دول اللي بيتكسروا من وقعة بسيطة."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <circle cx="165" cy="30" r="20" class="fg-box"/>
            <path d="M165 50V170M120 70H210M135 170H195" class="fg-ink"/>
            <path d="M120 70L105 130L95 185M210 70L225 130L235 185" class="fg-ink"/>
            <path d="M135 170L128 235L125 290M195 170L202 235L205 290" class="fg-ink"/>
            <rect x="155" y="90" width="20" height="60" rx="4" class="fg-bad"/>
            <circle cx="196" cy="180" r="10" class="fg-dot-bad"/>
            <circle cx="96" cy="175" r="8" class="fg-dot-bad"/>
            <text x="185" y="120" class="t-sm t-bad">vertebrae</text>
            <text x="10" y="200" class="t-sm t-bad">distal forearm</text>
            <text x="10" y="216" class="t-sm t-bad">(Colles')</text>
            <text x="215" y="185" class="t-sm t-bad">proximal femur</text>
          </svg>
      - kind: explain
        remind: [rheum.L14.004]
        page: 221
        title: "ليه الأماكن دي بالذات؟"
        quote: "Fracture sites typically include:\n  Vertebral bodies (spine).\n  Proximal femur (hip).\n  Distal forearm (Colles' fracture)."
        text: |
          الكتاب: **vertebral bodies**، **proximal femur**، و **distal forearm (Colles')**.

          التفسير المقبول (مش في الكتاب): التلات أماكن دول غنيين بالـ ==trabecular bone== (الإسفنجي، ص 222)، والنوع ده سطحه كبير فالـ remodeling فيه أسرع، فلما الهد يزيد بيخسر أسرع من الـ cortical. وكمان دول الأماكن اللي بتشيل الوزن (الفقرات) أو اللي بتخبط في الأرض في الوقعة (الحوض، والرسغ لما الواحد يسند على إيده).
      - kind: explain
        remind: [rheum.L14.003]
        page: 221
        quote: "Affects 1 in 3 women and 1 in 5 men over the age of 50."
        title: "ليه نهتم؟"
        text: |
          - الكسور بتجيب **pain** و **disability** و quality of life أقل و ==mortality== أعلى.
          - بيصيب **1 من كل 3 ستات** و **1 من كل 5 رجالة** فوق الـ 50.
          - عبء كبير مع كِبَر السن، وتكلفة عالية.

          التفسير المقبول (مش في الكتاب): الـ mortality بتعلى لأن كسر زي الـ hip بيرقّد الكبير في السرير، والرقاد نفسه بيجيب مضاعفات.
      - kind: explain
        remind: [rheum.L14.008]
        page: 222
        quote: "Bone Remodeling\n  Regulated by osteoclasts (resorption) and osteoblasts (formation).\n  Remodeling is influenced by:\n    Mechanical stress.\n    Hormonal signals (estrogen, PTH, vitamin D).\n    Cytokines (IL-6, TNF-α, RANKL)."
        title: "الـ Remodeling"
        text: |
          - **Cortical (compact)**: في الـ shafts بتاعة العضم الطويل.
          - **Trabecular (spongy)**: الـ vertebrae، الـ pelvis، وأطراف العضم الطويل.

          الـ ==osteoclasts== بتهد (resorption)، والـ ==osteoblasts== بتبني (formation). بيأثر عليهم:

          - **Mechanical stress**.
          - **Hormones**: estrogen، parathyroid hormone (PTH)، vitamin D.
          - **Cytokines**: IL-6، TNF-α، receptor activator of NF-κB ligand (RANKL).
      - kind: figure
        page: 222
        quote: "Bone Remodeling\n  Regulated by osteoclasts (resorption) and osteoblasts (formation).\n  Remodeling is influenced by:\n    Mechanical stress.\n    Hormonal signals (estrogen, PTH, vitamin D).\n    Cytokines (IL-6, TNF-α, RANKL)."
        title: "ميزان الـ remodeling"
        alt: "A balance. On the left pan, osteoclasts remove bone (resorption). On the right pan, osteoblasts lay down bone (formation). Above, the influences: mechanical stress, hormones (estrogen, PTH, vitamin D) and cytokines (IL-6, TNF-alpha, RANKL). Below, two tips: type I, estrogen deficiency makes osteoclasts heavier; type II, ageing makes osteoblasts lighter."
        caption: "==Osteoclast== بيهد و ==osteoblast== بيبني. **Type I**: الـ estrogen راح فالهد زاد. **Type II**: السن فالبنا قل. والنتيجة واحدة: العضم بيخسر."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="18" text-anchor="middle" class="t-sm t-mut">stress · estrogen, PTH, vitamin D · IL-6, TNF-α, RANKL</text>
            <path d="M165 40 L165 120" class="fg-ink" stroke-width="3"/>
            <path d="M140 130 L190 130 L165 110 Z" class="fg-ink"/>
            <path d="M50 60 L280 60" class="fg-ink" stroke-width="3"/>
            <path d="M50 60 L30 100 M50 60 L70 100 M280 60 L260 100 M280 60 L300 100" class="fg-thin"/>
            <rect x="15" y="100" width="70" height="40" rx="8" class="fg-bad"/>
            <text x="50" y="118" text-anchor="middle" class="t-sm t-b">osteoclast</text>
            <text x="50" y="133" text-anchor="middle" class="t-sm">resorption</text>
            <rect x="245" y="100" width="70" height="40" rx="8" class="fg-good"/>
            <text x="280" y="118" text-anchor="middle" class="t-sm t-b">osteoblast</text>
            <text x="280" y="133" text-anchor="middle" class="t-sm">formation</text>
            <rect x="10" y="170" width="150" height="66" rx="8" class="fg-box"/>
            <text x="85" y="192" text-anchor="middle" class="t-sm t-b">Type I</text>
            <text x="85" y="210" text-anchor="middle" class="t-sm">estrogen ↓</text>
            <text x="85" y="226" text-anchor="middle" class="t-sm">osteoclast ↑</text>
            <rect x="170" y="170" width="150" height="66" rx="8" class="fg-box"/>
            <text x="245" y="192" text-anchor="middle" class="t-sm t-b">Type II</text>
            <text x="245" y="210" text-anchor="middle" class="t-sm">ageing</text>
            <text x="245" y="226" text-anchor="middle" class="t-sm">osteoblast ↓</text>
          </svg>
      - kind: reveal
        page: 222
        quote: "Remodeling is influenced by:\n  Mechanical stress.\n  Hormonal signals (estrogen, PTH, vitamin D).\n  Cytokines (IL-6, TNF-α, RANKL)."
        prompt: "ليه الـ mechanical stress والـ cytokines زي TNF و IL-6 في قايمة اللي بيأثر في الـ remodeling؟"
        answer: |
          الكتاب بيدّي القايمة. التفسير المقبول (مش في الكتاب):
          - **Mechanical stress**: العضم بيبني نفسه حسب الحمل. اللي نايم في السرير شهور بيخسر عضم، والرياضة اللي فيها وزن بتبنيه (علشان كده هي جزء من العلاج، ص 224)
          - **Cytokines**: الـ ==RANKL== هو الزرار اللي بيشغّل الـ osteoclast، والـ TNF و IL-6 بيدوسوا عليه. علشان كده الأمراض الالتهابية زي الـ RA بتعمل osteoporosis، وعلشان كده الـ denosumab (anti-RANKL) بيشتغل
      - kind: check
        page: 221
        quote: "Fracture sites typically include:\n  Vertebral bodies (spine).\n  Proximal femur (hip).\n  Distal forearm (Colles' fracture)."
        question: "Which of the following is a common site for osteoporotic fracture?"
        options:
          - "Proximal femur"
          - "Skull"
          - "Humerus"
          - "Rib"
        answer: 0
        why:
          - "صح: الكتاب: vertebral bodies و proximal femur و distal forearm."
          - "مش من أماكن الكتاب."
          - "مش من التلات أماكن اللي في الكتاب."
          - "مش من التلات أماكن اللي في الكتاب."
      - kind: try
        items: [rheum.L14.001, rheum.L14.003, rheum.L14.004, rheum.L14.006, rheum.L14.008]
    recap:
      - "Osteoporosis: bone mass قليلة + microarchitecture بايظة + fragility. القوة = density + quality."
      - "الكسور: pain، disability، quality of life، mortality. الأماكن: فقرات، proximal femur، Colles'. 1 من 3 ستات و 1 من 5 رجالة فوق 50."
      - "Cortical في الـ shafts، trabecular في الفقرات والحوض وأطراف العضم. Osteoclast يهد، osteoblast يبني؛ بيأثر فيهم الحمل، الهرمونات، والـ cytokines."
    practice: [rheum.L14.001, rheum.L14.002, rheum.L14.003, rheum.L14.004, rheum.L14.005, rheum.L14.006, rheum.L14.007, rheum.L14.008, rheum.L14.066]
