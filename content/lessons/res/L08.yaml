  - id: res.L08.lesson5
    title: "Bias ولا confounding؟"
    hook: "الكحول بيعمل lung cancer؟ OR = 2.5... لحد ما قسّمنا الناس smokers و non-smokers والعلاقة اختفت."
    minutes: 7
    pages: [57, 62]
    topics: [bias]
    goals:
      - "تعرّف الـ bias كـ systematic error"
      - "تعرف الـ confounding لما العلاقة تختفي بعد الـ stratification"
      - "تفرّق بين observer bias و recall bias"
    status: unverified
    steps:
      - kind: explain
        page: 57
        quote: "Any systematic error in the design, conduct, or analysis of a study"
        title: "Bias: غلطة systematic"
        text: |
          ==Bias== = أي **systematic error** في الـ design أو الـ conduct أو الـ analysis، بيطلّع تقدير **غلط** لأثر الـ exposure.

          الفرق عن الصدفة (random error): الـ bias **بيزق النتيجة في اتجاه واحد**، وكبر العيّنة **مش** بيعالجه.
      - kind: figure
        page: 60
        quote: "Subsequent statistical analysis does not reveal any association between alcohol consumption and lung cancer within either group"
        title: "مثلث الـ confounding"
        alt: "Triangle. Alcohol at the left, lung cancer at the right, smoking at the top. Smoking is linked to alcohol (drinkers smoke more) and causes lung cancer. The apparent arrow from alcohol to lung cancer is dashed: it disappears within smokers and within non-smokers."
        caption: "التدخين مرتبط بالكحول **و** بيعمل lung cancer. لما بنقسم الناس حسب التدخين (**stratification**)، السهم المتقطع بيختفي."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R08c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="115" y="10" width="100" height="40" rx="8" class="fg-bad"/>
            <text x="165" y="35" text-anchor="middle" class="t-sm t-b">Smoking</text>
            <rect x="5" y="160" width="100" height="40" rx="8" class="fg-box"/>
            <text x="55" y="185" text-anchor="middle" class="t-sm t-b">Alcohol</text>
            <rect x="225" y="160" width="100" height="40" rx="8" class="fg-box"/>
            <text x="275" y="185" text-anchor="middle" class="t-sm t-b">Lung cancer</text>
            <path d="M135 50L70 156" class="fg-arrow"/>
            <text x="70" y="100" class="t-sm t-mut">linked</text>
            <path d="M195 50L260 156" class="fg-arrow" marker-end="url(#R08c)"/>
            <text x="238" y="100" class="t-sm t-mut">causes</text>
            <path d="M108 180H220" class="fg-dot-acc" marker-end="url(#R08c)"/>
            <text x="165" y="172" text-anchor="middle" class="t-sm t-acc t-b">OR 2.5?</text>
            <text x="165" y="222" text-anchor="middle" class="t-sm t-acc">vanishes within each smoking group</text>
          </svg>
      - kind: check
        page: 60
        quote: "The researchers then divide the study subjects into two groups: smokers and non-smokers"
        question: "Alcohol and lung cancer: OR 2.5 overall, but no association within smokers or within non-smokers. This is:"
        options: ["Confounding", "Recall bias", "Observer bias", "Non-response bias"]
        answer: 0
        why:
          - "صح: التدخين **confounder**، مرتبط بالكحول وبيعمل lung cancer. الـ stratification كشفته."
          - "الـ recall bias مش هيختفي لما نقسم حسب التدخين."
          - "مفيش حاجة عن طريقة قياس المرض."
          - "مفيش حاجة عن الناس اللي رفضت تشارك."
      - kind: check
        page: 59
        quote: "Randomization of study subjects in a clinical trial is most helpful for controlling"
        question: "Randomization in a clinical trial is most helpful for controlling:"
        options: ["Confounding", "Recall bias", "Non-compliance", "Placebo effect"]
        answer: 0
        why:
          - "صح: القرعة بتوزّع الـ confounders المعروفة والمجهولة بالتساوي."
          - "الـ recall bias مشكلة case-control."
          - "القرعة مابتخليش حد ياخد دواه."
          - "الـ placebo effect بيتحكم فيه placebo group و blinding."
      - kind: match
        page: 61
        quote: "The first group of pathologists is aware of the race of the patient"
        prompt: "وصّل كل موقف بالـ bias بتاعه:"
        pairs:
          - ["Pathologists who know the patient's race read the same biopsy differently", "Observer bias"]
          - ["Mothers of malformed babies remember every pill they took", "Recall bias"]
          - ["Smoking explains the alcohol and lung cancer link", "Confounding"]
          - ["Patients and staff unaware who gets the drug", "Prevents observer and subject bias"]
        why: "**Observer**: اللي بيقيس عارف حاجة تأثر على حكمه. **Recall**: الـ cases بيفتكروا أكتر. **Confounding**: عامل تالت. والـ **double blind** بيمنع الـ observer والـ subject bias."
      - kind: aside
        tone: analogy
        page: 62
        quote: "Which of the following biases is of major concern when interpreting the study results"
        text: |
          أم ولدت طفل عنده neural tube defect بتقعد تسأل نفسها شهور: «أنا خدت إيه؟ البندول؟ المضاد الحيوي؟» فلما تسألها هتفتكر **كل حباية**.

          والأم اللي طفلها سليم مش هتفتكر إنها خدت بندول مرة في الشهر التالت. ده الـ ==recall bias==، وهو **أكبر مشكلة في الـ case-control**، حتى بعد الـ adjusting للـ confounders، واللي فيها الـ OR كان 1.3 بس. خليه في بالك لما تفسّر الـ study results.
      - kind: try
        items: [res.L08.051, res.L08.052, res.L08.053]
    recap:
      - "Bias = systematic error. كبر العيّنة مابيعالجوش."
      - "Confounding: العلاقة بتختفي جوّه كل طبقة بعد الـ stratification."
      - "Randomization بيتحكم في الـ confounding. Double blind بيمنع observer و subject bias."
      - "Recall bias = المشكلة الكبيرة في case-control. Observer bias = اللي بيقيس عارف."
    practice: [res.L08.048, res.L08.049, res.L08.050, res.L08.051, res.L08.052, res.L08.053]
