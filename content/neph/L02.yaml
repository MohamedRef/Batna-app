  # ---------- p24: definition and hyperfiltration ----------
  - id: neph.L02.004
    kind: card
    topic: definition
    front: How does KDIGO 2012 define CKD?
    back: Abnormalities of kidney structure or function, present for more than 3 months, with implications for health.
    src: { page: 24, quote: "CKD is defined as abnormalities of kidney structure or function, present for > 3 months, with implications for health and CKD is classified based on cause, GFR category, and albuminuria category (CGA)." }
    status: unverified
    tags: [high-yield]
  - id: neph.L02.005
    kind: cloze
    topic: definition
    text: CKD is classified by {{c1::Cause}}, {{c2::GFR}} category and {{c3::Albuminuria}} category (CGA).
    src: { page: 24, quote: "CKD is defined as abnormalities of kidney structure or function, present for > 3 months, with implications for health and CKD is classified based on cause, GFR category, and albuminuria category (CGA)." }
    status: unverified
    tags: [high-yield]
  - id: neph.L02.006
    kind: enumerate
    topic: definition
    prompt: List the markers of kidney damage that define CKD (one or more for > 3 months).
    points:
      - "Albuminuria (AER ≥ 30 mg/24 h; ACR ≥ 30 mg/g [≥ 3 mg/mmol])"
      - Urine sediment abnormalities
      - Electrolyte and other abnormalities due to tubular disorders
      - Abnormalities detected by histology
      - Structural abnormalities detected by imaging
      - History of kidney transplantation
    pass: 4
    hook: "ضرر الكلية بيبان في 6: «بول مرتين، أنابيب، عينة، صورة، وكلية مزروعة»: albuminuria (AER ≥ 30 mg/24 h؛ ACR ≥ 30 mg/g = ≥ 3 mg/mmol) وurine sediment بايظ، electrolytes وغيره من tubular disorders، histology، imaging structural، وhistory of kidney transplantation."
    src: { page: 24, quote: "Criteria for CKD (either of the following present for > 3 months)\n| Markers of kidney damage (one or more) | Albuminuria (AER ≥ 30 mg/24 hours; ACR ≥ 30 mg/g [≥ 3 mg/mmol]) |\n| | Urine sediment abnormalities |\n| | Electrolyte and other abnormalities due to tubular disorders |\n| | Abnormalities detected by histology |\n| | Structural abnormalities detected by imaging |\n| | History of kidney transplantation |\n| Decreased GFR | GFR < 60 ml/min/1.73 m2 (GFR categories G3a-G5) |" }
    status: unverified
    tags: [high-yield]
  - id: neph.L02.007
    kind: cloze
    topic: definition
    text: The albuminuria criterion for CKD is AER ≥ {{c1::30}} mg/24 hours or ACR ≥ {{c1::30}} mg/g (≥ {{c2::3}} mg/mmol).
    src: { page: 24, quote: "Criteria for CKD (either of the following present for > 3 months)\n| Markers of kidney damage (one or more) | Albuminuria (AER ≥ 30 mg/24 hours; ACR ≥ 30 mg/g [≥ 3 mg/mmol]) |\n| | Urine sediment abnormalities |\n| | Electrolyte and other abnormalities due to tubular disorders |\n| | Abnormalities detected by histology |\n| | Structural abnormalities detected by imaging |\n| | History of kidney transplantation |\n| Decreased GFR | GFR < 60 ml/min/1.73 m2 (GFR categories G3a-G5) |" }
    status: unverified
  - id: neph.L02.008
    kind: cloze
    topic: definition
    text: "Decreased GFR alone defines CKD when GFR is < {{c1::60}} mL/min/1.73 m² (GFR categories {{c2::G3a–G5}})."
    src: { page: 24, quote: "Criteria for CKD (either of the following present for > 3 months)\n| Markers of kidney damage (one or more) | Albuminuria (AER ≥ 30 mg/24 hours; ACR ≥ 30 mg/g [≥ 3 mg/mmol]) |\n| | Urine sediment abnormalities |\n| | Electrolyte and other abnormalities due to tubular disorders |\n| | Abnormalities detected by histology |\n| | Structural abnormalities detected by imaging |\n| | History of kidney transplantation |\n| Decreased GFR | GFR < 60 ml/min/1.73 m2 (GFR categories G3a-G5) |" }
    status: unverified
  - id: neph.L02.009
    kind: card
    topic: hyperfiltration
    front: What is hyperfiltration in CKD?
    back: Single-nephron hyperfiltration due to adaptive responses to the progressive decrease in the number of functional units.
    src: { page: 24, quote: "Single-nephron hyperfiltration due to adaptive responses to the progressive decrease in the number of functional units." }
    status: unverified
  - id: neph.L02.010
    kind: enumerate
    topic: hyperfiltration
    prompt: List the causes of renal hyperfiltration.
    points:
      - Increased sympathetic activity
      - Increased renin–angiotensin–aldosterone activity
      - Hyperglycaemia and insulin resistance
      - Obesity
      - Increased autoimmune activation
      - Impaired glomerular haemodynamics
      - Inhibition of tubuloglomerular feedback (macula densa signals)
    pass: 5
    hook: "الكلية بتشتغل أوفر تايم من 7: «أعصاب، هرمون، سكر، وزن، مناعة، أوعية بايظة، وفرامل مقطوعة» = sympathetic زيادة، RAAS زيادة، hyperglycaemia وinsulin resistance، obesity، autoimmune activation، impaired glomerular haemodynamics، وinhibition of tubuloglomerular feedback (macula densa مش بتبلّغ)."
    src: { page: 24, quote: "Causes of Renal Hyperfiltration\n  Increased sympathetic activity\n  Increased renin-angiotensin-aldesterone activity\n  Hyperglycaemia and insulin resistance\n  Obesity\n  Increased autoimmune activation\n  Impaired glomerular haemodynamics\n  Inhibition of tubuloglomerular feedback (macula densa signals)\nGlomerular Hyperfiltration\n  Afferent ateriole: Reduced arterial resistance\n  Efferent ateriole: Increased arterial resistance\n  Increased glomerular permeability to macromolecules: Proteinuria, Albuminuria\n  Increased oxdative stress; Increased inflammation\n  Endothelial dysfunction: Increased arterial stiffness; Increased blood pressure; Impaired blood pressure variation\n  Increased Sodium Uptake\n  Increased cardiovascular disease and mortality" }
    status: unverified
  - id: neph.L02.011
    kind: card
    topic: hyperfiltration
    front: What happens to afferent and efferent arteriolar resistance in glomerular hyperfiltration?
    back: Afferent arteriolar resistance falls and efferent arteriolar resistance rises.
    src: { page: 24, quote: "Causes of Renal Hyperfiltration\n  Increased sympathetic activity\n  Increased renin-angiotensin-aldesterone activity\n  Hyperglycaemia and insulin resistance\n  Obesity\n  Increased autoimmune activation\n  Impaired glomerular haemodynamics\n  Inhibition of tubuloglomerular feedback (macula densa signals)\nGlomerular Hyperfiltration\n  Afferent ateriole: Reduced arterial resistance\n  Efferent ateriole: Increased arterial resistance\n  Increased glomerular permeability to macromolecules: Proteinuria, Albuminuria\n  Increased oxdative stress; Increased inflammation\n  Endothelial dysfunction: Increased arterial stiffness; Increased blood pressure; Impaired blood pressure variation\n  Increased Sodium Uptake\n  Increased cardiovascular disease and mortality" }
    status: unverified
  - id: neph.L02.012
    kind: enumerate
    topic: hyperfiltration
    prompt: How does glomerular hyperfiltration lead to cardiovascular disease and death (book p24 chain)?
    points:
      - Increased oxidative stress and inflammation
      - Endothelial dysfunction
      - Increased arterial stiffness
      - Increased blood pressure and impaired BP variation
      - Increased cardiovascular disease and mortality
    pass: 3
    hook: "سلسلة الـ hyperfiltration للقلب: «نار → بطانة → تصلّب → ضغط → موت» = oxidative stress وinflammation → endothelial dysfunction → arterial stiffness → BP عالي وتذبذبه بايظ → CVD وmortality."
    src: { page: 24, quote: "Causes of Renal Hyperfiltration\n  Increased sympathetic activity\n  Increased renin-angiotensin-aldesterone activity\n  Hyperglycaemia and insulin resistance\n  Obesity\n  Increased autoimmune activation\n  Impaired glomerular haemodynamics\n  Inhibition of tubuloglomerular feedback (macula densa signals)\nGlomerular Hyperfiltration\n  Afferent ateriole: Reduced arterial resistance\n  Efferent ateriole: Increased arterial resistance\n  Increased glomerular permeability to macromolecules: Proteinuria, Albuminuria\n  Increased oxdative stress; Increased inflammation\n  Endothelial dysfunction: Increased arterial stiffness; Increased blood pressure; Impaired blood pressure variation\n  Increased Sodium Uptake\n  Increased cardiovascular disease and mortality" }
    status: unverified
  # ---------- p25: pathogenesis and screening ----------
  - id: neph.L02.013
    kind: card
    topic: hyperfiltration
    front: After how many nephrons are lost does CKD progress similarly whatever the cause?
    back: Once about half of the total nephrons are lost.
    src: { page: 25, quote: "Once half of the total nephrons are lost, CKD progresses similarly regardless of etiology. Initial hyperfiltration activates RAAS and causes proteinuria. Angiotensin II and protein uptake at the tubules causes inflammation and fibrosis of the glomerulus and tubules. Progressive decline in GFR and systemic complications occurs." }
    status: unverified
    tags: [high-yield]
  - id: neph.L02.014
    kind: order
    topic: hyperfiltration
    prompt: Put the pathogenesis of CKD progression in order.
    steps:
      - Loss of nephron number
      - Adaptive hyperfiltration at the glomerulus (↑ single-nephron GFR)
      - RAAS activation and proteinuria
      - Angiotensin II and tubular protein uptake cause inflammation
      - Glomerular and tubulointerstitial fibrosis (2° FSGS)
      - Progressive GFR decline and systemic complications
    src: { page: 25, quote: "Once half of the total nephrons are lost, CKD progresses similarly regardless of etiology. Initial hyperfiltration activates RAAS and causes proteinuria. Angiotensin II and protein uptake at the tubules causes inflammation and fibrosis of the glomerulus and tubules. Progressive decline in GFR and systemic complications occurs." }
    status: unverified
  - id: neph.L02.015
    kind: card
    topic: screening
    front: In whom is CKD screening cost-effective?
    back: In populations at risk for CKD.
    src: { page: 25, quote: "Screening → cost-effective in populations at risk for CKD" }
    status: unverified
