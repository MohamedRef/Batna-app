          إيه هو الـ goitrogenic stimulus ده؟ التفسير المقبول (مش في الكتاب): هو نفس أسباب ص 25: **relative iodine deficiency** (الكلية بتطرد iodine أكتر والجنين بياخد منه)، والـ **hCG** اللي بينبّه الغدة زي الـ TSH. يعني الغدة بتشتغل أوفر تايم فتكبر وتعمل عقد.
