  - id: hem.L03.lesson7
    title: "الـ PNH: الكرة اللي فقدت درعها"
    hook: "طفرة واحدة في جين على الـ X بتشيل الدرع اللي بيحمي الكرة من الـ complement. والنتيجة: haemolysis و pancytopenia وجلطات في أماكن غريبة."
    minutes: 9
    pages: [49, 56]
    topics: [pnh]
    goals:
      - "تشرح الـ PIGA والـ GPI anchor وليه الـ complement بيكسّر الكرة"
      - "تربط نقص الـ NO بالأعراض، وتعرف أماكن الجلطات"
      - "تعرف مين تعمله screening، والتحاليل (CD59، CD55)، والعلاج (complement inhibitors، HSCT)"
    status: unverified
    steps:
      - kind: explain
        page: 50
        title: "الـ triad والسبب"
        quote: "The triad of hemolytic anemia, pancytopenia, and thrombosis makes PNH a unique clinical syndrome."
        text: |
          الـ ==PNH== مرض نادر ومزمن، بيبدأ غالبًا في **أول الشباب**، وحوالي **50%** بيموتوا من **الجلطات**.

          الـ triad: ==haemolytic anaemia + pancytopenia + thrombosis==.

          السبب: طفرة في جين **PIGA** على الـ **X chromosome**، فالخلية مش قادرة تعمل الـ **GPI anchor** اللي بيثبّت بروتينات معينة على الغشا. ومن البروتينات دي اللي بيحموا الكرة من الـ complement: **CD55** و **CD59**.
      - kind: aside
