items:
  # ---------- p221: definition ----------
  - id: rheum.L14.001
    kind: enumerate
    topic: definition
    prompt: Osteoporosis is a systemic skeletal disorder characterized by...
    points:
      - Decreased bone mass
      - Microarchitectural deterioration of bone tissue
      - Increased bone fragility and fracture risk
    pass: 3
    hook: "الهشاشة «عضم قليل، مبنى بايظ، وبيتكسر»: decreased bone mass، microarchitectural deterioration، وfragility مع fracture risk."
    src: { page: 221, quote: "Osteoporosis is a systemic skeletal disorder characterized by:\n  Decreased bone mass.\n  Microarchitectural deterioration of bone tissue.\n  Increased bone fragility and risk of fractures.\n    Bone strength reflects both bone density and bone quality." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L14.002
    kind: card
    topic: definition
    front: Bone strength reflects which two things?
    back: Bone density and bone quality.
    src: { page: 221, quote: "Increased bone fragility and risk of fractures.\n  Bone strength reflects both bone density and bone quality." }
    status: unverified
  - id: rheum.L14.003
    kind: enumerate
    topic: definition
    prompt: Consequences of osteoporotic fractures.
    points:
      - Pain
      - Disability
      - Reduced quality of life
      - Increased mortality
    pass: 3
    hook: "الكسر بيجيب «وجع، عجز، حياة أوحش، وموت أكتر»: pain، disability، reduced QoL، increased mortality."
    src: { page: 221, quote: "Osteoporotic fractures lead to:\n  Pain.\n  Disability.\n  Reduced quality of life.\n  Increased mortality." }
    status: unverified
  - id: rheum.L14.004
    kind: enumerate
    topic: definition
    prompt: Typical sites of osteoporotic fracture.
    points:
      - Vertebral bodies (spine)
      - Proximal femur (hip)
      - "Distal forearm (Colles' fracture)"
    pass: 3
    hook: "الكسور «ضهر، ورك، ورسغ»: vertebral bodies، proximal femur، وdistal forearm (Colles)."
    src: { page: 221, quote: "Fracture sites typically include:\n  Vertebral bodies (spine).\n  Proximal femur (hip).\n  Distal forearm (Colles' fracture)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L14.005
    kind: cloze
    topic: definition
    text: Osteoporosis affects {{c1::1 in 3}} women and {{c2::1 in 5}} men over the age of 50.
    src: { page: 221, quote: "Affects 1 in 3 women and 1 in 5 men over the age of 50." }
    status: unverified
    tags: [numbers, high-yield]
  # ---------- p222: biology, types, risk ----------
  - id: rheum.L14.006
    kind: table
    topic: biology
    title: Bone composition (p222)
    columns: [Bone, Found in]
    rows:
      - [Cortical (compact), Shafts of long bones]
      - [Trabecular (spongy), "Vertebrae, pelvis, ends of long bones"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 222, quote: "Bone Composition\n  Cortical bone (compact) – found in shafts of long bones.\n  Trabecular bone (spongy) – found in vertebrae, pelvis, and ends of long bones." }
    status: unverified
  - id: rheum.L14.007
    kind: card
    topic: biology
    front: Which cells regulate bone remodeling, and what does each do?
    back: Osteoclasts resorb bone; osteoblasts form bone.
    src: { page: 222, quote: "Bone Remodeling\n  Regulated by osteoclasts (resorption) and osteoblasts (formation).\n  Remodeling is influenced by:\n    Mechanical stress.\n    Hormonal signals (estrogen, PTH, vitamin D).\n    Cytokines (IL-6, TNF-α, RANKL)." }
    status: unverified
  - id: rheum.L14.008
    kind: enumerate
    topic: biology
    prompt: Influences on bone remodeling.
    points:
      - Mechanical stress
      - "Hormones: estrogen, PTH, vitamin D"
      - "Cytokines: IL-6, TNF-α, RANKL"
    pass: 3
    hook: "العضم بيتشكّل بـ «حمل، هرمونات، وcytokines»: mechanical stress؛ estrogen وPTH وvitamin D؛ IL-6 وTNF-α وRANKL."
    src: { page: 222, quote: "Remodeling is influenced by:\n  Mechanical stress.\n  Hormonal signals (estrogen, PTH, vitamin D).\n  Cytokines (IL-6, TNF-α, RANKL)." }
    status: unverified
  - id: rheum.L14.009
    kind: table
    topic: types
    title: Primary osteoporosis (p222)
    columns: [Type, Mechanism]
    rows:
      - [Type I (postmenopausal), Estrogen deficiency increases osteoclast activity]
      - [Type II (senile), Age-related decline in osteoblast function]
    blanks: [[0, 1], [1, 1]]
    src: { page: 222, quote: "Primary Osteoporosis\n  Type I (Postmenopausal): Estrogen deficiency leads to increased osteoclast activity.\n  Type II (Senile): Age-related decline in osteoblast function." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L14.010
    kind: enumerate
    topic: types
    prompt: Causes of secondary osteoporosis.
    points:
      - "Endocrine disorders, e.g. hyperthyroidism, Cushing's"
      - "Medications, e.g. glucocorticoids, heparin, anticonvulsants"
      - Malabsorption syndromes
      - "Chronic illnesses, e.g. RA, CKD"
    pass: 4
    hook: "الهشاشة الثانوية «هرمون، دوا، أمعاء، ومرض مزمن»: endocrine (hyperthyroid، Cushing)، medications (steroids، heparin، anticonvulsants)، malabsorption، وchronic illness (RA، CKD)."
    src: { page: 222, quote: "Caused by:\n  Endocrine disorders (e.g., hyperthyroidism, Cushing's).\n  Medications (e.g., glucocorticoids, heparin, anticonvulsants).\n  Malabsorption syndromes.\n  Chronic illnesses (e.g., RA, CKD)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L14.011
    kind: card
    topic: types
    front: Name three drug classes that cause secondary osteoporosis.
    back: Glucocorticoids, heparin and anticonvulsants.
    src: { page: 222, quote: "Caused by:\n  Endocrine disorders (e.g., hyperthyroidism, Cushing's).\n  Medications (e.g., glucocorticoids, heparin, anticonvulsants).\n  Malabsorption syndromes.\n  Chronic illnesses (e.g., RA, CKD)." }
    status: unverified
  - id: rheum.L14.012
    kind: enumerate
    topic: risk
    prompt: Non-modifiable risk factors for osteoporosis.
    points:
      - Advanced age
      - Female sex
      - Caucasian or Asian ethnicity
      - Family history of osteoporosis or hip fracture
    pass: 3
    hook: "اللي مش في إيدك «كبيرة، ست، بيضا أو آسيوية، وأمها اتكسر وركها»: advanced age، female، Caucasian/Asian، وfamily history."
    src: { page: 222, quote: "Non-Modifiable\n  Advanced age.\n  Female sex.\n  Caucasian or Asian ethnicity.\n  Family history of osteoporosis or hip fracture." }
    status: unverified
  # ---------- p223: modifiable, DEXA, FRAX, BMD indications ----------
  - id: rheum.L14.013
    kind: enumerate
    topic: risk
    prompt: Modifiable risk factors for osteoporosis.
    points:
      - Low body weight
      - Smoking
      - Excess alcohol
      - Sedentary lifestyle
      - Poor calcium or vitamin D intake
    pass: 4
    hook: "اللي في إيدك تغيّره «رفيع، بيدخّن، بيشرب، قاعد، ومش بياكل كالسيوم»: low weight، smoking، alcohol، sedentary، وcalcium أو vitamin D قليل."
    src: { page: 223, quote: "Modifiable\n  Low body weight.\n  Smoking.\n  Excess alcohol intake.\n  Sedentary lifestyle.\n  Poor calcium/vitamin D intake." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L14.014
    kind: card
    topic: dexa
    front: Gold standard test for bone mineral density?
    back: Dual-energy X-ray absorptiometry (DEXA).
    src: { page: 223, quote: "Bone Mineral Density (BMD) Testing\n  Dual-energy X-ray absorptiometry (DEXA) is the gold standard.\n  T-score interpretation:\n    Normal: T ≥ –1.\n    Osteopenia: –1 > T > –2.5.\n    Osteoporosis: T ≤ –2.5.\n    Severe osteoporosis: T ≤ –2.5 + fragility fracture." }
    status: unverified
  - id: rheum.L14.015
    kind: table
    topic: dexa
    title: DEXA T-score interpretation (p223)
    columns: [Category, T-score]
    rows:
      - [Normal, "T ≥ –1"]
      - [Osteopenia, "–1 > T > –2.5"]
      - [Osteoporosis, "T ≤ –2.5"]
      - [Severe osteoporosis, "T ≤ –2.5 plus a fragility fracture"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 223, quote: "T-score interpretation:\n  Normal: T ≥ –1.\n  Osteopenia: –1 > T > –2.5.\n  Osteoporosis: T ≤ –2.5.\n  Severe osteoporosis: T ≤ –2.5 + fragility fracture." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L14.016
    kind: cloze
    topic: dexa
    text: Osteoporosis is a T-score {{c1::≤ –2.5}}; it is severe when combined with a {{c2::fragility fracture}}.
    src: { page: 223, quote: "T-score interpretation:\n  Normal: T ≥ –1.\n  Osteopenia: –1 > T > –2.5.\n  Osteoporosis: T ≤ –2.5.\n  Severe osteoporosis: T ≤ –2.5 + fragility fracture." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L14.017
    kind: card
    topic: dexa
    front: What does FRAX estimate, and does it need BMD?
    back: The 10-year probability of hip fracture and of major osteoporotic fracture; it can be used with or without BMD.
    src: { page: 223, quote: "Estimates 10-year probability of:\n  Hip fracture.\n  Major osteoporotic fracture.\nCan be used with or without BMD" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L14.018
    kind: enumerate
    topic: screening
    prompt: Indications for BMD testing.
    points:
      - Women ≥ 65 years
      - Men ≥ 70 years
      - Postmenopausal women < 65 with risk factors
      - Adults with fragility fractures
      - "Long-term glucocorticoids (≥ 5 mg prednisone for ≥ 3 months)"
    pass: 4
    hook: "اعمل DEXA لـ «ست 65، راجل 70، ست بعد سن اليأس عندها risk، أي حد اتكسر بسهولة، وكورتيزون طويل»: women 65 وفوق، men 70 وفوق، postmenopausal تحت 65 مع risk factors، fragility fracture، وprednisone 5 مجم أو أكتر لمدة 3 شهور أو أكتر."
    src: { page: 223, quote: "Indications for BMD Testing\n  Women ≥ 65 years.\n  Men ≥ 70 years.\n  Postmenopausal women < 65 with risk factors.\n  Adults with fragility fractures.\n  Long-term glucocorticoid therapy (≥5 mg prednisone for ≥3 months)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L14.019
    kind: cloze
    topic: screening
    text: BMD testing is indicated in women aged ≥ {{c1::65}} and men aged ≥ {{c2::70}}.
    src: { page: 223, quote: "Indications for BMD Testing\n  Women ≥ 65 years.\n  Men ≥ 70 years.\n  Postmenopausal women < 65 with risk factors.\n  Adults with fragility fractures.\n  Long-term glucocorticoid therapy (≥5 mg prednisone for ≥3 months)." }
    status: unverified
    tags: [numbers]
  - id: rheum.L14.020
    kind: cloze
    topic: screening
    text: Long-term glucocorticoid therapy of ≥ {{c1::5 mg}} prednisone for ≥ {{c2::3 months}} is an indication for BMD testing (p223).
    src: { page: 223, quote: "Indications for BMD Testing\n  Women ≥ 65 years.\n  Men ≥ 70 years.\n  Postmenopausal women < 65 with risk factors.\n  Adults with fragility fractures.\n  Long-term glucocorticoid therapy (≥5 mg prednisone for ≥3 months)." }
    status: unverified
    tags: [numbers]
  # ---------- p224: labs, non-pharm, drug indications, BP ----------
  - id: rheum.L14.021
    kind: enumerate
    topic: screening
    prompt: Laboratory tests to rule out secondary osteoporosis.
    points:
      - CBC and ESR
      - Calcium and phosphate
      - ALP, creatinine and TSH
      - 25-hydroxyvitamin D
      - PTH
      - Serum protein electrophoresis if myeloma suspected
    pass: 5
    hook: "معمل الهشاشة الثانوية «الروتين، المعادن، الفيتامين، الهرمون، والمايلوما»: CBC وESR، ALP وcreatinine وTSH؛ calcium وphosphate؛ 25-OH vitamin D؛ PTH؛ وprotein electrophoresis لو شاكك في myeloma."
    src: { page: 224, quote: "To rule out secondary causes:\n  CBC, ESR.\n  Calcium, phosphate.\n  ALP, creatinine, TSH.\n  25-hydroxyvitamin D.\n  PTH.\n  Serum protein electrophoresis (if multiple myeloma is suspected)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L14.022
    kind: card
    topic: screening
    front: When is serum protein electrophoresis added to the osteoporosis work-up?
    back: When multiple myeloma is suspected.
    src: { page: 224, quote: "To rule out secondary causes:\n  CBC, ESR.\n  Calcium, phosphate.\n  ALP, creatinine, TSH.\n  25-hydroxyvitamin D.\n  PTH.\n  Serum protein electrophoresis (if multiple myeloma is suspected)." }
    status: unverified
  - id: rheum.L14.023
    kind: table
    topic: nonpharm
    title: Non-pharmacologic treatment of osteoporosis (p224)
    columns: [Measure, Detail]
    rows:
      - [Calcium, "1000–1200 mg/day (diet plus supplements if needed)"]
      - [Vitamin D, "800–1000 IU/day, adjusted to 25(OH)D"]
      - [Exercise, Weight-bearing and resistance training]
      - [Fall prevention, "Home safety, vision correction, strength and balance training"]
      - [Lifestyle, "Stop smoking, alcohol < 2 drinks/day"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 224, quote: "Non-Pharmacologic Treatment\n  Calcium intake: 1000–1200 mg/day (diet + supplements if needed).\n  Vitamin D: 800–1000 IU/day (adjust based on 25(OH)D levels).\n  Exercise: Weight-bearing and resistance training.\n  Fall prevention: Home safety, vision correction, strength/balance training.\n  Lifestyle: Smoking cessation and limited alcohol (<2 drinks/day)." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L14.024
    kind: cloze
    topic: nonpharm
    text: In osteoporosis give calcium {{c1::1000–1200 mg/day}} and vitamin D {{c2::800–1000 IU/day}}.
    src: { page: 224, quote: "Non-Pharmacologic Treatment\n  Calcium intake: 1000–1200 mg/day (diet + supplements if needed).\n  Vitamin D: 800–1000 IU/day (adjust based on 25(OH)D levels).\n  Exercise: Weight-bearing and resistance training.\n  Fall prevention: Home safety, vision correction, strength/balance training.\n  Lifestyle: Smoking cessation and limited alcohol (<2 drinks/day)." }
    status: unverified
    tags: [numbers]
  - id: rheum.L14.025
    kind: enumerate
    topic: indications
    prompt: Postmenopausal women or men ≥ 50 years need drug treatment if they have...
    points:
      - Hip or vertebral fracture
      - "T-score ≤ –2.5 at spine, femoral neck or total hip"
      - "Osteopenia (T –1 to –2.5) with a high FRAX score"
    pass: 3
    hook: "علاج بالدوا لو «اتكسر، أو الرقم وحش، أو الرقم نص نص والـ FRAX عالي»: hip أو vertebral fracture، T-score سالب 2.5 أو أقل، أو osteopenia مع FRAX عالي."
    src: { page: 224, quote: "Hip or vertebral fracture.\nT-score ≤ –2.5 at spine, femoral neck, or total hip." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L14.026
    kind: card
    topic: bisphosphonates
    front: Name four bisphosphonates and their mechanism.
    back: Alendronate, risedronate, ibandronate, zoledronic acid; they inhibit osteoclast-mediated bone resorption and raise BMD.
    src: { page: 224, quote: "Bisphosphonates\n  Examples: Alendronate, Risedronate, Ibandronate, Zoledronic acid.\n  Mechanism: Inhibit osteoclast-mediated bone resorption → increase bone mineral density." }
    status: unverified
    tags: [high-yield]
  # ---------- p225: bisphosphonates ----------
  - id: rheum.L14.027
    kind: card
    topic: bisphosphonates
    front: Where are bisphosphonates first-line?
    back: Postmenopausal, steroid-induced and male osteoporosis.
    src: { page: 225, quote: "Indications\n  First-line for postmenopausal osteoporosis, steroid-induced osteoporosis, male osteoporosis." }
    status: unverified
  - id: rheum.L14.028
    kind: table
    topic: bisphosphonates
    title: Bisphosphonate doses (p225)
    columns: [Drug, Dose]
    rows:
      - [Alendronate, 70 mg weekly orally]
      - [Risedronate, 35 mg weekly]
      - [Zoledronic acid, 5 mg IV yearly]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 225, quote: "Administration\n  Alendronate: 70 mg weekly (oral).\n  Risedronate: 35 mg weekly.\n  Zoledronic acid: 5 mg IV yearly." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L14.029
    kind: card
    topic: bisphosphonates
    front: How must oral bisphosphonates be taken?
    back: On an empty stomach with a full glass of water, staying upright for at least 30–60 minutes.
    src: { page: 225, quote: "Instructions\n  Take on empty stomach with a full glass of water.\n  Stay upright for at least 30–60 minutes." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L14.030
    kind: enumerate
    topic: bisphosphonates
    prompt: Side effects of bisphosphonates.
    points:
      - GI irritation (oral forms)
      - Flu-like symptoms (IV)
      - "Rare: atypical femoral fractures"
      - "Rare: osteonecrosis of the jaw"
    pass: 3
    hook: "الـ bisphosphonate «بالبُق معدة، بالوريد دور برد، ونادر فخذ وفك»: GI irritation، flu-like، atypical femoral fractures، وONJ."
    src: { page: 225, quote: "Side Effects\n  GI irritation (oral forms).\n  Flu-like symptoms (IV).\n  Rare: Atypical femoral fractures, osteonecrosis of the jaw (ONJ)." }
    status: unverified
  - id: rheum.L14.031
    kind: enumerate
    topic: bisphosphonates
    prompt: Contraindications to bisphosphonates.
    points:
      - Esophageal disorders
      - Hypocalcemia
      - "Severe renal impairment (eGFR < 30–35 mL/min)"
    pass: 3
    hook: "الـ bisphosphonate «لا للمريء، لا للكالسيوم الواطي، لا للكلية الضعيفة»: esophageal disorders، hypocalcemia، وeGFR أقل من 30 لـ 35."
    src: { page: 225, quote: "Esophageal disorders Hypocalcemia Severe renal impairment (eGFR <30–35 mL/min)" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L14.032
    kind: card
    topic: denosumab
    front: Denosumab - brand, dose and mechanism?
    back: Prolia 60 mg SC every 6 months; a monoclonal antibody to RANKL that inhibits osteoclast formation and survival.
    src: { page: 225, quote: "Denosumab (Prolia – 60 mg SC every 6 months).\n  Mechanism: Monoclonal antibody to RANKL → inhibits osteoclast formation and survival." }
    status: unverified
    tags: [high-yield]
  # ---------- p226: denosumab, SERM ----------
  - id: rheum.L14.033
    kind: card
    topic: denosumab
    front: Indications and benefits of denosumab?
    back: High fracture risk and CKD (not nephrotoxic); raises BMD at spine and hip and is well tolerated.
    src: { page: 226, quote: "Indications\n  High fracture risk patients.\n  CKD patients (not nephrotoxic)." }
    status: unverified
  - id: rheum.L14.034
    kind: enumerate
    topic: denosumab
    prompt: Risks of denosumab.
    points:
      - Hypocalcemia, especially in CKD
      - Osteonecrosis of the jaw
      - Infections
      - Rebound vertebral fractures if stopped without another agent
    pass: 3
    hook: "denosumab «كالسيوم، فك، عدوى، وما توقفوش فجأة»: hypocalcemia خصوصًا CKD، ONJ، infections، وrebound vertebral fractures لو اتوقف من غير بديل."
    src: { page: 226, quote: "Hypocalcemia (especially with CKD). ONJ. Infections." }
    status: unverified
  - id: rheum.L14.035
    kind: card
    topic: denosumab
    front: What happens if denosumab is stopped without a follow-on drug?
    back: Rebound vertebral fractures may occur.
    src: { page: 226, quote: "Important: Rebound vertebral fractures may occur if discontinued without transition to another agent." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L14.036
    kind: card
    topic: serm-hrt
    front: How does raloxifene act on bone, breast and uterus?
    back: Estrogen agonist in bone (less resorption); antagonist in breast and uterus.
    src: { page: 226, quote: "Selective Estrogen Receptor Modulators (SERMs)\n  Example: Raloxifene.\n  Mechanism: Estrogen agonist in bone → reduces bone resorption; antagonist in breast/uterus." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L14.037
    kind: card
    topic: serm-hrt
    front: Who suits raloxifene best, and who should not get it?
    back: Postmenopausal women, especially at risk of breast cancer; not for men or patients at high fracture risk.
    src: { page: 226, quote: "Use\n  Prevention and treatment in postmenopausal women.\n  Especially those at risk for breast cancer." }
    status: unverified
  - id: rheum.L14.038
    kind: card
    topic: serm-hrt
    front: Risks of raloxifene?
    back: Hot flashes and VTE (DVT, PE).
    src: { page: 226, quote: "Risks\n  Hot flashes.\n  VTE risk (DVT, PE).\n    Not for: Use in men or high-risk fracture patients." }
    status: unverified
  # ---------- p227: HRT, anabolics ----------
  - id: rheum.L14.039
    kind: card
    topic: serm-hrt
    front: Role of HRT in osteoporosis and its risks?
    back: For symptomatic menopausal women with osteoporosis risk, not for prevention alone; raises breast cancer, thromboembolism and stroke risk.
    src: { page: 227, quote: "Increased risk of breast cancer, thromboembolism, stroke.\n  Not recommended solely for osteoporosis prevention." }
    status: unverified
  - id: rheum.L14.040
    kind: card
    topic: anabolic
    front: Teriparatide - what is it and how does it work?
    back: PTH 1–34; stimulates osteoblasts to form new bone (anabolic).
    src: { page: 227, quote: "Teriparatide (PTH 1–34)\n  Mechanism: Stimulates osteoblast activity → promotes new bone formation.\n  Dose: 20 mcg SC daily (max 2 years)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L14.041
    kind: cloze
    topic: anabolic
    text: Teriparatide is given {{c1::20 mcg}} SC daily for a maximum of {{c2::2 years}}.
    src: { page: 227, quote: "Teriparatide (PTH 1–34)\n  Mechanism: Stimulates osteoblast activity → promotes new bone formation.\n  Dose: 20 mcg SC daily (max 2 years)." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L14.042
    kind: enumerate
    topic: anabolic
    prompt: Indications for teriparatide.
    points:
      - "Severe osteoporosis (T-score ≤ –3.0)"
      - Multiple vertebral fractures
      - Failure of or intolerance to bisphosphonates
    pass: 3
    hook: "teriparatide «شديدة، كسور كتير، أو الـ bisphosphonate فشل»: T-score سالب 3 أو أقل، multiple vertebral fractures، وfailure أو intolerance للـ bisphosphonates."
    src: { page: 227, quote: "Indications\n  Severe osteoporosis (T-score ≤ –3.0).\n  Multiple vertebral fractures.\n  Failed/intolerant of bisphosphonates." }
    status: unverified
  - id: rheum.L14.043
    kind: card
    topic: anabolic
    front: Side effects and boxed warning of teriparatide?
    back: Nausea, leg cramps, hypercalcemia; boxed warning of osteosarcoma in rats (not seen in humans).
    src: { page: 227, quote: "Black box warning: osteosarcoma in rats (not seen in humans)." }
    status: unverified
  - id: rheum.L14.044
    kind: card
    topic: anabolic
    front: Romosozumab - mechanism, dose and use?
