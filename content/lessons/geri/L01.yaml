        title: "سلّم الـ HFrEF (ESC 2016)"
        alt: "Ladder: symptomatic HFrEF; start ACE inhibitor and beta-blocker; if still symptomatic with LVEF 35% or less, add MR antagonist; if still symptomatic, three branches: ARNI to replace ACEI, CRT if sinus rhythm with QRS 130 ms or more, ivabradine if sinus rhythm with heart rate 70 or more; resistant symptoms lead to digoxin, H-ISDN, LVAD or transplant. Side bars: diuretics for congestion, ICD if LVEF 35% or less despite therapy."
        caption: "كل درجة: لو لسه **symptomatic** و **LVEF ≤35%** اطلع اللي بعدها. والـ diuretics للـ congestion في أي درجة، والـ ICD لو LVEF ≤35% رغم العلاج."
        svg: |
          <svg viewBox="0 0 330 370" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L01c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
