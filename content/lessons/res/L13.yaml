  # ------------------------------------------------------------------
  - id: res.L13.lesson9
    title: "موقع وجدول ووحدات، و EndNote يريّحك"
    hook: "الموقع ليه تاريخين: يوم ما اتنشر، ويوم ما انت فتحته. والفرق بينهم بيجي في الامتحان."
    minutes: 7
    pages: [103, 114]
    topics: [web-extras]
    goals:
      - "تكتب مرجع موقع"
      - "تعرف ملاحظات Vancouver على الجداول والصور والوحدات"
      - "تعرف EndNote بيعمل إيه"
    status: unverified
    steps:
      - kind: explain
        page: 103
        quote: "Citing a Website\n(If the author is not documented, the title becomes the first element of the reference.)\nFormat:\nAuthor (full-stop after last author, 1 space) Title (full-stop, 1 space) [Online] (full stop, 1 space) Publication Year (1 space) [cited year month (abbreviated) day] (semi colon) Number of screens in square brackets or pages (full-stop, 1 space) Available from (colon, 1 space) URL: (no space) URL address underlined"
        title: "مرجع الموقع"
        text: |
          المؤلف. العنوان. **[Online].** سنة النشر **[cited سنة شهر يوم]**; عدد الـ screens أو الصفحات. **Available from: URL:**الرابط

          ولو **مافيش مؤلف**، العنوان يبقى ==أول عنصر==.
      - kind: explain
        page: 104
        quote: "Citing a Website\nNOTE:\nThe number of screens is NOT necessary. Put a semi colon and 1 space after the cited date if no pages or screen numbers are listed.\nWhen the date is approximated, indicate that by following the date with a question mark and inserting the statement in square brackets. Eg. [2001?]"
        title: "ملاحظتين"
        text: |
          - عدد الـ **screens مش ضروري**؛ لو مش كاتبه، حط semicolon ومسافة بعد تاريخ الـ cited.
          - التاريخ **تقريبي**؟ حط علامة استفهام بين أقواس مربعة: ==[2001?]==.
      - kind: check
        page: 105
        quote: "Citing a Website\nExamples:\nNational Organization for Rare Diseases [Online]. 1999 Aug 16 [cited 1999 Aug 21]; Available from: URL:http://www.rarediseases.org/\nRoyal College of General Practitioners. The primary health care team. [Online]. 1998 [cited 1999 Aug 22];[10 screens]. Available from: URL:http://ww.rcgp.org.uk/informat/publicat/rcf0021.htm\nZand J. The natural pharmacy: herbal medicine for depression [Online]. [1999?] [cited 2001 Aug 23];[15 screens]. Available from: URL:http://www.healthy.net/asp/templates/Article.asp?PageType=Article&Id=920"
        question: "In \"1999 Aug 16 [cited 1999 Aug 21]\", what is Aug 21?"
        options: ["The day you accessed the page", "The publication date", "The last update of the site", "The date the author was born"]
        answer: 0
        why:
          - "صح: الـ cited = اليوم اللي انت رجعت فيه للصفحة."
          - "تاريخ النشر هو 1999 Aug 16، قبل القوس."
          - "مش مذكور كده في السلايد."
          - "طبعًا لأ 😄."
      - kind: explain
        page: 106
        quote: "Additional notes on the Vancouver style\nIllustrations, tables, figures drawn from sources should also be referenced\nTABLES\nEach table should be given a brief TITLE.\nNumber each table in the text in CONSECTIVE ORDER.\nExplanatory matter is placed in FOOTNOTES, NOT in the HEADING."
        title: "الجداول والصور اللي جاية من مصادر"
        text: |
          برضه **لازم reference**. وكمان:
          - **الجدول**: عنوان قصير (brief TITLE)، مترقّم في النص ==بالترتيب==، والشرح في الـ **footnotes مش في الـ heading**.
          - **الصورة**: مترقّمة بالترتيب، تنسب **المصدر الأصلي**، والـ legends بأرقام قصاد الصور.
      - kind: figure
        page: 107
        title: "شريحة 107: جدول مكتوب صح"
        image: { file: res/L13-s107-table-example.webp, book: true }
        alt: "A journal table. On top, in a red box, the title: TABLE 3 Comparison of Anthropometric Parameters In Patient and Control Groups. Below it columns for the patient group at initial presentation and at 6th month, the control group, and P values, with rows for weight, height, body mass index, weight for height and triceps skinfold thickness. Under the table two footnotes marked a and b explain what each P value compares."
        caption: |
          مثال للقواعد اللي فوق في جدول حقيقي:

          - **فوق**: رقم الجدول وعنوان قصير (**Table 3** ...).
          - **تحت**: الشرح في ==footnotes بحروف (a و b)==، مش جوه العنوان.

          اللي تاخده: العنوان قصير، وأي شرح زيادة بينزل تحت الجدول.
      - kind: explain
        page: 108
        quote: "Additional notes on the Vancouver style\nILLUSTRATIONS and FIGURES\nNumber each figure in the text in CONSECTIVE ORDER.\nThe original source should be ACKNOWLEDED.\nThe legends should be labelled with NUMERALS corresponding to the figures etc."
        title: "الصور والرسومات"
        text: |
          ملاحظات Vancouver على الـ illustrations والـ figures:

          - رقّم كل figure في النص ==بالترتيب==.
          - ==اذكر المصدر الأصلي==.
          - الـ legends بتاخد ==أرقام== زي الـ figures.

          ليه الأرقام؟ علشان القارئ يلاقي الصورة اللي النص بيتكلم عنها من غير ما يدوّر. التفسير المقبول (مش في الكتاب).
      - kind: figure
        page: 109
        title: "شريحة 109: figure ومعاها legend"
        image: { file: res/L13-s109-figure-example.webp, book: true }
        alt: "Bar chart of rate per million by age at diagnosis (0-4, 5-9, 10-14, 15-19), blue bars for testicular and red bars for ovarian germ cell tumors; the blue bar at 15-19 is by far the tallest. Below, in a red box, the legend: FIGURE 9. Age-Specific Incidence Rates for Gonadal Germ Cell Tumors, United States, 2006 to 2010, followed by notes and the data source, North American Association of Central Cancer Registries."
        caption: |
          مثال لقواعد الـ figures في رسمة حقيقية:

          - **تحت الرسمة**: الـ legend بيبدأ ==برقم (Figure 9)== وبعده العنوان.
          - **آخر الـ legend**: ==المصدر الأصلي== للبيانات (Source: ...).

          اللي تاخده: الجدول عنوانه فوقه، والـ figure الـ legend بتاعها تحتها، والاتنين مترقمين وبيذكروا المصدر.
      - kind: table
        page: 110
        quote: "Additional notes on the Vancouver style\nMEASUREMENT\nLength, height, weight and volume should be reported in METRIC UNITS.\nTemperatures should be in DEGREE CELCIUS.\nBlood Pressure measured in MM OF MERCURY.\nAll hematological and biochemistry measurements stated in SI UNITS."
        title: "الوحدات"
        columns: ["Measurement", "Unit"]
        rows:
          - ["Length, height, weight, volume", "Metric units"]
          - ["Temperature", "Degrees Celsius"]
          - ["Blood pressure", "mm of mercury"]
          - ["Hematology and biochemistry", "SI units"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: figure
        page: 114
        quote: "Adding references from PubMed"
        title: "الـ references بتدخل EndNote منين؟"
        alt: "Three source boxes on the left, PubMed, ScienceDirect and Manual entry, each with an arrow into a central box labelled EndNote library. From the library an arrow goes to a Word document showing a citation (1) and a numbered reference list, labelled Style: Vancouver."
        caption: "من **PubMed** (Send to ← Citation manager)، من **ScienceDirect** (Export ← RIS)، أو **بإيدك**. وبعدين EndNote يحط الـ citations والليستة في Word بالـ style اللي تختاره."
        svg: |
          <svg viewBox="0 0 330 190" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L13c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <rect x="5" y="15" width="95" height="32" rx="8" class="fg-box"/><text x="52" y="36" text-anchor="middle" class="t-sm t-b">PubMed</text>
            <rect x="5" y="79" width="95" height="32" rx="8" class="fg-box"/><text x="52" y="100" text-anchor="middle" class="t-sm t-b">ScienceDirect</text>
            <rect x="5" y="143" width="95" height="32" rx="8" class="fg-box"/><text x="52" y="164" text-anchor="middle" class="t-sm t-b">Manual entry</text>
            <path d="M100 31L135 84M100 95H133M100 159L135 106" class="fg-arrow-acc" marker-end="url(#L13c)"/>
            <rect x="137" y="70" width="80" height="50" rx="10" class="fg-acc"/><text x="177" y="92" text-anchor="middle" class="t-sm t-b">EndNote</text><text x="177" y="108" text-anchor="middle" class="t-sm">library</text>
            <path d="M217 95H243" class="fg-arrow-acc" marker-end="url(#L13c)"/>
            <rect x="245" y="40" width="80" height="110" rx="6" class="fg-box"/>
            <text x="285" y="58" text-anchor="middle" class="t-sm t-b">Word</text>
            <text x="252" y="80" class="t-sm">...text (1)</text>
            <line x1="252" y1="92" x2="318" y2="92" class="fg-thin"/>
            <text x="252" y="110" class="t-sm">1. ...</text>
            <text x="252" y="126" class="t-sm">2. ...</text>
            <text x="285" y="168" text-anchor="middle" class="t-sm t-mut">Style: Vancouver</text>
          </svg>
      - kind: explain
        page: 111
        quote: "Endnote X7\nEndNote is a software program that works with Microsoft Word to automatically format\n– in-text citations and\n– end-of-paper reference lists with your chosen style"
        title: "EndNote"
        text: |
          ==EndNote== برنامج بيشتغل مع **Microsoft Word** وبيظبط لوحده:
          - الـ **in-text citations**.
          - والـ **reference list** في آخر الـ paper، بالـ style اللي تختاره (Vancouver مثلًا).
      - kind: aside
        tone: tip
        page: 111
        quote: "Endnote X7\nEndNote is a software program that works with Microsoft Word to automatically format\n– in-text citations and\n– end-of-paper reference lists with your chosen style"
        text: "في رسالتك، ابدأ EndNote (أو أي reference manager) من أول مرجع. لما المشرف يقولك «غيّر ترتيب الفصول»، الأرقام كلها هتتظبط لوحدها بدل ما تعدّل 200 رقم بإيدك."
      - kind: try
        items: [res.L13.093, res.L13.097, res.L13.099, res.L13.101]
    recap:
      - "الموقع: مؤلف (أو العنوان). [Online]. سنة [cited تاريخ]; Available from: URL:"
      - "الـ screens مش ضرورية؛ التاريخ التقريبي [2001?]."
      - "جدول: عنوان قصير، بالترتيب، الشرح في الـ footnotes؛ صورة: بالترتيب، المصدر، legend بأرقام."
      - "Metric، Celsius، mmHg للضغط، SI للتحاليل."
      - "EndNote مع Word بيظبط الـ citations والليستة؛ والمراجع من PubMed أو ScienceDirect أو بإيدك."
    practice: [res.L13.093, res.L13.094, res.L13.095, res.L13.096, res.L13.097, res.L13.098, res.L13.099, res.L13.100, res.L13.101]
