          الـ **chronic lymphocytic leukaemia (CLL)** = تراكم ==monoclonal lymphocytes==، **B cell** في أكتر من 95%.

          بيتراكموا في الـ **marrow** والـ **nodes** والـ **liver** والـ **spleen**. أغلب العيانين **فوق 60**.

