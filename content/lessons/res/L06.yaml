          </svg>
      - kind: order
        page: 4
        quote: "Hierarchy of Research Designs & Levels of Scientific Evidence (based on ability to control for bias and to demonstrate cause and effect in humans), top to bottom:\n  Secondary, pre-appraised, or filtered Studies:\n    Clinical Practice Guidelines\n    Meta-Analysis, Systematic Reviews\n  Primary Studies:\n    Randomized Controlled Trial. Prospective, tests treatment\n    Observational Studies: Cohort Studies. Prospective: cohort has been exposed to a risk. Observe for outcome of interest\n    Observational Studies: Case Control Studies. Retrospective: subjects have the outcome of interest; looking for risk factor\n  No design: Case Report or Case Series; Narrative Reviews, Expert Opinions, Editorials\n  Not involved w/ humans: Animal and Laboratory Studies"
        prompt: "رتّب هرم الـ evidence من فوق لتحت:"
        steps:
          - "Clinical practice guidelines"
          - "Meta-analysis and systematic reviews"
          - "Randomized controlled trial"
          - "Cohort studies"
          - "Case-control studies"
          - "Case reports and expert opinion"
          - "Animal and laboratory studies"
        why: "الترتيب على قد ما التصميم يقدر **يتحكم في الـ bias ويثبت cause and effect في الإنسان**. الـ RCT أعلى primary study لأن الباحث هو اللي بيوزّع الـ exposure بالقرعة."
      - kind: explain
        remind: [res.L06.008]
        page: 6
        quote: "Interventions that Can be Evaluated:\n  New drugs and new treatment of diseases\n  New medical and health care technology\n  New methods of primary prevention\n  New programs of screening\n  New ways of organizing and delivering health services\n  New community health programs\n  New behavioral intervention programs"
        title: "بنجرّب إيه بالـ RCT؟ مش أدوية بس"
        text: |
          ناس كتير فاكرة الـ trial يعني دوا. المحاضرة بتعدّ **7 حاجات** ممكن نقيّمها:

          - **New drugs** و new treatment of diseases
          - **New medical and health care technology** (جهاز، عملية)
          - **New methods of primary prevention** (vaccine مثلًا)
          - **New programs of screening**
          - **New ways of organizing and delivering health services** (زي نظام حجز جديد في العيادات)
          - **New community health programs**
          - **New behavioral intervention programs** (برنامج للإقلاع عن التدخين)

          الدكتورة قالت في الشرح أمثلة زيادة: نقارن **تقديم الخدمة في العيادة** بتقديمها **جوه المستشفى**، أو نقيّم **برنامج تثقيف صحي**، أو **تحسين البيئة**. كلها interventions بنقدر نخصصها ونقارن نتايجها.
      - kind: aside
        tone: joke
        page: 7
        quote: "The first RCT in medicine:\n  Credited to Sir A. Bradford Hill, an epidemiologist for England's Medical Research Council.\n  The trial, published in the British Medical Journal in 1948, tested whether streptomycin is effective in treating tuberculosis"
        text: |
          أول RCT في الطب: **Sir Austin Bradford Hill**، الـ Medical Research Council في إنجلترا، اتنشر في الـ **BMJ سنة 1948**، وجرّب **streptomycin** في الـ **tuberculosis**.

          قبلها كان الـ evidence عبارة عن: «يا دكتور أنا جرّبته على تلات عيانين وبقوا زي الفل». 😄 ومن ساعتها الجملة دي بقت **case series**، تحت في الهرم.
      - kind: explain
        remind: [res.L06.013]
        page: 12
        quote: "RCT is an experiment in which subjects in a population are randomly allocated into groups:\n  An experimental to receive preventative or therapeutic procedure or intervention (intervention group) and\n  A control to receive: placebo; no treatment; usual care (active control)\nand the outcomes are compared."
        title: "يعني إيه RCT بالظبط؟"
        text: |
          ==RCT== = experiment الناس فيه بيتوزّعوا **randomly** على مجموعتين:

          - **Intervention group**: بياخد الـ preventive أو therapeutic intervention.
          - **Control group**: بياخد واحد من 3: **placebo**، أو **no treatment**، أو **usual care** (اسمها **active control**).

          وبعدين **نقارن الـ outcomes**.

          وفي الـ RCT إحنا اللي **بنتحكم في الـ exposure**: نوعه، كميته، ومدته.
      - kind: mnemonic
        page: 11
        quote: "Randomized controlled trials: We are controlling the exposure (intervention) regarding:\n  Type\n  Amount\n  Duration"
        word: "TAD"
        parts:
          - { key: "T", text: "Type: نوع الـ intervention (أنهي دوا، أنهي برنامج)" }
          - { key: "A", text: "Amount: الجرعة أو الكمية" }
          - { key: "D", text: "Duration: المدة" }
        hook: "في الـ cohort الناس بتختار الـ exposure بمزاجها. في الـ RCT إنت اللي ماسك **TAD**: النوع والكمية والمدة."
      - kind: match
        page: 12
        quote: "RCT is an experiment in which subjects in a population are randomly allocated into groups:\n  An experimental to receive preventative or therapeutic procedure or intervention (intervention group) and\n  A control to receive: placebo; no treatment; usual care (active control)\nand the outcomes are compared."
        prompt: "وصّل كل control group بنوعه:"
        pairs:
          - ["Sugar pills that look like the new drug", "Placebo"]
          - ["The drug they would get in clinic anyway", "Usual care (active control)"]
          - ["Nothing at all, just follow-up visits", "No treatment"]
        why: "الـ **placebo** شكله زي الدوا ومفيهوش مادة فعالة. الـ **usual care** هو العلاج المعتاد، فاسمه **active control**. والـ **no treatment** متابعة بس."
      - kind: reveal
        page: 8
        quote: "Types of intervention studies:\n  Randomized interventional studies\n  Non randomized interventional studies (Quasi experimental trials)\nRandomization is a key feature"
        prompt: "المحاضرة بتقول ==Randomization is a key feature==. ليه القرعة مهمة أوي كده؟"
        answer: |
          لأن القرعة بتوزّع كل حاجة **بالتساوي** بين المجموعتين: السن، الشدة، التدخين، وحتى الحاجات اللي إنت متعرفهاش ومش بتقيسها.

          فلو لقيت فرق في الـ outcome، يبقى غالبًا من الـ intervention نفسه، مش من إن الدكتور ادّى الدوا الجديد للعيانين الأحسن. (الـ randomization بتمنع **confounding bias**، وهنرجعلها في درس الـ blinding.)
      - kind: try
        items: [res.L06.001, res.L06.012, res.L06.013]
    recap:
      - "Experimental = الباحث هو اللي **assigned** الـ exposure. لو بالقرعة: RCT. من غير قرعة: quasi-experimental."
      - "الهرم مترتّب على التحكم في الـ bias وإثبات السببية؛ الـ RCT أعلى primary design."
      - "أول RCT: Bradford Hill، BMJ 1948، streptomycin للـ tuberculosis (TB)."
      - "الـ control: placebo، no treatment، أو usual care (active control)."
      - "في الـ RCT بنتحكم في الـ exposure: Type, Amount, Duration."
    practice: [res.L06.001, res.L06.002, res.L06.003, res.L06.004, res.L06.005, res.L06.006, res.L06.007, res.L06.008, res.L06.009, res.L06.010, res.L06.011, res.L06.012, res.L06.013, res.L06.014, res.L06.090]
  # ------------------------------------------------------------------
  - id: res.L06.lesson2
    title: "علاج ولا وقاية؟ أحسن ولا مش أوحش؟"
    hook: "دوا أرخص وأقل أعراض جانبية... محتاج يثبت إنه أحسن؟ ولا كفاية إنه مش أوحش؟"
    minutes: 10
    pages: [13, 35]
    topics: [trial-types, superiority]
    goals:
      - "تفرّق بين therapeutic و preventive trial"
      - "تفرّق بين efficacy و effectiveness"
      - "تختار بين superiority و equivalence و non-inferiority"
    status: unverified
    steps:
      - kind: explain
        page: 13
        quote: "Types of RCT's, classification schemes:\n  Based on the aspects of interventions being evaluated\n  Based on how participants are exposed to interventions\n  Based on whether goal is evaluation of superiority vs. equivalence\n  Based on whether investigators and/or participants know which intervention is being studied"
        title: "4 طرق نصنّف بيها الـ RCT"
        text: |
          نفس التجربة ممكن توصفها بـ 4 طرق مختلفة، وكل طريقة بتجاوب سؤال:

          - **Aspect of the intervention**: علاج ولا وقاية؟ (الدرس ده)
          - **How participants are exposed**: parallel، crossover، factorial... (الدرس الجاي)
          - **Superiority vs equivalence**: عايز تثبت إيه؟ (الدرس ده)
          - **Who knows what**: الـ blinding (درس لوحده)

          يعني تجربة واحدة ممكن تبقى «therapeutic, parallel, non-inferiority, double-blind» في نفس الوقت.
      - kind: explain
        page: 14
        quote: "Based on the aspects of interventions being evaluated: Type\n  Clinical (Therapeutic) Trial: Testing the efficacy of a therapeutic procedure (Drug, Surgical procedure etc.)\n  Preventive Trial: Testing the efficacy of a preventive procedure (Vaccine, Sera, Chemoprophylaxis, personal protective measure, exercise programme etc.)"
        title: "Therapeutic ولا preventive؟"
        text: |
          - ==Clinical (therapeutic) trial==: بيختبر efficacy لـ **therapeutic procedure**: دوا، عملية جراحية.
          - ==Preventive trial==: بيختبر efficacy لـ **preventive procedure**: vaccine، sera، chemoprophylaxis، personal protective measure، exercise programme.

          أمثلة المحاضرة:
          - Therapeutic: **β-Blocker Heart Attack Trial (B-HAT)**، journal of the American Medical Association (JAMA) 1981.
          - Prevention: تجربة **perinatal transmission of human immunodeficiency virus (HIV)**، New England Journal of Medicine (NEJM) 1994.
      - kind: explain
        page: 15
        quote: "Types of intervention studies. Example of a therapeutic trial: The β-Blocker Heart Attack Trial (B-HAT), life-table cumulative mortality curves for propranolol and placebo groups. The β-Blocker Heart Attack trial. JAMA, Nov. 6, 1981;246(18):2073"
        title: "مثال therapeutic: الـ B-HAT"
        text: |
          الـ ==β-Blocker Heart Attack Trial (B-HAT)== (JAMA 1981): عيانين بعد heart attack خدوا **propranolol** أو **placebo**، والمحاضرة بتوري منحنيات الـ cumulative mortality للمجموعتين.

          ليه ده **therapeutic**؟ لأن الناس عندهم المرض فعلًا (جالهم heart attack)، والسؤال: العلاج ده بيقلل الوفيات بعده؟ التفسير المقبول (مش في الكتاب).
      - kind: figure
        page: 15
        title: "شريحة 15: منحنيات الوفيات في الـ B-HAT"
        image: { file: res/L06-s15-bhat.webp, book: true }
        alt: "Line chart titled Life-table cumulative mortality curves for propranolol hydrochloride and placebo groups. Horizontal axis: months of follow-up, 0 to 30; vertical axis: cumulative mortality, 0 to 14 percent. The dashed Placebo curve rises to about 10 percent at 30 months; the solid Propranolol curve stays below it the whole way and ends near 8 percent. Under the axis, N falls from 3837 at the start to 1202 at 30 months."
        caption: |
          دي المنحنيات اللي الخطوة فوق بتتكلم عنها:

          - **المحور الأفقي**: **Months of Follow-up** من 0 لـ 30.
          - **المحور الرأسي**: **Cumulative Mortality, %**: نسبة اللي ماتوا لحد اللحظة دي.
          - **الخط المتقطّع (Placebo)**: بيوصل حوالي **10%** عند 30 شهر.
          - **الخط السادة (Propranolol)**: ==تحت الـ placebo طول الوقت==، وبيخلص قرب **8%**.
          - **تحت خالص**: **N** = عدد العيانين اللي لسه متابعين، من 3837 لحد 1202.

          اللي تاخده: المنحنيين بيبعدوا عن بعض من الأول وبيفضلوا بعاد؛ ده شكل ==therapeutic trial ناجح==: العلاج قلّل الوفيات بعد الـ heart attack.
      - kind: check
        page: 16
        quote: "Types of intervention studies. Example of a prevention trial: Perinatal transmission of HIV\nProbability of Transmission (%) by weeks: Placebo 25.5%; Zidovudine 8.3%\nNEJM 11/3/1994; 331(18):1173-1180"
        question: "In the perinatal HIV transmission trial (NEJM 1994), what was the probability of transmission with zidovudine versus placebo?"
