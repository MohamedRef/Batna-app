        answer: 0
        why: "Below 0.5 × 10⁹/L the patient is likely to have recurrent infections (p67). 1.5 is the Middle East lower limit. 0.2 is far below that."
      - question: In the lecture's list, which group of causes does carbimazole belong to?
        options: [Drugs, Immune disorders, Marrow aplasia, Hypersplenism]
        answer: 0
        why: "Drugs are cause 6 of neutropenia (p68). The other options are separate groups in the same list."
      - reveal: "Blood cultures grow Pseudomonas and she worsens despite antibiotics; ANC stays below 0.5."
        question: Which blood component could be considered?
        options: [Granulocyte transfusion, Platelet transfusion, Cryoprecipitate, Albumin]
        answer: 0
        why: "Granulocytes are indicated for ANC below 0.5 × 10⁹/L with documented infection (lecture 6, p91). Platelets, cryoprecipitate and albumin do not supply neutrophils."
