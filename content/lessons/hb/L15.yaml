  - id: hb.L15.lesson3
    title: "نصوّر إمتى؟ وإزاي نعرف إنه هيقلب severe؟"
    hook: "الـ CT بدري زي ما تفتح الفرن بعد 5 دقايق. امتى نصوّر، بإيه، ومين المريض اللي لازم ICU."
    minutes: 9
    pages: [281, 285]
    topics: [ap-labs, ap-severity]
    goals:
      - "تقول ليه الـ contrast CT مش روتين، وتعدّ الـ 3 indications"
      - "تحسب الـ CT severity index"
      - "تختار التحليل أو الأشعة المناسبة لكل موقف"
      - "تعدّ الـ risk factors للـ severe course"
    status: unverified
    steps:
      - kind: explain
        page: 281
        title: "أول أشعة: سونار لكل الناس"
        text: |
          **Abdominal U/S** لازم يتعمل لكل مريض AP **on admission**. ليه السونار بالذات؟ لأنه بيجاوب على أهم سؤال: **فيه gall stones؟** (أشهر سبب، وبيغيّر العلاج كله). وكمان بيشوف بنكرياس swollen non-homogenous، وده يكمّل معيار الـ imaging.

          **لو السبب لسه مش باين (idiopathic AP)**، الـ guideline في ص 281:
          - كرّر الـ US، أو اعمل **MRI** و/أو **EUS** علشان تلقط حصوة صغيرة أو sludge.
          - بعد تاني نوبة مالهاش سبب، في مريض يستحمل العملية: الـ guideline بيقترح **cholecystectomy**، لأن حصوات صغيرة جدًا ممكن تكون مستخبية.
      - kind: reveal
        page: 281
        prompt: "طب ليه منعملش **contrast CT** لكل مريض pancreatitis من أول يوم؟ هات 3 أسباب."
        answer: |
          الكتاب:

          - التشخيص واضح في أغلب المرضى، ومعظمهم **mild uncomplicated**.
          - الـ **CECT** حساسيته واطية بدري، لحد ما الـ edema والـ fat stranding والـ collections يظهروا.
          - الصبغة **IV contrast** ممكن **تزوّد الـ ischemia والـ necrosis والـ AKI**، خصوصًا قبل الـ fluid resuscitation.
      - kind: aside
        tone: analogy
        page: 281
        text: |
          الـ CT في أول يوم زي ما تفتح باب الفرن بعد 5 دقايق وتحكم على الكيكة: لسه مبانش هتطلع ولا هتهبط، وكمان فتح الباب نفسه ممكن يبوّظها (الصبغة على كلية ناشفة).

          استنى 48–72 ساعة، وصوّر لو الكيكة مش ماشية كويس.
      - kind: explain
        page: 282
        title: "امتى نعمل contrast CT؟"
        text: |
          **Indications of contrast CT** في الكتاب 3، وكل واحد ليه سؤال بيجاوبه:
          - **Uncertain diagnosis**: هل ده بنكرياس أصلًا، ولا perforation أو ischemia؟
          - **Failure of improvement within 48–72 hrs**: فيه necrosis أو collections أو مضاعفات؟ (الوقت ده كفاية إن الـ necrosis تبان).
          - **Patient > 40 years** من غير سبب واضح: فيه pancreatic tumor سادد الـ duct؟

          **Follow up**:
          - **Severe AP** (أول **CT severity index ≥ 3**): CECT تاني بعد 7–10 days.
          - غير كده: CT زيادة بس لو المريض اتدهور، أو مش بيتحسن، أو هتعمل invasive intervention.

          الفكرة: كل CT جرعة صبغة وإشعاع، فمتصوّرش إلا لو الإجابة هتغيّر قرارك.
