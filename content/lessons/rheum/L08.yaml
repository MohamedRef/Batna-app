        caption: |
          أربع صور للبق:

          - قرح **سطحية** (1) بقاع **أبيض مصفر** وحرف **أحمر**: على الشفة من جوه، تحت اللسان، وعلى اللسان.
          - **طفل** (2): المرض ممكن يبدأ صغير.

          دي الـ ==recurrent oral ulceration== اللي من غيرها مفيش تشخيص في الـ 1990 criteria (≥3 مرات في السنة).
      - kind: figure
