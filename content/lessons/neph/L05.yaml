schema: batna.lesson/v1
lecture: neph.L05
lessons:
  # ------------------------------------------------------------------
  - id: neph.L05.lesson1
    title: "الكرياتينين علي: يبقى AKI ولا لأ؟"
    hook: "زمان كان فيه أكتر من 30 تعريف للـ AKI. النهارده تعريف واحد بتلات أرقام، وتلات مراحل. خلّيهم في جيبك."
    minutes: 9
    pages: [98, 103]
    topics: [definition, epidemiology]
    goals:
      - "تشخّص الـ AKI بمعايير KDIGO التلاتة"
      - "تحدد الـ stage من الكرياتينين والـ urine output"
      - "تفرّق AKI عن AKD عن CKD، و azotemia عن uremia"
    status: unverified
    steps:
      - kind: explain
        page: 98
        title: "يعني إيه AKI؟"
        quote: "Acute kidney injury (AKI) is abrupt reduction in kidney functions as evidenced by changed in laboratory values"
        text: |
          الـ **AKI** = نزول ==مفاجئ== في وظيفة الكلى، باين في الـ lab: **serum creatinine** و **BUN** و **urine output**.

          سنة 1900 كان التشخيص **إكلينيكي** بس: oliguria، تعب، ترجيع، و GI bleeding. وأول وصف حقيقي كان من **Bywaters** في عيانين الـ **crush injuries** في قصف لندن.
      - kind: explain
        page: 99
        title: "من 30 تعريف لتعريف واحد"
        quote: "Over 30 definitions of AKI/ ARF existed in the literature"
        text: |
          كان فيه **أكتر من 30 definition** للـ AKI/ARF. بعدين:
          1. **RIFLE** من الـ ADQI (مايو 2004)
          2. كلمة **AKI** بدل ARF (سبتمبر 2004)
          3. **AKIN** وحّد المعايير
          4. ==KDIGO== جمع RIFLE و AKIN في تعريف واحد
      - kind: explain
        page: 100
        title: "التلات معايير (أي واحد يكفي)"
        quote: "Increase in serum creatinine (SCr) of at least 0.3 mg/dL within 48 hours"
        text: |
          - **serum creatinine** يعلى ==≥0.3 mg/dL في 48 ساعة==
          - أو يعلى **50%** عن الـ baseline في **7 أيام**
          - أو **urine output <0.5 mL/kg/h** لمدة ==6 ساعات== على الأقل
      - kind: figure
        page: 100
        quote: "TABLE 28-1: RIFLE, AKIN, and KDIGO Classification Schemes for Acute Kidney Injurya"
        title: "مراحل KDIGO"
        alt: "Three stacked bars for KDIGO stages. Stage 1: creatinine up 0.3 or 1.5 to 1.9 times, urine under 0.5 for 6 to 12 hours. Stage 2: 2 to 2.9 times, under 0.5 for 12 hours or more. Stage 3: 3 times, or at least 4 mg/dL, or RRT; anuria for 12 hours or more."
        caption: "خد ==أسوأ معيار==: لو الكرياتينين stage 1 والبول stage 3، يبقى stage 3."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <text x="100" y="20" text-anchor="middle" class="t-sm t-mut">SCr</text>
            <text x="255" y="20" text-anchor="middle" class="t-sm t-mut">Urine output</text>
            <rect x="10" y="30" width="310" height="60" rx="8" class="fg-acc"/>
            <text x="20" y="54" class="t-sm t-b">Stage 1</text>
            <text x="20" y="76" class="t-sm">↑≥0.3 or ×1.5–1.9</text>
            <text x="310" y="76" text-anchor="end" class="t-sm">&lt;0.5 × 6–12 h</text>
            <rect x="10" y="100" width="310" height="60" rx="8" class="fg-bad"/>
            <text x="20" y="124" class="t-sm t-b">Stage 2</text>
            <text x="20" y="146" class="t-sm">×2–2.9</text>
            <text x="310" y="146" text-anchor="end" class="t-sm">&lt;0.5 × ≥12 h</text>
            <rect x="10" y="170" width="310" height="72" rx="8" class="fg-bad"/>
            <text x="20" y="194" class="t-sm t-b t-bad">Stage 3</text>
            <text x="20" y="214" class="t-sm">×3, or ≥4 mg/dL, or RRT</text>
            <text x="20" y="232" class="t-sm t-mut">(eGFR &lt;35 if &lt;18 y)</text>
            <text x="310" y="214" text-anchor="end" class="t-sm">Anuria ≥12 h</text>
          </svg>
      - kind: table
        page: 100
        quote: "TABLE 28-1: RIFLE, AKIN, and KDIGO Classification Schemes for Acute Kidney Injurya"
        title: "RIFLE في سطر لكل حرف"
        columns: [Category, SCr or GFR, Urine output]
        rows:
          - ["Risk", "×1.5 or GFR ↓>25%", "<0.5 × ≥6 h"]
          - ["Injury", "×2 or GFR ↓>50%", "<0.5 × ≥12 h"]
          - ["Failure", "×3, GFR ↓>75%, or ≥4 mg/dL", "Anuria ≥12 h"]
          - ["Loss", "RRT >4 weeks", "-"]
          - ["ESKD", "RRT >3 months", "-"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
      - kind: check
        page: 100
        quote: "TABLE 28-1: RIFLE, AKIN, and KDIGO Classification Schemes for Acute Kidney Injurya"
        question: "Creatinine 0.8 → 1.3 mg/dL in 36 hours; urine output 0.4 mL/kg/h for 14 hours. KDIGO stage?"
        options:
          - "Stage 1"
          - "Stage 2"
          - "Stage 3"
        answer: 1
        why:
          - "الكرياتينين لوحده stage 1 (↑0.5)، بس الـ urine output أسوأ."
          - "صح: <0.5 mL/kg/h لمدة ≥12 ساعة = stage 2، وبناخد الأسوأ."
          - "Stage 3 محتاج anuria ≥12 h أو ×3 أو ≥4 mg/dL أو RRT."
      - kind: explain
        page: 101
        title: "عيوب التعريف ده"
        quote: "Use of urine output as a sole criterium of AKI"
        text: |
          - ما بيفرّقش بين ==الأسباب== الكتير للـ AKI.
          - الاعتماد على الـ **urine output** لوحده.
          - الـ **SCr kinetics** متأخرة عن الـ GFR.
          - الـ **baseline** نفسه: أول قراءة في المستشفى ولا القديمة؟
          - التغييرات الصغيرة في الـ SCr ممكن تدي ==misdiagnosis== كتير.
      - kind: sort
        page: 101
        quote: "Acute elevations of serum creatinine: Implications are context-dependent"
        prompt: "الكرياتينين علي. صنّفه:"
        bins: ["Induced AKI (outcome better)", "Spontaneous AKI (outcome worse)"]
        cards:
          - { text: "Decongestion in heart failure", bin: 0 }
          - { text: "Starting an SGLT2 inhibitor", bin: 0 }
          - { text: "Intensive BP control", bin: 0 }
          - { text: "Hepatorenal syndrome", bin: 1 }
          - { text: "Sepsis", bin: 1 }
          - { text: "Nephrotoxin", bin: 1 }
        why: "الـ **serum creatinine** اللي بيعلى من علاج مقصود (diuresis، RAAS inhibition، BP control، SGLT2i) نتيجته أحسن. اللي بيعلى لوحده من CRS أو HRS مش متعالجين، أو sepsis، أو nephrotoxin، نتيجته أوحش."
      - kind: figure
        page: 102
        quote: "The conceptual overlap among AKI, AKD and CKD (KDIGO AKI guideline 2012)"
        title: "من AKI لـ AKD لـ CKD"
        alt: "A timeline in days after injury: AKI from day 0 to 7 with a mark at 48 hours, AKD from day 7 to 90, CKD after day 90."
        caption: "الـ **AKI** أول 7 أيام، والـ **AKD** من 7 لـ 90 يوم، وبعد ==90 يوم== تبقى CKD."
        svg: |
          <svg viewBox="0 0 330 120" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L05a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="15" y="30" width="70" height="36" rx="6" class="fg-bad"/>
            <text x="50" y="53" text-anchor="middle" class="t-sm t-b">AKI</text>
            <rect x="85" y="30" width="110" height="36" rx="6" class="fg-acc"/>
            <text x="140" y="53" text-anchor="middle" class="t-sm t-b">AKD</text>
            <rect x="195" y="30" width="115" height="36" rx="6" class="fg-box"/>
            <text x="252" y="53" text-anchor="middle" class="t-sm t-b">CKD</text>
            <line x1="15" y1="85" x2="318" y2="85" class="fg-arrow" marker-end="url(#L05a)"/>
            <text x="15" y="102" text-anchor="middle" class="t-sm">0</text>
            <text x="36" y="102" text-anchor="middle" class="t-sm t-mut">48h</text>
            <text x="85" y="102" text-anchor="middle" class="t-sm">7</text>
            <text x="195" y="102" text-anchor="middle" class="t-sm">90</text>
            <text x="165" y="20" text-anchor="middle" class="t-sm t-mut">Days after injury (ADQI)</text>
          </svg>
      - kind: table
        page: 102
        quote: "Between 5% and 7% of all hospitalized patients develop AKI"
        title: "الأرقام"
        columns: [Group, Figure]
        rows:
          - ["Hospitalized patients with AKI", "5–7%"]
          - ["ICU patients with AKI", "20–60%"]
          - ["Non-ICU AKI mortality", "Up to 10%"]
          - ["ICU AKI mortality", "Over 50%"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: tip
        page: 102
        quote: "Non-oliguric has better prognosis than oliguric one"
        text: |
          الـ **non-oliguric** AKI أحسن في الـ prognosis، وغالبًا في المستشفى بيكون من ==nephrotoxic agents==. ولما العيان الـ AKI يبقى في الـ ICU مع sepsis و multi-organ failure، الـ mortality بتعدّي 50%.
      - kind: explain
        page: 103
        title: "Azotemia ولا uremia؟"
        quote: "Symptomatic AKI (eg MS changes, loss of appetite, tremors)"
        text: |
          - **Azotemia** = ==تراكم nitrogenous waste== بس.
          - **Uremia** = AKI ==بأعراض==: تغيّر في الوعي، فقدان شهية، و **tremors**.
      - kind: try
        items: [neph.L05.007, neph.L05.013, neph.L05.014, neph.L05.021, neph.L05.029]
    recap:
      - "AKI = SCr ↑≥0.3 في 48 ساعة، أو ↑50% في 7 أيام، أو UO <0.5 mL/kg/h لـ 6 ساعات."
      - "KDIGO: stage 1 ×1.5–1.9، stage 2 ×2–2.9، stage 3 ×3 أو ≥4 أو RRT؛ خد الأسوأ."
      - "Induced AKI (decongestion، RAASi، SGLT2i) أحسن من spontaneous AKI."
      - "AKI لحد يوم 7، AKD لحد يوم 90، وبعدها CKD."
      - "5–7% من عيانين المستشفى، 20–60% في الـ ICU؛ uremia = azotemia بأعراض."
    practice: [neph.L05.001, neph.L05.002, neph.L05.003, neph.L05.004, neph.L05.005, neph.L05.006, neph.L05.007, neph.L05.008, neph.L05.009, neph.L05.010, neph.L05.011, neph.L05.012, neph.L05.013, neph.L05.014, neph.L05.015, neph.L05.016, neph.L05.017, neph.L05.018, neph.L05.019, neph.L05.020, neph.L05.021, neph.L05.022, neph.L05.023, neph.L05.024, neph.L05.025, neph.L05.026, neph.L05.027, neph.L05.028, neph.L05.029, neph.L05.133, neph.L05.134]
