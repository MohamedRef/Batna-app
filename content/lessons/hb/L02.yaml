      - kind: explain
        page: 35
        title: "الـ HVPG: الترمومتر الحقيقي"
        quote: "HVPG remains the only validated tool and should not be substituted by NITS"
        text: |
          الـ non-invasive tests (NITs) بتقولك فيه CSPH ولا لأ. بس فيه سؤالين ما يقدروش يجاوبوهم:

          - الـ severity بتاعة الـ portal hypertension بالظبط، مش بس موجود ولا مش موجود.
          - الـ ==haemodynamic response to treatment==، مثلًا هل الـ beta-blocker نزّل الضغط فعلًا؟

          هنا الـ ==hepatic venous pressure gradient (HVPG)== هو الأداة الوحيدة الـ validated، والـ NITs ما تحلّش محله.

          ليه؟ الـ HVPG بيقيس الضغط نفسه بالـ mmHg بقسطرة في الـ hepatic vein. الـ LSM بيقيس الصلابة، والصلابة مرتبطة بالضغط بس مش هي الضغط. زي الفرق بين إنك تحس جبهة العيان وإنك تقيس بالترمومتر.

          ولو الـ CSPH likely: المريض عنده increased risk of clinical decompensation، والـ HVPG هو اللي يقيس الشدة.
      - kind: case
        page: 31
        quote: "Patient with compensated CLD (no previous episodes of decompensation)\nAdvanced chronic liver disease?\n  LSM >10 kPa: probable; >12-15 kPa very probable\n  Imaging signs as additional tools: nodularity of liver surface\n  No → Follow-up and therapy as needed\nCSPH?\n  LSM >20 kPa: CSPH very likely (~90%)\n  Platelet count <150 G/L\n  Imaging signs: porto-systemic collaterals; spleen size → Increased risk of clinical decompensation; HVPG measurement needed in order to exactly quantify the severity of PH\n  Baveno criteria not met if any of the two is present → Perform screening endoscopy (Spleen stiffness as additional tool)\n  If LSM <20 kPa and Plt >150 G/L varices needing treatment are very unlikely (<5%) → Safely avoid endoscopic screening; Repeat LSM + Plt every year"
