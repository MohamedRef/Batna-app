    pages: [18, 54]
    topics: [measures, true-false]
    goals:
      - "تحسب الـ relative risk (RR) والـ attributable risk (AR) والـ attributable risk percent (ARP) من cohort"
      - "تفرّق بين الـ ratio والـ difference"
      - "تحل أسئلة صح وغلط المحاضرة"
    status: unverified
    steps:
      - kind: explain
        page: 21
        quote: "2- Relative risk: RR = Incidence among exposed / Incidence among non-exposed = Ie / Io\n3- Attributable risk percent: ARP = (Ie) - (Io) / (Ie) X 100"
        title: "المعادلات"
        text: |
          في الـ cohort بنحسب incidence فعلًا، في الـ exposed (Ie) وفي الـ non-exposed (I0).

          - الـ ==Relative risk==: **قسمة** الـ incidence among exposed على الـ incidence among non-exposed.
          - الـ **Attributable risk**: **طرح** الاتنين من بعض؛ فرق مش نسبة.
          - الـ ==Attributable risk percent==: الفرق ده مقسوم على الـ Ie، في 100. يعني نسبة المرض في الـ exposed اللي سببها الـ exposure.
      - kind: figure
        page: 23
        quote: "| Smoking | Lung cancer YES + | Lung cancer NO - | Total |\n|---|---|---|---|\n| YES + (Exposed) | 20 (a) | 180 (b) | 200 (a+b) |\n| NO - (Not exposed) | 2 (c) | 198 (d) | 200 (c+d) |\nFind out RR and AR for above data"
        title: "Smoking و lung cancer"
        alt: "Bar chart. Incidence in smokers 100 per 1000; in non-smokers 10 per 1000. The ratio is a relative risk of 10. The difference, 90 per 1000, is the attributable risk, which is 90 percent of the smokers' risk."
        caption: "**القسمة** = RR = 10. **الطرح** = AR = 90 في الألف. والـ AR ÷ Ie = **attributable risk percent (ARP) = 90%**."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 200H300" class="fg-thin"/>
            <rect x="70" y="30" width="70" height="170" rx="4" class="fg-bad"/>
            <text x="105" y="22" text-anchor="middle" class="t-sm t-b">Ie = 100/1000</text>
            <text x="105" y="220" text-anchor="middle" class="t-sm">Smokers 20/200</text>
            <rect x="190" y="183" width="70" height="17" rx="4" class="fg-good"/>
            <text x="225" y="175" text-anchor="middle" class="t-sm t-b">I0 = 10/1000</text>
            <text x="225" y="220" text-anchor="middle" class="t-sm">Non-smokers 2/200</text>
            <path d="M150 30H275M275 30V180" class="fg-arrow-acc"/>
            <text x="282" y="100" class="t-sm t-acc t-b">AR</text>
            <text x="282" y="116" class="t-sm t-acc">90</text>
            <text x="165" y="238" text-anchor="middle" class="t-sm t-mut">RR = 100/10 = 10 · ARP = 90/100 = 90%</text>
          </svg>
      - kind: case
        page: 36
        quote: "What are the risks to be calculated from such study?\nA study was carried out in country X to find out whether the risk of diarrhea in under-five children was different between two nearby villages. It was suspected that village B had a higher risk because the community used unprotected wells while village A used tap water. village A had a population of 10,000, while village B included 15,000 people. The under-five populations were 1,000 and 1,500 respectively. The records kept by village health workers (VHWs) responsible for the villages in the previous four weeks were checked. village B had had 100 cases of diarrhea while village A had had 50 cases.\n  Relative risk\n  Attributable risk percent"
        stem: "قرية A (مية حنفية): 1000 طفل تحت 5 سنين، 50 حالة إسهال (diarrhoea) في 4 أسابيع. قرية B (آبار مكشوفة): 1500 طفل، 100 حالة."
        steps:
          - question: "Relative risk, B vs A?"
            options: ["1.33", "2", "1.5"]
            answer: 0
            why: "B = 100/1500 = 6.67%. A = 50/1000 = 5%. RR = 1.33. استخدم عدد الأطفال تحت 5، مش سكان القرية كلها."
          - question: "Attributable risk percent?"
            options: ["25%", "33%", "1.67%"]
            answer: 0
            why: "(6.67 - 5) ÷ 6.67 × 100 = 25%. ربع إسهال القرية B سببه الآبار."
      - kind: check
        page: 54
        quote: "An observational study in diabetics assesses the role of an increased plasma fibrinogen level on the risk of cardiac events. 130 diabetic patients are followed for 5 years to assess the development of acute coronary syndrome. In the group of 60 patients with a normal baseline plasma fibrinogen level, 20 develop acute coronary syndrome and 40 do not. In the group of 70 patients with a high baseline plasma fibrinogen level, 40 develop acute coronary syndrome and 30 do not. Which of the following is the best estimate of relative risk in patients with a high baseline plasma fibrinogen level compared to patients with a normal baseline plasma fibrinogen level?\n  a. (40/30)/(20/40)\n  b. (40*40)/(20*30)\n  c. (40*70)/(20*60)\n  d. (40/70)/(20/60)\n  e. (40/60)/(30/70)"
        question: "Diabetics followed 5 years: high fibrinogen 40 of 70 get acute coronary syndrome (ACS); normal fibrinogen 20 of 60. Relative risk?"
        options: ["(40/70)/(20/60)", "(40/30)/(20/40)", "(40*40)/(20*30)", "(40/60)/(30/70)"]
        answer: 0
        why:
          - "صح: incidence في الـ high ÷ incidence في الـ normal = 0.57/0.33 = 1.71."
          - "ده odds ratio (a/b)/(c/d)."
          - "ده برضه odds ratio = ad/bc."
          - "مقامات غلط."
      - kind: sort
        page: 28
        quote: "False or true:\n  The odds ratio is an approximation to the attributable risk (F)\n  The odds ratio of one means that the exposure has no association with the disease (T)\n  The absolute risk (incidence rate) can always be estimated from a case-control study (F)\n  The relative risk can be exactly estimated from a case control study (F)"
        prompt: "صح ولا غلط؟"
        bins: ["True", "False"]
        cards:
          - { text: "An odds ratio of one means no association", bin: 0 }
          - { text: "A relative risk below one means a preventive factor", bin: 0 }
          - { text: "RR above one means attributable risk above zero", bin: 0 }
          - { text: "The odds ratio approximates the attributable risk", bin: 1 }
          - { text: "Incidence can always be estimated from a case-control study", bin: 1 }
          - { text: "An attributable risk of 10 means 10 times the risk", bin: 1 }
        why: "الـ odds ratio (OR) بيقرّب للـ **relative risk** مش الـ attributable. الـ case-control مفيهوش incidence. والـ «10 أضعاف» دي **RR**؛ الـ AR فرق."
      - kind: aside
        tone: exam
        page: 32
        quote: "False or true:\n  An attributable risk of 10 means that those exposed have a risk 10 times those who are non-exposed (F)\n  Case control studies are easy to do and take short time (T)\n  The odds ratio is the only measure of association that can be measured from case control studies (T)"
        text: |
          من شرايح صح وغلط، احفظ الجمل دي زي ما هي:

          - الـ **relative risk** مايتحسبش بالظبط من **case control study**: **F**.
          - الـ role of chance لازم يتقيّم **دايمًا** قبل التفسير: «may or may not» = **F**.
          - الـ case control studies سهلة وبتاخد وقت قصير: **T**.
          - الـ **odds ratio** هو المقياس الوحيد من الـ case control: **T**.
      - kind: mnemonic
        page: 22
        quote: "Interpretation of relative risk (RR):\n  RR > 1 (x): the exposed to the risk factor are more liable to the disease than the non exposed by x times\n  RR = 1: the exposure has no relationship with the disease\n  RR < 1: the exposure is protective factor"
        word: "RD"
        parts:
          - { key: "R", text: "Relative risk = Ratio: قسمة. «كام ضعف؟»" }
          - { key: "D", text: "Attributable risk = Difference: طرح. «زيادة قد إيه؟»" }
        hook: "لو السؤال فيه «times» يبقى **R**atio. لو فيه «excess» أو «due to» يبقى **D**ifference."
      - kind: try
        items: [res.L08.015, res.L08.014, res.L08.016]
    recap:
      - "RR = Ie/I0. AR = Ie - I0. ARP = (Ie - I0)/Ie × 100."
      - "Smoking و lung cancer: RR 10، AR 90 في الألف، ARP 90%."
      - "الآبار: RR 1.33، ARP 25%. الـ fibrinogen: RR = (40/70)/(20/60)."
      - "الـ OR بيقرّب للـ RR. الـ case-control مايدّيش incidence. الـ AR مش «أضعاف»."
    practice: [res.L08.014, res.L08.015, res.L08.016, res.L08.018, res.L08.021, res.L08.022, res.L08.023, res.L08.024, res.L08.025, res.L08.026, res.L08.027, res.L08.028]
