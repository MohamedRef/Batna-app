    goals:
      - "تعرف الـ triad والميكروبات وليه اسمه reactive"
      - "توصف الصورة الكاملة بالنسب"
      - "تعرف التحاليل والـ DDx والعلاج وليه الـ antibiotics مش الأساس"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L20.lesson6:SSYC]
        page: 297
        title: "Reiter: التلاتة"
        quote: "It is a seronegative reactive arthritis characterized by the triad of symptoms: arthritis, conjunctivitis, and urethritis."
        text: |
          ==Reactive arthritis== مرتبط جامد بالـ **HLA-B27**: **arthritis + conjunctivitis + urethritis**.

          الشرارة:
          - **Urethritis**: chlamydia، mycoplasma
          - **Dysentery**: salmonella، shigella، yersinia

          غالبًا ==شباب رجالة==، وصعب في الستات لأن الـ cervicitis أعراضه أقل.
      - kind: figure
        page: 297
        quote: "Specific infections trigger the clinical features of arthritis in genetically susceptible patients."
        title: "العدوى تمشي، والمفصل يولّع"
        alt: "A timeline. At week 0, an infection: urethritis (chlamydia, mycoplasma) or dysentery (salmonella, shigella, yersinia). A gap of 2 to 6 weeks. Then the triad: arthritis, conjunctivitis and urethritis, in an HLA-B27 susceptible host. Then most improve over 3 to 4 months, 25 to 40% chronic."
        caption: "**عدوى** (urethritis أو dysentery) ← ==2–6 أسابيع== ← **arthritis + conjunctivitis + urethritis** في عيان عنده استعداد (HLA-B27). أغلبهم يتحسّنوا في 3–4 شهور."
        svg: |
