        page: 118
        title: "تلات معايير"
        text: |
          الـ indications **generally the same** للـ HBeAg-positive والـ HBeAg-negative. والقرار مبني على **combination** من تلاتة:

          - **Serum HBV DNA**.
          - **Serum ALT**.
          - **Severity of liver disease**.

          الـ DNA = قد إيه الفيروس شغّال. الـ ALT = المناعة بتضرب ولا لأ. والـ fibrosis = الكبد اتأذى قد إيه.
