  - id: dm.L08.035
    kind: mcq
    topic: fats
    stem: A patient on a 2,000-calorie diet asks what the AHA limit for saturated fat means for him. Using the lecture's figure, what is the most saturated fat (in calories) he should eat a day?
    options: ["Less than 140 kcal", "Less than 20 kcal", "Less than 700 kcal", "Less than 400 kcal", "No limit"]
    answer: 0
    why:
      - "Correct: under 7% of 2,000 kcal = under 140 kcal (about 15 g) of saturated fat (p95)."
      - 20 kcal is the 1% limit for trans fat.
      - 700 kcal would be 35%.
      - 400 kcal would be 20%.
      - The AHA gives a limit.
    src: { page: 95, quote: "advises limiting saturated fat consumption to less than 7% of daily calories and transfat consumption to less than 1%." }
    status: unverified
    tags: [numbers]
  - id: dm.L08.036
    kind: mcq
    topic: fats
    stem: A diabetic patient with low HDL asks which fat in processed foods he should cut first. Which answer fits the lecture best?
    options:
      - "Partially hydrogenated oils (trans fats), because they raise LDL and lower HDL"
      - "Olive oil, because all oils raise LDL"
      - "Fish oil, because it lowers HDL"
      - "Avocado, because it is a saturated fat"
      - "Nuts, because they contain trans fats"
    answer: 0
    why:
      - "Correct: trans fats raise LDL and, unlike saturated fats, lower HDL (p95)."
