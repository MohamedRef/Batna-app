    recap:
      - "Statin أول اختيار حسب الـ CV risk والـ LDL target؛ مش وصلت: ezetimibe؛ very high ولسه عالي أو intolerant: PCSK9i."
      - "Lifestyle: وزن، Mediterranean/DASH، ↓ saturated و trans، ↑ n-3، stanols/sterols، حركة."
