        text: |
          جدول الـ **dosing** في الـ CKD فيه عمود اسمه **Elimination**، وهو المفتاح: الدوا اللي بيخرج من الكلية بيتراكم لما الكلية تضعف. التفسير المقبول (مش في الكتاب) لكل مجموعة:

          - **Glyburide و first-generation SUs** ← ==avoid==: ليهم metabolites شغالة بتخرج من الكلية، فبتفضل تنزّل السكر ساعات طويلة، يعني **hypoglycemia** طويلة وخطيرة.
          - **Gliclazide و glipizide** ← no dose adjustment: الكبد بيحوّلهم لحاجات **مش شغالة**، فتراكمها ما بيعملش hypo.
          - **Glimepiride** ← ابدأ بـ 1 mg، وavoid تحت 15: في النص بين الاتنين.
          - **TZDs** ← hepatic، فمالهمش دعوة بالكلية.
          - **DPP-4i** ← كلهم renal إلا الـ **linagliptin**، فالباقيين جرعتهم بتقل.
          - **Insulin** ← caution تحت 30، لأن الكلية بتكسّر جزء منه.
