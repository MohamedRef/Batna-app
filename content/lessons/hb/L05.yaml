          - "الكتاب: **pangenotypic**، مع special considerations لـ genotype 3."
      - kind: try
        items: [hb.L05.021, hb.L05.023, hb.L05.024, hb.L05.025, hb.L05.026]
    recap:
      - "**SVR12** = undetectable HCV RNA بعد **12 أسبوع من نهاية** العلاج = cure."
      - "Interferon ± RBV: toxic، طويل، low efficacy. الـ DAAs: oral، قصيرة، **> 95%** cure."
