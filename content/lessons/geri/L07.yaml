          - **Podiatrist**: الرجلين والجزم، ودي جزء من فحص الوقعة (feet/footwear).
          - **Speech therapist**: البلع والكلام بعد stroke مثلًا.
          - **Dietitian**: لما الـ MUST أو الـ MNA يقولوا خطر سوء تغذية.
          - **Psychogeriatrician** و **clinical psychologist**: الاكتئاب والـ dementia الصعبة.
          - **Prosthetic & orthotic specialist**: الأطراف الصناعية والجبائر.

          يعني الـ core بيشوف كل عيان، والـ supporting بيدخل عشان سبب.
