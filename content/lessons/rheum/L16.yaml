        title: "الـ nodules"
        quote: "Subcutanous nodules: in seropositive-soft and mobile or firm and fixed found at sites of pressure or friction sites such as extensor surface of forearm, sacrum, Achilles tendon and toes."
        text: |
          الـ ==rheumatoid nodules== في الـ **seropositive**. ممكن تكون طرية ومتحركة أو ناشفة وثابتة.

          مكانها: أماكن **الضغط والاحتكاك**: extensor forearm (الكوع)، الـ sacrum، الـ Achilles، الصوابع.

          يعني لو لقيت nodule، العيان غالبًا **RF موجب**، وده بيقولك إن مرضه أشد (هتقابل الـ RF في الـ poor prognostic features ص 260).
      - kind: reveal
