    kind: cloze
    topic: thrombocytosis
    text: "Rebound thrombocytosis follows {{c1::treatment of immune thrombocytopenic purpura}} and {{c2::recovery from chemotherapy}}; the drug listed as a cause is {{c3::vincristine}}."
    src: { page: 139, quote: "Rebound thrombocytosis Following treatment of immune thrombocytopenic purpura Recovery from chemotherapy" }
    status: unverified
  - id: hem.L09.043
    kind: order
    topic: thrombocytosis
    prompt: Order the approach to a platelet count above 450,000/µL (book algorithm).
    steps:
      - "Ask about a life-long or family history of thrombocytosis (yes: inherited, test THPO/MPL)"
      - "History, examination, blood smear, ESR/CRP"
      - "Is an underlying reactive disorder present? (yes: treat it; platelets should normalize)"
      - "If not: BCR-ABL, JAK2, bone marrow and cytogenetics"
      - "BCR-ABL+ = CML; JAK2+ = MPN; both negative = evaluate for MPN or MDS"
    src: { page: 139, quote: "Is an underlying reactive disorder present?" }
    status: unverified
    tags: [high-yield]
  - id: hem.L09.044
    kind: card
    topic: thrombocytosis
    front: "Thrombocytosis with a life-long or family history: likely diagnosis and test?"
    back: Inherited thrombocytosis; consider testing for THPO or MPL mutations.
    src: { page: 139, quote: "Inherited thrombocytosis likely Consider testing for THPO/MPL mutations" }
    status: unverified
  - id: hem.L09.045
    kind: card
    topic: thrombocytosis
    front: In the clonal work-up of thrombocytosis, what do the BCR-ABL and JAK2 results mean?
    back: "BCR-ABL positive: CML. JAK2 positive: an MPN (PV, ET or MF). Both negative: evaluate for MPN or MDS."
    src: { page: 139, quote: "Evaluate for clonal thrombocytosis. BCR–ABL, JAK2 testing, bone marrow evaluation, cytogenetics." }
    status: unverified
  - id: hem.L09.046
    kind: mcq
    topic: thrombocytosis
    stem: "A 38-year-old woman with heavy periods has platelets of 690 × 10⁹/L, Hb 9.8 g/dL, MCV 71 fL and ferritin 6 ng/mL. She has no splenomegaly. What is the best next step?"
    options:
      - Treat the iron deficiency and recheck the platelet count
      - Start hydroxycarbamide
      - Bone marrow biopsy now
      - Start low-dose aspirin for ET
      - Test THPO and MPL for inherited thrombocytosis
    answer: 0
    why:
      - "Correct: a reactive cause (iron deficiency, blood loss) is present; the count should normalize once it is treated (p139)."
      - Cytoreduction is for clonal disease, not reactive thrombocytosis.
      - Marrow and clonal tests come only if no reactive cause is found or the count fails to normalize.
      - ET has not been diagnosed.
      - There is no life-long or family history.
    src: { page: 139, quote: "Is an underlying reactive disorder present?" }
    status: unverified
  - id: hem.L09.047
    kind: mcq
    topic: thrombocytosis
    stem: "A 70-year-old man recovering from lobar pneumonia has platelets of 1,080 × 10⁹/L and a CRP of 140 mg/L. Which statement is correct?"
    options:
      - Reactive thrombocytosis can occasionally exceed 1000 × 10⁹/L
      - A count above 1000 × 10⁹/L proves an MPN
      - Reactive thrombocytosis always has a normal CRP
      - He needs urgent hydroxycarbamide
      - Infection lowers, never raises, the platelet count
    answer: 0
    why:
      - "Correct: reactive thrombocytosis can be marked and occasionally exceed 1000 × 10⁹/L (p138)."
      - Very high counts also occur in reactive states.
      - ESR or CRP is usually raised in reactive thrombocytosis.
      - Treat the cause and recheck; cytoreduction is not indicated.
      - Acute bacterial infection is a listed cause of reactive thrombocytosis.
    src: { page: 138, quote: "Reactive thrombocytosis can sometimes be marked and, occasionally, the platelet count can be greater than 1000 X10⁹/L." }
    status: unverified
