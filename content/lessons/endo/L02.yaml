  - id: endo.L02.lesson3
    title: "Cushing في الحمل: الحمل نفسه بيقلّد Cushing"
    hook: "تخن، ضغط، سكر، و striae. ده Cushing ولا حمل عادي؟ الفرق في اللون."
    minutes: 9
    pages: [18, 20]
    topics: [pituitary-physiology, cushing]
    goals:
      - "تفهم ليه الـ cortisol عالي في الحمل الطبيعي"
      - "تعرف الـ clues والتحاليل اللي تنفع واللي متنفعش"
      - "تعرف العلاج حسب الـ trimester"
    status: unverified
    steps:
      - kind: figure
        page: 18
        quote: "Hypothalamic–Pituitary–Adrenal Axis\nHypothalamus CRH → Maternal pituitary → ACTH:\n  Altered set point for ACTH\nPlacenta (fetoplacental unit):\n  CRH → Placental ACTH → Maternal adrenal\n  POMC? → β-endorphin\n  Estrogen → CBG ↑\n  Progesterone → Cortisol resistance\nMaternal adrenal → Cortisol:\n  Free cortisol ↑ → Urinary cortisol and metabolites ↑\n  CBG ↑ → Bound cortisol ↑\n11-β HSD 2:\n  Cortisol → Cortisone (protects fetus from maternal hypercortisolism)"
        title: "رسمة الكتاب ص 18: الـ HPA axis في الحمل"
        image: { file: endo/L02-hpa-axis.webp, book: true }
        alt: "Book diagram of the hypothalamic-pituitary-adrenal axis in pregnancy. Top: hypothalamic CRH to the maternal pituitary to ACTH to the maternal adrenal, with an oval for altered set point for ACTH. Right: the fetoplacental unit makes CRH, placental ACTH and possibly POMC and beta-endorphin, all driving the adrenal. Adrenal cortisol rises: free cortisol and urinary cortisol rise, estrogen raises CBG and bound cortisol, progesterone causes cortisol resistance. Bottom right: placental 11-beta HSD2 turns cortisol into cortisone, protecting the fetus."
        caption: |
          ابدأ **من فوق** وبعدين بص على المشيمة **يمين**:

          - **فوق**: الـ hypothalamus بيعمل corticotropin-releasing hormone (**CRH**) ← الغدة ← adrenocorticotropic hormone (**ACTH**) ← الـ adrenal. **الشكل البيضاوي شمال** والخط المتقطّع: ==altered set point for ACTH==، يعني الـ feedback بقى أضعف.
          - **يمين (Fetoplacental unit)**: المشيمة بتعمل **CRH** و **placental ACTH** بنفسها، والأسهم رايحة على الـ adrenal والغدة.
          - **في النص**: الـ **cortisol** بيعلى ← **free cortisol ↑** و **urinary cortisol ↑** (شمال تحت). الـ **estrogen** بيعلّي **CBG** ← **bound cortisol ↑**، والـ **progesterone** بيعمل **cortisol resistance** (البيضاوي تحت).
          - **تحت يمين**: الـ **11β-HSD2** بيحوّل الـ cortisol لـ cortisone و ==protects fetus==.

          يعني الحمل لوحده بيعمل صورة شبه Cushing في التحاليل، وده ليه كل تحليل بيتقري بشكل تاني.
      - kind: explain
        remind: [endo.L02.034]
        page: 18
        quote: "Cushing's Disease And Pregnancy\n  Pregnancy is rare in patients with Cushing's syndrome.*\n  The etiologies of CS are similar to those found in non pregnant women.\n  Half of the reported gestational CS cases have adrenal causes, and about 40% are Cushing's disease (CD) .\n  Cyclical CD due to ACTH-producing pituitary adenomas with fluctuating ACTH levels are also reported.\n  Maternal and fetal morbidities are increased.\n  In pregnant women with CS Gestational diabetes, hypertension, pre- eclampsia, eclampsia, congestive heart failure, and pulmonary edema are all related to these morbidities.*"
        title: "Cushing's والحمل"
        text: |
          - الحمل ==نادر== في Cushing's (الـ cortisol بيعطّل الخصوبة).
          - الأسباب زي غير الحوامل، بس: **نص** الحالات ==adrenal==، و **40%** Cushing's disease.
          - في كمان **cyclical Cushing's disease (CD)** بـ ACTH متذبذب.
          - المضاعفات: gestational diabetes، hypertension، pre-eclampsia، eclampsia، congestive heart failure (CHF)، pulmonary edema.

          ليه القايمة دي بالذات؟ التفسير المقبول (مش في الكتاب): الـ cortisol الزيادة بيعمل **insulin resistance** (فالسكر يعلى)، وبيحبس **ملح ومية** (فالضغط يعلى والقلب يتعب ويطلع pulmonary edema). والحمل لوحده بيزوّد الحِمل على القلب والسكر، فلما الاتنين يتجمعوا الأم تتعب بسرعة. وليه الحمل نادر أصلًا؟ لأن الـ cortisol والـ androgens الزيادة بيلخبطوا التبويض.
      - kind: reveal
        page: 19
        quote: "In normal pregnancy, the striae are usually white in contrast to large purple striae in CS."
        prompt: "ست حامل عندها تخن وضغط وسكر و striae. إزاي تفرّق Cushing من الحمل العادي؟"
        answer: |
          الحمل العادي بيعمل weight gain، hypertension، glucose intolerance، و striae كمان. الـ clues اللي تقول Cushing:
          - **Hypokalemia**.
          - **Muscle weakness**.
          - **Pathological fractures**.
          - **Large purple** striae (الحمل العادي striae **بيضا**).
          - Hirsutism و acne = androgen زيادة.
      - kind: table
        page: 19
        quote: "UFC has been suggested as the best choice for screening of CS during pregnancy."
        title: "التحاليل في الحمل"
        columns: ["Test", "In pregnancy"]
        rows:
          - ["Dexamethasone suppression", "Avoid: false positive (blunted response)"]
          - ["Circadian rhythm", "Preserved; loss is a clue, nadir higher"]
          - ["24-h UFC", "Best screen; >3x upper limit in 2nd/3rd trimester"]
          - ["Plasma ACTH", "ACTH-dependent or not; mind adrenal majority"]
          - ["IPSS", "Not routine"]
        hide: [[0, 1], [2, 1], [4, 1]]
      - kind: check
        page: 19
        quote: "UFC levels are unchanged during the first trimester, but levels are increased up to threefold in the second and third trimesters."
        question: "At 30 weeks, urinary free cortisol (UFC) is 2 times the upper limit. Interpretation?"
        options: ["Not diagnostic; normal pregnancy raises UFC up to threefold", "Diagnostic of Cushing's", "Proves adrenal Cushing's", "Ignore UFC in pregnancy"]
        answer: 0
        why:
          - "صح: في التاني والتالت الـ urinary free cortisol (UFC) بيعلى لـ 3 أضعاف طبيعي؛ اللي يتحسب أكتر من 3 أضعاف."
          - "لسه جوه حدود الحمل الطبيعي."
          - "الـ UFC مش بيفرّق السبب."
          - "بالعكس، هو أحسن screening."
      - kind: explain
        page: 19
        quote: "Since serum cortisol circadian variation is preserved during pregnancy, loss of circadian rhythm might be a clue for CS, but the nadir level for late-midnight cortisol is higher than that in the nonpregnant state."
        title: "ليه كل تحليل بيتقرا بشكل تاني في الحمل؟"
        text: |
          الحمل الطبيعي نفسه عامل "Cushing خفيف": المشيمة بتعمل **CRH و ACTH**، والـ estrogen بيعلّي الـ **CBG**. فكل تحليل بيتأثر:
          - **Dexamethasone suppression**: الكتاب بيقول السبب **blunted response to dexamethasone**، فالـ cortisol مش بيتكبت: ==false positive==. التفسير المقبول (مش في الكتاب): جزء من الـ ACTH جاي من المشيمة ومش بيسمع كلام الـ dexamethasone.
          - **Circadian rhythm**: لسه موجود في الحمل، يعني لو **اختفى** ده clue لـ Cushing's. بس الـ midnight nadir أعلى من غير الحوامل، فمتقارنش بأرقام عادية.
          - **24-h UFC**: الكتاب بيقول أحسن screening، بس بيعلى طبيعي لـ ==3 أضعاف== في التاني والتالت، عشان كده نحسب بس اللي **فوق 3 أضعاف**.
          - **Plasma ACTH**: بيفرّق ACTH-dependent من غيره، بس خد بالك إنه بيعلى طبيعي في الحمل، وإن الـ adrenal هو الأغلب.
      - kind: aside
        tone: exam
        page: 19
        quote: "According to the guidelines of Endocrine Society 2008 for the diagnosis of CS, the use of a dexamethasone suppression test should not be used during pregnancy, because of false positive results secondary to blunted response to dexamethasone."
        text: "Endocrine Society 2008: متعملش dexamethasone suppression test في الحمل. الـ low dose مش بيكبت الـ cortisol أصلًا في الحمل، فهتطلع false positive."
      - kind: explain
        page: 20
        quote: "Adrenal computerized tomography (CT) scans should be avoided, and pituitary MRI should be reserved for patients for whom pituitary surgery is planned."
        title: "الأشعة"
        text: |
          - ==Adrenal computed tomography (CT) ممنوعة== (radiation).
          - الـ **pituitary magnetic resonance imaging (MRI)** بس لو هنعمل جراحة.
          - مشكلة: الـ CD غالبًا **microadenoma**، والغدة الكبيرة في الحمل ممكن تخبيه.

          ليه الـ adrenal CT ممنوعة؟ التفسير المقبول (مش في الكتاب): الـ CT بيستخدم X-ray، والبطن هي مكان الجنين، فالإشعاع بيوصله مباشرة. وليه الـ MRI بس لو هنعمل جراحة؟ لأن الصورة نفسها ممكن تكدب (الغدة كبيرة طبيعي وبتخبّي الـ microadenoma)، فلو مش هتغيّر قرارك ملهاش لازمة.
