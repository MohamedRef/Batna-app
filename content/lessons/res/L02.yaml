        items: [res.L02.052, res.L02.053, res.L02.057, res.L02.072]
    recap:
      - "Neonatal = لحد 28 يوم؛ infant = أقل من سنة؛ المقام live births × 1000."
      - "Perinatal I = fetal deaths 28 أسبوع فأكتر + أول 7 أيام، على fetal deaths + live births."
