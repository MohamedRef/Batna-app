items:
  # ---------- p269-270: physiology and anatomy ----------
  - id: git.L10.001
    kind: card
    topic: physiology
    front: What two functions must the esophagus perform for efficient transport?
    back: A coordinated, sequential motility pattern that propels food from above, and an antireflux function that clears acid and bile reflux from below.
    src: { page: 269, quote: "Coordinated, sequential motility pattern that propels food (from above)" }
    status: unverified
  - id: git.L10.002
    kind: card
    topic: physiology
    front: What two consequences follow disruption of the integrated esophageal muscular motion?
    back: It limits delivery of food and fluid, and causes a bothersome sense of dysphagia and chest pain.
    src: { page: 269, quote: "limits delivery of food and fluid" }
    status: unverified
  - id: git.L10.003
    kind: cloze
    topic: physiology
    text: The upper esophageal sphincter is {{c1::striated}} muscle that prevents {{c2::air}} from entering the stomach.
    src: { page: 270, quote: "The upper esophageal sphincter (UES) is a striated muscle that prevents air from entering the stomach." }
    status: unverified
  - id: git.L10.004
    kind: cloze
    topic: physiology
    text: The lower esophageal sphincter is {{c1::smooth}} muscle with {{c2::baseline tonicity}} that prevents gastric content from refluxing into the esophagus.
    src: { page: 270, quote: "The lower esophageal sphincter (LES) is made up of smooth muscles with baseline tonicity" }
    status: unverified
  - id: git.L10.005
    kind: card
    topic: physiology
    front: Where does the esophageal body change from skeletal to smooth muscle?
    back: In the mid-esophagus. The proximal part is striated and the distal part is smooth muscle.
    src: { page: 270, quote: "The transition from skeletal to smooth muscles occurs in the mid-esophagus." }
    status: unverified
  - id: git.L10.006
    kind: card
    topic: physiology
    front: What is esophageal peristalsis?
    back: The coordinated contraction of the outer longitudinal and inner circular muscle layers that propels the luminal content into the stomach.
    src: { page: 270, quote: "Peristalsis is the coordinated contraction of these two layers that propels the intraluminal esophageal content into the stomach." }
    status: unverified
  # ---------- p270-271: dysphagia and odynophagia ----------
  - id: git.L10.007
    kind: card
    topic: dysphagia
    front: Define dysphagia.
    back: Difficulty swallowing food or liquid from a sensation of it sticking in the throat or chest, with discomfort or a choking sensation.
    src: { page: 270, quote: "Is defined as difficulty swallowing food or liquid due to the sensation of it sticking in the throat or chest" }
    status: unverified
    tags: [high-yield]
  - id: git.L10.008
    kind: card
    topic: dysphagia
    front: "Oropharyngeal versus esophageal dysphagia: where is the problem in each?"
    back: "Oropharyngeal: transferring the bolus from the oropharynx to the upper esophagus. Esophageal: transporting the bolus through the body of the esophagus."
    src: { page: 270, quote: "transferring the food bolus from the oropharynx to the upper esophagus (oropharyngeal dysphagia)" }
    status: unverified
  - id: git.L10.009
    kind: card
    topic: dysphagia
    front: What usually suggests the correct diagnosis in dysphagia?
    back: The history.
    src: { page: 270, quote: "History usually suggests the correct diagnosis." }
    status: unverified
  - id: git.L10.010
    kind: card
    topic: dysphagia
    front: Define odynophagia, and what does it usually reflect?
    back: Sharp substernal pain on swallowing that may limit oral intake. It usually reflects severe erosive disease.
    src: { page: 271, quote: "Odynophagia is sharp substernal pain on swallowing that may limit oral intake. It usually reflects severe erosive disease." }
    status: unverified
    tags: [high-yield]
  - id: git.L10.011
    kind: enumerate
    topic: dysphagia
    prompt: Enumerate the causes of odynophagia mentioned in the lecture.
    points:
      - Infectious esophagitis (most common), especially in the immunocompromised
      - Candida
      - Herpesviruses
      - CMV
      - Corrosive injury from caustic ingestion
      - Pill-induced ulcers
    pass: 4
    src: { page: 271, quote: "It is most commonly associated with infectious esophagitis due to Candida, herpesviruses, or CMV, especially in immunocompromised patients." }
    status: unverified
  - id: git.L10.012
    kind: mcq
    topic: dysphagia
    stem: A 34-year-old man on chemotherapy for lymphoma has had 5 days of sharp retrosternal pain every time he swallows, so he now barely eats. Which cause does the lecture name as most common?
    options: ["Infectious esophagitis (Candida, herpes, CMV)", Achalasia, Diffuse esophageal spasm, Peptic stricture, Zenker diverticulum]
    answer: 0
    why:
      - Odynophagia is most commonly from infectious esophagitis, especially in the immunocompromised.
      - Achalasia gives dysphagia to solids and liquids with regurgitation, not sharp pain on every swallow.
      - DES gives intermittent dysphagia and chest pain, not odynophagia from erosive disease.
      - A peptic stricture gives slowly progressive solid-food dysphagia over months to years.
      - Zenker diverticulum is a structural cause of oropharyngeal dysphagia.
    src: { page: 271, quote: "It is most commonly associated with infectious esophagitis due to Candida, herpesviruses, or CMV, especially in immunocompromised patients." }
    status: unverified
  # ---------- p271-272: classification ----------
  - id: git.L10.013
    kind: card
    topic: classification
    front: What is the spectrum of esophageal motility disorders?
    back: Primary esophageal motility disorders (PEMDs), nonspecific disorders that may play an indirect role in reflux disease, and secondary motility disorders that are manifestations of systemic diseases.
    src: { page: 271, quote: "Secondary motility disorders: esophageal motility disorders may occur as manifestations of systemic diseases." }
    status: unverified
  - id: git.L10.014
    kind: enumerate
    topic: classification
    prompt: Enumerate the neuromuscular causes of oropharyngeal dysphagia.
    points:
      - Amyotrophic lateral sclerosis (ALS)
      - CNS tumors (benign or malignant)
      - Multiple sclerosis
      - Muscular dystrophy
      - Myasthenia gravis
      - Parkinson disease
      - Polymyositis or dermatomyositis
      - Stroke
    pass: 6
    src: { page: 271, quote: "ALS (amyotrophic Lateral Sclerosis), CNS tumors (benign or malignant), Multiple sclerosis, Muscular dystrophy, Myasthenia gravis, Parkinson disease" }
    status: unverified
  - id: git.L10.015
    kind: enumerate
    topic: classification
    prompt: Enumerate the structural causes of oropharyngeal dysphagia.
    points:
      - Carcinoma
      - Osteophytes and other spinal disorders
      - Prior surgery or radiation therapy
      - Proximal esophageal web
      - Thyromegaly
      - Zenker diverticulum
    pass: 4
    src: { page: 271, quote: "Structural: as Carcinoma, Osteophytes and other spinal disorders, Prior surgery or radiation" }
    status: unverified
  - id: git.L10.016
    kind: enumerate
    topic: classification
    prompt: Enumerate the primary neuromuscular (motility) causes of esophageal dysphagia.
    points:
      - Achalasia
      - Diffuse esophageal spasm
      - Hypercontractile (jackhammer) esophagus
      - Hypertensive LES
      - Nutcracker (high-pressure) esophagus
    pass: 4
    src: { page: 272, quote: "Primary: like Achalasia, Diffuse esophageal spasm, Hypercontractile (jackhammer) esophagus, Hypertensive LES, Nutcracker (high-pressure) esophagus" }
    status: unverified
    tags: [high-yield]
  - id: git.L10.017
    kind: cloze
    topic: classification
    text: "Secondary motility causes of esophageal dysphagia: {{c1::Chagas disease}}, {{c2::reflux-related dysmotility}}, and {{c3::scleroderma and other rheumatologic disorders}}."
    src: { page: 272, quote: "Secondary: like Chagas disease, Reflux-related dysmotility, Scleroderma and other rheumatologic disorders." }
    status: unverified
  - id: git.L10.018
    kind: enumerate
    topic: classification
    prompt: Enumerate the intrinsic structural (mechanical) causes of esophageal dysphagia.
    points:
      - Carcinoma and benign tumors
      - Diverticula
      - Eosinophilic esophagitis
      - Esophageal rings and webs (other than Schatzki ring)
      - Foreign body
      - Lower esophageal (Schatzki) ring
      - Medication-induced stricture
      - Peptic stricture
    pass: 6
    src: { page: 272, quote: "Intrinsic: Carcinoma and benign tumors, Diverticula, Eosinophilic esophagitis, Esophageal rings and webs (other than Schatzki ring), Foreign body" }
    status: unverified
  - id: git.L10.019
    kind: cloze
    topic: classification
    text: "Extrinsic mechanical causes of esophageal dysphagia: {{c1::mediastinal mass}}, {{c2::spinal osteophytes}}, and {{c3::vascular compression}}."
    src: { page: 272, quote: "Extrinsic: Mediastinal mass, Spinal osteophytes, Vascular compression." }
    status: unverified
  - id: git.L10.020
    kind: mcq
    topic: classification
    stem: In the lecture's anatomical classification, which one is a SECONDARY neuromuscular cause of esophageal (not oropharyngeal) dysphagia?
    options: [Scleroderma, Myasthenia gravis, Nutcracker esophagus, Schatzki ring, Zenker diverticulum]
    answer: 0
    why:
      - Scleroderma and other rheumatologic disorders are secondary motility causes, with Chagas disease and reflux-related dysmotility.
      - Myasthenia gravis is a neuromuscular cause of oropharyngeal dysphagia.
      - Nutcracker esophagus is a primary motility disorder.
      - Schatzki ring is an intrinsic structural (mechanical) cause.
      - Zenker diverticulum is a structural cause of oropharyngeal dysphagia.
    src: { page: 272, quote: "Secondary: like Chagas disease, Reflux-related dysmotility, Scleroderma and other rheumatologic disorders." }
    status: unverified
  # ---------- p272-273: achalasia pathophysiology and clinical ----------
  - id: git.L10.021
    kind: card
    topic: achalasia
    front: What does the lecture call achalasia among motility disorders?
    back: The best defined primary motility disorder.
    src: { page: 272, quote: "Achalasia is the best defined primary motility disorder." }
    status: unverified
  - id: git.L10.022
    kind: card
    topic: achalasia
    front: Explain the physiologic process of achalasia at the LES.
    back: Loss of the inhibitory nerves at the sphincter causes failure of the LES to relax completely, which produces a relative obstruction.
    src: { page: 272, quote: "Loss of the inhibitory nerves at the sphincter" }
    status: unverified
    tags: [high-yield]
  - id: git.L10.023
    kind: card
    topic: achalasia
    front: What does loss of nerves along the esophageal body cause in achalasia?
    back: Aperistalsis, which leads to stasis of ingested food and then dilation of the esophagus.
    src: { page: 272, quote: "The loss of nerves along the esophageal body causes aperistalsis, leading to stasis of ingested food and subsequent dilation of the esophagus." }
    status: unverified
  - id: git.L10.024
    kind: cloze
    topic: achalasia
    text: In achalasia, manometry may reveal an LES pressure greater than {{c1::40}} mm Hg (page 272).
    src: { page: 272, quote: "Manometry may reveal elevated LES pressure greater than 40 mm Hg." }
    status: unverified
    tags: [numbers]
  - id: git.L10.025
    kind: card
    topic: achalasia
    front: What is the hallmark symptom of achalasia?
    back: Dysphagia for both solids and liquids.
    src: { page: 272, quote: "Dysphagia for both solids and liquids is the hallmark of achalasia." }
    status: unverified
    tags: [high-yield]
  - id: git.L10.026
    kind: card
    topic: achalasia
    front: Why do achalasia patients sleep on many pillows or upright in a chair?
    back: Regurgitation of food retained in the dilated esophagus is common, especially at night.
    src: { page: 272, quote: "Regurgitation of food retained in the proximal dilated esophagus is a common occurrence, especially at night" }
    status: unverified
  - id: git.L10.027
    kind: card
    topic: achalasia
    front: Describe the chest pain of achalasia.
    back: An early symptom; squeezing retrosternal pain radiating to the neck, jaw, arms or back. It may worsen with food and can wake the patient from sleep.
    src: { page: 273, quote: "Chest pain may be another early symptom, characterized by a squeezing retrosternal pain radiating to the neck, jaw, arms, or back." }
    status: unverified
  - id: git.L10.028
    kind: cloze
    topic: achalasia
    text: Heartburn is reported by about {{c1::30%}} of achalasia patients and is thought to come from {{c2::fermentation of retained food and lactic acid}}.
    src: { page: 273, quote: "A sensation of heartburn may be reported by 30% of patients and is assumed to be related to retained food fermentation and lactic acid." }
    status: unverified
    tags: [numbers]
  - id: git.L10.029
    kind: card
    topic: achalasia
    front: What worsens all achalasia symptoms, and how much weight is lost?
    back: Emotional stress or rapid eating worsen the symptoms. Weight loss is common but usually slight.
    src: { page: 273, quote: "Weight loss is common with achalasia; however, the loss is usually slight." }
    status: unverified
  - id: git.L10.030
    kind: mcq
    topic: achalasia
    stem: A 32-year-old woman has 3 years of difficulty swallowing both bread and water, regurgitation of undigested food at night so she sleeps on three pillows, and a 2 kg weight loss. What is the most likely diagnosis?
    options: [Achalasia, Peptic stricture, Esophageal carcinoma, Eosinophilic esophagitis, Myasthenia gravis]
    answer: 0
    why:
      - Dysphagia for both solids and liquids is the hallmark of achalasia, with nocturnal regurgitation and slight weight loss.
      - A peptic stricture gives progressive dysphagia for solids, not liquids from the start.
      - Carcinoma gives progressive solid dysphagia with marked weight loss in an older patient.
      - EoE mostly gives solid-food dysphagia or food impaction in an atopic patient.
      - Myasthenia gravis causes oropharyngeal dysphagia, not retained food regurgitated at night.
    src: { page: 272, quote: "Dysphagia for both solids and liquids is the hallmark of achalasia." }
    status: unverified
  # ---------- p273-274: differential and diagnosis ----------
  - id: git.L10.031
    kind: enumerate
    topic: achalasia-dx
    prompt: Enumerate the differential diagnosis of achalasia given in the lecture.
    points:
      - Carcinoma of the gastric cardia
      - Diffuse esophageal spasm (DES)
      - Megaesophagus with absent peristalsis in amyloidosis
      - Pseudoachalasia
    pass: 3
    src: { page: 273, quote: "Carcinoma of the gastric cardia. Diffuse esophageal spasm (DES). Megaoesophagus associated with absent peristalsis occurs in amyloid." }
    status: unverified
    tags: [high-yield]
  - id: git.L10.032
    kind: cloze
    topic: achalasia-dx
    text: Pseudoachalasia accounts for up to {{c1::5%}} of suspected achalasia and is more likely with {{c2::advanced age, abrupt onset (<1 year)}} and {{c3::weight loss}}.
    src: { page: 273, quote: "Pseudoachalasia. accounts for up to 5% of suspected cases and is more likely with advanced age, abrupt onset of symptoms (<1 year), and weight loss." }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L10.033
    kind: card
    topic: achalasia-dx
    front: "Suspected pseudoachalasia with a nondiagnostic endoscopy: what next?"
    back: CT scanning or endoscopic ultrasonography.
    src: { page: 273, quote: "When the clinical suspicion for pseudoachalasia is high and endoscopy nondiagnostic, CT scanning or endoscopic ultrasonography may be of value." }
    status: unverified
  - id: git.L10.034
    kind: card
    topic: achalasia-dx
    front: Which rare non-tumour-mass mechanism can cause pseudoachalasia?
    back: A paraneoplastic syndrome with circulating antineuronal antibodies.
    src: { page: 273, quote: "Rarely, pseudoachalasia can result from a paraneoplastic syndrome with circulating antineuronal antibodies." }
    status: unverified
  - id: git.L10.035
    kind: card
    topic: achalasia-dx
    front: Barium swallow finding in achalasia?
    back: A dilated esophagus (often with a fluid level) tapering smoothly at the lower end, the beak (bird's beak) deformity, because the sphincter fails to relax.
    src: { page: 273, quote: "Barium swallow: which show dilatation of the esophagus with tapering smooth lower end (Beak deformity) due to failure of the sphincter to relax." }
    status: unverified
    tags: [high-yield]
  - id: git.L10.036
    kind: card
    topic: achalasia-dx
    front: What is the most sensitive diagnostic test for achalasia, and why?
    back: Esophageal manometry. It identifies early disease before esophageal dilatation and food retention.
    src: { page: 273, quote: "Manometry identifies early disease before esophageal dilatation and food retention, it is the most sensitive diagnostic test." }
    status: unverified
    tags: [high-yield]
  - id: git.L10.037
    kind: card
    topic: achalasia-dx
    front: Why is upper endoscopy essential in achalasia, and what does it show?
    back: To exclude carcinoma of the esophagus. It shows a dilated esophagus, and the scope passes the narrow sphincter into the stomach easily.
    src: { page: 274, quote: "Upper endoscopy: Essential to exclude carcinoma of the esophagus." }
    status: unverified
  - id: git.L10.038
    kind: card
    topic: achalasia-dx
    front: Two roles of endoscopic ultrasound in achalasia?
    back: To work up tumors or infiltrative diseases (pseudoachalasia), and to assist botulinum toxin injection.
    src: { page: 274, quote: "Endoscopic ultrasound: to work up tumors or infiltrative diseases of pseudoachalasia" }
    status: unverified
  - id: git.L10.039
    kind: mcq
    topic: achalasia-dx
    stem: A 71-year-old man has had 6 months of dysphagia to solids and liquids and has lost 9 kg. Barium shows a bird's beak at the gastroesophageal junction. What is the most important next step?
    options: [Upper endoscopy to exclude a malignancy (pseudoachalasia), Pneumatic dilation straight away, Long-acting nitrates before meals, Botulinum toxin injection, Reassurance and repeat barium in 6 months]
    answer: 0
    why:
      - Older age, onset under 1 year and weight loss raise pseudoachalasia; endoscopy is essential to exclude carcinoma.
      - Dilating before excluding a tumour treats the wrong disease.
      - Nitrates relieve symptoms but do not exclude cancer.
      - Botulinum toxin is a treatment, not a diagnostic step.
      - Delay is unsafe with red flags of malignancy.
    src: { page: 273, quote: "Hence, endoscopy should be part of the evaluation of achalasia." }
    status: unverified
  # ---------- p274-277: manometry ----------
  - id: git.L10.040
    kind: card
    topic: manometry
    front: What does esophageal manometry entail?
    back: Placing a pressure-sensing catheter in the esophagus and watching contractility after test swallows. The UES and LES appear as high-pressure zones that relax on swallowing.
    src: { page: 274, quote: "entails positioning a pressure sensing catheter within the esophagus and then observing the contractility following test swallows." }
    status: unverified
  - id: git.L10.041
    kind: card
    topic: manometry
    front: How do impedance recordings work?
    back: They use a catheter with a series of paired electrodes. Manometry can be combined with intraluminal impedance monitoring.
    src: { page: 274, quote: "Impedance recordings utilize a catheter with a series of paired electrodes." }
    status: unverified
  - id: git.L10.042
    kind: card
    topic: manometry
    front: What is now the gold standard for diagnosing esophageal motility disorders?
    back: High-resolution manometry (12-36 pressure channels, with impedance channels).
    src: { page: 275, quote: "is now considered the gold standard for diagnosis of esophageal motility disorders." }
    status: unverified
    tags: [high-yield]
  - id: git.L10.043
    kind: table
    topic: manometry
    title: Normal pressure measurements of the esophagus (mmHg)
    columns: [Site, Resting, "During swallow"]
    rows:
      - [UES, "100", "Relaxes to zero or below"]
      - [Esophageal body, "-5", "Contracts at 30-180"]
      - ["LES (book lists it as a second 'Body of the Esophagus')", "20-40", "Relaxes to 5"]
      - [Gastric fundus, "5", "-"]
    blanks: [[0, 1], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 276, quote: "Resting pressure = 100 mmHg" }
    status: unverified
    tags: [numbers]
  - id: git.L10.044
    kind: enumerate
    topic: manometry
    prompt: Enumerate the manometric criteria of normal esophageal contractions.
    points:
      - Sequential (peristaltic) from above downwards
      - Amplitude 30-180 mmHg
      - Duration 2-6 seconds
      - Single, occasionally double peaked
    pass: 4
    src: { page: 277, quote: "Amplitude of 30-180 mmHg. 3. Duration of 2-6 seconds. 4. Single and occasionally double peaked." }
    status: unverified
    tags: [numbers]
  - id: git.L10.045
    kind: enumerate
    topic: manometry
    prompt: Enumerate the manometric features of achalasia.
    points:
      - Elevated resting LES pressure (above 45 mmHg)
      - Incomplete LES relaxation after a swallow
      - Aperistalsis in the smooth muscle part of the esophageal body
      - Simultaneous contractions above 60 mmHg in "vigorous" achalasia
    pass: 3
    src: { page: 277, quote: "Elevated resting lower esophageal sphincter (LES) pressure (above 45 mmHg)." }
    status: unverified
    tags: [high-yield]
  - id: git.L10.046
    kind: cloze
    topic: manometry
    text: When the simultaneous esophageal contractions of achalasia exceed {{c1::60}} mmHg, the condition is called {{c2::vigorous}} achalasia.
    src: { page: 277, quote: "The simultaneous esophageal contractions have amplitudes >60 mmHg, a condition known as \"vigorous\" Achalasia." }
    status: unverified
    tags: [numbers]
  - id: git.L10.047
    kind: table
    topic: manometry
    title: HRM subtypes of achalasia (Chicago)
    columns: [Type, Pattern in the esophageal body]
    rows:
      - [Type I, No pressure waves in the distal esophagus]
      - [Type II, Panesophageal pressurization]
      - [Type III, "At least 20% of swallows show rapidly propagating or spastic simultaneous contractions"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 277, quote: "Type II is characterized by panesophageal pressurizations" }
    status: unverified
    tags: [high-yield]
  - id: git.L10.048
    kind: cloze
    topic: manometry
    text: Type III achalasia needs at least {{c1::20%}} of swallows with {{c2::rapidly propagating or spastic simultaneous}} contractions.
    src: { page: 277, quote: "Type III, at least 20% of swallows reveal rapidly propagating or spastic simultaneous contractions." }
    status: unverified
    tags: [numbers]
  - id: git.L10.049
    kind: mcq
    topic: manometry
    stem: HRM in a patient with dysphagia shows incomplete LES relaxation and pressurization of the whole esophagus with each swallow, with no peristaltic waves. Which achalasia subtype is this?
    options: [Type II, Type I, Type III, Vigorous achalasia only, Nutcracker esophagus]
    answer: 0
    why:
      - Panesophageal pressurization defines type II.
      - Type I has no pressure waves at all in the distal esophagus.
      - Type III needs at least 20% spastic or rapidly propagating contractions.
      - Vigorous achalasia is defined by simultaneous contractions above 60 mmHg, not pressurization.
      - Nutcracker esophagus has vigorous contractions with normal peristaltic onset and normal LES relaxation.
    src: { page: 277, quote: "Type II is characterized by panesophageal pressurizations" }
    status: unverified
  - id: git.L10.050
    kind: mcq
    topic: manometry
    stem: Which manometric value lies OUTSIDE the lecture's criteria for a normal esophageal contraction?
    options: [Amplitude 210 mmHg, Amplitude 90 mmHg, Duration 4 seconds, Double-peaked wave, Sequential from above downwards]
    answer: 0
    why:
      - Normal amplitude is 30-180 mmHg; above 180 mmHg is a high-amplitude (spastic) feature.
      - 90 mmHg is inside 30-180 mmHg.
      - Normal duration is 2-6 seconds.
      - Waves are single and occasionally double peaked.
      - Normal contractions are sequential from above downwards.
    src: { page: 277, quote: "Amplitude of 30-180 mmHg." }
    status: unverified
  # ---------- p278-279: achalasia treatment ----------
  - id: git.L10.051
    kind: card
    topic: achalasia-tx
    front: Medical treatment of achalasia?
    back: Long-term nitrates or calcium channel blockers, given before eating to lower the resting LES pressure.
    src: { page: 278, quote: "Medical treatment: Long term nitrates, calcium channel blocker are administered before eating to lower the resting LOS pressure." }
    status: unverified
  - id: git.L10.052
    kind: cloze
    topic: achalasia-tx
    text: Botulinum toxin injected into the LES inhibits {{c1::acetylcholine release}} and improves dysphagia in about {{c2::66%}} of cases for at least {{c3::6 months}}.
    src: { page: 278, quote: "inhibits acetylcholine release from nerve endings and improves dysphagia in about 66% of cases for at least 6 months." }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L10.053
    kind: card
    topic: achalasia-tx
    front: What is the standard endoscopic therapy for achalasia, and how is it done?
    back: Pneumatic dilation. A cylindrical balloon is placed across the LES and inflated to 3-4 cm, disrupting the circular muscle layer. Reported efficacy 32-98%.
    src: { page: 278, quote: "Pneumatic dilation, is the standard endoscopic therapy with a reported efficacy ranging from 32–98%" }
    status: unverified
    tags: [high-yield]
