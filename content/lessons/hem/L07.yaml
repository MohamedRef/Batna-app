            <path d="M40 68 V92" class="fg-arrow" marker-end="url(#L07e)"/>
            <rect x="5" y="94" width="95" height="36" rx="8" class="fg-box"/><text x="52" y="117" text-anchor="middle" class="t-sm">M6 erythroid</text>
            <rect x="110" y="94" width="110" height="36" rx="8" class="fg-box"/><text x="165" y="117" text-anchor="middle" class="t-sm">M7 megakaryocyte</text>
            <path d="M60 68 L150 92" class="fg-arrow" marker-end="url(#L07e)"/>
            <text x="10" y="160" class="t-sm t-b t-good">Lymphoid (L)</text>
            <rect x="5" y="170" width="100" height="40" rx="8" class="fg-good"/><text x="55" y="187" text-anchor="middle" class="t-sm t-b">L1</text><text x="55" y="203" text-anchor="middle" class="t-sm">small, uniform</text>
            <rect x="115" y="170" width="100" height="40" rx="8" class="fg-good"/><text x="165" y="187" text-anchor="middle" class="t-sm t-b">L2</text><text x="165" y="203" text-anchor="middle" class="t-sm">larger, variable</text>
            <rect x="225" y="170" width="100" height="40" rx="8" class="fg-good"/><text x="275" y="187" text-anchor="middle" class="t-sm t-b">L3</text><text x="275" y="203" text-anchor="middle" class="t-sm">vacuoles</text>
            <text x="165" y="238" text-anchor="middle" class="t-sm t-mut">Table 1: morphology, cytochemistry, markers, cytogenetics</text>
          </svg>
      - kind: table
        page: 106
        quote: "Table 1: Classification of acute leukemias\n| Subtype | Morphology | Myeloperoxidase | Nonspecific esterase | PAS | Monoclonal reactivity | Cytogenetic abnormalities |\n| M0, Acute undifferentiated leukemia | Uniform, very undifferentiated | - | - | - | For subtypes M0-M5b, approximately | Various |\n| M1, Acute myeloid leukemia with minimal differentiation | Very undifferentiated, few azurophilic granules | +/- | +/- | - | 90% of cases will react with at least one of the following | Various |\n| M2, Acute myeloid leukemia with differentiation | Granulated blasts pre-dominate; auer rods may be seen | +++ | +/- | + | Antimyeloid anti-bodies: Anti-CD13 | Various |\n| M3, Acute promyelocytic leukemia | Hypergranular promyelocytes predominate | +++ | + | + | Anti-CD14, Anti-CD33, Anti-CD34 | T(15;17) |\n| M4, Acute meylomonocytic leukemia, M4E | Both monoblasts and myeloblasts present | ++ | +++ | + | | Various, inv/del(16) |\n| M5, Acute monocytic leukemia (M5a, M5b) | Monoblasts predominante: Type a > 80% monoblasts, Type b > 20% promonocytes | +/- | +++ | + | | T(9;11) |\n| M6, acute erythroleukemia | Erythroblasts and megaloblastic red cell precursors seen | - | - | + | Antiglycophorin, antispectrin | Various |\n| M7, Acute megakaryocytic | undifferentiated blasts | - | +/- | + | Antiplatelet GpIIb/IIIa | Various |\n| L1, Acute lymphoid leukemia, Childhood variant | Small, uniform blasts, nucleoli indistinct | - | - | + | 65% react with anti-CD10 (anti-CALLA) | Various |\n| L2, Acute lymphoid leukemia, adult variant | Larger, more irregular nucleoli present | - | - | + | 20% react with anti-CD5, 3, or 2 (anti-T cell) | Various |\n| L3, Burkitt-like acute lymphoid leukemia | Large with strongly basophilic cytoplasm and vacuoles | - | - | - | Antisurface immuno-globulin, anti-CD19, anti-CD20 | T(8;14) |"
        title: "الـ FAB بتاع AML (Table 1)"
        columns: [FAB, "Name: clue"]
        rows:
