          - "الـ BMT للـ SCID."
          - "الـ danazol للوقاية في الـ HAE."
      - kind: explain
        remind: [rheum.L11.059]
        page: 190
        title: "تطعيمات وعلاجات تانية"
        quote: "Live vaccines (eg, bacille Calmette-Guérin, polio, measles, rubella, mumps) should not be given to patients (or their family members) with T-cell disorders, XLA, or other severe B-cell disorders.\nInterleukin-2 may improve in vitro lymphocyte function in patients with CVID.\nHigh doses of IVIG or intrathecal Ig may be beneficial in patients with enteroviral meningoencephalitis.\nBone marrow transplantation is the treatment of choice for patients with SCID. More recently, the success with gene therapy in the treatment of certain patients with SCID revived the hope of definitive cure for these disorders."
        text: |
          - **Live vaccines** (BCG، polio، measles، rubella، mumps): ممنوعة على العيان ==وأهله== في T-cell disorders و XLA و severe B-cell disorders. ليه الأهل؟ التفسير المقبول (مش في الكتاب): بعضها (زي oral polio) بيطلع من اللي اتطعّم ويعدي اللي في البيت
          - **CVID:** الـ interleukin-2 ممكن يحسّن وظيفة الـ lymphocytes in vitro
          - **Enteroviral meningoencephalitis:** IVIG بجرعة عالية أو intrathecal Ig
          - **SCID:** ==bone marrow transplantation== هو العلاج، و **gene therapy** رجّعت الأمل في cure نهائي. ليه BMT؟ لأنه بيدّي نخاع جديد بيطلّع B و T سليمين، مش بس antibodies جاهزة
