        rows:
          - ["Anaemia", "Normocytic normochromic, 70%"]
          - ["Platelets", "Low in ~15%"]
          - ["Film / ESR", "Rouleaux; ESR almost always high"]
          - ["Calcium", "High in 30%"]
          - ["ALP", "Usually normal"]
          - ["Electrophoresis", "Peak in 80%"]
          - ["Marrow", "Plasma cells > 10%"]
        hide: [[0, 1], [3, 1], [4, 1], [5, 1], [6, 1]]
      - kind: reveal
        page: 180
        quote: "Serum alkaline phosphatase is usually normal."
        prompt: "عضم متآكل كله lytic lesions، والـ ALP طبيعي؟ إزاي؟"
        answer: "الـ ALP (alkaline phosphatase) بيطلع من الـ osteoblasts وهي بتبني. في الـ myeloma الشغل كله osteoclast (هدم) والـ osteoblasts مكبوتة، فمفيش بناء يرفع الـ ALP. (الكتاب ذكر المعلومة؛ السبب physiology معروفة.) ولنفس السبب الـ bone scan ممكن يطلع طبيعي."
      - kind: explain
        page: 180
        quote: "Total protein is normal or raised.\nImpairment of renal function at diagnosis (proteinuria, Bence Jones proteinuria)\nProtein electrophoresis shows a peak in 80% of patients."
        title: "البروتين: إجمالي، electrophoresis، والنخاع"
        text: |
          - **Total protein** normal أو raised.
          - **Renal impairment** وقت التشخيص (proteinuria، Bence Jones).
          - **Protein electrophoresis**: ==peak في 80%==.
          - **Bone marrow plasma cells > 10%** of nucleated cells.

          ليه الـ total protein ممكن يبقى **طبيعي**؟ التفسير المقبول (مش في الكتاب): الـ paraprotein بيزوّد، بس الـ antibodies الطبيعية بتقل (immune paresis) والـ albumin ممكن يقل، فالمجموع يتعادل. وليه الـ peak في 80% بس؟ افتكر الـ **20% light chain only** (ص 177): الـ light chains بتطلع في البول، فالسيرم ممكن يبقى من غير spike.
      - kind: aside
        tone: trap
        page: 180
        quote: "Patients with light-chain (Bence Jones) and IgD myeloma have a higher incidence of renal failure, amyloidosis and greater light-chain protein excretion."
        text: "مين أكتر واحد بيبوّظ الكلية؟ الـ light-chain (Bence Jones) myeloma والـ Immunoglobulin D (IgD) myeloma. أكتر light chains في البول = أكتر casts."
      - kind: figure
        page: 180
        quote: "Protein electrophoresis shows a peak in 80% of patients."
        title: "الـ M spike في الـ electrophoresis"
        alt: "Two serum protein electrophoresis traces. Normal: a tall albumin peak then small alpha-1, alpha-2 and beta bumps and a broad low gamma hump. Myeloma: a lower albumin peak and a tall narrow spike in the gamma region, the M band, with the rest of the gamma region low."
        caption: "الطبيعي: الـ gamma **عريضة وواطية** (آلاف الـ clones). الـ myeloma: ==spike رفيع وعالي== (clone واحد) والباقي واطي (immune paresis)."
        svg: |
