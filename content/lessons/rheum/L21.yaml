        prompt: "ليه الـ ACE inhibitor أول حاجة في الـ renal crisis بالذات، وليه الترتيب ده؟"
        answer: |
          الكتاب بيرتّبها: ==ACE inhibitors== ← antihypertensives تانية ← **dialysis** ← **renal transplant**.

          التفسير المقبول (مش في الكتاب): الـ renal crisis بيحصل لما الأوعية الصغيرة في الكلى تضيق، فالكلية تحس إن الدم قليل وتطلّع **renin** كتير ← angiotensin II ← ضغط أعلى وتضييق أكتر. الـ ACE inhibitor بيقطع الحلقة دي من نصها، وده سبب إنه غيّر الـ prognosis (فاكر إن الرئة بقت أول سبب وفاة «since we are better at control of renal disease»). الباقي لو الضغط ماتظبطش أو الكلى وقفت.
