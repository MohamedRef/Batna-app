schema: batna.content/v1
lecture: res.L03
title: "Research question, objectives and hypotheses"
author: Prof. Hany Ziady
book: { chapter: 1, pages: [1, 85] }
topics:
  - { id: process, title: "Where the research question sits in the research process" }
  - { id: types, title: "Types of research question: descriptive, comparative, causal; qualitative vs quantitative" }
  - { id: narrowing, title: "From topic of interest to a focused question" }
  - { id: finer, title: "FINER criteria and good vs bad questions" }
  - { id: pico, title: "PICO and PICOT" }
  - { id: objectives, title: "Research objectives: SMART, formats, general and specific" }
  - { id: hypotheses, title: "Research hypotheses: definition and types" }
  - { id: title, title: "Title of the research" }
items:
  # ---------------------------------------------------------------- process
  - id: res.L03.001
    kind: card
    topic: process
    front: What is the first step in any research project?
    back: To clearly define the research question.
    src: { page: 8, quote: "The first step in any research project is to clearly define the research question" }
    status: unverified
    tags: [definition]
  - id: res.L03.002
    kind: card
    topic: process
    front: Define a research question.
    back: >-
      A clear and concise question that expresses what the research project aims to address or answer.
      It defines the area of interest, and it leads to the study justification (rationale).
    src: { page: 9, quote: "A research question is a clear and concise question which expresses: what the research project aims to address/answer" }
    status: unverified
    tags: [definition, high-yield]
  - id: res.L03.003
    kind: enumerate
    topic: process
    prompt: What three things does the research question do for a study?
    points:
      - Focuses the study
      - Determines the methodology
      - Guides all stages of inquiry, data analysis and reporting
    pass: 3
    src: { page: 10, quote: "It focuses the study, determines the methodology and guides all stages of inquiry, data analysis, and reporting." }
    status: unverified
    tags: [high-yield]
  - id: res.L03.004
    kind: enumerate
    topic: process
    prompt: What drives health research? (Where do research ideas come from?)
    points: [Curiosity-driven, Needs-driven, Profit-driven, Opportunity-driven]
    pass: 4
    src: { page: 5, quote: "Curiosity-driven Needs-driven Profit-driven Opportunity-driven" }
    status: unverified
  - id: res.L03.005
    kind: order
    topic: process
    prompt: Order the steps of developing a research proposal, as in the lecture's framework.
    steps:
      - Selection, analysis and statement of the research problem
      - Literature review
      - Formulation of research objectives
      - Research methodology
      - Work plan
      - Budget
      - Plan for project administration and utilisation of results
      - Proposal summary
    src: { page: 3, quote: "Selection, analysis and statement of the research problem" }
    status: unverified
    tags: [high-yield]
  - id: res.L03.006
    kind: mcq
    topic: process
    stem: >-
      In the research proposal framework, which step holds the general and specific objectives and the
      hypotheses?
    options:
      - Selection, analysis and statement of the research problem
      - Formulation of research objectives
      - Research methodology
      - Work plan
    answer: 1
    why:
      - "This step holds problem identification, prioritising problems, analysis and justification."
      - "Formulation of research objectives: general and specific objectives, and hypotheses."
      - "Methodology holds variables, types of study, data collection, sampling, analysis plan, ethics and the pilot study."
      - "The work plan holds human resources and the timetable."
    src: { page: 3, quote: "general and specific objectives hypotheses" }
    status: unverified
  - id: res.L03.007
    kind: enumerate
    topic: process
    prompt: List the elements of the research methodology step of a proposal.
    points:
      - Variables
      - Types of study
      - Data collection techniques
      - Sampling
      - Plan for data collection
      - Plan for data processing and analysis
      - Ethical considerations
      - Pre-test or pilot study
    pass: 6
    src: { page: 3, quote: "variables - types of study - data collection techniques = sampling" }
    status: unverified
  - id: res.L03.008
    kind: enumerate
    topic: process
    prompt: List the elements of the first proposal step, selection, analysis and statement of the research problem.
    points: [Problem identification, Prioritising problems, Analysis, Justification]
    pass: 4
    src: { page: 3, quote: "problem identification" }
    status: unverified
  - id: res.L03.009
    kind: table
    topic: process
    title: How the type of clinical question determines the study design
    columns: [Type of question, Study design (best first)]
    rows:
      - [Therapy, "RCT > Cohort > Case control > Case series/reports"]
      - [Diagnosis, "Prospective, blind comparison to a gold standard, or cross-sectional"]
      - [Harm/Etiology, "RCT > Cohort > Case control > Case series/reports"]
      - [Prognosis, "Cohort > Case control > Case series/reports"]
      - [Prevention, "RCT > Cohort > Case control > Case series/reports"]
      - [Clinical exam, "Prospective, blind comparison to a gold standard"]
      - [Cost analysis, Economic analysis]
    blanks: [[1, 1], [3, 1], [6, 1]]
    src: { page: 11, quote: "Prognosis Cohort > Case Control > Case Series/Reports" }
    status: unverified
    tags: [high-yield]
  - id: res.L03.010
    kind: mcq
    topic: process
    stem: For a question about prognosis, which design comes first in the lecture's table?
    options: [Randomised controlled trial, Cohort study, Case-control study, Economic analysis]
    answer: 1
    why:
      - "The prognosis row has no RCT: you cannot randomise people to a prognosis."
      - "Prognosis: Cohort > Case control > Case series/reports."
      - "Case-control is second for prognosis."
      - "Economic analysis answers cost-analysis questions."
    src: { page: 11, quote: "Prognosis Cohort > Case Control > Case Series/Reports" }
    status: unverified
  - id: res.L03.011
    kind: mcq
    topic: process
    stem: Which design answers a question about the accuracy of a new diagnostic test, per the lecture?
    options:
      - "Prospective, blind comparison to a gold standard, or cross-sectional"
      - Cohort study first
      - Randomised controlled trial first
      - Economic analysis
    answer: 0
    why:
      - "Diagnosis: prospective, blind comparison to a gold standard, or a cross-sectional study."
      - "Cohort comes first for prognosis."
      - "RCT comes first for therapy, harm/etiology and prevention."
      - "Economic analysis is for cost-analysis questions."
    src: { page: 11, quote: "Diagnosis Prospective, blind comparison to a gold standard or Cross- Sectional" }
    status: unverified
  - id: res.L03.012
    kind: card
    topic: process
    front: Which types of question that are best answered by an RCT can also be answered by a systematic review or meta-analysis?
    back: Questions on therapy, etiology and prevention.
    src: { page: 11, quote: "Questions on therapy, etiology and prevention that can best be answered by an RCT, can also be answered by a systematic review or meta-analysis." }
    status: unverified
  - id: res.L03.013
    kind: cloze
    topic: process
    text: "Harm/etiology questions can be answered by {{c1::RCTs}} only if {{c2::ethical issues}} allow it."
    src: { page: 11, quote: "Harm/Etiology studies can be answered by RCTs if ethical issues allow it." }
    status: unverified
  # ------------------------------------------------------------------ types
  - id: res.L03.014
    kind: card
    topic: types
    front: What does a descriptive research question do?
    back: >-
      It seeks to describe a phenomenon, often "how much", "how often", or "what is the change, clinical
      picture or consequences".
    src: { page: 13, quote: "Seek to describe a phenomena and often study “how much”, “how often”, or “what is the change/clinical picture/consequences”." }
    status: unverified
    tags: [definition, high-yield]
  - id: res.L03.015
    kind: card
    topic: types
    front: What does a comparative research question do, and how does it often begin?
    back: >-
      It examines the difference between two or more groups in relation to one or more variables. It often
      begins with "What is the difference…".
    src: { page: 14, quote: "Aim to examine the difference between two or more groups in relation to one or more variables." }
    status: unverified
    tags: [definition, high-yield]
  - id: res.L03.016
    kind: card
    topic: types
    front: What does a causal research question do, and what is its other name?
    back: >-
      It compares two or more phenomena and determines whether a relationship exists. It is often called a
      relationship research question.
    src: { page: 15, quote: "Compares two or more phenomena and determines if a relationship exists. Often called relationship research questions." }
    status: unverified
    tags: [definition, high-yield]
  - id: res.L03.017
    kind: table
    topic: types
    title: The three main types of research question
    columns: [Type, What it does, Lecture example]
    rows:
      - [Descriptive, "Describes a phenomenon: how much, how often, what is the change or picture", "What is the prevalence of depression among medical students?"]
      - [Comparative, "Examines the difference between two or more groups in one or more variables", "What is the difference in maternal mortality in an urban compared to a rural community?"]
      - [Causal, "Compares phenomena and determines if a relationship exists", "Does the number of cigarettes smoked per day affect the severity of COPD?"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 12, quote: "Descriptive Questions 2- Comparative Questions 3- Causal Questions" }
    status: unverified
  - id: res.L03.018
    kind: mcq
    topic: types
    stem: '"What is the prevalence of depression among medical students?" What type of research question is this?'
    options: [Descriptive, Comparative, Causal, It is a hypothesis]
    answer: 0
    why:
      - "It asks how much of something there is in one group: descriptive."
      - "A comparative question needs two or more groups."
      - "A causal question asks whether one thing affects another."
      - "A hypothesis is a statement that predicts, not a question."
    src: { page: 13, quote: "What is the prevalence of depression among medical students?" }
    status: unverified
  - id: res.L03.019
    kind: mcq
    topic: types
    stem: '"What is the difference between the prevalence of depression among medical students and tourism students?" What type of research question is this?'
    options: [Descriptive, Comparative, Causal, Qualitative]
    answer: 1
    why:
      - "It goes beyond describing one group: it sets two groups side by side."
      - "Two groups, one variable, \"what is the difference\": comparative."
      - "It does not ask whether studying medicine causes depression."
      - "It measures prevalence, a number: a quantitative question."
    src: { page: 14, quote: "What is the difference between prevalence of depression among medical students and tourism students?" }
    status: unverified
  - id: res.L03.020
    kind: mcq
    topic: types
    stem: '"Does the time of moderate daily exercise affect the extent of improvement in blood pressure?" What type of research question is this?'
    options: [Descriptive, Comparative, Causal, Not a research question]
    answer: 2
    why:
      - "It does not just describe how much people exercise."
      - "It compares no two named groups."
      - "\"Does X affect Y?\": it looks for a relationship, so it is causal (relationship) research."
      - "It is a clear question with measurable variables."
    src: { page: 15, quote: "Does the time of moderate daily exercise affect the extent of improvement in blood pressure?" }
    status: unverified
  - id: res.L03.021
    kind: mcq
    topic: types
    stem: '(Lecture quiz) What type of research question is: "How often do college students change majors?"'
    options: [Causal question, Descriptive question, Comparative question, None of these]
    answer: 1
    why:
      - "No relationship between two variables is asked about."
      - "\"How often\" describes a phenomenon: descriptive. This is the quiz answer."
      - "There is only one group."
      - "It fits the descriptive type."
    src: { page: 74, quote: "What type of research question is the following: How often do college students change majors?" }
    status: unverified
    tags: [lecture-quiz]
  - id: res.L03.022
    kind: card
    topic: types
    front: '(Lecture quiz) True or false: "Causal research questions are used when wanting to compare a variable between two or more groups."'
    back: >-
      False (the quiz answer). Comparing a variable between two or more groups is a comparative question;
      a causal question looks for a relationship between phenomena.
    src: { page: 76, quote: "Causal research questions are used when wanting to compare a variable between two or more groups." }
    status: unverified
    tags: [lecture-quiz]
  - id: res.L03.023
    kind: cloze
    topic: types
    text: "Comparative questions often begin with \"{{c1::What is the difference}}…\", and causal questions are often called {{c2::relationship}} research questions."
    src: { page: 15, quote: "Often called relationship research questions." }
    status: unverified
  - id: res.L03.024
    kind: card
    topic: types
    front: What can qualitative research add to health research?
    back: >-
      It can help close the gap between the science of discovery and the implementation of results. It is
      often needed to find out why research results are not translated into practice.
    src: { page: 17, quote: "Qualitative research can help in closing the gap between the science of discovery and the implementation of results." }
    status: unverified
  - id: res.L03.025
    kind: card
    topic: types
    front: How do qualitative research questions differ from quantitative ones?
    back: >-
      Qualitative questions tend to be open and descriptive, and one general open question may be followed
      by several sub-questions. Quantitative questions should remain fixed.
    src: { page: 18, quote: "Qualitative research questions tend to be open and descriptive, unlike Quantitative research questions which should remain fixed." }
    status: unverified
    tags: [high-yield]
  - id: res.L03.026
    kind: enumerate
    topic: types
    prompt: Which words in a research question are clues that a qualitative methodology will be used?
    points: [Seek to understand, Describe, Explore]
    pass: 3
    src: { page: 18, quote: "‘seek to understand’, ‘describe’, ‘explore’ give clues to the methodology to be used." }
    status: unverified
  - id: res.L03.027
    kind: order
    topic: types
    prompt: Order the chain shown beside qualitative research on the lecture's slide.
    steps: [Knowledge, Belief, Attitude, Value, Behavior]
    src: { page: 16, quote: "Knowledge Belief Attitude Value Behavior" }
    status: unverified
  - id: res.L03.028
    kind: card
    topic: types
    front: In the lecture's qualitative example on visual display units (VDU), what is the research question?
    back: >-
      To explore how psychosocial aspects of working with VDUs are related to job stress, and what their
      consequences are for mental and physical health. Sub-questions then define each term: psychosocial
      aspects, job stress, physical and mental health.
    src: { page: 19, quote: "job stress and what their consequences are for mental and physical health" }
    status: unverified
  - id: res.L03.029
    kind: card
    topic: types
    front: '(Lecture quiz) True or false: "A hypothesis is commonly used in quantitative studies, but is not appropriate for qualitative studies."'
    back: False (the quiz answer).
    src: { page: 74, quote: "A hypothesis is commonly used in quantitative studies, but is not appropriate for qualitative studies." }
    status: unverified
    tags: [lecture-quiz]
  # -------------------------------------------------------------- narrowing
  - id: res.L03.030
    kind: order
    topic: narrowing
    prompt: Order the steps from a broad interest to a researchable question, as in the lecture's examples.
    steps:
      - Topic of interest
      - Narrowed topic
      - Focused topic
      - Focused research question
      - How the variables will be measured
    src: { page: 23, quote: "Topic of interest: Women’s health • Narrowed topic: Women and cancer • Focused topic" }
    status: unverified
  - id: res.L03.031
    kind: card
    topic: narrowing
    front: 'Topic "physical activity and cardiovascular disease": what is the lecture''s focused researchable question?'
    back: >-
      "Will 30 minutes of moderate activity daily reduce hypertension in office workers?" (narrowed topic:
      is there a link between lack of physical activity and hypertension?)
    src: { page: 22, quote: "Focused researchable question: Will 30 minutes of moderate activity daily reduce hypertension in office workers?" }
    status: unverified
  - id: res.L03.032
    kind: card
    topic: narrowing
    front: 'Topic "women''s health", narrowed to "women and cancer": what focused question does the lecture build on hormone replacement therapy?'
    back: >-
      "Does post-menopausal hormone replacement therapy predispose women to develop endometrial cancer?"
      Next: decide how the variables will be measured.
    src: { page: 23, quote: "Does post-menopausal hormone replacement therapy predispose women to develop endometrial cancer?" }
    status: unverified
  - id: res.L03.033
    kind: table
    topic: narrowing
    title: "PICO of the lecture's example: women smokers and breast cancer"
    columns: [Element, In this example]
    rows:
      - [P (population), Women older than 35]
      - [I (intervention/exposure), Cigarette smoking]
      - [C (comparison), No smoking]
      - [O (outcome), Breast cancer]
    blanks: [[0, 1], [2, 1], [3, 1]]
    src: { page: 21, quote: "I = Cigarette smoking C = No smoking" }
    status: unverified
  # ------------------------------------------------------------------ finer
  - id: res.L03.034
    kind: enumerate
    topic: finer
    prompt: What are the FINER criteria of a good research question?
    points: [Feasible, Interesting, Novel, Ethical, Relevant]
    pass: 5
    src: { page: 35, quote: "N — Novel E — Ethical R - Relevant" }
    status: unverified
    tags: [high-yield]
  - id: res.L03.035
    kind: enumerate
    topic: finer
    prompt: What must you check for a research question to be feasible?
    points:
      - Recruiting the number of subjects
      - Timeframe
      - Equipment, supplies and others
      - Required expertise
      - Resources
    pass: 4
    src: { page: 26, quote: "recruit the number of subjects • timeframe • equipment, supplies and other • required expertise. • resources" }
    status: unverified
  - id: res.L03.036
    kind: card
    topic: finer
    front: "FINER: what do \"Intrigues\" and \"Manageable\" mean in the criteria box?"
    back: >-
      Intrigues: the answer arouses the curiosity or interest of the investigator, peers and community
      (Interesting). Manageable: not too many aims or too ambitious (Feasible: manageable in scope).
    src: { page: 25, quote: "Intrigues: arouses the curiosity or interest Manageable: not too many or too ambitious" }
    status: unverified
  - id: res.L03.037
    kind: card
    topic: finer
    front: "FINER \"Interesting\": interesting to whom?"
    back: To the investigators and to the scientific community.
    src: { page: 27, quote: "The research topic must be of interest to the investigators & to the scientific community." }
    status: unverified
  - id: res.L03.038
    kind: card
    topic: finer
    front: "FINER \"Novel\": does it mean the research has never been done before?"
    back: >-
      No. The prefix "re" in research implies searching again. A novel study confirms, refutes or extends
      previous findings.
    src: { page: 28, quote: "Novel does not necessarily mean that the research has not been done before." }
    status: unverified
    tags: [high-yield]
  - id: res.L03.039
    kind: card
    topic: finer
    front: "FINER \"Ethical\": what can an ethical problem mean for a research idea?"
    back: Some ethical problems indicate that the research should not be considered from the beginning.
    src: { page: 29, quote: "Some ethical problems may indicate that the research should not be considered from the beginning." }
    status: unverified
  - id: res.L03.040
    kind: card
    topic: finer
    front: Before testing a new therapy or procedure on patients, what evidence must already exist?
    back: >-
      Evidence that it can be superior to the current alternatives, and adequate data from animal studies
      and from a small number of human subjects that confirm safety and suggest effectiveness.
    src: { page: 30, quote: "Adequate data must be available from animal studies and from studies on a small number of human subjects to confirm safety" }
    status: unverified
  - id: res.L03.041
    kind: card
    topic: finer
    front: What is the ethically acceptable way to step up clinical trials?
    back: >-
      In successive phases: start with a small number of subjects, and move to the next phase only after
      the previous phase is completed successfully.
    src: { page: 30, quote: "The ethically acceptable practice is to step up clinical trials in successive phases, starting first with a small number of subjects" }
    status: unverified
  - id: res.L03.042
    kind: cloze
    topic: finer
    text: >-
      It is unjustifiable to do clinical trials on therapies that are {{c1::unlikely to become available}}
      to people in the community, and research should not conflict with the society's {{c2::cultural, moral,
      religious and legal}} values.
    src: { page: 31, quote: "It is unjustifiable to do clinical trials on therapies that are unlikely to become available to people in the country or community." }
    status: unverified
  - id: res.L03.043
    kind: card
    topic: finer
    front: When is research on healthy volunteers who get no immediate benefit acceptable?
    back: >-
      Only if the information is likely to advance scientific knowledge and medical practice, and cannot be
      obtained otherwise (for example through animal experiments). Research on animals must itself be
      justified.
    src: { page: 32, quote: "if the information cannot be obtained otherwise, e.g. through animal experimentation." }
    status: unverified
  - id: res.L03.044
    kind: enumerate
    topic: finer
    prompt: To be relevant, what must a research question have the potential to do?
    points:
      - Advance scientific knowledge
      - Influence clinical management
      - Influence health policy
      - Guide further research
    pass: 4
    src: { page: 33, quote: "have the potential to advance scientific knowledge influence clinical management influence health policy guide further research" }
    status: unverified
    tags: [high-yield]
  - id: res.L03.045
    kind: enumerate
    topic: finer
    prompt: Describe the best research question (the lecture's seven points).
    points:
      - Fills a knowledge gap in the literature
      - Is answerable and researchable
      - Is relevant to the study objectives/hypotheses
      - Avoids duplicating previous work
      - Is feasible and cost-effective
      - Is doable within the time frame allocated to the project
      - Meets the minimum ethical standards
    pass: 5
    src: { page: 34, quote: "attempts to fill a knowledge gap in the literature" }
    status: unverified
  - id: res.L03.046
    kind: enumerate
    topic: finer
    prompt: List the criteria of a bad research question.
    points:
      - Vagueness
      - Too broad to reach conclusive results
      - Fails to reveal the relevance of the topic
      - "Logistic limits: time, high cost with limited funding, limited expertise, equipment or information"
      - Limited by ethical considerations or the need for authorities' approval
    pass: 4
    src: { page: 41, quote: "Vagueness of the research question." }
    status: unverified
    tags: [high-yield]
  - id: res.L03.047
    kind: cloze
    topic: finer
    text: "In conclusion, a research question needs to be {{c1::specific}}, {{c2::concrete}} and {{c3::measurable}}."
    src: { page: 42, quote: "A research question needs to be: specific concrete measurable." }
    status: unverified
  - id: res.L03.048
    kind: mcq
    topic: finer
    stem: >-
      Compare (1) "Will 30 minutes of activity improve blood pressure?" with (2) "Will 30 minutes of
      moderate activity daily reduce hypertension in office workers?" Which statement is right?
    options:
      - Question 2 is specific and names the population; question 1 is vague and broad
      - Question 1 is better because it is shorter
      - Both are equally specific
      - Question 1 names the population
    answer: 0
    why:
      - "The lecture: 2 is specific and specifies the population (office workers); 1 is vague and broad."
      - "Short is not the goal: question 1 leaves out intensity, frequency and who."
      - "Only question 2 says moderate, daily, and office workers."
      - "Question 1 names no population."
    src: { page: 43, quote: "will 30 minutes of moderate activity daily reduce hypertension in office workers" }
    status: unverified
  - id: res.L03.049
    kind: mcq
    topic: finer
    stem: '"Will good environment improve health?" What is wrong with this research question?'
    options:
      - It is too broad to reach conclusive results and names no population
      - It is unethical
      - It is not novel
      - Nothing; it is a good question
    answer: 0
    why:
      - "The lecture: neither specific nor measurable, too broad to reach conclusive results, no population."
      - "Nothing in it is unethical; the problem is vagueness."
      - "Novelty is not the issue here."
      - "\"Good environment\" and \"health\" cannot be measured as written."
    src: { page: 44, quote: "It is too broad to reach conclusive results" }
    status: unverified
  - id: res.L03.050
    kind: mcq
    topic: finer
    stem: '"Will voluntary induced abortion after the 3rd month increase the incidence of maternal mortality?" What limits this question?'
    options: [Ethical and legal issues, Vagueness, Lack of novelty, It is too narrow]
    answer: 0
    why:
      - "The lecture: limited by ethical and legal issues (FINER's E)."
      - "It is specific: exposure, timing and outcome are all named."
      - "Novelty is not the issue."
      - "Being specific is a virtue, not a flaw."
    src: { page: 44, quote: "Limited by ethical and legal issues" }
    status: unverified
  - id: res.L03.051
    kind: case
    topic: finer
    stem: >-
      A first-year resident plans to recruit 3,000 patients with hepatic encephalopathy, alone, in two
      months, using a brain MRI protocol his hospital doesn't have.
    steps:
      - question: Which FINER criterion fails first?
        options: [Feasible, Interesting, Novel, Relevant]
        answer: 0
        why: "Number of subjects, timeframe, equipment and expertise are all feasibility items (slide 26)."
      - question: Which criterion of a bad question does this match?
        options:
          - Logistic limits (time, cost, expertise, equipment)
          - Vagueness
          - Ethical limits
          - Failing to show relevance
        answer: 0
        why: "The slide lists time, high cost with limited funding and limited expertise or equipment as logistic criteria."
    src: { page: 26, quote: "recruit the number of subjects • timeframe • equipment, supplies and other • required expertise." }
    status: unverified
  # ------------------------------------------------------------------- pico
  - id: res.L03.052
    kind: card
    topic: pico
    front: What four elements should a well-built clinical research question include?
    back: "PICO: Population (patient), Intervention, Comparison, Outcome."
    src: { page: 36, quote: "A well-built research question should include four elements; referred to as PICO" }
    status: unverified
    tags: [high-yield]
  - id: res.L03.053
    kind: card
    topic: pico
    front: "PICO \"P\": what does it describe?"
    back: >-
      The patients or population to be studied: their characteristics, such as age, gender, disease status
      or any other patient-related characteristic. It is the first step of PICO.
