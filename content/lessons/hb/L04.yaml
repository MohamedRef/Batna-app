      - kind: explain
        page: 83
        quote: "A major concern on the use of heparins in cirrhosis is the reduction of antithrombin that is a typical feature of patients with advanced disease"
        title: "مشكلة الهيبارين"
        text: |
          الـ **heparin** مابيشتغلش لوحده: هو بيقوّي ==antithrombin==، والـ antithrombin هو اللي بيوقّف الـ thrombin والـ factor Xa. والـ antithrombin بيقل في الـ advanced cirrhosis لأن الكبد هو اللي بيصنعه. يعني الهيبارين يبقى مفتاح من غير قفل.

          مشاكل الـ **unfractionated heparin (UFH)** في الـ cirrhosis:

          - **Low antithrombin**: الدوا أضعف من المتوقع.
          - ==APTT monitoring==: الـ baseline APTT طويل أصلًا، فهتفتكر إنك وصلت للـ target وانت لسه under-dosed.
          - **Side effects**: الـ HIT والـ osteoporosis.

          النتيجة: الـ UFH probably not indicated في الـ cirrhosis.

          والـ **LMWH**؟ الكتاب بيقول إن فعاليته وأمانه في الـ cirrhosis (fixed أو weight-adjusted) unclear.
