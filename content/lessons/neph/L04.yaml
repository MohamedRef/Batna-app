      - kind: explain
        page: 88
        quote: "SNS is overactive in CKD"
        title: "ليه الـ denervation والـ nephrectomy بيوطّوا الضغط؟"
        text: |
          الكتاب: الـ **SNS overactive in CKD**، والعلاج فيه **renal denervation**، **nephrectomy**، و **ACEi و ARBs**. والـ **renalase** (من الكلية) بيكسّر الـ catecholamines.

          التفسير المقبول (مش في الكتاب): الكلية المريضة **بتبعت إشارات عصبية** للمخ تعلّي الـ sympathetic كله. لو قطعت الأعصاب أو شلت الكلية، الإشارة **تقف**. والكلية التعبانة بتعمل **renalase** أقل، **فـ** الـ catecholamines تفضل في الدم أطول.
      - kind: figure
        page: 88
        quote: "Renal damage → ↑ ACE expression → ↑ATII → renal damage + SSHT"
        title: "دايرة الـ RAAS في الكلى"
        alt: "A cycle: renal damage leads to increased ACE expression, then increased angiotensin II, which causes sodium reabsorption, arteriolar vasoconstriction and aldosterone secretion, leading back to more renal damage and salt-sensitive hypertension."
        caption: "الـ renin من الـ **juxtaglomerular (JG) cells** في الـ afferent arteriole. الـ AT II: ↑Na reabsorption، vasoconstriction، aldosterone. والدايرة تقفل: damage ← ↑angiotensin-converting enzyme (ACE) ← ↑AT II ← damage أكتر."
