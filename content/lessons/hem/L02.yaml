  - id: hem.L02.lesson2
    title: "العيان بيقولك السبب: التاريخ المرضي والكشف"
    hook: "الأكل، الشغل، الأدوية، العيلة، والضوافر. نص التشخيص بيخلص قبل ما تطلب أول تحليل."
    minutes: 8
    pages: [11, 13]
    topics: [history, examination]
    goals:
      - "تسأل الأسئلة الصح في الأكل والأدوية والعيلة"
      - "تعرف علامات الأنيميا العامة والعلامات اللي بتشاور على نوع معين"
      - "تقرأ الطحال: soft ولا firm"
    status: unverified
    steps:
      - kind: explain
        page: 11
        title: "الأكل والكحول والشغل"
        quote: "iron (meat), folic acid (fresh fruits and vegetables) and B12 (meat, dairy products)"
        text: |
          **الأكل**: **iron** من اللحمة، **folic acid** من الخضار والفاكهة الطازة، **B12** من اللحمة والألبان.

          **الكحول** بيبوّظ ==folate metabolism== وبيعمل liver disease.

          **الشغل والهوايات**: كيماويات سامة للنخاع زي ==organic solvents== و **hydrocarbons**.
      - kind: aside
        tone: tip
        page: 11
        quote: "iron (meat), folic acid (fresh fruits and vegetables) and B12 (meat, dairy products)"
        text: "الـ **vegan** الصارم مش هياخد **B12** خالص (لحمة وألبان بس). والفول لوحده مش هيكفّي حديد زي اللحمة. 😄 الفول مصدر عظيم للبروتين والحب، مش للـ B12."
      - kind: explain
        page: 11
        title: "التاريخ اللي فات والعيلة"
        quote: "Past history: gastrectomy with later occurrence of Fe and/or B12 deficiency."
        text: |
          - ==Gastrectomy== قديمة = بعد سنين **iron و/أو B12 deficiency**.
          - **Blood loss**: GIT، نسا، أو **blood donation**.
          - renal function، malignancy، أنيميا قبل كده، CBC قديم، علاج حديد أو folate أو B12 قبل كده.
          - **العيلة**: **HS** (hereditary spherocytosis)، **thalassaemia**، **HbSS**، و ==hereditary telangiectasia== (نزيف GIT مزمن).
          - **Menorrhagia** و **pregnancy**: بيضيّعوا حديد.
      - kind: table
        page: 11
        quote: "Oxidant drugs causing haemolysis in enzyme deficiency"
        title: "الأدوية بتعمل أنيميا إزاي؟"
        columns: [Mechanism, Drugs]
        rows:
          - ["Folate metabolism", "Sulfa, trimethoprim, antiepileptics"]
          - ["Haemolysis (enzyme def.)", "Oxidant drugs"]
          - ["GI blood loss", "NSAIDs"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: check
        page: 11
        quote: "Interference with folate metabolism (sulfa drugs, trimethoprim, antiepileptic medications)"
        question: "Which drug in the history points to folate deficiency?"
        options:
          - "Trimethoprim"
          - "Ibuprofen"
          - "Oxidant drug in G6PD deficiency"
          - "Iron tablets"
        answer: 0
        why:
          - "صح: sulfa و trimethoprim والـ antiepileptics بيبوظوا الـ folate metabolism."
          - "الـ NSAIDs بتعمل نزيف من الـ gastritis أو الـ ulcer، يعني iron deficiency."
          - "دي haemolysis، مش نقص folate."
          - "الحديد علاج، مش سبب أنيميا."
      - kind: explain
        page: 12
        title: "الكشف: علامات الأنيميا نفسها"
        quote: "pallor in palmar skin creases (Hb<75 g/l)"
        text: |
          - ==Pallor==: الجلد (خصوصًا تحت الضوافر)، الـ mucous membranes، الـ conjunctivae. شحوب **خطوط كف الإيد** = Hb < **75 g/L**.
          - **Orthostatic hypotension** و **tachycardia**.
          - القلب شغال زيادة: **apical impulse** واضح، **bounding pulses**، **wide pulse pressure**، و ==systolic ejection murmur==، ويمكن **CHF**.
      - kind: figure
        page: 12
        quote: "Fanconi‘s anemia: skin discoloration, short stature and skeletal problems such as misshapen or missing thumbs."
        title: "خريطة العلامات من راسه لرجله"
        alt: "A body outline with labels: lateral eyebrow loss for hypothyroidism; telangiectasias around mouth and ears for GI bleeding; vitiligo for cobalamin deficiency; jaundice for haemolysis; spoon nails for iron deficiency; abnormal thumbs and short stature for Fanconi anaemia; spleen for AIHA, PK deficiency, myelofibrosis, Gaucher and thalassaemia; leg ulcers for sickle cell disease; posterior and lateral cord and peripheral nerves for cobalamin deficiency."
        caption: "كل علامة بتشاور على سبب. دي اللي الكتاب ذكرها؛ ابدأ الكشف من **الحواجب** لحد **رجليه**."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <circle cx="165" cy="40" r="26" class="fg-box"/>
            <rect x="140" y="70" width="50" height="120" rx="18" class="fg-box"/>
