  # ---------- p460-461: class V ----------
  - id: neph.L14.073
    kind: table
    topic: ln-class5
    title: Initial treatment of class V lupus nephritis by proteinuria (Figure 5, p461)
    columns: [Proteinuria, Treatment]
    rows:
      - ["<1 g/24 h", "General treatment: HCQ, RAS blockade and CV protection, treat extrarenal SLE"]
      - ["1-3.5 g/24 h", "HCQ + corticosteroids + CNI"]
      - [">3.5 g/24 h or nephrotic", "Triple therapy: corticosteroids + MPAA + CNI"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 461, quote: "Figure 5: Initial treatment for class V (membranous).\nInitial treatment Class V (Membranous) (ISN/RPS)\n  Evaluate proteinuria\n    Proteinuria < 1 g/24-hours → General treatment: Hydroxychloroquine; Kidney and cardiovascular protection (Lifestyle measures, RAS blockade, and control of CV risk factors); Treatment of SLE (according to extrarenal manifestations)\n    Proteinuria 1 to 3.5 g/24-hours → Hydroxychloroquine + Corticosteroids (as in classes III, IV) + CNI (tacrolimus, voclosporine or cyclosporine)\n      If no reduction in proteinuria ≥ 25% after 2-3 months add MPAA\n    Proteinuria > 3.5 g/24-hours or complete nephrotic syndrome → Triple therapy: Corticosteroids + MPAA + CNI (tacrolimus, voclosporine or cyclosporine)\n  Treatment duration: MPAA: maintenance treatment for 3-5 years; CNI: 12-18 months, followed by 6-12 months of gradual tapering\nHCQ; initial dose 4-5 mg/kg/day (maximun 400 mg daily). If eGFR <30 ml/min/1.73 m2, do not exceed 200 mg daily. MPAA: dose equivalent to 2 g of MMF. CNI: cyclosporine (initial dose 100-200 mg daily, blood target level 60-100 ng/mL), tacrolimus (initial dose 0.05-0.07 mg/kg/day, blood target level 4-7 ng/mL), voclosporine (23.7 mg twice daily for 1-2 years, no blood target level required). CV: cardiovascular." }
    status: unverified
    tags: [high-yield]
