        title: "الأشهر: الـ internal capsule"
        text: |
          أشهر **cerebral infarction** هو ==internal capsule== بسبب thrombosis أو embolism في الـ **middle cerebral artery**.

          - **contralateral hemiplegia** و**facial paralysis**.
          - الوعي غالبًا موجود.
          - **aphasia** لو الـ dominant hemisphere هو اللي اتصاب.
          - الضعف **maximal at first** والتحسن **gradual**.
        lecturer:
          - tone: exam
            text: |
              من شرح د. علام: الـ facial paralysis اللي مع جلطة الـ internal capsule نوعها **upper motor neuron**: بتاخد ==الربع اللي تحت من الوش== بس، والجبهة وقفلة العين سليمين، لأن النص اللي فوق من الـ facial nucleus واخد pyramidal من الناحيتين (مش في الكتاب).
              وبتبقى في نفس ناحية الـ hemiplegia، والاتنين عكس ناحية الـ lesion (مش في الكتاب).
              ولو نص الوش كله (**lower motor neuron**) في ناحية والـ hemiplegia في التانية، ده **crossed hemiplegia**: الـ lesion في الـ brain stem (الـ pons) مش الـ capsule (مش في الكتاب).
      - kind: reveal
        page: 87
        quote: "Presentation\n  I- Cerebral infarction:\n    The most common is infarction of the internal capsule due to thrombosis or embolism of the middle cerebral artery --- contralateral hemiplegia & facial paralysis.\n    Consciousness is usually present, aphasia of the dominant hemisphere is affected, weakness Maximal at first, recovery is gradual."
        prompt: "ليه جلطة صغيرة في الـ internal capsule بتشل نص الجسم كله؟"
        answer: "لأن الـ **internal capsule** ممر ضيق كل الـ motor fibers بتاعة الوش والدراع والرجل معدّية فيه متلمّمة. سدّة صغيرة هناك = **hemiplegia** كاملة في الناحية التانية، عكس الـ cortex اللي الألياف فيه متفرّشة على مساحة كبيرة."
      - kind: figure
        page: 87
        quote: "II- Brain stem infarction:-\n  Due to affection of vertebrobasilar system.\n  Manifestations depend on whether main basilar artery affection (tetra-paresis, sensory loss).\n  Posterior inferior cerebellar artery (Wallenberg Syndrome).\n  Brain stem lesion at level of 3rd cranial nerve → Weber Syndrome.\n  Locked in Syndrome: massive brain stem damage below third nerve nuclei, he has functioning cerebral cortex, but can not move or communicate except by vertical eye movements.\n  Pseudo bulbar syndrome: (bilateral pyramidal lesions, emotional & sphincteric disturbance), lower brain stem damage."
        title: "الـ brain stem من فوق لتحت"
        alt: "A vertical brain stem drawn as three stacked boxes: midbrain at the top with the 3rd nerve level labelled Weber syndrome, pons in the middle labelled locked-in below the 3rd nerve nuclei, and medulla at the bottom labelled Wallenberg from the posterior inferior cerebellar artery. A side bar says main basilar artery gives tetraparesis and sensory loss."
        caption: "Weber عند مستوى العصب التالت، الـ locked-in تحت أنويته، والـ Wallenberg من الـ posterior inferior cerebellar artery (PICA) تحت خالص. وسد الـ basilar نفسه = tetraparesis وsensory loss."
