  - id: endo.L02.lesson4
    title: "Acromegaly في الحمل: GH تاني جاي من المشيمة"
    hook: "في الحمل في GH تاني جاي من المشيمة، والـ IGF-1 بيعلى عند الكل. إزاي تعرف إن في acromegaly أصلًا؟"
    minutes: 9
    pages: [21, 23]
    topics: [pituitary-physiology, acromegaly]
    goals:
      - "تعرف الـ placental GH وليه بيصعّب تشخيص الـ acromegaly"
      - "تفرّق GH الورم من GH المشيمة بالـ pulsatility"
      - "تعرف أدوية الـ acromegaly وأمانها في الحمل"
    status: unverified
    steps:
      - kind: explain
        page: 21
        quote: "GH – IGF-1 Axis During Pregnancy\nHypothalamus GHRH → Maternal pituitary → GH ↓\nPlacenta → GH-V (continuous secretion) → maternal liver:\n  Detected at 5th week, and peaks at 35–37th weeks\n  Affected neither by GHRH nor by ghrelin\n  Binds GHBP\nMaternal liver → IGF1 ↑:\n  Growth-promoting effect on fetus and placenta"
        title: "الـ GH بتاع المشيمة (GH-V)"
        text: |
          المشيمة بتفرز ==GH-V== بشكل **continuous**:
          - بيبان من **الأسبوع 5** ويوصل للـ peak في **35-37**.
          - مش بيتأثر بالـ growth hormone-releasing hormone (GHRH) ولا الـ ghrelin، وبيرتبط بالـ growth hormone-binding protein (GHBP).
          - بيعلّي الـ **IGF-1** (growth-promoting للجنين والمشيمة)، والـ IGF-1 بيكبت الـ GH بتاع الـ pituitary.

          يعني في الحمل الطبيعي الـ GH بتاع الأم **بينزل** (الـ IGF-1 العالي بيعمل negative feedback)، والـ GH-V بياخد مكانه. ليه ده مهم؟ لأن المشيمة مش بتسمع كلام الـ GHRH ولا الـ ghrelin، فهي شغالة لوحدها، وده اللي هيلخبط تحاليل الـ acromegaly.
      - kind: figure
        page: 21
        title: "رسمة الكتاب ص 21: الـ GH–IGF-1 axis في الحمل"
        image: { file: endo/L02-gh-axis.webp, book: true }
        alt: "Book diagram, GH-IGF-1 axis in pregnancy. Top: hypothalamic GHRH to the maternal pituitary, whose GH is lowered. Right: the placenta secretes GH-V continuously to the maternal liver; an oval notes it is detected at the 5th week, peaks at 35 to 37 weeks, is affected neither by GHRH nor ghrelin, and binds GHBP. Bottom: the liver makes IGF1, raised, with a growth-promoting effect on fetus and placenta, and a dashed line back to the pituitary."
        caption: |
          **فوق**: الـ GHRH ← الـ maternal pituitary ← **GH↓** (السهم لتحت جنبه).

          - **يمين**: المشيمة بتطلّع ==GH-V== **continuous secretion** وتبعته للكبد، و **البيضاوي فوقه**: بيبان الأسبوع 5، peak في 35–37، ما بيتأثرش بالـ GHRH ولا الـ ghrelin.
          - **شمال تحت**: الـ **maternal liver** بيعمل **IGF-1 ↑** اللي بيكبّر الجنين والمشيمة (السهم رايح يمين).
          - **الخط المتقطّع شمال**: الـ IGF-1 العالي راجع للغدة ==negative feedback==، وده سبب الـ GH↓.

          يعني في الحمل الطبيعي المشيمة هي اللي ماسكة الـ IGF-1، والـ GH بتاع الأم بينزل.
      - kind: explain
        page: 21
        quote: "Glucose tolerance, hypertension, and cardiac derangements also require monitoring. Glucose intolerance occurs in 50% of patients with Acromegaly, with overt diabetes mellitus in 10-20%."
        title: "Acromegaly والحمل"
        text: |
          - الـ **infertility** شائعة، وكتير محتاجين dopamine agonist علشان يحملوا.
          - في دراسة على 24 حامل، **4 بس (17%)** الورم كبر وعمل visual field defect.
          - تابع الـ macroadenoma بالأعراض والـ visual fields، وكمان glucose و blood pressure (BP) والقلب.
          - Glucose intolerance **50%**، diabetes mellitus (DM) صريح **10-20%**.
          - ==GH does not cross the placenta==، والـ macrosomia سببها سكر الأم.

          ليه الـ macrosomia من السكر مش من الـ GH؟ الكتاب بيقول نمو الجنين **largely GH-independent**. التفسير المقبول (مش في الكتاب): السكر بيعدّي المشيمة، فالجنين يعمل insulin زيادة، والـ insulin هو هرمون النمو الحقيقي للجنين. وليه كتير محتاجين **dopamine agonist** عشان يحملوا؟ التفسير المقبول: جزء من الأورام دي بيعمل prolactin كمان أو بيضغط على الـ stalk، والـ prolactin العالي بيوقف التبويض.
      - kind: reveal
        page: 22
        quote: "However, pituitary growth hormone secretion in acromegaly demonstrates a pulsatility of 13-19 pulses per 24 hours, vs. the tonic secretion seen with the placental variant."
        prompt: "ليه تشخيص الـ acromegaly في الحمل صعب، وإيه اللي يفرّق؟"
        answer: |
          - التحاليل العادية مش بتفرّق بين GH الـ pituitary و GH المشيمة.
          - الـ **IGF-1** عالي في النص التاني من أي حمل.
          - **الفرق:** GH الـ acromegaly **pulsatile** (13-19 pulse في 24 ساعة)، والمشيمي **tonic**. وبعد الولادة المشيمي بيختفي خلال **24 ساعة**.
