      - kind: explain
        page: 73
        quote: "Lack of RAAS activation"
        title: "ليه الـ slow UF بيتفادى العيوب دي؟"
        text: |
          الكتاب (Table 4): الـ slow ultrafiltration (UF) بيشيل مية أسرع، **higher mass clearance of sodium**، **lack of RAAS** و **SNS activation**، cytokines أقل، و readmissions أقل.

          التفسير المقبول (مش في الكتاب):

          - الـ UF بيشيل سايل **isotonic** زي البلازما، **فـ** كل لتر بيطلّع صوديوم أكتر من لتر بول hypotonic.
          - الماكينة مش بتلمس الـ **macula densa**، **يعني** مفيش إشارة renin مباشرة زي الـ loop diuretic.
          - مفيش دوا بيتفرز في الـ tubule، **فـ** الـ K والـ Mg مش بيضيعوا بنفس الطريقة.
          - كلمة **slow** مهمة: السرعة الهادية بتدّي فرصة للمية ترجع من الأنسجة للدم (refill) **عشان** الضغط ميقعش.
      - kind: figure
        page: 73
        quote: "Lack of RAAS activation"
        title: "الـ loop diuretic والـ slow UF: مين بيلمس الـ macula densa؟"
        alt: "Top half, loop diuretic: a nephron loop drawn from the glomerulus down and back up; the thick ascending limb is crossed out (NKCC2 blocked) and returns to the macula densa beside its own glomerulus. Labels: 1, blocks NKCC2 in the thick ascending limb and at the macula densa; 2, the macula densa reads low chloride, so renin rises and RAAS keeps sodium; 3, the urine is hypotonic, little sodium per litre, and potassium and magnesium are lost. Bottom half, slow ultrafiltration: blood runs through a filter and an isotonic ultrafiltrate comes out with the same sodium as plasma; it never touches the macula densa, so no renin and no sympathetic surge."
