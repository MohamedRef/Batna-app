    front: How does C3b help remove immune complexes?
    back: C3b deposited on large complexes disrupts the bonds holding them, breaking them into smaller pieces macrophages can clear. C3b also lets complexes bind CR1 on red cells, which carry them to the spleen for removal by macrophages.
