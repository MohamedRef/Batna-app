        text: |
          **Tenckhoff** silicone بـ 3 أجزاء: intraperitoneal مخرّم، tunnelled فيه ==2 Dacron cuffs== (تثبيت ومنع البكتيريا)، و extraperitoneal. الطرف في الـ **pelvis**، والـ exit site بعيد عن الـ midline بكام سنتي.

          التركيب: surgical، laparoscopic، blind Seldinger، أو fluoroscopy.

