  prompt: Describe the King's College criteria for emergent liver transplantation in ALF.
  outline:
  - Wilson disease or Budd-Chiari ALF (book version):
    - Criterion on its own
  - Acetaminophen (any one):
    - Arterial pH <7.3 after resuscitation and 24 h after ingestion
    - Lactate >3 mmol/L
