      - kind: explain
        page: 88
        title: "Oxidative stress"
        quote: "Salt sensitve HT and CKD have ↑ level of asymmetric dimethyl argenine (ADMA) which inhibits NO synthetase"
        text: |
          الكلى بتطلّع **ROS** وعندها enzymes تعادلها. في الـ CKD الـ enzymes دي بتبوظ ← ==↓NO== (nitrosative stress) ← vasoconstriction.

          وكمان **ADMA** بتعلى في الـ CKD والـ salt-sensitive HT، وهي بتمنع الـ **NO synthase**.
      - kind: explain
