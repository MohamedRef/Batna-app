lecture: hb.L17
lessons:
  # ------------------------------------------------------------------
  - id: hb.L17.lesson1
    title: "قناة المرارة لما تزهق: مين بيجيله cholangiocarcinoma؟"
    hook: "التهاب مزمن في القنوات سنين ورا سنين... وفي الآخر الخلية تقول «كفاية بقى» وتقلب cancer."
    minutes: 9
    pages: [318, 322]
    topics: [epidemiology, pathology, risk-factors]
    goals:
      - "تعرّف الـ cholangiocarcinoma وتقسمها حسب المكان: intrahepatic و perihilar و distal"
      - "تفهم ليه الـ biopsy الصغيرة بتفشل في التشخيص"
      - "تعدّ الـ 15 strong risk factor بمنيمونيك واحد، وتفرّقهم عن الـ weak"
    status: unverified
    steps:
      - kind: explain
        page: 318
        title: "نبدأ بالتعريف والتقسيم"
        quote: "Cholangiocarcinomas are cancers arising from the bile duct epithelium."
        text: |
          الـ **cholangiocarcinoma** هي cancer طالعة من **bile duct epithelium**. خلاص، ده التعريف كله.

          والتقسيم بيمشي على **المكان في الـ biliary tree**:

          - **Intrahepatic** (جوه الكبد).
          - **Extrahepatic**، ودي نوعين: **perihilar** و **distal**.

          والـ perihilar اللي بتمسك **bifurcation** (مفرق الـ right و left hepatic ducts) ليها اسم مشهور: **Klatskin tumour**.
      - kind: figure
        page: 318
        title: "فين بالظبط؟"
        alt: "A sketch of the biliary tree. Small intrahepatic ducts inside the liver join into right and left hepatic ducts, which meet at the hilar bifurcation and continue as the common hepatic duct, then the common bile duct through the head of the pancreas to the duodenum. Three tumour dots: one inside the liver labelled intrahepatic, one at the bifurcation labelled perihilar (Klatskin), one in the distal common bile duct labelled distal."
        caption: "تلات أماكن: جوه الكبد (**iCCA**)، عند المفرق (**pCCA** = Klatskin)، وتحت في الـ CBD (**dCCA**). الـ perihilar والـ distal مع بعض هما الـ extrahepatic."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 40Q20 22 45 22H290Q314 22 312 44L300 120Q292 168 250 176H70Q26 170 22 120Z" class="fg-box"/>
            <text x="34" y="44" class="t-sm t-mut">Liver</text>
            <path d="M55 62L120 132M80 102L104 114M95 55L118 118M120 132L165 186" class="fg-ink"/>
            <path d="M285 60L215 132M255 104L232 112M240 55L218 120M215 132L165 186" class="fg-ink"/>
            <text x="26" y="166" class="t-sm">Right hepatic duct</text>
            <text x="204" y="166" class="t-sm">Left hepatic duct</text>
            <path d="M165 186V262" class="fg-ink" stroke-width="3"/>
            <ellipse cx="96" cy="282" rx="34" ry="22" class="fg-good"/>
            <text x="96" y="286" text-anchor="middle" class="t-sm">GB</text>
            <path d="M126 270Q148 262 165 262" class="fg-ink"/>
            <path d="M165 262V392" class="fg-ink" stroke-width="3"/>
            <rect x="125" y="336" width="120" height="44" rx="16" class="fg-thin"/>
            <text x="252" y="362" class="t-sm t-mut">Pancreas</text>
            <rect x="140" y="392" width="160" height="20" rx="6" class="fg-thin"/>
            <text x="214" y="406" class="t-sm t-mut">Duodenum</text>
            <circle cx="88" cy="96" r="10" class="fg-dot-bad"/>
            <text x="104" y="76" class="t-sm t-bad t-b">iCCA</text>
            <circle cx="165" cy="188" r="11" class="fg-dot-bad"/>
            <text x="184" y="204" class="t-sm t-bad t-b">pCCA = Klatskin</text>
            <text x="184" y="220" class="t-sm t-mut">(at the bifurcation)</text>
            <circle cx="165" cy="350" r="10" class="fg-dot-bad"/>
            <text x="20" y="352" class="t-sm t-bad t-b">dCCA (distal CBD)</text>
            <path d="M322 186V392" class="fg-thin"/>
            <text x="306" y="260" class="t-sm t-mut" transform="rotate(90 306 260)">Extrahepatic</text>
          </svg>
      - kind: explain
        page: 318
        title: "مين وفين؟"
        text: |
          - حوالي **two-thirds** بيحصلوا بين **50 و 70 سنة**، مع **slight male predominance**.
          - الـ incidence المسجّلة زادت، بس الكتاب بيقول غالبًا بسبب **تحسّن جمع البيانات**، مش لأن المرض نفسه زاد.
          - **أعلى rate في العالم: north-east Thailand** (أكتر من 80 per 100,000). وعالية كمان في **Bolivia و Chile** و **northern Japan**.
          - **أقل rate: Canada** (0.3 per 100,000). وواطية في الـ US و UK و India و Nigeria و Singapore.
      - kind: reveal
        page: 321
        prompt: "ليه بالذات north-east Thailand؟ (فكّر في حاجة بتتاكل هناك...)"
        answer: |
          الـ **liver flukes**: الكتاب بيربط **Clonorchis sinensis** و **Opisthorchis viverrini** بالـ incidence العالية في **East Asia**.

          الدودة بتعيش في القنوات سنين، والـ **host immune activation** والـ **chronic inflammatory state** هما البداية اللي بتقلب الـ epithelium لـ cancer. (الطريقة المعروفة للعدوى: سمك نهري ني أو مش مستوي.)
      - kind: explain
        page: 319
        title: "شكلها تحت الميكروسكوب"
        text: |
          - **أكتر من 95%** منها **adenocarcinoma**.
          - أغلبها **infiltrating nodular** أو **diffusely infiltrating**. الـ **purely nodular** أو **papillary** أقل.
          - بتعمل **desmoplastic reaction**: نسيج fibrous كتير حوالين خلايا cancer قليلة، يعني **low neoplastic cellularity**.
          - الـ staining بـ **CEA, CA 19-9 أو CA-50** بيساعد في التشخيص الـ pathological.
          - فيه genetic changes: point mutations في **K-ras و beta-catenin**، وتغيّرات في **p53, p16, APC, DPC4**. والـ pathways اللي ممكن نستهدفها: **KRAS/MAPK, EGFR, IL-6/STAT, IDH1/2, FGFR2, MET**.
          - الـ **molecular classification** للـ iCCA **مش جاهزة للاستخدام الإكلينيكي** لسه.
      - kind: check
        page: 319
        question: "Why does a small biopsy often fail to diagnose cholangiocarcinoma?"
        options:
          - "The desmoplastic reaction leaves low neoplastic cellularity"
          - "Most tumours are purely papillary and fall apart"
          - "The tumour cells do not stain with CEA or CA 19-9"
          - "Most biliary tumours are squamous, not glandular"
        answer: 0
        why:
          - "صح: الـ desmoplasia بتملا العينة fibrous tissue، فالإبرة الصغيرة ممكن ماتجيبش خلايا cancer كفاية."
          - "بالعكس، الـ purely papillary من الأنواع **الأقل**. الأغلب infiltrating."
          - "الـ staining بـ CEA و CA 19-9 و CA-50 **بيساعد** في التشخيص، مش بيفشل."
          - "أكتر من 95% **adenocarcinoma**، يعني glandular."
      - kind: aside
        tone: analogy
        page: 319
        text: |
          الـ desmoplastic reaction زي **كيس بلح كله نوى**: تمد إيدك تاخد حفنة، تطلع نوى بس. 😄

          الـ biopsy الصغيرة نفس الفكرة: تطلع fibrous tissue ومفيش خلايا cancer تكفي. خلّي الفكرة دي في دماغك، هترجعلك في الـ CT (الـ enhancement البطيء) وفي ERCP (الـ tissue diagnosis 40–70% بس).
      - kind: explain
        page: 320
        title: "الخيط اللي بيربط كل الـ risk factors"
        quote: "There is a close association between infection, inflammation, and cancer."
        text: |
          الكتاب بيقول فيه علاقة قوية بين **infection و inflammation و cancer**، وإن أغلب الـ risk factors مرتبطة بـ **chronic biliary inflammation**.

          يعني لو نسيت عامل خطورة في الامتحان، اسأل نفسك: **«الحاجة دي بتعمل التهاب مزمن في القنوات؟»** لو آه، غالبًا هو.

          وبعضها ينفع لكل الأنواع، وبعضها خاص بنوع معيّن.
      - kind: mnemonic
        page: 320
        word: "FATTA CUPS V"
        parts:
          - { key: "F", text: "Flukes: Clonorchis sinensis, Opisthorchis viverrini" }
          - { key: "A", text: "Age >50 years" }
          - { key: "T", text: "Typhoid: chronic carrier" }
          - { key: "T", text: "Thorium dioxide exposure" }
          - { key: "A", text: "Alcoholic liver disease" }
          - { key: "C", text: "Cirrhosis (non-specific)" }
          - { key: "U", text: "Ulcerative colitis" }
          - { key: "P", text: "PSC" }
          - { key: "S", text: "Stones and structure: cholangitis, choledocholithiasis, cholecystolithiasis, other structural biliary disorders" }
          - { key: "V", text: "Viruses: HBV, HCV, HIV" }
        hook: |
          تخيّل **طبق فتة** متقسّم في **كوبايات** (FATTA CUPS)، وانت خلصت تحفظ الـ 15 عامل فرفعت علامة النصر **V** ✌️ للفيروسات التلاتة.

          الـ S لوحدها شايلة 4: **cholangitis** والحصوتين (**choledocho-** و **cholecysto-lithiasis**) والـ **structural disorders**.
      - kind: explain
        page: 321
        title: "أرقام لازم تعرفها"
        text: |
          - **Structural disorders:** bile duct adenoma، biliary papillomatosis، **choledochal cyst**، و **Caroli's disease** (non-obstructive dilation للقنوات).
          - **PSC:** الـ prevalence **7% إلى 13%**، وبتزيد مع السن. و **60–80%** من مرضى الـ PSC عندهم **UC**، والاتنين مع بعض ممكن يعلّوا الخطر أكتر.
          - **AASLD:** surveillance **سنويًا** للبالغين اللي عندهم PSC، **ماعدا small-duct PSC**.
          - **Alcoholic liver disease:** بيعلّي iCCA بـ **OR 7.4**. والشرب التقيل (**>80 g/day**): iCCA **OR 6.0** و eCCA **OR 4.0**.
          - **Clonorchis:** **RR 2.7** للـ intra و extrahepatic.
          - **Typhoid carrier** في South-East Asia: **sixfold** خطر hepatobiliary malignancy.
          - **HIV:** iCCA **OR 5.9**، والـ HIV cholangitis شائع مباشرة أو عن طريق opportunistic infections زي **CMV**.
      - kind: aside
        tone: trap
        page: 321
        text: |
          فخ مشهور: الـ AASLD surveillance السنوية في الـ PSC **مش** لكل الناس. الـ **small-duct PSC** مستثناة.

          لو السؤال قال «small-duct PSC, should we screen annually for cholangiocarcinoma?» الإجابة حسب الكتاب: **لأ**.
      - kind: sort
        page: 322
        prompt: "Strong ولا weak؟ حط كل عامل في مكانه:"
        bins: ["Strong", "Weak"]
        cards:
          - { text: "Chronic typhoid carrier", bin: 0 }
          - { text: "Diabetes", bin: 1 }
          - { text: "Thorium dioxide", bin: 0 }
          - { text: "Cigarette smoking", bin: 1 }
          - { text: "HIV", bin: 0 }
          - { text: "Isoniazid", bin: 1 }
          - { text: "Male sex", bin: 1 }
          - { text: "Choledochal cyst", bin: 0 }
          - { text: "Oral contraceptives", bin: 1 }
        why: "الـ **weak** في الكتاب 4 بس: **diabetes**، **smoking**، **toxins/medicines** (polychlorinated biphenyls occupational، isoniazid، oral contraceptives) و **male sex**. أي حاجة تانية في القايمة دي strong."
      - kind: try
        items: [hb.L17.003, hb.L17.011, hb.L17.016, hb.L17.020, hb.L17.026]
    recap:
      - "Cholangiocarcinoma = cancer من الـ **bile duct epithelium**: intrahepatic، أو extrahepatic (perihilar و distal). Perihilar عند المفرق = **Klatskin**."
      - "أعلى rate في **NE Thailand** (flukes)، أقل rate في **Canada**. ثلثين بين 50 و 70 سنة."
      - ">95% adenocarcinoma، و **desmoplastic reaction** = low cellularity = biopsy صغيرة ممكن تفشل."
      - "الـ strong risk factors: **FATTA CUPS V**. الـ weak: diabetes، smoking، toxins/medicines، male sex."
      - "PSC: 7–13% خطر، 60–80% معاها UC، surveillance سنوي ماعدا small-duct."
    practice: [hb.L17.001, hb.L17.002, hb.L17.003, hb.L17.004, hb.L17.005, hb.L17.006, hb.L17.007, hb.L17.008, hb.L17.009, hb.L17.010, hb.L17.011, hb.L17.012, hb.L17.013, hb.L17.014, hb.L17.015, hb.L17.016, hb.L17.017, hb.L17.018, hb.L17.019, hb.L17.020, hb.L17.021, hb.L17.022, hb.L17.023, hb.L17.024, hb.L17.025, hb.L17.026, hb.L17.027, hb.L17.028, hb.L17.126]

