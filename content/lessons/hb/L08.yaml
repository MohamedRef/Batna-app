      - kind: explain
        page: 141
        title: "الـ prognosis"
        text: |
          - **Early recognition**: لو اتعرف بدري والدوا وقف، most cases resolve without chronic sequelae.
          - **What decides mortality**: أساسًا ==degree of hepatocellular injury==.
          - **Worst drugs**: 10% mortality للأدوية اللي بتعمل fulminant hepatitis أو toxic steatosis.
          - **Cholestatic**: rarely, if ever بيعمل acute fatalities.
          - **Worst combination**: الـ prognosis worse لما الـ ==jaundice== ييجي مع الـ hepatocellular injury.

          ليه الصفرا مع الـ hepatocellular وحشة؟ التفسير المقبول: الـ bilirubin هنا عالي علشان الخلايا نفسها ماتت ومش قادرة تشيله، مش علشان قناة مسدودة. يعني ضرر كبير. ده نفس منطق الـ Hy's law.
      - kind: check
        page: 141
        question: "Which DILI picture carries the worst prognosis in the lecture?"
        options:
          - "Hepatocellular injury with jaundice"
          - "Cholestatic injury with pruritus"
          - "Asymptomatic enzyme rise with drug tolerance"
          - "Bland canalicular cholestasis"
        answer: 0
        why:
          - "صح: **the prognosis is worse whenever jaundice accompanies hepatocellular injury**."
          - "الـ cholestatic **rarely, if ever** بيعمل acute fatalities."
          - "الـ tolerance معناها إن الإنزيمات **مش بتتقدم**."
          - "الـ bland نوع cholestatic، و prognosis أحسن."
      - kind: aside
        tone: analogy
        page: 141
        text: |
          الـ **cholestatic** DILI زي ضيف تقيل: بيطوّل (الـ recovery ممكن ياخد شهور والهرش مزعج)، بس نادرًا جدًا بيموّت.

          الـ **hepatocellular + jaundice** هو اللي يستاهل كل انتباهك في الامتحان: ده اللي فيه الـ mortality.
      - kind: explain
        page: 142
        title: "الخلاصة والمستقبل"
        text: |
          - الـ **hepatotoxicity** side effect لكل العلاجات تقريبًا، وأغلبها **benign** وبيتحسن بعد وقف الدوا.
          - العلاج: **quick drug withdrawal + supportive care**.
          - **Future prospects**: **new biomarkers**، **unresolved issues**، و **unmet needs**: epidemiology (big data، العبء الاقتصادي، herbal and dietary supplements)، pathogenesis (إيه اللي بيكشف أو بيمنع الإصابة)، diagnosis and outcome (markers تفرّق الإنزيمات اللي هتروح لوحدها من اللي هتقلب DILI، وتتوقع الـ ALF)، therapy (**RCTs**)، و prediction (**algorithms** للـ drug–host factors).
      - kind: explain
        page: 144
        title: "الـ essays: الهيكل اللي هتكتب بيه"
        text: |
          الكتاب فيه 6 أسئلة essay. ده هيكل كل واحد، ومن أنهي درس:

          - **Common drug classes**: anesthetics، antimicrobials، anticonvulsants، NSAIDs/analgesics، psychotropics، hormones (درس 3 و 4).
          - **Patterns of liver cell injury**: histology (hepatocellular، cholestatic، mixed) + الـ 10 types of reaction + الخلايا (درس 1).
          - **Clinical manifestations**: asymptomatic، acute hepatocellular، cholestatic، granulomatous، chronic/AIH، VOD، neoplastic، hypersensitivity (دروس 3–5).
          - **Stepwise diagnosis**: suspicion → drug history → R value → exclusion → temporal relation و dechallenge (درس 2).
          - **Management**: early recognition، **rapid withdrawal**، supportive، متابعة الإنزيمات، والـ prognosis (درس 1 و 6).
          - **Vanishing bile duct syndrome**: cholangiodestructive، الـ drugs بالمجموعات، الفرق مع الـ PBC (درس 4).
