  # ------------------------------------------------------------------
  - id: hb.L06.lesson4
    title: "مين نفحصه وإمتى نحوّله؟"
    hook: "مش هنعمل screening للبلد كلها. الكتاب بيدّيك pathwayين (EASL 2021 و American Diabetes Association (ADA) 2025) يوصّلوك للـ hepatologist في الوقت الصح."
    minutes: 10
    pages: [102, 105]
    topics: [screening]
    goals:
      - "تعرف مين نفحصه ومين لأ"
      - "تمشي في الـ EASL 2021 pathway خطوة بخطوة"
      - "تعرف أرقام الـ American Diabetes Association (ADA) 2025 وتفرقها عن EASL وعن bands ص 102"
    status: unverified
    steps:
      - kind: explain
        remind: [hb.L06.037]
        page: 102
        quote: "The general population-based screening for MASLD is not advised."
        title: "Who to screen?"
        text: |
          أول جملة في الكتاب: general population-based screening for metabolic dysfunction-associated steatotic liver disease (MASLD) is ==not advised==. المرض منتشر جدًا، وأغلبه هادي.

          بدل كده، الكتاب بيطلب 3 حاجات، كل واحدة بتسلّم اللي بعدها:

          - ==Screen all prediabetics and type 2 diabetes mellitus (DM)==: دول اللي المرض بيتطور عندهم.
          - **Identify high-risk patients** of progressive disease: مين فيهم ماشي ناحية التليف.
          - **Assess the degree of fibrosis** and stage the liver disease: علشان تقرر مين يتحوّل ومين يتابع.
      - kind: reveal
        page: 102
        quote: "Who to screen?\n  The general population-based screening for MASLD is not advised.\n  However, we need.\n    1. To screen all prediabetics and type 2 DM.\n    2. To identify high risk patients of progressive disease.\n    3. To assess the degree of fibrosis and to do staging of liver disease."
        prompt: "ليه مرضى السكر بالذات، وليس كل الناس؟"
        answer: |
          جمّع من الدروس اللي فاتت: **T2DM و obesity** أقوى risk factors للـ fibrosis والـ cirrhosis والـ HCC، والـ **enzymes مش بتكشفهم** (NASH في 58% رغم ALT واطي). يعني ده المكان اللي فيه المرض المخبّي اللي بيتطور.

          أما الناس كلها: أعداد ضخمة وأغلبهم simple steatosis، فالكتاب مش بينصح بالـ screening الشامل.
      - kind: explain
        page: 104
        quote: "EASL 2021 Recommendations for non-invasive assessment and risk stratification of liver fibrosis (Primary care/diabetology clinic)\nPatients at risk for chronic liver disease\n1. Check for liver risk factors: Metabolic syndrome, alcohol, HBV, HCV, familial history\n2. Test AST, ALT, GGT, ALP and platelet count\nViral hepatitis / other causes of chronic liver diseases or clinical signs of advanced liver disease / cirrhosis:\n  Liver clinic: Referral to liver specialist\nMetabolic co-factors and/or alcohol only?\n  Calculate FIB-4* (Age, AST, ALT, platelet)\n    <1.30, Low risk: No need for referral, Lifestyle modifications, Re-test in 1-3 years\n    ≥1.30, Intermediate-High risk: Liver stiffness by transient elastography*\n      <8 kPa, Low risk: No need for referral, Lifestyle modifications, Re-test in 1-3 years\n      ≥8 kPa, Intermediate-High risk:\n        Patented serum tests** Not available: Consider liver biopsy\n        Patented serum tests** Available = combine:\n          Discordance: Consider liver biopsy\n          Concordance: F3-F4 highly likely"
        title: "EASL 2021: primary care أو diabetology clinic"
        text: |
          الـ pathway ده للدكتور في الـ primary care أو عيادة السكر. امشي فيه كأنك بتسأل 4 أسئلة:

          - **فيه risk factors للكبد؟** اعمل aspartate aminotransferase (AST) و alanine aminotransferase (ALT) و gamma-glutamyl transferase (GGT) و alkaline phosphatase (ALP) و platelets.
          - **فيه سبب تاني أو cirrhosis باينة؟** لو viral hepatitis أو chronic liver disease تاني، أو signs of advanced disease/cirrhosis: referral to liver specialist على طول، من غير حسابات.
          - **Metabolic co-factors و/أو alcohol بس؟** احسب ==fibrosis-4 index (FIB-4)==. لو أقل من 1.30 يبقى low risk: no referral، و lifestyle modifications، و re-test in 1–3 years.
          - **FIB-4 من 1.30 وطالع؟** اعمل transient elastography. أقل من ==8 kPa== يرجع low risk، و 8 kPa وطالع intermediate-high risk.

          وبعد الـ 8 kPa: patented serum test لو متاح. لو النتيجتين متفقين (concordance) يبقى F3–F4 highly likely، فيروح الـ liver clinic. لو مختلفين أو مفيش test: consider liver biopsy.

          لاحظ المنطق: كل خطوة بتصفّي الناس، فالـ biopsy بيوصلها عدد قليل جدًا.
      - kind: figure
        page: 104
        quote: "EASL 2021 Recommendations for non-invasive assessment and risk stratification of liver fibrosis"
        title: "EASL 2021 من فوق لتحت: رسمة الكتاب"
        image: { file: hb/L06-easl-2021-algorithm.webp, book: true }
        alt: "Book flowchart in two shaded zones: primary care/diabetology clinic (grey, top left) and liver clinic (blue, bottom right). Patients at risk for chronic liver disease; 1. check for liver risk factors (metabolic syndrome, alcohol, HBV, HCV, familial history); 2. test AST, ALT, GGT, ALP and platelet count. If viral hepatitis or other causes, or clinical signs of advanced liver disease, an arrow goes right to referral to a liver specialist (red box). If metabolic co-factors and/or alcohol only (red box): calculate FIB-4 (age, AST, ALT, platelet). Under 1.30, low risk: no need for referral, lifestyle modifications, re-test in 1-3 years (green box). 1.30 or more, intermediate-high risk: liver stiffness by transient elastography. Under 8 kPa, low risk: back to the green box. 8 kPa or more: patented serum tests not available, consider liver biopsy; available, combine: discordance, consider liver biopsy; concordance, F3-F4 highly likely (red box)."
        caption: |
          الرسمة متقسمة لمنطقتين: **الرمادي فوق شمال = Primary care/diabetology clinic**، و**الأزرق تحت يمين = Liver clinic**.

          1. **فوق**: Patients at risk ← افحص الـ risk factors (metabolic syndrome، alcohol، hepatitis B virus (HBV)، hepatitis C virus (HCV)، family history)، واطلب AST، ALT، gamma-glutamyl transferase (GGT)، alkaline phosphatase (ALP) والصفايح.
          2. **السهم اليمين**: لو فيه viral hepatitis أو سبب تاني، أو علامات cirrhosis ← **Referral to liver specialist** على طول (الصندوق الأحمر يمين).
          3. **الصندوق الأحمر في النص: Metabolic co-factors and/or alcohol only?** ← **Calculate FIB-4**.
             - **<1.30 (شمال)**: الصندوق الأخضر: **No need for referral، Lifestyle، Re-test in 1–3 years**.
             - **≥1.30**: **Liver stiffness by transient elastography**. لو **<8 kPa** (الخط المتقطع شمال) ← يرجع للأخضر.
          4. **≥8 kPa (تحت)**: Patented serum tests: لو **مش متاحة** ← **Consider liver biopsy**؛ لو **متاحة** ← combine: **Discordance** ← biopsy، **Concordance** ← **F3–F4 highly likely** (الأحمر تحت يمين).

          خطين بس تحفظهم: ==FIB-4 1.30== و==stiffness 8 kPa==. تحت الاتنين المريض يفضل في الـ primary care.
      - kind: check
        page: 104
        quote: "EASL 2021 Recommendations for non-invasive assessment and risk stratification of liver fibrosis (Primary care/diabetology clinic)\nPatients at risk for chronic liver disease\n1. Check for liver risk factors: Metabolic syndrome, alcohol, HBV, HCV, familial history\n2. Test AST, ALT, GGT, ALP and platelet count\nViral hepatitis / other causes of chronic liver diseases or clinical signs of advanced liver disease / cirrhosis:\n  Liver clinic: Referral to liver specialist\nMetabolic co-factors and/or alcohol only?\n  Calculate FIB-4* (Age, AST, ALT, platelet)\n    <1.30, Low risk: No need for referral, Lifestyle modifications, Re-test in 1-3 years\n    ≥1.30, Intermediate-High risk: Liver stiffness by transient elastography*\n      <8 kPa, Low risk: No need for referral, Lifestyle modifications, Re-test in 1-3 years\n      ≥8 kPa, Intermediate-High risk:\n        Patented serum tests** Not available: Consider liver biopsy\n        Patented serum tests** Available = combine:\n          Discordance: Consider liver biopsy\n          Concordance: F3-F4 highly likely"
        question: "A 58-year-old woman with T2DM has normal ALT and FIB-4 1.9. Under EASL 2021, what is next?"
        options:
          - "Transient elastography"
          - "Reassure and re-test in 3 years"
          - "Liver biopsy"
          - "No action because ALT is normal"
        answer: 0
        why:
          - "صح: FIB-4 **≥ 1.30** = intermediate-high risk، فنقيس الـ stiffness."
          - "الـ re-test بعد 1–3 سنين لـ FIB-4 **تحت 1.30** بس."
          - "الـ biopsy آخر الطريق: بعد ≥ 8 kPa ومع discordance أو مفيش serum test."
          - "افتكر: **do not trust liver enzymes** في السكر."
      - kind: explain
        page: 104
        quote: "ADA 2025\nType 2 diabetes or obesity + ≥1 cardiometabolic risk factor(s) or persistently elevated liver enzymes → FIB-4*:\n  <1.3 → Re-assess FIB-4 every 1-3 years\n  1.3-2.67:\n    (A) VCTE or alternative test***:\n      <8.0 kPa → Intensified management of comorbidities**\n      ≥8.0 kPa → Hepatology referral\n    (B) Intensified management of comorbidities** → re-assess FIB-4 at ≤1 year:\n      FIB-4 <1.3 → Re-assess FIB-4 every 1-3 years\n      FIB-4 ≥1.3 → VCTE or alternative test***\n  >2.67 → Hepatology referral: Diagnostic work-up and management plan for liver-related outcomes; Intensified management of comorbidities (in a multidisciplinary team)"
        title: "ADA 2025: نفس الفكرة بأرقام مختلفة شوية"
        text: |
          **مين يدخل الـ pathway؟** واحد من 3: Type 2 diabetes mellitus (T2DM)، أو obesity مع cardiometabolic risk factor واحد على الأقل، أو persistently elevated liver enzymes.

          وبعدين FIB-4 بيقسمهم 3 طرق:

          - **أقل من 1.3**: re-assess FIB-4 every 1–3 years.
          - ==من 1.3 لـ 2.67==: Vibration-controlled transient elastography (VCTE) (أو alternative test). لو 8.0 kPa وطالع: hepatology referral. لو أقل: intensified management of comorbidities، وأعد FIB-4 في خلال سنة أو أقل.
          - ==أكتر من 2.67==: hepatology referral على طول.

          الفرق عن European Association for the Study of the Liver (EASL): الـ ADA عنده باب تالت فوق 2.67 بيحوّل مباشرة من غير FibroScan.
      - kind: figure
        page: 104
        quote: "ADA 2025"
        title: "ADA 2025: رسمة الكتاب"
        image: { file: hb/L06-ada-2025-algorithm.webp, book: true }
        alt: "Book flowchart in three coloured zones. Top box: type 2 diabetes, or obesity with 1 or more cardiometabolic risk factors, or persistently elevated liver enzymes, leads to FIB-4. Under 1.3 (blue zone, left): re-assess FIB-4 every 1-3 years. 1.3-2.67 (yellow zone, middle): path A goes to VCTE or an alternative test; path B goes to intensified management of comorbidities, re-assess FIB-4 at 1 year or less: FIB-4 under 1.3 goes to re-assess every 1-3 years, FIB-4 1.3 or more goes to VCTE. VCTE under 8.0 kPa goes to intensified management; 8.0 kPa or more goes to hepatology referral. Over 2.67 (orange zone, right): hepatology referral, with diagnostic work-up and management plan for liver-related outcomes, and intensified management of comorbidities in a multidisciplinary team."
        caption: |
          3 مناطق ملوّنة تحت صندوق واحد فوق: **Type 2 diabetes، أو obesity + ≥1 cardiometabolic risk factor، أو إنزيمات عالية على طول** ← **FIB-4**.

          - **الأزرق (شمال): <1.3** ← **Re-assess FIB-4 every 1–3 years**.
          - **الأصفر (النص): 1.3–2.67**، وفيه طريقين:
            - **(A)**: على طول لـ **vibration-controlled transient elastography (VCTE)** أو test بديل.
            - **(B)**: **Intensified management of comorbidities**، وتعيد الـ FIB-4 خلال سنة: لو <1.3 يروح للأزرق، لو ≥1.3 يروح للـ VCTE.
            - الـ VCTE: **<8.0 kPa** يرجع للـ management، **≥8.0 kPa** ← **Hepatology referral**.
          - **البرتقاني (يمين): >2.67** ← **Hepatology referral** مباشرة: diagnostic work-up وmanagement في فريق متعدد التخصصات.

          الفرق عن EASL: ADA عندها ==سقف 2.67== اللي فوقه بتحوّل من غير elastography، وطريق (B) اللي بيدّي فرصة إن ==علاج الـ comorbidities== ينزّل الـ FIB-4 الأول. الـ 8 kPa زي ما هي.
      - kind: aside
        tone: trap
        page: 104
        quote: "EASL 2021 Recommendations for non-invasive assessment and risk stratification of liver fibrosis (Primary care/diabetology clinic)\nPatients at risk for chronic liver disease\n1. Check for liver risk factors: Metabolic syndrome, alcohol, HBV, HCV, familial history\n2. Test AST, ALT, GGT, ALP and platelet count\nViral hepatitis / other causes of chronic liver diseases or clinical signs of advanced liver disease / cirrhosis:\n  Liver clinic: Referral to liver specialist\nMetabolic co-factors and/or alcohol only?\n  Calculate FIB-4* (Age, AST, ALT, platelet)\n    <1.30, Low risk: No need for referral, Lifestyle modifications, Re-test in 1-3 years\n    ≥1.30, Intermediate-High risk: Liver stiffness by transient elastography*\n      <8 kPa, Low risk: No need for referral, Lifestyle modifications, Re-test in 1-3 years\n      ≥8 kPa, Intermediate-High risk:\n        Patented serum tests** Not available: Consider liver biopsy\n        Patented serum tests** Available = combine:\n          Discordance: Consider liver biopsy\n          Concordance: F3-F4 highly likely\nADA 2025\nType 2 diabetes or obesity + ≥1 cardiometabolic risk factor(s) or persistently elevated liver enzymes → FIB-4*:\n  <1.3 → Re-assess FIB-4 every 1-3 years\n  1.3-2.67:\n    (A) VCTE or alternative test***:\n      <8.0 kPa → Intensified management of comorbidities**\n      ≥8.0 kPa → Hepatology referral\n    (B) Intensified management of comorbidities** → re-assess FIB-4 at ≤1 year:\n      FIB-4 <1.3 → Re-assess FIB-4 every 1-3 years\n      FIB-4 ≥1.3 → VCTE or alternative test***\n  >2.67 → Hepatology referral: Diagnostic work-up and management plan for liver-related outcomes; Intensified management of comorbidities (in a multidisciplinary team)"
        text: |
          الحد التحتاني **1.3** في كل حتة. الفرق في **الحد الفوقاني**:

          - **Book p102 bands:** high risk **> 3.25**.
          - **ADA 2025:** referral مباشر لو **> 2.67**.
          - **EASL 2021:** رقم واحد بس **1.30**، وبعده elastography.

          اقرا السؤال كويس: بيسأل على أنهي pathway؟
      - kind: table
        page: 104
        quote: "EASL 2021 Recommendations for non-invasive assessment and risk stratification of liver fibrosis (Primary care/diabetology clinic)\nPatients at risk for chronic liver disease\n1. Check for liver risk factors: Metabolic syndrome, alcohol, HBV, HCV, familial history\n2. Test AST, ALT, GGT, ALP and platelet count\nViral hepatitis / other causes of chronic liver diseases or clinical signs of advanced liver disease / cirrhosis:\n  Liver clinic: Referral to liver specialist\nMetabolic co-factors and/or alcohol only?\n  Calculate FIB-4* (Age, AST, ALT, platelet)\n    <1.30, Low risk: No need for referral, Lifestyle modifications, Re-test in 1-3 years\n    ≥1.30, Intermediate-High risk: Liver stiffness by transient elastography*\n      <8 kPa, Low risk: No need for referral, Lifestyle modifications, Re-test in 1-3 years\n      ≥8 kPa, Intermediate-High risk:\n        Patented serum tests** Not available: Consider liver biopsy\n        Patented serum tests** Available = combine:\n          Discordance: Consider liver biopsy\n          Concordance: F3-F4 highly likely\nADA 2025\nType 2 diabetes or obesity + ≥1 cardiometabolic risk factor(s) or persistently elevated liver enzymes → FIB-4*:\n  <1.3 → Re-assess FIB-4 every 1-3 years\n  1.3-2.67:\n    (A) VCTE or alternative test***:\n      <8.0 kPa → Intensified management of comorbidities**\n      ≥8.0 kPa → Hepatology referral\n    (B) Intensified management of comorbidities** → re-assess FIB-4 at ≤1 year:\n      FIB-4 <1.3 → Re-assess FIB-4 every 1-3 years\n      FIB-4 ≥1.3 → VCTE or alternative test***\n  >2.67 → Hepatology referral: Diagnostic work-up and management plan for liver-related outcomes; Intensified management of comorbidities (in a multidisciplinary team)"
        title: "EASL 2021 vs ADA 2025"
