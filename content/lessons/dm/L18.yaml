  - id: dm.L18.lesson3
    title: "ننزّل الـ uric acid تحت 6: allopurinol و febuxostat"
    hook: "الهدف رقم واحد: أقل من 6. والـ allopurinol لسه الملك، بس ليه أعداء في الـ drug interactions."
    minutes: 10
    pages: [237, 241]
    topics: [chronic-tx, xo]
    goals:
      - "تحفظ الهدف والـ general measures"
      - "تقسّم أدوية الـ chronic gout لأربع مجموعات"
      - "تعرف مشاكل الـ allopurinol والـ interactions، وجرعات الـ febuxostat"
    status: unverified
    steps:
      - kind: explain
        page: 237
        title: "الهدف والـ general measures"
        quote: "Managing Intercritical and Chronic Gout: Aim to keep plasma uric acid < 6 mg/dl"
        text: |
          الهدف: ==plasma uric acid < 6 mg/dl==.

          **General measures:**
          1. **Weight reduction**
          2. **Moderate protein and low-fat diet**
          3. **Avoid alcohol**
          4. **Revise drugs** (زي الـ thiazides)
          5. **High fluid intake**: urine > **2000 ml/day**
      - kind: reveal
        page: 237
        quote: "Managing Intercritical and Chronic Gout: Aim to keep plasma uric acid < 6 mg/dl"
        prompt: "ليه الهدف 6 وإحنا بنعرّف الـ hyperuricemia في الراجل بـ 7؟"
        answer: |
          لأن الـ urate بيتشبّع ويترسب حوالي **6.8 mg/dl**. لو نزلته ==below 6== بيبقى unsaturated، فالكريستال اللي في الأنسجة والـ tophi تبدأ تدوب. 7 بيعرّف المرض، و 6 بيعالجه. (التفسير فسيولوجي، الأرقام من الكتاب.)
      - kind: table
        page: 238
        quote: "Uricostatic drugs (Xanthine oxidase inhibitors)"
        title: "أربع مجموعات أدوية"
        columns: [Group, Drugs]
        rows:
          - ["Uricosuric", "Probenecid, sulfinpyrazone, benzbromarone, lesinurad"]
          - ["Urine alkalinizing", "Na bicarbonate, Na citrate, acetazolamide"]
          - ["Uricostatic (XO inhibitors)", "Allopurinol, febuxostat"]
          - ["Urate oxidase", "Rasburicase, pegloticase"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 237
        title: "الـ lesinurad"
        quote: "It acts by inhibiting the urate transporter, URAT1, which is primarily responsible for reabsorbing uric acid in the kidneys."
        text: |
          أول **SURI** (selective uric acid reabsorption inhibitor). بيمنع ==URAT1== (اللي بيرجّع الـ uric acid من الكلية) و **OAT4** (مرتبط بالـ diuretic-induced hyperuricemia).
          - **200 mg** ولازم **مع xanthine oxidase inhibitor**، للي ما وصلش الهدف عليه لوحده.
          - لوحده أو بجرعة أعلى = **serum creatinine ↑**.
      - kind: update
        page: 237
        quote: "Lesinurad (Zurampic) is the first selective uric acid reabsorption inhibitor (SURI) approved by the FDA."
        text: "الـ lesinurad اتسحب من السوق الأمريكي سنة 2019 لأسباب تجارية من الشركة."
        ref: "Ironwood Pharmaceuticals market withdrawal, 2019"
      - kind: figure
        page: 239
        title: "الأدوية بتشتغل فين؟ (شكل الكتاب)"
        image: { file: dm/L18-purine-drugs.webp, book: true }
        alt: "The book's slide of purine nucleotide catabolism: purines to hypoxanthine to xanthine to uric acid to allantoin; xanthine oxidase inhibitors (allopurinol, oxipurinol, febuxostat) block both XO steps; uric oxidase (rasburicase, PEG-uricase) converts uric acid to allantoin."
        caption: "الـ **XO inhibitors** بيقفلوا خطوتين (hypoxanthine → xanthine → uric acid). الـ **uricase** بيحوّل الـ uric acid لـ **allantoin**، إنزيم الإنسان فقده في التطور."
      - kind: explain
        page: 238
        title: "الـ allopurinol: الـ gold standard"
        quote: "the most common dose of 300 mg/ day failed to achieve a serum urate level of < 6 mg/ dl in 50%"
        text: |
          - ==gold standard uricostatic drug==، مناسب لأغلب الحالات و side effects مقبولة.
          - الجرعات المعتمدة **100–800 mg/day**، بس الجرعة المشهورة **300 mg** بتفشل توصّل لـ < 6 في **50%**.

          الدرس: الـ 300 مش سقف، اللي يحدد هو التحليل.
      - kind: update
        page: 238
        quote: "the most common dose of 300 mg/ day failed to achieve a serum urate level of < 6 mg/ dl in 50%"
        text: "ابدأ الـ allopurinol بـ **100 mg/day أو أقل** (أقل في الـ CKD) وزوّد لحد ما توصل للهدف. واعمل **HLA-B*5801** قبل ما تبدأ في المرضى من جنوب شرق آسيا والأمريكان الأفارقة."
        ref: "ACR Guideline for the Management of Gout 2020"
      - kind: match
        page: 239
        quote: "Azathioprine and 6-mercaptopurine are metabolized by XO"
        prompt: "وصّل كل دوا بالـ interaction مع الـ allopurinol:"
        pairs:
          - ["Azathioprine, 6-MP", "Metabolized by XO: levels rise"]
          - ["Large-dose salicylates", "More oxipurinol excretion: less effect"]
          - ["Phenytoin", "Less hepatic oxidation of allopurinol"]
          - ["Theophylline", "Slower metabolism: toxicity"]
          - ["Ampicillin", "More skin reactions"]
        why: "أخطرهم الـ **azathioprine/6-MP**: الـ XO هو اللي بيكسّرهم، فلو قفلته بيتراكموا ويعملوا bone marrow suppression."
      - kind: explain
        page: 240
        title: "مشاكل تانية للـ allopurinol"
        quote: "Allopurinol hypersensitivity syndrome: fever, rash, reduced renal function, hepatic injury, leukocytosis, eosinophilia, vasculitis (20% fatality)"
        text: |
          - **Considerations:** ممكن **يعمل acute attack** في الأول، GIT side effects، bone marrow suppression، renal impairment.
          - **Renal impairment:** الجرعة تقل مع الـ GFR، فصعب توصل للهدف.
          - **Hematological malignancy / tumor lysis:** الـ uricosuria صعب تتحكم فيها، و **xanthinuria** شديدة.
          - **Skin reactions 2–5%** لحد **Stevens-Johnson**.
          - ==Allopurinol hypersensitivity syndrome==: fever، rash، renal ↓، hepatic injury، leukocytosis، **eosinophilia**، vasculitis، **20% fatality**.
      - kind: check
        page: 239
        quote: "Azathioprine and 6-mercaptopurine are metabolized by XO"
        question: "A patient on azathioprine needs urate-lowering therapy. Main danger of adding allopurinol at usual dose?"
        options:
          - "Azathioprine toxicity with marrow suppression"
          - "Reduced allopurinol effect"
          - "Theophylline toxicity"
          - "Ampicillin rash"
        answer: 0
        why:
          - "صح: الـ azathioprine بيتكسّر بالـ XO، فلما تقفله يتراكم."
          - "ده الـ salicylates بجرعة عالية."
          - "مفيش theophylline في السؤال."
          - "مفيش ampicillin في السؤال."
      - kind: explain
        page: 240
        title: "الـ febuxostat"
        quote: "If the target urate level of 6mg/dL is not achieved within 2 weeks, the dose can be increased to 80 mg/day."
        text: |
          - **XO inhibitor** للـ chronic primary hyperuricemia. أقراص **40، 80، 120 mg**.
          - ابدأ **40 mg**، ولو ما وصلش < 6 في **2 weeks** زوّد لـ **80 mg**.
          - ==No dose adjustment in mild to moderate renal or hepatic impairment==؛ مفيش data في الـ severe.
          - Side effects (liver enzymes، arthralgia، nausea، rash) في **0.5%**.
          - ما اتدرسش في الـ secondary hyperuricemia (malignancy، transplant، Lesch-Nyhan).
      - kind: table
        page: 241
        quote: "febuxostat in a dose of 40mg daily is equivalent to allopurinol, but the 80 mg daily dose is superior to the 300 mg daily allopurinol."
        title: "Becker 2010 (6000 مريض)"
        columns: [Setting, Result]
        rows:
          - ["Normal kidneys", "Febuxostat 40 = allopurinol; 80 > allopurinol 300"]
          - ["Mild-moderate CKD", "Febuxostat better at any dose"]
          - ["Safety", "Comparable"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: update
        page: 241
        quote: "Adverse effects and safety profile are comparable for both drugs."
        text: "الـ febuxostat عليه **boxed warning** من الـ FDA (تجربة CARES: وفيات قلب أكتر من الـ allopurinol)، والـ ACR بتنصح تغيّره لو المريض عنده **cardiovascular disease** لو ينفع."
        ref: "FDA Drug Safety Communication 2019; ACR gout guideline 2020"
