            <rect x="120" y="202" width="133" height="20" class="fg-bad"/>
            <text x="258" y="217" class="t-sm t-b">34%</text>
          </svg>
      - kind: mnemonic
        page: 172
        quote: "Size, degree of dysplasia (46% cancer >2cm, 34% in severe dysplasia)."
        word: "SVD"
        parts:
          - { key: "S", text: "Size: over 2 cm = 46% cancer" }
          - { key: "V", text: "Villous: 40% (tubulovillous 20%)" }
          - { key: "D", text: "Dysplasia: severe = 34%" }
        hook: |
          البوليب الخطير **SVD**: كبير، villous، و dysplastic. وده بالظبط سؤال الكتاب: "All of the above".
      - kind: explain
        page: 172
        quote: "Invasive cancer will develop in 24% when untreated"
        title: "أرقام الـ adenoma"
        text: |
          الكتاب:
          - الـ polyps هي اللي ==most cancers arise from them==: neoplastic (adenomatous) و nonneoplastic (hyperplastic، mucosal، inflammatory، hamartomatous).
          - الـ adenoma في **33%** من الناس عند 50، و **50%** عند 70.
          - أغلبها **أقل من 1 cm**، و 60% single و 40% multiple.
          - من غير علاج: invasive cancer في ==24%==.

          التفسير المقبول (مش في الكتاب): الرقمين مع بعض بيقولوا حاجة مهمة: البوليب **شائع جدًا** بس **أغلبه** ما بيبقاش سرطان. يعني مش كل بوليب مصيبة، بس إنت ما تعرفش مين هيبقى، فأسهل حل إنك تشيله وهو صغير. وده المنطق ورا الـ colonoscopy: كشف وعلاج في نفس الجلسة.
      - kind: explain
        page: 173
        quote: "Colectomy indicated for residual carcinoma, those at high risk for +LN despite complete polypectomy."
        title: "شلت البوليب وطلع فيه سرطان"
        text: |
          - العلاج: endoscopic removal، و**surveillance every three years**. لو مش هينفع يتشال: biopsy، والـ large sessile villous: جراحة.
          - **Contraindications to polypectomy**: fungation، ulceration، distortion.
          - ==Colectomy== لو: residual carcinoma، أو high risk للـ nodes: **+margin**، poor differentiation، vascular أو lymphatic invasion.
          - والـ **sessile polyp with invasive cancer** يتعمله resection حتى من غير الـ features دي.

          التفسير المقبول (مش في الكتاب): ليه الحاجات دي بالذات بتخلينا نعمل colectomy؟ لأن كل واحدة معناها إن السرطان ممكن يكون سابق المكان اللي اتشال: الحافة الـ positive يعني فيه ورم لسه في الحيطة، والـ vascular أو lymphatic invasion يعني الخلايا دخلت قنوات توصلها للـ nodes. والـ fungation والـ ulceration علامة إن البوليب نفسه بقى سرطان غازي ومش هينفع يتشال بأمان بالمنظار.
      - kind: reveal
        page: 173
        quote: "Sessile polyp with invasive cancer should be considered for resection even if"
        prompt: "بوليب sessile اتشال وطلع فيه invasive cancer، والحواف نضيفة ومفيش vascular invasion. ليه لسه بنفكر في resection؟"
        answer: |
          الكتاب: الـ ==sessile polyp with invasive cancer== يتفكر له في resection **حتى لو مفيش high risk pathologic features**.

          التفسير المقبول (مش في الكتاب): الـ pedunculated ليه **ساق**، فالسرطان لازم يمشي في الساق كلها قبل ما يوصل للحيطة، والحافة بتبقى بعيدة. الـ sessile قاعدته على الحيطة نفسها، فالسرطان ممكن يكون وصل للـ submucosa اللي فيها الـ lymphatics بمسافة صغيرة جدًا، والـ nodes ممكن تكون اتصابت من غير ما الـ pathology تبيّن.
      - kind: explain
        page: 173
        quote: "All have this in common: Multiple intestinal polyps, extraintestinal"
        title: "الـ hereditary polyposis syndromes"
        text: |
          الكتاب: كلهم ليهم حاجتين مشتركين: ==multiple intestinal polyps== و **extraintestinal manifestations**.
          - **FAP**: 1-2% من مرضى colon cancer، **point mutation** في الـ **APC** gene على **chromosome 5q21**.
          - الـ polyps في كل الـ GI tract بس أغلبها في القولون، والأعراض بتظهر بين **16 و 50** سنة.

          التفسير المقبول (مش في الكتاب): الـ APC هو نفس الجين اللي بيبدأ الـ chromosomal pathway في السرطان العادي. الفرق إن في الـ FAP الـ mutation الأولى **موجودة من الولادة** في كل خلية، فكل خلية في القولون فاضلها خطوات أقل للسرطان. وده بيفسّر الآلاف من البوليبات، وإن السرطان بييجي في سن صغير.
      - kind: explain
        page: 173
        quote: "(FAP) is the second most common predisposing genetic syndrome, accounting for fewer than 1% of all CRCs. It is characterized by the development of hundreds to thousands of colorectal polyps beginning at 10-12 years of age. Without intervention, the lifetime risk of CRC approaches 100% by age 40. The genetic mutation that causes FAP is usually inherited, but can also occur spontaneously, so FAP-affected persons do not always have a family history of the disease. Surgery is the standard method of cancer prevention for people with FAP. Attenuated FAP is a less severe form of the condition with a later age at onset and in which fewer polyps (<100) develop, although the lifetime risk of developing CRC remains high."
        title: "FAP"
        text: |
          - **APC** point mutation على chromosome **5q21**، و1-2% من الـ colon cancer.
          - ==hundreds to thousands== of polyps من سن 10-12، في كل الـ gastrointestinal (GI) tract بس أغلبها في القولون.
          - من غير تدخل: الخطر قرب ==100% by age 40==. والوقاية القياسية: **surgery**.
          - ممكن spontaneous، فمش لازم يكون في family history.
          - **Attenuated FAP**: أقل من 100 polyp وسن أكبر، بس الخطر لسه عالي. والـ **MAP** (MUTYH) شبهه.

          يعني أي شاب عنده عشرات البوليبات في القولون، فكّر في FAP حتى لو أهله سليمين، واعرض على العيلة counseling، لأن الـ mutation ممكن تكون جديدة فيه وتتورث لعياله.
      - kind: reveal
        page: 173
        quote: "Surgery is the standard method of cancer prevention for people with FAP."
        prompt: "ليه الجراحة (مش المنظار) هي الوقاية في FAP؟"
        answer: |
          الكتاب: ==surgery is the standard method of cancer prevention== في الـ FAP، لأن من غير تدخل الخطر قرب **100% by age 40**، وفيه **hundreds to thousands** of polyps من سن 10-12.

          التفسير المقبول (مش في الكتاب): مستحيل تشيل آلاف البوليبات بالمنظار كل سنة، ومع خطر 100% مفيش «يمكن». فالـ colectomy بتشيل العضو اللي فيه الخطر. وعلشان الـ mutation ممكن تكون **spontaneous**، ما تستبعدش FAP لمجرد إن مفيش حد في العيلة.
      - kind: try
        items: [git.L04.159, git.L04.163, git.L04.168, git.L04.172, git.L04.254]
    recap:
