  - id: hem.L08.lesson4
    title: "الـ CLL: lymphocytes كبرت ونسيت تموت"
    hook: "عيان فوق الستين، تحليل روتيني، lymphocytes كتير وغدد rubbery: كده بدأت الحكاية."
    minutes: 10
    pages: [125, 129]
    topics: [cll-definition, cll-clinical, cll-diagnosis, staging, cll-ddx]
    goals:
      - "تعرّف الـ CLL وتعرف شكلها الإكلينيكي"
      - "تحفظ أرقام التشخيص وأسباب الأنيميا"
      - "تعمل Rai وBinet staging"
    status: unverified
    steps:
      - kind: explain
        page: 125
        title: "تعريف بسيط"
        quote: "Chronic lymphocytic leukemia is a neoplasm characterized by accumulation of monoclonal lymphocytes, usually of B cell (> 95% of cases)."
        text: |
          الـ **CLL** = تراكم ==monoclonal lymphocytes==، **B cell** في أكتر من 95%.

          بيتراكموا في الـ **marrow** والـ **nodes** والـ **liver** والـ **spleen**. أغلب العيانين **فوق 60**.

          السبب مش معروف، بس الـ ==familial clustering== أكتر من أي leukemia تانية، والـ **farmers** عندهم incidence أعلى (herbicides؟ pesticides؟).
      - kind: explain
        page: 126
        title: "شكل العيان"
        quote: "Lymphadenopathy with discrete, rubbery, mobile lymph nodes is present in two thirds of patients at diagnosis."
        text: |
          - أغلبهم **asymptomatic**: **absolute lymphocytosis** في تحليل روتيني.
          - أعراض: fatigue، lethargy، فقدان شهية ووزن، حرارة، غدد.
          - ==Lymph nodes== **discrete, rubbery, mobile** في **تلتين** العيانين.
          - الكبد والطحال أقل وقت التشخيص.
          - Infiltration ممكن في الجلد، **الجفون**، القلب، الرئة، الـ pleura، الـ GIT.
      - kind: order
        page: 126
        quote: "Herpes zoster and cytomegalovirus infection usually occur later in the disease."
        prompt: "رتّب الـ infections مع تقدم الـ CLL، من الأول للآخر:"
        steps:
          - "Sinopulmonary infections"
          - "Gram-negative, fungal and viral infections as neutropenia, T-cell deficiency and hypogammaglobulinemia grow"
          - "Herpes zoster and CMV"
        why: "في الأول الـ sinopulmonary هي الأشهر. ومع زيادة الـ neutropenia والـ T-cell deficiency والـ hypogammaglobulinemia بييجي gram-negative وfungal وviral، والـ zoster والـ CMV بيظهروا متأخر."
      - kind: table
        page: 128
        quote: "B.M lymphocytosis > 30%, Anaemia <11 gm/dl is present in 15 to 20% of patients at diagnosis."
        title: "أرقام التشخيص"
        columns: [Finding, Number]
        rows:
          - ["Blood lymphocytes", ">5,000/µL"]
          - ["Needs clonality proof", "5,000–15,000/µL"]
          - ["Hyperviscosity", "WBC >500,000/µL"]
          - ["Marrow lymphocytes", ">30%"]
          - ["Anemia <11 at diagnosis", "15–20%"]
        hide: [[0, 1], [1, 1], [3, 1], [4, 1]]
      - kind: explain
        page: 128
        title: "الأنيميا في الـ CLL: تلات أسباب"
        quote: "autoimmune hemolytic anaemia which is confirmed by a positive direct coombs test and reticulocytosis"
        text: |
          1. **Normochromic normocytic** بـ reticulocytes **طبيعية**: النخاع مليان.
          2. ==AIHA==: **direct Coombs موجب** + **reticulocytosis**.
          3. **Pure red cell aplasia**.

          وكمان ==hypogammaglobulinemia== شائعة، فالعيان معرض للـ **encapsulated organisms**، والـ T cells ردها ضعيف.
      - kind: table
        page: 128
        quote: "Nodular 15% 2. Infilterative 30% 3. Mixed nodular and infilterative 30% and 4. Diffuse 35%"
        title: "شكل النخاع في الـ biopsy"
        columns: [Pattern, Share]
        rows:
          - [Nodular, "15%"]
          - [Interstitial, "30%"]
          - [Mixed, "30%"]
          - [Diffuse, "35% (advanced stage)"]
        hide: [[0, 1], [3, 1]]
      - kind: figure
        page: 129
        quote: "Rai and Binet staging systems in chromic lymphocytic leukemia (CLL)"
        title: "سلّم الـ Rai"
        alt: "A five-step staircase for Rai staging. Stage 0 lymphocytosis only; stage I adds lymph nodes; stage II adds liver or spleen; stage III adds haemoglobin below 11; stage IV adds platelets below 100 thousand. Low risk 0, intermediate I and II, high risk III and IV."
        caption: "كل درجة بتضيف حاجة: ==nodes== ← liver/spleen ← **Hb <11** ← **platelets <100**."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="240" width="62" height="50" class="fg-good"/>
            <rect x="72" y="200" width="62" height="90" class="fg-acc"/>
            <rect x="134" y="160" width="62" height="130" class="fg-acc"/>
            <rect x="196" y="120" width="62" height="170" class="fg-bad"/>
            <rect x="258" y="80" width="62" height="210" class="fg-bad"/>
            <text x="41" y="262" text-anchor="middle" class="t-lg t-b">0</text>
            <text x="103" y="222" text-anchor="middle" class="t-lg t-b">I</text>
            <text x="165" y="182" text-anchor="middle" class="t-lg t-b">II</text>
            <text x="227" y="142" text-anchor="middle" class="t-lg t-b">III</text>
            <text x="289" y="102" text-anchor="middle" class="t-lg t-b">IV</text>
            <text x="41" y="282" text-anchor="middle" class="t-sm">Lymphs</text>
            <text x="103" y="245" text-anchor="middle" class="t-sm">+ Nodes</text>
            <text x="165" y="205" text-anchor="middle" class="t-sm">+ Liver or</text>
            <text x="165" y="221" text-anchor="middle" class="t-sm">spleen</text>
            <text x="227" y="165" text-anchor="middle" class="t-sm">+ Hb</text>
            <text x="227" y="181" text-anchor="middle" class="t-sm">below 11</text>
            <text x="289" y="125" text-anchor="middle" class="t-sm">+ Plt</text>
            <text x="289" y="141" text-anchor="middle" class="t-sm">below 100</text>
            <text x="165" y="30" text-anchor="middle" class="t-sm t-b">Rai stage (1975, USA)</text>
            <text x="165" y="50" text-anchor="middle" class="t-sm t-mut">each step keeps the ones before</text>
          </svg>
      - kind: explain
        page: 129
        title: "الـ Binet: عدّ المناطق"
        quote: "Rai and Binet staging systems in chromic lymphocytic leukemia (CLL)"
        text: |
          الـ **Binet (1981, UK)** بيعدّ مناطق الغدد (lymphoid areas) ويبص على الـ Hb والـ platelets:
          - **A**: أقل من 3 مناطق، **Hb ≥10** و platelets ≥100
          - **B**: ==3 مناطق أو أكتر==، Hb ≥10 و platelets ≥100
          - **C**: ==Hb <10 أو platelets <100== مهما كانت الغدد
      - kind: aside
        tone: trap
        page: 129
        quote: "Rai and Binet staging systems in chromic lymphocytic leukemia (CLL)"
        text: "خلّي بالك: الـ Hb في **Rai** حدها **11**، وفي **Binet** حدها **10**. والـ platelets في الاتنين **100**. وجدول الكتاب مطبوع فيه «<3» للـ B كمان، وده غلط مطبعي: B = **3 أو أكتر**."
      - kind: check
        page: 129
        quote: "Rai and Binet staging systems in chromic lymphocytic leukemia (CLL)"
        question: "CLL with neck nodes only, Hb 9.2 g/dL, platelets 150,000. Binet stage?"
        options:
          - "C"
          - "A"
          - "B"
          - "Rai II"
        answer: 0
        why:
          - "صح: Hb أقل من 10 = Binet C مهما كانت الغدد."
          - "الـ A محتاجة Hb ≥10."
          - "الـ B محتاجة Hb ≥10 و3 مناطق أو أكتر."
          - "السؤال عن Binet؛ وفي Rai هتبقى III لأن Hb أقل من 11."
      - kind: explain
        page: 129
        title: "الـ DD والـ PLL"
        quote: "is characterized by massive splenomegaly, minimal lymph adenopathy, WMB count commonly > 100,000/dl with 10-90% prolymphocytes."
        text: |
          **Lymphocytosis تانية**: pertussis، infectious mononucleosis، TB، toxoplasmosis، autoimmune. دول **أصغر سنًا**، عندهم حرارة أو rash أو مفاصل، والـ lymphocytes عادةً **أقل من 15,000** و ==not sustained==. لو شاكك: **monoclonal antibodies**.

          ==Prolymphocytic leukemia (PLL)==: حوالي 10% من الـ CLL، **massive splenomegaly** مع غدد **قليلة**، WBC غالبًا **فوق 100,000** فيه 10–90% prolymphocytes، و t(6;12).
      - kind: try
        items: [hem.L08.068, hem.L08.070, hem.L08.073, hem.L08.078, hem.L08.079]
    recap:
      - "CLL: monoclonal B cells (>95%)، فوق 60، familial clustering، farmers."
      - "Nodes rubbery mobile في تلتين العيانين. Infections: sinopulmonary الأول، zoster وCMV متأخر."
      - "Lymphs >5,000 (clonality لو 5,000–15,000)، marrow >30%، hyperviscosity فوق 500,000."
      - "Anemia: infiltration، AIHA (Coombs)، pure red cell aplasia. Diffuse marrow = advanced."
      - "Rai 0–IV (Hb 11، plt 100). Binet A/B/C (Hb 10، plt 100، 3 مناطق)."
      - "PLL: طحال ضخم، غدد قليلة، WBC >100,000، prolymphocytes."
    practice: [hem.L08.064, hem.L08.065, hem.L08.066, hem.L08.067, hem.L08.068, hem.L08.069, hem.L08.070, hem.L08.071, hem.L08.072, hem.L08.073, hem.L08.074, hem.L08.075, hem.L08.076, hem.L08.077, hem.L08.078, hem.L08.079, hem.L08.080, hem.L08.081, hem.L08.082, hem.L08.083, hem.L08.108, hem.L08.109, hem.L08.110, hem.L08.113, hem.L08.115]
