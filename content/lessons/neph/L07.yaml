          دي الـ **dot-and-fleck retinopathy** في الـ ==Alport syndrome==: ما بتأثرش على النظر، بس وجودها بيساعد في التشخيص.
      - kind: explain
        page: 180
        title: "البنت الـ carrier، والـ AR والـ AD"
        quote: "X-linked ♀ carriers often have microscopic haematuria alone. However, proteinuria and progression to ESRD by 5th decade in ~10–15%."
        text: |
          الكتاب:
          - **البنت الـ carrier** في الـ X-linked: غالبًا ==microscopic hematuria بس==، بس **10–15%** يوصلوا proteinuria و ESRD في العقد الخامس.
          - الـ **AR**: شبه الولد الـ X-linked إكلينيكيًا.
          - الـ **AD**: متغيّر جدًا.
          - **Leiomyomatosis** في المريء والـ tracheobronchial tree في حوالي **30 عيلة**، والبنات عندهم كمان genital leiomyomas مع clitoral hypertrophy.

          ليه البنت أخف والـ AR زي الولد؟ التفسير المقبول (مش في الكتاب):
          - البنت عندها **X سليم** و **X بايظ**، وكل خلية بتقفل واحد منهم بالصدفة (X-inactivation). يعني جزء من الـ GBM سليم وجزء لأ (وده الـ **mosaic** اللي هتشوفه في الصبغة). وكل ما النسبة البايظة أكتر، المرض أوحش.
          - الـ **AR** فيه النسختين بايظين، فمفيش شبكة سليمة خالص، زي الولد اللي عنده X واحد بس.
