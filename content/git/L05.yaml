items:
  # ---------- p185: definition ----------
  - id: git.L05.001
    kind: card
    topic: definition
    front: Define a polyp.
    back: Any lesion elevated above the mucosal surface of the bowel.
    src: { page: 185, quote: "A polyp is any lesion that is elevated above the mucosal surface of the bowel." }
    status: unverified
    tags: [high-yield]
  - id: git.L05.002
    kind: card
    topic: definition
    front: Where are GI polyps most common, and where else may they occur?
    back: Most common in the colon; may also occur in the esophagus, stomach or small intestine.
    src: { page: 185, quote: "Polyps are most common in the Colon. But may occur in Esophagus, Stomach, or Small intestine." }
    status: unverified
  - id: git.L05.003
    kind: cloze
    topic: definition
    text: Polyps without stalks are called {{c1::sessile}}; those with stalks are called {{c2::pedunculated}}.
    src: { page: 185, quote: "Polyps without stalks are referred to as sessile while those with stalks are termed pedunculated." }
    status: unverified
  - id: git.L05.004
    kind: card
    topic: definition
    front: How does a polyp acquire a stalk?
    back: Proliferation of the cells next to the polyp combined with traction on the luminal protrusion.
    src: { page: 185, quote: "Proliferation of cells adjacent to the polyp and the effects of traction on the luminal protrusion, may combine to create a stalk." }
    status: unverified
  # ---------- p186: gastric polyps ----------
  - id: git.L05.005
    kind: card
    topic: gastric
    front: Define gastric polyps.
    back: Distinct intraluminal projections of mucosal or submucosal tissue; proliferative growths that may carry potential for malignant transformation.
    src: { page: 186, quote: "Gastric polyps are distinct intraluminal projections of mucosal or submucosal tissue." }
    status: unverified
  - id: git.L05.006
    kind: table
    topic: gastric
    title: The common triad of gastric polyps
    columns: [Polyp, Characteristic histology]
    rows:
      - [Gastric hyperplastic polyp (GHP), Pronounced foveolar hyperplasia]
      - [Fundic gland polyp (FGP), "Dilated, irregularly budded fundic glands lined mainly by parietal cells, fewer chief cells"]
      - [Adenomatous polyp, Low-grade glandular dysplasia]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 186, quote: "gastric hyperplastic polyps (GHP) characterized by pronounced foveolar hyperplasia, fundic gland polyps (FGP) characterized by dilated and irregularly budded fundic glands" }
    status: unverified
    tags: [high-yield]
  - id: git.L05.007
    kind: card
    topic: gastric
    front: Which cells mainly line the glands of a fundic gland polyp?
    back: Parietal cells, with a smaller proportion of chief cells.
    src: { page: 186, quote: "predominantly lined by parietal cells with smaller proportion of chief cells" }
    status: unverified
  # ---------- p186-187: classification and adenomas ----------
  - id: git.L05.008
    kind: table
    topic: classification
    title: Classification of colorectal polyps (book figure, p186)
    columns: [Group, Polyps]
    rows:
      - [Neoplastic benign, "Adenoma, serrated polyps, carcinoid, granular cell tumour"]
      - [Neoplastic malignant, "Adenocarcinoma, carcinoid, stromal, lymphoid"]
      - [Non-neoplastic, "Hyperplastic polyps, inflammatory polyps, hamartomas, lipoma, leiomyoma"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 186, quote: "Adenoma > Adenocarcinoma" }
    status: unverified
  - id: git.L05.009
    kind: card
    topic: adenoma
    front: Which colonic polyps are the most common, and do they carry malignant potential?
    back: Adenomatous polyps; yes, they carry malignant potential.
    src: { page: 187, quote: "Adenomatous polyps are the most common colonic polyps and they carry malignant potential." }
    status: unverified
    tags: [high-yield]
  - id: git.L05.010
    kind: card
    topic: adenoma
    front: From which cells do adenomas arise, and what is their defining histological feature?
    back: The mucus-secreting colonic epithelial cells; they are defined by epithelial dysplasia.
    src: { page: 187, quote: "They originate from the mucus-secreting colonic epithelial cells and characterized by the presence of epithelial dysplasia." }
    status: unverified
  - id: git.L05.011
    kind: card
    topic: adenoma
    front: Size range and texture of a typical adenoma?
    back: 0.3 to 10 cm, with a velvet or raspberry texture from the abnormal epithelial growth pattern.
    src: { page: 187, quote: "Typical adenomas range from 0.3 to 10 cm in diameter having a texture resembling velvet or a raspberry" }
    status: unverified
  - id: git.L05.012
    kind: table
    topic: adenoma
    title: Adenomas by glandular architecture
    columns: [Type, Villous tissue]
    rows:
      - [Tubular adenoma, 0-25%]
      - [Tubulovillous adenoma, 25-75%]
      - [Villous adenoma, 75-100%]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 187, quote: "Tubular adenomas (0-25% villous tissue) Tubulovillous adenomas (25-75% villous tissue) Villous adenoma (75-100% villous tissue)" }
    status: unverified
    tags: [high-yield, numbers]
  # ---------- p187-191: serrated ----------
  - id: git.L05.013
    kind: card
    topic: serrated
    front: Define a serrated polyp.
    back: Any polyp with a serrated (sawtooth or stellate) appearance of the crypt epithelium.
    src: { page: 187, quote: "Serrated polyp is a general term for any polyp that shows a serrated (sawtooth or stellate) appearance of the crypt epithelium." }
    status: unverified
  - id: git.L05.014
    kind: cloze
    topic: serrated
    text: Serrated lesions are precursors of colorectal cancers that show {{c1::hypermethylation}}, arise mainly in the {{c2::proximal colon}}, and make up about {{c3::one-third (30%)}} of all CRCs.
    src: { page: 187, quote: "Hypermethylation Arise primarily in the proximal colon Account for one-third (30%)of all CRCs." }
    status: unverified
    tags: [high-yield]
  - id: git.L05.015
    kind: table
    topic: serrated
    title: Multiple genetic pathways in colorectal cancer (book figure, p188)
    columns: [Pathway, Steps]
    rows:
      - [Chromosomal instability (CIN), "APC loss, then K-ras and other oncogenes with 18q LOH, then TP53 inactivation: normal, early adenoma, late adenoma, cancer"]
      - [Microsatellite instability (MSI), "APC loss and failure of MMR genes, then TGF-beta RII, BAX and other mutations: adenoma, cancer"]
      - [Serrated pathway, "BRAF mutation and DNA methylation, then TP53, p16 inactivation, LOH: serrated adenoma, cancer"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 188, quote: "Multiple genetic pathways in colorectal cancer pathogenesis" }
    status: unverified
    tags: [high-yield]
  - id: git.L05.016
    kind: card
    topic: serrated
    front: Which mutation and epigenetic change start the serrated pathway?
    back: BRAF mutation and DNA methylation.
    src: { page: 188, quote: "BRAF mutation" }
    status: unverified
  - id: git.L05.017
    kind: enumerate
    topic: serrated
    prompt: WHO classification of serrated lesions (2010).
    points:
      - "Hyperplastic polyp: microvesicular (60%), goblet cell rich (30%), mucin poor (10%)"
      - "Sessile serrated adenoma/polyp, with or without atypia"
      - Traditional serrated adenoma
    pass: 3
    src: { page: 188, quote: "WHO Classification of Serrated Lesions (2010) Hyperplastic polyp (HP) Microvesicular HP (MVHP) (60%)" }
    status: unverified
    tags: [high-yield]
  - id: git.L05.018
    kind: cloze
    topic: serrated
    text: "Hyperplastic polyp subtypes: microvesicular {{c1::60%}}, goblet cell rich {{c2::30%}}, mucin poor {{c3::10%}}."
    src: { page: 188, quote: "Microvesicular HP (MVHP) (60%) Goblet cell rich HP (GCHP) (30%) Mucin poor HP (MPHP) (10%)" }
    status: unverified
    tags: [numbers]
  - id: git.L05.019
    kind: card
    topic: serrated
    front: Two types of sessile serrated adenoma/polyp in the WHO 2010 classification?
    back: SSA/P with atypia (adenomatous or serrated) and SSA/P without atypia.
    src: { page: 188, quote: "SSA/P with atypia (Adenomatous, Serrated) SSA/P without atypia" }
    status: unverified
  - id: git.L05.020
    kind: card
    topic: serrated
    front: Dysplastic serrated lesions in the book's classification table (p189)?
    back: Serrated adenoma, admixed polyp (a dysplastic serrated polyp with a conventional-adenoma-like component), and serrated adenocarcinoma.
    src: { page: 189, quote: "Serrated adenocarcinoma" }
    status: unverified
  - id: git.L05.021
    kind: cloze
    topic: serrated
    text: Hyperplastic polyps are the most common non-neoplastic type, {{c1::60-75%}} of serrated lesions, more common on the {{c2::left}} side and in {{c3::males}}.
    src: { page: 189, quote: "Most common non-neoplastic type accounting for 60–75% of all serrated lesions More common on left side of colon and in males" }
    status: unverified
    tags: [high-yield]
  - id: git.L05.022
    kind: card
    topic: serrated
    front: Typical size and shape of a hyperplastic polyp?
    back: Small, under 5 mm, usually flat or sessile.
    src: { page: 189, quote: "Small < 5 mm, and usually present a flat or sessile morphology." }
    status: unverified
  - id: git.L05.023
    kind: card
    topic: serrated
    front: Which hyperplastic polyps are more likely to harbor malignant potential?
    back: Larger ones (1 cm or more) in the right colon, and those of serrated polyposis syndrome.
    src: { page: 189, quote: "larger (≥1 cm) hyperplastic polyps involving the right colon and those seen in the serrated polyposis syndrome SPS are more likely to harbor malignant potential." }
    status: unverified
  - id: git.L05.024
    kind: card
    topic: serrated
    front: Side, sex and appearance of a sessile serrated adenoma/polyp?
    back: Right colon, more in females; large, sessile and yellow, may have a mucus cap that can make it easy to miss.
    src: { page: 190, quote: "More common in the right side of colon and in females They are large, sessile, yellow in color, may have a mucus cap" }
    status: unverified
    tags: [high-yield]
  - id: git.L05.025
    kind: card
    topic: serrated
    front: Which serrated lesion is the precursor of many sporadic CRCs?
    back: The sessile serrated adenoma/polyp (SSA/P).
    src: { page: 190, quote: "It is the precursor lesion for many sporadic CRCs." }
    status: unverified
  - id: git.L05.026
    kind: card
    topic: serrated
    front: Traditional serrated adenoma - frequency, patients and site?
    back: Rare (under 6% of serrated polyps), in older adults especially females, located in the left colon.
    src: { page: 190, quote: "Rare subtype (<6% of serrated polyps). Occur in older adults particularly females. Located in the left colon." }
    status: unverified
  - id: git.L05.027
    kind: card
    topic: serrated
    front: Endoscopic look of a traditional serrated adenoma, and its malignant potential?
    back: Polypoid lesions are reddish and granulo-lobular; sessile ones are larger, proximal, with white mucosa. It has significant malignant potential.
    src: { page: 190, quote: "Polypoidal lesions: reddish discoloration and granulo- lobular appearance. Sessile lesions: Larger, proximally located, white mucosa." }
    status: unverified
  - id: git.L05.028
    kind: table
    topic: serrated
    title: The three serrated lesions compared
    columns: [Feature, Hyperplastic polyp, SSA/P, TSA]
    rows:
      - [Frequency, "Most common, 60-75%", "Precursor of many sporadic CRCs", "Rare, under 6%"]
      - [Side, Left, Right, Left]
      - [Sex, Males, Females, "Older adults, females"]
      - [Look, "Small under 5 mm, flat or sessile", "Large, sessile, yellow, mucus cap", "Reddish granulo-lobular, or white sessile"]
    blanks: [[1, 1], [1, 2], [1, 3], [2, 1], [2, 2], [3, 2]]
    src: { page: 190, quote: "More common in the right side of colon and in females" }
    status: unverified
    tags: [high-yield]
  - id: git.L05.029
    kind: enumerate
    topic: serrated
    prompt: Why are serrated lesions important?
    points:
      - "High frequency in the proximal colon: missed at colonoscopy"
      - "Flat/sessile morphology: easily overlooked"
      - "Ill-defined borders: incomplete resection"
      - Putative rapid growth of MSI cancers
      - Aggressive behaviour and poorer outcomes of BRAF, MSS cancers
    pass: 4
    src: { page: 191, quote: "High frequency in proximal colon: Missed in colonoscopy. Flat/Sessile Morphology: Easily Overlooked. Ill defined Borders: Incomplete Resection." }
    status: unverified
    tags: [high-yield]
  - id: git.L05.030
    kind: table
    topic: serrated
    title: WHO criteria for serrated polyposis syndrome, 2010 versus 2019 (book figure, p192)
    columns: [Criterion, "2010", "2019"]
    rows:
      - ["I", "5 or more serrated polyps proximal to the sigmoid, at least 2 of 10 mm or more", "5 or more serrated lesions proximal to the rectum, all 5 mm or more, at least 2 of 10 mm or more"]
      - ["II", "Any number proximal to the sigmoid with a first-degree relative with SPS", "More than 20 serrated lesions of any size throughout the large bowel, 5 or more proximal to the rectum"]
      - ["III", "More than 20 serrated polyps of any size throughout the colon", "(dropped)"]
    blanks: [[0, 2], [1, 2]]
    src: { page: 192, quote: "Update on the World Health Organization Criteria for Diagnosis of Serrated Polyposis Syndrome" }
    status: unverified
  - id: git.L05.031
    kind: card
    topic: serrated
    front: Which 2010 criterion for serrated polyposis syndrome was dropped in 2019?
    back: Any number of serrated polyps proximal to the sigmoid in a person with a first-degree relative with SPS.
    src: { page: 192, quote: "Update on the World Health Organization Criteria for Diagnosis of Serrated Polyposis Syndrome" }
    status: unverified
  # ---------- p192-193: inflammatory and DALM ----------
  - id: git.L05.032
    kind: card
    topic: inflammatory
    front: Where are inflammatory polyps typically seen, and what do they indicate?
    back: In IBD; they mark regenerative and/or healing phases of mucosal ulceration.
    src: { page: 192, quote: "Typically seen in IBD, are indicative of regenerative and/or healing phases of mucosal ulceration." }
    status: unverified
  - id: git.L05.033
    kind: card
    topic: inflammatory
    front: What complications may large inflammatory polyps cause?
    back: Being numerous, filiform and large, they may encompass the lumen and cause intussusception or luminal obstruction.
    src: { page: 192, quote: "They are often numerous, filiform, and can be large enough to encompass the lumen resulting in intussusception or luminal obstruction" }
    status: unverified
  - id: git.L05.034
    kind: card
    topic: inflammatory
    front: Histological surface changes that may be present in inflammatory polyps?
    back: Surface erosions, congestion, hemorrhage and/or crypt abscesses.
    src: { page: 192, quote: "Surface erosions, congestion, hemorrhage and/or crypt abscesses may also be present." }
    status: unverified
  - id: git.L05.035
    kind: card
    topic: inflammatory
    front: Define DALM.
    back: Dysplasia-associated lesion or mass. A raised mucosal lesion with dysplasia on histology in a patient with long-standing IBD, mainly ulcerative colitis.
    src: { page: 192, quote: "Dysplasia-associated lesion or mass (DALM): a raised mucosal lesion in a patient with long-standing inflammatory bowel disease (IBD), mainly mucosal" }
    status: unverified
    tags: [high-yield]
  - id: git.L05.036
    kind: card
    topic: inflammatory
    front: How fast does a DALM turn into cancer compared with a sporadic adenoma?
    back: Much faster than the classic adenoma-to-carcinoma sequence.
    src: { page: 193, quote: "The transition of a DALM to colorectal cancer is believed to be much faster than the classic adenoma-to-carcinoma sequence." }
    status: unverified
    tags: [high-yield]
  # ---------- p193-194: hamartomas and polyposis ----------
  - id: git.L05.037
    kind: card
    topic: hamartoma
    front: What are hamartomatous polyps made of, and what do they look like?
    back: Mainly connective tissue covered by hypertrophic epithelium; pedunculated, cherry-red and smooth. Also called juvenile polyps.
    src: { page: 193, quote: "Also known as ‗juvenile polyps‘, consist mainly of connective tissue covered by a hypertrophic epithelium. They are pedunculated, cherry-red, smooth polyps." }
    status: unverified
    tags: [high-yield]
  - id: git.L05.038
    kind: card
    topic: hamartoma
    front: Features of a sporadic hamartomatous polyp?
    back: Usually solitary, appears at an early age, and usually has no malignant potential.
    src: { page: 193, quote: "A sporadic hamartomatous polyp is usually solitary, appears at an early age and do not usually harbor any malignant potential." }
    status: unverified
  - id: git.L05.039
    kind: enumerate
    topic: hamartoma
    prompt: Mention the hamartomatous polyposis syndromes.
    points:
      - Juvenile polyposis
      - Peutz-Jeghers syndrome
      - Hereditary mixed polyposis syndrome
      - "PTEN hamartoma tumor syndromes: Cowden and Bannayan-Riley-Ruvalcaba"
      - Cronkhite-Canada syndrome
    pass: 4
    src: { page: 193, quote: "Several different syndromes have been described as Juvenile Polyposis, Peutz-Jeghers syndrome, hereditary mixed polyposis syndrome, and the PTEN hamartoma tumor" }
    status: unverified
    tags: [high-yield]
  - id: git.L05.040
    kind: card
    topic: hamartoma
    front: Which hamartomatous polyposis syndrome is acquired rather than autosomal dominant?
    back: Cronkhite-Canada syndrome.
    src: { page: 193, quote: "which are autosomal-dominantly inherited, and Cronkhite-Canada syndrome, which is acquired." }
    status: unverified
    tags: [high-yield]
  - id: git.L05.041
    kind: card
    topic: hamartoma
    front: FAP in lecture 5 - inheritance, polyps and malignant potential?
    back: Autosomal dominant hereditary polyposis with thousands of adenomatous polyps in the colon and rectum, some extra-intestinal manifestations, and malignant potential.
    src: { page: 194, quote: "It is an autosomal dominant genetic disease. Thousands of adenomatous polyps throughout the colon and rectum, some extra-intestinal manifestations may occur." }
    status: unverified
  # ---------- p194-197: NICE ----------
  - id: git.L05.042
    kind: card
    topic: nice
    front: What does NICE stand for, and what does it use to classify polyps?
    back: NBI International Colorectal Endoscopic classification. It uses colour (staining), vascular pattern and surface pattern on narrow-band imaging to tell hyperplastic from adenomatous polyps.
    src: { page: 195, quote: "The classification uses staining, vascular patterns, and surface patterns to distinguish between hyperplastic and adenomatous colon polyps" }
    status: unverified
    tags: [high-yield]
  - id: git.L05.043
    kind: table
    topic: nice
    title: NICE classification (book figure, p195)
    columns: [Feature, Type 1, Type 2, Type 3]
    rows:
      - [Color, Same or lighter than background, "Browner than background (from vessels)", "Brown to dark brown, sometimes patchy whiter areas"]
      - [Vessels, "None, or isolated lacy vessels across the lesion", Brown vessels surrounding white structures, Areas of disrupted or missing vessels]
      - [Surface pattern, "Dark or white spots of uniform size, or homogeneous absence of pattern", "Oval, tubular or branched white structures surrounded by brown vessels", Amorphous or absent surface pattern]
      - [Most likely pathology, Hyperplastic, Adenoma, Deep submucosal invasive cancer]
    blanks: [[0, 1], [1, 2], [2, 3], [3, 1], [3, 2], [3, 3]]
    src: { page: 195, quote: "Has area(s) of disrupted or missing vessels" }
    status: unverified
    tags: [high-yield]
  - id: git.L05.044
    kind: cloze
    topic: nice
    text: "NICE type 1 = most likely {{c1::hyperplastic}}; type 2 = {{c2::adenoma}}; type 3 = {{c3::deep submucosal invasive cancer}}."
    src: { page: 195, quote: "Most likely aie Deep submucosal meee ai invasive cancer" }
    status: unverified
    tags: [high-yield]
  - id: git.L05.045
    kind: card
    topic: nice
    front: Does NICE need magnifying colonoscopes?
    back: No. It can be applied with or without optical (zoom) magnification.
    src: { page: 195, quote: "Can be applied using colonoscopes with of without optical (room) magnification" }
    status: unverified
  - id: git.L05.046
    kind: card
    topic: nice
    front: Which Vienna types does NICE type 2 include?
    back: Vienna types 3, 4 and superficial 5, that is all adenomas with low- or high-grade dysplasia or with superficial submucosal carcinoma.
    src: { page: 195, quote: "Type 2 consists of Vienna classification types 3, 4 and superficial 5 (all adenomas with either low or high grade dysplasia," }
    status: unverified
  - id: git.L05.047
    kind: card
    topic: nice
    front: Within NICE type 2, what suggests high-grade dysplasia or superficial submucosal carcinoma?
    back: An irregular vessel or surface pattern, often with atypical morphology such as a depressed area.
    src: { page: 195, quote: "may be suggested by an irregular vessel or surface pattern, and is often associated with atypical morphology" }
    status: unverified
  - id: git.L05.048
    kind: card
    topic: nice
    front: What may the white structures of NICE type 2 represent?
    back: The pits and the epithelium of the crypt opening.
    src: { page: 195, quote: "These structures (regular or irregular) may represent the pits and the epithelium of the crypt opening." }
    status: unverified
  # ---------- p197-198: detection ----------
  - id: git.L05.049
    kind: card
    topic: detection
    front: How do ENDOCUFF and ENDOCUFF VISION improve adenoma detection?
    back: They attach to the colonoscope tip; flexible arms hold back the colonic folds during withdrawal and open the field of view.
    src: { page: 197, quote: "multiple flexible \"arms\" which opens up the field of view by holding back colonic folds during colonoscope withdrawal." }
    status: unverified
  - id: git.L05.050
    kind: card
    topic: detection
    front: What is special about the PENTAX RetroView colonoscope?
    back: A slim colonoscope with a short turn radius; its 210 degree RetroView shows the proximal side of colon folds and flexures.
    src: { page: 198, quote: "RetroView features of 210° provides visualization and accessibility of the proximal side of colon folds and flexures." }
    status: unverified
  - id: git.L05.051
    kind: card
    topic: detection
    front: What does Third Eye colonoscopy offer?
    back: A backward (retrograde) view to detect and remove polyps hidden behind colonic folds.
    src: { page: 198, quote: "Third Eye Colonoscopy: Offers a backward or retrograde view of the colon, it detects and removes polyps hidden behind the folds" }
    status: unverified
  # ---------- p199-202: polypectomy ----------
  - id: git.L05.052
    kind: enumerate
    topic: polypectomy
    prompt: Mention the methods of colorectal polypectomy.
    points:
      - Cold forceps polypectomy
      - Hot forceps polypectomy
      - Cold snare polypectomy
      - Hot snare polypectomy
      - Endoscopic mucosal resection (EMR)
      - Endoscopic submucosal dissection (ESD)
    pass: 5
    src: { page: 199, quote: "Cold forceps polypectomy Hot forceps polypectomy Cold snare polypectomy Hot snare polypectomy Endoscopic mucosal resection (EMR) Endoscopic submucosal dissection (ESD)" }
    status: unverified
  - id: git.L05.053
    kind: card
    topic: polypectomy
    front: What do "hot" and "cold" mean in polypectomy?
    back: Hot uses the electrosurgery generator unit (ESU); cold is without it.
    src: { page: 199, quote: "Hot‖ refers to techniques using the electrosurgery generator unit (ESU) and ―cold‖ means without use of the ESU." }
    status: unverified
  - id: git.L05.054
    kind: table
    topic: polypectomy
    title: ESGE guideline for superficial sessile or flat colorectal neoplastic polyps
    columns: [Polyp, Technique]
    rows:
      - ["Diminutive, 5 mm or less", Cold snare polypectomy for en bloc resection]
      - ["Small, 5-9 mm", Cold snare polypectomy for en bloc resection]
      - ["10 mm or more", Advanced endoscopic imaging to look for submucosal invasion first]
      - ["Non-invasive, 10-19 mm", "Hot snare polypectomy; consider submucosal injection first"]
      - ["Non-invasive, 20 mm or more", "En bloc EMR for R0; piecemeal EMR if not feasible; over 40 mm or complex: expert centre"]
      - [Suspected superficial submucosal invasion, "Tattoo 3 cm distal; expert centre for en bloc EMR, ESD or surgery"]
      - [Suspected deep submucosal invasion, "Tattoo 3 cm distal; surgical resection"]
    blanks: [[0, 1], [2, 1], [3, 1], [4, 1], [6, 1]]
    src: { page: 201, quote: "Submucosal injection prior to HSP should be considered to reduce the risk of deep thermal injury." }
    status: unverified
    tags: [high-yield]
  - id: git.L05.055
    kind: card
    topic: polypectomy
