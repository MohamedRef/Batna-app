    steps:
      - kind: explain
        page: 142
        title: "الخط الأول للـ high risk"
        quote: "Clinical trial results suggest that hydroxyurea plus aspirin should remain first-line therapy for high-risk patients.\nAnagrelide is a useful second-line agent, but the decision to use concurrent aspirin should depend on the relative risks of arterial thrombosis and hemorrhage in the individual patient."
        text: |
          - ==Hydroxyurea plus aspirin== هو الـ **first-line** للـ high risk (clinical trials).
          - **Anagrelide** = **second-line**. ولو هتديه، الـ aspirin معاه **مش أوتوماتيك**: بتوزن **arterial thrombosis** قصاد **hemorrhage** للمريض ده بالذات.

          ليه الحذر ده مع الـ anagrelide بالذات؟ التفسير المقبول (مش في الكتاب): الاتنين بيضعّفوا شغل الصفائح، فجمعهم بيزوّد النزيف. فلو المريض جلطاته شرايين (stroke، MI) يمكن يستاهل، ولو عنده نزيف قبل كده يبقى لأ.
      - kind: explain
        page: 142
        title: "Interferon-alpha و busulfan"
        quote: "IFN-α can give good control of the platelet count in ET, but its significant side-effect profile, subcutaneous administration and cost prevent its widespread use.\nIt has a clearer role in the management of ET in pregnancy and some favor it in young patients.\nSide-effects include fatigue, flu-like symptoms, depression, autoimmune phenomena.\nThe usual dose range is 3–5 mU three times per week. There is increasing interest in pegylated formulations of interferon, which may be better tolerated.\nBusulfan\nBusulfan can achieve good control of the platelet count but is only rarely used because of concerns over its long-term leukemogenic potential."
        text: |
          **IFN-α**:
          - بيضبط الصفائح كويس، بس الـ **side effects** و **subcutaneous** والـ **cost** بيمنعوا انتشاره.
          - دوره أوضح في ==ET in pregnancy==، وبعضهم بيفضّله في **الصغيرين**.
          - أعراضه: **fatigue، flu-like symptoms، depression، autoimmune phenomena**.
          - **3–5 mU** تلات مرات في الأسبوع؛ والـ **pegylated** يمكن يتحمّل أحسن.

          **Busulfan**: بيضبط الصفائح، بس نادر بسبب **long-term leukemogenic potential** (alkylating agent، افتكر درس التحول).

          ليه الـ IFN للحامل والصغير؟ التفسير المقبول (مش في الكتاب): ده بروتين بيعدّل المناعة ومش بيكسّر الـ DNA زي الـ hydroxyurea والـ busulfan، فمش بيضرّ الجنين ومفيش قلق leukaemia على مدى عمر طويل قدّام الشاب.
      - kind: match
        page: 142
        quote: "Side-effects include fatigue, flu-like symptoms, depression, autoimmune phenomena."
        prompt: "وصّل كل دوا بعلامته المميزة:"
        pairs:
          - ["Hydroxycarbamide", "Leg ulcers and sun-induced skin lesions"]
          - ["Anagrelide", "Palpitations, headache, fluid retention"]
          - ["Interferon-alpha", "Flu-like symptoms, depression, autoimmunity"]
          - ["Busulfan", "Long-term leukemogenic potential"]
        why: "كل دوا بتعرفه من أعراضه: الـ hydroxyurea جلد ورجل، الـ anagrelide قلب وأوعية، الـ interferon (IFN) زي الإنفلونزا والمزاج، والـ busulfan خطر الـ leukemia."
      - kind: explain
        page: 142
        title: "الـ low و الـ intermediate"
        quote: "Low-risk patients are those younger than 40 years old who lack any high-risk features.\nThey are usually given low dose aspirin alone, unless there is a contraindication, such as previous peptic ulceration or allergy to salicylates or with PLT count > 1000× 10⁹/L."
        text: |
          - **Low risk** (تحت 40، مفيش high-risk features): ==low-dose aspirin alone==، إلا لو فيه **peptic ulcer** قديم، أو **salicylate allergy**، أو **platelets >1000**. البديل: **dipyridamole أو clopidogrel** (ص 143).
          - لو فيه **ET-associated hemorrhage**: الأحسن نبعد عن الـ antiplatelets خالص.
          - **Intermediate** (40–60، مفيش high-risk features): **مش واضح** إن تنزيل الصفائح مفيد، فأغلبهم **aspirin لوحده** أو **hydroxycarbamide + aspirin**.

          ليه الـ 1000 بالذات contraindication؟ افتكر الـ **acquired von Willebrand disease (vWD)** من درس المضاعفات: فوق 1000 الـ vWF multimers بتختفي، فالمريض أصلًا بينزف، والـ aspirin هيكمّل عليه.
      - kind: check
        page: 142
        quote: "They are usually given low dose aspirin alone, unless there is a contraindication, such as previous peptic ulceration or allergy to salicylates or with PLT count > 1000× 10⁹/L."
        question: "31-year-old, CALR+ ET, no risk features. Which finding stops you giving aspirin?"
        options: ["Platelets 1,250 × 10⁹/L", "Platelets 620 × 10⁹/L", "CALR rather than JAK2", "Mild splenomegaly"]
        answer: 0
        why:
          - "صح: فوق 1000 الـ aspirin ممنوع (خطر نزيف من acquired vWD)."
          - "ده العادي للـ aspirin في الـ low risk."
          - "نوع الطفرة مش contraindication."
          - "الطحال الصغير شائع في الـ ET ومش بيمنع الـ aspirin."
      - kind: explain
        remind: [hem.L09.081]
        page: 143
        title: "ET والحمل"
        quote: "ET is the MPN encountered most frequently in women of childbearing age, compared to other MPNs.\nIn pregnancy, the commonest complication of ET is first-trimester miscarriage, which occurs in up to 30% of pregnancies, and is thought to reflect placental microinfarcts and insufficiency."
        text: |
          الـ ET هي ==أكتر myeloproliferative neoplasm (MPN) في women of childbearing age== (افتكر الـ **second peak**).
          - أشهر مضاعفة: **first-trimester miscarriage** (لحد **30%**)، والسبب **placental microinfarcts and insufficiency**: نفس الصفائح اللي بتسدّ الأوعية الصغيرة في الطحال بتسدّها في المشيمة.
          - أقل: intrauterine fetal death (IUFD)، growth retardation، premature delivery، pre-eclampsia.
          - خطر الجلطة والنزيف على الأم **أعلى من الحمل العادي**، بس **live birth** حوالي **60%**، ومفيش maternal deaths في review لـ **220** حمل.
          - **Aspirin**: الـ evidence متضاربة، بس أمانه معروف من دراسة pre-eclampsia كبيرة، فأغلبهم ياخدوه لو حامل أو **بتخطط**.
      - kind: reveal
        page: 144
        quote: "Hydroxyurea and anagrelide should not be used on account of their teratogenic potential. Both are excreted in breast milk so that breast-feeding is contraindicated while a patient is receiving either of these agents."
        prompt: "مريضة ET حامل محتاجة cytoreduction. ليه مش hydroxyurea؟ وتقدر ترضع على إيه؟"
        answer: |
          الـ **hydroxyurea والـ anagrelide** الاتنين **teratogenic**، وبيطلعوا في اللبن، فالرضاعة ممنوعة عليهم.

          الحل **IFN-α**: بيطلع في اللبن بس **unlikely to be absorbed intact by the baby**، وفيه تقارير رضاعة ناجحة عليه.
