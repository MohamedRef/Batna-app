      - "**Correlation ≠ causation** حتى لو r = ±1. والـ r بيضلل لو n < 80 (outliers)."
      - "**Case report** = حالة واحدة غريبة. **Case series** = مجموعة بنفس المرض، من غير control، بتولّد hypotheses."
      - "Case report: يكتشف الجديد، بس مايعممش ولا يثبت سبب، وفيه **publication bias**."
      - "**Exploratory** = small-scale، قصير، لما المعرفة قليلة؛ غالبًا in-depth interviews."
