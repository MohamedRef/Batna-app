  - id: git.L07.lesson3
    title: "النزيف الغامض: الـ small bowel المستخبّي"
    hook: "المنظار من فوق ومن تحت سليم والعيان لسه بينزف؟ أهلًا بيك في الـ obscure GI bleeding."
    minutes: 9
    pages: [230, 233]
    topics: [obscure]
    goals:
      - "تعرّف الـ OGIB"
      - "ترتّب الخطوات: second look، capsule، enteroscopy"
      - "تختار الأشعة حسب سرعة النزيف (سؤال كتاب)"
    status: unverified
    steps:
      - kind: explain
        page: 230
        title: "يعني إيه obscure؟"
        quote: "Obscure gastrointestinal bleeding (OGIB) is defined as recurrent or persistent gastrointestinal bleeding from a source that cannot be identified using upper or lower endoscopy"
        text: |
          ==OGIB== = نزيف **recurrent or persistent** مصدره مش باين في الـ **upper ولا lower endoscopy**.

          بيحصل في حوالي **5%** من كل حالات الـ GI bleeding.

          وأول خطوة في الكتاب: **contrast-enhanced helical CT** للـ small bowel (لو مفيش renal failure أو contrast allergy). ولو طلع فيه حاجة ← **deep enteroscopy** (DBE، SBE، spiral) من البُق أو من تحت حسب مكان الـ lesion.
      - kind: explain
        page: 230
        title: "قبل ما تدوّر في الـ small bowel: بُص تاني"
        quote: "Second-look upper endoscopy should be considered in cases of recurrent hematemesis, melena, or a previously incomplete exam."
        text: |
          - **Second-look upper endoscopy:** recurrent hematemesis أو melena، أو الأول كان **incomplete**.
          - **Second-look colonoscopy:** recurrent hematochezia أو شاكك في مصدر تحت.
          - **Push enteroscopy** ممكن تبقى هي الـ second look.

          لو الـ second looks **normal** ← ==small bowel evaluation==.
      - kind: aside
        tone: analogy
        page: 231
        quote: "If the second-look examinations are normal, the next step should be a small bowel evaluation."
        text: |
          زي ما تكون ضيّعت مفاتيحك: قبل ما تقلب البيت كله (الـ small bowel طوله أمتار)، **دوّر تاني في جيوبك** (المعدة والقولون). كتير بتلاقيها هناك.
      - kind: figure
        page: 232
        quote: "Proceed with small bowel evaluation Possible obstruction No obstruction"
        title: "Figure 2: suspected small bowel bleeding"
        alt: "Flowchart. Suspected small bowel bleeding, occult or overt: repeat endoscopy if warranted; if positive treat. If negative proceed to small bowel evaluation: possible obstruction leads to CT or MR enterography, no obstruction leads to capsule endoscopy. A positive test leads to specific management with push or deep enteroscopy, surgery or intraoperative enteroscopy. If negative and further evaluation is warranted, consider repeat endoscopy, capsule, Meckel scan or surgery; if not, observation and iron."
        caption: "الـ fork المهم: **فيه احتمال obstruction؟** آه ← **CTE/MRE** الأول (علشان الكبسولة ما تتحبسش). لأ ← ==VCE==."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L07b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="60" y="5" width="210" height="30" rx="6" class="fg-bad"/>
            <text x="165" y="25" text-anchor="middle" class="t-b">Suspected small bowel bleeding</text>
            <path d="M165 35v15" class="fg-arrow" marker-end="url(#L07b)"/>
            <rect x="60" y="52" width="210" height="30" rx="6" class="fg-box"/>
            <text x="165" y="72" text-anchor="middle" class="t-sm">Repeat endoscopy if warranted</text>
            <text x="280" y="72" class="t-sm t-good">+ treat</text>
            <path d="M165 82v15" class="fg-arrow" marker-end="url(#L07b)"/>
            <text x="172" y="94" class="t-sm t-mut">negative</text>
            <rect x="60" y="100" width="210" height="30" rx="6" class="fg-acc"/>
            <text x="165" y="120" text-anchor="middle" class="t-sm t-b">Small bowel evaluation</text>
            <path d="M75 130 V160" class="fg-arrow" marker-end="url(#L07b)"/>
            <path d="M255 130 V160" class="fg-arrow" marker-end="url(#L07b)"/>
            <text x="82" y="146" class="t-sm t-mut">possible obstruction</text>
            <text x="248" y="158" text-anchor="end" class="t-sm t-mut">no obstruction</text>
            <rect x="15" y="163" width="120" height="34" rx="6" class="fg-box"/>
            <text x="75" y="185" text-anchor="middle" class="t-b">CTE / MRE</text>
            <rect x="195" y="163" width="120" height="34" rx="6" class="fg-good"/>
            <text x="255" y="185" text-anchor="middle" class="t-b">Capsule (VCE)</text>
            <path d="M75 197 L130 240" class="fg-arrow" marker-end="url(#L07b)"/>
            <path d="M255 197 L200 240" class="fg-arrow" marker-end="url(#L07b)"/>
            <rect x="50" y="243" width="230" height="56" rx="6" class="fg-good"/>
            <text x="165" y="263" text-anchor="middle" class="t-sm t-b">Positive: specific management</text>
            <text x="165" y="280" text-anchor="middle" class="t-sm">push or deep enteroscopy,</text>
            <text x="165" y="294" text-anchor="middle" class="t-sm">surgery ± intraoperative enteroscopy</text>
            <rect x="15" y="320" width="300" height="100" rx="6" class="fg-thin"/>
            <text x="25" y="340" class="t-sm t-b">Negative: further evaluation warranted?</text>
            <text x="25" y="360" class="t-sm">Yes: repeat endoscopy, VCE, Meckel scan,</text>
            <text x="25" y="376" class="t-sm">surgery ± intraoperative enteroscopy</text>
            <text x="25" y="400" class="t-sm">No: observation and iron supplements</text>
          </svg>
      - kind: order
        page: 231
        quote: "VCE should be performed before deep enteroscopy to increase diagnostic yield."
        prompt: "عيان occult bleeding ومفيش obstruction. رتّب:"
        steps:
          - "Upper endoscopy and colonoscopy"
          - "Second-look endoscopy when indicated"
          - "Video capsule endoscopy"
          - "Deep enteroscopy to treat what the capsule found"
        why: "الكتاب: الـ **VCE first-line** بعد ما فوق وتحت (والـ second look) يتستبعدوا، والـ VCE **قبل** الـ deep enteroscopy علشان يزوّد الـ yield ويوجّهها."
      - kind: explain
        page: 231
        title: "تفاصيل بيحبّوها في الامتحان"
        quote: "Owing to the lower detection rate of lesions in the duodenum and proximal jejunum with VCE"
        text: |
          - الـ VCE بيشوف أقل في الـ **duodenum والـ proximal jejunum** ← لو شاكك في lesion هناك اعمل **push enteroscopy**.
          - **Total deep enteroscopy** لو الـ suspicion قوي.
          - **Deep enteroscopy أولًا** في الـ **massive hemorrhage** أو لو الـ VCE contraindicated.
          - **Intraoperative enteroscopy:** sensitive جدًا بس invasive، بس لما الـ enteroscopy مش ممكن (عمليات قديمة و adhesions).
          - ==No barium== في الـ small bowel bleeding.
          - **CTE بعد capsule negative**: أحسن في الـ **mural masses** وتحديد مكانها وتوجيه الـ enteroscopy.
      - kind: check
        page: 231
        quote: "Barium study shouldn‘t be used in Small Bowel Bleeding."
        question: "Capsule is negative but small bowel bleeding is still suspected. Which test next, per the book?"
        options:
          - "CT enterography"
          - "Barium follow-through"
          - "Repeat the same capsule the next day"
          - "Plain abdominal film"
        answer: 0
        why:
          - "صح: CTE بعد capsule negative علشان الـ mural masses."
          - "الكتاب قالها صريحة: no barium."
          - "مش هو اللي الكتاب قاله بعد capsule negative."
          - "الـ plain film مالوش دور هنا."
      - kind: table
        page: 232
        quote: "In acute overt GI bleeding and slower rates of bleeding (0.1–0.2 ml/min), or uncertainty if actively bleeding, tagged red blood cell scintigraphy"
        title: "Acute overt bleeding: اختار الأشعة"
        columns: [Situation, Test]
        rows:
          - ["Massive and unstable", "Emergent conventional angiography"]
          - ["Stable, actively bleeding", "Multiphasic CT angiography"]
          - ["Slow (0.1–0.2 ml/min) or unsure", "Tagged RBC scintigraphy"]
          - ["Brisk active bleeding", "CTA rather than CTE"]
          - ["Young, ongoing, capsule and CTE normal", "Meckel scan"]
        hide: [[0, 1], [1, 1], [2, 1], [4, 1]]
      - kind: aside
        tone: tip
        page: 232
        quote: "In younger patients with ongoing overt bleeding and normal testing with capsule endoscopy and enterography examinations, a Meckel‘s scan should be performed."
        text: |
          شاب بينزف وكل حاجة سليمة؟ افتكر ==Meckel's==. الـ Meckel scan بيلقط الـ **ectopic gastric mucosa** اللي جوه الـ diverticulum، وهي اللي بتعمل قرحة وبتنزف. (التفسير ده فسيولوجي؛ الكتاب بيقول اعمل الـ scan.)
      - kind: explain
        page: 232
        title: "العلاج"
        quote: "Endoscopic treatmentis recommended if diagnosis is confirmed. If no diagnosis treatment with oral or IV iron."
        text: |
          - لقيت السبب ← ==endoscopic treatment==.
          - ما لقيتش ← **oral أو IV iron**.
          - النزيف مستمر أو بيرجع ← فكّر في **somatostatin**، **iron**، **antiangiogenesis**.
      - kind: try
        items: [git.L07.056, git.L07.062, git.L07.064, git.L07.068, git.L07.076]
    recap:
      - "OGIB = نزيف مستمر أو متكرر ومصدره مش باين في الـ upper ولا lower endoscopy؛ حوالي 5%."
      - "Second look الأول، وبعدين small bowel evaluation."
      - "VCE first-line (ولو فيه obstruction: CTE/MRE)، وقبل الـ deep enteroscopy إلا لو massive."
      - "No barium. CTE بعد capsule negative."
      - "Unstable: angiography. Stable نشط: CTA. بطيء: tagged RBC. شاب وكله سليم: Meckel scan."
