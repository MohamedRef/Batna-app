  # ------------------------------------------------------------------
  - id: endo.L06.lesson1
    title: "الـ TFTs بتلخبط إمتى؟ والمحور شغال إزاي"
    hook: "التحليل الأشهر في الغدد، وبرضه أسهل تحليل تتلخبط فيه. قبل ما نعرف المطبات، لازم نعرف الطريق."
    minutes: 8
    pages: [99, 101]
    topics: [intro, physiology]
    goals:
      - "تعرف الـ confounders اللي بتلخبط الـ TFTs"
      - "تفهم الـ HPT axis والـ binding proteins والـ deiodinases"
      - "تعرف ليه الـ T3 والـ THRB مهمين للمطبات اللي جاية"
    status: unverified
    steps:
      - kind: explain
        remind: [endo.L06.002]
        page: 99
        quote: "In such cases, certain confounding factors are considered:\n  Pregnancy.\n  Non-thyroidal illness.\n  Medication usage.\n  Laboratory artifact.\n  Rare genetic disorder e.g: resistance to thyroid hormone."
        title: "إمتى الـ TFTs تلخبط؟"
        text: |
          أغلب الـ thyroid function tests (TFTs) سهلة وبتأكد اللي شايفه: euthyroid أو hypo أو hyper. بس في مجموعة مهمة النتيجة:

          - **discordant** مع الصورة الإكلينيكية، أو
          - التحاليل **incongruent** مع بعض.

          ساعتها دوّر على ==confounders==: pregnancy، non-thyroidal illness، أدوية، laboratory artifact، وحاجة genetic نادرة زي **resistance to thyroid hormone**.

          يعني لما التحليل يخالف المريض، ما تصدّقش التحليل على طول. الخمسة دول هم خريطة المحاضرة كلها، وكل واحد منهم ليه درس.
      - kind: mnemonic
        page: 99
        quote: "In such cases, certain confounding factors are considered:\n  Pregnancy.\n  Non-thyroidal illness.\n  Medication usage.\n  Laboratory artifact.\n  Rare genetic disorder e.g: resistance to thyroid hormone."
        word: "PNMLR"
        hook: "الـ confounders: \"Please Never Misread Lab Results\"."
        parts:
          - { key: "P", text: "Pregnancy" }
          - { key: "N", text: "Non-thyroidal illness" }
          - { key: "M", text: "Medication usage" }
          - { key: "L", text: "Laboratory artifact" }
          - { key: "R", text: "Rare genetic disorder (resistance to thyroid hormone)" }
      - kind: explain
        remind: [endo.L06.005]
        page: 100
        quote: "HPT axis physiology and TH action\n  The production is tightly regulated by TRH and TSH.\n  In any given individual T4 and T3 concentrations remain relatively constant throughout life, and reflect the 'set-point' of the (HPT) axis in that individual.\n  In the euthyroid state, the thyroid gland secretes:\n    85–90% T4 and 10–15% T3.\n    Both of which are heavily (>99.5%) protein bound to:\n      TBG.\n      Albumin\n      Transthyretin (prealbumin)."
        title: "الغدة بتطلّع إيه؟"
        text: |
          - الـ T4 والـ T3 عند كل واحد ثابتين طول عمره تقريبًا: ده الـ **set-point** بتاعه.
          - الغدة بتفرز ==85-90% T4== و 10-15% T3.
          - أكتر من **99.5%** متشال على بروتينات: **thyroxine-binding globulin (TBG)**، albumin، transthyretin (prealbumin).
          - الدخول للخلايا (زي المخ) محتاج **monocarboxylate transporter 8 (MCT8)**، وهو كمان اللي بيطلّع الهرمون من الغدة. علشان كده الكتاب بيعدّ «disorders of TH transport» ضمن الحاجات اللي بتلخبط الـ TSH: لو الناقل بايظ، الدم ممكن يبان طبيعي والخلية جعانة.
      - kind: reveal
        page: 100
        quote: "Both of which are heavily (>99.5%) protein bound to:\n  TBG.\n  Albumin\n  Transthyretin (prealbumin)."
        prompt: "أكتر من 99.5% من الهرمون متشال على بروتينات. ليه ده بيعمل مطبات في التحليل؟"
        answer: "لأن الشغال فعلًا هو الـ **free** (أقل من 0.5%)، بس الـ **total** بيتحرك مع كمية البروتين. فلو الـ TBG علي (حمل، oral oestrogen) الـ total يعلى والمريض euthyroid، ولو البروتين قل (عيان، NTI) الـ total يقع. وكمان أي دوا بيزاحم الهرمون على البروتين (heparin، furosemide) بيلخبط قياس الـ free نفسه. كل ده هتشوفه في الدرس الأخير. التفسير المقبول (مش في الكتاب): البروتين ده مخزن بيحمي من التقلبات، علشان كده الـ set-point بتاع كل واحد ثابت طول عمره."
      - kind: figure
        page: 100
        quote: "A further regulation of TH action is provided at a pre-receptor level by a family of intra cellular deiodinases (DIOs)"
        title: "التلات deiodinases"
        alt: "Three boxes. DIO1 in the liver converts T4 to T3 in the periphery. DIO2 converts T4 to T3 in the hypothalamus and pituitary. DIO3 converts T4 to reverse T3 and T3 to T2, limiting hormone action."
        caption: "type 1 deiodinase (DIO1) و type 2 deiodinase (DIO2) بيشغّلوا الهرمون، type 3 deiodinase (DIO3) بيطفّيه. افتكر DIO3 في الـ non-thyroidal illness (NTI) والحمل."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="E06a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="310" height="66" rx="8" class="fg-good"/>
            <text x="20" y="32" class="t-b">DIO1 (liver)</text>
            <text x="20" y="54" class="t-sm">T4</text>
            <path d="M40 50h40" class="fg-arrow" marker-end="url(#E06a)"/>
            <text x="86" y="54" class="t-sm t-b">T3</text>
            <text x="120" y="54" class="t-sm t-mut">peripheral conversion</text>
            <rect x="10" y="88" width="310" height="66" rx="8" class="fg-good"/>
            <text x="20" y="110" class="t-b">DIO2</text>
            <text x="20" y="132" class="t-sm">T4</text>
            <path d="M40 128h40" class="fg-arrow" marker-end="url(#E06a)"/>
            <text x="86" y="132" class="t-sm t-b">T3</text>
            <text x="120" y="132" class="t-sm t-mut">hypothalamus, pituitary</text>
            <rect x="10" y="166" width="310" height="76" rx="8" class="fg-bad"/>
            <text x="20" y="188" class="t-b t-bad">DIO3 (inactivates)</text>
            <text x="20" y="210" class="t-sm">T4 → reverse T3</text>
            <text x="20" y="230" class="t-sm">T3 → T2</text>
            <text x="170" y="220" class="t-sm t-mut">limits TH action</text>
          </svg>
      - kind: explain
        page: 100
        quote: "A further regulation of TH action is provided at a pre-receptor level by a family of intracellular deiodinases (DIOs)"
        title: "ليه الـ deiodinases مهمة للتحليل؟"
        text: |
          الـ deiodinases بتظبط شغل الهرمون **قبل الـ receptor** (pre-receptor)، يعني جوه الخلية نفسها:
          - **DIO1** في الكبد: بيحوّل T4 لـ T3 في الأطراف.
          - **DIO2**: بيحوّل T4 لـ T3 في الـ **hypothalamus والـ pituitary**. علشان كده الـ pituitary بيحس بالـ T4 اللي في الدم عن طريق الـ T3 اللي بيعمله لنفسه.
          - **DIO3**: بيحوّل T4 لـ **reverse T3** و T3 لـ T2، يعني بيطفّي الهرمون (limitation of TH action).

          ده بيفسّر حاجات جاية: الـ **amiodarone** بيقفل الـ DIO1 فالـ FT4 يعلى والـ FT3 طبيعي، والـ **NTI** بيغيّر الـ deiodinases فالـ rT3 يعلى، والـ **placenta** فيها DIO3 كتير في الحمل.
      - kind: explain
        page: 101
        quote: "2 thyroid hormone receptor genes (THRA, THRB) exist on chromosomes 17 and 3 respectively."
        title: "الـ receptor"
        text: |
          الـ ==T3== هو الـ principal bioactive hormone، وبيشتغل على **nuclear receptor (TR)**.

          - جينين: **THRA** على chromosome 17 و **THRB** على chromosome 3.
          - الـ splicing بيدّي thyroid hormone receptor alpha-1 (TRα1)، thyroid hormone receptor alpha-2 (TRα2)، thyroid hormone receptor beta-1 (TRβ1)، thyroid hormone receptor beta-2 (TRβ2)، وكل واحد في أنسجة مختلفة.
          - الـ **THRB** هو اللي بيتغيّر في الـ resistance to thyroid hormone.
      - kind: check
        page: 101
        quote: "2 thyroid hormone receptor genes (THRA, THRB) exist on chromosomes 17 and 3 respectively."
        question: "Which thyroid hormone receptor gene is mutated in resistance to thyroid hormone, and on which chromosome?"
        options: ["THRB, chromosome 3", "THRA, chromosome 17", "THRB, chromosome 17", "MCT8, chromosome 3"]
        answer: 0
        why:
          - "صح: THRB على chromosome 3، وده اللي بيتدور عليه في الـ RTH (ص 106 و 109)."
          - "الـ THRA على 17، بس مش هو جين الـ RTH في الكتاب."
          - "الـ THRB على 3 مش 17."
          - "الـ MCT8 transporter مش receptor."
      - kind: try
        items: [endo.L06.002, endo.L06.004, endo.L06.005, endo.L06.007, endo.L06.075]
    recap:
      - "الـ confounders: pregnancy، NTI، أدوية، lab artifact، RTH."
      - "85-90% T4، وأكتر من 99.5% bound على TBG و albumin و transthyretin؛ الـ free هو الشغال."
      - "MCT8 بيدخّل الهرمون الخلية وبيطلّعه من الغدة."
      - "DIO1 و DIO2: T4 → T3. DIO3: T4 → rT3 و T3 → T2."
      - "T3 = الهرمون الفعّال على الـ nuclear TR؛ THRA (17) و THRB (3)."
    practice: [endo.L06.001, endo.L06.002, endo.L06.003, endo.L06.004, endo.L06.005, endo.L06.006, endo.L06.007, endo.L06.008, endo.L06.009, endo.L06.075]
