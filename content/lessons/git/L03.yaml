          </svg>
      - kind: match
        page: 87
        quote: "Table 2.Functional Gastrointestinal Disorders: Disorders of Gut-Brain Interaction"
        prompt: "وصّل كل حرف بالـ domain بتاعه:"
        pairs:
          - ["A", "Esophageal disorders"]
          - ["B", "Gastroduodenal disorders"]
          - ["C", "Bowel disorders"]
          - ["D", "Centrally mediated GI pain"]
          - ["E", "Gallbladder and sphincter of Oddi"]
