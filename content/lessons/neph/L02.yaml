      - kind: aside
        page: 32
        quote: "2.1. Monitoring/yr for progression of CKD\nCKD is classified based on: Cause (C); GFR (G); Albuminuria (A)\n| GFR categories (ml/min/1.73 m2) | Description and range | | A1: Normal to mildly increased (< 30 mg/g; < 3 mg/mmol) | A2: Moderately increased (30–299 mg/g; 3–29 mg/mmol) | A3: Severely increased (≥ 300 mg/g; ≥ 30 mg/mmol) |\n| G1 | Normal or high | ≥ 90 | Screen 1 | Treat 1 | Treat 3 |\n| G2 | Mildly decreased | 60–89 | Screen 1 | Treat 1 | Treat 3 |\n| G3a | Mildly to moderately decreased | 45–59 | Treat 1 | Treat 2 | Treat 3 |\n| G3b | Moderately to severely decreased | 30–44 | Treat 2 | Treat 3 | Treat 3 |\n| G4 | Severely decreased | 15–29 | Treat* 3 | Treat* 3 | Treat 4+ |\n| G5 | Kidney failure | < 15 | Treat 4+ | Treat 4+ | Treat 4+ |\nGreen: Low risk (if no other markers of kidney disease, no CKD); Yellow: Moderately increased risk; Orange: High risk; Red: Very high risk"
        tone: trap
        text: "**G1A1 و G2A1** من غير أي marker تاني = **مش CKD**. ماتكتبش \"CKD stage 2\" لمجرد إن الـ estimated glomerular filtration rate (eGFR) 75."
