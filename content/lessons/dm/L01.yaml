      - kind: check
        page: 12
        quote: "1- Autoimmune:\n  Rapidly progressive young.\n  Slowly progressive LAD A (Late onset Autoimmune Diabetes in the Adulthood)."
        question: "42-year-old non-obese man on tablets for a year now needs insulin; GAD antibodies positive. Diagnosis?"
        options: ["LADA", "Rapidly progressive type 1", "Obese type 2", "MODY"]
