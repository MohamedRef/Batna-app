- id: hb.L09.042
  kind: calc
  topic: diagnosis
  calculator: saag
  stem: A 55-year-old with HCV cirrhosis has new grade 2 ascites. Serum albumin 2.9 g/dL, ascitic albumin 1.1 g/dL,
