      - kind: explain
        page: 142
        quote: "Despite the majority of people have clinical symptoms comparable to other liver illnesses, some may develop systemic hypersensitivity symptoms. The treatment for liver impairment caused by drugs and herbal remedies is quick drug withdrawal combined with supportive care to reduce uncomfortable symptoms."
        title: "الخلاصة والمستقبل"
        text: |
          - الـ **hepatotoxicity** side effect لكل العلاجات تقريبًا، وأغلبها **benign** وبيتحسن بعد وقف الدوا.
          - العلاج: **quick drug withdrawal + supportive care**.
          - **Future prospects**: **new biomarkers**، **unresolved issues**، و **unmet needs**: epidemiology (big data، العبء الاقتصادي، herbal and dietary supplements)، pathogenesis (إيه اللي بيكشف أو بيمنع الإصابة)، diagnosis and outcome (markers تفرّق الإنزيمات اللي هتروح لوحدها من اللي هتقلب DILI، وتتوقع الـ acute liver failure (ALF))، therapy (**randomised controlled trials (RCTs)**)، و prediction (**algorithms** للـ drug–host factors).
