    src: { page: 40, quote: "During pre-placement examination of 200 new employees , 20 persons were hypertensive among 80 smokers while 6 hypertensive persons were detected among the remainder non-smoker employees.\n  a) Cross sectional\n  b) Case control\n  c) Correlation study\n  d) Prospective cohort\n  e) Retrospective cohort" }
