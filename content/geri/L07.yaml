ving (A.D.L's) | Observed risk-taking behaviours, or reported from referrer / previous facility; Observed unsafe use of equipment; Unsafe footwear / inappropriate clothing |\n| Environment | Difficulties with orientation to environment i.e. areas between bed / bathroom / dining room |\n| Nutrition | Underweight / low appetite |\n| Continence | Reported or known urgency / nocturia / accidents |\n| Other | |" }
