      - kind: explain
        page: 100
        title: "ليه مفتاحين، وليه فرامل؟"
        quote: "The T cell is activated through interaction of its TCR with the presented antigen and the co-stimulation of the B7-2-CD28 interaction."
        text: |
          الـ T cell محتاجة إشارتين عشان تتنشّط:
          1. الـ **TCR** يشوف الـ antigen على الـ MHC.
          2. **Costimulation**: الـ ==B7-2 على الـ APC يمسك CD28== على الـ T cell.

          ليه اتنين؟ التفسير المقبول (مش في الكتاب): الـ APC ما بتزوّدش الـ B7 غير لما تحس بخطر حقيقي (افتكر الـ **Toll receptors** في ص 86). فالإشارة التانية معناها "ده عدو بجد، مش بروتين عادي من الجسم". من غيرها الخلية بتتقفل (**anergy**).

          وبعد التنشيط الخلية **بنفسها** بتطلّع **CTLA-4**، يمسك **B7-1** ويدّي **off signal**. يعني الفرامل بتتركّب مع البنزين، عشان الرد ما يفضلش شغال للأبد ويتحول لالتهاب مزمن.
