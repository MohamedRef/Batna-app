  topic: care
  prompt: Outline the standards of care in ALF.
  outline:
  - Neurological:
    - Monitor mental status; ICU at stage 2 HE; avoid sedatives; head CT/MRI
    - 'Stage 3: intubate, ICP monitor; ICP <40, CPP 60–100; hypertonic saline to Na 145–155'
    - 'ICP >20 or CPP <60: head 20°, PaCO2 25, mannitol 0.5 g/kg; barbiturates if refractory'
  - Infection and coagulation:
    - Periodic blood cultures, low threshold for antimicrobials
    - Correct coagulopathy only for bleeding/procedures (FFP first)
  - Metabolic and hemodynamic:
    - Avoid hypotonic fluids; norepinephrine; dextrose to glucose 100–200 mg/dL
    - RRT if needed; enteral protein 1–1.5 g/kg/day
  - Specific therapy:
    - NAC (acetaminophen, and early HE of any cause), nucleoside analogs for HBV, acyclovir for HSV, plasmapheresis
      + D-penicillamine for Wilson
    - Plasma exchange; early transplant referral
