            <text x="85" y="104" text-anchor="middle" class="t-sm t-b">Early stage</text>
            <text x="85" y="124" text-anchor="middle" class="t-sm">watch until</text>
            <text x="85" y="142" text-anchor="middle" class="t-sm">it progresses</text>
            <rect x="170" y="82" width="150" height="70" rx="10" class="fg-bad"/>
            <text x="245" y="104" text-anchor="middle" class="t-sm t-b">Rai III or IV</text>
