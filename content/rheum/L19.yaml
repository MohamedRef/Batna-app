items:
  # ---------- p309-310: definition and epidemiology ----------
  - id: rheum.L19.001
    kind: card
    topic: definition
    front: Define systemic lupus erythematosus.
    back: A chronic relapsing inflammatory multisystem autoimmune disorder of connective tissue, characterized by involvement of the skin, joints and serosal membranes.
    src: { page: 309, quote: "Chronic relapsing inflammatory, multisystem autoimmune disorder of connective tissue characterized by involvement of the skin, joints and serosal membranes." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L19.002
    kind: card
    topic: definition
    front: Where is SLE prevalence highest worldwide, per the lecture?
    back: Italy, Spain, Martinique, and the UK Afro-Caribbean population.
    src: { page: 309, quote: "Highest in Italy, Spain, Martinique, and the United Kingdom Afro- Caribbean population." }
    status: unverified
  - id: rheum.L19.003
    kind: card
    topic: definition
    front: What does the low rate of SLE in black people in Africa, but high rate in black people in the UK, suggest?
    back: An environmental trigger as well as a genetic basis for the disease.
    src: { page: 309, quote: "suggesting that there may be an environmental trigger, as well as a genetic basis, for disease in the UK population." }
    status: unverified
  - id: rheum.L19.004
    kind: cloze
    topic: definition
    text: "SLE is highest ({{c1::1:250}}) in {{c2::African/Caribbean}} women, followed by Asian women, then white women."
    src: { page: 309, quote: "Highest (1:250) in African/Carribbean women followed by Asian women then white women." }
    status: unverified
    tags: [numbers]
  - id: rheum.L19.005
    kind: cloze
    topic: definition
    text: "More than {{c1::90%}} of SLE cases are women (F:M {{c2::9:1}}), frequently in childbearing age ({{c3::20–40}} years)."
    src: { page: 309, quote: "> 90% cases of SLE occur in women 9:1. - Frequently during childbearing age (20-40years)." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L19.006
    kind: cloze
    topic: definition
    text: "{{c1::20%}} of SLE cases are diagnosed during the first {{c2::2 decades}} of life."
    src: { page: 309, quote: "20% of cases diagnosed during 1st 2 decades of life." }
    status: unverified
    tags: [numbers]
  - id: rheum.L19.007
    kind: card
    topic: definition
    front: In which men is SLE risk similar to that of women, and which groups of women have a risk similar to men?
    back: Men with Klinefelter syndrome (XXY) have a female-level risk; the risk in men is similar to that of prepubertal and postmenopausal women.
    src: { page: 310, quote: "Risk of men is similar to pre-pubertal / postmenopausal women. - Common with men with Klinefleter syndrome (XXY)." }
    status: unverified
  # ---------- p310-311: genetics ----------
  - id: rheum.L19.008
    kind: card
    topic: genetics
    front: What was the first described genetic link to SLE, and what risk does it carry?
    back: The HLA (MHC on chromosome 6); carriage of specific HLA alleles gives about a 2-fold risk above the general population.
    src: { page: 310, quote: "Carriage of specific alleles of HLA imparts about a 2-fold risk of SLE above that of the general population." }
    status: unverified
  - id: rheum.L19.009
    kind: cloze
    topic: genetics
    text: "The most consistent HLA risk alleles for SLE in Caucasians are the class II {{c1::HLA-DR2}} (DRB1*1501) and {{c2::HLA-DR3}} (DRB1*0301)."
    src: { page: 310, quote: "The class II alleles HLA-DR2 (DRB1*1501) and HLADR3 (DRB1*0301) have been the most consistent genetic risk factors associated with SLE" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L19.010
    kind: card
    topic: genetics
    front: Which HLA alleles show strong associations with SLE autoantibodies?
    back: HLA-DQ and HLA-DR alleles.
    src: { page: 310, quote: "HLA-DQ and –DR alleles show strong associations with SLE autoantibodies." }
    status: unverified
  - id: rheum.L19.011
    kind: table
    topic: genetics
    title: Complete early complement deficiency and SLE (book figures)
    columns: [Deficient component, Develop SLE]
    rows:
      - [C1q, "90%"]
      - [C2, "75%"]
      - [C4, "10%"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 310, quote: "Complete deficiency of the early complement components C2, C4, and C1q results in SLE in 75%, 10%, and 90% of cases, respectively." }
    status: unverified
    tags: [numbers]
    update:
      text: "Most reviews give the reverse for C2 and C4: about 75% of complete C4 deficiency and about 10–30% of C2 deficiency develop SLE (C1q stays about 90%). Answer the exam with the book's figures."
      ref: "Macedo & Isaac, Frontiers in Immunology 2016 (early classical-pathway deficiencies and SLE)"
  - id: rheum.L19.012
    kind: card
    topic: genetics
    front: How does C4 gene copy number affect SLE risk?
    back: A low C4 copy number is a risk factor; a high copy number is protective. (Complete complement deficiencies are rare and explain only a tiny share of SLE.)
    src: { page: 310, quote: "a low gene copy number of C4 is seen as a risk factor for SLE, whereas a high copy number of C4 is protective" }
    status: unverified
  - id: rheum.L19.013
    kind: cloze
    topic: genetics
    text: "Men with SLE have {{c1::15}} times the risk of Klinefelter syndrome (47,XXY), and SLE risk in 47,XXY men {{c2::equals that of women}}."
    src: { page: 310, quote: "men with SLE have 15 times the risk of Klinefelter syndrome (47, XXY) as compared with the average population" }
    status: unverified
    tags: [numbers]
  - id: rheum.L19.014
    kind: card
    topic: genetics
    front: What do Klinefelter (XXY) and 47,XXX data suggest about why women get SLE?
    back: The predisposition relates to X chromosome copy number, not to sex or sex hormones.
    src: { page: 311, quote: "the predisposition of women to developing SLE is related to X chromosome copy number, not to sex or sex hormones." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L19.015
    kind: cloze
    topic: genetics
    text: "SLE concordance is {{c1::24–35%}} in monozygotic twins vs {{c2::2–5%}} in dizygotic twins; {{c3::10–12%}} of patients have an affected first- or second-degree relative."
    src: { page: 311, quote: "concordance in monozygotic twins is 24%-35%, compared to 2%–5% in dizygotic twin pairs." }
    status: unverified
    tags: [numbers]
  - id: rheum.L19.016
    kind: mcq
    topic: genetics
    stem: A 24-year-old man is diagnosed with SLE. Karyotype is requested. Which finding would best explain his female-level risk?
    options:
      - 47,XXY
      - 45,X
      - 47,XYY
      - Trisomy 21
      - 46,XY with HLA-B27
    answer: 0
    why:
      - "Correct: men with SLE have 15 times the risk of Klinefelter (47,XXY), and XXY men have a female-level risk, pointing to X chromosome dose (p310-311)."
      - Turner (one X) would lower, not raise, X dose.
      - An extra Y does not add an X.
      - Not discussed as an SLE risk.
      - HLA-B27 is a spondyloarthritis marker, not an SLE risk allele.
    src: { page: 310, quote: "the risk of SLE among men with 47, XXY is equal to that of women." }
    status: unverified
  # ---------- p311-312: environment and hormones ----------
  - id: rheum.L19.017
    kind: enumerate
    topic: environment
    prompt: List the environmental triggers of lupus in the lecture.
    points:
      - Ultraviolet light (sunlight)
      - Stress
      - Drugs
      - Virus (EBV)
      - Silica dust
      - High-caloric diet
    pass: 5
    src: { page: 311, quote: "Ultraviolet (sunlight). • Stress. • Drugs (hlorpromazine, hydralazine, isoniazid, methyldopa, procainamide). • Virus (EBV). • Exposure to silica dust." }
    status: unverified
  - id: rheum.L19.018
    kind: card
    topic: environment
    front: How does ultraviolet light trigger lupus, and how many patients are UV sensitive?
    back: UV stimulates keratinocytes to secrete cytokines that increase autoantibody production; about two-thirds of people with lupus are UV sensitive.
    src: { page: 311, quote: "Ultraviolet light stimulates keratinocytes, which leads to the secretion of cytokines that simulate increased autoantibody production." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L19.019
    kind: enumerate
    topic: environment
    prompt: Which viruses are linked to SLE in the lecture?
    points:
      - EBV
      - Cytomegalovirus
      - Parvovirus B19
      - Hepatitis B virus
      - Human endogenous retroviruses
    pass: 4
    src: { page: 311, quote: "EBV. - Cytomegalovirus. - Parvovirus B19. - Hepatitis B virus. - Human endogenous retroviruses." }
    status: unverified
  - id: rheum.L19.020
    kind: cloze
    topic: environment
    text: "Women with a BMI greater than {{c1::21 kg/m2}} tended to have a greater SLE risk than women with lower BMI."
    src: { page: 312, quote: "Women with a body mass index (BMI) greater than 21 kg/m2 tended to have a greater risk of SLE" }
    status: unverified
    tags: [numbers]
  - id: rheum.L19.021
    kind: table
    topic: environment
    title: Drugs linked to lupus (p312)
    columns: [Group, Drugs]
    rows:
      - [Antihypertensives, "Hydralazine, methyldopa, captopril"]
      - [Antiarrhythmics, "Procainamide, quinidine"]
      - [Anti-inflammatories, "Penicillamine, sulfasalazine"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 312, quote: "Anti hypertension - Hydralazine, methyldopa, and captopril. - Anti arrhythmics - Procainamide and quinidine." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L19.022
    kind: card
    topic: environment
    front: Besides the drug classes, which drugs does the trigger list name (p311)?
    back: Chlorpromazine, hydralazine, isoniazid, methyldopa and procainamide.
    src: { page: 311, quote: "Drugs (hlorpromazine, hydralazine, isoniazid, methyldopa, procainamide)." }
    status: unverified
  - id: rheum.L19.023
    kind: card
    topic: environment
    front: What role do smoking and stress play in SLE?
    back: Smokers have a greater SLE risk than non-smokers; females are more vulnerable to stress.
    src: { page: 312, quote: "Smokers tend to have a greater risk of SLE compared with non‐smokers. - Females are more vulnerable to stress." }
    status: unverified
  - id: rheum.L19.024
    kind: card
    topic: environment
    front: Which observations suggest that estrogen plays a role in SLE?
    back: SLE is more prevalent during the reproductive years, and symptoms worsen in pregnancy and with menstrual periods.
    src: { page: 312, quote: "Women experience worsening of symptoms during pregnancy and with their menstrual periods." }
    status: unverified
  - id: rheum.L19.025
    kind: mcq
    topic: environment
    stem: "Among the following, which is not related to drug-induced lupus?"
    options: [Methyldopa, Hydralazine, Methyl folate, Procainamide]
    answer: 2
    why:
      - Methyldopa is an antihypertensive linked to lupus (p311-312).
      - Hydralazine is an antihypertensive linked to lupus (p311-312).
      - "Correct: methyl folate is a vitamin, not on the book's drug list."
      - Procainamide is an antiarrhythmic linked to lupus (p311-312).
    src: { page: 312, quote: "Anti hypertension - Hydralazine, methyldopa, and captopril. - Anti arrhythmics - Procainamide and quinidine." }
    status: unverified
    tags: [book-question]
  - id: rheum.L19.026
    kind: mcq
    topic: environment
    stem: "All are risk factors for the development of SLE except:"
    options: [Obesity, Infection with HCV, Low C1q, "HLA-DR2, HLA-DR3"]
    answer: 1
    why:
      - "A risk: BMI above 21 kg/m2 raises SLE risk (p312)."
      - "Correct: HCV is not among the book's viruses (EBV, CMV, parvovirus B19, HBV, endogenous retroviruses) (p311)."
      - "A risk: complete C1q deficiency gives SLE in 90% (p310)."
      - "A risk: the most consistent HLA alleles in Caucasians (p310)."
    src: { page: 311, quote: "EBV. - Cytomegalovirus. - Parvovirus B19. - Hepatitis B virus. - Human endogenous retroviruses." }
    status: unverified
    tags: [book-question]
  - id: rheum.L19.027
    kind: mcq
    topic: environment
    stem: A 62-year-old man treated for years with procainamide develops arthralgia, pleurisy and a positive ANA. Which drug group does the lecture put procainamide in?
    options:
      - Antiarrhythmics, with quinidine
      - Antihypertensives, with captopril
      - Anti-inflammatories, with sulfasalazine
      - Antituberculous drugs, with isoniazid
      - Antipsychotics, with chlorpromazine
    answer: 0
    why:
      - "Correct: procainamide and quinidine are the antiarrhythmics (p312)."
      - Captopril sits with hydralazine and methyldopa as antihypertensives.
      - Sulfasalazine sits with penicillamine as anti-inflammatories.
      - Isoniazid is on the trigger list but is not procainamide's group.
      - Chlorpromazine is on the trigger list but is not procainamide's group.
    src: { page: 312, quote: "Anti arrhythmics - Procainamide and quinidine." }
    status: unverified
  # ---------- p312-314: immunology and pathogenesis ----------
  - id: rheum.L19.028
    kind: card
    topic: immunology
    front: What B-cell defects underlie SLE?
    back: Loss of B-cell tolerance, B-cell dysregulation and autoantibody production; immune stimulation plus impaired regulation expands B cells polyclonally.
    src: { page: 312, quote: "associated with the loss of B-cell tolerance, B-cell dysregulation and autoantibody production." }
    status: unverified
  - id: rheum.L19.029
    kind: card
    topic: immunology
    front: How do SLE autoantibodies injure tissue?
    back: They form antibody–nuclear antigen immune complexes that deposit in tissues and trigger local inflammation.
    src: { page: 313, quote: "These antibodies form antibody-nuclear antigen immune complexes, which deposit in tissues and trigger local inflammation" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L19.030
    kind: enumerate
    topic: immunology
    prompt: List the T-cell abnormalities in SLE.
    points:
      - Abnormal signaling with secretion of proinflammatory cytokines
      - Low regulatory T cells with impaired suppression
      - Decreased cytotoxic and suppressor T cells
    pass: 3
    src: { page: 313, quote: "Regulatory T cells have been shown to be low in SLE and their suppressive function impaired." }
    status: unverified
  - id: rheum.L19.031
    kind: card
    topic: immunology
    front: What apoptosis abnormality is characteristic of SLE?
    back: Increased apoptosis with defective clearance of apoptotic material; lupus autoantigens cluster in surface blebs of apoptotic cells, increasing their immune exposure.
    src: { page: 314, quote: "Increased apoptosis and defective clearance of apoptotic material are characteristic of the mouse-model of lupus and human SLE." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L19.032
    kind: order
    topic: immunology
    prompt: Order the steps of SLE pathogenesis in the lecture.
    steps:
      - Genetically susceptible person meets an environmental trigger
      - Apoptosis of lymphoid cells releases DNA constituents
      - T lymphocytes stimulate B cells
      - Autoantibodies are produced against these constituents
    src: { page: 314, quote: "Apoptosis (programmed cell death) of lymphoid cells leads to release of DNA constituents" }
    status: unverified
  - id: rheum.L19.033
    kind: card
    topic: immunology
    front: How do triggering factors expose hidden antigens in SLE?
    back: They increase oxidative stress and apoptosis, so previously hidden antigens appear on the cell surface and become immunogenic.
    src: { page: 314, quote: "Triggering factors may increase oxidative stress with subsequent apoptosis with expression of previously hidden antigens on cell surface" }
    status: unverified
  - id: rheum.L19.034
    kind: card
    topic: pathology
    front: What is fibrinoid in SLE, and where is it found?
    back: Eosinophilic material along blood vessels and tissue fibres, in a disease of widespread immune complex deposition, inflammation and vasculitis.
    src: { page: 314, quote: "Fibrinoid (eosinophilic material) is found along blood vessels and tissue fibres." }
    status: unverified
  # ---------- p315: antibodies ----------
  - id: rheum.L19.035
    kind: table
    topic: antibodies
    title: Autoantibodies, associated diseases and prevalence (p315)
    columns: [Antibody, Associated diseases, Prevalence]
    rows:
      - [Anti-dsDNA, "SLE; increased risk of lupus nephritis", "70%"]
      - [Anti-histone, Drug-induced LE, "–"]
      - [Anti-centromere, "Limited systemic sclerosis; primary biliary cholangitis", "70%"]
      - [Anti-Sm, "SLE; associated with CNS and kidney disease", "10–25%"]
      - [Anti-U1-RNP, "SLE; mixed CTD; overlap syndrome", "30%"]
      - [Anti-topoisomerase-1, Diffuse cutaneous systemic sclerosis, "30%"]
      - [Antiphospholipid, "SLE; antiphospholipid syndrome; abortions", "10–30%"]
    blanks: [[0, 1], [0, 2], [1, 1], [2, 1], [3, 1], [5, 1], [6, 2]]
    src: { page: 315, quote: "Anti dsDNA 70 % Increased risk for Lupus Nephritis Anti-histone Drug Induced LE" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L19.036
    kind: card
    topic: antibodies
    front: Which lupus antibody raises the risk of lupus nephritis?
    back: Anti-dsDNA (present in about 70%).
    src: { page: 315, quote: "Anti dsDNA 70 % Increased risk for Lupus Nephritis" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L19.037
    kind: card
    topic: antibodies
    front: Which antibody marks drug-induced lupus?
    back: Anti-histone.
    src: { page: 315, quote: "Anti-histone Drug Induced LE" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L19.038
    kind: cloze
    topic: antibodies
    text: "Anti-Sm is found in {{c1::10–25%}} of SLE and is associated with {{c2::CNS and kidney}} disease."
    src: { page: 315, quote: "associated with CNS and kidney diseases" }
    status: unverified
    tags: [numbers]
  - id: rheum.L19.039
    kind: card
    topic: antibodies
    front: With which conditions does the lecture link anti-Ro (SS-A) and anti-La (SS-B)?
    back: Systemic sclerosis and primary Sjögren; also found in coeliac disease, polymyositis and cardiac neonatal lupus.
    src: { page: 315, quote: "Primary Sjogren 40-60% Also found in Anti-Ro (SS-A) 60-90% coeliac disease, polymyositis Anti-La (SS-B) 15% cardiac neonatal lupus erythematosus" }
    status: unverified
  - id: rheum.L19.040
    kind: card
    topic: antibodies
    front: Which antibody is linked to diffuse cutaneous systemic sclerosis, and how often?
    back: Anti-topoisomerase-1 (30%). Anti-centromere (70%) goes with limited systemic sclerosis.
    src: { page: 315, quote: "Anti-topoisomerase-1 Diffuse Cutaneous Systemic Sclerosis 30%" }
    status: unverified
  - id: rheum.L19.041
    kind: mcq
    topic: antibodies
    stem: A 28-year-old woman with SLE has rising anti-dsDNA titres and new proteinuria. Which complication does this antibody most point to?
    options:
      - Lupus nephritis
      - Drug-induced lupus
      - Congenital heart block in pregnancy
      - Diffuse cutaneous systemic sclerosis
      - Primary biliary cholangitis
    answer: 0
    why:
      - "Correct: anti-dsDNA (70%) carries an increased risk for lupus nephritis (p315)."
      - Drug-induced lupus is marked by anti-histone.
      - Neonatal heart block is linked to anti-Ro and anti-La.
      - Diffuse SSc is marked by anti-topoisomerase-1.
      - Primary biliary disease is linked to anti-centromere in the table.
    src: { page: 315, quote: "Anti dsDNA 70 % Increased risk for Lupus Nephritis" }
    status: unverified
  - id: rheum.L19.042
    kind: mcq
    topic: antibodies
    stem: Which autoantibody in the lecture is associated with both SLE and mixed connective tissue disease and overlap syndrome?
    options:
      - Anti-U1-RNP
      - Anti-centromere
      - Anti-topoisomerase-1
      - Anti-histone
      - Anti-Sm
    answer: 0
    why:
      - "Correct: anti-U1-RNP (30%) is linked to SLE, mixed CTD and overlap syndrome (p315)."
      - Anti-centromere is limited SSc and primary biliary disease.
      - Anti-topoisomerase-1 is diffuse cutaneous SSc.
      - Anti-histone is drug-induced LE.
      - Anti-Sm is SLE with CNS and kidney disease.
    src: { page: 315, quote: "Anti-U1-RNP mixed CT diseases 30%" }
    status: unverified
  # ---------- p315-316: pathology ----------
  - id: rheum.L19.043
    kind: enumerate
    topic: pathology
    prompt: List the basic pathological features of SLE.
    points:
      - Inflammation
      - Band or occlusive vasculopathy
      - Vasculitis
      - Immune complex deposition
    pass: 4
    src: { page: 315, quote: "a. Inflammation. b. Band or Occlusive Vasculopathy. c. Vasculitis. d. Immune complex deposition." }
    status: unverified
  - id: rheum.L19.044
    kind: card
    topic: pathology
    front: Which organ has the best characterized pathology in SLE, and what does light or immunofluorescence microscopy show?
    back: The kidney; mesangial cell proliferation, fibrinoid necrosis, inflammation and immune complex (Ig or complement) deposition.
    src: { page: 316, quote: "Best characterized organ pathology is in KIDNEY." }
    status: unverified
  - id: rheum.L19.045
    kind: card
    topic: pathology
    front: Where does electron microscopy show immune complexes in lupus kidney?
    back: In the mesangium and on the subendothelial and subepithelial surfaces of the basement membrane.
    src: { page: 316, quote: "Immune complex deposition seen in mesangium & subendothelial/subepithelial surface of basement membrane." }
    status: unverified
  # ---------- p316-317: skin and musculoskeletal ----------
  - id: rheum.L19.046
    kind: enumerate
    topic: skin-msk
    prompt: List the dermatologic manifestations of SLE.
    points:
      - Cutaneous vascular lesions
      - Photosensitivity
      - Butterfly (malar) rash
      - Oral or nasopharyngeal ulcers
      - Alopecia
    pass: 4
    src: { page: 316, quote: "Cutaneous vascular lesions. - Photosensitivity. - Butterfly rash (Malar Rash). - Oral/nasopharyngeal ulcers. - Alopecia." }
    status: unverified
  - id: rheum.L19.047
    kind: card
    topic: skin-msk
    front: Describe the malar rash of SLE.
    back: A constant red rash over the cheek bones that spares the nasolabial folds; called a butterfly rash for its mask-like shape.
    src: { page: 316, quote: "A constant red, rash over the cheek bones that spares the natural crease between the nose and corner of the mouth (nasolabial fold)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L19.048
    kind: card
    topic: skin-msk
    front: Describe the discoid rash of SLE.
    back: Red to violaceous raised patches anywhere on the skin, acute or chronic; chronic lesions may cause decreased pigmentation and scarring. Usually painless.
    src: { page: 316, quote: "Red to violaceous raised patches that can occur anywhere on the skin." }
    status: unverified
  - id: rheum.L19.049
    kind: table
    topic: skin-msk
    title: Mucocutaneous criteria and their definitions (p316)
    columns: [Criterion, Definition]
    rows:
      - [Malar rash, "Constant red rash over the cheek bones sparing the nasolabial folds (butterfly)"]
      - [Discoid rash, "Red to violaceous raised patches; chronic ones may depigment and scar; painless"]
      - [Photosensitivity, "Rash after sunlight, by history or physician observation"]
      - [Oral ulcers, "Physician-observed oral or nasopharyngeal ulcers, usually painless"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 316, quote: "Physician-observed mouth (oral) or throat (nasopharyngeal) ulcers. Such ulcers are usually painless." }
    status: unverified
  - id: rheum.L19.050
    kind: card
    topic: skin-msk
    front: "Raynaud phenomenon in lupus: how common, how specific, and what is it?"
    back: Common in lupus but nonspecific; a triphasic reaction of distal digits to cold or emotion, with skin changing white, then blue, then red.
    src: { page: 317, quote: "a triphasic reaction of distal digits to cold or emotion, in which the skin colour changes from white to blue to red" }
    status: unverified
  - id: rheum.L19.051
    kind: enumerate
    topic: skin-msk
    prompt: List the musculoskeletal features of SLE (Jaccoud arthropathy) in the lecture.
    points:
      - Polyarthralgia with morning stiffness
      - Avascular necrosis
      - Bilateral arthritis of hands, wrists and knees
      - Swan neck fingers
      - Ulnar deviation
      - Subluxation with joint hyperlaxity
    pass: 4
