        quote: "Maternal mortality ratio (MMR) = Number of maternal deaths in a given year and area / Number of live births in the same year and area x 100,000 live births"
        text: |
          الـ **maternal mortality** اسمها ==ratio== مش rate، ومقامها **live births** مش الستات الحوامل، وبتتكتب **per 100,000** live births. والـ **perinatal** بس هو اللي مقامه فيه ==fetal deaths + live births== (total births).
      - kind: match
        page: 71
        quote: "Items 64-67: For each of the following descriptions, match the appropriate measure of frequency.\n  a. Fetal mortality\n  b. Infant mortality\n  c. Perinatal mortality\n  d. Neonatal mortality\n  e. Postneonatal mortality\n  f. Maternal mortality\n64. Number of deaths in the first 28 days of life per 1000 live births in 1 year. (SELECT 1 RATE)\n65. Number of fetal deaths plus deaths in the first week of life per 1000 total births in 1 year. (SELECT 1 RATE)\n66. Number of deaths under the age of 1 year per 1000 live births in 1 year. (SELECT 1 RATE)\n67. Number of deaths between the ages of 28 days and 11 months per 1000 live births in 1 year. (SELECT 1 RATE)\nAnswers: 64-d, 65-c, 66-b, 67-e."
        prompt: "وصّل الوصف بالـ rate (slide 71):"
        pairs:
          - ["Deaths in the first 28 days per 1000 live births", "Neonatal mortality"]
          - ["Fetal deaths + first-week deaths per 1000 total births", "Perinatal mortality"]
          - ["Deaths under 1 year per 1000 live births", "Infant mortality"]
          - ["Deaths from 28 days to 11 months per 1000 live births", "Postneonatal mortality"]
        why: "إجابة الـ slide: 64-d (neonatal)، 65-c (perinatal)، 66-b (infant)، 67-e (postneonatal)."
      - kind: check
