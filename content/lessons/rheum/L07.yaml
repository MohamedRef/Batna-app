          </svg>
      - kind: explain
        page: 107
        title: "الأسامي"
        quote: "The 9 proteins of CP are designated by letter \"C\" followed by a number."
        text: |
          - الـ **classical pathway** فيها **9 proteins**: حرف **C** ورقم. الأرقام حسب ==ترتيب الاكتشاف== مش ترتيب الشغل، علشان كده **C4 بيشتغل قبل C2 و C3**.
          - الـ **alternative pathway**: حروف كبيرة، زي **factor B**.
          - الـ **regulators**: اسم وصفي زي **C4 binding protein**، أو حرف زي **factor H**.
          - الـ **fragments**: حروف صغيرة. الـ **a** صغير وذايب وبيطلع بره، والـ **b** كبير بيقعد على السطح ويكمّل الـ cascade.
      - kind: reveal
        page: 107
        quote: "The smaller fragment is given ―a‖ designation, and being soluble is released into the surrounding."
        prompt: "ليه الحتة الكبيرة (b) هي اللي بتكمّل الـ cascade، والصغيرة (a) بتطير؟"
        answer: |
          الكتاب بيقول الـ **a** صغير و **soluble** فبيتساب في المكان حواليه، والـ **b** كبير و **deposited on the surface** وبيكمّل.

          التفسير المقبول (مش في الكتاب): الحتة الكبيرة هي اللي شايلة **المكان اللي بيلزق** في السطح، فبتفضل قاعدة على الميكروب وتبني عليه. والصغيرة ملهاش مكان تلزق فيه، فبتمشي في السوائل وتنادي الخلايا: وده بالظبط شغل الـ **anaphylatoxins** (C3a و C5a).
      - kind: aside
        tone: tip
        page: 107
        quote: "Fragments generated during complement activation are designed by small letters e.g. \"a\", \"b\". The smaller fragment is given \"a\" designation, and being soluble is released into the surrounding. The larger fragment \"b\", is usually deposited on the surface of the activating cells, and continues the cascade. Further fragmentation of the larger b fragment may occur to \"c, d, e\", for example."
        text: |
          افتكر: ==a = away==، و **b = bound**.

          الـ **a** هو الـ smaller fragment: بيطير في الدم ويعمل التهاب، زي C3a و C5a. والـ **b** هو الـ larger fragment: بيلزق في السطح ويكمّل الشغل، زي C3b و C5b.
      - kind: check
        page: 107
        quote: "Fragments generated during complement activation are designed by small letters e.g. \"a\", \"b\". The smaller fragment is given \"a\" designation, and being soluble is released into the surrounding. The larger fragment \"b\", is usually deposited on the surface of the activating cells, and continues the cascade. Further fragmentation of the larger b fragment may occur to \"c, d, e\", for example."
        question: "Which statement about complement fragments is correct?"
        options:
          - "The 'b' fragment is usually larger and stays on the surface"
          - "The 'a' fragment is larger and continues the cascade"
          - "Numbers give the order of activation without exception"
          - "Alternative pathway proteins are named C plus a number"
        answer: 0
        why:
          - "صح: الـ b كبير و bound ويكمّل الـ cascade."
          - "الـ a صغير وذايب وبيطلع في الدم."
          - "الأرقام بترتيب الاكتشاف، و C4 قبل C2."
          - "الـ AP حروف كبيرة: factor B و D."
      - kind: check
        page: 107
        quote: "The numbering of the components relates to the order in which they were discovered, not sequence of activation."
        question: "Why does C4 act before C2 and C3 in the classical pathway?"
        options: ["Complement numbers follow the order of discovery, not of activation", "C4 is the most abundant component", "C4 is made outside the liver", "C4 belongs to the alternative pathway"]
        answer: 0
        why:
          - "صح: الأرقام اتحطت حسب ترتيب الاكتشاف، فـ C4 اتكشف بعد C2 و C3 بس بيشتغل قبلهم."
          - "الأكتر في البلازما هو C3، مش C4."
          - "مكان التصنيع ملوش علاقة بالترقيم."
          - "الـ alternative pathway أساميها حروف كبيرة زي factor B، مش أرقام."
      - kind: try
        items: [rheum.L07.001, rheum.L07.003, rheum.L07.006, rheum.L07.009, rheum.L07.013]
    recap:
      - "Complement = plasma و membrane proteins بتساعد الـ antibodies؛ cascade من proenzymes زي الـ coagulation = تضخيم وتحكم."
      - "أغلبه من الـ liver، وكمان monocytes و macrophages و epithelium."
      - "أهم وظيفة opsonization، والتانية تنشيط الخلايا للالتهاب. C4a و C3a و C5a = anaphylatoxins."
      - "CP و AP و LP بيبدأوا مختلف ويتقابلوا عند C3."
      - "الأرقام بترتيب الاكتشاف (C4 قبل C2). a صغير بيطير، b كبير بيلزق ويكمّل."
