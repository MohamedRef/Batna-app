        quote: "Why are low to middle income countries lagging in research?\nResearchers helping researchers:\n  By improving research quality and efficiency through affordable assistance in research design, management, and statistical analysis\n  By providing research infrastructure through data and registry management, and publishing\n  By promoting health research culture through research boot camps and events for young healthcare professionals and students"
        title: "ليه الدول النامية متأخرة؟"
        text: |
          slide 32 بيقسم المشاكل على 4 مراحل:

          - **Planning + design**: poor research culture، lack of funding، demotivated researchers، مش قادر توصل للـ literature، design غلط.
          - **Data collection + conduct**: ==tedious review process== (الـ institutional review board (IRB) بتتقابل مرة في الشهر)، وقت التجربة بيقصر، والفلوس بتتصرف على التخطيط مش التنفيذ.
          - **Analysis + manuscript**: inadvertent **plagiarism**، poor writing، statistics غلط.
          - **Publication**: الـ journals بترفض لضعف الجودة أو لأنك مش قادر تدفع رسوم النشر.

          والحل المقترح (**101 framework**): مساعدة رخيصة في الـ design والإحصاء، infrastructure للداتا والنشر، ونشر ثقافة البحث بين الشباب.
      - kind: explain
        page: 34
        quote: "Because HR is intended to provide information for decision-making to improve health care, the selection and analysis of the research topic should involve those who are responsible for the health status of the community (stakeholders)."
        title: "مين يختار الموضوع؟"
        text: |
          الـ **health research** هدفه يدّي معلومات لاتخاذ قرار يحسّن الرعاية. علشان كده اختيار الموضوع لازم يشترك فيه ==stakeholders==: اللي مسؤولين عن صحة المجتمع.
      - kind: reveal
        page: 35
        quote: "Criteria for prioritizing & selecting\na research topic\nEach topic, that is proposed for research, has\nto be judged according to certain guidelines or\ncriteria.\nThere may be several ideas to choose from.\nBefore deciding on a research topic, each\nproposed topic must be compared with all other\noptions."
        prompt: "عندك فكرة واحدة عاجباك جدًا. ليه slide 35 بيقولك تقارنها بباقي الاختيارات برضه؟"
        answer: |
          لأن كل موضوع مقترح ==يتحكم عليه بـ criteria==، ومفيش موضوع «كويس» لوحده: الحكم دايمًا **نسبي**. الفكرة اللي عاجباك ممكن تطلع أقل feasibility أو أقل urgency من فكرة تانية.

          علشان كده قبل ما تقرر، كل topic **compared with all other options**، وده اللي الـ rating table في آخر الدرس بيعمله بالأرقام.
      - kind: mnemonic
        page: 36
        quote: "Criteria for prioritizing & selecting a research topic:\n  Relevance: The importance of the problem, and its priority in the country and in the local area\n  Avoidance of duplication: No sound information available\n  Urgency of data needed (timeliness): Data urgently needed for decision-making or developing interventions at various levels\n  Political acceptability of study: Topic is acceptable to high level policymakers, or has the interest and support of the local/national authorities.\n  Feasibility of study: Study is feasible, considering available resources.\n  Applicability of results: Good chance of recommendations being implemented.\n  Ethical acceptability: No ethical problems."
        word: "PURE FAA"
        parts:
          - { key: "P", text: "Political acceptability" }
          - { key: "U", text: "Urgency of data needed (timeliness)" }
          - { key: "R", text: "Relevance" }
          - { key: "E", text: "Ethical acceptability" }
          - { key: "F", text: "Feasibility" }
          - { key: "A", text: "Avoidance of duplication" }
          - { key: "A", text: "Applicability of results" }
        hook: |
          موضوعك لازم يكون **PURE** (نضيف)، وياخد موافقة الـ **FAA** (هيئة الطيران) علشان يطير. الـ 7 criteria في كلمتين.
      - kind: figure
        page: 36
        quote: "Criteria for prioritizing & selecting a research topic:\n  Relevance: The importance of the problem, and its priority in the country and in the local area\n  Avoidance of duplication: No sound information available\n  Urgency of data needed (timeliness): Data urgently needed for decision-making or developing interventions at various levels\n  Political acceptability of study: Topic is acceptable to high level policymakers, or has the interest and support of the local/national authorities.\n  Feasibility of study: Study is feasible, considering available resources.\n  Applicability of results: Good chance of recommendations being implemented.\n  Ethical acceptability: No ethical problems."
