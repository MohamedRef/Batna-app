      - kind: explain
        page: 227
        quote: "Delirium\n  Are the symptoms acute with episodes of inattention?\n  Is there disorganized thinking or an altered level of consciousness?"
        title: "Delirium"
        text: |
          سؤالين screening:
          1. الأعراض **acute** ومعاها نوبات ==inattention==؟
          2. فيه **disorganized thinking** أو تغيّر في مستوى الوعي؟

          ليه السؤالين دول؟ التفسير المقبول (مش في الكتاب): دول جوهر الـ Confusion Assessment Method (CAM): بداية حادة مع inattention، ومعاهم تفكير ملخبط أو وعي متغير. ومهم في الـ palliative care لأن الـ delirium ممكن يتلخبط مع الاكتئاب أو القلق، وعلاجه مختلف، وأحيانًا سببه دوا زي الـ benzodiazepines (ص 226).
      - kind: explain
        page: 227
        quote: "Assess severity using validated instruments. Reliable symptoms include feelings of helplessness, hopelessness, loss of self-esteem, worthlessness, persistent dysphoria, and suicidal ideas. Somatic symptoms are not reliable indicators of depression in this population of patients."
        title: "الاكتئاب"
        text: |
          الأعراض الجسدية (وزن، تعب، نوم) ==مش reliable==، المرض نفسه بيعملها.

          الـ reliable: **helplessness**، **hopelessness**، low self-esteem، **worthlessness**، dysphoria مستمرة، و suicidal ideas.

          الـ suicidal ideation: اسأل عليها **صراحة** واستكشف السبب؛ غالبًا علامة **distress شديد**. واكتئاب شديد = psychiatry.

          ليه الأعراض الجسدية مش reliable؟ التفسير المقبول (مش في الكتاب): المرض المتقدم نفسه بيعمل تعب وقلة أكل وقلة نوم ووزن نازل، سواء فيه اكتئاب أو لأ. يعني لو اعتمدت عليها هتشخّص كل المرضى. الأعراض النفسية (hopelessness، worthlessness) هي اللي بتفرّق.
      - kind: explain
        page: 227
        quote: "Supportive psychotherapy, cognitive approaches, behavioral techniques, and pharmacologic therapies have all been shown to be effective for treatment of depression in patients with advanced disease."
        title: "مش دوا وبس"
        text: |
          الكتاب بيقول إن **أربع** طرق كلها أثبتت فايدة في اكتئاب المرض المتقدم:
          - ==Supportive psychotherapy==.
          - **Cognitive approaches**.
          - **Behavioral techniques**.
          - Pharmacologic therapies.

          يعني ماتقولش «مفيش وقت يبقى مفيش علاج». والاكتئاب **الشديد** يتحوّل للـ psychiatry.
      - kind: table
        page: 227
        quote: "Supportive psychotherapy, cognitive approaches, behavioral techniques, and pharmacologic therapies have all been shown to be effective for treatment of depression in patients with advanced disease. Psychiatric consultation should be obtained in cases of severe depression. Patients should be asked specifically about suicidal ideation, and, if present, the reasons behind it should be carefully explored. Suicidal ideation often represents a measure of extreme distress in patients with advanced illness. Choice of pharmacologic therapy is often dictated by the patient's estimated life expectancy. Psychostimulants (e.g., methylphenidate and dextroamphetamine) provide rapid treatment of symptoms (within days) with minimal side effects."
