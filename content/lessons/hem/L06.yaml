        caption: "الـ **AHTR**: IgM جاهز والكرات تتفرتك جوه الأوعية (hemoglobinuria). الـ **DHTR**: ==IgG== بييجي بعد أيام ويغطي الكرات والطحال يشيلها (extravascular)، فـ jaundice من غير hemoglobinuria."
