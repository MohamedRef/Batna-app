  - id: dm.L07.lesson3
    title: "الاختبارات الخمسة على السرير"
    hook: "ECG وجهاز ضغط ومانومتر وقبضة إيد: كل الأرقام اللي بيسألوا عليها في صفحة واحدة."
    minutes: 10
    pages: [82, 85]
    topics: [tests]
    goals:
      - "تعدّ الـ 5 reflex tests"
      - "تحفظ الـ cut-off لكل اختبار"
      - "تفسر نتايج عيان حقيقي"
    status: unverified
    steps:
      - kind: explain
        remind: [dm.L07.043, dm.L07.003]
        page: 82
        title: "الخمسة"
        quote: "Five simple noninvasive cardiovascular reflex tests:"
        text: |
          **Five simple noninvasive cardiovascular reflex tests:**
          1. **Valsalva maneuver**
          2. **Heart rate (HR) response to deep breathing**
          3. **HR response to standing up**
          4. **Blood pressure (BP) response to standing up**
          5. **BP response to sustained handgrip**

          والـ **heart rate variability (HRV)** بيتحلل بطريقتين: ==time-domain== (إحصاء الـ R-R intervals) أو ==frequency-domain== (spectral analysis).

          افتكر التقسيمة دي (التفسير المقبول، مش في الكتاب): اختبارات **النبض** (deep breathing و standing و Valsalva) بتقيس أساسًا الـ **vagus**، واختبارات **الضغط** (standing و handgrip) بتقيس الـ **sympathetic**. الـ vagus بيقع الأول، فاختبارات النبض بتطلع abnormal بدري.
      - kind: mnemonic
        page: 82
        quote: "Five simple noninvasive cardiovascular reflex tests:\n  5- Valsalva maneuver,\n  6- Heart rate response to deep breathing,\n  7- Heart rate response to standing up,\n  8- Blood pressure response to standing up\n  9- Blood pressure response to sustained handgrip\n  10- HRV can be assessed either by calculation of indices based on statistical analysis of R-R intervals (time-domain analysis) or by spectral analysis (frequency-domain analysis) of an array."
        word: "VDSSH"
        parts:
          - { key: "V", text: "Valsalva: longest/shortest R-R >1.2" }
          - { key: "D", text: "Deep breathing: HR difference >15, I/E >1.17" }
          - { key: "S", text: "Standing HR: 30:15 >1.03" }
          - { key: "S", text: "Standing SBP: fall <10 normal, >30 abnormal" }
          - { key: "H", text: "Handgrip: diastolic rise >16" }
        hook: "**V-D-S-S-H**: «ڤي دي إس إس إتش»، تلاتة للنبض (V، D، S) واتنين للضغط (S، H)."
      - kind: explain
        page: 82
        title: "Resting HR و deep breathing"
        quote: "With the patient at rest and supine, breathing six breaths/min, heart rate monitored by ECG or AN SCORE device, a difference in heart rate of > 15 beats/min is normal, and < 10 beats/min is abnormal."
        text: |
          - **Resting HR >100** = abnormal
          - **Deep breathing**: supine، **6 breaths/min**، على electrocardiogram (ECG)
          - فرق الـ HR: **>15** normal، و **<10** ==abnormal==
          - ونسبة **R-R inspiration/expiration >1.17**
      - kind: reveal
        page: 82
        quote: "With the patient at rest and supine, breathing six breaths/min, heart rate monitored by ECG or AN SCORE device, a difference in heart rate of > 15 beats/min is normal, and < 10 beats/min is abnormal."
        prompt: "ليه النبض الطبيعي بيتغير مع النَفَس أصلًا؟"
        answer: |
          مع الشهيق الـ **vagus** بيتثبط فالنبض يسرع، ومع الزفير يرجع الـ vagal tone فالنبض يبطأ (**sinus arrhythmia**).

          ده اختبار للـ **parasympathetic**. لما الـ vagus يموت، الفرق يختفي وتبقى أقل من **10 beats/min**.
      - kind: explain
        page: 83
        title: "الوقوف: 30:15"
        quote: "The 30:15 ratio is normally > 1.03."
        text: |
          على ECG، قيس الـ **R-R** عند الضربة **15** والضربة **30** بعد الوقوف.

          الطبيعي: **tachycardia** الأول (R-R قصير عند 15)، وبعدين **reflex bradycardia** (R-R أطول عند 30).

          ==30:15 ratio >1.03== = normal.

          ليه الشكل ده؟ التفسير المقبول (مش في الكتاب): لما تقف الدم بينزل لتحت، فالـ vagus يسيب القلب فورًا ويسرع (عند الضربة 15). بعدها الضغط يرجع والـ vagus يمسك تاني فيبطّأ (عند الضربة 30). من غير vagus مفيش حركة، والنسبة تبقى حوالي 1.
      - kind: explain
        page: 83
        title: "Valsalva"
        quote: "The subject forcibly exhales into the mouthpiece of a manometer to 40 mmHg for 15 s during ECG monitoring. Healthy subjects develop tachycardia and peripheral vasoconstriction during exercise, and an overshoot of bradycardia and a rise in blood pressure occur with release. The ratio of the longest R-R to the shortest R-R should be > 1.2."
        text: |
          ينفخ في مانومتر لحد **40 mmHg** لمدة **15 s** على ECG.

          الطبيعي: **tachycardia** و vasoconstriction أثناء النفخ، وبعد ما يسيب **overshoot bradycardia** والضغط يعلى.

          ==Longest R-R ÷ shortest R-R >1.2==.

          الفكرة (التفسير المقبول، مش في الكتاب): النفخ بيقيس الـ baroreflex كله، لأن النفخ بيرفع الضغط جوه الصدر فالدم الراجع للقلب يقل والضغط يقع، فالقلب يسرع. لما يسيب، الدم يرجع مرة واحدة والضغط يعلى زيادة، فالـ baroreflex يفرمل القلب. أطول R-R (بعد ما يسيب) على أقصر R-R (وهو بينفخ) بيقيس قد إيه الـ reflex ده شغال.
      - kind: figure
        page: 83
        title: "صورة الكتاب ص 83: الـ Valsalva على السرير"
        image: { file: dm/L07-valsalva.webp, book: true }
        alt: "Book image in two halves. Right: a woman blows into a tube connected to a mercury manometer. Left, top: a blood pressure tracing that dips during the strain and overshoots after release. Left, bottom: a heart rate tracing that rises during the strain and falls below baseline after release. A bar under both reads: breath 40 mm for 15 s, longest R-R over shortest R-R should be above 1.2."
        caption: |
          - **اليمين**: العيانة بتنفخ في **الأنبوبة** الموصّلة بالـ **manometer** اللي في إيدها.
          - **الشمال فوق**: الـ **blood pressure**، بيقع وهي بتنفخ، وبعد ما تسيب ==بيعلى أكتر من الأول== (overshoot).
          - **الشمال تحت**: الـ **heart rate**، بيعلى وهي بتنفخ، وبعد ما تسيب بينزل تحت الخط.

          أقصر R-R وقت الطلوع، وأطول R-R وقت النزول، والنسبة بينهم لازم **>1.2**.
      - kind: table
        page: 83
        quote: "Systolic blood pressure is measured in the supine subject. The patient stands, and the systolic blood pressure is measured after 2 min. Typical response is a fall of < 10 mmHg, borderline is a fall of 10-29 mmHg, and abnormal is a fall of > 30 mmHg with symptoms."
