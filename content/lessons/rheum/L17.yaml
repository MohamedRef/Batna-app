        title: "التحاليل والـ DDx"
        quote: "The HLA-B27 is present in 70-80% of patients."
        text: |
          ESR عالي في الـ acute، anaemia of chronic illness، pyuria و haematuria، والـ urethral discharge مليان neutrophils. **HLA-B27 ==70-80%==**.

          **X-ray**: sacroiliitis ==asymmetric==، و syndesmophytes كبيرة asymmetric في أماكن متفرقة.

          **Differential diagnosis (DDx)**: **gonococcal**، AS، psoriatic، colitic، **Behcet** (قرح ==بتوجع==)، rheumatoid arthritis (RA)، gout، و HIV.

          يعني الـ HLA-B27 هنا أقل من الـ AS (70–80% قصاد 90–95%)، والصورة asymmetric عكس الـ AS اللي symmetric.
