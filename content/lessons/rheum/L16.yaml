        quote: "| Drug | Use and action | dose | Principal side effects | Monitoring | Frequency of monitoring |\n|---|---|---|---|---|---|\n| Methotexate (MTX) | 1st choice drug methotretate inhibits purine synthesis through inhibition of dihydrofolate reductase. It also inhibits AICAR transformylase leading to increases in its substrate AICAR which stimulate the release of adenosine. Adenosine is a potent inhibitor of neutrophil function and has potent anti inflammatory properties. | 5-25 mg-week | GI upset, stomatitis, rash, alopecia, hepatotoxicity, acute pneumonitis, Bone marrow toxicity. Folic acid (1mg/d) reduce side effects. | CBC, LFT | Monthly |\n| Sulphasalazine | First choice drug (almost as effective as methotrexate) Immunomodulator | 2-3 gm/day | Nausea, GI diarrhea upset, rash, hepatitis, Neutropenia, pancytopenia. | CBC, LFT | Monthly for 3 months and then every 3 months |\n| Leflunomide | As effective as the first two but expensive. Used when methotrexate is not tolerated, contraindicated or in addition to MTX. Immunosuppressive leflunomide inhibits dihydroorotate dehydrogenase leading to decrease in de novo. Synthesis of pyrimidines and arrest activated lymphocyte cell division in G1 stage | 20 mg/day often a loading dose of 100 mg/d for 3 days. | Nausea, GI upset, rash, alopecia, hepatitis, hypertension | CBC, LFT, Blood pressure | 6-12 month |\n| Hydroxychloroquine | Weak antirheumatic drug for mild RA or combination therapy. Slower onset of action. They inhibit antigen presentation by HLA. They inhibit platelet aggre gation and adhesion | 200-400 mg/d | Rash, nausea, diarrhea, headache, corneal deposits, and retinopathy | Visual acuity, Amsler chart, Fundoscopy | |"
