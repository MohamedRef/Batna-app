      - Actual patient care decisions and actions
    - - Form
      - Root (what, why, when, how) + verb
      - '4 components: PICO'
    - - Example
      - What are the causes of MI?
      - In MI, does cholesterol lowering vs placebo reduce mortality?
    - - Source
      - Textbooks, handbooks
      - Journals, sometimes guidelines
