          - النفق ==3 cm بعد الـ GE junction== جوه الـ cardia، وهناك بتشوف الـ **oblique innermost fibers** بتاعة المعدة.
          - الـ myotomy: **inner circular** fibers بس، بتبدأ **2 cm تحت** الـ mucosotomy، وتكمل لحد **2 cm بعد الـ GEJ**.
          - بعدين المنظار يطلع من النفق وينزل في الـ **true lumen** يتأكد مفيش **mucosal injury**.
          - وفي الآخر الفتحة بتتقفل بـ **clips**.

          التفسير المقبول (مش في الكتاب) للأرقام:
          - النفق **أطول** من الـ myotomy (3 مقابل 2) علشان تبقى شايف الـ cardia وواثق إنك عدّيت الـ sphincter كله.
          - الـ myotomy بتبدأ **بعيد** عن الفتحة بـ 2 cm، فلما الـ mucosa تتقفل فوقها يبقى فيه **mucosa سليمة** غطّت الـ muscle المقطوع، فمفيش leak.
          - **inner circular** بس، لأن الـ circular هي اللي بتعمل الضغط في الـ achalasia، والـ longitudinal بتفضل تسند الحيطة.
