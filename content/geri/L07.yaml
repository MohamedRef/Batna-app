  - id: geri.L07.094
    kind: mcq
    topic: nutrition
    stem: Which factor is NOT listed as a risk for malnutrition in older adults?
    options:
      - Involuntary weight loss >5% in one month
      - BMI <20 in individuals ≥65 years
      - Increased appetite
      - Reduced food intake
      - Decreased appetite
    answer: 2
    why:
      - Weight loss over 5% in a month is a listed risk factor.
      - BMI under 20 in those 65 or older is a listed risk factor.
      - "Correct: the risk factor is decreased appetite, not increased (p123)."
      - Reduced food intake is a listed risk factor.
      - Decreased appetite is a listed risk factor.
    src: { page: 123, quote: "Frequently used risk factors for malnutrition are:\n  Involuntary weight loss (more than 5% over the last month or more than 10% over the last six months).\n  BMI less than 20 for elderly (≥ 65y).\n  Decreased appetite or reduced food intake" }
    status: unverified
