  - id: dm.L01.lesson9
    title: "بول فيه سكر وبول كتير"
    hook: "قايمتين بتحلّ لغز السكر في البول والبول الكتير: سكر الدم كام، والـ ADH فين؟"
    minutes: 8
    pages: [13, 14]
    topics: [glycosuria]
    goals:
      - "تفرّق glycosuria مع سكر دم عالي من الـ renal glycosuria"
      - "تعدّ أسباب الـ renal glycosuria وتفهم ليه الحمل أشهرها"
      - "ترتّب أسباب الـ polyuria حسب الـ ADH"
    status: unverified
    steps:
      - kind: explain
        page: 13
        title: "Glycosuria: أول سؤال تسأله"
        quote: "Glycosuria It means the presence of glucose in urine"
        text: |
          الـ ==glycosuria== = **presence of glucose in urine**. وشفنا قبل كده إن السكر بينزل في البول لما يعدّي الـ **renal threshold** (حوالي 180).

          يعني فيه طريقين بس عشان السكر يوصل للبول:
          - يا إما **سكر الدم عالي** وعدّى الـ threshold الطبيعي،
          - يا إما **الـ threshold نفسه واطي** وسكر الدم طبيعي.

          عشان كده أول سؤال قدام أي glycosuria: **سكر الدم كام؟** ده اللي بيقسم الكتاب لنصين في الصفحة الجاية.
      - kind: explain
        remind: [dm.L01.089, dm.L01.091]
        page: 14
        title: "سكر في البول: الدم بيقول إيه؟"
        quote: "II- Glycosuria with normal or low blood glucose (Renal glycosuria):\n  1- Pregnancy: The commonest cause. It is due to a lower renal threshold for glucose excretion.\n  2- Tubular dysfunction\n  3- Renal glycosuria (benign type): Rare inherited disorder, Asymptomatic, and normal kidney function.\n  4- False positive test: Lactosuria, Fructosuria, and Ascorbic aciduria."
        text: |
          - **Glycosuria + سكر دم عالي** = **diabetes**.
          - **Glycosuria + سكر دم طبيعي أو واطي** = ==renal glycosuria==.

          أسباب الـ renal glycosuria:
          1. **Pregnancy:** **the commonest cause** (renal threshold أوطى).
          2. **Tubular dysfunction**.
          3. **Benign renal glycosuria:** rare، inherited، asymptomatic، كلى طبيعية.
          4. **False positive:** lactosuria، fructosuria، ascorbic aciduria.

          ليه الحمل أشهر سبب؟ التفسير المقبول (مش في الكتاب): الـ GFR في الحمل بيزيد كتير، فالسكر اللي بيوصل للـ tubules أكتر من قدرتها على الامتصاص، يعني الـ threshold «بيوطى» عمليًا. والـ false positives لأن بعض الشرايط بتتفاعل مع أي سكر مختزل (lactose، fructose) أو مع vitamin C.
      - kind: case
        page: 14
        quote: "Pregnancy: The commonest cause. It is due to a lower renal threshold for glucose excretion."
        stem: "A 28-year-old woman at 22 weeks has glycosuria on a dipstick."
        steps:
          - question: "What do you do first?"
            options: ["Measure her blood glucose", "Diagnose gestational diabetes", "Start insulin", "Reassure without tests"]
            answer: 0
            why: "الـ glycosuria **requires urgent blood glucose measurements** ومش بتشخّص لوحدها. لازم تعرف سكر الدم الأول."
          - reveal: "Her fasting and 2-h glucose are normal."
            question: "Most likely cause?"
            options: ["Lower renal threshold in pregnancy", "Gestational diabetes", "Fanconi syndrome", "Benign inherited renal glycosuria"]
            answer: 0
            why: "سكر الدم طبيعي، يعني **renal glycosuria**، والكتاب بيقول الحمل **the commonest cause** بسبب **lower renal threshold**. الـ GDM محتاج سكر دم عالي، والباقيين أندر."
      - kind: explain
        page: 14
        title: "Polyuria: اسأل عن الـ ADH"
        quote: "Polyuria It means: urine output >2.5 liters/day due to osmotic diuresis"
        text: |
          الـ ==polyuria== = urine output **أكتر من 2.5 لتر في اليوم**. الكتاب بيرتّب أسبابها حسب مكان العطل:

          - **Pituitary:** الـ **ADH** مش بيتعمل ← **cranial diabetes insipidus**.
          - **Renal:** الكلية مش بترد على الـ ADH، أو فيه **solute** بيسحب ميه (DM)، أو قدرة التركيز نفسها راحت.
          - **Drugs:** diuretics.
          - **Others:** compulsive water drinking (**psychogenic**).

          ليه الترتيب ده مفيد؟ لأن الـ ADH هو اللي بيخلّي الكلية تمسك الميه، فكل سبب يا إما **مفيش ADH**، يا إما **فيه بس محدش سامعه**، يا إما حاجة **أقوى منه** بتشد الميه برا. ده بالظبط اللي هيفرّق بين الـ DI والـ DM في الامتحان.
      - kind: figure
        remind: [dm.L01.016]
        page: 14
        quote: "I- Pituitary: impaired production of ADH: Cranial diabetes insipidus."
        title: "الـ Polyuria: من الدماغ للكلية"
        alt: "A vertical map. Pituitary: low ADH, cranial diabetes insipidus. Kidney, no response to ADH: nephrogenic DI, Fanconi. Kidney, solute load: diabetes mellitus. Kidney, low concentrating capacity: early CRF, hydronephrosis, hypercalcemia, hypokalemia. Drugs: diuretics. Others: psychogenic drinking."
        caption: "اسأل: الـ **antidiuretic hormone (ADH)** مش موجود؟ موجود والكلية مش سامعاه؟ الكلية سامعاه بس فيه **solute** بيسحب ميه؟ ولا الكلية مش قادرة **تركّز**؟"
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="8" width="310" height="40" rx="10" class="fg-acc"/>
