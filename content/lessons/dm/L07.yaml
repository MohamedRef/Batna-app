        prompt: "ليه عيان الـ CAN بيموت أكتر حتى من renal failure، مش من القلب بس؟"
        answer: |
          الكتاب بيعدّ **coexistence of CVD** و **increased mortality from renal failure and a variety of other causes** ضمن الأسباب.

          التفسير المقبول (مش في الكتاب): الـ CAN مش بيحصل لوحده. العصب اللي اتأذى ده اتأذى من نفس السكر العالي سنين اللي أذى الكلية والشبكية والشرايين. يعني الـ CAN **مراية**: لو ظاهر في القلب، غالبًا الضرر موجود في كل حتة تانية.
