  - id: rheum.L20.077
    kind: cloze
    topic: treatment
    text: "Active despite NSAIDs, or moderate–severe without erosions: start a cDMARD, usually {{c1::MTX 15–25 mg}} once weekly, rather than a biologic."
    src: { page: 341, quote: "Initiate treatment with a cDMARD, usually MTX; 15 to 25 mg once weekly rather than a biologic agent." }
    status: unverified
    tags: [numbers]
  - id: rheum.L20.078
    kind: card
    topic: treatment
    front: Alternatives to methotrexate for peripheral PsA, and their limits?
