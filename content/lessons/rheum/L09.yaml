      - kind: explain
        page: 167
        title: "كل antibody بيقولك تخاف من إيه"
        quote: "Autoantibodies help define clinical subsets and guide prognosis."
        text: |
          الكتاب: الـ autoantibodies ==define clinical subsets and guide prognosis==. والجدول:
          - **Anti-Mi-2**: classic DM و **good prognosis**.
          - **Anti-MDA5**: clinically amyopathic DM و **rapidly progressive ILD**.
          - **Anti-TIF1γ**: adult-onset DM و **malignancy**.
          - **Anti-NXP2**: أكتر في الـ **juvenile DM**.
          - **Anti-SAE**: skin disease و **dysphagia**.
          - **Anti-SRP و anti-HMGCR**: الـ **IMNM**.
          - الـ MAAs (Ro/SSA، U1-RNP، PM/Scl، Ku): الـ **overlap**.

          التفسير المقبول (مش في الكتاب) للطريقة اللي تستخدمه بيها: الـ antibody بيغيّر **أول خطوة بعد التشخيص**. MDA5 = اطلب **CT صدر** فورًا. TIF1γ = ابدأ **cancer screening**. SRP أو HMGCR = اسأل عن الـ **statins** وفكّر IMNM. Mi-2 = طمّن العيان. يعني كل سطر في الجدول هو **قرار** مش معلومة.
