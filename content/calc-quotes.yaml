  - calculator: albi
    lecture: hb.L18
    page: 363
    quote: |-
      The ALBI grade provides a simple, evidence-based, objective, and discriminatory method of assessing liver function in patients with HCC that may diminish interobserver variation (as occurs with grading of ascites and encephalopathy in the Child-Pugh scoring system).
      If independently validated, use of the ALBI score may allow better refinement of prognostic estimates in patients with HCC across a wide spectrum of treatments, particularly among those with better liver function.
      The ALBI score is also used to stratify risk associated with some treatments such as TACE.
      The linear predictor was calculated to = (log10 bilirubin x 0.66) + (albumin x -0.085), with bilirubin in micromol/L and albumin in g/L.
      Cutpoint analysis revealed three separate prognostic groups:
        ALBI grade I (score ≤-2.60),
        Grade II (score >-2.60 to ≤-1.39), and
        Grade III (>-1.39).
  - calculator: bclc
    lecture: hb.L18
    page: 364
    quote: |-
      BCLC stage 0-A (very early 0 or early disease A)
        Possible surgical candidate (good liver function)
        1st line – consider resection or thermal ablation
      Surgical resection
        Surgical resection is the optimal curative treatment for HCC in patients with solitary HCC without vascular invasion, and normal hepatic synthetic function without evidence of portal hypertension. AASLD recommends that surgical resection should be the treatment of choice for localized HCC in the absence of underlying cirrhosis.
        It may also be considered in patients with cirrhosis with limited tumor burden, well-compensated cirrhosis without clinically significant portal hypertension, and an adequate future liver remnant (typically >40%). Hepatic resection is also the preferred option in patients with hepatitis B-induced HCC without cirrhosis.
        Criteria for resection based on BCLC staging include:
          A solitary HCC confined to the liver;
          No radiographic evidence of invasion of the hepatic vasculatures;
          No radiographic evidence of any contiguous or distance metastasis;
          Well-preserved hepatic function, with no portal hypertension.
  - calculator: milan
    lecture: hb.L18
    page: 368
    quote: |-
      Milan criteria
        These are a single lesion ≤5 cm or 2-3 lesions all ≤3 cm, without evidence of gross vascular invasion, without regional lymph nodal or distant metastasis, and with good activity performance status (≤1).
      Extended liver transplantation criteria
        Patients meeting criteria for the OPTN downstaging protocol may be eligible for standard MELD HCC exception points and given priority if HCC tumor burden can be downstaged to, and maintained within, Milan criteria with an AFP level <1000 ng/mL using locoregional therapies.
