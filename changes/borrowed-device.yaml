# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: لما تدخل من جهاز مش بتاعك وتعلّم «الجهاز ده مش بتاعي»، مذاكرتك بتتمسح من الجهاز ده أول ما تخرج أو تقفل التاب أو التطبيق
  en: On someone else's device ("Not my device"), your study is cleared from it when you sign out or close the tab or app
