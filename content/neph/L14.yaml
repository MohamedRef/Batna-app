  - id: neph.L14.144
    kind: card
    topic: ttp
    front: What is required before applying the PLASMIC score, and how is it read?
    back: Schistocytes on the smear. Higher score = likelier TTP (>5 high, <5 low probability); sensitivity 99%, specificity 57%, so it is a rule-out screen.
    src: { page: 480, quote: "This score has been validated with a reported sensitivity of 99% and a specificity of 57%." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.145
    kind: card
    topic: ttp
    front: What ADAMTS13 levels confirm TTP and define relapse?
    back: "<10% with hemolysis and thrombocytopenia confirms TTP (not specific: also sepsis, cancer). A fall to <20% after recovery = relapse, even without hemolysis."
    src: { page: 480, quote: "A decrease of the ADAMTS13 activity to less than 20% after initial recovery from an acute episode is considered a relapse" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L14.146
    kind: card
    topic: ttp
    front: What is the mainstay of TTP treatment?
    back: Plasma exchange (PEX) with high-dose corticosteroids, started as soon as possible.
    src: { page: 480, quote: "The mainstay of treatment in TTP is plasma exchange (PEX) with high-dose corticosteroid therapy." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.147
    kind: card
    topic: ttp
    front: Give the steroid doses in TTP.
    back: "Prednisone 1 mg/kg/day if neurologically intact; if severely ill, IV methylprednisolone 1000 mg daily for 3 days or 125 mg 2-4 times daily."
    src: { page: 480, quote: "The generally recommended dose for corticosteroids is 1 mg/kg per 1 mg/kg per day of prednisone in neurologically intact patients." }
    status: unverified
  - id: neph.L14.148
    kind: card
    topic: ttp
    front: How is plasma exchange done in TTP?
    back: One plasma volume (about 40 mL/kg) once daily, replaced with plasma because it repletes ADAMTS13. Stop abruptly at remission, without tapering.
    src: { page: 481, quote: "Plasma is used as the preferred fluid replacement during the treatment because it repletes ADAMTS13." }
    status: unverified
  - id: neph.L14.149
    kind: card
    topic: ttp
    front: Which second-line agent is favoured for refractory or relapsed TTP?
    back: Rituximab (anti-CD20), over splenectomy, vincristine, cyclophosphamide and cyclosporine.
    src: { page: 481, quote: "It has gained more favour than other nonspecific immunosuppressive agents." }
    status: unverified
  - id: neph.L14.150
    kind: card
    topic: ttp
    front: How does caplacizumab work, and what does it not do?
    back: It binds the A1 domain of VWF and blocks platelet adhesion, rapidly halting microthrombi; it does not reduce ADAMTS13 autoantibody production.
    src: { page: 482, quote: "However, it does not reduce the production of the autoantibody against ADAMTS13." }
    status: unverified
  - id: neph.L14.151
    kind: card
    topic: ttp
    front: How long is caplacizumab given, and its main risk?
    back: IV dose then SC daily for 30 days after PEX stops (until ADAMTS13 >20%); it increases bleeding risk.
    src: { page: 482, quote: "Caplacizumab is given as an initial intravenous dose followed by subcutaneous injections for 30 days after PEX has been stopped." }
    status: unverified
  - id: neph.L14.152
    kind: card
    topic: ttp
    front: Should platelets be transfused in TTP?
    back: Considered contraindicated unless there is major bleeding. Packed RBCs are given if indicated.
    src: { page: 482, quote: "Platelet transfusion is controversial but is considered to be contraindicated unless major bleeding is present." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.153
    kind: card
    topic: ttp
    front: Is plasma infusion without exchange enough for TTP?
    back: No; it is only a temporizing measure while PEX is unavailable, since equivalent volumes are rarely feasible.
    src: { page: 482, quote: "Plasma infusion without exchange is not an adequate treatment for TTP." }
    status: unverified
  - id: neph.L14.154
    kind: table
    topic: ttp
    title: ISTH 2020 TTP treatment guidance (p483)
    columns: [Situation, Recommendation]
    rows:
      - [Initial treatment, "Corticosteroids + PEX (strong), over PEX alone"]
      - [First acute event, "Add rituximab to steroids and PEX (conditional)"]
      - [Relapsing TTP, "PEX + steroids + rituximab + caplacizumab"]
      - ["Remission with low ADAMTS13", Prophylactic rituximab]
      - ["Pregnant with low ADAMTS13, no symptoms", Prophylactic plasma infusion]
    blanks: [[0, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 483, quote: "2020 Treatment Guidelines by the International Society on Thrombosis and Hemostasis" }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.155
    kind: mcq
    topic: ttp
    stem: "A 32-year-old woman on oral contraceptives has confusion, platelets 12,000, schistocytes, MCV 84, INR 1.1, creatinine 1.3 mg/dL, no cancer or transplant: unexplained hemolytic anemia and thrombocytopenia. Which step is right?"
    options:
      - Start plasma exchange and corticosteroids now
