        quote: "Qualitative research:\n  Research topic: Visual display units\n  Research problem: Do visual display units affect the health of users?\n  Research question: To explore how psychosocial aspects of working with visual display units (VDU) are related to job stress and what their consequences are for mental and physical health.\n  Sub-questions:\n    What are \"psychosocial aspects\" of work and how are they detected and determined?\n    What is \"job stress\" and how is it detected and determined?\n    What is meant by \"physical and mental health\" and how is it detected and determined?"
        prompt: "مثال المحاضرة: \"To explore how psychosocial aspects of working with visual display units (VDUs) are related to job stress and their consequences for mental and physical health.\" ليه بعده كذا sub-question؟"
        answer: |
          لأنه سؤال **qualitative** عام ومفتوح (لاحظ كلمة **explore**)، وكل كلمة فيه محتاجة تتعرّف:

          - What are **psychosocial aspects** of work, and how are they detected
          - What is **job stress**, and how is it detected
          - What is meant by **physical and mental health**?

          السؤال العام بيفتح الباب، والـ sub-questions بتقسّم الأوضة.
      - kind: try
        items: [res.L03.014, res.L03.015, res.L03.016, res.L03.025]
    recap:
