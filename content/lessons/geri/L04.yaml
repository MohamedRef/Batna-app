  - id: geri.L04.lesson2
    title: "جوه مخ الزهايمر: amyloid وtau وحريقة"
    hook: "الـ amyloid زي زبالة متكوّمة في الشارع: بتسد البلاعات، بتجيب الحشرات، والكناسين (microglia) بقوا هما نفسهم بيولّعوا فيها."
    minutes: 9
    pages: [56, 62]
    topics: [ad-mechanism, ad-risk, ad-diagnosis]
    goals:
      - "تعرف إن الـ AD hypotheses كتير، وتشرح دور الـ amyloid على الـ synapse والـ astrocytes والـ microglia"
      - "تحفظ الـ APOE e4 بالأرقام"
      - "تعرف الـ plaques والـ tangles وأماكنهم"
    status: unverified
    steps:
      - kind: explain
        page: 56
        quote: "various hypotheses, such as the cholinergic, amyloid, tau protein, inflammatory, oxidative stress, metal ion, glutamate excitotoxicity, microbiota-gut-brain axis"
        title: "مفيش سبب واحد"
        text: |
          الكتاب بيقول إن فهمنا للـ AD فيه ==various hypotheses==:
          - **cholinergic**، **amyloid**، **tau protein**.
          - **inflammatory**، **oxidative stress**، **metal ion**.
          - **glutamate excitotoxicity**، **microbiota-gut-brain axis**، **abnormal autophagy**.
      - kind: figure
        page: 56
        quote: "binding to a variety of synaptic receptors such as PrPC, NMDA receptors, P75NTR, and mGluR5"
        title: "الـ amyloid بيعمل إيه؟"
        alt: "Amyloid-beta in the centre with four arrows. To the synapse: binds PrPC, NMDA, P75NTR and mGluR5, causing calcium overload, LTP loss, tau hyperphosphorylation and neuronal death. To glutamate: blocks EAAT reuptake causing excitotoxicity. To astrocytes: with TNF-alpha, IL-1alpha and C1q makes A1 astrocytes. To microglia: activates NLRP3 and cytokines that aggregate more amyloid."
        caption: "Aβ بيضرب في أربع جهات: الـ synapse، الـ glutamate، الـ astrocytes، والـ microglia. والـ APOE في الطبيعي بيشيل الـ Aβ."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="D04a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <circle cx="165" cy="150" r="34" class="fg-bad"/>
            <text x="150" y="156" class="t-lg t-b">Aβ</text>
            <rect x="10" y="10" width="150" height="70" rx="8" class="fg-box"/>
            <text x="18" y="30" class="t-sm t-b">Synapse receptors</text>
            <text x="18" y="48" class="t-sm">NMDA, PrPC, mGluR5</text>
            <text x="18" y="66" class="t-sm t-bad">Ca²⁺ ↑, LTP ↓, tau-P</text>
            <rect x="170" y="10" width="150" height="70" rx="8" class="fg-box"/>
            <text x="178" y="30" class="t-sm t-b">Glutamate</text>
            <text x="178" y="48" class="t-sm">blocks EAAT reuptake</text>
            <text x="178" y="66" class="t-sm t-bad">excitotoxicity</text>
            <rect x="10" y="220" width="150" height="70" rx="8" class="fg-box"/>
            <text x="18" y="240" class="t-sm t-b">Astrocytes</text>
            <text x="18" y="258" class="t-sm">+ TNFα, IL-1α, C1q</text>
            <text x="18" y="276" class="t-sm t-bad">A1 phenotype</text>
            <rect x="170" y="220" width="150" height="70" rx="8" class="fg-box"/>
            <text x="178" y="240" class="t-sm t-b">Microglia</text>
            <text x="178" y="258" class="t-sm">NLRP3 → cytokines</text>
            <text x="178" y="276" class="t-sm t-bad">more Aβ aggregation</text>
            <path d="M145 124L110 84" class="fg-arrow-bad" marker-end="url(#D04a)"/>
            <path d="M185 124L220 84" class="fg-arrow-bad" marker-end="url(#D04a)"/>
            <path d="M145 176L110 216" class="fg-arrow-bad" marker-end="url(#D04a)"/>
            <path d="M185 176L220 216" class="fg-arrow-bad" marker-end="url(#D04a)"/>
          </svg>
      - kind: explain
        page: 57
        quote: "APOE, primarily released from astrocytes, associates with lipoproteins to form APOE-associated lipoprotein particles, which can bind to soluble Aβ"
        title: "الـ APOE: عامل النظافة"
        text: |
          الـ ==APOE== بيطلع أساسًا من الـ **astrocytes**، يمسك في lipoproteins ويكوّن particles بتمسك الـ **soluble Aβ** وتشيله (clearance).

          يعني لو الـ APOE نسخته وحشة (زي e4)، النظافة تقل والـ amyloid يتراكم.
      - kind: order
        page: 58
        quote: "This process promotes the assembly and activation of NLRP3, leading to the release of pro-inflammatory cytokines, which further exacerbate the aggregation of Aβ."
        prompt: "رتّب الحلقة المفرغة في الـ microglia:"
        steps:
          - "Aβ binds pattern recognition receptors"
          - "NLRP3 activates"
          - "Cytokines released"
          - "More Aβ aggregation"
        why: "دي vicious cycle: الـ Aβ بيشغّل الـ **NLRP3**، الـ cytokines تطلع، والـ cytokines نفسها تزوّد الـ aggregation فيرجع يشغّل الـ microglia أكتر."
      - kind: explain
        page: 58
        quote: "This reduction may consequently impair the activation of microglial cells, thereby compromising their ability to clear amyloid plaques."
        title: "الـ TREM2"
        text: |
          الـ variant ==TREM2 R47H== ممكن يقلّل ربط الـ TREM2 بالـ APOE-Aβ والـ phospholipids.

          النتيجة: الـ **microglia** ماتتنشطش كويس، فـ **ability to clear amyloid plaques** تقل.
      - kind: explain
        page: 59
        quote: "Aberrant cholesterol metabolism."
        title: "الـ signaling pathways"
        text: |
          الكتاب بيعدّ 8 pathways:
          - **Neuroinflammatory** signaling.
          - **Lysosomal dysfunction** (V-ATPase acidification، lysosomal calcium).
          - ==Aberrant cholesterol metabolism==.
          - **Mitochondrial dysfunction**: طاقة أقل وoxidative stress أكتر.
          - **Calcium signaling**: الكالسيوم العالي يبوّظ الـ protein folding في الـ ER.
          - **Insulin** signaling و**neurotrophic** signaling.
          - **BBB dysfunction**: حاجات تدخل وتخرج من المخ غلط.
      - kind: aside
        tone: joke
        page: 59
        quote: "Insulin signaling in AD."
        text: "الـ **insulin signaling** في القايمة؟ أيوه، علشان كده ناس بتسمّي الزهايمر «type 3 diabetes». يعني حتى المخ مش سالم من الكنافة."
      - kind: explain
        page: 61
        quote: "Most potent risk factor - presence of the apolipoprotein e4 (APOE e4) allele."
        title: "الـ APOE e4 بالأرقام"
        text: |
          أقوى ==risk factor==: الـ **APOE e4 allele**.
          - Lifetime risk من غير e4: **9%**.
          - مع e4 واحد على الأقل: **29%**.

          بس الـ e4 **not sufficiently specific or sensitive**، فمش test تشخيصي.

          وفيه risk factors تانية: head injury، **low folate و B12**، **high homocysteine**، family history، تعليم أقل، دخل أقل. واللي بيقلّل: **education** أعلى و**fish** أكتر.
      - kind: check
        page: 61
        quote: "e4 genotype is not sufficiently specific or sensitive for the diagnosis of AD to allow its use as a diagnostic test."
        question: "ليه مانطلبش APOE e4 علشان نشخّص AD؟"
        options: ["Not sensitive or specific enough", "It's always negative in AD", "It's only in Down's syndrome", "It measures tau"]
        answer: 0
        why:
          - "صح: الـ genotype مش specific ولا sensitive كفاية."
          - "غلط: الـ e4 بيرفع الـ risk لـ 29%."
          - "ملوش علاقة بالـ Down's."
          - "الـ tau بيتقاس في الـ plasma p-tau، مش الـ APOE."
      - kind: explain
        page: 62
        quote: "senile plaques (composed of b-amyloid polypeptides) between neurons and neurofibrillary tangles (made up partly of a protein named tau"
        title: "التشخيص والـ pathology"
        text: |
          الـ **diagnostic criteria**: cognitive impairment يعمل social أو occupational disability في **at least two domains** من: memory، language، calculations، orientation، judgment.

          وتحت الميكروسكوب حاجتين:
          - ==senile plaques== (β-amyloid) **between** neurons.
          - ==neurofibrillary tangles== (tau) **within** neurons.

          والأكتر تدمير: الـ **cholinergic neurons**.
      - kind: mnemonic
        page: 62
        quote: "senile plaques (composed of b-amyloid polypeptides) between neurons and neurofibrillary tangles (made up partly of a protein named tau"
        word: "PATT"
        parts:
          - { key: "P", text: "Plaques" }
          - { key: "A", text: "Amyloid, outside (between neurons)" }
          - { key: "T", text: "Tangles" }
          - { key: "T", text: "Tau, inside (within neurons)" }
        hook: "**PA** بره، **TT** جوه: الـ plaques/amyloid بين الخلايا، والـ tangles/tau جوه الخلية."
      - kind: try
        items: [geri.L04.011, geri.L04.016, geri.L04.024, geri.L04.030]
    recap:
      - "AD hypotheses: cholinergic، amyloid، tau، inflammatory، oxidative، metal، glutamate، gut-brain، autophagy."
      - "Aβ: synapse receptors، يمنع glutamate reuptake، A1 astrocytes، NLRP3 في الـ microglia."
      - "APOE بيشيل الـ Aβ؛ TREM2 R47H بيضعّف الـ microglia."
      - "APOE e4: 9% ← 29% lifetime risk، ومش test تشخيصي."
      - "Plaques (amyloid) بره، tangles (tau) جوه؛ cholinergic neurons."
    practice: [geri.L04.011, geri.L04.012, geri.L04.013, geri.L04.014, geri.L04.015, geri.L04.016, geri.L04.017, geri.L04.018, geri.L04.019, geri.L04.020, geri.L04.021, geri.L04.022, geri.L04.023, geri.L04.024, geri.L04.025, geri.L04.026, geri.L04.027, geri.L04.028, geri.L04.029, geri.L04.030, geri.L04.031, geri.L04.116]
  # ------------------------------------------------------------------
  - id: geri.L04.lesson3
    title: "اكتشفه بدري وعالجه: من الـ MMSE للـ lecanemab"
    hook: "ثلاثين نقطة في عشر دقايق بتقولك المخ فين. والعلاج؟ من حبوب بتعوّض الـ acetylcholine لـ antibodies بتشيل الـ amyloid."
    minutes: 9
    pages: [62, 65]
    topics: [ad-diagnosis, ad-treatment]
    goals:
      - "تعرف الـ early warning signs وخطوات الـ evaluation بالترتيب"
      - "تحسب وتفسّر الـ MMSE"
      - "تفرّق الـ AD drugs بالـ mechanism والجرعة"
    status: unverified
    steps:
      - kind: explain
        page: 62
        quote: "Gradual loss of short-term memory • Mood or personality changes • Problems finding or speaking the right word"
        title: "علامات الإنذار"
        text: |
          ==Early warning signs==:
          - **Gradual loss of short-term memory**.
          - تغيير في الـ **mood or personality**.
          - مش لاقي الكلمة (**word finding**).
          - مش عارف يتعرّف على الحاجات.
          - نسي يستخدم حاجة بسيطة زي **pencil**.
          - ينسى يقفل الـ **stove** أو الشبابيك أو الباب.
      - kind: order
        page: 62
        quote: "History (family,friends)-degree of change in ADL and in personal behaviour 2. Physical examination"
        prompt: "رتّب الـ evaluation زي الكتاب:"
        steps:
          - "History from family"
          - "Physical examination"
          - "Cognitive assessment"
          - "Labs and biomarkers"
          - "Imaging"
          - "Gold standard tests"
        why: "الكتاب بيبدأ بالـ **history** من العيلة (التغيير في الـ ADL)، وده بالظبط إجابة سؤال آخر المحاضرة: comprehensive clinical assessment قبل الـ MRI أو الدوا."
      - kind: explain
        page: 63
        quote: "Plasma Phosphorylated tau (ptau) is a specific blood biomarker for Alzheimer disease (AD) pathology, with p- tau217 considered to have the most utility."
        title: "الـ blood biomarker"
        text: |
          الـ **plasma phosphorylated tau** (p-tau) هو **specific blood biomarker** للـ AD pathology، وأفيدهم ==p-tau217==.
      - kind: table
        page: 63
        quote: "Marked cognitive dysfunction may be diagnosed as dementia"
        title: "الـ MMSE (من 30)"
        columns: ["Score", "Meaning"]
        rows:
          - ["30-29", "Normal"]
          - ["28-26", "Borderline"]
          - ["25-18", "Marked: may be dementia"]
          - ["Under 17", "Severe dementia"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: tip
        page: 63
        quote: "Mini-Mental State Examination"
        text: "الـ **MMSE** (Mini-Mental State Examination) مقسوم: orientation 10 (5 زمن + 5 مكان)، registration 3، serial 7s 5، recall 3، وlanguage 9 (تسمية 2، تكرار 1، أمر من 3 خطوات 3، قراءة وكتابة ورسم 3). المجموع 30، ويقعد 10-15 دقيقة."
      - kind: check
        page: 63
        quote: "Marked cognitive dysfunction may be diagnosed as dementia"
        question: "MMSE = 27/30 in a 70-year-old. Interpretation?"
        options: ["Borderline cognitive dysfunction", "Normal", "Marked dysfunction, dementia", "Severe dementia"]
        answer: 0
        why:
          - "صح: 28-26 borderline."
          - "الـ normal 30-29."
          - "الـ marked من 25 لـ 18."
          - "الـ severe أقل من 17."
      - kind: explain
        page: 63
        quote: "Prevention 2. Reversal (intoxication, depression,cerebral lesions) 3. Stabilization/ slowing of progression"
        title: "الـ medical management"
        text: |
          1. **Prevention**.
          2. **Reversal** للي يتعكس: intoxication، depression، cerebral lesions.
          3. ==Stabilization/slowing==: acetylcholinesterase inhibitors، anti-inflammatories، oestrogens، drugs تانية.
          4. علاج الـ **behavioural problems**.
      - kind: table
        page: 64
        quote: "Donepezil (Aricept) Serum half-life (hr) 70-80"
        title: "التلاتة والرابع"
        columns: ["Drug", "Start / max"]
        rows:
          - ["Donepezil", "5 mg / 10 mg daily"]
          - ["Rivastigmine", "1.5 / 6 mg twice daily"]
          - ["Galantamine", "4 / 12 mg twice daily"]
          - ["Memantine (NMDA)", "5 mg daily / 10 mg bd"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: reveal
        page: 64
        quote: "Cholinesterase inhibitor NMDA-receptor antagonist"
        prompt: "ليه الـ cholinesterase inhibitors بتشتغل في الزهايمر بالذات؟"
        answer: "لأن الزهايمر بيدمّر **cholinergic neurons** أكتر حاجة، فالـ acetylcholine يقل. الـ **donepezil** والـ **rivastigmine** والـ **galantamine** بيمنعوا تكسيره فيفضل أكتر في الـ synapse. والـ **memantine** شغلته تانية: يهدّي الـ NMDA اللي الـ glutamate الزيادة بيضربه."
      - kind: match
        page: 64
        quote: "Donepezil (Aricept) Serum half-life (hr) 70-80"
        prompt: "وصّل كل دوا بالصفة اللي بتميّزه:"
        pairs:
          - ["Donepezil", "Half-life 70-80 h, once daily"]
          - ["Rivastigmine", "Pseudo-irreversible, nonhepatic"]
          - ["Memantine", "NMDA-receptor antagonist"]
          - ["Tacrine", "Withdrawn in 2013"]
          - ["Brexpiprazole", "Agitation in AD (2023)"]
        why: "الـ donepezil عمره طويل فمرة واحدة في اليوم؛ الـ rivastigmine serum half-life ساعتين بس تأثيره على الـ enzyme 8 ساعات؛ الـ memantine الوحيد NMDA antagonist؛ الـ tacrine اتسحب للـ adverse effects."
      - kind: explain
        page: 64
        quote: "In June 2021, the FDA authorized the first disease-modifying medication and major approval for AD in almost 2 decades, aducanumab"
        title: "الـ disease-modifying drugs"
        text: |
          - **June 2021**: الـ FDA وافق على ==aducanumab==، أول **disease-modifying** دوا.
          - **January 2023**: ==lecanemab==.
      - kind: update
        page: 64
        quote: "In January 2023, the agency approved another, lecanemab"
        text: "الـ aducanumab اتوقف من الشركة سنة 2024. الـ lecanemab أخد full approval في يوليو 2023، والـ donanemab اتوافق عليه في يوليو 2024. الاتنين للـ early AD مع amyloid مؤكد، ومحتاجين MRI متابعة للـ ARIA."
        ref: "FDA approvals, 2023-2024"
      - kind: explain
        page: 65
        quote: "Functional- (\"Cueing and scheduling\"), activity C. Psychosocial D. Education E. Care of the family F. On-going care"
        title: "وبعد الدوا"
        text: |
          الـ ==behavioural symptoms== ليها جدول drugs (risperidone، quetiapine، haloperidol بجرعات صغيرة جدًا، citalopram، sertraline، mirtazapine...)، كلها **start low**.

          وباقي الـ management:
          - **Functional**: cueing and scheduling، activity.
          - **Psychosocial**، **education**، **care of the family**، **on-going care**.
