  - id: res.L04.lesson6
    title: "الـ case report والـ case series والـ exploratory"
    hook: "عيان واحد غريب ممكن يفتح باب مرض جديد، بس عمره ما يثبت سبب."
    minutes: 8
    pages: [34, 50]
    topics: [case-reports, exploratory]
    goals:
      - "تفرق بين case report وcase series"
      - "تعرف مزايا وعيوب الـ case report"
      - "تعرف إمتى نعمل exploratory study"
    status: unverified
    steps:
      - kind: explain
        page: 34
        quote: "Case reports and case series are near the bottom of the hierarchy of what counts as reliable evidence for clinical decision-making.\nA case report (or case study) usually describes a single unique case or finding of interest (unusual finding)."
        title: "Case report: عيان واحد غريب"
        text: |
          الـ ==case report== بيوصف **حالة واحدة** فريدة أو finding غير معتاد. وهو مع الـ case series ==near the bottom== في هرم الأدلة.

          مثال المحاضرة: راجل كبير عنده Alzheimer بياكل **20–30 بيضة يوميًا** لمدة 15 سنة تقريبًا، والـ low-density lipoprotein (LDL) بتاعه 142 mg/dL بس ومن غير atherosclerosis مهمة. جسمه اتأقلم: قلّل امتصاص الكوليسترول، قلّل تصنيعه، وزوّد تحويله لـ bile acid.
      - kind: aside
        tone: joke
        page: 35
        quote: "Example of case report study:\n  A case of an old man with Alzheimer's disease who has been eating 20-30 eggs every day for almost 15 years.\n  The man had an LDL-cholesterol level of only 142 mg/dL (3.68 mmol/L) and no significant clinical atherosclerosis.\n  His body adapted by reducing the intestinal absorption of cholesterol, lowering the rate of its synthesis and increasing the rate of its conversion into bile acid.\n  This is indeed an unusual case of biological adaptation to a major change in dietary intake."
        text: |
          **20–30 eggs** في اليوم لمدة 15 سنة والكوليسترول تمام 😳 ده case report، مش نصيحة غذائية. ماتروحش تقول لعيان الـ dyslipidemia «في دراسة قالت البيض مالوش دعوة».

          وده بالظبط عيب الـ case report: **lack of ability to generalize**.
      - kind: table
        page: 36
        quote: "Types of case report\n| Type | Feature |\n|---|---|\n| Disease Identification | Previously unknown or variant of known condition; Reader must avoid generalization of the rare condition |\n| Adverse Drug Reaction (ADR) Reporting | Most common source of information for drug removal; Excellent in identifying rare and serious ADRs; Utility in identifying ADRs in special populations |\n| New Treatment Approach | Generally used to generate a hypothesis for further testing with a more resource-intensive design; May lead to unsubstantiated use of medications for unapproved indications |\n| Educational | Present a scenario to help clinicians improve practice skills |\n| Quality Assurance | Practice errors can illustrate problems to avoid by other practitioners |"
        title: "Types of case report"
        columns: ["Type", "Feature"]
        rows:
          - ["Disease identification", "New condition or variant of a known one"]
          - ["Adverse drug reaction", "Most common source for drug removal"]
          - ["New treatment approach", "Generates a hypothesis to test"]
          - ["Educational", "Scenario to improve practice skills"]
          - ["Quality assurance", "Practice errors to avoid"]
        hide: [[1, 1], [2, 1]]
      - kind: figure
        page: 37
        quote: "The stages of a Case Study / Case Report / Case Series: one patient (case report), then a few patients, then a group of patients (case series)"
        title: "واحد ولا مجموعة؟"
        alt: "Left panel: a doctor arrow to one patient, labelled case report. Right panel: a doctor arrow to five patients with the same disease, labelled case series, no control group."
        caption: "**Case report** = حالة واحدة. **Case series** = مجموعة عندهم نفس المرض واتعالجوا بنفس الطريقة، ==من غير control group==."
        svg: |
          <svg viewBox="0 0 330 280" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R04b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <rect x="8" y="8" width="314" height="110" rx="8" class="fg-thin"/>
            <circle cx="50" cy="48" r="14" class="fg-acc"/>
            <rect x="38" y="66" width="24" height="34" rx="6" class="fg-acc"/>
            <path d="M80 70L140 70" class="fg-arrow-acc" marker-end="url(#R04b)"/>
            <circle cx="180" cy="48" r="14" class="fg-ink"/>
            <rect x="168" y="66" width="24" height="34" rx="6" class="fg-ink"/>
            <text x="240" y="62" class="t-b">Case report</text>
            <text x="240" y="82" class="t-sm t-mut">one case</text>
            <rect x="8" y="132" width="314" height="140" rx="8" class="fg-thin"/>
            <circle cx="50" cy="172" r="14" class="fg-acc"/>
            <rect x="38" y="190" width="24" height="34" rx="6" class="fg-acc"/>
            <path d="M80 194L118 194" class="fg-arrow-acc" marker-end="url(#R04b)"/>
            <g class="fg-ink">
              <circle cx="140" cy="176" r="9"/><rect x="132" y="188" width="16" height="22" rx="4"/>
              <circle cx="170" cy="176" r="9"/><rect x="162" y="188" width="16" height="22" rx="4"/>
              <circle cx="200" cy="176" r="9"/><rect x="192" y="188" width="16" height="22" rx="4"/>
              <circle cx="230" cy="176" r="9"/><rect x="222" y="188" width="16" height="22" rx="4"/>
              <circle cx="260" cy="176" r="9"/><rect x="252" y="188" width="16" height="22" rx="4"/>
            </g>
            <text x="200" y="238" text-anchor="middle" class="t-b">Case series</text>
            <text x="200" y="258" text-anchor="middle" class="t-sm t-bad">same disease, no control group</text>
          </svg>
      - kind: explain
        page: 38
        quote: "A case series (or clinical study):\n  Case series studies are commonly used to report on a group of patients with a defined disease who have been treated in a similar manner (without a control group).\n  A type of descriptive observational study useful for identifying similar or differing characteristics between selected cases.\n  Can be prospective or retrospective and usually involves only a small number of individuals.\n  Can include either non-consecutive (includes some, but not all, of the eligible patients) or consecutive individuals (include all cases) with the same condition or disease.\n  The information gained from a case series can be used to generate clinical hypotheses which can be tested by stronger study designs such as case control study."
        title: "Case series بالتفصيل"
        text: |
          - **Descriptive observational** study، بتطلع الصفات المتشابهة أو المختلفة بين حالات مختارة.
          - ممكن تكون ==prospective or retrospective== وعادة عدد صغير.
          - **Consecutive** = كل الحالات المؤهلة، **non-consecutive** = بعضها بس.
          - فايدتها: ==generate clinical hypotheses== تتختبر بعدين بـ design أقوى زي **case-control**.

          مثال: كل حالات **bone marrow depression** في مستشفى، والأدوية والـ risk factors عندهم. ده وصف مجموعة، مفيش مقارنة.

          الدكتورة قالت في الشرح: إن دوا معين طالع كتير بين الحالات ده لوحده ما يكفيش نقيس أثره، لأننا مش عارفين نسبته عند الناس اللي ما عندهمش المرض. الخطوة الجاية: **case-control** يختبر الـ hypothesis. ونفس السبب بيخلّي الـ case series ما تثبتش إن علاج نافع: مش عارفين كان هيحصل إيه من غير العلاج.
      - kind: reveal
        page: 39
        quote: "Example of case series study\nData were collected on patients who had bone marrow\ndepression at one hospital. Potential risk factors including\ndrugs known to induce bone marrow depression were\nassessed for all patients. The description of all patients with\nbone marrow depression and the frequency of potential risk\nfactors for bone marrow depression is case series study"
        prompt: "اتجمعت داتا عن كل العيانين اللي عندهم bone marrow depression في مستشفى واحد، ومعاها الأدوية اللي ممكن تعمله. ده نوعه إيه، وليه؟"
        answer: |
          ==Case series== (slide 39): وصف لكل العيانين اللي عندهم نفس الحالة، ومعاه **frequency** الـ risk factors المحتملة.

          ليه مش analytic؟ لأن مفيش مجموعة مقارنة من غير bone marrow depression، فمانقدرش نقول الدوا ده أكتر عندهم من غيرهم. التفسير المقبول (مش في الكتاب).
      - kind: sort
        page: 40
        quote: "Merits and limitations of case report\n| Merits | Limitations |\n|---|---|\n| Detecting novelties (emerging/new disease) | Lack of ability to generalize |\n| Generating hypotheses | No possibility to establish cause-effect relationship |\n| Unexplained outcome of treatment | Difficult to replicate |\n| High applicability: allows detailed investigation into situations which would be unethical or impractical to perform using another study design | Publication bias: tendency of investigators (to submit) or reviewers or editors (to accept) manuscripts for publication based on the direction or strengths of study findings |\n| Provide very detailed information | Retrospective design |\n| Educational value (present a scenario to help clinician to improve clinical skills). | distraction of reader when focusing on the unusual. |"
        prompt: "Merit ولا limitation للـ case report؟"
        bins: ["Merit", "Limitation"]
        cards:
          - { text: "Detecting novelties (new disease)", bin: 0 }
          - { text: "Generating hypotheses", bin: 0 }
          - { text: "Very detailed information", bin: 0 }
          - { text: "Educational value", bin: 0 }
          - { text: "Cannot establish cause-effect", bin: 1 }
          - { text: "Difficult to replicate", bin: 1 }
          - { text: "Publication bias", bin: 1 }
          - { text: "Cannot generalize", bin: 1 }
        why: "الـ case report بيكتشف الجديد ويدي تفاصيل ويعلّم، بس مايقدرش يعمم ولا يثبت سبب، وصعب يتكرر، وبيتأثر بالـ **publication bias** (اللي بيتبعت ويتقبل حسب اتجاه وقوة النتيجة)."
      - kind: check
        page: 40
        quote: "Merits and limitations of case report\n| Merits | Limitations |\n|---|---|\n| Detecting novelties (emerging/new disease) | Lack of ability to generalize |\n| Generating hypotheses | No possibility to establish cause-effect relationship |\n| Unexplained outcome of treatment | Difficult to replicate |\n| High applicability: allows detailed investigation into situations which would be unethical or impractical to perform using another study design | Publication bias: tendency of investigators (to submit) or reviewers or editors (to accept) manuscripts for publication based on the direction or strengths of study findings |\n| Provide very detailed information | Retrospective design |\n| Educational value (present a scenario to help clinician to improve clinical skills). | distraction of reader when focusing on the unusual. |"
        question: "Case reports are most useful when:"
        options:
