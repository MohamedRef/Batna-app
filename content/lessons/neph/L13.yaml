  - id: neph.L13.lesson4
    title: "العلاج: من الـ A1C للـ SGLT2 والـ finerenone"
    hook: "الكلاسيك لسه مهم، بس الأدوية الجديدة هي اللي بتغيّر مستقبل الكلية."
    minutes: 10
    pages: [438, 446]
    topics: [glycemia, bp, sglt2, future]
    goals:
      - "تحفظ أهداف الـ A1C والضغط وليه الـ A1C بيكدب في CKD 4-5"
      - "تشرح الـ SGLT2 inhibitors والـ MRA والـ GLP-1"
      - "تظبط الـ metformin حسب الـ eGFR"
    status: unverified
    steps:
      - kind: explain
        page: 438
        title: "العلاج الكلاسيكي"
        quote: "Glycemic control. Blood pressure control. Treatment of dyslipidemia. Management of anemia. Management of Hyperphosphatemia."
        text: |
          خمسة: **glycemia**، **BP**، **dyslipidemia**، **anemia**، **hyperphosphatemia**.

          **A1C:**
          - **ADA:** ==<7%== لأغلب الكبار.
          - **ACP 2018:** **7-8%** أنسب.
          - الأوطى (<6%) بيقلل الـ DKD بس على حساب **hypoglycemia** و polypharmacy و **mortality أعلى**.
      - kind: reveal
        page: 438
        quote: "A1C measurements in patients with chronic kidney disease stage 4 or 5 may be falsely low because of shortened red-cell survival time"
        prompt: "عيان CKD stage 5، الـ A1C بتاعه 5.9% والسكر في البيت 250. مين الصح؟"
        answer: "السكر في البيت. الـ A1C بيقيس الـ glucose اللي لزق في الـ Hb على مدى عمر كرة الدم. في الـ CKD 4-5 كرات الدم بتعيش **أقل** ومعاها **anemia**، فالـ A1C يطلع ==falsely low==. استخدم **routine glucose monitoring**."
      - kind: explain
        page: 438
        title: "الضغط والـ MRA"
        quote: "Specifically, 130/80 mm Hg is considered the target blood pressure in subjects with albuminuria."
        text: |
          - **JNC 8:** **140/90** لكل مرضى السكر أو الـ CKD.
          - **ADA:** ==130/80== لو فيه **albuminuria**.

          **Aldosterone breakthrough:** إضافة **MRA** على ACEi أو ARB بتقلل الـ albuminuria. الـ **spironolactone** قلّلها عن الـ placebo، والـ **finerenone** حسّن الـ ACR.
      - kind: update
        page: 438
        quote: "Based on recent trials, the Eight Joint National Committee recommended a blood pressure of 140/90 mm Hg for all patients with diabetes mellitus or CKD."
        ref: "KDIGO 2021 blood pressure in CKD guideline"
        text: "الـ KDIGO 2021 بيقترح systolic أقل من 120 لو العيان مستحمل. في الامتحان اكتب أرقام الكتاب: 140/90 و130/80 مع الـ albuminuria."
      - kind: figure
        page: 441
        quote: "Diminshed distal Na delivery and hyperfiltration"
        title: "الـ SGLT2 inhibitor بيرجّع الـ feedback"
        alt: "Two panels. Diabetes: SGLT2 reabsorbs more glucose and sodium, so little sodium reaches the macula densa; tubuloglomerular feedback is off, the afferent arteriole dilates and GFR is 120 percent. Diabetes plus SGLT2 inhibitor: more sodium reaches the macula densa, feedback constricts the afferent arteriole and GFR falls to 90 percent."
        caption: "في السكر: diminished distal Na delivery و hyperfiltration. الـ SGLT2i بيخلّي الـ Na يوصل للـ macula densa، فالـ ==tubuloglomerular feedback== يقفل الـ afferent، فالضغط جوه الـ glomerulus والـ albuminuria يقلّوا."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L13b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="10" y="10" width="310" height="132" rx="10" class="fg-bad"/>
            <text x="20" y="30" class="t-sm t-b t-bad">Diabetes</text>
            <text x="20" y="52" class="t-sm">SGLT2 reabsorbs more glucose + Na</text>
            <path d="M30 60 V74" class="fg-arrow" marker-end="url(#L13b)"/>
            <text x="20" y="90" class="t-sm">Little Na reaches macula densa</text>
            <path d="M30 98 V112" class="fg-arrow" marker-end="url(#L13b)"/>
            <text x="20" y="130" class="t-sm">Afferent dilates → GFR <tspan class="t-b t-bad">120%</tspan></text>
            <rect x="10" y="156" width="310" height="132" rx="10" class="fg-good"/>
            <text x="20" y="176" class="t-sm t-b t-good">Diabetes + SGLT2 inhibitor</text>
            <text x="20" y="198" class="t-sm">SGLT2 blocked: more Na stays in tubule</text>
            <path d="M30 206 V220" class="fg-arrow" marker-end="url(#L13b)"/>
            <text x="20" y="236" class="t-sm">Na reaches macula densa: feedback on</text>
            <path d="M30 244 V258" class="fg-arrow" marker-end="url(#L13b)"/>
            <text x="20" y="276" class="t-sm">Afferent constricts → GFR <tspan class="t-b t-good">90%</tspan></text>
          </svg>
      - kind: check
        page: 441
        quote: "SGLT2 inhibitors induce renal arteriolar vasoconstriction: glomerular hypertension albuminuria"
        question: "A patient's eGFR falls slightly 2 weeks after starting dapagliflozin. Best explanation?"
        options:
          - "Afferent vasoconstriction from restored tubuloglomerular feedback"
          - "Acute tubular necrosis from the drug"
          - "Efferent arteriolar dilation"
          - "Volume overload"
        answer: 0
        why:
          - "صح: ده الـ mechanism اللي بيحمي الكلية (ص 441)."
          - "مش toxic؛ الـ effect hemodynamic."
          - "ده mechanism الـ ACEi/ARB."
          - "الـ SGLT2i بيعمل natriuresis."
      - kind: table
        page: 442
        quote: "Among patients with chronic kidney disease, the risk of any composite kidney or cardiovascular outcomes or death was significantly lower with dapagliflozin than with placebo."
        title: "التجارب اللي في المحاضرة"
        columns: [Trial, Drug, Message]
        rows:
          - ["EMPA-REG", "Empagliflozin", "Renoprotection regardless of ACEi, diuretics, CCB, NSAIDs"]
          - ["CANVAS", "Canagliflozin", "Benefit at all albuminuria levels; biggest absolute benefit with severe albuminuria"]
          - ["DAPA-CKD", "Dapagliflozin", "CKD ± diabetes: fewer kidney, CV events and deaths (9.2% vs 14.5%)"]
          - ["FIDELIO-DKD", "Finerenone", "T2D + CKD: less CKD progression (HR 0.82) and CV events"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 443
        title: "الـ GLP-1 والـ KDIGO algorithm"
        quote: "Treatment algorithm for selecting glucose-lowering drugs for patients with type 2 diabetes (T2D) and chronic kidney disease (CKD)."
        text: |
          الـ **GLP-1** بيحمي الكلية: أقل free radicals، **vasodilation**، أقل **inflammation**، وأقل **apoptosis** فأقل **fibrosis**.

          الـ KDIGO (Figure 23):
          1. **Lifestyle:** activity، nutrition، weight loss
          2. **First-line:** ==metformin + SGLT2 inhibitor==
          3. **Add-on:** **GLP-1 RA (preferred)**، بعدين DPP-4i، insulin، SU، TZD، alpha-glucosidase inhibitor
      - kind: sort
        page: 443
        quote: "Treatment algorithm for selecting glucose-lowering drugs for patients with type 2 diabetes (T2D) and chronic kidney disease (CKD)."
        prompt: "حسب Figure 23 و 27 (glucose-lowering drugs in T2D and CKD): إيه اللي يحصل للدوا؟"
        bins: ["Keep or start", "Reduce dose", "Stop or don't start"]
        cards:
          - { text: "Metformin, eGFR 50", bin: 0 }
          - { text: "Metformin, eGFR 38", bin: 1 }
          - { text: "Metformin, eGFR 25", bin: 2 }
          - { text: "SGLT2i, eGFR 24", bin: 0 }
          - { text: "Start SGLT2i, eGFR 17", bin: 2 }
          - { text: "SGLT2i on dialysis", bin: 2 }
        why: "الـ metformin: كامل فوق 45، نص الجرعة 30-44، وقف تحت 30. الـ SGLT2i: ما تبدأش تحت 20، ووقّفه في الـ dialysis (الـ holistic figure: كمّل لحد الـ dialysis أو الـ transplant)."
      - kind: explain
        page: 445
        title: "المستقبل"
        quote: "ETA-selective antagonists (Atrasentan) have been shown to provide renoprotective effects"
        text: |
          - **Growth factors:** IGF-1، GH، **TGF-β**، anti-VEGF، **endothelin-1 (ETA) antagonists** زي ==atrasentan== فوق الـ RAAS blockade.
          - **Anti-TGF-β:** الـ TGF-β **fibrogenic** ومهم في الـ DKD (نجح في الحيوانات).
          - **Biochemical:** PKC inhibitors، منع تكوين الـ **AGE**، AGE cross-link breakers، blockade للـ receptor بتاع الـ AGE.
      - kind: aside
        tone: tip
        page: 446
        quote: "Holistic approach for improving outcomes in patients with diabetes and chronic kidney disease"
        text: |
          **الـ holistic approach** في سطرين: lifestyle للكل، وبعدين **SGLT2i + metformin** (T2D)، **RAS inhibitor** بأقصى جرعة لو HTN، و **statin**.

          بعدها حسب الحاجة: GLP-1 RA، **nonsteroidal MRA** (ACR ≥30 و K طبيعي)، CCB أو diuretic، steroidal MRA للـ resistant HTN (eGFR ≥45)، antiplatelet للـ ASCVD. وراجع كل **3-6 شهور**.
