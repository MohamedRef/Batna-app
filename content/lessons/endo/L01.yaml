        remind: [endo.L01.081]
        page: 12
        quote: "Mixed Syndromes\n  Von Hipple-Lindau syndrome, islet cell tumor, renal cell carcinoma, hemangioblastoma of CNS, retinal angiomas.\n  Neurofibromatosis with features of MEN 1 or 2.\n  Myxomas of the heart, skin and breast.\n  Spotty cutaneous pigmentation.\n  Testicular, adrenal, and GH-producing pituitary tumors.\n  Peripheral nerve schwanomas."
        title: "Mixed syndromes"
        text: |
          متلازمات بتتداخل مع MEN:
          - **Von Hippel-Lindau**: islet cell tumor، renal cell carcinoma، central nervous system (CNS) hemangioblastoma، retinal angiomas.
          - **Neurofibromatosis** مع features من MEN 1 أو 2.
          - Myxomas في القلب والجلد والـ breast، spotty cutaneous pigmentation، testicular و adrenal و GH-producing pituitary tumors.
          - Peripheral nerve schwannomas.

          ليه الكتاب بيذكرهم هنا؟ لأن كل واحدة منهم ممكن تعمل islet tumour أو pheo أو pituitary tumour، فتبان كأنها MEN. يعني لو لقيت ورم endocrine ومعاه حاجة "غريبة" زي retinal angioma أو myxoma في القلب أو نمش، فكّر في متلازمة تانية.
