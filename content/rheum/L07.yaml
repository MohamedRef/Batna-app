  - id: rheum.L07.056
    kind: mcq
    topic: activities
    stem: Which cells carry C3b-coated immune complexes through the circulation to the spleen, and by which receptor?
    options: ["Red blood cells, CR1", "Neutrophils, CR3", "Dendritic cells, CR2", "Platelets, CR4"]
    answer: 0
    why:
      - "Correct: RBCs express CR1 and take complexes to splenic macrophages (p121)."
      - CR3 on phagocytes is an opsonin receptor; the lecture's carrier is the RBC.
      - CR2 on dendritic cells binds C3d for memory, not clearance from blood.
      - The lecture does not give platelets this role.
    src: { page: 121, quote: "binding to RBCs (which express the CR1 receptor on their surface). RBCs clear" }
