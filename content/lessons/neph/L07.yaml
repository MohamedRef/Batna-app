      - "تطبّق الـ major و minor criteria"
    status: unverified
    steps:
      - kind: explain
        page: 169
        title: "TSC: tumor suppressor وقع"
        quote: "TSC results from inactivating mutations in one of two genes, TSC1 on chromosome 9q32-q34 and TSC2 on chromosome 16p13, adjacent to the PKD1 gene. Large deletions involving both PKD1 and TSC2 results in the PKD1/TSC2 (infantile severe polycystic kidney disease with tuber-ous sclerosis [PKDTS]) contiguous gene deletion syndrome. as tumor suppressor genes."
        text: |
          الـ ==tuberous sclerosis complex (TSC)== **autosomal dominant tumor-suppressor syndrome**: **hamartomas** في الكلى والمخ والقلب والرئة والجلد.

          - **tuberous sclerosis gene 1 (TSC1)** على 9q32–q34، **tuberous sclerosis gene 2 (TSC2)** على 16p13 ==جنب الـ PKD1==.
          - لو deletion كبيرة شالت الـ TSC2 والـ PKD1 مع بعض: **polycystic kidney disease with tuberous sclerosis (PKDTS)** (polycystic kidney شديد في الرضّع + TSC).
          - حوالي **70% sporadic**. في الـ sporadic الـ TSC2 أشهر **5 مرات**، والـ TSC1 أخف (second hits أقل).
      - kind: explain
        page: 170
        title: "الصورة الإكلينيكية"
        quote: "The clinical features of TSC1- and TSC2-linked disease are similar, although TSC2-linked disease tends to be more severe. The most common clinical manifestations include seizures, intellectual disability and/or autism, skin lesions, interstitial lung disease, and tumors in the brain, retina, kidney, and heart. In affected individuals over 5 years of age, the most common skin lesions are facial angiofibromas (Fig. 45.7), hypomelanotic macules, and ungual fibromas."
        text: |
          الأشهر: **seizures**، intellectual disability أو autism، جلد، **interstitial lung disease**، و tumors في المخ والشبكية والكلية والقلب.

          الجلد بعد 5 سنين: ==facial angiofibromas==، **hypomelanotic macules** (ash leaf)، **ungual fibromas**، و **shagreen patch**.
      - kind: explain
        page: 171
        title: "الكلية: AML ثم cysts ثم RCC"
        quote: "Kidney involvement occurs frequently in TSC, with renal lesions that include angiomyolipomas (AMLs; 85%), cysts (30% to 47%), and renal cell carcinoma (RCC) (2% to 3%).24,28 Other renal neoplasms, interstitial fibrosis with focal segmental glomerulosclerosis (FSGS), glomerular microhamartomas, and peripelvic and perirenal lymphangiomatous cysts also have been reported. Renal involvement in TSC often pro-gresses insidiously, but can result in considerable morbidity, including retroperitoneal hemorrhage, renal impairment (~1%), and death. Renal complications are the most frequent cause of death in TSC.24"
        text: |
          - ==acute myeloid leukaemia (AML) 85%==، **cysts 30–47%**، **renal cell carcinoma (RCC) 2–3%**.
          - ==Renal complications أشهر سبب وفاة في الـ TSC==: retroperitoneal hemorrhage و renal impairment.
          - الـ AML = **vessels سميكة + smooth muscle + دهون** (hamartoma). في الـ TSC: **multiple و bilateral**، نادرة قبل 5 سنين، و **80% عند 10 سنين**. الستات أكتر وأكبر، والـ **حمل** بيزوّد الـ rupture.
          - **Cysts + angiomyolipomas (AMLs) مع بعض على الـ computed tomography (CT)** = فكّر TSC.
      - kind: mnemonic
        page: 171
        quote: "Kidney involvement occurs frequently in TSC, with renal lesions that include angiomyolipomas (AMLs; 85%), cysts (30% to 47%), and renal cell carcinoma (RCC) (2% to 3%).24,28 Other renal neoplasms, interstitial fibrosis with focal segmental glomerulosclerosis (FSGS), glomerular microhamartomas, and peripelvic and perirenal lymphangiomatous cysts also have been reported. Renal involvement in TSC often pro-gresses insidiously, but can result in considerable morbidity, including retroperitoneal hemorrhage, renal impairment (~1%), and death. Renal complications are the most frequent cause of death in TSC.24"
