items:
  # ---------- p180-181: types ----------
  - id: rheum.L11.001
    kind: enumerate
    topic: types
    prompt: Main types of primary immunodeficiency in the lecture?
    points:
      - B-cell deficiencies
      - T-cell deficiencies
      - Combined T- and B-cell abnormalities
      - Complement deficiencies
      - Phagocyte deficiencies
      - Various or unknown (CVID)
    pass: 5
    src: { page: 180, quote: "B cell deficiencies. T cell deficiencies. Combined T cell & B cell abnormalities. Complement Deficiencies. Phagocyte deficiencies. Various unknown." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L11.002
    kind: table
    topic: types
    title: Primary immunodeficiencies by arm
    columns: [Group, Examples]
    rows:
      - [B cell, "X-linked agammaglobulinemia, selective immunoglobulin deficiency"]
      - [T cell, "DiGeorge (thymic aplasia), chronic mucocutaneous candidiasis, hyper-IgM, IL-12 receptor deficiency"]
      - [Combined, "SCID, Wiskott–Aldrich, ataxia-telangiectasia"]
      - [Complement, "Hereditary angioneurotic oedema, recurrent infections, autoimmune-like disease, PNH"]
      - [Various/unknown, Common variable immunodeficiency]
    blanks: [[0, 1], [1, 1], [2, 1], [4, 1]]
    src: { page: 180, quote: "Severe Combined Immunodeficiency Disease (SCID). Wiskott-Aldrich syndrome. Ataxia-telangiectasia." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L11.003
    kind: enumerate
    topic: types
    prompt: Phagocyte deficiencies listed in the lecture?
    points:
      - Leukocyte adhesion deficiency
      - Chronic granulomatous disease
      - Chédiak–Higashi syndrome
      - Job's (hyper-IgE) syndrome
      - Cyclic neutropenia
      - Myeloperoxidase deficiency
      - G6PD deficiency
      - Interferon-γ deficiency
    pass: 5
    src: { page: 181, quote: "Leukocyte adhesion deficiency. Chronic Granulomatous Disease (CGD). Chédiak-Higashi syndrome. Job's syndrome (Hyper-IgE syndrome). Cyclic neutropenia." }
    status: unverified
  - id: rheum.L11.004
    kind: card
    topic: types
    front: In the book's classification, where does hyper-IgM syndrome sit?
    back: Under T-cell deficiencies (the defect is CD40 ligand on T cells).
    src: { page: 180, quote: "T cell deficiencies DiGeorge's syndrome (Thymic aplasia). Chronic mucocutaneous candidiasis. Hyper-IgM syndrome." }
    status: unverified
  # ---------- p181-182: evaluation ----------
  - id: rheum.L11.005
    kind: enumerate
    topic: evaluation
    prompt: History in suspected immunodeficiency?
    points:
      - Type of infections (location, frequency, response to therapy)
      - Immunisations, especially live virus vaccines
      - Family history
      - Social and sexual history
    pass: 4
    src: { page: 181, quote: "Types of infections - location, frequency, and response to therapy. Immunizations, especially live virus vaccines. Family history. Social and sexual history." }
    status: unverified
  - id: rheum.L11.006
    kind: enumerate
    topic: evaluation
    prompt: Physical examination in suspected immunodeficiency?
    points:
      - Lymphoid tissue
      - Growth abnormalities
      - Other congenital abnormalities
      - Infections
    pass: 3
    src: { page: 181, quote: "Physical Examination. Evaluation of lymphoid tissue. Growth abnormalities. Other congenital abnormalities. Infections." }
    status: unverified
  - id: rheum.L11.007
    kind: table
    topic: evaluation
    title: Laboratory screening by arm
    columns: [Arm, Tests]
    rows:
      - [B cell, "Quantitative IgG, IgM, IgA; specific antibodies (tetanus, polio, rubella, isohemagglutinins)"]
      - [T cell, "WBC with % lymphocytes; T-cell enumeration and subsets; delayed hypersensitivity skin tests (PPD, mumps, Candida)"]
      - [Other, "WBC with % neutrophils and monocytes; serum complement"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 182, quote: "Quantitative immunoglobulins - IgG, IgM, IgA. Specific antibodies - anti-tetanus, polio virus, rubella, isohemagglutinins (anti-A, anti-B)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L11.008
    kind: card
    topic: evaluation
    front: What are isohemagglutinins and why test them?
    back: Natural anti-A and anti-B antibodies; low levels show poor B-cell antibody production.
    src: { page: 182, quote: "Specific antibodies - anti-tetanus, polio virus, rubella, isohemagglutinins (anti-A, anti-B)." }
    status: unverified
  # ---------- p182-184: clues ----------
  - id: rheum.L11.009
    kind: enumerate
    topic: clues
    prompt: Clinical features of primary immunodeficiency?
    points:
      - Chronic or recurrent infections, mainly in children
      - Progressive, unremitting infections; poor response to antibiotics
      - Unusual opportunistic infections
      - Failure to thrive
      - Congenital abnormalities of other organs
    pass: 4
    src: { page: 182, quote: "Infections tend to be progressive and unremitting. Bacterial infections may respond poorly to appropriate antibiotics." }
    status: unverified
  - id: rheum.L11.010
    kind: table
    topic: clues
    title: The organism points to the defect
    columns: [Organisms, Defect suggested]
    rows:
      - ["Opportunistic: viruses, protozoa, fungi", T-cell arm]
      - ["Encapsulated pyogenic bacteria: pneumococci, meningococci, H. influenzae, group A strep", "Antibody (B cell), phagocyte or complement"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 182, quote: "Opportunistic infections (viruses, protozoa, fungi) suggest a defect in the T cell arm of the immune response" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L11.011
    kind: card
    topic: clues
    front: Which neoplasms appear in immunodeficiency, and an example?
    back: Opportunistic neoplasms, especially malignant lymphomas, often late; e.g. lymphoma, Kaposi sarcoma and aggressive skin cancers in AIDS.
    src: { page: 183, quote: "Opportunistic neoplasms, especially malignant lymphomas, are observed in several immunodeficiency disorders, often but not always late in the course of the disease." }
    status: unverified
  - id: rheum.L11.012
    kind: card
    topic: clues
    front: Why are live virus vaccines dangerous in T-cell defects?
    back: The patient cannot stop even attenuated virus spreading; post-vaccination poliomyelitis has been reported.
    src: { page: 183, quote: "Exposure to live virus vaccines may be disastrous in some patients with immunodeficiency disorders involving T cell immunity" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L11.013
    kind: cloze
    topic: clues
    text: "Infants with B-cell defects present {{c1::late in the first year}} (maternal IgG protects); T-cell defects present early, usually at {{c2::3–6 months}}."
    src: { page: 183, quote: "infants with B cell defects tend to present late in the first year of life. Conversely, patients with T cell defects present early in life" }
    status: unverified
    tags: [high-yield, numbers]
  - id: rheum.L11.014
    kind: card
    topic: clues
    front: Recurrent infections always in one anatomic site (e.g. right middle lobe pneumonia) suggest what?
    back: An anatomical abnormality rather than immunodeficiency.
    src: { page: 183, quote: "anatomical abnormalities should be suspected if the infections occur repeatedly in one specific anatomic site (e.g. pneumonia in the right middle lobe of the lung)." }
    status: unverified
  - id: rheum.L11.015
    kind: card
    topic: clues
    front: Common non-immune cause of recurrent pneumonia in children, and the test to do first?
    back: Cystic fibrosis; a sweat chloride test before further immune workup.
    src: { page: 184, quote: "In children with recurrent pneumonia a sweat chloride test for cystic fibrosis is indicated prior to further laboratory evaluation" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L11.016
    kind: card
    topic: clues
    front: How do infections in true immunodeficiency differ from anatomical causes?
    back: They tend to be generalised and involve many organ systems.
    src: { page: 183, quote: "In contrast in patients with immunodeficiency disorders the infections tend to be generalized and involve many different organ systems." }
    status: unverified
  - id: rheum.L11.017
    kind: card
    topic: clues
    front: Lymphoid tissue in T-cell defects on examination and chest X-ray?
    back: Often no identifiable nodes, tonsils or adenoids, even draining active infection; no thymus shadow on chest X-ray.
    src: { page: 184, quote: "Patients with T cell defects will often lack identifiable lymphoid tissue such as lymph nodes, tonsils, and adenoids even at sites draining active infections." }
    status: unverified
  - id: rheum.L11.018
    kind: card
    topic: clues
    front: Which B-cell defects paradoxically show lymphoid hyperplasia?
    back: Those failing terminal differentiation into plasma cells; nodes and gut lymphoid tissue may be hyperplastic.
    src: { page: 184, quote: "Paradoxically, in some B cell abnormalities involving the failure of terminal differentiation to plasma cells, marked lymphoid hyperplasia" }
    status: unverified
  - id: rheum.L11.019
    kind: card
    topic: evaluation
    front: What does a normal ESR tell you in a child with recurrent infections?
    back: It virtually rules out chronic bacterial infection.
    src: { page: 184, quote: "A normal E.S.R. virtually rules out chronic bacterial infections." }
    status: unverified
  - id: rheum.L11.020
    kind: cloze
    topic: evaluation
    text: "T cells are about {{c1::75%}} of circulating lymphocytes; absolute lymphocytes below {{c2::1500/mm³}} in adults or {{c3::4000/mm³}} in infants under 1 year are abnormal."
    src: { page: 184, quote: "Absolute lymphocyte counts below 1500/cu.mm. in adults and 4000/cu.mm. in children less than 1 year of age are abnormal." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L11.021
    kind: card
    topic: evaluation
    front: Cheap screening tests for T-cell defects?
    back: WBC with differential and smear morphology, and delayed cutaneous hypersensitivity skin tests.
    src: { page: 184, quote: "Another inexpensive and informative method to evaluate T cell defects is to perform skin tests for delayed cutaneous hypersensitivity." }
    status: unverified
  - id: rheum.L11.022
    kind: mcq
    topic: clues
    stem: A 4-month-old boy has persistent oral thrush, Pneumocystis pneumonia and chronic diarrhoea. No tonsils are seen. Which arm is most likely defective?
    options:
      - T-cell immunity
      - B-cell antibody production alone
      - Complement
      - Phagocyte killing
    answer: 0
    why:
      - "Correct: opportunistic fungi and protozoa, onset at 3–6 months, absent lymphoid tissue point to T cells (pp182-184)."
      - Pure B-cell defects present late in the first year with encapsulated bacteria.
      - Complement deficiency gives pyogenic or Neisserial infection, not Pneumocystis.
      - Phagocyte defects give bacterial and fungal abscesses, not Pneumocystis with absent tonsils.
    src: { page: 182, quote: "Opportunistic infections (viruses, protozoa, fungi) suggest a defect in the T cell arm of the immune response" }
    status: unverified
  - id: rheum.L11.023
    kind: mcq
    topic: clues
    stem: A 6-year-old has had three right middle lobe pneumonias. Growth is normal and he has had no infections elsewhere. What is most likely?
    options:
      - A local anatomical abnormality
      - Severe combined immunodeficiency
      - X-linked agammaglobulinemia
      - Complement deficiency
    answer: 0
    why:
      - "Correct: repeated infection at one site suggests anatomy, not immunity (p183)."
      - SCID presents in early infancy with generalised infection and failure to thrive.
      - XLA gives generalised encapsulated infections, not one lobe.
      - Complement defects give systemic pyogenic or Neisserial infection.
    src: { page: 183, quote: "anatomical abnormalities should be suspected if the infections occur repeatedly in one specific anatomic site" }
    status: unverified
  # ---------- p185-187: tests ----------
  - id: rheum.L11.024
    kind: card
    topic: tests
    front: Second-line antibody tests when screening is abnormal?
    back: Specific antibodies to diphtheria, tetanus, polio, pneumococcal polysaccharides and H. influenzae after immunisation.
    src: { page: 185, quote: "specific antibodies against diphtheria, tetanus, polio virus, and pneumococcal polysaccharides, and H. influenza can be measured after immunization." }
    status: unverified
  - id: rheum.L11.025
    kind: card
    topic: tests
    front: Why can total immunoglobulins mislead in AIDS?
    back: Patients are often hypergammaglobulinaemic but form specific antibodies poorly.
    src: { page: 185, quote: "patients with AIDS and AIDS-related complex are often hypergammaglobulinemic, but form specific antibodies poorly." }
    status: unverified
  - id: rheum.L11.026
    kind: card
    topic: tests
    front: How are B, T and NK cells counted, and how is complement screened?
    back: Flow cytometry; total haemolytic complement (CH50) and individual components.
    src: { page: 185, quote: "the measurement of total hemolytic complement (CH50) and individual complement components is available." }
    status: unverified
  - id: rheum.L11.027
    kind: table
    topic: tests
    title: Chest radiograph clues
    columns: [Finding, Suggests]
    rows:
      - [Absent thymic shadow, SCID]
      - [Cupping and flaring of costochondral junctions, ADA deficiency]
      - ["Interstitial infiltrates, bronchiectasis, bullae, scarring", Chronic lung damage (film may be normal)]
    blanks: [[0, 1], [1, 1]]
    src: { page: 185, quote: "The absence of a thymic shadow is a common finding in patients with SCID (severe combined immune defficiency)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L11.028
    kind: card
    topic: tests
    front: Criterion standard to study lung abnormalities in these patients?
    back: HRCT.
    src: { page: 186, quote: "HRCT scans may be considered the criterion standard test to study lung abnormalities in these patients." }
    status: unverified
  - id: rheum.L11.029
    kind: enumerate
    topic: tests
    prompt: HRCT findings in CVID and primary hypogammaglobulinaemia?
    points:
      - Pulmonary fibrosis
      - Bronchiectasis
      - Parenchymal scarring
      - Pleural thickening
      - Less commonly emphysema or nodules
    pass: 3
    src: { page: 186, quote: "include pulmonary fibrosis, bronchiectasis, parenchymal scarring, pleural thickening, and, less commonly, emphysema or parenchymal nodules." }
    status: unverified
  - id: rheum.L11.030
    kind: table
    topic: tests
    title: Which cells are missing
    columns: [Disorder, Finding]
    rows:
      - [XLA, B cells absent]
      - [X-linked SCID, T cells absent]
      - [Autosomal recessive SCID, B and T cells absent]
      - [Wiskott–Aldrich, "\"Bald\" lymphocytes on scanning EM"]
      - [ADA deficiency (fetus), Low red cell ADA]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 186, quote: "T cells are absent in XSCID. B cells and T cells are absent in autosomal recessive SCID." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L11.031
    kind: card
    topic: tests
    front: Which test should be measured in every SCID patient?
    back: ADA (adenosine deaminase) levels.
    src: { page: 186, quote: "ADA levels should be measured in patients with SCID." }
    status: unverified
  - id: rheum.L11.032
    kind: card
    topic: tests
    front: Tools for carrier detection and prenatal diagnosis?
    back: RFLP for carriers; umbilical cord blood for prenatal diagnosis of some disorders.
    src: { page: 186, quote: "Restriction fragment length polymorphism (RFLP) can help detect genetic defect carriers." }
    status: unverified
  - id: rheum.L11.033
    kind: card
    topic: tests
    front: Is lymph node biopsy needed to diagnose immunodeficiency?
    back: No (poor healing, infection); consider it only for rapidly enlarging nodes to exclude infection or malignancy.
    src: { page: 186, quote: "Lymph node biopsy is not a necessary diagnostic test in these disorders and can be complicated by poor healing and infection." }
    status: unverified
  - id: rheum.L11.034
    kind: table
    topic: tests
    title: Biopsies in immunodeficiency
    columns: [Biopsy, Use]
    rows:
      - [Rectal, "CVID and IgA deficiency: plasma and lymphoid cell infiltrate"]
      - [Thymus, Only with thymoma]
      - [Skin, Document GVH]
      - [Lymph node, Rapidly enlarging nodes only]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 187, quote: "Rectal biopsy may be helpful in CVID and IgA deficiency by showing plasma cell and lymphoid cell infiltrate in rectal tissue." }
    status: unverified
  # ---------- p187-188: B-cell deficiencies ----------
  - id: rheum.L11.035
    kind: card
    topic: bcell
    front: Enzyme defect in X-linked agammaglobulinemia (Bruton)?
    back: Bruton's tyrosine kinase, needed for B-cell maturation; no mature B cells or plasma cells anywhere.
    src: { page: 187, quote: "Absence or deficiency of a specific enzyme needed for B cell maturation (Bruton‘s tyrosine kinase) results in no mature B lymphocytes or plasma cells" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L11.036
    kind: cloze
    topic: bcell
    text: "In XLA, IgM, IgA, IgD and IgE are undetectable and IgG is {{c1::<10% of normal}}; the thymus and T-cell areas are {{c2::normal}}."
    src: { page: 187, quote: "Patients lack detectable levels of IgM, IgA, IgD, or IgE, and IgG levels are less than 10% of normal." }
    status: unverified
    tags: [numbers]
  - id: rheum.L11.037
    kind: cloze
    topic: bcell
    text: "XLA infections usually appear at {{c1::5–9 months}}, mostly {{c2::H. influenzae and S. pneumoniae}}; the parasite reported is {{c3::Giardia lamblia}}."
    src: { page: 187, quote: "infections usually do not become apparent until 5-9 months of age. The most common infections are with Hemophilus influenzae and Streptococcus pneumoniae." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L11.038
    kind: card
    topic: bcell
    front: Which viruses are the exception to normal antiviral resistance in XLA?
    back: ECHO viruses (T-cell function is otherwise intact).
    src: { page: 187, quote: "they have mostly normal resistance to fungi, parasites, enteric bacilli, and viruses with the specific exception of ECHO viruses" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L11.039
    kind: card
    topic: bcell
    front: A major clinical sign of XLA on examination, and why?
    back: Very tiny tonsils, because tonsils hold the largest B-cell collection in infants.
    src: { page: 187, quote: "Because the largest collection of B cells in the normal infant is in the tonsils, these children have very tiny tonsils" }
    status: unverified
  - id: rheum.L11.040
    kind: card
    topic: bcell
    front: How is XLA diagnosed and treated?
    back: A male infant with low immunoglobulins and no circulating B cells on immunophenotyping (molecular confirmation possible); monthly IV gammaglobulin.
    src: { page: 188, quote: "Diagnosis is made when a male infant with low immunoglobulin levels is found not to have circulating B cells by immunophenotyping" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L11.041
    kind: card
    topic: bcell
    front: Define dysgammaglobulinaemia.
    back: Selective deficiency of one or more immunoglobulin classes or subclasses.
    src: { page: 188, quote: "Is the term for selective deficiencies in one or more classes or subclasses of immunoglobulin." }
    status: unverified
  - id: rheum.L11.042
    kind: cloze
    topic: bcell
    text: "The commonest dysgammaglobulinaemia is selective {{c1::IgA}} deficiency, about {{c2::1 in 500}}; it raises upper respiratory and GI problems but is usually not life threatening."
    src: { page: 188, quote: "The most common is selective IgA deficiency which occurs in about 1/500 people." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L11.043
    kind: card
    topic: bcell
    front: Defect in X-linked hyper-IgM syndrome?
    back: Absent or defective CD40 ligand on T cells, so B cells cannot class-switch from IgM; an autosomal recessive form exists.
    src: { page: 188, quote: "absent or defective CD40 ligand on T cells prevents the class switch from IgM to the other immunoglobulins." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L11.044
    kind: card
    topic: bcell
    front: Other dysgammaglobulinaemias and their likely cause?
    back: Hyper-IgE syndrome, IgG subclass deficiency and selective IgM deficiency; probably defective switch mechanisms.
    src: { page: 188, quote: "Other dysgammaglobulinemias include hyper-IgE syndrome IgG subclass deficiency, and selective IgM deficiency." }
    status: unverified
  - id: rheum.L11.045
    kind: mcq
    topic: bcell
    stem: A 7-month-old boy has recurrent pneumococcal otitis and pneumonia. Tonsils are barely visible. IgG is 50 mg/dL, IgA and IgM undetectable, and flow cytometry shows no CD19+ B cells. T cells are normal. Which statement is true?
    options:
      - He needs monthly IVIG and should not receive live vaccines
      - He is at high risk from Pneumocystis and fungi
      - Gene therapy is the standard treatment
      - Bone marrow transplant within 3 months is the treatment of choice
    answer: 0
    why:
      - "Correct: XLA is treated with monthly IV gammaglobulin, and live vaccines are avoided in severe B-cell disorders (pp188, 190)."
      - T cells are intact, so fungal and opportunistic resistance is mostly normal.
      - The book says gene therapy has not been attempted in XLA.
      - Early bone marrow transplant is the treatment of SCID.
    src: { page: 188, quote: "Treatment is with monthly intravenous infusions of gammaglobulin (IgG); gene therapy has not been attempted." }
    status: unverified
  # ---------- p188: T-cell ----------
  - id: rheum.L11.046
    kind: card
    topic: tcell
    front: Why does failure of thymic development cause T-cell dysfunction (DiGeorge)?
    back: T cells mature in the thymus, so thymic failure leaves T cells undeveloped.
    src: { page: 188, quote: "Since T cells mature in the thymus, failure of development or function of this organ will also result in T cell dysfunction." }
    status: unverified
  - id: rheum.L11.047
    kind: card
    topic: tcell
    front: Vaccine risk in DiGeorge syndrome?
    back: Live attenuated vaccines (e.g. measles) are dangerous because they cannot stop even attenuated virus spreading.
    src: { page: 188, quote: "These patients are at great risk when live, attenuated viruses; e.g., attenuated measles virus, are used in vaccinations" }
    status: unverified
  # ---------- p189: HAE ----------
  - id: rheum.L11.048
    kind: card
    topic: hae
    front: Cause and inheritance of hereditary angioedema?
    back: Absent (type I) or defective (type II) C1 esterase inhibitor; autosomal dominant.
    src: { page: 189, quote: "Hereditary angioedema (HAE) results from absent (type I) or defective (type II) C1 esterase inhibitor (C1INH). It is an autosomal dominant trait." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L11.049
    kind: card
    topic: hae
    front: Pathogenesis of HAE according to the book?
    back: Continued production of C3a and C5a, which make mast cells and basophils release histamine and other vasoactive mediators.
    src: { page: 189, quote: "the pathogenesis results from continued production C3a and C5a which then induce mast cells and basophils to release histamine" }
    status: unverified
    update:
      text: "Current understanding: HAE swelling is mediated by bradykinin (uncontrolled kallikrein–kinin activation), not histamine; this is why antihistamines and steroids do not work and icatibant (B2 receptor blocker) does."
      ref: "WAO/EAACI guideline for HAE 2021"
  - id: rheum.L11.050
    kind: enumerate
    topic: hae
    prompt: Characteristics of hereditary angioedema?
    points:
      - Autosomal dominant transmission
      - Local subcutaneous swellings (face, lips, throat, limbs, genitals, buttocks) lasting 2–5 days, without inflammation
      - GI attacks (pain, nausea, vomiting, rarely watery diarrhoea)
    pass: 3
    src: { page: 189, quote: "Local, subcutaneous swellings in the face (particularly the lips), throat, hands, arms, legs, genitals, and buttocks lasting 2 to 5 days." }
    status: unverified
  - id: rheum.L11.051
    kind: card
    topic: hae
    front: HAE abdominal attack mimicking a surgical emergency. What favours conservative care?
    back: Bowel sounds without abdominal tenderness and a normal CBC.
    src: { page: 189, quote: "Bowel sounds in the absence of abdominal tenderness and normal CBC suggest conservative treatment" }
    status: unverified
  - id: rheum.L11.052
    kind: card
    topic: hae
    front: Screening test for HAE?
    back: C4 level, which is low even between attacks.
    src: { page: 189, quote: "One can screen for the disease by ordering a C4 level which will be low even between attacks." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L11.053
    kind: card
    topic: hae
    front: Treatment of severe abdominal attacks or laryngeal oedema in HAE, and maintenance?
    back: C1INH plasma concentrate; maintenance danazol or stanozolol to raise C1 esterase inhibitor.
    src: { page: 189, quote: "The treatment of choice for severe abdominal attacks and life-threatening laryngeal edema is administration of C1INH plasma concentrates." }
    status: unverified
    tags: [high-yield]
    update:
      text: "Guidelines now also use icatibant or ecallantide for attacks, and lanadelumab, berotralstat or C1INH for long-term prophylaxis; attenuated androgens are second line because of side effects."
      ref: "WAO/EAACI guideline for HAE 2021"
  - id: rheum.L11.054
    kind: mcq
    topic: hae
    stem: A 24-year-old woman has had recurrent non-itchy swelling of the lips and hands lasting 3 days, and episodes of colicky abdominal pain with vomiting. Her father has similar attacks. Which single test best screens for her condition?
    options:
      - Serum C4
      - Serum IgE
      - CH50 during an attack only
      - Tryptase
      - Anti-C1q antibody
    answer: 0
    why:
      - "Correct: low C4 even between attacks screens for HAE (p189)."
      - IgE is for allergy; HAE is not IgE-mediated.
      - C4 works between attacks too, so you need not wait for one.
      - Tryptase is for mast-cell anaphylaxis.
      - Anti-C1q is urticarial vasculitis (rheum.L08).
    src: { page: 189, quote: "One can screen for the disease by ordering a C4 level which will be low even between attacks." }
    status: unverified
