        quote: "Follow up of a population of adults who were exposed and not exposed during childhood to radiation of the neck to assess risk of thyroid cancer.\n  a) Cross sectional\n  b) Case control\n  c) Correlation study\n  d) Prospective cohort\n  e) Retrospective cohort"
        text: |
