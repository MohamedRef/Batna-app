  - id: neph.L09.016
    kind: enumerate
    topic: hd-machine
    prompt: Mention the key processes of the dialysate circuit.
    points:
      - Heating
      - Deaeration
      - Proportioning
      - Monitoring
      - Ultrafiltration
      - Disinfection
    pass: 4
    hook: "الـ dialysate زي كوباية الشاي: «سخّن، طلّع الهوا، ظبّط المقادير، راقب، اسحب المية الزيادة، واغسل الكوباية» = heating، deaeration، proportioning، monitoring، ultrafiltration، disinfection."
    src: { page: 294, quote: "Dialysate circuit: The key components/processes of this circuit include: Heating; Deaeration; Proportioning; Monitoring; UF; and Disinfection. Alarm system for monitoring: Conductivity (reflection of sodium, bicarbonate conc), Temperature, Hemglobin (blood leak)." }
    status: unverified
