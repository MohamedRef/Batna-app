  - id: rheum.L14.lesson3
    title: "الـ Antiresorptives: نوقف اللي بيهد"
    hook: "حباية الـ alendronate لو أخدتها غلط ممكن تحرق المريء. والـ denosumab لو وقفته فجأة الفقرات تقع. التفاصيل هنا هي كل حاجة."
    minutes: 9
    pages: [224, 227]
    topics: [nonpharm, bisphosphonates, denosumab, serm-hrt]
    goals:
      - "تحفظ الكالسيوم والـ vitamin D ونصايح الحياة"
      - "تعرف الـ bisphosphonates: الجرعة، الطريقة، الأعراض، الموانع"
      - "تعرف الـ denosumab والـ raloxifene والـ HRT"
    status: unverified
    steps:
      - kind: table
        page: 224
        quote: "Calcium intake: 1000–1200 mg/day (diet + supplements if needed). Vitamin D: 800–1000 IU/day (adjust based on 25(OH)D levels)."
        title: "الأساس قبل أي دوا"
        columns: ["Measure", "Detail"]
        rows:
          - ["Calcium", "1000–1200 mg/day"]
          - ["Vitamin D", "800–1000 IU/day, by 25(OH)D"]
          - ["Exercise", "Weight-bearing and resistance"]
          - ["Falls", "Home safety, vision, balance"]
          - ["Lifestyle", "No smoking, alcohol < 2 drinks/day"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 224
        quote: "Mechanism: Inhibit osteoclast-mediated bone resorption → increase bone mineral density."
        title: "الـ Bisphosphonates"
        text: |
          **Alendronate، risedronate، ibandronate، zoledronic acid**.

          بيوقفوا الـ ==osteoclast-mediated resorption== فالـ BMD بتزيد.

          **First-line** في: postmenopausal، steroid-induced، و male osteoporosis.
      - kind: table
        page: 225
        quote: "Alendronate: 70 mg weekly (oral). Risedronate: 35 mg weekly. Zoledronic acid: 5 mg IV yearly."
        title: "الجرعات"
        columns: ["Drug", "Dose"]
        rows:
          - ["Alendronate", "70 mg weekly, oral"]
          - ["Risedronate", "35 mg weekly"]
          - ["Zoledronic acid", "5 mg IV yearly"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 225
        quote: "Take on empty stomach with a full glass of water. Stay upright for at least 30–60 minutes."
        prompt: "ليه الـ oral bisphosphonate على الريق، بكوباية مية كاملة، وتفضل قاعد أو واقف نص ساعة لساعة؟"
        answer: "الامتصاص ضعيف جدًا والأكل يقلله أكتر، فلازم **empty stomach**. والحباية بتهيّج المريء (GI irritation)، فالمية الكتير و الـ **upright** يخلّوها تنزل المعدة على طول وما ترجعش. وعشان كده **esophageal disorders** من الموانع."
      - kind: table
        page: 225
        quote: "GI irritation (oral forms). Flu-like symptoms (IV). Rare: Atypical femoral fractures, osteonecrosis of the jaw (ONJ)."
        title: "الأعراض والموانع"
        columns: ["", "Bisphosphonates"]
        rows:
          - ["Side effects", "GI irritation (oral), flu-like (IV)"]
          - ["Rare", "Atypical femoral fracture, ONJ"]
          - ["Contraindications", "Esophageal disease, hypocalcemia, eGFR < 30–35"]
        hide: [[1, 1], [2, 1]]
      - kind: explain
        page: 225
        quote: "(Prolia – 60 mg SC every 6 months). Mechanism: Monoclonal antibody to RANKL → inhibits osteoclast formation and survival."
        title: "الـ Denosumab"
        text: |
          **Prolia 60 mg SC كل 6 شهور**: ==monoclonal antibody to RANKL== بيمنع تكوين الـ osteoclasts وبقاءها.

          - **Indications**: high fracture risk، و **CKD** (مش nephrotoxic).
          - **Benefits**: BMD أعلى في الـ spine والـ hip، و well-tolerated.
          - **Risks**: hypocalcemia (خصوصًا مع CKD)، ONJ، infections.
      - kind: aside
        tone: exam
        page: 226
        quote: "Rebound vertebral fractures may occur if discontinued without transition to another agent."
        text: "سؤال بيتكرر: الـ denosumab لو اتوقف من غير ما تنقل المريض لدوا تاني، ممكن يحصل **rebound vertebral fractures**. يعني ما ينفعش يتوقف فجأة وخلاص."
      - kind: explain
        page: 226
        quote: "Mechanism: Estrogen agonist in bone → reduces bone resorption; antagonist in breast/uterus."
        title: "الـ Raloxifene (SERM) والـ HRT"
        text: |
          ==Raloxifene==: **agonist** في العضم و **antagonist** في الـ breast والـ uterus.

          - مناسب للـ postmenopausal، خصوصًا اللي عندها **breast cancer risk**.
          - Risks: **hot flashes** و **VTE**.
          - **مش** للرجالة ولا للـ high fracture risk.

          **HRT**: للست اللي عندها أعراض سن اليأس وخطر osteoporosis، بس فيه breast cancer و thromboembolism و stroke، ومش بيتوصف للـ prevention لوحده.
      - kind: match
        page: 226
        quote: "Rebound vertebral fractures may occur if discontinued without transition to another agent."
        prompt: "وصّل الدوا بالتحذير بتاعه:"
        pairs:
          - ["Alendronate", "Stay upright 30–60 min"]
          - ["Zoledronic acid", "Flu-like symptoms"]
          - ["Denosumab", "Rebound vertebral fractures on stopping"]
          - ["Raloxifene", "VTE and hot flashes"]
          - ["HRT", "Breast cancer and stroke"]
        why: "كل دوا له حاجة تميّزه في الامتحان: الـ oral BP والمريء، الـ IV BP والـ flu-like، الـ denosumab والـ rebound، الـ SERM والـ VTE، والـ HRT والـ breast cancer."
      - kind: check
        page: 226
        quote: "CKD patients (not nephrotoxic)."
        question: "A 76-year-old woman with osteoporosis and eGFR 24. Best choice?"
        options: ["Denosumab", "Alendronate", "Zoledronic acid", "Raloxifene for high fracture risk"]
        answer: 0
        why:
          - "صح: مش nephrotoxic؛ تابع الـ calcium."
          - "ممنوع مع eGFR أقل من 30–35."
          - "نفس المانع الكلوي."
          - "الـ SERM مش للـ high fracture risk."
      - kind: try
        items: [rheum.L14.023, rheum.L14.028, rheum.L14.029, rheum.L14.031, rheum.L14.035]
    recap:
      - "Calcium 1000–1200 mg، vitamin D 800–1000 IU، رياضة، منع وقعات، لا سجاير."
      - "BP: alendronate 70 أسبوعي، risedronate 35 أسبوعي، zoledronic 5 mg IV سنوي."
      - "على الريق، مية كتير، upright 30–60 دقيقة؛ ممنوع مع esophagus و hypocalcemia و eGFR < 30–35."
      - "Denosumab 60 mg SC كل 6 شهور، anti-RANKL، ينفع في CKD، rebound لو اتوقف."
      - "Raloxifene: agonist عضم، antagonist breast/uterus، VTE."
    practice: [rheum.L14.023, rheum.L14.024, rheum.L14.026, rheum.L14.027, rheum.L14.028, rheum.L14.029, rheum.L14.030, rheum.L14.031, rheum.L14.032, rheum.L14.033, rheum.L14.034, rheum.L14.035, rheum.L14.036, rheum.L14.037, rheum.L14.038, rheum.L14.039, rheum.L14.054, rheum.L14.055, rheum.L14.056, rheum.L14.057, rheum.L14.063, rheum.L14.068, rheum.L14.069, rheum.L14.070]
