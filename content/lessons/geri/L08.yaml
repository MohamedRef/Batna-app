  # Split from lesson1 and lesson2 on 2026-11-13 (#828): sarcopenia mechanisms
  # and management, and what tendinopathy is.
  - id: geri.L08.lesson7
    title: "العضلة بتروح ليه، والوتر بيتعب ليه"
    hook: "الدوا الوحيد اللي الكتاب واثق فيه للعضلة هو الحديد، والوتر بيبوظ من الشد الزيادة ومن الراحة الزيادة كمان."
    minutes: 9
    pages: [134, 136]
    topics: [sarc-mx, tendinopathy]
    goals:
      - "ترتّب mechanisms الـ sarcopenia في مجموعات وتعرف ليه الرياضة هي العلاج"
      - "تعرّف الـ tendinopathy وتعرف الـ 3 أنواع ضغط اللي بتبوّظ الوتر"
      - "تعرف إزاي بيحصل الـ calcific tendinopathy ومين معرّض"
    status: unverified
    steps:
      - kind: explain
        remind: [geri.L08.019]
        page: 134
        title: "ليه العضلة بتروح؟"
        quote: "In recent years, inflammation and mitochondrial dysfunction received particular attention as a major determinant of sarcopenia. The detrimental effects of persistent inflammation and mitochondrial damage are seen in a variety of pathological conditions characterized by metabolic alterations including diabetes, insulin resistance, and cardiovascular diseases."
        text: |
          الـ mechanisms كتير: malnutrition، inactivity، hormonal changes، inflammation، catabolism زيادة و **anabolic resistance**، myocyte loss، satellite cells أقل، فقد **α-motor neurons**، mitochondrial dysfunction، insulin resistance.

          وآخر سنين الاهتمام على اتنين: ==inflammation== و **mitochondrial dysfunction** (نفس اللي في السكر والـ cardiovascular disease (CVD)).

          القايمة طويلة، فقسّمها تلات مجموعات (التجميع ده للفهم، والتفسير المقبول مش في الكتاب):
          - **الداخل قليل**: malnutrition، physical inactivity، hormonal changes. يعني العضلة مش واخدة بروتين ولا إشارة إنها تكبر.
          - **الهدم كتير**: inflammation، increased catabolism، و **anabolic resistance** (العضلة الكبيرة بتستجيب أقل لنفس الأكل ونفس الرياضة).
          - **الماكينة بتقل**: myocytes بتموت، **satellite cells** (خلايا الإصلاح) أقل، **α-motor neurons** بتموت فالألياف اللي كانت متوصلة بيها بتضمر، و **mitochondria** مش شغالة.

          وليه الـ inflammation والـ mitochondria بالذات؟ الكتاب بيقول نفس الضرر ده موجود في **diabetes** و **insulin resistance** و **CVD**، يعني الأمراض دي بتسرّع ضمور العضل.
      - kind: explain
        page: 135
        title: "العلاج: الحديد مش في الصيدلية"
        quote: "Regarding pharmacological approaches, it is worth highlighting that no drugs have been approved yet for the treatment of sarcopenia. A recent umbrella review of systematic reviews and meta-analyses reported that only vitamin D, especially in older women, and testosterone in older men with low testosterone levels and muscle weakness can be justified in daily clinical practice to improve muscle mass and function in sarcopenic patients."
        text: |
          - الأساس: ==physical exercise== لوحده أو مع nutrition، وأحسنه **high-intensity resistance training**.
          - **مفيش دوا approved**.
          - الـ umbrella review: بس **vitamin D** (خصوصًا الستات الكبار) و **testosterone** (رجالة عندهم low testosterone وضعف).

          ليه الـ **resistance training**؟ التفسير المقبول (مش في الكتاب): العضلة بتكبر لما تتطلب منها حاجة أكبر من قدرتها، والحِمل التقيل هو أقوى إشارة بتعدّي الـ anabolic resistance. والكتاب بيقول إنه بيحسّن **strength and mass** وبيقاوم الـ age-related decline.

          وليه الأكل **معاه**؟ عشان العضلة محتاجة بروتين تبني بيه، والرياضة من غير أكل كفاية ممكن تهد أكتر ما تبني.

          وليه vitamin D و testosterone بس؟ الكتاب بيقول دول الوحيدين اللي الـ evidence **justified**، وبشرط: الـ vitamin D خصوصًا في **الستات الكبار**، والـ testosterone في **الرجالة اللي عندهم low testosterone وضعف**، يعني لما فيه نقص حقيقي تعوّضه.
      - kind: aside
        tone: joke
        page: 134
        quote: "Physical exercise, alone or in combination with nutritional interventions, is the non-pharmacological approach currently recommended as the primary treatment of sarcopenia. In fact, physical exercise, most notably high-intensity resistance training, improves the strength and mass of skeletal muscles and counteracts the age-related decline in muscle size and function."
        text: "يعني الروشتة: «**dumbbells** مرتين في اليوم بعد الأكل». الـ resistance training هو الدوا الوحيد اللي الكتاب واثق فيه."
      - kind: explain
        remind: [geri.L08.026]
        page: 135
        title: "يعني إيه tendinopathy؟"
        quote: "Tendinopathy is a musculoskeletal disorder characterized by tendon pain during an activity, tendon swelling and localized tenderness upon palpation, and loss of function."
        text: |
          ==Tendon pain during activity==، swelling، **localized tenderness**، و loss of function.

          تحت الميكروسكوب: **collagen degeneration**، mucoid ground substance زيادة، و tenocytes أكتر بتتحول myofibroblasts (repair cells).

          الـ myofibroblastic differentiation معناها إن الوتر **بيحاول يصلّح** نفسه. التفسير المقبول (مش في الكتاب): يعني الـ tendinopathy مش التهاب حاد، هي **إصلاح فاشل** لإصابات صغيرة متكررة، وعشان كده بتطوّل.
      - kind: explain
        page: 135
        title: "3 أنواع ضغط بتبوّظ الوتر"
        quote: "It has been shown in recent in vivo studies that human tendons may undergo non-uniform displacements during passive or active force application, with deeper tissue layers deforming more than superficial ones. Therefore, not only excessive tensile stress, but also excessive compressive stress as well as \"stress-shielding\" (i.e., the lack of adequate local stress producing understimulation of the tendon cells), could lead to tensile weakening and degeneration over time."
        text: |
          1. **Excessive tensile load**: زيادة مفاجئة في الحِمل أو مدته أو تكراره ← micro-injury.
          2. **Excessive compressive stress**.
          3. ==Stress-shielding==: الوتر **مش واخد حِمل كفاية**، فالخلايا بتكسل والوتر يضعف.

          والطبقات **العميقة** بتتشد أكتر من السطحية.

          ليه الحِمل **السريع** هو المشكلة؟ الكتاب بيقول لو الـ magnitude أو الـ duration أو الـ frequency زادت **بسرعة**، الـ tensile strength بيتعدّى **موضعيًا** فيحصل micro-injury. التفسير المقبول (مش في الكتاب): الوتر بيتكيّف مع الحِمل، بس ببطء، فالمشكلة إنك تطلب منه أكتر قبل ما يلحق يتكيّف.

          وليه الـ stress-shielding بيضر؟ الكتاب بيقول قلة الحِمل بتعمل **understimulation of the tendon cells**. يعني الخلايا محتاجة شد عشان تفضل تبني collagen. وده سبب إن العلاج في الآخر هيبقى **load management** مش راحة تامة.
      - kind: aside
        tone: analogy
        page: 135
        quote: "It has been shown in recent in vivo studies that human tendons may undergo non-uniform displacements during passive or active force application, with deeper tissue layers deforming more than superficial ones. Therefore, not only excessive tensile stress, but also excessive compressive stress as well as \"stress-shielding\" (i.e., the lack of adequate local stress producing understimulation of the tendon cells), could lead to tensile weakening and degeneration over time."
        text: "الوتر زي الحبل في مركب: لو شدّيته جامد مرة واحدة يتقطع، ولو سبته مرمي سنين يعفّن. الـ **stress-shielding** هو الحبل المرمي."
      - kind: figure
        page: 135
        quote: "It has been shown in recent in vivo studies that human tendons may undergo non-uniform displacements during passive or active force application, with deeper tissue layers deforming more than superficial ones. Therefore, not only excessive tensile stress, but also excessive compressive stress as well as \"stress-shielding\" (i.e., the lack of adequate local stress producing understimulation of the tendon cells), could lead to tensile weakening and degeneration over time."
        title: "الوتر عايز الحِمل المظبوط"
        alt: "A horizontal scale of tendon load. Left end, too little load: stress-shielding, cells understimulated, weakening. Middle: adequate load, healthy tendon. Right end, too much: excessive tensile or compressive stress, micro-injury and degeneration."
        caption: "الطرفين الاتنين بيبوّظوا الوتر: الشد أو الضغط الزيادة بيعمل micro-injury، والحِمل القليل (stress-shielding) بيكسّل الخلايا. النص هو اللي بيعالج."
        svg: |
          <svg viewBox="0 0 330 170" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="40" width="95" height="60" rx="6" class="fg-bad"/>
            <text x="57" y="62" text-anchor="middle" class="t-sm t-b">Too little</text>
            <text x="57" y="80" text-anchor="middle" class="t-sm">Stress-shielding</text>
            <rect x="117" y="40" width="96" height="60" rx="6" class="fg-good"/>
            <text x="165" y="62" text-anchor="middle" class="t-sm t-b">Adequate</text>
            <text x="165" y="80" text-anchor="middle" class="t-sm">Healthy tendon</text>
            <rect x="225" y="40" width="95" height="60" rx="6" class="fg-bad"/>
            <text x="272" y="62" text-anchor="middle" class="t-sm t-b">Too much</text>
            <text x="272" y="80" text-anchor="middle" class="t-sm">Tensile or</text>
            <text x="272" y="94" text-anchor="middle" class="t-sm">compressive</text>
            <text x="10" y="26" class="t-sm t-mut">Load on the tendon</text>
            <text x="57" y="124" text-anchor="middle" class="t-sm">Cells understimulated</text>
            <text x="272" y="124" text-anchor="middle" class="t-sm">Micro-injury</text>
            <text x="165" y="150" text-anchor="middle" class="t-sm t-mut">Both ends: weakening and degeneration</text>
          </svg>
      - kind: order
        page: 136
        quote: "High levels of tendon compression and the associated tissue hypoxia stimulate the fibrocartilaginous metaplasia of tenocytes that differentiate into hypertrophic chondrocyte-like cells to produce calcium deposits (predominantly hydroxyapatite). The clinical sequela is a condition known as calcific tendinopathy."
        prompt: "إزاي بيحصل الـ calcific tendinopathy؟ رتّب:"
        steps:
          - "High compression"
          - "Tissue hypoxia"
          - "Tenocyte fibrocartilaginous metaplasia"
          - "Calcium deposits (hydroxyapatite)"
        why: "الضغط ← hypoxia ← الـ tenocytes تتحول chondrocyte-like cells ← تعمل calcium deposits أغلبها **hydroxyapatite** = calcific tendinopathy."
      - kind: explain
        remind: [geri.L08.033]
        page: 136
        title: "مين معرّض؟"
        quote: "The individual factors that should be considered are genes, age, sex, bio mech an ics, and body composition. Obesity, illnesses associated with obesity and systematic diseases can provoke tendinopathy. Extrinsic factors could vary in each tendon; while weight bearing is highly related to lower limbs tendinopathies, upper limbs tendons injuries can be observed in overload movements."
        text: |
          **Individual:** genes، age، sex، biomechanics، body composition، ==obesity== وأمراضها، systemic diseases.

          **Extrinsic:** الـ **weight bearing** للرجلين، و الـ **overload movements** للإيدين.

