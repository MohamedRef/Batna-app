    kind: table
    topic: adpkd-dx
    title: Ravine's original PKD1 criteria vs criteria to exclude ADPKD (Table 44.1)
    columns: [Age (years), Ravine (diagnose), "Exclusion threshold: fewer cysts than this excludes (NPV)"]
    rows:
      - ["15–29", "≥2 cysts, unilateral or bilateral", "≥1 cyst: no cyst excludes (NPV 91%)"]
      - ["30–39", "≥2 cysts in each kidney", "≥1 cyst: no cyst excludes (NPV 98%)"]
      - ["40–59", "≥2 cysts in each kidney", "≥2 cysts: fewer than 2 excludes (NPV 100%)"]
      - ["≥60", "≥4 cysts in each kidney", "≥3 cysts in each kidney: fewer than 3 in each kidney excludes (NPV 100%)"]
    blanks: [[0, 1], [3, 1], [0, 2], [2, 2]]
    src: { page: 155, quote: "TABLE 44.1 Ultrasound Criteria for the Diagnosis of Autosomal Dominant Polycystic Kidney Disease\n| Age (y) | Criteria | PPV | NPV |\n|---|---|---|---|\n| Original Ravine's PKD1 Diagnostic Criteria | | | |\n| 15-29 | ≥2 cysts, unilateral or bilateral | 99 | 88 |\n| 30-39 | ≥2 cysts in each kidney | 100 | 88 |\n| 40-59 | ≥2 cysts in each kidney | 100 | 95 |\n| ≥60 | ≥4 cysts in each kidney | 100 | 100 |\n| Revised Unified Diagnostic Criteria | | | |\n| 15-29 | ≥3 cysts, unilateral or bilateral | 100 | 86 |\n| 30-39 | ≥3 cysts, unilateral or bilateral | 100 | 86 |\n| 40-59 | ≥2 cysts in each kidney | 100 | 95 |\n| ≥60 | ≥4 cysts in each kidney | 100 | 100 |\n| Revised Diagnostic Criteria (when diagnosis needs to be excluded) | | | |\n| 15-29 | ≥1 cyst | 97 | 91 |\n| 30-39 | ≥1 cyst | 94 | 98 |\n| 40-59 | ≥2 cysts | 97 | 100 |\n| ≥60 | ≥3 cysts in each kidney | 100 | 100 |\nThe specificity and positive predictive value (PPV) of ultrasound are high using these criteria, but their sensitivity and negative predic-tive value (NPV) when applied to PKD2 patients age 15 to 59 are low. This is a problem in the evaluation of potential kidney donors, in which exclusion of the diagnosis is important. Different criteria have therefore been proposed to exclude a diagnosis of ADPKD in an indi-vidual at risk from a family with an unknown genotype." }
    status: unverified
  - id: neph.L07.062
    kind: mcq
    topic: adpkd-dx
    stem: A 45-year-old whose father has ADPKD has an ultrasound showing 3 cysts in the right kidney and 1 in the left. By the revised unified criteria, does she have ADPKD?
    options:
      - Not yet diagnostic; at 40–59 she needs at least 2 cysts in each kidney
      - Yes; 3 cysts anywhere are enough at any age
      - Yes; 4 cysts in total are diagnostic after 40
      - No; at her age she needs 4 cysts in each kidney
      - Ultrasound cannot be used after 40
    answer: 0
    why:
      - "Correct: ages 40–59 need ≥2 cysts in each kidney (p154)."
      - The ≥3 cyst rule applies to ages 15–39.
      - Totals do not count; each kidney needs 2.
      - ≥4 in each kidney is the rule from age 60.
      - Ultrasound is the standard presymptomatic test at all ages.
    src: { page: 154, quote: "Renal Ultrasound Renal ultrasound is used for presymptomatic testing because of cost and safety. Revised criteria have been proposed to improve the diagnostic performance of ultrasound in ADPKD (Table 44.1). At least three (uni-lateral or bilateral) renal cysts are sufficient for diagnosis of at-risk individuals 15 to 39 years of age; two cysts in each kidney sufficient for diagnosis for ages 40 to 59 years.19 For at-risk individuals age 60 and older, four or more cysts in each kidney is required." }
    status: unverified
  - id: neph.L07.063
    kind: card
    topic: adpkd-dx
    front: Where is ultrasound weak in ADPKD diagnosis, and why does it matter?
    back: Sensitivity and NPV are low in PKD2 patients aged 15–59. This matters when evaluating potential kidney donors, where excluding the disease is important.
    src: { page: 155, quote: "The specificity and positive predictive value (PPV) of ultrasound are high using these criteria, but their sensitivity and negative predic-tive value (NPV) when applied to PKD2 patients age 15 to 59 are low. This is a problem in the evaluation of potential kidney donors, in which exclusion of the diagnosis is important. Different criteria have therefore been proposed to exclude a diagnosis of ADPKD in an indi-vidual at risk from a family with an unknown genotype. An ultrasound tainty in an at-risk individual younger than 30 years. A recent study of 73 affected and 82 nonaffected individuals suggested that finding fewer than five cysts by magnetic resonance imaging (MRI) is sufficient to exclude the diagnosis of ADPKD in potential living related kidney donors. 20 Contrast- enhanced computed tomography (CT) scanning with thin slices likely provides similar information, but this has not been proven." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.064
    kind: cloze
    topic: adpkd-dx
    text: "Fewer than {{c1::five}} cysts on {{c2::MRI}} is sufficient to exclude ADPKD in potential living related kidney donors."
    src: { page: 155, quote: "The specificity and positive predictive value (PPV) of ultrasound are high using these criteria, but their sensitivity and negative predic-tive value (NPV) when applied to PKD2 patients age 15 to 59 are low. This is a problem in the evaluation of potential kidney donors, in which exclusion of the diagnosis is important. Different criteria have therefore been proposed to exclude a diagnosis of ADPKD in an indi-vidual at risk from a family with an unknown genotype. An ultrasound tainty in an at-risk individual younger than 30 years. A recent study of 73 affected and 82 nonaffected individuals suggested that finding fewer than five cysts by magnetic resonance imaging (MRI) is sufficient to exclude the diagnosis of ADPKD in potential living related kidney donors. 20 Contrast- enhanced computed tomography (CT) scanning with thin slices likely provides similar information, but this has not been proven." }
