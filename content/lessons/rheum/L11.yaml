      - kind: explain
        page: 188
        title: "DiGeorge: مفيش مدرسة"
        quote: "T cell defects can be caused by the failure of development at several places along the pathway. Since T cells mature in the thymus, failure of development or function of this organ will also result in T cell dysfunction.\nThese patients are at great risk when live, attenuated viruses; e.g., attenuated measles virus, are used in vaccinations, since they are not able to prevent the spread of even the attenuated viruses."
        text: |
          الكتاب بيقول السبب بنفسه: الـ **T cells بتنضج في الـ thymus**، فلو العضو ده ما اتكونش أو مش شغال ← ==T cell dysfunction==.

          والخطر: **live, attenuated vaccines** زي الـ ==measles== المضعّف. السبب في الكتاب: مش قادرين يوقفوا انتشار حتى الفيروس المضعّف.

          تفسير مقبول (مش في الكتاب): الـ DiGeorge جاي من عيب في تكوين الـ 3rd و 4th pharyngeal pouches، ودول بيطلّعوا الـ thymus والـ parathyroid مع بعض، علشان كده كتير بييجي معاه hypocalcaemia وعيوب في القلب.
