  - id: geri.L07.107
    kind: mcq
    topic: social-meds
    stem: What is a critical component of medication review in CGA?
    options:
      - Prescribing as many medications as possible
      - Using STOPP & START criteria to individualize treatment
      - Avoiding all long-term medications
      - Focusing only on pain management
      - Discontinuing all supplements
    answer: 1
    why:
      - Polypharmacy can do more harm than good, especially in combination.
      - "Correct: treatment is individualized with older-people prescribing criteria such as STOPP & START (p126)."
      - Long-term drugs are reviewed, not banned.
      - The review covers every medicine, not only analgesia.
      - Nothing is stopped by blanket rule.
    src: { page: 126, quote: "That is why treatment should be individualized, and we should use older people prescription criteria e.g. STOPP & START." }
    status: unverified
    tags: [book-question]
