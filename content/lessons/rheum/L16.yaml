  - id: rheum.L16.lesson11
    title: "الـ steroids والـ csDMARDs: كوبري ودوا بيغيّر المرض"
    hook: "الـ steroids بتطفّي النار في يومين، بس الـ DMARD هو اللي بيحمي العضم. اعرف كل دوا ومتابعته ليه."
    minutes: 9
    pages: [264, 266]
    topics: [steroids, csdmards]
    goals:
      - "تعرف الـ steroids كـ bridge وليه مش أكتر"
      - "تقسّم الـ DMARDs وتعرف ليه في أول 12 أسبوع"
      - "تحفظ جدول الـ csDMARDs: الجرعة، الأعراض، والمتابعة وسببها"
    status: unverified
    steps:
      - kind: explain
        page: 264
        title: "الـ steroids: كوبري مش بيت"
        quote: "Rapid, short term (1-3m) in control of marked synovitis while awaiting efficacy from DMARDs (Bridge therapy) Use low dose (7.5 mg) of prednisolone or equivalent."
        text: |
          مفعولها سريع وجامد، بس الجرعات اللي تكفي على المدى الطويل أعراضها **مش مقبولة** (Cushingoid، osteoporosis، سكر، ischaemic heart disease (IHD)، ضغط، ulcer، glaucoma، cataract).

          الـ indications:
          1. ==Bridge therapy==: **1-3 شهور**، **7.5 mg prednisolone**، لحد ما الـ disease-modifying antirheumatic drug (DMARD) يشتغل.
          2. Vasculitis، العين، الرئة.
          3. الحمل لما الـ DMARDs ممنوعة.

          **Intra-articular**: لمفصل أو اتنين، بتقعد **2-8 أسابيع**، ومش أكتر من **4 في السنة** في المفصل الكبير، و asepsis صارم.

          والـ intra-articular ما يتكرّرش كتير لأن الكتاب بيقول إن الحقن المتكرر بيعمل joint damage.
      - kind: reveal
        page: 264
        quote: "Rapid, short term (1-3m) in control of marked synovitis while awaiting efficacy from DMARDs (Bridge therapy) Use low dose (7.5 mg) of prednisolone or equivalent."
        prompt: "الـ steroids بتهدّي الالتهاب في يومين. ليه ما نكمّلش عليها وخلاص؟"
        answer: |
          الكتاب: الجرعات اللي ==تكفي على المدى الطويل== أعراضها الجانبية **مش مقبولة**: Cushingoid، osteoporosis، سكر، IHD، ضغط، ulcer، glaucoma، cataract.

          فالحل: **كوبري** (bridge). الـ DMARD بياخد أسابيع لحد ما يشتغل، والـ **7.5 mg prednisolone** لمدة **1–3 شهور** بتشيل العيان لحد ما يوصل. التفسير المقبول (مش في الكتاب): الـ steroids بتطفّي النار بس ما بتمنعش الـ erosions زي الـ DMARD، فلو اعتمدت عليها هتدفع تمن أعراضها والمفصل برضه بيتهدّ.
      - kind: explain
        page: 264
        title: "الـ DMARDs: ليه في أول 12 أسبوع؟"
        quote: "Should be used within 12 w of onset, as joint damage occurs early in disease course."
        text: |
          الـ ==DMARDs== بتعمل حاجتين الـ NSAIDs والـ steroids ما بيعملوهمش مع بعض: بتقلّل الـ synovitis **و** بتمنع أو تأخّر الـ **erosion والـ destruction**.

          والسبب في الـ **12 أسبوع** مكتوب: الـ joint damage بيحصل **بدري**. افتكر ص 260: الهدم في أول سنتين.

          الـ DMARDs قسمين:
          - **Synthetic**: منهم **conventional (csDMARDs)** زي الـ methotrexate، و **targeted (tsDMARDs)** وهم الـ ==JAK inhibitors==.
          - **Biological (bDMARDs)**: الـ antibodies والـ fusion proteins.

          وبتتاخد لوحدها أو **combination** في المرض الشديد.
