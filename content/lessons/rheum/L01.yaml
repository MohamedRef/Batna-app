  - id: rheum.L01.lesson2
    title: "مين بيعمل إيه: الوظايف والست عائلات"
    hook: "IL-1 بيسخّن، IL-5 بينادي الـ eosinophils، TGF-β بيهدّي. كل واحد ليه شخصية."
    minutes: 10
    pages: [6, 10]
    topics: [functions, families]
    goals:
      - "تحفظ الخمس وظايف بمثال لكل وظيفة"
      - "تقرا Table 12-1: مين بيفرز إيه وبيأثر على مين"
      - "تعدّ الست عائلات وتعرف أعضاء كل عيلة"
    status: unverified
    steps:
      - kind: table
        page: 6
        quote: "Induction of inflammatory response (IL-1, IL-6 and TNF-a). 3. Regulation of hematopoiesis (GM-CSF)."
        title: "خمس وظايف، خمس أمثلة"
        columns: ["Function", "Example"]
        rows:
          - ["Cellular and humoral immunity", "IL-2, IL-4"]
          - ["Inflammatory response", "IL-1, IL-6, TNF-α"]
          - ["Hematopoiesis", "GM-CSF"]
          - ["Proliferation and differentiation", "IL-2"]
          - ["Wound repair", "TGF-β"]
        hide: [[1, 1], [2, 1], [4, 1]]
      - kind: aside
        tone: exam
        page: 6
        quote: "Induction of inflammatory response (IL-1, IL-6 and TNF-a)."
        text: "التلاتي IL-1 و IL-6 و TNF-α هم «تلاتي الحرارة والـ acute phase». هتقابلهم في كل محاضرة روماتيزم: CRP عالي = غالبًا IL-6 شغال."
      - kind: figure
        page: 6
        quote: "Interleukin 1 (IL-1) Monocytes, macrophages, endothelial cells, epithelial cells"
        title: "Innate ولا adaptive؟"
        alt: "Two columns of boxes. Innate column: IL-1, TNF-alpha, IL-12, IL-6, IFN-alpha, IFN-beta, mostly from macrophages. Adaptive column: IL-2, IL-4, IL-5, TGF-beta, IFN-gamma, mostly from T cells."
        caption: "قاعدة سهلة من Table 12-1: الـ innate cytokines أغلبها من الـ macrophage، والـ adaptive أغلبها من الـ T cells."
        svg: |
          <svg viewBox="0 0 330 290" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="5" width="155" height="280" rx="10" class="fg-acc"/>
            <text x="20" y="28" class="t-b t-acc">Innate</text>
            <text x="20" y="46" class="t-sm t-mut">mostly macrophages</text>
            <text x="20" y="75" class="t-sm">IL-1: fever, APP</text>
            <text x="20" y="105" class="t-sm">TNF-α: cachexia</text>
            <text x="20" y="135" class="t-sm">IL-12: NK, TH1</text>
            <text x="20" y="165" class="t-sm">IL-6: APP, B cells</text>
            <text x="20" y="195" class="t-sm">IFN-α: antiviral</text>
            <text x="20" y="225" class="t-sm">IFN-β: fibroblasts</text>
            <text x="20" y="255" class="t-sm t-mut">↑ MHC I, NK</text>
            <rect x="170" y="5" width="155" height="280" rx="10" class="fg-good"/>
            <text x="185" y="28" class="t-b t-good">Adaptive</text>
            <text x="185" y="46" class="t-sm t-mut">mostly T cells</text>
            <text x="185" y="75" class="t-sm">IL-2: T growth</text>
            <text x="185" y="105" class="t-sm">IL-4: TH2, IgE</text>
            <text x="185" y="135" class="t-sm">IL-5: eosinophils</text>
            <text x="185" y="165" class="t-sm">TGF-β: brake, IgA</text>
            <text x="185" y="195" class="t-sm">IFN-γ: macrophage</text>
            <text x="185" y="225" class="t-sm t-mut">↑ MHC I and II</text>
          </svg>
      - kind: check
        page: 6
        quote: "Transforming growth factor β (TGF-β) T cells, macrophages, other cell types Inhibits T-cell proliferation"
        question: "Which cytokine promotes the isotype switch to IgA?"
        options: ["TGF-β", "IL-4", "IL-5", "IFN-γ"]
        answer: 0
        why:
          - "صح: TGF-β فرامل للـ T و B والـ macrophage، وبيعمل switch لـ IgA."
          - "IL-4 بيعمل switch لـ IgE."
          - "IL-5 للـ eosinophils."
          - "IFN-γ بينشّط الـ macrophage ويزوّد MHC."
      - kind: aside
        tone: tip
        page: 6
        quote: "Inhibits T-cell proliferation and effector functions; inhibits B-cell proliferation; promotes isotype switch to IgA"
        text: "TGF-β = «A» زي «Anti» و «IgA»: Anti-proliferation للـ T والـ B والـ macrophage، وفي نفس الوقت IgA switch."
      - kind: explain
        page: 7
        quote: "Cytokines belong to 6 families o Interleukin 1 (IL-1). o Hematopoietin family (Class I). o Interferon family (Class II)."
        title: "الست عائلات"
        text: |
          1. **IL-1 family**: IL-1α، IL-1β، IL-1Ra، IL-18، IL-33.
          2. **Hematopoietin (class I)**: IL-2 لـ IL-7، IL-12، IL-13، IL-15، IL-21، GM-CSF، G-CSF.
          3. **Interferon (class II)**: IFN-α، β، γ ومعاهم IL-10، 19، 20، 22، 24.
          4. **TNF family**: TNF-α، TNF-β، CD40L، Fas، BAFF.
          5. **IL-17 family**: IL-17A لـ F.
          6. **Chemokines**: IL-8، CCL19، CCL21، CCL2، CCL3.

          كلهم ==أقل من 30 kDa==، وقليل جدًا منهم بيشتغل لوحده.
      - kind: sort
        page: 7
        quote: "Six major cytokine families Interleukin 1 family"
        prompt: "حط كل cytokine في عيلته:"
        bins: ["IL-1 family", "Class I", "Class II (IFN)", "Chemokines"]
        cards:
          - { text: "IL-18", bin: 0 }
          - { text: "IL-33", bin: 0 }
          - { text: "IL-2", bin: 1 }
          - { text: "GM-CSF", bin: 1 }
          - { text: "IL-6", bin: 1 }
          - { text: "IL-10", bin: 2 }
          - { text: "IFN-γ", bin: 2 }
          - { text: "IL-8", bin: 3 }
          - { text: "CCL2", bin: 3 }
        why: "الفخ الكبير: IL-10 مش في الـ class I مع باقي الـ ILs، ده في عيلة الـ interferons. و IL-8 chemokine مش interleukin بالمعنى العائلي."
      - kind: explain
        page: 8
        quote: "Cytokines of the interleukin 1 (IL-1) family are typically secreted very early in the immune response by dendritic cells, monocytes, and macrophages"
        title: "IL-1: أول واحد يوصل"
        text: |
          الـ ==IL-1 family== بيتفرز **بدري جدًا** من الـ dendritic cells والـ monocytes والـ macrophages بعد ما الـ innate receptors تشوف الميكروب.

          - **Proinflammatory**.
          - **Systemic**: بيخلي الكبد يعمل type I IFNs و IL-6 و CXCL8 ← بيكسروا الـ viral RNA ويعملوا **fever**.
          - الحرارة مفيدة: بتقتل الـ temperature-sensitive bacteria.
          - **Bridge**: بيساعد ينشّط الـ T والـ B cells.
      - kind: reveal
        page: 9
        quote: "The class 1 cytokine family is the largest family of cytokines"
        prompt: "أنهي عيلة هي الأكبر؟ وأنهي عيلة هي الأحدث؟"
        answer: "الأكبر: **class 1 (hematopoietin)**، وبتعمل proliferation و differentiation و antibody secretion. الأحدث اكتشافًا: **IL-17 family** (صفحة 10)."
      - kind: table
        page: 9
        quote: "Type I interferons (IFN-α and IFN-β), which mediate early antiviral response."
        title: "تلات أنواع interferon"
        columns: ["Type", "Members", "Job"]
        rows:
          - ["I", "IFN-α, IFN-β", "Early antiviral response"]
          - ["II", "IFN-γ", "Activates macrophages, supports TH1"]
          - ["III", "IFN-λ", "From pDCs; viral replication, host proliferation"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 10
        quote: "TNF-β is produced by activated lymphocytes and can deliver a variety of signals."
        title: "TNF و IL-17 والـ chemokines"
        text: |
          - **TNF family**: soluble أو membrane-bound (وأحيانًا الاتنين). بتنظّم الـ skeletal والـ neuronal والـ immune systems. ==TNF-α== من الـ activated macrophages أساسًا؛ **TNF-β** من الـ activated lymphocytes. ومساراتها هدف لأقوى الأدوية.
          - **IL-17**: من الـ **TH17** cells، receptors على الـ neutrophils والـ keratinocytes، ونتيجتها inflammation.
          - **Chemokines**: بتسحب الـ leukocytes على الـ gradient ناحية المصدر (**chemotaxis**).
      - kind: try
        items: [rheum.L01.031, rheum.L01.035, rheum.L01.040, rheum.L01.041, rheum.L01.053]
    recap:
      - "Inflammation: IL-1، IL-6، TNF-α. Hematopoiesis: GM-CSF. Wound repair: TGF-β."
      - "IL-4 ← IgE، IL-5 ← eosinophils، TGF-β ← IgA والفرامل."
      - "6 عائلات: IL-1، class I (الأكبر)، class II (IFN + IL-10)، TNF، IL-17 (الأحدث)، chemokines."
      - "IFN type I antiviral، type II = γ للـ macrophage، type III = λ من الـ pDC."
    practice: [rheum.L01.030, rheum.L01.031, rheum.L01.032, rheum.L01.033, rheum.L01.034, rheum.L01.035, rheum.L01.036, rheum.L01.037, rheum.L01.038, rheum.L01.039, rheum.L01.040, rheum.L01.041, rheum.L01.042, rheum.L01.043, rheum.L01.044, rheum.L01.045, rheum.L01.046, rheum.L01.047, rheum.L01.048, rheum.L01.049, rheum.L01.050, rheum.L01.051, rheum.L01.052, rheum.L01.053, rheum.L01.054, rheum.L01.055, rheum.L01.056, rheum.L01.057, rheum.L01.058, rheum.L01.059, rheum.L01.060, rheum.L01.061, rheum.L01.062, rheum.L01.063, rheum.L01.064, rheum.L01.065, rheum.L01.066]
