          - ["Urine sodium", ">20-30 mEq/L"]
          - ["Urine osmolality", ">100 mOsm/kg"]
          - ["Exclude", "Diuretics, severe hypothyroidism, adrenal insufficiency"]
        hide: [[0, 1], [2, 1], [3, 1], [4, 1]]
      - kind: reveal
        page: 421
        quote: "Table 8: Diagnosis of Syndrome of Inappropriate Antidiuresis\nPlasma serum osmolality <275 mOsmol/kg H2O\nPresence of euvolemia on physical examination (as defined by the absence of signs of hypovolemia or hypervolemia)\nElevated urinary sodium (>20-30 mEq/L or mmol/L)\nInappropriate urinary concentration (Uosm >100 mOsmol/kg H2O)\nAbsence of other potential causes of hyponatremia, such as diuretic use, severe hypothyroidism, adrenal insufficiency"
        prompt: "ليه الـ urine osmolality أكتر من 100 بتقول «inappropriate»؟"
        answer: "الدم مخفف (osmolality <275)، فالمفروض الـ antidiuretic hormone (ADH) يقف والكلية تطلّع بول مخفف جدًا (<100). لو البول مركّز رغم كده، يبقى فيه **ADH شغال من غير داعي** = **inappropriate antidiuresis**. (تفسير فسيولوجي، والأرقام من Table 8.)"
      - kind: figure
        page: 421
        quote: "Table 8: Diagnosis of Syndrome of Inappropriate Antidiuresis\nPlasma serum osmolality <275 mOsmol/kg H2O\nPresence of euvolemia on physical examination (as defined by the absence of signs of hypovolemia or hypervolemia)\nElevated urinary sodium (>20-30 mEq/L or mmol/L)\nInappropriate urinary concentration (Uosm >100 mOsmol/kg H2O)\nAbsence of other potential causes of hyponatremia, such as diuretic use, severe hypothyroidism, adrenal insufficiency"
        title: "ليه البول المركّز اسمه «inappropriate»؟"
        alt: "Two columns. Normal: plasma osmolality is low, so ADH switches off, so the urine is very dilute, under 100 mOsm/kg. SIAD: plasma osmolality is low under 275 but ADH is still on, for example from a tumour, so the urine osmolality is over 100, inappropriately concentrated, with urine sodium over 20 to 30 in a euvolemic patient."
        caption: |
