      - kind: explain
        remind: [dm.L21.020]
        page: 263
        title: "ضربتين من عيب واحد"
        quote: "Pathogenesis: defective LDL receptors.\n  The elevated levels of LDL-C are due to:\n  a) An increase in the production of LDL from IDL (since a portion of IDL is normally cleared by LDL receptor–mediated endocytosis.\n  b) A delayed removal of LDL from the blood"
        text: |
          الـ pathogenesis: ==defective LDL receptors==. والـ LDL-C بيعلى لسببين:
          1. **LDL أكتر بيتعمل من الـ IDL**. ليه؟ لأن جزء من الـ IDL بيتشال عادة بنفس الـ receptor (receptor-mediated endocytosis). لما الـ receptor يبوظ، الجزء ده كمان يكمّل ويبقى LDL.
          2. **الـ LDL بيتشال من الدم أبطأ**، لأن الـ receptor هو اللي بيشيله.

          يعني العيب الواحد بيزوّد **الداخل** ويقلل **الخارج** في نفس الوقت، وده سبب إن الرقم بيوصل لـ 200-400.
      - kind: table
        page: 263
        quote: "Types:\n  1. Homozygous FH: Children with homozygous FH often develop symptomatic coronary atherosclerosis before puberty"
        title: "Homo ولا hetero؟"
        columns: [Type, Alleles, Course]
        rows:
          - ["Homozygous", "2 mutant", "CAD before puberty"]
          - ["Heterozygous", "1 mutant", "CAD in adulthood, more common"]
        hide: [[0, 2], [1, 2]]
      - kind: aside
        tone: analogy
        page: 263
        quote: "Individuals with two mutated LDL receptor alleles (FH homozygotes) have much higher LDL-C levels than those with one mutant allele (FH heterozygotes)."
        text: "تخيّل الكبد **عمارة فيها بابين** للـ LDL. الـ heterozygous: باب واحد شغال، الزحمة متوسطة. الـ homozygous: البابين مقفولين، الزحمة في الشارع (الدم) رهيبة، والقلب بيتعب **قبل البلوغ**."
      - kind: explain
        remind: [dm.L21.022]
        page: 263
        title: "شكل العيان، وكل علامة يعني إيه"
        quote: "Clinical presentation of FH\n  1. Family history of xanthomata and premature death from CHD\n  2. Xanthelasma (Cholest deposition in the epidermal layer of the orbit)\n  3. Tendon xanthoma: Cholesterol deposits in tendons of extensor muscles (hand or Achilles tendon).\n  4. Tuberous xanthoma at pressure sites (elbow or Knee)\n  5. Juvenile corneal arcus (cholest. deposition in the cornea as a white or gray opaque ring at the corneal margin)\n  6. Accelerated atherosclerotic coronary and peripheral artery disease."
        text: |
          كل علامة في الكتاب هي **cholesterol deposition** في مكان:
          1. **Family history** لـ xanthomata ووفاة بدري من coronary heart disease (CHD)، لأنه autosomal dominant: نص العيلة شايلاه.
          2. ==Xanthelasma==: cholesterol في الـ epidermis حوالين العين (الجفون).
          3. **Tendon xanthoma**: في الـ extensor tendons بتاعة اليد أو الـ **Achilles**.
          4. **Tuberous xanthoma**: أماكن الضغط (**elbow، knee**).
          5. **Juvenile corneal arcus**: حلقة بيضا أو رمادي على حافة الـ cornea.
          6. Accelerated coronary و peripheral atherosclerosis.

          ليه كلمة "juvenile" مهمة؟ التفسير المقبول (مش في الكتاب): الـ arcus في الكبار ممكن يبقى شيخوخة عادية، لكن في سن صغير بيشاور على LDL عالي من زمان، يعني FH.
      - kind: match
        page: 263
        quote: "Clinical presentation of FH\n  1. Family history of xanthomata and premature death from CHD\n  2. Xanthelasma (Cholest deposition in the epidermal layer of the orbit)\n  3. Tendon xanthoma: Cholesterol deposits in tendons of extensor muscles (hand or Achilles tendon).\n  4. Tuberous xanthoma at pressure sites (elbow or Knee)\n  5. Juvenile corneal arcus (cholest. deposition in the cornea as a white or gray opaque ring at the corneal margin)\n  6. Accelerated atherosclerotic coronary and peripheral artery disease."
        prompt: "وصّل العلامة بمكانها:"
        pairs:
