    topic: measures
    front: "Strictly speaking, are the attack rate and prevalence true rates?"
    back: "No: mathematically they are proportions (the numerator is part of the denominator, no time unit in it). A true rate measures speed and puts time at risk (person-time) in the denominator. The lecture still calls them rates, as most textbooks do; for the exam, use the lecture's names."
    src: { page: 23, quote: "Rate:\n  Measures the occurrence of an event or disease in a given population during a given period (one Year). (Birth rate, growth rate, accident rate)\n  Usually expressed per 100 or per 1000 population.\n  It has a time dimension, whereas a PROPORTION does not." }
