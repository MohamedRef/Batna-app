    topic: indices
    calculator: feurea
    stem: "A heart-failure patient on IV furosemide has a rising creatinine and a FENa of 2.5%. Urine urea 450 mg/dL, plasma urea 80 mg/dL, urine creatinine 90 mg/dL, plasma creatinine 2.4 mg/dL."
    question: What is the FEurea and what does it suggest?
    inputs: { urine_urea_mg_dl: 450, plasma_urea_mg_dl: 80, urine_cr_mg_dl: 90, plasma_cr_mg_dl: 2.4 }
    expect: "15%"
    interpret: "(450 × 2.4) ÷ (80 × 90) × 100 = 15%. Below 35%, so prerenal (p109), even though the diuretic pushed the FENa up."
    src: { page: 109, quote: "Distinguishing Prerenal azotemia and ATN" }
    status: unverified
    tags: [numbers]
