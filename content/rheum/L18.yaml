  - id: rheum.L18.033
    kind: mcq
    topic: extraglandular
    stem: A 48-year-old woman with primary Sjögren syndrome reports numbness and burning in both feet. Which statement about her neurology fits the lecture?
    options:
      - Peripheral, mainly sensory neuropathy occurs in about 22% of primary Sjögren
      - Central nervous system disease is the commonest neurological form
      - Motor neuropathy is typical and sensory loss is rare
      - Neuropathy excludes Sjögren and points to sarcoidosis
      - Neuropathy occurs only in secondary Sjögren
    answer: 0
    why:
      - "Correct: peripheral neuropathy, primarily sensory, in 22% of primary SS (p304)."
