  - high-yield
  src:
    page: 13
    quote: "To recognize the type of study, one should ask three questions\n1. Aim of the study\na. To simply describe a population → descriptive\nb. To quantify the relationship between factors (PICO applicable)\
      \ → analytic\n2. If intervention analytic:\na. Randomized → randomized controlled trial (RCT)\nb. Non-randomized → Quazi-experimental\n3. If observational analytic, when the outcomes were determined?\n\
      a. Some time after the exposure → prospective cohort\nb. At the same time of the exposure → cross-sectional\nc. Before the exposure was determined → case-control study"
  status: unverified
- id: res.L20.019
  kind: mcq
  topic: studytype
  stem: An observational analytic study measured the outcome at the same time as the exposure. Which design is it?
  options:
  - Prospective cohort
  - Cross-sectional
  - Case-control
  - Quasi-experimental
  answer: 1
  why:
  - A prospective cohort measures the outcome some time after the exposure.
  - 'Right: outcome and exposure at the same time = cross-sectional.'
  - Case-control determines the outcome before the exposure.
  - Quasi-experimental is a non-randomized intervention study, not observational.
  src:
    page: 13
    quote: "3. If observational analytic, when the outcomes were determined?\na. Some time after the exposure → prospective cohort\nb. At the same time of the exposure → cross-sectional\nc. Before the exposure\
      \ was determined → case-control study"
  status: unverified
- id: res.L20.020
  kind: mcq
  topic: studytype
  stem: Investigators assign an intervention to patients but without randomization. What is the design?
  options:
  - Randomized controlled trial
  - Quasi-experimental
  - Prospective cohort
  - Case series
  answer: 1
  why:
  - An RCT needs random allocation.
  - 'Right: intervention analytic + non-randomized = quasi-experimental.'
  - In a cohort the investigator does not assign the exposure.
  - A case series is descriptive.
  src:
    page: 13
    quote: "2. If intervention analytic:\na. Randomized → randomized controlled trial (RCT)\nb. Non-randomized → Quazi-experimental"
  status: unverified
- id: res.L20.021
  kind: mcq
  topic: studytype
  stem: 'PICO(T) applicable studies are:'
  options:
  - Descriptive studies
  - Intervention analytic studies
  - Observational analytic studies
  - B and C
  - All types of studies (analytic and non analytic)
  answer: 3
  why:
  - Descriptive studies only describe; PICO needs a relationship between factors.
  - True, but observational analytic studies are PICO-applicable too.
  - True, but intervention analytic studies are PICO-applicable too.
  - 'Right: PICO(T) is best used in analytic studies, experimental and observational.'
  - Non-analytic studies take only the P and O.
  src:
    page: 14
    quote: "PICO(T) applicable studies are:\nA. Descriptive studies\nB. Intervention analytic studies\nC. Observational analytic studies\nD. B and C\nE. All types of studies (analytic and non analytic)\n\
      D"
  status: unverified
- id: res.L20.022
  kind: enumerate
  topic: studytype
  prompt: What does each letter of PICO(T) stand for?
  points:
  - 'P: patients or population studied'
  - 'I: the intervention performed'
  - 'C: the comparison used'
  - 'O: the studied outcomes'
  - 'T: the time in which the study was conducted'
  hook: «بيكوت» = مين (P) خد إيه (I) قصاد إيه (C) وحصله إيه (O) وفي قد إيه (T).
  pass: 5
  tags:
  - high-yield
  src:
    page: 16
    quote: "This includes identifying the\n(P) patients or population studied coupled with\n(I) the intervention performed,\n(C) the comparison used,\n(O) the studied outcomes, and\n(T) the time in which\
      \ the study was conducted."
  status: unverified
- id: res.L20.023
  kind: card
  topic: studytype
  front: Who first described the PICOT approach, and what is it?
  back: Sackett et al. A quick and easy way to approach any research question or medical article.
  src:
    page: 15
    quote: PICOT. The PICOT approach is a quick and easy way to approach any research question or medical article. The method was first described by Sackett et al.
  status: unverified
- id: res.L20.024
  kind: card
  topic: studytype
  front: Why does a well-constructed (PICO) research question matter when approaching an article?
  back: It allows the correct definition of which information (evidence) is needed to solve the clinical research question. Keep PICO(T) in mind especially in the introduction; it can build several kinds
    of research questions from clinical practice.
  src:
    page: 16
    quote: "PICO(T)\nThe adequate (well-constructed) research question allows for the correct definition of which information (evidence) is needed to solve the clinical research question.\nIn approaching\
      \ an article, especially in the introduction, one should always keep in mind the PICO(T) algorithm."
  status: unverified
- id: res.L20.025
  kind: card
  topic: studytype
  front: In which studies is the PICO(T) method best used?
  back: 'Analytic studies: experimental analytic (RCT or controlled trials) and observational analytic (cohorts, cross-sectional, case-control). Within it you introduce the objective and aims of the study.'
  src:
    page: 17
    quote: "Within this paradigm, you would introduce the objective and aims of the study.\nThis method is easily applied to experimental studies; however, this may be a bit challenging in certain studies.\
      \ The PICO(T) method is best used in analytic studies. This includes experimental analytic (RCT or controlled trials) and observational analytic studies (cohorts, cross-sectional, case control)."
  status: unverified
- id: res.L20.026
  kind: cloze
  topic: studytype
  text: In non-analytic studies (systematic reviews/meta-analysis, cross-sectional surveys), the intervention part is hard to apply, so only the {{c1::P}} (patient or population) and {{c2::O}} (outcome)
    can be applied.
  src:
    page: 17
    quote: It would therefore be difficult to apply this method, specifically the intervention aspect of it to non-analytic studies (systematic reviews/meta-analysis, cross-sectional surveys). Therefore,
      it would only be possible to apply the P and O (patient or population) and outcome.
  status: unverified
- id: res.L20.027
  kind: mcq
  topic: studytype
  stem: In construction of a clinical question (PICO method) it would only be possible to apply the P (patient) and O (outcome) in which study design?
  options:
  - Randomized controlled trials (RCTs) only
  - Cohort studies
  - Case control studies
  - Systematic reviews/meta-analysis
  answer: 3
  why:
  - 'RCTs are experimental analytic: the full PICO(T) applies.'
  - 'Cohorts are observational analytic: PICO applies.'
  - 'Case-control is observational analytic: PICO applies.'
  - 'Right: in non-analytic studies only P and O apply (per the lecture).'
  src:
    page: 18
    quote: "In construction of a clinical question (PICO method) it would only be possible to apply the P (patient) and O (outcome) in which of the following study design?\nA. Randomized controlled trials\n\
      B. Cohorts studies\nC. Case control studies\nD. Systematic reviews/meta-analysis\nD"
  status: unverified
