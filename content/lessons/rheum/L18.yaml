  - id: rheum.L18.lesson1
    title: "الغدد اللي نشفت: Sjögren بيبدأ إزاي؟"
    hook: "عيون رملة وبُق ناشف، ووراهم interferon وBAFF بيصنعوا B cells متمردة."
    minutes: 8
    pages: [301, 303]
    topics: [definition, pathogenesis]
    goals:
      - "تعرّف Sjögren وتفرّق primary من secondary"
      - "تحفظ أرقام الـ epidemiology"
      - "ترسم الـ pathogenesis من الـ trigger لحد الـ autoantibodies"
    status: unverified
    steps:
      - kind: explain
        page: 301
        title: "التعريف في سطرين"
        quote: "Sjögren's syndrome (SS) is a chronic multisystem autoimmune rheumatic disease, associated in the majority of cases with infiltration of exocrine glands, particularly the salivary and lacrimal glands, by lymphocytes and plasma cells , resulting in xerostomia and xerophthalmia."
        text: |
          الـ **Sjögren syndrome** مرض ==chronic multisystem autoimmune== بيدخل فيه **lymphocytes and plasma cells** جوه الـ **exocrine glands**، وأهمهم الـ **salivary** والـ **lacrimal**.

          النتيجة: **xerostomia** (بُق ناشف) و **xerophthalmia** (عين ناشفة).

          وهو مرض **heterogeneous**: من غدد بس لحد systemic features ممكن تهدد الحياة في الأعصاب والكلى والمفاصل والجلد والدم والرئة.
      - kind: table
        page: 301
        quote: "Sjögren syndrome (SjS), a systemic autoimmune disease that affects 1–23 persons per 10 000 inhabitants in European countries.\nThis autoimmune rheumatic disease is 9–20 times more common in females than males."
        title: "أرقام لازم تحفظها"
        columns: [Fact, Number]
        rows:
          - ["Prevalence (Europe)", "1–23 per 10 000"]
          - ["Female : male", "9–20 : 1"]
          - ["Commonest age", "30–60 years"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: joke
        page: 301
        quote: "This autoimmune rheumatic disease is 9–20 times more common in females than males."
        text: "ستات أكتر من الرجالة بـ **9–20 مرة**. يعني لو قابلت راجل عنده Sjögren، اسأله بشياكة: «إنت متأكد إنك مش جاي تاخد دوا مراتك؟» 😄 (بس برضو اعمله الـ workup كامل.)"
      - kind: explain
        page: 302
        title: "Primary ولا secondary؟"
        quote: "Primary Sjogren's syndrome (pSS) occurs in the absence of other autoimmune diseases and is characterized by keratoconjunctiva sicca (dry eyes) and xerostomia (dry mouth), collectively called the sicca syndrome. In contrast, secondary Sjogren's syndrome presents along with other autoimmune diseases such as rheumatoid arthritis (RA), systemic sclerosis and systemic lupus erythematosus (SLE)."
        text: |
          - ==Primary Sjögren== (pSS): **من غير** أي autoimmune disease تاني. فيه **keratoconjunctivitis sicca** + **xerostomia** = الـ **sicca syndrome**.
          - **Secondary Sjögren**: بييجي **مع** مرض autoimmune تاني: **Rheumatoid arthritis (RA)**، **systemic sclerosis**، **systemic lupus erythematosus (SLE)**.

          ليه التفرقة دي مهمة؟ لأن في الـ secondary المرض التاني (RA، SSc، SLE) هو اللي بيحدد العلاج والـ prognosis، والـ sicca بيتعالج جنبه. وكمان الـ 2016 criteria معمولة للـ primary (الدرس التالت).
      - kind: check
        page: 302
        quote: "Primary Sjogren's syndrome (pSS) occurs in the absence of other autoimmune diseases and is characterized by keratoconjunctiva sicca (dry eyes) and xerostomia (dry mouth), collectively called the sicca syndrome. In contrast, secondary Sjogren's syndrome presents along with other autoimmune diseases such as rheumatoid arthritis (RA), systemic sclerosis and systemic lupus erythematosus (SLE)."
        question: "A woman with systemic sclerosis develops dry eyes and dry mouth. Label?"
        options:
          - "Secondary Sjögren syndrome"
          - "Primary Sjögren syndrome"
          - "Sicca syndrome excludes Sjögren"
          - "IgG4-related disease"
        answer: 0
        why:
          - "صح: sicca مع مرض autoimmune تاني (systemic sclerosis) = secondary."
          - "الـ primary بيكون من غير أي autoimmune disease تاني."
          - "الـ sicca syndrome هو نفسه dry eyes + dry mouth، مش بيستبعد حاجة."
          - "الـ IgG4-related disease من الـ exclusion criteria، مش اسم الحالة دي."
      - kind: explain
        remind: [rheum.L18.011]
        page: 302
        title: "الجينات والـ triggers"
        quote: "Pathogenesis of sjs is believed to be multifactorial Genetics susceptibility there is a stronger association with HLA D8, DR3,although DR4 is more closely associated with syndrome occurring with Raynaud phenomenon."
        text: |
          - **Genetics:** أقوى ارتباط بـ ==HLA-B8 و DR3== (الكتاب كاتبها «D8»). أما **DR4** فمرتبط أكتر بالـ Sjögren اللي معاه **Raynaud phenomenon**.
          - **Viral triggers:** **Epstein–Barr virus (EBV)**، **cytomegalovirus (CMV)**، **Hepatitis C virus (HCV)**.
          - **Hormones:** **estrogen** والـ female sex hormones، وده بيفسّر ليه الستات أكتر.
      - kind: explain
        page: 302
        title: "اللي بيحصل في النسيج"
        quote: "Infiltration of target tissues by lymphocytes and plasma cells. - Autoantibody production (Anti-RO) production. - Connective tissue proliferation. - Glandular cell apoptosis."
        text: |
          - **Infiltration** بالـ lymphocytes والـ plasma cells
          - **Autoantibodies:** أهمهم ==anti-Ro==
          - **Connective tissue proliferation**
          - **Glandular cell apoptosis**
          - **Atrophy** في الـ salivary والـ **sebaceous** والـ **sweat glands** (علشان كده الجلد كمان بينشف)
          - **Edema** وتغييرات secondary في الـ conjunctiva
      - kind: reveal
        page: 302
        quote: "glandular epithelial cells become deregulated and release chemokines and adhesion molecules."
        prompt: "في الـ Sjögren مين اللي بيبدأ الحكاية: المناعة ولا الغدة نفسها؟"
        answer: |
          الكتاب بيقول إن الـ ==glandular epithelial cells== هي اللي بتتلخبط الأول (deregulated) وتطلّع **chemokines** و **adhesion molecules**. يعني الغدة نفسها هي اللي "بتنده" على الـ dendritic cells والـ lymphocytes.

          التفسير المقبول (مش في الكتاب): علشان كده بعض الناس بيسمّوه **autoimmune epithelitis**: المرض بيبدأ من الخلية اللي بتعمل الريق والدموع، والمناعة بتيجي بعدها. وده بيفسّر ليه الضرر بيتركّز في الـ **exocrine glands** بالذات (salivary، lacrimal، sebaceous، sweat).
      - kind: figure
        remind: [rheum.L18.011]
        page: 303
        quote: "Interferons stimulate the production of BAFF by epithelial cells, dendritic cells and T cells."
        title: "من الـ trigger للـ autoantibody"
        alt: "Vertical flowchart of Sjögren pathogenesis. Genes plus a viral or hormonal trigger lead to deregulated glandular epithelial cells releasing chemokines and adhesion molecules. These attract dendritic cells and T and B cells. Dendritic cells make interferon, which retains lymphocytes and stimulates BAFF from epithelial cells, dendritic cells and T cells. BAFF drives irregular B-cell maturation into autoimmune B cells that secrete autoantibodies locally."
        caption: "الـ ==interferon== هو الوقود، والـ **BAFF** هو اللي بيطلّع الـ B cells المتمردة. افتكر السلسلة دي، هتفهم بيها ليه الـ lymphoma خطر بعدين."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L18a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="35" y="10" width="260" height="48" rx="10" class="fg-acc"/>
            <text x="165" y="30" text-anchor="middle" class="t-sm t-b">Genes (HLA-B8, DR3)</text>
            <text x="165" y="47" text-anchor="middle" class="t-sm">+ virus (EBV, CMV, HCV) or estrogen</text>
            <path d="M165 58 V78" class="fg-arrow" marker-end="url(#L18a)"/>
            <rect x="35" y="80" width="260" height="48" rx="10" class="fg-box"/>
            <text x="165" y="100" text-anchor="middle" class="t-sm t-b">Glandular epithelial cells</text>
            <text x="165" y="117" text-anchor="middle" class="t-sm">release chemokines, adhesion molecules</text>
            <path d="M165 128 V148" class="fg-arrow" marker-end="url(#L18a)"/>
            <rect x="35" y="150" width="260" height="48" rx="10" class="fg-box"/>
            <text x="165" y="170" text-anchor="middle" class="t-sm t-b">Dendritic cells, T and B cells</text>
            <text x="165" y="187" text-anchor="middle" class="t-sm">migrate into the gland</text>
            <path d="M165 198 V218" class="fg-arrow" marker-end="url(#L18a)"/>
            <rect x="35" y="220" width="260" height="48" rx="10" class="fg-acc"/>
            <text x="165" y="240" text-anchor="middle" class="t-sm t-b t-acc">Interferon (from dendritic cells)</text>
            <text x="165" y="257" text-anchor="middle" class="t-sm">retains and activates lymphocytes</text>
            <path d="M165 268 V288" class="fg-arrow" marker-end="url(#L18a)"/>
            <rect x="35" y="290" width="260" height="48" rx="10" class="fg-acc"/>
            <text x="165" y="310" text-anchor="middle" class="t-sm t-b t-acc">BAFF</text>
            <text x="165" y="327" text-anchor="middle" class="t-sm">from epithelium, dendritic and T cells</text>
            <path d="M165 338 V358" class="fg-arrow" marker-end="url(#L18a)"/>
            <rect x="35" y="360" width="260" height="58" rx="10" class="fg-bad"/>
            <text x="165" y="381" text-anchor="middle" class="t-sm t-b t-bad">Autoimmune B cells</text>
            <text x="165" y="398" text-anchor="middle" class="t-sm">secrete autoantibodies (anti-Ro)</text>
            <text x="165" y="412" text-anchor="middle" class="t-sm t-mut">locally in the gland</text>
          </svg>
      - kind: order
        page: 303
        quote: "BAFF promotes irregular B-cell maturation, leading to the formation of autoimmune B-cells, which secrete autoantibodies locally."
        prompt: "رتّب السلسلة من غير ما تبص فوق:"
        steps:
          - "Trigger in a predisposed host"
          - "Epithelial cells release chemokines"
          - "Dendritic, T and B cells migrate in"
          - "Dendritic cells make interferon"
          - "Interferon stimulates BAFF"
          - "Autoimmune B cells make autoantibodies"
        why: "الـ epithelium هو أول واحد بيصرخ (chemokines)، والـ dendritic cells بتيجي وتطلّع interferon، والـ interferon يطلّع BAFF، والـ BAFF يربّي B cells غلط."
      - kind: check
        page: 303
        quote: "Interferons stimulate the production of BAFF by epithelial cells, dendritic cells and T cells."
        question: "In the book's Sjögren pathway, what stimulates BAFF production?"
        options: ["Interferons from dendritic cells", "Anti-Ro antibodies", "Estrogen directly", "IL-17 from Th17 cells"]
        answer: 0
        why:
          - "صح: الـ dendritic cells بتعمل interferon، والـ interferon يخلّي الـ epithelium والـ dendritic cells والـ T cells يطلّعوا BAFF."
          - "الـ anti-Ro نتيجة في آخر السلسلة، مش اللي بيطلّع الـ BAFF."
          - "الـ estrogen من الـ triggers، مش اللي بيحفّز الـ BAFF في الكتاب."
          - "الـ IL-17 بتاع الـ AS والـ RA، مش في سلسلة Sjögren في الكتاب."
      - kind: try
        items: [rheum.L18.001, rheum.L18.004, rheum.L18.008, rheum.L18.012, rheum.L18.016]
    recap:
      - "Sjögren = lymphocytes + plasma cells في الـ salivary والـ lacrimal glands ← xerostomia + xerophthalmia."
