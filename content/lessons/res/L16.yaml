- id: res.L16.lesson2
  title: 'درجة محمد: الـ empirical rule في امتحان'
  hook: 'محمد جاب 87 من 100. الدكتور قاله: المتوسط 75 والـ SD 10. يفرح قد إيه؟'
  minutes: 7
  pages: [13, 16]
  topics: [empirical]
  goals:
  - تحوّل 68 / 95 / 99.7 لمدى درجات حقيقي
  - تعرف مكان أي درجة بالنسبة للـ mean بعدد الـ SDs
  status: unverified
  steps:
  - kind: explain
    page: 13
    quote: |-
      Mohamed, a postgraduate student at the Faculty of Medicine, asked the professor about the distribution of exam scores after he saw his score of 87 out of 100.
      The professor told him the distribution of test scores was approximately bell-shaped with a mean score of 75 and a standard deviation of 10.
    title: القصة
    text: |-
      **محمد**، طالب دراسات عليا في كلية الطب، شاف درجته **87 من 100**. سأل الدكتور عن توزيع الدرجات، فقاله:

      - التوزيع تقريبًا ==bell-shaped==.
      - الـ **mean = 75**.
      - الـ **SD = 10**.

      وقارن درجته بزمايله: **أحمد 71**، **سارة 99**، و**فارس 39**.
  - kind: explain
    page: 14
    quote: Most people would have an intuitive grasp of the mean score as being the "average student's score" and would say
      this student did better than average. However, having an intuitive grasp of standard deviation is more challenging.
      The Empirical Rule is a helpful tool in explaining standard deviation.
    title: الـ mean سهل، الـ SD لأ
    text: |-
      كلنا فاهمين الـ **mean** = «درجة الطالب المتوسط»، فهنقول محمد أحسن من المتوسط.

      بس الـ **SD** صعب نحسّه. هنا ييجي ==Empirical Rule==: يحوّل الـ SD لمدى درجات تقدر تتخيله.
  - kind: figure
    page: 16
    quote: Mohamed
    title: الامتحان على المنحنى
    alt: A bell curve for exam scores with the base marked 45, 55, 65, 75, 85, 95 and 105. The middle band from 65 to 85 is
      shaded and labelled 68%. An arrow marks Mohamed's score of 87, just past 85. A note below reads 95% from 55 to 95 and
      99.7% from 45 to 105.
    caption: كل SD = **10 درجات**. فـ ±1 SD = **65–85**، و±2 SD = **55–95**، و±3 SD = **45–105**. ودرجة محمد **87** بعد الـ
      85 بشوية.
    svg: |-
