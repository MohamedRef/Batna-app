          - إزاي بيضيع؟ الـ **H+** بيتجمع برة الخلايا في الـ acidosis، فالـ K بيطلع من الخلايا ==مقابله==، وبعدين بيضيع في البول مع الـ osmotic diuresis.
          - بس الـ **serum K** بيبان طبيعي أو عالي، لأن الـ acidosis لسه ماسكة الـ K برة الخلايا.
          - أول ما تبدأ insulin وسوائل، الـ K ممكن ينزل فجأة، فلازم مراقبة وتعويض طول العلاج.
