    front: What is an acceptable HLA mismatch?
    back: Mismatched HLA antigens that do not give a positive CDC cross-match, so they do not lead to hyperacute rejection.
    src: { page: 328, quote: "Mismatch acceptability known as acceptable HLA-mismatch. These are mismatched HLA antigens that do not result in a positive complement dependent cytotoxicity (CDC) crossmatch. Not lead to hyper acute rejection." }
