    quote: |-
      Receiver Operating Characteristic (ROC)
      ROC Curve allows comparison of different tests for the same condition without (before) specifying a cut-off point.
      The test with the largest AUC (Area under the curve) is the best.
    title: ليه الـ ROC curve؟
    text: |-
      الـ ==ROC curve== (Receiver Operating Characteristic) بيسمحلك **تقارن tests مختلفة لنفس الـ condition** من غير ما تحدد cut-off الأول.

      والقاعدة: الـ test اللي ليه أكبر ==AUC== (Area Under the Curve) هو **الأحسن**.
