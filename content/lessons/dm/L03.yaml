        page: 33
        title: "ليه نخاف؟"
        quote: "most frequent cause of new cases of blinding in persons aged 20 to 74 years in the developed countries."
        text: |
          - الـ prevalence مرتبطة بـ ==duration== السكر و **level of control**.
          - السكر **أول سبب** للعمى الجديد في سن **20–74** في الدول المتقدمة.
