    topic: men1-treatment
    front: Medical treatment of prolactinoma in MEN 1 and its effect?
    back: Bromocriptine or cabergoline; normalises serum prolactin and prevents further tumour growth.
    src: { page: 9, quote: "1- Prolactinomas with dopamine antagonists (bromocreptine or cabergolin) normalizes serum prolactin and prevents further tumor growth." }
