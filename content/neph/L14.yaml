  - id: neph.L14.024
    kind: enumerate
    topic: ln-general
    prompt: When should an SLE patient have a kidney biopsy (Figure, p451)?
    points:
      - Proteinuria >0.5 g/24 h
      - Urinary sediment abnormalities (dysmorphic RBCs, RBC or leukocyte casts) with proteinuria
      - Impaired kidney function secondary to SLE
    pass: 2
    hook: "عينة الكلية في SLE لما الكلية «تسرّب، تنزّف، أو تتعب»: proteinuria فوق 0.5 g/24 h، sediment غلط (dysmorphic RBCs، RBC أو leukocyte casts) مع proteinuria، أو kidney function ضعفت بسبب SLE."
    src: { page: 451, quote: "Systemic Lupus Erithematosus (SLE)\n  Proteinuria > 0.5 g/24-hours\n  Urinary sediment abnormalities (dysmorphic red blood cells, red blood cell casts, leukocyte casts) concomitant with the presence of proteinuria\n  Impairment of renal function secondary to SLE\n    Kidney Biopsy\n      Non-proliferative LN\n        Class II (Mesangial)\n        Class V (Membranous): Nephrotic and non-nephrotic\n      Proliferative LN\n        Class III (Focal)\n        Class IV (Diffuse)\n        Class III/IV + V (Mixed)\n      Always report: Activity and Chronicity Index (NIH); Tubulo-interstitial injury and vascular involvement; Types of deposits by immunofluorescence\n      Other clinico-histological forms (Non-LN)\n        Lupus podocytopathy\n        Thrombotic microangiopathy (aHUS, TTP, APS)\n        Interstitial nephritis\n        Cryoglobulinemic glomerulonephritis\n        Acute tubular necrosis" }
    status: unverified
    tags: [high-yield]
