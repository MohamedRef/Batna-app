      - kind: mnemonic
        page: 93
        word: "PAB"
        parts:
          - { key: "P", text: "-Previr = Protease (NS3/4A) inhibitors" }
          - { key: "A", text: "-Asvir = NS5A inhibitors" }
          - { key: "B", text: "-Buvir = NS5B polymerase inhibitor" }
        hook: |
          الكتاب مش هيقولك الـ suffix، بس هو بيوفر عليك حفظ الجدول كله: الـ P في previr = protease، والـ A في asvir = NS5A، والـ B في buvir = NS5B.
      - kind: match
        page: 93
        prompt: "وصّل كل دوا بالـ target بتاعه:"
        pairs:
          - ["Grazoprevir", "NS3/4A protease"]
          - ["Velpatasvir", "NS5A replication complex"]
          - ["Sofosbuvir", "NS5B polymerase"]
        why: "-previr على الـ protease، -asvir على NS5A، -buvir على NS5B. Sofosbuvir هو الـ NS5B inhibitor الوحيد في جدول الكتاب."
      - kind: reveal
        prompt: "ليه كل الـ regimens فيها **دوايين من classes مختلفة** مش دوا واحد؟"
        answer: |
          الـ RNA polymerase بتاع الفيروس بيغلط كتير وهو بينسخ، فبيطلع طفرات طول الوقت. لو ضربت هدف واحد، طفرة واحدة ممكن تهرب منه.

          لو ضربت **هدفين** مع بعض (مثلًا NS5B + NS5A)، الفيروس محتاج طفرتين في نفس الوقت علشان يهرب، وده صعب جدًا. ده شرح physiology مقبول للـ combination، مش جملة من الكتاب.
