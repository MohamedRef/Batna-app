          - "ده لو 3 mL/kg/h."
          - "خلطت بين الـ mL والـ mEq."
      - kind: explain
        page: 132
        title: "الأعراض الجانبية والـ ODS"
        quote: "While a brain cell depleted of its organic osmolytes resists swelling in a hypotonic environment, it may dehydrate and shrink if its surrounding tonicity increases faster than it can reaccumulate effective osmoles. Osmotic demyelin- ation syndrome (ODS) can occur if correction of hypo-natremia is achieved too rapidly. Sequelae of ODS are often irreversible and include dysphagia, dysarthria, spasticity, behavioral disturbance, cognitive impairment, delirium, seizures, quadriparesis, coma, and \"locked in\" syndrome."
        text: |
          الـ hypertonic saline ممكن يعمل:
          - **Hyperchloremic metabolic acidosis** (NaCl زيادة).
          - **Hypernatremia** مع الاستعمال الطويل.
          - مشاكل الـ IV (الأشهر): infection، thrombophlebitis، extravasation، و hypervolemia. خلي بالك في الـ **congestive heart failure (CHF) و renal insufficiency**.

          والأخطر ==osmotic demyelination syndrome==: خلية المخ في الـ chronic hyponatremia رمت الـ **organic osmolytes** علشان ما تنفخش. لو الـ tonicity طلعت أسرع ما تلحق ترجّعهم، **تنكمش**. النتيجة غالبًا **irreversible**: dysphagia، dysarthria، spasticity، quadriparesis، و **locked-in**.
      - kind: figure
        page: 132
        quote: "While a brain cell depleted of its organic osmolytes resists swelling in a hypotonic environment, it may dehydrate and shrink if its surrounding tonicity increases faster than it can reaccumulate effective osmoles."
        title: "خلية المخ في تلات مشاهد"
        alt: "Three brain cells. Normal tonicity: normal size with osmolytes inside. Chronic hyponatremia: the cell has lost its organic osmolytes and keeps a normal size in the hypotonic fluid. Too-rapid correction: tonicity rises faster than the cell can reaccumulate osmolytes, water leaves and the cell shrinks, leading to osmotic demyelination."
        caption: "في الـ chronic الخلية ==رمت الـ osmolytes== علشان ما تنفخش. لو رفعت الـ tonicity أسرع ما تلحق ترجّعهم، تنكمش، وده الـ ODS."
