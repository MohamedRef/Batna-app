  - id: hem.L04.lesson4
    title: "الـ film بيتكلم: left shift و leukoerythroblastic و leukemoid"
    hook: "خلايا صغيرة في الدم معناها إن حد زق النخاع. السؤال: الزقة جاية من جوّه ولا من برّه؟"
    minutes: 8
    pages: [66, 66]
    topics: [blood-film]
    goals:
      - "تعرّف الـ shift to the left والـ leukoerythroblastic picture والـ leukemoid reaction"
      - "تعرف ليه الـ leukoerythroblastic معناه غالبًا النخاع اتزحم"
      - "تعرف أسباب كل واحدة وتفرّقهم في سؤال"
    status: unverified
    steps:
      - kind: explain
        page: 66
        title: "Shift to the left: الصغيرين طلعوا"
        quote: "Shift to the left: increase in the number of band forms and the occasional presence of more primitive cells in the peripheral blood."
        text: |
          - ==Shift to the left==: زيادة في الـ **band forms**، وأحيانًا خلايا **أصغر** (primitive) في الدم.
          - **Leukoerythroblastic picture**: **shift to the left + nucleated RBCs** في الدم.
          - **Leukemoid reaction**: **leukocytosis + left shift**، reactive، وفيها myeloblasts و promyelocytes و myelocytes.

          ليه اسمها "left"؟ التفسير المقبول (مش في الكتاب): زمان كانوا بيرسموا مراحل الـ neutrophil من الصغير (شمال) للناضج (يمين)، فلما الصغيرين يزيدوا، العدّ "يزيح" للشمال.

          والفرق بين التلاتة: الـ left shift هو الأساس، والسؤالين بعده: فيه **nucleated RBCs**؟ ولا الـ **WBC عالي جدًا**؟
      - kind: figure
        remind: [hem.L04.038]
        page: 66
        quote: "Leukoerythroblastic picture: a presence of a shift to left plus nucleated RBC in the peripheral blood."
        title: "تلات كلمات بتتلخبط"
        alt: "Three stacked boxes. Shift to the left equals more band forms and occasional primitive cells. Leukoerythroblastic equals left shift plus nucleated RBCs. Leukemoid reaction equals excessive reactive leukocytosis plus left shift."
        caption: "ابدأ دايمًا بالـ ==shift to the left==، وبعدين اسأل: فيه nucleated red blood cells (RBCs)؟ ولا الـ white blood cell (WBC) عالي جدًا؟"
        svg: |
