        text: |
          الـ ==acalculous cholecystitis==: التهاب في المرارة من غير حصوة.

          - في الكبار: 5–10% من الـ acute cholecystitis.
          - في الأطفال: 30%.

          وأسبابها في الكتاب:
          - **Critical conditions**: after major surgery، multiple injuries، major burns، severe sepsis، mechanical ventilation.
          - **Typhoid** bacilli.
          - **Actinomycosis**.
          - **Parasitic** cholecystitis.

          الكتاب مش بيدّي mechanism. التفسير المقبول (physiology، مش من الكتاب): الرابط بين الـ critical conditions كلها هو الـ stasis، لأن العيان مش بياكل (صايم أو على total parenteral nutrition (TPN))، فالمرارة مش بتنقبض وتفضى. وده نفس اللي عمل الـ sludge في درس المصنع.
