      - reveal: You choose basal only.
        question: How do you start?
        options: ["Keep the oral drugs, add 10 units (or 0.15 U/kg) of basal insulin at bedtime", "Stop the oral drugs and give 0.3 U/kg biphasic", "Give regular insulin before each meal", "Give 0.5 U/kg glargine in the morning"]
        answer: 0
        why: "Continue maximal OADs, add NPH, detemir, glargine or degludec at bedtime, start 10 units or 0.15 U/kg (p127)."
      - reveal: After a week, fasting glucose averages 150 mg/dl.
