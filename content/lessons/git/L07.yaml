      - kind: explain
        page: 229
        title: "امتى تعمل upper endoscopy لعيان بينزف من تحت؟"
        quote: "Hematochezia associated with hemodynamic instability may be indicative of an UGIB source, and an upper endoscopy should be performed if the suspicion is high to exclude a proximal source of bleeding."
        text: |
          الكتاب بيرجع للفخ تاني في ص 229: ==hematochezia + hemodynamic instability== ممكن تبقى **UGIB**، فلو الشك عالي اعمل **upper endoscopy** الأول **to exclude a proximal source of bleeding**.

          وده نفس أول مربع في Figure 1: «exclude an upper source if appropriate». ليه قبل الـ colonoscopy؟ التفسير المقبول (مش في الكتاب): الـ upper endoscopy مش محتاجة prep وبتتعمل بسرعة، ولو المصدر قرحة أو varices فعلاجها مختلف وتأخيره أخطر.
