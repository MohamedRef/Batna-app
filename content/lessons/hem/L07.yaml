            <rect x="175" y="28" width="70" height="40" rx="8" class="fg-acc"/><text x="210" y="45" text-anchor="middle" class="t-sm t-b">M4</text><text x="210" y="61" text-anchor="middle" class="t-sm">myelo+mono</text>
            <path d="M245 48 H258" class="fg-arrow" marker-end="url(#L07e)"/>
