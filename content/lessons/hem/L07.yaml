            <rect x="115" y="250" width="100" height="70" rx="10" class="fg-box"/>
            <text x="165" y="275" text-anchor="middle" class="t-sm t-b">Autologous</text>
            <text x="165" y="292" text-anchor="middle" class="t-sm">HSCT</text>
            <text x="165" y="309" text-anchor="middle" class="t-sm t-mut">no donor</text>
            <rect x="225" y="250" width="100" height="70" rx="10" class="fg-acc"/>
            <text x="275" y="275" text-anchor="middle" class="t-sm t-b">Allogeneic</text>
            <text x="275" y="292" text-anchor="middle" class="t-sm">HSCT</text>
            <text x="275" y="309" text-anchor="middle" class="t-sm t-mut">unfavourable</text>
          </svg>
      - kind: explain
        page: 112
        title: "بعد الـ CR: امنع الرجوع"
        quote: "After CR is achieved, the most important goal is to prevent recurrence."
        text: |
          بعد الـ **complete remission** أهم هدف: ==prevent recurrence==. تحت **60 سنة** فيه 3 اختيارات:
          1. **Intensive chemotherapy**: 3 cycles consolidation (high-dose Ara-C).
          2. **Autologous HSCT**: relapse أقل من الـ chemo بس أعلى من الـ allogeneic؛ لمين relapse بعد الـ consolidation أو مالوش donor.
          3. ==Allogeneic HSCT==: أكبر فايدة لأصحاب الـ **unfavorable cytogenetics**.
      - kind: order
        page: 112
        quote: "Etoposide 75 mg/m2, IVI daily for 5 days"
        prompt: "رتّب الـ consolidation courses:"
        steps:
          - "Repeat the induction regimen"
          - "High-dose Ara-C 1 g/m2 q12h days 1, 3, 5 + etoposide 75 mg/m2 × 5"
          - "HAM: high-dose Ara-C days 1–3 + mitoxantrone days 3–5"
        why: "الأول زي الـ induction، وبعدين الـ high-dose Ara-C مع etoposide، وآخر واحد HAM = High-dose Ara-C + Mitoxantrone."
      - kind: explain
        page: 113
        title: "Residual disease والـ relapse"
        quote: "Up to 50% of patients with AML achieve a second CR using the same drugs used that induce the first remission or HDAC."
        text: |
          - نخاع **day 14** فيه نزول كويس بس مفيش CR ← كرّر النخاع **day 28**؛ لو لسه فيه residual ← ==second induction course==.
          - في الـ **relapse**: لحد **50%** بيعملوا second CR بنفس الأدوية أو **HDAC**.
          - المؤهل ← **allogeneic transplant**؛ مالوش donor ← autologous.
          - High risk أو فوق 60 ← investigational: ==Mylotarg== (**anti-CD33**) 9 mg/m2 وتتكرر بعد 14 يوم.
      - kind: check
        page: 112
        quote: "Patients with unfavorable cytogenetics seem to drive the maximal benefit from allogenic"
        question: "AML in CR, age 38, unfavorable cytogenetics, matched sibling. Best post-remission option?"
        options:
          - "Allogeneic HSCT"
          - "Autologous HSCT"
          - "No further treatment"
          - "ATRA for one year"
        answer: 0
        why:
          - "صح: الـ unfavorable cytogenetics بياخدوا أكبر فايدة من الـ allogeneic."
          - "الـ autologous relapse بتاعه أعلى، وبيتساب لمين مالوش donor."
          - "بعد الـ CR الهدف منع الرجوع، مش التوقف."
          - "الـ ATRA للـ APL بس."
      - kind: explain
        page: 113
        title: "الـ APL: علاج مختلف خالص"
        quote: "Dose 45 mg/m PO divided in 1 x 2 daily for 45-90 days."
        text: |
          - **Induction**: ==Vesanoid (ATRA)== **45 mg/m2** بالبق على جرعتين، **45–90 يوم** + **idarubicin 8–12 mg/m2** أيام 2، 4، 6، 8، وممكن **Adriamycin 25–30** بداله.
          - **Consolidation**: بعد الـ CR **2 courses** anthracycline + cytarabine.
          - **Maintenance**: ATRA يوميًا ==سنة كاملة==.

          والـ **DIC** في M3: الكتاب بيدي **low-dose heparin 50 units/kg كل 6 ساعات**.
      - kind: reveal
        page: 113
        quote: "Vesanoid (ATRA): Supplied 10 mg capsules. Dose 45 mg/m PO divided in 1 x 2 daily for 45-90 days."
        prompt: "ليه الـ ATRA بتنفع في الـ APL بالذات؟"
        answer: |
          الـ t(15;17) بتعمل fusion protein بيقفل على الـ **retinoic acid receptor**، فالـ promyelocyte بيقف عند مرحلته.

          جرعة عالية من **all-trans retinoic acid** بتفك القفلة دي، فالخلايا تكمّل **differentiation** لـ neutrophils بدل ما تتكسر وتعمل DIC. (ده تفسير فسيولوجي؛ الجرعات من الكتاب.)
      - kind: update
        page: 113
        quote: "Vesanoid (ATRA): Supplied 10 mg capsules."
        text: "النهارده الـ APL الـ low/intermediate risk (WBC ≤10,000) بتتعالج بـ ATRA + arsenic trioxide من غير chemo، ومفيش heparin روتيني للـ DIC. الامتحان: الكتاب."
        ref: "ELN recommendations for APL, 2019"
      - kind: try
        items: [hem.L07.060, hem.L07.067, hem.L07.070, hem.L07.076, hem.L07.077]
    recap:
      - "3 + 7 = Ara-C 100 mg/m2 × 7 + Adriamycin 25–30 × 3."
      - "Elderly: Ara-C × 5 + Adriamycin مرة. High WBC: hydroxyurea أو etoposide أو low-dose Ara-C."
      - "بعد الـ CR: consolidation × 3، auto، أو allo (unfavorable cytogenetics)."
      - "Day 14 ثم day 28؛ relapse: second CR لحد 50%، Mylotarg anti-CD33 فوق 60."
      - "APL: ATRA + idarubicin ← 2 consolidations ← ATRA سنة."
    practice: [hem.L07.059, hem.L07.060, hem.L07.061, hem.L07.062, hem.L07.063, hem.L07.064, hem.L07.065, hem.L07.066, hem.L07.067, hem.L07.068, hem.L07.069, hem.L07.070, hem.L07.071, hem.L07.072, hem.L07.073, hem.L07.074, hem.L07.075, hem.L07.076, hem.L07.077, hem.L07.078, hem.L07.079, hem.L07.080, hem.L07.081, hem.L07.098, hem.L07.099, hem.L07.100, hem.L07.103, hem.L07.105, hem.L07.106, hem.L07.109]
