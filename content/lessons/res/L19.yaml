  - kind: explain
    page: 38
    quote: |-
      Disease-Oriented Outcomes
      These outcomes include intermediate, histopathologic, physiologic, or surrogate results (e.g., blood sugar, blood pressure, flow rate, coronary plaque thickness) that may or may not reflect improvement in patient outcomes.
    title: أنهي outcome؟
    text: |-
      **Disease-oriented**: نتائج ==surrogate== أو physiologic (blood sugar، blood pressure، flow rate، plaque thickness)، ممكن تعكس تحسّن المريض وممكن لأ.

      **Patient-oriented**: اللي المريض بيحسه فعلًا: mortality، disease-free period، quality of life، work absenteeism، disability، duration/severity، pain، cost.

      افتكر الـ antiarrhythmics: الـ surrogate اتحسن والـ ==mortality== زادت.
    remind: [res.L19.036]
  - kind: check
    page: 38
    quote: |-
      Disease-Oriented Outcomes
      These outcomes include intermediate, histopathologic, physiologic, or surrogate results (e.g., blood sugar, blood pressure, flow rate, coronary plaque thickness) that may or may not reflect improvement in patient outcomes.
    question: Which is a patient-oriented outcome?
    options:
    - Quality of life
    - Blood pressure
    - Blood sugar
    - Coronary plaque thickness
    answer: 0
    why:
    - 'صح: حاجة المريض بيعيشها.'
    - 'surrogate: رقم على الجهاز.'
    - surrogate.
    - surrogate histopathologic.
  - kind: explain
    page: 39
    quote: |-
      Patient - oriented outcomes
      Mortality/survival
      Disease free period
      Quality of life
      Work absenteeism
      Disability
      Duration and severity of illness
      Pain
      Cost
    title: الـ outcomes اللي تهم المريض
    text: |
      الـ ==patient-oriented outcomes== اللي في السلايد 8:

      - Mortality/survival.
      - Disease free period.
      - Quality of life.
      - Work absenteeism.
      - Disability.
      - Duration and severity of illness.
      - Pain.
      - Cost.

      ليه دول أهم من الـ ==disease-oriented outcomes==؟ لأن المريض بيحس بيهم مباشرة؛ رقم في التحليل ممكن يتحسن والمريض نفسه ==ما يتحسنش==. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 47
    quote: |-
      Patient presenting with MI
      | 1. How common is the problem? | Prevalence |
      | 2. Is early detection worthwhile? | Screening |
      | 3. Is the diagnostic test accurate? | Diagnosis |
      | 4. What will happen if we do nothing? | Prognosis |
      | 5. Does this intervention help? | Treatment |
      | 6. What are the common harms of an intervention? | Treatment |
    title: أسئلة مريض الـ MI وأنواعها
    text: |
      نفس المريض (MI) ممكن يطلع منه أسئلة foreground من أنواع مختلفة:

      | السؤال | النوع |
      |---|---|
      | How common is the problem? | ==Prevalence== |
      | Is early detection worthwhile? | Screening |
      | Is the diagnostic test accurate? | ==Diagnosis== |
      | What will happen if we do nothing? | Prognosis |
      | Does this intervention help? | ==Treatment== |
      | What are the common harms of an intervention? | Treatment |

      ليه نعرف النوع؟ لأن نوع السؤال هو اللي بيحدد هتدوّر على أنهي design بعدين. التفسير المقبول (مش في الكتاب).
