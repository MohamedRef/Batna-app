  # ------------------------------------------------------------------
  - id: endo.L03.lesson1
    title: "الورم اللي بيعمل هرمونات: يعني إيه paraneoplastic؟"
    hook: "خلية سرطان رجعت طفلة، فافتكرت كل حاجة كانت بتعرف تعملها. ومنها هرمونات مش بتاعتها."
    minutes: 8
    pages: [31, 34]
    topics: [definition, pathophysiology, criteria, ectopic-nature]
    goals:
      - "تعرّف الـ PNS وتفرّقه عن الـ mass effect والـ metastasis"
      - "تعدّ معايير الـ endocrine PNS"
      - "تفهم ليه الـ ectopic hormone هو في الحقيقة eutopic"
    status: unverified
    steps:
      - kind: explain
        page: 31
        quote: "Neoplasm is defined as\n  \"Unregulated cell growth producing undifferentiated cells\".\n  This may physiologically occur during embryogenesis or wound repair.\n  But this occurs for a limited time at a specific period."
        title: "الـ neoplasm"
        text: |
          الكتاب بيعرّف الـ ==neoplasm== إنه **unregulated cell growth producing undifferentiated cells**.

          النمو ده بيحصل طبيعي في الـ embryogenesis والـ wound repair، بس **لفترة محدودة**. الخلايا الـ primitive دي شايلة قدرات خلايا كتير متخصصة، زي خلية أمها. علشان كده ممكن تعمل هرمونات.
      - kind: explain
        page: 31
        quote: "Clinical syndromes involving non metastatic systemic effects that accompany neoplastic diseases"
        title: "الـ PNS"
        text: |
          ==Paraneoplastic syndromes== = **clinical syndromes involving non-metastatic systemic effects** بتصاحب الأورام، وغالبًا جاية من الـ secretory products بتاعة الورم.
      - kind: sort
        page: 31
        quote: "Clinical picture of neoplastic disease\n  1) Mass effect Obstruction, invasion or compression.\n  2) Remote effect\n  Metastatic.\n  Non-metastatic (Paraneoplastic synd.)."
        prompt: "صنّف تأثير الورم:"
        bins: ["Mass effect", "Remote effect"]
        cards:
          - { text: "Obstruction", bin: 0 }
          - { text: "Compression", bin: 0 }
          - { text: "Invasion", bin: 0 }
          - { text: "Liver metastases", bin: 1 }
          - { text: "Paraneoplastic hypercalcaemia", bin: 1 }
        why: "الـ mass: obstruction، invasion، compression. الـ remote: metastatic أو non-metastatic (ده الـ PNS)."
      - kind: explain
        page: 32
        quote: "3) Psychic effect\n  Loneliness, acceptance, fear of pain or loss of control."
        title: "التأثير التالت: psychic"
        text: |
          غير الـ mass والـ remote، الكتاب بيعدّ تأثير تالت: ==psychic effect==.

          - **Loneliness**، **acceptance**، **fear of pain**، أو **loss of control**.

          يعني المريض محتاج حد يسمعه، مش بس تحاليل.
      - kind: explain
        page: 32
        quote: "Pathophysiology of Paraneoplasic Syndromes\n  1) Production of antibodies against neoplastic tissue that cross react with normal body tissue like CNS.\n  2) Production of physiologically active products like hormones, hormone precursors, enzymes, cytokines and fetal proteins.\n  3) Interference with metabolic pathway of steroid hormones.\n  4) Unknown."
        title: "بيحصل إزاي؟"
        text: |
          1. ==Antibodies== ضد الورم بتعمل cross-react مع أنسجة طبيعية زي الـ central nervous system (CNS).
          2. ==Physiologically active products==: hormones، precursors، enzymes، cytokines، fetal proteins.
          3. Interference مع الـ steroid metabolism.
          4. Unknown.

          وبيمس أجهزة كتير: endocrine، CNS، hematologic، skin، renal، gastrointestinal tract (GIT)، rheumatologic، neuromuscular، و non-specific.
      - kind: mnemonic
        page: 32
        quote: "Criteria for diagnosing Endocrinal Paraneoplastic Syndrome\n  1) Association of neoplastic disease with manifestations of excess hormone secretion.\n  2) Demonstration of mRNA in neoplastic tissue.\n  3) Demonstration of high hormone level in the circulation.\n  4) Failure of plasma or urinary hormone level to respond to normal suppression."
        word: "AMHFSER"
        parts:
          - { key: "A", text: "Association: tumour + hormone-excess picture" }
          - { key: "M", text: "mRNA of the hormone in tumour tissue" }
          - { key: "H", text: "High circulating hormone" }
          - { key: "F", text: "Fails normal suppression" }
          - { key: "S", text: "Step-up AV gradient across the tumour (>10)" }
          - { key: "E", text: "Exclude other causes" }
          - { key: "R", text: "Response: improves after tumour treatment" }
        hook: "السبع معايير بالترتيب بتاع الكتاب. أهم اتنين في الامتحان: الـ **step-up gradient** والـ **response بعد العلاج**."
      - kind: reveal
        page: 33
        quote: "It represents increased expression of genes normally expressed in low amounts by non-neoplastic cells."
        prompt: "الكتاب بيقول إن الـ ectopic hormone مش ectopic، هو eutopic. يعني إيه؟"
        answer: "يعني الجين ده **موجود أصلًا وشغال بكمية قليلة** في الخلايا الطبيعية. الورم مش اخترع حاجة جديدة، هو بس علّى الـ expression بتاعه. يعني الهرمون في مكانه (eutopic)، بس بكمية مش طبيعية."
      - kind: table
        page: 33
        quote: "The gene expression products of undifferentiated neoplastic cells are usually physiologically active, and it includes:\n  1) Hormones - ACTH.\n  2) Hormone precursor - Proopiomelanocortin.\n  3) Enzymes - Alkaline phosphatase.\n  4) Fetal protein - Alpha-Fetoprotein.\n  5) Cytokine - Colony stimulating F."
        title: "منتجات الورم"
        columns: ["Class", "Example"]
        rows:
          - ["Hormone", "ACTH"]
          - ["Precursor", "Pro-opiomelanocortin"]
          - ["Enzyme", "Alkaline phosphatase"]
          - ["Fetal protein", "Alpha-fetoprotein"]
          - ["Cytokine", "Colony stimulating factor"]
        hide: [[1, 1], [3, 1], [4, 1]]
      - kind: explain
        page: 33
        quote: "These products have many clinical implications\n  1) It is used as a tumor marker.\n  2) It is important for follow up of patients.\n  3) It is important for detection of recurrence.\n  4) It may be responsible for serious manifestations like PTHRP causing hypercalcemia.\n  5) It may promote the growth of the tumor by autocrine effect."
        title: "ليه نهتم؟"
        text: |
          المنتجات دي:
          - ==Tumor marker==.
          - مهمة في الـ **follow up** وكشف الـ **recurrence**.
          - ممكن تعمل مضاعفات خطيرة (زي الـ parathyroid hormone-related protein (PTHrP) والـ hypercalcemia).
          - ممكن تكبّر الورم نفسه بـ **autocrine effect**.
      - kind: explain
        page: 34
        quote: "The sequence of AA in poly-peptide ectopic hormone is identical to that of the native hormone."
        title: "شكل الـ ectopic hormone"
        text: |
          الـ amino acid sequence ==identical== للهرمون الطبيعي. الفرق كله من الـ **processing** الغلط للـ precursor، فممكن الـ immunoassay يطلع عالي والـ bioassay واطي:
          - **High molecular weight (MW)**: الـ precursor ما اتقطعش (POMC).
          - **Low MW**: fragment (GHRH fragment).
          - **Altered glycosylation**: glycosylated adrenocorticotropic hormone (ACTH)، أو alpha subunit بتاع human chorionic gonadotropin (hCG).

          والـ ectopic hormone ممكن يبقى polypeptide (ACTH)، monoamine (adrenaline)، أو steroid (1,25-dihydroxy vit D).
      - kind: match
        page: 34
        quote: "The Endocrine Paraneoplastic Syndrome\n  1) Ectopic PTHRP Hypercalcemia.\n  2) Ectopic ACTH Cushing Syndrome.\n  3) Ectopic IGFII Hypoglycemia.\n  4) Ectopic ADH SIAD Syndrome.\n  5) Ectopic HCG Gynecomastia.\n  6) Fibroblast growth factor 23 Oncgenic osteomalcia.\n  7) Ectopic GH and GHRH Acromegaly."
        prompt: "وصّل المنتج بالمتلازمة:"
        pairs:
          - ["PTHrP", "Hypercalcaemia"]
          - ["ACTH", "Cushing's syndrome"]
          - ["IGF-II", "Hypoglycaemia"]
          - ["ADH", "SIADH"]
          - ["hCG", "Gynaecomastia"]
          - ["FGF-23", "Oncogenic osteomalacia"]
        why: "والسابعة: growth hormone (GH) و growth hormone-releasing hormone (GHRH) بيعملوا acromegaly."
      - kind: try
        items: [endo.L03.004, endo.L03.006, endo.L03.008, endo.L03.013, endo.L03.018]
    recap:
      - "Neoplasm = unregulated growth of undifferentiated cells."
      - "PNS = non-metastatic systemic effects، غالبًا من secretory products."
      - "Mechanisms: antibodies، active products، steroid pathway، unknown."
      - "7 criteria؛ أهمهم step-up gradient >10 والتحسن بعد العلاج."
      - "Ectopic = eutopic: جين طبيعي اتعلّى؛ الـ sequence زي الطبيعي والفرق في الـ processing."
    practice: [endo.L03.001, endo.L03.002, endo.L03.003, endo.L03.004, endo.L03.005, endo.L03.078, endo.L03.006, endo.L03.007, endo.L03.008, endo.L03.077, endo.L03.009, endo.L03.010, endo.L03.011, endo.L03.012, endo.L03.013, endo.L03.014, endo.L03.015, endo.L03.016, endo.L03.017, endo.L03.018, endo.L03.055, endo.L03.056, endo.L03.057, endo.L03.072, endo.L03.073]
