    front: What invasive options exist for symptomatic polycystic liver disease?
    back: Percutaneous cyst aspiration and sclerosis, laparoscopic fenestration and open surgical fenestration.
    src: { page: 161, quote: "Rarely, symptomatic PLD may require invasive measures to reduce cyst volume and hepatic size. Options include percutaneous cyst aspiration and sclerosis, laparoscopic fenestration, and open surgical fenestration." }
