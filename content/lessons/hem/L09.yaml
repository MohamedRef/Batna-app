        word: "PASTE"
        parts:
          - { key: "P", text: "Pomalidomide: also reported to work" }
          - { key: "A", text: "Androgens: up to one third respond (oxymetholone 50–150 mg, danazol 400–600 mg); best with no massive spleen and a normal karyotype" }
