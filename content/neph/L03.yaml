  - id: neph.L03.017
    kind: enumerate
    topic: pathogenesis
    prompt: List the four pathways from acute heart failure to acute kidney disease in CRS-1 (Figure 2).
    points:
      - "Humoral signaling → endothelial activation → cytokine secretion"
      - "Diuretic and ACE inhibitor → toxicity, vasoconstriction"
      - "Hemodynamically mediated damage → decreased perfusion, increased venous pressure"
