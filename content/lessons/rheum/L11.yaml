      - kind: update
        page: 192
        quote: "The most common used marker for infection, detected by ELISA & confirmed by western blot assays. 3 months of latency (serological latency or window period)."
        text: "الكتاب: ELISA وبعدين western blot، و window لحد 3 شهور. النهاردة بيبدأوا بـ 4th-generation HIV-1/2 antigen/antibody combination (p24 + antibody) بـ window حوالي 2–6 أسابيع، والتأكيد بـ differentiation immunoassay مش western blot، ولو مش متطابقين: HIV RNA."
        ref: "CDC/APHL HIV laboratory testing algorithm 2014 (updated 2018)"
      - kind: reveal
        page: 193
        quote: "They can cross the placenta, thus can be detected in babies born to infected mothers & are not markers of active infection"
        prompt: "رضيع أمه HIV positive والـ anti-HIV عنده positive. هل هو مصاب؟"
        answer: |
          مش لازم. الـ ==anti-HIV IgG== بتاع الأم **cross the placenta**، فده مش marker للـ active infection، وفي الطفل السليم بيختفي خلال **18 شهر**. علشان كده بنعتمد على ==nucleic acid-based assays== للفيروس نفسه.
      - kind: explain
        page: 194
        title: "المراحل"
        quote: "Studies suggest a median time of 10 years from infection to development of AIDS."
        text: |
          - **Incubation** 2–4 أسابيع، صامت
          - **Seroconversion illness** بعد ==6–8 weeks==: fever، sore throat، LN، rash، mucosal ulcers، أحيانًا neurology. Labs: lymphopenia، thrombocytopenia، liver enzymes، CD4:CD8 reversed
          - **Clinical latency:** من غير أعراض بس معدي، و ==median 10 years== للـ AIDS. بعضهم persistent LN في موقعين extra-inguinal >3 شهور
          - **HIV نفسه:** AIDS dementia complex و distal sensory polyneuropathy، والكتاب بيقول **zidovudine** بيفيد
      - kind: update
        page: 195
        quote: "Symptoms of HIV disease. 2- CD4 count < 350. 3- Very rapidly falling CD4 count. 4- High viral load (> log 4)."
        text: "الكتاب: ابدأ ART لو فيه أعراض، أو CD4 <350، أو CD4 بيقع بسرعة، أو viral load >log 4. النهاردة: ART لكل مصاب أيًا كان الـ CD4، وفي أسرع وقت (same-day لو ينفع)."
        ref: "WHO consolidated HIV guidelines 2021; DHHS adult ART guidelines 2024"
