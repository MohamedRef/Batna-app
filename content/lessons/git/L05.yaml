      - kind: explain
        page: 203
        quote: "People with 1 or 2 small (<1 cm) tubular adenomas with low-grade dysplasia"
        title: "ليه الفترات دي بالذات؟"
        text: |
          الـ **ACS** للناس اللي عندهم polyps في منظار قبل كده:
          - **Small rectal hyperplastic**: ==10 years==.
          - **1-2 small tubular adenomas** (أقل من 1 cm) low-grade: **5-10 years**.
          - **3-10 adenomas**، أو واحد **1 cm أو أكتر**، أو **high-grade dysplasia** أو **villous**: **3 years**.
          - **أكتر من 10 adenomas** في منظار واحد: **within 3 years**.
          - **Sessile اتشال piecemeal**: **2-6 months**.

          التفسير المقبول (مش في الكتاب): الفترة بتعكس سؤالين: «القولون ده بيعمل بوليبات قد إيه؟» و«احتمال إننا سبنا حاجة قد إيه؟». الـ hyperplastic الصغير في الـ rectum بريء، فالقولون زي الطبيعي (10). الـ adenomas الكتير أو الكبيرة معناها قولون «نشيط» فنرجع أبدري (3). وأكتر من 10 بيلمّح لـ syndrome. والـ piecemeal أقصر فترة لأن السؤال هنا مش بوليب جديد، ده بقايا القديم.
