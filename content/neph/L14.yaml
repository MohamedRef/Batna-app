          - Repeat urine in 6 months
          - Kidney ultrasound only
        answer: 0
        why: "Proteinuria >0.5 g/24 h with active sediment = biopsy (p451)."
      - reveal: "Biopsy: endocapillary proliferation with subendothelial deposits in 70% of glomeruli, mostly global lesions, active (A)."
        question: Which class?
        options:
          - Class IV-G (A)
          - Class III (A)
          - Class V
          - Class II
        answer: 0
        why: "≥50% of glomeruli = IV; mostly global = IV-G (p449)."
      - question: She wants children later. Which initial regimen fits best?
        options:
          - Glucocorticoids + MPAA
          - Glucocorticoids + NIH monthly IV cyclophosphamide
          - Glucocorticoids alone
          - Azathioprine alone
        answer: 0
        why: "MPAA-based regimens are preferred when infertility risk matters (p457)."
      - question: Which hydroxychloroquine dose?
        options:
          - 4-5 mg/kg/day, max 400 mg
          - 10 mg/kg/day
          - 200 mg weekly
          - Not needed in nephritis
        answer: 0
        why: "HCQ 4-5 mg/kg/day, max 400 mg; 200 mg if eGFR <30 (p453)."
      - reveal: "After 3 months, proteinuria has fallen only 10%."
        question: What does the initial-therapy figure suggest?
        options:
          - Add belimumab or a CNI
          - Stop all treatment
          - Switch to azathioprine
          - Double prednisone to 2 mg/kg
        answer: 0
        why: "No ≥25% fall after 2-3 months: add belimumab or a CNI (p453)."
    src: { page: 452, quote: "Recommendation 10.2.3.1.1: We recommend that patients with active Class III or IV LN, with or without a membranous component, be treated initially with glucocorticoids plus any one of the following:\ni. Mycophenolic acid analogs (MPAAs) (1B); or\nii. Low-dose intravenous cyclophosphamide (1B); or\niii. Belimumab and either MPAA or low-dose intravenous cyclophosphamide (1B); or\niv. MPAA and a calcineurin inhibitor (CNI) when kidney function is not severely impaired (i.e., estimated glomerular filtration rate [eGFR] <45" }
