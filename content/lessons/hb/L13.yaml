  - id: hb.L13.lesson2
    title: "تلات أنواع وأربع variants"
    hook: "type 1 للكبار، type 2 للأطفال، وفيه variants نصها AIH ونصها cholangitis. نرتّبهم مرة واحدة."
    minutes: 8
    pages: [207, 209]
    topics: [aih-types]
    goals:
      - "تشرح الـ shared motif hypothesis بكلام بسيط"
      - "تفرّق الـ 3 types بالـ antibody والسن"
      - "تعرف كل variant بيتعالج إزاي ومتى تضيف UDCA"
    status: unverified
    steps:
      - kind: explain
        remind: [hb.L13.024]
        page: 207
        quote: "Autoantigen display, immunocyte activation, and effector cell expansion."
        title: "إيه اللي بيشعللها؟"
        text: |
          الـ pathogenesis نفسه **unknown**. أشهر فرضية بتقول إن فيه 3 عوامل بتشتغل مع بعض:

          - ==Triggering agent==: infection، أو drugs، أو toxins. ده الشرارة.
          - ==Genetic predisposition==: الأرض اللي الشرارة بتولّع فيها.
          - **Autoantigen display** و **immunocyte activation** و **effector cell expansion**: الجهاز المناعي بيشوف جزء من الكبد على إنه غريب، ويكبّر جيش الخلايا اللي بتهاجمه.

          والـ hepatocytes بتموت بطريقتين، أو بالاتنين:

          - **Cell-mediated cytotoxicity**: الـ T cells بتقتل الخلية مباشرة.
          - **Antibody-dependent cell-mediated cytotoxicity**: الـ antibody بيعلّم على الخلية، والخلايا القاتلة بتيجي على العلامة.

          ليه بيصيب ناس معيّنة بس؟ التفسير المقبول (مش في الكتاب): لازم الـ 3 عوامل يجتمعوا: genetic predisposition (الـ HLA في الخطوة الجاية) + trigger من بره + مناعة فقدت الـ tolerance. يعني نفس الـ trigger بيعدّي على ناس كتير، ويولّع المرض بس عند اللي عنده الأرضية.
      - kind: explain
        page: 207
        quote: "Different ethnic groups have different susceptibility alleles, and these findings support a shared motif hypothesis of pathogenesis. According to this hypothesis, risk of disease relates to amino acid sequences in the antigen binding groove of the class II MHC molecule, and multiple alleles encode the same or a similar sequence (shared motif)."
        title: "الـ HLA والـ shared motif"
        text: |
          الـ **class II major histocompatibility complex (MHC)** عنده **antigen binding groove**. ده المكان اللي بيتحط فيه الـ peptide علشان يتعرض على الـ immune cells. والـ alleles هي اللي بتحدد شكل الـ groove.

          - DRB1: الجين اللي عليه الـ susceptibility alleles.
          - **DRB1\*0301 و DRB1\*0401**: الـ alleles في البيض (northern Europe و North America).
          - ==LLEQKR==: الـ sequence اللي الاتنين بيشفّروه، والـ **lysine** (K) في position 71 من الـ DRβ chain.
          - **DRB1\*0404 و \*0405**: في Mexican و Japanese و Argentine adults. نفس الـ sequence تقريبًا، بس **arginine** (R) بدل الـ K عند DRβ71.

          ده الـ ==shared motif hypothesis==: الخطر مرتبط بالـ amino acids جوه الـ groove، مش باسم الـ allele. alleles مختلفة ممكن تعمل نفس الـ sequence، فتقدّم نفس الـ peptides.

          والـ autoantigen الوحيد المعروف كـ target هو cytochrome P450 2D6 (CYP2D6) (cytochrome P450 cytochrome P450 2D6 (IID6)). وده نفسه الـ novel antibody بتاع type 2.
      - kind: aside
        tone: analogy
        page: 207
        quote: "The critical shared motif in AIH in white northern Europeans and North Americans is represented by the six-amino-acid code LLEQKR, where lysine (K) is in position 71 of the DRβ polypeptide chain of the class II MHC molecule. DRB1*0301 and DRB1*0401 encode identical sequences in this region."
        text: |
          الـ groove زي قفل، والـ peptide هو المفتاح. Alleles مختلفة (0301، 0401) ممكن تكون قِفل من مصانع مختلفة بس نفس الفتحة (LLEQKR)، فبتفتح لنفس المفاتيح الغلط. ده كل معنى «shared motif».
