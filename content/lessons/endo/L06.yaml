      - kind: explain
        page: 106
        quote: "Causes of anomalous TFTs in patients receiving levothyroxine therapy\n| TFT patterns/LT4 dosage requirements | Cause | Explanation |\n|---|---|---|\n| A. Normal TSH, mildly ↑FT4; (± higher than predicted L-T4 requirements) | Normal physiological variant | To abolish symptoms and normalise TSH concentrations, some individuals exhibit mildly elevated FT4 (possibly reflecting less efficient deiodination of T4 to T3); FT3 is typically normal |\n| B. ↑TSH, low normal or ↓FT4; (Requirement for high L-T4 dosages to normalise TSH) | (i) Maladministration | Patients should be advised to take L-T4 on an empty stomach; certain foodstuffs (e.g. fibre, espresso coffee) and some medications (e.g. iron, calcium, PPIs, sucralfate, aluminium hydroxide, cholestyramine, colestipol) may impair L-T4 absorption |\n|  | (ii) Malabsorption syndromes | L-T4 malabsorption occurs with coeliac disease, achlorhydria, lactose intolerance (lactose is a constituent of some L-T4 preparations) |\n|  | (iii) Increased TH metabolism or excretion | Phenytoin, carbamazepine, phenobarbitone, rifampicin and some tyrosine kinase inhibitors (e.g. Imatinib) increase L-T4 requirements by enhancing hepatic metabolism of TH; occasional cases of increased urinary TH loss complicating nephrotic syndrome have also been reported |\n|  | (iv) Increased TH binding capacity | Oral oestrogen therapy or gonadotrophin-induced rise in oestrogen concentrations (e.g. IVF treatment) results in a marked increase in TBG and hence TH binding capacity, necessitating an increase in L-T4 therapy; similar effects are seen with SERMs and mitotane |\n| C. Unexpected change in L-T4 dosage requirements to maintain clinical and biochemical euthyroidism | Change in LT4 preparation | Not all L-T4 preparations are of comparable potency/bioavailability; changes in preparation are generally best avoided but, if necessary, should prompt more frequent TFT monitoring |\n| D. ↑TSH, normal FT4 | TSH assay interference | Heterophilic antibody interference in the TSH assay may yield falsely elevated results; FT3 is normal |\n| E. Persistent ↑TSH, with ↓, ↑ or normal FT4, despite treatment with high L-T4 dosages | Poor compliance | Owing to their differing half-lives, intermittent thyroxine ingestion may result in normal or even elevated TH concentrations, but fails to normalize TSH |\n| F. Supraphysiologic L-T4 required to normalise TSH, but with resultant ↑FT4 (and ↑FT3) | Resistance to thyroid hormone | Typically seen following inappropriate thyroid ablation or concomitant primary hypothyroidism in a patient harbouring a mutation in the human thyroid hormone receptor β (THRB) gene |\nIn athyreotic individuals total daily levothyroxine requirements can be estimated based on body weight and usually fall in the range 1.6–2.0 mcg/kg (NB: the elderly typically require lower dosages, and caution must be exercised when commencing treatment in those with confirmed/suspected ischaemic heart disease or arrhythmias)."
        title: "المريض على L-T4 والتحاليل غريبة"
        text: |
          أغلب المرضى على **levothyroxine** بيتظبطوا بسهولة، بس فيه مجموعة عندها **anomalous thyroid function tests (TFTs)** بتجنن الدكتور والمريض. جدول الكتاب ستة أنماط:

          1. **Normal TSH، FT4 عالي شوية**: physiological variant: الـ deiodination أقل كفاءة، والـ free triiodothyronine (FT3) طبيعي.
          2. **TSH عالي، FT4 واطي/واطي-طبيعي، محتاج جرعة كبيرة**: maladministration، malabsorption، زيادة الـ metabolism، أو زيادة الـ binding.
          3. **الجرعة اتغيرت فجأة**: غيّر الـ preparation.
          4. **TSH عالي، FT4 طبيعي**: ==assay interference== (heterophilic antibodies)، FT3 طبيعي.
          5. **TSH عالي على طول مع FT4 أي حاجة رغم جرعة كبيرة**: ==poor compliance==.
          6. **محتاج جرعة supraphysiologic وFT4 وFT3 عاليين**: **resistance to thyroid hormone (RTH)**.
