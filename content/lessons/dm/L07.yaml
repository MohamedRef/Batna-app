        remind: [dm.L07.032, dm.L07.033]
        page: 80
        title: "6. MI ساكت"
        quote: "c. Dysfunction of the afferent cardiac autonomic nerve fibers *Features of MI in patients with CAN are:\n  d. Silence,\n  e. Cough,\n  f. Nausea and vomiting,\n  g. Dyspnea, tiredness,\n  h. ECG changes."
        text: |
          ليه الـ ischemia مش بتوجع؟
          - **Altered pain thresholds**
          - **Subthreshold ischemia** مش كفاية تعمل ألم
          - ==Dysfunction of afferent cardiac autonomic fibers== (السلك اللي بيوصل الوجع للمخ مقطوع)

          شكل الـ myocardial infarction (MI) في الـ cardiovascular autonomic neuropathy (CAN): **silence**، **cough**، **nausea و vomiting**، **dyspnea**، tiredness، و **electrocardiogram (ECG) changes**.

          يعني المريض ممكن يجي بـ **cough** أو **nausea** بس. التفسير المقبول (مش في الكتاب): الـ ischemia لسه بتعمل نهجان لأن البطين مش بيضخ كويس فالرئة تحتقن، وبتعمل ترجيع لأن العصب الحاير للمعدة قريب، بس الوجع نفسه سلكه مقطوع.
