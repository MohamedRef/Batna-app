- id: res.L20.lesson3
  title: كل هدف وله تصميم، والـ methods هي القلب
  hook: عايز تقيّم test جديد؟ تعرف الـ prognosis؟ تثبت سبب؟ كل واحد له تصميم، والغلط فيه بيبوّظ البحث كله.
  minutes: 9
  pages:
  - 19
  - 29
  topics:
  - designs
  - litmethods
  goals:
  - تختار التصميم المناسب لكل هدف
  - تفرّق بين cohort وcase-control وcross-sectional وcase series وRCT
  - تعرف أهمية الـ literature review والـ inclusion/exclusion criteria
  status: unverified
  steps:
  - kind: table
    page: 19
    quote: |-
      Select study design to match the research goals
      | Objective | Design |
      |---|---|
      | Description of disease | Case series or report; Cross-Sectional study |
      | Evaluate a new diagnostic test | Cross-Sectional study |
      | Describe prognosis | Cohort study |
      | Determine cause-effect | Cohort study; Case-Control study |
      | Compare new interventions | Randomized Clinical Trial |
      | Summarize literature | Systematic review |
    title: اختار التصميم حسب الهدف
    columns:
    - Objective
    - Design
    rows:
    - - Description of disease
      - Case series or report; cross-sectional
    - - Evaluate a new diagnostic test
      - Cross-sectional study
