  # Split from lesson7 on 2026-11-13 (#828): JAK inhibitors and biosimilars.
  - id: rheum.L16.lesson13
    title: "الـ JAK inhibitors والـ biosimilars"
    hook: "بدل ما تقفل cytokine واحد من برّه، ادخل جوّه الخلية واقفل الكابل اللي كلهم بيمشوا فيه. بس اقرا التحذيرات."
    minutes: 9
    pages: [273, 277]
    topics: [jak, biosimilars]
    goals:
      - "تشرح الـ JAK-STAT وليه الـ JAKi oral ومن غير antibodies"
      - "تعرف الـ JAK inhibitors وأعراضهم وسببها"
      - "تعرّف الـ biosimilar وليه مش generic"
    status: unverified
    steps:
      - kind: explain
        page: 273
        title: "ليه ندخل جوّه الخلية؟"
        quote: "Our knowledge of the intracellular pathways downstream of cytokine receptors has greatly increased, and the inhibition of intracellular enzymes such as receptor-associated kinases is a novel way to simultaneously inhibit multiple cytokines."
        text: |
          كل biologic في الدرس اللي فات بيقفل **cytokine واحد** أو receptor واحد من برّه. الكتاب بيقول إن فهمنا للي بيحصل **جوّه** الخلية بعد الـ receptor زاد، وإن وقف الـ ==receptor-associated kinases== طريقة جديدة توقف **cytokines كتير في نفس الوقت**.

          وميزتين تانيين من الكتاب، وكل واحدة ليها سبب:
          - **Non-protein molecule**: مفيش **neutralizing antibodies**. التفسير المقبول (مش في الكتاب): الجسم بيعمل antibodies ضد الـ proteins الغريبة (زي الحتة الفار في الـ infliximab)، مش ضد جزيء كيميا صغير.
          - **Oral**: مفيش حقن، ومفيش **allergic reactions** زي الـ infusion reactions.

          إزاي الـ cytokine بيوصّل رسالته: بيمسك الـ receptor ← الـ **JAK** يتفعّل بالـ phosphorylation ويعمل phosphorylation للـ receptor.
      - kind: figure
        page: 274
        quote: "JAK inhibitors are small molecules that bind to JAKs preventing ATP binding and subsequent intracellular signalling"
        title: "الـ JAK-STAT والقفل"
        alt: "A cytokine binds its receptor on the cell membrane. Two JAKs sit on the inside of the receptor and phosphorylate it. STAT proteins are phosphorylated, pair up as a dimer and enter the nucleus to switch on genes. A JAK inhibitor sits in the ATP pocket of the JAK, so the chain stops."
        caption: "الـ cytokine برّه ← الـ **JAK** جوّه يشتغل بالـ ATP ← **STAT** يتعمل dimer ويدخل النواة. الـ ==JAK inhibitor== بياخد مكان الـ **ATP**، فالسلسلة كلها تقف."
        svg: |
          <svg viewBox="0 0 330 270" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="R16j" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
