      - kind: explain
        page: 44
        quote: "Antigenic, with a risk of anaphylaxis, so: premedication with antihistamine and corticosteroids is recommended."
        title: "الـ pegloticase"
        text: |
          - للـ ==refractory gout== (USA 2010، Europe 2013)، **8 mg IV كل أسبوعين**.
          - بينزّل الـ urate جامد ويدوّب الـ tophi بسرعة.
          - بس: **antigenic** وفيه **anaphylaxis** ← premedication بـ antihistamine و steroid. وفيه قلق **cardiovascular** (حذر في الـ heart failure).
          - استخدامه محدود: قليلين بس refractory فعلًا، وغالي.
