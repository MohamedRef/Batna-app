  # ------------------------------------------------------------------
  - id: res.L05.lesson6
    title: "الـ RR والـ AR والـ ARP"
    hook: "الـ RR بيقولك الخطر قد إيه أقوى، والـ AR بيقولك قد إيه زيادة، والـ ARP بيقولك قد إيه منه تقدر تمنعه."
    minutes: 10
    pages: [49, 61]
    topics: [risk]
    goals:
      - "تحسب الـ incidence في الـ exposed والـ non-exposed"
      - "تحسب وتفسّر الـ RR والـ AR والـ ARP"
    status: unverified
    steps:
      - kind: explain
        page: 49
        quote: "1. Incidence Rate = The no. of persons developing a disease (new cases) in a specific time & locality / Total population at risk * 1000"
        title: "1. Incidence rate"
        text: |
          **Incidence rate = new cases in a specific time and locality ÷ ==total population at risk== × 1000**

          في الـ cohort بتحسبه مرتين: في الـ exposed (**Ie**) وفي الـ non-exposed (**Io**). وكل المقاييس اللي جاية مبنية على الرقمين دول.
      - kind: explain
        page: 50
        quote: "Incidence rate:\n  Incidence among exposed = Ie = a / a+b\n  Incidence among non-exposed = Io = c / c+d"
        title: "Ie و Io"
        text: |
          في جدول الـ cohort: الصفوف = exposed / not exposed، والأعمدة = disease yes / no.

          - ==Ie== (incidence في الـ exposed) = **a/(a+b)**
          - ==Io== (incidence في الـ non-exposed) = **c/(c+d)**

          ولاحظ: هنا بنمشي **بالعرض** على الصفوف، لأن المجموعات اتعملت على أساس الـ exposure.
      - kind: explain
        page: 51
        quote: "Relative risk: RR = Incidence among exposed / Incidence among non-exposed = Ie / Io\nAttributable risk percent: ARP = (Ie) - (Io) / (Ie) X 100"
        title: "3 أرقام بيطلعوا من Ie و Io"
        text: |
          - ==RR== (relative risk / risk ratio) = Ie ÷ Io: احتمال المرض في الـ exposed **نسبةً** للـ unexposed.
          - ==AR== (attributable risk) = Ie − Io: الـ **excess risk** اللي جاي من الـ exposure.
          - ==ARP== (attributable risk percent) = (Ie − Io)/Ie × 100: كام في المية من مرض الـ exposed **هيختفي لو شلنا الـ exposure**.

          مثال الشرح: 20 من 200 exposed (10%) و2 من 200 unexposed (1%): RR = 10، والـ AR = 9 percentage points، والـ ARP = 90%. ما تخلطش الفرق بالنسبة. والدكتورة نبّهت إن تفسير الـ ARP على إنه «اللي هيختفي» بيفترض إن العلاقة causal ومفيش bias أو confounding مؤثر، وإنه بيخص **الـ exposed** مش كل حالات المجتمع.
      - kind: mnemonic
        page: 51
        quote: "Relative risk: RR = Incidence among exposed / Incidence among non-exposed = Ie / Io\nAttributable risk percent: ARP = (Ie) - (Io) / (Ie) X 100"
        word: "RAD"
        parts:
          - { key: "R", text: "Ratio: RR = Ie ÷ Io" }
          - { key: "A", text: "Attributable: AR = Ie − Io (excess risk)" }
          - { key: "D", text: "Divide the excess by Ie × 100 = ARP" }
        hook: "**RAD**: قسمة، طرح، وبعدين الطرح ÷ Ie. ترتيب الأسئلة في الامتحان نفسه."
      - kind: figure
        page: 51
        quote: "Relative risk RR = Incidence among exposed"
        title: "الـ RR والـ AR والـ ARP على عمودين"
        alt: "Two bars. Smokers Ie 0.10, a tall bar; non-smokers Io 0.01, a short bar. The smokers' bar has the Io part at its base and the rest, bracketed, is AR equals Ie minus Io equals 0.09 extra risk. Below: RR equals 0.10 over 0.01 equals 10; ARP equals 0.09 over 0.10 equals 90 percent."
        caption: |
          مثال التدخين وسرطان الرئة (slide 54) على عمودين، وكل مقياس من الـ **RAD** بيقرا حاجة مختلفة:

          - **RR**: طول العمود الكبير ÷ طول الصغير = 10. يعني «==كام مرة==».
          - **AR**: الحتة الملوّنة اللي فوق مستوى الـ Io في عمود المدخنين = 0.09. يعني «==قد إيه زيادة==».
          - **ARP**: الحتة دي ÷ العمود كله = 90%. يعني «==كام في المية من مرض المدخنين== سببها التدخين».

          الحتة الرمادي تحت في عمود المدخنين هي الـ Io: الخطر اللي كانوا هياخدوه حتى من غير سجاير، علشان كده بتتطرح.
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="18" class="t-sm t-b">Lung cancer incidence, cohort of smokers</text>
            <line x1="40" y1="200" x2="320" y2="200" class="fg-ink"/>
            <rect x="70" y="40" width="70" height="160" rx="4" class="fg-acc"/>
            <rect x="70" y="184" width="70" height="16" class="fg-box"/>
            <rect x="200" y="184" width="70" height="16" rx="3" class="fg-box"/>
            <text x="105" y="34" text-anchor="middle" class="t-sm t-b">Ie = 0.10</text>
            <text x="235" y="178" text-anchor="middle" class="t-sm t-b">Io = 0.01</text>
            <text x="105" y="218" text-anchor="middle" class="t-sm">Smokers</text>
            <text x="235" y="218" text-anchor="middle" class="t-sm">Non-smokers</text>
            <path d="M150 40V184" class="fg-ink"/>
            <path d="M146 40H154M146 184H154" class="fg-ink"/>
            <text x="160" y="104" class="t-sm t-b t-acc">AR = Ie − Io</text>
            <text x="160" y="120" class="t-sm t-acc">= 0.09 extra risk</text>
            <text x="105" y="196" text-anchor="middle" class="t-sm t-mut">Io</text>
            <text x="10" y="240" class="t-sm"><tspan class="t-b">RR</tspan> = 0.10/0.01 = 10</text>
            <text x="320" y="240" text-anchor="end" class="t-sm"><tspan class="t-b">ARP</tspan> = 0.09/0.10 = 90%</text>
          </svg>
      - kind: explain
        page: 52
        quote: "Measures of Association in Cohort Study: Risk Ratio (Relative risk), Ratio of the incidence among exposed to the incidence among unexposed. Indicates the likelihood of developing the disease in the exposed group relative to those who are not exposed"
        title: "Risk ratio (relative risk)"
        text: |
          **RR = incidence among exposed ÷ incidence among unexposed**

          بيقول ==likelihood== إن الـ exposed يجيلهم المرض مقارنة باللي مش exposed.

          ليه قسمة؟ لأن القسمة بتقول «كام مرة»، فبتقيس **قوة** العلاقة، مش حجم المشكلة. التفسير المقبول (مش في الكتاب).
      - kind: table
        page: 53
        quote: "Interpreting the value of RR\n| Relative risk | Meaning |\n|---|---|\n| > 1 | Risk factor |\n| = 1 | No association |\n| < 1 | Protective factor |"
        title: "Interpreting RR"
        columns: ["RR", "Meaning"]
        rows:
          - ["> 1", "Risk factor"]
          - ["= 1", "No association"]
          - ["< 1", "Protective factor"]
        hide: [[0, 1], [2, 1]]
      - kind: case
        page: 54
        quote: "| Smoking | Lung cancer YES + | Lung cancer NO - | Total |\n|---|---|---|---|\n| YES + (Exposed) | 20 (a) | 180 (b) | 200 (a+b) |\n| NO - (Not exposed) | 2 (c) | 198 (d) | 200 (c+d) |\nFind out RR and AR for above data"
        stem: "Smoking and lung cancer cohort. Smokers: 20 of 200 got lung cancer. Non-smokers: 2 of 200."
        steps:
          - question: "What are Ie and Io?"
            options: ["0.10 and 0.01", "20 and 2", "0.11 and 0.01", "0.10 and 0.10"]
            answer: 0
            why: "Ie = 20/200 = **0.10**. Io = 2/200 = **0.01**."
          - question: "What is the relative risk?"
            options: ["0.1", "9", "10", "18"]
            answer: 2
            why: "RR = 0.10/0.01 = **10**: المدخن خطره 10 أضعاف."
          - question: "What is the attributable risk?"
            options: ["0.09 (90 per 1000)", "0.9 (900 per 1000)", "10 (a ratio)", "0.11 (110 per 1000)"]
            answer: 0
            why: "AR = 0.10 − 0.01 = **0.09**، يعني 90 حالة زيادة لكل 1000 مدخن."
          - question: "And the attributable risk percent?"
            options: ["9%", "50%", "90%", "100%"]
            answer: 2
            why: "ARP = 0.09/0.10 × 100 = **90%** من حالات المدخنين سببها التدخين."
      - kind: check
        page: 55
        quote: "In a cohort study, if the relative\nrisk is greater than 1.0. This\ndenotes that:\nA. The incidence rate of the disease is lower\namong the group with the suspected risk factor\nB. The incidence rate of the disease is higher\namong the group with the suspected risk factor\nC. The disease has no relationship with the risk\nfactor.\nD. None of the above"
        question: "In a cohort study, a relative risk greater than 1.0 denotes that:"
        options:
          - "The incidence is higher among the group with the suspected risk factor"
          - "The incidence is lower among the group with the suspected risk factor"
          - "The disease has no relationship with the risk factor"
          - "None of the above"
        answer: 0
        why:
          - "صح: RR = Ie ÷ Io، ولو أكبر من 1 يبقى Ie أكبر."
          - "ده RR أقل من 1 (protective)."
          - "ده RR = 1."
          - "فيه إجابة صح."
      - kind: explain
        page: 56
        quote: "Example: Risk of hip fracture among those with low BMD in 5 years of follow-up\n| Low BMD | Hip Fracture: Yes | Hip Fracture: No | Total |\n|---|---|---|---|\n| Yes | 230 | 400 | 630 |\n| No | 110 | 369 | 479 |\n| Total | 340 | 769 | 1,109 |\nRisk Ratio (Relative Risk) = CIe / CIu = (230/630) / (110/479) = 1.59\nThe risk of developing hip fractures was 1.59 times higher in those with low bone mineral density compared to those with normal bone mineral density during this 5-year follow-up study."
        title: "إزاي تكتب التفسير زي المحاضرة"
        text: |
          - **RR**: «The risk of developing hip fractures was ==1.59 times higher== in those with low bone mineral density (BMD)... during this 5-year follow-up.» (230/630 ÷ 110/479)
          - **AR**: «The risk of stroke is ==increased by 0.20== for smokers compared to non-smokers.» (0.30 − 0.10)
          - **ARP**: Apgar 0–3 vs 4–6: (34.4 − 12.5)/34.4 = ==63.7%==، يعني تقريبًا تلتين الوفيات في المجموعة دي بسبب الـ Apgar الواطي. الـ asphyxia **major contributor** بس مش السبب الوحيد.
      - kind: explain
        page: 57
        quote: "Attributable Risk (AR):\n  AR is the difference in the incidence of a disease between an exposed population and an unexposed population.\n  AR is calculated as follows: AR = I exp – I unexp\n  AR is used to quantify \"excess risk\" in the exposed group that is attributable to the exposure."
        title: "Attributable risk (AR)"
        text: |
          **AR = I exp − I unexp**: ==الفرق== في الـ incidence بين الـ exposed والـ unexposed.

          بيقيس الـ **excess risk** في الـ exposed اللي يتنسب للـ exposure.

          الفرق بينه وبين الـ RR: الـ RR قسمة (كام مرة)، والـ AR طرح (قد إيه زيادة بالأرقام). ودا اللي يهم اللي بيخطط خدمات. التفسير المقبول (مش في الكتاب).
      - kind: check
        page: 58
        quote: "Example: In a cohort study that investigated the association between smoking and stroke\n  AR = I exp (smokers) – I unexp (non-smokers) = 0.30 – 0.10 = 0.20\nInterpretation: The risk of stroke is increased by 0.20 for smokers compared to non-smokers."
        question: "Smoking and stroke cohort: incidence 0.30 in smokers and 0.10 in non-smokers. What is the AR and its meaning?"
        options:
          - "0.20: the risk of stroke is increased by 0.20 for smokers compared with non-smokers"
          - "3: smokers have three times the risk"
          - "0.40: the total risk in both groups"
          - "66.7%: the share of smokers' strokes due to smoking"
        answer: 0
        why:
          - "صح: 0.30 − 0.10 = 0.20، وده تفسير slide 58 بالحرف."
          - "3 = 0.30 ÷ 0.10 ده الـ RR، مش الـ AR."
          - "الجمع مالوش معنى هنا."
          - "ده الـ ARP: 0.20 ÷ 0.30، المقياس اللي جاي."
      - kind: explain
        page: 59
        quote: "Attributable Risk Percent (ARP):\n  AR% is the percent of the incidence of a disease in the exposed that is due to the exposure.\n  It is the % of the incidence of a disease in the exposed that would be eliminated if exposure were eliminated.\n  The risk difference is expressed as a percentage of the total risk experienced by the exposed group: AR% = (Ie – Iu) / Ie × 100, or AR% = AR / Ie × 100"
        title: "Attributable risk percent (ARP)"
        text: |
          **ARP = (Ie − Io) ÷ Ie × 100**

          = ==نسبة الـ incidence في الـ exposed اللي سببها الـ exposure==، يعني اللي هيختفي لو الـ exposure اختفى.

          ليه المقام Ie بالذات؟ لأن السؤال عن المرض **عند الـ exposed**: من كل اللي جالهم، قد إيه بسبب الـ exposure. التفسير المقبول (مش في الكتاب).
      - kind: reveal
