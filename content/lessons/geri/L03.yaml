  # ------------------------------------------------------------------
  - id: geri.L03.lesson1
    title: "الدوا جوه جسم عجوز: فين بيروح؟"
    hook: "نفس الجرعة اللي بتريّح شاب ممكن توقّع الحاج من على السلم. السر مش في الدوا، في الجسم اللي استقبله."
    minutes: 8
    pages: [40, 43]
    topics: [challenges, pk]
    goals:
      - "تعرف التحديات الخمسة في علاج الكبار وسبب كل واحد"
      - "تفهم إزاي الـ distribution بيتغير: دهون أكتر، ميه أقل، albumin أقل"
      - "تفهم ليه الـ half-life بيطول"
    status: unverified
    steps:
      - kind: explain
        page: 40
        title: "ليه علاج الكبار صعب؟"
        quote: "The Geriatric therapeutic challenges\n  Impaired physiological reserve in older patients- \"homeostenosis\".\n  Multiple disease and multiple drug use.\n  Non-specific or cryptic presentation.\n  Rapid deterioration if untreated (age-associated loss of adaptability).\n  High incidence of complications (of disease and treatment)."
        text: |
          خمس تحديات:
          - ==homeostenosis==: الـ physiological reserve قليل، أي حمل يوقّعه.
          - **أمراض كتير وأدوية كتير** مع بعض.
          - العرض **non-specific أو cryptic**.
          - لو ما اتعالجش، بيتدهور بسرعة: loss of adaptability.
          - **المضاعفات** كتير، من المرض ومن العلاج كمان.

          الخمسة دول مربوطين ببعض: الـ reserve قليل (homeostenosis)، علشان كده المرض البسيط يوقّعه بسرعة (rapid deterioration). والأمراض كتير، فالأدوية كتير، فالمضاعفات كتير. والعرض مش واضح لأن الجسم مش بيرد بالطريقة المعروفة: لا حرارة عالية، ولا ألم واضح، بس لخبطة أو وقعة.
      - kind: mnemonic
        page: 40
        quote: "The Geriatric therapeutic challenges\n  Impaired physiological reserve in older patients- \"homeostenosis\".\n  Multiple disease and multiple drug use.\n  Non-specific or cryptic presentation.\n  Rapid deterioration if untreated (age-associated loss of adaptability).\n  High incidence of complications (of disease and treatment)."
        word: "HMNRC"
        parts:
          - { key: "H", text: "Homeostenosis" }
          - { key: "M", text: "Multiple disease, multiple drugs" }
          - { key: "N", text: "Non-specific presentation" }
          - { key: "R", text: "Rapid deterioration" }
          - { key: "C", text: "Complications high" }
        hook: "**«حَمْنَرْك»**: الحاج بيقولك «حمّنّرك يا دكتور»، يعني «هتعبك معايا». وفعلًا هيتعبك في الخمسة دول."
      - kind: figure
        page: 40
        title: "كل ما الأدوية تزيد، الـ side effects تطير"
        image: { file: geri/L03-drugs-side-effects.webp, book: true }
        quote: "Relationship between number of drugs and side effects"
        caption: "رسمة الكتاب: من **0–5** أدوية حوالي 5% عندهم side effects، ومن **16–20** دوا أكتر من ==50%==. الزيادة مش خطية، دي بتقفز."
        alt: "The book's bar chart: percent of patients with side effects by number of drugs, about 5% for 0–5, 10% for 6–10, about 28% for 11–15 and about 55% for 16–20."
      - kind: figure
        page: 41
        title: "وكل ما الدكاترة يزيدوا كمان"
        image: { file: geri/L03-prescribers.webp, book: true }
        quote: "Number of prescribing physicians and risk of side effects"
        caption: "Number of prescribing physicians: الـ **psychotropic** بالذات بيطلع من حوالي 17% مع دكتور واحد لحوالي ==34%== مع خمسة. كل دكتور بيكتب لوحده ومحدش شايف الروشتة كلها."
        alt: "The book's bar chart: prevalence of drug combinations by number of prescribing physicians 1 to 5 for NSAIDs, cardiovascular and psychotropic drugs; psychotropic rises from about 17% to about 34%."
      - kind: explain
        page: 41
        title: "الامتصاص: مش مشكلة غالبًا"
        quote: "Absorption\n  From a practical standpoint this is not usually a problem in the elderly\n  Caveat: Tube feedings may reduce absorption if continuous"
        text: |
          الـ **absorption** عمليًا مش مشكلة عند الكبار.

          الاستثناء: ==tube feeding== لو continuous، ممكن يقلل الامتصاص.

          ليه مش مشكلة رغم إن المعدة والأمعاء بتتغير؟ التفسير المقبول (مش في الكتاب): أغلب الأدوية بتتمص بـ **passive diffusion**، ودي مش محتاجة طاقة ولا enzymes، فبتفضل شغالة. يمكن تبقى **أبطأ** شوية، بس الكمية اللي بتدخل في الآخر قريبة من الطبيعي. والـ tube feeding المستمر بيحط أكل جنب الدوا طول الوقت، فبعض الأدوية بتتلزق في الأكل وما تتمصش.
      - kind: explain
        page: 42
        title: "الـ distribution: دهون أكتر، ميه أقل"
        quote: "Decreased body water -- the most important change, lower Vd. in polar drugs"
        text: |
          - **Albumin قليل** ← نسبة الدوا الـ free تزيد.
          - **دهون أكتر** ← الـ half-life بتاع الـ lipophilic drugs يطول، زي **diazepam** والـ anesthetics.
          - **ميه أقل**، وده ==the most important change== ← الـ Vd بتاع الـ polar drugs يقل ← التركيز يعلى.
          - **عضلات أقل**.

          ليه الميه هي ==the most important change==؟ لأن أغلب الأدوية اللي بنخاف منها عند الكبار **polar** (زي الـ digoxin والـ lithium والـ aminoglycosides)، وكلهم بيتوزعوا في ميّة الجسم. الميه تقل، نفس الجرعة تتركّز في حجم أصغر، والتركيز يعلى من أول جرعة.

          وليه الـ **albumin** مهم؟ الدوا المربوط في الـ albumin نايم، والـ **free** هو اللي شغال. الـ albumin يقل، الجزء الـ free يزيد، فالتأثير والـ toxicity يزيدوا حتى لو المستوى الكلي في التحليل طبيعي.
      - kind: aside
        tone: analogy
        page: 42
        quote: "Increased fat -- increases the half life of lipophylic drugs (e.g. diazepam, anesthetics)"
        text: "تخيّل الدهون زي **إسفنجة**: الـ diazepam بيتشرّب فيها ويفضل يرشح منها بالراحة أيام. والميه زي **كوباية صغيرة**: نفس كمية السكر فيها تبقى أحلى، يعني الدوا الـ polar تركيزه أعلى."
      - kind: sort
        page: 42
        quote: "Increased fat -- increases the half life of lipophylic drugs (e.g. diazepam, anesthetics)"
        prompt: "الـ Vd بتاع الدوا ده بيعمل إيه مع السن؟"
        bins: ["Vd up", "Vd down"]
        cards:
          - { text: "Diazepam", bin: 0 }
          - { text: "Lipophilic drug", bin: 0 }
          - { text: "Hydrophilic drug", bin: 1 }
          - { text: "Polar drug", bin: 1 }
        why: "الدهون بتزيد فالـ lipophilic Vd up، والميه بتقل فالـ hydrophilic أو polar Vd down."
      - kind: explain
        page: 43
        title: "الـ half-life = Vd ÷ clearance"
        quote: "Half-life(t1/2) ≈ vol. of distribution(Vd) over clearance(CI)"
        text: |
          ==t½ ≈ Vd ÷ clearance==

          يعني عند الكبار الـ half-life بيطول من ناحيتين:
          - الـ **Vd** بتاع الـ lipophilic بيزيد.
          - الـ **clearance** بيقل من الكلية والكبد.

          يعني إيه عمليًا؟ التفسير المقبول (مش في الكتاب): الدوا بيحتاج حوالي **4–5 half-lives** علشان يوصل لمستوى ثابت أو علشان يخرج من الجسم. لو الـ half-life بتاع الـ diazepam اتضاعف، يبقى الحاج مش هيبان عليه التراكم غير بعد أيام، ولما توقفه هيفضل نعسان أيام. علشان كده الكتاب بعدين هيقولك: ابعد عن الأدوية اللي الـ half-life بتاعها طويل.
      - kind: check
        page: 41
        quote: "Low serum albumin -- results in changing the free vs. bound proportion of drugs"
        question: "An 82-year-old with serum albumin 2.6 g/dl takes a highly protein-bound drug. Total drug level is in range. What happens to its effect?"
        options:
          - "More free drug, so more effect and toxicity"
          - "Less free drug, so less effect"
          - "No change: the total level is normal"
          - "Absorption falls"
        answer: 0
        why:
          - "صح: albumin قليل ← الـ free vs bound proportion بيتغير ← free أكتر."
          - "العكس: الـ free بيزيد."
          - "التحليل بيقيس الكلي، والـ free هو اللي شغال."
          - "الـ absorption مش مشكلة عند الكبار."
      - kind: try
        items: [geri.L03.002, geri.L03.007, geri.L03.010, geri.L03.011, geri.L03.014]
    recap:
      - "HMNRC: homeostenosis، أمراض وأدوية كتير، عرض مش واضح، تدهور سريع، مضاعفات."
      - "الـ side effects بتقفز مع عدد الأدوية وعدد الدكاترة."
      - "Absorption مش مشكلة، إلا الـ continuous tube feeding."
      - "دهون أكتر ← lipophilic t½ أطول. ميه أقل ← polar Vd أقل، وده الأهم. Albumin أقل ← free drug أكتر."
      - "t½ ≈ Vd ÷ clearance."
    practice: [geri.L03.001, geri.L03.002, geri.L03.003, geri.L03.004, geri.L03.005, geri.L03.006, geri.L03.007, geri.L03.008, geri.L03.009, geri.L03.010, geri.L03.011, geri.L03.012, geri.L03.014, geri.L03.015]
