  - id: hem.L06.lesson2
    title: "الكيس المناسب للعيان المناسب"
    hook: "مش كل نزيف عايز whole blood، ومش كل خلية عايزة نفس المعاملة: كل component ليه دلع."
    minutes: 10
    pages: [88, 93]
    topics: [components, derivatives]
    goals:
      - "تعرف كل component وإمتى تديه"
      - "تفرّق leukoreduced و washed و irradiated"
      - "تعرف الـ derivatives: albumin و IVIG و Rh immune globulin والـ factors"
    status: unverified
    steps:
      - kind: explain
        page: 88
        title: "Whole blood و packed RBCs"
        quote: "It is not a source of functional PLT or granulocytes, which deteriorate in < 24 hours at refrigerator temp."
        text: |
          - **Whole blood**: لـ ==acute hypovolemia with RBC loss==. مش مصدر platelets ولا granulocytes شغّالة، لأنهم بيبوظوا في **أقل من 24 ساعة** في التلاجة.
          - **Packed RBCs**: لـ **symptomatic anemia**. الوحدة بتعلّي الـ Hb حوالي **1 g/dl** في البالغ متوسط الحجم.
      - kind: table
        page: 89
        quote: "Filtration with specialized filters that bind 99.9% of WBC from donor unit"
        title: "التعديلات على الكيس"
        columns: [Modification, Prevents or treats]
        rows:
          - ["Leukoreduced (filter binds 99.9% WBCs)", "FNHTR, CMV, HTLV, EBV, TRALI"]
          - ["Washed PRBC (no plasma, K, additive)", "IgA deficiency, hyperkalemia, allergy"]
          - ["Irradiated (donor lymphocytes stopped)", "TA-GVHD"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 90
        title: "Irradiation: مين محتاجه؟"
        quote: "To prevent lymphocyte proliferation in recipient and transfusion-associated graft-versus-host disease (TA-GVHD)"
        text: |
          الهدف: نمنع ==TA-GVHD== (lymphocytes المتبرع تتكاثر في العيان وتهاجمه).
          - **Stem cell transplant**: من **30 يوم قبل** ولحد **ما لا نهاية** بعد
          - دم من **first-degree relatives**
          - **Intrauterine transfusions** والأطفال لحد **4 months**
          - **Congenital immunodeficiency**
          - اللي بياخدوا **fludarabine / nelarabine / clofarabine**
          - بعض المستشفيات لكل مرضى السرطان، بس مش absolute
      - kind: reveal
        page: 90
        quote: "Recipients of blood products from 1st degree relatives"
        prompt: "دم الأخ أأمن من دم الغريب، صح؟ ليه الكتاب بيقول الـ recipients of blood products from 1st degree relatives لازم ياخدوا irradiated blood؟"
        answer: |
          بالعكس، هنا القريب أخطر. الـ lymphocytes بتاعة الأخ شبه العيان في الـ **HLA**، فجهاز مناعة العيان **مش بيشوفها غريبة** وما يقتلهاش.

          تفضل عايشة وتتكاثر وتهاجم أنسجة العيان: ده ==TA-GVHD==. الـ irradiation بيمنعها تتكاثر.
      - kind: explain
        page: 90
        title: "Platelets و الـ refractoriness"
        quote: "Immune-mediated: repeated transfusions especially with non-leukocyte reduced PLT and multiparity (alloimmunization to HLA and human PLT antigens)."
        text: |
          الـ platelets: **random donor** من الـ whole blood، أو **apheresis** (single donor). الاستخدام: **bleeding with thrombocytopenia** و **qualitative defects**.

          لو الـ count ما بيعلاش (==refractoriness==):
          - **Non-immune**: fever، infection، splenomegaly، DIC، massive bleeding، أدوية
          - **Immune**: transfusions كتير (خصوصًا non-leukoreduced) و **multiparity** ← antibodies ضد **HLA** و **HPA**
          - العلاج: **HLA-compatible** أو **cross-match compatible** platelets
      - kind: explain
        page: 91
        title: "Granulocytes و FFP و cryo"
        quote: "A unit of cryoprecipitate is a fraction of plasma and contains factor VIII, fibrinogen, factor XIII and vWF activity."
        text: |
          - **Granulocytes**: apheresis من متبرع واخد **G-CSF**. لـ **ANC <0.5** مع **documented infection**، أو **CGD**.
          - **FFP**: نقص factors كتير (نزيف أو قبل procedure)، **DIC**، **liver disease**، **massive transfusion**، **plasma exchange (TTP)**، **warfarin reversal**. ==مش للـ volume== ولا للـ protein في سوء التغذية.
          - **Cryoprecipitate**: فيه **VIII** و **fibrinogen** و **XIII** و **vWF**. لـ fibrinogen deficiency، dysfibrinogenemia، XIII deficiency، DIC، و hemophilia A أو vWD لو مفيش concentrate.
      - kind: mnemonic
        page: 91
        quote: "A unit of cryoprecipitate is a fraction of plasma and contains factor VIII, fibrinogen, factor XIII and vWF activity."
        word: "8-1-13-W"
        parts:
          - { key: "8", text: "Factor VIII" }
          - { key: "1", text: "Factor I (fibrinogen)" }
          - { key: "13", text: "Factor XIII" }
          - { key: "W", text: "von Willebrand factor" }
        hook: "الـ **cryo** = 8 و 1 و 13 و W. كل اللي بيطفو لما الـ plasma تدوب على البارد."
      - kind: match
        page: 91
        quote: "Correction of multiple clotting factor deficiencies in bleeding patients or prior to invasive procedures. DIC, liver disease, massive transfusions."
        prompt: "وصّل كل عيان بالـ component بتاعه:"
        pairs:
          - ["Acute hypovolemia from trauma", "Whole blood"]
          - ["Symptomatic anemia", "Packed RBCs"]
          - ["Fibrinogen 0.8 g/L in DIC", "Cryoprecipitate"]
          - ["TTP needing plasma exchange", "Fresh frozen plasma"]
          - ["ANC 0.2 with Pseudomonas sepsis", "Granulocytes"]
        why: "الـ whole blood للنزيف الحاد، الـ PRBCs للأنيميا، الـ cryo للـ fibrinogen، الـ FFP للـ plasma exchange، والـ granulocytes للـ neutropenia مع infection مثبتة."
      - kind: explain
        page: 92
        title: "Derivatives"
        quote: "Blood products produced commercially by fractionation of plasma and include colloids such as albumin, immune globulins, coagulation factor concentrates."
        text: |
          ==Derivatives== بتتعمل في مصانع من **fractionation of plasma**، ومعالجة بالحرارة أو كيميائيًا ضد الفيروسات.
          - **Rh immune globulin**: للأم **Rh-negative** اللي جنينها **Rh-positive**، علشان ما تعملش **anti-D** و **HDN**.
          - **Albumin**: hypovolemia، acute liver failure، cardiopulmonary bypass، burns، وقبل exchange transfusion في HDN (بيمسك الـ bilirubin ويقلّل الـ kernicterus).
          - **IVIG**: passive immunity، primary immunodeficiency، **refractory ITP**، HIV thrombocytopenia، CMV pneumonitis، Guillain-Barré.
      - kind: table
        page: 93
        quote: "High F VIII or IX inhibitor levels in hemophilia A or B. - Severe bleeding refractory to other therapy."
        title: "الـ factor products"
        columns: [Product, Use]
        rows:
          - ["rFVIIa", "FVII deficiency, refractory hemophilia, high inhibitors, refractory bleeding"]
          - ["FVIII concentrate", "FVIII deficiency, vWD"]
          - ["Recombinant FVIII", "Hemophilia A"]
          - ["Factor IX complex", "Hemophilia B, FX and FVII deficiency"]
          - ["Recombinant FIX", "Hemophilia B"]
          - ["Recombinant FXIII", "FXIII deficiency"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: check
        page: 93
        quote: "High F VIII or IX inhibitor levels in hemophilia A or B. - Severe bleeding refractory to other therapy."
        question: "A man with hemophilia A and high-titre FVIII inhibitors bleeds into his knee. Which product?"
        options: ["Recombinant factor VIIa", "More factor VIII", "Albumin", "Rh immune globulin"]
        answer: 0
        why:
          - "صح: الـ **rFVIIa** بيعدّي الـ VIII خالص، فبيشتغل مع الـ inhibitors."
          - "الـ inhibitors هتعطّل أي VIII زيادة."
          - "الـ albumin مالوش دعوة بالتجلط."
          - "الـ Rh immune globulin للحوامل Rh-negative."
      - kind: try
        items: [hem.L06.026, hem.L06.028, hem.L06.032, hem.L06.039, hem.L06.042]
    recap:
      - "Whole blood: hypovolemia. PRBC: symptomatic anemia، +1 g/dl للوحدة."
      - "LR: FNHTR و CMV و TRALI. Washed: IgA deficiency، K، allergy. Irradiated: TA-GVHD (SCT، أقارب، fludarabine)."
      - "Platelet refractoriness: non-immune (fever، spleen، DIC) أو immune (HLA/HPA) ← HLA-compatible."
      - "FFP مش للـ volume. Cryo = **8-1-13-W**."
      - "rFVIIa للـ inhibitors. Rh Ig تمنع anti-D. Albumin و IVIG ليهم قوايم."
    practice: [hem.L06.023, hem.L06.024, hem.L06.025, hem.L06.026, hem.L06.027, hem.L06.028, hem.L06.029, hem.L06.030, hem.L06.031, hem.L06.032, hem.L06.033, hem.L06.034, hem.L06.035, hem.L06.036, hem.L06.037, hem.L06.038, hem.L06.039, hem.L06.040, hem.L06.041, hem.L06.042, hem.L06.043, hem.L06.044, hem.L06.045, hem.L06.046, hem.L06.047, hem.L06.048, hem.L06.049, hem.L06.050, hem.L06.051, hem.L06.052, hem.L06.053, hem.L06.054, hem.L06.055, hem.L06.117, hem.L06.121]
