          <path d="M232 176v-92" class="fg-arrow" marker-end="url(#L10b)"/>
          <text x="244" y="124" class="t-b">CPP</text>
          <text x="244" y="140" class="t-sm">60-100</text>
          <text x="244" y="154" class="t-sm t-bad">&gt;120 = edema ↑</text>
          <path d="M12 256h306" class="fg-thin"/>
