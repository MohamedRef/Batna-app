  # ------------------------------------------------------------------
  - id: git.L10.lesson5
    title: "الـ GERD: الحمض اللي طالع غلط"
    hook: "تلات أسباب بس، وكل أعراض الـ GERD وكل الـ tests بتتفهم منهم."
    minutes: 9
    pages: [283, 288]
    topics: [gerd, gerd-dx]
    goals:
      - "تعرّف الـ gastroesophageal reflux disease (GERD) وتشرح التلات mechanisms"
      - "تفرّق بين الـ typical والـ extraesophageal"
      - "تعرف إمتى تعالج empirically وإمتى تعمل esophagogastroduodenoscopy (EGD) أو pH"
    status: unverified
    steps:
      - kind: explain
        page: 283
        quote: "GERD is chronic gastrointestinal disorder which develops when the reflux of the stomach contents causes troublesome symptoms and/or complications."
        title: "التعريف"
        text: |
          الـ ==GERD== = chronic disorder بيحصل لما reflux محتويات المعدة يعمل **troublesome symptoms and/or complications**.

          من أشهر تشخيصات الجهاز الهضمي: prevalence عالميًا **8-33%**، وحوالي **20%** في أمريكا والغرب.

          الـ GERD اتشرح كمان في **محاضرة 1 (Acid-related disorders)**، وهنا المحاضرة بتشوفه من ناحية الـ motility.

          ليه التعريف بيقول **troublesome** مش «أي reflux»؟ لأن شوية reflux بعد الأكل طبيعي عند كل الناس (physiological). المرض يبدأ لما الـ reflux يعمل أعراض بتضايق أو مضاعفات زي esophagitis أو Barrett.
      - kind: figure
        page: 284
        quote: "Dysfunction of the Gastroesophageal Junction Abnormal Esophageal Clearance Delayed Gastric Emptying A. Dysfunction of the Gastroesophageal Junction:"
        title: "التلات أسباب"
        alt: "Three stacked boxes. One: dysfunction of the gastroesophageal junction, with LES pressure, crural diaphragm and intra-abdominal LES, weakened by obesity, smoking and hiatal hernia. Two: abnormal esophageal clearance, with peristalsis and salivary bicarbonate, reduced by hypotensive LES, failed peristalsis and dry mouth. Three: delayed gastric emptying, with gastroparesis and fatty meals causing more TLESRs."
        caption: "الحاجز بيضعف، أو المريء مش بيعرف ينضّف، أو المعدة بتفضى ببطء فتزيد الـ transient lower esophageal sphincter relaxations (TLESRs)."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="96" rx="8" class="fg-acc"/>
            <text x="20" y="32" class="t-b">A. EGJ barrier fails</text>
            <text x="20" y="54" class="t-sm">LES pressure, crural diaphragm,</text>
            <text x="20" y="70" class="t-sm">intra-abdominal LES</text>
            <text x="20" y="92" class="t-sm t-bad">Obesity, smoking, hiatal hernia</text>
            <rect x="10" y="118" width="310" height="96" rx="8" class="fg-acc"/>
            <text x="20" y="140" class="t-b">B. Clearance fails</text>
            <text x="20" y="162" class="t-sm">Peristalsis + salivary bicarbonate</text>
            <text x="20" y="184" class="t-sm t-bad">Hypotensive LES, failed peristalsis,</text>
            <text x="20" y="200" class="t-sm t-bad">less saliva (disease or drugs)</text>
            <rect x="10" y="226" width="310" height="96" rx="8" class="fg-acc"/>
            <text x="20" y="248" class="t-b">C. Stomach empties late</text>
            <text x="20" y="270" class="t-sm">Gastroparesis, heavy fatty meals</text>
            <text x="20" y="292" class="t-sm t-bad">More TLESRs (transient LES</text>
            <text x="20" y="308" class="t-sm t-bad">relaxations)</text>
          </svg>
      - kind: explain
        page: 284
        title: "الحاجز بيضعف إزاي؟"
        quote: "The ant reflux barriers as LES pressure (10-35mmgh), crural diaphragm pressure, intraabdominal location of the LES."
        text: |
          الحاجز في الكتاب تلات حاجات: **LES pressure (10-35 mmHg)**، ضغط الـ **crural diaphragm**، وإن الـ LES يبقى **intra-abdominal**. وأي حاجة تضعفهم تعمل GERD، زي **obesity** و **smoking** و ==hiatal hernia==.

          ليه دول بالذات؟ التفسير المقبول (مش في الكتاب):
          - **Obesity**: الكرش بيعلّي ضغط البطن، فبيزق المعدة على الباب.
          - **Hiatal hernia**: الـ LES بيطلع فوق الحجاب، فالـ crura ما تقدرش تقرصه، ويخرج من البطن (اللي ضغطها كان بيساعد يقفله).
          - **Smoking**: النيكوتين بيرخّي الـ LES وبيقلل اللعاب.
      - kind: reveal
        page: 284
        quote: "Delayed gastric emptying or gastroparesis or even heavy fatty meals are associated by more frequent attacks of transiet lower esophageal sphincter relaxation (TLESR)."
        prompt: "ليه الأكلة التقيلة الدسمة بتعمل حرقان، حتى في واحد الـ LES بتاعه سليم؟"
        answer: |
          الكتاب: **delayed gastric emptying** و gastroparesis، وحتى **heavy fatty meals**، بيزوّدوا الـ **transient LES relaxations (TLESR)**.

          التفسير المقبول (مش في الكتاب): الـ TLESR أصلًا طريقة المعدة إنها **تتكرّع** وتطلّع الهوا لما تتملي. الأكلة الكبيرة بتمط المعدة، والدهون بتبطّأ التفريغ، فالمعدة تفضل مليانة وقت أطول والـ TLESRs تكتر، ومع كل واحدة شوية حمض بيطلع. وبعدين الـ **clearance** (الـ peristalsis واللعاب) هي اللي بتلم الحمض ده، فلو ضعيفة يقعد ويحرق.
      - kind: check
        page: 284
        quote: "Acid refluxate at esophagus clears by esophageal peristalsis and salivary bicarbonate."
        question: "Salivary bicarbonate belongs to which GERD defence?"
        options:
          - "Esophageal clearance"
          - "The gastroesophageal junction barrier"
          - "Gastric emptying"
          - "The crural diaphragm"
        answer: 0
        why:
          - "صح: الـ acid بيتشال بالـ peristalsis والـ salivary bicarbonate."
          - "الحاجز = LES pressure، crural diaphragm، intra-abdominal LES."
          - "الـ gastric emptying له علاقة بالـ TLESRs."
          - "الـ crural diaphragm جزء من الحاجز، مش من الـ clearance."
      - kind: explain
        page: 285
        quote: "Esophageal or typical manifestation: The typical symptom is heartburn which often occurs 30–60 minutes after meals and upon reclining and relieved by antacids. This symptom has high diagnostic sensitivity."
        title: "الأعراض الـ typical"
        text: |
          - ==Heartburn==: بعد الأكل بـ **30-60 دقيقة** ولما ينام، وبيروح بالـ antacids. **high diagnostic sensitivity**.
          - **Regurgitation**: محتويات المعدة الحامضة أو المرّة بتطلع للبُق لوحدها.
          - **Dysphagia**: من erosive esophagitis، أو motility disorder، أو stricture.

          ليه بعد الأكل بـ 30-60 دقيقة ولما ينام؟ التفسير المقبول (مش في الكتاب): بعد الأكل المعدة مليانة والـ TLESRs كتير، ولما ينام الجاذبية ما تساعدش والبلع (اللي بيجيب لعاب) بيقل. والـ antacids بتريّح لأن اللي بيحرق هو الـ **acid** نفسه.
      - kind: match
        page: 285
        quote: "Laryngopharyngeal symptoms Chronic throat clearing, Globus, Hoarseness, Dysphonia."
        prompt: "وصّل كل عرض extraesophageal بالمجموعة بتاعته:"
        pairs:
          - ["Globus", "Laryngopharyngeal"]
          - ["Lung transplant rejection", "Respiratory"]
          - ["Dental erosion", "Others"]
        why: "Laryngopharyngeal: throat clearing، globus، hoarseness، dysphonia. Respiratory: cough، pulmonary fibrosis، lung transplant rejection، asthma. Others: dental erosion، otitis، sinusitis، postnasal drip."
      - kind: explain
        page: 286
        quote: "Patients with typical symptoms of heartburn and regurgitation should be treated empirically with a twice daily H2-receptor antagonist or a once-daily proton pump inhibitor for 4–8 weeks."
        title: "تبدأ بالتاريخ والعلاج"
        text: |
          الـ heartburn والـ regurgitation بيتنبأوا برد فعل كويس للعلاج، بس **sensitivity و specificity لحد 70%** بس. والـ extraesophageal أقل دقة.

          لو typical ومفيش alarm: ==empirical therapy==، **twice-daily h2-receptor antagonist (H2RA)** أو **once-daily proton pump inhibitor (PPI)** لمدة **4-8 weeks**.

          ولو مفيش استجابة، أو من الأول فيه ==alarm symptom==، يبقى investigations.

          ليه نبدأ بالعلاج مش بالمنظار؟ لأن الأعراض الـ typical بتتنبأ كويس بالاستجابة، وأغلب العيانين هيتحسنوا من غير ما يحتاجوا أي test. المنظار للي ما اتحسنش أو عنده alarm، لأن دول اللي ممكن يكون عندهم مضاعفة أو حاجة تانية خالص.
      - kind: mnemonic
        page: 286
        quote: "Further investigations are required if no response to empirical therapy or from the start there is any alarm symptom/s like dysphagia, hematemesis, weight loss, iron deficiency anemia."
        word: "DHWI"
        parts:
          - { key: "D", text: "Dysphagia" }
          - { key: "H", text: "Hematemesis" }
          - { key: "W", text: "Weight loss" }
          - { key: "I", text: "Iron deficiency anemia" }
        hook: |
          **D**on't **H**old, **W**e **I**nvestigate: أي واحدة من الأربعة = منظار، مش PPI وخلاص.
      - kind: aside
        tone: trap
        page: 286
        quote: "1/3 of esophagitis patients don't improve with PPI, and > 1/3 of patients with normal EGD and Ph-Metery improve with PPI."
        text: |
          ليه الـ PPI trial مش تشخيص قاطع؟ لأن **تلت** مرضى الـ esophagitis ما بيتحسنوش على PPI، و**أكتر من تلت** اللي الـ esophagogastroduodenoscopy (EGD) والـ pH بتاعهم normal بيتحسنوا. والـ **barium esophagography** **ما يتعملش** لتشخيص الـ GERD.
      - kind: explain
        page: 286
        title: "الـ EGD بيقول إيه؟ وليه مش barium؟"
        quote: "Esophagogastroduodenoscopy EGD: can detect the EG junction injury and stratify by Los Angeles LA classification and can diagnose the complications."
        text: |
          الـ **EGD** بيشوف إصابة الـ EG junction ويقسّمها بـ ==Los Angeles (LA) classification==، وبيشخّص المضاعفات (Barrett، stricture). والـ **barium esophagography should not be performed** لتشخيص الـ GERD.

          ليه؟ التفسير المقبول (مش في الكتاب): الـ barium ممكن يوري reflux عابر يحصل في ناس طبيعيين، ومش بيشوف الـ mucosa ولا ياخد biopsy. الـ EGD بيشوف الإصابة نفسها ويقيس شدتها، والـ LA grade هو اللي هتختار بيه العلاج بعدين (زي vonoprazan في B و C).
      - kind: figure
        page: 287
        title: "Los Angeles: A لحد D"
        image: { file: git/L10-la-grades.webp, book: true }
        alt: "Book endoscopy pictures and drawings of the Los Angeles grades of esophagitis: A, breaks under 5 mm on a single fold; B, over 5 mm on a single fold; C, breaks bridging folds over less than 75 percent of the circumference; D, over 75 percent."
        caption: |
          - **A**: break على fold واحدة **أقل من 5 mm**.
          - **B**: على fold واحدة **أكتر من 5 mm**.
          - **C**: بتوصل بين الـ folds، ==أقل من 75%== من المحيط.
          - **D**: أكتر من 75%.
      - kind: figure
        page: 287
        title: "الـ GERD: من الـ PPI test لحد التشخيص"
        image: { file: git/L10-gerd-algorithm.webp, book: true }
        alt: "Book algorithm: typical symptoms get a PPI test; resolution means presumptive GERD. Sustained symptoms or atypical symptoms lead to endoscopy with or without biopsy: positive is proven GERD (reflux esophagitis, Barrett's: erosive reflux disease); negative is unproven GERD and goes to ambulatory pH with or without impedance: abnormal acid exposure is non-erosive reflux disease, normal acid with positive symptom association is reflux hypersensitivity, and normal acid with negative association is functional heartburn."
        caption: |
          - اتحسّن على الـ **PPI test** = presumptive GERD.
          - ما اتحسنش، أو أعراض atypical: **endoscopy**. لو فيه esophagitis أو Barrett's = **erosive reflux disease**.
          - الـ endoscopy طبيعي: **pH ± impedance**:
            - acid عالي = ==non-erosive reflux disease==.
            - acid طبيعي والأعراض مرتبطة بالـ reflux = **reflux hypersensitivity**.
            - acid طبيعي ومفيش ارتباط = **functional heartburn**.
      - kind: table
        page: 287
        quote: "Esophageal pH or combined esophageal pH impedance testing Esophageal pH monitoring measures the amount of esophageal acid reflux, whereas combined pH-impedance testing measures both acidic and nonacidic reflux."
        title: "الـ tests في الـ GERD"
        columns: ["Test", "What it gives", "When"]
        rows:
          - ["EGD", "EGJ injury, LA grade, complications", "Alarm symptoms or no response"]
          - ["pH monitoring", "Acid reflux only", "Nonresponders, before surgery, extraesophageal"]
          - ["pH-impedance", "Acidic and nonacidic reflux", "Same indications"]
          - ["Barium", "Not for GERD diagnosis", "Should not be performed"]
        hide: [[0, 1], [1, 2], [2, 1], [3, 2]]
      - kind: reveal
        page: 287
        quote: "Esophageal pH monitoring measures the amount of esophageal acid reflux, whereas combined pH-impedance testing measures both acidic and nonacidic reflux."
        prompt: "عيان على PPI مرتين وعنده regurgitation لسه. ليه الـ pH-impedance أحسن له من الـ pH لوحده؟"
        answer: |
          الكتاب: الـ **pH** بيقيس الـ **acid reflux** بس، والـ **pH-impedance** بيقيس **acidic و nonacidic reflux**.

          التفسير المقبول (مش في الكتاب): الـ PPI بيخلّي اللي راجع **أقل حمضية** بس مش أقل كمية. فالـ pH لوحده هيقول «مفيش reflux» والعيان لسه بيرجّع. الـ impedance بيحس بأي سايل أو غاز معدّي في المريء مهما كان الـ pH، فيلقط الـ reflux اللي الـ PPI خبّاه.
      - kind: explain
        page: 288
        quote: "Reflux hypersensitivity is defined as retrosternal symptoms, including heartburn or chest pain triggered by physiological reflux in the absence of abnormally increased gastroesophageal reflux."
        title: "حاجات بتعمل نفسها GERD"
        text: |
          - **Mimics of GERD**: motility disorders، dyspepsia، peptic ulcer، functional disorders.
          - **Mimics of erosive esophagitis**: pill-induced، eosinophilic esophagitis (EoE)، infections (CMV، herpes، Candida).
          - ==Functional heartburn==: حرقان refractory للـ acid suppression **من غير GERD خالص**.
          - ==Reflux hypersensitivity==: أعراض طالعة من **physiological reflux** عادي، من غير زيادة في الـ reflux.

          ليه الـ PPI ما بيعملش حاجة في الـ functional heartburn؟ لأن مفيش reflux زيادة أصلًا يتعالج. والمشكلة في الإحساس نفسه (المريء حساس زيادة)، فالحمض الطبيعي أو حتى من غير حمض بيحس بحرقان.
      - kind: check
        page: 288
        quote: "Functional heartburn is defined as retrosternal burning discomfort or pain refractory to acid-suppressive therapy in the absence of gastroesophageal reflux disease."
        question: "Burning on twice-daily PPI; normal EGD; pH-impedance shows normal reflux, and symptoms do NOT match reflux episodes. Diagnosis?"
        options:
          - "Functional heartburn"
          - "Reflux hypersensitivity"
          - "Erosive esophagitis"
          - "Achalasia"
        answer: 0
        why:
          - "صح: refractory للـ PPI ومفيش GERD ومفيش ربط بالـ reflux = functional heartburn."
          - "الـ hypersensitivity لازم الأعراض تمشي مع الـ physiological reflux."
          - "الـ EGD normal."
