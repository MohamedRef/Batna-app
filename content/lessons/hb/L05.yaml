lecture: hb.L05
lessons:
  # ------------------------------------------------------------------
  - id: hb.L05.lesson1
    title: "فيروس C: مين هو وبيتنقل إزاي؟"
    hook: "فيروس RNA صغير كان ساكن في كبد مصر كلها، ودلوقتي بيتعالج بحباية. نبدأ نعرفه."
    minutes: 7
    pages: [90, 91]
    topics: [virology, transmission]
    goals:
      - "تعرف الـ family والـ genome والـ genotypes اللي بتتسأل"
      - "تفهم ليه C فيروس دم في الأساس"
      - "تعدّ الـ risk groups الخمسة من غير ما تبص"
    status: unverified
    steps:
      - kind: explain
        page: 90
        title: "الصورة الكبيرة في سطرين"
        text: |
          **HCV** فيروس RNA بيصيب الكبد، ومشكلته الكبيرة إنه غالبًا بيعمل ==chronic infection==: بيقعد سنين من غير ما يعمل دوشة.

          السكوت ده هو اللي بيخليه خطير. الالتهاب الهادي بيعمل fibrosis واحدة واحدة، لحد ما يوصل لـ cirrhosis وبعدها HCC. علشان كده الكتاب بيحطه من أهم أسباب الـ chronic liver disease.

          والخبر الحلو اللي المحاضرة بتبدأ بيه: ==Effective cures now exist==. يعني ده من الأمراض القليلة في الكبد اللي بنقول فيها «اتعالج وخلص».
      - kind: explain
        page: 90
        title: "البطاقة الشخصية للفيروس"
        text: |
          - **Family**: ==Flaviviridae==، والـ genus اسمه Hepacivirus، وأوله hepa يعني كبد.
          - **Genome**: ==single-stranded positive-sense RNA==. يعني خيط واحد بيتقري على طول (هنشرحها في الخطوة الجاية).
          - **Genotypes**: من 1 لـ 7. الأشهر في مصر والشرق الأوسط: ==1 و 3 و 4==.
          - **Burden**: حوالي 58 million عايشين بـ chronic HCV (WHO, 2024).

          الـ genotype كان بيحدد العلاج كله زمان. دلوقتي أهميته قلّت، وهتعرف ليه في درس التشخيص.
      - kind: reveal
        page: 90
        prompt: "يعني إيه **positive-sense** RNA؟ وده هيفرق معانا في العلاج في إيه؟"
        answer: |
          الـ positive-sense RNA بيشتغل كأنه **mRNA جاهز**: الخلية بتقراه على طول وتعمل منه بروتين واحد طويل (polyprotein) لازم يتقص لحتت علشان الفيروس يشتغل.

          والأهم: مفيش مرحلة DNA ولا نسخة بتستخبى في نواة الخلية (عكس HBV). علشان كده لما توقف تكاثره كفاية، بيختفي خالص، وده سر إن C **بيتعالج نهائيًا**. (ده شرح physiology مقبول، مش من نص الكتاب.)
      - kind: check
        page: 90
        question: "HCV belongs to which family, and what is its genome?"
        options:
          - "Flaviviridae; single-stranded positive-sense RNA"
          - "Hepadnaviridae; partially double-stranded DNA"
          - "Picornaviridae; single-stranded positive-sense RNA"
          - "Flaviviridae; double-stranded DNA"
        answer: 0
        why:
          - "صح: Flaviviridae، genus Hepacivirus، والـ genome ssRNA positive-sense."
          - "ده **HBV**، وهو الـ DNA virus الوحيد في الـ hepatitis viruses المشهورة."
          - "دي family بتاعة **HAV**، مش C."
          - "الـ family صح بس الـ genome غلط: C فيروس RNA."
      - kind: aside
        tone: joke
        page: 90
        text: |
          الكتاب بيقول إن مصر كانت **the highest HCV prevalence globally**. زمان كلمة «فيروس» لوحدها في أي عيادة في مصر كانت مفهومة إنها C من غير ما حد يسأل «أنهي فيروس؟» 😅

          والحمد لله إن الـ **national screening/treatment campaigns** قلبت الحكاية دي، وده هنرجعله في آخر درس.
      - kind: explain
        page: 90
        title: "بيتنقل إزاي؟ الدم أولًا"
        text: |
          الفيروس عايش في الدم، فأي حاجة بتنقل دم من حد لحد بتنقله. علشان كده الكتاب بيقول إن الـ mode الأساسي ==blood-borne (primary)==، ومنه:

          - **Needle sharing**: سرنجة واحدة بتلف على كذا حد (IV drug use).
          - **Blood transfusions**: دم مش متعمله screening.
          - **Unsafe medical procedures**: أدوات مش متعقمة كويس، زي حقن بإبرة اتستعملت قبل كده.

          وبعدين حاجات أقل بكتير، لأن كمية الفيروس اللي بتعدّي فيها قليلة:

          - **Sexual transmission**: less common.
          - **Vertical transmission**: rare (من الأم للطفل).
      - kind: figure
        page: 91
        title: "سلّم طرق العدوى"
        alt: "Three horizontal bars of decreasing length. Blood-borne (primary): needle sharing, transfusion, unsafe procedures, the longest bar. Sexual: less common, a medium bar. Vertical: rare, the shortest bar."
        caption: "الدم هو الطريق الرئيسي. الـ sexual **less common**، والـ vertical **rare**. لو الممتحن قلب الترتيب ده، اعرف إنه بيختبرك."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="18" text-anchor="middle" class="t-b t-lg">HCV transmission</text>
            <rect x="10" y="34" width="310" height="58" rx="8" class="fg-bad"/>
            <text x="22" y="56" class="t-b t-bad">Blood-borne (primary)</text>
            <text x="22" y="78" class="t-sm">needles (IVDU), transfusion, unsafe procedures</text>
            <rect x="10" y="108" width="190" height="50" rx="8" class="fg-acc"/>
            <text x="22" y="130" class="t-b">Sexual</text>
            <text x="22" y="148" class="t-sm t-mut">less common</text>
            <rect x="10" y="174" width="110" height="50" rx="8" class="fg-thin"/>
            <text x="22" y="196" class="t-b">Vertical</text>
            <text x="22" y="214" class="t-sm t-mut">rare</text>
            <text x="320" y="244" text-anchor="end" class="t-sm t-mut">bar length = how important, not exact numbers</text>
          </svg>
      - kind: mnemonic
        page: 91
        word: "DRINK"
        parts:
          - { key: "D", text: "hemoDialysis patients" }
          - { key: "R", text: "Recipients of unscreened blood" }
          - { key: "I", text: "IV drug users" }
          - { key: "N", text: "Needlestick injuries (healthcare workers)" }
          - { key: "K", text: "Kids born to HCV-positive mothers" }
        hook: |
          الـ **risk groups** الخمسة في الكتاب = **DRINK**. وماتقلقش، مالهاش دعوة بالشرب خالص: C فيروس دم، بيعدّي من الإبرة مش من الكوباية.
      - kind: sort
        page: 91
        prompt: "حط كل طريقة في مكانها حسب الكتاب:"
        bins: ["Primary (blood-borne)", "Less common or rare"]
        cards:
          - { text: "Needle sharing (IVDU)", bin: 0 }
          - { text: "Blood transfusions", bin: 0 }
          - { text: "Unsafe medical procedures", bin: 0 }
          - { text: "Sexual transmission", bin: 1 }
          - { text: "Vertical transmission", bin: 1 }
        why: "الكتاب حط الإبر والـ transfusion والـ unsafe procedures تحت **Blood-borne (primary)**، والـ sexual **less common** والـ vertical **rare**."
      - kind: check
        page: 91
        question: "Which of these is NOT one of the HCV risk groups listed in the lecture?"
        options:
          - "Hemodialysis patients"
          - "Healthcare workers with needlestick injuries"
          - "Children born to HCV-positive mothers"
          - "People who eat raw shellfish"
        answer: 3
        why:
          - "موجودة: الـ D في DRINK."
          - "موجودة: الـ N في DRINK."
          - "موجودة: الـ K في DRINK."
          - "صح: دي **fecal-oral** زي HAV. فيروس C بيمشي في الدم."
      - kind: try
        items: [hb.L05.001, hb.L05.003, hb.L05.007, hb.L05.008, hb.L05.009]
    recap:
      - "HCV: **Flaviviridae / Hepacivirus**، ssRNA **positive-sense**، genotypes **1–7** (مصر والشرق الأوسط: 1 و 3 و 4)."
      - "حوالي **58 million** عندهم chronic HCV (WHO 2024). مصر كانت الأعلى في العالم، والحملات القومية قللت العبء."
      - "العدوى **blood-borne** في الأساس. الـ sexual **less common** والـ vertical **rare**."
      - "الـ risk groups: **DRINK** (Dialysis، Recipients of unscreened blood، IVDU، Needlestick، Kids of HCV+ mothers)."
    practice: [hb.L05.001, hb.L05.002, hb.L05.003, hb.L05.004, hb.L05.005, hb.L05.006, hb.L05.007, hb.L05.008, hb.L05.009, hb.L05.054]

  # ------------------------------------------------------------------
  - id: hb.L05.lesson2
    title: "الفيروس الساكت: natural history والتشخيص"
    hook: "من كل 100 واحد اتعدوا، كام هيخف لوحده وكام هيوصل لـ cirrhosis؟ وإزاي تعرف إن العدوى لسه شغالة؟"
    minutes: 9
    pages: [91, 92]
    topics: [natural-history, clinical, diagnosis]
    goals:
      - "تحفظ أرقام الـ clearance والـ chronicity والـ cirrhosis صح"
      - "تعدّ الـ extrahepatic manifestations الأربعة"
      - "تفرّق بين screening test و confirmatory test وتعرف ليه"
    status: unverified
    steps:
      - kind: explain
        page: 91
        title: "الأرقام اللي الممتحن بيحبها"
        text: |
          تخيّل 100 واحد اتعدوا النهارده. الكتاب بيقسمهم كده:

          - ==Spontaneous clearance==: من 15 لـ 45% المناعة بتاعتهم بتطرد الفيروس لوحدها في الـ acute phase.
          - ==Chronic infection==: من 55 لـ 85% الفيروس بيفضل معاهم أكتر من 6 شهور. الـ 6 شهور دي هي الحد اللي بيفصل acute عن chronic.

          واللي بيزمن، الحكاية بتمشي بالراحة: chronic hepatitis، وبعدين ==cirrhosis== في حوالي 15–30% على مدى 20 سنة، وبعدين **HCC**، وده بييجي mainly with cirrhosis.

          يعني الـ HCC هنا مش بيطلع من الهوا: غالبًا بيطلع على أرض كبد متليف. افتكر الجملة دي، هترجعلنا في درس المتابعة بعد العلاج.
      - kind: figure
        page: 91
        title: "100 واحد اتعدوا: هيروحوا فين؟"
        alt: "A funnel. 100 people with acute HCV split into 15 to 45 percent spontaneous clearance and 55 to 85 percent chronic infection over 6 months. Chronic infection leads to chronic hepatitis, then cirrhosis in about 15 to 30 percent over 20 years, then HCC, mainly in cirrhosis."
        caption: "الفيروس بيكسب الجولة الأولى مع أغلب الناس (55–85% chronic). وبعد كده الـ cirrhosis بتيجي ببطء على مدى **20 سنة**، والـ HCC غالبًا فوق الـ cirrhosis."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L05a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
