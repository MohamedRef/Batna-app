  - id: neph.L07.lesson6
    title: "Alport و thin membrane: نفس الـ collagen، مصير مختلف"
    hook: "ولد عنده دم في البول من صغره وسمعه بيقل، وأمه عندها دم في البول بس. نفس الجين، ومصيرين مختلفين."
    minutes: 10
    pages: [177, 180]
    topics: [alport, tbm]
    goals:
      - "تعرف المشترك بين الـ Alport والـ TBMN"
      - "تعرف وراثة الـ Alport وليه الولد أوحش من البنت"
      - "تفهم ليه الكلية والودن والعين مع بعض"
    status: unverified
    steps:
      - kind: explain
        page: 177
        title: "اتنين شبه بعض"
        quote: "Similar features include: Defect in basement membrane. Main presentation is persistent hematuria."
        text: |
          الكتاب بيبدأ بالمشترك بين الـ **Alport** والـ **thin membrane disease**:

          - ==Defect in basement membrane==.
          - العرض الرئيسي **persistent hematuria**.

          ليه العيب في الـ basement membrane بيعمل hematuria بالذات؟ التفسير المقبول (مش في الكتاب): الـ **GBM** هو الحاجز اللي بيمنع كرات الدم تعدّي للبول. لو الحاجز رفيع أو متشقق، كرات الدم الحمرا بتزق نفسها من الفتحات الصغيرة، فتلاقي **microscopic hematuria** طول الوقت.

          الفرق بينهم هو اللي هنقضّي الدرسين نتعلمه: واحد بيوصل لـ ESRD وطرش، والتاني غالبًا بيفضل benign.
      - kind: explain
        page: 178
        title: "الـ type IV collagen"
        quote: "Alport syndrome (AS) is a generalized, inherited disorder of basement membranes caused by mutations affecting specific proteins of the type IV (basement membrane) collagen family. The major features of AS are hematuria, progressive nephritis with proteinuria and declining renal function, sensorineural deafness, and ocular abnormalities. AS is a rare disease, affecting approximately 1 in 50,000 people and is seen in all ethnicities and races. AS accounts for approximately 0.5% of adults and 1.7% of children with end-stage renal disease (ESRD) in the United States.¹"
        text: |
          الاتنين **basement membrane defect**، والعَرَض الرئيسي **persistent hematuria**.

          الـ **type IV collagen** موجود في الـ glomerular basement membrane (GBM) و Bowman capsule و distal tubule و الجلد و ==العين والودن== والـ testis، وفيه 6 chains (α1–α6).

          الـ ==Alport== = **hematuria + progressive nephritis + sensorineural deafness + eye**. نادر (1 في 50,000)، و **1.7%** من الأطفال على end-stage renal disease (ESRD).

          ليه الودن والعين؟ التفسير المقبول (مش في الكتاب): نفس الـ chains (α3، α4، α5) بتاعة الـ GBM موجودة في الـ basement membrane بتاع الـ cochlea وعدسة العين. فلما الـ collagen يبوظ، الغشاء يبقى ضعيف في الأماكن التلاتة. وليه الـ hematuria أول حاجة؟ لأن الـ GBM الضعيف بيتفتح فيه شقوق صغيرة تعدّي منها كرات الدم الحمرا بدري قبل أي حاجة تانية.

          والـ inheritance نفسه بيفرق: التفسير المقبول (مش في الكتاب): الـ α5 (COL4A5) على الـ X، والـ α3 و α4 على chromosome 2. علشان كده أغلب الـ Alport X-linked (الولاد أشد)، والباقي autosomal recessive (ولاد وبنات بنفس الشدة) أو أندر autosomal dominant. يعني لما تشوف بنت عندها Alport شديد، فكّر في الـ autosomal recessive.
      - kind: table
        page: 179
        quote: "Defective basement membrane formation in the glomerulus, cochlea, and eye accounts for these findings. Although inheritance is varied, an X-linked inherited mutation in the COL4A5 gene (>200 described) that encodes a5 type IV collagen accounts for 80% of cases. This leads to afflicted \", with ♀ carriers. Autosomal recessive (AR) forms account for ~15% and auto-somal dominant (AD) for ~5% (gene: COL4A3/COL4A4 on chromosome 2)."
