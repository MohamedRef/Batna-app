  - id: neph.L03.017
    kind: enumerate
    topic: pathogenesis
    prompt: List the four pathways from acute heart failure to acute kidney disease in CRS-1 (Figure 2).
    points:
      - "Humoral signaling → endothelial activation → cytokine secretion"
      - "Diuretic and ACE inhibitor → toxicity, vasoconstriction"
      - "Hemodynamically mediated damage → decreased perfusion, increased venous pressure"
      - "Sympathetic activation and RAA activation with vasoconstriction (feeding back on the heart)"
    pass: 3
    hook: "من القلب الحاد للكلية بـ 4 طرق: «هرمونات، أدوية، ضغط، وأعصاب» = humoral signaling → endothelial activation → cytokines؛ diuretic وACEi → toxicity وvasoconstriction؛ hemodynamic (perfusion أقل وvenous pressure أعلى)؛ وsympathetic + RAA activation بـ vasoconstriction بترجع تضرب القلب."
    src: { page: 69, quote: "Figure 2: Mechanism of damage in CRS-1. ACE, angiotensin-converting enzyme; CKD, chronic kidney disease; CRS, cardiorenal syndrome; RAA, rennin-angiotensin-Aldosterone\nAcute Heart Failure\n  Humoral signaling → Endothelial Activation → Cytokine secretion → Acute Renal Disease\n  Diuretic and ACE inhibitor → Toxicity, Vasoconstriction → Acute Renal Disease\n  Hemodynamically mediated damage → Decreased perfusion, increased venous pressure → Acute Renal Disease\n  Sympathetic Activation → Acute Renal Disease and Acute Heart Failure\nAcute Renal Disease\n  RAA activation, vasoconstricition → Acute Heart Failure" }
    status: unverified
