  - id: geri.L01.lesson3
    title: "الـ angina اللي مش بتوجع"
    hook: "الحاج مش بيقول «صدري واجعني»، بيقول «بنهج لما أطلع السلم». ودي أهم جملة في الدرس."
    minutes: 8
    pages: [8, 10]
    topics: [cad, angina]
    goals:
      - "تعدّ الـ traditional والـ newer risk factors"
      - "تعرف ليه الـ angina بتستخبى عند الكبار"
      - "تشخّص وتعالج الـ angina"
    status: unverified
    steps:
      - kind: explain
        page: 8
        title: "الـ CAD بيكبر مع السن"
        quote: "85% of all deaths from coronary artery disease occur after the age of 65."
        text: |
          الـ incidence بتزيد مع السن، و ==85%== من وفيات الـ CAD بتحصل **بعد 65**.

          **Traditional risk factors:** hypertension، diabetes، قلة الحركة، **total cholesterol/HDL ratio** عالي، smoking، age.

          **Newer risk factors:** ==CRP==، **lipoprotein(a)**، **homocysteine**، **microalbuminuria**.
      - kind: mnemonic
        page: 8
        quote: "Newer Risk Factors are: C-reactive protein, Lipoprotein a, Homocysteine, Microalbuminuria."
        word: "CLHM"
        parts:
          - { key: "C", text: "C-reactive protein" }
          - { key: "L", text: "Lipoprotein(a)" }
          - { key: "H", text: "Homocysteine" }
          - { key: "M", text: "Microalbuminuria" }
        hook: "**CLHM**: «كلّه مُهم». الـ newer risk factors الأربعة. أي حاجة تانية في السؤال (smoking، age، DM) تبقى traditional."
      - kind: explain
        page: 8
        title: "تقيس المرض قبل ما يبان"
        quote: "Ankle-brachial index (ABI) (normal ratio is > 0.9 – 0.95)"
        text: |
          الـ **subclinical atherosclerosis** بيتقاس بـ:
          1. **CT coronary angiography**
          2. **Carotid ultrasound**: كمية الـ plaque بتتنبأ بالـ stroke
          3. ==Ankle-brachial index==: الطبيعي **>0.9–0.95**
      - kind: reveal
        page: 8
        quote: "Ankle-brachial index (ABI) (normal ratio is > 0.9 – 0.95)"
        prompt: "ليه الـ ABI الطبيعي حوالي 1 أو أكتر، وتحت 0.9 يبقى في مشكلة؟"
        answer: |
          الضغط في الكاحل طبيعي **زي** ضغط الدراع أو أعلى شوية (الموجة بتتضخّم وهي نازلة). لو في **plaque** بيضيّق شرايين الرجل، الضغط تحت يقل، والنسبة تنزل تحت **0.9**.

          وطالما الشرايين في الرجل مسدودة، يبقى غالبًا الـ coronaries كمان. (تفسير فسيولوجي؛ الرقم من الكتاب.)
      - kind: explain
        page: 9
        title: "ليه الـ angina بتستخبى؟"
        quote: "The history of classic exertional angina may be difficult to obtain as the elderly patient who has limited activity"
        text: |
          الـ angina أشهر عرض للـ CAD: **80%** من الكبار.

          بس الحاج **مش بيتحرك كتير**، فمش بيوصل للمجهود اللي يطلّع الألم غير متأخر جدًا. وبدل الألم بيجي ==dyspnea on exertion==.

          أعراض تانية: palpitation، weakness، **unexplained diaphoresis**، indigestion، ألم في الرقبة والكتف. والـ **rest (unstable)** والـ rapidly progressive angina بيحصلوا كتير.
      - kind: aside
        tone: joke
        text: "تسأل الحاج: «صدرك بيوجعك لما تمشي؟» يقولك: «أمشي فين يا ابني؟ أنا من الكنبة للحمام». علشان كده اسأله عن **النهجان** مش عن الألم."
      - kind: explain
        page: 9
        title: "الكشف والـ ECG"
        quote: "1- Faint heart sounds. 2- S4 → reduced left ventricular compliance. 3- Reversed splitting of S2 dt LBBB."
        text: |
          **Signs:**
          1. Faint heart sounds
          2. ==S4== ← reduced LV compliance
          3. **Reversed splitting of S2** ← LBBB
          4. Transient **mitral regurgitation** murmur

          **ECG:** ST depression **>2 mm** في **أكتر من lead**، و T wave مقلوبة أو flat. والـ **cardiac enzymes normal**.
      - kind: reveal
        page: 9
        quote: "4- Transient Mitral regurge murmur."
        prompt: "ليه الـ MR murmur في الـ angina بيبقى transient؟"
        answer: |
          الـ **papillary muscle** نفسها بتبقى ischemic أثناء النوبة فما بتشدّش الـ mitral leaflets كويس ← **MR**. لما الـ ischemia تروح، العضلة ترجع تشتغل والـ murmur يختفي. (تفسير فسيولوجي.)
      - kind: explain
        page: 10
        title: "تشخيص وعلاج"
        quote: "Coronary arteriography - Remains the definitive test for the diagnosis of CAD"
        text: |
          **Tests:** ECG، enzymes طبيعية، treadmill، **thallium scintigraphy**، 24-hour ambulatory monitoring، و ==coronary arteriography== اللي هو الـ **definitive test**.

          **صلّح الـ risk factors:** حركة، وزن لحد **BMI ≤24**، سكر، ضغط، وخفض الـ LDL بالـ statin أو fibrates أو nicotinic acid.

          **أثناء النوبة:** sublingual nitroglycerin.

          **بين النوبات:**
          - **Nitrates**: آثارها orthostatic hypotension و headache و syncope
          - **Beta-blockers**
          - **CCB**
          - **Antiplatelets**: clopidogrel و aspirin

          **Interventional:** PTCA أو CABG.
      - kind: aside
        tone: trap
        page: 10
        quote: "B blockers (contraindicated in vasospastic angina) SE: Fatigue, depression, bradycardia, heart block, hypotension."
        text: "الـ **beta-blockers** ممنوعة في الـ ==vasospastic angina== (بتسيب الـ alpha وحده يقفّل الشريان). وآثارها الجانبية عند الحاج: **fatigue، depression، bradycardia، heart block، hypotension**؛ وده حاج عنده أصلًا sick sinus."
      - kind: sort
        page: 8
        quote: "The traditional Risk Factors are: Hypertension, Diabetes, Lack of exercise, Ratio of high total cholesterol to high-density lipoprotein, Smoking, Age."
        prompt: "صنّف الـ risk factors:"
        bins: ["Traditional", "Newer"]
        cards:
          - { text: "Smoking", bin: 0 }
          - { text: "Age", bin: 0 }
          - { text: "Total cholesterol / HDL", bin: 0 }
          - { text: "Lack of exercise", bin: 0 }
          - { text: "Homocysteine", bin: 1 }
          - { text: "Lipoprotein(a)", bin: 1 }
          - { text: "Microalbuminuria", bin: 1 }
          - { text: "C-reactive protein", bin: 1 }
        why: "الـ newer هي الـ biomarkers الأربعة **CLHM**؛ الباقي traditional."
      - kind: try
        items: [geri.L01.030, geri.L01.031, geri.L01.041, geri.L01.049, geri.L01.048]
    recap:
      - "85% من وفيات الـ CAD بعد 65."
      - "Newer risk factors: CLHM (CRP، Lp(a)، homocysteine، microalbuminuria)."
      - "ABI طبيعي >0.9–0.95."
      - "الحاج بيجي بـ dyspnea on exertion بدل الألم."
      - "Coronary arteriography هو الـ definitive test. الـ BB ممنوع في الـ vasospastic."
