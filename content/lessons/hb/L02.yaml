        text: |
          افتكرها زي **الفكّة**: 10، 15، 20، 25. كل خمسة kPa بتقولك حاجة جديدة.

          ولاحظ إن الـ 15 والـ 20 لازم معاهم platelets أكتر من 150. الرقم لوحده مش كفاية علشان تطمّن.
      - kind: reveal
        page: 35
        quote: "Platelet count, spleen size and spleen stiffness should be used as additional NITs to further improve risk stratification for CSPH (LoE 3, strong recommendation)."
        prompt: "ليه الـ **platelet count** بيدخل في قرار الـ CSPH والـ varices؟"
        answer: |
          لأن الـ portal hypertension بيعمل **splenomegaly**، والطحال الكبير بيحجز الصفايح (**hypersplenism**)، والكبد المتليف بيعمل **thrombopoietin** أقل.

          فالصفايح الواطية هي «بصمة» الضغط العالي في الدم. وعلشان كده الكتاب بيقول platelet count و spleen size و spleen stiffness كلهم additional NITs للـ CSPH.
      - kind: explain
        page: 35
        title: "Baveno: مين يعمل منظار؟"
        quote: "In patients with cACLD due to untreated viral hepatitis, HIV-HCV coinfection, alcohol, NAFLD, PBC and PSC, the finding of LSM by TE <20 kPa and platelet count >150 G/L (Baveno VI criteria) is a validated tool to rule-out high-risk varices and avoid endoscopic screening."
        text: |
          الـ elastography هنا بتجاوب على سؤال عملي جدًا: مين محتاج منظار؟

          **تشخيص الـ CSPH في الـ cACLD**
          - LSM بالـ transient elastography (TE) أكتر من 20–25 kPa بيشخّص الـ CSPH. وأكتر من 20 kPa معناه CSPH very likely (حوالي 90%).
          - ==Portosystemic collaterals== على الـ US أو computed tomography (CT) أو magnetic resonance imaging (MRI) = sign of CSPH، ولازم تتكتب في التقرير.

          الـ ==Baveno VI criteria==
          - لو LSM أقل من 20 kPa و platelets أكتر من 150 G/L: الـ varices اللي محتاجة علاج very unlikely (أقل من 5%).
          - يبقى ما تعملش screening endoscopy، وأعد الـ LSM والـ platelets كل سنة.
          - لو واحد من الاتنين مش متحقق (LSM 20 أو أكتر، أو platelets أقل من 150): اعمل screening endoscopy.

          ليه الاتنين مع بعض؟ الـ LSM بيقيس الكبد، والـ platelets بتعكس الطحال المتضخم من الضغط. لو الاتنين مطمّنين، فرصة الدوالي الكبيرة ضعيفة، وتوفّر على المريض منظار.

          **فين اتجرّبت؟**
          - الـ criteria دي validated في الـ cACLD بسبب untreated viral hepatitis، HIV-HCV، alcohol، non-alcoholic fatty liver disease (NAFLD)، **primary biliary cholangitis (PBC)** و **primary sclerosing cholangitis (PSC)**.
          - **Spleen stiffness** ممكن تساعد في تقدير الـ high-risk varices (weak recommendation).
      - kind: sort
