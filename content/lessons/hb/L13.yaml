  - id: hb.L13.lesson13
    title: "الـ IgG4-RD: مين بيقلّده، ونعالجه إزاي"
    hook: "IgG4 cells لوحدها مش تشخيص: ورم أو lymphoma ممكن يعملوا كده. ولما يتأكد، steroids بدري قبل ما الـ fibrosis تقفل الباب."
    minutes: 8
    pages: [249, 250]
    topics: [igg4-diagnosis, igg4-treatment]
    goals:
      - "تعدّ الحاجات اللي بتزوّد الـ IgG4 cells من غير IgG4-RD"
      - "ترتب العلاج: induction ثم maintenance، وتتعامل مع الـ relapse"
      - "تعرف الـ relapse risk factors وليه لازم نشك فيه بدري"
    status: unverified
    steps:
      - kind: explain
        page: 249
        quote: "Lymphoma: Low-grade B-cell lymphomas should be excluded in cases of possible IgG4-RD with florid lymphoplasmocytic infiltrates."
        title: "حاجات فيها IgG4 cells بس مش IgG4-RD"
        text: |
          الـ IgG4+ cells لوحدها مش تشخيص. فيه حاجات بتزوّدها من غير ما تكون IgG4-RD:

          - **Inflammatory**: oral inflammatory diseases، و **primary sclerosing cholangitis (PSC)**، و rheumatoid arthritis.
          - ==Lymphoma==: استبعد **low-grade B-cell lymphoma** لو الـ lymphoplasmacytic infiltrate كبير جدًا (florid).
          - ==Cancer==: خصوصًا الـ pancreatobiliary.

          إزاي تفرّق في الـ cancer؟ الـ IgG4 infiltration فيه بيبقى **patchy**، ومن غير storiform pattern ولا phlebitis. يعني الخلايا موجودة، بس باقي الصورة ناقصة.
      - kind: check
        page: 249
        quote: "Malignant disease: the cancerous tissue may be infiltrated with IgG4+ plasma cells to varying degrees. It is more common in pancreatobiliary cancers, although it can also be seen in other tumours. IgG4 infiltration in malignant tis-sues is usually patchy and not associated with the rest of the characteristics of the disease, such as the storiform pattern or phlebitis."
        question: "A pancreatic head mass shows a patchy IgG4+ plasma cell infiltrate with no storiform fibrosis and no phlebitis. What does this pattern suggest?"
        options:
          - "Malignancy infiltrated by IgG4+ cells"
          - "Classic type 1 AIP"
          - "IgG4-related sclerosing cholangitis"
          - "Retroperitoneal fibrosis"
        answer: 0
        why:
          - "صح: في السرطان الـ IgG4 infiltration بيبقى **patchy** ومن غير باقي الـ features (storiform، phlebitis)."
          - "الـ AIP محتاجة الـ IgG4 cells **diffuse** مع storiform fibrosis (prerequisite)."
          - "دي برضه IgG4-RD ولازم ليها نفس الـ histology."
          - "دي مش عينة بنكرياس أصلًا، ودي IgG4-RD بنفس الـ criteria."
      - kind: explain
        remind: [hb.L13.212]
        page: 249
        quote: "It is important to start treatment as soon as possible once the disease is diagnosed, in order to prevent the development of fibrosis, and to maintain the treatment once remission is achieved to avoid relapses. IgG4-RD is mainly treated with systemic glucocorticoids."
        title: "العلاج"
        text: |
          المبدأ: ابدأ بدري، قبل ما الـ fibrosis تتكوّن، وكمّل بعد الـ remission علشان تمنع الـ relapse. العلاج الأساسي ==systemic glucocorticoids==.

          - **Induction**: الـ steroids بتعمل remission في لحد 90% من الـ type 1 AIP. ولو الـ steroids ممنوعة (contraindicated)، الـ ==rituximab== لوحده ممكن يعمل remission.
          - **Relapse**: بيحصل في 30–50%. الـ international consensus: steroids تاني، أو جرعة أعلى، أو تزوّد **immunosuppressants** أو rituximab.
          - ==Maintenance==: low-dose steroids، أو rituximab، أو **azathioprine**، أو 6-mercaptopurine، أو **mycophenolate mofetil**.
          - **Prognosis**: الـ remission شائعة، بس حوالي 10% بيتطوروا لـ chronic pancreatitis بـ calcifications و exocrine insufficiency.

          ليه نبدأ بدري؟ الالتهاب بيستجيب للـ steroids، لكن الـ fibrosis لما تتكوّن ما بترجعش.
      - kind: reveal
        page: 249
        quote: "It is important to start treatment as soon as possible once the disease is\n diagnosed, in order to prevent the development of fibrosis, and to maintain the\n treatment once remission is achieved to avoid relapses."
        prompt: "ليه الكتاب مصمم إن العلاج يبدأ أسرع ما يمكن، وإنه يكمّل بعد الـ remission؟"
        answer: |
          الكتاب: ابدأ بدري **to prevent the development of fibrosis**، وكمّل بعد الـ remission **to avoid relapses**.

          التفسير المقبول (مش في الكتاب): الـ steroids بتطفي الـ **lymphoplasmacytic infiltration** (الالتهاب)، بس مش بتفك الـ **storiform fibrosis** اللي اتكونت. يعني العضو اللي اتليّف (بنكرياس أو قناة) مش هيرجع. وبما إن الـ relapse بيحصل في **30–50%**، وقف العلاج بدري بيدّي المرض فرصة يرجع ويعمل ندبة جديدة.
      - kind: figure
        page: 250
        quote: "Maintenance therapy consists of low doses of corticosteroids. Other alternatives for maintenance treatment are rituximab, and immunomodulators such as azathioprine, 6-mercaptopurine or mycophenolate mofetil."
