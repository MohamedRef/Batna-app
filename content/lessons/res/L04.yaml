        quote: "Which of the following is/are consistent with case series study?\nA. An observational study used to identify similar or differing characteristics between selected cases.\nB. Can be prospective or retrospective and usually involves only a small number of individuals.\nC. Is a descriptive study that reports on data from a group of individuals who have a similar disease or condition.\nD. A and C only.\nE. A, B and C."
        question: "Which is/are consistent with a case series study? (A) observational, compares characteristics between selected cases; (B) prospective or retrospective, usually a small number; (C) descriptive, reports a group with a similar disease."
        options:
          - "A, B and C"
          - "A and C only"
          - "C only"
