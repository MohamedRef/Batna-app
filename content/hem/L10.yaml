    tags: [high-yield]
  - id: hem.L10.108
    kind: card
    topic: secondary
    front: Causes of hereditary methemoglobinemia?
    back: Hb mutations near the heme pocket (Hb M) and enzyme defects of NADH generation (NADH reductase, cytochrome b5 reductase).
    src: { page: 172, quote: "Hereditary methemoglobinemia due Hb mutation involving amino acids around the hem pocket (Hb M)" }
    status: unverified
  - id: hem.L10.109
    kind: card
    topic: secondary
    front: Why does methemoglobinemia cause polycythemia?
    back: Met-Hb has a higher O2 affinity with a left-shifted curve, so chronic methemoglobinemia behaves like a high-affinity Hb.
    src: { page: 172, quote: "Met-Hb A has an increased affinity to oxygen and left-shifted oxygen dissociation curves." }
    status: unverified
