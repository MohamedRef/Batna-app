  - id: res.L03.052
    kind: card
    topic: pico
    front: What four elements should a well-built clinical research question include?
    back: "PICO: Population (patient), Intervention, Comparison, Outcome."
    src: { page: 36, quote: "Elements of a clinical research question: A \"well-built\" research question should include four elements; referred to as PICO" }
    status: unverified
    tags: [high-yield]
  - id: res.L03.053
    kind: card
    topic: pico
    front: "PICO \"P\": what does it describe?"
    back: >-
      The patients or population to be studied: their characteristics, such as age, gender, disease status
      or any other patient-related characteristic. It is the first step of PICO.
    src: { page: 37, quote: "PICO letters stand for:\n  P: Patient or population. The first step in the PICO process is to identify the patients or population to be studied. More specifically, it describes patients' characteristics, such as age, gender, disease status, or any other patient-related characteristic.\n  I: Intervention to be tested. Identifying the intervention is the second step in the PICO process. It is important to identify the exposure intended to be studied in the research project. This may include the use of a specific diagnostic test, treatment, adjunctive therapy, medication, etc." }
    status: unverified
  - id: res.L03.054
    kind: card
    topic: pico
    front: "PICO \"I\": what does it describe?"
    back: >-
      The intervention (exposure) to be tested, for example a specific diagnostic test, treatment,
      adjunctive therapy or medication. It is the second step of PICO.
    src: { page: 37, quote: "PICO letters stand for:\n  P: Patient or population. The first step in the PICO process is to identify the patients or population to be studied. More specifically, it describes patients' characteristics, such as age, gender, disease status, or any other patient-related characteristic.\n  I: Intervention to be tested. Identifying the intervention is the second step in the PICO process. It is important to identify the exposure intended to be studied in the research project. This may include the use of a specific diagnostic test, treatment, adjunctive therapy, medication, etc." }
    status: unverified
  - id: res.L03.055
    kind: card
    topic: pico
    front: "PICO \"C\": what is it, and what is special about it?"
    back: >-
      The comparison: the alternative exposure the intervention is compared with, such as the standard of
      care or a placebo. It is the only optional element: the researcher may study the intervention alone
      if there is no interest in a comparison or no comparable group.
    src: { page: 38, quote: "C: Comparison used in the research project. It is the alternative exposure to which the intervention will be compared, which might be the standard of care or a placebo. The comparison component is the only optional one in the PICO question, since the researcher might study the intervention alone because either due to no interest in comparison or the lack of a comparable group.\nO: Outcome to be measured as a result of the intervention. It is the evaluation of the intervention's effect. This may include cure or level of control of a disease, efficacy of a medication or a diagnostic test, etc." }
    status: unverified
    tags: [high-yield]
