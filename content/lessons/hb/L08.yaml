    status: unverified
    steps:
      - kind: explain
        page: 140
        quote: "Liver Injury Serum Biomarkers:\n| Markers and scales | Mechanism | Advantages | Limitations |\n|---|---|---|---|\n| Alanine Transaminase (ALT) | Released from hepatocytes that are damaged | ALT1 is highly specific to liver. Prognostic value: Hy's law | Damage has already occurred. |\n| Aspartate Aminotransferase (AST) | Damaged hepatocyte release | Modified Hy's Law prognostic value (nR) | No liver-specific damage has already occurred. |\n| Alkaline Phosphatase (ALP) | Injuries to the canalicular membrane or biliary epithelial cells | Cholestatic phenotype | There is no liver-specific (bone, salivary glands, intestinal, or biliary) |\n| International Normalized Ratio (INR) | Impairment of hepatic function | | Deficiency of vitamin K; anticoagulants |\n| Bilirubin | Impairment of hepatic function. Changes in the generation, processing, or release of bilirubin. | Prognostic value: Hy's Law | Nothing specific. There are two types: indirect (unconjugated) and direct (conjugated). |\n| Albumin | Impairment of hepatic function | | Malnutrition, nephrotic syndrome, cirrhosis (any cause) |"
        title: "الـ serum biomarkers القديمة"
        text: |
          جدول صفحة 140 بيدي لكل marker ميزة وعيب:

          - ==Alanine aminotransferase (ALT)==: highly specific to liver، وليه prognostic value (==Hy's law==). عيبه: damage has already occurred.
          - **Aspartate aminotransferase (AST)**: modified Hy's law (nR). مش liver-specific، والضرر برضه حصل خلاص.
          - **Alkaline phosphatase (ALP)**: بيعكس الـ cholestatic phenotype. مش liver-specific (bone، salivary glands، intestine، biliary).
          - **International normalised ratio (INR)**: impairment of hepatic function. بيتلخبط مع vitamin K deficiency و anticoagulants.
          - **Bilirubin**: prognostic (Hy's law)، بس nothing specific.
          - **Albumin**: يقل مع malnutrition، nephrotic syndrome، cirrhosis من أي سبب.

          المشكلة المشتركة: كلهم بيطلعوا بعد ما الضرر حصل، أو مش خاصين بالكبد. وده اللي خلّى الناس تدوّر على markers أذكى.
      - kind: update
        page: 140
        quote: "Liver Injury Serum Biomarkers:\n| Markers and scales | Mechanism | Advantages | Limitations |\n|---|---|---|---|\n| Alanine Transaminase (ALT) | Released from hepatocytes that are damaged | ALT1 is highly specific to liver. Prognostic value: Hy's law | Damage has already occurred. |\n| Aspartate Aminotransferase (AST) | Damaged hepatocyte release | Modified Hy's Law prognostic value (nR) | No liver-specific damage has already occurred. |\n| Alkaline Phosphatase (ALP) | Injuries to the canalicular membrane or biliary epithelial cells | Cholestatic phenotype | There is no liver-specific (bone, salivary glands, intestinal, or biliary) |\n| International Normalized Ratio (INR) | Impairment of hepatic function | | Deficiency of vitamin K; anticoagulants |\n| Bilirubin | Impairment of hepatic function. Changes in the generation, processing, or release of bilirubin. | Prognostic value: Hy's Law | Nothing specific. There are two types: indirect (unconjugated) and direct (conjugated). |\n| Albumin | Impairment of hepatic function | | Malnutrition, nephrotic syndrome, cirrhosis (any cause) |"
        text: "الكتاب بيذكر **Hy's law** كـ prognostic value للـ ALT والـ bilirubin من غير ما يعرّفه. تعريفه في الـ European Association for the Study of the Liver (EASL): **hepatocellular injury (ALT > 3× upper limit of normal (ULN)) + jaundice (bilirubin > 2× ULN)** من غير سبب تاني، وده بيتوقع حوالي **10%** mortality أو transplant."
