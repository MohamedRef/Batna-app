  - id: res.L08.042
    kind: mcq
    topic: designs
    stem: >-
      An investigator suspects first-trimester acetaminophen causes neural tube defects; the background risk is 1 in 1,000.
      Which design is best to test this?
    options: [Cohort study, Case-control study, Clinical trial, Ecologic study, Cross-sectional study]
    answer: 1
    why:
      - With a risk of 1/1,000, a cohort needs enormous numbers to collect enough cases.
      - A rare disease is best studied by starting from the cases.
      - Giving pregnant women a suspected teratogen is unethical.
      - Ecologic data cannot link one mother to one baby.
      - A survey would capture too few cases.
