        quote: "Drugs risks in elders Polyphamacy Interactions Errors"
        text: |
          **المخاطر:** ==polypharmacy==، interactions، errors.

          **Pharmacokinetics:** الإخراج الكلوي يقل ← ==half-life أطول== ← toxicity أكتر.

          **Pharmacodynamics:** الـ diuretics تعمل **glucose intolerance**، والـ metformin يعمل **diarrhea**.

          ليه؟ الدوا اللي بيخرج من الكلية بيستنى في الدم أطول لما الـ GFR يقل، فنفس الجرعة اللي كانت مظبوطة على 40 سنة تبقى **جرعة زيادة** على 80. وكل ما الأدوية تكتر، فرصة إن اتنين منهم يتخانقوا (interaction) أو إن الحاج يلخبط بينهم (error) بتزيد. التفسير المقبول (مش في الكتاب) للـ diuretics: الـ thiazides بتقلل الـ K، والـ K الواطي بيقلل إفراز الـ insulin.
