            <text x="72" y="152" text-anchor="middle" class="t-sm">anti-Ro / La</text>
            <path d="M138 110 H170" class="fg-arrow" marker-end="url(#L19p)"/>
            <rect x="174" y="10" width="148" height="200" rx="10" class="fg-bad"/>
            <text x="248" y="34" text-anchor="middle" class="t-sm t-b">Fetus</text>
            <text x="248" y="64" text-anchor="middle" class="t-sm">miscarriage</text>
            <text x="248" y="92" text-anchor="middle" class="t-sm">stillbirth</text>
            <text x="248" y="120" text-anchor="middle" class="t-sm">premature delivery</text>
            <text x="248" y="148" text-anchor="middle" class="t-sm">IUGR</text>
            <text x="248" y="176" text-anchor="middle" class="t-sm">heart block</text>
            <rect x="8" y="226" width="314" height="60" rx="10" class="fg-box"/>
            <text x="165" y="250" text-anchor="middle" class="t-sm t-b">LN + aPL: pre-eclampsia risk</text>
            <text x="165" y="272" text-anchor="middle" class="t-sm t-mut">monitor more closely</text>
          </svg>
      - kind: sort
        page: 324
        quote: "These conditions are associated with:\n  An increase in the risk of miscarriage, still birth, premature delivery, intrauterine growth restriction and fetal congenital heart block.\n  Prednisolone, azathioprine, hydroxychloroquine and low-dose aspirin may be used in lupus pregnancies.\n  At present, evidence suggests that mycophenolate mofetil, cyclophosphamide and methotrexate must be avoided."
        prompt: "الدوا ده في الحمل: ينفع ولا ممنوع؟"
        bins: ["May be used", "Must be avoided"]
        cards:
          - { text: "Prednisolone", bin: 0 }
          - { text: "Azathioprine", bin: 0 }
          - { text: "Hydroxychloroquine", bin: 0 }
          - { text: "Low-dose aspirin", bin: 0 }
          - { text: "Mycophenolate mofetil", bin: 1 }
          - { text: "Cyclophosphamide", bin: 1 }
          - { text: "Methotrexate", bin: 1 }
        why: "المسموح: **pred، AZA، hydroxychloroquine (HCQ)، aspirin**. الممنوع: **mycophenolate mofetil (MMF)، CYC، MTX** (كلهم teratogenic). خليها: «الـ M والـ C بره الحمل»."
      - kind: reveal
        page: 324
        quote: "At present, evidence suggests that mycophenolate mofetil, cyclophosphamide and methotrexate must be avoided."
        prompt: "عيانة lupus nephritis مستقرة على mycophenolate وعايزة تحمل. تعمل إيه وليه؟"
        answer: |
          الـ **MMF** من التلاتة اللي الكتاب بيقول ==must be avoided== في الحمل (MMF، cyclophosphamide، methotrexate). يعني لازم يتغيّر **قبل** الحمل لدوا من المسموحين: **azathioprine** (مع **prednisolone** و **hydroxychloroquine** لو محتاجة).

          ليه مانوقفش العلاج خالص؟ لأن الكتاب بيقول إن الحمل ممكن يزوّد نشاط المرض، والـ LN بالذات بيزوّد risk الـ pre-eclampsia. فالهدف: تحمل وهي مستقرة، على دوا آمن.

          التفسير المقبول (مش في الكتاب): التلاتة الممنوعين teratogenic، وعادة بيتوقفوا قبل الحمل بفترة كافية.
      - kind: table
        page: 324
        quote: "Treatment of non-renal SLE. Top-to bottom sequence does not imply order of preference (eg, MTX, AZA and MMF are equal options for second-line therapy in mild disease or first-line therapy in moderate disease). *Mild disease: constitutional symptoms; mild arthritis; rash ≤9% body surface area; PLT 50– 100 × 109/L; SLEDAI ≤6; BILAG C or ≤1 BILAG B manifestation. *Moderate disease: moderate-severe arthritis 'RA-like'; rash 9%-18% BSA; PLTs 20-50×109/L; serositis; SLEDAI 7–12; ≥2 BILAG B manifestations. *Severe disease: major organ threatening disease (cerebritis, myelitis, pneumonitis, mesenteric vasculitis); thrombocytopenia with PLTs <20 × 109/L;TTP-like disease or acute hemophagocytic syndrome; rash>18% BSA; SLEDAI >12; ≥1 BILAG A manifestations. †Recommendation of belimumab and anifrolumab as first-line therapy in severe disease refers to cases of extra renal SLE with non-major organ involvement, but extensive disease from skin, joints, and so on. The use of anifrolumab as add-on therapy in severe disease refers mainly to severe skin disease. For patients with severe neuropsychiatric disease, anifrolumab and belimumab are not recommended."
        title: "شدة الـ non-renal SLE"
        columns: [Feature, Mild, Moderate]
        rows:
          - ["Rash BSA", "≤9%", "9–18%"]
          - ["Platelets", "50–100", "20–50"]
          - ["SLEDAI", "≤6", "7–12"]
          - ["BILAG", "C or ≤1 B", "≥2 B"]
        hide: [[0, 1], [1, 2], [2, 1], [2, 2]]
      - kind: explain
        page: 324
        title: "الـ severe والأدوية"
        quote: "Treatment of non-renal SLE. Top-to bottom sequence does not imply order of preference (eg, MTX, AZA and MMF are equal options for second-line therapy in mild disease or first-line therapy in moderate disease). *Mild disease: constitutional symptoms; mild arthritis; rash ≤9% body surface area; PLT 50– 100 × 109/L; SLEDAI ≤6; BILAG C or ≤1 BILAG B manifestation. *Moderate disease: moderate-severe arthritis 'RA-like'; rash 9%-18% BSA; PLTs 20-50×109/L; serositis; SLEDAI 7–12; ≥2 BILAG B manifestations. *Severe disease: major organ threatening disease (cerebritis, myelitis, pneumonitis, mesenteric vasculitis); thrombocytopenia with PLTs <20 × 109/L;TTP-like disease or acute hemophagocytic syndrome; rash>18% BSA; SLEDAI >12; ≥1 BILAG A manifestations. †Recommendation of belimumab and anifrolumab as first-line therapy in severe disease refers to cases of extra renal SLE with non-major organ involvement, but extensive disease from skin, joints, and so on. The use of anifrolumab as add-on therapy in severe disease refers mainly to severe skin disease. For patients with severe neuropsychiatric disease, anifrolumab and belimumab are not recommended."
        text: |
          **Severe** لو فيه واحدة من دول:
          - **Major organ threat:** cerebritis، myelitis، pneumonitis، mesenteric vasculitis
          - **Platelets < 20**، أو **TTP-like** أو **hemophagocytic** syndrome
          - **Rash > 18%** أو **SLE Disease Activity Index (SLEDAI) > 12** أو **≥1 British Isles Lupus Assessment Group (BILAG) A**

          **الأدوية:**

          - **Methotrexate (MTX)، azathioprine (AZA)، mycophenolate mofetil (MMF)** متساويين: second-line في الـ mild، first-line في الـ moderate.
          - **Belimumab و anifrolumab** first-line في الـ severe **extrarenal** من غير major organ (جلد ومفاصل كتير). الـ anifrolumab add-on غالبًا للجلد.
          - في الـ ==severe neuropsychiatric==: **مش recommended**.

          ليه التدرج ده؟ لأن العلاج على قد الخطر: الـ mild ممكن يكفيه أدوية أخف، والـ severe اللي بيهدد عضو محتاج علاج أقوى بسرعة. والـ biologics مش recommended في الـ severe neuropsychiatric والكتاب بيستثني الحالة دي صراحة.
