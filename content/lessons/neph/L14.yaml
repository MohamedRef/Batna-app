        quote: "Adverse effects of eculizumab are infection by encapsulated organisms such as S pneumoniae and Haemophilus influenzae, and all patients should be given appropriate vaccines and monitored"
        text: |
          - الـ eculizumab بيقفل الـ C5، فالجسم بيضعف قدام الـ ==encapsulated organisms== زي **S. pneumoniae** و **Haemophilus influenzae**.
          - عشان كده **كل** العيانين ياخدوا الـ ==vaccines== المناسبة ويتابَعوا.
