  # ---------- p247: reverse cholesterol transport ----------
  - id: dm.L19.019
    kind: order
    topic: rct
    prompt: Order reverse cholesterol transport as numbered in the book's figure.
    steps:
      - ABCA1 moves free cholesterol and phospholipid from the macrophage to ApoA-I
      - Nascent HDL forms
      - LCAT esterifies cholesterol, giving HDL3
      - LCAT continues, giving the larger HDL2
      - SCARB1 on the hepatocyte takes up cholesteryl ester
    src: { page: 247, quote: "Reverse cholesterol transfer" }
    status: unverified
    tags: [high-yield]
  - id: dm.L19.020
    kind: table
    topic: rct
    title: Players in reverse cholesterol transport
    columns: [Job, Player]
    rows:
      - ["Hands macrophage free cholesterol and phospholipid to ApoA-I (nascent HDL)", ABCA1]
      - [Hand macrophage cholesterol to mature HDL, "ABCG1, ABCG4"]
      - ["Esterifies cholesterol: nascent HDL to HDL3 to HDL2", LCAT]
      - [Hepatocyte receptor that takes up HDL cholesteryl ester, SCARB1]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 247, quote: "Reverse cholesterol transfer" }
    status: unverified
  - id: dm.L19.021
    kind: mcq
    topic: rct
    stem: "In reverse cholesterol transport, which enzyme converts free cholesterol on nascent HDL into cholesteryl ester, so the particle matures into HDL3 and HDL2?"
    options: [LCAT, Lipoprotein lipase, ABCA1, SCARB1]
    answer: 0
    why:
      - "Correct: LCAT (steps 4 and 5 in the figure) esterifies cholesterol and matures HDL."
      - "LPL hydrolyses triglyceride in chylomicrons and VLDL."
      - "ABCA1 is a transporter that hands free cholesterol to ApoA-I; it is not an enzyme that esterifies."
      - "SCARB1 is the hepatocyte receptor at the end of the pathway."
    src: { page: 247, quote: "Reverse cholesterol transfer" }
    status: unverified
