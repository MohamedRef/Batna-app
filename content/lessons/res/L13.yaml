        quote: "Discussion\nConclusion\nGood discussion should be structured to include the following six components:\n1. Statement of principal findings:\nThe opening of the discussion usually gives the answer to the research question. This should not normally be more than a few sentences. It is advisable that the discussion start with a sentence that clearly shows that the paper includes new information. Reviewers often start with a \"null hypothesis\" that the paper does not add anything new."
        title: "الست مكونات"
