    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L01.009
    kind: mcq
    topic: ontogeny
    stem: A 25-year-old needs a bone marrow aspirate. Which site still holds active red marrow at his age, according to the book?
    options:
      - Posterior iliac crest (axial skeleton)
      - Distal shaft of the femur
      - Distal radius
      - Tibial shaft
      - Bones of the feet
    answer: 0
    why:
      - "Correct: after 18 years active haematopoiesis is confined to the axial skeleton and the proximal femur and humerus (p1)."
      - Only the proximal ends of the femoral shaft stay active; the distal shaft is yellow fatty marrow.
      - The forearm bones are not in the axial skeleton; their marrow is fatty in adults.
      - The tibia is peripheral; its cavity is yellow fatty marrow by 18 years.
      - The feet are peripheral; fatty marrow by adulthood.
    src: { page: 1, quote: "By the age of 18 years, the only sites of active hematopoiesis are the axial skeleton" }
    status: unverified
