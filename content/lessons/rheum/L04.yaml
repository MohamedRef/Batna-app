            <text x="14" y="202" class="t-sm">rituximab (B cells) · eculizumab (complement)</text>
          </svg>
      - kind: case
        page: 72
        quote: "Key Features\n  Involves ≥3 organ systems within a short time (usually days).\n  Evidence of small-vessel thrombosis.\n  High mortality if untreated."
        stem: "34-year-old woman with APS stopped warfarin 10 days ago for a tooth extraction. In 3 days: confusion, rising creatinine, bilateral lung infiltrates. Platelets 52."
        steps:
          - question: "Most likely diagnosis?"
            options: ["Catastrophic APS", "Septic shock", "Lupus nephritis flare", "Simple recurrent DVT"]
            answer: 0
            why: "تلات organs في أيام، مخ وكلية ورئة، مع trigger كلاسيكي هو **withdrawal of anticoagulation** = **CAPS**."
          - question: "Treatment?"
            options: ["Anticoagulation + high-dose steroids + PLEX/IVIG", "Restart warfarin alone", "Rituximab alone", "Low-dose aspirin"]
            answer: 0
            why: "الـ CAPS عايز **triple therapy** سريع. الـ rituximab للـ refractory بس، والـ warfarin لوحده أو الـ aspirin مش كفاية."
      - kind: explain
        page: 73
        title: "الـ work-up"
        quote: "Coagulation tests (e.g., aPTT, dRVVT for LA)."
        text: |
          - **History**: جلطات أو pregnancy loss، و **family history** لـ autoimmune أو clotting disorders.
          - **Exam**: ==livedo reticularis==، cardiac murmurs، neurological deficits.
          - **Labs**: **activated partial thromboplastin time (aPTT), Dilute Russell viper venom time (dRVVT)** للـ lupus anticoagulant (LA)؛ **enzyme-linked immunosorbent assay (ELISA)** للـ aCL و anti-β2GPI، الاتنين Immunoglobulin G (IgG) و Immunoglobulin M (IgM)؛ **re-test بعد 12 weeks**.
          - **Systemic lupus erythematosus (SLE) screen** بالـ antinuclear antibodies (ANA) و anti-dsDNA، خصوصًا الصغيرين أو اللي عندهم systemic symptoms.

          التفسير المقبول (مش في الكتاب): ليه الـ re-test بعد 12 أسبوع؟ نفس سبب الـ Sapporo criteria: الـ antibody لازم يكون ثابت. وليه الـ SLE screen؟ عشان الـ secondary APS أغلبه مع الـ SLE، ولو موجود العلاج والمتابعة بيتغيروا. والـ livedo reticularis علامة إن الأوعية الصغيرة في الجلد فيها تجلط بطيء، فهو مفتاح في الفحص.
      - kind: explain
        page: 73
        quote: "Additional screening for SLE (ANA, anti-dsDNA), especially in younger patients or those with systemic symptoms."
        title: "ليه SLE screen، وليه نعيد بعد 12 أسبوع؟"
        text: |
          - **SLE screen (ANA و anti-dsDNA)** خصوصًا في **الصغيرين** واللي عندهم **systemic symptoms**: عشان الـ SLE أشهر سبب للـ ==secondary APS== (صفحة 68)، ولو موجود هيغيّر المتابعة والعلاج كلها (HCQ مثلًا في صفحة 75).
          - **Re-test بعد 12 أسبوع**: عشان الـ aPL ممكن يطلع **transient** مع infection أو حمل (صفحة 71)، والتشخيص محتاج antibody **persistent**.
          - **aPTT و dRVVT للـ LA**: لأن الـ LA اختبار تجلط (functional)، مش ELISA.
      - kind: try
        items: [rheum.L04.031, rheum.L04.032, rheum.L04.034, rheum.L04.036, rheum.L04.038]
    recap:
      - "CAPS: ≥3 organs في أيام + small vessels + high mortality."
      - "Triggers **SWIP**: surgery، withdrawal of anticoagulation، infection، pregnancy؛ كلهم بيزوّدوا التجلط فجأة."
      - "علاج: anticoagulation + steroids + PLEX/IVIG؛ refractory: rituximab أو eculizumab."
      - "Work-up: history و family history، livedo و murmurs و neuro؛ aPTT و dRVVT و ELISA؛ re-test بعد 12 أسبوع؛ SLE screen في الصغيرين."
    practice: [rheum.L04.031, rheum.L04.032, rheum.L04.033, rheum.L04.034, rheum.L04.035, rheum.L04.036, rheum.L04.037, rheum.L04.038, rheum.L04.039]
