            <text x="247" y="196" text-anchor="middle" class="t-sm">Dense deposit disease</text>
            <text x="247" y="218" text-anchor="middle" class="t-sm">C3 GN</text>
          </svg>
      - kind: explain
        page: 203
        title: "ليه الـ IF هو اللي بيقسم الـ MPGN؟"
        quote: "New classification of membranoproliferative GN Before we proceed, let‘s have a rapid review of the normal histology of the kidney."
        text: |
          الـ ==membranoproliferative== pattern على الـ light microscope شكل واحد، بس وراه أسباب مختلفة خالص. علشان كده الـ **new classification** ما بقتش تقسمه بالشكل (type I و II و III)، وبقت تقسمه بالـ **immunofluorescence**:

          - **IgG + C3** ← ==Ig-mediated==: دوّر على **monoclonal gammopathy** أو **autoimmune disease** أو **infection**.
          - **C3 من غير IgG** ← ==complement-mediated==: ده **C3 glomerulopathy**، ومنه الـ **dense deposit disease (DDD)** والـ **C3 GN (C3GN)**.

          ليه؟ التفسير المقبول (مش في الكتاب): لو فيه Ig، يبقى فيه antibody أو antigen بيعمل complexes، والعلاج إنك تلاقي مصدرهم (العدوى، الـ lupus، الـ clone). لو C3 بس، يبقى الـ complement نفسه شغال من غير فرامل (alternative pathway)، والشغل يبقى على الـ complement. يعني نفس الصورة تحت الميكروسكوب، بس خطة تشخيص وعلاج مختلفة، وده اللي يهم العيان.

          ليه التقسيم الجديد أحسن في العلاج؟ التفسير المقبول (مش في الكتاب): التقسيم القديم بالشكل كان بيحط أمراض أسبابها مختلفة في درج واحد، فالعلاج كان واحد ومش بيشتغل. التقسيم بالـ IF بيوديك على طول للسبب:
          - **Ig + C3**: دوّر على infection (زي hepatitis C)، autoimmune، أو monoclonal protein، وعالج السبب.
          - **C3 بس**: الـ complement نفسه منفلت (C3 glomerulopathy)، فالـ steroids لوحدها مش هتكفي، ودي case 7.
          - **مفيش Ig ولا C3**: ده endothelium متعوّر مزمن (TMA قديمة)، مش immune complex خالص.
      - kind: check
        page: 203
        quote: "New classification of membranoproliferative GN"
        question: "An MPGN pattern on light microscopy; immunofluorescence shows bright C3 with no IgG. Where does it go in the new classification?"
        options:
          - "Complement-mediated (C3 glomerulopathy)"
          - "Ig-mediated, look for infection"
          - "Ig-mediated, look for a monoclonal gammopathy"
          - "Pauci-immune GN"
        answer: 0
        why:
          - "صح: C3 لوحده من غير IgG = complement-mediated، يعني C3 glomerulopathy (DDD أو C3GN)."
          - "الـ infection في فرع الـ **IgG + C3**."
          - "الـ monoclonal gammopathy كمان في فرع الـ IgG + C3."
          - "الـ pauci-immune مش من فروع الـ MPGN، ومفيهوش C3 ساطع."
      - kind: explain
        remind: [neph.L08.017]
        page: 203
        title: "4 compartments"
        quote: "Evaluated tissue compartments\n  Glomeruli\n  Tubules\n  Interstitium\n  Arteries & arterioles"
        text: |
          أي biopsy بيتقرا على أربع حاجات: ==glomeruli==، **tubules**، **interstitium**، و **arteries & arterioles**.

          علشان كده التقرير دايمًا بيقول «Tubules showed… Interstitium showed… Arteries…».

          ليه الأربعة كلهم ولو المرض glomerular؟ التفسير المقبول (مش في الكتاب):
          - الـ **tubules والـ interstitium** هما اللي بيتنبأوا بالـ creatinine على المدى البعيد: الـ IFTA (interstitial fibrosis and tubular atrophy) نسبة ندبة مش هترجع، عشان كده الكتاب بيكتب نسبتها في كل case (30% و 35%).
          - الـ **arteries والـ arterioles** بيقولوا لو فيه ضغط أو سكر أو TMA فوق المرض الأصلي (زي الـ hyalinosis في case 10).
          - والـ **glomeruli** بيتعدّوا: كام واحد obsolescent من كام، لأن العدد ده بيقول الـ sample كفاية ولا لأ.
          فلما تقرا أي تقرير في المحاضرة دي، دوّر على الأربع جمل بالترتيب ده.
      - kind: try
        items: [neph.L08.001, neph.L08.004, neph.L08.011, neph.L08.015, neph.L08.017]
    recap:
      - "اقرا الكلينيك، بعدين LM، بعدين IH و EM، وبعدين integrate. وما تشوفش حاجة مش موجودة."
      - "Nephrotic = podocyte أو حاجة مترسبة من غير التهاب؛ nephritic = التهاب بيكسّر الـ capillary أو غشا ضعيف."
      - "خمس أنواع GN: immune-complex، pauci-immune، anti-GBM، monoclonal Ig، C3."
      - "الـ MPGN الجديد بيتقسم بالـ IF: IgG + C3 = Ig-mediated، C3 بس = complement-mediated."
      - "4 compartments: glomeruli، tubules، interstitium، arteries."
