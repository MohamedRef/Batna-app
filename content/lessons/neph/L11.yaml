        title: "سلسلة الكرياتينين الواطي"
        alt: "Four stacked boxes joined by arrows: blood volume and cardiac output up with systemic vascular resistance down; intrarenal vasodilation with higher renal plasma flow; GFR up 40 to 60 percent; serum creatinine down to 0.4 to 0.6 mg/dL. A side note says a creatinine of 0.9 mg/dL may already be AKI in pregnancy."
        caption: "كل خطوة بتسلّم اللي بعدها. علشان كده **أي طلعة صغيرة** في الكرياتينين أثناء الحمل لازم تقلقك."
