        quote: "TABLE 12-1: Functional groups of selected cytokines\n| Cytokine | Secreted by | Targets and effects |\n|---|---|---|\n| SOME CYTOKINES OF INNATE IMMUNITY | | |\n| Interleukin 1 (IL-1) | Monocytes, macrophages, endothelial cells, epithelial cells | Vasculature (inflammation); hypothalamus (fever); liver (induction of acute phase proteins) |\n| Tumor necrosis factor-α (TNF-α) | Macrophages | Vasculature (inflammation); liver (induction of acute phase proteins); loss of muscle, body fat (cachexia); induction of death in many cell types; neutrophil activation |\n| Interleukin 12 (IL-12) | Macrophages, dendritic cells | NK cells; influences adaptive immunity (promotes TH1 subset) |\n| Interleukin 6 (IL-6) | Macrophages, endothelial cells | Liver (induces acute phase proteins); influences adaptive immunity (proliferation and antibody secretion of B cell lineage) |\n| Interferon α (IFN-α) (this is a family of molecules) | Macrophages | Induces an antiviral state in most nucleated cells; increases MHC class I expression; activates NK cells |\n| Interferon β (IFN-β) | Fibroblasts | Induces an antiviral state in most nucleated cells; increases MHC class I expression; activates NK cells |\n| SOME CYTOKINES OF ADAPTIVE IMMUNITY | | |\n| Interleukin 2 (IL-2) | T cells | T-cell proliferation; can promote AICD. NK cell activation and proliferation; B-cell proliferation |\n| Interleukin 4 (IL-4) | TH2 cells, mast cells | Promotes TH2 differentiation; isotype switch to IgE |\n| Interleukin 5 (IL-5) | TH2 cells | Eosinophil activation and generation |\n| Transforming growth factor β (TGF-β) | T cells, macrophages, other cell types | Inhibits T-cell proliferation and effector functions; inhibits B-cell proliferation; promotes isotype switch to IgA; inhibits macrophages |\n| Interferon γ (IFN-γ) | TH1 cells, CD8+ cells, NK cells | Activates macrophages; increases expression MHC class I and class II molecules; increases antigen presentation |"
