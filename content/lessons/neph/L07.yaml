  - id: neph.L07.lesson5
    title: "Tuberous sclerosis: الـ hamartomas في كل حتة"
    hook: "صرع، وش فيه angiofibromas، وكلية فيها دهون بتنزف. وأكتر حاجة بتموّت عيان TSC هي الكلية."
    minutes: 9
    pages: [169, 176]
    topics: [tsc]
    goals:
      - "تعرف جينات الـ TSC وعلاقتها بالـ PKD1"
      - "تعرف الـ AML والـ cysts والـ RCC وإمتى نتدخل"
      - "تطبّق الـ major و minor criteria"
    status: unverified
    steps:
      - kind: explain
        page: 169
        title: "TSC: tumor suppressor وقع"
        quote: "TSC1 on chromosome 9q32-q34 and TSC2 on chromosome 16p13, adjacent to the PKD1 gene"
        text: |
          الـ ==TSC== **autosomal dominant tumor-suppressor syndrome**: **hamartomas** في الكلى والمخ والقلب والرئة والجلد.

          - **TSC1** على 9q32–q34، **TSC2** على 16p13 ==جنب الـ PKD1==.
          - لو deletion كبيرة شالت الـ TSC2 والـ PKD1 مع بعض: **PKDTS** (polycystic kidney شديد في الرضّع + TSC).
          - حوالي **70% sporadic**. في الـ sporadic الـ TSC2 أشهر **5 مرات**، والـ TSC1 أخف (second hits أقل).
      - kind: explain
        page: 170
        title: "الصورة الإكلينيكية"
        quote: "In affected individuals over 5 years of age, the most common skin lesions are facial angiofibromas"
        text: |
          الأشهر: **seizures**، intellectual disability أو autism، جلد، **interstitial lung disease**، و tumors في المخ والشبكية والكلية والقلب.

          الجلد بعد 5 سنين: ==facial angiofibromas==، **hypomelanotic macules** (ash leaf)، **ungual fibromas**، و **shagreen patch**.
      - kind: explain
        page: 171
        title: "الكلية: AML ثم cysts ثم RCC"
        quote: "angiomyolipomas (AMLs; 85%), cysts (30% to 47%), and renal cell carcinoma (RCC) (2% to 3%)"
        text: |
          - ==AML 85%==، **cysts 30–47%**، **RCC 2–3%**.
          - ==Renal complications أشهر سبب وفاة في الـ TSC==: retroperitoneal hemorrhage و renal impairment.
          - الـ AML = **vessels سميكة + smooth muscle + دهون** (hamartoma). في الـ TSC: **multiple و bilateral**، نادرة قبل 5 سنين، و **80% عند 10 سنين**. الستات أكتر وأكبر، والـ **حمل** بيزوّد الـ rupture.
          - **Cysts + AMLs مع بعض على الـ CT** = فكّر TSC.
      - kind: mnemonic
        page: 171
        quote: "Renal complications are the most frequent cause of death in TSC."
        word: "ACR"
        parts:
          - { key: "A", text: "AML 85% (bleeds)" }
          - { key: "C", text: "Cysts 30–47%" }
          - { key: "R", text: "RCC 2–3%" }
        hook: "**ACR** بالترتيب من الأشهر للأندر. والـ RCC في الـ TSC: ستات، أصغر سنًا، مع AML، multiple، و **بطيء** (papillary أشهر)."
      - kind: table
        page: 174
        quote: "Two major features or one major feature with two minor features indicate definite TSC"
        title: "التشخيص بالـ criteria"
        columns: [Diagnosis, Features needed]
        rows:
          - ["Definite TSC", "2 major, or 1 major + 2 minor"]
          - ["Probable TSC", "1 major + 1 minor"]
          - ["Possible TSC", "1 major, or 2 minor"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: sort
        page: 174
        quote: "Two major features or one major feature with two minor features indicate definite TSC"
        prompt: "Major ولا minor في Box 45.1؟"
        bins: ["Major", "Minor"]
        cards:
          - { text: "Facial angiofibromas", bin: 0 }
          - { text: "Renal angiomyolipoma", bin: 0 }
          - { text: "Cardiac rhabdomyoma", bin: 0 }
          - { text: "Shagreen patch", bin: 0 }
