  - id: git.L05.lesson4
    title: "إزاي ما نفوّتش بوليب، وإزاي نشيله"
    hook: "البوليب بيستخبى ورا الـ folds. كاب بأذرع، منظار بيبص لورا، وبعدين: snare بارد ولا سخن؟"
    minutes: 7
    pages: [197, 199]
    topics: [detection, polypectomy]
    goals:
      - "تعرف يعني إيه adenoma detection rate وليه مهم"
      - "تعرف الأجهزة اللي بتشوف ورا الـ folds"
      - "تعدّ طرق الـ polypectomy وتفرّق hot من cold"
    status: unverified
    steps:
      - kind: explain
        page: 197
        quote: "Improving polyp/Adenoma Detection Rates (ADR) The ENDOCUFF and ENDOCUFF VISION are devices that attach to the distal end of a colonoscope, with multiple flexible \"arms\" which opens up the field of view by holding back colonic folds during colonoscope withdrawal."
        title: "إزاي ما نفوّتش بوليب"
        text: |
          البوليبات بتستخبى ورا الـ folds. عشان نرفع الـ ==adenoma detection rate==:

          - **ENDOCUFF / ENDOCUFF VISION**: cap فيه arms بتمسك الـ **colonic folds** وانت بتسحب.
          - **RetroView** (PENTAX): منظار رفيع بـ short turn radius وزاوية 210 درجة يشوف ورا الـ folds.
          - **Third Eye**: retrograde view يلاقي ويشيل البوليب المستخبي.
      - kind: reveal
        page: 197
        quote: "Improving polyp/Adenoma Detection Rates (ADR)"
        prompt: "ليه الـ adenoma detection rate هو الرقم اللي بيتقاس بيه دكتور المناظير؟"
        answer: |
          الكتاب بيفتح الجزء ده بـ ==improving polyp/adenoma detection rates==، وبعدين الأجهزة اللي بتساعد.

          التفسير المقبول (مش في الكتاب): الـ adenoma detection rate هو نسبة المناظير اللي الدكتور بيلاقي فيها adenoma واحد على الأقل. الهدف من الـ colonoscopy إنها تشيل البوليب قبل ما يبقى سرطان، فلو الدكتور بيفوّت بوليبات، المريض بيطلع مطمّن وممكن يجيله سرطان قبل المنظار الجاي (interval cancer). يعني كل ما الرقم ده يعلى، حماية المريض بتزيد.
      - kind: explain
        page: 197
        quote: "field of view by holding back colonic folds during colonoscope withdrawal."
        title: "الـ ENDOCUFF: ليه وقت السحب بالذات؟"
        text: |
          الكتاب: الـ **ENDOCUFF** والـ **ENDOCUFF VISION** أجهزة بتتركب على طرف المنظار، فيها ==multiple flexible arms== بتفتح الـ field of view وهي **بتمسك الـ colonic folds** أثناء **سحب** المنظار. والـ **PENTAX RetroView** منظار رفيع بـ **short turn radius**.

          التفسير المقبول (مش في الكتاب): الدكتور بيدخّل المنظار لحد الـ cecum بسرعة، والفحص الحقيقي بيبقى وهو **طالع**. القولون مليان طيات زي الأكورديون، والبوليب الصغير بيقعد ورا الطية في الجانب اللي مش باين. الأذرع بتفرد الطية وانت بتسحب فتكشف اللي وراها.

          يعني الجهاز بيشتغل علشان يحل مشكلة مكان البوليب، مش علشان يكبّر الصورة.
      - kind: figure
        page: 197
        title: "الـ ENDOCUFF"
        image: { file: git/L05-endocuff.webp, book: true }
        alt: "Book drawing of a colonoscope tip fitted with a cap carrying flexible arms that spread out and hold back the colonic folds."
        caption: |
          الـ cap ده بيتركّب على **طرف المنظار**، والـ **arms** بتفرد وتمسك الـ folds وانت بتسحب، فبتشوف ==ورا الطيّات==.
      - kind: explain
        page: 198
        quote: "RetroView features of 210° provides visualization and accessibility of the"
        title: "RetroView و Third Eye: البص لورا"
        text: |
          الكتاب:
          - الـ **RetroView** بيلف ==210 degrees==، فبيشوف ويوصل للـ **proximal side** من الـ colon folds والـ **flexures**.
          - الـ **Third Eye colonoscopy**: بيدّي **backward أو retrograde view**، فبيلاقي ويشيل البوليبات المستخبية **ورا الـ folds**.

          التفسير المقبول (مش في الكتاب): المنظار العادي بيبص لقدام بس، والبوليب اللي ورا الطية بيبقى في «ضهر» المنظار وهو بيدخل وبيطلع. لما تلف المنظار أكتر من 180 درجة، بتبص على الطية من ورا. والـ flexures (الـ hepatic والـ splenic) هي أصعب أماكن لأن القولون بيلف فيها جامد.
      - kind: figure
        page: 198
        title: "الـ RetroView: 210 درجة"
        image: { file: git/L05-retroview.webp, book: true }
        alt: "Book drawing of a colonoscope tip bending back on itself, with dotted lines comparing a 180 degree bend with the 210 degree bend of the RetroView scope."
        caption: |
          المنظار العادي بيلف لحد **180°**. الـ RetroView بيلف ==210°==، فبيبص على ضهر الطيّة.
      - kind: figure
        page: 198
        title: "الـ Third Eye"
        image: { file: git/L05-third-eye.webp, book: true }
        alt: "Book drawing of a small device passed through the colonoscope that bends back on itself to look behind a fold, where a polyp is hidden."
        caption: |
          جهاز صغير بيطلع من قناة المنظار ويلف **لورا**، فبيشوف البوليب ==المستخبي ورا الطيّة== اللي المنظار مش شايفه.
      - kind: explain
        remind: [git.L05.052]
        page: 199
        quote: "Hot‖ refers to techniques using the electrosurgery generator unit (ESU) and ―cold‖ means without use of the ESU."
        title: "طرق الـ polypectomy"
        text: |
          - Cold و hot **forceps**.
          - Cold و hot **snare**.
          - **EMR** (endoscopic mucosal resection).
          - **ESD** (endoscopic submucosal dissection).

          ==Hot== = بالـ **electrosurgery generator unit (ESU)**، و cold = من غيره.

          التفسير المقبول (مش في الكتاب): ليه طرق كتير؟ لأن كل طريقة على مقاس حجم وشكل: الـ forceps للحاجات الصغيرة جدًا، والـ snare للأكبر، والـ EMR والـ ESD للكبير المسطح اللي محتاج يترفع ويتشال حتة واحدة.
      - kind: figure
        page: 199
        title: "أشكال الـ snare"
        image: { file: git/L05-snares.webp, book: true }
        alt: "Book drawing of polypectomy snare loops: oval, hexagonal, duckbill, crescent, and a 360 degree rotatable snare on its handle."
        caption: |
          الـ snare سلك على شكل **عروة** بتلفّها حوالين البوليب وتقفلها. أشكالها: **oval**، **hexagonal**، **duckbill**، **crescent**، و ==rotatable 360°== علشان تلفّها على مقاس البوليب.
      - kind: reveal
        page: 199
        quote: "and ―cold‖ means without use of the ESU."
        prompt: "ليه الـ cold snare بقى المفضّل للبوليب الصغير؟"
        answer: |
          الكتاب: الـ **hot** معناه ==باستخدام الـ electrosurgery generator unit (ESU)==، والـ **cold** من غيره. والطرق: cold و hot forceps، cold و hot snare، EMR، و ESD.

          التفسير المقبول (مش في الكتاب): الكهربا بتكوي الأوعية فتمنع النزيف، بس الحرارة بتوصل لطبقات أعمق في الحيطة الرفيعة بتاعة القولون، وممكن تعمل حرق عميق أو خرم بعد أيام. البوليب الصغير أوعيته صغيرة ونزيفه بسيط، فالـ cold أأمن. ولما البوليب يكبر، النزيف يبقى أهم، فالـ hot يرجع، ومعاه حقن تحت البوليب علشان يبعد الحرارة عن العضلة (هتشوفه في الـ ESGE).
      - kind: check
        page: 199
        quote: "Hot snare polypectomy"
        question: "Which of these polypectomy methods uses the electrosurgery generator unit?"
        options: ["Hot snare polypectomy", "Cold snare polypectomy", "Cold forceps polypectomy", "None of the listed methods"]
        answer: 0
        why:
          - "صح: الكتاب: hot refers to techniques using the ESU."
          - "Cold يعني من غير الـ ESU."
          - "Cold forceps برضه من غير الـ ESU."
          - "الـ hot forceps والـ hot snare الاتنين بيستخدموه."
      - kind: try
        items: [git.L05.049, git.L05.050, git.L05.051, git.L05.052, git.L05.053]
    recap:
      - "الـ adenoma detection rate = نسبة المناظير اللي فيها adenoma؛ كل ما يعلى، الـ interval cancer يقل."
      - "ENDOCUFF: أذرع بتمسك الـ folds وقت السحب؛ RetroView 210 درجة للـ proximal side والـ flexures؛ Third Eye: retrograde view."
      - "Polypectomy: cold و hot forceps، cold و hot snare، EMR، ESD؛ hot = ESU، cold = من غيره."
    practice: [git.L05.049, git.L05.050, git.L05.051, git.L05.052, git.L05.053]
