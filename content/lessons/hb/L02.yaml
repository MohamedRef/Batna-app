          - **صف Fibrosis**: Mild، **Sign** (يعني significant)، Severe، Cirrhosis.

          لاحظ إن خانة الـ ==F4== هي أعرض خانة: من 12.5 لحد 75. يعني الـ cirrhosis نفسها مدى واسع، وعلشان كده أرقام زي 20 و 25 kPa بتتستخدم بعدين للـ portal hypertension مش للتليف. والمسطرة دي هي اللي بتربط درجات الـ Metavir اللي جاية بالـ kPa.
      - kind: explain
        page: 28
        quote: "Metavir: *Common for biopsy results*. Assigns two scores\n1. Activity or prediction of progression:\n  A0: no activity\n  A1: mild activity\n  A2: moderate activity\n  A3: severe activity\n2. Fibrosis level:\n  F0: no fibrosis\n  F1: portal fibrosis without septa\n  F2: portal fibrosis with infrequent septa\n  F3: numerous septa but no cirrhosis\n  F4: cirrhosis\nLast stage before cirrhosis: A3F3"
        title: "Metavir: درجتين مش درجة"
        text: |
          الـ ==Metavir== هو الأشهر في تقارير الـ biopsy، وبيدّي درجتين منفصلين:

          **1. Activity (A)**: الالتهاب دلوقتي، وبيتوقع الـ progression.
          - **A0**: no activity
          - **A1**: mild
          - **A2**: moderate
          - **A3**: severe

          **2. Fibrosis (F)**: الندبة اللي اتعملت لحد دلوقتي.
          - **F0**: no fibrosis
          - **F1**: portal fibrosis without septa
          - **F2**: portal fibrosis with infrequent septa
          - **F3**: numerous septa but no cirrhosis
          - **F4**: cirrhosis

          فكّر فيها كده: الـ A هي سرعة العربية، والـ F هي المسافة اللي قطعتها. واحد ممكن يكون F1 بس A3 (ماشي بسرعة)، وهيوصل الـ cirrhosis أسرع.

          والكتاب بيقول: آخر محطة قبل الـ cirrhosis هي A3F3. افهمها صح: الـ A مش stage، هي النشاط. اللي قبل الـ F4 فعلًا هو الـ F3، والكتاب حاطط معاه أعلى activity.
      - kind: figure
        page: 28
        quote: "Metavir: *Common for biopsy results*. Assigns two scores\n1. Activity or prediction of progression:\n  A0: no activity\n  A1: mild activity\n  A2: moderate activity\n  A3: severe activity\n2. Fibrosis level:\n  F0: no fibrosis\n  F1: portal fibrosis without septa\n  F2: portal fibrosis with infrequent septa\n  F3: numerous septa but no cirrhosis\n  F4: cirrhosis\nLast stage before cirrhosis: A3F3"
        title: "الـ Metavir في الكتاب"
        image: { file: hb/L02-metavir.webp, book: true }
        alt: "Book infographic: a cartoon doctor in a white coat beside test tubes, above a green band reading 'Metavir: Common for biopsy results, assigns two scores'. Below, a list: 1. Activity or prediction of progression, A0 no activity to A3 severe activity. 2. Fibrosis level, F0 no fibrosis, F1 portal fibrosis without septa, F2 portal fibrosis with infrequent septa, F3 numerous septa but no cirrhosis, F4 cirrhosis. At the bottom: last stage before cirrhosis, A3F3."
        caption: |
          دي الصورة اللي الكتاب جايب منها الـ Metavir كله، من فوق لتحت:

          - **فوق**: دكتور كرتون، وتحته الشريط الأخضر: **Common for biopsy results** و **Assigns two scores**. يعني ده score لتقرير الـ biopsy، مش للـ elastography.
          - **القايمة 1**: ==Activity== من **A0** (no activity) لـ **A3** (severe activity).
          - **القايمة 2**: ==Fibrosis level== من **F0** لـ **F4**، والفرق بين كل درجة واللي بعدها هو الـ septa.
          - **آخر سطر تحت**: **Last stage before cirrhosis: A3F3**.

          الصورة بتثبت النقطة اللي فوق: رقمين منفصلين في تقرير واحد. وآخر سطر هو أكتر سطر بيتسأل عليه، فاقراه ==F3 مع أعلى activity==.
