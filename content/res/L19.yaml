  back: 'Treated event rate Y = a/(a + b); control event rate X = c/(c + d). ARR = X − Y (control minus treatment). NNT =
    1/ARR: the number of patients who must be treated over a given period of time to prevent one adverse outcome.'
  src:
    page: 98
    quote: |-
      Absolute Risk Reduction (ARR) is the difference in risk between the control group (X) and the treatment group (Y).
      ARR = X - Y
      Number Needed to Treat (NNT) is the number of patients that must be treated over a given period of time to prevent one adverse outcome.
      NNT = 1 / ARR
  status: unverified
  tags: [high-yield]
- id: res.L19.092
  kind: card
  topic: appraise
  front: How do you calculate NNT and NNH from a percentage and from a proportion?
  back: NNT = 100 ÷ ARR expressed as a percentage, or 1 ÷ ARR expressed as a proportion. NNH = 100 ÷ ARI as a percentage,
    or 1 ÷ ARI as a proportion.
  src:
    page: 99
    quote: |-
      Number needed to treat: the number of patients who would have to receive the treatment for 1 of them to benefit; calculated as 100 divided by the absolute risk reduction expressed as a percentage (or 1 divided by the absolute risk reduction expressed as a proportion
      Number needed to harm: the number of patients who would have to receive the treatment for 1 of them to experience an adverse effect; calculated as 100 divided by the absolute risk increase expressed as a percentage (or 1 divided by the absolute risk increase expressed as a proportion)
