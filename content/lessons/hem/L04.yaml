schema: batna.lesson/v1
lecture: hem.L04
lessons:
  # ------------------------------------------------------------------
  - id: hem.L04.lesson1
    title: "الأنبوبة بعد الـ centrifuge: الدم من جوه"
    hook: "لف الأنبوبة شوية في الـ centrifuge، وهتشوف الدم كله في تلات طبقات. وكل اللي فيها طالع من مصنع واحد."
    minutes: 9
    pages: [57, 62]
    topics: [blood, hematopoiesis]
    goals:
      - "تفرّق بين الـ plasma والـ serum والـ buffy coat وتعرف ليه كل طبقة في مكانها"
      - "تعرف شجرة الـ stem cells: مين myeloid ومين lymphoid، ويعني إيه committed"
      - "تحفظ أرقام الـ CBC والـ differential الطبيعية"
    status: unverified
    steps:
      - kind: explain
        remind: [hem.L04.004]
        page: 57
        title: "الدم نسيج"
        quote: "Composition of blood\n  Specialized connective tissue\n  Blood cells (formed elements) suspended in plasma\n  Blood volume: 5-6 liters (approx 1.5 gal) in males and 4-5 liters in females"
        text: |
          الدم ==specialized connective tissue==: خلايا (**formed elements**) عايمة في **plasma**.

          - الحجم: **5–6 L** في الرجالة و **4–5 L** في الستات.
          - الـ **hematocrit** = نسبة الـ red blood cells (RBCs) من حجم الدم: متوسط **47** في الرجالة و **42** في الستات.
          - الـ plasma مية وأيونات وتلات بروتينات مهمة: **albumin** و **globulins** و **fibrinogen**.

          ليه الدم "نسيج" مش سايل وخلاص؟ لأنه زي أي connective tissue: خلايا جوّه **matrix**، بس الـ matrix هنا سايلة (الـ plasma). وليه الـ hematocrit في الراجل أعلى؟ التفسير المقبول (مش في الكتاب): الـ testosterone بيزق النخاع يعمل كرات أكتر. ودور البروتينات التلاتة، التفسير المقبول (مش في الكتاب) برضه: الـ albumin بيمسك الميه جوّه الأوعية، الـ globulins فيها الـ antibodies، والـ fibrinogen للتجلط.
      - kind: figure
        page: 58
        quote: "Plasma (55% of whole blood) Buffy coat: leukocytes and platelets (<1% of whole blood)"
        title: "رسمة الكتاب ص 58: تلات طبقات بعد الـ centrifuge"
        image: { file: hem/L04-centrifuge.webp, book: true }
        alt: "Book drawing: a spinning centrifuge on the left (step 2, centrifuge), an arrow to a test tube on the right. In the tube: yellow plasma on top, 55% of whole blood; a thin white buffy coat of leukocytes and platelets, under 1%; red erythrocytes at the bottom, 45%. A bracket groups the buffy coat and erythrocytes as formed elements."
        caption: |
          **شمال**: الـ **centrifuge** بيلف الأنبوبة، والسهم بيوديك للأنبوبة بعد اللف. **يمين**: الدم اتفصل تلات طبقات، اقراها من فوق لتحت:

          - **Plasma** (الأصفر فوق): ==55%== من الدم، لأنها الأخف.
          - **Buffy coat** (الخط الأبيض الرفيع): الـ **leukocytes** والـ **platelets**، أقل من 1%.
          - **Erythrocytes** (الأحمر تحت): ==45%==، لأنها الأتقل. النسبة دي هي الـ **hematocrit**.

          والقوس اللي على اليمين بيجمع الـ buffy coat والـ erythrocytes مع بعض تحت اسم ==formed elements==: يعني الخلايا وحتتها، والـ plasma هي اللي هي معلّقة فيها.
      - kind: reveal
        page: 58
        quote: "Serum\n  Blood that is allowed to stand clots\n  Clot is a tangle of the \"formed elements\" (some are not truly cells)\n    RBCs lack nuclei and organelles\n    Platelets are fragments\n    Most cannot divide\n  Clear fluid serum is left = plasma without the clotting factors\n    When spun in centrifuge, buffy coat lies between RBCs and plasma: of leukocytes (white blood cells) and platelets"
        prompt: "ليه الـ serum مفيهاش fibrinogen والـ plasma فيها؟"
        answer: |
          الـ **serum** هي السايل اللي بيفضل بعد ما الدم **يتجلّط**. الجلطة استهلكت الـ fibrinogen والـ clotting factors.

          فالقاعدة: ==serum = plasma without the clotting factors==. علشان كده أنبوبة الـ coagulation profile لازم فيها anticoagulant (citrate)، عايزين plasma مش serum.
      - kind: aside
        tone: analogy
        page: 58
        quote: "Serum\n  Blood that is allowed to stand clots\n  Clot is a tangle of the \"formed elements\" (some are not truly cells)\n    RBCs lack nuclei and organelles\n    Platelets are fragments\n    Most cannot divide\n  Clear fluid serum is left = plasma without the clotting factors\n    When spun in centrifuge, buffy coat lies between RBCs and plasma: of leukocytes (white blood cells) and platelets"
        text: |
          الكتاب بيقول الـ formed elements "some are not truly cells": الـ **RBCs** من غير nucleus ولا organelles، والـ **platelets** مجرد fragments، وأغلبهم **cannot divide**.

          زي موظفين اتعيّنوا بعقد مؤقت: بيشتغلوا وبيموتوا، ومحدش فيهم بيخلّف. اللي بيعوّضهم هو الـ marrow.
      - kind: explain
        remind: [hem.L04.010]
        page: 59
        title: "مصنع واحد: الـ red marrow"
        quote: "Formation of blood cells\n  Occurs mostly in red bone marrow\n  All cells arise from same blood stem cell (pluripotent hematopoietic stem cells)"
        text: |
          الـ **hematopoiesis** بيحصل أساسًا في الـ **red bone marrow**، وكل الخلايا جاية من ==pluripotent hematopoietic stem cell== واحدة.

          ليه الفكرة دي مهمة؟ لأن لو العيب في الـ stem cell نفسها، هتلاقي **كل الخطوط** متأثرة مع بعض (anaemia و leukopenia و thrombocytopenia)، مش خط واحد.

          وفي الكبار فيه كمان **mesenchymal stem cells** بتعمل fat cells و osteoblasts و chondrocytes و fibroblasts و muscle cells.
      - kind: figure
        page: 59
        title: "خلايا الدم: تحت الـ electron microscope وفي الـ smear (ص 59)"
        image: { file: hem/L04-blood-cells.webp, book: true }
        alt: "Book figure in two parts. Top (a): a coloured scanning electron micrograph of red biconcave erythrocytes, round yellow spiky leukocytes and small platelets, each labelled. Bottom: a drawing of a stained blood smear with many pale pink erythrocytes, a clump of platelets at the top left, two neutrophils with lobed nuclei and a lymphocyte with a round dark nucleus at the bottom, and a monocyte with a large folded nucleus at the right."
        caption: |
          نفس الدم بطريقتين، فوق وتحت:

          - **(a) فوق**: صورة **scanning electron microscope** ملوّنة. الأقراص الحمرا المقعّرة هي الـ **erythrocytes**، الكور الصفرا المشوّكة هي الـ ==leukocytes==، والحتت الصغيرة تحت شمال هي الـ **platelets**.
          - **تحت**: رسمة **blood smear** متصبغ زي اللي هتشوفه في المعمل. الكرات الحمرا الوردي من غير نواة كتير جدًا. **فوق شمال** كومة **platelets** صغيرة. **تحت في النص**: اتنين **neutrophils** نواتهم مفصّصة، وجنبهم **lymphocyte** نواته مدورة مالية الخلية. **يمين**: **monocyte** كبير نواته مطوية.

          الصورتين بيقولوا نفس الحاجة: الـ ==erythrocytes== هي الأغلبية الساحقة، والـ WBCs قليلة ومتفرقة، والـ platelets حتت مش خلايا كاملة؛ وكلهم من ==stem cell== واحدة.
      - kind: figure
        page: 60
        title: "النخاع تحت الميكروسكوب (صورة الكتاب ص 60)"
        image: { file: hem/L04-marrow-section.webp, book: true }
        alt: "Book figure: (a) a drawing of a vertebra with spongy bone, the site of marrow, and an arrow into the next panel; (b) a bone marrow section between pink bone trabeculae with fat cells, immature blood cells and blood sinusoids; (c) a higher power view with a megakaryocyte, reticular cells and fibres, immature blood cells outside the sinusoids and erythrocytes inside them."
        caption: |
          الشكل 3 لوحات، من فوق لتحت وكل واحدة بتكبّر اللي قبلها:

          - **(a) Vertebra**: فقرة، وجوّاها **spongy bone**، والفراغات اللي فيه هي **site of marrow**. السهم الرمادي بيدخّلك جوّه المربع الصغير.
          - **(b)**: بين الـ **bone trabeculae** (الوردي الغامق) فيه **fat cells** (الفراغات الفاتحة) و **immature blood cells** (النقط البنفسجي الكتير)، وعلى اليمين **blood sinusoids**.
          - **(c)**: تكبير أكبر. فوق الـ ==megakaryocyte== الكبير اللي بيطلّع الصفايح، وحواليه **reticular cells and fibres**. الـ **immature blood cells** قاعدة **برّه** الـ sinusoids، والـ **erythrocytes** الناضجة تحت **جوّه** الـ sinusoids.

          يعني الخلايا بتكبر برّه الأوعية، ولما تنضج بس بتعدّي جوّه وتطلع للدم: ده ليه الـ ==red bone marrow== هو المصنع.
      - kind: explain
        page: 61
        title: "يعني إيه committed؟"
        quote: "As the cells divide they become committed, that is, they can only become one kind of cell"
        text: |
          الـ blood stem cells نوعين:
          1. **Myeloid stem cell**: منها كل الخلايا **ما عدا الـ lymphocytes**.
          2. **Lymphoid stem cell**: منها الـ lymphocytes.

          ولما الخلايا تتقسم بتبقى ==committed==: يعني تقدر تبقى **نوع واحد بس** من الخلايا. اسمها كمان **colony-forming units (CFUs)**، وبعدها بيحصل الـ **structural differentiation** (الشكل بيتغير).

          ليه الاسم CFU؟ التفسير المقبول (مش في الكتاب): لأنها اتعرفت في المعمل بإن كل خلية منها بتعمل **colony** من نوع واحد. والـ commitment ده بيفسّر ليه مرض ممكن يضرب خط واحد بس: لو العيب حصل بعد ما الخلية اتـ commit، الخط ده بس اللي يتأثر.
      - kind: figure
        page: 61
        quote: "Blood stem cells\n  1. Myeloid stem\n  2. Lymphoid stem cells\nAll except for lymphocytes arise from myeloid stem cells"
        title: "شجرة الـ stem cells"
        alt: "A tree: pluripotent stem cell splits into myeloid and lymphoid stem cells. Myeloid gives erythrocytes, megakaryocytes to platelets, granulocytes (neutrophil, eosinophil, basophil) and monocytes. Lymphoid gives lymphocytes."
        caption: "كله myeloid ما عدا ==lymphocytes==. ولما الخلية تتقسم بتبقى **committed** (CFU): تطلع نوع واحد بس."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L04a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="85" y="10" width="160" height="36" rx="10" class="fg-acc"/>
