        title: "الحمل"
        quote: "approach increases the chance of a successful outcome of a healthy live birth from 30% to 70–80%."
        text: |
          الأم اللي عندها poor obstetric history من APS: ==Low-molecular-weight heparin (LMWH) + low-dose aspirin== empirically. نسبة الـ live birth بتطلع من **30%** لـ **70–80%**.

          وفيه رأي: الـ combination كـ first line للي عندها **placental dysfunction** قبل كده، أما الـ **recurrent first-trimester loss** فـ supportive care الأول، و aspirin أو aspirin/heparin لو الحمل فشل تاني.

          ليه **LMWH** مش warfarin في الحمل؟ التفسير المقبول (مش في الكتاب): الـ warfarin بيعدّي الـ placenta وبيأذي الجنين، أما الـ heparin جزيء كبير مش بيعدّي. والـ aspirin بيقلّل تجمّع الـ platelets في أوعية المشيمة.
