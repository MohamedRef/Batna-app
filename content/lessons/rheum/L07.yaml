        hook: "**OALBID**: ستة بالترتيب بتاع الكتاب. جواب سؤال «biological activities of complement»."
      - kind: explain
        page: 119
        title: "الـ biological activities"
        quote: "It is the coating of a bacterium, with antibody and/or a complement component (an opsonin that leads to enhanced phagocytosis by phagocytic cells). C3b – primary opsonin, also C4b. C3b coats immune complexes or antigen which are quickly taken up and destroyed by phagocytic cells (neutrophils, macrophages). Bound by complement receptors (CR1, CR3, CR4) on phagocytes."
        text: |
          1. **Opsonins**: ==C3b هو الـ primary opsonin==، ومعاه C4b. الـ phagocytes بتمسكه بـ **CR1 و complement receptor 3 (CR3) و complement receptor 4 (CR4)**.
          2. **Anaphylatoxins**: C5a و C3a و C4a بيطلّعوا **histamine** من الـ mast cells والـ basophils ← permeability، وجذب neutrophils، وانقباض smooth muscle.
          3. **Cell lysis**: بالـ **membrane attack complex (MAC)**، آخر مرحلة في التلات طرق.
      - kind: explain
        page: 119
        title: "ليه الـ opsonin بيفرق كده؟"
        quote: "C3b coats immune complexes or antigen which are quickly taken up and destroyed by phagocytic cells"
        text: |
          الـ ==opsonization== = تغطية البكتيريا بـ **antibody** و/أو **complement** فالـ phagocytes تبلعها أحسن. الـ **C3b** هو الـ **primary opsonin**، ومعاه **C4b**.

          الـ C3b بيغطّي الـ immune complexes أو الـ antigen، فبتتبلع **بسرعة** بالـ neutrophils والـ macrophages اللي بتمسكه بـ **CR1 و CR3 و CR4**.

          ليه ده مهم؟ التفسير المقبول (مش في الكتاب): الـ phagocyte ما يعرفش يمسك سطح بكتيريا ناعم لوحده. لما C3b يغطيه بقى فيه **مقابض** بالمئات، ولكل مقبض receptor جاهز. يعني نفس فكرة الـ antibody مع الـ capsule في المحاضرة 6، بس الـ complement بيقدر يعملها من **أول ساعة** قبل ما الـ antibodies تتعمل.
      - kind: explain
        page: 120
        title: "الـ anaphylatoxins: باب مفتوح ونداء"
        quote: "Substances such as C5a, C3a, and C4a capable of releasing histamine from mast cells and basophils."
        text: |
          الـ **C5a و C3a و C4a** بيطلّعوا **histamine** من الـ mast cells والـ basophils. النتيجة حسب الكتاب:
          - **Vascular permeability** بتزيد ← تدخل **phagocytic cells** و **antibodies** للمكان، فالرد على الميكروب يقوى.
          - **Chemotactic for neutrophils**: الـ neutrophils اللي في الدم تمشي لمكان الالتهاب وتدمّر الحاجة الغريبة.
          - **Smooth muscle contraction**.

          ليه اسمها anaphylatoxins؟ لأن نفس الحاجات دي (histamine، أوعية بتسرّب، عضلات بتنقبض) هي صورة الـ **anaphylaxis**. في مكان صغير ده مفيد، بس لو كمية كبيرة اتفرزت في الدم كله تبقى ==reaction resembling anaphylaxis== (ص 106).
      - kind: explain
        page: 120
        title: "الـ complement بيعلّم الـ B cells"
        quote: "Interactions of the complement fragment C3d and CR2 with a microbial antigen enhance the B cell response to the antigen"
        text: |
          - الـ **C3d** اللي لازق في الـ antigen جوه immune complexes بيتاخد بالـ **germinal center dendritic cells** اللي عليها **CR2**، فيبقى **long-lasting deposit of antigen**. ده بيساعد الـ ==memory responses==.
          - والـ B cell نفسها بتستجيب **أسرع** للـ antigen المتغطي **C3d** من الـ antigen العريان، لأن الربط بيزوّد **uptake and processing**.

          التفسير المقبول (مش في الكتاب): الـ C3d زي **ختم "خطر"** على الـ antigen. الـ B cell لما تشوف الـ antigen ومعاه الختم ده، بتعرف إن الـ innate شافه قبلها واتأكد إنه عدو، فتتشجع أكتر. ونفس فكرة الإشارتين اللي اتعلمتها مع الـ T cells.
      - kind: reveal
        page: 119
        quote: "C3b – primary opsonin, also C4b."
        prompt: "الـ C4b كمان opsonin. ليه الكتاب بيسمّي الـ C3b هو الـ primary opsonin؟"
        answer: |
          التفسير المقبول (مش في الكتاب)، من حاجات اتعلمتها في نفس المحاضرة:
          - **C3** أكتر complement protein في البلازما (ص 106)، فالخام موجود بكمية.
          - التلات pathways بيوصلوا له، فأي باب يتفتح بيطلّع C3b.
