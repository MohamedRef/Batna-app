  - id: git.L04.lesson2
    title: "المريء: من الـ dysphagia للـ esophagectomy"
    hook: "مريض مش قادر يبلع. هتعمل إيه الأول، وإمتى تقول عملية وإمتى chemoradiation؟"
    minutes: 10
    pages: [146, 152]
    topics: [eso-clinic, eso-dx, eso-tx]
    goals:
      - "تعرف الصورة الإكلينيكية وليه الـ prognosis وحش"
      - "ترتب الـ staging tools وكل أداة بتعمل إيه"
      - "تعرف قاعدة الـ 5 cm من الـ cricopharyngeus والـ jejunostomy"
    status: unverified
    steps:
      - kind: explain
        page: 146
        quote: "Clinical Features Dysphagia, Odynophagia (severe pain on swallowing) Obstruction progressive weight loss, Anorexia, Fatigue, Weakness, hematemesis, chest pain"
        title: "المريض بييجي إزاي"
        text: |
          - ==Dysphagia== progressive، وبعدها **obstruction**.
          - **Odynophagia**: ألم شديد مع البلع.
          - **Weight loss** و anorexia و fatigue.
          - Hematemesis، chest pain، cough، vomiting، choking، hiccups.
          - وأعراض الـ **metastasis**.
      - kind: reveal
        page: 146
        quote: "By the time symptoms appear, the tumor has usually spread to submucosal lymphatic vessels."
        prompt: "ليه الـ prognosis وحش كده؟"
        answer: "عشان لما الأعراض تظهر يكون الورم غالبًا انتشر في الـ submucosal lymphatic vessels. الـ 5-year survival أقل من 25% (15%) وأغلبهم بيموتوا في أول سنة. بس لو adenocarcinoma لسه في الـ mucosa أو submucosa، الـ survival حوالي 80%."
      - kind: explain
        page: 148
        quote: "HER2 testing is recommended for all patients with esophageal or EGJ cancer at the time of diagnosis if metastatic disease is documented or suspected"
        title: "التحاليل الجزيئية"
        text: |
          في الـ advanced أو metastatic disease بنعمل 3 تحاليل: **HER2**, **MSI**, و**PD-L1**.

          - **HER2**: positivity معناها invasion و nodes أكتر، يعني prognosis أوحش. أكتر في adenocarcinoma (15-30%) من SCC (5-13%)، وأعلى في الـ EGJ من المعدة. الـ ==HER2 testing== لكل مريض metastatic أو suspected عند التشخيص.
          - **MSI-H/dMMR**: الـ FDA وافقت على **pembrolizumab** ليهم في الـ second line، فبنفحصه في كل esophageal/EGJ adenocarcinoma metastatic.
      - kind: figure
        page: 149
        quote: "High-grade dysplasia and carcinoma in situ (CIS)"
        title: "الـ T stage = طبقة طبقة"
        alt: "A ladder of the esophageal wall layers from inside to outside: mucosa (Tis high-grade dysplasia, T1a lamina propria and muscularis mucosae), submucosa (T1b), muscularis propria (T2), adventitia (T3), pleura pericardium diaphragm (T4a), aorta vertebra trachea (T4b). Beside it, N1 1-2 nodes, N2 3-6, N3 7 or more, M1 distant organs."
        caption: "كل ما الورم ينزل طبقة يزيد الـ T. والـ N بالعدد: 1-2، 3-6، 7 أو أكتر."
        svg: |
          <svg viewBox="0 0 330 420" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="20" class="t-b">Esophageal wall (AJCC)</text>
            <rect x="10" y="32" width="240" height="34" rx="4" class="fg-acc"/>
            <text x="18" y="54" class="t-sm">Tis: HGD / carcinoma in situ</text>
            <rect x="10" y="70" width="240" height="34" rx="4" class="fg-acc"/>
            <text x="18" y="92" class="t-sm">T1a: lamina propria, MM</text>
            <rect x="10" y="108" width="240" height="34" rx="4" class="fg-box"/>
            <text x="18" y="130" class="t-sm">T1b: submucosa</text>
            <rect x="10" y="146" width="240" height="34" rx="4" class="fg-box"/>
            <text x="18" y="168" class="t-sm">T2: muscularis propria</text>
            <rect x="10" y="184" width="240" height="34" rx="4" class="fg-box"/>
            <text x="18" y="206" class="t-sm">T3: adventitia</text>
            <rect x="10" y="222" width="240" height="34" rx="4" class="fg-bad"/>
            <text x="18" y="244" class="t-sm">T4a: pleura, pericardium, diaphragm</text>
            <rect x="10" y="260" width="240" height="34" rx="4" class="fg-bad"/>
            <text x="18" y="282" class="t-sm">T4b: aorta, vertebra, trachea</text>
            <text x="262" y="54" class="t-sm t-mut">inside</text>
            <text x="262" y="282" class="t-sm t-mut">outside</text>
            <text x="10" y="325" class="t-b">Nodes and metastasis</text>
            <rect x="10" y="335" width="95" height="34" rx="4" class="fg-good"/>
            <text x="18" y="357" class="t-sm">N1: 1-2</text>
            <rect x="115" y="335" width="95" height="34" rx="4" class="fg-acc"/>
            <text x="123" y="357" class="t-sm">N2: 3-6</text>
            <rect x="220" y="335" width="100" height="34" rx="4" class="fg-bad"/>
            <text x="228" y="357" class="t-sm">N3: 7 or more</text>
            <text x="10" y="395" class="t-sm">M1: retroperitoneal or paraaortic nodes,</text>
            <text x="10" y="411" class="t-sm">lung, liver, bone</text>
          </svg>
      - kind: match
        page: 150
        quote: "EUS: Assess the depth of penetration and LN involvement. Limited by the degree of obstruction."
        prompt: "وصّل كل test بشغلته في الـ esophageal cancer:"
        pairs:
          - ["EGD", "Biopsy, distance from incisors, Barrett's"]
          - ["CT chest and abdomen", "Extension beyond the wall, nodes, visceral metastases"]
          - ["EUS", "Depth of penetration and nodes"]
          - ["PET", "Finds 15-20% of metastases missed by CT and EUS"]
          - ["Barium swallow", "Proximal and distal margins"]
          - ["Bronchoscopy", "Rule out fistula in mid-esophageal lesions"]
        why: "الـ CT للـ staging العام، بس مش reliable لعمق الورم في الحيطة: ده شغل الـ EUS (واللي بيحدّه درجة الـ obstruction). الـ PET قوي في الـ distant metastases وضعيف في الـ local nodes."
      - kind: aside
        tone: trap
        page: 150
        quote: "Compared with EUS, CT is not a reliable tool for evaluation of the extent of tumor in the esophageal wall."
        text: "فخ: CT مش reliable لعمق الورم في جدار المريء، EUS هو اللي بيحدده. والـ PET low accuracy في الـ local nodal disease مقارنة بالـ CT/EUS."
      - kind: explain
        page: 151
        quote: "Esophagectomy should be considered for all medically ﬁt patients with resectable esophageal cancer (.5 cm from cricopharyngeus)."
        title: "قاعدة الـ 5 سنتي"
        text: |
          العلاج بيعتمد على: site، extent، comorbidities، و patient preference.

          - **Esophagectomy** لكل مريض fit والورم resectable وبعيد أكتر من ==5 cm from cricopharyngeus==.
          - **Cervical / cervicothoracic** أقرب من 5 cm؟ **definitive chemoradiation**، مش عملية.
          - من دواعي الجراحة: lower third مع GE junction، والورم أقل من 5 cm، و palliative surgery.
      - kind: reveal
        page: 151
        quote: "A jejunostomy feeding tube is preferred over a gastrostomy feeding tube for preoperative nutritional support"
        prompt: "مريض مش بيبلع وخسران وزن قبل الـ induction therapy. ليه jejunostomy مش gastrostomy؟"
        answer: "لأن المعدة هي اللي هيعملوا منها الـ conduit مكان المريء في العملية. الـ gastrostomy tube ممكن يبوّظ سلامة الـ gastric conduit، فالـ jejunostomy feeding tube هو المفضل."
      - kind: explain
        page: 152
        quote: "Platinum doublet is preferred over single agents Cisplatin plus 5-FU or docetaxel are commonly used combinations"
        title: "Chemo و RT"
        text: |
          - **Chemotherapy** لوحده: مفيش data إنه بيحسّن الـ survival، والقاعدة partial response مش remission.
          - بيتستخدم مع radiation في الـ locally advanced، ولوحده في **stage IV**، وقبل العملية عشان يقلل الـ occult metastases.
          - **Platinum doublet** أفضل من single agent، والأشهر **cisplatin plus 5-FU** أو docetaxel.
          - **Epirubicin + cisplatin + 5-FU**: للـ adenocarcinoma بس.
          - **RT**: radical، pre-op، post-op، concurrent chemoradiation، و**brachytherapy** للـ palliation.
      - kind: case
        page: 151
        quote: "Cervical or cervicothoracic esophageal cancers ,5 cm from the cricopharyngeus should be treated with deﬁnitive chemoradiation."
        stem: "A 57-year-old man has an SCC 3 cm below the cricopharyngeus. CT shows no metastases."
        steps:
          - question: "What is the treatment?"
            options: ["Definitive chemoradiation", "Esophagectomy", "Chemotherapy alone", "Brachytherapy alone"]
            answer: 0
            why: "Cervical cancers less than 5 cm from the cricopharyngeus get definitive chemoradiation."
          - reveal: "His brother has a 3 cm lower-third adenocarcinoma at the GE junction, fit, no metastases."
            question: "And for the brother?"
            options: ["Esophagectomy", "Definitive chemoradiation only", "Chemotherapy alone", "Palliative stent only"]
            answer: 0
            why: "Lower third involving the GE junction, tumor under 5 cm, fit and resectable: surgery."
      - kind: try
        items: [git.L04.028, git.L04.034, git.L04.038, git.L04.051, git.L04.049]
    recap:
      - "Dysphagia progressive + odynophagia + weight loss. الأعراض بتظهر بعد ما الورم وصل للـ submucosal lymphatics."
      - "5-year survival أقل من 25%، بس 80% لو adenocarcinoma في الـ mucosa/submucosa."
      - "HER2 و MSI-H/dMMR لكل metastatic؛ HER2 positive = prognosis أوحش."
      - "CT للانتشار، EUS للعمق والـ nodes، PET للـ distant، bronchoscopy للـ fistula."
      - "أكتر من 5 cm من الـ cricopharyngeus = esophagectomy؛ أقل = definitive chemoradiation. التغذية بـ jejunostomy."
