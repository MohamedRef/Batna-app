  - id: git.L02.lesson2
    title: "نشوف أحسن: صبغة، نور أزرق، وميكروسكوب"
    hook: "الـ early cancer بيستخبى في الـ mucosa. نلوّنه؟ نغيّر النور؟ ولا نعمل biopsy من غير ما نقطع؟"
    minutes: 10
    pages: [48, 55]
    topics: [image-enhancement]
    goals:
      - "تعرف شروط الـ magnifying endoscopy"
      - "تصنّف صبغات الـ chromoendoscopy"
      - "تفرّق بين NBI و FICE و I-Scan و CLE"
    status: unverified
    steps:
      - kind: explain
        page: 48
        quote: "Deep sedation: to avoid patient's movements as focus range is limited (about 1 mm)."
        title: "الـ magnifying endoscopy محتاج إيه؟"
        text: |
          - ==Deep sedation==: لأن الـ **focus range** حوالي **1 mm** بس، وأي حركة بتبوّظ الصورة.
          - **Plastic cap** على طرف المنظار، خصوصًا في الـ lower esophagus، علشان الـ focus يفضل ثابت وقريب.
          - **Dyes**.
          - **Electronic structure enhancement** على أعلى مستوى.

          التمن: الفحص بياخد **3 أضعاف الوقت**. المكسب: تشخيص و biopsies أدق، و mucosal resection ممتاز بعدها.
      - kind: aside
        tone: analogy
        page: 48
        quote: "Deep sedation: to avoid patient's movements as focus range is limited (about 1 mm)."
        text: |
          زي ما تصوّر نملة بعدسة macro: لو إيدك اتهزّت **1 mm** الصورة باظت. علشان كده المريض لازم **deep sedation**، والـ cap بيبقى زي الـ tripod.
      - kind: explain
        page: 49
        quote: "It is recommended that it should be added to conventional upper GI endoscopy in patients at high risk for malignancy."
        title: "الـ chromoendoscopy: نلوّن علشان نشوف"
        text: |
          الـ ==chromoendoscopy== بتستخدم **dyes** علشان الـ lesions تبان، وكمان بتساعد تعمل **histo-pathologic diagnosis** وانت جوه.

          - **سهلة**، **رخيصة**، المريض **بيقبلها**، وبتحسّن اكتشاف الـ **dysplasia**.
          - علشان كده بتتضاف للـ upper GI endoscopy في اللي عندهم **high risk for malignancy**.
          - مع الـ magnification بتوصل لـ **several hundred-fold**.
      - kind: sort
        page: 49
        quote: "Absorptive dyes (methylene blue, toluidine blue, crystal violet, and Lugol's iodine),"
        prompt: "صنّف الصبغة:"
        bins: ["Absorptive", "Contrast", "Reactive"]
        cards:
          - { text: "Methylene blue", bin: 0 }
          - { text: "Toluidine blue", bin: 0 }
          - { text: "Crystal violet", bin: 0 }
          - { text: "Lugol's iodine", bin: 0 }
          - { text: "Indigo carmine", bin: 1 }
          - { text: "Congo red", bin: 2 }
          - { text: "Phenol red", bin: 2 }
        why: "الكتاب: absorptive أربعة (methylene blue، toluidine blue، crystal violet، Lugol)؛ contrast واحدة (**indigo carmine**)؛ reactive اتنين (Congo red، phenol red). افتكر: «**الأحمر بيتفاعل**» (reactive = red)، و**الـ indigo لوحده contrast**."
      - kind: explain
        page: 52
        quote: "Blue light is better absorption by hemoglobin, enabling imaging of superficial capillaries and superficial mucosal patterns."
        title: "الـ NBI: نور من غير صبغة"
        text: |
          - بيستخدم نور **blue و green**، ويوصل لـ **1000-fold** magnification.
          - ليه بيوضّح الـ capillaries؟ لأن ==blue light== بيتمص أكتر بالـ **hemoglobin**، فالأوعية السطحية تبان غامقة على خلفية فاتحة.
          - الـ correlation مع الـ pathology **85.3%**.
          - هو والـ chromoendoscopy **equally effective** في التفريق بين neoplasia و non-neoplasia: **100% sensitivity** و **75% specificity**.
          - أحسن من الـ conventional في **early colorectal cancer**.
      - kind: table
        page: 53
        quote: "I-SCAN does not make use of the contrast created by light of different wave lengths, as does NBI."
        title: "الـ virtual chromoendoscopy: مين بيعمل إيه؟"
        columns: ["Technique", "How", "Remember"]
        rows:
          - ["NBI", "Blue and green light", "Hemoglobin absorbs blue: capillaries"]
          - ["FICE", "Virtual optical filters change wavelength", "Software makes 10 images"]
          - ["I-Scan", "Software modifies each white-light pixel", "No dye, no wavelength contrast"]
          - ["CLE", "Laser with a miniature microscope", "Optical biopsy"]
        hide: [[0, 2], [1, 2], [2, 1], [3, 2]]
      - kind: check
        page: 53
        quote: "FICE creates a contrast difference by changing the wave length of light by means of virtual optical filters and the software creates 10 different images."
        question: "Which technique uses virtual optical filters and creates 10 different images?"
        options:
          - "FICE"
          - "NBI"
          - "I-Scan"
          - "CLE"
        answer: 0
        why:
          - "صح: **FICE** بيغيّر الـ wavelength بـ virtual filters والـ software بيطلّع 10 صور."
          - "الـ NBI بيستخدم blue و green light فعلًا، مش filters في الـ software."
          - "الـ I-Scan **مش** بيعتمد على الـ wavelength خالص."
          - "الـ CLE بيستخدم laser للـ optical biopsy."
      - kind: explain
        page: 54
        quote: "CLE uses a laser rather than white light as a light source."
        title: "الـ CLE: biopsy من غير مقص"
        text: |
          ==Confocal laser endomicroscopy==:
          - **Laser** بدل الـ white light.
          - **Miniature microscope** على طرف المنظار ← **in vivo histology** ← مفهوم الـ ==optical biopsy==.
          - تكبير **several hundred-fold**، و **contrast media** للصور على مستوى الخلية.
          - **شاشتين**: واحدة للميكروسكوب وواحدة للمنظار، و **cross-sections** على أعماق مختلفة، وتقدر **تسجّل** الصور وترجعلها.
      - kind: table
        page: 55
        quote: "Magnification Endoscopy 93 95"
        title: "مين أدق في cancer و precancer؟ (ص 55)"
        columns: ["Technique", "Sensitivity %", "Specificity %"]
        rows:
          - ["Chromoendoscopy", "97", "81"]
          - ["NBI", "97.9", "83.8"]
          - ["FICE", "not given", "90.9"]
          - ["Magnification", "93", "95"]
          - ["I-Scan", "28.5", "78.4"]
          - ["CLE", "80", "94"]
        hide: [[1, 1], [3, 2], [4, 1]]
      - kind: aside
        tone: exam
        page: 55
        quote: "I-SCAN 28.5 78.4"
        text: |
          من الجدول: أعلى **sensitivity** هو ==NBI (97.9)==، وأعلى **specificity** هو ==magnification (95)==، وأقل sensitivity بفرق كبير ==I-Scan (28.5)==.

          وخلي بالك: الـ FICE في الكتاب ليه رقم واحد بس (90.9) تحت الـ specificity.
      - kind: try
        items: [git.L02.026, git.L02.031, git.L02.037, git.L02.039, git.L02.136]
    recap:
      - "Magnifying: deep sedation (focus 1 mm)، cap، dyes؛ 3 أضعاف الوقت."
      - "Chromo: absorptive (methylene blue …)، contrast (indigo carmine)، reactive (Congo red، phenol red)؛ للـ high risk."
      - "NBI: blue light والـ hemoglobin؛ 1000-fold؛ زي الـ chromo (100% / 75%)."
      - "FICE: virtual filters، 10 صور. I-Scan: software على الـ white light. CLE: laser و optical biopsy."
    practice: [git.L02.025, git.L02.026, git.L02.027, git.L02.028, git.L02.029, git.L02.030, git.L02.031, git.L02.032, git.L02.033, git.L02.034, git.L02.035, git.L02.036, git.L02.037, git.L02.038, git.L02.039, git.L02.040, git.L02.041, git.L02.042, git.L02.043, git.L02.044, git.L02.045, git.L02.046, git.L02.047, git.L02.048, git.L02.107, git.L02.113, git.L02.114, git.L02.115, git.L02.116, git.L02.117, git.L02.118, git.L02.134, git.L02.136]
