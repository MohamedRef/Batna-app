        text: |
          صورة الـ **methenamine-silver** في الصفحة دي بتعلّم **GBM** و **nuclei of podocytes** و **mesangial cells**، وتحتها صورة **electron microscopy** للـ **normal** glomerulus: الـ ==foot processes== منفصلة ومتساوية، قاعدة على GBM منتظم.

          ليه الـ EM؟ التفسير المقبول (مش في الكتاب): فيه أمراض تحت الـ light microscope شكلها **طبيعي** تمامًا. الـ **minimal change** مثلًا: العيب إن الـ foot processes **اتفردت** (effacement)، وده أصغر من إن الـ LM يشوفه. وكمان الـ EM بيقيس **تخن الـ GBM** (رفيع في الـ thin basement membrane، ومتقطّع في الـ Alport)، وبيقول الـ deposits قاعدة فين بالظبط (subendothelial، subepithelial، mesangial). يعني الـ EM مش رفاهية، ده اللي بيقفل التشخيص لما الـ LM يقول «طبيعي».
