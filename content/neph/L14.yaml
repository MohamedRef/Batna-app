    src: { page: 498, quote: "Table 2: Dysproteinemia-Associated Kidney Diseases\n| Kidney Biopsy Diagnosis | Clinical Presentation | Hypothesized Mechanism of Injury | Clone Detection Rate | Paraprotein Detection Rate |\n| Light chain cast nephropathy | AKI, decreased kidney function, nonalbumin proteinuria | Light chain binds to uromodulin and precipitates in distal tubules, resulting in obstruction and interstitial nephritis | ~100% | ~100% |\n| Monoclonal immunoglobulin amyloidosis: Light chain (AL) amyloidosis; Heavy chain (AH) amyloidosis; Light and heavy chain (AHL) amyloidosis | Proteinuria, NS, decreased kidney function | Monoclonal immunoglobulin forms amyloid fibrils in extracellular tissue | ~100% | ~100% |\n| Monoclonal immunoglobulin deposition disease (MIDD): Light chain deposition disease (LCDD); Heavy chain deposition ... | Decreased kidney function long term, proteinuria | Deposition of pathogenic light chain; in HCDD, almost all patients have CH1 deletion leading to production of truncated HC | LCDD: 90%-100%; HCDD: 100%; LHCDD: 90%-100% | LCDD: 90%-100%; HCDD: 80%-100%; LHCDD: 100% |" }
