  - id: git.L11.lesson3
    title: "الأسبرين والوارفارين والـ PPI"
    hook: "مريض بنزف وعامل stent من 3 شهور: توقف الأسبرين؟ ده سؤال الكتاب بالظبط."
    minutes: 9
    pages: [303, 304]
    topics: [antithrombotics, drugs]
    goals:
      - "تعرف تعمل إيه في كل antithrombotic وليه (سؤال essay)"
      - "تكتب جرعة الـ proton pump inhibitor (PPI) صح، وتعرف الـ vasoactive لمين"
    status: unverified
    steps:
      - kind: explain
        page: 303
        quote: "Management of antithrombotic agents (antiplatelet agents) and anticoagulants): In patients with acute UGIH who are taking low dose aspirin as monotherapy for primary cardiovascular prophylaxis, aspirin should be temporarily interrupted. Aspirin can be restarted after careful re-evaluation of its clinical indication. In patients with acute UGIH who are taking low dose aspirin as monotherapy for secondary cardiovascular prophylaxis, aspirin should not be interrupted."
        title: "الأسبرين: primary ولا secondary؟"
        text: |
          السؤال الأول: الأسبرين ده **ليه**؟
          - ==Primary prophylaxis== (مفيش حدث قلبي قبل كده): **وقّفه مؤقتًا**، وارجع له بعد ما تراجع الـ indication.
          - ==Secondary prophylaxis== (MI، stent، stroke): **ما توقفوش**. ولو اتوقف لأي سبب، رجّعه بسرعة، **within 3-5 days**.
          - **Dual antiplatelet therapy (DAPT)**: خلّي الأسبرين، و**وقّف التاني** (زي clopidogrel) ورجّعه **within 5 days**.

          ليه الفرق؟ التفسير المقبول (مش في الكتاب): في الـ primary الأسبرين بيمنع حدث **ممكن** يحصل بعد سنين، ففايدته صغيرة قدام نزيف شغال دلوقتي. في الـ secondary المريض عنده شريان أو stent اتسد قبل كده، ووقف الأسبرين ممكن يعمل **stent thrombosis** أو MI في أيام، ودي أخطر من القرحة اللي المنظار والـ PPI بيتعاملوا معاها. وفي الـ DAPT بتوقف التاني علشان تقلل النزيف وتفضل محتفظ بحماية الأسبرين.
      - kind: figure
        page: 303
        quote: "Management of antithrombotic agents (antiplatelet agents) and anticoagulants): In patients with acute UGIH who are taking low dose aspirin as monotherapy for primary cardiovascular prophylaxis, aspirin should be temporarily interrupted. Aspirin can be restarted after careful re-evaluation of its clinical indication. In patients with acute UGIH who are taking low dose aspirin as monotherapy for secondary cardiovascular prophylaxis, aspirin should not be interrupted."
