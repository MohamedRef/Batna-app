  # ---------- p256-257: ApoA-I therapies ----------
  - id: dm.L20.036
    kind: card
    topic: apoa1
    front: What did 5 weekly IV infusions of ApoA-I Milano show?
    back: A significant reduction in coronary atheroma volume measured by IVUS.
    src: { page: 256, quote: "Significant reduction of coronary atheroma volume as measured by IVUS." }
    status: unverified
  - id: dm.L20.037
    kind: order
    topic: apoa1
    prompt: Order autologous ApoA-I therapy.
    steps:
      - Take the patient's own plasma
      - Selectively de-lipidate HDL ex vivo
      - Lipid-poor ApoA-I is generated
      - Re-infuse the autologous plasma containing ApoA-I
    src: { page: 257, quote: "Selectively de-lipidate HDL ex vivo, generating lipid-poor apoA-I." }
    status: unverified
  - id: dm.L20.038
    kind: card
    topic: apoa1
    front: Why is autologous therapy built on lipid-poor ApoA-I rather than mature HDL?
    back: ApoA-I is more effective in promoting cholesterol efflux than mature HDL particles.
    src: { page: 257, quote: "ApoA-I is more effective in promoting cholesterol efflux than mature HDL particles." }
    status: unverified
  - id: dm.L20.039
    kind: card
    topic: apoa1
    front: What limits IV ApoA-I mimetic peptides?
    back: Parenteral administration is a logistical barrier to long-term use (even though they reduced atherosclerosis progression in trials).
    src: { page: 257, quote: "Parenteral administration presents a logistical barrier to long-term administration." }
    status: unverified
  - id: dm.L20.040
    kind: card
    topic: apoa1
    front: What is D-4F and why can it be given by mouth?
    back: An oral ApoA-I mimetic peptide; gut peptidases do not recognise it, so it is not degraded in the gut.
    src: { page: 257, quote: "Not recognized by gut peptidases, therefore not degraded in the gut." }
    status: unverified
