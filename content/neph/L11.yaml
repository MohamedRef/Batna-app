    src: { page: 371, quote: "Anticoagulation in Pregnancy Anticoagulation during pregnancy is recommended in patients with kidney failure with risk factors for venous thromboembolism, including nephrotic range proteinuria, hypoalbuminemia with serum albumin<2mg/dL, positive antiphospholipid syndrome, and previous history of thrombosis. (53) Anticoagulation can be considered for patients with additional risk factors such as immobility and obesity and patients with higher risks of thrombosis such as membranous nephropathy and vasculitis.(55) Current guidelines recommend unfractionated heparin or low molecular weight heparin for anticoagulation during pregnancy and 6 weeks postpartum.(53)" }
