      - kind: explain
        page: 24
        title: "مضاعفات تانية وتحاليل"
        quote: "Peripheral blood examination: Patients presents with severe anaemia ,a haemoglobin concentration between 2-6 gm/dl. Anaemia is typically microcytic and hypochromic."
        text: |
          ليه المضاعفات دي؟ الطحال الكبير بيحجز كرات وصفايح (**hypersplenism**). والنخاع لما ما يكفيش جوّه العضم، التفسير المقبول (مش في الكتاب)، بيشتغل برّه في بؤر في الكبد والطحال وجنب العمود الفقري، والبؤر دي ممكن تضغط على الـ spinal cord. والموت قبل 5 سنين من الأنيميا أو العدوى لو مفيش نقل.

          **مضاعفات**: hypersplenism، بؤر **extramedullary haematopoiesis** ممكن تضغط على الـ **spinal cord**، والعيان من غير علاج بيموت قبل **5 سنين**، والنقل بينقل **Human immunodeficiency virus (HIV) و Hepatitis B virus (HBV) و Hepatitis C virus (HCV)**.

          **التحاليل**:
          - Hb ==2–6 g/dL==، microcytic hypochromic.
          - Film: anisopoikilocytosis، hypochromia شديدة، **target cells** كتير، basophilic stippling، nucleated red blood cells (RBCs). الـ reticulocytes **modest** بس.
          - **Electrophoresis**: ==HbF 10–98%==، والـ Haemoglobin A2 (HbA2) طبيعي أو عالي.
          - النخاع: erythroid hyperplasia شديدة؛ **ferritin** عالي؛ unconjugated bilirubin عالي.
