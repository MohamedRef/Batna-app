        hide: [[1, 1]]
      - kind: reveal
        page: 251
        quote: "For example, pain is common in patients with chronic pancreatitis or pancreatic cancer and Crohn disease, but it is absent in many patients with celiac disease or post gastrectomy malabsorption."
        prompt: "ليه الألم شائع في الـ chronic pancreatitis والـ Crohn، وغالبًا مش موجود في الـ celiac؟"
        answer: |
          الكتاب: الألم **common** في الـ chronic pancreatitis والـ pancreatic cancer والـ Crohn، و **absent in many** عيانين الـ celiac والـ post-gastrectomy.

          التفسير المقبول (مش في الكتاب): البنكرياس والـ Crohn بيمسّوا **الجدار كله** والأعصاب والـ peritoneum (التهاب transmural، تليف، ضيق)، أما الـ celiac فالمشكلة في **الـ mucosa** بس: الـ villi بتتمسح من غير ما الجدار يلتهب، والـ mucosa ما فيهاش أعصاب ألم كتير.
      - kind: explain
        page: 251
        title: "برّه الأمعاء"
        quote: "Some patients with intestinal malabsorption present initially with symptoms or laboratory abnormalities that point to other organ systems in the absence of or overshadowing symptoms referable to the gastrointestinal tract. more patients with celiac disease present with anemia and osteopenic bone disease in the absence of significant gastrointestinal symptoms than present with classic gastrointestinal symptomatology. Microcytic, macrocytic, or dimorphic anemia may reflect impaired iron, folate, or vitamin B12 malabsorption."
        text: |
          عيانين **celiac** كتير بييجوا بـ ==anemia== و **osteopenic bone disease** **من غير** أعراض معوية تُذكر.

          - **Anemia**: microcytic (حديد)، macrocytic (folate أو B12)، أو dimorphic.
          - **نزيف و purpura**: نقص **vitamin K** (hypoprothrombinemia).
          - **العضم**: كالسيوم و vitamin D قليلين، والـ fatty acids بتمسك الكالسيوم في البراز، ولو طوّل: **secondary hyperparathyroidism**.
          - **Amenorrhea، infertility، impotence** من سوء التغذية.
          - **Edema وحتى ascites** من الـ **protein-losing enteropathy**.

          ليه العضم بالذات؟ الكتاب بيقول تلات أسباب مع بعض: الكالسيوم قليل، والـ vitamin D قليل، والـ fatty acids اللي ما اتمصتش بتمسك الكالسيوم (chelation) وتطلّعه في البراز. والـ parathyroid بيحاول يعوّض الكالسيوم الواطي، فلو طوّلت تبقى **secondary hyperparathyroidism** وتسحب الكالسيوم من العضم أكتر.
