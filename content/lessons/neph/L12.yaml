  - id: neph.L12.lesson2
    title: "Tumor lysis syndrome: الورم لما يفرقع"
    hook: "الـ chemo شغال كويس أوي لدرجة إن الخلايا بتنفجر وتغرق الكلية."
    minutes: 10
    pages: [413, 415]
    topics: [tls]
    goals:
      - "تعرف الـ TLS ونتايجه الست وتفهم كل واحدة جاية منين"
      - "تحفظ الـ Cairo-Bishop (lab و clinical) بالأرقام"
      - "تفهم الـ pathophysiology وعوامل الخطورة"
    status: unverified
    steps:
      - kind: explain
        remind: [neph.L12.023]
        page: 413
        title: "إيه اللي بيحصل؟"
        quote: "It is an emergency condition in which breakdown of tumor cells, either spontaneously or in response to treatment, releases intracellular contents into the circulation, resulting in hyperuricemia, hyperkalemia, hyperphosphatemia, secondary hypocalcemia, metabolic acidosis, and AKI."
        text: |
          الـ ==tumor lysis syndrome== **emergency**: خلايا الورم بتتكسر (لوحدها أو مع العلاج) وتطلّع اللي جواها في الدم:

          - **hyperuricemia**
          - **hyperkalemia**
          - **hyperphosphatemia**
          - **secondary hypocalcemia**
          - **metabolic acidosis**
          - **acute kidney injury (AKI)**

          وممكن كمان **cardiac arrhythmias** و **seizures**.
      - kind: explain
        page: 413
        title: "كل نتيجة جاية منين؟"
        quote: "It is an emergency condition in which breakdown of tumor cells, either spontaneously or in response to treatment, releases intracellular contents into the circulation, resulting in hyperuricemia, hyperkalemia, hyperphosphatemia, secondary hypocalcemia, metabolic acidosis, and AKI."
        text: |
          الكلمة المفتاح في الكتاب: ==intracellular contents==. الخلية من جوه غير الدم من برا، فلما تتفتح بتطلّع اللي عندها كتير:

          - **K:** أغلب الـ potassium في الجسم جوه الخلايا، فبيعلى (hyperkalemia).
          - **Phosphate:** الخلية مليانة phosphate (في الـ DNA والـ ATP)، فبيعلى.
          - **Uric acid:** الـ DNA بيتكسر لـ purines، والـ purines بتبقى uric acid.
          - **Calcium:** ده الوحيد اللي بينزل، وعشان كده اسمه **secondary**: الـ phosphate العالي بيمسك الكالسيوم ويرسّبه.
          - **Acidosis:** التفسير المقبول (مش في الكتاب): أحماض الخلية بتطلع، والكلية اللي بتتعب مش بتعرف تطلّعها.

          والـ K العالي والـ Ca الواطي هما سبب الـ **arrhythmias** والـ **seizures**.
      - kind: explain
        page: 413
        title: "مين اللي بيعمله؟"
        quote: "The most common malignancies associated with TLS include those with large tumor burdens and rapid cell growth rates, such as non-Hodgkin lymphoma, acute myeloid leukemia, acute lymphocytic leukemia, Burkitt lymphoma, and solid organ cancers with large masses."
        text: |
          الأورام اللي ==large tumor burden== و **rapid cell growth**:
          - **non-Hodgkin lymphoma** و **Burkitt lymphoma**
          - **acute myeloid leukaemia (AML)** و **acute lymphoblastic leukaemia (ALL)**
          - **solid cancers** بكتلة كبيرة

          ليه دول بالذات؟ عشان كل ما الكتلة أكبر والخلايا بتتقسم أسرع، العلاج بيقتل عدد أكبر في وقت أقصر، فاللي بيطلع في الدم أكتر من اللي الكلية تلحق تطلّعه.

          والـ in-hospital mortality ممكن توصل **20%**، و **70%** بيحصلهم complications خطيرة (sepsis، dialysis، respiratory failure، ventilation، cardiac arrest، seizures).
      - kind: check
        page: 415
        quote: "Figure 5: Risk Factors for Tumor Lysis Syndrome (TLS). BM indicates bone marrow; CNS, central nervous system; GFR, glomerular filtration rate; LDH, lactate dehydrogenase; WBC, white blood cell."
        question: "Which patient is at the highest risk of TLS?"
        options:
          - "Burkitt lymphoma with LDH 2000 IU, about to start chemotherapy"
          - "Early-stage breast cancer after lumpectomy"
          - "Chronic myeloid leukemia on maintenance tablets with normal counts"
          - "Small solitary renal mass before nephrectomy"
        answer: 0
        why:
          - "صح: Burkitt (rapid growth) + LDH أكتر من 1500 IU (large burden) + chemo-responsive."
          - "ورم صغير اتشال، مفيش كتلة تتكسر."
          - "مرض مستقر بعدد طبيعي، مفيش burden كبير بيتكسر مرة واحدة."
          - "كتلة صغيرة لوحدها، والـ nephrectomy مش chemo."
      - kind: table
        page: 414
        quote: "Calcium 25% decrease from baseline or ≤7.0 mg/dL"
        title: "Cairo-Bishop: الـ laboratory TLS"
        columns: [Lab, Value, Or]
        rows:
          - ["Uric acid", "≥8.0 mg/dL", "↑25%"]
          - ["Potassium", "≥6.0 mEq/L", "↑25%"]
          - ["Phosphorus", "≥4.5 mg/dL (child ≥6.5)", "↑25%"]
          - ["Calcium", "≤7.0 mg/dL", "↓25%"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: tip
        page: 414
        quote: "Laboratory diagnostic criteria: Tumor lysis syndrome diagnosis requires the presence of 2 or more of the following criteria within the same 24-hour period from 3 days before to 7 days after chemotherapy initiation:"
        text: |
          افتكر **8 - 6 - 4.5 - 7**: uric acid **8**، potassium **6**، phosphate **4.5**، calcium **7** (ده الوحيد اللي بينزل).

          والقاعدة: **2 أو أكتر** في نفس الـ **24 ساعة**، من **3 أيام قبل** لـ **7 أيام بعد** بداية الـ chemo.
      - kind: explain
        page: 414
        title: "ليه الأرقام دي بالشكل ده؟"
        quote: "Laboratory diagnostic criteria: Tumor lysis syndrome diagnosis requires the presence of 2 or more of the following criteria within the same 24-hour period from 3 days before to 7 days after chemotherapy initiation:"
        text: |
          كل حتة في التعريف ليها سبب:

          - **25% من الـ baseline:** التفسير المقبول (مش في الكتاب): عيان كليته تعبانة ممكن يكون الـ K بتاعه عالي من الأول، فالمهم **الطلعة** مش الرقم لوحده.
          - **2 أو أكتر في نفس الـ 24 ساعة:** عشان رقم واحد عالي ممكن يكون من أي حاجة، لكن اتنين مع بعض في نفس اليوم بيقولوا «خلايا اتكسرت».
          - **من 3 أيام قبل لـ 7 أيام بعد الـ chemo:** عشان الورم ممكن يتكسر **spontaneously** قبل العلاج، والتكسير بيكمّل أيام بعده.

          والكتاب نفسه بيعترف بعيب: العيان ممكن ميكونش عنده أكتر من اتنين في نفس الوقت، فالتعريف ==not sensitive or specific== للـ **spontaneous TLS**.
      - kind: explain
        page: 415
        title: "امتى يبقى clinical؟"
        quote: "Clinical diagnostic criteria: Clinical tumor lysis syndrome is defined by the presence of laboratory tumor lysis syndrome plus one or more of the following:"
        text: |
          ==Clinical tumor lysis syndrome (TLS)== = laboratory TLS + واحدة على الأقل من:
          - **seizure**
          - **creatinine > 1.5 × upper limit of normal** (age-adjusted)
          - **cardiac arrhythmia** أو **sudden death**

          يعني الـ clinical معناه إن الأرقام بدأت تأذي عضو فعلًا: المخ (seizure)، الكلية (creatinine)، أو القلب (arrhythmia).

          الـ Cairo-Bishop كمان بيعمل grading من **0** (asymptomatic) لـ **5** (death).
      - kind: check
        page: 415
        quote: "Creatinine greater than 1.5 times the upper limit of normal of an age-adjusted reference range"
        question: "Day 2 of chemo: uric acid 10, K 6.5, Ca 7.6, creatinine 2.0 mg/dL (upper limit of normal 1.1). No seizure or arrhythmia. Diagnosis?"
        options:
          - "Clinical TLS"
          - "Laboratory TLS only"
          - "No TLS: calcium is above 7"
          - "No TLS: creatinine is not a lab criterion"
        answer: 0
        why:
          - "صح: uric acid و K = اتنين lab criteria، والـ creatinine 2.0 أكبر من 1.5 × 1.1 = 1.65، فبقى clinical."
          - "ناقص: الـ creatinine عدّى 1.5 × upper limit of normal."
          - "الكالسيوم مش لازم؛ كفاية أي اتنين."
          - "صح إنه مش lab criterion، بس هو clinical criterion."
      - kind: figure
        remind: [neph.L12.039]
        page: 415
        quote: "The release of large amounts of phosphate increases the calcium-phosphate concentration product, leading to calcium-phosphate precipitation with nephrocalcinosis and hypocalcemia."
        title: "من الخلية للكلية"
        alt: "Pathway: a lysed tumor cell releases potassium, phosphate and DNA. DNA becomes purines, then uric acid via xanthine oxidase, causing uric acid nephropathy. Phosphate binds calcium, causing nephrocalcinosis and hypocalcemia. Potassium causes arrhythmia. Cytokine release is a third AKI mechanism."
        caption: "تلات طرق للـ AKI: ==uric acid nephropathy== و **nephrocalcinosis** و **cytokine release**. والـ allopurinol بيقفل سهم الـ xanthine oxidase."
        svg: |
          <svg viewBox="0 0 330 366" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L12b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="85" y="10" width="160" height="40" rx="20" class="fg-bad"/>
