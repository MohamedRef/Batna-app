  # ---------- p107: aims and definition ----------
  - id: geri.L07.005
    kind: enumerate
    topic: cga
    prompt: What are the aims of geriatric medicine?
    points:
      - Maintain health in old age through a high level of engagement and avoidance of disease
      - Early detection and appropriate treatment of disease
      - Maintain maximum independence consistent with irreversible disease and disability
      - Sympathetic care and support during terminal illness
    pass: 3
    src: { page: 107, quote: "Maintenance of maximum independence consistent with irreversible disease and disability." }
    status: unverified
    tags: [high-yield]
  - id: geri.L07.006
    kind: card
    topic: cga
    front: What is Comprehensive Geriatric Assessment (CGA)?
    back: A multistep process of care. A multidimensional, holistic assessment of the older person's health and wellbeing leads to a plan for the issues that concern them (and their family or carers); interventions support the plan, and progress is reviewed and the plan reassessed at intervals.
    src: { page: 107, quote: "Comprehensive Geriatric Assessment (CGA) is a process of care comprising a number of steps." }
    status: unverified
    tags: [high-yield]
  - id: geri.L07.007
    kind: cloze
    topic: cga
    text: "CGA starts with a {{c1::multidimensional holistic}} assessment of the older person, which leads to a {{c2::plan}} addressing the issues that concern the person and their family or carers."
    src: { page: 107, quote: "Initially, a multidimensional holistic assessment of an older person considers health and wellbeing and leads to the formulation of a plan" }
    status: unverified
  - id: geri.L07.008
    kind: order
    topic: cga
    prompt: Put the CGA cycle in order.
    steps:
      - Assessment
      - Creation of a problem list
      - Personalised care plan
      - Intervention
      - Regular planned review (back to assessment)
    src: { page: 108, quote: "Assessment Regular planned view" }
    status: unverified
    tags: [high-yield]
  - id: geri.L07.009
    kind: mcq
    topic: cga
    stem: What is the primary goal of Comprehensive Geriatric Assessment (CGA)?
    options:
      - To reduce healthcare costs
      - To provide holistic, multidimensional assessment and individualized care planning
      - To replace family caregivers
      - To focus solely on pharmacological treatments
      - To eliminate the need for hospitalization
    answer: 1
    why:
      - Fewer admissions may follow, but saving money is not the goal.
      - "Correct: CGA is a holistic multidimensional assessment that leads to an individual plan (p107)."
      - CGA plans with the family and carers; it does not replace them.
      - Medicines are one of 12 components, not the whole of CGA.
      - CGA lowers admission rates; it cannot remove the need for hospital.
    src: { page: 107, quote: "a multidimensional holistic assessment of an older person considers health and wellbeing and leads to the formulation of a plan" }
    status: unverified
    tags: [book-question]
  - id: geri.L07.010
    kind: mcq
    topic: population
    stem: Which group is classified as "young elderly" according to the lecture?
    options: ["50–60 years", "60–80 years", "80–100 years", "≥110 years", "40–50 years"]
    answer: 1
    why:
      - Below 60 is not elderly in the lecture's groups.
      - "Correct: 60–80 years are the young elderly or old adults (p106)."
      - 80–100 years are the old elderly.
      - 110 and over are supercentenarians.
      - 40–50 years is middle age, not elderly.
    src: { page: 106, quote: "60–80: young elderly or old adults" }
    status: unverified
    tags: [book-question, numbers]
  # ---------- p108: indications ----------
  - id: geri.L07.011
    kind: enumerate
    topic: indications
    prompt: Enumerate the indications for CGA.
    points:
      - Frailty or a frailty syndrome (falls, confusion, reduced mobility, increasing incontinence), even if the cause looks reversible
      - Elderly at risk of frailty
      - After hospital discharge, especially if admitted for a frailty syndrome or a long stay for a trivial reason
      - All elderly in care homes
      - Elderly patients in the perioperative period
      - Any elderly person referred for CGA
    pass: 5
    src: { page: 108, quote: "Elderly with frailty or one of the frailty syndromes as falls, confusion, reduced mobility and increasing incontinence" }
    status: unverified
    tags: [high-yield]
  - id: geri.L07.012
    kind: card
    topic: indications
    front: An older person has new falls that seem due to a new medication. Is CGA still indicated?
    back: Yes. Frailty syndromes are an indication even if they appear to be due to a reversible cause, such as a new medication or a minor infection.
    src: { page: 108, quote: "even if these appear to be due to a reversible cause (such as a new medication or minor infection)." }
    status: unverified
  - id: geri.L07.013
    kind: enumerate
    topic: indications
    prompt: Name the frailty syndromes the lecture lists as indications for CGA.
    points: [Falls, Confusion, Reduced mobility, Increasing incontinence]
    pass: 4
    src: { page: 108, quote: "frailty syndromes as falls, confusion, reduced mobility and increasing incontinence" }
    status: unverified
  - id: geri.L07.014
    kind: card
    topic: indications
    front: Which patients discharged from hospital especially need a CGA?
    back: Those admitted for one of the frailty syndromes, or those with a long hospital stay for an otherwise trivial reason.
    src: { page: 108, quote: "After discharge from a hospital especially if the cause of admission was one of the frailty syndromes or there was a long hospital stay" }
    status: unverified
  - id: geri.L07.015
    kind: mcq
    topic: indications
    stem: What is a key indication for initiating a CGA?
    options:
      - Elderly patients with a single acute illness
      - Elderly at risk of frailty or exhibiting frailty syndromes (e.g., falls, confusion)
      - Patients under 50 years with chronic pain
      - Stable, fully independent older adults
      - Individuals with normal cognitive function
    answer: 1
    why:
      - A single acute illness alone is not on the list.
      - "Correct: frailty, a frailty syndrome, or being at risk of frailty are indications (p108)."
      - CGA is for older people, not patients under 50.
      - Fit, independent older adults are not on the indication list.
      - Normal cognition is not an indication; confusion is.
    src: { page: 108, quote: "Elderly at risk of frailty." }
    status: unverified
    tags: [book-question]
  - id: geri.L07.016
    kind: mcq
    topic: indications
    stem: Which of these older people does NOT have an indication for CGA listed in the lecture?
    options:
      - A fit 68-year-old marathon runner seen for a routine eye test
      - A 79-year-old living in a care home
      - An 83-year-old due for hip replacement next week
      - An 88-year-old discharged after 3 weeks in hospital for a mild chest infection
      - An 81-year-old with new urinary incontinence after starting a diuretic
    answer: 0
    why:
      - "Correct: he is not frail, not at risk, not in care, not perioperative and not referred (p108)."
      - All elderly in care homes need a CGA.
      - The perioperative period is an indication.
      - A long stay for a trivial reason is an indication after discharge.
      - Increasing incontinence is a frailty syndrome, even with a reversible cause like a new drug.
    src: { page: 108, quote: "All elderly at care homes. Elderly patients at the perioperative period." }
    status: unverified
  # ---------- p109: benefits ----------
  - id: geri.L07.017
    kind: enumerate
    topic: benefits
    prompt: Enumerate the benefits of CGA.
    points:
      - Decreases hospital admission rates
      - Decreases length of hospital stay
      - Decreases hospital-related complications
      - More discharges to home instead of a nursing home
      - Decreases hospital mortality
      - Decreases readmission after discharge
      - Discharge in a better health state
      - Improves diagnostic accuracy
      - Improves quality of life
      - Better management and rehabilitation plan
      - Identifies future treatment goals and supports advance care planning
      - Perioperative benefit (better health, shorter stay, fewer complications)
      - Can reverse the progression of frailty
    pass: 8
    src: { page: 109, quote: "Decreases hospital admission rates." }
    status: unverified
    tags: [high-yield]
