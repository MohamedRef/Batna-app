    stem: A 64-year-old woman is assessed for TIPS. Free hepatic venous pressure is 6 mmHg and wedged hepatic venous pressure is 13 mmHg. Which cause of portal hypertension best explains these values?
    options:
      - Portal vein thrombosis
      - Constrictive pericarditis
      - Sarcoidosis
      - Alcoholic cirrhosis
      - Schistosomiasis
    answer: 3
    why:
      - Pre-hepatic; the wedged pressure is normal.
      - Post-hepatic; both free and wedged pressures rise, so the gradient stays normal.
      - Sarcoidosis is pre-sinusoidal; the wedged pressure is normal.
      - Correct. A raised wedged pressure with HVPG 7 mmHg (13 − 6) points to a sinusoidal cause, as in cirrhosis (p38). HVPG 7 is above the normal 1–5 mmHg (portal hypertension by the standard definition) but below CSPH (10 mmHg or more); the book's p38 definition figure uses the CSPH value. The lecture does not explain HVPG maths; this is standard physiology.
      - Pre-sinusoidal; the wedged pressure is normal.
