  - id: hem.L03.lesson6
    title: "التجلطات الصغيرة: TTP و HUS"
    hook: "صفايح قليلة ومع ذلك فيه جلطات؟ ده مش تناقض. ده الـ thrombotic microangiopathy، والفرق بين الـ TTP والـ HUS ممكن ينقذ حياة."
    minutes: 10
    pages: [40, 49]
    topics: [ttp, hus]
    goals:
      - "تعرّف الـ TMA وتعرف أسبابها"
      - "تشرح الـ TTP: ADAMTS13 والـ VWF، العلامات، التحاليل، والـ plasma exchange"
      - "تفرّق الـ typical من الـ atypical HUS وتعرف العلاج وإيه اللي ممنوع"
    status: unverified
    steps:
      - kind: explain
        page: 40
        title: "الـ thrombotic microangiopathy"
        quote: "characterized by disseminated thrombus formation in arterioles and capillaries resulting in"
        text: |
          ==TMA== = جلطات صغيرة منتشرة في الـ **arterioles** والـ **capillaries**، والنتيجة:
          1. **Thrombocytopenia** (الصفايح اتصرفت في الجلطات).
          2. ==MAHA== (الكرات بتتقطع وهي معدية جنب الجلطات).
          3. **تلف أعضاء**.

          أشهر نوعين **TTP** و **HUS**، وكمان: malignant hypertension، عدوى، أدوية، cancer، و **HELLP**.
      - kind: explain
        page: 40
        title: "الـ TTP و ADAMTS13"
        quote: "This definition was recently completed by the presence of a severe deficiency of ADAMTS13 (activity <10%)"
        text: |
          الـ ==ADAMTS13== هو المقص اللي بيقطّع الـ **VWF multimers** الكبيرة.

          لو ناقص جدًا (**activity < 10%**)، الـ **ultralarge VWF** يفضل في الدم، لزج جدًا للصفايح، فتتكون **platelet-rich microthrombi** في الـ arterioles.

          الـ ADAMTS13 < 10% هو ==العلامة الوحيدة الـ specific للـ TTP==.
      - kind: figure
        page: 40
        quote: "causes the blood accumulation of platelet-hyperadhesive ultralarge VWF multimers"
        title: "المقص الناقص"
        alt: "Two panels. Normal: a long VWF chain is cut by ADAMTS13 scissors into small pieces, and platelets pass. TTP: no ADAMTS13 (antibody or mutation), the ultralarge VWF chain catches many platelets forming a microthrombus in an arteriole, and a red cell is cut into a schistocyte as it passes."
        caption: "الطبيعي: ==ADAMTS13== بيقص الـ VWF. في الـ TTP: المقص مش شغال، فالـ VWF الطويل بيصطاد الصفايح ويعمل جلطة، والكرة الحمرا بتتقطع وهي معدية = **schistocyte**."
        svg: |
