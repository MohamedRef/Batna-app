        quote: "IV. MANAGEMENT\n  B. Functional- (\"Cueing and scheduling\"), activity\n  C. Psychosocial\n  D. Education\n  E. Care of the family\n  F. On-going care"
        title: "وبعد الدوا"
        text: |
          الـ ==behavioural symptoms== ليها جدول drugs (risperidone، quetiapine، haloperidol بجرعات صغيرة جدًا، citalopram، sertraline، mirtazapine...)، كلها **start low**.

          وباقي الـ management:
          - **Functional**: cueing and scheduling، activity.
          - **Psychosocial**، **education**، **care of the family**، **on-going care**.

          ليه الـ **cueing and scheduling**؟ التفسير المقبول (مش في الكتاب): لأن المريض بيفقد الذاكرة الجديدة الأول، بس العادات القديمة بتفضل أطول. فلما تحط له روتين ثابت وعلامات (ورقة على الباب، منبّه للدوا)، بتشيل الحمل من الذاكرة اللي واقعة. وعلشان كده **care of the family** في القايمة: العيلة هي اللي شايلة المريض، ولو وقعت، المريض يقع.
