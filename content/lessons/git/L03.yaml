          - ["Acid suppression", "++", "+"]
          - ["Prokinetics", "+", "++"]
          - ["Fundic relaxors", "−", "+"]
          - ["Tricyclic antidepressants", "++", "+"]
          - ["Reassurance, diet, rifaximin, psychological therapy", "+", "+"]
        hide: [[0, 1], [1, 2], [2, 1], [3, 1]]
      - kind: reveal
        page: 104
        quote: "Table Usefulness of therapies for functional dyspepsia"
        prompt: "في الـ functional dyspepsia، ليه الـ acid suppression و الـ TCA أحسن في EPS، والـ prokinetics أحسن في PDS؟"
        answer: |
          بص على العرض الأساسي:

          - الـ **EPS** = ألم وحرقان. الحمض بيهيّج معدة حساسة، والـ TCA بيهدّي الـ visceral pain. علشان كده الاتنين **++**.
          - الـ **PDS** = شبع بدري وامتلاء. ده motility: تفريغ بطيء و accommodation ضعيفة. فالـ **prokinetic** (++) بيفضّي، والـ **fundic relaxor** (+) بيوسّع. والـ fundic relaxor مالوش لازمة في EPS (−).

          (المنطق ده physiology عامة، والكتاب بيدّي الجدول من غير شرح.)
      - kind: check
        page: 104
        quote: "Prokinetic, e.g., acotiamide, itopride, or tegaserod"
        question: "A woman with PDS is H. pylori negative and still has early satiation after a 4-week PPI course. Which first-line drug class fits her subtype best"
        options:
          - "A prokinetic such as acotiamide or itopride"
          - "A long-term antibiotic"
          - "An opioid analgesic"
          - "Urgent CT abdomen"
        answer: 0
        why:
          - "صح: الـ prokinetic هو الـ first line التاني، وهو **++** في الـ PDS."
          - "الـ rifaximin له دور بسيط (+)، بس مش antibiotic طويل ولا first line."
          - "الـ opioids بتبطّأ التفريغ وبتعمل narcotic bowel، ومش في السلّم."
          - "مفيش alarm features (ولا weight loss ولا سن 60)."
      - kind: try
        items: [git.L03.107, git.L03.108, git.L03.109, git.L03.122, git.L03.274]
    recap:
      - "FD = postprandial fullness، early satiation، epigastric pain أو burning، من غير structural disease."
      - "PDS: fullness/satiation، 3 days a week. EPS: pain/burning، 1 day a week. آخر 3 شهور، onset من 6."
      - "Heartburn مش dyspeptic symptom. اللي بيروح بالتبرّز = IBS."
      - "Dysphagia في أي سن = urgent endoscopy. Dyspepsia + weight loss و 55+ = endoscopy."
      - "السلّم: H. pylori ← lifestyle ← PPI أو prokinetic ← TCA ← specialist."
      - "EPS: acid suppression و TCA ++. PDS: prokinetics ++."
