    topic: fh
    prompt: Mention the treatment of familial hypercholesterolemia.
    points:
      - "Diet: low cholesterol, low fat (mostly polyunsaturated)"
      - Statins
      - Bile acid-binding drugs (cholestyramine)
      - Liver transplantation
      - LDL apheresis
    pass: 4
    hook: "علاج الـ FH من «الأسهل للأصعب»: diet (low cholesterol، low fat أغلبه polyunsaturated)، statins، bile acid binders (cholestyramine)، LDL apheresis، وفي الآخر liver transplantation."
    src: { page: 264, quote: "(b) Drugs:\n  6. Statins\n  7. Bile acid-binding drugs: Cholestyramine" }
    status: unverified
    update:
