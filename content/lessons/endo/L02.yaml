  # ------------------------------------------------------------------
  - id: endo.L02.lesson1
    title: "الـ pituitary في الحمل، والـ prolactinoma قبل الحمل"
    hook: "الغدة بتكبر لوحدها في الحمل لأكتر من الضعف. تخيل لو جواها ورم أصلًا."
    minutes: 8
    pages: [13, 15]
    topics: [pituitary-physiology, prolactinoma]
    goals:
      - "تفهم ليه الـ pituitary بتكبر والـ prolactin بيعلى في الحمل"
      - "تعرف أرقام علاج الـ prolactinoma بالجراحة والأدوية"
      - "تعرف تجهّز ست عندها prolactinoma للحمل"
    status: unverified
    steps:
      - kind: explain
        page: 13
        quote: "The pituitary enlarges throughout pregnancy and may become hyperintense on scan.* Gonzales, JG, Elizondo, G, Salvidar, D, et al, AM J med 1988; 85:217"
        title: "الغدة بتكبر"
        text: |
          الـ ==pituitary enlarges throughout pregnancy==، وممكن تبان **hyperintense** في الأشعة.

          في رسمة الكتاب الحجم بيزيد كل trimester عن اللي قبله، وأكبر حاجة في التالت.

          ليه بتكبر؟ رسمة الكتاب اللي جاية بتقولك: الـ **estrogen** بتاع المشيمة بيعمل **lactotroph hyperplasia**، يعني خلايا الـ prolactin بتكتر، فالغدة كلها تتخن. وده هيبقى الخيط اللي بيربط الدرس كله: غدة بتكبر طبيعي، فأي ورم جواها هيلاقي مكان أضيق، وأي تحليل هرمون هيتقرا بشكل مختلف.
      - kind: figure
        page: 13
        title: "رسمة الكتاب ص 13: حجم الـ pituitary في الحمل"
        image: { file: endo/L02-pituitary-volume.webp, book: true }
        alt: "Book bar chart titled Pregnancy increases pituitary volume. Y axis pituitary volume in mL from 200 to 800. Four bars from left to right: nonpregnant about 300, first trimester about 440, second trimester about 540, third trimester about 710."
        caption: |
          أربع عواميد، تقراهم **من الشمال لليمين**، والمحور اللي على الشمال هو حجم الغدة:

          - **أول عمود (Nonpregnant)**: حوالي **300**.
          - **التاني والتالت (First و Second trimester)**: حوالي **440** وبعدين **540**.
          - **آخر عمود يمين (Third trimester)**: حوالي **710**، يعني أكتر من ==ضعف== الطبيعي.

          ده اللي بيخلي الـ ==pituitary enlarges throughout pregnancy== رقم تشوفه بعينك: الزيادة مستمرة كل trimester، وأعلاها في الآخر، فالورم اللي جوّه الغدة مكانه بيضيق أكتر كل ما الحمل يكمّل.
      - kind: figure
        page: 13
        quote: "PRL axis during pregnancy"
        title: "رسمة الكتاب ص 13: ليه الـ prolactin بيعلى؟"
        image: { file: endo/L02-prl-axis.webp, book: true }
        alt: "Book diagram, PRL axis during pregnancy. Top: the hypothalamus sends TRH (solid arrow) and dopamine (dashed arrow) to the maternal pituitary, which releases PRL, raised. Bottom right: the placenta makes estrogen, which points up to the pituitary and to an oval labelled lactotroph hyperplasia. Decidual PRL, not inhibited by dopamine, and amniotic fluid PRL, raised, are labelled by the placenta."
        caption: |
          الرسمة بتتقري **من تحت لفوق**:

          - **تحت يمين**: المشيمة (**Placenta**) بتطلّع **estrogen**، والسهم بيطلع منه **شمال لفوق** للـ maternal pituitary.
          - **الشكل البيضاوي شمال**: اللي الـ estrogen بيعمله هناك: ==lactotroph hyperplasia==، فالـ **PRL ↑** اللي تحت الغدة.
          - **فوق**: الـ hypothalamus بيبعت **TRH** (سهم كامل، بينبّه) و **dopamine** (سهم متقطّع، بيكبت).
          - **تحت خالص**: الـ **decidua** نفسها بتعمل prolactin ==not inhibited by dopamine==، فالـ **amniotic fluid PRL ↑**.

          يعني الـ prolactin بيعلى من مصدرين: غدة الأم اللي كبرت، والـ decidua اللي ما بتسمعش كلام الـ dopamine.
      - kind: explain
        page: 14
        quote: "Pituitary adenomas are quite common, being found at autopsy in about 11% and clinically in 0.1% of persons."
        title: "الـ pituitary adenomas والحمل"
        text: |
          - موجودة في **11%** في الـ autopsy، و **0.1%** clinically.
          - بتأثر على الخصوبة بطريقتين: ==over-secretion== للهرمون، أو **hypopituitarism**.
          - الحمل نفسه بيغيّر الهرمونات، فالتقييم بيبقى صعب، والعلاج لازم نفكر في تأثيره على الجنين.
          - الـ ==hyperprolactinemia== سبب **ثلث** الـ female infertility.

          ليه الـ prolactin العالي بيمنع الحمل؟ التفسير المقبول (مش في الكتاب): الـ prolactin بيكبت نبضات الـ GnRH من الـ hypothalamus، فالـ LH والـ FSH يقلّوا، والتبويض يقف. وده منطقي: الطبيعة عاملة الـ prolactin العالي وقت الرضاعة عشان الست متحملش تاني على طول. يعني لو نزّلنا الـ prolactin، التبويض يرجع.
      - kind: table
        page: 14
        quote: "Surgical therapy is initially curative in approximately 80-90% of patients with microadenomas and rarely causes hypopituitarism."
        title: "الجراحة للي عايزة تحمل"
        columns: ["Tumour", "Cure", "Hypopituitarism"]
        rows:
          - ["Microadenoma", "80-90%", "Rare"]
          - ["Macroadenoma", "30%", "Rises dramatically"]
          - ["Both", "Recurrence ~20%", "-"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 14
        quote: "The curative rate is much lower (30%) in patients with macroadenomas, and the risk of hypopituitarism and subsequent infertility increases dramatically."
        prompt: "ست عندها macroadenoma وعايزة تحمل. ليه الجراحة مش أول اختيار ليها بالذات؟"
        answer: "لأن الشفا في الـ macroadenoma **30%** بس، وخطر الـ **hypopituitarism** وبعده الـ **infertility** بيزيد **dramatically**. يعني العملية ممكن تشيل جزء من الورم وتاخد معاه الـ gonadotrophs، فتخسر الحمل اللي عملنا العملية عشانه. وكمان الاتنين (micro و macro) بيرجعوا في حوالي **20%**."
      - kind: explain
        page: 14
        quote: "In patients with prolactinomas, treatment choices are defined by the clinical presentation and the therapeutic goal but generally dopamine agonists are the initial choice of therapy, including those planning pregnancy."
        title: "الأدوية أولًا"
        text: |
          الـ ==dopamine agonists== هي العلاج الأول، حتى للي بتخطط للحمل.
          - الأشهر: **bromocriptine** و **cabergoline**.
          - **50-75%** من الـ macroadenomas بتصغر **50%**.

          ليه الدوا قبل الجراحة؟ الـ **dopamine** هو الفرامل الطبيعية للـ lactotrophs (شفتها في رسمة الـ PRL axis)، فالـ agonist بيدوس الفرامل دي: الـ prolactin ينزل، الورم يصغر، والتبويض يرجع. أما الجراحة فأرقامها في الجدول: كويسة في الـ micro، بس في الـ macro الشفا **30%** وخطر الـ hypopituitarism والـ infertility بيزيد جدًا، وده عكس اللي الست عايزاه.
      - kind: check
        page: 15
        quote: "Cabergoline is dosed once to twice weekly and is more effective and better tolerated than bromocriptine with restoration of ovulatory menses in >90% of women and >90% reduction in tumor size."
        question: "Compared with bromocriptine, cabergoline is:"
        options: ["Weekly dosing, more effective, better tolerated", "Daily dosing, less effective", "Equal but worse tolerated", "Contraindicated before pregnancy"]
        answer: 0
        why:
          - "صح: مرة أو مرتين في الأسبوع، أحسن وأريح، وبيرجّع الـ ovulation في أكتر من 90%."
          - "العكس."
          - "الكتاب بيقول أحسن في الاتنين."
          - "بيتستخدم، بس خد بالك من الـ half-life."
      - kind: explain
        page: 15
        quote: "For the woman who wishes to become pregnant, contraception should be used for 2-3 cycles to establish the intermenstrual interval prior to pregnancy."
        title: "قبل ما تحمل"
        text: |
          - ==Contraception لمدة 2-3 cycles== علشان نعرف الـ intermenstrual interval بتاعها، فنكتشف الحمل بدري لما الدورة تتأخر.
          - الـ cabergoline ليه ==long half-life==: الجنين بيتعرض له **أسبوع أو أكتر** بعد ما نوقفه.
      - kind: reveal
        page: 15
        quote: "For the woman who wishes to become pregnant, contraception should be used for 2-3 cycles to establish the intermenstrual interval prior to pregnancy."
        prompt: "ليه معرفة ميعاد الدورة مهمة هنا بالذات؟"
        answer: "لأننا هنوقف الـ dopamine agonist أول ما نعرف إنها حامل. لو الدورة منتظمة ومعروفة، أي تأخير يبان على طول، فالجنين يتعرض للدوا أقل وقت ممكن."
      - kind: aside
        tone: analogy
        page: 13
        quote: "The pituitary enlarges throughout pregnancy and may become hyperintense on scan.* Gonzales, JG, Elizondo, G, Salvidar, D, et al, AM J med 1988; 85:217"
        text: "الـ sella زي أوضة صغيرة. في الحمل الـ pituitary بتتخن، ولو في ورم جوا كمان، الأوضة تضيق والـ optic chiasm اللي فوقها هو أول واحد يتزنق."
      - kind: try
        items: [endo.L02.001, endo.L02.007, endo.L02.009, endo.L02.012, endo.L02.014]
    recap:
      - "الـ pituitary بتكبر طول الحمل؛ estrogen ← lactotroph hyperplasia ← PRL ↑."
      - "الـ decidual PRL مش بيتقفل بالـ dopamine."
      - "Hyperprolactinemia = ثلث الـ female infertility."
      - "جراحة: micro 80-90%، macro 30%، recurrence 20%."
      - "Dopamine agonists أولًا؛ cabergoline أحسن؛ contraception 2-3 cycles قبل الحمل."
    practice: [endo.L02.001, endo.L02.002, endo.L02.003, endo.L02.004, endo.L02.005, endo.L02.006, endo.L02.007, endo.L02.008, endo.L02.009, endo.L02.010, endo.L02.011, endo.L02.012, endo.L02.013, endo.L02.014, endo.L02.101, endo.L02.102]
  # ------------------------------------------------------------------
  - id: endo.L02.lesson2
    title: "الـ prolactinoma أثناء الحمل والرضاعة"
    hook: "أول ما تحمل وقّف الدوا. بس امتى نرجّعه؟ وامتى نولّد؟ وامتى نفتح؟"
    minutes: 8
    pages: [15, 17]
    topics: [prolactinoma]
    goals:
      - "تعرف امتى نوقف وامتى نكمّل الـ dopamine agonist"
      - "تعرف تتابع حسب حجم الورم"
      - "تعرف تتصرف لو الورم كبر، وفي الرضاعة"
    status: unverified
    steps:
      - kind: explain
        page: 15
        quote: "It is recommended that women with prolactinomas be instructed to discontinue dopamine agonist therapy as soon as they discover that they are pregnant."
        title: "القاعدة"
        text: |
          ==Stop the dopamine agonist== أول ما تعرف إنها حامل.

          **الاستثناء:** macroadenoma حملت وهي على العلاج، ومعملتش surgery أو radiation قبل كده، وخصوصًا لو الورم **invasive** أو لازق في الـ **optic chiasm**: ممكن نكمّل طول الحمل.

          ليه القاعدة "وقّف"؟ عشان نقلّل تعرّض الجنين للدوا لأقل وقت. وليه الاستثناء؟ لأن الـ macroadenoma اللي ماتشالش ولا اتعرض لـ radiation هو اللي عنده أكبر فرصة يكبر، ولو هو أصلًا لازق في الـ chiasm، أي كبر صغير يعني **عمى**. يعني بنوازن: خطر الدوا على الجنين صغير، وخطر الورم على نظر الأم كبير.
      - kind: explain
        page: 15
        quote: "The stimulatory effect of the hormonal milieu of pregnancy and the withdrawal of the dopamine agonist may result in significant prolactinoma enlargement."
        title: "بنوازن بين حاجتين"
        text: |
          1. الـ ==tumor enlargement== المتوقع: هرمونات الحمل بتنبّه الورم، ووقف الدوا بيشيل الفرامل.
          2. أمان تعرض الجنين للدوا في أول كام أسبوع.

          ليه الورم بيكبر من الناحيتين؟ الكتاب بيقول **the stimulatory effect of the hormonal milieu of pregnancy** مع **withdrawal of the dopamine agonist**. يعني الـ estrogen بيدوس بنزين (نفس اللي بيكبّر الـ lactotrophs الطبيعية)، ووقف الدوا بيشيل الفرامل في نفس الوقت. عشان كده المتابعة جاية بعدها على طول.
      - kind: figure
        page: 16
        title: "صور الكتاب ص 16: الـ MRI بتاع prolactinoma قبل وأثناء الحمل"
        image: { file: endo/L02-prolactinoma-mri.webp, book: true }
        marks:
          - { at: [0.71, 0.33], label: "Small tumour in the sella" }
          - { at: [0.68, 0.74], label: "Enlarged tumour bulging above the sella" }
        alt: "Book figure of four pituitary MRI images in two rows. Left column coronal views, right column sagittal views. In the top row a small rounded pituitary mass sits in the sella. In the bottom row the same mass is clearly larger and bulges upward above the sella."
        caption: |
          أربع صور MRI للغدة، والكتاب ما كتبش عليها label. التفسير المقبول (مش في الكتاب):

          - **العمود الشمال**: مقطع **coronal** (من قدّام). **العمود اليمين**: مقطع **sagittal** (من الجنب).
          - **الصف اللي فوق**: ورم صغير مدوّر جوّه الـ sella (1).
          - **الصف اللي تحت**: نفس الورم ==أكبر بوضوح== وطالع لفوق برا الـ sella (2).

          التفسير المقبول (مش في الكتاب): الأغلب إن الصف اللي فوق قبل الحمل واللي تحت أثناءه، وده بالظبط الـ ==prolactinoma enlargement== اللي الكتاب بيحذّر منه، وعشان كده الورم الكبير محتاج **visual field testing** كل trimester.
      - kind: sort
        page: 16
        quote: "Large tumors and those with extrasellar extension: formal visual field testing should be done each trimester."
        prompt: "إيه المتابعة المناسبة؟"
        bins: ["Clinical review each trimester", "Formal visual fields each trimester"]
        cards:
          - { text: "Microadenoma", bin: 0 }
          - { text: "Intrasellar macroadenoma", bin: 0 }
          - { text: "Large tumour", bin: 1 }
          - { text: "Extrasellar extension", bin: 1 }
        why: "الصغير والـ intrasellar مش محتاجين serial magnetic resonance imaging (MRI) ولا visual fields، بس clinical review كل trimester. الكبير أو اللي طالع برا الـ sella: visual fields كل trimester."
      - kind: aside
        tone: trap
        page: 16
        quote: "It is not necessary to measure serum prolactin throughout pregnancy."
        text: "فخ: متقيسش الـ serum prolactin في الحمل. هو أصلًا بيعلى طبيعي (الـ lactotrophs والـ decidua)، فمش هيقولك حاجة عن الورم."
      - kind: order
        page: 16
        quote: "Reinstitution of bromocriptine or cabergoline therapy generally is successful in reducing tumor size."
        prompt: "الورم كبر في الحمل. رتّب الخطوات:"
        steps:
          - "Restart bromocriptine or cabergoline"
          - "Deliver if pregnancy is advanced enough"
          - "Surgical decompression if these fail"
        why: "الدوا غالبًا بيصغّر الورم. لو الحمل متقدم كفاية، نولّد. الجراحة آخر حل (زي أي جراحة، بس خطر الـ hypopituitarism أعلى)."
      - kind: table
        page: 17
        quote: "Cabergoline has been utilized in the first trimester in more than 600 human pregnancies. There is no evidence for increased risk of spontaneous abortion, congenital anomalies, multiple gestation, or premature delivery."
        title: "الدوا والجنين"
        columns: ["Drug", "Pregnancy fact"]
        rows:
          - ["Bromocriptine", "Crosses placenta; not continuously through gestation; early weeks safe"]
          - ["Cabergoline", ">600 first-trimester pregnancies, no rise in abortion or anomalies"]
          - ["Cabergoline", "Long half-life: exposure 1+ week after stopping"]
        hide: [[0, 1], [1, 1]]
      - kind: explain
        page: 17
        quote: "Therapeutic options for tumors extending outside the sella include pre- pregnancy surgical debulking, more frequent monitoring without dopamine agonist therapy, or continuous bromocriptine therapy throughout gestation, if severe visual symptoms are encountered."
        title: "ورم طالع برا الـ sella وعايزة تحمل؟"
        text: |
          3 اختيارات، وكل واحد بيحل المشكلة من ناحية:
          - **Pre-pregnancy surgical debulking**: نصغّر الورم **قبل** الحمل، فلما يكبر يلاقي مكان قبل ما يوصل للـ chiasm.
          - **متابعة أكتر من غير dopamine agonist**: الجنين مش بيتعرض لدوا، والتمن إننا نراقب النظر عن قرب.
          - ==Continuous bromocriptine== طول الحمل لو في **severe visual symptoms**: لأن ساعتها خطر العمى بقى أكبر من خطر الدوا، مع إن الكتاب في ص 16 مش بيفضّل الـ bromocriptine المستمر لأنه بيعدّي المشيمة.
      - kind: explain
        page: 17
        quote: "There is no evidence that suckling stimulates prolactinoma growth. However, dopamine agonists must be withheld until the period of breastfeeding is over, as they will cause a reduction in PRL and cessation of milk production."
        title: "الرضاعة"
        text: |
          - الرضاعة بتعلّي الـ prolactin طبيعي، بس ==مفيش دليل إن الـ suckling بيكبّر الورم==.
          - الـ dopamine agonists **ممنوعة** طول الرضاعة، لأنها بتوقف اللبن.
          - نعيد التقييم بعد **شهرين** من الولادة أو من وقف الرضاعة. الـ prolactin (PRL) ممكن يقل أو يرجع طبيعي.

          ليه نستنى الشهرين ده؟ لأن الـ prolactin بيفضل عالي طبيعي طول الرضاعة، فأي قياس قبلها هيكدب. وبما إن الكتاب بيقول الـ PRL ممكن **يقل أو يرجع طبيعي** بعد الحمل، ممكن بعد التقييم ماتحتاجش ترجع للدوا أصلًا.
      - kind: case
        page: 15
        quote: "In selected patients with macroadenomas who become pregnant on dopaminergic therapy and who have not had prior surgical or radiation therapy, it may be prudent to continue dopaminergic therapy throughout the pregnancy, especially if the tumor is invasive or is abutting the optic chiasm.*"
        stem: "A woman with a 2 cm invasive macroprolactinoma abutting the chiasm conceives on cabergoline. No prior surgery or radiotherapy."
        steps:
          - question: "What about cabergoline?"
            options: ["Continuing it through pregnancy may be prudent", "Stop it at once like everyone", "Switch to octreotide", "Urgent surgery"]
            answer: 0
            why: "ده بالظبط الاستثناء: macroadenoma invasive أو لازق في الـ chiasm من غير surgery أو radiation قبل كده."
          - question: "Monitoring?"
            options: ["Formal visual fields each trimester", "Monthly prolactin", "No monitoring", "Weekly MRI"]
            answer: 0
            why: "الورم الكبير: visual fields كل trimester، والـ prolactin مش مفيد."
      - kind: check
        page: 17
        quote: "There is no evidence that suckling stimulates prolactinoma growth. However, dopamine agonists must be withheld until the period of breastfeeding is over, as they will cause a reduction in PRL and cessation of milk production."
        question: "A woman with a microprolactinoma has just delivered and wants to breastfeed. Best advice?"
        options: ["Breastfeed; keep dopamine agonists off until breastfeeding ends", "Restart cabergoline now and breastfeed", "Avoid breastfeeding because suckling enlarges the tumour", "Measure prolactin weekly while breastfeeding"]
        answer: 0
        why:
          - "صح: مفيش دليل إن الـ suckling بيكبّر الورم، والدوا بيستنى لحد ما الرضاعة تخلص، وبعدها تقييم بعد شهرين."
          - "الـ dopamine agonist هيوقف اللبن."
          - "الكتاب: **no evidence** إن الرضاعة بتكبّره."
          - "الـ prolactin عالي طبيعي في الرضاعة، فقياسه مش هيفيد."
      - kind: try
        items: [endo.L02.015, endo.L02.016, endo.L02.019, endo.L02.021, endo.L02.027]
    recap:
      - "وقّف الـ dopamine agonist أول ما تحمل؛ إلا macroadenoma invasive/جنب الـ chiasm."
      - "Micro/intrasellar: clinical كل trimester. Large/extrasellar: visual fields كل trimester. مفيش PRL."
      - "الورم كبر: رجّع الدوا ← ولّد لو متقدمة ← جراحة لو فشلوا."
      - "Bromocriptine بيعدّي المشيمة؛ cabergoline آمن في >600 حمل."
      - "الرضاعة مسموحة؛ الدوا ممنوع لحد ما تخلص؛ تقييم بعد شهرين."
    practice: [endo.L02.015, endo.L02.016, endo.L02.017, endo.L02.018, endo.L02.019, endo.L02.020, endo.L02.021, endo.L02.022, endo.L02.023, endo.L02.024, endo.L02.025, endo.L02.026, endo.L02.027, endo.L02.028, endo.L02.103, endo.L02.104, endo.L02.105, endo.L02.106, endo.L02.125, endo.L02.128]
