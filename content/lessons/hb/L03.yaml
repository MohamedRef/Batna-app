        tone: tip
        page: 41
        text: |
          جملة صغيرة في الكتاب بتتسأل: **portal pressure correlates well with severity of fibrosis in chronic hepatitis**. كل ما التليف يزيد، الضغط يعلى، وده نفس اللي خلّى الـ LSM يتنبأ بالـ CSPH في المحاضرة اللي فاتت.
