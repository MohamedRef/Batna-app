          - "G4 جوه الـ range."
          - "G3a جوه الـ range."
      - kind: explain
        page: 36
        quote: "Transition from an estimated glomerular filtration rate (eGFR)-based to a risk-"
        title: "ليه الـ risk أحسن من الـ eGFR لوحده؟"
        text: |
          Figure 12 بتنقل الـ care من **eGFR-based** لـ **risk-based**: بدل "حوّل لما الـ eGFR يبقى 30"، "حوّل لما الـ risk يوصل حد معين".

          التفسير المقبول (مش في الكتاب) بمثال: راجل عنده 80 سنة، eGFR 32 و ACR 10. وشاب عنده 40 سنة، eGFR 50 و ACR 2000. الـ eGFR بيقول الكبير أخطر، بس الـ ==KFRE== هيقول الشاب هو اللي هيوصل للغسيل، والكبير غالبًا لأ.

          يعني الـ risk بيحط الدكتور والـ fistula والزرع **للي محتاجهم فعلًا**، ومايضيّعش وقت مريض مش هيحتاجهم.
      - kind: table
        page: 36
        quote: "Figure 12: Transition from an estimated glomerular filtration rate (eGFR)-based to a risk-based approach to chronic kidney disease (CKD) care. KFRE, Kidney Failure Risk Equation\n| eGFR-based criteria | Step | Risk-based criteria |\n| eGFR 30-60 | Transition from primary care to nephrology care | KF risk ≥3–5% 5 years |\n| eGFR <30 | Transition from nephrology care to interprofessional care | KF risk ≥10% 2 years |\n| eGFR <20 | Access and transplant planning | KF risk ≥40% 2 years |"
