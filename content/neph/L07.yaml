  - id: neph.L07.173
    kind: mcq
    topic: alport
    stem: A 17-year-old boy has microscopic hematuria since early childhood, proteinuria 2.8 g/day, BP 145/95 and high-tone hearing loss. His maternal uncle is on dialysis. Most likely diagnosis?
    options:
      - X-linked Alport syndrome
      - Thin basement membrane nephropathy
      - IgA nephropathy
      - ADPKD
      - Fabry disease
    answer: 0
    why:
      - "Correct: hematuria, proteinuria and hypertension by adolescence, deafness, and an affected maternal uncle (X-linked) (p179)."
      - TBMN rarely causes proteinuria, hypertension or deafness.
      - IgA nephropathy does not cause deafness or this family pattern.
      - ADPKD causes cysts and is autosomal dominant, without deafness.
      - Fabry causes pain crises, angiokeratomas and corneal opacities, not deafness from childhood with hematuria.
    src: { page: 179, quote: "Alport's: proteinuria (often nephrotic range) and ↑ BP usually present by adolescence." }
    status: unverified
  - id: neph.L07.174
    kind: mcq
    topic: alport
    stem: A man with X-linked Alport syndrome gets a deceased-donor kidney. Months later he develops rapidly progressive GN with linear IgG on the graft. What happened?
    options:
      - De novo anti-GBM disease against donor α5(IV) collagen
      - Recurrence of Alport syndrome in the graft
      - BK virus nephropathy
      - Calcineurin inhibitor toxicity
      - IgA nephropathy recurrence
    answer: 0
    why:
      - "Correct: under 5% develop anti-GBM antibodies to the donor α5 chain seen as non-self (p185)."
      - Alport is a genetic defect of his own kidneys; it does not recur in a normal graft.
      - BK nephropathy does not cause linear IgG and RPGN.
      - CNI toxicity does not cause crescentic GN with linear IgG.
      - IgA recurrence gives mesangial IgA, not linear IgG.
    src: { page: 185, quote: "donor a5 type IV collagen is recognized as non-self. It is not a contraindication to transplantation." }
    status: unverified
  # ---------- p186-193: Fabry disease ----------
  - id: neph.L07.175
    kind: card
    topic: fabry
    front: What is the enzyme defect in Fabry disease, and what accumulates?
    back: Deficiency of α-galactosidase A, with intracellular accumulation of neutral glycosphingolipids (Gb3) with terminal α-linked galactosyl groups.
    src: { page: 186, quote: "Fabry disease is caused by hereditary deficiency of the enzyme a- galactosidase A (a-Gal A)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.176
    kind: enumerate
    topic: fabry
    prompt: Mention the clinical features of Fabry disease.
    points:
      - Progressive CKD
      - Pain crises and acral paresthesias
      - Sweating abnormalities (hypohidrosis)
      - Vascular skin lesions (angiokeratomas)
      - Cardiac abnormalities
      - Eye abnormalities (corneal verticillata)
    pass: 5
    src: { page: 186, quote: "Clinically, this leads to progressive CKD, pain crises, sweat-ing abnormalities, vascular cutaneous lesions, and cardiac and eye abnormalities." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.177
    kind: card
    topic: fabry
    front: Which gene causes Fabry disease, where is it, and who is worst affected?
    back: GLA on the X chromosome (over 500 mutations). Hemizygous males have severe disease; heterozygous females a variable, usually milder course.
    src: { page: 187, quote: "More than 500 mutations causing Fabry disease have been identified in GLA, the gene for a-Gal A, which is located on the X chromosome." }
    status: unverified
  - id: neph.L07.178
    kind: card
    topic: fabry
    front: How does Fabry disease start in boys, and how does it usually end?
    back: Paresthesias and pain in the hands and feet with episodic pain crises in childhood and early adolescence. ESRD in the 3rd–6th decade; myocardial or cerebral infarction are typical terminal events.
    src: { page: 187, quote: "Myocardial or cerebral infarctions are typical terminal events." }
    status: unverified
  - id: neph.L07.179
    kind: card
    topic: fabry
    front: How does Fabry nephropathy present?
    back: Mild to moderate proteinuria, sometimes microhematuria, from the third decade; nephrotic syndrome is unusual. Gradual decline with hypertension and ESRD by the 4th–5th decade; up to 10% of heterozygous women reach ESRD.
    src: { page: 188, quote: "the nephropathy of Fabry disease typically manifests as mild to moderate proteinuria, sometimes with microhematuria" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.180
    kind: card
    topic: fabry
    front: What urine finding is seen in Fabry disease?
    back: Oval fat bodies with a Maltese cross under polarized light, from large amounts of glycosphingolipid in the urine.
    src: { page: 188, quote: "Urinary oval fat bodies, with a Maltese cross configuration when viewed with a polarizing microscope" }
    status: unverified
  - id: neph.L07.181
    kind: card
    topic: fabry
    front: What does light microscopy show in Fabry nephropathy?
    back: Enlarged glomerular visceral epithelial cells (podocytes) packed with small clear vacuoles of glycosphingolipid; vacuoles also in parietal and distal tubular cells and vessel walls; progressive glomerulosclerosis.
    src: { page: 188, quote: "Glomerular visceral epithelial cells are enlarged and packed with small, clear vacuoles that represent glycosphingolipid material" }
    status: unverified
  - id: neph.L07.182
    kind: card
    topic: fabry
    front: What is the EM hallmark of Fabry disease?
    back: "Lysosomal inclusions (myelin figures) in visceral epithelial cells: round concentric dense layers, sometimes parallel (\"zebra bodies\")."
    src: { page: 189, quote: "The layers may be arranged in parallel (zebra bodies)." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.183
    kind: enumerate
    topic: fabry
    prompt: Mention cardiac involvement in Fabry disease.
    points:
      - Coronary narrowing with angina, MI or heart failure
      - Left ventricular hypertrophy (may be early; may be isolated)
      - Arrhythmias from conduction system infiltration
      - Valvular lesions
    pass: 3
    src: { page: 190, quote: "Left ventricular hypertrophy (LVH) may be an early finding." }
    status: unverified
  - id: neph.L07.184
    kind: card
    topic: fabry
    front: Which cerebral circulation is preferentially involved in Fabry disease, and when do symptoms start?
    back: The vertebrobasilar circulation, usually from the fourth decade (vertigo, diplopia, dysarthria, ataxia, hemiparesis).
    src: { page: 190, quote: "The vertebrobasilar circulation is preferentially involved." }
    status: unverified
  - id: neph.L07.185
    kind: card
    topic: fabry
    front: How does autonomic dysfunction show in Fabry disease?
    back: Hypohidrosis, acral paresthesias and pain, and altered intestinal motility.
    src: { page: 190, quote: "typi-cally manifested by hypohidrosis, acral paresthesias and pain, and altered intestinal motility" }
    status: unverified
  - id: neph.L07.186
    kind: card
    topic: fabry
    front: Describe the angiokeratomas of Fabry disease.
    back: Dark-red macules or papules appearing in the second decade (may be the earliest sign), on the lower trunk, buttocks, hips, genitalia and upper thighs (angiokeratoma corporis diffusum).
    src: { page: 191, quote: "Typical locations include the lower trunk, buttocks, hips, genitalia, and upper thighs." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.187
    kind: cloze
    topic: fabry
    text: "Corneal opacities ({{c1::verticillata}}) are seen on slit lamp in about {{c2::75%}} of affected men and women; cataracts in 23% of males and 10% of females."
    src: { page: 191, quote: "present in approximately 75% of affected men and women. These lesions, termed verticillata" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.188
    kind: card
    topic: fabry
    front: How is Fabry disease confirmed?
    back: "Decreased (below 15%) or absent α-Gal A activity in serum, leukocytes, fibroblasts or tissue. If equivocal: slit-lamp exam, urinary ceramide digalactoside and trihexoside, and genetic testing."
    src: { page: 192, quote: "The diagnosis should be confirmed by demonstrating decreased (<15%) or absent a-Gal A activity in serum, leukocytes, cultured skin fibroblasts, or tissue." }
    status: unverified
    tags: [high-yield, numbers]
  - id: neph.L07.189
    kind: enumerate
    topic: fabry
    prompt: Mention the benefits of agalsidase (enzyme replacement) in trials.
    points:
      - Lower plasma and urine Gb3
      - Less neuropathic pain
      - Better quality of life
      - Clearing of Gb3 from kidney, heart and skin
      - Better cerebral blood flow
      - Stable renal function in mild to moderate impairment over 1–2 years
    pass: 4
    src: { page: 192, quote: "agalsidase administra-tion for 5 to 6 months resulted in reduced plasma and urine Gb3; amelioration of neuropathic pain" }
    status: unverified
  - id: neph.L07.190
    kind: card
    topic: fabry
    front: In Fabry patients on hemodialysis, when can agalsidase be given, and who should get it?
    back: During hemodialysis, because dialysis barely clears the enzyme. Recommended for all affected males and symptomatic carrier females (very expensive); add RAS blockade for proteinuria.
    src: { page: 192, quote: "agalsidase may be infused during hemodialysis because there is little clearance of the enzyme by hemo-dialysis" }
    status: unverified
  - id: neph.L07.191
    kind: card
    topic: fabry
    front: What are the limits of kidney transplantation in Fabry disease?
    back: It treats advanced nephropathy but not extrarenal disease; coronary and cerebrovascular disease remain the main causes of death. Recipients can receive agalsidase.
    src: { page: 193, quote: "Renal transplantation is an effective treatment for advanced Fabry nephropathy but does not ameliorate the extrarenal manifestations." }
    status: unverified
  - id: neph.L07.192
    kind: card
    topic: fabry
    front: Can a Fabry heterozygote donate a kidney?
    back: No. Fabry heterozygotes should not become kidney donors.
    src: { page: 193, quote: "Fabry heterozygotes should not become kidney donors." }
    status: unverified
