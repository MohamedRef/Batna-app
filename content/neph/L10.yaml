  # ---------- p337: definition, drugs and renal vessels ----------
  - id: neph.L10.001
    kind: card
    topic: defs
    front: What does the renal interstitium comprise?
    back: Every renal component except the glomeruli.
    src: { page: 337, quote: "Interstitium comprises of everything of renal component except glomeruli" }
    status: unverified
    tags: [high-yield]
  - id: neph.L10.002
    kind: card
    topic: defs
    front: Why does progressive interstitial inflammation usually cause a large fall in renal function?
    back: It typically destroys extensive amounts of kidney tissue, so renal function falls considerably.
    src: { page: 337, quote: "typically destroys extensive amounts of kidney tissue and as a result usually produces a considerable decrement in renal function" }
    status: unverified
  - id: neph.L10.003
    kind: table
    topic: drug-vessels
    title: Drug damage to the renal vessels
    columns: [Mechanism, Drugs]
    rows:
      - ["Prerenal: antianabolic", "Tetracyclines"]
      - ["Prerenal: reduced renal blood flow", "ACEI, ARA (ARBs), ciclosporin (CysA), radiocontrast, NSAIDs"]
      - ["Vasculitis", "Allopurinol, procainamide, penicillins, sulphonamides"]
      - ["Thrombotic microangiopathy", "Mithramycin, ciclosporin (CysA)"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 337, quote: "Reduced RBF:(diminish resistance or constriction); ACEI, ARA, CysA, radiocontrast, NSAIDS" }
    status: unverified
    tags: [high-yield]
  - id: neph.L10.004
    kind: cloze
    topic: drug-vessels
    text: "Ciclosporin harms the renal vessels in two ways: {{c1::reduced renal blood flow}} and {{c2::thrombotic microangiopathy}}, the second shared with {{c3::mithramycin}}."
    src: { page: 337, quote: "Thrombotic microangiopathy" }
    status: unverified
  - id: neph.L10.005
    kind: mcq
    topic: drug-vessels
    stem: A 62-year-old man started a new drug 3 weeks ago. He now has palpable purpura, haematuria and a rising creatinine, and biopsy shows renal vasculitis. Which drug from the book's list is the likely cause?
    options:
      - Procainamide
      - Gold
      - Mithramycin
      - Tetracycline
      - Lithium
    answer: 0
    why:
      - "Correct: allopurinol, procainamide, penicillins and sulphonamides cause drug vasculitis (p337)."
      - Gold causes membranous glomerulonephritis (p338).
      - Mithramycin causes thrombotic microangiopathy, not vasculitis.
      - Tetracyclines are a prerenal (antianabolic) cause.
      - Lithium causes minimal change disease, ADH resistance and medullary damage.
    src: { page: 337, quote: "Allopurinol, procainamide, Penicillins, sulphonamides" }
    status: unverified
