- id: hb.L10.136
  kind: case
  topic: care
  stem: A 21-year-old student is brought 40 hours after taking 60 tablets of paracetamol 500 mg. He is alert but
    nauseated. ALT 6,800 U/L, INR 3.6, glucose 52 mg/dL.
  steps:
  - question: Which treatment is still indicated now?
    options:
    - Oral NAC only if within 24 h of ingestion
    - Activated charcoal only
    - IV N-acetylcysteine
    - No antidote after 24 h; supportive care
    answer: 2
    why: 'NAC is indicated up to 72 h after ingestion (IV: 150 mg/kg over 15 min, 50 mg/kg over 4 h, 100 mg/kg over
      16 h), and helps stage 1–2 HE of any cause.'
  - question: How do you manage the glucose?
    options:
    - 50% dextrose boluses only when symptomatic
    - Restrict glucose to avoid cerebral edema
    - Insulin-dextrose infusion
    - Continuous 10% dextrose infusion
    answer: 3
    why: Hypoglycemia is common and a poor sign; prevent it with 5–10% dextrose, keeping glucose 100–200 mg/dL and
      checking at least twice daily.
  - reveal: 'Next day: confusion and drowsiness; creatinine 3.9 mg/dL; INR 7.0.'
    question: He becomes confused and sleepy (stage 2 HE). Where should he be?
    options:
    - ICU, no sedatives
    - Ward with lactulose and rifaximin
    - Ward with benzodiazepine sedation
    - ICU with immediate intubation
    answer: 0
    why: Stage 2 HE goes to ICU; avoid sedatives, image the head, and discuss with a liver center. Intubation is
      usually at stage 3.
  - question: Six hours later he is in grade 3 HE. Do King's College criteria apply?
    options:
    - 'No: pH is not below 7.3'
    - 'No: lactate is not given'
    - 'Yes: INR, creatinine and HE are all met'
    - Only if factor V is <20%
    answer: 2
    why: All three of INR >6.5, creatinine >300 µmol/L (>3.4 mg/dL) and HE 3–4 together meet the acetaminophen criteria
      (pH <7.3 or lactate >3 mmol/L would each be enough alone). Factor V belongs to Clichy.
  - question: He is intubated with an ICP monitor. ICP 25 mmHg, MAP 75 mmHg, kidneys failing. Which measure is NOT
      advised?
    options:
    - Head elevation 20°
    - Hyperventilation to PaCO2 25 mmHg
    - Mannitol 0.5 g/kg
    - Hypertonic saline to Na 145–155
    answer: 2
    why: Mannitol is given only if kidney function is intact; here it is failing.
  src:
    page: 179
    quote: "hyperventilation to a Paco2 of 25 mmHg, and administration of mannitol (0.5 g/kg, or 100-200 mL of a 20% solution"
  status: unverified
  tags:
  - high-yield
