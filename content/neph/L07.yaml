    kind: card
    topic: adpkd-novel
    front: What is the rationale for V2 receptor antagonists in ADPKD?
    back: Vasopressin via V2 receptors raises cAMP in the collecting duct, the main site of cyst development, and cAMP drives cystogenesis.
