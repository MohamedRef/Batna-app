  # ------------------------------------------------------------------
  - id: git.L10.lesson6
    title: "مضاعفات الـ GERD وسلّم العلاج"
    hook: "Barrett مش مضاعفة بتوجع، بالعكس، الحرقان ممكن يخف وهو بيتكوّن. وده بالظبط اللي يخوّف."
    minutes: 10
    pages: [288, 298]
    topics: [gerd-complications, gerd-tx]
    goals:
      - "تعرّف الـ Barrett وتعرف مين يتعمله screening وكل قد إيه surveillance"
      - "تعرف الـ peptic stricture والـ bleeding"
      - "تطلع سلّم العلاج من الـ lifestyle للـ surgery، وإمتى تحوّل"
    status: unverified
    steps:
      - kind: explain
        page: 288
        quote: "the squamous epithelium of the esophagus is replaced by metaplastic columnar epithelium containing goblet and columnar cells (specialized intestinal metaplasia)."
        title: "Barrett esophagus"
        text: |
          الـ ==Barrett== = الـ **squamous epithelium** بيتغير لـ **metaplastic columnar** فيه **goblet cells** (specialized intestinal metaplasia).

          - **Endoscopy**: epithelium لونه **orange**، gastric-type، طالع فوق الـ EG junction، circumferential أو tongue-like.
          - **Biopsy** لازم علشان تأكد.
          - بيزوّد الـ **adenocarcinoma** حوالي ==11 مرة==، والـ reflux symptoms ممكن **تخف** وهو بيتكوّن.
      - kind: mnemonic
        page: 288
        quote: "age older than 50 years, truncal obesity, current or prior history of smoking, or male gender)"
        word: "FOMAS"
        parts:
          - { key: "F", text: "Family history of Barrett or esophageal adenocarcinoma" }
          - { key: "O", text: "Obesity (truncal)" }
          - { key: "M", text: "Male gender" }
          - { key: "A", text: "Age over 50 years" }
          - { key: "S", text: "Smoking, current or past" }
        hook: |
          **FOMAS**: راجل فوق الخمسين، بكرش، بيشرب سجاير، وأبوه كان عنده نفس الحكاية. ده اللي يتعمله **screening EGD** لو عنده GERD.
      - kind: explain
        page: 289
        quote: "Surveillance endoscopy every 3–5 years is recommended to look for low- or high-grade dysplasia or adenocarcinoma."
        title: "Screening و surveillance وعلاج"
        text: |
          - GERD مع واحد أو أكتر من الـ risk factors = **screening EGD**.
          - اللي معروف إن عنده **nondysplastic Barrett** مش محتاج screening تاني، محتاج ==surveillance every 3-5 years==.
          - **Endoscopic therapy** (RFA، cautery، resection، dissection) لما يبقى فيه **low-grade** أو **high-grade dysplasia** أو **adenocarcinoma**.
      - kind: table
        page: 291
        quote: "There is full-thickness nuclear stratification and the mucosa has a villous appearance"
        title: "الـ histology في الكتاب"
        columns: ["Grade", "What the pathologist sees"]
        rows:
          - ["Non-dysplastic", "Glandular epithelium with goblet cells"]
          - ["Low-grade dysplasia", "Nuclear stratification in the lower half only"]
          - ["High-grade dysplasia", "Full-thickness stratification, villous mucosa"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: check
        page: 289
        quote: "Endoscopic therapy includes radiofrequency ablation, cautery, resection or dissection is indicated in low grade, high grade dysplasia, or adenocarcinoma."
        question: "Barrett biopsy shows nuclear stratification limited to the lower half. What next?"
        options:
          - "Endoscopic therapy (e.g. radiofrequency ablation)"
          - "Surveillance in 3-5 years only"
          - "No follow-up"
          - "Barium swallow"
        answer: 0
        why:
          - "صح: ده low-grade dysplasia، والـ endoscopic therapy indicated فيه."
          - "الـ 3-5 سنين للـ nondysplastic بس."
          - "فيه dysplasia، لازم تتعامل."
          - "الـ barium مالوش دور هنا."
      - kind: explain
        page: 291
        quote: "It occurs in about 5% of patients with long standing GERD."
        title: "Stricture و bleeding"
        text: |
          - ==Peptic stricture==: في حوالي **5%** من الـ GERD القديم. **solid-food dysphagia** بتزيد ببطء على شهور لسنين، وأغلبها عند الـ **GE junction**. الـ **biopsy إجباري** علشان تفرّقها عن الـ carcinoma، والعلاج **endoscopic dilatation** ممكن على كذا جلسة.
          - **Bleeding**: مش مضاعفة شائعة؛ hematemesis، melena، أو iron deficiency anemia.
      - kind: explain
        page: 292
        quote: "Elevation of the head of the bed by 6 inches."
        title: "الدرجة الأولى: الـ lifestyle"
        text: |
          - **Decrease body weight**.
          - بلاش **fatty diet** و acidic foods.
          - ما تنامش بعد الأكل.
          - ارفع راس السرير ==6 inches==.
          - بطّل **smoking**، وقلّل chocolate و coffee و cola وأدوية بتقلل ضغط الـ LES.
      - kind: aside
        tone: joke
        page: 292
        quote: "Avoid sleeping after meals."
        text: |
          يعني الطاجن بالليل، وبعده كوباية شاي وشوكولاتة، وبعدين تتمدد قدام التلفزيون: ده بالظبط الـ **GERD starter pack**. الكتاب بيقول لأ على كل حتة فيه، وأولهم **sleeping after meals**.
      - kind: explain
        page: 293
        quote: "PPI used once daily for 4-8 weeks is effective in most of the patients especially the heart burn but not for regurgitation symptoms."
        title: "الأدوية"
        text: |
          - **H2 blockers** (famotidine، nizatidine): on demand للأعراض النادرة، أو لو فيه resistance أو intolerance للـ PPI، أو لـ ==nocturnal acid breakthrough== في اللي على PPI.
          - **PPI** مرة يوميًا 4-8 أسابيع: ممتاز للـ **heartburn**، مش للـ **regurgitation**. لو فشل: **twice daily** قبل الفطار وقبل العشا. لو فشل: **endoscopy** تدوّر على severe esophagitis أو mimics (EoE، achalasia).
          - **Long-term PPI**: infectious gastroenteritis (C. difficile)، **SIBO**، ونقص iron و B12 و magnesium.
      - kind: explain
        page: 294
        quote: "Vonoprazan stably accumulates in the acidic secretory canaliculus and noncovalently binds to H+, K+-ATPase with very a very slow dissociation rate"
        title: "Vonoprazan و الباقيين"
        text: |
          - ==Vonoprazan== (P-CAB): في مصر من **2022**. بيشتغل من **أول يوم**، أحسن من PPI في **LA B و C**، وزي الـ lansoprazole في **A و B**. بيتراكم في الـ secretory canaliculus ويمسك الـ H+/K+-ATPase noncovalently وبيسيبها ببطء جدًا.
          - **Prokinetics** (metoclopramide، itopride): **بس** لو فيه gastroparesis.
          - **Baclofen** (GABA-B agonist): بيقلل الـ TLESRs، بس بيعمل dizziness و somnolence.
      - kind: figure
        page: 294
        quote: "It is considered for those with severe reflux disease who are unwilling to accept lifelong medical therapy, in refractory GERD, and uncontrolled regurge symptoms."
        title: "اختيارات ما بعد الدوا"
        alt: "A ladder of GERD treatments from bottom to top: lifestyle; PPI once daily 4-8 weeks; PPI twice daily; endoscopy and pH testing; then three branches: laparoscopic fundoplication, magnetic sphincter augmentation and Roux-en-Y gastric bypass for obesity as surgery, and TIF, Stretta, ARMA and ARMS as endoscopic procedures."
        caption: "السلّم بيطلع درجة درجة. فوق خالص بيتفرّع: جراحة (fundoplication، magnetic ring، RYGB للسمنة) أو منظار (TIF، Stretta، ARMA، ARMS)."
        svg: |
