        question: "عيانة RA عندها multiple sclerosis ومحتاجة biologic. أنهي واحد اتسجّل معاه exacerbation للمرض فتتجنّبه؟"
        options: ["Anti-TNF", "Rituximab", "Abatacept", "Tocilizumab"]
        answer: 0
        why:
