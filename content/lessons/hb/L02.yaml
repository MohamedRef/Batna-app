      - kind: explain
        page: 28
        title: "Metavir: درجتين مش درجة"
        text: |
          الـ **Metavir** هو الأشهر في تقارير الـ biopsy، وبيدّي **two scores**:

          **1. Activity (A):** بيتوقع الـ progression.
          - **A0** no activity، **A1** mild، **A2** moderate، **A3** severe

          **2. Fibrosis (F):**
          - **F0** no fibrosis
          - **F1** portal fibrosis **without septa**
          - **F2** portal fibrosis with **infrequent septa**
          - **F3** **numerous septa** but no cirrhosis
          - **F4** cirrhosis

          والكتاب بيقول: آخر محطة قبل الـ cirrhosis هي **A3F3**. افهمها صح: الـ **A** مش stage، هي النشاط. اللي قبل الـ F4 فعلًا هو الـ **F3**، والكتاب حاطط معاه أعلى activity.
      - kind: aside
        tone: analogy
        page: 28
        text: |
          الـ **A** هي **النار لسه شغالة قد إيه** (activity)، والـ **F** هي **الرماد اللي اتراكم** (fibrosis).

          ممكن يكون عندك نار جامدة ورماد قليل (A3F1، لسه بدري بس خطر)، أو نار هادية ورماد كتير (A1F3). علشان كده الـ Metavir بيدّيك رقمين.
      - kind: match
        page: 28
        prompt: "وصّل كل Metavir stage بوصفه:"
        pairs:
          - ["F0", "No fibrosis"]
          - ["F1", "Portal fibrosis without septa"]
          - ["F2", "Portal fibrosis with infrequent septa"]
          - ["F3", "Numerous septa but no cirrhosis"]
          - ["F4", "Cirrhosis"]
        why: "الـ septa هي المفتاح: مفيش (F1)، قليلة (F2)، كتير (F3)، وبعدين nodules كاملة (F4)."
      - kind: explain
        page: 29
        title: "إمتى الـ LSM يغنيك عن الـ biopsy؟"
        text: |
          الـ algorithm بتاع **Vizzutti** في الكتاب بيقسم الـ LSM لتلات مناطق:

          - لو **6 kPa أو أقل**: الـ **F0–F1**، يعني no significant fibrosis، ومفيش biopsy.
          - لو **12.5 kPa أو أكتر**: الـ **F3–F4**، يعني advanced fibrosis، ومفيش biopsy: علاج أو متابعة.
          - لو بينهم، يعني الـ **grey area** والـ **F2**: اعمل **biopsy if results influence management**، أو استخدم **other non-invasive tests**.

          المنطق: الطرفين واضحين، فالـ biopsy مش هتضيف حاجة. الـ biopsy مكانها المنطقة الرمادية، وبس لو نتيجتها هتغيّر قرارك.
      - kind: check
        page: 29
        question: "A patient with chronic HCV has LSM of 9 kPa. According to the LSM algorithm in the lecture, what is the best approach?"
        options:
          - "Biopsy only if the result would change management, or use other non-invasive tests"
          - "No biopsy: no significant fibrosis"
          - "No biopsy: advanced fibrosis, start treatment or follow-up"
          - "Biopsy in every case, since the reading is abnormal"
        answer: 0
        why:
          - "صح: 9 kPa بين 6 و 12.5 = **grey area (F2)**، يبقى biopsy بس لو هتأثر على الـ management، أو NITs تانية."
          - "ده لـ **6 kPa أو أقل**."
          - "ده لـ **12.5 kPa أو أكتر**."
          - "الكتاب ما بيقولش biopsy لكل حد، بيقول biopsy **if results influence management**."
      - kind: table
        page: 29
        title: "CAP score and steatosis"
        columns: ["CAP score", "Steatosis grade", "Liver with fatty change"]
        rows:
          - ["238–260 dB/m", "S1", "11–33%"]
          - ["260–290 dB/m", "S2", "34–66%"]
          - ["> 290 dB/m", "S3", "≥ 67%"]
        hide: [[0, 1], [1, 2], [2, 0], [2, 2]]
      - kind: aside
        tone: trap
        page: 29
        text: |
          الـ **CAP** و الـ **LSM** بيطلعوا من نفس الجهاز، بس كل واحد بيقيس حاجة:

          - **CAP** بالـ **dB/m** = **الدهون** (steatosis، S1–S3)
          - **LSM** بالـ **kPa** = **الصلابة** (fibrosis، F0–F4)

          لو السؤال قال «290 dB/m» وإنت جاوبت F4، يبقى خلطت الدهن بالتليف.
