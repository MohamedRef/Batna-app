  - id: neph.L11.lesson5
    title: "الضغط والـ preeclampsia على الغسيل"
    hook: "إزاي تشخّص preeclampsia عند ست مش بتعمل بول؟ وإمتى تولّد؟"
    minutes: 9
    pages: [375, 378]
    topics: [dialysis-htn]
    goals:
      - "تقسّم الضغط في الحمل بالـ ACOG وتشخّص الـ preeclampsia على الغسيل"
      - "تفهم آلية الـ preeclampsia ودور الـ sFlt-1/PlGF"
      - "تعرف هدف الضغط، توقيت الولادة، والـ magnesium، والمتابعة"
    status: unverified
    steps:
      - kind: table
        page: 375
        quote: "Hypertension Management Hypertension during pregnancy is associated with many adverse maternal and fetal outcomes, such as maternal cardiovascular complications, fetal morbidity, intrauterine growth restriction, and premature delivery. The American College of Obstetricians and Gynecologists Task Force has classified hypertension in pregnancy into 4 categories: chronic hypertension, gestational hypertension, preeclampsia, and preeclampsia superimposed on chronic hypertension.(70) Chronic hypertension is a pre-existing diagnosis of hypertension before 20 weeks of gestation or persistent hypertension>12 weeks postpartum. Gestational hypertension is new- onset hypertension, defined as BP≥140/90mm Hg after 20 weeks of gestation without any proteinuria or end- organ. Preeclampsia is defined as new-onset hypertension after 20 weeks of gestation with proteinuria (≥300mg/d) or end-organ dysfunction in at least 1 organ. End-organ damage can include thrombocytopenia (platelet count<100,000/ μL,), kidney dysfunction (serum creatinine>1.1mg/dL or doubling of the serum creatinine concentration in the absence of other kidney disease), liver enzymes twice the upper limit of normal range, pulmonary edema, or new-onset cerebral or vision changes. Preeclampsia superimposed on chronic hypertension is new-onset proteinuria or end-organ dysfunction coupled with worsening hypertension after 20 weeks of gestation in women with chronic hypertension. In women treated with dialysis, it is challenging to diagnose preeclampsia especially among those with pre-existing hypertension because of limited utility of urine protein creatinine ratio with anuria. New onset of hypertension after 20 weeks or worsening of hypertension in women with pre- existing hypertension along with classical symptoms (headache, nausea, vomiting, epigastric pain, and visual disturbances) and laboratory abnormalities (hemolysis, thrombocytopenia, liver dysfunction, and high uric acid) of end- organ damage can be used to make a diagnosis of preeclampsia.(70)"
        title: "الضغط في الحمل (ACOG)"
        columns: ["Category", "التعريف"]
        rows:
          - ["Chronic", "قبل 20 أسبوع، أو مكمّل أكتر من 12 أسبوع بعد الولادة"]
          - ["Gestational", "≥140/90 بعد 20 أسبوع، من غير proteinuria ولا end-organ damage"]
          - ["PE", "Preeclampsia: ضغط جديد بعد 20 أسبوع + proteinuria ≥300 mg/d أو end-organ dysfunction"]
          - ["PE on chronic", "Superimposed: chronic hypertension + proteinuria أو end-organ جديد وضغط بيسوء"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: reveal
        page: 375
        quote: "Hypertension Management Hypertension during pregnancy is associated with many adverse maternal and fetal outcomes, such as maternal cardiovascular complications, fetal morbidity, intrauterine growth restriction, and premature delivery. The American College of Obstetricians and Gynecologists Task Force has classified hypertension in pregnancy into 4 categories: chronic hypertension, gestational hypertension, preeclampsia, and preeclampsia superimposed on chronic hypertension.(70) Chronic hypertension is a pre-existing diagnosis of hypertension before 20 weeks of gestation or persistent hypertension>12 weeks postpartum. Gestational hypertension is new- onset hypertension, defined as BP≥140/90mm Hg after 20 weeks of gestation without any proteinuria or end- organ. Preeclampsia is defined as new-onset hypertension after 20 weeks of gestation with proteinuria (≥300mg/d) or end-organ dysfunction in at least 1 organ. End-organ damage can include thrombocytopenia (platelet count<100,000/ μL,), kidney dysfunction (serum creatinine>1.1mg/dL or doubling of the serum creatinine concentration in the absence of other kidney disease), liver enzymes twice the upper limit of normal range, pulmonary edema, or new-onset cerebral or vision changes. Preeclampsia superimposed on chronic hypertension is new-onset proteinuria or end-organ dysfunction coupled with worsening hypertension after 20 weeks of gestation in women with chronic hypertension. In women treated with dialysis, it is challenging to diagnose preeclampsia especially among those with pre-existing hypertension because of limited utility of urine protein creatinine ratio with anuria. New onset of hypertension after 20 weeks or worsening of hypertension in women with pre- existing hypertension along with classical symptoms (headache, nausea, vomiting, epigastric pain, and visual disturbances) and laboratory abnormalities (hemolysis, thrombocytopenia, liver dysfunction, and high uric acid) of end- organ damage can be used to make a diagnosis of preeclampsia.(70)"
        prompt: "إزاي تشخّص preeclampsia عند واحدة على الغسيل ومبتعملش بول خالص؟"
        answer: "الـ PCR ملوش لازمة مع ==anuria==. اعتمد على ضغط جديد أو بيسوء بعد 20 أسبوع + أعراض (headache، nausea، vomiting، epigastric pain، visual) + labs (hemolysis، low platelets، liver dysfunction، **uric acid عالي**)."
      - kind: explain
        page: 376
        title: "ليه بتحصل الـ preeclampsia أصلًا؟"
        quote: "An imbalance of angiogenic factors, increased renin-angiotensin-aldosterone system activity, oxidative stress, immunologic dysfunction, and impaired amino acid metabolism results in abnormal placental perfusion, failure to remodel spiral arteries, and endothelial dysfunction."
        text: |
          الكتاب بيدّي خمس آليات: **angiogenic imbalance**، **RAAS activity**، **oxidative stress**، **immunologic dysfunction**، و **impaired amino acid metabolism**. وكلهم بيوصلوا لتلات حاجات:

          - ==failure to remodel spiral arteries==
          - **abnormal placental perfusion**
          - **endothelial dysfunction**

          التفسير المقبول (مش في الكتاب): الطبيعي إن الـ spiral arteries في الرحم تتوسع وتبقى أنابيب واسعة توصّل دم كتير للمشيمة. لو ده محصلش، المشيمة بتجوع، فبتطلّع **sFlt-1**، والـ sFlt-1 بيبوّظ بطانة الأوعية عند الأم كلها. وفي الكلية ده بيبان **glomerular endotheliosis** و **podocyturia**.

          والخطر على الغسيل كبير: ==1.7-3.6-fold== في الـ cardiovascular mortality.
      - kind: figure
        page: 376
        quote: "Two promising biomarkers, soluble fms-like tyrosine kinase 1 (sFlt-1) and placental growth factor (P1GF), are being studied in the general population to help early detection and management of preeclampsia in pregnant women at risk. During normal pregnancy, P1GF and vascular endothelial growth factor help maintain vascular homeostasis. In patients with preeclampsia, the placenta secretes sFLT1, which binds to circulating P1GF and vascular endothelial growth factor, inhibiting their action and leading to endothelial dysfunction. Measuring SFlt-1 and P1GF can be useful in managing preeclampsia. The Prediction of Short-Term Outcome in Pregnant Women with Suspected Preeclampsia Study was designed to assess the role of SFlt-1/P1GF ratio in predicting the presence or absence of preeclampsia in the short term. The study showed that SFlt-1/P1GF ratio of 38 or less has a high negative predictive value of 99.3% (95% CI, 97.9-99.9) for ruling out preeclampsia within 1 week during the second or third trimester.(73) These studies support the role of using these biomarkers in diagnosing preeclampsia, which may minimize adverse outcomes associated with it, however, the data in the dialysis population are limited. A multicenter randomized clinical trial in the general population, the control of hypertension in pregnancy study, compared tight BP control (diastolic BP of 85mm Hg) to less tight BP control (diastolic BP>100mm Hg), and found"
        title: "الـ sFlt-1 بيسرق الـ placental growth factor"
        alt: "Diagram: the placenta releases sFlt-1, which binds circulating PlGF and VEGF like a sponge, so less free PlGF and VEGF reach the endothelium, causing endothelial dysfunction, hypertension and glomerular endotheliosis. A note says a ratio of 38 or less rules out preeclampsia within one week with NPV 99.3 percent."
        caption: "الـ ==sFlt-1== زي الإسفنجة: بيشفط الـ placental growth factor والـ vascular endothelial growth factor (VEGF)، فالـ endothelium يتعب. علشان كده الـ ratio العالي = preeclampsia، و **≤38** بينفيها لمدة أسبوع."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="N11b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="8" width="150" height="40" rx="8" class="fg-acc"/>
