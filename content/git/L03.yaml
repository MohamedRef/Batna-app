  - id: git.L03.248
    kind: card
    topic: biliary
    front: Why is SOM not indicated in type I biliary SOD?
    back: Sphincter of Oddi manometry (SOM) is normal in 14-35% of these patients, yet sphincterotomy still relieves pain in 90-95%; so endoscopic sphincterotomy is done empirically.
    src: { page: 134, quote: "Because SOM findings may be misleading in these cases (they are normal in 14% to 35% of patients), SOM is not clinically indicated for patients with type I biliary SOD. Rather, endoscopic sphincterotomy can be performed empirically." }
