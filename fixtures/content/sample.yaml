  - id: hb.L01.001
    kind: card
    topic: definition
    front: Anatomical definition of cirrhosis?
    back: A diffuse process with fibrosis and regenerative nodules that disrupts the normal architecture of the liver.
    src: { page: 1, quote: "diffuse process with fibrosis and regenerative nodule formation" }
    status: unverified
  - id: hb.L01.002
    kind: cloze
    topic: child-pugh
    text: "Child-Pugh class A = {{c1::5-6}} points, B = {{c2::7-9}}, C = {{c3::10-15}}."
    src: { page: 14 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L01.003
    kind: mcq
    topic: child-pugh
    stem: >-
      A 58-year-old man with HCV cirrhosis has no encephalopathy, mild ascites, bilirubin 2.5 mg/dL,
      albumin 3.0 g/dL and PT prolonged by 3 seconds. What is his Child-Pugh class?
    options: [Class A, Class B, Class C, Cannot be scored without the INR]
    answer: 1
    why:
      - Class A needs 5-6 points; he has 8.
      - "8 points: encephalopathy 1, ascites 2, bilirubin 2, albumin 2, PT 1."
      - Class C needs 10 points or more.
      - The book's table scores PT as seconds prolonged, so the INR is not needed.
    src: { page: 14 }
    status: unverified
  - id: hb.L01.004
    kind: enumerate
    topic: presentation
    prompt: Enumerate the events that define further decompensation.
    points: [Recurrent variceal bleeding, Recurrent HE, Refractory ascites, SBP, HRS-AKI, Bacterial infections, ACLF]
    pass: 5
    src: { page: 8 }
    status: unverified
  - id: hb.L01.005
    kind: essay
    topic: cardiopulmonary
    prompt: Discuss the cardiopulmonary complications of cirrhosis.
    outline:
      - Hyperdynamic circulatory syndrome: [Features, Cause (systemic vasodilatation via PSS)]
      - Cirrhotic cardiomyopathy: [Definition, Silent at rest, Echo diagnosis]
      - Portopulmonary hypertension: [Definition, Pathogenesis, Treatment]
      - Hepatopulmonary syndrome: [Diagnostic triad, Platypnea and orthodeoxia, LT is the only effective therapy]
    src: { page: 19 }
    status: unverified
    tags: [book-question]
  - id: hb.L01.006
    kind: case
    topic: cardiopulmonary
    stem: A 50-year-old woman with cirrhosis complains of breathlessness that is worse when she sits up.
    steps:
      - reveal: "Room-air ABG: PaO2 72 mmHg, A-a gradient 22 mmHg. PaO2 falls by 6 mmHg on standing."
        question: What is the most likely diagnosis?
        options: [Portopulmonary hypertension, Hepatopulmonary syndrome, Hepatic hydrothorax, Cirrhotic cardiomyopathy]
        answer: 1
        why: Platypnea and orthodeoxia with an A-a gradient above 15 mmHg point to HPS.
      - question: What is the only effective treatment?
        options: [TIPS, Long-term oxygen alone, Liver transplantation, Carvedilol]
        answer: 2
        why: LT improves oxygenation at 1 year. TIPS can worsen shunting.
    src: { page: 21 }
    status: unverified
  - id: hb.L01.007
    kind: table
    topic: child-pugh
    title: Child-Pugh points
    columns: [Variable, "1 point", "2 points", "3 points"]
    rows:
      - [Encephalopathy, None, Stage 1-2, Stage 3-4]
      - [Ascites, Absent, Mild to moderate, Severe]
      - ["Bilirubin (mg/dL)", "<2", "2-3", ">3"]
      - ["Albumin (g/dL)", ">3.5", "2.8-3.5", "<2.8"]
      - ["PT (seconds prolonged)", "<4", "4-6", ">6"]
    blanks: [[2, 1], [3, 2], [4, 3]]
    src: { page: 14 }
    status: unverified
  - id: hb.L01.008
    kind: order
    topic: management
    prompt: Order the steps for coagulopathy in a cirrhotic with variceal bleeding, per the lecture.
    steps:
      - PH-lowering agents
      - Local endoscopic hemostasis
      - Correct coagulopathy only if bleeding is still not controlled
    src: { page: 16 }
    status: unverified
  - id: hb.L01.009
    kind: calc
    topic: child-pugh
    calculator: child_pugh
    stem: "No encephalopathy, mild ascites, bilirubin 2.5 mg/dL, albumin 3.0 g/dL, PT prolonged by 3 s."
    inputs: { encephalopathy: none, ascites: mild, bilirubin_mg_dl: 2.5, albumin_g_dl: 3.0, pt_prolonged_s: 3 }
    expect: Child-Pugh B (8 points)
    interpret: "Class B: 1- and 2-year survival about 80% and 60%."
    src: { page: 14 }
    status: unverified
