  # ------------------------------------------------------------------
  - id: dm.L01.lesson6
    title: "سكر الحمل: الـ placenta بتلعب ضد الـ insulin"
    hook: "92، 180، 153: تلات أرقام، وواحد منهم بس يكفي."
    minutes: 8
    pages: [15, 17]
    topics: [gdm]
    goals:
      - "تعرّف الـ GDM وتشرح ليه الحمل diabetogenic"
      - "تحفظ أرقام الـ one-step OGTT"
      - "تعرف مين ما يحتاجش screening ومين يتعمله بدري"
    status: unverified
    steps:
      - kind: explain
        page: 15
        title: "يعني إيه GDM؟"
        quote: "It is a type of Diabetes with onset or first recognition during the second and third trimesters of pregnancy."
        text: |
          الـ **GDM** = diabetes بيبدأ أو ==first recognized== في الـ **second و third trimesters**.

          - ممكن يختفي بعد الولادة أو لا.
          - **liable to recur** في الحمل اللي بعده.
          - بيحصل في حوالي **2–5%** من الحمل.
      - kind: explain
        page: 15
        title: "ليه الحمل diabetogenic؟"
        quote: "Human placental lactogen has anti-insulin and lipolytic effects. It increases blood glucose levels, thereby making more glucose available to the fetus."
        text: |
          1. ==Human placental lactogen==: **anti-insulin** و **lipolytic**، بيعلّي سكر الأم علشان الجنين ياخد أكتر.
          2. **Steroid hormones** (corticosteroids و progesterone): anti-insulin.
          3. الـ **placenta** بتكسّر شوية insulin.
      - kind: aside
        tone: analogy
        page: 15
        quote: "Human placental lactogen has anti-insulin and lipolytic effects."
        text: "الـ **placenta** زي ابن بيحوّل من حساب أمه من غير ما يستأذن: بتخلّي الـ insulin بتاع الأم يشتغل أقل علشان السكر يفضل في الدم ويعدّي للجنين. لو بنكرياس الأم قدّر يزوّد الـ insulin، تمام. لو ما قدرش: **GDM**."
      - kind: explain
        page: 15
        title: "مين في خطر؟"
        quote: "Having previously delivered a baby weighing more than 4 kilograms."
        text: |
          - **Overweight/obese**، و **physically inactive**
          - **Prediabetes**
          - ==GDM in a previous pregnancy==
          - **PCOS**
          - قريب درجة أولى عنده **diabetes**
          - بيبي قبل كده أكتر من **4 kg**
      - kind: figure
        page: 16
        quote: "The diagnosis of GDM is made when any of the following plasma glucose values are met or exceeded"
        title: "الـ one-step OGTT"
        alt: "A curve of maternal glucose after a 75 gram load at 24 to 28 weeks, with three thresholds: fasting 92, one hour 180, two hours 153 milligrams per decilitre. Any one value met or exceeded diagnoses GDM."
        caption: "**75 g** في أسبوع **24–28**. فيه تلات نقط، و ==any one== value تكفي."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L01d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <path d="M40 190 V15" class="fg-arrow" marker-end="url(#L01d)"/>
            <path d="M40 190 H315" class="fg-arrow" marker-end="url(#L01d)"/>
            <path d="M60 150 Q150 30 180 60 T300 100" class="fg-thin" fill="none"/>
            <circle cx="60" cy="150" r="7" class="fg-dot-acc"/>
            <circle cx="180" cy="60" r="7" class="fg-dot-bad"/>
            <circle cx="300" cy="100" r="7" class="fg-dot-acc"/>
            <text x="60" y="138" text-anchor="middle" class="t-b">92</text>
            <text x="180" y="45" text-anchor="middle" class="t-b">180</text>
            <text x="300" y="86" text-anchor="middle" class="t-b">153</text>
            <text x="60" y="208" text-anchor="middle" class="t-sm">Fasting</text>
            <text x="180" y="208" text-anchor="middle" class="t-sm">1 h</text>
            <text x="300" y="208" text-anchor="middle" class="t-sm">2 h</text>
            <text x="175" y="226" text-anchor="middle" class="t-sm t-mut">75 g, 24–28 weeks; any one value = GDM</text>
          </svg>
      - kind: mnemonic
        page: 16
        quote: "Fasting: 92 mg/dL 1 h: 180 mg/dL 2h: 153 mg/dL"
        word: "92"
        parts:
          - { key: "9", text: "Fasting 92 (أقل من الـ 100 بتاع غير الحامل)" }
          - { key: "2", text: "1 h 180 وبعدين 2 h 153 (السكر بينزل تاني)" }
        hook: "الـ 1-h = **180**، نفس الـ renal threshold بالظبط. الـ fasting **92** أوطى من الـ 100 بتاع غير الحامل، لأن سكر الحامل الصايم أوطى أصلًا. والـ 2-h **153** بين الاتنين. والأهم: **قيمة واحدة** تكفي."
      - kind: check
        page: 16
        quote: "The diagnosis of GDM is made when any of the following plasma glucose values are met or exceeded"
        question: "At 26 weeks: fasting 94, 1 h 172, 2 h 140 mg/dL. Interpretation?"
        options: ["GDM", "Normal: two values are normal", "Repeat at 32 weeks", "Prediabetes"]
        answer: 0
        why:
          - "صح: الـ fasting **94 ≥ 92**، وقيمة واحدة تكفي."
          - "مش محتاج اتنين؛ **any one** value."
          - "التشخيص اتعمل خلاص."
          - "مفيش prediabetes في الـ one-step test."
      - kind: explain
        page: 16
        title: "مين ما يحتاجش screening؟"
        quote: "No screening is needed for any woman fulfilling all the following criteria"
        text: |
          لازم تحقق ==all== الشروط دي:
          1. **Normal body weight**
          2. مفيش **diabetes** في قرايب الدرجة الأولى
          3. مفيش تاريخ **abnormal glucose tolerance**
          4. السن **أقل من 25**
          5. مفيش **poor obstetric outcome** قبل كده

          شرط واحد ناقص = تعمل screening.
      - kind: explain
        page: 17
        title: "الـ high risk: بدري وبالمعايير العادية"
        quote: "Before 15 weeks of gestation, screen for diabetes using the standard diagnostic criteria."
        text: |
          - اللي **planning pregnancy** وعندها risk factors: screen للـ prediabetes والـ diabetes.
          - في الحمل: سكر **venous plasma** بدري في الـ **first trimester**، ==before 15 weeks==، بنفس معايير غير الحامل: أعراض + random **200**، أو fasting **126**، أو 2-h **200**؛ ومن غير unequivocal hyperglycemia: اتنين abnormal.
      - kind: case
        page: 16
        quote: "In individuals who are planning pregnancy, screen those with risk factors for diagnosis of prediabetes or diabetes."
        stem: "32-year-old, BMI 33, PCOS, mother diabetic. Planning her first pregnancy."
        steps:
          - question: "What now, before pregnancy?"
            options: ["Screen for prediabetes or diabetes", "Nothing until 24 weeks", "Start insulin", "Urine glucose only"]
            answer: 0
            why: "عندها risk factors وبتخطط للحمل، فبنعمل **screen** للـ prediabetes والـ diabetes."
          - reveal: "She conceives; early tests are normal. At 26 weeks: fasting 88, 1 h 185, 2 h 150."
            question: "Interpretation?"
            options: ["GDM", "Normal", "Overt diabetes", "Repeat test"]
            answer: 0
            why: "الـ 1-h **185 ≥ 180**، وقيمة واحدة تكفي."
      - kind: try
        items: [dm.L01.095, dm.L01.097, dm.L01.102, dm.L01.104, dm.L01.106]
    recap:
      - "GDM: يبدأ أو يتعرف في الـ trimester التاني والتالت؛ 2–5%؛ ممكن يرجع."
      - "Diabetogenic: HPL (anti-insulin + lipolytic)، steroids، placenta بتكسّر insulin."
      - "One-step: 75 g في 24–28 أسبوع؛ 92 / 180 / 153؛ قيمة واحدة تكفي."
      - "مفيش screening بس لو الخمس شروط كلهم (منهم السن <25)."
      - "High risk: first trimester قبل 15 أسبوع بالمعايير العادية."
