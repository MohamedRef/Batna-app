          علشان تصدّقه، **سكّت الدوشة الأول** (decompression). لو لسه بيصرخ، يبقى فيه حرامي فعلًا. 🚨
      - kind: explain
        page: 326
        title: "الـ imaging: كل جهاز وشغلته"
        text: |
          - **Ultrasound:** بيفرّق malignant من benign بـ **sensitivity 92%** و **specificity 93%**. الشك بييجي من **dilated intrahepatic ducts**، والـ iCCA ممكن تبان **mass**.
          - **CT أو MRI:** **essential** علشان الـ primary mass والـ metastases والـ **vascular invasion** والـ **resectability**. الـ CT بيلاقي الـ primary lesion في حوالي **59%** بس.
          - **MRI:** **the imaging modality of choice**. بيفرّق solid من cystic، وبيدّي size، extent في القنوات، **vascular patency**، extrahepatic extension، nodes و metastases، و **lobar atrophy**. أداءه **comparable to CT**. الورم **hypointense T1** و **hyperintense T2**.
      - kind: table
        page: 327
        title: "الـ CT patterns التلاتة"
        columns: ["Pattern", "What you see"]
        rows:
          - ["Mass-forming", "Low attenuation; peripheral enhancement that fills in slowly (centripetal); capsular retraction; maybe calcification; dilated ducts beyond the mass"]
          - ["Periductal infiltrating", "Duct wall thickening with a narrowed duct, mostly at the hilum; about 20 mm long, longer than benign strictures; enhances; proximal dilatation"]
          - ["Intraductal", "Duct ectasia with or without a mass; a polypoid mass is hypoattenuating before contrast and enhances"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 327
        prompt: "الـ mass-forming CCA بتاخد الـ contrast من **بره لجوه وببطء**. ربط ده بحاجة اتعلمتها في الدرس الأول."
        answer: |
          الـ **desmoplastic reaction**. الكتاب بيقول إن سرعة ومدى الـ enhancement **بيعتمدوا على درجة الـ central fibrosis**.

          الـ fibrous tissue بياخد الـ contrast ببطء ويمسكه، فتلاقي **peripheral enhancement** وبعدين يزحف لجوه (**gradual centripetal**). والتليف نفسه بيشد كبسولة الكبد، فتلاقي **capsular retraction**.
      - kind: explain
        page: 328
        title: "باقي الأدوات"
        text: |
          - **DWI:** شكل **target** (peripherally hyperintense) بيرجّح **CCA على HCC**.
          - **EUS:** بيشوف الـ extrahepatic duct، وبياخد **FNA** من الـ mass والـ nodes، وبيحدد الحجم والمكان.
          - **MR angiography:** non-invasive، للـ **staging** وتحديد الـ resectability.
          - **ERCP:** **tissue diagnosis في 40–70%**، وبتبان **filling defect** أو narrowing. والـ staining بـ CEA و CA 19-9 و CA-50 بيساعد.
          - **MRCP:** sensitivity زي الـ PTC، **non-invasive** ومن غير مخاطر الـ ERCP والـ PTC. عيبه الأساسي: **diagnostic only**، مفيش علاج.
          - **PTC:** sensitivity لحد **92%**. invasive، بنستخدمه لما يكون فيه **complete obstruction** والـ ERCP مش قادرة تشوف اللي **فوق** الورم.
          - **PET:** **sensitivity low** في الـ CCA. دوره الأقوى في **restaging** واكتشاف الـ metastases.
          - **Immunostaining:** markers الـ HCC (**GPC3, HSP70, glutamine synthetase**) أو الـ progenitor (**K19, EpCAM**) علشان تفرّق iCCA من **mixed HCC-CCA**، لو ده هيغيّر الـ management.
      - kind: aside
        tone: trap
        page: 328
        text: |
          **ممنوع** EUS-guided أو percutaneous **biopsy** في **perihilar CCA** اللي ممكن يبقى **transplant candidate**، علشان خطر **tumour dissemination** (الإبرة تنقل خلايا في طريقها).

