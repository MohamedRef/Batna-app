        title: "Low birth weight والنظرة الكاملة"
        text: |
          في ص 38 الكتاب بيعيد قايمة الـ **predictors of progression** وبيضيف عليها ==low birth weight==، وبعدها Figure 15 (**holistic approach**): العلاج مش دوا واحد، ده lifestyle و ضغط وسكر ودهون وأدوية حامية للكلية والقلب مع بعض.

