  - id: neph.L14.lesson8
    title: "فيروسات الكلية والـ hepatorenal"
    hook: "في مصر الـ HCV والـ cirrhosis في كل عنبر باطنة، فالدرس ده هتشوفه بعينك."
    minutes: 8
    pages: [483, 494]
    topics: [hcv, hbv-hiv, hrs]
    goals:
      - "تعرف lesion كل فيروس وعلاجه"
      - "تشخّص HRS-AKI بالمعايير الجديدة"
      - "تعالج HRS بالـ terlipressin والـ albumin"
    status: unverified
    steps:
      - kind: match
        page: 489
        quote: "The most common pattern of glomerular injury seen in HBV infection is MN."
        prompt: "وصّل الفيروس بأشهر lesion:"
        pairs:
          - ["HCV", "Cryoglobulinemic MPGN"]
          - ["HBV", "Membranous nephropathy"]
          - ["HIV", "HIVAN (collapsing FSGS) and others"]
        why: "الـ HCV بيعمل MPGN من الـ cryoglobulins (type II 90%)، وكمان MGN. الـ HBV أشهر حاجة MN. والـ HIV ليه الـ HIVAN، والـ HCV ممكن يعمل FSGS زيه بأذى مباشر للـ podocyte."
      - kind: explain
        page: 485
        title: "Cryoglobulinemic MPGN"
        quote: "The most frequent kidney lesion associated with chronic HCV is MPGN mainly due to cryoglobulinemia-induced vasculitis."
        text: |
          - Subendothelial **IgM و IgG** deposits، ساعات **intraluminal thrombi**.
          - **Double contours** من الـ monocyte interposition.
          - Lobular accentuation و hypercellularity.
          - "EM: **large subendothelial deposits**."
          - **Vasculitis** في **30%**.
      - kind: table
        page: 488
        quote: "We recommend that patients with HCV-associated glomerular disease be treated for HCV (1A)."
        title: "KDIGO و HCV"
        columns: [Situation, Do]
        rows:
          - [Glomerular disease, "Biopsy, then treat HCV (1A)"]
          - [Stable function / non-nephrotic, DAA first]
          - ["Flare, nephrotic or RPGN", "DAA + immunosuppression ± PEX"]
          - [No response to DAA, "Rituximab first-line"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 491
        title: "HBV و HIV"
        quote: "The presence of CKD is not a contraindication for antiretroviral therapy (ART) of HIV infection."
        text: |
          - "**HBV** replicative (DNA ≥2000 IU/mL) مع GN: **nucleos(t)ide analogues**. ومن الـ extrahepatic: **PAN** و cryoglobulinemia."
          - "**HIV** مع CKD أو HIVAN: **ART للكل** بغض النظر عن الـ CD4، والـ CKD **مش** contraindication (START و TEMPRANO)."
      - kind: explain
        page: 491
        title: "HRS: كلية سليمة بس مقفولة"
        quote: "HRS is a functional disease characterised by marked vasoconstriction of the renal arteries"
        text: |
          الـ splanchnic vasodilation ← الجسم يشغّل vasoconstrictors ← ==renal vasoconstriction== جامد. الكلية نفسها **سليمة** (functional).

          دايماً مع **ascites** و advanced circulatory dysfunction.
      - kind: table
        page: 491
        quote: "New diagnostic criteria for HRS-AKI."
        title: "معايير HRS-AKI"
        columns: [Criterion, Detail]
        rows:
          - [Liver, "Cirrhosis, ALF or ACLF"]
          - [Creatinine, "↑ ≥0.3 mg/dL in 48 h or ≥50%"]
          - [Albumin challenge, "No response after 2 days, 1 g/kg/day (max 100 g)"]
          - [Exclude, "Shock, nephrotoxins"]
          - [No parenchymal disease, "Protein <500 mg/d, RBC <50/HPF, normal US"]
          - [FENa, "<0.2% (<0.1% highly predictive)"]
        hide: [[1, 1], [2, 1], [4, 1], [5, 1]]
      - kind: explain
        page: 492
        title: "العلاج"
        quote: "Terlipressin is the most investigated vasoconstrictor in this field."
        text: |
          1. وقّف **diuretics** و **β-blockers** و NSAIDs و nephrotoxins.
          2. ==Terlipressin + albumin== بأسرع وقت:
             - Boluses **0.5-1 mg/4-6 h** لحد **2 mg/4 h**، أو infusion **2→12 mg/day**.
             - Albumin **20-40 g/day**.
          3. كمّل لحد ما الـ creatinine يرجع **في حدود 0.3** من الـ baseline؛ لو مفيش response وقّف خلال **14 يوم**.
          4. **Liver transplant** هو الأمثل.
      - kind: check
