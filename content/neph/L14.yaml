  - id: neph.L14.186
    kind: card
    topic: dysprot
    front: Why are diuretics handled differently in AL amyloidosis and cast nephropathy?
    back: Amyloidosis usually causes nephrotic syndrome needing diuretics; in cast nephropathy diuretics are unnecessary and may be contraindicated.
    src: { page: 500, quote: "In addition, each kidney disease may require individual attention. For example, patients with immunoglobulin-related amyloidosis usually have nephrotic syndrome, which requires diuretic management, while diuretic is not necessary and is potentially contraindicated in light chain cast nephropathy." }
    status: unverified
  - id: neph.L14.187
    kind: card
    topic: dysprot
    front: What decides treatment of MGRS-type kidney disease now?
    back: The nature of the clone producing the M protein, not the renal histology; RAS blockade and traditional immunosuppression rarely prevent ESRD.
    src: { page: 501, quote: "Treatment is no longer decided by the renal histology but rather, is decided by the nature of the clone producing the M protein." }
    status: unverified
  - id: neph.L14.188
    kind: card
    topic: dysprot
    front: Which drug is most important in monoclonal gammopathy glomerular disease, and with what results?
    back: Bortezomib; with cyclophosphamide and dexamethasone, response up to 94%, VGPR 66-71%. Also most effective in MIDD.
    src: { page: 501, quote: "In combination with cyclophosphamide and dexamethasone, bortezomib produced response rates as high as 94%, with 66%-71% having a very good partial response (VGPR)." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.189
    kind: card
    topic: dysprot
    front: How is a very good partial response (VGPR) measured?
    back: "Involved minus uninvolved serum FLC (difference between involved and uninvolved free light chains) <40 mg/L, or >90% fall in difference between involved and uninvolved free light chains; it predicts overall and renal survival."
    src: { page: 501, quote: "Achievement of VGPR, which is measured by either a difference of the involved minus the uninvolved sFLC of <40 mg/L or >90% reduction of difference of the involved minus the uninvolved SFLC, has been found to be associated with significant improvement in overall and renal survival." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.190
    kind: card
    topic: dysprot
    front: How do immunomodulatory drugs compare, and what improves response?
    back: Thalidomide and lenalidomide are less effective at VGPR; autologous stem cell transplant improves hematologic response.
    src: { page: 502, quote: "In one study, immunomodulatory drugs represented by thalidomide and lenalidomide were found to be less effective in achieving VGPR or better responses. Fortunately, the hematologic response can be improved by the addition of autologous stem cell transplant." }
    status: unverified
