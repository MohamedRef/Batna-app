        quote: "Aim for serum bicarbonate > 22 mmol/L. Decreases progression and improves nitrogen balance."
        title: "الـ metabolic acidosis"
        text: |
          الحموضة نفسها بتليّف الكلى (ammonium و endothelin و RAS ← ==tubulointerstitial fibrosis==) وبتكسّر العضلات.

          - امنع الـ severe acidosis: ==bicarbonate < 16==
          - علشان تبطّأ الـ progression: **sodium bicarbonate** وهدف ==> 22 mmol/L==
          - راقب إن العلاج مايعليش الـ HCO3 فوق الطبيعي، ومايبوّظش الضغط أو الـ K أو الـ fluid status
      - kind: order
