        title: "الوراثة"
        alt: "Two family trees. An affected father passes the X with the mutation to every daughter and none of his sons. An affected mother passes it to half of her children on average."
        caption: "الأب المصاب: ==كل البنات== وولا ولد. الأم المصابة: **50%** لكل طفل."
        svg: |
