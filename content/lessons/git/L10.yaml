      - kind: explain
        page: 294
        quote: "Reflux symptoms relapse in 10-30% of the patients, after 5 years most of the patients require acid suppressive therapy."
        title: "الجراحة والمنظار"
        text: |
          - ==Laparoscopic fundoplication==: healing و relief كويسين، بس الأعراض بترجع في **10-30%**، وبعد **5 سنين** أغلبهم بيرجعوا للدوا. لمين؟ severe disease ومش عايز دوا طول عمره، refractory GERD، و regurgitation مش متحكّم فيها.
          - **Magnetic sphincter augmentation**: حلقة مغناطيس حوالين الـ EGJ بتقوّي الـ LES.
          - **RYGB**: للـ morbidly obese مع refractory GERD.
          - **TIF**: regurgitation-predominant **من غير hernia أكبر من 2 cm** ولا advanced esophagitis.
          - **Stretta**: radiofrequency بتعمل LES hypertrophy وتقلل الـ TLESRs.
          - وصفحة 297 فيها صور **ARMA** (ablation) و **ARMS** (mucosal surgery).
      - kind: check
        page: 296
        quote: "especially in patients with regurgitation-predominant symptoms without significant hiatal hernias (>2 cm) or advanced esophagitis."
        question: "Regurgitation-predominant GERD, 1 cm hiatal hernia, LA grade A. Which endoscopic procedure fits best?"
        options:
          - "Transoral incisionless fundoplication (TIF)"
          - "POEM"
          - "Pneumatic dilation"
          - "Roux-en-Y gastric bypass"
        answer: 0
        why:
          - "صح: TIF للـ regurgitation-predominant من غير hernia فوق 2 cm."
          - "الـ POEM لعلاج الـ achalasia، وبيزوّد الـ reflux."
          - "الـ dilation للـ achalasia."
          - "الـ RYGB جراحة للـ morbidly obese."
      - kind: order
        page: 293
        quote: "If once daily PPI is not effective, twice daily PPI (before breakfast and before dinner) can be used."
        prompt: "رتّب سلّم علاج الـ GERD الـ typical من غير alarm:"
        steps:
          - "Lifestyle + once-daily PPI 4-8 weeks"
          - "Twice-daily PPI"
          - "Endoscopy for severe esophagitis or mimics"
          - "pH testing before surgery"
          - "Antireflux procedure"
        why: "كل درجة بتيجي لما اللي قبلها يفشل. والـ pH يتعمل قبل الجراحة علشان تتأكد إن فيه reflux فعلًا."
      - kind: explain
        page: 298
        quote: "Patients with significant dysphagia or other alarm symptoms for upper endoscopy."
        title: "إمتى تحوّل للـ gastroenterologist"
        text: |
          - Typical GERD ما اتحسنش على **twice-daily PPI**.
          - Extraesophageal ما اتحسنش بعد ==3 months== twice-daily PPI.
          - **Dysphagia** واضحة أو أي alarm symptom.
          - **Barrett** للـ surveillance، أو Barrett مع **dysplasia** أو early mucosal cancer.
          - لما تفكر في **surgery**.
