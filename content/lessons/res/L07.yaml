          - { text: "The subject and the observer", bin: 1 }
          - { text: "Subject, observer and analyzer", bin: 2 }
        why: "**Single** = العيان بس (إجابة شريحة 117: subject). **Double** = العيان والـ observer. **Triple** = العيان والـ observer والـ analyzer."
      - kind: aside
