# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: شيت صفحة الكتاب بتعرض اقتباس السؤال أو الكارت نفسه بس، مش سطر من عنصر تاني على نفس الصفحة
  en: The book-page sheet shows only the item's own quote, never a line from another item on the same page
- kind: improved
  ar_eg: كل رقم صفحة واقتباس من الكتاب اتراجع على الكتاب نفسه، وفي فحص بيمنع أي صفحة تتغير من غير مراجعة
  en: Every book page and quote was checked against the book, and a check now stops unreviewed page changes
