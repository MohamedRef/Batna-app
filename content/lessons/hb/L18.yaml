        alt: "Five stacked stage cards. 0 very early: PS 0, single 2 cm or less, preserved liver function; treat with resection, ablation or transplant. A early: PS 0, single 5 cm or less or up to 3 nodules none over 3 cm; resection, ablation or transplant. B intermediate: PS 0, multifocal beyond A; TACE or TARE. C advanced: PS 2 or less, vascular invasion or extrahepatic spread; systemic therapy. D end stage: PS over 2 and/or impaired liver function; hospice care, transplant in selected patients."
