  - id: dm.L23.047
    kind: card
    topic: hofh
    front: "Lomitapide: mechanism, indication and side effects?"
    back: "MTP inhibitor: blocks apo B lipidation, so less VLDL is made. FDA-approved for homozygous FH. Side effects: raised aminotransferases (liver fat) and poor GI tolerability."
    src: { page: 296, quote: "Lomitapide approved for the treatment of homozygous familial hypercholesterolemia by the FDA." }
    status: unverified
    tags: [high-yield]
  - id: dm.L23.048
    kind: card
    topic: hofh
    front: "Mipomersen: mechanism and main safety concerns?"
    back: "A 20-nucleotide antisense oligonucleotide that binds apo B mRNA, lowering apo B production; approved for homozygous FH. Injection-site reactions are most common; the main concern is liver toxicity and steatosis."
    src: { page: 297, quote: "Mipomersen is a synthetic 20-nucleotide antisense oligonucleotide that can bind to ApoB mRNA" }
    status: unverified
    update:
      text: "Mipomersen (Kynamro) is no longer marketed: it was discontinued in 2018-2019. For homozygous FH, evinacumab (an ANGPTL3 antibody) was FDA-approved in 2021."
