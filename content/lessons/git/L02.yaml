      - kind: explain
        remind: [git.L02.082]
        page: 66
        quote: "Using a \"mother-baby-scope\" system. A thin fiberscope (2-3.5 mm) is inserted into a therapeutic channels of a large duodenoscope, into the duct after endoscopic sphincterotomy."
        title: "الـ mother-baby scope"
        text: |
          في الـ **peroral cholangioscopy والـ pancreatoscopy**: منظار رفيع (**baby**، **2-3.5 mm**) بيدخل من الـ channel بتاعة **duodenoscope** كبير (**mother**) جوه الـ duct، **بعد sphincterotomy**.

          الـ biopsy channel بتاعه بيسمح بـ:
          - **Tissue sampling**
          - **Dye** catheters
          - **Laser lithotripsy** probes

          والأجهزة الجديدة بتتجرّب **من غير sphincterotomy**.

          التفسير المقبول (مش في الكتاب): ليه «mother» و«baby»؟ لأن المنظار الكبير بيوصل للـ papilla في الـ duodenum ويثبت قدامها، والصغير بيطلع منه ويدخل القناة الضيقة اللي الكبير ما يقدرش يدخلها.
      - kind: explain
        page: 66
        quote: "The development of fine-caliber flexible scopes (miniscopes) which also provide a biopsy channel, have provided a valuable new tools for a growing number of indications."
        title: "ليه نحتاج منظار جوه الـ duct؟"
        text: |
          الكتاب: الـ ==miniscopes== الرفيعة اللي فيها **biopsy channel** بقت أداة قيّمة لدواعي بتزيد. وبقت **أصغر**، **أمتن**، و**صورتها أحسن**.

          التفسير المقبول (مش في الكتاب): الـ ERCP العادي بيشوف الـ duct **بالصبغة على الأشعة** بس، يعني ظل. فلو فيه stricture مش عارف هي حميدة ولا cancer، أو حصوة كبيرة مش بتطلع، انت محتاج **تشوف بعينك وتاخد عينة أو تكسّر**. الـ baby scope بيدخل جوه الـ duct ويعمل ده: **sampling** للـ stricture، **dye**، و **laser lithotripsy** للحصوة الصعبة.

          وليه **بعد sphincterotomy**؟ علشان الفتحة الطبيعية ضيقة على المنظار، فبنوسّعها الأول. والأجهزة الجديدة بتحاول تستغنى عن الخطوة دي.
      - kind: figure
