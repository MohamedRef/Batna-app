      - kind: explain
        page: 48
        title: "العلاج: إيه اللي تعمله وإيه الممنوع"
        quote: "Not recommended to use antibiotics(has no role) and antiperistaltic(as decrease motility leads to toxin persistence and aggravates the condition) agents"
        text: |
          - **Supportive** الأول: العيان غالبًا **dehydrated**، فبيستفيد من fluid boluses. بس قيّم الكلى كويس، عشان لو فشلت، السوايل الزيادة هتغرّقه.
          - جزء منهم بيعمل **oliguric renal failure** (< 0.5 mL/kg/hr × 72 ساعة) ومحتاج ==dialysis==.
          - ==ممنوع antibiotics و antiperistaltics== للإسهال: الـ antibiotics **ملهاش دور**، والـ antiperistaltics بتبطّأ الأمعاء فالـ **toxin يفضل** جوّه أكتر والحالة تسوء.

          التفسير المقبول (مش في الكتاب) عن الـ antibiotics: البكتيريا وهي بتموت ممكن تطلّع toxin أكتر.
      - kind: explain
        page: 49
        title: "النقل والـ complement"
        quote: "Patients should have their anemia corrected with packed RBCs when hemoglobin reaches 7 to 8 g/dl or hematocrit less than 18%."
        text: |
          - **Packed RBCs** لما الـ Hb يوصل **7–8 g/dL** أو الـ Ht أقل من **18%**.
          - **الصفايح**: غالبًا **مش محتاجين**، لأن الاستهلاك مستمر طول المرض (اللي هتديه هيتصرف)، وفيه قلق إن نقل الصفايح ==يزوّد الجلطات==. الاستثناء: **نزيف نشط** أو قبل **procedure**.
          - **Familial atypical HUS**: hematology consult عشان الـ **plasmapheresis**.
          - الـ FDA وافقت على اتنين monoclonal للـ **atypical HUS**: ==eculizumab== (2011) و **ravulizumab** (2019، من سن شهر). الاتنين ضد **C5**، فبيوقفوا الـ terminal complement.

          ليه بيشتغلوا في الـ atypical بس؟ عشان الـ atypical سببه **complement متفلت**، أما الـ typical فسببه **toxin**.
