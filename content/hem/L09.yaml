  # ---------- p133-134: MPNs and driver mutations ----------
  - id: hem.L09.001
    kind: card
    topic: mpn
    front: Define the myeloproliferative neoplasms (MPNs).
    back: Clonal disorders of hemopoietic stem cells that increase the numbers of one or more mature blood cell progeny.
    src: { page: 133, quote: "clonal disorders of hemopoietic stem cells that lead to an increase in the numbers of one or more mature blood cell progeny." }
    status: unverified
    tags: [high-yield, book-question]
  - id: hem.L09.002
    kind: enumerate
    topic: mpn
    prompt: Enumerate the classical BCR/ABL-negative myeloproliferative neoplasms.
    points: [Polycythemia vera (PV), Essential thrombocythemia (ET), Primary myelofibrosis (PMF)]
    pass: 3
    src: { page: 133, quote: "Polycythemia vera (PV) Essential thrombocythemia (ET) Primary myelofibrosis (PMF)" }
    status: unverified
    tags: [high-yield, book-question]
  - id: hem.L09.003
    kind: cloze
    topic: mpn
    text: "PV, ET and PMF were first grouped together by {{c1::William Dameshek}} in {{c2::1951}}."
    src: { page: 133, quote: "Three related disorders originally grouped together by William Dameshek in 1951." }
    status: unverified
  - id: hem.L09.004
    kind: card
    topic: mpn
    front: What do PV, ET and PMF share, and how can they change over time?
    back: They share clinical, morphological and molecular features. They can transform into one another and, to varying degrees, into acute myeloid leukemia (AML).
    src: { page: 133, quote: "can transform, in their course, into one another. They also have, to varying degrees, the potential to transform into acute myeloid leukemia (AML)." }
    status: unverified
    tags: [high-yield, book-question]
  - id: hem.L09.005
    kind: cloze
    topic: mpn
    text: "The JAK2 V617F mutation is found in about {{c1::half (55%)}} of ET, about {{c2::half}} of PMF and {{c3::nearly all}} cases of PV."
    src: { page: 133, quote: "Approximately half the cases of ET carry the JAK2 V617F mutation (55%), as do half the cases of PMF and nearly all cases of PV." }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L09.006
    kind: cloze
    topic: mpn
    text: "Many JAK2-unmutated ET or PMF patients carry mutations in {{c1::calreticulin (CALR)}} (about {{c2::30%}}); a small proportion (about {{c3::5%}}) carry MPL mutations."
    src: { page: 133, quote: "Many JAK2-unmutated patients with ET or PMF harbor mutations in calreticulin (CALR) (30%) and a small proportion (5%) carry mutations of the thrombopoietin receptor (MPL)." }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L09.007
    kind: card
    topic: mpn
    front: Which protein does the MPL gene encode?
    back: The thrombopoietin (TPO) receptor.
    src: { page: 133, quote: "a small proportion (5%) carry mutations of the thrombopoietin receptor (MPL)." }
    status: unverified
  - id: hem.L09.008
    kind: cloze
    topic: mpn
    text: "The JAK2 gene lies on the {{c1::short (p) arm of chromosome 9}} at position 24 ({{c2::9p24}})."
    src: { page: 134, quote: "It is located on the short (p) arm of chromosome 9 at position 24. (9p24)" }
    status: unverified
  - id: hem.L09.009
    kind: table
    topic: mpn
    title: Driver mutations in the classical MPNs
    columns: [MPN, JAK2 V617F, CALR, MPL]
    rows:
      - [PV, Nearly all, "–", "–"]
      - [ET, "About half (55%)", "About 30% (JAK2-unmutated cases)", "About 5%"]
      - [PMF, About half, "Many of the JAK2-unmutated", "A smaller number"]
    blanks: [[0, 1], [1, 1], [1, 2], [1, 3], [2, 1]]
    src: { page: 133, quote: "Approximately half the cases of ET carry the JAK2 V617F mutation (55%), as do half the cases of PMF and nearly all cases of PV." }
    status: unverified
    tags: [high-yield, book-question]
  - id: hem.L09.010
    kind: mcq
    topic: mpn
    stem: A 58-year-old man has a raised hematocrit, and a driver mutation is found. Which mutation is present in nearly all cases of this MPN?
    options:
      - JAK2 V617F
      - CALR
      - MPL
      - BCR-ABL1
      - No driver mutation is usually found
    answer: 0
    why:
      - "Correct: nearly all PV carries JAK2 V617F (p133)."
      - CALR mutations occur in JAK2-unmutated ET or PMF, not PV.
      - MPL (TPO receptor) mutations are in a small share of ET and PMF.
      - BCR-ABL1 defines CML, which is excluded from the BCR/ABL-negative MPNs.
      - Triple-negative disease is an ET or PMF problem, not PV.
    src: { page: 133, quote: "as do half the cases of PMF and nearly all cases of PV." }
    status: unverified
  # ---------- p135-136: ET epidemiology and WHO criteria ----------
  - id: hem.L09.011
    kind: cloze
    topic: et-diagnosis
    text: "The annual incidence of ET is about {{c1::1.5–2.0 per 100,000}}, similar to that of {{c2::PV}}."
    src: { page: 135, quote: "The annual incidence of ET is similar to that of PV at around 1.5–2.0 cases per 100,000 of the population." }
    status: unverified
    tags: [numbers]
  - id: hem.L09.012
    kind: cloze
    topic: et-diagnosis
    text: "Median age at onset of ET is {{c1::50–55 years}}, with a small second peak in {{c2::women of reproductive age}}; it is rare in {{c3::childhood}}."
    src: { page: 135, quote: "The median age at onset is 50–55 years, with a small second peak in women of reproductive age" }
    status: unverified
    tags: [numbers]
  - id: hem.L09.013
    kind: enumerate
    topic: et-diagnosis
    prompt: Enumerate the WHO major criteria for essential thrombocythemia.
    points:
      - "Platelet count ≥450 × 10⁹/L"
      - "Bone marrow: proliferation mainly of the megakaryocyte lineage, with enlarged mature hyperlobulated megakaryocytes"
      - "Not meeting WHO criteria for BCR-ABL1+ CML, PV, PMF, MDS or other myeloid neoplasms"
      - "Presence of a JAK2, CALR or MPL mutation"
    pass: 4
    src: { page: 135, quote: "Major criteria: 1. Platelet count equal to or greater than 450 x 10⁹/uL" }
    status: unverified
    tags: [high-yield, book-question]
  - id: hem.L09.014
    kind: cloze
    topic: et-diagnosis
    text: "The first WHO major criterion for ET is a platelet count of {{c1::≥450 × 10⁹/L}}."
    src: { page: 135, quote: "Platelet count equal to or greater than 450 x 10⁹/uL" }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L09.015
    kind: card
    topic: et-diagnosis
    front: What does the bone marrow biopsy show in ET (WHO major criterion 2)?
    back: Proliferation mainly of the megakaryocyte lineage, with increased numbers of enlarged mature megakaryocytes with hyperlobulated nuclei; no significant increase or left shift of granulopoiesis or erythropoiesis; very rarely a minor increase in reticulin fibres.
    src: { page: 135, quote: "megakaryocyte lineage with increased numbers of enlarged, mature megakaryocytes with hyperlobulated nuclei." }
    status: unverified
    tags: [high-yield]
  - id: hem.L09.016
    kind: card
    topic: et-diagnosis
    front: Which disorders must be excluded under WHO major criterion 3 for ET?
    back: BCR-ABL1+ CML, PV, PMF, myelodysplastic syndromes and other myeloid neoplasms.
    src: { page: 135, quote: "CML, PV, PMF, myelodysplastic syndromes, or other myeloid neoplasms" }
    status: unverified
  - id: hem.L09.017
    kind: card
    topic: et-diagnosis
    front: What is the WHO minor criterion for ET?
    back: Presence of a clonal marker, or absence of evidence for reactive thrombocytosis.
    src: { page: 135, quote: "Presence of a clonal marker or absence of evidence for reactive thrombocytosis" }
    status: unverified
  - id: hem.L09.018
    kind: cloze
    topic: et-diagnosis
    text: "ET is diagnosed with {{c1::all four major criteria}}, or {{c2::the first three major criteria plus the minor criterion}}."
    src: { page: 135, quote: "Diagnosis of ET requires meeting all four major criteria or the first three major criteria and one of the minor criteria" }
    status: unverified
    tags: [high-yield]
  - id: hem.L09.019
    kind: mcq
    topic: et-diagnosis
    stem: "A 52-year-old woman has platelets of 780 × 10⁹/L on three counts. Marrow shows clusters of enlarged hyperlobulated megakaryocytes with normal granulopoiesis. BCR-ABL1, JAK2, CALR and MPL are all negative. Ferritin, CRP and ESR are normal and there is no infection, bleeding or malignancy. What is the diagnosis?"
    options:
      - Essential thrombocythemia
      - ET cannot be diagnosed without a driver mutation
      - Reactive thrombocytosis
      - Primary myelofibrosis
      - Chronic myeloid leukemia
    answer: 0
    why:
      - "Correct: the first three major criteria plus the minor criterion (no evidence of reactive thrombocytosis) are enough (p135)."
      - The minor criterion replaces the mutation criterion; triple-negative ET is a diagnosis of exclusion.
      - Iron, inflammation, infection, bleeding and malignancy have been excluded.
      - PMF needs megakaryocyte atypia with grade 2–3 fibrosis; granulopoiesis is normal here.
      - BCR-ABL1 is negative.
    src: { page: 135, quote: "Diagnosis of ET requires meeting all four major criteria or the first three major criteria and one of the minor criteria" }
    status: unverified
  # ---------- p136-138: ET complications and transformation ----------
  - id: hem.L09.020
    kind: card
    topic: et-complications
    front: What is the main cause of morbidity and mortality in ET?
    back: Thrombotic complications.
    src: { page: 136, quote: "Thrombotic complications The main cause of morbidity and mortality in ET." }
    status: unverified
    tags: [high-yield]
  - id: hem.L09.021
    kind: cloze
    topic: et-complications
    text: "Thromboses are present in about {{c1::15–20%}} of ET patients at presentation and may be {{c2::arterial or venous}}."
    src: { page: 136, quote: "Thromboses are present in around 15–20% of patients at presentation and may be arterial or venous." }
    status: unverified
    tags: [numbers]
  - id: hem.L09.022
    kind: card
    topic: et-complications
    front: How do splanchnic thromboses in ET compare with PV, and what are they linked to?
    back: They are probably less frequent than in PV and are strongly correlated with the JAK2 V617F mutation.
    src: { page: 136, quote: "the frequency of splanchnic thromboses is probably lower and strongly correlated with presence of the JAK2 V617F mutation." }
    status: unverified
  - id: hem.L09.023
    kind: enumerate
    topic: et-complications
    prompt: Enumerate the risk factors for thrombosis in ET.
    points:
      - Age over 60 years
      - Prior history of thrombosis
      - "Cardiovascular risk factors: diabetes, hyperlipidemia, hypertension, smoking"
      - White cell count at diagnosis
      - Reticulin levels at diagnosis
    pass: 4
    src: { page: 136, quote: "Age over 60 years Prior history of thrombosis." }
    status: unverified
    tags: [high-yield]
  - id: hem.L09.024
    kind: cloze
    topic: et-complications
    text: "Bleeding in ET is more common with platelets above {{c1::1000 × 10⁹/L}}, partly because of an {{c2::acquired von Willebrand disease}}."
    src: { page: 137, quote: "platelet counts above 1000 X10⁹/L and, in at least some cases, this is due to an acquired von Willebrand disease" }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L09.025
    kind: card
    topic: et-complications
    front: How do very high platelet counts cause acquired von Willebrand disease in ET?
    back: High-molecular-weight von Willebrand multimers adsorb onto the surface of the excess platelets, so circulating levels fall.
    src: { page: 137, quote: "a decrease in circulating high-molecular-weight multimers caused by adsorption to the surface of the excessive platelets." }
    status: unverified
  - id: hem.L09.026
    kind: cloze
    topic: et-complications
    text: "Splenomegaly is present in about {{c1::10–20%}} of ET patients at diagnosis and is rarely more than {{c2::mild}}."
    src: { page: 137, quote: "Splenomegaly is present in about 10-20% of ET patients at diagnosis and it is rarely more than mild." }
    status: unverified
    tags: [numbers]
  - id: hem.L09.027
    kind: card
    topic: et-complications
    front: What should progressive enlargement of the spleen during ET raise suspicion of?
    back: Evolving myelofibrosis.
    src: { page: 137, quote: "Progressive enlargement of the spleen during the course of ET should raise suspicion of evolving myelofibrosis." }
    status: unverified
    tags: [high-yield]
  - id: hem.L09.028
    kind: card
    topic: et-complications
    front: Why can some ET patients develop splenic atrophy?
    back: Silent microinfarcts in the splenic microcirculation. Frank hyposplenism and its complications are rare.
    src: { page: 137, quote: "some patients with ET develop splenic atrophy secondary to silent microinfarcts in the splenic microcirculation." }
    status: unverified
  - id: hem.L09.029
    kind: cloze
    topic: et-complications
    text: "Post-ET myelofibrosis occurs in {{c1::10%}} of ET patients; transformation to PV is much rarer, {{c2::1–2% over 10 years}}."
    src: { page: 137, quote: "occurs in 10% of ET patients while transformation to PV is much less common with an incidence of 1-2% over 10 years" }
    status: unverified
    tags: [high-yield, numbers, book-question]
  - id: hem.L09.030
    kind: card
    topic: et-complications
    front: With which ET drug does reticulin fibrosis progress more?
    back: Anagrelide.
    src: { page: 137, quote: "can be influenced by choice of therapy, being more marked in patients treated with anagrelide." }
    status: unverified
  - id: hem.L09.031
    kind: card
    topic: et-complications
    front: Can ET evolve into MDS or AML, and what increases the risk?
    back: Yes, rarely, even when untreated. Cytogenetic abnormalities and treatment with alkylating agents increase the risk.
    src: { page: 137, quote: "The presence of cytogenetic abnormalities and treatment with alkylating agents increase this risk." }
    status: unverified
    tags: [book-question]
  - id: hem.L09.032
    kind: cloze
    topic: et-complications
    text: "About {{c1::3%}} of ET patients treated with hydroxycarbamide alone develop MDS or AML over a median follow-up of {{c2::8 years}}."
    src: { page: 138, quote: "(hydroxyurea) alone develop MDS or AML if followed for a median time of 8 years." }
    status: unverified
    tags: [numbers]
  - id: hem.L09.033
    kind: card
    topic: et-complications
    front: Does hydroxycarbamide as a single agent increase the leukemia risk in ET?
    back: No data show a significant increase over the disease's own risk, but a small effect cannot be excluded.
    src: { page: 138, quote: "there are no data that demonstrates that hydroxycarbamide as a single agent significantly increases the risk of leukemia" }
    status: unverified
  - id: hem.L09.034
    kind: mcq
    topic: et-complications
    stem: "A 66-year-old man with ET for 12 years now has a spleen 8 cm below the costal margin (it was not palpable before), Hb 10.1 g/dL and teardrop cells on the film. What is the most likely explanation?"
    options:
      - Post-ET myelofibrosis
      - Transformation to polycythemia vera
      - Splenic atrophy from microinfarcts
      - Acquired von Willebrand disease
      - Expected course of stable ET
    answer: 0
    why:
      - "Correct: progressive splenic enlargement in ET suggests evolving myelofibrosis, which occurs in 10% (p137)."
      - PV would raise the red cell mass, not cause anemia with teardrops.
      - Microinfarcts shrink the spleen; they do not enlarge it.
      - Acquired vWD causes bleeding with very high platelets, not splenomegaly.
      - Splenomegaly in ET is rarely more than mild; progressive enlargement is not expected.
    src: { page: 137, quote: "Progressive enlargement of the spleen during the course of ET should raise suspicion of evolving myelofibrosis." }
    status: unverified
  - id: hem.L09.035
    kind: mcq
    topic: et-complications
    stem: "A 45-year-old woman with ET has platelets of 1,650 × 10⁹/L and new gum bleeding and bruising. Which mechanism best explains the bleeding?"
    options:
      - Adsorption of large von Willebrand multimers onto the excess platelets
      - Immune thrombocytopenia
      - Splenic sequestration of platelets
      - Vitamin K deficiency
      - Hyposplenism
    answer: 0
    why:
      - "Correct: above 1000 × 10⁹/L, bleeding is often an acquired von Willebrand disease from multimer adsorption (p137)."
      - Her platelet count is very high, not low.
      - Splenomegaly in ET is usually mild and would not cause bleeding with this count.
      - Nothing suggests a coagulation factor deficiency.
      - Hyposplenism raises infection risk; it does not cause bleeding.
    src: { page: 137, quote: "a decrease in circulating high-molecular-weight multimers caused by adsorption to the surface of the excessive platelets." }
    status: unverified
  # ---------- p138-139: investigations and reactive thrombocytosis ----------
  - id: hem.L09.036
    kind: cloze
    topic: thrombocytosis
    text: "A JAK2 V617F, CALR or MPL mutation gives a positive diagnostic criterion in about {{c1::80–90%}} of ET patients."
    src: { page: 138, quote: "provides a very useful positive diagnostic criterion for approximately 80–90% of ET patients." }
    status: unverified
    tags: [numbers]
  - id: hem.L09.037
    kind: card
    topic: thrombocytosis
    front: How is ET diagnosed in triple-negative patients?
    back: As a diagnosis of exclusion, after other clonal blood disorders and reactive thrombocytosis have been ruled out.
    src: { page: 138, quote: "for so-called triple-negative patients, ET remains a diagnosis of exclusion" }
    status: unverified
    tags: [high-yield]
  - id: hem.L09.038
    kind: card
    topic: thrombocytosis
    front: What is the most common cause of thrombocytosis, and its mechanism?
    back: Reactive thrombocytosis, from raised circulating cytokines that stimulate thrombopoiesis.
    src: { page: 138, quote: "Thrombocytosis is most commonly reactive and secondary to increased levels of circulating cytokines that stimulate thrombopoiesis." }
    status: unverified
    tags: [high-yield]
  - id: hem.L09.039
    kind: card
    topic: thrombocytosis
    front: Can reactive thrombocytosis exceed 1000 × 10⁹/L, and does it always come with a raised ESR or CRP?
    back: Yes, occasionally it exceeds 1000 × 10⁹/L. ESR or CRP is usually raised, but not always.
    src: { page: 138, quote: "occasionally, the platelet count can be greater than 1000 X10⁹/L. There is usually evidence of on-going inflammation in the form of ↑ESR or CRP" }
    status: unverified
    tags: [high-yield]
