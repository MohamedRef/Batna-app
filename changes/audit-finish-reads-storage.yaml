# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: لو التطبيق ما عرفش يسجّل إن الدرس خلص أو يحفظ مكانك فيه، بيقولك وفيه زرار «حاول تاني» بدل ما الدرس يرجع من النص
  en: If finishing a lesson or saving your place in it fails, the lesson says so and offers Retry instead of reopening half-way
- kind: fixed
  ar_eg: لو ما عرفش يقرأ مراجعاتك من الجهاز، بيفضل يعرض آخر نسخة سليمة ويقولك في «النهارده» مع زرار «اقرأ تاني»، بدل ما كل الكروت تبان جديدة
  en: If your reviews can't be read, the app keeps the last good copy and says so on Today with a Read again button, instead of every card looking new
- kind: improved
  ar_eg: لو مكان الحفظ على الجهاز ما اتفتحش، الرسالة بتظهر فوق كل الشاشات مع زرار «صدّر بياناتي»، مش في «النهارده» بس
  en: If on-device storage can't open, the warning shows above every screen with an Export button, not only on Today
