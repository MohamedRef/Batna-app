  - id: endo.L04.lesson6
    title: "العضلات والغدد: الـ endocrine myopathy"
    hook: "عيل hypothyroid عضلاته ضخمة زي هرقل، بس ضعيف. والـ CK عالي. إمتى الـ CK بيعلى في أمراض الغدد؟"
    minutes: 9
    pages: [58, 61]
    topics: [myopathy]
    goals:
      - "تعرف القواعد العامة للـ endocrine myopathy وإمتى الـ CK بيعلى"
      - "تفرّق بين myopathy كل غدة"
      - "تعرف ليه الـ diabetic amyotrophy مش myopathy"
    status: unverified
    steps:
      - kind: explain
        page: 58
        quote: "Many endocrine disorders cause weakness. Muscle fatigue is more common than true myopathy. The cause of weakness is not well known. The serum CK is often normal (except in hypothyroidism & hypoparathyroidism & Conn s syndrome) & muscle histology is characterized by atrophy rather than the destruction of muscle fibers. Nearly, all endocrine myopathies respond to treatment."
        title: "قواعد الـ endocrine myopathy"
        text: |
          - الـ **fatigue** أشيع من الـ true myopathy، وسبب الضعف مش معروف كويس.
          - الـ creatine kinase (CK) غالبًا ==طبيعي==، **إلا** في: hypothyroidism، hypoparathyroidism، و Conn's.
          - الـ histology: ==atrophy== مش destruction. وده بيفسّر الـ CK الطبيعي: الـ CK بيطلع في الدم لما الألياف **تتكسر**، والألياف هنا بتصغر بس.
          - وكلهم تقريبًا ==بيتحسنوا بالعلاج==، يعني لو لقيت السبب الهرموني، العضلة بترجع.
      - kind: mnemonic
        page: 58
        quote: "Many endocrine disorders cause weakness. Muscle fatigue is more common than true myopathy. The cause of weakness is not well known. The serum CK is often normal (except in hypothyroidism & hypoparathyroidism & Conn s syndrome) & muscle histology is characterized by atrophy rather than the destruction of muscle fibers. Nearly, all endocrine myopathies respond to treatment."
        word: "HHC"
        parts:
          - { key: "H", text: "Hypothyroidism" }
          - { key: "H", text: "Hypoparathyroidism (after tetany)" }
          - { key: "C", text: "Conn's syndrome (K depletion)" }
        hook: "«الـ CK بيقول HHC»: دول التلاتة اللي الـ CK فيهم بيعلى. أي endocrine myopathy تانية، الـ CK طبيعي."
      - kind: explain
        page: 58
        quote: "Thyroid hormones play an importat role in regulating the metabolism of CHO & lipids as well as the rate of protein synthesis and enzyme production. Thyroid hormones also stimulates calorigenesis in the muscle, increase the muscle demand for vitamins & enhance muscle sensitivity to circulating catecholamines."
        title: "الـ thyroid hormone جوه العضلة"
        text: |
          قبل ما نشوف الأمراض، الكتاب بيقول الـ thyroid hormones بتعمل إيه في العضلة:
          - بتظبط الـ metabolism بتاع الـ CHO والدهون، وسرعة **protein synthesis** وإنتاج الـ enzymes.
          - بتشغّل الـ **calorigenesis** (إنتاج الحرارة) في العضلة.
          - بتزوّد احتياج العضلة للـ **vitamins**.
          - بتخلّي العضلة **أحسس للـ catecholamines** اللي في الدم.

          علشان كده الزيادة والنقص الاتنين بيأذوا: الزيادة بتحرق البروتين فالعضلة تضمر، والنقص بيبطّأ كل حاجة فالعضلة تتقل وتبطأ.
      - kind: explain
        page: 59
        quote: "a) Proximal muscular weakness in about 1/3 of patients.\nb) Muscular camps, pain & stiffness.\nc) Slow muscular contraction in about 25 %of pts.\nd) Serum CK is often high.\ne) Debre- kocher-Semelaigne syndrome. It may occur in severely hypothyroid children esp boys. It is characterized by weakness, slowness of movement & striking muscle hypertrophy, causing an \"infant Hercules appearance\".\nf) Hoffman's syndrome. In adult hypothyroid results in prominant muscle enlargement & weakness with muscle stiffness. The cause of muscle enlargement in these 2 syndromes has not been determined."
        title: "الـ hypothyroid myopathy"
        text: |
          - Proximal weakness في **1/3**، cramps وألم و stiffness، و slow contraction في **25%**. والـ CK غالبًا عالي، يعني ده واحد من الـ HHC.
          - ==Kocher–Debré–Semelaigne==: أطفال hypothyroid بشدة (خصوصًا الولاد)، ضعف وبطء حركة وعضلات ضخمة = «**infant Hercules**».
          - ==Hoffman's==: نفس الصورة في الـ **كبار**، تضخم وضعف مع stiffness.

          ليه العضلة بتكبر؟ الكتاب صريح: «has not been determined». فالمهم تفتكر إن الضخامة هنا **مش قوة**.
      - kind: check
        page: 59
        quote: "f) Hoffman's syndrome. In adult hypothyroid results in prominant muscle enlargement & weakness with muscle stiffness."
        question: "An adult hypothyroid man with big, stiff, weak muscles has:"
        options: ["Hoffman's syndrome", "Kocher–Debré–Semelaigne syndrome", "Cushing's myopathy", "Acromegaly"]
        answer: 0
        why:
          - "صح: Hoffman's للكبار."
          - "ده في الأطفال."
          - "الـ Cushing's فيه wasting، مش تضخم."
          - "مش hypothyroid."
      - kind: explain
        page: 59
        quote: "a) Proximal muscle weakness & atrophy.\nb) Respiratory & even esophageal muscles may be occasionally affected causing dysphagia, dysphonia & aspiration Muscle stretch reflex are often brisk, bulbar.\nc) Periodic paralysis.\nd) Myasthenia Graves.\ne) Progressive ocular myopathy & proptosis (Graves ophthalmopathy).\nf) Serum CK is normal.\ng) The muscle histology usually shows atrophy."
        title: "الـ hyperthyroid myopathy"
        text: |
          - **Proximal weakness و atrophy**، لأن الهرمون الزيادة بيحرق بروتين العضلة.
          - أحيانًا عضلات التنفس والبلع: dysphagia و dysphonia و aspiration، والـ stretch reflexes غالبًا **brisk**.
          - **Periodic paralysis**، و **myasthenia gravis**، و **Graves' ophthalmopathy** (ocular myopathy و proptosis).
          - الـ CK ==طبيعي== والـ histology ==atrophy==، يعني ده عكس الـ hypothyroid في الـ CK.

          ودي إجابة سؤال 13 في ص 76 «effects of hyperthyroidism on the musculoskeletal system».
      - kind: table
        page: 60
        quote: "Adrenal Disorders\n  1- Cushing syndrome:\n    It is the commonest diagnosed endocrine myopathy.\n    Striking proximal muscular wasting.\n    Cushingoid appearance precedes or accompanied myopathy.\n    Histological section demonstrates muscle fiber atrophy.\n  2- Adrenal insufficiency:\n    Commonly, it causes muscle fatigue.\n    Mild objective weakness is less common.\n  3- Primary aldosteronism \"Conn s syndrome\":\n    Persistent proximal muscular weakness & wasting in long standing hyperaldosteronism due to K depletion."
        title: "Myopathy كل غدة"
        columns: ["Disorder", "Key muscle feature"]
        rows:
          - ["Hyperthyroidism", "Proximal weakness + atrophy; periodic paralysis; MG; CK normal"]
          - ["Hyperparathyroidism", "Proximal weakness, wasting, brisk reflexes"]
          - ["Hypoparathyroidism", "Tetany cramps; CK may rise; overt myopathy rare"]
          - ["Cushing's", "Commonest diagnosed; striking proximal wasting"]
          - ["Adrenal insufficiency", "Fatigue; mild weakness less common"]
          - ["Conn's", "Weakness and wasting from K depletion"]
          - ["Acromegaly", "Big but weak muscles; duration, not GH, matters"]
        hide: [[0, 1], [3, 1], [5, 1], [6, 1]]
      - kind: explain
        page: 60
        quote: "2- Hypoparathroidism:\n  An overt myopathy is rare.\n  Muscular cramps (tetany).\n  Serum CK levels may be high 2ry to muscle damage after tetany."
        title: "ليه الـ CK بيعلى في التلاتة دول بالذات؟"
        text: |
          - **Hypoparathyroidism**: الكتاب بيدّي السبب: الـ CK بيعلى «2ry to muscle damage after **tetany**». يعني التقلص الشديد نفسه بيكسّر ألياف.
          - **Conn's**: الضعف والـ wasting جايين من **K depletion** في الـ hyperaldosteronism الطويل. التفسير المقبول (مش في الكتاب): البوتاسيوم الواطي بيخلّي غشا العضلة مش قادر يشتغل، ولما يقع جامد الألياف نفسها بتتأذي فالـ CK يطلع.
          - **Hypothyroidism**: الـ CK «often high» من غير سبب في الكتاب.

          وفي الـ ==Cushing's==: أشيع myopathy متشخصة، والشكل الـ Cushingoid **بيسبقها أو بييجي معاها**، يعني لو مريض عنده wasting من غير ملامح Cushing، دوّر على سبب تاني.
      - kind: aside
        tone: exam
        page: 60
        quote: "Acromegaly\n  Muscle hypertrophy early in the disease.\n  Proximal muscular weakness without atrophy.\n  The muscles appear enlarged but with diminished force.\n  The duration of acromegaly rather than the serum GH levels, correlates with the degree of myopathy."
        text: "سؤال محبوب: في الـ acromegaly، درجة الـ myopathy ماشية مع **مدة المرض** مش مستوى الـ growth hormone (GH). وأشيع endocrine myopathy متشخصة = **Cushing's**."
      - kind: explain
        page: 61
        quote: "Diabetes Mellitus\n  1- Diabetic amyotrophy It is known to be neuropathic, affecting the proximal major nerve trunks & lumbosacral plexus. More appropriate term include \"Diabetic proximal neuropathy & lumbosacral radiculoplexopthy\".\n  2- Ischemic infarction of the thigh musles\n    It occurs in poorly controlled diabetics.\n    Present with acute onset of pain, tenderness & edema of one thigh with a palpable mass.\n    Thigh adductors & biceps femoris are the most ofen affected muscles.\n    CT (MRI can demonstrate focal abnormalities)."
        title: "الـ DM والعضلات"
        text: |
          - ==Diabetic amyotrophy==: اسمها خادع، هي **neuropathic** مش myopathy، لأنها بتصيب الـ proximal major nerve trunks والـ lumbosacral plexus. علشان كده الكتاب بيقول الاسم الأدق «diabetic proximal neuropathy & lumbosacral radiculoplexopathy».
          - ==Thigh muscle infarction==: في السكر **المش متظبط**. ألم مفاجئ و tenderness و oedema في **فخذ واحد** مع mass محسوسة. أكتر عضلات: **adductors** و **biceps femoris**. والـ CT أو الـ magnetic resonance imaging (MRI) بيبيّنوا التغير الموضعي. التفسير المقبول (مش في الكتاب): الأوعية الصغيرة في السكر المش متظبط بتتقفل، فحتة من العضلة تموت زي الـ infarction في أي عضو.
      - kind: check
        page: 61
        quote: "Thigh adductors & biceps femoris are the most ofen affected muscles."
        question: "In diabetic thigh muscle infarction, which muscles are most often affected?"
        options: ["Thigh adductors and biceps femoris", "Quadriceps only", "Gluteal muscles", "Calf muscles"]
        answer: 0
        why:
