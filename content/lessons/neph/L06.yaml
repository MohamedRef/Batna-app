  - id: neph.L06.lesson5
    title: "الـ K الواطي: بيروح فين وليه؟"
    hook: "الـ K بيهرب من تلات أبواب: الأمعاء، جوّه الخلايا، والكلية. اعرف الباب، تعرف العلاج."
    minutes: 10
    pages: [139, 141]
    topics: [hypok]
    goals:
      - "تقسّم أسباب الـ hypokalemia لـ GI و shift و renal و drugs وتعرف ليه كل واحد"
      - "تفهم ليه الـ K الواطي بيعمل ضعف و polyuria وسكر عالي"
      - "تدي K صح: قبل الـ bicarbonate، في saline، وبسرعة محسوبة"
    status: unverified
    steps:
      - kind: explain
        page: 139
        title: "الـ K بيروح فين؟"
        quote: "Villous adenoma of the colon, which causes massive potassium secretion."
        text: |
          **gastrointestinal (GI) losses**: إسهال مزمن (منهم **laxative abuse**)، و ==villous adenoma== في القولون بيفرز K بكميات.

          **Shift جوّه الخلايا**: total parenteral nutrition (TPN) أو enteral feeding (بيطلّعوا insulin)، **insulin**، **beta-2 agonists** (albuterol، terbutaline)، **thyrotoxicosis** (thyrotoxic periodic paralysis)، و familial periodic paralysis.

          والفرق مهم **لأن** الـ shift مؤقت والـ K هيرجع يطلع، فلو عوّضت كتير ممكن يعلى بعدين (التفسير المقبول، مش في الكتاب).
      - kind: explain
        page: 139
        title: "ليه الأمعاء والـ shift بينزّلوا الـ K؟"
        quote: "Villous adenoma of the colon, which causes massive potassium secretion."
        text: |
          الكتاب بيقول الـ ==villous adenoma== بيعمل **massive potassium secretion**، وإن الـ thyrotoxicosis بيعمل كده من **excessive beta-sympathetic stimulation**. والباقي **السبب** فيه بالتفسير المقبول (مش في الكتاب):

          - **إسهال مزمن و laxative abuse**: البراز في الإسهال غني بالـ K، والخسارة اليومية على شهور بتفضّي المخزون.
          - **TPN و enteral feeding**: سكر كتير داخل ← insulin بيطلع ← الـ K يدخل الخلايا.
          - **Insulin و beta-2 agonists**: نفس الـ Na/K-ATPase اللي شفناها في الـ K العالي، بس هنا بتعمل مشكلة.
          - **Thyrotoxic periodic paralysis**: beta stimulation زيادة، فالـ K يدخل الخلايا مرة واحدة والعضلات تقف.

          خلّي بالك: في الـ **shift** الـ K الكلي في الجسم ممكن يبقى طبيعي، هو بس اتنقل مكانه.
      - kind: sort
        page: 140
        quote: "Primary hyperaldosteronism."
        prompt: "Hypokalemia: حط كل سبب في مكانه:"
        bins: ["GI loss", "Shift into cells", "Renal loss", "Drug"]
        cards:
          - { text: "Villous adenoma", bin: 0 }
          - { text: "Laxative abuse", bin: 0 }
          - { text: "Salbutamol", bin: 1 }
          - { text: "Thyrotoxic periodic paralysis", bin: 1 }
          - { text: "Primary hyperaldosteronism", bin: 2 }
          - { text: "Gitelman syndrome", bin: 2 }
          - { text: "Hypomagnesemia", bin: 2 }
          - { text: "Amphotericin B", bin: 3 }
          - { text: "Theophylline", bin: 3 }
        why: "الـ renal: Cushing، Conn، renin tumor، glucocorticoid-remediable congenital adrenal hyperplasia، ==Bartter و Gitelman و Liddle==، renal tubular acidosis، Fanconi، و hypomagnesemia. الـ drugs: diuretics، laxatives، amphotericin، carbenicillin، penicillin جرعات عالية، theophylline."
      - kind: explain
        page: 140
        title: "الكلية بتسرّب ليه؟"
        quote: "Renal potassium losses Adrenal steroid excess (Cushing's syndrome). Primary hyperaldosteronism. Rare renin-secreting tumors."
        text: |
          افتكر من الدرس اللي فات: القرار في الآخر بالـ **aldosterone** وبكمية الـ Na اللي بتوصل للـ distal nephron. **ليه** كل سبب في قايمة الكتاب، بالتفسير المقبول (مش في الكتاب):

          - **Cushing، primary hyperaldosteronism، renin-secreting tumor، glucocorticoid-remediable CAH**: aldosterone أو حاجة شغالة زيه **زيادة** ← K بيخرج أكتر.
          - **Bartter**: كأن العيان واخد ==loop diuretic== طول عمره. **Gitelman**: كأنه واخد **thiazide**. الاتنين بيوصّلوا Na كتير للـ distal nephron فيتبادل مع K.
          - **Liddle**: قناة الـ Na في الـ collecting duct مفتوحة على طول، فكأن في aldosterone من غير aldosterone.
          - **RTA و Fanconi**: الـ tubules بتسرّب bicarbonate وحاجات تانية، وبتسحب K معاها.
          - **Hypomagnesemia**: الـ Mg بيفرمل قناة الـ K في الـ tubule؛ لو قلّ، الـ K يهرب. (هترجعلها في درس الـ Mg.)

          **Drugs**: الـ diuretics نفس فكرة Bartter و Gitelman. الـ **amphotericin B** بيخرّم أغشية الـ tubules. الـ **carbenicillin** والـ penicillin بجرعات عالية بيوصّلوا anions ما بتترجعش فبتشد K معاها. والـ **theophylline** بيدخّل الـ K الخلايا زي الـ beta agonists.
