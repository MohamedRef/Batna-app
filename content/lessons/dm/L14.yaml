        quote: "Diazoxide 300-600 + diuretic therapy"
        text: |
          الـ **surgery** هي العلاج الأساسي لأن 90% adenoma واحد benign. الباقي للي ما ينفعش يعمل عملية أو الورم malignant. التفسير المقبول (مش في الكتاب) لكل واحد:

          - **Diet**: وجبات متكررة وبالليل، عشان ما يدّيش الـ insulin فرصة يوقع السكر وقت الصيام.
          - **Diazoxide 300–600**: بيفتح الـ **K-ATP channels** في الـ beta cell، فبيمنع إفراز الـ insulin. وبيتدّي ==مع diuretic== لأنه بيحبس صوديوم ومية.
          - **Octreotide**: شبه الـ **somatostatin**، والـ somatostatin بطبيعته بيوقف إفراز هرمونات كتير منها الـ insulin.
          - **Streptozotocin**: مادة بتسمّم الـ beta cells بالذات، فبتتدّي للـ malignant insulinoma.
