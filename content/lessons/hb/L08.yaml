        tone: analogy
        page: 135
        quote: "Types of cholestasis resulting from drugs\n| | Canaliculer (Bland Jaundice) | Hepato-canaliculer (Cholestatic Jaundice) | Ductuler (Cholangioler) | Cholangio-destructive (Vanishing bile duct syndrome) | Cholagio-sclerotic (Sclerosing cholangitis) |\n|---|---|---|---|---|---|\n| Bile casts | + | + | +++ | + | + |\n| Portal inflammation | - | + | + | + | + |\n| Hepatocelluler necrosis | - | + | +/- | + | + |\n| Ductal lesion | - | +/- | + | +++ | +++ |\n| Cholangitis | - | +/- | + | + | + |\n| Bilirubin | +++ | +++ | +++ | + to +++ | + to +++ |\n| Alk Phos | <3X | >3X | >3X | >3X | >3X |\n| Cholesterol | +/- | ++ | +/- | +++ | +++ |\n| AST/ALT | <5X | 2-10X | <5X | <5X | <5X |\n| Examples | Contraceptive; Anabolic steroides | Chlorpromazine; Augmentin; Erythromycin | Benoxaprofen | Paraquat; Clorpromazine | Fluxuridine; Scoliocides |"
        text: |
          تخيّل مواسير مية في عمارة:

          - **Bland (canalicular)** = المية مش ماشية بس مفيش حاجة مكسورة: مفيش inflammation ولا duct lesion. (الهرمونات)
          - **Hepatocanalicular** = فيه التهاب في الشقة نفسها كمان، فالـ transaminases أعلى واحد (2–10×).
          - **Cholangiodestructive** = حد بيكسّر المواسير نفسها لحد ما تختفي: **vanishing bile ducts**.
          - **Cholangiosclerotic** = المواسير اتكلّست وضاقت: زي sclerosing cholangitis.
