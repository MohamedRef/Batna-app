- id: res.L14.018
  kind: mcq
  topic: good_test
  stem: 'A blood test gives the same reading every time it is repeated on the same sample, but it misses many people who have
    the disease. The test is:'
  options:
  - Reliable but not valid
  - Valid but not reliable
  - Both reliable and valid
  - Neither reliable nor valid
  answer: 0
  why:
  - Consistent on repetition is reliability; failing to measure what we want (the disease) is poor validity.
  - Its results are consistent, so it is reliable; it is validity that fails.
  - 'Missing many diseased people means it is not measuring what we want: not valid.'
  - It is consistent, so it is reliable.
  src:
    page: 11
    quote: |-
      RELIABILITY is the extent to which the outcomes are consistent when the experiment is repeated more than once.
      DEFINITION
      VALIDITY is the extent to which the instruments that are used in the experiment measure exactly what you want them to measure.
  status: unverified
