        text: "ACR 2020: ULT بقوة لو فيه tophus أو أكتر، أو radiographic damage، أو نوبتين في السنة؛ وبشكل conditional بعد أول نوبة لو CKD 3 أو أكتر، أو urate فوق 9 mg/dL، أو حصوات. الامتحان: إجابة الكتاب."
