          - "الـ FH autosomal dominant."
          - "مش من صفات الـ FH في الكتاب."
      - kind: try
        items: [dm.L21.019, dm.L21.021, dm.L21.022, dm.L21.024, dm.L21.026]
    recap:
      - "FH = Type II، autosomal dominant، relatively common، LDL receptor بايظ."
      - "LDL بيعلى: IDL أكتر يتحول LDL، و LDL بيتشال أبطأ. الـ TG طبيعي."
