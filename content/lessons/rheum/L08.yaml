        title: "أنواع الـ Takayasu على الـ aorta"
        image: { file: rheum/L08-takayasu-types.webp, book: true }
        alt: "Six drawings of the aorta and its branches, labelled I, IIa, IIb, III, IV and V; red shading marks the diseased part. I: the arch branches only. IIa: the branches and ascending aorta with the arch. IIb: as IIa plus the descending thoracic aorta. III: the descending thoracic and abdominal aorta with the renal arteries. IV: the abdominal aorta and renal arteries only. V: the whole aorta and its branches."
