  - id: git.L07.lesson2
    title: "الخطة: shock index، Oakland، وبعدين مين؟"
    hook: "رقم بسيط بيقولك العيان unstable، وscore بيقولك يروّح بيته، وCT بيقولك فين النزيف."
    minutes: 10
    pages: [227, 229]
    topics: [risk, management]
    goals:
      - "تحسب الـ shock index والـ Oakland score"
      - "تمشي على الـ algorithm بتاع Figure 1"
      - "تكتب guidelines for management of lower gastrointestinal bleeding (LGIB) (سؤال كتاب)"
    status: unverified
    steps:
      - kind: explain
        page: 227
        title: "الأدوات: مين بيشوف قد إيه؟"
        quote: "CT angiography: Identifies bleeding rate of 0.5ml/mt as occurs in cases of Angiodysplasia / Tumors / Vasculitis – diagnosed."
        text: |
          - ==Colonoscopy== هو الـ **gold standard**.
          - **Computed tomography (CT) angiography** بيشوف نزيف **0.5 ml/min**.
          - **Radionuclide scan** (Tc sulfur colloid أو tagged red blood cell (RBC)) بيشوف **0.1 ml/min**، يعني أحسّ بس مش بيحدد المكان بدقة.

          ليه الـ scan أحسّ بس أضعف في تحديد المكان؟ التفسير المقبول (مش في الكتاب): الـ **tagged RBCs** بتفضل تلف في الدم ساعات، فبتلقط النزيف البطيء أو المتقطع، بس الصورة النووية مش حادة، والدم اللي نزل بيتحرك جوه القولون فالمكان بيتوه. الـ **CT angiography** صورته واضحة، بس لازم النزيف يبقى شغّال وقت الحقن.
      - kind: explain
        page: 227
        title: "أول سؤال: stable ولا لأ؟"
        quote: "The patients presenting with lower GI bleeding are stratified as unstable or stable (unstable defined as a shock index >1. Shock index=heart rate/SBP"
        text: |
          ==Shock index== = **heart rate ÷ systolic blood pressure (BP)**.

          - أكبر من **1** = **unstable**.
          - الـ **stable** نقسّمه **major** أو **minor** بـ score زي **Oakland**.

          يعني نبض 120 وضغط 100 = 1.2 = unstable، حتى لو الضغط «لسه فوق 90».

          ليه نسبة مش ضغط بس؟ التفسير المقبول (مش في الكتاب): أول ما الدم يقل القلب بيسرّع يعوّض قبل ما الضغط يقع، فالنبض بيعلى بدري والـ SBP بيفضل ماسك شوية. النسبة بتكشف الـ shock وهو لسه compensated.
      - kind: table
        page: 229
        quote: "Table 1: Variables comprising the Oakland score\n| Predictor | Score component value |\n|---|---|\n| Age: <40 | 0 |\n| Age: 40–69 | 1 |\n| Age: ≥70 | 2 |\n| Gender: Female | 0 |\n| Gender: Male | 1 |\n| Previous LGIB admission: No | 0 |\n| Previous LGIB admission: Yes | 1 |\n| DRE findings: No blood | 0 |\n| DRE findings: Blood | 1 |\n| Heart rate: <70 | 0 |\n| Heart rate: 70–89 | 1 |\n| Heart rate: 90–109 | 2 |\n| Heart rate: ≥110 | 3 |\n| Systolic blood pressure: <90 | 5 |\n| Systolic blood pressure: 90–119 | 4 |\n| Systolic blood pressure: 120–129 | 3 |\n| Systolic blood pressure: 130–159 | 2 |\n| Systolic blood pressure: ≥160 | 0 |\n| Haemoglobin (g/L): <70 | 22 |\n| Haemoglobin (g/L): 70–89 | 17 |\n| Haemoglobin (g/L): 90–109 | 13 |\n| Haemoglobin (g/L): 110–129 | 8 |\n| Haemoglobin (g/L): 130–159 | 4 |\n| Haemoglobin (g/L): ≥160 | 0 |\nPatients scoring ≤8, with no other indications for hospital admission are suitable for immediate discharge from Accident and Emergency and outpatient investigation.\nDRE, digital rectal examination; LGIB, lower gastrointestinal bleeding."
        title: "Oakland score (Table 1)"
        columns: [Predictor, Points]
        rows:
          - ["Age <40 · 40–69 · ≥70", "0 · 1 · 2"]
          - ["Female · male", "0 · 1"]
          - ["Previous LGIB admission", "No 0 · yes 1"]
          - ["Blood on DRE", "No 0 · yes 1"]
          - ["HR <70 · 70–89 · 90–109 · ≥110", "0 · 1 · 2 · 3"]
          - ["SBP <90 · 90–119 · 120–129 · 130–159 · ≥160", "5 · 4 · 3 · 2 · 0"]
          - ["Hb g/L <70 · 70–89 · 90–109 · 110–129 · 130–159 · ≥160", "22 · 17 · 13 · 8 · 4 · 0"]
        hide: [[4, 1], [5, 1], [6, 1]]
      - kind: aside
        tone: exam
        page: 228
        quote: "OS <8 carries 95% probability of safe discharge."
        text: |
          الـ **Oakland** هو **أول score معمول مخصوص للـ lower gastrointestinal bleeding (LGIB)** و **externally validated**، وأشطر حاجة فيه إنه يطلّع الـ **low risk**.

          - score **أقل من 8** = **95%** probability of **safe discharge** (والـ footnote بتاع الجدول نفسه بيقول **≤8**، فاكتب الاتنين لو اتسألت).
          - بيتوقع rebleeding و transfusion، بس **ضعيف في الـ mortality**.

          ولاحظ: الـ **Hb** لوحده ممكن يدّي **22 نقطة**، يعني الأنيميا هي اللي بتحرّك الـ score.
      - kind: reveal
        page: 228
        quote: "It can also predict rebleeding and the need for RBC transfusion but is inferior at predicting mortality."
        prompt: "الـ Oakland شاطر في الـ low risk بس ضعيف في الـ mortality. وأي score الكتاب بيقول يتوقع الـ in-hospital death؟"
        answer: |
          الكتاب: الـ Oakland **superior** في إنه يطلّع الـ low risk، وبيتوقع **rebleeding** و **RBC transfusion**، بس **inferior at predicting mortality**. أما الـ **Glasgow-Blatchford score** (من الـ upper GIB) فبيحدد الـ adverse outcomes: rebleeding، transfusion، و **in-hospital death**.

          ليه ده منطقي؟ التفسير المقبول (مش في الكتاب): الـ Oakland اتعمل علشان يجاوب سؤال واحد: **«مين يروّح؟»**. والوفاة في الـ LGIB غالبًا من أمراض العيان التانية مش من النزيف نفسه، والمتغيرات دي مش في الـ score.
      - kind: case
        page: 229
        quote: "Table 1: Variables comprising the Oakland score\n| Predictor | Score component value |\n|---|---|\n| Age: <40 | 0 |\n| Age: 40–69 | 1 |\n| Age: ≥70 | 2 |\n| Gender: Female | 0 |\n| Gender: Male | 1 |\n| Previous LGIB admission: No | 0 |\n| Previous LGIB admission: Yes | 1 |\n| DRE findings: No blood | 0 |\n| DRE findings: Blood | 1 |\n| Heart rate: <70 | 0 |\n| Heart rate: 70–89 | 1 |\n| Heart rate: 90–109 | 2 |\n| Heart rate: ≥110 | 3 |\n| Systolic blood pressure: <90 | 5 |\n| Systolic blood pressure: 90–119 | 4 |\n| Systolic blood pressure: 120–129 | 3 |\n| Systolic blood pressure: 130–159 | 2 |\n| Systolic blood pressure: ≥160 | 0 |\n| Haemoglobin (g/L): <70 | 22 |\n| Haemoglobin (g/L): 70–89 | 17 |\n| Haemoglobin (g/L): 90–109 | 13 |\n| Haemoglobin (g/L): 110–129 | 8 |\n| Haemoglobin (g/L): 130–159 | 4 |\n| Haemoglobin (g/L): ≥160 | 0 |\nPatients scoring ≤8, with no other indications for hospital admission are suitable for immediate discharge from Accident and Emergency and outpatient investigation.\nDRE, digital rectal examination; LGIB, lower gastrointestinal bleeding."
        stem: "35-year-old woman, first episode of bright red bleeding. DRE: blood. Pulse 64, BP 165/90, Hb 165 g/L."
        steps:
          - question: "What is her Oakland score?"
            options: ["1", "0", "4", "8"]
            answer: 0
            why: "Age <40 = 0، female = 0، no previous admission = 0، digital rectal examination (DRE) blood = **1**، HR <70 = 0، systolic blood pressure (SBP) ≥160 = 0، Hb ≥160 = 0. المجموع **1**."
          - question: "Plan?"
            options: ["Discharge with outpatient investigation", "Urgent CT angiography", "Transfuse", "Urgent colonoscopy within 6 hours"]
            answer: 0
            why: "score واطي جدًا = safe discharge. الـ CT angiography (CTA) للنزيف المستمر الخطير، والـ transfusion عند Hb 7 g/dL، والـ urgent colonoscopy ما حسّنتش النتايج."
      - kind: explain
        remind: [git.L07.045]
        page: 228
        title: "الدم والمنظار"
        quote: "A restrictive strategy of red blood cell transfusion (threshold for transfusion at a hemoglobin level of 7 g/dL) in hemodynamically stable patients with LGIB is recommended."
        text: |
          - **Transfusion:** ==restrictive==، عند **Hb 7 g/dL** في العيان الـ stable.
          - **Colonoscopy** لأغلب العيانين اللي اتحجزوا، بس **nonemergent**: الـ urgent جوه **24 ساعة** ما قللش الـ rebleeding ولا الـ mortality.
          - ممكن **تستغنى عنه** لو النزيف وقف وعنده colonoscopy كويس في آخر **12 شهر** بـ prep كويس ورّى **diverticulosis من غير neoplasia**.
          - **CT angiography** أول test في الـ **ongoing hemodynamically significant** hematochezia، وقليل الفايدة لو النزيف بسيط أو وقف. ولو لقى المصدر ← **arteriography and embolization**.
          - **Diverticular stigmata:** **Through-the-scope (TTS) clips** أو **band ligation** أو **coagulation**.

          ليه restrictive؟ التفسير المقبول (مش في الكتاب): الدم المنقول ليه مخاطره (زيادة الـ volume، reactions، عدوى)، والعيان الـ stable بيستحمل Hb 7 كويس. وليه الـ CT angiography قليل الفايدة لما النزيف يهدى؟ لأنه بيشوف الدم وهو **بيخرج** من الوعاء (0.5 ml/min)؛ لو النزيف وقف مفيش حاجة تتشاف.
      - kind: figure
        page: 229
        quote: "Severe Hematochezia\n  IVF resuscitation, PRBC transfusion to threshold >7g/dL (or higher if shock or cardiovascular ischemia), Exclude UGI source* if appropriate\n    Ongoing significant bleeding: CT Angiography**\n      Extravasation\n        Prompt transcatheter angiography with embolization if extravasation seen\n        Consider urgent colonoscopy (large volume purge prep with 4-6L PEG over 3-4 hours) with intervention for specialized centers with expertise in endoscopic hemostasis\n      No Extravasation: Nonurgent colonoscopy\n    Milder LGIB or bleeding has subsided: Nonurgent colonoscopy (with split-dose PEG) vs. observation if bleeding subsides and patient has had recent colonoscopy\n*Risk factors of UGI bleeding include history of peptic ulcer bleeding, portal hypertension, BUN/Cr>30, aspirin/NSAID use, and positive nasogastric lavage\n** Predictors of a positive CTA include the following: performance of a CTA within 4 hours of hematochezia, recent bowel resection or intervention, transfusion of >3 units of PRBC, use of antiplatelets or DOACs, tachycardia, or hypotension. For centers without interventional radiology availability, would consider performing a prompt colonoscopy after resuscitation."
