    front: How does complement clear necrotic cells and subcellular membranes?
    back: Subcellular membranes (mitochondria, endoplasmic reticulum) activate the classical and alternative pathways and are cleared like immune complexes; complement removes dead or dying cells and helps maintain homeostasis.
