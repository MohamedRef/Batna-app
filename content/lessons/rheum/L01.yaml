      - kind: explain
        page: 7
        quote: "Cytokines belong to 6 families\n  Interleukin 1 (IL-1).\n  Hematopoietin family (Class I).\n  Interferon family (Class II).\n  Chemokine family.\n  Tumor necrosis family.\n  Interleukin 17 (IL-17)."
        title: "الست عائلات"
        text: |
          1. **IL-1 family**: IL-1α، IL-1β، IL-1Ra، IL-18، IL-33.
          2. **Hematopoietin (class I)**: IL-2 لـ IL-7، IL-12، IL-13، IL-15، IL-21، GM-CSF، G-CSF.
          3. **Interferon (class II)**: IFN-α، β، γ ومعاهم IL-10، 19، 20، 22، 24.
          4. **Tumour necrosis factor (TNF) family**: TNF-α، TNF-β، CD40 ligand (CD40L)، Fas، B-cell activating factor (BAFF).
          5. **IL-17 family**: IL-17A لـ F.
          6. **Chemokines**: IL-8، chemokine ligand 19 (CCL19)، chemokine ligand 21 (CCL21)، chemokine ligand 2 (CCL2)، chemokine ligand 3 (CCL3).

          كلهم ==أقل من 30 kDa==، وقليل جدًا منهم بيشتغل لوحده.
      - kind: explain
        page: 7
        quote: "All have similarities and few rarely act alone."
        title: "ليه نقسّمهم عائلات؟"
        text: |
          الكتاب بيقول التقسيم ده **based on structural studies**، يعني على حسب **شكل الجزيء**، مش على حسب الوظيفة.

          التفسير المقبول (مش في الكتاب) لفايدة ده: الجزيئات اللي شكلها شبه بعض غالبًا بتمسك **receptors من نفس العيلة** (صفحة 12)، فبتشتغل بنفس الطريقة جوه الخلية. عشان كده:
