          - **Mild** ← non-pharmacological stimulation
          - **Moderate** ← ==pharmacological stimulation==
          - **Severe** ← saliva substitution

          **العين:** artificial tears و gels؛ لو refractory ← **topical immunosuppressive drops** و **autologous serum** drops.
