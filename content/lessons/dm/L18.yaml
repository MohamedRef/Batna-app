  - id: dm.L18.lesson2
    title: "الهجمة: صباع رجل الكبير بالليل"
    hook: "من tophus صغير اتكسر تحت الغضروف، لحد مفصل أحمر مش قادر تلمسه. والـ colchicine بيقطع السلسلة في نص الطريق."
    minutes: 9
    pages: [235, 236]
    topics: [presentation, acute, pathogenesis, acute-tx]
    goals:
      - "تعرف الـ clinical presentations (سؤال كتاب)"
      - "تحفظ أرقام الـ acute attack والـ precipitating factors"
      - "ترتب الـ pathogenesis وتعرف فين الـ colchicine"
    status: unverified
    steps:
      - kind: explain
        page: 235
        title: "أربع صور، ومرحلتين كمان"
        quote: "Clinical presentations: Acute gouty artheritis Tophaceous gout Gouty nephropathy Uric acid stones"
        text: |
          الـ **clinical presentations**:
          1. **Acute gouty arthritis**
          2. **Tophaceous gout**
          3. **Gouty nephropathy**
          4. **Uric acid stones**

          وممكن تقابله في الـ ==intercritical phase== أو في **chronic arthropathy**.
      - kind: explain
        page: 235
        title: "مين بيجيله؟"
        quote: "Only 20% of hyperuricemic persons ever develop clinical gout, depending on the degree of hyperuricemia"
        text: |
          - مرض **adult men** أساسًا، الـ peak **40–45 سنة**، وفي الستات **بعد سن اليأس** (الـ estrogen uricosuric).
          - بس ==20%== بس من اللي عندهم hyperuricemia بيجيلهم gout فعلًا، وده حسب درجة الارتفاع.
      - kind: aside
        tone: exam
        page: 235
        quote: "Only 20% of hyperuricemic persons ever develop clinical gout, depending on the degree of hyperuricemia"
        text: "فخ: **hyperuricemia مش = gout**. 80% عمرهم ما هيتعبوا. التشخيص مش بالتحليل لوحده."
      - kind: figure
        page: 235
        quote: "90% of the first attacks are monoarticular, and 50% of them occur in the 1 st MTPJ (podagra)"
        title: "الهجمة الأولى فين؟"
        alt: "A foot outline with the first metatarsophalangeal joint highlighted as podagra (50% of first attacks), and a ranked list beside it: ankles, heels, knees, wrists, fingers, elbows; rarely shoulders, hips and soft tissues."
        caption: "**90%** monoarticular، ونصهم في الـ **first MTPJ (podagra)**. بعدها بالترتيب: ankles، heels، knees، wrists، fingers، elbows. ونادرًا shoulders و hips."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 230 Q20 160 40 90 Q55 40 85 30 Q120 25 130 60 Q140 120 125 200 Q115 240 80 245 Q50 248 40 230 Z" class="fg-box"/>
            <circle cx="70" cy="40" r="11" class="fg-dot-bad"/>
            <circle cx="96" cy="34" r="7" class="fg-thin"/>
            <circle cx="113" cy="40" r="6" class="fg-thin"/>
            <circle cx="124" cy="52" r="5" class="fg-thin"/>
            <text x="70" y="70" text-anchor="middle" class="t-sm t-b t-bad">1st MTPJ</text>
            <text x="85" y="150" text-anchor="middle" class="t-sm t-mut">foot</text>
            <text x="160" y="30" class="t-b t-bad">Podagra: 50%</text>
            <text x="160" y="48" class="t-sm">of first attacks</text>
            <text x="160" y="66" class="t-sm t-mut">(90% monoarticular)</text>
            <text x="160" y="98" class="t-sm t-b">Then, in order:</text>
            <text x="170" y="118" class="t-sm">1. Ankles</text>
            <text x="170" y="136" class="t-sm">2. Heels</text>
            <text x="170" y="154" class="t-sm">3. Knees</text>
            <text x="170" y="172" class="t-sm">4. Wrists</text>
            <text x="170" y="190" class="t-sm">5. Fingers</text>
            <text x="170" y="208" class="t-sm">6. Elbows</text>
            <text x="160" y="236" class="t-sm t-mut">Rare: shoulders, hips</text>
          </svg>
      - kind: order
        page: 235
        quote: "Other joints are affected in frequency order: ankles, heels, knees, wrists, fingers, elbows"
        prompt: "بعد الـ podagra: رتّب المفاصل من الأكتر للأقل."
        steps:
          - "Ankles"
          - "Heels"
          - "Knees"
          - "Wrists"
          - "Fingers"
          - "Elbows"
        why: "الكتاب ماشي من تحت لفوق تقريبًا: ankle، heel، knee، وبعدين الإيد: wrist، fingers، elbow. الأبرد والأبعد عن القلب الأول."
      - kind: explain
        page: 235
        title: "شكل الهجمة"
        quote: "Precipitating factors include trauma, surgery, infection, alcohol, dietary overindulgence, exercise, and low temperature."
        text: |
          - الهجمة الأولى **very severe and incapacitating**، والجلد **dusky red**.
          - ممكن **fever، malaise، leukocytosis**.
          - **Precipitating factors:** trauma، surgery، infection، ==alcohol==، **dietary overindulgence**، exercise، **low temperature**.
          - بتخف **لوحدها** من ساعات لأسابيع، ويدخل الـ **intercritical phase**.
          - بعدها: هجمات متكررة في مفاصل أكتر، أو **chronic gouty arthritis**، أو ما ترجعش خالص.
      - kind: reveal
        page: 235
        quote: "Precipitating factors include trauma, surgery, infection, alcohol, dietary overindulgence, exercise, and low temperature."
        prompt: "ليه الـ low temperature في القائمة، وليه صباع الرجل بالذات؟"
        answer: |
          الـ **urate** بيدوب أقل في الحرارة المنخفضة. صوابع الرجل أبرد حتة في الجسم وبعيدة عن القلب، فالكريستال بيترسب هناك الأول.

          وده يفسّر ==low temperature== في الـ precipitating factors. (التفسير فسيولوجي.)
      - kind: explain
        page: 236
        title: "الـ pathogenesis: سلسلة"
        quote: "Disruption of a subcortical tophus, resulting in the release of urate crystals into the synovial fluid, is the initial pathogenic event"
        text: |
          1. ==Disruption of a subcortical tophus== ← crystals في الـ synovial fluid (**initial event**)
          2. الـ crystals بتتغطى بـ **IgM** وتتاكل بالـ leukocytes والـ synovial lining cells
          3. الـ leukocytes تطلع **leukotriene B4** و **glycoprotein chemotactic factor** ← **colchicine بيوقف الخطوة دي**
          4. leukocytes أكتر + **Hageman factor، kallikrein، kinins، complement، IL-1β**
          5. **Inflammation:** vasodilation، edema، redness، warmth، pain، swelling
      - kind: order
        page: 236
        quote: "Urate crystals are rapidly coated by IgM, with a subsequent ingestion by leukocytes and synovial lining cells"
        prompt: "رتّب الـ pathogenesis:"
        steps:
          - "Subcortical tophus disrupts"
          - "Crystals coated by IgM, ingested by leukocytes"
          - "LTB4 and chemotactic factor released"
          - "IL-1β, complement, kinins amplify"
          - "Red, hot, swollen joint"
        why: "الـ colchicine بيقطع السلسلة عند الخطوة التالتة (LTB4 والـ chemotactic factor)، والـ IL-1 inhibitors عند الرابعة."
      - kind: check
        page: 236
        quote: "Leukocytes release bioactive mediators, such as leukotriene B4 and glycoprotein chemotactic factor. This step is blocked by colchicine."
        question: "Colchicine blocks which step of the gout attack?"
        options:
          - "Leukocyte release of LTB4 and chemotactic factor"
          - "Conversion of xanthine to uric acid"
          - "Disruption of the subcortical tophus"
          - "Renal tubular reabsorption of urate"
        answer: 0
        why:
          - "صح: p236 بيقول إن الخطوة دي blocked by colchicine."
          - "دي الـ xanthine oxidase (allopurinol، febuxostat)."
          - "الكتاب ما ذكرش دوا بيمنعها."
          - "ده شغل الـ uricosurics زي الـ lesinurad."
      - kind: explain
        page: 236
        title: "علاج الهجمة"
        quote: "Treatment of acute attacks: 1. Joint rest 2. NSAID 3. Colchicine 4. Steroids"
        text: |
          1. **Joint rest**
          2. **NSAID**
          3. **Colchicine**
          4. **Steroids**
          5. في حالات مختارة: ==interleukin inhibitors== (**canakinumab**، **rilonacept**)
      - kind: case
        page: 235
        quote: "90% of the first attacks are monoarticular, and 50% of them occur in the 1 st MTPJ (podagra)"
        stem: "A 45-year-old man wakes at 3 am with a red, hot, exquisitely tender big toe after a wedding dinner and beer."
        steps:
          - question: "Most likely diagnosis?"
            options: ["Acute gouty arthritis (podagra)", "Tophaceous gout", "Gouty nephropathy", "Intercritical gout"]
            answer: 0
            why: "Monoarticular first MTPJ attack after dietary overindulgence and alcohol (p235)."
          - reveal: "Temperature 38 °C, WBC 12,000."
            question: "Does fever rule out gout?"
            options: ["No; fever, malaise and leukocytosis may occur", "Yes; it must be septic", "Yes; gout never causes fever", "Only in women"]
            answer: 0
            why: "Systemic signs of inflammation may occur in acute gout (p235); still think of pyogenic arthritis in the differential (p244)."
          - question: "Treatment of the attack?"
            options: ["Rest plus NSAID, colchicine or steroids", "Start allopurinol only", "Pegloticase", "Rasburicase"]
            answer: 0
            why: "Joint rest, NSAID, colchicine, steroids (p236); urate-lowering drugs are for intercritical and chronic gout."
      - kind: try
        items: [dm.L18.014, dm.L18.018, dm.L18.023, dm.L18.028, dm.L18.032]
    recap:
      - "Presentations: acute arthritis، tophaceous، nephropathy، stones + intercritical و chronic arthropathy."
      - "Peak 40–45 في الرجالة وبعد سن اليأس في الستات. 20% بس من الـ hyperuricemia بيعملوا gout."
      - "90% monoarticular، 50% podagra. Triggers: trauma، surgery، infection، alcohol، أكل، exercise، برد."
      - "Tophus يتكسر ← IgM ← leukocytes ← LTB4 (colchicine) ← IL-1β ← التهاب."
      - "العلاج: rest، NSAID، colchicine، steroids، IL-1 inhibitors."
    practice: [dm.L18.014, dm.L18.015, dm.L18.016, dm.L18.017, dm.L18.018, dm.L18.019, dm.L18.020, dm.L18.021, dm.L18.022, dm.L18.023, dm.L18.024, dm.L18.025, dm.L18.026, dm.L18.027, dm.L18.028, dm.L18.029, dm.L18.030, dm.L18.031, dm.L18.032, dm.L18.033, dm.L18.094]
