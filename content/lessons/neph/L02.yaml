  - id: neph.L02.lesson12
    title: "اليوريك والقلب"
    hook: "مش كل urate عالي يتعالج، وكل مريض CKD قلبه في خطر. اعرف مين تعالج وبإيه."
    minutes: 10
    pages: [55, 59]
    topics: [uric-acid, cvd]
    goals:
      - "تعرف مين يتعالج من الـ hyperuricemia وبإيه وليه"
      - "تعالج النقرس الحاد في الـ CKD"
      - "تعرف قواعد الـ aspirin والـ LDL"
    status: unverified
    steps:
      - kind: sort
        page: 55
        quote: "Figure 28: Potassium absorption rates of plant-based, animal-based, and processed foods. 3.13. Hyperuricemia Recommend people with CKD and symptomatic hyperuricemia should be offered uric acid-lowering intervention (1C)."
        prompt: "علاج خافض لليوريك ولا لأ؟"
        bins: ["Offer urate-lowering", "Do not treat to slow CKD"]
        cards:
          - { text: "Recurrent gout attacks", bin: 0 }
          - { text: "First gout attack, urate 9.5 mg/dL", bin: 0 }
          - { text: "Tophaceous gout", bin: 0 }
          - { text: "Asymptomatic urate 8.5, no gout", bin: 1 }
          - { text: "Asymptomatic urate 10, wish to slow CKD", bin: 1 }
      - kind: explain
        page: 55
        quote: "Xanthine oxidase inhibitors are preferred over uricosuric agents"
        title: "ليه الـ xanthine oxidase inhibitor، وليه مش NSAIDs؟"
        text: |
          الكتاب: الـ **xanthine oxidase inhibitors** أحسن من الـ **uricosurics**، و**مانعالجش** الـ asymptomatic hyperuricemia علشان نبطّأ الـ CKD (2D)، وفي النقرس الحاد **colchicine** أو steroids أحسن من الـ **NSAIDs**.

          التفسير المقبول (مش في الكتاب):

          - الـ **uricosurics** بتشتغل عن طريق الكلية نفسها، فمع GFR واطي تأثيرها ضعيف، وبتعلّي الـ urate في البول فتعمل **stones**. الـ ==xanthine oxidase inhibitor== بيقلّل **تصنيع** الـ urate من الأول.
          - الـ asymptomatic: مفيش دليل إن تنزيل الـ urate بيبطّأ الكلية، والدوا ليه آثار جانبية.
          - الـ ==NSAIDs== بتقلّل الـ prostaglandins اللي بتفتح الـ afferent، فالـ GFR ينزل (وده مكتوب في جدول ص 59).
      - kind: figure
        page: 55
