  - id: rheum.L07.lesson4
    title: "C3 و C5 والـ MAC: الشغل الفعلي"
    hook: "سؤالين كتاب بيتكرروا: activities of activated C3، و biological activities of complement."
    minutes: 10
    pages: [115, 122]
    topics: [c3-c5, mac, activities]
    goals:
