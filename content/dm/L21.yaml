    tags: [numbers]
  - id: dm.L21.004
    kind: mcq
    topic: fredrickson
    stem: "A lipid profile shows raised cholesterol (↑↑) with normal triglyceride. Electrophoresis shows only LDL elevated. Which Fredrickson phenotype?"
    options: [IIa, IIb, III, IV, I]
    answer: 0
    why:
      - "Correct: IIa = LDL alone, TG normal."
      - "IIb raises LDL and VLDL, so TG rises too."
      - "III raises IDL with TG ↑↑↑."
      - "IV raises VLDL; cholesterol normal to ↑."
      - "I raises chylomicrons with TG ↑↑↑↑."
    src: { page: 260, quote: "Fredrickson Classification of Hyperlipidemia" }
    status: unverified
  - id: dm.L21.005
    kind: mcq
    topic: fredrickson
    stem: "Which Fredrickson phenotype is the commonest?"
    options: [IV, IIb, IIa, V, I]
    answer: 0
    why:
      - "Correct: type IV (VLDL) is 45%."
      - "IIb is 40%."
      - "IIa is 10%."
      - "V is 6%."
      - "I is under 1%."
    src: { page: 260, quote: "Fredrickson Classification of Hyperlipidemia" }
    status: unverified
  - id: dm.L21.006
    kind: card
    topic: fredrickson
    front: Which elevated lipoprotein defines Fredrickson type III?
    back: Intermediate-density lipoprotein (IDL) (cholesterol ↑↑, triglycerides (TG) ↑↑↑, under 1%).
    src: { page: 260, quote: "Fredrickson Classification of Hyperlipidemia:\n| Phenotype | Lipoprotein(s) elevated | Serum cholesterol concentration | Serum triglyceride concentration | Relative frequency % |\n| I | Chylomicrons | Normal to ↑ | ↑↑↑↑ | <1 |\n| IIa | LDL | ↑↑ | Normal | 10 |\n| IIb | LDL and VLDL | ↑↑ | ↑↑ | 40 |\n| III | IDL | ↑↑ | ↑↑↑ | <1 |\n| IV | VLDL | Normal to ↑ | ↑↑ | 45 |\n| V | VLDL and chylomicrons | ↑ to ↑↑ | ↑↑↑↑ | 6 |" }
    status: unverified
