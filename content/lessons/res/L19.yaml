    - 'صح: بيسأل عن دقة test، يبقى diagnosis.'
    - مفيش علاج بيتقارن.
    - مش بيتابع اللي هيحصل مع الوقت.
    - مش بيمنع حاجة.
  - kind: check
    page: 120
    quote: |-
      Q 3: A 64 year old obese male who has tried many ways to lose weight presents with a newspaper article about Chitosan (fat-blazer). He asks for your advice.
      The well focused clinical question is:
      A. In elderly patients, can obesity be treated by Chitosan?
      B. In elderly male patients with obesity, does Chitosan, decrease weight?
      C. In male elderly patients, does Chitosan decrease weight?
      D. In elderly patient who failed to lose weight, is Chitosan is effective in decreasing weight?
    question: 'A 64-year-old obese man asks about Chitosan. The well focused question is:'
    options:
    - In elderly male patients with obesity, does Chitosan decrease weight?
    - In elderly patients, can obesity be treated by Chitosan?
    - In male elderly patients, does Chitosan decrease weight?
    - In elderly patients who failed to lose weight, is Chitosan effective?
    answer: 0
    why:
    - 'صح: الـ P كامل (elderly، male، obese) + I + O.'
    - ناقص male.
    - ناقص obesity.
    - ناقص male وobese.
  - kind: try
    items: [res.L19.047, res.L19.048, res.L19.051, res.L19.053]
  recap:
  - 'Therapy: tramadol ضد morphine، I و C بالجرعة.'
  - 'Prognosis: I = مدة المتابعة (5 سنين).'
  - 'Diagnosis: P = المرض، I = الـ test، O = الدقة.'
  - سؤال ناقص C؟ زوّد «compared with placebo».
