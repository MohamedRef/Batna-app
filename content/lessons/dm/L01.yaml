        quote: "♦♦♦ Type 2 Diabetes Type 2 diabetes is caused by a combination of decreased insulin action and inadequate insulin secretion."
        text: |
          الـ **type 2** = ==decreased insulin action== + **inadequate insulin secretion**.

          - **Genetic:** غالبًا **multigenic**.
          - **Environmental:** obesity، sedentary life، physical inactivity، hypertension، dyslipidemia، increased age، smoking، stress.

          ومين بيبدأ الأول؟ الكتاب صريح: **still controversial**.

          التفسير المقبول (مش في الكتاب) لقايمة الـ risk factors: معظمها بيصب في **insulin resistance**. الـ obesity وقلة الحركة بيملّوا العضلة والكبد دهون فيقفلوا بابهم للـ insulin. الـ hypertension والـ dyslipidemia بيمشوا مع نفس الكرش (metabolic syndrome). والسن والتدخين والـ stress بيتعبوا الـ β-cell أو بيطلّعوا هرمونات ضد الـ insulin زي الـ cortisol.
