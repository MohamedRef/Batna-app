      - kind: explain
        page: 23
        quote: "If not informed:\n  Respondents may provide answers but those answers will be misleading.\n  What to do??\n  If it is suspected that many respondents may be uninformed about the topic, “don't know” should be added to the list of response alternatives."
        title: "مش عارف: «don't know»"
        text: |
          الـ respondent اللي **not informed** مش هيسكت؛ هيجاوب أي حاجة، والإجابة هتبقى **misleading**.

          لو شاكك إن ناس كتير مش عارفة الموضوع، زوّد ==don't know== للاختيارات. اسأل عيان سكر «الـ HbA1c target بتاعك كام؟» من غير «مش عارف»، وهتلاقي أرقام عشوائية.
      - kind: explain
        page: 24
        quote: "Pitfalls to Avoid\nAvoid Built-in assumptions\n  Questions that assume familiarity with a given topic:\n  Example: This ANC service is an improvement over our last one. [ 1=strongly disagree, 5=strongly agree]\n  This question assumes that the survey participant has experience with the last ANC service."
        title: "Built-in assumption"
        text: |
          سؤال بيفترض إن الـ respondent **عارف الموضوع**.

          مثال الشريحة: «خدمة الـ antenatal care (ANC) دي أحسن من اللي قبلها» من 1 لـ 5. طب لو دي أول حمل ليها ومشافتش الخدمة القديمة؟ السؤال فيه ==built-in assumption==.
      - kind: check
        page: 25
        quote: "Pitfalls to Avoid\n  The question and answer options don't match.\n  Have you had pain in the last week?\n  [ ] Never [ ] Seldom [ ] Often [ ] Very often\n  – Grammatically incorrect and can be confusing.\n  – Question should be changed to: How often have you had pain in the last week?\" or the response options should be changed to No/Yes."
        question: "\"Have you had pain in the last week? [ ] Never [ ] Seldom [ ] Often [ ] Very often\". Best fix?"
        options: ["\"How often have you had pain in the last week?\" or make the options No/Yes", "Add \"don't know\"", "Split it into two questions", "Put it at the end"]
        answer: 0
        why:
          - "صح: السؤال واختياراته **don't match** (سؤال آه/لأ واختيارات تكرار). صلّح ناحية من الاتنين."
          - "العيان عارف كان عنده ألم ولا لأ."
          - "ده concept واحد، مش double-barreled."
          - "الألم مش موضوع حساس."
      - kind: reveal
        page: 26
        quote: "Pitfalls to Avoid\n  The question and answer options don't match.\n  I am sometimes depressed. [ ] Agree [ ] Disagree\n  Question about intensity is given agree/disagree options.\n  Disagreeing with this statement could mean that the person is often depressed or never depressed."
        prompt: "«I am sometimes depressed. Agree / Disagree». واحد اختار Disagree. يقصد إيه؟"
        answer: |
          مش هتعرف! ممكن يقصد إنه **often depressed** أو **never depressed**. السؤال عن **intensity** واختياراته agree/disagree، فالـ question and answer options don't match.

          الأوضح: «بتحس إنك مكتئب قد إيه؟» واختيارات **frequency**: never، sometimes، often.
      - kind: explain
        page: 28
        quote: "If cannot remember:\n  “Which of these types of cereals did you eat yesterday? ……………”\n  Aided Recall\n  A question that employs aided recall attempts to stimulate the respondent's memory by providing cues related to the event of interest."
        title: "ناسي: unaided ضد aided recall"
        text: |
          - **Unaided recall**: «فاكر أكلت أنهي cereals امبارح؟» من غير أي مساعدة.
          - ==Aided recall==: «أنهي من دول أكلت امبارح؟» وتدّيه لستة. اللستة **cues** بتنشّط الذاكرة.

          زي ما بتسأل العيان «واخد أنهي دوا للضغط؟» وانت ماسك علب الأدوية قدامه.
      - kind: check
        page: 28
        quote: "“Which of these types of cereals did you eat yesterday? ……………”\n  Aided Recall"
        question: "\"Which of these types of cereals did you eat yesterday?\" with a list. This is:"
        options: ["Aided recall", "Unaided recall", "A built-in assumption", "Skip logic"]
        answer: 0
        why:
          - "صح: اللستة cues بتساعد الذاكرة."
          - "الـ unaided من غير لستة: «فاكر أكلت إيه؟»."
          - "السؤال مش بيفترض حاجة."
          - "الـ skip logic بيوديك لسؤال تاني حسب إجابتك."
      - kind: explain
        page: 29
        quote: "Are the Respondents Willing to Answer the Question?\n  Even if respondents are able to answer a particular question, they may be unwilling to do so.\n  Why ??\n  Too much effort involved,\n  Too sensitive information."
        title: "يقدر يجاوب بس مش عايز"
        text: |
          حتى لو المشارك ==يقدر== يجاوب، ممكن ==مايبقاش عايز==. ليه؟

          - ==Too much effort involved==: السؤال محتاج مجهود كبير.
          - Too sensitive information: المعلومة حساسة.

          ليه نفرّق بين «يقدر» و«عايز»؟ لأن الحل مختلف: اللي مش فاكر بتساعده الـ recall، واللي مش عايز بتسهّل عليه أو بتطمّنه. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 31
        quote: "In the list that follows, please check all the investigations you did during the last 3 months.\n  1. CBC ____\n  2. Blood glucose level ____\n  3. Urine analysis ____\n  4. ECG ____\n  16. ABG ____\n  17. Echocardiography ____"
        title: "مش عايز يجاوب: too much effort"
        text: |
          قادر يجاوب بس **unwilling** ليه؟ يا السؤال **متعب**، يا **حساس**.

          «اكتب كل التحاليل اللي عملتها آخر 3 شهور» = مجهود كبير، فهيسيبها فاضية. الحل: **لستة يعلّم عليها**: complete blood count (CBC)، blood glucose، urine analysis، electrocardiogram (ECG)... لحد arterial blood gas (ABG) والـ echocardiography.
      - kind: explain
        page: 32
        quote: "Too sensitive;\n  Information of a personal or highly sensitive nature may be difficult to obtain from respondents.\n  Consider the demographic and cultural characteristics of your potential participants.\n  – Examples of sensitive topics include:\n    Money,\n    Family life,\n    Political and religious beliefs, and\n    Involvement in accidents or crimes."
        title: "أمثلة الموضوعات الحساسة"
        text: |
          المعلومات الشخصية أو ==الحساسة جدًا== صعب تاخدها من المشاركين، وخلي بالك من ==الخلفية الديموغرافية والثقافية== بتاعتهم.

          أمثلة المحاضرة:

          - Money
          - Family life
          - Political and religious beliefs
          - Involvement in accidents or crimes

          ليه الثقافة مهمة؟ لأن الحساس عند ناس ممكن يبقى عادي عند ناس تانية، فلازم تعرف جمهورك قبل ما تحدد. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 33
        quote: "What to do??\n  To increase the likelihood of obtaining sensitive information, such topics should be placed at the end of the questionnaire.\n  – By then, rapport has been created and legitimacy of the project established, making respondents more willing to give information."
        title: "Too sensitive: حطّه في الآخر"
        text: |
          الـ **sensitive topics** (فلوس، حياة عائلية، معتقدات سياسية ودينية، حوادث أو جرايم) صعب تاخدها. فكّر في الـ demographic والـ cultural characteristics بتوعك.

          الحل: حطّها في ==at the end of the questionnaire==. وقتها الـ **rapport** اتبنى والبحث بقى له **legitimacy**، فالناس بتبقى أكتر استعداد تحكي.
      - kind: aside
        tone: joke
        page: 33
        quote: "To increase the likelihood of obtaining sensitive information, such topics should be placed at the end of the questionnaire."
        text: |
          تخيّل أول سؤال في الـ questionnaire: «مرتبك كام بالظبط؟». ده مش سؤال، ده **باب في وشك**.

          اسأل عن السن والشغل والأكل الأول، و**الفلوس في الآخر**، وبـ **categories** كمان.
      - kind: check
        page: 33
        quote: "To increase the likelihood of obtaining sensitive information, such topics should be placed at the end of the questionnaire."
        question: "To increase the likelihood of obtaining sensitive information, such topics should be placed:"
        options: ["At the end of the questionnaire", "At the beginning", "Just after the demographic information", "In the middle part"]
        answer: 0
        why:
          - "صح: الـ rapport والـ legitimacy بيكونوا اتبنوا."
          - "في الأول مفيش rapport لسه، وممكن يقفل الـ survey."
          - "لسه بدري؛ الـ legitimacy ماتبنتش."
          - "أحسن من الأول، بس الشريحة قالت الآخر."
      - kind: explain
        page: 34
        quote: "Too sensitive;\n  What is your household's annual income?\n  Which one of the following categories best describes your household’s annual income?\n  __ under $25,000\n  __ $25,001-$50,000\n  __ $50,001-$75,000\n  __ over $75,000"
        title: "واسأل الحساس بـ categories"
        text: |
          بدل «**annual income** بتاعك كام؟» (رقم مفتوح)، اسأل: «أنهي **category** بتوصف دخلك السنوي؟» واختيارات زي under $25,000، $25,001–$50,000...

          الفئة أخف على الـ respondent من الرقم بالظبط.
      - kind: try
        items: [res.L10.023, res.L10.029, res.L10.031]
    recap:
      - "مش قادر: not informed ← زوّد «don't know»؛ ناسي ← aided recall (لستة cues)."
      - "Built-in assumption: سؤال بيفترض إنه عارف الموضوع (خدمة الـ ANC القديمة)."
      - "السؤال لازم يطابق اختياراته: question and answer options match."
      - "مش عايز: متعب ← checklist؛ حساس ← في الآخر وبـ categories."
    practice: [res.L10.023, res.L10.024, res.L10.025, res.L10.026, res.L10.027, res.L10.028, res.L10.029, res.L10.030, res.L10.031, res.L10.032, res.L10.033]
  # ------------------------------------------------------------------
  - id: res.L10.lesson4
    title: "Open ولا closed؟ والاختيارات تبقى كام"
    hook: "سؤال مفتوح بيديك كنز، بس تحليله كابوس. سؤال مقفول سهل، بس عمله صعب."
    minutes: 6
    pages: [36, 43]
    topics: [structure]
    goals:
      - "تفرّق بين open-ended وclosed-ended"
      - "تعرف عيوب الـ open-ended"
      - "تكتب اختيارات mutually exclusive وcollectively exhaustive"
    status: unverified
    steps:
      - kind: explain
        page: 36
        quote: "Unstructured Questions\n  Unstructured questions are Open-ended Questions that respondents answer in their own words.\n  They are also referred to as free-response or free-answer questions."
        title: "Unstructured = open-ended"
        text: |
          الـ **unstructured questions** هي ==open-ended questions==: المشارك بيجاوب ==بكلامه==.

          اسمها كمان ==free-response== أو free-answer questions.

          ليه بنستخدمها؟ لأنك مش بتحدد الإجابات مقدمًا، فممكن تطلعلك حاجات ماكنتش متوقعها. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 37
        quote: "When to use it??\n  As first questions on a topic.\n  They enable the respondents to express general attitudes and opinions without the bias associated with restricting responses to predefined alternatives\n  This can help the researcher interpret their responses to structured questions.\n  »Useful in exploratory research."
        title: "Unstructured (open-ended) questions"
        text: |
          ==Open-ended questions== = الـ respondent بيجاوب **بكلامه**؛ اسمها كمان free-response أو free-answer.

          بنستخدمها:
          - **كأول أسئلة** في موضوع: يعبّر عن رأيه من غير bias الاختيارات الجاهزة، وده بيساعدك تفهم إجاباته على الـ structured questions.
          - في الـ **exploratory research**.

          عيبها: بتاخد وقت فممكن يسيبها أو يقفل الـ survey، والـ recording والـ **coding** والـ tabulation والـ analysis معقدين.
      - kind: explain
        page: 38
        quote: "Disadvantages\n  These questions may require extra time or can be challenging to answer, so participants may skip the questions or abandon the survey.\n  Complexity of Recording, data Coding, Tabulation, and Analysis."
        title: "عيوب الـ open-ended"
        text: |
          - ممكن تاخد ==وقت زيادة== أو تبقى صعبة، فالمشارك ==يسيب السؤال أو يقفل الـ survey كله==.
          - ==Complexity== في الـ recording والـ data coding والـ tabulation والـ analysis.

          ليه التحليل صعب؟ كل واحد كتب بأسلوبه، فلازم تقرا كل إجابة وتحطها في category بإيدك قبل ما تعدّ أي حاجة. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 39
        quote: "Structured Questions (Closed-ended Questions)\n  Structured questions specify the set of responses as well as their format.\n  A structured question may offer multiple-choices, or a scale."
        title: "Structured = closed-ended"
        text: |
          الـ **structured questions** بتحدد ==مجموعة الإجابات وشكلها== مقدمًا.

          ممكن تبقى ==multiple choices== أو ==scale==.

          ليه بتسهّل الشغل؟ لأن كل الناس بتختار من نفس القايمة، فالإجابات بتتعدّ على طول من غير تفسير. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 40
        quote: "Closed-ended Questions\n  The researcher provides a choice of answers, and respondents are asked to select one or more of the alternatives given.\n  Answers can be \"yes/no\" or a choice of multiple answers."
        title: "Structured (closed-ended) questions"
        text: |
          ==Closed-ended questions==: انت بتحدد الإجابات وشكلها، وهو بيختار واحدة أو أكتر: **yes/no**، أو **multiple choice**، أو **scale**.

          «عندك سكر؟ آه / لأ». «زرت الدكتور كام مرة الشهر اللي فات؟ مرة، مرتين، 3، أكتر من 3، مش متأكد».
      - kind: explain
        page: 42
        quote: "Two concerns in designing closed-ended questions:\n  (1) Number of alternatives that should be included.\n  (2) Order or position bias."
        title: "حاجتين تاخد بالك منهم في الـ closed"
        text: |
          لما تصمم closed-ended question فيه قلقين:

          1. ==Number of alternatives==: كام اختيار تحط.
          2. ==Order or position bias==: ترتيب الاختيارات بيأثر على الإجابة.

          ليه؟ اختيارات ناقصة بتجبر المشارك على إجابة مش صح، والترتيب بيخلي ناس تختار أول اختيار من غير ما تقرا الباقي. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 43
        quote: "Number of alternatives\n  Closed-ended questions should include choices that cover the full range of possible alternatives.\n  The alternatives should be mutually exclusive and collectively exhaustive."
        title: "الاختيارات: تغطي كل حاجة ومتتداخلش"
        text: |
          في الـ closed-ended خلي بالك من حاجتين: **number of alternatives** و**order bias**.

          الاختيارات لازم تبقى:
          - ==mutually exclusive==: مفيش إجابة تقع في خانتين.
          - ==collectively exhaustive==: كل الإجابات الممكنة ليها خانة.

          وزوّد «**other (please specify)**» لما يلزم، وقول بوضوح: «اختار واحدة» ولا «اختار كل اللي ينطبق».

          مثال الدكتورة في الشرح: في الدخل اكتب «1000 لأقل من 2000» ثم «2000 لأقل من 3000»، مش «1000–2000» و«2000–3000»؛ عشان نفس الحد (2000) مايتكررش في خانتين.
      - kind: check
        page: 43
        quote: "The alternatives should be mutually exclusive and collectively exhaustive.\n  » Example: How many times in the past month have you visited your physician? [ 0 1-2 3-4 5 or more]"
        question: "\"How many times in the past month have you visited your physician?\" Best set of alternatives?"
        options: ["0 / 1-2 / 3-4 / 5 or more", "0 / 1-2 / 2-4 / 4 or more", "1-2 / 3-4 / 5-6", "Rarely / Sometimes / Often"]
        answer: 0
        why:
          - "صح: mutually exclusive وcollectively exhaustive، زي الشريحة."
          - "2 و4 كل واحد في خانتين: مش mutually exclusive."
          - "اللي مزارش خالص أو زار 7 مرات مالوش خانة: مش exhaustive."
          - "كلام مطاط، كل واحد هيفهمه رقم مختلف."
      - kind: try
        items: [res.L10.034, res.L10.036, res.L10.038]
    recap:
      - "Open-ended (unstructured، free-response): بكلامه؛ سهل تحضّره، صعب تحلّله، وممكن يسيبه."
      - "Closed (structured): الإجابات وشكلها محددين؛ multiple choices أو scale."
      - "قلقين: عدد الاختيارات والـ order bias."
      - "الاختيارات: mutually exclusive + collectively exhaustive."
    practice: [res.L10.034, res.L10.035, res.L10.036, res.L10.037, res.L10.038, res.L10.039, res.L10.040, res.L10.109, res.L10.111]
  # ------------------------------------------------------------------
  - id: res.L10.lesson9
    title: "مميزات الـ closed وسلّم الـ Likert"
    hook: "الـ closed أسهل في التحليل، بس لازم تقول اختيار واحد ولا أكتر، وترتّب الاختيارات صح."
    minutes: 8
    pages: [44, 52]
    topics: [structure]
    goals:
      - "تكتب تعليمات الاختيار و«other»"
      - "تتحكم في الـ order bias"
      - "تعدّ مميزات الـ closed"
      - "تعرف الـ Likert scale والـ 5-point scale"
    status: unverified
    steps:
      - kind: explain
        page: 44
        quote: "Number of alternatives\n  An “other (please specify)” category should be included where appropriate.\n  Instructions should clearly indicate whether the respondent is to choose only one alternative or select all that apply.\n  – For example, “Please indicate all the types of cereals that you have consumed in the past week.”"
        title: "«Other» وتعليمات الاختيار"
        text: |
          - حط ==«other (please specify)»== لما يكون مناسب.
          - التعليمات لازم تقول بوضوح: ==اختيار واحد== ولا ==اختار كل اللي ينطبق==.
            - مثال: «Please indicate all the types of cereals that you have consumed in the past week.»

          ليه التعليمات مهمة؟ لو مش واضحة، ناس هتختار واحد وناس هتختار كذا، والإجابات مش هتتقارن. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 45
        quote: "Order or position bias\n  It is the respondents' tendency to check an alternative merely because it occupies a certain position in a list.\n  Alternatives that appear at the beginning and, to a lesser degree, at the end of a list have a tendency to be selected most often.\n  Order bias can be controlled by preparing several forms of the questionnaire with changes in the order of the alternatives from form to form unless the alternatives represent ordered categories."
        title: "Order (position) bias"
        text: |
          ==Order bias== = إن الـ respondent يختار اختيار **عشان مكانه** في اللستة. الأول بيتختار أكتر، والآخر بدرجة أقل.

          الحل: اعمل **كذا form** من الـ questionnaire وغيّر ترتيب الاختيارات، **إلا** لو الاختيارات **ordered categories** (زي 0، 1–2، 3–4) لازم تفضل مترتبة.
      - kind: aside
        tone: analogy
        page: 45
        quote: "Alternatives that appear at the beginning and, to a lesser degree, at the end of a list have a tendency to be selected most often."
        text: |
          زي منيو المطعم: أول طبق في الصفحة بيتطلب أكتر، وآخر طبق بعده، والوسط محدش بيقراه. ده **position bias** بالظبط.

          الـ alternatives اللي في الـ **beginning** of a list بتتـ selected أكتر، وبعدها اللي في الآخر.
      - kind: explain
        page: 46
        quote: "Advantages\n  Easier for respondents to answer.\n  Easier to analyze and tabulate than open-ended questions.\n  Interviewer bias is also reduced, given that these types of questions work very well in self-administered conditions.\n  Respondent cooperation in general is improved if the majority of the questions are structured."
        title: "مميزات الـ closed-ended"
        text: |
          - ==أسهل== للمشارك يجاوب.
          - ==أسهل في التحليل== والـ tabulation من الـ open-ended.
          - ==Interviewer bias أقل==، لأنها بتشتغل كويس في الـ self-administered.
          - تعاون المشارك بيتحسن لو أغلب الأسئلة structured.

          ليه الـ interviewer bias بيقل؟ لأن الإجابة مكتوبة قدامه، فمفيش حد بيفسرها أو بيعيد صياغتها. التفسير المقبول (مش في الكتاب).
      - kind: aside
        tone: trap
        page: 47
        quote: "Disadvantages\n  It is difficult to develop effective multiple-choice options.\n  Often, exploratory research must be conducted using open ended questions to identify the appropriate response options."
        text: |
          الخدعة: الـ open-ended **سهل في التحضير** و**صعب في التحليل**. الـ closed **صعب في التحضير** و**سهل في التحليل**.

          يعني لو السؤال «disadvantage of structured questions»، الإجابة ==difficult to develop==، مش «صعب في التحليل».
      - kind: check
        page: 47
        quote: "Disadvantages\n  It is difficult to develop effective multiple-choice options."
        question: "Disadvantages of structured questions include:"
        options: ["Difficult to develop", "Require long time to answer", "Difficult in data analysis", "Interviewer bias is increased"]
        answer: 0
        why:
          - "صح: صعب تعمل multiple-choice options كويسة."
          - "ده عيب الـ open-ended."
          - "الـ closed أسهل في التحليل."
          - "الـ interviewer bias بيقل مع الـ structured questions."
      - kind: table
        page: 48
        quote: "Open-Ended and Closed Questions\n| Open-ended | | Closed |\n|---|---|---|\n| Slow | Speed of completion | Fast |\n| High | Exploratory nature | Low |\n| High | Breadth and depth | Low |\n| Easy | Ease of preparation | Difficult |\n| Difficult | Ease of analysis | Easy |"
        title: "Open-ended ضد closed"
        columns: ["", "Open-ended", "Closed"]
        rows:
          - ["Speed of completion", "Slow", "Fast"]
          - ["Exploratory nature", "High", "Low"]
          - ["Breadth and depth", "High", "Low"]
          - ["Ease of preparation", "Easy", "Difficult"]
          - ["Ease of analysis", "Difficult", "Easy"]
        hide: [[0, 2], [3, 1], [3, 2], [4, 1]]
      - kind: explain
        page: 49
        quote: "Rating scale questions\n  Questions that use a rating scale for responses.\n  This type of question is useful for determining the prevalence of an attitude, opinion, knowledge or behavior.\n  Two common types:\n    Likert scale\n    Semantic differential scale"
        title: "Rating scales"
        text: |
          الـ **rating scale questions** بتستخدم مقياس للإجابة، ومفيدة علشان تعرف ==prevalence== لـ attitude أو opinion أو knowledge أو behavior.

          نوعين مشهورين:

          - ==Likert scale==
          - ==Semantic differential scale==

          ليه scale ومش yes/no؟ لأن الرأي درجات، والـ scale بتقيس قد إيه مش بس آه ولا لأ. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 50
        quote: "Likert Scale\n  Named after its developer, Rensis Likert, the Likert scale is one of the most widely used itemized scales.\n  The end-points of a Likert scale are typically “strongly disagree” and “strongly agree.”\n  The respondents are asked to indicate their degree of agreement by checking one of five response categories."
        title: "Rating scales: الـ Likert"
        text: |
          الـ **rating scale questions** بتقيس انتشار **attitude** أو opinion أو knowledge أو behavior. أشهر نوعين: ==Likert scale== و**semantic differential scale**.

          الـ Likert (على اسم **Rensis Likert**) من أكتر الـ itemized scales استخدامًا: **5 response categories** من «strongly disagree» لـ «strongly agree».
      - kind: figure
        page: 50
        quote: "The end-points of a Likert scale are typically “strongly disagree” and “strongly agree.”\n  The respondents are asked to indicate their degree of agreement by checking one of five response categories."
        title: "الـ Likert scale"
        alt: "A five-point Likert scale for the statement 'The customer service representative was knowledgeable': 1 strongly disagree, 2 disagree, 3 neither agree nor disagree, 4 agree, 5 strongly agree, each with a circle to tick."
        caption: "5 خانات: **1 strongly disagree** لحد **5 strongly agree**، والنص **neither**."
        svg: |
          <svg viewBox="0 0 330 130" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="20" text-anchor="middle" class="t-sm t-b">The staff were helpful</text>
            <path d="M33 60H297" class="fg-arrow"/>
