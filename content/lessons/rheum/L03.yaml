  - id: rheum.L03.lesson2
    title: "Type I: الـ mast cell المتسلّح"
    hook: "أول مرة الجسم بيشوف الـ pollen بيسلّح الـ mast cells بس. التانية بيضغط على الزناد."
    minutes: 7
    pages: [54, 57]
    topics: [type1, mediators]
    goals:
      - "ترتّب مراحل الـ sensitization والـ effector stage"
      - "تعرف الـ mediators اللي في الحبيبات واللي بتتصنع جديد بتوقيتهم"
      - "تفرّق بين الـ immediate والـ late-phase reaction"
    status: unverified
    steps:
      - kind: explain
        page: 54
        quote: "The most prevalent type of hypersensitivity disease."
        title: "أشهر نوع"
        text: |
          ==Type I== هو **أشهر** نوع hypersensitivity.

          - الـ allergen بيعمل **humoral IgE response**.
          - أول تعرّض: الجسم يعمل **specific IgE**.
          - الـ IgE يقعد على **high-affinity FcεRI** على الـ ==mast cells والـ basophils==.
          - التعرّض اللي بعده: الـ allergen يعمل **cross-linking** للـ IgE ← الحبيبات تتفرّغ.
          - التأثير ممكن **localized** أو **systemic**.
      - kind: order
        page: 55
        quote: "Sensitization stage: initiated when an allergen penetrates a skin or mucosal barrier"
        prompt: "رتّب مراحل الـ sensitization والـ effector:"
        steps:
          - "Allergen crosses skin or mucosa"
          - "Immature DC collects it and carries it to the lymph node"
          - "Mature DC presents it to a naive Th cell"
          - "Allergen-specific B cells activated, IgE made"
          - "IgE arms mast cells"
          - "Second exposure triggers the effector stage"
        why: "ده صفحة 55: sensitization الأول (DC ← lymph node ← Th و B)، والـ effector stage بس لو الـ allergen رجع والـ mast cells لسه متسلّحة."
      - kind: explain
        page: 55
        quote: "Mouified TH2 response"
        title: "الـ Th2 response"
        text: |
          في رسمة صفحة 55:

          - الـ Th2 بيفرز ==IL-4== ← الـ B cell تعمل switch لـ **IgE**.
          - الـ **IL-10** بيوجّه ناحية **IgG4** وبيقفل الـ IgE.
          - الـ mast cell بتطلّع **leukotrienes** و **histamine** و IL-4 و IL-5 و TNF-α اللي بيجيبوا **eosinophils**.
      - kind: figure
        page: 56
        quote: "cross linking of these receptors by Ag causing influx of calcium ions and degranulation of mast cells."
        title: "الـ mast cell بتنفجر إمتى؟"
        alt: "A mast cell with IgE sitting on FcεRI receptors. An allergen bridges two IgE molecules. A calcium arrow enters the cell. Three outputs leave on a timeline: pre-formed granules at 5 minutes (histamine, heparin, tryptase), arachidonic acid products at 5 to 30 minutes (leukotriene D4, prostaglandin D2), and cytokines at hours (TNF-α, IL-4). A side arrow shows direct triggers without IgE: opiates, contrast, vancomycin."
        caption: "Cross-linking ← Ca²⁺ يدخل ← degranulation. الحبيبات الجاهزة في 5 دقايق، الـ arachidonic acid في 5-30، والـ cytokines بالساعات."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R03a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <circle cx="90" cy="110" r="48" class="fg-acc"/>
            <text x="90" y="114" text-anchor="middle" class="t-sm t-b">Mast cell</text>
            <path d="M74 62l-8-18M74 62l8-18M106 62l-8-18M106 62l8-18" class="fg-ink" stroke-width="2"/>
            <circle cx="90" cy="38" r="7" class="fg-bad"/>
            <text x="104" y="32" class="t-sm">allergen</text>
            <text x="38" y="52" class="t-sm t-mut">IgE</text>
            <path d="M140 80l-22 14" class="fg-arrow-acc" marker-end="url(#R03a)"/>
            <text x="142" y="78" class="t-sm">Ca²⁺</text>
            <text x="6" y="190" class="t-sm t-mut">direct triggers (no IgE):</text>
            <text x="6" y="206" class="t-sm t-mut">opiates, contrast, vancomycin</text>
            <path d="M140 116h30" class="fg-arrow-acc" marker-end="url(#R03a)"/>
            <rect x="168" y="40" width="158" height="44" rx="8" class="fg-box"/>
            <text x="175" y="58" class="t-sm t-b">5 min: pre-formed</text>
            <text x="175" y="74" class="t-sm">histamine, heparin, tryptase</text>
            <rect x="168" y="94" width="158" height="44" rx="8" class="fg-box"/>
            <text x="175" y="112" class="t-sm t-b">5-30 min: new lipids</text>
            <text x="175" y="128" class="t-sm">LTD4, PGD2</text>
            <rect x="168" y="148" width="158" height="44" rx="8" class="fg-box"/>
            <text x="175" y="166" class="t-sm t-b">hours: cytokines</text>
            <text x="175" y="182" class="t-sm">TNF-α, IL-4</text>
            <text x="176" y="214" class="t-sm t-good">immediate</text>
            <text x="260" y="214" class="t-sm t-bad">late phase</text>
          </svg>
      - kind: table
        page: 56
        quote: "Anticoagulation, modulates tryptase"
        title: "جوّه الحبيبات"
        columns: ["Mediator", "Action"]
        rows:
          - ["Histamine", "Permeability, vasodilation, smooth muscle contraction"]
          - ["Heparin", "Anticoagulation, modulates tryptase"]
          - ["Tryptase", "Activates complement (C3)"]
          - ["Chymase", "Increased mucus secretion"]
          - ["Acid hydrolases", "Degrade extracellular matrix"]
          - ["Bradykinin", "Also stimulates pain nerve endings"]
        hide: [[2, 1], [3, 1], [5, 1]]
      - kind: check
        page: 56
        quote: "Tryptase Activates complement (C3)"
        question: "Which mast cell protease activates complement C3?"
        options: ["Tryptase", "Chymase", "Heparin", "Histamine"]
        answer: 0
        why:
          - "صح: tryptase ← C3."
          - "Chymase بتزوّد الـ mucus."
          - "Heparin anticoagulant وبيعدّل الـ tryptase."
          - "Histamine بيعمل permeability و vasodilation."
      - kind: explain
        page: 57
        quote: "Vascular/smooth muscle response: immediate reaction"
        title: "موجتين"
        text: |
          رسمة صفحة 57: الـ mast cell المتنشّطة بتطلّع حاجتين:

          - ==Histamine + lipid mediators== ← **vascular / smooth muscle response** = **immediate reaction**.
          - ==Cytokines== ← **inflammation** = **late-phase reaction**.

          وفي الـ electron micrograph: الخلية الساكنة مليانة حبيبات، والمتنشّطة فضيت.
      - kind: aside
        tone: analogy
        page: 57
        quote: "Inflammation: late-phase reaction"
        text: "الـ immediate reaction زي الشرارة، والـ late phase زي النار اللي بتمسك في الهدوم بعد ساعات. عشان كده مريض الـ asthma ممكن يتعب تاني بعد 6 ساعات."
      - kind: try
        items: [rheum.L03.017, rheum.L03.018, rheum.L03.027, rheum.L03.031, rheum.L03.036]
    recap:
      - "Type I أشهر نوع: IgE على FcεRI في الـ mast cells والـ basophils."
      - "Sensitization: DC ← lymph node ← Th2 (IL-4) ← IgE. Effector: تعرّض تاني."
      - "Cross-linking ← Ca²⁺ ← degranulation."
      - "5 دقايق جاهز، 5-30 lipids، ساعات cytokines (late phase)."
      - "Tryptase ← C3، chymase ← mucus، bradykinin ← ألم."
    practice: [rheum.L03.015, rheum.L03.016, rheum.L03.017, rheum.L03.018, rheum.L03.019, rheum.L03.020, rheum.L03.021, rheum.L03.022, rheum.L03.023, rheum.L03.024, rheum.L03.025, rheum.L03.026, rheum.L03.027, rheum.L03.028, rheum.L03.029, rheum.L03.030, rheum.L03.031, rheum.L03.032, rheum.L03.033, rheum.L03.034, rheum.L03.035, rheum.L03.036]
  # ------------------------------------------------------------------
  - id: rheum.L03.lesson3
    title: "من العطسة للـ shock: أمثلة type I وعلاجه"
    hook: "نفس الـ mast cell اللي بتعمل حكة في المناخير ممكن تقفل النفس وتوقّع الضغط في دقايق."
    minutes: 7
    pages: [58, 60]
    topics: [mediators, anaphylaxis, type1-tx]
    goals:
      - "تعدّ أمثلة الـ localized atopy وتعرف الـ anaphylaxis"
      - "تتصرف صح في الـ anaphylaxis"
      - "تفرّق بين RIST و RAST وتعرف طرق العلاج"
    status: unverified
    steps:
      - kind: table
        page: 58
        quote: "Killing of parasites and host cells"
        title: "مين بيعمل إيه؟"
        columns: ["Product", "Effect"]
        rows:
          - ["Histamine, PAF, PGD2, LTC4", "Vascular leak, bronchoconstriction, gut hypermotility"]
          - ["Cytokines (TNF)", "Inflammation"]
          - ["Tryptase", "Tissue damage"]
          - ["Eosinophil MBP, ECP", "Killing of parasites and host cells"]
        hide: [[0, 1], [3, 1]]
      - kind: explain
        page: 58
        quote: "Localized Atopy: specific target tissue such as the skin or bronchial passages"
        title: "Localized ولا systemic؟"
        text: |
          ==Localized atopy== (نسيج معيّن زي الجلد أو الشُّعب):

          - Hay fever (allergic rhinitis)
          - Asthma
          - Urticaria
          - Atopic dermatitis (eczema)
          - Food allergies

          ==Systemic atopy== = **anaphylaxis**.
      - kind: explain
        page: 59
        quote: "Inflammatory response in asthmatic bronchi"
        title: "شُعب الـ asthma"
        text: |
          رسمة صفحة 59:

          - **Spasmogens** (histamine، leukotrienes، prostaglandins) ← ==bronchoconstriction==.
          - **Chemotactic factors** (IL-5، TNF-α) ← خلايا بتطلّع MBP و ECP و lysosomal enzymes ← inflammation و **bronchial hyperreactivity**.
          - في الآخر: cell infiltrate، mucus زيادة، عضلات أتخن، و chronic bronchospasm.
      - kind: mnemonic
        page: 59
        quote: "Anaphylactic shock is most frequently observed in individuals sensitized to insect stings, peanuts, seafood or penicillin."
        word: "PIPS"
        hook: "أشهر أسباب الـ anaphylactic shock «PIPS»: زي صفارة الإسعاف."
        parts:
          - { key: "P", text: "Penicillin" }
          - { key: "I", text: "Insect stings" }
          - { key: "P", text: "Peanuts" }
          - { key: "S", text: "Seafood" }
      - kind: case
        page: 59
        quote: "Constriction of the bronchioles- lethal--Give adrenaline immediately."
        stem: "A 22-year-old is stung by a bee at a picnic. Within 5 minutes: hoarse voice, wheeze, BP 70/40, cold sweaty skin."
        steps:
          - question: "What is happening?"
            options: ["Anaphylactic shock (systemic type I)", "Serum sickness", "Vasovagal faint"]
            answer: 0
            why: "Insect sting + دقايق + bronchospasm + هبوط ضغط = anaphylaxis. الـ serum sickness بتاخد أيام."
          - question: "Why is the BP so low?"
            options: ["Mediators dilate blood vessels throughout the body", "Blood loss", "Heart block from IgE"]
            answer: 0
            why: "الـ mast cells والـ basophils بيرموا mediators و vasodilators في الدم كله."
          - question: "First drug?"
            options: ["Adrenaline immediately", "Oral antihistamine", "Skin prick test"]
            answer: 0
            why: "الكتاب: constriction of the bronchioles lethal، give adrenaline immediately."
      - kind: aside
        tone: exam
        page: 59
        quote: "Clinically anaphylaxis is a form of extreme shock (anaphylactic shock) that can kill within minutes of exposure to the antigen."
        text: "أي سؤال فيه anaphylaxis: الإجابة الأولى **adrenaline**. الـ antihistamine والـ steroid بييجوا بعدين، مش بدل منه."
      - kind: explain
        page: 60
        quote: "The RAST(radioallergosorbent test) uses these purified allergens in a panel to screen serum samples"
        title: "التشخيص: RIST ولا RAST؟"
        text: |
          - ==RIST== (radioimmunosorbent): **total** IgE في الدم. لو عالي من غير حساسية: فكّر في **helminths** و **Hodgkin's**.
          - ==RAST== (radioallergosorbent): panel من allergens متنقّية ← **يحدد الـ allergen نفسه**.
          - **Skin prick test**.

          الـ allergens بتتنقّى، واللي صعب يتنقّى بيتصنع بـ recombinant DNA.
      - kind: aside
        tone: tip
        page: 59
        quote: "Blood sample for RIST (radioimmunosorbent test)."
        text: "افتكرها كده: في RAST حرف A = Allergen، يعني بيقولك الـ allergen مين. الـ RIST بيقولك الـ IgE كام بس."
      - kind: sort
        page: 60
        quote: "Basic approaches: Minimizing contact with allergen."
        prompt: "حط كل علاج في مكانه:"
        bins: ["Block mediators / symptoms", "Change the immune response"]
        cards:
          - { text: "Antihistamines", bin: 0 }
          - { text: "Zileuton, montelukast", bin: 0 }
          - { text: "Bronchodilators, steroids, cromones", bin: 0 }
          - { text: "Hyposensitization", bin: 1 }
          - { text: "Omalizumab (anti-IgE)", bin: 1 }
          - { text: "Th2 to Th1 deviation (IL-12)", bin: 1 }
          - { text: "Anti-allergy vaccines, gene therapy", bin: 1 }
        why: "أساس العلاج: ابعد عن الـ allergen (و emollients للجلد). الـ hyposensitization = SC حقن allergen بجرعات بتزيد كل أسبوع أو شهر لسنين، والـ omalizumab بيمسك الـ IgE اللي في الدم."
      - kind: update
        page: 60
        quote: "Lipoxygenase inhibitors (leukotriene inhibitors) = zileuton, montelukast."
        text: "الكتاب حاطط الاتنين lipoxygenase inhibitors. بالظبط: zileuton هو الـ 5-lipoxygenase inhibitor، والـ montelukast بيقفل الـ leukotriene receptor (LTRA). في الامتحان: إجابة الكتاب."
        ref: "GINA asthma report, 2024"
      - kind: try
