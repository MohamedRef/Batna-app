      - kind: explain
        page: 398
        quote: "Differential Diagnosis Appendicitis, perforated peptic ulcer. Intestinal obstruction, pleurisy myocardial infarction."
        title: "الـ DD: إزاي تفرّق كل واحد عن الحصوة؟"
        text: |
          الكتاب بيدّي 5 أسماء بس. ده التفسير المقبول (مش في الكتاب) للي يفرّق كل واحد عن الـ biliary pain:

          - **Myocardial infarction (MI)**: الوجع ممكن يروح للدراع في الاتنين (صفحة 381). علشان كده أي عيان بوجع epigastric لازم ECG قبل ما تقول مرارة.
          - **Pleurisy**: الوجع بيزيد مع النفس، وده ممكن يتلخبط مع الـ shallow respiration. بس هنا فيه كحة أو friction rub، والأشعة على الصدر.
          - **Appendicitis**: لو الـ appendix عالية تحت الكبد، الوجع يبقى في الـ RUQ.
          - **Perforated peptic ulcer**: وجع مفاجئ جدًا مع peritonitis، والـ colic مفيهاش peritoneal findings (صفحة 381). وهوا تحت الحجاب الحاجز في الأشعة.
          - **Intestinal obstruction**: مغص بييجي ويروح بجد مع انتفاخ وترجيع، مش وجع ثابت زي الـ biliary pain.

          يعني الـ US اللي دقته > 95% بيأكّد الحصوة، والقصة والأشعة البسيطة بيستبعدوا الباقي.
