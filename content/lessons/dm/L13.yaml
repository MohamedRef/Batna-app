          - ["One-dose-for-all", "NPH 20 + 20، rapid 10 + 10"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 175
        title: "ليه الجرعة بتعلى مع الـ trimester، وليه تلتين الصبح؟"
        quote: "Insulin Regimens for GDM & Pregnancy in Patients with T2DM"
        text: |
          الجدول بيدّي الـ **TDD** بالوزن، وبيعلّيه مع كل **trimester** (0.7 ← 0.8 ← 0.9–1 units/kg). السبب نفس منحنى الدرس اللي فات: الـ insulin resistance بتكبر مع المشيمة، يعني نفس الكيلو محتاج insulin أكتر كل ما الحمل يتقدم.

          وتقسيمة ==2/3 الصبح و 1/3 بالليل==: التفسير المقبول (مش في الكتاب) إن الـ **NPH** بتاع الصبح بيوصل لقمته على الضهر فيغطي الغدا، والسريع يغطي الفطار، فالصبح شايل وجبتين. وبالليل الـ NPH بيتاخد **قبل النوم** مش مع العشا، عشان قمته تيجي آخر الليل وتمسك سكر الصيام من غير hypo الساعة 2 بالليل.
      - kind: figure
        page: 175
        quote: "Insulin Regimens for GDM & Pregnancy in Patients with T2DM"
        title: "تقسيم الـ TDD"
        alt: "A box for total daily dose splits into a morning two-thirds, which is one-third aspart or lispro with breakfast and two-thirds NPH, and an evening one-third, which is half aspart or lispro with dinner and half NPH before bed."
        caption: "Insulin regimen في الـ GDM والـ T2DM: الصبح تلتين (تلت سريع وتلتين NPH)، وبالليل تلت (نص سريع مع العشا ونص NPH قبل النوم)."
        svg: |
