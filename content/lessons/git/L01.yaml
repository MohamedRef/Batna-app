  - id: git.L01.lesson2
    title: "الـ dyspepsia: نطمّن ولا نعمل منظار؟"
    hook: "ست عندها انتفاخ بعد الأكل. إمتى ده functional وإمتى لازم المنظار النهارده؟"
    minutes: 10
    pages: [7, 12]
    topics: [dyspepsia]
    goals:
      - "تعدّ الـ alarm features كلها وتعرف كل واحدة بتخوّف من إيه"
      - "تعرف مين يعمل urgent endoscopy ومين non-urgent ومين test and treat"
      - "تعرف الـ criteria بتاعة functional dyspepsia وليه بتحصل"
    status: unverified
    steps:
      - kind: explain
        page: 7
        quote: "Dyspepsia is an umbrella term used to encompass a number of symptoms\nthought to originate from the upper gastrointestinal tract."
        title: "الـ dyspepsia شمسية مش تشخيص"
        text: |
          الـ ==dyspepsia== كلمة **umbrella**: أعراض كتير جاية من الـ upper GI tract، وهي **relatively nonspecific**، يعني أمراض كتير ممكن تطلّعها.

          عشان كده التحدي الأول للدكتور (ص 8): إنك تلاقي **القلة** اللي عندها حاجة **life-threatening** زي **gastric cancer**، وسط ناس أغلبهم أعراضهم **functional**.
      - kind: explain
        page: 7
        quote: "She is non\nsmoker, non diabetic and non hypertensive and gave neither history of\nNSAIDS nor loss of weight, and no family history of GI diseases."
        title: "حالة الكتاب: كل «لأ» ليها معنى"
        text: |
          ست **42 سنة**: **postprandial bloating**، **inability to finish a regular meal**، وألم epigastric **colicky** أحيانًا، من **5 شهور**، من غير referral ولا radiation.

          - non smoker، non diabetic، non hypertensive.
          - ==مفيش NSAIDs== و ==مفيش weight loss== ومفيش family history لأمراض GI.
          - الكشف: شكلها كويس، vital signs طبيعية، **mild epigastric tenderness**، مفيش masses ولا organomegaly.

          ليه الكتاب مهتم يقول كل الـ «لأ» دي؟ لأن كل واحدة بتشيل سبب organic: الـ NSAIDs بتعمل ulcer، والـ weight loss والـ family history بيخوّفوا من cancer. فالإجابة: عندها ==dyspepsia== ممكن تكون functional أو organic، ولسه بنفرز.
      - kind: mnemonic
        page: 8
        quote: "Alarm features in dyspepsia\n  Clinically significant, unintentional weight loss (>5% usual body weight over 6 to 12 months)\n  Overt gastrointestinal bleeding (eg, hematemesis, hematochezia, melena)\n  Dysphagia\n  Odynophagia\n  Unexplained iron deficiency anemia\n  Persistent vomiting\n  Palpable mass or lymphadenopathy\n  Family history of upper gastrointestinal cancer"
        word: "VBAD WOMF"
        parts:
          - { key: "V", text: "Vomiting, persistent" }
          - { key: "B", text: "Bleeding, overt GI (hematemesis, hematochezia, melena)" }
          - { key: "A", text: "Anemia, unexplained iron deficiency" }
          - { key: "D", text: "Dysphagia" }
          - { key: "W", text: "Weight loss: >5% of usual weight over 6-12 months" }
          - { key: "O", text: "Odynophagia" }
          - { key: "M", text: "Mass or lymphadenopathy, palpable" }
          - { key: "F", text: "Family history of upper GI cancer" }
        hook: "**«VBAD WOMF»** بتتقري «في باد ووم»: صوت المعدة وهي بتقولك «فيه حاجة غلط». أي حرف موجود = **organic** لحد ما يثبت العكس."
      - kind: explain
        page: 8
        quote: "If any of the above alarm features is present then the dyspepsia is due to\norganic cause."
        title: "القاعدة، وليه كل علامة بتخوّف"
        text: |
          الكتاب بيقسمها كده: فيه **أي alarm feature** ← ==organic==. مفيش ← **functional**.

          والتفسير المقبول (مش في الكتاب) لكل علامة بتخوّف من إيه:
          - **Weight loss** (unintentional، أكتر من **5%** في **6 to 12 months**) و **palpable mass أو lymphadenopathy**: ورم بياكل الجسم أو انتشر.
          - **Overt GI bleeding** و **iron deficiency anemia** من غير سبب: حاجة بتنزف، ulcer أو cancer.
          - **Dysphagia** و **odynophagia**: حاجة بتضيّق الـ esophagus أو بتجرحه.
          - **Persistent vomiting**: انسداد في مخرج المعدة.
          - **Family history of upper GI cancer**: الـ risk أعلى من الأول.
      - kind: figure
        page: 9
        quote: "Figure (1): Schematic representation of the various factors that may be involved in the pathophysiology of FD. Not included in the figure: diet and lifestyle factors (eg, tobacco, alcohol, nonsteroidal anti-inflammatory drug use), and impact of psychosocial factors, such as stress, anxiety, and depression."
        title: "ليه المعدة بتتعب من غير مرض باين؟"
        alt: "Stomach and duodenum sketch with labels: impaired accommodation and hypersensitivity in the fundus, delayed emptying at the antrum, H. pylori, enteric pathogens entering, intraduodenal acid and lipid, duodenal eosinophilia and immune activation, plus diet, lifestyle and psychosocial factors outside the stomach."
        caption: "الـ functional dyspepsia مش «مفيش حاجة»: فيه مشاكل في الحركة والإحساس والمناعة، بس مفيش structural disease."
        svg: |
          <svg viewBox="0 0 330 380" xmlns="http://www.w3.org/2000/svg">
            <path d="M120 40 C110 90 60 120 70 190 C80 260 170 280 230 250 C280 225 300 170 280 120 C260 70 200 60 170 90 C155 105 140 80 140 40 Z" class="fg-acc"/>
            <path d="M230 250 C250 275 250 300 225 315 C200 330 170 320 165 345" class="fg-ink" fill="none" stroke-width="14" stroke-linecap="round"/>
            <circle cx="215" cy="120" r="40" class="fg-thin" fill="none"/>
            <text x="215" y="116" text-anchor="middle" class="t-sm t-b">Impaired</text>
            <text x="215" y="131" text-anchor="middle" class="t-sm t-b">accommodation</text>
            <text x="325" y="62" text-anchor="end" class="t-sm t-bad">Hypersensitivity</text>
            <text x="10" y="30" class="t-sm">Enteric pathogens</text>
            <text x="20" y="215" class="t-sm t-b">H. pylori</text>
            <text x="140" y="232" class="t-sm t-bad t-b">Delayed emptying</text>
            <text x="180" y="295" class="t-sm">Intraduodenal acid and lipid</text>
            <text x="10" y="355" class="t-sm">Duodenal eosinophilia</text>
            <text x="10" y="372" class="t-sm">Immune activation</text>
            <rect x="200" y="330" width="125" height="46" rx="6" class="fg-box"/>
            <text x="208" y="348" class="t-sm t-mut">Diet, tobacco, NSAIDs</text>
            <text x="208" y="366" class="t-sm t-mut">Stress, anxiety</text>
          </svg>
      - kind: explain
        page: 9
        quote: "Not included in the figure: diet and lifestyle factors\n(eg, tobacco, alcohol, nonsteroidal anti-inflammatory drug use), and impact of\npsychosocial factors, such as stress, anxiety, and depression."
        title: "ليه الأكلة ما بتكمّلش؟"
        text: |
          الرسمة في الكتاب بتعدّ العوامل، والتفسير المقبول (مش في الكتاب) بيربطها بالأعراض:

          - ==Impaired accommodation==: الـ fundus المفروض **يرتخي** ويوسّع لما الأكل يدخل. لو ما ارتخاش، المعدة تتملي بسرعة، فـ **early satiety** زي الست اللي مش بتكمّل أكلتها.
          - **Delayed emptying**: الأكل بيقعد كتير، فـ **fullness** و bloating.
          - **Hypersensitivity**: الأعصاب بتحس بالشد العادي على إنه ألم.
          - **H. pylori**، **enteric pathogens**، **duodenal eosinophilia** و **immune activation**: التهاب خفيف بيزوّد الحساسية.
          - **Intraduodenal acid and lipid**: بيعملوا reflex بيقلل الحركة.

          وبره الرسمة: **tobacco**، **alcohol**، **NSAIDs**، و **stress, anxiety, depression**.
      - kind: explain
        page: 9
        quote: "Stool antigen for H pylori negative"
        title: "التحاليل: كل واحد بيشيل احتمال"
        text: |
          الست عملت:
          - **Hb 12 g/dl**
          - **Stool antigen for H. pylori**: ==negative==
          - **TSH و free T4**: normal
          - **Celiac serology**: negative
          - **ECG**: within normal

          ليه دول بالذات؟ التفسير المقبول (مش في الكتاب): الـ Hb بيدوّر على **anemia** (alarm)، والـ stool antigen على **H. pylori** (سبب organic بيتعالج)، والغدة لأن الـ hypothyroidism بيبطّأ الحركة، والـ celiac بيعمل bloating، والـ ECG لأن الـ **inferior MI** ممكن يبان ألم epigastric. يعني بتشيل الـ organic واحد واحد.
      - kind: figure
        remind: [git.L01.033]
        page: 10
        quote: "We recommend that if no other upper gastrointestinal alarm symptoms or signs are reported, urgent endoscopy is warranted in\nPatients aged ≥55 years with dyspepsia with weight loss,\nPatients aged >40 years from an area at an increased risk of gastric cancer\nPatients with a family history of gastro-esophageal cancer."
        title: "مين يدخل المنظار؟ سلّم الأعمار"
        alt: "Decision ladder by age: 60 or more with pain and weight loss gets urgent CT for pancreatic cancer; 55 or more with weight loss gets urgent endoscopy; over 40 from a high gastric cancer area or family history of gastro-esophageal cancer gets urgent endoscopy; 55 or more with resistant dyspepsia, high platelets or nausea and vomiting gets non-urgent endoscopy; everyone else gets H. pylori test and treat."
        caption: "British Society of Gastroenterology (BSG) 2022 زي ما الكتاب نقلها. **أي حد مش على السلّم = test and treat.**"
        svg: |
          <svg viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="64" rx="8" class="fg-bad"/>
            <text x="20" y="32" class="t-sm t-b t-bad">Urgent CT abdomen</text>
            <text x="20" y="50" class="t-sm">age ≥60 + abdominal pain + weight loss</text>
            <text x="20" y="66" class="t-sm t-mut">exclude pancreatic cancer</text>
            <rect x="10" y="84" width="310" height="96" rx="8" class="fg-bad"/>
            <text x="20" y="106" class="t-sm t-b t-bad">Urgent endoscopy</text>
            <text x="20" y="126" class="t-sm">age ≥55 + dyspepsia + weight loss</text>
            <text x="20" y="146" class="t-sm">age &gt;40 from a high gastric cancer area</text>
            <text x="20" y="166" class="t-sm">family history of gastro-esophageal cancer</text>
            <rect x="10" y="190" width="310" height="80" rx="8" class="fg-acc"/>
            <text x="20" y="212" class="t-sm t-b t-acc">Non-urgent endoscopy (age ≥55)</text>
            <text x="20" y="232" class="t-sm">treatment-resistant dyspepsia, or</text>
            <text x="20" y="252" class="t-sm">raised platelets, or nausea/vomiting</text>
            <rect x="10" y="280" width="310" height="110" rx="8" class="fg-good"/>
            <text x="20" y="302" class="t-sm t-b t-good">Everyone else</text>
            <text x="20" y="322" class="t-sm">non-invasive H. pylori test and treat</text>
            <text x="20" y="342" class="t-sm">H. pylori negative: empirical acid suppression</text>
            <text x="20" y="362" class="t-sm">confirm eradication only if high</text>
            <text x="20" y="380" class="t-sm">gastric cancer risk</text>
          </svg>
      - kind: check
        page: 10
        quote: "We recommend that non-urgent endoscopy is considered in patients aged ≥55 years with treatment-resistant dyspepsia or dyspepsia with either a raised platelet count or nausea or vomiting (recommendation: strong, quality of evidence: very low)."
        question: "A 57-year-old man has dyspepsia not helped by a PPI course. No weight loss, no other alarm features. What does the lecture advise?"
        options:
          - "Non-urgent endoscopy"
          - "Urgent endoscopy"
          - "Urgent CT abdomen"
          - "Repeat PPI for another 8 weeks"
        answer: 0
        why:
          - "صح: ≥55 مع **treatment-resistant** dyspepsia = non-urgent endoscopy."
          - "الـ urgent عند ≥55 لازم يبقى فيه **weight loss**."
          - "الـ computed tomography (CT) لـ ≥60 مع pain و weight loss (pancreatic cancer)."
          - "هو أصلًا resistant، فلازم نبص."
      - kind: explain
        page: 11
        quote: "We recommend that patients without H. pylori infection are offered\nempirical acid suppression therapy (recommendation: strong; quality of\nevidence: high)"
        title: "Test and treat، وبعدين؟"
        text: |
          - **H. pylori positive** ← eradication. وتتأكد من الـ eradication **بس** في اللي عندهم ==increased risk of gastric cancer== (توصية British Society of Gastroenterology (BSG) في الكتاب).
          - **H. pylori negative** ← ==empirical acid suppression==.

          والـ test الـ non-invasive في الـ algorithm: **stool antigen** أو **urea breath test**.

          ليه الـ test of cure هنا بس للـ high risk؟ التفسير المقبول (مش في الكتاب): الـ eradication بتنجح في أغلب الناس، فالتأكيد عند الكل تكلفة من غير فايدة كبيرة؛ أما اللي معرض للـ cancer فلازم تتأكد إن السبب اتشال.
      - kind: table
        page: 11
        quote: "Inset\nFunctional dyspepsia is diagnosed when all of the following are true:\n  Persistent symptoms for the prior 3 months\n  Symptom onset at least 6 months before diagnosis\n  No evidence of structural disease to explain the symptoms"
        title: "Functional dyspepsia: لازم التلاتة"
        columns: ["الشرط", "الرقم"]
        rows:
          - ["Persistent symptoms", "For the prior 3 months"]
          - ["Symptom onset", "At least 6 months before diagnosis"]
          - ["Structural disease", "No evidence to explain symptoms"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: trap
        page: 11
        quote: "Dyspepsia secondary to organic disease\nTreat based on underlying disease\nKey causes of organic dyspepsia:\n  Peptic ulcer disease\n  H. pylori gastritis\n  Symptomatic gallstone disease\n  Pancreatitis\n  Medications (eg, NSAIDs)\n  Gastric or esophageal cancer"
        text: |
          ما تنساش الـ **organic causes** اللي ممكن تتلبّس functional: **peptic ulcer**، **H. pylori gastritis**، **gallstones**، **NSAIDs**، **pancreatitis**، و**gastric أو esophageal cancer**.

          ولما الست بتاعتنا رجعت بـ **melena** والـ Hb نزل لـ 10.5، بقت organic لحد ما يثبت العكس.
      - kind: case
        page: 11
        quote: "The patient was prescribed proton pump inhibitor for 8 weeks. However one month later she revisited the clinic reporting worsening of symptoms and black stools."
        stem: "The 42-year-old woman: Hb 12 g/dL, H. pylori stool antigen negative, normal thyroid tests, negative celiac serology, normal ECG."
        steps:
          - question: "Best initial treatment?"
            options: ["Empirical PPI", "Urgent endoscopy", "H. pylori eradication", "Abdominal CT"]
            answer: 0
            why: "H. pylori negative ومفيش alarm features: **empirical acid suppression**. وهي أخدت PPI لمدة 8 أسابيع."
          - reveal: "One month later: worse pain, black stools, marked pallor, Hb 10.5 g/dL."
            question: "Now?"
            options: ["Upper endoscopy", "Double the PPI", "Reassure", "Stool antigen again"]
            answer: 0
            why: "**Melena** و**anemia** = alarm features، فالمنظار بقى لازم."
      - kind: explain
        page: 12
        quote: "From antrum, incisura, fundus and body for topography of gastritis"
        title: "المنظار طلّع إيه؟ ونخد biopsies منين؟"
        text: |
          الكشف: **marked pallor**، coated tongue، epigastric tenderness، و **Hb 10.5**. المنظار: ==antral gastritis== و **peptic ulcer in the duodenal bulb**.

          - Biopsies من الـ **antrum, incisura, fundus and body**: علشان **topography of gastritis** (خريطة)، وكمان للـ **rapid urease test**.
          - من الـ **duodenal ulcer** نفسه: ==NO==.

          ليه مش من الـ DU؟ التفسير المقبول (مش في الكتاب): الـ duodenal ulcer تقريبًا عمره ما بيبقى malignant، فالعينة مش هتضيف حاجة. عكس الـ **gastric** ulcer، اللي هنشوف إنه لازم biopsy من حافته.
      - kind: try
        items: [git.L01.027, git.L01.033, git.L01.036, git.L01.040]
    recap:
      - "Dyspepsia = umbrella؛ المهم تلاقي القلة اللي عندها cancer."
      - "Alarm features: **VBAD WOMF**. أي واحدة = organic."
      - "FD: accommodation ضعيفة، تفريغ بطيء، حساسية زيادة، والتهاب خفيف."
      - "Urgent endoscopy: ≥55 + weight loss، >40 من منطقة high-risk، أو family history. CT: ≥60 + pain + weight loss."
      - "الباقي: H. pylori test and treat؛ negative = empirical acid suppression."
      - "Biopsies من antrum, incisura, fundus, body؛ مش من الـ DU."
    practice: [git.L01.025, git.L01.026, git.L01.027, git.L01.028, git.L01.029, git.L01.030, git.L01.031, git.L01.032, git.L01.033, git.L01.034, git.L01.035, git.L01.036, git.L01.037, git.L01.038, git.L01.039, git.L01.040, git.L01.041, git.L01.168, git.L01.169, git.L01.170, git.L01.196]
