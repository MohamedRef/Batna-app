# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: new
  ar_eg: جنب «ص» في كل خطوة في الدرس بقى فيه زرار «اختصارات»، بيوريك كل اختصار في الخطوة دي ومعناه، حتى اللي في الرسمة
  en: Next to the "ص" chip, each lesson step now has an abbreviations chip that lists every abbreviation on the step, figure labels included, with its meaning
- kind: improved
  ar_eg: القاموس بقى فيه حوالي ٢٠٠٠ اختصار زيادة، فاللمحة (بالقلم أو الماوس أو اللمس) بتشرح تقريبًا كل اختصار في الدروس
  en: The glossary gained about 2,000 abbreviations, so the peek (pen, mouse or tap) explains almost every abbreviation in the lessons
