          </svg>
      - kind: aside
        tone: analogy
        page: 38
        text: |
          تخيّل الدم عربيات طالعة من **الجيزة (الأمعاء والطحال)** رايحة **رمسيس (القلب)**، ولازم تعدّي على **وسط البلد (الكبد)**.

          - حادثة على **الكوبري قبل وسط البلد** = **pre-hepatic** (portal vein thrombosis).
          - زحمة **جوّه شوارع وسط البلد** = **hepatic**: في أول الشارع (pre-sinusoidal، البلهارسيا)، في الشارع نفسه (sinusoidal، الـ cirrhosis)، أو عند المخرج (post-sinusoidal).
          - الزحمة **عند ميدان رمسيس نفسه** = **post-hepatic** (Budd-Chiari، IVC web، أو القلب).

          في كل الحالات العربيات اللي ورا بتتكوّم، وده الـ portal hypertension.
      - kind: sort
        page: 38
        prompt: "صنّف الأسباب دي:"
        bins: ["Pre-hepatic", "Hepatic", "Post-hepatic"]
        cards:
          - { text: "Portal vein thrombosis", bin: 0 }
          - { text: "Splenic vein thrombosis", bin: 0 }
          - { text: "Massive splenomegaly", bin: 0 }
          - { text: "Schistosomiasis", bin: 1 }
          - { text: "Cirrhosis", bin: 1 }
          - { text: "Congenital hepatic fibrosis", bin: 1 }
          - { text: "Budd-Chiari syndrome", bin: 2 }
          - { text: "Constrictive pericarditis", bin: 2 }
          - { text: "Inferior vena caval web", bin: 2 }
        why: "الـ **massive splenomegaly** pre-hepatic علشان بتزوّد الـ **flow** الداخل للـ portal (مش انسداد). البلهارسيا و congenital hepatic fibrosis **pre-sinusoidal** جوه الكبد، والـ cirrhosis **sinusoidal**. والقلب (restrictive cardiomyopathy، constrictive pericarditis، severe CHF) **post-hepatic**."
      - kind: aside
        tone: exam
        page: 38
        text: |
          في مصر الـ **Schistosomiasis** نجمة الامتحان: هي **pre-sinusoidal** (البيض بيقعد في الـ portal venules).

          سؤال الكتاب نفسه: «Which can cause **pre-sinusoidal** PH?» والاختيارات right heart failure و Budd-Chiari و constrictive pericarditis و IVC… كلهم **post-hepatic**، والإجابة **Schistosomiasis**.
      - kind: reveal
        page: 38
        prompt: "لو عملنا قسطرة للـ hepatic vein: الـ **wedged** pressure (WHVP) بيقيس إيه؟ وإزاي ده بيفرّق بين المستويات؟"
        answer: |
          (ده من الـ physiology المعروفة، الكتاب بيسأل عنه في سؤال 6 من غير ما يشرحه.)

          لما تسد الـ hepatic vein بالـ balloon، الضغط اللي بتقيسه بيبقى ضغط الـ **sinusoids**. والـ **HVPG = WHVP − free hepatic venous pressure (FHVP)**.

          - **Sinusoidal** (cirrhosis): الـ wedged **عالي** والـ free طبيعي، فالـ HVPG **عالي**.
          - **Pre-sinusoidal / pre-hepatic** (schistosomiasis، portal vein thrombosis): الانسداد **قبل** الـ sinusoid، فالـ wedged **طبيعي** والـ HVPG طبيعي رغم إن فيه PH.
          - **Post-hepatic** (قلب، Budd-Chiari): الـ wedged والـ free **الاتنين عاليين**، فالفرق (HVPG) ممكن يبقى طبيعي.
      - kind: check
        page: 38
        question: "Before TIPS, a woman's free hepatic venous pressure is 6 mmHg and her wedged hepatic venous pressure is 13 mmHg. Which cause best fits?"
        options:
          - "Alcoholic cirrhosis"
          - "Portal vein thrombosis"
          - "Constrictive pericarditis"
          - "Schistosomiasis"
        answer: 0
        why:
          - "صح: HVPG = 13 − 6 = **7 mmHg** مع wedged عالي وfree طبيعي، يعني المشكلة **sinusoidal**، زي الـ cirrhosis."
          - "الـ PVT **pre-hepatic**: الـ wedged بيبقى طبيعي لأن الانسداد قبل الكبد."
          - "الـ constrictive pericarditis **post-hepatic**: الـ free pressure نفسه كان هيبقى عالي، مش 6."
          - "البلهارسيا **pre-sinusoidal**: الـ wedged بيبقى طبيعي أو قريب منه."
      - kind: update
        page: 38
        text: "Baveno VII بيعرّف الـ portal hypertension بـ **HVPG > 5 mmHg** (الطبيعي 1–5)، والـ **CSPH بـ HVPG ≥ 10 mmHg**. رقم الكتاب **أكتر من 10 mmHg** هو رقم الـ CSPH، وفي الامتحان اكتب رقم الكتاب."
        ref: "Baveno VII consensus, 2021"
      - kind: try
        items: [hb.L03.007, hb.L03.010, hb.L03.008, hb.L03.004, hb.L03.003]
    recap:
      - "الـ PH أشهر مضاعفة للـ cirrhosis والمحرّك الأساسي للـ decompensation."
      - "Compensated: امنع أول decompensation. Decompensated: امنع اللي بعدها (rebleeding، SBP، HRS، …) وحسّن الـ survival."
      - "Varices: **30%** وقت التشخيص، **90%** بعد 10 سنين. Predictors: **INR أكتر من 1.5، portal vein > 13 mm، thrombopenia**."
      - "Pre-hepatic: PVT، splenic vein thrombosis، massive splenomegaly. Pre-sinusoidal: schistosomiasis، congenital hepatic fibrosis."
      - "Sinusoidal: cirrhosis، alcoholic hepatitis. Post-sinusoidal: hepatic sinusoidal obstruction. Post-hepatic: Budd-Chiari، IVC webs، cardiac."
      - "HVPG = wedged − free. عالي في الـ sinusoidal، طبيعي في الـ pre-sinusoidal والـ pre-hepatic."
