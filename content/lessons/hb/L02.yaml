      - kind: explain
        page: 29
        quote: "Perform LSM (Vizzutti et al. Gut 2009;58:156-60)\n| ≤ 6 kPa | Intermediate values | ≥ 12.5 kPa |\n|---|---|---|\n| No significant fibrosis | Grey area | Advanced fibrosis |\n| F0, F1 | F2 | F3, F4 |\n| No biopsy | Biopsy if results influence management | No biopsy |\n| | Implementation of other NI tests | Treatment or Follow-up |"
        title: "إمتى الـ LSM يغنيك عن الـ biopsy؟"
        text: |
          الـ algorithm بتاع ==Vizzutti== في الكتاب بيقسم الـ liver stiffness measurement (LSM) لتلات مناطق:

          - 6 kPa أو أقل: F0–F1، يعني no significant fibrosis، ومفيش biopsy.
          - 12.5 kPa أو أكتر: F3–F4، يعني advanced fibrosis، ومفيش biopsy: علاج أو متابعة.
          - بينهم (grey area): غالبًا F2. اعمل biopsy if results influence management، أو استخدم other non-invasive tests.

          المنطق: الطرفين واضحين، فالـ biopsy مش هتضيف حاجة غير خطر الإبرة. الـ biopsy مكانها المنطقة الرمادية، وبس لو نتيجتها هتغيّر قرارك.

          مثال: مريض hepatitis C virus (HCV) عنده 9 kPa. لو هتعالجه في كل الأحوال، الـ biopsy مش هتفرق، فاستخدم تست تاني بدالها.
