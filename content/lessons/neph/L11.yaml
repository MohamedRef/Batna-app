            <text x="25" y="100" class="t-sm t-b">Dialysate</text>
            <text x="25" y="117" class="t-sm">K 3-3.5 · HCO3 25-30 · Ca 2.5</text>
            <text x="25" y="142" class="t-sm t-b">Dialyzer</text>
            <text x="25" y="159" class="t-sm">Biocompatible, single use</text>
            <text x="25" y="184" class="t-sm t-b">Dry weight</text>
            <text x="25" y="201" class="t-sm">+0.4-0.5 kg / week after 1st trimester</text>
            <text x="25" y="226" class="t-sm t-b">Diet</text>
            <text x="25" y="243" class="t-sm">35 kcal/kg · protein 1.5-1.8 g/kg · B, C</text>
            <rect x="15" y="254" width="300" height="32" rx="6" class="fg-good"/>
            <text x="25" y="275" class="t-sm">Nocturnal: 7-8 h, 5-7 nights/week</text>
          </svg>
      - kind: reveal
        page: 378
        quote: "dialyzing a pregnant woman would mandate low bicarbonate dialysate to avoid alkalemia"
        prompt: "ليه الحامل بتاخد dialysate bicarbonate واطي (25-30)؟"
        answer: "الحمل أصلًا فيه **respiratory alkalosis**. لو دّيتها bicarbonate عادي مع جلسات يومية هتعمل ==alkalemia==. ونفس المنطق: جلسات كتير = خطر **hypokalemia و hypocalcemia و hypophosphatemia**، فالـ K 3-3.5 والـ Ca 2.5."
      - kind: check
        page: 379
        quote: "the dry weight can be increased by 400 gm per week to account for the growing fetus weight"
        question: "At 24 weeks, a euvolemic woman on HD: how should her dry weight be set?"
        options:
          - "Raise it about 400 g each week"
          - "Keep it fixed from conception"
          - "Lower it 0.5 kg each week"
          - "Raise it 2 kg each week"
        answer: 0
        why:
          - "صح: الجنين بيزيد 0.3-0.5 kg في الأسبوع، فالـ dry weight يزيد حوالي 400 g (Fig 4 بتقول لحد 0.5 kg)."
          - "كده هتشيل سوايل الجنين وتعمل hypovolemia."
          - "بالعكس، الوزن بيزيد."
          - "كتير جدًا؛ هتعمل fluid overload."
      - kind: aside
        tone: joke
        page: 378
        quote: "Up to 36 hours of dialysis weekly is recommended for women, targeting predialysis serum blood urea nitrogen of<50mg/dL"
        text: |
          36 ساعة غسيل في الأسبوع؟ دي مش جلسات، دي ==إقامة==. بس كل ساعة زيادة فوق الـ 20 بتزوّد وزن البيبي وعمر الحمل.
      - kind: explain
        page: 380
        title: "الـ PD: مميزات بس الرحم بيزاحم"
        quote: "The advantages of peritoneal dialysis during pregnancy are controlled ultrafiltration, better hemodynamic stability, a lesser incidence of anemia, better control of BP"
        text: |
          مميزات الـ PD: ultrafiltration مضبوط، hemodynamics أهدى، anemia أقل، ضغط أحسن، و **مفيش anticoagulation**.

          لكن الرحم بيكبر فالـ ==effective surface area== بتقل (الغشاء نفسه سليم). والـ residual urine **>500 mL** = نتيجة أحسن.
      - kind: mnemonic
        page: 381
        quote: "Use tidal peritoneal dialysis, which leaves 15% of the dwell volume in situ while draining, to reduce drain pain and gastroesophageal reflux."
        word: "SCTDL"
        parts:
          - { key: "S", text: "Smaller dwell volumes, more frequent exchanges" }
          - { key: "C", text: "Cycler overnight + manual day exchanges (3rd trimester)" }
          - { key: "T", text: "Tidal PD: leave 15% in to cut drain pain and reflux" }
          - { key: "D", text: "Dextrose 4.25%: minimize it" }
          - { key: "L", text: "Lateral decubitus while draining" }
        hook: "**S**mall **C**ycles **T**ake **D**elicate **L**adies: كل حاجة في الـ PD بتصغر وتكتر مع الرحم."
      - kind: explain
        page: 382
        title: "مضاعفات الـ PD"
        quote: "may occur if maternal urea levels are high enough to cause an osmotic diuresis in the fetus causing increased urine production by the fetus"
        text: |
          Kt/V **2.2-2.4** (حوالي 20 لتر في اليوم)، و **25 kcal/kg**.

          المضاعفات: peritonitis، exit-site infection، catheter displacement، hemoperitoneum، drain pain، reflux، ونادرًا uterine rupture.

          و ==polyhydramnios==: اليوريا العالية عند الأم = **osmotic diuresis** عند الجنين. راقب الـ K والـ phosphate.
