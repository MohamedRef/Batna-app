  - id: res.L12.002
    kind: card
    topic: validity
    front: "What is meant by the external validity of a research study?"
    back: "The extent to which the study results for the study population can be generalized to the whole target population."
    src: { page: 4, quote: "What is meant by?\nExternal validity of the research\nIt Refers to the extent to which the study results for the study population can be\nGeneralized to the whole target population." }
    status: unverified
    tags: [definition, high-yield]
  - id: res.L12.003
    kind: card
    topic: validity
    front: "What is meant by the internal validity of a research study?"
    back: "The extent to which the study results obtained reflect the 'truth' in the study population, i.e. the true relationship between the dependent and independent variables."
    src: { page: 5, quote: "What is meant by?\nInternal validity of the research\nIt Refers to the extent to which the study results obtained\nReflect the 'truth' in the study population.\nThe relationship between dependent and independent variables" }
    status: unverified
    tags: [definition, high-yield]
  - id: res.L12.004
    kind: mcq
    topic: validity
    stem: "A well-run study on hospital nurses in Alexandria gives results that truly reflect the relation between night shifts and insomnia among those nurses, but they cannot be applied to all Egyptian nurses. This study has:"
    options:
      - "Good internal validity but poor external validity"
      - "Good external validity but poor internal validity"
      - "Poor internal and external validity"
      - "Good internal and external validity"
    answer: 0
    why:
      - "Truth inside the study population = internal validity; failure to generalize to the target population = poor external validity."
      - "It is the other way round: the results are true for the nurses studied but don't generalize."
      - "The results do reflect the truth in the study population, so internal validity is good."
      - "The results cannot be generalized, so external validity is poor."
    src: { page: 5, quote: "What is meant by?\nInternal validity of the research\nIt Refers to the extent to which the study results obtained\nReflect the 'truth' in the study population.\nThe relationship between dependent and independent variables" }
    status: unverified
    tags: [high-yield]
