      - kind: explain
        page: 56
        quote: "Acute gout flare in a patient with CKD\n  Classical or atypical presentation?\n    Classical: Clinical diagnosis\n      Acute treatment\n        Colchicine (1.2 mg orally followed by 0.6 mg 1 h later; if subsequent dosing required, adjust per kidney function)\n        or Prednisone 30 mg with taper (10–14 d)\n        or Intra-articular steroids (only if few joints involved)\n        or Consider anakinra or canakinumab (if above treatment fails)\n    Atypical\n      Diagnostic testing\n        Aspirate joint to look for urate crystals and to rule out infection or other causes such as pseudogout from calcium pyrophosphate crystals\n        Consider DECT imaging if available\n      Gout is diagnosed: Acute treatment"
        title: "النقرس في الـ CKD"
        text: |
          **الحاد**: ==colchicine== 1.2 mg وبعده 0.6 mg بعد ساعة، أو **prednisone 30 mg** مع taper على 10–14 يوم، أو intra-articular لو مفاصل قليلة. لو فشل: anakinra أو canakinumab. **مش non-steroidal anti-inflammatory drugs (NSAIDs)**.

          **المزمن**: ==xanthine oxidase inhibitor== أحسن من الـ uricosurics.

          - **Allopurinol**: ابدأ **50 mg** وزوّد بالراحة لحد 800 mg
          - قبله اعمل **HLA-B*5801 testing** للآسيويين والأفارقة
          - **Febuxostat**: 20–40 لحد 120
          - الهدف: ==serum urate (SU) < 6 mg/dL==
          - فشل؟ **pegloticase + methotrexate** لو الـ estimated glomerular filtration rate (eGFR) فوق 40
          - أو **pegloticase + mycophenolate** لو الـ eGFR تحت 40

          التفسير المقبول (مش في الكتاب): مش NSAIDs **لأن** بيقللوا الدم الواصل للكلية وممكن يعملوا AKI. وبنبدأ الـ allopurinol بجرعة صغيرة **عشان** نقلل خطر الـ hypersensitivity والـ flare.
      - kind: explain
        page: 56
        quote: "and to rule out infection or other causes"
        title: "ليه نبزل المفصل، وليه نبدأ allopurinol بالراحة؟"
        text: |
          رسمة ص 56: لو الـ presentation مش كلاسيكي، **aspirate the joint** تدوّر على urate crystals، **و to rule out infection or other causes** زي الـ pseudogout، وممكن DECT.

          التفسير المقبول (مش في الكتاب): المفصل الملتهب ممكن يبقى **septic arthritis**، ولو اديته steroids وهو عدوى هتدمّر المفصل. والـ **pseudogout** علاجه مختلف ومش بيستفيد من تخفيض الـ urate.

          وفي ص 57: الـ ==allopurinol== بيبدأ **50 mg** ويزيد بالراحة، وقبله **HLA-B*5801** في الآسيويين والأفارقة. التفسير المقبول (مش في الكتاب): الـ metabolite بتاعه بيطلع من الكلية وبيتجمع في الـ CKD، والجرعة العالية بدري و الـ ==HLA-B*5801== مرتبطين بـ hypersensitivity خطيرة على الجلد.

          **يعني** البزل بيحدد التشخيص، والبداية الهادية بتحمي المريض.
