  - id: neph.L07.090
    kind: card
    topic: adpkd-novel
    front: What did the TEMPO trial of tolvaptan show?
    back: In ADPKD with creatinine clearance above 60 mL/min, 3 years of split-dose tolvaptan slowed kidney volume growth and kidney function decline and reduced ADPKD events (pain, hematuria, UTI).
    src: { page: 162, quote: "In a large, phase III parallel-arm RCT in patients with ADPKD with estimated creatinine clearance above 60 ml/min, a split daily dose of the V₂ receptor antagonist tolvaptan administered over 3 years slowed the increase in kidney volume and decline in kidney function and lowered the frequency of ADPKD-related adverse events (kidney pain, hematu-ria, UTI).37 However, tolvaptan was associated with a higher frequency of aquaresis-related adverse events (polyuria, thirst, urinary frequency, nocturia) that led to drug discontinuation in 8.3% of tolvaptan-treated patients. In addition, clinically significant increases in liver enzymes (>2.5 times the upper limit of normal) were seen in 4.9% of tolvaptan-treated Moderate increases in serum sodium and uric acid levels were also seen." }
