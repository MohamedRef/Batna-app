          - ==Elafibranor==: بيقلّل إنتاج الـ bile acid، وبيخلّي اللي بيتعمل أقل ضررًا. نفس indications الـ OCA. Side effects: constipation، و diarrhoea، و headache، و nausea.

          اربطها كده: الـ UDCA أساس العلاج، والـ OCA أو الـ elafibranor هما الخطوة التانية.
