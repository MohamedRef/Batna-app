        alt: "Book histology of high-grade dysplasia in Barrett esophagus: crowded dark nuclei through the full thickness of the epithelium, with a villous surface."
        caption: |
          الأنوية واصلة ==لفوق خالص== (full-thickness)، والسطح **villous**.
      - kind: table
        page: 291
        quote: "There is full-thickness nuclear stratification and the mucosa has a villous appearance"
        title: "الـ histology في الكتاب"
        columns: ["Grade", "What the pathologist sees"]
        rows:
          - ["Non-dysplastic", "Glandular epithelium with goblet cells"]
