      - kind: check
        page: 279
        quote: "ADA 2024: Diabetic Dyslipidemia\n10.30 In individuals with atherosclerotic cardiovascular disease or other cardiovascular risk factors on a statin with controlled LDL cholesterol but elevated triglycerides (135–499 mg/dL), the addition of icosapent ethyl can be considered to reduce cardiovascular risk. A"
        question: "Per ADA 2024, icosapent ethyl is considered when TG on a statin (with controlled LDL-C) is:"
        options:
          - "135-499 mg/dL"
          - "Above 500 mg/dL"
          - "Below 100 mg/dL"
          - "Any level, even without a statin"
        answer: 0
        why:
          - "صح: 135-499 (ESC و REDUCE-IT: 150-499)."
          - "فوق 500 ده مدى تاني (خطر pancreatitis)، مش الـ recommendation دي."
          - "ده TG طبيعي."
          - "الـ recommendation بتقول على statin."
      - kind: explain
        page: 279
        title: "إزاي تقرا الـ NNT"
        quote: "Reduction of Cardiovascular Events with Icosapent Ethyl–Intervention Trial (REDUCE-IT): 2 g of Icosapent Ethyl twice daily (total 4 g daily) vs Placebo, 4.9 years; Phase 3b, multi-center, randomized, double-blind, placebo controlled trial\n| | Primary endpoint | Secondary endpoint |\n|---|---|---|\n| Outcome | CV Death, MI, Stroke, Coronary Revasc, Unstable Angina | CV Death, MI, Stroke |\n| Relative reduction | 25 % | 26 % |\n| Hazard Ratio | 0.75 (95% CI 0.68–0.83) | 0.74 (95% CI 0.65–0.83) |\n| RRR | 24.8% | 26.5% |\n| ARR | 4.8% | 3.6% |\n| NNT | 21 (95% CI 15–33) | 28 (95% CI 20–47) |\n| P | 0.00000001 | 0.0000006 |"
        text: |
          الجدول فيه رقمين بيتلخبطوا: الـ **relative risk reduction (RRR)** 24.8% والـ ==absolute risk reduction (ARR)== 4.8%.
          - الـ RRR: الخطر نزل **ربعه** تقريبًا.
          - الـ ARR: من كل 100 عيان، **4.8** عيان أقل جالهم event.
          - الـ **number needed to treat (NNT)** = 1 ÷ ARR: 1 ÷ 0.048 ≈ **21**. وفي الـ key secondary: 1 ÷ 0.036 ≈ **28**.

          يعني تعالج 21 عيان **4.9 سنة** عشان تمنع event واحد. الـ RRR بيبان كبير دايمًا؛ الـ NNT هو اللي بيقولك الدوا بيفرق قد إيه في العيادة.
      - kind: explain
        page: 280
        title: "الـ FDA"
        quote: "The FDA approved use of Icosapent ethyl ( EPA ) as an adjunctive therapy to reduce CV risk of among adults with elevated triglyceride > 150 mg/dl."
        text: |
          الـ US Food and Drug Administration (FDA) وافقت على ==icosapent ethyl (EPA)== كـ **add-on** يقلل الـ CV risk في الكبار اللي الـ TG عندهم **فوق 150 mg/dL** ومعاهم **CVD** أو **سكر + risk factors**.

          أول دوا يستهدف الـ **residual CV risk** فوق أعلى جرعة statin، واتوافق عليه في **4 شهور** بناءً على REDUCE-IT.

          ليه الموافقة كانت بالسرعة دي؟ لأن REDUCE-IT كانت **outcome trial** (أحداث حقيقية، مش رقم في التحليل)، وعلى ناس واخدين statin أصلًا، فالسؤال "هل فيه فايدة **فوق** الـ statin؟" اتجاوب مباشرة.
      - kind: update
        page: 279
        quote: "Reduction of Cardiovascular Events with Icosapent Ethyl–Intervention Trial (REDUCE-IT): 2 g of Icosapent Ethyl twice daily (total 4 g daily) vs Placebo, 4.9 years; Phase 3b, multi-center, randomized, double-blind, placebo controlled trial\n| | Primary endpoint | Secondary endpoint |\n|---|---|---|\n| Outcome | CV Death, MI, Stroke, Coronary Revasc, Unstable Angina | CV Death, MI, Stroke |\n| Relative reduction | 25 % | 26 % |\n| Hazard Ratio | 0.75 (95% CI 0.68–0.83) | 0.74 (95% CI 0.65–0.83) |\n| RRR | 24.8% | 26.5% |\n| ARR | 4.8% | 3.6% |\n| NNT | 21 (95% CI 15–33) | 28 (95% CI 20–47) |\n| P | 0.00000001 | 0.0000006 |"
        text: "الـ icosapent ethyl ده **EPA نقي** بجرعة عالية، مش أي omega-3. تجربة **STRENGTH (2020)** بخليط EPA + DHA بـ 4 g ما قللتش الأحداث، فالنتيجة ما بتتعممش على مكمّلات الـ fish oil. وفيه نقاش إن الـ placebo في REDUCE-IT (mineral oil) ممكن يكون كبّر الفرق شوية. الامتحان: أرقام الكتاب."
        ref: "STRENGTH trial, JAMA 2020"
      - kind: explain
        page: 280
        title: "ليه كل سكري فوق 40؟"
        quote: "Take a Home Message:\n  1. Unless contra-indicated, and if tolerated, ALL Diabetic patients above 40 years, Should be STATINIZED!!"
        text: |
          الـ home message مش جاية من فراغ؛ المحاضرة كلها بتبنيها:
          1. السكر بيأذي الـ endothelium من 3 أذرع (رسمة ص 272).
          2. الـ statin بيعكس الأذى ده (**pleiotropic effects**)، حتى لو الـ LDL مش عالي (**JUPITER**).
          3. عيان "كويس" زي عيان الكتاب طلع خطره **27.6%**.

          النتيجة: ==all diabetic patients above 40== ياخدوا statin، **unless contra-indicated** و **if tolerated**. والـ TG العالي بعد كده له إضافته (icosapent ethyl)، بس الـ statin الأول.
      - kind: aside
        tone: exam
        page: 280
        quote: "Take a Home Message:\n  1. Unless contra-indicated, and if tolerated, ALL Diabetic patients above 40 years, Should be STATINIZED!!"
        text: "الـ **home message** بتاعة المحاضرة: إلا لو فيه contraindication أو مش مستحمل، ==كل سكري فوق 40 سنة ياخد statin==. اكتبها كده في الامتحان."
