        quote: "Drink water for better health and kidneys Drink enough water based on thirst (maintain euvolemia)."
        title: "السعرات والمية"
        text: |
          **سعرات**: ==30–35 kcal/kg/day==.

          **المية**:

          - اشرب على قد **العطش** (euvolemia)
          - أكتر في الـ **stones** المتكررة، وممكن في الـ autosomal dominant polycystic kidney disease (ADPKD)
          - مفيش فايدة واضحة لزيادة المية في وقف الـ progression
          - أكتر من ==1.5 L/day== questionable، وممكن تسرّع الـ progression
          - في الـ advanced CKD ممكن نحتاج نقلّل

          التفسير المقبول (مش في الكتاب): المية الزيادة مش بتحمي الكلية **لأن** الـ progression مش بيحصل من نقص مية في المريض اللي مش عطشان. والـ stones هي الاستثناء **عشان** المية بتخفف البول فالبلورات متتكوّنش.
