name: Android APK

# Builds a debug arm64 APK with dx and checks that the Kotlin glue in android/
# made it in (scripts/android-check-apk.sh). This is only a build check: the
# signed preview APK, its update feed and the release build come with chunk 22,
# which can fold this job into its own workflow.

on:
  push:
    branches: [batna]
    paths:
      - .github/workflows/android-apk.yml
      - android/**
      - crates/app/AndroidManifest.xml
      - crates/app/Dioxus.toml
      - crates/app/Cargo.toml
      - crates/app/src/kotlin.rs
      - scripts/android-check-apk.sh
  pull_request:
    branches: [batna]
    paths:
      - .github/workflows/android-apk.yml
      - android/**
      - crates/app/AndroidManifest.xml
      - crates/app/Dioxus.toml
      - crates/app/Cargo.toml
      - crates/app/src/kotlin.rs
      - scripts/android-check-apk.sh
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: APK builds with the Kotlin glue
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-apk
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0
      - name: Install dx 0.7.10
        run: cargo binstall -y --force dioxus-cli@0.7.10
      - name: Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          echo "$BT" >> "$GITHUB_PATH"
      - name: Build APK
        working-directory: crates/app
        run: |
          dx bundle --platform android --release --package-types apk \
            --target aarch64-linux-android --no-default-features --features mobile \
            --out-dir ../../dist/android
      - name: Check the APK
        run: |
          APK="$(find dist/android -name '*.apk' -print -quit)"
          scripts/android-check-apk.sh "$APK"
