- id: hb.L09.034
  kind: card
  topic: diagnosis
  front: Which ascitic enzyme is raised in malignant ascites?
  back: LDH.
  src:
    page: 150
    quote: "Lactate dehydrogenase (LDH) (increased LDH in malignant ascites)."
  status: unverified
- id: hb.L09.035
  kind: card
  topic: diagnosis
  front: How should ascitic fluid be cultured?
  back: Inoculate 10–20 mL into two blood culture bottles (aerobic and anaerobic) at the bedside.
  src:
    page: 150
    quote: should be inoculated into two [aerobic and anaerobic] blood culture bottles at the bedside
  status: unverified
- id: hb.L09.036
  kind: card
  topic: diagnosis
  front: Pitfall of ascitic cytology?
  back: Normal peritoneal epithelial cells can resemble malignant cells, so cancer can be over-diagnosed.
  src:
    page: 150
    quote: "Cytological analysis for malignant cells Note that the normal epithelial cells in the peritoneum can resemble malignant cells, thus"
  status: unverified
- id: hb.L09.037
