  - id: rheum.L14.lesson4
    title: "الـ Anabolics والاختيار والـ GIOP"
    hook: "مش كل مريض يبدأ بالـ alendronate. اللي عضمه قرّب يخلص محتاج حد يبني، مش بس حد يوقف الهدد."
    minutes: 8
    pages: [227, 232]
    topics: [anabolic, strategy]
    goals:
      - "تعرف الـ teriparatide والـ romosozumab"
      - "تختار الدوا حسب المريض من جدول الكتاب"
      - "تعرف المتابعة والـ GIOP"
    status: unverified
    steps:
