            <text x="185" y="210" class="t-sm t-b">Severe infection</text>
            <text x="185" y="226" class="t-sm t-b">Severe hemolysis</text>
            <text x="185" y="242" class="t-sm t-b">Metastatic cancer</text>
          </svg>
      - kind: reveal
        page: 66
        quote: "Leukoerythroblastic picture: a presence of a shift to left plus nucleated RBC in the peripheral blood."
        prompt: "ليه الـ nucleated RBCs مع الـ left shift بيخوّفك أكتر من الـ left shift لوحده؟"
        answer: |
          الـ left shift لوحده ممكن يبقى **عدوى عادية**: النخاع بيبعت الـ neutrophils قبل ما تنضج عشان الطلب كبير.

          بس الـ **nucleated RBCs** معناها إن الخط الأحمر كمان بيطلع صغير. التفسير المقبول (مش في الكتاب): ده غالبًا مش طلب، ده **النخاع اتزحم أو اتليّف**، فالخلايا الصغيرة بتتزق برّه، أو إن الدم بيتعمل برّه النخاع (في الطحال) من غير الـ "بواب" اللي بيمسك الصغيرين.

          عشان كده أسبابه في الكتاب أغلبها حاجات **بتحتل النخاع**: metastases، myelofibrosis، leukaemia، myeloma، lymphoma، miliary TB، osteopetrosis. والاستثناء: megaloblastic شديدة و haemolysis شديدة، اللي النخاع فيهم مضغوط بطلب ضخم.
      - kind: mnemonic
        page: 66
        quote: "Causes of leucoerythroblastic blood film\n  Metastatic neoplasm in the marrow\n  Primary myelofibrosis\n  Acute and chronic myeloid leukaemia\n  Myeloma, lymphoma\n  Miliary tuberculosis\n  Severe megaloblastic anaemia\n  Severe hemolysis\n  Osteopetrosis"
        word: "MMMMMM HO"
        parts:
          - { key: "M", text: "Metastatic neoplasm in the marrow" }
          - { key: "M", text: "Myelofibrosis (primary)" }
          - { key: "M", text: "Myeloid leukemia, acute and chronic" }
          - { key: "M", text: "Myeloma, lymphoma" }
          - { key: "M", text: "Miliary tuberculosis" }
          - { key: "M", text: "Megaloblastic anemia (severe)" }
          - { key: "H", text: "Hemolysis (severe)" }
          - { key: "O", text: "Osteopetrosis" }
        hook: "ستة **M** وبعدين **HO**: الـ marrow اتزحم فطرد الصغيرين بره، حتى الـ nucleated RBCs."
      - kind: explain
        page: 66
        title: "الـ leukemoid: شكله leukaemia وهو مش"
        quote: "In other words (leukocytosis + left shift). Usually it is a neutrophil leukocytosis. It can be lymphoid"
        text: |
          الـ ==leukemoid reaction== = leukocytosis **زيادة عن اللزوم** + left shift، وفيه myeloblasts و promyelocytes و myelocytes في الدم. غالبًا **neutrophil leukocytosis**، وممكن تبقى **lymphoid**.

          أسبابه في الكتاب تلاتة: **severe infection**، **severe haemolysis**، **metastatic cancer**.

          ليه الاسم "leukemoid"؟ لأن الـ film **شبه الـ leukaemia**. الفرق إنه **reactive**: النخاع سليم وبيرد على حاجة برّه، ولما السبب يروح، الصورة ترجع. التفسير المقبول (مش في الكتاب): عشان كده أول حاجة تعملها إنك تدوّر على السبب (عدوى، haemolysis، cancer) قبل ما تفكر في leukaemia.
      - kind: check
        page: 66
