        title: "ليه كل cast بيشاور على مكان؟"
        text: |
          التفسير المقبول (مش في الكتاب) لرسمة الـ sediment في الكتاب:

          - **Cast** = قالب بيتعمل جوه الـ **tubule**، **فـ** أي حاجة جوه الـ cast كانت في الـ tubule.
          - **RBC casts:** الكرات الحمرا عدّت الـ glomerulus المجروح واتحبست في القالب، **يعني** GN أو vasculitis.
          - **RTE cells و granular casts:** خلايا tubule ماتت ووقعت، **فـ** ATN.
          - **Pigmented casts:** myoglobin أو hemoglobin.
          - **Eosinophiluria:** حساسية في الـ interstitium (allergic interstitial nephritis).
          - **Bland sediment:** الكلية نفسها سليمة، **يبقى** prerenal أو postrenal أو مشكلة في الشريان الكبير.
          - **Crystals:** uric acid، calcium oxalate (ethylene glycol)، أو أدوية (acyclovir، indinavir، sulfadiazine، amoxicillin).
