- id: res.L15.114
  kind: mcq
  topic: dispersion
  stem: SD of the weights 5, 7, 4, 8 and 6 kg?
  options:
  - 1.58 kg
  - 2.5 kg
  - 1.41 kg
  - 10 kg
  answer: 0
  why:
  - Mean 6; squared deviations 1+1+4+4+0 = 10; 10 ÷ (5 − 1) = 2.5; √2.5 = 1.58.
  - 2.5 is the variance.
  - √2 = 1.41 comes from dividing by n (5), not n − 1.
  - 10 is the sum of squares.
  src:
    page: 134
    quote: |-
      Example: Find the standard deviation of the following weight values 5, 7, 4, 8 and 6 Kg.
      Solution:
      1- X̄ = ΣX / n = 30 / 5 = 6 Kg
      2- Deviation of values from X̄
      5 – 6 = - 1
      7 – 6 = + 1
      4 – 6 = - 2
      8 – 6 = + 2
      6 – 6 = 0
      3- Square the deviation and sum
      (-1)² + (+1)² + (-2)² + (+2)² + (0)² = 1+1+4+4= 10
      S = √[ Σ(X – X̄)² / (n – 1) ] = √(10/4) = √2.5 = 1.58 Kg
  status: unverified
  tags: [high-yield]
