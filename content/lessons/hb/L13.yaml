        why: "الـ definite: titre ≥ 1:80، مفيش أدوية ولا نقل دم، والكحول أقل من 25 g/day. الـ probable بتسمح بـ titre ≥ 1:40، بتاريخ أدوية أو دم أو كحول، وبالـ investigational antibodies زي anti-SLA/LP. الاتنين محتاجين gamma globulin (GG) ≥ 1.5× normal."
      - kind: reveal
        page: 204
        quote: "Diagnosed after exclusion of other chronic liver diseases."
        prompt: "ليه مش كفاية ANA موجب + interface hepatitis علشان تقول AIH؟"
        answer: |
          لأن الـ AIH في تعريفها نفسه **diagnosed after exclusion of other chronic liver diseases**.

          الـ interface hepatitis والـ autoantibodies ممكن يظهروا في أمراض كبد تانية (viral، Wilson، drugs...). علشان كده الـ algorithm بيحط خطوة الاستبعاد قبل الـ biopsy: لو نسيتها ممكن تدي steroids لواحد عنده HBV أو Wilson.
      - kind: check
        page: 206
        quote: "Such as antibodies to the asialoglycoprotein receptor (anti-ASGPR), soluble liver antign/liver-pancreas (anti-SLA/LP), actin (antiactin), or liver cytosol type 1 (anti-LC1), are classified as having a probable disease."
        question: "A woman has features of AIH. ANA, SMA and anti-LKM1 are negative, but anti-SLA/LP is positive. How is she classified?"
        options:
          - "Probable AIH"
          - "Definite type 1 AIH"
          - "Definite type 2 AIH"
          - "AIH is excluded"
        answer: 0
        why:
          - "صح: اللي مالوش conventional autoantibodies وعنده investigational marker (زي anti-SLA/LP) بيتصنّف **probable**."
          - "الـ type 1 محتاج **ANA و/أو SMA**، وهي سالبين."
          - "الـ type 2 محتاج anti-LKM1، وهو سالب."
          - "غلط: غياب الـ conventional antibodies مش بينفي الـ AIH، بيخليها probable."
      - kind: aside
        tone: exam
        page: 206
        quote: "Figure 1: Diagnostic algorithm for autoimmune hepatitis\nAbnormal AST and GG levels, AST: Alkaline Phosphatase >\n↓ AMA- ceruloplasmin normal α1 antitrypsin phenotype normal, Normal or nonspecific iron level, HBsAg, anti -HCV, IgM anti-HAV-\n↓ Interface hepatitis ± lobular hepatitis\n| Definite | Probable |\n|---|---|\n| GG ≥ 1.5 normal | GG ≥ 1.5 normal |\n| ANA, SMA or LKM 1 ≥ 1:80 | ANA, SMA or LKM 1 ≥ 1:40 |\n| No drugs or blood products | Previous drugs or blood products |\n| Alcohol < 25 gm/d | Alcohol use |\n| | Other liver-related authoantibodies |\n| Type 1: ANA and/or SMA+ | Type 2: LKM1+ |"
        text: |
          الأرقام اللي بتتسأل: GG ≥ 1.5× normal في الاتنين، و 1:80 للـ definite و 1:40 للـ probable، والكحول < 25 g/day للـ definite.

          سهلة: الـ definite «ضعف» الـ probable في الـ titre (80 = 2 × 40).
