        quote: "Cytarabine: 75 mg/m2/per dose IVI or subcutaneous."
        text: |
          **Course 1**:
          - Cyclophosphamide 800 mg/m2 أيام 1 و 28
          - ==6-mercaptopurine== 60 mg/m2 بالبق **بالليل على معدة فاضية** أيام 1–27
          - Vincristine 1.4 mg/m2 أيام 14، 18، 22، 25
          - Cytarabine 75 mg/m2 IV أو SC على 4 بلوكات

          **Course 2**: doxorubicin، **etoposide** 100 mg/m2 أيام 1–5، cyclophosphamide. وممكن يتكرروا **مرة أو اتنين**.
      - kind: check
