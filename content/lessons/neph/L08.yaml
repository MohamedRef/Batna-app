  - id: neph.L08.lesson11
    title: "Case 3: membranous والـ anti-PLA2R"
    hook: "الـ antibody في الدم سلبي، بس الكلية لسه شايلة الـ antigen. الـ biopsy بيقول إن المرض كان هنا."
    minutes: 10
    pages: [231, 236]
    topics: [membranous]
    goals:
      - "تقرا case 3 من الـ labs لحد الـ EM وتعرف ليه كل سطر في التقرير"
      - "تعرف أسباب الـ secondary MN وليه الكبير محتاج يدوّر على tumour"
      - "تفهم الـ anti-PLA2R في التشخيص والمتابعة، وتقرا جدول الـ serum مع الـ tissue"
    status: unverified
    steps:
      - kind: explain
        page: 231
        title: "Case 3: الـ labs والسؤال عن الـ RVT"
        quote: "TGs= 203 mg/dL. LDH=337 U/L. C3=85 (↓). ANA: -ve. Virology: -ve. Anti PLAR2: -ve. Doppler U/S: ? RVT."
        text: |
          العيانة: **creatinine 1.1**، **albumin 2.1**، **uPCR 6.7**، cholesterol 262، TGs 203، **C3 85 (واطي شوية)**، **ANA** و **virology** سلبي، و ==serum anti-PLA2R سلبي==. والـ **Doppler U/S** بيسأل عن ==renal vein thrombosis (RVT)==.

          ليه الأسئلة دي؟ التفسير المقبول (مش في الكتاب):
          - **ANA** و **virology** علشان يستبعدوا **secondary** membranous (lupus، hepatitis B و C).
          - الـ **RVT** أشهر في الـ membranous من أي nephrotic تاني، وخصوصًا لما الـ albumin يبقى واطي جدًا زي هنا؛ الـ nephrotic بيخسّر الجسم بروتينات بتمنع التجلط في البول، فالدم يبقى أسهل يتجلط.
          - والـ anti-PLA2R السلبي **مش** بيشيل الـ primary MN، زي ما هتشوف.
      - kind: check
        page: 231
        quote: "Examination of congo red stained sections viewed under polarized light revealed no amyloid deposits."
        question: "Before reading case 3's glomeruli, the pathologist rules out amyloid. Which stain, and how is it viewed?"
        options:
          - "Congo red under polarized light"
          - "PAS under ordinary light"
          - "Methenamine-silver under ordinary light"
          - "Masson's trichrome under polarized light"
        answer: 0
        why:
          - "صح: الكتاب: **congo red** stained sections **viewed under polarized light**."
          - "الـ PAS للـ matrix والـ basement membranes، مش للـ amyloid."
          - "الـ silver للـ GBM (spikes و double contour)."
          - "الـ trichrome للـ fibrosis، ومش بيتقرا بالـ polarized light."
      - kind: explain
        page: 231
        title: "الـ LM: كل سطر بيحكي"
        quote: "The patent glomeruli showed diffuse moderate capillary basement membrane thickening. Six glomeruli showed segmental tuft sclerosis."
        text: |
          الـ LM: **23 glomeruli**، **6 globally sclerosed**. الـ patent glomeruli فيها ==diffuse moderate capillary basement membrane thickening==، و **6** فيهم **segmental tuft sclerosis**. الـ tubules: focal mild injury، و ==cholesterol clefts== حواليها **giant cell reaction**، و patchy moderate atrophy. الـ interstitium: mild lymphocytic infiltrate و **numerous foam cells** فوق **patchy moderate fibrosis (30%)**. الـ arterioles: mild hyalinosis.

          ليه؟ التفسير المقبول (مش في الكتاب):
          - الـ **GBM thickening** من الـ subepithelial deposits ومن الغشا الجديد اللي بيتبني حواليها.
          - الـ **segmental sclerosis** هنا غالبًا **secondary**: podocytes كتير ماتت من الأذى الطويل، فأجزاء من الـ tuft اتلزقت واتندّبت.
          - الـ **cholesterol clefts** والـ **foam cells** من الدهون العالية: macrophages بلعت cholesterol، والـ giant cells بتحاول تبلع البلورات.
          - الـ **fibrosis 30%** والـ glomeruli المتندّبة بيقولوا إن المرض **مش جديد**، حتى لو العيانة صغيرة.

          إزاي تقرا الـ membranous بالـ LM من غير silver؟ التفسير المقبول (مش في الكتاب): بدري جدًا الـ LM ممكن يبان طبيعي، والـ deposits صغيرة. مع الوقت الغشا يتخن «stiff» من غير ما الـ cells تزيد، وده الفرق المهم عن الـ MPGN: الـ membranous **مفيهوش proliferation**. فلو شفت جدران تخينة و mesangium هادي، فكّر membranous واطلب silver و IF. ولو شفت جدران تخينة و cells كتير، فكّر MPGN أو lupus.
      - kind: figure
        page: 232
        title: "الـ IH: الـ IgG والـ PLA2R على الغشا"
        image: { file: neph/L08-mn-ih.webp, book: true }
        caption: "صور الـ immunohistochemistry: الـ deposit بني ماشي على ==الـ GBM كله== (diffuse GBM deposits)، مش في الـ mesangium."
        alt: "Two book immunohistochemistry images from case 3: a glomerulus with brown staining along all the capillary basement membranes, at low and high power."
      - kind: explain
        page: 233
        title: "الـ IH والـ EM: الـ deposits بتخف"
        quote: "The glomerular basement membrane showed irregular thickness with scattered partially resolving subepithelial and intramembranous electron dense deposits."
        text: |
          الـ **IH**: IgA سلبي، **IgG diffuse GBM deposits (+3)**، ==aPLA2R diffuse GBM deposits==، و **IgM** في الـ sclerotic areas بس.

          الـ **EM**: semi-thin sections فيها 2 glomeruli (واحد globally sclerosed). الـ capillary loops فيها segmental collapse، والـ GBM ==irregular thickness== مع **partially resolving subepithelial and intramembranous electron dense deposits**، والـ podocytes فيها **segmental** effacement.

          ليه الكلمات دي مهمة؟ التفسير المقبول (مش في الكتاب):
          - **PLA2R في الـ tissue** = الـ antigen موجود في الـ deposits، فالمرض **primary** PLA2R-mediated حتى لو الدم سلبي.
          - الـ **IgM في الـ sclerosis** ده **trapping**: الـ IgM جزيء كبير بيتحجز في أي ندبة، ومش معناه مرض تاني.
          - الـ **partially resolving** و **intramembranous**: الـ deposits القديمة الغشا بيبلعها جوّاه وتبدأ تختفي، يعني المرض بقاله فترة وبيهدى، وده بيتماشى مع الـ antibody اللي اختفى من الدم.
      - kind: figure
        page: 233
        title: "الـ EM بتاع case 3"
        image: { file: neph/L08-mn-em.webp, book: true }
        caption: "الـ GBM تخين وغير منتظم، وجوّاه وتحت الـ podocyte deposits بعضها بقى فاتح (==partially resolving==)."
        alt: "Two book electron micrographs from case 3 showing an irregularly thickened glomerular basement membrane with subepithelial and intramembranous deposits, some of them pale and partly resorbed."
      - kind: explain
        page: 234
        title: "Case 3: membranous"
        quote: "‑ Primary Membranous Glomerulonephritis; Antiphospholipase Type 2 Receptor (aPLA2R) Associated. ‑ Additional Features: Focal Segmental Glomerulosclerosis with Focal Global Glomerulosclerosis (25%), Moderate Interstitial Fibrosis and Tubular Atrophy (30%), and Mild Arteriolar Hyalinosis."
        text: |
          بنت **22 سنة** بـ nephrotic syndrome، albumin 2.1، **serum anti-PLA2R سلبي**، و Doppler بيسأل عن **renal vein thrombosis (RVT)**.

          الـ biopsy: **glomerular basement membrane (GBM) thickening**، و ==IgG 3+== على الـ GBM، و **phospholipase A2 receptor (PLA2R)** في الـ tissue موجب، و subepithelial deposits على الـ electron microscopy (EM).

          التشخيص: ==primary membranous glomerulonephritis (GN), anti-PLA2R associated==، ومعاه focal segmental glomerulosclerosis (FSGS) with focal global glomerulosclerosis (25%)، و moderate interstitial fibrosis and tubular atrophy (IFTA) (30%)، و mild arteriolar hyalinosis.

          ليه الـ serum سلبي والـ tissue موجب؟ التفسير المقبول (مش في الكتاب): الـ antibody لما يتكوّن بيروح على طول يمسك في الـ PLA2R على الـ podocyte، فممكن **يتشرب** كله في الكلية ويفضل الدم نضيف. الـ tissue stain بيشوف الـ antigen المتجمع في الـ deposits نفسها، عشان كده أدق.
          وليه الـ FSGS و الـ IFTA 30% مهمين؟ لأنهم **ندبة** فوق الـ membranous، يعني جزء من الـ proteinuria مش هيروح حتى لو الـ antibody اختفى، والـ prognosis أوحش شوية. وسؤال الـ RVT: الـ membranous هو أكتر GN بيعمل renal vein thrombosis، فالـ Doppler مش رفاهية.
