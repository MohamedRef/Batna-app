  - id: git.L01.lesson4
    title: "الـ H. pylori: الضيف التقيل"
    hook: "باكتيريا عايشة في الحمض، بتعمل ulcer و lymphoma و cancer. نعرف أسلحتها، نكشف عليها، ونطردها بأنهي regimen؟"
    minutes: 10
    pages: [21, 31]
    topics: [hp-biology, hp-tests, malt, hp-treatment]
    goals:
      - "تعرف أسلحة H. pylori: urease، adhesins، CagA، VacA"
      - "تختار الـ test المناسب للتشخيص وللـ test of cure"
      - "تكتب 3 regimens لمريض treatment-naive"
    status: unverified
    steps:
      - kind: explain
        page: 21
        quote: "Urease to create an alkaline environment, which is essential for its survival in the stomach under the mucosal barrier."
        title: "إزاي بتعيش في الحمض؟"
        text: |
          الـ outcome بيتحدد من **bacterial factors** و **host factors** مع بعض.

          أسلحة البكتيريا:
          - ==Urease==: بتعمل **alkaline environment** حواليها، وده سر إنها تعيش تحت الـ mucosal barrier.
          - **Adhesins**: **BabA** و **OipA** بيلزقوها في الـ epithelium.
          - **Pathogenicity island**: بيشفّر **CagA** و **PicB**، ودول مرتبطين بالـ inflammation والـ epithelial injury.
      - kind: explain
        page: 22
        quote: "vacA s1 and m1 strains are associated with high levels of inflammation in the gastric mucosa and increased risk for gastric atrophy and carcinoma"
        title: "CagA و VacA: مين الأخطر؟"
        text: |
          - **CagA-positive** strains مرتبطة مباشرة بـ **acute gastritis** و **gastric ulcer** و **gastric cancer**.
          - **vacA**: كل الـ strains تقريبًا فيها الجين، بس **نصهم** مش بيطلّعوا البروتين. الـ genotype بيتحدد من 3 مناطق: **signal (s)**، **mid (m)**، **intermediate (i)**.
          - ==s1/m1== هو الأشرس: inflammation أعلى و risk أعلى للـ **atrophy** والـ **carcinoma** من s2 و m2.

          ومن ناحية الـ host: **IL-1β** (مع الـ hypochlorhydria)، **TNF** و **lymphotoxin-α**، و **TLR1** locus.
      - kind: aside
        tone: joke
        text: |
          الـ H. pylori ده زي الضيف اللي جه يقعد يومين: جاب **urease** يظبط الجو، **adhesins** يلزق في الكنبة، و **CagA** يكسّر الصيني. 😄

          والـ **s1/m1** ده الضيف اللي جاب عياله معاه.
      - kind: table
        page: 23
        quote: "Inexpensive, convenient; not useful for early follow-up"
        title: "تكشف على H. pylori بإيه؟"
        columns: ["Test", "Type", "Remember"]
        rows:
          - ["Rapid urease", "Invasive", "False negative with recent PPI, antibiotics, bismuth"]
          - ["Histology", "Invasive", "Gives histologic information"]
          - ["Culture", "Invasive", "Only one with antibiotic susceptibility"]
          - ["Serology", "Noninvasive", "Not useful for early follow-up"]
          - ["Urea breath test", "Noninvasive", "Useful for early follow-up; 14C = low-dose radiation"]
          - ["Stool antigen", "Noninvasive", "Inexpensive, convenient"]
        hide: [[0, 2], [2, 2], [3, 2], [4, 2]]
      - kind: check
        page: 23
        quote: "Inexpensive, convenient; not useful for early follow-up"
        question: "Which test should NOT be used to check cure 4 weeks after eradication therapy?"
        options:
          - "Serology"
          - "Urea breath test"
          - "Stool antigen"
          - "Biopsy-based test"
        answer: 0
        why:
          - "صح: الـ serology **not useful for early follow-up**."
          - "الـ UBT **useful for early follow-up**، وهو من الـ tests of cure."
          - "الـ fecal antigen من الـ tests of cure المذكورة."
          - "الـ biopsy-based test من الـ tests of cure المذكورة."
      - kind: explain
        page: 25
        quote: "It may be combined with an endoscopic ultrasound examination, which is a routine procedure in lymphoma staging."
        title: "الـ outcomes، والـ MALT lymphoma"
        text: |
          الـ H. pylori ممكن يعمل: **gastritis**، **peptic ulcer**، **MALT lymphoma**، و **gastric adenocarcinoma**.

          الـ ==MALT lymphoma== = **marginal zone B-cell lymphoma**. في الـ white light ممكن يبان بالعافية، وفي الـ **BLI with magnification** بيبان بـ vessels شكلها **«tree-like»** و linear erosions.

          تحدياته: محتاج تبص على **المعدة كلها**، **biopsies كتير** (وأحيانًا كبيرة)، **control endoscopy** بعد العلاج، gastric mapping، و **EUS** اللي هو routine في الـ staging.
      - kind: explain
        page: 31
        quote: "Strong (moderate quality of evidence)"
        title: "المنيو: 4 regimens لمريض treatment-naive"
        text: |
          الجدول في الكتاب فيه 4، والسؤال بيقول «اكتب 3»:

          - ==Optimized bismuth quadruple==: **PPI** b.i.d. + **bismuth** q.i.d. + **tetracycline 500 mg** q.i.d. + **metronidazole 500 mg** t.i.d. or q.i.d. الوحيد اللي توصيته **strong**، وهو **مش FDA approved**.
          - **Rifabutin triple (Talicia)**: omeprazole 10 + amoxicillin 250 + rifabutin 12.5 mg في الكبسولة، **4 capsules t.i.d.**
          - **PCAB dual**: **vonoprazan 20 mg** b.i.d. + amoxicillin 1 g t.i.d.
          - **PCAB triple**: vonoprazan + clarithromycin 500 + amoxicillin 1 g، الكل b.i.d.
      - kind: mnemonic
        page: 31
        quote: "Opnmuzed Bismuth subcitrate (120"
        word: "BMTP"
        parts:
          - { key: "B", text: "Bismuth (subcitrate 120-300 mg or subsalicylate 300 mg) q.i.d." }
          - { key: "M", text: "Metronidazole 500 mg t.i.d. or q.i.d." }
          - { key: "T", text: "Tetracycline 500 mg q.i.d." }
          - { key: "P", text: "PPI standard dose b.i.d." }
        hook: "**«بي إم تي بي»**: الـ bismuth quadruple زي **ميكروباص BMTP**، أربع ركاب، والـ PPI بس اللي بيركب مرتين في اليوم."
      - kind: aside
        tone: trap
        page: 31
        quote: "Clarithromycin- and levofloxacin-containing treatment regimens should be avoided in the absence of demonstrated macrolide and quinolone susceptibility"
        text: |
          فخ مشهور: **clarithromycin** و **levofloxacin** متديهمش إلا لو الـ susceptibility **متثبتة**.

          وكل مريض اتعالج لازم **test of cure** (UBT أو fecal antigen أو biopsy) **at least 4 weeks** بعد العلاج.
      - kind: match
        page: 31
        quote: "who have received bismuth quadruple therapy, rifabutin triple therapy is suggested"
        prompt: "الـ H. pylori لسه موجود. وصّل كل مريض بالـ regimen اللي بعده:"
        pairs:
          - ["Never had bismuth quadruple", "Optimized bismuth quadruple"]
          - ["Already had bismuth quadruple", "Rifabutin triple"]
          - ["Proven clarithromycin-sensitive", "PPI- or PCAB-clarithromycin triple"]
          - ["Levofloxacin-sensitive, others used or unavailable", "Levofloxacin triple"]
        why: "الكتاب (ص 31): اللي ماخدش bismuth quadruple ياخده؛ اللي خده ياخد rifabutin triple؛ والـ clarithromycin والـ levofloxacin بس مع susceptibility متثبتة. والـ probiotics مفيش evidence إنها بتفرق."
      - kind: try
        items: [git.L01.086, git.L01.120, git.L01.125, git.L01.126]
    recap:
      - "Urease يعيّشها، BabA/OipA يلزّقوها، CagA و vacA s1/m1 الأخطر."
      - "Culture الوحيد بالـ susceptibility. Serology مش للـ follow-up. PPI والمضاد الحيوي بيعملوا false negative."
      - "Outcomes: gastritis، ulcer، MALT lymphoma (marginal zone B-cell، EUS للـ staging)، adenocarcinoma."
      - "Treatment-naive: bismuth quadruple (strong)، rifabutin triple، PCAB dual أو triple."
      - "Test of cure بعد 4 أسابيع على الأقل؛ لا clarithromycin ولا levofloxacin من غير susceptibility."
