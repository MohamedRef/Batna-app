        text: |
          التشخيص محتاج ==high index of suspicion==: الأعراض، السفر، الأكل، والتحاليل.

          - **LDH** و **indirect bilirubin** عاليين، **haptoglobin** واطي، **plasma hemoglobin** عالي، و **schistocytes**: كلهم بيقولوا إن الكرات الحمرا بتتكسر جوه الأوعية.
          - **Coombs negative**: لأن التكسير **ميكانيكي** مش antibodies، إلا في الـ **S. pneumoniae**.
          - لحد **20%** عندهم **amylase** و **lipase** عاليين ==due to pancreatic damage==، وممكن **hyperglycemia**. التفسير المقبول (مش في الكتاب): نفس الجلطات الصغيرة بتوصل البنكرياس، ولو الـ islets اتأثرت السكر يعلى.
      - kind: explain
