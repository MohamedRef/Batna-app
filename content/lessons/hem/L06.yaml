  - id: hem.L06.lesson2
    title: "الكيس المناسب للعيان المناسب: الكرات الحمرا وتعديلاتها"
    hook: "مش كل نزيف عايز whole blood، ومش كل كيس عايز نفس المعاملة: filter، غسيل، ولا إشعاع؟"
    minutes: 9
    pages: [88, 90]
    topics: [components]
    goals:
      - "تفرّق الـ components عن الـ derivatives والـ cellular عن الـ non-cellular"
      - "تعرف إمتى whole blood وإمتى packed RBCs"
      - "تفرّق leukoreduced و washed و irradiated وتعرف ليه كل واحد"
    status: unverified
    steps:
      - kind: figure
        page: 88
        title: "صورة الكتاب: من الكيس الكامل لكل حاجة"
        image: { file: hem/L06-components-derivatives.webp, book: true }
        alt: "Book chart: whole blood splits into blood components (packed red cells, granulocyte concentrate, cryoprecipitate, platelet concentrate, fresh frozen plasma) and blood derivatives (factor VIII and IX concentrates, albumin, immunoglobulins, prothrombin complex concentrate)."
        caption: "الـ **components** بتتفصل من الكيس في بنك الدم، والـ ==derivatives== بتتعمل في مصنع من plasma متبرعين كتير. الدرس ده للكرات الحمرا، والدرس الجاي للباقي."
      - kind: explain
        page: 88
        title: "Cellular و non-cellular"
        quote: "Blood components\n  Cellular:\n    Packed red blood cells (PRBCS)\n    Platelets, random (from whole blood)\n    Platelets, apheresis\n  Possible modifications (specifications):\n    CMV-negative\n    Leukoreduced\n    Irradiated\n    Washed (only PRBCs)\n  Non-cellular:\n    Plasma (FFP, FP24, thawed plasma, etc)\n    Cryoprecipitate\n    Above specifications do not apply"
        text: |
          الـ components نوعين:

          - **Cellular**: packed RBCs، و platelets (random من الـ whole blood أو apheresis).
          - **Non-cellular**: plasma (FFP وغيره) و cryoprecipitate.

          والتعديلات (==CMV-negative==، leukoreduced، irradiated، washed) للـ **cellular بس**، و washed للـ PRBCs بس. ليه؟ التفسير المقبول (مش في الكتاب): كل التعديلات دي بتستهدف **خلايا**: الـ WBCs اللي فيها الـ CMV، والـ lymphocytes اللي بتعمل GVHD، أو الـ plasma اللي حوالين الكرات. الـ plasma والـ cryo مفيهمش خلايا تتعدّل.
      - kind: explain
        page: 88
        title: "Whole blood و packed RBCs"
        quote: "1. Whole blood\n  Indications:\n    Acute hypovolemia with RBC loss.\n  It is not a source of functional PLT or granulocytes, which deteriorate in < 24 hours at refrigerator temp."
        text: |
          - **Whole blood**: لـ ==acute hypovolemia with red blood cell (RBC) loss==. مش مصدر platelets ولا granulocytes شغّالة، لأنهم بيبوظوا في **أقل من 24 ساعة** في التلاجة.
          - **Packed red blood cells (RBCs)**: لـ **symptomatic anemia**. الوحدة بتعلّي الـ Hb حوالي **1 g/dl** في البالغ متوسط الحجم.

          ليه الـ whole blood للنزيف الحاد بس؟ لأن العيان ده خسر **حجم وكرات** مع بعض. أما عيان الأنيميا المزمنة فحجمه طبيعي، والتفسير المقبول (مش في الكتاب): لو اديته whole blood هتحمّل القلب plasma مالوش لازمة، فبندّيله الكرات بس (packed).
      - kind: check
        page: 89
        quote: "1 Unit of packed RBC increases Hb by 1 g/dl in an average-sized adult.\nIndications: treatment of symptomatic anemia."
        question: "An average-sized adult with symptomatic anaemia has Hb 6 g/dl. About what Hb do you expect after 2 units of packed RBCs?"
        options: ["About 8 g/dl", "About 7 g/dl", "About 10 g/dl", "About 12 g/dl"]
        answer: 0
        why:
          - "صح: كل وحدة ≈ 1 g/dl، فوحدتين ≈ +2."
          - "ده وحدة واحدة بس."
          - "ده محتاج حوالي 4 وحدات."
          - "ده محتاج حوالي 6 وحدات."
      - kind: table
        page: 89
        quote: "Leukoreduction (LR)\n  Filtration with specialized filters that bind 99.9% of WBC from donor unit\n  LR essentially eliminates risk of:\n    Febrile non-hemolytic transfusion reaction\n    CMV, HLTV I-II\n    Herpesviruses, EBV\n    Trypanosoma cruzi\n  Decreases risk of TRALI\n  Universal LR is common practice"
        title: "التعديلات على الكيس"
        columns: [Modification, Prevents or treats]
        rows:
          - ["Leukoreduced (filter binds 99.9% WBCs)", "FNHTR, CMV, HTLV, EBV, TRALI"]
          - ["Washed PRBC (no plasma, K, additive)", "IgA deficiency, hyperkalemia, allergy"]
          - ["Irradiated (donor lymphocytes stopped)", "TA-GVHD"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 89
        title: "ليه كل تعديل بيمنع اللي بيمنعه؟"
        quote: "Washed PRBCs\n  Purpose\n    To remove supernatant (plasma proteins, K, additive solution, etc)\n  Indications\n    Severe IgA deficiency to prevent anaphylaxis\n    Significant hyperkalemia\n    Ongoing hemolysis from anti-A or anti-B\n    History of repetitive allergic reactions\n  Risk\n    Contamination in the process of opening bag and adding saline multiple times - 24 hours of shelf-life"
        text: |
          **Leukoreduction**: filter بيمسك **99.9%** من الـ WBCs. والتفسير المقبول (مش في الكتاب) لقايمته: الـ ==FNHTR== بييجي من cytokines بتفرزها الـ WBCs في الكيس، والـ **CMV** والـ **HTLV** والـ **EBV** فيروسات عايشة **جوه الـ WBCs**. شيل الخلايا تشيل المصدر.

          **Washed PRBCs**: بنشيل الـ **supernatant** (plasma proteins، K، additive solution):
          - **Severe IgA deficiency**: عشان الـ IgA اللي في plasma المتبرع ما يعملش anaphylaxis.
          - **Hyperkalemia**: الـ K اللي خرج من الكرات في التخزين بيتشال.
          - **Ongoing hemolysis from anti-A/anti-B** و **repetitive allergic reactions**: الـ antibodies والبروتينات اللي في الـ plasma بتتشال.

          التمن: الكيس اتفتح وادّاله saline كذا مرة، فخطر ==contamination== ويعيش **24 ساعة** بس.
      - kind: explain
        remind: [hem.L06.032]
        page: 90
        title: "Irradiation: مين محتاجه؟"
        quote: "Irradiation\n  Purpose\n    To prevent lymphocyte proliferation in recipient and transfusion-associated graft-versus-host disease (TA-GVHD)\n  Indications\n    Stem cell transplant patients: Must give at least 30 days before, and indefinitely after\n    Recipients of blood products from 1st degree relatives\n    Intrauterine transfusions & babies up to 4 months\n    Congenital Immunodeficiency Syndromes\n    Recipients of Fludarabine/Nelarabine/Clofarabine\n    Some hospitals irradiate for all cancer patients – not an absolute indication"
        text: |
          الهدف: نمنع ==TA-GVHD== (lymphocytes المتبرع تتكاثر في العيان وتهاجمه).
          - **Stem cell transplant**: من **30 يوم قبل** ولحد **ما لا نهاية** بعد
          - دم من **first-degree relatives**
          - **Intrauterine transfusions** والأطفال لحد **4 months**
          - **Congenital immunodeficiency**
          - اللي بياخدوا **fludarabine / nelarabine / clofarabine**
          - بعض المستشفيات لكل مرضى السرطان، بس مش absolute

          الخيط اللي بيجمعهم: عيان **مش قادر يقتل** lymphocytes المتبرع، يا إما لأن مناعته ضعيفة (transplant، immunodeficiency، جنين وطفل صغير، والـ fludarabine اللي بيضرب الـ lymphocytes)، يا إما لأنه **شايفها شبهه** (القرايب، في الـ reveal الجاي).
      - kind: reveal
