  - id: rheum.L12.lesson2
    title: "Oligo و Poly: ركبة بنت صغيرة ولا إيد بنت كبيرة؟"
    hook: "الـ oligo ركبة وارمة مش بتوجع وعين ساكتة. الـ poly إيد بتتشوه بسرعة. الفرق بينهم بيقرر العلاج والمتابعة."
    minutes: 10
    pages: [199, 201]
    topics: [oligo, poly]
    goals:
      - "تعرف صورة الـ oligo وخطر العين وليه بنفحصها وهي ساكتة"
      - "تعرف إمتى الـ oligo يبقى extended ومضاعفاته"
      - "تعرف صورة الـ polyarticular وتشوهاته"
    status: unverified
    steps:
      - kind: explain
        page: 199
        quote: "Oligoarticular\n  More in girls than boys 4:1.\n  1-3 years old age.\n  Onset before 16 years old.\n  Active synovitis 3 months in the (EULAR) criteria, and 6 weeks (ACR) criteria.\n  4-5 joints involving after 6 months of disease onset (extended Oligoarticular)\n  Young girls with early involvement of small joints are at risk for progression to polyarticular involvement and have a poor prognosis.\n  Large joints affection, excluding hips and shoulders.\n  Chronic anterior uveitis Presence of ANA with a greater risk of complicating eye disease (iridocyclitis)."
        title: "الـ Oligoarticular"
        text: |
          - **بنات أكتر من ولاد 4:1**، سن **1–3 سنين**.
          - **Large joints** ما عدا ==hips and shoulders==.
          - الـ active synovitis: **3 شهور** في European League Against Rheumatism (EULAR)، و **6 أسابيع** في American College of Rheumatology (ACR).
          - لو وصل **4–5 مفاصل بعد أول 6 شهور** = **extended oligoarticular**.
          - البنات الصغيرين اللي فيهم small joints بدري: خطر يقلبوا poly، و prognosis وحش.

          ليه الـ ANA مهم هنا؟ لأن الكتاب بيربطه بـ greater risk of complicating eye disease، فهو اللي بيحدد مين عينه في خطر أكتر (مواعيد الفحص في ص 204).
      - kind: figure
