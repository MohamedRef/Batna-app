    topics: [pmf-tests, pmf-prognosis]
    goals:
      - "تعرف الـ blood film والـ trephine في الـ PMF وليه الـ aspirate بيفشل"
      - "تحسب الـ IPSS وتعرف كل نقطة معناها إيه"
      - "تعرف الطفرات اللي بتغيّر الـ prognosis"
    status: unverified
    steps:
      - kind: explain
        remind: [hem.L09.121, hem.L09.122]
        page: 149
        title: "الـ film"
        quote: "1. The presence of myeloid and erythroid precursors in the peripheral blood (leukoerythroblastic blood picture) is common in PMF.\nOther causes of a leukoerythroblastic blood film include BM infiltration, severe sepsis, severe hemolysis.\n2. Teardrop poikilocytes (dacryocytes)\n3. Macrocytosis (which may or may not be secondary to folate deficiency),\n4. Giant platelets and megakaryocyte fragments may also be present."
        text: |
          في الـ primary myelofibrosis (PMF) الـ film فيه:
          1. ==Leukoerythroblastic picture== (myeloid و erythroid precursors في الدم)
          2. **Teardrop poikilocytes (dacryocytes)**
          3. **Macrocytosis** (يمكن من folate deficiency ويمكن لأ)
          4. **Giant platelets** و megakaryocyte fragments

          وخد بالك: الـ leukoerythroblastic film كمان في **bone marrow (BM) infiltration** و **severe sepsis** و **severe hemolysis**.

          ليه خلايا صغيرة بتطلع الدم؟ التفسير المقبول (مش في الكتاب): النخاع السليم بيحجز الخلايا لحد ما تنضج. لما يتليّف أو يتملي ورم، الحاجز ده بيبوظ، والمصانع البديلة (الطحال والكبد) مالهاش نفس الحاجز، فالـ precursors بتعدّي. وده نفس المنطق في الـ infiltration.
      - kind: aside
        tone: analogy
        page: 149
        quote: "2. Teardrop poikilocytes (dacryocytes)"
        text: "الـ **teardrop cell** زي معجون أسنان اتعصر من فتحة ضيقة: كرة الدم الحمرا بتتزنق وهي طالعة من نخاع مليان ألياف أو من طحال كبير، فتطلع بذيل. التفسير المقبول (مش في الكتاب)؛ الكتاب بيذكر الـ dacryocytes بس."
      - kind: figure
        page: 150
        quote: "Peripheral blood film in PMF shows a blast, an abnormal myelocyte, tear drop red cells and marked anisopoikilocytosis."
        title: "صورة الكتاب: الـ film في الـ PMF"
        image: { file: hem/L09-pmf-film.webp, book: true }
        alt: "Book photomicrograph of a blood film: many red cells of very different sizes and shapes, several drawn out into teardrop forms, one nucleated cell with a dark round nucleus at the lower left and one larger white cell with a purple nucleus at the upper right."
        caption: |
          الصورة آخر ص 149، والكتاب بيوصفها في أول ص 150:

          - **الخلفية كلها**: red cells أحجامها وأشكالها مختلفة جدًا = ==marked anisopoikilocytosis==، وكتير منها ليها **ذيل** = **tear drop cells** (dacryocytes).
          - **تحت على الشمال**: خلية نواتها **غامقة مدورة** وصغيرة.
          - **فوق على اليمين**: خلية أكبر نواتها بنفسجي.

          الكتاب بيقول الصورة فيها **blast** و **abnormal myelocyte**؛ يعني خلايا صغيرة طالعة في الدم: ده الـ ==leukoerythroblastic picture== مع الـ teardrops، علامة النخاع المتليّف.
      - kind: explain
        page: 150
        title: "النخاع: الإبرة بتطلع ناشفة"
        quote: "Bone marrow trephine biopsy is essential to make a diagnosis of PMF."
        text: |
          - ==Bone marrow trephine biopsy== أساسي للتشخيص.
          - الـ **aspiration** غالبًا **dry tap** أو hemodiluted.
          - الـ **karyotype** (من النخاع أو الدم) بيستبعد **chronic myeloid leukaemia (CML)**. وفيه abnormalities تانية في لحد **60%**؛ الـ **5 و 7** بعد genotoxic agents و **poor prognosis**.
          - في الأول: النخاع **hypercellular** و megakaryocytes كبيرة في **clusters**. بعدين الـ fibrosis تكسب.
          - **Silver impregnation** = reticulin، و **trichrome** = collagen.
          - في الحالات الـ advanced بيحصل **osteosclerosis**، يعني trabeculae تخينة، ويبان في X-ray و magnetic resonance imaging (MRI).
      - kind: reveal
        page: 150
        quote: "Attempts at BM aspiration often yields a dry-tap or a hemodiluted sample, making aspirate morphology of limited diagnostic value."
        prompt: "ليه الـ aspiration في الـ PMF بيطلع dry tap، وليه الـ trephine بيشتغل؟"
        answer: |
          الكتاب: الـ aspiration ==often yields a dry-tap or a hemodiluted sample==، فالـ morphology محدودة، والـ **trephine biopsy essential**.

          التفسير المقبول (مش في الكتاب): الـ aspirate بيـ**شفط** خلايا سايبة. في نخاع ليفي الخلايا محبوسة في شبكة ألياف، فالشفطة يا مفيهاش حاجة (dry) يا فيها دم من الأوعية بس (hemodiluted). الـ **trephine** بيقطع **حتة صلبة** فيها الألياف والخلايا في مكانهم، فتشوف التليف نفسه.
      - kind: check
        page: 150
        quote: "Bone marrow fibrosis becomes increasingly dominant and progressively replaces hemopoiesis. The degree of fibrosis is best demonstrated using silver impregnation, which stains reticulin fibers. Collagen fibers are best demonstrated using a trichrome stain."
        question: "Best stain for collagen fibres in a PMF trephine?"
        options: ["Trichrome", "Silver impregnation", "Perls", "Congo red"]
        answer: 0
        why:
