      - kind: explain
        page: 54
        quote: "Figure 27: Actions to manage hyperkalemia (potassium >5.5 mmol/l) in chronic kidney disease"
        title: "ليه السلّم ده في الـ hyperkalemia؟"
        text: |
          Figure 27 (K > 5.5) بتمشي على 3 درجات: **correctable factors**، بعدين **dietary restriction**، بعدين **medications**. التفسير المقبول (مش في الكتاب) لكل خطوة:

          - **Bicarbonate**: الحموضة بتطلّع الـ K من الخلايا، فلما تصلّحها الـ K يرجع جوه.
          - **Glycemic control**: الـ insulin بيدخّل الـ K الخلايا، والسكر العالي بيسحب مية و K برّه.
          - **Loop diuretics** و **SGLT2i**: Na ومية أكتر بيوصلوا للـ distal tubule، فالـ K بيتفرز أكتر.
          - **Diet**: آخر حاجة تتلم بعد ما الأسباب الأسهل تتصلح.
          - **Binders**: علشان تقدر **تكمّل** الـ ==RAASi== أو الـ MRA اللي بيحموا الكلية.

          والكتاب بيقول لو وقّفت الـ RAASi، اكتب ترجّعه **إمتى**. يعني الهدف إن الـ K يبقى آمن **من غير** ما المريض يخسر الحماية.
