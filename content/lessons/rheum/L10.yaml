  - id: rheum.L10.lesson2
    title: "الـ B cells والـ biosimilars"
    hook: "الـ B cell مش بس مصنع antibodies. وفيه دوا شبه دوا تاني بالظبط، وفيه دوا «شبهه» وبس."
    minutes: 9
    pages: [176, 177]
    topics: [bcells, biosimilars]
    goals:
      - "تعرف الطريقتين: deplete (rituximab) و inhibit (belimumab)"
      - "تفهم ليه شيل الـ B cells بيفيد حتى في الأمراض اللي مش antibodies"
      - "تفرّق الـ biosimilar عن الـ biomimic"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L10.025]
        page: 176
        title: "الـ B cells"
        quote: "Biologic agents that can deplete B cells (eg, rituximab) or inhibit factors that activate B cells (belimumab) are used for the treatment of a range of rheumatic and other diseases."
        text: |
          الـ B cell مش مصنع antibodies بس: ==بيقدّم antigen== للـ T cells، بينشّطها، وبيطلع IL-1، 6، TNF-α، vascular endothelial growth factor (VEGF) وغيرهم.

          - **Rituximab** ← ==deplete== B cells: Non-Hodgkin lymphoma (NHL)، chronic lymphocytic leukaemia (CLL)، **RA**، **granulomatosis with polyangiitis (GPA)**، **microscopic polyangiitis (MPA)**؛ واستُخدم في systemic lupus erythematosus (SLE) و systemic sclerosis (SSc) و vasculitis تانية.
          - **Belimumab** ← يمسك **soluble B-lymphocyte stimulator (BLyS)** فما يوصلش يحفّز الـ B cell: **SLE**، IV كل 4 أسابيع.
      - kind: reveal
        page: 177
        prompt: "الـ RA مرض مفاصل مش antibodies بس. ليه الـ rituximab (اللي بيشيل الـ B cells) بيشتغل فيه؟"
        quote: "In addition to treatment of non-Hodgkin lymphoma and chronic lymphocytic"
        answer: |
          الكتاب: الـ B cells غير الـ antibodies ==بتقدّم antigen للـ T cells وبتنشّطها== وبتعمل **proinflammatory cytokines**: IL-1، 4، 6، 8، 10، 12، **TNF-alpha**، **VEGF**، **MCP** و **MIF**. والـ **rituximab** بيتدّي في الـ **non-Hodgkin lymphoma** والـ **CLL**، وفي الـ **RA** والـ **GPA** والـ **MPA**، واتجرّب في الـ SLE والـ systemic sclerosis وأنواع vasculitis تانية.

          التفسير المقبول (مش في الكتاب): لما تشيل الـ B cells، إنت مش بس بتوقف الـ RF والـ ACPA؛ إنت بتشيل **خلية بتغذّي الـ T cells** وبتطلع TNF و IL-6 في المفصل. عشان كده بيشتغل في الـ RA.

          وليه نفس الدوا بتاع الـ **lymphoma**؟ لأنه بيستهدف علامة على سطح **كل** الـ B cells (CD20)، سواء كانت خلية سرطانية أو خلية autoimmune. والـ GPA والـ MPA في الكتاب (ص 150) الـ rituximab بقى فيهم standard of care.
      - kind: check
        page: 177
        quote: "Belimumab is an anti-B lymphocyte stimulator (BLyS) mAb which binds to soluble BLyS, preventing its binding and stimulation of B cells."
        question: "Belimumab works by:"
        options:
