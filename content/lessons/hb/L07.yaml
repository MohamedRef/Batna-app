        page: 119
        title: "Who to treat (algorithm الكتاب)"
        alt: "Algorithm. Chronic HBV splits by HBV DNA. DNA below 2,000 IU/mL: no treatment. DNA above 2,000 IU/mL splits by ALT. ALT abnormal (upper limit of normal 40 IU/L): treat. ALT normal: no treatment for now; if over 30 years old, liver biopsy or FibroScan. FibroScan above 9 kPa means severe fibrosis. Without biopsy or FibroScan: observe."
        caption: "الأرقام: **DNA 2,000 IU/mL**، **ALT ULN 40 IU/L**، **age > 30**، **FibroScan > 9 kPa** = severe fibrosis. الكتاب مش كاتب treat في الخانة دي؛ العلاج هنا جاي من المعيار التالت (**severity of liver disease**، صفحة 118)."
        svg: |
