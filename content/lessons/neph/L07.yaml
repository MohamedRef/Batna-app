          نفس الـ glomerulus تقريبًا بس بصبغة **oil red O** اللي بتلوّن الدهون: الفقاعات اللي كانت فاضية بقت ==برتقاني محمّر==.

          يعني اللي جوّه الـ vacuoles ==دهون== (الـ Gb3)، وده اللي بيأكّد إنه مرض تخزين.
      - kind: figure
        page: 189
        quote: "(EM) On EM, there are abundant inclusions within lysosomes, particularly within visceral epithelial cells (Fig. 46.12). The inclusions (myelin figures) are typically round, comprising concentric layers of dense material separated by clear spaces. The layers may be arranged in parallel (zebra bodies). Detachment of visceral epithelial cells from the underlying basement membrane may be observed. Inclusions are also observed in"
        title: "الـ zebra bodies تحت الـ EM"
        image: { file: neph/L07-fabry-zebra-em.webp, book: true }
        alt: "Book electron micrograph of a glomerulus in Fabry disease: many round dark inclusions made of concentric layers fill the podocytes; an inset at the lower left magnifies one inclusion showing parallel lamellae."
        caption: |
          - **الصورة الكبيرة**: الـ podocytes مليانة ==دواير غامقة كتير== جوّاها حلقات، زي البصلة المقطوعة.
          - **المربع تحت شمال** (تكبير أعلى): واحدة منهم: طبقات غامقة ورا بعض بينهم مسافات فاتحة.

          دي الـ **myelin figures**، ولما الطبقات تبقى متوازية اسمها ==zebra bodies==: الـ Gb3 متكوّم طبقات جوّه الـ lysosome.
      - kind: reveal
        page: 188
        quote: "Urinary oval fat bodies, with a Maltese cross configuration when viewed with a polarizing microscope, are a result of the large amounts of glycosphingolipid in the urine"
        prompt: "ليه الـ Fabry بيعمل proteinuria، وليه بنشوف Maltese cross في البول؟"
        answer: |
          **الـ Maltese cross**: الكتاب بيقول الـ oval fat bodies دي من ==كميات كبيرة من الـ glycosphingolipid في البول==. الدهون المتبلورة دي بتكسر الضوء المستقطب فتبان صليب.

          **الـ proteinuria**: الكتاب بيقول الـ **visceral epithelial cells** (الـ podocytes) منفوخة ومليانة vacuoles. التفسير المقبول (مش في الكتاب): الـ podocyte هو اللي ماسك الفلتر ضد البروتين. لما يتملي دهون وينفصل عن الـ GBM (الكتاب ذكر الـ detachment في الـ EM)، البروتين يعدّي، ومع الوقت segmental و global sclerosis.
