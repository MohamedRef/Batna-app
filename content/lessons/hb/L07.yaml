        title: "سؤالين يحلّوا الجدول كله"
        text: |
          الأسامي الجديدة مبنية على سؤالين:

          - **HBeAg positive ولا negative؟**
          - **Infection ولا hepatitis؟** يعني الكبد سليم (ALT normal، مفيش أو شوية disease) ولا فيه التهاب (ALT elevated، disease moderate/severe).

          فيطلعوا 4: **HBeAg+ chronic infection**، **HBeAg+ chronic hepatitis**، **HBeAg− chronic infection**، **HBeAg− chronic hepatitis**، وفي الآخر ممكن **HBsAg loss**.
      - kind: aside
        tone: analogy
        page: 117
        text: |
          - **Infection** = الفيروس ساكن في البيت والمناعة **عاملة هدنة** معاه: مفيش خناق، فالـ ALT طبيعي.
          - **Hepatitis** = **خناقة**: المناعة بتضرب الخلايا المصابة، فالـ ALT يطلع وينزل والـ DNA يتذبذب، والكبد هو اللي بيدفع التمن (fibrosis).
