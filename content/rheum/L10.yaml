schema: batna.content/v1
lecture: rheum.L10
title: "Immune Based Therapy"
author: "Prof. Dr. Mona Helmy"
book: { chapter: 3, pages: [173, 179] }
topics:
  - { id: approaches, title: "How biologics and kinase inhibitors work" }
  - { id: tcells, title: "Th1, Th2, Th17 and T reg cells" }
  - { id: molecules, title: "Types of therapeutic molecules and TNF blockers" }
  - { id: il17-il23, title: "IL-17 and IL-12/23 inhibition" }
  - { id: bcells, title: "B-cell depletion and inhibition" }
  - { id: biosimilars, title: "Biosimilars" }
  - { id: kinase, title: "JAK and Syk inhibitors, apremilast" }
items:
  # ---------- p173: approaches ----------
  - id: rheum.L10.001
    kind: enumerate
    topic: approaches
    prompt: The three things the major biologic approaches do?
    points:
      - Interfere with cytokine function or production
      - Inhibit the "second signal" required for T-cell activation
      - Deplete B cells
    pass: 3
    src: { page: 173, quote: "Interfere with cytokine function or production. Inhibit the ―second signal‖ required for T-cell activation. Deplete B cells." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L10.002
    kind: card
    topic: approaches
    front: Four kinds of agent in the major biologic approaches?
    back: Medications made by molecular biologic techniques, biologic agents, biosimilars (near-identical to the original), and small-molecule kinase inhibitors.
    src: { page: 173, quote: "biosimilar medications with near-identity to the original biologic agents, and small molecule kinase inhibitors" }
    status: unverified
  # ---------- p173-174: T cells ----------
  - id: rheum.L10.003
    kind: card
    topic: tcells
    front: How do Th1 and Th2 cytokines relate to each other?
    back: Each subset's cytokines inhibit the cellular function of the other phenotype.
    src: { page: 173, quote: "The cytokines generated by Th1 or Th2 cells respectively inhibit the cellular function of the other phenotype." }
    status: unverified
  - id: rheum.L10.004
    kind: table
    topic: tcells
    title: T helper subsets
    columns: [Subset, Cytokines, Diseases or role]
    rows:
      - [Th1, "IFN-γ, TNF, IL-2", "RA, psoriasis, PsA, acute allograft rejection, GVHD"]
      - [Th2, "IL-4, IL-5, IL-10, IL-13", "Antibody and eosinophil responses; chronic GVHD, SLE, systemic sclerosis"]
      - [Th17, IL-17, "Amplifies cytokines; stimulates keratinocytes, synoviocytes, macrophages, fibroblasts, neutrophils"]
      - [T reg, "IL-10, TGF-β", Regulate other T cells; protective]
    blanks: [[0, 1], [1, 1], [1, 2], [2, 1], [3, 1]]
    src: { page: 174, quote: "Some of the proinflammatory mediators produced by Th1 cells include interferon gamma (IFNg), tumor necrosis factor (TNF), and interleukin (IL)- 2." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L10.005
    kind: cloze
    topic: tcells
    text: "{{c1::IFN-γ and IL-2}} (Th1) inhibit Th2 proliferation; {{c2::IL-4 and IL-10}} (Th2) inhibit Th1 cytokine production."
    src: { page: 174, quote: "IFNg and IL-2 can inhibit Th2 cell proliferation." }
    status: unverified
  - id: rheum.L10.006
    kind: card
    topic: tcells
    front: Three diseases driven by Th2 activation in the book?
    back: Chronic graft-versus-host disease, SLE and systemic sclerosis.
    src: { page: 174, quote: "The activation of Th2 cells contributes to the development of chronic graft- versus-host disease, systemic lupus erythematosus, and systemic sclerosis." }
    status: unverified
  - id: rheum.L10.007
    kind: card
    topic: tcells
    front: What drives naïve T cells to become Th17 cells?
    back: Antigen plus TGF-β, IL-6 and IL-23.
    src: { page: 174, quote: "Th17 cells differentiate from naïve T cells in response to antigen, transforming growth factor (TGF) beta, IL-6, and IL-23." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L10.008
    kind: card
    topic: tcells
    front: What drives T reg differentiation, and how do they protect?
    back: Antigen and TGF-β; they protect through IL-10 and TGF-β.
    src: { page: 174, quote: "T reg cells also differentiate under the influence of antigen and TGF beta, and they have a protective function through IL-10 and TGF beta." }
    status: unverified
  - id: rheum.L10.009
    kind: card
    topic: tcells
    front: Are T reg cells used as a cell therapy yet?
    back: Not yet clinically tested; their capacity to reduce inflammation and autoimmunity is of interest.
    src: { page: 174, quote: "While not yet clinically tested as cell-based therapy, their capacity to reduce inflammation and autoimmunity are the subject of interest" }
    status: unverified
  - id: rheum.L10.010
    kind: mcq
    topic: tcells
    stem: Which cytokine combination drives the subset whose signature cytokine is the target of secukinumab?
    options:
      - TGF-β, IL-6 and IL-23
      - IL-4 and IL-10
      - IFN-γ and IL-2
      - TGF-β and IL-10 only
    answer: 0
    why:
      - "Correct: secukinumab targets IL-17 from Th17 cells, which differentiate under TGF-β, IL-6 and IL-23 (p174)."
      - IL-4 and IL-10 are Th2 cytokines that inhibit Th1.
      - IFN-γ and IL-2 are Th1 cytokines.
      - TGF-β with IL-10 is the T reg protective pair.
    src: { page: 174, quote: "Th17 cells differentiate from naïve T cells in response to antigen, transforming growth factor (TGF) beta, IL-6, and IL-23." }
    status: unverified
  # ---------- p175: molecules ----------
  - id: rheum.L10.011
    kind: table
    topic: molecules
    title: Types of therapeutic molecules
    columns: [Type, Examples]
    rows:
      - [Soluble receptor antagonist, Etanercept]
      - [Monoclonal antibodies to cytokines or receptors, "Infliximab, adalimumab, certolizumab, golimumab, secukinumab, ustekinumab"]
      - [Cell surface receptor antagonist proteins, "Anakinra, rilonacept, canakinumab, brodalumab (anti-IL-17 receptor), IL-6 receptor antagonist"]
      - [Oral small molecules, "Kinase (JAK) inhibitors"]
    blanks: [[0, 1], [1, 1], [3, 1]]
    src: { page: 175, quote: "Soluble receptor antagonists (Etanarcept). Monoclonal antibodies to cytokines or their receptors (Infleximab, Adalimumab, Certolizumab, Golomumab, Secukinumab, and ustekinumab)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L10.012
    kind: card
    topic: molecules
    front: Which biologic is an anti-IL-17 receptor antibody?
    back: Brodalumab.
    src: { page: 175, quote: "Brodalumab an anti IL-17 receptor antibody." }
    status: unverified
  - id: rheum.L10.013
    kind: card
    topic: molecules
    front: How do JAK inhibitors indirectly target many cytokines?
    back: They are oral small molecules that block cytoplasmic tyrosine kinases (JAK) carrying signals from membrane cytokine receptors.
    src: { page: 175, quote: "inhibit selected cytoplasmic protein tyrosine kinases, such as Janus kinase (JAK), which mediates signalling from membrane cytokine receptors." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L10.014
    kind: card
    topic: molecules
    front: TNF blocker plus methotrexate versus either alone in RA?
    back: The combination was superior to either alone, and TNF blockers were relatively safe compared with methotrexate.
    src: { page: 175, quote: "The combination of a TNF blocker and methotrexate was superior to either methotrexate or a TNF blocker alone" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L10.015
    kind: mcq
    topic: molecules
    stem: Which of these TNF blockers is a soluble receptor rather than a monoclonal antibody?
    options:
      - Etanercept
      - Infliximab
      - Adalimumab
      - Golimumab
      - Certolizumab
    answer: 0
    why:
      - "Correct: etanercept is the book's soluble receptor antagonist (p175)."
      - Infliximab is a monoclonal antibody (chimeric).
      - Adalimumab is a monoclonal antibody.
      - Golimumab is a monoclonal antibody.
      - Certolizumab is a monoclonal antibody fragment.
    src: { page: 175, quote: "Soluble receptor antagonists (Etanarcept)." }
    status: unverified
  # ---------- p175-176: IL-17, IL-12/23 ----------
  - id: rheum.L10.016
    kind: card
    topic: il17-il23
    front: Diseases in which IL-17 pathway antibodies are used?
    back: Psoriasis, psoriatic arthritis, spondyloarthritis and other immune-mediated diseases.
    src: { page: 175, quote: "including psoriasis and psoriatic arthritis, spondyloarthritis, and other immune-mediated diseases." }
    status: unverified
  - id: rheum.L10.017
    kind: card
    topic: il17-il23
    front: What is secukinumab?
    back: A fully human IgG1 kappa monoclonal antibody against IL-17.
    src: { page: 176, quote: "Secukinumab is a fully human IgG1 kappa monoclonal antibody against IL- 17." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L10.018
    kind: card
    topic: il17-il23
    front: Uses and dosing of secukinumab?
    back: Psoriasis, psoriatic arthritis and ankylosing spondylitis (also used in uveitis); monthly subcutaneous injection after loading doses. Its RA efficacy is modest.
    src: { page: 176, quote: "Secukinumab is administered by monthly subcutaneous injection after several loading doses." }
    status: unverified
  - id: rheum.L10.019
    kind: card
    topic: il17-il23
    front: What does ustekinumab bind?
    back: The shared p40 subunit of IL-12 and IL-23.
    src: { page: 176, quote: "Ustekinumab is a human IgG1 kappa monoclonal antibody that binds to the shared p40 subunit of IL-12 and IL- 23." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L10.020
    kind: cloze
    topic: il17-il23
    text: "Ustekinumab is given every {{c1::12 weeks}} subcutaneously; secukinumab {{c2::monthly}}, both after loading doses."
    src: { page: 176, quote: "It is administered every 12 weeks by subcutaneous injection after several loading doses." }
    status: unverified
    tags: [numbers]
  - id: rheum.L10.021
    kind: card
    topic: il17-il23
    front: Biological effects of IL-12 and IL-23 that ustekinumab blocks?
    back: NK cell activation and CD4+ T-cell differentiation and activation; it also reduces MCP-1, TNF-α, IP-10 and IL-8.
    src: { page: 176, quote: "Biological effects of IL-12 and IL-23 include natural killer (NK) cell activation, CD4+ T-cell differentiation and activation." }
    status: unverified
  - id: rheum.L10.022
    kind: mcq
    topic: il17-il23
    stem: A 40-year-old man with plaque psoriasis and psoriatic arthritis wants the least frequent injections. Which biologic in the lecture is given every 12 weeks after loading?
    options:
      - Ustekinumab
      - Secukinumab
      - Belimumab
      - Etanercept
    answer: 0
    why:
      - "Correct: anti-p40 (IL-12/23), every 12 weeks subcutaneously, used in psoriasis and PsA (p176)."
      - Secukinumab is monthly.
      - Belimumab is an IV lupus drug every four weeks.
      - Etanercept is not dosed every 12 weeks.
    src: { page: 176, quote: "It is administered every 12 weeks by subcutaneous injection after several loading doses." }
    status: unverified
  # ---------- p176-177: B cells ----------
  - id: rheum.L10.023
    kind: card
    topic: bcells
    front: Two strategies against B cells, with one drug each?
    back: Depletion (rituximab) and inhibition of B-cell activating factors (belimumab).
    src: { page: 176, quote: "Biologic agents that can deplete B cells (eg, rituximab) or inhibit factors that activate B cells (belimumab)" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L10.024
    kind: enumerate
    topic: bcells
    prompt: Roles of B cells besides making antibodies?
    points:
      - Present antigen to T cells
      - Activate T cells
      - Promote proinflammatory cytokines (IL-1, 4, 6, 8, 10, 12, TNF-α, VEGF, MCP, MIF)
    pass: 3
    src: { page: 176, quote: "In addition to their central role in antibody production, B cells present antigen to T cells, activate T cells, and promote the production of proinflammatory" }
    status: unverified
  - id: rheum.L10.025
    kind: enumerate
    topic: bcells
    prompt: Indications of rituximab in the book?
    points:
      - Non-Hodgkin lymphoma
      - Chronic lymphocytic leukaemia
      - Rheumatoid arthritis
      - Granulomatosis with polyangiitis
      - Microscopic polyangiitis
    pass: 4
    src: { page: 177, quote: "rituximab is indicated for treating rheumatoid arthritis and granulomatosis with polyangiitis (formerly termed Wegener‘s) and microscopic polyangiitis." }
    status: unverified
  - id: rheum.L10.026
    kind: card
    topic: bcells
    front: Off-label uses of rituximab mentioned?
    back: SLE, systemic sclerosis and other forms of vasculitis.
    src: { page: 177, quote: "It has also been used in systemic lupus erythematosus, systemic sclerosis, and other forms of vasculitis" }
    status: unverified
  - id: rheum.L10.027
    kind: card
    topic: bcells
    front: Mechanism of belimumab?
    back: A monoclonal antibody that binds soluble B lymphocyte stimulator (BLyS), preventing it from binding and stimulating B cells.
    src: { page: 177, quote: "Belimumab is an anti-B lymphocyte stimulator (BLyS) mAb which binds to soluble BLyS, preventing its binding and stimulation of B cells." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L10.028
    kind: card
    topic: bcells
    front: Indication and route of belimumab?
    back: SLE (studied in Sjögren); IV infusion every four weeks after loading doses.
    src: { page: 177, quote: "Belimumab is administered by intravenous infusion every four weeks after therapy is initiated with several more frequent loading doses." }
    status: unverified
    tags: [numbers]
  - id: rheum.L10.029
    kind: mcq
    topic: bcells
    stem: A 30-year-old woman with active SLE despite hydroxychloroquine and prednisone is started on a biologic that binds soluble BLyS. Which drug?
    options:
      - Belimumab
      - Rituximab
      - Ustekinumab
      - Tofacitinib
    answer: 0
    why:
      - "Correct: belimumab binds soluble BLyS and is available for SLE (p177)."
      - Rituximab depletes B cells via CD20; it does not bind BLyS.
      - Ustekinumab blocks IL-12/23 p40.
      - Tofacitinib is an oral JAK inhibitor.
    src: { page: 177, quote: "It is available for use for the treatment of systemic lupus erythematosus and is being studied in other conditions, such as Sjögren syndrome." }
    status: unverified
  # ---------- p177-178: biosimilars ----------
  - id: rheum.L10.030
    kind: card
    topic: biosimilars
    front: WHO definition of a biosimilar?
    back: A biotherapeutic product similar in quality, safety and efficacy to an already licensed reference product.
    src: { page: 177, quote: "biotherapeutic product which is similar in terms of quality, safety and efficacy to an already licensed reference biotherapeutic product." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L10.031
    kind: card
    topic: biosimilars
    front: How does a biosimilar differ from a "biomimic" or "biocopy"?
    back: It has the same primary amino acid sequence as the reference and has passed rigorous analytic and clinical comparison.
    src: { page: 177, quote: "has the same primary amino acid sequence as the reference product and has undergone rigorous analytic and clinical testing" }
    status: unverified
  - id: rheum.L10.032
    kind: card
    topic: biosimilars
    front: What did the 2016 systematic review of biosimilar TNF inhibitors find?
    back: 19 studies comparing biosimilars of infliximab, etanercept and adalimumab supported their efficacy and safety.
    src: { page: 177, quote: "A 2016 systematic review described the results of 19 observational studies and clinical trials that compared biosimilar tumor necrosis factor (TNF)-alpha inhibitors" }
    status: unverified
  - id: rheum.L10.033
    kind: card
    topic: biosimilars
    front: Infliximab-dyyb (CT-P13) is what kind of molecule?
    back: A biosimilar IgG1 chimeric human–murine monoclonal antibody, available in South Korea since 2012.
    src: { page: 178, quote: "The immunoglobulin G1 (IgG1) chimeric human–murine monoclonal antibody, CT-P13, now termed ―infliximab-dyyb‖ in the United States" }
    status: unverified
  - id: rheum.L10.034
    kind: card
    topic: biosimilars
    front: Approved indications of infliximab-dyyb?
    back: RA, ankylosing spondylitis, psoriatic arthritis and psoriasis, Crohn disease and ulcerative colitis.
    src: { page: 178, quote: "This agent is approved for the treatment of rheumatoid arthritis, ankylosing spondylitis, psoriatic arthritis and psoriasis, Crohn disease, and ulcerative colitis." }
    status: unverified
  # ---------- p178-179: kinase inhibitors ----------
  - id: rheum.L10.035
    kind: card
    topic: kinase
    front: Main practical advantage of kinase inhibitors?
    back: They can be given orally.
    src: { page: 178, quote: "An advantage of these agents is that they can be orally administered." }
    status: unverified
  - id: rheum.L10.036
    kind: card
    topic: kinase
    front: Which JAKs does tofacitinib preferentially inhibit?
    back: JAK-1 and JAK-3 (though active on all isoforms).
    src: { page: 178, quote: "preferentially inhibits JAK-1 and JAK-3, although it is active on all the JAK isoforms." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L10.037
    kind: enumerate
    topic: kinase
    prompt: Safety concerns with tofacitinib?
    points:
      - Increased risk of infections
      - Liver function test abnormalities
      - Neutropenia
      - Hyperlipidaemia
      - Possible increased serum creatinine
    pass: 4
    src: { page: 178, quote: "additional concerns that require attention in clinical use include neutropenia, hyperlipidemia, and possible increased serum creatinine." }
    status: unverified
    tags: [high-yield]
    update:
      text: "After ORAL Surveillance (2021), FDA and EMA added boxed warnings for JAK inhibitors: higher rates of major cardiovascular events, malignancy, thrombosis and death than TNF blockers in RA patients ≥50 with a cardiovascular risk factor. Use them after TNF blockers in such patients."
      ref: "FDA Drug Safety Communication 2021; EMA PRAC 2022"
  - id: rheum.L10.038
    kind: card
    topic: kinase
    front: What is Syk, and which cells use it?
    back: Spleen tyrosine kinase, an intracellular kinase mediating immune receptor signalling in macrophages, neutrophils, mast cells and B cells.
    src: { page: 179, quote: "Spleen tyrosine kinase (Syk) is an intracellular cytoplasmic tyrosine kinase that mediates immune receptor signalling in macrophages, neutrophils, mast cells, and B cells." }
    status: unverified
  - id: rheum.L10.039
    kind: card
    topic: kinase
    front: Oral Syk inhibitor tried in RA, and its adverse effects?
    back: Fostamatinib (R788); neutropenia, hypertension, diarrhoea and raised liver enzymes.
    src: { page: 179, quote: "Adverse events included neutropenia, hypertension, diarrhea, and elevated liver enzymes." }
    status: unverified
  - id: rheum.L10.040
    kind: card
    topic: kinase
    front: Mechanism and indication of apremilast?
    back: An oral phosphodiesterase-4 inhibitor, available for psoriatic arthritis; it suppresses many innate and adaptive proinflammatory mediators.
    src: { page: 179, quote: "A novel, orally administrated phsphodiestrase-4 inhibitor available for the treatment of PsA in the US." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L10.041
    kind: card
    topic: kinase
    front: Which PsA patient suits apremilast in the book?
    back: Early non-erosive psoriatic arthritis with enthesitis, dactylitis and multiple comorbidities.
    src: { page: 179, quote: "It is used in early psoriatic nonersoive arthritis with enthesitis, dactilitis, and with multiple comorbidity" }
    status: unverified
  - id: rheum.L10.042
    kind: cloze
    topic: kinase
    text: "Apremilast dose is {{c1::20 or 30 mg twice daily}}; its common early, self-limiting effects are mild {{c2::GI symptoms}} and headache."
    src: { page: 179, quote: "20 or 30 mg twice daily. The most common adverse effects were mild GIT symptoms (diarrhea or nausea), headache" }
    status: unverified
    tags: [numbers]
  - id: rheum.L10.043
    kind: card
    topic: kinase
    front: Two apremilast adverse effects that may need attention or stopping?
    back: Unexplained weight loss (may require discontinuation) and depression.
    src: { page: 179, quote: "Aprimilast may cause unexplained weight loss, which may require discontinuation of treatment." }
    status: unverified
  - id: rheum.L10.044
    kind: mcq
    topic: kinase
    stem: A 58-year-old with early non-erosive psoriatic arthritis, dactylitis, depression and recurrent infections wants an oral drug. Which concern most argues against apremilast?
    options:
      - Its association with depression
      - Neutropenia
      - Hyperlipidaemia
      - Rising creatinine
    answer: 0
    why:
      - "Correct: apremilast use has been linked to more reports of depression (p179)."
      - Neutropenia is a tofacitinib and Syk-inhibitor concern.
      - Hyperlipidaemia is a tofacitinib concern.
      - Raised creatinine is listed for tofacitinib.
    src: { page: 179, quote: "Use of Aprimilast has also been associated with an increase in reports of depression." }
    status: unverified
  - id: rheum.L10.045
    kind: case
    topic: molecules
    stem: "A 45-year-old woman with seropositive RA has active disease despite methotrexate 20 mg weekly."
    steps:
      - question: "Which strategy does the lecture show to be better than either drug alone?"
        options: ["Add a TNF blocker to methotrexate", "Stop methotrexate and use a TNF blocker alone", "Add apremilast", "Add belimumab"]
        answer: 0
        why: "TNF blocker + MTX beat either alone (p175). Apremilast is for PsA. Belimumab is for SLE."
      - reveal: "She prefers an oral drug instead of injections."
        question: "Which oral option reduced RA activity in the lecture?"
        options: ["Tofacitinib", "Secukinumab", "Ustekinumab", "Rituximab"]
        answer: 0
        why: "Tofacitinib is an oral JAK-1/3 inhibitor that reduced RA activity (p178). The others are injections or infusions."
      - question: "What should you monitor on tofacitinib?"
        options: ["Infections, LFTs, neutrophils, lipids, creatinine", "Only blood pressure", "Thyroid function", "Nothing beyond MTX monitoring"]
        answer: 0
        why: "The book lists infections, LFT abnormalities, neutropenia, hyperlipidaemia and possible raised creatinine (p178)."
    src: { page: 178, quote: "It reduced signs and symptoms of disease activity in patients with rheumatoid arthritis." }
    status: unverified
  - id: rheum.L10.046
    kind: essay
    topic: bcells
    prompt: What is the mechanism of action of belimumab and infliximab?
    outline:
      - "Belimumab: anti-BLyS monoclonal antibody; binds soluble BLyS so it cannot bind and stimulate B cells; IV every 4 weeks; SLE"
      - "Infliximab: IgG1 chimeric human–murine monoclonal antibody against TNF-α; blocks TNF; RA, AS, PsA, psoriasis, Crohn, UC"
      - "Context: B-cell inhibition (belimumab) vs cytokine blockade (infliximab, monoclonal antibody class)"
    src: { page: 177, quote: "Belimumab is an anti-B lymphocyte stimulator (BLyS) mAb which binds to soluble BLyS, preventing its binding and stimulation of B cells." }
    status: unverified
    tags: [book-question]
