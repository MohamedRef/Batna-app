      - kind: explain
        page: 201
        title: "الأعراض بالأرقام"
        text: |
          - الـ lung disease شبه **COPD**، وبتبدأ عادة بين ==30 و 50 سنة==.
          - حوالي ==10% of infants== و ==15% of adults== عندهم Alpha-1 بيعملوا liver disease.

          السن هنا هو المفتاح: الـ COPD العادي بيجي في الستينات بعد سنين تدخين. لو شفت صورة COPD في التلاتينات، فكّر في Alpha-1.

          ويعني كمان إن معظم المرضى كبدهم كويس. الرئة هي المشكلة الأشهر، والكبد بيتصاب في أقلية.
      - kind: reveal
        page: 202
        prompt: "مريض عنده 38 سنة، عمره ما دخّن، وعنده emphysema في الـ **lower lungs**. ليه ده يخلّيك تفكر في AATD بالذات؟"
        answer: |
          الـ emphysema العادي بتاع التدخين بيبدأ متأخر، وغالبًا في الـ upper lobes.

          أما الـ AATD فالكتاب بيقول الـ imaging بيدوّر على emphysema especially in the lower lungs، والأعراض بتبدأ 30-50.

          يعني: سن صغير، و basal emphysema، ومن غير تدخين كمان؟ اطلب ==serum AAT==.

          المقارنة بالـ upper lobes تفسير مقبول.
