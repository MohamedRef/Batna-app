  - id: neph.L11.119
    kind: table
    topic: dialysis-care
    title: ACEi/ARB exposure in pregnancy
    columns: [Exposure, Effect]
    rows:
      - [First trimester, "Fetal malformations (OR 1.81), cardiovascular malformations (OR 2.50), stillbirth (OR 1.75)"]
      - [Second and third trimesters, Oligohydramnios and fetal and neonatal death]
    blanks: [[0, 1], [1, 1]]
    src: { page: 373, quote: "Second trimester and third-trimester use of ACEi/ARB is associated with complications, such as oligohydramnios and fetal and neonatal death. (61) Diuretics can be used during pregnancy in women with kidney failure. (62) Currently, there are no human trials to report the safety of sodium-glucose cotransporter-2 inhibitors in pregnant patients. Animal data suggest that they may affect in-utero kidney development and maturation, and it is therefore advised to stop sodium-glucose cotransporter-2 inhibitors 6 weeks before conception.(63) Statins have been contraindicated in pregnancy because of their teratogenic risk. The risk of teratogenicity has been shown in animal studies, in which it is commonly seen with lipophilic statins such as atorvastatin and less commonly seen with hydrophilic statins such as pravastatin. (64) In July 2021, however, the United States Food and Drug Administration requested to remove this recommendation based on recent human studies, which have failed to show major congenital malformations or still birth with statin use. (65) A cohort study published in 2015 failed to show a statistically significant increase in the risk of teratogenic effects after adjusting for potential confounders. (66) Another study did not show congenital anomalies with statin use during pregnancy but did identify a greater risk of low birth weight (RR,1.51; 95% CI, 1.05-2.16) and premature birth (RR, 1.99; 95% CI, 1.46-2.71) in comparison with women without statin use. (67) Anemia may worsen during pregnancy because of volume expansion and increased demands of the growing fetus. Increased doses of parenteral iron (oral or intravenous) and erythropoietin-stimulating agents may be needed during pregnancy to maintain a hemoglobin level of 10-11g/L. (68) For hyperphosphatemia during pregnancy, calcium-based binders and vitamin D analogs are preferred over non-calcium-based phosphate binders or calcimimetics because of limited data on the latter agents with pregnancy. (69)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.120
    kind: card
    topic: dialysis-care
    front: What does the book say about diuretics and SGLT2 inhibitors in pregnancy with kidney failure?
    back: Diuretics can be used. SGLT2 inhibitors have no human data, may affect fetal kidney development in animals, and are stopped 6 weeks before conception.
    src: { page: 373, quote: "Second trimester and third-trimester use of ACEi/ARB is associated with complications, such as oligohydramnios and fetal and neonatal death. (61) Diuretics can be used during pregnancy in women with kidney failure. (62) Currently, there are no human trials to report the safety of sodium-glucose cotransporter-2 inhibitors in pregnant patients. Animal data suggest that they may affect in-utero kidney development and maturation, and it is therefore advised to stop sodium-glucose cotransporter-2 inhibitors 6 weeks before conception.(63) Statins have been contraindicated in pregnancy because of their teratogenic risk. The risk of teratogenicity has been shown in animal studies, in which it is commonly seen with lipophilic statins such as atorvastatin and less commonly seen with hydrophilic statins such as pravastatin. (64) In July 2021, however, the United States Food and Drug Administration requested to remove this recommendation based on recent human studies, which have failed to show major congenital malformations or still birth with statin use. (65) A cohort study published in 2015 failed to show a statistically significant increase in the risk of teratogenic effects after adjusting for potential confounders. (66) Another study did not show congenital anomalies with statin use during pregnancy but did identify a greater risk of low birth weight (RR,1.51; 95% CI, 1.05-2.16) and premature birth (RR, 1.99; 95% CI, 1.46-2.71) in comparison with women without statin use. (67) Anemia may worsen during pregnancy because of volume expansion and increased demands of the growing fetus. Increased doses of parenteral iron (oral or intravenous) and erythropoietin-stimulating agents may be needed during pregnancy to maintain a hemoglobin level of 10-11g/L. (68) For hyperphosphatemia during pregnancy, calcium-based binders and vitamin D analogs are preferred over non-calcium-based phosphate binders or calcimimetics because of limited data on the latter agents with pregnancy. (69)" }
    status: unverified
