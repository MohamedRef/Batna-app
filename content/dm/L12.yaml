    kind: card
    topic: cld-severity
    front: Why is A1C falsely low in many cirrhotic patients?
    back: Variceal bleeding and hypersplenic hemolysis increase Hb turnover and shorten red blood cell (RBC) survival.
    src: { page: 153, quote: "False low results commonly present in such pts. Variceal bleeding, hemolytic anemia by hypersplenism → increase in the Hb turnover and decreased RBC survival ." }
