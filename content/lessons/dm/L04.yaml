          - { text: "Sitagliptin", bin: 2 }
      - kind: aside
        tone: trap
        page: 40
        quote: "Achievement and Maintenance of Weight Management Goals:\n  Set individualized weight management goals\n  General lifestyle advice: medical nutrition therapy/eating patterns/physical activity\n  Intensive evidence-based structured weight management program\n  Consider medication for weight loss\n  Consider metabolic surgery\nWhen choosing glucose-lowering therapies:\n  Consider regimen with high-to-very-high dual glucose and weight efficacy\nEfficacy for weight loss:\n  Very High: Semaglutide, Tirzepatide\n  High: Dulaglutide, Liraglutide\n  Intermediate: GLP-1RA (not listed above), SGLT2i\n  Neutral: DPP-4i, Metformin"
        text: "فخ: الـ **metformin** قوي على السكر (high) بس **neutral على الوزن**. والـ SGLT2 inhibitor (SGLT2i) **high** على السكر و **intermediate** على الوزن."
      - kind: order
        page: 40
        quote: "Achievement and Maintenance of Weight Management Goals:\n  Set individualized weight management goals\n  General lifestyle advice: medical nutrition therapy/eating patterns/physical activity\n  Intensive evidence-based structured weight management program\n  Consider medication for weight loss\n  Consider metabolic surgery\nWhen choosing glucose-lowering therapies:\n  Consider regimen with high-to-very-high dual glucose and weight efficacy\nEfficacy for weight loss:\n  Very High: Semaglutide, Tirzepatide\n  High: Dulaglutide, Liraglutide\n  Intermediate: GLP-1RA (not listed above), SGLT2i\n  Neutral: DPP-4i, Metformin"
        prompt: "رتّب خطوات الـ weight management:"
        steps:
          - "Individualized weight goals"
          - "Nutrition therapy and physical activity"
          - "Intensive structured program"
          - "Weight-loss medication"
          - "Metabolic surgery"
      - kind: explain
        page: 41
        title: "ليه combination؟"
        quote: "Combination Therapy Increasing evidence and rationale:\n  Increased durability of glycemic effect, potential to address therapeutic inertia\n  Simultaneous targeting of multiple pathophysiologic processes characterized by type 2 diabetes\n  Potential impact on medication burden, adherence, and treatment persistence\n  Complementary clinical benefits (glycemia, weight, cardiovascular risk profile)"
        text: |
          - **Durability:** المفعول على السكر بيعيش أطول، وبيكسر الـ ==therapeutic inertia==.
          - **Multiple targets:** بتضرب أكتر من pathophysiologic process مرة واحدة.
          - **Adherence:** أقل medication burden، فالعيان بيكمّل.
          - **Complementary benefits:** سكر ووزن و cardiovascular (CV) risk.

          ليه الـ combination منطقي؟ لأن type 2 فيه **أكتر من عيب** (المحاضرة الأولى): الكبد بيضخ، العضلة مش بتسحب، الـ β-cell تعبانة، والكلية بترجّع سكر. دوا واحد بيضرب عيب واحد، فالسكر بيهرب من التانيين مع الوقت. والـ **therapeutic inertia** يعني الدكتور يستنى سنين وهو بيزوّد دوا ورا دوا ببطء، والعيان قاعد على سكر عالي.
