- id: res.L15.lesson4
  title: 'جداول المقارنة والارتباط: اسم الجدول من شكله'
  hook: 'في الامتحان السؤال سهل: «Give the name of this table». بس لازم تعرف تبص على إيه.'
  minutes: 8
  pages: [55, 67]
  topics: [comparing]
  goals:
  - تفرّق بين comparing وassociation وtwo way table
  - تعرف إمتى 2 × 2 وإمتى c × r
  - تقارن groups بأحجام مختلفة صح
  status: unverified
  steps:
  - kind: explain
    page: 55
    quote: |-
      Comparing frequency distribution table
      Distribution of 2 or more different groups according to 1 variable.
      The total groups should have the same total frequencies
      Otherwise
      Calculate the percent of total for each frequency
    title: Comparing frequency distribution table
    text: |-
      ==أكتر من group== موزّعين على ==متغير واحد==، زي **L.B.W.** والـ normal babies حسب تعليم الأم.

      لازم الـ groups يبقى ليهم نفس الـ total. ولو مش متساويين؟ ==حوّل لـ %== جوه كل group قبل ما تقارن.
  - kind: reveal
    page: 55
    quote: |-
      Comparing frequency distribution table
      Distribution of 2 or more different groups according to 1 variable.
      The total groups should have the same total frequencies
      Otherwise
      Calculate the percent of total for each frequency
    prompt: group فيه 55 والتاني 30. ليه تقارن بالـ % مش بالأعداد؟
    answer: 'لأن الأعداد هتعكس **حجم الـ group** مش التوزيع: أي فئة في الـ group الكبير هتبان أكبر. الـ % جوه كل group بتخليك
      تقارن التوزيع نفسه، وده اللي هتشوفه تاني في رسمة الـ blood groups.'
  - kind: explain
    page: 58
    quote: |-
      Table of association
      It is used to show a relation between a condition and characteristic e.g. relation between smoking and lung cancer.
      TYPES:
      2 X2 table
      c x r table
    title: Table of association
    text: |-
      بيوري **علاقة** بين condition وcharacteristic، زي smoking والـ lung cancer.

      - **2 × 2**: كل متغير ليه احتمالين (smoker/non-smoker × cancer yes/no).
      - **c × r**: واحد منهم أو الاتنين ليه ==أكتر من احتمالين== (Drug A/B/C × cured/improved/worsened).
  - kind: explain
    page: 62
    quote: |-
      IV. Two way table or two way classification table
      1 group
      2 quantitative variables
      (dependent & independent variables).
      It is assumed that these 2 variables are related to each others
      To find any correlation between these two variables
    title: Two way classification table
    text: |-
      ==group واحد== متصنّف حسب ==متغيرين كميين== مرتبطين (dependent و independent)، والهدف تشوف الـ **correlation** بينهم: weight و height، أو age و BP.
