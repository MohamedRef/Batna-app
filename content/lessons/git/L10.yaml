  # Split from lesson6 on 2026-11-13 (#828): the treatment ladder.
  - id: git.L10.lesson8
    title: "علاج الـ GERD: من الـ lifestyle للجراحة"
    hook: "سلّم درجة درجة: عادات، دوا مرة، دوا مرتين، منظار، وبعدين جراحة أو منظار علاجي. ولكل درجة سبب."
    minutes: 10
    pages: [292, 298]
    topics: [gerd-tx]
    goals:
      - "تعرف نصايح الـ lifestyle وليه كل واحدة"
      - "تختار بين H2 blockers و PPI و vonoprazan وتعرف ليه"
      - "تعرف الجراحة والمناظير لمين، وإمتى تحوّل"
    status: unverified
    steps:
      - kind: explain
        page: 292
        quote: "Elevation of the head of the bed by 6 inches."
        title: "الدرجة الأولى: الـ lifestyle"
        text: |
          - **Decrease body weight**.
          - بلاش **fatty diet** و acidic foods.
          - ما تنامش بعد الأكل.
          - ارفع راس السرير ==6 inches==.
          - بطّل **smoking**، وقلّل chocolate و coffee و cola وأدوية بتقلل ضغط الـ lower esophageal sphincter (LES).

          ليه كل نصيحة؟ الكتاب بيقول الـ smoking والـ chocolate والـ coffee والـ cola وبعض الأدوية **decrease LES pressure**. والباقي (التفسير المقبول، مش في الكتاب): الوزن بيعلّي ضغط البطن، والدهون بتبطّأ التفريغ، والنوم بعد الأكل بيشيل الجاذبية، ورفع **راس السرير** (مش مخدة زيادة بس) بيخلّي المريء أعلى من المعدة طول الليل.
      - kind: aside
        tone: joke
        page: 292
        quote: "Avoid sleeping after meals."
        text: |
          يعني الطاجن بالليل، وبعده كوباية شاي وشوكولاتة، وبعدين تتمدد قدام التلفزيون: ده بالظبط الـ **GERD starter pack**. الكتاب بيقول لأ على كل حتة فيه، وأولهم **sleeping after meals**.
      - kind: explain
        page: 293
        quote: "PPI used once daily for 4-8 weeks is effective in most of the patients especially the heart burn but not for regurgitation symptoms."
        title: "الأدوية"
        text: |
          - **H2 blockers** (famotidine، nizatidine): on demand للأعراض النادرة، أو لو فيه resistance أو intolerance للـ proton pump inhibitor (PPI)، أو لـ ==nocturnal acid breakthrough== في اللي على PPI.
          - **PPI** مرة يوميًا 4-8 أسابيع: ممتاز للـ **heartburn**، مش للـ **regurgitation**. لو فشل: **twice daily** قبل الفطار وقبل العشا. لو فشل: **endoscopy** تدوّر على severe esophagitis أو mimics (EoE، achalasia).
          - **Long-term PPI**: infectious gastroenteritis (C. difficile)، **small intestinal bacterial overgrowth (SIBO)**، ونقص iron و B12 و magnesium.

          ليه الـ PPI قبل الأكل؟ التفسير المقبول (مش في الكتاب): الـ PPI بيقفل الـ pumps **الشغالة** بس، والأكل هو اللي بيشغّلها، فلازم يبقى في الدم وقت ما الأكل ييجي. وليه مش شاطر في الـ regurgitation؟ لأنه بيغيّر **نوع** اللي راجع (أقل حمض) مش **كميته**. وليه مضاعفاته؟ لأن الحمض كان بيموّت البكتيريا وبيساعد يمتص الحديد والـ B12.
      - kind: explain
        page: 294
        quote: "Vonoprazan stably accumulates in the acidic secretory canaliculus and noncovalently binds to H+, K+-ATPase with very a very slow dissociation rate and can inhibit newly exposed H+, K+-ATPase for a long time."
        title: "Vonoprazan و الباقيين"
        text: |
          - ==Vonoprazan== (P-CAB): في مصر من **2022**. بيشتغل من **أول يوم**، أحسن من PPI في **Los Angeles (LA) B و C**، وزي الـ lansoprazole في **A و B**. بيتراكم في الـ secretory canaliculus ويمسك الـ H+/K+-ATPase noncovalently وبيسيبها ببطء جدًا.
          - **Prokinetics** (metoclopramide، itopride): **بس** لو فيه gastroparesis.
          - **Baclofen** (GABA-B agonist): بيقلل الـ transient lower esophageal sphincter relaxations (TLESRs)، بس بيعمل dizziness و somnolence.

          ليه الـ vonoprazan بيشتغل من أول يوم والـ PPI لأ؟ التفسير المقبول (مش في الكتاب): الـ PPI **prodrug** محتاج حمض علشان يتنشّط ويمسك الـ pump بقفلة دايمة، وبياخد كام يوم لحد ما يقفل أغلب الـ pumps. الـ vonoprazan **مش محتاج تنشيط**، وبيقعد في الـ canaliculus ويمسك أي pump جديد يطلع، فالتأثير أسرع وأطول.
      - kind: reveal
        page: 294
        quote: "Prokinetics: metoclopramide or itopride can be used only if there is gastroparesis."
        prompt: "ليه الـ prokinetics بس لو فيه gastroparesis؟ وليه الـ baclofen منطقي بس مش أول اختيار؟"
        answer: |
          الكتاب: **prokinetics** (metoclopramide، itopride) **only if there is gastroparesis**، و **baclofen** (GABA-B agonist) بيقلل الـ **transient LES relaxations** بس بيعمل dizziness و somnolence.

          التفسير المقبول (مش في الكتاب): الـ prokinetic بيعالج سبب واحد بس من التلاتة (delayed emptying)، فلو التفريغ طبيعي مالوش لازمة، والـ metoclopramide ليه أعراض عصبية. والـ baclofen بيضرب الـ TLESRs اللي هي أشهر آلية للـ reflux، بس لأنه شغال على المخ، النعاس والدوخة بيحددوا استخدامه.
