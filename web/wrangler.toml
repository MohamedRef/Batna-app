# The Batna web app as a static-assets Worker (no script): the same Cloudflare
# account and token as Batna Cloud, free plan. Deployed by
# .github/workflows/web-deploy.yml from target/web/batna (scripts/web/build.sh).
name = "batna-web"
compatibility_date = "2026-10-01"

[assets]
directory = "../target/web/batna"
not_found_handling = "single-page-application"
