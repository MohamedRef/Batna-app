    src: { page: 195, quote: "Clinically apparent renal disease occurs in fewer than half of NPS patients. The nephropathy is usually benign, with an approximately 3% to 5% risk for progression to ESRD.49,50 The clinical signs of NPS nephropathy appear in adolescence or young adulthood and typically include microhematuria and mild proteinuria, although some patients develop nephrotic syndrome and mild hypertension. The severity of the renal manifestations may differ substantially in related individuals." }
