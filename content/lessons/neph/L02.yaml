            <text x="250" y="46" text-anchor="middle" class="t-sm">ACR 30 mg/g or more,</text>
            <text x="250" y="60" text-anchor="middle" class="t-sm">sediment, imaging...</text>
            <line x1="80" y1="66" x2="150" y2="100" class="fg-arrow" marker-end="url(#N2d)"/>
            <line x1="250" y1="66" x2="180" y2="100" class="fg-arrow" marker-end="url(#N2d)"/>
            <rect x="95" y="102" width="140" height="36" rx="18" class="fg-bad"/>
            <text x="165" y="125" text-anchor="middle" class="t-b">&gt; 3 months</text>
            <line x1="165" y1="138" x2="165" y2="162" class="fg-arrow" marker-end="url(#N2d)"/>
            <rect x="40" y="164" width="250" height="56" rx="8" class="fg-good"/>
            <text x="165" y="186" text-anchor="middle" class="t-b">CKD</text>
            <text x="165" y="208" text-anchor="middle" class="t-sm">Cause, GFR category, Albuminuria category</text>
          </svg>
      - kind: explain
        page: 24
        quote: "CKD is defined as abnormalities of kidney structure or"
        title: "ليه 3 شهور بالذات؟"
        text: |
          الكتاب بيشترط إن الـ abnormality تفضل **أكتر من 3 شهور**. التفسير المقبول (مش في الكتاب): علشان نفصل الـ CKD عن حاجتين بيعملوا نفس الأرقام لفترة قصيرة:

          - ==AKI==: الـ creatinine بيطلع فجأة وممكن يرجع خالص في أيام أو أسابيع.
          - الـ albuminuria **العابرة**: رياضة، حمى، UTI، أو الدورة (هتشوفهم في جدول ص 30) بيعلّوا الـ ACR يوم ويرجع.

          يعني رقم واحد غير طبيعي **مش تشخيص**. التشخيص هو الرقم اللي **بيفضل**. وعلشان كده خطوة "أكّد بعد 3 شهور" موجودة في الـ screening algorithm.
      - kind: explain
        page: 24
        quote: "and albuminuria category (CGA)."
        title: "ليه التصنيف تلات حروف مش حرف واحد؟"
        text: |
          الكتاب بيصنّف الـ CKD بالـ **CGA**: Cause، GFR category، Albuminuria category. التفسير المقبول (مش في الكتاب) لكل حرف:

          - **C (Cause)**: لأن العلاج الخاص بيمشي ورا السبب. lupus nephritis محتاج immunosuppression، والـ obstruction محتاج تفك الانسداد، ومحدش هيعالجهم صح لو اكتفى بكلمة "CKD".
          - **G (GFR)**: بيقولك فاضل قد إيه من شغل الكلى، وده اللي بيحدد جرعات الأدوية والمضاعفات.
          - **A (Albuminuria)**: بيقولك الـ filter **بيتأذى قد إيه دلوقتي**. واحد GFR بتاعه 50 من غير albumin غير واحد GFR 50 وبيرمي 1 جرام.

          يعني الـ G بتوصف اللي **راح**، والـ ==A== بتتنبأ باللي **جاي**. ولما تجمعهم على الـ heat map هتعرف الخطر.
      - kind: explain
        page: 24
        quote: "Urine sediment abnormalities"
        title: "ليه دول بالذات markers of damage؟"
        text: |
          الكتاب بيعدّ markers of kidney damage. والتفسير المقبول (مش في الكتاب) لكل واحد:

          - **Albuminuria (ACR ≥ 30 mg/g)**: الـ glomerulus السليم مش بيعدّي albumin، فوجوده معناه إن الـ filter نفسه اتأذى، حتى لو الـ GFR لسه طبيعي.
          - **Urine sediment abnormalities**: زي الـ ==RBC casts== أو الـ dysmorphic RBCs، دول بيتعملوا جوه الـ nephron نفسه، يعني المرض جوه الكلية مش في المسالك.
          - **Tubular disorders**: الـ tubule ممكن يفشل في وظيفة واحدة (زي RTA أو فقد K) والـ GFR سليم.
          - **Histology** و **imaging**: بيشوفوا الـ structure مباشرة (fibrosis، cysts، scars).
          - **History of kidney transplantation**: الـ graft كلية واحدة شايلة شغل اتنين، فبيتعامل معاه على إنه CKD.
      - kind: check
        page: 24
        quote: "Criteria for CKD (either of the following present for > 3 months)\n| Markers of kidney damage (one or more) | Albuminuria (AER ≥ 30 mg/24 hours; ACR ≥ 30 mg/g [≥ 3 mg/mmol]) |\n| | Urine sediment abnormalities |\n| | Electrolyte and other abnormalities due to tubular disorders |\n| | Abnormalities detected by histology |\n| | Structural abnormalities detected by imaging |\n| | History of kidney transplantation |\n| Decreased GFR | GFR < 60 ml/min/1.73 m2 (GFR categories G3a-G5) |"
        question: "eGFR 85 and ACR 50 mg/g, persisting for 6 months. CKD?"
        options:
          - "Yes: albuminuria is a marker of damage, so this is CKD G2A2"
          - "No: eGFR is above 60"
          - "No: ACR must be above 300"
          - "Only if the kidneys are small on ultrasound"
        answer: 0
        why:
          - "صح: أي marker of damage لمدة > 3 شهور يكفي حتى لو الـ GFR فوق 60."
          - "الـ GFR < 60 معيار، بس مش المعيار الوحيد."
          - "الحد 30 mg/g، و > 300 ده A3."
          - "الـ imaging marker تاني، مش شرط."
      - kind: check
        page: 24
        quote: "History of kidney transplantation"
        question: "Which finding, persisting for 3 months, does NOT by itself meet the KDIGO criteria for CKD?"
        options:
          - "A single raised serum creatinine with eGFR 72"
          - "ACR 45 mg/g"
          - "History of kidney transplantation"
          - "Structural abnormality on imaging"
        answer: 0
        why:
          - "صح: eGFR 72 فوق 60، ومفيش marker of damage. والـ creatinine لوحده مش marker."
          - "ACR ≥ 30 mg/g = albuminuria = marker of damage."
          - "تاريخ زرع الكلى واحد من الـ markers في الكتاب."
          - "Structural abnormalities detected by imaging marker في الكتاب."
      - kind: explain
        page: 24
        quote: "Increased cardiovascular disease"
        title: "ليه مريض الكلى بيموت بالقلب؟"
        text: |
          رسمة الـ hyperfiltration في ص 24 بتكمّل لحد آخرها: الـ glomerular hyperfiltration بيجيب **oxidative stress** و**inflammation**، ودول بيعملوا ==endothelial dysfunction==، فالـ arteries تبقى **stiff**، والضغط يعلى ويفقد تغيّره الطبيعي بين الليل والنهار، والنهاية **increased cardiovascular disease and mortality**.

          التفسير المقبول (مش في الكتاب) لباقي الحكاية: الـ CKD كمان بيجيب أنيميا (القلب يشتغل أكتر)، و phosphate عالي بيكلّس الشرايين، واحتباس ملح ومية. علشان كده الـ ==CVD== بيسبق الـ dialysis في أغلب المرضى.

          الخلاصة للامتحان: في مريض CKD، علاج الضغط والدهون والسكر مش "إضافي"، ده نص علاج الكلى.
      - kind: try
        items: [neph.L02.004, neph.L02.006, neph.L02.001, neph.L02.002]
    recap:
      - "CKD = abnormality > 3 شهور؛ GFR < 60 أو marker of damage (ACR ≥ 30 mg/g)."
      - "الـ 3 شهور بتفصله عن الـ AKI والـ albuminuria العابرة."
      - "CGA: السبب بيحدد العلاج، الـ G اللي راح، الـ A اللي جاي."
      - "CVD هو السبب الأول لوفاة مريض الـ CKD."
    practice: [neph.L02.001, neph.L02.002, neph.L02.003, neph.L02.004, neph.L02.005, neph.L02.006, neph.L02.007, neph.L02.008, neph.L02.154]
  # ------------------------------------------------------------------
  - id: neph.L02.lesson7
    title: "الـ hyperfiltration والـ screening"
    hook: "النفرونات الباقية بتشتغل زيادة لحد ما تموت. وده سبب إننا بندوّر بدري."
    minutes: 9
    pages: [24, 27]
    topics: [hyperfiltration, screening]
    goals:
      - "تفهم أسباب الـ hyperfiltration وإزاي بتعمل دايرة مقفولة"
      - "تعرف مين تعمله screening وليه"
      - "تمشي على الـ screening algorithm"
    status: unverified
    steps:
      - kind: figure
        page: 24
        title: "الـ hyperfiltration في الكتاب"
        image: { file: neph/L02-hyperfiltration.webp, book: true }
        alt: "Book diagram. Top grey box: causes of renal hyperfiltration (increased sympathetic activity, increased renin-angiotensin-aldosterone activity, hyperglycaemia and insulin resistance, obesity, increased autoimmune activation, impaired glomerular haemodynamics, inhibition of tubuloglomerular feedback). Centre: a drawn glomerulus labelled glomerular hyperfiltration, with afferent arteriole (reduced arterial resistance) on the left and efferent arteriole (increased arterial resistance) on the right, increased glomerular permeability to macromolecules, and a tubule labelled proteinuria/albuminuria. Around it: increased oxidative stress and inflammation; endothelial dysfunction (arterial stiffness, high blood pressure, impaired variation); increased sodium uptake. All arrows end at increased cardiovascular disease and mortality."
        caption: |
          - **الصندوق الرمادي فوق**: أسباب الـ hyperfiltration: sympathetic، الـ **renin-angiotensin-aldosterone** system، **hyperglycaemia** و insulin resistance، **obesity**، autoimmune، وتعطيل الـ **tubuloglomerular feedback** (الـ macula densa).
          - **في النص: الـ glomerulus**: شمال **Afferent arteriole** مكتوب تحته **reduced arterial resistance** (متوسّع)، ويمين **Efferent arteriole** و **increased arterial resistance** (ضيق). يعني الدم داخل كتير وخارج بالعافية، فالضغط جوه ==يعلى==.
          - **الأنبوبة تحت**: **Proteinuria/Albuminuria**: الفلتر المضغوط بيعدّي بروتين.
          - **حواليه**: oxidative stress و inflammation (يمين فوق)، **Endothelial dysfunction** (يمين تحت: arterial stiffness وضغط عالي)، و **Increased sodium uptake** (شمال).
          - **كل الأسهم تحت**: **Increased cardiovascular disease and mortality**.

          الرسمة بتربط حاجتين: نفس الـ hyperfiltration اللي بيبوّظ الكلية ==هو اللي بيضرب القلب==.
      - kind: explain
        page: 24
        quote: "Causes of Renal Hyperfiltration"
        title: "ليه الـ nephron الباقي بيشتغل زيادة؟"
        text: |
          الكتاب بيقول إن الـ **single-nephron hyperfiltration** هو رد فعل adaptive لما عدد الـ nephrons يقل. وبيعدّ الأسباب: sympathetic activity، **RAAS**، hyperglycaemia و insulin resistance، obesity، autoimmune activation، impaired glomerular haemodynamics، و**inhibition of tubuloglomerular feedback**.

          التفسير المقبول (مش في الكتاب) لأهمهم:

          - **Angiotensin II** بيضيّق الـ ==efferent arteriole== أكتر من الـ afferent، فالضغط جوه الـ glomerulus يعلى.
          - في الـ **hyperglycaemia** الـ proximal tubule بيمص glucose كتير ومعاه Na، فالـ Na اللي بيوصل للـ **macula densa** يقل. الـ macula densa تفهم إن الفلترة قليلة، فتوسّع الـ ==afferent==.
          - الـ **obesity**: جسم أكبر محتاج فلترة أكتر من نفس عدد النفرونات.

          يعني الـ afferent مفتوح والـ efferent مقفول، والـ glomerulus بين الاتنين تحت ضغط.
      - kind: explain
        page: 25
        quote: "Once half of the total nephrons are lost, CKD progresses similarly regardless of etiology. Initial hyperfiltration activates RAAS and causes proteinuria. Angiotensin II and protein uptake at the tubules causes inflammation and fibrosis of the glomerulus and tubules. Progressive decline in GFR and systemic complications occurs."
        title: "الدايرة المقفولة"
        text: |
          الكتاب في ص 25 بيكمّل الحكاية: الـ hyperfiltration الأولاني بيشغّل الـ **RAAS** ويعمل ==proteinuria==. والـ **angiotensin II** والبروتين اللي الـ tubules بتمصه بيعملوا **inflammation** و**fibrosis** في الـ glomerulus والـ tubules، فالـ GFR ينزل والمضاعفات تظهر.

          التفسير المقبول (مش في الكتاب) لليه البروتين مؤذي: خلايا الـ tubule مش متعودة تمص كميات بروتين كبيرة، فبتتعب وتطلّع مواد التهابية بتشد الـ fibroblasts.

          والنتيجة: كل nephron يموت بيزوّد الحمل على الباقي، فيموتوا أسرع. علشان كده الكتاب بيقول إن بعد ما ==نص النفرونات== يروح، المرض بيكمّل بنفس الطريقة أيًا كان السبب.
      - kind: figure
        page: 25
        quote: "Pathogenesis of chronic kidney disease"
        title: "الدايرة المقفولة: رسمة الكتاب"
        image: { file: neph/L02-pathogenesis.webp, book: true }
        alt: "Book flowchart 'Pathogenesis of chronic kidney disease' with a note on the left. Down the centre: fewer nephrons, adaptive hyperfiltration at the glomerulus, which splits into raised glomerular permeability and raised RAAS. Raised RAAS raises single-nephron GFR (SNGFR) in a purple 'early in course' box, which feeds back to hyperfiltration, and causes hypertension. Raised permeability leads to more filtration of proteins and macromolecules, then proteinuria and dyslipidemia. Both paths lead to nephrotoxic inflammation/remodelling, then tubulointerstitial fibrosis and secondary FSGS, then lower GFR, lower urine output and systemic complications, in an orange 'late in course' box."
        caption: |
          - **فوق**: **↓ nephron number** ← **Adaptive hyperfiltration at glomerulus**.
          - **يمين، المربع البنفسجي (Early in course)**: **↑ RAAS** ← **↑ SNGFR** (single-nephron GFR)، وسهم راجع لفوق للـ hyperfiltration: دي ==الدايرة المقفولة==. ومن الـ RAAS سهم لـ **Hypertension**.
          - **شمال**: **↑ glomerular permeability** ← **↑ filtration of proteins** ← **Proteinuria** ← **Dyslipidemia**.
          - **في النص**: الطريقين بيتقابلوا في **Nephrotoxic inflammation/remodelling**.
          - **تحت، المربع البرتقاني (Late in course)**: **Tubulointerstitial fibrosis and 2° FSGS** (focal segmental glomerulosclerosis) ← **↓ GFR**، **↓ Urine output**، **Systemic complications**.

          الرسمة بتوضح ليه بعد ما نص النفرونات يروح المرض بيكمّل لوحده: ==الـ RAAS والبروتين== هما الماتور، ودول بالظبط اللي العلاج بيستهدفهم.
      - kind: aside
        page: 25
        quote: "Once half of the total nephrons are lost, CKD progresses similarly regardless of etiology. Initial hyperfiltration activates RAAS and causes proteinuria. Angiotensin II and protein uptake at the tubules causes inflammation and fibrosis of the glomerulus and tubules. Progressive decline in GFR and systemic complications occurs."
        tone: exam
        text: "جملة امتحان: لما **نص النفرونات** يروح، الـ CKD بيكمّل **بنفس الطريقة أيًا كان السبب**. علشان كده علاج الـ hyperfiltration (RAASi و sodium–glucose cotransporter 2 (SGLT2) inhibitor (SGLT2i)) بينفع مع معظم الأسباب."
      - kind: check
        page: 25
        quote: "Once half of the total nephrons are lost, CKD progresses similarly regardless of etiology. Initial hyperfiltration activates RAAS and causes proteinuria. Angiotensin II and protein uptake at the tubules causes inflammation and fibrosis of the glomerulus and tubules. Progressive decline in GFR and systemic complications occurs."
        question: "Once half of the nephrons are lost, CKD:"
        options:
          - "Progresses similarly regardless of the cause"
          - "Stops if the original cause is treated"
          - "Progresses only in diabetic kidney disease"
          - "Always needs dialysis within a year"
        answer: 0
        why:
          - "صح: جملة الكتاب في ص 25، والسبب الـ hyperfiltration في الباقيين."
          - "علاج السبب مهم، بس الدايرة بتكمّل لوحدها؛ علشان كده بنضيف RAASi و SGLT2i."
          - "الكتاب قال regardless of etiology."
