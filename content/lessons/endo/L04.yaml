      - "توصّل أمراض الـ motility بالغدة المسؤولة وتعرف ليه"
      - "تعدّ أورام البنكرياس الهرمونية وهرموناتها"
    status: unverified
    steps:
      - kind: explain
        page: 53
        quote: "Abrogated GH receptor function\n  Stimulate the production of proinflammatory cytokines (Tumor necrosis factor (TNF a) & Ils) which can block GH – mediated signal transduction.\n  Circulating GH receptor antibodies.\n  Elevated GH & low IGF-I levels."
        title: "قصير والـ GH عالي"
        text: |
          الكتاب بيعدّ 6 أمراض في الجهاز الهضمي ليها علاقة بالغدد: malabsorption، IBD، motility disorders، acute pancreatitis، pancreatic endocrine tumours، و liver cirrhosis.

          الـ ==malabsorption== بيعمل 3 حاجات: **short stature**، **sex hormone disturbance**، و **hyperparathyroidism**.

          الـ short stature سببه ==growth hormone (GH) resistance==: الـ caloric deprivation والـ malnutrition والـ diabetes mellitus (DM) مش متظبط والـ chronic renal failure (CRF) بيرفعوا الـ **TNF-α والـ interleukins (ILs)**، ودول بيقفلوا الـ GH signal transduction. يعني الـ GH بيوصل للخلية بس الرسالة مش بتعدّي. النتيجة: **GH عالي و IGF-I واطي**. ونادرًا GH receptor antibodies.
