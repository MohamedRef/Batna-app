schema: batna.lesson/v1
lecture: endo.L05
lessons:
  # ------------------------------------------------------------------
  - id: endo.L05.lesson1
    title: "الخلية اللي بتفرز وهي ساكتة"
    hook: "خلية شبه العصب بس من غير axon، بتفرز هرمونات وتعمل مصايب في الكبد قبل ما حد يلاحظها."
    minutes: 8
    pages: [77, 80]
    topics: [overview, classification, markers]
    goals:
      - "تعرف يعني إيه NET والـ APUD cell"
      - "تحفظ أماكن الـ carcinoid بالـ foregut / midgut / hindgut"
      - "تعرف الـ CgA وأرقامه"
    status: unverified
    steps:
      - kind: explain
        page: 77
        quote: "Frequently present with hypersecretory syndromes."
        title: "يعني إيه NET؟"
        text: |
          الـ ==neuroendocrine tumours== مجموعة heterogeneous، بس بيشتركوا في 3 حاجات:

          1. بتطلع من **neuroendocrine cells**.
          2. عندها **secretory characteristics**.
          3. كتير بتظهر بـ **hypersecretory syndromes**: الهرمون هو اللي بيفضح الورم.
      - kind: explain
        page: 77
        quote: "In 1969, Pearse described APUD cells (Amine Precursor Uptake and Decarboxylation)."
        title: "الـ APUD cell"
        text: |
          سنة 1969 **Pearse** وصف الـ ==APUD cells==: Amine Precursor Uptake and Decarboxylation.

          - بتعمل **polypeptides** و **biogenic amines**.
          - شايلاهم في **dense core secretory granules** وبتطلّعهم لما ييجي stimulus.
          - شبه العصب، بس **من غير axons ولا synapses**.
          - جزء من الـ **diffuse endocrine system (DES)**، ومنه بتطلع أورام الـ gut والـ pancreas.
      - kind: aside
        tone: analogy
        page: 77
        quote: "Lack axons and synapses. Part of the diffuse endocrine system (DES)."
        text: "تخيلها موظف بريد من غير عربية: عنده الجوابات (granules) بس مفيش سلك يوصله بحد، فبيرمي الهرمون في الدم وخلاص."
      - kind: figure
        page: 78
        quote: "Tryptophan → 5-HTP → 5-HT → 5-HIAA."
        title: "من tryptophan لـ 5-HIAA"
        alt: "A vertical chain: tryptophan, then 5-HTP, then 5-HT (serotonin), then 5-HIAA in urine. A side box lists the granule proteins pancreastatin, chromostatin and chromogranin A."
        caption: "الـ 5-HIAA هو اللي بنقيسه في بول 24 ساعة. والـ CgA طالع من نفس الـ granules."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="E05a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="130" height="34" rx="6" class="fg-box"/>
            <text x="22" y="32" class="t-b">Tryptophan</text>
            <path d="M75 44v20" class="fg-arrow" marker-end="url(#E05a)"/>
            <rect x="10" y="68" width="130" height="34" rx="6" class="fg-box"/>
            <text x="50" y="90" class="t-b">5-HTP</text>
            <path d="M75 102v20" class="fg-arrow" marker-end="url(#E05a)"/>
            <rect x="10" y="126" width="130" height="34" rx="6" class="fg-acc"/>
            <text x="20" y="148" class="t-b t-acc">5-HT (serotonin)</text>
            <path d="M75 160v20" class="fg-arrow" marker-end="url(#E05a)"/>
            <rect x="10" y="184" width="130" height="34" rx="6" class="fg-good"/>
            <text x="45" y="206" class="t-b">5-HIAA</text>
            <text x="20" y="238" class="t-sm t-mut">measured in 24h urine</text>
            <rect x="170" y="60" width="150" height="110" rx="8" class="fg-thin"/>
            <text x="180" y="82" class="t-sm t-b">Granules hold:</text>
            <text x="180" y="106" class="t-sm">pancreastatin</text>
            <text x="180" y="128" class="t-sm">chromostatin</text>
            <text x="180" y="150" class="t-sm t-acc t-b">chromogranin A</text>
          </svg>
      - kind: check
        page: 78
        quote: "Exception: Appendiceal carcinoids more common in patients <30 years."
        question: "Most NETs of the lung and GI tract occur over 50. Which is the exception?"
        options: ["Appendiceal carcinoid (under 30)", "Gastrinoma (under 30)", "Lung carcinoid (under 20)", "Insulinoma (children)"]
        answer: 0
        why:
          - "صح: الـ appendiceal carcinoid أشيع تحت 30، عشان كده بيتلاقى صدفة في appendicectomy عند شباب."
          - "الـ gastrinoma متوسط سن التشخيص حوالي 50."
          - "الـ lung carcinoid بييجي في الخمسينات."
          - "الـ insulinoma بين 40 و 50."
      - kind: table
        page: 79
        quote: "40–60% Midgut (distal ileum and jejunum) — includes carcinoid syndrome."
        title: "الـ carcinoid على حسب الـ gut"
        columns: ["Gut", "%", "Sites"]
        rows:
          - ["Foregut", "25%", "Lung, thymus, stomach, duodenum"]
          - ["Midgut", "40-60%", "Distal ileum, jejunum + syndrome"]
          - ["Hindgut", "-", "Colon, rectum"]
        hide: [[0, 2], [1, 1], [2, 2]]
      - kind: aside
        tone: exam
        page: 79
        quote: "40–60% Midgut (distal ileum and jejunum) — includes carcinoid syndrome."
        text: "الـ **carcinoid syndrome** مكتوب جنب الـ **midgut** في الكتاب. لو السؤال فيه flushing + diarrhoea، فكّر في ileum الأول."
      - kind: table
        page: 79
        quote: "Well-differentiated NE carcinomas: Low-grade malignant with invasion of muscularis propria or metastasis."
        title: "WHO: تلات درجات"
        columns: ["Category", "Behaviour"]
        rows:
          - ["Well-diff. NET", "Benign or uncertain"]
          - ["Well-diff. NE carcinoma", "Low-grade, invades m. propria or mets"]
          - ["Poorly diff. carcinoma", "High-grade malignant"]
        hide: [[1, 1], [2, 1]]
      - kind: update
        page: 79
        quote: "Level of tumor differentiation and proliferation indices such as Ki-67 are useful"
        text: "الـ WHO 2019 بيقسّم الـ GEP-NET بالـ Ki-67: G1 أقل من 3%، G2 من 3 لـ 20%، G3 فوق 20%، والـ NEC لوحده. في الامتحان اكتب تقسيم الكتاب."
        ref: "WHO Classification of Digestive System Tumours, 5th ed., 2019"
      - kind: mnemonic
        page: 79
        quote: "MEN-1 (20%, gastrinoma or non-functioning)."
        word: "MTNV"
        hook: "الـ familial syndromes مع أورام البنكرياس: \"My Tumour Needs Vigilance\"."
        parts:
          - { key: "M", text: "MEN-1 (20%, gastrinoma or non-functioning)" }
          - { key: "T", text: "Tuberous sclerosis" }
          - { key: "N", text: "Neurofibromatosis (ampulla of Vater)" }
          - { key: "V", text: "Von Hippel-Lindau" }
      - kind: explain
        page: 80
        quote: "Represents a constitutive neuroendocrine secretory protein. Most widely accepted biomarker."
        title: "الـ CgA: الماركر العام"
        text: |
          الـ ==chromogranin A== بروتين بيتفرز طول الوقت (constitutive)، وهو **most widely accepted biomarker**.

          - Specificity **85.7%**، sensitivity **67.9%**.
          - عالي في **60-80%** من الـ NETs (والكتاب كاتب 90-100% كـ general marker).
          - بيمشي مع الـ **disease burden**، وفي الـ pNET لو نزل بدري مع chemo أو **everolimus** = prognosis أحسن.
          - الماركر التاني: **pancreatic polypeptide** 40-60%، وبيتعمله **meal stimulation test** كل 10 دقايق لمدة ساعة ونص.
      - kind: check
        page: 80
        quote: "In pancreatic NETs, early declines in CgA during treatment with chemotherapy and everolimus are associated with improved prognosis."
        question: "A patient with a pancreatic NET on everolimus has a falling CgA after 2 months. What does it suggest?"
        options: ["Better prognosis", "Tumour dedifferentiation", "Lab error; CgA does not change", "Everolimus toxicity"]
        answer: 0
        why:
          - "صح: الـ early decline في الـ CgA مع chemo أو everolimus مرتبط بـ improved prognosis."
          - "الـ CgA بيمشي مع حجم المرض، النزول معناه حمل أقل مش dedifferentiation."
          - "الـ CgA بيتغير مع الـ disease burden، وبيتدرس كـ serial marker."
          - "مفيش علاقة بالـ toxicity في الكتاب."
      - kind: try
        items: [endo.L05.001, endo.L05.005, endo.L05.014, endo.L05.017, endo.L05.023]
    recap:
      - "NET: من neuroendocrine cells، secretory، وكتير hypersecretory syndrome."
      - "APUD (Pearse 1969): granules من غير axons، جزء من الـ DES."
      - "Tryptophan → 5-HTP → 5-HT → 5-HIAA."
      - "Carcinoid: foregut 25%، midgut 40-60% (syndrome)، hindgut. Appendix تحت 30."
      - "CgA: الماركر الأساسي، sp 85.7%، sn 67.9%."
    practice: [endo.L05.001, endo.L05.002, endo.L05.003, endo.L05.004, endo.L05.005, endo.L05.006, endo.L05.007, endo.L05.008, endo.L05.009, endo.L05.010, endo.L05.011, endo.L05.012, endo.L05.013, endo.L05.014, endo.L05.015, endo.L05.016, endo.L05.017, endo.L05.018, endo.L05.019, endo.L05.020, endo.L05.021, endo.L05.022, endo.L05.023, endo.L05.024, endo.L05.107, endo.L05.112, endo.L05.114]
