      - kind: explain
        page: 54
        quote: "Mechanisms of acid-mediated tubulointerstitial fibrosis in chronic kidney"
        title: "الحمض بيليّف الكلية إزاي؟"
        text: |
          Figure 4 في ص 54: **Mechanisms of acid-mediated tubulointerstitial fibrosis**. فيها muscle catabolism و amino acids و acidemia، وبعدين **renal NH4+** و **endothelin** و **RAS**، والنهاية ==interstitial fibrosis==.

          التفسير المقبول (مش في الكتاب) للحكاية: الحمض لازم يطلع. ومع nephrons أقل، كل nephron باقي بيعمل **ammonia أكتر** علشان يشيل الحمض. والـ ammonia الكتير بتشغّل الـ complement والالتهاب في الـ interstitium. وفي نفس الوقت الـ ==endothelin== والـ angiotensin بيعلوا علشان يزوّدوا إفراز الحمض، ودول الاتنين بيليّفوا.

          يعني الكلية وهي بتحاول تنضّف الحمض بتأذي نفسها. وعلشان كده الـ bicarbonate بيحميها.
      - kind: figure
        page: 54
        quote: "Mechanisms of acid-mediated tubulointerstitial fibrosis in chronic kidney"
        title: "شكل 4 في الكتاب: دايرة الحمض"
        image: { file: neph/L02-acid-fibrosis.webp, book: true }
        alt: "Book flowchart, Figure 4: CKD at the top leads to acidemia. Acidemia and muscle catabolism (amino acids) feed renal NH4+, which leads to complement activation; acidemia also leads to RAS activation and endothelin, which acts on ET-A and ET-B receptors. Bone resorption feeds acidemia. Complement activation, RAS activation and ET-A receptors lead to interstitial fibrosis; ET-B receptors and RAS lead to H+ secretion, which feeds back negatively on acidemia. A long arrow from interstitial fibrosis back to CKD is marked plus."
        caption: |
          - **فوق**: **CKD** (الدايرة) ← **Acidemia**.
          - **شمال**: **Muscle catabolism** بيطلّع **amino acids**، ومع الحمض كل nephron باقي يعمل **Renal NH4+** (ammonium) أكتر ← **Complement activation**.
          - **النص**: الحمض ← **RAS activation**.
          - **يمين**: الحمض ← **Endothelin** ← **ET-A receptors** و **ET-B receptors** ← **H+ secretion** (بيطلّع الحمض، والخط بعلامة **-** راجع للحمض: تعويض).
          - **فوق يمين**: **Bone resorption**: العضم بيدّي buffer للحمض.
          - **تحت**: الـ complement والـ RAS والـ ET-A كلهم بيوصلوا لـ **Interstitial fibrosis**، والخط الطويل شمال بعلامة **+** راجع للـ CKD.

          يعني نفس الحاجات اللي الكلية بتعملها ==علشان تطلّع الحمض== (NH4+، endothelin، RAS) هي اللي ==بتليّفها==، وده ليه الـ bicarbonate بيبطّأ المرض.
