  - id: geri.L07.067
    kind: mcq
    topic: fracture
    stem: A 35-year-old woman has untreated premature menopause. A 58-year-old woman has no risk factors. A 70-year-old man smokes and drinks 20 units a week. A 76-year-old man has no risk factors. According to NICE as given in the lecture, who should NOT have a fracture risk assessment?
    options:
      - The 58-year-old woman with no risk factors
      - The 35-year-old with untreated premature menopause
      - The 70-year-old man who smokes and drinks 20 units a week
      - The 76-year-old man
      - All four need assessment
    answer: 0
    why:
      - "Correct: she is under 65 with no risk factor, so assessment is not advised (p114)."
      - Under 50 is assessed only with major risk factors, and untreated premature menopause is one (p115).
      - Men under 75 are assessed when they have risk factors; smoking and alcohol over 14 units count (p115).
      - All men aged 75 and over are assessed (p114).
      - The 58-year-old has no indication.
    src: { page: 114, quote: "In women aged under 65 years and men aged under 75 years in the presence of risk factors, for example:\n  Previous fragility fracture" }
    status: unverified
