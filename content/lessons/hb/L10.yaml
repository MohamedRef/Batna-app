  - id: hb.L10.lesson4
    title: "باقي العناية: عدوى، تجلط، سكر، و NAC"
    hook: "INR 4 ومفيش نزيف؟ سيبه. سكر واطي؟ متسيبوش. وعلبة NAC ممكن تنفع حتى لو مفيش بنادول."
    minutes: 10
    pages: [180, 183]
    topics: [care, specific, support]
    goals:
      - "تتعامل مع الـ infection والـ coagulopathy والـ fluids والسكر والبروتين"
      - "تكتب جرعات الـ NAC وتعرف فايدته وعيوبه، والـ specific therapies"
      - "تعرف مين من الـ liver support systems ليه mortality benefit"
    status: unverified
    steps:
      - kind: explain
        page: 180
        title: "العدوى والتجلط"
        text: |
          - الـ **bacteremia** والـ **fungemia** شائعين: **periodic blood cultures**، وممكن **antimicrobial prophylaxis** (بس ما ثبتش إنها بتحسن الـ survival). ولو فيه شك في sepsis: **broad coverage**.
          - الـ **PT** مقياس بسيط نتابع بيه، والـ coagulopathy **مش بتتصلّح** إلا لو فيه **نزيف** أو **procedure** (زي تركيب monitor).
          - ساعتها: **FFP الأول**، وممكن platelets و fibrinogen وحتى **recombinant factor VIIa**.
      - kind: reveal
        page: 180
        prompt: "ليه منصلّحش الـ INR بـ FFP كل يوم ونرتاح؟"
        answer: |
          لأن الـ **PT هو الترمومتر** بتاعنا: هو اللي بيقولنا الكبد بيخف ولا بيسوء، وهو جزء من الـ prognostic criteria. لو صلّحته بالـ FFP، كسرت الترمومتر ومش هتعرف الحرارة.

          (والكتاب بيقول نصلّح بس لو نزيف أو procedure.)
      - kind: table
        page: 180
        title: "الـ metabolic و hemodynamic support"
        columns: ["Target", "What the book says"]
        rows:
          - ["Fluids", "Resuscitate, but avoid large volumes of hypotonic fluid (ICP rises)"]
          - ["Vasopressor", "Norepinephrine preferred"]
          - ["Glucose", "5% or 10% dextrose infusion, keep 100–200 mg/dL, check at least twice daily"]
          - ["Kidney", "Intermittent renal replacement therapy may be needed"]
          - ["Protein", "Enteral 1–1.5 g/kg/day to keep muscle and immunity"]
        hide: [[1, 1], [2, 1], [4, 1]]
      - kind: check
        page: 180
        question: "ALF with INR 4.2, no bleeding, no procedure planned. What does the book advise?"
        options:
          - "Do not correct; follow the PT"
          - "Give fresh frozen plasma to bring INR under 1.5"
          - "Give recombinant factor VIIa"
          - "Give platelets and fibrinogen"
        answer: 0
        why:
          - "صح: الـ coagulopathy **not corrected unless bleeding or an invasive procedure**."
          - "الـ FFP بس لو نزيف أو procedure."
          - "الـ rFVIIa آخر حاجة، وبرضه بس مع نزيف أو procedure."
          - "نفس الكلام: مفيش indication."
      - kind: explain
        page: 180
        title: "الـ NAC: مش بس للبنادول"
        text: |
          - **Randomized trial**: الـ NAC **ممكن يفيد** حتى في **non-acetaminophen ALF**: early-stage HE خدوه كان عندهم **transplant-free survival أحسن**.
          - **Indicated** في الـ acetaminophen toxicity لحد **72 ساعة** بعد البلع.
          - في الـ **massive overdose**: كمّل الـ IV NAC لحد ما الـ **aminotransferases تنزل** و الـ **acetaminophen يبقى undetectable**.
          - في **stage 1 أو 2 HE** من أي سبب: بيحسن الـ **cerebral blood flow** والـ oxygenation والـ transplant-free survival.
      - kind: table
        page: 181
        title: "جرعات الـ NAC"
        columns: ["Route", "Loading", "Then"]
        rows:
          - ["Oral", "140 mg/kg", "70 mg/kg every 4 h for 17 more doses"]
          - ["IV (in 5% dextrose)", "150 mg/kg over 15 min", "50 mg/kg over 4 h, then 100 mg/kg over 16 h"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2]]
      - kind: aside
        tone: tip
        page: 181
        text: |
          افتكر الـ IV بالأرقام **150 → 50 → 100** في **15 دقيقة → 4 ساعات → 16 ساعة**. والـ oral: **140** وبعدين **70 كل 4 ساعات × 17**.
      - kind: aside
        tone: trap
        page: 181
        text: |
          الـ NAC ممكن **يطوّل الـ PT**، فتفتكر إن الكبد **بيسوء** وهو مش كده. وعيوبه كمان: nausea، vomiting، و **anaphylactoid reaction** خصوصًا مع تاريخ **asthma**.
      - kind: match
        page: 181
        prompt: "وصّل كل سبب بعلاجه الخاص:"
        pairs:
          - ["Acetaminophen", "N-acetyl cysteine"]
          - ["Hepatitis B", "Nucleoside analogues"]
          - ["Herpes simplex hepatitis", "IV acyclovir"]
          - ["Wilson disease", "Plasmapheresis + D-penicillamine"]
        why: "الكتاب بيدي العلاجات دي بالاسم. علشان كده تحديد السبب مهم: فيه specific therapy."
      - kind: explain
        page: 181
        title: "الكبد الصناعي: حلم لسه"
        text: |
          الـ **liver assist devices** كان الأمل إنها تبقى **bridge** للزرع أو للـ recovery، بس الـ «**proxy liver**» لسه بعيد. وصعب نقيّمها لأنها بتأثر على نفس الـ markers اللي بنقيس بيها. فالأهم: **critical care كويس**.

          - **Artificial (filters):** dialysis أو adsorption؛ **مفيش survival benefit**.
          - **MARS:** albumin-impregnated membrane بيشيل الـ protein-bound toxins؛ حسّن الـ hemodynamics والـ HE، بس **مفيش mortality benefit** (trend في الـ acetaminophen غير المزروعين).
          - **Bio-artificial:** whole organ perfusion، hepatocytes (porcine أو hepatoblastoma) على columns، أو transplantation of hepatocytes / stem cells. الـ **ELAD** (hepatoblastoma) **مفيش mortality benefit**. والـ cell transplantation فيها أمل، خصوصًا في الأطفال بـ metabolic disease.
          - **Plasma exchange** في أول **3 أيام** في العناية: قلل الـ ICP، و **عنده mortality benefit** في اللي ما اتزرعوش.
      - kind: check
        page: 183
        question: "Which extracorporeal therapy showed a MORTALITY benefit in ALF patients who were not transplanted?"
        options:
          - "Plasma exchange"
          - "MARS"
          - "ELAD"
          - "Charcoal-based filters"
        answer: 0
        why:
          - "صح: **plasma exchange** في أول 3 أيام، حتى في اللي استوفوا poor prognostic criteria ومااتسجلوش بسبب co-morbidity. والتفسير: تعديل الـ **monocyte immune function** مع تنضيف الـ mediators وتعويض الـ plasma factors."
          - "الـ MARS حسّن الـ physiology بس **no mortality benefit**."
          - "الـ ELAD برضه **failed** في الـ mortality."
          - "الـ filters الأولانية **failed** تثبت survival benefit."
      - kind: try
        items: [hb.L10.078, hb.L10.083, hb.L10.093]
    recap:
      - "Blood cultures دورية؛ broad coverage لو sepsis."
      - "الـ coagulopathy متتصلحش إلا مع نزيف أو procedure (FFP الأول)."
      - "Norepinephrine؛ dextrose لـ glucose 100–200؛ protein 1–1.5 g/kg؛ ابعد عن hypotonic fluids."
      - "NAC: oral 140 ثم 70 × 17؛ IV 150 → 50 → 100؛ لحد 72 h؛ مفيد في stage 1–2 من أي سبب؛ بيطوّل الـ PT."
      - "HBV nucleoside، HSV acyclovir، Wilson plasmapheresis + penicillamine؛ plasma exchange بس اللي ليه mortality benefit."
