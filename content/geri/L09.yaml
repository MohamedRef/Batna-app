    status: unverified
  - id: geri.L09.015
    kind: enumerate
    topic: innate
    prompt: What decreases in ageing monocytes and macrophages (book figure)?
    points:
      - Phagocytosis
      - Surface TLR1 and TLR4
      - TLR-induced CD80 up-regulation
      - TLR1/2-induced IL-6 and TNF-α production
      - CD68+ macrophages in bone marrow
    pass: 4
    src: { page: 158, quote: "INNATE IMMUNE RESPONSE : AGE-ASSOCIATED CHANGES NEUTROPHILS AND MACROPHAGES" }
    status: unverified
  - id: geri.L09.016
    kind: enumerate
    topic: innate
    prompt: What decreases in ageing NK cells (book figure)?
    points:
      - CD69 expression
      - IL-2 and IL-12 mediated chemokine production
      - Calcium mobilization
      - Cytotoxicity
      - IL-2 dependent IFN-γ production
    pass: 4
    src: { page: 158, quote: "INNATE IMMUNE RESPONSE : AGE-ASSOCIATED CHANGES NK CELLS AND DENDRITIC CELLS" }
    status: unverified
  - id: geri.L09.017
    kind: enumerate
    topic: innate
    prompt: What decreases in ageing dendritic cells (book figure)?
    points:
      - Langerhans cell density in skin
      - Processing capacity
      - Micropinocytosis and phagocytosis
      - Migration
      - TLR function
      - LPS-induced IL-12 and IFN-α production
    pass: 4
    src: { page: 158, quote: "INNATE IMMUNE RESPONSE : AGE-ASSOCIATED CHANGES NK CELLS AND DENDRITIC CELLS" }
    status: unverified
  - id: geri.L09.018
    kind: mcq
    topic: innate
    stem: Which age-related change in innate immunity is described in the lecture?
    options:
      - NK cells increase in number but lose cytotoxicity
      - Neutrophils show enhanced free radical production
      - Dendritic cells present antigen more efficiently
      - Macrophages gain phagocytic capacity
      - NK cell antibody-dependent cytotoxicity is lost completely
    answer: 0
    why:
      - "Correct: NK cells increase in number with reduced cytotoxicity (p157)."
      - Neutrophil free radical production is impaired.
      - Dendritic cell antigen presentation is reduced.
      - Macrophage phagocytosis is reduced, with more oxidative stress.
      - The figure shows no change in antibody-dependent cytotoxicity (p158).
    src: { page: 157, quote: "Natural killer cells (NK): increase number of NK, reduced cytotoxicity." }
    status: unverified
  # ---------- p159: acquired, inflammaging ----------
  - id: geri.L09.019
    kind: table
    topic: acquired
    title: Acquired immunity with age
    columns: [Cell, Change]
    rows:
      - [T cells, "↓ thymopoiesis; accumulated highly differentiated memory cells; loss of CD28 and CD69; ↓ CD8+ proliferation to antigen"]
      - [B cells, "↓ lymphopoiesis; ↑ memory B cells; impaired antibody response to vaccination"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 159, quote: "B cells: reduction in B cell lymphoiesis, increase in memory B cells, impaired antibody response to vaccination." }
    status: unverified
    tags: [high-yield, book-question]
  - id: geri.L09.020
    kind: card
    topic: acquired
    front: Which T-cell surface antigens are lost with age, and why does it matter?
    back: CD28 and CD69, which are needed for T-cell activation and signal transduction.
    src: { page: 159, quote: "Loss of CD28 antigen CD69 antigen required for T cell activation& signal transduction" }
    status: unverified
  - id: geri.L09.021
    kind: card
    topic: acquired
    front: Which B-cell change explains poor vaccine responses in old age?
    back: Reduced B-cell lymphopoiesis with more memory B cells, giving an impaired antibody response to vaccination.
    src: { page: 159, quote: "impaired antibody response to vaccination." }
    status: unverified
  - id: geri.L09.022
    kind: card
    topic: acquired
    front: What is inflamaging?
    back: The dysregulated cytokine response of ageing, especially an increase in the pro-inflammatory cytokine IL-6.
    src: { page: 159, quote: "in particular an increase in pro-inflammatory cytokine IL-6, this phenomenon has been referred to as inflamaging." }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.023
    kind: card
    topic: acquired
    front: What has chronic IL-6 elevation been linked to in old age?
    back: Chronic disease and functional decline.
    src: { page: 159, quote: "Chronic elevation of IL-6 has been correlated with chronic disease and functional decline in old." }
    status: unverified
  - id: geri.L09.024
    kind: mcq
    topic: acquired
    stem: An 84-year-old has a poor antibody response to a vaccine. Which change in acquired immunity best explains it?
    options:
      - Reduced B-cell lymphopoiesis with impaired antibody response
      - Increased naive T-cell pool
      - Increased CD28 expression on T cells
      - Increased thymopoiesis
      - Fewer memory B cells
    answer: 0
    why:
      - "Correct: B-cell lymphopoiesis falls and the antibody response to vaccination is impaired (p159)."
      - The naive T-cell pool falls with age.
      - CD28 is lost with age.
      - Thymopoiesis is reduced.
      - Memory B cells increase.
    src: { page: 159, quote: "B cells: reduction in B cell lymphoiesis, increase in memory B cells, impaired antibody response to vaccination." }
    status: unverified
  # ---------- p160: risks ----------
  - id: geri.L09.025
    kind: enumerate
    topic: risks
    prompt: Discuss the risk factors of infection in old age.
    points:
      - Living in long-term care facilities
      - Chronic diseases
      - Malnutrition
      - Immunosenescence
      - Polypharmacy and immunosuppressive drugs
      - Prosthetic devices
      - Frequent hospitalization (nosocomial infection) and medical therapy
      - Delayed recognition from atypical presentation
      - Weaker cough reflex and mucociliary clearance
      - Decreased gastric acidity
    pass: 7
    src: { page: 160, quote: "Living in a long term care facilities, chronic diseases, malnutrition, immune senescence, polypharmacy, increase use of prosthetic devices." }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.026
    kind: card
    topic: risks
    front: Why do infections in the elderly cause serious complications?
    back: Atypical presentations delay recognition of symptoms.
    src: { page: 160, quote: "Delayed recognition of symptoms, related to atypical presentations of infection in elderly make them liable to serious complications." }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.027
    kind: table
    topic: risks
    title: Lost protection and the infection it invites
    columns: [Lost protection, Infection risk]
    rows:
      - [Weaker cough reflex and mucociliary clearance, Respiratory infection]
      - [Lower gastric acidity (ageing and drugs), Gastrointestinal infection]
      - [Frequent hospitalization, Nosocomial infection]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 160, quote: "Diminished anatomic & physiologic protection as cough reflex and mucociliary clearance, increase the susceptibility to respiratory infection." }
    status: unverified
  - id: geri.L09.028
    kind: mcq
    topic: risks
    stem: A 79-year-old woman on a long-term proton pump inhibitor develops infectious diarrhoea. Which age-related risk does the lecture link to this?
    options:
      - Decreased gastric acidity
      - Weaker cough reflex
      - Increased NK cell number
      - Increased memory B cells
      - Prosthetic joint
    answer: 0
    why:
      - "Correct: lower gastric acidity, physiological and from medication, raises GI infection risk (p160)."
      - The cough reflex protects the airways, not the gut.
      - More NK cells is an immune change, not a gut barrier.
      - More memory B cells does not explain gut infection.
      - Prosthetic devices raise device infection risk.
    src: { page: 160, quote: "Decreased gastric acidity in old due to both physiological and medication side effects can increase susceptibility to gastrointestinal infections." }
    status: unverified
  # ---------- p161-162: vaccination ----------
  - id: geri.L09.029
    kind: cloze
    topic: vaccination
    text: "Elderly people account for about {{c1::90%}} of all influenza-related deaths."
    src: { page: 161, quote: "Elderly people account for approximately 90% of all influenza-related deaths." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L09.030
    kind: card
    topic: vaccination
    front: Why does vaccination matter so much in the elderly?
    back: It is cost-effective and efficient against infection-related morbidity and mortality, and since infections worsen pre-existing health problems, prevention allows healthy independent living.
    src: { page: 161, quote: "prevention of infection by vaccination allow healthy independent living." }
    status: unverified
  - id: geri.L09.031
    kind: card
    topic: vaccination
    front: Which influenza vaccine is generally recommended for everyone over 65, per the lecture?
    back: The seasonal trivalent inactivated influenza vaccine (TIV), plus a pandemic influenza vaccine if applicable, to maintain serum antibody levels.
    src: { page: 161, quote: "every one over 65 years, receive the seasonal trivalent inactivated influenza vaccine (TIV)" }
    status: unverified
    tags: [high-yield]
    update:
      text: "CDC ACIP (2022 onward) preferentially recommends a higher-dose, adjuvanted or recombinant influenza vaccine for adults 65 and over; current US vaccines are trivalent again from 2024–25."
      ref: "CDC ACIP influenza recommendations 2024–25"
  - id: geri.L09.032
    kind: card
    topic: vaccination
    front: What happens to vaccine efficacy with ageing?
    back: It decreases.
    src: { page: 161, quote: "However the efficacy of vaccination decrease with aging." }
    status: unverified
