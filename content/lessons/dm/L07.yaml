        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 84
        title: "Handgrip و QTc"
        quote: "VI- Diastolic blood pressure response to isometric exercise\n  4- The subject squeezes a handgrip dynamometer to establish a maximum. Grip is then squeezed at 30% maximum for 5 min. The normal response for diastolic blood pressure is a rise of > 16 mmHg in the other arm"
        text: |
          **Handgrip:** يحدد أقصى قبضة، وبعدين يقبض على **30%** منها لمدة **5 min**. الطبيعي إن الـ ==diastolic BP يعلى >16 mmHg== في الدراع التاني.

          **Corrected QT interval (QTc)** لازم يكون ==<440 ms==.

          ليه الـ handgrip؟ التفسير المقبول (مش في الكتاب): العضلة المنقبضة مدة طويلة بتبعت إشارة للمخ، والمخ يرد بـ **sympathetic** يضيّق الأوعية فالـ diastolic يعلى. لو مش بيعلى كفاية، يبقى السلك الـ sympathetic هو اللي واقع.
      - kind: figure
        page: 85
        title: "صور الكتاب ص 85: الـ QT interval"
        image: { file: dm/L07-long-qt.webp, book: true }
        alt: "Book image in two parts. Top: a single ECG complex labelled P, Q, R, S and T, with the QT interval drawn from the start of Q to the end of T. Bottom: a 12-lead ECG titled long QT interval, with a red box around one complex in lead II."
        caption: |
          - **فوق**: ضربة واحدة. الـ ==QT interval== من **أول الـ Q** لحد **آخر الـ T** (الخط اللي تحت على اليمين).
          - **تحت**: ECG كامل لـ **long QT**، والمربع الأحمر في **lead II** على الشمال حوالين ضربة واحدة.

          الـ **QTc** لازم يبقى **<440 ms**؛ أطول من كده بيفتح الباب للـ torsades.
