  - id: res.L03.009
    kind: table
    topic: process
    title: How the type of clinical question determines the study design
    columns: [Type of question, Study design (best first)]
    rows:
      - [Therapy, "randomized controlled trial (RCT) > Cohort > Case control > Case series/reports"]
      - [Diagnosis, "Prospective, blind comparison to a gold standard, or cross-sectional"]
      - [Harm/Etiology, "RCT > Cohort > Case control > Case series/reports"]
      - [Prognosis, "Cohort > Case control > Case series/reports"]
      - [Prevention, "RCT > Cohort > Case control > Case series/reports"]
      - [Clinical exam, "Prospective, blind comparison to a gold standard"]
      - [Cost analysis, Economic analysis]
    blanks: [[1, 1], [3, 1], [6, 1]]
    src: { page: 11, quote: "How clinical research questions determines study type (design)\n| Type of Question | Study Design |\n|---|---|\n| Therapy | RCT > Cohort > Case Control > Case Series/Reports |\n| Diagnosis | Prospective, blind comparison to a gold standard or Cross-Sectional |\n| Harm/Etiology | RCT > Cohort > Case Control > Case Series/Reports |\n| Prognosis | Cohort > Case Control > Case Series/Reports |\n| Prevention | RCT > Cohort > Case Control > Case Series/Reports |\n| Clinical Exam | Prospective, blind comparison to a gold standard |\n| Cost-Analysis | Economic analysis |\nQuestions on therapy, etiology and prevention that can best be answered by an RCT, can also be answered by a systematic review or meta-analysis.\nHarm/Etiology studies can be answered by RCTs if ethical issues allow it. (Schardt, 2013)" }
    status: unverified
    tags: [high-yield]
  - id: res.L03.010
    kind: mcq
    topic: process
    stem: For a question about prognosis, which design comes first in the lecture's table?
    options: [Randomised controlled trial, Cohort study, Case-control study, Economic analysis]
    answer: 1
    why:
      - "The prognosis row has no randomized controlled trial (RCT): you cannot randomise people to a prognosis."
      - "Prognosis: Cohort > Case control > Case series/reports."
      - "Case-control is second for prognosis."
      - "Economic analysis answers cost-analysis questions."
    src: { page: 11, quote: "How clinical research questions determines study type (design)\n| Type of Question | Study Design |\n|---|---|\n| Therapy | RCT > Cohort > Case Control > Case Series/Reports |\n| Diagnosis | Prospective, blind comparison to a gold standard or Cross-Sectional |\n| Harm/Etiology | RCT > Cohort > Case Control > Case Series/Reports |\n| Prognosis | Cohort > Case Control > Case Series/Reports |\n| Prevention | RCT > Cohort > Case Control > Case Series/Reports |\n| Clinical Exam | Prospective, blind comparison to a gold standard |\n| Cost-Analysis | Economic analysis |\nQuestions on therapy, etiology and prevention that can best be answered by an RCT, can also be answered by a systematic review or meta-analysis.\nHarm/Etiology studies can be answered by RCTs if ethical issues allow it. (Schardt, 2013)" }
    status: unverified
