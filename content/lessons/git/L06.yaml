          - "الغياب ما ينفيش."
          - "مش لازم، الـ diagnosis clinical وبالمجموع."
          - "البروتوكول اتنين من كل segment من الخمسة، مش واحدة."
      - kind: explain
        page: 216
        title: "اللي برّه الأمعاء: 50%"
        quote: "Crohn disease and ulcerative colitis may be associated in 50% of patients with a number of extraintestinal manifestations"
        text: |
          الـ EIM بتحصل في حوالي ==50%==. الكتاب في Table 2 قسّمها بالجهاز، والـ **hepatobiliary** فيها **PSC** اللي هيرجع معانا في الـ CRC.
