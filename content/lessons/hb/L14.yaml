  - id: hb.L14.lesson5
    title: "حامل ومعاها مرض كبد قديم"
    hook: "cirrhosis، HBV، HCV، AIH، أو transplant: إيه يكمل وإيه يتوقف وإمتى تعمل منظار."
    minutes: 9
    pages: [269, 273]
    topics: [preg-coincident, preg-lt]
    goals:
      - "تعرف تعمل إيه في acute hepatitis و Budd-Chiari أثناء الحمل"
      - "تمشي screening الـ varices للـ cirrhotic اللي عايزة تحمل"
      - "تعرف prevention الـ HBV و HCV vertical transmission"
      - "تعرف القواعد بعد الـ liver transplant"
    status: unverified
    steps:
      - kind: explain
        page: 269
        title: "Coincident: viral و Budd-Chiari"
        text: |
          - **Acute hepatitis في الحمل:** افحص HAV، HBV، **HEV**، و **herpes simplex**. ولو شاكك في **HSV**: ابدأ **acyclovir**.
          - **Budd-Chiari:** hepatic venous outflow obstruction. Risk factors: trauma، hypercoagulable states، myeloproliferative disorders، OCPs، و **pregnancy**. بيظهر بـ **abdominal pain و hepatomegaly و ascites**، و **Doppler ultrasound** كفاية في أغلب الحالات.
      - kind: explain
        page: 270
        title: "Cirrhosis و portal hypertension"
        text: |
          - الحمل مع الـ cirrhosis **uncommon** (عوامل metabolic و endocrine).
          - التحديات: **decompensation**، **encephalopathy**، و portal hypertension أوحش.
          - الـ fetal risks: spontaneous abortion، premature birth، stillbirth.
          - **Variceal bleeding** في **18–32%**، وأكتر وقت في **الـ second trimester والـ delivery**.
          - الـ bleeding بيتعالج **زي غير الحامل**: band ligation، أو **TIPS** لو لازم.
      - kind: reveal
        page: 270
        prompt: "ليه الخطر الأكبر للنزيف في الـ second trimester والولادة؟"
        answer: |
          الكتاب بيدّي التوقيت بس. السبب الفسيولوجي المعروف: الـ **blood volume** بيزيد بسرعة ويوصل لقمته في التاني، والرحم الكبير بيضغط على الـ IVC فيزوّد الـ collateral flow، والـ **straining** في الولادة بيرفع الـ portal pressure فجأة.
      - kind: order
        page: 270
        prompt: "رتّب خطوات واحدة عندها compensated cirrhosis وعايزة تحمل:"
        steps:
          - "Optimize her medically and control portal hypertension before pregnancy"
          - "Screening EGD for oesophageal varices"
          - "No varices: repeat EGD in the second trimester"
          - "Medium or large varices: band ligation"
        why: "الكتاب: optimize قبل الحمل → EGD screening → لو مفيش varices **كرّر في الـ second trimester** → الـ **band ligation** treatment of choice للـ medium/large varices. ولو محتاجة beta blocker: **propranolol** هو المفضّل، والـ prophylactic TIPS مالوش data."
      - kind: check
        page: 271
        question: "When indicated, which non-selective beta blocker is preferred during pregnancy?"
        options:
          - "Propranolol"
          - "Carvedilol"
          - "Atenolol"
          - "Nadolol"
        answer: 0
        why:
          - "صح: الكتاب: **propranolol is the preferred non selective beta blocker** في الحمل."
          - "الكتاب ما ذكرش الـ carvedilol في الحمل."
          - "الـ atenolol أصلًا **selective**، مش NSBB."
          - "الكتاب ما ذكرهوش؛ الإجابة propranolol."
      - kind: explain
        page: 271
        title: "HBV و HCV"
        text: |
          **HBV:**

          - **كل** الأطفال المولودين لأم HBV-infected: **HBIG + HBV vaccine** (active–passive immunoprophylaxis).
          - الأم بـ **viral load > 200,000 IU/mL**: antiviral في الـ **third trimester**: **tenofovir** أو telbivudine.

          **HCV:**

          - افحص بـ **anti-HCV** الحوامل اللي **عندهم risk factors**.
          - قلّل **invasive procedures** (amniocentesis، invasive fetal monitoring).
          - **متدّيش** HCV treatment أثناء الحمل.
      - kind: update
        ref: "AASLD HBV guidance 2018; CDC HCV screening 2020"
        text: |
          - الـ **telbivudine** مبقاش بيُستخدم، والـ **tenofovir disoproxil (TDF)** هو المفضّل (AASLD 2018).
          - الـ CDC (2020) بقت توصي بـ HCV screening **لكل حامل في كل حمل**، مش بس اللي عندهم risk factors.

          في الامتحان: إجابة الكتاب.
      - kind: explain
        page: 271
        title: "AIH و PBC و Wilson: كمّل"
        text: |
          - **AIH:** كمّل **corticosteroids و/أو azathioprine**.
          - **PBC:** كمّل **UDCA**.
          - **Wilson:** كمّل penicillamine أو trientine أو zinc، **مع تقليل الجرعة لو ممكن**.
      - kind: aside
        tone: trap
        page: 271
        text: |
          الفخ إنك توقف العلاج «علشان الجنين». الكتاب بيقول **continue** في الـ AIH والـ PBC والـ Wilson. وقف الدوا ممكن يعمل flare أو decompensation، وده أخطر على الأم والجنين من الدوا.
      - kind: explain
        page: 272
        title: "الحمل بعد الـ transplant"
        text: |
          - الـ **fertility** بترجع غالبًا خلال **سنة**.
          - الحمل **مش recommended في أول سنة** بسبب **acute cellular rejection**.
          - التخطيط مع فريق الـ transplant و maternal-fetal medicine.
          - الـ **preconception renal function** بتتنبأ بالنتيجة.
          - النتيجة كويسة، بس فيه زيادة في **preterm delivery**، **low birth weight**، **hypertension**، و **pre-eclampsia**.
          - **Tacrolimus monotherapy** هو الـ ideal. البدائل: cyclosporine، azathioprine، prednisone.
          - **Mycophenolate: avoid** (congenital malformations).
          - **Monitoring** للـ graft و الـ CNI levels: كل **4 أسابيع** لحد 32، كل **أسبوعين** لحد 36، وبعدين **كل أسبوع** لحد الولادة.
      - kind: check
        page: 272
        question: "A 28-year-old woman 8 months after liver transplant takes tacrolimus and mycophenolate and wants to conceive now. What is the best advice?"
        options:
          - "Wait until a year after transplant and stop mycophenolate before conception"
          - "Conceive now; continue both drugs"
          - "Conceive now; switch tacrolimus to mycophenolate alone"
          - "Pregnancy is contraindicated after liver transplant"
        answer: 0
        why:
