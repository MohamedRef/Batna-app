          </svg>
      - kind: explain
        page: 427
        title: "الأربع طرق: كل واحد بيضرب فين؟"
        quote: "Hyperglycemia\n  Renal hemodynamic changes\n    ↑ IGF-1, TGF-β, VEGF, PG, Glucagon, ET-1, SGLT2\n      Efferent arteriolar constriction, Glomerular hypertension\n      Glomerular hypertrophy, Glomerular sclerosis\n  Activation of RAAS\n    ↑ ROS, TGF-β, Ang II, Aldosterone\n      Podocyte injury, Decreased HIF stability, Proteinuria\n  Ischemia and Inflammation\n    AGEs, TNF-α, NF-κB\n      Podocyte injury, Decreased HIF stability, Proteinuria\n  Oxidative stress\n    ↑ JAK/STAT, VEGF, MCP-1\n      Tubulointerstitial fibrosis, Tubular atrophy, Mesangial cell expansion, ECM accmulation\n  → Diabetic kidney disease"
        text: |
          الأسماء والأسهم من الـ figure (ص 427)، والشرح التفسير المقبول (مش في الكتاب):

          - **Renal hemodynamic changes:** الـ IGF-1 والـ glucagon والـ SGLT2 وغيرهم بيخلّوا الـ **efferent arteriole** تتقفل أكتر من الـ afferent، فالضغط بيتحبس جوه الـ glomerulus: ==glomerular hypertension==، وبعدها **hypertrophy** و **sclerosis**.
          - **RAAS activation:** الـ angiotensin II بيقبّض الـ efferent كمان، والـ aldosterone بيعمل fibrosis، وكلهم بيأذوا الـ **podocyte** فيطلع البروتين.
          - **Ischemia and inflammation:** السكر بيلزق في البروتينات ويعمل **AGEs**، والـ AGEs بتشغّل الالتهاب (TNF-α، NF-κB).
          - **Oxidative stress:** بيوصل لـ **mesangial expansion** و **tubulointerstitial fibrosis**.

          يعني فيه ضغط (hemodynamic) وفيه كيميا (metabolic)، والعلاج الحديث بيضرب الاتنين.
      - kind: order
        page: 427
        quote: "Hyperglycaemia\n  ↑ Glucose load on kidney\n    ↑ Tubule reabsorption\n      ↓ NaCl to distal tubule\n        → Initial Glomerular hyperfilteration\n  Activation of RAS\n    Initial Glomerular hyperfilteration\n      Sheer Stress on glomerulus\n        Podocyte loss → ↑ Glomerular basement membrane permeability → Tubular fibrosis\n        ↑ Glomerular basement membrane permeability → Tubular fibrosis\n        Mesangial matrix expansion → Tubular fibrosis\n  ↑ Oxidative Stress (↔ Activation of RAS)\n    ↑ Polyol pathway Flux, AGE formation, PKC Activation, Hexosmine Flux\n      Cellular Signalling, Transcription factors, cytokine activation\n        Abnormal ECM protein expression and accumulation → Mesangial matrix expansion\n        ↓ Production of matrix mettalo-proteinases\n          ↓ Extracellular matrix regulation → Abnormal ECM protein expression and accumulation\n  → Tubular fibrosis → Diabetic Nephropathy"
        prompt: "رتّب سلسلة الـ hemodynamics في الشكل التاني (ص 427):"
        steps:
          - "More glucose load on the kidney"
          - "More tubular reabsorption"
          - "Less NaCl to the distal tubule"
          - "Initial glomerular hyperfiltration"
          - "Shear stress on the glomerulus"
        why: "الـ proximal tubule بيمص glucose و Na مع بعض، فالـ NaCl اللي بيوصل للـ macula densa بيقل، والـ glomerulus يفتكر إن الـ GFR واطي فيعليه. ده نفس المكان اللي الـ sodium–glucose cotransporter 2 (SGLT2) inhibitors بتشتغل فيه."
      - kind: reveal
        page: 427
        quote: "Hyperglycaemia\n  ↑ Glucose load on kidney\n    ↑ Tubule reabsorption\n      ↓ NaCl to distal tubule\n        → Initial Glomerular hyperfilteration\n  Activation of RAS\n    Initial Glomerular hyperfilteration\n      Sheer Stress on glomerulus\n        Podocyte loss → ↑ Glomerular basement membrane permeability → Tubular fibrosis\n        ↑ Glomerular basement membrane permeability → Tubular fibrosis\n        Mesangial matrix expansion → Tubular fibrosis\n  ↑ Oxidative Stress (↔ Activation of RAS)\n    ↑ Polyol pathway Flux, AGE formation, PKC Activation, Hexosmine Flux\n      Cellular Signalling, Transcription factors, cytokine activation\n        Abnormal ECM protein expression and accumulation → Mesangial matrix expansion\n        ↓ Production of matrix mettalo-proteinases\n          ↓ Extracellular matrix regulation → Abnormal ECM protein expression and accumulation\n  → Tubular fibrosis → Diabetic Nephropathy"
        prompt: "ليه الـ glomerulus بيعلّي الـ GFR لما الـ NaCl اللي واصل للـ distal tubule يقل؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ **macula densa** هي «الحسّاس» بتاع الكلية. لو الملح اللي واصلها قليل، بتفهم إن الفلترة واطية، فبتفتح الـ **afferent arteriole** عشان تزوّدها. ده اسمه **tubuloglomerular feedback**.

          في السكر الـ proximal tubule بيمصّ glucose و Na مع بعض أكتر من الطبيعي، فالملح بيوصل قليل **على الفاضي**، والـ glomerulus بيفضل فاتح على آخره. وده بالظبط المكان اللي الـ ==SGLT2 inhibitors== هتصلحه في درس العلاج.
      - kind: aside
        tone: joke
        text: "الكلية في أول السكر زي الموظف الجديد المتحمس: بيشتغل 150% أول سنتين، وبعد 15 سنة تلاقيه عامل burnout وماسك ورقة proteinuria."
      - kind: try
        items: [neph.L13.011, neph.L13.012, neph.L13.013, neph.L13.014, neph.L13.015]
    recap:
      - "Hyperfiltration = GFR 120-180 أو أكتر من 2 SD فوق المتوسط؛ سببه ضغط عالي جوه الـ glomerulus."
      - "بيحصل خلال 1-5 سنين من الـ T1DM؛ 70% من الـ T1DM و50% من الـ T2DM."
      - "أربع طرق: hemodynamic، RAAS، inflammation (AGEs)، oxidative stress."
      - "الـ NaCl القليل عند الـ macula densa بيفتح الـ afferent؛ الـ SGLT2 inhibitor بيصلّحه."
    practice: [neph.L13.011, neph.L13.012, neph.L13.013, neph.L13.014, neph.L13.015, neph.L13.016]
