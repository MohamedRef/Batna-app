        text: |
          **Myeloid leukocytosis** مش مفهومة + **splenomegaly** ← اعمل:
          1. ==LAP== (leukocyte alkaline phosphatase)
          2. **Bone marrow** + **cytogenetics**

          الـ **Ph1** بيأكد التشخيص. لو مش موجود ← دوّر على ==BCR/ABL== بالـ molecular tests.

          ليه نكمّل لو الـ Ph1 مش باين؟ التفسير المقبول (مش في الكتاب): الـ cytogenetics بتشوف الكروموزوم تحت الميكروسكوب، فلو الحتة اللي اتنقلت صغيرة أو مستخبية، الكروموزوم يبان طبيعي والجين الهجين موجود. الـ molecular test بيدوّر على الجين نفسه، فبيلقطه.
