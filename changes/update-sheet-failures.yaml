# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: لو التحميل أو التثبيت فشل، شاشة «إيه الجديد؟» بقت بتقول إيه اللي حصل وليه، مش «فيه نسخة جديدة»
  en: When a download or install fails, the What's new sheet now says what happened and why
- kind: improved
  ar_eg: لو أندرويد محتاج إذن التثبيت، زرار «افتح الإذن» بقى جنب «جرّب تاني» في الشاشة نفسها
  en: When Android needs the install permission, «Open permission» sits beside «Try again» in the sheet
- kind: improved
  ar_eg: تحديث فشل بيفضل ظاهر فوق في الرئيسية لحد ما ينجح أو تقفله
  en: A failed update stays on Today until it works or you close it
