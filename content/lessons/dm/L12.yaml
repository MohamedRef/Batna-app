      - kind: match
        page: 147
        quote: "Targeted therapy"
        prompt: "وصّل كل targeted drug باللي بيوجّهه في الـ figure"
        pairs:
          - ["GLP-1 RA", "HbA1c, CGM"]
          - ["Nonsteroidal MRA", "Urine ACR"]
          - ["DHP CCB or diuretic", "BP"]
          - ["Antiplatelet agent", "ASCVD risk, lipids"]
        why: "وبعدهم: other glucose-lowering drugs، **steroidal MRA** للـ resistant HTN لو eGFR ≥45، وezetimibe أو PCSK9i أو icosapent ethyl."
      - kind: aside
        tone: exam
        page: 147
        quote: "First-line drug therapy"
        text: "أرقام الـ first-line drug therapy بتتسأل: الـ **SGLT2i** تبدأه من eGFR ==≥20== وتكمّله لحد الـ dialysis أو الـ transplant، والـ **metformin** لو eGFR ==≥30==. والـ steroidal MRA لو eGFR ≥45 بس."
      - kind: figure
        page: 148
        quote: "Nephroprotective Effect of SGLT2 Inhibitors"
        title: "طرفين للـ glomerulus"
        alt: "A glomerulus with an afferent arteriole on the left and an efferent arteriole on the right. On the left, SGLT2 inhibition sends more sodium to the macula densa, adenosine rises and the afferent arteriole narrows. On the right, RAAS blockade widens the efferent arteriole. Both lower intraglomerular pressure."
        caption: "الـ SGLT2i ==بيقفل الـ afferent== (sodium ← macula densa ← adenosine)، والـ RAAS blockade ==بيفتح الـ efferent==. الاتنين بيقللوا الـ intraglomerular pressure والـ hyperfiltration."
