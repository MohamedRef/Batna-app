      - kind: check
        page: 17
        quote: "1. Randomization\nThe best method to minimize the effect of confounders in planning phase\nAll study population will be randomly distributed into two groups, experimental group and control group\nIt help to distribute both known and unknown confounders equal in both groups"
        question: "Which method balances unknown confounders between groups?"
