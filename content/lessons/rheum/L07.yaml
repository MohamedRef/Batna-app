          التفسير المقبول (مش في الكتاب): الفرق الوحيد هو **مين بيمسك العدو**. الـ C1q محتاج antibody، والـ MBL بيمسك **mannose** متكرر على سطح الميكروب مباشرة، وده نوع من الـ **PAMPs** اللي اتكلمنا عنها في المحاضرة 6. فالـ lectin بيدّي الـ classical قوة من **أول يوم**، قبل ما يبقى فيه antibodies.
