      - kind: explain
        page: 124
        quote: "should receive antiviral treatment as early as possible regardless of ALT levels. Severe hepatitis and hepatic failure can develop in 25% to 50%"
        title: "الـ flare وعلاج الـ reactivation"
        text: |
          - ==Clinical hepatitis flare==: ALT ≥ 3 × baseline و > 100 U/L.
          - **Treatment**: الـ immunosuppressed اللي عمل reactivation ياخد antiviral treatment as early as possible، ==regardless of ALT levels==.

          ليه الاستعجال؟ **Severe hepatitis and hepatic failure** بيحصلوا في 25–50% من الـ HBV reactivation. والتفسير المقبول إن الـ DNA بيطلع قبل الـ ALT، فلو استنيت الـ ALT تكون اتأخرت.
      - kind: aside
        tone: trap
        page: 124
        quote: "Treatment of reactivation Immunosuppressed patients who develop HBV reactivation should receive antiviral treatment as early as possible regardless of ALT"
        text: |
          الـ ALT طبيعي ≠ استنى. في الـ reactivation الكتاب بيقول **regardless of ALT levels**. لو استنيت الـ flare تكون اتأخرت.
      - kind: explain
        page: 124
        quote: "Vaccinated: - Anti HBs Ab > 10 mIU/ml no treatment. - Anti HBs Ab < 10 mIU/ml HBIG + booster dose."
        title: "وخزة إبرة (post-exposure prophylaxis)"
        text: |
          أول سؤال: الشخص اللي اتشك متطعّم ولا لأ؟

          - **Vaccinated**: anti-HBs > 10 mIU/mL → no treatment. أقل من 10 → ==HBIG + booster dose==.
          - **Not vaccinated**: اعمل HBsAg، anti-HBc، anti-HBs. anti-HBs > 10 → no treatment. أقل من 10 → ==HBIG + vaccinate==.

          الفكرة: الـ HBIG بيدي حماية جاهزة فورًا، والـ vaccine بيعلّم الجسم يحمي نفسه بعدين.

          - **Timing**: الـ vaccine في أسرع وقت و not later than 7 days. الـ HBIG within 72 hours.
          - **Follow-up**: HBsAg و anti-HBc IgM عند 6، 12، و 24 weeks.
