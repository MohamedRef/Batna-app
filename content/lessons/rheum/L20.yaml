            <text x="22" y="394" class="t-sm t-mut">→ abatacept, guselkumab; JAKi</text>
          </svg>
      - kind: explain
        page: 341
        title: "الـ mild والبدايل"
        quote: "Alternatives to MTX for the peripheral arthritis include LEF; 20 mg daily) and SSZ. However, unlike MTX, which is also effective for psoriasis in some patients, LEF is less helpful than MTX for the skin disease."
        text: |
          **Mild peripheral arthritis** = أقل من **4 مفاصل**، ==مفيش damage في الأشعة==، وأقل discomfort. ابدأ بـ **NSAID**.

          - **Apremilast 30 mg مرتين** بديل ممكن يبقى **أأمن** للي عندهم comorbidities كتير.
          - لو النشاط مكمّل أو moderate-severe **من غير erosions** ومن غير axial ← **cDMARD**، غالبًا **MTX 15–25 mg أسبوعيًا** (مش biologic).
          - بدايل الـ MTX: **LEF 20 mg** و **SSZ**. بس الـ LEF ==أقل فايدة للجلد== من الـ MTX، علشان كده الـ MTX بيفضل الأول لو الصدفية مهمة.
          - الـ **apremilast** بديل كمان، **بس مش في الـ erosive disease** لأن قدرته على منع الـ joint injury مش متثبتة.
      - kind: case
        page: 341
        quote: "In patients whose joint counts do not improve after 3 months of treatment with a cDMARD (ex, MTX), or who still have more than three tender and swollen joints, use a TNF inhibitor."
        stem: "PsA, 5 swollen joints, no erosions, no back pain. NSAIDs failed."
        steps:
          - question: "Next?"
            options: ["MTX 15–25 mg weekly", "Etanercept", "Hydroxychloroquine", "Apremilast because he has erosions"]
            answer: 0
            why: "NSAID failure من غير erosions ومن غير axial ← conventional DMARD (cDMARD)، غالبًا MTX."
          - reveal: "3 months later: 4 tender and swollen joints."
            question: "Next?"
            options: ["TNF inhibitor", "Increase NSAID", "Add hydroxychloroquine", "Wait 6 more months"]
            answer: 0
            why: "مفيش تحسن بعد 3 شهور أو أكتر من 3 مفاصل ← TNF inhibitor."
          - reveal: "Adalimumab for 4 months: inadequate response."
            question: "Next?"
            options: ["Etanercept", "Golimumab", "Abatacept first", "Stop all"]
            answer: 0
            why: "تاني TNF، وبدّل من antibody لـ soluble receptor (etanercept). الـ golimumab antibody زي الـ adalimumab."
      - kind: check
        page: 341
        quote: "Another alternative to MTX is apremilast, which should not be used in patients with erosive disease, as its capacity to prevent joint injury has not been established."
        question: "Why avoid apremilast in erosive PsA?"
        options:
          - "Its ability to prevent joint damage is not established"
          - "It worsens psoriasis"
          - "It is an IV drug"
          - "It is a TNF inhibitor"
        answer: 0
        why:
          - "صح: مفيش إثبات إنه بيمنع الـ joint injury."
          - "اللي بيزوّد الصدفية الـ antimalarials."
          - "الـ apremilast oral."
          - "ده PDE-4 inhibitor."
      - kind: explain
        page: 342
        title: "بعد التاني"
        quote: "In patients without an adequate response to secukinumab (cosentyxs), use ustekinumab (stelara) (by sc.i. 45 mg, given initially and 4 weeks later, then every 12 weeks. Either of these agents may be given with or without MTX."
        text: |
          - لو تاني TNF فشل ← ==secukinumab==: **150 mg** subcutaneous (SC) أسابيع 0، 1، 2، 3، 4، وبعدين كل **4 أسابيع** (ممكن **300 mg**).
          - فشل ← **ustekinumab**: **45 mg** SC في 0 و 4، وبعدين كل **12 أسبوع**. (الاتنين مع أو من غير methotrexate (MTX).)
          - بعدها: **abatacept** أو **guselkumab**؛ و الـ **JAK inhibitors** (tofacitinib على Janus kinase 3 (JAK3) و Janus kinase 1 (JAK1)).
          - اختيار الـ TNF نفسه: route، frequency، cost.
          - **Axial** فشل أول TNF ← تاني TNF ← secukinumab أو ustekinumab.

          يعني الترتيب كله منطقه واحد: لما الـ TNF pathway يفشل مرتين، تنقل لـ pathway تاني في نفس الـ IL-23 axis (IL-17 بعدين IL-12/23).
      - kind: reveal
        page: 342
        quote: "It is preferred to switch from one of the antibody- based agents (eg, infliximab, adalimumab, golimumab, or certolizumab) to the soluble TNF receptor (etanercept) and vice versa."
        prompt: "لو أول TNF inhibitor فشل، ليه الكتاب بيقول جرّب TNF تاني قبل ما تغيّر الـ class، وليه من antibody لـ receptor؟"
        answer: |
          الكتاب بيقول: أول TNF فشل ← ==TNF تاني== مش class جديد، ويفضّل تنقل من **antibody** (infliximab، adalimumab، golimumab، certolizumab) لـ **soluble receptor** (etanercept) أو العكس. ولو التاني فشل ← secukinumab، بعده ustekinumab.

          التفسير المقبول (مش في الكتاب): الفشل مع أول TNF ساعات بيكون من الدوا نفسه (زي antibodies ضد الدوا) مش من إن الـ TNF مش مهم. والـ antibody والـ receptor مختلفين في التركيب وطريقة الربط، فالنقلة بينهم بتدّي فرصة حقيقية. ولو اتنين TNF فشلوا، يبقى غالبًا الـ pathway التاني (IL-17 أو IL-23) هو اللي شغال.
