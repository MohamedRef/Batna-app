  - id: neph.L07.173
    kind: mcq
    topic: alport
    stem: A 17-year-old boy has microscopic hematuria since early childhood, proteinuria 2.8 g/day, BP 145/95 and high-tone hearing loss. His maternal uncle is on dialysis. Most likely diagnosis?
    options:
      - X-linked Alport syndrome
      - Thin basement membrane nephropathy
      - IgA nephropathy
      - ADPKD
      - Fabry disease
    answer: 0
    why:
      - "Correct: hematuria, proteinuria and hypertension by adolescence, deafness, and an affected maternal uncle (X-linked) (p179)."
      - TBMN rarely causes proteinuria, hypertension or deafness.
      - IgA nephropathy does not cause deafness or this family pattern.
      - ADPKD causes cysts and is autosomal dominant, without deafness.
      - Fabry causes pain crises, angiokeratomas and corneal opacities, not deafness from childhood with hematuria.
    src: { page: 179, quote: "Both present with persistent microscopic haematuria. This occurs earlier in Alport's no haematuria by age 10 in a ' makes the diagnosis unlikely. Alport's: proteinuria (often nephrotic range) and ↑ BP usually present by adolescence. Progressive CKD → ESRD by the 3rd to 4th decade (~2% of an ESRD programme). Severity is often consistent within a family. High-tone sensorineural deafness (in the majority) and anterior lentico-nus (conical, rather than spherical, lens, leading to distorted vision: ~20%)." }
    status: unverified
  - id: neph.L07.174
    kind: mcq
    topic: alport
    stem: A man with X-linked Alport syndrome gets a deceased-donor kidney. Months later he develops rapidly progressive GN with linear IgG on the graft. What happened?
    options:
      - De novo anti-GBM disease against donor α5(IV) collagen
      - Recurrence of Alport syndrome in the graft
      - BK virus nephropathy
      - Calcineurin inhibitor toxicity
      - IgA nephropathy recurrence
    answer: 0
    why:
      - "Correct: under 5% develop anti-GBM antibodies to the donor α5 chain seen as non-self (p185)."
      - Alport is a genetic defect of his own kidneys; it does not recur in a normal graft.
      - BK nephropathy does not cause linear IgG and RPGN.
      - CNI toxicity does not cause crescentic GN with linear IgG.
      - IgA recurrence gives mesangial IgA, not linear IgG.
    src: { page: 185, quote: "Transplantation and Alport syndrome In <5%, transplanted Alport patients may develop de novo anti-GBM anti-bodies that cause an RPGN; i.e. donor a5 type IV collagen is recognized as non-self. It is not a contraindication to transplantation." }
    status: unverified
  # ---------- p186-193: Fabry disease ----------
  - id: neph.L07.175
    kind: card
    topic: fabry
    front: What is the enzyme defect in Fabry disease, and what accumulates?
    back: Deficiency of α-galactosidase A, with intracellular accumulation of neutral glycosphingolipids (Gb3) with terminal α-linked galactosyl groups.
    src: { page: 186, quote: "Introduction Fabry disease is caused by hereditary deficiency of the enzyme a- galactosidase A (a-Gal A), resulting in the intra cellular accumulation of neutral glycosphingolipids with terminal a-linked galactosyl moieties (Fig. 46.10). Clinically, this leads to progressive CKD, pain crises, sweat-ing abnormalities, vascular cutaneous lesions, and cardiac and eye abnormalities." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.176
    kind: enumerate
    topic: fabry
    prompt: Mention the clinical features of Fabry disease.
    points:
      - Progressive CKD
      - Pain crises and acral paresthesias
      - Sweating abnormalities (hypohidrosis)
      - Vascular skin lesions (angiokeratomas)
      - Cardiac abnormalities
      - Eye abnormalities (corneal verticillata)
    pass: 5
    hook: "Fabry في 6 كلمات: «كلية، ألم، عرق، جلد، قلب، عين» = progressive CKD، pain crises وacral paresthesias، hypohidrosis، angiokeratomas، cardiac abnormalities، وcorneal verticillata."
    src: { page: 186, quote: "Introduction Fabry disease is caused by hereditary deficiency of the enzyme a- galactosidase A (a-Gal A), resulting in the intra cellular accumulation of neutral glycosphingolipids with terminal a-linked galactosyl moieties (Fig. 46.10). Clinically, this leads to progressive CKD, pain crises, sweat-ing abnormalities, vascular cutaneous lesions, and cardiac and eye abnormalities." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.177
    kind: card
    topic: fabry
    front: Which gene causes Fabry disease, where is it, and who is worst affected?
    back: GLA on the X chromosome (over 500 mutations). Hemizygous males have severe disease; heterozygous females a variable, usually milder course.
    src: { page: 187, quote: "More than 500 mutations causing Fabry disease have been identified in GLA, the gene for a-Gal A, which is located on the X chromosome.\nGlycosphingolipids are normal constituents of the plasma membrane, the membranes of intracellular organelles, and circulate in association with apolipoproteins. The neutral glycosphingolipids that accumulate in Fabry disease are identical to those found in normal tissue. All tissues\nClinical manifestations Fabry disease is a multisystem disorder, with prominent and potentially devastating involvement of the kidneys, heart, and peripheral and central nervous systems. As expected for an X-linked disorder, severe clinical manifestations occur in hemizygous males, whereas heterozygous females have a variable but typically less severe course." }
    status: unverified
  - id: neph.L07.178
    kind: card
    topic: fabry
    front: How does Fabry disease start in boys, and how does it usually end?
    back: Paresthesias and pain in the hands and feet with episodic pain crises in childhood and early adolescence. ESRD in the 3rd–6th decade; myocardial or cerebral infarction are typical terminal events.
    src: { page: 187, quote: "Fabry disease is a multisystem disorder, with prominent and potentially devastating involvement of the kidneys, heart, and peripheral and central nervous systems. As expected for an X-linked disorder, severe clinical manifestations occur in hemizygous males, whereas heterozygous females have a variable but typically less severe course. In affected males, the initial features of the disease are seen in childhood and early adolescence and consist of paresthesias and pain in the hands and feet with episodic pain crises. The course of the disease is variable but usually leads to ESRD in the third to sixth decade. Myocardial or cerebral infarctions are typical terminal events. Severe Fabry disease in a female reflects." }
    status: unverified
  - id: neph.L07.179
    kind: card
    topic: fabry
    front: How does Fabry nephropathy present?
    back: Mild to moderate proteinuria, sometimes microhematuria, from the third decade; nephrotic syndrome is unusual. Gradual decline with hypertension and ESRD by the 4th–5th decade; up to 10% of heterozygous women reach ESRD.
    src: { page: 188, quote: "Trating defect, the nephropathy of Fabry disease typically manifests as mild to moderate proteinuria, sometimes with microhematuria, begin-ning in the third decade although proteinuria in childhood is reported. Nephrotic syndrome is unusual. Urinary oval fat bodies, with a Maltese cross configuration when viewed with a polarizing microscope, are a result of the large amounts of glycosphingolipid in the urine (see Chapter 4, Fig. 4.2B). Deterioration of renal function is gradual, with hyperten-sion and ESRD developing by the fourth or fifth decade of life. Het-erozygous women typically have mild renal involvement but up to 10% may develop ESRD." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.180
    kind: card
    topic: fabry
    front: What urine finding is seen in Fabry disease?
    back: Oval fat bodies with a Maltese cross under polarized light, from large amounts of glycosphingolipid in the urine.
    src: { page: 188, quote: "Nephrotic syndrome is unusual. Urinary oval fat bodies, with a Maltese cross configuration when viewed with a polarizing microscope, are a result of the large amounts of glycosphingolipid in the urine (see Chapter 4, Fig. 4.2B). Deterioration of renal function is gradual, with hyperten-sion and ESRD developing by the fourth or fifth decade of life. Het-erozygous women typically have mild renal involvement but up to 10% may develop ESRD." }
    status: unverified
  - id: neph.L07.181
    kind: card
    topic: fabry
    front: What does light microscopy show in Fabry nephropathy?
    back: Enlarged glomerular visceral epithelial cells (podocytes) packed with small clear vacuoles of glycosphingolipid; vacuoles also in parietal and distal tubular cells and vessel walls; progressive glomerulosclerosis.
    src: { page: 188, quote: "(LM) Glomerular visceral epithelial cells are enlarged and packed with small, clear vacuoles that represent glycosphingolipid material (Fig. 46.11). Vacuoles also may be seen in parietal epithelial cells and the epithelial cells of the distal convoluted tubule and loop of Henle, but only rarely in mesangial cells, glomerular endothelial cells, or proximal tubular epithelial cells. There is progressive segmental and global glo-merulosclerosis. Vacuoles are also observed in endothelial cells and smooth muscle cells of arterioles and arteries." }
    status: unverified
  - id: neph.L07.182
    kind: card
    topic: fabry
    front: What is the EM hallmark of Fabry disease?
    back: "Lysosomal inclusions (myelin figures) in visceral epithelial cells: round concentric dense layers, sometimes parallel (\"zebra bodies\")."
    src: { page: 189, quote: "(EM) On EM, there are abundant inclusions within lysosomes, particularly within visceral epithelial cells (Fig. 46.12). The inclusions (myelin figures) are typically round, comprising concentric layers of dense material separated by clear spaces. The layers may be arranged in parallel (zebra bodies). Detachment of visceral epithelial cells from the underlying basement membrane may be observed. Inclusions are also observed in" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.183
    kind: enumerate
    topic: fabry
    prompt: Mention cardiac involvement in Fabry disease.
    points:
      - Coronary narrowing with angina, MI or heart failure
      - Left ventricular hypertrophy (may be early; may be isolated)
      - Arrhythmias from conduction system infiltration
      - Valvular lesions
    pass: 3
    hook: "قلب Fabry بـ 4 طبقات: «شرايين، عضلة، كهربا، صمامات» = coronary narrowing (angina، MI، heart failure)، LVH (ممكن بدري وممكن لوحده)، arrhythmias من conduction system infiltration، وvalvular lesions."
    src: { page: 190, quote: "Heart Glycosphingolipid accumulation in coronary artery endothelial cells and in the myocardium results in coronary artery narrowing, which may lead to angina, myocardial infarction, or congestive heart failure. Left ventricular hypertrophy (LVH) may be an early finding.42 Arrhyth- mias resulting from infiltration of the conduction system and valvular lesions also may occur. Certain missense mutations affecting a-Gal A may present as isolated LVH." }
    status: unverified
  - id: neph.L07.184
    kind: card
    topic: fabry
    front: Which cerebral circulation is preferentially involved in Fabry disease, and when do symptoms start?
    back: The vertebrobasilar circulation, usually from the fourth decade (vertigo, diplopia, dysarthria, ataxia, hemiparesis).
    src: { page: 190, quote: "Nervous system Autonomic dysfunction is a prominent feature of Fabry disease, typi-cally manifested by hypohidrosis, acral paresthesias and pain, and altered intestinal motility. Cerebrovascular symptoms (secondary to narrowing of the vascular lumen from accumulation of glycosphingolipid in vas-cular endothelial cells) tend to appear during the fourth decade and include hemiparesis, vertigo, diplopia, dysarthria, nystagmus, nausea and vomiting, headache, ataxia, and memory loss. The vertebrobasilar circulation is preferentially involved. Symptoms are often recurrent. Life-threatening intra cerebral hemorrhage and infarction are not unusual." }
    status: unverified
