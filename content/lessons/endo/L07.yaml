  - id: endo.L07.lesson2
    title: "الـ myxedema coma: لما الجسم يدخل بيات شتوي"
    hook: "مش لازم يكون في غيبوبة. كفاية واحدة كبيرة، بردانة، بطيئة، ودواها في الدرج مقفول."
    minutes: 10
    pages: [113, 115]
    topics: [myxedema]
    goals:
      - "تعرف التعريف والـ clues"
      - "تفهم ليه الـ sodium والسكر بيقعوا"
      - "تكتب العلاج بالجرعات والأولويات"
    status: unverified
    steps:
      - kind: explain
        page: 113
        quote: "Myxedema Coma\n  Myxedema coma is a medical emergency with a high mortality rate.\n  It is defined as severe hypothyroidism with:\n    Depressed mental status.\n    Hypothermia.\n    Reduced function of other organs.\n  Early diagnosis of myxedema coma is important.\n  Myxedema means puffiness of the limbs and face which is due to abnormal deposits of mucin in the skin and other tissues."
        title: "التعريف"
        text: |
          ==Myxedema coma== = **severe hypothyroidism** مع:

          - Depressed mental status.
          - **Hypothermia**.
          - Reduced function of other organs.

          Medical emergency بـ mortality عالية، والتشخيص بدري مهم. و **myxedema** نفسها يعني انتفاخ الوش والأطراف من ترسّب الـ **mucin** في الجلد.

          التفسير المقبول (مش في الكتاب): الـ thyroid hormone هو اللي بيحدد سرعة الـ metabolism وإنتاج الحرارة في كل خلية، فلما يقل جامد كل عضو يبطّأ مع بعض: المخ، القلب، التنفس، والكلية. علشان كده التعريف فيه hypothermia و depressed mental status و organ failure في نفس الوقت.
      - kind: explain
        remind: [endo.L07.016, endo.L07.017]
        page: 114
        quote: "Clinical Features\n  A depressed mental state.\n  Bradycardia.\n  Hypothermia.\n  Hypotension (has prognostic significance).\n  Type 2 respiratory failure (↓ O2 and ↑ CO2).\n  Despite the name myxedema coma, patients present with:\n    Reduced consciousness.\n    Confusion.\n    Psychosis, etc."
        title: "الـ clues والصورة"
        text: |
          **Clues**: thyroid surgery، radioactive iodine، أو ==poor compliance== على الـ thyroxine.

          **الصورة**: depressed mental state، **bradycardia**، hypothermia، **hypotension** وليها prognostic significance، و **type 2 respiratory failure**.

          ورغم الاسم، أغلبهم بييجوا confused أو psychotic، **مش** في coma. يعني متستناش الـ coma علشان تفكّر فيها.
      - kind: reveal
        page: 114
        quote: "Clues to Myxedema Coma\n• Previous history of:\n– Thyroid surgery.\n– Administration of radioactive iodine.\n– Poor compliance to treatment with thyroid hormone."
        prompt: "ليه الـ clues التلاتة دي بالذات (surgery، radioactive iodine، poor compliance)؟"
        answer: "لأن التلاتة بيوصلوا لنفس النتيجة: مريض **مفيش عنده غدة شغالة**، وعايش على الـ thyroxine اللي بياخده. لو بطّل الدوا، مفيش حاجة تعوّض. التفسير المقبول (مش في الكتاب): الـ T4 الـ half-life بتاعه حوالي أسبوع، فالمريض بيتدهور ببطء على أسابيع، وغالبًا محدش بياخد باله لحد ما ييجي stress زي infection أو برد. علشان كده أول سؤال لأي مريض كبير بطيء وبردان: عملت عملية في الغدة؟ أخدت يود مشع؟ بتاخد الدوا بانتظام؟"
      - kind: figure
        page: 114
        quote: "Investigations\n  Hyponatremia is common and seen in at least 50% of the patients.\n  Any patient with a low serum sodium and normal volume status should be suspected of having an underactive thyroid.\n  Hypoglycemia is another common feature.\n  Blood should be drawn for\n    Thyroid stimulating hormone (TSH).\n    Free T4.\n    Cortisol."
        title: "الجسم في بيات شتوي"
        alt: "A body outline in the centre with labelled slowed systems: brain drowsy and confused, heart slow and low blood pressure, lungs retaining CO2, temperature low, kidneys holding water causing low sodium, liver giving low glucose."
        caption: "كل حاجة بتبطّأ. الـ hyponatraemia في 50% على الأقل، والـ hypoglycaemia شائعة."
        svg: |
          <svg viewBox="0 0 330 280" xmlns="http://www.w3.org/2000/svg">
            <circle cx="165" cy="40" r="22" class="fg-acc"/>
            <rect x="140" y="66" width="50" height="110" rx="20" class="fg-acc"/>
            <path d="M150 176L140 250M180 176L190 250" class="fg-ink" stroke-width="10"/>
            <text x="5" y="34" class="t-sm t-b">Brain</text>
            <text x="5" y="50" class="t-sm">drowsy, confused</text>
