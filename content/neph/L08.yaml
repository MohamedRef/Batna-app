    kind: card
    topic: histology
    front: Define a crescent.
    back: Extracapillary hypercellularity other than the epithelial hyperplasia of the collapsing variant of FSGS.
    src: { page: 215, quote: "Extracapillary hypercellularity other than the epithelial hyperplasia of collapsing variant of FSGS." }
    status: unverified
    tags: [high-yield]
  - id: neph.L08.028
    kind: card
    topic: histology
    front: Define fibrinoid necrosis.
    back: Lytic destruction of cells and matrix with deposition of acidophilic fibrin-rich material.
    src: { page: 215, quote: "Lytic destruction of cells and matrix with deposition of acidophilic fibrin- rich material." }
