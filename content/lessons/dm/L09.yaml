          - حذر مع الكبار اللي عندهم postural hypotension.
          - **وقّفه 3–4 أيام قبل العملية** (ketoacidosis و UTI، خصوصًا مع catheter).
          - ما تبدأوش في الـ critically ill في المستشفى، حتى مع AMI أو CKD.
