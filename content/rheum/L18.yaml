  # ---------- p301-302: definition, epidemiology, types ----------
  - id: rheum.L18.001
    kind: card
    topic: definition
    front: Define Sjögren syndrome.
    back: A chronic multisystem autoimmune rheumatic disease in which lymphocytes and plasma cells infiltrate exocrine glands, mainly the salivary and lacrimal glands, causing xerostomia and xerophthalmia.
    src: { page: 301, quote: "chronic multisystem autoimmune rheumatic disease, associated in the majority of cases with infiltration of exocrine glands, particularly the salivary and lacrimal glands" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L18.002
    kind: cloze
    topic: definition
    text: "In Sjögren syndrome the infiltrating cells are {{c1::lymphocytes and plasma cells}}, and the result is {{c2::xerostomia}} (dry mouth) and {{c3::xerophthalmia}} (dry eyes)."
    src: { page: 301, quote: "by lymphocytes and plasma cells , resulting in xerostomia and xerophthalmia." }
    status: unverified
  - id: rheum.L18.003
    kind: enumerate
    topic: definition
    prompt: Which systems can the systemic (life-threatening) features of Sjögren syndrome affect?
    points:
      - Neurological
      - Renal
      - Musculoskeletal
      - Dermatological
      - Hematological
      - Pulmonary
    pass: 4
    src: { page: 301, quote: "systemic features affecting the neurological, renal, musculoskeletal, dermatological , hematological, and pulmonary systems." }
    status: unverified
  - id: rheum.L18.004
    kind: cloze
    topic: definition
    text: "Sjögren syndrome affects {{c1::1–23}} persons per 10 000 in European countries and is {{c2::9–20}} times more common in females than males."
    src: { page: 301, quote: "affects 1–23 persons per 10 000 inhabitants in European countries. This autoimmune rheumatic disease is 9–20 times more common in females than males." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L18.005
    kind: cloze
    topic: definition
    text: "Sjögren syndrome is commonest between the ages of {{c1::30 and 60}}, but it is also described in younger and older groups."
    src: { page: 301, quote: "Although commonest between the ages of 30 and 60, it is also described in younger and older age groups." }
    status: unverified
    tags: [numbers]
  - id: rheum.L18.006
    kind: card
    topic: definition
    front: Define primary Sjögren syndrome.
    back: Sjögren syndrome in the absence of another autoimmune disease, with dry eyes (keratoconjunctivitis sicca) and dry mouth (xerostomia), together called the sicca syndrome.
    src: { page: 302, quote: "Primary Sjogren‘s syndrome (pSS) occurs in the absence of other autoimmune diseases and is characterized by keratoconjunctiva sicca (dry eyes) and xerostomia" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L18.007
    kind: card
    topic: definition
    front: What is the sicca syndrome?
    back: Dry eyes (keratoconjunctivitis sicca) plus dry mouth (xerostomia).
    src: { page: 302, quote: "keratoconjunctiva sicca (dry eyes) and xerostomia (dry mouth), collectively called the sicca syndrome." }
    status: unverified
  - id: rheum.L18.008
    kind: card
    topic: definition
    front: What is secondary Sjögren syndrome? Give the book's three examples.
    back: Sjögren syndrome occurring with another autoimmune disease, such as rheumatoid arthritis, systemic sclerosis or SLE.
    src: { page: 302, quote: "secondary Sjogren‘s syndrome presents along with other autoimmune diseases such as rheumatoid arthritis (RA), systemic sclerosis and systemic lupus erythematosus (SLE)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L18.009
    kind: mcq
    topic: definition
    stem: A 52-year-old woman with long-standing seropositive rheumatoid arthritis complains of gritty eyes and needing water to swallow bread. How is her dryness classified?
    options:
      - Secondary Sjögren syndrome
      - Primary Sjögren syndrome
      - Sicca from methotrexate toxicity
      - IgG4-related disease
      - Normal ageing of the glands
    answer: 0
    why:
      - "Correct: Sjögren features alongside another autoimmune disease (RA) is secondary Sjögren syndrome (p302)."
      - Primary Sjögren occurs in the absence of another autoimmune disease.
      - The book does not list methotrexate as a cause of sicca; her RA explains it.
      - IgG4-related disease is an exclusion criterion for Sjögren, not the label for sicca in RA.
      - Her age is within the commonest range for Sjögren (30–60); dryness with RA should not be dismissed.
    src: { page: 302, quote: "secondary Sjogren‘s syndrome presents along with other autoimmune diseases such as rheumatoid arthritis (RA), systemic sclerosis" }
    status: unverified
  # ---------- p302-303: pathogenesis ----------
  - id: rheum.L18.010
    kind: card
    topic: pathogenesis
    front: Which HLA types are associated with Sjögren syndrome, and which is linked to Sjögren with Raynaud phenomenon?
    back: The stronger association is with HLA-B8 (printed "D8") and DR3; DR4 is more closely linked to Sjögren with Raynaud phenomenon.
    src: { page: 302, quote: "there is a stronger association with HLA D8, DR3,although DR4 is more closely associated with syndrome occurring with Raynaud phenomenon." }
    status: unverified
  - id: rheum.L18.011
    kind: enumerate
    topic: pathogenesis
    prompt: Which viral triggers does the book list for Sjögren syndrome?
    points:
      - EBV
      - CMV
      - HCV
    pass: 3
    src: { page: 302, quote: "Environmental trigger Viral infection (EBV, CMV, HCV) Hormonal factors:" }
    status: unverified
  - id: rheum.L18.012
    kind: card
    topic: pathogenesis
    front: Which hormonal factor is associated with Sjögren syndrome?
    back: Estrogen and the female sex hormones.
    src: { page: 302, quote: "Associated with estrogen and female sex hormones." }
    status: unverified
  - id: rheum.L18.013
    kind: enumerate
    topic: pathogenesis
    prompt: List the tissue events in the pathogenesis of Sjögren syndrome.
    points:
      - Infiltration of target tissues by lymphocytes and plasma cells
      - Autoantibody (anti-Ro) production
      - Connective tissue proliferation
      - Glandular cell apoptosis
      - Atrophy of glandular structures (salivary, sebaceous, sweat glands)
      - Secondary changes and edema of the conjunctiva
    pass: 4
    src: { page: 302, quote: "Infiltration of target tissues by lymphocytes and plasma cells. - Autoantibody production (Anti-RO) production. - Connective tissue proliferation. - Glandular cell apoptosis." }
    status: unverified
  - id: rheum.L18.014
    kind: card
    topic: pathogenesis
    front: Which glands atrophy in Sjögren syndrome, per the book?
    back: Salivary glands, sebaceous glands and sweat glands.
    src: { page: 302, quote: "Atrophy of glandular structures in affected tissues (salivary glands, sebaceous glands, sweat glands)." }
    status: unverified
  - id: rheum.L18.015
    kind: card
    topic: pathogenesis
    front: In a genetically predisposed person with a trigger, what do glandular epithelial cells do first in Sjögren syndrome?
    back: They become deregulated and release chemokines and adhesion molecules, which bring dendritic cells and lymphocytes (T and B cells) into the glands.
    src: { page: 302, quote: "glandular epithelial cells become deregulated and release chemokines and adhesion molecules." }
    status: unverified
  - id: rheum.L18.016
    kind: cloze
    topic: pathogenesis
    text: "Dendritic cells in the glands produce high levels of {{c1::interferons}}, which retain and activate lymphocytes and stimulate production of {{c2::BAFF}}."
    src: { page: 303, quote: "Dendritic cells in the glands produce high levels of interferons (IFN), which causes further retention of lymphocytes in the tissues" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L18.017
    kind: card
    topic: pathogenesis
    front: What does BAFF do in Sjögren syndrome, and which cells make it?
    back: Made by epithelial cells, dendritic cells and T cells (under interferon), BAFF drives irregular B-cell maturation into autoimmune B cells that secrete autoantibodies locally.
    src: { page: 303, quote: "BAFF promotes irregular B-cell maturation, leading to the formation of autoimmune B-cells, which secrete autoantibodies locally." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L18.018
    kind: order
    topic: pathogenesis
    prompt: Put the steps of Sjögren pathogenesis in order.
    steps:
      - Genetic predisposition plus an environmental or hormonal trigger
      - Glandular epithelial cells release chemokines and adhesion molecules
      - Dendritic cells and T and B cells migrate into the glands
      - Dendritic cells produce high levels of interferon
      - Interferon stimulates BAFF production
      - BAFF drives autoimmune B cells that secrete autoantibodies locally
    src: { page: 303, quote: "Interferons stimulate the production of BAFF by epithelial cells, dendritic cells and T cells." }
    status: unverified
  - id: rheum.L18.019
    kind: mcq
    topic: pathogenesis
    stem: In the book's model of Sjögren syndrome, which cytokine links interferon to the formation of autoimmune B cells in the glands?
    options:
      - BAFF
      - IL-17
      - TNF-alpha
      - IL-6
      - TGF-beta
    answer: 0
    why:
      - "Correct: interferons stimulate BAFF, which promotes irregular B-cell maturation into autoimmune B cells (p303)."
      - IL-17 is not named in the book's Sjögren pathway.
      - TNF-alpha is not named in the book's Sjögren pathway.
      - IL-6 is not named in the book's Sjögren pathway.
      - TGF-beta is not named in the book's Sjögren pathway.
    src: { page: 303, quote: "Interferons stimulate the production of BAFF by epithelial cells, dendritic cells and T cells." }
    status: unverified
  # ---------- p303: glandular ----------
  - id: rheum.L18.020
    kind: enumerate
    topic: glandular
    prompt: List the oral (salivary) manifestations of Sjögren syndrome.
    points:
      - Dry mouth (xerostomia)
      - Parotitis, swelling of salivary glands
      - Cracked, peeling, atrophic lips
      - Dry fissured tongue
      - Oral candidiasis
      - Dental caries and loss of teeth
    pass: 4
