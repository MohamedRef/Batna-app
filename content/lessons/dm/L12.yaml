      - kind: explain
        page: 155
        title: "الـ SU والـ pioglitazone"
        quote: "The liver metabolizes these drugs .So, their duration of action may be prolonged in patients with CLD."
        text: |
          - **Sulfonylurea (SU)**: الكبد بيكسّره (liver metabolizes) ← ==duration of action prolonged==. في الـ decompensated ==avoid== لأن الجسم مش قادر يقاوم الـ hypoglycemia.
          - **Pioglitazone**: ليه دور في **non-alcoholic fatty liver disease (NAFLD)/non-alcoholic steatohepatitis (NASH)** (insulin sensitivity، وبيحسّن الـ histology والـ biochemistry). بس avoid في الـ decompensated وأي hepatic impairment، وما تبدأوش لو **alanine aminotransferase (ALT) >2.5 × upper limit of normal (ULN)**.
      - kind: reveal
        page: 156
        quote: "This is because patients may have a reduced ability to counteract\n    hypoglycemia."
        prompt: "ليه عيان الـ decompensated cirrhosis مش قادر يقاوم الـ hypoglycemia زي أي حد؟"
        answer: |
          الكتاب بيقول ==reduced ability to counteract hypoglycemia==، وده سبب منع الـ SU.

          التفسير المقبول (مش في الكتاب): لما السكر يوطى، الجسم الطبيعي بيرفعه من الكبد: يكسّر الـ **glycogen** المخزّن، ويعمل **gluconeogenesis**. الكبد المتليّف مخزونه قليل ومصنعه ضعيف، فالـ glucagon يطلب والكبد ما يردش. وفي نفس الوقت الـ SU نفسه بيقعد أطول لأن الكبد هو اللي كان بيكسّره. يعني hypo أطول من غير دفاع.
      - kind: check
        page: 156
        quote: "Therapy should not be initiated if there is evidence of active liver disease or if the serum ALT level exceeds 2.5 times ULN."
        question: "Diabetic with NASH, ALT 3 × ULN. Start pioglitazone?"
        options:
          - "No: ALT exceeds 2.5 × ULN"
          - "Yes: it treats NASH"
          - "Yes, at double dose"
          - "Only with metformin 3 g"
        answer: 0
        why:
          - "صح: الكتاب بيقول ما تبدأش لو ALT >2.5 × ULN أو active liver disease."
          - "دوره في الـ NASH ما يلغيش الـ ALT limit."
          - "مفيش double dose."
          - "والـ metformin max 1500 في الـ CLD."
      - kind: explain
        page: 156
        title: "الـ DPP-4i والـ GLP-1 RA والـ SGLT2i"
        quote: "In patients with decompensated CLD, there is no reported clinical experience& long-term studies demonstrating the efficacy and safety of DPP-4 inhibitors in diabetic patients with moderate to severe hepatic impairment. Hence, no dose recommendation is available for patients with advanced cirrhosis. However, no long-term studies are available demonstrating both the efficacy and safety of DPP-4 inhibitors or GLP-1 receptor agonists in T2DM patients with mild to severe CLD. Thus, caution is recommended, especially in patients with advanced cirrhosis, for whom the problem of effectively and safely controlling blood glucose is more crucial and most often requires insulin therapy."
        text: |
          - **Dipeptidyl peptidase-4 inhibitor (DPP-4i)**: في الـ decompensated مفيش clinical experience ولا long-term studies في الـ moderate–severe hepatic impairment، فـ ==no dose recommendation== في الـ advanced cirrhosis.
          - **DPP-4i أو GLP-1 receptor agonist (GLP-1 RA)** في أي درجة CLD: مفيش long-term studies عن الـ efficacy والـ safety، فالكتاب بيقول **caution**.

          النتيجة: الـ advanced cirrhosis ==most often requires insulin therapy==. ليه؟ لأن كل الأقراص يا إما بتتكسّر في الكبد، يا إما مالهاش دراسات، والـ insulin الوحيد اللي بتعرف تظبطه بالوحدة وتتابعه.
      - kind: case
        page: 155
        quote: "In patients with decompensated CLD, these drugs should be avoided."
        stem: "Type 2 DM with cirrhosis, Child-Pugh 10, on metformin 1 g twice daily and gliclazide. Recurrent hypoglycemia and ascites."
        steps:
          - question: "What about metformin?"
            options: ["Withdraw it (decompensation)", "Reduce to 1500 mg", "Keep it", "Raise it"]
            answer: 0
            why: "الـ 1500 mg للـ compensated بس. في الـ decompensation ← وقّفه."
          - question: "And the sulfonylurea?"
            options: ["Avoid it in decompensated CLD", "Switch to glimepiride", "Double it", "Keep at night"]
            answer: 0
            why: "مفعوله بيطوّل، والعيان مش قادر يقاوم الـ hypo."
          - question: "Best therapy now?"
            options: ["Insulin with close monitoring and frequent adjustment", "Pioglitazone with yearly liver tests", "Saxagliptin at the full usual dose", "Nothing; diet alone is enough now"]
            answer: 0
            why: "الـ insulin الأأمن والأقوى في الـ chronic liver disease (CLD)، والـ pioglitazone ممنوع في الـ decompensated."
