        prompt: "ليه الـ biosimilar لازم يتعمله تجارب كاملة، مع إن الـ generic بتاع الحبوب العادية مش محتاج؟"
        quote: "A biosimilar, unlike a ―biomimic‖ or ―biocopy,‖ which are medications"
        answer: |
          الكتاب: الـ **biosimilar** حسب الـ **WHO** = منتج **similar in terms of quality, safety and efficacy** لـ reference biotherapeutic مرخّص. وعلى عكس الـ ==biomimic أو biocopy==، ليه **نفس الـ primary amino acid sequence** وعدّى **rigorous analytic and clinical testing** مقارنة بالأصل. ومراجعة 2016 لـ **19 دراسة** على biosimilars للـ TNF inhibitors (infliximab، etanercept، adalimumab) أيدت الـ efficacy والـ safety.

          التفسير المقبول (مش في الكتاب): الحباية العادية **molecule صغيرة** بتتعمل بالكيميا، فنسختها بتطلع **متطابقة**. الـ biologic **protein كبير** بيتعمل في **خلايا حية**، وطريقة التصنيع بتغيّر طيّته والسكر اللي عليه حتى لو التسلسل واحد. عشان كده التسلسل لوحده مش كفاية، ولازم تجارب تثبت إنه **بيشتغل زي الأصل**. والـ biomimic اللي ما عدّاش الاختبارات دي ممكن يبقى أضعف أو يعمل antibodies ضده.
