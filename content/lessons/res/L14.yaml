- id: res.L14.lesson3
  title: 'الـ PPV والـ NPV: أقلق قد إيه من النتيجة؟'
  hook: عيانة جاتلك بـ screening positive وخايفة. تقولها إيه؟ الإجابة مش الـ sensitivity.
  minutes: 10
  pages: [17, 25]
  topics: [predictive]
  goals:
  - تحسب الـ PPV والـ NPV والـ prevalence والـ accuracy من الجدول
  - تفهم ليه الـ prevalence بتغيّر الـ PPV والـ NPV
  - تستخدم معادلة السلايد 25
  status: unverified
  steps:
  - kind: explain
    page: 17
    quote: |-
      Positive predictive value= probability of disease among patients with a positive test.
      Negative predictive value= probability of no test among patient with a negative test.
      When thinking about Predictive Value of a Test, ... imagine you are a physician discussing the results of a screening test with a patient.
      1) If the test was positive, how likely is it that he really has the disease? [How worried should he be?]
      2) If the test was negative, how likely is it that he really does NOT have it? [How reassured should he be?]
    title: سؤال العيان مش سؤال المعمل
    text: |-
      العيان مش بيسألك «الـ test ده sensitive قد إيه؟». بيسألك:

      1. «الـ test طلع **positive**، يا ترى عندي المرض فعلًا؟» (أقلق قد إيه؟) ده ==PPV==.
      2. «طلع **negative**، يا ترى أنا سليم فعلًا؟» (أطمّن قد إيه؟) ده ==NPV==.

      (السلايد كاتب «probability of no test»، والمقصود **no disease**.)
  - kind: figure
    page: 18
    quote: |-
      Disease status (gold standard)
      | Test | Positive | Negative | Total |
      |---|---|---|---|
      | Positive | a | b | a+b |
      | Negative | c | d | c+d |
      | Total | a+c | b+d | n |
      Positive predictive value (PPV) = a/(a+b)
      (proportion of test positives who are true positive)
      Negative predictive value (NPV) = d/(c+d)
      (proportion of test negatives who are true negative)
      Prevalence of disease = (a+c)/n
      (proportion of all individuals who have the disease, i.e. are positive)
      Diagnostic accuracy = (a+d)/n
      (proportion of study subjects among whom the test gives correct diagnosis)
    title: الـ predictive values بتتقري بالصف
    alt: 'The same two-by-two table with the rows outlined. The top row (test positive: 80 and 100) is labelled PPV 80/180;
      the bottom row (test negative: 20 and 800) is labelled NPV 800/820.'
    caption: الـ **sensitivity/specificity** بالعمود (الحالة الحقيقية)، والـ **PPV/NPV** بالصف (النتيجة اللي في إيد العيان).
