  - id: endo.L02.lesson7
    title: "Sheehan، الـ hypophysitis والـ DI: الـ pituitary حوالين الولادة"
    hook: "غدة كبيرة في أوضة ضيقة، ونزيف بعد الولادة. أو مناعة بتهاجمها. أو إنزيم من المشيمة بياكل الـ vasopressin."
    minutes: 8
    pages: [23, 24]
    topics: [hypophysitis-sheehan, di]
    goals:
      - "تفهم ليه الـ pituitary بتموت بعد الولادة، وتفرّق Sheehan's من lymphocytic hypophysitis"
      - "تعرف ليه أول علامة لـ Sheehan's هي إن اللبن مينزلش"
      - "تعرف ليه الـ desmopressin هو علاج الـ DI في الحمل"
    status: unverified
    steps:
      - kind: figure
        page: 24
        quote: "Placental estrogen → Lactotroph hyperplasia → Pituitary enlargement → Compression of blood supply of pituitary → Pituitary gland susceptible to ischemia\nOther paths to a pituitary gland susceptible to ischemia:\n  Severe postpartum hemorrhage → Severe hypotension/shock\n  Small sella size → Compression of enlarged pituitary\n  Disseminated intravascular coagulation\nPituitary gland susceptible to ischemia → Postpartum pituitary necrosis → Hypopituitarism → Worsening of hypopituitarism\nPituitary autoimmunity (antipituitary antibody positivity) (?) → Worsening of hypopituitarism"
        title: "رسمة الكتاب ص 24: ليه الـ pituitary بتموت بعد الولادة؟"
        image: { file: endo/L02-sheehan.webp, book: true }
        alt: "Book flowchart. Centre column from top: placental estrogen, lactotroph hyperplasia, pituitary enlargement, compression of blood supply of pituitary, then an oval, pituitary gland susceptible to ischaemia. Arrows into the oval: severe postpartum haemorrhage with severe hypotension or shock from top left, small sella size with compression of enlarged pituitary from top right, disseminated intravascular coagulation from the left. Below: postpartum pituitary necrosis, hypopituitarism, worsening of hypopituitarism; pituitary autoimmunity with a question mark adds to the worsening from bottom left."
        caption: |
          كل الأسهم بتصب في **البيضاوي اللي في النص**: ==pituitary gland susceptible to ischemia==.

          - **العمود اللي في النص فوق**: placental estrogen ← lactotroph hyperplasia ← **pituitary enlargement** ← الغدة بتضغط على الدم اللي جايلها.
          - **فوق يمين**: **small sella size**، الغدة الكبيرة متزنوقة.
          - **فوق شمال**: **severe postpartum hemorrhage** ← hypotension/shock. **شمال**: disseminated intravascular coagulation.
          - **تحت البيضاوي**: **postpartum pituitary necrosis** ← **hypopituitarism**، و **تحت شمال** الـ pituitary autoimmunity (بعلامة ؟) ممكن تزوّده.

          يعني ده ==Sheehan's==: غدة كبرت في أوضة ضيقة، وجه نزيف قطع عنها الدم.
      - kind: table
        page: 23
        quote: "The degree of hypopitutirism does not correlate with the degree of Hge. The initial clinical feature in post partum necrosis is failure to lactate; failure to resume normal menstrual periods is the clue for the diagnosis."
        title: "Sheehan's ولا hypophysitis؟"
        columns: ["", "Sheehan's", "Lymphocytic hypophysitis"]
        rows:
          - ["Cause", "PPH, hypotension + artery spasm", "Autoimmune inflammation"]
          - ["Timing", "After delivery; may show years later", "Late pregnancy or early puerperium"]
          - ["Clue", "Failure to lactate, then no periods", "DD: large prolactinoma"]
          - ["Treatment", "Replace hormones", "Corticosteroids"]
        hide: [[0, 1], [1, 2], [2, 1], [3, 2]]
      - kind: aside
        tone: exam
        page: 23
        quote: "The degree of hypopitutirism does not correlate with the degree of Hge. The initial clinical feature in post partum necrosis is failure to lactate; failure to resume normal menstrual periods is the clue for the diagnosis."
        text: "Sheehan's: درجة الـ hypopituitarism **مالهاش علاقة** بكمية النزيف، والـ **posterior pituitary** غالبًا سليمة، وأحيانًا الخصوبة بترجع."
      - kind: explain
        page: 23
        quote: "Postpartum Hge will lead to hypotension→ severe circulatory collapse & pituitary ischemia.\n  Hypotension along with vasospasm of the hypophysial artery is currently believed to compromise the arterial perfusion of the anterior pituitary.\n  The degree of hypopitutirism does not correlate with the degree of Hge. The initial clinical feature in post partum necrosis is failure to lactate; failure to resume normal menstrual periods is the clue for the diagnosis.\n  Years may pass before pituitary insufficiency is recognized following an ischemic insult, in some instances normal fertility is resumed.\n  Posterior pituitary is usually spared."
        title: "Sheehan's خطوة خطوة، وليه"
        text: |
          - **الميكانيزم (الكتاب):** النزيف بعد الولادة ← **hypotension** و circulatory collapse، ومعاه **vasospasm** في الـ hypophysial artery، فالـ anterior pituitary تتحرم من الدم.
          - **ليه هي بالذات؟** الرسمة اللي فاتت: الغدة كبرت في الحمل (lactotroph hyperplasia) جوه **sella صغيرة**، فبقت محتاجة دم أكتر وفي نفس الوقت مضغوطة. أي هبوط في الضغط يموّتها.
          - **أول علامة ==failure to lactate==**: لأن الـ lactotrophs هي اللي كانت كبرت أكتر واحدة وهي اللي ماتت، فالـ prolactin مينزلش واللبن ميجيش.
          - **الـ clue: ==failure to resume menses==**: يعني الـ gonadotrophs راحوا كمان.
          - **Posterior pituitary usually spared**: التفسير المقبول (مش في الكتاب): الـ posterior ليها دم من الـ inferior hypophyseal artery مباشرة، مش من الـ portal system اللي بيتقطع.
      - kind: explain
        page: 23
        quote: "Lymphocytic adenohypophysitis\n  Autoimmune inflammation, in late pregnancy or early purperium.\n  D.D: Large prolactin secreting adenoma.\n  Treatment: coticosteroids\n  Sequel: pituitary insufficiency."
        title: "الـ lymphocytic hypophysitis: المناعة مش النزيف"
        text: |
          ==Autoimmune inflammation== للـ anterior pituitary، في **آخر الحمل أو أول النفاس**.

          - **الـ DD: large prolactin-secreting adenoma.** ليه بيتلخبطوا؟ التفسير المقبول (مش في الكتاب): الالتهاب بيورّم الغدة فتبان كتلة كبيرة في الـ MRI، وكمان بيضغط على الـ stalk فالـ prolactin يعلى، فتشبه prolactinoma بالظبط.
          - **العلاج corticosteroids**: لأن المشكلة مناعية، فبنطفي الالتهاب.
          - **الـ sequel: pituitary insufficiency**: الخلايا اللي الالتهاب أكلها مش بترجع.

          الفرق المهم عن Sheehan's: هنا **مفيش نزيف**، والتوقيت ممكن يبقى **قبل** الولادة.
      - kind: explain
        page: 24
        quote: "Gestational DI is a rare endocrinopathy due to excessive vasopressinase activity."
        title: "الـ DI في الحمل"
        text: |
          - ==Gestational diabetes insipidus (DI)==: بسبب **vasopressinase** زيادة من المشيمة.
          - الـ mild DI ممكن يسوء، والـ asymptomatic تبقى symptomatic.
          - الـ pitressin tannate oil والـ lysine vasopressin (lypressin) spray بيتكسروا بالإنزيم، أما ==desmopressin لأ==.
          - Desmopressin آمن، إلا خطر صغير لـ uterine contractility (شبه الـ oxytocin).
          - الرضاعة تمام: كمية قليلة في اللبن، وامتصاصه من الـ gastrointestinal tract (GIT) ضعيف.

          ليه الـ DI بيبان في الحمل؟ التفسير المقبول (مش في الكتاب): المشيمة بتفرز الـ **vasopressinase**، والكمية بتزيد مع حجم المشيمة، فالـ vasopressin بيتكسر أسرع من ما الـ pituitary تعوّضه. الست اللي كان عندها DI خفيف أو احتياطي ضعيف هي اللي بتبان. وليه الـ desmopressin بيعدّي؟ لأن تركيبه متعدّل عن الـ vasopressin الطبيعي، فالإنزيم مش بيعرف يكسره.
      - kind: check
        page: 24
        quote: "Mild DI may worsen in pregnant patients, and asymptomatic women may become symptomatic during pregnancy. Patients treated with pitressin tannate oil and lysine AVP spray may also experience such worsening, but not with desmopressin since it is not degraded by vasopressinase."
        question: "Why does desmopressin still work in gestational DI?"
        options: ["Vasopressinase does not degrade it", "It increases vasopressinase", "It acts on the placenta", "It is given IV only"]
        answer: 0
        why:
          - "صح: الـ desmopressin مش بيتكسر بالـ vasopressinase."
          - "بالعكس، الإنزيم هو المشكلة."
          - "مش ده الميكانيزم."
          - "مش السبب."
      - kind: try
        items: [endo.L02.066, endo.L02.068, endo.L02.070, endo.L02.072, endo.L02.073]
    recap:
      - "Pituitary عرضة للـ ischaemia: غدة كبيرة (estrogen) + sella صغيرة + PPH/shock + DIC."
      - "Sheehan: hypotension + vasospasm؛ failure to lactate أول حاجة، no periods = clue؛ الدرجة مش بتتناسب مع النزيف؛ posterior سليمة؛ ممكن يبان بعد سنين."
      - "Hypophysitis: autoimmune آخر الحمل/أول النفاس؛ DD large prolactinoma؛ corticosteroids؛ sequel = insufficiency."
      - "Gestational DI = vasopressinase؛ pitressin و lysine AVP بيتكسروا، desmopressin لأ."
      - "Desmopressin آمن (خطر صغير لانقباض الرحم) والرضاعة مسموحة."
    practice: [endo.L02.066, endo.L02.067, endo.L02.068, endo.L02.069, endo.L02.070, endo.L02.071, endo.L02.072, endo.L02.073, endo.L02.074, endo.L02.075, endo.L02.076, endo.L02.116, endo.L02.117, endo.L02.118, endo.L02.130, endo.L02.132]
