  - id: res.L07.071
    kind: case
    topic: itt
    stem: >-
      100 patients with cerebrovascular disease are randomized to surgery plus aspirin (ASA) and 100 to ASA alone.
      In the surgery arm, 10 have a stroke before they can be operated on; of the 90 operated, 10 have a stroke. In the ASA arm, 20 have a stroke.
    steps:
      - question: What is the per-protocol stroke rate in the surgery arm?
        options: ["10/90 = 0.11", "20/100 = 0.20", "10/100 = 0.10", "20/90 = 0.22"]
        answer: 0
        why: Per protocol keeps only those who got surgery, so the 10 early strokes vanish from the numerator and denominator.
      - question: What does each analysis show, as relative risk reduction (RRR), per protocol and by intention-to-treat (ITT)?
        options: ["Per protocol RRR 0.45; ITT RRR 0", "Both show RRR 0.45", "Per protocol RRR 0; ITT RRR 0.45", "Both show no effect"]
        answer: 0
        why: Per protocol 0.11 vs 0.20 gives RRR 0.45; ITT counts everyone, 20/100 vs 20/100, so RRR 0.
      - question: Which one shows the underlying truth?
        options: [Intention to treat, Per protocol]
        answer: 0
        why: The ITT analysis suggests the true effect is zero; per protocol made surgery look good by dropping the sickest patients (Montori, CMAJ 2001).
    src: { page: 71, quote: "Per protocol analysis of the treatment group (surgery + acetylsalicylic acid [ASA]) includes only those patients who adhered to the protocol (in this case, those who received surgery); \"nonadherent\" patients (those who died before having the opportunity to undergo surgery) are excluded.\nWith this analysis, the event rate is 0.11 in the surgery + ASA arm and 0.20 in the control arm, which represents a relative risk reduction (RRR) of 0.45.\nThe intention-to-treat analysis, which counts all events in all randomized patients, shows equal event rates (0.20) in both arms and no risk reduction. This analysis suggests the underlying truth, a treatment effect of zero." }
    status: unverified
