  - id: neph.L03.lesson6
    title: "السلّم بالأرقام والـ diuretic resistance"
    hook: "العيان مش بيعمل بول رغم الـ furosemide. الـ resistance ليه خمس أسباب، وكل سبب ليه حل."
    minutes: 8
    pages: [78, 79]
    topics: [volume, resistance]
    goals:
      - "تمشي على Table 9 وتعرف إمتى تطلع درجة"
      - "تعد أسباب الـ resistance وتفهم كل واحد بيضرب فين"
      - "تعرف مين بيساعد (hypertonic saline) ومين لأ (dopamine)"
    status: unverified
    steps:
      - kind: table
        page: 78
        quote: "Table 9: Stepped Diuretic Algorithm Used in the CARRESS-HF and AVOID-HF Trials\n| Step | Current Diuretic Regimen: Furosemide Dose | Current Diuretic Regimen: Thiazide | Suggested Diuretic Regimen: Furosemide Dose (IV) | Suggested Diuretic Regimen: Metolazone |\n| 1 | ≤ 80 mg/day | +/- | 40 mg + 5 mg/h | 0 |\n| 2 | 81 - 160 mg/day | +/- | 80 mg + 10 mg/h | 5mg QD |\n| 3 | 161 - 240 mg/day | +/- | 80 mg + 20 mg/h | 5mg BID |\n| 4 | >240 mg/day | +/- | 80 mg + 30 mg/h | 5mg BID |"
        title: "Table 9: الـ stepped algorithm"
        columns: [Home furosemide, IV furosemide, Metolazone]
        rows:
          - ["≤80 mg/day", "40 mg + 5 mg/h", "0"]
          - ["81–160 mg/day", "80 mg + 10 mg/h", "5 mg QD"]
          - ["161–240 mg/day", "80 mg + 20 mg/h", "5 mg BID"]
          - [">240 mg/day", "80 mg + 30 mg/h", "5 mg BID"]
        hide: [[0, 1], [1, 1], [1, 2], [2, 1], [3, 1]]
      - kind: aside
        tone: tip
        page: 78
        quote: "The starting diuretic dose is determined by the outpatient or current inpatient diuretic dose, and the patient is moved to a higher diuretic dose if urine output is <3 l/day on the current dose. All loop diuretic doses are given in furosemide equivalents, although an alternative loop diuretic could be used. *A vasodilator or inotrope can be added for patients who have urine output <3 l/day despite Step 4 diuretic dosing."
        text: |
          الـ bolus تقريبًا ثابت (**40** وبعدين **80**)، والـ infusion بيطلع **5 ← 10 ← 20 ← 30 mg/h**. والـ metolazone: **0 ← once daily (QD) ← twice daily (BID) ← BID**.

          تطلع درجة لو البول أقل من **3 l/day**. ولو لسه أقل من 3 بعد **step 4** ← ضيف **vasodilator أو inotrope**.
      - kind: mnemonic
        page: 79
        quote: "Reduced protein binding of loop diuretics due to hypoalbuminemia and metabolic acidosis."
        word: "BEST R"
        parts:
          - { key: "B", text: "Binding reduced: hypoalbuminemia, metabolic acidosis" }
          - { key: "E", text: "Excess sodium intake" }
          - { key: "S", text: "Secretion reduced: organic acids block the transporter" }
          - { key: "T", text: "Thiazide and mineralocorticoid receptor remodelling: distal Na reabsorption" }
          - { key: "R", text: "Rebound sodium reabsorption as the effect wears off" }
        hook: "الـ diuretic مش **BEST** مع الـ **R**enal failure: خمس أسباب للـ resistance."
      - kind: explain
        page: 79
        quote: "Reduced tubular secretion of loop diuretics due to competitive inhibition of"
        title: "ليه كل سبب بيعمل resistance؟"
        text: |
          الكتاب بيعدّ أسباب الـ **diuretic resistance** (BEST R). التفسير المقبول (مش في الكتاب) لكل واحد:

          - **Rebound sodium reabsorption:** لما الدوا يخلص، الكلية بتمص صوديوم **زيادة** تعويض، **فـ** الكسب اليومي ممكن يروح. عشان كده بنكرّر الجرعة أو نعمل infusion.
          - **Excess sodium intake:** اللي بيدخل أكتر من اللي الدوا بيطلّعه، **يعني** مفيش نتيجة مهما زوّدت.
          - **Remodelling (thiazide/mineralocorticoid):** الـ distal nephron بيتضخّم من كتر الصوديوم اللي بيوصله، ويمص أكتر. **فـ** الحل thiazide أو MRA يقفلوه.
          - **Reduced secretion:** الـ furosemide لازم **يتفرز** في الـ proximal tubule علشان يوصل مكانه. الـ organic acids في الـ renal impairment بتزاحمه على نفس الـ transporter.
          - **Reduced binding:** الـ furosemide بيتنقل للكلية **مربوط بالـ albumin**. لو الـ albumin واطي، الدوا يتفرّق في الأنسجة ويوصل الكلية أقل.
