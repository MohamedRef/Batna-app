      - kind: explain
        page: 249
        title: "Case 6: السكر لما يوصل للآخر"
        quote: "Advanced Diabetic Nodular Glomerulosclerosis with a Possible Underlying Membranous Glomerulonephritis."
        text: |
          راجل **42 سنة**، DM و HTN مش متظبطين 7 سنين، و **severe proliferative retinopathy**. جه بـ nephrotic، creatinine وصل 8، و uACR 12000.

          قبل الـ biopsy: **SPEP** و **tumour markers** سلبيين، و 3 sessions ultrafiltration.

