  # ---------- p317: PET, survival ----------
  - id: neph.L09.103
    kind: card
    topic: pd-types
    front: What does the peritoneal equilibration test (PET) measure?
    back: The rate of equilibration of solutes (glucose, creatinine, urea) between peritoneal capillary blood and dialysate, as the dialysate/plasma (D/P) ratio at set times in the dwell.
    src: { page: 317, quote: "The PET peritoneal equilibration test: is to define the rates of the equilibration of solutes (e.g. glucose, creatinine and urea) between the peritoneal capillary blood and dialysate. The ratio of solute concentrations in dialysate and plasma (D/P ratio) at specific times (t) during the dwell signifies the extent of solute equilibration." }
    status: unverified
