    topic: pnh
    stem: Before starting eculizumab for PNH, which vaccine is essential?
    options:
      - Meningococcal vaccine
      - BCG
      - Hepatitis A vaccine
      - Yellow fever vaccine
      - Rotavirus vaccine
    answer: 0
    why:
