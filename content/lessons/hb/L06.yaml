          نفس شكل جدول الوزن، بس العمود التالت **Drug**:

          - **النص الأول: الـ glitazones**: Caldwell (troglitazone)، Acosta وShadid وPromrat (**pioglitazone**)، Sanyal (pioglitazone + vitamin E، **RCT**)، Tetri (rosiglitazone)، و**Belfort** (pioglitazone ± diet، **RCT**، 55 مريض). الـ **Histology** "+" في أغلبهم.
          - **النص التاني: metformin**: Marchesini، Nair، **Bugianesi** (في المربع الأزرق: **RCT**، 55 مريض، ALT + وHistology +)، Uygun (RCT، بس Histology **"-"**)، Duseja، Schwimmer (N/A).

