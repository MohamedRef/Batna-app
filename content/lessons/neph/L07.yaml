  - id: neph.L07.lesson9
    title: "نشخّص الـ ADPKD إزاي؟ السونار والجينات"
    hook: "3 أكياس في شاب تكفي، و 3 في واحد عنده 65 سنة ما تكفيش. وفي المتبرع، القصة بتتقلب: محتاجين نستبعد مش نثبت."
    minutes: 9
    pages: [154, 156]
    topics: [adpkd-dx]
    goals:
      - "تعرف مميزات وعيوب الـ presymptomatic screening ومين ما يتعملوش"
      - "تحفظ الـ ultrasound criteria وتفهم ليه العدد بيزيد مع السن"
      - "تعرف إمتى الـ MRI والـ genetic testing، وليه الـ PKD1 صعب"
    status: unverified
    steps:
      - kind: explain
        page: 154
        title: "نعمل screening؟"
        quote: "Only individuals who have been properly informed about the advantages and disadvantages of screening should be offered presymptomatic screening. If ADPKD is diagnosed, the patient should receive appropriate genetic counseling, and risk factors such as hypertension can be identified and treated early. If ADPKD is absent, the patient can be reassured. Disadvantages of presymptomatic screening relate to insurability and employability. Presymptomatic screening of children is not recommended until more effective therapy for the disease becomes available."
        text: |
          الـ screening بس للي **فاهم مميزاته وعيوبه**:
          - لو موجود: **genetic counseling**، ونعالج الضغط بدري.
          - لو مش موجود: نطمّنه.
          - العيوب: ==insurability و employability==.

          **الأطفال**: مش بنعملهم screening لحد ما يبقى فيه علاج أحسن. والأداة **ultrasound** علشان رخيص وآمن.

          ليه بنتردد في الـ screening؟ التفسير المقبول (مش في الكتاب): الـ screening بيفيد لو فيه حاجة نعملها بالنتيجة. في الكبير، فيه فايدة: ضغط بدري، تخطيط للعيلة، وتحويل لعلاج زي الـ tolvaptan. بس النتيجة ممكن تضرّه في التأمين والشغل، علشان كده القرار بتاعه هو بعد ما يفهم. وفي الطفل، هو مش قادر يختار، والعلاج مش هيتغير، فبنستنّى لحد ما يكبر ويقرر بنفسه.
      - kind: explain
        page: 154
        title: "ليه السونار، وليه الأطفال لأ؟"
        quote: "Renal ultrasound is used for presymptomatic testing because of cost and safety."
        text: |
          الكتاب بيقول الـ ultrasound بيتعمل ==because of cost and safety==، وإن الأطفال ما يتعملهمش screening **لحد ما يبقى فيه علاج أحسن**.

          التفسير المقبول (مش في الكتاب) للفكرة:
          - التشخيص في الكبير **بيغيّر حاجة**: تظبط ضغطه بدري، وتنصحه وراثيًا قبل ما يخلّف.
          - في الطفل اللي مالوش أعراض، التشخيص **ما بيغيّرش العلاج**، بس بيحطه في خانة "مريض" طول عمره (تأمين وشغل، زي ما الكتاب قال).
          - يعني الـ screening **قرار**، مش تحليل روتيني، وعلشان كده لازم الشخص يبقى فاهم المميزات والعيوب الأول.
      - kind: table
        page: 155
        quote: "The specificity and positive predictive value (PPV) of ultrasound are high using these criteria, but their sensitivity and negative predic-tive value (NPV) when applied to PKD2 patients age 15 to 59 are low. This is a problem in the evaluation of potential kidney donors, in which exclusion of the diagnosis is important. Different criteria have therefore been proposed to exclude a diagnosis of ADPKD in an indi-vidual at risk from a family with an unknown genotype. An ultrasound tainty in an at-risk individual younger than 30 years. A recent study of 73 affected and 82 nonaffected individuals suggested that finding fewer than five cysts by magnetic resonance imaging (MRI) is sufficient to exclude the diagnosis of ADPKD in potential living related kidney donors. 20 Contrast- enhanced computed tomography (CT) scanning with thin slices likely provides similar information, but this has not been proven."
        title: "Revised unified criteria (للتشخيص)"
        columns: [Age, Cysts on ultrasound]
        rows:
          - ["15–39", "≥3, one or both kidneys"]
          - ["40–59", "≥2 in each kidney"]
          - ["≥60", "≥4 in each kidney"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: mnemonic
        page: 154
        quote: "Renal Ultrasound Renal ultrasound is used for presymptomatic testing because of cost and safety. Revised criteria have been proposed to improve the diagnostic performance of ultrasound in ADPKD (Table 44.1). At least three (uni-lateral or bilateral) renal cysts are sufficient for diagnosis of at-risk individuals 15 to 39 years of age; two cysts in each kidney sufficient for diagnosis for ages 40 to 59 years.19 For at-risk individuals age 60 and older, four or more cysts in each kidney is required."
        word: "324"
        parts:
          - { key: "3", text: "Age 15–39: 3 cysts anywhere" }
          - { key: "2", text: "Age 40–59: 2 in each kidney" }
          - { key: "4", text: "Age 60+: 4 in each kidney" }
        hook: "الرقم **3 2 4**: الشاب عايز **3** في أي حتة، الكبير عايز **2 في كل كلية**، والعجوز **4 في كل كلية** (لأن الـ simple cysts بتزيد مع السن)."
      - kind: reveal
        page: 154
        quote: "For at-risk individuals age 60 and older, four or more cysts in each kidney is required."
        prompt: "ليه العدد المطلوب بيزيد مع السن؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ **simple cysts** العادية بتزيد مع السن عند أي حد، حتى من غير ADPKD (وده اللي الـ Table 7.6 بيقوله: simple cysts فوق 65).

          فلو شاب عنده 3 أكياس، ده غريب ويكفي للتشخيص. لكن واحد عنده 65 سنة ممكن يبقى عنده كيسين عاديين في كل كلية، فمحتاجين ==4 في كل كلية== علشان نبقى متأكدين إنه ADPKD مش سن.
      - kind: explain
        page: 155
        title: "المتبرع: محتاجين نستبعد"
        quote: "The specificity and positive predictive value (PPV) of ultrasound are high using these criteria, but their sensitivity and negative predic-tive value (NPV) when applied to PKD2 patients age 15 to 59 are low. This is a problem in the evaluation of potential kidney donors, in which exclusion of the diagnosis is important. Different criteria have therefore been proposed to exclude a diagnosis of ADPKD in an indi-vidual at risk from a family with an unknown genotype. An ultrasound tainty in an at-risk individual younger than 30 years. A recent study of 73 affected and 82 nonaffected individuals suggested that finding fewer than five cysts by magnetic resonance imaging (MRI) is sufficient to exclude the diagnosis of ADPKD in potential living related kidney donors. 20 Contrast- enhanced computed tomography (CT) scanning with thin slices likely provides similar information, but this has not been proven."
        text: |
          الـ ultrasound **specificity و positive predictive value (PPV) عالية**، بس الـ ==sensitivity والـ negative predictive value (NPV) واطيين في PKD2== من 15 لـ 59 سنة. ده مشكلة في **المتبرع القريب**: عايزين نستبعد المرض.

          الحل: **magnetic resonance imaging (MRI)**. لو فيه ==أقل من 5 cysts== على الـ MRI، المرض مستبعد في المتبرع.

          **Genetic testing** لما الـ imaging مش حاسم. الـ PKD1 **duplicated** فصعب على الـ exome؛ الـ sequencing المباشر بيجيب نتيجة في حوالي **90%**. وفيه **preimplantation genetic diagnosis (PGD)** مع الـ in vitro fertilization (IVF) لاختيار embryo سليم.

          ليه السونار مش كفاية في المتبرع؟ التفسير المقبول (مش في الكتاب): في الـ PKD2 الأكياس بتطلع متأخر وقليلة، فالشاب ممكن يبقى شايل المرض وسونارُه نضيف. السونار يقول "أيوه" بثقة، بس ما يقدرش يقول "لأ" بثقة. والمتبرع بالذات لازم نتأكد إنه **سليم**، لأن لو أخدنا كلية من شايل المرض هيفضل بكلية واحدة مريضة. علشان كده الـ MRI الأدق هو اللي بيحسم.

          وليه الـ genetic testing صعب في الـ PKD1؟ التفسير المقبول (مش في الكتاب): الـ PKD1 ليه نسخ شبهه (pseudogenes) على نفس الـ chromosome، فالجهاز اللي بيقرا الـ DNA بيتلخبط بين الجين الحقيقي والنسخ. علشان كده محتاج sequencing مخصوص للجين، ومش كل mutation بنلاقيها بنعرف هي بتعمل مرض ولا لأ. يعني الـ imaging لسه الأداة الأولى، والجينات للحالات الحائرة.
      - kind: explain
        page: 156
        title: "الـ genetic testing بالتفصيل"
        quote: "For diagnostic purposes, direct mutation screening by Sanger or next generation sequencing of the PKD1 and PKD2 genes is generally performed with multiplex-dependent probe amplification to identify larger rearrangements."
        text: |
          الكتاب بيقول الـ **PKD1 gene duplicated**، فالـ **whole-exome sequencing** ما بيفحصهوش كويس. التفسير المقبول (مش في الكتاب): فيه نسخ شبهه في الـ genome، فالجهاز بيلخبط بين الأصلي والنسخ.

          علشان كده الفحص المستعمل:
          - **Sanger** أو **next generation sequencing** للـ PKD1 والـ PKD2 مباشرة.
          - ومعاه **multiplex-dependent probe amplification** علشان يلقط الـ **rearrangements الكبيرة** اللي الـ sequencing بيفوّتها.
          - والـ **NGS panels** بقت أرخص وأسرع.
          - النتيجة مفيدة في حوالي ==90%==.

          و ==preimplantation genetic diagnosis (PGD)==: بعد الـ IVF، بيفحصوا **blastomere** واحدة من كل embryo، ويرجّعوا بس الـ embryos السليمة.
      - kind: case
        page: 155
        quote: "A recent study of 73 affected and 82 nonaffected individuals suggested that finding fewer than five cysts by magnetic resonance imaging (MRI) is sufficient to exclude the diagnosis of ADPKD in potential living related kidney donors."
        stem: "A 32-year-old wants to donate a kidney to his brother, who has ADPKD. The family's genotype is unknown. His ultrasound shows one small cyst."
        steps:
          - question: "Does a near-normal ultrasound exclude ADPKD here?"
            options: ["No: ultrasound sensitivity is low in PKD2 at this age", "Yes: fewer than 3 cysts excludes it", "Yes: one cyst is always a simple cyst", "No: only a biopsy can exclude it"]
            answer: 0
            why: "الـ ultrasound ==specificity عالية بس sensitivity واطية== في الـ PKD2 من 15 لـ 59. في المتبرع محتاجين نستبعد، والسونار مش كفاية."
          - question: "Next best test?"
            options: ["MRI: fewer than 5 cysts excludes ADPKD", "Repeat ultrasound in 10 years", "CT with contrast is proven better", "Kidney biopsy"]
            answer: 0
            why: "الكتاب: **أقل من 5 cysts على الـ MRI** يكفي يستبعد المرض في المتبرع. الـ CT غالبًا زيه بس ما اتثبتش."
          - reveal: "The MRI shows 8 cysts."
            question: "What now, if a precise answer is still needed?"
            options: ["Genetic testing of PKD1 and PKD2", "Accept him as a donor", "Whole-exome sequencing only", "Tolvaptan trial"]
            answer: 0
            why: "الـ genetic testing لما الـ imaging مش حاسم. والـ exome لوحده ضعيف في الـ PKD1 لأنه duplicated."
      - kind: try
        items: [neph.L07.057, neph.L07.060, neph.L07.064, neph.L07.065, neph.L07.067]
    recap:
      - "Screening بس للي فاهم: موجود = genetic counseling وعلاج الضغط بدري؛ مش موجود = طمأنة. العيوب: insurability و employability. الأطفال لأ."
      - "Ultrasound (رخيص وآمن): 15–39 ≥3 أكياس، 40–59 ≥2 في كل كلية، ≥60 ≥4 في كل كلية (الـ simple cysts بتزيد مع السن)."
      - "Specificity و PPV عاليين؛ sensitivity و NPV واطيين في PKD2 من 15 لـ 59: مشكلة المتبرع. MRI: أقل من 5 cysts = مستبعد."
      - "Genetic testing لما الـ imaging مش حاسم: PKD1 duplicated فالـ exome ضعيف؛ Sanger أو NGS + probe amplification؛ ~90% informative."
