    src: { page: 85, quote: "ISRCTN registry (International Standard Randomised Controlled Trial Number):\n  The ISRCTN registry is a primary clinical trial registry recognized by WHO that accepts all clinical research studies (whether proposed, ongoing or completed), providing content validation and the unique identification number necessary for publication.\n  All study records in the database are freely accessible and searchable.\n  ISRCTN supports transparency in clinical research, helps reduce selective reporting of results and ensures an unbiased and complete evidence base.\n  ISRCTN accepts all studies involving human subjects including studies in healthcare, social care, education, workplace safety and economic development.\n  The registry welcomes submissions in English from any location.\n  Studies should ideally be registered prospectively (before recruitment starts). ISRCTN also accepts studies registered retrospectively once they are underway or after completion." }
    status: unverified
  - id: res.L07.085
    kind: mcq
    topic: ethics
    stem: Which best describes equipoise as the rationale for a randomized trial of two drugs?
    options:
      - The drugs are known to be equally effective.
      - One of the drugs is known to be more toxic.
      - Neither drug is known to be more effective than the other.
      - One drug is more effective, but the other is easier to take with fewer side effects.
    answer: 2
    why:
      - If we already knew they were equal, there would be no question to test.
      - Known extra toxicity would make giving that drug unethical.
      - Genuine uncertainty about which is better is equipoise.
      - If one is known to be better, withholding it is unethical.
