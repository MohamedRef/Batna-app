items:
  # ---------- p116: CML definition, etiology, incidence, Ph ----------
  - id: hem.L08.001
    kind: card
    topic: cml-definition
    front: Define chronic myeloid leukemia (CML).
    back: An acquired malignant disease with overproduction of granulocytic cells, especially neutrophils, giving marked splenomegaly and very high white cell counts.
    src: { page: 116, quote: "It is an acquired malignant disease characterized by over production of cells of the granulocytic series, especially the neutrophilic series" }
    status: unverified
    tags: [high-yield]
  - id: hem.L08.002
    kind: card
    topic: cml-definition
    front: Besides neutrophilia, which two blood findings are common in CML?
    back: Basophilia and thrombocytosis.
    src: { page: 116, quote: "Basophilia and thrombocytosis are common." }
    status: unverified
  - id: hem.L08.003
    kind: cloze
    topic: cml-definition
    text: "The Philadelphia (Ph1) chromosome is present in the marrow cells in more than {{c1::95%}} of CML cases."
    src: { page: 116, quote: "the Philadelphia (Ph1) chromosome, is present in the bone marrow cells in more than 95% of cases" }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L08.004
    kind: card
    topic: cml-definition
    front: In which cells is the Ph1 chromosome found, and what does that tell you?
    back: In erythroid, myeloid and monocytic cells (rarely T lymphocytes) but not marrow fibroblasts; so the lesion lies close to the pluripotent stem cell.
    src: { page: 116, quote: "This distribution places the abnormality in CML close to the plaripotent stem cells." }
    status: unverified
  - id: hem.L08.005
    kind: card
    topic: cml-definition
    front: What is the known risk factor for CML?
    back: Usually none can be found; ionizing radiation increases the risk.
    src: { page: 116, quote: "Usually no etiologic agent can be incriminated in CML. Exposure to ionizing radiation increases the risk of subsequent CML." }
    status: unverified
  - id: hem.L08.006
    kind: cloze
    topic: cml-definition
    text: "Atomic bomb survivors (Japan, 1945) had more CML, peaking {{c1::5 to 12 years}} after exposure, and the risk seemed {{c2::dose related}}."
    src: { page: 116, quote: "with a peak occurring 5 to 12 years after exposure and seeming to be dose related" }
    status: unverified
  - id: hem.L08.007
    kind: cloze
    topic: cml-definition
    text: "CML is diagnosed in {{c1::1 or 2}} persons per 100,000 per year, with a slight {{c2::male}} preponderance; median age at diagnosis is {{c3::45 to 50}} years."
    src: { page: 116, quote: "1 or 2 persons per 100,000 per year with slight male preponderance. The median age at diagnosis is approximately 45 to 50 years." }
    status: unverified
    tags: [numbers]
  - id: hem.L08.008
    kind: card
    topic: bcr-abl
    front: How is the Ph1 chromosome formed?
    back: "A balanced translocation between the long arms of chromosomes 9 and 22; chromosome 22 loses more than it gains, so Ph1 is a shortened long arm of 22."
    src: { page: 116, quote: "The Ph1 chromosome results from a balanced translocation of material between the long arms of chromosomes 9 and 22." }
    status: unverified
    tags: [high-yield]
  # ---------- p117: BCR/ABL, PP2A ----------
  - id: hem.L08.009
    kind: cloze
    topic: bcr-abl
    text: "The break at band {{c1::q34}} of chromosome 9 moves the oncogene {{c2::c-ABL}} to the {{c3::breakpoint cluster region (bcr)}} of chromosome 22."
    src: { page: 117, quote: "allows translocation of the cellular oncogene C- AB1 to a position on chromosome 22 called the breakpoint cluster region (bcr)." }
    status: unverified
  - id: hem.L08.010
    kind: card
    topic: bcr-abl
    front: What does the BCR/ABL hybrid gene code for, and what does it do?
    back: A novel 210 kDa protein (P210), a tyrosine kinase that may trigger the uncontrolled proliferation of CML cells.
    src: { page: 117, quote: "The P210 protein is a tyrosine kinase may play a role in triggering the uncontrolled proliferation of (CML cells)." }
    status: unverified
    tags: [high-yield]
  - id: hem.L08.011
    kind: cloze
    topic: bcr-abl
    text: "According to the book, the BCR/ABL fusion gene is found in {{c1::25%}} of normal adults without CML."
    src: { page: 117, quote: "BCR/ABL fusion gene is found in 25% of normal adults without CML." }
    status: unverified
  - id: hem.L08.012
    kind: card
    topic: bcr-abl
    front: What is PP2A and what happens to it in CML?
    back: A phosphatase with tumour-suppressor activity; in blast crisis (not chronic phase) its activity is suppressed through BCR/ABL-induced expression of its inhibitor SET.
    src: { page: 117, quote: "PP2A activity is suppressed in blast crisis but not chronic phase CML cells through the BCR/ABL induced expression of its inhibitor, SET." }
    status: unverified
  - id: hem.L08.013
    kind: card
    topic: bcr-abl
    front: What does restoring PP2A activity do in CML?
    back: It inhibits BCR/ABL expression and activity, impairing both wild-type and T315I BCR/ABL leukemogenesis.
    src: { page: 117, quote: "Restoration of PP2A activity inhibits BCR/ABL expression/activity, hence impairing wild type and T315, BCR/ABL leukemogenesis." }
    status: unverified
  - id: hem.L08.014
    kind: card
    topic: bcr-abl
    front: Which drugs activate PP2A, and in which CML settings could this help?
    back: Forskolin (butyryl-forskolin, 1,9-dideoxy-forskolin); a possible strategy for blast crisis and imatinib-resistant CML.
    src: { page: 117, quote: "pharmacologic enhancement of PP2A represent a possible therapeutic strategy for last crisis and imatinib-resistant CML." }
    status: unverified
  - id: hem.L08.015
    kind: order
    topic: bcr-abl
    prompt: Put the molecular events of CML in order.
    steps:
      - "Balanced translocation between chromosomes 9 and 22 (break at 9q34)"
      - "c-ABL moves to the breakpoint cluster region on chromosome 22"
      - "Hybrid BCR/ABL gene forms"
      - "P210 tyrosine kinase is made"
      - "Uncontrolled proliferation of CML cells"
    src: { page: 117, quote: "The apposition of these two genetic sequences produce a new hybrid gene (BCR/ABL), which code for a novel protein" }
    status: unverified
  # ---------- p118-119: symptoms and signs ----------
  - id: hem.L08.016
    kind: card
    topic: cml-clinical
    front: How is CML often discovered, and what are its symptoms due to?
    back: Often in asymptomatic patients on routine tests; symptoms are nonspecific and due to anemia, spleen size or a raised basal metabolic rate.
    src: { page: 118, quote: "Symptomatology of CML usually nonspecific, is secondary to anaemia, spleen size or an increase basal metabolic rate." }
    status: unverified
  - id: hem.L08.017
    kind: enumerate
    topic: cml-clinical
    prompt: List the major symptoms of CML.
    points:
      - Fatigue
      - Weight loss
      - Malaise
      - Easy satiety
      - Left upper quadrant fullness
    pass: 4
    src: { page: 118, quote: "Fatigue, weigh loss, malaise, easy satiety and a sense of left upper quadrant fullness are the major symptoms of CML." }
    status: unverified
    tags: [high-yield]
  - id: hem.L08.018
    kind: card
    topic: cml-clinical
    front: Why can a CML patient bleed from the upper GIT?
    back: A raised blood histamine level, related to the basophil mass.
    src: { page: 118, quote: "An elevated blood histamine level (related to the hasophil cell mass) can cause upper GIT bleeding." }
    status: unverified
  - id: hem.L08.019
    kind: card
    topic: cml-clinical
    front: What can follow treatment of CML, and why?
    back: Acute gouty arthritis (from the uric acid released as cells are destroyed).
    src: { page: 118, quote: "Acute gouty arthritis may follow treatment." }
    status: unverified
  - id: hem.L08.020
    kind: card
    topic: cml-clinical
    front: When does priapism occur in CML?
    back: Occasionally, usually with marked leukocytosis or thrombocytosis.
    src: { page: 118, quote: "Priapism is occasionally noted, usually in patients with marked leukocytosis or thrombocytosis." }
    status: unverified
  - id: hem.L08.021
    kind: card
    topic: cml-clinical
    front: What are leukostatic symptoms in CML, and why do they happen?
    back: Dyspnea, drowsiness and TIA, from sludging of cells in pulmonary or cerebral vessels; more frequent in later stages.
    src: { page: 118, quote: "Leuckostatic symptoms such as dyppnea, drowsiness, TIA, which are due to sludging in the pulmonary or cerebral vessels" }
    status: unverified
  - id: hem.L08.022
    kind: enumerate
    topic: cml-clinical
    prompt: Which features are common in late-stage CML?
    points:
      - Headache
      - Bone pain
      - Arthralgia
      - Pain from splenic infarction
      - Fever
    pass: 4
    src: { page: 118, quote: "Headache, bone pain, artheralgia, pain from splenic infarction, and fever are common in late stages." }
    status: unverified
  - id: hem.L08.023
    kind: card
    topic: cml-clinical
    front: Is neutrophil function normal in CML?
    back: Usually yes.
    src: { page: 118, quote: "Neutrophil function is usually normal." }
    status: unverified
  - id: hem.L08.024
    kind: cloze
    topic: cml-clinical
    text: "{{c1::Splenomegaly}} is the most consistent physical sign of CML, found in more than {{c2::60%}}; the spleen may reach the {{c3::pelvic brim}}."
    src: { page: 118, quote: "Splenomegaly is the most consistent physical sign in CML occurs in more than 60% of cases." }
    status: unverified
    tags: [high-yield]
  - id: hem.L08.025
    kind: card
    topic: cml-clinical
    front: In CML, what do lymphadenopathy or skin infiltration suggest?
    back: Ph1-negative CML, or accelerated or blastic transformation (they are very uncommon in typical CML; hepatomegaly is also less common).
    src: { page: 119, quote: "If present, these findings suggest Ph1-negative CML, or accelerated or blastic transformation." }
    status: unverified
    tags: [high-yield]
  # ---------- p120: natural history, diagnosis, leukemoid table ----------
  - id: hem.L08.026
    kind: card
    topic: cml-course
    front: What is the usual end of CML, and what does it look like?
    back: All patients eventually change behaviour, most often a blast crisis, a picture resembling acute leukemia.
    src: { page: 120, quote: "All patients eventually develop a variety of changes in the behavior of the disease, most frequently there is ―a blast crisis‖" }
    status: unverified
  - id: hem.L08.027
    kind: enumerate
    topic: cml-course
    prompt: List the features of the accelerated phase of CML.
    points:
      - Increasing difficulty keeping WBC below 20,000/µL
      - Increasing splenomegaly and hepatomegaly
      - Infiltration of nodes, skin, bones or other tissues
      - Blasts 15–19% in blood or marrow
      - Basophilia 20% or more
    pass: 4
    src: { page: 120, quote: "blast cells (15 to 19%) in blood or BM, basophilia 20% or more. This last group of features, termed the accelerated phase" }
    status: unverified
    tags: [high-yield]
    update:
      text: "WHO 2022 dropped the accelerated phase (chronic and blast phase only, with high-risk features); ELN 2020 still defines it (blasts 15–29%, basophils ≥20%)."
      ref: "WHO Classification 5th ed. 2022; ELN CML recommendations 2020"
  - id: hem.L08.028
    kind: cloze
    topic: cml-course
    text: "The accelerated phase shows {{c1::15 to 19%}} blasts in blood or marrow and basophilia of {{c2::20% or more}}."
    src: { page: 120, quote: "the appearance of blast cells (15 to 19%) in blood or BM, basophilia 20% or more." }
    status: unverified
    tags: [numbers]
  - id: hem.L08.029
    kind: card
    topic: cml-diagnosis
    front: Unexplained myeloid leukocytosis with splenomegaly. Which tests should follow?
    back: A leukocyte alkaline phosphatase (LAP) test and bone marrow examination with cytogenetic analysis.
    src: { page: 120, quote: "The presence of unexplained myeloid leukocytosis with splenomegely should lead to a leukocyte alkaline phosphotase (LAP) test and bone marrow examination with a cytogenetic analysis." }
    status: unverified
    tags: [high-yield]
  - id: hem.L08.030
    kind: card
    topic: cml-diagnosis
    front: What establishes the diagnosis of CML, and what if Ph1 is not found?
    back: The Ph1 chromosome establishes it; if absent, look for molecular evidence of the hybrid BCR/ABL gene.
    src: { page: 120, quote: "When Ph1 chromosome is not found, molecular evidence for the presence of the hybrid BCR/AB/gene should be sought." }
    status: unverified
  - id: hem.L08.031
    kind: table
    topic: cml-diagnosis
    title: CML versus neutrophilic leukemoid reaction
    columns: [Feature, CML, Leukemoid reaction]
    rows:
      - [WBC per µL, ">50,000", "<50,000"]
      - [Toxic granulation, Negative, Positive]
      - [Basophilia, Present, Negative]
      - [LAP score, Weak or absent, Normal]
      - [Bone marrow, Blast cells, Normal]
      - [Effect of antibiotics, No response, Good response]
    blanks: [[0, 1], [1, 2], [2, 1], [3, 1], [5, 2]]
    src: { page: 120, quote: "Toxic granulation -ve +ve Baesophilia + -ve LAP weak or abscent normal" }
    status: unverified
    tags: [high-yield]
  - id: hem.L08.032
    kind: enumerate
    topic: cml-diagnosis
    prompt: From what must CML be differentiated?
    points:
      - Neutrophilic leukemoid reaction
      - Prolonged corticosteroid therapy
      - Agnogenic myeloid metaplasia
      - Polycythemia rubra vera with associated iron deficiency
    pass: 3
    src: { page: 120, quote: "Chronic myelagenous leukemia must be differentiated from" }
    status: unverified
  - id: hem.L08.033
    kind: mcq
    topic: cml-diagnosis
    stem: A 50-year-old man has a WBC of 140,000/µL with a full spectrum of myeloid cells, basophilia and a spleen 12 cm below the costal margin. No fever, no toxic granulation. Which result would most support CML over a leukemoid reaction?
    options:
      - A weak or absent LAP score
      - A high LAP score
      - Toxic granulation in neutrophils
      - Prompt fall in WBC after antibiotics
      - Normal bone marrow
    answer: 0
    why:
      - "Correct: LAP is weak or absent in CML and normal in a leukemoid reaction (p120)."
      - A high or normal LAP points to a leukemoid reaction (or PV).
      - Toxic granulation is positive in leukemoid reactions, negative in CML.
      - A good response to antibiotics fits a leukemoid reaction.
      - The marrow is normal in a leukemoid reaction; in CML it shows blast cells.
    src: { page: 120, quote: "Toxic granulation -ve +ve Baesophilia + -ve LAP weak or abscent normal" }
    status: unverified
  # ---------- p121: variants, evolution ----------
  - id: hem.L08.034
    kind: card
    topic: cml-variants
    front: How does Ph-negative CML differ from Ph-positive CML?
    back: It may lack basophilia and blasts, shows dysplastic features, and has inferior survival.
    src: { page: 121, quote: "It may lack basophilia, lack blast cells and it show dysplastic features. The survival is inferior to that of ph +ve." }
    status: unverified
  - id: hem.L08.035
    kind: card
    topic: cml-variants
    front: Describe chronic myelomonocytic leukemia (CMML) in the book.
    back: Elderly men; prominent monocytosis; thrombocytopenia common; no basophilia or eosinophilia; dysplastic changes usually present.
    src: { page: 121, quote: "It occurs in elderly men, monocytosis is prominent, thrombocytopenia is common, basophilia and eosinophilia are absent, dysplatic changes are usually present." }
    status: unverified
  - id: hem.L08.036
    kind: card
    topic: cml-variants
    front: Which CMML-like leukemia responds extremely well to low-dose imatinib?
    back: "The t(5;12) leukemia (ETV6–PDGFRB fusion), which has prominent eosinophilia but no basophilia."
    src: { page: 121, quote: "the t(5:12) leukaemias respond extremely well to low dose of imatinib." }
    status: unverified
  - id: hem.L08.037
    kind: card
    topic: cml-variants
    front: Describe chronic neutrophilic leukemia.
    back: An exceedingly rare disorder, usually found incidentally; raised neutrophils without immature granulocytes or basophilia; diagnosis largely by exclusion; may need no treatment.
    src: { page: 121, quote: "The patient has a raised neutrophil count, without more immature granulocytes and without basophilia. The diagnosis is based largely on exclusion." }
    status: unverified
  - id: hem.L08.038
    kind: cloze
    topic: cml-variants
    text: "Very rare patients with chronic neutrophilic leukemia have a BCR/ABL fusion gene coding a {{c1::230}} kDa oncoprotein."
    src: { page: 121, quote: "That codes for an oncoprotein namely 230 KD" }
    status: unverified
  - id: hem.L08.039
    kind: table
    topic: cml-variants
    title: Variants of CML
    columns: [Variant, Key features]
    rows:
      - [Ph-negative CML, "No basophilia or blasts, dysplasia; worse survival than Ph-positive"]
      - [Chronic myelomonocytic leukemia, "Elderly men, monocytosis, thrombocytopenia, no basophils or eosinophils, dysplasia"]
      - ["t(5;12) CMML-like", "Prominent eosinophilia, no basophilia; excellent response to low-dose imatinib"]
      - [Chronic neutrophilic leukemia, "Rare, incidental; mature neutrophilia, no basophilia; diagnosis by exclusion"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 121, quote: "Variants of CML 1. Ph-ve CML" }
    status: unverified
  - id: hem.L08.040
    kind: card
    topic: cml-course
    front: How do CML patients progress?
    back: One third develop an abrupt blast crisis; two thirds respond progressively less well in controlling WBC and spleen size (accelerated phase).
    src: { page: 121, quote: "One third of patients abrupthy develop an acute transformation (blast crisis); the other two thirds respond progressively less well" }
    status: unverified
  - id: hem.L08.041
    kind: cloze
    topic: cml-course
    text: "Median survival is only {{c1::3 months}} after blast crisis and {{c2::12 months}} after the accelerated phase."
    src: { page: 121, quote: "blast crisis of CML is only 3 months. The survival after development of the accelerated phase of CML is 12 months." }
    status: unverified
    tags: [numbers]
  # ---------- p122: blast types, treatment indications, busulfan, hydroxyurea ----------
  - id: hem.L08.042
    kind: table
    topic: cml-course
    title: Blast type in CML blast crisis
    columns: [Blast type, Share]
    rows:
      - [Myeloblasts, "70%"]
      - [Lymphoblasts, "20%"]
      - [Undifferentiated, "10%"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 122, quote: "70% of cases the blast cells are myeloblasts, in 20% of cases the blast cells are lymphoblasts" }
    status: unverified
    tags: [numbers]
  - id: hem.L08.043
    kind: enumerate
    topic: cml-treatment
    prompt: When is immediate treatment of CML necessary?
    points:
      - WBC above 200,000/µL
      - Leukostasis (priapism, dyspnea, venous thrombosis)
      - Painful splenomegaly suggesting splenic infarction
    pass: 3
    src: { page: 122, quote: "Immediate treatment of CML is not necessary unless the WBC count exceeds 200,000/dl or there is evidence of leukostasis" }
    status: unverified
    tags: [high-yield]
  - id: hem.L08.044
    kind: enumerate
    topic: cml-treatment
    prompt: List the supportive treatment of CML.
    points:
      - Overhydration and allopurinol for hyperuricemia
      - Blood transfusion for anemia
      - Platelet transfusion if needed
    pass: 3
    src: { page: 122, quote: "Overhydration + allopurinal to control hyperuricemia." }
    status: unverified
  - id: hem.L08.045
    kind: cloze
    topic: cml-treatment
    text: "Busulfan starts at {{c1::4–8 mg}} per day; the dose is cut by 50% when the count halves, and it is stopped when WBC reaches {{c2::20,000}}/µL because the count keeps falling for {{c3::2 to 4 weeks}}."
    src: { page: 122, quote: "Since the WBC count continues to fall for 2 to 4 weeks after cessation of busulfan the drug should be discontinued" }
    status: unverified
    tags: [numbers]
  - id: hem.L08.046
    kind: enumerate
    topic: cml-treatment
    prompt: List the side effects of busulfan.
    points:
      - Premature menopause
      - Sterility
      - Hyperpigmentation
      - Weight loss and fatigue
      - Pulmonary fibrosis
    pass: 4
    src: { page: 122, quote: "Premature menopause." }
    status: unverified
    tags: [high-yield]
  - id: hem.L08.047
    kind: card
    topic: cml-treatment
    front: Why is busulfan stopped at a WBC of 20,000/µL rather than at normal?
    back: The WBC keeps falling for 2 to 4 weeks after stopping, so waiting longer risks severe pancytopenia.
    src: { page: 122, quote: "Since the WBC count continues to fall for 2 to 4 weeks after cessation of busulfan" }
    status: unverified
  - id: hem.L08.048
    kind: cloze
    topic: cml-treatment
    text: "Hydroxyurea is given at {{c1::1 to 4 g}} per day, reduced as WBC falls and stopped at a WBC of {{c2::5000}}/µL."
    src: { page: 122, quote: "Hydroxyurea: is given at a dose of 1 to 4 grams per day." }
    status: unverified
    tags: [numbers]
  - id: hem.L08.049
    kind: card
    topic: cml-treatment
    front: What are the side effects of hydroxyurea?
    back: Uncommon; rash, mucositis and diarrhea can occur.
    src: { page: 123, quote: "Side effects are uncommon, although rash, mucositis and diarrhea can occur." }
    status: unverified
  # ---------- p123: TKI, resistance, second generation ----------
  - id: hem.L08.050
    kind: card
    topic: tki
    front: What is the treatment of a newly diagnosed patient with chronic-phase CML?
    back: A tyrosine kinase inhibitor (TKI); SCT as first therapy is an option if there is a suitable donor and the long-term cost of a TKI is prohibitive.
    src: { page: 123, quote: "There is now general agreement that patients with CML in chronic phase should be treated with a TKI." }
    status: unverified
    tags: [high-yield]
    update:
      text: "First-line TKI may be imatinib, dasatinib, nilotinib or bosutinib; transplant is kept for TKI failure, T315I without response, or advanced phase."
      ref: "ELN CML recommendations 2020"
  - id: hem.L08.051
    kind: enumerate
    topic: tki
    prompt: List the causes of primary resistance to imatinib.
    points:
      - Overexpression of the BCR/ABL oncoprotein
      - Overexpression of P-glycoprotein (drug efflux from cells)
      - Point mutations in the ABL kinase domain
    pass: 3
    src: { page: 123, quote: "primary resistance may be due to overexpression of the BCR/ABL oncoprotein and overexpression of P- Glycoprotein which lead to effux of the drug" }
    status: unverified
  - id: hem.L08.052
    kind: card
    topic: tki
    front: What is the T315I mutation and why does it matter?
    back: Threonine replaced by isoleucine at position 315 of the ABL kinase; it resists imatinib and all other TKIs.
    src: { page: 123, quote: "the replacement of threonine by isoleucine at position 315 (referred to as the T3151 mutation)" }
    status: unverified
    tags: [high-yield]
    update:
      text: "Ponatinib and asciminib are active against T315I."
      ref: "ELN CML recommendations 2020; FDA approval of asciminib 2021"
  - id: hem.L08.053
    kind: card
    topic: tki
    front: Name the second-generation TKIs.
    back: Dasatinib, nilotinib and bosutinib.
    src: { page: 123, quote: "These include dasatinib, nilotenib and bosutinib." }
    status: unverified
  - id: hem.L08.054
    kind: card
    topic: tki
    front: "Dasatinib (Sprycel): what is special, dose and side effects?"
    back: "Active against a wide range of tyrosine kinases besides ABL1; 100 mg once daily; more myelosuppressive than imatinib; nausea, rashes and pleural effusion."
    src: { page: 123, quote: "the recommended dose is 100 mg once daily, it is more myelosuppresive that imatinib. Other side-effects observed include nausea, rashes and pleural effusion." }
    status: unverified
    tags: [high-yield]
  # ---------- p124: nilotinib, bosutinib, predicting response ----------
  - id: hem.L08.055
    kind: card
    topic: tki
    front: "Nilotinib (Tasigna): potency, dose and side effects?"
