      - kind: aside
        tone: exam
        page: 204
        quote: "The preferred bronchodilator is a short-acting inhaled â2-agonist (SABA) with or without a short acting anticholinergic.(SAMA)."
        text: "كل exacerbation محتاجة تصعيد الـ bronchodilator، وممكن يكفي لوحده في الـ mild. المفضّل SABA مع أو من غير SAMA، والـ nebulizer ممكن يبقى أحسن وأريح من الـ metered dose inhaler (MDI)."
      - kind: figure
        page: 205
        quote: "Please note 90% saturation vs 60 mmHg PaO2."
        title: "الـ dissociation curve"
        alt: "Oxygen dissociation curve: saturation on the y-axis, PaO2 on the x-axis. The curve is steep below 60 mmHg and flat above it. A marked point at PaO2 60 and saturation 90 percent sits at the knee. A shaded band shows the target 88 to 92 percent. A note on the flat part: PaO2 can fall from 140 to 65 with little change in saturation."
        caption: "على الجزء المفلطح: الـ arterial partial pressure of oxygen (PaO2) بينزل كتير والـ saturation مش بيتحرك. عند 60 mmHg (90%) إحنا على حافة الجزء المنحدر."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
