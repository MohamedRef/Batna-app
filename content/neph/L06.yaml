items:
  # ---------- p127: water handling ----------
  - id: neph.L06.001
    kind: card
    topic: water
    front: What mainly regulates body water?
    back: Cerebral and peripheral osmoreceptors that sense changes in ECF osmolality.
    src: { page: 127, quote: "BW is mainly regulated by cerebral and peripheral osmoreceptors capable of sensing changes in ECF osmolality" }
    status: unverified
  - id: neph.L06.002
    kind: card
    topic: water
    front: What two responses does a rise in plasma osmolality trigger?
    back: Thirst and release of ADH (vasopressin) from the pituitary.
    src: { page: 127, quote: "Increase osmolality triggers thirst and pituitary ADH (vasopressin) release." }
    status: unverified
    tags: [high-yield]
  - id: neph.L06.003
    kind: order
    topic: water
    prompt: Put the steps of ADH-driven water reabsorption in order.
    steps:
      - ADH binds V2 receptors on the basolateral side of collecting duct principal cells
      - Aquaporins move to the apical membrane
      - Free water flows through them along the osmotic gradient
      - Water enters the hypertonic interstitium
    src: { page: 127, quote: "ADH binds V 2 (vasopressin) receptors on the Basolateral aspect of the principal cells in the collecting duct" }
    status: unverified
    tags: [high-yield]
  - id: neph.L06.004
    kind: cloze
    topic: water
    text: "ADH acts on {{c1::V2}} receptors on the basolateral side of the {{c2::principal cells}} of the collecting duct, moving {{c3::aquaporins}} to the apical membrane."
    src: { page: 127, quote: "leading to translocation of aquaporins to the apical membrane where these water channels allow free water absorption" }
    status: unverified
  - id: neph.L06.005
    kind: cloze
    topic: water
    text: "After a water load, thirst and ADH are suppressed and dilute urine restores normal osmolality ({{c1::285}} mOsmol/kg) within about {{c2::6}} hours."
    src: { page: 127, quote: "rapidly (6h) restoring normal osmolality (285mOsmol/kg)" }
    status: unverified
    tags: [numbers]
  - id: neph.L06.006
    kind: card
    topic: water
    front: What happens with water depletion, and what finally corrects the absolute deficit?
    back: Osmoreceptors sense high osmolality, ADH is released, water is retained and urine is highly concentrated. Increased thirst eventually corrects the absolute water deficit.
    src: { page: 127, quote: "Increased thirst eventually corrects the absolute water deficit." }
    status: unverified
  # ---------- p127-128: sodium ----------
  - id: neph.L06.007
    kind: cloze
    topic: sodium
    text: "Normal serum sodium is {{c1::135–145}} mEq/L; a change in serum Na reflects a change in {{c2::total body Na}}."
    src: { page: 127, quote: "Normal SNa: 135-145mEq/L change in SNa reflects change in total body Na+." }
    status: unverified
    tags: [numbers]
  - id: neph.L06.008
    kind: card
    topic: sodium
    front: What is sodium's main job as a solute?
    back: It is the principal active solute that maintains intravascular and interstitial volume.
    src: { page: 127, quote: "Principle active solute for the maintenance of intravascular & interstitial volume." }
    status: unverified
  - id: neph.L06.009
    kind: table
    topic: sodium
    title: Renal sodium handling
    columns: [Segment, Role]
    rows:
      - [Proximal convoluted tubule, Reabsorbs 2/3 of filtered Na]
      - [Loop of Henle, Countercurrent system for Na and water balance]
      - [Distal convoluted tubule and collecting duct, Aldosterone drives further Na reabsorption]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 128, quote: "Countercurrent system at the Loop of Henle is responsible for Na+ & water balance." }
    status: unverified
  - id: neph.L06.010
    kind: card
    topic: sodium
    front: How is sodium absorbed from the gut, and which organ is the principal regulator of sodium balance?
    back: It is absorbed throughout the GI tract by the active Na/K-ATPase system; the kidneys are the principal regulator.
    src: { page: 128, quote: "Absorption: throughout the GI system via active Na, K-ATPase system. Kidneys are the principal regulator" }
    status: unverified
  # ---------- p128-129: hyponatremia ----------
  - id: neph.L06.011
    kind: cloze
    topic: hypo-types
    text: "Hyponatremia is serum Na below {{c1::135}}. In hospital, symptomatic hyponatremia carries a mortality of {{c2::10–50%}}."
    src: { page: 128, quote: "In hospital, symptomatic hyponatraemia is associated with a mortality of 10-50%." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L06.012
    kind: card
    topic: hypo-types
    front: Are most hyponatremic patients symptomatic? What gets worse as Na falls?
    back: Most are thought to be asymptomatic, but perception and gait disturbances increase as Na falls.
    src: { page: 128, quote: "Most hyponatraemic patients are thought to be asymptomatic but perception and gait disturbances increase as Na falls." }
    status: unverified
  - id: neph.L06.013
    kind: card
    topic: hypo-types
    front: Define hypertonic (translocational) hyponatremia and give its commonest cause.
    back: Hyponatremia with plasma tonicity above 295 mOsm/kg H2O. Most commonly seen in hyperglycemia.
    src: { page: 128, quote: "Hyponatremia combined with plasma tonicity > 295 mOsm/kg H2O is indicative of hypertonic hyponatremia." }
    status: unverified
    tags: [high-yield]
  - id: neph.L06.014
    kind: card
    topic: hypo-types
    front: Why does hyperglycemia lower serum sodium?
    back: Extracellular hypertonicity draws water out of cells into the extracellular space, diluting the sodium.
    src: { page: 128, quote: "Extracellular hypertonicity associated with hyperglycemia favors efflux of water into the extracellular space, in turn decreasing the [Na+]." }
    status: unverified
  - id: neph.L06.015
    kind: cloze
    topic: hypo-types
    text: "Serum [Na+] falls by {{c1::1.6}} mEq/L for every {{c2::100}} mg/dL rise in serum glucose."
    src: { page: 129, quote: "[Na+] decreases by 1.6 mEq/L for every 100 mg/dL increase in serum glucose level." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L06.016
    kind: enumerate
    topic: hypo-types
    prompt: Mention causes of pseudohyponatremia.
    points:
      - Raised lipids
      - Raised plasma proteins (myeloma)
      - Hyperglycemia
      - Absorbed glycine- or sorbitol-containing bladder irrigants
    pass: 3
    src: { page: 129, quote: "Glycine- or sorbitol-containing bladder irrigants may also be absorbed." }
    status: unverified
    tags: [high-yield]
  - id: neph.L06.017
    kind: mcq
    topic: hypo-types
    stem: A 62-year-old man with back pain and anemia has serum Na 128 mmol/L, normal measured osmolality and total protein 11 g/dL. He feels well. What is the most likely explanation of the low sodium?
    options:
      - Pseudohyponatremia from high plasma proteins (myeloma)
      - SIADH
      - Translocational hyponatremia from hyperglycemia
      - Hypovolemic hyponatremia from renal losses
      - Acute water intoxication
    answer: 0
    why:
      - "Correct: raised plasma proteins (myeloma) cause pseudohyponatremia (p129)."
      - SIADH is a hypotonic hyponatremia; here the measured osmolality is normal.
      - Translocational hyponatremia needs hypertonicity (above 295), usually from high glucose.
      - Nothing suggests volume loss, and the osmolality is not low.
      - Acute water intoxication gives true hypotonic hyponatremia with symptoms.
    src: { page: 129, quote: "Increase plasma proteins (myeloma)." }
    status: unverified
  - id: neph.L06.018
    kind: cloze
    topic: hypo-types
    text: "Hyponatremia symptoms are rare when it is chronic or Na is above {{c1::125}} mmol/L, and common when it is acute or Na is below {{c2::110}} mmol/L."
    src: { page: 129, quote: "Rare in chronic hyponatremia or Na >125mmol/L. Common in acute hyponatremia or Na <110mmol/L" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L06.019
    kind: card
    topic: hypo-types
    front: What causes the symptoms of hyponatremia, and what are they?
    back: Cerebral swelling as osmolality falls (the encephalopathy). Headache, apathy, confusion (especially in the elderly), seizures and coma.
    src: { page: 129, quote: "Symptoms due to cerebral swelling as osmolality falls: the encephalopathy." }
    status: unverified
  # ---------- p129 figure: by volume status ----------
  - id: neph.L06.020
    kind: table
    topic: hypo-volume
    title: Hyponatremia by volume status (book figure)
    columns: [Volume status, Total body water, Total body Na, Urine Na, Causes]
    rows:
      - [Hypovolemia, Low, Very low, ">20 mmol/L", "Renal losses: diuretic excess, mineralocorticoid deficiency, salt-losing nephropathy, bicarbonaturia, ketonuria, osmotic diuresis, cerebral salt wasting"]
      - [Hypovolemia, Low, Very low, "<20 mmol/L", "Extrarenal losses: vomiting, diarrhea, third spacing (burns, pancreatitis, trauma)"]
      - [Euvolemia (no edema), High, Unchanged, ">20 mmol/L", "Glucocorticoid deficiency, hypothyroidism, stress, drugs, SIADH"]
      - [Hypervolemia, Very high, High, ">20 mmol/L", Acute or chronic kidney injury]
      - [Hypervolemia, Very high, High, "<20 mmol/L", "Nephrotic syndrome, cirrhosis, cardiac failure"]
    blanks: [[0, 4], [1, 4], [2, 4], [3, 4], [4, 4], [2, 2]]
    src: { page: 129, quote: "Assess volume status" }
    status: unverified
    tags: [high-yield]
  - id: neph.L06.021
    kind: card
    topic: hypo-volume
    front: In hyponatremia, what is the first step of the book's algorithm?
    back: Assess volume status (hypovolemia, euvolemia without edema, or hypervolemia), then measure urine Na where it helps.
    src: { page: 129, quote: "Assess volume status" }
    status: unverified
  - id: neph.L06.022
    kind: mcq
    topic: hypo-volume
    stem: A 30-year-old woman has had 3 days of vomiting. She is dry with postural hypotension. Serum Na 126 mmol/L, urine Na 8 mmol/L. Which group does this fit?
    options:
      - Hypovolemic hyponatremia from extrarenal losses
      - Hypovolemic hyponatremia from renal losses
      - Euvolemic hyponatremia (SIADH)
      - Hypervolemic hyponatremia from heart failure
      - Pseudohyponatremia
    answer: 0
    why:
      - "Correct: hypovolemia with urine Na below 20 means the kidney is holding Na; the loss is extrarenal (vomiting) (p129)."
      - Renal losses keep urine Na above 20 mmol/L.
      - She is clinically dry, not euvolemic; SIADH urine Na is above 30.
      - There is no edema or overload.
      - Vomiting causes a true loss, not a laboratory artifact.
    src: { page: 129, quote: "Extrarenal losses Vomiting Diarrhea" }
    status: unverified
  - id: neph.L06.023
    kind: mcq
    topic: hypo-volume
    stem: A man with decompensated cirrhosis has ascites and leg edema. Serum Na 124 mmol/L, urine Na 6 mmol/L. How is his hyponatremia classified?
    options:
      - Hypervolemic, urine Na below 20 (cirrhosis, nephrotic syndrome, heart failure)
      - Hypervolemic, urine Na above 20 (kidney injury)
      - Euvolemic (SIADH)
      - Hypovolemic from renal losses
      - Hypovolemic from extrarenal losses
    answer: 0
    why:
      - "Correct: total body water and Na are both up, and the kidney avidly keeps Na (urine Na below 20) (p129)."
      - With urine Na above 20 the book points to acute or chronic kidney injury.
      - He has edema, so he is not euvolemic.
      - Renal losses cause hypovolemia, not edema.
      - Extrarenal losses cause hypovolemia, not ascites and edema.
    src: { page: 129, quote: "Nephrotic syndrome Cirrhosis Cardiac failure" }
    status: unverified
  - id: neph.L06.024
    kind: enumerate
    topic: hypo-volume
    prompt: Mention causes of euvolemic hyponatremia (book figure).
    points:
      - Glucocorticoid deficiency
      - Hypothyroidism
      - Stress
      - Drugs
      - SIADH
    pass: 4
    src: { page: 129, quote: "Glucocorticoid deficiency Hypothyroidism Stress" }
    status: unverified
  # ---------- p130: SIADH ----------
  - id: neph.L06.025
    kind: enumerate
    topic: siadh
    prompt: State the Bartter and Schwartz criteria for SIADH.
    points:
      - Hypotonic hyponatremia (effective serum osmolality below 275 mOsm/kg)
      - Euvolemia
      - Less than maximally dilute urine (urine osmolality above 100 mOsm/kg)
      - Urine Na above 30 mEq/L on normal salt and water intake
      - No advanced kidney disease, cirrhosis or heart failure
      - No other cause (hypothyroidism, glucocorticoid insufficiency, diuretics)
    pass: 5
    src: { page: 130, quote: "Bartter & Schwartz Criteria for SIADH" }
    status: unverified
    tags: [high-yield]
  - id: neph.L06.026
    kind: cloze
    topic: siadh
    text: "SIADH: effective serum osmolality below {{c1::275}} mOsm/kg, urine osmolality above {{c2::100}} mOsm/kg, and urine Na above {{c3::30}} mEq/L."
    src: { page: 130, quote: "Hypotonic hyponatremia (effective Sosm < 275 mOsm/kg" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L06.027
    kind: enumerate
    topic: siadh
    prompt: Mention additional data that support a diagnosis of SIADH.
    points:
      - Serum uric acid below 4 mg/dL
      - Fractional excretion of uric acid above 10%
      - Hyponatremia worsens with IV normal saline
      - Plasma vasopressin or copeptin inappropriately high for serum osmolality
      - "Abnormal water load test: excretes less than 80% of a 20 mL/kg load in 4 h, urine not diluted below 100 mOsm/kg"
    pass: 3
    src: { page: 130, quote: "Additional Data Supporting Diagnosis of SIADH" }
    status: unverified
  - id: neph.L06.028
    kind: cloze
    topic: siadh
    text: "Supporting SIADH: serum uric acid below {{c1::4}} mg/dL and fractional excretion of uric acid above {{c2::10%}}."
    src: { page: 130, quote: "Serum uric acid < 4 mg/dL" }
    status: unverified
    tags: [numbers]
  - id: neph.L06.029
    kind: table
    topic: siadh
    title: Common causes of SIADH
    columns: [Group, Examples]
    rows:
      - [CNS disease, "Brain abscess, encephalitis, head trauma, intracranial hemorrhage, meningitis, tumor"]
      - [Drugs, "Amiodarone, carbamazepine, oxcarbazepine, MDMA, nicotine, phenothiazines, opioids, SSRIs, tricyclics, cyclophosphamide, chlorpropamide, vincristine"]
      - [Malignancy, "Small cell lung carcinoma (commonest), then head and neck cancer and non-small cell lung cancer"]
      - [Pulmonary disease, "Acute respiratory failure, COPD, pneumonia, tuberculosis"]
      - [Other, "HIV, idiopathic, postoperative state, reset osmostat"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 130, quote: "Box 4, Common Causes of SIADH" }
    status: unverified
    tags: [high-yield]
  - id: neph.L06.030
    kind: card
    topic: siadh
    front: Which malignancy most commonly causes SIADH?
    back: Small cell carcinoma of the lung, followed by head and neck cancer and non-small cell lung cancer.
    src: { page: 130, quote: "Most commonly small cell carcinoma of the lung followed by head and neck cancer" }
    status: unverified
    tags: [high-yield]
  - id: neph.L06.031
    kind: mcq
    topic: siadh
    stem: A 58-year-old smoker on carbamazepine is euvolemic with Na 124 mmol/L, serum osmolality 258 mOsm/kg, urine osmolality 420 mOsm/kg, urine Na 48 mEq/L, normal TSH and cortisol. Which finding would further support SIADH?
    options:
      - Serum uric acid 2.8 mg/dL
      - Serum uric acid 8 mg/dL
      - Na rises after IV normal saline
      - Urine osmolality 60 mOsm/kg
      - Urine Na 8 mEq/L
    answer: 0
    why:
      - "Correct: serum uric acid below 4 mg/dL supports SIADH (p130)."
      - A high uric acid points away from SIADH.
      - In SIADH, Na typically worsens with normal saline.
      - Maximally dilute urine (below 100) excludes SIADH.
      - Urine Na below 20 suggests extrarenal loss or avid Na retention, not SIADH.
    src: { page: 130, quote: "Worsening of hyponatremia with IV normal saline solution" }
    status: unverified
  # ---------- p131-132: treatment, hypertonic saline ----------
  - id: neph.L06.032
    kind: table
    topic: hypo-treat
    title: Treating hyponatremia by symptoms and duration (book figure)
    columns: [Group, Plan]
    rows:
      - [Symptomatic acute (under 48 h), "Emergency correction: 3% hypertonic saline 1–2 mL/kg/h plus furosemide"]
      - [Symptomatic chronic (over 48 h or unknown), "Some immediate correction: 3% saline 1–2 mL/kg/h if seizures, otherwise isotonic saline; furosemide 20 mg IV; switch to water restriction after a 10% rise in Na or when symptoms resolve"]
      - [Asymptomatic chronic, No immediate correction needed]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 131, quote: "Emergency correction needed" }
    status: unverified
    tags: [high-yield]
  - id: neph.L06.033
    kind: cloze
    topic: hypo-treat
    text: "In chronic symptomatic hyponatremia, do not raise serum Na by more than {{c1::12}} mmol/L in 24 hours; the goal is {{c2::8}} mmol/L in 24 hours."
    src: { page: 131, quote: "Do not correct serum [Na+] >12 mmol/24 hours" }
    status: unverified
    tags: [numbers, high-yield]
    update:
      text: "The 2014 European guideline (ESE/ESICM/ERBP) limits the rise to 10 mmol/L in the first 24 h and 8 mmol/L in each later 24 h."
      ref: "European clinical practice guideline on hyponatraemia 2014"
  - id: neph.L06.034
    kind: enumerate
    topic: hypo-treat
    prompt: Mention the long-term management of chronic hyponatremia.
    points:
      - Identify and treat reversible causes
      - Water restriction
      - Demeclocycline 300–600 mg twice daily (2 weeks for full effect)
      - Urea 15–60 g daily
      - V2 receptor antagonist
    pass: 4
    src: { page: 131, quote: "Urea 15-60 g daily" }
    status: unverified
  - id: neph.L06.035
    kind: card
    topic: hypo-treat
    front: How does hypertonic saline reduce brain edema?
    back: It raises blood osmolarity, pulling fluid from the extravascular into the intravascular space. This lowers brain edema, improves cerebral blood flow and reduces CSF production.
    src: { page: 131, quote: "which leads to decreases in brain edema, improved cerebral blood flow, and decreased CSF production" }
    status: unverified
  - id: neph.L06.036
    kind: card
    topic: hypo-treat
    front: Which hypertonic saline strengths are FDA-approved, and for what?
    back: 3% and 5%, for hyponatremia and raised intracranial pressure.
    src: { page: 131, quote: "Both 3% and 5% hypertonic saline (HS) is currently FDA-approved for use in hyponatremia and increased intracranial pressure (ICP)." }
    status: unverified
  - id: neph.L06.037
    kind: enumerate
    topic: hypo-treat
    prompt: Compare hypertonic saline with mannitol for raised ICP.
    points:
      - 3% saline lowers ICP about as well as 20% mannitol, with similar hemodynamic effects
      - Saline raises serum Na and is less diuretic (the Na rise releases ADH)
      - Saline needs less volume to reach similar plasma volumes than larger volumes of normal saline
      - Saline stimulates pituitary vasopressin release, cutting renal water loss
    pass: 3
    src: { page: 131, quote: "Research shows that 3% hypertonic saline decreases ICP similarly to 20% mannitol." }
    status: unverified
  - id: neph.L06.038
    kind: cloze
    topic: hypo-treat
    text: "In severe hyponatremia, correct Na by {{c1::4–6}} mEq/L per day, using {{c2::100}} mL boluses of 3% saline every {{c3::10}} minutes, up to three boluses."
    src: { page: 132, quote: "correction by 4 to 6 mEq/L per day, which can be achieved with 100 mL boluses of 3% HS at 10-minute intervals" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L06.039
    kind: cloze
    topic: hypo-treat
    text: "Each {{c1::1 mL/kg/h}} of 3% saline can be expected to raise [Na+] by about {{c2::1 mEq/L/h}}."
    src: { page: 132, quote: "Each 1 ml/kg/h of 3% saline solution administered can be expected to increase [na+] by 1 meq/l/h." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L06.040
    kind: card
    topic: hypo-treat
    front: Which venous route is preferred for hypertonic saline?
    back: Central venous access. A peripheral cannula is acceptable if no other access is available.
    src: { page: 132, quote: "Administration via a peripheral intravenous catheter is acceptable if no other access is available, but central venous access is the preferred route." }
    status: unverified
  - id: neph.L06.041
    kind: enumerate
    topic: hypo-treat
    prompt: Mention the side effects of hypertonic saline.
    points:
      - Hyperchloremic metabolic acidosis (added NaCl)
      - Hypernatremia with long-term use
      - Osmotic demyelination if severe hyponatremia is corrected too fast
      - "Route problems (commonest): IV site infection, thrombophlebitis, extravasation"
      - Hypervolemia
    pass: 4
    src: { page: 132, quote: "One possible side effect is hyperchloremic metabolic acidosis due to the addition of nacl." }
    status: unverified
    tags: [high-yield]
  - id: neph.L06.042
    kind: card
    topic: hypo-treat
    front: What are the most common adverse effects of hypertonic saline?
    back: Those related to the route of administration, such as IV site infection, thrombophlebitis and extravasation (also hypervolemia).
    src: { page: 132, quote: "The most common adverse effects are related to the route of administration and include infection at the iv site." }
    status: unverified
  - id: neph.L06.043
    kind: card
    topic: hypo-treat
    front: In which patients is caution needed with hypertonic saline, and why?
    back: Congestive heart failure or renal insufficiency, because they already carry increased fluid and sodium loads.
    src: { page: 132, quote: "Caution is necessary with hypertonic saline in patients with congestive heart failure or renal insufficiency" }
    status: unverified
  # ---------- p132: ODS ----------
  - id: neph.L06.044
    kind: card
    topic: ods
    front: Why does a brain cell shrink when chronic hyponatremia is corrected too fast?
    back: It has lost its organic osmolytes to resist swelling; if the surrounding tonicity rises faster than it can reaccumulate effective osmoles, it dehydrates and shrinks.
    src: { page: 132, quote: "it may dehydrate and shrink if its surrounding tonicity increases faster than it can reaccumulate effective osmoles" }
    status: unverified
    tags: [high-yield]
  - id: neph.L06.045
    kind: enumerate
    topic: ods
    prompt: Mention the sequelae of osmotic demyelination syndrome.
    points:
      - Dysphagia
      - Dysarthria
      - Spasticity
      - Behavioral disturbance and cognitive impairment
      - Delirium and seizures
      - Quadriparesis
      - Coma and locked-in syndrome
    pass: 5
    src: { page: 132, quote: "Sequelae of ODS are often irreversible and include dysphagia, dysarthria, spasticity, behavioral disturbance, cognitive impairment, delirium" }
    status: unverified
    tags: [high-yield]
  - id: neph.L06.046
    kind: mcq
    topic: ods
    stem: An elderly woman on a thiazide is admitted drowsy with Na 108 mmol/L of unknown duration. She gets repeated 3% saline and her Na is 126 mmol/L 24 hours later. Three days later she develops dysarthria, dysphagia and quadriparesis. What happened?
    options:
      - Osmotic demyelination from over-rapid correction
      - Recurrent hyponatremic encephalopathy
      - Hypernatremia from hypertonic saline
      - Hyperchloremic metabolic acidosis
      - Stroke from hypertonic saline thrombophlebitis
    answer: 0
    why:
      - "Correct: an 18 mmol/L rise in 24 h is far above the 12 mmol/L limit; ODS follows over-rapid correction (p132)."
      - Her Na is now near normal, so the brain is not swelling from hypotonicity.
      - Na 126 is still low, not high.
      - Acidosis does not cause this delayed pontine picture.
      - Thrombophlebitis is a local IV-site problem.
    src: { page: 132, quote: "Osmotic demyelin- ation syndrome (ODS) can occur if correction of hypo-natremia is achieved too rapidly." }
    status: unverified
  # ---------- p133-134: hypernatremia ----------
  - id: neph.L06.047
    kind: card
    topic: hyperna
