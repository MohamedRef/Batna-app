- id: res.L15.005
  kind: mcq
  topic: intro
  stem: On the population–sample slide, which symbol is the mean of a sample?
  options:
  - x̄
  - μ
  - σ
  - N
  answer: 0
  why:
  - x̄ (x-bar) is the sample mean.
  - μ (mu) is the population mean.
  - σ is the population standard deviation.
  - N is the number in the population; the sample count is n.
