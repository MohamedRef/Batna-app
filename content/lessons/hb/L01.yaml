  # ------------------------------------------------------------------
  - id: hb.L01.lesson1
    title: "الكبد بيتليف إزاي؟"
    hook: "من خلية ساكتة بتخزّن vitamin A لمصنع collagen: حكاية الـ cirrhosis من أولها."
    minutes: 8
    pages: [1, 4]
    topics: [definition, causes, pathogenesis]
    goals:
      - "تعرّف الـ cirrhosis بالكلمتين اللي الممتحن مستنيهم"
      - "تشرح ليه التليف بيبوّظ شغل الكبد مش بس شكله"
      - "تعدّ الـ 9 مجموعات أسباب من غير ما تنسى ولا واحدة"
    status: unverified
    steps:
      - kind: explain
        page: 1
        title: "نبدأ من الآخر: يعني إيه cirrhosis؟"
        quote: "a diffuse process with fibrosis and regenerative nodule formation resulting in disruption of the normal architecture of the liver"
        text: |
          الكتاب بيعرّفها **anatomically** إنها **diffuse process** فيه **fibrosis** و **regenerative nodules**، والنتيجة إن الـ **normal architecture** بتاعة الكبد بتبوظ.

          ركّز في الكلمتين دول: **fibrosis + nodules**. واحدة من غير التانية مش cirrhosis.

          وهي الـ **end result** لعملية الـ fibrogenesis اللي بتحصل مع أي **chronic liver injury**. يعني دي مش مرض لوحده، دي المحطة الأخيرة اللي أمراض كتير بتوصلها.

          ومن ناحية الشكل (morphology): **macronodular** أو **micronodular** أو **mixed**.
      - kind: explain
        page: 1
        title: "قابل البطلين"
        text: |
          علشان تفهم التليف لازم تعرف خليتين في الـ sinusoid:

          - **Sinusoidal endothelial cells (SECs):** دي بطانة الـ sinusoid، وفيها **fenestrations** (شبابيك) بين الخلايا بتسمح بتبادل الـ fluid والـ nutrients بين الدم والـ hepatocytes.
          - **Hepatic stellate cells (HSCs):** قاعدة في **space of Disse** بين الـ hepatocytes والـ endothelium. في الكبد الطبيعي بتبقى **quiescent** وشغلتها تخزّن **vitamin A and retinoids**. وهي **the major fibrogenic cells** في الكبد.
      - kind: figure
        page: 3
        title: "الـ sinusoid قبل وبعد الإصابة"
        alt: "Two panels. Normal: fenestrated endothelium, an empty space of Disse with a quiescent stellate cell holding vitamin A droplets, hepatocytes with microvilli. Injury: continuous endothelium, collagen filling the space of Disse, an activated spiky stellate cell, hepatocytes without microvilli."
        caption: "فوق الطبيعي: شبابيك مفتوحة والـ HSC ساكتة. تحت بعد الإصابة: الـ HSC اتنشطت، الـ collagen ملى Disse، والشبابيك اتقفلت (**capillarization**)."
