      - kind: explain
        page: 173
        quote: "Structures of the Respiratory Zone"
        title: "الـ respiratory zone من جوّه"
        text: |
          الكتاب بيبدأ الـ pathogenesis برسمة الـ **respiratory zone**: الـ **respiratory bronchioles**، والـ **alveolar ducts**، والـ **alveolar sacs**. الـ **terminal bronchiole** لسه جزء من الـ **conducting zone**، يعني بيوصّل هوا بس ومفيش فيه gas exchange.

          التفسير المقبول (مش في الكتاب) لطبقات الحيطة اللي في رسمة الكتاب الجاية:

          - **Type I cells**: رقيقة جدًا وفارشة أغلب السطح، عشان الأكسجين يعدّي بسهولة.
          - **Type II cells**: بتعمل surfactant، وهي اللي ==بتتقسم وتعوّض== الـ type I لما تموت.
          - **Interstitium**: فيه الـ **fibroblasts**، بين الـ epithelium والـ capillary.

          ليه ده مهم؟ لأن قصة الـ IPF كلها بتبدأ بـ **alveolar epithelial cells** بتتأذي وتتصلّح غلط، وبتخلص بـ fibroblasts بتبني ندبة في الـ interstitium.
      - kind: figure
        page: 173
        quote: "Structures of the Respiratory Zone"
        title: "رسمة الكتاب: الـ respiratory zone"
        image: { file: geri/L10-respiratory-zone.webp, book: true }
        alt: "The book's drawing of the respiratory zone: a lung on the left with a small box on its periphery, enlarged on the right to show a terminal bronchiole (part of the conducting zone) branching into respiratory bronchioles, alveolar ducts and grape-like alveolar sacs made of alveoli."
        caption: |
          الرسمة اللي الخطوة اللي فوق بتوصفها:

          - **على الشمال**: رئة كاملة، وعليها مربع صغير عند الأطراف.
          - **على اليمين**: المربع ده مكبّر. من الشمال لليمين: الـ **terminal bronchiole** (لسه ==conducting zone==)، وبعده الـ **respiratory bronchioles**، والـ **alveolar ducts**، وفي الآخر الـ **alveolar sacs** زي عناقيد العنب، كل حباية فيها alveolus.

          اللي تاخده: كل اللي بعد الـ terminal bronchiole هو ==respiratory zone==، وده المكان اللي الـ DPLD بيضربه.
      - kind: figure
        page: 174
        title: "رسمة الكتاب: حيطة الـ alveolus"
        image: { file: geri/L10-alveolus.webp, book: true }
        alt: "The book's cross-section of one alveolus: the alveolar space in the centre lined by flat alveolar type I cells and rounded alveolar type II cells, with a macrophage, and around it the wall containing an interstitial fibroblast at the top and capillaries with endothelial cells on the left and bottom."
        caption: |
          مقطع في alveolus واحد، الـ **alveolar space** في النص، وحواليه الحيطة:

          - **فوق على اليمين**: ==Alveolar type II cell== (المدوّرة)، وتحتها على اليمين **type I cell** (الرفيعة اللي فارشة الحيطة).
          - **فوق**: **interstitial fibroblast** جوه الحيطة نفسها.
          - **على الشمال وتحت**: **capillaries** (Capillary lumen) بالـ **endothelial cell**.
          - **تحت على اليمين**: **macrophage**.

          اللي تاخده: المسافة بين الهوا والدم هي type I cell + interstitium + endothelium بس. لما الـ ==fibroblast== يبني ندبة هنا الحيطة بتتخن والأكسجين يتعطّل.
      - kind: explain
        page: 174
        quote: "In contrast current research indicates that inflammation is less important in IPF which appears to be primarily a disorder of fibroblast activation and proliferation in response to as yet unknown trigger(s)."
        title: "نظريتين"
        text: |
          **الـ non-idiopathic fibrosis**: acute injury → chronic interstitial ==inflammation== → fibroblast activation → fibrosis، وبعدها تدمير.

          **الـ IPF**: النظرية القديمة كانت نفس الكلام، بس الـ anti-inflammatory و immune modulators طلعوا **minimally effective**. فالبحث الحالي بيقول الـ IPF أساسًا **disorder of fibroblast activation and proliferation** لـ trigger لسه مش معروف.

          المنطق بسيط: لو الالتهاب هو اللي بيعمل المرض، الأدوية اللي بتطفي الالتهاب كانت هتوقفه. لأنها ما وقفتوش، يبقى الالتهاب **مش المحرك**.
      - kind: order
        page: 174
        quote: "It is thought to begin with acute injury to the pulmonary parynchyma leading to chronic interstitial inflammation, then to fibroblast activation and proliferation, and finally progressing to the common end point of pulmonary fibrosis and tissue destruction."
        prompt: "رتّب النظرية بتاعة الـ non-idiopathic fibrosis:"
        steps:
          - "Acute injury to the parenchyma"
          - "Chronic interstitial inflammation"
          - "Fibroblast activation and proliferation"
          - "Pulmonary fibrosis and tissue destruction"
        why: "هنا الالتهاب في النص، قبل الـ fibroblasts. في الـ IPF الكتاب بيقول الالتهاب أقل أهمية، والمرض أساسًا fibroblasts بتشتغل لوحدها."
      - kind: reveal
        page: 174
        quote: "However, anti-inflammatory agents and immune modulators have proved to be minimally effective in modifying the natural course of the disease."
        prompt: "لو الـ IPF كان مرض التهابي فعلًا، الـ steroids والـ immune modulators كانت هتعمل إيه؟ وحصل إيه؟"
        answer: |
          كانت هتوقف المرض أو تبطّأه بوضوح. اللي حصل إنها طلعت **minimally effective** في الـ natural course.

          ده الدليل اللي قلب النظرية: الـ IPF مش التهاب، هو **fibroblast disease**. وعشان كده في درس العلاج هتلاقي الـ guideline بتقول **لا steroid monotherapy**، والعلاج antifibrotics.
      - kind: explain
        page: 174
        quote: "smoke, environmental pollutants, environmental dust, viral infections, gastroesophageal reflux disease, chronic aspiration"
        title: "مين اللي بيضرب الـ epithelium؟"
        text: |
          الـ stimuli في الكتاب **unknown**، بس فيه أمثلة، endogenous أو environmental:

          - **Smoke** و**environmental pollutants** و**environmental dust**
          - **Viral infections**
          - **Gastroesophageal reflux disease** و**chronic aspiration**

          وكلهم بيضربوا ==susceptible host==، مش أي حد.

          التفسير المقبول (مش في الكتاب): القاسم المشترك إن كلهم بيوصلوا للـ alveoli **مرة ورا مرة**: نَفَس دخان كل يوم، أو نقط حمض صغيرة من الـ reflux بالليل. ده اللي بيدّي الأذى المتكرر اللي شفته في الـ temporal heterogeneity. وكلمة susceptible معناها إن نفس الدخان مش بيعمل IPF في كل الناس: لازم أرض جاهزة، زي الـ telomeres القصيرة اللي جاية.
      - kind: figure
        page: 175
        quote: "It is currently believed that idiopathic pulmonary fibrosis (IPF) is an epithelial-fibroblastic disease, in which unknown endogenous or environmental stimuli disrupt the homeostasis of alveolar epithelial cells, resulting in diffuse epithelial cell activation and aberrant epithelial cell repair."
        title: "قصة الـ IPF في سطر"
        alt: "Vertical flow: triggers (smoke, pollutants, dust, viruses, GERD, aspiration) hit a susceptible host; alveolar epithelial cells activate and repair aberrantly with excess apoptosis; they release TNF-alpha, TGF-beta, PDGF, IGF-1 and ET-1; fibroblasts migrate, proliferate and become myofibroblasts; TGF-beta makes them resist apoptosis; excess matrix and scar destroy the lung. A side box: telomere shortening with age promotes epithelial loss."
        caption: "الـ epithelium بيموت أكتر من اللازم، والـ myofibroblast مش بيموت خالص. ده قلب المرض."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="GL10b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="6" width="310" height="54" rx="8" class="fg-thin"/>
            <text x="20" y="26" class="t-sm t-b">Triggers + susceptible host</text>
            <text x="20" y="46" class="t-sm">smoke, dust, viruses, GERD, aspiration</text>
            <path d="M165 60v18" class="fg-arrow" marker-end="url(#GL10b)"/>
            <rect x="10" y="80" width="310" height="54" rx="8" class="fg-bad"/>
            <text x="20" y="100" class="t-sm t-b">Alveolar epithelium</text>
            <text x="20" y="120" class="t-sm">aberrant repair, excess apoptosis</text>
            <path d="M165 134v18" class="fg-arrow" marker-end="url(#GL10b)"/>
            <rect x="10" y="154" width="310" height="54" rx="8" class="fg-box"/>
            <text x="20" y="174" class="t-sm t-b">Cytokines</text>
            <text x="20" y="194" class="t-sm">TNF-α, TGF-β, PDGF, IGF-1, ET-1</text>
            <path d="M165 208v18" class="fg-arrow" marker-end="url(#GL10b)"/>
            <rect x="10" y="228" width="310" height="54" rx="8" class="fg-acc"/>
            <text x="20" y="248" class="t-sm t-b">Fibroblast → myofibroblast</text>
            <text x="20" y="268" class="t-sm">TGF-β: resists apoptosis</text>
            <path d="M165 282v18" class="fg-arrow" marker-end="url(#GL10b)"/>
            <rect x="10" y="302" width="310" height="54" rx="8" class="fg-bad"/>
            <text x="20" y="322" class="t-sm t-b">Excess matrix + scar</text>
            <text x="20" y="342" class="t-sm">lung parenchyma destroyed</text>
            <rect x="10" y="368" width="310" height="54" rx="8" class="fg-thin"/>
            <text x="20" y="388" class="t-sm t-b">Telomere shortening (age)</text>
            <text x="20" y="408" class="t-sm">epithelial loss; familial: telomerase</text>
          </svg>
      - kind: explain
        page: 175
        quote: "These cytokines and growth factors are involved in the migration and proliferation of fibroblasts and the transformation of fibroblasts into myofibroblasts."
        title: "الـ cytokines بتعمل إيه في الـ fibroblast؟"
        text: |
          الـ epithelium المتأذي بيطلّع **fibrogenic cytokines and growth factors**: TNF-α، TGF-β، platelet-derived growth factor (PDGF)، insulin-like growth factor-1 (IGF-1)، endothelin-1 (ET-1).

          ودول بيعملوا تلات حاجات في الـ fibroblasts:

          - **Migration**: تيجي لمكان الجرح.
          - **Proliferation**: تتكاثر.
          - **Transformation** لـ ==myofibroblasts==.

          الـ fibroblasts والـ myofibroblasts هما الـ **key effector cells**، والـ myofibroblast هو اللي بيفرز **extracellular matrix proteins**.

          ليه myofibroblast بالذات؟ التفسير المقبول (مش في الكتاب): هو fibroblast اتعلم يتقلص زي العضلة ويفرز collagen كتير، عشان يشد الجرح ويقفله. ده مفيد في جرح الجلد، بس في الرئة معناه حيطة ناشفة ومشدودة.
      - kind: aside
        tone: analogy
        page: 175
        quote: "For normal wound healing to occur, wound myofibroblasts must undergo apoptosis."
        text: "الـ myofibroblast زي عمال البناء: لازم يمشوا لما الشغل يخلص (apoptosis). في الـ IPF العمال رافضين يمشوا، وكل يوم بيصبّوا خرسانة (matrix) زيادة لحد ما الشقة كلها تبقى عمود."
      - kind: order
        page: 175
        quote: "Excess loss of epithelial cells leads to release of cytokines. These cytokines stimulate fibroblasts to become myofibroblasts resistant to apoptosis with end result of excessive fibrous tissue deposition and destruction of lung parynchyma."
        prompt: "رتّب قصة الـ IPF:"
        steps:
          - "Unknown stimuli disrupt alveolar epithelium"
          - "Aberrant epithelial repair"
          - "Excess epithelial apoptosis"
          - "Cytokine release"
          - "Apoptosis-resistant myofibroblasts"
          - "Excess fibrous tissue"
        why: "الكتاب بيلخّصها: الـ epithelium يتصلّح غلط ويموت كتير، يطلّع cytokines، الـ fibroblasts تبقى myofibroblasts مقاومة للـ apoptosis، والنتيجة fibrous tissue كتير."
      - kind: check
        page: 175
        quote: "TGF-ẞ has been shown to promote an antiapoptotic phenotype in fibroblasts."
        question: "Which factor makes fibroblasts resist apoptosis in IPF?"
        options: ["TGF-beta", "Telomerase", "Endothelin-1", "Interleukin-2"]
        answer: 0
        why:
          - "صح: الـ TGF-beta بيعمل antiapoptotic phenotype."
          - "الـ telomerase إنزيم بيطوّل الـ telomeres؛ مشكلته في الـ epithelium مش الـ fibroblast."
          - "الـ ET-1 fibrogenic بس الكتاب ماربطوش بالـ apoptosis."
          - "مش في قايمة الكتاب."
      - kind: explain
        page: 176
        quote: "Telomerase is a polymerase enzyme that adds telomere repeats to the ends of chromosomes. This helps to offset shortening that occurs during DNA replication."
        title: "الـ telomeres: ليه مرض كبار؟"
        text: |
          - الـ ==telomerase== polymerase بيضيف telomere repeats لأطراف الـ chromosomes، عشان يعوّض القِصَر اللي بيحصل مع كل DNA replication.
          - الـ telomere بيقصر **مع السن**، وممكن يقصر كمان بشكل acquired.
          - القِصَر ده ممكن يموّت الـ alveolar epithelial cells، فيحصل aberrant repair.
          - **Mutation in telomerase** مرتبطة بالـ **familial IPF**: يعني لو الإنزيم بايظ وراثيًا، الـ telomeres بتقصر بدري، فالمرض يظهر في أكتر من فرد في العيلة.

          وفهم الحاجات دي هو اللي فتح الباب لعلاجات جديدة (nintedanib و pirfenidone في الدرس الرابع).
      - kind: "figure"
        page: 176
        quote: "Telomere shortening occurs with aging, and it can also be acquired."
        title: "الـ telomere: رسمة الكتاب، ص 176"
        image: { file: geri/L10-telomere.webp, book: true }
        caption: "اتنين chromosomes، والـ **DNA** في النص، وأطرافهم الوردي هي الـ ==telomere==:\n\n- **Young** (شمال): الأطراف الوردي **طويلة**.\n- **Old** (يمين): نفس الـ chromosome بس الأطراف ==أقصر==.\n\nده الـ telomere shortening with aging اللي الخطوة اللي فاتت قالت إنه بيموّت الـ alveolar epithelial cells ويبوّظ الـ repair، فيبقى الـ IPF مرض كبار."
        alt: "Book drawing: two chromosomes labelled young and old, with DNA in the middle and pink telomere caps at the ends; the old chromosome's telomeres are shorter."
      - kind: reveal
        page: 176
        quote: "Telomere shortening occurs with aging, and it can also be acquired."
        prompt: "افتكر إن الـ IPF تقريبًا عمره ما بيتشخّص تحت 40. إزاي الـ telomeres بتساعدك تفهم ده؟"
        answer: |
          الكتاب بيقول الـ **telomere shortening occurs with aging**، والقِصَر ده ممكن يموّت الـ **alveolar epithelial cells** ويعمل aberrant repair.

          التفسير المقبول (مش في الكتاب) للربط: كل ما السن يكبر، الـ type II cells بتبقى عملت divisions كتير والـ telomeres قصرت، فلما تيجي تعوّض الخلايا اللي ماتت **ما تقدرش**. الشاب الـ telomeres بتاعته لسه طويلة، فبيصلّح الأذى صح. عشان كده مرض كبار.
      - kind: try
        items: [geri.L10.021, geri.L10.024, geri.L10.025, geri.L10.031, geri.L10.034]
    recap:
