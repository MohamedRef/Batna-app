    status: unverified
    steps:
      - kind: explain
        page: 111
        title: "الـ supportive: عوّض اللي النخاع مش بيعمله"
        quote: "Proper antibiotics if fever or infection is present."
        text: |
          قبل الـ chemo وأثناءه، النخاع واقف، فإنت بتعوّض اللي ناقص:

          - **Packed RBCs** للأنيميا.
          - **Platelet transfusion** للـ thrombocytopenia.
          - ==Overhydration + allopurinol== للـ hyperuricemia: الخلايا اللي بتموت (لوحدها أو من الـ chemo) بتطلّع uric acid، والسوايل بتغسله من الكلية والـ allopurinol بيقلّل تصنيعه (التفسير المقبول للآلية، مش في الكتاب).
          - **Antibiotics** مع أي حرارة أو infection، لأن العيان granulocytopenic.
          - **Low-dose heparin 50 units/kg كل 6 ساعات** لو فيه DIC في ==M3==.
      - kind: case
        page: 111
        quote: "Platlet transfusion for thrombocytopenia, over hydration and allopurinal in cases of hyperuricemia."
        stem: "A 50-year-old with new AML: Hb 6.8 g/dL, platelets 9,000/µL, temperature 39 °C, uric acid 11 mg/dL."
        steps:
          - question: "Which supportive set fits the book?"
            options:
              - "Packed RBCs, platelets, hydration + allopurinol, antibiotics"
              - "Packed RBCs only, then wait for chemotherapy"
              - "Heparin for everyone"
              - "Steroids for the fever"
            answer: 0
            why: "الكتاب: packed red blood cells (RBCs) للأنيميا، platelets للـ thrombocytopenia، overhydration + allopurinol للـ hyperuricemia، و antibiotics للحرارة. الـ heparin بس لـ disseminated intravascular coagulation (DIC) في M3."
      - kind: explain
        page: 111
        title: "الـ 3 + 7"
        quote: "Treatment of acute myeloid leukaemia\n  Remission induction: 3 + 7 Protocol\n    1- Cytosine-anabinoside 100 mg/m2/day, IVI for 7 days.\n    2- Adriamycin 25-30 mg/m2. Days 1, 2, and 3 or days 5, 6, and 7.\nN.B: Daunorubicin 45 mg/m2 or Idarubicin 8-12 mg/m2 or Mitoxantrone 12 mg/m2 IV push or IVI on days 1,2, and 3 might substitute Adriamycin."
        text: |
          الـ **remission induction** في acute myeloid leukaemia (AML):
          - ==Cytosine arabinoside== **100 mg/m2/day** IV infusion لمدة **7 أيام**
          - ==Adriamycin== **25–30 mg/m2** أيام 1، 2، 3 (أو 5، 6، 7)

          ممكن بدل الـ Adriamycin: **daunorubicin 45**، **idarubicin 8–12**، أو **mitoxantrone 12 mg/m2** أيام 1–3.

          الهدف من الـ **induction** إنك تنضّف النخاع من الـ blasts لحد **complete remission (CR)**، وده معناه إن النخاع بيفضى فترة (aplasia) لحد ما الخلايا الطبيعية ترجع. عشان كده الـ supportive اللي فات هو اللي بيعدّي العيان الفترة دي.
      - kind: figure
        page: 111
        quote: "1- Cytosine-anabinoside 100 mg/m2/day, IVI for 7 days."
        title: "الـ 3 + 7 على الأيام"
        alt: "A seven-day calendar. Cytosine arabinoside 100 mg/m2 runs as an infusion on all seven days. Adriamycin 25 to 30 mg/m2 is given on days 1, 2 and 3."
        caption: "==Ara-C== **7 أيام** متواصلة، والـ **Adriamycin** (أو بديله) **3 أيام** في الأول (أو 5–7)."
        svg: |
