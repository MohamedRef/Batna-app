      - kind: mnemonic
        page: 16
        quote: "The diagnosis of GDM is made when any of the following plasma glucose values are met or exceeded:\n  Fasting: 92 mg/dL\n  1 h: 180 mg/dL\n  2h: 153 mg/dL"
        word: "92"
        parts:
          - { key: "9", text: "Fasting 92 (أقل من الـ 100 بتاع غير الحامل)" }
          - { key: "2", text: "1 h 180 وبعدين 2 h 153 (السكر بينزل تاني)" }
        hook: "الـ 1-h = **180**، نفس الـ renal threshold بالظبط. الـ fasting **92** أوطى من الـ 100 بتاع غير الحامل، لأن سكر الحامل الصايم أوطى أصلًا. والـ 2-h **153** بين الاتنين. والأهم: **قيمة واحدة** تكفي."
      - kind: check
        page: 16
        quote: "The diagnosis of GDM is made when any of the following plasma glucose values are met or exceeded"
        question: "At 26 weeks: fasting 94, 1 h 172, 2 h 140 mg/dL. Interpretation?"
        options: ["GDM", "Normal: two values are normal", "Repeat at 32 weeks", "Prediabetes"]
        answer: 0
        why:
          - "صح: الـ fasting **94 ≥ 92**، وقيمة واحدة تكفي."
          - "مش محتاج اتنين؛ **any one** value."
          - "التشخيص اتعمل خلاص."
          - "مفيش prediabetes في الـ one-step test."
      - kind: explain
        page: 16
        title: "مين ما يحتاجش screening؟"
        quote: "No screening is needed for any woman fulfilling all the following criteria"
        text: |
          لازم تحقق ==all== الشروط دي:
          1. **Normal body weight**
          2. مفيش **diabetes** في قرايب الدرجة الأولى
          3. مفيش تاريخ **abnormal glucose tolerance**
          4. السن **أقل من 25**
          5. مفيش **poor obstetric outcome** قبل كده

          شرط واحد ناقص = تعمل screening.

          الشروط الخمسة هي عكس الـ risk factors بالظبط: وزن طبيعي يعني مفيش resistance، ومفيش family history أو تاريخ glucose intolerance يعني الـ β-cells سليمة، والسن الصغير لأن الـ β-cell بتتعب مع السن، و obstetric history نضيف يعني مفيش سكر فات من غير ما يتشاف. عشان كده لازم **كلهم** مع بعض.
      - kind: explain
        page: 17
        title: "الـ high risk: بدري وبالمعايير العادية"
        quote: "Before 15 weeks of gestation, screen for diabetes using the standard diagnostic criteria."
        text: |
          - اللي **planning pregnancy** وعندها risk factors: screen للـ prediabetes والـ diabetes.
          - في الحمل: سكر **venous plasma** بدري في الـ **first trimester**، ==before 15 weeks==، بنفس معايير غير الحامل: أعراض + random **200**، أو fasting **126**، أو 2-h **200**؛ ومن غير unequivocal hyperglycemia: اتنين abnormal.

          ليه بدري وبمعايير غير الحامل؟ التفسير المقبول (مش في الكتاب): اللي بندوّر عليه هنا مش GDM، ده **سكر كان موجود قبل الحمل** وما اتشخّصش. الهرمونات المعاكسة لسه ما طلعتش في الـ first trimester، فلو السكر عالي دلوقتي يبقى السكر أصلًا عندها، وده خطر على تكوين أعضاء الجنين في الأسابيع الأولى.
      - kind: case
        page: 16
        quote: "Screening for diabetes in high-risk women\n  In individuals who are planning pregnancy, screen those with risk factors for diagnosis of prediabetes or diabetes.\n  Blood glucose testing should be performed as early as possible during the first trimester using venous plasma glucose:"
