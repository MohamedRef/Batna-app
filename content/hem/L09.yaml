        why: "A trephine biopsy is essential; silver shows reticulin and trichrome shows collagen (p150). Repeat aspirates are usually dry. Splenectomy is not diagnostic."
      - reveal: "Trephine: atypical megakaryocytes with grade 3 fibrosis. JAK2 V617F positive. BCR-ABL1 negative."
