  - id: neph.L11.177
    kind: mcq
    topic: tx-plan
    stem: "A 30-year-old, 8 months after a living-donor transplant, wants to conceive. Creatinine 1.3 mg/dL, no rejection, BP controlled on amlodipine, proteinuria 150 mg/day, on tacrolimus, MMF and prednisolone. What should she be told?"
    options:
      - She meets all criteria and can conceive now
      - Wait until at least 1 year post-transplant and switch MMF to azathioprine first
      - Pregnancy is contraindicated after any transplant
      - Stop all immunosuppression before conception
      - She must first lower creatinine below 1.0 mg/dL
    answer: 1
    why:
      - She is under 1 year post-transplant and on MMF, which is teratogenic.
      - "Correct: defer to at least 1 year, withdraw MMF before trying, and keep contraception for at least 3 months after withdrawal."
      - Pregnancy is possible when the criteria are met.
      - Stopping all immunosuppression risks rejection; switch to pregnancy-safe drugs.
      - "The target is <2.0, preferably <1.5 mg/dL; 1.3 is fine."
