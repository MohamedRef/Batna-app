  - id: hb.L12.lesson4
    title: "Wilson: النحاس اللي مش لاقي مخرج"
    hook: "جين واحد (ATP7B) بايظ، والنحاس يقعد في الكبد ويطفح على المخ والعين والدم والكلية."
    minutes: 10
    pages: [199, 201]
    topics: [wilson]
    goals:
      - "تقول الجين والوراثة والمشكلة الأساسية في Wilson"
      - "تعدّ الأعراض الكبدية والعصبية والنفسية والباقي"
      - "تفسّر الـ ceruloplasmin والـ copper في التشخيص"
      - "تعرف العلاج وإزاي الـ zinc بيشتغل"
    status: unverified
    steps:
      - kind: explain
        page: 199
        title: "المرض في سطور"
        text: |
          - **Wilson disease**: rare genetic disorder فيه excessive accumulation of copper، خصوصًا في الكبد والمخ.
          - ==ATP7B==: الجين اللي بيطلّع النحاس الزيادة من الكبد للـ bile. في Wilson فيه mutations فيه، والوراثة ==autosomal recessive==.

          النحاس عنصر مهم بكميات صغيرة، والكبد هو اللي بيظبط الكمية بإنه يرمي الزيادة في الـ bile. لو الطريق ده اتقفل، النحاس بيتكوّم.

          - من غير علاج ممكن يموّت: liver failure، neurological complications، أو psychiatric disturbances.
          - بيصيب حوالي 1 في 30,000، وأكتر في اللي عندهم family history.
          - الـ carriers مالهمش أعراض، فصعب نعرف عددهم في الناس.

          قارنه بالـ hemochromatosis: هناك المشكلة إن الحديد بيدخل زيادة، هنا المشكلة إن النحاس مش لاقي يخرج. الاتنين recessive، والاتنين بيبدأوا بالكبد.
      - kind: figure
        page: 200
        title: "رحلة النحاس"
        alt: "Copper from food enters the gut, where zinc blocks absorption. It goes to the liver. Normally ATP7B sends copper out into bile; in Wilson disease that exit is blocked, so copper builds up in the liver, causing hepatitis, acute liver failure or cirrhosis. Copper then spills into the blood and reaches the brain, eyes, red cells, kidneys, heart and bones. Chelators, penicillamine and trientine, pull copper out."
        caption: "الطريق الطبيعي: أمعاء → كبد → **bile**. في Wilson الـ **ATP7B** مقفول، فالنحاس بيتكوّم في الكبد وبعدين يطفح على كل حتة. الـ **zinc** بيقفل الباب في الأمعاء، والـ **chelators** بتشفط اللي اتراكم."
        svg: |
