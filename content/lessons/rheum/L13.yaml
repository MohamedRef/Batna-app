            <circle cx="295" cy="75" r="5" class="fg-dot-bad"/>
            <circle cx="312" cy="60" r="5" class="fg-dot-bad"/>
            <text x="35" y="118" class="t-lg t-b">0</text>
            <text x="117" y="118" class="t-lg t-b">1</text>
            <text x="199" y="118" class="t-lg t-b">2</text>
            <text x="281" y="118" class="t-lg t-b">3</text>
            <text x="22" y="140" class="t-sm">none</text>
            <text x="108" y="140" class="t-sm">mild</text>
            <text x="180" y="140" class="t-sm">moderate</text>
            <text x="266" y="140" class="t-sm">severe</text>
          </svg>
      - kind: explain
        page: 214
        title: "ليه نقيس بدرجات؟"
        quote: "Semi-Quantitative Scoring\n  Gray-scale (GS) and Power Doppler (PD) signals are graded 0–3.\n    0 = none.\n    1 = mild.\n    2 = moderate.\n    3 = severe."
        text: |
          الكتاب: GS و PD كل واحد ==0 لـ 3==: none، mild، moderate، severe، وبيدخلوا في composite scores زي **US7** و **GLOESS** و **OMERACT-EULAR**.

          ليه درجات ومش "فيه أو مفيش"؟ التفسير المقبول (مش في الكتاب): العلاج هدفه إن الرقم ينزل. لو قلت "فيه Doppler" بس، مش هتعرف هل الدوا شغال ولا لأ. لكن لو كان 3 وبقى 1، يبقى الـ treatment response واضح، وده اللي الكتاب بيقصده بإن الـ PD **essential for scoring disease activity**.
      - kind: explain
        page: 214
        quote: "MSUS helps:\n  Confirm active synovitis in equivocal clinical exams.\n  Identify subclinical disease in patients in apparent remission.\n  Guide corticosteroid injection into inflamed joints or bursae.\n  Detect flares early and personalize tapering of DMARDs/biologics."
        title: "الـ MSUS بيغيّر القرار"
        text: |
          - يأكد **active synovitis** لما الكشف مش واضح (equivocal).
          - يلاقي ==subclinical disease== في مريض شكله في remission.
          - يوجّه حقن الـ steroid في المفصل أو الـ bursa.
          - يلقط الـ flare بدري ويخلّي الـ **tapering** للـ disease-modifying antirheumatic drugs (DMARDs)/biologics شخصي.

          ولو الـ Doppler مفيهوش التهاب: **high negative predictive value**.
      - kind: reveal
        page: 214
        quote: "It has high negative predictive value when inflammation is not seen on Doppler."
        prompt: "ليه الـ Doppler السليم بيطمّن أكتر من الـ Doppler الموجب؟"
        answer: |
          الكتاب: ==high negative predictive value== لما الالتهاب مش باين على الـ Doppler.

          التفسير المقبول (مش في الكتاب): الـ PD حساس جدًا للـ slow flow في الأوعية الصغيرة (ص 214)، فلو فيه التهاب شغال غالبًا هيلقطه. فلما ما يلقطش حاجة، احتمال إن فيه التهاب مستخبي قليل، وده يخليك مطمّن تقلل العلاج. أما الـ GS لوحده ممكن يفضل متغير من التهاب قديم خلص.
      - kind: case
        page: 214
        quote: "MSUS helps:\n  Confirm active synovitis in equivocal clinical exams.\n  Identify subclinical disease in patients in apparent remission.\n  Guide corticosteroid injection into inflamed joints or bursae.\n  Detect flares early and personalize tapering of DMARDs/biologics."
