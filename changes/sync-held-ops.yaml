# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: لو باطنة كلاود رفضت تغيير من الجهاز، ما بيضيعش في السكوت. بيتحفظ، وفي «المزامنة» كارت بيقولك عددهم مع «ابعتهم تاني» أو «سيبهم»
  en: Changes Batna Cloud refuses are no longer dropped silently. They are kept, and Settings › Sync shows how many with Send again or Let them go
- kind: fixed
  ar_eg: النسخة الاحتياطية بتتاخد كلها في لحظة واحدة، فالمزامنة وهي شغالة ما تقدرش تخليها نص قديم ونص جديد
  en: A backup export is taken at one moment, so sync running at the same time can't leave it half old and half new
