        question: Is he stable by the lecture's definition?
        options: ["No: shock index 1.15", "Yes: BP is above 90", "Yes: shock index 0.87", "Cannot tell without Hb"]
        answer: 0
        why: "Shock index = HR/SBP = 115/100 = 1.15, above 1, so unstable (p227). A BP above 90 does not make him stable. 0.87 is the inverse. Hb is not part of the shock index."
      - reveal: "After fluids he keeps bleeding. Hb 7.8 g/dL. BUN/Cr ratio 18."
        question: Best first diagnostic test?
        options: [CT angiography, Urgent colonoscopy without preparation, Capsule endoscopy, Tagged red cell scan tomorrow]
        answer: 0
        why: "CTA is preferred initially for ongoing hemodynamically significant hematochezia (p228). Urgent colonoscopy within 24 h has not improved outcomes. Capsule is for small bowel bleeding. Scintigraphy suits slower bleeding."
      - reveal: CT angiography shows contrast extravasation in the sigmoid colon.
        question: Next step?
        options: [Arteriography and embolization, Repeat CTA in 24 hours, Discharge with outpatient colonoscopy, Barium enema]
        answer: 0
        why: "When the source is detected, refer for arteriography and embolization (p228)."
      - reveal: Later, colonoscopy shows a sigmoid diverticulum with a visible vessel.
