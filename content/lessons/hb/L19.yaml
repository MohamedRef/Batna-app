  # ------------------------------------------------------------------
  - id: hb.L19.lesson6
    title: "الحصوة بتتولد إزاي؟"
    hook: "من bile سايلة لحجر بيكبر 1–2 mm كل سنة: مصنع الحصوات من جوّه."
    minutes: 7
    pages: [378, 379]
    topics: [pathogenesis]
    goals:
      - "تعدّ الـ 4 predisposing factors وتربطهم بخطوط المصنع"
      - "تشرح الـ sludge والـ nucleation بالترتيب"
      - "تحفظ الطفيليات المرتبطة بالحصوات"
    status: unverified
    steps:
      - kind: explain
        page: 378
        quote: "Impaired GB function. Supersaturated bile. Cholesterol nucleating factors. Absorption /enter hepatic circulation of bile acids."
        title: "4 حاجات بتمهّد للحصوة"
        text: |
          الكتاب بيبدأ الـ pathogenesis بـ 4 ==predisposing factors==:

          - **Impaired GB function**: مرارة مش بتفضى كويس، فالـ bile بتقعد فيها وتركد (stasis).
          - **Supersaturated bile**: cholesterol أكتر من اللي الـ bile تقدر تشيله.
          - **Cholesterol nucleating factors**: حاجات بتلمّ البلورات وتخليها تترسّب.
          - **Absorption / enterohepatic circulation of bile acids**: الـ bile acids بتتمص في الـ ileum وترجع للكبد يفرزها تاني (physiology، مش من الكتاب). لو الدورة دي اتكسرت، الـ bile salts بتقل.

          ليه الرابعة مهمة؟ لأن الـ bile salts هي اللي شايلة الـ cholesterol (صفحة 380). علشان كده الـ ileal resection في عوامل الخطر في مصر، والـ cystic fibrosis في الدرس الجاي: الاتنين بيكسروا الدورة.

          والتلاتة الأولانيين هم نفسهم خطوط المصنع اللي في الرسمة الجاية: stasis و supersaturation و nucleation.
      - kind: figure
        page: 378
        title: "الـ 4 عوامل على رسمة واحدة"
        image: { file: hb/L19-predisposing-factors.webp, book: true }
        alt: "Book slide on a blue background: a yellow gallbladder with a black stone and its duct, and a red segment of terminal ileum. Four circled labels point at it: impaired GB function (emptying, absorption, secretion) at top left; supersaturated bile (age, sex, genetics, obesity, drugs, diet and liver disease) at top right; increased nucleating factors (mucus, glycoprotein, infection, parasites, others) at bottom left; absorption and enterohepatic circulation of bile acids (deoxycholate, ileal resection, short bowel, cholestyramine, fecal flora) at bottom right, with arrows to the red ileum."
        caption: |
          شريحة الكتاب للـ 4 عوامل، وكل دايرة سهمها رايح للمكان اللي بيحصل فيه:

          - **فوق شمال** (بالأحمر): ==Impaired GB function== (GB = gallbladder): emptying و absorption و secretion. السهم على المرارة الصفرا نفسها.
          - **فوق يمين**: **Supersaturated bile**، وأسبابها age, sex, genetics و obesity, drugs, diet و liver disease. السهم على الـ bile اللي نازلة من الكبد.
          - **تحت شمال**: **Increased nucleating factors**: mucus و glycoprotein و infection و parasites. السهم على الحصوة السودا جوّه المرارة.
          - **تحت يمين**: **Absorption / enterohepatic circulation of bile acids**: deoxycholate، ==ileal resection==، short bowel، cholestyramine، fecal flora. الأسهم على الجزء الأحمر، وده الـ terminal ileum اللي بيمتص الـ bile acids.

          الرسمة بتثبت فكرة الدرس: الحصوة مش من سبب واحد؛ المرارة والـ bile والبلورات والـ ileum كلهم شركاء.
      - kind: explain
        page: 378
        quote: "Biliary sludge is often a precursor of gallstones. It consists of Ca bilirubinate (a polymer of bilirubin), cholesterol microcrystals, and mucin."
        title: "الـ sludge: الحصوة وهي لسه عيّلة"
        text: |
          الـ ==biliary sludge== غالبًا هو اللي بيسبق الحصوة. اعتبره الحصوة وهي لسه طين.

          مكوّن من 3 حاجات:
          - **Ca bilirubinate**: polymer of bilirubin
          - **Cholesterol microcrystals**
          - **Mucin**

          بيتكوّن إمتى؟ لما المرارة تركد (==stasis==). والكتاب بيدي مثالين:
          - **Pregnancy**
          - **Total parenteral nutrition (TPN)**: العيان مش بياكل بالبُق، فمفيش أكل يوصل الـ duodenum يقول للمرارة تنقبض.

          وبعدين إيه؟ تلات طرق:
          - معظمه asymptomatic وبيختفي لوحده لما السبب يروح.
          - أو يكبر ويبقى حصوة.
          - أو ينزل في الـ ducts ويسدّها، فيعمل **biliary pain** أو **cholangitis** أو **pancreatitis**.
      - kind: figure
        page: 378
        quote: "Sludge develops during gallbladder stasis, as occurs during pregnancy or while receiving TPN. Most sludge is asymptomatic and disappears when the primary condition resolves."
        title: "مصنع الحصوات: 3 خطوط إنتاج"
