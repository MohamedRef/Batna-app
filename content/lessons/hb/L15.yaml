      - kind: explain
        page: 294
        title: "التحاليل"
        text: |
          **Exocrine function tests**: مش روتين، لأن حساسيتها واطية.
          - ليه؟ البنكرياس عنده احتياطي ضخم، فبيفضل يهضم كويس لحد ما يضيع أكتر من 90% منه. والتحليل مبيبقاش positive إلا ساعتها.
          - الأشهر النهارده: **stool elastase-1** (الكتاب: أقل من 100 mg/g).

          **Endocrine function**: بتقيس الـ islets.
          - **Glucose tolerance test**.
          - **Blood insulin**.
          - **C-peptide**: بيقولك البنكرياس لسه بيصنع insulin قد إيه.
      - kind: aside
        tone: trap
        page: 294
        text: |
          الكتاب كاتب وحدة الـ elastase mg/g، ومعظم المعامل والمراجع بتكتبها µg/g. الرقم 100 هو هو، فمتتلخبطش لو شفت الوحدة التانية.

          والأهم: لو الـ exocrine test **normal** فده مش بينفي CP، لأنه مبيطلعش إلا بعد ضياع > 90%.
      - kind: explain
        page: 294
        title: "الأشعة: مين يعمل إيه"
        text: |
          الترتيب: ابدأ بـ **CT أو MRI** (first line). الـ **EUS** بس لو التشخيص لسه مش واضح، لأنه invasive وأقل specificity.

          اللي كل فحص بيشوفه:
          - **CT**: enlargement، **calcifications**، **duct dilatation**، thickened peripancreatic fascia، bile duct involvement.
          - **US (late)**: بنكرياس صغير atrophic echogenic، و calcification بـ shadowing، وممكن pseudocysts.
          - **Plain X-ray**: **calcification** في 25–59%، ولو ظهرت تبقى **pathognomonic**. فحص رخيص بس مش بيلقط الكل.
          - **ERCP**: **most sensitive and specific**، بس invasive وممكن يعمل AP أو cholangitis، فمش أول خطوة.
          - **EUS (Rosemont)**: major A = hyperechoic foci بـ shadow و stones في الـ main duct؛ major B = **honeycomb lobularity**.
          - **Histology** (EUS-guided biopsy): الـ gold standard للـ high-risk اللي الأشعة عندهم مش حاسمة.

          الخلاصة: كل ما الفحص يبقى أدق، بيبقى أخطر. علشان كده بنمشي من الآمن للخطير.
      - kind: sort
        page: 295
        prompt: "العلامة دي بتطلع في أنهي فحص؟"
        bins: ["Plain X-ray", "CT", "EUS (Rosemont)", "ERCP"]
        cards:
          - { text: "Calcification seen in 25–59%, pathognomonic", bin: 0 }
          - { text: "Thickened peripancreatic fascia", bin: 1 }
          - { text: "Pancreatic enlargement", bin: 1 }
          - { text: "Honeycomb lobularity (major B)", bin: 2 }
          - { text: "Hyperechoic foci with acoustic shadow (major A)", bin: 2 }
          - { text: "Most sensitive and specific, may trigger AP", bin: 3 }
        why: "الـ X-ray: الكالسيوم بس. الـ CT: الشكل حوالين البنكرياس. الـ EUS: الـ Rosemont (honeycomb و hyperechoic foci). الـ ERCP: الأدق بس الأخطر."
      - kind: check
        page: 294
        question: "Which test does the guideline in the lecture use **first** to diagnose suspected chronic pancreatitis?"
        options:
          - "CT or MRI"
          - "EUS"
          - "ERCP"
          - "Fecal elastase-1"
        answer: 0
        why:
          - "صح: cross-sectional imaging الأول."
          - "الـ EUS بس لو التشخيص لسه مشكوك فيه بعد الـ CT/MRI."
          - "الأدق، بس invasive وممكن يعمل pancreatitis، فمش أول خطوة."
          - "حساسيته واطية: مبيطلعش إلا بعد ضياع > 90%."
      - kind: explain
        page: 296
        title: "المضاعفات والعلاج"
        text: |
          **Complications**، مقسومة على حسب اللي اتأذى:
          - **Collections**: pseudocyst، fistula.
          - أوعية: **pseudoaneurysm**، splenic / portal vein obstruction.
          - **CBD**: **CBD stenosis** من الـ fibrosis اللي بتخنق الماسورة وهي معدّية في الرأس.
          - **Islets**: diabetes (70–90% في الـ calcific CP).
          - الأخطر: **adenocarcinoma**، الخطر أعلى من العادي (الكتاب: 5–10%).

          العلاج = 3 مشاكل (نفس صناديق الرسمة):
          - **Pain**: medical (analgesics، وقف alcohol و tobacco، antioxidants)، endoscopic (PD sphincterotomy، stent، stone removal، **celiac plexus block**)، surgery (drainage: **pancreaticojejunostomy**؛ resection: Whipple، distal أو total pancreatectomy). الكتاب بيعرضهم كـ 3 عناوين من غير ترتيب.
          - **Steatorrhea**: **lipase 40,000–50,000 USP** للي عنده أعراض. إحنا بنعوّض الإنزيم اللي الغدة بطّلت تعمله.
          - **Diabetes**.

          **Nutritional evaluation** دورية (ص 298): للـ malnutrition، والـ **osteoporosis**، والـ **fat-soluble vitamins** (A, D, E, K بتضيع مع الدهون في الإسهال).
      - kind: table
        page: 297
        title: "Pain management in CP"
        columns: ["Approach", "Options"]
        rows:
          - ["Medical", "Analgesics; stop alcohol and tobacco; antioxidants"]
          - ["Endoscopic", "PD sphincterotomy; stent; PD stone removal; celiac plexus block"]
          - ["Surgical drainage", "Pancreaticojejunostomy"]
          - ["Surgical resection", "Whipple; distal pancreatectomy; total pancreatectomy"]
