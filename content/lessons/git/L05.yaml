        quote: "Age 40, or 10 years before the youngest case in the immediate family, whichever is earlier."
        question: "His father had colon cancer at 44. When should he start colonoscopy?"
        options: ["At 34, then every 5 years", "At 40, then every 10 years", "At 50, then every 10 years", "At 10-12, yearly sigmoidoscopy"]
        answer: 0
        why:
