        text: "فخ امتحان: الـ ==neglect== ممكن يكون **unintentional**. البنت التعبانة اللي مش بتأكّل أبوها كفاية من غير قصد، ده برضه neglect."
      - kind: sort
        page: 214
        quote: "Types of Elder Abuse\n| Types of abuse | Characteristics | Examples |\n|---|---|---|\n| Financial or material | Illegal or improper use of funds or resources, exploitation. | Theft of debit or credit cards, coercion to deprive the older person of assets (e.g., forcible transfer of property or accounts). |\n| Neglect or abandonment | Intentional or unintentional refusal or failure of designated caregiver to meet needs required for an older person's well-being. | Failure to provide adequate food, clothing, shelter, medical care, hygiene, or social stimulation/interaction. |\n| Physical | Infliction of pain or injury | Slapping, hitting, kicking, force-feeding, restraint, striking with objects |\n| Psychological or emotional | Infliction of mental anguish. | Verbal aggression or threat, threats of institutionalization, social isolation, humiliating or degrading statements. |\n| Sexual | Nonconsensual genital contact, unwanted sexual talk. | Suggestive talk, forced sexual activity, touching, fondling a nonconsenting competent or incompetent person. |"
        prompt: "حط كل موقف في نوعه:"
        bins: ["Financial", "Neglect", "Physical", "Psychological"]
        cards:
          - { text: "Son keeps her pension card", bin: 0 }
