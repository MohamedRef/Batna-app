        page: 204
        quote: "Those with iridocyclitis and ANA positive oligoarthritis require slit lamp evaluation every 4 months.\n  Those with negative ANA should be checked every 6 months."
        title: "مواعيد الـ slit lamp في السنة"
        alt: "Two timelines across 12 months. Top, ANA-positive oligoarthritis or iridocyclitis: slit lamp marks at months 0, 4, 8 and 12. Bottom, ANA-negative: marks at months 0, 6 and 12."
