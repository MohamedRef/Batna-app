  # Split from lesson4 and lesson5 on 2026-11-13 (#828): differential diagnosis and prognosis.
  - id: hem.L08.lesson5
    title: "CLL: مين هيعيش أطول؟"
    hook: "عيانين نفس الـ stage، واحد مستقر عشرين سنة والتاني بيتدهور. الفرق في الجينات."
    minutes: 10
    pages: [129, 131]
    topics: [cll-ddx, cll-prognosis]
    goals:
      - "تفرّق الـ CLL عن الـ reactive lymphocytosis والـ PLL"
      - "تعدّ الـ prognostic factors وتعرف ليه كل واحد"
      - "تفهم الـ IGHV والـ CD38 والـ micro RNAs والـ IRF4"
    status: unverified
    steps:
      - kind: explain
        remind: [hem.L08.081]
        page: 129
        title: "الـ DD والـ PLL"
        quote: "Many diseases can cause lymphocytosis: Pertusis, infectious mononucleosis, T.B, toxoplasmosis and autoimmune diseases. Many of these patients are younger and have fever or other acute symptoms such as rash and joint symptoms. The lymphocytosis is usually < 15000 and is not sustained, if doubt persists, monoclonal antibodies will distinguish the monoclonal lymphocytosis in CLL. Prolymphocytic leukemia (PLL) is an uncommon disease (10% of the incidence of CLL) and is characterized by massive splenomegaly, minimal lymph adenopathy, WMB count commonly > 100,000/dl with 10-90% prolymphocytes. A specific karyotypic abnormality t (6; 12) has been reported in PLL."
        text: |
          **Lymphocytosis تانية**: pertussis، infectious mononucleosis، tuberculosis (TB)، toxoplasmosis، autoimmune. دول **أصغر سنًا**، عندهم حرارة أو rash أو مفاصل، والـ lymphocytes عادةً **أقل من 15,000** و ==not sustained==. لو شاكك: **monoclonal antibodies**.

          ==Prolymphocytic leukemia (PLL)==: حوالي 10% من الـ CLL، **massive splenomegaly** مع غدد **قليلة**، white blood cell (WBC) غالبًا **فوق 100,000** فيه 10–90% prolymphocytes، و t(6;12).

          ليه الـ monoclonal antibodies بتحسم؟ التفسير المقبول (مش في الكتاب): الـ infection بيصحّي lymphocytes كتير مختلفة (polyclonal)، وبتختفي لما العدوى تخلص. الـ CLL خلية واحدة متكررة، فالـ markers بتاعتها كلها شبه بعض وما بتمشيش.
      - kind: check
        page: 129
        quote: "Many of these patients are younger and have fever or other acute symptoms such as rash and joint symptoms."
        question: "A 22-year-old with fever, sore throat and lymphocytes 9,000 that fall over 3 weeks. Most likely?"
        options:
          - "Reactive lymphocytosis, such as infectious mononucleosis"
          - "Early CLL"
          - "Prolymphocytic leukemia"
          - "Monoclonal B-cell lymphocytosis"
        answer: 0
        why:
          - "صح: صغير، حرارة، أقل من 15,000، ومش sustained: صورة reactive."
          - "الـ CLL أغلبها فوق 60 والعدد sustained."
          - "الـ PLL: طحال ضخم وWBC فوق 100,000."
          - "الـ MBL monoclonal ومش بيروح لوحده."
      - kind: explain
        page: 129
        title: "علامات الخطر"
        quote: "Prognostic factors\n  a. Late stages (Rai or Benit)/\n  b. Diffuse pattern of lymphocytic infilteration in B.M.\n  c. Advanced age.\n  d. Male sex"
        text: |
          - **Late stage** (Rai أو Binet)
          - ==Diffuse== marrow infiltration
          - **سن كبير** و **ذكر**
          - **β2-microglobulin**، uric acid، **lactate dehydrogenase (LDH)**، alkaline phosphatase عالية
          - تحوّل لـ **prolymphocytic leukaemia (PLL)**
          - **Multiple chromosomal abnormalities** ← خطر ==Richter syndrome== (large cell lymphoma)

          ليه الـ β2-microglobulin والـ LDH والـ uric acid؟ التفسير المقبول (مش في الكتاب): كلهم بيطلعوا من الخلايا لما تتقلب وتموت، فكل ما يعلوا، حجم المرض وسرعة دورانه أكبر. وليه الـ chromosomal abnormalities الكتير؟ لأن clone بيجمع غلطات أكتر أقرب إنه يتحول لـ lymphoma شرس.
      - kind: explain
        page: 130
        title: "الـ IGHV: الـ B cell اتعلمت ولا لأ؟"
        quote: "Many studies have confirmed the original finding that there were two forms of CLL, the unmutated type, associated with all the features of poor prognosis and mutated type, associated with stable disease and good prognosis."
        text: |
          الـ **somatic hypermutation**: بعد الـ recombination، الـ B cell في الـ **germinal centre** بتعدّل جينات الـ immunoglobulin علشان تعمل antibodies أقوى، وتطلع منها **memory B cells** و **plasma cells**.

          - ==Mutated immunoglobulin heavy-chain variable region (IGHV)==: مستقر، **good prognosis**.
          - ==Unmutated IGHV==: كل صفات الـ **poor prognosis**.

          ليه الـ mutation هنا علامة كويسة؟ التفسير المقبول (مش في الكتاب): الـ mutated يعني الخلية الأصلية عدّت على الـ germinal centre واتعلمت (أقرب للـ memory B cell الهادية). الـ unmutated جاية من خلية أصغر ما اتعلمتش، وبتستجيب لإشارات النمو أكتر، فبتمشي أسرع.
      - kind: reveal
        page: 130
        quote: "CD38 is a transmembrane glycoprotein which is highly expressed in unmutated cases, low percentages correlate with stable disease while, a high percentage of CD38 positive cells predicts a short time to disease progression and bad outcome."
        prompt: "ليه الـ CD38 بيمشي مع الـ unmutated؟"
        answer: |
          الـ **CD38** (transmembrane glycoprotein) بيبقى ==highly expressed== في الحالات الـ **unmutated**.

          علشان كده نسبة عالية من خلايا CD38 positive = **progression أسرع** و outcome وحش، والنسبة الواطية = مرض مستقر. والـ **ZAP-70** (tyrosine kinase مهم في T-cell signaling) marker تاني.
      - kind: sort
        page: 130
        quote: "CD38 is a transmembrane glycoprotein which is highly expressed in unmutated cases, low percentages correlate with stable disease while, a high percentage of CD38 positive cells predicts a short time to disease progression and bad outcome."
        prompt: "صنّف: بيشاور على prognosis أحسن ولا أوحش؟"
        bins: ["Better", "Worse"]
        cards:
          - { text: "Mutated IGHV", bin: 0 }
          - { text: "Low CD38", bin: 0 }
          - { text: "Nodular marrow", bin: 0 }
          - { text: "Unmutated IGHV", bin: 1 }
          - { text: "High CD38", bin: 1 }
          - { text: "Diffuse marrow", bin: 1 }
          - { text: "Male, older age", bin: 1 }
          - { text: "Low MIR-34a", bin: 1 }
        why: "الـ mutated IGHV والـ CD38 الواطي = مستقر. الـ diffuse pattern أكتر في الـ advanced stage. الـ unmutated والـ CD38 العالي والسن والذكورة = أوحش. الـ MIR-34a بيبقى واطي جدًا في الحالات الـ refractory للـ chemo."
      - kind: explain
        page: 130
        title: "الـ micro RNAs والجينات"
        quote: "Two micro RNAs, MIR 15 and MR16 are located at 13q 14, a region frequently deleted in CLL, both micro RNAs target BCL2 which is overexpressed in CLL."
        text: |
          الـ **micro ribonucleic acids (RNAs)** جزيئات قصيرة non-coding بتنظّم حوالي **تلت** جينات الإنسان.

          - ==MIR-15 و MIR-16== على **13q14** (بتتمسح كتير في الـ chronic lymphocytic leukaemia (CLL))، وبيكتموا ==b-cell lymphoma 2 (BCL2)==. يعني لو اتمسحوا ← BCL2 يعلى ← الخلية ما تموتش.

          الـ 13q14 deletion نفسها بتشوفها في الحالات الـ **benign** وفي الـ MBL، لأن الخلية لسه ما جمعتش غلطات تانية.
      - kind: figure
        page: 130
        quote: "Two micro RNAs, MIR 15 and MR16 are located at 13q 14, a region frequently deleted in CLL, both micro RNAs target BCL2 which is overexpressed in CLL."
        title: "13q14 والـ BCL2"
