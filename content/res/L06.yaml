      A painkiller approved after phase III is withdrawn from the market three years later because a rare
      cardiovascular adverse effect appears in thousands of users. Which phase detected it?
    options:
      - Phase I
      - Phase II
      - Phase III
      - Phase IV
    answer: 3
    why:
