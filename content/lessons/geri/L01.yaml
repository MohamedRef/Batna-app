lecture: geri.L01
lessons:
  # ------------------------------------------------------------------
  - id: geri.L01.lesson1
    title: "قلب عنده 80 سنة: إيه اللي اتغيّر؟"
    hook: "القلب العجوز مش قلب شاب تعبان، ده قلب ليه قواعد تانية. افهمها وانت تفهم نص المحاضرة."
    minutes: 8
    pages: [1, 3]
    topics: [aging]
    goals:
      - "تعدّ التغييرات اللي بتحصل في القلب مع السن (سؤال كتاب Q1)"
      - "تربط كل تغيير بالمرض اللي بيعمله"
      - "تحل أول مسألتين PS1 و PS2"
    status: unverified
    steps:
      - kind: explain
        page: 1
        title: "أول اتنين: amyloid و AF"
        quote: "Amyloid deposition may be a frequent cause of cardiac conduction disease and Amyloid heart disease → Restrictive Cardiomyopathy → heart failure in the elderly."
        text: |
          مع السن الـ ==amyloid== بيترسّب في القلب:
          - يبوّظ الـ **conduction system**، ويعمل **conduction disease**.
          - ويعمل **amyloid heart disease** ← **restrictive cardiomyopathy** ← **heart failure**.

          وأشهر arrhythmia عند الكبار هي ==atrial fibrillation==: حوالي **الثلث**، وكتير بتبقى **"lone" AF** (من غير سبب واضح).
      - kind: explain
        page: 2
        title: "قلب ناشف، ضغط بيقع"
        quote: "Left ventricular stiffness → impaired diastolic filling which declines 50% between ages 20 and 80 → diastolic heart failure."
        text: |
          الـ **left ventricle** بيبقى ==stiff==، فالـ **diastolic filling** بيقل **50%** ما بين سن 20 و 80 ← **diastolic heart failure**.

          والقلب الناشف ده **حساس جدًا للـ filling volume**: يقل السوايل شوية والـ output يقع. ومعاه **heart rate response** ضعيف للـ stress.

          النتيجة: **postural hypotension** في **20%** من الكبار ← **syncope**.
      - kind: aside
        tone: analogy
        page: 2
        quote: "The combination of sensitivity to filling volumes and impaired heart rate response to stress may explain the syndrome of postural hypotension in 20%"
        text: "تخيّل الـ **stiff LV** زي بلونة جلد قديمة ناشفة: محتاجة ضغط عالي علشان تتملي، ولو الميه قلت شوية مش هتتملي خالص. وفوق ده الـ pump مش بيعرف يسرّع لما تقف. فيقف الحاج من على الكنبة ويدوخ: ده الـ **postural hypotension**، والـ heart rate response للـ stress ضعيف."
      - kind: explain
        page: 2
        title: "الصمامات والأورطي والكهربا"
        quote: "The Aorta dilates and it‘s walls thicken as medial walls calcify; with this loss of elasticity → increase in systolic blood pressure"
        text: |
          - **Coronary atherosclerosis** شائع، ومعاه ==silent MI==.
          - الصمامات (خصوصًا **mitral** و **aortic**) بتتخن وتنشف ← **calcific stenosis**.
          - الـ **aorta** بتوسع وجدارها يتكلّس ← تفقد الـ elasticity ← **systolic BP** يعلى من سن **30** لحد **منتصف السبعينات**، وبعدين يقل في الـ 80s و 90s.
          - بتقل **pacemaker cells** في الـ sinus node والـ fibers في الـ bundle branches ← **sick sinus syndrome** و **AV block**.
      - kind: reveal
        page: 2
        quote: "with this loss of elasticity → increase in systolic blood pressure"
        prompt: "ليه الكبار عندهم systolic عالي والـ diastolic مش عالي قوي؟"
        answer: |
          الأورطي المرن بيشيل جزء من الدم في الـ systole ويرجّعه في الـ diastole (زي خزان). لما يتكلّس ويفقد الـ **elasticity**، الضربة بتطلع كلها مرة واحدة ← **systolic** يعلى، ومفيش رجوع في الـ diastole ← الـ diastolic مش بيعلى (وممكن يقل).

          ده تفسير فسيولوجي؛ الكتاب بيقول: loss of elasticity ← increase in systolic BP.
      - kind: aside
        tone: exam
        page: 2
        quote: "The most important principle in the approach to cardio-vascular disorders with advancing age is to recognize the narrowed homeostatic capacity of the elderly."
        text: "لو سألك «أهم principle في التعامل مع أمراض القلب عند الكبار؟» الإجابة جملة واحدة: **recognize the narrowed homeostatic capacity of the elderly**. الهامش ضيق: جرعة زيادة، أو سوايل أقل، أو عدوى بسيطة، وكله يقع."
      - kind: mnemonic
        page: 2
        quote: "Coronary Atherosclerosis is common and Silent MI."
        word: "AADPCVS"
        parts:
          - { key: "A", text: "Amyloid: conduction disease, restrictive cardiomyopathy" }
          - { key: "A", text: "AF: one-third, often lone" }
          - { key: "D", text: "Diastolic HF: LV stiffness, filling down 50%" }
          - { key: "P", text: "Postural hypotension (20%) and syncope" }
          - { key: "C", text: "Coronary atherosclerosis and silent MI" }
          - { key: "V", text: "Valves: calcific mitral and aortic stenosis" }
          - { key: "S", text: "Systolic hypertension (stiff aorta) and sick sinus / AV block" }
        hook: "**AA DP CVS**: «عَ عَ، دي بي سي في إس». اتنين A وبعدين كأنك بتقول DP و CVS. ده ردّك على Q1."
      - kind: figure
        page: 2
        quote: "Loss of pacemaker cells in the sinus node and conduction fibers in the bundle branches in the aging heart"
        title: "التغيير ← المرض"
        alt: "Five age-related changes on the left each with an arrow to the disease it causes on the right: amyloid to conduction disease and restrictive cardiomyopathy, stiff LV to diastolic heart failure and postural hypotension, calcified valves to calcific aortic and mitral stenosis, stiff aorta to systolic hypertension, loss of pacemaker cells to sick sinus syndrome and AV block."
        caption: "كل تغيير مع السن بيعمل مرض معروف. افتكر الشمال تفتكر اليمين."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L01a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="8" y="10" width="120" height="44" rx="8" class="fg-box"/>
            <text x="68" y="37" text-anchor="middle" class="t-sm t-b">Amyloid</text>
            <rect x="178" y="10" width="144" height="44" rx="8" class="fg-bad"/>
            <text x="250" y="29" text-anchor="middle" class="t-sm">Conduction disease</text>
            <text x="250" y="45" text-anchor="middle" class="t-sm">Restrictive CMP</text>
            <path d="M130 32 H174" class="fg-arrow" marker-end="url(#L01a)"/>
            <rect x="8" y="68" width="120" height="44" rx="8" class="fg-box"/>
            <text x="68" y="95" text-anchor="middle" class="t-sm t-b">Stiff LV</text>
            <rect x="178" y="68" width="144" height="44" rx="8" class="fg-bad"/>
            <text x="250" y="87" text-anchor="middle" class="t-sm">Diastolic HF</text>
            <text x="250" y="103" text-anchor="middle" class="t-sm">Postural hypotension</text>
            <path d="M130 90 H174" class="fg-arrow" marker-end="url(#L01a)"/>
            <rect x="8" y="126" width="120" height="44" rx="8" class="fg-box"/>
            <text x="68" y="153" text-anchor="middle" class="t-sm t-b">Calcified valves</text>
            <rect x="178" y="126" width="144" height="44" rx="8" class="fg-bad"/>
            <text x="250" y="145" text-anchor="middle" class="t-sm">Calcific aortic and</text>
            <text x="250" y="161" text-anchor="middle" class="t-sm">mitral stenosis</text>
            <path d="M130 148 H174" class="fg-arrow" marker-end="url(#L01a)"/>
            <rect x="8" y="184" width="120" height="44" rx="8" class="fg-box"/>
            <text x="68" y="211" text-anchor="middle" class="t-sm t-b">Stiff aorta</text>
            <rect x="178" y="184" width="144" height="44" rx="8" class="fg-bad"/>
            <text x="250" y="203" text-anchor="middle" class="t-sm">Systolic BP up</text>
            <text x="250" y="219" text-anchor="middle" class="t-sm">(30 to mid-70s)</text>
            <path d="M130 206 H174" class="fg-arrow" marker-end="url(#L01a)"/>
            <rect x="8" y="242" width="120" height="44" rx="8" class="fg-box"/>
            <text x="68" y="261" text-anchor="middle" class="t-sm t-b">Fewer pacemaker</text>
            <text x="68" y="277" text-anchor="middle" class="t-sm t-b">cells</text>
            <rect x="178" y="242" width="144" height="44" rx="8" class="fg-bad"/>
            <text x="250" y="261" text-anchor="middle" class="t-sm">Sick sinus syndrome</text>
            <text x="250" y="277" text-anchor="middle" class="t-sm">AV block</text>
            <path d="M130 264 H174" class="fg-arrow" marker-end="url(#L01a)"/>
          </svg>
      - kind: case
        page: 2
        quote: "Heart valves thicken and stiffen, particularly the Mitral and Aortic ( calcific stenosis)."
        stem: "PS (1): A 72-year-old smoker with obesity and diabetes (on metformin and aspirin) has exertional dyspnea, a delayed-peak pulse, an LV heave, an S4 and a IV/VI mid-systolic murmur at the base radiating to the carotids."
        steps:
          - question: "What is the valve lesion?"
            options:
              - "Aortic stenosis"
              - "Mitral regurgitation"
              - "Aortic regurgitation"
              - "Hypertrophic cardiomyopathy"
            answer: 0
            why: "Delayed (slow-rising) pulse, basal ejection murmur to the carotids and an S4 from a hypertrophied stiff LV = aortic stenosis. MR is apical pansystolic; AR is diastolic; HCM does not radiate to the carotids."
          - reveal: "Echo: severe aortic stenosis, no other valve lesion."
            question: "What most likely contributed to it?"
            options:
              - "Diabetes mellitus"
              - "Congenital bicuspid valve"
              - "Occult rheumatic heart disease"
              - "Connective tissue disease"
            answer: 0
            why: "At 72 it is calcific degenerative AS, and DM, smoking and obesity are the same risk factors that calcify arteries. Bicuspid valves present earlier; rheumatic disease hits the mitral too; connective tissue disease gives AR. (The book prints no key.)"
      - kind: figure
        page: 3
        title: "ECG بتاع PS (2)"
        image: { file: geri/L01-af-ecg.webp, book: true }
        caption: "ست عندها 70 سنة، نهجان من شهور وجت بـ chest pain. بص على الـ rhythm strip: مفيش P waves واضحة، والمسافات بين الـ QRS مش متساوية. ده ==atrial fibrillation==، أشهر arrhythmia عند الكبار. (الكتاب ما كتبش الإجابة.)"
        alt: "The book's 12-lead ECG for problem 2: narrow QRS complexes at irregular intervals with no clear P waves."
      - kind: check
        page: 1
        quote: "Most common arrhythmia seen is atrial fibrillation (⅓ in older individuals) and is often ―lone‖ atrial fibrillation"
        question: "What does the ECG of PS (2) show?"
        options:
          - "Atrial fibrillation"
          - "Myocardial infarction"
          - "Sinus tachycardia"
          - "Pericarditis"
        answer: 0
        why:
          - "صح: irregular RR ومفيش P waves = AF."
          - "مفيش ST elevation ولا Q waves."
          - "الـ sinus tachycardia منتظمة وقبل كل QRS في P."
          - "الـ pericarditis بتعمل ST elevation منتشرة و PR depression."
      - kind: try
        items: [geri.L01.002, geri.L01.003, geri.L01.006, geri.L01.009]
    recap:
      - "Amyloid ← conduction disease و restrictive cardiomyopathy."
      - "AF أشهر arrhythmia: الثلث، وكتير lone."
      - "LV stiff ← الـ filling يقل 50% ← diastolic HF و postural hypotension (20%)."
      - "أورطي ناشف ← systolic BP يعلى من 30 لمنتصف السبعينات."
      - "أهم principle: narrowed homeostatic capacity."
    practice: [geri.L01.001, geri.L01.002, geri.L01.003, geri.L01.004, geri.L01.005, geri.L01.006, geri.L01.007, geri.L01.008, geri.L01.009, geri.L01.010, geri.L01.011, geri.L01.112]
  # ------------------------------------------------------------------
  - id: geri.L01.lesson2
    title: "الضغط: رقمين، guidelineين، وحاج عنده 85"
    hook: "130 ولا 140؟ الإجابة بتعتمد على مين بيسأل، وعلى سن العيان، وعلى هو frail ولا لأ."
    minutes: 10
    pages: [4, 7]
    topics: [htn, htn-treatment]
    goals:
      - "تحفظ أرقام الـ key facts"
      - "تقارن ACC/AHA بـ ESC/ESH"
      - "تعالج الضغط في الـ 65–79 والـ 80+ والـ frail"
    status: unverified
    steps:
      - kind: explain
        page: 4
        title: "Key facts"
        quote: "An estimated 1.28 billion adults aged 30–79 years worldwide have hypertension, most (two-thirds) living in low- and middle-income countries"
        text: |
          - **1.28 billion** بالغ (30–79 سنة) عندهم ضغط، **الثلثين** في الدول الفقيرة والمتوسطة.
          - **46%** مش عارفين إن عندهم ضغط.
          - **42%** بس متشخصين وبيتعالجوا.
          - **21%** (واحد من خمسة) الضغط عندهم ==under control==.

          والضغط **major cause of premature death**. وأخطاء قياس الضغط سبب كبير للـ misclassification.
      - kind: aside
        tone: tip
        page: 4
        quote: "Less than half of adults (42%) with hypertension are diagnosed and treated. Approximately 1 in 5 adults (21%) with hypertension have it under control."
        text: "افتكرها كده: **46** مش عارفين، **42** بيتعالجوا، **21** متظبطين. كل رقم تقريبًا نص اللي قبله: 42 ← 21."
      - kind: reveal
        page: 4
        quote: "You are unable to confirm the diagnosis of hypertension with ambulatory blood pressure monitoring (ABPM)"
        prompt: "PS (3): سوّاق أتوبيس، 63 سنة، ضغطه في العيادة 176/108 و LVH على الـ ECG، ورافض الـ ABPM علشان شغله. تأكّد التشخيص بإيه؟"
        answer: |
          بـ **home blood pressure monitoring (HBPM)**: يقيس في البيت بجهاز معتمد، قراءتين الصبح وقراءتين بالليل لمدة كام يوم، وتاخد المتوسط.

          الكتاب ما كتبش الإجابة؛ دي الإجابة المعروفة (NICE). والـ LVH بيقولك إن الضغط ده قديم وعامل target organ damage.
      - kind: table
        page: 5
        quote: "Definition of hypertension (mm Hg) >130/80 > 140/90"
        title: "ACC/AHA 2017 ضد ESC/ESH 2018"
        columns: [Point, ACC/AHA, ESC/ESH]
        rows:
          - [Hypertension, ">130/80", ">140/90"]
          - [Normal, "<120/80", "120–129/80–84"]
          - [High normal, "120–129/<80", "130–139/85–89"]
          - [Grade 1, "130–139/80–89", "140–159/90–99"]
          - [Grade 2, "≥140/90", "160–179/100–109"]
          - [Grade 3, "None", "≥180/110"]
          - [Target <65 y, "<130/80", "<130/80"]
          - [Target ≥65 y, "<130/80", "<140/80"]
        hide: [[0, 1], [0, 2], [3, 1], [3, 2], [7, 2]]
      - kind: aside
        tone: trap
        page: 5
        quote: "Grade 1, 130–139/80–89 Grade 2, ≥140/90"
        text: "الفخ: **الأمريكان أشد**. عندهم الضغط يبدأ من **130/80**، وعندهم **grade 2** بس. الأوروبيين يبدأوا من **140/90** وعندهم **3 grades**، و **optimal <120/80**. والـ target فوق 65 عند الأوروبيين **<140/80**."
      - kind: update
        page: 5
        quote: "Target blood pressure in various subsets ≤65 y, <130/80 ≥65 y, <130/80 <65 y, <130/80 ≥65 y, <140/80"
        text: "الـ ESC 2024 عمل category جديدة اسمها **elevated BP** (120–139/70–89)، والـ target بقى systolic **120–129** لو العيان مستحمل، حتى عند أغلب الكبار، ويتساهل فوق **85** أو في الـ frail. في الامتحان: جدول الكتاب."
        ref: "ESC Guidelines for the management of elevated blood pressure and hypertension, 2024"
      - kind: check
        page: 5
        quote: "Grade 1, 130–139/80–89 Grade 2, ≥140/90"
        question: "Office BP repeatedly 136/86 mmHg. ACC/AHA and ESC/ESH call it:"
        options:
          - "ACC/AHA grade 1; ESC/ESH high normal"
          - "Hypertension in both"
          - "Normal in both"
          - "ACC/AHA high normal; ESC/ESH grade 1"
        answer: 0
        why:
          - "صح: 130–139/80–89 = grade 1 أمريكاني، و 130–139/85–89 = high normal أوروبي."
          - "الأوروبي ما بيقولش hypertension غير فوق 140/90."
          - "الـ normal تحت 120/80 أو 120–129/80–84."
          - "معكوسة: الأمريكي هو اللي بيقول grade 1."
      - kind: figure
        page: 6
        quote: "Avoid harmful habits ,smoking ,alcohol Reduce salt and high fat diets Loose weight , if obese Regular exercise DASH diet"
        title: "سلّم العلاج من غير أدوية"
        alt: "Five ascending stairs: avoid smoking and alcohol at the bottom, then reduce salt and fat, lose weight if obese, regular exercise, and DASH diet at the top."
        caption: "نفس سلّم الكتاب: تطلعه درجة درجة. والـ lifestyle modification لكل عيان ضغط من غير استثنا."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="180" width="300" height="40" class="fg-box"/>
            <text x="20" y="205" class="t-sm t-b">1. Avoid smoking, alcohol</text>
            <rect x="60" y="140" width="250" height="40" class="fg-box"/>
            <text x="70" y="165" class="t-sm t-b">2. Reduce salt and high fat</text>
            <rect x="110" y="100" width="200" height="40" class="fg-box"/>
            <text x="120" y="125" class="t-sm t-b">3. Lose weight if obese</text>
            <rect x="160" y="60" width="150" height="40" class="fg-box"/>
            <text x="170" y="85" class="t-sm t-b">4. Regular exercise</text>
            <rect x="210" y="20" width="100" height="40" class="fg-acc"/>
            <text x="220" y="45" class="t-sm t-b t-acc">5. DASH diet</text>
          </svg>
      - kind: explain
        page: 6
        title: "أول دوا"
        quote: "Stage 1 Hypertension (SBP 140–159 or DBP 90–99 mmHg) Thiazide-type diuretics for most."
        text: |
          الـ algorithm بتاع الكتاب: lifestyle، ولو مش at goal، يعني فوق **140/90** أو فوق **130/80** في **diabetes** و **CKD**:
          - **Stage 1** (140–159 / 90–99): ==thiazide-type diuretic== لأغلبهم، أو ACEI أو ARB أو BB أو CCB.
          - **Stage 2** (≥160 / ≥100): **two-drug combination** ، عادة thiazide + ACEI أو ARB أو BB أو CCB.
          - **Compelling indication**: الدوا بتاع الـ indication نفسها.

          لسه مش at goal؟ ظبّط الجرعات أو زوّد دوا، وفكّر في hypertension specialist.
      - kind: table
        page: 7
        quote: "AGE 65-79 years SBP ≥140 mm Hg and/or DBP ≥90 mm Hg AGE ≥80 years SBP ≥160 mm Hg"
        title: "الكبار: 65–79 ضد 80+"
        columns: [Point, "65–79 y", "≥80 y"]
        rows:
          - [Treat at, "SBP ≥140", "SBP ≥160"]
          - [Start, "Combination, lowest dose", "Single drug, low dose"]
          - [Uncontrolled, "Increase doses", "Add combinations"]
          - [Adherence, "Fixed combos", "Fixed combos"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2]]
      - kind: explain
        page: 7
        title: "الـ frail حكاية لوحدها"
        quote: "loop diuretics and alpha-blockers should be avoided because of their association with injurious falls"
        text: |
          قبل أي حاجة: ==evaluate frailty== والـ comorbidities.
          - **Fit** old و very old: lifestyle **+** أدوية.
          - **Frail**: الأدوية ممكن لو مستحملها، و ==avoid combinations==.
          - **De-prescription** مؤقت أو دائم: لو SBP **≤130**، أو acute illness، أو تغيّر درجة الحرارة (الصيف بيوسّع الأوعية).
          - **Monitor**: postural hypotension، hypotensive episodes، **injurious falls**، وظايف الكلى.

          الأدوية المفضلة: thiazide-like و ACEI و ARB و dihydropyridine CCB. وابعد عن ==loop diuretics و alpha-blockers== (مرتبطين بالوقعات).
      - kind: aside
        tone: joke
        text: "الـ alpha-blocker للحاج اللي عنده 85 سنة زي ما تديله باتيناج: الضغط هيتظبط فعلًا، بس هو مش هيفضل واقف علشان يقيسه. 🛼"
      - kind: case
        page: 7
        quote: "Consider temporary or permanent de-prescription in specific situations"
        stem: "An 82-year-old woman who lives alone and walks with a stick has repeated SBP readings of 168 mmHg. She fell once last winter."
        steps:
          - question: "Treat?"
            options:
              - "Yes: at ≥80 treat from SBP ≥160"
              - "No: at ≥80 the threshold is 180"
              - "No: never start drugs after 80"
            answer: 0
            why: "ESC/ESH: ≥80 years → SBP ≥160 and/or DBP ≥90."
          - question: "Start with?"
            options:
              - "One drug, low dose (e.g. a thiazide-like diuretic or CCB)"
              - "Fixed triple combination"
              - "Furosemide plus doxazosin"
            answer: 0
            why: "Over 80 a single low-dose drug; in the frail avoid combinations; loop diuretics and alpha-blockers raise injurious falls."
          - reveal: "In August she has a chest infection; SBP 124, dizzy on standing."
            question: "Now?"
            options:
              - "Consider temporary de-prescription"
              - "Add a second drug"
              - "Ignore it"
            answer: 0
            why: "SBP ≤130, acute illness and hot weather are all reasons to consider de-prescription, with postural BP checks."
      - kind: try
        items: [geri.L01.013, geri.L01.016, geri.L01.023, geri.L01.020, geri.L01.025]
    recap:
      - "46% مش عارفين، 42% بيتعالجوا، 21% متظبطين."
      - "ACC/AHA: الضغط >130/80. ESC/ESH: >140/90، و target ≥65 = <140/80."
      - "Stage 1: thiazide لأغلبهم. Stage 2: combination."
      - "65–79: علاج من SBP ≥140 و combination. ≥80: من SBP ≥160 و single drug."
      - "Frail: ممنوع combinations، فكّر في de-prescription، وابعد عن loop diuretics و alpha-blockers."
