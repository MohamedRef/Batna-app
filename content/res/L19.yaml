  kind: case
  topic: appraise
  stem: A double-blind RCT of 111 patients compared botulinum toxin with internal lateral sphincterotomy for chronic anal
    fissure. At 12 months success was 75% (46/61) with botulinum and 94% (47/50) with sphincterotomy. Sphincterotomy caused
    anal incontinence in 16% (8/50); botulinum caused no complications.
  steps:
  - question: Taking failure to heal as the bad outcome, what is the ARR of sphincterotomy over botulinum?
    options:
    - 0.19 (25% − 6%)
    - '0.31'
    - '0.06'
    - '0.75'
    answer: 0
    why: 'Not healed: botulinum (CER) 25%, sphincterotomy (EER) 6%. ARR = CER − EER = 0.25 − 0.06 = 0.19.'
  - question: What NNT does the slide give?
    options:
    - '5'
    - '19'
    - '2'
    - '10'
    answer: 0
    why: NNT = 1/ARR = 1/0.19 = 5 on the slide (5.26 before rounding).
  - question: What is the NNH for anal incontinence with sphincterotomy?
    options:
    - '6'
    - '16'
    - '3'
    - '8'
    answer: 0
    why: ARI = 0.16 − 0 = 0.16; NNH = 1/0.16 = 6 on the slide (6.25).
  - question: 'What is the likelihood of being helped vs harmed (1/NNT : 1/NNH)?'
    options:
    - '1.2'
    - '0.8'
    - '30'
    - '11'
    answer: 0
    why: '(1/5 : 1/6) = (0.2 : 0.16) = 1.2, as the slide works it out.'
  src:
    page: 103
    quote: |-
      Answer
      Percentage of patients not healed by internal sphincterotomy (EER) = 6%
      Percentage of patients not healed by botulinum toxin (CER) = 25%
      Absolute reduction of risk (ARR) = CER − EER= 0.25 − 0.06 = 0.19
      Number needed to treat (NNT):1/ARR = 1/0.19 = 5
      Percentage of patients harmed by internal sphincterotomy = 16%
      Percentage of patients harmed by botulinum toxin = 0%
      Absolute risk increase (ARI) = 0.16 − 0 = 0.16
      Number needed to harm (NNH): 1/ARI = 1/0.16 = 6
      Likelihood of being helped vs harmed: (1/NNT vs 1/NNH) = (1/5:1/6) = (0.2:0.16) =1.2.
