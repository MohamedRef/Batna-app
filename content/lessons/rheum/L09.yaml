  - id: rheum.L09.lesson2
    title: "الجلد والرئة والـ antibodies"
    hook: "جفون بنفسجي، صوابع خشنة، ونَفَس بيقصر: الـ antibody هيقولك هتخاف من إيه."
    minutes: 8
    pages: [166, 167]
    topics: [extramuscular, antibodies]
    goals:
      - "تعرف علامات الجلد في الـ DM"
      - "تربط الـ ILD بالـ antisynthetase والـ MDA5"
      - "تحفظ جدول الـ MSAs"
    status: unverified
    steps:
      - kind: table
        page: 166
        quote: "Heliotrope rash (purple discoloration of eyelids). Gottron's papules (scaly, erythematous plaques over joints)."
        title: "جلد الـ DM"
        columns: [Sign, Where]
        rows:
          - ["Heliotrope", "Purple eyelids"]
          - ["Gottron's papules", "Scaly red plaques over joints"]
          - ["Shawl and V-sign", "Photosensitive, shoulders and chest"]
          - ["Mechanic's hands", "Fissured hyperkeratotic palms"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: explain
        page: 166
        title: "الرئة والمفاصل والقلب"
        quote: "Interstitial lung disease (ILD) is common, particularly in antisynthetase syndrome."
        text: |
          - **ILD** شائعة، خصوصًا في ==antisynthetase syndrome==: cough، dyspnoea، **restrictive** defect
          - **Rapidly progressive ILD** ← ==anti-MDA5==
          - المفاصل: arthralgia و **non-erosive** arthritis شبه الـ RA
          - القلب: arrhythmias، conduction defects، myocarditis، وغالبًا **subclinical** فاعمل **ECG و echo**
      - kind: figure
        page: 167
        quote: "Anti-Mi-2: Associated with classic DM and good prognosis. Anti-MDA5: Linked to clinically amyopathic DM and rapidly progressive ILD."
        title: "خريطة الـ antibodies"
        alt: "A map of myositis-specific antibodies. Mi-2 points to classic DM with good prognosis; MDA5 to amyopathic DM and rapidly progressive ILD; TIF1-gamma to adult DM and cancer; NXP2 to juvenile DM; SAE to skin disease and dysphagia; SRP and HMGCR to necrotizing myopathy. A side box lists myositis-associated antibodies Ro, U1-RNP, PM/Scl and Ku for overlap."
        caption: "كل antibody ليه شخصية: ==TIF1γ = cancer==، ==MDA5 = رئة بتجري==، و **Mi-2** هو الطيب."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="150" height="45" rx="8" class="fg-good"/><text x="85" y="30" text-anchor="middle" class="t-sm t-b">Anti-Mi-2</text><text x="85" y="47" text-anchor="middle" class="t-sm">classic DM, good</text>
            <rect x="170" y="10" width="150" height="45" rx="8" class="fg-bad"/><text x="245" y="30" text-anchor="middle" class="t-sm t-b">Anti-MDA5</text><text x="245" y="47" text-anchor="middle" class="t-sm">CADM, RP-ILD</text>
            <rect x="10" y="65" width="150" height="45" rx="8" class="fg-bad"/><text x="85" y="85" text-anchor="middle" class="t-sm t-b">Anti-TIF1γ</text><text x="85" y="102" text-anchor="middle" class="t-sm">adult DM, cancer</text>
            <rect x="170" y="65" width="150" height="45" rx="8" class="fg-acc"/><text x="245" y="85" text-anchor="middle" class="t-sm t-b">Anti-NXP2</text><text x="245" y="102" text-anchor="middle" class="t-sm">juvenile DM</text>
            <rect x="10" y="120" width="150" height="45" rx="8" class="fg-acc"/><text x="85" y="140" text-anchor="middle" class="t-sm t-b">Anti-SAE</text><text x="85" y="157" text-anchor="middle" class="t-sm">skin, dysphagia</text>
            <rect x="170" y="120" width="150" height="45" rx="8" class="fg-acc"/><text x="245" y="140" text-anchor="middle" class="t-sm t-b">SRP, HMGCR</text><text x="245" y="157" text-anchor="middle" class="t-sm">IMNM</text>
            <rect x="10" y="185" width="310" height="60" rx="10" class="fg-thin"/>
            <text x="165" y="208" text-anchor="middle" class="t-sm t-b">Myositis-associated (overlap)</text>
            <text x="165" y="230" text-anchor="middle" class="t-sm">Ro/SSA · U1-RNP · PM/Scl · Ku</text>
            <text x="165" y="275" text-anchor="middle" class="t-sm t-mut">MSAs define subsets</text>
            <text x="165" y="295" text-anchor="middle" class="t-sm t-mut">and predict prognosis</text>
          </svg>
      - kind: match
        page: 167
        quote: "Anti-TIF1γ: Seen in adult-onset DM and linked to malignancy. Anti-NXP2: More common in juvenile DM."
        prompt: "وصّل الـ antibody باللي بيتوقعه:"
        pairs:
          - ["Anti-TIF1γ", "Malignancy"]
          - ["Anti-MDA5", "Rapidly progressive ILD"]
          - ["Anti-NXP2", "Juvenile DM"]
          - ["Anti-HMGCR", "Necrotizing myopathy"]
          - ["Anti-Mi-2", "Good prognosis"]
        why: "TIF1γ = adult DM + cancer، MDA5 = CADM + RP-ILD، NXP2 = الأطفال، HMGCR و SRP = IMNM، و Mi-2 = classic DM بـ prognosis كويس."
      - kind: aside
        tone: tip
        page: 167
        quote: "Anti-MDA5: Linked to clinically amyopathic DM and rapidly progressive ILD."
        text: |
          فخ: عيان **من غير ضعف** (CADM) ممكن يكون ==الأخطر==، لو عنده **anti-MDA5**: الرئة بتتليف بسرعة. ما تطمنش علشان الـ CK طبيعي.
      - kind: check
        page: 167
        quote: "Anti-Ro/SSA, Anti-U1-RNP, Anti-PM/Scl, Anti-Ku – Often seen in overlap syndromes."
        question: "Anti-PM/Scl and anti-Ku are best described as:"
        options:
          - "Myositis-associated antibodies seen in overlap syndromes"
          - "Myositis-specific antibodies of juvenile DM"
          - "Markers of malignancy"
          - "Markers of IMNM"
        answer: 0
        why:
          - "صح: MAAs، غالبًا في الـ overlap."
          - "الـ juvenile DM: anti-NXP2."
          - "الـ malignancy: anti-TIF1γ."
          - "الـ IMNM: SRP و HMGCR."
      - kind: try
        items: [rheum.L09.019, rheum.L09.020, rheum.L09.024, rheum.L09.025, rheum.L09.026]
    recap:
      - "جلد الـ DM: heliotrope، Gottron's، shawl/V، mechanic's hands."
      - "ILD: antisynthetase، و RP-ILD = anti-MDA5. القلب subclinical فاعمل ECG و echo."
      - "Mi-2 طيب، MDA5 رئة، TIF1γ cancer، NXP2 أطفال، SAE جلد وبلع، SRP/HMGCR = IMNM."
    practice: [rheum.L09.019, rheum.L09.020, rheum.L09.021, rheum.L09.022, rheum.L09.023, rheum.L09.024, rheum.L09.025, rheum.L09.026, rheum.L09.027, rheum.L09.043, rheum.L09.045, rheum.L09.046, rheum.L09.051]
