  - id: neph.L09.lesson10
    title: "المتبرع الحي: نحميه قبل ما ناخد كليته"
    hook: "المتبرع سليم، وهيعيش بكلية واحدة باقي عمره. كل فحص هنا علشان ما نعملش منه عيان."
    minutes: 9
    pages: [322, 325]
    topics: [tx-donor]
    goals:
      - "تعرف أنواع المتبرعين وميزة المتبرع الحي"
      - "تعرف فحوصات المتبرع وليه كل واحد"
      - "تعرف أنهي كلية بتتاخد والمتابعة بعد التبرع"
    status: unverified
    steps:
      - kind: explain
        page: 322
        title: "أنواع المتبرعين"
        quote: "Living donor: A: Blood related- B: unrelated: emotionaly motivated- Commercially motivated (the latter is forbidden)."
        text: |
          **Living**: قريب بالدم، أو غير قريب بدافع عاطفي. أما ==commercially motivated فممنوع==.

          **Cadaveric**: beating heart (brain-stem death) أو non-beating heart.

          الـ living donor مميزاته: **متاح فورًا**، ==cold ischaemia قصير==، ووظيفة الكلية ممتازة. والـ living unrelated بيعيش زي الـ cadaver اللي human leucocyte antigens (HLA) بتاعه متطابق تمامًا.

          المتبرع لازم يكون سليم من أي حاجة تأذيه (سمنة شديدة، prediabetes، تاريخ عائلي لمرض كلى وراثي). على المدى البعيد ممكن hyperfiltration: HTN، proteinuria، FSGS.

          ليه الـ unrelated بيعيش زي الـ HLA-identical cadaver؟ التفسير المقبول (مش في الكتاب): لأن ميزة الـ **living** (كلية سليمة، cold ischaemia قصير، من غير brain death) بتعوّض الـ HLA mismatch. يعني الكلية الصحية في الأول أهم من الـ matching على المدى ده. وليه التجاري ممنوع؟ لأن الفلوس بتضغط على الفقير يتبرع وهو مش مقتنع أو مش مناسب طبيًا، وبيفتح باب الاتجار. وليه الـ hyperfiltration؟ لأن الكلية الباقية بتشتغل عن اتنين، فالـ glomeruli بتتمدد، وده على سنين ممكن يعمل ضغط و proteinuria.

          وليه الـ beating heart أحسن من الـ non-beating؟ التفسير المقبول (مش في الكتاب): في الـ brain stem death القلب لسه شغال، فالكلية متروية لحد ما الجراح ياخدها، والـ warm ischaemia تقريبًا صفر. في الـ non-beating heart الدم وقف قبل الأخد بدقايق، فالكلية اتعرضت لـ warm ischaemia، وبتبدأ غالبًا بـ delayed graft function (ATN) ومحتاجة غسيل كام أسبوع لحد ما تشتغل.
      - kind: check
        page: 322
        quote: "Living donor: A: Blood related- B: unrelated: emotionaly motivated- Commercially motivated (the latter is forbidden)."
        question: "Which type of living kidney donation does the book forbid?"
        options:
          - "Commercially motivated"
          - "Emotionally motivated unrelated"
          - "Blood related"
          - "Non-beating heart cadaveric"
        answer: 0
        why:
          - "صح: ==commercially motivated== ممنوع."
          - "الـ unrelated بدافع عاطفي (زوج، صديق) مسموح."
          - "القريب بالدم أشهر نوع."
          - "ده نوع من الـ cadaveric، ومسموح."
      - kind: explain
        remind: [neph.L09.134, neph.L09.131]
        page: 323
        title: "فحص المتبرع الحي"
        quote: "Estimate GFR using serum creatinine-based estimating equations and confirm with one or more of the following according to availability: measured GFR using an exogenous filtration marker, (eg.urinary clearance of 99mTc- DTPA) measured creatinine clearance, estimated GFR from the combination of serum creatinine and cystatin C, or repeat estimated GFR using serum creatinine. 5.6: GFRof 90mL/minper1.73m2 or greater should be considered acceptable level of kidney function for donation. KDIGO guidelines 2017. Assess albuminuria using albumin-to-creatinine ratio in an untimed urine specimen, and confirm albuminuria with AER in a timed urine, specimen or by repeating albumin-to-creatinine ratio if AER cannot be obtained."
        text: |
          - **glomerular filtration rate (GFR)**: estimated glomerular filtration rate (eGFR) وتأكيد بـ measured GFR (مثلًا 99mTc-DTPA) أو creatinine clearance (CrCl) أو creatinine + cystatin C. المقبول ==90 mL/min/1.73 m² أو أكتر== (KDIGO 2017).
          - **Albuminuria**: albumin-to-creatinine ratio (ACR) وتأكيد بـ albumin excretion rate (AER).
          - Microscopic haematuria مستمرة؟ دوّر على السبب. حصوات؟ gout؟
          - **blood pressure (BP)** مرتين على الأقل.
          - body mass index (BMI)، سكر (شخصي و gestational وعائلي)، fasting glucose أو glycated haemoglobin (HbA1c)، lipids، تدخين.
          - **Infections**: HIV، hepatitis B virus (HBV)، hepatitis C virus (HCV)، cytomegalovirus (CMV)، Epstein–Barr virus (EBV)، syphilis، UTI.
          - Cancer screening، تاريخ عائلي لمرض كلى، **β-hCG** قبل التبرع على طول، وتقييم نفسي وجهًا لوجه.

          ليه الـ GFR بأكتر من طريقة؟ التفسير المقبول (مش في الكتاب): الـ eGFR من الـ creatinine بيتأثر بالعضلات: راجل رياضي عضلاته كتير ممكن يطلع eGFR واطي وهو سليم، وست رفيعة ممكن يطلع عالي وهي مش كده. والقرار هنا مصيري (هياخدوا نص كلاه)، فلازم measured GFR. وليه الـ haematuria والحصوات والـ gout؟ لأن كل واحد ممكن يكون بداية مرض كلى (IgA، thin membrane، stones متكررة)، والمتبرع مش هيقدر يستحمل مرض في الكلية الوحيدة.
      - kind: check
        page: 323
        quote: "GFRof 90mL/minper1.73m2 or greater should be considered acceptable level of kidney function for donation."
        question: "A potential donor has a measured GFR of 75 mL/min/1.73 m². By the book's KDIGO 2017 cut-off, is this acceptable?"
        options:
          - "No; 90 or more is the acceptable level"
          - "Yes; 60 or more is enough"
          - "Yes; any GFR above 30"
          - "Only if cystatin C is normal"
        answer: 0
        why:
          - "صح: الكتاب: GFR ==90 mL/min/1.73 m² أو أكتر== مقبول للتبرع."
          - "الـ 60 حد الـ CKD، مش حد التبرع في الكتاب."
          - "المتبرع هيفقد نص الكلى، فمحتاج reserve كبير."
          - "الـ cystatin C طريقة لتأكيد الـ GFR، مش استثناء."
      - kind: explain
        page: 324
        title: "ليه كل الفحوصات دي؟"
        quote: "Assess metabolic and lifestyle risk factors for CKD and/or CVD before donation by obtaining:"
        text: |
          الكتاب بيكمل الـ checklist:
          - **metabolic**: BMI، تاريخ سكر (شخصي و gestational وعائلي)، fasting glucose أو HbA1c، lipids، وتدخين.
          - **infections**: HIV، HBV، HCV، CMV، EBV، syphilis، UTI، وغيرها حسب البلد.
          - **cancer screening**، **family history** لمرض كلى، **β-hCG** قبل التبرع على طول، و ==face-to-face psychosocial evaluation==.

          ليه؟ التفسير المقبول (مش في الكتاب):
          - المتبرع هيعيش بكلية واحدة، فأي **سكر أو ضغط أو سمنة** هيضرب الكلية الباقية من غير reserve. عشان كده الـ metabolic بالتفصيل.
          - الـ **infections** والـ **cancer** ممكن ينتقلوا للمستقبل اللي هياخد immunosuppression، فعدوى بسيطة عند المتبرع ممكن تموّت المستقبل (CMV و EBV بالذات).
          - الـ **family history**: لو المتبرع قريب لعيان عنده مرض وراثي (زي ADPKD)، ممكن يكون شايله.
          - الـ **psychosocial**: علشان نتأكد إن التبرع حر ومش تحت ضغط أو فلوس.

          وليه المتابعة السنوية للمتبرع؟ التفسير المقبول (مش في الكتاب): المتبرع بقى شخص بكلية واحدة، فأي ضغط أو سكر أو proteinuria جديد لازم يتمسك بدري ويتعالج قبل ما يأذي الكلية الوحيدة. وكمان دي مسؤولية أخلاقية: الشخص ده أدى جزء من جسمه، فمن حقه رعاية مستمرة. وفي بعض البلاد المتبرعين بياخدوا أولوية لو احتاجوا زراعة بعدين.

          وليه الـ β-hCG «immediately before donation»؟ التفسير المقبول (مش في الكتاب): الحمل بيغيّر وظيفة الكلى ويزود الـ GFR، والتخدير والعملية خطر على الجنين، والـ CT angiography فيه إشعاع وصبغة. فلو المتبرعة حامل من غير ما تعرف، العملية لازم تتأجل. والفحص قبل العملية على طول لأن الحمل ممكن يحصل بين التقييم والعملية اللي بينهم أسابيع.
      - kind: check
        page: 325
        quote: "Renal imaging (such as a computed tomographic angiography) In general the left kidney should be procured because of the relative technical ease associated with a longer venous pedicle, but procurement of the right kidney may be preferred in some cases because of vascular, urological, or other abnormalities."
        question: "Which donor kidney is usually taken, and why?"
        options:
          - "Left: longer renal vein"
          - "Right: easier to reach"
          - "The smaller one"
          - "Always the one with two arteries"
        answer: 0
        why:
          - "صح: الـ left renal vein أطول، فالعملية أسهل. الـ right لو فيه مشكلة vascular أو urological."
          - "الـ right vein قصير، وده بيصعّب الزراعة."
          - "الكتاب ما قالش كده."
          - "الشرايين الكتير بتصعّب، مش بتسهّل."
      - kind: figure
        page: 325
        quote: "Renal imaging (such as a computed tomographic angiography) In general the left kidney should be procured because of the relative technical ease associated with a longer venous pedicle, but procurement of the right kidney may be preferred in some cases because of vascular, urological, or other abnormalities."
        title: "ليه بناخد الكلية الشمال؟"
        alt: "A front view of the kidneys and great vessels: the inferior vena cava on the viewer's left, the aorta on the right. The right kidney sits beside the vena cava with a short renal vein. The left kidney, on the viewer's right, sends a long renal vein across the front of the aorta to the vena cava. Labels: short vein; long vein, easier to transplant; the left kidney is usually taken."
        caption: |
          - الـ **IVC** على يمين الجسم، فالـ ==right renal vein قصيرة==.
          - الـ **left renal vein** بتعدّي **قدام الـ aorta** لحد الـ IVC، فهي ==طويلة==.

          الكتاب بيقول الكلية الشمال هي اللي بتتاخد عادة بسبب **the relative technical ease** مع الـ **longer venous pedicle**، إلا لو فيه vascular أو urological abnormality. الرسمة من قدام: يمين العيان على شمالك.
        svg: |
