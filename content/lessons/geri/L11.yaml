  - id: geri.L11.lesson6
    title: "علاج الـ exacerbation: أوكسجين بحساب"
    hook: "أكتر غلطة في الطوارئ: تدّي مريض COPD أوكسجين لحد 100%. الدرس ده بيقولك ليه 88-92 كفاية، وليه 90 ممكن تبقى خطر."
    minutes: 10
    pages: [203, 205]
    topics: [exacerbation, oxygen]
    goals:
      - "تعرف العلاج الفوري وليه كل خطوة"
      - "تختار الـ antibiotic بالـ severity والـ risk factors"
      - "تفهم الـ dissociation curve وحدود الـ pulse oximetry"
    status: unverified
    steps:
      - kind: explain
        page: 203
        quote: "Immediate treatment (Acute Exacerbation)\n  Oxygen (target SpO2 88-92%) .. Do Not give high flow O2 unless ABG evidence absence of CO2 retention.\n  SABA …..… salbutamol or terbutaline (nebulizer).\n  SAMA …. ipratropium (nebulizer ,may be needed if inadequate response to SABA). IV aminophylline …may be needed.\n  Oral prednisolone (if already on maintenance prednisolone then increase the dose). may need IV hydrocortisone.\n  Antimicrobials.\n  Assisted ventilation.\n  Physiotherapy……to clear airways from secretions.\n  IF Not improving:"
        title: "العلاج الفوري"
        text: |
          1. **Oxygen**: target ==oxygen saturation by pulse oximetry (SpO2) 88-92%==. مفيش high flow إلا لو الـ ABG أثبت إن مفيش carbon dioxide (CO2) retention.
          2. **short-acting beta-2 agonist (SABA)** (salbutamol أو terbutaline) nebulizer.
          3. **short-acting muscarinic antagonist (SAMA)** (ipratropium) لو الـ SABA مش كفاية؛ وممكن **intravenous (IV) aminophylline**.
          4. **Oral prednisolone** (لو أصلًا عليه maintenance، زوّد الجرعة)؛ وممكن IV hydrocortisone.
          5. Antimicrobials.
          6. Assisted ventilation.
          7. Physiotherapy للإفرازات.

          مش بيتحسن؟ فكّر في resistant organisms أو مرض تحتي: **bronchogenic carcinoma** أو **bronchiectasis**.

          ليه الـ steroids؟ التفسير المقبول (مش في الكتاب): الـ exacerbation موجة التهاب فوق الالتهاب المزمن، والـ steroid بيهدّيها فالشُعب تفتح أسرع. ولو هو أصلًا على prednisolone، الغدة الكظرية بتاعته مكسّلة، فلازم تزوّد الجرعة وقت الضغط.
      - kind: reveal
        page: 203
        quote: "Oxygen (target SpO2 88-92%) .. Do Not give high flow O2 unless ABG evidence absence of CO2 retention."
        prompt: "ليه ما ندّيش مريض COPD high flow oxygen لحد 100% من غير ABG؟ مش الأكسجين دايمًا أحسن؟"
        answer: |
          الكتاب: target **SpO2 88-92%**، و**لا high flow** إلا لو الـ ABG أثبت إن مفيش **CO2 retention**.

          التفسير المقبول (مش في الكتاب): بعض مرضى الـ COPD بيحبسوا CO2. لما تدّيهم أكسجين كتير، الأوعية اللي كانت مقفولة في الحتت الوحشة بتتفتح فالـ V/Q يبوظ أكتر، والتنفس نفسه ممكن يهدى، فالـ CO2 يعلى والمريض ينام ويدخل في respiratory acidosis. الـ 88-92% كفاية تحمي الأنسجة من غير الخطر ده.
      - kind: explain
        page: 204
        quote: "Age > 65, comorbid conditions , severe airflow obstruction (FEV1 < 50%), > 3 exacerbations/yr , antibiotic therapy or hospital admission within the last 3 months."
        title: "الـ antibiotic"
        text: |
          **الميكروبات**: H. influenzae، Strep. pneumoniae، Moraxella، و **Pseudomonas** لو فيه risk factors.

          **Risk factors** (poor outcome أو resistant organism): سن **فوق 65**، comorbidities، **forced expiratory volume in 1 second (FEV1) < 50%**، **أكتر من 3** exacerbations في السنة، antibiotic أو دخول مستشفى في آخر **3 شهور**.

          ليه دول بالذات؟ التفسير المقبول (مش في الكتاب): الـ antibiotic أو المستشفى من قريب بيختاروا البكتيريا المقاومة (زي الـ pseudomonas)، والـ FEV1 الواطي والـ exacerbations الكتير معناهم شُعب متدمرة بتسكن فيها البكتيريا دي، والسن والـ comorbidities معناهم إن العلاج الغلط ما لوش هامش.

          **الـ severity**: الاتنين محتاجين **2 من 3** (dyspnea، كمية البلغم، صديد البلغم). ==Moderate== من غير respiratory failure، و **severe** معاه.
      - kind: table
        page: 204
        quote: "Moderate attack and Absence of risk factors (for poor outcome or drug resist .organism) Macrolide, doxycycline, cephalosporin (second or third generation)."
        title: "اختار المضاد"
