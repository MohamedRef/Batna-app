    lecture: neph.L14
    page: 479
    quote: |-
      Evaluation
        The PLASMIC score is calculated using findings on presentation and predicts the likelihood of ADAMTS13 activity being less than or equal to 10% to help make a presumptive diagnosis of TTP in the appropriate clinical setting. The presence of peripheral schistocytes is required to apply this score.
        One point is given for each of the following features:
          Platelet count less than 30,000/microL.
          Presence of hemolysis (reticulocyte count greater than 2.5%, undetectable haptoglobin, or indirect bilirubin greater than 2 mg/dL).
          Mean corpuscular volume (MCV) less than 90 Fl.
          International normalized ratio (INR) of less than 1.5.
          Creatinine less than 2.0 mg/dL.
          Absence of cancer.
          Absence of solid organ or stem cell transplant.
        The higher the score, the greater the likelihood of TTP, with a score of greater than 5 suggesting a high probability of TTP and a score lower than 5 suggesting a low probability of TTP.
