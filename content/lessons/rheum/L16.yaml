  - id: rheum.L16.lesson3
    title: "إيد الـ RA: swan neck ولا boutonniere؟"
    hook: "الصباع بيتكلم. لو عرفت تقرا ثناياه، هتعرف الـ RA من على بُعد متر."
    minutes: 7
    pages: [247, 249]
    topics: [hands, feet-knee]
    goals:
      - "تفرّق swan neck من boutonniere في ثانية"
      - "تعدّ تشوّهات الإيد والقدم"
      - "تعرف الـ Baker's cyst وليه بيتلخبط مع الـ DVT"
    status: unverified
    steps:
      - kind: explain
        page: 247
        title: "أول علامة"
        quote: "Early sign: fusiform or spindle shaped appearance of fingers due to swelling of PIP joints."
        text: |
          أول حاجة: الصوابع شكلها ==fusiform== (مغزلي): تخين في النص عند الـ **PIP** ورفيع فوق وتحت.

          ومعاه ورم **MCP** على الناحيتين.
      - kind: figure
        page: 247
        quote: "Swan neck deformity: Hyperextension at PIP with flexion at DIP. Boutonniere deformity: Flexion at the PIP with extension at DIP."
        title: "الصباعين اللي لازم تحفظهم"
        alt: "Two finger outlines side by side. Swan neck: the PIP joint bends backward (hyperextension) and the DIP joint bends down (flexion), like a swan's neck. Boutonniere: the PIP joint bends down (flexion) and the DIP joint bends up (extension), like a button pushed through a buttonhole."
        caption: "**Swan neck**: PIP لفوق (hyperextension)، DIP لتحت (flexion). **Boutonniere**: العكس بالظبط: PIP لتحت، DIP لفوق."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <text x="80" y="20" text-anchor="middle" class="t-b">Swan neck</text>
            <path d="M20 160 L80 160 L120 120 L150 150" class="fg-ink" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="80" cy="160" r="6" class="fg-dot-acc"/>
            <circle cx="120" cy="120" r="6" class="fg-dot-bad"/>
            <text x="20" y="185" class="t-sm">MCP</text>
            <text x="112" y="105" class="t-sm t-bad">PIP ↑ hyperext</text>
            <text x="135" y="175" class="t-sm">DIP ↓ flex</text>
            <text x="250" y="20" text-anchor="middle" class="t-b">Boutonniere</text>
            <path d="M180 120 L240 120 L270 160 L310 140" class="fg-ink" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="240" cy="120" r="6" class="fg-dot-acc"/>
            <circle cx="270" cy="160" r="6" class="fg-dot-bad"/>
            <text x="180" y="105" class="t-sm">MCP</text>
            <text x="225" y="185" class="t-sm t-bad">PIP ↓ flex</text>
            <text x="270" y="125" class="t-sm">DIP ↑ ext</text>
          </svg>
      - kind: mnemonic
        page: 247
        quote: "Boutonniere deformity: Flexion at the PIP with extension at DIP."
        word: "BPF"
        parts:
          - { key: "B", text: "Boutonniere:" }
          - { key: "P", text: "PIP" }
          - { key: "F", text: "Flexed (and the DIP goes the other way: extended)" }
        hook: "**B**outonniere = **P**IP **F**lexed. الزرار (button) بيعدّي في العروة لما الـ PIP ينطوي لقدّام. والـ swan neck هو العكس."
      - kind: check
        page: 247
        quote: "Swan neck deformity: Hyperextension at PIP with flexion at DIP."
        question: "Hyperextension at PIP and flexion at DIP. What is it?"
        options: ["Swan neck", "Boutonniere", "Z-shaped thumb", "Trigger finger"]
        answer: 0
        why:
          - "صح: رقبة البجعة، الـ PIP لفوق والـ DIP لتحت."
          - "الـ boutonniere هو العكس: PIP flexed و DIP extended."
          - "الـ Z deformity في الصباع الكبير (thumb)."
          - "الـ trigger finger = الصباع بيقفل وهو مثني بسبب nodule في الـ tendon sheath."
      - kind: explain
        page: 247
        title: "باقي الإيد"
        quote: "Ulnar deviation of fingers at MCP joint associated with deviation at radiocarpal Joints Zig Zag deformity of the hand."
        text: |
          - **Ulnar deviation** عند الـ MCP + انحراف عند الـ radiocarpal = ==zig-zag deformity==.
          - **Z-shaped thumb** و **MCP subluxation**.
          - **Piano-key (caput) ulna**: الـ ulnar styloid بيطلع لفوق (dorsal subluxation)، تدوس عليه ينزل ويطلع زي زرار البيانو.
          - **Trigger finger**: tendon sheath ملتهب فيه nodule، الصباع يقفل وهو مثني.
      - kind: figure
        page: 248
        title: "إيد الـ RA في الكتاب"
        image: { file: rheum/L16-hands-deformities.webp, book: true }
        alt: "Book photograph of both hands of a patient with rheumatoid arthritis resting on the thighs: swollen MCP joints, ulnar deviation of the fingers and finger deformities."
        caption: "بص على الـ **MCP** المنفوخة وانحراف الصوابع ناحية الـ ulna. دي الإيد اللي هتشوفها في الامتحان العملي."
      - kind: explain
        page: 247
        title: "علامات صغيرة بتفرق"
        quote: "Palmer erythema and prominent veins on the dorsum of hand indicating increased blood flow."
        text: |
          - **Muscle atrophy** و grip ضعيف.
          - **Boggy synovium** على ضهر الـ wrist (طري زي الإسفنجة).
          - ==Dorsiflexion== الـ wrist بيتحدّ **بدري**.
          - **Palmar erythema** وعروق بارزة على ضهر الإيد: الدم زايد علشان الالتهاب.
          - جلد رفيع atrophic فوق الـ synovitis.
      - kind: explain
        page: 249
        title: "القدم والركبة"
        quote: "MTP subluxation and flexion at PIP cock-up deformity of toe (hammer toe)"
        text: |
          **القدم**: زي الإيد. **MTP subluxation** + flexion عند الـ PIP = ==cock-up (hammer) toe== مع callosities، و hallux valgus، و fibular deviation للصوابع، والـ arch بيفطس، و valgus في الكاحل.

          **الركبة**: ورم (synovial hypertrophy + effusion)، و quadriceps atrophy.
      - kind: explain
        page: 249
        title: "الـ Baker's cyst"
        quote: "effusion in semimembranous bursa at back of knee. This cyst may dissect in the calf and rupture mimics DVT."
        text: |
          ==Baker's cyst==: effusion في الـ **semimembranosus bursa** ورا الركبة.

          ممكن يزحف في الـ calf **وينفجر**، فالسمانة تورم وتوجع: شبه الـ ==DVT== بالظبط.

          التشخيص: **Doppler US** أو arthrography، ودلوقتي الـ **US أو MRI** (non-invasive) بيغنوا عن الـ arthrography.
      - kind: aside
        tone: joke
        page: 249
        quote: "Doppler ultrasound or arthrography for diagnosis."
        text: "الـ Baker's cyst ده ممثل شاطر: بيعمل دور **DVT** لدرجة إن ناس بتديله anticoagulant. اعمل **Doppler** الأول قبل ما تمنحه الأوسكار."
      - kind: check
        page: 249
        quote: "Ultrasound or MRI (non invasive) can now replace arthrography."
        question: "عيانة RA ركبتها كانت وارمة، وفجأة السمانة ورمت ووجعت. أحسن خطوة؟"
        options: ["Doppler ultrasound", "Start warfarin مباشرة", "X-ray الركبة بس", "Synovial biopsy"]
        answer: 0
        why:
          - "صح: الـ Doppler يفرّق الـ ruptured Baker's cyst من الـ DVT."
          - "الـ anticoagulation من غير تشخيص ممكن يكون غلط لو ده cyst."
          - "الـ X-ray مش هيشوف الـ cyst."
          - "الـ biopsy مش أداة التشخيص هنا."
      - kind: try
        items: [rheum.L16.045, rheum.L16.049, rheum.L16.053, rheum.L16.055]
    recap:
      - "أول علامة: fusiform fingers (ورم PIP)."
      - "Swan neck: PIP hyperext + DIP flex. Boutonniere: PIP flex + DIP ext (B-P-F)."
      - "Ulnar deviation + radiocarpal = zig-zag. Z thumb، piano-key ulna، trigger finger."
      - "Dorsiflexion الـ wrist بيتحدّ بدري؛ palmar erythema = blood flow زايد."
      - "القدم: hammer toe، hallux valgus، fibular deviation، flat arch، valgus ankle."
      - "Baker's cyst ينفجر ويقلّد DVT؛ Doppler، US أو MRI."
