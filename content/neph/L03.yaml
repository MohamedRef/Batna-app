  - id: neph.L03.040
    kind: mcq
    topic: biomarkers
    stem: In a patient with acute decompensated heart failure and rising creatinine, the team wants a marker of proximal tubular injury rather than of filtration. Which one from Table 2 fits best?
    options:
      - Serum creatinine
      - BNP
      - KIM-1
      - Cardiac troponin I
      - sST2
    answer: 2
    why:
      - Creatinine reflects filtration and comes from skeletal muscle; it is not a tubular injury marker.
      - BNP reflects myocardial stretching.
      - "Correct: KIM-1 is a membrane glycoprotein expressed in regenerating PCT epithelium (p72)."
      - Troponin I reflects myocardial injury.
      - sST2 is a member of the IL-1 receptor family, a cardiac marker.
    src: { page: 72, quote: "Kidney injury molecule (KIM-1) Type 1 cell membrane glycoprotein expressed in regenerating PCT epithelium" }
    status: unverified
  # ---------- p73: Tables 3 and 4 ----------
  - id: neph.L03.041
    kind: enumerate
    topic: diuretics-uf
    prompt: Potential shortcomings of diuretic use in heart failure (Table 3)?
    points:
      - Direct activation of the RAAS
      - Deterioration in renal function
      - Electrolyte abnormalities (hypokalemia, hypomagnesemia)
      - Suboptimal natriuresis (hypotonic urine)
      - Development of diuretic resistance
      - Unpredictable therapeutic response
      - Unclear practical aspects (optimal dosing)
      - Nonrenal adverse effects (ototoxicity, hypersensitivity)
    pass: 6
    src: { page: 73, quote: "Direct activation of the renin-angiotensin-aldosterone system Deterioration in renal function Electrolyte abnormalities (e.g., hypokalemia and hypomagnesemia)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L03.042
    kind: card
    topic: diuretics-uf
    front: Why does the book call natriuresis with loop diuretics suboptimal?
    back: They produce hypotonic urine, so less sodium leaves per litre of water removed.
    src: { page: 73, quote: "Suboptimal natriuresis (production of hypotonic urine)" }
    status: unverified
  - id: neph.L03.043
    kind: card
    topic: diuretics-uf
    front: Nonrenal adverse effects of diuretics listed in Table 3?
    back: Ototoxicity and hypersensitivity.
    src: { page: 73, quote: "Nonrenal adverse effects (e.g., ototoxicity and hypersensitivity)" }
    status: unverified
  - id: neph.L03.044
    kind: card
    topic: diuretics-uf
    front: Why did ultrafiltration gain attention in heart failure with fluid overload?
    back: Pharmacological therapy gave suboptimal results, and newer portable, user-friendly devices dedicated to fluid overload reached the market.
    src: { page: 73, quote: "UF gained much attention after marketing of the newer portable and user-friendly devices that were dedicated to management of fluid overload" }
    status: unverified
  - id: neph.L03.045
    kind: enumerate
    topic: diuretics-uf
    prompt: Proposed advantages of slow ultrafiltration compared with diuretics (Table 4)?
    points:
      - More rapid fluid removal and symptom improvement
      - Higher mass clearance of sodium
      - Less risk of electrolyte abnormality (hypokalemia)
      - No RAAS activation
      - No neurohormonal (SNS) activation
      - Removal of pro-inflammatory cytokines (may restore diuretic response)
      - Shorter length of stay
      - Fewer readmissions for HF
      - Less risk of worsening renal function
    pass: 6
    src: { page: 73, quote: "More rapid removal of fluid and improvement in symptoms Higher mass clearance of sodium Decreased risk of electrolyte abnormality" }
    status: unverified
    tags: [high-yield]
  - id: neph.L03.046
    kind: card
    topic: diuretics-uf
    front: How might ultrafiltration restore responsiveness to diuretics?
    back: By removing pro-inflammatory cytokines.
    src: { page: 73, quote: "Removal of pro-inflammatory cytokines (with potential restoration of responsiveness to diuretics)" }
    status: unverified
  - id: neph.L03.047
    kind: card
    topic: diuretics-uf
    front: Diuretics activate the RAAS and the SNS; does slow ultrafiltration?
    back: No. Lack of RAAS activation and lack of neurohormonal (SNS) activation are proposed advantages of slow ultrafiltration.
    src: { page: 73, quote: "Lack of RAAS activation Lack of neurohormonal (SNS) activation" }
    status: unverified
  - id: neph.L03.048
    kind: mcq
    topic: diuretics-uf
    stem: Compared with loop diuretics, which is a proposed advantage of slow ultrafiltration in congested heart failure?
    options:
      - It produces hypotonic fluid with little sodium
      - It removes sodium with a higher mass clearance and does not activate the RAAS
      - It needs no vascular access
      - It carries no bleeding risk
    answer: 1
    why:
      - Hypotonic urine is the diuretic problem (Table 3); ultrafiltrate is isotonic.
      - "Correct: higher mass clearance of sodium and lack of RAAS activation are in Table 4 (p73)."
      - UF needs an extracorporeal circuit and catheter (Table 5 lists catheter complications).
      - Table 5 lists hemorrhage from disconnection, fiber leak and anticoagulation.
    src: { page: 73, quote: "Higher mass clearance of sodium Decreased risk of electrolyte abnormality (eg, hypokalemia) Lack of RAAS activation" }
    status: unverified
  # ---------- p74: Tables 5 and 6 ----------
  - id: neph.L03.049
    kind: enumerate
    topic: diuretics-uf
    prompt: Potential complications of extracorporeal pumped ultrafiltration machines (Table 5)?
    points:
