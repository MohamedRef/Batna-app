      - kind: explain
        page: 70
        quote: "Figure 2: Mechanism of damage in CRS-2. CKD, chronic kidney disease; CRS, cardiorenal syndrome.\nChronic Heart Disease\n  Genetic predisposition, Environmental risk factors → Normal Kidney Function\n  Low Cardiac Output, Inflammation, Arterial calcification, Endothelial calcification → Initiation of Kidney Damage\n  Chronic hypoperfusion, Increased venous pressure, Increased venous resistance → Progression to CKD\nNormal Kidney Function → (Chronic hypofusion, Apoptosis) → Initiation of Kidney Damage → (Sclerosis-Fibrosis) → Progression to CKD\nKidney → Anemia, Hypertension, Electrolyte imbalance → Chronic Heart Disease"
        title: "CRS-3: ليه الـ AKI بيوقّع القلب؟"
        text: |
          الكتاب: في الـ CRS-3 الـ ↓GFR بيعمل **Na و water retention** ← **↑preload**، ومعاه **sympathetic** و **RAAS activation**، و electrolyte و coagulation imbalances.

          التفسير المقبول (مش في الكتاب):

          - **الـ preload:** المية اللي الكلية مش بتطلّعها بتروح الرئة، **فـ** يحصل pulmonary edema حتى في قلب كان كويس.
          - **الـ K:** الكلية هي اللي بتطلّع البوتاسيوم. لما تقف، الـ K يعلى **ويسبب** arrhythmias ممكن تكون قاتلة.
          - **الـ acidosis والـ uremia:** بيضعفوا انقباض عضلة القلب، **يعني** نفس الـ preload بقلب أضعف.
      - kind: check
        page: 70
        quote: "Figure 2: Mechanism of damage in CRS-2. CKD, chronic kidney disease; CRS, cardiorenal syndrome.\nChronic Heart Disease\n  Genetic predisposition, Environmental risk factors → Normal Kidney Function\n  Low Cardiac Output, Inflammation, Arterial calcification, Endothelial calcification → Initiation of Kidney Damage\n  Chronic hypoperfusion, Increased venous pressure, Increased venous resistance → Progression to CKD\nNormal Kidney Function → (Chronic hypofusion, Apoptosis) → Initiation of Kidney Damage → (Sclerosis-Fibrosis) → Progression to CKD\nKidney → Anemia, Hypertension, Electrolyte imbalance → Chronic Heart Disease"
        question: "In CRS-3, how does the fall in GFR raise preload, as drawn in the book?"
        options:
          - "Sodium and water retention"
          - "Erythropoietin resistance"
          - "Arterial calcification"
          - "Ventricular assist device effects"
        answer: 0
        why:
          - "صح: ↓GFR ← **Na و water retention** ← ↑preload."
          - "الـ EPO resistance في الـ CRS-4 stage 5."
          - "الـ calcification مزمنة، في الـ CRS-2 والـ CRS-4."
          - "الـ VAD effects في الـ type 2 (Figure 1)."
      - kind: explain
        remind: [neph.L03.008, neph.L03.030]
        page: 71
        title: "CRS-4 و CRS-5"
        quote: "Figure 4: Mechanism of damage in CRS-4. CKD, chronic kidney disease; CRS, cardiorenal syndrome; EPO, erythropoietin; LDL, low-density lipoprotein.\nCKD Stage 1-2 → (Glomerular/Interstitial damage) → CKD Stage 3-4 → (Sclerosis-fibrosis) → CKD Stage 5-6\nCKD Stage 1-2: Genetic risk factors, Diabetes Mellitus, Primary nephropathy, Hypertension, Chronic inflammation → Chronic Heart Dysfunction\nCKD Stage 3-4: Anemia, Uremic toxins, Chronic inflammation, Electrolyte imbalance → Chronic Heart Dysfunction\nCKD Stage 5-6:\n  Anemia, Uremic toxins, Tissue calcification, EPO resistance, Electrolyte imbalance → Chronic Heart Dysfunction\n  Cytokine production: Endothelial dysfunction, LDL oxidation, Oxidative stress, Atherosclerosis, Bone remodeling, Adipocyte production → Chronic Heart Dysfunction"
        text: |
          **CRS-4** بيكبر مع الـ CKD stage:
          - **Stage 1–2:** genetic risk، **diabetes**، primary nephropathy، **hypertension**، chronic inflammation.
          - **Stage 3–4:** **anemia**، **uremic toxins**، chronic inflammation، electrolyte imbalance.
          - **Stage 5:** فوق كده ==tissue calcification== و **erythropoietin (EPO) resistance**، و cytokines: endothelial dysfunction، low-density lipoprotein (LDL) oxidation، oxidative stress، atherosclerosis، bone remodeling.

          **CRS-5:** **sepsis، diabetes، amyloidosis، vasculitis** بيعملوا monocyte activation و cytokines، hypoxia و oxidative stress، hypoperfusion و ischemia، و sympathetic activation، فالاتنين يتأذوا مع بعض.

          التفسير المقبول (مش في الكتاب): في الـ CRS-5 الاتنين بيتأذوا مع بعض **لأن** الـ cytokines والـ hypoperfusion بيوصلوا لكل الأعضاء في نفس الوقت، مش عضو بيستنى التاني.
      - kind: explain
        page: 71
        quote: "Figure 4: Mechanism of damage in CRS-4. CKD, chronic kidney disease; CRS, cardiorenal syndrome; EPO, erythropoietin; LDL, low-density lipoprotein.\nCKD Stage 1-2 → (Glomerular/Interstitial damage) → CKD Stage 3-4 → (Sclerosis-fibrosis) → CKD Stage 5-6\nCKD Stage 1-2: Genetic risk factors, Diabetes Mellitus, Primary nephropathy, Hypertension, Chronic inflammation → Chronic Heart Dysfunction\nCKD Stage 3-4: Anemia, Uremic toxins, Chronic inflammation, Electrolyte imbalance → Chronic Heart Dysfunction\nCKD Stage 5-6:\n  Anemia, Uremic toxins, Tissue calcification, EPO resistance, Electrolyte imbalance → Chronic Heart Dysfunction\n  Cytokine production: Endothelial dysfunction, LDL oxidation, Oxidative stress, Atherosclerosis, Bone remodeling, Adipocyte production → Chronic Heart Dysfunction"
        title: "CRS-4: ليه الخطر بيكبر مع الـ stage؟"
        text: |
          الكتاب (Figure 4) بيرصّ عوامل الـ CRS-4 حسب الـ **stage**: diabetes و hypertension بدري، anemia و uremic toxins في الوسط، و **calcification** و **EPO resistance** في الآخر.

          التفسير المقبول (مش في الكتاب): العوامل دي **بتتجمّع** مش بتتبدّل، **فـ** كل stage بيضيف حمل جديد فوق القديم:

          - الـ **anemia** والـ **hypertension** بيعملوا left ventricular hypertrophy (LVH).
          - الـ **phosphate** العالي بيترسّب في جدار الشرايين (calcification)، **فـ** الشرايين تبقى ناشفة والـ afterload يعلى.
          - الـ **inflammation** والـ LDL oxidation بيسرّعوا الـ atherosclerosis.

          عشان كده مريض الـ CKD المتأخر بيموت بالقلب أكتر ما بيوصل للغسيل.
      - kind: check
        page: 71
        quote: "Figure 4: Mechanism of damage in CRS-4. CKD, chronic kidney disease; CRS, cardiorenal syndrome; EPO, erythropoietin; LDL, low-density lipoprotein.\nCKD Stage 1-2 → (Glomerular/Interstitial damage) → CKD Stage 3-4 → (Sclerosis-fibrosis) → CKD Stage 5-6\nCKD Stage 1-2: Genetic risk factors, Diabetes Mellitus, Primary nephropathy, Hypertension, Chronic inflammation → Chronic Heart Dysfunction\nCKD Stage 3-4: Anemia, Uremic toxins, Chronic inflammation, Electrolyte imbalance → Chronic Heart Dysfunction\nCKD Stage 5-6:\n  Anemia, Uremic toxins, Tissue calcification, EPO resistance, Electrolyte imbalance → Chronic Heart Dysfunction\n  Cytokine production: Endothelial dysfunction, LDL oxidation, Oxidative stress, Atherosclerosis, Bone remodeling, Adipocyte production → Chronic Heart Dysfunction"
        question: "Which disease is NOT shown as a systemic cause of CRS-5 in Figure 5?"
        options:
          - "Vasculitis"
          - "Amyloidosis"
          - "Sepsis"
          - "Acute myocardial infarction"
        answer: 3
        why:
          - "Vasculitis موجودة في Figure 5."
          - "Amyloidosis موجودة في Table 1 و Figure 5."
          - "Sepsis موجودة في الاتنين."
          - "صح: الـ myocardial infarction (MI) مرض قلب primary، فده type 1 مش 5."
      - kind: reveal
        page: 71
        quote: "Figure 4: Mechanism of damage in CRS-4. CKD, chronic kidney disease; CRS, cardiorenal syndrome; EPO, erythropoietin; LDL, low-density lipoprotein.\nCKD Stage 1-2 → (Glomerular/Interstitial damage) → CKD Stage 3-4 → (Sclerosis-fibrosis) → CKD Stage 5-6\nCKD Stage 1-2: Genetic risk factors, Diabetes Mellitus, Primary nephropathy, Hypertension, Chronic inflammation → Chronic Heart Dysfunction\nCKD Stage 3-4: Anemia, Uremic toxins, Chronic inflammation, Electrolyte imbalance → Chronic Heart Dysfunction\nCKD Stage 5-6:\n  Anemia, Uremic toxins, Tissue calcification, EPO resistance, Electrolyte imbalance → Chronic Heart Dysfunction\n  Cytokine production: Endothelial dysfunction, LDL oxidation, Oxidative stress, Atherosclerosis, Bone remodeling, Adipocyte production → Chronic Heart Dysfunction"
        prompt: "مريض في الـ ICU عنده sepsis، والـ troponin طالع والـ creatinine طالع في نفس اليوم. أنهي نوع CRS؟ وليه مش type 1 ولا type 3؟"
        answer: "**Type 5 (secondary CRS)**: الـ sepsis واحد من أسباب الـ CRS-5 في الكتاب. **السبب** إن مفيش عضو بدأ قبل التاني: الـ cytokines والـ hypoperfusion ضربوا الاتنين مع بعض. علشان كده العلاج الأول هو الـ **sepsis** نفسه."
      - kind: aside
        tone: joke
        text: |
          الـ type 5 زي حماة جاية تزور: مش القلب اللي بدأ ولا الكلى اللي بدأت، هي جت **وبهدلت الاتنين** مع بعض.
