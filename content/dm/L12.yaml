  # ---------- p145-146: management of DKD ----------
  - id: dm.L12.023
    kind: card
    topic: dkd-management
    front: What is the goal of DKD management in type 2 diabetes?
    back: Cardiorenal risk reduction in high-risk patients, on top of comprehensive cardiovascular risk management.
    src: { page: 145, quote: "Goal: Cardiorenal Risk Reduction in High-Risk Patients with Type 2 Diabetes in addition to comprehensive CV risk management." }
    status: unverified
  - id: dm.L12.024
    kind: enumerate
    topic: dkd-management
    prompt: Main lines of treatment of DKD?
    points:
      - Lifestyle modification
      - Glycemic control
      - BP control
      - Control of dyslipidemia
    pass: 4
    hook: "الـ DKD بيتعالج بـ «لايف ستايل + 3 control»: lifestyle modification، glycemic control، BP control، وdyslipidemia control."
    src: { page: 145, quote: "Main lines of treatment:\n  1. Lifestyle modification\n  2. Glycemic control.\n  3. BP control.\n  4. Control of dyslipidemia" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.025
    kind: cloze
    topic: dkd-management
    text: "In non-dialysis DKD, dietary protein should be about {{c1::0.8 g/kg}} body weight per day, the {{c2::recommended daily allowance}}."
    src: { page: 145, quote: "Nutrition\n  1. For people with non-dialysis-dependent DKD, dietary protein intake should be ~0.8 g/kg body weight per day (the recommended daily allowance)\n  2. For patients on dialysis, higher levels of dietary protein intake should be considered since malnutrition is a significant problem in some dialysis patients.\n  3. Restriction of dietary sodium (to <2,300 mg/day) may be useful to control blood pressure and reduce cardiovascular risk.\n  4. Recommendations for dietary sodium and potassium intake should be individualized based on comorbid conditions, medication use, blood pressure, and laboratory data." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L12.026
    kind: card
    topic: dkd-management
    front: Why may dialysis patients need more dietary protein?
    back: Malnutrition is a significant problem in some dialysis patients, so higher protein intake should be considered.
    src: { page: 145, quote: "Nutrition\n  1. For people with non-dialysis-dependent DKD, dietary protein intake should be ~0.8 g/kg body weight per day (the recommended daily allowance)\n  2. For patients on dialysis, higher levels of dietary protein intake should be considered since malnutrition is a significant problem in some dialysis patients.\n  3. Restriction of dietary sodium (to <2,300 mg/day) may be useful to control blood pressure and reduce cardiovascular risk.\n  4. Recommendations for dietary sodium and potassium intake should be individualized based on comorbid conditions, medication use, blood pressure, and laboratory data." }
    status: unverified
  - id: dm.L12.027
    kind: cloze
    topic: dkd-management
    text: "Restricting dietary sodium to <{{c1::2,300 mg/day}} may help control blood pressure and reduce cardiovascular risk."
    src: { page: 145, quote: "Nutrition\n  1. For people with non-dialysis-dependent DKD, dietary protein intake should be ~0.8 g/kg body weight per day (the recommended daily allowance)\n  2. For patients on dialysis, higher levels of dietary protein intake should be considered since malnutrition is a significant problem in some dialysis patients.\n  3. Restriction of dietary sodium (to <2,300 mg/day) may be useful to control blood pressure and reduce cardiovascular risk.\n  4. Recommendations for dietary sodium and potassium intake should be individualized based on comorbid conditions, medication use, blood pressure, and laboratory data." }
    status: unverified
    tags: [numbers]
  - id: dm.L12.028
    kind: card
    topic: dkd-management
    front: On what are sodium and potassium advice in DKD individualized?
    back: Comorbid conditions, medication use, blood pressure and laboratory data.
    src: { page: 145, quote: "Nutrition\n  1. For people with non-dialysis-dependent DKD, dietary protein intake should be ~0.8 g/kg body weight per day (the recommended daily allowance)\n  2. For patients on dialysis, higher levels of dietary protein intake should be considered since malnutrition is a significant problem in some dialysis patients.\n  3. Restriction of dietary sodium (to <2,300 mg/day) may be useful to control blood pressure and reduce cardiovascular risk.\n  4. Recommendations for dietary sodium and potassium intake should be individualized based on comorbid conditions, medication use, blood pressure, and laboratory data." }
    status: unverified
  - id: dm.L12.029
    kind: card
    topic: dkd-management
    front: Which glucose-lowering classes should be considered in type 2 diabetes with CKD, and why?
    back: A sodium–glucose cotransporter 2 (SGLT2) inhibitor or a glucagon-like peptide-1 (GLP-1) receptor agonist shown to reduce CKD progression, cardiovascular events, or both.
    src: { page: 145, quote: "Treatment\n  1. Optimize glucose control to reduce the risk or slow progression of DKD .\n  2. For patients with type 2 diabetes and chronic kidney disease, consider use of a sodium–glucose cotransporter 2 inhibitor or glucagon-like peptide 1 receptor agonist shown to reduce the risk of chronic kidney disease progression, cardiovascular events, or both." }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.030
    kind: card
    topic: dkd-management
    front: Why optimize glucose and blood pressure control in DKD?
    back: Both reduce the risk or slow the progression of CKD.
    src: { page: 146, quote: "Optimize blood pressure control to reduce the risk or slow the progression of chronic kidney disease" }
    status: unverified
  - id: dm.L12.031
    kind: cloze
    topic: dkd-management
