  - id: res.L04.055
    kind: mcq
    topic: cross-sectional
    stem: Why is it difficult to derive a causal relationship from a cross-sectional study?
    options:
      - It always uses group-level data
      - Exposure and outcome are measured once, at the same time
      - It needs a very small sample
      - It measures incidence, not prevalence
    answer: 1
    why:
      - That is the ecological study; cross-sectional data are on individuals.
      - With one simultaneous measurement we can't tell which came first, exposure or disease.
      - Cross-sectional surveys are usually large-scale.
      - It is the reverse; cross-sectional studies measure prevalence.
    src: { page: 49, quote: "Since this is a one time measurement" }
    status: unverified
  - id: res.L04.056
    kind: mcq
    topic: designs
    stem: In establishing an exposure-outcome causal association, which criterion is the most essential?
    options: [Consistency of relationship, Temporal relationship, Duration of relationship, Strength of relationship]
    answer: 1
    why:
      - Consistency supports causation but is not essential.
      - The cause must come before the effect; without that, nothing else proves causation.
      - Duration is not one of the key criteria.
      - A strong association supports causation but can still be confounded.
    src: { page: 52, quote: "In establishing exposure-outcome ‘causal association’, what is the most essential criterion?" }
    status: unverified
