      - kind: order
        page: 2
        quote: "proerythroblast"
        prompt: "رتّب مراحل الـ red cell من أصغر لأنضج:"
        steps:
          - "Proerythroblast"
          - "Basophilic erythroblast"
          - "Erythroblast"
          - "Normoblast"
          - "Reticulocyte"
          - "Erythrocyte"
        why: "الـ **pro-** هو الأول دايمًا. والـ **reticulocyte** آخر محطة قبل الـ RBC: لسه فيه بقايا RNA وما بقاش فيه نواة. عشان كده الـ reticulocyte count بيقيس النخاع شغال قد إيه."
