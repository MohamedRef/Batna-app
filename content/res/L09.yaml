  - id: res.L09.033
    kind: mcq
    topic: history
    stem: "Which document states that the well-being of the subject should take precedence over the interests of science and society?"
    options:
      - "Nuremberg Code"
      - "Declaration of Helsinki"
      - Belmont Report (1979, USA)
      - "CIOMS guidelines"
    answer: 1
    why:
      - "Nuremberg's first principle is voluntary consent; it adds scientific value, risk/benefit and avoiding suffering."
      - "Slide 31: the Declaration of Helsinki puts the subject's well-being before science and society."
