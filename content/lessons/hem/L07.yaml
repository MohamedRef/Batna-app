          </svg>
      - kind: explain
        remind: [hem.L07.067]
        page: 112
        title: "بعد الـ CR: امنع الرجوع"
        quote: "After CR is achieved, the most important goal is to prevent recurrence.\nPatients under the age of 60 have three main options:\n  1- Intensive chemotherapy i.e. 3 cycles of consolidation therapy.\n  2- Autologous—HSCT: Offers lower relapse rates compared to intensive chemotherapy hut the relapse rate remains higher than that associated with allogenic transplantation. It is usually reserved for patients that relapse after consolidation therapy, that have no donor for allogenic transplantation.\n  3- Allogenic—HSCT: Patients with unfavorable cytogenetics seem to drive the maximal benefit from allogenic—HSCT."
        text: |
          بعد الـ **complete remission** أهم هدف: ==prevent recurrence==. تحت **60 سنة** فيه 3 اختيارات:
          1. **Intensive chemotherapy**: 3 cycles consolidation (high-dose Ara-C).
          2. **Autologous haematopoietic stem cell transplantation (HSCT)**: relapse أقل من الـ chemo بس أعلى من الـ allogeneic؛ لمين relapse بعد الـ consolidation أو مالوش donor.
          3. ==Allogeneic HSCT==: أكبر فايدة لأصحاب الـ **unfavorable cytogenetics**.

          ليه الـ CR مش نهاية؟ لأن "مفيش blasts تحت الميكروسكوب" مش معناه مفيش ولا خلية؛ الشوية اللي فاضلين بيرجعوا المرض. وليه الـ allogeneic أقل relapse من الـ autologous؟ التفسير المقبول (مش في الكتاب): خلايا المتبرع المناعية بتهاجم أي leukemic cells فاضلة (graft-versus-leukemia)، أما الـ autologous فممكن يرجّع للعيان خلايا خبيثة من نخاعه هو.
      - kind: order
        page: 112
        quote: "Consolidation 2:\n  Aracytine (1 gram/m2) 1.5 grams max. total dose over 3 hours every 12 hours on days 1,3 and 5. days.\n  Etoposide 75 mg/m2, IVI daily for 5 days"
        prompt: "رتّب الـ consolidation courses:"
        steps:
          - "Repeat the induction regimen"
          - "High-dose Ara-C 1 g/m2 q12h days 1, 3, 5 + etoposide 75 mg/m2 × 5"
          - "HAM: high-dose Ara-C days 1–3 + mitoxantrone days 3–5"
        why: "الأول زي الـ induction، وبعدين الـ high-dose Ara-C مع etoposide، وآخر واحد high-dose cytarabine and mitoxantrone (HAM) = High-dose Ara-C + Mitoxantrone."
      - kind: check
        page: 112
        quote: "After CR is achieved, the most important goal is to prevent recurrence.\nPatients under the age of 60 have three main options:\n  1- Intensive chemotherapy i.e. 3 cycles of consolidation therapy.\n  2- Autologous—HSCT: Offers lower relapse rates compared to intensive chemotherapy hut the relapse rate remains higher than that associated with allogenic transplantation. It is usually reserved for patients that relapse after consolidation therapy, that have no donor for allogenic transplantation.\n  3- Allogenic—HSCT: Patients with unfavorable cytogenetics seem to drive the maximal benefit from allogenic—HSCT."
        question: "AML in CR, age 38, unfavorable cytogenetics, matched sibling. Best post-remission option?"
        options:
          - "Allogeneic HSCT"
          - "Autologous HSCT"
          - "No further treatment"
          - "ATRA for one year"
        answer: 0
        why:
          - "صح: الـ unfavorable cytogenetics بياخدوا أكبر فايدة من الـ allogeneic."
          - "الـ autologous relapse بتاعه أعلى، وبيتساب لمين مالوش donor."
          - "بعد الـ CR الهدف منع الرجوع، مش التوقف."
          - "الـ all-trans retinoic acid (ATRA) للـ APL بس."
      - kind: explain
        page: 113
        title: "Residual disease والـ relapse"
        quote: "Up to 50% of patients with AML achieve a second CR using the same drugs used that induce the first remission or HDAC."
        text: |
          - نخاع **day 14** فيه نزول كويس بس مفيش CR ← كرّر النخاع **day 28**؛ لو لسه فيه residual ← ==second induction course==.
          - في الـ **relapse**: لحد **50%** بيعملوا second CR بنفس الأدوية أو **high-dose cytarabine (HDAC)**.
          - المؤهل ← **allogeneic transplant**؛ مالوش donor ← autologous.
          - High risk أو فوق 60 ← investigational: ==Mylotarg== (**anti-CD33**) 9 mg/m2 وتتكرر بعد 14 يوم.

          ليه anti-CD33؟ لأن الـ CD33 من الـ markers اللي الـ AML بتعبّرها (درس الـ markers)، فالـ antibody بيدوّر على الخلايا دي بالذات.
      - kind: explain
        page: 113
        title: "الـ APL: علاج مختلف خالص"
        quote: "Vesanoid (ATRA): Supplied 10 mg capsules. Dose 45 mg/m PO divided in 1 x 2 daily for 45-90 days."
        text: |
          - **Induction**: ==Vesanoid (ATRA)== **45 mg/m2** بالبق على جرعتين، **45–90 يوم** + **idarubicin 8–12 mg/m2** أيام 2، 4، 6، 8، وممكن **Adriamycin 25–30** بداله.
          - **Consolidation**: بعد الـ CR **2 courses** anthracycline + cytarabine.
          - **Maintenance**: ATRA يوميًا ==سنة كاملة==.

          والـ **disseminated intravascular coagulation (DIC)** في M3: الكتاب بيدي **low-dose heparin 50 units/kg كل 6 ساعات**.

          ليه علاج مختلف؟ لأن الـ APL ليها **t(15;17)** ثابتة، وعندها DIC من الـ thromboplastins، فالـ chemo لوحده بيكسّر الخلايا ويزوّد الـ DIC. الـ ATRA بيخلّيها تنضج بدل ما تتكسر (الـ reveal الجاي).
      - kind: reveal
        page: 113
        quote: "Vesanoid (ATRA): Supplied 10 mg capsules. Dose 45 mg/m PO divided in 1 x 2 daily for 45-90 days."
        prompt: "ليه الـ ATRA بتنفع في الـ APL بالذات؟"
        answer: |
          الـ t(15;17) بتعمل fusion protein بيقفل على الـ **retinoic acid receptor**، فالـ promyelocyte بيقف عند مرحلته.

          جرعة عالية من **all-trans retinoic acid** بتفك القفلة دي، فالخلايا تكمّل **differentiation** لـ neutrophils بدل ما تتكسر وتعمل DIC. (ده تفسير فسيولوجي؛ الجرعات من الكتاب.)
      - kind: update
        page: 113
        quote: "Vesanoid (ATRA): Supplied 10 mg capsules. Dose 45 mg/m PO divided in 1 x 2 daily for 45-90 days."
        text: "النهارده الـ acute promyelocytic leukaemia (APL) الـ low/intermediate risk (WBC ≤10,000) بتتعالج بـ ATRA + arsenic trioxide من غير chemo، ومفيش heparin روتيني للـ DIC. الامتحان: الكتاب."
        ref: "ELN recommendations for APL, 2019"
      - kind: check
        page: 114
        quote: "Patients are given vesanoid at standard doses daily for one year."
