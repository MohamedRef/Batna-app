        quote: "Interpretation of serum anti-podocyte antibody and glomerular antigen staining in primary membranous nephropathy\n| Serum Antibody (±) | Glomerular Antigen (±) | Diagnosis |\n| Anti-PLA2R (+) | PLA2R (+) | PLA2R-mediated PMN (active) |\n| Anti-PLA2R (−) | PLA2R (+) | PLA2R-mediated PMN (inactive) |\n| Anti-THSD7A (+) | THSD7A (+) | THSD7A-mediated PMN (active) |\n| Anti-THSD7A (−) | THSD7A (+) | THSD7A-mediated PMN (inactive) |\n| Anti-PLA2R/THSD7A (−) | PLA2R/THSD7A (−) | Non-PLA2R/THSD7A–mediated (pathogenesis unknown) (a) |\n(a) Patients with nephrotic syndrome due to PMN without evidence of PLA2R/THSD7A antibody or glomerular staining are presumed to have autoimmune PMN mediated by a different, still unidentified, anti-podocyte antibody."
        prompt: "الـ serum anti-PLA2R سلبي والـ tissue PLA2R موجب. إزاي؟"
        answer: "ده **PLA2R-mediated polymorphonuclear leukocyte (PMN), inactive**. الـ antibody بيختفي من الدم الأول، والـ glomerular staining يفضل موجب **أسابيع لشهور**."
      - kind: explain
        page: 235
        title: "الـ anti-PLA2R: تشخيص ومتابعة"
        quote: "70%–80% of patients with PMN have anti-PLA2R/THSD7A antibody.\nAnti-PLA2R antibody is about 80% sensitive and 100% specific for PMN (although rare patients with sarcoid, HBV, HCV, HIV, and cancer have been reported).\nAnti-PLA2R antibody can be present for many months before proteinuria appears.\nIn non-nephrotic patients, low, or declining, anti-PLA2R levels predict spontaneous remission and high levels predict progression to nephrotic syndrome.\nAnti-PLA2R–negative patients can become positive later.\nHigh antibody levels (before and after treatment) correlate with proteinuria, response to therapy, and (after therapy) long-term outcomes.\nPatients with higher antibody levels require more prolonged immunosuppression to achieve remission rates comparable to those with lower levels."
        text: |
          - **70–80%** من الـ primary membranous nephropathy (MN) عندهم anti-PLA2R/THSD7A.
          - ==80% sensitive و 100% specific==.
          - ممكن يطلع **قبل الـ proteinuria بشهور**.
          - العالي = محتاج **immunosuppression أطول**، والعالي بعد العلاج = ==relapse==.
          - العالي وقت الـ transplant = **recurrence**.
          - **Immunologic remission** قبل **renal remission** بأسابيع لشهور.
      - kind: aside
        tone: analogy
        page: 236
        quote: "Expansion of the specificity of anti-PLA2R antibody to include additional epitopes (epitope spreading) correlates with a worse prognosis.\nPatients with IgG4 antibody directed only at the cysteine-rich epitope of PLA2R have a higher rate of spontaneous remission.\nAnti-PLA2R levels go down in remission and return with relapse.\nElevated anti-PLA2R levels after treatment predict relapse.\nElevated anti-PLA2R levels at the time of transplantation predict recurrence (especially if DQA1*05:01/05 positive).\nDisappearance of anti-PLA2R antibodies (immunologic remission) precedes renal remission (disappearance of proteinuria) by weeks to months.\nPatients previously positive for anti-PLA2R/THSD7A who become negative will exhibit positive glomerular staining for weeks to months.\n>50% of cases of pediatric PMN are PLA2R-positive."
        text: |
          الـ anti-PLA2R زي **الدخان**، والـ proteinuria زي **الحريقة**. الدخان بيطلع قبل ما تشوف النار، وبيروح قبل ما الرماد يبرد.

          فلو الـ antibody راح، استنّى: الـ proteinuria هتنزل بعده بأسابيع لشهور.
