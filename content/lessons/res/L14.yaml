  - kind: explain
    page: 2
    quote: |-
      Intervene before disease develops: primary prevention e.g. immunisation
      Intervene after disease develops to reduce severity or recurrence: secondary prevention e.g. screening
      Intervene after disease develops to reduce consequences: tertiary prevention e.g. screening for diabetic eye disease
    title: فين الـ screening من الـ prevention؟
    text: |-
      - ==Primary prevention==: قبل الـ onset. مثال السلايد: **immunisation**.
      - ==Secondary prevention==: بعد ما المرض بدأ، عشان تقلل الـ **severity** أو الـ recurrence. مثالها: **screening**.
      - ==Tertiary prevention==: المرض موجود ومعروف، وانت بتقلل الـ **consequences** (disability، death). مثالها في السلايد: **screening for diabetic eye disease**.

      يعني نفس كلمة screening ممكن تبقى secondary أو tertiary، حسب انت بتدوّر على المرض نفسه ولا على مضاعفته.
  - kind: check
    page: 2
    quote: |-
      Intervene before disease develops: primary prevention e.g. immunisation
      Intervene after disease develops to reduce severity or recurrence: secondary prevention e.g. screening
      Intervene after disease develops to reduce consequences: tertiary prevention e.g. screening for diabetic eye disease
    question: Screening diabetics for eye disease is which level of prevention (per the slide)?
    options:
    - Tertiary
    - Primary
    - Secondary
    - 'None: screening is not prevention'
    answer: 0
    why:
    - 'صح: السكر موجود، وبنلحق مضاعفته عشان نقلل الـ consequences.'
    - الـ primary قبل المرض أصلًا، زي الـ immunisation.
    - الـ secondary بتدوّر على المرض نفسه بدري؛ هنا المرض معروف وبندوّر على مضاعفته.
    - بالعكس، السلايد حاطط الـ screening كمثال للـ secondary والـ tertiary.
  - kind: figure
    page: 3
    quote: |-
      Iceberg Phenomenon
      The disease progress from sub-clinical stages to overt or apparent disease
      The hidden mass of unrecognised disease in the community (undiagnosed cases) corresponds to the submerged portion of the iceberg
      What physicians see in their practices (apparent and overt cases) corresponds to the floating tip
      Detection of this mass is a challenge to preventive medicine
    title: الـ iceberg phenomenon
    alt: An iceberg cut by a water line. The small tip above the water is labelled overt cases, what clinics see. The large
      mass under the water is labelled hidden mass, undiagnosed sub-clinical cases, which screening finds.
    caption: اللي فوق المية = الـ **overt cases** اللي الدكاترة بيشوفوها. اللي تحت = **undiagnosed cases** في المجتمع، واكتشافها
      تحدي للـ preventive medicine.
    svg: |-
      <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 62H320" class="fg-thin"/>
        <text x="314" y="56" text-anchor="end" class="t-sm t-mut">water line</text>
        <path d="M130 62L160 18L185 40L200 62Z" class="fg-ink"/>
        <text x="96" y="36" text-anchor="end" class="t-sm t-b">Overt cases</text>
        <text x="96" y="50" text-anchor="end" class="t-sm t-mut">what clinics see</text>
        <path d="M130 62L70 120L95 175L160 192L240 170L262 112L200 62Z" class="fg-acc"/>
        <text x="166" y="112" text-anchor="middle" class="t-sm t-b">Hidden mass</text>
        <text x="166" y="128" text-anchor="middle" class="t-sm">undiagnosed,</text>
        <text x="166" y="143" text-anchor="middle" class="t-sm">sub-clinical cases</text>
        <text x="166" y="165" text-anchor="middle" class="t-sm t-acc">screening finds these</text>
      </svg>
  - kind: explain
    page: 4
    quote: |-
      Disease screening
      A process of identifying apparently healthy people who may be at increased risk of a disease.
      They can then be offered further diagnostic tests and appropriate treatment to reduce the risk of the disease or its related complications.
      Early diagnosis and treatment ensure better outcome compared with usual symptomatic (late) diagnosis and treatment
      Screening extends to screening of risk factors (Elevated cholesterol level as a risk for coronary heart disease)
    title: يعني إيه screening؟
    text: |-
      ==Screening== = process بندوّر فيه وسط ناس **apparently healthy** على اللي ممكن يكون عنده **increased risk** لمرض.

      - بعدها بنعرض عليهم **diagnostic tests** و **treatment** مناسب.
      - ليه؟ لأن الـ **early diagnosis and treatment** نتيجتها أحسن من التشخيص المتأخر لما الأعراض تظهر.
      - وبيشمل كمان الـ **risk factors**: زي الـ cholesterol العالي كـ risk للـ coronary heart disease.
  - kind: figure
    page: 6
    quote: |-
      Logic of screening
      Apparently well population
      Screening test
      Negative results
        Disease (False negative)
        No disease (True negative)
      Positive results: Diagnostic test
        Disease (True positive)
        No disease (False positive)
    title: منطق الـ screening
    alt: A tree. Apparently well population goes through a screening test into negative and positive results. Positives go
      on to a diagnostic test. Negative with disease is a false negative, negative without disease a true negative, positive
      with disease a true positive, positive without disease a false positive.
    caption: 'الـ positive بيروح لـ **diagnostic test**، لأن فيه **false positives**. والـ negative مش مضمون: فيه **false
      negatives**.'
    svg: |-
