        text: |
          - الـ **lectins** = carbohydrate-binding proteins.
          - الـ ==mannose-binding lectin (MBL)== بيتعمل في الـ liver، وبيمسك **repeating mannoses** على سطح الميكروب.
          - **MBL شبه C1q**، ولما يمسك السكر بينشّط **MASP-1 و MASP-2**.
