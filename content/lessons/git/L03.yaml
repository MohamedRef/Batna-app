      - kind: explain
        page: 126
        quote: "Diagnostic criteria for IBS subtypes (Figure 11-11, FM 12)\nPredominant bowel habits are based on stool form on days with at least one abnormal bowel movement.*\n  IBS with predominant constipation (IBS-C): > 1/4 (25%) of abnormal bowel movements with Bristol stool types 1 or 2 and < 1/4 (25%) of bowel movements with Bristol stool types 6 or 7. Alternative for epidemiology or clinical practice: Patient reports that abnormal bowel movements are usually constipation (like Type 1 or 2 in the picture of BSF, see Figure 2A).\n  IBS with predominant diarrhea (IBS-D): > 1/4 (25%) of abnormal bowel movements with Bristol stool types 6 or 7 and < 1/4 (25%) of bowel movements with Bristol stool types 1 or 2. Alternative for epidemiology or clinical practice: Patient reports that abnormal bowel movements are usually diarrhea (like Type 6 or 7 in the picture of BSF, see Figure 2A).\n  IBS with mixed bowel habits (IBS-M): > 1/4 (25%) of abnormal bowel movements with Bristol stool types 1 or 2 and > 1/4 (25%) of bowel movements with Bristol stool types 6 or 7. Alternative for epidemiology or clinical practice: Patient reports that abnormal bowel movements are usually both constipation and diarrhea (more than 1/4 of all the abnormal bowel movements were constipation and more than 1/4 were diarrhea, using picture of BSF, see Figure 2A).\n  IBS Unclassified (IBS-U): Patients who meet diagnostic criteria for IBS but whose bowel habits cannot be accurately categorized into 1 of the 3 groups above should be categorized as having IBS-U. Alternative for epidemiology or clinical practice: Patient reports that abnormal stools (both diarrhea and constipation) are rare.\nFor clinical trials, subtyping based on at least 2 weeks of daily diary data is recommended, using the \"25%-rule\".\n*IBS subtypes related to bowel habit abnormalities (IBS-C, IBS-D and IBS-M) can only be confidently established when the patient is evaluated off medications used to treat bowel habit abnormalities."
        title: "الـ subtypes بالـ 25%"
        text: |
          بنبص بس على أيام فيها **abnormal bowel movement**، ونعدّ الـ Bristol types:

          - **IBS-C:** types 1–2 أكتر من ==25%==، و 6–7 أقل من 25%.
          - **IBS-D:** types 6–7 أكتر من 25%، و 1–2 أقل من 25%.
          - **IBS-M:** الاتنين أكتر من 25%.
          - **IBS-U:** مفيش type بيعدّي 25%.

          والـ subtype يتحدد ==off medications== اللي بتعالج الـ bowel habit. وفي الـ clinical trials بيستعملوا **2 weeks of daily diary**.

          التفسير المقبول (مش في الكتاب): ليه بنعدّ الأيام الـ abnormal بس؟ لأن مريض الـ IBS ممكن يبقى أغلب أيامه طبيعية، فلو حسبت على كل الأيام النسبة هتطلع صغيرة ومش هتعرف تصنّفه.
