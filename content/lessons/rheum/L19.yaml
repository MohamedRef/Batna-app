          - **Cyclophosphamide** الوحيد اللي اتثبتت كفاءته long-term، بس side effects كتير.
          - ==Mycophenolate mofetil== نفس كفاءة الـ pulse cyclophosphamide وأأمن.
          - الـ **flares** بعد الـ remission مش نادرة ← follow-up.
          - **ESRD:** dialysis و transplant نتايجهم زي غير الـ SLE؛ الـ **transplant** هو الـ method of choice.
