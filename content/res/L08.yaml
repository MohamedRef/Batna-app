    src: { page: 41, quote: "An Epidemiologic study was carried and revealed that the development of neural defects in the newborn whose mothers were not receiving folic acid during pregnancy is 50% while it is 10% among those whose mothers were receiving folic acid rich diet during pregnancy.\n  a) Cross sectional\n  b) Case control\n  c) Correlation study\n  d) Prospective cohort\n  e) Retrospective cohort" }
