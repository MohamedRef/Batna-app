        title: "الكبد في الـ IBD"
        text: |
          - الأمراض المصاحبة للـ UC و Crohn's: **fatty liver**، **PSC**، chronic hepatitis، cirrhosis، و hepatobiliary disease.
          - **Steatosis** هي أشهر histology (لحد **50%**). الشديدة منها من **malnutrition** و **anemia** و **toxemia**، وممكن **تفضل بعد الـ colectomy**.
          - Fatty change بتظهر كمان في الـ ileostomy، وبتزيد مع الـ **IV high-calorie nutrition**. فتجنّب الـ long-term high-calorie IV infusion والـ high-fat diet.
