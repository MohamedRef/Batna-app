      - kind: reveal
        page: 88
        quote: "MHC class II proteins show more diversity than MHC class I proteins."
        prompt: "الكتاب بيقول class II أكتر diversity من class I. تقدر تستنتج ليه من التركيب؟"
        answer: |
          من كلام الكتاب نفسه:
          - في **class I** الـ **β chain** هي الـ **β2-microglobulin**، وهي **invariant** (نفسها لكل الـ α chains). فالتنوّع كله جاي من سلسلة واحدة بس.
          - في **class II** الـ **DQ** الـ α والـ β **الاتنين polymorphic** (ص 89)، والـ DR فيه 4 DRB genes شغالين.

          سلسلتين بيتغيروا بدل واحدة ← تركيبات أكتر بكتير ← ==more diversity==.
      - kind: aside
        tone: tip
        page: 87
        quote: "Class I to cytotocic and class II to helper T cells"
        text: |
          قاعدة الضرب: حاصل الضرب دايمًا ==8==.

          - **CD8** مع **class I**، لأن 8 × 1 = 8
          - **CD4** مع **class II**، لأن 4 × 2 = 8

          ومنطقها: أي خلية ممكن يدخلها virus، فكل الخلايا المنوّاة عندها **class I** علشان الـ Cytotoxic T lymphocyte (CTL) يقدر يقتلها. أما **class II** فبس عند اللي شغلتهم يقدّموا antigen للـ helper.
      - kind: check
        page: 87
        quote: "Class I are expressed on all nucleated cells"
        question: "A hepatocyte is infected by a virus. What presents the viral peptide, and to whom?"
        options: ["Class I, to CD8 cytotoxic T cells", "Class II, to CD4 helper T cells", "Class II, to CD8 T cells", "Class III, to NK cells"]
        answer: 0
        why:
          - "صح: الـ hepatocyte nucleated، فعنده class I يعرض بيه على الـ CD8."
          - "الـ class II بس على الـ professional antigen-presenting cells (APCs)."
          - "الـ class II بيروح للـ CD4 مش الـ CD8."
          - "الـ class III region فيه C4 و C2 و tumor necrosis factor (TNF)، مش جزيئات بتعرض peptides."
      - kind: explain
        page: 89
        title: "الـ polymorphism"
        quote: "There exist nine DRB genes DRB1-9 (4 are functional)"
        text: |
          - الـ **DR** فيه **α chain gene واحد** اسمه DRA، فكل الـ HLA-DR نفس الـ α chain.
          - فيه **9 DRB genes**، منهم **4 functional**، وكل واحد ليه alleles كتير.
          - لما عدد الـ alleles يبقى كبير ده اسمه ==gene polymorphism==: **DRB1 لوحده 60 allele**.
          - النتيجة: كل واحد فينا HLA مختلف ← **diverse susceptibility to disease** و **prompt rejection of organ transplant**.
          - **DQ**: الـ α والـ β الاتنين polymorphic. **DP**: الـ β highly polymorphic.
      - kind: reveal
        page: 89
        quote: "The result of such gene polymorphism is that there is enormous potential for individuals to differ in HLA genes they possess."
        prompt: "إزاي الـ polymorphism يخلي جسم المريض يرفض كلية أخوه، ويخلي واحد يجيله مرض وأخوه لأ؟"
        answer: |
          الكتاب بيدّي النتيجتين: **diverse susceptibility to disease** و **prompt rejection of organ transplant**. السبب (التفسير المقبول، مش في الكتاب):

          - **الزرع**: الـ HLA بتاع المتبرع **شكل غريب** على الـ T cells بتاعة المريض، فبيشوفوا الكلية كلها عدو ← رفض سريع. كل ما الـ HLA يقرّب، الرفض يقل، وده سبب الـ **HLA typing** قبل الزرع.
          - **المرض**: كل شكل HLA بيمسك **peptides مختلفة**، فاتنين ممكن يشوفوا نفس الميكروب أو نفس البروتين بتاع الجسم بطريقة مختلفة.

          وده "فايدة" للنوع كله: مفيش ميكروب واحد يقدر يهرب من **كل** الناس.
      - kind: explain
        page: 89
        title: "ليه الأسامي اتغيرت؟"
        quote: "When HLA typing for class I and class II alleles was serologically based, types were designed according to antisera with which an individual cell reacts."
        text: |
          زمان الـ **HLA typing** كان **serologic**: تحط خلايا الشخص مع **antisera**، واللي تتفاعل معاه هو اسم الـ type بتاعه.

          دلوقتي بقى فيه **genotyping** و **amino acid sequencing**، فظهر إن جزيئين **شبه بعض serologically** ممكن يكونوا **مختلفين في الجين**. يعني الاسم القديم كان بيحط حاجات مختلفة تحت اسم واحد.

          عشان كده الاسم الجديد فيه **رقمين**: الأول هو الـ ==type== (نفس رقم الـ serology عشان الربط)، والتاني هو الـ ==variant== اللي الـ genotyping بس يقدر يشوفه.
      - kind: match
        page: 90
        quote: "New nomenclature\n  For class I alleles Letter that design the locus followed by asterisk HLA-A*.\n  2 digit number design type HLA-A*01.\n  (same as serology number ).\n  2 digit number define variant HLA-A*0101.\n  For class II alleles.\n  Letter designing locus DR.\n  Followed by A or B (α or β chain) DRB.\n  A number defining the locus DRB1.\n  Asterisk DRB1*.\n  Type DRB1*01 .\n  Variant DRB1*0101.\n  DRB1*0102."
        prompt: "فكّك الاسم DRB1*0101: كل حتة معناها إيه؟"
        pairs:
          - ["DR", "The locus"]
          - ["B", "The β chain"]
          - ["1", "Which DRB gene"]
          - ["*01", "Type, same as serology"]
          - ["*0101", "Variant"]
        why: "الـ locus، وبعدين السلسلة، B يعني β، ورقم الجين، والنجمة، والـ **type** برقمين زي الـ serology، وأخيرًا الـ **variant**. زمان كانت بالـ serology، ودلوقتي بالـ genotyping لأن جزيئين شبه بعض serologically ممكن يختلفوا جينيًا."
      - kind: explain
        page: 90
        title: "الوراثة"
        quote: "Both maternal and paternal derived allelic forms are expressed: codominance."
        text: |
          - بتورث **haplotype** من الأم وواحد من الأب. الـ haplotype هو string of genes linked on one chromosome.
          - الاتنين بيتعبّروا: ده ==codominance==.
          - **Linkage disequilibrium**: alleles معيّنة بتيجي مع بعض على نفس الـ haplotype **أكتر من الصدفة** في الـ meiosis، زي **HLA-B8 و DR3**. يعني حتت كبيرة من الـ MHC بتتورث سليمة كـ **extended haplotypes** من جيل لجيل.
      - kind: reveal
        page: 90
        quote: "Two complementary chromosome strands, one maternal and one paternal are inherited, each strand providing an MHC haplotype"
        prompt: "ليه فرصة إن أخوك يبقى HLA-identical معاك حوالي 1 من 4؟"
        answer: |
          التفسير المقبول (مش في الكتاب)، من كلام الكتاب عن الـ **haplotype**: إنت ورثت **haplotype واحد من أبوك** (من اتنين عنده) و **واحد من أمك** (من اتنين عندها)، وكل haplotype بيتنقل **حتة واحدة**.

          فأخوك عنده 2 × 2 = **4 تركيبات** ممكنة، واحدة منهم بس زيك بالظبط ← **25%**. ونص الإخوات بيبقوا متطابقين في haplotype واحد، وربعهم مختلفين في الاتنين.

          وعشان الـ **codominance** (الاتنين بيتعبّروا)، الـ T cells بتاعتك متعودة على الأربع جزيئات اللي ورثتها، وأي حاجة تانية غريبة.
      - kind: check
        page: 90
        quote: "Certain alleles are found together on the same haplotype with greater frequency than should occur if recombination during meiosis was random (eg. HLAB8, DR3)."
        question: "HLA-B8 and HLA-DR3 appear together on one haplotype far more often than chance predicts. What is this called?"
        options: ["Linkage disequilibrium", "Codominance", "Gene polymorphism", "Molecular mimicry"]
        answer: 0
        why:
          - "صح: alleles بتيجي مع بعض أكتر من الصدفة، لأن الحتة دي ما اتقسمتش في الـ meiosis."
          - "الـ codominance معناها إن الـ haplotype بتاع الأم وبتاع الأب الاتنين بيتعبّروا."
          - "الـ polymorphism هو عدد الـ alleles الكبير للجين الواحد (DRB1 = 60)."
          - "الـ molecular mimicry تشابه بين الـ HLA وantigen ميكروب، وده mechanism للمرض."
      - kind: reveal
        page: 91
        quote: "HLA A1, B8, DR3 vigorous response to infection?"
        prompt: "الكتاب بيسأل عن الـ A1, B8, DR3: «too much of a good thing?». يقصد إيه؟"
        answer: |
          الـ haplotype ده ممكن يدّي **رد فعل قوي ضد العدوى** (ميزة زمان لما العدوى كانت بتقتل).

          بس نفس القوة دي ممكن تبقى ==aggressive hyper-responsiveness== وأمراض **inflammatory** و autoimmune. الحاجة الحلوة لو زادت بقت مشكلة.
      - kind: try
        items: [rheum.L06.019, rheum.L06.021, rheum.L06.026, rheum.L06.029, rheum.L06.032]
