        title: "ليه نحتاج أكتر من creatinine؟"
        text: |
          الكتاب (Table 2): الـ **creatinine** أصله **skeletal muscle**، والـ **KIM-1** و **L-FABP** و **IL-18** بيقيسوا **tubular injury**، والـ **BNP** بيقيس **myocardial stretching** والـ **troponin** بيقيس **myocardial injury**.

          التفسير المقبول (مش في الكتاب):

          - الـ creatinine **بيتأخر**: بيعلى بعد ما الـ GFR يقع بساعات لأيام، **لأن** لازم يتراكم في الدم الأول. والـ injury markers بتطلع من الخلية المجروحة نفسها، **فـ** بتسبق.
          - الـ creatinine بيتأثر بالعضل، **يعني** في عيان HF ضعيف ومهزول ممكن يبان طبيعي وهو مش طبيعي.
          - الـ BNP والـ troponin ممكن يبقوا عاليين شوية على طول في الـ CKD، **عشان** كده **الاتجاه** (طالع ولا ثابت) أهم من رقم واحد.
