        hook: "علاج الأنيميا في الـ PMF **PASTE** بتلزّقه، وفي الآخر أغلبهم بيبقوا **transfusion-dependent**."
      - kind: explain
        remind: [hem.L09.159, hem.L09.162]
        page: 154
        title: "الطحال: cytoreduction، splenectomy، irradiation"
        quote: "The procedure has significant mortality (around 10%) and morbidity, particularly in elderly patients.\nProblems include perioperative bleeding, infection and thrombosis, as well as rebound thrombocytosis and progressive hepatomegaly."
        text: |
          - **Cytoreduction**: للـ hepatosplenomegaly والأعراض والـ thrombocytosis المزعجة. **Hydroxycarbamide** الأشهر، و anagrelide للصفائح. الـ **interferon** ممكن في الأول، ومرات بيرجّع التليف.
          - ==Splenectomy== دواعيه: **splenic pain**، **constitutional symptoms**، **portal hypertension**، **transfusion-dependent anemia**. **مش** للـ thrombocytopenia. Mortality حوالي **10%**، خصوصًا في الكبار، ومشاكله: bleeding، infection، thrombosis، **rebound thrombocytosis**، **progressive hepatomegaly**.
          - **Splenic irradiation**: بديل في بعض الحالات، بيصغّر الطحال **مؤقتًا**، وممكن **life-threatening cytopenias**. وكمان للـ extramedullary haematopoiesis (EMH) في أعضاء مهمة.
          - الـ **ruxolitinib** بيعالج الـ EMH برا الطحال والكبد كمان، فالـ splenectomy والـ irradiation هيبقوا **last resort**.
      - kind: reveal
        page: 154
        quote: "Problems include perioperative bleeding, infection and thrombosis, as well as rebound thrombocytosis and progressive hepatomegaly."
        prompt: "ليه بعد الـ splenectomy في الـ PMF الكبد بيكبر والصفائح بتعلى فجأة؟"
        answer: |
          الكتاب بيعدّهم كمشاكل: ==rebound thrombocytosis== و **progressive hepatomegaly**.

          التفسير المقبول (مش في الكتاب): الطحال كان **مصنع EMH** وكمان **مخزن** للصفائح. لما تشيله، المصنع بيتنقل للـ **liver** (التاني في الترتيب) فيكبر، والصفائح اللي كانت محجوزة في الطحال بقت في الدم.

          ولنفس السبب الـ thrombocytopenia **مش** بتتحسن: هي جاية من **نخاع بيفشل** أكتر ما هي من الطحال.
