        text: "شكل ص 7: الـ **haemoglobin** = **4 globin chains**، كل واحدة حوالين **heme**. في الكبار غالبًا **2 alpha + 2 beta**. والـ heme = **porphyrin ring** وفي نصه **ذرة حديد**. هتحتاج الكلام ده جامد: الـ **thalassaemia** عيب في الـ **globin chains**، والـ **iron deficiency** نقص في الحديد اللي في نص الـ heme. نفس الجزيء، عيبين مختلفين."
      - kind: figure
        page: 7
        quote: "(a) A hemoglobin molecule is composed of four protein globin chains, each centered around a heme group."
        title: "شكل الكتاب ص 7: جزيء الـ haemoglobin والـ heme"
        image: { file: hem/L01-haemoglobin-heme.webp, book: true }
        alt: "Book drawing in two panels. Left (a): a haemoglobin molecule of four twisted ribbon chains, two lighter alpha chains and two darker beta chains, each holding a small disc labelled heme group; an arrow leads from one heme to panel b. Right (b): the heme group as a porphyrin ring, four nitrogen-containing rings around a central iron atom labelled Fe, with R side groups on the outside."
        caption: |
          الشكل لوحتين، والسهم الأبيض بيوصّل بينهم:

          - **(a) شمال**: الجزيء كله **4 globin chains** ملفوفة. الفاتحة **α chain** والغامقة **β chain**، والكتاب كاتب تحت إن في الكبار غالبًا ==2 alpha + 2 beta==. القرص الصغير البرتقاني جوه كل سلسلة هو الـ **heme group**.
          - **(b) يمين**: الـ heme متكبّر: ==porphyrin ring== (4 حلقات فيها **N**) وفي النص بالظبط ذرة ==Fe==. الـ **R** على الأطراف مجموعات C و H و O زيادة.

          الفايدة للدرس: الـ globin والـ heme جزئين منفصلين، فعيب في السلاسل (زي الـ thalassaemia) غير نقص الحديد اللي في نص الـ heme.
