  # ------------------------------------------------------------------
  - id: dm.L03.lesson1
    title: "الكلية بتتكلم بالـ albumin"
    hook: "قبل ما الـ creatinine يعلى بسنين، الكلية بتسرّب albumin. والمفاجأة: أغلبهم ما بيوصلوش للـ dialysis."
    minutes: 8
    pages: [27, 28]
    topics: [control, dkd]
    goals:
      - "تحفظ أهداف الـ tight control"
      - "تعرّف الـ DKD وتعرف مين بيموت منها إزاي"
      - "تعرف الـ risk factors وليه السكر أقواهم"
    status: unverified
    steps:
      - kind: explain
        page: 27
        title: "الـ tight control: تلات أرقام"
        quote: "Tight glycemic control would prevent the development and/or ameliorate the progression of diabetes-associated microvascular complications (types 1 and 2)."
        text: |
          الـ ==tight glycemic control== بيمنع أو يبطّأ الـ **microvascular complications** في type 1 و type 2.

          - **Haemoglobin A1c (A1C)** حوالين أو أقل من **7%**
          - **Fasting plasma glucose (FPG) (preprandial):** **80–130 mg/dl**
          - **2-h postprandial glucose (PPG) (peak):** حوالين أو أقل من **180 mg/dl**

          ليه السكر بالذات هو اللي بيحمي الـ microvessels؟ زي ما شفنا في المحاضرة الأولى، الشبكية والكلية والأعصاب بتدخّل السكر **من غير insulin**، فسكر الدم العالي بيبقى سكر عالي جوه خلاياها. يعني كل ما تنزّل السكر، الضرر جوه الخلايا دي يقل. وعشان كده الأرقام هنا هي نفسها اللي هتشوفها في علاج الـ DKD.
      - kind: check
        page: 27
        quote: "8- FPG (preprandial) should be lowered to (80-130 mg/dl)."
        question: "Which preprandial glucose target does the lecture set for tight control?"
        options: ["80–130 mg/dl", "Below 100 mg/dl", "100–180 mg/dl", "Below 70 mg/dl"]
        answer: 0
        why:
          - "صح: **80–130 mg/dl** قبل الأكل، ومعاه A1C حوالين 7% و peak PPG حوالين 180."
          - "ده رقم الـ normal fasting في التشخيص، مش هدف العلاج."
          - "الـ 180 هو سقف الـ postprandial."
          - "تحت 70 ده hypoglycemia."
      - kind: explain
        page: 27
        title: "يعني إيه DKD؟"
        quote: "Diabetic Kidney Disease\n  Persistent albuminuria >30 mg/ g creatinine and/or decrease in GFR < 60 ml/min/1.73m2 in the absence of signs or symptoms of other primary causes of kidney damage.\n  DKD occurs in 20–40% of patients with diabetes and is the leading cause of ESRD.\n  The risk of DKD in type 2 diabetes seems to be similar to that in type 1 diabetes.\n  Although ESRD may be the most recognizable consequence of DKD, the majority of patients actually die from CVD before needing kidney replacement therapy."
        text: |
          الـ **diabetic kidney disease** = ==persistent albuminuria >30 mg/g== و/أو **glomerular filtration rate (GFR) <60**، من غير علامات لسبب كلوي تاني.

          - بتحصل في **20–40%** من مرضى السكر.
          - **the leading cause of end-stage renal disease (ESRD)**.
          - الـ risk في type 2 **زي** type 1 تقريبًا.

          ليه **persistent**؟ لأن الـ albumin في البول بيتغير من يوم ليوم (الدرس الجاي)، فرقم واحد مش كفاية. وليه «في غياب أسباب تانية»؟ لأن مريض السكر ممكن يجيله أي مرض كلى، والتشخيص ده بيفترض إن السكر هو السبب. ونسبة type 2 زي type 1 معناها إن مفيش نوع «أأمن» على الكلية.
      - kind: figure
        page: 27
        quote: "Although ESRD may be the most recognizable consequence of DKD, the majority of patients actually die from CVD before needing kidney replacement therapy."
        title: "طريق الـ DKD: مين بيوصل لآخره؟"
        alt: "A road from diabetes to albuminuria over 30 mg/g, then GFR under 60, then ESRD. A large branch leaves the road before ESRD towards cardiovascular death, labelled: most patients die of CVD before kidney replacement therapy."
        caption: "الـ ESRD هو آخر الطريق، بس ==أغلب العيانين== بيخرجوا قبله بالـ **CVD**."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L03k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker><marker id="L03kb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker></defs>
