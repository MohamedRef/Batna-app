  - id: hb.L02.lesson5
    title: "FIB-4 و APRI والـ combined scores"
    hook: "إزاي تحسب التليف من تحليل دم، وإيه الفرق بين FibroTest و FibroMeter و ELF."
    minutes: 8
    pages: [32, 35]
    topics: [serum-tests]
    goals:
      - "تحسب FIB-4 و APRI وتعرف ليه الكسر بيكبر مع التليف"
      - "تحفظ الـ ranges اللي في الكتاب: 1.45 / 3.4 و 0.5 / 1.5"
      - "تعرف مكونات FibroTest و FibroMeter و ELF"
    status: unverified
    steps:
      - kind: explain
        remind: [hb.L02.003]
        page: 32
        quote: "FIB - 4 Calculator. How To Calculate Fibrosis Value (FIB-4):\n  1. Enter Your Age\n  2. Enter AST Value in U/liter\n  3. Enter ALT Value in U/liter\n  4. Enter Platelet Count\n  5. Calculate FIB-4 Value"
        title: "FIB-4 و APRI: التليف من تحليل دم"
        text: |
          الكتاب بيقول تدخّل إيه في الحاسبة:

          - ==FIB-4==: age، aspartate aminotransferase (AST)، ALT، platelet count.
          - ==APRI==: AST، الـ upper limit، platelet count.

          المعادلات المعروفة (مش مكتوبة في الكتاب، بس هي دي اللي الحاسبة بتعملها):

          - FIB-4 = (Age × AST) ÷ (Platelets × √ALT)
          - APRI = (AST ÷ AST ULN) × 100 ÷ Platelets (الـ platelets بالـ 10⁹/L)

          ليه الكسر بيكبر مع التليف؟
          - الـ AST بيعلى أكتر من الـ ALT، لأن الكبد المتليف ما بيصفّيش الـ AST كويس.
          - الـ platelets بتقل، لأن الـ portal hypertension بيكبّر الطحال ويحجز الصفايح فيه.
          - والسن عامل خطر لوحده: سنين أكتر من المرض = تليف أكتر.

          **الـ ranges في الكتاب** (الـ FIB-4 في ص33، والـ APRI في ص34)

          الـ FIB-4:
          - أقل من 1.45: minimal or no fibrosis
          - 1.45–3.39: significant fibrosis
          - 3.4 أو أكتر: advanced fibrosis or cirrhosis

          الـ APRI:
          - أقل من 0.5: minimal or no
          - 0.5–1.5: moderate or significant
          - أكتر من 1.5: severe fibrosis or cirrhosis
      - kind: figure
        page: 32
        quote: "FIB - 4 Calculator. How To Calculate Fibrosis Value (FIB-4):\n  1. Enter Your Age\n  2. Enter AST Value in U/liter\n  3. Enter ALT Value in U/liter\n  4. Enter Platelet Count\n  5. Calculate FIB-4 Value"
        title: "حاسبة الـ FIB-4 في الكتاب"
        image: { file: hb/L02-fib4-calculator.webp, book: true }
        alt: "Book infographic titled 'FIB - 4 Calculator'. A white panel 'How To Calculate Fibrosis Value (FIB-4)' lists five steps: enter your age, enter AST value in U/liter, enter ALT value in U/liter, enter platelet count, calculate FIB-4 value. Cartoons around it: a smiling liver on the left, a small sad liver at the bottom, and a man holding a calculator on the right. A website mark at the bottom."
        caption: |
          الصورة إنفوجراف (عليه علامة موقع تحت)، والمهم فيها الصندوق الأبيض اللي في النص: **How To Calculate Fibrosis Value (FIB-4)**، خمس خطوات من فوق لتحت:

          1. **Age**
          2. **AST** بالـ U/liter
          3. **ALT** بالـ U/liter
          4. **Platelet count**
          5. احسب.

          الكرتون اللي حواليه (كبد مبسوط شمال، كبد زعلان صغير تحت، وراجل ماسك آلة حاسبة يمين) زينة بس. الخلاصة: ==أربع مدخلات== كلهم تحاليل روتين + السن، ومفيش ولا تحليل خاص. وده اللي بيخلّي الـ FIB-4 أول بوّاب في الـ primary care.
      - kind: figure
        page: 33
        title: "حاسبة الـ APRI في الكتاب"
        image: { file: hb/L02-apri-calculator.webp, book: true }
        alt: "Book infographic titled 'APRI Calculator'. A white panel 'How To Calculate APRI Score' lists four steps: enter AST level in IU/liter, enter ALT upper limit in IU/liter, enter platelet count, calculate APRI score. Cartoons around it: a crying blood drop on the left, a microscope and test tubes at the bottom, and a man in a suit holding a calculator on the right. A website mark at the bottom."
        caption: |
          نفس شكل حاسبة الـ FIB-4، بس الصندوق الأبيض فيه أربع خطوات:

          1. **AST Level** بالـ IU/liter
          2. **ALT Upper Limit** بالـ IU/liter
          3. **Platelet Count**
          4. احسب.

          خلّي بالك من الخطوة 2: الصورة مكتوب فيها ==ALT Upper Limit==، بس الـ APRI اسمه **AST**-to-platelet ratio index، فالـ upper limit المقصود بتاع الـ **AST** (الفخ ده متشرح تحت). والفرق عن الـ FIB-4: مفيش **age** ومفيش ALT فعلي، تلات مدخلات بس.
      - kind: figure
        page: 33
        quote: "FIB-4 Value Range\n| FIB-4 Score | Degree of Fibrosis | Interpretation |\n|---|---|---|\n| < 1.45 | Minimal to no fibrosis | Normal range |\n| 1.45 - 3.39 | Significant fibrosis | Intermediate range |\n| ≥ 3.4 | Advanced fibrosis or cirrhosis | High range |"
        title: "جدول الـ FIB-4 في الكتاب"
        image: { file: hb/L02-fib4-range.webp, book: true }
        alt: "Book infographic titled 'FIB-4 Value Range'. A table with columns FIB-4 score, degree of fibrosis and interpretation: below 1.45 minimal to no fibrosis, normal range; 1.45 to 3.39 significant fibrosis, intermediate range; 3.4 or more advanced fibrosis or cirrhosis, high range. Small liver cartoons in the bottom corners."
        caption: |
          جدول بتلات عواميد من الشمال لليمين: **FIB-4 Score**، **Degree of Fibrosis**، **Interpretation**، وتلات صفوف من فوق لتحت:

          - **< 1.45**: Minimal to no fibrosis ← Normal range
          - **1.45 – 3.39**: Significant fibrosis ← Intermediate range
          - **≥ 3.4**: Advanced fibrosis or cirrhosis ← High range

          الأرقام دي (==1.45 و 3.4==) غير الـ 1.3 و 2.67 اللي في الـ pathways (ص24 و ص30)، والفرق ده متشرح في الخطوة اللي جاية.
