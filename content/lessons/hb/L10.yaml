  - id: hb.L10.lesson2
    title: "مين كسر الكبد؟ الأسباب والصورة"
    hook: "عيش غراب من الغيط، علبة بنادول، أو حمل في الشهر التاسع: السبب بيحدد هتزرع ولا تستنى."
    minutes: 9
    pages: [176, 178]
    topics: [etiology, clinical]
    goals:
      - "تعدّ أسباب الـ ALF ومين acute ومين subacute"
      - "تعرف ليه السبب مهم، وإيه اللي تسأل عنه في الـ history"
      - "تشرح الـ labs والمضاعفات: cerebral edema، infection، hypoglycemia، kidney"
    status: unverified
    steps:
      - kind: sort
        page: 176
        prompt: "حط كل سبب في الـ presentation بتاعته (حسب جدول الكتاب):"
        bins: ["Acute ALF only", "Acute and subacute ALF"]
        cards:
          - { text: "Hepatitis A virus", bin: 0 }
          - { text: "Acetaminophen", bin: 0 }
          - { text: "Amanita phalloides", bin: 0 }
          - { text: "Hypoxic hepatitis", bin: 0 }
          - { text: "HELLP syndrome", bin: 0 }
          - { text: "Anti-tuberculous drugs", bin: 1 }
          - { text: "Budd-Chiari syndrome", bin: 1 }
          - { text: "Wilson disease", bin: 1 }
        why: "الـ **infections**، الـ **acetaminophen / Amanita / phosphorus**، الـ **hypoxic hepatitis**، والـ **pregnancy-related** = acute. الـ **drugs** (anti-TB، chemotherapy، statins، NSAIDs، antiepileptics، ecstasy، flucloxacillin)، الـ **Budd-Chiari**، و «others» (Wilson، autoimmune، lymphoma، HLH) = acute و subacute."
      - kind: aside
        tone: joke
        page: 176
        text: |
          الـ **Amanita phalloides** اسمها الشعبي **«death cap»**. يعني لو حد قالك «أنا لقيت عيش غراب حلو في الجنينة وعملته شوربة»، متقولوش «بالهنا والشفا»، قوله «تعالى نعمل LFTs». 🍄
      - kind: explain
        page: 176
        title: "ليه السبب مهم؟"
        text: |
          ليه لازم تعرف السبب؟ الكتاب بيقول سببين:

          **1. Specific therapy**: بعض الأسباب ليها علاج خاص، زي الـ **acetaminophen** (NAC) والـ **herpes hepatitis** (acyclovir).

          **2. Prognosis بيختلف**:
          - الـ acetaminophen والـ hepatitis A: الـ spontaneous recovery أكتر من 50%، فنستنى بحذر قبل ما نقرر الزرع.
          - الـ ==Wilson disease==: الـ spontaneous recovery نادر، فالـ emergency LT هو اللي بننصح بيه.

          مثال: مريضين بنفس الـ INR ونفس درجة الـ HE. واحد acetaminophen، والتاني Wilson. التاني محتاج زرع أسرع بكتير.

          **أشهر الأسباب المعروفة في أمريكا**: acetaminophen، idiosyncratic drug reactions، Wilson disease، hepatitis B، و ischemia.
      - kind: figure
        page: 176
        title: "نفس الأرقام، خطة مختلفة"
        alt: "Two patients with the same INR and the same encephalopathy. Acetaminophen or hepatitis A: spontaneous recovery over 50 percent, so watch closely before deciding on transplant. Wilson disease: spontaneous recovery is rare, so emergency transplant is recommended. Below: some causes have a specific drug, NAC for acetaminophen and acyclovir for herpes."
        caption: "السبب بيغيّر القرار: الـ acetaminophen بيخف لوحده كتير، والـ Wilson نادرًا ما بيخف."
        svg: |
          <svg viewBox="0 0 330 254" xmlns="http://www.w3.org/2000/svg">
          <defs></defs>
          <text x="165" y="20" text-anchor="middle" class="t-b">Same INR, same HE: different plan</text>
          <rect x="8" y="34" width="150" height="40" rx="8" class="fg-good"/>
          <text x="83" y="59" text-anchor="middle" class="t-b">Acetaminophen, HAV</text>
          <rect x="8" y="82" width="150" height="110" rx="8" class="fg-box"/>
          <text x="83" y="104" text-anchor="middle" class="t-sm">spontaneous recovery</text>
          <text x="83" y="124" text-anchor="middle" class="t-b t-lg">&gt; 50%</text>
          <path d="M23 140h120" class="fg-thin"/>
          <text x="83" y="162" text-anchor="middle" class="t-b">watch closely</text>
          <text x="83" y="180" text-anchor="middle" class="t-sm">before deciding LT</text>
          <rect x="172" y="34" width="150" height="40" rx="8" class="fg-bad"/>
          <text x="247" y="59" text-anchor="middle" class="t-b">Wilson disease</text>
          <rect x="172" y="82" width="150" height="110" rx="8" class="fg-box"/>
          <text x="247" y="104" text-anchor="middle" class="t-sm">spontaneous recovery</text>
          <text x="247" y="124" text-anchor="middle" class="t-b t-lg">rare</text>
          <path d="M187 140h120" class="fg-thin"/>
          <text x="247" y="162" text-anchor="middle" class="t-b">emergency LT</text>
          <text x="247" y="180" text-anchor="middle" class="t-sm">recommended</text>
          <rect x="12" y="204" width="306" height="40" rx="8" class="fg-acc"/>
          <text x="165" y="221" text-anchor="middle" class="t-b">Some causes have a specific drug</text>
          <text x="165" y="237" text-anchor="middle" class="t-sm">acetaminophen → NAC · herpes → acyclovir</text>
          </svg>
      - kind: reveal
        page: 176
        prompt: "ليه الكتاب بيقولك خد الـ history فورًا أول ما المريض يوصل؟"
        answer: |
          لأن الـ mental status هتقع وبعدها مش هتعرف تاخد history يُعتمد عليه.

          ولازم يشمل: الأدوية (prescription و nonprescription)، **illicit substances**، و **alcohol**، لأن ده بيأثر على قرار إنه candidate للزرع ولا لأ.

          ولو السبب لسه مش واضح بعد الـ history والتحاليل: **liver biopsy**، ويُفضّل **transjugular**، علشان تستبعد malignancy و autoimmune.
      - kind: explain
        page: 177
        title: "الصورة والـ labs"
        text: |
          **الأعراض الأولى**: زي acute hepatitis عادية، malaise و nausea و jaundice. وده اللي بيخليها مخادعة.

          **Hepatic encephalopathy**:
          - شرط أساسي للتشخيص.
          - بتتدرج من تغييرات بسيطة (صعوبة تركيز) لحد coma.
          - الـ encephalopathy في مريض ALI ==ominous sign==، فلازم تكشف على الـ mental status كتير في أي مريض acute hepatitis.

          **Labs**:
          - الـ aminotransferases عالية بدرجات مختلفة، بس غالبًا أكتر من 1,000 U/L.
          - الـ acetaminophen غالبًا بيدي ALT أكتر من 3,500 U/L.

          ==Fulminant Wilson disease== ليه صورة مميزة:
          - الـ aminotransferases بتعلى بس شوية (modest).
          - الـ ALP واطي أو طبيعي.
          - رغم إن فيه liver failure واضح: PT طويل و bilirubin عالي.

          لو شفت شاب عنده liver failure والـ ALP واطي، فكّر في Wilson.
      - kind: check
        page: 177
        question: "A 19-year-old with jaundice, confusion and INR 3.4 has ALT 280 U/L and a LOW alkaline phosphatase. Most likely cause?"
        options:
          - "Fulminant Wilson disease"
          - "Acetaminophen hepatotoxicity"
          - "Acute hepatitis A"
          - "Ischemic hepatitis"
        answer: 0
        why:
          - "صح: **modest ALT + low/normal ALP** رغم liver failure واضح = **Wilson**."
          - "الـ acetaminophen بيدي ALT >3,500."
          - "الكتاب بيقول إن الـ aminotransferases في الـ ALF غالبًا **>1,000 U/L** (صفحة 177)؛ ALT بسيط مع ALP واطي بيشاور على Wilson مش hepatitis A."
          - "نفس الكلام: الـ ALF عمومًا aminotransferases **>1,000 U/L** (صفحة 177)، والنمط ده (ALT بسيط + ALP واطي) هو نمط الـ Wilson."
      - kind: explain
        page: 177
        title: "الـ cerebral edema: أخطر حاجة"
        text: |
          الـ HE في الـ ALF مختلفة عن الـ HE في الـ chronic liver disease: عندها ==propensity to progress to cerebral edema==. يعني المخ ممكن يورم.

          **Mechanism** (الكتاب بيقول لسه مش واضح):
          - ممكن يكون **blood-brain barrier disruption**.
          - وممكن اضطراب في الـ **cellular osmolality**.

          **Ammonia**:
          - غالبًا الـ serum ammonia بيعلى جدًا.
          - أكتر من ==150 μmol/L== مرتبط بـ ICP عالي و poor outcome.
          - وفيه كمان neurotransmitters تانية مجهولة بتشارك في التغييرات الذهنية.

          **إزاي الـ cerebral edema بتموّت؟**
          - **Brain ischemia**: الضغط جوه الجمجمة بيمنع الدم يوصل.
          - **Cerebral herniation**: المخ بيتزق من مكانه.

          والـ cerebral edema مع الـ sepsis هما أكتر سببين للوفاة في الـ ALF.
      - kind: figure
        page: 177
        title: "من الأمونيا للـ herniation"
