  - id: rheum.L21.lesson1
    title: "الجلد اللي بيتحجّر: SSc بيبدأ إزاي وبيتشخّص إزاي؟"
    hook: "جينات + بيئة، وبعدين fibroblasts بتشتغل overtime وتملا الجلد collagen. وفي الآخر عدّاد نقط لو وصل 9 خلاص."
    minutes: 8
    pages: [345, 346]
    topics: [pathogenesis, criteria]
    goals:
      - "ترسم الـ pathogenesis من الـ HLA لحد الـ fibrosis والـ vascular damage"
      - "تحسب نقط الـ 2013 ACR/EULAR criteria"
      - "تحفظ الـ ARA major وminor features"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L21.001, rheum.L21.004]
        page: 345
        title: "الجينات والبيئة"
        quote: "HLAB8, HLADR3, HLADR5, HLADR52 + environmental factors leads to:\n  T cell + Bcell + macrophage + mast cell + fibroblasts stimulation → Inflammatory cytokine secretion (IL-4, IL-6, TGF-β, PGF & CTGF) → Increase collagen I, III, V, VII, proteoglycans & fibrinectin.\n  Apoptosis with free radical release.\n  Expression of adhesion molecules.\n  VEGF & anti endothelial cells Ab = scarring & vascular dysfunction."
        text: |
          الـ **systemic sclerosis** (scleroderma) بيبدأ بـ ==HLA-B8, DR3, DR5, DR52== + **environmental factors**.

          النتيجة أربع حاجات بتحصل مع بعض:
          1. **Cell stimulation**: T cells وB cells وmacrophages وmast cells و**fibroblasts**
          2. **Apoptosis** مع free radical release
          3. **Adhesion molecules** expression
          4. **Vascular endothelial growth factor (VEGF)** و**anti-endothelial cell antibodies**: scarring وvascular dysfunction

          ليه الأربعة دول مع بعض؟ لأن كل واحد بيفسّر جزء من المرض: الـ cytokines والـ collagen للـ **fibrosis** (الجلد والرئة)، والـ antibodies ضد الـ endothelium للـ **الأوعية** (Raynaud والكلى). الخطوة الجاية بتفصّل ده.
      - kind: reveal
        page: 345
        quote: "VEGF & anti endothelial cells Ab = scarring & vascular dysfunction."
        prompt: "الـ SSc اسمه «تحجّر الجلد». ليه الكتاب حاطط الأوعية (VEGF و anti-endothelial antibodies) في نفس السلسلة؟"
        answer: |
          لأن المرض ليه **وشّين** بيمشوا مع بعض:
          - **Fibrosis:** الـ cytokines (IL-4، IL-6، ==TGF-β==، CTGF) بتخلّي الـ fibroblast يطلّع collagen أكتر ← الجلد والأعضاء تتحجّر.
          - **Vascular dysfunction:** الـ **anti-endothelial cell antibodies** والـ VEGF بيبوّظوا بطانة الأوعية ← **scarring** و vascular dysfunction.

          التفسير المقبول (مش في الكتاب): الوش التاني ده هو اللي بيفسّر **Raynaud** (غالبًا أول عرض)، والـ **digital ulcers**، والـ **pulmonary hypertension**، والـ **renal crisis**. علشان كده في العلاج هتلاقي vasodilators (calcium channel blockers، prostacyclin، endothelin antagonists) جنب الـ antifibrotics.
      - kind: figure
        remind: [rheum.L21.004]
        page: 345
        quote: "T cell + Bcell + macrophage + mast cell + fibroblasts stimulation → Inflammatory cytokine secretion (IL-4, IL-6, TGF-β, PGF & CTGF) → Increase collagen I, III, V, VII, proteoglycans & fibrinectin."
        title: "من الـ cytokine للـ collagen"
        alt: "Vertical flowchart of systemic sclerosis pathogenesis. HLA-B8, DR3, DR5 and DR52 plus environmental factors stimulate T cells, B cells, macrophages, mast cells and fibroblasts. These secrete IL-4, IL-6, TGF-beta, PGF and CTGF. Fibroblasts then make more collagen types I, III, V and VII, proteoglycans and fibronectin, giving fibrosis. A side branch shows VEGF and anti-endothelial cell antibodies causing scarring and vascular dysfunction."
        caption: "الـ ==TGF-β== والـ **connective tissue growth factor (CTGF)** هما اللي بيدّوا الأوامر للـ fibroblast. علشان كده في العلاج هتلاقي **anti TGF-β1** في قائمة الـ antifibrotics."
        svg: |
          <svg viewBox="0 0 330 420" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L21a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
