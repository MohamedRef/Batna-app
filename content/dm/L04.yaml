  # ---------- p38-39: cardiorenal ----------
  - id: dm.L04.005
    kind: card
    topic: cardiorenal
    front: What sits under every arm of the ADA type 2 algorithm?
    back: Healthy lifestyle behaviors, diabetes self-management education and support. Then two goals run side by side - cardiorenal risk reduction in high-risk patients, and achieving and maintaining glycemic and weight goals.
    src: { page: 38, quote: "Healthy lifestyle behaviors, diabetes self-management education, and support" }
    status: unverified
  - id: dm.L04.006
    kind: enumerate
    topic: cardiorenal
    prompt: What counts as established ASCVD in the ADA algorithm?
