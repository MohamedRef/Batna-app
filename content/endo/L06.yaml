  - id: endo.L06.045
    kind: mcq
    topic: levothyroxine
    stem: A woman on levothyroxine 150 µg daily has a TSH of 18 mU/L. She takes the tablet with breakfast, coffee and her calcium and iron tablets. What is the most likely cause?
    options: [Maladministration impairing absorption, Resistance to thyroid hormone, TSH assay interference, Change in L-T4 preparation]
    answer: 0
    why:
      - "Correct: L-T4 must be taken on an empty stomach; coffee, calcium and iron all impair absorption."
      - "RTH gives high FT4 and FT3 with a normal TSH on large doses."
      - "Interference gives a high TSH with normal FT4 and FT3, but here there is an obvious cause."
      - "Nothing in the story suggests a new brand."
