  - id: geri.L09.018
    kind: mcq
    topic: innate
    stem: Which age-related change in innate immunity is described in the lecture?
    options:
      - NK cells increase in number but lose cytotoxicity
      - Neutrophils show enhanced free radical production
      - Dendritic cells present antigen more efficiently
      - Macrophages gain phagocytic capacity
      - NK cell antibody-dependent cytotoxicity is lost completely
    answer: 0
    why:
      - "Correct: NK cells increase in number with reduced cytotoxicity (p157)."
      - Neutrophil free radical production is impaired.
