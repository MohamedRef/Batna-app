  - id: neph.L06.lesson8
    title: "الـ K العالي: Calcium → Cells → Clear"
    hook: "تلات خطوات بالترتيب: احمي القلب، خبّي الـ K، طلّعه. وواحدة منهم ما بتنزّلش الـ K خالص."
    minutes: 9
    pages: [139, 139]
    topics: [hyperk-treat]
    goals:
      - "تعرف إمتى الـ hyperkalemia تبقى طوارئ"
      - "ترتّب العلاج الطارئ وتعرف كل دوا بيشتغل إزاي"
      - "تختار الـ K binder المناسب وتعرف عيب كل واحد"
    status: unverified
    steps:
      - kind: explain
        page: 139
        title: "إمتى تجري؟"
        quote: "Hyperkalemia\n  Changes on electrocardiogram and/or rapid rise in plasma K+ (as in rhabdomyolysis, tumor lysis syndrome, crush injury)\n    Emergent treatment indicated\n      Stabilize myocardial cell membrane: Calcium gluconate (10 mL of 10% IV)\n      Cell shift (redistribution): Insulin: (10 U regular insulin IV with 1 amp (50 mL) D50 IV); Albuterol: (20 mg in 4 mL nebulized)\n      Remove from body\n        Oliguria or ESKD → Hemodialysis\n        Hypervolemic (nonoliguric) → Diuretics\n        Metabolic acidosis → Sodium bicarbonate\n        Consider K+-binding drugs\n  Nonemergent → Exclude pseudo-hyperkalemia (particularly in absence of risk factors)\n    Dietary K+ counseling, avoid salt substitutes\n    Discontinue drugs (if possible) that interfere in kidney K+ secretion, inquire about use of over-the-counter NSAIDs and herbal preparations\n    Ensure effective diuretic therapy (loop diuretics with eGFR < 30 mL/min)\n    Oral NaHCO3 to treat metabolic acidosis\n    Consider K+-binding drugs (can facilitate recommended doses of RAASi)"
        text: |
          الكتاب بيقول الـ **emergent treatment** لو في حاجة من اتنين:

          - **تغيير في الـ ECG**.
          - **ارتفاع سريع** في الـ K، زي الـ **rhabdomyolysis** والـ **tumor lysis syndrome** والـ ==crush injury==.

          ليه؟ التفسير المقبول (مش في الكتاب): الـ ECG معناه إن القلب **اتأثر خلاص**، مش هتستنى رقم. والارتفاع السريع معناه إن خلايا كتير اتكسرت ولسه بتتكسر، والجسم ما لحقش يتأقلم، والرقم الجاي هيبقى أعلى.

          غير كده: ابدأ من فوق، **استبعد الـ pseudohyperkalemia** وبعدين اشتغل على الأسباب بهدوء.
      - kind: figure
        page: 139
        quote: "Hyperkalemia\n  Changes on electrocardiogram and/or rapid rise in plasma K+ (as in rhabdomyolysis, tumor lysis syndrome, crush injury)\n    Emergent treatment indicated\n      Stabilize myocardial cell membrane: Calcium gluconate (10 mL of 10% IV)\n      Cell shift (redistribution): Insulin: (10 U regular insulin IV with 1 amp (50 mL) D50 IV); Albuterol: (20 mg in 4 mL nebulized)\n      Remove from body\n        Oliguria or ESKD → Hemodialysis\n        Hypervolemic (nonoliguric) → Diuretics\n        Metabolic acidosis → Sodium bicarbonate\n        Consider K+-binding drugs\n  Nonemergent → Exclude pseudo-hyperkalemia (particularly in absence of risk factors)\n    Dietary K+ counseling, avoid salt substitutes\n    Discontinue drugs (if possible) that interfere in kidney K+ secretion, inquire about use of over-the-counter NSAIDs and herbal preparations\n    Ensure effective diuretic therapy (loop diuretics with eGFR < 30 mL/min)\n    Oral NaHCO3 to treat metabolic acidosis\n    Consider K+-binding drugs (can facilitate recommended doses of RAASi)"
        title: "الطوارئ: Calcium → Cells → Clear"
        alt: "Emergent hyperkalemia ladder. Step 1 stabilize the myocardial membrane with calcium gluconate 10 mL of 10% IV. Step 2 shift potassium into cells with 10 units regular insulin IV plus 50 mL D50, and albuterol 20 mg nebulized. Step 3 remove potassium: hemodialysis in oliguria or ESKD, diuretics if hypervolemic nonoliguric, sodium bicarbonate in metabolic acidosis. Then consider potassium binders."
        caption: "تلات خطوات: **Calcium** يحمي القلب، **Cells** (insulin و albuterol) تشيل الـ K جوّه، **Clear** يطلّعه من الجسم. الـ calcium **ما بينزّلش** الـ K."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L06e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="5" y="5" width="320" height="58" rx="8" class="fg-bad"/>
            <text x="15" y="25" class="t-b">1 Calcium: stabilize myocardium</text>
            <text x="15" y="45" class="t-sm">Calcium gluconate 10 mL of 10% IV</text>
            <path d="M165 63 L165 78" class="fg-arrow" marker-end="url(#L06e)"/>
            <rect x="5" y="80" width="320" height="72" rx="8" class="fg-acc"/>
            <text x="15" y="100" class="t-b">2 Cells: shift K in</text>
            <text x="15" y="120" class="t-sm">Insulin 10 U IV + 50 mL D50</text>
            <text x="15" y="138" class="t-sm">Albuterol 20 mg in 4 mL nebulized</text>
            <path d="M165 152 L165 167" class="fg-arrow" marker-end="url(#L06e)"/>
            <rect x="5" y="169" width="320" height="86" rx="8" class="fg-good"/>
            <text x="15" y="189" class="t-b">3 Clear: remove from body</text>
            <text x="15" y="209" class="t-sm">Oliguria / ESKD → hemodialysis</text>
            <text x="15" y="226" class="t-sm">Hypervolemic, nonoliguric → diuretics</text>
            <text x="15" y="243" class="t-sm">Metabolic acidosis → sodium bicarbonate</text>
            <rect x="5" y="263" width="320" height="32" rx="8" class="fg-box"/>
            <text x="165" y="284" text-anchor="middle" class="t-sm t-b">Then consider K-binding drugs</text>
          </svg>
      - kind: explain
        page: 139
        title: "كل دوا في السلم بيعمل إيه؟"
        quote: "Hyperkalemia\n  Changes on electrocardiogram and/or rapid rise in plasma K+ (as in rhabdomyolysis, tumor lysis syndrome, crush injury)\n    Emergent treatment indicated\n      Stabilize myocardial cell membrane: Calcium gluconate (10 mL of 10% IV)\n      Cell shift (redistribution): Insulin: (10 U regular insulin IV with 1 amp (50 mL) D50 IV); Albuterol: (20 mg in 4 mL nebulized)\n      Remove from body\n        Oliguria or ESKD → Hemodialysis\n        Hypervolemic (nonoliguric) → Diuretics\n        Metabolic acidosis → Sodium bicarbonate\n        Consider K+-binding drugs\n  Nonemergent → Exclude pseudo-hyperkalemia (particularly in absence of risk factors)\n    Dietary K+ counseling, avoid salt substitutes\n    Discontinue drugs (if possible) that interfere in kidney K+ secretion, inquire about use of over-the-counter NSAIDs and herbal preparations\n    Ensure effective diuretic therapy (loop diuretics with eGFR < 30 mL/min)\n    Oral NaHCO3 to treat metabolic acidosis\n    Consider K+-binding drugs (can facilitate recommended doses of RAASi)"
        text: |
          الجرعات من الكتاب، والـ "ليه" التفسير المقبول (مش في الكتاب):

          - **Calcium gluconate 10 mL of 10%**: بيرجّع الـ threshold بتاع غشاء القلب لمكانه فالقلب يبطّل يتهيّج. ==ما بينزّلش الـ K==، بيشتري وقت بس.
          - **Insulin 10 U مع 50 mL D50**: نفس الـ Na/K-ATPase اللي شفناها في ص 135 بتدخّل الـ K الخلايا. الـ **D50** علشان السكر ما يقعش.
          - **Albuterol 20 mg nebulized**: beta-2، نفس المضخة، طريق تاني.
          - **Hemodialysis** في الـ oliguria أو ESKD: مفيش كلية تطلّع، يبقى نطلّعه إحنا.
          - **Diuretics** لو العيان وارم وبيعمل بول: بتوصّل Na أكتر للـ distal nephron فيتبادل مع K يطلع.
          - **Sodium bicarbonate** في الـ metabolic acidosis: عكس اللي شفناه في الأسباب، الـ H+ يطلع والـ K يدخل.
      - kind: order
        page: 139
