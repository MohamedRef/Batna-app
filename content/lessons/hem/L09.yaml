        text: "بعد الـ US Food and Drug Administration (FDA) approval بتاع الـ ruxolitinib، دلوقتي فيه 3 JAK inhibitors تانيين للـ myelofibrosis: **fedratinib**، و **pacritinib** (لو الصفائح أقل من 50)، و **momelotinib** (لو فيه أنيميا). الكتاب بيقول ruxolitinib، فاكتبه في الامتحان."
