    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L14.174
    kind: card
    topic: hrs
    front: What albumin dose is used with vasoconstrictors in HRS, and why does albumin help?
    back: 20-40 g/day guided by central venous pressure; it maintains cardiac output and has antioxidant and anti-inflammatory (non-oncotic) actions.
    src: { page: 493, quote: "To date, albumin has been given at a dose of 20-40 g/day and managed only according to the level of central venous pressure in order to avoid circulatory overload." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.175
    kind: card
    topic: hrs
    front: Compare terlipressin with midodrine-octreotide and noradrenaline in HRS.
    back: Terlipressin + albumin beat midodrine + octreotide + albumin, and beat noradrenaline in ACLF. Noradrenaline is cheaper but needs a central line and ICU.
    src: { page: 493, quote: "In a recent randomised trial, terlipressin was shown to be more effective than noradrenaline in the treatment of HRS in patients with ACLF;this is probably related to the fact that noradrenaline, unlike terlipressin, has no effect on portal pressure or on the expression of inducible NOS." }
    update:
      text: "Boxed warning: serious or fatal respiratory failure. Check SpO2 before starting and keep monitoring it; do not start if SpO2 is <90%. Volume overload and ACLF grade 3 raise the risk, so watch for fluid overload and cut or stop albumin if it appears. Patients with creatinine ≥5 mg/dL are unlikely to benefit. In the exam give the book's answer."
      ref: "Terlivaz (terlipressin) prescribing information 2022, boxed warning; CONFIRM trial, NEJM 2021"
    status: unverified
  - id: neph.L14.176
    kind: card
    topic: hrs
    front: When do you stop vasoconstrictors plus albumin in HRS?
    back: Continue until creatinine is within 0.3 mg/dL of baseline; stop by 14 days if there is no or only partial response.
    src: { page: 493, quote: "In patients with no response or partial response, the treatment should be discontinued within 14 days." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.177
    kind: card
    topic: hrs
    front: What is the optimal treatment of HRS-AKI?
    back: Liver transplantation, whatever the response to drugs. SLK versus LT alone depends on AKI duration, dialysis need and CKD.
    src: { page: 494, quote: "LT represents the optimal treatment for patients with HRS-AKI regardless of their response to phar-macological treatment." }
    status: unverified
    tags: [high-yield]
  # ---------- p494-502: dysproteinemia ----------
  - id: neph.L14.178
    kind: card
    topic: dysprot
    front: What are dysproteinemic kidney diseases?
    back: Kidney damage from pathogenic monoclonal immunoglobulins or light chains made by B-cell or plasma-cell clones.
    src: { page: 494, quote: "Dysproteinemic kidney diseases occur when B or plasma cell clones produce pathogenic monoclonal immunoglobulins or light chains that cause kidney damage." }
    status: unverified
  - id: neph.L14.179
    kind: card
    topic: dysprot
    front: MGUS versus MGRS?
    back: "MGUS: monoclonal gammopathy without end-organ damage. MGRS: monoclonal gammopathy causing kidney damage without overt malignancy."
    src: { page: 495, quote: "When monoclonal gammopathy-related kidney damage occurs in the absence of overt malignancy, the hematologic disorder is categorized as monoclonal gammopathy of renal significance (MGRS)." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.180
    kind: card
    topic: dysprot
    front: What is the treatment goal in dysproteinemic kidney disease?
    back: A hematologic response (fall or loss of the monoclonal protein) by eradicating the clone; organ response depends on it.
    src: { page: 495, quote: "Regardless of clonal cell burden, the goal of treatment is to achieve a hematologic response (ie, improvement or resolution of the monoclonal protein) by eradicating the underlying clone." }
    status: unverified
  - id: neph.L14.181
    kind: cloze
    topic: dysprot
    text: "Myeloma incidence is about {{c1::11}} per 100,000/year; {{c2::20-30%}} present with reduced GFR at diagnosis."
    src: { page: 495, quote: "Multiple myeloma is one of the most common hematologic malignancies with an annual incidence of about 11 per 100,000 patients." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.182
    kind: card
    topic: dysprot
    front: What is the commonest cause of reduced GFR in multiple myeloma, and its mechanism?
    back: Light chain cast nephropathy; free light chains bind Tamm-Horsfall protein (uromodulin) in the distal nephron, obstruct tubules and cause giant-cell reaction and interstitial inflammation.
    src: { page: 496, quote: "The most common cause of decreased GFR in patients with multiple myeloma is light chain cast nephropathy." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.183
    kind: card
    topic: dysprot
    front: How do free light chains injure proximal tubule cells?
    back: Excess endocytosis via cubilin-megalin triggers NF-κB/MAPK, inflammatory and fibrotic cytokines (IL-6, IL-8, CCL2, TGF-β1).
    src: { page: 497, quote: "The very high concentrations of FLCs present in the ultrafiltrate of patients with multiple myeloma can result in direct injury to PTCs. The excessive endocytosis of FLCs by the cubilin-megalin complex expressed on PTCs can trigger apoptotic, proinflammatory and fibrotic pathways. Activation of redox pathways occurs, with increased expression of NFKB and MAPK, which in turn leads to the transcription of both inflammatory and profibrotic cytokines, such as IL-6, IL-8, CCL2 and TGF-β1. In the distal tubules, FLCs can bind to a specific binding domain on THPs and co-precipitate to form casts. These casts result in tubular atrophy proximal to the cast and lead to progressive interstitial inflammation and fibrosis. Abbreviations: CCL2, C-C motif chemokine 2; CDR, complementarity determining region; FLC, free light chain; IL, interleukin; MAPK, mitogen-activated protein kinase; NFKB, nuclear factor KB; PTC, proximal tubule cell; TGF-β1, transforming growth factor ẞ1; THP, Tamm-Horsfall protein." }
    status: unverified
  - id: neph.L14.184
    kind: table
    topic: dysprot
    title: Where light chains injure the nephron (Figure, p499)
    columns: [Lesion, Site and finding]
    rows:
      - [AL amyloidosis, FLC fibrils within the glomerulus]
      - [Light chain deposition disease, FLC deposits along basement membranes]
      - [Fanconi syndrome, FLC crystals within proximal tubular cells]
      - [Cast nephropathy (myeloma kidney), Waxy FLC casts in the distal tubule lumen]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 499, quote: "Free light chains (FLC)\n  Glomerulus:\n    AL amyloidosis: FLC fibrils within glomerulus\n    Light Chain Deposition Disease: FLC deposit along basement membranes\n  Proximal tubule:\n    Fanconi's Syndrome: FLC crystals within epithelial cells\n    Excessive Endocytosis: Tubular cell injury & necrosis\n  Distal tubule:\n    Cast Nephropathy (also known as Myeloma Kidney): FLC form waxy casts within the tubule lumen" }
    status: unverified
