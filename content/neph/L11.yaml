  # ---------- p356-357: preeclampsia ----------
  - id: neph.L11.021
    kind: cloze
    topic: preeclampsia
    text: "Preeclampsia affects {{c1::5-8%}} of pregnancies and causes {{c2::15-20%}} of pregnancy-related AKI."
    src: { page: 356, quote: "Preeclampsia affects 5–8% of pregnancies and accounts for 15–20% of pregnancy- related AKI. Diagnosis of preeclampsia is made by the new onset of hypertension after 20 weeks of gestation in a previously normotensive woman. Hypertension is defined by blood pressure ≥ 140/90 mm Hg on two occasions 4 hours apart, or ≥160/110 mm Hg within a shorter interval, and proteinuria ≥ 300-mg/24-hour urine or spot urine protein creatinine ratio 0.3g (dipstick 1+). Of note, preeclampsia can be diagnosed in the absence of proteinuria if any of the following signs of end-organ dysfunction are present: elevated serum creatinine > 1.1 mg/dl or doubling of serum creatinine in the absence of other kidney disease, thrombocytopenia (<100,000/microliter), elevated liver transaminases ≥ two times normal, pulmonary edema or, cerebral/visual symptoms. A subset of patients, about 40–50% will experience preeclampsia with severe features, which is defined as systolic blood ≥160 mmHg or diastolic blood pressure ≥110 mmHg and proteinuria or systolic blood pressure ≥140 mm Hg systolic or diastolic blood pressure of ≥90 mmHg with or without proteinuria but with the presence of end-organ dysfunction." }
    status: unverified
    tags: [numbers]
