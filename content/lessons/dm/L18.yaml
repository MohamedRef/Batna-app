          5. **Poor responders**: زوّد uricosuric.
          6. **Non-responders و intolerant**: pegloticase.
          7. **Rasburicase**: لحالات حادة مختارة.

          يعني كل خطوة للي فشل أو ما استحملش اللي قبلها.
