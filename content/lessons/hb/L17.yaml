          - **ESGE و ACG:** **ضد الـ routine drainage** في الـ malignant **extrahepatic** obstruction. خليها لـ: **cholangitis**، **severe symptomatic jaundice** (زي pruritus شديد)، **delayed surgery**، أو **قبل neoadjuvant chemo** في عيان jaundiced.
          - **AASLD:** في الـ resection للـ **perihilar أو distal** CCA، **drainage للـ remnant liver** recommended لو فيه obstruction.
