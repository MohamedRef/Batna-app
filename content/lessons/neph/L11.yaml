        quote: "liver and can complicate the diagnosis of lupus nephritis. Kidney ultrasound should be performed to rule out post-obstructive causes of AKI, such as pathological hydronephrosis. Pathological hydronephrosis should be differentiated from physiological hydronephrosis. Due to the hypercoagulable state of pregnancy, ultrasound with doppler should be performed if there is a high suspicion for the embolic disease. Common causes of AKI in the second and third trimester like preeclampsia, HELLP syndrome, TTP, aHUS, AFLP, and lupus nephritis can have overlapping features and requires detailed evaluation.(23) Kidney biopsy should be considered when the laboratory evaluation for AKI is non-diagnostic, and a definitive diagnosis will help facilitate appropriate treatment outweighing the risks of biopsy. The decision to perform a kidney biopsy is based on gestation age, available treatment options, and viability of pregnancy. Since late-term pregnancy biopsies have a higher risk of complication, notably after 25 weeks, it is recommended to biopsy in the first and second trimesters, and best to avoid in the third trimester unless treatment of AKI leads to improvement in maternal and fetal outcomes.(24) Depending on fetal maturity, and the impact of declining kidney function on fetus and mother, early delivery should be weighed and offered when feasible. Delivery prior to biopsy may be a more prudent option for the late-term pregnancies, especially if the fetus has reached viability. Complications and risks should be thoroughly discussed with the patient, including the risk of major bleeding requiring transfusion, embolization, severe obstetric complications, early preterm delivery, and fetal death.(25) Women at high risk for developing an AKI should be evaluated in the postpartum period with regular monitoring of blood pressure, kidney function, and proteinuria. This includes women with CKD prior to pregnancy, as well as those who developed preeclampsia during pregnancy. aHUS is usually diagnosed postpartum, and when suspected, laboratory work including complement levels should be completed during hospitalization. Hemodynamic monitoring in high-risk pregnancies should be performed during follow-up visit as postpartum derangements may be associated with developing postpartum cardiomyopathy or HUS.(13)"
