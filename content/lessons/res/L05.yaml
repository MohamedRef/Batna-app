  - id: res.L05.lesson7
    title: "الـ cohort اللي بيرجع لورا: retrospective cohort"
    hook: "records مصنع من سنين، ونتتبع العمال لحد النهارده. ده cohort برضه، بس بيبدأ من الماضي. ونختم بأسئلة الدكتورة نفسها."
    minutes: 8
    pages: [66, 72]
    topics: [retrospective, risk]
    goals:
      - "تعرف الـ retrospective (historical) cohort"
      - "تفرّقه عن الـ case-control"
      - "تحسب RR و AR و ARP من أرقام المحاضرة"
    status: unverified
    steps:
      - kind: explain
        page: 66
        quote: "Retrospective Cohort Study:\n  A retrospective cohort study is one in which the outcome have all occurred before the start of investigation.\n  Investigator goes back to the past to select study group from existing records of the past employment, medical and other records and traces them forward through time from the past date fixed on the records usually to the present.\n  Known with the name of Historical Cohort and noncurrent cohort"
        title: "الـ retrospective cohort"
        text: |
          ده cohort بس ==كل الـ outcomes حصلت قبل ما الدراسة تبدأ==.

          الباحث بيرجع للماضي ويختار المجموعة من ==records قديمة== (شغل، طبية...)، ويتتبعهم **لقدّام** من التاريخ ده لحد النهارده.

          اسمه كمان ==historical cohort== أو **non-concurrent cohort**.
      - kind: aside
        tone: trap
        page: 67
        quote: "Prospective versus Retrospective Cohort Studies\n| | Exposure | Outcome |\n|---|---|---|\n| Prospective | Assessed at the beginning of the study (present) | Followed into the future for outcome |\n| Retrospective | Assessed at some point in the past | Outcome has already occurred |"
        text: |
          متخلطش الـ **retrospective cohort** بالـ **case-control**!

          في الاتنين الـ **outcome has already occurred**، وبيبصوا للماضي، بس الفرق في **بتختار الناس على أساس إيه**:

          - على أساس الـ **exposure** (من الـ records) وتمشي لقدّام = **retrospective cohort**.
          - على أساس **المرض** وترجع لورا = **case-control**.

          ودكتورة سحر في المراجعة: إن الـ exposure قديم (زي إشعاع على الرقبة في الطفولة) **ما يخليش** الدراسة retrospective أوتوماتيك. لو بتختار الناس دلوقتي وتتابعهم لقدّام، ده prospective cohort. اسأل: اختيار الناس بدأ منين، والـ outcome بيتسجّل إمتى، وهل الدراسة قايمة على records قديمة؟
      - kind: table
        page: 67
        quote: "Prospective versus Retrospective Cohort Studies\n| | Exposure | Outcome |\n|---|---|---|\n| Prospective | Assessed at the beginning of the study (present) | Followed into the future for outcome |\n| Retrospective | Assessed at some point in the past | Outcome has already occurred |"
        title: "Prospective vs retrospective cohort"
        columns: ["", "Prospective", "Retrospective"]
        rows:
          - ["Exposure", "Assessed at the start (present)", "Assessed at some point in the past"]
          - ["Outcome", "Followed into the future", "Already occurred"]
        hide: [[0, 2], [1, 2]]
      - kind: explain
        page: 68
        quote: "Retrospective cohort: Requires good records of past exposure for a group of people who can then be traced to determine their current health. E.g., studying the effects of exposure to industrial hazards, studying mortality or cancer outcomes."
        title: "بنستخدمه إمتى؟"
        text: |
          محتاج ==good records of past exposure== لمجموعة نقدر نوصلهم ونعرف صحتهم دلوقتي.

          ممتاز لـ ==unusual or occupational exposures==: industrial hazards والكيماويات، مع outcomes زي الـ mortality والـ cancer.
      - kind: figure
        page: 68
        title: "شريحة 68: الـ prospective والـ retrospective على خط الزمن"
        image: { file: res/L05-s68-timeline.webp, book: true }
        alt: "Diagram titled Study. A time line at the bottom divided into Past, Present and Future. Row Prospective cohort: Exposure then an arrow to Disease, placed over the present and future. Row Retrospective cohort: Exposure then an arrow to Disease, placed over the past and present."
        caption: |
          الرسمة بتقارن النوعين على نفس خط الزمن (**Past ← Present ← Future**) تحت:

          - **Prospective cohort**: **Exposure → Disease** مرسومين فوق الـ present والـ future: بتقيس الـ exposure دلوقتي وتستنى المرض.
          - **Retrospective cohort**: نفس **Exposure → Disease** بالظبط، بس مزحوقين لـ ==الماضي==: الاتنين حصلوا قبل ما الدراسة تبدأ.

          اللي تاخده: الاتجاه واحد في الاتنين (==من الـ exposure للمرض==)، وده اللي بيخلي الـ retrospective cohort لسه cohort مش case-control؛ اللي اتغير بس هو إمتى حصل.
      - kind: explain
        page: 69
        quote: "Retrospective cohort studies are particularly useful for\nunusual exposures or occupational exposures\nExposure to\nchemicals"
        title: "Retrospective cohort: للـ exposures الغريبة"
        text: |
          الـ retrospective cohort ==مفيد جدًا للـ unusual exposures أو الـ occupational exposures==، زي التعرض للـ chemicals.

          ليه؟ لأن عدد المتعرضين قليل ومتجمعين في مكان شغل واحد، وسجلات الشغل القديمة بتقولك مين اتعرض من سنين، فمش محتاج تستنى عشرين سنة. التفسير المقبول (مش في الكتاب).
      - kind: figure
        page: 69
        title: "شريحة 69: مثال عمّال الكاوتش"
        image: { file: res/L05-s69-tire-makers.webp, book: true }
        alt: "Diagram on a blue background. A grey cloud labelled Employees of tire manufacturer with a photo of workers handling tires. Two arrows lead down from it: one to Had factor and one to Didn't have factor. Above a dashed line labelled Exposure to chemicals, an orange oval Tire makers and a green oval Clerical staff both point to a box Compare Incidence of Death. A box labelled Past sits at the bottom, and on the right a cartoon detective with a light bulb stands beside a box Start of Study."
        caption: |
          الرسمة دي بتجسّم المثال اللي فوق:

          - **فوق شمال**: **Employees of tire manufacturer** (عمال مصنع كاوتش)، وجنبهم صورة العمال.
          - **السهمين النازلين**: يتقسموا **Had factor** و**Didn't have factor**.
          - **في النص**: البيضاوي البرتقاني **Tire makers** (اتعرضوا لـ **Exposure to chemicals**) والأخضر **Clerical staff** (الموظفين في المكاتب، من غير exposure).
          - **يمين**: الاتنين داخلين على **Compare Incidence of Death**، وبعدها **Start of Study** والمحقق؛ وتحت مكتوب **Past**.

          اللي تاخده: الباحث بيبدأ ==النهارده== من سجلات الشغل القديمة، يعرف مين كان tire maker ومين clerical staff، ويقارن الوفيات؛ والمجموعتين من نفس المصنع، فالـ comparison group شبههم في حاجات كتير.
