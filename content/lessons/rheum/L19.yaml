  - id: rheum.L19.lesson5
    title: "الـ criteria وعلاج الـ lupus nephritis"
    hook: "4 من 11، و MMF بنفس كفاءة الـ cyclophosphamide وأأمن."
    minutes: 8
    pages: [322, 323]
    topics: [criteria, ln-treatment]
    goals:
      - "تعدّ الـ 11 criteria"
      - "تعرف متابعة الـ lupus nephritis وليه الـ dsDNA و C3 supplemental"
      - "تختار بين cyclophosphamide و MMF وتعرف مكان الـ transplant"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L19.084]
        page: 322
        title: "الـ 11 criteria"
        quote: "Classification criteria for diagnosis of SLE (>4 of 11)\nMalar rash.\nDiscoid rash.\nPhotosensitivity.\nOral ulcers.\nArthritis.\nSerositis."
        text: |
          محتاج ==4 من 11== أو أكتر. (الكتاب مطبوع فيه **>4 of 11**، والقاعدة الأصلية 4 أو أكتر.)

          1. **Malar rash**
          2. **Discoid rash**
          3. **Photosensitivity**
          4. **Oral ulcers**
          5. **Arthritis**
          6. **Serositis**
          7. **Renal:** proteinuria > 0.5 g أو cells/casts
          8. **Neurological:** seizure أو psychosis
          9. **Haematologic:** hemolytic anemia، leukopenia/lymphopenia، thrombocytopenia
          10. **Immunological:** anti-DNA، anti-Sm، anticardiolipin
          11. **Antinuclear antibodies (ANA)**

          ليه 4 مش واحدة؟ لأن ولا criterion لوحده specific؛ الـ ANA نفسه موجود في أمراض تانية. التجميع هو اللي بيدّي الثقة.
      - kind: mnemonic
        page: 322
        quote: "Classification criteria for diagnosis of SLE (>4 of 11)\nMalar rash.\nDiscoid rash.\nPhotosensitivity.\nOral ulcers.\nArthritis.\nSerositis."
        word: "SOAP BRAIN MD"
        parts:
          - { key: "S", text: "Serositis" }
          - { key: "O", text: "Oral ulcers" }
          - { key: "A", text: "Arthritis" }
          - { key: "P", text: "Photosensitivity" }
          - { key: "B", text: "Blood (haematologic disorder)" }
          - { key: "R", text: "Renal disorder" }
          - { key: "A", text: "ANA positivity" }
          - { key: "I", text: "Immunological (anti-DNA, anti-Sm, anticardiolipin)" }
          - { key: "N", text: "Neurological (seizure, psychosis)" }
          - { key: "M", text: "Malar rash" }
          - { key: "D", text: "Discoid rash" }
        hook: "الـ mnemonic المشهور: **SOAP BRAIN MD**، صابونة للمخ يا دكتور. 11 حرف = 11 criteria."
      - kind: check
        page: 322
        quote: "Classification criteria for diagnosis of SLE (>4 of 11)"
        question: "A woman has a malar rash, oral ulcers and a positive ANA. Which single new finding brings her to 4 of the 11 criteria?"
        options: ["Proteinuria above 0.5 g per day", "Raynaud phenomenon", "Alopecia", "Normocytic anemia"]
        answer: 0
        why:
          - "صح: الـ renal disorder criterion هو proteinuria > 0.5 g أو cells/casts."
          - "الـ Raynaud شائع بس مش من الـ 11 (ومش specific)."
          - "الـ alopecia في قايمة الجلد بس مش criterion."
          - "الـ haematologic criterion هو hemolytic anemia، مش الـ normocytic."
      - kind: update
        page: 322
        quote: "Classification criteria for diagnosis of SLE (>4 of 11)"
        text: "الـ criteria الأحدث بتبدأ بـ **ANA ≥ 1:80** كشرط دخول، وبعدين نقط موزونة، ومحتاج **≥ 10** مع criterion إكلينيكي واحد على الأقل. الامتحان: الـ 11 بتوع الكتاب."
        ref: "EULAR/ACR SLE classification criteria, 2019"
      - kind: explain
        page: 323
        title: "متابعة وعلاج الـ lupus nephritis"
        quote: "Mycophenolate mofetil has demonstrated similar efficacy compared with pulse cyclophosphamide and a more favourable toxicity profile."
        text: |
          **المتابعة:** **biopsy**، sediment، proteinuria، و kidney function (مع بعض). الـ **anti-dsDNA و C3** دورهم **محدود**، supplemental بس.

          **العلاج:**
          - **Proliferative lupus nephritis (LN)** ← **glucocorticoids + immunosuppressant** بيمنعوا الـ end-stage renal disease (ESRD).
          - **Cyclophosphamide** الوحيد اللي اتثبتت كفاءته long-term، بس side effects كتير.
          - ==Mycophenolate mofetil== نفس كفاءة الـ pulse cyclophosphamide وأأمن.
          - الـ **flares** بعد الـ remission مش نادرة ← follow-up.
          - **ESRD:** dialysis و transplant نتايجهم زي غير الـ systemic lupus erythematosus (SLE)؛ الـ **transplant** هو الـ method of choice.

          ليه الـ proliferative بالذات بياخد immunosuppression؟ لأن الـ class III و IV هما اللي الخلايا فيهم بتتكاثر وتقفل الـ glomeruli، فلو ماتهدّاش يوصل ESRD.
      - kind: figure
        page: 323
        quote: "Mycophenolate mofetil has demonstrated similar efficacy compared with pulse cyclophosphamide and a more favourable toxicity profile."
        title: "طريق الـ proliferative LN"
        alt: "Flow from proliferative lupus nephritis to glucocorticoids plus an immunosuppressant, which branches into cyclophosphamide (long-term efficacy proven, considerable adverse effects) and mycophenolate mofetil (similar efficacy to pulse cyclophosphamide, better toxicity). Below: flares after remission need follow-up; end-stage renal disease is treated by dialysis or transplantation, transplantation preferred."
        caption: "الاتنين شغالين: ==cyclophosphamide== عنده الدليل الـ long-term، والـ **MMF** نفس الكفاءة بـ toxicity أقل. ولو وصلت ESRD، الـ **transplant** هو الاختيار."
