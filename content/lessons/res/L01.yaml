schema: batna.lesson/v1
lecture: res.L01
lessons:
  # ------------------------------------------------------------------
  - id: res.L01.lesson1
    title: "يعني إيه بحث أصلًا؟"
    hook: "قبل ما تسأل «الشيشة بتعمل cancer؟» لازم تعرف إن البحث مش «نجمع داتا ونشوف»: البحث سؤال، وخطة، وصبر."
    minutes: 7
    pages: [2, 9]
    topics: [course]
    goals:
      - "تعرف المقرر ده بيتقيّم إزاي ونوع الأسئلة اللي هتقابلها"
      - "تعدّ الـ 8 مهارات اللي الكورس هيدّيهالك بالترتيب"
    status: unverified
    steps:
      - kind: explain
        page: 2
        quote: "The course introduces participants to different approaches used for designing health research projects.\nAs the research process is not simply about the methodology of research design, the course will cover the broad spectrum of the research process.\nPART 1: RESEARCH METHODOLOGY\nPART 2: BIOSTATISTICS"
        title: "المقرر في سطرين"
        text: |
          الـ **Basics of Research** جزئين:

          - **Part 1: Research methodology**: إزاي تختار مشكلة، تكتب سؤال، تختار الـ study design، وتكتب proposal.
          - **Part 2: Biostatistics**: إزاي تحلل الداتا وتفهم الأرقام.

          الدكتورة بتأكد إن البحث ==مش بس research design==: المقرر بيغطي الـ **research process** كله، من اختيار المشكلة لحد ما التوصيات تتنفذ على الأرض.
      - kind: explain
        remind: [res.L01.002]
        page: 3
        quote: "prioritize problems for research\nformulate a focused research question/hypothesis\nselect an appropriate study design depending on the question to be addressed\noperationalize the research question into a research plan and write a research proposal"
        title: "الكورس هيعلّمك تعمل إيه؟"
        text: |
          أول 4 مهارات في slide 3 هي **مرحلة التخطيط**:

          - ==prioritize problems==: تختار مشكلة تستاهل.
          - **formulate a focused question/hypothesis**: سؤال واحد واضح.
          - **select a study design** يناسب السؤال، مش العكس.
          - **operationalize** السؤال لـ research plan وتكتب ==research proposal==.

          ليه الترتيب ده؟ لأن كل خطوة بتبني على اللي قبلها: الـ design بيتحدد من السؤال، والـ proposal هو السؤال والـ design مكتوبين كخطة. لو بدأت بالـ design قبل السؤال، هتلاقي نفسك بتدوّر على سؤال يناسب الداتا اللي معاك. التفسير المقبول (مش في الكتاب).
      - kind: figure
        page: 3
        quote: "prioritize problems for research\nformulate a focused research question/hypothesis\nselect an appropriate study design depending on the question to be addressed\noperationalize the research question into a research plan and write a research proposal"
        title: "الرحلة اللي الكورس هيمشّيك فيها"
        svg: |
          <svg viewBox="0 0 330 424" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L01k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="20" y="8" width="290" height="32" rx="8" class="fg-acc"/>
            <text x="165" y="29" text-anchor="middle" class="t-sm t-b">Prioritize problems</text>
            <path d="M165 42v14" class="fg-arrow" marker-end="url(#L01k)"/>
            <rect x="20" y="60" width="290" height="32" rx="8" class="fg-box"/>
            <text x="165" y="81" text-anchor="middle" class="t-sm t-b">Focused question / hypothesis</text>
            <path d="M165 94v14" class="fg-arrow" marker-end="url(#L01k)"/>
            <rect x="20" y="112" width="290" height="32" rx="8" class="fg-box"/>
            <text x="165" y="133" text-anchor="middle" class="t-sm t-b">Select a study design</text>
            <path d="M165 146v14" class="fg-arrow" marker-end="url(#L01k)"/>
            <rect x="20" y="164" width="290" height="32" rx="8" class="fg-acc"/>
            <text x="165" y="185" text-anchor="middle" class="t-sm t-b">Research plan + proposal</text>
            <path d="M165 198v14" class="fg-arrow" marker-end="url(#L01k)"/>
            <rect x="20" y="216" width="290" height="32" rx="8" class="fg-box"/>
            <text x="165" y="237" text-anchor="middle" class="t-sm t-b">Implement the project</text>
            <path d="M165 250v14" class="fg-arrow" marker-end="url(#L01k)"/>
            <rect x="20" y="268" width="290" height="32" rx="8" class="fg-box"/>
            <text x="165" y="289" text-anchor="middle" class="t-sm t-b">Process, analyze, interpret</text>
            <path d="M165 302v14" class="fg-arrow" marker-end="url(#L01k)"/>
            <rect x="20" y="320" width="290" height="32" rx="8" class="fg-box"/>
            <text x="165" y="341" text-anchor="middle" class="t-sm t-b">Write a scientific paper</text>
            <path d="M165 354v14" class="fg-arrow" marker-end="url(#L01k)"/>
            <rect x="20" y="372" width="290" height="44" rx="8" class="fg-acc"/>
            <text x="165" y="391" text-anchor="middle" class="t-sm t-b">Communicate + implement</text>
            <text x="165" y="407" text-anchor="middle" class="t-sm t-mut">recommendations</text>
          </svg>
        caption: "8 مهارات (slides 3-4) بالترتيب: كل مهارة بتسلّم اللي بعدها. الملوّنين: نقطة البداية، الـ proposal، والآخر اللي بيخلي البحث يفيد."
        alt: "Vertical chain of eight boxes from prioritize problems to communicate and implement recommendations."
      - kind: reveal
        page: 4
        quote: "implement the research project\nprocess data, analyze and interpret research\nresults\nwrite a scientific research paper; and\nplan for communicating research findings\nand implementation of recommendations."
        prompt: "خلّصت الـ proposal. إيه الـ 4 مهارات اللي فاضلين علشان البحث يبقى له لازمة؟"
        answer: |
          slide 4 بيكمّل الرحلة:

          - **implement** المشروع (تجمع الداتا فعلًا).
          - **process, analyze and interpret** النتايج.
          - تكتب ==scientific research paper==.
          - تخطط إزاي توصّل النتايج و**implement the recommendations**.

          السبب إن آخر خطوة موجودة أصلًا: بحث محدش قراه أو اتنفذت توصياته كأنه ماتعملش. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 6
        quote: "The course also introduces participants to the concept of Evidence-based Medicine (EBM), and its utility in making informed choices/decisions concerning patient care.\nAs an essential step for practicing EBM, Participants will acquire the skill to critically appraise published medical articles to judge their quality."
        title: "وكمان EBM"
        text: |
          في آخر المقرر هتاخد **Evidence-based Medicine (EBM)**: إزاي تاخد قرار في علاج عيانك مبني على دليل، مش على «أستاذي كان بيعمل كده».

          وأهم مهارة فيه: ==critical appraisal==، يعني تقرا paper منشور وتحكم على جودته.

          ليه ده في آخر المقرر؟ لأنك مش هتعرف تحكم على paper إلا لما تكون فاهم الـ design والإحصاء اللي اتكتب بيهم. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 7
        quote: "The course will also provide a step-by-step guide to data analysis using SPSS (Statistical Package for the Social Sciences) for Windows."
        title: "والـ SPSS"
        text: |
          الكورس بيعلّمك تحليل الداتا ==step by step== على **Statistical Package for the Social Sciences (SPSS)** for Windows.

          ليه برنامج بالذات؟ لأن الإحصاء في الامتحان مش حسابات بالإيد بس: لازم تعرف أنهي test يتعمل على أنهي داتا، والبرنامج بيخليك تشوف ده على داتا حقيقية بدل المعادلات. التفسير المقبول (مش في الكتاب).
      - kind: check
        page: 8
        quote: "Participants will receive hands-on-training to:\n set up an SPSS data file\n define variables\n perform simple manipulations on the data,\nand\n create charts and simple descriptive statistics,\nas well as selected inferential statistical tests."
        question: "In the course's SPSS hands-on training, which task is NOT on slide 8's list?"
        options:
          - "Writing the research proposal"
          - "Setting up an SPSS data file"
          - "Defining variables"
          - "Creating charts and simple descriptive statistics"
        answer: 0
        why:
          - "صح: الـ proposal مهارة من مرحلة التخطيط (slide 3)، مش من تدريب الـ SPSS."
          - "موجودة: set up an SPSS data file."
          - "موجودة: define variables، وده أول حاجة قبل أي تحليل."
          - "موجودة: charts وdescriptive statistics، وكمان selected inferential tests."
      - kind: check
        page: 9
        quote: "Assessment\n| | Methods | Grading policy |\n| Summative assessment (End of course) | ONLINE Objective written exam to assess different levels of cognitive (knowledge) learning outcomes. This will include: Multiple Choice Questions; Matching items; True/False Items | 100% |"
        question: "How is the Basics of Research course graded?"
        options:
          - "One online objective written exam at the end: 100%"
          - "Research proposal 50% + written exam 50%"
          - "Essay and short-answer exam"
          - "SPSS assignments during the course"
        answer: 0
        why:
          - "صح: summative assessment في آخر الكورس، online objective written exam = 100%."
          - "مفيش درجة على الـ proposal في slide 9."
          - "الامتحان objective: multiple choice question (MCQ) وmatching وtrue/false، مفيش essay."
          - "الـ SPSS hands-on training، بس الدرجة كلها على الامتحان."
      - kind: aside
        tone: exam
        page: 9
        quote: "Assessment\n| | Methods | Grading policy |\n| Summative assessment (End of course) | ONLINE Objective written exam to assess different levels of cognitive (knowledge) learning outcomes. This will include: Multiple Choice Questions; Matching items; True/False Items | 100% |"
        text: |
          الامتحان **MCQ + Matching + True/False** بس. يعني مش محتاج تحفظ تعريفات كلمة بكلمة زي الشفوي، محتاج ==تفرّق بين الحاجات اللي شبه بعض==: incidence ولا prevalence؟ T2 ولا T3؟ phase II ولا III؟ علشان كده الدروس هنا مليانة «حط كل حاجة في مكانها».
      - kind: try
        items: [res.L01.002, res.L01.004, res.L01.005]
    recap:
      - "المقرر: Methodology + Biostatistics، والامتحان online objective (MCQ, matching, T/F) = 100%."
      - "8 مهارات: من prioritize problems لحد communicate وimplement the recommendations."
      - "SPSS: data file، variables، charts، descriptive وselected inferential tests."
    practice: [res.L01.001, res.L01.002, res.L01.003, res.L01.004, res.L01.005, res.L01.006]  # ------------------------------------------------------------------
  - id: res.L01.lesson5
    title: "يعني إيه بحث أصلًا؟"
    hook: "ملاحظة في العيادة مش بحث. البحث سؤال، وخطوات ثابتة، وstructure."
    minutes: 6
    pages: [12, 16]
    topics: [definition, objectives]
    goals:
      - "تعرّف الـ research بالكلمتين بتوع الامتحان: systematic وorganized"
      - "تعدّ فوايد السؤال الواضح والـ 6 prime objectives"
    status: unverified
    steps:
      - kind: explain
        page: 12
        quote: "Research is the systematic and organized methods to find answer for a certain question, or solution for a problem."
        title: "التعريف"
        text: |
          **Research** = الـ ==systematic and organized methods== اللي بنستخدمها علشان نلاقي **إجابة لسؤال** أو **حل لمشكلة**.

          - **Systematic**: فيه procedures وخطوات محددة بتمشي عليها علشان توصل لأدق نتيجة (collection وanalysis وinterpretation للداتا).
          - **Organized**: فيه **structure**، كل حاجة ليها مكانها.

          مثال: إنك تلاحظ إن عيانين الـ hepatitis C virus (HCV) في العيادة كلهم بيشربوا شيشة، دي **ملاحظة**. إنك تحط سؤال، وتختار مجموعتين، وتجمع داتا بطريقة ثابتة وتحللها، ده **بحث**.
      - kind: check
        page: 14
        quote: "Systematic: Definite set of procedures and steps followed to get most accurate results. collection, analysis and interpretation of data to.\nOrganized: There is structure of research"
        question: "In the definition of research, what does 'systematic' mean?"
        options:
          - "A definite set of procedures and steps followed to get the most accurate results"
          - "There is a structure to the research"
          - "The study must use a large sample"
          - "The results are published in a peer-reviewed journal"
        answer: 0
        why:
          - "صح: systematic = خطوات وإجراءات محددة (collection وanalysis وinterpretation) علشان أدق نتيجة."
          - "ده معنى **organized**، الكلمة التانية في التعريف."
          - "حجم العينة مش جزء من التعريف."
          - "النشر مهارة في آخر الرحلة، مش اللي بيخلي الشغل بحث."
      - kind: figure
        page: 14
        quote: "Systematic: Definite set of procedures and steps followed to get most accurate results. collection, analysis and interpretation of data to.\nOrganized: There is structure of research"
        title: "ملاحظة ولا بحث؟"
        svg: |
          <svg viewBox="0 0 330 316" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L01m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="20" y="8" width="290" height="44" rx="8" class="fg-box"/>
            <text x="165" y="27" text-anchor="middle" class="t-sm t-b">Observation</text>
            <text x="165" y="43" text-anchor="middle" class="t-sm t-mut">all my HCV patients smoke shisha</text>
            <path d="M165 54v14" class="fg-arrow" marker-end="url(#L01m)"/>
            <rect x="20" y="72" width="290" height="44" rx="8" class="fg-box"/>
            <text x="165" y="91" text-anchor="middle" class="t-sm t-b">Question</text>
            <text x="165" y="107" text-anchor="middle" class="t-sm t-mut">does shisha raise HCV risk?</text>
            <path d="M165 118v14" class="fg-arrow" marker-end="url(#L01m)"/>
            <rect x="20" y="136" width="290" height="44" rx="8" class="fg-acc"/>
            <text x="165" y="155" text-anchor="middle" class="t-sm t-b">Systematic steps</text>
            <text x="165" y="171" text-anchor="middle" class="t-sm t-mut">same collection, analysis, interpretation</text>
            <path d="M165 182v14" class="fg-arrow" marker-end="url(#L01m)"/>
            <rect x="20" y="200" width="290" height="44" rx="8" class="fg-acc"/>
            <text x="165" y="219" text-anchor="middle" class="t-sm t-b">Organized structure</text>
            <text x="165" y="235" text-anchor="middle" class="t-sm t-mut">every part in its place</text>
            <path d="M165 246v14" class="fg-arrow" marker-end="url(#L01m)"/>
            <rect x="20" y="264" width="290" height="44" rx="8" class="fg-box"/>
            <text x="165" y="283" text-anchor="middle" class="t-sm t-b">Research</text>
            <text x="165" y="299" text-anchor="middle" class="t-sm t-mut">an answer you can trust</text>
          </svg>
        caption: "الملاحظة بداية بس. اللي بيحوّلها لبحث هما الكلمتين الملوّنين: خطوات ثابتة (systematic) وstructure (organized)."
        alt: "Chain from an observation to a question, then systematic steps and organized structure, ending in research."
      - kind: explain
        remind: [res.L01.009]
        page: 13
        quote: "Creates path for research process\nGuides writing\nAvoids overwhelming \"all about\" research\nSupports specific topic/ research\nKeeps research manageable"
        title: "ليه السؤال هو كل حاجة؟"
        text: |
          السؤال الواضح:

          - **Creates path**: بيرسم طريق الـ research process.
          - **Guides writing**: بيوجّه الكتابة.
          - **Avoids overwhelming "all about" research**: بيمنعك من بحث «كل حاجة عن الكبد».
          - **Supports specific topic**: بيخليك على موضوع محدد.
          - **Keeps research manageable**: بيخلي البحث ممكن يخلص.
      - kind: aside
        tone: joke
        page: 13
        quote: "Creates path for research process\nGuides writing\nAvoids overwhelming \"all about\" research\nSupports specific topic/ research\nKeeps research manageable"
        text: |
          زميلك اختار عنوان رسالة بالشكل ده:

          - **All about hepatitis C in Egypt**

          ولسه بيجمع داتا من 2019. 😄 بحث ==all about== = بحث **overwhelming** مابيخلصش. السؤال الضيق هو اللي بيخلّص الرسالة.
      - kind: explain
        page: 15
        quote: "Should be Patient\nShould be Ambitious\nRemember it is research"
        title: "والباحث نفسه؟"
        text: |
          تلات حاجات:

          - **Patient**: البحث بياخد وقت، والـ ethics approval لوحدها ممكن تاخد شهور.
          - **Ambitious**: اطمح لسؤال يفرق.
          - **Remember it is ==re-search==**: الكلمة نفسها معناها «تدوّر تاني». هتعيد وتعدّل كتير، وده طبيعي.
      - kind: explain
        remind: [res.L01.012]
        page: 16
        quote: "The prime objectives of research are:\n  1. To discover new facts\n  2. To verify and test important facts\n  3. To analyze an event or process or phenomenon to identify the cause and effect relationship\n  4. To develop new scientific tools, concepts and theories to solve and understand scientific and nonscientific problems\n  5. To find solutions to scientific, nonscientific and social problems\n  6. To overcome or solve the problems occurring in our every day life"
        title: "البحث بيعمل إيه؟ الـ 6 prime objectives"
        text: |
          - **Discover new facts**: تكتشف حاجة جديدة.
          - **Verify and test important facts**: تتأكد من حاجة معروفة.
          - **Analyze an event or phenomenon** علشان تلاقي ==cause and effect relationship==.
          - **Develop new scientific tools, concepts and theories**.
          - **Find solutions** لمشاكل scientific وnonscientific وsocial.
          - **Overcome problems** في حياتنا اليومية.
      - kind: check
        page: 16
        quote: "The prime objectives of research are:\n  1. To discover new facts\n  2. To verify and test important facts\n  3. To analyze an event or process or phenomenon to identify the cause and effect relationship\n  4. To develop new scientific tools, concepts and theories to solve and understand scientific and nonscientific problems\n  5. To find solutions to scientific, nonscientific and social problems\n  6. To overcome or solve the problems occurring in our every day life"
        question: "A study asks whether shisha smoking causes bladder cancer. Which prime objective does it serve most directly?"
        options:
          - "Identify a cause and effect relationship"
          - "Discover new facts"
          - "Develop new scientific tools"
          - "Overcome problems of everyday life"
        answer: 0
        why:
          - "صح: exposure (الشيشة) ← outcome (السرطان) = cause and effect، objective رقم 3."
          - "ممكن تطلع حقيقة جديدة، بس السؤال نفسه عن سبب ونتيجة."
          - "مفيش أداة أو نظرية جديدة هنا."
          - "ده objective عام جدًا؛ الأدق هو cause and effect."
      - kind: try
        items: [res.L01.007, res.L01.009, res.L01.012]
    recap:
      - "Research = **systematic and organized methods** لإجابة سؤال أو حل مشكلة."
      - "Systematic = خطوات محددة؛ Organized = structure."
      - "السؤال الواضح بيرسم الطريق ويخلي البحث manageable."
      - "الباحث: patient، ambitious، وفاكر إنه **re-search**."
      - "الـ objective التالت: **cause and effect**."
    practice: [res.L01.007, res.L01.008, res.L01.009, res.L01.010, res.L01.011, res.L01.012, res.L01.013]  # ------------------------------------------------------------------
  - id: res.L01.lesson2
    title: "خريطة البحث من السؤال للتقرير"
    hook: "8 محطات، ولكل محطة سؤال لازم تجاوبه في الـ proposal. اعرف الترتيب وانت هتعرف تكتب أي proposal."
    minutes: 10
    pages: [17, 22]
    topics: [process, objectives]
    goals:
      - "ترتب الـ 8 steps of the research process"
      - "تربط كل سؤال في الـ proposal بالخطوة اللي بتجاوبه"
      - "تعدّ الـ 4 characteristics of research"
    status: unverified
    steps:
      - kind: explain
        page: 20
        quote: "Characteristics of research:\n  It demands a clear statement of the problem.\n  It requires clear objectives and a plan (it is not aimlessly looking for something in order to come across a solution).\n  It builds on existing data, using both positive and negative findings.\n  New data should be systematically collected and analyzed to answer the original research questions/objectives."
        title: "إيه اللي يخلي الشغل «بحث»؟"
        text: |
          الـ **characteristics of research** أربعة:

          - بيطلب ==clear statement of the problem==.
          - محتاج **clear objectives and a plan**: مش بتلف «aimlessly» على أمل إنك تلاقي حل.
          - بيبني على **existing data**، الـ positive والـ ==negative findings== مع بعض.
          - الداتا الجديدة بتتجمع وتتحلل **systematically** علشان تجاوب السؤال الأصلي.
      - kind: reveal
        page: 20
        quote: "Characteristics of research:\n  It demands a clear statement of the problem.\n  It requires clear objectives and a plan (it is not aimlessly looking for something in order to come across a solution).\n  It builds on existing data, using both positive and negative findings.\n  New data should be systematically collected and analyzed to answer the original research questions/objectives."
        prompt: "ليه البحث لازم ياخد الـ negative findings في اعتباره، مش بس الدراسات اللي لقت فرق؟"
        answer: |
          لأن الـ **negative finding** معلومة: «الدوا ده ما نفعش» بتوفر عليك سنة ونص تعيد نفس التجربة.

          ولو بنيت على الـ positive بس هتصدق إن حاجات بتشتغل وهي مش بتشتغل.
      - kind: figure
        page: 17
        quote: "Research Process:\n  1. Identifying The Problem\n  2. Reviewing Literature\n  3. Setting Research Questions, Objectives, And Hypotheses\n  4. Choosing The Study Design\n  5. Deciding On The Sample Design\n  6. Collecting Data\n  7. Processing And Analyzing Data\n  8. Writing The Report"
        title: "الدايرة: 8 خطوات"
        alt: "A circle of eight steps with arrows: 1 identifying the problem, 2 reviewing literature, 3 setting research questions, objectives and hypotheses, 4 choosing the study design, 5 deciding on the sample design, 6 collecting data, 7 processing and analyzing data, 8 writing the report, then back to 1."
