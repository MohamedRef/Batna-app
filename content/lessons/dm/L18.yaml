        answer: |
          الكتاب بيدّيك جزء من الإجابة: الجرعة اللي الناس واخداها غالبًا ==300 mg==، ودي بتفشل توصّل لأقل من 6 في ==50%== رغم إن المعتمد لحد 800.

          يعني المشكلة مش في الدوا، في إن الجرعة ما بتتظبطش على التحليل. التفسير المقبول (مش في الكتاب): الهدف رقم (أقل من 6)، فالجرعة بتطلع لحد ما توصل له، مش بتقف عند رقم ثابت.
