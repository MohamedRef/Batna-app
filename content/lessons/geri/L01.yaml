      - kind: aside
        tone: tip
        page: 21
        quote: "Bisoprolol 1.25 o.d. 10 o.d."
        text: "قاعدة سهلة: كل الأدوية دي بتبدأ بجزء صغير من الـ target: **bisoprolol** الثُمن (1.25 ← 10)، **ramipril** الربع (2.5 ← 10)، والـ **MRA** النص (25 ← 50). وده بالظبط معنى «start low, go slow» عند الكبار."
      - kind: explain
        page: 22
        title: "الـ diuretics"
        quote: "Do not use thiazides if estimated glomerular filtration rate <30 mL/min/1.73 m?, except when prescribed synergistically with loop diuretics."
        text: |
          - **Furosemide** يبدأ **20–40** والمعتاد **40–240** mg/day. الجرعات الكبيرة ← **renal impairment** و ==ototoxicity==.
          - **Thiazides** ممنوعة لو eGFR ==<30== إلا مع loop diuretic (synergy).
          - **Indapamide** = non-thiazide sulfonamide.
          - الـ **MRA** زي spironolactone و eplerenone هو المفضّل دايمًا، و **amiloride و triamterene** ممنوع يتجمعوا معاه.
      - kind: reveal
        page: 22
        quote: "spironolactone/eplerenone is always preferred. Amiloride and triamterene should not be combined with an MRA."
        prompt: "ليه جرعة الـ spironolactone أقل لو العيان على ACEI أو ARB؟"
        answer: |
          الاتنين بيرفعوا الـ **potassium**: الـ ACEI و ARB بيقللوا الـ aldosterone، والـ MRA بيمنع شغله. مع بعض الـ **hyperkalemia** قريبة، فالجدول بيبدأ الـ spironolactone **12.5–25** مع ACEI أو ARB بدل **50** من غيرهم. ونفس الفكرة: amiloride أو triamterene + MRA = تلات أدوية بترفع الـ K.
      - kind: explain
        page: 23
        title: "الـ SGLT2i والـ diastolic"
        quote: "Recommendation for SGLT2i 2022 AHA/ACC/HFSA Guideline for the Management of Heart Failure"
        text: |
          **2022 AHA/ACC/HFSA:** في الـ **symptomatic chronic HFrEF**، الـ ==SGLT2i== **class 1, level A** علشان يقللوا الـ HF hospitalization والـ CV mortality، **سواء في diabetes أو لأ**. وقيمتها الاقتصادية intermediate.

          **علاج الـ diastolic CHF** في الكتاب: diet، exercise، diuretics، و other pharmacologic considerations.
      - kind: update
        page: 23
        quote: "Treatment of CHF due to diastolic dysfunction Diet Exercise Diuretics Other Pharmacologic Considerations."
        text: "الـ SGLT2i بقوا موصى بيهم كمان في الـ HFmrEF و HFpEF، يعني الـ **diastolic** CHF بقى ليه أكتر من diet و diuretics: class 2a في AHA/ACC/HFSA 2022، و class I في الـ ESC 2023 focused update."
        ref: "AHA/ACC/HFSA heart failure guideline 2022; ESC heart failure focused update 2023"
      - kind: explain
        page: 23
        title: "نصايح الأدوية عند الكبار"
        quote: "Older people may show an exaggerated drop in blood pressure after the first dose of an ACE inhibitor."
        text: |
          - أول جرعة **ACEI** ممكن تعمل ==exaggerated BP drop==.
          - قيس **postural BP** كتير، و **BUN/creatinine** كل فترة علشان الـ volume depletion.
          - شوف الـ **electrolytes** والـ **magnesium** وعوّض.
          - **Digoxin** مفيد في الـ systolic CHF، بس الجرعة على أساس ==creatinine clearance== ولمدة قصيرة.
          - **Digoxin toxicity** عند الكبار ممكن تيجي atypical: **headache** و neurological manifestations.
      - kind: aside
        tone: trap
        page: 23
        quote: "Digoxin toxicity can present atypically in the elderly with headache and other neurological manifestations."
        text: "الفخ: انت مستني yellow vision و arrhythmia، والحاجة جاية بـ **صداع ولخبطة**. لو حد كبير على digoxin وفجأة اتلخبط، أول حاجة: **digoxin level** و الـ **creatinine clearance**."
      - kind: case
        page: 23
        quote: "give maintenance doses of digoxin on the basis of creatinine clearance and for a short time."
        stem: "An 87-year-old woman (45 kg) with systolic HF takes digoxin 0.25 mg daily and furosemide. Over a week she develops headache, confusion and poor appetite. CrCl 28 ml/min."
        steps:
          - question: "Most likely cause?"
            options:
              - "Digoxin toxicity"
              - "Stroke"
              - "Tension headache"
            answer: 0
            why: "Atypical digoxin toxicity: headache and neurological features in an old patient with low clearance."
          - question: "What should have guided her digoxin dose?"
            options:
              - "Creatinine clearance, for a short time"
              - "Serum creatinine only"
              - "Heart rate only"
            answer: 0
            why: "Give maintenance digoxin on the basis of creatinine clearance and for a short time; serum creatinine misleads in thin old people."
          - question: "What else should you check, given the furosemide?"
            options:
              - "Electrolytes and magnesium"
              - "Lipid profile"
              - "Thyroid antibodies"
            answer: 0
            why: "Check serum electrolytes and magnesium and replace them; hypokalemia and hypomagnesemia worsen digoxin toxicity."
