  - id: rheum.L18.lesson5
    title: "العلاج: EULAR 2019 من الجفاف للـ systemic"
    hook: "الجفاف بيتعالج من برّه وعلى قد الغدة، والمرض الـ systemic بأقل steroids ممكنة."
    minutes: 8
    pages: [307, 308]
    topics: [management]
    goals:
      - "تختار علاج الريق حسب وظيفة الغدة وتعرف ليه"
      - "تعالج جفاف العين خطوة خطوة"
      - "تمشي على علاج المرض الـ systemic وتعرف ليه الـ GC أقل جرعة"
    status: unverified
    steps:
      - kind: explain
        page: 307
        title: "العلاج: الجفاف الأول"
        quote: "Non-pharmacological stimulation for mild dysfunction. 2. Pharmacological stimulation* for moderate dysfunction. 3. Saliva substitution for severe dysfunction."
        text: |
          **المبادئ:** مراكز خبرة و multidisciplinary؛ الجفاف يتعالج **topical** الأول؛ والـ **systemic** للمرض الـ systemic النشط.

          **البُق:** اعمل **baseline salivary function** الأول، وبعدين:
          - **Mild** ← non-pharmacological stimulation
          - **Moderate** ← ==pharmacological stimulation==
          - **Severe** ← saliva substitution

          **العين:** artificial tears و gels؛ لو refractory ← **topical immunosuppressive drops** و **autologous serum** drops.

          ليه topical الأول؟ لأن الجفاف مش خطر على الحياة، فمش هتدّي دوا systemic بأعراضه علشان عرض ممكن يتظبط من برّه. والـ baseline function هو اللي بيحدد الدرجة.
