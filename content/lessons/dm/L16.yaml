        items: [dm.L16.011, dm.L16.012, dm.L16.013, dm.L16.014, dm.L16.015]
    recap:
      - "Case 2: طفل T1DM، تلات شربات للـ sinusitis = ~90 g sucrose/day ← DKA يوم 3."
