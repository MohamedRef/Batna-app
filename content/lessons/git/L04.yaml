  - id: git.L04.lesson6
    title: "سرطان القولون: الأرقام، والبوليب، والطرق للسرطان"
    hook: "تاني سبب وفاة بالسرطان، وفي نفس الوقت preventable. السر في بوليب بياخد سنين علشان يبقى سرطان."
    minutes: 8
    pages: [168, 171]
    topics: [crc-epi, crc-risk]
    goals:
      - "تعرف أرقام الـ CRC وليه الـ screening هو القصة كلها"
      - "تفرّق الـ neoplastic من الـ non-neoplastic polyps"
      - "تفهم الطرق الجينية للسرطان وعوامل الـ lifestyle"
    status: unverified
    steps:
      - kind: explain
        page: 168
        quote: "Colorectal cancer is the second leading cause of cancer-related deaths after lung cancer 5-year survival rate : 55%."
        title: "ليه القولون مهم؟"
        text: |
          الـ **colorectal cancer** تاني سبب وفاة بالسرطان بعد الـ lung، والـ 5-year survival حوالي 55%.

          بس هو **preventable** و**highly curable if detected early**، عشان كده الـ ==screening== مهم.

          - نادر قبل 40، وبيزيد بسرعة عند 50.
          - عند التشخيص: 37% localized، 37% regional، 20% metastatic.
          - 75% **sporadic**، والباقي في الـ high risk: Inflammatory bowel disease (IBD)، FAP، hereditary non-polyposis colorectal cancer (HNPCC)، family history.

          يعني الأرقام دي بتقولك إن الـ CRC مش «حظ وحش»: أغلبه بييجي من بوليب قعد سنين ممكن يتشال.
      - kind: explain
        page: 168
        quote: "CRC incidence and mortality rates are highest in nonHispanic blacks (NHBs)"
        title: "ليه الأرقام بتختلف بين الناس؟"
        text: |
          الكتاب: الـ incidence والـ mortality ==أعلى في الـ non-Hispanic blacks== وأقل في الـ Asians/Pacific Islanders. الـ incidence في الـ blacks أعلى بحوالي **20%** من الـ whites و **50%** من الـ Asians، والفرق في الوفيات **ضعف** الفرق في الـ incidence (40% أعلى من الـ whites، والضعف مقارنة بالـ Asians). والسبب غالبًا **socioeconomic status**.

          التفسير المقبول (مش في الكتاب): ليه الوفيات بتختلف أكتر من الإصابة؟ لأن الوفاة مش بتعتمد بس على مين بيجيله المرض، لكن كمان **اتلقط بدري ولا متأخر**. الناس اللي وصولها للـ screening والعلاج أصعب بيتشخصوا في stage متأخر. يعني الفرق ده في الأساس فرق في الـ screening، وده بيرجعنا لنفس الرسالة: المرض ده بيتمنع لو اتلقط بدري.
      - kind: explain
        page: 169
        quote: "Malignant diseases from adjacent sites: prostate, ovary, uterus, and"
        title: "مش كل ورم في القولون adenocarcinoma"
        text: |
          الكتاب، الـ **primary types**:
          - ==Adenomatous polyps و adenocarcinomas== من الـ epithelial cells.
          - **Anal carcinoma** (squamous أو transitional cell).
          - **Lymphoma**، **leiomyosarcoma**، **carcinoid**، **Kaposi's sarcoma**.
          - وأورام من جنبه ممكن تنتشر للقولون: **prostate، ovary، uterus، stomach**.

          التفسير المقبول (مش في الكتاب): القايمة ماشية على نفس منطق طبقات الحيطة اللي شفته في المريء: الـ epithelium يعمل adenocarcinoma، والعضلة تعمل leiomyosarcoma، والـ lymphoid tissue يعمل lymphoma، والخلايا الـ neuroendocrine تعمل carcinoid. والـ anal canal مختلف لأن بطانته **squamous** زي الجلد، فالسرطان بتاعه squamous. وكتلة في الـ sigmoid عند ست ممكن تكون مبيض وصل للقولون، فالـ biopsy هي اللي بتحسم.
      - kind: reveal
        page: 169
        quote: "Rapid increase at 50y."
        prompt: "ليه الـ screening للـ average risk بيبدأ عند 50؟"
        answer: |
          الكتاب: الـ CRC ==نادر قبل 40==، و**بيزيد بسرعة عند 50**. وعند التشخيص 37% localized و 37% regional و 20% metastatic.

          التفسير المقبول (مش في الكتاب): السن 50 هو النقطة اللي الخطر فيها بيبقى كفاية إن فايدة الـ screening تغلب تعبه وتمنه ومضاعفاته. وأرقام الـ presentation بتوضح ليه: أقل من 40% بس بيتلقطوا localized، والباقي بيكون الورم خرج من الحيطة. الـ screening هدفه يعكس النسبة دي: يلاقي البوليب **قبل** ما يبقى سرطان.
      - kind: explain
        page: 170
        quote: "Sequence-specific accumulation of genetic lesions that cause an imbalance between epithelial cell proliferation and cell death."
        title: "البوليب بيكبر إزاي؟"
        text: |
          الـ colonic polyps: **sessile** أو pedunculated. مهمين عشان بيعملوا rectal bleeding، ونادرًا obstruction، وممكن يبقوا malignant.

          - **Non-neoplastic**: hyperplastic، inflammatory، lymphoid، juvenile.
          - **Adenomatous**: شائعة خصوصًا في الكبار.

          الـ pathophysiology: **genetic lesions** بتتراكم بترتيب معين، فيحصل imbalance بين الـ ==proliferation== والـ **cell death**. الخلايا تتكوم على السطح وتفضل تنقسم، وتعمل adenoma.

          التفسير المقبول (مش في الكتاب): يعني البوليب مش بيظهر فجأة كسرطان، ده بيعدي بمراحل على سنين، وكل مرحلة بتحتاج mutation جديدة. وده بالظبط اللي بيدّي الـ screening فرصته: مسافة زمنية طويلة تلقط فيها البوليب قبل ما يكمل الطريق.
      - kind: figure
        page: 170
        title: "بوليب في القولون"
        image: { file: git/L04-colon-polyp.webp, book: true }
        alt: "Book colonoscopy picture of a large, rounded, reddish polyp projecting into the colon lumen."
        caption: |
          **بوليب** بارز جوه الـ lumen. البوليبات يا إما ==sessile== (قاعدة عريضة) يا إما **pedunculated** (على عنق).
      - kind: reveal
        page: 170
        quote: "Adenomatous polyps are relatively common,particularly in elderly"
        prompt: "ليه بنهتم بالـ adenomatous أكتر من الـ hyperplastic؟"
        answer: |
          الكتاب بيقسّم: **non-neoplastic** (hyperplastic، inflammatory، lymphoid، juvenile)، و ==adenomatous== اللي **relatively common** خصوصًا في الكبار.

          التفسير المقبول (مش في الكتاب): الكلمة المفتاح «neoplastic». الـ adenoma خلاياه **بدأت** الطريق الجيني للسرطان (فيها أول mutation)، أما الـ hyperplastic أو الـ inflammatory فهي تفاعل للخلية مع حاجة حواليها، من غير mutation. علشان كده الـ adenoma هو اللي بنشيله ونتابع صاحبه، والـ small hyperplastic في الـ rectum غالبًا مالوش نفس الأهمية.
      - kind: figure
        page: 171
        quote: "1. APC mutation -> (LOH) -> K-ras mutation -> Chrom 18 loss -> p53 loss: FAP ~70-80% CRC\n2. MMR -> (MSI) -> TGFβ, IIR, BAX: HNPCC 10-15% CRC\n3. p53 loss -> (Inflammation) -> Dysplasia (low---high) -> Carcinoma\nNormal epithelium -> Hyperproliferation ACF -> Adenoma -> Carcinoma in situ -> Invasion metastasis"
        title: "تلات طرق لنفس النهاية"
        alt: "Three horizontal pathways. 1 chromosomal: APC mutation, LOH, K-ras mutation, chromosome 18 loss, p53 loss; FAP, about 70 to 80 percent of CRC. 2 mismatch repair: MMR failure, microsatellite instability, TGF beta IIR and BAX mutations; HNPCC, 10 to 15 percent. 3 inflammation: p53 loss, inflammation, dysplasia low to high, carcinoma. Below: normal epithelium, hyperproliferation, adenoma, carcinoma in situ, invasion and metastasis."
        caption: "الطريق الأول هو الـ adenoma-carcinoma sequence الكلاسيكي (APC → K-ras → 18 → p53). التاني الـ MMR/MSI بتاع Lynch. التالت بتاع الـ colitis."
        svg: |
          <svg viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="G04p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
