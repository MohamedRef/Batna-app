  - id: res.L09.lesson2
    title: "يعني إيه ethics في البحث؟"
    hook: "قبل أي قاعدة: البحث نفسه يعني إيه، وليه بنحتاج حد يحمي اللي بيشاركوا فيه."
    minutes: 6
    pages: [18, 25]
    topics: [ethics-basics, history]
    goals:
      - "تعرّف ethics و bioethics و research"
      - "تعرف إمتى البحث يبقى human subject research"
      - "تفهم الهدفين اللي أخلاقيات البحث بتوازن بينهم"
    status: unverified
    steps:
      - kind: explain
        page: 18
        quote: "WHAT IS: ETHICS?\n  The word is derived form the Greek word \"ethos\" meaning; \"the set of moral principles\""
        title: "الكلمة جت منين؟"
        text: |
          **Ethics** جاية من الكلمة اليونانية ==«ethos»== ومعناها «the set of moral principles»، يعني مجموعة المبادئ الأخلاقية.

          ليه نبدأ من الأصل؟ لأنه بيفكّرك إن الـ ethics مش قوانين مكتوبة بس، دي مبادئ بنحكم بيها على التصرف قبل ما تبقى قاعدة. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 19
        quote: "What do we mean by ethics?\n  Morality or ethics represents a code of conduct that governs how people treat each other.\n  In essence, it is concerned with the way people act or behave.\n  The term 'ethics' usually refers to the moral principles, guiding conduct, which are held by a group or even a profession\" (Wellington, 2000: 54)"
        title: "يعني إيه ethics؟"
        text: |
          الكلمة من اليوناني **ethos**: «مجموعة المبادئ الأخلاقية» (slide 18).

          الـ ==ethics== = **code of conduct** بيحكم الناس بتتعامل مع بعض إزاي، ويخص طريقة تصرفهم. وعادة يقصد بيه المبادئ اللي **جماعة أو مهنة** ماشية بيها.

          والـ **bioethics** = نفس الكلام بس على الجانب الأخلاقي في الـ biomedical research والممارسة (slide 20).
      - kind: explain
        page: 20
        quote: "WHAT IS: ETHICS?\n  Ethics are ways of understanding and examining the moral life, or of right and wrong human conduct.\n  Bioethics is a way of understanding and examining the moral aspects of biomedical research and practice"
        title: "Ethics و bioethics"
        text: |
          - **Ethics**: طرق لفهم وفحص ==الـ moral life==، يعني الصح والغلط في تصرفات البني آدمين.
          - **Bioethics**: نفس الفكرة بس على ==الجانب الأخلاقي للبحث والممارسة الطبية الحيوية== (biomedical research and practice).

          ليه نفرّق؟ لأن الـ bioethics هي اللي بتخصّنا: الأسئلة الأخلاقية اللي بتطلع من البحث على العيانين وعلاجهم. التفسير المقبول (مش في الكتاب).
      - kind: explain
        remind: [res.L09.019]
        page: 21
        quote: "WHY WORRY ABOUT RESEARCH ETHICS?\n  The science itself\n  Other scientists\n  The research participant\n  The public\n  The future\n  Ourselves"
        title: "ليه نقلق من أخلاقيات البحث؟"
        text: |
          لأن البحث الوحش بيأذي ٦ أطراف:

          - **The science itself**
          - **Other scientists**
          - **The research participant**
          - **The public**
          - **The future**
          - **Ourselves**
      - kind: explain
        page: 23
        quote: "WHAT IS RESEARCH?\nResearch is defined as; \"a systematic investigation, including research development, testing and evaluation, designed to develop or contribute to GENERALIZABLE knowledge.\" 45 CFR 46.102(d)"
        title: "يعني إيه research رسميًا؟"
        text: |
          التعريف (45 CFR 46.102(d)): ==«a systematic investigation==، including research development, testing and evaluation, designed to develop or contribute to ==generalizable knowledge==».

          الكلمة المهمة هي **generalizable**: لو هدفك معرفة تتعمّم على ناس تانيين، يبقى ده research ومحتاج مراجعة أخلاقية.

          ليه؟ لأن ده الفرق بين إنك تعالج عيانك (هدفه هو) وإنك تجرّب عليه علشان تتعلم حاجة لغيره. التفسير المقبول (مش في الكتاب).
      - kind: check
        page: 23
        quote: "WHAT IS RESEARCH?\nResearch is defined as; \"a systematic investigation, including research development, testing and evaluation, designed to develop or contribute to GENERALIZABLE knowledge.\" 45 CFR 46.102(d)"
        question: "Per 45 CFR 46.102(d), what makes a systematic investigation count as research?"
        options:
          - "It is designed to develop or contribute to generalizable knowledge"
          - "It involves a drug or a device"
          - "It is done in a hospital"
          - "It is funded by a government agency"
        answer: 0
        why:
          - "صح: الكلمة المفتاح في التعريف generalizable knowledge."
          - "مش شرط؛ استبيان ممكن يبقى research."
          - "المكان مش جزء من التعريف."
          - "التمويل مش جزء من التعريف."
      - kind: explain
        page: 24
        quote: "Human Subject Research\nA research Involving living individuals about whom the researcher obtains:\n  Data through intervention or interaction\n  OR\n  Identifiable Private/Human material AND information"
        title: "إمتى البحث يبقى human subject research؟"
        text: |
          الـ ==research== = **systematic investigation** (فيه development و testing و evaluation) هدفه **generalizable knowledge** (slide 23).

          ويبقى ==human subject research== لما يكون على **ناس عايشين**، والباحث بياخد منهم:

          - **data through intervention or interaction**، **أو**
          - **identifiable private information** أو human material.

          والهدف دايمًا **balancing two goals**: تقدم العلم، وحماية حقوق وسلامة المشارك (slide 25).
      - kind: figure
        page: 24
        quote: "Human Subject Research A research Involving living individuals about whom the researcher obtains"
        title: "إمتى البحث يبقى human subject research؟"
        alt: "A decision flow. A systematic investigation for generalizable knowledge is research. Research on living individuals who give data through intervention or interaction, and or identifiable private information or material, is human subject research and needs ethics review."
        caption: |
          اقرا السهم من فوق لتحت، وده نفس تعريف slides 23 و24:

          1. **Systematic investigation** هدفها ==generalizable knowledge==؟ يبقى research. (علاج عيانك لوحده مش research.)
          2. على **ناس عايشين**؟
          3. وبتاخد منهم **واحدة من الاتنين أو الاتنين** (الـ ==AND/OR== اللي في النص): data بـ intervention أو interaction، **أو** identifiable private information.

          لو وصلت للصندوق الأخير يبقى human subject research ومحتاج مراجعة أخلاقية. علشان كده مراجعة ملفات فيها أسماء بتدخل، مع إنك ما لمستش حد.
