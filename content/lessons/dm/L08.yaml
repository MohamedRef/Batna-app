  - id: dm.L08.lesson2
    title: "الدهون والسكر والطبق المقسوم"
    hook: "مش كل الدهون شريرة: فيه واحدة بتعلّي الوحش وتنزّل الكويس."
    minutes: 7
    pages: [95, 96]
    topics: [fats, plate]
    goals:
      - "تفرّق الـ healthy fats عن الـ trans fats"
      - "تحفظ حدود الـ AHA والسكر المضاف"
      - "ترسم الطبق المقسوم"
    status: unverified
    steps:
      - kind: explain
        page: 95
        title: "الدهون"
        quote: "Healthy sources of fat can be found in fish, nuts, and certain fruits and vegetables, such as avocados."
        text: |
          الهرم بيقول الـ **fats** تتاكل ==sparingly== لأنها عالية السعرات.

          الدهون الكويسة: **fish**، **nuts**، و **avocado**.

          ليه sparingly حتى لو صحية؟ الجرام الدهن فيه سعرات أكتر من ضعف الجرام النشويات (التفسير المقبول، مش في الكتاب)، والكتاب بيقول **fatty foods are also high in calories**، والأكل الكتير منها بيعمل مشاكل. يعني حتى الزيت الكويس بيتحسب.
      - kind: explain
        page: 95
        title: "الـ trans fat: الشرير الحقيقي"
        quote: "But unlike saturated fats, trans fats lower HDL cholesterol and may do more damage,"
        text: |
          الـ **trans fatty acids** بتتعمل صناعيًا بإضافة **hydrogen** للزيت السايل علشان يجمد. اسمها على العلبة: ==partially hydrogenated oils==.

          - فيه كميات صغيرة طبيعية في beef و lamb و full-fat dairy.
          - بتعلّي الـ **low-density lipoprotein (LDL)** زي الـ saturated fat.
          - بس كمان بتنزّل الـ ==high-density lipoprotein (HDL)==، فضررها أكبر.

          ليه الصناعة بتعملها أصلًا؟ التفسير المقبول (مش في الكتاب): الزيت المهدرج بيعيش على الرف أكتر ومش بيزنّخ، وبيدّي قرمشة للبسكوت والمقليات. يعني المكسب للمصنع، والخسارة لشرايينك. عشان كده الكتاب بيقولك **اقرا الـ ingredient list**.
