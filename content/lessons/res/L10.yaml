          </svg>
      - kind: sort
        page: 52
        quote: "Guidelines for using a 5-point scale\n| Satisfaction | How satisfied are you with...? | Very Satisfied | Satisfied | Neither Satisfied nor Dissatisfied | Dissatisfied | Very Dissatisfied |\n| Extent | To what extent do you...? | To a large extent | To a moderate extent | To some extent | To little extent | Not at all |\n| Relative Quantity | Should... do less or more of...? | Much more | Somewhat more | Fine as is | Somewhat less | Much less |\n| Quality Rating | Please rate the quality of... | Excellent | Above Average | Average | Below Average | Poor |"
        prompt: "حط كل إجابة في مكانها على الـ 5-point scale:"
        bins: ["5 (top)", "3 (middle)", "1 (bottom)"]
