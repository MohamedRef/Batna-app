  # ---------- p159: acquired, inflammaging ----------
  - id: geri.L09.019
    kind: table
    topic: acquired
    title: Acquired immunity with age
    columns: [Cell, Change]
    rows:
      - [T cells, "↓ thymopoiesis; accumulated highly differentiated memory cells; loss of CD28 and CD69; ↓ CD8+ proliferation to antigen"]
      - [B cells, "↓ lymphopoiesis; ↑ memory B cells; impaired antibody response to vaccination"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 159, quote: "B cells: reduction in B cell lymphoiesis, increase in memory B cells, impaired antibody response to vaccination." }
    status: unverified
    tags: [high-yield, book-question]
  - id: geri.L09.020
    kind: card
    topic: acquired
    front: Which T-cell surface antigens are lost with age, and why does it matter?
    back: CD28 and CD69, which are needed for T-cell activation and signal transduction.
    src: { page: 159, quote: "T cells: reduction in T cell thymopoiesis, accumulated highly differentiated memory cells. Loss of CD28 antigen CD69 antigen required for T cell activation& signal transduction, reduced CD8+ cell proliferation in response to antigen stimulation." }
    status: unverified
  - id: geri.L09.021
    kind: card
    topic: acquired
    front: Which B-cell change explains poor vaccine responses in old age?
    back: Reduced B-cell lymphopoiesis with more memory B cells, giving an impaired antibody response to vaccination.
    src: { page: 159, quote: "B cells: reduction in B cell lymphoiesis, increase in memory B cells, impaired antibody response to vaccination." }
    status: unverified
  - id: geri.L09.022
    kind: card
    topic: acquired
    front: What is inflamaging?
    back: The dysregulated cytokine response of ageing, especially an increase in the pro-inflammatory cytokine IL-6.
    src: { page: 159, quote: "The majority of studies suggest that aging is associated with a dysregulated cytokine response, in particular an increase in pro-inflammatory cytokine IL-6, this phenomenon has been referred to as inflamaging. Chronic elevation of IL-6 has been correlated with chronic disease and functional decline in old." }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.023
    kind: card
    topic: acquired
    front: What has chronic IL-6 elevation been linked to in old age?
    back: Chronic disease and functional decline.
    src: { page: 159, quote: "The majority of studies suggest that aging is associated with a dysregulated cytokine response, in particular an increase in pro-inflammatory cytokine IL-6, this phenomenon has been referred to as inflamaging. Chronic elevation of IL-6 has been correlated with chronic disease and functional decline in old." }
    status: unverified
  - id: geri.L09.024
    kind: mcq
    topic: acquired
    stem: An 84-year-old has a poor antibody response to a vaccine. Which change in acquired immunity best explains it?
    options:
      - "Reduced B-cell lymphopoiesis and antibody response"
      - "An increased naive T-cell pool"
      - "Increased CD28 expression on T cells"
      - "Increased thymopoiesis in the thymus"
      - "Fewer memory B cells in the circulation"
    answer: 0
    why:
      - "Correct: B-cell lymphopoiesis falls and the antibody response to vaccination is impaired (p159)."
      - The naive T-cell pool falls with age.
      - CD28 is lost with age.
      - Thymopoiesis is reduced.
      - Memory B cells increase.
    src: { page: 159, quote: "B cells: reduction in B cell lymphoiesis, increase in memory B cells, impaired antibody response to vaccination." }
    status: unverified
  # ---------- p160: risks ----------
  - id: geri.L09.025
    kind: enumerate
    topic: risks
    prompt: Discuss the risk factors of infection in old age.
    points:
      - Living in long-term care facilities
      - Chronic diseases
      - Malnutrition
      - Immunosenescence
      - Polypharmacy and immunosuppressive drugs
      - Prosthetic devices
      - Frequent hospitalization (nosocomial infection) and medical therapy
      - Delayed recognition from atypical presentation
      - Weaker cough reflex and mucociliary clearance
      - Decreased gastric acidity
    pass: 7
    hook: "عدوى الكبير «10»: مكانه (long-term care)، أمراضه المزمنة، أكله (malnutrition)، مناعته (immunosenescence)، أدويته (polypharmacy وimmunosuppressives)، أجهزته (prosthetic devices)، مستشفياته (nosocomial)، التشخيص المتأخر من الـatypical presentation، كحته والـmucociliary clearance الضعاف، وحموضة معدته القليلة."
    src: { page: 160, quote: "Living in a long term care facilities, chronic diseases, malnutrition, immune senescence, polypharmacy, increase use of prosthetic devices." }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.026
    kind: card
    topic: risks
    front: Why do infections in the elderly cause serious complications?
    back: Atypical presentations delay recognition of symptoms.
    src: { page: 160, quote: "Delayed recognition of symptoms, related to atypical presentations of infection in elderly make them liable to serious complications." }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.027
    kind: table
    topic: risks
    title: Lost protection and the infection it invites
    columns: [Lost protection, Infection risk]
    rows:
      - [Weaker cough reflex and mucociliary clearance, Respiratory infection]
      - [Lower gastric acidity (ageing and drugs), Gastrointestinal infection]
      - [Frequent hospitalization, Nosocomial infection]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 160, quote: "Diminished anatomic & physiologic protection as cough reflex and mucociliary clearance, increase the susceptibility to respiratory infection. Decreased gastric acidity in old due to both physiological and medication side effects can increase susceptibility to gastrointestinal infections." }
    status: unverified
  - id: geri.L09.028
    kind: mcq
    topic: risks
    stem: A 79-year-old woman on a long-term proton pump inhibitor develops infectious diarrhoea. Which age-related risk does the lecture link to this?
    options:
      - Decreased gastric acidity
      - Weaker cough reflex
      - Increased NK cell number
      - Increased memory B cells
      - Prosthetic joint
    answer: 0
    why:
      - "Correct: lower gastric acidity, physiological and from medication, raises GI infection risk (p160)."
      - The cough reflex protects the airways, not the gut.
      - More NK cells is an immune change, not a gut barrier.
      - More memory B cells does not explain gut infection.
      - Prosthetic devices raise device infection risk.
    src: { page: 160, quote: "Diminished anatomic & physiologic protection as cough reflex and mucociliary clearance, increase the susceptibility to respiratory infection. Decreased gastric acidity in old due to both physiological and medication side effects can increase susceptibility to gastrointestinal infections." }
    status: unverified
  # ---------- p161-162: vaccination ----------
