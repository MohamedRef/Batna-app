          - "ده الطبيعي برضه."
          - "ده type I achalasia (Nothing)."
      - kind: explain
        page: 281
        title: "الـ barium والـ HRM: نفس المرض من زاويتين"
        quote: "Barium swallow : irregular, non-propulsive, incoordinate contraction of the esophagus."
        text: |
          في الـ barium الكتاب بيوصف ==irregular, non-propulsive, incoordinate contraction==: المريء بينقبض في كذا حتة مرة واحدة، فيبان **corkscrew** (tertiary contractions)، والباريوم بيتهز مكانه بدل ما ينزل.

          وعلى الـ pressure topography في نفس الصفحة: الـ **spastic nutcracker** (شمال) والـ **DES** (يمين).

          ليه non-propulsive؟ لأن الزق محتاج انقباضة **ورا** اللقمة والجزء اللي **قدامها** مرتخي. لو المريء كله انقبض في نفس الوقت، اللقمة مش لاقية مكان تروحه، فتتعصر في مكانها، وده الـ chest pain.
      - kind: figure
        page: 281
        quote: "Barium swallow : irregular, non-propulsive, incoordinate contraction of the esophagus."
        title: "الـ corkscrew في الـ barium"
        image: { file: git/L10-des-barium.webp, book: true }
        alt: "Two book barium swallow films in diffuse esophageal spasm: the barium column is broken into irregular segments by non-propulsive contractions, giving a corkscrew outline."
        caption: |
          الـ barium متقطّع لحتت بانقباضات **مش ماشية لقدام**: شكل ==corkscrew==.
      - kind: reveal
        page: 281
        quote: "Diffuse esophageal spasm is similar but primarily defined by a rapid propagation at the onset of the contraction."
        prompt: "الـ spastic nutcracker والـ DES الاتنين انقباضات عنيفة متكررة. إيه اللي بيفرّق بينهم على الـ pressure topography؟"
        answer: |
          - **Spastic nutcracker**: انقباضات vigorous و repetitive بس **normal peristaltic onset**.
          - **DES**: نفس الشكل تقريبًا، بس اللي بيعرّفه ==rapid propagation at the onset==.

          يعني الـ nutcracker لسه ماشي بالدور، والـ DES بيضرب المريء كله تقريبًا في نفس اللحظة.
      - kind: explain
        remind: [git.L10.068]
        page: 282
        quote: "Anticholinergic, nitrates, calcium channel blockers, hydralazine, botulinum toxin, anxiolytics and Pneumatic dilatation may be helpful."
        title: "علاج الـ DES"
        text: |
          - **Medical**: anticholinergics، nitrates، calcium channel blockers، hydralazine، anxiolytics.
          - **Endoscopic**: botulinum toxin، pneumatic dilatation.
          - **Surgery** (long myotomy أو حتى esophagectomy): ==only== لو فيه **severe weight loss** أو **severe pain**.

          ليه الأدوية دي؟ التفسير المقبول (مش في الكتاب): كلها بترخّي الـ smooth muscle بطرق مختلفة (anticholinergics بتقفل الإشارة المنشّطة، nitrates و hydralazine بتوسّع، CCB بتقفل الكالسيوم)، والـ anxiolytics عشان الـ stress بيقلّب النوبات. والجراحة آخر حاجة لأن الـ spasm في مساحة طويلة، والـ myotomy الطويلة ليها مضاعفاتها.
      - kind: check
        page: 282
        quote: "Surgical therapy (long myotomy or even esophagectomy) should be considered only with severe weight loss or severe pain."
        question: "When does the lecture say surgery should be considered in DES?"
        options:
          - "Only with severe weight loss or severe pain"
          - "As first-line therapy in all patients"
          - "Whenever barium shows a corkscrew"
          - "After one failed nitrate trial"
        answer: 0
        why:
          - "صح: long myotomy أو esophagectomy بس مع severe weight loss أو pain."
          - "الأول medical و endoscopic."
          - "الـ corkscrew تشخيص مش indication للجراحة."
          - "فيه خيارات كتير قبل الجراحة."
      - kind: explain
        page: 282
        quote: "Eosinophilic esophagitis is a disorder in which food or environmental antigens are thought to stimulate an inflammatory response. A history of allergies or atopic conditions (asthma, eczema, hay fever) is present in over half of patients."
        title: "Eosinophilic esophagitis"
        text: |
          الـ ==EoE== = food أو environmental **antigens** بتعمل inflammatory response في المريء. أكتر من **نص** المرضى عندهم allergy أو atopy (asthma، eczema، hay fever).

          - **Adults**: dysphagia للأكل الناشف من زمان، أو **food impaction**. ممكن heartburn أو chest pain.
          - **Children**: abdominal pain، vomiting، failure to thrive.
          - **Labs**: قليلين بس عندهم eosinophilia أو immunoglobulin E (IgE) عالي.
          - **Barium**: small-caliber esophagus، strictures، أو **multiple concentric rings**.

          ليه الـ atopy؟ التفسير المقبول (مش في الكتاب): نفس نوع المناعة اللي ورا الـ asthma والـ eczema (Th2، IL-4 و IL-5 و IL-13) بتجيب eosinophils للمريء. ومع الوقت الالتهاب بيعمل **تليف**، فالمريء يضيق ويتصلب، فاللقمة الناشفة تقف، وده الـ food impaction.
      - kind: figure
        page: 283
        title: "الـ EoE في المنظار"
        image: { file: git/L10-eoe-endoscopy.webp, book: true }
        alt: "Book montage of endoscopic pictures of eosinophilic esophagitis in four groups a to d, showing concentric rings, linear furrows, white exudates and narrowed lumens."
        caption: |
          دوّر على: **حلقات** متتالية (==trachealization==، باينة في **b**)، **furrows** طولية، **نقط بيضا** (exudates)، وتضييق.

          وافتكر: المريء ممكن يبقى **طبيعي** في 5%، فالـ biopsy هي اللي بتقول.
      - kind: mnemonic
        page: 283
        quote: "Endoscopic appearances include edema, concentric rings (\"trachealization\"), exudates (white plaques), furrows (vertical lines), and strictures; however, the esophagus is grossly normal in up to 5% of patients."
        word: "FERES"
        parts:
          - { key: "F", text: "Furrows (vertical lines)" }
          - { key: "E", text: "Exudates (white plaques)" }
          - { key: "R", text: "Rings (trachealization)" }
          - { key: "E", text: "Edema" }
          - { key: "S", text: "Strictures" }
        hook: |
          **FERES** زي "فِرِس"، الحصان 🐎 اللي اللقمة دايمًا بتقف في زوره. ومع ذلك، المريء ممكن يبان **normal** في لحد 5%.
      - kind: explain
        page: 283
        quote: "Multiple biopsies (4–8) from the proximal and distal esophagus should be obtained to demonstrate multiple (greater than 15/high-powered field) eosinophils in the mucosa."
        title: "التشخيص بالـ biopsy"
        text: |
          خد ==4-8 biopsies== من الـ **proximal والـ distal** esophagus، والمطلوب ==more than 15 eosinophils/HPF==.

          ليه من الحتتين؟ لأن الـ gastroesophageal reflux disease (GERD) بيعمل eosinophils في الـ distal بس، والـ EoE بيمسك المريء كله.
      - kind: aside
        remind: [git.L10.077]
        tone: exam
        page: 282
        quote: "Treatment options include proton pump inhibitors, topical corticosteroids, food elimination diets, and esophageal dilation."
        text: |
          سؤال الكتاب: **Outline management of eosinophilic esophagitis**. اكتبه كده:
          - **proton pump inhibitor (PPIs)**
          - **Topical corticosteroids**
          - **Food elimination diets**
          - **Esophageal dilation**
          - الجديد: **biologic** anti-IL، اسمه **dupilumab**
      - kind: explain
        page: 282
        title: "علاج الـ EoE: كل خيار بيقفل حتة"
        quote: "Treatment options include proton pump inhibitors, topical corticosteroids, food elimination diets, and esophageal dilation."
        text: |
          الكتاب: **proton pump inhibitors**، ==topical corticosteroids==، **food elimination diets**، و **esophageal dilation**، والجديد **dupilumab**.

          ليه كل واحد؟ التفسير المقبول (مش في الكتاب):
          - **Elimination diet**: لو المرض جاي من antigen في الأكل، شيل الـ antigen.
          - **Topical steroids** (بتتبلع مش بتتشمّ): بتلمس الـ mucosa مباشرة وتطفّي الالتهاب بأقل امتصاص للجسم.
          - **PPIs**: بتقلل الالتهاب عند عدد كبير من العيانين حتى من غير reflux.
          - **Dilation**: للضيق والتليف اللي حصل خلاص؛ مش بتعالج الالتهاب.
          - **Dupilumab**: بيقفل الـ IL اللي بيجيب الـ eosinophils من أصله.
      - kind: update
        page: 282
        quote: "Newer treatment options include biological treatment (Anti-IL named dupilumab)"
        text: |
          الـ **dupilumab** بيقفل الـ IL-4 receptor alpha (يعني IL-4 و IL-13)، واتوافق عليه للـ EoE في الكبار 2022 والأطفال من سنة 2024. في الامتحان اكتب كلام الكتاب: anti-IL dupilumab.
        ref: "FDA dupilumab EoE approval 2022, paediatric extension 2024"
      - kind: case
        page: 283
        quote: "Multiple biopsies (4–8) from the proximal and distal esophagus should be obtained to demonstrate multiple (greater than 15/high-powered field) eosinophils in the mucosa."
        stem: "A 23-year-old with asthma presents with a piece of meat stuck for 3 hours. After removal, he admits years of slow eating."
