items:
  # ---------- p142: CKD burden ----------
  - id: dm.L12.001
    kind: card
    topic: ckd-burden
    front: How is CKD defined, whatever its cause?
    back: Kidney damage or decreased kidney function for 3 months or more.
    src: { page: 142, quote: "CKD, regardless of its underlying etiology, is defined as either kidney damage or decreased kidney function for ≥ 3 months." }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.002
    kind: cloze
    topic: ckd-burden
    text: "Diabetes is the {{c1::most common cause}} of renal failure."
    src: { page: 142, quote: "Diabetes is The Most Common Cause of Renal Failure." }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.003
    kind: cloze
    topic: ckd-burden
    text: "ESRD incidence among diabetics in the United States {{c1::tripled}} between 1989 and 1998, while ESRD from hypertension stayed {{c2::relatively stable}}."
    src: { page: 142, quote: "Incidence of ESRD among diabetics in the United States tripled between 1989 and 1998, whereas ESRD incidence rates among patients with hypertension remained relatively stable. Within the Native American ESRD population, diabetes is the most common cause of renal failure. But hypertension is the most common cause of renal failure in the African American ESRD population." }
    status: unverified
    tags: [numbers]
  - id: dm.L12.004
    kind: card
    topic: ckd-burden
    front: Which cause of renal failure leads in Native American versus African American ESRD populations (book p142)?
    back: Diabetes leads in Native Americans; hypertension leads in African Americans.
    src: { page: 142, quote: "Incidence of ESRD among diabetics in the United States tripled between 1989 and 1998, whereas ESRD incidence rates among patients with hypertension remained relatively stable. Within the Native American ESRD population, diabetes is the most common cause of renal failure. But hypertension is the most common cause of renal failure in the African American ESRD population." }
    status: unverified
  - id: dm.L12.005
    kind: card
    topic: ckd-burden
    front: How do ESRD rates from diabetes and hypertension compare with glomerulonephritis?
    back: End-stage renal disease (ESRD) incidence from hypertension and diabetes stays substantially higher than from glomerulonephritis and other diseases.
    src: { page: 142, quote: "The incidence rates for ESRD in patients with hypertension and diabetes remain substantially higher than these rates for glomerulonephritis and other diseases." }
    status: unverified
  - id: dm.L12.006
    kind: enumerate
    topic: ckd-burden
    prompt: Challenges in managing diabetes in patients with renal impairment (book p142–143)?
    points:
      - Lack of adequate glycemic control
      - "Management of co-morbid conditions"
      - Caution in choosing oral antidiabetics
      - Problem in insulin metabolism
      - Reduced gluconeogenesis
      - Hypoglycemia
      - Dietary restrictions and teamwork among physicians
    pass: 5
    hook: "7 تحديات: «السكر» (control ناقص، hypoglycemia)، «الأمراض التانية» (co-morbid)، «الأدوية» (حذر في الـ oral، insulin metabolism متلخبط، gluconeogenesis أقل)، و«الأكل والفريق» (dietary restrictions وteamwork). 2 + 1 + 3 + 1 = 7."
    src: { page: 143, quote: "1. Consideration & caution in choosing Oral anti diabetics due to:\n  2. Problem in Insulin Metabolism\n  3. Reduce Gluconeogenesis\n  4. Incidence of Hypoglycemia\n  Dietary Restrictions & teamwork among physicians is required in patients with Diabetes & CKD" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.007
    kind: enumerate
    topic: ckd-burden
    prompt: Why must oral antidiabetics be chosen with caution in renal impairment (the three reasons listed)?
    points:
      - Problem in insulin metabolism
      - Reduced gluconeogenesis
      - Higher incidence of hypoglycemia
    pass: 3
    hook: "الحبوب بحذر لأن «الإنسولين بيقعد، الكلية مش بتصنع سكر، فبيوقع»: insulin metabolism متلخبط، gluconeogenesis أقل، وhypoglycemia أكتر."
    src: { page: 143, quote: "2. Problem in Insulin Metabolism\n3. Reduce Gluconeogenesis\n4. Incidence of Hypoglycemia" }
    status: unverified
  # ---------- p143: diagnosis ----------
  - id: dm.L12.008
    kind: enumerate
    topic: dkd-diagnosis
    prompt: The typical presentation of diabetic kidney disease?
    points:
      - Long-standing duration of diabetes
      - Retinopathy
      - Albuminuria without gross hematuria
      - Gradually progressive loss of eGFR
    pass: 4
    hook: "الـ DKD النموذجي = «قديم، عينه تعبانة، ألبيومين من غير دم، وبينزل بالراحة»: long-standing duration، retinopathy، albuminuria من غير gross hematuria، وgradually progressive loss of eGFR."
    src: { page: 143, quote: "The typical presentation of diabetic kidney disease is considered to include a long-standing duration of diabetes, retinopathy, albuminuria without gross hematuria, and gradually progressive loss of eGFR." }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.009
    kind: card
    topic: dkd-diagnosis
    front: How can DKD break the typical pattern in type 2 and type 1 diabetes?
    back: In type 2, chronic kidney disease (CKD) signs can be present at diagnosis or without retinopathy; reduced eGFR without albuminuria is frequently reported in both type 1 and type 2.
    src: { page: 143, quote: "However, signs of CKD may be present at diagnosis or without retinopathy in type 2 diabetes, and reduced eGFR without albuminuria has been frequently reported in type 1 and type 2 diabetes." }
    status: unverified
  - id: dm.L12.010
    kind: card
    topic: dkd-diagnosis
    front: What is non-albuminuric DKD (NADKD)?
    back: Diabetic kidney disease with reduced eGFR but no albuminuria; the main cause of the renal impairment is intrarenal arteriosclerosis.
    src: { page: 143, quote: "Non-albuminuric DKD\n  1. Prevalence of NADKD varies from 14.29 to 56.6% among diabetic patients with different ethnicities\n  2. Macroangiopathy is found to be more prevalent in patients with NADKD (increasing age, hypertension, atherosclerosis, dyslipidemia)\n  3. Intra renal arteriosclerosis is the main cause of renal impairment" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.011
    kind: cloze
    topic: dkd-diagnosis
    text: "The prevalence of NADKD varies from {{c1::14.29}} to {{c2::56.6%}} among diabetic patients of different ethnicities."
    src: { page: 143, quote: "Non-albuminuric DKD\n  1. Prevalence of NADKD varies from 14.29 to 56.6% among diabetic patients with different ethnicities\n  2. Macroangiopathy is found to be more prevalent in patients with NADKD (increasing age, hypertension, atherosclerosis, dyslipidemia)" }
    status: unverified
    tags: [numbers]
  - id: dm.L12.012
    kind: enumerate
    topic: dkd-diagnosis
    prompt: Which macroangiopathy features are more prevalent in NADKD?
    points:
      - Increasing age
      - Hypertension
      - Atherosclerosis
      - Dyslipidemia
    pass: 3
    hook: "الـ NADKD «عجوز، ضغط، شرايين، ودهون» = increasing age، hypertension، atherosclerosis، وdyslipidemia."
    src: { page: 143, quote: "Non-albuminuric DKD\n  1. Prevalence of NADKD varies from 14.29 to 56.6% among diabetic patients with different ethnicities\n  2. Macroangiopathy is found to be more prevalent in patients with NADKD (increasing age, hypertension, atherosclerosis, dyslipidemia)" }
    status: unverified
  - id: dm.L12.013
    kind: mcq
    topic: dkd-diagnosis
    stem: "A 68-year-old man with type 2 DM for 6 years, hypertension, dyslipidemia and carotid plaques has eGFR 48 ml/min/1.73 m² on repeated tests. Urine ACR is 12 mg/g, fundi show no retinopathy, urine sediment is bland. What is the most likely lesion behind his kidney disease?"
    options:
      - Intrarenal arteriosclerosis (non-albuminuric DKD)
      - Classic albuminuric diabetic glomerulosclerosis (Kimmelstiel-Wilson)
      - IgA nephropathy
      - Minimal change disease
      - Acute interstitial nephritis
    answer: 0
    why:
      - "Correct: reduced eGFR without albuminuria, with macroangiopathy (age, HTN, atherosclerosis, dyslipidemia), fits NADKD; intrarenal arteriosclerosis is its main cause (p143)."
      - "Classic DKD shows albuminuria and usually retinopathy (p143)."
      - "IgA nephropathy brings hematuria and active sediment, which he lacks."
      - "Minimal change presents with nephrotic-range proteinuria, not ACR 12 mg/g."
      - "Nothing points to a drug reaction or active sediment."
    src: { page: 143, quote: "Non-albuminuric DKD\n  1. Prevalence of NADKD varies from 14.29 to 56.6% among diabetic patients with different ethnicities\n  2. Macroangiopathy is found to be more prevalent in patients with NADKD (increasing age, hypertension, atherosclerosis, dyslipidemia)" }
    status: unverified
  # ---------- p143-144: screening and staging ----------
  - id: dm.L12.014
    kind: enumerate
    topic: screening
    prompt: "DKD screening: what to test, how often, and in whom?"
    points:
      - "At least once a year"
      - "Urinary albumin (spot urine albumin-to-creatinine ratio)"
      - eGFR
      - "Type 1 diabetes of ≥5 years' duration"
      - All patients with type 2 diabetes
    pass: 5
    hook: "الـ screening «إمتى، إيه، ومين»: مرة في السنة على الأقل؛ ACR في البول وeGFR؛ type 1 من 5 سنين أو أكتر، وكل type 2. 1 + 2 + 2 = 5."
    src: { page: 143, quote: "At least once a year, assess urinary albumin (e.g., spot urinary albumin-to- creatinine ratio) and estimated glomerular filtration rate (eGFR):\n  1. In patients with type 1 diabetes with a duration of ≥5 years\n  2. In all patients with type 2 diabetes" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.015
    kind: cloze
    topic: screening
    text: "Screen for DKD in type 1 diabetes once duration is {{c1::≥5 years}}, and in type 2 diabetes {{c2::from diagnosis (all patients)}}."
    src: { page: 143, quote: "1. In patients with type 1 diabetes with a duration of ≥5 years\n2. In all patients with type 2 diabetes" }
    status: unverified
    tags: [numbers]
  - id: dm.L12.016
    kind: cloze
    topic: screening
    text: "Patients with urinary albumin >{{c1::30}} mg/g creatinine and/or eGFR <{{c2::60}} ml/min/1.73 m² are monitored {{c3::twice annually}}."
    src: { page: 144, quote: "Patients with urinary albumin >30 mg/g creatinine and/or an eGFR <60 mL/min/1.73 m2 should be monitored twice annually to guide therapy." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L12.017
    kind: enumerate
    topic: screening
    prompt: When should you consider non-diabetic kidney disease and/or a kidney biopsy in a diabetic patient? (10 clues)
    points:
      - Atypical presentation of renal disease
      - Absence of retinopathy (type 1)
      - "Albuminuria developing <5 or >25 years after onset (type 1)"
      - Immunological markers or active urinary sediment
      - Acute or sudden-onset macroalbuminuria or nephrotic syndrome
      - Nephritic syndrome
      - Hematuria
      - Rapid decline in renal function
      - "eGFR falls >30% after starting a RAAS inhibitor"
      - Acute kidney injury
    pass: 7
    hook: "10 علامات «مش سكر»: «الشكل غريب» (atypical، مفيش retinopathy في type 1، albuminuria قبل 5 أو بعد 25 سنة في type 1)، «الكلية بتتكلم» (immunological markers أو active sediment، nephritic، hematuria)، و«بسرعة» (macroalbuminuria أو nephrotic مفاجئ، rapid decline، eGFR ينزل أكتر من 30% بعد RAAS inhibitor، وAKI). 3 + 3 + 4 = 10."
    src: { page: 144, quote: "When to consider non-DKD and/or pursue a kidney biopsy\n  1. Atypical Presentation of renal disease in DM\n  2. Absence of retinopathy (T1D)\n  3. Albuminuria developing <5 or >25 the onset of disease (T1D)\n  4. Immunological markers or active urinary sediment\n  5. Acute/sudden onset macroalbuminuria or the nephrotic syndrome\n  6. Nephritic syndrome\n  7. Hematuria\n  8. Rapid decline in renal function\n  9. Significant reduction in eGFR (>30%) after initiation RAASi" }
    status: unverified
    tags: [high-yield]
  - id: dm.L12.018
    kind: mcq
    topic: screening
    stem: "A 34-year-old woman with type 1 DM for 2 years has new heavy proteinuria, red cell casts and eGFR falling from 95 to 60 ml/min/1.73 m² over 6 weeks. Fundoscopy is normal. What is the best next step?"
    options:
      - Work up for non-diabetic kidney disease and consider a kidney biopsy
      - Label it DKD and start an ACE inhibitor only
      - Recheck ACR in one year
      - Start an SGLT2 inhibitor and review in 6 months
      - "Reassure: early DKD is often rapid in type 1"
    answer: 0
    why:
      - "Correct: albuminuria <5 years after onset in type 1, no retinopathy, active sediment and rapid decline are all non-DKD clues (p144)."
      - "Calling it DKD ignores several red flags for another disease."
      - "Yearly screening is for stable patients; this is an active process."
      - "Kidney-protective drugs do not replace a diagnosis."
      - "DKD in type 1 does not usually appear at 2 years with active sediment."
    src: { page: 144, quote: "When to consider non-DKD and/or pursue a kidney biopsy\n  1. Atypical Presentation of renal disease in DM\n  2. Absence of retinopathy (T1D)\n  3. Albuminuria developing <5 or >25 the onset of disease (T1D)\n  4. Immunological markers or active urinary sediment\n  5. Acute/sudden onset macroalbuminuria or the nephrotic syndrome\n  6. Nephritic syndrome\n  7. Hematuria\n  8. Rapid decline in renal function\n  9. Significant reduction in eGFR (>30%) after initiation RAASi" }
    status: unverified
  - id: dm.L12.019
    kind: card
    topic: screening
    front: "On what three things is CKD classified (staging figure, p144)?"
    back: "Cause (C), glomerular filtration rate (GFR) category (G) and albuminuria category (A): the CGA classification."
    src: { page: 144, quote: "Risk of chronic kidney disease (CKD) progression, frequency of visits, and referral to nephrology according to glomerular filtration rate (GFR) and albuminuria.\nCKD is classified based on: Cause (C), GFR (G), Albuminuria (A)\n| GFR categories (mL/min/1.73m2) | A1: Normal to mildly increased (<30 mg/g, <3 mg/mmol) | A2: Moderately increased (30-299 mg/g, 3-29 mg/mmol) | A3: Severely increased (≥300 mg/g, ≥30 mg/mmol) |\n|---|---|---|---|\n| G1: Normal to high (≥90) | 1 if CKD | Treat 1 | Refer* 2 |\n| G2: Mildly decreased (60-89) | 1 if CKD | Treat 1 | Refer* 2 |\n| G3a: Mildly to moderately decreased (45-59) | Treat 1 | Treat 2 | Refer 3 |\n| G3b: Moderately to severely decreased (30-44) | Treat 2 | Treat 3 | Refer 3 |\n| G4: Severely decreased (15-29) | Refer* 3 | Refer* 3 | Refer 4+ |\n| G5: Kidney failure (<15) | Refer 4+ | Refer 4+ | Refer 4+ |" }
    status: unverified
  - id: dm.L12.020
    kind: table
    topic: screening
    title: "Albuminuria categories (KDIGO grid, p144)"
    columns: [Category, Description, ACR]
    rows:
      - [A1, Normal to mildly increased, "<30 mg/g (<3 mg/mmol)"]
      - [A2, Moderately increased, "30–299 mg/g (3–29 mg/mmol)"]
      - [A3, Severely increased, "≥300 mg/g (≥30 mg/mmol)"]
    blanks: [[0, 2], [1, 2], [2, 2], [1, 1]]
