  - id: rheum.L04.lesson4
    title: "الـ CAPS والـ work-up"
    hook: "تلات organs في تلات أيام بعد ما وقفت الـ warfarin عشان خلع ضرس: دي مش صدفة، دي CAPS."
    minutes: 8
    pages: [72, 73]
    topics: [caps, workup]
    goals:
      - "تعرف الـ CAPS: تعريفه، triggers، و triple therapy، وليه كل جزء"
      - "تعمل work-up لعيان شاكك فيه APS"
      - "تعرف مين محتاج SLE screen، وليه"
    status: unverified
    steps:
      - kind: explain
        page: 72
        title: "الـ CAPS: العاصفة"
        quote: "CAPS is a rare, rapidly progressive form of APS involving simultaneous thrombosis in multiple organs."
        text: |
          الـ ==Catastrophic antiphospholipid syndrome (APS)== شكل **نادر** و **rapidly progressive**:

          - **≥3 organ systems** في وقت قصير (غالبًا **أيام**)
          - دليل على **small-vessel thrombosis**
          - **High mortality** لو ما اتعالجش

          التفسير المقبول (مش في الكتاب): ليه العاصفة دي خطيرة كده؟ عشان الجلطات في الأوعية الصغيرة بتقفل الدم عن أعضاء كتير في نفس الوقت (كلى، رئة، مخ، قلب)، وكل عضو بيقع بيزوّد الالتهاب والتجلط، فالدايرة بتكبر بسرعة. يعني لو مريض APS دخل بفشل في أكتر من عضو في أيام، فكّر في الـ CAPS وابدأ بسرعة.
      - kind: explain
        page: 72
        quote: "Withdrawal of anticoagulation."
        title: "ليه الـ triggers دي بالذات؟"
        text: |
          التفسير المقبول (مش في الكتاب): كل trigger من الأربعة بيزوّد قابلية التجلط فجأة عند حد أصلًا دمه سهل يتجلط:

          - **Infection**: الالتهاب بينشّط الـ endothelium والـ clotting.
          - **Surgery**: جرح في النسيج + رقاد في السرير.
          - ==Withdrawal of anticoagulation==: الحماية الوحيدة اتشالت، زي اللي في الـ case بعد خلع الضرس.
          - **Obstetric complications**: الحمل والولادة نفسهم من أعلى أوقات التجلط.

          وعشان كده الكتاب في صفحة 74 بيقول: لو المريض داخل عملية ← **perioperative prophylaxis**، ولو هتوقف الـ warfarin ← **bridge بالـ LMWH**. ده بالظبط منع للـ trigger.
      - kind: mnemonic
        page: 72
        quote: "Common Triggers\n  Infection.\n  Surgery.\n  Withdrawal of anticoagulation.\n  Obstetric complications."
        word: "SWIP"
        parts:
          - { key: "S", text: "Surgery" }
          - { key: "W", text: "Withdrawal of anticoagulation" }
          - { key: "I", text: "Infection" }
          - { key: "P", text: "Pregnancy (obstetric complications)" }
        hook: "الـ CAPS بييجي بـ **SWIP**: زي ما تعمل swipe غلط وتلاقي التلات organs اتقفلوا مرة واحدة."
      - kind: explain
        remind: [rheum.L04.034]
        page: 72
        title: "علاج الـ CAPS: triple therapy"
        quote: "Treatment Approach\n  \"Triple therapy\" is often used:\n    Anticoagulation.\n    High-dose corticosteroids.\n    Plasmapheresis and/or intravenous immunoglobulin (IVIG).\n  Rituximab or eculizumab may be used in refractory cases."
        text: |
          الـ ==triple therapy==:
          1. **Full anticoagulation**
          2. **High-dose corticosteroids**
          3. **Plasmapheresis و/أو intravenous immunoglobulin (IVIG)**

          ولو **refractory**: **rituximab** أو **eculizumab**.

          التفسير المقبول (مش في الكتاب): ليه rituximab و eculizumab للـ refractory؟ عشان دول بيضربوا أبعد في السلسلة: الـ rituximab بيشيل الـ B cells اللي بتصنّع الـ antibody نفسه، والـ eculizumab بيقفل الـ complement اللي الـ antibody بيشغّله ويعمل الجلطة. يعني لو الـ triple therapy ماوقفتش العاصفة، بتقطع المصدر.
      - kind: explain
        page: 72
        quote: "High mortality if untreated."
        title: "ليه تلات علاجات مع بعض؟"
        text: |
          الـ CAPS **high mortality** و **rapidly progressive**، فمفيش وقت تجرّب علاج ورا التاني. التفسير المقبول (مش في الكتاب) لكل ضلع في الـ triple therapy:

          - **Anticoagulation**: يوقف الجلطات الجديدة ويمنع القديمة تكبر.
          - **High-dose corticosteroids**: يطفي الالتهاب الكبير اللي بيصاحب الجلطات في أعضاء كتير.
          - ==Plasmapheresis و/أو IVIG==: الـ plasmapheresis **بيشيل الـ antibodies** نفسها من الدم، والـ IVIG بيعدّل المناعة.

          ولو مافيش فايدة: **rituximab** (بيشيل الـ B cells اللي بتعمل الـ antibodies) أو **eculizumab** (بيقفل الـ complement).

          يعني القاعدة: في العاصفة بتضرب كل حلقات السلسلة مرة واحدة (الجلطة، الالتهاب، الـ antibody)، مش واحدة واحدة.
      - kind: figure
        page: 72
        quote: "Anticoagulation.\n  High-dose corticosteroids.\n  Plasmapheresis and/or intravenous immunoglobulin (IVIG).\n  Rituximab or eculizumab may be used in refractory cases."
        title: "كل علاج بيقطع حلقة"
        alt: "A chain of three links: antibody, then clot in small vessels, then inflammation and organ failure. Under each link an arrow from its treatment: plasmapheresis or IVIG removes the antibody, anticoagulation stops the clot, high-dose steroids calm the inflammation. A dashed box for refractory cases: rituximab removes the B cells that make the antibody, eculizumab blocks complement."
        caption: "الـ ==triple therapy== بتقطع التلات حلقات مع بعض. والـ refractory: بتروح للمصدر (B cells) أو للـ complement."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L04c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fg-head"/></marker></defs>
