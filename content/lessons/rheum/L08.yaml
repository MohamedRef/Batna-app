          - "الـ single organ زي الـ cutaneous leukocytoclastic angiitis والـ primary CNS vasculitis: عضو واحد من غير سبب."
          - "الـ variable vessel = Behçet و Cogan، اللي بيمسكوا أي حجم."
          - "الـ large vessel = Takayasu و GCA."
