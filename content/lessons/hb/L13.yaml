        title: "تعريف ومصير"
        quote: "Primary sclerosing cholangitis (PSC) is a chronic cholestatic liver disease characterized by fibrosing inflammation of both the intrahepatic and extrahepatic biliary tree."
        text: |
          الـ primary sclerosing cholangitis (PSC) مرض ==chronic cholestatic== فيه ==fibrosing inflammation== للقنوات الـ intrahepatic والـ extrahepatic مع بعض.

          القصة ماشية في خط واحد:

          - الـ ducts بتتأذّى أذى irreversible.
          - ده بيعمل cholestasis، وبعدين cirrhosis، وبعدين liver failure.
          - والنتيجة premature death، إلا لو اتعمل **liver transplantation**.

          وفيه خطر تاني: على المدى الطويل بيحصل **colon cancer** و **bile duct cancer** كتير. السبب غالبًا الـ chronic inflammation في القولون والقنوات.

          ولحد دلوقتي، مفيش علاج بيعمل complete remission (clinical و biochemical و histologic). علشان كده الـ transplant هو الحل المهم في الـ end-stage.
      - kind: sort
