  - id: neph.L11.lesson6
    title: "حمل بعد زرع الكلى: الكلية الجديدة والبيبي الجديد"
    hook: "الخصوبة بترجع بعد الزرع في شهور. إمتى تقولها: دلوقتي ينفع؟"
    minutes: 9
    pages: [382, 395]
    topics: [tx-risk, tx-plan, tx-contraception, tx-drugs, tx-delivery]
    goals:
      - "تعرف إمتى الحمل خطر على الـ graft"
      - "تحفظ شروط الحمل الآمن بعد الزرع"
      - "تظبط منع الحمل والأدوية والولادة والرضاعة"
    status: unverified
    steps:
      - kind: explain
        page: 383
        title: "الخصوبة بترجع بسرعة"
        quote: "any unplanned pregnancy poses a great risk to both the mother and the child, as well as to the allograft"
        text: |
          بعد الزرع الـ LH والـ FSH والـ prolactin بيقلّوا والـ estrogen بيعلى، فالدورة والـ ovulation يرجعوا. (بس **20%** ممكن premature ovarian failure، و **31%** مايرجعلهمش الدورة.)

          الخصوبة ممكن ترجع في **1-6 شهور**، فلازم ==counseling و contraception== من بدري: الـ **unplanned pregnancy** خطر على الأم والطفل والـ **allograft**.
      - kind: explain
        page: 383
        title: "الـ graft يستحمل؟"
        quote: "For women with a serum creatinine of 1.5 mg/dl or lesser, 90% of pregnancies were reported to be successful."
        text: |
          - Creatinine ==≤1.5==: **90%** من الحمل ناجح، والـ graft مش بيتأثر.
          - **>1.5 + proteinuria >500 mg/24 h** (Davison): predictors لفقد الـ graft.
          - **1.8-2 أو أكتر**: فقد الـ graft أرجح خلال **سنتين**.
          - **>1.9** (Fischer): تدهور سريع ممكن لـ ESRD.

          الكلية التعبانة أصلًا بتعمل hyperfiltration، فمفيش ==reserve== للحمل.
      - kind: figure
        page: 383
        quote: "a baseline serum creatinine level of more than 1.5 mg/dl and proteinuria of more than 500 mg/24 h were strong predictors of irreversible graft loss"
        title: "مسطرة الكرياتينين قبل الحمل"
        alt: "A creatinine ruler for transplant recipients before pregnancy: up to 1.5 mg/dL is green with 90 percent successful pregnancies; above 1.5 with proteinuria over 500 mg a day is amber, strong predictor of graft loss; 1.8 to 2 or higher is red, graft loss likely within 2 years; above 1.9 is red, rapid decline toward ESRD."
        caption: "كل ما الـ ==creatinine== قبل الحمل يعلى، كل ما الـ graft يبقى في خطر. الأخضر لحد **1.5**."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="20" width="130" height="34" rx="6" class="fg-good"/>
            <rect x="140" y="20" width="70" height="34" rx="6" class="fg-acc"/>
            <rect x="210" y="20" width="110" height="34" rx="6" class="fg-bad"/>
            <text x="75" y="42" text-anchor="middle" class="t-sm t-b">≤ 1.5</text>
            <text x="175" y="42" text-anchor="middle" class="t-sm t-b">&gt; 1.5</text>
            <text x="265" y="42" text-anchor="middle" class="t-sm t-b">≥ 1.8-2</text>
            <text x="10" y="14" class="t-sm t-mut">Baseline creatinine (mg/dL)</text>
            <text x="10" y="84" class="t-sm t-good t-b">≤ 1.5: 90% of pregnancies succeed</text>
            <text x="10" y="112" class="t-sm t-b">&gt; 1.5 + proteinuria &gt; 500 mg/24 h:</text>
            <text x="10" y="128" class="t-sm">strong predictors of graft loss (Davison)</text>
            <text x="10" y="156" class="t-sm t-bad t-b">1.8-2 or more: graft loss within 2 years</text>
            <text x="10" y="182" class="t-sm t-bad">&gt; 1.9: rapid decline toward ESRD (Fischer)</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 383
        quote: "Predamaged kidneys with fewer functioning nephrons already exhibiting hyperfiltration do not have sufficient reserves"
        text: |
          زي موظف شغّال overtime من غير ما حد يطلب. لو جالك مشروع زيادة (الحمل) هيقع. الكلية السليمة عندها **reserve**، والتعبانة لأ.
      - kind: case
        page: 384
        quote: "Allograft biopsy should be done to confirm acute rejection before modifying immunosuppression. High-dose steroids have been successful"
        stem: "Transplant recipient at 24 weeks: creatinine 1.1 → 1.7 mg/dL, BP rising, more proteinuria."
        steps:
          - question: "What must you exclude?"
            options: ["Rejection, preeclampsia and UTI", "Hyperemesis", "Normal pregnancy change", "Cortical necrosis only"]
            answer: 0
            why: "الـ rejection (2-14.5%) بيتلخبط مع الـ preeclampsia، والـ UTI بتصيب لحد 40% من الحوامل بعد الزرع."
          - question: "Before changing immunosuppression?"
            options: ["Allograft biopsy", "Add sirolimus", "Deliver now", "Start ATG"]
            answer: 0
            why: "Biopsy تأكد الـ rejection الأول. والعلاج first-line: **high-dose steroids**؛ الـ ATG والـ rituximab بياناتهم قليلة."
      - kind: explain
        page: 384
        title: "الحمل بعد الزرع بالأرقام"
        quote: "higher rates of preeclampsia in 21.5% (based on geographical distribution), a higher cesarean rate in 62.6%, preterm births (<37 weeks of gestation) in 43.1%"
        text: |
          Shah meta-analysis: preeclampsia ==21.5%==، cesarean **62.6%**، preterm **43.1%**، miscarriage 15.4%، stillbirth 5.1%.

          Table 1: live birth **71-90%**، graft rejection **1-5%**، graft loss **5-20%**، urinary obstruction 10%.
      - kind: mnemonic
        page: 386
        quote: "Table 2: Suggested criteria for safe pregnancy in kidney transplant recipients"
        word: "GRAFTS"
        parts:
          - { key: "G", text: "Graft stable: creatinine <2.0, preferably <1.5 mg/dL (eGFR ≥40)" }
          - { key: "R", text: "Rejection: none in the past 6 months" }
          - { key: "A", text: "A year at least since transplant" }
          - { key: "F", text: "Few, safe drugs: cyclosporine or tacrolimus, azathioprine, steroids" }
          - { key: "T", text: "Tension (BP) normal or controlled on one drug" }
          - { key: "S", text: "Scant proteinuria (<300 mg/24 h) and a normal graft Sonar (ultrasound)" }
        hook: "قبل ما تقولها مبروك، اتأكد إن الـ **GRAFTS** كلها تمام (Table 2)."
      - kind: check
        page: 386
        quote: "patients are advised to defer pregnancy to a minimum of 1-year posttransplant, and contraception should be practiced until then"
        question: "8 months post-transplant, creatinine 1.2, no rejection, on tacrolimus + MMF + prednisolone. She wants to conceive. Best advice?"
        options:
          - "Wait until ≥1 year and switch MMF to azathioprine first"
          - "Conceive now"
          - "Never conceive after a transplant"
          - "Stop all immunosuppression"
        answer: 0
        why:
          - "صح: لسه أقل من سنة، والـ MMF لازم يتشال ويتكمل contraception 3 شهور بعده."
          - "ناقصها شرط السنة والـ MMF."
          - "الحمل ممكن لما الشروط تتحقق."
          - "كده هتعمل rejection؛ غيّر لأدوية آمنة."
      - kind: explain
        page: 387
        title: "منع الحمل بعد الزرع"
        quote: "intrauterine devices, both copper and levonorgestrel, represent a safer and more effective choice for kidney transplant women"
        text: |
          - **Barrier**: آمن بس يعتمد على الالتزام، والـ **cervical cap** ضاعف الـ UTI.
          - ==IUD== (copper أو levonorgestrel): آمن وفعال، مفيش interaction ولا pelvic infection زيادة.
          - **Combined**: بحذر (ضغط، migraine، thrombosis)، وبيتكسر بالـ **CYP3A4** زي الـ CNI.
          - **Patch و ring**: مفيش first-pass في الكبد، فـ interaction أقل. الـ ring فيه estrogen أقل.
          - **Implant (etonogestrel)**: >99% لـ 3 سنين.
      - kind: reveal
        page: 388
        quote: "Combined oral contraceptive and progestin-only contraceptives have an inhibitory effect on P 450 3A4, thus increasing the concentration of CNI"
        prompt: "الحباية والـ tacrolimus: مين بيأثر على مين؟"
        answer: "الاتنين! الحبوب (combined و progestin-only) بتـ**inhibit** الـ CYP3A4 فالـ CNI (خصوصًا ==cyclosporine==) يعلى. والـ CNI (خصوصًا **tacrolimus**) بيـ**induce** الـ CYP3A4 فالحباية ممكن تفشل. راقب الـ levels."
      - kind: table
        page: 391
        quote: "MMF should be replaced with azathioprine, in a dosage of 2 mg/kg or less"
        title: "الـ immunosuppression قبل الحمل"
        columns: ["Drug", "القرار"]
        rows:
          - ["MMF / MPA", "يتشال قبل الحمل (27% malformations)، contraception 3 شهور"]
          - ["Sirolimus / everolimus", "يتشال؛ حوّل لـ CNI + prednisolone"]
          - ["Azathioprine", "البديل، ≤2 mg/kg"]
          - ["Tacrolimus / cyclosporine", "آمن؛ راقب الـ levels"]
          - ["Prednisolone", "آمن؛ مش بيكبت الـ fetal ACTH"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: exam
        page: 390
        quote: "The most commonly reported deformities were craniofacial malformations such as cleft lip and"
        text: |
          الـ MMF عليه **black box warning**. التشوهات: ==craniofacial== (cleft lip و palate، microtia أو anotia، hypertelorism، coloboma، micrognathia) و **cardiac** (conotruncal و aortic arch).
      - kind: explain
        page: 392
        title: "باقي الأدوية"
        quote: "Folic acid is started 3 months before a planned pregnancy, as well as aspirin in small doses to reduce preeclampsia."
        text: |
          - **ضغط >140/90**: preterm ×6 و preeclampsia ×5.
          - **ACEi/ARB** ممنوع (oligohydramnios، skull hypoplasia، renal dysplasia، PDA). **Atenolol** يتجنب (growth retardation). الآمن: methyldopa و hydralazine و labetalol و CCB.
          - ==Folic acid== 3 شهور قبل، **aspirin** low dose، و **LMWH** لو proteinuria **>2 g**.
          - **Valganciclovir**: لأ إلا لو الفايدة أكبر. **Cotrimoxazole**: meta-analysis بتقول آمن. **Statins**: الـ FDA شالت الـ contraindication.
      - kind: explain
        page: 394
        title: "الولادة والرضاعة"
        quote: "Normal vaginal delivery without abdominal compression is the safest and recommended method of delivery in transplant recipients"
        text: |
          الـ graft في الـ ==false pelvis==، فمش بيسد الولادة. **Vaginal delivery** من غير ضغط على البطن، وسيبها لحد 38-40 أسبوع. الـ CS للأسباب الـ obstetric بس.

          في الولادة: **hydrocortisone 100 mg كل 6 ساعات** يغطي الـ stress ويمنع الـ rejection.

          الرضاعة مسموحة مع prednisolone و azathioprine و tacrolimus و cyclosporine و captopril و enalapril و amlodipine و nifedipine و labetalol و atenolol (2019). الـ ==MMF والـ mTOR== ملهمش بيانات.
