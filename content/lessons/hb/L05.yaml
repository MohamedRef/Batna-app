  - id: hb.L05.lesson4
    title: "قبل وأثناء وبعد العلاج، والحالات الخاصة"
    hook: "حباية بتشفي، بس فيه 6 حاجات لازم تعملها قبلها، ودوا قلب واحد ممنوع خالص معاها."
    minutes: 10
    pages: [93, 94]
    topics: [management, special]
    goals:
      - "تفتكر الـ 6 حاجات اللي في الـ pre-treatment checklist"
      - "تعرف ليه بنعمل HBcAb وليه amiodarone ممنوع"
      - "تعرف المتابعة بعد الـ SVR في الـ cirrhosis"
      - "تظبط العلاج في decompensated cirrhosis و CKD والحمل والـ coinfection"
    status: unverified
    steps:
      - kind: explain
        page: 93
        title: "قبل العلاج: 6 حاجات"
        text: |
          الكتاب حاططها checklist من 6 نقط. مش لازم بالترتيب، إلا أول واحدة: لازم تتأكد إن فيه فيروس قبل أي حاجة.

          وكل نقطة ليها سبب:

          - ==Confirm HCV RNA==: الـ antibody لوحده ممكن يكون ندبة قديمة. مش هنعالج حد خف.
          - **Assess fibrosis** (FIB-4، FibroScan): بتقرر هل محتاج متابعة HCC بعد الشفا، وهل الـ cirrhosis decompensated فالعلاج يتغير.
          - **Test for HIV and HBV**، ومعاهم ==total HBcAb==: الـ HBV ممكن يصحى بعد ما C يمشي.
          - **Check liver and renal function**: الكلى بتحدد نختار أنهي دوا (sofosbuvir ولا لأ).
          - **Pregnancy test** (if relevant): الـ DAAs not approved in pregnancy.
          - **Check for drug-drug interactions**: والمثال اللي الكتاب اختاره amiodarone.
      - kind: check
        page: 93
        question: "Which of these is NOT in the lecture's pre-treatment checklist for DAAs?"
        options:
          - "Routine liver biopsy"
          - "Test for HIV and HBV, including total HBcAb"
          - "Pregnancy test, if relevant"
          - "Check for drug-drug interactions"
        answer: 0
        why:
          - "صح: الـ fibrosis بتتقيّم بـ **FIB-4 و FibroScan**، والـ biopsy **rarely used now**."
          - "موجودة في الـ checklist، والـ HBcAb علشان الـ HBV reactivation."
          - "موجودة: الـ DAAs **not approved in pregnancy**."
          - "موجودة، ومثالها **amiodarone**."
      - kind: reveal
        page: 94
        prompt: "ليه نعمل **total HBcAb** مش HBsAg بس قبل الـ DAAs؟"
        answer: |
          الكتاب بيقول في الـ coinfection: **monitor HBV reactivation**.

          الشرح المقبول: الـ HCV والـ HBV لما يبقوا مع بعض، الـ HCV غالبًا بيكتم الـ HBV. أول ما الـ DAAs تشيل الـ HCV، الـ HBV ممكن يصحى ويعمل flare. والـ **HBcAb** بيكشف حتى العدوى القديمة الكامنة اللي الـ HBsAg فيها ممكن يكون negative.
      - kind: aside
        tone: exam
        page: 93
        quote: "Amiodarone is absolutely contraindicated… can result in serious bradycardia."
        text: |
          المثال الوحيد اللي الكتاب اختاره للـ **drug-drug interactions**: **Amiodarone**، **absolutely contraindicated**، لأنه ممكن يعمل **serious bradycardia** (مع الـ sofosbuvir regimens).

          لو شفت في السؤال «AF on amiodarone + HCV»، الإجابة جاهزة.
      - kind: explain
        page: 93
        title: "أثناء العلاج وبعده"
        text: |
          - **During treatment**: حاجتين بس: monitor adherence، و check for drug interactions. الكورس قصير، فكل جرعة فايتة بتفرق، وأي دوا جديد المريض يبدأه لازم يتراجع.
          - **After treatment**: تحليل HCV RNA at 12 weeks post-treatment، وده الـ SVR12 اللي بيقول اتعالج.

          ولو فيه **cirrhosis**، المتابعة مابتخلصش بالشفا:

          - ==HCC surveillance== every 6 months.
          - ==Primary prophylaxis== against variceal bleeding and decompensation في اللي عندهم **CSPH** (clinically significant portal hypertension).

          يعني اللي من غير cirrhosis بيروّح بعد الـ SVR12، واللي عنده cirrhosis بيكمّل معانا.
      - kind: figure
        page: 93
        title: "رحلة العلاج على خط واحد"
        alt: "A vertical timeline. Before treatment: the 6-point checklist, confirm HCV RNA first. During treatment, 8 to 12 weeks or 24 if decompensated: monitor adherence and drug interactions. 12 weeks after the end of treatment: HCV RNA undetectable means SVR12, cure. Then a split: no cirrhosis, follow-up ends; cirrhosis, HCC surveillance every 6 months and primary variceal prophylaxis if CSPH."
        caption: "الـ SVR12 بيتقاس بعد 12 أسبوع من **نهاية** العلاج. وبعده الطريق بيتقسم: من غير cirrhosis خلصنا، ومع cirrhosis نكمّل متابعة."
        svg: |
          <svg viewBox="0 0 330 420" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L05e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <path d="M22 30V262" class="fg-ink"/>
