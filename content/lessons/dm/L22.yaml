  - id: dm.L22.lesson3
    title: "الـ LDL اتظبط والخطر لسه موجود: الـ TG"
    hook: "وصلت للـ target، والعيان لسه بيجيله MI. الكتاب بيقولك مين المتهم، وإيه الدوا اللي الـ FDA وافقت عليه في 4 شهور."
    minutes: 10
    pages: [277, 280]
    topics: [residual, icosapent]
    goals:
      - "تعرف دليل الـ residual risk من الـ TG وتفهم ليه الـ TG بيضر"
      - "تعرف icosapent ethyl: ESC و ADA و REDUCE-IT، وتقرا الـ NNT"
      - "تحفظ الـ home message وتعرف ليه"
    status: unverified
    steps:
      - kind: explain
        page: 277
        title: "الـ residual risk"
        quote: "To determine whether high triglycerides (TG) in the presence of statin- controlled LDL-C influence the risk of cardiovascular disease (CVD) among patients with diabetes in real-world clinical practice."
        text: |
          دراسة **real-world** (Diabetes, Obesity and Metabolism، فبراير 2019): هل الـ ==high triglycerides (TG)== بيزوّد الـ cardiovascular disease (CVD) عند السكريين اللي الـ **low-density lipoprotein (LDL) بتاعهم مظبوط على statin**؟
          - LDL **40-100 mg/dL**، atherosclerotic cardiovascular disease (ASCVD) أو risk factor واحد على الأقل، **n = 27,953**.
          - TG **200-499** ضد TG **أقل من 150**، لمدة **7 سنين**.

          ليه السؤال ده مهم؟ لأن السكري نمطه TG عالي و HDL واطي (افتكر عيان الكتاب: TG 230)، والـ statin شغله الأساسي الـ LDL. فلو فيه خطر **فاضل** بعد ما الـ LDL يتظبط، غالبًا هيكون في الـ TG.
      - kind: "figure"
        page: 277
        quote: "Patients with moderately high TGs (200 – 499 mg/dl)\nPatients with normal TGs (< 150 mg/dl)\n0 real-world clinical practice 7 years"
        title: "تصميم الدراسة: رسمة الكتاب، ص 277"
        image: { file: dm/L22-tg-design.webp, book: true }
        caption: "رسمة الكتاب للدراسة: جروبين ماشيين جنب بعض ==7 سنين== في الـ real-world practice: الـ TG **200–499** (الأزرق) ضد الـ TG **أقل من 150** (الرمادي).\n\nالاتنين الـ LDL بتاعهم مظبوط على statin، فأي فرق في الـ CVD بينهم يتنسب للـ ==TG==."
        alt: "Book drawing: two bars over a 0 to 7 year line labelled real-world clinical practice: patients with moderately high TGs (200 to 499 mg/dl) and patients with normal TGs (below 150 mg/dl)."
      - kind: table
        page: 278
        quote: "Results: Group 1 = Patients with moderately high TGs (200 – 499 mg/dl); Group 2 = Patients with normal (< 150 mg/dl)\n| End Point | Group 1 vs Group 2 |\n|---|---|\n| Non Fatal MI | 30 %* Higher in Gp 1 with ↑ TGs (P = 0.006) |\n| Non Fatal Stroke | 23 %* Higher in Gp 1 with ↑ TGs (P = 0.037) |\n| Coronary Revascularization | 21 %* Higher in Gp 1 with ↑ TGs (P = 0.027) |\n| Unstable Angina | 33% Higher in Gp 1 with ↑ TGs (P = 0.185) |"
        title: "الـ TG العالي زوّد إيه؟"
        columns: [End point, Higher, P]
        rows:
          - ["Non-fatal MI", "30%", "0.006"]
          - ["Non-fatal stroke", "23%", "0.037"]
          - ["Coronary revasc", "21%", "0.027"]
          - ["Unstable angina", "33%", "0.185 (NS)"]
        hide: [[0, 1], [1, 1], [3, 2]]
      - kind: aside
        tone: trap
        page: 278
        quote: "Results: Group 1 = Patients with moderately high TGs (200 – 499 mg/dl); Group 2 = Patients with normal (< 150 mg/dl)\n| End Point | Group 1 vs Group 2 |\n|---|---|\n| Non Fatal MI | 30 %* Higher in Gp 1 with ↑ TGs (P = 0.006) |\n| Non Fatal Stroke | 23 %* Higher in Gp 1 with ↑ TGs (P = 0.037) |\n| Coronary Revascularization | 21 %* Higher in Gp 1 with ↑ TGs (P = 0.027) |\n| Unstable Angina | 33% Higher in Gp 1 with ↑ TGs (P = 0.185) |"
        text: "فخ: الـ **unstable angina** أعلى رقم (33%) بس **مش significant** (P = 0.185). التلاتة التانيين (MI و stroke و revasc) هما اللي significant."
      - kind: explain
        page: 278
        title: "الخلاصة: الـ TG هو المتهم"
        quote: "Conclusion:\n  1. Despite statin-controlled LDL-C levels; CV events were greater among patients with high TG levels (200 – 499 mg/ dl) Vs In patients with normal TGs < 150 mg/dl.\n  2. The Increase of Residual CV Risk in Statin controlled patients is explained by elevated TGs."
        text: |
          رغم إن الـ LDL مظبوط، الـ cardiovascular (CV) events أكتر مع TG **200-499** عن TG **أقل من 150**. يعني ==الـ residual CV risk== في المظبوطين على statin سببه **الـ TG العالي**.

          إزاي الـ TG بيأذي وهو مش بيدخل الجدار لوحده؟ التفسير المقبول (مش في الكتاب): الـ particles الغنية بالـ TG (الـ VLDL وبواقيها) شايلة كوليسترول برضه، وصغيرة كفاية تدخل الـ intima زي الـ LDL. عشان كده الـ **non-HDL-C** بيعبّر عن الخطر ده أحسن من الـ LDL لوحده.
      - kind: explain
        page: 278
        title: "ESC 2023: icosapent ethyl"
        quote: "2023 ESC Guidelines for the management of cardiovascular disease in patients with diabetes\n| Recommendation | Class | Level |\n|---|---|---|\n| High-dose icosapent ethyl (2 g b.i.d.) may be considered in combination with a statin in patients with hypertriglyceridaemia | IIb | B |\nHypertriglyceridaemia: triglycerides 150–499 mg/dL, according to the inclusion of the REDUCE-IT trial."
        text: |
          **European Society of Cardiology (ESC) 2023**: ==high-dose icosapent ethyl== (**2 g مرتين يوميًا**) **may be considered** مع الـ statin في الـ hypertriglyceridaemia: **IIb B**.

          الـ hypertriglyceridaemia هنا = TG **150-499 mg/dL**، لأن ده اللي REDUCE-IT دخّلهم. يعني الـ guideline بيوصّي على قد الناس اللي اتجرّب عليهم الدوا بالظبط، وده سبب الأرقام دي.
      - kind: explain
        page: 279
        title: "ADA 2024 و REDUCE-IT"
        quote: "ADA 2024: Diabetic Dyslipidemia\n10.30 In individuals with atherosclerotic cardiovascular disease or other cardiovascular risk factors on a statin with controlled LDL cholesterol but elevated triglycerides (135–499 mg/dL), the addition of icosapent ethyl can be considered to reduce cardiovascular risk. A"
        text: |
          **American Diabetes Association (ADA) 2024 (10.30)**: ASCVD أو risk factors، على statin والـ LDL مظبوط بس TG **135-499 mg/dL** ← icosapent ethyl (**grade A**).

          ==REDUCE-IT==: 8179 عيان (CVD أو سكر + risk factors؛ primary و secondary prevention)، 473 مركز في 11 دولة، **2 g مرتين** (4 g/day) ضد placebo، **4.9 سنة**.
          - Primary (CV death، MI، stroke، revasc، unstable angina): **−25%**، number needed to treat (NNT) **21**.
          - Key secondary (CV death، MI، stroke): **−26%**، NNT **28**.
      - kind: figure
        page: 279
        quote: "Reduction of Cardiovascular Events with Icosapent Ethyl–Intervention Trial (REDUCE-IT): 2 g of Icosapent Ethyl twice daily (total 4 g daily) vs Placebo, 4.9 years; Phase 3b, multi-center, randomized, double-blind, placebo controlled trial\n| | Primary endpoint | Secondary endpoint |\n|---|---|---|\n| Outcome | CV Death, MI, Stroke, Coronary Revasc, Unstable Angina | CV Death, MI, Stroke |\n| Relative reduction | 25 % | 26 % |\n| Hazard Ratio | 0.75 (95% CI 0.68–0.83) | 0.74 (95% CI 0.65–0.83) |\n| RRR | 24.8% | 26.5% |\n| ARR | 4.8% | 3.6% |\n| NNT | 21 (95% CI 15–33) | 28 (95% CI 20–47) |\n| P | 0.00000001 | 0.0000006 |"
        title: "REDUCE-IT في سطرين"
        alt: "Two horizontal bars comparing placebo and icosapent ethyl. Primary endpoint: 28.3 percent with placebo versus 23.0 percent with icosapent ethyl, a 25 percent relative reduction, NNT 21. Key secondary endpoint: 20.0 percent versus 16.2 percent, a 26 percent relative reduction, NNT 28."
        caption: "الـ primary نزل من **28.3%** لـ **23.0%** (−25%، NNT 21)، والـ secondary من **20.0%** لـ **16.2%** (−26%، NNT 28)."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="20" class="t-b">Primary end point</text>
            <rect x="10" y="30" width="226" height="22" rx="4" class="fg-dot-bad"/>
            <text x="244" y="46" class="t-sm">28.3% placebo</text>
            <rect x="10" y="58" width="184" height="22" rx="4" class="fg-dot-good"/>
            <text x="202" y="74" class="t-sm">23.0% IPE</text>
            <text x="10" y="100" class="t-sm t-acc">−25% · NNT 21</text>
            <text x="10" y="130" class="t-b">CV death, MI, stroke</text>
