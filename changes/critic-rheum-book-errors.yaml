- kind: improved
  ar_eg: "روماتيزم: ملاحظة تحديث إن الإنترفيرون ألفا مش علاج للتصلب المتعدد (اللي بيتعالج ببيتا) ومبقاش بيستخدم لفيروس سي، ومعها تعريف ILAR للـ extended oligoarthritis."
  en: "Rheum: update notes that interferon α is not an MS drug (MS uses β) and is obsolete for hepatitis C, plus the ILAR definition of extended oligoarthritis."
