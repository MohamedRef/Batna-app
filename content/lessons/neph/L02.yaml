  - id: neph.L02.lesson13
    title: "الأدوية والأعشاب والصبغة"
    hook: "مسكّن من الصيدلية، أعشاب تخسيس، أو صبغة CT: كل واحدة ممكن تكون الضربة الأخيرة."
    minutes: 10
    pages: [59, 62]
    topics: [drugs]
    goals:
      - "تعرف إزاي كل دوا nephrotoxic بيأذي وبديله"
      - "تطبّق الـ sick-day rules وتعرف ليه"
      - "تختار الصبغة الآمنة"
    status: unverified
    steps:
      - kind: explain
        page: 59
        quote: "More susceptible to the nephrotoxic effects of medications"
        title: "كل دوا بيأذي إزاي؟"
        text: |
          الكتاب: مريض الـ CKD **أكتر عرضة** لسمية الأدوية، فوازن الفايدة والضرر. وجدول 32 بيدّي الـ mechanism لكل دوا:

          - **NSAIDs**: بتقلّل الـ GFR عن طريق ==prostaglandin-dependent== kidney blood flow، و AIN، و nephrotic syndrome.
          - **Aminoglycosides**: بتتجمع في خلايا الـ **proximal tubule** وتبوّظ الـ phospholipids، فالخلية تموت (ATN).
          - **Vancomycin**: السبب مش واضح، غالبًا ATN وممكن AIN.
          - **Sulfamethoxazole-trimethoprim**: AIN و ATN وكريستالات، وكمان بيوقف **tubular creatinine secretion** (فالـ creatinine يعلى من غير أذى حقيقي، فاكر ص 28؟).
          - **PPIs**: tubulointerstitial nephritis و AIN.
          - **Warfarin**: glomerular hemorrhage و oxidative stress و vascular calcification.
          - **Lithium**: ==nephrogenic diabetes insipidus== و chronic tubulointerstitial nephropathy.

          التفسير المقبول (مش في الكتاب) للـ "أكتر عرضة": nephrons أقل = كل nephron بياخد جرعة أكبر من الدوا، ومفيش احتياطي.
      - kind: table
        page: 59
        quote: "Table 32: Key examples of common medications with documented nephrotoxicity and, where available, selected non-nephrotoxic alternatives. CKD, chronic kidney disease; GFR, glomerular filtration rate; i.v., intravenous; NSAID, nonsteroidal anti-inflammatory drugs.\n| Nephrotoxic medication | Potential non-nephrotoxic alternatives |\n| Analgesics | |\n| NSAIDs: Nephrotoxic effects include decrease in GFR through reduction in prostaglandin dependent kidney blood flow, allergic interstitial nephritis (AIN), and nephrotic syndrome | Acetaminophen |\n| Antimicrobials | |\n| Aminoglycosides: accumulates in the proximal tubular cells and disrupts phospholipid metabolism, resulting in cell apoptosis and acute tubular necrosis (ATN) | Cephalosporins; Carbapenems |\n| Vancomycin: unclear cause of nephrotoxicity, but likely related to ATN and possible AIN | Linezolid; Daptomycin |\n| Sulfamethoxazole-trimethoprim: AIN, ATN, crystalluria within the distal convoluted tubule and reversible inhibition of the tubular creatinine secretion | Clindamycin + Primaquine; Pentamidine; Atovaquone |\n| Gastrointestinal medications | |\n| Proton pump inhibitors: may result in AKI and CKD due to tubulointerstitial nephritis and AIN | H2-receptor antagonists |\n| Cardiovascular medications | |\n| Warfarin: glomerular hemorrhage, oxidative stress causing kidney tubular damage, and direct effects on kidney vascular calcification by vitamin K–dependent alterations of matrix Gla protein | Non-vitamin K antagonist oral anticoagulants (NOAC) |\n| Other | |\n| Lithium: NDI as well as CKD from chronic tubulointerstitial nephropathy | Aripiprazole; Lamotrigine; Quetiapine; Valproate |"
        title: "الدوا الضار وبديله"
        columns: [Nephrotoxic, Alternative]
        rows:
          - ["NSAIDs", "Acetaminophen"]
          - ["Aminoglycosides", "Cephalosporins, carbapenems"]
          - ["Vancomycin", "Linezolid, daptomycin"]
          - ["PPIs", "H2-receptor antagonists"]
          - ["Warfarin", "NOACs"]
          - ["Lithium", "Aripiprazole, lamotrigine, quetiapine, valproate"]
        hide: [[0, 1], [3, 1], [4, 1]]
      - kind: explain
        page: 59
        quote: "Monitor eGFR, electrolytes, and therapeutic medication levels, when"
        title: "ليه نقيس مستوى الدوا؟"
        text: |
          الكتاب: راقب الـ eGFR والأملاح و**مستوى الدوا** مع الأدوية اللي ليها **narrow therapeutic window** أو آثار جانبية أو nephrotoxicity، وعدّل الجرعة حسب الـ eGFR.

          التفسير المقبول (مش في الكتاب): الأدوية اللي بتطلع من الكلية بتتجمع لما الـ GFR يقل، فنفس الجرعة بتدّي مستوى أعلى. ومع دوا زي الـ vancomycin أو الـ aminoglycosides أو الـ lithium، الفرق بين الجرعة اللي بتعالج واللي بتسمّم صغير. يعني الـ eGFR بيحدد **الجرعة**، والـ ==level== بيأكّد إنك صح.
      - kind: figure
        page: 60
        quote: "Figure 41: Suggested steps in the process of medication review and reconciliation."
        title: "شكل 41 في الكتاب: مراجعة الأدوية"
        image: { file: neph/L02-medication-review.webp, book: true }
        alt: "Book wheel, Figure 41, with 'CKD patient' at the centre and three segments: optimizing the medication impact (green, left), minimizing medication-related problems (blue, right), medication agreement (bottom). Yellow boxes: assessing that the dosage and regimen are correct (top); evaluating whether each medication is necessary; determining whether each medication is the preferred one for its indication; resolving discrepancies between the actual medication list and the medical record (left); reviewing the list for interactions or adverse effects; ensuring that proper monitoring takes place; assessing adherence and causes of nonadherence; obtaining an accurate medication list (right); communication with other physicians (bottom). Outer rings: medication review and medication reconciliation."
        caption: |
          في النص **CKD patient**، وحواليه 3 أقسام، وكل قسم ليه صناديق صفرا:

          - **الأخضر شمال: Optimizing the medication impact**: كل دوا **لازم**؟ هو **الأفضل** لدواعيه؟ والقايمة اللي المريض بياخدها **مطابقة** للملف؟
          - **الأزرق يمين: Minimizing medication-related problems**: راجع الـ **interactions** والأعراض الجانبية، اتأكد إن الـ **monitoring** بيحصل، وشوف الـ **adherence**، وخد **قايمة أدوية دقيقة**.
          - **تحت: Medication agreement** و **Communication with other physicians**.
          - **فوق**: الجرعة والنظام **صح** (لازم تتظبط على الـ eGFR).
          - **الحلقات برة**: **Medication review** و **Medication reconciliation**.

          يعني مريض الـ CKD محتاج ==مراجعة أدوية منظمة كل زيارة==، مش بس تظبيط جرعة.
      - kind: check
        page: 59
        quote: "Table 32: Key examples of common medications with documented nephrotoxicity and, where available, selected non-nephrotoxic alternatives. CKD, chronic kidney disease; GFR, glomerular filtration rate; i.v., intravenous; NSAID, nonsteroidal anti-inflammatory drugs.\n| Nephrotoxic medication | Potential non-nephrotoxic alternatives |\n| Analgesics | |\n| NSAIDs: Nephrotoxic effects include decrease in GFR through reduction in prostaglandin dependent kidney blood flow, allergic interstitial nephritis (AIN), and nephrotic syndrome | Acetaminophen |\n| Antimicrobials | |\n| Aminoglycosides: accumulates in the proximal tubular cells and disrupts phospholipid metabolism, resulting in cell apoptosis and acute tubular necrosis (ATN) | Cephalosporins; Carbapenems |\n| Vancomycin: unclear cause of nephrotoxicity, but likely related to ATN and possible AIN | Linezolid; Daptomycin |\n| Sulfamethoxazole-trimethoprim: AIN, ATN, crystalluria within the distal convoluted tubule and reversible inhibition of the tubular creatinine secretion | Clindamycin + Primaquine; Pentamidine; Atovaquone |\n| Gastrointestinal medications | |\n| Proton pump inhibitors: may result in AKI and CKD due to tubulointerstitial nephritis and AIN | H2-receptor antagonists |\n| Cardiovascular medications | |\n| Warfarin: glomerular hemorrhage, oxidative stress causing kidney tubular damage, and direct effects on kidney vascular calcification by vitamin K–dependent alterations of matrix Gla protein | Non-vitamin K antagonist oral anticoagulants (NOAC) |\n| Other | |\n| Lithium: NDI as well as CKD from chronic tubulointerstitial nephropathy | Aripiprazole; Lamotrigine; Quetiapine; Valproate |"
        question: "A CKD G3 patient on omeprazole for years has slowly rising creatinine and sterile pyuria. Best change?"
        options:
          - "Switch to an H2-receptor antagonist"
          - "Double the omeprazole"
          - "Add ibuprofen for the pain"
          - "Start lithium"
        answer: 0
        why:
          - "صح: الـ proton pump inhibitor (PPI) ممكن يعمل AIN/tubulointerstitial nephritis (TIN)، وبديله في الجدول H2-receptor antagonist (H2RA)."
          - "هيزوّد المشكلة."
          - "non-steroidal anti-inflammatory drugs (NSAID) = nephrotoxic."
          - "Lithium = nephrotoxic."
      - kind: explain
        page: 60
        quote: "Selected herbal remedies and dietary supplements with evidence of potential"
        title: "الأعشاب مش دايمًا آمنة"
        text: |
          Figure 40 في ص 60 بتعدّ **herbal remedies و dietary supplements** ليها دليل nephrotoxicity، منها: **licorice**، **mushrooms** (Amanita و Cortinarius)، و**Chinese herbs** من نوع **Aristolochia**. و Figure 41 بتوري خطوات الـ **medication review and reconciliation**.

          التفسير المقبول (مش في الكتاب):

          - الـ ==Aristolochia== فيها **aristolochic acid**، اللي شفناه في أسباب الـ tubulointerstitial disease في ص 34.
          - الـ **licorice** بيشتغل زي الـ aldosterone (فاكر L01؟): hypokalemia وضغط.
          - المريض غالبًا مش بيعتبر الأعشاب "دوا"، فمش هيقولك عليها غير لو سألته.

          علشان كده الـ medication review لازم يسأل عن **كل** حاجة بياخدها، مش اللي في الروشتة بس.
