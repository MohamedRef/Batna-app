          ليه الأجهزة دي بالذات (neuromuscular و CV و GIT)؟ التفسير المقبول (مش في الكتاب): التلاتة شغلهم عضلات بتنقبض بالكهربا، والكهربا دي محتاجة K. عشان كده الأمعاء كمان بتكسل (ileus).
      - kind: mnemonic
        page: 207
        quote: "Discussion\n  1. The clinical features of hypokalemia may vary with involvement of neuromuscular, CV & GIT systems, the most common manifestation being mild weakness of lower extremities & easy fatigability.\n  2. Patients with more severe hypokalemia may complain of marked weakness of skeletal muscles & in extreme cases, total paralysis involving respiratory, cranial & bulbar muscles has been reported with fatal outcome.\n  3. Deaths due to cardiac arrhythmia can also occur.\n  4. The coexistence of hypokalemia with metabolic acidosis is encountered in very few conditions, including proximal & distal renal tubular acidosis, DKA, amphotericin toxicity & acetazolamide overdose."
