      - kind: reveal
        page: 378
        quote: "To achieve a predialysis blood urea of less than 50mg/dL, 4-6 sessions of 4-6 hours of dialysis per week are usually needed. Frequent dialysis is aimed at maintaining adequate uteroplacental flow without compromising on net fluid removal. Biocompatible and single-use dialyzers are recommended to prevent fetal toxicity secondary to reuse agents such as formaldehyde and ethylene oxide. A biocompatible and single-use dialyzer is preferred. Respiratory alkalosis with compensated metabolic acidosis is usually seen during pregnancy. Hence, dialyzing a pregnant woman would mandate low bicarbonate dialysate to avoid alkalemia. Although the data are limited, it is recommended to use a dialysate bath with 25-30mmol/L bicarbonate during pregnancy. To minimize"
        prompt: "ليه الحامل بتاخد dialysate bicarbonate واطي (25-30)؟"
        answer: "الحمل أصلًا فيه **respiratory alkalosis**. لو دّيتها bicarbonate عادي مع جلسات يومية هتعمل ==alkalemia==. ونفس المنطق: جلسات كتير = خطر **hypokalemia و hypocalcemia و hypophosphatemia**، فالـ K 3-3.5 والـ Ca 2.5."
      - kind: check
        page: 379
        quote: "Ultrafiltration during dialysis in a pregnant woman can be challenging. Fetal weight gain after the first trimester is mostly constant at 0.3-0.5kg per week. Therefore, as long as the patient is euvolemic, the dry weight can be increased by 400 gm per week to account for the growing fetus weight of 500 gm per week. Slow continuous ultrafiltration can be considered for excessive weight gain or refractory fluid overload states during pregnancy. (81) The suggested calorie intake during pregnancy in women receiving hemodialysis is 35kcal/kg/day. Protein intake of 1.5-1.8 gm/kg/day is recommended to account for adequate nitrogen balance and development of the fetus. Water-soluble vitamins should be continued throughout the pregnancy (Fig 4). (82) Nocturnal hemodialysis in pregnant women is safe, and women who conceived while utilizing nocturnal hemodialysis as their kidney replacement therapy can continue with the modality. Women receiving nocturnal hemodialysis tend to have decreased total peripheral vascular resistance, which decreases the incidence of fluctuating BP or volume overload. Nocturnal hemodialysis prescriptions during pregnancy usually require 7-8-hour sessions, 5-7 days a week. Women performing nocturnal hemodialysis might require phosphate supplementation in the dialysate to avoid hypophosphatemia because of prolonged dialysis sessions. (83)"
        question: "At 24 weeks, a euvolemic woman on HD: how should her dry weight be set?"
        options:
          - "Raise it about 400 g each week"
          - "Keep it fixed from conception"
          - "Lower it 0.5 kg each week"
          - "Raise it 2 kg each week"
        answer: 0
        why:
          - "صح: الجنين بيزيد 0.3-0.5 kg في الأسبوع، فالـ dry weight يزيد حوالي 400 g (Fig 4 بتقول لحد 0.5 kg)."
          - "كده هتشيل سوايل الجنين وتعمل hypovolemia."
          - "بالعكس، الوزن بيزيد."
          - "كتير جدًا؛ هتعمل fluid overload."
      - kind: aside
        tone: joke
        page: 378
        quote: "Hemodialysis During Pregnancy Intensive hemodialysis is recommended during pregnancy because it is associated with better fetal and maternal outcomes. Up to 36 hours of dialysis weekly is recommended for women, targeting predialysis serum blood urea nitrogen of<50mg/dL. In a series of 344 pregnancies, Okundaye et al(79) observed that infants born to women who had>20 hours/wk of dialysis had prolonged gestational age and a higher birth weight. Intensive hemodialysis is associated with improved pregnancy outcomes with a lower incidence of prematurity, a higher incidence of live birth rate, higher birth weight, and lower neonatal mortality rates.(78)"
        text: |
          36 ساعة غسيل في الأسبوع؟ دي مش جلسات، دي ==إقامة==. بس كل ساعة زيادة فوق الـ 20 بتزوّد وزن البيبي وعمر الحمل.
      - kind: explain
        page: 380
        title: "الـ PD: مميزات بس الرحم بيزاحم"
        quote: "Peritoneal Dialysis During Pregnancy Although pregnancy is rare in women who are receiving peritoneal dialysis because of the possible effects of hypertonic dialysate on the transit of the ovum to the uterus, women can continue pregnancy on peritoneal dialysis with modifications in peritoneal dialysis prescriptions. The advantages of peritoneal dialysis during pregnancy are controlled ultrafiltration, better hemodynamic stability, a lesser incidence of anemia, better control of BP, and avoidance of anticoagulation."
        text: |
          مميزات الـ peritoneal dialysis (PD): ultrafiltration مضبوط، hemodynamics أهدى، anemia أقل، ضغط أحسن، و **مفيش anticoagulation**.

          لكن الرحم بيكبر فالـ ==effective surface area== بتقل (الغشاء نفسه سليم). والـ residual urine **>500 mL** = نتيجة أحسن.
      - kind: mnemonic
        page: 381
        quote: "Use tidal peritoneal dialysis, which leaves 15% of the dwell volume in situ while draining, to reduce drain pain and gastroesophageal reflux."
        word: "SCTDL"
        parts:
          - { key: "S", text: "Smaller dwell volumes, more frequent exchanges" }
          - { key: "C", text: "Cycler overnight + manual day exchanges (3rd trimester)" }
          - { key: "T", text: "Tidal PD: leave 15% in to cut drain pain and reflux" }
          - { key: "D", text: "Dextrose 4.25%: minimize it" }
          - { key: "L", text: "Lateral decubitus while draining" }
        hook: "**S**mall **C**ycles **T**ake **D**elicate **L**adies: كل حاجة في الـ PD بتصغر وتكتر مع الرحم."
      - kind: explain
        page: 382
        title: "مضاعفات الـ PD"
        quote: "and traumatic uterine rupture from peritoneal catheter. Polyhydramnios (excess amniotic fluid), though rare among women receiving peritoneal dialysis, may occur if maternal urea levels are high enough to cause an osmotic diuresis in the fetus causing increased urine production by the fetus. Monitoring for electrolyte derangements such as hypokalemia and hypophosphatemia is essential to prevent arrhythmias and other fetal complications, and supplementation is warranted accordingly. (88)"
        text: |
          Kt/V **2.2-2.4** (حوالي 20 لتر في اليوم)، و **25 kcal/kg**.

          المضاعفات: peritonitis، exit-site infection، catheter displacement، hemoperitoneum، drain pain، reflux، ونادرًا uterine rupture.

          و ==polyhydramnios==: اليوريا العالية عند الأم = **osmotic diuresis** عند الجنين. راقب الـ K والـ phosphate.
