  - id: neph.L03.009
    kind: mcq
    topic: definition
    stem: A 55-year-old man on maintenance hemodialysis for 6 years develops progressive breathlessness. Echo shows left ventricular hypertrophy with an ejection fraction of 35%. No acute illness preceded it. Which cardiorenal type fits best?
    options:
      - Type 1
      - Type 2
      - Type 3
      - Type 4
      - Type 5
    answer: 3
    why:
      - Type 1 is acute heart failure causing AKI; here the kidney disease came first.
      - Type 2 is chronic heart failure causing renal impairment; the order is reversed.
      - Type 3 is AKI causing acute cardiac dysfunction; his kidney disease is chronic.
      - "Correct: CKD causing myocardial remodeling and CKD-associated cardiomyopathy is type 4, chronic renocardiac (p68)."
      - Type 5 needs a systemic disease such as sepsis, diabetes or amyloidosis hitting both organs.
    src: { page: 68, quote: "Table 1: Classification of Cardiorenal Syndrome with Causes of Morbidity\n| Cardiorenal types | Characteristics | Causes of morbidity |\n| Type 1 (acute cardiorenal) | Acute cardiac impairment leading to acute kidney injury (AKI) | Cardiogenic shock and AKI, acute decompensated heart failure (ADHF) resulting in AKI |\n| Type 2 (chronic cardiorenal) | Chronic cardiac impairment leading to renal impairment | Chronic heart failure |\n| Type 3 (acute renocardiac) | AKI leading to cardiac impairment | Heart failure in the setting of AKI from volume overload, inflammatory surge and accompanying metabolic disturbances |\n| Type 4 (chronic renocardiac) | Chronic kidney disease (CKD) leading to cardiac impairment | Myocardial remodeling and heart failure from CKD-associated cardiomyopathy |\n| Type 5 (secondary cardiorenal) | Systemic condition leading to both cardiac and renal impairment | Diabetes, amyloidosis and sepsis |" }
    status: unverified
  - id: neph.L03.010
    kind: mcq
    topic: definition
    stem: A 30-year-old woman with septic shock from pneumonia develops oliguric AKI and, on the same day, a new reduction of left ventricular function on echo. Which cardiorenal type is this?
    options:
      - Type 1
      - Type 3
      - Type 4
      - Type 5
    answer: 3
    why:
      - Type 1 starts with the heart; here sepsis hit both organs together.
      - Type 3 starts with AKI and then the heart fails; here neither organ is primary.
      - Type 4 needs chronic kidney disease.
      - "Correct: a systemic condition (sepsis) damaging both heart and kidney is type 5, secondary cardiorenal (p68)."
    src: { page: 68, quote: "Table 1: Classification of Cardiorenal Syndrome with Causes of Morbidity\n| Cardiorenal types | Characteristics | Causes of morbidity |\n| Type 1 (acute cardiorenal) | Acute cardiac impairment leading to acute kidney injury (AKI) | Cardiogenic shock and AKI, acute decompensated heart failure (ADHF) resulting in AKI |\n| Type 2 (chronic cardiorenal) | Chronic cardiac impairment leading to renal impairment | Chronic heart failure |\n| Type 3 (acute renocardiac) | AKI leading to cardiac impairment | Heart failure in the setting of AKI from volume overload, inflammatory surge and accompanying metabolic disturbances |\n| Type 4 (chronic renocardiac) | Chronic kidney disease (CKD) leading to cardiac impairment | Myocardial remodeling and heart failure from CKD-associated cardiomyopathy |\n| Type 5 (secondary cardiorenal) | Systemic condition leading to both cardiac and renal impairment | Diabetes, amyloidosis and sepsis |" }
    status: unverified
  - id: neph.L03.011
    kind: mcq
    topic: definition
    stem: A 62-year-old man is admitted with an anterior MI and cardiogenic shock. Over 48 hours his creatinine rises from 1.0 to 2.4 mg/dL. Which cardiorenal type is this?
    options:
      - Type 1 (acute cardiorenal)
      - Type 2 (chronic cardiorenal)
      - Type 3 (acute renocardiac)
      - Type 5 (secondary)
    answer: 0
    why:
      - "Correct: acute cardiac impairment (cardiogenic shock) leading to AKI is type 1 (p68)."
      - Type 2 needs chronic heart failure and chronic renal impairment.
      - In type 3 the AKI comes first and the heart follows.
      - Type 5 needs a systemic disease that hits both organs; MI is a primary cardiac event.
    src: { page: 68, quote: "Table 1: Classification of Cardiorenal Syndrome with Causes of Morbidity\n| Cardiorenal types | Characteristics | Causes of morbidity |\n| Type 1 (acute cardiorenal) | Acute cardiac impairment leading to acute kidney injury (AKI) | Cardiogenic shock and AKI, acute decompensated heart failure (ADHF) resulting in AKI |\n| Type 2 (chronic cardiorenal) | Chronic cardiac impairment leading to renal impairment | Chronic heart failure |\n| Type 3 (acute renocardiac) | AKI leading to cardiac impairment | Heart failure in the setting of AKI from volume overload, inflammatory surge and accompanying metabolic disturbances |\n| Type 4 (chronic renocardiac) | Chronic kidney disease (CKD) leading to cardiac impairment | Myocardial remodeling and heart failure from CKD-associated cardiomyopathy |\n| Type 5 (secondary cardiorenal) | Systemic condition leading to both cardiac and renal impairment | Diabetes, amyloidosis and sepsis |" }
    status: unverified
  # ---------- p69: Figure 1 and CRS-1 mechanism ----------
  - id: neph.L03.012
    kind: card
    topic: pathogenesis
    front: Main trigger of kidney damage in CRS type 1 (Figure 1)?
    back: Altered renal perfusion, particularly when congestive heart failure is present.
    src: { page: 69, quote: "Figure 1: Classification and pathogenesis of Cardiorenal Syndrome\n| Type | Primary disease | Pathogenesis | Secondary disease |\n| Type 1: Acute CRS | Heart | Alteration of renal perfusion is the main trigger (in particular when congestive heart failure is present) | Kidney |\n| Type 2: Chronic CRS | Heart | Renal fibrosis is particularly important in type 2. Also to be considered drug induced renal toxicity and VAD induced renal effects | Kidney |\n| Type 3: Acute RCS | Kidney | Salt and water, neuro-hormonal and uremia induced dysregulations are the most important aspects | Heart |\n| Type 4: Chronic RCS | Kidney | Hypertension, CKD induced myopathy, chronic hemodialysis and fluids shifts may be in cause | Heart |\n| Type 5: Secondary CRS | Systemic condition | Common pathogenetic patterns (i.e. auto-immunity, micro-circulatory dysfunction, cytokine release) | Heart and kidney |" }
    status: unverified
    tags: [high-yield]
