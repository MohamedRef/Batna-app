          - الـ **polycystins** مش في الكلية بس، دي موجودة كمان في **جدار الأوعية** (vascular smooth muscle)، فالشريان نفسه أضعف.
          - العيلة اللي فيها aneurysm غالبًا شايلة شكل من الجين أو عوامل تانية بتضعف الأوعية أكتر، فالخطر يتضاعف تقريبًا 3 مرات.
