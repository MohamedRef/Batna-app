lessons:
  # ------------------------------------------------------------------
  - id: git.L05.lesson1
    title: "يعني إيه polyp؟ والتلات بوليبات بتوع المعدة"
    hook: "أي حاجة طالعة من الحيطة اسمها polyp. في المعدة فيه تلاتة مشهورين، وواحد بس منهم بيقلقك بجد."
    minutes: 7
    pages: [185, 186]
    topics: [definition, gastric]
    goals:
      - "تعرّف الـ polyp وتفرّق sessile من pedunculated"
      - "تفهم إزاي الـ stalk بيتكوّن"
      - "تعرف التلات gastric polyps بالـ histology والخطر"
    status: unverified
    steps:
      - kind: explain
        page: 185
        quote: "A polyp is any lesion that is elevated above the mucosal surface of the bowel."
        title: "التعريف"
        text: |
          الـ ==polyp== هو **any lesion elevated above the mucosal surface**. يعني أي حاجة طالعة فوق مستوى الـ mucosa، مهما كان نوعها.

          - أكتر مكان: الـ **colon**، وممكن في المريء والمعدة والأمعاء الدقيقة.
          - من غير stalk = **sessile**. بـ stalk = **pedunculated**.
      - kind: figure
        page: 185
        quote: "Polyps without stalks are referred to as sessile while those with stalks are termed pedunculated."
        title: "Sessile ولا pedunculated"
        alt: "Two drawings of the bowel wall. Left: a dome-shaped sessile polyp sitting flat on the mucosa. Right: a pedunculated polyp, a round head on a stalk, with small arrows showing traction pulling the head into the lumen."
        caption: "الـ stalk بيتعمل من نمو الخلايا اللي جنب البوليب مع شدّ حركة الأمعاء عليه (traction)."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="G05a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <rect x="5" y="160" width="150" height="24" class="fg-box"/>
            <path d="M40 160c0-50 70-50 70 0z" class="fg-acc"/>
            <text x="40" y="208" class="t-b">Sessile</text>
            <text x="30" y="30" class="t-sm t-mut">no stalk</text>
            <rect x="175" y="160" width="150" height="24" class="fg-box"/>
            <rect x="243" y="100" width="14" height="60" class="fg-acc"/>
            <circle cx="250" cy="80" r="30" class="fg-acc"/>
            <path d="M250 40V18" class="fg-arrow-acc" marker-end="url(#G05a)"/>
            <text x="262" y="28" class="t-sm t-acc">traction</text>
            <text x="200" y="208" class="t-b">Pedunculated</text>
          </svg>
      - kind: figure
        page: 185
        title: "نفس الكلام في المنظار"
        image: { file: git/L05-polyp-shapes.webp, book: true }
        alt: "Book colonoscopy pictures labelled normal colon, sessile polyp (a flat-based raised lesion) and pedunculated polyp (a rounded head on a stalk)."
        caption: |
          **Normal colon**، وبعدين ==sessile polyp== قاعدته عريضة لازقة في الحيطة، وبعدين **pedunculated polyp** راسه على عنق.
      - kind: reveal
        page: 185
        quote: "Proliferation of cells adjacent to the polyp and the effects of traction on the"
        prompt: "ليه بعض البوليبات بيبقى ليها stalk وبعضها لأ؟"
        answer: |
          الكتاب: الـ ==proliferation of cells adjacent to the polyp== مع تأثير الـ **traction** على الحتة البارزة في الـ lumen، الاتنين مع بعض ممكن يعملوا **stalk**.

          التفسير المقبول (مش في الكتاب): تخيّل البوليب كتلة صغيرة لازقة في الحيطة. كل موجة peristalsis والبراز اللي بيعدّي بيشدّوها لقدام، فالـ mucosa اللي تحتها بتتمط مع الوقت وتبقى رقبة. علشان كده الـ stalk أشهر في القولون (حركة وبراز) من المريء. والفرق ده عملي جدًا: الـ pedunculated بتمسكه من الرقبة بالـ snare وتشيله كله، والـ sessile قاعدته على الحيطة فشيله أصعب وأخطر.
      - kind: explain
        page: 186
        quote: "Gastric polyps are distinct intraluminal projections of mucosal or submucosal"
        title: "الـ gastric polyps: نسيج طالع، وممكن يقلب"
        text: |
          الكتاب: الـ gastric polyps ==distinct intraluminal projections== من الـ mucosa أو الـ submucosa. هي **proliferative growth** ممكن يكون فيه **potential for malignant transformation**، وليها subsets كتير.

          التفسير المقبول (مش في الكتاب): كلمة «mucosal or submucosal» مهمة: مش كل حاجة طالعة في المعدة جاية من البطانة. اللي من الـ mucosa بنشوف سطحه متغير، واللي من الـ submucosa (زي الـ GIST أو الـ lipoma) بيبان كتلة مغطية بـ mucosa طبيعية، فالـ biopsy السطحية ممكن تطلع سليمة. يعني شكل السطح بيلمّح لمكان البوليب في الحيطة قبل النتيجة.
      - kind: table
        page: 186
        quote: "The most commonly seen and described are the triad of gastric hyperplastic polyps (GHP) characterized by pronounced foveolar hyperplasia, fundic gland polyps (FGP) characterized by dilated and irregularly budded fundic glands predominantly lined by parietal cells with smaller proportion of chief cells, and adenomatous polyps characterized by low-grade glandular dysplasia."
        title: "التلات gastric polyps الأشهر"
        columns: ["Polyp", "Histology"]
        rows:
          - ["Hyperplastic (GHP)", "Pronounced foveolar hyperplasia"]
          - ["Fundic gland (FGP)", "Dilated, budded fundic glands; mostly parietal cells"]
          - ["Adenomatous", "Low-grade glandular dysplasia"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: figure
        page: 186
        title: "بوليب في المعدة"
        image: { file: git/L05-gastric-polyp.webp, book: true }
        alt: "Book endoscopy picture of a small, smooth, rounded polyp on the gastric wall, with the endoscope visible at the top."
        caption: |
          **Intraluminal projection** صغيرة وناعمة من الـ mucosa. الشكل لوحده ==مش بيقول النوع==: الـ GHP والـ FGP والـ adenoma بيتفرقوا بالـ biopsy.
      - kind: check
        page: 186
        quote: "adenomatous polyps characterized by low-grade glandular dysplasia."
        question: "Which member of the common gastric polyp triad is defined by dysplasia?"
        options: ["Adenomatous polyp", "Gastric hyperplastic polyp", "Fundic gland polyp", "None of them"]
        answer: 0
        why:
          - "صح: الكتاب: adenomatous polyps characterized by low-grade glandular dysplasia. والـ dysplasia هي أول خطوة واضحة في الطريق للسرطان."
          - "الـ GHP تعريفه pronounced foveolar hyperplasia، يعني خلايا زيادة بس شكلها طبيعي."
          - "الـ FGP تعريفه dilated, budded fundic glands مبطنة غالبًا بـ parietal cells."
          - "واحد منهم معرّف بالـ dysplasia: الـ adenoma."
      - kind: reveal
        page: 186
        quote: "polyps (FGP) characterized by dilated and irregularly budded fundic glands"
        prompt: "يعني إيه foveolar hyperplasia، ويعني إيه fundic glands مبطنة بـ parietal cells؟"
        answer: |
          الكتاب: الـ **GHP** فيه ==pronounced foveolar hyperplasia==، والـ **FGP** فيه **dilated and irregularly budded fundic glands** مبطنة أساسًا بـ **parietal cells** ونسبة أقل من الـ chief cells.

          التفسير المقبول (مش في الكتاب): الـ foveolae هي الحُفر اللي على سطح المعدة واللي بتفرز mucus. لما تتضخم بيطلع بوليب من «الطبقة السطحية» نفسها، وده غالبًا بييجي بعد التهاب مزمن (زي H. pylori). أما الـ FGP فهو غدد الـ fundus نفسها اتوسعت، والخلايا اللي فيها طبيعية (parietal و chief)، علشان كده هو بيظهر في الـ fundus والـ body بالذات. يعني الاسم نفسه بيقولك جاي من أنهي جزء ومن أنهي خلية.
      - kind: try
        items: [git.L05.001, git.L05.003, git.L05.005, git.L05.006, git.L05.007]
    recap:
      - "Polyp = أي lesion طالع فوق الـ mucosa؛ أكتر في الـ colon، وممكن في المريء والمعدة والـ small intestine."
      - "Sessile من غير stalk، pedunculated بـ stalk؛ الـ stalk من proliferation الخلايا اللي جنبه + الـ traction."
      - "Gastric triad: GHP (foveolar hyperplasia)، FGP (fundic glands و parietal cells)، adenomatous (low-grade dysplasia)."
    practice: [git.L05.001, git.L05.002, git.L05.003, git.L05.004, git.L05.005, git.L05.006, git.L05.007]
  # ------------------------------------------------------------------
  - id: git.L05.lesson5
    title: "تقسيم بوليبات القولون، والـ adenoma"
    hook: "جدول واحد بيقسّم كل بوليبات القولون. وبوليب ملمسه زي التوت، هو اللي بيقلب سرطان."
    minutes: 7
    pages: [186, 187]
    topics: [classification, adenoma]
    goals:
      - "تصنّف الـ colorectal polyps لـ neoplastic و non-neoplastic"
      - "تعرف الـ adenoma ومصدره وشكله"
      - "تقسّم الـ adenoma بنسبة الـ villous وتعرف ليه ده مهم"
    status: unverified
    steps:
      - kind: sort
        page: 186
        quote: "Colorectal polyps\n| Neoplastic: benign | Neoplastic: malignant | Non-neoplastic |\n|---|---|---|\n| Adenoma | Adenocarcinoma | Hyperplastic polyps |\n| Serrated polyps | Carcinoid | Inflammatory polyps |\n| Carcinoid | Stromal | Hamartomas |\n| Granular cell tumour | Lymphoid | Lipoma |\n|  |  | Lieomyoma |"
        prompt: "صنّف الـ colorectal polyps زي جدول الكتاب:"
        bins: ["Neoplastic benign", "Neoplastic malignant", "Non-neoplastic"]
        cards:
          - { text: "Adenoma", bin: 0 }
          - { text: "Serrated polyps", bin: 0 }
          - { text: "Granular cell tumour", bin: 0 }
          - { text: "Adenocarcinoma", bin: 1 }
          - { text: "Stromal", bin: 1 }
          - { text: "Lymphoid", bin: 1 }
          - { text: "Hyperplastic polyp", bin: 2 }
          - { text: "Inflammatory polyp", bin: 2 }
          - { text: "Hamartoma", bin: 2 }
          - { text: "Lipoma", bin: 2 }
        why: "ده تقسيم جدول الكتاب في صفحة 186. الـ carcinoid مكتوب في الـ benign والـ malignant الاتنين، والـ lipoma والـ leiomyoma تحت non-neoplastic."
      - kind: explain
        page: 186
        quote: "Colorectal polyps"
        title: "ليه التقسيم ده هو أول سؤال؟"
        text: |
          جدول الكتاب بيقسّم الـ colorectal polyps تلات مجموعات: **neoplastic benign** (adenoma، serrated، carcinoid، lipoma، granular cell tumour)، **neoplastic malignant** (adenocarcinoma، carcinoid، stromal، lymphoid، leiomyoma)، و **non-neoplastic** (==hyperplastic، inflammatory، hamartomas==).

          التفسير المقبول (مش في الكتاب): السؤال «neoplastic ولا لأ» هو اللي بيحدد كل حاجة بعده: الـ neoplastic معناه خلايا اتغيّرت جينيًا وبتنقسم لوحدها، فلازم تتشال وصاحبها يتابع. الـ non-neoplastic رد فعل للخلية (التهاب، أو نسيج متلخبط في تكوينه)، وغالبًا مالوش نفس الخطر. ولاحظ إن الـ carcinoid موجود في العمودين، لأن سلوكه بيعتمد على حجمه ومكانه.
      - kind: explain
        page: 187
        quote: "a- Adenomatous polyps Adenomatous polyps are the most common colonic polyps and they carry malignant potential."
        title: "الـ adenoma"
        text: |
          الـ ==adenomatous polyps== هي **the most common colonic polyps**، وعندها **malignant potential**.

          - بتطلع من الـ mucus-secreting epithelial cells، وتعريفها وجود **epithelial dysplasia**.
          - حجمها من 0.3 لـ 10 cm، وملمسها زي **velvet** أو **raspberry**.

          التفسير المقبول (مش في الكتاب): ليه الـ dysplasia هي التعريف؟ لأنها أول تغيير تشوفه تحت الميكروسكوب يقول إن الخلية خرجت عن النظام (nucleus كبير، ترتيب متلخبط)، وده اللي بيفرّق الـ adenoma عن أي بوليب «رد فعل».
      - kind: reveal
        page: 187
        quote: "resembling velvet or a raspberry, due to the abnormal epithelial growth pattern."
        prompt: "ليه الـ adenoma ملمسه زي القطيفة أو التوت؟"
        answer: |
          الكتاب: الـ adenoma من **0.3 لـ 10 cm**، وملمسه زي ==velvet or a raspberry== بسبب **abnormal epithelial growth pattern**.

          التفسير المقبول (مش في الكتاب): الـ mucosa الطبيعية سطحها أملس ومنتظم. في الـ adenoma الغدد بتتكاثر بشكل متلخبط، فالسطح بيتكسّر لحبيبات صغيرة (التوت) أو خيوط قصيرة (القطيفة)، وكل ما الـ villous يزيد الشكل يبقى أقرب للقطيفة. وده اللي الـ NBI بيستغله بعدين: البصّة على شكل السطح بتلمّح للتشخيص قبل الـ biopsy.
      - kind: figure
        page: 187
        quote: "Tubular adenomas (0-25% villous tissue) Tubulovillous adenomas (25-75% villous tissue) Villous adenoma (75-100% villous tissue)"
        title: "المسطرة: كام في المية villous؟"
        alt: "A horizontal ruler from 0 to 100 percent villous tissue, split at 25 and 75. 0 to 25 is tubular, 25 to 75 tubulovillous, 75 to 100 villous. An arrow under it says cancer risk rises to the right."
        caption: "كل ما الـ villous يزيد، الخطر يزيد (المحاضرة 4: tubulovillous 20%، villous 40%)."
        svg: |
          <svg viewBox="0 0 330 170" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="G05b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="15" y="40" width="75" height="40" class="fg-good"/>
            <rect x="90" y="40" width="150" height="40" class="fg-acc"/>
            <rect x="240" y="40" width="75" height="40" class="fg-bad"/>
            <text x="22" y="65" class="t-sm t-b">Tubular</text>
            <text x="110" y="65" class="t-sm t-b">Tubulovillous</text>
            <text x="250" y="65" class="t-sm t-b">Villous</text>
            <text x="10" y="100" class="t-sm">0</text>
            <text x="80" y="100" class="t-sm">25%</text>
            <text x="230" y="100" class="t-sm">75%</text>
            <text x="295" y="100" class="t-sm">100%</text>
            <text x="15" y="28" class="t-sm t-mut">villous tissue</text>
            <path d="M20 130H300" class="fg-arrow-bad" marker-end="url(#G05b)"/>
            <text x="90" y="155" class="t-sm t-bad">cancer risk rises</text>
          </svg>
      - kind: figure
        page: 187
        title: "شكل الـ adenoma"
        image: { file: git/L05-adenomas.webp, book: true }
        alt: "Three book colonoscopy pictures of adenomas: a large reddish lobulated sessile lesion, a smooth polyp hanging between folds, and a broad raised lesion around the lumen."
        caption: |
          تلات adenomas من الكتاب: أحجام وأشكال مختلفة، من بوليب صغير لـ lesion كبيرة عريضة.

          لاحظ الـ surface **المحبّب** زي ==velvet أو raspberry==، زي ما الكتاب بيوصفها.
      - kind: check
        page: 187
        quote: "Tubulovillous adenomas (25-75% villous tissue)"
        question: "An adenoma with 60% villous tissue is:"
        options: ["Tubulovillous", "Tubular", "Villous", "Serrated"]
        answer: 0
        why:
          - "صح: من 25 لـ 75%."
          - "Tubular لحد 25% بس."
          - "Villous من 75% لفوق."
          - "الـ serrated بيتعرف بشكل الـ crypt (sawtooth) مش بنسبة الـ villous."
      - kind: explain
        page: 187
        quote: "Adenomas can be classified based on their glandular architecture:"
        title: "ليه نسبة الـ villous بتفرق؟"
        text: |
          الكتاب بيقسّم الـ adenoma بالـ ==glandular architecture==:
          - **Tubular**: 0-25% villous tissue.
          - **Tubulovillous**: 25-75%.
          - **Villous**: 75-100%.

          التفسير المقبول (مش في الكتاب): الـ tubular غدد أنبوبية قاعدة جوه الـ mucosa زي الطبيعي تقريبًا. الـ villous أصابع طويلة طالعة لبرّه، يعني سطح أكبر وخلايا أكتر بتنقسم، وفرص mutation أكتر. علشان كده الـ villous هو الأخطر، وأشهر في الـ rectum وغالبًا sessile فشيله أصعب. والتقسيم بالنسبة بيخلّي اتنين pathologists يدّوا نفس الاسم لنفس البوليب.
      - kind: aside
        tone: analogy
        page: 187
        quote: "Typical adenomas range from 0.3 to 10 cm in diameter having a texture resembling velvet or a raspberry, due to the abnormal epithelial growth pattern."
        text: "الـ adenoma ملمسه زي القطيفة أو التوت (velvet or raspberry). لو شفته في المنظار هتفتكر الفاكهة."
      - kind: try
        items: [git.L05.008, git.L05.009, git.L05.010, git.L05.012, git.L05.069]
    recap:
      - "Colorectal polyps: neoplastic benign (adenoma، serrated)، neoplastic malignant (adenocarcinoma)، non-neoplastic (hyperplastic، inflammatory، hamartoma)."
      - "Adenoma: أشهر colonic polyp، من الـ mucus-secreting cells، تعريفه dysplasia، 0.3-10 cm، velvet أو raspberry."
      - "Tubular 0-25% villous، tubulovillous 25-75%، villous 75-100%؛ كل ما الـ villous يزيد الخطر يزيد."
    practice: [git.L05.008, git.L05.009, git.L05.010, git.L05.011, git.L05.012, git.L05.069]
  # ------------------------------------------------------------------
  - id: git.L05.lesson2
    title: "الـ serrated: الطريق التالت للسرطان"
    hook: "تلت سرطانات القولون مش جاية من الـ adenoma الكلاسيكي. جاية من بوليب شكل سنانه منشار."
    minutes: 8
    pages: [187, 189]
    topics: [serrated]
    goals:
      - "تعرف يعني إيه serrated وأهميته"
      - "تفرّق التلات طرق الجينية للـ CRC"
      - "تعرف تقسيم الـ WHO والـ hyperplastic polyp"
    status: unverified
    steps:
      - kind: explain
        page: 187
        quote: "Serrated polyp is a general term for any polyp that shows a serrated (sawtooth or stellate) appearance of the crypt epithelium."
        title: "يعني إيه serrated؟"
        text: |
          **Serrated** = الـ crypt epithelium شكله ==sawtooth== أو stellate، زي سنان المنشار.

          وأهميته إنه precursor لمجموعة سرطانات:

          - فيها **hypermethylation**.
          - بتطلع أساسًا في الـ **proximal colon**.
          - حوالي **one-third (30%)** من كل الـ colorectal cancers (CRCs).

          التفسير المقبول (مش في الكتاب): ليه الشكل ده؟ لأن الخلايا في الـ crypt بتتراكم ومش بتقع في وقتها الطبيعي (apoptosis أقل)، فبتتزنق وتعمل طيات زي سنان المنشار. يعني الشكل نفسه علامة على خلايا عايشة أطول من اللازم.
      - kind: reveal
        page: 187
        quote: "Hypermethylation"
        prompt: "يعني إيه hypermethylation، وليه بيعمل سرطان من غير mutation؟"
        answer: |
          الكتاب: سرطانات الـ serrated pathway فيها ==hypermethylation==، وبتطلع في الـ **proximal colon**، وهي **تلت** الـ CRCs.

          التفسير المقبول (مش في الكتاب): الـ methylation زي «شريط لاصق» بيتحط على بداية الجين فيسكّته من غير ما يغيّر حروفه. لما الشريط ده يتحط على جين بيمنع السرطان (أو جين بيصلّح الـ DNA زي MLH1)، النتيجة زي الـ mutation بالظبط: الفرامل وقفت. وده بيفسّر ليه بعض أورام الـ serrated تبقى MSI رغم إن المريض مش Lynch: الجين سليم بس مسكّت.
      - kind: figure
        page: 188
        quote: "Multiple genetic pathways in colorectal cancer pathogenesis WHO Classification of Serrated Lesions (2010)"
        title: "تلات طرق للسرطان، زي اللي في الكتاب"
        alt: "Three rows. A, chromosomal instability: APC loss, then K-ras and 18q LOH, then TP53 inactivation; normal, early adenoma, late adenoma, cancer. B, microsatellite instability: APC loss and failure of MMR genes, then TGF-beta RII and BAX mutations; adenoma, cancer. C, serrated: BRAF mutation and DNA methylation, then TP53, p16 inactivation and LOH; serrated adenoma, cancer."
        caption: "الطريق التالت (C) هو بتاع الدرس ده: BRAF + methylation ← serrated adenoma ← cancer."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="G05c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="5" y="8" width="320" height="95" rx="8" class="fg-box"/>
            <text x="15" y="28" class="t-b">A. Chromosomal instability</text>
            <text x="15" y="54" class="t-sm">APC loss</text>
            <path d="M70 50h18" class="fg-arrow" marker-end="url(#G05c)"/>
            <text x="92" y="54" class="t-sm">K-ras, 18q LOH</text>
            <path d="M188 50h18" class="fg-arrow" marker-end="url(#G05c)"/>
            <text x="210" y="54" class="t-sm">TP53 off</text>
