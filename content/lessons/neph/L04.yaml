lessons:
  # ------------------------------------------------------------------
  - id: neph.L04.lesson1
    title: "قيس الضغط صح الأول"
    hook: "نص الـ hypertension اللي بتشوفها في العيادة ممكن تكون غلطة cuff أو قعدة. ابدأ من هنا."
    minutes: 9
    pages: [80, 82]
    topics: [measurement, classification]
    goals:
      - "تقيس الضغط بالطريقة اللي الكتاب عايزها"
      - "تعرف الـ dipper والـ salt-sensitive والـ HTN paradox"
      - "تحفظ thresholds كل طريقة قياس وتصنيف الـ BHS والأسباب الثانوية"
    status: unverified
    steps:
      - kind: explain
        page: 80
        title: "Brain chips في القياس"
        quote: "Sitting 5 minuts Legs on the ground Arm at level of the heart Cuff = 80% of The arm"
        text: |
          - **قاعد 5 دقايق**، رجليه على الأرض، ودراعه في ==مستوى القلب==.
          - الـ **cuff = 80%** من الدراع.
          - خلي بالك من الـ **auscultatory gap**، والـ inflation ما يوجعش، والزئبق ينزل بمعدل مظبوط.
          - قارن الدراعين، وفكّر في الـ **AF**، واعرف تعيد النفخ من أنهي مستوى.

          والتشخيص لازم يكون على ==two measurements one week apart==.
      - kind: reveal
        page: 80
        quote: "Cuff = 80% of The arm"
        prompt: "ليه الـ cuff الصغير على دراع تخين بيدي رقم عالي؟"
        answer: |
          الـ **cuff** الضيق محتاج ضغط أعلى علشان يقفل الشريان تحت نسيج كتير، فالقراءة تطلع **أعلى من الحقيقة**.

          وده بالظبط سبب من أسباب الـ **pseudoresistance** اللي هنشوفها: **small cuff in obese patients**. (الشرح فسيولوجي؛ الـ 80% من الكتاب.)
      - kind: explain
        page: 80
        title: "أول زيارة والضغط عالي جدًا"
        quote: "Femoral pulse delay Coarctation Leriche syndrome Aortitis"
        text: |
          قيس في **مكان تاني**، وجسّ الـ **femoral pulse**. لو فيه ==femoral pulse delay== فكّر في:
          - **Coarctation**
          - **Leriche syndrome**
          - **Aortitis**: Takayasu
      - kind: explain
        page: 81
        title: "Dipper و salt sensitive"
        quote: "Dipper – non dipper : MAB ↓10-20 mmHg at Mid night till→ 6 am"
        text: |
          - **Dipper:** الـ mean BP بينزل **10–20 mmHg** من نص الليل لحد **6 الصبح**. اللي ما بينزلش = **non-dipper**.
          - ==Salt-sensitive HT==: الـ SBP يعلى **≥10 mmHg** مع الـ salt loading؛ أغلبه في **الكبار** و **African Americans**.
          - **Postural:** normal، orthostatic، و **supine** (في الـ pregnancy والـ tumour).
      - kind: aside
        tone: exam
        page: 81
        quote: "More than two thirds of hypertensive adults in the United States fail to reach the blood pressure (BP) goal of <140/90 mm Hg"
        text: |
          ==HTN paradox==: عدد العيانين **uncontrolled** بيزيد **رغم** تقدم العلاج. أكتر من **تلتين** في أمريكا مش واصلين لـ <140/90، وأكتر من **80%** في كندا وأوروبا control مش كويس.
      - kind: table
        page: 81
        quote: "Office or Clinic 140 90 24-hour 125-130 80 Day 130-135 85 Night 120 70 Home 130-135 85"
        title: "الـ threshold بيختلف حسب طريقة القياس"
        columns: [Measurement, SBP, DBP]
        rows:
          - ["Office", "140", "90"]
          - ["24-hour", "125–130", "80"]
          - ["Day", "130–135", "85"]
          - ["Night", "120", "70"]
          - ["Home", "130–135", "85"]
        hide: [[0, 1], [1, 1], [3, 1], [3, 2], [4, 1]]
      - kind: check
        page: 81
        quote: "Office or Clinic 140 90 24-hour 125-130 80 Day 130-135 85 Night 120 70"
        question: "Which ambulatory reading is hypertensive?"
        options:
          - "Night average 124/72"
          - "Day average 128/82"
          - "24-hour average 122/76"
          - "Home average 128/80"
        answer: 0
        why:
          - "صح: الـ night threshold = 120/70، و 124/72 فوقه."
          - "الـ day threshold 130–135/85؛ 128/82 تحته."
          - "الـ 24-hour threshold 125–130/80؛ 122/76 تحته."
          - "الـ home threshold 130–135/85؛ 128/80 تحته."
      - kind: figure
        page: 82
        quote: "Grade 1 (mild) 140-159 and/or 90-99 Grade 2 (moderate) 160-179 and/or 100-109 Grade 3 (severe) ≥180 ≥110"
        title: "سلّم الـ BHS"
        alt: "A vertical BP ladder. Optimal below 120 over 80, normal 120 to 129 over 80 to 84, high normal 130 to 139 over 85 to 89, grade 1 140 to 159 over 90 to 99, grade 2 160 to 179 over 100 to 109, grade 3 at least 180 over at least 110."
        caption: "كل grade بيطلع **20** في الـ SBP و **10** في الـ DBP. ولو الـ SBP والـ DBP في درجتين مختلفين، خد ==الأعلى==."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="250" width="290" height="38" rx="8" class="fg-good"/>
            <text x="32" y="274" class="t-sm t-b">Optimal</text>
            <text x="300" y="274" text-anchor="end" class="t-sm">&lt;120 / &lt;80</text>
            <rect x="20" y="208" width="290" height="38" rx="8" class="fg-good"/>
            <text x="32" y="232" class="t-sm t-b">Normal</text>
            <text x="300" y="232" text-anchor="end" class="t-sm">120–129 / 80–84</text>
            <rect x="20" y="166" width="290" height="38" rx="8" class="fg-box"/>
            <text x="32" y="190" class="t-sm t-b">High normal</text>
            <text x="300" y="190" text-anchor="end" class="t-sm">130–139 / 85–89</text>
            <rect x="20" y="124" width="290" height="38" rx="8" class="fg-acc"/>
            <text x="32" y="148" class="t-sm t-b">Grade 1 (mild)</text>
            <text x="300" y="148" text-anchor="end" class="t-sm">140–159 / 90–99</text>
            <rect x="20" y="82" width="290" height="38" rx="8" class="fg-bad"/>
            <text x="32" y="106" class="t-sm t-b">Grade 2 (moderate)</text>
            <text x="300" y="106" text-anchor="end" class="t-sm">160–179 / 100–109</text>
            <rect x="20" y="40" width="290" height="38" rx="8" class="fg-dot-bad"/>
            <text x="32" y="64" class="t-sm t-b">Grade 3 (severe)</text>
            <text x="300" y="64" text-anchor="end" class="t-sm">≥180 / ≥110</text>
            <text x="165" y="24" text-anchor="middle" class="t-sm t-mut">SBP / DBP, mmHg</text>
          </svg>
      - kind: explain
        page: 82
        title: "الأسباب الثانوية"
        quote: "Renal Diabetic nephropathy Chronic glomerulonephritis Adult polycystic disease Chronic tubulointerstitial nephritis Renovascular disease"
        text: |
          - ==Renal==: diabetic nephropathy، chronic GN، adult polycystic disease، chronic TIN، **renovascular disease**.
          - **Endocrine:** Cushing، acromegaly، thyroid، hyperparathyroid.
          - **Adrenal:** **Conn**، adrenal hyperplasia، **phaeochromocytoma**.
          - **Cardiovascular:** aortic coarctation.
          - **Drugs:** NSAIDs، OCPs، steroids، carbenoxolone، liquorice، sympathomimetics، vasopressin، MAOIs مع tyramine.
      - kind: mnemonic
        page: 82
        quote: "Drugs NSAIDS Oral contraceptives Steroids Carbenoxalone Liquorice Sympathomimetics Vasopressin Monoamine oxidase inhibitors"
        word: "NOSCLSVM"
        parts:
          - { key: "N", text: "NSAIDs" }
          - { key: "O", text: "Oral contraceptives" }
          - { key: "S", text: "Steroids" }
          - { key: "C", text: "Carbenoxolone" }
          - { key: "L", text: "Liquorice" }
          - { key: "S", text: "Sympathomimetics" }
          - { key: "V", text: "Vasopressin" }
          - { key: "M", text: "MAO inhibitors with tyramine" }
        hook: "تمن حروف = تمن أدوية. اسأل عنهم في كل عيان ضغطه طلع فجأة: الـ NSAIDs والـ OCPs والـ steroids والعرقسوس بيحبسوا ملح، والباقي بيضيّق الشرايين."
      - kind: try
        items: [neph.L04.001, neph.L04.009, neph.L04.012, neph.L04.014, neph.L04.018]
    recap:
      - "قاعد 5 دقايق، الدراع في مستوى القلب، cuff = 80% من الدراع، وقراءتين بينهم أسبوع."
      - "ضغط عالي جدًا أول مرة: قيس مكان تاني ودوّر على femoral delay (coarctation، Leriche، Takayasu)."
      - "Dipper ينزل 10–20 بالليل. Salt-sensitive = SBP ↑≥10 مع الملح."
      - "Thresholds: office 140/90، 24h 125–130/80، day و home 130–135/85، night 120/70."
      - "BHS: grade 1 140–159/90–99، grade 2 160–179/100–109، grade 3 ≥180/≥110؛ خد الأعلى."
    practice: [neph.L04.001, neph.L04.002, neph.L04.003, neph.L04.004, neph.L04.005, neph.L04.006, neph.L04.007, neph.L04.008, neph.L04.009, neph.L04.010, neph.L04.011, neph.L04.012, neph.L04.013, neph.L04.014, neph.L04.015, neph.L04.016, neph.L04.017, neph.L04.018, neph.L04.019, neph.L04.020, neph.L04.021]
