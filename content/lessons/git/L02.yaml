  - id: git.L02.lesson7
    title: "نلوّن من غير صبغة: NBI و FICE و I-Scan و CLE"
    hook: "زرار في المنظار بيعمل اللي الصبغة بتعمله، وميكروسكوب على طرفه بيدّيك histology وانت جوه. مين أدق؟"
    minutes: 8
    pages: [52, 55]
    topics: [image-enhancement]
    goals:
      - "تعرف الـ NBI بيوضّح الأوعية إزاي ورقمه قد إيه"
      - "تفرق بين FICE و I-Scan و CLE في طريقة الشغل"
      - "تقرا جدول الـ sensitivity والـ specificity صح"
    status: unverified
    steps:
      - kind: explain
        page: 52
        quote: "Blue light is better absorption by hemoglobin, enabling imaging of superficial capillaries and superficial mucosal patterns."
        title: "الـ NBI: نور من غير صبغة"
        text: |
          - بيستخدم نور **blue و green**، ويوصل لـ **1000-fold** magnification.
          - ليه بيوضّح الـ capillaries؟ لأن ==blue light== بيتمص أكتر بالـ **hemoglobin**، فالأوعية السطحية تبان غامقة على خلفية فاتحة.
          - الـ correlation مع الـ pathology **85.3%**.
          - هو والـ chromoendoscopy **equally effective** في التفريق بين neoplasia و non-neoplasia: **100% sensitivity** و **75% specificity**.
          - أحسن من الـ conventional في **early colorectal cancer**.
      - kind: reveal
        page: 52
        quote: "Blue light is better absorption by hemoglobin, enabling imaging of superficial capillaries and superficial mucosal patterns."
        prompt: "ليه الـ NBI بالذات بيلقط الـ early cancer؟"
        answer: |
          الكتاب: الـ **blue light** بيتمص بالـ **hemoglobin**، فالـ **superficial capillaries** والـ **mucosal patterns** بيبانوا.

          التفسير المقبول (مش في الكتاب): الـ tumor بيعمل أوعية جديدة **كتير ومتلخبطة** في الـ mucosa. النور الأزرق قصير فمش بيدخل عميق، فبيرسم الأوعية السطحية دي بالذات بلون غامق. يعني بدل ما تدوّر على **لون** مختلف، بتدوّر على **رسمة أوعية** مختلفة، ودي بتبان بدري جدًا.
      - kind: figure
        page: 52
        title: "الـ NBI في الكتاب"
        image: { file: git/L02-nbi-ulcer.webp, book: true }
        alt: "Book NBI images of a gastric ulcer, with the mucosal surface and vessels shown in dark brown and green tones."
        caption: |
          **NBI images of gastric ulcer**. لاحظ إن الصورة كلها ألوانها بني وأخضر، لأن الجهاز بيبعت **blue و green** بس.

          التفسير المقبول (مش في الكتاب): الأوعية بتبان غامقة لأن الـ hemoglobin شرب النور الأزرق، والسطح بيبان بنقشه.
      - kind: explain
        page: 52
        quote: "Chromoendoscopy and NBI are equally effective for differentiating neoplasia from non neoplasia, with 100% sensitivity and 75% specificity."
        title: "اقرا الأرقام صح"
        text: |
          في الكتاب رقمين للـ NBI ممكن يتلخبطوا:
          - الـ ==correlation 85.3%==: قد إيه شكل الـ NBI بيطابق الـ **pathology**.
          - **100% sensitivity** و **75% specificity**: في التفريق بين **neoplasia** و non-neoplasia، وده **نفس** رقم الـ chromoendoscopy (**equally effective**).

          التفسير المقبول (مش في الكتاب): الـ sensitivity 100% يعني **مش بيفوّت** أي neoplasia، فلو الـ NBI قال «طبيعي» تطمّن. والـ specificity 75% يعني ربع الحاجات اللي بيشك فيها بتطلع سليمة، علشان كده الـ **biopsy** لسه هي اللي بتحسم.

          والنتيجة العملية في الكتاب: الـ NBI **superior** للـ conventional في **early-stage colorectal cancer**.
      - kind: table
        page: 53
        quote: "I-SCAN does not make use of the contrast created by light of different wave lengths, as does NBI."
        title: "الـ virtual chromoendoscopy: مين بيعمل إيه؟"
        columns: ["Technique", "How", "Remember"]
        rows:
          - ["NBI", "Blue and green light", "Hemoglobin absorbs blue: capillaries"]
          - ["FICE", "Virtual optical filters change wavelength", "Software makes 10 images"]
          - ["I-Scan", "Software modifies each white-light pixel", "No dye, no wavelength contrast"]
          - ["CLE", "Laser with a miniature microscope", "Optical biopsy"]
        hide: [[0, 2], [1, 2], [2, 1], [3, 2]]
      - kind: explain
        page: 53
        quote: "FICE technology is a software-based system that changes the color of endoscopic images in real time, produces the greatest contrast between normal mucosa and early stage neoplastic tissue."
        title: "FICE و I-Scan: الاتنين software، بس مختلفين"
        text: |
          ==FICE== (flexible spectral imaging color enhancement):
          - **Software-based**، بيغيّر لون الصورة **real time**.
          - بيدّي ==greatest contrast== بين الـ mucosa الطبيعية والـ **early stage neoplastic tissue**.
          - إزاي؟ بيغيّر الـ **wavelength** بـ **virtual optical filters**، والـ software بيطلّع **10 صور** مختلفة.

          ==I-Scan==:
          - برضه **software-based**، وبيزوّد الـ diagnostic accuracy بإنه يبيّن **fine details**.
          - **من غير dye** (عكس الـ chromo)، و**من غير wavelength contrast** (عكس الـ NBI).
          - بيعدّل **كل image element** من صورة الـ **white light** نفسها في الـ software.

          يعني الفرق: الـ NBI بيغيّر **النور** نفسه، الـ FICE بيغيّر الـ **wavelength افتراضيًا**، والـ I-Scan بيشتغل على **البيكسلات** بس.
      - kind: check
        page: 53
        quote: "FICE creates a contrast difference by changing the wave length of light by means of virtual optical filters and the software creates 10 different images."
        question: "Which technique uses virtual optical filters and creates 10 different images?"
        options:
          - "FICE"
          - "NBI"
          - "I-Scan"
          - "CLE"
        answer: 0
        why:
          - "صح: **flexible spectral imaging color enhancement (FICE)** بيغيّر الـ wavelength بـ virtual filters والـ software بيطلّع 10 صور."
          - "الـ narrow-band imaging (NBI) بيستخدم blue و green light فعلًا، مش filters في الـ software."
          - "الـ I-Scan **مش** بيعتمد على الـ wavelength خالص."
          - "الـ confocal laser endomicroscopy (CLE) بيستخدم laser للـ optical biopsy."
      - kind: figure
        page: 53
        title: "الـ FICE على adenoma مسطح"
        image: { file: git/L02-fice-adenoma.webp, book: true }
        alt: "Book FICE images of flat colonic adenomas, where the raised flat lesion stands out in contrasting colour from the surrounding mucosa."
        caption: |
          **FICE images of colonic flat adenomas**.

          التفسير المقبول (مش في الكتاب): الـ adenoma المسطح من أصعب الحاجات في الـ white light لأنه مش بارز. الـ FICE بيلعب في الـ contrast فحدوده تبان.
      - kind: figure
        page: 54
        title: "الـ I-Scan على polyps"
        image: { file: git/L02-iscan-polyp.webp, book: true }
        alt: "Book I-Scan images of colonic polyps with enhanced surface detail."
        caption: |
          **I-Scan images of colonic polyps**: نفس صورة الـ white light، بس الـ software بيبرز الـ **fine details** على السطح.
      - kind: explain
        page: 54
        quote: "CLE uses a laser rather than white light as a light source."
        title: "الـ CLE: biopsy من غير مقص"
        text: |
          ==Confocal laser endomicroscopy==:
          - **Laser** بدل الـ white light.
          - **Miniature microscope** على طرف المنظار ← **in vivo histology** ← مفهوم الـ ==optical biopsy==.
          - تكبير **several hundred-fold**، و **contrast media** للصور على مستوى الخلية.
          - **شاشتين**: واحدة للميكروسكوب وواحدة للمنظار، و **cross-sections** على أعماق مختلفة، وتقدر **تسجّل** الصور وترجعلها.

          التفسير المقبول (مش في الكتاب): الـ laser هنا بيركّز على نقطة واحدة في عمق محدد، فبيطلّع صورة شريحة رفيعة من النسيج زي شريحة الـ pathology، وده سبب الـ cross-sections على أعماق مختلفة.
      - kind: explain
        page: 54
        quote: "CLE has enabled noninvasive assessment of the cellular and molecular properties of tissues in real time, resulting in the concept of optical biopsy."
        title: "ليه الـ CLE اسمه optical biopsy؟"
        text: |
          الكتاب: الـ CLE عمل **noninvasive assessment** للـ **cellular and molecular properties** في **real time**، ومن هنا جه مفهوم الـ ==optical biopsy==.

          التفسير المقبول (مش في الكتاب): الـ biopsy العادية بتقطع حتة وتستنى الـ pathology أيام. الـ CLE بيشوف الخلايا **مكانها** وانت لسه جوه، فتقدر تقرر حالًا: أشيل الـ lesion دي؟ أخد biopsy منين بالظبط؟ وعلشان كده محتاج **شاشتين**: واحدة تشوف بيها **فين** انت (المنظار)، والتانية تشوف **إيه** اللي تحت الميكروسكوب.

          والصور **بتتسجّل وتتخزن** وترجعلها، وده مهم للمتابعة والمقارنة.
      - kind: figure
        page: 55
        title: "الـ CLE على polyp في المعدة"
        image: { file: git/L02-cle-polyp.webp, book: true }
        alt: "Book confocal laser endomicroscopy images of a gastric polyp showing glands and cells at microscopic magnification."
        caption: |
          **CLE images of a gastric polyp**: دي صور على مستوى **الغدد والخلايا**، مش سطح. ده معنى «histology وانت جوه».
      - kind: table
