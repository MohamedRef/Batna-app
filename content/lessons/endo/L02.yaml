        quote: "Nodular thyroid disease risk of thyroid cancer\n  Thyroid nodule / dominant nodule within a multinodular gland may be recognized for the 1st time during pregnancy.\n  Evaluation : ultrasound & Fine Needle Aspiration Biopsy.\n  FNAB is indicated in all pregnant women with.\n    Nodule >1cm.\n    Enlarging during gestation.\n    Associated with palpable cervical lymph nodes.\n  If FNAB is highly suggestive of malignancy, THYROID SURGERY should be performed even though the patient is pregnant.\n  If FNAB result shows a possible follicular neoplasm / mildly suspicious – surgery is deferred until after pregnancy & breastfeeding periods.\n  There is no clear evidence that natural history of any form of thyroid cancer is significantly modified by pregnancy."
        title: "العقدة في الحمل"
        text: |
          ممكن عقدة تتكشف لأول مرة في الحمل. التقييم: ==ultrasound و fine-needle aspiration biopsy (FNAB)==.

          **FNAB لكل حامل عندها:**
          1. Nodule أكبر من **1 cm**.
          2. بتكبر أثناء الحمل.
          3. معاها palpable cervical lymph nodes.

          ليه التلاتة دول؟ التفسير المقبول (مش في الكتاب): الـ **ultrasound و FNAB** آمنين في الحمل (مفيش إشعاع)، فمفيش سبب نأجل. والـ **1 cm** هو الحجم اللي تحته السرطان نادرًا ما بيفرق. والعقدة اللي **بتكبر** أو معاها **lymph nodes** بتلمّح إن في حاجة بتتكاثر أو انتشرت. وليه الكتاب مطمّن إننا ممكن نأجل؟ لأن ==no clear evidence== إن الحمل بيغيّر مسار أي نوع سرطان درقية.
