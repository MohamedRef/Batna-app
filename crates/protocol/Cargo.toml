[package]
name = "batna-protocol"
description = "What crosses the wire between Batna and Batna Cloud: sync ops, API types, merge rules."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Tiny on purpose: Batna Cloud's Worker build links it, and the Worker must
# stay small. No content, no FSRS.
[dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Property tests for the HLC order and merge convergence (test-only, so the
# Worker build stays small).
proptest = "1"

[lints]
workspace = true
