- id: res.L14.007
  kind: order
  topic: screening
  prompt: Put the path of a screen-detected case in order.
  steps:
  - Apparently well population (well persons plus those with undiagnosed disease)
  - Screening test
  - 'Positives: persons presumed to have the disease or be at increased risk'
  - Diagnostic procedures
  - Disease or risk factor present
  - Therapeutic intervention
  src:
    page: 5
    quote: |-
      APPARENTLY WELL POPULATION
      (Well persons plus those with undiagnosed disease)
      Population To Be Tested
      SCREENING TEST
      Negatives (Persons presumed to be free of disease under study)
      Positives (Persons presumed to have the disease or be at increased risk in future)
      DIAGNOSTIC PROCEDURES
      Disease or Risk Factor Present -> THERAPEUTIC INTERVENTION
  status: unverified
- id: res.L14.008
  kind: mcq
  topic: screening
  stem: A person's screening test is positive. What comes next?
  options:
  - Diagnostic procedures to confirm or exclude the disease
  - Treatment straight away, since the test is positive
  - 'Nothing: a positive screen is the diagnosis'
  - Repeat screening in a year
  answer: 0
  why:
  - Screen positives are only presumed to have the disease; some are false positives, so a diagnostic test decides.
  - Treatment follows only when the diagnostic procedure finds the disease or risk factor present.
  - 'Screening is not diagnosis: the slide shows positives on test with no disease.'
  - Rescreening is for negatives, not for a positive that needs confirming.
  src:
    page: 5
    quote: |-
      Negatives (Persons presumed to be free of disease under study)
      Positives (Persons presumed to have the disease or be at increased risk in future)
      DIAGNOSTIC PROCEDURES
  status: unverified
  tags: [high-yield]
