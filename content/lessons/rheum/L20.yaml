      - kind: explain
        page: 339
        title: "قواعد ذهبية"
        quote: "Methotrexate is the drug of choice for both joint & skin manifestations."
        text: |
          - **Non-steroidal anti-inflammatory drugs (NSAIDs)** للـ mild.
          - ==Methotrexate== = drug of choice للجلد **و** المفاصل.
          - **Antimalarials** ممكن تزوّد الصدفية (فيه اللي بيعتبرها contraindicated).
          - **Steroids** بحذر: لو نزلت بسرعة ← **skin flare**. وما تحقنش **intra-articular (IA)** من جوه plaque.
          - **Tumour necrosis factor (TNF) inhibitors**: arthritis، dactylitis، enthesitis، spondylitis، والجلد.
          - **Apremilast**: oral **PDE-4 inhibitor** بيعلّي الـ cyclic adenosine monophosphate (cAMP).
          - **Janus kinase (JAK)** (tofacitinib، upadacitinib): بيأثروا على IL-17 و IL-21 و IL-23.

          السبب ورا الـ MTX والـ steroids في الخطوة الجاية، والـ figure بعدها بيحط كل biologic على هدفه.
      - kind: reveal
        page: 339
        quote: "Corticosteroids should be used causiously because of the risk of inducing flare of skin disease if tapered too rapidly. In patients who require IA injections avoid injection through psoriatic plaques."
        prompt: "ليه الـ MTX هو الـ drug of choice، وليه الـ steroids «بحذر»؟"
        answer: |
          **الـ MTX:** لأنه بيعالج ==الجلد والمفاصل الاتنين== مع بعض. في مرض ليه domain جلد و domain مفاصل، دوا واحد بيغطي الاتنين أحسن من دوا للمفصل بس (زي الـ LEF اللي الكتاب بيقول إنه أقل فايدة للجلد).

          **الـ steroids:** لو نزّلت الجرعة **بسرعة**، الصدفية بتعمل **flare** (rebound). ولو هتحقن **intra-articular**، ماتدخلش الإبرة **من جوه plaque**. التفسير المقبول (مش في الكتاب): الـ plaque مليانة بكتيريا وجلدها ملتهب، فالإبرة ممكن تدخّل infection للمفصل.
