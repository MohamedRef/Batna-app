  - id: hem.L03.lesson5
    title: "الفول والـ oxidants: نقص الـ G6PD"
    hook: "طبق فول أخضر ممكن يودّي طفل المستشفى. والسبب إنزيم واحد ناقص في كرة ما عندهاش طريقة تانية تحمي نفسها."
    minutes: 8
    pages: [35, 37]
    topics: [g6pd]
    goals:
      - "تشرح ليه نقص الـ G6PD بيخلي الكرة ضعيفة قدام الـ oxidants"
      - "تعرف الصور الإكلينيكية والـ favism"
      - "تعرف التحاليل والعلاج وليه البول لازم يفضل كفاية"
    status: unverified
    steps:
      - kind: explain
        page: 35
        title: "الـ G6PD بيحمي الكرة إزاي؟"
        quote: "G6PD enzyme catalyses the first step in the hexose monophosphate (HMP) shunt. It generates NADPH from NADP."
        text: |
          الـ ==glucose-6-phosphate dehydrogenase (G6PD)== أول إنزيم في الـ **hexose monophosphate (HMP) shunt**. بيعمل **reduced nicotinamide adenine dinucleotide phosphate (NADPH)** من nicotinamide adenine dinucleotide phosphate (NADP).

          الـ NADPH بيخلّي الـ **glutathione** في الحالة الـ reduced (**GSH**)، والـ GSH بيحوّل الـ **hydrogen peroxide (H2O2)** لميه.

          ليه الكرة الحمرا بالذات؟ التفسير المقبول (مش في الكتاب): الكرة الناضجة ما فيهاش **mitochondria**، فالـ HMP shunt هو مصدرها الوحيد للـ NADPH. مفيش خطة بديلة.

          لو الـ G6PD ناقص: الـ H2O2 يتراكم ← الـ Hb يتأكسد ← الـ globin يترسب (==Heinz bodies==) ← الكرة تتكسر في الطحال **و** جوّه الأوعية.
      - kind: order
        page: 35
        quote: "NADPH is required for continuous supply of reduced glutathione (GSH). GSH detoxifies harmful hydrogen peroxide or H2O2 to water."
        prompt: "رتّب سلسلة الحماية:"
        steps:
          - "G6PD (first step of HMP shunt)"
          - "NADPH from NADP"
          - "Reduced glutathione (GSH)"
          - "H2O2 detoxified to water"
        why: "لو أول حلقة وقعت، كل اللي بعدها يقع. والـ H2O2 يفضل يأكسد الـ Hb."
      - kind: explain
        page: 36
        title: "الصورة والـ favism"
        quote: "Favism (precipitation of haemolysis by ingestion of fava beans) is a unique feature occurring in individuals in Mediterranean and Arab countries."
        text: |
          الوراثة ==X-linked==، والكتاب بيقول بيحصل في **الرجالة** بس، عشان الراجل عنده X واحد، فلو الجين بايظ مفيش نسخة تانية تعوّض.

          بعد **oxidant stress** (أدوية، عدوى): فجأة **شحوب**، **صفار**، و**بول غامق** (haemoglobinuria)، وممكن **acute renal failure**. البول غامق لأن جزء من التكسير **intravascular**، فالـ Hb الحر بيعدّي في البول؛ والتفسير المقبول (مش في الكتاب) إن الـ Hb ده بيأذي الـ tubules.

          الـ ==Favism==: haemolysis بعد أكل **الفول** (fava beans) اللي فيه oxidants، بعد ساعات أو أيام، وممكن يموّت. منتشر في **البحر المتوسط والدول العربية**.
      - kind: aside
        tone: joke
        page: 36
        quote: "Fava beans contain oxidants that cause haemolysis hours or days following ingestion; it may be fatal."
        text: "في مصر الفول مش أكلة، ده **أسلوب حياة**. 😄 بس لعيان الـ G6PD، الفول الأخضر بالذات ممكن يبقى خطر حقيقي. فكّر فيه في أي طفل جه ببول غامق بعد الفطار."
      - kind: explain
        page: 36
        title: "خمس صور لنفس الإنزيم"
        quote: "Drug-induced haemolytic anaemia."
        text: |
          الكتاب بيعدّ خمس صور:
          1. **Neonatal jaundice**.
          2. **Drug-induced haemolytic anaemia**.
          3. **Chronic haemolytic anaemia**.
          4. ==Favism==.
          5. **Haemolysis بعد عدوى**.

          الرابط بينهم إن كلهم **oxidant stress** على كرة مش قادرة تدافع: الدوا أو الفول أو العدوى بيعملوا H2O2، والكرة تتكسر. التفسير المقبول (مش في الكتاب): في المولود، الكبد لسه مش قادر يتعامل مع الـ bilirubin كله، فأي haemolysis يبان صفار. وفي الأنواع الشديدة من النقص، الـ oxidant stress العادي بتاع كل يوم كفاية يعمل haemolysis مزمن.

          يعني السؤال اللي تسأله لأي عيان G6PD: **إيه اللي أكسد الكرة النهارده؟**
      - kind: figure
        page: 36
        quote: "Peripheral blood smear shows fragmented red cells, bite cells,"
        title: "من الـ Heinz body للـ bite cell"
        alt: "Three red cells left to right: a normal disc; a cell with dark Heinz bodies (precipitated oxidised globin) stuck to its membrane after an oxidant; a bite cell with a semicircular notch where a spleen macrophage removed the Heinz body."
        caption: "الـ oxidant بيرسّب الـ globin جوّه الكرة (==Heinz bodies==). الطحال بيقضم الحتة دي ويسيب الكرة مقضومة: **bite cell**."
        svg: |
          <svg viewBox="0 0 330 160" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="h03g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <circle cx="50" cy="70" r="34" class="fg-bad"/>
            <circle cx="50" cy="70" r="12" class="fg-box"/>
            <text x="50" y="128" text-anchor="middle" class="t-sm">Normal</text>
