    src: { page: 371, quote: "Medication Optimization Nephrologists should thoroughly review medications during preconception counseling. Teratogenic medications should be discontinued at least 6 weeks before planned conception. If an unexpected pregnancy occurs, these medications should be discontinued immediately after the diagnosis is made. Women who have received a cumulative dose of more than 10 gm of cyclophosphamide in the" }
