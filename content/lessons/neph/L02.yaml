      - kind: explain
        page: 34
        quote: "Haematuria or albuminuria"
        title: "ليه كل مكان ليه شكل مختلف في البول؟"
        text: |
          الكتاب بيدّي لكل compartment علامته: **glomerular** = haematuria أو albuminuria، **tubulointerstitial** = proteinuria خفيفة أو pyuria أو ولا حاجة، **vascular** = مع أو من غير haematuria/proteinuria، **cystic** = بيبان في الـ imaging.

          التفسير المقبول (مش في الكتاب):

          - الـ ==glomerulus== هو الفلتر. لو اتأذى، الـ albumin والـ RBCs يعدّوا.
          - في الـ **tubulointerstitial** الفلتر سليم، فالبروتين قليل. والالتهاب حوالين الأنابيب بيرمي WBCs (pyuria).
          - الـ **vascular** بيقلّل الدم الواصل للكلية، فالبول ممكن يبقى نضيف والكلية بتموت ببطء.
          - الـ ==cysts== مش بتغيّر البول في الأول، فبنشوفها بالـ ultrasound.

          ومهما كان المكان، النهاية واحدة: الـ pathology اللي في الـ mnemonic اللي جاي.
      - kind: sort
        page: 34
        quote: "Chronic kidney disease: Glomerular filtration rate <60 mL per min per 1·73 m2 for >3 months or evidence of kidney damage on urinalysis, kidney imaging, or biopsy\n  Diabetic chronic kidney disease: Diabetic nephropathy (type 1 or 2 diabetes mellitus)\n  Non-diabetic chronic kidney disease\n    Vascular: With or without haematuria or proteinuria\n      Large-vessel disease (renal artery stenosis)\n      Small-vessel disease (hypertension, vasculitis, microangiopathy)\n    Glomerular: Haematuria or albuminuria\n      Primary nephritis (IgA nephropathy)\n      Autoimmune disorders (connective tissue disease)\n      Systemic infection (bacteria, virus, parasite)\n      Malignant disease (solid organ, haematological)\n      Drugs\n      Hyperfiltration (reduced renal mass, obesity)\n    Tubulointerstitial: With or without mild proteinuria or pyuria\n      Autoimmune disorders (connective tissue disease, granulomatous disease)\n      Drug toxic effects (analgesics, metals)\n      Chronic infection (bacteria, virus, parasite)\n      Obstructive nephropathy (chronic urinary-tract obstruction)\n      Post-acute kidney injury (ischaemic/toxic injury)\n    Cystic: Evident on renal imaging\n      Polycystic kidney disease (autosomal dominant polycystic kidney disease)"
        prompt: "حط كل سبب في الـ compartment بتاعه:"
        bins: ["Glomerular", "Tubulointerstitial", "Vascular", "Cystic"]
        cards:
          - { text: "Immunoglobulin A (IgA) nephropathy", bin: 0 }
          - { text: "Membranous nephropathy", bin: 0 }
          - { text: "Analgesic nephropathy", bin: 1 }
          - { text: "Chronic obstruction", bin: 1 }
          - { text: "Lead / aristolochic acid", bin: 1 }
          - { text: "Renal artery stenosis", bin: 2 }
          - { text: "Cholesterol emboli", bin: 2 }
          - { text: "Autosomal dominant polycystic kidney disease (ADPKD)", bin: 3 }
      - kind: mnemonic
        page: 34
        quote: "Glomerulosclerosis Tubular atrophy Interstitial fibrosis Vascular sclerosis"
        word: "GTIV"
        parts:
          - { key: "G", text: "Glomerulosclerosis" }
          - { key: "T", text: "Tubular atrophy" }
          - { key: "I", text: "Interstitial fibrosis" }
          - { key: "V", text: "Vascular sclerosis" }
        hook: "**جي تي آي في**: الكلى المتليّفة اتقفلت زي **TV** قديم. 📺"
      - kind: figure
        page: 35
        title: "الـ CKD تحت الميكروسكوب"
        image: { file: neph/L02-ckd-histology.webp, book: true }
        alt: "Book histology photomicrograph of chronic kidney damage with three labels: vascular sclerosis (top right, a thick-walled artery), tubulointerstitial fibrosis (right, scarred tissue between atrophic tubules), and glomerulosclerosis (bottom left, a scarred glomerulus). Pink tubules fill the background."
        caption: |
          عينة كلية فيها الـ 4 حاجات اللي الـ mnemonic بتقولها، و3 منها عليها لافتات:

          - **فوق يمين: Vascular sclerosis**: شريان جداره **سميك** والتجويف صغير.
          - **يمين: Tubulointerstitial Fibrosis**: النسيج اللي **بين** الأنابيب متليّف (غامق ومليان ألياف)، والأنابيب حواليه صغيرة: ده الـ **tubular atrophy**.
          - **تحت شمال: Glomerulosclerosis**: glomerulus اتحوّل لكورة ندبة.
          - **الخلفية**: أنابيب وردي (tubules) لسه شغالة.

          الصورة بتثبت إن الـ CKD المتقدم ==بيتشابه أيًا كان السبب==: كل الأماكن (glomerulus، tubules، interstitium، vessels) ==متليّفة في نفس الوقت==.
      - kind: explain
        page: 35
        quote: "KIDNEY FAILURE RISK EQUATION\nUsing the patient's Urine, Sex, Age and GFR, the kidney failure risk equation provides the 2 and 5 year probability of treated kidney failure for a potential patient with CKD stage 3 to 5.\nUrine + Sex + Age + GFR (Glomerular filtration rate) = The projected risk of kidney failure"
        title: "الـ KFRE: احتمال الفشل الكلوي"
        text: |
          ==kidney failure risk equation (KFRE)== بياخد **Urine ACR، Sex، Age، glomerular filtration rate (GFR)** ويديك احتمال kidney failure بعد **سنتين و5 سنين**.

          - بيتستخدم في **G3–G5**
          - **ممكن ميبقاش valid في G1–G2**
          - في IgA nephropathy (IgAN) و autosomal dominant polycystic kidney disease (ADPKD) فيه equations خاصة

          التفسير المقبول (مش في الكتاب): مش valid في G1–G2 **لأن** الـ equation اتعملت على مرضى G3–G5، وفي المراحل الأولى الـ events قليلة قوي فالتوقع مش دقيق.
      - kind: explain
        page: 35
        quote: "Use of kidney failure risk equation (KFRE) to estimate risk of kidney"
        title: "ليه الـ KFRE بياخد الأربع أرقام دول؟"
        text: |
          الـ KFRE بياخد **Urine ACR، Sex، Age، GFR**. التفسير المقبول (مش في الكتاب):

          - الـ **GFR**: قد إيه فاضل قبل الفشل.
          - الـ **ACR**: سرعة الأذى، وهو أقوى منبئ بالـ progression.
          - الـ **Age**: الكبير بينزل أبطأ، وكمان ممكن يموت بالقلب قبل ما يوصل للغسيل.
          - الـ **Sex**: الرجالة في الدراسات بيوصلوا للفشل أسرع.

          وليه **مش valid في G1–G2** (الكتاب)؟ لأن المعادلة اتعملت على مرضى ==G3–G5==، والخطر في G1–G2 قليل جدًا فالأرقام بتطلع مش دقيقة. وفي ==IgAN== و **ADPKD** فيه معادلات خاصة لأن مسارهم مختلف.
      - kind: check
        page: 35
        quote: "May not be valid for use in those with CKD G1–G2"
        question: "In which patient is the KFRE least valid?"
        options:
