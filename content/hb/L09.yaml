- id: hb.L09.192
  kind: essay
  topic: sfp
  prompt: Give a brief review on spontaneous fungal peritonitis.
  outline:
  - Definition and pathogenesis:
    - Fungal infection of ascites without a source; fungal translocation
    - Promoted by antibiotics, GI bleeding, immunosuppression, malnutrition
  - Diagnosis:
    - PMN ≥250 + positive fungal culture; fungal ascites if PMN <250
    - Candida albicans commonest; pan-fungal PCR and beta-D-glucan are faster
  - Treatment:
