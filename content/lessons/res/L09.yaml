  - id: res.L09.lesson1
    title: "الـ budget: البحث بيتكلف كام ومين هيدفع؟"
    hook: "البحث من غير budget زي فرح من غير ميزانية: هتكتشف في نص الليلة إن الفلوس خلصت."
    minutes: 10
    pages: [2, 13]
    topics: [budget, funding]
    goals:
      - "تعرف ليه بنعمل budget وبنبدأه منين"
      - "تعدّ بنود الـ budget والحاجات اللي محتاجة justification"
      - "تعرف نصايح الـ funding وإزاي تدوّر على ممول"
    status: unverified
    steps:
      - kind: explain
        page: 2
        quote: "BUDGET\nWhy do we need to design a budget?\n  A detailed budget will help you to identify which resources are already locally available and which additional resources may be required.\n  The process of budget design will encourage you to consider aspects of the work plan you have not thought about before, and will serve as a useful reminder of activities planned, as your research gets underway."
        title: "ليه أصلًا نعمل budget؟"
        text: |
          الـ ==budget== التفصيلي بيعمل حاجتين:

          - يوريك إيه الـ **resources** اللي موجودة عندك أصلًا، وإيه اللي ناقص ومحتاج تجيبه.
          - وانت بتعمله بتفتكر حاجات في الـ **work plan** ما فكرتش فيها، ويفضل **reminder** بالأنشطة اللي ناويها وانت ماشي في البحث.
      - kind: explain
        page: 3
        quote: "How should a budget be prepared?\n  It is necessary to use the work plan as a starting point. Specify, for each activity in the work plan, what resources are required. Determine for each resource needed, the unit cost and the total cost.\nYou may include in your project budget:\n  Personnel allowances: salaries and benefits (e.g., researchers, research assistants, secretarial and administrative, drivers)\n  Supplies and equipment\n  Other costs (compensation for subjects, transportation costs, and medical intervention costs, stationery supplies), etc.\n  Communications (e.g., telephone, fax, postage)"
        title: "بنبدأ منين؟ من الـ work plan"
        text: |
          نقطة البداية هي الـ ==work plan==: لكل activity فيه، حدد الـ resources اللي محتاجها، ولكل resource احسب **unit cost** و **total cost**.

          والبنود اللي ممكن تحطها:

          - **Personnel allowances**: salaries and benefits (researchers، research assistants، سكرتارية وإداريين، سواقين).
          - **Supplies and equipment**.
          - **Other costs**: تعويض المشاركين (compensation for subjects)، المواصلات، تكلفة الـ medical intervention، الأدوات المكتبية.
          - **Communications**: تليفون، فاكس، بوستة.
      - kind: explain
        page: 4
        quote: "Justification for each of the parts should be included, if necessary."
        title: "كل بند ومعاه سببه"
        text: |
          الـ budget مش أرقام بس: جنب كل بند لازم ==justification== (مبرر) لو احتاج.

          يعني «جهاز ELISA» مش كفاية؛ اكتب ليه البحث محتاجه ومش هينفع من غيره.

          ليه؟ لأن الممول بيقرا الأرقام وبيسأل «ليه ده؟»، والمبرر بيجاوب قبل ما يسأل. التفسير المقبول (مش في الكتاب).
      - kind: figure
        page: 5
        quote: "EXAMPLE OF A BUDGET\n| Category | Unit cost | Multiplying factors | Costs |\n|---|---|---|---|\n| I. ALLOWANCES: a. Researchers (5); b. Research assistants (5); c. Secretary (1); d. Drivers (2); e. Facilitator (1) | per day | persons x days | |\n| SUBTOTAL (I) | | | MK 14 620 |\n| II. TRANSPORT COSTS: field work during pilot study; field work during actual study; travel costs for facilitator; travel costs for feedback in field; travel costs for those who attend meeting | 0.50 per km | km | |\n| SUBTOTAL (II) | | | MK 8 950 |\n| III. SUPPLIES: a. Stationary; b. Lunch for those who attend meeting | | | |\n| SUBTOTAL (III) | | | MK 2 600 |\n| TOTAL (I+II+III) | | | MK 26 170 |\n| 5% CONTINGENCY | | | 1 310 |\n| GRAND TOTAL | | | MK 27 480 |"
        title: "شكل الـ budget في الآخر"
        alt: "A budget built as stacked blocks: allowances 14 620, transport 8 950 and supplies 2 600 add up to a total of 26 170; a 5 percent contingency of 1 310 is added on top to give a grand total of 27 480."
        caption: "**I + II + III = Total**، وبعدين **5% contingency** فوقهم = **Grand total**. الـ contingency ده احتياطي للمفاجآت."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="150" width="190" height="60" rx="6" class="fg-acc"/>
            <text x="115" y="176" text-anchor="middle" class="t-sm t-b">I. Allowances</text>
            <text x="115" y="195" text-anchor="middle" class="t-sm">14 620</text>
            <rect x="20" y="105" width="190" height="40" rx="6" class="fg-box"/>
            <text x="115" y="130" text-anchor="middle" class="t-sm">II. Transport 8 950</text>
            <rect x="20" y="70" width="190" height="30" rx="6" class="fg-box"/>
            <text x="115" y="90" text-anchor="middle" class="t-sm">III. Supplies 2 600</text>
            <rect x="20" y="30" width="190" height="34" rx="6" class="fg-thin"/>
            <text x="115" y="52" text-anchor="middle" class="t-sm t-acc">5% contingency 1 310</text>
            <path d="M222 70V210" class="fg-arrow"/>
            <text x="232" y="145" class="t-sm t-b">Total</text>
            <text x="232" y="162" class="t-sm">26 170</text>
            <path d="M222 30V210" class="fg-arrow-acc" stroke-width="1"/>
            <text x="232" y="40" class="t-sm t-b t-good">Grand total</text>
            <text x="232" y="57" class="t-sm t-good">27 480</text>
          </svg>
      - kind: check
        page: 3
        quote: "How should a budget be prepared?\n  It is necessary to use the work plan as a starting point. Specify, for each activity in the work plan, what resources are required. Determine for each resource needed, the unit cost and the total cost.\nYou may include in your project budget:\n  Personnel allowances: salaries and benefits (e.g., researchers, research assistants, secretarial and administrative, drivers)\n  Supplies and equipment\n  Other costs (compensation for subjects, transportation costs, and medical intervention costs, stationery supplies), etc.\n  Communications (e.g., telephone, fax, postage)"
        question: "Where does compensation paid to study subjects go in the budget?"
        options: ["Other costs", "Personnel allowances", "Supplies and equipment", "Communications"]
        answer: 0
        why:
          - "صح: الـ slide حاطة compensation for subjects تحت other costs مع المواصلات والـ medical intervention والأدوات المكتبية."
          - "الـ personnel allowances دي مرتبات فريق البحث، مش فلوس المشاركين."
          - "دي خامات وأجهزة."
          - "دي تليفون وفاكس وبوستة."
      - kind: explain
        remind: [res.L09.009]
        page: 6
        quote: "Budget justification\n  It is not sufficient to present a budget without explanation. A Budget justification is useful for items which seem questionable or particularly costly.\n  Special consideration should be given to the following items:\n    Computers and other capital equipment\n    Salary and consultancy rates\n    Travel\n    Conference attendance\n    Other financial issues"
        title: "الـ budget justification"
        text: |
          مش كفاية ترمي أرقام: الـ ==budget justification== مهم للبنود اللي **شكلها غريب** أو **غالية قوي**.

          الحاجات اللي تاخد بالك منها بالذات:

          - Computers and other **capital equipment**
          - **Salary and consultancy rates**
          - **Travel**
          - **Conference attendance**
          - Other financial issues
      - kind: aside
        tone: analogy
        page: 6
        quote: "Budget justification\n  It is not sufficient to present a budget without explanation. A Budget justification is useful for items which seem questionable or particularly costly.\n  Special consideration should be given to the following items:\n    Computers and other capital equipment\n    Salary and consultancy rates\n    Travel\n    Conference attendance\n    Other financial issues"
        text: |
          تخيل إنك بتطلب من أبوك فلوس رحلة. «٣٠٠ جنيه أكل» هيعدّيها. بس «٥٠٠٠ جنيه لابتوب» هيسألك: ليه؟

          الممول نفس الحكاية: الكمبيوتر والمرتبات والسفر والمؤتمرات هي البنود اللي هيسأل عنها، فاكتب سببها من الأول.
      - kind: explain
        page: 7
        quote: "Top 10 Tips on How to get Funding\n  1. Make a cost/benefit decision\n  2. Make yourself valuable. Develop a set of demonstrable core competencies through your publications.\n  3. Get to know the funding sources\n  4. Get to know the key people.\n  5. Get to know the community by presenting at their conferences."
        title: "١٠ نصايح عشان تاخد funding"
        text: |
          1. اعمل **cost/benefit decision**: يستاهل التعب؟
          2. **Make yourself valuable**: اعمل core competencies باينة من الـ publications بتاعتك.
          3. اعرف **funding sources**.
          4. اعرف **key people**.
          5. اعرف الـ **community**: قدّم في المؤتمرات بتاعتهم.
          6. أول كام grant قدّمهم مع **senior colleagues** سبق ونجحوا.
          7. اكتب كويس وخلّي عندك **focus**.
          8. اطلب **feedback**.
          9. **Resubmit**: الرفض مش النهاية.
          10. **Deliver**: سلّم اللي وعدت بيه.
      - kind: order
        page: 8
        quote: "6. Submit your first few grants with senior colleagues who have been successful in getting grants.\n7. Write well and have a focus\n8. Ask for feedback\n9. Resubmit\n10. Deliver"
        prompt: "رتّب النصايح من 6 لـ 10:"
        steps:
          - "Submit first grants with senior colleagues"
          - "Write well and have a focus"
          - "Ask for feedback"
          - "Resubmit"
          - "Deliver"
        why: "منطقي: تتعلم مع حد خبرة ← تكتب كويس ← تسأل رأي ← لو اترفضت تقدّم تاني ← ولما تاخدها تسلّم."
      - kind: check
        page: 9
        quote: "Sources of Funding\n  On-line Funding Websites\n  Federal Agency Funding Sites (DOD, NSF)\n  Non-Federal Sponsor Funding Sites (WHO)\n  Funding Sources Administered by the ORA: The Johns Hopkins University School of Medicine Clinician Scientist Career Development Awards\n  Other Sources for Funding"
        question: "On the slide's list of sources of funding, the World Health Organization (WHO) is an example of which kind of funding site?"
        options:
          - "Non-federal sponsor funding site"
          - "On-line funding website"
          - "Federal agency funding site"
          - "Industry"
        answer: 0
        why:
          - "صح: السلايد كاتبة WHO تحت «Non-Federal Sponsor Funding Sites»."
          - "الـ on-line funding websites بوابات بحث عن تمويل، مش ممولين."
          - "الـ federal agency sites هي هيئات حكومية أمريكية."
          - "الـ industry في قايمة funding organisations، والـ WHO مش شركة."
      - kind: explain
        page: 11
        quote: "Research Funding Organisations\n  Research Councils\n  Government Departments\n  Government Organisations\n  Charities\n  Welsh Assembly Government\n  European Union\n  Industry\n  Others"
        title: "مين بيموّل الأبحاث؟"
        text: |
          السلايد بتعدّ الـ **research funding organisations**:

          - Research Councils
          - Government Departments و Government Organisations
          - Charities
          - Welsh Assembly Government و European Union
          - Industry
          - Others

          ليه القايمة مهمة؟ لأن كل ممول ليه أولويات، فلما تعرف مين موجود تختار اللي اهتمامه قريب من سؤالك. التفسير المقبول (مش في الكتاب).
      - kind: explain
        remind: [res.L09.013]
        page: 12
        quote: "How to Undertake a Funding Search\n  Check funders web sites: find out which funding bodies support your subject area; ask colleagues\n  Check relevant journals / papers: look through subject specific journals, or the Times HE / Tuesday Guardian / contact professional societies who sometimes have sources of funding.\n  Speak to colleagues..NETWORK NETWORK NETWORK!\n  Internet Search Engines\n  Research Funding Websites:\n    www.rdinfo.org.uk - for medical research funding opportunities.\n    http://www.cos.com/ (Sources for Research, Worldwide)\n  ResearchResearch.com – funding database / good source of information"
        title: "تدوّر على ممول إزاي؟"
        text: |
          - **Funders' web sites**: مين بيموّل في مجالك؟ واسأل زمايلك.
          - **Journals and papers**: المجلات المتخصصة، والـ professional societies ساعات عندها funding.
          - **Colleagues**: ==network, network, network==!
          - **Internet search engines**.
          - **Research funding websites** وقواعد بيانات زي ResearchResearch.com.

          ولو الجامعة مشتركة في database زي دي: **سجّل، اعمل searches محفوظة، وشغّل alerts** (slide 13).
      - kind: explain
        page: 13
        quote: "How to Undertake a Funding Search\n  University subscribes to the RESEACHRESEARCH.COM funding database\n  Register & personalise the service\n  Save custom searches and set alerts"
        title: "تدوّر على funding في database"
        text: |
          لو الجامعة مشتركة في database زي **ResearchResearch.com**:

          1. ==Register و personalise== الخدمة.
          2. ==Save custom searches==.
          3. ==Set alerts==.

          ليه الـ alerts بالذات؟ لأن الـ calls بتفتح وتقفل في مواعيد، والتنبيه بيوصّلك قبل ما الفرصة تفوت. التفسير المقبول (مش في الكتاب).
      - kind: try
        items: [res.L09.003, res.L09.009, res.L09.010]
    recap:
      - "الـ budget بيبدأ من الـ work plan: لكل activity الـ resources، ولكل resource الـ unit cost والـ total cost."
