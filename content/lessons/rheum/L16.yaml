      - kind: explain
        page: 269
        title: "الـ TB قبل الـ anti-TNF"
        quote: "If positive and chest X-ray normal: isonazid (300 mg) and vit B6 (50mg) for 9 month with anti TNF."
        text: |
          الـ TNF هو اللي ماسك الـ granuloma قافل على الـ TB. توقفه، الـ latent TB يصحى.

          1. Screening: **PPD** أو ==QuantiFERON-Gold==.
          2. موجب والـ CXR طبيعي ← ==isoniazid 300 mg + B6 50 mg لمدة 9 شهور== مع الـ anti-TNF.

          وكمان: وقّفه **1-2 أسبوع قبل العملية** وارجعله بعدها بأسبوعين. ووقّفه في الـ URTI أو skin infection وارجعله.
