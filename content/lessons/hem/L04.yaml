          أسباب الـ ==eosinophilia== في الكتاب: **parasitic infection**، **skin disorders**، **allergic conditions**، **neoplasia**، **myeloproliferative disorders**، و **hypereosinophilic syndrome**.

          ليه دول بالذات؟ التفسير المقبول (مش في الكتاب): الـ eosinophil شغلته الأساسية مع حاجتين: **الديدان** (أكبر من إن neutrophil يبلعها، فالـ eosinophil بيفرز عليها مواد سامة)، و**الحساسية** (بيتجمع في أماكن الـ allergic reaction). والجلد مليان الاتنين.

          والـ myeloproliferative والـ HES هنا المصنع نفسه بيطلّع eosinophils من غير طلب. عشان كده في المسافر اللي راجع وعنده حكة و eosinophilia، فكّر في **parasites** الأول.
