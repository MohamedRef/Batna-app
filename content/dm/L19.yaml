  # ---------- p247: metabolism figure ----------
  - id: dm.L19.014
    kind: order
    topic: metabolism
    prompt: Order the exogenous (dietary) lipid pathway shown in the book's figure.
    steps:
      - Dietary fat absorbed in the small intestine
      - Chylomicron (ApoB-48) enters the circulation
      - Lipoprotein lipase releases free fatty acids
      - Free fatty acids go to adipose tissue and muscle
      - Chylomicron remnant is taken up by the liver
    src: { page: 247, quote: "Lipoprotein Metabolism" }
    status: unverified
  - id: dm.L19.015
    kind: order
    topic: metabolism
    prompt: Order the endogenous pathway from the liver, as in the book's figure.
    steps:
      - Liver secretes VLDL
      - Lipoprotein lipase removes triglyceride
      - IDL forms (part returns to the liver)
      - Further lipolysis gives LDL
      - LDL is taken up by the liver
    src: { page: 247, quote: "Lipoprotein Metabolism" }
    status: unverified
    tags: [high-yield]
  - id: dm.L19.016
    kind: card
    topic: metabolism
    front: Which enzyme strips triglyceride from chylomicrons and VLDL, releasing free fatty acids?
    back: Lipoprotein lipase (LPL).
    src: { page: 247, quote: "Lipoprotein Metabolism" }
    status: unverified
  - id: dm.L19.017
    kind: card
    topic: metabolism
    front: Where do the free fatty acids released from chylomicrons go?
    back: To adipose tissue and muscle.
    src: { page: 247, quote: "Free fatty acids Adipose tissue and muscle" }
    status: unverified
  - id: dm.L19.018
