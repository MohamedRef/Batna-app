        why: "في الـ **thrombotic microangiopathy (TMA)** والـ **transplant glomerulopathy** الـ endothelium هو اللي اتعوّر، فبيبني GBM جديد من غير ما يكون فيه deposits."
      - kind: explain
        page: 239
        title: "الـ GBM: رفيع ولا تخين؟"
        quote: "Type IV collagen nephropathy\n  Diffuse thinning of the GBM: Thin basement membrane disease.\n  Irregularity and multilayering or splitting of the GBM: Alport's syndrome.\nDiffuse thickening of the GBM: Diabetes mellitus, hypertension."
        text: |
          - **Diffuse thinning** = ==thin basement membrane disease==
          - **Irregularity و multilayering (splitting)** = ==Alport syndrome==
          - الاتنين **type IV collagen nephropathy**.
          - **Diffuse thickening** = diabetes و hypertension.

          ليه الاتنين type IV collagen؟ التفسير المقبول (مش في الكتاب): الـ GBM مبني من **type IV collagen** زي شبكة. لو الشبكة اتعملت بخيوط أقل، يبقى الغشا **رفيع** بس متماسك (thin basement membrane disease، غالبًا hematuria بس). لو الخيوط **غلط** في الشكل، الشبكة بتتفكك وتتطبق طبقات (Alport)، فالـ hematuria بتبقى proteinuria وبعدين failure، ومعاها الودن والعين **لأن** نفس الـ collagen موجود هناك.
          والـ **thickening** في السكر والضغط عكس ده: الخلايا بتبني matrix **زيادة** من السكر والضغط العالي، فالغشا يتخن من غير ما يتفكك.

          إزاي ده بيبان على العيان؟ التفسير المقبول (مش في الكتاب): الـ **thin basement membrane** غالبًا microscopic hematuria في عيلة كلها كويسة، ومن غير proteinuria ولا failure، فالمتابعة بس. الـ **Alport** hematuria من الطفولة، وبعدين proteinuria، وبعدين failure في الشباب (الرجالة أكتر لأنه غالبًا X-linked)، ومعاه **صمم** و مشاكل في العين. فالسؤال اللي يفرق في العيادة: فيه حد في العيلة عمل dialysis أو عنده سمع ضعيف؟
