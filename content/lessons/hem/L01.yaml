        answer: 0
        why:
          - "صح: الـ lymphocytes من الـ lymphoid stem cell، مش من الـ myeloid CFU-GEMM."
          - "الـ E في granulocyte, erythrocyte, monocyte, megakaryocyte (GEMM) = erythrocyte."
          - "الـ M الأخيرة = megakaryocyte."
          - "الـ M الأولى = monocyte."
      - kind: reveal
        page: 4
        quote: "Each of the colony forming units in turn can produce a colony of one haematopoietic lineage under appropriate growth conditions."
        prompt: "ليه سمّوها burst-forming unit erythroid، مش colony-forming unit زي الباقيين؟"
        answer: |
          الكتاب بيقول كل **colony forming unit** بيطلّع **colony من lineage واحد** في الظروف المناسبة.

          التفسير المقبول (مش في الكتاب): الـ **BFU-E** أبكر وبيتكاثر أكتر قبل ما ينضج، فبدل colony واحدة بيطلّع كذا colony صغيرة متجمعة حوالين بعض زي **الانفجار** (burst). بعده بييجي الـ **CFU-E**، وده اللي الـ **erythropoietin** بيشتغل عليه في الدرس الجاي.
      - kind: explain
        remind: [hem.L01.027, hem.L01.033]
        page: 4
        title: "الـ microenvironment: البيت مش بس الطوب"
        quote: "It is a suitable environment for stem cell growth and development. It is composed of stromal cells and a microvascular network."
        text: |
          الـ stem cell لوحدها مش كفاية؛ تكوين الخلايا الناضجة بيتحكم فيه 3 حاجات: **growth factors**، **inhibitors**، و ==bone marrow (BM) microenvironment==.

          الـ microenvironment = **stromal cells** + **microvascular network**. يعني بيت وأوعية دموية، مش خلايا سايبة. الـ stromal cells بتعمل **extracellular matrix** (collagen وبروتينات)، وده ضروري عشان الـ renewal والـ differentiation يمشوا صح.

          في شكل الكتاب (ص 5) الـ **stroma** = fibroblast-like **reticular cells** + collagenous fibres + extracellular matrix، زي "مرتبة" الخلايا نايمة عليها.
      - kind: figure
        page: 5
        quote: "(c) Bone marrow consists of blood cells in different stages of development and supporting tissue known as the stroma (mattress)."
        title: "النخاع من جوّه (شكل الكتاب ص 5)"
        image: { file: hem/L01-marrow-stroma.webp, book: true }
        alt: "Book figure of bone marrow: a pink stroma of fibroblast-like reticular cells and fibres around a blue venous sinus. A stem cell matures into neutrophils that cross into the sinus; red cells mature and a reticulocyte expels its nucleus; a large megakaryocyte sheds platelets into the sinus; a macrophage, a monocyte and a lymphocyte sit in the stroma."
        caption: |
          الكتاب بيسمّي الـ ==stroma== **مرتبة** (mattress): **reticular cells** شبه الـ fibroblasts، و **collagenous fibres**، و **extracellular matrix**، والخلايا نايمة عليها وبتكبر.

          - الـ **neutrophils** و الـ **red cells** بتنضج جنب الـ **venous sinus**، وبعدين تعدّي من الـ **endothelium** للدم.
          - الـ **reticulocyte** بيرمي نواته قبل ما يخرج.
          - الـ **megakaryocyte** قاعد على حيطة الـ sinus، وحتت منه بتتقطع تبقى ==platelets== جوه الـ sinus على طول.
      - kind: explain
        page: 5
        title: "الـ CAMs: velcro النخاع"
        quote: "microenvironment. As the marrow cells differentiate, they lose cell adhesion molecules (CAMS), thus they can leave the marrow to the circulation."
        text: |
          في النخاع فيه **CAM receptors** (cell adhesion molecules).

          - لو اديت **stem cells** في الوريد، بتروح تلزق في النخاع (==homing==) بسبب الـ CAM receptors دي. وده أساس الـ **bone marrow transplant**.
          - الخلية وهي بتنضج بـ**تفقد** الـ cell adhesion molecules (CAMs)، فتفك من النخاع وتطلع الدم.
      - kind: reveal
        page: 5
        quote: "microenvironment. As the marrow cells differentiate, they lose cell adhesion molecules (CAMS), thus they can leave the marrow to the circulation."
        prompt: "لو الخلايا الصغيرة (blasts) ظهرت في الدم، ده معناه إيه بلغة الـ CAMs؟"
        answer: "الطبيعي إن الخلية ما تسيبش النخاع إلا لما تنضج و**تفقد الـ CAMs**. ظهور blasts في الدم معناه إن حاجة بوّظت الـ microenvironment أو الخلايا نفسها شاذة؛ ودي حاجة هتقابلها في الـ leukaemia والـ myelofibrosis."
      - kind: try
        items: [hem.L01.023, hem.L01.024, hem.L01.028, hem.L01.030, hem.L01.031]
    recap:
      - "Myeloid stem cell ← CFU-GEMM ← CFU-GM, -Eo, -Baso, -Meg؛ وفي الأحمر BFU-E ثم CFU-E."
      - "كل CFU يطلّع colony من lineage واحد."
