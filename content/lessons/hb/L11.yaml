      - kind: explain
        page: 193
        title: "PSC: خلّي عينك على الـ cholangiocarcinoma"
        text: |
          - الـ **PSC** (مع أو من غير ulcerative colitis) هي **the most common known predisposing factor for cholangiocarcinoma**.
          - علشان كده لازم **regular screening**.
          - الـ **CA 19-9** عالي في **up to 85%** من الـ cholangiocarcinoma.
          - في الـ PSC: **CA 19-9 > 100 U/mL** ليه **sensitivity 75%** و **specificity 80%**.
          - ومع ده كله: **early diagnosis is extremely challenging**.
      - kind: reveal
        page: 193
        prompt: "Sensitivity 75% و specificity 80%... يعني إيه ده عمليًا لمريض الـ PSC قدامك؟"
        answer: |
          - **Sensitivity 75%:** من كل 4 عندهم cholangiocarcinoma، **واحد هيطلع الـ CA 19-9 بتاعه أقل من 100**. يعني رقم طبيعي **مش بيطمّنك**.
          - **Specificity 80%:** من كل 5 **من غير** ورم، **واحد** هيطلع عنده أعلى من 100 (مثلًا من الـ cholangitis أو الـ obstruction، وده تفسير مقبول).

          علشان كده الكتاب بيقول التشخيص المبكر **extremely challenging** حتى مع الـ marker.
      - kind: explain
        page: 194
        title: "Autoimmune hepatitis"
        text: |
          الـ **immunosuppression ممكن متبقاش indicated** في:
          - **inactive cirrhosis**
          - **preexisting comorbid conditions**
          - **drug intolerance**

          **AASLD** (في الكتاب): **prednisone 10 mg/day + azathioprine**، أو **prednisone 20 mg/day لوحده**، وده الـ higher dose.

          لو فيه toxicity من prednisone أو azathioprine: **cyclosporine**، **6-mercaptopurine**، **cyclophosphamide**، **mycophenolate mofetil** اتستخدموا بنجاح في isolated cases.
      - kind: update
