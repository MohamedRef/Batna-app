  - id: rheum.L12.lesson8
    title: "الـ MAS: لما الـ ESR ينزل والطفل يتعب"
    hook: "طفل systemic JIA الـ ESR بتاعه نزل فجأة. أوعى تفرح: ده ممكن يكون أخطر خبر في المحاضرة."
    minutes: 8
    pages: [205, 205]
    topics: [mas]
    goals:
      - "تعرف صورة الـ MAS الإكلينيكية والمعملية"
      - "تلقط الـ MAS بدري من علامات الإنذار وتعرف ليه الـ ESR بيقع"
      - "تعرف الـ triggers"
    status: unverified
    steps:
      - kind: explain
        page: 205
        quote: "About 5–8% of children with systemic juvenile idiopathic arthritis develop a life-threatening complication known as macrophage activation syndrome."
        title: "الـ Macrophage activation syndrome"
        text: |
          **5–8%** من الـ systemic juvenile idiopathic arthritis (JIA) بيجيلهم ==MAS==، وهو life-threatening.

          - **Clinical**: حمى مستمرة فجأة، pancytopenia، hepatosplenomegaly، liver insufficiency، coagulopathy بنزيف، أعراض عصبية.
          - **Labs**: triglycerides عالية، **sodium واطي**، و **ferritin عالي جدًا**.
          - في الـ marrow: macrophages بتاكل الـ haemopoietic cells (haemophagocytosis).

          ليه نلقطه بدري؟ لأن الكتاب بيقول الـ early recognition والعلاج قبل الـ severe multisystem involvement ممكن يحسّن الـ outcome.
      - kind: reveal
        page: 205
        quote: "The syndrome is characterised by the sudden onset of sustained fever, pancytopenia, hepato splenomegaly, liver insufficiency, coagulopathy with haemorrhagic manifestations, and neurological symptoms."
        prompt: "ليه الـ MAS بيعمل pancytopenia و ferritin عالي جدًا مع بعض؟"
        answer: |
          الكتاب بيقول في الـ marrow فيه ==active phagocytosis of haemopoietic cells by macrophages==. يعني الـ macrophages المتهيجة بتاكل خلايا الدم نفسها، فالـ **pancytopenia** منطقية.

          التفسير المقبول (مش في الكتاب) للباقي: الـ macrophage المتنشط بيطلّع ferritin كتير، والكبد اللي فيه macrophages متنشطة بيتعب (liver insufficiency) فبيقل تصنيع عوامل التجلط، والـ triglycerides بتعلى لأن الـ cytokines بتوقف الإنزيم اللي بيكسّرها.
      - kind: figure
        page: 205
        quote: "Increasingly abnormal coagulation studies, rising ferritin, or a sudden drop in ESR or platelet count are harbingers of the onset of macrophage activation syndrome (MAS)."
        title: "علامات الإنذار"
        alt: "Two panels. Top: active systemic JIA, with platelets, ESR and fibrinogen arrows pointing up. Bottom: evolving MAS, with platelets and ESR arrows pointing down, ferritin, triglycerides and D-dimer pointing up, sodium down."
        caption: "الـ systemic JIA العادي: platelets و ESR عاليين. لو نزلوا فجأة والـ ferritin طلع، ده الـ MAS جاي."
        svg: |
