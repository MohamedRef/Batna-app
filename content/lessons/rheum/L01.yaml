        quote: "CD4 Th cells exert most of their helper functions through secreted cytokines."
        text: "Th1 = عسكري الشارع: بينشّط الـ macrophage والـ Tc ويعمل DTH ضد اللي جوه الخلايا. Th2 = موظف المصنع: بيكبّر الـ B cells ويطلّع antibodies و IgE ويجيب الـ eosinophils والـ mast cells."
