    topic: storm
    prompt: A 32-year-old woman presents with sudden palpitations, fever and agitation post-thyroid surgery. Analyze the pathophysiology of her condition and propose a management plan.
    outline:
      - "Diagnosis": ["Thyroid storm precipitated by surgery"]
      - "Pathophysiology": ["Unclear", "Acute discharge of T4/T3 from the gland", "Inhibited binding to globulin", "Not caused by thyroxine overdose"]
      - "Management": ["Block synthesis: methimazole IV or PTU 200 mg 4-hourly", "Block conversion/release: Lugol's, lithium if iodine allergy, IV steroids", "Propranolol (CCB or digoxin if contraindicated)", "Fluids, cooling, paracetamol; no salicylates; HDU/ICU", "Treat precipitant"]
    src: { page: 116, quote: "Pathogenesis\n  Thyroxine overdose does not cause thyroid storm.\n  The pathogenesis remains unclear.\n  The following factors are implied:\n    Acute discharge of T4 and T3 from the thyroid gland and\n    Inhibition of T4/T3 to binding globulin." }
