  - id: hem.L08.lesson2
    title: "CML: الطحال العملاق والمراحل التلاتة"
    hook: "طحال واصل للحوض، وWBC بالمية ألف، وساعات العيان ما يحسش بحاجة."
    minutes: 10
    pages: [118, 122]
    topics: [cml-clinical, cml-course]
    goals:
      - "تربط كل عرض وعلامة بسببها"
      - "تفرّق الـ chronic والـ accelerated والـ blast crisis وتعرف ليه المرض بيتغير"
      - "تعرف نوع الـ blasts في الأزمة وليه بيفرق"
    status: unverified
    steps:
      - kind: explain
        remind: [hem.L08.017]
        page: 118
        title: "الأعراض جاية منين؟"
        quote: "CML is diagnosed in many asymptomatic patients during routine investigations. Symptomatology of CML usually nonspecific, is secondary to anaemia, spleen size or an increase basal metabolic rate. Fatigue, weigh loss, malaise, easy satiety and a sense of left upper quadrant fullness are the major symptoms of CML. Rarely bleeding due to low platelet count or thrombosis due to thrombocytosis and/or marked leukocytosis. An elevated blood histamine level (related to the hasophil cell mass) can cause upper GIT bleeding. Acute gouty arthritis may follow treatment."
        text: |
          كتير بيتكشف **صدفة** في تحاليل روتينية. الأعراض nonspecific وجاية من:
          - **Anemia**: fatigue، malaise
          - ==Spleen size==: easy satiety وتقل في الـ **left upper quadrant**
          - **↑ basal metabolic rate**: weight loss

          ونادرًا: نزيف من low platelets أو thrombosis من الـ thrombocytosis.

          ليه الـ metabolic rate بيعلى؟ التفسير المقبول (مش في الكتاب): ملايين الخلايا بتتولد وتموت كل يوم، وده شغل بياكل طاقة، فالعيان بيخس ويعرق وهو قاعد. ولما العلاج يكسّر الخلايا دي فجأة، الـ purines بتتحول uric acid، وعشان كده **acute gout** ممكن ييجي بعد العلاج.
      - kind: sort
        page: 118
        quote: "CML is diagnosed in many asymptomatic patients during routine investigations. Symptomatology of CML usually nonspecific, is secondary to anaemia, spleen size or an increase basal metabolic rate. Fatigue, weigh loss, malaise, easy satiety and a sense of left upper quadrant fullness are the major symptoms of CML. Rarely bleeding due to low platelet count or thrombosis due to thrombocytosis and/or marked leukocytosis. An elevated blood histamine level (related to the hasophil cell mass) can cause upper GIT bleeding. Acute gouty arthritis may follow treatment."
        prompt: "وصّل العرض بآليته:"
        bins: ["Leukostasis", "Basophil histamine", "Big spleen"]
        cards:
          - { text: "Dyspnea", bin: 0 }
          - { text: "TIA", bin: 0 }
          - { text: "Priapism", bin: 0 }
          - { text: "Upper gastrointestinal tract (GIT) bleeding", bin: 1 }
          - { text: "Easy satiety", bin: 2 }
          - { text: "LUQ fullness", bin: 2 }
          - { text: "Splenic infarction pain", bin: 2 }
        why: "الـ leukostasis = sludging في أوعية الرئة والمخ (dyspnea، drowsiness، transient ischaemic attack (TIA))، والـ priapism مع leukocytosis أو thrombocytosis شديدة. الـ histamine من الـ basophils بيعمل نزيف gastrointestinal tract (GIT). الطحال الكبير بيضغط على المعدة وممكن يحصل فيه infarction."
      - kind: explain
        page: 118
        title: "الكشف"
        quote: "Neutrophil function is usually normal. Headache, bone pain, artheralgia, pain from splenic infarction, and fever are common in late stages. Priapism is occasionally noted, usually in patients with marked leukocytosis or thrombocytosis. Leuckostatic symptoms such as dyppnea, drowsiness, TIA, which are due to sludging in the pulmonary or cerebral vessels, appears more frequently in later stages of the disease. Splenomegaly is the most consistent physical sign in CML occurs in more than 60% of cases. The spleen may extend"
        text: |
          - ==Splenomegaly== أثبت علامة، في **أكتر من 60%**، وممكن يوصل لـ **pelvic brim**.
          - **Hepatomegaly** أقل.
          - **Lymphadenopathy** و skin infiltration ==نادرين جدًا==.
          - الـ neutrophil function عادةً **طبيعية**.
          - **Acute gout** ممكن ييجي بعد العلاج.

          ليه الغدد نادرة؟ التفسير المقبول (مش في الكتاب): الـ CML مرض **myeloid** بيعيش في النخاع والطحال، والغدد بيت الـ lymphocytes. فلو ظهرت غدد، معناه إن الخلايا اتغيرت وبقت بتنتشر في أماكن مش بتاعتها، وده اللي الصفحة الجاية بتقوله.
      - kind: aside
        tone: trap
        page: 119
        quote: "to the pelvic brim. Hepatomegaly is less common., lymphadenopathy is very uncommon as is infiltration of skin and other tissues. If present, these findings suggest Ph1-negative CML, or accelerated or blastic transformation."
        text: "عيان chronic myeloid leukaemia (CML) عنده **lymph nodes** أو **skin infiltration**؟ ده مش typical. فكّر في ==Ph1-negative CML== أو إنه دخل **accelerated** أو **blastic transformation**."
      - kind: reveal
        page: 118
        quote: "Acute gouty arthritis may follow treatment."
        prompt: "عيان CML بدأ hydroxyurea، وبعد أسبوع صباعه الكبير ورم واحمر. إيه اللي حصل وكان ممكن نمنعه إزاي؟"
        answer: |
          ده ==acute gouty arthritis==، والكتاب بيقول إنه ممكن ييجي **بعد العلاج**.

          التفسير المقبول (مش في الكتاب): العلاج بيكسّر كمية ضخمة من الخلايا، والـ DNA بتاعها بيتحول **uric acid**. علشان كده الكتاب في الـ supportive treatment بيدي **overhydration + allopurinol** من الأول.
      - kind: explain
        page: 120
        title: "المرض بيتغير مع الوقت"
        quote: "All patients eventually develop a variety of changes in the behavior of the disease"
        text: |
          الكتاب واضح: ==كل== العيانين في الآخر سلوك المرض (the behavior of the disease) عندهم بيتغير. الأشهر **blast crisis** شكلها زي الـ acute leukemia.

          إزاي تعرف إنه داخل على الـ **accelerated phase**؟
          - صعب تخلي الـ WBC **تحت 20,000**
          - الطحال والكبد بيكبروا، و infiltration في الغدد والجلد والعضم
          - **Blasts 15–19%** في الدم أو النخاع
          - **Basophils 20%** أو أكتر

          ليه بيحصل كده؟ التفسير المقبول (مش في الكتاب): الـ BCR/ABL بيخلي الخلية تتقسم كتير، وكل انقسام فرصة لغلطة جينية جديدة. مع الوقت الـ clone بياخد غلطات زيادة، فيبطّل يكبر ويبقى زي الـ blasts، ويبطّل يسمع كلام الدوا.
      - kind: figure
        page: 120
        quote: "\"All patients eventually develop a variety of changes in the behavior of the disease, most frequently there is \"\"a blast crisis\"\" a clinical picture resembling that of acute leukemia. This change can be abrupt, but more frequently it is preceded by a period of progressively greater difficulty in maintaining the WBC count at a level of less than 20,000/dl, increasing splenomegaly, hepatomegaly, and infilteration of nodes, skin, bones, or other tissues, the appearance of blast cells (15 to 19%) in blood or BM, basophilia 20% or more. This last group of features, termed the accelerated phase of CML.\""
        title: "تلات محطات"
        alt: "A three-step timeline: chronic phase, controllable with treatment; accelerated phase, with difficulty keeping WBC under 20,000, growing spleen and liver, infiltration, blasts 15 to 19 percent and basophils 20 percent or more, median survival 12 months; blast crisis resembling acute leukemia, median survival 3 months, blasts myeloid in 70 percent, lymphoid 20 percent and undifferentiated 10 percent."
        caption: "تلت العيانين بيقفزوا لـ ==blast crisis== فجأة، والتلتين بيعدّوا على الـ **accelerated** الأول."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L08b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head-bad"/></marker></defs>
            <rect x="15" y="10" width="300" height="60" rx="12" class="fg-good"/>
