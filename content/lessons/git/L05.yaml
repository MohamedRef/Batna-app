        quote: "INCREASED RISK – People with a family history\n| Risk category | Suggested surveillance interval |\n|---|---|\n| Colorectal cancer or adenomatous polyps in any first-degree relative before age 60, or in 2 or more first-degree relatives at any age (if not a hereditary syndrome). | Age 40, or 10 years before the youngest case in the immediate family, whichever is earlier. Every 5 years. |\n| Colorectal cancer or adenomatous polyps in any first-degree relative aged 60 or older, or in at least 2 second-degree relatives at any age | Age 40. Every 10 years. |"
        title: "ACS: لو في family history"
        text: |
          - **First-degree relative قبل 60**، أو اتنين first-degree في أي سن: ابدأ عند ==age 40, or 10 years before the youngest case== (الأبكر)، وكرر **every 5 years**.
          - **First-degree عنده 60 أو أكتر**، أو اتنين second-degree: ابدأ عند **age 40**، وكرر **every 10 years**.

          التفسير المقبول (مش في الكتاب): ليه «أيهما أبدري»؟ لأن لو أصغر حالة في العيلة كانت 45، الـ 40 لوحده هيكون متأخر شوية، والـ 35 بتديك وقت تلاقي البوليب قبل سن العيلة.
