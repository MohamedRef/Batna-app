      - kind: check
        page: 168
        quote: "For patients with either type I or II carcinoids, and with tumors less than 1 cm or with fewer than three to five lesions, -endoscopic polypectomy or endoscopic mucosal resection, with endoscopic surveillance every 6 months."
        question: "Type I gastric carcinoids, three lesions all under 1 cm. Management?"
        options:
          - "Endoscopic polypectomy or EMR, surveillance every 6 months"
          - "En bloc resection with lymphadenectomy"
          - "No treatment, no follow-up"
          - "Total gastrectomy"
        answer: 0
