  - id: neph.L09.048
    kind: enumerate
    topic: prescription
    prompt: Mention the renal indications for dialysis.
    points:
      - ESRD with signs, symptoms or malnutrition
      - Volume overload not responding to medical treatment
      - Metabolic acidosis not responding, or with oliguria/anuria
      - "Electrolytes not responding: hyperkalaemia, hyponatraemia, hyperphosphataemia"
      - "Uraemia: encephalopathy, pericarditis"
      - Persistent or progressive AKI
    pass: 5
    src: { page: 299, quote: "Volume overload not responding to medical R" }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.049
    kind: card
    topic: prescription
    front: In a first session needing large fluid removal, how is isolated UF timed, and what changes if there is hyperkalaemia?
    back: Isolated UF for 1–2 h before dialysis; with hyperkalaemia, do isolated UF after, not before, dialysis.
    src: { page: 299, quote: "if hyperkalmia present isolated UF should be after not before dialysis" }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.050
    kind: mcq
    topic: prescription
    stem: A man with AKI has pulmonary oedema and K+ 7.1 mmol/L. His first session needs a lot of fluid removed. How should isolated ultrafiltration be timed?
    options:
      - After the dialysis session
      - For 1–2 h before dialysis
      - Instead of dialysis
      - It should never be used in a first session
    answer: 0
    why:
      - "Correct: with hyperkalaemia, isolated UF comes after dialysis, so potassium is cleared first (p299)."
      - Before dialysis is the default only when there is no hyperkalaemia.
      - Isolated UF removes fluid, not potassium.
      - The book allows it in a first session for excessive fluid removal.
    src: { page: 299, quote: "if hyperkalmia present isolated UF should be after not before dialysis" }
    status: unverified
  # ---------- p300: non-renal indications, poisons ----------
  - id: neph.L09.051
    kind: card
    topic: prescription
    front: Name a non-renal indication for UF or SLED.
    back: Intractable heart failure with severe oedema.
    src: { page: 300, quote: "Intractable HF severe edema UF/SLED." }
    status: unverified
  - id: neph.L09.052
    kind: enumerate
    topic: prescription
