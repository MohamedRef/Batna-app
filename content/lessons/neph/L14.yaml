  - id: neph.L14.lesson10
    title: "Cyclophosphamide ولا MPAA ولا CNI: الحساب كله"
    hook: "دوا واحد ممكن ينقذ الكلية ويوقف المبيض. عشان كده الجرعة والطريقة بيتحسبوا بالجرام."
    minutes: 9
    pages: [455, 458]
    topics: [ln-cyc, ln-mpaa-cni]
    goals:
      - "تفرّق بين الـ NIH والـ Euro-Lupus والـ oral cyclophosphamide"
      - "توزن الـ regimen بالأربع عوامل: efficacy و cost و convenience و toxicity"
      - "تعرف حدود الـ cumulative dose وليه بتتحسب"
      - "تفهم ليه الـ CNI بينزّل البروتين بسرعة، وامتى belimumab أو rituximab"
    status: unverified
    steps:
      - kind: explain
        page: 455
        title: "تلات طرق لنفس الدوا"
        quote: "Cyclophosphamide may be given orally or intravenously, and in a standard-dose (also known as the modified National Institutes of Health (NIH) regimen or high-dose regimen) or low-dose (also known as the Euro-Lupus regimen). The dosing and duration for these regimens are given in Figure 7."
        text: |
          الـ cyclophosphamide ممكن يتاخد **oral** أو **IV**، والـ IV نوعين:

          - **Standard-dose** = ==modified National Institutes of Health (NIH) regimen== = high-dose.
          - **Low-dose** = ==Euro-Lupus regimen==.

          ليه تلات طرق؟ عشان كل طريقة بتوازن بين القوة والسُّمّية والتكلفة بشكل مختلف، وده اللي الكتاب هيشرحه في الصفحة الجاية.
      - kind: match
        page: 456
        quote: "Figure 7: Cyclophosphamide dosing regimens, combined with glucocorticoids, in initial treatment for active Class III/IV lupus nephritis.\n| | Intravenous cyclophosphamide – modified (NIH regimen) | Intravenous cyclophosphamide (Euro-Lupus regimen) | Oral cyclophosphamide |\n| Cyclophosphamide | i.v. 0.5–1 g/m2 monthly for 6 months | i.v. 500 mg every 2 weeks for 3 months | p.o. 1.0–1.5 mg/kg/d (max 150 mg/d) for 2–6 months |\n| Comments | Efficacy data included patients of different races/ethnicities | Efficacy data mainly in Caucasian patients, with some data from patients of Afro/Caribbean descent, Hispanic descent, Indian patients, and other Asian countries | Efficacy data included patients of different races/ethnicities |\ni.v., intravenous; max, maximum; NIH, National Institutes of Health, USA.; p.o., oral."
        prompt: "وصّل الـ cyclophosphamide regimen بجرعته:"
        pairs:
          - ["Modified NIH (standard-dose IV)", "0.5-1 g/m² monthly for 6 months"]
          - ["Euro-Lupus (low-dose IV)", "500 mg every 2 weeks for 3 months"]
          - ["Oral", "1.0-1.5 mg/kg/day (max 150 mg) for 2-6 months"]
        why: "الـ Euro-Lupus أقل immediate toxicity، بس اتجرب أساساً في White patients. الـ IV أقل bladder toxicity من الـ oral."
      - kind: explain
        page: 456
        title: "الأربع عوامل وسبب كل واحد"
        quote: "The choice of which regimen to use depends on several factors and can be individualized:\nEfficacy: Oral and standard-dose i.v. cyclophosphamide regimens have been used in diverse ethnic populations and for all levels of disease severity, and show equivalent efficacy. Reduced-dose cyclophosphamide (Euro-Lupus regimen) shows equivalent efficacy to standard-dose cyclophosphamide but was tested mainly in White patients. Emerging data suggest low-dose cyclophosphamide is effective in Asians, Hispanics, and Black patients, but these studies did not make direct comparisons to standard-dose i.v. cyclophosphamide (Supplementary Table S6).\nCost: Intravenous cyclophosphamide is more expensive than oral and requires the availability of an infusion suite and experienced staff.\nConvenience: Oral cyclophosphamide does not require patients to stop work or family activities.\nToxicity: The toxicities of cyclophosphamide may be considered immediate (e.g., gastrointestinal, susceptibility to infection) or delayed (e.g., loss of fertility, future malignancies)."
        text: |
          الكتاب بيقول الاختيار ==can be individualized== على أربع حاجات:

          - **Efficacy:** الـ oral والـ standard IV اتجرّبوا في أعراق كتير وكل درجات المرض، و ==equivalent efficacy==. الـ Euro-Lupus زيهم، بس ==tested mainly in White patients==؛ عشان كده الداتا في الآسيويين والسود والـ Hispanic لسه من غير مقارنة مباشرة.
          - **Cost:** الـ IV **more expensive** لأنه محتاج **infusion suite** وطاقم متدرّب.
          - **Convenience:** الـ oral **does not require patients to stop work or family activities**.
          - **Toxicity:** **immediate** (معدة، عدوى) و **delayed** (خصوبة، أورام).

          مثال يربط العوامل (التفسير المقبول، مش في الكتاب): مريضة شغالة ومعندهاش مواصلات للمستشفى كل أسبوعين، هنا الـ convenience بتميل للـ oral. ومريضة تانية مش ملتزمة بالبرشام، هنا الـ IV أضمن رغم التكلفة. ومريضة عايزة تخلّف، هنا الـ toxicity المتأخرة على المبيض هي اللي بتحكم، فبتبعد عن الـ cyclophosphamide خالص وتروح للـ MPAA.
      - kind: reveal
        page: 456
        quote: "The choice of which regimen to use depends on several factors and can be individualized:\nEfficacy: Oral and standard-dose i.v. cyclophosphamide regimens have been used in diverse ethnic populations and for all levels of disease severity, and show equivalent efficacy. Reduced-dose cyclophosphamide (Euro-Lupus regimen) shows equivalent efficacy to standard-dose cyclophosphamide but was tested mainly in White patients. Emerging data suggest low-dose cyclophosphamide is effective in Asians, Hispanics, and Black patients, but these studies did not make direct comparisons to standard-dose i.v. cyclophosphamide (Supplementary Table S6).\nCost: Intravenous cyclophosphamide is more expensive than oral and requires the availability of an infusion suite and experienced staff.\nConvenience: Oral cyclophosphamide does not require patients to stop work or family activities.\nToxicity: The toxicities of cyclophosphamide may be considered immediate (e.g., gastrointestinal, susceptibility to infection) or delayed (e.g., loss of fertility, future malignancies)."
        prompt: "مريضة مصرية عندها class IV. الـ Euro-Lupus أقل سُمّية. ليه الكتاب مش بيقولك إنه الأحسن للكل وخلاص؟"
        answer: |
          لأن الكتاب بيقول الـ Euro-Lupus ==tested mainly in White patients==. الداتا الجديدة بتقول إنه شغال في الـ Asians والـ Hispanics والـ Black، بس ==these studies did not make direct comparisons== مع الـ standard-dose.

          يعني الدليل موجود بس أضعف. ولسه الـ figure بتاع العلاج الأولي (ص 453) بيقول الـ Euro-Lupus هو الـ **preferred**. فالفكرة: هو الاختيار الأول، بس اعرف حدود الدليل.
      - kind: explain
        page: 457
        title: "مين أقل سُمّية، وليه بنعدّ الجرامات؟"
        quote: "Standard-dose i.v. cyclophosphamide was shown to be less toxic than oral cyclophosphamide, but the dose and duration of oral treatment in these reports were substantially higher and longer than those currently recommended (Supplementary Table S1313. 148). The incidence of bladder toxicity is also felt to be lower with i.v. cyclophosphamide. Reduced-dose i.v. cyclophosphamide has the most favorable immediate toxicity profile among the 3 cyclophosphamide regimens.\nThe risk of future hematologic malignancy is related to total lifetime exposure (>36 g), as is myelofibrosis (>80 g). Total lifetime exposure plus age constitutes a significant risk factor for premature ovarian failure (>7.5-15 g/m² for young to older pediatric patients, respectively; 300 mg/kg for adults). Point 10.2.3.1.3: An MPAA-based regimen is the preferred initial therapy of e LN for patients at high risk of infertility, patients who have a moderate to h namide exposure."
        text: |
          - الـ standard IV ==less toxic than oral==، بس الكتاب بينبّه إن الـ oral في الدراسات دي كان بجرعات ومدة **أكبر** من دلوقتي.
          - الـ **bladder toxicity** أقل مع الـ IV. التفسير المقبول (مش في الكتاب): الـ metabolite اللي بيأذي المثانة (acrolein) بيقعد معاها كل يوم مع البرشام.
          - الـ **reduced-dose IV** = ==the most favorable immediate toxicity profile== بين التلاتة.

          والـ delayed toxicity بتتحسب بالـ **total lifetime exposure**، عشان الضرر بيتجمّع: كل جرعة بتضيف على اللي قبلها، والمريض ممكن يحتاج كورس تاني لو عمل relapse.
