  # --- Case reports and case series (slides 34-40) ---
  - id: res.L04.036
    kind: card
    topic: case-reports
    front: What is a case report, and where does it sit in the hierarchy of evidence?
    back: >-
      It describes a single unique case or unusual finding of interest. Case reports and case series sit
      near the bottom of the hierarchy of reliable evidence.
    src: { page: 34, quote: "Case reports and case series are near the bottom of the hierarchy of what counts as reliable evidence for clinical decision-making.\nA case report (or case study) usually describes a single unique case or finding of interest (unusual finding)." }
