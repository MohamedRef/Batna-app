# The hover glossary (PARITY.md §6.3): rest the S Pen or the mouse on one of
# these words anywhere in Batna and its expansion shows. One word per term
# (aliases for other spellings); expansions stay short. Like all content,
# every entry is unverified until Mohamed approves it (glossary.TERM in
# content/approved.txt). Checked by `batna-tools validate`.
