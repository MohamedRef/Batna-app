          في الـ figure: عند نفس مستوى الـ hypoglycemia، الـ **long-acting analogue** بيوصل لـ A1c أقل من **neutral protamine Hagedorn (NPH)** بحوالي **0.4–0.6%**. يعني تقدر تضغط على السكر أكتر وانت أأمن.
