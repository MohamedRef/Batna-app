  - id: git.L03.285
    kind: mcq
    topic: anorectal
    stem: >-
      A 48-year-old woman has rectal aching lasting over an hour several times a week for 8 months. Posterior traction
      on the puborectalis is tender. Fissure, abscess and hemorrhoids are excluded. What is the diagnosis?
    options:
      - Levator ani syndrome
      - Proctalgia fugax
      - Unspecified functional anorectal pain
      - Dyssynergic defecation
      - Coccygodynia
    answer: 0
    why:
      - "Correct: chronic rectal aching, episodes of 30 minutes or more, with puborectalis tenderness."
      - Proctalgia fugax lasts seconds to minutes, 30 minutes at most.
      - Unspecified means the same symptoms without tenderness.
      - That is an evacuation disorder, not a pain syndrome.
      - Coccygodynia must be excluded; tenderness here is on the puborectalis.
    src: { page: 140, quote: "F2. Functional anorectal pain\nF2a. Levator ani syndrome\nDiagnostic criteria* - Must include all of the following:\n  1. Chronic or recurrent rectal pain or aching\n  2. Episodes last 30 minutes or longer\n  3. Tenderness during traction on the puborectalis\n  4. Exclusion of other causes of rectal pain such as inflammatory bowel disease, intramuscular abscess, anal fissure, thrombosed hemorrhoids, prostatitis, coccygodynia and major structural alterations of the pelvic floor\n*Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis" }
    status: unverified
