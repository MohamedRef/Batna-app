      - kind: explain
        page: 85
        title: "الـ spectral analysis"
        quote: "j. Spectral analysis The power spectrum reflects the amplitude of the heart rate fluctuations present at different oscillation frequencies."
        text: |
          الـ **power spectrum** بيوريك ==amplitude== تذبذب الـ heart rate (HR) عند كل **frequency**:
          - **Very low frequency (VLF)**: vasomotor tone (**thermoregulation**)
          - **Low frequency (LF) ~0.1 Hz**: **baroreceptor reflex**
          - **High frequency (HF) ~0.25 Hz**: **respiratory activity**

          ليه الـ HF بالذات هو الـ vagus؟ التفسير المقبول (مش في الكتاب): الـ vagus سريع جدًا، يقدر يغيّر النبض من ضربة للضربة اللي بعدها، فيتبع النَفَس (حوالي 15 نفس في الدقيقة = 0.25 Hz). الـ sympathetic بطيء، بياخد ثواني، فما يقدرش يعمل غير التموجات البطيئة.
      - kind: figure
        page: 85
        quote: "(3) High-frequency (HF) component (around 0.25 Hz), which is related to respiratory activity k."
        title: "الطيف"
        alt: "A power spectrum graph with three peaks along a frequency axis: VLF near zero (thermoregulation, sympathetic), LF around 0.1 Hz (baroreceptor, sympathetic) and HF around 0.25 Hz (respiration, parasympathetic). A dashed flat line shows a patient with CAN where peaks are lost."
        caption: "قمة الـ ==HF== جاية من النَفَس (vagus)، فلو اختفت = **parasympathetic dysfunction**. قمم الـ VLF والـ LF = **sympathetic**."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L07s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="fg-head"/></marker></defs>
