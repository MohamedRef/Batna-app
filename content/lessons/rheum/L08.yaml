        title: "العضلات والأعصاب والعين: كله ischaemia"
        quote: "Jaw claudication as in GCA."
        text: |
          الكتاب بيكمّل الجدول في ص 129، وكل علامة فيها تقدر تفهمها بكلمة ==ischaemia==:
          - **Muscles**: **jaw claudication** في الـ **GCA** و **arm claudication** في الـ **TA**. العضلة بتوجع **وهي شغالة** بس (مضغ أو رفع دراع)، لأن ساعتها بتحتاج دم أكتر والشريان الضيق مش بيوصّل.
          - **Nerves**: **mononeuropathies (acute onset)** و **mononeuritis multiplex**.
          - **CNS**: focal deficit، altered mental state، seizures.
          - **Genitourinary**: **testicular** و epididymal pain.
          - **Skin**: rash، purpura، infarcts، **livedo reticularis**، **Raynaud's**.
          - **Constitutional (B symptoms)**: fever، malaise، anorexia، weight loss، لأن الالتهاب نفسه بيطلّع cytokines.
          - **ENT**: otitis media، nasal obstruction أو epistaxis **في WG**.
      - kind: explain
        page: 129
        title: "البطن والخصية والجلد: ليه الأعضاء دي بالذات؟"
        quote: "Hepatic and pancreatic infarction."
        text: |
          الكتاب بيكمّل الخريطة: في البطن **ischaemic mucosal necrosis** مع hematemesis و melaena، **bowel infarction**، و **hepatic and pancreatic infarction**. في الـ genitourinary: **testicular pain**، epididymal pain، و ovarian involvement. وفي الجلد: rash، purpura، cutaneous infarcts، **livedo reticularis**، و Raynaud's.

          التفسير المقبول (مش في الكتاب) للرابط:
          - **البطن**: الأمعاء والكبد والبنكرياس متغذيين من شرايين ==medium-sized== (الـ mesenteric)، فلما تلتهب وتتقفل العضو يموت حتة حتة؛ ده اللي بيخلي وجع البطن بعد الأكل في شاب عنده ضغط عالي ونزول وزن علامة خطيرة.
          - **الخصية**: الشريان بتاعها **end artery** طويل ورفيع، فأي التهاب فيه بيبان بسرعة كوجع. عشان كده testicular pain واحدة من الـ ACR criteria بتاعة الـ PAN (ص 141).
          - **Livedo reticularis**: الشبكة البنفسجية دي بتطلع لما الشرايين الصغيرة اللي تحت الجلد تضيق، والدم يقعد في الأوردة اللي حواليها.

          يعني لما تشوف وجع خصية أو بطن مع **B symptoms**، افتكر الـ medium vessels قبل ما تفتكر الجراحة.
