      - kind: explain
        page: 200
        quote: "Pathology of NHL\n  1- Pattern: follicular or diffuse\n  2- Cell size:"
        title: "تلات أسئلة تحت الميكروسكوب"
        text: |
          الكتاب بيوصف الـ NHL بتلات حاجات:

          1. ==Pattern==: **follicular** ولا **diffuse**.
          2. **Cell size**: small (SLL، follicular، marginal zone)، intermediate (mantle، Burkitt، lymphoblastic)، ولا large (large cell).
          3. **Nuclear contour**: round، irregular (mantle)، **cleaved** (follicular)، convoluted (mycosis fungoides، Sézary، ATLL)، أو monocytoid (marginal zone).

          ليه الحجم بيفرق؟ التفسير المقبول (مش في الكتاب): الخلية **الكبيرة** غالبًا خلية بتستعد تتقسم، فالـ large cell بيمشي أسرع. والـ small خلايا هادية، فبيمشي أبطأ. وده بيمشي مع الـ WHO في ص 202: الـ small في الـ indolent، والـ large في الـ aggressive.
      - kind: figure
        page: 201
        quote: "(b) a follicular\nor nodular pattern in follicular\nlymphoma—the ‘follicles’ or\nnodules’ of neoplastic cells\ncompress surrounding tissue\nand lack a mantle of small\nlymphocytes,"
        title: "صورة الكتاب: diffuse ضد follicular"
        image: { file: hem/L12-nhl-diffuse-follicular.webp, book: true }
        alt: "Book photomicrographs of two lymph nodes at low power: (a) a uniform pink sheet of cells with no structure left; (b) many rounded nodules of cells pressed against each other, separated by thin darker bands."
        caption: "(a) diffuse: الغدة كلها اتملت خلايا ومفيش أي شكل طبيعي. (b) follicular: ==nodules== من الخلايا الخبيثة بتضغط اللي حواليها."
      - kind: explain
        page: 201
        quote: "(b) a follicular\nor nodular pattern in follicular\nlymphoma—the ‘follicles’ or\nnodules’ of neoplastic cells\ncompress surrounding tissue\nand lack a mantle of small\nlymphocytes,"
        title: "اقرا الصورة"
        text: |
          - **(a) Diffuse** (lymphocytic lymphoma): الـ **normal architecture totally replaced** بالـ neoplastic cells.
          - **(b) Follicular**: الـ «follicles» أو ==nodules== بتاعة الـ neoplastic cells بتضغط الـ tissue اللي حواليها، و **مفيش mantle** من الـ small lymphocytes.

          ليه الـ «مفيش mantle» هي العلامة؟ التفسير المقبول (مش في الكتاب): الـ follicle الطبيعي (reactive) ليه **حزام** من الـ small lymphocytes حواليه، زي سور. الـ follicle الخبيث مليان نفس الـ clone لحد الحرف وبيزق جيرانه، فالسور بيختفي. فلو شفت follicles **كتير ومزنوقة ومن غير سور**، فكّر في الـ follicular lymphoma (ص 204).
      - kind: figure
        page: 201
        quote: "Blood involvement by malignant lymphoma: (a) small cleaved lymphoid cells in follicle centre cell lymphoma; (b) mantle cell lymphoma; (c) large B-cell lymphoma."
        title: "صورة الكتاب: الـ lymphoma في الدم"
        image: { file: hem/L12-lymphoma-blood.webp, book: true }
        alt: "Three book photomicrographs of blood films. (a) Left: small dark blue lymphoid cells with notched, cleaved nuclei. (b) Middle: medium lymphoid cells with irregular, indented nuclei. (c) Right: large lymphoid cells with round nuclei and more cytoplasm."
        caption: |
          تلات صور دم، والحروف تحت كل واحدة:

          - **(a) شمال**: خلايا **صغيرة** زرقا غامقة، نواتها فيها **شق** (cleaved) = الـ ==follicle centre cell== (follicular) lymphoma.
          - **(b) النص**: خلايا متوسطة نواتها **غير منتظمة** = **mantle cell lymphoma**.
          - **(c) يمين**: خلايا **كبيرة** نواتها مدورة وcytoplasm أكتر = **large B-cell lymphoma**.

          ده نفس جدول ص 200 (الـ cell size والـ nuclear contour) بس في الدم: الـ NHL ممكن ينزل الـ ==peripheral blood== ويبان في الـ film.
