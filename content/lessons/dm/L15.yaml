          - النظام لازم يغطي **24 ساعة**: basal + rapid-acting analogs أحسن.
          - ==40-60%== من الـ TDD **basal** والباقي على تلات وجبات.
          - لو **NPO**: basal + correction كل 4-6 ساعات.
