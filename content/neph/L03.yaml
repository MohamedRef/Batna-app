      - Catheter-related complications (infection, stenosis, thrombosis)
      - Excess ultrafiltration (hypotension, prerenal azotemia, acute renal failure)
      - Allergic reactions to the circuit
    pass: 5
    src: { page: 74, quote: "Air embolus Hemorrhage from venous return disconnection Hemorrhage from hollow fiber blood leak Hemorrhage complicating systemic anticoagulation" }
    status: unverified
