        alt: "A staircase of four liver stiffness steps going down the page. 10 kPa: below it no cACLD and very low risk of liver-related events, at or above it cACLD. 15 kPa: below it with platelets above 150, no CSPH and low risk. 20 kPa: below it with platelets above 150, no endoscopy needed. 25 kPa: at or above it, CSPH and high risk of liver-related events. An arrow on the right shows risk rising down the page."
        caption: "عدّ بالخمسة: **10** تفتح cACLD، **15** (مع platelets أكتر من 150) تقفل CSPH، **20** (مع platelets أكتر من 150) تلغي المنظار، **25** تأكد CSPH."
