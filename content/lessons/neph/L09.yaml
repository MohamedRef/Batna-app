  - id: neph.L09.lesson9
    title: "أنواع الـ PD وكفايته ومضاعفاته"
    hook: "عيان بيغسل وهو نايم والبطن ناشفة بالنهار، وعيان تاني بيغير الكيس 4 مرات. مين صح؟ الـ PET هيقول."
    minutes: 9
    pages: [315, 318]
    topics: [pd-types, pd-complications]
    goals:
      - "تعرف الـ catheter وأنواع الـ PD (CAPD و APD)"
      - "تفهم الـ PET وتختار الـ regimen حسب نوع الـ transporter"
      - "تعرف المضاعفات وامتى الـ HD أحسن"
    status: unverified
    steps:
      - kind: explain
        page: 315
        title: "الـ catheter والأنواع"
        quote: "PD catheters utilised for peritoneal access are usually silicon catheters with 3 segments: intraperitoneal (perforated) segment, tunnelled segment with 2 Dacron cuffs at the ends to anchor the catheter and prevent bacterial migration, and extra peritoneal segment."
        text: |
          **Tenckhoff** silicone بـ 3 أجزاء: intraperitoneal مخرّم، tunnelled فيه ==2 Dacron cuffs== (تثبيت ومنع البكتيريا)، و extraperitoneal. الطرف في الـ **pelvis**، والـ exit site بعيد عن الـ midline بكام سنتي.

          التركيب: surgical، laparoscopic، blind Seldinger، أو fluoroscopy.

          **الأنواع**: ==continuous ambulatory peritoneal dialysis (CAPD)== (يدوي) و **automated peritoneal dialysis (APD)** (cycler): **nocturnal intermittent peritoneal dialysis (NIPD)** (البطن ناشفة بالنهار) و **continuous cycler-assisted peritoneal dialysis (CCPD)** (مبلولة بالنهار).

          ليه 2 Dacron cuffs؟ التفسير المقبول (مش في الكتاب): الـ Dacron بيعمل تليف حواليه فيثبّت الـ catheter. الـ cuff العميق بيقفل الطريق على البكتيريا قبل الـ peritoneum، والسطحي قبل الـ tunnel. يعني البكتيريا اللي على الجلد عند الـ exit site لازم تعدي حاجزين. وليه الطرف في الـ pelvis؟ لأنه أوطى مكان في البطن، فالمحلول بيتصرف كله بالجاذبية، والـ omentum أقل يلف حواليه. وليه الـ exit بعيد عن الـ midline؟ علشان الحزام والهدوم ما تحتكش فيه.
      - kind: figure
        page: 316
        title: "NIPD و CCPD و CAPD في اليوم"
        image: { file: neph/L09-pd-regimens.webp, book: true }
        caption: "البرتقالي = exchanges قصيرة، والأخضر = dwell طويل. الـ **NIPD** ليل بس والنهار ناشف، الـ **CCPD** ليل بالـ cycler ونهار مبلول، والـ **CAPD** dwell طويل بالليل و 3 بالنهار."
        alt: "Book figure of peritoneal volume over 24 hours: NIPD has four short night exchanges and an empty day; CCPD has four short night exchanges and one long day dwell; CAPD has one long night dwell and three day exchanges."
      - kind: check
        page: 316
        quote: "Nocturnal intermittent peritoneal dialysis (NIPD) dry day."
        question: "A PD patient works all day and wants an empty abdomen during the day. Which regimen?"
        options:
          - "NIPD: cycler at night, dry day"
          - "CCPD: cycler at night, wet day"
          - "CAPD: four manual exchanges"
          - "Acute PD"
        answer: 0
        why:
          - "صح: الـ ==nocturnal intermittent peritoneal dialysis== بالـ cycler بالليل، والبطن **dry** بالنهار."
          - "الـ CCPD بيسيب محلول في البطن بالنهار (wet)."
          - "الـ CAPD تغيير يدوي بالنهار."
          - "الـ acute PD للـ AKI."
      - kind: explain
        page: 317
        title: "الكفاية والـ PET"
        quote: "The PET peritoneal equilibration test: is to define the rates of the equilibration of solutes (e.g. glucose, creatinine and urea) between the peritoneal capillary blood and dialysate. The ratio of solute concentrations in dialysate and plasma (D/P ratio) at specific times (t) during the dwell signifies the extent of solute equilibration."
        text: |
          الهدف: ==Kt/V urea 2== أسبوعيًا و **creatinine clearance 60 L**/أسبوع/1.73 m² في الـ CAPD، وأعلى شوية في الـ APD. بيعتمد على عدد وحجم وقوة الـ exchanges والـ dwell time.

          الـ ==peritoneal equilibration test (PET)== بيقيس سرعة الـ equilibration بالـ **D/P ratio**:
          - **Fast transporter**: exchanges أكتر و dwell أقصر (cycler).
          - **Low transporter**: حجم أكبر (3 لتر بدل 2.5).

          الـ technique survival كانت 30–50% في 5 سنين. الفشل: **ultrafiltration (UF) failure**، clearance مش كفاية، و **peritonitis**. والـ PD بيكسب بدري (residual renal function).

          ليه الـ fast transporter بيخسر في الـ long dwell؟ التفسير المقبول (مش في الكتاب): الـ fast transporter غشاه بيعدّي بسرعة، فالـ urea بتتشال بسرعة (كويس)، بس **الـ glucose كمان** بيتمص بسرعة، فالـ osmotic gradient يختفي بعد ساعتين ثلاثة والمية ترجع للدم. فالحل dwells قصيرة بالـ cycler أو icodextrin للـ long dwell. والـ low transporter العكس: الـ gradient فاضل، بس الـ clearance بطيء، فمحتاج حجم أكبر أو dwell أطول عشان يكمّل الشغل.
      - kind: update
        page: 316
        quote: "AIM: Weekly Kt/V urea of 2 and creatinine clearance of 60 L per w per 1.73m2 in CAPD and slightly higher for APD. Depends on: Number,volume and strength of the exchanges and the dwell time of each exchange."
        text: "الكتاب بيقول Kt/V urea 2 و creatinine clearance 60 L في الأسبوع، ودي أرقام قديمة. الـ **KDOQI 2006** نزّل الحد الأدنى لـ ==total weekly Kt/V urea 1.7== (peritoneal + renal) بعد trials من المكسيك وهونج كونج، وشال هدف الـ creatinine clearance. والـ International Society for Peritoneal Dialysis 2020 بقت بتقول goal-directed, person-centred prescription من غير رقم واحد للـ small-solute clearance. في الامتحان اكتب إجابة الكتاب: 2 و 60."
        ref: "KDOQI peritoneal dialysis adequacy guideline 2006; International Society for Peritoneal Dialysis practice recommendations 2020"
      - kind: check
        page: 317
        quote: "In case of UF problems, the patients with fast transport properties can intensify their regime preferentially by employing more exchanges with shorter dwell times (cycler) . low transporters can increase the volume (3l instead of 2.5l). Alscher DM.EDTNA|ERCA JOURNAL 2005 XXXI 3 PD Technique survival in the seven studies in the 1990 was 30 to 50% at 5 Yr (Kidney Int 1998:54:2207-2217). Major causes of failure on long term are: UF failure, Inadequate solute clearance, peritonitis .Perit Dial Int 1999 19 {suppl 2]: S327-S328). Most studies demonstrate an early survival benefit among many subgroup of patients treated with PD. Due to most probably preservation of residual renal function."
        question: "Fast transporter on PET, poor UF on long dwells. Best change?"
        options:
          - "More exchanges, shorter dwells (cycler)"
          - "Longer dwells"
          - "Bigger 3 L bags only"
          - "Stop PD now"
        answer: 0
        why:
          - "صح: الـ fast transporter بيخسر الـ glucose gradient بسرعة، فالـ dwell القصير أحسن."
          - "الـ dwell الطويل هيرجّع المية للدم."
          - "ده للـ low transporter."
          - "الكتاب بيغيّر الـ regimen الأول."
      - kind: explain
        page: 317
        title: "ليه الـ PD بيكسب بدري ويخسر مع الوقت؟"
        quote: "Most studies demonstrate an early survival benefit among many subgroup of patients treated with PD."
        text: |
          الكتاب: الـ PD ليه ==early survival benefit== في subgroups كتير، غالبًا من **الحفاظ على الـ residual renal function**. بس الـ relative risk للموت **بيزيد مع مدة الـ PD**، ممكن من **volume status** بيسوء. وأسباب فشل الطريقة على المدى البعيد: **UF failure**، clearance مش كفاية، و **peritonitis**.

          ليه؟ التفسير المقبول (مش في الكتاب):
          - الـ PD شغال 24 ساعة بهدوء، فمفيش هبوط ضغط زي الـ HD، والكلية الباقية بتفضل متروية وبتشتغل. وكل mL من البول الباقي بيساعد في الـ clearance والمية.
          - مع السنين البول الباقي بيخلص، والـ PD لوحده clearance بتاعه محدود.
          - والسكر بيبوّظ الغشا (فقد الـ mesothelium وتليف)، فالـ UF يقل والمية تتراكم: ضغط عالي وقلب متضخم.
          يعني الـ PD ممتاز كـ «أول طريقة» لعيان لسه بيبول، ومحتاج متابعة للـ volume كل ما الوقت يعدي.

          وإيه اللي يحمي الغشا؟ التفسير المقبول (مش في الكتاب): أقل تركيز glucose يكفي، icodextrin للـ long dwell، محلول biocompatible بـ GDP قليل، ومنع الـ peritonitis (كل نوبة بتسيب ندبة). ولو الغشا اتليف جامد ممكن يحصل **encapsulating peritoneal sclerosis**: الأمعاء تتلف في قشرة ليفية وتنسد، وده سبب إن العيان اللي بقاله سنين طويلة على PD بيتحول HD.
      - kind: explain
        page: 318
        title: "المضاعفات ومين ما يعملش PD"
        quote: "Peritoneal membrane damage Permeability changes with time.Peritoneal membrane sclerosis. Impairment of peritoneal host defense. Contraindication for PD: No absolute but extracorporeal is preferred if: Ch respiratory insufficiency."
        text: |
          **المضاعفات**: mechanical (hernia، leaks، امتلاء البطن، إمساك، malposition)، ==peritonitis== و exit-site و tunnel infection، metabolic (سمنة، lipids، فقد بروتين)، وتلف الغشا (sclerosis).

          **مفيش contraindication مطلق**، بس الـ HD أحسن لو: chronic respiratory insufficiency، drains أو stoma، intestinal obstruction، عمليات بطن كتير، peritoneal malignancy، hernia كبيرة، cellulitis في جدار البطن، morbid obesity، و hypercatabolism.

          **Non-renal**: heart failure مقاوم، hypothermia شديدة، hyperuricaemia، hypercalcaemia شديدة، وأطفال الـ HD صعب عليهم.

          ليه الـ HD أحسن في الحالات دي؟ التفسير المقبول (مش في الكتاب):
          - **الرئة**: 2–3 لتر في البطن بيزقوا الـ diaphragm لفوق، والعيان اللي نفسه ضعيف هيتعب.
          - **العمليات الكتيرة والـ adhesions**: البطن مقسومة جيوب، فالمحلول ما يوصلش لكل الغشا.
          - **الـ hernia والـ stoma والـ drains**: الضغط بيكبّر الـ hernia، والـ stoma طريق للعدوى.
          - **الـ hypercatabolism**: الـ PD بطيء ومش هيلحق العيان اللي بيطلّع urea كتير (sepsis، حروق).
          وليه الـ PD مفيد في الـ hypothermia الشديدة؟ لأنك ممكن تدفّي العيان من جوّه بمحلول دافي.
      - kind: figure
        page: 317
        quote: "Fig. (10): Simple peritoneal sclerosis after several months of PD."
        title: "الـ peritoneum بعد شهور PD"
        image: { file: neph/L09-peritoneal-sclerosis.webp, book: true }
        alt: "Photomicrograph of peritoneal membrane: a thickened band of dense pink-brown fibrous tissue on top, lying over pale fat cells below."
        caption: |
          مقطع في الـ peritoneum:

          - **فوق**: طبقة وردي بني ==تخينة== من الـ fibrous tissue (الـ submesothelial layer اللي اتندّبت).
          - **تحت**: خلايا دهون فاتحة (الشكل الطبيعي تحت الغشا).

          اللي تاخده: ده ==simple peritoneal sclerosis==: الجلوكوز والـ glucose degradation products بيتخّنوا الغشا مع الوقت، فالـ UF بيقل، وده من أهم أسباب إن الـ PD يفشل على المدى الطويل.
      - kind: try
        items: [neph.L09.097, neph.L09.100, neph.L09.101, neph.L09.104, neph.L09.109]
    recap:
      - "Tenckhoff: 3 أجزاء و 2 Dacron cuffs، والطرف في الـ pelvis."
      - "CAPD يدوي؛ APD: NIPD (نهار ناشف) و CCPD (نهار مبلول)."
