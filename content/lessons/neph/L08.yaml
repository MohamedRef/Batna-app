      - "تفرّق الـ organized deposits بالحجم، وتجمّع نتايج الـ IF والـ EM لتشخيص"
    status: unverified
    steps:
      - kind: explain
        page: 256
        title: "Case 8: راجل 75 سنة بـ nephrotic"
        quote: "Serum protein electrophoresis was done showing M-band."
        text: |
          ex-smoker، **albumin 1.8**، urine albumin-to-creatinine ratio (uACR) 5517، **مفيش سكر** (HbA1c 5.3)، pleural effusion، و ==grade II left ventricle diastolic dysfunction==.

          كبير + nephrotic + قلب stiff ومفيش سكر = فكّر في **monoclonal disease**. الـ **serum protein electrophoresis (SPEP)** طلّع ==M-band==.

          ليه الـ «قلب stiff» مهم؟ التفسير المقبول (مش في الكتاب): الـ amyloid بيترسب في عضلة القلب نفسها، فالبطين يبقى ناشف وما بيرتاحش (**diastolic dysfunction**)، والـ pleural effusion جاية من القلب والـ albumin الواطي سوا.
          وليه «مفيش سكر» مهم؟ لأن أشهر سبب للـ nephrotic عند الكبير هو السكر. لما الـ HbA1c طبيعي، لازم تدوّر على حاجة تانية، وأول حاجة عند كبير فوق 60: **monoclonal protein** (AL amyloid أو deposition disease) و **cancer** (membranous). والـ M-band هنا فتح الباب.
      - kind: explain
        page: 256
        title: "الـ LM والـ Congo red"
        quote: "Examination of congo red stained sections viewed under polarized light revealed positive amyloid deposits in glomeruli and arterioles."
        text: |
          الـ **LM**: 26 glomeruli، 4 obsolescent؛ الـ patent فيها **almost complete tuft replacement by mesangial homogenous pink deposits** مع ==weak PAS reactivity==. والـ **Congo red** تحت الـ **polarized light**: ==positive amyloid deposits in glomeruli and arterioles==. والـ **immunophenotyping**: **AA negative**، و **AL lambda (+4)**.

          ليه الـ PAS ضعيف؟ التفسير المقبول (مش في الكتاب): الـ **diabetic nodules** معمولة من **matrix** (collagen و glycoproteins)، فبتاخد الـ PAS قوي. الـ **amyloid** بروتين **متطبّق fibrils** مش matrix، فالـ PAS عليه باهت. يعني نفس الـ nodule على الـ H&E، بس الـ PAS بيفرّق، والـ Congo red بيأكّد: الـ amyloid بيمسك الصبغة وبيدّي **apple-green birefringence** تحت الـ polarized light لأن الـ fibrils مترتبة في اتجاه واحد.

          ليه الـ amyloid بيتحط في الـ mesangium الأول؟ التفسير المقبول (مش في الكتاب): الـ mesangium بيشتغل زي «فلتر» بيلقط البروتينات الكبيرة من الدم. الـ light chains المطوية غلط بتتلقط هناك وتتجمع ألياف، وبعدين تزحف على الـ GBM والأوعية. ولما الـ GBM يتملي ألياف، الفلتر يخرم، فالـ proteinuria كبيرة جدًا (uACR 5517) من غير التهاب.

          وليه الـ polarized light بالذات؟ التفسير المقبول (مش في الكتاب): الـ Congo red لوحده بيصبغ حاجات كتير أحمر. بس الألياف المتطبقة بانتظام (beta-sheet) بتغيّر اتجاه الضوء، فتحت الـ polarizer بتلمع **apple-green**. ده اللي يفرّق الـ amyloid الحقيقي عن أي حاجة حمرا تانية، عشان كده التقرير بيكتب الاتنين.
