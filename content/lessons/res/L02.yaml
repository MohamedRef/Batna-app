schema: batna.lesson/v1
lecture: res.L02
lessons:
  # ------------------------------------------------------------------
  - id: res.L02.lesson1
    title: "الوبائيات في 3 كلمات"
    hook: "كام واحد عيان؟ فين ومين وإمتى؟ وليه هما بالذات؟ دي الـ epidemiology كلها."
    minutes: 8
    pages: [1, 15]
    topics: [definition, uses]
    goals:
      - "تعرّف الـ epidemiology بالـ 3 كلمات: frequency، distribution، determinants"
      - "تفرق بين descriptive وanalytic epidemiology"
      - "تعدّ الـ uses of epidemiology وترتب الـ natural history of disease"
    status: unverified
    steps:
      - kind: explain
        page: 3
        quote: "Epidemiology is the study of ▪ Frequency ▪ Distribution ▪ Determinants of health related phenomenon in the human population."
        title: "التعريف"
        text: |
          **Epidemiology** = دراسة الـ ==frequency== والـ ==distribution== والـ ==determinants== لأي health-related phenomenon في **human population**.

          - **Frequency**: كام؟ (rates وratios).
          - **Distribution**: المرض متوزع إزاي: **who? when? where?**
          - **Determinants**: إيه اللي بيخلي الـ risk مختلف بين مجموعة والتانية؟

          لاحظ: الطب الإكلينيكي بيبص على **عيان واحد**، والـ epidemiology بتبص على **population**.
      - kind: figure
        page: 5
        quote: "Low endemicity <2% Intermediate endemicity 2-8% High endemicity >8%"
        title: "Distribution على الخريطة"
        alt: "Three boxes from the slide map legend for hepatitis B endemicity: low below 2 percent, intermediate 2 to 8 percent, high above 8 percent."
        caption: "الخريطة دي بتجاوب «where?»: نفس الفيروس، بس الـ ==distribution== مختلف جدًا من بلد للتانية."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="18" text-anchor="middle" class="t-b">HBV endemicity (slide 5)</text>
            <rect x="10" y="34" width="100" height="40" rx="6" class="fg-good"/>
            <text x="60" y="52" text-anchor="middle" class="t-sm t-b">Low</text>
            <text x="60" y="67" text-anchor="middle" class="t-sm">&lt;2%</text>
            <rect x="115" y="34" width="100" height="40" rx="6" class="fg-acc"/>
            <text x="165" y="52" text-anchor="middle" class="t-sm t-b">Intermediate</text>
            <text x="165" y="67" text-anchor="middle" class="t-sm">2-8%</text>
            <rect x="220" y="34" width="100" height="40" rx="6" class="fg-bad"/>
            <text x="270" y="52" text-anchor="middle" class="t-sm t-b">High</text>
            <text x="270" y="67" text-anchor="middle" class="t-sm">&gt;8%</text>
            <text x="165" y="110" text-anchor="middle" class="t-sm t-mut">Same virus, very different burden</text>
            <text x="165" y="130" text-anchor="middle" class="t-sm t-mut">from one region to another</text>
            <text x="165" y="180" text-anchor="middle" class="t-sm">Who? When? Where? = distribution</text>
          </svg>
      - kind: table
        page: 8
        quote: "1.Frequency Rates & Ratios 2.Distribution Who? When? Where? Descriptive epidemiology"
        title: "Components of epidemiology"
        columns: ["Component", "Question", "Branch"]
        rows:
          - ["Frequency", "How many? (rates, ratios)", "Measurement"]
          - ["Distribution", "Who? When? Where?", "Descriptive epidemiology"]
          - ["Determinants", "Why? (causes, risk factors)", "Analytic epidemiology"]
        hide: [[1, 2], [2, 2]]
      - kind: explain
        page: 10
        quote: "Testing a hypothesis by studying how exposures relate to outcomes"
        title: "Descriptive بيولّد فرضية، وAnalytic بيختبرها"
        text: |
          - ==Descriptive epidemiology==: بتفحص وتبلّغ عن الـ **frequency and distribution**. بتعرف الـ basic features.
          - ==Analytic epidemiology==: بتدوّر على العوامل ورا المرض، **testing a hypothesis** بدراسة علاقة الـ **exposures** بالـ **outcomes**.

          الكوبري بينهم (slide 9): لما تعرف الـ frequency والـ distribution، تقدر **formulate a hypothesis** عن عوامل ممكن تكون causal أو preventive. وبعدين الـ analytic تختبرها.

          مثال: لاحظت إن الـ HCV أعلى في قرى الدلتا عند الكبار (descriptive). فرضيتك: حقن الـ tartar emetic القديمة. بتختبرها بـ case-control (analytic).
      - kind: order
        page: 11
        quote: "Descriptive Analytical Interventions Programs Disease prevention"
        prompt: "رتّب الـ logical sequence of epidemiology in disease prevention:"
        steps: ["Descriptive", "Analytical", "Interventions", "Programs"]
        why: "توصف ← تلاقي السبب ← تجرب حل ← تعمّمه في برنامج، والنتيجة disease prevention."
      - kind: explain
        page: 12
        quote: "1.Natural history of disease 2.Classification of disease 3.Identify determinants (risk factors) 4.Planning and evaluation"
        title: "الـ uses of epidemiology"
        text: |
          - **Natural history of disease**.
          - **Classification of disease**.
          - **Identify determinants** (risk factors).
          - **Planning and evaluation**: حجم المشكلة علشان تخطط الخدمات، وتقييم برنامج تطعيم مثلًا.
          - **Data on availability, accessibility and utilization** للخدمات.
      - kind: figure
        page: 13
        quote: "Natural history of disease timeline"
        title: "الـ natural history of disease"
        alt: "A horizontal timeline in four stages: susceptibility, subclinical disease, clinical disease, and recovery, disability or death. Arrows mark exposure (start of susceptibility to subclinical), pathologic changes (start of subclinical), onset of symptoms and the usual time of diagnosis (start of clinical disease)."
        caption: "التشخيص عادةً بيحصل ==بعد== الـ symptoms. كل اللي قبله (subclinical) هو هدف الـ screening."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L02n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="20" y="10" width="290" height="58" rx="6" class="fg-good"/>
            <text x="165" y="34" text-anchor="middle" class="t-b">1 Stage of susceptibility</text>
            <text x="165" y="54" text-anchor="middle" class="t-sm">ends with: exposure</text>
            <path d="M165 68v14" class="fg-arrow" marker-end="url(#L02n)"/>
            <rect x="20" y="86" width="290" height="58" rx="6" class="fg-acc"/>
            <text x="165" y="110" text-anchor="middle" class="t-b">2 Stage of subclinical disease</text>
            <text x="165" y="130" text-anchor="middle" class="t-sm">starts with: pathologic changes</text>
            <path d="M165 144v14" class="fg-arrow" marker-end="url(#L02n)"/>
            <rect x="20" y="162" width="290" height="72" rx="6" class="fg-bad"/>
            <text x="165" y="186" text-anchor="middle" class="t-b">3 Stage of clinical disease</text>
            <text x="165" y="206" text-anchor="middle" class="t-sm">starts with: onset of symptoms</text>
            <text x="165" y="224" text-anchor="middle" class="t-sm t-b">then the usual time of diagnosis</text>
            <path d="M165 234v14" class="fg-arrow" marker-end="url(#L02n)"/>
            <rect x="20" y="252" width="290" height="58" rx="6" class="fg-box"/>
            <text x="165" y="276" text-anchor="middle" class="t-b">4 Recovery, disability</text>
            <text x="165" y="296" text-anchor="middle" class="t-b">or death</text>
          </svg>
      - kind: check
        page: 13
        quote: "Pathologic Onset of Exposure Changes Symptoms"
        question: "A smoker has early dysplasia on bronchoscopy but no symptoms. Which stage of the natural history is he in?"
        options:
          - "Subclinical disease"
          - "Susceptibility"
          - "Clinical disease"
          - "Recovery, disability or death"
        answer: 0
        why:
          - "صح: فيه pathologic changes ومفيش symptoms."
          - "الـ susceptibility قبل أي تغير مرضي."
          - "الـ clinical تبدأ مع الـ onset of symptoms."
          - "لسه ماوصلش للنهاية."
      - kind: explain
        page: 14
        quote: "By mode of transmission ▪ Water born ▪ Food borne ▪ Vector born"
        title: "تصنيف الدكتور وتصنيف الوبائي"
        text: |
          - **Clinically (diarrheal, respiratory, febrile diseases)**: ده بيخدم ==treatment==. عيان سخن جدًا في منطقة malaria؟ فكّر malaria.
          - **Epidemiologically, by mode of transmission (water-borne, food-borne, vector-borne)**: ده بيخدم ==prevention==. لو المرض water-borne، الحل في المية.
      - kind: try
        items: [res.L02.001, res.L02.003, res.L02.009, res.L02.010]
    recap:
      - "Epidemiology = frequency + distribution + determinants في population."
      - "Descriptive: who/when/where ← hypothesis. Analytic: تختبر الـ hypothesis."
      - "Sequence: descriptive ← analytical ← interventions ← programs."
      - "Natural history: susceptibility ← subclinical ← clinical ← recovery/disability/death."
      - "Clinical classification للعلاج، epidemiological (by transmission) للوقاية."
    practice: [res.L02.001, res.L02.002, res.L02.003, res.L02.004, res.L02.005, res.L02.006, res.L02.007, res.L02.008, res.L02.009, res.L02.010, res.L02.011, res.L02.012, res.L02.013]
  # ------------------------------------------------------------------
  - id: res.L02.lesson2
    title: "الأرقام بتيجي منين؟ عدد، نسبة، ولا معدل؟"
    hook: "«عندنا 80 طفل malaria» جملة ناقصة. 80 من كام؟ وفي قد إيه؟ هنا بتفرق الـ count والـ proportion والـ rate."
    minutes: 7
    pages: [16, 23]
    topics: [sources, measures]
    goals:
      - "تعدّ الـ 9 sources of epidemiological data"
      - "تفرق بين count وproportion وrate"
    status: unverified
    steps:
      - kind: explain
        page: 16
        quote: "1.Census 2.Population estimates Planning services Computing rates"
        title: "9 مصادر للداتا"
        text: |
          - **Census** و**Population estimates**: بيدّوك الـ ==denominator==، لتخطيط الخدمات وحساب الـ rates.
          - **Vital records**: تسجيل المواليد والوفيات.
          - **Notification of infectious diseases**: بتوري الـ fluctuation في حدوث الأمراض المعدية.
          - **Disease registers**: لأمراض ليها أهمية public health: **National cancer registry in Egypt**، TB، hepatitis.
          - **Hospital records**: inpatient وoutpatient.
          - **Special subgroups records** (مدارس، مصانع، جيش...).
          - **Morbidity surveys**.
          - ==Record linkage==: ربط سجلات نفس الشخص من مصادر مختلفة.
      - kind: match
        page: 18
        quote: "5.Disease registers ▪ Diseases of public health importance Examples National cancer registry in EGYPT"
        prompt: "وصّل المثال بمصدر الداتا:"
        pairs:
          - ["National cancer registry in Egypt", "Disease register"]
          - ["Birth and death certificates", "Vital records"]
          - ["Linking one person's clinic and lab files", "Record linkage"]
          - ["Weekly reports of measles cases", "Notification"]
          - ["Counting the whole population every 10 years", "Census"]
        why: "الـ registers للأمراض المهمة، الـ vital records للمواليد والوفيات، الـ notification للأمراض المعدية، والـ census بيعدّ الكل."
      - kind: explain
        page: 21
        quote: "The proportion (percentage) of children among cases is(80/120) x 100 or 66.7%."
        title: "1. Count و 2. Proportion"
        text: |
          - **Counting cases (raw numbers)**: مفيد للتخطيط المباشر: عدد حالات الـ malaria السنة اللي فاتت علشان تعرف تطلب كام علبة **chloroquine**.
          - **Proportion (%)**: جزء من كل. من 120 حالة malaria في المستشفى، 80 أطفال:
          - **Children among cases = 80/120 × 100 = 66.7%**

          في الـ proportion الـ numerator ==جزء من== الـ denominator.
      - kind: explain
        page: 23
        quote: "It has a time dimension, whereas a PROPORTION does not."
        title: "3. Rate: فيه زمن"
        text: |
          الـ **rate** = الـ relative frequency للحالات في population ==خلال فترة زمنية محددة== (غالبًا سنة).

          - بيتكتب غالبًا **per 100 أو per 1000** population.
          - أمثلة: birth rate، growth rate، accident rate، morbidity وmortality rates.
          - الفرق الجوهري: الـ rate ليه **time dimension**، والـ **proportion** لأ.
      - kind: aside
        tone: analogy
        page: 23
        quote: "Usually expressed per 100 or perl 000 population."
        text: |
          الـ count زي «العربية مشيت 100 كيلو». الـ proportion زي «مشيت ربع المسافة». الـ rate زي «==100 كيلو في الساعة==»: من غير الزمن مالهاش معنى.
      - kind: check
        page: 23
        quote: "It has a time dimension, whereas a PROPORTION does not."
        question: "What distinguishes a rate from a proportion?"
        options:
          - "A rate has a time dimension; a proportion does not"
          - "A proportion has a time dimension; a rate does not"
          - "A rate is always a percentage"
          - "A proportion's numerator is not part of its denominator"
        answer: 0
        why:
          - "صح، slide 23."
          - "العكس."
          - "الـ rates غالبًا per 1000؛ الـ attack rate بس هو اللي غالبًا %."
          - "في الـ proportion الـ numerator جزء من الـ denominator."
      - kind: try
        items: [res.L02.014, res.L02.015, res.L02.020]
    recap:
      - "9 مصادر: census، population estimates، vital records، notification، registers، hospital records، special subgroups، morbidity surveys، record linkage."
      - "Count = رقم خام للتخطيط. Proportion = جزء من كل. Rate = ومعاه زمن."
    practice: [res.L02.014, res.L02.015, res.L02.016, res.L02.017, res.L02.018, res.L02.019, res.L02.020, res.L02.021]
  # ------------------------------------------------------------------
  - id: res.L02.lesson3
    title: "Incidence: الحالات الجديدة بس"
    hook: "75 واحد اتعشوا في فرح و46 جالهم إسهال. الـ attack rate كام؟ وليه في الـ incidence بنشيل اللي عيان أصلًا؟"
    minutes: 8
    pages: [24, 36]
    topics: [incidence, prevalence]
    goals:
      - "تكتب الـ incidence rate formula صح: new cases وpopulation at risk"
      - "تعرف الـ attack rate وخصائصه وتحسبه"
      - "تشيل اللي عيان أصلًا من الـ denominator"
    status: unverified
    steps:
      - kind: explain
        page: 25
        quote: "Number of new cases during a specific period Total midperiod population at risk"
        title: "الـ incidence rate"
        text: |
          المعادلة:

          - **Incidence rate = new cases during a specific period ÷ total midperiod population at risk**

          ركّز على الـ ==new cases== والـ ==at risk==.

          كلمتين مهمين:

          - **New**: الحالات القديمة مش محسوبة.
          - **At risk**: اللي عنده المرض أصلًا (أو immune) مش at risk، يبقى يطلع من المقام.

          الـ incidence بتقيس ==سرعة== ظهور المرض (rapidity of occurrence).
      - kind: explain
        page: 26
        quote: "An attack rate is a specific type of incidence rate. It is calculated for a narrowly defined population observed for a limited time"
        title: "الـ attack rate: incidence وقت الأزمة"
        text: |
          الـ **attack rate** = نوع خاص من الـ incidence rate، بنحسبه لـ population محددة ضيقة لفترة قصيرة، زي ==outbreak== أو epidemic، وغالبًا للأمراض المعدية.

          - **Attack rate = new cases during the period ÷ population at risk at the beginning of the period × 100**

          وهو مقياس للـ ==probability or risk== إنك تبقى case.
      - kind: mnemonic
        page: 28
        quote: "Restricted to a special age group ➢Limited by “place” variables ➢Time period is usually brief : limited period of risk"
        word: "APTP"
        parts:
          - { key: "A", text: "Age group: restricted to a special one" }
          - { key: "P", text: "Place variables limit it" }
          - { key: "T", text: "Time period is brief (limited period of risk)" }
          - { key: "P", text: "Percentage: usually expressed as one" }
        hook: |
          الـ attack rate بيهجم زي **APTP**: على **سن** معين، في **مكان** معين، في **وقت** قصير، وبيتكتب **%**.
      - kind: case
        page: 29
        quote: "Then, the attack rate for GI illness is 46/75 x 100 = 61%"
        stem: "فرح في المنصورة: 75 معزوم، و46 منهم جالهم gastroenteritis خلال الـ incubation period."
        steps:
          - question: "What is the numerator?"
            options: ["46", "75", "29"]
            answer: 0
            why: "x = الحالات اللي حصلت خلال الـ incubation period بين اللي حضروا = 46."
          - question: "What is the attack rate?"
            options: ["61%", "46%", "39%", "163%"]
            answer: 0
            why: "46/75 × 100 = 61%. يعني الـ risk إنك تتعب لو اتعشيت في الفرح ده = 61%."
      - kind: explain
        page: 34
        quote: "Year 1, 5 individuals developed the outcome"
        title: "مثال المجموعة: 30 واحد على 3 سنين"
        text: |
          30 شخص متابعين:

          - سنة 1: **5** جالهم المرض.
          - سنة 2: **7** زيادة.
          - سنة 3: **4** زيادة.

          (مفيش حد خف أو مات.)
      - kind: reveal
        page: 36
        quote: "25 people at risk (5 people already developed the disease in Year 1 and are thus not at risk)"
        prompt: "الـ incidence في سنة 2 كام؟ 7/30 ولا حاجة تانية؟"
        answer: |
          **7/25 = 0.28 = 28%**.

          الـ numerator = **7 new cases** في سنة 2.
          الـ denominator = 30 − 5 = ==25 at risk==: الـ 5 بتوع سنة 1 عيانين أصلًا، مش ممكن «يجيلهم» المرض تاني.

          لو قسمت على 30 (23%) يبقى وقعت في أشهر فخ.
      - kind: check
        page: 36
        quote: "25 people at risk (5 people already developed the disease in Year 1 and are thus not at risk)"
        question: "Same cohort of 30: what is the incidence in year 3?"
        options: ["4/18 = 22%", "4/30 = 13%", "4/25 = 16%", "16/30 = 53%"]
        answer: 0
        why:
          - "صح: at risk = 30 − (5 + 7) = 18، والجديد 4."
          - "نسيت تشيل الـ 12 اللي عيانين."
          - "شلت بتوع سنة 1 بس، ونسيت بتوع سنة 2."
          - "ده الـ prevalence في آخر سنة 3، مش incidence."
      - kind: try
        items: [res.L02.022, res.L02.024, res.L02.025]
    recap:
      - "Incidence = **new cases** ÷ **population at risk** (midperiod)، وبتقيس سرعة ظهور المرض."
      - "Attack rate = incidence في outbreak: **APTP** (age، place، time قصير، %)."
      - "اللي عيان أصلًا مش at risk: اطرحه من المقام."
    practice: [res.L02.022, res.L02.023, res.L02.024, res.L02.025, res.L02.026, res.L02.030]
  # ------------------------------------------------------------------
  - id: res.L02.lesson4
    title: "البانيو: prevalence = incidence × duration"
    hook: "الحنفية بتملا، والبلاعتين بيفضّوا. لو قفلت بلاعة الموت، البانيو هيعمل إيه؟"
    minutes: 10
    pages: [30, 43]
    topics: [prevalence]
    goals:
      - "تفرق بين point وperiod prevalence"
      - "تفرق بين incidence وprevalence في 4 خصائص"
      - "تستخدم P = I × D وتحل أسئلة الـ slides"
    status: unverified
    steps:
      - kind: table
        page: 31
        quote: "Number of existing cases at a Point prevalence = specific point of time ; Total midpoint population at risk"
        title: "Prevalence rate"
        columns: ["Type", "Numerator", "Denominator"]
        rows:
          - ["Point prevalence", "Existing cases at a specific point of time", "Total midpoint population at risk"]
          - ["Period prevalence", "Existing cases during a specific period", "Total midperiod population at risk"]
        hide: [[0, 1], [1, 1]]
      - kind: explain
        page: 32
        quote: "They indicate amount of illness requiring care. •Affected by migration of diseased people. •Easier to measure than incidence rate."
        title: "الـ prevalence مفيد في إيه؟"
        text: |
          الـ **prevalence** = ==existing cases== (القديم + الجديد) في وقت أو فترة.

          - بيوري **amount of illness requiring care**: كام سرير وكام علبة دوا محتاجين.
          - بيتأثر بـ **migration of diseased people**: لو عيانين الـ dialysis بيروحوا يعيشوا جنب مركز كويس، الـ prevalence هناك بيعلى.
          - ==Easier to measure== من الـ incidence: مسح واحد (cross-sectional) بيكفي، بينما الـ incidence محتاج متابعة.
      - kind: table
        page: 33
        quote: "Rapidity of disease occurrence Newly diagnosed"
        title: "Incidence vs prevalence"
        columns: ["Characteristic", "Incidence", "Prevalence"]
        rows:
          - ["What is measured", "Rapidity of disease occurrence", "Proportion of population with disease"]
          - ["Time of diagnosis", "Newly diagnosed", "Surviving cases diagnosed at any time"]
          - ["Period of time", "Study period that allows monitoring occurrence", "Specific time"]
          - ["Denominator", "Population at risk", "Whole population"]
        hide: [[0, 1], [0, 2], [1, 2], [3, 1], [3, 2]]
      - kind: reveal
        page: 35
        quote: "Prevalence = 12/30 = 0.4 The prevalence of disease in Year 2 is 40%"
        prompt: "نرجع للـ 30 شخص: 5 في سنة 1 و7 في سنة 2. الـ prevalence في سنة 2 كام؟"
        answer: |
          **12/30 = 40%**.

          الـ numerator = **كل** الحالات الموجودة: 5 + 7 = 12.
          الـ denominator = ==whole population== = 30.

          قارن بالـ incidence اللي طلعت 7/25 = 28%: نفس الداتا، سؤالين مختلفين.
      - kind: figure
        page: 40
        quote: "Relationship Between Prevalence and Incidence Recovery"
        title: "The epidemiologist's bathtub"
        alt: "A bathtub. A tap above pours water labelled incidence (new cases). The water in the tub is labelled prevalence. Steam rising off the top is labelled recovery, and a drain at the bottom is labelled death (mortality). Below: prevalence equals incidence times average duration, assuming constant incidence."
        caption: "الحنفية = ==incidence==. المية = ==prevalence==. البخار (recovery) والبلاعة (death) بيفضّوا. الـ duration = المية بتقعد قد إيه قبل ما تخرج."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L02b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
