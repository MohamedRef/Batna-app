  - id: rheum.L17.lesson3
    title: "الـ criteria والـ activity: من New York للـ ASAS"
    hook: "الـ New York بيستنى الـ X-ray سنين. الـ ASAS بيقبل الـ MRI أو الـ HLA-B27. والـ ASDAS بيقولك العلاج نافع ولا لأ."
    minutes: 9
    pages: [287, 289]
    topics: [criteria, activity]
    goals:
      - "تطبّق الـ modified New York وتعرف ليه بيأخّر"
      - "تطبّق الـ ASAS axial و peripheral وتعرف ليه ليه بابين"
      - "تعرف الـ BASDAI والـ ASDAS وعيوبهم"
    status: unverified
    steps:
      - kind: explain
        page: 287
        title: "الـ modified New York 1984"
        quote: "Define AS if radiologic criterion is associated with at least one clinical criterion."
        text: |
          **Clinical**:
          1. Low back pain و stiffness **3 شهور**، تتحسّن بالرياضة ومش بالراحة
          2. حركة الـ lumbar محدودة في الـ sagittal والـ frontal
          3. الـ chest expansion محدود (حسب السن والجنس)

          **Radiological**: sacroiliitis **grade 2 أو أكتر bilateral** أو **3-4 unilateral**.

          ==AS = radiological + clinical واحد على الأقل==.

          ليه لازم radiological؟ علشان الـ low back pain منتشر جدًا، فالـ clinical لوحده هيلبّس ناس كتير AS غلط. بس ده نفسه سبب التأخير (الخطوة الجاية).
      - kind: aside
        tone: trap
        page: 288
        quote: "The sacroiliitis on imaging should show definite radiographic disease at grade 2 bilateral or grade 3 to 4 unilateral (according to modified NY criteria 1984); or there should be active (acute) inflammation of sacroiliac joints on MRI."
        text: "خلي بالك: ص 287 في الكتاب مكتوب \"grade 1 - 2 bilaterally\"، بس ص 288 بيقول **grade 2 bilateral** وده المعروف في الـ modified NY. اكتب **grade 2 bilateral أو 3-4 unilateral**."
      - kind: reveal
        page: 287
        quote: "Reasons for the delay in diagnosis are:\n  Lack of a pathognomonic clinical feature or laboratory test.\n  Low back pain is extremely common in the general population (misdiagnosis common).\n  Radiographic sacroiliitis, which has been a cornerstone of diagnosing AS (New York criteria), may take several years to develop.\n  Introduction of MRI as one of the key diagnostic tools in detecting the earliest signs of inflammation (early diagnosis leads to early initiation of effective treatment and improves outcome.).\n  Development of new classification criteria for SpA."
        prompt: "ليه التشخيص بالـ New York بيتأخر 8-11 سنة؟"
        answer: "مفيش علامة أو تحليل **pathognomonic**، والـ low back pain منتشر جدًا فبيتقال mechanical، والأهم إن الـ **radiographic sacroiliitis بياخد سنين** عشان يظهر. الحل: **MRI** و **ASAS criteria** جديدة."
      - kind: explain
        page: 287
        title: "ليه الـ ASAS اتعمل؟"
        quote: "Introduction of MRI as one of the key diagnostic tools in detecting the earliest signs of inflammation (early diagnosis leads to early initiation of effective treatment and improves outcome.)."
        text: |
          الكتاب بيقول الحل للتأخير كان حاجتين: ==MRI== يشوف أول علامات الالتهاب، و **classification criteria جديدة**. والسبب مكتوب: **early diagnosis** ← علاج فعّال بدري ← outcome أحسن.

          والـ ASAS axial ليه بابين:
          - **Imaging arm**: sacroiliitis في الصورة (X-ray grade 2 bilateral أو 3–4 unilateral، **أو active inflammation في الـ MRI**) + feature واحد. الـ MRI هنا هو اللي بيلحق اللي الـ X-ray لسه ما شافهوش.
          - **Clinical arm**: ==HLA-B27== + feature-ين. التفسير المقبول (مش في الكتاب): ده للعيان اللي حتى الـ MRI بتاعه سليم، فالـ HLA-B27 (90–95% من الـ AS) بيعوّض الصورة، بس لازم featureين علشان الـ HLA-B27 موجود في 1% من الناس العاديين.
      - kind: figure
        remind: [rheum.L17.064]
        page: 288
        quote: "HLA-B27\n  Plus 2 or more other SpA features."
        title: "الـ ASAS axial: بابين"
        alt: "Entry box: back pain 3 months or more, onset before 45. Two arms below. Imaging arm: sacroiliitis on X-ray or MRI plus one or more SpA feature. Clinical arm: HLA-B27 plus two or more other SpA features. A list of SpA features sits underneath: inflammatory back pain, arthritis, enthesitis, uveitis, dactylitis, psoriasis, Crohn or UC, good NSAID response, family history, raised CRP, HLA-B27."
        caption: "يا **sacroiliitis في الصورة + feature واحد**، يا **HLA-B27 + 2 features**. الـ clinical arm ما محتاجش صورة خالص."
