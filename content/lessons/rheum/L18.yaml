      - kind: explain
        page: 308
        title: "المرض الـ systemic"
        quote: "Immunosuppressive agents should be mainly used as GC-sparing agents, with no evidence supporting the choice of one agent over another."
        text: |
          - **Fatigue/pain:** دوّر على concomitant diseases، قيس بـ tools، و analgesics بحساب الفايدة والضرر.
          - فصّل العلاج على شدة كل organ بالـ ==European Alliance of Associations for Rheumatology (EULAR) Sjögren's Syndrome Disease Activity Index (ESSDAI)==.
          - **Glucocorticoids** بأقل جرعة وأقصر مدة.
          - **Immunosuppressants** كـ **GC-sparing**، ومفيش واحد أحسن من التاني.
          - **B-cell targeted** للـ severe refractory.
          - الترتيب: Glucocorticoids (GCs) ← immunosuppressants ← biologics (sequential أو combined).
          - **B-cell lymphoma** حسب الـ histological subtype والـ stage.

          يعني العلاج على قد الـ organ: كلى أو أعصاب أو vasculitis تاخد علاج أقوى، والـ fatigue لوحده لأ. وده سبب استخدام الـ ESSDAI.
