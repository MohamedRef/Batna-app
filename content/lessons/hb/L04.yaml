      - kind: explain
        page: 89
        quote: "Stop warfarin for 5 days before endoscopy. Check INR prior to procedure to ensure INR<1.5. Restart warfarin evening of procedure with usual daily dose"
        title: "Anticoagulants: high-risk procedure"
        text: |
          **Warfarin + low thrombotic risk** (xenograft valve، AF من غير high-risk factors، أكتر من 3 شهور بعد VTE):

          - وقّف الـ warfarin 5 أيام قبل المنظار.
          - اتأكد إن الـ INR < 1.5 قبل الـ procedure.
          - ارجع نفس الليلة بالجرعة العادية.
          - اعمل INR بعد أسبوع.

          **Warfarin + high thrombotic risk** (metal valve mitral أو aortic، valve + AF، AF + mitral stenosis، AF مع stroke/TIA في آخر 3 شهور، VTE في آخر 3 شهور):

          - نفس الخطة، بس مع ==LMWH bridging==. الترتيب في الخطوة الجاية.

          **DOAC:**

          - آخر جرعة قبل المنظار بـ 3 أيام.
          - الـ dabigatran مع CrCl 30–50: آخر جرعة قبلها بـ 5 أيام، لأنه بيطلع من الكلى أكتر من الباقيين.
          - ارجع بعد 2–3 أيام.
