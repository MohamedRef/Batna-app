            <text x="82" y="152" text-anchor="middle" class="t-sm">GPI anchors hold them</text>
            <text x="82" y="172" text-anchor="middle" class="t-sm t-mut">complement blocked</text>
            <rect x="170" y="8" width="155" height="185" rx="10" class="fg-bad"/>
