  - id: rheum.L03.103
    kind: mcq
    topic: type3
    stem: "A 35-year-old woman presents with progressive joint pain, swelling and a skin rash two weeks after a new antibiotic for sinus infection. She has fever, fatigue and dark urine, palpable purpura on the legs, tender joints, raised inflammatory markers and low complement. What type of hypersensitivity reaction is this?"
    options: ["Type III hypersensitivity", "Type I hypersensitivity", "Type II hypersensitivity", "Type IV hypersensitivity"]
    answer: 0
    why:
      - "Correct: drug antigen, delay of days, vasculitis, arthritis and GN with low complement is immune complex (type III) disease."
      - "Type I reactions come within minutes with urticaria, bronchospasm and shock."
      - "Type II targets cell surface antigens, for example haemolysis, not purpura with low complement and nephritis."
      - "Type IV is T cell mediated, does not consume complement and causes no immune complex vasculitis."
    src: { page: 65, quote: "Often combination of = Vasculitis + arthritis and nephritis." }
