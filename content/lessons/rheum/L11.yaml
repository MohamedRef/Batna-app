  - id: rheum.L11.lesson1
    title: "المناعة جيش: مين اللي وقع؟"
    hook: "ستة أبواب لنقص المناعة الأولي، وكل باب بيقولك نوع الميكروب اللي هييجي. ابدأ بالخريطة وبالأسئلة اللي هتسألها."
    minutes: 8
    pages: [180, 181]
    topics: [types, evaluation]
    goals:
      - "تعدّ أنواع الـ primary immunodeficiency حسب الذراع وتعرف كل مرض فين"
      - "تعرف ليه كل سؤال في الـ history والـ examination بيتسأل"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L11.001]
        page: 180
        title: "ستة أبواب"
        quote: "B cell deficiencies.\nT cell deficiencies.\nCombined T cell & B cell abnormalities.\nComplement Deficiencies.\nPhagocyte deficiencies.\nVarious unknown."
        text: |
          الكتاب بيقسم الـ primary immunodeficiency على ==ستة أبواب==:
          1. **B cell deficiencies**: X-linked agammaglobulinaemia (XLA)، selective Ig deficiency
          2. **T cell deficiencies**: DiGeorge، chronic mucocutaneous candidiasis، hyper-IgM (الكتاب حاطه هنا)
          3. **Combined T & B**: ==Severe combined immunodeficiency (SCID)==، Wiskott-Aldrich، ataxia-telangiectasia
          4. **Complement deficiencies**
          5. **Phagocyte deficiencies**: LAD، chronic granulomatous disease (CGD)، Chédiak-Higashi، Job's (hyper-IgE)، cyclic neutropenia
          6. **Various unknown**

          ليه التقسيم بالذراع مش بالعضو؟ التفسير المقبول (مش في الكتاب): كل ذراع في المناعة متخصص في نوع ميكروب، فلما تعرف الذراع اللي وقع تقدر تتوقع الـ infection، والعكس كمان: الميكروب بيدلّك على الذراع.
      - kind: figure
        page: 180
        quote: "B cell deficiencies.\nT cell deficiencies.\nCombined T cell & B cell abnormalities.\nComplement Deficiencies.\nPhagocyte deficiencies.\nVarious unknown."
        title: "الجيش بفرقه"
        alt: "A tree. Primary immunodeficiency splits into the adaptive arm (B cell, T cell, and combined T and B) and the innate arm (complement and phagocytes), plus various or unknown (CVID). Under each box a typical example: XLA, DiGeorge, SCID, hereditary angioedema, CGD."
        caption: "الكتاب بيدّي ستة أبواب. التجميع لـ ==adaptive== و ==innate== من عندنا (مش في الكتاب) عشان تفتكر: B و T والاتنين مع بعض فوق، والـ complement والـ phagocytes تحت."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L11t" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="fg-head"/></marker></defs>
