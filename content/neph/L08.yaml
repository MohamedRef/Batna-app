      - reveal: "LM: 9 normal glomeruli. IHC: IgA, IgG, IgM and C4d negative."
        question: Which test decides the diagnosis now?
        options: [Electron microscopy, Repeat light microscopy, Congo red, Anti-PLA2R in tissue]
        answer: 0
