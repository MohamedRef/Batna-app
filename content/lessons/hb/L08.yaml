  # ------------------------------------------------------------------
  - id: hb.L08.lesson1
    title: "الدوا اللي بيعالج... وبيأذي الكبد"
    hook: "أي دوا تقريبًا ممكن يعمل DILI. الفرق كله: هل الأذى بالجرعة ولا بالحظ؟"
    minutes: 9
    pages: [125, 128]
    topics: [overview, mechanism, classification]
    goals:
      - "تعرف أهم خطوة في علاج أي DILI"
      - "تحفظ الـ WHO grading بالأرقام"
      - "تفرّق بين الـ predictable والـ idiosyncratic وأمثلة كل واحد"
      - "تعرف كل خلية في الكبد بيصيبها إيه"
    status: unverified
    steps:
      - kind: explain
        page: 125
        quote: "Drug-induced liver injury (DILI) is a prevalent disorder that can be led on by almost all drug types. The majority of benign DILI cases become better after drug discontinuation. To stop the development of acute or chronic liver failure, it is crucial to identify and get rid of the offending substance as soon as feasible. DILI does not have any identified risk factors, but certain people may be more susceptible due to genetic vulnerability and previous liver disease."
        title: "الصورة الكبيرة"
        text: |
          الـ **DILI** (drug-induced liver injury) شائع، وممكن ييجي من almost all drug types.

          - **Course**: أغلب الحالات benign وبتتحسن بعد drug discontinuation.
          - **Most important step**: ==identify and get rid of the offending substance== في أسرع وقت، علشان نمنع acute or chronic liver failure.
          - **Who gets it**: مفيش identified risk factors واضحة، بس فيه ناس أكتر عرضة بسبب **genetic vulnerability** و previous liver disease.
          - **Picture**: أغلبهم أعراضهم زي أي مرض كبد تاني، وبعضهم بيبان عليه **systemic hypersensitivity**.
          - **Treatment**: ==rapid drug withdrawal== + supportive care.

          يعني مفيش antidote سحري لأغلب الأدوية. السلاح الحقيقي إنك تشك بدري وتوقف الدوا بدري.
      - kind: table
        page: 125
        quote: "Class 3 (Moderate): 5 - 10 times ULN (ALT 251 - 500 U/L). Class 4 (Severe): >10 times ULN (ALT > 500 U/L)."
        title: "تعريف الـ WHO للـ hepatotoxicity"
        columns: ["Class", "× ULN", "ALT (U/L)"]
        rows:
          - ["1 (mild)", "< 2.5", "51–125"]
          - ["2 (mild)", "2.5–5", "126–250"]
          - ["3 (moderate)", "5–10", "251–500"]
          - ["4 (severe)", "> 10", "> 500"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [3, 2]]
      - kind: aside
        tone: tip
        page: 125
        quote: "Class 2 (Mild): 2.5 - 5 times ULN (ALT 126 - 250 U/L). Class 3 (Moderate): 5 - 10 times ULN (ALT 251 - 500 U/L)."
        text: |
          الحدود **2.5 → 5 → 10**: كل حد تقريبًا ضعف اللي قبله. ولاحظ إن أول اتنين **mild** الاتنين، والـ **severe** بس فوق **10×** (alanine aminotransferase (ALT) > 500).
      - kind: check
        page: 125
        quote: "Class 3 (Moderate): 5 - 10 times ULN (ALT 251 - 500 U/L). Class 4 (Severe): >10 times ULN (ALT > 500 U/L)."
        question: "A patient on a new drug has ALT 320 U/L. By the WHO grading in the lecture, this is:"
        options:
          - "Class 3 (moderate)"
          - "Class 2 (mild)"
          - "Class 4 (severe)"
          - "Class 1 (mild)"
        answer: 0
        why:
          - "صح: **251–500 U/L** = **5–10× upper limit of normal (ULN)** = class 3."
          - "Class 2 لحد **250** بس."
          - "Class 4 لازم **> 500**."
          - "Class 1 لحد **125**."
      - kind: explain
        page: 126
        quote: "10 fold increase in No. of reported cases between 1964-1973 in Japan."
        title: "قد إيه شائع؟"
        text: |
          أرقام الـ incidence في الكتاب:

          - **10 fold increase** في الحالات المبلّغ عنها في اليابان بين 1964 و 1973.
          - **10%** من حالات الـ hepatitis في مركز كبير في فرنسا.
          - **20%** من الـ jaundice في كبار السن في أمريكا.
          - **9%** من المرضى في المستشفى اللي عندهم **aspartate aminotransferase (AST) ≥ 400 IU/L** في بريطانيا.
          - ==25–40%== من الـ **fulminant hepatic failure**.
      - kind: figure
        page: 126
        quote: "Mechanism of drug-induced liver injury\n  A: Drug → (CYPs, etc.) Metabolite → HPC Stress\n  B: Metabolite + Protein → Hapten → B-cell, T-cell Activation → Antibodies, Cytotoxic T-Cells → Drug Reexposure → Liver Injury\n  HPC Stress, GI Stress, Disease → TLR Agonists (PAMPs, DAMPs)\n  D: TLR Agonists → Inflammatory Stress (ROS, cytokines, proteases, hemostasis, etc.) → (Danger Signal) → Liver Injury\n  C: HPC Stress + Inflammatory Stress → Cell Death Signaling, Mito Dysfunction, etc. → Liver Injury\n  E: Liver Injury → Liver Failure\n  F: Liver Injury → Adaptation Recovery → Normal Liver"
        title: "تلات طرق الدوا بيأذي بيها الكبد"
        alt: "Three lanes converge on liver injury. Direct lane: drug or CYP metabolite causes hepatocyte stress, then cell death signalling and mitochondrial dysfunction. Inflammation lane: GI stress and disease give TLR agonists (PAMPs, DAMPs), then inflammatory stress with ROS and cytokines as a danger signal. Immune lane: metabolite binds protein to form a hapten, B and T cells activate, and on drug re-exposure antibodies and cytotoxic T cells attack. Liver injury then leads either to adaptation and recovery to a normal liver, or to liver failure."
        caption: "الكبد بعد الإصابة عنده طريقين: **adaptation/recovery** يرجع طبيعي، أو **liver failure**."
