items:
  # ---------- p185-186: background ----------
  - id: dm.L15.001
    kind: card
    topic: background
    front: What kind of insulin deficiency underlies DKA, and what kind underlies HHS?
    back: "DKA: absolute insulin deficiency. HHS: relative insulin deficiency."
    src: { page: 185, quote: "DKA: Absolute insulin deficiency HHS: Relative insulin deficiency" }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.002
    kind: cloze
    topic: background
    text: Nearly {{c1::1%}} of hospitalizations in people with diabetes are for hyperglycemic crises, and DKA hospitalizations rose by {{c2::55%}} in the past decade, especially in adults under {{c3::45}}.
    src: { page: 185, quote: "55% increase in the rate of DKA hospitalizations, especially in adults aged <45 years" }
    status: unverified
    tags: [numbers]
  - id: dm.L15.003
    kind: cloze
    topic: background
    text: DKA accounts for {{c1::14%}} of hospital admissions of patients with diabetes, and almost {{c2::50%}} of diabetes-related admissions in young people.
    src: { page: 185, quote: "DKA accounts for 14% of all hospital admissions of patients with diabetes." }
    status: unverified
    tags: [numbers]
  - id: dm.L15.004
    kind: card
    topic: background
    front: Who typically gets DKA, and what is its mortality in adults?
    back: Young adults aged 18-44 (61.7%) with type 1 DM (70.6%); adult mortality is below 1%. It is the most common cause of death in children and adolescents with T1DM.
    src: { page: 186, quote: "In adult subjects with DKA, the overall mortality is <1%." }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.005
    kind: table
    topic: background
    title: Epidemiology of DKA vs HHS
    columns: [Feature, DKA, HHS]
    rows:
      - [Frequency, "More common; 14% of diabetic admissions", "Less common; 1% of diabetic admissions"]
      - [Typical age, "Young adults 18-44", "Middle-aged 45-64"]
      - [Mortality, "<1% in adults", "Considerably higher, 5-20%"]
    blanks: [[1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 186, quote: "Mortality attributed to HHS is considerably higher 5–20%." }
    status: unverified
    tags: [numbers, high-yield]
  # ---------- p186-187: pathogenesis ----------
  - id: dm.L15.006
    kind: enumerate
    topic: pathogenesis
    prompt: Enumerate the precipitating factors of DKA with their share.
    points:
      - "Stressful conditions: infection is the most common (30-40%)"
      - "Others: trauma, surgery, cardiovascular events and drugs"
      - "Discontinued or inadequate insulin, and new-onset T1DM (15-25%)"
      - "No precipitating cause (20-25%)"
    pass: 3
    src: { page: 186, quote: "Infections (most common, 30-40%)" }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.007
    kind: cloze
    topic: pathogenesis
    text: "DKA precipitants: infection {{c1::30-40%}}, stopped or inadequate insulin and new T1DM {{c2::15-25%}}, no cause found {{c3::20-25%}}."
    src: { page: 187, quote: "Discontinuation of or inadequate insulin therapy & New onset Type 1 DM. (15-25%)" }
    status: unverified
    tags: [numbers]
  - id: dm.L15.008
    kind: card
    topic: pathogenesis
    front: What proportion of DKA patients have a past history of T1DM?
    back: Two thirds; DKA is a cardinal feature of T1DM.
    src: { page: 187, quote: "DKA is a cardinal feature of T1DM. 2/3 have a past history of T1DM" }
    status: unverified
  - id: dm.L15.009
    kind: card
    topic: pathogenesis
    front: What should the clinician do when DKA occurs in type 2 DM?
    back: “Look under the sheets”, with an intensive search for the precipitating factor.
    src: { page: 187, quote: "When DKA occurs in an individual with T2DM, the clinician should ―look under the sheets‖" }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.010
    kind: enumerate
    topic: pathogenesis
    prompt: Enumerate the precipitating factors of HHS.
    points:
      - Infection (the most common)
      - Restricted water intake from the altered thirst response of the elderly
      - Delayed recognition of hyperglycemic symptoms (20% have no known diabetes)
    pass: 3
    src: { page: 187, quote: "Restricted water intake due to altered thirst response of the elderly." }
    status: unverified
  - id: dm.L15.011
    kind: cloze
    topic: pathogenesis
    text: About {{c1::20%}} of patients with HHS have no previous history of diabetes.
    src: { page: 187, quote: "Delayed recognition of hyperglycemic symptoms (20% of these patients have no history of diabetes)." }
    status: unverified
    tags: [numbers]
  - id: dm.L15.012
    kind: card
    topic: pathogenesis
    front: Why is there ketoacidosis in DKA but little or no ketosis in HHS (pathogenesis figure)?
    back: Absolute insulin deficiency with counter-regulatory hormones drives lipolysis, FFA delivery to the liver and ketogenesis (DKA). In HHS relative insulin deficiency leaves enough insulin to keep ketogenesis absent or minimal, while hyperglycemia, osmotic diuresis and poor intake cause dehydration and hyperosmolarity.
    src: { page: 186, quote: "Pathogenesis of DKA & HHS" }
    status: unverified
    tags: [high-yield]
