  # ------------------------------------------------------------------
  - id: hb.L06.lesson6
    title: "أدوية السكر اللي بتفيد الكبد"
    hook: "pioglitazone ولا metformin؟ GLP-1 ولا SGLT2؟ مين عنده دليل حقيقي ومين لسه في الفيران."
    minutes: 8
    pages: [107, 109]
    topics: [drugs]
    goals:
      - "تعرف مين حسّن الـ histology في RCTs ومين لأ"
      - "تعدّ أفعال الـ liraglutide"
      - "تفرّق بين دليل في الفيران ودليل RCT"
    status: unverified
    steps:
      - kind: explain
        page: 107
        title: "Insulin sensitizing agents"
        text: |
          الفكرة: لو الـ insulin resistance هي الجذر المشترك، يبقى الدوا اللي بيحسّنها لازم يفيد الكبد. جدول الكتاب جرّب ده على TZDs و metformin:

          - ==Pioglitazone== (لوحده، أو مع vitamin E، أو ± diet): الـ ALT اتحسّن، والـ histology اتحسّنت في الدراسات اللي قاستها، ومنهم RCTs (Sanyal و Belfort).
          - ==Metformin==: الـ ALT اتحسّن، بس الـ histology بياناتها قليلة ومتضاربة: RCT إيجابي (Bugianesi) و RCT سلبي (Uygun).

          الدرس: تحسّن الـ ALT لوحده مش كفاية. السؤال الحقيقي: الـ histology اتحسّنت ولا لأ؟
      - kind: check
        page: 107
        question: "In the insulin-sensitizer table, which drug improved liver histology in RCTs?"
        options:
          - "Pioglitazone"
          - "Metformin, consistently"
          - "Neither; only ALT improved"
          - "Sulfonylureas"
        answer: 0
        why:
          - "صح: pioglitazone (+ vit E أو ± diet) حسّن الـ histology في RCTs."
          - "الـ metformin: RCT واحد إيجابي وواحد سلبي، يعني **mixed**."
          - "الـ histology اتحسنت مع pioglitazone."
          - "مش موجودة في الجدول أصلًا."
      - kind: explain
        page: 107
        title: "GLP-1 analogue: liraglutide"
        text: |
          الـ ==liraglutide== بيشتغل على أكتر من جبهة في نفس الوقت (أفعاله في الكتاب):

          - **Controls serum glucose**
          - **Induces insulin secretion**
          - **Reduces glucagon secretion**
          - **Weight loss**، مع suppression of appetite و delayed gastric emptying

          وزن أقل = دهون أقل رايحة للكبد، فده اللي بيربطه بالـ MASLD.
      - kind: aside
        tone: analogy
        text: |
          الـ GLP-1 زي **بوّاب العمارة الشاطر**: بيفتح الباب للـ insulin، ويقفل في وش الـ glucagon، ويقول للمعدة «براحة، واحد واحد» (delayed gastric emptying)، ويقفل التلاجة بالليل (appetite). والنتيجة وزن أقل ودهون أقل في الكبد.
      - kind: explain
        page: 108
        title: "DPP-4 و SGLT2: الدليل مختلف"
        text: |
          هنا الامتحان بيسأل عن **مستوى الدليل**، مش بس النتيجة:

          - **Linagliptin (DPP-4 inhibitor)**: عنده high exposure in hepatic tissue، وعمل anti-inflammatory و anti-steatotic activity. بس ده كان في ==mouse model== of NASH (Klein, 2013). يعني لسه ماتجربش على بني آدمين في الكتاب.
          - **Empagliflozin (SGLT2 inhibitor)**: ==RCT== (double-blind، placebo-controlled) في NAFLD without T2DM (Taheri, 2020). حسّن الـ steatosis، والأهم الـ fibrosis، بالـ transient elastography والـ CAP.

          لاحظ إن الـ empagliflozin اشتغل في ناس من غير سكر. يعني الفايدة على الكبد مش جاية من تظبيط السكر بس.
