  - id: rheum.L11.lesson2
    title: "الفحوصات: من الرخيص للدقيق"
    hook: "CBC و ESR وجلد بيتحقن: قبل الـ flow cytometry، فيه فحوصات بقروش بتقول كتير."
    minutes: 9
    pages: [182, 187]
    topics: [evaluation, tests]
    goals:
      - "ترتب الـ screening لكل ذراع وتعرف كل تحليل بيقيس إيه"
      - "تعرف دلالة الـ ESR وعدد الـ lymphocytes"
      - "تحفظ مين الخلايا الغايبة في كل SCID، والصور والـ biopsy"
    status: unverified
    steps:
      - kind: table
        page: 182
        quote: "Quantitative immunoglobulins - IgG, IgM, IgA.\nSpecific antibodies - anti-tetanus, polio virus, rubella, isohemagglutinins (anti-A, anti-B)."
        title: "الـ screening حسب الذراع"
        columns: [Arm, First tests]
        rows:
          - ["B cell", "IgG, IgM, IgA; specific antibodies (tetanus, isohemagglutinins)"]
          - ["T cell", "Lymphocyte count; delayed skin tests"]
          - ["Complement", "CH50"]
          - ["Phagocyte", "Neutrophil count and function"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 182
        title: "كل تحليل بيقيس إيه؟"
        quote: "B cell immunity.\nQuantitative immunoglobulins - IgG, IgM, IgA.\nSpecific antibodies - anti-tetanus, polio virus, rubella, isohemagglutinins (anti-A, anti-B).\nT cell immunity\nWhite blood cell count and differential count (% lymphocytes)\nT cell enumeration and T cell subsets (T helper and T suppressor cells)\nSkin tests for delayed hypersensitivity (PPD, mumps antigen, Candida antigen, etc.)"
        text: |
          - **B cell:** ==quantitative immunoglobulins== (IgG، IgM، IgA) بتقيس الكمية، والـ **specific antibodies** (tetanus، polio، rubella، و isohaemagglutinins anti-A و anti-B) بتقيس هل بيعرف يعمل antibody لما يقابل antigen
          - **T cell:** WBC و differential (% lymphocytes)، عدّ الـ T cells و subsets (helper و suppressor)، و ==skin tests== للـ delayed hypersensitivity (PPD، mumps، Candida)
          - **Other:** نسبة الـ neutrophils والـ monocytes، و serum complement

          ليه الـ skin test بيقيس T؟ التفسير المقبول (مش في الكتاب): الـ delayed hypersensitivity تفاعل بتعمله T cells فاكرة الـ antigen، فلو الجلد ما احمرّش بعد 48 ساعة لحاجة أكيد اتعرض لها (زي Candida)، يبقى الـ T مش شغالة.
      - kind: reveal
        page: 182
        quote: "Specific antibodies - anti-tetanus, polio virus, rubella, isohemagglutinins (anti-A, anti-B)."
        prompt: "ليه الـ isohaemagglutinins (anti-A و anti-B) تحليل مفيد للـ B cells؟"
        answer: |
          دي ==natural antibodies== ضد فصايل الدم التانية، كل الناس بتعملها لوحدها من غير تطعيم (التفسير المقبول، مش في الكتاب). فلو مستواها واطي، يبقى الـ **B cell** مش بيعرف يعمل antibodies. ميزتها إنها ما بتحتاجش تطعّم وتستنى.
      - kind: explain
        page: 184
        title: "أرقام تفتكرها"
        quote: "Since T cells normally comprise about 75% of all circulating lymphocytes, lymphocyte counts are usually low in patients with severe T cell defects. Absolute lymphocyte counts below 1500/cu.mm. in adults and 4000/cu.mm. in children less than 1 year of age are abnormal."
        text: |
          - الـ **T cells** حوالي **75%** من الـ lymphocytes، علشان كده لو الـ ==absolute lymphocyte count== قل يبقى غالبًا T (الكتاب بيدّي السبب ده بنفسه)
          - الحد: **<1500** في الكبار و **<4000** في الطفل تحت سنة = abnormal. الطفل رقمه أعلى لأن الطبيعي عنده lymphocytes أكتر (التفسير المقبول، مش في الكتاب)
          - ==Normal erythrocyte sedimentation rate (ESR)== تقريبًا بينفي **chronic bacterial infection**. التفسير المقبول (مش في الكتاب): الالتهاب البكتيري المزمن بيرفع بروتينات الالتهاب اللي بتخلي كرات الدم تترسب أسرع
          - **Skin tests** للـ delayed hypersensitivity: طريقة **inexpensive** للـ T cell
      - kind: explain
        page: 185
        title: "لما الـ screening يطلع غلط"
        quote: "If screening tests are abnormal or if the history strongly suggests an immune deficiency more sophisticated (and more expensive) tests can be ordered.\nFor example, specific antibodies against diphtheria, tetanus, polio virus, and pneumococcal polysaccharides, and H. influenza can be measured after immunization."
        text: |
          لو الـ screening غلط أو الـ history قوية، الكتاب بيطلب تحاليل ==more sophisticated (and more expensive)==:
          - **Specific antibodies after immunization**: diphtheria، tetanus، polio، pneumococcal polysaccharides، H. influenzae
          - **Flow cytometry**: عدّ B و T و natural killer cells و subsets
          - Leukocyte numbers وfunction، و ==total haemolytic complement (CH50)== ومكونات الـ complement واحدة واحدة

          ليه "after immunization"؟ التفسير المقبول (مش في الكتاب): بتديله التطعيم وتقيس قبل وبعد، فبتشوف الـ B cell وهو بيشتغل فعلًا مش بس موجود. والـ CH50 بيحتاج الـ classical pathway كلها عشان يكسّر كرات الدم، فأي مكوّن ناقص يوطّيه.
      - kind: figure
        page: 185
        quote: "If screening tests are abnormal or if the history strongly suggests an immune deficiency more sophisticated (and more expensive) tests can be ordered.\nFor example, specific antibodies against diphtheria, tetanus, polio virus, and pneumococcal polysaccharides, and H. influenza can be measured after immunization."
        title: "من الرخيص للدقيق"
        alt: "A funnel of four narrowing levels. Top, cheap screen for everyone: CBC with differential, IgG IgM IgA, CH50, skin tests, neutrophil count. Arrow: if abnormal or the history is strong. Second, sophisticated and expensive: antibodies after vaccines, flow cytometry of B, T and NK cells, function tests. Third, imaging: chest X-ray, HRCT as criterion standard. Bottom, narrowest: biopsy only when needed, a fast-growing node or thymoma."
