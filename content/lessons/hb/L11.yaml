      - kind: explain
        page: 194
        quote: "Cyclosporine, G-mercaptopurine, cyclophosphamide and myco- phenolate mofetil have been also used successfully in isolated cases with drug toxicity to prednisone"
        title: "Autoimmune hepatitis"
        text: |
          الـ immunosuppression هنا بتهدّي المناعة اللي بتهاجم الكبد. بس ممكن متبقاش indicated في:

          - **inactive cirrhosis**: الالتهاب خلص وفاضل تليّف بس، فمفيش حاجة نهدّيها.
          - preexisting comorbid conditions: الدوا ممكن يأذي أكتر ما يفيد.
          - drug intolerance.

          الشرح اللي جنب أول اتنين منطق مقبول؛ الكتاب كاتب القايمة بس.

          الجرعات حسب **AASLD** في الكتاب:

          - ==prednisone 10 mg/day + azathioprine==
          - أو ==prednisone 20 mg/day== لوحده، وده الـ higher dose

          الـ azathioprine بيسمح إننا ننزّل جرعة الـ steroid للنص، ودي ميزته.

          لو فيه toxicity من prednisone أو azathioprine: cyclosporine، 6-mercaptopurine، cyclophosphamide، و mycophenolate mofetil اتستخدموا بنجاح في isolated cases.

          خلي بالك: الكتاب مكتوب فيه «G-mercaptopurine»، ودي غلطة طباعة. المقصود ==6-mercaptopurine==، الـ 6 اتقرت G. لو كتبتها في الورقة اكتب 6-MP.
      - kind: update
        page: 194
        quote: "AASLD practice guidelines state that treatment regimens should include prednisone (10 mg/day) in combination with azathioprine or higher dose prednisone"
        text: |
          الجرعات اللي في الكتاب، 10 mg مع AZA أو 20 mg لوحده، شكلها جرعات **maintenance**.

          الـ **induction** في AASLD أعلى:

          - prednisone 20-40 mg + azathioprine
          - أو prednisone 40-60 mg لوحده

          **في الامتحان: أرقام الكتاب.**
        ref: "AASLD AIH practice guidance 2019"
      - kind: match
