  - id: rheum.L12.lesson4
    title: "التحاليل والـ prognosis والـ MAS"
    hook: "طفل systemic JIA الـ ESR بتاعه نزل فجأة. أوعى تفرح: ده ممكن يكون أخطر خبر في المحاضرة."
    minutes: 9
    pages: [203, 205]
    topics: [labs, prognosis, mas]
    goals:
      - "تعرف إن مفيش diagnostic test وتحفظ نسب الـ ANA و RF"
      - "تعرف عوامل الـ prognosis الوحش ومواعيد فحص العين"
      - "تلقط الـ MAS بدري من التحاليل"
    status: unverified
    steps:
      - kind: explain
        page: 203
        quote: "There are no diagnostic tests"
        title: "التحاليل: مفيش test بيشخّص"
        text: |
          - ==No diagnostic test==. التشخيص history و exam.
          - الـ acute phase reactants: **normal أو mildly raised**.
          - ESR عالي لوحده من غير أي دليل التهاب تاني: فكّر في **hyperfibrinogenaemia** (نادر).
          - **ANA في 40–75%**، ومستواه مش بيمشي مع النشاط.
          - **RF في 5%** بس.
          - Plain X-ray لتقييم الـ joint damage.
      - kind: explain
        page: 204
        quote: "Anaemia, thrombocytosis, leucocytosis. 2- Raised acute phase reactants. 3- Most childrens are sero negative for RF and ANA."
        title: "تحاليل الـ systemic onset"
        text: |
          - Anaemia، **thrombocytosis**، leucocytosis.
          - Acute phase reactants عالية.
          - أغلبهم **seronegative** للـ RF والـ ANA.
          - Hypoalbuminaemia (multifactorial)، ولو معاها ==heavy proteinuria== فكّر في **amyloidosis**.
      - kind: explain
        page: 204
        quote: "Prognosis is related more to the disease course than to the onset type persistant oligoarticular disease is associated with the best articular outcome"
        title: "الـ Prognosis"
        text: |
          الـ prognosis بيمشي مع ==the course== أكتر من الـ onset type. **Persistent oligo** أحسن outcome، و extended بدري (أول سنة أو تانية) أوحش.

          عوامل الخطر:

          - Systemic onset مع infection أو amyloidosis أو MAS.
          - Polyarticular disease.
          - **RF و anti-CCP** إيجابي.
          - محتاج systemic corticosteroids.
          - سن أصغر عند البداية.
          - Female gender.
      - kind: table
        page: 204
        quote: "Those with iridocyclitis and ANA positive oligoarthritis require slit lamp evaluation every 4 months."
        title: "متابعة العين"
        columns: ["Group", "Slit lamp"]
        rows:
          - ["Iridocyclitis or ANA+ oligo", "Every 4 months"]
          - ["ANA negative", "Every 6 months"]
        hide: [[0, 1], [1, 1]]
      - kind: explain
        page: 205
        quote: "About 5–8% of children with systemic juvenile idiopathic arthritis develop a life-threatening complication known as macrophage activation syndrome."
        title: "الـ Macrophage activation syndrome"
        text: |
          **5–8%** من الـ systemic JIA بيجيلهم ==MAS==، وهو life-threatening.

          - **Clinical**: حمى مستمرة فجأة، pancytopenia، hepatosplenomegaly، liver insufficiency، coagulopathy بنزيف، أعراض عصبية.
          - **Labs**: triglycerides عالية، **sodium واطي**، و **ferritin عالي جدًا**.
          - في الـ marrow: macrophages بتاكل الـ haemopoietic cells (haemophagocytosis).
      - kind: figure
        page: 205
        quote: "Increasingly abnormal coagulation studies, rising ferritin, or a sudden drop in ESR or platelet count are harbingers of the onset of macrophage activation syndrome"
        title: "علامات الإنذار"
        alt: "Two panels. Top: active systemic JIA, with platelets, ESR and fibrinogen arrows pointing up. Bottom: evolving MAS, with platelets and ESR arrows pointing down, ferritin, triglycerides and D-dimer pointing up, sodium down."
        caption: "الـ systemic JIA العادي: platelets و ESR عاليين. لو نزلوا فجأة والـ ferritin طلع، ده الـ MAS جاي."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R12u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
              <marker id="R12d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="5" y="5" width="320" height="110" rx="8" class="fg-box"/>
            <text x="15" y="27" class="t-b">Active systemic JIA</text>
            <path d="M30 95V60" class="fg-arrow-acc" marker-end="url(#R12u)"/>
            <text x="42" y="80" class="t-sm">Platelets</text>
            <path d="M130 95V60" class="fg-arrow-acc" marker-end="url(#R12u)"/>
            <text x="142" y="80" class="t-sm">ESR</text>
            <path d="M210 95V60" class="fg-arrow-acc" marker-end="url(#R12u)"/>
            <text x="222" y="80" class="t-sm">WBC, CRP</text>
            <rect x="5" y="130" width="320" height="165" rx="8" class="fg-bad"/>
            <text x="15" y="152" class="t-b t-bad">Evolving MAS</text>
            <path d="M30 170V205" class="fg-arrow-bad" marker-end="url(#R12d)"/>
            <text x="42" y="190" class="t-sm">Platelets</text>
            <path d="M130 170V205" class="fg-arrow-bad" marker-end="url(#R12d)"/>
            <text x="142" y="190" class="t-sm">ESR</text>
            <path d="M210 170V205" class="fg-arrow-bad" marker-end="url(#R12d)"/>
            <text x="222" y="190" class="t-sm">Sodium</text>
            <path d="M30 275V240" class="fg-arrow-acc" marker-end="url(#R12u)"/>
            <text x="42" y="260" class="t-sm">Ferritin</text>
            <path d="M130 275V240" class="fg-arrow-acc" marker-end="url(#R12u)"/>
            <text x="142" y="260" class="t-sm">TG</text>
            <path d="M210 275V240" class="fg-arrow-acc" marker-end="url(#R12u)"/>
            <text x="222" y="260" class="t-sm">D-dimer, PT</text>
          </svg>
      - kind: reveal
        page: 205
        quote: "The presence of a low-grade ‗DIC-like‘ laboratory picture with increased D-dimer, abnormal PT and PTT and increased ferritin is frequently present without clinical hemorrhage."
        prompt: "ليه الـ ESR بينزل في الـ MAS مع إن العيان أتعب؟"
        answer: "الكتاب بيقول فيه DIC-like picture (D-dimer عالي، PT و PTT مش مظبوطين). الـ coagulopathy بتستهلك الـ fibrinogen، والـ fibrinogen هو اللي بيرفع الـ ESR، فالـ ESR يقع. عشان كده الـ ESR اللي بينزل فجأة في طفل systemic تعبان علامة خطر، مش تحسن."
      - kind: explain
        page: 205
        quote: "Medications, especially NSAIDs, intramuscular gold, and sulfasalazine, and more recently, etanercept."
        title: "الـ Triggers"
        text: |
          - **Viral illness** قبلها.
          - أدوية: ==NSAIDs==، intramuscular gold، **sulfasalazine**، ومؤخرًا **etanercept**.

          الاكتشاف والعلاج بدري قبل الـ multisystem involvement بيحسن الـ outcome.
      - kind: aside
        tone: joke
        page: 205
        quote: "rising ferritin, or a sudden drop in ESR or platelet count are harbingers of the onset of macrophage activation syndrome (MAS)."
        text: "الـ ferritin في الـ MAS زي سعر الدولار في الأزمات: كل ما تبص تلاقيه أعلى. ولما الـ ESR يهدى فجأة، ده الهدوء اللي قبل العاصفة."
      - kind: check
        page: 205
        quote: "Laboratory features include raised triglyceride concentrations, low sodium concentrations, and pronounced increased ferritin concentrations."
        question: "Which lab set fits MAS?"
        options: ["High ferritin, high triglycerides, low sodium", "Low ferritin, low triglycerides", "High platelets, high ESR", "High fibrinogen, high albumin", "Positive RF and anti-CCP"]
        answer: 0
        why:
          - "صح: دي الـ labs اللي في الكتاب."
          - "العكس تمامًا."
          - "دي صورة الـ active systemic JIA، مش الـ MAS."
          - "الـ fibrinogen بيتستهلك في الـ DIC-like picture."
          - "دي poor prognostic markers في الـ poly."
      - kind: try
        items: [rheum.L12.051, rheum.L12.053, rheum.L12.056, rheum.L12.057, rheum.L12.063]
    recap:
      - "مفيش diagnostic test؛ ANA 40–75%، RF 5%."
      - "Systemic: anaemia، thrombocytosis، leucocytosis، seronegative."
      - "Prognosis مع الـ course؛ persistent oligo أحسن."
