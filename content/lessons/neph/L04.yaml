  - id: neph.L04.lesson7
    title: "الـ renal artery stenosis"
    hook: "ضغط جديد بعد الخمسين، أو creatinine طلع بعد ACEi؟ فكّر في الشريان."
    minutes: 8
    pages: [95, 96]
    topics: [renovascular]
    goals:
      - "تعرف صور الـ RAS وأسبابه"
      - "تعد علامات الـ screening (SWAP RABH) وتعرف ليه كل واحدة"
      - "تختار test التشخيص وتعرف تمنه"
    status: unverified
    steps:
      - kind: explain
        remind: [neph.L04.105]
        page: 95
        title: "Renal artery stenosis"
        quote: "Clinical Syndrome associated with renal artery stenosis.\n1- Reno vascular HT (RVHT).\n2- Progressive loss of RF due to ischemic nephropathey\n3- Recurrent episodes of flash, pulmonary edema\n4- Asymptomatic"
        text: |
          **4 صور:** renovascular HT، **ischemic nephropathy**، **flash pulmonary edema** متكرر، أو asymptomatic.

          **الآلية:** stenosis significant ← ↓renal perfusion ← ==renin–angiotensin–aldosterone system (RAAS) activation== ← renovascular hypertension (RVHT).

          **السبب:**
          - **Atherosclerosis:** الشائع، في الكبار، و **15%** يوصلوا end-stage renal disease (ESRD).
          - ==Fibromuscular dysplasia==: ستات صغيرين.
      - kind: explain
        page: 95
        quote: "Renal failure precipitated, By RAAS antagonists."
        title: "ليه كل علامة screening بتشاور على الـ RAS؟"
        text: |
          الكتاب بيعدّ إمتى ندوّر على الـ RAS (SWAP RABH). التفسير المقبول (مش في الكتاب):

          - **Renal failure بعد RAAS antagonist:** الكلية اللي وراها ضيق بتحافظ على الـ GFR بإنها **تضيّق الـ efferent** بالـ angiotensin II. لما تقفل الـ angiotensin II، الـ efferent يفتح والـ GFR يقع.
          - **Unexplained hypokalemia:** الكلية الـ ischemic بتطلّع renin كتير ← aldosterone ← K بيضيع.
          - **Flash pulmonary edema:** خصوصًا لو الاتنين ضيقين، الكلية **مش بتقدر** تطلّع الصوديوم بالضغط، **فـ** الـ volume يتجمع فجأة في الرئة.
          - **Unilateral atrophic kidney:** الكلية اللي مش واصلها دم كفاية **بتنكمش**.
          - **Bruit:** الدم بيعدّي الضيق بسرعة ويعمل صوت.
          - **Other atherosclerotic lesions:** نفس المرض في كل الشرايين.
      - kind: mnemonic
        page: 95
        quote: "Screening for RAI is needed in the following conditions\na- Sudden onset of HT in healthy youger < 30 or older age > 50 year\nb- Rapid worsening of control of previously well treated HT\nC- Recurrent onset of flash PE.\nD- Renal failure precipitated, By RAAS antagonists.\ne- Unilateral atrophic kidney.\nF- Bruit\nG- Unexplained hypokalemia.\nH- Other stenotic atherosclerotic Lesions in other vascular beds."
        word: "SWAP RABH"
        parts:
          - { key: "S", text: "Sudden onset HT, <30 or >50 years" }
          - { key: "W", text: "Worsening of previously well-controlled HT" }
          - { key: "A", text: "Atrophic kidney on one side" }
          - { key: "P", text: "Pulmonary edema, recurrent flash" }
          - { key: "R", text: "Renal failure after RAAS antagonists" }
          - { key: "A", text: "Atherosclerosis in other vascular beds" }
          - { key: "B", text: "Bruit" }
          - { key: "H", text: "Hypokalemia, unexplained" }
        hook: "**SWAP RABH**: «بدّل الربح»: لو العيان فيه واحدة من التمانية دول، بدّل الـ plan ودوّر على RAS."
      - kind: figure
        page: 95
        quote: "Renal failure precipitated, By RAAS antagonists."
        title: "ليه الـ ACEi بيوقّع الكلية اللي وراها RAS؟"
        alt: "Two glomeruli side by side. Left, labelled RAS untreated: a narrow afferent arteriole with a stenosis, a glomerulus, and an efferent arteriole squeezed by angiotensin II, keeping glomerular pressure and GFR up. This is why renal failure is precipitated by RAAS antagonists. Right, labelled after ACE inhibitor: the same narrow afferent, the efferent now wide open, pressure in the glomerulus falls and GFR drops."
        caption: "مع الـ RAS الـ GFR **معتمد** على الـ angiotensin II اللي بيضيّق الـ efferent. الـ ACEi بيفتح الـ efferent فالضغط جوه الـ glomerulus يقع. **الرسمة شرح مقبول، مش من الكتاب.**"
