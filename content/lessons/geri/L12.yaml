        why: "الـ force-feeding والـ restraint physical حتى لو شكلهم «رعاية». العزل الاجتماعي والتهديد بالدار psychological."
      - kind: reveal
        page: 214
        quote: "Infliction of pain or injury"
        prompt: "الـ caregiver بيقول: «أنا بربطه عشان ما يقعش، وبأكّله بالعافية عشان ما يضعفش». ليه الكتاب بيحسب الـ restraint والـ force-feeding physical abuse؟"
        answer: |
          الكتاب بيعرّف الـ physical abuse بإنه **infliction of pain or injury**، وبيحط الـ **force-feeding** والـ **restraint** في الأمثلة جنب الضرب.

          التفسير المقبول (مش في الكتاب): اللي بيحدد الإساءة هو اللي حصل للمريض، مش نية الـ caregiver. الربط بيعمل جروح وتيبّس وقرح، وممكن يزوّد الهياج والوقوع. والأكل بالعافية ممكن يعمل aspiration. وغالبًا وراهم caregiver مضغوط ومحتاج مساعدة، مش بس لوم.
      - kind: explain
        page: 214
        quote: "Relatives include adult children and their spouses or partners, their offspring and other extended family members. Children and living relatives who have a history of substance abuse or have had other life troubles are of particular .concern."
        title: "مين المؤذي؟"
        text: |
          أي حد: زوج أو زوجة، ولاد، قرايب، جار، متطوع، عامل بأجر، ممارس صحي، محامي، أو أي حد عايز ياخد موارد شخص ضعيف.

          الأخطر: ==children and relatives== اللي عندهم **substance abuse** أو مشاكل في حياتهم.

          ليه الولاد اللي عندهم substance abuse بالذات؟ التفسير المقبول (مش في الكتاب): الإدمان محتاج فلوس، والكبير اللي معاه معاش أو بيت بيبقى أقرب مصدر، والإدمان نفسه بيقلل التحكم في الغضب.
      - kind: explain
        page: 216
        quote: "Most often in the home where abusers are often adult children, other family members such as grandchildren, or spouses/partners of elders. Elder abuse can also occur in institutional settings, especially long-term care facilities."
        title: "فين؟ ولما الرعاية تبقى عبء"
        text: |
          الإساءة بتحصل **مكان ما الكبير عايش**:

          - **غالبًا البيت**: المؤذي ولاد كبار، أحفاد، أو الزوج/الزوجة.
          - وممكن في **institutional settings**، خصوصًا الـ ==long-term care facilities==.

          وآخر risk factor في الـ caregiver: إنه شايف الرعاية **burdensome and without psychological reward**. ليه دي خطيرة؟ التفسير المقبول (مش في الكتاب): الرعاية تقيلة على أي حد، بس اللي بيحس إنه بيعمل حاجة ليها معنى (رد جميل، حب) بيستحمل. اللي شايفها عبء من غير أي مقابل بيتراكم عنده غضب، والغضب ده بيطلع على أضعف واحد في البيت.
      - kind: explain
        page: 215
        quote: "There are several risk factors, which increase the likelihood that an elderly person will become a victim of elder abuse. Such risk factors for elder abuse include an elderly person who:\n  Has memory problems (such as dementia).\n  Has physical disabilities.\n  Has depression, loneliness, or lack of social support.\n  Abuses alcohol or other substances.\n  Is verbally or physically combative with the caregiver.\n  Has a shared living situation.\n  Social isolation; i.e., the elder and caregiver are alone together almost all the time.\n  The elder's role, at an earlier time, as an abusive parent or spouse.\n  A history of domestic violence in the home.\n  The elder's own tendency toward verbal or physical aggression.\nThere are also several risk factors, which increase the likelihood that a caregiver will participate in elder abuse. Such risk factors for elder abuse include a caregiver who:\n  Feels overwhelmed or resentful.\n  Has a history of substance abuse or a history of abusing others.\n  Is dependent on the older person for housing, finances, or other needs.\n  Has mental health problems.\n  Is unemployed.\n  Has a criminal history.\n  Has a shared living situation.\n  Inability to cope with stress (lack of resilience).\n  Depression, which is common among caregivers.\n  Lack of support from other potential caregivers."
        title: "Risk factors في الكبير"
        text: |
          - **Dementia** و memory problems.
          - Physical disabilities.
          - Depression، وحدة، مفيش support.
          - Alcohol أو substances.
          - بيتخانق مع الـ caregiver لفظيًا أو جسديًا، أو عنده ميل للعدوانية.
          - ==Shared living==، و **isolation**: هو والـ caregiver لوحدهم طول الوقت.
          - كان هو نفسه أب أو زوج مؤذي زمان، أو فيه domestic violence في البيت.

          ليه الـ dementia في أول القايمة؟ التفسير المقبول (مش في الكتاب): لأنها بتعمل الحاجتين مع بعض: بتخلي الكبير **مش قادر يبلّغ** (وده كان barrier في الدرس اللي فات)، وبتطلّع سلوك متعب (تكرار، هياج، عدوانية) بيضغط على الـ caregiver.
      - kind: explain
        page: 215
        quote: "There are several risk factors, which increase the likelihood that an elderly person will become a victim of elder abuse. Such risk factors for elder abuse include an elderly person who:\n  Has memory problems (such as dementia).\n  Has physical disabilities.\n  Has depression, loneliness, or lack of social support.\n  Abuses alcohol or other substances.\n  Is verbally or physically combative with the caregiver.\n  Has a shared living situation.\n  Social isolation; i.e., the elder and caregiver are alone together almost all the time.\n  The elder's role, at an earlier time, as an abusive parent or spouse.\n  A history of domestic violence in the home.\n  The elder's own tendency toward verbal or physical aggression. There are also several risk factors, which increase the likelihood that a caregiver will participate in elder abuse. Such risk factors for elder abuse include a caregiver who:\n    Feels overwhelmed or resentful.\n    Has a history of substance abuse or a history of abusing others.\n    Is dependent on the older person for housing, finances, or other needs.\n    Has mental health problems.\n    Is unemployed.\n    Has a criminal history.\n    Has a shared living situation.\n    Inability to cope with stress (lack of resilience).\n    Depression, which is common among caregivers.\n    Lack of support from other potential caregivers."
        title: "Risk factors في الـ caregiver"
        text: |
          - **Overwhelmed** أو **resentful**، ومش قادر يتعامل مع الضغط.
          - Substance abuse، أو أذى ناس تانيين قبل كده، أو **criminal history**.
          - ==Dependent== على الكبير في السكن أو الفلوس.
          - Mental health problems، و **depression** (شائع في الـ caregivers).
          - Unemployed.
          - Shared living، ومفيش حد تاني يساعده.
          - شايف الرعاية **عبء من غير أي مقابل نفسي**.

          لاحظ إن معظمهم علامات **caregiver تعبان** مش caregiver شرير. يعني المنع الحقيقي إنك تساعده، وده اللي هتشوفه في الـ **BREAK** في الدرس الجاي.
