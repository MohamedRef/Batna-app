  - id: hb.L06.lesson2
    title: "السكر والكبد: الفرخة ولا البيضة؟"
    hook: "مريض سكر الـ ALT بتاعه نضيف... يبقى كبده كويس؟ الكتاب بيقولك: ماتثقش في الإنزيمات."
    minutes: 8
    pages: [99, 103]
    topics: [t2dm, progression]
    goals:
      - "تعرف ليه الـ normal ALT مابيستبعدش NASH في السكر"
      - "ترتّب مسار MASLD من steatosis لـ HCC وتعرف إيه اللي بيرجع"
      - "تشرح العلاقة الـ bidirectional بين MASLD و T2DM"
    status: unverified
    steps:
      - kind: explain
        page: 99
        title: "ماتثقش في الإنزيمات"
        quote: "Hunting for Progressive NAFLD in Type 2 Diabetes: Do Not Trust Liver Enzymes!"
        text: |
          السؤال اللي الكتاب بيسأله: هل الـ **normal transaminases** بتستبعد مرض في كبد مريض **T2DM**؟

          الإجابة من دراسة **Diabetes Care 2023**: مرضى سكر اتعملهم biopsy رغم إن الإنزيمات **low cut-offs** (**63%** منهم ALT **< 30 IU/L**)، وطلع **NASH في حوالي 58%**، والـ advanced fibrosis كانت موجودة برضه.

          والـ **clinical predictors of advanced fibrosis (F3–F4)** في الدراسة: **GGT**، **waist** (M > 102، F > 88 cm)، **low HDL** (M < 1.03، F < 1.29 mmol/L)، و **FIB-4**.
      - kind: check
        page: 99
        question: "A 55-year-old man with type 2 diabetes has ALT 24 IU/L and a bright liver on ultrasound. What does the lecture teach?"
        options:
          - "Normal ALT does not exclude NASH or advanced fibrosis in T2DM"
          - "ALT under 30 IU/L excludes NASH"
          - "Normal ALT means simple steatosis only"
          - "Only biopsy is useful in diabetics"
        answer: 0
        why:
          - "صح: **Do not trust liver enzymes**: NASH كان في حوالي 58% من مرضى سكر إنزيماتهم واطية."
          - "دي بالظبط الغلطة اللي الدراسة بتحذّر منها."
          - "الـ ALT مابيفرقش بين steatosis و NASH و fibrosis هنا."
          - "فيه predictors زي **FIB-4** و GGT و waist؛ مش لازم biopsy للكل."
      - kind: explain
        page: 100
        title: "MASLD: الكبد بتاع الـ metabolic syndrome"
        quote: "MASLD is the hepatic manifestation of metabolic syndrome."
        text: |
          - **MASLD is the hepatic manifestation of metabolic syndrome.**
          - **T2DM و obesity** هما **أقوى risk factors** للـ fibrosis والـ cirrhosis والـ HCC والـ mortality.
          - والـ MASLD ممكن **تسبق و/أو تزوّد** الـ T2DM وتزوّد مضاعفاته.
      - kind: figure
        page: 100
        title: "مسار MASLD"
        alt: "A vertical pathway. Obesity, insulin resistance and free fatty acids drive normal liver to steatosis. Normal liver, steatosis, MASH and fibrosis are joined by two-headed arrows. Activation of hepatic stellate cells drives MASH to fibrosis. Fibrosis goes one way to cirrhosis and then HCC. MASH also points out to type 2 diabetes and cardiovascular disease."
        caption: "الأسهم اللي بوشين (لحد الـ fibrosis) معناها إن المرحلة **ممكن ترجع**. من الـ cirrhosis للـ HCC السهم في اتجاه واحد. والـ MASH بيطلّع برة الكبد: **T2DM** و **cardiovascular disease**."
        svg: |
          <svg viewBox="0 0 330 560" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L06a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
