        title: "ليه اسمها vicious cycle؟"
        text: |
          الكتاب بيقول لما الـ **extracellular matrix** يختل، الـ **inflammatory mediators** والـ **mechanical stress** بيعملوا ==vicious cycle==: الـ chondrocyte بيطلّع collagen شغال أقل، والـ **proteoglycans** (اللي بتملا المكان وبتشيل المية) بتقل، والـ mediators بتزيد.

          التفسير المقبول (مش في الكتاب) لسبب إنها «حلقة»: الغضروف اللي فقد الـ proteoglycans بيبقى زي إسفنجة ناشفة، مش بيمتص الصدمة، فالضغط على الخلايا يزيد، فتطلّع mediators أكتر، فالغضروف يتكسر أكتر. ومع السن الـ chondrocyte نفسه بيتغير، يعني الماكينة اللي المفروض تصلّح هي كمان ضعفت.

          وده يفسّر ليه الـ OA **chronic and progressive**: الحلقة ما بتقفش لوحدها.
      - kind: explain
        remind: [geri.L08.059]
        page: 141
        title: "الصورة الإكلينيكية"
        quote: "Osteoarthritis can affect any joint but is most common in the knees, hips, spine and small joints in the hands. Muscles and tissue around the joint are often affected."
        text: |
          **Pain، swelling، stiffness، صعوبة حركة**. ومع قلة الحركة العضلات تضعف.

          الأشهر: ==knees، hips، spine، small joints of hands==. chronic و progressive، وفي الشديد المفصل يبوظ والألم حتى وقت الراحة.

          ليه العضلات بتضعف؟ الكتاب بيقول **as a consequence of reduced movement**. وده يرجّعنا للتلاتي اللي في أول المحاضرة: المفصل بيوجع ← حركة أقل ← sarcopenia ← المفصل يشيل أكتر.

          وليه فيه ألم **وقت الراحة** في الحالات الشديدة؟ افتكر الـ **central sensitization** من التعريف الجديد: الجهاز العصبي نفسه بقى حساس، فالألم ما بقاش مربوط بالحركة بس.
      - kind: sort
        page: 141
        quote: "Blood tests. Although there's no blood test for osteoarthritis, certain tests can help rule out other causes of joint pain, such as rheumatoid arthritis."
        prompt: "الفحص ده بيعمل إيه في الـ OA؟"
        bins: ["Shows OA", "Rules out others", "Rarely needed"]
        cards:
          - { text: "X-ray: joint space narrowing", bin: 0 }
          - { text: "X-ray: bone spurs", bin: 0 }
          - { text: "Blood tests (RA)", bin: 1 }
          - { text: "Joint fluid (gout, infection)", bin: 1 }
          - { text: "MRI", bin: 2 }
        why: "مفيش **blood test** للـ OA؛ الدم والـ joint fluid بيستبعدوا rheumatoid arthritis (RA) و gout و infection. الغضروف ما بيظهرش على X-ray، بس الـ **narrowing** والـ **spurs** بيظهروا. الـ **magnetic resonance imaging (MRI)** not commonly needed."
      - kind: explain
        page: 142
        quote: "X-rays.Cartilage doesn't show up on X-ray images, but cartilage loss is revealed by a narrowing of the space between the bones in the joint. An X-ray can also show bone spurs around a joint.\nMagnetic resonance imaging (MRI) is not commonly needed to diagnose OA."
        title: "الأشعة بتشوف إيه؟"
        text: |
          الكتاب بيقول الـ **cartilage مش بيظهر** على الـ X-ray، فإزاي نشوف إنه راح؟ من ==narrowing of the joint space==: المسافة بين العضمتين هي سُمك الغضروف، فلو قلّت يبقى الغضروف اتآكل. والـ X-ray كمان بيوري **bone spurs**.

          التفسير المقبول (مش في الكتاب) للـ spurs: العضمة اللي تحت الغضروف بقت شايلة الحِمل مباشرة، فبتحاول توسّع نفسها على الأطراف.

          والـ **MRI not commonly needed**: عشان التشخيص إكلينيكي والـ X-ray كفاية، والـ MRI مش هيغيّر العلاج غالبًا.

          ولاحظ إن الدم وسائل المفصل **بيستبعدوا** حاجات تانية (RA، gout، infection)، مش بيشخّصوا الـ OA. يعني الـ OA تشخيص بالصورة الإكلينيكية والأشعة بعد ما تطمن إن مفيش حاجة تانية.
      - kind: explain
        remind: [geri.L08.065]
        page: 143
        title: "العلاج"
        quote: "Cortisone injections.\nLubrication injections.\nRealigning bones.\nJoint replacement."
        text: |
          1. **Acetaminophen**: للـ mild–moderate pain؛ الجرعة الزيادة = ==liver damage==.
          2. **non-steroidal anti-inflammatory drugs (NSAIDs)**.
          3. **Physical therapy**: تقوية العضلات حوالين المفصل والـ flexibility؛ والمشي أو العوم بنفس الفايدة. الكتاب راسم strengthening و aerobic و range of motion.
          4. **Cortisone injections**، **lubrication injections**.
          5. **Realigning bones** و **joint replacement**.

          ليه الترتيب ده؟ التفسير المقبول (مش في الكتاب):
          - **Acetaminophen** الأول لأنه أأمن على المعدة والكلى من الـ NSAIDs، وده مهم عند الكبير. بس الجرعة الزيادة بتأذي الكبد، والكتاب بيحذّر من كده صراحة.
          - الـ **physical therapy** بتقوّي العضلات حوالين المفصل، فالعضلة تشيل جزء من الحِمل بدل الغضروف، وده بيكسر جزء من الـ vicious cycle.
          - الحقن والجراحة للي الحاجات اللي قبلها ما نفعتش، والـ **joint replacement** لما المفصل خلاص «unusable».
      - kind: update
        page: 143
        quote: "Acetaminophen. Acetaminophen (Tylenol, others) has been shown to help some people with osteoarthritis who have mild to moderate pain. Taking more than the recommended dose of acetaminophen can cause liver damage."
        text: "الـ **American College of Rheumatology (ACR) 2019**: topical NSAIDs strongly recommended للركبة، والـ oral NSAIDs أقوى دوا بالبُق؛ والـ acetaminophen conditional بس لفترات قصيرة. في الامتحان ترتيب الكتاب."
        ref: "ACR/Arthritis Foundation OA guideline 2019"
      - kind: try
        items: [geri.L08.053, geri.L08.057, geri.L08.060, geri.L08.063, geri.L08.124]
