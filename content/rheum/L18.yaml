    kind: card
    topic: glandular
    front: Ocular symptoms of lacrimal involvement in Sjögren syndrome?
    back: Burning and itchy eyes, and dryness of the eyes (keratoconjunctivitis sicca).
    src: { page: 303, quote: "Burning and itchy eye sensation. * Dryness of the eyes (keratoconjunctivits sicca." }
    status: unverified
  - id: rheum.L18.022
    kind: card
    topic: glandular
