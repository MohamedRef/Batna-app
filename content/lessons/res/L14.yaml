- id: res.L14.lesson4
  title: تحط الـ cut-off فين؟
  hook: 'تحرّك الخط يمين، تكسب specificity وتخسر sensitivity. السؤال: أنهي غلطة أغلى؟'
  minutes: 8
  pages: [20, 23]
  topics: [cutoff]
  goals:
  - تعرف تمن الـ false positive والـ false negative حسب الموقف
  - تختار cut-point بـ high sensitivity أو high specificity
  - تقرا منحنيات الأصحاء والعيانين
  status: unverified
  steps:
  - kind: explain
    page: 20
    quote: |-
      The consequences of a false positive or false negative depends on the setting. For example:
      A false negative test for a sexually transmitted disease could falsely reassure and lead to further transmission
      In a pregnant woman, a false positive test for congenital anomaly may result in an unnecessary abortion
    title: الغلطة تمنها بيختلف
    text: |-
      نتيجة الـ ==false== بتفرق حسب الموقف:

      - **False negative** لـ sexually transmitted disease: يطمّن العيان على الفاضي، و**ينقل العدوى**.
      - **False positive** لـ congenital anomaly في ست حامل: ممكن تنتهي بـ **unnecessary abortion**.
  - kind: table
    page: 21
    quote: |-
      If the confirmatory test is expensive or invasive or false diagnosis will be associated with much sham and stigma:
      -Minimize false positives or
      -Use a cut-point with high specificity
      If the penalty for missing a case is high (e.g., the disease is fatal and treatment exists, or disease easily spreads):
      -Minimize false negatives or
      -Use a cut-point with high sensitivity
