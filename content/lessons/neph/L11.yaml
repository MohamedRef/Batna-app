        quote: "Posttransplant contraception In light of pregnancy-related risks and the fact that fertility can be restored within 1–6 months following a kidney transplant; contraception has to be a crucial component of the pretransplant counseling process to prevent premature unplanned pregnancies. Moreover, it is important to discuss the patient's psychological concerns, provide genetic counseling to any recipient with hereditary kidney disease, and consider the long-term prognosis of the patient and the allograft.(98) To reduce potential neonatal and maternal complications following kidney transplantation, patients are advised to defer pregnancy to a minimum of 1-year posttransplant, and contraception should be practiced until then. Several contraception methods are currently available. Some are temporary solutions to allow timing for planned pregnancy, and others are permanent modes of contraception."
