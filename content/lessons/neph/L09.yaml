        why: "الكتاب: filtration ← softening ← activated charcoal ← reverse osmosis، علشان تشيل الـ chloramines والميكروبات والأملاح الدايبة."
      - kind: explain
        remind: [neph.L09.016]
        page: 294
        title: "الدايرتين والإنذارات"
        quote: "Dialysate circuit: The key components/processes of this circuit include: Heating; Deaeration; Proportioning; Monitoring; UF; and Disinfection. Alarm system for monitoring: Conductivity (reflection of sodium, bicarbonate conc), Temperature, Hemglobin (blood leak)."
        text: |
          **دايرة الـ dialysate**: heating، deaeration، proportioning، monitoring، ultrafiltration (UF)، disinfection. إنذاراتها: ==conductivity== (يعني تركيز الـ Na والـ bicarbonate)، الحرارة، والـ **haemoglobin** (blood leak).

          **دايرة الدم**: blood pump، وإنذارات inflow pressure و outflow pressure و ==air detector==.

          ليه كل إنذار ده؟ التفسير المقبول (مش في الكتاب):
          - **conductivity**: لو الخلط غلط والـ Na عالي أو واطي، العيان ممكن يحصله hypernatraemia أو haemolysis في دقايق.
          - **temperature**: محلول سخن جدًا بيكسّر الـ RBCs، وبارد جدًا بيعمل رعشة.
          - **blood leak**: لو الفلتر خرم، الدم بيضيع والمحلول (مش معقّم) ممكن يدخل الدم.
          - **air detector**: هوا في الـ venous line يعني air embolism ممكن يقتل.
          - **pressures**: الـ inflow بيقول الـ access بيدّي دم كفاية، والـ outflow بيقول الرجوع مسدود ولا لأ.
          يعني كل إنذار بيحمي من مضاعفة من اللي هنشوفها في الدرس الجاي.
