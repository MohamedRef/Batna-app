      - Zenker's gives proximal dysphagia, checked by video swallow.
      - Globus is a lump between meals without dysphagia.
    src: { page: 99, quote: "Diagnostic Algorithm for Dysphagia.\nDysphagia:\n  Rule out non-esophageal causes as indicated\n  EGD ± barium swallow\nEGD ± barium swallow:\n  Intrinsic structural lesions (stricture, web, tumor, and so on)\n  Negative: Associated reflux symptoms?\nAssociated reflux symptoms?\n  Yes: PPI trial: Response: GERD, titrate PPI; No response: Motility study\n  No: Motility study\nMotility study:\n  Achalasia or DES or absent peristalsis\n  Negative: Proximal dysphagia?\nProximal dysphagia?\n  Yes: Video swallow to exclude cricopharyngeal bar, Zenker's, and so on\n  No: Functional dysphagia" }
    status: unverified
  - id: git.L03.279
    kind: mcq
    topic: nausea-vomiting
    stem: >-
      A 45-year-old woman has nausea several times a week for a year, without much pain or fullness and no heartburn.
      EGD is normal. Which easily treated cause should you look for next?
    options:
      - Gastroesophageal reflux, with pH testing or a PPI trial
      - H. pylori, the major cause of nausea
      - Cannabinoid hyperemesis
      - Rumination syndrome
      - Gallstones
    answer: 0
    why:
      - "Correct: reflux is easily treated but overlooked in chronic idiopathic nausea (CIN), even without heartburn."
      - The book says H. pylori is not a major cause of nausea.
      - Cannabinoid hyperemesis syndrome (CHS) is episodic vomiting with cannabis use.
      - Rumination is effortless regurgitation without nausea.
      - Gallstones cause biliary pain, not chronic nausea alone.
    src: { page: 113, quote: "There may be no heartburn, so this possibility needs to be considered in difficult cases. Referral for esophageal pH testing is usually diagnostic." }
    status: unverified
  - id: git.L03.280
    kind: mcq
    topic: nausea-vomiting
    stem: Which drug is worth trying first in chronic idiopathic nausea?
    options:
      - Domperidone
      - Metoclopramide
      - Ondansetron
      - Sumatriptan
      - Baclofen
    answer: 0
    why:
      - "Correct: domperidone has antinausea and prokinetic properties and is worth trying initially."
      - Metoclopramide is an alternative, limited by side effects.
      - 5-HT3 antagonists are expensive and kept for refractory patients.
      - Triptans are for cyclic vomiting syndrome (CVS) with migraine features.
      - Baclofen is a last resort in belching.
    src: { page: 113, quote: "A prokinetic drug such as domperidone is worth trying initially; it has antinausea as well as prokinetic properties." }
    status: unverified
  - id: git.L03.281
    kind: mcq
    topic: bowel-other
    stem: >-
      Three weeks after starting morphine for bone pain, a 70-year-old has straining and hard stools in most
      movements and only two bowel movements a week. What is the Rome IV diagnosis?
    options:
      - Opioid-induced constipation
      - Functional constipation
      - Narcotic bowel syndrome
      - IBS-C
      - Dyssynergic defecation
    answer: 0
    why:
      - "Correct: new constipation on starting opioids, with two or more of the constipation features."
      - In research, OIC patients are not labelled functional constipation.
      - NBS is about worsening pain with narcotics, not constipation.
      - There is no recurrent abdominal pain.
      - Dyssynergia needs anorectal testing and an FC background.
    src: { page: 128, quote: "C6. Opioid-induced constipation\nDiagnostic criteria\n  1. New, or worsening, symptoms of constipation when initiating, changing, or increasing opioid therapy, that must include two or more of the following:\n    a. Straining during more than 1/4 (25%) of defecations\n    b. Lumpy or hard stools (Bristol Stool Form Scale 1-2) more than 1/4 (25%) of defecations\n    c. Sensation of incomplete evacuation more than 1/4 (25%) of defecations\n    d. Sensation of anorectal obstruction/blockage more than 1/4 (25%) of defecations\n    e. Manual maneuvers to facilitate more than 1/4 (25%) of defecations (e.g., digital evacuation, support of the pelvic floor)\n    f. Fewer than three SBM per week\n  2. Loose stools are rarely present without the use of laxatives." }
    status: unverified
  - id: git.L03.282
    kind: mcq
    topic: central-pain
    stem: >-
      A 42-year-old has continuous abdominal pain for a year, unrelated to eating, defecation or menses, that stops
      her working. Full work-up is normal; she does not take opioids. What is the diagnosis?
    options:
      - Centrally mediated abdominal pain syndrome
      - IBS-U
      - Narcotic bowel syndrome
      - Functional dyspepsia (EPS)
      - Functional abdominal bloating
    answer: 0
    why:
      - "Correct: continuous pain, no relation to physiological events, limits function, not explained by another disorder."
      - Irritable bowel syndrome (IBS) pain is related to defecation or stool change.
      - NBS needs narcotic treatment driving the pain.
      - Epigastric pain syndrome (EPS) pain is epigastric and often meal-related.
      - Bloating is the predominant symptom there, not pain.
    src: { page: 129, quote: "D1. Centrally mediated abdominal pain syndrome (CAPS)*\nDiagnostic criteria* - Must include all of the following:\n  1. Continuous or nearly continuous abdominal pain\n  2. No or only occasional relationship of pain with physiological events (e.g., eating, defecation or menses)†\n  3. Pain limits some aspect of daily functioning††\n  4. The pain is not feigned\n  5. Pain is not explained by another structural or functional gastrointestinal disorder or other medical condition\n*CAPS is typically associated with psychosocial comorbidity, but there is no specific profile that can be used for diagnosis\n**Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis\n†Some degree of gastrointestinal dysfunction may be present\n††Daily function could include impairments in work, intimacy, social/leisure, family life, and caregiving for self or others" }
    status: unverified
  - id: git.L03.283
    kind: mcq
    topic: biliary
    stem: >-
      A 38-year-old has two attacks of unexplained acute pancreatitis. Lipase was 4 times normal each time;
      the pancreatic duct measures 7 mm in the head. What pancreatic SOD type is this?
    options:
      - Type I
      - Type II
      - Type III
      - Biliary type I
      - Not SOD; pancreatic duct dilatation excludes it
    answer: 0
    why:
      - "Correct: pancreatic pain, enzyme rise 1.1 x upper limit of normal (ULN) or more, and duct over 6 mm in the head make type I."
      - Type II has pain plus only one other criterion.
      - Type III is pain only.
      - Biliary types use liver tests and the bile duct.
      - Duct dilatation is one of the type I criteria.
    src: { page: 132, quote: "Patients with pancreatic SOD type I have pancreatic-type pain, a serum amylase or lipase level of at least 1.1 times the upper limit of normal on one occasion, and pancreatic duct dilatation (>6 mm in the head and >5 mm in the body); those with pancreatic SOD type II have pain and one of the other criteria; and those with pancreatic SOD type III have pancreatic-type pain only." }
    status: unverified
  - id: git.L03.284
    kind: mcq
    topic: anorectal
    stem: >-
      A 55-year-old man notices soiling of his underwear a while after each bowel movement. His continence is
      otherwise normal. What is the main mechanism?
    options:
      - Incomplete evacuation or impaired rectal sensation
      - Pudendal neuropathy with sphincter tear
      - Reduced rectal capacity
      - Loss of rectoanal reflexes
      - Excess dietary fibre
    answer: 0
    why:
      - "Correct: fecal seepage results mainly from incomplete evacuation or impaired rectal sensation, with sphincter and pudendal function mostly intact."
      - Sphincter and pudendal function are mostly intact in seepage.
      - Reduced capacity drives urge incontinence.
      - Lost reflexes and perception drive passive incontinence.
      - Not given as a mechanism.
    src: { page: 137, quote: "Fecal seepage, the undesired leakage of stool, often after a bowel movement, with otherwise normal continence and evacuation. This condition results primarily from incomplete evacuation of stool or impaired rectal sensation." }
