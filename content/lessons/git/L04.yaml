        quote: "Around 45-50% of gastric carcinoma present with an inoperable disease"
        title: "curable، بس نصهم بييجوا inoperable"
        text: |
          الكتاب: الرابع في الرجالة (بعد lung و prostate و colorectal)، الخامس في الستات (بعد breast و cervix و colorectal و lung)، و ==التاني في وفيات السرطان==. وحوالي **45-50%** بييجوا **inoperable**.

          التفسير المقبول (مش في الكتاب): التناقض بين «curable» و «نصهم inoperable» هو نفس قصة المريء: المعدة **واسعة** وبتتمدد، فالورم بيكبر من غير ما يسد حاجة. والأعراض الأولى (تلبك، شبع بدري) شبه الـ dyspepsia العادية، فالمريض بياخد مضاد حموضة ويستنى. ولما يوصل للمنظار يكون الورم عدّى الحيطة. يعني الدرس العملي: dyspepsia جديدة في سن كبير مع alarm features تتعمل منظار، ما تتعالجش على العمياني.
