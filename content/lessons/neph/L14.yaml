        quote: "Free light chains (FLC)\n  Glomerulus:\n    AL amyloidosis: FLC fibrils within glomerulus\n    Light Chain Deposition Disease: FLC deposit along basement membranes\n  Proximal tubule:\n    Fanconi's Syndrome: FLC crystals within epithelial cells\n    Excessive Endocytosis: Tubular cell injury & necrosis\n  Distal tubule:\n    Cast Nephropathy (also known as Myeloma Kidney): FLC form waxy casts within the tubule lumen"
