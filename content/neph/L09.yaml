  # ---------- p294: haemodialysis machine ----------
  - id: neph.L09.009
    kind: enumerate
    topic: hd-machine
    prompt: Besides vascular access, what are the essential components of haemodialysis?
    points:
      - Filter (dialyser)
      - Lines
      - Dialysate
      - Blood and dialysate delivery system (dialysis machine)
    pass: 3
    src: { page: 294, quote: "Filter/Dialyser - lines - dialysate - blood and dialysate delivery system" }
    status: unverified
  - id: neph.L09.010
    kind: card
    topic: hd-machine
    front: Describe the hollow-fibre dialyser and why dialysate flows countercurrent.
    back: A plastic chamber of capillary tubes (large surface area) through which blood circulates, while dialysate flows countercurrent outside the fibres to keep the solute concentration gradients.
    src: { page: 294, quote: "blood circulates while dialysate flows countercurrent(to maintain conc gradients" }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.011
    kind: card
    topic: hd-machine
    front: Why is the dialysate made from two separate concentrates?
    back: To prevent insoluble calcium and magnesium salts forming with bicarbonate; a bicarbonate concentrate and an acid concentrate (all other solutes, no bicarbonate) are mixed with purified water by the machine.
    src: { page: 294, quote: "to prevent formation of insoluble calcium and magnesium salts with bicarbonate" }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.012
    kind: cloze
    topic: hd-machine
    text: "The acid concentrate holds all solutes except bicarbonate at {{c1::34–36}} times the final dialysate concentration, with a small amount of {{c2::acetate}} ({{c3::3 mEq/L}} in final dilution)."
    src: { page: 294, quote: "34-36times that of final dialysate" }
    status: unverified
    tags: [numbers]
  - id: neph.L09.013
    kind: cloze
    topic: hd-machine
    text: "In a 4-hour session the blood is exposed to about {{c1::120 litres}} of water, at a dialysate flow of {{c2::500 mL/min}}."
    src: { page: 294, quote: "For a session of 4 hours the patient blood is exposed to 120 litres of water, (dialysate flow 500ml/min)." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L09.014
    kind: order
    topic: hd-machine
    prompt: Put the steps of dialysis water purification in the book's order.
    steps:
      - Filtration
      - Softening
      - Activated charcoal filtration
      - Reverse osmosis
    src: { page: 294, quote: "filtration, softening, activated charcoal filtration and reverse osmosis" }
    status: unverified
  - id: neph.L09.015
    kind: card
    topic: hd-machine
    front: What does water purification for dialysis remove?
    back: Chloramines, microbiological contaminants and dissolved ions.
    src: { page: 294, quote: "reverse osmosis to remove chloramines, microbiologic contaminants and dissolved ions" }
    status: unverified
  - id: neph.L09.016
    kind: enumerate
    topic: hd-machine
    prompt: Mention the key processes of the dialysate circuit.
    points:
      - Heating
      - Deaeration
      - Proportioning
      - Monitoring
      - Ultrafiltration
      - Disinfection
    pass: 4
    src: { page: 294, quote: "Heating; Deaeration; Proportioning; Monitoring; UF; and Disinfection." }
    status: unverified
  - id: neph.L09.017
    kind: table
    topic: hd-machine
    title: Alarms on the dialysis machine
    columns: [Circuit, Alarms]
    rows:
      - ["Dialysate circuit", "Conductivity (sodium, bicarbonate), temperature, haemoglobin (blood leak)"]
      - ["Blood circuit", "Inflow pressure, outflow pressure, air detector"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 294, quote: "Conductivity (reflection of sodium, bicarbonate conc)" }
    status: unverified
  - id: neph.L09.018
    kind: mcq
    topic: hd-machine
    stem: During haemodialysis the conductivity alarm sounds. What does conductivity mainly reflect?
    options:
      - Dialysate sodium and bicarbonate concentration
      - Blood leak into the dialysate
      - Air in the venous line
      - Dialysate temperature
    answer: 0
    why:
      - "Correct: conductivity reflects sodium and bicarbonate concentration (p294)."
      - Blood leak is detected by the haemoglobin sensor.
      - Air is picked up by the air detector in the blood circuit.
      - Temperature has its own alarm.
    src: { page: 294, quote: "Conductivity (reflection of sodium, bicarbonate conc)" }
    status: unverified
