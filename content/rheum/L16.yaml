    src: { page: 276, quote: "Other adverse reactions\n  The most commonly reported adverse reactions: upper respiratory tract infections, headache, diarrhea and nasopharyngitis.\n  Avoid use during an active serious infection, Gastrointestinal Perforations.\n  Potential changes in lymphocytes, neutrophils, hemoglobin.\n  Elevation of liver enzymes and lipids.\n  Immunizations – Live vaccines: Avoid use with XELJANZ.\n  Increased incidence of herpes Zooster is reported." }
    status: unverified
  - id: rheum.L16.195
    kind: mcq
    topic: jak
    stem: Which JAK inhibitor is selective for JAK1 and approved for RA, PsA, AS and atopic dermatitis?
    options: [Upadacitinib, Tofacitinib, Baricitinib, Abrocitinib]
    answer: 0
    why:
      - "Correct: Rinvoq (upadacitinib) is JAK1 with those four indications (p275)."
      - Tofacitinib inhibits JAK1/2/3.
      - Baricitinib inhibits JAK1/2 and is used for RA, atopic dermatitis and alopecia.
      - Abrocitinib is indicated only for atopic dermatitis.
    src: { page: 275, quote: "Rinvoq (upadacitinib) JAK1 is indicated for the treatment rheumatoid arthritis, psoriatic arthritis, ankylosing spondylitis and atopic dermatitis." }
