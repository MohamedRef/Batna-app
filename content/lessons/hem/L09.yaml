            <text x="10" y="186" class="t-sm t-mut">Ovaries</text>
            <text x="320" y="170" text-anchor="end" class="t-sm t-mut">Kidneys</text>
            <text x="320" y="186" text-anchor="end" class="t-sm t-mut">Adrenals</text>
            <text x="320" y="80" text-anchor="end" class="t-sm t-mut">Skin</text>
          </svg>
      - kind: explain
        page: 147
        title: "الـ EMH: مصنع دم في غير مكانه"
        quote: "Spleen is the commonest site of extramedullary hemopoiesis in PMF. The liver is also usually involved, and this can lead to significant hepatomegaly.\nUnusual sites can sometimes be affected, leading to hemopoietic tumors surrounded by a capsule of connective tissue. Such sites include lymph nodes,"
        text: |
          - الـ ==spleen== أشهر مكان للـ **extramedullary hemopoiesis (EMH)**، والـ **liver** غالبًا معاه، وممكن **significant hepatomegaly**.
          - في أماكن غريبة بيعمل **hemopoietic tumors** حواليها **capsule of connective tissue**: lymph nodes، **CNS**، skin، pericardium، peritoneum، pleura، ovaries، kidneys، adrenals، GIT، lungs.
          - أغلبها **asymptomatic**، بس الـ **CNS** ممكن **serious morbidity**.
          - العلاج لو احتاج: **radiotherapy أو surgery**، وتقريبًا دايمًا بتختفي.

          ليه الطحال والكبد أول ناس؟ زي ما شفنا في المحاضرة 1: هما كانوا **مصنع الدم أيام الجنين**، فلما النخاع يقع، هما أول اللي يرجعوا يشتغلوا. وليه الـ CNS خطير؟ التفسير المقبول (مش في الكتاب): أي كتلة في مكان مقفول زي الجمجمة أو قناة النخاع الشوكي بتضغط على الأعصاب، حتى لو صغيرة.
      - kind: check
        page: 148
        quote: "CNS, skin, pericardium, peritoneum, pleura, ovaries, kidneys, adrenals, GIT and lungs. Many such cases remain asymptomatic, but involvement of the CNS can be a cause of serious morbidity.\nTreatment with radiotherapy or surgery, when required, almost always leads to resolution of these masses."
        question: "PMF patient with a new paraspinal hemopoietic mass compressing the cord. What does the book say about these masses?"
        options: ["Radiotherapy or surgery almost always resolves them", "They never need treatment", "They are always malignant AML deposits", "Splenectomy is the treatment of choice"]
        answer: 0
        why:
          - "صح: الكتاب بيقول radiotherapy or surgery, when required, almost always leads to resolution."
          - "أغلبها ساكتة، بس الـ CNS involvement ممكن serious morbidity ويحتاج علاج."
          - "دي hemopoietic tumors عليها capsule، مش AML."
          - "الطحال مالوش علاقة بكتلة في الـ CNS."
      - kind: explain
        page: 148
        title: "الدم بيقول إيه، وليه بيتغير؟"
        quote: "Mild to moderate anemia is found in most patients at presentation and worsens as myelofibrosis progresses. The anemia is mainly due to reduced erythropoiesis, but may be compounded by hypersplenism, bleeding and iron or folate deficiency."
        text: |
          - **Anemia**: mild لـ moderate في أغلبهم، و **بتزيد مع التليف**. السبب الأساسي ==reduced erythropoiesis== (المصنع بيتليّف)، وفوقيها **hypersplenism**، **bleeding**، و **iron أو folate deficiency**.
          - **Platelets**: عالية في لحد **النص** في الأول (ممكن تجلّط)، وبعدين **progressive thrombocytopenia**. والـ **dysmegakaryopoiesis** والـ abnormal platelet function بيزوّدوا النزيف.
          - **White cells**: **leukoerythroblastic** picture، **neutrophilia**، وزيادة بسيطة في الـ basophils والـ eosinophils. ومع الوقت **leukopenia** من **hypersplenism**، **dysmyelopoiesis**، والتليف اللي بياخد مكان النخاع.

          القاعدة: **في الأول** النخاع لسه hypercellular فالأرقام عالية؛ **بعدين** التليف والطحال الضخم بياكلوا كل الخطوط.
      - kind: reveal
        page: 148
        quote: "Platelet counts are raised in up to one-half of the cases at presentation and can be associated with thrombotic complications. However, progressive thrombocytopenia is a frequent occurrence as the disease progresses."
        prompt: "ليه مريض الـ PMF ممكن يجلّط في الأول وينزف في الآخر؟"
        answer: |
          في الأول: الصفائح ==raised in up to one-half== ومرتبطة بـ **thrombotic complications**.

          في الآخر: **progressive thrombocytopenia**، وفوقها **dysmegakaryopoiesis** و **abnormal platelet function**، فالنزيف بيكسب.

          التفسير المقبول (مش في الكتاب): الـ megakaryocytes في الأول كتير ونشيطة (نخاع hypercellular)، ولما التليف ياخد مكانها والطحال الضخم يحجز الصفائح، العدد بيقع والباقي شغله بايظ.
      - kind: aside
        tone: exam
        page: 149
        quote: "Transformation to AML, as defined by the persistent presence of 20% blasts in blood or bone marrow occurs in 20–30% of cases of PMF and is usually rapidly fatal."
        text: "رقمين للامتحان: الـ **AML** في الـ PMF = **persistent ≥20% blasts** في الدم أو النخاع، بيحصل في ==20–30%==، وغالبًا **rapidly fatal**. قارن بالـ ET: نادر."
      - kind: try
        items: [hem.L09.103, hem.L09.106, hem.L09.111, hem.L09.118, hem.L09.119]
