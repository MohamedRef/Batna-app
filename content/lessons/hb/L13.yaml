        text: |
          الـ PSC **chronic cholestatic** disease فيها **fibrosing inflammation** للـ **intrahepatic و extrahepatic** biliary tree.

          - بتعمل **irreversible** damage للـ ducts → cholestasis → cirrhosis → liver failure و premature death، **إلا لو اتعمل transplant**.
          - على المدى الطويل: **colon cancer** و **bile duct cancer** كتير، غالبًا من الـ chronic inflammation في القولون والقنوات.
          - **مفيش** therapy بتعمل complete clinical و biochemical و histologic remission.
          - الـ **liver transplantation** هو الـ intervention المهم في الـ end-stage.
      - kind: sort
