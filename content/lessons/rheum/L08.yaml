      - kind: explain
        page: 162
        title: "الـ cryoglobulins: ليه البرد بيفرق؟"
        quote: "Type 2... mixed because contain IgG and IgM=RF...monoclonal...hep C,"
        text: |
          الكتاب بيقسّم الـ cryoglobulinaemia تلات أنواع:
          - **Type 1**: **monoclonal** ومن غير RF ← **myeloma**.
          - **Type 2**: **mixed** (IgG و IgM)، والـ IgM ==monoclonal== وشغال **RF** ← **hepatitis C**، neoplastic، و connective tissue diseases.
          - **Type 3**: IgM **polyclonal** ← circulating immune complexes.

          الصورة: **purpura**، weakness، **arthralgias**، **Raynaud's**، **neuropathy**، و **GN**.

          التفسير المقبول (مش في الكتاب): الـ cryoglobulins بروتينات **بتترسّب في البرد**. الأطراف (الصوابع والرجلين) أبرد من باقي الجسم، فبتتجمع هناك ← Raynaud's و purpura. وكمان بتعمل immune complexes بتشغّل الـ complement وتترسب في الكلية ← GN.
      - kind: reveal
        page: 162
        quote: "Treat Hep C."
        prompt: "ليه أول سطر في علاج الـ cryoglobulinaemic vasculitis في الكتاب هو «Treat Hep C» قبل الـ prednisone والـ Cytoxan؟"
        answer: |
          لأن الـ hepatitis C هو اللي **بيصنع** المشكلة: الـ virus بيحفّز الـ B cells تعمل الـ IgM-RF (type 2). ده مثال واضح على **vasculitis associated with probable etiology** في Chapel Hill (ص 126).

          التفسير المقبول (مش في الكتاب): لو إدّيت steroids و cyclophosphamide بس، هتطفي الالتهاب **مؤقتًا** والـ virus لسه شغال، وكمان الـ immunosuppression ممكن تزوّد الـ viral load. لما تعالج الـ HCV، **المصنع يقفل**، والـ cryoglobulins تقل. والـ prednisone و Cytoxan للحالات الشديدة لحد ما ده يحصل.
