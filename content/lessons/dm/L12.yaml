        page: 148
        title: "ليه الـ glomerulus بيتعب في السكر أصلًا؟"
        quote: "Attenuation of\nhyperfiltration"
        text: |
          الرسمة بتقول الـ SGLT2i بيعمل ==attenuation of hyperfiltration==. طب ليه فيه hyperfiltration؟ التفسير المقبول (مش في الكتاب):

          1. السكر العالي بيوصل الـ proximal tubule بكمية كبيرة، والـ **SGLT2** بيشدّه ومعاه **sodium**.
          2. الصوديوم اللي بيوصل للـ **macula densa** بيقل، فهي فاكرة إن الدم قليل.
          3. فبتفتح الـ **afferent** على الآخر، والضغط جوه الـ glomerulus يعلى: ده الـ **hyperfiltration** اللي بيبوّظ الـ glomeruli مع السنين.

          الـ SGLT2i بيعكس السلسلة: الصوديوم يرجع يوصل للـ macula densa، الـ **adenosine** يزيد، الـ afferent يقفل، والضغط ينزل. ولما تضيف **RAAS blockade** على الـ efferent، تبقى قفلت من الناحيتين. عشان كده الـ eGFR بينزل شوية في الأول (الضغط نزل) وده مش أذى.
      - kind: sort
        page: 149
        quote: "Putative renoprotective actions and effects of GLP-1R agonists on kidneys.\n| Direct Effects | Indirect Effects |\n|---|---|\n| Proximal tubular natriuresis stimulation | Improved glycemic control |\n| Modulation of cAMP/PKA signaling | Improved blood pressure control |\n| Inhibition of renin angiotensin system | Weight loss |\n| ↓ Renal hypoxia | ↑ Insulin sensitivity |\n| ↓ Glomerular atherosclerosis? | ↓ Postprandial glucagon |\n| Renal endothelial dependent vasodilation | ↓ Intestinal lipid uptake |\n| ↑ Tubuloglomerular feedback (through ↓ NHE3 activity) | ↑ Brown adipose tissue activation |\n| ↑ ANP? | Effects on microbioma? |"
        prompt: "الـ renoprotective actions بتاعة الـ GLP-1 RA على الكلية: direct ولا indirect؟"
        bins: ["Direct", "Indirect"]
        cards:
          - { text: "Proximal natriuresis", bin: 0 }
          - { text: "RAS inhibition", bin: 0 }
          - { text: "↓ Renal hypoxia", bin: 0 }
          - { text: "Endothelial vasodilation", bin: 0 }
          - { text: "Better glucose", bin: 1 }
          - { text: "Better BP", bin: 1 }
          - { text: "Weight loss", bin: 1 }
          - { text: "↓ Postprandial glucagon", bin: 1 }
        why: "الـ **direct** على الكلية نفسها (natriuresis، cyclic adenosine monophosphate (cAMP)/protein kinase A (PKA)، renin–angiotensin system (RAS)، hypoxia، vasodilation، transforming growth factor عن طريق sodium–hydrogen exchanger 3 (NHE3)، atrial natriuretic peptide (ANP)). الـ **indirect** من تحسين الجسم كله (glucose، blood pressure (BP)، وزن، insulin sensitivity، glucagon، intestinal lipids، brown fat، microbiome)."
      - kind: explain
        page: 149
        title: "direct و indirect: الفرق بيفرق ليه؟"
        quote: "Putative renoprotective actions and effects of GLP-1R agonists on kidneys."
        text: |
          الجدول بيقسم الـ ==renoprotective actions== بتاعة الـ GLP-1 RA لنوعين:

          - **Direct**: على الكلية نفسها، زي **proximal tubular natriuresis** و **inhibition of the renin angiotensin system** و ↓ **renal hypoxia**. يعني الدوا بيحمي الكلية حتى لو السكر ما اتغيّرش كتير.
          - **Indirect**: من تحسين الجسم كله: glucose أحسن، ضغط أحسن، **weight loss**، insulin sensitivity أعلى، postprandial glucagon أقل.

          ليه ده مهم؟ التفسير المقبول (مش في الكتاب): لأنه بيفسّر ليه الـ GLP-1 RA في KDIGO بييجي **targeted** لما الـ HbA1c ما يوصلش للهدف **أو لو فيه persistent albuminuria**: فايدته على الكلية مش جاية من السكر بس. وعلامات الاستفهام في الجدول (glomerular atherosclerosis؟ ANP؟) معناها إن الأثر ده لسه مش مؤكد.
