        text: "الـ empiric treatment بالـ fluoroquinolones عليها تحذيرات عند الكبار: tendon rupture و aortic aneurysm و central nervous system (CNS) effects. اختار حسب الـ local resistance، وغيّر أو شيل الـ catheter قبل العلاج. في الامتحان: fluoroquinolones زي الكتاب."
