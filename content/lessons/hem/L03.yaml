  - id: hem.L03.lesson6
    title: "التجلطات الصغيرة: الـ TMA والـ TTP"
    hook: "صفايح قليلة ومع ذلك فيه جلطات؟ ده مش تناقض. ده الـ thrombotic microangiopathy، والـ TTP أخطر أنواعها."
    minutes: 10
    pages: [40, 44]
    topics: [ttp]
    goals:
      - "تعرّف الـ TMA وتعرف أسبابها"
      - "تشرح الـ TTP: ADAMTS13 والـ VWF، العلامات، والتحاليل"
      - "تعرف علاج الـ TTP: الـ plasma exchange فورًا، وإيه اللي بيتضاف عليه وليه"
    status: unverified
    steps:
      - kind: explain
        page: 40
        title: "الـ thrombotic microangiopathy"
        quote: "Thrombotic microangiopathies (TMAs) are a group of heterogeneous disorders, characterized by disseminated thrombus formation in arterioles and capillaries resulting in:\n  1. Thrombocytopenia.\n  2. Microangiopathic hemolytic anemia(MAHA).\n  3. Potential end organ injury."
        text: |
          ==Thrombotic microangiopathy (TMA)== = جلطات صغيرة منتشرة في الـ **arterioles** والـ **capillaries**، والنتيجة:
          1. **Thrombocytopenia** (الصفايح اتصرفت في الجلطات).
          2. ==Microangiopathic haemolytic anaemia (MAHA)== (الكرات بتتقطع وهي معدية جنب الجلطات).
          3. **تلف أعضاء**.

          أشهر نوعين **thrombotic thrombocytopenic purpura (TTP)** و **haemolytic uraemic syndrome (HUS)**، وكمان: malignant hypertension، عدوى، أدوية، cancer، و **haemolysis, elevated liver enzymes, low platelets (HELLP)**.
      - kind: explain
        page: 40
        title: "الـ TTP و ADAMTS13"
        quote: "The definition for TTP has changed over time. Initially, an acute episode of TTP was defined by clinical criteria (multi visceral ischemic symptoms mainly targeting the brain) and standard biology criteria (microangiopathic hemolytic anemia and severe thrombocytopenia) occurring in the absence of other apparent causes. This definition was recently completed by the presence of a severe deficiency of ADAMTS13 (activity <10%), which is the only biologic marker specific for TTP."
        text: |
          الـ ==ADAMTS13== هو المقص اللي بيقطّع الـ **von Willebrand factor (VWF) multimers** الكبيرة.

          لو ناقص جدًا (**activity < 10%**)، الـ **ultralarge VWF** يفضل في الدم، لزج جدًا للصفايح، فتتكون **platelet-rich microthrombi** في الـ arterioles.

          الـ ADAMTS13 < 10% هو ==العلامة الوحيدة الـ specific للـ TTP==.

          ليه التعريف اتغير؟ عشان التعريف القديم كان إكلينيكي بس (ischaemia في أعضاء كتير، أغلبها المخ، مع MAHA و thrombocytopenia شديدة من غير سبب تاني)، وده بيلخبط مع باقي الـ TMAs. الـ ADAMTS13 بيقيس **السبب نفسه**، فبيفصل الـ TTP عن الـ HUS وغيره.
      - kind: figure
        page: 40
        quote: "A severe functional ADAMTS13 deficiency causes the blood accumulation of platelet-hyperadhesive ultralarge VWF multimers, leading to the formation of platelet-rich microthrombi within small arterioles ."
        title: "المقص الناقص"
        alt: "Two panels. Normal: a long VWF chain is cut by ADAMTS13 scissors into small pieces, and platelets pass. TTP: no ADAMTS13 (antibody or mutation), the ultralarge VWF chain catches many platelets forming a microthrombus in an arteriole, and a red cell is cut into a schistocyte as it passes."
        caption: "الطبيعي: ==ADAMTS13== بيقص الـ VWF. في الـ TTP: المقص مش شغال، فالـ VWF الطويل بيصطاد الصفايح ويعمل جلطة، والكرة الحمرا بتتقطع وهي معدية = **schistocyte**."
        svg: |
