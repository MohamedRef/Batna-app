    src: { page: 195, quote: "(EM) EM is required to make the diagnosis. EM shows multiple irregular lucencies of the GBM, giving it a moth-eaten appearance (Fig. 46.16). Such lucencies also may be observed in the mesangium. These lucent areas sometimes contain cross-banded collagen fibrils, which are more easily observed after staining with phosphotungstic acid (Fig. 46.17)." }
