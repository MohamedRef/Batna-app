# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: improved
  ar_eg: كروت ودروس الـ terlipressin والـ denosumab والـ eculizumab في الحمل والـ nitrofurantoin في الحمل بقى فيها تحذيرات الأمان الحديثة، وإجابة الكتاب زي ما هي
  en: Terlipressin, denosumab, eculizumab in pregnancy and nitrofurantoin in pregnancy now carry current safety warnings next to the book's answer
- kind: improved
  ar_eg: الـ PD Kt/V والـ OKT3 بقى عليهم تحديث (KDOQI 2006 و سحب الـ OKT3 سنة 2010)، والـ 5 cm بتاعة الـ AML aneurysm عليها ملاحظة إنها غالبًا 5 mm
  en: PD Kt/V and OKT3 now have updates (KDOQI 2006, OKT3 withdrawn in 2010), and the AML "5 cm aneurysm" carries a note that it is likely 5 mm
- kind: fixed
  ar_eg: تحشيشة الـ pseudohyponatremia بقت GLIP وكل حرف ليه سبب، والـ nephronophthisis بقت JOBS-H ومعاها الـ developmental delay والكبد
  en: The pseudohyponatremia mnemonic is now GLIP with one cause per letter, and nephronophthisis is JOBS-H with developmental delay and the liver
- kind: fixed
  ar_eg: "مخاطر البكتيريا الساكتة في الحمل بقت مقسومة صح: الأنيميا والبيبي الصغير بس لو فيه مرض كلى قديم"
  en: Asymptomatic bacteriuria in pregnancy now ties anaemia and small babies to previous renal disease, as the book does
