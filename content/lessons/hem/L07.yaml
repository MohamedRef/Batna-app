            <text x="122" y="121" text-anchor="middle" class="t-sm">25–30 mg/m2</text>
            <text x="165" y="158" text-anchor="middle" class="t-sm t-mut">3 days anthracycline + 7 days cytarabine</text>
          </svg>
      - kind: aside
        tone: tip
        page: 111
        quote: "Treatment of acute myeloid leukaemia\n  Remission induction: 3 + 7 Protocol\n    1- Cytosine-anabinoside 100 mg/m2/day, IVI for 7 days.\n    2- Adriamycin 25-30 mg/m2. Days 1, 2, and 3 or days 5, 6, and 7.\nN.B: Daunorubicin 45 mg/m2 or Idarubicin 8-12 mg/m2 or Mitoxantrone 12 mg/m2 IV push or IVI on days 1,2, and 3 might substitute Adriamycin."
        text: "**3** = أيام الـ anthracycline، **7** = أيام الـ Ara-C. والـ Ara-C جرعتها **100**: رقم سهل، ولمدة أسبوع."
