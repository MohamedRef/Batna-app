      - kind: update
        ref: "AASLD AIH guidance 2019"
        text: |
          الـ American Association for the Study of Liver Diseases (AASLD) (2019) بتسمح بـ **budesonide + azathioprine** كبداية في الـ non-cirrhotic بدل الـ prednisone. في الامتحان اكتب regimens الكتاب (Table 6).
      - kind: explain
        page: 214
        quote: "When decompensated patients with multilobular necrosis have at least at one\n laboratory parameter that fails to normalize or hyperbilitubinemia that does\n not improve during a 2-week treatment period, the immediate mortality rate is\n high and evaluation for liver transplantation is warranted."
        title: "الـ azathioprine والزرع"
        text: |
          **Azathioprine side effects**: cholestatic hepatotoxicity، nausea، emesis، rash، و **cytopenia**. بتحصل في **أقل من 10%** على 50 mg/day، وبترجع لما الجرعة تقل أو الدوا يقف.

          ==Liver transplantation==: مريض **decompensated** عنده **multilobular necrosis**، وبعد **أسبوعين** علاج فيه تحليل واحد على الأقل مارجعش طبيعي أو الـ bilirubin ماتحسنش: الـ immediate mortality عالية، فلازم تقييم للزرع.

          ليه أسبوعين بس؟ التفسير المقبول (مش في الكتاب): الـ AIH بتستجيب للـ steroids بسرعة عادة، فلو المريض الـ decompensated ماتحركش في أسبوعين، الكبد غالبًا مش هيلحق، والوقت بقى ضد المريض. ده نفس منطق الـ **Table 3**: الـ multilobular necrosis مع **failure to improve** و **hyperbilirubinemia after 2 weeks** = high mortality.
      - kind: figure
        page: 214
        quote: "Fig(2): Treatment End Points"
        title: "شكل 2 في الكتاب: الـ treatment end points"
        image: { file: hb/L13-aih-end-points.webp, book: true }
        alt: "Book flow chart. A gold box at the top, prednisone plus azathioprine or prednisone alone at a higher dose, sends arrows to four grey boxes from left to right. Remission: no symptoms, AST at most 2 times normal, normal gamma globulin, normal or minimal histologic activity; then no therapy, leading to sustained remission or relapse, repeat therapy, second remission, no therapy, and after a second relapse indefinite low-dose prednisone or indefinite azathioprine. Treatment failure: AST or bilirubin worsening by 67 percent or more, worse histology; then high-dose therapy, chronic therapy if liver function is stable or liver transplantation if decompensated. Incomplete response: improvement but remission criteria not met; then continued therapy, protracted for 3 years or more, then indefinite low-dose prednisone or azathioprine. Drug toxicity: intolerable symptoms, vertebral compression, cytopenia; then dose reduction or withdrawal."
        caption: |
          فوق خالص الصندوق الأصفر: العلاج (prednisone + azathioprine، أو prednisone لوحده بجرعة أعلى). منه 4 أسهم لـ 4 نهايات، من الشمال لليمين:

          - **Remission** (أول عمود شمال): مفيش أعراض، AST ≤ 2× normal، gamma globulin (GG) طبيعي، والـ histology طبيعية أو minimal. الخطوة: ==No therapy==. تحتها فرعين: sustained remission، أو relapse ← repeat therapy ← 2nd remission ← no therapy تاني. ولو جه **2nd relapse** (تحت خالص شمال)، القوس بيوديك لـ indefinite low-dose prednisone **أو** indefinite azathioprine.
          - **Treatment failure** (العمود التاني): AST و/أو bilirubin بيزيد ≥ 67%، والـ histology بتسوء. الخطوة: **high-dose therapy**. لو الكبد stable ← chronic therapy، ولو decompensation ← ==liver transplantation==.
          - **Incomplete response** (التالت): فيه تحسن في كل حاجة بس مش واصل للـ remission criteria. الخطوة: continued therapy ← protracted (≥ 3 سنين) ← indefinite low-dose prednisone أو azathioprine.
          - **Drug toxicity** (آخر عمود يمين): أعراض مش محتملة، vertebral compression، cytopenia. الخطوة: dose reduction أو withdrawal.

          يعني كل نهاية ليها تعريف وليها خطوة. والـ transplant بييجي من عمود واحد بس: ==treatment failure== مع decompensation، وده بيكمّل كلام الزرع اللي في الـ step اللي فوق.
