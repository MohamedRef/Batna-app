    title: "التكريع: طبيعي، وزيادة، ومن فين؟"
    hook: "30 تكريعة في اليوم طبيعي. لكن فيه تكريع الهوا فيه ما وصلش المعدة أصلًا. إزاي نعرف، وإزاي نعالج؟"
    minutes: 8
