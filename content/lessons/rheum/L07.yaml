  # ------------------------------------------------------------------
  - id: rheum.L07.lesson1
    title: "الـ complement: تلات طرق توصل لـ C3"
    hook: "بروتينات بتلف في الدم نايمة، ولما تصحى بتشتغل زي الدومينو: كل واحد يقطع اللي بعده."
    minutes: 8
    pages: [105, 108]
    topics: [overview, nomenclature]
    goals:
      - "تعرّف الـ complement وتعرف بيتعمل فين"
      - "تعرف وظايفه العامة والـ anaphylatoxins"
      - "تفهم الـ nomenclature: الأرقام والـ a و b"
    status: unverified
    steps:
      - kind: explain
        page: 105
        title: "يعني إيه complement؟"
        quote: "The term complement refers to the ability of these proteins to assist, or complement, the"
        text: |
          الـ **complement** اسم لمجموعة **plasma و membrane proteins** ليها دور أساسي في الـ **innate** والـ **adaptive** immunity.

          الاسم معناه إنها ==بتساعد (complement)== الـ antibodies في قتل الميكروبات.

          بتشتغل كـ **cascade** من **proenzymes** كل واحد بيتقطع ويقطع اللي بعده، زي الـ **coagulation pathway** بالظبط.
      - kind: explain
        page: 105
        title: "بيتعمل فين وبيعمل إيه؟"
        quote: "Most complement components are synthesized in the liver by hepatocytes,"
        text: |
          - **أغلبه** بيتعمل في الـ ==liver== بالـ hepatocytes، وكمان monocytes و macrophages و fibroblasts و epithelial cells في الـ GIT والـ genitourinary tract.
          - **أهم وظيفة**: يغطّي سطح الميكروب بحتت complement، ودي ==opsonization==.
          - **التانية**: ينشّط الخلايا علشان **inflammation** و immune response.
      - kind: reveal
        page: 106
        quote: "These low MW fragments (C4a, C3a, C5a)"
        prompt: "ليه C4a و C3a و C5a اسمهم anaphylatoxins؟"
        answer: |
          لأنهم لو اتفرزوا بكمية كبيرة يعملوا رد فعل ==شبه الـ anaphylaxis==: بيطلّعوا histamine من الـ mast cells، فيحصل vasodilation و permeability.

          يعني الـ anaphylaxis من غير IgE.
      - kind: figure
        page: 108
        quote: "Antigen:antibody complexes"
        title: "تلات طرق، نقطة التقاء واحدة"
        alt: "Three roads at the top: classical pathway started by antigen–antibody complexes, lectin pathway started by MBL binding mannose on pathogens, alternative pathway started by pathogen surfaces. All three arrows meet at C3, the most abundant complement protein. From C3, three outcomes: recruitment of inflammatory cells, opsonization, and killing of pathogens by the MAC."
        caption: "كل الطرق بتوصل ==C3==، أكتر complement protein في الـ plasma. ومن C3 نفس النتايج: التهاب، opsonization، وقتل."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L07a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fg-head-acc"/></marker></defs>
            <rect x="5" y="10" width="100" height="70" rx="10" class="fg-acc"/>
            <text x="55" y="32" text-anchor="middle" class="t-b">Classical</text>
            <text x="55" y="52" text-anchor="middle" class="t-sm">Antigen–</text>
            <text x="55" y="68" text-anchor="middle" class="t-sm">antibody</text>
            <rect x="115" y="10" width="100" height="70" rx="10" class="fg-acc"/>
            <text x="165" y="32" text-anchor="middle" class="t-b">Lectin</text>
            <text x="165" y="52" text-anchor="middle" class="t-sm">MBL on</text>
            <text x="165" y="68" text-anchor="middle" class="t-sm">mannose</text>
            <rect x="225" y="10" width="100" height="70" rx="10" class="fg-acc"/>
            <text x="275" y="32" text-anchor="middle" class="t-b">Alternative</text>
            <text x="275" y="52" text-anchor="middle" class="t-sm">Pathogen</text>
            <text x="275" y="68" text-anchor="middle" class="t-sm">surface</text>
            <path d="M55 80 L150 130 M165 80 V128 M275 80 L180 130" class="fg-arrow-acc" stroke-width="2" marker-end="url(#L07a)"/>
            <circle cx="165" cy="160" r="30" class="fg-bad"/>
            <text x="165" y="166" text-anchor="middle" class="t-lg t-b">C3</text>
            <path d="M140 180 L60 228 M165 190 V226 M190 180 L270 228" class="fg-arrow" stroke-width="2"/>
            <rect x="5" y="232" width="100" height="70" rx="10" class="fg-good"/>
            <text x="55" y="262" text-anchor="middle" class="t-sm">Inflammation</text>
            <text x="55" y="280" text-anchor="middle" class="t-sm t-mut">C3a, C5a</text>
            <rect x="115" y="232" width="100" height="70" rx="10" class="fg-good"/>
            <text x="165" y="262" text-anchor="middle" class="t-sm">Opsonization</text>
            <text x="165" y="280" text-anchor="middle" class="t-sm t-mut">C3b</text>
            <rect x="225" y="232" width="100" height="70" rx="10" class="fg-good"/>
            <text x="275" y="262" text-anchor="middle" class="t-sm">Killing</text>
            <text x="275" y="280" text-anchor="middle" class="t-sm t-mut">MAC C5b–9</text>
          </svg>
      - kind: explain
        page: 107
        title: "الأسامي"
        quote: "The 9 proteins of CP are designated by letter"
        text: |
          - الـ **classical pathway** فيها **9 proteins**: حرف **C** ورقم. الأرقام حسب ==ترتيب الاكتشاف== مش ترتيب الشغل، علشان كده **C4 بيشتغل قبل C2 و C3**.
          - الـ **alternative pathway**: حروف كبيرة، زي **factor B**.
          - الـ **regulators**: اسم وصفي زي **C4 binding protein**، أو حرف زي **factor H**.
          - الـ **fragments**: حروف صغيرة. الـ **a** صغير وذايب وبيطلع بره، والـ **b** كبير بيقعد على السطح ويكمّل الـ cascade.
      - kind: aside
        tone: tip
        page: 107
        quote: "The smaller fragment is given"
        text: |
          افتكر: ==a = away==، و **b = bound**.

          الـ **a** هو الـ smaller fragment: بيطير في الدم ويعمل التهاب، زي C3a و C5a. والـ **b** هو الـ larger fragment: بيلزق في السطح ويكمّل الشغل، زي C3b و C5b.
      - kind: check
        page: 107
        quote: "deposited on the surface of the activating cells, and continues the cascade."
        question: "Which statement about complement fragments is correct?"
        options:
          - "The 'b' fragment is usually larger and stays on the surface"
          - "The 'a' fragment is larger and continues the cascade"
          - "Numbers give the order of activation without exception"
          - "Alternative pathway proteins are named C plus a number"
        answer: 0
        why:
          - "صح: الـ b كبير و bound ويكمّل الـ cascade."
          - "الـ a صغير وذايب وبيطلع في الدم."
          - "الأرقام بترتيب الاكتشاف، و C4 قبل C2."
          - "الـ AP حروف كبيرة: factor B و D."
      - kind: try
        items: [rheum.L07.001, rheum.L07.003, rheum.L07.006, rheum.L07.009, rheum.L07.013]
    recap:
      - "Complement = plasma و membrane proteins بتساعد الـ antibodies، cascade زي الـ coagulation."
      - "أغلبه من الـ liver. أهم وظيفة: opsonization."
      - "C4a و C3a و C5a = anaphylatoxins."
      - "تلات طرق كلها توصل C3. a = away، b = bound. C4 قبل C2."
    practice: [rheum.L07.001, rheum.L07.002, rheum.L07.003, rheum.L07.004, rheum.L07.005, rheum.L07.006, rheum.L07.007, rheum.L07.008, rheum.L07.009, rheum.L07.010, rheum.L07.011, rheum.L07.012, rheum.L07.013, rheum.L07.014]
