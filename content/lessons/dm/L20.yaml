  - id: dm.L20.lesson2
    title: "ليه الـ HDL واطي؟"
    hook: "لوز برتقاني، طحال كبير، وتنميل في الرجلين. ده مش كرتون، ده Tangier disease. وبعدين: سيجارة، كرش، وbeta-blocker."
    minutes: 9
    pages: [254, 255]
    topics: [primary, secondary]
    goals:
      - "تعرف الـ 4 primary causes وكل واحد بيكسر أنهي محطة في الـ HDL"
      - "تعد الـ secondary causes وتفهم ليه كل واحد بيوطّي الـ HDL"
    status: unverified
    steps:
      - kind: explain
        page: 254
        title: "Tangier disease"
        quote: "Tangier Disease\n  1. Autosomal dominant disorder.\n  2. ABC A1 Transporter gene defect.\n  3. Decreased cholesterol efflux.\n  1. Marked reduction in HDL-C.\n  2. Cholesterol accumulation: Enlarged orange tonsils, hepatosplenomegaly, Peripheral neuropathy.\n  3. Premature atherosclerotic vascular disease.\n  4. Cause of Death: Premature CAD."
        text: |
          - ==ATP-binding cassette transporter A1 (ABCA1)== transporter gene defect، فالـ **cholesterol efflux** بيقل.
          - الكتاب بيقول **autosomal dominant**.
          - **High-density lipoprotein cholesterol (HDL-C) واطي جدًا**.
          - الكوليسترول بيتراكم: **لوز برتقاني كبير**، **hepatosplenomegaly**، **peripheral neuropathy**.
          - **Premature atherosclerosis**، وسبب الوفاة **premature coronary artery disease (CAD)**.

          ليه الـ HDL بيختفي تقريبًا؟ التفسير المقبول (مش في الكتاب): الـ ApoA-I محتاج الـ ABCA1 عشان يتملي دهون. من غيره يفضل **lipid-poor** وصغير، والكلية بتصفّيه بسرعة، فمفيش HDL يتبني.

          وليه اللوز والكبد والطحال؟ نفس الفكرة: الـ macrophages بتاكل كوليسترول طول الوقت ومش لاقية باب تطلّعه منه، فبتتملي في الأماكن المليانة macrophages. والأعصاب بتتأثر لأن الـ Schwann cells بتتملي هي كمان.
      - kind: update
        page: 254
        quote: "Tangier Disease\n  1. Autosomal dominant disorder.\n  2. ABC A1 Transporter gene defect.\n  3. Decreased cholesterol efflux.\n  1. Marked reduction in HDL-C.\n  2. Cholesterol accumulation: Enlarged orange tonsils, hepatosplenomegaly, Peripheral neuropathy.\n  3. Premature atherosclerotic vascular disease.\n  4. Cause of Death: Premature CAD."
        text: "مراجع الوراثة (OMIM) بتوصف Tangier disease إنه **autosomal recessive** (الـ allele الاتنين)، والـ heterozygote عنده high-density lipoprotein (HDL) نص الطبيعي. في الامتحان اكتب إجابة الكتاب: autosomal dominant."
        ref: "OMIM #205400, Tangier disease"
      - kind: aside
        tone: joke
        page: 254
        quote: "Tangier Disease\n  1. Autosomal dominant disorder.\n  2. ABC A1 Transporter gene defect.\n  3. Decreased cholesterol efflux.\n  1. Marked reduction in HDL-C.\n  2. Cholesterol accumulation: Enlarged orange tonsils, hepatosplenomegaly, Peripheral neuropathy.\n  3. Premature atherosclerotic vascular disease.\n  4. Cause of Death: Premature CAD."
        text: "الـ ABCA1 هو **باب الخروج** من الخلية. في Tangier الباب مقفول، فالـ **cholesterol accumulation** بيبدأ: الكوليسترول بيقعد جوّه **يعمل حفلة**: اللوز يبقى برتقاني، والطحال والكبد يتنفخوا. حتى الكوليسترول عايز يخرج ومش لاقي باب."
      - kind: figure
        page: 254
        quote: "Primary Causes of LOW HDL-c:"
        title: "كل سبب وراثي بيكسر محطة"
        alt: "The HDL pathway drawn top to bottom with the defect beside each station: lipid-poor ApoA-I, broken in familial hypoalphalipoproteinemia; the ABCA1 arrow to nascent HDL, broken in Tangier disease; the LCAT arrow to mature HDL, weak in LCAT deficiency; the CETP arrow from mature HDL to VLDL and LDL, overactive with a CETP polymorphism. All four end in low HDL-C and premature CAD."
        caption: "الـ 4 primary causes على نفس رسمة الـ HDL: **الهيكل** (ApoA-I)، **الباب** (ABCA1)، **التنضيج** (LCAT)، و **التصفية** (CETP). والـ 4 نهايتهم واحدة: ==premature CAD==."
        svg: |
