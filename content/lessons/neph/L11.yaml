          بعد الزرع الـ luteinising hormone (LH) والـ follicle-stimulating hormone (FSH) والـ prolactin بيقلّوا والـ estrogen بيعلى، فالدورة والـ ovulation يرجعوا. (بس **20%** ممكن premature ovarian failure، و **31%** مايرجعلهمش الدورة.)

