  - id: dm.L15.016
    kind: card
    topic: diagnosis
    front: Define euglycemic DKA and its frequency.
    back: About 10% of DKA; random glucose <200 mg/dL with the ketosis and metabolic acidosis criteria of DKA.
    src: { page: 188, quote: "10% of the DKA population. RBG <200 mg/dL in the presence of ketosis and metabolic acidosis criteria of DKA" }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.017
    kind: enumerate
    topic: diagnosis
    prompt: Enumerate the causes of euglycemic DKA listed in the lecture.
    points:
      - Insulin injection en route to hospital
      - Antecedent food restriction
      - Pregnancy
      - SGLT2 inhibitors
    pass: 4
    src: { page: 188, quote: "Insulin injection en route to hospital." }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.018
    kind: table
    topic: diagnosis
    title: HHS diagnostic criteria
    columns: [Criterion, Value]
    rows:
      - [Hyperglycemia, "Plasma glucose ≥600 mg/dL (33.3 mmol/L)"]
      - [Hyperosmolarity, "Effective osmolality >300 mOsm/kg [2×Na + glucose (mmol/L)] or total osmolality >320 [2×Na + glucose + urea]"]
      - [No significant ketonemia, "β-hydroxybutyrate <3.0 mmol/L or urine ketones less than 2+"]
      - [No acidosis, "pH ≥7.3 and bicarbonate ≥15 mmol/L"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 189, quote: "Diagnostic criteria HHS" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L15.019
    kind: cloze
    topic: diagnosis
    text: "HHS: glucose ≥{{c1::600}} mg/dL, effective osmolality >{{c2::300}} mOsm/kg (or total >320), and pH ≥{{c3::7.3}} with bicarbonate ≥15 mmol/L."
    src: { page: 189, quote: "Diagnostic criteria HHS" }
    status: unverified
    tags: [numbers]
  - id: dm.L15.020
    kind: mcq
    topic: diagnosis
    stem: A 22-year-old with T1DM has glucose 410 mg/dL, β-hydroxybutyrate 5.2 mmol/L, pH 7.15 and bicarbonate 12 mmol/L. He is drowsy but rousable. Severity and level of care?
    options: [Moderate DKA; step-down or intermediate care, Mild DKA; regular ward, Severe DKA; ICU, HHS; ICU, Euglycemic DKA; observation]
    answer: 0
    why:
      - pH 7.0-7.25, bicarbonate 10 to <15, BOHB 3-6 and alert or drowsy make moderate DKA.
      - Mild needs pH >7.25 or bicarbonate 15-18.
      - Severe needs pH <7.0, bicarbonate <10, BOHB >6 or stupor.
      - HHS has glucose ≥600 and no significant acidosis or ketonemia.
      - His glucose is above 200.
    src: { page: 188, quote: "DKA classification and suggested level of care by severity: mild, moderate, or severe" }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.021
    kind: mcq
    topic: diagnosis
    stem: A 58-year-old with T2DM started empagliflozin 2 months ago. After 3 days of vomiting she has glucose 165 mg/dL, β-hydroxybutyrate 4.5 mmol/L, pH 7.21 and bicarbonate 13. Diagnosis?
    options: [Euglycemic DKA, Starvation ketosis only, HHS, Lactic acidosis, Not DKA because glucose is below 250]
    answer: 0
    why:
      - Glucose <200 with DKA's ketosis and acidosis criteria is euglycemic DKA; SGLT2 inhibitors and food restriction are causes.
      - pH 7.21 with BOHB 4.5 is a true ketoacidosis.
      - HHS needs glucose ≥600 without acidosis.
      - Ketones are high; nothing points to lactate.
      - DKA does not need glucose ≥250; prior diabetes satisfies the D criterion.
    src: { page: 188, quote: "SGLT2 inhibitors" }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.022
    kind: mcq
    topic: diagnosis
    stem: A 76-year-old with T2DM living alone is confused. Glucose 880 mg/dL, Na 148 mmol/L, BOHB 1.1 mmol/L, pH 7.34, bicarbonate 20. Which criteria does he meet?
    options: [HHS, Severe DKA, Moderate DKA, Euglycemic DKA, Mixed DKA-HHS]
    answer: 0
    why:
      - Glucose ≥600, effective osmolality 2×148 + 880/18 ≈ 345 (>300), BOHB <3 and pH ≥7.3 with bicarbonate ≥15 meet HHS.
      - Severe DKA needs pH <7.0 and ketonemia >6.
      - DKA needs BOHB ≥3 and pH <7.3 or bicarbonate <18.
      - His glucose is very high.
      - He has no ketoacidosis, so DKA criteria are not met.
    src: { page: 189, quote: "Diagnostic criteria HHS" }
    status: unverified
  # ---------- p189: labs ----------
  - id: dm.L15.023
    kind: card
    topic: labs
    front: Why is serum sodium usually low in hyperglycemic crises?
    back: Hyperglycemia draws water osmotically from the intracellular to the extracellular space, diluting sodium.
    src: { page: 189, quote: "Usually low due to osmotic flux of water from the intracellular to the extracellular space by hyperglycemia." }
    status: unverified
  - id: dm.L15.024
    kind: card
    topic: labs
    front: What does a high or normal serum sodium mean in DKA or HHS?
    back: A profound degree of free water loss.
    src: { page: 189, quote: "High or normal serum sodium indicates a profound degree of free water loss." }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.025
    kind: cloze
    topic: labs
    text: Corrected Na = measured Na + {{c1::0.016}} × (glucose − 100); that is {{c2::1.6 mEq/L}} for every {{c3::100 mg/dL}} of glucose above 100.
    src: { page: 189, quote: "Corrected Sodium = Measured Sodium + 0.016 x (Serum glucose - 100)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L15.026
    kind: mcq
    topic: labs
    stem: Glucose is 500 mg/dL and measured sodium 132 mEq/L. What is the corrected sodium (book method)?
    options: ["About 138 mEq/L", "About 132 mEq/L", "About 140 mEq/L", "About 128 mEq/L", "About 145 mEq/L"]
    answer: 0
    why:
      - 1.6 × (500 − 100)/100 = 6.4; 132 + 6.4 = 138.4, about 138.
      - That is the uncorrected value.
      - That uses a larger factor than the book's 1.6.
      - Correction adds sodium; it never subtracts.
      - That overcorrects.
    src: { page: 189, quote: "If glucose level is 500 and sodium is 132" }
    status: unverified
    tags: [numbers]
  - id: dm.L15.027
    kind: card
    topic: labs
    front: Why is serum potassium often high at presentation, and what does a low or low-normal potassium mean?
    back: Insulin deficiency, hypertonicity and acidemia shift K out of cells. A low or low-normal K means severe total-body K deficiency.
    src: { page: 189, quote: "Patients with low normal or low serum K have severe total-body K deficiency." }
    status: unverified
    tags: [high-yield]
  # ---------- p190-191: fluids ----------
  - id: dm.L15.028
    kind: card
    topic: fluids
    front: What are the aims of fluid therapy in DKA and HHS?
    back: Correct intravascular, interstitial and intracellular volume depletion, hypertonicity and renal perfusion.
    src: { page: 190, quote: "The aim is to correct (intravascular, interstitial and intracellular) volume depletion, hypertonicity and renal perfusion." }
    status: unverified
  - id: dm.L15.029
    kind: card
    topic: fluids
    front: When are fluids started before insulin?
    back: Usually, and especially with severe volume contraction or hypokalemia.
    src: { page: 190, quote: "It usually started before insulin therapy especially in patients with severe volume contraction and hypokalemia." }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.030
    kind: table
    topic: fluids
    title: Estimating the fluid deficit from orthostatic signs
    columns: [Finding, ECV loss, Approximate deficit]
    rows:
      - ["Orthostatic pulse rise >10/min, BP unchanged", "About 10%", "2 L isotonic saline"]
      - ["Orthostatic BP drop >15/10 mmHg", "15-20%", "3-4 L"]
      - ["Supine hypotension", ">20% (severe)", ">4 L"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1]]
    src: { page: 190, quote: "An orthostatic drop in B.P. ( >15/10 mmHg) indicates a 15-20 % decrease in ECV ( i.e. 3-4 liters)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L15.031
    kind: card
    topic: fluids
    front: "Management algorithm, IV fluids: what is given for severe hypovolemia, and what is the target over the first 8-12 h?"
    back: 0.9% NaCl or another crystalloid at 1.0 L/h for severe hypovolemia; then at a clinically appropriate rate to replace 50% of the estimated deficit in the first 8-12 h. Cardiac compromise needs hemodynamic monitoring or pressors.
    src: { page: 190, quote: "0.9% NaCl or other crystalloid at a clinically appropriate rate aiming to replace 50% of the estimated fluid deficit in the first 8–12 h" }
    status: unverified
  - id: dm.L15.032
    kind: cloze
    topic: fluids
    text: Hyperglycemia is corrected faster (about {{c1::6 h}}) than acidosis (about {{c2::12 h}}), so when glucose falls below {{c3::250}} mg/dL, 5-10% dextrose is added and insulin continued until ketonemia is controlled.
    src: { page: 191, quote: "Hyperglycemia is corrected faster (6h) than acidosis (12h); RBG <250 mg/dl, 5-10% dextrose should be added" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L15.033
    kind: card
    topic: fluids
    front: In euglycemic DKA, when is dextrose started (management algorithm)?
    back: At the start of insulin treatment, 5% or 10% dextrose alongside 0.9% NaCl or crystalloid (glucose <200 mg/dL and positive BOHB).
    src: { page: 190, quote: "In euglycemic DKA (glucose <200 mg/dL and positive BOHB), 5% or 10% dextrose needs to be started alongside 0.9% NaCl/crystalloid" }
    status: unverified
  # ---------- p190-192: insulin, potassium, bicarbonate, additional ----------
  - id: dm.L15.034
    kind: card
    topic: insulin
    front: What are the time goals of insulin therapy in DKA?
    back: Correct hyperglycemia in about 6 h and reverse ketoacidosis in about 12 h.
    src: { page: 191, quote: "The aim of insulin therapy is to correct hyperglycemia (6 h) and reverse ketoacidosis ( 12 h)." }
    status: unverified
  - id: dm.L15.035
    kind: card
    topic: insulin
    front: When should insulin NOT be started in DKA?
    back: With hypokalemia or severe volume contraction until they are corrected; it is preferable to wait for the serum potassium result.
    src: { page: 191, quote: "Insulin should NOT be given if hypokalemia or severe volume contraction is present unless these conditions are corrected." }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.036
    kind: table
    topic: insulin
    title: Insulin dosing in the management algorithm
    columns: [Setting, Route, Dose]
    rows:
      - [Mild DKA, s.c. rapid-acting analog, "0.1 units/kg bolus, then 0.1 units/kg every 1 h or 0.2 units/kg every 2 h"]
      - [Moderate or severe DKA, i.v. short-acting, "Consider 0.1 units/kg bolus if the infusion is delayed; 0.1 units/kg/h fixed-rate infusion"]
      - [HHS, i.v. short-acting, "0.05 units/kg/h fixed-rate infusion"]
      - [Glucose <250 mg/dL, Reduce, "0.05 units/kg/h i.v. (or 0.1 units/kg every 2 h s.c. in mild DKA)"]
    blanks: [[0, 2], [1, 2], [2, 2], [3, 2]]
    src: { page: 190, quote: "When glucose reaches <250 mg/dL, reduce short-acting insulin dose to 0.05 units/kg/h i.v." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L15.037
    kind: table
    topic: insulin
    title: Glucose targets until resolution (algorithm)
    columns: [Crisis, Keep glucose]
    rows:
      - [DKA, "150-200 mg/dL"]
      - [HHS, "200-250 mg/dL"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 190, quote: "Keep glucose between 150 and 200 mg/dL until resolution" }
    status: unverified
    tags: [numbers]
  - id: dm.L15.038
    kind: table
    topic: insulin
    title: Potassium replacement (after adequate urine output ~0.5 mL/kg/h)
    columns: [Serum K, Action]
    rows:
      - ["<3.5 mmol/L", "10-20 mmol/L/h until K >3.5 (faster needs central access) before insulin"]
      - ["3.5-5.0 mmol/L", "10-20 mmol K in each liter of IV fluid to keep K 4-5"]
      - [">5.0 mmol/L", "Start insulin, give no K, check K every 2 h"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 190, quote: "Give 10–20 mmol/L K+ in each liter of i.v. fluid as needed to keep serum K+ between 4 and 5 mmol/L" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L15.039
    kind: enumerate
    topic: insulin
    prompt: Enumerate the side effects of bicarbonate therapy in DKA.
    points:
      - Overshoot alkalosis
      - Altered tissue oxygenation and increased ketone production
      - Hypokalemia
      - Cerebral edema
      - Paradoxical CSF acidosis
    pass: 4
    src: { page: 191, quote: "Paradoxical CSF acidosis" }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.040
    kind: enumerate
    topic: insulin
    prompt: Enumerate the additional measures in managing DKA and HHS.
    points:
      - Broad-spectrum antibiotics if infection or invasive procedures
      - Oxygen if PO2 <80 mmHg
      - Plasma expanders or whole blood for shock
      - Suspect brain edema if coma develops acutely in an alert patient (mannitol)
      - LMWH prophylaxis in HHS for the whole admission
      - CVP monitoring in cardiac patients
      - Urinary catheter only if no urine in the first 3 hours
    pass: 5
    src: { page: 191, quote: "Use broad-spectrum antibiotics if any evidence of infection is present or if invasive procedures are used." }
    status: unverified
  - id: dm.L15.041
    kind: card
    topic: insulin
    front: How is suspected brain edema treated during DKA management?
    back: Mannitol 1 g/kg IV over 30 min, then 12.5 g mannitol in each liter of half-normal saline at 200 mL/h to maintain the raised osmolality.
    src: { page: 192, quote: "give manitol 1g/kg IV over 30 min then add 12.5g manitol to each liter of half-normal saline" }
    status: unverified
    tags: [numbers]
  - id: dm.L15.042
    kind: card
    topic: insulin
    front: Which hyperglycemic crisis has the higher VTE risk, and what prophylaxis is given?
    back: HHS (HHS > DKA); prophylactic LMWH for the full admission unless contraindicated.
    src: { page: 192, quote: "Risk of venous thromboembolism is HHS > DKA, HHS should receive prophylactic LMWH for the full duration of admission" }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.043
    kind: card
    topic: insulin
    front: When is a urinary catheter inserted in DKA?
    back: Only if no urine is passed in the first 3 hours.
    src: { page: 192, quote: "Perform urinary catheterization only if no urine is passed in the first 3 hours" }
    status: unverified
  - id: dm.L15.044
    kind: mcq
    topic: insulin
    stem: A 19-year-old in moderate DKA has K 3.1 mmol/L and good urine output. What comes first?
    options: [Potassium 10-20 mmol/h until K >3.5 before starting insulin, Insulin 0.1 units/kg/h now with K in the fluid, Bicarbonate infusion, Insulin bolus then recheck K in 4 h, No K because acidosis raises K]
    answer: 0
    why:
      - With K <3.5, give K first; insulin is not given with hypokalemia until corrected.
      - Insulin drives K into cells and can cause dangerous hypokalemia.
      - Bicarbonate causes hypokalemia among its side effects.
      - Insulin must wait for K.
      - A low K despite acidosis means severe total-body depletion.
    src: { page: 191, quote: "Insulin should NOT be given if hypokalemia or severe volume contraction is present unless these conditions are corrected." }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.045
    kind: order
    topic: fluids
    prompt: Order the first steps in managing moderate DKA in a patient with K 4.2 mmol/L.
    steps:
      - Determine hydration status and start 0.9% NaCl
      - Check potassium and urine output
      - Start fixed-rate IV insulin 0.1 units/kg/h with 10-20 mmol K per liter
      - When glucose <250, reduce insulin to 0.05 units/kg/h and add 5-10% dextrose
      - Keep glucose 150-200 until DKA resolves, then overlap s.c. insulin 1-2 h
    src: { page: 190, quote: "Determine hydration status" }
    status: unverified
  # ---------- p192-193: resolution and transition ----------
  - id: dm.L15.046
    kind: card
    topic: resolution
    front: What are the book's criteria for resolution of DKA?
    back: "Glucose <200 mg/dL plus two of: bicarbonate ≥15 mEq/L, venous pH >7.3, calculated anion gap ≤12 mEq/L."
    src: { page: 192, quote: "RBG< 200 mg/dl and two of the following criteria" }
    status: unverified
    tags: [high-yield]
    update:
      text: "The 2024 consensus defines DKA resolution as β-hydroxybutyrate <0.6 mmol/L with venous pH ≥7.3 or bicarbonate ≥18 mmol/L; glucose is no longer a resolution criterion."
      ref: "ADA/EASD/JBDS/AACE/DTS hyperglycemic crises consensus 2024"
