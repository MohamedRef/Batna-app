          - ["SSc antibodies", "3"]
        hide: [[0, 1], [1, 1], [3, 1], [5, 1], [6, 1]]
      - kind: update
        page: 345
        quote: "| Criteria domain | Sub-criteria | Weight |\n|---|---|---|\n| Skin thickening (count the higher of the three) | Skin thickening of the fingers of both hands extending proximal to the MCP joints | 9 |\n| | Puffy fingers | 2 |\n| | Whole finger, distal to MCP joint | 4 |\n| Fingertip lesions (count the higher of the two) | Digital tip ulcers | 2 |\n| | Pitting scars | 3 |\n| Telangiectasia | | 2 |\n| Abnormal nailfold capillaries | | 2 |\n| Lung involvement | PAH and/or ILD | 2 |\n| Raynaud's phenomenon | | 3 |\n| SSc-related antibodies | Any of ACA, ATA (anti-Scl 70), RNA polimerase | 3 |"
        text: "جدول الكتاب ناقصه الـ **threshold**. في الـ 2013 American College of Rheumatology (ACR)/European League Against Rheumatism (EULAR): مجموع **9 أو أكتر** = systemic sclerosis، والـ skin thickening proximal to MCPs (9 نقط) لوحدها كفاية. الأرقام نفسها زي الكتاب."
        ref: "ACR/EULAR classification criteria for systemic sclerosis, 2013"
      - kind: check
        page: 345
        quote: "| Criteria domain | Sub-criteria | Weight |\n|---|---|---|\n| Skin thickening (count the higher of the three) | Skin thickening of the fingers of both hands extending proximal to the MCP joints | 9 |\n| | Puffy fingers | 2 |\n| | Whole finger, distal to MCP joint | 4 |\n| Fingertip lesions (count the higher of the two) | Digital tip ulcers | 2 |\n| | Pitting scars | 3 |\n| Telangiectasia | | 2 |\n| Abnormal nailfold capillaries | | 2 |\n| Lung involvement | PAH and/or ILD | 2 |\n| Raynaud's phenomenon | | 3 |\n| SSc-related antibodies | Any of ACA, ATA (anti-Scl 70), RNA polimerase | 3 |"
        question: "Raynaud phenomenon, puffy fingers and positive anticentromere antibody, nothing else. Score?"
        options:
          - "8, not enough"
          - "9, classified as SSc"
          - "5, not enough"
          - "11, classified as SSc"
        answer: 0
        why:
          - "صح: Raynaud 3 + puffy fingers 2 + anticentromere antibody (ACA) 3 = 8، أقل من 9 بنقطة. (ممكن تكون very early systemic sclerosis (SSc)، بس لسه مش classified.)"
          - "الـ 9 محتاجة نقطة كمان، زي telangiectasia أو nailfold capillaries."
          - "إنت نسيت الـ antibody (3 نقط)."
          - "إنت حسبت sclerodactyly (4) بدل puffy fingers (2)."
      - kind: explain
        page: 346
        title: "الـ ARA القديمة: major وminor"
        quote: "Minor features include sclerodactyly, erosions, atrophia of the fingertips, and bilateral lung fibrosis."
        text: |
          الكتاب كمان بيدّيك criteria الـ **American Rheumatism Association (ARA)**:
          - **Major:** ==centrally located skin sclerosis== في الـ arms أو الـ face أو الـ neck
          - **Minor:** **sclerodactyly**، **erosions** و**atrophy of the fingertips**، **bilateral lung fibrosis**

          التشخيص = ==1 major + 2 minor==.

          ليه الـ central skin بالذات major؟ لأن الجلد السميك في الدراعات والوش والرقبة هو أوضح علامة للمرض، أما الـ minor ممكن تيجي في أمراض تانية (lung fibrosis مثلًا)، فمحتاج اتنين منهم جنب الـ major.
      - kind: check
        page: 346
        quote: "SSc is diagnosed when a patient has 1 major and 2 minor criteria."
        question: "By the ARA criteria in the lecture, a patient has sclerodactyly and bilateral lung fibrosis, but the skin of the arms, face and neck is normal. Diagnosis?"
        options: ["Not diagnosed: no major feature", "Diagnosed: 2 minor features are enough", "Diagnosed: lung fibrosis is a major feature", "Not diagnosed: needs 3 minor"]
        answer: 0
        why:
          - "صح: لازم **major** واحد (centrally located skin sclerosis) + 2 minor."
          - "الـ minor لوحدهم مش كفاية مهما كانوا."
          - "الـ bilateral lung fibrosis من الـ **minor**."
          - "القاعدة 1 major + 2 minor، مش 3 minor."
      - kind: aside
        tone: tip
        page: 346
        quote: "Malignant scleroderma most often occurs in men, usually in elderly men. An accelerated course of malignant scleroderma leads to death."
        text: "الـ systemic sclerosis (SSc) عموماً ستات (4 : 1)، بس الـ **malignant scleroderma** بيعكس الآية: **رجالة كبار في السن**، ومساره accelerated بيوصل للوفاة. سؤال «مين بيجيله الـ malignant؟» إجابته الراجل العجوز."
      - kind: try
        items: [rheum.L21.001, rheum.L21.003, rheum.L21.006, rheum.L21.010, rheum.L21.012]
    recap:
      - "HLA-B8, DR3, DR5, DR52 + environment ← cells + fibroblasts ← IL-4, IL-6, TGF-β, PGF, CTGF ← collagen."
      - "VEGF + anti-endothelial Ab = scarring و vascular dysfunction."
      - "2013: proximal skin 9 لوحدها كفاية؛ skin وfingertips خد الأعلى؛ Raynaud 3، antibodies 3، الباقي 2. المجموع ≥9."
      - "ARA: 1 major (central skin sclerosis) + 2 minor."
      - "Malignant scleroderma = رجالة كبار، accelerated، مميت."
    practice: [rheum.L21.001, rheum.L21.002, rheum.L21.003, rheum.L21.004, rheum.L21.005, rheum.L21.006, rheum.L21.007, rheum.L21.008, rheum.L21.009, rheum.L21.010, rheum.L21.011, rheum.L21.012]
