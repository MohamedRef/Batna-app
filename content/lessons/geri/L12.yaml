  - id: geri.L12.lesson3
    title: "العلامات، وإزاي نمنع"
    hook: "النضارة المكسورة، الحبوب اللي زايدة في العلبة، والابن اللي مش عايز يسيبك مع أمه لوحدها. دي مش صدف."
    minutes: 9
    pages: [216, 219]
    topics: [signs, prevention]
    goals:
      - "تعرف العلامات لكل نوع"
      - "متقبلش تفسير «ده من الـ dementia» بسهولة"
      - "تنصح الكبير والـ caregiver إزاي يمنعوا الإساءة"
    status: unverified
    steps:
      - kind: explain
        page: 216
        quote: "At first, you might not recognize or take seriously signs of elder abuse. They may appear to be symptoms of dementia or signs of the elderly person's frailty—or caregivers may explain them to you that way. In fact, many of the signs and symptoms of elder abuse do overlap with symptoms of mental deterioration, but that doesn't mean you should dismiss them on the caregiver's say-so."
        title: "ليه بنفوّتها؟"
        text: |
          العلامات ممكن تبان زي ==dementia== أو frailty، والـ caregiver نفسه ممكن يفسّرها كده. فيه overlap فعلًا مع التدهور الذهني، بس **ده مش سبب** تصدّق كلام الـ caregiver وتمشي.

          **علامات عامة**: خناق أو توتر دايم بين الـ caregiver والكبير، وتغيير في شخصية الكبير أو سلوكه. لو مش متأكد، دوّر على **clusters** من العلامات الجسدية والسلوكية.

          ليه clusters؟ لأن كل علامة لوحدها ليها تفسير بريء: الكبير بيقع، وبيخس، وبينسى. بس كدمة + وزن نازل + caregiver متوتر + أدوية زايدة في العلبة مع بعض، ده نمط صعب يتفسّر بالصدفة.
      - kind: explain
        page: 216
        quote: "Unexplained signs of injury, such as bruises, welts, or scars, burns especially if they appear symmetrically on two sides of the body."
        title: "علامات الـ physical abuse"
        text: |
          - كدمات أو حروق مش مفهومة، خصوصًا لو ==symmetrical== على الناحيتين. ليه الـ symmetrical؟ التفسير المقبول (مش في الكتاب): الوقعة بتعوّر ناحية واحدة وعلى الحتت البارزة، لكن مسك الدراعين الاتنين بالعافية بيسيب نفس العلامة على الناحيتين.
          - كسور، التواءات، خلع.
          - Overdose، أو أدوية **زايدة** في العلبة عن المفروض (مش بتتاخد).
          - نضارة أو إطار مكسور.
          - علامات **restraint**: آثار حبل على الرسغ.
          - الـ caregiver **رافض** يسيبك مع المريض لوحده.
      - kind: aside
        tone: tip
        page: 217
        quote: "Signs of being restrained, such as rope marks on wrists Caregiver's refusal to allow you to see the elder alone."
        text: "عادة كويسة في عيادة المسنين: اكشف على المريض **لوحده** جزء من الزيارة. لو الـ caregiver رفض بإصرار، ده نفسه علامة."
      - kind: match
        page: 217
        quote: "In addition to the general signs above, indications of emotional elder abuse include:\n  Threatening, belittling, or controlling caregiver behavior that you witness.\n  Behavior from the elder that mimics dementia, such as rocking, sucking, or mumbling to oneself.\n  Sexual elder abuse warning signs.\n  Bruises around breasts or genitals.\n  Unexplained vaginal or anal bleeding.\n  Torn, stained, or bloody underclothing."
        prompt: "وصّل العلامة بنوع الإساءة:"
        pairs:
          - ["Rocking and mumbling; belittling caregiver", "Emotional"]
          - ["Bruises around breasts or genitals", "Sexual"]
          - ["Bed sores, dehydration, dirty bedding", "Neglect"]
          - ["ATM use while bedridden", "Financial"]
          - ["Duplicate billing, over-medication", "Healthcare fraud"]
        why: "الـ emotional abuse ممكن يعمل سلوك شبه الـ dementia (rocking، sucking، mumbling). الـ neglect بيبان في الجسم والبيت. والـ financial بيبان في الحساب والورق."
      - kind: reveal
        page: 217
        quote: "Behavior from the elder that mimics dementia, such as rocking, sucking, or mumbling to oneself."
        prompt: "ست كبيرة بقت بتتهز في مكانها، بتمص صباعها، وبتكلم نفسها. الـ caregiver بيقول «الـ dementia زادت». تفكر في إيه كمان؟"
        answer: |
          الكتاب بيقول إن الـ **emotional abuse** ممكن يعمل سلوك **mimics dementia**: rocking، sucking، mumbling to oneself. ولو شفت الـ caregiver قدامك بيهدد أو بيقلل منها أو بيتحكم فيها، ده يقوّي الشك.

          التفسير المقبول (مش في الكتاب): الحركات دي طريقة الإنسان الخايف يهدّي نفسه لما مش قادر يهرب أو يتكلم. عشان كده ما تقفلش الموضوع على «dementia زادت» قبل ما تشوفها لوحدها وتسأل.
      - kind: explain
        page: 217
        quote: "Elder neglect by caregivers or self-neglect warning signs\n  Unusual weight loss, malnutrition, dehydration.\n  Untreated physical problems, such as bed sores.\n  Unsanitary living conditions: dirt, bugs, soiled bedding and clothes.\n  Unsuitable clothing or covering for the we at her.\n  Being left dirty or unbathed Unsafe living conditions (no heat or running water; faulty electrical wiring, other fire hazards).\n  Desertion of the elder at a public place.\n  Financial exploitation warning signs.\n  Significant withdrawals from the elder's accounts.\n  Sudden changes in the elder's financial condition.\n  Items or cash missing from the senior's household.\n  Suspicious changes in wills, power of attorney, titles, and policies.\n  Addition of names to the senior's signature card."
        title: "Neglect و financial"
        text: |
          **Neglect** (من الـ caregiver أو self-neglect): وزن نازل، malnutrition، dehydration، **bed sores** مش متعالجة، بيت وسخ وحشرات، لبس مش مناسب للجو، متساب من غير حمّام، بيت مش آمن (مفيش تدفئة أو مية، كهربا بايظة)، أو اتساب في مكان عام.

          ليه الـ self-neglect معاهم؟ عشان الشكل واحد: الكتاب بيحط علامات الـ neglect من الـ caregiver ومن المريض نفسه في نفس القايمة، والتفسير بيتعرف من الـ history.

          **Financial**: سحب كبير من الحساب، تغيير مفاجئ في وضعه المادي، فلوس أو حاجات بتختفي، تغيير مريب في ==wills== أو power of attorney، أسماء جديدة على الـ signature card، فواتير مش مدفوعة رغم إن معاه فلوس، ونشاط مستحيل يعمله (ATM وهو في السرير).
      - kind: explain
        page: 218
        quote: "Healthcare fraud and abuse warning signs\n  Duplicate billings for the same medical service or device.\n  Evidence of overmedication or under-medication.\n  Evidence of inadequate care when bills are paid in full.\n  Problems with the care facility: poorly trained, poorly paid, or insufficient staff; crowding; inadequate responses to questions about care."
        title: "Healthcare fraud"
        text: |
          - **Duplicate billing** لنفس الخدمة أو الجهاز.
          - ==Over- or under-medication==.
          - رعاية ضعيفة والفواتير مدفوعة كاملة.
          - مشاكل في المكان: staff قليل أو مش متدرب أو مرتبه ضعيف، زحمة، وردود مش واضحة على أسئلتك.

          ليه مشاكل الـ staff علامة؟ التفسير المقبول (مش في الكتاب): نفس فكرة الـ caregiver المضغوط في البيت، بس على مستوى مؤسسة: ممرضة واحدة لعشرين مريض مش هتلحق، فالإهمال بيحصل حتى من غير قصد.
