  - id: endo.L03.lesson2
    title: "الكالسيوم العالي في السرطان"
    hook: "مريض سرطان رئة مش مركّز، إمساك، وبيشرب مية كتير. الكالسيوم 15. ومين السبب؟"
    minutes: 8
    pages: [35, 36]
    topics: [pthrp]
    goals:
      - "تعرف التلات ميكانيزمات للـ hypercalcemia في الأورام"
      - "تفرّقها عن الـ primary hyperparathyroidism بالتحاليل"
      - "تعالج حسب مستوى الكالسيوم"
    status: unverified
    steps:
      - kind: explain
        page: 35
        quote: "Etiology:\n  1. T cell lymphoma 50%.\n  2. Multiple myeloma 40%.\n  3. Bronchogenic Ca.12%.\n  4. Others, Ca. bladder, GIT, ovary, head and neck."
        title: "الأسباب حسب الكتاب"
        text: |
          أول حالة اتسجلت سنة **1924**. الأسباب:
          - ==T cell lymphoma 50%==.
          - **Multiple myeloma 40%**.
          - **Bronchogenic carcinoma 12%**.
          - وغيرهم: bladder، gastrointestinal tract (GIT)، ovary، head and neck.
      - kind: figure
        page: 35
        quote: "Pathogenesis:\n  1) Humoral hypercalcemia of Malignancy \"HHM\" Caused by over expression of gene encoding for PTHrP or rarely PTH.\n  2) Local osteolytic hypercalcemia \"LOH\"\n    Caused by increased cytokines secreted by malignant cells of lymphoma.\n    Leukemia or myleoma.\n    Osteoclast activating factor represents the biological.\n    Effectors of these cytokines ( TNF, Interleukine 1 and lymphotoxin)."
        title: "التلات طرق"
        alt: "Three columns. HHM: the tumour secretes PTHrP (rarely parathyroid hormone, PTH) into blood, acting on bone and kidney. LOH: lymphoma, leukaemia or myeloma cells in bone release cytokines (TNF, IL-1, lymphotoxin) that activate osteoclasts. Vitamin D: B-cell lymphoma makes 1,25-dihydroxyvitamin D, raising gut calcium absorption."
        caption: "humoral hypercalcaemia of malignancy (HHM) بهرمون في الدم، local osteolytic hypercalcaemia (LOH) بـ cytokines جوه العضمة، و vitamin D من الـ B-cell lymphoma."
        svg: |
          <svg viewBox="0 0 330 270" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="E03a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="10" y="10" width="310" height="70" rx="10" class="fg-acc"/>
            <text x="22" y="32" class="t-b">1. HHM</text>
            <text x="22" y="52" class="t-sm">Tumour → PTHrP (rarely PTH) in blood</text>
            <text x="22" y="70" class="t-sm t-mut">humoral: works at a distance</text>
            <rect x="10" y="95" width="310" height="80" rx="10" class="fg-bad"/>
            <text x="22" y="117" class="t-b">2. LOH</text>
            <text x="22" y="137" class="t-sm">Lymphoma, leukaemia, myeloma in bone</text>
            <text x="22" y="155" class="t-sm">→ TNF, IL-1, lymphotoxin</text>
            <text x="22" y="170" class="t-sm t-mut">(osteoclast activating factor)</text>
            <rect x="10" y="190" width="310" height="70" rx="10" class="fg-good"/>
            <text x="22" y="212" class="t-b">3. Hypervitaminosis D</text>
            <text x="22" y="232" class="t-sm">↑ 1,25-dihydroxy vit D</text>
            <text x="22" y="250" class="t-sm t-mut">especially B cell lymphoma</text>
          </svg>
      - kind: check
        page: 35
        quote: "3) Hypervitaminosis D 1,25 Dihydroxy vit. D is increased especially in B cell lymphoma."
        question: "Hypercalcaemia from raised 1,25-dihydroxyvitamin D is typical of:"
        options: ["B-cell lymphoma", "Squamous lung cancer", "Breast cancer", "Seminoma"]
        answer: 0
        why:
          - "صح: الكتاب بيربطها بالـ B cell lymphoma."
          - "الرئة بتاخد HHM (PTHrP) أكتر."
          - "مش في الكتاب بالميكانيزم ده."
          - "مش في الكتاب."
      - kind: explain
        page: 35
        quote: "Clinical picture of ectopic PTHrP hypercalcemia\n  Asymptomatic.\n  Renal stone, polyuria, polydipsia, renal failure.\n  Nausea, vomiting, constipation, peptic ulcer and pancreatitis.\n  Bone pain, Proximal myopathy, keratitis.\n  Lethargy, fatigue, confusion, stupor."
        title: "الصورة الإكلينيكية"
        text: |
          ممكن ==asymptomatic==، أو:
          - **Renal**: stones، polyuria، polydipsia، renal failure.
          - **GIT**: nausea، vomiting، constipation، peptic ulcer، pancreatitis.
          - **Bone**: bone pain، proximal myopathy، و **keratitis**.
          - **central nervous system (CNS)**: lethargy، fatigue، confusion، stupor.
      - kind: aside
        tone: tip
        page: 35
        quote: "Clinical picture of ectopic PTHrP hypercalcemia\n  Asymptomatic.\n  Renal stone, polyuria, polydipsia, renal failure.\n  Nausea, vomiting, constipation, peptic ulcer and pancreatitis.\n  Bone pain, Proximal myopathy, keratitis.\n  Lethargy, fatigue, confusion, stupor."
        text: "نفس الـ stones, bones, groans, moans بتاعة الـ hyperparathyroidism: renal stone و polyuria، bone pain، و GIT symptoms. بس هنا بسرعة أكبر وبكالسيوم أعلى."
      - kind: table
        page: 36
        quote: "Can be differentiated from 1ry hyperparathyroidism by\n  Hypercalcemia with low or normal PTH.\n  High PTHrP plasma level.\n  High urinary cyclic AMP.\n  High renal calcium clearance.\n  Low to normal 1,25 Dihydroxy vit. D."
        title: "إزاي تفرّقها عن الـ primary HPT؟"
        columns: ["Test", "PTHrP hypercalcaemia"]
        rows:
          - ["PTH", "Low or normal"]
          - ["PTHrP", "High"]
          - ["Urinary cAMP", "High"]
          - ["Renal Ca clearance", "High"]
          - ["1,25-dihydroxy vit D", "Low to normal"]
        hide: [[0, 1], [2, 1], [4, 1]]
      - kind: reveal
        page: 36
        quote: "Can be differentiated from 1ry hyperparathyroidism by\n  Hypercalcemia with low or normal PTH.\n  High PTHrP plasma level.\n  High urinary cyclic AMP.\n  High renal calcium clearance.\n  Low to normal 1,25 Dihydroxy vit. D."
        prompt: "الـ parathyroid hormone-related protein (PTHrP) بيعمل نفس شغل الـ parathyroid hormone (PTH). ليه الـ 1,25-D مش عالي زي الـ primary HPT؟"
        answer: "الـ PTHrP بيأثر على العضمة والـ tubules زي الـ PTH (فالـ urinary cAMP عالي)، بس تنشيطه لإنزيم الـ 1-alpha hydroxylase في الكلية أضعف. كمان الكالسيوم العالي جدًا بيكبت الإنزيم. علشان كده الكتاب بيقول low to normal. (التفسير ده فسيولوجيا مقبولة، الكتاب ذكر النتيجة بس.)"
      - kind: order
        page: 36
        quote: "Treatment\n  Mild hypercalcemia (12 mg/dl) Hydration with saline.\n  Moderate hypercalcemia (13-15 mg/dl) Biphosphonate plus diuretics.\n  Severe hypercalcemia more than (15 mg/dl) above plus calcitonin and mithramycin.\n  Special measures: phosphate, glucocorticoid or dialysis."
        prompt: "رتّب العلاج مع زيادة الكالسيوم:"
        steps:
          - "12 mg/dl: saline hydration"
          - "13-15 mg/dl: + bisphosphonate and diuretic"
          - ">15 mg/dl: + calcitonin and mithramycin"
          - "Special: phosphate, glucocorticoid or dialysis"
        why: "كل مرحلة بتضيف على اللي قبلها. الـ special measures للحالات الخاصة."
      - kind: update
        page: 36
        quote: "Treatment\n  Mild hypercalcemia (12 mg/dl) Hydration with saline.\n  Moderate hypercalcemia (13-15 mg/dl) Biphosphonate plus diuretics.\n  Severe hypercalcemia more than (15 mg/dl) above plus calcitonin and mithramycin.\n  Special measures: phosphate, glucocorticoid or dialysis."
        text: "الكتاب: bisphosphonate + diuretics للـ 13-15، وفوق 15 نزوّد calcitonin و mithramycin. الممارسة الحالية: intravenous (IV) saline الأول، بعدين IV bisphosphonate (zoledronic acid) أو denosumab، و calcitonin لو محتاج مفعول سريع في الحالات الشديدة. الـ mithramycin (plicamycin) بطّل يستخدم، والـ loop diuretic بس بعد تعويض السوائل أو لو في fluid overload. في الامتحان اكتب إجابة الكتاب."
        ref: "Endocrine Society clinical practice guideline: treatment of hypercalcemia of malignancy in adults 2022"
      - kind: case
        page: 36
        quote: "Treatment\n  Mild hypercalcemia (12 mg/dl) Hydration with saline.\n  Moderate hypercalcemia (13-15 mg/dl) Biphosphonate plus diuretics.\n  Severe hypercalcemia more than (15 mg/dl) above plus calcitonin and mithramycin.\n  Special measures: phosphate, glucocorticoid or dialysis."
        stem: "A 62-year-old with lung cancer: Ca 15.6 mg/dL, PTH low."
        steps:
          - question: "Which mechanism?"
            options: ["HHM (PTHrP)", "Primary hyperparathyroidism", "Vitamin D intoxication", "Milk-alkali"]
            answer: 0
            why: "PTH واطي مع ورم = HHM غالبًا؛ أكّد بالـ PTHrP."
          - question: "Treatment at this level?"
            options: ["Saline + bisphosphonate + diuretic + calcitonin + mithramycin", "Saline only", "Bisphosphonate only", "Dialysis first"]
            answer: 0
            why: "أكتر من 15: كل اللي فات + calcitonin و mithramycin."
      - kind: try
        items: [endo.L03.019, endo.L03.023, endo.L03.026, endo.L03.027, endo.L03.074]
    recap:
      - "الأسباب: T cell lymphoma 50%، myeloma 40%، bronchogenic 12%."
      - "HHM (PTHrP)، LOH (TNF/IL-1/lymphotoxin)، vit D (B cell lymphoma)."
      - "PTH low/normal، PTHrP ↑، urinary cAMP ↑، Ca clearance ↑، 1,25-D low/normal."
      - "12: saline؛ 13-15: + bisphosphonate + diuretic؛ >15: + calcitonin + mithramycin."
    practice: [endo.L03.019, endo.L03.020, endo.L03.021, endo.L03.022, endo.L03.023, endo.L03.024, endo.L03.025, endo.L03.026, endo.L03.027, endo.L03.058, endo.L03.059, endo.L03.060, endo.L03.069, endo.L03.074, endo.L03.075]
