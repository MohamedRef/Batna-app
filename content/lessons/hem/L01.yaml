        page: 7
        quote: "In certain abnormal circumstances, the spleen, liver and lymph nodes revert back to producing immature blood cells. In these cases, enlargement of the spleen and liver is frequently noted on physical examination. This situation suggests that undifferentiated primitive blood cells may be present in these areas and are able to proliferate if an appropriate stimulus is present."
        prompt: "اشمعنى الطحال والكبد والـ lymph nodes بالذات اللي بيرجعوا يعملوا دم؟"
        answer: |
          الكتاب بيقول إن فيهم **undifferentiated primitive blood cells** ممكن تتكاثر **لو جالها stimulus مناسب**.

          واربطها بأول درس: الـ **fetal liver** كان المصنع الرئيسي في الـ second trimester. يعني الأعضاء دي مش بتتعلم شغلانة جديدة، دي **بترجع لشغلانتها القديمة**. وده سبب إن أول علامة بتلاقيها في الكشف هي إن الطحال والكبد **كبروا**.
      - kind: explain
        page: 8
        title: "ليه الـ HSCs حلوة للـ gene therapy؟"
        quote: "Extensive clinical experience with bone marrow transplantation"
        text: |
          1. **Self-renewal + multilineage differentiation**: خلية واحدة متعدلة تفضل تطلّع الـ transgene لمدة طويلة وفي كل الـ lineages.
          2. **أمراض كتير** (وراثية ومكتسبة) بتبوّظ الـ haematopoietic stem cell (HSC) وولادها، فإصلاح الأصل يصلح الكل.
          3. **خبرة طويلة** في الـ ==bone marrow transplantation==.
          4. (لسه سؤال) ممكن تطلّع **خلايا مش دموية** تروح للأماكن الصح.

          والمنطق ورا كل نقطة: الـ stem cell **بتعيش طول العمر** (1)، و**هي أصل المرض** في أمراض كتير (2)، و**إحنا عارفين ننقلها** من سنين بالـ transplant (3). علامة الاستفهام في (4) من الكتاب نفسه: لسه مش مثبتة.
      - kind: check
        page: 8
        quote: "Property of self-renewal and multilineage differentiation, allowing long term and widely distributed production of the transgene from a single engineered cell"
        question: "Why can one engineered haematopoietic stem cell give long-term gene therapy?"
        options:
          - "Self-renewal and multilineage differentiation"
          - "It lives in the blood for a few weeks"
          - "It cannot divide, so the gene stays stable"
          - "It only makes red cells"
        answer: 0
        why:
          - "صح: الـ **self-renewal** بيخليها تفضل موجودة سنين، والـ **multilineage differentiation** بتوزّع الـ transgene على كل الخطوط."
          - "دي خلية جوه النخاع بتفضل طول العمر، مش خلية في الدم بتموت بعد أسابيع."
          - "بالعكس: هي بتتقسم، وده اللي بيخلي النسخة المتعدلة تكتر."
          - "هي multipotent: بتطلّع كل الخطوط، مش الأحمر بس."
