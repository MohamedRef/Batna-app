        why:
          - "صح: Grade E = 4 + necrosis 30–50% = 4، يعني 8."
          - "ده لو حسبت الـ necrosis 2 (يعني < 30%)."
          - "Grade D (3) + 4. بس هنا فيه collectionين، يعني Grade E."
          - "10 هو الـ maximum: Grade E مع necrosis > 50%."
      - kind: explain
        page: 283
        title: "MRI و MRCP و EUS: كل واحد ليه شغلانة"
        text: |
          **MRI**: البديل لما الـ CT ممنوع، والأحسن لما تحتاج تشوف جوه الـ collection.
          - لو الصبغة ممنوعة (contrast allergy، renal insufficiency، pregnancy): **T2-weighted** من غير gadolinium بيشوف الـ necrosis. عيبه إنه أقل حساسية للـ **gas foci** (علامة العدوى).
          - **عند 4 weeks لو هتتدخل**: بيفرّق solid vs fluid أحسن من الـ CT (ESGE 2018)، يعني بيقولك فيه كراكيب ولا مية بس، وده بيحدد نوع الـ drainage.

          **MRCP**: صورة للمواسير.
          - بيلقط **CBD stones** لحد 3 mm.
          - بيشوف **pancreatic duct disruption** لو الـ CT مش حاسم (sensitivity 98%، specificity 84.4%).

          **EUS**: المخبر. بيتعمل لتدوير السبب في **recurrent idiopathic AP** (حصوات دقيقة، ورم صغير، divisum).
