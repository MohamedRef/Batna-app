            <text x="20" y="174" class="t-sm t-mut">Abnormal manometry: 65%</text>
            <text x="20" y="190" class="t-sm">Relief: 85% if abnormal, 35% if normal</text>
            <text x="20" y="204" class="t-sm t-acc t-b">So: manometry decides</text>
            <rect x="10" y="218" width="310" height="88" rx="7" class="fg-box"/>
            <text x="20" y="236" class="t-b">Type III</text>
            <text x="20" y="254" class="t-sm">Biliary-type pain only</text>
            <text x="20" y="270" class="t-sm t-mut">Abnormal manometry: 59%</text>
            <text x="20" y="286" class="t-sm">Relief: 55–60% if abnormal, under 10% if normal</text>
            <text x="20" y="300" class="t-sm t-bad t-b">So: least to gain from ERCP</text>
          </svg>
      - kind: check
        page: 134
        quote: "SOM is not clinically indicated for patients with type I biliary SOD. Rather, endoscopic sphincterotomy can be performed empirically."
        question: "Post-cholecystectomy biliary pain, ALT twice normal on two visits, CBD 12 mm, no stones on MRCP. Next step"
        options:
          - "Empirical endoscopic sphincterotomy"
          - "Sphincter of Oddi manometry first"
          - "Nifedipine and review in 3 months"
          - "Repeat MRCP to diagnose SOD"
        answer: 0
        why:
          - "صح: ده type I، والـ relief 90–95% حتى لو الـ SOM طبيعية، فبنعمل sphincterotomy من غير manometry."
          - "الـ SOM ممكن تطلع normal في 14–35% من type I وتضلّلك، فمش indicated."
          - "الـ medical therapy بتقلل الضغط بس من غير outcome data ثابتة."
          - "الـ MRCP والـ EUS بيستبعدوا stones و tumors، بس **cannot diagnose** SOD."
      - kind: explain
        page: 133
        quote: "Such patients have a 3-fold increase in the risk of post-ERCP pancreatitis, with absolute rates exceeding 25%"
        title: "ERCP: خطر عالي، فاختار صح"
        text: |
          - الـ evaluation بتبدأ بـ **liver tests**، amylase و lipase، و US أو CT أو MRCP. الـ transaminases لو عالية تبقى بسيطة (**less than 3–4× ULN**).
          - Noninvasive: biliary scintigraphy، fatty meal أو CCK أو secretin-stimulated US، secretin MRI أو EUS.
          - مرضى SOD عندهم ==3-fold== خطر **post-ERCP pancreatitis**، يعني **أكتر من 25%** من غير وقاية.
          - الوقاية: ==temporary pancreatic stent== و **rectal NSAIDs**.
          - علشان كده ERCP بالـ manometry للأعراض **severe or debilitating** بس.

          الـ medical therapy (nifedipine، nitrates، octreotide، antispasmodics، PDE5 inhibitors) بتقلل الضغط بس الـ outcome data ناقصة.
      - kind: table
        page: 135
        quote: "Builds up to a steady level and lasts 30 minutes or longer"
        title: "Rome IV: domain E"
        columns: ["Disorder", "Core criterion", "Also needed"]
        rows:
          - ["E1 Biliary pain", "Epigastric or RUQ pain, steady, 30 minutes or longer, not daily", "Disabling; under 20% linked to bowel movements, posture or acid suppression"]
          - ["E1b Functional biliary SO disorder", "Biliary pain + raised enzymes OR dilated duct, not both", "No duct stones or structural cause"]
          - ["E2 Functional pancreatic SO disorder", "Recurrent pancreatitis (enzymes >3× normal and/or imaging)", "Other causes excluded, negative EUS, abnormal manometry"]
        hide: [[0, 1], [1, 1], [2, 2]]
      - kind: case
