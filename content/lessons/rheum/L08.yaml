  - id: rheum.L08.lesson9
    title: "PAN: الـ medium vessel اللي بيعمل aneurysms"
    hook: "راجل بيخس، خصيته بتوجعه، ورجله ارتخت فجأة، والـ angiography مليانة بلالين صغيرة. ده PAN."
    minutes: 10
    pages: [141, 144]
    topics: [pan]
    goals:
      - "تعرف الـ ACR 1990 والمعيار التاني للـ PAN"
      - "تفهم ليه الـ PAN بيعمل aneurysms و infarcts من غير GN"
      - "تعرف الـ cutaneous PAN والعلاج حسب الـ severity"
    status: unverified
    steps:
      - kind: explain
        page: 141
        title: "PAN: ACR 1990"
        quote: "Weight loss of more than 4 kg which is not related with diet or other factors from the beginning of the disease."
        text: |
          10 criteria:
          - **Weight loss >4 kg**، **livedo reticularis**، ==testicular pain==
          - Myalgia، **mono- أو polyneuropathy**، diastolic **>90**
          - Urea/creatinine عالي، ==Hepatitis B surface antigen (HBsAg) أو anti-HBs==
          - **Abnormal coeliac أو renal angiography** (aneurysms)، و biopsy فيها polymorphonuclear neutrophils (PMNs) في الشرايين

          المعيار التاني (p141): biopsy أو angiography **mandatory** + ≥2 من 7، ولو MRA سلبي اعمل **conventional angiography**.
      - kind: explain
        page: 141
        title: "كل criterion ليه سبب"
        quote: "Weight loss of more than 4 kg which is not related with diet or other factors from"
        text: |
          الـ ACR 1990 مش أرقام عشوائية. التفسير المقبول (مش في الكتاب): الـ PAN بيمسك **الشرايين المتوسطة** اللي بتغذي الأعضاء، فكل criterion هو **عضو جاع**:
          - **Mono- أو polyneuropathy**: شرايين الأعصاب (vasa nervorum) ← foot drop.
          - **Testicular pain**: شريان الخصية.
          - **Myalgia**: شرايين العضلات.
          - **Livedo reticularis**: الشرايين تحت الجلد ضيقة، فالجلد يبان شبكة.
          - **Diastolic >90** و **urea/creatinine** عالي: شرايين الكلية ضيقة ← renin يعلى، و infarcts.
          - **Abnormal coeliac أو renal angiography**: الـ ==aneurysms== والـ occlusions نفسها.
          - **HBsAg**: الـ hepatitis B بيعمل **immune complexes** تترسب في الجدار (ص 124: PAN immune complex mediated).
          - **Weight loss** و fever: الالتهاب المزمن والأمعاء اللي بتجوع.
      - kind: explain
        page: 141
        title: "الصيغة التانية: شرط إجباري + 2 من 7"
        quote: "magnetic resonance angiography is negative), plus at least two of the"
        text: |
          في نفس الصفحة الكتاب بيدي صيغة تانية للـ PAN: **systemic illness** + شرط ==mandatory==: إما **biopsy** فيها necrotizing vasculitis في الشرايين الصغيرة والمتوسطة، أو **angiography** فيها aneurysms أو occlusions (ولو الـ magnetic resonance angiography سليمة، تتعمل **conventional angiography**). وبعدها **2 على الأقل من 7**: الجلد (livedo، nodules)، myalgia، hypertension، neuropathy، الكلية (GFR أقل من 50%)، الخصية، أو أي عضو كبير تاني.

          التفسير المقبول (مش في الكتاب):
          - **ليه فيه شرط إجباري هنا؟** لأن الأعراض لوحدها (وجع عضلات وضغط وأعصاب) بتحصل في أمراض كتير، فلازم **دليل إن الشريان نفسه ملتهب** قبل ما تقول PAN.
          - **ليه conventional angiography لو الـ MRA سليمة؟** لأن الـ microaneurysms اللي شفتها في صورة ص 143 ==صغيرة جدًا==، والـ MRA ممكن ما تشوفهاش؛ يعني MRA سليمة ما بتنفيش.
          - الضغط بيتقاس **relative to childhood normative data**، يعني الصيغة دي معمولة للأطفال، وده سبب إنها مش هي نفسها الـ ACR 1990.
      - kind: reveal
        page: 141
        quote: "A systemic illness accompanied by either a biopsy showing small and mid-"
        prompt: "ليه الـ classical PAN ما بيعملش glomerulonephritis، مع إنه بيبوّظ الكلية؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ **glomerulus** شبكة **capillaries**، يعني **small vessels**. والـ PAN بيمسك **medium arteries** (الكتاب: small and mid-size artery necrotizing vasculitis، والـ Chapel Hill حاطه medium).

          فالـ PAN بيضرب **الشرايين اللي قبل** الـ glomerulus: الكلية بتعمل **infarcts** و **hypertension** (renin) و creatinine عالي، بس الـ urine ==من غير RBC casts==. لو لقيت casts و GN، فكّر في **small vessel** زي MPA. وده الفخ اللي الكتاب كتبه في جدول الأعضاء: GN absent in classical PAN.
      - kind: figure
        page: 143
        title: "الـ PAN: العصب والشريان"
        image: { file: rheum/L08-pan-wrist-histology.webp, book: true }
        marks:
          - { at: [0.48, 0.20], label: "Wrist drop" }
          - { at: [0.34, 0.65], label: "Inflamed segment", kind: box, size: [0.26, 0.14] }
        alt: "Top: a forearm resting flat with the hand hanging limply down at the wrist. Bottom: two microscope sections of the same medium-sized artery; on the left, in red stain, one side of the wall is thickened and inflamed; on the right, in another stain, the outline of the wall."
        caption: |
          صفحة 143، أول صورتين:

          - **(1)** ==wrist drop==: الإيد مدلدلة من الرسغ. ده **mononeuritis**: الشريان اللي بيغذي الـ radial nerve اتسد، فالعصب مات (criterion رقم 5).
          - **تحت**: شريان متوسط تحت الميكروسكوب. الجدار من **ناحية واحدة** (2) تخين وملتهب، والباقي سليم.

          يعني الالتهاب **focal and segmental**، وهو ده اللي بيعمل الـ aneurysms اللي في الصورة الجاية.
      - kind: figure
        page: 143
        title: "الـ PAN في صور الكتاب (ص 143)"
        image: { file: rheum/L08-pan-angiogram.webp, book: true }
        alt: "Book figure: a mesenteric angiogram with many small round outpouchings along the medium-sized arteries (microaneurysms) and areas of narrowing."
        caption: |
          الكتاب في ص 143 بيوري صور الـ PAN: **wrist drop** (mononeuritis)، شريان متوسط ملتهب تحت الميكروسكوب، و الـ ==mesenteric angiogram== اللي هنا.

          البلالين الصغيرة على طول الشرايين دي الـ **microaneurysms**: الجدار ملتهب ومتنكرز في حتت (focal and segmental)، فالحتة الضعيفة **بتنفخ** من الضغط، والحتة اللي بتلتئم **بتضيق**. عشان كده الـ angiography بتوري aneurysms و occlusions مع بعض.
      - kind: explain
        page: 142
        title: "الـ cutaneous PAN"
        quote: "Fibrinoid necrotizing vasculitis of small and medium"
        text: |
          جدول ص 142 بيفرّق الـ **cutaneous PAN** (اللي في قايمة الـ medium vessel ص 137) عن الـ systemic:
          - **Compatible clinical findings**: **subcutaneous nodules**، livedo، purpura أو ulcers.
          - **Histopathology**: ==fibrinoid necrotizing vasculitis== في شرايين small و medium caliber.
          - علامات الـ **systemic** اللي **ما ينفعش** تبقى موجودة: fever ≥38°C لأسبوعين، weight loss ≥6 kg، hypertension، renal failure، strokes، MI، pleuritis، intestinal bleeding.
          - **Exclusion**: neuropathy أو arthritis أو myalgia **بره منطقة الجلد** المصابة.

          يعني نفس الـ pathology، بس محصورة في الجلد. التفسير المقبول (مش في الكتاب): الفرق ده بيغيّر كل حاجة: الـ cutaneous محتاج علاج أخف بكتير، والـ systemic ممكن يموّت.
      - kind: figure
        page: 142
        title: "جلد الـ PAN"
        image: { file: rheum/L08-cpan-skin.webp, book: true }
        marks:
          - { at: [0.25, 0.25], label: "Livedo" }
          - { at: [0.75, 0.25], label: "Livedo" }
          - { at: [0.27, 0.78], label: "Purpura" }
        alt: "Three photographs. Top left: the back of a hand with a red, lace-like net pattern. Top right: a thigh with the same net pattern. Bottom: both feet with many dark red spots."
        caption: |
          تحت جدول الـ cutaneous PAN:

          - **إيد وفخد** (1، 2): شبكة حمرا زي الدانتيلا: ==livedo reticularis==. الشرايين الصغيرة المتوسطة ضاقت، فالجلد اللي بينها ما بياخدش دم كفاية.
          - **الرجلين** (3): بقع حمرا غامقة: **purpura**.

          الاتنين من الـ **compatible clinical findings** في الجدول، ومعاهم الـ **subcutaneous nodules**.
      - kind: figure
        page: 144
        quote: "Key recommendations for the treatment of polyarteritis nodosa (PAN)"
        title: "شكل 1 في الكتاب: علاج PAN"
        image: { file: rheum/L08-pan-algorithm.webp, book: true }
        alt: "Figure 1, key recommendations for the treatment of polyarteritis nodosa. Active PAN splits into non-severe and severe disease. Non-severe: a non-glucocorticoid immunosuppressive agent such as methotrexate or azathioprine with glucocorticoids over glucocorticoids alone. Severe: high-dose oral or pulse IV glucocorticoids with cyclophosphamide over glucocorticoids alone. Each side then asks about clinical remission: if yes, remission maintenance with a non-glucocorticoid agent (non-cyclophosphamide on the severe side) for 18 months and a glucocorticoid taper; if no, consider other non-glucocorticoid agents, or cyclophosphamide when the disease turns severe."
        caption: |
          Figure 1 في صفحة 144، من فوق لتحت:

          - **فوق**: Active PAN بيتقسم ==non-severe== (شمال) و **severe** (يمين).
          - **شمال**: glucocorticoid (GC) + MTX أو AZA. **يمين**: GC جرعة عالية أو pulse + **cyclophosphamide (CYC)**.
          - **المعين (clinical remission)**: لو **أيوه** ← maintenance بـ non-GC agent لمدة ==18 شهر== و GC taper. لو **لأ** ← دوا تاني، أو CYC لو المرض بقى severe.

          يعني الـ CYC للعضو اللي في خطر بس، ومدة الـ maintenance واحدة في الناحيتين.
      - kind: explain
        page: 144
        title: "Severe ولا non-severe: إزاي تقرر؟"
        quote: "Severe disease Vasculitis with life- or organ-threatening manifestations"
        text: |
          جدول التعريفات في ص 144:
          - **Severe disease** = ==life- or organ-threatening==: **renal disease**، **mononeuritis multiplex**، muscle disease، **mesenteric ischaemia**، **coronary**، limb/digit ischaemia.
          - **Nonsevere** = mild systemic symptoms، cutaneous بسيط، arthritis خفيف.
          - **Remission**: مفيش علامات، بعلاج أو من غيره. **Refractory**: نشاط مستمر رغم العلاج. **Relapse**: رجوع بعد remission.

          والجرعات: **IV pulse** methylprednisolone 500–1,000 mg/day لـ 3–5 أيام، **high-dose oral** prednisone 1 mg/kg/day (لحد 80 mg)، **moderate** 0.25–0.5 mg/kg، **low** <10 mg/day.

          ليه التقسيمة؟ التفسير المقبول (مش في الكتاب): الـ cyclophosphamide سلاح قوي وليه أضرار، فبتدّيه بس للي عضو عنده في خطر، والباقي بياخد حاجة أخف.
      - kind: case
        page: 144
        quote: "High-dose oral or pulse IV GC with CYC over GC alone"
        stem: "A 50-year-old man: fever, 7 kg weight loss, testicular pain, new foot drop, BP 170/100. Angiography shows renal and mesenteric microaneurysms. Urine has no RBC casts."
        steps:
          - question: "Most likely diagnosis?"
            options: ["Polyarteritis nodosa", "Microscopic polyangiitis", "Takayasu arteritis", "HSP"]
            answer: 0
            why: "Testicular pain، foot drop، weight loss، hypertension و microaneurysms من غير GN = classical PAN. الـ MPA بيعمل GN. الـ Takayasu في الـ aorta. الـ HSP purpura في طفل."
          - question: "Severity and induction?"
            options: ["Severe: high-dose or pulse GC + cyclophosphamide", "Non-severe: GC + methotrexate", "GC alone", "Rituximab"]
            answer: 0
            why: "الـ mononeuritis (foot drop) والـ mesenteric involvement = severe، فـ GC + CYC. الـ MTX للـ non-severe. الـ GC لوحده أقل. الـ rituximab مش في خطة الـ PAN."
      - kind: check
        page: 141
        quote: "Presence of Hepatitis B surface antigen or antibody."
        question: "Which laboratory finding is one of the ACR 1990 criteria for polyarteritis nodosa?"
        options: ["Hepatitis B surface antigen or antibody", "Positive c-ANCA", "Low serum IgE", "Red cell casts in the urine"]
        answer: 0
        why:
          - "صح: الـ HBV بيعمل immune complexes بتضرب الشرايين المتوسطة، فهو criterion رقم 8."
          - "الـ c-ANCA بتاع الـ GPA؛ الـ PAN مش ANCA-associated."
          - "مفيش criterion عن IgE؛ الـ IgE العالي بتاع الـ Churg–Strauss."
          - "الـ RBC casts معناها GN، والـ classical PAN من غير GN."
      - kind: try
        items: [rheum.L08.103, rheum.L08.106, rheum.L08.110, rheum.L08.114, rheum.L08.118]
    recap:
      - "ACR 1990: weight loss >4 kg، livedo، testicular pain، myalgia، neuropathy، diastolic >90، urea/creatinine، HBV، abnormal angiography، PMNs في الـ biopsy."
      - "المعيار التاني: biopsy أو angiography mandatory + ≥2 من 7؛ conventional angiography لو MRA سلبي."
      - "Medium arteries ← aneurysms و infarcts و hypertension، من غير GN."
      - "Cutaneous PAN: nodules و livedo، fibrinoid necrosis، من غير systemic."
      - "Severe (كلية، mononeuritis، mesenteric، coronary، limb) ← GC + CYC؛ nonsevere ← GC + MTX/AZA."
    practice: [rheum.L08.103, rheum.L08.104, rheum.L08.105, rheum.L08.106, rheum.L08.107, rheum.L08.108, rheum.L08.109, rheum.L08.110, rheum.L08.111, rheum.L08.112, rheum.L08.113, rheum.L08.114, rheum.L08.115, rheum.L08.116, rheum.L08.117, rheum.L08.118]
