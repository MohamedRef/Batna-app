  - id: res.L12.lesson4
    title: "الـ bias ونوعه الأول: selection bias"
    hook: "عايز تعرف التدخين بيعمل stroke؟ لو جبت الـ controls من نفس المستشفى، هتلاقي التدخين «مالوش ذنب». ليه؟"
    minutes: 10
    pages: [25, 38]
    topics: [selection]
    goals:
      - "تعرّف الـ bias وتفرّقه عن الـ random error"
      - "تعدّ أنواع الـ selection bias"
      - "تشرح فخ الـ hospital controls"
    status: unverified
    steps:
      - kind: explain
        page: 25
        quote: "II. Bias\n\"Systematic error\" or \"Bias\" leads to Loss of Internal Validity.\nAny trend in the Collection, Analysis, Interpretation, Publication Or Review Of Data that can lead to conclusions that are systematically different from the truth (Last, 2001)\nA process at any state of inference tending to produce results that depart systematically from the true values (Fletcher et al, 1988)"
        title: "الـ bias = غلط ثابت في اتجاه واحد"
        text: "==Bias== (systematic error) بيضيّع الـ **internal validity**.\n\nتعريف **Last (2001)**: أي اتجاه في الـ **collection، analysis، interpretation، publication أو review** للداتا يوصّلك لنتيجة **مختلفة بشكل منتظم عن الحقيقة**.\n\nوتعريف **Fletcher (1988)**: عملية في أي مرحلة من الاستنتاج بتطلّع نتايج بعيدة **systematically** عن القيم الحقيقية."
        remind: [res.L12.041]
      - kind: figure
        page: 26
        quote: "Bias or Systematic Error\nSystematic, non-random, deviation of results from the truth\nhigh systematic error\nlow systematic error"
        title: "Target: systematic vs random"
        alt: "Two targets side by side. Left target: eight dots tightly clustered at the lower right edge, far from the bull's-eye, labelled high systematic error. Right target: dots scattered all around the centre, labelled low systematic error."
        caption: "الشمال: كل الرميات **مع بعض** بس **بعيد** عن النص = **high systematic error** (bias). اليمين: متفرقة حوالين النص = low systematic error."
        svg: "<svg viewBox=\"0 0 330 170\" xmlns=\"http://www.w3.org/2000/svg\">\n  <circle cx=\"82\" cy=\"78\" r=\"64\" class=\"fg-box\"/><circle cx=\"82\" cy=\"78\" r=\"42\" class=\"fg-thin\"/><circle cx=\"82\" cy=\"78\" r=\"14\" class=\"fg-acc\"/>\n  <circle cx=\"248\" cy=\"78\" r=\"64\" class=\"fg-box\"/><circle cx=\"248\" cy=\"78\" r=\"42\" class=\"fg-thin\"/><circle cx=\"248\" cy=\"78\" r=\"14\" class=\"fg-acc\"/>\n  <g class=\"fg-dot-bad\"><circle cx=\"118\" cy=\"118\" r=\"4\"/><circle cx=\"126\" cy=\"114\" r=\"4\"/><circle cx=\"122\" cy=\"124\" r=\"4\"/><circle cx=\"130\" cy=\"121\" r=\"4\"/><circle cx=\"114\" cy=\"126\" r=\"4\"/><circle cx=\"133\" cy=\"112\" r=\"4\"/></g>\n  <g class=\"fg-dot-good\"><circle cx=\"232\" cy=\"50\" r=\"4\"/><circle cx=\"270\" cy=\"62\" r=\"4\"/><circle cx=\"252\" cy=\"80\" r=\"4\"/><circle cx=\"222\" cy=\"98\" r=\"4\"/><circle cx=\"278\" cy=\"104\" r=\"4\"/><circle cx=\"244\" cy=\"118\" r=\"4\"/></g>\n  <text x=\"82\" y=\"162\" text-anchor=\"middle\" class=\"t-sm t-bad\">high systematic error</text>\n  <text x=\"248\" y=\"162\" text-anchor=\"middle\" class=\"t-sm t-good\">low systematic error</text>\n</svg>"
      - kind: explain
        page: 28
        quote: "Selection Bias\nParticipant selection procedure, e.g., exposure affects case ascertainment (\"detection bias\") or control selection\nDifferential unavailability due to death (\"selective survival\"), illness, migration, or refusal (nonresponse bias)"
        title: "نوعين: selection وinformation"
        text: "الـ bias نوعين: ==selection bias== (مين دخل الدراسة) و**information bias** (قسنا إزاي).\n\nالـ **selection bias** مصدره:\n- **طريقة اختيار المشاركين**: مثلًا الـ exposure بيأثر على اكتشاف الـ cases (**detection bias**) أو على اختيار الـ controls.\n- **Differential unavailability**: ناس مش موجودة بسبب **death** (selective survival)، **illness**، **migration**، أو **refusal** (non-response bias)."
        remind: [res.L12.043]
      - kind: figure
        page: 30
        quote: "Selection Bias\nWith disease\nWithout disease\nExposed\nNot exposed\nPopulation base\nStudy population\nDistorted picture of the population base"
        title: "الـ population base والـ study population"
        alt: "Two square grids, each split by a cross into four cells: exposed or not exposed, with or without disease. Left: a light inner square takes an equal share of all four cells, labelled equal proportions, unbiased. Right: the inner shape takes a big share of exposed without disease and small shares of the others, labelled distorted picture, selection bias."
        caption: "الـ **study population** لازم تاخد **نسب متساوية** من كل خانة في الـ **population base**. لو أخدت من خانة أكتر، الصورة **distorted** وده **selection bias**."
        svg: "<svg viewBox=\"0 0 330 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"10\" y=\"20\" width=\"140\" height=\"130\" class=\"fg-ink\"/>\n  <rect x=\"35\" y=\"45\" width=\"90\" height=\"80\" class=\"fg-good\"/>\n  <path d=\"M80 12V158M2 85H158\" class=\"fg-arrow\"/>\n  <rect x=\"180\" y=\"20\" width=\"140\" height=\"130\" class=\"fg-ink\"/>\n  <rect x=\"252\" y=\"28\" width=\"62\" height=\"54\" class=\"fg-bad\"/>\n  <rect x=\"236\" y=\"62\" width=\"14\" height=\"22\" class=\"fg-bad\"/>\n  <rect x=\"216\" y=\"88\" width=\"32\" height=\"40\" class=\"fg-bad\"/>\n  <rect x=\"252\" y=\"88\" width=\"20\" height=\"24\" class=\"fg-bad\"/>\n  <path d=\"M250 12V158M172 85H328\" class=\"fg-arrow\"/>\n  <text x=\"45\" y=\"14\" text-anchor=\"middle\" class=\"t-sm\">diseased</text>\n  <text x=\"118\" y=\"14\" text-anchor=\"middle\" class=\"t-sm\">not diseased</text>\n  <text x=\"80\" y=\"172\" text-anchor=\"middle\" class=\"t-sm t-good\">equal shares: unbiased</text>\n  <text x=\"250\" y=\"172\" text-anchor=\"middle\" class=\"t-sm t-bad\">distorted: selection bias</text>\n  <text x=\"165\" y=\"192\" text-anchor=\"middle\" class=\"t-sm t-mut\">top row exposed, bottom row not exposed</text>\n</svg>"
      - kind: case
        page: 31
        quote: "Example I: Selection Bias in Case Control Studies\nImagine a cumulative case-control study conducted in one large hospital. The study aims to explore whether smoking increases the risk of experiencing a stroke. Cases are patients admitted for stroke, controls are patients admitted for everything else. In order to have an unbiased result, the controls need to be representative of the non-cases in the source population, particularly in regards to the exposure of interest (smoking). However, because smokers are also at higher risk for other diseases that lead to hospitalizations than non-smokers (lung cancer, COPD, etc), smoking is more common among hospitalized non-cases than among non-cases in the source population. This will result in an underestimation of the effect of smoking on stroke risk."
        stem: "Case-control في مستشفى كبيرة: هل التدخين بيزوّد الـ stroke؟ الـ cases = مرضى الـ stroke، والـ controls = أي حد داخل المستشفى لأي سبب تاني."
        steps:
          - question: "Who should the controls represent?"
            options:
              - "Non-cases of the source population, especially in smoking"
              - "Other hospital patients"
              - "Stroke patients"
              - "Smokers only"
            answer: 0
            why: "الـ controls لازم يمثلوا الـ non-cases في المجتمع في الـ exposure."
          - question: "What goes wrong with hospital controls here?"
            options:
              - "Smokers are admitted more for other diseases (lung cancer, COPD), so smoking is commoner among them"
              - "Hospital controls smoke less"
              - "Stroke patients forget their smoking"
              - "The hospital is too big"
            answer: 0
            why: "التدخين بيدخّل المستشفى بأمراض تانية كتير."
          - question: "So the effect of smoking on stroke will be:"
            options: ["Underestimated", "Overestimated", "Unchanged", "Reversed always"]
            answer: 0
            why: "التدخين عالي في الـ controls، فالفرق بينهم وبين الـ cases بيصغر."
      - kind: explain
        page: 32
        quote: "1. Survival bias\nDealing with survivor in cross sectional study and case control study is associated with survival bias.\nThe picture of the disease among those who lived are certainly differ from those who died"
        title: "أنواع الـ selection bias (1): survival وdiagnosis"
        text: "**1. Survival bias**: في الـ **cross sectional** والـ **case control** بتدرس اللي **عاشوا**. وصورة المرض عند اللي عاشوا أكيد غير اللي ماتوا.\n\n**2. Differential diagnosis bias**:\n- ناس كتير بتفضل **من غير تشخيص سنين**.\n- الـ **high risk** واللي **بيروحوا للدكتور كتير** مرضهم بيتكشف أكتر.\n- الفروق **clinical، geographical أو economic** بتحدد مين يوصل للفحص."
        remind: [res.L12.050]
      - kind: explain
        page: 34
        quote: "3.Non response and volunteer bias :\n1. Those who volunteer to participate in the study might be at low risk or non-exposed to risk factors\n2. On the other hand, those who refuse to participate might be at high risk for developing a disease\nE.g. survey for studying STDs , those who practice unsafe sex will not respond."
        title: "(2): non-response وNeyman"
        text: "**3. Non response and volunteer bias**: اللي **بيتطوّع** غالبًا **low risk** أو مش exposed، واللي **بيرفض** ممكن يكون **high risk**. مثال: survey عن الـ **STDs**: اللي عنده unsafe sex مش هيرد.\n\n**4. ==Incidence prevalence bias (Neyman)==**: لو أخدت بس الـ cases اللي عيانة **من زمان**، هتفوّت:\n- الـ **fatal cases** (ماتوا)\n- الـ **short episodes** (خفّوا بسرعة)\n- الـ **mild or silent cases**\n- الـ cases اللي **دليل الـ risk factor اختفى** مع بداية المرض"
        remind: [res.L12.051, res.L12.053]
      - kind: explain
        page: 36
        quote: "Hospital controls\nA control group drawn from among hospitalized patients will be easier and less expensive to recruit, have a higher response rate, and provide better information about medical exposures.\nBut if the conditions that bring people to the hospital are related to the exposure under study, then the control group and the overall study will be biased."
        title: "Hospital controls: سهلين بس خطرين"
        text: "**المميزات**: أسهل وأرخص، **response rate** أعلى، ومعلومات أحسن عن الـ medical exposures.\n\n**الخطر**: لو الأمراض اللي بتجيب الناس المستشفى **مربوطة بالـ exposure**، الـ control group والدراسة كلها **biased** (زي مثال التدخين).\n\nوكمان: المرض الخطير **كل حالاته** بتدخل، والبسيط بيدخل منه **المضاعفات بس**. واللي في **المستشفيات الخاصة** غير اللي في **الحكومي**."
      - kind: explain
        page: 38
        quote: "Attrition Bias\nIn prospective cohort, long period of follow up might lead to loss of follow up to many participants .\nBias occur when those lost to follow up differ systematically from those remain in the study"
        title: "Attrition bias"
        text: "في الـ **prospective cohort**، الـ follow-up الطويل بيضيّع مشاركين كتير.\n\nالـ ==attrition bias== بيحصل لما اللي ضاعوا **يختلفوا بشكل منتظم** عن اللي فضلوا. يعني المشكلة مش في الضياع نفسه، في **مين** اللي ضاع."
      - kind: check
        page: 34
        quote: "3.Non response and volunteer bias :\n1. Those who volunteer to participate in the study might be at low risk or non-exposed to risk factors\n2. On the other hand, those who refuse to participate might be at high risk for developing a disease\nE.g. survey for studying STDs , those who practice unsafe sex will not respond."
        question: "A survey on sexually transmitted diseases (STDs): those who practise unsafe sex don't respond. This is:"
        options: ["Non-response bias", "Recall bias", "Neyman bias", "Interviewer bias"]
        answer: 0
        why:
          - "صح: الرافضين هم الـ high risk؛ مثال الشريحة."
          - "الـ recall عن الذاكرة."
          - "الـ Neyman عن الـ prevalent cases القديمة."
          - "ده من طريقة السؤال، مش من مين رد."
      - kind: try
        items: [res.L12.044, res.L12.047, res.L12.051, res.L12.053]
    recap:
      - "Bias = systematic error بيضيّع الـ internal validity."
      - "نوعين: selection وinformation."
      - "Selection: survival، differential diagnosis، non-response/volunteer، Neyman، hospital controls، attrition."
