  - id: hem.L09.lesson3
    title: "علاج الـ ET: السن بيكتب الروشتة"
    hook: "تلات أعمار وتلات خطط: aspirin، أو aspirin مع hydroxyurea، والحمل له قواعده."
    minutes: 10
    pages: [140, 144]
    topics: [et-treatment, et-pregnancy]
    goals:
      - "تقسّم الـ ET لـ low و intermediate و high risk"
      - "تعرف كل دوا وأعراضه الجانبية"
      - "تدير ET في الحمل والرضاعة"
    status: unverified
    steps:
      - kind: explain
        page: 140
        title: "التقسيم: سن + خطر الأوعية"
        quote: "Based on their age and risk of vascular complications, patients may be stratified into:"
        text: |
          الـ ET بيتقسم حسب ==age and risk of vascular complications==:
          - **High risk**: فوق **60**، أو أي **high-risk feature**: platelets **≥1500 × 10⁹/L**، أو **prior thrombosis**، أو **significant thrombotic risk factors** زي DM أو hypertension
          - **Intermediate**: **40–60** من غير high-risk features
          - **Low**: تحت **40** من غير high-risk features
      - kind: figure
        page: 140
        quote: "High-risk patients are those; Over 60 years old With one or more high-risk features:"
        title: "السلّم: سنك فين؟"
        alt: "A horizontal age scale from 0 to 80 split at 40 and 60 into low, intermediate and high risk, with the treatment under each band. A red override banner says any high-risk feature (platelets 1500 or more, prior thrombosis, diabetes or hypertension) jumps straight to high risk."
        caption: "أي ==high-risk feature== بينطّك على طول للـ **high risk**، حتى لو عندك 30 سنة."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="40" width="120" height="40" class="fg-good"/>
            <rect x="130" y="40" width="90" height="40" class="fg-acc"/>
            <rect x="220" y="40" width="100" height="40" class="fg-bad"/>
            <text x="70" y="65" text-anchor="middle" class="t-sm t-b">Low</text>
            <text x="175" y="65" text-anchor="middle" class="t-sm t-b">Intermediate</text>
            <text x="270" y="65" text-anchor="middle" class="t-sm t-b">High</text>
            <text x="10" y="30" class="t-sm t-mut">age</text>
            <text x="130" y="30" text-anchor="middle" class="t-sm">40</text>
            <text x="220" y="30" text-anchor="middle" class="t-sm">60</text>
            <text x="70" y="102" text-anchor="middle" class="t-sm">low-dose</text>
            <text x="70" y="117" text-anchor="middle" class="t-sm">aspirin</text>
            <text x="175" y="102" text-anchor="middle" class="t-sm">aspirin ±</text>
            <text x="175" y="117" text-anchor="middle" class="t-sm">hydroxyurea</text>
            <text x="270" y="102" text-anchor="middle" class="t-sm">hydroxyurea</text>
            <text x="270" y="117" text-anchor="middle" class="t-sm">+ aspirin</text>
            <rect x="10" y="140" width="310" height="80" rx="10" class="fg-bad"/>
            <text x="165" y="162" text-anchor="middle" class="t-sm t-b">Any high-risk feature = HIGH</text>
            <text x="165" y="182" text-anchor="middle" class="t-sm">Platelets ≥1500 × 10⁹/L</text>
            <text x="165" y="198" text-anchor="middle" class="t-sm">Prior thrombosis</text>
            <text x="165" y="214" text-anchor="middle" class="t-sm">Diabetes or hypertension</text>
          </svg>
      - kind: update
        page: 140
        quote: "Based on their age and risk of vascular complications, patients may be stratified into:"
        text: "الـ European LeukemiaNet بيستخدم **revised IPSET-thrombosis** (age >60، prior thrombosis، JAK2 V617F) وبيقسم لـ very low و low و intermediate و high. في الامتحان اكتب تقسيم الكتاب التلاتي."
        ref: "European LeukemiaNet MPN recommendations 2018 (revised IPSET-thrombosis)"
      - kind: check
        page: 142
        quote: "hydroxyurea plus aspirin should remain first-line therapy for high-risk patients."
        question: "67-year-old, JAK2+ ET, platelets 720, no thrombosis, no DM or HTN. Best treatment?"
        options: ["Hydroxycarbamide + aspirin", "Aspirin alone", "Observation", "Anagrelide first line"]
        answer: 0
        why:
          - "صح: فوق 60 لوحدها = high risk، و hydroxyurea + aspirin هو الـ first line."
          - "الـ aspirin لوحده للـ low risk (تحت 40)."
          - "الـ high risk بيتعالج؛ الـ hydroxyurea بيقلل التجلط."
          - "الـ anagrelide second line."
      - kind: explain
        page: 140
        title: "Hydroxycarbamide (hydroxyurea)"
        quote: "The commonest complications are leukopenia or thrombocytopenia, which are dose dependent"
        text: |
          - **Oral** و **well tolerated**، بينزّل الـ **Hct والـ WBC والـ platelets**.
          - أشهر مضاعفة: ==leukopenia or thrombocytopenia== (dose dependent)، فتابع الـ CBC كويس في الأول.
          - كمان: **photosensitivity**، **painful leg ulcers**، GI upset، **sun-induced squamous skin lesions** (cancerous و precancerous)، و pigmentation. يعني نصّحه يبعد عن الشمس.
          - الجرعة **0.5–2 g/day**.

          وخطر الـ leukemia؟ مفيش data مقنعة إنه لوحده بيزوّده، بس **small effect cannot be excluded**.
      - kind: explain
        page: 141
        title: "Anagrelide و IFN و busulfan"
        quote: "Its side-effects are mainly secondary to its inotropic and vasodilatory properties (e.g. headaches, palpitations and fluid retention)"
        text: |
          - ==Anagrelide==: بينزّل الصفائح، وممكن مع الـ hydroxycarbamide علشان **جرعات أقل من الاتنين**. الجرعة **1–2 mg/day** (لحد 8). أعراضه من الـ **inotropic and vasodilatory** effect: صداع، palpitations، fluid retention، وممكن أنيميا. **Approved for ET only, second line**.
          - **IFN-α**: كويس للصفائح بس side effects و SC و غالي. دوره أوضح في **الحمل** وبعضهم بيفضّله في الصغيرين. **3–5 mU** تلات مرات في الأسبوع.
          - **Busulfan**: نادر بسبب **leukemogenic potential**.
      - kind: match
        page: 142
        quote: "Side-effects include fatigue, flu-like symptoms, depression, autoimmune phenomena."
        prompt: "وصّل كل دوا بعلامته المميزة:"
        pairs:
          - ["Hydroxycarbamide", "Leg ulcers and sun-induced skin lesions"]
          - ["Anagrelide", "Palpitations, headache, fluid retention"]
          - ["Interferon-alpha", "Flu-like symptoms, depression, autoimmunity"]
          - ["Busulfan", "Long-term leukemogenic potential"]
        why: "كل دوا بتعرفه من أعراضه: الـ hydroxyurea جلد ورجل، الـ anagrelide قلب وأوعية، الـ IFN زي الإنفلونزا والمزاج، والـ busulfan خطر الـ leukemia."
      - kind: aside
        tone: joke
        page: 141
        quote: "Its side-effects are mainly secondary to its inotropic and vasodilatory properties (e.g. headaches, palpitations and fluid retention)"
        text: "الـ anagrelide عامل زي تالت فنجان قهوة الساعة 2 بالليل في النبطشية: قلبك بيدق (palpitations)، دماغك بتوجعك، وفي الآخر رجلك ورمت."
      - kind: explain
        page: 142
        title: "الـ low و الـ intermediate"
        quote: "They are usually given low dose aspirin alone, unless there is a contraindication"
        text: |
          - **Low risk** (تحت 40): ==low-dose aspirin alone==، إلا لو فيه **peptic ulcer** قديم، أو **salicylate allergy**، أو **platelets >1000** (افتكر الـ acquired vWD). البديل: **dipyridamole أو clopidogrel**.
          - لو فيه **ET-associated hemorrhage**: الأحسن نبعد عن الـ antiplatelets.
          - **Intermediate** (40–60): مش واضح إن تنزيل الصفائح مفيد، فأغلبهم **aspirin لوحده** أو **hydroxycarbamide + aspirin**.
      - kind: check
        page: 142
        quote: "or allergy to salicylates or with PLT count > 1000× 10⁹/L."
        question: "31-year-old, CALR+ ET, no risk features. Which finding stops you giving aspirin?"
        options: ["Platelets 1,250 × 10⁹/L", "Platelets 620 × 10⁹/L", "CALR rather than JAK2", "Mild splenomegaly"]
        answer: 0
        why:
          - "صح: فوق 1000 الـ aspirin ممنوع (خطر نزيف من acquired vWD)."
          - "ده العادي للـ aspirin في الـ low risk."
          - "نوع الطفرة مش contraindication."
          - "الطحال الصغير شائع في الـ ET ومش بيمنع الـ aspirin."
      - kind: explain
        page: 143
        title: "ET والحمل"
        quote: "the commonest complication of ET is first-trimester miscarriage, which occurs in up to 30% of pregnancies"
        text: |
          الـ ET هي أكتر MPN في **women of childbearing age**.
          - أشهر مضاعفة: ==first-trimester miscarriage== (لحد **30%**) من **placental microinfarcts and insufficiency**.
          - أقل: IUFD، growth retardation، premature delivery، pre-eclampsia.
          - الـ live birth حوالي **60%**، ومفيش maternal deaths في review لـ **220** حمل.
          - **Aspirin**: الأغلب ياخدوه لو حامل أو بتخطط (أمانه معروف من دراسة pre-eclampsia كبيرة).
      - kind: reveal
        page: 144
        quote: "Hydroxyurea and anagrelide should not be used on account of their teratogenic potential."
        prompt: "مريضة ET حامل محتاجة cytoreduction. ليه مش hydroxyurea؟ وتقدر ترضع على إيه؟"
        answer: |
          الـ **hydroxyurea والـ anagrelide** الاتنين **teratogenic**، وبيطلعوا في اللبن، فالرضاعة ممنوعة عليهم.

          الحل **IFN-α**: بيطلع في اللبن بس **unlikely to be absorbed intact by the baby**، وفيه تقارير رضاعة ناجحة عليه.
      - kind: try
        items: [hem.L09.049, hem.L09.055, hem.L09.060, hem.L09.080, hem.L09.084]
    recap:
      - "High: >60 أو platelets ≥1500 أو prior thrombosis أو DM/HTN → hydroxyurea + aspirin."
      - "Intermediate 40–60: aspirin ± hydroxycarbamide. Low <40: low-dose aspirin (مش لو >1000)."
      - "Hydroxyurea: cytopenias، leg ulcers، skin lesions. Anagrelide: palpitations، صداع، fluid retention (second line)."
      - "IFN-α للحمل والصغيرين. Busulfan نادر (leukemogenic)."
      - "الحمل: first-trimester miscarriage لحد 30%، live birth 60%، aspirin، ومفيش hydroxyurea ولا anagrelide."
