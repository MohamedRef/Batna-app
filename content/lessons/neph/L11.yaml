        title: "قبل وأثناء الحمل"
        quote: "Prenatal Care Preconception counseling on the higher risk of adverse maternal and fetal outcomes with pregnancy among women receiving maintenance dialysis is imperative. In women with autoimmune diseases, such as lupus nephritis, it is recommended to postpone conception until the disease is inactive for at least 6 months before conception to reduce the risks of adverse maternal and fetal outcomes.(51) Low-dose aspirin should be started by the end of the first trimester for all pregnant women receiving maintenance dialysis to reduce the risk of preeclampsia.(52) The recommended blood pressure (BP) goal during pregnancy is<140/90mm Hg.(53) Folic acid is removed with hemodialysis, and the dose should be increased to 5mg following conception.(54)"
