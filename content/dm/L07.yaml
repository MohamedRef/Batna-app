items:
  # ---------- p76: definition, criteria ----------
  - id: dm.L07.001
    kind: card
    topic: definition
    front: Define cardiovascular autonomic neuropathy (CAN).
    back: A common form of autonomic neuropathy causing abnormalities in heart rate control and in central and peripheral vascular dynamics.
    src: { page: 76, quote: "Cardiovascular autonomic neuropathy is a common form of autonomic neuropathy, causing abnormalities in heart rate control and central and peripheral vascular dynamics." }
    status: unverified
    tags: [high-yield]
  - id: dm.L07.002
    kind: cloze
    topic: definition
    text: "To diagnose CAN, at least {{c1::two}} of the four autonomic tests should be abnormal."
    src: { page: 76, quote: "To diagnose CAN, at least two of the four autonomic tests should be abnormal:" }
    status: unverified
    tags: [high-yield]
  - id: dm.L07.003
    kind: enumerate
    topic: definition
    prompt: Which autonomic tests are listed for the diagnosis of CAN?
    points: ["HRV: deep breathing", "HRV: lying to standing", "HRV: Valsalva maneuver", Orthostatic hypotension (drop in postural SBP)]
    pass: 3
    src: { page: 76, quote: "HRV: Deep breathing" }
    status: unverified
  - id: dm.L07.004
    kind: card
    topic: definition
    front: What do two or more positive autonomic tests mean for prognosis?
    back: More severe autonomic dysfunction and more co-morbid complications, contributing to a higher mortality risk.
    src: { page: 76, quote: "patients with two or more positive tests have more severe autonomic dysfunction and a higher frequency of other co-morbid complications" }
    status: unverified
  # ---------- p77: prevalence, risk ----------
  - id: dm.L07.005
    kind: card
    topic: prevalence
    front: Describe transient CAN.
    back: Occurs in newly diagnosed type 1 diabetic patients, with minor symptoms that recover once euglycemia is established.
    src: { page: 77, quote: "minor symptoms that recover with the establishment of euglycemia." }
    status: unverified
  - id: dm.L07.006
    kind: card
    topic: prevalence
    front: What usually accompanies symptomatic autonomic neuropathy?
    back: Somatic neuropathy.
    src: { page: 77, quote: "Symptomatic autonomic neuropathy usually accompanies somatic neuropathy" }
    status: unverified
  - id: dm.L07.007
    kind: cloze
    topic: prevalence
    text: "CAN occurs in about {{c1::17%}} of type 1 and {{c2::22%}} of type 2 diabetic patients."
    src: { page: 77, quote: "Cardiovascular autonomic neuropathy occurs in ~17% of patients with type 1 diabetes and 22% of those with type 2." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L07.008
    kind: cloze
    topic: prevalence
    text: "Borderline autonomic dysfunction is present in an additional {{c1::9%}} of type 1 and {{c2::12%}} of type 2 patients."
    src: { page: 77, quote: "An additional 9% of type 1 patients and 12% of type 2 patients have borderline dysfunction" }
    status: unverified
    tags: [numbers]
  - id: dm.L07.009
    kind: cloze
    topic: risk
    text: "In CAN, the 5-year mortality rate is {{c1::five}} times higher, and mortality is {{c2::27%}} in 10 years."
    src: { page: 77, quote: "The 5-year mortality rate is five times higher" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L07.010
    kind: card
    topic: risk
    front: How does CAN affect myocardial infarction?
    back: More asymptomatic ischemia and MI, and decreased likelihood of survival after MI.
    src: { page: 77, quote: "increased incidence of asymptomatic ischemia, myocardial infarction, and decreased likelihood of survival after myocardial infarction" }
    status: unverified
  - id: dm.L07.011
    kind: enumerate
    topic: risk
    prompt: Causes of the increased mortality risk associated with CAN?
    points: [Silent cardiac ischemia, Arrhythmias, Sudden cardiac death, Increased LV hypertrophy, Altered coronary vasomotor dynamics, Platelet stickiness]
    pass: 5
    src: { page: 77, quote: "Silent Cardiac Ischemia" }
    status: unverified
    tags: [high-yield]
  # ---------- p78: pathogenesis, presentation ----------
  - id: dm.L07.012
    kind: enumerate
    topic: pathogenesis
    prompt: Hypotheses for the pathogenesis of CAN?
    points: [Metabolic insult to nerve fibers, Neurovascular insufficiency, Autoimmune damage, Neurohormonal growth factor deficiency]
    pass: 4
    src: { page: 78, quote: "Metabolic insult to nerve fibers," }
    status: unverified
  - id: dm.L07.013
    kind: enumerate
    topic: clinical
    prompt: Symptomatic manifestations of CAN?
    points: [Tachycardia, Postural hypotension, Low cardiac output symptoms]
    pass: 3
    src: { page: 78, quote: "Low cardiac output symptoms" }
    status: unverified
  - id: dm.L07.014
    kind: card
    topic: clinical
    front: When in the course of diabetes do symptomatic manifestations of CAN appear?
    back: They are rare and relatively late.
    src: { page: 78, quote: "Rare and relatively late in the course of the diabetes." }
    status: unverified
  - id: dm.L07.015
    kind: card
    topic: tests
    front: What are the standard diagnostic tests for CAN?
    back: The noninvasive cardiovascular reflex tests.
    src: { page: 78, quote: "The standard diagnosis tests for CAN are the noninvasive cardiovascular reflexes" }
    status: unverified
    tags: [high-yield]
  - id: dm.L07.016
    kind: enumerate
    topic: clinical
    prompt: Enumerate the clinical manifestations of CAN.
    points:
      - Resting tachycardia
      - Orthostatic hypotension
      - Exercise intolerance / low cardiac output
      - Intra- and postoperative CV instability
      - Orthostatic tachycardia and bradycardia
      - Silent myocardial ischemia or infarction
      - Sudden death
      - Autonomic cardiopathy
    pass: 6
    src: { page: 78, quote: "Intra and postoperative CV instability" }
    status: unverified
    tags: [high-yield]
  # ---------- p79: tachycardia, OH, exercise, periop ----------
  - id: dm.L07.017
    kind: cloze
    topic: clinical
    text: "The characteristic finding in diabetic CAN is a resting heart rate of {{c1::90–100}} bpm that does not respond to breathing, posture or mild exercise."
    src: { page: 79, quote: "A heart rate of 90-100 bpm unresponsive to variation in breathing, posture, or mild exercise is the characteristic finding in diabetic CAN." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L07.018
    kind: card
    topic: clinical
    front: What does complete cardiac autonomic denervation cause?
    back: A fixed heart rate.
    src: { page: 79, quote: "Complete cardiac autonomic denervation results in a fixed heart rate." }
    status: unverified
  - id: dm.L07.019
    kind: card
    topic: clinical
    front: What is the earliest indicator and most frequent finding in cardiovascular autonomic dysfunction?
    back: Reduced heart rate variability.
    src: { page: 79, quote: "Heart rate variability is considered the earliest indicator and most frequent finding in symptomatic cardiovascular autonomic dysfunction." }
    status: unverified
    tags: [high-yield]
  - id: dm.L07.020
    kind: cloze
    topic: clinical
    text: "Orthostatic hypotension in CAN is a fall in systolic BP of more than {{c1::30 mmHg}} on standing."
    src: { page: 79, quote: "A fall in systolic blood pressure of greater than 30 mm Hg upon standing." }
    status: unverified
    tags: [numbers, high-yield]
    update:
      text: "The consensus definition of orthostatic hypotension (AAS/EFAS 2011, used by ADA) is a fall of at least 20 mmHg systolic or 10 mmHg diastolic within 3 minutes of standing. The book's >30 mmHg is the exam answer."
      ref: "Consensus statement on orthostatic hypotension (Freeman et al.) 2011"
  - id: dm.L07.021
    kind: card
    topic: clinical
    front: How do patients with orthostatic hypotension typically present?
    back: Lightheadedness and presyncope; also dizziness, weakness, fatigue, visual blurring and neck pain. Many stay asymptomatic despite big falls.
    src: { page: 79, quote: "Patients with orthostatic hypotension typically present with lightheadedness and presyncopal symptoms." }
    status: unverified
  - id: dm.L07.022
    kind: card
    topic: clinical
    front: Does a large postural BP fall always cause symptoms?
    back: No; many patients remain asymptomatic despite significant falls.
    src: { page: 79, quote: "Many patients, however, remain asymptomatic despite significant falls in blood pressure." }
    status: unverified
  - id: dm.L07.023
    kind: enumerate
    topic: clinical
    prompt: Causes of exercise intolerance in CAN?
    points: [Impaired sympathetic and parasympathetic responses, Reduced ejection fraction, Systolic dysfunction and decreased diastolic filling]
    pass: 3
    src: { page: 79, quote: "Impaired sympathetic and parasympathetic responses." }
    status: unverified
  - id: dm.L07.024
    kind: card
    topic: clinical
    front: How should patients with CAN judge exercise intensity?
    back: By perceived exertion, not by heart rate.
    src: { page: 79, quote: "Patients with CAN need to rely on their perceived exertion, not heart rate." }
    status: unverified
    tags: [high-yield]
  - id: dm.L07.025
    kind: cloze
    topic: clinical
    text: "Perioperative cardiovascular morbidity and mortality are increased {{c1::2- to 3-fold}} in patients with diabetes."
    src: { page: 79, quote: "Perioperative cardiovascular morbidity and mortality are increased 2- to 3- fold in patients with diabetes." }
    status: unverified
    tags: [numbers]
  - id: dm.L07.026
    kind: card
    topic: clinical
    front: How do diabetic patients with CAN behave under general anesthesia?
    back: Greater fall in heart rate and BP at induction, less rise after intubation and extubation, and more need for vasopressor support.
    src: { page: 79, quote: "show a greater decline in heart rate and BP during induction of anesthesia and less increase after tracheal intubation and extubation." }
    status: unverified
  - id: dm.L07.027
    kind: mcq
    topic: clinical
    stem: A 58-year-old man with 20 years of type 2 diabetes is having a hernia repair. At induction his BP falls to 70/40 and HR barely changes; after intubation the BP rises only a little. What is the most likely reason?
    options: [Cardiac autonomic neuropathy, Anaphylaxis to the induction agent, Hypoglycemia, Acute MI with cardiogenic shock, Normal response to anesthesia]
    answer: 0
    why:
      - "Correct: CAN gives a greater fall in HR and BP at induction and less rise after intubation, and needs vasopressors more often (p79–80)."
      - Anaphylaxis brings rash, bronchospasm and tachycardia.
      - Hypoglycemia does not explain the blunted HR response.
      - Nothing suggests MI; the HR is fixed, not shocked tachycardia.
      - Healthy people show a reflex rise in HR and BP after intubation.
    src: { page: 79, quote: "show a greater decline in heart rate and BP during induction of anesthesia and less increase after tracheal intubation and extubation." }
    status: unverified
  # ---------- p80: orthostatic HR syndromes, silent ischemia ----------
  - id: dm.L07.028
    kind: card
    topic: clinical
    front: Which perioperative support is needed more often in diabetic patients with CAN?
    back: Vasopressor support.
    src: { page: 80, quote: "Vasopressor support is needed more often in diabetic individuals with CAN" }
    status: unverified
  - id: dm.L07.029
    kind: enumerate
    topic: clinical
    prompt: Causes of orthostatic symptoms without BP change in CAN?
    points: [Postural tachycardia syndrome (POTS), Inappropriate sinus tachycardia, Neurocardiogenic syncope, Abnormalities in baroreceptor function]
    pass: 3
    src: { page: 80, quote: "Postural tachycardia syndrome (POTS)," }
    status: unverified
  - id: dm.L07.030
    kind: card
    topic: clinical
    front: What is the hallmark of orthostatic tachycardia and bradycardia syndromes?
    back: No fall in BP on standing, but a tachycardia or bradycardia with the change in posture.
    src: { page: 80, quote: "The hallmark of these abnormalities is the absence of a fall in BP with standing, but a tachycardia or bradycardia with the change in posture" }
    status: unverified
    tags: [high-yield]
  - id: dm.L07.031
    kind: card
    topic: clinical
    front: Symptoms of orthostasis in orthostatic tachycardia or bradycardia syndromes?
    back: Feeling faint or dizzy, circumoral paresthesia and headache on standing from supine.
    src: { page: 80, quote: "feeling faint or dizzy, circumoral paresthesia, and headache" }
    status: unverified
  - id: dm.L07.032
    kind: enumerate
    topic: silent
    prompt: Possible mechanisms of painless myocardial ischemia in CAN?
    points: [Altered pain thresholds, Subthreshold ischemia not enough to cause pain, Dysfunction of afferent cardiac autonomic nerve fibers]
    pass: 3
    src: { page: 80, quote: "Dysfunction of the afferent cardiac autonomic nerve fibers" }
    status: unverified
    tags: [high-yield]
  - id: dm.L07.033
    kind: enumerate
    topic: silent
    prompt: Features of myocardial infarction in a patient with CAN?
    points: [Silence (no pain), Cough, Nausea and vomiting, "Dyspnea, tiredness", ECG changes]
    pass: 4
    src: { page: 80, quote: "Features of MI in patients with CAN are:" }
    status: unverified
    tags: [high-yield]
  - id: dm.L07.034
    kind: mcq
    topic: silent
    stem: A 66-year-old woman with long-standing type 2 diabetes and known CAN comes with 6 hours of cough, nausea, vomiting and breathlessness. She denies chest pain. What is the most important first test?
    options: [ECG, Chest X-ray only, Abdominal ultrasound, Sputum culture, Upper endoscopy]
    answer: 0
    why:
      - "Correct: MI in CAN may be silent, presenting with cough, nausea and vomiting, dyspnea, tiredness and ECG changes (p80)."
      - A chest X-ray alone can miss an MI.
      - Abdominal ultrasound chases the nausea and misses the heart.
      - Sputum culture treats cough as infection.
      - Endoscopy is not first for this picture.
    src: { page: 80, quote: "Nausea and vomiting," }
    status: unverified
  - id: dm.L07.035
    kind: mcq
    topic: clinical
    stem: A 45-year-old with type 1 diabetes feels faint and gets circumoral tingling when he stands. Supine BP 120/78, HR 76; standing at 3 minutes BP 118/80, HR 124. Which category fits?
    options:
      - Orthostatic tachycardia syndrome
      - Orthostatic hypotension
      - Fixed heart rate from complete denervation
      - Silent myocardial ischemia
      - Normal postural response
    answer: 0
    why:
      - "Correct: orthostatic symptoms with no fall in BP but a tachycardia on standing (p80)."
      - Orthostatic hypotension needs a systolic fall of >30 mmHg (p79).
      - A fixed heart rate does not change with posture (p79).
      - Silent ischemia is painless ischemia, not postural symptoms.
      - A rise of 48 bpm with symptoms is not normal.
    src: { page: 80, quote: "The hallmark of these abnormalities is the absence of a fall in BP with standing, but a tachycardia or bradycardia with the change in posture" }
    status: unverified
  # ---------- p81: mortality mechanisms, cardiopathy ----------
  - id: dm.L07.036
    kind: enumerate
    topic: silent
    prompt: Possible mechanisms by which CAN increases mortality?
    points:
      - Prolonged QT and malignant ventricular arrhythmias (torsades de pointes)
      - Coexisting cardiovascular disease
      - Increased mortality from renal failure and other causes
      - Maldistribution of sympathetic innervation
    pass: 3
    src: { page: 81, quote: "Maldistribution of sympathetic innervation" }
    status: unverified
  - id: dm.L07.037
    kind: card
    topic: silent
    front: Which arrhythmia does the lecture link to the prolonged QT of CAN?
    back: Malignant ventricular arrhythmias such as torsades de pointes.
    src: { page: 81, quote: "Prolonged QT interval, malignant ventricular arrhythmias, eg torsades de pointes," }
    status: unverified
  - id: dm.L07.038
    kind: card
    topic: silent
    front: What is autonomic cardiopathy?
    back: LV systolic and particularly diastolic dysfunction associated with CAN in the absence of cardiac disease.
    src: { page: 81, quote: "CAN may be associated with abnormalities in LV systolic and particularly diastolic function in the absence of cardiac disease." }
    status: unverified
    tags: [high-yield]
  - id: dm.L07.039
    kind: enumerate
    topic: silent
    prompt: Pathophysiology of LV diastolic dysfunction in autonomic cardiopathy?
    points: [Delayed relaxation, Impaired LV filling, Increased stiffness]
    pass: 3
    src: { page: 81, quote: "Delayed relaxation," }
    status: unverified
  - id: dm.L07.040
    kind: card
    topic: silent
    front: What may LV diastolic dysfunction in CAN progress to?
    back: Diastolic heart failure.
    src: { page: 81, quote: "LVDD may progress to diastolic heart failure" }
    status: unverified
  - id: dm.L07.041
    kind: card
    topic: silent
    front: What kind of heart failure can diabetes produce independently through myocardial abnormalities?
    back: Heart failure with normal LV systolic function.
    src: { page: 81, quote: "contributing to heart failure with normal LV systolic function" }
    status: unverified
  - id: dm.L07.042
    kind: enumerate
    topic: tests
    prompt: Methods for the diagnostic assessment of cardiovascular autonomic function?
    points: [Bedside tests, Spectral analysis, Neurovascular flow, Radionuclide imaging]
    pass: 4
    src: { page: 82, quote: "Radionucleotide imaging" }
    status: unverified
  # ---------- p82: bedside tests ----------
  - id: dm.L07.043
    kind: enumerate
    topic: tests
    prompt: The five simple noninvasive cardiovascular reflex tests?
    points:
      - Valsalva maneuver
      - Heart rate response to deep breathing
      - Heart rate response to standing up
      - Blood pressure response to standing up
      - Blood pressure response to sustained handgrip
    pass: 5
    src: { page: 82, quote: "Five simple noninvasive cardiovascular reflex tests:" }
    status: unverified
    tags: [high-yield]
  - id: dm.L07.044
    kind: card
    topic: tests
    front: Two ways to analyse heart rate variability?
    back: Time-domain analysis (statistics of R-R intervals) and frequency-domain (spectral) analysis.
    src: { page: 82, quote: "statistical analysis of R-R intervals (time-domain analysis) or by spectral analysis (frequency-domain analysis)" }
    status: unverified
  - id: dm.L07.045
    kind: cloze
    topic: tests
    text: "A resting heart rate above {{c1::100}} beats/min is abnormal."
    src: { page: 82, quote: "> 100 beats/min is abnormal" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L07.046
    kind: card
    topic: tests
    front: How is the beat-to-beat heart rate variation with respiration tested?
    back: Patient supine at rest, breathing 6 breaths/min, heart rate monitored by ECG (or ANSCORE device).
    src: { page: 82, quote: "With the patient at rest and supine, breathing six breaths/min, heart rate monitored by ECG or ANSCORE device" }
    status: unverified
  - id: dm.L07.047
    kind: cloze
    topic: tests
    text: "Deep breathing test: a heart rate difference above {{c1::15}} beats/min is normal and below {{c2::10}} beats/min abnormal; the R-R inspiration/expiration ratio should be above {{c3::1.17}}."
    src: { page: 82, quote: "a difference in heart rate of > 15 beats/min is normal, and < 10 beats/min is abnormal." }
    status: unverified
    tags: [numbers, high-yield]
  # ---------- p83: standing, Valsalva, SBP ----------
  - id: dm.L07.048
    kind: card
    topic: tests
    front: How is the heart rate response to standing measured?
    back: On continuous ECG, the R-R interval is measured at beats 15 and 30 after standing (tachycardia then reflex bradycardia).
    src: { page: 83, quote: "the R-R interval is measured at beats 15 and 30 after standing." }
    status: unverified
  - id: dm.L07.049
    kind: cloze
    topic: tests
    text: "The 30:15 ratio after standing is normally above {{c1::1.03}}."
    src: { page: 83, quote: "The 30:15 ratio is normally > 1.03." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L07.050
    kind: card
    topic: tests
    front: Why does the 30:15 ratio work?
    back: Standing normally causes a tachycardia (around beat 15) followed by a reflex bradycardia (around beat 30), so the R-R at 30 is longer than at 15.
    src: { page: 83, quote: "Typically, a tachycardia is followed by reflex bradycardia." }
    status: unverified
  - id: dm.L07.051
    kind: cloze
    topic: tests
    text: "Valsalva test: the subject blows into a manometer to {{c1::40 mmHg}} for {{c2::15 s}}; the longest R-R / shortest R-R ratio should be above {{c3::1.2}}."
    src: { page: 83, quote: "The ratio of the longest R-R to the shortest R-R should be > 1.2." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L07.052
    kind: card
    topic: tests
    front: What is the normal response during and after the Valsalva maneuver?
    back: Tachycardia and peripheral vasoconstriction during the strain, then an overshoot bradycardia and BP rise on release.
    src: { page: 83, quote: "an overshoot of bradycardia and a rise in blood pressure occur with release." }
    status: unverified
  - id: dm.L07.053
    kind: table
    topic: tests
    title: Systolic BP response to standing (after 2 minutes)
    columns: [Response, Fall in SBP]
    rows:
      - [Normal, "<10 mmHg"]
      - [Borderline, "10–29 mmHg"]
      - [Abnormal, ">30 mmHg with symptoms"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 83, quote: "borderline is a fall of 10-29 mmHg, and abnormal is a fall of > 30 mmHg with symptoms." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L07.054
    kind: card
    topic: tests
    front: When is systolic BP re-measured after standing in the CAN test?
    back: After 2 minutes.
    src: { page: 83, quote: "The patient stands, and the systolic blood pressure is measured after 2 min." }
    status: unverified
  # ---------- p84: handgrip, QTc, summary ----------
  - id: dm.L07.055
    kind: cloze
    topic: tests
    text: "Handgrip test: squeeze at {{c1::30%}} of maximum for {{c2::5 min}}; diastolic BP in the other arm should rise by more than {{c3::16 mmHg}}."
    src: { page: 84, quote: "Grip is then squeezed at 30% maximum for 5 min." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L07.056
    kind: cloze
    topic: tests
    text: "The corrected QT interval (QTc) should be less than {{c1::440 ms}}."
    src: { page: 84, quote: "The QTc (corrected QT interval on EKG) should be < 440 ms" }
    status: unverified
    tags: [numbers]
  - id: dm.L07.057
    kind: table
    topic: tests
    title: Bedside CAN tests and normal values
    columns: [Test, Normal value]
    rows:
      - [Resting heart rate, "≤100/min (>100 abnormal)"]
      - [Deep breathing (6/min), "HR difference >15/min; R-R I/E >1.17"]
      - [Standing, "30:15 ratio >1.03"]
      - ["Valsalva (40 mmHg, 15 s)", "Longest/shortest R-R >1.2"]
      - [SBP on standing (2 min), "Fall <10 mmHg (abnormal >30)"]
      - ["Sustained handgrip (30%, 5 min)", "Diastolic rise >16 mmHg"]
      - [QTc, "<440 ms"]
    blanks: [[1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1]]
    src: { page: 84, quote: "After standing R-R 30:15→>1.03" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L07.058
    kind: mcq
    topic: tests
    stem: "A 52-year-old with type 1 diabetes has these results: resting HR 96, deep-breathing HR difference 8 bpm, 30:15 ratio 1.01, Valsalva ratio 1.25, SBP fall on standing 14 mmHg. What is the conclusion?"
    options:
      - "CAN: two tests abnormal (deep breathing and standing)"
      - "No CAN: only borderline values"
      - "CAN: Valsalva is abnormal"
      - "No CAN: resting HR is under 100"
      - "Orthostatic hypotension confirmed"
    answer: 0
    why:
      - "Correct: HR difference <10 and 30:15 ≤1.03 are abnormal; at least two abnormal tests diagnose CAN (p76, p82–83)."
      - Two tests are clearly abnormal, not borderline.
      - The Valsalva ratio 1.25 is above 1.2, so normal.
      - A normal resting HR does not rule out CAN.
      - "A 14 mmHg fall is borderline (10–29), not abnormal."
    src: { page: 82, quote: "a difference in heart rate of > 15 beats/min is normal, and < 10 beats/min is abnormal." }
    status: unverified
    tags: [numbers]
  - id: dm.L07.059
    kind: mcq
    topic: tests
    stem: During a Valsalva test (40 mmHg for 15 s), a patient's longest R-R interval is 0.88 s and the shortest 0.80 s. Interpret the result.
    options: ["Abnormal: ratio 1.1", "Normal: ratio 1.1", "Normal: ratio 0.91", "Abnormal: ratio 0.91", "Cannot interpret without BP"]
    answer: 0
    why:
      - "Correct: 0.88/0.80 = 1.1, below the normal >1.2 (p83)."
      - The cut-off for normal is above 1.2.
      - The ratio is longest over shortest, not the inverse.
      - The ratio is longest over shortest, not the inverse.
      - The Valsalva ratio is read from the ECG R-R intervals.
    src: { page: 83, quote: "The ratio of the longest R-R to the shortest R-R should be > 1.2." }
    status: unverified
    tags: [numbers]
  - id: dm.L07.060
    kind: mcq
    topic: tests
    stem: A 61-year-old diabetic man's SBP is 146 mmHg supine and 124 mmHg 2 minutes after standing, without symptoms. How is this classified by the lecture's test?
    options: [Borderline, Normal, Abnormal, Orthostatic tachycardia syndrome, Cannot be classified]
    answer: 0
    why:
      - "Correct: a fall of 22 mmHg is in the borderline 10–29 range (p83)."
      - Normal is a fall under 10 mmHg.
      - Abnormal is a fall over 30 mmHg with symptoms.
      - That syndrome has no BP fall but a heart-rate change.
      - The lecture's table covers it.
