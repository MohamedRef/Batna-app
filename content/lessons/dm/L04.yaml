  - id: dm.L04.lesson1
    title: "السكر مش لوحده: القلب والكلية"
    hook: "عيان type 2 نادرًا ما بيجيلك بالسكر بس. غالبًا معاه ضغط ووزن وكوليسترول، وكلهم بيضربوا نفس الشرايين."
    minutes: 8
    pages: [37, 39]
    topics: [risk-factors, cardiorenal]
    goals:
      - "تحفظ نسب الـ risk factors في type 2 والـ four areas of focus"
      - "تعرف مين ASCVD ومين high risk"
      - "تختار الدوا الصح لكل arm: ASCVD و HF و CKD"
    status: unverified
    steps:
      - kind: explain
        page: 37
        title: "العيان بييجي بباقة"
        quote: "Patients with T2DM often have multiple risk factors\n  8) 45% are obese (BMI ≥30 kg/m2)2\n  9) 80% have hypertension (blood pressure ≥130/80 mmHg)\n  10) 50 % of patients have hypercholesterolaemia (total cholesterol ≥5.0 mmol/L)\n  11) T2DM, Cardiovascular disease & kidney disease are interrelated disorders"
        text: |
          في **type 2**:
          - **45%** عندهم obesity (BMI ≥30)
          - ==80%== عندهم hypertension (≥130/80)
          - **50%** عندهم hypercholesterolemia (TC ≥5.0 mmol/L)

          والسكر والقلب والكلية **interrelated**: كل واحد بيزوّد التاني.

          يعني إيه interrelated؟ التفسير المقبول (مش في الكتاب): نفس الـ insulin resistance والوزن الزيادة بيعملوا السكر والضغط والدهون مع بعض، والتلاتة بيضربوا الشرايين. الكلية التعبانة بتعلّي الضغط وبتزوّد خطر القلب، والقلب الضعيف بيقلل دم الكلية. عشان كده ما ينفعش تعالج السكر لوحده: لو نزّلت الـ A1C وسيبت الضغط والكوليسترول، العيان هيموت بالقلب برضه.
      - kind: explain
        remind: [dm.L04.003]
        page: 37
        title: "الهدف: نمنع الـ complications"
        quote: "Goals of treatment: Prevention of complications l Four areas of focus: Glycemic management Weight management CV risk factors management Cardio-renal protection"
        text: |
          أربع حاجات نشتغل عليها مع بعض:
          1. **Glycemic** management
          2. **Weight** management
          3. **Cardiovascular (CV) risk factors** management
          4. ==Cardio-renal protection==

          وتحت كل ده: **healthy lifestyle** و **self-management education**.

          ليه الأربعة مع بعض؟ لأن الهدف **prevention of complications** مش رقم سكر حلو. السكر لوحده بيحمي الـ microvessels، بس الـ macrovascular (القلب والمخ) محتاج ضغط ودهون ووزن، والكلية والقلب محتاجين أدوية بتحميهم مباشرة (cardio-renal protection). والـ lifestyle تحت الكل لأنه بيأثر على الأربعة مرة واحدة.
      - kind: mnemonic
        page: 37
        quote: "Goals of treatment: Prevention of complications l Four areas of focus: Glycemic management Weight management CV risk factors management Cardio-renal protection"
        word: "GWCC"
        parts:
          - { key: "G", text: "Glycemic management" }
          - { key: "W", text: "Weight management" }
          - { key: "C", text: "CV risk factors management" }
          - { key: "C", text: "Cardio-renal protection" }
      - kind: explain
        page: 38
        title: "مين ASCVD ومين high risk؟"
        quote: "Indicators of high risk 55 years of age with two or more additional risk factors, including:\nObesity\nHypertension\nSmoking\nDyslipidemia, or albuminuria"
        text: |
          **Atherosclerotic cardiovascular disease (ASCVD):** Myocardial infarction (MI)، stroke، أي revascularization، transient ischaemic attack (TIA)، unstable angina، amputation، coronary artery disease (CAD) (بأعراض أو من غيرها).

          **Indicators of high risk:** سنّه ==≥55== ومعاه **2 أو أكتر** من: obesity، hypertension، smoking، dyslipidemia، albuminuria.

          ليه الفرق ده مهم؟ لأن الاتنين بيدخلوا نفس الـ arm في الـ algorithm: الـ ASCVD يعني الجلطة حصلت خلاص (secondary prevention)، والـ high risk يعني إنها قريبة (السن + risk factors). وفي الحالتين الدوا بيتختار عشان يحمي القلب، مش عشان السكر.
      - kind: figure
        page: 39
        quote: "+CKD: eGFR <60 mL/min per 1.73 m2 OR albuminuria (ACR ≥3.0 mg/mmol [30mg/g]). These measurements may vary over time; thus, a repeat measure is required to document CKD.\n+CKD (on maximally tolerated dose of ACEi/ARB):\n  PREFERABLY SGLT2i with primary evidence of reducing CKD progression\n    Use SGLT2i in people with an eGFR ≥20 mL/min per 1.73 m2; once initiated should be continued until initiation of dialysis or transplantation\n  OR GLP-1 RA with proven CVD benefit if SGLT2i not tolerated or contraindicated\n  If HbA1c above target, for patients on SGLT2i, consider incorporating a GLP-1 RA or vice versa"
        title: "تلات arms وكل arm ليه دوا"
        alt: "Three columns: ASCVD or high risk leads to a GLP-1 receptor agonist or an SGLT2 inhibitor with proven CVD benefit; heart failure leads to an SGLT2 inhibitor with proven HF benefit; CKD leads preferably to an SGLT2 inhibitor if eGFR is 20 or more, or a GLP-1 receptor agonist if SGLT2 inhibitors are not tolerated."
        caption: "الـ ==SGLT2 inhibitor (SGLT2i)== موجود في التلاتة. الـ GLP-1 RA بيقف جنبه في الـ ASCVD، وبديله في الـ chronic kidney disease (CKD)."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L04a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
