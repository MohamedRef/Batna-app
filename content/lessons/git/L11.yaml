  # ------------------------------------------------------------------
  - id: git.L11.lesson1
    title: "الدم طالع منين؟"
    hook: "لون الدم وشكله بيقولولك المصدر فين وبينزف بسرعة قد إيه، قبل ما تمسك منظار."
    minutes: 8
    pages: [299, 308]
    topics: [overview, causes]
    goals:
      - "تفرّق بين upper و lower GI bleeding بالـ ligament of Treitz"
      - "تقرا الـ hematemesis والـ melena والـ hematochezia كمؤشر للسرعة"
      - "تحفظ أسباب الـ UGIB بنسبها"
    status: unverified
    steps:
      - kind: explain
        page: 299
        quote: "Acute gastrointestinal bleeding is one of the most common medical emergencies with 250,000 to 300,000 hospitalizations annually."
        title: "طوارئ يومية"
        text: |
          الـ ==acute GI bleeding== من أشهر الطوارئ الباطنة: **250,000-300,000** دخول مستشفى في السنة، و **mortality** حوالي **6-8%**.

          الخطر الأعلى عند **advanced age** واللي عندهم **severe comorbidities**. ومش دكتور واحد اللي بيعالجه: طوارئ، باطنة، جهاز هضمي، جراحة، interventional radiology، وهيماتولوجي.
      - kind: figure
        page: 299
        quote: "Upper GI bleeding (UGIB) is defined as bleeding derived from a source proximal to the ligament of Treitz."
        title: "الخط الفاصل: Treitz"
        alt: "A vertical sketch of the GI tract: esophagus, stomach and duodenum above a dashed line labelled ligament of Treitz marked upper GI bleeding, about 4 times more common; small bowel and colon below it marked lower GI bleeding."
        caption: "اللي فوق الـ ligament of Treitz = upper، واللي تحته = lower. والـ upper أشهر بحوالي 4 مرات."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="140" rx="8" class="fg-acc"/>
            <text x="20" y="34" class="t-b">Upper GI bleeding</text>
            <text x="20" y="56" class="t-sm">Esophagus, stomach, duodenum</text>
            <text x="20" y="78" class="t-sm t-mut">Proximal to the ligament of Treitz</text>
            <text x="20" y="110" class="t-lg t-acc t-b">×4</text>
            <text x="60" y="110" class="t-sm">more common than lower</text>
            <text x="20" y="132" class="t-sm t-mut">Non-variceal or variceal</text>
            <path d="M10 165h310" class="fg-ink" stroke-width="3" stroke-dasharray="8 6"/>
            <text x="165" y="186" text-anchor="middle" class="t-sm t-b">Ligament of Treitz</text>
            <rect x="10" y="200" width="310" height="120" rx="8" class="fg-box"/>
            <text x="20" y="224" class="t-b">Lower GI bleeding</text>
            <text x="20" y="246" class="t-sm">Small bowel and colon</text>
            <text x="20" y="268" class="t-sm t-mut">Lecture 7 owns lower GI bleeding</text>
            <text x="20" y="300" class="t-sm t-mut">Course: acute, chronic, intermittent, occult</text>
          </svg>
      - kind: aside
        tone: trap
        page: 299
        quote: "relation to ligament of trietz (at the junction of 2nd and 3rd parts of duodenum)."
        text: |
          الكتاب كاتب إن الـ **ligament of Treitz** عند الـ junction بين الجزء التاني والتالت من الـ duodenum. التشريح المعروف إنه عند الـ **duodenojejunal flexure** (آخر الـ duodenum). لو اتسألت عن التعريف، الأهم: **proximal to the ligament of Treitz** = upper.
      - kind: explain
        page: 300
        quote: "Melena develops after as little as 50–100 mL of blood loss in the upper gastrointestinal tract."
        title: "شكل الدم بيقول السرعة"
        text: |
          - ==Hematemesis with clots==: أخطر شكل؛ النزيف سريع لدرجة إن الجلطة ما لحقتش تدوب.
          - **Hematemesis** بدم فريش، أو **coffee ground** لو أبطأ.
          - ==Melena==: براز أسود زي القطران وريحته وحشة = نزيف upper **بطيء**. ممكن ييجي بعد hematemesis أو حتى نزيف لثة لكام يوم. و **50-100 mL** كفاية تعمله.
          - **Hematochezia** من مصدر upper = نزيف **سريع وكبير** (حوالي **1 لتر**).
      - kind: check
        page: 300
        quote: "Hematochezia (fresh bleeding per rectum) if associated with upper GI bleeding presents rapid and huge blood loss (about 1 liter)."
        question: "Fresh blood per rectum and an NG aspirate full of red blood. What does this tell you?"
        options:
          - "Rapid, huge upper GI loss (about 1 liter)"
          - "Slow upper GI bleeding of 50-100 mL"
          - "A lower GI source only"
          - "Bleeding has stopped"
        answer: 0
        why:
          - "صح: hematochezia مع مصدر upper = نزيف سريع وكبير، حوالي لتر."
          - "الـ 50-100 mL دي اللي تكفي تعمل melena."
          - "الـ aspirate الأحمر بيأكد إن المصدر upper."
          - "دم فريش = النزيف شغال."
      - kind: table
        page: 300
        quote: "Peptic ulcers account for 40% of major upper gastrointestinal bleeding with an overall mortality rate of less than 5%."
        title: "الأسباب بالنسب"
        columns: ["Cause", "Share of UGIB"]
        rows:
          - ["Peptic ulcer", "40% (mortality <5%)"]
          - ["Portal hypertension", "10-20%"]
          - ["Vascular anomalies", "7%"]
          - ["Erosive gastritis", "<5% of severe bleeds"]
          - ["Gastric neoplasms", "1%"]
        hide: [[0, 1], [1, 1], [2, 1], [4, 1]]
      - kind: explain
        page: 300
        quote: "The incidence of bleeding from ulcers is declining due to eradication of H pylori and prophylaxis with proton pump inhibitors in high-risk patients."
        title: "القرحة والدوالي"
        text: |
          - ==Peptic ulcer== لسه السبب الأول، بس بيقل بفضل **H. pylori eradication** و **PPI prophylaxis** للـ high-risk.
          - ==Portal hypertension==: من **esophageal varices** غالبًا، وأقل من gastric أو duodenal varices أو **portal hypertensive gastropathy**. (تفاصيل الدوالي في hb.L03.)
      - kind: match
        page: 301
        quote: "The Dieulafoy lesion is an aberrant, large-caliber submucosal artery, most commonly in the proximal stomach that causes recurrent, intermittent bleeding."
        prompt: "وصّل كل vascular lesion بوصفها:"
        pairs:
          - ["Angioectasia", "1-10 mm stellate vessels, mostly right colon"]
          - ["Telangiectasia", "Cherry-red dilated venules; HHT or CREST"]
          - ["Dieulafoy lesion", "Large submucosal artery, proximal stomach"]
          - ["Aortoenteric fistula", "Complicates 2% of aortic grafts"]
        why: "الـ angioectasia = أوعية مشوّهة 1-10 mm، أكتر حاجة في الـ right colon. الـ telangiectasia = venules متوسعة، مع HHT أو CREST. الـ Dieulafoy = شريان كبير غلط تحت الـ mucosa، بينزف ويقف ويرجع. والـ aortoenteric fistula مع 2% من الـ aortic grafts."
      - kind: aside
        tone: analogy
        page: 301
        quote: "The Dieulafoy lesion is an aberrant, large-caliber submucosal artery, most commonly in the proximal stomach that causes recurrent, intermittent bleeding."
        text: |
          الـ **Dieulafoy** زي ماسورة مياه رئيسية معدّية تحت بلاط رفيع. البلاط يتشرخ شرخ صغير، المية تطرطش جامد، وبعدين يقف. المنظار ممكن يطلع normal مرتين قبل ما تمسكه وهو بينزف.
      - kind: explain
        page: 301
        quote: "Unusual causes of upper gastrointestinal bleeding include hemobilia (from hepatic tumor, angioma, penetrating trauma), and pancreatic malignancy and pseudoaneurysm"
        title: "الباقي"
        text: |
          - **Erosive gastritis**: superficial فنادرًا تعمل نزيف شديد (<5%)، وغالبًا **chronic loss**. أسبابها **NSAIDs**، **alcohol**، و **stress-related mucosal disease**.
          - **Severe erosive esophagitis** نادرًا تنزف جامد، خصوصًا في اللي نايمين على السرير مدة طويلة.
          - غريبة: ==hemobilia== (hepatic tumor، angioma، trauma) و ==hemosuccus pancreaticus== (pancreatic malignancy أو pseudoaneurysm).
      - kind: sort
        page: 308
        quote: "Etiologies of non-variceal upper gastrointestinal bleeding"
        prompt: "حط كل سبب في مجموعته من Table 1 (etiologies of non-variceal bleeding):"
        bins: ["Ulcer / inflammation", "Vascular", "Malignant", "Others / post procedural"]
        cards:
          - { text: "Anastomotic ulcer after gastric bypass", bin: 0 }
          - { text: "Erosive duodenitis", bin: 0 }
          - { text: "GAVE", bin: 1 }
          - { text: "Dieulafoy lesion", bin: 1 }
          - { text: "GIST", bin: 2 }
          - { text: "Schwannoma", bin: 2 }
          - { text: "Mallory-Weiss tear", bin: 3 }
          - { text: "Post sphincterotomy", bin: 3 }
          - { text: "Cameron ulcer", bin: 3 }
        why: "الجدول بيقسّم: ulcer/inflammation، vascular، congestive (PHG)، malignant (GIST، non-GIST زي lipoma و schwannoma، cancer، metastases)، post procedural، و others (Mallory-Weiss و Cameron)."
      - kind: try
        items: [git.L11.003, git.L11.010, git.L11.012, git.L11.019, git.L11.025]
    recap:
      - "UGIB = proximal to the ligament of Treitz، أشهر من الـ lower بـ 4 مرات. Mortality 6-8%."
      - "Clots في الـ hematemesis = سريع. Melena = بطيء، و 50-100 mL كفاية. Hematochezia من upper = حوالي لتر."
      - "Peptic ulcer 40%، portal hypertension 10-20%، vascular 7%، erosive gastritis أقل من 5%، neoplasm 1%."
      - "Dieulafoy = شريان كبير في الـ proximal stomach. Aortoenteric fistula في 2% من الـ grafts."
    practice: [git.L11.001, git.L11.002, git.L11.003, git.L11.004, git.L11.005, git.L11.006, git.L11.007, git.L11.008, git.L11.009, git.L11.010, git.L11.011, git.L11.012, git.L11.013, git.L11.014, git.L11.015, git.L11.016, git.L11.017, git.L11.018, git.L11.019, git.L11.020, git.L11.021, git.L11.022, git.L11.023, git.L11.024, git.L11.025, git.L11.026, git.L11.027, git.L11.028]
