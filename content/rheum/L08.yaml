  # ---------- p162-163: book questions (no answer key) ----------
  - id: rheum.L08.191
    kind: mcq
    topic: lvv-rx
    stem: Which imaging modality is particularly useful for diagnosing large vessel vasculitis?
    options:
      - MRI
      - Ultrasound
      - FDG-PET/CT
      - X-ray
      - Mammography
    answer: 2
    why:
      - MRI/MRA shows wall thickening but does not show metabolic activity across the whole aorta as well.
      - Ultrasound (halo sign) is first-line for cranial GCA but sees less of the aorta and its branches.
      - "Correct: FDG-PET/CT shows vessel wall inflammation across the whole aorta and its branches; the book only says to confirm LVV by imaging or histology (p136)."
      - Plain X-ray cannot show vessel wall inflammation.
      - Mammography may show breast arterial calcification but is not a vasculitis test.
    src: { page: 136, quote: "A suspected diagnosis of LVV should be confirmed by imaging or histology." }
    status: unverified
    tags: [book-question, no-key]
  - id: rheum.L08.192
    kind: mcq
    topic: clues
    stem: Cutaneous vasculitis affects small- or medium-sized vessels of the skin and subcutaneous tissue, not internal organs. Vasculitis of the small skin vessels tends to cause which lesions?
    options:
      - Deep ulcers
      - Livedo reticularis
      - Nodules
      - Petechiae
    answer: 3
    why:
      - Deep ulcers come from medium vessel (arterial) involvement.
      - Livedo reticularis reflects medium vessel disease.
      - Subcutaneous nodules reflect medium vessel disease (e.g., cutaneous PAN).
      - "Correct: small vessel (leucocytoclastic) vasculitis gives petechiae and palpable purpura (p127)."
    src: { page: 127, quote: "Usual presentation is in the form of palpable purpura,urticaria, bullous ulcers or splinter haemorrhages, mainly limited to lower extremities. The salient features are:\n  Absence of systemic involvement.\n  Negative serology.\n  Small vessel leucocytoclastic vasculitis.\n  Better prognosis." }
    status: unverified
    tags: [book-question, no-key]
  - id: rheum.L08.193
    kind: mcq
    topic: gca
    stem: An older woman with unilateral headache, vision loss and morning joint stiffness has a temporal artery biopsy. What histology would you expect?
    options:
      - Large vessel giant cell vasculitis with fragmentation of elastic lamina
      - Small vessel eosinophilic vasculitis
      - Medium vessel vasculitis with fibrinoid necrosis
      - Large vessel granulomatous vasculitis with massive intimal fibrosis
      - Medium vessel transmural vasculitis
    answer: 0
    why:
      - "Correct: GCA (with PMR) shows granulomatous inflammation with giant cells and a fragmented internal elastic lamina (pp131-133)."
      - Eosinophilic small vessel vasculitis is EGPA.
      - Fibrinoid necrosis of medium arteries is PAN.
      - Massive intimal fibrosis is not the classic GCA picture; elastic lamina fragmentation is.
      - Transmural medium vessel inflammation is PAN.
    src: { page: 133, quote: "Giant cell arteritis: photomicrograph" }
    status: unverified
