lecture: hem.L03
lessons:
  # ------------------------------------------------------------------
  - id: hem.L03.lesson1
    title: "الكرة بتموت بدري: الـ haemolysis والـ spherocytosis"
    hook: "الكرة الحمرا المفروض تعيش 120 يوم. لو غشاها بايظ، الطحال بيعدمها قبل معادها."
    minutes: 8
    pages: [18, 21]
    topics: [haemolysis, hs]
    goals:
      - "تفرّق الـ intravascular من الـ extravascular haemolysis"
      - "تفهم عيب الغشا في الـ HS وليه الكرة بتبقى كورة"
      - "تعرف التشخيص (EMA) والعلاج (splenectomy + folate)"
    status: unverified
    steps:
      - kind: explain
        page: 18
        title: "يعني إيه haemolysis؟"
        quote: "Hemolysis is defined as premature destruction and hence a shortened RBC life span (< 120 days)."
        text: |
          الـ ==haemolysis== = الكرة الحمرا بتتكسر **قبل معادها**، فعمرها يبقى أقل من **120 يوم**.

          وفيه مكانين للتكسير:
          - **Intravascular**: الكرة بتنفجر **جوّه الأوعية** ومحتواها يطلع في البلازما.
          - **Extravascular**: خلايا الـ ==RE system== (الطحال أساسًا) بتاكلها وتهضمها.
      - kind: figure
        page: 18
        quote: "INTRAVASCULAR HEMOLYSIS-Red cells undergo lysis in the circulation and release their contents into plasma."
        title: "فين الكرة بتموت؟"
        alt: "Two panels. Intravascular: a red cell bursts inside a blood vessel and free haemoglobin enters the plasma. Extravascular: a red cell is engulfed by a macrophage in the spleen (RE system)."
        caption: "**Intravascular** = انفجار في الشارع، والـ Hb بيطلع في البلازما. **Extravascular** = القبض عليها في الطحال وأكلها. هتقابل الاتنين: الـ G6PD و الـ PNH فيهم intravascular، والـ HS والـ warm AIHA extravascular."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="10" width="320" height="105" rx="10" class="fg-bad"/>
            <text x="15" y="32" class="t-b">Intravascular</text>
            <path d="M20 70 L310 70" class="fg-thin"/>
            <path d="M20 100 L310 100" class="fg-thin"/>
            <circle cx="90" cy="85" r="12" class="fg-dot-bad"/>
            <text x="120" y="90" class="t-sm">→ bursts in the vessel</text>
            <circle cx="270" cy="80" r="3" class="fg-dot-bad"/>
            <circle cx="282" cy="90" r="3" class="fg-dot-bad"/>
            <circle cx="262" cy="94" r="3" class="fg-dot-bad"/>
            <text x="15" y="54" class="t-sm t-mut">free Hb into plasma</text>
            <rect x="5" y="130" width="320" height="110" rx="10" class="fg-acc"/>
            <text x="15" y="152" class="t-b">Extravascular</text>
            <ellipse cx="100" cy="200" rx="55" ry="28" class="fg-box"/>
            <text x="100" y="204" text-anchor="middle" class="t-sm">Macrophage</text>
            <circle cx="170" cy="200" r="12" class="fg-dot-bad"/>
            <text x="190" y="196" class="t-sm">eaten in the</text>
            <text x="190" y="212" class="t-sm">spleen (RE system)</text>
          </svg>
      - kind: explain
        page: 18
        title: "Hereditary spherocytosis"
        quote: "characterized by an inherited defect in the red cell membrane cytoskeleton leading to the formation of spherocytic red cells"
        text: |
          الـ ==HS== مرض وراثي في **الـ cytoskeleton** بتاع غشا الكرة، فالكرة تبقى **spherocyte** (كورة بدل قرص).

          الـ spherocyte **أقل مرونة**، فبتتحبس وتتكسر في **الطحال**.

          الوراثة غالبًا ==autosomal dominant==، وأحيانًا recessive.
      - kind: explain
        page: 18
        title: "الغشا متربط إزاي؟"
        quote: "The first linkage involves interaction of ankyrin with spectrin in skeleton and band 3 in the bilayer."
        text: |
          الـ lipid bilayer متربط بالـ skeleton بـ **رابطين**:
          1. **Ankyrin** مع **spectrin** (في الـ skeleton) و **band 3** (في الـ bilayer).
          2. **Glycophorin C** مع **protein 4.1**.

          أي نقص فيهم = الـ bilayer يفك من الـ skeleton ويتقشر، فالـ ==surface area تقل بالنسبة للـ volume==، والكرة تتكوّر.
      - kind: aside
        tone: analogy
        page: 19
        quote: "This causes decrease in surface area of red cell relative to volume with resultant spherocyte formation."
        text: "تخيل بلونة طويلة بتفقد حتة من جلدها كل شوية: نفس الهوا جوّه، بس الجلد أقل، فتبقى **كورة مشدودة**. والكورة المشدودة ما تعرفش تتلوى وتعدّي من فتحات الطحال الضيقة، فتتحبس."
      - kind: check
        page: 19
        quote: "The second attachment between skeleton and bilayer provided by glycophorin C and protein 4.1."
        question: "Which pair forms the SECOND linkage of the red cell membrane?"
        options:
          - "Glycophorin C and protein 4.1"
          - "Ankyrin and spectrin"
          - "Band 3 and ankyrin"
          - "Spectrin and haemoglobin"
        answer: 0
        why:
          - "صح: الرابط التاني = glycophorin C + protein 4.1."
          - "ده جزء من الرابط الأول."
          - "ده كمان الرابط الأول."
          - "الـ Hb جوّه الكرة، مش جزء من الروابط دي."
      - kind: explain
        page: 19
        title: "الصورة الإكلينيكية"
        quote: "Mild to moderate anaemia"
        text: |
          أغلبهم بيظهروا في **الطفولة** بـ:
          - **Anaemia** خفيفة لمتوسطة
          - **Jaundice** متقطعة
          - **Splenomegaly**
          - ==Gall stones== (bilirubin كتير = pigment stones)
          - **Chronic leg ulcers**
      - kind: figure
        page: 20
        title: "Blood film من الكتاب (ص 20)"
        image: { file: hem/L03-hs-film.webp, book: true }
        alt: "Book photomicrograph of a peripheral blood film in hereditary spherocytosis with red cells and a neutrophil."
        caption: "صورة الكتاب لفيلم الـ HS. الـ ==spherocyte== صغيرة وكثيفة ومن غير **central pallor**، لأنها كورة مش قرص."
      - kind: explain
        page: 20
        title: "التحاليل"
        quote: "Eosin -5- Maleimide Binding test is the gold standard confirmatory test"
        text: |
          - **Anaemia** خفيفة لمتوسطة، و **reticulocytosis**.
          - الـ **film**: ==spherocytosis==.
          - **Bone marrow**: erythroid hyperplasia.
          - **Osmotic fragility**: نحط الكرات في **saline أقل تركيز** بالتدريج ونقيس الـ haemolysis. الكورة ما عندهاش مساحة تنفخ، فتنفجر بدري.
          - الـ **gold standard**: ==Eosin-5-maleimide (EMA) binding==: صبغة fluorescent بتلزق على سطح الكرة، ونقيسها بالـ **flow cytometry**. سطح أقل = fluorescence أقل.
      - kind: reveal
        page: 21
        quote: "Administration of folate is necessary in moderate or severe disease to prevent megaloblastic anaemia due to increased erythrocyte turnover."
        prompt: "ليه عيان الـ HS المتوسط أو الشديد لازم ياخد folate؟"
        answer: "النخاع شغال **overtime** عشان يعوّض الكرات اللي بتتكسر، فبيستهلك الـ **folate** بسرعة. لو خلص، يجيله **megaloblastic anaemia** فوق الـ haemolysis. والحالات الشديدة علاجها ==splenectomy==، لأن الطحال هو مكان الإعدام."
      - kind: try
        items: [hem.L03.002, hem.L03.006, hem.L03.008, hem.L03.011, hem.L03.012]
    recap:
      - "Haemolysis = عمر الكرة < 120 يوم؛ intravascular (في الأوعية) أو extravascular (RE system)."
      - "HS: عيب cytoskeleton، غالبًا AD؛ ankyrin–spectrin–band 3 و glycophorin C–protein 4.1."
      - "مساحة أقل للـ volume ← spherocyte ← بتتحبس في الطحال."
      - "Anaemia، jaundice متقطعة، splenomegaly، gall stones، leg ulcers."
      - "EMA binding (flow cytometry) هو الـ gold standard؛ osmotic fragility بيقيس الـ haemolysis في saline مخفف."
      - "علاج الشديد: splenectomy؛ و folate للمتوسط والشديد."
    practice: [hem.L03.001, hem.L03.002, hem.L03.003, hem.L03.004, hem.L03.005, hem.L03.006, hem.L03.007, hem.L03.008, hem.L03.009, hem.L03.010, hem.L03.011, hem.L03.012, hem.L03.013, hem.L03.014]
