      - kind: explain
        page: 162
        quote: "Coronaviruses are a large family of viruses that cause upper and lower- respiratory tract illnesses in humans. SARS-CoV-2 is transmitted predominantly via respiratory droplets. Clinically, patients frequently present with fever, cough, myalgia, and fatigue (95). In a subset of patients, mainly elderly individuals, SARS-CoV-2 was shown to lead to bilateral pulmonary diffuse alveolar damage that may progress to acute respiratory distress syndrome (96, 97)."
        title: "الكورونا: البداية"
        text: |
          - بتتنقل أساسًا بالـ **respiratory droplets**.
          - وبتيجي غالبًا بـ fever و cough و myalgia و fatigue.
          - وفي subset من الناس، ==أغلبهم كبار==، بتعمل **bilateral pulmonary diffuse alveolar damage** ممكن تبقى **acute respiratory distress syndrome (ARDS)**.

          ليه الكبار بالذات؟ التفسير المقبول (مش في الكتاب) من اللي فات في المحاضرة: الـ naive T cells قليلة قدام فيروس **جديد** محدش شافه قبل كده، والـ innate بيوصل متأخر، وفي نفس الوقت الـ inflamaging شغّال من الأول. يعني رد ضعيف على الفيروس، والتهاب زيادة على الرئة.
      - kind: explain
        page: 163
        quote: "The innate immune response is the first level of response in the detection and clearance of a viral infection. In SARS-CoV-2, the spike protein (S) mediates the attachment, fusion, and entry of the virus in human cells (99). The protein S strongly binds to angiotensinconverting enzyme 2 receptor leading to the attachment of the virus to the host cell (99). The successful entry needs the priming of the S protein by TMPRSS2, a human cellular serine protease (100). Once in the host cell, SARS-CoV-2 can be detected by macrophages, which or chest rate the production of a pro-inflammatory microenvironment that inhibits viral replication, stimulates adaptive immunity."
        title: "الدخول: spike و ACE2 و TMPRSS2"
        text: |
          الكتاب بيقول الـ **innate immune response** هو أول مستوى في اكتشاف الفيروس وتنضيفه. والخطوات:
          1. الـ **spike protein (S)** هو اللي بيعمل attachment و fusion و entry.
          2. الـ S بيمسك جامد في ==angiotensin-converting enzyme 2 (ACE2) receptor==.
          3. الدخول محتاج **priming** للـ S بـ **TMPRSS2** (serine protease بشري).
          4. جوّه الخلية، الـ **macrophages** بتكتشفه وبتعمل pro-inflammatory microenvironment يمنع الـ replication ويصحّي الـ adaptive immunity.

          التفسير المقبول (مش في الكتاب) للصورة: الـ ACE2 هو «القفل» والـ spike هو «المفتاح»، والـ TMPRSS2 هو اللي «بيبرد» المفتاح عشان يلف. فالالتهاب في الأول **مفيد**: هو جرس الإنذار. المشكلة لما الجرس ما يسكتش.
      - kind: order
        page: 163
        quote: "The uncontrolled systemic inflammation causes endothelial injury and activation of coagulation cascade. The consequence is an explosive process of disseminated intravascular coagulation and consumption of coagulation factors that leads to organ damage and death."
        prompt: "الكورونا الشديدة في الكبير: رتّب اللي بيحصل"
        steps:
          - "Diffuse alveolar damage"
          - "ARDS"
          - "Cytokine storm"
          - "Endothelial injury + coagulation"
          - "DIC"
          - "Organ damage and death"
        why: "بعد الـ pulmonary phase ييجي **cytokine storm**؛ الـ inflammation تأذي الـ endothelium وتشغّل الـ coagulation، فيحصل ==disseminated intravascular coagulation (DIC)== مع consumption of clotting factors، وبعدين organ damage و death."
      - kind: explain
        page: 163
        quote: "The uncontrolled systemic inflammation causes endothelial injury and activation of coagulation cascade. The consequence is an explosive process of disseminated intravascular coagulation and consumption of coagulation factors that leads to organ damage and death."
        title: "العاصفة: ليه بتوصل للـ DIC"
        text: |
          بعد الـ pulmonary phase، اللي حالتهم وحشة بيعملوا ==cytokine storm syndrome==: bursts من الـ pro-inflammatory cytokines والـ chemokines في الدم. والكتاب بيرتّب:
          - الـ uncontrolled systemic inflammation ← **endothelial injury** و activation of coagulation cascade
          - ← process ==explosive== من **disseminated intravascular coagulation (DIC)** و consumption of coagulation factors
          - ← organ damage و death

          ليه الالتهاب بيوصل للتجلط؟ التفسير المقبول (مش في الكتاب): الـ endothelium هو البطانة اللي بتمنع الدم يتجلط جوّه الأوعية. لما الـ cytokines تجرحه، السطح يبقى «لزّيق» فالجلطات الصغيرة تنتشر في كل حتة، وتستهلك عوامل التجلط، فيحصل نزيف وجلطات في نفس الوقت، والأعضاء ما يوصلهاش دم.
      - kind: explain
        page: 163
        title: "ليه الكبير بالذات؟"
        quote: "Macrophages from elderly lungs may have a more pronounced production of IL-6 and other pro-inflammatory cytokines in response to stimuli (101). It is possible that IL-6 has a critical role in the immune response of the elderly that mounts against SARS- COV-2. Patients with severe COVID-19 have a higher IL-6/Interferon-γ ratio than those who present with a moderate disease, which could be related to the cytokine storm leading to lung injury (104–107). Indeed, patients with severe COVID-19 frequently have lower absolute numbers of Interferon-γ producing CD4+ T cells compared to patients with moderate disease (108). Then, when patients with COVID-19 enter the immune dysregulation phase, the increase in IL-6 leads to a relative immunoparalysis that may impair the clearance of SARS-Cov-2 (98)."
        text: |
          - الـ **spike (S)** بيمسك في **angiotensin-converting enzyme 2 (ACE2)**، والدخول محتاج **transmembrane serine protease 2 (TMPRSS2)** (serine protease).
          - الـ macrophages في رئة الكبير بتطلّع ==IL-6 أكتر==.
          - الشديد عنده **IL-6/IFN-γ ratio أعلى** و CD4+ T cells اللي بتعمل IFN-γ أقل.
          - الـ IL-6 العالي = relative **immunoparalysis**.

          ليه الـ IL-6 بالذات؟ الكتاب بيقول الـ macrophages في رئة الكبير ==بتطلّع IL-6 أكتر== لنفس الـ stimulus، وإن الـ IL-6 ممكن يكون ليه critical role في رد الكبير. التفسير المقبول (مش في الكتاب): ده الـ inflamaging اللي درسناه، بس هنا على رئة مصابة: الأساس عالي، فالفيروس يعلّيه أكتر بسرعة.

          وليه الـ **immunoparalysis**؟ الكتاب بيقول لما الـ IL-6 يعلى في الـ immune dysregulation phase بيعمل relative immunoparalysis ممكن ==تعطّل clearance الفيروس==. يعني الالتهاب الزيادة مش بس بيأذي، ده كمان بيشلّ الرد اللي المفروض يخلّص على الفيروس.
