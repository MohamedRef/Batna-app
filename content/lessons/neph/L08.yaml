  - id: neph.L08.lesson3
    title: "Lupus و membranous: الـ deposits بتتكلم"
    hook: "بنت 14 سنة بـ creatinine 7، وبنت 22 سنة الـ anti-PLA2R بتاعها سلبي بس الـ biopsy بيقول غير كده."
    minutes: 10
    pages: [226, 239]
    topics: [lupus, membranous]
    goals:
      - "تحفظ classes الـ ISN/RPS"
      - "تفهم أهمية الـ anti-PLA2R في التشخيص والمتابعة"
      - "تفرّق الـ spikes من الـ double contour"
    status: unverified
    steps:
      - kind: explain
        page: 227
        title: "Case 2"
        quote: "S.L.E was diagnosed, and cellcept and hydroquine were started."
        text: |
          بنت **14 سنة** بتاخد **NSAIDs** لركبتها، جاية بـ fatigue و vomiting، **Hb 5.8**، **WBC 2.6**، و ==creatinine 7.3==.

          الـ labs: **anti-dsDNA 321**، ANA 7.9، urine فيها 80 RBC، **uPCR 6.7**، ESR 140. اتشخّصت ==SLE== وبدأت **CellCept** و **hydroxychloroquine**.
      - kind: reveal
        page: 227
        quote: "In your opinion, should we proceed to a renal biopsy? Why?"
        prompt: "التشخيص اتعمل. نعمل biopsy ليه؟"
        answer: "علشان الـ **class** هو اللي بيحدد العلاج، والـ biopsy بيوري **activity** و **chronicity**، وممكن يكشف حاجة تانية؛ وفعلًا لقى **toxic acute tubular injury** (غالبًا من الـ NSAIDs)."
      - kind: table
        page: 228
        quote: "Abbreviated International Society of Nephrology/Renal Pathology Society (ISN/RPS) classification of lupus nephritis (2003)"
        title: "ISN/RPS 2003"
        columns: [Class, Name, Key]
        rows:
          - ["I", "Minimal mesangial", "Normal LM, mesangial deposits on IF"]
          - ["II", "Mesangial proliferative", "Mesangial hypercellularity on LM"]
          - ["III", "Focal", "< 50% of glomeruli"]
          - ["IV", "Diffuse", "≥ 50% of glomeruli (IV-S / IV-G)"]
          - ["V", "Membranous", "Subepithelial deposits"]
          - ["VI", "Advanced sclerosing", "≥ 90% globally sclerosed"]
        hide: [[2, 2], [3, 2], [4, 2], [5, 2]]
      - kind: update
        page: 228
        quote: "Abbreviated International Society of Nephrology/Renal Pathology Society (ISN/RPS) classification of lupus nephritis (2003)"
        text: "الـ revision بتاع 2018 شال الـ A و C و A/C والتقسيم IV-S/IV-G، وحط بدالهم **modified NIH activity and chronicity indices**. في الامتحان: إجابة الكتاب (2003)."
        ref: "Bajema et al., revised ISN/RPS lupus nephritis classification, Kidney Int 2018"
      - kind: aside
        tone: exam
        page: 228
        quote: "Class V lupus nephritis may occur in combination with class Ill or IV in which case both will be diagnosed."
        text: |
          نقط بيحبوها:
          - **Wire loops** من غير proliferation = برضه ==class IV==.
          - **Class V** ممكن تيجي مع III أو IV، وساعتها **الاتنين** يتكتبوا.
          - **IV-S** لو ≥50% من الـ involved glomeruli segmental، و **IV-G** لو global.
      - kind: check
        page: 230
        quote: "Lupus Glomerulonephritis Class III, with Moderate Activity (10% Fibrinoid Necrosis, 30% Crescents) and Early Chronicity (5% Global Sclerosis)."
        question: "Case 2 biopsy: subendothelial deposits and intracapillary leucocytes in 6 of 21 glomeruli, small crescents in 6. Class?"
        options:
          - "Class III"
          - "Class IV-S"
          - "Class II"
          - "Class V"
        answer: 0
        why:
          - "صح: endocapillary lesions و subendothelial deposits في أقل من 50% = ==class III== مع moderate activity."
          - "IV محتاج ≥50% من الـ glomeruli."
          - "Class II mesangial بس، من غير endocapillary lesions."
          - "Class V = subepithelial deposits."
      - kind: explain
        page: 234
        title: "Case 3: membranous"
        quote: "Primary Membranous Glomerulonephritis; Antiphospholipase Type 2 Receptor (aPLA2R) Associated."
        text: |
          بنت **22 سنة** بـ nephrotic syndrome، albumin 2.1، **serum anti-PLA2R سلبي**، و Doppler بيسأل عن **RVT**.

          الـ biopsy: **GBM thickening**، و ==IgG 3+== على الـ GBM، و **PLA2R** في الـ tissue موجب، و subepithelial deposits على الـ EM.

          التشخيص: ==primary membranous GN, anti-PLA2R associated==، ومعاه secondary FSGS و 30% IFTA.
      - kind: reveal
        page: 236
        quote: "Anti-PLA2R (−) PLA2R (+) PLA2R-mediated PMN (inactive)"
        prompt: "الـ serum anti-PLA2R سلبي والـ tissue PLA2R موجب. إزاي؟"
        answer: "ده **PLA2R-mediated PMN, inactive**. الـ antibody بيختفي من الدم الأول، والـ glomerular staining يفضل موجب **أسابيع لشهور**."
      - kind: explain
        page: 235
        title: "الـ anti-PLA2R: تشخيص ومتابعة"
        quote: "Anti-PLA2R antibody is about 80% sensitive and 100% specific for PMN"
        text: |
          - **70–80%** من الـ primary MN عندهم anti-PLA2R/THSD7A.
          - ==80% sensitive و 100% specific==.
          - ممكن يطلع **قبل الـ proteinuria بشهور**.
          - العالي = محتاج **immunosuppression أطول**، والعالي بعد العلاج = ==relapse==.
          - العالي وقت الـ transplant = **recurrence**.
          - **Immunologic remission** قبل **renal remission** بأسابيع لشهور.
      - kind: aside
        tone: analogy
        page: 236
        quote: "Disappearance of anti-PLA2R antibodies (immunologic remission) precedes renal remission (disappearance of proteinuria) by weeks to months."
        text: |
          الـ anti-PLA2R زي **الدخان**، والـ proteinuria زي **الحريقة**. الدخان بيطلع قبل ما تشوف النار، وبيروح قبل ما الرماد يبرد.

          فلو الـ antibody راح، استنّى: الـ proteinuria هتنزل بعده بأسابيع لشهور.
      - kind: explain
        page: 235
        title: "Secondary MN"
        quote: "Causes of membranous GN Infections. Malignancy (20% in patients >57, 4%<57). Autoimmune diseases. Alloimmune diseases. Drugs/toxins."
        text: |
          الأسباب: **infections**، **malignancy**، **autoimmune**، **alloimmune**، و **drugs/toxins**.

          والرقم المهم: الـ malignancy بتعمل ==20%== من الـ MN فوق **57 سنة**، و **4%** تحتها. علشان كده الكبير بـ MN لازم تدوّر على tumour.
      - kind: figure
        page: 237
        title: "الـ spikes"
        image: { file: neph/L08-membranous-spikes.webp, book: true }
        alt: "Silver stain at high power: black glomerular basement membranes with small perpendicular projections on their outer side (arrows), labelled subepithelial deposits."
        caption: "من الكتاب: الـ GBM بيطلع ==spikes== عموديين من برّه حوالين الـ subepithelial deposits. ده الـ membranous."
      - kind: figure
        page: 238
        quote: "The double contour forms due to synthesis of basement-membrane-like material between the endothelial cells and the deposits."
        title: "الـ double contour"
        image: { file: neph/L08-mpgn-tram-track.webp, book: true }
        alt: "Methenamine-silver stain: a hypercellular glomerulus with capillary walls showing two parallel black lines (arrows), labelled double contour, tram tracking."
        caption: "من الكتاب: ==tram-tracking==. الـ endothelium بيبني GBM جديد **تحت** الـ subendothelial deposits، فيبان خطين. Classic في MPGN type I و III."
      - kind: sort
        page: 239
        quote: "They can be also seen in lupus nephritis, cryoglobulinemia and some diseases in which subendothelial immune deposits are not demonstrated like TMA"
        prompt: "الـ double contour هنا جاي مع immune deposits ولا من غيرها؟"
        bins: ["With subendothelial immune deposits", "Without immune deposits"]
        cards:
          - { text: "Type I MPGN", bin: 0 }
          - { text: "Lupus nephritis", bin: 0 }
          - { text: "Cryoglobulinemia", bin: 0 }
          - { text: "TMA", bin: 1 }
          - { text: "Chronic transplant glomerulopathy", bin: 1 }
        why: "في الـ **TMA** والـ **transplant glomerulopathy** الـ endothelium هو اللي اتعوّر، فبيبني GBM جديد من غير ما يكون فيه deposits."
      - kind: try
        items: [neph.L08.063, neph.L08.089, neph.L08.077, neph.L08.095, neph.L08.097]
    recap:
      - "III < 50%، IV ≥ 50%، VI ≥ 90% sclerosed؛ V ممكن تيجي مع III أو IV."
      - "Anti-PLA2R: 80% sensitive، 100% specific؛ serum سلبي + tissue موجب = inactive."
      - "Malignancy في MN: 20% فوق 57 سنة."
      - "Spikes = subepithelial (membranous)، double contour = subendothelial أو endothelial injury."
