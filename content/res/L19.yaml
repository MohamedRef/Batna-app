- id: res.L19.025
  kind: card
  topic: concept
  front: Why do we need randomized controlled trials? Give the lecture's example.
  back: In the early 1980s newly introduced antiarrhythmics were highly successful at suppressing arrhythmias. Only when an
    RCT was performed was it realized that, although they suppressed arrhythmias, they actually increased mortality; by then
    at least 100,000 patients had been taking them («Deadly Medicine»).
  src:
    page: 28
    quote: |-
      Why do we need RANDOMIZED CONTROLLED TRIALS ?
      Deadly Medicine: Why tens of thousands of heart patients died in America's worst drug disaster (Thomas J. Moore)
      In the early 1980s newly introduced antiarrhythmics were found to be highly successful at suppressing arrhythmias.
      Not until a RCT was performed was it realized that, although these drugs suppressed arrhythmias, they actually increased mortality.
      By the time the results of this trial were published, at least 100,000 such patients had been taking these drugs.
  status: unverified
  tags: [high-yield]
- id: res.L19.026
  kind: case
  topic: concept
  stem: A 58-year-old woman visiting her GP about another matter asks about a cough she has had for 20 years, despite various
    treatments and two referrals to physicians.
  steps:
  - question: Which PubMed tool, designed for clinicians, did the GP use?
    options:
    - Clinical Queries
    - MeSH database
    - Cochrane Library
    - UpToDate
    answer: 0
    why: The GP searched PubMed using «Clinical Queries», a PubMed category designed for clinicians.
  - question: The search listed the most common causes. Which was NOT among them?
    options:
    - Gastro-oesophageal reflux
    - Postnasal drip
    - Asthma
    - Chronic bronchitis
    answer: 0
    why: The common causes were postnasal drip, asthma and chronic bronchitis. Reflux was a less common but possible cause
      (10% of cases).
  - question: What cured her cough after one week?
    options:
    - Antacids at night and raising the head of her bed
    - Asthma treatment again
    - A course of antibiotics
    - Referral to a chest physician
    answer: 0
    why: Treating the reflux (antacids at night, head of the bed raised) stopped a 20-year cough; asthma treatment had failed
      again.
  src:
    page: 30
    quote: |-
      A 58-year-old woman who was visiting her GP about another matter, said, as an aside: 'Can you do anything about a cough?' She had had a persistent cough for 20 years with various treatments but no cure. She had been referred twice to physicians.
      The GP searched PubMed, using 'Clinical Queries', which is a category of PubMed designed for clinicians. The search for persistent cough revealed that the most common causes of a persistent cough are:
      Postnasal drip
      Asthma
      Chronic bronchitis
      The GP thought the cough was most likely to be due to asthma, and prescribed appropriate treatment for asthma as a first line of treatment. The patient thought she had already tried that treatment and that it did not work but tried it again anyway, without success. However, the search also showed that gastro-oesophageal reflux is a less common but possible cause of persistent cough (10% of cases), which the GP had not known before. The GP therefore recommended the patient to take antacids at night and raise the head of her bed. After one week her cough disappeared for the first time in 20 years and has not come back since
  status: unverified
  tags: [high-yield]
- id: res.L19.027
  kind: card
  topic: concept
  front: What is the conclusion of the persistent cough case?
  back: EBM can help you find the information you need, whether or not you «should» already know it. Chest physicians might
    know that reflux causes chronic cough, but GPs did not necessarily know it.
  src:
    page: 31
    quote: |-
      How did EBM can help GPs?
      This case raises interesting questions of what doctors 'should' know.
      Although chest physicians might know this information, GPs did not necessarily know it.
      An anaesthetist said that after reading this information he had been treated for gastro-oesophageal reflux, which had cured a cough he had had for 30 years!
      Conclusion: EBM can help you find the information you need, whether or not you 'should' already know it.
  status: unverified
- id: res.L19.028
  kind: card
  topic: questions
  front: What is a background question, and how does it usually start?
  back: 'A question about general knowledge of a disorder, test or treatment, or an overview of an area of interest. It usually
    starts with a question root (what, why, when, how) plus a verb, e.g. «What causes a disorder?» Examples: the complications
    of diabetes, the causes of generalized oedema or CHF, the types of headache.'
  src:
    page: 34
    quote: |-
      (1) Background Questions
      General knowledge about the disorder, test, or treatments Or an overview of a certain area of interest.
      Usually starts with
      a question root (What , why, when , how)
      + a verb e.g. What causes a disorder?
      Example:
      What are the complications of diabetes?
      What are the causes of generalized oedema?
      What are the causes of CHF?
      What are the types of headache?
