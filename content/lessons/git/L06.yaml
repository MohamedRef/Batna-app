  - id: git.L06.lesson4
    title: "الـ UC: من الـ rectum ولفوق من غير ما يفوّت حتة"
    hook: "التهاب سطحي بس عنيد: بيبدأ من الـ rectum ويطلع لفوق، وأخطر حاجة فيه إنك تعرف النوبة شديدة ولا لأ."
    minutes: 10
    pages: [213, 222]
    topics: [uc-extent, uc-clinical]
    goals:
      - "ترسم الـ Montreal E1–E3 من دماغك (سؤال كتاب)"
      - "تعرف الحاجات اللي ممكن تلخبط الـ UC مع الـ Crohn"
      - "تقيّم شدة النوبة بالجدول"
    status: unverified
    steps:
      - kind: explain
        page: 213
        title: "الـ UC عكس الـ Crohn في كل حاجة تقريبًا"
        quote: "Inflammation in ulcerative colitis is limited to the mucosal layer of the colon. The rectum is virtually always involved, with inflammation extending proximally in a confluent fashion. The extent of proximal involvement is variable. A significant proportion of patients have disease confined to the rectum (ulcerative proctitis). Roughly one-third of patients have proctosigmoiditis, and the majority of patients have gross colitis only distal to the splenic flexure."
        text: |
          - الالتهاب في ==mucosal layer== بس، وفي الـ **colon** بس.
          - الـ **rectum** متصاب **virtually always**، والالتهاب بيطلع لفوق **confluent** (من غير skip).
          - البداية غالبًا **acute or subacute** (الـ Crohn insidious).

          التوزيع: جزء كبير **proctitis** بس، حوالي **تلت** proctosigmoiditis، والأغلبية تحت الـ **splenic flexure**، وحوالي **تلت** فوقها (extensive)، وكتير pancolitis.

          يعني لو حفظت الفروق دي (mucosal ضد transmural، confluent ضد skip، rectum دايمًا ضد rectum غالبًا سليم)، هتعرف تفرّق أغلب الحالات من المنظار والـ biopsy.
      - kind: reveal
        page: 213
        quote: "The rectum is virtually always involved, with inflammation extending"
        prompt: "ليه الـ UC بيبدأ من الـ rectum، وليه الالتهاب confluent من غير فراغات؟"
        answer: |
          الكتاب: الـ UC في الـ ==mucosal layer== بس، والـ **rectum virtually always involved**، والالتهاب بيطلع لفوق **confluent**. ونسبة كبيرة **proctitis** بس، وتقريبًا التلت **proctosigmoiditis**، وحوالي التلت بيعدّي الـ **splenic flexure** (extensive) وغالبًا **pancolitis**.

          التفسير المقبول (مش في الكتاب): السبب الحقيقي مش معروف، بس التشبيه اللي بيساعد: الـ UC زي بقعة بتتمد من نقطة البداية (الـ rectum) لفوق، مش نُقَط متفرقة زي الـ Crohn. وعلشان الالتهاب في الـ mucosa بس، مفيش fistula ولا stricture حقيقي غالبًا. والقاعدة العملية: لو الـ rectum سليم تمامًا في مريض مش بيتعالج، فكّر في Crohn قبل UC.
      - kind: figure
        page: 222
        quote: "Table 3: Montreal classification of UC:\n|  | Extent | Anatomy |\n|---|---|---|\n| E1 | Ulcerative proctitis | Involvement limited to the rectum (that is, proximal extent of inflammation is distal to the rectosigmoid junction) |\n| E2 | Left sided UC (distal UC) | Involvement limited to a proportion of the colorectum distal to the splenic flexure |\n| E3 | Extensive UC (pancolitis) | Involvement extends proximal to the splenic flexure |"
