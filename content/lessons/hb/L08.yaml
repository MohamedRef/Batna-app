      - kind: explain
        page: 132
        quote: "No progress despite Continued use of the Medication (Drug tolerance)"
        title: "إنزيمات عالية من غير أعراض"
        text: |
          **Asymptomatic elevation of liver enzymes** ليها مصيرين:

          - ==Drug tolerance==: no progress despite continued use. الكبد بيتعوّد. أمثلة: INH، phenytoin، chlorpromazine.
          - **Progression with continued use**: Aspartate aminotransferase (AST) & alanine aminotransferase (ALT) 3–5× upper limit of normal (ULN)، و may progress to hepatic failure.

          يعني ارتفاع الإنزيمات لوحده مش هو القصة كلها؛ المهم هو بيتقدّم ولا لأ.
      - kind: aside
        tone: joke
        page: 132
        quote: "No progress despite Continued use of the Medication (Drug tolerance)"
        text: |
          الـ **drug tolerance** زي ساكن جديد في وسط البلد: أول أسبوع متضايق من الزحمة والكلاكسات (enzymes طالعة)، وبعدين يتعوّد ويكمّل عادي. 🚕

          الكبد مع **INH، phenytoin، chlorpromazine** بيعمل كده.
      - kind: explain
        page: 133
        quote: "Acute Hepatocelluler Injury (Direct toxic reaction)\nCharacterized by:\n  Marked elevation in ALT and AST.\n  Normal or minimally elevated alkaline phosphatase.\n  Bilirubin variably increased → worse prognosis.\nComprise 1/3 of all cases of fulminant hepatic failure in the US:\n  20% due to Acetominophen.\n  12%-15% due to other drugs.\nAlcohol:\n  AST is always 2-3 times higher than ALT.\n  AST remains less than 300 IU.\n  ALT is almost always less than 100 IU.\nTowering elevation of ALT&AST (5000-10000 IU):\n  Drugs (acetaminophen).\n  Differential: Chemical toxins. Toxic Mushrooms. Shock liver.\n  Unusual with other causes of liver diseases including Viral Hepatitis."
        title: "الـ acute hepatocellular (direct toxic)"
        text: |
          - ==ALT and AST==: marked elevation.
          - ==Alkaline phosphatase (ALP)==: normal or minimally elevated، يعني R عالي (hepatocellular).
          - **Bilirubin**: variably increased، ولو عالي → worse prognosis (هتشوف السبب في آخر درس).
          - **fulminant hepatic failure (FHF) share**: مسؤول عن 1/3 من الـ fulminant hepatic failure في أمريكا: 20% acetaminophen و 12–15% other drugs.
