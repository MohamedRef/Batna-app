          - **السهم الملوّن** فوق: من الأخضر (2.5 kPa) للأحمر الغامق (75 kPa). الخطوط المتقطعة عند **7** و **9.5** و **12.5**، وفيه قطع في السهم قبل الـ 75 لأن المسافة لحد هناك طويلة.
