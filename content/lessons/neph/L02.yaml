        quote: "Screen twice annually for malnutrition using a validated assessment tool. Figure 45: Common symptoms, prevalence, and severity in people with CKD. Figure developed from findings from Fletcher et al717. To aid comparison of symptom severity scores across different outcome measures, all mean severity scores were converted to a 0-100 scale, where a higher score indicates greater severity. 5.4. Timing the initiation of dialysis Based on a composite assessment of person's symptoms, quality of life, patient preferences, level of GFR, and laboratory abnormalities."
        title: "G4–G5 والغسيل"
        text: |
          في G4–G5: اسأل عن الـ **uremic symptoms** كل زيارة، واعمل **malnutrition screen مرتين في السنة**. أشهر عَرَض: **fatigue (70%)**.

          قرار الغسيل ==composite==: أعراض، quality of life، رأي المريض، الـ GFR، والتحاليل. غالبًا الـ indications بتظهر عند ==GFR 5–10==.

          وخطط للـ **pre-emptive transplant** أو الـ **access** لما ==GFR < 20== أو kidney replacement therapy (KRT) risk > 40% في سنتين.

          التفسير المقبول (مش في الكتاب): بنخطط للـ access بدري (GFR < 20) **لأن** الـ fistula محتاجة شهور تنضج، ولو استنينا هيبدأ الغسيل بـ catheter وده خطر عدوى أكبر.
      - kind: explain
        page: 63
        quote: "Ask about uremic symptoms at each consultation using a standardized"
        title: "ليه نسأل عن الأعراض كل زيارة؟"
        text: |
          الكتاب: في G4–G5 اسأل عن الـ **uremic symptoms** كل زيارة بطريقة **standardized**، واعمل **malnutrition screen مرتين في السنة**. و Figure 45 بتوري أشهر الأعراض: **fatigue 70%**، poor mobility 56%، drowsiness و pain 53%، poor sleep 49%، sexual dysfunction 48%، leg swelling 45%، و shortness of breath و decreased appetite 42%.

          التفسير المقبول (مش في الكتاب): قرار الغسيل في ص 63 قائم على **الأعراض وجودة الحياة**، مش الرقم بس. فلو ماسألتش بانتظام، مش هتعرف إمتى الميزان مال. وسوء التغذية بييجي بالراحة من قلة الشهية والـ uremia، وبيموّت أكتر من أي حاجة تانية في المرحلة دي، علشان كده بيتعمله screen منتظم.
