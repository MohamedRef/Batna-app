            <text x="20" y="96" class="t-sm">recognition</text>
            <text x="20" y="120" class="t-sm t-bad">→ apoptosis</text>
            <text x="20" y="138" class="t-sm t-mut">negative selection</text>
            <rect x="170" y="32" width="150" height="120" rx="10" class="fg-acc"/>
            <text x="245" y="54" text-anchor="middle" class="t-b">Marrow · B</text>
            <text x="180" y="80" class="t-sm">Strong self binding</text>
            <text x="180" y="104" class="t-sm t-bad">→ killed, or</text>
            <text x="180" y="122" class="t-sm t-good">→ change receptor</text>
            <text x="180" y="138" class="t-sm t-good">specificity</text>
            <path d="M165 158 V190" class="fg-arrow-acc" stroke-width="2" marker-end="url(#L05a)"/>
            <text x="175" y="180" class="t-sm t-mut">escapees mature</text>
            <text x="165" y="212" text-anchor="middle" class="t-b t-acc">Peripheral (mature cells)</text>
            <rect x="10" y="222" width="150" height="130" rx="10" class="fg-good"/>
            <text x="85" y="244" text-anchor="middle" class="t-b">T cells</text>
            <text x="20" y="270" class="t-sm">1. Anergy</text>
            <text x="20" y="292" class="t-sm">2. Deletion (AICD)</text>
            <text x="20" y="314" class="t-sm">3. Suppression</text>
            <text x="32" y="330" class="t-sm">by Tregs</text>
            <rect x="170" y="222" width="150" height="130" rx="10" class="fg-good"/>
            <text x="245" y="244" text-anchor="middle" class="t-b">B cells</text>
            <text x="180" y="270" class="t-sm">Anergy after high</text>
            <text x="180" y="288" class="t-sm">concentrations of</text>
            <text x="180" y="306" class="t-sm">self antigen</text>
          </svg>
      - kind: explain
        page: 79
        title: "العاملين الأساسيين"
        quote: "The inheritance of susceptibility genes which may contribute to failure of self tolerance."
        text: |
          الـ **autoimmunity** = immune response ضد الـ **self antigens**، أو autologous. وأهم عاملين:

          1. وراثة ==susceptibility genes== بتساعد إن الـ self tolerance تفشل.
          2. **Environmental triggers** زي الـ **infections** بتنشّط الـ self-reactive lymphocytes.

          يعني الجينات بتجهّز الأرض والعدوى بتولّع الكبريت. التفسير المقبول (مش في الكتاب): ده سبب إن توأم متطابق ممكن يجيله المرض وأخوه لأ، رغم إن جيناتهم واحدة (هتشوف التوائم في صفحة 80).
      - kind: explain
        page: 79
        title: "ليه خطين دفاع مش واحد؟"
        quote: "Immunologic tolerance to different self antigens may be induced when developing lymphocytes encounter these antigens in the generative lymphoid organs, called central tolerance, or when mature lymphocytes encounter self antigens in peripheral tissues, called peripheral tolerance"
        text: |
          الكتاب بيقسم الـ tolerance حسب **فين** الـ lymphocyte قابلت الـ self antigen: في الـ **generative organs** وهي لسه صغيرة (==central==)، ولا في الأنسجة وهي ناضجة (==peripheral==).

          التفسير المقبول (مش في الكتاب): ليه محتاجين الاتنين؟ عشان الـ thymus والـ bone marrow مش بيشوفوا **كل** الـ self antigens. فيه antigens موجودة بس في أنسجة معينة أو بتظهر في سن معين. فالفلتر الأول بيشيل أخطر الخلايا، وأي خلية عدّت منه بيستناها الفلتر التاني في الشارع.

          يعني الـ autoimmunity محتاجة **الاتنين يقعوا**، وده سبب إنها مش بتحصل كل يوم رغم إن الخلايا الـ self-reactive موجودة عند كل الناس.
      - kind: try
        items: [rheum.L05.001, rheum.L05.005, rheum.L05.007, rheum.L05.009, rheum.L05.011]
    recap:
      - "Activation = immunogenic، tolerance = tolerogenic، ignorance = ولا رد فعل."
      - "الـ microbes immunogenic؛ الـ self antigens يا tolerogenic يا ignored."
      - "Central في الـ thymus والـ bone marrow؛ peripheral في الأنسجة للخلايا الناضجة."
      - "Autoimmunity = susceptibility genes + environmental triggers زي العدوى."
    practice: [rheum.L05.001, rheum.L05.002, rheum.L05.003, rheum.L05.004, rheum.L05.005, rheum.L05.006, rheum.L05.007, rheum.L05.008, rheum.L05.009, rheum.L05.010, rheum.L05.011]
  # ------------------------------------------------------------------
  - id: rheum.L05.lesson3
    title: "الـ T والـ B: مين بيتقتل ومين بيتقفل"
    hook: "خلية T شافت self antigen من غير ختم النسر: هتموت؟ هتنام؟ ولا حد هيكبتها؟"
    minutes: 9
    pages: [79, 82]
    topics: [t-tolerance, b-tolerance]
    goals:
      - "تشرح الـ negative selection في الـ thymus"
      - "تعرّف الـ anergy (سؤال كتاب) وتعدّ باقي الـ peripheral mechanisms"
      - "تفرّق الـ B cell tolerance عن الـ T"
    status: unverified
    steps:
      - kind: explain
        page: 79
        title: "Central T tolerance"
        quote: "This process is also termed negative selection and it is the principal mechanism of central tolerance."
        text: |
          الـ **immature T cell** في الـ **thymus** لو شافت self antigen بـ **high avidity** ← بتموت بـ **apoptosis**.

          ده اسمه ==negative selection==، وهو **the principal mechanism of central tolerance**.

          التفسير المقبول (مش في الكتاب): ليه الـ avidity العالية بالذات؟ عشان الخلية اللي بتمسك الـ self antigen جامد هي الأخطر لو خرجت. والخلايا اللي بتمسكه ضعيف بتعدّي، وده سبب إن الـ central tolerance لوحدها مش كفاية، ومحتاجين الـ peripheral بعدها.
      - kind: explain
        page: 79
        title: "Peripheral T tolerance: تلات طرق"
        quote: "Peripheral tolerance is induced when mature T cells recognize self antigens in peripheral tissues leading to functional inactivation (anergy) or death, or when the self reactive lymphocytes are suppressed by regulatory T cells."
        text: |
          الـ mature T cell لما تشوف self antigen في الأنسجة، الكتاب بيدّيها تلات مصاير:

          1. ==Anergy==: تتقفل وهي عايشة (functional inactivation).
          2. **Death**: تموت (deletion).
          3. **Suppression**: خلية تانية، الـ **regulatory T cell**، تكبتها.

          التفسير المقبول (مش في الكتاب): ليه تلاتة؟ عشان كل واحدة بتغطي ثغرة في التانية. الـ anergy سريعة بس ممكن ترجع، فالـ deletion بتقفل الملف نهائي. والاتنين بيشتغلوا على الخلية اللي شافت الـ antigen بس، أما الـ Tregs فبتكبت أي خلية قريبة حتى لو ماحدش لحق يقفلها.
      - kind: explain
        page: 79
        title: "Anergy: من غير signal 2 مفيش شغل"
        quote: "Anergy is the functional inactivation of T lymphocytes that occurs when these cells recognize antigens with out adequate levels of the co stimulators that are needed for T cell activation."
        text: |
          الـ ==anergy== = **functional inactivation** للـ T cell لما تشوف الـ antigen **من غير costimulators كفاية**.

          الـ T cell محتاجة إشارتين: **signal 1** هو الـ antigen، و **signal 2** هو الـ costimulator. إشارة واحدة لوحدها = الخلية تتقفل.

          وكمان ممكن تحصل لما الـ T cell تستخدم **inhibitory receptors** تشوف بيها الـ costimulators.

          التفسير المقبول (مش في الكتاب): ليه الجسم عامل الشرط ده؟ عشان الـ costimulators بتظهر لما يكون فيه خطر، فالـ T cell بتتأكد إن الـ antigen ده جاي مع ميكروب قبل ما تشتغل. يعني الإشارتين زي مفتاحين لخزنة واحدة: مفتاح واحد مابيفتحش.
      - kind: aside
        tone: joke
        page: 79
        quote: "Anergy is the functional inactivation of T lymphocytes that occurs when these cells recognize antigens with out adequate levels of the co stimulators that are needed for T cell activation."
        text: |
          الـ T cell زي موظف حكومي: لو جاله الطلب، ده **signal 1**، من غير ختم النسر، ده **signal 2**، مش بس مش هيمضي، ده هيقفل الشباك خالص. ده الـ **anergy**.
      - kind: reveal
        page: 79
        quote: "Anergy is the functional inactivation of T lymphocytes that occurs when these cells recognize antigens with out adequate levels of the co stimulators that are needed for T cell activation."
        prompt: "ليه الـ signal 2 هو اللي بيحمي الـ self؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ costimulators بتظهر على الـ antigen-presenting cells غالبًا لما يكون فيه **ميكروب أو التهاب**. في نسيج هادي، الـ self antigen بيتعرض **من غير** signal 2، فالـ T cell اللي تشوفه تتقفل (anergy).

          يعني signal 2 هو الطريقة اللي الجسم بيقول بيها "ده خطر حقيقي". ولهنا تفهم الـ take-home message في صفحة 82: العدوى بتعمل ==aberrant expression of costimulators==، فالـ self antigen يتعرض **مع** signal 2 بالغلط، والخلية اللي كان المفروض تنام تتنشّط.
      - kind: figure
        page: 79
        quote: "Anergy is the functional inactivation of T lymphocytes that occurs when these cells recognize antigens with out adequate levels of the co stimulators that are needed for T cell activation."
        title: "إشارتين ولا واحدة؟"
        alt: "Three rows, each a T cell facing an antigen-presenting cell. Row one: antigen plus costimulator, two signals, the T cell is activated. Row two: antigen without costimulator, one signal, the T cell becomes anergic. Row three: antigen with costimulator read through an inhibitory receptor, the T cell becomes anergic."
        caption: "signal 1 لوحده = ==anergy==. ونفس الـ costimulator لو اتقرا بـ inhibitory receptor بيقفل الخلية برضه (صفحة 82)."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L05c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fg-head"/></marker></defs>
