  # ------------------------------------------------------------------
  - id: neph.L13.lesson1
    title: "السكر والكلية: الحكاية بتبدأ بـ hyperfiltration"
    hook: "الكلية في الأول بتشتغل زيادة عن اللزوم، وده بالظبط اللي بيبوّظها."
    minutes: 8
    pages: [425, 427]
    topics: [epidemiology, definition, pathogenesis]
    goals:
      - "تحفظ أرقام الـ DKD"
      - "تفرّق بين DKD و diabetic nephropathy وتعرف التعريف بالأرقام"
      - "تشرح الـ hyperfiltration والطرق الأربعة من الـ hyperglycemia للـ DKD"
    status: unverified
    steps:
      - kind: explain
        page: 425
        title: "قد إيه المشكلة كبيرة؟"
        quote: "DKD is the leading cause of chronic kidney disease and end-stage kidney disease, accounting for 50% of cases."
        text: |
          - في 2021 كان فيه **537 million** مريض سكر (**11%** من العالم)، ومتوقع **783 million** سنة 2045.
          - **20-50%** من الـ T2DM هيعملوا DKD.
          - الـ ==DKD== هو **أول سبب** للـ CKD والـ ESKD، **50%** من الحالات.
          - وبيعلّي الـ **cardiovascular morbidity and mortality**.

          على مدى العمر: **نص** الـ T2DM و **تلت** الـ T1DM.
      - kind: explain
        page: 426
        title: "DKD ولا DN؟"
        quote: "Whereas the term DN is exclusively reserved for the histologic diagnosis of glomerular changes observed on biopsy."
        text: |
          - **DKD** (KDIGO): **clinical diagnosis**، يعني CKD في واحد عنده سكر.
          - **DN** (diabetic nephropathy): **histologic diagnosis** من الـ biopsy بس.

          التعريف بالأرقام: ==ACR ≥30 mg/g== و/أو **eGFR <60** لمدة **3 شهور على الأقل** في مريض سكر.
      - kind: check
        page: 426
        quote: "(albumin-to-creatine ratio ≥ 30 mg/g) and/or low estimated glomerular filtration rate (eGFR < 60 mL/min/1.73 m2) in a person with diabetes."
        question: "A diabetic has eGFR 75 and ACR 45 mg/g on samples 4 months apart. Biopsy not done. What do you call it?"
        options:
          - "Diabetic kidney disease"
          - "Diabetic nephropathy"
          - "Not DKD, because eGFR is above 60"
          - "Not DKD until a biopsy is done"
        answer: 0
        why:
          - "صح: ACR ≥30 لمدة أكتر من 3 شهور كفاية، والـ eGFR مش لازم يكون واطي (and/or)."
          - "الـ DN محتاجة biopsy."
          - "الشرط and/or، فالـ albuminuria لوحدها كفاية."
          - "الـ DKD تشخيص clinical."
      - kind: explain
        page: 426
        title: "Hyperfiltration"
        quote: "defined as a GFR from 120 to 180 mL/min/173 m2, or an absolute increase in GFR of more than two standard deviations"
        text: |
          الـ ==hyperfiltration== = GFR **120-180** mL/min/1.73 m²، أو أكتر من **2 SD** فوق المتوسط لنفس السن.

          - سببه **increased intraglomerular capillary pressure**.
          - بيحصل خلال **1-5 سنين** من الـ T1DM.
          - موجود في **70%** من الـ T1DM و **50%** من الـ T2DM.
          - بيتقال إنه بيمهّد لـ **irreversible nephron damage**.
      - kind: reveal
        page: 426
        quote: "Hyperfiltration is thought to be a manifestation of increased intraglomerular capillary pressure"
        prompt: "ليه GFR عالي يبقى حاجة وحشة؟ مش الكلية شغالة أحسن؟"
        answer: |
          الـ GFR العالي جاي من **increased intraglomerular capillary pressure** (ضغط عالي جوه الـ glomerulus)، مش من nephrons زيادة. زي ما تشغّل موتور على أقصى سرعة طول الوقت: الشغل كتير بس بيستهلك نفسه.

          الضغط ده بيعمل **shear stress** على الـ glomerulus، فيحصل **mesangial expansion** و **podocyte loss** وفي الآخر **sclerosis**.
      - kind: figure
        page: 427
        quote: "Renal hemodynamic changes Activation of RAAS Ischemia and Inflammation Oxidative stress"
        title: "أربع طرق من السكر للكلية"
        alt: "Hyperglycemia at the top splits into four pathways: renal hemodynamic changes (IGF-1, TGF-beta, SGLT2) leading to efferent constriction, glomerular hypertension and sclerosis; RAAS activation (Ang II, aldosterone, ROS) leading to podocyte injury and proteinuria; ischemia and inflammation (AGEs, TNF-alpha, NF-kB); and oxidative stress (JAK/STAT, VEGF, MCP-1) leading to tubulointerstitial fibrosis and mesangial expansion. All converge on diabetic kidney disease."
        caption: "التلاتة اللي في النص (==RAAS== والـ inflammation والـ oxidative stress) بيوصلوا للـ podocyte والـ fibrosis، والـ hemodynamic بيوصل للـ glomerular hypertension."
        svg: |
          <svg viewBox="0 0 330 380" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L13a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="105" y="8" width="120" height="32" rx="16" class="fg-acc"/>
            <text x="165" y="29" text-anchor="middle" class="t-sm t-b">Hyperglycemia</text>
            <path d="M165 40 V56 M20 56 H310" class="fg-arrow"/>
            <rect x="10" y="64" width="150" height="62" rx="8" class="fg-box"/>
            <text x="85" y="82" text-anchor="middle" class="t-sm t-b">Hemodynamic</text>
            <text x="85" y="98" text-anchor="middle" class="t-sm">IGF-1, TGF-β, VEGF</text>
            <text x="85" y="114" text-anchor="middle" class="t-sm">glucagon, ET-1, SGLT2</text>
            <rect x="170" y="64" width="150" height="62" rx="8" class="fg-box"/>
            <text x="245" y="82" text-anchor="middle" class="t-sm t-b">RAAS activation</text>
            <text x="245" y="98" text-anchor="middle" class="t-sm">Ang II, aldosterone</text>
            <text x="245" y="114" text-anchor="middle" class="t-sm">ROS, TGF-β</text>
            <rect x="10" y="134" width="150" height="62" rx="8" class="fg-box"/>
            <text x="85" y="152" text-anchor="middle" class="t-sm t-b">Ischemia, inflammation</text>
            <text x="85" y="168" text-anchor="middle" class="t-sm">AGEs, TNF-α, NF-κB</text>
            <rect x="170" y="134" width="150" height="62" rx="8" class="fg-box"/>
            <text x="245" y="152" text-anchor="middle" class="t-sm t-b">Oxidative stress</text>
            <text x="245" y="168" text-anchor="middle" class="t-sm">JAK/STAT, VEGF, MCP-1</text>
            <path d="M85 196 V214" class="fg-arrow" marker-end="url(#L13a)"/>
            <path d="M245 196 V214" class="fg-arrow" marker-end="url(#L13a)"/>
            <rect x="10" y="218" width="150" height="62" rx="8" class="fg-acc"/>
            <text x="85" y="236" text-anchor="middle" class="t-sm">Efferent constriction</text>
            <text x="85" y="252" text-anchor="middle" class="t-sm">glomerular hypertension</text>
            <text x="85" y="268" text-anchor="middle" class="t-sm">hypertrophy, sclerosis</text>
            <rect x="170" y="218" width="150" height="62" rx="8" class="fg-acc"/>
            <text x="245" y="236" text-anchor="middle" class="t-sm">Podocyte injury, proteinuria</text>
            <text x="245" y="252" text-anchor="middle" class="t-sm">tubulointerstitial fibrosis</text>
            <text x="245" y="268" text-anchor="middle" class="t-sm">mesangial expansion</text>
            <path d="M85 280 L150 324" class="fg-arrow-bad" marker-end="url(#L13a)"/>
            <path d="M245 280 L180 324" class="fg-arrow-bad" marker-end="url(#L13a)"/>
            <rect x="75" y="328" width="180" height="40" rx="10" class="fg-bad"/>
            <text x="165" y="353" text-anchor="middle" class="t-sm t-bad t-b">Diabetic kidney disease</text>
          </svg>
      - kind: order
        page: 427
        quote: "Glucose load on kidney Tubule reabsorption NaCl to distal tubule Initial Glomerular hyperfilteration Sheer Stress on glomerulus"
        prompt: "رتّب سلسلة الـ hemodynamics في الشكل التاني (ص 427):"
        steps:
          - "More glucose load on the kidney"
          - "More tubular reabsorption"
          - "Less NaCl to the distal tubule"
          - "Initial glomerular hyperfiltration"
          - "Shear stress on the glomerulus"
        why: "الـ proximal tubule بيمص glucose و Na مع بعض، فالـ NaCl اللي بيوصل للـ macula densa بيقل، والـ glomerulus يفتكر إن الـ GFR واطي فيعليه. ده نفس المكان اللي الـ SGLT2 inhibitors بتشتغل فيه."
      - kind: aside
        tone: joke
        text: "الكلية في أول السكر زي الموظف الجديد المتحمس: بيشتغل 150% أول سنتين، وبعد 15 سنة تلاقيه عامل burnout وماسك ورقة proteinuria."
      - kind: try
        items: [neph.L13.004, neph.L13.007, neph.L13.009, neph.L13.010, neph.L13.013]
    recap:
      - "DKD = أول سبب للـ ESKD (50%)، و20-50% من الـ T2DM."
      - "DKD = clinical (ACR ≥30 و/أو eGFR <60 لـ 3 شهور)، DN = histologic."
      - "Hyperfiltration: GFR 120-180، من ضغط جوه الـ glomerulus، 70% T1DM و50% T2DM."
      - "أربع طرق: hemodynamic، RAAS، ischemia/inflammation، oxidative stress."
    practice: [neph.L13.001, neph.L13.002, neph.L13.003, neph.L13.004, neph.L13.005, neph.L13.006, neph.L13.007, neph.L13.008, neph.L13.009, neph.L13.010, neph.L13.011, neph.L13.012, neph.L13.013, neph.L13.014, neph.L13.015, neph.L13.016, neph.L13.105, neph.L13.106]
