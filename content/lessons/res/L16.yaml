  - kind: check
    page: 18
    quote: Extreme observations would have Z-scores over 3 or under -3 and should be investigated as potential outliers.
    question: A patient's serum sodium has Z = +3.3 against the lab's reference group. What do you do first?
    options:
    - Investigate it as a potential outlier (re-check the sample and the entry)
    - 'Ignore it: it is ordinary'
    - Delete it from the data
    - Call it unusual but not extreme
    answer: 0
    why:
    - 'صح: فوق 3 = extreme، والسلايد بيقول investigate as potential outlier. يمكن الـ sample اتلوث، أو الرقم اتكتب غلط، أو
      هو فعلًا عالي.'
    - الـ ordinary بين −2 و+2.
    - الـ outlier بنحقق فيه، مش بنمسحه على طول.
    - الـ unusual من 2 لـ 3؛ 3.3 بعدها.
  - kind: explain
    page: 22
    quote: The standard score, or Z-score, represents the number of standard deviations a random variable X falls away from
      the mean.
    title: ليه الـ Z مفيد؟ المقارنة
    text: |-
      الـ Z بيحوّل أي قيمة لـ **نفس المقياس** (الـ SD)، فتقدر تقارن حاجات مختلفة:

      - علي: 70 في امتحان (mean 60، SD 5) ← **Z = +2**.
      - منى: 80 في امتحان تاني (mean 70، SD 10) ← **Z = +1**.

      علي **أحسن** بالنسبة لدفعته، مع إن درجة منى الخام أعلى.
  - kind: aside
    page: 18
    quote: Unusual observations would have a Z-score over 2 or under -2.
    tone: tip
    text: |-
      هتقابل كمان **1.96** في الـ hypothesis testing: ده الحد الدقيق للـ 95% (two-sided). المحاضرة دي بتقرّبه لـ **2**، فعند السؤال عن «unusual» جاوب بـ **2** و**3** زي السلايد.
