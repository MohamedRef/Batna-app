# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: new
  ar_eg: لو دوست على «ص» رقم الصفحة في أي حتة، بتفتحلك صفحة الكتاب، فيها سطر منها والمحاضرة بتاعتها، وتقدر تذاكر الصفحة دي لوحدها
  en: Tapping any "ص" page chip opens that book page, with a short quote, its lecture, and a session on just that page
