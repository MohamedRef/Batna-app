          - "JAK or SYK activated"
          - "STAT / MAPK phosphorylated"
          - "Move to nucleus, gene transcription"
          - "microRNAs regulate mRNA"
          - "Protein released or shown on membrane"
        why: "ده مسار صفحة 13. الـ Janus kinase (JAK) هو اللي الـ JAK inhibitors (tofacitinib مثلًا) بتقفله، هتقابله في محاضرة الـ RA."
      - kind: table
        page: 13
        quote: "Major cytokines secreted by macrophages\n| Cytokine | Actions |\n|---|---|\n| Interleukin-1 | Costimulator of Th2 cells; Stimulates acute-phase response |\n| Tumor necrosis factor-α | Cytotoxic; Stimulates T cell growth; Stimulates acute-phase response; Triggers inflammation |\n| Interleukin-6 | Promotes B cell differentiation; Stimulates acute-phase response |\n| Interleukin-12 | Costimulator of Th1 cells |\n| Interleukin-18 | Promotes IFN-γ production by Th1 cells |"
        title: "الـ macrophage بيطلّع إيه؟"
