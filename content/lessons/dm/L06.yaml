      - kind: explain
        page: 74
        title: "ليه الجرعات والآثار دي؟"
        quote: "Better GI absorption; administered twice per day."
        text: |
          الكتاب بيقول الـ **pregabalin** ليه ==better GI absorption== وبيتاخد **مرتين**، والـ **gabapentin** لازم **tds** و **slow titration**.

          التفسير المقبول (مش في الكتاب): امتصاص الـ gabapentin من الأمعاء بيتشبّع، كل ما تكبّر الجرعة الواحدة الجسم بيمتص نسبة أقل، فبتقسمها على 3 مرات. والاتنين بيهدّوا الأعصاب في المخ كمان، فلازم تطلع بالجرعة بالراحة عشان الـ **dizziness** والـ **sedation** ما يوقعوش العيان، خصوصًا الكبير اللي ممكن يقع ويتكسر.

          والـ **duloxetine** (SNRI) بيقوّي المسارات اللي بتنزل من المخ وتقفل باب الألم في الـ spinal cord. الـ serotonin الزيادة في المعدة هو اللي بيعمل الـ **nausea**، وده ليه الجرعة العالية آثارها أكتر.
