  - id: neph.L11.133
    kind: card
    topic: dialysis-htn
    front: What did the CHIPS trial (tight diastolic 85 vs less tight 100 mm Hg) show?
    back: Tight control reduced severe hypertension (>160/110) but did not significantly change adverse pregnancy outcomes.
    src: { page: 377, quote: "that the tight BP group had less incidence of severe hypertension (BP>160/110mm Hg), but the risk of adverse pregnancy outcomes was not significant. (74) A recent multicenter randomized clinical trial, the chronic hypertension and pregnancy trial, evaluated the effect of BP control<140/90mm Hg on adverse pregnancy outcomes in women in the general population at the gestational age of 23 weeks or less. Achieving a BP of<140/90mm Hg was associated with lower adverse pregnancy outcomes (30.2%) in comparison with the control group (37.0%) (RR, 0.82; 95% CI, 0.74-0.92). (74) Based on these trials in the general population, we recommend to attain a BP goal of<140/90mm Hg during pregnancy in women on maintenance dialysis." }
    status: unverified
