        page: 145
        title: "الهدف والخطوط الأربعة"
        quote: "Goal: Cardiorenal Risk Reduction in High-Risk Patients with Type 2 Diabetes in addition to comprehensive CV risk management."
        text: |
          الهدف: ==Cardiorenal risk reduction== فوق الـ cardiovascular (CV) risk management الكامل.

          1. **Lifestyle modification**
          2. **Glycemic control**
          3. **Blood pressure (BP) control**
          4. **Control of dyslipidemia**

          ليه **cardio**renal مش renal بس؟ التفسير المقبول (مش في الكتاب): عيان السكر مع CKD احتمال يموت بـ heart attack أو stroke أكبر بكتير من احتمال إنه يوصل للـ dialysis، عشان كده كل خط من الأربعة بيحمي القلب والكلية في نفس الوقت.
      - kind: figure
        page: 145
        quote: "Nutrition\n  1. For people with non-dialysis-dependent DKD, dietary protein intake should be ~0.8 g/kg body weight per day (the recommended daily allowance)\n  2. For patients on dialysis, higher levels of dietary protein intake should be considered since malnutrition is a significant problem in some dialysis patients.\n  3. Restriction of dietary sodium (to <2,300 mg/day) may be useful to control blood pressure and reduce cardiovascular risk.\n  4. Recommendations for dietary sodium and potassium intake should be individualized based on comorbid conditions, medication use, blood pressure, and laboratory data."
