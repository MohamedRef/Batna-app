  - id: rheum.L07.lesson2
    title: "الـ classical pathway: C1 بيصحى"
    hook: "بوكيه ورد بست وردات لازم يلمس antibody في أكتر من مكان عشان يصحى، وبعدين يقطع C4 و C2 ويبني أول إنزيم."
    minutes: 8
    pages: [108, 110]
    topics: [classical]
    goals:
      - "تعرف الـ classical pathway بيبدأ إزاي وليه هو حلقة الوصل"
      - "تشرح الـ C1 complex"
      - "ترتّب الطريق لحد الـ C3 convertase وتعرف وظيفة كل fragment"
    status: unverified
    steps:
      - kind: explain
        page: 109
        title: "البداية"
        quote: "The classical pathway is initiated primarily by the binding of C1q to antibody: antigen complexes, during an adaptive immune response, Or by the binding of C1q, directly to the pathogen surface (innate immunity). Thus, a key link between the effect or mechanisms of innate and adaptive immunity exists."
        text: |
          الـ ==C1q== بيبدأ الطريق بطريقتين:
          - يمسك **antigen–antibody complexes**، وده جزء من الـ **adaptive** response.
          - أو يمسك **سطح الميكروب مباشرة**، وده **innate**.

          علشان كده الـ classical pathway **حلقة وصل** بين الـ innate والـ adaptive.
      - kind: reveal
        page: 109
        quote: "Thus, a key link between the effector mechanisms of innate and adaptive immunity exists."
        prompt: "الـ antibody نفسه مش بيقتل البكتيريا. إزاي الـ classical pathway بيحوّل الـ antibody لسلاح؟"
        answer: |
          الـ antibody بيمسك الميكروب بطرفينه فوق، و **الـ C1q بيمسك رجله**. ساعتها الـ cascade يشتغل على **سطح الميكروب ده بالذات**: C3b يغطيه (opsonization)، والـ MAC يخرّمه.

          يعني الـ **adaptive** بيقول "ده العدو"، والـ complement (جزء من الـ **innate**) بينفّذ. وده معنى الـ ==key link== اللي الكتاب بيتكلم عنه، ومعنى الاسم نفسه: الـ complement **بيكمّل** شغل الـ antibody.
      - kind: explain
        page: 108
        title: "الـ C1 complex"
        quote: "C1q is composed of six identical subunits with globular heads and long collagen-like tails."
        text: |
          الـ **C1** = **C1q + C1r + C1s**.

          - الـ **C1q** فيه **6 subunits** متشابهة، ليها **globular heads** و **collagen-like tails**.
          - الديول بتمسك **2 C1r و 2 C1s**.
          - لما الرؤوس تمسك الـ Ig أو الميكروب ← **C1r** يتغيّر شكله ويقطع ويشغّل ==C1s==، اللي اسمه كمان C1 esterase.

          يعني الـ C1 ماكينة من تلات تروس: **C1q** الإيد اللي بتحس، و **C1r** الزرار، و **C1s** السكينة اللي بتقطع C4 و C2. ولما تفتكر الترتيب ده، أي سؤال عن مين بيقطع مين يبقى سهل.
      - kind: aside
        tone: analogy
        page: 108
        quote: "Classical Pathway\n  The first protein in the classical pathway of complement activation is C1, which is a complex of C1q, C1r, and C1s.\n  C1q is composed of six identical subunits with globular heads and long collagen-like tails.\n  The tails combine to bind to two molecules each of C1r and C1s, forming the C1 complex.\n  The heads can bind to the constant regions of immunoglobulin molecules or directly to the pathogen surface causing a conformational change in C1r, which then cleaves and activates the C1s zymogen (C1estrase)."
        text: |
          تخيّل **C1q** بوكيه ورد بست وردات. وردة واحدة لو لمست antibody مش كفاية؛ لازم **أكتر من راس** يمسكوا علشان الساق تتلوي وتصحّي **C1r**، و C1r يصحّي **C1s**.
      - kind: figure
        page: 110
        quote: "Binds directly to pathogen surfaces or indirectly to antibody bound"
        title: "الـ classical pathway في سطرين"
        alt: "Flow drawing of the classical pathway. Two antibodies on a pathogen are bound by the heads of C1q. C1q activates C1r, which activates C1s. C1s cleaves C4 into C4a, released, and C4b, which binds the surface. C1s then cleaves C2 bound to C4b; the small piece leaves and C4b2b stays as the C3 convertase."
        caption: "C1q يمسك أكتر من antibody ← C1r ← ==C1s== يقطع C4 ثم C2 ← **C4b2b** = الـ C3 convertase على سطح الميكروب."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L07c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fg-head"/></marker></defs>
