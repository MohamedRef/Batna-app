  - id: hem.L01.lesson2
    title: "الـ stem cell ومصنعه: النخاع من جوّه"
    hook: "خلية واحدة بتعمل نسخة من نفسها وفي نفس الوقت تطلّع كل خلايا الدم طول عمرك. والنخاع عامل لها بيت فيه velcro."
    minutes: 8
    pages: [3, 5]
    topics: [stem-cells, myelopoiesis, microenvironment]
    goals:
      - "تعرف قدرات الـ stem cell الثلاثة"
      - "تفرّق الـ B cells (بتنضج في النخاع) من الـ T cells (في الـ thymus)"
      - "تفهم الـ CFU-GEMM ودور الـ microenvironment والـ CAMs"
    status: unverified
    steps:
      - kind: explain
        page: 3
        title: "الـ pluripotential stem cell"
        quote: "These cells have the capacity for self-renewal as well as proliferation and differentiation into committed progenitor cells."
        text: |
          أول خطوة في السلسلة هي الـ ==pluripotential stem cell==. هي اللي شايلة حِمل تصنيع **كل** خلايا الدم طول العمر.

          عندها 3 قدرات:
          - **Self-renewal**: تعمل نسخة من نفسها فما تخلصش.
          - **Proliferation**: تتكاثر.
          - **Differentiation**: تتحول لـ ==committed progenitors==، وكل مجموعة منهم مكتوب لها تبقى cell line معينة.
      - kind: aside
        tone: analogy
        page: 3
        quote: "Stem cells carry out the ultimate burden of generating multi-lineage mature blood cells over the life time of the organism."
        text: "الـ stem cell زي الست اللي عندها **عجينة أم** للعيش: كل مرة تاخد حتة تخبزها (differentiation) وتسيب حتة تكبر تاني (self-renewal). لو خبزت العجينة كلها، خلاص مفيش عيش بكرة."
      - kind: reveal
        page: 3
        quote: "These cells have the capacity for self-renewal as well as proliferation and differentiation"
        prompt: "ليه الـ self-renewal أهم قدرة في الـ stem cell؟"
        answer: "من غير **self-renewal** الـ stem cells هتخلص وهي بتتمايز، والنخاع يفضى. هي اللي بتخلّي مصدر صغير يكفي **طول العمر**، وهي نفس الخاصية اللي بتخلي الـ bone marrow transplant ينفع."
      - kind: figure
        page: 3
        quote: "GM-CSF"
        title: "مين بيزق كل سهم؟ (شكل الكتاب ص 3)"
        alt: "A central pluripotent stem cell. Arrows: EPO to red cells; TPO and IL-11 to megakaryocyte and platelets; IL-7 to a lymphoid cell that gives T lymphocytes and, with IL-6, B lymphocytes; GM-CSF to a myeloid cell that gives monocytes with M-CSF, neutrophils with G-CSF, basophils with IL-3 and eosinophils with IL-5."
        caption: "كل سهم عليه **growth factor**. احفظ اللي في الكتاب: ==EPO== للأحمر، **TPO + IL-11** للـ platelets، **IL-7** للـ lymphoid، **GM-CSF** للـ myeloid، وبعدين **M-CSF** monocyte و **G-CSF** neutrophil و **IL-3** basophil و **IL-5** eosinophil، و **IL-6** للـ B cell."
        svg: |
          <svg viewBox="0 0 330 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="h01c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
