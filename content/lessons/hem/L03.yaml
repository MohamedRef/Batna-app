          عشان كده متابعة الـ DF فيها **عيون وودان وطول**. وليه Yersinia؟ التفسير المقبول (مش في الكتاب): البكتيريا دي بتستخدم الـ DF المربوط بالحديد كمصدر حديد ليها.
