      - kind: explain
        page: 289
        title: "المية بالأرقام"
        text: |
          ليه المية أهم علاج؟ افتكر الـ **third spacing** من الدرس التالت: البنكرياس بيسرّب سوائل، فالدم يتركّز والبنكرياس نفسه ياخد دم أقل فيموت أكتر. المية بتكسر الدايرة دي.

          الـ **ACG** في الكتاب:
          - **مفيش hypovolemia**: ما يزيدش عن 1.5 ml/kg/h.
          - **فيه hypovolemia**: **bolus 10 ml/kg** (عادة 3–4 L في أول 24 h).
          - أحسن وقت: أول 12–24 h. بعد كده الفايدة بتقل والضرر (رئة، compartment) بيزيد.
          - الهدف: الـ **BUN ينزل** والـ fluid status يتظبط علشان الـ organ perfusion.
          - المتابعة: قيّم الاحتياج كل 6 ساعات لمدة 48 ساعة.

          مثال: راجل 70 kg من غير جفاف = حوالي 105 ml/h بس، مش لترات مفتوحة.
      - kind: reveal
        page: 289
        quote: "Contains Ca which bind to non-esterfied FA"
        prompt: "ليه **lactated Ringer** أحسن من **normal saline**؟ الكتاب عنده 6 أسباب، جرّب تفتكر 3 على الأقل."
        answer: |
          - **More electrolyte balanced**.
          - فيه **Ca** بيمسك الـ **non-esterified fatty acids**، فهي تأذي البنكرياس أقل.
          - الـ **lactate** ليه **anti-inflammatory effect**.
          - **pH balanced**، فبيوقف الـ **enzyme activation**.
          - الـ **normal saline** أكثر حموضة: **non-anion gap hyperchloremic metabolic acidosis** و **renal injury**.
          - الـ saline بالكميات الكبيرة اتربط بـ **compartment syndrome**.
      - kind: aside
        tone: joke
        page: 289
        text: |
          الـ **normal saline** اسمه "normal" بس هو مش normal خالص: chloride كتير يعمل **hyperchloremic acidosis**. 😄

          زي الواد اللي اسمه "هادي" وهو أكتر واحد عامل دوشة في الفصل.
      - kind: check
        page: 289
        question: "A 70-kg man with acute pancreatitis has no signs of hypovolemia. What fluid plan fits the book?"
        options:
          - "Lactated Ringer's, no more than about 105 ml/h"
          - "Normal saline 250 ml/h for 48 h"
          - "Bolus 10 ml/kg then 3–4 L in 24 h"
          - "Restrict fluids to protect the lungs"
        answer: 0
        why:
          - "صح: من غير hypovolemia ≤ 1.5 ml/kg/h = 1.5 × 70 ≈ 105 ml/h، والسائل Ringer."
          - "Saline مش المفضّل، والرقم أعلى من الحد."
          - "الـ bolus ده للـ **hypovolemic** بس."
          - "الكتاب مش بيقول restriction؛ بيقول هيدرة محسوبة."
      - kind: explain
        page: 290
        title: "المضاد الحيوي: لأ، إلا لو..."
        text: |
          الـ pancreatitis التهاب كيميائي مش عدوى. علشان كده المضاد الحيوي من الأول مش هيطفي حاجة، وممكن يعمل resistance و fungi.

          القاعدة:
          - **Routine antibiotic prophylaxis** في الـ SAP: مش recommended. ولا routine antifungals.
          - مسموح للـ extra-pancreatic infections: cholangitis، UTI، bacteremia.

          **Infected necrosis**: فكّر فيها لو المريض اتدهور أو متحسنش **بعد 7–10 days** (الوقت اللي البكتيريا بتلحق توصل فيه للنسيج الميت). ساعتها:
          - مضاد بيخترق البنكرياس لمدة 30 days قبل ما تقرر جراحة. أغلبهم بيتحسنوا من غير جراحة.
          - **Routine CT-guided FNA**: مبقاش لازم؛ ابدأ على أساس clinical (newly changed).

          **NB**: الـ SIRS بدري ممكن يشبه sepsis (حرارة ونبض وWBC). لو شاكك في عدوى، ادّي مضاد وانت بتدوّر على المصدر، و**وقّفه لو المزارع sterile**.
      - kind: match
        page: 290
        prompt: "وصّل كل مضاد حيوي بوصفه في الكتاب:"
        pairs:
          - ["Quinolones", "Good penetration, high resistance"]
          - ["Carbapenems", "Good penetration, high efficacy"]
          - ["Metronidazole", "For anaerobes"]
        why: "الاتنين الأولين بيخترقوا البنكرياس، بس الـ quinolones عليها resistance عالية فالـ **carbapenems** أحسن. والـ metronidazole للـ anaerobes."
      - kind: explain
        page: 290
        title: "الأكل والمسكّن"
        text: |
          الفكرة القديمة كانت "ريّح البنكرياس وصوّم المريض". الكتاب بيقول العكس: الأكل بدري بيحمي.

          **Nutrition**:
          - **Mild AP**: يبدأ أكل بالبُق فورًا لو مفيش nausea ولا vomiting ولا وجع، و **low-fat solid diet**.
          - **Severe AP**: **enteral nutrition** خلال 24–72 h علشان يمنع الـ infections والـ gut failure (الشرح في الخطوة الجاية).
          - الطريق: **nasogastric** أفضل من nasojejunal (newly changed)، لأنه أسهل في التركيب وبنفس الأمان.
          - **Parenteral**: نتجنبها إلا لو الـ enteral مش متاح أو مش متحمّل.

          **Pain** (ص 291):
          - التوقيت: كل مريض ياخد مسكّن في أول 24 h.
          - **NSAIDs**: ممنوعة مع الـ **AKI** (بتقفل الأوعية الداخلة للكلية اللي أصلًا ناشفة).
          - **Hydromorphone**: أفضل من morphine أو fentanyl في المريض الـ non-intubated.
          - **Epidural analgesia**: ممكن في الـ severe والـ critical.
      - kind: aside
        tone: analogy
        page: 290
        text: |
          الأمعاء زي العسكري اللي على البوابة. لو جوّعته أيام (NPO أو TPN)، بيتعب ويسيب البوابة، والبكتيريا تعدّي للـ necrosis (bacterial translocation، شرح physiology مقبول).

          أكّل العسكري (enteral feeding) علشان يفضل صاحي. ده معنى "to prevent infections and gut failure" في الكتاب.
      - kind: explain
        page: 291
        title: "الـ ERCP: امتى بالظبط؟"
        text: |
          الـ ERCP سلاح بحدين: بيشيل الحصوة، بس هو نفسه سبب من أشهر أسباب الـ pancreatitis (post-ERCP). فبنعمله بس لما الفايدة أكيدة:
          - **Gallstone AP + cholangitis**: **ERCP within 24 hrs**. الصفرا المتعفنة الساكنة ورا الحصوة بتموّت أسرع من البنكرياس.
          - **CBD obstruction + bilirubin بيعلى**: ERCP، لأن الحصوة لسه قاعدة.
          - **من غير cholangitis أو jaundice**: لو شاكك في حصوة، اعمل **MRCP أو EUS** الأول، مش ERCP. أغلب الحصوات بتكون عدّت لوحدها.

          **Post-ERCP pancreatitis (PEP)**: في الـ high-risk، **PD stent** و **rectal indomethacin** بيمنعوا الـ PEP الـ severe. الأربع حاجات كلها في الـ mnemonic الجاي.
      - kind: mnemonic
        page: 292
        word: "SIGH"
        parts:
          - { key: "S", text: "Stent: prophylactic pancreatic duct (PD) stenting" }
          - { key: "I", text: "Indomethacin, rectal" }
          - { key: "G", text: "Guidewire cannulation rather than contrast-guided cannulation" }
          - { key: "H", text: "Hydration: IV fluids before the procedure" }
        hook: |
          الـ endoscopist بياخد **نَفَس عميق (SIGH)** قبل الـ ERCP علشان يفتكر الـ 4 حاجات اللي بتقلل الـ **PEP**. وده سؤال essay صريح في آخر المحاضرة.
      - kind: explain
        page: 292
        title: "الجراحة والـ drainage"
        text: |
          المرارة: الحصوة اللي عملت النوبة ليها أخوات جوه المرارة، فلازم المرارة تتشال. السؤال امتى؟
          - **Mild AP + gallstones**: **cholecystectomy قبل الخروج**، علشان النوبة متتكررش وهو مستني.
          - **Necrotizing biliary AP**: الـ cholecystectomy تتأجل لحد ما الالتهاب يهدى والـ collections تختفي أو تستقر، علشان العملية في وسط الالتهاب ممكن تنقل عدوى للـ necrosis.

          **الـ collections**: القاعدة "متلمسش اللي مش بيشتكي، واستنى السور".
          - **Asymptomatic pseudocyst أو necrosis**: مش محتاجين جراحة.
          - **Infected necrosis في مريض stable**: أجّل أي drainage **أكتر من 4 weeks** (لحد ما الجدار يتبني، فاكر المقاول؟). ولو محتاج، **minimally invasive necrosectomy** (CGS + necrosectomy، VARD).

          **Percutaneous / EUS drainage** بعد 4 weeks لو:
          - **Obstruction**: gastric outlet، biliary، أو intestinal من WON كبيرة بتضغط.
          - **Disconnected duct syndrome**: الـ duct مقطوع فالعصارة مش لاقية طريق.
          - **Pseudocyst**: عامل أعراض أو بيكبر.
      - kind: case
        page: 291
        stem: "A 48-year-old woman with gallstones is admitted with acute pancreatitis."
        steps:
          - reveal: "Day 1: fever 39 °C, jaundice and right upper quadrant pain."
            question: "Next step?"
            options: ["ERCP within 24 h", "MRCP first, ERCP if a stone is seen", "Antibiotics only, ERCP after a week", "Urgent cholecystectomy"]
            answer: 0
            why: "Cholangitis مع gallstone AP = **ERCP within 24 hrs**. الـ MRCP للحالات من غير cholangitis أو jaundice."
          - reveal: "Day 11: necrotizing pancreatitis on CT. New fever, she is worse but hemodynamically stable."
            question: "Best approach?"
            options: ["CT-guided FNA before any antibiotic", "Immediate open necrosectomy", "Carbapenem, no routine CT-guided FNA", "Antifungal prophylaxis"]
            answer: 2
            why: "بعد 7–10 أيام وتدهور = infected necrosis. مضاد بيخترق (carbapenem) على أساس clinical، والـ FNA مبقاش روتين، والجراحة تتأجل > 4 weeks."
          - reveal: "Week 8: she is well; a stable walled-off collection remains."
            question: "When should the gallbladder come out?"
            options: ["Before discharge from the first admission", "Once inflammation settles and collections resolve or stabilize", "Never: she is cured"]
            answer: 1
            why: "في الـ **necrotizing** biliary AP الـ cholecystectomy تتأجل لحد ما الالتهاب يهدى. «قبل الخروج» دي للـ mild."
      - kind: aside
        tone: exam
        page: 292
        text: |
          لو اتسألت عن الـ infected necrosis افتكر الترتيب 3 D: **Delay** (> 4 أسابيع)، **Drain** (percutaneous أو EUS)، **Debride** (minimally invasive necrosectomy). ده بيلخّص كلام الكتاب في ص 292 في 3 كلمات.
