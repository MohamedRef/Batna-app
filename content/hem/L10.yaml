  - id: hem.L10.111
    kind: card
    topic: secondary
    front: "Chuvash polycythemia: inheritance, region and EPO?"
    back: Autosomal recessive, endemic in Chuvashia (mid-Volga, Russia); EPO is raised with no EPO receptor mutation.
    src: { page: 173, quote: "Endemic in Russhian mid-Volga region of Chuvashia" }
    status: unverified
  - id: hem.L10.112
    kind: card
    topic: secondary
    front: What is the molecular defect in Chuvash polycythemia?
    back: A von Hippel–Lindau (VHL) mutation slows degradation of HIF-1, so its target EPO is upregulated.
    src: { page: 173, quote: "VHL mutant leads to reduced rate of degradation of HIF-1 and up regulation of down stream target Epo." }
    status: unverified
    tags: [high-yield]
