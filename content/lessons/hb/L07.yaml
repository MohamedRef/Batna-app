            <path d="M170 88v18" class="fg-arrow" marker-end="url(#L07a)"/>
            <rect x="44" y="108" width="282" height="112" rx="10" class="fg-thin"/>
            <text x="318" y="124" text-anchor="end" class="t-sm t-mut">Nucleus</text>
            <rect x="60" y="130" width="220" height="32" rx="6" class="fg-acc"/>
            <text x="170" y="151" text-anchor="middle" class="t-sm t-b">cccDNA = the template</text>
            <path d="M170 162v14" class="fg-arrow" marker-end="url(#L07a)"/>
            <rect x="60" y="178" width="220" height="32" rx="6" class="fg-box"/>
            <text x="170" y="199" text-anchor="middle" class="t-sm">Transcription: 3.5 kb pgRNA</text>
            <path d="M170 210v20" class="fg-arrow" marker-end="url(#L07a)"/>
