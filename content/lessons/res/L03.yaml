  - id: res.L03.lesson3
    title: "من فكرة واسعة لسؤال FINER"
    hook: "\"صحة الستات\" مش سؤال بحث. هنضيّقها خطوة خطوة، وبعدين نعدّيها على خمس فلاتر."
    minutes: 9
    pages: [21, 44]
    topics: [narrowing, finer]
    goals:
      - "تضيّق topic of interest لحد ما يبقى focused research question"
      - "تحفظ FINER وتعرف كل حرف بيسأل عن إيه"
      - "تعرف الشروط الأخلاقية قبل أي تجربة على بني آدمين"
    status: unverified
    steps:
      - kind: explain
        page: 23
        quote: "Topic of interest: Women’s health • Narrowed topic: Women and cancer • Focused topic"
        title: "القمع"
        text: |
          المحاضرة بتمشي في كل مثال بنفس السلم:

          - **Topic of interest:** Women's health
          - **Narrowed topic:** Women and cancer
          - **Focused topic:** post-menopausal HRT and endometrial carcinoma
          - **Focused research question:** Does post-menopausal HRT predispose women to develop endometrial cancer

          وبعدها على طول: ==How variables will be measured==
      - kind: figure
        page: 23
        quote: "Topic of interest: Women’s health • Narrowed topic: Women and cancer • Focused topic"
        title: "من الواسع للضيق"
        alt: "A funnel of four bands narrowing downward: topic of interest (women's health), narrowed topic (women and cancer), focused topic (HRT and endometrial carcinoma), focused research question. Below it a box: how will the variables be measured?"
        caption: "كل ما تنزل في القمع السؤال يضيق، لحد ما يبقى حاجة تقدر تقيسها."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03f1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <path d="M5 10h320l-20 55H25z" class="fg-box"/>
            <text x="165" y="32" text-anchor="middle" class="t-sm t-mut">Topic of interest</text>
            <text x="165" y="52" text-anchor="middle" class="t-b">Women's health</text>
            <path d="M28 70h274l-20 55H48z" class="fg-box"/>
            <text x="165" y="92" text-anchor="middle" class="t-sm t-mut">Narrowed topic</text>
            <text x="165" y="112" text-anchor="middle" class="t-b">Women and cancer</text>
            <path d="M51 130h228l-20 55H71z" class="fg-good"/>
            <text x="165" y="152" text-anchor="middle" class="t-sm t-mut">Focused topic</text>
            <text x="165" y="172" text-anchor="middle" class="t-sm t-b">HRT and endometrial carcinoma</text>
            <path d="M74 190h182l-20 62H94z" class="fg-acc"/>
            <text x="165" y="210" text-anchor="middle" class="t-sm t-mut">Focused question</text>
            <text x="165" y="228" text-anchor="middle" class="t-sm t-b">Does HRT predispose to</text>
            <text x="165" y="244" text-anchor="middle" class="t-sm t-b">endometrial cancer?</text>
            <path d="M165 254v20" class="fg-arrow-acc" marker-end="url(#L03f1)"/>
            <rect x="60" y="280" width="210" height="40" rx="6" class="fg-ink"/>
            <text x="165" y="305" text-anchor="middle" class="t-sm t-b">How will variables be measured?</text>
          </svg>
      - kind: reveal
        page: 22
        quote: "Focused researchable question: Will 30 minutes of moderate activity daily reduce hypertension in office workers?"
        prompt: "جرّب إنت: الموضوع \"Physical activity and cardiovascular disease\". ضيّقه لـ narrowed topic وبعدين focused question."
        answer: |
          - **Narrowed topic:** Is there a link between lack of physical activity and hypertension
          - **Focused researchable question:** ==Will 30 minutes of moderate activity daily reduce hypertension in office workers==

          لاحظ إنه حدد المدة (30 minutes)، الشدة (moderate)، التكرار (daily)، الـ outcome (hypertension) والناس (office workers).
      - kind: mnemonic
        page: 35
        quote: "N — Novel E — Ethical R - Relevant"
        word: "FINER"
        parts:
          - { key: "F", text: "Feasible: subjects, time, equipment, expertise, resources" }
          - { key: "I", text: "Interesting: to you and to the scientific community" }
          - { key: "N", text: "Novel: confirms, refutes or extends previous findings" }
          - { key: "E", text: "Ethical: an ethics board would approve it" }
          - { key: "R", text: "Relevant: to knowledge, clinical management, policy, future research" }
        hook: |
          السؤال الكويس **أفْيَن** (FINER = أحسن): كل حرف فلتر، ولو وقع في واحد بس ارجع صلّحه.
      - kind: explain
        page: 26
        quote: "recruit the number of subjects • timeframe • equipment, supplies and other • required expertise. • resources"
        title: "F: Feasible (عملي)"
        text: |
          قبل ما تتحمس، اسأل: هقدر أعمله؟

          - هقدر **recruit the number of subjects**؟
          - الـ **timeframe** يكفي؟
          - الـ **equipment, supplies** موجودة؟
          - عندي الـ **required expertise**؟ والـ **resources**؟

          وفي البوكس بتاع FINER: ==Manageable== يعني **not too many or too ambitious**.
      - kind: explain
        page: 28
        quote: "Novel does not necessarily mean that the research has not been done before."
        title: "I و N: Interesting و Novel"
        text: |
          - **Interesting:** لازم يهم ==the investigators & the scientific community==، مش بس إنت.
          - **Novel:** مش شرط حد ماعملوش قبل كده! البادئة **"re"** في research معناها **searching again**. البحث الجديد ممكن **confirms, refutes or extends previous findings**.
      - kind: aside
        tone: joke
        page: 28
        quote: "The prefix “re” in the word research implies searching again."
        text: |
          Research = بندوّر تاني. زي أمك وهي بتدوّر على الريموت في نفس الكنبة للمرة العاشرة، وفي العاشرة بتلاقيه. التكرار مش عيب، المهم تضيف حاجة.
      - kind: explain
        page: 30
        quote: "The ethically acceptable practice is to step up clinical trials in successive phases, starting first with a small number of subjects"
        title: "E: Ethical"
        text: |
          أحيانًا المشكلة الأخلاقية معناها إن البحث **should not be considered from the beginning**.

          لو هتجرّب علاج أو procedure جديد على بني آدمين:
          - لازم يكون فيه evidence إنه ممكن يبقى **superior to currently available alternatives**.
          - لازم داتا كفاية من **animal studies** ومن عدد صغير من البشر تأكد الـ **safety** وتلمّح للـ effectiveness.
          - التجارب بتطلع ==in successive phases==: عدد صغير الأول، ومفيش phase جديدة غير لما اللي قبلها تخلص بنجاح.
      - kind: explain
        page: 31
        quote: "It is unjustifiable to do clinical trials on therapies that are unlikely to become available to people in the country or community."
        title: "E: باقي القواعد"
        text: |
          - **Unjustifiable** تعمل trial على علاج **unlikely to become available** للناس في البلد.
          - البحث مايتعارضش مع قيم المجتمع **cultural, moral, religious and legal**.
          - لو متطوعين مالهمش فايدة مباشرة: البحث يتعمل بس لو المعلومة هتقدّم العلم والممارسة و==cannot be obtained otherwise== (مثلًا من حيوانات).
          - والتجارب على الحيوانات نفسها لازم **justified**.
      - kind: check
        page: 44
        quote: "Limited by ethical and legal issues"
        question: "\"Will voluntary induced abortion after the 3rd month increase maternal mortality?\" What limits this question?"
        options:
          - "Ethical and legal issues"
          - "It is too vague"
          - "It is not novel"
          - "It has no outcome"
        answer: 0
        why:
          - "صح: المحاضرة كاتبة **limited by ethical and legal issues**. الـ E في FINER."
          - "بالعكس، هو محدد: exposure وتوقيت و outcome."
          - "مش دي المشكلة."
          - "الـ outcome موجود: maternal mortality."
      - kind: explain
        page: 33
        quote: "have the potential to advance scientific knowledge influence clinical management influence health policy guide further research"
        title: "R: Relevant"
        text: |
          السؤال الـ relevant لازم يكون عنده **potential** يعمل واحدة من دول:

          - ==advance scientific knowledge==
          - **influence clinical management**
          - **influence health policy**
          - **guide further research**
      - kind: case
        page: 26
        quote: "recruit the number of subjects • timeframe • equipment, supplies and other • required expertise."
        stem: "نائب سنة أولى عايز يعمل recruit لـ 3,000 subjects عندهم hepatic encephalopathy لوحده، والـ timeframe شهرين، والـ equipment (بروتوكول MRI) مش موجودة في المستشفى."
        steps:
          - question: "Which FINER letter fails first?"
            options: ["Feasible", "Interesting", "Novel", "Relevant"]
            answer: 0
            why: "عدد المرضى، الوقت، الجهاز والخبرة: كلها بنود **Feasible**."
          - question: "What should he do?"
            options:
              - "Narrow it: fewer patients, a test he has, a realistic time"
              - "Keep it and hope for the best"
              - "Drop the topic forever"
            answer: 0
            why: "الحل إنك تضيّق السؤال لحد ما يبقى **manageable**، مش إنك ترمي الفكرة."
      - kind: try
        items: [res.L03.030, res.L03.034, res.L03.038, res.L03.044]
    recap:
      - "Topic of interest ← narrowed topic ← focused topic ← focused question ← how variables will be measured."
      - "FINER: Feasible، Interesting، Novel، Ethical، Relevant."
      - "Novel مش معناه أول مرة: re-search = searching again (confirm, refute, extend)."
      - "Ethical: evidence + animal/small human data الأول، trials in successive phases، مفيش trial على علاج مش هيوصل للناس."
      - "Relevant: knowledge، clinical management، health policy، further research."
    practice: [res.L03.030, res.L03.031, res.L03.032, res.L03.034, res.L03.035, res.L03.036, res.L03.037, res.L03.038, res.L03.039, res.L03.040, res.L03.041, res.L03.042, res.L03.043, res.L03.044, res.L03.050, res.L03.051]
