          - "ALT 6,500 IU/L, AST 5,800 IU/L"
          - "ALT 900 IU/L, AST 400 IU/L"
          - "ALT 1,200 IU/L, normal ALP"
        answer: 0
        why:
          - "صح: AST ≈ **2.7× ALT**، AST **< 300**، ALT **< 100**: ده الـ alcohol بالحرف."
          - "ده **towering**: acetaminophen أو toxins أو mushrooms أو shock liver."
          - "ALT أعلى من AST و ALT فوق 100: مش pattern الـ alcohol."
          - "ALT عالي جدًا مع ALP طبيعي = **acute hepatocellular** (direct toxic)."
      - kind: explain
        page: 134
        title: "أمثلة الـ acute hepatocellular"
        text: |
