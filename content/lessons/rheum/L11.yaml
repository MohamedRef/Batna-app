      - kind: check
        page: 193
        quote: "Viral p24 antigen (p24ag): it appears shortly after infection, but disappear by the 8-10 weeks after exposure. It is a useful marker in individuals who have been infected recently."
        question: "Three weeks after a high-risk exposure, which marker in the book is most useful for recent infection?"
        options:
          - "p24 antigen"
          - "Anti-gp120 antibody by ELISA"
          - "Western blot"
          - "Virus culture after 6 months"
        answer: 0
        why:
          - "صح: الـ p24 antigen بيبان shortly after infection، ومفيد في اللي اتعدى قريب، قبل ما يختفي على 8–10 أسابيع."
          - "الـ antibodies لسه ممكن تكون في الـ window period (لحد 3 شهور)."
          - "الـ western blot تأكيد للـ antibody، فبيقع في نفس الـ window."
          - "مش بنستنى 6 شهور، والـ culture مش أول اختيار للعدوى الحديثة."
      - kind: explain
        page: 193
        title: "الـ seroconversion"
        quote: "The majority are clinically silent. Non specific illness occurs 6-8 weeks later (arthralgia, fever, lethargy, sore throat, LN enlargement, mucosal ulcers, maculopapular rash). Neurological symptoms are common (headache, photophobia, myelopathy, neuropathy…), then complete recovery."
        text: |
          - **Incubation:** 2–4 أسابيع، ==صامت== إكلينيكيًا وسيرولوجيًا
          - **Seroconversion illness:** أغلبهم صامتين. اللي بيتعب، بعد ==6–8 أسابيع==: arthralgia، fever، lethargy، sore throat، تضخم الغدد الليمفاوية، mucosal ulcers، maculopapular rash. والأعصاب **common**: headache، photophobia، myelopathy، neuropathy. وبعدين **complete recovery**
          - **Labs:** lymphopenia، thrombocytopenia، liver enzymes عالية، الـ **CD4** ممكن يقع جامد و ==CD4:CD8 reversed==. والـ antibodies ممكن تبقى **غايبة** بينما الـ viral RNA عالي والـ p24 ممكن يبان

          ليه الأعراض دي؟ التفسير المقبول (مش في الكتاب): الفيروس بيتكاثر بسرعة جدًا في الأول قبل ما المناعة تمسكه، فبيبقى زي أي فيروس حاد: سخونية وغدد وطفح. والـ CD8 بيعلى لأنه بيحارب.
      - kind: explain
        remind: [rheum.L11.080]
        page: 194
        title: "الـ latency وبعدها"
        quote: "Most patients are asymptomatic for a variable time, however, the virus continue to replicate & the patient is infectious. Studies suggest a median time of 10 years from infection to development of AIDS."
        text: |
          - **Clinical latency:** من غير أعراض مدة متغيرة، بس الفيروس ==لسه بيتكاثر== والعيان **infectious**. الـ median للـ acquired immunodeficiency syndrome (AIDS) حوالي ==10 سنين==
          - مجموعة عندها **persistent lymph node enlargement** في موقعين extra-inguinal أكتر من 3 شهور: firm، mobile، مش بتوجع، ± splenomegaly
          - مع التقدم: الـ **CD4 بيقل** والـ **viral load بيعلى** وتبدأ الأعراض

