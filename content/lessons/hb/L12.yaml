    steps:
      - kind: explain
        page: 201
        title: "إيه الـ AATD؟"
        text: |
          - **AATD**: genetic disorder بسبب mutations في الـ ==SERPINA1== gene، فبيبقى فيه low levels of alpha-1 antitrypsin.
          - ==AAT==: protective enzyme بيتعمل أساسًا في الكبد، وبيحمي الأنسجة، خصوصًا الرئة، من الـ enzymes released by inflammatory cells.

          يعني المصنع في الكبد، والزبون الأساسي الرئة.

          الخلايا الالتهابية في الرئة بتطلّع إنزيمات بتكسّر البروتين علشان تقتل الميكروبات. من غير الـ AAT، الإنزيمات دي بتاكل جدار الـ alveoli نفسه.

          وده بيفسّر ليه المرض بيضرب في حتتين: الرئة لأنها فقدت الحماية، والكبد لأنه المصنع.
