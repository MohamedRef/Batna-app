      - "Cirrhosis بعد الشفا: **HCC surveillance كل 6 شهور** و primary prophylaxis للـ varices لو فيه CSPH."
      - "Decompensated: add RBV أو **24 weeks**. Severe CKD: **G/P**. RBV تتظبط لو CrCl < 50. الحمل: not approved. Coinfection: راقب HBV reactivation."
