      - kind: try
        items: [neph.L14.137, neph.L14.139, neph.L14.143, neph.L14.145, neph.L14.155]
    recap:
      - "TTP: ADAMTS13 ↓ ← VWF multimers ← microthrombi؛ acquired (autoantibody) أشهر."
