      - kind: order
        page: 235
        quote: "Other joints are affected in frequency order: ankles, heels, knees, wrists, fingers, elbows, and occasionally periarticular structures."
        prompt: "بعد الـ podagra: رتّب المفاصل من الأكتر للأقل."
        steps:
          - "Ankles"
          - "Heels"
          - "Knees"
          - "Wrists"
          - "Fingers"
          - "Elbows"
        why: "الكتاب ماشي من تحت لفوق تقريبًا: ankle، heel، knee، وبعدين الإيد: wrist، fingers، elbow. الأبرد والأبعد عن القلب الأول."
      - kind: explain
        remind: [dm.L18.023]
        page: 235
        title: "شكل الهجمة"
        quote: "Precipitating factors include trauma, surgery, infection, alcohol, dietary overindulgence, exercise, and low temperature."
        text: |
          - الهجمة الأولى **very severe and incapacitating**، والجلد **dusky red**.
          - ممكن **fever، malaise، leukocytosis**.
          - **Precipitating factors:** trauma، surgery، infection، ==alcohol==، **dietary overindulgence**، exercise، **low temperature**.
          - بتخف **لوحدها** من ساعات لأسابيع، ويدخل الـ **intercritical phase**.
          - بعدها: هجمات متكررة في مفاصل أكتر، أو **chronic gouty arthritis**، أو ما ترجعش خالص.

          ليه الأكل الكتير والكحول والبرد؟ عشان كلهم بيغيّروا مستوى الـ urate أو ذوبانه فجأة، والتغيير المفاجئ هو اللي بيكسر الـ tophus (الدرس الجاي).
      - kind: reveal
        page: 235
        quote: "Precipitating factors include trauma, surgery, infection, alcohol, dietary overindulgence, exercise, and low temperature."
        prompt: "ليه الـ low temperature في القائمة، وليه صباع الرجل بالذات؟"
        answer: |
          الـ **urate** بيدوب أقل في الحرارة المنخفضة. صوابع الرجل أبرد حتة في الجسم وبعيدة عن القلب، فالكريستال بيترسب هناك الأول.

          وده يفسّر ==low temperature== في الـ precipitating factors. (التفسير المقبول، مش في الكتاب.)
      - kind: check
        page: 235
        quote: "90% of the first attacks are monoarticular, and 50% of them occur in the 1 st MTPJ (podagra)"
        question: "A 44-year-old man wakes with a hot, dusky-red, exquisitely tender big toe after a wedding feast. Which statement fits the lecture?"
        options:
          - "90% of first attacks are monoarticular; half are in the first MTP joint"
          - "Most first attacks are polyarticular"
          - "Every hyperuricaemic person eventually gets gout"
          - "The first attack is usually mild"
        answer: 0
        why:
          - "صح: 90% مفصل واحد، ونصهم podagra، والأكل الكتير trigger."
          - "الهجمة الأولى في 90% مفصل واحد."
          - "20% بس من الـ hyperuricemia بيعملوا gout."
          - "الهجمة الأولى very severe and incapacitating."
      - kind: explain
        page: 236
        title: "بعد الهجمة: تلات طرق"
        quote: "Chronic gouty arthritis, where subsequent attacks do not resolve completely, leaving chronically aching joints and tendons"
        text: |
          الهجمة بتخف لوحدها من ساعات لأسابيع، ويدخل الـ ==intercritical phase== (ساكت خالص). بعد كده الكتاب بيدّيك تلات طرق:

          1. **Recurrent acute attacks** في مفاصل أكتر.
          2. ==Chronic gouty arthritis==: الهجمات ما بتخفش خالص، والمفاصل والأوتار بتفضل توجع.
          3. **Some patients never get a recurrence**.

          ليه بيتطور كده؟ التفسير المقبول (مش في الكتاب): الـ uric acid لسه عالي، فالكريستال بيفضل يتراكم بين الهجمات حتى وهو ساكت. كل ما المخزون يكبر، الهجمات تقرب وتكبر. وعشان كده العلاج اللي بينزّل الـ uric acid بيتعمل في الـ intercritical phase مش في الهجمة.
      - kind: case
        page: 235
        quote: "ACUTE GOUTY ARTHRITIS:\n  1. 90% of the first attacks are monoarticular, and 50% of them occur in the 1 st MTPJ (podagra)"
        stem: "A 45-year-old man wakes at 3 am with a red, hot, exquisitely tender big toe after a wedding dinner and beer."
        steps:
          - question: "Most likely diagnosis?"
            options: ["Acute gouty arthritis (podagra)", "Tophaceous gout", "Gouty nephropathy", "Intercritical gout"]
            answer: 0
            why: "Monoarticular first metatarsophalangeal joint (MTPJ) attack after dietary overindulgence and alcohol (p235)."
          - reveal: "Temperature 38 °C, WBC 12,000."
            question: "Does fever rule out gout?"
