          - { text: "Fecal microbiome transplantation", bin: 3 }
        why: "Norursodeoxycholic acid (norUDCA) و OCA (FXR) و fibrates (PPAR) و maralixibat (ASBT) كلهم على الـ bile acids. Simtuzumab (LOXL2) و bexotegrast (integrins → TGF-β) antifibrotic. Vedolizumab (α4β7) و cenicriviroc (CCR2/CCR5) immune. Vancomycin و FMT على الـ microbiome."
      - kind: reveal
        page: 235
        quote: "On the other hand, no clinically\n significant amelioration in hepatic fibrosis was seen in a placebo-controlled,\n phase IIb trial testing simtuzumab, a LOXL2 inhibitor."
        prompt: "الـ simtuzumab كان منطقي جدًا ونجح في الفيران. إيه اللي حصل في البني آدمين، وتتعلم منه إيه؟"
        answer: |
          المنطق من الكتاب: الـ **LOXL2** بيربط ألياف الـ collagen والـ elastin ببعض فبيقوّي الـ scar، ومستواه في الدم والكبد مرتبط بتقدّم الـ PSC، وقفله في الفيران قلّل الـ fibrosis وسرّع رجوعها.

          في الـ phase IIb: **234** مريض compensated PSC، placebo أو 75 mg أو 125 mg أسبوعيًا لمدة **96 أسبوع**. النتيجة: **no significant** تأثير على الـ collagen في الـ biopsy ولا على الـ **Ishak fibrosis stage**.

          الدرس (التفسير المقبول، مش في الكتاب): النجاح في الحيوان ومنطق الـ mechanism مش كفاية؛ اللي بيحسم هو التجربة على المرضى. وعشان كده الكتاب نفسه بيقول قليل جدًا من الـ antifibrotics اتدرس لحد دلوقتي.
      - kind: explain
        page: 236
        quote: "Although PSC is an autoimmune liver disorder, the immunosuppressive\n medications commonly used have not shown clear clinical benefits in PSC"
        title: "مرض مناعي، والـ immunosuppression مش نافعة؟"
        text: |
          الكتاب بيقول الـ PSC **autoimmune liver disorder**، ومع ذلك الأدوية الـ immunosuppressive المعتادة **not shown clear clinical benefits**. فالبحث راح لأدوية مناعة أدق:

          - **Timolumab** (anti-VAP-1): منع الـ fibrosis في الحيوانات؛ تجربة BUTEO لسه ما اتنشرتش.
          - **Cenicriviroc** (CCR2/CCR5 antagonist): الـ ALP نزل 18% بس في 24 أسبوع.
          - **Vedolizumab** (ضد الـ α4β7 integrin): بيمنع الـ leukocytes تتنقل بين المصران والكبد عن طريق **MAdCAM-1**. النتايج mixed، وحوالي 20% بس الـ ALP نزل عندهم 20% أو أكتر، وده كان مرتبط بالـ cirrhosis.
          - **Vidofludimus**: الـ ALP رجع طبيعي في 27.7% (3 من 11) في أسبوع 24.

          ليه الـ immunosuppression العادية ما بتنفعش هنا عكس الـ AIH؟ التفسير المقبول (مش في الكتاب): المرض في الـ PSC بيتحول بسرعة لـ **fibrosis و strictures** في القنوات، والـ scar ما بيرجعش بالـ steroids. يعني لما تشخّص، جزء كبير من الضرر بقى ندبة مش التهاب.
      - kind: check
        page: 237
        quote: "Additionally, a pilot study of orally administered\n budesonide in PSC showed minimal, if any, clinical efficacy and was associated with\n worsening osteoporosis."
        question: "In the PSC pilot study, oral budesonide was:"
        options:
          - "Of minimal benefit and linked to worse osteoporosis"
          - "Curative in early PSC"
          - "Better than UDCA on hard end points"
          - "The standard first-line drug"
        answer: 0
        why:
          - "صح: **minimal, if any, clinical efficacy**، ومع **worsening osteoporosis**."
          - "مفيش دوا في المحاضرة بيشفي الـ PSC."
          - "مفيش دوا لسه أثبت hard end point."
          - "الكتاب بيقول الـ immunosuppressants فايدتها **largely questionable**. وكمان الـ infliximab ما نفعش في الـ pilot."
      - kind: check
        page: 238
        quote: "The results showed a significant decrease in ALP levels and Mayo score in the vancomycin-treated groups. Currently, a phase II multicenter clinical trial is underway, involving 102 patients with PSC, to evaluate ALP levels at 6, 12, and 18 months. This trial aims to further investigate the potential therapeutic effects of vancomycin in PSC."
        question: "Which gut-directed antibiotic lowered ALP and the Mayo score in PSC in two randomised trials?"
        options:
          - "Vancomycin"
          - "Rifaximin"
          - "Ciprofloxacin"
          - "Metronidazole alone"
        answer: 0
        why:
          - "صح: الـ **vancomycin** نزّل الـ ALP والـ Mayo score، وليه immunomodulatory effect."
          - "الـ rifaximin ما أثّرش على الـ cholestatic markers ولا الـ Mayo score."
          - "الـ ciprofloxacin لعلاج الـ **bacterial cholangitis**، مش علاج للمرض نفسه."
          - "الـ metronidazole اتدرس مع الـ UDCA، مش لوحده؛ وفي تجارب الـ vancomycin كان هو المقارن."
      - kind: reveal
        page: 239
        quote: "In a small pilot study, PSC patients who underwent FMT\n experienced a ≥50% decrease in blood alkaline phosphatase levels in 3 of the\n participants. The efficacy of this treatment may be associated with the bacterial\n diversity in the gut and the engraftment of donor microbiota."
        prompt: "الـ FMT نزّل الـ ALP 50% أو أكتر عند تلاتة، والـ probiotics ما عملتش فرق. ليه الفرق ده؟"
        answer: |
          الكتاب بيقول فعالية الـ **FMT** ممكن تكون مرتبطة بـ **bacterial diversity** و **engraftment of donor microbiota**. والـ **probiotics** (4 Lactobacillus + 2 Bifidobacterium، 14 مريض، 3 شهور): **no significant difference** في الـ ALP ولا الأعراض.

          التفسير المقبول (مش في الكتاب): الـ FMT بينقل مجتمع بكتيريا كامل ومتنوع ممكن يستوطن، أما الـ probiotics فشوية أنواع قليلة بتعدّي ومش بتقعد. وده بيتماشى مع فكرة الكتاب إن الـ microbiome بيأثر على الـ **bile acid homeostasis**.

          باقي الصفحة: **sulfasalazine** تحت الدراسة، و **curcumin** ما فرقش، و **HTD1801** و **DUR-928** في phase II.
      - kind: aside
        tone: joke
        page: 240
        quote: "with a significant reduction in ALP levels in PSC patients in a 12-month, open- label, pilot study (n=23)."
        text: |
          الأدوية الجديدة في الـ PSC زي العرسان في فيلم أبيض وأسود: كلهم بيقولوا «**خفّضت الـ ALP**»، بس محدش لسه جاب «**hard endpoint**» (survival أو transplant). علشان كده الكتاب نفسه بيقول مفيش دوا واحد هيحل الحكاية كلها.
