          - **(2)**: قنوات وسوايل بيضا تانية. الكتاب مش بيحدد مكان الـ stricture في الـ common bile duct (CBD) بسهم، فدوّر على القناة اللي بتضيق فجأة.

          الصورة بتثبت ليه MRCP في عيان زي ده: القنوات والتسريب باينين في صورة واحدة من غير أي تدخّل.
