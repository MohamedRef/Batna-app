  - id: geri.L06.lesson4
    title: "الـ hyperthyroidism الهادي: apathetic وT3 toxicosis"
    hook: "الشاب بيرتعش وبيعرق. الكبير بيبقى مكتئب، خاسس، وعنده AF بطيئة. نفس المرض، وش تاني."
    minutes: 9
    pages: [100, 102]
    topics: [hyper, hyper-diagnosis]
    goals:
      - "تعرف أسباب الـ hyperthyroidism عند الكبير والـ amiodarone"
      - "تشرح T3 وT4 toxicosis"
      - "تعرف الـ presentations الـ atypical وحدود الفحص والـ scan"
    status: unverified
    steps:
      - kind: explain
        page: 100
        quote: "Graves' disease is the most common cause of hyperthyroidism in all age groups, but the incidence of toxic multinodular goitre increases with age"
        title: "الأسباب"
        text: |
          - ==Graves'== أشهر سبب في كل الأعمار.
          - **Toxic multinodular goitre** بيزيد مع السن، وأكتر لو اليود قليل.
          - **Jod-Basedow** (iodine-induced): أكتر عند الكبار من **amiodarone**، mucolytics، وradiocontrast dyes.
      - kind: explain
        page: 100
        quote: "Amiodarone causes two types of thyroid disease; multinodular goitre and destructive thyroiditis."
        title: "الـ amiodarone"
        text: |
          الـ ==amiodarone== first-line في الـ AF، فلازم تنتبه:
          - بيعمل نوعين: **multinodular goitre** و**destructive thyroiditis**.
          - الاتنين **self-limiting**، بس الشديد يحتاج **high-dose glucocorticoids**، antithyroid drugs، وأحيانًا surgery.
          - وقفه مش هيحسّن بسرعة لأن الـ **T½** طويل، وممكن ماينفعش توقفه أصلًا بسبب القلب.
      - kind: figure
        page: 101
        quote: "T3 toxicosis is an isolated elevation of T3 with suppressed TSH, which is seen in up to 10% of the elderly thyrotoxic patients."
        title: "T3 toxicosis ولا T4 toxicosis؟"
        alt: "Two panels. T3 toxicosis: a toxic nodule pours out T3; T3 high, T4 normal, TSH suppressed. T4 toxicosis: the gland makes T4 but illness blocks 5-prime deiodinase so T4 high, T3 normal or low."
        caption: "الـ T3 toxicosis من nodule بتطلّع T3 كتير (لحد 10%، تقريبًا في الكبار بس). الـ T4 toxicosis لما مرض تاني يمنع الـ 5′-deiodinase فالـ T4 مايتحولش لـ T3."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="T06a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
              <marker id="T06b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="10" y="10" width="310" height="110" rx="8" class="fg-acc"/>
            <text x="20" y="32" class="t-b">T3 toxicosis</text>
            <text x="20" y="54" class="t-sm">Toxic nodule / toxic MNG</text>
            <path d="M190 50H240" class="fg-arrow-acc" marker-end="url(#T06a)"/>
            <text x="250" y="55" class="t-b t-acc">T3 ↑↑</text>
            <text x="20" y="80" class="t-sm">T4: normal · TSH: suppressed</text>
            <text x="20" y="104" class="t-sm t-mut">up to 10%, almost only elderly</text>
            <rect x="10" y="135" width="310" height="115" rx="8" class="fg-bad"/>
            <text x="20" y="157" class="t-b">T4 toxicosis</text>
            <text x="20" y="180" class="t-sm">T4 ↑</text>
            <path d="M60 176H150" class="fg-arrow-bad" marker-end="url(#T06b)"/>
            <text x="160" y="180" class="t-sm">T3 normal or low</text>
            <text x="20" y="205" class="t-sm">Non-thyroidal illness blocks</text>
            <text x="20" y="225" class="t-sm t-b">5′-deiodinase (T4 → T3)</text>
          </svg>
      - kind: explain
        page: 101
        quote: "The term \"apathetic thyrotoxicosis\" is used to describe the symptoms of elderly hyperthyroidism who present with depression, lethargy and weight loss."
        title: "الوش التاني"
        text: |
          الـ tremor والـ palpitation والـ heat intolerance ممكن **مايكونوش موجودين**. بدلهم:
          - ==Apathetic thyrotoxicosis==: **depression**، **lethargy**، **weight loss**.
          - **Thyrotoxic encephalopathy**: agitation وconfusion.
          - **Anorexia** وweight loss يتلخبطوا مع **malignancy**.
          - postmenopausal **osteoporosis** تسوء.
          - **AF with slow ventricular rate** في لحد **20%**.
          - **angina** أو **heart failure**.
          - fatigue، weakness، dementia، myopathy يتنسبوا للسن.
      - kind: aside
        tone: joke
        page: 101
        quote: "Most thyrotoxic patients have decreased appetite and weight loss and may be mistaken for an underlying malignancy."
        text: "الشاب الـ thyrotoxic بياكل التلاجة وبيخس. الكبير الـ thyrotoxic مش عايز ياكل خالص وبيخس، والعيلة تعمله **CT** عن **malignancy** قبل ما حد يطلب **TSH** بخمسين جنيه."
      - kind: explain
        page: 102
        quote: "If free T4 levels are normal with a suppressed TSH, the free T3 level is estimated to rule out T3 toxicosis."
        title: "التشخيص"
        text: |
          - **الفحص**: الغدة غالبًا مش محسوسة. لو محسوسة: diffuse = Graves'، nodular كبيرة = toxic MNG.
          - **FT4 ↑ + TSH ↓** = primary hyperthyroidism.
          - **FT4 normal + TSH suppressed** ← اطلب ==free T3== (T3 toxicosis).
          - **Isolated low TSH**: glucocorticoids أو nonthyroidal illness.
          - **Thyroid antibodies** ترجّح Graves'.
      - kind: explain
        page: 102
        quote: "Nuclear uptake is normal in up to 30% of the elderly patients with Graves' disease and in up to 70% toxic multinodular goiter"
        title: "الـ nuclear scan أقل فايدة"
        text: |
          الـ ==uptake== بيبقى **normal** في لحد **30%** من الـ Graves' و**70%** من الـ toxic MNG عند الكبار، فمش بيستبعد.

          - **Decreased uptake**: thyroiditis، أو amiodarone، أو iodinated dye.
          - مهم لما تخطط لـ **radioiodine**.
      - kind: check
        page: 102
        quote: "If free T4 levels are normal with a suppressed TSH, the free T3 level is estimated to rule out T3 toxicosis."
        question: "TSH suppressed, FT4 normal, 76-year-old with a toxic nodule. Next?"
        options: ["Free T3", "Nuclear scan to rule out hyperthyroidism", "Start levothyroxine", "Reassure: normal FT4"]
        answer: 0
        why:
          - "صح: الـ free T3 علشان الـ T3 toxicosis."
          - "الـ scan normal في نسبة كبيرة ومش بيستبعد."
          - "الـ TSH واطي: الاتجاه الغلط."
          - "الـ FT4 الطبيعي مايستبعدش الـ T3 toxicosis."
      - kind: try
        items: [geri.L06.049, geri.L06.053, geri.L06.055, geri.L06.060]
    recap:
      - "Graves' الأشهر؛ toxic MNG بيزيد مع السن؛ Jod-Basedow من amiodarone وcontrast."
      - "Amiodarone: MNG أو destructive thyroiditis؛ الـ T½ طويل."
      - "T3 toxicosis: nodule، لحد 10%. T4 toxicosis: illness يمنع 5′-deiodinase."
      - "Apathetic: depression، lethargy، weight loss؛ AF بطيئة لحد 20%."
      - "FT4 normal + TSH ↓ ← free T3. الـ scan normal في 30% Graves' و70% MNG."
    practice: [geri.L06.049, geri.L06.050, geri.L06.051, geri.L06.052, geri.L06.053, geri.L06.054, geri.L06.055, geri.L06.056, geri.L06.057, geri.L06.058, geri.L06.059, geri.L06.060, geri.L06.061, geri.L06.062, geri.L06.063, geri.L06.064, geri.L06.086, geri.L06.087]
