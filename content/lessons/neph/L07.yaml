            <rect x="120" y="104" width="160" height="20" rx="4" class="fg-dot-good"/>
            <text x="300" y="119" text-anchor="end" class="t-sm t-b">80%</text>
            <rect x="5" y="140" width="320" height="38" rx="8" class="fg-box"/>
            <text x="15" y="164" class="t-sm t-b">Kidney disease</text>
            <rect x="120" y="149" width="90" height="20" rx="4" class="fg-dot-bad"/>
            <text x="300" y="164" text-anchor="end" class="t-sm t-b">&lt;50%</text>
            <rect x="5" y="185" width="320" height="38" rx="8" class="fg-bad"/>
            <text x="15" y="209" class="t-sm t-b">ESRD</text>
            <rect x="120" y="194" width="10" height="20" rx="4" class="fg-dot-bad"/>
            <text x="300" y="209" text-anchor="end" class="t-sm t-b">3–5%</text>
          </svg>
      - kind: explain
        page: 195
        title: "الـ EM: الـ GBM متآكل"
        quote: "(EM) EM is required to make the diagnosis. EM shows multiple irregular lucencies of the GBM, giving it a moth-eaten appearance (Fig. 46.16). Such lucencies also may be observed in the mesangium. These lucent areas sometimes contain cross-banded collagen fibrils, which are more easily observed after staining with phosphotungstic acid (Fig. 46.17)."
        text: |
          الـ LM مش بيقول حاجة (FSGS أو mesangial أو طبيعي)، فلازم ==EM==: glomerular basement membrane (GBM) فيه فراغات كتير = **moth-eaten**، وجوّاها **cross-banded collagen fibrils** (تبان أحسن بالـ **phosphotungstic acid**).

          **العلاج**: مفيش خاص. **مش بيرجع في الكلية المزروعة**، بس افحص المتبرع القريب كويس لأنه autosomal dominant (AD).

          ليه المرض ما بيرجعش في الكلية المزروعة؟ التفسير المقبول (مش في الكتاب): العيب في جين الـ podocyte نفسه (LMX1B)، والكلية المزروعة جايّة بـ podocytes من المتبرع وجيناتها سليمة. يعني مفيش حاجة في دم المريض بتهاجم الكلية الجديدة، عكس أمراض زي الـ FSGS اللي فيها factor في الدم. وليه نفحص المتبرع القريب؟ لأنه AD، فاحتمال إنه شايل المرض 50%.
      - kind: figure
        page: 195
        quote: "(EM) EM is required to make the diagnosis. EM shows multiple irregular lucencies of the GBM, giving it a moth-eaten appearance (Fig. 46.16). Such lucencies also may be observed in the mesangium. These lucent areas sometimes contain cross-banded collagen fibrils, which are more easily observed after staining with phosphotungstic acid (Fig. 46.17)."
        title: "الـ moth-eaten GBM في الـ NPS"
        image: { file: neph/L07-nps-moth-eaten-em.webp, book: true }
        alt: "Book electron micrograph in nail-patella syndrome: a double-headed arrow labelled GBM spans a thickened glomerular basement membrane full of irregular pale lucencies, between the urinary space (US) above and the capillary lumen (CL) below."
        caption: |
          - **فوق**: **US** = urinary space، و**تحت**: **CL** = capillary lumen.
          - **السهم الرأسي (GBM)**: بيقيس الـ GBM بينهم: تخين ومليان ==فراغات فاتحة مش منتظمة==.

          ده الـ **moth-eaten** GBM (زي القماش اللي العتة أكلته)، وده اللي بيعمل التشخيص في الـ ==nail-patella syndrome== لأن الـ light microscopy مش بيقول حاجة.
      - kind: figure
        page: 196
        title: "الـ collagen fibrils في الـ NPS"
        image: { file: neph/L07-nps-collagen-fibrils-em.webp, book: true }
        alt: "Book electron micrograph after phosphotungstic acid staining in nail-patella syndrome: black and white arrows point to dark cross-banded collagen fibrils inside the lucent areas of the glomerular basement membrane, next to the urinary space (US)."
        caption: |
          صورة EM بعد صبغة **phosphotungstic acid**: الأسهم السودا والبيضا بتشاور على ==خيوط غامقة مخططة== جوّه فراغات الـ GBM، وتحت يمين **US** (urinary space).

          دي الـ **cross-banded collagen fibrils**: ==علامة الـ NPS== تحت الـ EM.
      - kind: reveal
        page: 195
        quote: "Light microscopy findings in NPS are nonspecific and may demonstrate FSGS, mild mesangial hypercellularity, or no changes, in which case EM is required to make the diagnosis."
        prompt: "ليه الـ NPS لازم يتشخّص بالـ EM مش بالـ LM؟"
        answer: |
          الكتاب: الـ LM **nonspecific**: FSGS، أو mesangial hypercellularity خفيفة، أو **ولا حاجة**.

          التفسير المقبول (مش في الكتاب): العيب في **تركيب الـ GBM نفسه** (فراغات وألياف collagen ما ينفعش تبقى هناك)، والحاجات دي أصغر من إن الـ LM يشوفها. الـ ==EM== بس بيشوف الـ **moth-eaten GBM** والـ **cross-banded collagen fibrils**، وده اللي بيقول NPS مش أي FSGS.
      - kind: match
        page: 195
        quote: "(EM) EM is required to make the diagnosis. EM shows multiple irregular lucencies of the GBM, giving it a moth-eaten appearance (Fig. 46.16). Such lucencies also may be observed in the mesangium. These lucent areas sometimes contain cross-banded collagen fibrils, which are more easily observed after staining with phosphotungstic acid (Fig. 46.17)."
        prompt: "وصّل كل مرض بشكله في الـ EM:"
        pairs:
          - ["Alport syndrome", "Basket-weave GBM"]
          - ["Thin basement membrane", "Diffusely thin GBM"]
          - ["Fabry disease", "Zebra bodies in podocytes"]
          - ["Nail-patella syndrome", "Moth-eaten GBM with collagen fibrils"]
        why: "الأربعة وراثيين وكلهم بيتشخّصوا بالـ ==EM==. احفظهم كصورة: سبت، رفيع، zebra، متآكل."
      - kind: aside
        tone: joke
        page: 196
        quote: "The patellae are absent or hypoplastic in more than 90% of patients with NPS, which may be associated with knee joint effusions and osteo-arthritis (Fig. 46.14).49,50 In about 80% of patients, osseous processes project posteriorly from the iliac wings (iliac horns), which is pathog-nomonic (Fig. 46.15). Anomalies of the elbows include aplasia, hypo-plasia, and posterior processes at the distal end of the humeri."
        text: "العيان الوحيد اللي عنده **قرون** ومن غير **صابونة رُكبة** في نفس الوقت. لو شفت **iliac horns** على الـ X-ray، خلاص قول ==nail-patella== وانت مطمّن."
