  # Split from lesson1 on 2026-11-13 (#828): etiology and pathogenesis
  # (pp177-178).
  - id: hem.L11.lesson6
    title: "ليه بيحصل، وإزاي بياكل العضم؟"
    hook: "إشعاع من 15 سنة، stroma بتأكّله IL-6، و osteoclasts شغالة من غير حد يوقفها."
    minutes: 8
    pages: [177, 178]
    topics: [etiology, pathogenesis]
    goals:
      - "تحفظ أقوى risk factor والأمراض اللي بتسبقه"
      - "تفهم ليه الـ myeloma بيعيش في النخاع: IL-6"
      - "تشرح ليه العضم بيتهد وما بيتبنيش"
    status: unverified
    steps:
      - kind: explain
        remind: [hem.L11.017]
        page: 177
        quote: "Exposure to ionizing radiation 10 - 15 years prior to diagnosis (the most convincing risk factor)"
        title: "السبب؟ مش معروف، بس فيه متهمين"
        text: |
          الكتاب: **largely unknown**، وفيه **genetic predisposition** و **environmental factors**.
          - أقوى متهم: ==ionizing radiation== قبل التشخيص بـ **10–15 سنة** (the most convincing).
          - شغل الزراعة (grain dusts، aflatoxins)، **benzene (possible)**، وأدوية زي phenytoin و phenobarbital و diazepam و propranolol و ibuprofen و diet drugs.
          - **Familial occurrence**: established.
          - أمراض قبله: polymyositis/dermatomyositis، systemic sclerosis، autoimmune haemolytic anaemia (AIHA)، pernicious anaemia، ankylosing spondylitis. الـ rheumatoid arthritis (RA): الدراسات مختلفة.

          التفسير المقبول (مش في الكتاب): الإشعاع بيكسّر الـ DNA، والطفرة محتاجة سنين لحد ما تبان (عشان كده الـ 10–15 سنة). والأمراض المناعية بتخلّي الـ B cells **متنشّطة طول الوقت**، وكل ما تنقسم أكتر، فرصة غلطة تطلّع clone أكبر.
      - kind: aside
        tone: exam
        page: 177
        quote: "Exposure to ionizing radiation 10 - 15 years prior to diagnosis (the most convincing risk factor)"
        text: "لو السؤال قال \"the most convincing risk factor\" فالإجابة radiation، مش benzene (اللي الكتاب كاتبه possible بس)."
      - kind: check
        page: 177
        quote: "Exposure to ionizing radiation 10 - 15 years prior to diagnosis (the most convincing risk factor)"
        question: "Which is the most convincing risk factor for multiple myeloma in the book?"
        options: ["Ionizing radiation 10–15 years before", "Benzene exposure", "Rheumatoid arthritis", "Phenytoin therapy"]
        answer: 0
        why:
          - "صح: الكتاب بيقول the most convincing risk factor."
          - "الـ benzene مكتوب possible بس."
          - "الـ RA الدراسات فيه مختلفة."
          - "الـ phenytoin في قايمة الأدوية، مش الأقوى."
      - kind: explain
        page: 178
        quote: "Premyeloma cells, by means of adhesion molecules, home to the bone marrow\nAdhesion of MM cells to BMSCs triggers secretion in BMSCs of IL-6, the major cytokine mediating MM cell growth, survival, and resistance to drug"
        title: "إزاي بيعيش في النخاع؟"
        text: |
          الـ **premyeloma cells** بتروح النخاع بالـ **adhesion molecules**.

          لما تلزق في الـ **bone marrow stromal cells (BMSCs)**، الـ stroma تفرز ==IL-6==: الـ cytokine الأساسي اللي بيخلّي الـ myeloma **يكبر** و**يعيش** و**يقاوم العلاج**.

          ده بيشرح حاجتين: ليه الـ myeloma بيفضل **في النخاع** (هناك أكله)، وليه لما يسيبه ويطلع الدم (plasma cell leukaemia) ده معناه clone بقى مستقل وأخطر. وكمان ليه الـ **CRP** بيتقاس في الـ myeloma: الكتاب بيقول إنه surrogate للـ IL-6 (ص 180).
      - kind: figure
        page: 178
        quote: "Proposed osteoclast-activating factors include lymphotoxin, TNF-α, hepatocyte growth factor, IL-6, IL-1, metalloproteinases 1, 2, 9, RANKL, insulin-like growth factor binding protein 4 (IGF4) and macrophage inflammatory protein-1α"
        title: "الحلقة المفرغة في النخاع"
        alt: "A cycle. A myeloma cell sticks to a stromal cell by adhesion molecules. The stromal cell secretes IL-6, which feeds the myeloma cell. The myeloma cell and stroma release osteoclast-activating factors such as RANKL, TNF-alpha, IL-1 and MIP-1 alpha, which switch on osteoclasts that eat bone, giving lytic lesions and high calcium."
        caption: "الـ myeloma بيأكّل نفسه بالـ IL-6، وبيشغّل الـ osteoclasts تاكل العضم: lytic lesions و calcium عالي."
        svg: |
