  - id: geri.L11.lesson5
    title: "البخاخة المناسبة للإيد المناسبة"
    hook: "أحسن دوا في الدنيا مالوش لازمة لو الحاج مش عارف يشده. في الكبار، الجهاز نص العلاج."
    minutes: 10
    pages: [206, 208]
    topics: [stable, devices]
    goals:
      - "تعرف الـ short و long-acting bronchodilators وإمتى وليه"
      - "تعرف مكان الـ inhaled corticosteroid (ICS) وآثاره"
      - "تختار الجهاز المناسب للكبير"
    status: unverified
    steps:
      - kind: explain
        page: 206
        quote: "Short-Acting Bronchodilators:\n  SABA (short acting beta agonist).\n  Albuterol {Salbutamol).\n  Inhaler.\n  Nebulizer, for older patients who have difficulties using handheld inhalers rescue therapy (as needed, rather than regularly scheduled).\nAnticholinergic SAMA (short acting muscarinic antagonist):\n  Ipratropium is a short-acting inhaled bronchodilator.\n  MDI (metered dose inhaler).\n  Nebulizer.\n  Caution: (glaucoma ,urine retention,CVS)."
        title: "الـ short-acting"
        text: |
          - **short-acting beta-2 agonist (SABA)** (albuterol/salbutamol): inhaler أو nebulizer للكبار اللي صعب عليهم البخاخة. ==rescue== (prn)، مش بمواعيد.
          - **short-acting muscarinic antagonist (SAMA)** (ipratropium): metered dose inhaler (MDI) أو nebulizer. **Caution**: glaucoma، urine retention، cardiovascular system (CVS).

          ليه التحذيرات دي؟ التفسير المقبول (مش في الكتاب): الـ anticholinergic بيوسّع حدقة العين فممكن يقفل زاوية الـ glaucoma، وبيرخّي عضلة المثانة فالراجل اللي عنده prostate كبيرة ممكن يحتبس، وبيسرّع القلب.
      - kind: explain
        page: 206
        quote: "Long acting bronchodilators used as maintenance therapy for:\n  Persons whose symptoms are Not adequately controlled with one or both classes of short-acting bronchodilator(s).\n  Those who are frequent exacerbators (Two or more symptom-defined exacerbations per year).\n  Or those who have moderate-to-severe airflow obstruction."
        title: "الـ long-acting"
        text: |
          - **long-acting beta-2 agonist (LABA)**: indacaterol، olodaterol، vilanterol.
          - **long-acting muscarinic antagonist (LAMA)**: aclidinium، tiotropium، umeclidinium.

          ليه long-acting؟ عشان بتفتح الشُعب 12 لـ 24 ساعة بشكل ثابت، بدل ما المريض يطارد الأعراض بالـ rescue.

          **إمتى maintenance؟**
          - الأعراض مش متظبطة على الـ short-acting.
          - ==Frequent exacerbators== (2 أو أكتر في السنة).
          - Moderate-to-severe obstruction.

          الـ long-acting متاحة بالـ handheld inhalers بس؛ الـ nebulized منها **LABA مرتين في اليوم** (arformoterol، formoterol)، ومش للـ acute. الـ anticholinergic الـ nebulized short-acting بس (ipratropium 4 مرات).
      - kind: aside
        tone: trap
        page: 207
        quote: "NOTE when LAMA is prescribed the short acting anticholinergic is discontinued."
        text: "فخ: لما تبدأ LAMA (tiotropium)، **وقّف** الـ ipratropium. اتنين anticholinergic مع بعض = side effects مضاعفة على نفس الـ glaucoma والـ prostate."
      - kind: explain
        remind: [geri.L11.087]
        page: 207
        quote: "Inhaled Corticosteroids (ICS)\nLong-term treatment with inhaled corticosteroids (ICS) for:\n  Patients with more severe airflow obstruction.\n  Frequent exacerbators not adequately managed by (LABA) or (LAMA).\nNOTE Single therapy with ICS is not recommended in COPD as it is less effective than ICS + LABA.\nThe duration of therapy of ICS is often life long, leading to long exposures.\nSignificant localized deposition of ICSs occurs in the oropharynx:\n  Poor inhaler technique may increase the risk for localized adverse drug effects.\n  Older adults who forget to rinse, gargle, and spit after using their ICS are more likely to develop dysphonia and/or candidiasis, allergic contact dermatitis of the mouth, nostrils and eyes.\nSystemic adverse effects of ICS: decreased bone mineral density, cataract (posterior subcapsular) and pneumonia."
        title: "الـ ICS"
        text: |
          **لمين؟** obstruction أشد، أو frequent exacerbators مش متظبطين على LABA أو LAMA.

          - ==ICS لوحده لأ==: أضعف من ICS + LABA.
          - غالبًا مدى الحياة، فالتعرّض طويل.
          - **Local**: ترسيب في الـ oropharynx؛ اللي بينسى يشطف ويغرغر ويتف بيجيله **dysphonia**، **candidiasis**، contact dermatitis للبق والمناخير والعين.
          - **Systemic**: bone density أقل، **posterior subcapsular cataract**، **pneumonia**.

          ليه الشطف؟ عشان جزء كبير من الدوا بيقعد في الزور بدل ما يوصل الرئة، وهناك بيضعّف المناعة الموضعية فالـ candida تطلع، وبيأثر على الأحبال الصوتية. الشطف والتف بيشيلوه قبل ما يتبلع ويتمص.
      - kind: reveal
        page: 207
        quote: "NOTE Single therapy with ICS is not recommended in COPD as it is less effective than ICS + LABA."
        prompt: "في الـ asthma الـ ICS هو الأساس. ليه في الـ COPD الـ ICS لوحده ممنوع؟"
        answer: |
          الكتاب: **single therapy with ICS** مش recommended لأنه **أضعف من ICS + LABA**.

          التفسير المقبول (مش في الكتاب): الالتهاب في أغلب الـ COPD نوعه مختلف عن الـ asthma (neutrophils أكتر من eosinophils)، فبيستجيب للـ steroid أقل، والمشكلة الأساسية ضيق ثابت محتاج bronchodilator. الاستثناء اللي الكتاب نفسه بيلمّح له: الـ **COPD-asthma overlap** اللي فيه eosinophilia و**enhanced response to inhaled corticosteroids**.
