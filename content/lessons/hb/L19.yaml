      - kind: check
        page: 378
        quote: "Most sludge is asymptomatic and disappears when the primary condition resolves."
        question: "A woman on TPN for 3 weeks has sludge on ultrasound and no pain. What usually happens to it, according to the book?"
        options:
          - "It disappears when the primary condition resolves"
          - "It always becomes stones within a year"
          - "It needs cholecystectomy once seen"
          - "It is made of cholesterol crystals only"
        answer: 0
        why:
          - "صح: **most sludge is asymptomatic and disappears when the primary condition resolves**. أول ما ترجع تاكل بالبُق، المرارة ترجع تنقبض وتفضى."
          - "ممكن يكبر ويبقى حصوة، بس ده مش القاعدة."
          - "مفيش عملية لـ sludge صامت؛ الكتاب بيقول معظمه بيختفي."
          - "الـ sludge = Ca bilirubinate + cholesterol microcrystals + mucin، مش cholesterol بس."
      - kind: explain
        page: 379
        quote: "The excess cholesterol must precipitate from solution as solid microcrystals. Such precipitation in the gallbladder is accelerated by mucin, a glycoprotein, or other proteins in bile."
        title: "الـ nucleation خطوة بخطوة"
        text: |
          الكتاب بيقسم الـ ==nucleation== لخطوتين:

          - **Precipitation**: الـ cholesterol الزيادة لازم يترسّب كـ **microcrystals**. الترسيب ده بيسرّعه الـ **mucin** (glycoprotein) وبروتينات تانية في الـ bile.
          - **Aggregation and growth**: البلورات لازم تتلم وتكبر. الـ mucin بيعمل **scaffold** (نواة) تتلم عليها. والمرارة بتحجزها جوّاها، لأن الـ cholesterol الزيادة نفسه بيضعف انقباضها.

          يعني الـ cholesterol بيعمل المشكلة، وكمان بيقفل باب الهروب.

          الـ ==nucleating factors== الستة:
          - **Specific heat-labile glycoproteins**
          - **GB mucus**
          - **Biliary calcium**
          - تغيير في **GB prostaglandin metabolism**
          - **GB stasis**
          - **Altered GB absorption**

          ولاحظ إن الـ stasis موجودة في التلات خطوط: هي اللي بتعمل الـ sludge، وهي nucleating factor، وهي اللي بتسيب الحصوة تكبر.
      - kind: reveal
        page: 379
        quote: "Once cholesterol crystals begin to agglomerate and form clusters the stones are inevitable (about 2mm /yr)."
        prompt: "ليه الكتاب بيقول إن أول ما البلورات تتجمع، الحصوة بقت **inevitable**؟"
        answer: |
          لأن الـ cluster نفسه بقى نواة جاهزة. كل cholesterol زيادة بيترسّب عليها، والمرارة الضعيفة مش قادرة تطردها.

          من هنا الحصوة بتكبر ببطء:
          - صفحة 379: **about 2 mm/yr**
          - صفحة 380: ==about 1–2 mm/yr==، وبتاخد 5–20 سنة لحد ما تكبر كفاية تعمل مشاكل.

          وده بيفسّر حاجة مهمة: أغلب الحصوات بتتلاقي صدفة في ناس عندهم سنين من غير أعراض.
      - kind: aside
        tone: analogy
        page: 379
        quote: "The microcrystals must aggregate and grow. This is facilitated by the binding effect of mucin forming a scaffold (nucleous) and retention in the gallbladder (impaired contractility from the excess cholesterol in bile)."
        text: |
          تخيّل كوباية شاي فيها سكر زيادة عن اللزوم: دي الـ bile الـ **supersaturated**.

          - لو قلّبتها على طول (مرارة شغالة وبتفضى)، السكر يفضل سايب.
          - سيبها راكدة على الترابيزة (**stasis**)، ووقعت فيها فتفوتة بسكوت (**mucin** = nucleus).
          - بعد شوية هتلاقي السكر اتبلور حوالين الفتفوتة.

          دي الحصوة بالظبط: سكر زيادة، ونواة، وركود.
      - kind: mnemonic
        page: 379
        quote: "Biliary parasites commonly associated with cholelithiasis are: Fascioliasis Ascariasis Schistosomiasis Clonorichiasissinsesis( Precancerous) There are three types of stones that are as follows: (i) Cholesterol stones. (ii) Pigment stones (brown/black). (iii) Mixed stones."
        word: "FACS"
        parts:
          - { key: "F", text: "Fascioliasis" }
          - { key: "A", text: "Ascariasis" }
          - { key: "C", text: "Clonorchiasis (Clonorchis sinensis): precancerous" }
          - { key: "S", text: "Schistosomiasis" }
        hook: |
          الـ **biliary parasites** المرتبطة بالحصوات هي الـ FACS (الحقايق).

          والحقيقة الأخطر فيهم الـ C: الكتاب كاتب جنب **Clonorchis sinensis** إنها **precancerous**.

          ومنطقي إن الطفيليات تعمل حصوات: بتعمل infection و inflammation و stasis في الـ ducts، ودي نفس ظروف الـ brown pigment stones اللي هنشوفها في الدرس الجاي.
      - kind: try
        items: [hb.L19.012, hb.L19.013, hb.L19.016, hb.L19.017, hb.L19.019]
    recap:
      - "4 predisposing factors: impaired GB function، supersaturated bile، nucleating factors، والـ enterohepatic circulation of bile acids."
      - "الـ sludge = Ca bilirubinate + cholesterol microcrystals + mucin، بيتكوّن مع الـ stasis زي الـ pregnancy والـ TPN، ومعظمه بيختفي."
      - "الـ nucleation: precipitation بيسرّعها الـ mucin، وبعدين aggregation على scaffold؛ ولما البلورات تتجمع الحصوة inevitable."
      - "الطفيليات: **FACS**، والـ Clonorchis هي الـ precancerous."
