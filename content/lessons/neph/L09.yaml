  - id: neph.L09.lesson7
    title: "HLA والـ rejection والأدوية اللي بتحمي الكلية"
    hook: "الجسم شايف الكلية الجديدة غريبة. إزاي بيهاجمها، وإزاي بنقنعه يسيبها؟"
    minutes: 10
    pages: [325, 336]
    topics: [hla, rejection, immunosuppression, is-complications]
    goals:
      - "تعرف الـ HLA classes والـ cross-match والـ acceptable mismatch"
      - "تفرّق الـ direct والـ indirect allorecognition وأنواع الـ rejection"
      - "تعرف الـ induction والـ protocol وعلاج الـ rejection ومضاعفات الـ immunosuppression"
    status: unverified
    steps:
      - kind: explain
        page: 325
        title: "الـ HLA"
        quote: "three class I HLA (A, B, C) that are present on all nucleated cells"
        text: |
          - **Class I** (A، B، C): على ==كل الخلايا اللي فيها نواة==.
          - **Class II** (DP، DQ، DR): على الـ **APCs** والـ lymphocytes بس.

          أهم 3 في الـ mismatch: ==HLA-A، -B، -DRB1==. والـ HLA متنوّع جدًا: حوالي 6000 class I وأكتر من 1500 class II alleles.

          الاسم زي **HLA-DRB1*0401**: أول رقمين serological، وآخر رقمين الـ PCR subtype.
      - kind: explain
        page: 328
        title: "الـ cross-match والـ mismatch"
        quote: "These are mismatched HLA antigens that do not result in a positive complement dependent cytotoxicity (CDC) crossmatch."
        text: |
          الـ ==acceptable mismatch== = HLA مختلف بس **ما بيعملش CDC cross-match موجب**، فمش هيعمل hyperacute rejection. وكل الـ **cross-match لازم يبقى سالب** قبل الزراعة.

          الـ mismatch بيأثر على ==long-term survival== مش على الـ early rejection. الأحسن HLA-identical (خصوصًا living related)، والأوحش cadaver عشوائي.

          **CDC-XM** قلّل الـ hyperacute بس ما بيقولش أنهي antigen. الـ **solid-phase** (ELISA، Luminex أحسن) حساس ويقيس كمية الـ antibodies.
      - kind: figure
        page: 328
        quote: "In the indirect pathway the incompatible MHC molecules of donor are processed into peptides"
        title: "Direct ضد indirect"
        alt: "Two stacked panels. Direct: a donor APC shows intact donor MHC; a recipient T cell binds it directly (class II to CD4, class I to CD8). Indirect: a recipient APC takes up donor MHC, cuts it into peptides and shows a donor peptide on self MHC to a recipient CD4 T cell."
        caption: "**Direct**: الـ T cell بتاع العيان شايف MHC المتبرع ==كامل== على خلية المتبرع. **Indirect**: خلايا العيان بتقطّع MHC المتبرع وتعرضه على ==self MHC==."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="5" width="320" height="115" rx="10" class="fg-box"/>
            <text x="15" y="26" class="t-b">Direct</text>
            <circle cx="62" cy="75" r="32" class="fg-acc"/>
            <text x="62" y="72" text-anchor="middle" class="t-sm">Donor</text>
            <text x="62" y="86" text-anchor="middle" class="t-sm">APC</text>
            <rect x="100" y="66" width="28" height="18" rx="3" class="fg-bad"/>
            <text x="114" y="60" text-anchor="middle" class="t-sm t-bad">MHC</text>
            <circle cx="170" cy="75" r="30" class="fg-good"/>
            <text x="170" y="79" text-anchor="middle" class="t-sm">T cell</text>
            <text x="210" y="62" class="t-sm">II → CD4</text>
            <text x="210" y="80" class="t-sm">I → CD8</text>
            <text x="210" y="98" class="t-sm t-mut">intact donor MHC</text>
            <rect x="5" y="135" width="320" height="120" rx="10" class="fg-box"/>
            <text x="15" y="156" class="t-b">Indirect</text>
            <circle cx="62" cy="205" r="32" class="fg-good"/>
            <text x="62" y="201" text-anchor="middle" class="t-sm">Recip.</text>
            <text x="62" y="215" text-anchor="middle" class="t-sm">APC</text>
            <rect x="100" y="196" width="28" height="18" rx="3" class="fg-acc"/>
            <circle cx="114" cy="190" r="5" class="fg-dot-bad"/>
            <text x="114" y="176" text-anchor="middle" class="t-sm t-mut">self MHC</text>
            <circle cx="170" cy="205" r="30" class="fg-good"/>
            <text x="170" y="209" text-anchor="middle" class="t-sm">CD4</text>
            <text x="210" y="198" class="t-sm">donor MHC</text>
            <text x="210" y="216" class="t-sm">as peptide</text>
          </svg>
      - kind: explain
        page: 329
        title: "خطوات الـ rejection وأنواعه"
        quote: "delayed type hypersensitivity, cell-mediated cytotoxicity,and alloantibody-mediated cytotoxicity"
        text: |
          الـ alloimmune response **قوي ومش محتاج priming**: T cells كتير جاهزة تتعرف على MHC غريب.

          **الخطوات**: recognition (direct أو indirect) ← **CD4 activation** (cytokines و clonal expansion) ← CD4 يساعد CD8 والـ macrophages والـ B cells ← effector: ==DTH، cell-mediated cytotoxicity، alloantibody==.

          **قبل الزراعة**: ABO، cross-match، HLA typing، و **PRA**.
      - kind: table
        page: 330
        quote: "Minutes to hours Preexisting antibodies (IgG) Intravascular thrombosis"
        title: "أنواع الـ rejection"
        columns: [Type, Timing, Mechanism]
        rows:
          - ["Hyperacute", "Minutes–hours", "Pre-existing IgG, thrombosis"]
          - ["Acute", "Days–weeks", "CD4 + CD8, antibodies"]
          - ["Chronic", "6 months–years", "Fibrosis, arteriosclerosis"]
        hide: [[0, 1], [0, 2], [1, 1], [2, 2]]
      - kind: case
        page: 330
        quote: "Hx of blood transfusion, transplantation or multiple pregnancies."
        stem: "A woman with 4 pregnancies and many transfusions gets a kidney. One hour after reperfusion it turns blue and stops."
        steps:
          - question: "Type of rejection?"
            options: ["Hyperacute", "Acute cellular", "Chronic", "Recurrence"]
            answer: 0
            why: "دقايق لساعات + antibodies موجودة قبل كده (حمل ونقل دم) + thrombosis = hyperacute."
          - question: "Which pre-transplant test is meant to prevent this?"
            options: ["CDC cross-match", "Kt/V", "PET", "Doppler of the fistula"]
            answer: 0
            why: "الـ CDC cross-match قلّل الـ hyperacute rejection، ولازم يبقى سالب."
      - kind: aside
        tone: exam
        page: 331
        quote: "have a significantly greater risk of antibody-mediated rejection (AMR) and early graft loss"
        text: |
          **Flow cross-match موجب + CDC سالب** = خطر ==AMR== و early graft loss أعلى بكتير، بـ PPV 83%. يعني الـ CDC السالب لوحده مش ضمان.
      - kind: explain
        page: 331
        title: "الـ immunosuppression"
        quote: "Sparing cyclosporine and tacrolimus nephrotoxicisty."
        text: |
          3 مراحل: **induction**، **maintenance**، و **anti-rejection**.

          **ليه induction؟** rejection prophylaxis، علاج subclinical rejection أو rejection مستخبي ورا الـ early graft dysfunction، ==تقليل الـ CNI nephrotoxicity==، و tolerance.

          **KDIGO 2011**: ==IL-2RA== (basiliximab) first-line (1B)؛ **lymphocyte-depleting** (ATG) لو high immunologic risk (2B).

          **البروتوكول**: CNI (ciclosporin، tacrolimus) + steroids + adjuvant (azathioprine، MMF، sirolimus) + induction antibody + CCB + prophylaxis (TMP-SMX، CMV antivirals). والـ **mTORi** ما يبدأش إلا بعد ما الكلية تشتغل والجرح يلم (1B).
      - kind: order
        page: 334
        quote: "We recommend biopsy before treating acute rejection,unless the biopsy"
        prompt: "Acute cellular rejection (KDIGO 2011). رتّب:"
        steps:
          - "Biopsy (unless it delays treatment)"
          - "Corticosteroids"
          - "Add back maintenance prednisone if off steroids"
          - "Lymphocyte-depleting antibody if steroid-resistant"
        why: "Biopsy الأول (1C)، steroids (1D)، رجّع الـ prednisone لو مش واخده (2D)، ولو مقاوم أو متكرر: lymphocyte-depleting أو OKT3 (2C). والـ AMR: plasma exchange، IVIG، anti-CD20، أو lymphocyte-depleting."
      - kind: explain
        page: 335
        title: "التمن: toxicity وعدوى وسرطان"
        quote: "calcineurin inhibitors: nephrotoxicity, diabetes mellitus, hypertension"
        text: |
          - **CNI**: ==nephrotoxicity==، diabetes، hypertension.
          - **Steroids**: osteoporosis، peptic ulcer، hypertension، diabetes.
          - والـ immunodeficiency نفسه: **infection** و **malignancy**.
      - kind: figure
        page: 335
        title: "العدوى بعد الزراعة حسب الشهر"
        image: { file: neph/L09-infection-timeline.webp, book: true }
        caption: "**أول شهر** (conventional): HSV، wound، pneumonia، line، UTI، hepatitis B. **Months 1–6** (unconventional): ==CMV==، EBV، VZV، Pneumocystis، TB، Listeria، Aspergillus، Nocardia، Toxoplasma. **بعد كده**: Cryptococcus، CMV chorioretinitis، UTI أخف."
        alt: "Book timeline from transplant to 6 months: HSV in the first month; CMV onset from 1 to 4 months; EBV, VZV, papova and adenovirus from about 2 to 6 months; fungal, TB and Pneumocystis from 1 to 6 months; Listeria, Aspergillus, Nocardia and Toxoplasma from 1 month; Cryptococcus from 4 months; bacterial wound, pneumonia and line infections in the first month; hepatitis B early and non-A non-B hepatitis from 1 month; UTI with bacteraemia and relapse until 4 months and relatively benign after 6."
