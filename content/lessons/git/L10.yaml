      - kind: explain
        page: 278
        quote: "If the pressure after dilation is less than 10 mmHg, the outcome usually excellent. If it is more than 20 mmHg, the clinical outcome usually is poor"
        title: "بعد الـ balloon: قيس الضغط"
        text: |
          الـ ==pneumatic dilation== هي الـ **standard endoscopic therapy**، وأخطر مضاعفة **perforation** في 1-5%.

          وبعدها الضغط بيتنبأ بالنتيجة:
          - أقل من **10 mmHg** = excellent.
          - أكتر من **20 mmHg** = poor.

          ولو الحالة **refractory**: resection مع gastric pull-up أو colon interposition، أو gastrostomy.

          ليه الضغط بعد الـ dilation بيتنبأ؟ لأن الهدف كله إن الـ LES يبقى ضعيف كفاية إن الجاذبية تفضّي المريء. أقل من 10 يعني الألياف اتقطعت كويس والباب بقى مفتوح، وفوق 20 يعني العضلة لسه ماسكة.
