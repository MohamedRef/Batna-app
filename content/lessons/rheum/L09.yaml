  - id: rheum.L09.lesson2
    title: "الضعف والجلد والرئة والقلب"
    hook: "مش قادرة تقوم من على الكرسي ولا تسرّح شعرها، وجفونها بنفسجي: العضلة بتشتكي، والجلد بيقولك اسم المرض."
    minutes: 9
    pages: [166, 166]
    topics: [muscle, extramuscular]
    goals:
      - "تعرف شكل الضعف وليه proximal"
      - "تعرف علامات الجلد في الـ DM وتربطها بالـ antisynthetase"
      - "تفهم ليه القلب والرئة لازم تتدوّر عليهم"
    status: unverified
    steps:
      - kind: explain
        page: 166
        title: "شكل الضعف"
        quote: "Clinical Manifestations – Muscular Features The hallmark of IIM is symmetrical proximal muscle weakness, typically affecting:\n  The deltoids, hip flexors, and neck flexors.\n  Tasks such as rising from a chair, lifting objects, and combing hair become difficult.\n  In some subtypes (e.g., IBM), distal muscles may be involved.\n    Muscle pain is variable and often mild. In advanced disease, muscle atrophy and contractures may develop. Dysphagia, resulting from oropharyngeal and esophageal involvement, may also occur."
        text: |
          الـ hallmark: ==symmetrical proximal weakness==: **deltoids**، **hip flexors**، **neck flexors**.

          العيان يقولك: مش قادر **أقوم من الكرسي**، أشيل حاجة، أو **أسرّح شعري**.
          - الـ **IBM** ممكن يمسك **distal** كمان
          - الوجع **خفيف** ومتغير، وفي الآخر atrophy و contractures
          - **Dysphagia** من الـ oropharynx والـ esophagus
      - kind: reveal
        page: 166
        prompt: "ليه الضعف proximal، وليه ممكن يجيله dysphagia؟"
        quote: "Dysphagia, resulting from oropharyngeal"
        answer: |
          الكتاب: الـ hallmark **symmetrical proximal weakness** (deltoids، hip flexors، neck flexors)، والوجع **variable and often mild**، و **dysphagia** من الـ **oropharyngeal and esophageal involvement**.

          التفسير المقبول (مش في الكتاب):
          - العضلات الـ **proximal** كبيرة وشغالة طول الوقت ضد الجاذبية (تشيل الدراع، تقوّم الجسم)، فأي فقد في الألياف بيبان فيها **الأول**؛ والعيان بيحسه في **مهمة يومية** (الكرسي، الشعر) قبل ما يحسه في الإيد.
          - الـ **pharynx** والجزء العلوي من الـ **esophagus** فيهم ==skeletal muscle== زي الأطراف، فبيلتهبوا هما كمان؛ وده خطير لأن الأكل ممكن يروح للرئة (aspiration).
          - الوجع **خفيف** لأن المشكلة ضعف مش التهاب حاد؛ ولو الوجع هو الشكوى الأساسية، فكّر في حاجة تانية.
      - kind: aside
        tone: joke
        page: 166
        quote: "Tasks such as rising from a chair, lifting objects, and combing hair become difficult."
        text: |
          عيان الـ myositis زي موظف يوم الأحد: **القومة من الكرسي** أصعب حاجة في اليوم 😄. الفرق إن عنده **hip flexors** ملتهبة بجد، فاسأله عن **combing hair** والسلم.
      - kind: table
        page: 166
        quote: "Heliotrope rash (purple discoloration of eyelids).\nGottron's papules (scaly, erythematous plaques over joints)."
        title: "جلد الـ DM"
        columns: [Sign, Where]
        rows:
          - ["Heliotrope", "Purple eyelids"]
          - ["Gottron's papules", "Scaly red plaques over joints"]
          - ["Shawl and V-sign", "Photosensitive, shoulders and chest"]
          - ["Mechanic's hands", "Fissured hyperkeratotic palms"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: reveal
        page: 166
        prompt: "ليه علامات جلد الـ DM في الأماكن دي بالذات، وليه الـ mechanic's hands بتخليك تفتكر الرئة؟"
        quote: "Mechanics hands (hyperkeratotic, fissured skin on palms)."
        answer: |
          الكتاب بيقول علامات الجلد **primarily in DM**: heliotrope (جفون بنفسجي)، Gottron's papules (فوق المفاصل)، shawl و V-sign (**photosensitive** على الكتاف والصدر)، و mechanic's hands (كف خشن ومشقق).

          التفسير المقبول (مش في الكتاب):
          - الـ **shawl و V-sign** في الأماكن اللي الشمس بتيجي عليها، والكتاب نفسه بيقول **photosensitive**: يعني الشمس بتهيّج الالتهاب.
          - الـ **Gottron's** فوق المفاصل، الأماكن اللي الجلد فيها **بيتشد ويتحك** كل يوم.
          - الـ **DM** الـ mechanism بتاعه في الـ **capillaries** (ص 165)، والجلد مليان capillaries، عشان كده الـ rash **علامة الـ DM** مش الـ PM.
          - الـ **mechanic's hands** علامة مشهورة للـ ==antisynthetase syndrome==، والكتاب في نفس الصفحة بيقول الـ ILD **particularly in antisynthetase syndrome**. فلو شفت الإيد دي، اطلب صورة صدر.
      - kind: explain
        page: 166
        title: "الرئة والمفاصل والقلب"
        quote: "Pulmonary Involvement\n  Interstitial lung disease (ILD) is common, particularly in antisynthetase syndrome.\n  Can present with cough, dyspnea, and restrictive ventilatory defect.\n  Rapidly progressive ILD is associated with anti-MDA5 antibodies."
        text: |
          - **interstitial lung disease (ILD)** شائعة، خصوصًا في ==antisynthetase syndrome==: cough، dyspnoea، **restrictive** defect
          - **Rapidly progressive ILD** ← ==anti-MDA5==
          - المفاصل: arthralgia و **non-erosive** arthritis شبه الـ rheumatoid arthritis (RA)
          - القلب: arrhythmias، conduction defects، myocarditis، وغالبًا **subclinical** فاعمل **electrocardiogram (ECG) و echo**
      - kind: reveal
        page: 166
        prompt: "القلب في الـ IIM غالبًا ساكت. ليه الكتاب بيقول نعمل ECG و echo لكل عيان؟"
        quote: "May be subclinical and require ECG and echocardiographic screening."
        answer: |
          الكتاب: **arrhythmias**، **conduction defects**، و **myocarditis**، وبيقول ==may be subclinical== و **require ECG and echocardiographic screening**.

          التفسير المقبول (مش في الكتاب): القلب **عضلة** هو كمان، فالالتهاب اللي في الأطراف ممكن يمسكه. بس العيان مش هيشتكي، لأن الضعف العام مخبي الـ dyspnoea، ولأن الـ conduction defect ممكن يبقى صامت لحد ما يعمل **block** أو arrhythmia مفاجئة. يعني **subclinical** = مش موجود في الشكوى، مش = مش موجود. والـ screening رخيص (ECG)، والمضاعفة لو فاتتك ممكن تبقى موت مفاجئ.

          ونفس الفكرة في الـ **arthritis**: الكتاب بيقول **non-erosive**، بيقلّد الـ RA، فما تديش علاج RA وتنسى العضلة.
      - kind: check
        page: 166
        quote: "Interstitial lung disease (ILD) is common, particularly in antisynthetase syndrome."
        question: "A woman with DM has fissured, hyperkeratotic skin on her palms and new dyspnoea. Which complication should you look for first, per the book's page on extra-muscular features?"
        options:
          - "Interstitial lung disease"
          - "Erosive arthritis"
          - "Aortic regurgitation"
          - "Renal failure"
        answer: 0
        why:
          - "صح: الـ mechanic's hands مع ضيق نفس = فكّر في ILD، والكتاب بيقول إنها common خصوصًا في الـ antisynthetase syndrome."
          - "الكتاب بيقول الـ arthritis في الـ IIM non-erosive."
          - "مش من علامات الـ IIM في الكتاب."
          - "مش من الـ extra-muscular features في الصفحة دي."
      - kind: try
        items: [rheum.L09.015, rheum.L09.016, rheum.L09.019, rheum.L09.020, rheum.L09.022]
    recap:
      - "Symmetrical proximal weakness: deltoids، hip و neck flexors. IBM ممكن distal. Dysphagia = pharynx و esophagus."
      - "جلد الـ DM: heliotrope، Gottron's، shawl/V (photosensitive)، mechanic's hands."
      - "ILD شائعة خصوصًا antisynthetase؛ RP-ILD = anti-MDA5."
      - "المفاصل non-erosive؛ القلب subclinical فاعمل ECG و echo."
    practice: [rheum.L09.015, rheum.L09.016, rheum.L09.017, rheum.L09.018, rheum.L09.019, rheum.L09.020, rheum.L09.021, rheum.L09.022, rheum.L09.023, rheum.L09.040, rheum.L09.042, rheum.L09.045, rheum.L09.046]
