      - kind: explain
        page: 250
        title: "الـ systemic والـ musculoskeletal: ليه؟"
        quote: "Systemic\n Fever, fatigue, weight loss, susceptibility to infection.\n Musculoskeletal\n - Muscle wasting.\n - Tenosynovitis.\n - Bursitis.\n - Osteoporosis."
        text: |
          - **Fever، fatigue، weight loss**: الـ cytokines اللي اتعلمناها (IL-1، TNF، IL-6) مش بتفضل في المفصل، بتلف في الدم، علشان كده العيان تعبان كله مش مفاصله بس. التفسير المقبول (مش في الكتاب): بتشغّل مركز الحرارة في المخ، وبتكسّر العضلات والدهون، فالعيان سخن وهلكان وبيخس.
          - **Susceptibility to infection**: المرض نفسه بيلخبط المناعة، وفوقه العلاج المثبّط.
          - **Muscle wasting**: نفس الـ atrophy جنب المفاصل (ص 243).
          - **Tenosynovitis** و **bursitis**: التفسير المقبول (مش في الكتاب) إن الـ tendon sheaths والـ bursae مبطّنة بـ ==synovium== زي المفصل، فالـ RA بيضربها برضه.
          - **Osteoporosis**: الـ **PGE2** بيعمل demineralization (ص 242)، ومعاه قلة الحركة والـ steroids.
      - kind: explain
        remind: [rheum.L16.060]
        page: 251
        title: "الدم"
        quote: "Anaemia\n  Normochromic normocytic anaemia, of chronic disease.\n  Fe-deficiency anaemia: GIT erosions from NSAIDs – steroids eosinophilia.\n  Thrombocytosis: Active disease."
        text: |
          - **Anaemia of chronic disease**: normochromic normocytic.
          - **Iron deficiency**: من erosions في الـ gastrointestinal tract (GIT) بسبب الـ ==non-steroidal anti-inflammatory drugs (NSAIDs)== والـ steroids.
          - **Thrombocytosis** = المرض ==active==.
          - **Splenomegaly** و **Felty's syndrome**.
      - kind: reveal
        page: 251
        quote: "Anaemia\n - Normochromic normocytic anaemia, of chronic disease.\n - Fe-deficiency anaemia: GIT erosions from NSAIDs – steroids eosinophilia.\n - Thrombocytosis: Active disease."
        prompt: "عيانة RA عندها anaemia. إزاي تعرف هي من المرض ولا من الدوا؟"
        answer: |
          - **Normochromic normocytic** = ==anaemia of chronic disease== من المرض نفسه. السبب بيجي في الكتاب في ص 272: الـ **IL-6** بيعمل **hepcidin**، والـ hepcidin بيقفل الـ ferroportin فالحديد يتحبس في المخازن والنخاع ما يلاقيش.
          - **Iron deficiency** (microcytic) = نزيف من **GIT erosions** بسبب الـ NSAIDs والـ steroids. يعني الدوا.

          و **thrombocytosis** = المرض ==active==. التفسير المقبول (مش في الكتاب): الـ IL-6 نفسه بيحفّز الـ megakaryocytes، فالـ platelets بتعلى مع الالتهاب وتنزل لما يهدى.
      - kind: explain
