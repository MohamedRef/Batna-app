            <path d="M165 46v20" class="fg-arrow" marker-end="url(#G04s1)"/>
            <rect x="65" y="70" width="200" height="50" rx="6" class="fg-acc"/>
            <text x="80" y="92" class="t-sm t-b">1. CT first</text>
            <text x="80" y="110" class="t-sm">liver mets, nodes, extent</text>
            <path d="M120 120l-50 40" class="fg-arrow" marker-end="url(#G04s1)"/>
            <path d="M210 120l50 40" class="fg-arrow" marker-end="url(#G04s1)"/>
            <rect x="10" y="165" width="140" height="56" rx="6" class="fg-bad"/>
            <text x="20" y="188" class="t-sm t-b">Metastases or</text>
            <text x="20" y="206" class="t-sm t-b">organ invasion</text>
            <rect x="180" y="165" width="140" height="56" rx="6" class="fg-good"/>
            <text x="190" y="188" class="t-sm t-b">None found</text>
            <text x="190" y="206" class="t-sm">2. EUS: depth</text>
            <rect x="10" y="240" width="310" height="70" rx="8" class="fg-thin"/>
            <text x="20" y="262" class="t-sm">CT: T accuracy 64%, N sensitivity 24-43%</text>
