    status: unverified
  - id: hem.L10.105
    kind: card
    topic: secondary
    front: "Red cell metabolic defects causing polycythemia: mechanism, inheritance, diagnosis?"
    back: Reduced intra-erythrocyte 2,3-BPG; autosomal recessive; diagnosed by a decreased P50. Very rare.
    src: { page: 172, quote: "Abnormal RCs metabolism lead to reduction in intra-erythrocyte2,3 biphosphoglycerate (2,3 PBG). Autosomal recessive inheritance. Diagnosis by decrease P50" }
    status: unverified
  - id: hem.L10.106
    kind: card
    topic: secondary
    front: What is methemoglobin, and what restores normal Hb?
    back: Hb whose heme iron is oxidised from ferrous (Fe²⁺) to ferric (Fe³⁺). Conversion back needs NADH from glycolysis.
    src: { page: 172, quote: "Oxidation of haem iron convert it from ferrous F2+ to the ferric F3+" }
    status: unverified
  - id: hem.L10.107
    kind: enumerate
    topic: secondary
