      - kind: explain
        page: 141
        title: "الـ mechanistic biomarkers"
        text: |
          الـ markers دي بتقولك مش بس "الكبد اتأذى"، لكن اتأذى إزاي:

          - ==GLDH==: mitochondrial dysfunction. Specific to the liver، early detection، وبيفرّق بين muscle and hepatic injuries.
          - **MDH**: periportal enzyme، excellent association with ALT، بس مش liver-specific.
          - ==HMGB1 (hyperacetylated)==: DAMP و immune activation marker، greater sensitivity، predicts outcome. عيبه في الجدول: APAP DILI، يعني الداتا أغلبها من الـ acetaminophen.
          - **GSTs and alpha-GST**: phase II detoxification، increased earlier than ALT. ونفس العيب: الداتا أغلبها من APAP DILI.
          - **M-CSFR1, osteopontin, AFP**: prognostic indicators للـ death and transplant، والـ AFP أضعف من الـ osteopontin.

          اربطها بالـ mechanisms من الدرس التالت: الـ GLDH للـ mitochondria، والـ HMGB1 للـ necrosis والمناعة.
      - kind: check
        page: 141
        question: "A marathon runner has raised AST and ALT after a race. Which biomarker best tells liver from muscle injury?"
        options:
          - "GLDH"
          - "AST"
          - "MDH"
          - "ALP"
        answer: 0
        why:
          - "صح: الـ **GLDH** liver-specific، و **useful in distinguishing between muscle and hepatic injuries**."
          - "الـ AST مش liver-specific، وبيطلع من العضلات أصلًا."
          - "الـ MDH **not particular to the liver**."
          - "الـ ALP بيعكس الـ cholestasis، ومش liver-specific (bone، intestine…)."
      - kind: match
