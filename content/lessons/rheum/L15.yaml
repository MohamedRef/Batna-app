lessons:
  # ------------------------------------------------------------------
  - id: rheum.L15.lesson1
    title: "الـ OA مش مجرد استهلاك"
    hook: "لو الـ OA مجرد احتكاك، كان العدّائين كلهم ركبهم باظت. بس ده مش اللي بيحصل."
    minutes: 8
    pages: [233, 235]
    topics: [concept, pathogenesis, diagnosis]
    goals:
      - "تعرف المفهوم الجديد: whole-joint disease"
      - "تعدّ الأدلة إن الميكانيكا مش كل حاجة، وتفهم الـ crosstalk"
      - "تشخّص الـ OA من الحكاية والكشف والأشعة"
    status: unverified
    steps:
      - kind: explain
        page: 233
        quote: "Now OA is considered as a progressive complex multifactorial disorder of the whole joint"
        title: "المفهوم اتغيّر"
        text: |
          الـ OA **مش** مجرد ==wear and tear==.

          دلوقتي هو **progressive complex multifactorial disorder** للـ ==whole joint==:

          - Articular cartilage.
          - Subchondral bone.
          - Synovium.
          - Ligaments و capsule.
      - kind: explain
        page: 233
        quote: "Obese individuals have higher rates of hand OA, whereas they do not experience greater stresses in those joints."
        title: "ليه الميكانيكا مش كفاية؟"
        text: |
          - الـ **obesity** مش مرتبطة بـ OA أكتر في الـ **hip**، مع إنه بيشيل وزن.
          - التخان عندهم ==hand OA== أكتر، مع إن إيديهم مش شايلة حاجة زيادة.
          - الـ **running** بيزوّد الضغط على الـ hip والـ knee، ومع ذلك مش بيزود الـ OA.
          - الـ **synovitis** بتظهر **قبل** ما الـ cartilage يبوظ بشكل واضح (arthroscopy، MRI، US، و histology).
      - kind: reveal
        page: 233
        quote: "Obese individuals have higher rates of hand OA, whereas they do not experience greater stresses in those joints."
        prompt: "لو التخين عنده hand OA أكتر وإيده مش شايلة وزن، ده معناه إيه؟"
        answer: "إن فيه عامل **systemic** (metabolic أو inflammatory) غير الوزن. الـ obesity بتأثر على المفصل كمان من جوه الجسم، مش بس بالحمل الميكانيكي."
      - kind: figure
        page: 234
        quote: "Infra patellar fat pad & neighboring articular tissues cross talk. Bone, cartilage, synovium Cross talks."
        title: "الـ Crosstalk"
        alt: "A knee drawn as four boxes in a circle: cartilage, subchondral bone, synovium and infrapatellar fat pad, with two-way arrows between them. In the middle, a synovial macrophage releases IL-1 beta, TNF alpha and TGF beta. Below, results: chondrocyte apoptosis, osteophytes, sclerosis."
        caption: "كل نسيج في المفصل بيكلّم التاني. لما الكلام يبقى unhealthy، الإصلاح بيفشل."
        svg: |
          <svg viewBox="0 0 330 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R15a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="120" height="40" rx="8" class="fg-acc"/>
            <text x="22" y="35" class="t-sm t-b">Cartilage</text>
            <rect x="200" y="10" width="120" height="40" rx="8" class="fg-acc"/>
            <text x="212" y="35" class="t-sm t-b">Synovium</text>
            <rect x="10" y="150" width="120" height="40" rx="8" class="fg-acc"/>
            <text x="18" y="175" class="t-sm t-b">Subchondral bone</text>
            <rect x="200" y="150" width="120" height="40" rx="8" class="fg-acc"/>
            <text x="212" y="175" class="t-sm t-b">Fat pad</text>
            <path d="M135 30H195" class="fg-arrow" marker-start="url(#R15a)" marker-end="url(#R15a)"/>
            <path d="M135 170H195" class="fg-arrow" marker-start="url(#R15a)" marker-end="url(#R15a)"/>
            <path d="M70 55V145" class="fg-arrow" marker-start="url(#R15a)" marker-end="url(#R15a)"/>
            <path d="M260 55V145" class="fg-arrow" marker-start="url(#R15a)" marker-end="url(#R15a)"/>
            <circle cx="165" cy="100" r="30" class="fg-bad"/>
            <text x="143" y="97" class="t-sm t-b">macro-</text>
            <text x="143" y="111" class="t-sm t-b">phage</text>
            <text x="100" y="225" class="t-sm t-bad">IL-1β, TNF-α, TGF-β</text>
            <rect x="10" y="240" width="310" height="70" rx="8" class="fg-box"/>
            <text x="20" y="262" class="t-sm">Failed repair, chondrocyte apoptosis,</text>
            <text x="20" y="282" class="t-sm">osteophytes, bad remodeling,</text>
            <text x="20" y="300" class="t-sm">bone attrition and sclerosis</text>
          </svg>
      - kind: explain
        page: 234
        quote: "synovial macrophages respond to danger-associated molecular associated patterns, including cartilage fragments and intracellular proteins from necrotic cells"
        title: "الـ Macrophage هو المحرّض"
        text: |
          الـ ==synovial macrophages== بتشوف **danger-associated molecular patterns (DAMPs)**: قطع cartilage و proteins من خلايا ميتة.

          فبتطلّع **IL-1β، TNF-α، TGF-β** اللي بتأذي الـ cartilage وتغيّر العضم.
      - kind: aside
        tone: analogy
        page: 234
        quote: "Unhealthy crosstalk resulting in activation of specific molecular cascades and inflammatory mediators exacerbates the failure of repair mechanisms"
        text: "زي عمارة: الـ cartilage شقة، والعضم السقف، والـ synovium الجيران، والـ fat pad البواب. لو كل واحد بيشتكي من التاني بدل ما يصلّحوا، العمارة كلها بتقع. ده الـ unhealthy crosstalk."
      - kind: explain
        page: 234
        quote: "Joint pain brought on and exacerbated by activity and relieved with rest."
        title: "التشخيص"
        text: |
          **الحكاية**:

          - ألم مع ==activity== وبيروح مع الراحة.
          - Stiffness **قصيرة** الصبح أو بعد قعدة طويلة.
          - **مفيش** constitutional symptoms واضحة.

          **الكشف**:

          - Bony prominence عند حواف المفصل.
          - **Crepitus**.
          - Tenderness على الـ joint line.
          - تورم والتهاب في الـ **inflammatory OA**.

          **الإيد**: ==DIP، PIP، و first CMC==.
      - kind: explain
        page: 235
        quote: "Knee osteoarthritis with medial joint space narrowing and osteophytes."
        title: "الأشعة"
        text: |
          - **الإيد**: joint space narrowing في الـ DIP والـ PIP، و **sclerosis (eburnation)**.
          - **الركبة**: ==medial joint space narrowing== و **osteophytes**.
      - kind: check
        page: 234
        quote: "Osteoarthritis of distal interphalangeal (DIP), proximal interphalangeal (PIP) & 1scarpometacarpal (CMC) joints."
        question: "Which hand pattern points to OA rather than RA?"
        options: ["DIP, PIP and first CMC", "MCPs and wrists", "MCPs only, sparing DIP", "Wrist and elbow"]
        answer: 0
        why:
          - "صح: الـ DIP والـ PIP والـ first CMC."
          - "دي صورة الـ RA."
          - "الـ OA بيمسك الـ DIP."
          - "مش صورة الـ OA."
      - kind: check
        page: 233
        quote: "Obese individuals have higher rates of hand OA, whereas they do not experience greater stresses in those joints."
        question: "Which statement about OA pathogenesis is NOT correct?"
        options: ["Obese people have lower rates of hand OA", "Obesity is not linked to more hip OA", "Running does not raise OA incidence", "Synovitis precedes visible cartilage loss"]
        answer: 0
        why:
          - "صح، دي الغلط: التخان عندهم hand OA أكتر."
          - "صح في الكتاب."
          - "صح في الكتاب."
          - "صح في الكتاب."
      - kind: try
        items: [rheum.L15.003, rheum.L15.007, rheum.L15.009, rheum.L15.010, rheum.L15.012]
    recap:
      - "OA = whole-joint disease، مش wear and tear."
      - "الدليل: hip مش أكتر مع السمنة، hand أكتر، الجري مش بيضر، synovitis بدري."
      - "Macrophages + DAMPs ← IL-1β و TNF-α و TGF-β."
      - "ألم مع الحركة، stiffness قصيرة، مفيش أعراض عامة، crepitus."
      - "الإيد DIP و PIP و first CMC؛ الركبة medial narrowing و osteophytes."
    practice: [rheum.L15.001, rheum.L15.002, rheum.L15.003, rheum.L15.004, rheum.L15.005, rheum.L15.006, rheum.L15.007, rheum.L15.008, rheum.L15.009, rheum.L15.010, rheum.L15.011, rheum.L15.012, rheum.L15.013, rheum.L15.014, rheum.L15.040, rheum.L15.041, rheum.L15.042, rheum.L15.043, rheum.L15.049, rheum.L15.051]
