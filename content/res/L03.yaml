  - id: res.L03.043
    kind: card
    topic: finer
    front: When is research on healthy volunteers who get no immediate benefit acceptable?
    back: >-
      Only if the information is likely to advance scientific knowledge and medical practice, and cannot be
      obtained otherwise (for example through animal experiments). Research on animals must itself be
      justified.
    src: { page: 32, quote: "(E) Ethical (cont.):\n  If the research involves experimentation on volunteer human subjects, for whom the research has no immediate benefit, the research should only be carried out if the information needed is likely to advance scientific knowledge and medical practice, and if the information cannot be obtained otherwise, e.g. through animal experimentation.\n  Research involving experimentation on animals should be justified." }
