items:
  # ---------- p241: definition, epidemiology, aetiology ----------
  - id: rheum.L16.001
    kind: card
    topic: intro
    front: Define rheumatoid arthritis (book definition).
    back: A symmetrical, deforming polyarthritis of small and large joints, often with systemic disturbance and extra-articular features.
    src: { page: 241, quote: "Symmetrical, deforming, small and large joint polyarthritis often associated with systemic disturbance and extra- articular disease features." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.002
    kind: cloze
    topic: intro
    text: "RA prevalence is about {{c1::1%}} worldwide, with a female to male ratio of {{c2::2:1}}."
    src: { page: 241, quote: "Prevalence 1% world wide. Female / Male 2:1." }
    status: unverified
    tags: [numbers]
  - id: rheum.L16.003
    kind: enumerate
    topic: intro
    prompt: Mention the HLA associations of RA given in the book.
    points: [HLA-DR1, HLA-DR4, HLA-DRw14]
    pass: 2
    src: { page: 241, quote: "Association HLA DR1, DR4, DRW14." }
    status: unverified
  - id: rheum.L16.004
    kind: card
    topic: intro
    front: What is the shared epitope in RA?
    back: A specific amino-acid sequence on the beta chain of HLA-DR1 and DR4 that increases susceptibility to RA.
    src: { page: 241, quote: "Shared epitope: Increased susceptibility with a specific aminoacid sequence on B chain of HLA DR1. DR4." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.005
    kind: enumerate
    topic: intro
    prompt: Mention the possible environmental antigens (infections) suggested as triggers of RA.
    points: [Viruses (parvovirus, Epstein-Barr), Retroviruses, Mycoplasma, Mycobacteria]
    pass: 3
    src: { page: 241, quote: "Possible environmental factor antigen Virus (parvovirus, Epstien barr). Retrovirus. Mycoplasma. Mycobacteria." }
    status: unverified
  - id: rheum.L16.006
    kind: enumerate
    topic: intro
    prompt: Mention the three aetiological factors of RA.
    points:
      - Genetic background (HLA-DR1, DR4, DRw14; shared epitope; first-degree relatives)
      - A possible environmental antigen (viruses, retroviruses, mycoplasma, mycobacteria)
      - Self-perpetuation through autoimmunity
    pass: 3
    src: { page: 241, quote: "Self perpetuation through autoimmunity." }
    status: unverified
  - id: rheum.L16.007
    kind: mcq
    topic: intro
    stem: A 35-year-old woman asks whether her sister's RA raises her own risk. Which statement from the book's aetiology section fits best?
    options:
      - Risk is increased in first-degree relatives, linked to HLA-DR1/DR4 and the shared epitope
      - RA is purely environmental, so family history does not matter
      - Risk is linked mainly to HLA-B27
      - Only male relatives carry increased risk
    answer: 0
    why:
      - "Correct: the genetic background includes HLA-DR1, DR4, DRw14, the shared epitope and increased risk in first-degree relatives (p241)."
      - The book lists a genetic background as the first aetiological factor.
      - HLA-B27 belongs to the seronegative spondyloarthritides, not RA.
      - The book gives no sex limit for familial risk; RA itself is twice as common in women.
    src: { page: 241, quote: "Increased In first degree relatives." }
    status: unverified
  # ---------- p242: pathogenesis ----------
  - id: rheum.L16.008
    kind: card
    topic: pathogenesis
    front: Which arm of immunity mainly drives RA, and through which cells?
    back: Cell-mediated immunity, through macrophages and Th1 lymphocytes (macrophages present processed antigen to Th1 cells).
    src: { page: 242, quote: "Cell mediated Immunity through macrophage and TH1 lymphocytes," }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.009
    kind: card
    topic: pathogenesis
    front: What is the role of B cells in RA pathogenesis according to the book?
    back: B cells become plasma cells that make antibodies and immune complexes, which may cause some of the extra-articular features.
    src: { page: 242, quote: "immune complexes that may be responsible for some of extra- articular features." }
    status: unverified
  - id: rheum.L16.010
    kind: table
    topic: pathogenesis
    title: Cytokines in RA pathogenesis
    columns: [Cytokine or mediator, Made by, Effect]
    rows:
      - [IL-2, Th1 cells, Stimulates lymphocytes]
      - [IFN-gamma, Th1 cells, Stimulates macrophages]
      - [IL-6, Macrophages, Acute phase response (ESR and CRP)]
      - [IL-8, Macrophages, Chemotactic to polymorphs (toxic oxygen radicals)]
      - [IL-17, Th17 cells, Proinflammatory; important role in inflammation]
    blanks: [[0, 2], [1, 2], [2, 2], [3, 2], [4, 1]]
    src: { page: 242, quote: "IL6: stimulates acute phase response (ESR CRP)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.011
    kind: enumerate
    topic: pathogenesis
    prompt: Mention the effects of IL-1 and TNF in RA.
    points:
      - Activate synovial fibroblasts and chondrocytes (metalloproteinases destroy cartilage; PGE2 demineralizes and destroys bone)
      - Upregulate adhesion molecules with cell recruitment
      - Stimulate angiogenesis to supply the proliferating synovium
    pass: 3
    src: { page: 242, quote: "Stimulation of angiogenesis to supply the proliferating synovium." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.012
    kind: cloze
    topic: pathogenesis
    text: "IL-1 and TNF activate synovial fibroblasts and chondrocytes: {{c1::metalloproteinases}} destroy cartilage and {{c2::PGE2}} demineralizes and destroys bone."
    src: { page: 242, quote: "Metalloproteinases cartilage destruction. b) PGE2 demineralization and destruction of bone." }
    status: unverified
  - id: rheum.L16.013
    kind: enumerate
    topic: pathogenesis
    prompt: Mention the products of the activated macrophage in RA.
    points: [IL-6, IL-8, Prostaglandins, Leukotrienes]
    pass: 3
    src: { page: 242, quote: "Macrophage produce: IL6: stimulates acute phase response (ESR CRP)." }
    status: unverified
  - id: rheum.L16.014
    kind: mcq
    topic: pathogenesis
    stem: In an RA joint, which mediator explains the raised ESR and CRP?
    options: [IL-6 from macrophages, IL-2 from Th1 cells, IL-8 from macrophages, Leukotrienes]
    answer: 0
    why:
      - "Correct: macrophage IL-6 stimulates the acute phase response (ESR, CRP) (p242)."
      - IL-2 from Th1 cells stimulates lymphocytes.
      - IL-8 is chemotactic to polymorphs.
      - Leukotrienes are inflammatory mediators but the book ties the acute phase response to IL-6.
    src: { page: 242, quote: "IL6: stimulates acute phase response (ESR CRP)." }
    status: unverified
  - id: rheum.L16.015
    kind: mcq
    topic: pathogenesis
    stem: Which cytokine pair does the book hold responsible for cartilage and bone destruction in RA?
    options: [IL-1 and TNF, IL-2 and IFN-gamma, IL-8 and leukotrienes, IL-17 and IL-2]
    answer: 0
    why:
      - "Correct: IL-1 and TNF activate fibroblasts and chondrocytes to release metalloproteinases and PGE2 (p242)."
      - IL-2 and IFN-gamma are Th1 products that stimulate lymphocytes and macrophages.
      - IL-8 recruits polymorphs; leukotrienes are inflammatory mediators.
      - IL-17 is proinflammatory, but the destruction pathway in the book belongs to IL-1 and TNF.
    src: { page: 242, quote: "IL1—TNF I. Activate synovial fibroblasts and chondrocytes" }
    status: unverified
  # ---------- p243-244: pathology ----------
  - id: rheum.L16.016
    kind: order
    topic: pathology
    prompt: Put the joint pathology of RA in order.
    steps:
      - Injury to the synovial microvasculature
      - Swelling and congestion of synovium with Th1 cells, macrophages and plasma cells; polymorph-rich effusion
      - Synovial hypertrophy with villous formation and lymphoid follicles
      - Pannus spreads over and under the articular cartilage, which is eroded
      - Fibrous and bony ankylosis
    src: { page: 243, quote: "Early change: injury to synovial microvasculature." }
    status: unverified
  - id: rheum.L16.017
    kind: card
    topic: pathology
    front: What is pannus?
    back: Inflammatory granulation tissue that spreads over and under the articular cartilage and erodes it.
    src: { page: 243, quote: "Formation of inflammatory granulation tissue (pannus) spreading over and under the articular cartilage which becomes eroded." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.018
    kind: card
    topic: pathology
    front: What is the earliest pathological change in the RA joint?
    back: Injury to the synovial microvasculature.
    src: { page: 243, quote: "Early change: injury to synovial microvasculature." }
    status: unverified
  - id: rheum.L16.019
    kind: card
    topic: pathology
    front: How do RA joints become deformed?
    back: Inflammatory destruction of soft tissues makes ligaments and tendons lax, which leads to deformities.
    src: { page: 243, quote: "Inflammatory destruction of soft tissues laxity of ligaments and tendons – deformities." }
    status: unverified
  - id: rheum.L16.020
    kind: cloze
    topic: pathology
    text: "The RA synovial effusion is rich in {{c1::polymorphs}}, while the synovial membrane is infiltrated with {{c2::Th1 lymphocytes}}, macrophages and some plasma cells."
    src: { page: 243, quote: "infiltration with TH1 lymphocytes, macrophages and some plasma cells. Effusion of synovial fluid rich in polymorphs." }
    status: unverified
  - id: rheum.L16.021
    kind: card
    topic: pathology
    front: Describe the histology of a rheumatoid subcutaneous nodule.
    back: A central area of fibrinoid necrosis surrounded by a palisade of mononuclear cells.
    src: { page: 244, quote: "Central area of fibrinoid necrosis. Palisade of mononuclear cells." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.022
    kind: card
    topic: pathology
    front: What is the pathology in extra-articular tissues in RA?
    back: A mononuclear cell infiltrate with varying degrees of fibrinoid necrosis and nodule formation.
    src: { page: 244, quote: "Mononuclear cell infiltrate with varying degrees of fibrinoid necrosis and nodule formation." }
    status: unverified
  - id: rheum.L16.023
    kind: card
    topic: pathology
    front: Why do muscles waste around an RA joint?
    back: The book lists atrophy of muscles adjacent to inflamed joints as part of the joint pathology.
    src: { page: 243, quote: "Atrophy of muscles adjacent to inflamed joints." }
    status: unverified
  # ---------- p244: onset and joint pattern ----------
  - id: rheum.L16.024
    kind: enumerate
    topic: onset
    prompt: Mention the types of onset of RA.
    points: [Gradual (usual), Acute (a minority), Palindromic (occasionally), Systemic symptoms (fatigue, malaise, weakness, low-grade fever, weight loss)]
    pass: 3
    src: { page: 244, quote: "Gradual (usually). Acute in a minority. Occasionally palindromic" }
    status: unverified
  - id: rheum.L16.025
    kind: cloze
    topic: onset
    text: "Palindromic onset: attacks of pain, swelling and erythema that resolve but recur; about {{c1::50%}} develop RA."
    src: { page: 244, quote: "Occasionally palindromic (pain, swelling, erythema that resolve but recur 50% develop RA)." }
    status: unverified
    tags: [numbers]
  - id: rheum.L16.026
    kind: card
    topic: onset
    front: What causes morning stiffness in RA?
    back: Oedema and accumulation of inflammatory mediators during sleep or inactivity.
    src: { page: 244, quote: "Morning stiffness: due to edema and inflammatory mediator accumulation during sleep or inactivity." }
    status: unverified
  - id: rheum.L16.027
    kind: card
    topic: onset
    front: Which joints are most commonly involved in RA?
    back: Hand joints (MCP, PIP, wrist), foot joints and the knee.
    src: { page: 244, quote: "Joints commonly involved: joints of hand (MCP-PIP-Wrist) foot joints-knee." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.028
    kind: card
    topic: onset
    front: Name two less commonly involved joints in RA.
    back: Temporomandibular and cricoarytenoid joints.
    src: { page: 244, quote: "Less commonly: Tempromandibular and cricoarytenoid joint." }
    status: unverified
  - id: rheum.L16.029
    kind: cloze
    topic: onset
    text: "In RA, spinal involvement is limited to the {{c1::upper cervical}} area, and the {{c2::sacroiliac}} joint is spared."
    src: { page: 244, quote: "Spinal involvement is limited to upper cervical area, sacroiliac joint is spared." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.030
    kind: card
    topic: onset
    front: What two features of the joint pattern are characteristic of RA?
    back: Symmetry, and sparing of the DIP joints.
    src: { page: 244, quote: "Symmetry and non involvement of DIP is characteristic." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.031
    kind: mcq
    topic: onset
    stem: A 45-year-old woman has 3 months of symmetrical swelling of both wrists and MCP joints with 90 minutes of morning stiffness. Her DIP joints and sacroiliac joints are normal. Which feature most supports RA over a spondyloarthritis?
    options:
      - Symmetrical small-joint disease with DIP and sacroiliac sparing
      - Involvement of the sacroiliac joints
      - Predominant DIP involvement
      - Asymmetrical large-joint oligoarthritis
    answer: 0
    why:
      - "Correct: symmetry and DIP sparing are characteristic, and the sacroiliac joint is spared in RA (p244)."
      - The sacroiliac joint is spared in RA.
      - DIP sparing, not DIP involvement, is characteristic of RA.
      - RA is a symmetrical polyarthritis of small and large joints.
    src: { page: 244, quote: "Symmetry and non involvement of DIP is characteristic." }
    status: unverified
  - id: rheum.L16.032
    kind: mcq
    topic: onset
    stem: A woman with RA complains of hoarseness and pain on swallowing. Which joint is likely involved?
    options: [Cricoarytenoid, Temporomandibular, Sternoclavicular, Atlanto-occipital]
    answer: 0
    why:
      - "Correct: cricoarytenoid arthritis causes laryngeal pain, dysphonia and pain on swallowing (p244, p253)."
      - The temporomandibular joint causes jaw pain on chewing, not dysphonia.
      - The sternoclavicular joint does not affect the voice.
      - Atlantoaxial subluxation causes neck pain and cord signs, not dysphonia.
    src: { page: 253, quote: "Cricoarytenoid joint inflammation - laryngeal pain – dysphonia - pain on swallowing." }
    status: unverified
  # ---------- p245: ACR 1987 ----------
  - id: rheum.L16.033
    kind: enumerate
    topic: criteria
    prompt: Mention the ACR 1987 criteria for diagnosis of RA.
    points:
      - Morning stiffness of at least 1 hour, present for at least 6 weeks
      - Swelling of 3 or more joints for at least 6 weeks
      - Swelling of wrist, MCP or PIP for 6 weeks or more
      - Symmetric joint swelling
      - Typical hand X-ray changes (erosions or unequivocal bony decalcification)
      - Rheumatoid nodules
      - Serum RF by a method positive in less than 5% of normal people
    pass: 6
    src: { page: 245, quote: "Morning stiffness at least one hour and present for at least 6 weeks." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.034
    kind: cloze
    topic: criteria
    text: "ACR 1987: {{c1::4}} or more of the 7 criteria are needed for diagnosis; morning stiffness must last at least {{c2::1 hour}}."
    src: { page: 245, quote: "4 or more criteria must be present for diagnosis." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L16.035
    kind: card
    topic: criteria
    front: Why is the 6-week duration in the ACR 1987 criteria important?
    back: It prevents self-limiting or viral arthritis from being labelled as RA.
    src: { page: 245, quote: "It prevents self limiting or vial arthritis to be labelled as RA." }
    status: unverified
  - id: rheum.L16.036
    kind: card
    topic: criteria
    front: What is the main weakness of the ACR 1987 criteria?
    back: They are not sensitive for diagnosing early RA.
    src: { page: 245, quote: "Criteria are not sensitive for diagnosis of early RA." }
    status: unverified
  # ---------- p246: ACR/EULAR 2010 ----------
  - id: rheum.L16.037
    kind: table
    topic: criteria
    title: ACR/EULAR 2010 RA criteria (6 or more points = definite RA)
    columns: [Domain, Category, Points]
    rows:
      - [Joints, 1 medium-large joint, "0"]
      - [Joints, 2-10 medium-large joints, "1"]
      - [Joints, 1-3 small joints, "2"]
      - [Joints, 4-10 small joints, "3"]
      - [Joints, More than 10 small joints, "5"]
      - [Serology, RF and ACPA both negative, "0"]
      - [Serology, Low positive (above ULN up to 3 x ULN), "2"]
      - [Serology, High positive (more than 3 x ULN), "3"]
      - [Duration of synovitis, Less than 6 weeks, "0"]
      - [Duration of synovitis, 6 weeks or longer, "1"]
      - [Acute phase reactants, Normal CRP and ESR, "0"]
      - [Acute phase reactants, Abnormal CRP or ESR, "1"]
    blanks: [[1, 2], [2, 2], [3, 2], [4, 2], [6, 2], [7, 2], [9, 2], [11, 2]]
    src: { page: 246, quote: "Patients are definitively diagnosed with RA if they score 6 or more points according to the following criteria" }
    status: unverified
    tags: [high-yield, numbers]
  - id: rheum.L16.038
    kind: cloze
    topic: criteria
    text: "ACR/EULAR 2010: definite RA needs a score of {{c1::6}} or more; more than 10 small joints scores {{c2::5}} points."
    src: { page: 246, quote: "More than 10 small joints (5 points)." }
    status: unverified
    tags: [numbers]
  - id: rheum.L16.039
    kind: cloze
    topic: criteria
    text: "ACR/EULAR 2010 serology: low titre means above the upper limit of normal but not more than {{c1::3 times}} the ULN ({{c2::2}} points); high titre scores {{c3::3}} points."
    src: { page: 246, quote: "At least one test is positive at high titer, defined as more than three times the upper limit of normal (3 points)." }
    status: unverified
    tags: [numbers]
  - id: rheum.L16.040
    kind: card
    topic: criteria
    front: In the 2010 criteria, how is a patient with 5 small and 4 large joints scored in the joint domain?
    back: "3 points: the patient receives the highest level fulfilled within each domain (4-10 small joints), not a sum."
    src: { page: 246, quote: "a patient with five small joints involved and four large joints involved scores 3 points." }
    status: unverified
  - id: rheum.L16.041
    kind: enumerate
    topic: criteria
    prompt: Name the four domains of the ACR/EULAR 2010 RA criteria.
    points: [Joint involvement, Serology (RF or ACPA), Duration of synovitis, Acute phase reactants (CRP or ESR)]
    pass: 4
    src: { page: 246, quote: "Domain: Duration of synovitis: Less than 6 weeks (0 points). 6 weeks or longer (1 point)." }
    status: unverified
  - id: rheum.L16.042
    kind: mcq
    topic: criteria
    stem: A 40-year-old woman has 4 weeks of synovitis in 6 MCP/PIP joints. RF is twice the upper limit of normal and CRP is raised. What is her ACR/EULAR 2010 score?
    options: ["6: definite RA", "5: not yet classified as RA", "7: definite RA", "4: not RA"]
    answer: 0
    why:
      - "Correct: 4-10 small joints 3 + low-positive RF 2 + duration under 6 weeks 0 + abnormal CRP 1 = 6 (p246)."
      - "5 would miss the CRP point; an abnormal CRP or ESR scores 1."
      - "7 would need either high-titre serology (3) or 6 weeks of synovitis; she has neither."
      - "4 ignores the serology points; RF at 2 x ULN is low positive (2 points)."
    src: { page: 246, quote: "At least one of these two tests are positive at low titer" }
    status: unverified
  - id: rheum.L16.043
    kind: mcq
    topic: criteria
    stem: Which feature counts in the ACR 1987 criteria but has no place in the ACR/EULAR 2010 criteria as listed in the book?
    options: [Rheumatoid nodules, Rheumatoid factor, Number of involved joints, Duration of synovitis]
    answer: 0
    why:
      - "Correct: nodules (and X-ray changes and morning stiffness) are 1987 criteria (p245) but not 2010 domains (p246)."
      - RF appears in both (2010 serology domain).
      - Joint count appears in both forms.
      - Duration (6 weeks) appears in both.
    src: { page: 245, quote: "Rheumatoid nodules." }
    status: unverified
  # ---------- p247-248: hands ----------
  - id: rheum.L16.044
    kind: card
    topic: hands
    front: What is the early sign of RA in the hand?
    back: Fusiform (spindle-shaped) fingers due to swelling of the PIP joints.
    src: { page: 247, quote: "Early sign: fusiform or spindle shaped appearance of fingers due to swelling of PIP joints." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.045
    kind: table
    topic: hands
    title: Finger deformities in RA
    columns: [Deformity, PIP, DIP]
    rows:
      - [Swan neck, Hyperextension, Flexion]
      - [Boutonniere, Flexion, Extension]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 247, quote: "Swan neck deformity: Hyperextension at PIP with flexion at DIP. Boutonniere deformity: Flexion at the PIP with extension at DIP." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.046
    kind: card
    topic: hands
    front: What causes the zig-zag deformity of the RA hand?
    back: Ulnar deviation of the fingers at the MCP joints combined with deviation at the radiocarpal joint.
    src: { page: 247, quote: "Ulnar deviation of fingers at MCP joint associated with deviation at radiocarpal Joints Zig Zag deformity of the hand." }
    status: unverified
  - id: rheum.L16.047
    kind: card
    topic: hands
    front: What is the piano-key (caput) ulna?
    back: Dorsal subluxation of the ulnar styloid at the wrist.
    src: { page: 247, quote: "Dorsal subluxation of ulnar styloid of the wrist.(caput ulna,piano key ulna)" }
    status: unverified
  - id: rheum.L16.048
    kind: card
    topic: hands
    front: What causes trigger finger in RA?
    back: An inflamed flexor tendon sheath with a nodule in the sheath that locks the finger and prevents extension from a flexed position.
    src: { page: 247, quote: "Trigger finger: Inflamed flexor tendon sheath that prevents extension of finger from a flexed position." }
    status: unverified
  - id: rheum.L16.049
    kind: enumerate
    topic: hands
    prompt: Mention the deformities of the hand in RA.
    points:
      - Ulnar deviation at MCPs (zig-zag deformity with radiocarpal deviation)
      - Swan neck deformity
      - Boutonniere deformity
      - Z-shaped thumb
      - MCP subluxation
      - Dorsal subluxation of the ulnar styloid (piano-key ulna)
      - Trigger finger
    pass: 5
    src: { page: 247, quote: "Z shaped deformity of thumb. MCP subluxation." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.050
    kind: enumerate
    topic: hands
    prompt: Mention the soft-tissue and skin signs of the RA hand and wrist (other than deformities).
    points:
      - Muscle atrophy with weak grip
      - Boggy synovium on the dorsum of the wrist
      - Early limitation of wrist dorsiflexion
      - Palmar erythema and prominent dorsal veins (increased blood flow)
      - Thin atrophic skin over synovitis
    pass: 3
    src: { page: 247, quote: "Boggy synovium at the dorsum of the wrist. Early limitation of dorsiflexion of the wrist." }
    status: unverified
  - id: rheum.L16.051
    kind: mcq
    topic: hands
    stem: An RA patient's finger is flexed at the PIP joint and hyperextended at the DIP joint. What is this deformity?
    options: [Boutonniere deformity, Swan neck deformity, Z-shaped thumb, Trigger finger]
    answer: 0
    why:
      - "Correct: boutonniere = flexion at PIP with extension at DIP (p247)."
      - Swan neck is the reverse (PIP hyperextension, DIP flexion).
      - The Z-shaped deformity affects the thumb.
      - Trigger finger is locking in flexion from a tendon-sheath nodule.
