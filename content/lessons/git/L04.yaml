  # ------------------------------------------------------------------
  - id: git.L04.lesson5
    title: "Gastric lymphoma و carcinoid"
    hook: "ليمفوما بتخف بالمضاد الحيوي؟ أيوه، لو MALT و early. وكارسينويد بيتقسم 3 أنواع بالـ gastrin."
    minutes: 9
    pages: [164, 168]
    topics: [lymphoma, carcinoid]
    goals:
      - "تعرف تقييم الـ gastric lymphoma وليه الـ EUS"
      - "تعالج الـ early MALT بالـ eradication وتتابعه صح"
      - "تفرّق أنواع الـ gastric carcinoid وعلاج كل نوع"
    status: unverified
    steps:
      - kind: explain
        page: 164
        quote: "MALT lymphoma were recently reclassified as extranodal marginal zone"
        title: "الـ MALT: اسم جديد وسبب معروف"
        text: |
          الكتاب: الـ **mantle cell** والـ **follicular** كل واحد أقل من 1%. والـ MALT lymphoma اتغيّر اسمه لـ ==extranodal marginal zone lymphoma of MALT type==، وغالبًا بييجي بعد **H. pylori associated gastritis**.

          التفسير المقبول (مش في الكتاب): الاسم الجديد بيوصف الخلية: «extranodal» يعني برّه الـ lymph nodes، و «marginal zone» يعني من الطبقة الخارجية للـ follicle. والـ H. pylori هو اللي بيعمل الـ follicles دي في الأول (المعدة مفيهاش lymphoid tissue طبيعي)، والخلايا بتفضل محتاجة **التحفيز** من البكتيريا في المراحل الأولى. وده السر في إن قتل البكتيريا بيوقّف الورم.
      - kind: explain
        page: 164
        quote: "Endoscopy generally reveals nonspecific gastritis or gastric ulcerations, with mass lesions being unusual."
        title: "التقييم"
        text: |
          - **Endoscopy**: nonspecific gastritis أو ulcers، والـ mass نادرة.
          - **Endoscopic ultrasound (EUS)**: عمق الغزو، عشان نعرف مين معرض لـ **perforation** من full-thickness involvement.
          - الـ distant disease: upper airway exam، **bone marrow biopsy**، computed tomography (CT) chest و abdomen، biopsy لأي node كبيرة.
          - و**H. pylori testing** لازم.

          يعني التقييم هنا له هدفين: تعرف الـ stage (منتشر ولا لأ) وتعرف هل فيه H. pylori، لأن الاتنين بيحددوا هل المضاد الحيوي لوحده ممكن يكفي.
      - kind: figure
        page: 164
        title: "الـ lymphoma في المنظار"
        image: { file: git/L04-gastric-lymphoma-egd.webp, book: true }
        alt: "Book endoscopy pictures labelled gastric lymphoma, with an irregular pale ulcerated area, and maltoma, with a smooth reddish raised fold."
        caption: |
          الشمال **gastric lymphoma**، واليمين **maltoma**.

          زي ما الكتاب بيقول: المنظار غالبًا بيبيّن ==nonspecific gastritis أو ulcers==، والـ mass نادرة. علشان كده الـ biopsy هي اللي بتقول.
      - kind: reveal
        page: 164
        quote: "invasion, specifically to identify patients at risk for perforation secondary to"
        prompt: "ليه بنعمل EUS قبل علاج الـ gastric lymphoma بالذات؟"
        answer: |
          الكتاب: الـ EUS بيحدد ==depth of gastric wall invasion==، وبالتحديد علشان نعرف مين معرّض لـ **perforation** من **full thickness involvement**.

          التفسير المقبول (مش في الكتاب): الليمفوما بتستجيب للـ chemo بسرعة. لو الورم واخد سُمك الحيطة كله، لما خلاياه تموت فجأة بيسيب **خرم** مكانها. فمعرفة العمق قبل العلاج بتخليك تستعد (أو تفكر في الجراحة). وكمان العمق بيتنبأ بالاستجابة للـ eradication: كل ما الورم سطحي، احتمال إنه يخف بالمضاد الحيوي أكبر.
      - kind: table
        page: 165
        quote: "| Ann Arbor | Rao et al | Musshoff | Description | Relative Incidence (%) |\n|---|---|---|---|---|\n| IE | IE | IE | Tumor confined to gastrointestinal tract | 26 |\n| IIE | IIE | II1E | Tumor with spread to regional lymph nodes | 26 |\n| IIE | IIIE | II2E | Tumor with nodal involvement beyond regional lymph nodes (para-aortic, iliac) | 17 |\n| IIIE-IV | IVE | IIIE-IV | Tumor with spread to other intra-abdominal organs (liver, spleen) or beyond abdomen (chest, bone marrow) | 31 |"
        title: "Staging of gastric lymphoma (Ann Arbor)"
        columns: ["Stage", "Description", "Incidence"]
        rows:
          - ["IE", "Confined to the GI tract", "26%"]
          - ["IIE", "Regional lymph nodes", "26%"]
          - ["IIE (Rao IIIE)", "Nodes beyond regional (para-aortic, iliac)", "17%"]
          - ["IIIE-IV", "Other abdominal organs or beyond the abdomen", "31%"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: explain
        page: 166
        quote: "Recent evidence suggests that early-stage MALT lymphomas as well as some cases of very limited diffuse large B-cell lymphoma may be effectively treated by H-pylori eradication alone."
        title: "العلاج: مضاد حيوي يشفي ليمفوما"
        text: |
          - أغلب المراكز **multimodality**. دور الـ resection controversial، وكتير بيتعالجوا بـ chemoradiation بس.
          - أشهر chemo: **cyclophosphamide, doxorubicin, vincristine, prednisolone (CHOP)**. والـ radiation محدودة في الأورام الكبيرة (stricture، enteritis، secondary tumors).
          - لو اتلقت فجأة في العملية: **frozen section**، و fresh tissue للـ flow، immunohistochemistry (IHC)، genetics. ولو IE أو IIE: شيل كل الـ gross disease.
          - **Early MALT** (وبعض الـ DLBCL المحدود جدًا): ==H. pylori eradication alone==. remission في أكتر من 75%.
          - المتابعة: منظار بعد حوالي 2 months، وبعدين كل 6 شهور لمدة 3 سنين.

          التفسير المقبول (مش في الكتاب): ليه المتابعة طويلة كده؟ لأن الـ MALT بيستجيب ببطء على شهور، وممكن يرجع لو البكتيريا رجعت. فالمنظار بعد شهرين بيتأكد إن البكتيريا راحت، والمناظير بعد كده بتتأكد إن الورم بيصغر فعلًا.
      - kind: reveal
        page: 166
        quote: "Radiation therapy is limited in usefulness for larger tumors with local"
        prompt: "ليه الـ radiation مش حل سهل في الليمفوما الكبيرة؟"
        answer: |
          الكتاب: الـ radiation محدودة في الأورام **الكبيرة** بسبب local complications: ==stricture، enteritis، secondary tumor formation==.

          التفسير المقبول (مش في الكتاب): الورم الكبير محتاج مجال إشعاع كبير، والمجال ده بيعدّي على أمعاء سليمة جنب المعدة (enteritis)، والحيطة اللي اتشفت بتتليف (stricture). والـ secondary tumor بيظهر بعد سنين، ودي مشكلة حقيقية في مرض المريض ممكن يعيش بعده عمر طويل.
      - kind: case
        page: 166
        quote: "Successful eradication resulted in remission in more than 75% of cases."
        stem: "A 59-year-old man has stage IE gastric MALT lymphoma. H. pylori is positive."
        steps:
          - question: "First treatment?"
            options: ["H. pylori eradication", "Total gastrectomy", "CHOP chemotherapy", "Radiotherapy"]
            answer: 0
            why: "Early MALT lymphoma can be treated by eradication alone; remission in more than 75%."
          - question: "How do you document regression?"
            options: ["Endoscopy at about 2 months, then twice yearly for 3 years", "A urea breath test once, after eradication", "Symptoms only, with no repeat endoscopy", "A yearly CT of the abdomen for 3 years"]
            answer: 0
            why: "Repeat endoscopy documents clearance, then biannual endoscopy for 3 years documents regression."
      - kind: explain
        page: 167
        quote: "Commonly discovered as an incidental finding during the workup for other symptoms, when a yellow nodule is found in the fundus of the stomach."
        title: "Gastric carcinoid"
        text: |
          - من الـ **enterochromaffin-like (ECL) cells** في الـ fundus، ولحد 5% من كل الـ carcinoids.
          - غالبًا incidental: ==yellow nodule== في الـ fundus.
          - ممكن أعراض **histamine**: flushing، bronchospasm، itching، lacrimation.
          - التشخيص: biopsy (chromogranin، dysplasia، atrophy، invasion)، EUS للعدد والحجم والمكان، و CT للكبد والـ nodes.

          التفسير المقبول (مش في الكتاب): ليه الـ chromogranin؟ لأنه بروتين موجود في كل الخلايا الـ neuroendocrine، فهو «بطاقة هوية» تثبت إن الورم carcinoid مهما كان نوعه، وبيعلى في الدم مع كمية الورم، فبيتستخدم في المتابعة.
      - kind: figure
        page: 167
        title: "الـ carcinoid في المنظار"
        image: { file: git/L04-gastric-carcinoid-egd.webp, book: true }
        alt: "Two book endoscopy pictures of small, smooth, reddish raised nodules in the gastric mucosa."
        caption: |
          **نتوءات صغيرة ناعمة** في الـ mucosa. غالبًا بتتلاقي ==بالصدفة== في منظار معمول لسبب تاني.
      - kind: reveal
        page: 167
        quote: "Patients may complain of histamine-producing symptoms, such as"
        prompt: "ليه كارسينويد المعدة بيعمل flushing وحكة ودموع؟"
        answer: |
          الكتاب: الـ gastric carcinoids من الـ **enterochromaffin-like cells** في الـ fundus، والمريض ممكن يشتكي من ==histamine-producing symptoms==: cutaneous flushing، bronchospasm، itching، lacrimation.

          التفسير المقبول (مش في الكتاب): الـ ECL cell شغلتها الطبيعية إنها تفرز **histamine** يحفّز الـ parietal cells تعمل حمض. لما تتحول ورم، بتفرز histamine كتير يوصل للدم، فيعمل نفس أعراض الحساسية (توسيع أوعية = flushing، تقلص الشعب = bronchospasm). وعلشان كده الـ urinary 5-HIAA (اللي بيقيس serotonin) أقل حساسية هنا من الـ carcinoid بتاع الأمعاء.
