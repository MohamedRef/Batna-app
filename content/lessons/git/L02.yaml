        why: "الكتاب (ص 61-62): الفكرة اتمدّت للـ **gastroparesis** (G-POEM أو per-oral pyloromyotomy) و **Zenker's** (الـ cricopharyngeus الـ hypertensive)، والـ myotomy الطويلة ممكن تفيد الـ spastic disorders."
      - kind: explain
        page: 62
        quote: "The upper esophageal sphincter, or the cricopharyngeus muscle, can similarly be hypertensive, which may overtime result in the formation of a Zenker‘s diverticulum."
        title: "الـ Z-POEM: البوابة اللي فوق"
        text: |
          الكتاب: الـ **upper esophageal sphincter** (الـ ==cricopharyngeus==) ممكن يكون **hypertensive**، ومع الوقت يعمل **Zenker's diverticulum**. فالـ **endoscopic myotomy** للعضلة دي (==Z-POEM==) بقت اختيار جذاب للـ operators اللي عندهم خبرة POEM.

          التفسير المقبول (مش في الكتاب) للـ «ليه»: لما البوابة اللي فوق ما بتفتحش كويس، البلع بيزق الأكل على حيطة الـ pharynx فوقها، فالنقطة الضعيفة بتتنفخ لبرّه وتعمل جيب. لو قطعت العضلة اللي قافلة، الضغط يقل والأكل يعدي.
