  - id: hb.L10.lesson3
    title: "نحمي المخ: الـ HE والـ ICP في العناية"
    hook: "الـ ICP عالي والجمجمة مش هتوسع. كل درجة في السرير وكل ملّي في الـ PaCO2 فارقين."
    minutes: 9
    pages: [178, 180]
    topics: [care]
    goals:
      - "تعرف إمتى المريض يدخل ICU وإمتى يتركّب له ICP monitor"
      - "تحفظ الـ targets: ICP، CPP، Na"
      - "ترتّب خطوات علاج الـ ICP العالي وتعرف اللي مش بيفيد"
    status: unverified
    steps:
      - kind: explain
        page: 178
        title: "الـ HE قبل الـ edema"
        text: |
          الـ **HE بتسبق الـ cerebral edema**، فالمتابعة الدقيقة للـ mental status في الـ severe acute hepatitis هي جرس الإنذار.

          - **Lactulose** أقل فايدة في الـ ALF من الـ chronic، ومش بيمنع الـ edema، بس غالبًا بيتدّي مع مراقبة.
          - **Rifaximin** ممكن، بس فايدته **مش متثبتة**.
          - **Stage 2 HE** → **ICU**.
          - **Sedatives** ممنوعة في الأول علشان نتابع الـ mental status.
          - **CT أو MRI head** علشان نستبعد سبب تاني للتغيرات الذهنية.
      - kind: check
        page: 179
        question: "An ALF patient reaches stage 3 HE. What do many centers do, per the book?"
        options:
          - "Intubate, ventilate and place an ICP monitor"
          - "Rely on CT head to detect raised ICP"
          - "Start prophylactic phenytoin"
          - "Give dexamethasone for cerebral edema"
        answer: 0
        why:
          - "صح: من **stage 3** الخطر كبير، والكتاب بيقول مراكز كتير بتعمل **intubation + ventilation + ICP monitor**."
          - "الـ clinical signs والـ **CT insensitive** للـ intracranial hypertension."
          - "فايدة الـ prophylactic phenytoin **uncertain**."
          - "الـ glucocorticoids مش بتقلل الـ mortality."
      - kind: reveal
        page: 179
        prompt: "الـ ICP monitor نفسه فيه خطر نزيف وعدوى. طب بنركّبه ليه؟"
        answer: |
          الكتاب بيدي هدفين:
          - نعالج الـ **ICP العالي** وإحنا شايفينه.
          - نعرف مين **too ill for transplant** بسبب فترة طويلة من **ICP عالي جدًا**.
      - kind: figure
        page: 179
        title: "الـ CPP والسلّم"
        alt: "Two bars: MAP tall, ICP short; the gap between them is CPP, target 60 to 100, and above 120 worsens edema. Goal ICP under 40 per the book. A ladder: always hypertonic saline to sodium 145 to 155 and no straining; if ICP over 20 or CPP under 60, head up 20 degrees, PaCO2 25 and mannitol 0.5 g/kg over 10 minutes if kidneys work, with sedation or paralysis if needed; refractory cases get barbiturate coma; steroids have no mortality benefit."
