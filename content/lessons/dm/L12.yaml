  - id: dm.L12.lesson6
    title: "أدوية السكر مع الكبد: metformin والـ SU والـ pioglitazone"
    hook: "دوا دوا: metformin لحد إمتى، الـ SU ليه بيطوّل، والـ pioglitazone للـ NASH بشروط."
    minutes: 8
    pages: [155, 156]
    topics: [cld-drugs]
    goals:
      - "تعرف حدود الـ metformin في الـ CLD وموانعه، وليه الـ lactic acidosis"
      - "تعرف ليه الـ SU بيطوّل وامتى تمنعه"
      - "تعرف دور الـ pioglitazone في الـ NAFLD/NASH وحدوده، وليه الـ cirrhosis المتقدم غالبًا محتاج insulin"
    status: unverified
    steps:
      - kind: explain
        page: 155
        title: "الـ metformin"
        quote: "In patients with compensated CLD, metformin is likely to be reasonably safe, but the dose should be decreased to a maximum of 1500 mg daily."
        text: |
          الخطر: ==lactic acidosis== لو فيه tissue hypoxia أو comorbidities (كلى، كبد، قلب)، خصوصًا مع acute deterioration.

          - **Compensated** ← غالبًا آمن، بس ==max 1500 mg/day==.
          - **وقّفه** لو الكبد أو الكلى بيسوءوا، أو acute illness، أو decompensation.
          - **Contraindications**: creatinine ≥1.5 (رجالة) / ≥1.4 (ستات)، creatinine clearance (CrCl) <30، hepatic impairment، congestive heart failure (CHF)، والصبغة (ارجعله بعد 48 h والـ creatinine طبيعي).
      - kind: explain
        page: 155
        title: "ليه الـ lactic acidosis بالذات؟"
        quote: "This risk occurs if tissue hypoxia is present; in patients with multiple\n         comorbidities, such as renal, liver, and cardiac diseases, particularly when\n         there is an acute deterioration."
        text: |
          الكتاب بيربط الخطر بالـ **tissue hypoxia** وبالكلى والكبد والقلب. التفسير المقبول (مش في الكتاب) إن الـ lactate بييجي من ناحية ويتشال من ناحية تانية:

          - **بيزيد** لما الأنسجة ما يوصلهاش oxygen (القلب ضعيف، صدمة، عدوى شديدة)، والـ metformin نفسه بيقلل استخدام الـ lactate في الكبد.
          - **بيتشال** في الكبد بالأساس (بيرجّعه glucose)، والـ metformin بيخرج من الكلية.

          يعني الكبد التعبان ما بيشيلش الـ lactate، والكلية التعبانة بتسيب الـ metformin يتراكم، والقلب التعبان بيعمل hypoxia. عشان كده الموانع هي بالظبط: ==renal impairment، hepatic impairment، CHF==، والصبغة (لأنها ممكن تعمل nephrotoxicity فجأة).
      - kind: figure
        page: 155
        quote: "This risk occurs if tissue hypoxia is present; in patients with multiple\n         comorbidities, such as renal, liver, and cardiac diseases, particularly when\n         there is an acute deterioration."
        title: "ميزان الـ lactate: مين بيزوّد ومين بيشيل"
        alt: "A lactate pool in the middle. On the left, what adds lactate: heart failure or shock causing tissue hypoxia. On the right, what removes it: the liver clears lactate, and the kidney clears metformin, which otherwise reduces liver lactate use. A sick heart, liver or kidney tips the balance into lactic acidosis, so CHF, hepatic and renal impairment are the contraindications."
        caption: |
          - **الشمال**: الـ lactate **بيزيد** لما الأنسجة ما يوصلهاش oxygen (القلب ضعيف أو صدمة).
          - **اليمين**: **بيتشال** في الكبد، والـ metformin نفسه بيخرج من الكلية.
          - أي عضو من التلاتة يتعب يقلب الميزان لـ ==lactic acidosis==: عشان كده الموانع هي **CHF و hepatic و renal impairment** (التفسير المقبول، مش في الكتاب).
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L12m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="L12m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <text x="80" y="20" text-anchor="middle" class="t-sm t-b t-bad">Adds lactate</text>
            <text x="250" y="20" text-anchor="middle" class="t-sm t-b t-good">Removes it</text>
