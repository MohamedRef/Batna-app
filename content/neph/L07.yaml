  - id: neph.L07.201
    kind: mcq
    topic: nps
    stem: A 20-year-old woman has microhematuria and mild proteinuria, absent patellae, and triangular lunulae on her thumbnails. Pelvic X-ray shows posterior iliac horns. Diagnosis and gene?
    options:
      - Nail-patella syndrome, LMX1B
