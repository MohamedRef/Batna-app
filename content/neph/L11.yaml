    front: What are the benefits and risks of combined hormonal contraceptives?
    back: Benefits are protection against ovarian and endometrial cancer; risks are hypertension, cervical and breast cancer, and ischemic stroke.
    src: { page: 368, quote: "Contraceptive methods include agents containing estrogen and progesterone (pill, ring, and patch), progesterone-only agents (injection and pill), intrauterine devices, barrier methods, and sterilization. Fig2 outlines the advantages and disadvantages associated with various contraceptive options. Oral contraceptive agents containing estrogen/progestin are commonly recommended to women of childbearing age as an effective birth control method and are associated with benefits, such as protection against ovarian cancer and endometrial cancer.(41,42) On the contrary, combined hormonal contraceptives are associated with an increased risk of hypertension, cervical cancer, breast cancer, and ischemic stroke.(43,44) Combined hormonal contraceptives, containing both estrogen and progesterone, should be used with caution in patients receiving dialysis with uncontrolled hypertension or systemic lupus with positive antiphospholipid antibodies, because estrogen-containing contraceptives are associated with increased cardiovascular and thrombotic risks.(45) Progestin-only contraceptives may be used as an alternative as they have not been linked with worsening hypertension or ovarian, endometrial, and" }
    status: unverified
  - id: neph.L11.100
    kind: card
    topic: dialysis-contraception
    front: Why may drospirenone be a problem in kidney failure?
    back: This fourth-generation progestin has anti-mineralocorticoid activity and may raise potassium.
    src: { page: 369, quote: "colorectal cancers.(37,46) In comparison to combined hormonal contraceptives, progestin-only pills have a lower cardiovascular risk. (47) The fourth-generation oral progestin, drospirenone, may theoretically increase potassium levels because of its anti- mineralocorticoid activity.(48) A meta-analysis of studies of women without kidney failure showed that the thrombotic risk was higher in women using progestin-only injections than non-users (relative ratio [RR], 2.67; 95% CI, 1.29-5.53), while progestin-only pills or intrauterine devices did not increase this risk.(49) In the general population, long-term use of progestin-only injection, depot medroxyprogesterone acetate, has been associated with bone mass loss and osteoporosis.(50) Intrauterine devices remain the preferred method of contraception because of low failure rates and are not associated with an increased risk of hypertension, thrombotic events, or cardiovascular events. Barrier methods, which include condoms, diaphragms, cervical caps, and sponges, are nonhormonal contraceptives and not recommended for use because of their high failure rate. Sterilization, which includes female tubal ligation and male vasectomy, is the only permanent contraceptive method available.(47)" }
    status: unverified
    tags: [high-yield]
