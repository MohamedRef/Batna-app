          ومعظم الأدوية الـ systemic ما بتعديش الـ **blood–brain barrier** كويس، فالـ CNS يبقى ==sanctuary== تستخبى فيه الخلايا وترجع بعدين. علشان كده بنحقن في الـ CSF مباشرة. (تفسير فسيولوجي.)
