          X2- test is used to test an association between categorical variables which include a condition and characteristic.
          It is used when we want to study whether there is a relation between two qualitative variables.
          Degree of freedom = (c-1) (r-1)
          The final conclusion is reached is whether there is a significant association between certain condition and certain characteristic .
        title: "الـ chi-square لمين؟"
        text: |
          الـ ==X² test== بيختبر **association** بين متغيرات ==categorical== (condition وcharacteristic)، يعني علاقة بين **متغيرين qualitative**.

          - df = **(c − 1)(r − 1)**.
          - النتيجة: فيه association significant بين الـ condition والـ characteristic ولا لأ.
