          الكتاب بيرسم الـ aorta ست مرات، والأحمر هو الحتة المصابة:

          - **I**: فروع الـ arch بس.
          - **IIa**: الفروع + الـ ascending aorta والـ arch. **IIb**: نفس IIa + الـ descending thoracic.
          - **III**: الـ descending thoracic + الـ abdominal + الـ renal arteries.
          - **IV**: الـ abdominal aorta والـ renal بس.
          - **V**: كله.

          التفسير المقبول (مش في الكتاب): ده تقسيم **Numano** بالـ angiography. والمهم: المكان بيحدد الأعراض: فوق (I و II) ← دراع من غير نبض وفرق ضغط؛ تحت (III و IV) ← ==renal artery stenosis== و hypertension.
      - kind: explain
        page: 136
        title: "العلاج"
        quote: "High dose glucocorticoid therapy (40-60 mg/day prednisone-equivalent) should be initiated immediately for induction of remission in active giant cell arteritis (GCA) or Takayasu arteritis (TAK)."
        text: |
          - أكّد الـ large-vessel vasculitis (LVV) بـ **imaging أو histology**
          - **Giant cell arteritis (GCA)/Takayasu arteritis (TAK) active:** ==prednisone 40–60 mg/day immediately==
          - **GCA refractory/relapsing** أو خطر steroids عالي: ==tocilizumab== (أو methotrexate)
          - **TAK:** non-biologic steroid-sparing لكل العيانين، و biologics للـ refractory
          - **No routine** antiplatelets أو anticoagulants
          - **PMR:** prednisone **15 mg**، taper على **12–18 months**، methotrexate (MTX) second line، **glucocorticoid-induced osteoporosis (GIOP) prophylaxis**، ودوّر على temporal arteritis
      - kind: explain
        page: 136
        title: "ليه الجرعة عالية، وليه النهارده؟"
        quote: "High dose glucocorticoid therapy (40-60 mg/day prednisone-equivalent) should be initiated immediately for induction of remission in active giant cell"
        text: |
          الكتاب بيقول **high dose glucocorticoid (40–60 mg/day)** يبدأ ==immediately== في الـ active GCA أو TAK.

          التفسير المقبول (مش في الكتاب):
          - **Immediately**: في الـ GCA العين ممكن تروح في **ساعات أو أيام**، والـ blindness مش بترجع. الـ biopsy ممكن تتعمل بعد ما تبدأ steroids بأيام قليلة والالتهاب لسه باين.
          - **جرعة عالية**: عشان **induction of remission**، تطفي الالتهاب بسرعة قبل ما الجدار يتليف ويضيق على طول.

          وبعدين ليه **tocilizumab** في الـ GCA الـ refractory أو اللي عنده خطر من الـ steroids؟ لأنه **glucocorticoid-sparing**: بيسمح تنزل الـ steroids أسرع. والـ **antiplatelets** و **anticoagulants** مش routine لأن المشكلة التهاب الجدار مش جلطة، فتديهم بس لو فيه سبب تاني.
      - kind: explain
        page: 137
        title: "علاج الـ PMR: ليه 15 mg بس؟"
        quote: "Slow taper over 12 to 18 months."
        text: |
          الكتاب: **prednisone 15 mg**، **slow taper over 12–18 months**، **MTX** كـ second line، **GIOP prophylaxis**، و ==look for temporal arteritis==.

          التفسير المقبول (مش في الكتاب) لكل نقطة:
          - **15 mg** مش 40–60: لأن الـ PMR من غير GCA **مفيش عين في خطر**، والجرعة الصغيرة كفاية تطفيها، والاستجابة السريعة عليها بتأكد التشخيص.
          - **Taper بطيء 12–18 شهر**: لو نزلت بسرعة الـ PMR بترجع.
          - **GIOP prophylaxis**: steroids سنة ونص في ست كبيرة = **عضم بيضعف**، فلازم calcium و vitamin D وغيرهم.
          - **دوّر على الـ temporal arteritis**: لأنها بتمشي مع الـ PMR، وجرعة 15 mg **مش كفاية** تحمي العين.

          والكتاب بيقول **concept of benign outcome challengeable**: يعني الـ PMR مش دايمًا "مرض خفيف".
