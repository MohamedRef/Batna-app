  - id: rheum.L10.lesson1
    title: "ليه الـ biologics؟ خلايا الـ T helper"
    hook: "كل دوا biologic بيقفل باب واحد في المناعة. عشان تعرف أنهي باب، لازم تعرف مين بيفتحه."
    minutes: 9
    pages: [173, 174]
    topics: [approaches, tcells]
    goals:
      - "تعدّ التلات طرق اللي الـ biologics بتشتغل بيها وليه"
      - "تفرّق Th1 و Th2 و Th17 و T reg بالـ cytokines والأمراض"
      - "تفهم ليه Th1 و Th2 بيكبحوا بعض"
    status: unverified
    steps:
      - kind: explain
        page: 173
        title: "تلات طرق"
        quote: "The major biologic approaches in clinical use, including both medications made by molecular biologic techniques, biologic agents, biosimilar medications with near-identity to the original biologic agents, and small molecule kinase inhibitors, include agents that:\n  Interfere with cytokine function or production.\n  Inhibit the \"second signal\" required for T-cell activation.\n  Deplete B cells."
        text: |
          من أواخر التسعينات، الـ biologics والـ kinase inhibitors غيّروا علاج الـ rheumatoid arthritis (RA) وأخواتها. بيعملوا واحدة من تلاتة:
          1. ==Interfere with cytokines== (function أو production)
          2. يوقفوا الـ **second signal** اللي الـ T cell محتاجاه علشان تتنشط
          3. ==Deplete B cells==
      - kind: reveal
        page: 173
        prompt: "ليه الكتاب بيختار التلات أهداف دول بالذات: الـ cytokines، والـ second signal، والـ B cells؟"
        quote: "Inhibit the ―second signal‖ required for T-cell activation."
        answer: |
          الكتاب بيقول الـ biologic approaches بتعمل حاجة من تلاتة: ==interfere with cytokine function or production==، **inhibit the second signal** اللي الـ T cell محتاجاه عشان تتنشط، أو **deplete B cells**.

          التفسير المقبول (مش في الكتاب): دول تلات نقط على **نفس الطريق** بتاع الالتهاب المزمن:
          - الـ **T cell** محتاجة **إشارتين** عشان تشتغل: الـ antigen، وإشارة تانية من الخلية اللي بتقدّمه (افتكر المحاضرة 6). لو قفلت التانية، الـ T cell بتشوف الـ antigen ومتعملش حاجة.
          - الـ **cytokines** هي **الرسايل** اللي الخلايا المتنشطة بتبعتها للمفصل والجلد؛ لو قفلتها، الخلية شغالة بس صوتها مش واصل.
          - الـ **B cells** بتعمل antibodies وبتقدّم antigen وبتنشّط T cells (ص 176–177)، فشيلها بيقطع أكتر من طريق.
      - kind: explain
        page: 173
        title: "Th1 ضد Th2: ليه كل واحد بيكبح التاني؟"
        quote: "The cytokines generated by Th1 or Th2 cells respectively inhibit the cellular"
        text: |
          الكتاب: الـ **T helper (Th)** subsets كل واحد بيفرز **array of specific cytokines** بتأثر على بداية واستمرار الالتهاب. وبيقسمهم لـ **Th1** و **Th2**، و ==cytokines كل واحد بتكبح التاني==. وفيه كمان **Th17** و **regulatory T cells (T reg)**.

          وفي ص 174 بالتفصيل: الـ **interferon gamma و IL-2** (من Th1) بيكبحوا تكاثر الـ Th2، والـ **IL-4 و IL-10** (من Th2) بيكبحوا cytokines الـ Th1.

          التفسير المقبول (مش في الكتاب): ده زي **ميزان**: المناعة بتختار طريق واحد على حسب العدو (خلية مصابة = Th1، طفيل أو antibody = Th2)، والكبح المتبادل بيخليها **تلتزم** بالطريق ده بدل ما تشتغل في الاتجاهين. وده سبب إن الأمراض بتتقسم: الـ **RA** والـ psoriasis على ناحية الـ Th1، والـ **SLE** والـ systemic sclerosis على ناحية الـ Th2، والعلاج بيتختار على حسب الناحية.
      - kind: figure
        page: 174
        quote: "Th1 cells\n  Cell-mediated inflammation in rheumatoid arthritis, psoriasis, psoriatic arthritis, acute allograft rejection, graft-versus-host disease, and others.\n  Some of the proinflammatory mediators produced by Th1 cells include interferon gamma (IFNg), tumor necrosis factor (TNF), and interleukin (IL)-2. IFNg and IL-2 can inhibit Th2 cell proliferation."
        title: "أربع عائلات T helper"
        alt: "A naive T cell in the centre branches into four boxes. Th1 makes IFN-gamma, TNF and IL-2 and drives RA, psoriasis and graft rejection. Th2 makes IL-4, 5, 10 and 13 and drives antibodies, eosinophils, SLE and systemic sclerosis. Th17 forms under TGF-beta, IL-6 and IL-23 and makes IL-17. T reg forms under TGF-beta and protects with IL-10 and TGF-beta. A double arrow between Th1 and Th2 shows mutual inhibition."
        caption: "الـ ==Th1== والـ **Th2** بيكبتوا بعض، والـ **Th17** بيعمل IL-17، والـ ==T reg== هو الفرامل."
        svg: |
