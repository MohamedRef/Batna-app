  # ------------------------------------------------------------------
  # Split from lesson1 and lesson2 on 2026-11-13 (#828): the stages and
  # the neurological evaluation.
  - id: dm.L06.lesson4
    title: "مراحل القدم السكري والفحص العصبي"
    hook: "الرجل بتنزل سلّم من 4 درجات، وأول درجة بتتكشف بخيط نايلون وشوكة رنانة."
    minutes: 8
    pages: [67, 70]
    topics: [stages, neuro]
    goals:
      - "ترتب الـ DF stages وتفرّق wet عن dry necrosis"
      - "تعرف أدوات الفحص العصبي على السرير"
      - "تعرف امتى تطلب NCS وامتى لأ"
    status: unverified
    steps:
      - kind: explain
        page: 67
        title: "الـ DF stages"
        quote: "High-risk Foot: Presence of Neuropathy, Ischemia &/or Deformity."
        text: |
          1. ==High-risk foot==: neuropathy, ischemia and/or deformity
          2. **Ulcerated foot**: neuropathic or ischaemic ulcer
          3. **Infected foot**: local ulcer infection, cellulitis and/or osteomyelitis
          4. **Necrotic foot**: wet or dry necrosis

          كل مرحلة هي اللي قبلها **ومعاها حاجز جديد اتكسر**: الأول الرجل في خطر بس الجلد سليم، بعدين الجلد اتفتح (ulcer)، بعدين الميكروب دخل (infection)، وفي الآخر النسيج نفسه مات (necrosis). عشان كده الوقاية في المرحلة الأولى أرخص وأنجح بكتير من أي علاج بعد كده.
      - kind: figure
        page: 67
        title: "صور الكتاب ص 67: الـ high-risk foot"
        image: { file: dm/L06-high-risk-foot.webp, book: true }
        alt: "Book photos, four feet in a row, each with a deformity and intact skin: clawed toes over a bony forefoot, a stained foot with curled toes, a high-arched foot with clawed toes, and a bunion at the base of the big toe with the big toe angled toward the others."
        caption: |
          أربع رجلين **جلدهم سليم** لسه، بس كل واحدة فيها ==deformity==:

          - **أول صورة من الشمال**: صوابع معووجة لتحت (clawing) وعظم الـ forefoot باين.
          - **التانية**: رجل ملوّنة والصوابع متنية.
          - **التالتة** (الخلفية الزرقا): **قوس عالي** في نص الرجل والصوابع معووجة.
          - **الرابعة**: **hallux valgus**، بروز عند قاعدة الصباع الكبير وهو مايل على اللي جنبه.

          كل بروز من دول نقطة ضغط عالي، ودي أماكن القرحة الجاية.
      - kind: figure
        page: 67
        title: "صور الكتاب ص 67: الـ ulcerated foot"
        image: { file: dm/L06-foot-ulcers.webp, book: true }
        alt: "Book photos, two soles. Left: a round ulcer with a thick callus rim under the ball of the big toe, plus a raw area on a lesser toe. Right: a black, dead tip of the big toe on an otherwise pale foot."
        caption: |
          - **الشمال**: قرحة مدوّرة **تحت راس أول metatarsal** (باطن الرجل تحت الصباع الكبير)، وحواليها **callus** سميك. ده شكل الـ ==neuropathic ulcer==: في نقطة ضغط، والرجل مش حاسة.
          - **اليمين**: **طرف الصباع الكبير** أسود ومتآكل. ده شكل الـ ==ischaemic ulcer==: في أطراف الصوابع، أبعد مكان الدم بيوصله.
      - kind: figure
        page: 67
        title: "صورة الكتاب ص 67: الـ infected foot"
        image: { file: dm/L06-infected-ulcer.webp, book: true }
        alt: "Book photo, close-up of a deep punched-out ulcer with a pale rim, surrounded by red, swollen skin."
        caption: "قرحة **عميقة** في **النص**، وحواليها الجلد **أحمر ومنفوخ** في كل الاتجاهات: ده الـ ==cellulitis== اللي بيقول إن الميكروب دخل، فبقت المرحلة التالتة."
      - kind: order
        page: 67
        quote: "High-risk Foot: Presence of Neuropathy, Ischemia &/or Deformity."
        prompt: "رتّب مراحل الـ diabetic foot من الأول للآخر:"
        steps:
          - "High-risk foot"
          - "Ulcerated foot"
          - "Infected foot"
          - "Necrotic foot"
        why: "الجلد السليم في خطر ← الجلد يتفتح ← الميكروب يدخل ← النسيج يموت. كل خطوة محتاجة اللي قبلها."
      - kind: table
        page: 68
        quote: "Wet Necrosis (Neuropathic Foot)"
        title: "الـ necrosis: مبلولة ولا ناشفة؟"
        columns: [Necrosis, Foot type]
        rows:
          - ["Wet", "Neuropathic"]
          - ["Dry", "Ischaemic"]
        hide: [[0, 1], [1, 1]]
      - kind: figure
        page: 68
        title: "صور الكتاب ص 68: wet قدام dry"
        image: { file: dm/L06-wet-dry-necrosis.webp, book: true }
        alt: "Book photos, two feet. Left: a forefoot with moist, grey and yellow dead tissue, slough and blood around the toes. Right: a dry, black big toe on a red, scaly foot."
        caption: |
          - **الشمال**: ==wet necrosis==. نسيج ميت **مبلول**، رمادي وأصفر، ودم وإفرازات حوالين الصوابع.
          - **اليمين**: ==dry necrosis==. **الصباع الكبير أسود وناشف**، وباقي الرجل حمرا.

          الكتاب بيحط الـ wet مع الـ **neuropathic foot** والـ dry مع الـ **ischaemic foot**.
      - kind: reveal
        page: 68
        quote: "Dry Necrosis (Ischaemic Foot)."
        prompt: "ليه الـ ischaemic foot بيعمل dry necrosis والـ neuropathic بيعمل wet؟"
        answer: |
          التقسيم من الكتاب، والتفسير المقبول (مش في الكتاب): في الـ **ischaemic foot** الدم مش واصل، فالنسيج بيموت وينشف ويسود (**mummification**)، وغالبًا من غير infection كبيرة.

          في الـ **neuropathic foot** الدم واصل، فالنسيج الميت بيتعفن مع infection ويبقى مبلول وريحته وحشة (**wet**).
      - kind: check
        page: 68
        quote: "Dry Necrosis (Ischaemic Foot)."
        question: "Black, shrivelled, cold toe with a clear demarcation line and absent pulses. Stage?"
        options: ["Necrotic: dry (ischaemic)", "Necrotic: wet (neuropathic)", "Infected foot", "High-risk foot"]
        answer: 0
        why:
          - "صح: dry necrosis = ischaemic foot."
          - "الـ wet مع الـ neuropathic foot، ومبلولة."
          - "الـ infected = infection أو cellulitis أو osteomyelitis من غير necrosis."
          - "الـ high-risk مفيهوش ulcer أصلًا."
      - kind: aside
        tone: exam
        page: 68
        quote: "Among Diabetic Patients, There is an AMPUTATION every 30 Seconds Throughout the World."
        text: "رقم الـ Lancet: كل ==30 seconds== فيه **amputation** لرجل مريض سكر في العالم. على ما تخلص الدرس ده، حوالي 16 رجل اتقطعت."
      - kind: explain
        remind: [dm.L06.016]
        page: 69
        title: "الـ neurological evaluation"
        quote: "Vibration Perception Threshold (VPT)"
        text: |
          تلات أدوات على السرير:
          - **10-gram monofilament**
          - **Vibration sense** بالـ tuning fork
          - **Vibration Perception Threshold (VPT)** بالجهاز

          ليه دول بالذات؟ التفسير المقبول (مش في الكتاب): الـ **10-gram monofilament** بيتني عند قوة 10 جرام بالظبط، ودي تقريبًا أقل قوة لازم العيان يحسها عشان رجله تحميه؛ لو مش حاسس بيها، يبقى عنده **loss of protective sensation** وهيدوس على مسمار من غير ما يحس. والـ **vibration** بتتنقل في الألياف الكبيرة اللي بتتأذي بدري، فالـ **tuning fork** والـ VPT بيلقطوا الـ neuropathy قبل ما الحس يروح خالص.

          (تفاصيل الطريقة والأماكن في محاضرة **Diabetic foot** اللي قبلها.)
      - kind: figure
        page: 68
        title: "صورة الكتاب ص 68: الـ monofilament على باطن الرجل"
        image: { file: dm/L06-monofilament.webp, book: true }
        alt: "Book photo of a bare sole facing the camera. On the right, the examiner's hand holds a monofilament whose nylon thread touches the sole under the ball of the big toe and bends."
        caption: "على **اليمين** إيد الدكتور ماسكة الـ **10-gram monofilament**، والخيط لامس **باطن الرجل تحت الصباع الكبير** وبقى ==متني==. الانحناء ده هو اللي بيضمن إن القوة 10 جرام بالظبط."
      - kind: explain
        page: 70
        title: "والـ NCS؟"
        quote: "Only indicated if you are suspecting non-diabetic cause for neurogenic dysfunction!"
        text: |
          الـ **nerve conduction studies** ==NOT necessary== علشان تشخص **diabetic peripheral neuropathy**.

          بتطلبها **بس** لو شاكك إن فيه **non-diabetic cause** للمشكلة العصبية (مثلًا ضعف غير متماثل، أو تقدم سريع).
