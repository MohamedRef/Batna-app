          يعني الـ marker والـ creatinine ==بيكمّلوا بعض==: لما الاتنين موجبين النتيجة ==أوحش من أي واحد لوحده==.
      - kind: figure
        page: 123
        quote: "Glomerular and Tubular Kidney Stress Test: New Tools for a Deeper Evaluation of Kidney Function"
        title: "الـ kidney stress tests: رسمة الكتاب"
        image: { file: neph/L05-kidney-stress-tests.webp, book: true }
        alt: "Book diagram labelled KSTs: a nephron drawing with arrows to a glomerulus (glomerular) and a tubule (tubular). Under the glomerulus, 'Renal functional reserve, baseline GFR': a gauge of GFR from 25 to 200 ml/min/1.73 m2, green at a baseline of about 100 and red up to the stress GFR after an acute oral protein load of 1.2 g/kg. Under the tubule, 'Furosemide stress test': a gauge of urine output in ml/h, green at the unstressed baseline and red after stressed furosemide."
        caption: |
          فوق رسمة nephron مكتوب عليها **KSTs** (kidney stress tests)، وسهمين:

          - **شمال، Glomerular** ← **Renal Functional Reserve**: عداد GFR (من 25 لـ 200 ml/min/1.73 m²). الأخضر عند الـ **Baseline GFR** حوالي 100، والأحمر بيطلع لحد **Stress GFR** بعد **Acute oral protein load (1.2 g/kg)**.
          - **يمين، Tubular** ← **Furosemide Stress Test**: عداد urine output (ml/h). الأخضر **Baseline unstressed**، والأحمر بعد **Stressed furosemide**.

          المسافة بين الأخضر والأحمر في العداد الشمال هي ==renal functional reserve (RFR) = stimulated GFR − baseline GFR==. يعني الكلية ممكن تبان طبيعية في الـ baseline والـ ==reserve خلصان==، وده اللي الـ stress test بيكشفه.
      - kind: explain
        page: 123
        quote: "Renal function reserve"
        title: "ليه الـ protein بيعلّي الـ GFR؟"
        text: |
          الكتاب (Ronco و Chawla): **baseline GFR** مش كفاية؛ اعمل **kidney stress test**. الـ glomerular: **acute oral protein load (1.2 g/kg)** ← **stimulated GFR**؛ والـ tubular: **furosemide stress test**. والـ mechanisms: hormones (glucagon، growth hormone، vasopressin، RAS)، local mediators (prostaglandins، NO)، وتغيير الـ **TGF**، والنتيجة **arteriolar vasodilation** و **renal blood flow** أكتر.

          التفسير المقبول (مش في الكتاب): الكلية في الراحة مش بتشتغل بكل طاقتها. الوجبة البروتين بتطلب منها شغل زيادة **فـ** الأوعية تتفتح والـ GFR يعلى. الفرق ده هو الـ **reserve**. لو nephrons كتير ماتت، الباقي **أصلًا** شغال على الآخر عشان يحافظ على الـ baseline، **فـ** مش هيعرف يزوّد. يعني الـ reserve بيخلص **قبل** الـ baseline ما يقع.
      - kind: figure
        page: 123
        quote: "Renal function reserve"
        title: "الـ GFR بيعلى إزاي: رسمة الكتاب"
        image: { file: neph/L05-renal-reserve-physiology.webp, book: true }
        alt: "Book diagram 'Renal function reserve'. Left, baseline GFR: a glomerulus with labelled afferent arteriole, juxtaglomerular apparatus, efferent arteriole, Bowman's space and proximal tubule. Right, stimulated GFR: the same glomerulus with wider arterioles. Between them, physiological mechanisms (arteriolar vasodilation, decreased vascular resistance, increased renal blood flow) and effectors (hormones such as glucagon, growth hormone, vasopressin and the renin-angiotensin system; local mediators such as prostaglandins and nitric oxide; changes in tubuloglomerular feedback from altered tubular fluid). A bracket underneath: physiological stressor, e.g. acute protein load."
        caption: |
          - **شمال، Baseline GFR**: glomerulus عليه أسماء: afferent arteriole، juxtaglomerular apparatus، efferent arteriole، Bowman's space، proximal tubule.
          - **يمين، Stimulated GFR**: نفس الـ glomerulus بس الـ ==arterioles أوسع==.
          - **في النص**: **Physiological mechanisms**: arteriolar vasodilation، decreased vascular resistance، increased renal blood flow. وتحتها **Effectors**: hormones (glucagon، growth hormone، vasopressin، renin-angiotensin system)، local mediators (prostaglandins، nitric oxide)، وتغيير الـ tubuloglomerular feedback (TGF).
          - **تحت**: قوس **Physiological stressor (e.g., acute protein load)** بيربط الحالتين.

          يعني الـ protein ==بيفتح الأوعية== فالـ GFR يعلى، والفرق ده هو الـ reserve.
      - kind: figure
        page: 124
        quote: "Renal Functional Reserve"
        title: "الـ reserve مستخبي ورا الـ creatinine: رسمة الكتاب"
        image: { file: neph/L05-rfr-curve.webp, book: true }
        alt: "Book graph of GFR (ml/min/1.73 m2, 0 to 180) against functioning renal mass (100% to 0%). A red diagonal line falls from about 170 at 100% to 0 at 0%; a blue line stays flat at about 100 and joins the red line near 50%. The grey area between them is labelled renal functional reserve. Lightning bolts marked 'Insult' cause orange dips: in the white normal creatinine domain on the left the dips stay inside the reserve and are bracketed as subclinical AKI; in the pink elevated creatinine domain on the right an insult causes a deep fall."
        caption: |
          - **المحاور**: الرأسي **GFR** (0 لـ 180)، والأفقي **Functioning Renal Mass** من 100% شمال لـ 0% يمين.
          - **الخط الأحمر المايل**: الـ GFR بعد الـ stimulation. **الخط الأزرق**: الـ baseline GFR، ثابت حوالي 100 لحد ما الـ mass تقرّب من 50%.
          - **المساحة الرمادي بينهم**: ==Renal functional reserve==.
          - **البرق شمال (Insult)**: المنحنى البرتقاني بينزل جوه الرمادي ويرجع والـ baseline ما اتحركش: ده الـ **Subclinical AKI** (القوس فوق).
          - **الأرضية**: الأبيض شمال **Normal creatinine domain**، والوردي يمين **Elevated creatinine domain**: هناك مفيش reserve، فالـ insult بيوقّع الـ GFR على طول.

          يعني الكلية ممكن تخسر ==قريب من نص الـ nephrons== والـ creatinine لسه طبيعي، لأن ==الـ reserve بيغطي==.
