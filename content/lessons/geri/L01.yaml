      - kind: explain
        page: 19
        title: "الـ BNP مش بيكدب، بس مش لوحده"
        quote: "Causes of elevated natriuretic peptides"
        text: |
          الـ natriuretic peptides بتعلى في حاجات كتير غير الـ HF:

          **Cardiac:** ACS، PE، myocarditis، LVH، cardiomyopathies، valves، arrhythmias، cardioversion أو ICD shock، pulmonary hypertension…

          **Non-cardiac:** ==advanced age==، ==renal dysfunction==، stroke و SAH، cirrhosis with ascites، COPD، sepsis، burns، anemia، thyrotoxicosis و DKA.

          يعني عند الحاج اللي عنده 86 سنة و CKD، الـ BNP ممكن يعلى شوية من غير HF. الـ echo هو اللي يحكم.
