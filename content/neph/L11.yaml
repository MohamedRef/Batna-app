  # ---------- p390-392: immunosuppression ----------
  - id: neph.L11.187
    kind: card
    topic: tx-drugs
    front: Which immunosuppressants are withdrawn before a transplant recipient tries to conceive, and for how long is contraception continued?
    back: MMF/MPA and sirolimus; continue contraception for at least 3 months after withdrawal.
    src: { page: 390, quote: "Treatment management during pregnancy and following delivery Management of immunosuppression If a transplant recipient expresses her wish to get pregnant, then MMF/MPA and sirolimus should be withdrawn before attempting conception and replaced with other immunosuppressant regimens. Contraception should continue for at least 3 months following withdrawal. The manufacturer and the FDA (US Food and Drug Administration) have added a ‗black box' warning against MMF and MPA preparations regarding their teratogenicity risks. (104) The teratogenic effects of MMF on animals have been documented; however, there have been several reports suggesting the same in humans, with early pregnancy loss and a 27% incidence of congenital fetal malformation. The most commonly reported deformities were craniofacial malformations such as cleft lip and palate, microtia or anotia, with external auditory canal atresia, hypertelorism," }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.188
    kind: card
    topic: tx-drugs
    front: What are the fetal effects of mycophenolate?
    back: Early pregnancy loss and congenital malformation in 27%, mostly craniofacial (cleft lip and palate, microtia or anotia with ear canal atresia, hypertelorism, coloboma, micrognathia) and cardiac (conotruncal, aortic arch).
    src: { page: 390, quote: "Treatment management during pregnancy and following delivery Management of immunosuppression If a transplant recipient expresses her wish to get pregnant, then MMF/MPA and sirolimus should be withdrawn before attempting conception and replaced with other immunosuppressant regimens. Contraception should continue for at least 3 months following withdrawal. The manufacturer and the FDA (US Food and Drug Administration) have added a ‗black box' warning against MMF and MPA preparations regarding their teratogenicity risks. (104) The teratogenic effects of MMF on animals have been documented; however, there have been several reports suggesting the same in humans, with early pregnancy loss and a 27% incidence of congenital fetal malformation. The most commonly reported deformities were craniofacial malformations such as cleft lip and palate, microtia or anotia, with external auditory canal atresia, hypertelorism," }
    status: unverified
