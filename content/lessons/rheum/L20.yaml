  - id: rheum.L20.lesson2
    title: "خمس أشكال وصباع زي السجق"
    hook: "الـ DIP بتتعب في الـ PsA ومش في الـ RA، والسبب في كلمة واحدة: enthesis."
    minutes: 10
    pages: [329, 332]
    topics: [clinical, patterns]
    goals:
      - "تعدّ الـ domains وتدوّر على الصدفية المستخبية"
      - "تحفظ أشكال Moll and Wright بنسبها"
      - "تفرّق الـ axial PsA حسب الـ HLA-B27"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L20.020, rheum.L20.021]
        page: 329
        title: "الـ domains"
        quote: "Its various domains include:\n  Peripheral arthritis.\n  Axial involvement.\n  Enthesitis.\n  Dactylitis.\n  Uveitis.\n  Cutaneous and nail psoriasis."
        text: |
          ستة domains: **peripheral arthritis**، **axial**، ==enthesitis==، **dactylitis**، **uveitis**، و **skin and nail psoriasis**.

          ومعاهم comorbidities: **metabolic syndrome**، obesity، **cardiovascular disease**، depression.

          ومفيش أي marker يتوقع مين من عيانين الصدفية هيجيله arthritis.

          ليه الـ comorbidities جزء من الصورة؟ لأن الالتهاب المزمن والـ metabolic syndrome بيزوّدوا الـ cardiovascular risk، وكمان السمنة بتقلل الاستجابة للعلاج (درس الاستراتيجية).
      - kind: aside
        tone: exam
        page: 330
        quote: "If a patient is first seen with the classic articular manifestations of PsA but does not report PsO the physician must examine the patient's skin carefully, including the scalp, nails, umbilicus ,gluteal cleft and behind the ear."
        text: "عيان joints شكلها psoriatic arthritis (PsA) وبيقول مفيش صدفية؟ دوّر في: **scalp**، **nails**، **umbilicus**، **gluteal cleft**، و **behind the ear**. الأماكن اللي محدش بيبصلها."
      - kind: table
        page: 330
        quote: "The skin lesions of psoriasis usually appear before the arthritis in up to 80% and typically by 5-10 years."
        title: "مين الأول: الجلد ولا المفصل؟"
        columns: [Order, Share]
        rows:
          - ["Skin first (by 5–10 y)", "Up to 80%"]
          - ["Together", "10–15%"]
          - ["Joints first", "10–15%"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 330
        quote: "In another 10% to 15%, the joint symptoms precede the development of PsA and might be labeled undifferentiated spondyloarthropathy until the skin lesions develop."
        prompt: "عيان جاله arthritis شكله spondyloarthritis ومفيش صدفية خالص. بنسمّيه إيه، وليه لازم تفضل تكشف على جلده؟"
        answer: |
          في **10–15%** المفاصل بتسبق الجلد، فبيتسمّى ==undifferentiated spondyloarthropathy== لحد ما الصدفية تظهر.

          وعلشان كده:
          - دوّر على الصدفية المستخبية (scalp، nails، umbilicus، gluteal cleft، ورا الودن).
          - واسأل عن **family history**: في الـ CASPAR بياخد نقطة لو العيان نفسه مش مصاب.

          والعكس هو الأشيع: في **80%** الجلد بيسبق، غالبًا بـ **5–10 سنين**. يعني عيان الصدفية القديم اللي بدأ يشتكي من مفصل هو العيان اللي لازم تفكّر فيه بدري.
      - kind: explain
        page: 330
        title: "الجلد والمفاصل مش ماشيين مع بعض"
        quote: "In one prospective study, only 35% of patients reported that their skin and joint components flared at the same time."
        text: |
          - **Psoriasis vulgaris** هو أشيع phenotype.
          - شدة الجلد ==مالهاش علاقة كبيرة== بشدة المفاصل.
          - **35%** بس الـ flare بتاعهم بيبقى مع بعض.

          يعني ماتستناش الجلد يبقى وحش علشان تدوّر على المفاصل: صدفية بسيطة ممكن يكون معاها arthritis مدمّر، وده سبب إن كل عيان صدفية بيتسأل عن مفاصله.
      - kind: figure
        page: 330
        quote: "5 types of arthritis were originally described by Moll and Wright (1973)."
        title: "Moll and Wright: خمس أشكال"
        alt: "Five stacked hand sketches with percentages. Oligoarticular 70 percent: two asymmetric swollen joints and a sausage digit. Asymmetric DIP 10 percent: swollen fingertip joints with pitted nails. Arthritis mutilans 5 percent: shortened telescoped finger. Symmetric RA-like 15 percent: matching swollen joints on both hands. Psoriatic spondylitis 5 percent: a spine."
        caption: "الترتيب في الكتاب: ==oligo 70%==، distal interphalangeal (DIP) 10%، mutilans 5%، RA-like 15%، spondylitis 5%. (دراسات لاحقة لقت الـ poly 63% والـ oligo 13%.)"
        svg: |
