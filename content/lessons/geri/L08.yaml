      - kind: update
        page: 146
        quote: "Used in patients with tophi, two or more attacks yearly, history of chronic kidney disease, or history of urolithiasis"
        text: "**ACR 2020**: urate-lowering strongly recommended مع tophi (tophus) أو radiographic damage أو ≥2 flares/سنة، والـ **allopurinol** first line لحد ما الـ serum urate ينزل **<6 mg/dL**."
        ref: "ACR gout guideline 2020"
      - kind: table
        page: 146
        quote: "Gout is caused by sodium urate crystals and pseudogout is caused by calcium pyrophosphate crystals."
        title: "Gout ولا pseudogout؟"
        columns: [Feature, Gout, Pseudogout]
        rows:
