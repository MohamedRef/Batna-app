        title: "الـ induction والـ maintenance والـ relapse"
        text: |
          - ==Induction==: الـ **steroids** بتعمل remission في لحد **90%** من الـ type 1 AIP. ولو الـ steroids ممنوعة: **rituximab** لوحده.
          - ==Relapse==: بيحصل في **30–50%**. الـ steroids لسه مفيدة، والـ international consensus بيقول: رجّعها، أو زوّد الجرعة، أو ضيف immunosuppressant أو rituximab.
          - **Maintenance**: steroids بجرعة قليلة، أو rituximab، أو azathioprine، أو 6-mercaptopurine، أو mycophenolate mofetil.
          - **Prognosis**: الـ remission شائعة، بس المدى الطويل مش متدرس كويس، وحوالي **10%** بيروحوا لـ **chronic pancreatitis** بـ calcifications و exocrine insufficiency.

          ليه الـ rituximab بيشتغل هنا؟ التفسير المقبول (مش في الكتاب): بيمسح الـ **B cells** اللي بتطلع منها الـ IgG4 **plasma cells**، فبيقطع مصدر المرض من غير steroids.
