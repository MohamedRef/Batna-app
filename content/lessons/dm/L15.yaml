        answer: "الـ ==ketoanions== اللي كانت هتتحول bicarbonate راحت في البول، وإحنا ادّيناه **chloride** كتير في الـ saline. النتيجة **hyperchloremic normal-gap acidosis**، و==بتروح لوحدها==. الـ balanced solutions والـ saline الأبطأ بيقللوها."
