        page: 70
        quote: "Ankle Brachial Index (ABI)\n| Interpretation | ABI |\n|---|---|\n| Normal | 0.9 - 1.3 |\n| Mild PAD | 0.7 - 0.9 |\n| Moderate PAD | 0.4 - 0.7 |\n| Severe PAD | <0.4 |"
        title: "الـ ABI (محاضرة 6)"
