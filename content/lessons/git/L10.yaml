  # ------------------------------------------------------------------
  - id: git.L10.lesson1
    title: "البلعة رحلة من فوق لتحت"
    hook: "اللقمة بتعدّي على بوابتين وماسورة عضلات. أي حتة تبوظ، المريض يقولك: الأكل واقف هنا."
    minutes: 8
    pages: [269, 272]
    topics: [physiology, dysphagia, classification]
    goals:
      - "تعرف الـ UES والـ LES والـ body معمولين من إيه وبيعملوا إيه"
      - "تفرّق بين dysphagia و odynophagia، و oropharyngeal و esophageal"
      - "تقسّم أسباب الـ dysphagia زي ما المحاضرة بتقسمها"
    status: unverified
    steps:
      - kind: explain
        page: 269
        quote: "Coordinated, sequential motility pattern that propels food (from above)"
        title: "المريء عنده شغلانتين"
        text: |
          المريء مش ماسورة ساكتة. علشان ينقل الأكل كويس لازم يعمل حاجتين مع بعض:

          - ==Propulsion== من فوق: **coordinated, sequential motility** بتزق اللقمة لتحت.
          - ==Antireflux== من تحت: يمنع ويـ clear الـ acid والـ bile اللي راجعين من المعدة.

          لو الحركة دي اتلخبطت، الأكل والسوايل مش بيوصلوا كويس، والمريض يحس بـ **dysphagia** و **chest pain**.
      - kind: figure
        page: 270
        quote: "The transition from skeletal to smooth muscles occurs in the mid-esophagus."
        title: "خريطة المريء"
        alt: "A vertical sketch of the esophagus: UES at the top (striated, stops air), the body with striated muscle above and smooth muscle below meeting at the mid-esophagus, and the LES at the bottom (smooth, tonic, stops reflux) above the stomach."
        caption: "الـ UES عضلة striated بتمنع الهوا، والـ LES عضلة smooth مقفولة على طول بتمنع الـ reflux. والتحويل من striated لـ smooth في نص المريء."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <rect x="90" y="14" width="60" height="34" rx="8" class="fg-acc"/>
            <text x="120" y="36" text-anchor="middle" class="t-sm t-b">UES</text>
            <text x="160" y="28" class="t-sm">Striated muscle</text>
            <text x="160" y="43" class="t-sm t-mut">keeps air out</text>
            <rect x="100" y="48" width="40" height="110" class="fg-box"/>
            <text x="160" y="90" class="t-sm">Body: striated above</text>
            <path d="M88 160h64" class="fg-thin"/>
            <text x="160" y="164" class="t-sm t-acc t-b">Mid-esophagus</text>
            <text x="160" y="179" class="t-sm t-mut">skeletal → smooth</text>
            <rect x="100" y="162" width="40" height="110" class="fg-box"/>
            <text x="160" y="215" class="t-sm">Body: smooth below</text>
            <text x="160" y="232" class="t-sm t-mut">outer longitudinal +</text>
            <text x="160" y="247" class="t-sm t-mut">inner circular layers</text>
            <rect x="90" y="272" width="60" height="34" rx="8" class="fg-good"/>
            <text x="120" y="294" text-anchor="middle" class="t-sm t-b">LES</text>
            <text x="160" y="286" class="t-sm">Smooth, baseline tone</text>
            <text x="160" y="301" class="t-sm t-mut">keeps reflux out</text>
            <path d="M120 306c-40 10-60 40-30 50h80c30-10 10-40-20-50" class="fg-ink"/>
            <text x="120" y="342" text-anchor="middle" class="t-sm t-mut">Stomach</text>
          </svg>
      - kind: explain
        page: 270
        quote: "Peristalsis is the coordinated contraction of these two layers that propels the intraluminal esophageal content into the stomach."
        title: "الـ peristalsis"
        text: |
          جسم المريء فيه طبقتين: **outer longitudinal** و **inner circular**. لما الاتنين ينقبضوا بالتنسيق، ده اسمه ==peristalsis==، وهو اللي بيزق اللقمة للمعدة.

          افتكر الشكل ده كويس: الـ **achalasia** هتبوّظ الـ LES والـ peristalsis مع بعض، والـ **GERD** هيبوّظ الـ LES من الناحية التانية.
      - kind: explain
        page: 270
        quote: "Is defined as difficulty swallowing food or liquid due to the sensation of it sticking in the throat or chest"
        title: "Dysphagia: الأكل واقف"
        text: |
          الـ ==dysphagia== = صعوبة بلع أكل أو سوايل، مع إحساس إنه **sticking in the throat or chest**، وممكن discomfort أو choking.

          ونوعين حسب المكان:
          - **Oropharyngeal**: المشكلة في نقل اللقمة من الـ oropharynx لأول المريء.
          - **Esophageal**: المشكلة في نقلها جوه **body of the esophagus**.

          والمحاضرة بتقول: **history usually suggests the correct diagnosis**.
      - kind: reveal
        page: 271
        quote: "Odynophagia is sharp substernal pain on swallowing that may limit oral intake. It usually reflects severe erosive disease."
        prompt: "إيه الفرق بين dysphagia و odynophagia؟ وإيه أشهر سبب للتانية؟"
        answer: |
          الـ ==odynophagia== = **sharp substernal pain on swallowing**، يعني البلع **بيوجع** مش بس صعب. وبتعكس غالبًا **severe erosive disease**.

          أشهر سبب: **infectious esophagitis** (Candida، herpes، CMV) خصوصًا في الـ immunocompromised. وكمان **caustic ingestion** و **pill-induced ulcers**.
      - kind: aside
        tone: joke
        page: 271
        quote: "It may also be caused by corrosive injury due to caustic ingestions and by pillinduced ulcers"
        text: |
          الـ **pill-induced ulcers** دي بتحصل لما حد ياخد الـ doxycycline على الريق بشفطة مية صغيرة وينام على طول. الحباية بتقف في المريء وتعمل قرحة. علشان كده "اشرب كوباية مية كاملة واقعد ربع ساعة" مش رخامة من الصيدلي.
      - kind: check
        page: 271
        quote: "It is most commonly associated with infectious esophagitis due to Candida, herpesviruses, or CMV, especially in immunocompromised patients."
        question: "A patient on chemotherapy has sharp retrosternal pain with every swallow. Most common cause per the lecture?"
        options:
          - "Infectious esophagitis (Candida, herpes, CMV)"
          - "Achalasia"
          - "Peptic stricture"
          - "Zenker diverticulum"
        answer: 0
        why:
          - "صح: الـ odynophagia أشهر سبب ليها infectious esophagitis، خصوصًا مع ضعف المناعة."
          - "الـ achalasia بتعمل dysphagia للأكل والسوايل و regurgitation، مش وجع حاد مع كل بلعة."
          - "الـ peptic stricture بتعمل dysphagia للأكل الناشف بتزيد على شهور."
          - "الـ Zenker سبب structural لـ oropharyngeal dysphagia."
      - kind: explain
        page: 271
        quote: "ALS (amyotrophic Lateral Sclerosis), CNS tumors (benign or malignant), Multiple sclerosis, Muscular dystrophy, Myasthenia gravis, Parkinson disease"
        title: "A. Oropharyngeal: الأعصاب أو البنية"
        text: |
          أسباب الـ ==oropharyngeal== dysphagia نوعين:

          - **Neuromuscular**: ALS، CNS tumors، multiple sclerosis، muscular dystrophy، myasthenia gravis، Parkinson، polymyositis/dermatomyositis، stroke.
          - **Structural**: carcinoma، osteophytes، prior surgery or radiation، proximal esophageal web، thyromegaly، **Zenker diverticulum**.
      - kind: explain
        page: 272
        quote: "Primary: like Achalasia, Diffuse esophageal spasm, Hypercontractile (jackhammer) esophagus, Hypertensive LES, Nutcracker (high-pressure) esophagus"
        title: "B. Esophageal: حركة ولا سدّة؟"
        text: |
          الـ ==esophageal== dysphagia (نص وتحت المريء) نوعين كبار:

          - **Neuromuscular (motility)**: primary زي achalasia، DES، jackhammer، hypertensive LES، nutcracker. و secondary زي **Chagas**، reflux-related dysmotility، **scleroderma**.
          - **Structural (mechanical)**: intrinsic زي carcinoma، diverticula، **eosinophilic esophagitis**، rings and webs، Schatzki ring، foreign body، medication-induced و peptic stricture. و extrinsic: mediastinal mass، spinal osteophytes، vascular compression.
      - kind: sort
        page: 272
        quote: "Secondary: like Chagas disease, Reflux-related dysmotility, Scleroderma and other rheumatologic disorders."
        prompt: "حط كل سبب في مكانه:"
        bins: ["Oropharyngeal", "Esophageal: motility", "Esophageal: mechanical"]
        cards:
          - { text: "Myasthenia gravis", bin: 0 }
          - { text: "Zenker diverticulum", bin: 0 }
          - { text: "Achalasia", bin: 1 }
          - { text: "Scleroderma", bin: 1 }
          - { text: "Chagas disease", bin: 1 }
          - { text: "Schatzki ring", bin: 2 }
          - { text: "Eosinophilic esophagitis", bin: 2 }
          - { text: "Vascular compression", bin: 2 }
        why: "اللي فوق في البلعوم (أعصاب أو Zenker) oropharyngeal. اللي بيبوّظ الحركة (achalasia، scleroderma، Chagas) motility. واللي بيضيّق الماسورة من جوه أو برّه (Schatzki، EoE، vascular compression) mechanical."
      - kind: aside
        tone: exam
        page: 272
        quote: "Intrinsic: Carcinoma and benign tumors, Diverticula, Eosinophilic esophagitis, Esophageal rings and webs (other than Schatzki ring), Foreign body"
        text: |
          خلي بالك: المحاضرة حاطة **eosinophilic esophagitis** تحت **structural (mechanical) intrinsic**، مش تحت الـ motility، رغم إنها في نفس المحاضرة مع الـ achalasia.
      - kind: try
        items: [git.L10.007, git.L10.010, git.L10.016, git.L10.017, git.L10.018]
    recap:
      - "UES = striated، بتمنع الهوا. LES = smooth بـ baseline tone، بتمنع الـ reflux. التحويل في الـ mid-esophagus."
      - "Dysphagia = صعوبة. Odynophagia = وجع، وأشهر سبب infectious esophagitis."
      - "Oropharyngeal (neuromuscular أو structural) ضد esophageal (motility أو mechanical)."
      - "Primary motility: achalasia، DES، jackhammer، hypertensive LES، nutcracker. Secondary: Chagas، reflux، scleroderma."
    practice: [git.L10.001, git.L10.002, git.L10.003, git.L10.004, git.L10.005, git.L10.006, git.L10.007, git.L10.008, git.L10.009, git.L10.010, git.L10.011, git.L10.012, git.L10.013, git.L10.014, git.L10.015, git.L10.016, git.L10.017, git.L10.018, git.L10.019, git.L10.020]
  # ------------------------------------------------------------------
  - id: git.L10.lesson2
    title: "الـ achalasia: البوابة اللي نسيت تفتح"
    hook: "الأكل والمية الاتنين بيقفوا، والمريض بينام قاعد. ليه؟"
    minutes: 8
    pages: [272, 274]
    topics: [achalasia, achalasia-dx]
    goals:
      - "تشرح الـ achalasia من فقدان الأعصاب المثبّطة"
      - "تعرف أعراضها والـ red flags بتاعة الـ pseudoachalasia"
      - "تعرف كل test بيوري إيه، وأنهي أكثرهم sensitive"
    status: unverified
    steps:
      - kind: explain
        page: 272
        quote: "Loss of the inhibitory nerves at the sphincter"
        title: "اللي حصل بالظبط"
        text: |
          الـ ==achalasia== هي **the best defined primary motility disorder**.

          - في الـ LES: الأعصاب الـ **inhibitory** بتموت، فالـ sphincter ما بيعرفش **يرتخي** كويس، فيبقى فيه relative obstruction.
          - في الـ body: الأعصاب بتروح كمان، فتحصل ==aperistalsis==، الأكل يقعد (stasis)، والمريء يوسع.

          ممكن الـ manometry تلاقي الـ LES pressure أكتر من **40 mm Hg** (الصفحة دي).
      - kind: aside
        tone: analogy
        page: 272
        quote: "The loss of nerves along the esophageal body causes aperistalsis, leading to stasis of ingested food and subsequent dilation of the esophagus."
        text: |
          تخيّل باب جراج أوتوماتيك، الحساس بتاعه اتحرق. الباب واقف مقفول نُصّه، والعربيات (اللقم) متكدسة في الشارع (المريء) لحد ما الشارع نفسه يوسع. ده بالظبط الـ **dilated esophagus** في الـ achalasia.
      - kind: figure
        page: 273
        quote: "Barium swallow: which show dilatation of the esophagus with tapering smooth lower end (Beak deformity) due to failure of the sphincter to relax."
        title: "شكل الـ bird's beak"
        alt: "Sketch of a barium swallow in achalasia: a wide dilated esophagus holding barium with a horizontal fluid level, narrowing smoothly at the bottom into a thin pointed beak at the gastroesophageal junction above the stomach."
        caption: "مريء واسع فيه fluid level، وتحت بيضيق بنعومة زي منقار العصفورة (bird's beak) علشان الـ LES مش بيرتخي. النعومة دي مهمة: الـ cancer بيدي حافة irregular."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <path d="M140 10v40c-40 10-60 50-60 100s20 80 50 100l25 20l25-20c30-20 50-50 50-100s-20-90-60-100v-40" class="fg-acc"/>
            <path d="M84 120h162" class="fg-ink"/>
            <text x="252" y="124" class="t-sm t-b">Fluid level</text>
            <text x="252" y="180" class="t-sm">Dilated</text>
            <text x="252" y="195" class="t-sm">esophagus</text>
            <path d="M170 272h60" class="fg-thin"/>
            <text x="236" y="268" class="t-sm t-acc t-b">Smooth beak</text>
            <text x="236" y="283" class="t-sm t-mut">LES fails</text>
            <text x="236" y="298" class="t-sm t-mut">to relax</text>
            <path d="M165 280c-50 5-80 25-60 45h120c20-20-10-40-60-45" class="fg-box"/>
            <text x="165" y="318" text-anchor="middle" class="t-sm t-mut">Stomach</text>
          </svg>
      - kind: explain
        page: 272
        quote: "Dysphagia for both solids and liquids is the hallmark of achalasia."
        title: "الأعراض"
        text: |
          - ==Dysphagia for both solids and liquids==: ده الـ hallmark.
          - **Regurgitation** للأكل اللي قاعد في المريء، خصوصًا بالليل، فالمريض بينام على مخدات كتير أو قاعد على كرسي.
          - **Chest pain**: squeezing retrosternal، بيطلع للرقبة والفك والدراع والضهر، ممكن يزيد مع الأكل ويصحّيه من النوم.
          - **Heartburn** في 30%، من تخمّر الأكل المحبوس و lactic acid، مش reflux حقيقي.
          - الـ stress والأكل بسرعة بيزوّدوا كل ده. والـ **weight loss** موجود بس **slight**.
      - kind: check
        page: 273
        quote: "A sensation of heartburn may be reported by 30% of patients and is assumed to be related to retained food fermentation and lactic acid."
        question: "Why do about 30% of achalasia patients feel heartburn?"
        options:
          - "Fermentation of retained food and lactic acid"
          - "Reflux through a weak LES"
          - "Infectious esophagitis"
          - "Barrett esophagus"
        answer: 0
        why:
          - "صح: الأكل المحبوس بيتخمّر ويعمل lactic acid."
          - "بالعكس: الـ LES في الـ achalasia مقفول مش ضعيف."
          - "مش ده التفسير اللي في المحاضرة."
          - "الـ Barrett مضاعفة GERD، مش سبب الـ heartburn هنا."
      - kind: explain
        page: 273
        quote: "Pseudoachalasia. accounts for up to 5% of suspected cases and is more likely with advanced age, abrupt onset of symptoms (<1 year), and weight loss."
        title: "الـ differential، والـ pseudoachalasia أخطرهم"
        text: |
          الـ differential: **carcinoma of the gastric cardia**، **DES**، و **megaesophagus** في الـ amyloid.

          الـ ==pseudoachalasia== حوالي **5%** من الحالات المشتبه فيها، وغالبًا tumor. اشتبه فيها لما تلاقي:
          - **Advanced age**
          - **Abrupt onset** (أقل من سنة)
          - **Weight loss** واضح

          علشان كده **endoscopy** جزء أساسي من الـ evaluation. ولو مش واضحة: **CT** أو **EUS**. ونادرًا بتيجي من **paraneoplastic** antineuronal antibodies.
      - kind: mnemonic
        page: 273
        quote: "Pseudoachalasia. accounts for up to 5% of suspected cases and is more likely with advanced age, abrupt onset of symptoms (<1 year), and weight loss."
        word: "OLD"
        parts:
          - { key: "O", text: "Old age (advanced age)" }
          - { key: "L", text: "Loss of weight" }
          - { key: "D", text: "Duration short: abrupt onset, under 1 year" }
        hook: |
          الـ pseudoachalasia بتحب الـ **OLD**: عجوز، خسّ، والأعراض جديدة. شوفت التلاتة؟ منظار قبل أي balloon.
      - kind: table
        page: 273
        quote: "Manometry identifies early disease before esophageal dilatation and food retention, it is the most sensitive diagnostic test."
        title: "كل test بيوري إيه"
        columns: ["Test", "What it shows", "Why"]
        rows:
          - ["Barium swallow", "Dilated esophagus, fluid level, bird's beak", "Sphincter fails to relax"]
          - ["Manometry", "Aperistalsis, high LES pressure", "Most sensitive; catches early disease"]
          - ["Upper endoscopy", "Dilated esophagus; scope passes easily", "Essential to exclude carcinoma"]
          - ["EUS", "Tumor or infiltration", "Pseudoachalasia work-up; guides botox"]
        hide: [[0, 1], [1, 2], [2, 2], [3, 2]]
      - kind: check
        page: 273
        quote: "Hence, endoscopy should be part of the evaluation of achalasia."
        question: "A 72-year-old man has 5 months of dysphagia and lost 10 kg. Barium shows a bird's beak. Best next step?"
        options:
          - "Upper endoscopy to exclude carcinoma"
          - "Pneumatic dilation"
          - "Nitrates before meals"
          - "Repeat barium in 6 months"
        answer: 0
        why:
          - "صح: OLD كاملة (سن كبير، weight loss، أقل من سنة) = pseudoachalasia لحد ما يثبت العكس."
          - "الـ dilation قبل ما تستبعد الـ tumor بتعالج المرض الغلط."
          - "الـ nitrates علاج، مش هتستبعد cancer."
          - "التأجيل مع red flags خطر."
      - kind: try
        items: [git.L10.022, git.L10.025, git.L10.031, git.L10.032, git.L10.036]
    recap:
      - "Achalasia = loss of inhibitory nerves: LES ما بيرتخيش + aperistalsis ← stasis ← dilatation."
      - "Hallmark: dysphagia للأكل والسوايل. Regurgitation بالليل، chest pain، heartburn في 30%، weight loss خفيف."
      - "Pseudoachalasia حتى 5%: OLD (old، loss of weight، duration أقل من سنة) ← endoscopy، ثم CT أو EUS."
      - "Barium = bird's beak. Manometry = الأكثر sensitive. Endoscopy = تستبعد carcinoma."
    practice: [git.L10.021, git.L10.022, git.L10.023, git.L10.024, git.L10.025, git.L10.026, git.L10.027, git.L10.028, git.L10.029, git.L10.030, git.L10.031, git.L10.032, git.L10.033, git.L10.034, git.L10.035, git.L10.036, git.L10.037, git.L10.038, git.L10.039, git.L10.141]
