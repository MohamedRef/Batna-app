  - id: geri.L02.lesson2
    title: "الكرياتينين بيكدب على الكبار"
    hook: "ست عندها 70 سنة وشاب عنده 25، الاتنين كرياتينين 1.2. واحد كليته نص التانية."
    minutes: 9
    pages: [29, 34]
    topics: [gfr, ckd]
    goals:
      - "تحسب الـ creatinine clearance (CrCl) بـ Cockcroft-Gault"
      - "تعرف ليه الـ cystatin C أحسن عند الكبار"
      - "تعرف مين الكبير اللي الـ CKD عنده أخطر"
    status: unverified
    steps:
      - kind: explain
        page: 29
        title: "ليه الكرياتينين بيكدب؟"
        quote: "(↓ Body mass, debilitation, muscle atrophy) Standard measures of GFR or renal functions as s.cr, may be inappropriate to accurately monitor renal function)."
        text: |
          الكرياتينين بييجي من ==العضلات==. الحاج عضلاته قليلة، فالكرياتينين اللي بيتعمل أصلًا قليل.

          يعني الـ **glomerular filtration rate (GFR)** ممكن يكون واطي جدًا والـ **serum creatinine** شكله "طبيعي". علشان كده الكتاب بيقول الـ s.Cr ممكن يكون ==inappropriate== لمتابعة وظيفة الكلى عند الكبار.

          خد مثال يقرّبها: لو مصنع بيطلّع زبالة قليلة، وعربية الزبالة بقت تيجي نص المرات، الشارع هيفضل شكله نضيف. الكرياتينين القليل هو الزبالة القليلة، والكلية الضعيفة هي العربية اللي بقت تيجي قليل. الرقم في الدم "طبيعي"، بس الكلية فعلًا تعبانة، وده اللي بيخلّي جرعة الدوا تبقى غلط لو اعتمدت عليه.
      - kind: explain
        page: 30
        title: "Cockcroft-Gault"
        quote: "(140-age) x body weight (Kg) CG equation= ------------------------- - (85% if female) 72x s.creatinine (mg/dl)"
        text: |
          الـ GFR = **creatinine clearance**: يا تقيسه **U × V / P**، يا تحسبه:

          ==CrCl = (140 − age) × weight ÷ (72 × s.Cr)==

          والست **× 0.85**.

          شوف المعادلة: السن بيتطرح، والوزن بيضرب. يعني العجوز الرفيع هو أكتر واحد الكرياتينين بيضحك عليه.

          ليه كل جزء في المعادلة؟ التفسير المقبول (مش في الكتاب):
          - **(140 − age)**: كل سنة العضلات بتقل، فالكرياتينين اللي بيتعمل بيقل، فلازم نطرح.
          - **× weight**: الوزن بيمثّل كتلة العضلات اللي بتعمل الكرياتينين.
          - **× 0.85 للست**: عضلاتها في المتوسط أقل من الراجل في نفس الوزن.
      - kind: figure
        page: 34
        title: "نفس الكرياتينين، كلية مختلفة"
        quote: "S.Cr. Does not accurately reflect kidney function"
        alt: "Two patient cards side by side, both with serum creatinine 1.2 mg/dL: a 70-year-old 60 kg woman with creatinine clearance 41.3 ml/min and a 25-year-old 70 kg man with 93.2 ml/min."
