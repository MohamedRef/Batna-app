    front: How is the dry weight adjusted during pregnancy on hemodialysis (text, p379)?
    back: If euvolemic, raise it by 400 g a week, to match fetal growth after the first trimester (0.3-0.5 kg a week).
    src: { page: 379, quote: "Ultrafiltration during dialysis in a pregnant woman can be challenging. Fetal weight gain after the first trimester is mostly constant at 0.3-0.5kg per week. Therefore, as long as the patient is euvolemic, the dry weight can be increased by 400 gm per week to account for the growing fetus weight of 500 gm per week. Slow continuous ultrafiltration can be considered for excessive weight gain or refractory fluid overload states during pregnancy. (81) The suggested calorie intake during pregnancy in women receiving hemodialysis is 35kcal/kg/day. Protein intake of 1.5-1.8 gm/kg/day is recommended to account for adequate nitrogen balance and development of the fetus. Water-soluble vitamins should be continued throughout the pregnancy (Fig 4). (82) Nocturnal hemodialysis in pregnant women is safe, and women who conceived while utilizing nocturnal hemodialysis as their kidney replacement therapy can continue with the modality. Women receiving nocturnal hemodialysis tend to have decreased total peripheral vascular resistance, which decreases the incidence of fluctuating BP or volume overload. Nocturnal hemodialysis prescriptions during pregnancy usually require 7-8-hour sessions, 5-7 days a week. Women performing nocturnal hemodialysis might require phosphate supplementation in the dialysate to avoid hypophosphatemia because of prolonged dialysis sessions. (83)" }
