  - id: neph.L08.lesson2
    title: "النور الأخضر و case 1: الـ minimal change"
    hook: "أم لتوأم، edema لحد البطن، والـ LM طبيعي تمامًا. الـ EM بس هو اللي هيتكلم."
    minutes: 10
    pages: [218, 226]
    topics: [if-em, mcd]
    goals:
      - "تقرا أشكال الـ IF الأساسية"
      - "تعرف أماكن الـ deposits في الـ EM"
      - "تحل case 1 وتعرف الـ differential diagnosis (DD) والـ proteinuria"
    status: unverified
    steps:
      - kind: figure
        page: 218
        title: "أشكال الـ immunofluorescence"
        image: { file: neph/L08-if-patterns.webp, book: true }
        alt: "Eight immunofluorescence panels: mesangial IgA, mesangial and capillary wall IgG, peripheral granular C3 in type I MPGN, band-like C3 in type II MPGN, coarse granular C3 in post-infectious GN, fine granular IgG in membranous, linear IgG in anti-GBM and chunky IgG in fibrillary GN."
        caption: "من الكتاب: 8 أشكال للـ immunofluorescence (IF). أهمها: ==linear== = anti-GBM، **fine granular** على الـ capillary wall = membranous، **mesangial IgA** = IgA nephropathy."
      - kind: match
        page: 220
        quote: "Subepithelial hump-like electron dense deposits (postinfectious GN) Subendothelial dense deposits with mesangial interposition (type I MPGN)"
        prompt: "وصّل الـ pattern بالمرض"
        pairs:
          - ["Linear GBM IgG", "Anti-GBM GN"]
          - ["Finely granular capillary wall IgG", "Membranous"]
          - ["Mesangial IgA", "IgA nephropathy"]
          - ["Subepithelial humps on EM", "Postinfectious GN"]
          - ["Subendothelial deposits + mesangial interposition", "Type I MPGN"]
        why: "الـ IF بيقولك **إيه** الـ antibody وشكلها، والـ electron microscopy (EM) بيقولك **فين** بالظبط: mesangial، subendothelial، ولا subepithelial."
      - kind: aside
        tone: analogy
        page: 220
        quote: "Subepithelial hump-like electron dense deposits (postinfectious GN) Subendothelial dense deposits with mesangial interposition (type I MPGN)"
        text: |
          تخيّل الـ glomerular basement membrane (GBM) حيطة بين أوضتين: الـ **endothelium** من جوّه (ناحية الدم) والـ **podocyte** من برّه (ناحية البول).

          - **Subendothelial** = تحت الدهان من جوّه، قريب من الدم، فبيجيب ==inflammation== (nephritic): lupus III/IV، membranoproliferative glomerulonephritis (MPGN).
          - **Subepithelial** = على الحيطة من برّه، بعيد عن الدم، فبيضرب الـ podocyte ويعمل ==proteinuria==: membranous، والـ humps بتاعة post-infectious glomerulonephritis (PIGN).
      - kind: explain
        page: 221
        title: "Case 1"
        quote: "Presenting with bilateral L.L edema (3+), with severe abdominal distension (Hard edema) 40 days after giving birth to her baby twins."
        text: |
          ست عندها **28 سنة**، ولدت **توأم** من 40 يوم، وجاية بـ **bilateral lower limb (LL) edema 3+** وبطن منفوخة جامد.

          - **Creatinine 0.6**، ==urine protein-to-creatinine ratio (uPCR) 13.4== mg/mg، **albumin 2.4**
          - Cholesterol 389، triglycerides (TGs) 457
          - **C3 179** (طبيعي)، **antinuclear antibodies (ANA)** و virology سلبي
      - kind: check
        page: 223
        quote: "| Daily protein excretion | Cause |\n| 0.15 to 2.0 g | Mild glomerulopathies |\n| | Tubular proteinuria |\n| | Overflow proteinuria |\n| 2.0 to 4.0 g | Usually glomerular |\n| > 4.0 g | Always glomerular |"
        question: "Her proteinuria is about 13 g/day. What does the amount alone tell you?"
        options:
          - "It is always glomerular"
          - "It may be tubular"
          - "It may be overflow"
          - "It is usually glomerular, not always"
        answer: 0
        why:
          - "صح: أكتر من 4 g/day = ==always glomerular==."
          - "الـ tubular proteinuria في مدى 0.15–2 g بس."
          - "الـ overflow برضه في مدى 0.15–2 g."
          - "«Usually glomerular» ده مدى 2–4 g."
      - kind: table
        page: 222
        quote: "| Type | Pathophysiologic features | Cause |\n| Glomerular | Increased glomerular capillary permeability to protein. | Primary or secondary glomerulopathy. |\n| Tubular | Decreased tubular reabsorption of proteins in glomerular filtrate. | Tubular or interstitial disease. |\n| Overflow | Increased production of low-molecular-weight proteins. | Monoclonal gammopathy, leukaemia. |"
        title: "الـ proteinuria جاية منين؟"
        columns: [Type, Mechanism, Cause]
        rows:
          - ["Glomerular", "↑ capillary permeability", "Primary or secondary glomerulopathy"]
          - ["Tubular", "↓ tubular reabsorption", "Tubular or interstitial disease"]
          - ["Overflow", "↑ low-MW proteins made", "Monoclonal gammopathy, leukaemia"]
        hide: [[0, 1], [1, 1], [2, 2]]
      - kind: explain
        page: 222
        title: "الـ differential diagnosis (DD) في جدول واحد: بُص على الـ C3"
        quote: "| Diagnosis | Physical Findings | Renal Function | Serum Albumin | C3 Complement | UPr/Cr | Other |\n| MCNS | Edema | Normal | Low | Normal | >3.0 | Hyperlipidemia |\n| FSGS | Edema | Normal or low | Low | Normal | 1.0 to 3.0 | Hyperlipidemia; Hematuria? |\n| CNS | Anasarca | Normal or low | Very low | Normal | >3.0 | Hyperlipidemia |\n| MN | Edema | Normal or low | Very low | Normal | >3.0 | Hematuria? |\n| MPGN | Edema? | Normal or low | Low | Low | >3.0 | Hematuria; Hypertension |\n| PSGN | Edema | Low | Normal | Low | <1.0 | Hematuria; Hypertension |\n| HSP | Purpuric rash; Arthritis | Low | Normal or low | Normal | 1.0 to 3.0 | Hematuria; Hypertension? |\n| LN | Butterfly rash; Arthritis | Low | Normal or low | Low | 1.0 to 3.0 | Hematuria; Hypertension |\n| IgA | Edema? | Normal or low | Normal or low | Normal | 1.0 to 3.0 | Hematuria |\nCNS = congenital nephrotic syndrome, Cr = creatinine, FSGS = focal-segmental glomerular sclerosis, HSP = Henoch-Schönlein purpura, LN = lupus nephritis, IgA = immunoglobulin A nephropathy, MCNS = minimal-change nephrotic syndrome, MN = membranous nephropathy, MPGN = membranoproliferative glomerulonephritis, PSGN = poststreptococcal glomerulonephritis, UPr = urine protein"
        text: |
          في جدول الـ **differential diagnosis of nephrotic syndrome**، الـ ==C3 الواطي== بيطلع في 3 بس: **MPGN**، **post-streptococcal glomerulonephritis**، و **lupus nephritis**. الباقي (MCNS، focal segmental glomerulosclerosis (FSGS)، membranous، Henoch–Schönlein purpura (HSP)، IgA) C3 طبيعي.

          وعيانتنا الـ C3 بتاعها 179، يعني نشيل التلاتة دول.
      - kind: explain
        page: 222
        title: "ولو جالها AKI كمان؟"
