            <text x="200" y="15" class="t-sm t-acc">rash with spikes</text>
          </svg>
      - kind: table
        page: 202
        quote: "Table 1: Systemic JIA ILAR Classification Criteria\n1. Fever ≥2 weeks, quotidien in pattern (≥39°C at least once a day and returns to ≤37°C), documented daily for ≥3 days\n2. Arthritis in ≥1 joint (for ≥6 weeks)\n3. At least one of the following:\n  Evanescent erythematous rash;\n  Generalized lymph node enlargement;\n  Hepatomegaly and/or splenomegaly; or\n  Serositis"
        title: "ILAR criteria للـ systemic JIA"
        columns: ["Criterion", "Detail"]
        rows:
          - ["1. Fever", "≥ 2 weeks, quotidian, ≥ 39 °C daily, ≥ 3 days documented"]
          - ["2. Arthritis", "≥ 1 joint for ≥ 6 weeks"]
          - ["3. One of", "Evanescent rash, generalized LN, hepato/splenomegaly, serositis"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 201
        title: "الطفح والـ serositis"
        quote: "The rash is pale pink, blanching, and is characterized by small macules or maculopapules, transient, non pruritic and mostly on the trunk. Typical, erythematous and evanescent rash of systemic arthritis."
        text: |
          - الـ **rash**: pale pink، blanching، macules صغيرة، transient، **non-pruritic**، أغلبه على الـ trunk (==evanescent==)
          - American College of Rheumatology (ACR): **2 weeks fever** + الـ rash المميز. European League Against Rheumatism (EULAR): لازم feature تالتة غير الحمى والـ arthritis
          - ==Serositis== هي الـ **hallmark**: pericarditis، pleuritis، وممكن **tamponade**
          - الـ **uveitis نادر** هنا (عكس الـ oligo)

          ليه الطفح بيطلع مع الحمى ويختفي معاها؟ التفسير المقبول (مش في الكتاب): الاتنين جايين من نفس الدفعة من الـ cytokines (زي IL-1 و IL-6)؛ لما بتعلى الحرارة بتعلى والأوعية في الجلد بتتوسع، ولما تنزل الاتنين بيهدوا. علشان كده دور عليه وقت السخونية.
      - kind: explain
        page: 201
        title: "مضاعفات تقيلة"
        quote: "5. Severe vasculitis with secondary consumption coagulopathy, resposive to intensive steroid therapy.\n6. CNS manifestations of irritability and lethergy."
        text: |
          - **Severe vasculitis** مع ==secondary consumption coagulopathy==، وبتردّ على **intensive steroid therapy**
          - **Central nervous system (CNS):** irritability و lethargy
          - **Amyloidosis with secondary renal failure**: أشهر سبب وفاة، وبعده infection (ص 202)

          ليه الـ amyloidosis هنا بالذات؟ التفسير المقبول (مش في الكتاب): الالتهاب العالي المستمر سنين بيخلي الكبد يطلّع serum amyloid A كتير، وده بيترسب في الكلى. والـ systemic هو أكتر نوع فيه acute phase reactants عالية (ص 204)، فهو أكتر نوع بيوصل للـ amyloid.
      - kind: aside
        tone: exam
        page: 202
        quote: "Amyloidosis with secondary renal failure (The most common cause of death in systemic onset) followed by infection."
        text: "سؤال كلاسيكي: أشهر سبب وفاة في الـ systemic onset juvenile idiopathic arthritis (JIA)؟ **Amyloidosis with secondary renal failure**، وبعده infection."
      - kind: check
