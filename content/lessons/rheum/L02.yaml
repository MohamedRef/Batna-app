      - kind: table
        page: 34
        quote: "Acute uric acid nephropathy = precipitation of uric acid crystals in the collecting ducts and ureters causes secondary acute obstructive renal failure.\n  Strongly acid urine which reduces uric acid solubility potentiates this problem {likely to occur in ill, dehydrated patients with lymphoma or malignancy subjected to chemotherapy without adequate prophylactic treatment with allopurinol}."
        title: "الكلى في الـ gout"
        columns: ["Problem", "Key point"]
        rows:
          - ["Uric acid stones", "Renal colic in 10%; low urine pH, dehydration"]
          - ["Acute uric acid nephropathy", "Crystals block ducts; chemo without allopurinol"]
          - ["Chronic urate nephropathy", "Medullary deposits; only untreated tophaceous gout"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 34
        quote: "Dehydration and lowering of urine pH (chronic diarrhoea, starvation)."
        title: "ليه بتتكون الحصوة؟"
        text: |
          الكتاب بيقول إن uric acid stones بتعمل renal colic في **10%**، وبيدّي 3 حاجات بتساعدها. كل واحدة ليها منطق:

          - **Purine overproduction**: urate أكتر بيتصفى في البول.
          - **Uricosuric drugs** وعيوب الـ tubular reabsorption: الكلى بتطلّع urate أكتر في البول.
          - **Dehydration** و ==low urine pH== (chronic diarrhoea، starvation): بول أقل يعني تركيز أعلى، والبول الحامضي بيقلل ذوبان الـ uric acid.

          يعني نفس قاعدة الشاي والسكر: **تركيز عالي + مذيب قليل = ترسيب**. وعشان كده التفسير المقبول (مش في الكتاب) للوقاية: سوايل كتير، وتجنّب الـ uricosurics عند مريض عنده حصوات.
      - kind: explain
        page: 34
        quote: "Acute uric acid nephropathy = precipitation of uric acid crystals in the collecting ducts and ureters causes secondary acute obstructive renal failure."
        title: "الـ acute uric acid nephropathy: ليه بعد الكيماوي؟"
        text: |
          البلورات بتترسب في الـ **collecting ducts** والـ **ureters** فتسدّها ← ==acute obstructive renal failure==. والبول الحامضي جدًا بيزوّد المشكلة.

          الكتاب بيحدد المريض: **ill و dehydrated**، عنده **lymphoma أو malignancy**، أخد **chemotherapy من غير allopurinol** كـ prophylaxis.

          ليه التلاتة دول بالذات؟ ارجع لصفحة 26: الخلايا السرطانية لما تموت مرة واحدة بالكيماوي بتسيب **purines** كتير جدًا ← urate بيعلى فجأة. والجفاف بيقلل البول. فلو ماكنتش قفلت الإنتاج بالـ allopurinol قبلها، البلورات بتسد الأنابيب في أيام.
      - kind: aside
        tone: exam
        page: 35
        quote: "Progressive renal disease is an important complication confined to untreated severe chronic tophaceous gout."
        text: "كلمة «confined» مهمة: الـ chronic urate nephropathy مقصورة على الـ untreated severe chronic tophaceous gout. مش كل مريض نقرس هيعمل kidney failure من النقرس."
      - kind: explain
        page: 35
        quote: "This results from MSUM crystal deposition in the interstitium of the medulla and pyramids with consequent chronic inflammation, fibrosis, glomerulosclerosis and secondary pyelonephritis."
        title: "الـ chronic urate nephropathy: بطيئة وفي النسيج"
        text: |
          عكس الـ acute اللي بتسد الأنابيب، هنا البلورات بتترسب في **الـ interstitium** بتاع الـ ==medulla و pyramids==.

          والكتاب بيمشي السلسلة: chronic inflammation ← **fibrosis** ← **glomerulosclerosis** ← secondary **pyelonephritis**.

          التفسير المقبول (مش في الكتاب) لمكانها: الـ medulla هي الحتة اللي البول بيتركّز فيها، فتركيز الـ urate هناك أعلى حتة في الكلية. وعشان كده هي مقصورة على الـ **untreated severe** tophaceous gout: محتاجة urate عالي لسنين طويلة.
      - kind: check
        page: 34
        quote: "Strongly acid urine which reduces uric acid solubility potentiates this problem {likely to occur in ill, dehydrated patients with lymphoma or malignancy subjected to chemotherapy without adequate prophylactic treatment with allopurinol}."
        question: "A dehydrated man with lymphoma develops oliguric renal failure two days after chemotherapy given without allopurinol. What is the mechanism?"
        options: ["Uric acid crystals obstruct the collecting ducts and ureters", "Crystals deposit slowly in the medullary interstitium", "Immune-complex glomerulonephritis", "Calcium pyrophosphate deposits in the kidney"]
        answer: 0
        why:
          - "صح: ده الـ acute uric acid nephropathy، obstructive، والبول الحامضي بيزوّده."
          - "ده الـ chronic urate nephropathy، بياخد سنين في الـ untreated tophaceous gout."
          - "مالوش علاقة بالـ urate في الكتاب."
          - "الـ CPPD مش بيعمل الصورة دي."
