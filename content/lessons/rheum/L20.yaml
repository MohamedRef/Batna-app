        title: "الخلاصة"
        quote: "Assessment of patients with PsA requires consideration of all disease domains."
        text: |
          قيّم **كل الـ domains**، وتأثير المرض على الألم والوظيفة والـ quality of life (QoL) والـ damage.

          وخلي بالك من الـ ==comorbidities==: obesity، metabolic syndrome، **cardiovascular disease (CVD)**، depression و anxiety، **liver disease**، chronic infections، malignancy، osteoporosis، fibromyalgia، reproductive health.

          يعني الـ PsA مش مرض مفاصل بس: العيان ممكن يتحسن في المفصل ويتعب من القلب أو الكبد أو الاكتئاب، علشان كده التقييم شامل.
