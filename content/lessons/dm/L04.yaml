          - "عكس المطلوب."
          - "مش في المحاضرة."
      - kind: explain
        page: 49
        title: "الـ aspirin"
        quote: "Use aspirin therapy (75–162 mg/day) as a secondary prevention strategy in those with diabetes and a history of atherosclerotic cardiovascular disease."
        text: |
          - **Secondary prevention:** aspirin ==75–162 mg/day== لكل اللي عندهم ASCVD.
          - **Stable CAD/PAD + bleeding risk قليل:** aspirin + **low-dose rivaroxaban**.
          - **Primary prevention:** ممكن لو **≥50 سنة** + risk factor كبير ومفيش bleeding risk، بـ **shared decision**. فوق **70** الضرر أكتر من الفايدة.
