        quote: "Treatment\n  Fluid and electrolyte replacement.\n  Somatostatin analogs (octreotide).\n  Surgical resection if feasible.\n  Chemotherapy for metastatic disease."
        title: "علاج الـ VIPoma بالترتيب"
        text: |
          الترتيب في الكتاب مش صدفة:
          1. ==Fluid and electrolyte replacement== الأول، لأن 3-20 لتر في اليوم بيموّت المريض من الـ dehydration والـ hypokalaemia قبل ما الورم يموّته.
          2. **Somatostatin analogs (octreotide)**: بيقفل إفراز الـ VIP وبيزوّد امتصاص المية والأملاح (ص 85)، فالإسهال يقف بسرعة.
          3. **Surgical resection** لو ممكن: الـ complete resection بيدّي **95% 5-year survival**.
          4. **Chemotherapy** للـ metastatic، وده مهم لأن الـ mets في حوالي **70%**.
