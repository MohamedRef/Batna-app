    status: unverified
    tags: [numbers]
  - id: geri.L01.023
    kind: cloze
    topic: htn-treatment
    text: "ESC/ESH treat hypertension at SBP ≥{{c1::140}} mmHg in patients aged 65–79, and at SBP ≥{{c2::160}} mmHg in those aged {{c3::80 or over}} (DBP ≥90 in both)."
    src: { page: 7, quote: "AGE 65-79 years SBP ≥140 mm Hg and/or DBP ≥90 mm Hg AGE ≥80 years SBP ≥160 mm Hg" }
    status: unverified
    tags: [high-yield, numbers]
  - id: geri.L01.024
    kind: table
    topic: htn-treatment
    title: "Old, very old and frail hypertensive patients (ESC/ESH 2018)"
    columns: [Point, "Age 65–79", "Age ≥80"]
    rows:
      - [Treat when, "SBP ≥140 and/or DBP ≥90", "SBP ≥160 and/or DBP ≥90"]
      - [Start with, "A combination at the lowest dose", "A single drug, low dose"]
      - [If tolerated but uncontrolled, "Increase doses", "Use combinations, from the lowest doses"]
      - [Adherence, "Fixed combinations (2 or 3 drugs)", "Fixed combinations"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 2]]
    src: { page: 7, quote: "Treat hypertension preferentially starting from a single drug, low dose approach" }
    status: unverified
    tags: [high-yield]
  - id: geri.L01.025
    kind: enumerate
    topic: htn-treatment
    prompt: "Beyond the age bands, what does ESC/ESH 2018 advise for old, very old and frail hypertensive patients?"
    points:
      - Evaluate frailty and comorbidities first
      - "Fit old and very old: non-drug treatment plus antihypertensive drugs"
      - "Frail: drugs can be considered if tolerated; avoid combinations"
      - "Consider temporary or permanent de-prescription (SBP ≤130, acute illness, temperature changes)"
      - "Monitor carefully: postural hypotension, hypotensive episodes, injurious falls, renal function"
    pass: 4
    src: { page: 7, quote: "Antihypertensive drugs can be considered in frail older patients, if tolerated (avoid combinations)" }
    status: unverified
    tags: [high-yield]
  - id: geri.L01.026
    kind: card
    topic: htn-treatment
    front: Which antihypertensives should be avoided in older patients unless another disease requires them, and why?
    back: Loop diuretics and alpha-blockers, because of their association with injurious falls. Preferred are diuretics (thiazide-like), ACE inhibitors, ARBs and dihydropyridine CCBs.
    src: { page: 7, quote: "loop diuretics and alpha-blockers should be avoided because of their association with injurious falls" }
    status: unverified
    tags: [high-yield]
  - id: geri.L01.027
    kind: mcq
    topic: htn-treatment
    stem: "An 84-year-old woman who walks with a frame and fell twice this year has SBP 168 mmHg on repeated visits. Per ESC/ESH 2018 in the lecture, how should treatment start?"
    options:
      - "A single drug at a low dose, if tolerated; avoid combinations"
      - "A fixed two-drug combination at full dose"
      - "No treatment: drugs are never used after 80"
      - "A loop diuretic plus an alpha-blocker"
    answer: 0
    why:
      - "Correct: over 80 start with a single low-dose drug, and in frail patients avoid combinations (p7)."
      - "Starting with a combination is for ages 65–79, and not in the frail."
      - "Drugs are recommended for fit and can be considered for frail very old patients."
      - "Loop diuretics and alpha-blockers are linked to injurious falls."
    src: { page: 7, quote: "Antihypertensive drugs can be considered in frail older patients, if tolerated (avoid combinations)" }
    status: unverified
  - id: geri.L01.028
    kind: enumerate
    topic: htn-treatment
    prompt: Give the take-home messages on hypertension.
    points:
      - Major cause of morbidity and mortality; needs treatment
      - Extremely common yet under-diagnosed and undertreated
