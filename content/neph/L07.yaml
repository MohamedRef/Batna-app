    src: { page: 176, quote: "(RRT) Approximate prevalence of 0.7 cases per million. ESRD occurred in 1 per 100 patients with TSC and was more frequent in females (63%), with a mean age diagnosis of 29 years.34 Both dialysis and renal trans-plantation are appropriate modes of renal replacement therapy. Given the risk for renal hemorrhage related to AML and malignant transfor-mation, it may be advisable that patients with TSC and ESRD undergo bilateral nephrectomy before initiation of renal replacement therapy." }
