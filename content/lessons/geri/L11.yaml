        quote: "Pharmacologic\n  In the elderly:\n    Prioritization is given to Once-daily administration, Self-containedinhaler devices, educating the patient/caregiver on medication administration.\n    A stepwise approach that may lead to triple-inhaler maintenance therapy, including two classes of long-acting inhaled bronchodilators (LABA and LAMA) and inhaled corticosteroid, (ICS) as well as prn use of a rescue inhaler (SABA)."
        word: "OSE"
        parts:
          - { key: "O", text: "Once-daily administration" }
          - { key: "S", text: "Self-contained inhaler devices" }
          - { key: "E", text: "Educate the patient and caregiver" }
        hook: |
          في الكبار افتكر **OSE**، زي ما تقول للحاج «أوسَع لنفسك»: جرعة واحدة، جهاز واحد، وعلّم اللي بيرعاه. والـ stepwise ممكن يوصل لـ **triple therapy** (LABA + LAMA + ICS) في جهاز واحد (Ellipta) + SABA للإنقاذ.
      - kind: explain
        page: 208
        quote: "Combination therapy provides additional benefit on lung function, as compared with its components."
        title: "التركيبات: جهاز واحد بدل تلاتة"
        text: |
          الكتاب بيعدّ التركيبات المتاحة:

          - **SABA + SAMA**
          - **LABA + LAMA**
          - **LABA + ICS**
          - **Triple** (LABA + LAMA + ICS) في جهاز واحد (==Ellipta==).

          ليه؟ الكتاب: الـ combination بتدّي **additional benefit on lung function** أكتر من كل دوا لوحده. والتفسير المقبول (مش في الكتاب) لميزتها في الكبار: كل جهاز زيادة = طريقة استعمال زيادة يغلط فيها وميعاد زيادة ينساه. جهاز واحد مرة في اليوم بيطبّق الـ **OSE** بالظبط.
      - kind: case
        page: 206
        quote: "Those who are frequent exacerbators (Two or moresymptom-defined exacerbations per year)."
        stem: "An 83-year-old man with COPD and mild memory problems uses his salbutamol MDI several times a day and had three exacerbations last year. His daughter visits daily."
        steps:
          - question: "Does he need long-acting maintenance?"
            options: ["Yes: not controlled on short-acting and a frequent exacerbator", "No: salbutamol as needed is enough", "Only an ICS alone", "Only theophylline"]
            answer: 0
            why: "الاتنين indications: الأعراض مش متظبطة على الـ short-acting، و 2 exacerbations أو أكتر في السنة. والـ ICS لوحده مش recommended."
          - question: "How should it be given?"
            options: ["Once daily, one self-contained device, teach him and his daughter", "Three separate inhalers twice daily", "Nebulized long-acting anticholinergic", "Leave the choice to him without teaching"]
            answer: 0
            why: "OSE: once-daily، self-contained device، وعلّم المريض والـ caregiver. الـ nebulized anticholinergic short-acting بس (ipratropium)."
      - kind: try
        items: [geri.L11.082, geri.L11.084, geri.L11.087, geri.L11.088, geri.L11.090]
    recap:
