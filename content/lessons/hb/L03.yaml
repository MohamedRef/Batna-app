            <text x="18" y="228" class="t-sm t-mut">&gt;25% bleed at 2 y</text>
            <path d="M83 236V280" class="fg-arrow-bad" marker-end="url(#L03d)"/>
            <rect x="176" y="242" width="146" height="34" rx="8" class="fg-acc"/>
