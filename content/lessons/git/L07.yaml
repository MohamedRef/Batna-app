        page: 231
        quote: "VCE should be performed before deep enteroscopy to increase diagnostic yield. Initial deep enteroscopy can be considered in cases of massive hemorrhage or when VCE is contraindicated."
        prompt: "عيان occult bleeding ومفيش obstruction. رتّب:"
