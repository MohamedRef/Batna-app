  # ---------- p258-259: CETP ----------
  - id: dm.L20.048
    kind: card
    topic: cetp
    front: What was the rationale for CETP inhibitors?
    back: Many Japanese people with extremely high HDL-C are genetically CETP deficient, so blocking CETP might raise HDL-C.
    src: { page: 258, quote: "Rationale: Pharmacological inhibition of CETP might be a novel approach to raise HDL-C levels." }
    status: unverified
