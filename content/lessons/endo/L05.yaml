        text: "**Watery diarrhea** عشرين لتر في اليوم؟ ده المريض بيصرف مية أكتر من عمارة في شبرا. أول حاجة: **fluids and electrolytes**، وبعدين octreotide."
      - kind: reveal
        page: 91
        quote: "Hypokalemia, Hypomagnesemia, hypercalcemia.\n  Acidosis.\n  Achlorhydria."
        prompt: "الـ VIPoma بيعمل achlorhydria و acidosis. ليه؟"
        answer: "التفسير المقبول (مش في الكتاب): الـ VIP بيخلّي الأمعاء **تفرز** مية وأملاح بدل ما تمتصها، ومعاهم **bicarbonate** و **potassium**، فالبراز بيشيلهم برا: الـ HCO3 اللي ضاع = **metabolic acidosis**، والـ K اللي ضاع = **hypokalaemia**. والـ VIP كمان بيقفل إفراز الحمض في المعدة، فـ **achlorhydria**. يعني الـ A في WDHA جاية من المعدة، والـ D والـ H من الأمعاء."
