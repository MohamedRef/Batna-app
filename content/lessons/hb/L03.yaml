  - id: hb.L03.lesson6
    title: "لما الرباط ما يكفيش: gastric varices والـ rescue"
    hook: "سوبر جلو جوه المعدة، وبالونة أو stent في المريء لحد ما نوصل للـ TIPS."
    minutes: 9
    pages: [52, 54]
    topics: [endoscopy, rescue-tips]
    goals:
      - "تعرف أرقام الـ gastric varices وعلاجها (cyanoacrylate و thrombin)"
      - "تمشي في الـ algorithm لحد الـ rescue"
      - "تقارن الـ balloon tamponade بالـ covered metal stent"
    status: unverified
    steps:
      - kind: explain
        page: 52
        quote: "Gastric Varices: Present in 5-30% of patients with cirrhosis. Account for 10-15% of variceal bleeding episodes"
        title: "الـ gastric varices"
        text: |
          **الـ gastric varices بالأرقام**
          - موجودة في 5–30% من مرضى الـ cirrhosis.
          - مسؤولة عن 10–15% من نوبات الـ variceal bleeding.

          يعني أقل من الـ oesophageal بكتير، بس لما تنزف بتبقى صعبة.

          **Risk factors للنزيف**
          - **Size**: كل ما تكبر، جدارها يرفع.
          - **Child class**: الكبد الضعيف ما بيستحملش.
          - **Red spots**: نفس فكرة الـ red signs في المريء.

          **Standard endoscopic therapy**: ==cyanoacrylate==. الـ banding هنا صعب، لأن الدوالي في المعدة أكبر وأعمق في الجدار، فالأستك مش بيمسكها كويس.
      - kind: figure
        page: 52
        title: "تقسيمة الـ gastric varices في الكتاب"
        image: { file: hb/L03-gov-igv.webp, book: true }
        alt: "Book line drawings of four stomachs. Top row 'Gastro Esophageal Varices (GOV)': GOV1 with varices running from the oesophagus down along the lesser curve, GOV2 with varices running from the oesophagus into the fundus. Bottom row 'Isolated Gastric Varices (IGV)': IGV1 with varices in the fundus alone, IGV2 with varices elsewhere in the stomach, near the antrum and pylorus."
        caption: |
          أربع معدات مرسومين، والدوالي هي الخط الأسود التخين:

          - **فوق: Gastro Esophageal Varices (GOV)**: دوالي المريء مكمّلة في المعدة.
            - **GOV1** (شمال): مكمّلة على الـ **lesser curve**.
            - **GOV2** (يمين): مكمّلة لفوق في الـ **fundus**.
          - **تحت: Isolated Gastric Varices (IGV)**: دوالي في المعدة لوحدها، من غير المريء.
            - **IGV1** (شمال): في الـ **fundus**.
            - **IGV2** (يمين): في أي حتة تانية في المعدة (قريب من الـ antrum والـ pylorus).

          الرسمة بتوضّح ليه الـ gastric varices صعبة: اللي في الـ ==fundus== (GOV2 و IGV1) كبيرة وعميقة، وعلشان كده العلاج المعتاد ليها ==cyanoacrylate== مش الرباط.
      - kind: figure
        page: 52
        title: "gastric varices في المنظار: صورة الكتاب"
        image: { file: hb/L03-gastric-varices-endoscopy.webp, book: true }
        marks:
          - { at: [0.47, 0.22], label: "Endoscope shaft", kind: arrow }
          - { at: [0.27, 0.75], size: [0.36, 0.42], label: "Fundal varices", kind: box }
        alt: "Book endoscopy photo of the stomach in retroflexion: the dark endoscope shaft enters from the top centre, and large round bluish-pink varices bulge in the fundus at the lower left."
        caption: |
          المنظار هنا راجع على نفسه (retroflexion): الماسورة السودا (1) هي جسم المنظار نفسه وهو داخل من المريء.

          **(2)**: كتلة دوالي كبيرة مدورة زي العنب في الـ **fundus**. شوف قد إيه هي ==كبيرة ومنفوخة== مقارنة بدوالي المريء: ده اللي بيخلّي الأستك ما يمسكهاش كويس، والـ cyanoacrylate هو الـ standard.
      - kind: table
        page: 53
        quote: "Cyanoacrylate PROS: Effective, Most studied, Standard 1st line therapy in many centers, May avoid further interventions, Cost-effective"
        title: "Cyanoacrylate for gastric varices"
        columns: ["Pros", "Cons"]
        rows:
          - ["Effective; most studied", "High risk of complications: local and systemic (embolic)"]
          - ["Standard first line in many centres", "High rebleeding rate"]
          - ["May avoid further interventions", "Cumbersome, difficult to use"]
          - ["Cost-effective", "Can damage the scope; not approved in the USA and other countries"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: aside
        tone: analogy
        page: 53
        quote: "Thrombin Converts fibrinogen to fibrin clot"
        text: |
          الـ **cyanoacrylate** هو نفس كيميا السوبر جلو. 😄

          وزي ما السوبر جلو بيلزق صوابعك في بعض، ممكن يلزق في المنظار ويبوّظه، ولو نقطة هربت في الدم تعمل **embolism**.

          علشان كده الـ **thrombin** بديل:
          - بيحوّل الـ fibrinogen لـ fibrin clot.
          - Human (Evithrom) أو bovine.
          - 5000 U/vial، حوالي 5–10 mL في الجلسة.
          - No important side effects.
      - kind: check
        page: 53
        quote: "CONS High risk of complications Local Systemic (embolic) Rebleeding rate is high Cumbersome / difficult to use Can damage the scope Not approved in USA and other countries"
        question: "Which is a **con** of cyanoacrylate for gastric varices, per the lecture?"
        options:
          - "Systemic (embolic) complications"
          - "It is the least studied option"
          - "It always needs surgery afterwards"
          - "It works only on oesophageal varices"
