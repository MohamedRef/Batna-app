  # ------------------------------------------------------------------
  - id: geri.L02.lesson1
    title: "الكلية العجوزة: أقل عدد، نفس الشغل"
    hook: "الكلية بتخسر لحد نص الـ glomeruli وهي ساكتة. المشكلة بتبان أول ما تزوّدها حمل: ملح، ميه، أو دوا."
    minutes: 9
    pages: [25, 29]
    topics: [overview, anatomy, physiology]
    goals:
      - "تعرف التغييرات التشريحية في الكلية مع السن"
      - "تفهم ليه الكبار بيتعبوا من نقص الملح ومن الـ hyperkalemia ومن الجفاف"
      - "تحفظ رقم الـ GFR مع كل عشر سنين"
    status: unverified
    steps:
      - kind: explain
        page: 25
        title: "رسايل المحاضرة"
        quote: "ESRD has increased over the past 20 years and most of these changes have occurred in the aged population."
        text: |
          المحاضرة كلها في كام جملة:
          - الـ ==GFR== بيقل مع السن.
          - الـ **ESRD** زاد في آخر 20 سنة، وأغلب الزيادة عند الكبار.
          - **Cystatin C** بيعكس وظيفة الكلى عند الكبار كويس.
          - الـ **UTI** شائع جدًا، ولازم تفرّقه عن ==asymptomatic bacteriuria== اللي غالبًا مش بتتعالج.
          - الـ **catheter-induced UTI** من أشهر الـ nosocomial infections.
      - kind: table
        page: 26
        quote: "Glomeruli: ↓ in No (30-50%). ↓ Cells Sclerotic glomeruli Glomerular ischaemia"
        title: "التشريح بيتغيّر إزاي؟"
        columns: [Part, Change]
        rows:
          - [Weight, "Falls from 40–50 y; cortex more"]
          - [Glomeruli, "Down 30–50%, sclerosis"]
          - [Nephrons, "Fewer; the rest enlarge"]
          - [BM, "Thicker; more type IV collagen"]
          - [Tubules, "Shorter; less proximal volume"]
          - [Interstitium, "More fibrosis"]
        hide: [[0, 1], [1, 1], [2, 1], [5, 1]]
      - kind: aside
        tone: analogy
        page: 26
        quote: "Nephrons: ↓ No, ↑ Size of residuals."
        text: "زي مصنع بيقفل خطوط إنتاج كل سنة، والعمال اللي فاضلين بيشتغلوا وقت إضافي: الـ **nephrons** بتقل، واللي فاضل بيكبر. الإنتاج العادي ماشي، بس أول طلبية كبيرة، المصنع يقع."
      - kind: explain
        page: 28
        title: "الملح: لا تزوّده ولا تمنعه خالص"
        quote: "Caution: intense Na+ restriction → volume contraction →↓ Renal functions → Orthostatic hypotension"
        text: |
          - إخراج الـ **Na و K** والـ solutes بيزيد ==بالليل== ← ده جزء من ليه الحاج بيصحى يدخل الحمام.
          - الكلية العجوزة **مش بتعرف تحافظ على الصوديوم**. علشان كده الـ ==intense Na restriction== ← volume contraction ← وظايف الكلى تقل ← **orthostatic hypotension**.
          - الـ **ANP** بيعلى، وده بيزوّد خروج الصوديوم.
      - kind: explain
        page: 28
        title: "الـ RAAS نايم ← البوتاسيوم بيعلى"
        quote: "↓ RAAS → hyper kalemia. Caution: K. sparing diuretic, RAAS blockade, NSAIDs, BBs."
        text: |
          الـ **renin** والـ **aldosterone** بيقلوا مع السن ← ==hyperkalemia== أسهل.

          خلّي بالك من أربع أدوية:
          - **K-sparing diuretics**
          - **RAAS blockade**: ACEI و ARB
          - **NSAIDs**
          - **Beta-blockers**
      - kind: mnemonic
        page: 28
        quote: "Caution: K. sparing diuretic, RAAS blockade, NSAIDs, BBs."
        word: "KRNB"
        parts:
          - { key: "K", text: "K-sparing diuretics" }
          - { key: "R", text: "RAAS blockade (ACEI, ARB)" }
          - { key: "N", text: "NSAIDs" }
          - { key: "B", text: "Beta-blockers" }
        hook: "**«كرنب»**: KRNB. الحاج اللي بياكل كرنب وواخد الأربعة دول، البوتاسيوم عنده هيطلع السما."
      - kind: case
        page: 28
        quote: "↓ RAAS → hyper kalemia. Caution: K. sparing diuretic, RAAS blockade, NSAIDs, BBs."
        stem: "An 81-year-old man on lisinopril and bisoprolol is given spironolactone, a K-sparing diuretic, on top of his RAAS blockade, and buys ibuprofen, an NSAID, for knee pain."
        steps:
          - question: "Which electrolyte do you fear most?"
            options:
              - "Hyperkalemia"
              - "Hypernatremia"
              - "Hypocalcemia"
              - "Hypokalemia"
            answer: 0
            why: "Low renin and aldosterone with age, plus all four KRNB drugs at once."
          - reveal: "K+ comes back 6.4 mmol/L."
            question: "Which drug is the easiest first one to stop?"
            options:
              - "Ibuprofen"
              - "Lisinopril"
              - "Bisoprolol"
              - "Nothing; K+ is fine at his age"
            answer: 0
            why: "The NSAID adds nothing for his heart and also harms the kidney; stop it first, then review spironolactone. (Clinical reasoning; the drug list is from the book.)"
      - kind: explain
        page: 28
        title: "الميه: لا بيخففها ولا بيركّزها"
        quote: "↓ Capacity to maximally concentrate the urine (defective Na re-absorption in ALOH)."
        text: |
          - **Dilution:** لو شرب ميه كتير، الـ free water clearance بتبقى قليلة، علشان الـ nephrons قليلة والـ **ADH** عالي ← ممكن **hyponatremia**.
          - **Concentration:** مش بيعرف يركّز البول للآخر، علشان الـ Na reabsorption في الـ ==ascending loop of Henle== ضعيف.
          - وفوق ده ==الـ thirst بيقل==.

          النتيجة: في الحر، الحاج بيخسر ميه ومش عطشان ← **hypernatremia** و dehydration.
      - kind: reveal
        page: 28
        quote: "↓ Capacity to maximally concentrate the urine"
        prompt: "ليه ضعف الـ Na reabsorption في الـ ascending loop يبوّظ تركيز البول؟"
        answer: |
          الـ ascending loop بيطلّع **NaCl** في الـ medulla من غير ميه، وده اللي بيعمل الـ **medullary gradient**. الـ collecting duct بعد كده بيسحب الميه على الـ gradient ده بالـ ADH.

          لو الـ loop ضعيف، الـ gradient يقل، فحتى مع ADH عالي الكلية مش هتقدر **maximally concentrate the urine**. (تفسير فسيولوجي.)
      - kind: figure
        page: 29
        title: "الكلية والسن: الأرقام"
        quote: "GFR: ↓ ⁓ 10 ml/decade) above 40 years RPF: ↓ ⁓ 10% decade above 40 years"
        alt: "Bar chart of an approximate GFR by age: about 120 at 40, falling by about 10 ml per decade to about 80 at 80; beside it arrows showing reduced response to vasodilators and increased response to vasoconstrictors."
        caption: "بعد الـ 40: الـ ==GFR== بيقل حوالي **10 ml كل عشر سنين**، والـ RPF حوالي **10%** كل عشر سنين. الأرقام في الرسمة توضيحية على أساس الـ rule ده."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="20" class="t-sm t-b">GFR (ml/min), illustrative</text>
            <path d="M40 200 H320" class="fg-arrow"/>
            <rect x="55" y="80" width="40" height="120" class="fg-good"/>
            <rect x="120" y="90" width="40" height="110" class="fg-good"/>
            <rect x="185" y="100" width="40" height="100" class="fg-acc"/>
            <rect x="250" y="110" width="40" height="90" class="fg-bad"/>
            <text x="75" y="72" text-anchor="middle" class="t-sm">~120</text>
            <text x="140" y="82" text-anchor="middle" class="t-sm">~110</text>
            <text x="205" y="92" text-anchor="middle" class="t-sm">~100</text>
            <text x="270" y="102" text-anchor="middle" class="t-sm">~90</text>
            <text x="75" y="218" text-anchor="middle" class="t-sm">40 y</text>
            <text x="140" y="218" text-anchor="middle" class="t-sm">50 y</text>
            <text x="205" y="218" text-anchor="middle" class="t-sm">60 y</text>
            <text x="270" y="218" text-anchor="middle" class="t-sm">70 y</text>
            <text x="165" y="242" text-anchor="middle" class="t-sm t-acc t-b">−10 ml per decade after 40</text>
          </svg>
      - kind: table
        page: 29
        quote: "Effective renal plasma flow (ERPF) ↓ Response to vasodilators ↓↓ Response to vasoconstrictor ↑"
        title: "الـ hemodynamics"
        columns: [Parameter, Change]
        rows:
          - [GFR, Down]
          - [ERPF, Down]
          - [Vasodilator response, Markedly down]
          - [Vasoconstrictor response, Up]
        hide: [[2, 1], [3, 1]]
      - kind: check
        page: 29
        quote: "↓ Thirst mechanism."
        question: "Heat wave: an 85-year-old is drowsy, Na+ 156, and 'never felt thirsty'. Best explanation?"
        options:
          - "Reduced thirst and reduced urine concentrating ability"
          - "High RAAS activity"
          - "Rising GFR with age"
          - "Low ADH"
        answer: 0
        why:
          - "صح: العطش قليل والكلية مش بتركّز البول."
          - "الـ RAAS بيقل مع السن."
          - "الـ GFR بيقل 10 ml كل عشر سنين."
          - "الكتاب بيقول الـ ADH عالي."
      - kind: try
        items: [geri.L02.005, geri.L02.006, geri.L02.012, geri.L02.017, geri.L02.018]
    recap:
      - "Glomeruli تقل 30–50%، والـ nephrons الباقية تكبر، والـ interstitium يتليّف."
      - "Intense Na restriction ← volume contraction و orthostatic hypotension."
      - "RAAS قليل ← hyperkalemia. حذر من KRNB."
      - "مش بيعرف يخفف ولا يركّز البول، والعطش قليل."
      - "GFR −10 ml كل عشر سنين بعد 40، والـ RPF −10%."
    practice: [geri.L02.001, geri.L02.002, geri.L02.003, geri.L02.004, geri.L02.005, geri.L02.006, geri.L02.007, geri.L02.008, geri.L02.009, geri.L02.010, geri.L02.011, geri.L02.012, geri.L02.013, geri.L02.014, geri.L02.015, geri.L02.016, geri.L02.017, geri.L02.018, geri.L02.019, geri.L02.020, geri.L02.021, geri.L02.064]
