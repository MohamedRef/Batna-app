    pass: 3
    hook: "AKI في التليف «وقّف، وقّف، وعوّض»: وقّف diuretics وbeta-blockers، وقّف vasodilators وNSAIDs وأي nephrotoxic drugs، وعوّض الـ volume حسب سبب الفقد وشدّته."
