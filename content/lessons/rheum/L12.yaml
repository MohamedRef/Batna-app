      - "ILAR: quotidian fever ≥ أسبوعين + arthritis ≥ 6 أسابيع + واحدة من rash، غدد، كبد/طحال، serositis."
      - "Hallmark = serositis؛ uveitis نادر. Vasculitis مع consumption coagulopathy، CNS irritability. أشهر سبب وفاة: amyloidosis + renal failure، بعده infection."
