        options: [Yes; 90 or more is acceptable, No; she needs over 120, Only if her measured GFR is over 110, Only after a renal biopsy]
        answer: 0
        why: "GFR of 90 mL/min/1.73 m² or greater is acceptable (KDIGO 2017, p323)."
      - question: Which kidney is usually taken?
        options: [Left; longer renal vein, Right; shorter operation, Whichever is smaller, Both are equal]
        answer: 0
