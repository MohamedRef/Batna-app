      - kind: match
        page: 33
        quote: "Table: Drug-drug interactions for proton pump inhibitors and antacids\n| Medications | Interactions | Mechanism | Solution |\n|---|---|---|---|\n| Omeprazole, Esomeprazole | Clopidogrel | CYP2C19 is inhibited by omeprazole and esomeprazole, which normally convert clopidogrel to its active form, thereby decreasing its blood levels. | Switch to pantoprazole, which does not inhibit CYP2C19. |\n| Omeprazole, Esomeprazole | Diazepam, Warfarin, Citalopram, Phenytoin | Omeprazole inhibits elimination, potentially increasing drug levels. | Switch to pantoprazole. |\n| All PPIs | Nelfinavir, Rilpivirine | PPIs increase stomach pH, leading to decreased absorption of these medications. | Switch to an H2 blocker. |\n| All PPIs | Harvoni | PPIs decrease gastric acid, which is needed for Harvoni drug absorption. | Decrease to omeprazole 20 mg daily or equivalent, or switch to an H2 blocker. |\n| All PPIs | Methotrexate | PPIs inhibit active secretion of medication in renal tubules. | Switch to an H2 blocker, or monitor for signs and symptoms of methotrexate toxicity. |\n| All PPIs | Digoxin | PPIs can increase blood levels by changing gastric pH, favoring increased absorption of digoxin. | Switch to an H2 blocker. |\n| Antacids | Fluoroquinolones, Tetracyclines | Ions in antacids bind and form insoluble chelate complexes, inhibiting absorption of these medications. | Separate medications and antacids by 4 hours. |"
        prompt: "التفاعل ← الحل:"
        pairs:
          - ["Omeprazole + clopidogrel", "Switch to pantoprazole"]
          - ["PPI + nelfinavir or rilpivirine", "Switch to an H2 blocker"]
          - ["PPI + Harvoni", "Omeprazole 20 mg or an H2 blocker"]
          - ["PPI + methotrexate", "H2 blocker or watch for toxicity"]
          - ["Antacid + fluoroquinolone or tetracycline", "Separate by 4 hours"]
        why: "الـ omeprazole والـ esomeprazole بيمنعوا الـ CYP2C19 اللي بيفعّل الـ clopidogrel؛ الـ pantoprazole مش بيمنعه. الـ pH العالي بيقلل امتصاص الـ antiretrovirals والـ Harvoni (وبيزوّد الـ digoxin). الـ PPI بيقلل الـ renal tubular secretion للـ methotrexate. والـ antacids بتعمل chelates."
      - kind: explain
        page: 33
        quote: "CYP2C19 is inhibited by omeprazole and esomeprazole, which normally convert clopidogrel to its active form, thereby decreasing its blood levels."
        title: "التفاعلات ليها 3 أسباب بس"
        text: |
          لو فهمت السبب، الجدول يتحفظ لوحده:

          - **Enzyme**: الـ ==omeprazole والـ esomeprazole بيمنعوا الـ CYP2C19==. الـ clopidogrel **prodrug** محتاج الـ enzyme ده يفعّله، فمستواه يقل. ونفس الـ enzyme بيكسّر الـ diazepam والـ warfarin والـ citalopram والـ phenytoin، فدول مستواهم **يعلى**. الحل في الاتنين: **pantoprazole**.
          - **pH**: الحمض بيقل، فالأدوية اللي محتاجة حمض علشان تتمص (**nelfinavir**، **rilpivirine**، **Harvoni**) تقل، والـ **digoxin** امتصاصه يزيد. الحل غالبًا **H2 blocker**.
          - **الكلى**: الـ PPIs بتمنع الـ active secretion بتاع الـ **methotrexate** في الـ renal tubules، فيتراكم.

          والـ **antacids** حكاية لوحدها: الـ ions بتعمل **chelates** مع الـ fluoroquinolones والـ tetracyclines، فافصل بينهم **4 ساعات**.
      - kind: table
        page: 34
        quote: "Table 2: Potential Adverse Effects of Proton Pump Inhibitors\n| Adverse effect | Comments |\n|---|---|\n| Clostridium difficile infection | Nosocomial and recurrent infection following hospital discharge; Proposed mechanism is C. difficile overgrowth from elevated gastric pH |\n| Community-acquired pneumonia and hospital-acquired pneumonia | Histamine H2 antagonists and PPIs have been implicated in pneumonia; Sucralfate (Carafate) use does not alter gastric pH and may offer an advantage over PPIs and H2 antagonists |\n| Fractures of the hip, wrist, and spine | The U.S. Food and Drug Administration requires labeling change for all PPIs; Higher fracture risk with PPI use than with H2 antagonists; Mechanism is reduced calcium absorption from increased gastric pH |\n| Gastric acid rebound or reflux symptoms after discontinuation of PPIs | PPIs may exacerbate symptoms when discontinued |\n| Iron deficiency anemia in patients with low baseline iron stores | Acid suppression is proposed mechanism of reduced iron absorption |\n| Major adverse cardiac events in the year following percutaneous angiography in those taking PPIs and clopidogrel (Plavix) | Clopidogrel label changed to recommend avoiding concurrent omeprazole (Prilosec) use because it decreases the effectiveness of clopidogrel |\n| Rehospitalization with concomitant use of PPIs and clopidogrel after admission for acute coronary syndrome | The American College of Cardiology and the American Heart Association guidelines suggest that H2 antagonists be considered for the treatment or prevention of gastrointestinal injury in patients on dual antiplatelet therapy |\n| Reinfarction in patients taking PPIs and clopidogrel | Pantoprazole (Protonix) use does not affect clopidogrel effectiveness |"
        title: "الـ PPI على المدى الطويل (سؤال امتحان)"
        columns: ["Adverse effect", "Why or note"]
        rows:
          - ["C. difficile infection", "Overgrowth at high gastric pH"]
          - ["Pneumonia", "PPIs and H2 antagonists; sucralfate spares gastric pH"]
          - ["Hip, wrist, spine fractures", "Less calcium absorption"]
          - ["Rebound reflux on stopping", "Symptoms worsen on discontinuation"]
          - ["Iron deficiency anemia", "Less iron absorption"]
          - ["Cardiac events with clopidogrel", "Avoid omeprazole; pantoprazole is fine"]
        hide: [[0, 1], [2, 1], [4, 1], [5, 1]]
      - kind: explain
        page: 34
        quote: "Mechanism is reduced calcium absorption from increased gastric pH"
        title: "ليه الـ PPI الطويل بيعمل كده؟"
        text: |
          الكتاب بيدّي mechanism لأغلبها، وكلها بترجع لفكرة واحدة: ==الحمض كان بيشتغل شغلانة==.

          - **C. difficile**: الحمض كان **حاجز** ضد البكتيريا، فالـ pH العالي = **overgrowth**.
          - **Pneumonia**: الـ H2 antagonists والـ PPIs متهمين، والـ **sucralfate** مش بيغيّر الـ pH فممكن يبقى أحسن. التفسير المقبول (مش في الكتاب): البكتيريا اللي بتكتر في المعدة ممكن تطلع وتتسحب للرئة.
          - **Fractures** (hip, wrist, spine): **calcium absorption** بيقل. والـ FDA غيّرت الـ labeling، والخطر أعلى من الـ H2 antagonists.
          - **Iron deficiency** في اللي مخزونه قليل: الـ iron محتاج حمض علشان يتمص.
          - **Rebound** لما توقفه: الأعراض ممكن تزيد.
          - **Clopidogrel**: cardiac events و rehospitalization و reinfarction، والحل **pantoprazole**، والـ ACC/AHA بتقترح **H2 antagonists** مع الـ dual antiplatelet.
      - kind: explain
        page: 34
        quote: "These strategies include\n  Co-therapy of NSAIDs with a PPI, misoprostol; H 2 receptor antagonist, or\n  substitution of non-selective NSAIDs with COX-2- selective NSAIDs;\n  Or combination of a COX-2-selective NSAID with a gastroprotective agent."
        title: "مريض لازم ياخد NSAID؟"
        text: |
          الكتاب بيدي 3 طرق للوقاية:
          - **Co-therapy** مع **PPI** أو **H2-receptor antagonist (H2RA)** أو **misoprostol**.
          - تغيّر لـ **COX-2-selective NSAID**.
          - أو ==COX-2-selective NSAID + gastroprotective agent==.
