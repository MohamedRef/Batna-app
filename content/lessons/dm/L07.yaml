  - id: dm.L07.lesson2
    title: "8 وشوش للـ CAN"
    hook: "نبض ثابت، ضغط بيقع، MI من غير وجع، وتخدير بيقلب: كله نفس المرض."
    minutes: 10
    pages: [78, 81]
    topics: [clinical, silent]
    goals:
      - "تحفظ الـ clinical manifestations"
      - "تعرف أرقام الـ resting tachycardia والـ orthostatic hypotension"
      - "تعرف شكل الـ MI في الـ CAN"
      - "تعرف الـ autonomic cardiopathy"
    status: unverified
    steps:
      - kind: explain
        page: 78
        title: "القائمة"
        quote: "Intra and postoperative CV instability"
        text: |
          1. **Resting tachycardia**
          2. **Orthostatic hypotension**
          3. **Exercise intolerance** (low cardiac output)
          4. **Intra- and postoperative CV instability**
          5. **Orthostatic tachycardia / bradycardia**
          6. ==Silent myocardial ischemia== / infarction
          7. **Sudden death**
          8. **Autonomic cardiopathy**
      - kind: explain
        page: 79
        title: "1. النبض الثابت"
        quote: "A heart rate of 90-100 bpm unresponsive to variation in breathing, posture, or mild exercise is the characteristic finding in diabetic CAN."
        text: |
          الـ characteristic finding: ==HR 90–100 bpm== مش بيتغير مع **breathing** ولا **posture** ولا **mild exercise**.

          - **Complete denervation** ← **fixed heart rate**
          - الـ **heart rate variability** هي ==earliest indicator== وأكتر finding.
      - kind: reveal
        page: 79
        quote: "A heart rate of 90-100 bpm unresponsive to variation in breathing, posture, or mild exercise is the characteristic finding in diabetic CAN."
        prompt: "ليه النبض بيعلى (90–100) بدل ما يفضل 70؟"
        answer: |
          الـ **vagus** (parasympathetic) هو اللي بيهدّي القلب طول الوقت، وأليافه طويلة فبتتأثر **الأول**. لما يقع، القلب يرجع لسرعته الذاتية من الـ SA node (حوالي 90–100).

          ولما الـ sympathetic كمان يقع، القلب يبقى زي **transplanted heart**: ==fixed heart rate==. (تفسير فسيولوجي.)
      - kind: explain
        page: 79
        title: "2. الضغط بيقع"
        quote: "A fall in systolic blood pressure of greater than 30 mm Hg upon standing."
        text: |
          ==Orthostatic hypotension== في الكتاب: **SBP بينزل أكتر من 30 mmHg** لما يقف.

          - الأعراض: **lightheadedness**، presyncope، dizziness، weakness، fatigue، visual blurring، و **neck pain** (coat-hanger pain)
          - بس **كتير asymptomatic** رغم نزول كبير
      - kind: update
        page: 79
        quote: "A fall in systolic blood pressure of greater than 30 mm Hg upon standing."
        text: "التعريف المتفق عليه دوليًا: نزول **20 mmHg systolic أو 10 diastolic** خلال 3 دقايق. في الامتحان: رقم الكتاب **>30 systolic**."
        ref: "Consensus statement on orthostatic hypotension (Freeman et al.) 2011"
      - kind: explain
        page: 79
        title: "3 و 4: المجهود والعمليات"
        quote: "Patients with CAN need to rely on their perceived exertion, not heart rate."
        text: |
          **Exercise intolerance** بسبب: ضعف الـ sympathetic والـ parasympathetic responses، **reduced EF**، systolic dysfunction وقلة الـ diastolic filling.

          ← العيان يعتمد على ==perceived exertion== مش على الـ heart rate.

          **العمليات:** الـ perioperative morbidity والـ mortality **2–3 أضعاف** في السكر. في التخدير: الـ HR والـ BP ينزلوا أكتر عند الـ induction، ويعلوا أقل بعد الـ intubation، ومحتاجين **vasopressors** أكتر.
      - kind: check
        page: 79
        quote: "show a greater decline in heart rate and BP during induction of anesthesia and less increase after tracheal intubation and extubation."
        question: "Long-standing diabetic: BP 70/40 at induction, flat HR, little rise after intubation. Cause?"
        options: ["CAN", "Anaphylaxis", "Hypoglycemia", "Normal response"]
        answer: 0
        why:
          - "صح: induction drop أكبر و rise أقل بعد الـ intubation = CAN."
          - "الـ anaphylaxis فيها rash و bronchospasm و tachycardia."
          - "الـ hypoglycemia مش بتفسر الـ HR الثابت."
          - "الطبيعي إن الـ HR والضغط يعلوا بعد الـ intubation."
      - kind: explain
        page: 80
        title: "5. دوخة من غير ما الضغط يقع"
        quote: "The hallmark of these abnormalities is the absence of a fall in BP with standing, but a tachycardia or bradycardia with the change in posture"
        text: |
          أعراض orthostasis (faint، dizzy، **circumoral paresthesia**، headache) لما يقف، بس ==BP ما بيقعش==. اللي بيتغير هو الـ **heart rate** (tachy أو brady).

          الأسباب: **POTS**، inappropriate sinus tachycardia، **neurocardiogenic syncope**، baroreceptor abnormalities.
      - kind: sort
        page: 80
        quote: "The hallmark of these abnormalities is the absence of a fall in BP with standing, but a tachycardia or bradycardia with the change in posture"
        prompt: "مع الوقوف: ده orthostatic hypotension ولا orthostatic tachycardia syndrome؟"
        bins: ["Orthostatic hypotension", "Orthostatic tachycardia"]
        cards:
          - { text: "SBP 150 → 112, HR 90 → 92", bin: 0 }
          - { text: "SBP 140 → 105 with presyncope", bin: 0 }
          - { text: "BP 120/78 → 118/80, HR 76 → 124", bin: 1 }
          - { text: "No BP fall, HR rises 40 bpm, circumoral tingling", bin: 1 }
        why: "الـ orthostatic hypotension = الـ SBP بينزل أكتر من 30. الـ orthostatic tachycardia = الضغط ثابت والـ HR هو اللي بيتغير."
      - kind: explain
        page: 80
        title: "6. MI ساكت"
        quote: "Dysfunction of the afferent cardiac autonomic nerve fibers"
        text: |
          ليه الـ ischemia مش بتوجع؟
          - **Altered pain thresholds**
          - **Subthreshold ischemia** مش كفاية تعمل ألم
          - ==Dysfunction of afferent cardiac autonomic fibers== (السلك اللي بيوصل الوجع للمخ مقطوع)

          شكل الـ MI في الـ CAN: **silence**، **cough**، **nausea و vomiting**، **dyspnea**، tiredness، و **ECG changes**.
      - kind: aside
        tone: trap
        page: 80
        quote: "Nausea and vomiting,"
        text: "مريض سكر قديم جاي بـ **كحة وترجيع ونهجان** (cough, nausea and vomiting, dyspnea) ومن غير وجع صدر: اعمل **ECG** قبل ما تكتب antiemetic وتروّحه."
      - kind: explain
        page: 81
        title: "7 و 8: الموت المفاجئ والقلب نفسه"
        quote: "CAN may be associated with abnormalities in LV systolic and particularly diastolic function in the absence of cardiac disease."
        text: |
          **ليه الـ mortality أعلى؟** **prolonged QT** و malignant ventricular arrhythmias (**torsades de pointes**)، CVD مصاحب، renal failure، و **maldistribution of sympathetic innervation**.

          ==Autonomic cardiopathy==: خلل في الـ LV systolic و**خصوصًا diastolic** function من غير cardiac disease:
          - **delayed relaxation**، **impaired LV filling**، **increased stiffness**
          - ممكن يوصل لـ **diastolic heart failure**
          - والسكر لوحده ممكن يعمل **HF with normal LV systolic function**
      - kind: try
        items: [dm.L07.016, dm.L07.017, dm.L07.020, dm.L07.033, dm.L07.039]
    recap:
      - "Resting HR 90–100 ثابت؛ الـ HRV أول علامة؛ denervation كامل = fixed rate."
      - "Orthostatic hypotension: SBP ينزل >30 mmHg؛ كتير asymptomatic."
      - "Perceived exertion مش HR. العمليات: induction drop و vasopressors."
      - "Orthostatic tachycardia: الضغط ثابت والـ HR بيتغير."
      - "Silent MI: cough، nausea، dyspnea، ECG. Cardiopathy = diastolic dysfunction ← diastolic HF."
    practice: [dm.L07.016, dm.L07.017, dm.L07.018, dm.L07.019, dm.L07.020, dm.L07.021, dm.L07.022, dm.L07.023, dm.L07.024, dm.L07.025, dm.L07.026, dm.L07.027, dm.L07.028, dm.L07.029, dm.L07.030, dm.L07.031, dm.L07.032, dm.L07.033, dm.L07.034, dm.L07.035, dm.L07.036, dm.L07.037, dm.L07.038, dm.L07.039, dm.L07.040, dm.L07.041, dm.L07.079, dm.L07.082, dm.L07.085]
