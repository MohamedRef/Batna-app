  kind: essay
  topic: prognosis
  prompt: Describe the general prognostic indicators of ALF.
  outline:
  - Encephalopathy:
    - Key indicator; any HE → critical care and specialist center
    - Low-grade HE is grave in subacute disease
  - Extra-hepatic organ failure:
    - Especially renal; marks severity
  - Severity of liver injury:
    - Coagulopathy and jaundice; thresholds vary by cause and age
    - Falling transaminases with rising bilirubin/INR and a shrinking liver are bad
  - Etiology and presentation:
    - Subacute and indeterminate cause do poorly; acetaminophen and HAV do better
    - 'Other markers: ammonia >150 µmol/L, hypoglycemia, acidosis, MELD >32'
