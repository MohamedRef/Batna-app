  # ---------- p157-159: treatment ----------
  - id: neph.L07.068
    kind: order
    topic: adpkd-tx
    prompt: Order the stepwise approach to chronic flank pain in ADPKD.
    steps:
      - Exclude infection, stone and tumor
      - Non-nephrotoxic analgesia, reassurance, lifestyle change, tricyclic antidepressants
      - Splanchnic nerve block
      - Cyst aspiration with sclerosing agent
      - Laparoscopic or surgical cyst fenestration
    src: { page: 157, quote: "Causes of flank pain that may require intervention, such as infection, stone, and tumor, should be excluded. Care should be taken to avoid long-term administration of nephrotoxic agents, such as combination analgesics and nonsteroidal antiinflammatory drugs. Narcotic analgesics cian are essential. Reassurance, lifestyle modification, and avoidance of aggravating activities may be helpful. Tricyclic antidepressants are helpful as in other chronic pain syndromes, with a generally well-tolerated side effect profile. Splanchnic nerve blockade with local anesthesia or corticosteroids results in pain relief prolonged beyond the duration of the local anesthetic. For the pain and conservative measures fail, cyst decompression should be considered. Cyst aspiration, under ultrasound or CT guidance, is a relatively simple procedure. To prevent the reaccumulation of cyst fluid, sclerosing agents such as 95% ethanol, acidic solutions of minocycline, or sodium tetradecyl sulfate may be used. Minor complications include." }
    status: unverified
