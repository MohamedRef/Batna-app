  - id: neph.L07.109
    kind: card
    topic: cystic-other
    front: Describe the course and imaging of nephronophthisis.
    back: Cystic change and tubulointerstitial fibrosis from early childhood (over 1 year) to ESRD in adolescence. Imaging shows echo-bright kidneys with a few corticomedullary cysts; polydipsia and polyuria, but it often presents as ESRD.
    src: { page: 165, quote: "A recessively inherited condition (~1 in 50,000), characterized by cystic change and tubulointerstitial fibrosis, presenting in early childhood (age >1 year) and leading to ESRD in adolescence. Mutations in at least five NPHP loci have been described, most commonly NPHP1 (associated with earlier onset). Imaging characteristically reveals echo-bright kidneys with a few corticomedullary cysts. Clinical features: polydipsia and polyuria but often presents as ESRD. Unlike medullary cystic kidney disease, extrarenal manifestations, including oculomotor apraxia, hypoplasia of cerebellar vermis (Joubert's syndrome), developmental delay, bone abnormalities (cone-shaped epiphyses), situs invertus, and hepatic and portal fibrosis) also occur. May also be associated with retinitis pigmentosa in the Senior-Løken syndrome." }
    status: unverified
