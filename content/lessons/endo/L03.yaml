        title: "ليه كل خطوة في العلاج؟"
        text: |
          التفسير المقبول (مش في الكتاب) لكل سلاح:
          - **Saline الأول دايمًا**: المريض **ناشف** من الـ polyuria، والكلية الناشفة بتحبس الكالسيوم. المية بترجّع الـ GFR فالكالسيوم يخرج.
          - **Bisphosphonate**: بيقفل الـ ==osteoclasts==، يعني بيقطع المصدر (العضم) في الـ HHM والـ LOH الاتنين. بس بياخد أيام.
          - **Diuretic (loop)**: بيطرد كالسيوم في البول، بس **بعد** ما المريض يترطّب، وإلا هيزوّد الجفاف.
          - **Calcitonin**: أسرع واحد (ساعات)، فبنضيفه في الـ severe لحد ما الـ bisphosphonate يشتغل.
          - **Glucocorticoid**: بيقفل الـ 1,25-D اللي الـ lymphoma بيعمله، وبيقتل خلايا الـ lymphoma والـ myeloma.
          - **Dialysis**: لما الكلية مش قادرة تطلّع الكالسيوم خالص.
