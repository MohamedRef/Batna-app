    front: What does microsomal triglyceride transfer protein (MTP) do?
    back: "In hepatocytes and enterocytes it loads TG, phospholipids and cholesteryl esters onto apo B in the ER: essential for making VLDL (liver) and chylomicrons (gut)."
    src: { page: 296, quote: "MTP transfers TG, phospholipids, and cholesteryl esters to the ApoB in the endoplasmic reticulum" }
