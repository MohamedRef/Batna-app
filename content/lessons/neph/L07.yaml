  - id: neph.L07.lesson8
    title: "الكلية الـ polycystic بتشتكي إزاي؟"
    hook: "ضغط عالي في شاب، دم في البول، وكلية بتكبر 5% كل سنة. اعرف إمتى تقلق وإمتى تطمّن."
    minutes: 10
    pages: [147, 150]
    topics: [adpkd-renal]
    goals:
      - "تعدّ الـ renal manifestations وتعرف سبب كل واحدة"
      - "تفهم ليه حجم الكلية بيتنبأ بالتدهور وليه الـ ESRD مش حتمي"
      - "تتعامل مع الـ hematuria والـ cyst hemorrhage والـ UTI والـ stones"
    status: unverified
    steps:
      - kind: explain
        page: 147
        title: "الكلية بتشتكي إزاي؟"
        quote: "Clinical manifestations\nKidney\n  Flank or loin pain arising from large cysts. Acute pain may suggest cyst rupture or bleeding.\n  Dipstick-positive haematuria ± episodic frank haematuria.\n  ↑ BP.\n  Nocturia and polyuria (loss of urinary concentrating ability).\n  Low-grade proteinuria may be present (usually <1g/day).\n  If presenting late, uraemic symptoms (p. 212)."
        text: |
          - **Flank/loin pain** من الأكياس الكبيرة؛ الألم المفاجئ = **rupture أو bleeding**.
          - **Hematuria** (dipstick ± frank).
          - ==Hypertension== (↑ BP).
          - **Nocturia و polyuria**: الكلية فقدت قدرة التركيز.
          - **Proteinuria خفيفة** (أقل من 1 g/day).
          - لو جه متأخر: **uremic symptoms**.

          ليه كل عرض من دول؟ التفسير المقبول (مش في الكتاب):
          - **الألم**: الأكياس بتمط الـ capsule، والكيس اللي ينفجر أو ينزف بيمطها فجأة.
          - **الـ hematuria**: كيس بينزف وهو متصل بالـ collecting system.
          - **الضغط**: الأكياس بتضغط على الأوعية فالكلية تحس إنها ischemic وتطلع renin.
          - **الـ nocturia**: الأكياس بتبوّظ الـ medulla اللي بتركّز البول، فالكلية ما تعرفش تركّز بالليل.
      - kind: explain
        page: 147
        title: "ليه كل عرض من دول؟"
        quote: "Nocturia and polyuria (loss of urinary concentrating ability)."
        text: |
          الكتاب بيدّي سبب واحد صريح: الـ **nocturia والـ polyuria** من ==loss of urinary concentrating ability==. والباقي بالتفسير المقبول (مش في الكتاب):

          - **Flank pain**: الأكياس الكبيرة بتشد الـ **capsule** بتاعة الكلية، والـ capsule حساسة. الألم **المفاجئ** معناه كيس انفجر أو نزف جوّاه.
          - **Polyuria**: الأكياس بتبوّظ ترتيب الـ medulla والـ collecting ducts، فالـ countercurrent ما يشتغلش كويس، والكلية ما تقدرش تركّز. ودي من أبدر العلامات.
          - **↑ BP**: الأكياس بتضغط على الأوعية جوّه الكلية، فأجزاء منها تحس إنها مش واخدة دم كفاية، فتطلّع **renin**.
          - **Proteinuria خفيفة**: لأن المرض في الـ tubules مش في الـ glomeruli، فهي أقل من **1 g/day**.
      - kind: explain
        page: 148
        title: "الـ ESRD: مش قدر"
        quote: "Renal size increases with age, and renal enlargement eventually occurs in 100% of patients with ADPKD. The severity of the structural abnormality correlates with the manifestations of ADPKD, such as pain, hematuria, hypertension, and renal impairment.1 Massive renal enlargement can lead to compression of local structures, resulting in such complica-tions as inferior vena cava (IVC) compression and digestive symp-enlargement of renal cysts. The Consortium for Radiologic Imaging Studies of Polycystic Kidney Disease (CRISP), a prospective study of 241 patients by annual MRI, has shown that total kidney volume and cyst volumes increased exponentially.22 Rates of growth were relatively constant, averaging 5.3% per year, but highly variable from patient to patient. Baseline total kidney volume predicted the subsequent rate of increase in renal volume and decline in GFR.23 An imaging classification.\nHypertension Hypertension is the most common manifestation of ADPKD and a major contributor to renal disease progression and cardiovascular mor-bidity and mortality (Fig. 44.3). Microalbuminuria, proteinuria, and hematuria, which are independent risk factors for renal functional decline, are more common in hypertensive patients with ADPKD. Hypertension also may increase morbidity from valvular heart disease and intracranial aneurysms, which are common in ADPKD.\nEnd-Stage Renal Disease In most patients, renal function is maintained within the normal range, despite relentless growth of cysts, until the fourth to sixth decade of life. By the time renal function starts declining, the kidneys usually are greatly enlarged and distorted with little recognizable parenchyma on imaging studies. At this stage, the average rate of GFR decline is 4.4 to 5.9 ml/min per year. Nevertheless, ESRD is not inevitable in ADPKD."
        text: |
          حجم الكلية بيكبر مع السن في **100%**، والـ Consortium for Radiologic Imaging Studies of Polycystic Kidney Disease (CRISP) لقى إنه بيكبر **5.3% في السنة**، والـ **baseline total kidney volume** بيتنبأ بسرعة الكبر ونزول الـ glomerular filtration rate (GFR).

          ==Hypertension==: **أشهر manifestation** في الـ ADPKD وسبب كبير للـ progression.

          الكلية بتفضل شغالة لحد **العقد الرابع–السادس**، وبعدين الـ GFR ينزل **4.4–5.9 mL/min في السنة**. بس ==ESRD مش حتمي==.

          ليه الـ GFR يفضل ثابت سنين والكلية بتكبر؟ التفسير المقبول (مش في الكتاب): الـ nephrons السليمة بتشتغل زيادة وتعوّض اللي راح (hyperfiltration)، فالـ creatinine يفضل طبيعي لحد ما الاحتياطي يخلص. يعني الكلية بتكبر سنين في صمت، وعلشان كده الـ total kidney volume بيتنبأ أحسن من الـ GFR في الأول: الحجم بيبيّن المرض بدري، والـ GFR بيبيّنه متأخر.

          إزاي تستعمل الكلام ده في العيادة؟ التفسير المقبول (مش في الكتاب): مريض عنده 35 سنة والـ creatinine طبيعي ما تطمّنش بسببه لوحده. الحجم الكبير بيقول إن الـ nephrons بتشتغل فوق طاقتها، يعني المرض ماشي حتى لو التحاليل نضيفة. علشان كده الضغط بيتظبط بدري، والمريض اللي حجم كليته كبير بالنسبة لسنه هو اللي بيستاهل علاج يبطّأ الأكياس.
      - kind: figure
        page: 148
        quote: "Rates of growth were relatively constant, averaging 5.3% per year, but highly variable from patient to patient. Baseline total kidney volume predicted the subsequent rate of increase in renal volume and decline in GFR."
        title: "الحجم بيكبر بدري، والـ GFR بيقع متأخر"
