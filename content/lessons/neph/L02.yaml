  - id: neph.L02.lesson9
    title: "السبب والـ KFRE"
    hook: "أربع أماكن في الكلية، وأربع أرقام في معادلة بتقولك مين هيوصل للغسيل."
    minutes: 9
    pages: [33, 36]
    topics: [causes, risk]
    goals:
      - "تدوّر على السبب بالأدوات الصح"
      - "تصنّف السبب حسب المكان وتعرف شكله في البول"
