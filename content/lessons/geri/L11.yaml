  - id: geri.L11.lesson4
    title: "الـ exacerbation: أوكسجين بحساب"
    hook: "أكتر غلطة في الطوارئ: تدّي مريض COPD أوكسجين لحد 100%. الدرس ده بيقولك ليه 88-92 كفاية، وليه 90 ممكن تبقى خطر."
    minutes: 10
    pages: [202, 205]
    topics: [exacerbation, oxygen]
    goals:
      - "تعرّف الـ exacerbation وتعرف الـ work-up والـ DD"
      - "تعرف إمتى تحجز وإزاي تعالج"
      - "تختار الـ antibiotic بالـ severity والـ risk factors"
      - "تفهم الـ dissociation curve وحدود الـ pulse oximetry"
    status: unverified
    steps:
      - kind: explain
        page: 202
        quote: "an acute change in sputumvolumeor purulence, and/or an increase in dyspnea beyond usual day-to-day variation that warrants a change in therapy."
        title: "التعريف"
        text: |
          الـ ==exacerbation==: تغيير حاد في **كمية أو صديد البلغم** و/أو **dyspnea** أكتر من التقلب اليومي، بشكل **يستاهل تغيير العلاج**.

          - **70%** سببها respiratory infection.
          - PCR موجب **مش دليل سببية**، إلا **influenza**: اعتبره السبب وعالجه.
          - التشخيص **clinical**؛ الـ sputum culture غالبًا مش بتفرّق colonizer من pathogen.
          - الـ **procalcitonin** بيعلى مع الـ bacterial toxins وممكن يوجّه الـ antibiotic.
      - kind: explain
        page: 202
        quote: "Pneumothx( even small pneumothxon top of COPD mortality up to 50%)."
        title: "Work-up و DD"
        text: |
          **Investigations**: ABG (على هوا الأوضة أو اكتب الـ FiO2)، chest X-ray، sputum، blood culture لو شاكك في systemic infection، U&E و CRP، ECG.

          **DD**:
          - Pneumonia.
          - ==Pneumothorax==: حتى الصغير فوق COPD الـ mortality ممكن توصل **50%**.
          - Asthma: لو شاكك، عالجه كـ asthma.
          - PE، left heart failure.
          - أدوية: **sedatives** و **beta blockers**.
      - kind: check
        page: 202
        quote: "Drug induced deterioration in resp function (check for sedatives …beta blockers)."
        question: "An 82-year-old with COPD worsened after starting night sedation. What is this in the book's DD?"
        options: ["Drug-induced respiratory deterioration", "Pulmonary embolism", "Left heart failure", "Asthma"]
        answer: 0
        why:
          - "صح: افحص الـ sedatives والـ beta blockers."
          - "مفيش هنا حاجة بتوحي بـ PE."
          - "مفيش علامات heart failure في السؤال."
          - "التوقيت مع الدوا بيوجّه للـ drug cause."
      - kind: explain
        page: 203
        quote: "Significant increase in symptom severity. Severe underlying COPD. Significant comorbidities. Failure to respond to initial medical management."
        title: "تحجزه إمتى؟"
        text: |
          - زيادة كبيرة في الأعراض.
          - COPD شديد أصلًا.
          - Comorbidities مهمة.
          - مفيش استجابة للعلاج الأولي.
          - التشخيص مش واضح.
          - ==Insufficient home support==: مهمة جدًا في الكبار اللي عايشين لوحدهم.
      - kind: explain
        page: 203
        quote: "Oxygen (target SpO2 88-92%) .. Do Not give high flow O2 unless ABG evidence absence of CO2 retention."
        title: "العلاج الفوري"
        text: |
          1. **Oxygen**: target ==SpO2 88-92%==. مفيش high flow إلا لو الـ ABG أثبت إن مفيش CO2 retention.
          2. **SABA** (salbutamol أو terbutaline) nebulizer.
          3. **SAMA** (ipratropium) لو الـ SABA مش كفاية؛ وممكن **IV aminophylline**.
          4. **Oral prednisolone** (لو أصلًا عليه maintenance، زوّد الجرعة)؛ وممكن IV hydrocortisone.
          5. Antimicrobials.
          6. Assisted ventilation.
          7. Physiotherapy للإفرازات.

          مش بيتحسن؟ فكّر في resistant organisms أو مرض تحتي: **bronchogenic carcinoma** أو **bronchiectasis**.
      - kind: explain
        page: 204
        quote: "Age > 65, comorbid conditions , severe airflow obstruction (FEV1 < 50%), > 3 exacerbations/yr"
        title: "الـ antibiotic"
        text: |
          **الميكروبات**: H. influenzae، Strep. pneumoniae، Moraxella، و **Pseudomonas** لو فيه risk factors.

          **Risk factors** (poor outcome أو resistant organism): سن **فوق 65**، comorbidities، **FEV1 < 50%**، **أكتر من 3** exacerbations في السنة، antibiotic أو دخول مستشفى في آخر **3 شهور**.

          **الـ severity**: الاتنين محتاجين **2 من 3** (dyspnea، كمية البلغم، صديد البلغم). ==Moderate== من غير respiratory failure، و **severe** معاه.
      - kind: table
        page: 204
        quote: "Moderate attack and Absence of risk factors (for poor outcome or drug resist .organism) Macrolide, doxycycline, cephalosporin (second or third generation)."
        title: "اختار المضاد"
        columns: ["Situation", "Antibiotic"]
        rows:
          - ["Moderate, no risk factors", "Macrolide, doxycycline, 2nd/3rd-gen cephalosporin"]
          - ["Moderate + risk factors, or severe", "Fluoroquinolone, piperacillin-tazobactam, ceftazidime + sputum culture"]
        hide: [[0, 1], [1, 1]]
      - kind: case
        page: 204
        quote: "Moderate attack in Presence of risk factors Or if Severe attack: Fluoroquinolone, antipseudomonal penicillin (pipercillin-tazobactam), ceftazidime"
        stem: "A 79-year-old man with COPD has more dyspnea and purulent sputum. SpO2 89% on air, ABG without respiratory failure. He finished amoxicillin 6 weeks ago."
        steps:
