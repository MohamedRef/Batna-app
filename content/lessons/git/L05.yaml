          التفسير المقبول (مش في الكتاب): الـ dysplasia هي العلامة اللي بتقول إن الخلايا بدأت تتغير في اتجاه السرطان. فالتقسيم ده بيرتّب الـ serrated زي سلّم: من aberrant crypt (أصغر تغيير) لحد الـ serrated adenocarcinoma. ولاحظ إن الـ SSA في العمود الـ non-dysplastic رغم إنه precursor: يعني خطره من سلوكه ومكانه، مش من dysplasia ظاهرة.
