  - id: dm.L17.060
    kind: mcq
    topic: radiology
    stem: A lateral spine X-ray of a 70-year-old woman shows a Schmorl's node, biconcave end-plates and prominent vertical trabeculae. Which diagnosis do these favour?
    options:
      - Primary osteoporosis
      - Osteomalacia
      - Multiple myeloma
      - Rheumatoid arthritis
      - Normal ageing spine
    answer: 0
    why:
      - "Correct: Schmorl's nodes are more common in primary osteoporosis; loss of horizontal trabeculae makes the vertical ones stand out (p220-221)."
      - Schmorl's nodes rarely appear in osteomalacia; look for pseudofractures instead.
      - Myeloma shows lytic lesions.
