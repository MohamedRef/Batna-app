          - ["Acute", "Acute interstitial pneumonia", "ARDS histology; rapid respiratory failure"]
        hide: [[1, 1], [2, 1], [2, 2]]
      - kind: explain
        page: 177
        quote: "COP often develops weeks or months after the onset of a flulike illness."
        title: "COP و AIP"
        text: |
          **COP** (cryptogenic organizing pneumonia): غالبًا بعد **flulike illness** بأسابيع أو شهور، بـ dyspnea أو exercise intolerance. الـ course متغيّر: ممكن يخف لوحده أو يتقدم، وبيرد كويس جدًا على الـ ==steroids==.

          **AIP** (acute interstitial pneumonia): severe lung injury idiopathic، الـ histopathology بتاعته زي **ARDS**. بييجي من غير مرض رئوي قبله، أو accelerated phase لـ ILD موجود. أغلبهم يروحوا **respiratory failure** بسرعة، وبعضهم يتحسن بالـ steroids.
      - kind: explain
        page: 178
        quote: "The most common presenting symptom is the insidious onset of exertional dyspnea that slowly progresses over many months"
        title: "أعراض الـ IPF"
        text: |
          - الأشهر: ==exertional dyspnea== بتبدأ بالراحة وتزيد على شهور، وأحيانًا سنين، لحد ما تبقى at rest.
          - في الأول بتتقلب على: out of shape، السن، الوزن، أو فيروس. وفيه ناس بتتعالج غلط على إنها **heart failure**.
          - **Nonproductive cough** و **fatigue** مهمين.
          - Systemic مش شائع: weight loss، low-grade fever، arthralgia، myalgia. **مش arthritis ومش myositis.**
          - ممكن يتكشف صدفة في X-ray أو spirometry لسبب تاني.
      - kind: aside
        tone: joke
        page: 178
        quote: "dyspnea is mild and maybe attributed to other causes such as being out-of-shape,"
        text: "أخطر تشخيص في طب المسنين: «ده من السن يا حاج». كتير من الـ IPF بيتأخر تشخيصه بسبب الجملة دي."
      - kind: aside
        tone: trap
        page: 179
        quote: "Extrapulmonary involvement does not occur with idiopathic pulmonary fibrosis."
        text: "فخ امتحان: arthralgia و myalgia ماشيين مع IPF، بس arthritis أو myositis = دوّر على connective tissue disease. الـ IPF مفيهوش extrapulmonary involvement."
      - kind: explain
        page: 179
        quote: "Characteristic bilateral basal crepitant (\"Velcro-like\") late-inspiratory rales (crackles) on lung auscultation."
        title: "الكشف"
        text: |
          - **Bilateral basal ==Velcro-like== late-inspiratory crackles**: العلامة المميزة.
          - أحيانًا wheeze أو rhonchi؛ وفي الأول الصدر ممكن يبقى طبيعي.
          - **Clubbing**: relatively common في الـ IPF، أقل في DPLDs تانية.
          - المتقدم: resting tachycardia و tachypnea.
          - مع الـ pulmonary hypertension و cor pulmonale: **loud P2**، tricuspid insufficiency، RV heave، edema.
      - kind: mnemonic
        page: 179
        quote: "1) Drug history (e.g. Amiodarone, bleomycin, and nitrofurantoin)."
        word: "DOCS"
        parts:
          - { key: "D", text: "Drugs: amiodarone, bleomycin, nitrofurantoin" }
          - { key: "O", text: "Occupational and other exposure: radiation, asbestos, silica, heavy metals, pigeon droppings" }
          - { key: "C", text: "Collagen-vascular disease: arthralgia, arthritis, photosensitivity, Raynaud, dry eyes or mouth" }
          - { key: "S", text: "Sleep apnoea (OSA): high prevalence in IPF" }
        hook: |
          قبل ما تقول IPF، اسأل الـ **DOCS**. أي إجابة إيجابية في أول تلاتة ممكن تحوّله من idiopathic لـ known cause.
      - kind: check
        page: 179
