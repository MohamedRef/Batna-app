    topic: compensation
    front: What is the appropriate physiological response to metabolic alkalosis?
    back: Hypoventilation (rise in pCO2).
    src: { page: 13, quote: "Conversely, hypoventilation is an appropriate physiological response to metabolic alkalosis." }
    status: unverified
  - id: neph.L01.068
    kind: card
    topic: compensation
    front: How does the kidney compensate respiratory acidosis?
    back: It increases plasma [HCO3−], raising the pH toward normal.
    src: { page: 13, quote: "The renal compensation increases the plasma [HCO3−] with a resultant increase in pH toward normal." }
    status: unverified
