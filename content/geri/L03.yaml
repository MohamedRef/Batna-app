    kind: card
    topic: pd
    front: What is altered pharmacodynamics in the elderly? Give the lecture's examples.
    back: "Age-related changes in drug sensitivity (ageing plus drug-receptor interactions): increased sensitivity to many drugs such as opiates, and decreased beta-adrenergic responses (propranolol, isoproterenol)."
    src: { page: 46, quote: "Ageing is associated with an increased sensitivity for many compounds- opiates, decreased B-adrenergic responses in the elderly" }
    status: unverified
    tags: [high-yield]
