  - id: hem.L02.031
    kind: mcq
    topic: examination
    stem: A 30-year-old woman has anaemia, jaundice and a soft, mildly enlarged spleen of recent onset. Which cause fits the book's description best?
    options:
      - Autoimmune haemolytic anaemia
      - Myelofibrosis
      - Gaucher's disease
      - Thalassaemia major
      - Cirrhosis with a shrunken liver
    answer: 0
    why:
      - "Correct: AIHA (and PK deficiency) give a soft spleen (p12)."
      - Myelofibrosis gives a firm spleen.
      - Gaucher's disease gives a firm spleen.
      - Chronic haemolytic states such as thalassaemia major give a firm spleen.
      - Cirrhosis is about the liver; its anaemia comes from varices, hypersplenism or spur cells.
    src: { page: 12, quote: "Splenomegaly: AIHA or pyruvate kinase deficiency (soft spleen)" }
    status: unverified
