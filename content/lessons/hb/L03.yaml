        image: { file: hb/L03-varices-natural-history.webp, book: true }
        alt: "Book diagram. Grey stage boxes down the middle: no varices (~50%); varices (~50%), small and large; variceal bleeding; variceal rebleeding (63% risk at 2y). Rates beside them: 4-5% per year (forming), 12% per year (small to large), <10% risk of bleeding at 2y for small, >25% for large. Yellow boxes on the left with red arrows and red crosses: preventing variceal formation, preventing variceal growth, preventing first bleeding, preventing rebleeding. On the right a yellow box 'Treating acute bleeding' points at variceal bleeding."
        caption: |
          الرسمة سلّم من فوق لتحت، وكل درجة عليها ==X أحمر== معناه «هنا نقدر نوقف المرض»:

          - **No Varices (~50%)** ← بتتكوّن بمعدل **4-5% per year** ← الصندوق الأصفر شمال: **Preventing Variceal Formation**.
          - **Varices (~50%)**: **Small** (<10% risk bleeding at 2y) و **Large** (>25% risk bleeding at 2y)، والصغيرة بتكبر **12% per year** ← **Preventing Variceal Growth**.
          - **Variceal Bleeding** ← شمال **Preventing First Bleeding**، ويمين **Treating acute bleeding**.
          - **Variceal Rebleeding (63% risk at 2y)** ← **Preventing Rebleeding**.

          يعني كل صندوق أصفر هو فصل من فصول العلاج اللي جاية: pre-primary، منع النمو، primary، علاج النزيف، و ==secondary prophylaxis==. ورقم الـ 63% بيقولك ليه الـ secondary prophylaxis إجباري.
      - kind: figure
        page: 44
        title: "مراحل الوقاية على خط الزمن في الكتاب"
        image: { file: hb/L03-prevention-timeline.webp, book: true }
        alt: "Book illustration of a timeline running left to right: a liver at 'Cirrhosis start', then a vein marked 'small' with an upward arrow 'EV development', then a vein with varices marked 'large' and an upward red arrow 'First bleeding', with a down arrow 'Hemostasis' above. A red frame encloses the stretch labelled 'Preprimary prevention'; 'Primary prevention' is the stretch after it."
        caption: |
          نفس الكلام على خط زمن من الشمال لليمين:

          - **شمال**: الكبد، **Cirrhosis start**.
          - **المربع الأحمر**: **Preprimary prevention**: من بداية الـ cirrhosis لحد ما الـ esophageal varices تظهر (السهم الأزرق تحت، ولسه **small**).
          - **بعده**: **Primary prevention**: الوريد فيه دوالي بنفسجي و**large**، لحد **First bleeding** (السهم الأحمر تحت يمين).
          - **فوق يمين**: **Hemostasis**: وقف النزيف لما يحصل.

          الصورة بتوضّح إن الـ pre-primary والـ primary ==مرحلتين مختلفتين== على نفس الطريق، والفاصل بينهم هو ظهور الدوالي.
