        prompt: "ليه نعمل screening لكل البالغين حتى لو مفيش أعراض؟"
        answer: |
          جمّع اللي اتعلمته:

          - المرض **silent for years**، فالأعراض مش هتنبهك بدري.
          - العلاج **curable in > 95%** و **oral, short-course**.
          - و **early detection and treatment prevent cirrhosis and liver cancer** (take-home message من الكتاب).

          مرض ساكت + علاج سهل بيشفي = لازم تدوّر عليه بنفسك.
