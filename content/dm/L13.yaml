  - id: dm.L13.101
    kind: case
    topic: diagnosis
    stem: Mrs. Karima, 37, G3P2, BMI 33, has no known diabetes. At her first prenatal visit at 9 weeks you test her because of risk factors.
    steps:
      - reveal: "Fasting plasma glucose 131 mg/dL; 2-hour value on a 75 g OGTT 212 mg/dL."
        question: What is the diagnosis?
        options: [Pre-existing (overt) type 2 DM, GDM, Normal for early pregnancy, Repeat at 24-28 weeks]
        answer: 0
        why: Standard criteria (FPG ≥126, 2-h ≥200) met in the first trimester mean undiagnosed pre-existing diabetes, not GDM.
      - question: Which home glucose targets do you give her?
        options: ["Fasting ≤95, 1-h ≤140 or 2-h ≤120 mg/dL", "Fasting 80-130, postprandial <180 mg/dL", "Fasting ≤110, 2-h ≤160 mg/dL", A1C <7% only]
        answer: 0
        why: The ACOG/ADA pregnancy targets apply to pre-gestational DM and GDM alike.
      - question: Which additional drug should she start at the end of the 1st trimester?
        options: [Low-dose aspirin 60-150 mg/day, Atorvastatin, Enalapril, Glyburide]
        answer: 0
        why: Women with T1 or T2DM take low-dose aspirin until delivery to lower preeclampsia risk.
      - reveal: Despite diet and metformin, her glucose stays above target at 24 weeks; she weighs 90 kg.
        question: Using the trimester + weight-based regimen, what total daily insulin dose do you start?
        options: [About 72 units (0.8 units/kg), About 45 units (0.5 units/kg), About 90 units (1 unit/kg), About 20 units fixed]
        answer: 0
        why: 2nd-trimester TDD is 0.8 units/kg; 0.8 × 90 = 72 units, split 2/3 morning and 1/3 evening.
