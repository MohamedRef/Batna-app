            <text x="165" y="216" text-anchor="middle" class="t-sm t-b">Laboratory</text>
            <text x="165" y="242" text-anchor="middle" class="t-sm">LA or aCL, medium titre</text>
            <text x="165" y="266" text-anchor="middle" class="t-sm">positive over 6 weeks</text>
            <text x="165" y="310" text-anchor="middle" class="t-sm t-mut">SLE: 40% have aPL, half get events</text>
          </svg>
      - kind: update
        page: 321
        quote: "3- Laboratory: A- LA or aCL medium titre. B- Positive over 6 wks."
        text: "الـ revised criteria بتطلب الـ antibodies مرتين بينهم **12 أسبوع** على الأقل، وزوّدت **anti-β2-glycoprotein I**. في الامتحان: 6 أسابيع زي الكتاب."
        ref: "Revised Sapporo (Sydney) APS criteria, 2006"
      - kind: explain
        page: 321
        title: "العلاج"
        quote: "In patients with SLE and APS antibodies, low-dose aspirin may be considered for primary prevention of thrombosis and pregnancy loss. Other risk factors for thrombosis should also be assessed."
        text: |
          - **Primary prevention:** ==low-dose aspirin== + قيّم باقي الـ risk factors. الـ **estrogen** بيزوّد الجلطات.
          - **بعد thrombosis (مش حامل):** **long-term oral anticoagulation**.
          - **حامل:** **heparin (UFH أو low-molecular-weight heparin (LMWH)) + aspirin**.

          يعني العلاج على قد الحدث: مفيش حدث ← aspirin؛ جلطة ← anticoagulation طويل؛ حمل ← heparin لأن الـ warfarin مش بيتاخد في الحمل (التفسير المقبول، مش في الكتاب).
