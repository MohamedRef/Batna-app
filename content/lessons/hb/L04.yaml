      - kind: explain
        page: 71
        quote: "Patients should receive anticoagulation as soon as possible for an indefinite period."
        title: "الدرجة الأولى بالتفصيل"
        text: |
          - ==Anticoagulation as soon as possible, for an indefinite period.==
          - **LMWH** لمدة 5–7 أيام على الأقل مع **VKA**، والـ target ==INR 2–3==.
          - عالج السبب (زي الـ **MPN**).
          - عالج مضاعفات الـ portal hypertension زي الـ **cirrhosis** بالظبط.

          ليه بسرعة؟ علشان تقلّل **clot extension** و**new thrombotic episodes**.
      - kind: aside
        tone: trap
        page: 71
        quote: "Consider brief interruption of anticoagulation therapy whenever an invasive procedure is performed, including paracentesis."
        text: |
          الممتحن بيحب يسأل: «عنده varices، أوقف الـ anticoagulation؟»

          الكتاب: ==portal hypertension complications, when adequately treated, are not a contraindication for anticoagulation==. عالج الـ varices وكمّل.

          الاستثناء الوحيد: **brief interruption** قبل أي invasive procedure، حتى الـ **paracentesis**.
      - kind: reveal
        page: 71
        quote: "Patients should receive anticoagulation as soon as possible for an indefinite period."
        prompt: "ليه الـ anticoagulation في الـ BCS **indefinite** مش 6 شهور زي الـ acute PVT؟"
        answer: |
          لأن الكتاب بيقول كده: **indefinite period**. والمنطق إن الـ BCS غالبًا وراه **prothrombotic state** مستمر (MPN، thrombophilia...) مش هيروح بعد 6 شهور، ولو الجلطة رجعت في الـ outflow الكبد كله بيدفع التمن.
      - kind: explain
        page: 72
        quote: "Consider angioplasty/stenting as the first-line decompressive procedure in patients with short hepatic vein thrombosis or IVC stenosis."
        title: "الدرجات 2 و 3 و 4"
        text: |
          **Angioplasty/stenting:**

          - الـ ==first-line decompressive procedure== لو فيه **short hepatic vein thrombosis** أو **IVC stenosis** (partial أو segmental).
          - ميزته إنه بيرجّع الـ **physiological drainage** للـ portal والـ sinusoidal blood.
          - عيبه إن الـ **re-stenosis** بتحصل كتير بعده، وبتقل لما تحط **stent** مع الـ angioplasty.
          - بس هو definitive treatment في أقل من 10% من عيانين الغرب.

          **TIPS:**

          - الـ surgical shunts مالهاش ==survival advantage== في الـ BCS.
          - الـ TIPS أقل في الـ morbidity والـ mortality، وينفع في أغلب العيانين حتى مع **IVC obstruction** أو severe IVC stenosis.
          - الـ **surgical shunt** يتناقش بس لو الـ TIPS مش ممكن أو فشل.

          **Liver transplant:**

          - آخر درجة في السلّم.
          - الـ BCS ممكن يرجع بعده، علشان كده الـ anticoagulation بيكمّل في أغلب العيانين.
      - kind: figure
        page: 72
        quote: "Consider angioplasty/stenting as the first-line decompressive procedure in patients with short hepatic vein thrombosis or IVC stenosis."
        title: "Angioplasty وstent جوه الوريد"
        image: { file: hb/L04-angioplasty-stent.webp, book: true }
        alt: "Book illustration in three panels: a balloon catheter inside a narrowed vein, the balloon inflated expanding a mesh stent, and the stent left in place holding the vein open."
        caption: "البالونة بتفتح الـ stenosis، والـ ==stent== بيفضل مكانه يمسك الوريد مفتوح. ده اللي بيقلّل الـ re-stenosis اللي بتحصل كتير بعد الـ angioplasty لوحدها."
      - kind: figure
        page: 73
        quote: "transform the portal system into an outflow tract with a polytetrafluoroethylene (PTFE) stent by connecting a branch of portal vein and hepatic vein"
        title: "الـ TIPS في الـ BCS"
        image: { file: hb/L04-tips.webp, book: true }
        alt: "Book drawing of a liver with a stent connecting a branch of the portal vein to a branch of the hepatic vein. Labels: portal vein flows into the liver, hepatic veins flow out of the liver."
        caption: "الـ stent بيوصّل فرع من الـ portal vein بفرع من الـ hepatic vein، فالدم يلاقي طريق للخروج. ده معنى إن الـ ==portal system== بيبقى outflow tract."
      - kind: aside
        tone: analogy
        page: 73
        quote: "transform the portal system into an outflow tract with a polytetrafluoroethylene (PTFE) stent by connecting a branch of portal vein and hepatic vein"
        text: |
          الـ TIPS في الـ BCS زي ما الشارع الرئيسي يتقفل، فتفتح باب ورا من الـ portal vein على الـ hepatic vein. الكتاب بيقول إنه بيحوّل الـ ==portal system into an outflow tract==: الماسورة اللي كانت بتدخّل الدم بقت هي اللي بتطلّعه.
      - kind: case
        page: 69
        quote: "Identification of one risk factor should not defer from looking for additional risk factors."
        stem: "A 29-year-old woman on oral contraceptives has 2 months of abdominal pain, ascites and a large tender liver. JVP is normal."
