        <text x="160" y="50" text-anchor="middle" class="t-sm t-b">Evidence</text>
        <text x="160" y="65" text-anchor="middle" class="t-sm t-mut">best research</text>
        <text x="88" y="176" text-anchor="middle" class="t-sm t-b">Experience</text>
        <text x="88" y="191" text-anchor="middle" class="t-sm t-mut">clinical expertise</text>
        <text x="232" y="176" text-anchor="middle" class="t-sm t-b">Expectation</text>
        <text x="232" y="191" text-anchor="middle" class="t-sm t-mut">patient values</text>
        <text x="160" y="132" text-anchor="middle" class="t-sm t-b t-acc">EBM</text>
        <text x="160" y="226" text-anchor="middle" class="t-sm">all three → improved patient outcomes</text>
      </svg>
    caption: Evidence + Experience + Expectation، والـ EBM في النص.
    alt: 'Three overlapping circles: evidence, experience (clinical expertise) and expectation (patient values), with EBM
      at the centre.'
  - kind: mnemonic
    page: 24
    quote: |-
      Three (Es)- EBM Components
      EVIDENCE
