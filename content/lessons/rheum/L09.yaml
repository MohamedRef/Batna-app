  - id: rheum.L09.lesson4
    title: "الـ antibodies والـ workup"
    hook: "تحليل دم واحد ممكن يقولك الرئة هتتليف، أو إن فيه cancer مستخبي. وبعدها MRI يقولك تاخد العينة منين."
    minutes: 9
    pages: [167, 167]
    topics: [antibodies, diagnosis]
    goals:
      - "تحفظ جدول الـ MSAs وتعرف ليه كل واحد مهم"
      - "ترتب الـ workup: enzymes، EMG، MRI، biopsy"
      - "تفهم ليه الـ AST والـ ALT بيعلوا من العضلة"
    status: unverified
    steps:
      - kind: figure
        page: 167
        quote: "Anti-Mi-2: Associated with classic DM and good prognosis.\nAnti-MDA5: Linked to clinically amyopathic DM and rapidly progressive ILD."
        title: "خريطة الـ antibodies"
        alt: "A map of myositis-specific antibodies. Mi-2 points to classic DM with good prognosis; MDA5 to amyopathic DM and rapidly progressive ILD; TIF1-gamma to adult DM and cancer; NXP2 to juvenile DM; SAE to skin disease and dysphagia; SRP and HMGCR to necrotizing myopathy. A side box lists myositis-associated antibodies Ro, U1-RNP, PM/Scl and Ku for overlap."
        caption: "كل antibody ليه شخصية: ==transcriptional intermediary factor 1-gamma (TIF1γ) = cancer==، ==melanoma differentiation-associated gene 5 (MDA5) = رئة بتجري==، و **Mi-2** هو الطيب."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
