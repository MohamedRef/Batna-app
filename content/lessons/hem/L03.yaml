        title: "الصورة الإكلينيكية"
        quote: "Main complications are vasoocclusive crises while anaemia itself poses little problem."
        text: |
          المشكلة الكبيرة ==الـ vaso-occlusive crises==؛ الـ anaemia نفسها مش بتعمل مشكلة كبيرة.

          - **النمو** متأخر في الأطفال. التفسير المقبول (مش في الكتاب): أنيميا مزمنة وأنسجة ناقصها أكسجين، وطاقة كتير رايحة لنخاع شغال overtime.
          - **الطحال**: كبير في الرضيع، وبعدين ==يصغر ويتليف== من الـ infarctions المتكررة (autosplenectomy).
          - **العدوى**: الأطفال (خصوصًا < 5 سنين) معرضين لعدوى **fulminant** لأن الطحال مش شغال.
          - الـ **vaso-occlusive crisis**: ألم مفاجئ شديد في العضم والمفاصل والصدر أو البطن.
