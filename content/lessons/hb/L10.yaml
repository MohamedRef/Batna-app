  - id: hb.L10.lesson5
    title: "نزرع ولا نستنى؟ الـ prognosis و King's College"
    hook: "القرار ده بيتاخد في ساعات. اعرف الأرقام اللي بتقول «اتصل بمركز الزرع دلوقتي»."
    minutes: 10
    pages: [183, 187]
    topics: [prognosis, transplant]
    goals:
      - "تعدّ الـ general prognostic indicators"
      - "تفرق بين primary و secondary ALF من ناحية الزرع"
      - "تحفظ King's College و Clichy criteria"
    status: unverified
    steps:
      - kind: explain
        page: 183
        title: "الزرع غيّر اللعبة"
        text: |
          الـ **emergent liver transplantation** هو **أهم تطور** في علاج الـ ALF و **غيّر الـ survival**.

          الاختيار بيعتمد على حاجتين: **هيعيش من غير زرع ولا لأ؟** و **هيعيش بعد الزرع ولا لأ؟** (too sick، مش مستوفي الشروط، أو عنده contraindication).

          والـ multi-organ failure بتسوء وهو مستني، علشان كده الـ prognostic assessment يتعمل **في المستشفى اللي وصلها أول** وفي مركز الزرع، **بأسرع وقت**.
      - kind: mnemonic
        page: 184
        word: "HEAS"
        parts:
          - { key: "H", text: "Hepatic encephalopathy: any HE means critical care review and transfer to a liver center" }
          - { key: "E", text: "Extra-hepatic organ failure, especially renal" }
          - { key: "A", text: "Adverse etiology and presentation: subacute, indeterminate cause" }
          - { key: "S", text: "Severity of liver injury: coagulopathy, bilirubin" }
        hook: |
          الأربع domains بتوع الـ **early prognosis**: «**HEAS**» زي «هِيس!» اللي بتقولها لما حد يعمل دوشة في المحاضرة 🤫. لو واحد منهم ظهر، اسكت كده واتصل بمركز الزرع.
      - kind: explain
        page: 184
        title: "تفاصيل الـ domains"
        text: |
          - **HE:** الـ subacute حتى مع **low grade HE** = prognosis وحش جدًا؛ الـ hyperacute بنفس الدرجة ممكن يخف. فـ **threshold واحد لكل الناس overly simplistic**. ولو فيه أكتر من سبب للـ consciousness: **arterial ammonia عالي** = HE.
          - **Extra-hepatic failure** (خصوصًا الكلية): marker للـ severity ومحتاج critical care و نقاش مع المركز.
          - **Severity:** الـ coagulation مهمة في كل الأسباب، بس الـ **thresholds بتختلف** بالسبب والتطور والسن؛ والـ INR مش موحّد دوليًا.
          - **Adverse etiology:** **subacute** و **indeterminate** = survival وحش من غير زرع.
      - kind: check
        page: 185
        question: "An INR of 2.5 would be of immediate concern in which setting, per the book?"
        options:
          - "Subacute ALF"
          - "Acetaminophen hepatotoxicity"
          - "Hepatitis A ALF"
          - "Every cause equally"
        answer: 0
        why:
          - "صح: الكتاب بيضرب المثل ده بالظبط: **INR 2.5** يقلق فورًا في الـ **subacute** مش في الـ acetaminophen."
          - "في الـ acetaminophen الـ INR ممكن يعلى جدًا ويخف."
          - "الـ HAV زي الـ acetaminophen، recovery >50%."
          - "الفكرة إن الـ thresholds **بتختلف** بالسبب."
      - kind: explain
        page: 185
        title: "علامات تقول «حوّله»"
        text: |
          - في الـ **DILI غير الـ acetaminophen**: الـ **bilirubin** هو key predictor.
          - **Falling transaminases** + **rising bilirubin و INR** + **shrinking liver** = poor prognosis → فكّر في النقل لمركز زرع.
          - **MELD >32** مرتبط بـ poor transplant-free survival.
          - الـ ALF = **6%** من زراعات الكبد في أمريكا. الـ 1-year survival أقل من باقي الـ indications، بس أحسن بكتير من غير زرع، والـ long-term ممتاز.
      - kind: aside
        tone: trap
        page: 186
        text: |
          الـ **ALT بينزل** والـ **bilirubin بيعلى**؟ ده مش «الإنزيمات بتتحسن»! ده الكبد **خلص خلاياه** ومفيش حاجة تطلع إنزيمات أصلًا. 🚨 علامة وحشة مش كويسة.
      - kind: sort
        page: 185
        prompt: "مين ينفع له emergent transplant (primary) ومين لأ (secondary)؟"
        bins: ["Primary: LT may be an option", "Secondary: LT not an option"]
        cards:
          - { text: "Acute viral hepatitis", bin: 0 }
          - { text: "Acute Budd-Chiari syndrome", bin: 0 }
          - { text: "Fulminant Wilson disease", bin: 0 }
          - { text: "HBV reactivation", bin: 0 }
          - { text: "Ischemic hepatitis", bin: 1 }
          - { text: "Lymphoma", bin: 1 }
          - { text: "Severe alcoholic hepatitis", bin: 1 }
          - { text: "Extensive liver resection", bin: 1 }
        why: "**Primary**: viral، drug/toxin، acute Budd-Chiari، acute autoimmune، pregnancy-related، fulminant Wilson، chronic AIH و chronic Budd-Chiari بصورة acute، و HBV reactivation. **Secondary**: ischemic، systemic diseases (HLH، metabolic، infiltrative، lymphoma، malaria، leptospirosis، rickettsia)، severe alcoholic hepatitis، و extensive resection."
      - kind: figure
        page: 187
        title: "King's College و Clichy"
        alt: "A flowchart. Acetaminophen ALF: pH under 7.3 after resuscitation and 24 hours after ingestion, or lactate over 3 mmol/L, or all three of INR over 6.5, creatinine over 300 micromol/L and HE stage 3 or 4. Non-acetaminophen ALF: INR over 6.5 alone, or any three of age under 10 or over 40, jaundice to HE over 7 days, INR over 3.5, bilirubin over 300 micromol/L, and drug-induced or indeterminate etiology. The book adds that ALF from Wilson disease or Budd-Chiari qualifies on its own. Below, Beaujon-Paul Brousse (Clichy): HE stage 3 or 4 plus factor V under 20 percent if under 30 years or under 30 percent if over 30."
        caption: "الـ acetaminophen: **حمضي، lactate، أو التلاتة**. الـ non-acetaminophen: **INR >6.5** لوحده أو **3 من 5**."
        svg: |
          <svg viewBox="0 0 330 560" xmlns="http://www.w3.org/2000/svg">
          <defs><marker id="L10d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
