    status: unverified
    steps:
      - kind: explain
        page: 285
        title: "الـ prognosis"
        quote: "In general the functional prognosis is good unless the hips are seriously involved."
        text: |
          - الكورس متغيّر، و remissions و relapses كتير.
          - أحيانًا الـ spine كله يلحم.
          - **أقل من 10%** بيعجزوا.
          - الـ prognosis كويس ==إلا لو الـ hips اتأثرت جامد==.

          يعني المرض بيروح وييجي، علشان كده المتابعة بالـ activity scores (BASDAI، ASDAS) مش بقياس مرة واحدة.
      - kind: reveal
        page: 285
        quote: "In general the functional prognosis is good unless the hips are seriously involved."
        prompt: "عيان AS ضهره كله لحم، والكتاب برضه بيقول الـ prognosis كويس. ليه الـ hips هي اللي بتقلب الصورة؟"
        answer: |
          التفسير المقبول (مش في الكتاب): العمود الملحوم بيقلّل المرونة، بس العيان لسه يقدر يمشي ويقعد ويشتغل. الـ **hip** مفصل الشيل الأساسي؛ لو اتهدّ أو اتلحم، المشي نفسه يقف.

          علشان كده الكتاب بيقول الـ functional prognosis ==good unless the hips are seriously involved==، و **أقل من 10%** بس بيعجزوا. وعلشان كده الـ **total hip replacement** هي أول جراحة في علاج الـ AS (ص 292).
      - kind: explain
        page: 285
        title: "الـ DDx والتحاليل"
        quote: "Diffuse idiopathic skeletal hyperostosis (DISH syndrome /Forestier's disease): is a proliferative form of osteoarthritis can mimic AS but lacks apophyseal and sacroiliac involvement."
        text: |
          **Differential diagnosis (DDx)**: أسباب تانية للـ low back pain، باقي الـ spondyloarthritis (SpA)، degenerative disease، **diffuse idiopathic skeletal hyperostosis (DISH)** (Forestier)، وأسباب تانية للـ sacroiliitis.

          الـ ==DISH== = proliferative Osteoarthritis (OA) يقلّد الـ AS، بس ==مفيش sacroiliac ولا apophyseal==.

          **التحاليل**: HLA-B27 في 90-95%، erythrocyte sedimentation rate (ESR) و C-reactive protein (CRP) عاليين غالبًا، anaemia خفيفة في الحالات الشديدة، و **calprotectin** يطلّع اللي عندهم risk عالي للـ inflammatory bowel disease (IBD).

          ليه الـ calprotectin؟ لأن الـ gut inflammation موجود في 60% (ص 282). والتفسير المقبول (مش في الكتاب): الـ calprotectin بروتين بيطلع من الـ neutrophils في الأمعاء الملتهبة.
      - kind: reveal
        page: 285
        quote: "Diffuse idiopathic skeletal hyperostosis (DISH syndrome /Forestier‘s disease): is a proliferative form of osteoarthritis can mimic AS but lacks apophyseal and sacroiliac involvement."
        prompt: "راجل عنده 65 سنة، ضهره ناشف، والـ X-ray فيه عضم كتير على الفقرات. إزاي تفرّق الـ DISH من الـ AS؟"
        answer: |
          الكتاب: الـ ==DISH== proliferative OA **بيقلّد** الـ AS، بس ==lacks apophyseal and sacroiliac involvement==.

          يعني بص على الـ **sacroiliac**: في الـ AS هو أول حاجة بتتصاب (symmetrical، bilateral). في الـ DISH سليم.

          التفسير المقبول (مش في الكتاب): الـ DISH عضم بيترسّب على الأربطة من غير التهاب، فمفيش inflammatory back pain، ومفيش CRP عالي، والعيان أكبر سنًا بكتير من الـ 20–30 بتوع الـ AS.
      - kind: check
        page: 285
        quote: "Calprotectin: could be used to identify patients with AS at high risk of developing IBD."
        question: "Which laboratory test does the book suggest to pick out AS patients at high risk of IBD?"
        options: ["Calprotectin", "HLA-B27", "Anti-CCP", "Serum amylase"]
        answer: 0
        why:
