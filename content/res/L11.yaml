  - id: res.L11.075
    kind: mcq
    topic: calculation
    stem: >-
      In the slide's StatCalc survey (population 100,000, expected 30%, 95% confidence), the margin of error is changed
      from 5% to 3%. What happens to the sample size?
    options: ["It rises from 322 to 888", "It falls from 888 to 322", "It stays 322", "It rises from 322 to 554"]
    answer: 0
    why:
      - A narrower margin needs a bigger sample; n goes with 1/d², so 322 becomes 888.
      - A smaller margin never needs fewer people.
      - The margin of error is in the formula's denominator, so n must change.
      - 554 is the 99% confidence row with a 5% margin.
