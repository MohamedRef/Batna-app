    pass: 5
    hook: "سكر واطي وكيتون: «مش بياكل» (starvation، vomiting، dieting، depression وanhedonia)، «حامل»، و«الجلايكوجين مش موجود» (glycogen storage disorders، cirrhosis). 4 + 1 + 2 = 7."
    src: { page: 199, quote: "Causes of Euglycemic Ketoacidosis\nAs a result of decreased circulating glucose concentration\n  1. Starvation\n  2. Vomiting (ketoacidosis, gastroparesis)\n  3. Intentional dieting\n  4. Depression, anhedonia\n  5. Pregnancy\n  6. Glycogen storage disorders\n  7. Cirrhosis" }
    status: unverified
  - id: dm.L16.007
    kind: enumerate
    topic: eudka
    prompt: Give the differential diagnosis of acidosis in a patient with diabetes, other than DKA.
    points:
      - Prolonged starvation
      - Excess alcohol
      - Salicylate overdose
      - Lactic acidosis
      - Tricyclic antidepressant overdose
      - Renal tubular acidosis
    pass: 5
    hook: "الحموضة مش DKA: «جوع، خمرة، 2 overdose، لاكتيك، وكلية» = prolonged starvation، alcohol، salicylate overdose، tricyclic overdose، lactic acidosis، وRTA."
    src: { page: 199, quote: "Differential diagnoses include: prolonged starvation, excess alcohol consumption, salicylate overdose, lactic acidosis, tricyclic antidepressant overdose, & renal tubular acidosis." }
    status: unverified
  - id: dm.L16.008
    kind: card
    topic: eudka
    front: A patient with T1DM has nausea and vomiting but a normal glucose. What must still be done?
    back: Assess acid-base status; life-threatening ketoacidosis may still be present.
    src: { page: 200, quote: "Patients with T1DM presenting with nausea & vomiting & found to have a normal glucose may still have life-threatening ketoacidosis, & an assessment of their acid/base status is still indicated." }
    status: unverified
    tags: [high-yield]
  - id: dm.L16.009
    kind: mcq
    topic: eudka
    stem: "In Case 1 (T1DM, vomiting, glucose 105, pH 7.3, HCO3 10, Na 134, K 5.7, Cl 101), the anion gap is reported as 29. How is that figure obtained?"
    options:
      - Na + K − (Cl + HCO3) = 134 + 5.7 − 111 ≈ 29
      - Na − (Cl + HCO3) = 134 − 111 = 23 (the usual formula)
      - Na − Cl = 33
      - Cl − HCO3 = 91
      - 2 × Na + glucose/18 = 274
    answer: 0
    why:
      - Including potassium gives 28.7, about 29, as the book reports.
      - Without potassium the gap is 23; still high, but not the book's figure.
      - That ignores bicarbonate.
      - That is not an anion gap.
      - That is the effective osmolality.
    src: { page: 197, quote: "Laboratory investigations\n  1. Plasma Glucose = 105 mg/dl\n  2. Metabolic acidosis with a pH of 7.3\n  3. Bicarbonate = 10 mEq/l\n  4. Anion gap = 29 mEq/l\n  5. Na+=134 mEq/l, K+=5.7 mEq/l, Cl-=101 mEq/l\n  6. BUN=9.5 mg/dl, Creatinine=0.98 mg/dl\n  7. Urine analysis: Ketone (4+), no glucosuria\n  8. Amylase = 104 IU/l (normal: <150 IU/l)\n  9. Lactate =1.1 mmol/l (normal: 0.5–2.2mmol/l).\n  10. Blood salicylate, alcohol, & methanol levels were all undetectable." }
    status: unverified
  - id: dm.L16.010
    kind: mcq
    topic: eudka
    stem: A 25-year-old with T1DM has had gastroenteritis for 3 days and kept taking full basal insulin while barely eating. Glucose is 140 mg/dL, urine ketones 3+. What is the best next step?
    options:
      - Blood gas and ketones to assess acid-base status
      - Reassure her; the glucose is normal, so this is not DKA
      - Stop insulin until she eats again
      - Give glucagon
      - Repeat glucose in 24 h
    answer: 0
    why:
      - A normal glucose does not exclude life-threatening ketoacidosis; acid-base status is still indicated.
      - Euglycemic DKA is exactly this picture.
      - Stopping insulin worsens ketogenesis.
      - Glucagon raises glucose and does not address ketoacidosis.
      - Delay risks missing a dangerous acidosis.
    src: { page: 200, quote: "Patients with T1DM presenting with nausea & vomiting & found to have a normal glucose may still have life-threatening ketoacidosis, & an assessment of their acid/base status is still indicated." }
    status: unverified
  # ---------- Case 2, p200-202: excipients ----------
  - id: dm.L16.011
    kind: case
    topic: excipients
    stem: A 6-year-old boy with T1DM gets a cold with mild fever. A GP diagnoses acute sinusitis and prescribes paracetamol, chlorpheniramine and amoxicillin/clavulanate syrups at usual doses.
    steps:
      - reveal: "Day 3: nausea, vomiting, weak rapid pulse, deep sighing breaths, drowsiness, unsteady gait. Glucose 440 mg/dL, pH 7.12, HCO3 12.6, urine ketones positive, WBC 15,200."
        question: Diagnosis?
        options: [DKA, HHS, Hypoglycemia, Meningitis]
        answer: 0
        why: Hyperglycemia, ketonuria and acidosis with Kussmaul breathing.
      - question: What does the lecture blame for his DKA?
        options: ["About 90 g/day of sucrose in the syrup bases of all three drugs", "Chlorpheniramine toxicity from the cough syrup", "Amoxicillin allergy", "Paracetamol hepatotoxicity raising glucose"]
        answer: 0
        why: The high sugar base in all three syrups went unnoticed by the prescriber and pharmacist.
      - question: Which other precipitant cannot be ruled out?
        options: [The acute infective sinusitis itself, Insulin overdose, Dehydration from diuretics, SGLT2 inhibitors]
        answer: 0
        why: Infection is itself a diabetic ketoacidosis (DKA) precipitant.
    src: { page: 201, quote: "High sugar base in all 3 formulations went unnoticed by the practitioner & the dispensing pharmacist." }
    status: unverified
    tags: [high-yield]
  - id: dm.L16.012
    kind: cloze
    topic: excipients
    text: In Case 2 the three syrups together gave about {{c1::90 g/day}} of sucrose, which raised the child's glucose into {{c2::DKA}}.
    src: { page: 201, quote: "Total sucrose content (including relative sugars) of ~90 g/day in the form of syrup base." }
    status: unverified
    tags: [numbers]
  - id: dm.L16.013
    kind: card
    topic: excipients
    front: What are excipients?
    back: The therapeutically inactive ingredients of a medicine, which turn an active compound into a usable pharmaceutical product.
    src: { page: 201, quote: "It is well known that most medicines contain both pharmacologically active & inactive ingredients. Therapeutically inactive ingredients of a medicine are known as excipients." }
    status: unverified
  - id: dm.L16.014
    kind: card
    topic: excipients
    front: Name functional classes of excipients.
    back: Binders, diluents, disintegrants, lubricants, wetting agents, solvents, fillers, emulsifiers, absorption enhancers, sustained-release matrices, preservatives, sweeteners, and stabilizing, coloring or flavoring agents.
    src: { page: 201, quote: "The excipients are divided into various functional classifications, depending on the purpose of use, such as binders, diluents, disintegrants, lubricants, wetting agents, solvents, fillers, emulsifiers, absorption enhancers, sustained release matrices, preservatives, sweeteners, & stabilizing, coloring, or flavoring agents." }
    status: unverified
  - id: dm.L16.015
    kind: card
    topic: excipients
    front: What lesson does Case 2 teach about prescribing for patients with diabetes?
    back: Excipients are assumed inactive and safe, but that is not always correct; take a proper history and check the formulation's active and inactive ingredients (such as sugar in syrups).
    src: { page: 202, quote: "11. It is generally assumed that excipients are pharmacologically inactive & are deemed safe in patients .\n12. This assumption, however, may not always be correct & needs careful observation.\n13. It becomes crucial while dealing with a patient/guardian to collect a proper patient history for choosing the appropriate drug along with its therapeutic ingredient & pharmaceutical excipient." }
    status: unverified
  # ---------- Case 3, p202-205: HHS in a child ----------
  - id: dm.L16.016
    kind: case
    topic: child-hhs
    stem: A 7-year-old boy has a week of polyuria, polydipsia, weight loss, nocturnal enuresis and reduced activity, 4 weeks after a viral infection. No family history of diabetes.
    steps:
      - reveal: "GCS 13/15, HR 150, RR 30, BP 105/85, severely dehydrated, BMI 10, no acanthosis nigricans. Glucose 954 mg/dL, corrected Na 152, K 4.2, BUN 62, creatinine 2.3, osmolality 412 mOsm/kg, pH 7.21, HCO3 19.8; urine glucose 3+, no ketones."
        question: Diagnosis?
        options: [Hyperglycemic hyperosmolar syndrome, Severe DKA, Diabetes insipidus, Acute kidney injury only]
        answer: 0
        why: Glucose >600, osmolality 412 and no ketones with only mild acidosis.
      - question: Which insulin infusion rate does the lecture recommend in pediatric HHS?
        options: [0.1 units/kg/h, 0.05 units/kg/h, 1 unit/kg/h, No insulin]
        answer: 0
        why: Management of pediatric hyperosmolar hyperglycaemic state (HHS) is the same as DKA, with 0.1 units/kg/h.
      - question: Which fluids?
        options: ["0.9% saline first, then 0.45-0.75% saline", "5% dextrose first, then saline", "Hypertonic 3% saline first", "Oral fluids only"]
        answer: 0
        why: Isotonic saline (hypotonic for these patients) first, then 0.45-0.75% saline.
      - question: When is dextrose added?
        options: [When glucose drops to 300 mg/dL, From the start, When glucose is 100 mg/dL, Never]
        answer: 0
        why: At 300 mg/dL, to avoid an overly precipitous fall in glucose.
    src: { page: 205, quote: "Management of HHS in pediatrics is the same for DKA; exogenous insulin infusion at a rate of 0.1 U/kg/h is recommended." }
    status: unverified
    tags: [high-yield]
  - id: dm.L16.017
    kind: cloze
    topic: child-hhs
    text: "Case 3 discussion: HHS is characterized by glucose >{{c1::600}} mg/dL, osmolality >{{c2::330}} mOsm/L and a mild metabolic acidosis (pH >{{c3::7.2}})."
    src: { page: 203, quote: "Discussion\n  1. HHS is characterized by hyperglycemia more than 600 mg/dL, hyper osmolality more than 330 mOsm/L, & a mild metabolic acidosis (pH>7.2).\n  2. HHS classically occurs in patients with T2DM, but there are increased reports in T1DM.\n  3. DKA has a mortality rate below 1% in pediatrics with a good prognosis." }
    status: unverified
    tags: [numbers]
  - id: dm.L16.018
    kind: cloze
    topic: child-hhs
    text: In children, DKA mortality is below {{c1::1%}}, but reported HHS mortality is about {{c2::10-35%}}.
    src: { page: 204, quote: "Recent reports suggest high mortality rates in children with HHS (~10-35%)." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L16.019
    kind: card
    topic: child-hhs
    front: What are the most serious complications of both HHS and DKA?
    back: Cerebral edema and acute respiratory distress syndrome (ARDS).
    src: { page: 204, quote: "The most serious complications of both HHS & DKA are cerebral edema & ARDS." }
    status: unverified
    tags: [high-yield]
  - id: dm.L16.020
    kind: card
    topic: child-hhs
    front: What features do most children with HHS share?
    back: Obese African-American boys with a family history of type 2 diabetes mellitus (T2DM) and acanthosis nigricans; most are later diagnosed with T2DM.
    src: { page: 204, quote: "6. Children with HHS share common features; the majority of children are obese males of African-American ethnicity.\n7. Most of the children had a family history of T2DM & had acanthosis nigricans on physical examination.\n8. The majority of children were subsequently diagnosed with T2DM, which explains the increasing number of HHS reports in the pediatric literature may be due to the rising prevalence of obesity & T2DM in children." }
    status: unverified
  - id: dm.L16.021
    kind: card
    topic: child-hhs
    front: Why are pediatric HHS reports increasing?
    back: The rising prevalence of obesity and T2DM in children. HHS can still occur in T1DM, with the same pathophysiology.
    src: { page: 204, quote: "The majority of children were subsequently diagnosed with T2DM, which explains the increasing number of HHS reports in the pediatric literature may be due to the rising prevalence of obesity & T2DM in children." }
    status: unverified
  - id: dm.L16.022
    kind: enumerate
    topic: child-hhs
    prompt: Enumerate the precipitating factors for HHS listed in Case 3.
    points:
      - "Infections: gram-negative pneumonia, UTI, sepsis"
      - Medications
      - Poor compliance
      - Undiagnosed diabetes
      - Substance abuse
