lessons:
  # ------------------------------------------------------------------
  - id: hem.L07.lesson1
    title: "النخاع اتحتل: يعني إيه acute leukemia؟"
    hook: "خلية واحدة صغيرة نسيت تكبر، وقررت تتكاثر لحد ما تطرد الكل من البيت."
    minutes: 8
    pages: [104, 106]
    topics: [definition, etiology, incidence]
    goals:
      - "تعرّف الـ acute leukemia وتفهم ليه الـ counts بتقع"
      - "تعدّ الـ etiology الأربعة بأمثلتها"
      - "تحفظ أرقام الـ incidence وتفهم آليتين للـ pancytopenia"
    status: unverified
    steps:
      - kind: explain
        page: 104
        title: "الخلية اللي رفضت تكبر"
        quote: "Acute leukemia is the result of a malignant events, occurring in an early hematpoietic precursor"
        text: |
          الـ **acute leukemia** بتبدأ بـ ==malignant event== في **early hematopoietic precursor**.

          الخلية دي المفروض تـ differentiate وتبقى RBC أو neutrophil أو platelet. بدل كده بتفضل **تتكاثر من غير كنترول** وهي لسه صغيرة.

          النتيجة: خلايا immature اسمها ==blasts== بتتراكم بسرعة وتحتل النخاع، فإنتاج الـ RBCs والـ WBCs والـ platelets الطبيعي يقع.
      - kind: figure
        page: 104
        quote: "immature cells often called blasts, rapidly accuumalate and replace the bone marrow"
        title: "النخاع قبل وبعد"
        alt: "Two marrow panels stacked. The top panel shows a normal marrow with mixed red cells, neutrophils and platelets coming out. The bottom panel shows a marrow packed with blasts and only a few normal cells, with arrows to anemia, infection and bleeding."
        caption: "الـ blasts بتملا النخاع، فالمصنع الطبيعي يقفل: ==anemia== وinfection وbleeding."
        svg: |
          <svg viewBox="0 0 330 320" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L07a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <text x="165" y="18" text-anchor="middle" class="t-sm t-b">Normal marrow</text>
            <rect x="20" y="26" width="290" height="110" rx="12" class="fg-good"/>
            <circle cx="60" cy="60" r="10" class="fg-dot-bad"/>
            <circle cx="95" cy="95" r="10" class="fg-dot-acc"/>
            <circle cx="130" cy="58" r="6" class="fg-dot-good"/>
            <circle cx="170" cy="100" r="10" class="fg-dot-bad"/>
            <circle cx="205" cy="62" r="10" class="fg-dot-acc"/>
            <circle cx="245" cy="98" r="6" class="fg-dot-good"/>
            <circle cx="275" cy="60" r="10" class="fg-dot-bad"/>
            <text x="165" y="128" text-anchor="middle" class="t-sm t-mut">RBC · WBC · platelets</text>
            <text x="165" y="168" text-anchor="middle" class="t-sm t-b">Acute leukemia</text>
            <rect x="20" y="176" width="290" height="96" rx="12" class="fg-bad"/>
            <g class="fg-box">
              <circle cx="50" cy="205" r="13"/><circle cx="85" cy="205" r="13"/><circle cx="120" cy="205" r="13"/><circle cx="155" cy="205" r="13"/><circle cx="190" cy="205" r="13"/><circle cx="225" cy="205" r="13"/><circle cx="260" cy="205" r="13"/>
              <circle cx="67" cy="240" r="13"/><circle cx="102" cy="240" r="13"/><circle cx="137" cy="240" r="13"/><circle cx="207" cy="240" r="13"/><circle cx="242" cy="240" r="13"/><circle cx="282" cy="240" r="13"/>
            </g>
            <circle cx="172" cy="240" r="6" class="fg-dot-good"/>
            <text x="165" y="266" text-anchor="middle" class="t-sm t-bad t-b">blasts everywhere</text>
            <path d="M70 276 L50 296" class="fg-arrow" marker-end="url(#L07a)"/>
            <path d="M165 276 L165 296" class="fg-arrow" marker-end="url(#L07a)"/>
            <path d="M260 276 L280 296" class="fg-arrow" marker-end="url(#L07a)"/>
            <text x="45" y="312" text-anchor="middle" class="t-sm">Anemia</text>
            <text x="165" y="312" text-anchor="middle" class="t-sm">Infection</text>
            <text x="285" y="312" text-anchor="middle" class="t-sm">Bleeding</text>
          </svg>
      - kind: mnemonic
        page: 104
        quote: "Ionizing radiation is leukemogenic"
        word: "RVGC"
        parts:
          - { key: "R", text: "Radiation: ionizing (ankylosing spondylitis radiotherapy, atomic bomb)" }
          - { key: "V", text: "Viruses: HTLV-1 → adult T-cell leukemia" }
          - { key: "G", text: "Genetic and congenital: Fanconi, ataxia telangiectasia, Down, X-linked agammaglobulinemia" }
          - { key: "C", text: "Chemicals: benzene, alkylating agents" }
        hook: "**R**ed **V**ery **G**ood **C**ells... بس للأسف مش good خالص."
      - kind: explain
        page: 104
        title: "الإشعاع: مين يتأذي أكتر؟"
        quote: "Greater risk results from higher dose radiation delivered over shorter periods to younger patients."
        text: |
          الـ **ionizing radiation** بتزوّد **ALL** و **AML** و **CML**، واتشاف ده في:
          - عيانين اتعالجوا بـ radiotherapy للـ **ankylosing spondylitis**
          - الناجين من **القنبلة الذرية**

          والخطر بيزيد مع ==higher dose== على **مدة أقصر** في **عيان أصغر**. وفيه قلق كمان من الـ low-frequency **non-ionizing electromagnetic fields**.
      - kind: check
        page: 104
        quote: "Human T cell lymphotropic virus type 1 (HTLV-1) is considered the causative agent of adult T-cell leukemia."
        question: "Adult T-cell leukemia in a patient from the Caribbean is caused by:"
        options:
          - "HTLV-1"
          - "Benzene"
          - "EBV"
          - "Ionizing radiation"
        answer: 0
        why:
          - "صح: الـ HTLV-1 هو السبب، وموجود في الـ Caribbean basin وأفريقيا."
          - "الـ benzene بيعمل marrow hypoplasia ممكن تتحول acute leukemia، مش T-cell leukemia بالذات."
          - "الـ EBV بيعمل infectious mononucleosis اللي ممكن تتلخبط مع ALL."
          - "الإشعاع بيزوّد ALL وAML وCML."
      - kind: explain
        page: 105
        title: "الجينات والكيماويات"
        quote: "Several autosomal recessive disorders associated with chromosomal instability are prone to terminate in acute leukemia including fanconi anemia and ataxia telangiectasia."
        text: |
          - **Fanconi anemia** و **ataxia telangiectasia**: autosomal recessive وفيهم ==chromosomal instability==، فالـ DNA بيتكسر بسهولة وتطلع leukemia.
          - **Down syndrome** و **infantile X-linked agammaglobulinemia**: incidence أعلى.
          - **Benzene** (شغل المصانع) ← marrow hypoplasia ← أحيانًا acute leukemia.
          - ==Alkylating agents== (chlorambucil، melphalan، nitrogen mustard) ← **AML**.
      - kind: aside
        tone: exam
        page: 105
        quote: "Prior exposure to alkylating agents such as cholramboucil, melphalan and nitrogen mustard is associated with an increased risk of AML."
        text: "سؤال كلاسيكي: عيان myeloma خد **melphalan** من سنين وجاله leukemia. الإجابة **AML**، مش CLL ومش ALL."
      - kind: table
        page: 105
        quote: "the relative incidence for the four categories of leukemia are as follows ALL 11%, CLL 29%, AML 46%, and CML 14%"
        title: "مين الأكتر؟ (من كل الـ leukemias)"
        columns: [Leukemia, Share]
        rows:
          - [AML, "46%"]
          - [CLL, "29%"]
          - [CML, "14%"]
          - [ALL, "11%"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: tip
        page: 105
        quote: "ALL is the most common cancer and the second leading cause of death in children under 15 years of age."
        text: |
          الـ incidence الكلي **8–10 per 100,000** في السنة.

          الـ ALL أقل واحدة في الكبار (11%)، بس هي ==most common cancer== في الأطفال تحت 15 سنة وتاني سبب وفاة عندهم. علشان كده تأثيرها كبير.
      - kind: reveal
        page: 106
        quote: "marrow failure is not simply due to physical replacement of the marrow but also due to leukemia inhibitory substances released by malignant cells"
        prompt: "لو الـ pancytopenia سببها إن الـ blasts خدت مكان الخلايا بس، يبقى النخاع لازم يبقى hypercellular. طب ليه فيه عيانين نخاعهم hypocellular؟"
        answer: |
          لأن الـ marrow failure مش بس **physical replacement**.

          الخلايا الخبيثة كمان بتفرز ==leukemia inhibitory substances== بتكتم النخاع الطبيعي. فممكن تلاقي pancytopenia ونخاع فاضي نسبيًا.
      - kind: try
        items: [hem.L07.001, hem.L07.003, hem.L07.005, hem.L07.013, hem.L07.017]
    recap:
      - "Acute leukemia = early precursor بيتكاثر من غير ما يكبر، والـ blasts بتحتل النخاع."
      - "الأسباب **RVGC**: Radiation، Virus (HTLV-1)، Genetic، Chemicals."
      - "Alkylating agents ← AML. Benzene ← hypoplasia ثم leukemia."
      - "AML 46%، CLL 29%، CML 14%، ALL 11%؛ ALL أشهر cancer في الأطفال."
      - "Pancytopenia = replacement + inhibitory substances."
    practice: [hem.L07.001, hem.L07.002, hem.L07.003, hem.L07.004, hem.L07.005, hem.L07.006, hem.L07.007, hem.L07.008, hem.L07.009, hem.L07.010, hem.L07.011, hem.L07.012, hem.L07.013, hem.L07.014, hem.L07.015, hem.L07.016, hem.L07.017, hem.L07.094, hem.L07.095, hem.L07.104]
