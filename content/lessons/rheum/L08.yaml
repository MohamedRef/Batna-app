  - id: rheum.L08.lesson3
    title: "الكبار: GCA و PMR"
    hook: "ست 70 سنة بصداع جديد ووجع في الفك وهي بتاكل. لو استنيت، ممكن تصحى عمية."
    minutes: 10
    pages: [131, 134]
    topics: [gca, pmr]
    goals:
      - "تعرف صورة الـ GCA وتفهم كل علامة منين"
      - "تحسب الـ GCA score وتعرف تاخد الـ biopsy صح"
      - "تعرف الـ PMR والـ score بتاعها والـ DD"
    status: unverified
    steps:
      - kind: explain
        page: 131
        title: "GCA: systemic و local"
        quote: "Polymyalgia Rheumatica. Temporal Headache. Fever. Blindness. Anorexia. Scalp Necrosis. Malaise. Jaw Claudication. Veight Loss. Cranial and Peripheral. Elevated ESR. Neuropathies. Abnormal Liver Function. Rare Organ Involvement. Anemia."
        text: |
          - **Systemic:** ==polymyalgia rheumatica==، fever، anorexia، malaise، weight loss، **erythrocyte sedimentation rate (ESR) عالي**، abnormal liver function tests (LFTs)، anaemia
          - **Local:** **temporal headache**، ==blindness==، scalp necrosis، **jaw claudication**، cranial و peripheral neuropathies

          المنطق: الشريان اللي بيغذي الجلد والفك والعين ضاق، فكل حاجة بيغذيها تشتكي.
      - kind: reveal
        page: 131
        quote: "Jaw Claudication."
        prompt: "ليه الـ jaw claudication علامة قوية للـ GCA، وليه الـ blindness هي الخوف الأكبر؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ GCA بيمسك فروع الـ **carotid**: الشريان اللي بيغذي **عضلات المضغ**، و الـ **temporal artery**، والشريان اللي بيغذي **العين**.
          - **Jaw claudication**: عضلة المضغ بتشتغل ← تحتاج دم ← الشريان الضيق مش مكفّي ← وجع **بعد** ما تبدأ تاكل وبيروح لما توقف. ده نادر في أي صداع تاني، فبيخلّي الـ GCA قريب جدًا.
          - **Blindness**: لو شريان العين اتسد، العصب البصري **بيموت ومش بيرجع**. عشان كده بنبدأ steroids فورًا من غير ما نستنى الـ biopsy.
      - kind: figure
        page: 132
        quote: "Giant cell arteritis: retinal ischemia"
        title: "الـ GCA في قاع العين"
        image: { file: rheum/L08-gca-retina.webp, book: true }
        marks:
          - { at: [0.42, 0.48], label: "Pale swollen disc", kind: arrow }
          - { at: [0.72, 0.42], label: "Ischaemic patches", kind: box, size: [0.3, 0.45] }
        alt: "Two fundus photographs side by side. Left: a pale, swollen, yellowish optic disc at the right edge of the fundus. Right: several fluffy white patches scattered around the optic disc."
        caption: |
          صورتين لقاع العين:

          - **شمال**: الـ ==optic disc== (1) باهت ومنفوخ: العصب البصري ما وصلهوش دم.
          - **يمين**: بقع بيضا منفوشة حوالين الـ disc (2): دي حتت من الشبكية ماتت من نقص الدم: **retinal ischemia**.

          يعني الـ **blindness** في الـ GCA مش التهاب في العين نفسها؛ ده شريان ضيق مش موصّل دم. عشان كده الـ steroids فورًا.
      - kind: figure
        page: 132
        quote: "Giant cell arteritis: forehead"
        title: "الـ temporal artery من بره"
        image: { file: rheum/L08-gca-forehead.webp, book: true }
        marks:
          - { at: [0.6, 0.35], label: "Temporal artery", kind: arrow }
        alt: "Side view of an older man's temple and forehead: a thick, tortuous, raised cord runs up across the temple above the eyebrow."
        caption: |
          وش راجل كبير من الجنب: الحبل الملتوي المنفوخ (1) اللي طالع على الصدغ ده ==الـ temporal artery== نفسه.

          ده اللي الـ GCA score بيدّيله لحد **2 points** (abnormal temporal artery: enlarged، pulseless أو tender). ومنه بتاخد الـ **biopsy**.
      - kind: figure
        page: 131
        quote: "In the presence of 3 points or more out of 11 with at least one point belonging to domain I along with all entry criteria, the diagnosis of Giant cell arteritis can be established."
        title: "عدّاد الـ GCA score"
        alt: "A scoring board. Entry: age 50 or more and no exclusion criteria. Domain I items: headache 1, visual disturbance 1, PMR 2, jaw claudication 1, abnormal temporal artery up to 2. Domain II: fever or anaemia 1, ESR 50 or more 1, pathology up to 2. A bar at the bottom marks 3 of 11 as the threshold with at least one domain I point."
        caption: "لازم **age ≥50** ومفيش exclusion، وبعدين ==≥3 من 11== ومنهم نقطة على الأقل من **Domain I**."
        svg: |
          <svg viewBox="0 0 330 350" xmlns="http://www.w3.org/2000/svg">
            <rect x="15" y="10" width="300" height="40" rx="8" class="fg-thin"/>
            <text x="165" y="35" text-anchor="middle" class="t-sm t-b">Entry: age ≥50 + no exclusion criteria</text>
            <rect x="15" y="62" width="300" height="140" rx="10" class="fg-acc"/>
            <text x="25" y="82" class="t-sm t-b t-acc">Domain I (clinical)</text>
            <text x="25" y="104" class="t-sm">New localized headache</text><text x="300" y="104" text-anchor="end" class="t-sm t-b">1</text>
            <text x="25" y="124" class="t-sm">Sudden visual disturbance</text><text x="300" y="124" text-anchor="end" class="t-sm t-b">1</text>
            <text x="25" y="144" class="t-sm">Polymyalgia rheumatica</text><text x="300" y="144" text-anchor="end" class="t-sm t-b">2</text>
            <text x="25" y="164" class="t-sm">Jaw claudication</text><text x="300" y="164" text-anchor="end" class="t-sm t-b">1</text>
            <text x="25" y="184" class="t-sm">Abnormal temporal artery</text><text x="300" y="184" text-anchor="end" class="t-sm t-b">≤2</text>
            <rect x="15" y="212" width="300" height="80" rx="10" class="fg-good"/>
            <text x="25" y="232" class="t-sm t-b t-good">Domain II (lab, pathology)</text>
            <text x="25" y="252" class="t-sm">Fever and/or anaemia (not with PMR)</text><text x="300" y="252" text-anchor="end" class="t-sm t-b">1</text>
            <text x="25" y="270" class="t-sm">ESR ≥50 mm/h</text><text x="300" y="270" text-anchor="end" class="t-sm t-b">1</text>
            <text x="25" y="288" class="t-sm">Compatible pathology</text><text x="300" y="288" text-anchor="end" class="t-sm t-b">≤2</text>
            <rect x="15" y="302" width="300" height="38" rx="8" class="fg-bad"/>
            <text x="165" y="326" text-anchor="middle" class="t-sm t-b">GCA: ≥3 of 11, with ≥1 from Domain I</text>
          </svg>
      - kind: check
        page: 131
        quote: "N/A Age at onset ≥50 years old Absence of exclusion criteria Domain I 1 New onset localized headaches 1p 1 Sudden onset of visual disturbances 1p 2 Polymyalgia Rheumatica (PMR) 2p 1 Jaw Claudication 1p 2 Abnormal temporal artery up to 2p Domain II 1 Unexplained fever and/or anaemia 1p 1 ESR ≥50 mm/hour 1p 2 Compatible pathology up to 2p"
        question: "Age 70, new headache (1), PMR (2), ESR 60. No exclusions. GCA score and verdict?"
        options:
          - "4: GCA established"
          - "3: GCA established"
          - "2: not yet"
          - "5: GCA established"
        answer: 0
        why:
          - "صح: headache 1 + polymyalgia rheumatica (PMR) 2 + ESR ≥50 = 1 → 4، ومنهم نقط من Domain I."
          - "نسيت نقطة: الـ PMR بـ 2 مش 1."
          - "فاتك الـ ESR والـ PMR."
          - "مفيش jaw claudication أو artery points هنا."
      - kind: aside
        tone: trap
        page: 132
        quote: "E It must be ignored in the presence of PMR."
        text: |
          نقطة **fever and/or anaemia** ==بتتلغي لو فيه polymyalgia rheumatica (PMR)==: الـ PMR نفسها بتعمل الحاجات دي، فما ينفعش تعدّها مرتين.
      - kind: explain
        page: 131
        title: "الـ exclusion criteria: ليه دول بالذات؟"
        quote: "Exclusion criteria are including: ENT and eye inflammation, kidney, skin"
        text: |
          الـ GCA score بيتلغي لو فيه حاجة من الـ **exclusion criteria**: ENT و eye inflammation، **kidney**، **skin**، **peripheral nervous system**، lung infiltration، lymphadenopathy، stiff neck، و digital gangrene أو ulceration. وشرط كمان: **مفيش سبب تاني** يفسّر أي criterion.

          التفسير المقبول (مش في الكتاب): دي كلها علامات **أمراض تانية** شبهها:
          - الكلية والجلد والأعصاب الطرفية = **small/medium vessel** (AAV أو PAN)، والـ GCA large vessel.
          - الـ ENT والعين الملتهبة = **GPA** غالبًا.
          - الـ stiff neck = **meningitis**.

          يعني الـ exclusions بتتأكد إن الصداع والـ ESR العالي مش جايين من vasculitis تاني.
      - kind: explain
        remind: [rheum.L08.055]
        page: 132
        title: "الـ biopsy صح"
        quote: "Biopsy in Temporal arteritis\n  Biopsy abnormal site.\n  Occipital or facial.\n  4-6 cm. if not obviously abnormal.\n  If strong suspicion and normal biopsy, then biopsy opposite side.\n  Doppler guidance?"
        text: |
          1. خُد من **المكان الـ abnormal** (temporal، occipital أو facial)
          2. لو الشريان شكله سليم: خُد ==4–6 cm== (علشان الـ skip lesions)
          3. الشك قوي والـ biopsy سليمة؟ ==biopsy the opposite side==
          4. الـ **Doppler guidance** ممكن يساعد
      - kind: reveal
        page: 132
        quote: "If strong suspicion and normal biopsy, then biopsy opposite side."
        prompt: "ليه الـ biopsy بتاعة الـ GCA لازم تكون 4–6 cm، وليه نعيدها في الناحية التانية لو طلعت سليمة؟"
        answer: |
          بسبب اللي اتعلمته في أول المحاضرة: الإصابة ==focal and segmental== (ص 124)، يعني فيه حتت ملتهبة وحتت سليمة في نفس الشريان (skip lesions).

          - حتة قصيرة ممكن تيجي كلها من **الحتة السليمة** ← biopsy سلبية والعيان عنده GCA.
          - 4–6 cm بتزوّد فرصة إنك تمسك حتة ملتهبة.
          - ولو الشك لسه قوي، الناحية التانية فرصة جديدة.

          يعني الـ biopsy السلبية **ما بتنفيش** الـ GCA لو الصورة قوية.
      - kind: figure
        page: 133
        quote: "Giant cell arteritis: photomicrograph"
        title: "الـ biopsy تحت الميكروسكوب"
        image: { file: rheum/L08-gca-histology.webp, book: true }
        marks:
          - { at: [0.37, 0.62], label: "Narrowed lumen" }
        alt: "Photomicrograph of an artery cross-section in pink stain: a very thick wall packed with cells, with only narrow white slits left of the lumen in the middle."
        caption: |
          مقطع في الشريان تحت الميكروسكوب:

          - الجدار كله **تخين جدًا** ومليان خلايا التهاب.
          - الشقوق البيضا الضيقة (1) هي اللي **فاضل من الـ lumen**.

          يعني الالتهاب قفل الشريان من جوه، وده اللي بيجوّع العين والفك. والـ biopsy الإيجابية بتاخد لحد ==2 points== في الـ score (compatible pathology).
      - kind: explain
        page: 133
        title: "PMR: الكتف والحوض الصبح"
        quote: "Muscle Pain Persisting for at Least 1 Month:\n  Shoulders.\n  Pelvic Girdle.\nSevere Morning Stiffness and Gelling."
        text: |
          - **≥50 سنة**، غالبًا Caucasian
          - وجع في ==shoulders و pelvic girdle== (والرقبة) **≥1 month**، بداية مفاجئة
          - **Severe morning stiffness** و gelling، malaise، night sweats، low-grade fever
          - ESR و C-reactive protein (CRP) عاليين، **no pathognomonic test**، و ==no myopathy== (الـ creatine kinase (CK) عادي، العضلة نفسها سليمة)
      - kind: explain
        page: 133
        title: "ليه الـ PMR مش myositis؟"
        quote: "Severe Morning Stiffness and Gelling."
        text: |
          الـ **PMR**: وجع وتيبّس في الـ **shoulders** والـ **pelvic girdle** (والرقبة)، **≥1 month**، و ==severe morning stiffness and gelling==، والكتاب بيقول **no myopathy**.

          يعني الوجع **مش من العضلة نفسها**: الـ CK طبيعي، والعضلة مش ضعيفة. التفسير المقبول (مش في الكتاب): الالتهاب في **الأنسجة حوالين المفاصل الكبيرة** (bursae والـ synovium حوالين الكتف والورك)، فالعيان مش قادر يرفع دراعه **من الوجع والتيبس**، مش من الضعف.

          وده أهم فرق مع الـ **polymyositis** (في الـ DD): هناك العضلة ضعيفة والـ CK عالي.

          ولاحظ إن الـ **PMR** نفسها جزء من الـ systemic features بتاعة الـ GCA، وبتاخد **2 points** في الـ GCA score. عشان كده كل عيان PMR لازم تسأله عن صداع وفك ونظر.
      - kind: table
        page: 133
        quote: "Scoring Algorithm without Ultrasound – 3 required criteria:\n  Age ≥50 years, bilateral shoulder aching, abnormal ESR/CRP.\n  Optional classification criteria OR (95% CI) Points.\n  Morning stiffness >45 minutes 6.2 (3.2, 11.8) 2.\n  Hip pain or limited range of motion 2.1 (1.1, 4.0) 1.\n  Normal RF or ACPA 3.0 (1.3, 6.8) 2.\n  Absence of other joint pain 2.7 (1.4, 5.0) 1.\n  Optimal cut-off point = 4."
        title: "PMR score (من غير ultrasound)"
        columns: [Item, Points]
        rows:
          - ["Required", "Age ≥50, bilateral shoulder aching, high ESR/CRP"]
          - ["Morning stiffness >45 min", "2"]
          - ["Hip pain or limited ROM", "1"]
          - ["Normal RF or ACPA", "2"]
          - ["No other joint pain", "1"]
          - ["Cut-off", "4"]
        hide: [[1, 1], [3, 1], [5, 1]]
      - kind: aside
        tone: tip
        page: 133
        quote: "Scoring Algorithm without Ultrasound – 3 required criteria:\n  Age ≥50 years, bilateral shoulder aching, abnormal ESR/CRP.\n  Optional classification criteria OR (95% CI) Points.\n  Morning stiffness >45 minutes 6.2 (3.2, 11.8) 2.\n  Hip pain or limited range of motion 2.1 (1.1, 4.0) 1.\n  Normal RF or ACPA 3.0 (1.3, 6.8) 2.\n  Absence of other joint pain 2.7 (1.4, 5.0) 1.\n  Optimal cut-off point = 4."
        text: |
          احفظها **2-1-2-1 = 4**: stiffness 2، hip 1، **normal** rheumatoid factor (RF)/anti-citrullinated protein antibodies (ACPA) 2، مفيش مفاصل تانية 1، والـ cut-off **4**.

          الـ RF الطبيعي بياخد نقطتين لأنه بيبعدك عن **rheumatoid arthritis (RA)** اللي ممكن تبدأ بنفس الشكل في الكبار.
      - kind: explain
        page: 134
        title: "الـ DD: ليه كل واحد في القايمة؟"
        quote: "NO pathognomonic test."
        text: |
          الكتاب بيقول **NO pathognomonic test** للـ PMR، يعني التشخيص بالاستبعاد. والقايمة كلها حاجات بتعمل **وجع عضلات + ESR عالي** في كبير السن:
          - **Temporal arteritis**: بيمشي معاها، ولازم يتدوّر عليه.
          - **Rheumatoid arthritis**: ممكن يبدأ في الكبار بالكتاف، وعشان كده الـ **normal RF/ACPA** بياخد نقطتين في الـ score.
          - **Polymyositis**: بس هنا فيه ضعف و CK عالي.
          - **Occult infection** و **occult malignancy** و **multiple myeloma**: كلهم بيرفعوا الـ ESR ويعملوا وجع عام.
          - **Endocrinopathy** (زي الغدة)، **viral myalgia**، **fibrositis**، **depression**، **osteoarthritis**.

          والكتاب بيقول **concept of normal ESR debatable**: يعني ESR طبيعي **ما بينفيش** الـ PMR تمامًا.
      - kind: check
        page: 134
        quote: "No myopathy."
        question: "A 68-year-old has 6 weeks of shoulder and hip aching with 2 hours of morning stiffness and a high ESR. Which finding argues AGAINST PMR?"
        options: ["True proximal weakness with a high CK", "Normal rheumatoid factor and ACPA", "Hip pain with limited motion", "No other joints are painful"]
        answer: 0
        why:
          - "صح: الـ PMR no myopathy. ضعف حقيقي و CK عالي يوديك لـ polymyositis."
          - "الـ normal RF/ACPA بياخد 2 points لصالح الـ PMR."
          - "الـ hip pain بياخد نقطة لصالحها."
          - "غياب مفاصل تانية بياخد نقطة لصالحها."
      - kind: try
        items: [rheum.L08.046, rheum.L08.050, rheum.L08.055, rheum.L08.060, rheum.L08.193]
    recap:
      - "GCA: systemic (PMR، fever، ESR، anaemia) + local (temporal headache، blindness، scalp necrosis، jaw claudication)."
      - "Jaw claudication = ischaemia وقت المضغ؛ blindness مش بترجع ← steroids فورًا."
      - "Score: age ≥50 + مفيش exclusion + ≥3 من 11 ومنهم نقطة من domain I؛ fever/anaemia تتلغي مع PMR."
      - "Biopsy: المكان الـ abnormal، 4–6 cm، الناحية التانية لو الشك قوي (skip lesions)."
      - "PMR: ≥50، كتاف وحوض ≥1 month، morning stiffness، ESR عالي، no myopathy، no pathognomonic test."
