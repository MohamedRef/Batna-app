        question: "DAPSA = 12. Category?"
        options: ["Low", "Remission", "Moderate", "High"]
        answer: 0
        why:
          - "صح: 5–14 = low."
          - "الـ remission لحد 4."
          - "الـ moderate من 15."
          - "الـ high فوق 28."
      - kind: explain
        remind: [rheum.L20.059]
        page: 337
        title: "MDA: 5 من 7"
        quote: "Patients with PsA are considered to have MDA when they meet 5 out 7 of the following criteria:\n  Tender joint count ≤1.\n  Swollen joint count ≤1.\n  PASI ≤ 1, or body surface area (BSA) ≤3.\n  Patient pain, visual analogue scale (VAS) ≤15.\n  Patient global activity VAS ≤20.\n  Health Assessment Questionnaire (HAQ) ≤5.\n  Tender entheseal points ≤1."
        text: |
          الـ ==minimal disease activity (MDA)== بيشمل الـ remission والـ low activity كهدف مقبول، وبيتستخدم كـ responder index:

          1. Tender joints **≤ 1**
          2. Swollen joints **≤ 1**
          3. **Psoriasis Area and Severity Index (PASI) ≤ 1** أو **body surface area (BSA) ≤ 3**
          4. Pain VAS **≤ 15**
          5. Patient global VAS **≤ 20**
          6. **Health Assessment Questionnaire (HAQ) ≤ 0.5** (الكتاب كاتب ≤5)
          7. Tender entheseal points **≤ 1**

          ليه 5 من 7 مش الـ 7؟ لأن الـ PsA ليه domains كتير (جلد، entheses، مفاصل)، وصعب كلهم يبقوا صفر. الـ MDA بيقبل «كويس كفاية» في أغلبهم كهدف واقعي.
      - kind: aside
        tone: tip
