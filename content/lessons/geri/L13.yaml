  - id: geri.L13.lesson3
    title: "سلّم الألم"
    hook: "الألم أكتر عرض في الأمراض المتقدمة. والكتاب مدّيك سلّم من 3 درجات، كل درجة ليها دواء وسرعة titration."
    minutes: 7
    pages: [224, 225]
    topics: [pain]
    goals:
      - "تعرف مبادئ الـ symptom management"
      - "تطلع وتنزل على الـ World Health Organization (WHO) ladder بالأرقام"
      - "تعرف إمتى تبدأ long-acting opioid والـ adjuvants"
    status: unverified
    steps:
      - kind: explain
        page: 224
        quote: "Effective symptom management requires the evaluation and treatment of underlying etiologies, when possible; therapies specifically targeted at symptoms; and frequent reassessment after therapies are initiated."
        title: "قاعدة أي عرض"
        text: |
          1. دوّر على **السبب** وعالجه لو ينفع.
          2. علاج ==targeted== على العرض نفسه.
          3. **Reassess** كتير بعد ما تبدأ.

          و ==pain== هو **أكتر عرض** في الأمراض المتقدمة.

          ليه **reassess** كتير؟ التفسير المقبول (مش في الكتاب): الأعراض في المرض المتقدم بتتغير بسرعة. الجرعة اللي كانت كفاية امبارح ممكن ماتبقاش كفاية النهارده، أو تبدأ تعمل side effects، ومن غير إعادة تقييم مش هتعرف.
      - kind: explain
        page: 224
        quote: "Pain is the most common symptom experienced by those with advanced illness, and successful management requires three key components: routine and standardized assessment, appropriate analgesic prescribing and use of non- pharmacologic modalities; and expert management of opioid-related side effects."
        title: "تلات مفاتيح للألم"
        text: |
          - **Routine standardized assessment**: الشدة، المكان، الطبيعة، اللي بيزوّده واللي بيريّحه، بـ validated instrument.
          - **Analgesic prescribing** صح + ==nonpharmacologic== modalities.
          - إدارة ==opioid side effects== بخبرة.

          والأدوية تتاخد **standing** (بمواعيد ثابتة)، مع **rescue doses** للـ breakthrough pain.

          ليه **standing** مش «لما يوجعك»؟ التفسير المقبول (مش في الكتاب): الألم المزمن موجود طول الوقت. لو استنيته يرجع عشان تدي الجرعة، هتلاحقه بعد ما يعلى وهتحتاج جرعة أكبر. الجرعة الثابتة بتمنعه، والـ rescue بيلقط اللي بيفلت.
          وليه validated instrument؟ عشان رقم الألم هو اللي بيحدد درجة السلّم، فلازم يتقاس بنفس الطريقة كل مرة.
      - kind: explain
        page: 224
        quote: "Medications should be chosen based on patients' initial pain level, and, if pain remains uncontrolled, clinicians should advance to the next level."
        title: "تبدأ منين على السلّم؟"
        text: |
          الدوا ==بيتختار حسب الـ initial pain level== (رقم الألم في الأول)، ولو الألم فضل **uncontrolled** تطلع للـ **next level**.

          يعني مش لازم كل مريض يبدأ من تحت: واحد ألمه 8 من 10 يبدأ على طول بـ **opioid** (درجة الـ severe)، مش acetaminophen الأول وبعدين نشوف.
      - kind: figure
