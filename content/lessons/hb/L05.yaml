            <text x="236" y="378" text-anchor="middle" class="t-sm">variceal prophylaxis</text>
            <text x="236" y="396" text-anchor="middle" class="t-sm t-mut">if CSPH</text>
          </svg>
      - kind: reveal
        page: 93
        prompt: "المريض بقى cured (SVR12). ليه لسه بنعمله **HCC surveillance كل 6 شهور** لو عنده cirrhosis؟"
        answer: |
          الـ DAAs بتشيل **الفيروس**، بس مابتشيلش **الـ cirrhosis** اللي اتعملت خلاص. الكبد المتليف نفسه هو أرض الـ HCC (افتكر: HCC **mainly with cirrhosis**). وكمان الـ portal hypertension (CSPH) ماتختفيش بالـ SVR، فالـ varices لسه محتاجة prophylaxis.

          زي ما تطفي حريقة في بيت: النار طفت، بس الحيطان المحروقة لسه محتاجة كشف دوري.
      - kind: check
        page: 93
        question: "A patient with HCV cirrhosis and CSPH achieves SVR12. What follow-up does the lecture require?"
        options:
          - "HCC surveillance every 6 months and primary prophylaxis against variceal bleeding"
          - "Discharge: SVR12 means cure, no further follow-up"
          - "Repeat anti-HCV every year to confirm cure"
          - "Restart DAAs for another 12 weeks"
        answer: 0
        why:
          - "صح: الكتاب: **continued monitoring if cirrhosis is present**."
          - "الفيروس اتشال، بس الـ cirrhosis ومخاطرها لسه موجودة."
          - "الـ anti-HCV بيفضل positive بعد الشفا؛ مابيقيسش حاجة هنا."
          - "مفيش فيروس نعالجه؛ SVR12 = cure."
      - kind: explain
        page: 94
        title: "Special populations"
        text: |
          نفس الدوا، بس فيه 4 فئات الكتاب بيعدّل لهم الخطة:

          - **Decompensated cirrhosis**: محتاجة adjusted regimens. يا إما add ribavirin، يا إما ==increase the duration to 24 weeks==. الكبد هنا مافيهوش احتياطي، فبنقوّي الضربة أو نطوّلها علشان نضمن الشفا من أول مرة.
          - **Renal impairment**: الأفضل ==avoid sofosbuvir in severe CKD== واستخدم glecaprevir/pibrentasvir. لو مش متاح: sofosbuvir-containing regimens with close observation، من غير ما تغيّر جرعة الـ sofosbuvir.
          - **Ribavirin والكلى**: جرعته بتتظبط لو CrCl أقل من 50.
          - **Pregnancy**: الـ DAAs not currently approved in pregnancy or lactation.
          - **Coinfection**: treat HCV in HIV/HBV co-infection، و ==monitor HBV reactivation==.

          ليه الكلى بتفرق مع الـ sofosbuvir بالذات؟ الشرح المقبول (مش من الكتاب): الـ sofosbuvir بيخرج من الجسم عن طريق الكلى، أما glecaprevir/pibrentasvir فبيخرجوا عن طريق الكبد، فمابيتجمعوش في الفشل الكلوي.
      - kind: update
        page: 94
        text: "الـ protease-inhibitor regimens (glecaprevir/pibrentasvir، grazoprevir) ممنوعة في الـ decompensated cirrhosis (Child-Pugh B أو C) حسب الـ guidelines؛ بيستخدموا sofosbuvir/velpatasvir ± ribavirin. في الامتحان اكتب إجابة الكتاب: add ribavirin أو 24 weeks."
