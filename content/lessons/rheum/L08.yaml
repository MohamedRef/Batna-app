  - id: rheum.L08.lesson2
    title: "امتى تشك؟ وكل عضو بيشتكي إزاي"
    hook: "شاب عنده ضغط عالي، أو كبير فقد النظر في عين فجأة، أو حد صحي برجل مرخية. كلها ممكن تبقى أوعية ملتهبة."
    minutes: 10
    pages: [126, 129]
    topics: [clues, organs]
    goals:
      - "تعرف الـ red flags اللي تخليك تفكر في vasculitis وليه"
      - "تفرّق الـ cutaneous من الـ systemic vasculitis"
      - "تربط إصابة كل عضو بالمرض اللي الكتاب ربطه بيه، وتفهم السبب"
    status: unverified
    steps:
      - kind: explain
        page: 126
        title: "الـ red flags"
        quote: "Approach to Diagnosis Of Vasculitic Syndromes\n  Occlusive arterial disease or hypertension in young adults\n  Unexplained fever, weight loss.\n  Unexplained proteinuria with or without casts.\n  Splinter haemorrhages in nails, and cutaneous lesions in the form of palpable purpura, erythema."
        text: |
          فكّر في vasculitis لما تلاقي حاجة ==مش مفسّرة== أو في سن مش سنها:
          - **Occlusive arterial disease** أو **hypertension** في شاب
          - **Unexplained fever** و weight loss
          - **Proteinuria** مع أو من غير casts
          - **Splinter haemorrhages**، palpable purpura، erythema، nodules، urticaria
      - kind: explain
        page: 127
        title: "وكمان..."
        quote: "Persistent headache with sudden visual impairment (monocular blindness) in elderly."
        text: |
          - **Retinal vascular disease** فجأة من غير ضغط أو سكر
          - كبير في السن عنده **headache** و ==monocular blindness== فجأة، و **jaw claudication**
          - **Wrist drop** أو **foot drop** فجأة (mononeuritis)
          - **Stroke** أو **myocardial infarction (MI)** في شاب
          - **Pulmonary nodules** أو cavities مش مفسّرة
      - kind: reveal
        page: 127
        quote: "Sudden appearance of peripheral neuropathy - wrist drop,foot drop."
        prompt: "ليه الـ vasculitis بيعمل wrist drop أو foot drop مفاجئ في nerve واحد، مش تنميل في الإيدين والرجلين زي السكر؟"
        answer: |
          التفسير المقبول (مش في الكتاب): كل nerve ليه **شرايين صغيرة بتغذيه** (vasa nervorum). لما شريان واحد منهم يتسد، الجزء اللي بيغذيه من الـ nerve ده بالذات **يموت فجأة**، فتلاقي nerve واحد واقع: radial ← wrist drop، peroneal ← foot drop.

          ولما يتكرر في كذا nerve في أماكن مختلفة يبقى ==mononeuritis multiplex== (الكتاب بيذكرها في Nerves ص 129). أما السكر فبيأذي الأعصاب **بالتدريج ومن الأطراف**، فتلاقي glove and stocking.
      - kind: check
        page: 127
        quote: "Systemic vasculitis usually presents in individuals of 2-5th decade, the exceptions being HSP and Kawasaki disease which are common in children and Takayasu's arteritis, which is more common in young females."
        question: "Systemic vasculitis usually presents in the 2nd–5th decade. Which is NOT one of the book's exceptions?"
        options:
          - "PAN"
          - "HSP"
          - "Kawasaki disease"
          - "Takayasu arteritis"
        answer: 0
        why:
          - "صح: PAN مش من الاستثناءات."
          - "الـ HSP شائع في الأطفال: استثناء."
          - "الـ Kawasaki في الأطفال: استثناء."
          - "الـ Takayasu أكتر في الـ young females: استثناء."
      - kind: explain
        page: 127
        title: "ليه الكتاب بيستثني HSP و Kawasaki و Takayasu؟"
        quote: "Systemic vasculitis usually presents in individuals of 2-5th decade, the exceptions being HSP and Kawasaki disease which are common in children and"
        text: |
          الكتاب بيقول الـ systemic vasculitis عادة بيظهر من **العقد التاني للخامس**، ما عدا:
          - **HSP** و **Kawasaki disease**: في ==الأطفال==.
          - **Takayasu arteritis**: أكتر في **الشابات**.

          وفي نفس الوقت الـ **GCA** (هتشوفه بعد شوية) شرطه **≥50 سنة**. يعني **السن لوحده** بيقرّب لك التشخيص: طفل ببقع في رجله ووجع بطن ← فكّر HSP. طفل بسخونية 5 أيام وشفايف مشققة ← Kawasaki. بنت 25 سنة نبضها مش موجود في دراع ← Takayasu. ست 70 سنة بصداع جديد ← GCA.

          والكتاب بيقول كمان إن **pattern** الأعضاء المصابة بيساعد في تحديد الـ syndrome، وده اللي الجدول الجاي بيعمله.
      - kind: table
        page: 127
        quote: "Usual presentation is in the form of palpable purpura,urticaria, bullous ulcers or splinter haemorrhages, mainly limited to lower extremities. The salient features are:\n  Absence of systemic involvement.\n  Negative serology.\n  Small vessel leucocytoclastic vasculitis.\n  Better prognosis."
        title: "Cutaneous ضد systemic"
        columns: [Feature, Cutaneous, Systemic]
        rows:
          - ["Organs", "Skin only, legs", "Many systems"]
          - ["Serology", "Negative", "Often positive"]
          - ["Vessel", "Small, leucocytoclastic", "Any size"]
          - ["Prognosis", "Better", "Poor in general"]
        hide: [[1, 1], [2, 1], [3, 1], [3, 2]]
      - kind: reveal
        page: 127
        quote: "Small vessel leucocytoclastic vasculitis."
        prompt: "ليه الـ cutaneous vasculitis بيعمل purpura «palpable» (تحسها بإيدك)، وليه بيبقى في الرجلين أكتر؟"
        answer: |
          الكتاب بيقول إنه **small vessel leucocytoclastic vasculitis** و **mainly limited to lower extremities**.

          التفسير المقبول (مش في الكتاب):
          - **Palpable**: الـ venule الملتهب مليان **neutrophils** بتتكسر (leucocytoclastic) و **دم بيخرج** للجلد، فالبقعة **منفوخة** مش مسطحة زي purpura الـ platelets الواطية.
          - **في الرجلين**: الضغط في الأوعية هناك أعلى وأنت واقف (gravity)، فالـ immune complexes بتترسّب أكتر والدم بيسرّب أسهل.
