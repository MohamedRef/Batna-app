      - kind: explain
        page: 157
        quote: "It offers an alternative option for patients who have refractory ascites in whom TIPS and liver transplantation are contraindicated."
        title: "الـ LT والأجهزة"
        text: |
          **Liver transplantation**:
          - هو الـ definitive treatment.
          - والـ refractory ascites **exception to the MELD score**، يعني بياخد أولوية في قائمة الانتظار حتى لو الـ MELD مش عالي.
          - خد بالك: ده كلام L09 في ص 156. أما L11 في ص 189 فمش بيحطها في قائمة الـ MELD exception points، وبيقول بس إننا بنزرع لمريض MELD أقل من 15 لو عنده refractory ascites. جاوب بكلام المحاضرة اللي السؤال جاي منها.

          ==Alfapump==:
          - **ماهو**: pump صغير تحت الجلد بالبطارية، low flow، بينقل الـ ascites من الـ peritoneal cavity للمثانة عن طريق catheter.
          - **لمين**: refractory ascites والـ TIPS والـ LT ممنوعين عنده.
          - **ميزته**: safe و effective، وبيحسّن الـ nutritional state (لأن البروتين مش بيروح في بزل متكرر).
          - **عيبه**: transient renal dysfunction، وبتتصلح بالـ volume expansion.

          **Vasoconstrictors + albumin**:
          - Terlipressin IV (vasopressin analog) أو midodrine oral (alpha-1 agonist).
          - بيقللوا الـ splanchnic arterial vasodilatation وتنشيط الـ vasoconstrictor systems، فالـ renal perfusion والـ sodium excretion يتحسنوا.

          **Vaptans**:
          - بيقللوا حجم الـ ascites والحاجة للبزل من غير ما نزوّد الـ diuretics.
          - مخاطرهم: overcorrection of Na (osmotic demyelination)، dehydration، renal injury، و hepatotoxicity.
      - kind: figure
        page: 156
        quote: "Figure 3: The Alfapump."
        title: "الـ Alfapump"
        image: { file: hb/L09-alfapump.webp, book: true }
        alt: "Book drawing of the Alfapump: a small pump under the skin of the abdominal wall, with one tube from the ascites in the peritoneal cavity and a second tube to the urinary bladder; arrows show fluid moving from the abdomen to the bladder."
        caption: "الأنبوبة الأولى بتسحب الـ ascites من البطن، والتانية بترميها في الـ ==urinary bladder==، فالمريض بيتخلص من المية في البول بدل البزل."
      - kind: aside
        tone: joke
        page: 157
        quote: "The Alfapump is a subcutaneously implanted, battery-operated, low flow pump system that transports fluid from the peritoneal cavity via a peritoneal catheter to the bladder"
        text: |
          الـ Alfapump أذكى سباك في العالم: بدل ما المريض ييجي المستشفى كل أسبوع يتبزل، الجهاز بيوصّل البطن بالمثانة والمريض بيصرّف الـ ascites في الحمام وهو بيقرا الجرنال. 🚽
      - kind: match
        page: 158
        quote: "Tunneled peritoneal drainage catheter is a one-way valve tunneled catheter covered with a polyester cuff connected to a vacume bottle."
        prompt: "وصّل كل وسيلة بالحاجة اللي تميّزها:"
        pairs:
          - ["CART", "Contraindicated in SBP"]
          - ["Tunneled peritoneal catheter", "Home drainage into a vacuum bottle"]
          - ["Peritoneovenous shunt", "Can cause DIC"]
          - ["Alfapump", "Pumps ascites into the bladder"]
          - ["TIPS", "Hepatic encephalopathy in 30%"]
        why: "**CART**: بيفلتر الـ ascites من الخلايا ويركّزه ويرجّعه؛ ملوش تأثير على الكلية، بيقلل الـ albumin، و contraindicated في الـ **SBP**. **Tunneled catheter**: المريض بيصرّف في البيت، ومشاكله الـ catheter والـ peritonitis. **PVS**: بيرجّع الـ ascites للدورة، ومضاعفاته occlusion، peritonitis، **DIC** ونزيف؛ لمين مينفعش له بزل ولا LT ولا TIPS."
      - kind: try
        items: [hb.L09.079, hb.L09.082, hb.L09.090]
    recap:
      - "Refractory: 5–10%، mortality >40% في سنة؛ <0.8 kg في 4 أيام، أو رجوع في 4 أسابيع."
      - "Resistant = max doses من غير فايدة؛ intractable = المضاعفات منعت الجرعة."
      - "أوقف الـ diuretics لو urinary Na ≤30 mmol/day. الأساس repeated LVP + albumin."
      - "TIPS لو LVP >3/شهر؛ HE 30%؛ ممنوعة في liver failure، infection، renal failure، cardiopulmonary."
      - "LT definitive (MELD exception في L09، مش في L11)؛ Alfapump للمثانة؛ CART ممنوع في SBP؛ PVS ممكن DIC."
