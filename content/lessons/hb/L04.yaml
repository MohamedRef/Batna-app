  - id: hb.L04.lesson1
    title: "مواسير الكبد: مين بيتسد فين؟"
    hook: "ست أمراض نادرة بتصيب شباب، وكلها حكاية سباكة: ماسورة داخلة، ماسورة خارجة، وحاجة سدّت في النص."
    minutes: 8
    pages: [65, 69]
    topics: [overview, risk-factors]
    goals:
      - "تعدّ الـ 6 vascular liver disorders وتحط كل واحد في مكانه على الماسورة"
      - "تعرف ليه الـ MPN هو أول حاجة تدوّر عليها"
      - "تحفظ الـ thrombophilia screen بالكامل ومتقعش في فخ الكبد العيّان"
    status: unverified
    steps:
      - kind: explain
        page: 66
        quote: "Collection of rare conditions, each affecting <5/10,000 patients. Non-cirrhotic portal hypertension is a common characteristic of many VDL."
        title: "ليه نهتم بأمراض نادرة؟"
        text: |
          الـ **vascular liver diseases (VLDs)** مجموعة أمراض نادرة: كل واحد فيهم بيصيب أقل من 5 في كل 10,000.

          طب ليه نتعب نفسنا؟ لسببين في الكتاب:

          - ==Non-cirrhotic portal hypertension==: أغلبهم بيعملوا portal hypertension، يعني varices وsplenomegaly، في كبد نسيجه لسه سليم. السدّة في الأوعية نفسها، مش في نسيج متليف.
          - ==Young patients==: العيانين غالبًا شباب، فلو الـ management مش مظبوط بيخسروا سنين من عمرهم (**reduced life expectancy**).

          مثال: شاب عنده 25 سنة جاي بـ variceal bleeding والـ liver tests قريبة من الطبيعي. قبل ما تقول cirrhosis، فكّر في مرض من دول.
      - kind: figure
        page: 66
        quote: "Portal vein, Splenic vein, Inferior mesenteric vein, Superior mesenteric vein"
        title: "الـ portal vein بيتكوّن منين؟"
        image: { file: hb/L04-portal-anatomy.webp, book: true }
        alt: "Book drawing of the portal venous system: the splenic vein from the spleen and the superior mesenteric vein join behind the pancreas to form the portal vein, which enters the liver. The inferior mesenteric vein drains into the splenic vein. The umbilical vein is also labelled."
        caption: "الـ ==splenic vein== والـ ==superior mesenteric vein== بيتقابلوا ورا الـ pancreas ويعملوا الـ portal vein. والـ inferior mesenteric بيصبّ في الـ splenic. علشان كده جلطة الـ portal vein ممكن تمتد للـ mesenteric أو الـ splenic."
      - kind: figure
        page: 66
        quote: "Portal vein, Splenic vein, Inferior mesenteric vein, Superior mesenteric vein"
        title: "الماسورة من الأمعاء للقلب"
        alt: "A vertical flow diagram. Superior mesenteric and splenic veins join into the portal vein, which enters the liver, passes through small portal venules, then the sinusoids, then the hepatic veins, then the IVC into the right atrium. Labels on the right: portal vein = acute PVT then EHPVO; small portal venules = INCPH; sinusoids = SOS; hepatic veins to IVC entry = Budd-Chiari."
        caption: "امشي مع الدم من فوق لتحت: كل مرض في المحاضرة هو سدّة في حتة مختلفة من نفس الماسورة. الـ BCS بيبدأ من الـ small hepatic venules لحد دخول الـ IVC على الـ right atrium."
        svg: |
          <svg viewBox="0 0 330 520" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L04a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
