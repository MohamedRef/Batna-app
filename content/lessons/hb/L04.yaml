        text: |
          **Vitamin K antagonists (VKA):**

          - **Narrow therapeutic window**: محتاج متابعة صارمة على INR 2.0–3.0.
          - ==Unreliable INR==: الـ INR عالي أصلًا من الكبد، فممكن مايعبّرش عن الـ anticoagulation الحقيقي.

          **DOACs**، ومميزاتها في الكتاب:

          - مش محتاجة consistent coagulation monitoring.
          - No bridging بالهيبارين.
          - Rapid onset of action.
          - Lower risk of drug-drug interactions.

          ودراسات قليلة بتقول إنها safe وفعالة في الـ cirrhosis. العيب: كلهم بيتعملهم ==hepatic metabolism==.
