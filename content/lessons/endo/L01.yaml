        text: |
          الـ ==PPI (omeprazole)== بيقفل الـ proton pump نفسها، يعني آخر خطوة في عمل الحمض. فمهما الـ gastrin يزيد، الحمض مش هيطلع، والقرح تخف.

          بس الـ PPI بيعالج **النتيجة** مش **الورم**. عشان كده:
          - **Solitary sporadic gastrinoma**: ورم واحد، فـ ==complete resection== ممكن تشفي.
          - **MEN 1 gastrinoma**: الكتاب بيقول **frequently multiple / metastatic**، فالـ **role of surgery is controversial**. السبب: لو في أورام كتير صغيرة، أو انتشر خلاص، العملية مش هتشيل كله، والحمض متحكم فيه بالـ PPI أصلًا.
