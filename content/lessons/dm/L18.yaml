        quote: "Lesinurad (Zurampic) is the first selective uric acid reabsorption inhibitor (SURI) approved by the FDA. It acts by inhibiting the urate transporter, URAT1, which is primarily responsible for reabsorbing uric acid in the kidneys. It also inhibits organic anion transporter 4 (OAT4), a uric acid transporter associated with diuretic-induced hyperuricemia."
        text: |
          أول **selective uric acid reabsorption inhibitor (SURI)** (selective uric acid reabsorption inhibitor). بيمنع ==urate transporter 1 (URAT1)== (اللي بيرجّع الـ uric acid من الكلية) و **organic anion transporter 4 (OAT4)** (مرتبط بالـ diuretic-induced hyperuricemia).
