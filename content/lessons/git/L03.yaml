        why: "A و B و C ماشيين مع الأكل من فوق لتحت، D الألم اللي مصدره المخ، E المرارة والـ SO، و F آخر المشوار. ده نفسه سؤال الكتاب: Classify FGIDs."
      - kind: try
        items: [git.L03.002, git.L03.004, git.L03.017, git.L03.049, git.L03.273]
    recap:
