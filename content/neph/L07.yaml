  - id: neph.L07.120
    kind: mcq
    topic: cystic-other
    stem: A 24-year-old man has recurrent calcium kidney stones and UTIs, normal creatinine and no family history. CT shows medullary calcification in dilated collecting ducts. Diagnosis?
    options:
      - Medullary sponge kidney
      - Medullary cystic kidney disease (ADTKD)
      - ADPKD
      - Nephronophthisis
      - Simple renal cysts
    answer: 0
    why:
      - "Correct: young, calcium stones, UTI, no family history, normal function (p167, p168)."
      - ADTKD has a family history, salt loss and CKD, and no stones.
      - ADPKD has a strong family history and enlarging cortical cysts.
      - Nephronophthisis presents in childhood with CKD.
      - Simple cysts appear after 65 and do not cause stones.
