        title: "منع الحمل بعد الزرع"
        quote: "It involves the use of barrier techniques, such as condoms, diaphragms, spermicides, sponges, and cervical caps. Though they are safe for transplant recipients, convenient, and easy to use, with no concerns regarding interaction with immunosuppressants, their efficacy depends on user compliance which is difficult to achieve in most cases. Moreover, cervical caps were associated with a twofold increase in urinary tract infections in graft recipients. (99,100) However, intrauterine devices, both copper and levonorgestrel, represent a safer and more effective choice for kidney transplant women with no immunosuppression drug interaction concerns. Besides, it is reversible after intrauterine device removal and with no added risk of developing pelvic infections. (99) (2) Pharmacological contraception:"
        text: |
          - **Barrier**: آمن بس يعتمد على الالتزام، والـ **cervical cap** ضاعف الـ UTI.
          - ==intrauterine device== (copper أو levonorgestrel): آمن وفعال، مفيش interaction ولا pelvic infection زيادة.
          - **Combined**: بحذر (ضغط، migraine، thrombosis)، وبيتكسر بالـ **cytochrome P450 3A4 (CYP3A4)** زي الـ calcineurin inhibitor (CNI).
          - **Patch و ring**: مفيش first-pass في الكبد، فـ interaction أقل. الـ ring فيه estrogen أقل.
