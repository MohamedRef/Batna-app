schema: batna.content/v1
lecture: rheum.L03
title: Hypersensitivity reactions
author: Prof. Anna Abou-Raya
book: { chapter: 3, pages: [52, 67] }
topics:
  - { id: definition, title: "Definition and triggers of hypersensitivity" }
  - { id: classification, title: "Coombs and Gell classification" }
  - { id: type1, title: "Type I: mechanism and stages" }
  - { id: mediators, title: "Mast cell mediators and their effects" }
  - { id: anaphylaxis, title: "Type I examples and anaphylaxis" }
  - { id: type1-tx, title: "Diagnosis and therapy of type I" }
  - { id: type2, title: "Type II: antibody-mediated cytotoxicity" }
  - { id: type3, title: "Type III: immune complex injury" }
  - { id: type4, title: "Type IV: delayed-type hypersensitivity" }
items:
  # ---------- p52-53: definition and classification ----------
  - id: rheum.L03.001
    kind: card
    topic: definition
    front: What are hypersensitivity diseases?
    back: Disorders caused by immune responses. Adaptive immunity defends against microbes, but immune responses can also cause tissue injury and disease.
    src: { page: 52, quote: "Disorders caused by immune responses are called hypersensitivity diseases." }
    status: unverified
  - id: rheum.L03.002
    kind: card
    topic: definition
    front: Define hypersensitivity.
    back: An exaggerated or inappropriate immune response that causes tissue damage.
    src: { page: 52, quote: "Hypersensitivity is an exaggerated or inappropriate immune response that causes tissue damage." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L03.003
    kind: enumerate
    topic: definition
    prompt: Enumerate the three kinds of trigger to which hypersensitivity can occur, with the book's example of each.
    points: ["An infection that cannot be cleared (TB)", "A normally harmless exogenous substance (pollen)", "An autoantigen (DNA in SLE)"]
    pass: 3
    src: { page: 52, quote: "An infection that cannot be cleared (TB). A normally harmless exogenous substance (pollen). An autoantigen (eg DNA in SLE)." }
    status: unverified
  - id: rheum.L03.004
    kind: mcq
    topic: definition
    stem: "A 28-year-old woman with SLE has a flare with nephritis driven by antibodies to her own DNA. Into which group of hypersensitivity triggers does DNA in SLE fall?"
    options: ["An autoantigen", "An infection that cannot be cleared", "A harmless exogenous substance", "A drug hapten"]
    answer: 0
    why:
      - "Correct: the book gives DNA in SLE as the example of an autoantigen."
      - "TB is the book's example of an infection that cannot be cleared."
      - "Pollen is the example of a normally harmless exogenous substance."
      - "Drugs are not one of the book's three trigger groups on p52."
    src: { page: 52, quote: "An autoantigen (eg DNA in SLE)." }
    status: unverified
  - id: rheum.L03.005
    kind: card
    topic: classification
    front: On what basis are hypersensitivity diseases commonly classified?
    back: By the type of immune response and the effector mechanism responsible for cell and tissue injury.
    src: { page: 52, quote: "classified according to the type of immune response and the effector mechanism responsible for cell and tissue injury." }
    status: unverified
  - id: rheum.L03.006
    kind: card
    topic: classification
    front: Whose classification divides hypersensitivity into types I to IV?
    back: Coombs and Gell.
    src: { page: 52, quote: "Hypersensitivity reactions are based on the classification of Coombs and Gell into 4 types I, II, III and IV." }
    status: unverified
  - id: rheum.L03.007
    kind: cloze
    topic: classification
    text: "Types {{c1::I, II and III}} are antibody mediated; type {{c2::IV}} is cell mediated."
    src: { page: 52, quote: "Types I, II, and III are antibody mediated, type IV is cell mediated." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L03.008
    kind: card
    topic: classification
    front: What causes type I (immediate) hypersensitivity?
    back: IgE antibodies and mast cells.
    src: { page: 53, quote: "Type I - Immediate hypersensitivity caused by IgE antibodies and mast cells" }
    status: unverified
  - id: rheum.L03.009
    kind: card
    topic: classification
    front: What defines a type II hypersensitivity disorder?
    back: Disease caused by antibodies (other than IgE) specific for antigens of particular cells or the extracellular matrix, attached to those cells or tissues or unbound in the circulation; they injure by recruiting and activating inflammatory cells and by interfering with normal cellular functions.
    src: { page: 53, quote: "disease induced by such antibodies are called type II hypersensitivity disorders." }
    status: unverified
  - id: rheum.L03.010
    kind: card
    topic: classification
    front: What defines type III hypersensitivity?
    back: Antibodies form immune complexes in the circulation; the complexes are then deposited in tissues (blood vessels) and cause injury.
    src: { page: 53, quote: "Immune complex diseases are called type III hypersensitivity." }
    status: unverified
  - id: rheum.L03.011
    kind: card
    topic: classification
    front: What defines type IV hypersensitivity?
    back: Tissue injury due to T lymphocytes that activate the effector mechanisms of delayed-type hypersensitivity or directly kill target cells.
    src: { page: 53, quote: "such conditions are called type IV hypersensitivity disorders." }
    status: unverified
  - id: rheum.L03.012
    kind: table
    topic: classification
    title: Classification of immunologic diseases (p53)
    columns: [Type, Immune mechanism, Tissue injury]
    rows:
      - ["Type I (immediate)", "IgE antibody", "Mast cells and their mediators (vasoactive amines, lipid mediators, cytokines)"]
      - ["Type II (antibody)", "IgM, IgG against cell surface or ECM antigens", "Opsonization and phagocytosis; complement and Fc receptor recruitment and activation of neutrophils and macrophages"]
      - ["Type III (immune complex)", "Immune complexes of circulating antigens and IgG or IgM", "Complement and Fc receptor recruitment and activation of neutrophils"]
      - ["Type IV (T cell)", "CD4 T cells (delayed-type HS); CD8 T cells (cytolysis)", "Macrophage activation, cytokine inflammation; direct target cell killing"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [3, 2]]
    src: { page: 53, quote: "Classification of Immunologic Diseases" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L03.013
    kind: mcq
    topic: classification
    stem: "A student is asked which hypersensitivity type is mediated by cells rather than antibodies. Which is it?"
    options: ["Type IV", "Type I", "Type II", "Type III"]
    answer: 0
    why:
      - "Correct: type IV is cell mediated (T cells and macrophages)."
      - "Type I is mediated by IgE antibodies on mast cells."
      - "Type II is mediated by IgG or IgM against cell surface or ECM antigens."
      - "Type III is mediated by immune complexes of antigen with IgG or IgM."
    src: { page: 52, quote: "Types I, II, and III are antibody mediated, type IV is cell mediated." }
    status: unverified
  - id: rheum.L03.014
    kind: mcq
    topic: classification
    stem: "In a biopsy, neutrophils cluster around vessel walls where antigen-antibody complexes formed in the blood have been deposited. Which hypersensitivity type is this?"
    options: ["Type III", "Type I", "Type II", "Type IV"]
    answer: 0
    why:
      - "Correct: circulating immune complexes deposited in tissues (blood vessels) define type III."
      - "Type I works through IgE on mast cells, not deposited complexes."
      - "In type II, antibody binds antigen fixed on cells or matrix, not complexes from the blood."
      - "Type IV is T cell and macrophage mediated, with no antibody."
    src: { page: 53, quote: "the complexes are subsequently deposited in tissues (blood vessels) and cause injury." }
    status: unverified
  # ---------- p54-57: type I mechanism and mediators ----------
  - id: rheum.L03.015
    kind: card
    topic: type1
    front: Which is the most prevalent type of hypersensitivity disease?
    back: Type I hypersensitivity.
    src: { page: 54, quote: "The most prevalent type of hypersensitivity disease." }
    status: unverified
  - id: rheum.L03.016
    kind: card
    topic: type1
    front: What does the allergen induce in type I hypersensitivity?
    back: A humoral IgE immune response.
    src: { page: 54, quote: "In type I (or immediate) hypersensitivity, the antigen (allergen) induces a humoral IgE immune response." }
    status: unverified
  - id: rheum.L03.017
    kind: order
    topic: type1
    prompt: Order the events of a type I reaction (p54).
    steps:
      - First exposure to the allergen
      - Specific IgE is produced
      - IgE binds high-affinity Fcε receptors on mast cells and basophils
      - Subsequent exposure to the allergen
      - Cross-linking of membrane-bound IgE
      - Release of mast cell granules
    src: { page: 54, quote: "Upon subsequent exposures,cross-linking of membrane-bound IgE induces release of mast cell granules." }
    status: unverified
  - id: rheum.L03.018
    kind: cloze
    topic: type1
    text: "IgE binds to {{c1::high affinity Fcε}} receptors on {{c2::mast cells and basophils}}."
    src: { page: 54, quote: "IgE binds to high affinity Fc-c receptors (receptors for the Fc portion of the IgE molecule) on mast cells and basophils." }
    status: unverified
  - id: rheum.L03.019
    kind: card
    topic: type1
    front: Can the effects of type I hypersensitivity be local or systemic?
    back: Both; their effects can be localized or systemic.
    src: { page: 54, quote: "Their effects can be localized or systemic." }
    status: unverified
  - id: rheum.L03.020
    kind: card
    topic: type1
    front: What triggers mast cell mediator release apart from allergen plus specific IgE (p54 figure)?
    back: Direct triggers, for example opiates, contrast media and vancomycin.
    src: { page: 54, quote: "Mast cell meciator release" }
    status: unverified
  - id: rheum.L03.021
    kind: card
    topic: type1
    front: How does the sensitization stage of type I hypersensitivity start?
    back: An allergen penetrates a skin or mucosal barrier, is collected by an immature dendritic cell or other APC nearby, and is carried to the local lymph node.
    src: { page: 55, quote: "Sensitization stage: initiated when an allergen penetrates a skin or mucosal barrier" }
    status: unverified
  - id: rheum.L03.022
    kind: card
    topic: type1
    front: What happens in the lymph node during sensitization?
    back: The now mature dendritic cell presents processed allergen to a naive Th cell, activating it; naive allergen-specific B lymphocytes in the node are also activated.
    src: { page: 55, quote: "Within node the now mature DC presents processed allergen to a naive Th cell activating it." }
    status: unverified
  - id: rheum.L03.023
    kind: card
    topic: type1
    front: When is the effector stage of type I hypersensitivity triggered?
    back: When the allergen enters the body a second time during the period the mast cells are armed.
    src: { page: 55, quote: "Effector stage: if allergen enters the body a 2nd time during the period the mast cells are armed the effector stage is triggered." }
    status: unverified
  - id: rheum.L03.024
    kind: card
    topic: type1
    front: In the modified Th2 response (p55 figure), which cytokine switches B cells to IgE, and which pushes them to IgG4 instead?
    back: IL-4 from Th2 cells drives the switch to IgE; IL-10 favours IgG4 and inhibits IgE.
    src: { page: 55, quote: "Mouified TH2 response" }
    status: unverified
  - id: rheum.L03.025
    kind: card
    topic: type1
    front: What do mast cells release in the modified Th2 response figure, and what do IL-4, IL-5 and TNF-α attract?
    back: Leukotrienes, histamine, and IL-4, IL-5 and TNF-α, which attract eosinophils.
    src: { page: 55, quote: "Mouified TH2 response" }
    status: unverified
  - id: rheum.L03.026
    kind: card
    topic: type1
    front: How do mast cells degranulate after IgE binds them?
    back: IgE from plasma cells binds via its Fc domain to receptors on the mast cell; antigen cross-links these receptors, causing an influx of calcium ions and degranulation.
    src: { page: 56, quote: "cross linking of these receptors by Ag causing influx of calcium ions and degranulation of mast cells." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L03.027
    kind: table
    topic: mediators
    title: Primary (preformed) mast cell granule contents (p56)
    columns: [Mediator, Action]
    rows:
      - [Histamine, "Increased capillary permeability, vasodilation, smooth muscle contraction"]
      - [Serotonin, "As histamine, plus platelet aggregation"]
      - [Heparin, "Anticoagulation, modulates tryptase"]
      - [Tryptase, "Activates complement (C3)"]
      - [Chymase, "Increased mucus secretion"]
      - [Acid hydrolases, "Degradation of extracellular matrix"]
    blanks: [[2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 56, quote: "Anticoagulation, modulates tryptase" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L03.028
    kind: table
    topic: mediators
    title: Chemotactic and secondary mast cell mediators (p56)
    columns: [Mediator, Action]
    rows:
      - [Eosinophil chemotactic factor, "Chemotactic for eosinophils"]
      - [Platelet-activating factor, "Platelet aggregation and activation, permeability, vasodilation, chemotactic for leukocytes, neutrophil activation"]
      - ["Leukotrienes (C4, D4, B4)", "Vasodilation, smooth muscle contraction, mucus secretion, chemotactic for neutrophils"]
      - ["Prostaglandin D2", "Vasodilation, smooth muscle contraction, chemotactic for neutrophils, potentiates other mediators"]
      - [Bradykinin, "Permeability, vasodilation, smooth muscle contraction, stimulates pain nerve endings"]
    blanks: [[0, 1], [2, 1], [4, 1]]
    src: { page: 56, quote: "Chemotactic (cells move towards site of production) for eosinophils" }
    status: unverified
  - id: rheum.L03.029
    kind: card
    topic: mediators
    front: Which mast cell granule protease activates complement, and which increases mucus secretion?
    back: Tryptase activates complement (C3); chymase increases mucus secretion.
    src: { page: 56, quote: "Tryptase Activates complement (C3)" }
    status: unverified
  - id: rheum.L03.030
    kind: card
    topic: mediators
    front: Which mast cell mediator stimulates pain nerve endings?
    back: Bradykinin (with increased capillary permeability, vasodilation and smooth muscle contraction).
    src: { page: 56, quote: "of pain nerve endings" }
    status: unverified
  - id: rheum.L03.031
    kind: table
    topic: mediators
    title: Timing of mast cell mediators (p56 figure)
    columns: [Group, Timing, Examples]
    rows:
      - [Pre-formed granule mediators, "5 min", "Histamine, heparin, tryptase"]
      - ["Newly generated from arachidonic acid", "5-30 min", "Leukotriene D4, prostaglandin D2"]
      - [Cytokines, Hours, "TNF-α, IL-4"]
    blanks: [[0, 1], [1, 1], [2, 1], [2, 2]]
    src: { page: 56, quote: "pre-formed grancle newly generated:" }
    status: unverified
    tags: [numbers]
  - id: rheum.L03.032
    kind: mcq
    topic: mediators
    stem: "A patient stung by a wasp develops wheals within 5 minutes. Which mediators act this fast?"
    options: ["Pre-formed granule mediators such as histamine", "Arachidonic acid products such as leukotriene D4", "Cytokines such as TNF-α", "IgG antibodies"]
    answer: 0
    why:
      - "Correct: pre-formed granule mediators (histamine, heparin, tryptase) act within about 5 minutes."
      - "Arachidonic acid products are newly generated over 5-30 minutes."
      - "Cytokines take hours and drive the late-phase reaction."
      - "IgG is not a mast cell mediator."
    src: { page: 56, quote: "mediators (5 min}: arachioonit acd" }
    status: unverified
  - id: rheum.L03.033
    kind: mcq
    topic: mediators
    stem: "A patient with anaphylaxis has a raised serum level of a mast cell protease that also activates complement C3. Which mediator is it?"
    options: ["Tryptase", "Chymase", "Heparin", "Serotonin"]
    answer: 0
    why:
      - "Correct: tryptase is the protease that activates complement (C3)."
      - "Chymase increases mucus secretion."
      - "Heparin is an anticoagulant that modulates tryptase."
      - "Serotonin raises permeability and aggregates platelets; it is not a protease."
    src: { page: 56, quote: "Tryptase Activates complement (C3)" }
    status: unverified
  - id: rheum.L03.034
    kind: mcq
    topic: mediators
    stem: "A radiology patient develops flushing and urticaria during an injection of contrast medium. He has never been exposed before and has no specific IgE. How were his mast cells activated?"
    options: ["Directly, without IgE", "IgE cross-linking after sensitization", "Immune complex deposition", "Th1 macrophage activation"]
    answer: 0
    why:
      - "Correct: opiates, contrast media and vancomycin are direct triggers of mast cell mediator release."
      - "IgE cross-linking needs prior sensitization, which he lacks."
      - "Immune complexes are type III and take days."
      - "Macrophage activation is type IV and takes 24-72 hours."
    src: { page: 56, quote: "contrast media" }
    status: unverified
  - id: rheum.L03.035
    kind: card
    topic: mediators
    front: What two responses follow activation of an IgE-coated mast cell (p57 figure)?
    back: Histamine and lipid mediators give the vascular and smooth muscle response (immediate reaction); cytokines give inflammation (late-phase reaction).
    src: { page: 57, quote: "Vascular/smooth muscle response: immediate reaction" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L03.036
    kind: mcq
    topic: mediators
    stem: "An asthmatic exposed to cat dander wheezes within minutes, recovers, then wheezes again 6 hours later. What drives the second episode?"
    options: ["Cytokines causing inflammation (late-phase reaction)", "A second release of preformed histamine", "Immune complexes", "CD8 T cell cytolysis"]
    answer: 0
    why:
      - "Correct: mast cell cytokines drive inflammation, the late-phase reaction."
      - "Histamine and lipid mediators give the immediate vascular and smooth muscle response."
      - "Immune complexes are type III, not a type I late phase."
      - "CD8 cytolysis is a type IV mechanism."
    src: { page: 57, quote: "Inflammation: late-phase reaction" }
    status: unverified
  - id: rheum.L03.037
    kind: table
    topic: mediators
    title: Effects of mast cell and eosinophil products (p58 figure)
    columns: [Product, Effect]
    rows:
      - ["Biogenic amines (histamine), lipid mediators (PAF, PGD2, LTC4)", "Vascular leak, bronchoconstriction, intestinal hypermotility"]
      - ["Cytokines (TNF), lipid mediators", "Inflammation"]
      - ["Enzymes (tryptase)", "Tissue damage"]
      - ["Eosinophil cationic granule proteins (major basic protein, ECP)", "Killing of parasites and host cells"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 58, quote: "Killing of parasites and host cells" }
    status: unverified
  - id: rheum.L03.038
    kind: card
    topic: mediators
    front: Which mediators act as spasmogens and which as chemotactic factors in asthmatic bronchi (p59 figure)?
    back: "Spasmogens: histamine, leukotrienes, prostaglandins (bronchoconstriction). Chemotactic factors: IL-5 and TNF-α, which recruit cells that release MBP, ECP, lysosomal enzymes and cytokines."
    src: { page: 59, quote: "Inflammatory response in asthmatic bronchi" }
    status: unverified
  - id: rheum.L03.039
    kind: card
    topic: mediators
    front: What chronic changes does the inflammatory response cause in asthmatic bronchi (p59 figure)?
    back: Cell infiltrate, increased mucus, increased muscle and chronic bronchospasm, with bronchial hyperreactivity.
    src: { page: 59, quote: "Inflammatory response in asthmatic bronchi" }
    status: unverified
  # ---------- p58-59: examples and anaphylaxis ----------
  - id: rheum.L03.040
    kind: enumerate
    topic: anaphylaxis
    prompt: Enumerate the localized atopic (type I) diseases in the book.
    points: ["Hay fever (allergic rhinitis)", Asthma, Urticaria, "Atopic dermatitis (eczema)", Food allergies]
    pass: 4
    src: { page: 58, quote: "Localized Atopy: specific target tissue such as the skin or bronchial passages" }
    status: unverified
  - id: rheum.L03.041
    kind: card
    topic: anaphylaxis
    front: What is systemic atopy?
    back: Anaphylaxis, type I hypersensitivity with systemic consequences.
    src: { page: 59, quote: "Type I HS with systemic consequences." }
    status: unverified
  - id: rheum.L03.042
    kind: card
    topic: anaphylaxis
    front: How fast can anaphylactic shock kill?
    back: Within minutes of exposure to the antigen; it is a form of extreme shock.
    src: { page: 59, quote: "Clinically anaphylaxis is a form of extreme shock (anaphylactic shock) that can kill within minutes of exposure to the antigen." }
    status: unverified
  - id: rheum.L03.043
    kind: enumerate
    topic: anaphylaxis
    prompt: Enumerate the sensitizations in which anaphylactic shock is most often seen.
    points: [Insect stings, Peanuts, Seafood, Penicillin]
    pass: 3
    src: { page: 59, quote: "Anaphylactic shock is most frequently observed in individuals sensitized to insect stings, peanuts, seafood or penicillin." }
    status: unverified
  - id: rheum.L03.044
    kind: card
    topic: anaphylaxis
    front: Why does blood pressure fall in anaphylaxis?
    back: Activated mast cells and basophils release large amounts of inflammatory mediators and vasodilators into the circulation, causing rapid dilatation of blood vessels throughout the body.
    src: { page: 59, quote: "causing rapid dilatation of blood vessels throughout the body." }
    status: unverified
  - id: rheum.L03.045
    kind: enumerate
    topic: anaphylaxis
    prompt: Enumerate the clinical consequences of anaphylaxis in the book.
    points: ["Respiration immediately becomes difficult", "Dramatic drop in blood pressure", "Lungs filled with fluid", Arrhythmia, "Constriction of the bronchioles (lethal)"]
    pass: 4
    src: { page: 59, quote: "Respiration immediately becomes difficult and a dramatic drop in bl pressure occurs." }
    status: unverified
  - id: rheum.L03.046
    kind: card
    topic: anaphylaxis
    front: What is the immediate treatment of anaphylaxis in the book?
    back: Give adrenaline immediately; constriction of the bronchioles is lethal.
    src: { page: 59, quote: "Constriction of the bronchioles- lethal--Give adrenaline immediately." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L03.047
    kind: mcq
    topic: anaphylaxis
    stem: "A 24-year-old man eats a satay sauce with peanuts. Within 5 minutes he has stridor, wheeze, BP 70/40 and generalized urticaria. What is the first treatment?"
    options: ["Adrenaline immediately", "Oral antihistamine and observe", "Skin prick test", "Oral prednisolone"]
    answer: 0
    why:
      - "Correct: anaphylaxis with bronchiolar constriction is lethal; give adrenaline immediately."
      - "Antihistamines are too slow and too weak to reverse shock."
      - "Allergy testing identifies the allergen later; it does not treat the reaction."
      - "Steroids act over hours and do not reverse shock."
    src: { page: 59, quote: "Constriction of the bronchioles- lethal--Give adrenaline immediately." }
    status: unverified
  - id: rheum.L03.048
    kind: mcq
    topic: anaphylaxis
    stem: "A child develops itchy wheals, lip swelling and vomiting 20 minutes after eating shrimp for the first time this year; he had shrimp last summer without trouble. Which hypersensitivity type is this?"
    options: ["Type I", "Type II", "Type III", "Type IV"]
    answer: 0
    why:
      - "Correct: rapid reaction on re-exposure after sensitization, with urticaria, is IgE-mediated type I (food allergy, seafood)."
      - "Type II destroys cells carrying antigen, such as red cells; it does not cause urticaria in minutes."
      - "Type III immune complex disease, like serum sickness, takes days."
      - "Type IV reactions take 24-72 hours."
    src: { page: 58, quote: "Food allergies." }
    status: unverified
  # ---------- p59-60: diagnosis and therapy ----------
  - id: rheum.L03.049
    kind: card
    topic: type1-tx
    front: What does RIST measure?
    back: Total circulating IgE in the patient's serum (radioimmunosorbent test).
    src: { page: 59, quote: "Blood sample for RIST (radioimmunosorbent test)." }
    status: unverified
  - id: rheum.L03.050
    kind: card
    topic: type1-tx
    front: Differential diagnosis of a raised total IgE (p59)?
    back: Helminth worm infections and Hodgkin's lymphoma.
    src: { page: 59, quote: "DD: helminth worm infections, Hodgkins lymphoma." }
    status: unverified
  - id: rheum.L03.051
    kind: card
    topic: type1-tx
    front: What does the RAST test do?
    back: The radioallergosorbent test uses purified allergens in a panel to screen the patient's serum and identify the allergen by its binding to circulating IgE.
    src: { page: 60, quote: "The RAST(radioallergosorbent test) uses these purified allergens in a panel to screen serum samples" }
    status: unverified
  - id: rheum.L03.052
    kind: mcq
    topic: type1-tx
    stem: "A woman with seasonal rhinitis wants to know which pollen she reacts to. Which blood test identifies the specific allergen?"
    options: ["RAST", "RIST", "Complement C3 and C4", "ESR"]
    answer: 0
    why:
      - "Correct: RAST uses a panel of purified allergens to identify the allergen binding her IgE."
      - "RIST measures total IgE only and cannot name the allergen."
      - "Complement levels fall in type III disease, not in allergic rhinitis."
      - "ESR is non-specific."
    src: { page: 60, quote: "identify the allergen by binding to circulating IgE." }
    status: unverified
  - id: rheum.L03.053
    kind: mcq
    topic: type1-tx
    stem: "A 30-year-old Egyptian farmer has a very high total serum IgE on RIST but no allergic symptoms. Which differential does the book name for a raised total IgE?"
    options: ["Helminth worm infection", "Multiple myeloma", "Hepatitis C", "Iron deficiency"]
    answer: 0
    why:
      - "Correct: the book's differential for high total IgE is helminth worm infection and Hodgkin's lymphoma."
      - "Myeloma is a monoclonal plasma cell disorder, not the book's IgE differential."
      - "Hepatitis C is not listed for raised IgE."
      - "Iron deficiency is not a cause of raised IgE."
    src: { page: 59, quote: "DD: helminth worm infections, Hodgkins lymphoma." }
    status: unverified
  - id: rheum.L03.054
    kind: card
    topic: type1-tx
    front: Why are allergens purified and made by recombinant DNA technology?
    back: Purified common allergens are used in more refined tests; recombinant DNA allows synthesis of allergens that are hard to purify by conventional methods.
    src: { page: 60, quote: "Common allergens are purified for use in more refined tests and recombinant DNA technology allows the synthesis of allergens" }
    status: unverified
  - id: rheum.L03.055
    kind: enumerate
    topic: type1-tx
    prompt: Enumerate the tests used to identify the allergen in type I hypersensitivity.
