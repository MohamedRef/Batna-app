  - id: git.L04.lesson5
    title: "علاج المعدة، والـ lymphoma، والـ carcinoid"
    hook: "ليمفوما بتخف بالمضاد الحيوي؟ أيوه، لو MALT و early. وكارسينويد بيتقسم 3 أنواع بالـ gastrin."
    minutes: 10
    pages: [161, 168]
    topics: [gastric-tx, lymphoma, carcinoid]
    goals:
      - "تعرف نية العلاج حسب الـ stage والـ chemo والـ targeted therapy"
      - "تعرف الـ gastric lymphoma من الـ subtypes للـ H. pylori eradication"
      - "تفرّق بين الـ 3 types of gastric carcinoid في الجدول"
    status: unverified
    steps:
      - kind: explain
        page: 161
        quote: "Locoregional (stage I-III) disease :Potentially curable"
        title: "العلاج حسب المرحلة"
        text: |
          - **Stage I-III** (locoregional): ==potentially curable==، multidisciplinary وفكّر في الجراحة. حجم الـ resection بيعتمد على size و location و depth of invasion.
          - **Stage IV**: palliative. والـ systemic treatment بيدّي survival أطول و quality of life أحسن.
          - Chemo: **cisplatin + epirubicin + 5-FU** أو + irinotecan. الـ complete remission نادرة، والـ partial 30-50% ومؤقتة.
          - **Perioperative** و postoperative chemoradiation بيقللوا الـ recurrence ويطوّلوا العمر.
      - kind: match
        page: 162
        quote: "Bevacizumab A humanized monoclonal antibody that binds the vascular endothelial growth factor ligand."
        prompt: "وصّل كل targeted drug بهدفه:"
        pairs:
          - ["Bevacizumab", "VEGF ligand"]
          - ["Erlotinib, gefitinib", "EGFR tyrosine kinase"]
          - ["Cetuximab", "EGFR antibody"]
        why: "Bevacizumab antibody على الـ VEGF (اتدّى بأمان مع cisplatin + irinotecan). Erlotinib و gefitinib TKIs بنشاط متواضع. Cetuximab antibody للـ EGFR لسه under study."
      - kind: explain
        page: 163
        quote: "Primary gastric lymphoma is still relatively uncommon, accounting for less than 15% of gastric malignancies and 2% of lymphomas."
        title: "Gastric lymphoma"
        text: |
          - المعدة أشهر مكان لـ GI lymphoma، بس الـ primary gastric lymphoma أقل من 15% من الـ gastric malignancies.
          - أعراض vague: epigastric pain، early satiety، fatigue. الـ **B symptoms** نادرة جدًا.
          - العقد السادس والسابع، رجالة:ستات 2:1، وأشهر مكان الـ **antrum**.
          - الأنواع: ==DLBCL 55%==، **MALT 40%**، Burkitt 3%، mantle و follicular أقل من 1%.
          - الـ MALT غالبًا قبله **H. pylori gastritis**.
      - kind: explain
        page: 164
        quote: "Endoscopy generally reveals nonspecific gastritis or gastric ulcerations, with mass lesions being unusual."
        title: "التقييم"
        text: |
          - **Endoscopy**: nonspecific gastritis أو ulcers، والـ mass نادرة.
          - **EUS**: عمق الغزو، عشان نعرف مين معرض لـ **perforation** من full-thickness involvement.
          - الـ distant disease: upper airway exam، **bone marrow biopsy**، CT chest و abdomen، biopsy لأي node كبيرة.
          - و**H. pylori testing** لازم.
      - kind: table
        page: 165
        quote: "Tumor confined to gastrointestinal tract"
        title: "Staging of gastric lymphoma (Ann Arbor)"
        columns: ["Stage", "Description", "Incidence"]
        rows:
          - ["IE", "Confined to the GI tract", "26%"]
          - ["IIE", "Regional lymph nodes", "26%"]
          - ["IIE (Rao IIIE)", "Nodes beyond regional (para-aortic, iliac)", "17%"]
          - ["IIIE-IV", "Other abdominal organs or beyond the abdomen", "31%"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: explain
        page: 166
        quote: "early-stage MALT lymphomas as well as some cases of very limited diffuse large B-cell lymphoma may be effectively treated by H-pylori eradication alone."
        title: "العلاج: مضاد حيوي يشفي ليمفوما"
        text: |
          - أغلب المراكز **multimodality**. دور الـ resection controversial، وكتير بيتعالجوا بـ chemoradiation بس.
          - أشهر chemo: **CHOP**. والـ radiation محدودة في الأورام الكبيرة (stricture، enteritis، secondary tumors).
          - لو اتلقت فجأة في العملية: **frozen section**، و fresh tissue للـ flow، IHC، genetics. ولو IE أو IIE: شيل كل الـ gross disease.
          - **Early MALT** (وبعض الـ DLBCL المحدود جدًا): ==H. pylori eradication alone==. remission في أكتر من 75%.
          - المتابعة: منظار بعد حوالي 2 months، وبعدين كل 6 شهور لمدة 3 سنين.
      - kind: case
        page: 166
        quote: "Successful eradication resulted in remission in more than 75% of cases."
        stem: "A 59-year-old man has stage IE gastric MALT lymphoma. H. pylori is positive."
        steps:
          - question: "First treatment?"
            options: ["H. pylori eradication", "Total gastrectomy", "CHOP chemotherapy", "Radiotherapy"]
            answer: 0
            why: "Early MALT lymphoma can be treated by eradication alone; remission in more than 75%."
          - question: "How do you document regression?"
            options: ["Endoscopy at about 2 months, then twice yearly for 3 years", "Urea breath test once", "Symptoms only", "Yearly CT"]
            answer: 0
            why: "Repeat endoscopy documents clearance, then biannual endoscopy for 3 years documents regression."
      - kind: explain
        page: 167
        quote: "Commonly discovered as an incidental finding during the workup for other symptoms, when a yellow nodule is found in the fundus of the stomach."
        title: "Gastric carcinoid"
        text: |
          - من الـ **enterochromaffin-like (ECL) cells** في الـ fundus، ولحد 5% من كل الـ carcinoids.
          - غالبًا incidental: ==yellow nodule== في الـ fundus.
          - ممكن أعراض **histamine**: flushing، bronchospasm، itching، lacrimation.
          - التشخيص: biopsy (chromogranin، dysplasia، atrophy، invasion)، EUS للعدد والحجم والمكان، و CT للكبد والـ nodes.
      - kind: figure
        page: 167
        quote: "Comparison of the Three Types of Gastric Carcinoid Tumors"
        title: "التلات أنواع بالـ gastrin"
        alt: "Three columns. Type I: 70 to 80 percent, pernicious anemia, gastrin up, multicentric under 2 cm, metastasis under 5 percent, endoscopic resection and surveillance. Type II: 5 to 10 percent, ZES or MEN1, gastrin very high, multicentric under 2 cm, metastasis 7 to 12 percent, endoscopic resection plus gastrinoma resection. Type III: 15 to 20 percent, sporadic, normal gastrin, solitary over 2 cm, metastasis over 50 percent, formal surgical resection."
        caption: "كل ما الـ gastrin يقل والورم يبقى لوحده وكبير، الخطر يزيد. Type III هو الخطير."
