  - id: neph.L09.lesson4
    title: "Haemofiltration و haemodiafiltration و CKRT و plasma exchange"
    hook: "عيان في الـ ICU على noradrenaline. الـ HD العادي هيوقّع ضغطه. فيه طرق تانية أهدى."
    minutes: 9
    pages: [302, 310]
    topics: [hf-hdf, ckrt, tpe]
    goals:
      - "تفرّق haemofiltration و haemodiafiltration و isolated UF"
      - "تعرف امتى CKRT ومميزاته وعيوبه"
      - "تعرف شروط الـ plasma exchange وأهم دواعيه"
    status: unverified
    steps:
      - kind: explain
        page: 302
        title: "الـ haemofiltration"
        quote: "Hemofiltration Hemofiltration is an exclusively ultrafiltration/convection treatment in which high-flux membranes are utilized in the absence of dialysis fluid. Infusion of a sterile solution into the blood circuit reconstitutes the reduced plasma volume and reduces solute concentration. Infusion of a sterile solution (replacement fluid) can replace totally or partially the filtered volume. Replacement fluid can be infused pre-filter (pre-dilution) or post-filter (post- dilution)."
        text: |
          ==Convection بس==: high-flux membrane ومفيش dialysate. بنسحب مية كتير ونرجّع **replacement fluid** معقّم.

          الـ replacement ممكن **pre-filter** (pre-dilution) أو **post-filter** (post-dilution). الـ ==post-dilution أكفأ== بس بيسد الغشا أسرع (haemoconcentration).
      - kind: sort
        page: 303
        quote: "Isolated ultrafiltration The main goal of ultrafiltration is to remove fluid using semipermeable membranes without volume replacement, thus achieving volume but not solute control in the patient."
        prompt: "كل modality بتشتغل بإيه؟"
        bins: ["Diffusion", "Convection", "Both", "Fluid only"]
        cards:
          - { text: "Conventional HD", bin: 0 }
          - { text: "Haemofiltration", bin: 1 }
          - { text: "Haemodiafiltration", bin: 2 }
          - { text: "Isolated UF", bin: 3 }
        why: "haemodialysis (HD) = diffusion أساسًا. haemofiltration = convection بس. haemodiafiltration = الاتنين (online بـ endotoxin filter). Isolated ultrafiltration (UF) = مية من غير replacement: volume control بس، مفيش solute control."
      - kind: explain
        page: 303
        title: "امتى CKRT؟"
        quote: "CKRT blood purification techniques intended to run for 24 hours or longer without interruption.Continuous treatment allows for a lower ultrafiltration rate, slower rate of solute clearance than is possible with intermittent KRT. Indicated in Critically ill AKI specially on ventilator.Specially if Heodynamically unstable on inotrope. Patients with cerebral edema or liver failure. Severe acidosis pH < 7.1 to 7.2 or serum bicarbonate level < 12 to 15 mmol/L. Earlier initiation of RRT may be necessary in patients receiving lung-protective ventilation, as severe acidemia can result from the combination of metabolic and respiratory acidosis."
        text: |
          الـ ==continuous kidney replacement therapy (CKRT)== شغال 24 ساعة أو أكتر من غير وقفة، بـ UF rate أقل و clearance أبطأ. مناسب لـ:
          - **Critically ill acute kidney injury (AKI)**، خصوصًا على ventilator.
          - **Haemodynamically unstable** على inotropes.
          - ==Cerebral oedema== أو **liver failure**.
          - **Severe acidosis**: pH أقل من 7.1–7.2 أو bicarbonate أقل من 12–15.

          ولو على **lung-protective ventilation**، ابدأ بدري: metabolic + respiratory acidosis مع بعض.
      - kind: aside
        tone: trap
        page: 303
        quote: "Clinical trials have not demonstrated survival benefits or improvements in kidney function recovery with CKRT compared with intermittent KRT modalities in patients with acute kidney injury (AKI). Gaudry et al. Critical Care (2022) 26:93 ."
        text: |
          الـ CKRT أهدى على الضغط، بس ==مش بيحسّن الـ survival== ولا رجوع الكلية مقارنة بالـ intermittent. السؤال ممكن يقولك "CKRT improves survival": غلط.
      - kind: table
        page: 304
        quote: "Increased need for circuit anticoagulation due to extended treatment time. • Increased risk of hypophosphatemia."
        title: "CKRT: كسبنا إيه وخسرنا إيه"
        columns: [Gain, Cost]
        rows:
          - ["Less hypotension", "Slower clearance"]
          - ["Less ICP effect", "More anticoagulation"]
          - ["Better volume and solutes", "Hypophosphataemia"]
          - ["Free nutrition", "Catheter, immobility, cost"]
        hide: [[1, 1], [2, 1], [3, 0]]
      - kind: check
        page: 304
        quote: "Increased need for circuit anticoagulation due to extended treatment time. • Increased risk of hypophosphatemia."
        question: "Day 3 of CKRT: phosphate is very low. Why?"
        options:
          - "A known disadvantage of CKRT"
          - "Dialyser blood leak"
          - "Disequilibrium syndrome"
          - "Too much heparin"
        answer: 0
        why:
          - "صح: الـ CKRT بيشيل phosphate باستمرار، والكتاب بيقول hypophosphataemia من عيوبه."
          - "الـ blood leak بيدي alarm، مش hypophosphataemia."
          - "الـ disequilibrium cerebral oedema، والـ CKRT أصلًا بيقلله."
          - "الـ heparin مالوش علاقة بالـ phosphate."
      - kind: explain
        page: 308
        title: "الـ plasma exchange: امتى يبقى منطقي؟"
        quote: "Sufficiently large (≥15,000D)."
        text: |
          ==Apheresis== = "تشيل". بنشيل البلازما ونرجّع albumin أو fresh frozen plasma، علشان نشيل حاجات كبيرة: **autoantibodies**، **immune complexes**، lipoproteins.

          يبقى منطقي لو الحاجة اللي عايز تشيلها:
          - **كبيرة**: ==15,000 D أو أكتر== (الـ dialysis ما يشيلهاش).
          - **Half-life طويل**.
          - **سامة حادة** ومش بتستجيب للعلاج العادي.
          - **Volume of distribution قليل** (موجودة في الدم مش في الأنسجة).

          طريقتين: **centrifuge** (citrate، extraction 80%) أو **membrane** (heparin، extraction 30%).
      - kind: explain
        page: 309
        title: "ASFA والدواعي"
        quote: "Category I and II apheresis is first and second line therapy respectively.Category III, IIIV, apheresis is not established therapy or ineffective/harmful respectively."
        text: |
          **American Society for Apheresis (ASFA)**: I = first line، II = second line، III = مش متثبت، IV = مش بينفع أو مضر.

          **Category I كلوي**: antineutrophil cytoplasmic antibodies (ANCA) RPGN (dialysis dependent أو alveolar haemorrhage)، ==anti-GBM==، cryoglobulinaemia شديدة، **focal segmental glomerulosclerosis (FSGS) راجعة في الكلية المزروعة**، atypical HUS (factor H antibodies)، الزراعة (AMR و desensitisation)، **thrombotic thrombocytopenic purpura (TTP)**، و ticlopidine thrombotic microangiopathy (TMA).

          **غير كلوي**: Guillain–Barré، chronic inflammatory demyelinating polyneuropathy، hyperviscosity، myasthenia، N-methyl-D-aspartate (NMDA) encephalitis، fulminant Wilson.

          المضاعفات: الـ access، الـ replacement fluid، الـ anticoagulation، والعدوى.
      - kind: match
        page: 309
        quote: "Plasma pheresis by centrifugation method or by use of a filter and dialysis machine (membrane separation). Clin J Am Soc Nephrol 9: 181–190,"
        prompt: "وصّل كل طريقة plasma exchange بالـ anticoagulant بتاعها والـ extraction:"
        pairs:
          - ["Centrifuge TPE", "Citrate, 80% extraction"]
          - ["Membrane TPE", "Heparin, 30% extraction"]
          - ["Both methods", "Albumin or fresh frozen plasma replacement"]
        why: "الـ centrifuge بيفصل بالطرد المركزي مع citrate ويطلّع 80% من البلازما؛ الـ membrane فلتر مع heparin ويطلّع 30%. الاتنين بيرجّعوا albumin أو fresh frozen plasma."
      - kind: try
        items: [neph.L09.064, neph.L09.068, neph.L09.072, neph.L09.077, neph.L09.080]
    recap:
      - "Haemofiltration = convection بس، post-dilution أكفأ بس بيسد؛ haemodiafiltration = الاتنين؛ isolated UF = مية بس."
