  - id: git.L06.lesson2
    title: "الـ Crohn: من البُق للشرج وعامل نُقَط"
    hook: "مرض بيخرم الحيطة كلها وبينط من مكان لمكان: اعرف شكله وتصنيفه والعيان بيشتكي من إيه."
    minutes: 10
    pages: [208, 219]
    topics: [cd-pattern, cd-clinical]
    goals:
      - "تفهم ليه الـ transmural بيعمل fistula و stricture"
      - "تصنّف أي Crohn بالـ Montreal في ثانية"
      - "تربط كل fistula بالعَرَض بتاعها، وتعرف تشوف الـ fistula في الـ MRI"
    status: unverified
    steps:
      - kind: explain
        page: 208
        title: "الـ Crohn بيخرم الحيطة كلها"
        quote: "The inflammation in Crohn disease is typically transmural. This frequently leads to complications from perforating disease or from progressive fibrosis and stricturing. Crohn disease can thus be thought of as fitting one of three phenotypes: inflammatory, stricturing, or perforating disease (the latter including abscesses and fistulae). Disease behavior is not necessarily constant in an individual patient. Indeed, inflammatory disease frequently progresses to penetrating disease, and then to fibrosis and stricturing. Crohn disease may affect any part of the alimentary canal, and may do so in a nonconfluent (socalled skip lesion) pattern. Nearly half of all patients with Crohn disease have inflammation localized to the Terminal ileum and cecum (Table 1). Isolated small bowel or colonic involvement is also common. Crohn disease of the esophagus, stomach, or duodenum is rare, and virtually unheard of in the absence of small bowel or colonic disease."
        text: |
          Dr. Crohn وصف المرض في أمريكا سنة **1932**.

          أهم كلمة فيه: ==transmural==. الالتهاب مش واقف عند الـ mucosa، ده واخد الحيطة كلها. وعلشان كده بيعمل حاجتين:
          - **perforating disease**: abscesses و fistulae
          - **fibrosis and stricturing**: تضيّق

          وبيقدر يمسك **any part of the alimentary canal** بشكل **skip lesions**: حتة عيانة، حتة سليمة، حتة عيانة.
      - kind: figure
        page: 208
        quote: "The inflammation in Crohn disease is typically transmural. This frequently leads to complications from perforating disease or from progressive fibrosis and stricturing. Crohn disease can thus be thought of as fitting one of three phenotypes: inflammatory, stricturing, or perforating disease (the latter including abscesses and fistulae). Disease behavior is not necessarily constant in an individual patient. Indeed, inflammatory disease frequently progresses to penetrating disease, and then to fibrosis and stricturing. Crohn disease may affect any part of the alimentary canal, and may do so in a nonconfluent (socalled skip lesion) pattern. Nearly half of all patients with Crohn disease have inflammation localized to the Terminal ileum and cecum (Table 1). Isolated small bowel or colonic involvement is also common. Crohn disease of the esophagus, stomach, or duodenum is rare, and virtually unheard of in the absence of small bowel or colonic disease."
        title: "فين الـ Crohn بيحب يقعد؟"
        alt: "Sketch of the gut from mouth to anus. Patchy red segments mark Crohn skip lesions; the terminal ileum and cecum are shaded darkest and labelled 'nearly half'. The upper GI tract is faint and labelled rare, only with small bowel or colonic disease. A perianal fistula is drawn near the anus."
        caption: "نُص العيانين تقريبًا الالتهاب عندهم في ==terminal ileum and cecum==. الـ upper gastrointestinal (GI) نادر جدًا ومش بيجي لوحده من غير small bowel أو colon."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="20" text-anchor="middle" class="t-b">Crohn: skip lesions, mouth to anus</text>
            <rect x="140" y="34" width="50" height="60" rx="10" class="fg-thin"/>
            <text x="200" y="58" class="t-sm t-mut">Esophagus, stomach,</text>
            <text x="200" y="74" class="t-sm t-mut">duodenum: rare</text>
            <path d="M165 94 C 60 110, 60 150, 165 160 C 270 170, 270 200, 165 210" class="fg-ink" fill="none" stroke-width="10"/>
            <path d="M92 128 C 88 136, 90 142, 96 148" class="fg-arrow-bad" fill="none" stroke-width="10"/>
            <path d="M232 178 C 240 186, 240 192, 232 198" class="fg-arrow-bad" fill="none" stroke-width="10"/>
            <text x="20" y="118" class="t-sm">Small bowel</text>
            <circle cx="165" cy="232" r="22" class="fg-bad"/>
            <text x="165" y="237" text-anchor="middle" class="t-sm t-b">TI</text>
            <text x="196" y="228" class="t-sm t-b">Terminal ileum + cecum</text>
            <text x="196" y="244" class="t-sm t-bad t-b">nearly half of patients</text>
            <rect x="60" y="262" width="210" height="22" rx="8" class="fg-acc"/>
            <rect x="120" y="262" width="40" height="22" rx="4" class="fg-dot-bad"/>
            <text x="165" y="300" text-anchor="middle" class="t-sm">Colon: patchy; rectum often spared</text>
            <rect x="150" y="310" width="30" height="24" rx="6" class="fg-box"/>
            <path d="M180 326 l40 14" class="fg-arrow-bad" stroke-width="3"/>
            <text x="225" y="345" class="t-sm t-bad">Perianal fistula</text>
          </svg>
      - kind: reveal
        page: 208
        quote: "is rare, and virtually unheard of in the absence of small bowel or colonic disease."
        prompt: "لقيت Crohn في المعدة أو الـ duodenum. إيه أول حاجة تدوّر عليها؟"
        answer: |
          الكتاب: الـ Crohn في المريء أو المعدة أو الـ duodenum ==rare==، و **virtually unheard of** من غير مرض في الـ small bowel أو القولون. وتقريبًا **نص** المرضى الالتهاب عندهم في الـ **terminal ileum والـ cecum**.

          التفسير المقبول (مش في الكتاب): يعني لو لقيت التهاب في المعدة شكله Crohn، دوّر على الـ ileum والقولون، لأن غالبًا المرض هناك كمان. وليه الـ terminal ileum بالذات؟ لأنه أكتر حتة في الـ small bowel فيها بكتيريا (جنب الـ ileocecal valve) وفيها lymphoid tissue كتير (Peyer's patches)، وده بالظبط المكان اللي المناعة بتتخانق فيه مع البكتيريا.
      - kind: order
        page: 208
        quote: "The inflammation in Crohn disease is typically transmural. This frequently leads to complications from perforating disease or from progressive fibrosis and stricturing. Crohn disease can thus be thought of as fitting one of three phenotypes: inflammatory, stricturing, or perforating disease (the latter including abscesses and fistulae). Disease behavior is not necessarily constant in an individual patient. Indeed, inflammatory disease frequently progresses to penetrating disease, and then to fibrosis and stricturing. Crohn disease may affect any part of the alimentary canal, and may do so in a nonconfluent (socalled skip lesion) pattern. Nearly half of all patients with Crohn disease have inflammation localized to the Terminal ileum and cecum (Table 1). Isolated small bowel or colonic involvement is also common. Crohn disease of the esophagus, stomach, or duodenum is rare, and virtually unheard of in the absence of small bowel or colonic disease."
        prompt: "الـ Crohn behaviour بيتطور عند نفس العيان إزاي؟ رتّب:"
        steps:
          - "Inflammatory"
          - "Penetrating (abscess, fistula)"
          - "Fibrosis and stricturing"
        why: "الكتاب: الـ inflammatory غالبًا بيبقى **penetrating** وبعدين **fibrosis and stricturing**. يعني الـ behaviour مش ثابت عند نفس العيان."
      - kind: table
        page: 218
        quote: "Table 1: Classifications used for Crohn's disease:\n|  | Vienna | Montreal |\n|---|---|---|\n| Age at diagnosis | A1 < 40 years; A2 >40 years | A1 <16 years; A2 17-40 years; A3 >40 years |\n| Location | L1 ileal; L2 colonic; L3 ileocolonic; L4 upper | L1 ileal; L2 colonic; L3 ileocolonic; L4 isolated upper disease |\n| Behaviour | B1 non-stricturing, non-penetrating; B2 stricturing; B3 penetratng | B1 non-stricturing, non-penetrating; B2 stricturing; B3 penetratng; p perianal disease modifier |"
        title: "Montreal classification of Crohn (Table 1)"
        columns: [Domain, Codes]
        rows:
          - ["Age (A)", "A1 <16 · A2 17–40 · A3 >40"]
          - ["Location (L)", "L1 ileal · L2 colonic · L3 ileocolonic · L4 isolated upper"]
          - ["Behaviour (B)", "B1 non-stricturing non-penetrating · B2 stricturing · B3 penetrating"]
          - ["Modifier", "p = perianal disease"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: exam
        page: 218
        quote: "Table 1: Classifications used for Crohn's disease:\n|  | Vienna | Montreal |\n|---|---|---|\n| Age at diagnosis | A1 < 40 years; A2 >40 years | A1 <16 years; A2 17-40 years; A3 >40 years |\n| Location | L1 ileal; L2 colonic; L3 ileocolonic; L4 upper | L1 ileal; L2 colonic; L3 ileocolonic; L4 isolated upper disease |\n| Behaviour | B1 non-stricturing, non-penetrating; B2 stricturing; B3 penetratng | B1 non-stricturing, non-penetrating; B2 stricturing; B3 penetratng; p perianal disease modifier |"
        text: |
          الفرق بين **Vienna** و **Montreal** سؤال حلو:
          - Vienna: سنّين بس (**A1 <40**، **A2 >40**).
          - Montreal: تلاتة (**A1 <16**، **A2 17–40**، **A3 >40**)، و L4 بقت **isolated upper**، وزوّد الـ **p** للـ perianal.

          افتكر **16 و 40**: الـ Montreal فصل الأطفال لوحدهم.
      - kind: check
