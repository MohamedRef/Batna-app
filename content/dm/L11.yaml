    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L11.033
    kind: mcq
    topic: prandial
    stem: A man on glargine 40 units has FPG at target but HbA1c 8.6%. His biggest glucose rise is after lunch. What is the best next step and starting dose?
    options:
      - Add a prandial insulin before lunch, 4 IU (or 10% of basal)
      - Add 4 IU of prandial insulin before each of the three meals
      - Increase glargine by 4 units
      - Switch to premix 0.3 U/kg
      - Add NPH at bedtime
    answer: 0
    why:
      - "Correct: one prandial dose with the meal with the greatest PPG excursion, starting 4 IU or 10% of basal (p136, p137)."
      - "Start with one prandial dose, not three."
      - "FPG is at target; more basal risks hypoglycemia."
      - "Premix is the other option but carries more hypoglycemia and weight gain."
      - "Adding NPH does not cover lunch."
    src: { page: 137, quote: "4 IU a day or 10% of basal dose" }
    status: unverified
  # ---------- p137-138: premix ----------
  - id: dm.L11.034
    kind: card
    topic: premix
    front: What is the premixed insulin regimen?
    back: Twice-daily injections of a mixture of short- and intermediate-acting insulin, before breakfast and the evening meal.
    src: { page: 137, quote: "Twice-daily injections, a mixture of short and intermediate, before breakfast and the evening meal" }
    status: unverified
    tags: [high-yield]
  - id: dm.L11.035
    kind: cloze
    topic: premix
    text: "In the BIAsp 30 example, 30 U before breakfast gives {{c1::9}} U rapid and {{c2::21}} U intermediate; 10 U before dinner gives {{c3::3}} U and 7 U."
