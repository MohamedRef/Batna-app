    src: { page: 153, quote: "For remission-induction of non-organ-threatening AAV we recommend treatment with a combination of glucocorticoids and either methotrexate or mycophenolate mofetil.\n  The task force was keen to stress that the use of methotrexate or mycophenolate mofetil should not be used for remission induction in the following scenarios:\n    Meningeal involvement.\n    Retro-orbital disease.\n    Cardiac involvement.\n    Mesenteric involvement.\n    Acute-onset mononeuritis multiplex.\n    Pulmonary haemorrhage of any severity.\n    Methotrexate should therefore be considered only for non-organ-threatening disease. Examples include the following in the absence of renal involvement.\n    Nasal and paranasal disease without bony involvement (erosion) or cartilage collapse or olfactory dysfunction or deafness.\n    Skin involvement without ulceration.\n    Myositis (skeletal muscle only).\n    Non-cavitating pulmonary nodules/infiltrate without haemoptysis.\n    When cyclophosphamide or rituximab are not available or contraindicated or patient choice." }
