  - id: neph.L04.lesson2
    title: "ليه الضغط بيعلى، ومين بيدفع التمن؟"
    hook: "الـ essential HT مش لغز كامل: كلية بـ nephrons أقل، ملح، insulin، وأوعية بتتخن. والتمن على المخ والقلب والعين."
    minutes: 10
    pages: [83, 87]
    topics: [pathogenesis, complications]
    goals:
      - "تشرح عوامل الـ essential HT وليه كل واحد"
      - "تعرف ليه الـ resistance هو اللي بيثبّت الضغط"
      - "تفهم الـ malignant HT ودرجات Keith–Wagener"
    status: unverified
    steps:
      - kind: explain
        page: 83
        title: "الـ essential HT: 80–90% من العيانين"
        quote: "Low birth weight is associated with subsequent high blood pressure due to: Prolonged malnutrition Long term changes in B.V. Structure Low Nephron Number"
        text: |
          state معقدة بتربط **genetic** و **behavioral** factors لحد ما ==vascular resistance== يزيد.

          - **Genetic:** بيمشي في العيلة (genes وبيئة مشتركة).
          - **Fetal:** الـ **low birth weight** ← malnutrition، تغيير في الأوعية، و ==low nephron number==.

          الخطوة الجاية بتشرح **ليه** الـ low nephron number بيرفع الضغط.
      - kind: explain
        page: 83
        quote: "Low Nephron Number"
        title: "ليه الوزن القليل عند الولادة بيعمل ضغط؟"
        text: |
          الكتاب: الـ **low birth weight** بيرتبط بالضغط بعدين بسبب **prolonged malnutrition**، **long-term changes in blood vessel structure**، و **low nephron number**.

          التفسير المقبول (مش في الكتاب): الـ nephrons بتتكوّن قبل الولادة بس، **فـ** اللي اتولد بعدد قليل هيفضل بيه طول عمره. كل nephron بيشتغل زيادة، والقدرة الكلية على إخراج الصوديوم أقل، **يعني** الكلية محتاجة ضغط أعلى علشان تطلّع نفس الملح.
      - kind: explain
        remind: [neph.L04.037, neph.L04.032]
        page: 84
        title: "البيئة والهرمونات"
        quote: "Sodium intake: it is a major determinant of blood pressure differences. There in some evidence that high potassium diet can protect against high soduim diet."
        text: |
          - **Obesity** (وكمان overestimation للقراءة و sleep disturbance)، **alcohol** بكميات كبيرة.
          - ==Sodium intake== major determinant؛ والـ **high potassium** ممكن يحمي.
          - **Stress و pain** بيرفعوا الضغط، بس علاقة الـ **chronic stress** مش معروفة.
          - **autonomic nervous system، renin–angiotensin–aldosterone system (RAAS)، natriuretic peptide، kallikrein–kinin:** بيتحكموا في الـ short-term blood pressure (BP) وفي الـ pathogenesis، **مش في maintenance**.
          - imbalance بين **endothelin** و **NO**، و **insulin resistance** (hyperinsulinemia، glucose intolerance، ↓high-density lipoprotein (HDL) ↑triglycerides، central obesity).

          التفسير المقبول (مش في الكتاب): الـ obesity بتعمل **overestimation** **لأن** الدراع التخين محتاج cuff أكبر، ولو الـ cuff صغير الرقم يطلع أعلى. والخطوة الجاية بتشرح ليه الصوديوم والـ insulin.
      - kind: explain
        page: 84
        quote: "Sodium intake: it is a major determinant of blood pressure differences."
        title: "ليه الصوديوم والـ insulin بالذات؟"
        text: |
          الكتاب: الـ **sodium** major determinant، والـ **potassium** العالي ممكن يحمي، والـ **insulin resistance** (hyperinsulinemia، glucose intolerance، HDL واطي، TG عالي، central obesity) major risk factor.

          التفسير المقبول (مش في الكتاب):

          - الصوديوم بيحبس مية، **فـ** الـ volume يزيد والضغط يعلى.
          - الـ **potassium** بيساعد الكلية تطلّع صوديوم وبيوسّع الأوعية، **عشان** كده بيقلّل أثر الملح.
          - الـ **insulin** العالي بيخلّي الكلية تمص صوديوم أكتر وبيشغّل الـ sympathetic، **يعني** الـ insulin resistance بترفع الضغط بطريقين.
          - الـ RAAS والـ autonomic بيشتغلوا **قصير المدى**: بيبدأوا الضغط، بس اللي **بيثبّته** هو التغيير في جدار الأوعية (الخطوة الجاية).
      - kind: check
        page: 84
        quote: "Autonomic nervous system, RAAS, Natriuretic peptide and Kallikerin-Kinin system, play a role in pathophysiological regulation of short term blood pressure and pathogenesis of essential HT but are not directly involved in maintenance of HT."
        question: "Per the lecture, the RAAS and autonomic system in essential HT are:"
        options:
          - "Involved in short-term regulation and pathogenesis, not directly in maintenance"
          - "The main factors maintaining established hypertension"
          - "Unrelated to hypertension"
          - "Only active in secondary hypertension"
        answer: 0
        why:
          - "صح: short-term و pathogenesis، مش maintenance."
          - "الكتاب بيقول بالظبط إنهم not directly involved in maintenance؛ اللي بيحافظ على الضغط هو الـ resistance vessels."
          - "ليهم دور في الـ pathogenesis."
          - "الكتاب بيتكلم عنهم في الـ essential hypertension (HT)."
      - kind: figure
        remind: [neph.L04.041]
        page: 85
        quote: "Cardiac changes\n1- Resistance vessels \"small arteries and arterioles\" have increased wall thicknees and reduction of vessel lumen diameter which leads to increased vascular resistance which maintains HT\n2- ↑Rarefaction of B.V. \"↓ density\"\n3- Normal Cardiac output\nLarge vessels:\n  Thick media\n  ↑ Collagen\n  Secondary calcium deposition\n4- Loss of compliance → pronounced arterial presure wave.\n5- Pulse wave velocity, it measures arterial stiffness and is inversely related to distensibility\n6- LVH resulting from ↑ PVR and ↑ L.V. Load is a significant prognostic indicator of C.V. events."
        title: "الأوعية الصغيرة والكبيرة"
        alt: "Two cross-sections of a small artery: normal with a thin wall and wide lumen, and hypertensive with a thick wall and narrow lumen labelled increased resistance. Below, a large vessel box lists thick media, increased collagen and secondary calcium deposition leading to loss of compliance and a higher pulse wave velocity."
        caption: "الشرايين الصغيرة: ==wall تخين و lumen ضيق== = resistance عالي وده اللي بيحافظ على الضغط، والـ cardiac output **normal**. الكبيرة: media تخينة، collagen، calcium ← تفقد الـ compliance."
        svg: |
          <svg viewBox="0 0 330 290" xmlns="http://www.w3.org/2000/svg">
