        why: "الـ **secondary** (abscess أو perforation) بتدي: protein >1.5، PMN >5,000، **polymicrobial**، PMN مش بينزل بعد **48 h**، glucose <50 (الكتاب كاتبها mg/l والمقصود mg/dL)، و **LDH ascitic > serum**. الـ SBP: monomicrobial و protein واطي."
      - kind: aside
        tone: analogy
        page: 168
        quote: "ascitic fluid total protein concentration is >1.5 g/dL, ascitic fluid PMN is >5,000 cells/mm3, ascitic culture is polymicrobial"
        text: |
          الـ SBP زي تسريب صغير من الماسورة: بكتيريا واحدة، عدد قليل، والمية فقيرة في البروتين.

          الـ secondary زي الماسورة اتكسرت: كل أنواع البكتيريا (polymicrobial)، صديد بالآلاف، والجراح لازم ييجي.
      - kind: explain
        page: 168
        quote: "Predictors of mortality in SBP include severe underlying liver disease, renal impairment, onset of severe sepsis, and recent gastrointestinal bleeding."
        title: "ليه نستعجل؟"
        text: |
          الـ SBP مش عدوى بسيطة. الأرقام في الكتاب:
          - من غير prophylaxis كويسة، 30–50% بيموتوا في نفس الـ admission.
          - 69% بترجعلهم خلال سنة، و 50% منهم بيموتوا تاني.

          ==Predictors of mortality==:
          - severe underlying liver disease
          - renal impairment
          - severe sepsis
          - recent GI bleeding

          **الحل**: early diagnostic paracentesis (خلال أول 11 ساعة من الوصول) مع antibiotics بدري، وده بيقلل الـ in-hospital والـ 3-month mortality. كل ساعة فارقة.
      - kind: explain
        page: 169
        quote: "Third generation cephalosporins such as intravenous cefotaxime 2 g every 8- 12 hours or ceftriaxone 2 g every 24 hours"
        title: "العلاج"
        text: |
          ==Empirical antibiotics==: ابدأ فورًا مع مجرد الشك، متستناش الـ culture.

          **First-line**: third-generation cephalosporin:
          - cefotaxime 2 g IV كل 8–12 ساعة، أو
          - ceftriaxone 2 g كل 24 ساعة.

          **بدائل بنفس الكفاءة**: amoxicillin-clavulanic acid، أو fluoroquinolones (ciprofloxacin، ofloxacin).

          **لما الـ culture تطلع**:
          - **Culture-positive neutrocytic**: عدّل الـ antibiotic حسب الـ sensitivity.
          - **Bacterascites**: ابدأ antibiotic حسب الـ sensitivity.
          - **Culture-negative neutrocytic**: كمّل الـ empirical.

          **المدة**: 5–7 أيام على الأقل.

          ==Albumin==: 1.5 g/kg يوم التشخيص، و 1 g/kg يوم 3. مفيد أكتر لو فيه AKI أو hepatic dysfunction.

          **Response**: الـ PMN لازم ينزل أكتر من 25% بعد 48 ساعة. (الكتاب كاتبها «decreases to >25%»، والمعنى نزول أكتر من 25%.) مثال: PMN 1,200 → 800 بعد يومين، نزل 33%، يبقى في استجابة.

          **لو مفيش استجابة**: وسّع الـ antibiotic coverage، ودوّر على ==secondary peritonitis==.

          ولو المريض خف من الـ SBP بس الـ long-term survival بتاعه وحش: فكّر في **LT**.
      - kind: reveal
        page: 164
        quote: "Administration of salt-poor albumin after total volume paracentesis and SBP is mandatory."
        prompt: "مريض SBP والـ creatinine كويس. ليه نديله albumin؟ مش ده دور الـ antibiotic؟"
        answer: |
          الـ SBP هي أشهر trigger للـ HRS-AKI. العدوى بتزوّد الـ vasodilatation والـ underfilling، والـ albumin بيحمي الـ effective circulating volume، فبيمنع الكلية تقع.

          علشان كده الكتاب بيقول الـ albumin بعد الـ SBP **mandatory** في الـ HRS prevention.
