        answer: |
          كل واحد ليه دور. التفسير المقبول (مش في الكتاب):

          - **Analgesia**: الوجع شديد كفاية يودّي العيان الطوارئ (صفحة 381).
          - **Antispasmodic**: المغص من مرارة بتنقبض على باب مقفول، فإرخاء العضلة بيقلّل الضغط.
          - **Antibiotics**: لو فيه cholecystitis، الـ bacteria بتدخل المرارة المقفولة (fever on bacterial infection، صفحة 383)، والـ antibiotics بتمنع empyema و gangrene.
          - **Surgery**: الـ first aid بيطفي النوبة بس، والحصوة لسه موجودة والوجع هيرجع 20–40% في السنة. علشان كده الـ cholecystectomy هي اللي بتقفل القصة.
