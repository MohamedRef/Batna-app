          - "ده HbH disease، Hb 7–10 ومن غير نقل."
          - "ده silent، indices شبه طبيعية."
          - "الـ β minor carrier asymptomatic."
      - kind: explain
        page: 28
        title: "علاج الـ β major: دم وحديد"
        quote: "Regular red cell transfusions and chelation therapy for iron overload are the cornerstones of therapy"
        text: |
          الأساس: ==regular transfusion + iron chelation==.

          **النقل**: يخلّي الـ Hb **فوق 9.5–10 g/dL** دايمًا. الهدف: يمنع الـ anaemia والـ hypoxia، و==يكتم الـ erythropoiesis بتاعة الجسم== (فالنخاع ما يتمددش والامتصاص يقل).

          **الـ chelation** بيبدأ عادة على ==3 سنين==. الـ **desferrioxamine**: **25–60 mg/kg** SC بـ infusion pump على 12 ساعة، **5–6 أيام** في الأسبوع.
      - kind: table
        page: 29
        quote: "Deferiprone: major side effects are agranulocytosis, arthropathy, and possible hepatic fibrosis."
        title: "الـ chelators"
        columns: [Drug, Watch for]
        rows:
          - ["Desferrioxamine", "Eyes, ears, growth, Yersinia; poor compliance"]
          - ["Deferiprone", "Agranulocytosis, arthropathy"]
          - ["Deferasirox", "Oral 20–30 mg/kg; GIT, kidney"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: trap
        page: 29
        quote: "Deferiprone: major side effects are agranulocytosis"
        text: "**Deferiprone = agranulocytosis**. عيان thalassaemia بياخد chelator بالبُق وجاله حرارة؟ اعمل CBC فورًا. والـ **desferrioxamine** = **Yersinia** (الحديد المربوط بيأكّل البكتيريا دي). 😅 حتى البكتيريا بتحب الحديد ببلاش."
      - kind: explain
        page: 29
        title: "باقي العلاج"
        quote: "Due to the risk of sepsis, splenectomy should be avoided before 5-6 years of age."
        text: |
          - **Splenectomy**: للـ hypersplenism، بس ==مش قبل 5–6 سنين== (sepsis).
          - **Luspatercept**: recombinant fusion protein بيمسك الـ **TGF-β ligands**، فالـ **SMAD signalling** يقل والـ erythroid maturation تتحسن.
          - **General**: folic acid، و hormone replacement للغدد اللي باظت.
          - ==HSCT== هو **العلاج الوحيد اللي بيشفي**.
