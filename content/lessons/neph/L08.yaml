  - id: neph.L08.lesson13
    title: "Case 5 و 6: TMA والسكر في الآخر"
    hook: "ضغط 200/100 وصفايح واطية: الدم بيتكسّر في الأوعية الصغيرة. وبعده سكر 7 سنين وصل للآخر، ونسأل: فيه حاجة تانية تحته؟"
    minutes: 10
    pages: [244, 249]
    topics: [tma, diabetic]
    goals:
      - "تقرا case 5 من الـ labs للـ biopsy وتعرف ليه التشخيص TMA"
      - "تقسّم الـ TMA وتفرّق TTP من HUS وتعرف ليه"
      - "تقرا case 6 وتعرف الـ DD بتاع الـ nodular glomerulosclerosis"
    status: unverified
    steps:
      - kind: explain
        page: 244
        title: "Case 5: الـ labs بتشاور على إيه؟"
        quote: "Urine analysis: RBCs> 100, Proteinuria (3+). uPCR: 1.7 mg/mg. Dysmorphic RBCs: -ve. All immunologic markers: -ve. C3 & C4: Normal. CBC: Anaemia, and thrombocytopenia. Mild indirect hyperbilirubinemia."
        text: |
          راجل **42 سنة** من غير تاريخ مرضي، جاي بـ **gross hematuria**، ==HTN 200/100==، و creatinine 4. والكتاب بيسألك: **which investigations should we ask for?**

          النتايج: RBCs أكتر من 100، protein 3+، **uPCR 1.7**، **dysmorphic RBCs سلبي**، الـ immunology كلها سلبية، **C3 و C4 طبيعيين**، **anaemia و thrombocytopenia**، و **mild indirect hyperbilirubinemia**.

          اقرا الخيوط (التفسير المقبول، مش في الكتاب):
          - الـ **dysmorphic RBCs السلبية** بتبعّد الـ GN (الـ RBCs اللي بتعدّي من glomerulus ملتهب بتتشوّه).
          - الـ **immunology والـ complement الطبيعيين** بيبعّدوا lupus و MPGN و post-infectious.
          - **anaemia + thrombocytopenia + indirect bilirubin** = كرات حمرا بتتكسر وصفايح بتتاكل = ==microangiopathic hemolysis==.
          - والضغط 200/100 ممكن يبقى سبب أو نتيجة.
          يعني قبل الـ biopsy التشخيص بيروح لـ TMA، والـ biopsy هيأكد ويقول الأوعية حالها إيه.

          ليه الـ BP 200/100 مش بس عرض؟ التفسير المقبول (مش في الكتاب): الضغط العالي جدًا بيكسر الـ endothelium ويعمل TMA، والـ TMA بيقفل الأوعية فالكلية تفرز renin أكتر والضغط يطلع أكتر. دايرة مقفولة. عشان كده التحكم في الضغط جزء من العلاج، والسؤال المهم: الضغط ده **سبب** ولا **نتيجة**؟ والـ complement الطبيعي ما بيقفلش الباب على الـ atypical HUS، لأن الـ C3 ممكن يبقى طبيعي فيه.
      - kind: explain
        page: 244
        title: "الـ LM: glomeruli وأوعية"
        quote: "Nineteen glomeruli were seen, in all serial sections examined, out of which 10 were obsolescent. The patent glomeruli showed diffuse mild thickening of the capillary basement membranes with focal ischemic changes."
        text: |
          الـ IH كله سلبي. الـ **LM**: **19 glomeruli**، ==10 obsolescent==. الـ patent فيها mild GBM thickening و **focal ischemic changes**؛ **2** فيهم **large hilar thrombi**، واحد congestion، وواحد **cellular crescent**. الـ tubules: moderate injury. الـ interstitium: **fibrosis 25%**. الـ **interlobular arteries**: moderate thickening مع ==mucoid intimal degeneration==، والـ **arterioles**: red cell fragmentation، fibrin thrombi، fibrous thrombi، و **onion-skin**.

          ليه كل علامة؟ التفسير المقبول (مش في الكتاب):
          - الـ **fibrin thrombi** والـ **red cell fragmentation** = الأذى **الحاد** دلوقتي: كرات حمرا بتتقطّع على جلطات صغيرة.
          - الـ **fibrous thrombi** والـ **onion-skin** (طبقات smooth muscle حوالين الـ arteriole) = أذى **قديم ومتكرر**، والـ onion-skin بالذات بيحصل مع الضغط العالي جدًا.
          - الـ **mucoid intimal** = الـ intima منفوخة بمادة، بتضيّق الشريان فالـ glomeruli وراه تبقى **ischemic**.
          - و **10 من 19 obsolescent** = نص الكلية راح من زمان.
          يعني فيه حاجة حادة (flare) فوق حاجة مزمنة، وده بالظبط اللي التشخيص هيقوله.

          إزاي تفرق TMA حاد من مزمن في الـ LM؟ التفسير المقبول (مش في الكتاب): الحاد: **fibrin thrombi** و **fragmented RBCs** و endothelial swelling، يعني ضرر بيحصل دلوقتي. المزمن: **double contour** في الـ GBM و **onion-skin** في الـ arterioles، يعني الجسم بقاله وقت بيصلّح. وجود الاتنين مع بعض (زي case 5) = «acute flare» فوق مرض قديم، وده اللي الكتاب كتبه بالظبط.
      - kind: explain
        page: 245
        title: "Case 5: TMA"
        quote: "degeneration. Arterioles showed focal red cell fragmentation, fibrin thrombi, fibrous thrombi as well as onion- skin appearance."
        text: |
          راجل **42 سنة**، gross hematuria، ==blood pressure (BP) 200/100==، creatinine 4، anaemia و **thrombocytopenia** و indirect hyperbilirubinemia. الـ immunology و C3/C4 طبيعيين.

          الـ biopsy: hilar thrombi، **red cell fragmentation**، fibrin thrombi، و ==onion-skin== arterioles. التشخيص: **acute flare of thrombotic microangiopathy (TMA) with arterial involvement**.

          ليه الصورة دي TMA؟ التفسير المقبول (مش في الكتاب): الضرر في الـ **endothelium**. لما يتعوّر، الـ platelets بتلزق وتعمل thrombi، فالـ platelets تقل في الدم (**thrombocytopenia**). والـ RBCs وهي معدية من أوعية فيها thrombi بتتقطّع (**fragmentation**)، فيحصل hemolysis، فالـ indirect bilirubin يطلع.
          والـ **onion-skin** arterioles = طبقات من الـ smooth muscle والـ intima بتتبني حوالين الشريان من **ضغط عالي جدًا**، وده ممكن يكون سبب أو نتيجة. والـ C3/C4 الطبيعيين ما بيستبعدوش الـ complement-mediated TMA، بس بيقولوا مفيش immune complex disease.
