  - id: git.L09.lesson3
    title: "التحاليل: من البراز لحد الـ Schilling"
    hook: "تحليل براز، D-xylose، نَفَس هيدروجين، و B12 على 4 مراحل. كل واحد بيسأل سؤال مختلف."
    minutes: 7
    pages: [252, 256]
    topics: [stool-blood, absorption-tests, imaging]
    goals:
      - "تعرف تحاليل البراز والدم وبتقول إيه"
      - "تفرّق الـ small bowel من البنكرياس بالـ D-xylose"
      - "تقرا الـ Schilling test مرحلة مرحلة"
    status: unverified
    steps:
      - kind: explain
        page: 252
        title: "البراز أول حاجة"
        quote: "Stool PH is acidic <6 and increased stool osmotic gap occurs in carbohydrate malabsorption."
        text: |
          الدكتور لازم **يبص** على البراز بنفسه.

          - **pH أقل من 6** و **osmotic gap** عالي = ==carbohydrate malabsorption==.
          - **Ova and parasites**: لازم، علشان طفيليات كتير بتعمل malabsorption.
          - **Stool elastase**: بيقل في الـ **severe** pancreatic insufficiency بس، ومش مفيد في الـ mild.
