            <text x="251" y="206" text-anchor="middle" class="t-sm">disease risk &gt; surgery risk</text>
          </svg>
      - kind: reveal
        page: 188
        quote: "Ideally, the timing of liver transplantation occurs when the risk of dying from the liver disease is greater than the"
        prompt: "طب ليه منزرعش بدري «احتياطي»؟ وليه منستناش لحد آخر لحظة؟"
        answer: |
          الكتاب بيقول التوقيت المثالي لما risk of dying from the liver disease يبقى ==أكبر من risk of dying from the surgical procedure==.

          - بدري قوي: بتعرّض واحد كان هيعيش سنين لخطر عملية كبيرة، وبعدها immunosuppression طول العمر بمشاكلها، من غير داعي.
          - متأخر قوي: المريض بيبقى أضعف من إنه يستحمل العملية، فبتخسره على الترابيزة أو في الـ ICU بعدها.

          فكّر فيها زي ميزان: كفة فيها خطر المرض، وكفة فيها خطر العملية. أول ما كفة المرض تتقل، ده وقت الزرع.

          السببين دول منطق مقبول، الكتاب كاتب القاعدة بس.
      - kind: explain
        page: 188
        quote: "It was originally developed by a team at the Mayo Clinic in Rochester, Minnesota to predict survival after the placement"
        title: "إمتى نبدأ التقييم؟ و MELD ده إيه؟"
        text: |
          **AASLD** بتقول ابدأ ==candidate evaluation== لما يحصل واحدة من التلاتة، وواحدة كفاية:

          - decompensation
          - ==CTP score ≥ 7==
          - ==MELD score ≥ 10==

          قبل ما نكمل، تعريفين:

          - **CTP**: الـ Child-Turcotte-Pugh score، ودرجته من 5 لـ 15. الفئة A من 5 لـ 6، والفئة B من 7 لـ 9، والفئة C من 10 لـ 15. يعني CTP 7 هو أول درجة في الفئة B.
          - **MELD**: رقم بيقيس الـ sickness of the liver، محسوب من تلات تحاليل بس: serum bilirubin و INR و creatinine.

          ليه تحاليل بالذات؟ لأن الأرقام دي محدش بيختلف عليها. الـ CTP فيه ascites و HE، ودول تقدير الدكتور. (منطق مقبول، الكتاب مقالش المقارنة دي.)

          الـ MELD اتعمل أصلًا في Mayo Clinic في Rochester، Minnesota، علشان يتوقع الـ survival بعد TIPS في الـ cirrhosis. وبعدين بقى هو اللي بيعمل بيه **organ allocation** من February 2002.
      - kind: mnemonic
        page: 188
        quote: "bilirubin, INR, and creatinine."
        word: "BIC"
        parts:
          - { key: "B", text: "Bilirubin (serum)" }
          - { key: "I", text: "INR" }
          - { key: "C", text: "Creatinine" }
        hook: |
          الـ MELD زي قلم BIC الأزرق: أرخص حاجة في الشنطة، بس هو اللي بيكتب مين ياخد الكبد الأول. ✍️
      - kind: aside
        tone: joke
        page: 188
        quote: "It was originally developed by a team at the Mayo Clinic in Rochester, Minnesota to predict survival after the placement"
        text: |
          الـ MELD اتولد في Mayo Clinic علشان يجاوب سؤال صغير: «المريض ده هيعيش بعد الـ TIPS؟»

          وبعدين لقى نفسه بيوزّع الأكباد على أمريكا كلها. زي واحد دخل الشغل «مساعد مؤقت» وطلع بعد كام سنة المدير العام. 😄

          الممتحن بيحب السؤال ده: الـ MELD اتعمل originally لإيه؟ **TIPS.**
      - kind: check
        page: 188
        quote: "AASLD has created recommendations for candidate evaluation and selection for transplantation when a patient develops a decompensation, reaches"
        question: "A compensated cirrhotic (no ascites, bleeding or HE) has CTP 6 and MELD 11. Per AASLD in the book, what now?"
        options:
          - "Start transplant candidate evaluation"
          - "Wait until the first decompensation"
          - "Wait until CTP reaches 10 (Child C)"
          - "Wait until MELD reaches 15"
        answer: 0
        why:
          - "صح: **MELD ≥ 10** لوحده كفاية علشان يبدأ التقييم، حتى من غير decompensation ولا CTP ≥ 7."
          - "الـ decompensation واحدة من التلاتة، مش شرط. الـ MELD 11 كفاية."
          - "CTP ≥ 7 هو اللي يبدأ التقييم، مش 10. وهنا أصلًا الـ MELD كفّى."
          - "MELD 15 ده رقم الزرع في البرنامج، مش رقم بداية التقييم."
      - kind: mnemonic
        page: 189
        quote: "Unacceptable quality of life: weakness, malaise, cholestasis, itching etc"
        word: "PHASE C"
        parts:
          - { key: "P", text: "Portal hypertension: bleeding varices and/or intractable ascites" }
          - { key: "H", text: "Hyperbilirubinemia" }
          - { key: "A", text: "Albumin falling and PT rising: synthetic dysfunction" }
          - { key: "S", text: "Sick of life: unacceptable quality of life (weakness, malaise, cholestasis, itching)" }
          - { key: "E", text: "Encephalopathy: recurrent HE" }
          - { key: "C", text: "CTP score C (10-15): the frame for all of the above" }
        hook: |
          المريض دخل **«PHASE C»**: المرحلة اللي فيها Child C، وكل حرف indication من الخمسة اللي في الكتاب لـ LDLT في ESLD.
      - kind: explain
        page: 189
        quote: "We transplant patients with MELD<15 if they have refractory ascites or repeated HE."
        title: "قواعد البرنامج بالأرقام"
        text: |
          - Child B، يعني CPS > 7: بيتعمله listing بس من غير زرع، لحد ما يبقى Child C أو MELD 15.
          - ==MELD ≥ 15==: بنزرع.
          - **MELD > 30**: بنتناقش case by case.
          - ==MELD < 15==: بنزرع بس لو فيه refractory ascites أو repeated HE.

          تعريفين للباب الجانبي:

          - **Refractory ascites**: ascites مش بتستجيب للـ diuretics بالجرعات الكاملة، أو بترجع بسرعة بعد البزل.
          - **Repeated HE**: الـ hepatic encephalopathy بترجع تاني وتالت رغم العلاج.

          الاتنين بيبوّظوا حياة المريض، ومع ذلك الـ MELD ممكن «شكله كويس». ليه؟ لأن الـ MELD مبيشوفش غير bilirubin و INR و creatinine، ولا واحد فيهم بيقيس الميّه في البطن ولا الدماغ.

          وليه الـ MELD فوق 30 بنتناقش فيه؟ لأن المريض ساعتها ممكن يبقى تعبان لدرجة إن خطر العملية نفسها يعلى. (منطق مقبول، الكتاب كاتب القاعدة بس.)
      - kind: aside
        tone: trap
        page: 189
        quote: "We transplant patients with MELD<15 if they have refractory ascites or repeated HE."
        text: |
          الكتاب قال «We do not transplant child B patients» وفي نفس الصفحة «We transplant patients with MELD < 15 if they have refractory ascites or repeated HE». مريض Child B عنده repeated HE يدخل في الاتنين!

          في الامتحان: لو السؤال عن MELD < 15 + refractory ascites أو repeated HE جاوب ==بنزرع==. ولو عن Child B من غير كده: **listed but not transplanted**.
