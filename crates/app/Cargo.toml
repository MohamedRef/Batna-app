[package]
name = "batna-app"
description = "Batna: the Dioxus app for the Mac, the S24 Ultra and the Tab S11."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "batna"
path = "src/main.rs"

[dependencies]
batna-anki.workspace = true
batna-core.workspace = true
batna-protocol.workspace = true
# Dioxus's defaults minus `devtools` (hot reload), which only the native
# builds take (below): in the web app it would knock on a dx dev server forever.
dioxus = { version = "0.7.10", default-features = false, features = ["launch", "logger", "lib"] }
serde_yaml_ng.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.41", features = ["bundled", "serialize"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sha2 = "0.10"
# std::time::{Instant, SystemTime} panic in the browser; this is std on native.
web-time = "1"

# Native builds (Mac, Android): the network, the keychain and real threads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { version = "0.7.10", features = ["devtools"] }
# Oral mode's think timer and speech waits (Dioxus already runs on tokio),
# and Batna Cloud's sync thread (crates/app/src/cloud).
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
# Batna Cloud client and updates over the air (src/update/: the feed, SHA-256
# per download): TLS is rustls + ring with webpki roots everywhere, so the
# Android build needs no Java trust-store glue.
getrandom = "0.3"
keyring-core = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

# The web build (crates/web, wasm32): the browser stands in for the OS
# (src/platform/web.rs). SQLite runs in wasm and persists in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
# SQLite in wasm (through rusqlite) gets the clock and randomness from the browser.
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Element", "HtmlElement", "Location", "Storage", "Navigator", "Request", "RequestInit", "RequestMode", "Response", "Headers", "WebSocket", "MessageEvent", "BinaryType", "SpeechSynthesis", "SpeechSynthesisUtterance", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "MediaQueryList"] }

# Android TextToSpeech (src/platform/tts_android.rs) and «export to Anki»
# (src/anki/android.rs) through JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
android-native-keyring-store = "1"
ndk-context = "0.1"
# Only for `#[manganis::ffi]`, which tells dx to build android/ into the APK.
# Keep in lockstep with the dioxus version.
manganis = "=0.7.10"

[target.'cfg(not(target_os = "android"))'.dependencies]
directories = "6"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# Study reminders as native notifications (bundled Batna.app only).
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSCalendar", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[dev-dependencies]
# Render actual shared components for semantic regression coverage.
dioxus = { version = "0.7.10", features = ["ssr"] }
tempfile = "3"
# Signing test feeds in src/update/mod.rs.
ed25519-dalek = "2"

[build-dependencies]
batna-core.workspace = true
serde_yaml_ng.workspace = true

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# The web app (`just web`, docs/WEB.md).
web = ["dioxus/web"]

[lints]
workspace = true
