  # ------------------------------------------------------------------
  - id: rheum.L13.lesson1
    title: "السونار في إيد الروماتولوجيست"
    hook: "الأشعة العادية بتشوف الخراب بعد ما يحصل. السونار بيشوف النار وهي لسه بتولّع."
    minutes: 8
    pages: [211, 213]
    topics: [why-msus, equipment, ra, spa, other]
    goals:
      - "تعرف ليه الـ MSUS أحسن من الـ X-ray بدري"
      - "تختار الـ probe الصح"
      - "تعرف علامات الـ RA والـ SpA والـ gout والـ PMR والـ GCA"
    status: unverified
    steps:
      - kind: explain
        page: 211
        quote: "Traditional methods like X-ray are limited in detecting early inflammatory changes"
        title: "ليه نحتاج imaging جديد؟"
        text: |
          الـ ==X-ray== محدود في التغيرات الالتهابية البدرية. الـ **MSUS** والـ **nailfold capillaroscopy** بيدّوا early diagnosis و monitoring.

          الـ MSUS **non-invasive**، **bedside**، و **radiation-free**، وبيعمل:

          - يكشف ==early synovitis== قبل الـ structural damage.
          - يتابع النشاط والاستجابة للعلاج.
          - يقيّم tendons، bursae، entheses، و peripheral nerves.
          - يوجّه الحقن أو الـ aspiration.
      - kind: aside
        tone: analogy
        page: 211
        quote: "Compared to X-ray or MRI, ultrasound is especially valuable in identifying early, subtle inflammatory lesions that are not visible on conventional imaging."
        text: "الـ X-ray زي صورة البيت بعد الحريقة: بتشوف الحيطان المتفحمة (erosions). الـ MSUS زي كاميرا مراقبة: بتشوف الدخان وهو لسه طالع (synovitis و Doppler)."
      - kind: explain
        page: 211
        quote: "Its advantages include high patient acceptability, reproducibility, cost- effectiveness, and portability."
        title: "مميزاته"
        text: |
          - **High patient acceptability**.
          - **Reproducibility**.
          - **Cost-effectiveness**.
          - **Portability**.
      - kind: figure
        page: 212
        quote: "Linear probe: 6–15 MHz – used for joints, tendons, and superficial tissues. Curvilinear probe: 2–5 MHz – for deeper structures (e.g., hips)."
        title: "أنهي probe؟"
        alt: "Two probes. Left: a flat linear probe labelled 6 to 15 MHz with a shallow beam reaching joints and tendons. Right: a curved probe labelled 2 to 5 MHz with a deep fan-shaped beam reaching the hip."
        caption: "Frequency عالية = صورة حادة بس قريبة. Frequency واطية = توصل لتحت، زي الحوض."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <rect x="30" y="20" width="100" height="22" rx="4" class="fg-acc"/>
            <path d="M30 42L30 110L130 110L130 42" class="fg-thin"/>
            <text x="40" y="36" class="t-sm t-b">Linear</text>
            <text x="30" y="130" class="t-sm t-b">6–15 MHz</text>
            <text x="30" y="150" class="t-sm">joints, tendons</text>
            <text x="30" y="168" class="t-sm">superficial tissue</text>
            <path d="M200 42Q245 15 290 42" class="fg-acc"/>
            <path d="M200 42L175 200M290 42L315 200M175 200Q245 215 315 200" class="fg-thin"/>
            <text x="222" y="36" class="t-sm t-b">Curved</text>
            <text x="205" y="120" class="t-sm t-b">2–5 MHz</text>
            <text x="205" y="140" class="t-sm">deeper: hips</text>
          </svg>
      - kind: explain
        page: 212
        quote: "The EULAR guidelines stress the importance of scanning in both longitudinal and transverse planes."
        title: "الجهاز والـ setup"
        text: |
          - Transducer (high-frequency linear)، monitor، software فيه **colour و power Doppler**، و **gel** للـ acoustic coupling.
          - Positioning صح للمريض والـ probe عشان الصورة تبقى standardized و reproducible.
          - ==EULAR==: اعمل scan في الـ **longitudinal و transverse** planes الاتنين.
      - kind: explain
        page: 212
        quote: "These features are especially helpful in diagnosing early RA, often before serologic markers appear or radiographic erosions develop."
        title: "الـ MSUS في الـ RA"
        text: |
          بيشوف ==grey-scale (GS)== و ==power Doppler (PD)==:

          - **Synovial hypertrophy** (GS).
          - **Joint effusion**.
          - **PD activity** = synovium فيه أوعية (vascularized).
          - **Erosions**.

          وده مفيد في الـ **early RA**، غالبًا قبل ما الـ serology تطلع أو الـ erosions تبان في الـ X-ray.
      - kind: explain
        page: 213
        quote: "Entheseal abnormalities include: Thickening. Hypoechogenicity. Calcification. Erosions. Doppler signal at the enthesis."
        title: "الـ MSUS في الـ SpA"
        text: |
          بيلاقي ==enthesitis== (التهاب مكان دخول الوتر أو الرباط في العضمة)، peripheral arthritis، dactylitis، و tenosynovitis.

          شكل الـ enthesis المريض:

          - Thickening.
          - Hypoechogenicity.
          - Calcification.
          - Erosions.
          - Doppler signal at the enthesis.

          وبيلقط الـ **subclinical enthesitis** ويتابع الاستجابة للـ biologics.
      - kind: match
        page: 213
        quote: "Double contour sign in gout. Chondrocalcinosis in CPPD."
        prompt: "وصّل العلامة بالمرض:"
        pairs:
          - ["Double contour sign", "Gout"]
          - ["Chondrocalcinosis", "CPPD"]
          - ["Subacromial-subdeltoid bursitis", "PMR"]
          - ["Halo sign of the temporal artery", "Giant cell arteritis"]
          - ["Doppler at the enthesis", "Spondyloarthritis"]
        why: "الـ double contour = urate على سطح الـ cartilage. الـ PMR كمان: biceps tenosynovitis و hip effusion أو trochanteric bursitis. والـ halo = temporal artery thickening."
      - kind: check
        page: 213
        quote: "Visualization of tophi, erosions, and joint inflammation."
        question: "A 55-year-old man with recurrent big-toe attacks. Which MSUS sign supports the diagnosis?"
        options: ["Double contour sign", "Halo sign", "Chondrocalcinosis", "Hairpin capillaries"]
        answer: 0
        why:
          - "صح: gout، ومعاه ممكن tophi و erosions."
          - "دي للـ giant cell arteritis."
          - "دي للـ CPPD."
          - "دي capillaroscopy طبيعية، مش سونار."
      - kind: try
        items: [rheum.L13.003, rheum.L13.006, rheum.L13.008, rheum.L13.012, rheum.L13.014]
    recap:
      - "MSUS: non-invasive، bedside، بدون إشعاع، يشوف synovitis بدري."
      - "Linear 6–15 MHz للسطحي، curvilinear 2–5 MHz للعميق (hip)."
      - "RA: synovial hypertrophy، effusion، PD، erosions."
      - "SpA: enthesitis (thick، hypoechoic، calcification، erosion، Doppler)."
      - "Gout double contour، CPPD chondrocalcinosis، PMR bursitis، GCA halo."
    practice: [rheum.L13.001, rheum.L13.002, rheum.L13.003, rheum.L13.004, rheum.L13.005, rheum.L13.006, rheum.L13.007, rheum.L13.008, rheum.L13.009, rheum.L13.010, rheum.L13.011, rheum.L13.012, rheum.L13.013, rheum.L13.014, rheum.L13.015, rheum.L13.016, rheum.L13.017, rheum.L13.038, rheum.L13.039, rheum.L13.040, rheum.L13.045]
