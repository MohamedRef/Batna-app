  - id: geri.L07.lesson3
    title: "العضم والمخ: FRAX و delirium ولا dementia؟"
    hook: "مين نحسب له خطر الكسر، وإزاي سرعة النسيان بتفرق بين مرضين مختلفين خالص."
    minutes: 8
    pages: [114, 118]
    topics: [fracture, cognition]
    goals:
      - "تحفظ مين يتعمل له fracture risk assessment حسب National Institute for Health and Care Excellence (NICE)"
      - "تقارن Fracture Risk Assessment Tool (FRAX) و QFracture"
      - "تفرّق delirium عن dementia بالسرعة وتعرف أدوات الـ cognition"
    status: unverified
    steps:
      - kind: explain
        page: 114
        title: "NICE: مين نحسب له خطر الكسر؟"
        quote: "In all women aged 65 years and over and all men aged 75 years and over."
        text: |
          - **كل** الستات ==65+== وكل الرجالة ==75+==.
          - الأصغر من كده **لو فيه risk factors**: previous fragility fracture، glucocorticoids، falls، family history of hip fracture، secondary osteoporosis، **body mass index (BMI) <18.5**، smoking، alcohol **>14 units/week**.
      - kind: aside
        tone: tip
        page: 114
        quote: "In all women aged 65 years and over and all men aged 75 years and over."
        text: "الست بتسبق الراجل بـ **10 سنين** في الـ osteoporosis (بعد الـ menopause)، فبنبدأ معاها بدري: **65 للست، 75 للراجل**."
      - kind: reveal
        page: 115
        quote: "Do not routinely assess fracture risk in people aged under 50 years unless they have major risk factors (for example, current or frequent recent use of oral or systemic glucocorticoids, untreated premature menopause, or previous fragility fracture)."
        prompt: "واحدة عندها 40 سنة. امتى تحسب لها خطر الكسر؟"
        answer: |
          تحت **50** ما بنحسبش routinely، إلا مع **major risk factors**:
          - current أو frequent recent **oral/systemic glucocorticoids**
          - ==untreated premature menopause==
          - **previous fragility fracture**
      - kind: sort
        page: 116
        quote: "FRAX & Q-fracture Tools\n| Risk factor | FRAX | QFracture |\n|---|---|---|\n| Age | 40–90 years | 30–99 years |\n| Sex | ✓ | ✓ |\n| Weight | ✓ | ✓ |\n| Height | ✓ | ✓ |\n| Ethnicity | × | ✓ |\n| Previous fracture | ✓ | ✓ |\n| Parental history of hip fracture | ✓ | ✓ |\n| Smoking | ✓ | ✓ |\n| Alcohol | ✓ | ✓ |\n| Menopausal symptoms | × | ✓ |\n| Epilepsy (or use of anticonvulsants) | × | ✓ |\n| Cardiovascular disease | × | ✓ |\n| History of falls | × | ✓ |\n| Use of glucocorticoids | ✓ | ✓ |\n| Use of antidepressants | × | ✓ |\n| Bone mineral density (femoral neck T-score/absolute value) | ✓ (option) | × |\n| Secondary osteoporosis | Binary yes/no choice | Endocrine: hyperparathyroidism, thyrotoxicosis, Cushing's disease, type 1 or 2 diabetes, use of HRT; Gastrointestinal: Crohn's disease, ulcerative colitis, coeliac disease, steatorrhoea, blind loop syndrome; Metabolic: chronic renal disease, chronic liver disease, immobility; Neurological: Alzheimer's disease, Parkinson's disease; Oncological: cancer; Respiratory: COPD, asthma; Rheumatological: rheumatoid arthritis, systemic lupus erythematosus; Other: care or nursing home residence |"
        prompt: "الـ risk factor ده في FRAX ولا QFracture بس؟"
        bins: ["Both", "QFracture only", "FRAX only"]
        cards:
          - { text: "Previous fracture", bin: 0 }
          - { text: "Glucocorticoids", bin: 0 }
          - { text: "History of falls", bin: 1 }
          - { text: "Ethnicity", bin: 1 }
          - { text: "Antidepressants", bin: 1 }
          - { text: "Bone mineral density", bin: 2 }
        why: "الـ **QFracture** أشمل في الـ clinical factors (falls، ethnicity، epilepsy، cardiovascular disease (CVD)، antidepressants، menopausal symptoms) ومن 30 لـ 99 سنة. الـ **Fracture Risk Assessment Tool (FRAX)** من 40 لـ 90، وهو اللي بياخد ==bone mineral density (BMD)== (optional)."
      - kind: check
        page: 115
        quote: "Use Q-Fracture or FRAX tools to assess the 10-year osteoporotic fragility fracture risk."
        question: "FRAX and QFracture estimate the risk of fragility fracture over how long?"
        options: ["10 years", "5 years", "1 year", "Lifetime"]
        answer: 0
        why:
          - "صح: **10-year** osteoporotic fragility fracture risk."
          - "مش 5."
          - "مش سنة."
          - "مش lifetime."
      - kind: explain
        page: 117
        title: "الـ cognition: السرعة هي المفتاح"
        quote: "The rate of decline is important to distinguish delirium from dementia. Cognitive decline which is rapid and has taken place over days to weeks as opposed to months or years is more likely to represent delirium."
        text: |
          اسأل: **نسيانه زاد في آخر 12 شهر لدرجة إنه أثّر على حياته؟** (التليفون، ليستة الطلبات، الفلوس، الأدوية، السواقة).

          وبعدين السرعة:
          - **Days to weeks** ← ==delirium==
          - **Months to years** ← **dementia**
      - kind: aside
        tone: analogy
        page: 117
        quote: "The rate of decline is important to distinguish delirium from dementia. Cognitive decline which is rapid and has taken place over days to weeks as opposed to months or years is more likely to represent delirium."
        text: "الـ **delirium** زي عربية فرملت فجأة في نص الطريق: حصل حاجة النهارده (infection، دوا). الـ **dementia** زي عربية بتهدّي سرعتها سنة بعد سنة."
