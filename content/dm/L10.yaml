      - "Correct: NPH peaks 5–7 h after a bedtime dose, in the early morning (p127)."
      - "More than 42 h is degludec."
      - "10-minute onset is the rapid analogues."
      - "NPH does have a peak; glargine and degludec have minimal peaks."
      - "4 hours is the rapid analogues' duration."
