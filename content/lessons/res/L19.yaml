- id: res.L19.lesson11
  title: 'قيّم الـ validity: bias وconfounding والـ ITT'
  hook: 'لقيت الـ trial. أول سؤال قبل أي رقم: هل النتيجة دي صادقة أصلًا؟'
  minutes: 6
  pages: [90, 96]
  topics: [appraise]
  goals:
  - تعرف الـ appraisal بيقيّم إيه
  - تعرّف bias وconfounding ودور الـ randomization
  - تفهم الـ intention to treat والـ CONSORT
  status: unverified
  steps:
  - kind: explain
    page: 90
    quote: 'Step 3: Appraise (Evaluate) the evidence for validity, clinical usefulness and applicability'
    title: 'Step 3: Appraise بيقيّم إيه؟'
    text: |
      الخطوة التالتة بتقيّم الـ evidence في 3 حاجات:

      - ==Validity==: هل النتيجة صادقة؟
      - ==Clinical usefulness== (impact): هل الفرق كبير كفاية يفرق مع المريض؟
      - ==Applicability==: هل تنفع لمريضي؟

      ليه بالترتيب ده؟ لأن لو الدراسة مش valid، مالوش لازمة تحسب الفايدة أو تطبّقها. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 92
    quote: |-
      Bias: may be defined as the systematic deviation of the results of a study from the truth because of the way it has been conducted, analyzed or reported.
      Bias occurs when "systematic error is introduced into sampling or testing by selecting or encouraging one outcome or answer above others."
      Bias can occur at any phase of a study from study design to data collection and interpretation.
    title: 'Step 3: Appraise. أول حاجة الـ internal validity'
    text: |-
      الـ appraisal بيبص على 3: **validity**، **clinical usefulness**، و**applicability**.

      ==Bias== = انحراف **systematic** لنتايج الدراسة عن الحقيقة بسبب طريقة عملها أو تحليلها أو نشرها. ممكن يحصل في أي مرحلة: من الـ design لحد الـ interpretation.
  - kind: explain
    page: 92
    quote: |-
      Confounding: the distortion of the true effect of a treatment, exposure or risk factor by other factors that vary from the study group to the control group.
      Randomization helps to eliminate confounding factors because the act of randomization distributes all confounders - both known and unknown fairly
    title: Confounding
    text: |-
      ==Confounding== = تشويه الـ effect الحقيقي للعلاج أو الـ exposure بـ **عوامل تانية** مختلفة بين الـ study group والـ control.

      الـ **randomization** بتوزّع كل الـ confounders، ==known and unknown==، بالعدل.
  - kind: reveal
    page: 92
    quote: |-
      Confounding: the distortion of the true effect of a treatment, exposure or risk factor by other factors that vary from the study group to the control group.
      Randomization helps to eliminate confounding factors because the act of randomization distributes all confounders - both known and unknown fairly
    prompt: ليه الـ randomization أقوى من إنك «تظبط» الـ confounders بإيدك (matching)؟
    answer: لأنك تقدر تظبط اللي تعرفه بس. القرعة بتوزّع حتى اللي **متعرفوش** (unknown confounders).
  - kind: explain
    page: 94
    quote: |-
      Concepts used in therapy studies:
      Intention To Treat Analysis
      Number Needed to Treat (NNT)
      Number Needed to Harm (NNH)
    title: 3 مفاهيم في دراسات العلاج
    text: |
      دراسات الـ therapy بتستخدم 3 مفاهيم:

      - ==Intention to treat analysis==.
      - ==Number needed to treat (NNT)==.
      - ==Number needed to harm (NNH)==.

      ليه الـ 3 دول؟ الأول بيحمي الـ validity، والاتنين التانيين بيقيسوا الفايدة والضرر بأرقام يفهمها الدكتور والمريض. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 95
    quote: |-
      Intention-to-Treat Principle
      Once randomized, always analyzed
      Preserve the randomization
      Principle:
      Once a patient is randomized, s/he should be analyzed in the group randomized to - even if they discontinue, never receive treatment, or crossover (Ignore non-compliant).
    title: Intention to treat
    text: |-
      ==Once randomized, always analyzed==.

      المريض يتحلل في الـ group اللي اتعمله randomization ليه، حتى لو:

      - وقف العلاج (discontinue)،
      - أو مأخدوش أصلًا،
      - أو عمل **crossover** للـ group التانية.

      الهدف: ==preserve the randomization==.
  - kind: check
    page: 95
    quote: |-
      Intention-to-Treat Principle
      Once randomized, always analyzed
      Preserve the randomization
      Principle:
      Once a patient is randomized, s/he should be analyzed in the group randomized to - even if they discontinue, never receive treatment, or crossover (Ignore non-compliant).
    question: 'A patient randomized to surgery refuses it and gets medical treatment. In intention-to-treat analysis he counts
      in:'
    options:
    - The surgery group
    - The medical group
    - Neither (excluded)
    answer: 0
    why:
    - 'صح: once randomized, always analyzed في group الـ randomization.'
    - نقله يكسر الـ randomization.
    - شيله من التحليل يعمل bias.
  - kind: aside
    page: 96
    quote: |-
      Consort Diagram
      Assessed for eligibility (n=..)
      Excluded (n=....): Not meeting inclusion criteria (n=..); Refused to participate (n=..); Other reasons (n=..)
      Randomised (n=..)
      Allocated to intervention (n=..): Received allocated intervention (n=..); Did not receive allocated intervention (n=..) give reasons
      Lost to follow up (n=..) give reasons; Discontinued intervention (n=..) give reasons
      Analysed (n=..): Excluded from analysis (n=..) give reasons
    tone: tip
    text: |-
      الـ **CONSORT diagram** بيوريك رحلة كل مريض: assessed، excluded، randomised، allocated، lost to follow up، analysed.

      لو لقيت ناس كتير «اختفت» من التحليل، شك في الـ validity.
  - kind: try
    items: [res.L19.082, res.L19.083, res.L19.086, res.L19.087]
  recap:
  - 'Appraise: validity، clinical usefulness، applicability.'
  - Bias = systematic deviation؛ confounding = تشويه من عوامل تانية؛ الـ randomization بتوزع الاتنين known وunknown.
  - 'مفاهيم الـ therapy: ITT، NNT، NNH.'
  - 'ITT: once randomized, always analyzed.'
  practice: [res.L19.081, res.L19.082, res.L19.083, res.L19.084, res.L19.085, res.L19.086, res.L19.087, res.L19.088]
- id: res.L19.lesson6
  title: 'ARR وRRR وNNT وNNH: الأرقام اللي بتتسأل'
  hook: «الدوا بيقلل الخطر للنص!» ممكن يكون من 4% لـ 2%. يعني تعالج 50 عشان واحد يستفيد.
  minutes: 8
  pages: [97, 124]
  topics: [appraise]
  goals:
  - تحسب ARR وRRR وARI
  - تحسب NNT وNNH وتفسرهم
  - تحل مسائل الـ model quizzes
  status: unverified
  steps:
  - kind: table
    page: 97
    quote: |-
      | Test characteristic | Definition |
      | Absolute Risk Reduction (ARR) | Absolute risk reduction (ARR) is the amount by which therapy reduces the risk of a bad outcome. ARR = CER (control event rate) – EER (experimental event rate) |
      | Relative Risk Reduction (RRR) | Relative risk reduction (RRR) is the ratio of the absolute risk reduction (ARR) divided by the control event rate (CER). RRR = (CER - EER) / CER |
      | Absolute Risk Increase (ARI) | Absolute risk increase (ARI) is the amount by which therapy increases the risk of one additional bad outcome. ARI = EER (experimental event rate) – CER (control event rate) |
      | Number Needed to Treat (NNT) | Number needed to treat (NNT) is the number of patients that need to be treated for one to receive benefit. It can also represent the number of patients that need to be treated to prevent one additional bad outcome. NNT*= 1/ARR |
      | Number Needed to Harm (NNH) | Number needed to harm (NNH) is the number of patients that need to be treated for one additional bad outcome to occur (harm). NNH* = 1/ARI |
    title: المعادلات
    columns:
    - Measure
    - Formula
    rows:
    - - ARR
      - CER − EER
    - - RRR
      - (CER − EER) ÷ CER
    - - ARI
      - EER − CER
    - - NNT
      - 1 ÷ ARR
    - - NNH
      - 1 ÷ ARI
    hide:
    - - 0
      - 1
    - - 1
      - 1
    - - 3
      - 1
    - - 4
      - 1
  - kind: explain
    page: 98
    quote: |-
      Absolute Risk Reduction (ARR) is the difference in risk between the control group (X) and the treatment group (Y).
      ARR = X - Y
      Number Needed to Treat (NNT) is the number of patients that must be treated over a given period of time to prevent one adverse outcome.
      NNT = 1 / ARR
    title: من الـ 2×2 table
    text: |-
      - Treated event rate **Y = a/(a + b)**، control **X = c/(c + d)**.
      - ==ARR = X − Y==: الفرق في الخطر بين الـ control والـ treated.
      - ==NNT = 1/ARR==: عدد المرضى اللي لازم يتعالجوا **في مدة معينة** عشان نمنع adverse outcome واحد.

      والـ NNT مقياس **absolute**.
  - kind: explain
    page: 99
    quote: |-
      Number needed to treat: the number of patients who would have to receive the treatment for 1 of them to benefit; calculated as 100 divided by the absolute risk reduction expressed as a percentage (or 1 divided by the absolute risk reduction expressed as a proportion
      Number needed to harm: the number of patients who would have to receive the treatment for 1 of them to experience an adverse effect; calculated as 100 divided by the absolute risk increase expressed as a percentage (or 1 divided by the absolute risk increase expressed as a proportion)
    title: نسبة مئوية ولا كسر؟
    text: |-
      - لو الـ ARR **%**: NNT = **100 ÷ ARR**.
      - لو الـ ARR **proportion**: NNT = **1 ÷ ARR**.

      نفس الكلام في الـ NNH مع الـ ARI.
  - kind: figure
    page: 100
    quote: |-
      ARR versus RRR
      So graphically the differences look the same, it just depends on how you are referencing the data.
      Absolute Risk Reduction – 4 /100 - 2 /100 = 2 /100 = 2% reduction
      Relative Risk Reduction – (4/100 - 2 /100)/ (4/100) = 2/4 = 50% reduction
      Control
      Experimental
    title: ARR ضد RRR
    svg: |-
      <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 180H310" class="fg-ink"/>
        <rect x="60" y="60" width="50" height="120" class="fg-bad"/>
        <rect x="120" y="120" width="50" height="60" class="fg-good"/>
        <text x="85" y="52" text-anchor="middle" class="t-sm t-b">4%</text>
        <text x="145" y="112" text-anchor="middle" class="t-sm t-b">2%</text>
        <text x="85" y="196" text-anchor="middle" class="t-sm">Control</text>
        <text x="145" y="196" text-anchor="middle" class="t-sm">Treated</text>
        <path d="M176 60V120" class="fg-arrow-acc"/>
        <text x="190" y="62" class="t-sm t-b">ARR = 4 − 2 = 2%</text>
        <text x="190" y="82" class="t-sm t-b">RRR = 2 ÷ 4 = 50%</text>
        <text x="190" y="102" class="t-sm t-acc">NNT = 100 ÷ 2 = 50</text>
        <text x="190" y="140" class="t-sm t-mut">same data,</text>
        <text x="190" y="156" class="t-sm t-mut">different reference</text>
      </svg>
    caption: 'نفس الفرق: 2% absolute، 50% relative.'
    alt: 'Bars of 4% in control and 2% in treated: ARR 2%, RRR 50%, NNT 50.'
  - kind: aside
    page: 100
    quote: |-
      ARR versus RRR
      So graphically the differences look the same, it just depends on how you are referencing the data.
      Absolute Risk Reduction – 4 /100 - 2 /100 = 2 /100 = 2% reduction
      Relative Risk Reduction – (4/100 - 2 /100)/ (4/100) = 2/4 = 50% reduction
      Control
      Experimental
    tone: trap
    text: |-
      الإعلانات بتحب الـ ==RRR== لأنه رقم كبير («يقلل الخطر 50%»).

      اسأل دايمًا عن الـ **ARR**: لو الخطر أصلًا صغير، الفايدة المطلقة صغيرة والـ NNT كبير.
  - kind: check
    page: 123
    quote: |-
      A new drug is shown to reduce the incidence of a complication of a disease by 50%. If the usual incidence of this complication was 1% per year, how many patients with this disease would have to be treated with this medication for 1 year to prevent one occurrence of this complication?
      a) 20
      b) 50
      c) 100
      d) 200
      e) 500
      Therefore ARR = 1/100 - 0.5/100 = 0.005
      Then NNT = 1/0.005 = 200
      D
    question: A drug cuts a complication by 50%; usual incidence 1%/year. NNT for 1 year?
    options:
    - '200'
    - '20'
    - '50'
    - '100'
    answer: 0
    why:
    - 'صح: 1% يبقى 0.5%. ARR = 0.005، NNT = 1/0.005 = **200**.'
    - ده لو قسمت على 0.05 غلط.
    - ده 1/0.02.
    - 'ده 1/0.01: نسيت إن الخطر قل للنص بس.'
  - kind: check
    page: 124
    quote: |-
      A recent study of cholesterol-reducing medication shows that healthy patients taking the investigational drug over 5 years had a 5% incidence of myocardial infarction, whereas 7% of control subjects not taking the drug suffered from a myocardial infarction. How many patients must be treated with the new drug for 5 years in order to prevent one myocardial infarction?
      a) 2
      b) 14
      c) 20
      d) 35
      e) 50
      NNT = 1/0.07 - 0.05 = 1/0.02 = 50.
    question: 'MI over 5 years: 5% on the drug, 7% on control. NNT for 5 years?'
    options:
    - '50'
    - '2'
    - '14'
    - '35'
    answer: 0
    why:
    - 'صح: ARR = 0.07 − 0.05 = 0.02، NNT = 1/0.02 = **50**.'
    - ده الفرق بالنسبة المئوية مش الـ NNT.
    - ده 1/0.07.
    - مش من المعادلة.
  - kind: explain
    page: 101
    quote: |-
      Number-Needed-to-Harm (NNH)
      NNH – the number of people who need to be treated for one more person to experience harm
      NNH = 1/(absolute risk increase ARI)
      ARI = risk of bad outcome in tx group minus risk of bad outcome in control group
      Example
      If a drug increases the risk of a bad outcome (adverse effect) from 10% to 40%
      ARI = 0.4 – 0.1 = 0.3 (30%)
      NNH = 1/0.3 = 3
      Interpretation: 3 people need to be treated for 1 more person to experience the bad outcome (adverse effect)
    title: NNH
    text: |-
      ==NNH== = عدد اللي لازم يتعالجوا عشان **واحد زيادة** يتأذى.

      مثال الـ slide: الـ adverse effect من 10% لـ 40%.

      - ARI = 0.4 − 0.1 = 0.3.
      - NNH = 1/0.3 = **3** على الـ slide (3.3 بالظبط).
  - kind: case
    page: 103
    quote: |-
      Answer
      Percentage of patients not healed by internal sphincterotomy (EER) = 6%
      Percentage of patients not healed by botulinum toxin (CER) = 25%
      Absolute reduction of risk (ARR) = CER − EER= 0.25 − 0.06 = 0.19
      Number needed to treat (NNT):1/ARR = 1/0.19 = 5
      Percentage of patients harmed by internal sphincterotomy = 16%
      Percentage of patients harmed by botulinum toxin = 0%
      Absolute risk increase (ARI) = 0.16 − 0 = 0.16
      Number needed to harm (NNH): 1/ARI = 1/0.16 = 6
      Likelihood of being helped vs harmed: (1/NNT vs 1/NNH) = (1/5:1/6) = (0.2:0.16) =1.2.
    stem: 'Chronic anal fissure RCT: not healed 25% with botulinum (CER) vs 6% with sphincterotomy (EER). Incontinence 16%
      with sphincterotomy vs 0% with botulinum.'
    steps:
    - question: ARR and NNT for sphincterotomy?
      options:
      - 0.19 and 5
      - 0.31 and 3
      - 0.19 and 19
      answer: 0
      why: ARR = 0.25 − 0.06 = 0.19؛ NNT = 1/0.19 = **5** على الـ slide (5.26).
    - question: ARI and NNH for incontinence?
      options:
      - 0.16 and 6
      - 0.16 and 16
      - 0.84 and 1
      answer: 0
      why: ARI = 0.16 − 0 = 0.16؛ NNH = 1/0.16 = **6** على الـ slide (6.25).
    - question: 'Likelihood of being helped vs harmed (1/NNT : 1/NNH)?'
      options:
      - '1.2'
      - '0.83'
      - '11'
      answer: 0
      why: '(1/5 : 1/6) = (0.2 : 0.16) = **1.2**، يعني فرصة الفايدة أكبر شوية من فرصة الضرر.'
  - kind: check
    page: 121
    quote: |-
      Q 4: For a randomized controlled trial (RCT) on therapy to be valid, all the following statements are true EXCEPT:
      A. The patients who entered the trial should be randomly assigned to treatment
      B. Follow up of patients should be complete and long enough
      C. Patients and their clinicians should be blind to the treatment allocation
      D. The disease severity of the patients should be different at the start of the trial
      E. Compliance of the patients in the groups should be equally
    question: 'For an RCT on therapy to be valid, all the following are true EXCEPT:'
    options:
    - The disease severity of the patients should be different at the start of the trial
    - The patients who entered the trial should be randomly assigned to treatment
    - Follow up of patients should be complete and long enough
    - Patients and their clinicians should be blind to the treatment allocation
    - Compliance of the patients in the groups should be equal
    answer: 0
    why:
    - 'صح: لازم المجموعتين يبقوا شبه بعض في البداية؛ اختلاف الـ severity يشوّه النتيجة.'
    - الـ random assignment أساس الـ RCT.
    - الـ follow up لازم يبقى كامل وطويل كفاية.
    - الـ blinding بيحمي من الـ bias.
    - الـ compliance المتساوي بيخلي المقارنة عادلة.
  - kind: check
    page: 122
    quote: |-
      Q 5: A Randomized controlled trial was conducted to determine the efficacy of tonsillectomy for recurrent streptococcal pharyngitis in adults (= three or more episodes of pharyngitis in six months). The number needed to undergo tonsillectomy to prevent one recurrence was 32. This indicates that
      A. The study designed to evaluate the efficacy of tonsillectomy will need 32 patients with streptococcal pharyngitis to be sure of getting a significant results.
      B. On average, if tonsils of 32 patients with streptococcal pharyngitis were removed then one of them will experience a further attack of pharyngitis.
      C. On average, if tonsils of 32 patients with streptococcal pharyngitis were removed then one was less likely to have further streptococcal throat infection.
      D. Tonsillectomy in adults with recurrent streptococcal pharyngitis is 32 times more effective in reducing the risk of developing an episode of streptococcal pharyngitis.
    question: 'Tonsillectomy for recurrent strep pharyngitis: NNT = 32. This means:'
    options:
    - Remove the tonsils of 32 patients and, on average, one fewer will have a further strep throat infection
    - A trial needs 32 patients to be significant
    - Of 32 operated patients, one will have a further attack
    - Tonsillectomy is 32 times more effective
    answer: 0
    why:
    - 'صح: 32 عملية تمنع recurrence واحدة في المتوسط.'
    - الـ NNT مش sample size.
    - ده العكس.
    - الـ NNT absolute، مش «كام مرة».
  - kind: try
    items: [res.L19.089, res.L19.090, res.L19.092]
  recap:
  - ARR = CER − EER؛ RRR = ARR ÷ CER؛ ARI = EER − CER.
  - NNT = 1/ARR (أو 100/ARR%)؛ NNH = 1/ARI.
  - الـ RRR بيكبّر الصورة؛ اسأل عن الـ ARR.
  - 1% ← 0.5% = NNT 200؛ 7% ← 5% = NNT 50.
  - 'Botulinum vs sphincterotomy: NNT 5، NNH 6، helped vs harmed 1.2 (أرقام الـ slide).'
  practice: [res.L19.089, res.L19.090, res.L19.091, res.L19.092, res.L19.093, res.L19.094, res.L19.095, res.L19.096, res.L19.097,
    res.L19.098, res.L19.099, res.L19.100, res.L19.101]
- id: res.L19.lesson7
  title: طبّق على مريضك، وقيّم نفسك
  hook: الدراسة valid والفايدة كبيرة… بس مريضك عنده 85 سنة و3 أمراض تانية. تعمل إيه؟
  minutes: 10
  pages: [104, 125]
  topics: [apply]
  goals:
  - تعرف أسئلة الـ applicability
  - توازن الفايدة والضرر لمريضك
  - تحفظ تحديات الـ EBM والـ 1-2-3-4
  status: unverified
  steps:
  - kind: explain
    page: 104
    quote: |-
      Applying the results of a study to individual patients (applicability)
      Once you determine that the study methodology is valid, and clinically significant you must then examine the results and their applicability to your patient.
    title: 'Step 4: Apply'
    text: |-
      بعد ما تتأكد إن الدراسة ==valid== و==clinically significant==، تبص على **applicability**: النتايج تنفع مريضك؟
  - kind: explain
    page: 105
    quote: |-
      Therapy
      Is my patient so different from those in the study group that the results cannot be applied?
      According to the study results how much could my patient benefit from the treatment?
      Are the treatment and its consequences consistent with my patient's values and beliefs?
    title: 3 أسئلة قبل ما تطبّق دراسة علاج
    text: |
      في الـ therapy، اسأل نفسك:

      1. هل مريضي ==مختلف قوي== عن مرضى الدراسة لدرجة إن النتايج مش هتنطبق؟
      2. حسب النتايج، مريضي ==هيستفيد قد إيه==؟
      3. هل العلاج ونتايجه ==متوافقين مع قيم ومعتقدات== مريضي؟

      ليه التالت مهم زي الأولين؟ لأن الـ EBM نفسه 3 دواير، واحدة منهم patient preferences. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 107
    quote: |-
      Questions
      1. Is the treatment feasible in my setting?
      2. Is my patient so different to those in the study that the results cannot apply (age, comorbidity, compliance)?
      3. What alternatives are available?
      4. Will the potential benefits of treatment outweigh the potential harms of treatment for my patient?
      5. What does my patient think about it?
    title: 5 أسئلة قبل ما تطبّق
    text: |-
      1. العلاج **feasible** في المكان اللي انت فيه؟
      2. مريضك **مختلف** جدًا عن مرضى الدراسة (age، comorbidity، compliance)؟
      3. إيه الـ **alternatives**؟
      4. الـ ==benefits== أكبر من الـ ==harms== لمريضك؟
      5. مريضك **رأيه** إيه؟
    remind: [res.L19.104]
  - kind: check
    page: 109
    quote: |-
      Quiz:
      When applying evidence-based results, all of these patient-specific factors might need to be considered EXCEPT?
      A. The alternative treatment that is most suitable to the patient
      B. Feasibility of the treatment in the clinical setting
      C. The outcome that is important to the physician
      D. Compliance of the patient to the treatment
    question: 'When applying evidence-based results, all are patient-specific factors to consider EXCEPT:'
    options:
    - The outcome that is important to the physician
    - The alternative treatment most suitable to the patient
    - Feasibility of the treatment in the clinical setting
    - Compliance of the patient to the treatment
    answer: 0
    why:
    - 'صح: المهم الـ outcome اللي يهم **المريض**، مش الدكتور.'
    - البدائل من الـ 5 أسئلة.
    - الـ feasibility أول سؤال.
    - الـ compliance من «مريضك مختلف؟».
  - kind: explain
    page: 108
    quote: |-
      If possible, from the study results, work out the number needed to treat (NNT) and, for adverse effects, the number needed to harm (NNH).
      You then need to estimate your patient's risk of the outcome in question, which may be higher or lower than the control group in the study. You can then estimate the study NNT and NNH
      If the NNTs are similar for different treatments, look at the NNH for harmful side effects and choose the treatment with least side effects (this will also increase compliance).
    title: وازن الفايدة والضرر
    text: |-
      - احسب الـ **NNT** والـ **NNH** من الدراسة.
      - قدّر خطر مريضك نفسه: ممكن أعلى أو أقل من الـ control group.
      - لو الـ NNTs متقاربة بين علاجين، اختار اللي ==side effects أقل== (NNH أعلى)، وده كمان يزوّد الـ **compliance**.
  - kind: figure
    page: 113
    quote: |-
      Summary
      Clinical problem
      Develop answerable questions
      Search and obtain relevant articles
      Critical appraisal of evidence
      Decision making about diagnosis & treatment
      Expertise, Experience & Pathophysiology
