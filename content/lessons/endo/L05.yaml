  - id: endo.L05.lesson1
    title: "الخلية اللي بتفرز وهي ساكتة"
    hook: "خلية شبه العصب بس من غير axon، بتفرز هرمونات وتعمل مصايب في الكبد قبل ما حد يلاحظها."
    minutes: 9
    pages: [77, 79]
    topics: [overview, classification]
    goals:
      - "تعرف يعني إيه NET والـ APUD cell وليه بنسميها neuroendocrine"
      - "تحفظ أماكن الـ NETs والـ carcinoid بالـ foregut / midgut / hindgut"
      - "تعرف تقسيم الـ WHO والـ familial syndromes مع أورام البنكرياس"
    status: unverified
    steps:
      - kind: explain
        page: 77
        quote: "Neuroendocrine Tumours\n  Heterogeneous group of neoplasms.\n  Share certain characteristic features:\n    Originate from neuroendocrine cells.\n    Have secretory characteristics.\n    Frequently present with hypersecretory syndromes."
        title: "يعني إيه NET؟"
        text: |
          الـ ==neuroendocrine tumours== مجموعة heterogeneous، بس بيشتركوا في 3 حاجات:

          1. بتطلع من **neuroendocrine cells**.
          2. عندها **secretory characteristics**.
          3. كتير بتظهر بـ **hypersecretory syndromes**: الهرمون هو اللي بيفضح الورم.

          يعني الورم ده ليه وشين: **ورم** بيكبر وينتشر، و**غدة** بتفرز. علشان كده أي NET بتسأل عليه سؤالين: هو فين؟ وبيفرز إيه؟ والإجابة على التاني هي اللي بتحدد اسمه (gastrinoma، insulinoma…) وأعراضه وعلاجه.
      - kind: explain
        page: 77
        quote: "Neuroendocrine Cells\n  In 1969, Pearse described APUD cells (Amine Precursor Uptake and Decarboxylation).\n  These cells produce polypeptides and biogenic amines.\n  Contain dense core secretory granules that store and release hormones in response to external stimuli.\n  Lack axons and synapses.\n  Part of the diffuse endocrine system (DES).\n  Endocrine tumors of the gut and pancreas originate from DES cells."
        title: "الـ APUD cell"
        text: |
          سنة 1969 **Pearse** وصف الـ ==amine precursor uptake and decarboxylation (APUD) cells==.

          - بتعمل **polypeptides** و **biogenic amines**.
          - شايلاهم في **dense core secretory granules** وبتطلّعهم لما ييجي stimulus.
          - شبه العصب، بس **من غير axons ولا synapses**.
          - جزء من الـ **diffuse endocrine system (DES)**، ومنه بتطلع أورام الـ gut والـ pancreas.

          الاسم نفسه بيشرح الشغل: **amine precursor uptake** يعني بتاخد الـ precursor (زي الـ tryptophan) جوّاها، و **decarboxylation** يعني بتحوّله لـ amine (زي الـ serotonin). وعلشان كده بعدين بنصوّرها بمواد بتتاخد بنفس الطريقة (ص 82).
      - kind: aside
        tone: analogy
        page: 77
        quote: "Neuroendocrine Cells\n  In 1969, Pearse described APUD cells (Amine Precursor Uptake and Decarboxylation).\n  These cells produce polypeptides and biogenic amines.\n  Contain dense core secretory granules that store and release hormones in response to external stimuli.\n  Lack axons and synapses.\n  Part of the diffuse endocrine system (DES).\n  Endocrine tumors of the gut and pancreas originate from DES cells."
        text: "تخيلها موظف بريد من غير عربية: عنده الجوابات (granules) بس مفيش سلك يوصله بحد، فبيرمي الهرمون في الدم وخلاص."
      - kind: reveal
        page: 77
        quote: "Lack axons and synapses.\n  Part of the diffuse endocrine system (DES).\n  Endocrine tumors of the gut and pancreas originate from DES cells."
        prompt: "الخلية دي من غير axon ولا synapse. أمال ليه بنقول عليها «neuro»endocrine؟"
        answer: "التفسير المقبول (مش في الكتاب): لأنها شبه العصب في **طريقة الشغل** مش في الشكل: بتخزّن الهرمون في granules زي ما العصب بيخزّن الـ neurotransmitter، وبتطلّعه لما ييجي stimulus، وبتعمل نفس الـ amines. الفرق إنها بترمي الهرمون في الدم أو حواليها بدل ما توصّله بسلك. وعلشان هي **diffuse**، يعني متفرقة في الأمعاء والبنكرياس مش غدة واحدة، الورم ممكن يطلع في أي حتة."
      - kind: figure
        page: 78
        quote: "The Neuroendocrine Cell\n  Tryptophan → 5-HTP → 5-HT → 5-HIAA.\n  Secretory granules contain pancreastatin, chromostatin, and chromogranin A (CgA).\n  Regulation modes:\n    Endocrine.\n    Autocrine.\n    Paracrine.\n    Neurocrine."
        title: "من tryptophan لـ 5-HIAA"
        alt: "A vertical chain: tryptophan, then 5-HTP, then 5-HT (serotonin), then 5-HIAA in urine. A side box lists the granule proteins pancreastatin, chromostatin and chromogranin A."
        caption: "الـ 5-HIAA هو اللي بنقيسه في بول 24 ساعة. والـ chromogranin A (CgA) طالع من نفس الـ granules."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="E05a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
