  - id: endo.L07.lesson7
    title: "الـ hypercalcaemia: مين السبب وإيه اللي بيبان"
    hook: "مريضة جاية بحصوة في الكلية، وإمساك، واكتئاب، وعضمها بيوجعها. أربع شكاوي وسبب واحد."
    minutes: 8
    pages: [120, 124]
    topics: [hypercalcemia]
    goals:
      - "تعرف أسباب الـ hypercalcaemia وتفرّق الـ PTH من الـ non-PTH"
      - "تعرف المظاهر العامة والـ systemic وليه بتحصل"
      - "تقرا صور الـ hypercalcaemia: QT قصير، brown tumour، chondrocalcinosis"
    status: unverified
    steps:
      - kind: explain
        page: 120
        quote: "Causes\n  Over 90% of cases are due to:\n    Primary hyperparathyroidism [parathyroid hormone (pth) mediated] which is long standing.\n    Malignancy (more severe and symptomatic).\n  Tertiary hyperparathyroidism due to:\n    End stage renal disease."
        title: "الـ hypercalcaemia: مين السبب؟"
        text: |
          أكتر من **90%**: ==primary hyperparathyroidism== اللي long standing، و ==malignancy== وده أشد وبأعراض.

          - **PTH-related تاني**: tertiary في الـ end-stage renal disease (ESRD)، جزء من multiple endocrine neoplasia (MEN)، و familial hypocalciuric hypercalcaemia.
          - **Non-PTH**: osteolytic mets و parathyroid hormone-related protein (PTHrP)، calcitriol من extrarenal conversion، vitamin D زيادة، granulomas.
          - **أدوية**: thiazides، lithium، vitamin A زيادة.
          - و hyperthyroidism، acromegaly، pheochromocytoma.
      - kind: explain
        remind: [endo.L07.051]
        page: 121
        quote: "Non-pth mediated hypercalcemia:\n– Osteolytic bone metastases and related to pth- related peptide (pthrp).\n– Increased calcitriol via extrarenal conversion.\n– Increased vitamin d levels due to:\n• Over replacement.\n• Chronic granulomatous diseases."
        title: "الـ non-PTH: كل سبب بيرفع الكالسيوم إزاي"
        text: |
          الكتاب بيقسّم الأسباب لـ **PTH-mediated** و ==non-PTH mediated==. الـ non-PTH:

          - **Osteolytic bone metastases** و **PTH-related peptide (PTHrP)**.
          - **Increased calcitriol** من **extrarenal conversion**.
          - **Vitamin D** عالي من **over replacement** أو **chronic granulomatous diseases**.
          - **أدوية**: thiazide diuretics، lithium، vitamin A زيادة.
          - ومعاهم hyperthyroidism، acromegaly، pheochromocytoma.

          التفسير المقبول (مش في الكتاب): الـ metastases بتاكل العضم فالكالسيوم يطلع منه، والـ PTHrP بروتين بيعمله الورم وبيشتغل زي الـ PTH. والـ granulomas (زي الـ sarcoid) فيها macrophages بتحوّل vitamin D لـ calcitriol من غير ما الكلية تتحكم. والـ thiazides بتقلل خروج الكالسيوم في البول، والـ lithium بيخلّي الـ parathyroid محتاجة كالسيوم أعلى علشان تقفل. يعني في الـ non-PTH الـ PTH نفسه بيبقى **واطي**، وده اللي بيفرّقهم في التحليل.
      - kind: explain
        remind: [endo.L07.052]
        page: 121
        quote: "General Manifestations of Hypercalcemia\n• Weakness.\n• Easy fatigue.\n• Weight loss.\n• Generalized bone pain.\n• Renal colics.\n• Dry and scaly skin.\n• Pruritus."
        title: "الأعراض العامة"
        text: |
          قبل ما الكتاب يقسّم على الـ systems، بيدّي الأعراض العامة:

          - **Weakness** و **easy fatigue**.
          - **Weight loss**.
          - **Generalized bone pain**.
          - **Renal colics**.
          - **Dry and scaly skin** و **pruritus**.

          التفسير المقبول (مش في الكتاب): الكالسيوم العالي بيعمل عكس الـ hypocalcaemia: بيرفع الـ threshold فالأعصاب والعضلات تبقى **خاملة**، علشان كده weakness و fatigue. والـ bone pain من العضم اللي بيتاكل (PTH أو metastases)، والـ renal colic من الحصوات لأن الكالسيوم الزيادة بيخرج في البول. يعني الأعراض العامة نفسها بتقولك فين المشكلة: العضم والكلية.
      - kind: sort
        page: 122
        quote: "Systemic Manifestations of Hypercalcemia\n  Gastointestinal:\n    Nausea\n    Vomiting\n    Dyspepsia\n    Abdominal pain\n    Constipation\n    Chronic pancreatitis and calculi\n  Neuropsychiatric:\n    Proximal myopathy\n    Peripheral sensory neuropathy\n    Depression\n    Poor concentration\n    Memory deficits\n  Cardiovascular:\n    Hypertension ‐ Shortened Q-T interval\n  Skeletal:\n    General aches and pains\n    Osteoclastomas of the jaw\n    Bone cysts and brown tumors\n    Pseudogout and chondrocalcinosis\n    Pathological fractures\n  Renal:\n    Polyuria\n    Polydipsia\n    Renal calculi and nephrocalcinosis"
        prompt: "حط كل علامة في الـ system بتاعها:"
