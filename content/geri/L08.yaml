    src: { page: 153, quote: "Polymyalgia rheumatica (PMR) is a rare inflammatory disease that affects older adults, causing widespread muscle pain and stiffness, especially around the shoulders and hips. Most people who develop PMR are in their 60s or 70s. PMR is closely linked with giant cell arteritis (GCA), a type of vasculitis characterized by inflammation of the arteries in the head (temples) and of the aorta, resulting in headaches and vision problems. Left untreated, GCA can lead to blindness and stroke. The two diseases can occur at the same time in the same person. Approximately 15 percent to 20 percent of people with PMR will develop GCA, while about half of patients with GCA also have symptoms of PMR." }
