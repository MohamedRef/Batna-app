  - id: geri.L08.123
    kind: essay
    topic: sarcopenia
    prompt: Describe the screening tools for sarcopenia and mention how to manage.
    outline:
      - "Definition": ["Loss of skeletal muscle mass and function; primary (ageing) or secondary (disease, drugs)"]
      - "Screening tools": ["SARC-F, MAMC, calf circumference, hand grip strength, gait speed", "Combine SARC-F + CC or MAMC + grip or gait speed (Ishii, EWGSOP)"]
      - "SARC-F": ["Strength, assistance walking, rise from chair, climb stairs, falls; 0–2 each", "Score ≥4 needs comprehensive evaluation"]
      - "Diagnosis": ["Low strength = probable; low quantity/quality confirms; low performance = severe"]
      - "Management": ["Exercise (high-intensity resistance) ± nutrition first", "No approved drug; vitamin D (older women), testosterone (low-T men)"]
    src: { page: 132, quote: "Tools used for screening require high sensitivity and should be widely available, user-friendly, efficient, non-invasive and cheap. Several tools meet these requirements, specifically the SARC-F questionnaire, mid-arm muscle circumference (MAMC), calf circumference (CC), hand grip strength and gait speed. However, the combination of different tools to identify low muscle mass increases sensitivity even further." }
    status: unverified
    tags: [book-question]
  - id: geri.L08.124
    kind: essay
    topic: oa
    prompt: Describe the pathophysiology, clinical picture and management of primary osteoarthritis.
    outline:
      - "Definition and epidemiology": ["No known antecedent; hands, hips, knees, spine", "WHO: 10% of men, 20% of women over 60 symptomatic"]
      - "Pathophysiology": ["Low-grade synovial inflammation, innate and adaptive immunity", "Vicious cycle: less functional collagen and proteoglycans, more mediators", "Ageing chondrocytes: senescence, telomere, oxidative damage, apoptosis", "Neuroinflammation and central sensitization of pain"]
      - "Clinical picture": ["Pain, swelling, stiffness, trouble moving", "Muscle weakness; chronic, progressive; rest pain when severe"]
      - "Diagnosis": ["Blood tests exclude RA; fluid excludes gout or infection", "X-ray: narrowing and spurs; MRI rarely needed"]
      - "Treatment": ["Acetaminophen, NSAIDs, physical therapy and exercise", "Cortisone and lubrication injections, realignment, joint replacement"]
    src: { page: 140, quote: "When an imbalance exists in the structure or functioning of the extra cellular matrix of the cartilage, additional inflammatory mediators and mechanical stress create a \"vicious cycle\" of cartilage degeneration. Over time this \"low-grade\" inflammation and mechanical stress limit chondrocyte production of functional collagen (collagen type I), reduce space-occupying proteoglycans, and increase inflammatory mediators. While mechanical stress can occur over time and increase with age, there is likely an inherent age-associated change in the chondrocyte phenotype that also impairs cartilage homeostasis. This change leads to multiple molecular events and consequences (including altered gene expression related to senescence, DNA and telomere dysfunction, altered protein secretion, oxidative damage, decreased growth factor response, and apoptosis), precipitating cartilage destruction and susceptibility for osteoarthritis in the elderly." }
    status: unverified
    tags: [book-question]
