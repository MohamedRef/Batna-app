        quote: "Acute Hypocalcemia Causes\n  Hypocalcemia is usually due to:\n    Low pth, secondary to:\n      Thyroid.\n      Parathyroid.\n      Neck surgery.\n    Autoimmune conditions,\n    Underlying renal disease and\n    More commonly due to vitamin d deficiency.\n  Sometimes, hypocalcemia is due to low magnesium levels as a result of:\n    Diuretics.\n    Chronic diarrhea.\n    Malabsorption."
        title: "الـ hypocalcaemia: ليه؟"
        text: |
          - **Low parathyroid hormone (PTH)** بعد عمليات الـ thyroid أو parathyroid أو neck.
          - Autoimmune، renal disease.
          - والأشيع: ==vitamin D deficiency==.
          - وأحيانًا **low magnesium**: diuretics، chronic diarrhoea، malabsorption.

          التفسير المقبول (مش في الكتاب): الـ parathyroids صغيرة وقاعدة لازقة في الـ thyroid، فأي عملية في الرقبة ممكن تشيلها أو تقطع الدم عنها؛ علشان كده الـ hypocalcaemia بعد الـ thyroidectomy من أشهر أسئلة الامتحان. والـ vitamin D هو اللي بيمتص الكالسيوم من الأمعاء، فنقصه أشيع سبب. والـ magnesium لازم للـ PTH علشان يتفرز ويشتغل.
      - kind: reveal
        page: 119
        quote: "Tetany in Hypocalcemia"
        prompt: "ليه الـ hypocalcaemia بتعمل tetany ومش ضعف؟"
        answer: "التفسير المقبول (مش في الكتاب): الكالسيوم برّه الخلية بيثبّت الـ sodium channels في الأعصاب. لما الـ ionized calcium يقل، الـ threshold بيوطى فالأعصاب تضرب لوحدها: الأول **paresthesia** حوالين البق والصوابع (الأعصاب الحسية أحسّ)، وبعدين **spasm** في الإيدين والرجلين (الصورة اللي في الكتاب: carpopedal spasm)، وأخطر حاجة ==laryngeal spasm== اللي بتعمل stridor وممكن موت، و convulsions. علشان كده الـ hypocalcaemia ضد الـ hypercalcaemia: الواطي بيهيّج، والعالي بيهمّد."
      - kind: explain
        page: 119
        quote: "Acute hypocalcemia presents with:\n  1. Paresthesia and numbness around the mouth and in the extremities.\n  2. Muscle spasms especially in the hands and feet.\n  3. Spasm of laryngeal muscles may lead to respiratory dysfunction, stridor and death. Tonic and clonic spasm may lead to convulsions."
        title: "الصورة"
        text: |
          1. **Paresthesia** و numbness حوالين البق والأطراف.
          2. **Muscle spasms**، خصوصًا الإيدين والرجلين.
          3. ==Laryngeal spasm==: stridor وممكن موت، و convulsions.

          الترتيب ده مهم: الحوالين البق والأطراف الأول لأن الأعصاب الحسية بتتأثر بدري، وبعدين العضلات، وبعدين الحنجرة. يعني لو المريض بيشتكي من تنميل حوالين البق بعد عملية رقبة، ده إنذار بدري قبل الـ stridor.
      - kind: explain
        remind: [endo.L07.040]
        page: 119
        quote: "The diagnostic approach of hypocalcemia is by first establishing:\n– Low serum calcium and ionized calcium levels,\n– High serum phosphate levels,\n– Low serum pth level,\n– Low vitamin d level,\n– Disturbed renal function tests and\n– Low magnesium levels."
        title: "كل تحليل بيقول إيه؟"
        text: |
          الكتاب بيبدأ بتأكيد: **calcium و ionized calcium واطيين**، **phosphate عالي**، **PTH واطي**، **vitamin D واطي**، **renal function** متلخبطة، و **magnesium واطي**.

          التفسير المقبول (مش في الكتاب)، كل تحليل بيجاوب سؤال:
          - **Ionized calcium**: هو اللي فعلًا بيعمل الأعراض، فهو أدق لو الـ albumin متغيّر.
          - **Phosphate عالي**: لأن الـ PTH هو اللي بيطلّع الـ phosphate في البول؛ لو PTH واطي، الـ phosphate يتحبس. ده بيفرّق الـ hypoparathyroidism عن الـ vitamin D deficiency اللي فيها الـ phosphate غالبًا واطي.
          - **PTH**: واطي يعني المشكلة في الـ parathyroid (بعد عملية أو autoimmune).
          - **Vitamin D و الكلى**: الأسباب الأشيع، والكلية هي اللي بتعمل الـ active vitamin D.
          - **Magnesium**: لأنه لو واطي، الـ PTH مش هيتفرز، وأي كالسيوم هتدّيه مش هيثبت.
      - kind: table
        page: 120
        quote: "Immediate IV injection of 20 ml of 10% Ca gluconate at a rate of 2 ml/min. This could be repeated every 4 hours."
        title: "علاج الـ hypocalcaemia"
        columns: ["Step", "Dose"]
        rows:
          - ["IV if Ca < 7.5", "20 ml 10% Ca gluconate at 2 ml/min, repeat 4-hourly"]
          - ["Intractable", "100 ml 10% Ca gluconate in 1 l D5 every 4 h"]
          - ["Oral", "Ca gluconate 1.5-3 g tds + vit D 50,000-100,000 IU/day"]
          - ["Or", "1,25(OH)2 vitamin D 4 µg/day"]
          - ["Target", "Ca 8-9 mg/dl, check every 3 months + urine Ca"]
          - ["Vit D deficiency", "50,000 IU D2/D3 weekly for 6-8 weeks"]
        hide: [[0, 1], [1, 1], [4, 1]]
      - kind: update
        page: 120
        quote: "Oral therapy with Ca gluconate 1.5-3 g t.d.s. + vitamin D 50,000-100,000 IU/day.\nOral therapy with 1,25 (OH)2 vitamin D 4 µg/day."
        text: "جرعات الكتاب للـ maintenance عالية. الـ guidelines الحالية للـ hypoparathyroidism بتدّي calcium مع **active vitamin D**: ==calcitriol== (عادة **0.25-2 µg/day**) أو alfacalcidol، بدل الـ native vitamin D بجرعات عالية، لأنه بيقعد في الجسم كتير فالـ toxicity بتطوّل، ومعاها hypercalciuria و nephrocalcinosis. الـ native vitamin D بس عشان مستواه يفضل طبيعي، وتابع الـ **urine calcium**. ولو التحكم وحش، فيه PTH replacement: **palopegteriparatide** (US Food and Drug Administration (FDA) 2024). في الامتحان اكتب جرعات الكتاب."
        ref: "ESE clinical guideline on chronic hypoparathyroidism (Bollerslev et al., 2015); Second International Workshop on Hypoparathyroidism (Khan et al., J Bone Miner Res 2022)"
      - kind: reveal
        page: 120
