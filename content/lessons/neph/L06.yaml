schema: batna.lesson/v1
lecture: neph.L06
lessons:
  # ------------------------------------------------------------------
  - id: neph.L06.lesson1
    title: "الميه والصوديوم: مين ماسك الميزان؟"
    hook: "مخك فيه ترموستات للميه، وكليتك فيها مدير للملح. افهمهم الأول، والـ hyponatremia هتبقى سهلة."
    minutes: 8
    pages: [127, 128]
    topics: [water, sodium]
    goals:
      - "تفهم الـ osmoreceptors والـ ADH بيظبطوا الميه إزاي، وليه العطش هو اللي بيكمّل"
      - "تعرف مين في الـ nephron بيرجّع الـ Na وبنسبة قد إيه"
      - "تربط الـ Na بحجم الدم"
    status: unverified
    steps:
      - kind: explain
        page: 127
        title: "ترموستات الميه"
        quote: "BW is mainly regulated by cerebral and peripheral osmoreceptors capable of sensing changes in ECF osmolality"
        text: |
          الجسم عنده ==osmoreceptors== في المخ وبرّه، بتحس بالـ **osmolality** بتاعة الـ extracellular fluid (ECF).

          - الـ osmolality عليت؟ ييجي **عطش** ويتفرز **antidiuretic hormone (ADH)** (vasopressin) من الـ pituitary.
          - الـ osmolality نزلت (شربت ميه كتير)؟ العطش والـ ADH يقفوا، والبول يبقى مخفف، والـ osmolality ترجع **285 mOsmol/kg** في حوالي **6 ساعات**.
          - ناشف؟ ADH يحبس الميه والبول يبقى مركّز جدًا، والعطش هو اللي يعوّض النقص في الآخر.

          الاتنين شغالين مع بعض **علشان** الـ osmolality تفضل ثابتة حوالين 285: الـ ADH بيوفّر الميه، والعطش بيجيبها.
      - kind: figure
        page: 127
        quote: "ADH binds V 2 (vasopressin) receptors on the Basolateral aspect of the principal cells in the collecting duct, leading to translocation of aquaporins to the apical membrane where these water channels allow free water absorption along an osmolar gradient into the hypertonic interstitium."
        title: "الـ ADH بيفتح شبابيك الميه"
        alt: "A collecting duct principal cell. ADH from the blood side binds the V2 receptor on the basolateral membrane; aquaporin channels move to the apical (urine) membrane; water flows from the tubule lumen through the cell into the hypertonic interstitium."
        caption: "الـ ==ADH== بيمسك في **V2** على الناحية الـ basolateral، فالـ **aquaporins** تطلع على الناحية الـ apical، والميه تعدّي للـ interstitium الـ hypertonic."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L06a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="L06b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <rect x="5" y="20" width="85" height="200" rx="6" class="fg-thin"/>
            <text x="47" y="40" text-anchor="middle" class="t-sm t-b">Tubule lumen</text>
            <text x="47" y="56" text-anchor="middle" class="t-sm t-mut">(urine)</text>
            <rect x="100" y="20" width="130" height="200" rx="10" class="fg-box"/>
            <text x="165" y="40" text-anchor="middle" class="t-sm t-b">Principal cell</text>
            <rect x="240" y="20" width="85" height="200" rx="6" class="fg-acc"/>
            <text x="282" y="40" text-anchor="middle" class="t-sm t-b">Interstitium</text>
            <text x="282" y="56" text-anchor="middle" class="t-sm t-mut">(hypertonic)</text>
            <circle cx="232" cy="90" r="9" class="fg-dot-acc"/>
            <text x="282" y="94" text-anchor="middle" class="t-sm t-acc">ADH → V2</text>
            <path d="M222 94 L114 124" class="fg-arrow-acc" marker-end="url(#L06b)"/>
            <rect x="94" y="115" width="14" height="30" rx="3" class="fg-good"/>
            <text x="170" y="138" text-anchor="middle" class="t-sm">aquaporins</text>
            <text x="170" y="152" text-anchor="middle" class="t-sm">move apical</text>
            <path d="M40 175 L300 175" class="fg-arrow" marker-end="url(#L06a)"/>
            <text x="165" y="195" text-anchor="middle" class="t-sm t-b">H2O</text>
            <text x="165" y="211" text-anchor="middle" class="t-sm t-mut">free water reabsorbed</text>
          </svg>
      - kind: reveal
        page: 127
        quote: "ADH binds V 2 (vasopressin) receptors on the Basolateral aspect of the principal cells in the collecting duct, leading to translocation of aquaporins to the apical membrane where these water channels allow free water absorption along an osmolar gradient into the hypertonic interstitium."
        prompt: "ليه الـ ADH بيمسك الـ V2 على الناحية الـ basolateral، والـ aquaporins هي اللي بتطلع على الناحية الـ apical؟"
        answer: |
          الكتاب بيقول الترتيب، والتفسير المقبول (مش في الكتاب) هو الجغرافيا:

          - الـ **ADH** هرمون جاي في الدم، والدم ناحية الـ **basolateral**، فطبيعي الـ receptor يبقى هناك.
          - الميه اللي عايزين نرجّعها موجودة في البول جوّه الـ tubule، يعني ناحية الـ **apical**، فالشبابيك (==aquaporins==) لازم تتفتح هناك.

          والميه بتعدّي لوحدها من غير طاقة، لأن الـ **interstitium hypertonic**: الـ osmolar gradient هو اللي بيشدّها.
      - kind: explain
        page: 127
        title: "الكلية بتوفّر، والعطش هو اللي بيعوّض"
        quote: "With water depletion, osmoreceptors sense increase osmolality, trigger ADH release, retain water, with (highly) concentrated urine. Increased thirst eventually corrects the absolute water deficit."
        text: |
          بص على الحالتين اللي في الكتاب:

          - **ميه زيادة**: الـ osmolality بتنزل، العطش والـ ADH يقفوا، والبول يبقى مخفف لحد ما ترجع ==285 mOsmol/kg== في حوالي **6 ساعات**.
          - **ميه ناقصة**: الـ ADH يحبس الميه والبول يبقى مركّز جدًا، بس اللي **يصلّح العجز فعلًا** هو العطش.

          ليه العطش هو اللي بيكمّل؟ التفسير المقبول (مش في الكتاب): الكلية تقدر **تقلل الخسارة** بس، ما تقدرش تعمل ميه من العدم. أقصى حاجة البول يبقى قليل ومركّز، والعجز المطلق ما يتعوّضش غير لما **تشرب**.

          وعلشان كده العيان اللي **مش قادر يشرب** (غيبوبة، intubation، رضيع) هو اللي هتشوفه بعدين في الـ ==hypernatremia==.
      - kind: order
        page: 127
        quote: "Increase osmolality triggers thirst and pituitary ADH (vasopressin) release."
        prompt: "واحد ماشي في الشمس ومشربش. رتّب اللي بيحصل من أول ما الـ osmolality تعلى:"
        steps:
          - "Osmoreceptors sense the rise in ECF osmolality"
          - "Thirst and pituitary ADH release"
          - "ADH binds V2 on the principal cell"
          - "Aquaporins move to the apical membrane"
          - "Free water reabsorbed; concentrated urine"
        why: "الحسّاس الأول، بعدين الرسالة (ADH)، بعدين الـ receptor، بعدين الشبابيك، وفي الآخر بول مركّز. والعطش شغال بالتوازي علشان يعوّض الميه اللي خلاص راحت."
      - kind: explain
        page: 128
        title: "الصوديوم: الكلية هي المدير"
        quote: "Absorption: throughout the GI system via active Na, K-ATPase system. Kidneys are the principal regulator:"
        text: |
          الـ Na الطبيعي **135–145 mEq/L**، وهو ==principal active solute== اللي ماسك حجم الدم والـ interstitium.

          بيتمص من الأمعاء كلها بالـ Na/K-ATPase، لكن **الكلية هي المدير**:
          - **proximal convoluted tubule (PCT)**: يرجّع **2/3** الـ Na المترشح.
          - **Loop of Henle**: الـ countercurrent system للـ Na والميه.
          - **distal convoluted tubule (DCT) والـ collecting duct**: الـ ==aldosterone== بيرجّع زيادة.

          والـ Na مهم كده **لأن** الميه بتمشي وراه، وده اللي هنفصّله بعد خطوة.
      - kind: explain
        page: 127
        title: "ليه الـ Na هو اللي ماسك الحجم؟"
        quote: "Principle active solute for the maintenance of intravascular & interstitial volume."
        text: |
          الكتاب بيقول الـ Na هو ==principal active solute== للـ intravascular والـ interstitial volume، وإن تغيّر الـ serum Na بيعكس تغيّر في الـ total body Na.

          التفسير المقبول (مش في الكتاب): **الميه بتمشي ورا الـ Na**. الـ Na أغلبه برّه الخلايا، فكل ما الجسم يحبس Na، يحبس ميه معاه، والـ ECF يكبر. وكل ما يفقد Na، الحجم يصغر.

          وتقسيم الشغل في الكلية منطقي على نفس الفكرة:
          - الـ **PCT** بيرجّع الكمية الكبيرة (**2/3**) من غير ما يسأل كتير، زي البوابة الرئيسية.
          - الـ **loop of Henle** بالـ ==countercurrent system== هو اللي بيعمل الـ interstitium الـ hypertonic اللي الـ ADH محتاجه علشان يرجّع ميه.
          - الـ **aldosterone** في الـ DCT والـ collecting duct هو **الضبط الدقيق** في الآخر: الجسم ناقص ملح؟ يفتحه شوية.
      - kind: check
        page: 128
        quote: "2/3 of filtered Nat is reabsorbed by the proximal convoluted tubule."
        question: "Where is most of the filtered sodium reabsorbed?"
        options:
          - "Proximal convoluted tubule"
          - "Loop of Henle"
          - "Distal convoluted tubule"
          - "Collecting duct"
        answer: 0
        why:
          - "صح: الـ PCT بيرجّع 2/3 الـ Na المترشح."
          - "الـ loop شغلته الـ countercurrent system للـ Na والميه، مش أكبر نسبة."
          - "الـ DCT فيه الضبط الدقيق بالـ aldosterone، كمية صغيرة."
          - "الـ collecting duct آخر محطة، برضه بالـ aldosterone، كمية صغيرة."
      - kind: aside
        tone: analogy
        page: 128
        quote: "Aldosterone stimulates further Nat re-absorption at the distal convoluted tubules & the collecting ducts."
        text: "تخيّل محطة ميه: الـ **PCT** هو السد الكبير اللي بيرجّع معظم الميه، والـ **loop** هو الطلمبة اللي بتعمل الضغط، والـ ==aldosterone== هو المحبس الصغير في آخر الماسورة اللي بتظبط بيه الكمية بالنقطة."
      - kind: try
        items: [neph.L06.001, neph.L06.003, neph.L06.004, neph.L06.008, neph.L06.009]
    recap:
      - "الـ osmoreceptors بتشغّل العطش والـ ADH؛ الـ ADH على V2 (basolateral) بيطلّع الـ aquaporins على الـ apical."
      - "الميه بتعدّي لوحدها للـ interstitium الـ hypertonic."
      - "ميه زيادة: البول يتخفف ويرجع 285 في 6 ساعات. ميه ناقصة: الـ ADH يوفّر، والعطش بس اللي يعوّض."
      - "Na طبيعي 135–145، والميه بتمشي وراه: هو ماسك حجم الدم والـ interstitium."
      - "الكلية المدير: PCT 2/3، الـ loop للـ countercurrent، والـ aldosterone الضبط الأخير."
    practice: [neph.L06.001, neph.L06.002, neph.L06.003, neph.L06.004, neph.L06.005, neph.L06.006, neph.L06.007, neph.L06.008, neph.L06.009, neph.L06.010]
