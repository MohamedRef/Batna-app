  - id: endo.L01.lesson3
    title: "باقي أورام الـ islets: كل واحد ليه بصمة"
    hook: "سكر واطي، طفح جلدي، إسهال 10 لتر، حصوات مرارة. كل هرمون زيادة بيسيب بصمته."
    minutes: 9
    pages: [5, 8]
    topics: [insulinoma, other-islet, men1-other, men1-ddx]
    goals:
      - "تتعرف على كل islet tumor من الأعراض"
      - "تعرف علاج الـ insulinoma من الأول للآخر"
      - "تعرف الـ mimics اللي ممكن تلبّسك MEN 1"
    status: unverified
    steps:
      - kind: explain
        page: 5
        quote: "Insulinoma\n  Patient develop hypoglycemia after fasting or exertion; improve with glucose intake & inappropriately elevated insulin.\n  90% solitary and benign.\n  Head, body and tail pancreas.\n  Malignancy - size > 6cm or liver/nodal mets."
        title: "Insulinoma"
        text: |
          **Hypoglycemia after fasting or exertion**، بتتحسن بالـ glucose، مع ==inappropriately elevated insulin==.

          - **90%** solitary و benign.
          - في الـ head أو body أو tail.
          - **Malignancy** لو الحجم أكبر من **6 cm** أو في liver/nodal mets.
      - kind: reveal
        page: 5
        quote: "Insulinoma\n  Patient develop hypoglycemia after fasting or exertion; improve with glucose intake & inappropriately elevated insulin.\n  90% solitary and benign.\n  Head, body and tail pancreas.\n  Malignancy - size > 6cm or liver/nodal mets."
        prompt: "ليه كلمة inappropriately هي مفتاح التشخيص؟"
        answer: "الطبيعي إن الـ insulin يقفل خالص لما السكر يقع. لو السكر واطي والـ insulin لسه عالي (أو حتى normal)، يبقى في حد بيفرزه غصب عن الجسم: ورم."
      - kind: order
        page: 5
        quote: "Medical Treatment\n  Control Symptoms prior to surgery.\n  Frequent small CHO meals until operated.\n  Octreotide therapy."
        prompt: "رتّب خطة علاج insulinoma خبيث:"
        steps:
          - "Control symptoms: frequent small CHO meals + octreotide"
          - "Curative surgery: Whipple's or subtotal pancreatectomy, excise liver mets"
          - "Palliation if metastatic: chemo, chemoembolization, ablation"
