            <text x="10" y="190" class="t-sm">Vascular</text><rect x="150" y="177" width="70" height="18" rx="4" class="fg-dot-good"/><text x="230" y="191" class="t-sm t-b">1</text>
            <text x="10" y="222" class="t-sm">Pathergy test</text><rect x="150" y="209" width="70" height="18" rx="4" class="fg-dot-good"/><text x="230" y="223" class="t-sm t-b">1</text>
          </svg>
      - kind: update
        page: 157
        quote: "Ocular lesions 2 Genital aphthosis 2 Oral aphthosis 2 Skin lesions 1 Neurological manifestations 1 Vascular manifestations 1"
        text: "جدول الكتاب (ocular lesions 2، genital 2، oral 2، skin 1، neurological 1، vascular 1، pathergy 1) من غير cut-off. الـ ICBD 2014 بيصنّف Behçet عند score 4 أو أكتر."
        ref: "International Criteria for Behçet's Disease (ICBD) 2014"
      - kind: explain
        page: 158
        title: "العين والمفاصل والعلاج"
        quote: "Blindness has been reported to occur within 4-5 years from the onset of ocular symptoms. Retinal vein thrombosis leading to sudden blindness is not rare."
        text: |
          - العين غالبًا من البداية. النظر يقل من **secondary glaucoma**، cataract أو vitreous haemorrhage
          - ==Blindness خلال 4–5 سنين==، و **retinal vein thrombosis** مش نادرة
          - المفاصل: **أكتر من النص**، multiple joints. في الأطفال الـ arthritis أشهر minor feature (11 من 40)
          - العلاج: aphthous ← ==colchicine، thalidomide==؛ العين ← **azathioprine**؛ وكمان cyclosporine
      - kind: check
        page: 157
        quote: "Positive pathergy test - An erythematous papule larger than 2 mm at the prick site 48 hours after the application"
        question: "Oral ulcers 5 times this year + genital scarring + positive pathergy. 1990 criteria met?"
        options:
          - "Yes: oral ulcers + 2 minor"
          - "No: eye disease is required"
          - "No: 3 minor criteria are needed"
          - "No: pathergy does not count"
        answer: 0
        why:
          - "صح: الـ oral ulcers + اتنين (genital + pathergy)."
          - "العين واحدة من الـ minor مش شرط."
          - "اتنين بس كفاية."
          - "الـ pathergy من الـ criteria."
      - kind: explain
        page: 159
        title: "PACNS: 7 heuristics"
        quote: "No diagnosis of PACNS should be made in the absence of a lumbar puncture to rule out infection and malignancy."
        text: |
          Neuro deficit مكتسب مش مفسّر + angiography أو histology فيها angiitis في الـ CNS + مفيش systemic vasculitis.
          1. مفيش صورة مميزة؛ اشتبه مع **strokes متعددة في territories مختلفة** أو CSF فيه **chronic meningitis**
          2. ==No LP = no diagnosis==
          3. **MRI** حساس بس مش specific
          4. مفيش angiography **100% specific**
          5. ==Brain biopsy== بتأكد وتستبعد الـ mimics
          6. الـ must-rule-outs: **infection و malignancy**
          7. مفيش استجابة لـ **cyclophosphamide** ← فكّر في تشخيص تاني
      - kind: explain
        page: 160
        title: "Buerger"
        quote: "Non necrotizing vasculitis. Cause unknown. Affects all populations...19-45 years. Arms and legs.....claudication."
        text: |
          **Thromboangiitis obliterans:** non-necrotizing، **19–45** سنة، الدراعين والرجلين و claudication، ممكن amputation بس ==not lethal==.

          الكتاب كاتب العلاج "**alcohol** abstinence".
      - kind: update
        page: 160
        quote: "RX = alcohol abstinence."
        text: "الـ Buerger مرتبط بالتدخين، والعلاج الوحيد المثبت هو بطّل أي tobacco تمامًا. كلمة alcohol غالبًا غلطة في الكتاب؛ في الامتحان لو السؤال نقل كلام الكتاب اكتبه، وفي العيادة: smoking cessation."
        ref: "Standard references (e.g., Harrison's 21e, 2022)"
