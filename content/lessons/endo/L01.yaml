        caption: |-
          على الشمال: الغدة الدرقية (الخط المتقطع) والأربع ==parathyroid glands== كلهم أحمر، لأن في MEN 1 الأربعة مريضين مش واحدة بس. علشان كده بنشيل **كل** الـ parathyroid tissue من الرقبة.

          السهم بيودّي حتة صغيرة من النسيج (النقط) تتزرع في الـ ==non-dominant forearm==، فالمريض ما يقعش في hypoparathyroidism، ولو الحتة دي اشتغلت زيادة بعدين نشيل منها من الدراع من غير ما نفتح الرقبة تاني.

          والشريط اللي تحت هو مقياس النجاح: الـ PTH بعد العملية **أقل من 50% من الـ basal**.
