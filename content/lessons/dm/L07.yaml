  - id: dm.L07.lesson4
    title: "الطيف والعلاج: نرجّع الأعصاب؟"
    hook: "LF و HF مش موجات راديو، دي بصمة الـ sympathetic والـ vagus. وبعدها: مية وشراب وpyridostigmine."
    minutes: 8
    pages: [85, 88]
    topics: [advanced, treatment]
    goals:
      - "تقرأ الـ spectral analysis"
      - "تعرف الـ neurovascular flow والـ radionuclide imaging"
      - "تعالج الـ orthostatic hypotension والـ perioperative risk"
      - "تعرف إيه اللي ممكن يعكس الـ CAN"
    status: unverified
    steps:
      - kind: explain
        page: 85
        title: "الـ spectral analysis"
        quote: "The power spectrum reflects the amplitude of the heart rate fluctuations present at different oscillation frequencies."
        text: |
          الـ **power spectrum** بيوريك ==amplitude== تذبذب الـ HR عند كل **frequency**:
          - **VLF**: vasomotor tone (**thermoregulation**)
          - **LF ~0.1 Hz**: **baroreceptor reflex**
          - **HF ~0.25 Hz**: **respiratory activity**
