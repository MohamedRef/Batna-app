  - id: rheum.L02.046
    kind: card
    topic: acute
    front: What skin change is common as a gout attack subsides?
    back: Pruritus and desquamation of the overlying skin.
    src: { page: 33, quote: "As attack subsides pruritus and desquamation of overlying skin are common." }
    status: unverified
  - id: rheum.L02.047
    kind: card
    topic: acute
    front: Main differential diagnosis of an acute gout attack?
    back: Septic arthritis, infective cellulitis, or another crystal disease.
    src: { page: 33, quote: "Main differential diagnosis septic arthritis, infective cellulitis or another crystal disease." }
    status: unverified
  - id: rheum.L02.048
    kind: card
    topic: acute
    front: How may atypical gout attacks present?
    back: As bursitis, tenosynovitis or cellulitis.
    src: { page: 33, quote: "Atypical attacks may also manifest as bursitis, tenosynovitis or cellulitis." }
    status: unverified
  - id: rheum.L02.049
    kind: card
    topic: acute
    front: What are intercritical periods, and when does the second attack usually occur?
    back: Asymptomatic periods between attacks; in most patients a second attack occurs within 1 year (some never have one, others after years).
    src: { page: 33, quote: "In most a second attack occurs within 1 year." }
    status: unverified
  - id: rheum.L02.050
    kind: card
    topic: acute
    front: Average interval from the first attack to chronic symptoms, and its main determinant?
    back: About 10 years; the main determinant is the uric acid level (the higher it is, the earlier and more severe the damage).
    src: { page: 33, quote: "The interval between the first and the development of chronic symptoms is variable, but averages around 10 years." }
    status: unverified
    tags: [numbers]
  - id: rheum.L02.051
    kind: mcq
    topic: acute
    stem: "A 45-year-old man wakes at 4 am with an exquisitely painful, red, shiny, swollen big toe; he cannot bear the bed sheet on it. By evening it is at its worst. Untreated, how long is this attack expected to last?"
    options: [5-14 days, 1-3 weeks, 6-12 weeks, Lifelong without treatment]
    answer: 0
    why:
      - "Correct: typical gout attacks are self-limiting over 5-14 days."
      - "1-3 weeks is the book's figure for an acute pseudogout attack."
      - "That is far too long for a single gout flare."
      - "Single attacks are self-limiting; chronic disease takes about 10 years to develop."
    src: { page: 32, quote: "Self-limiting over 5-14 days with complete return to normality." }
    status: unverified
  # ---------- p34-35: chronic and kidney ----------
  - id: rheum.L02.052
    kind: card
    topic: chronic
    front: Where do tophi form in chronic tophaceous gout?
    back: At the usual nodule sites around extensor surfaces of fingers, hands, elbows and forearm, the Achilles tendon and the helix of the ear.
    src: { page: 34, quote: "around extensor surfaces of fingers, hands, elbows and forearm. Achilles tendon and helix of the ear." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L02.053
    kind: card
    topic: chronic
    front: What distribution feature is characteristic of tophi and damaged joints in chronic gout?
    back: Marked asymmetry, both locally and between sides.
    src: { page: 34, quote: "Marked asymmetry, both locally and between sides is characteristic." }
    status: unverified
    tags: [exam-trap]
  - id: rheum.L02.054
    kind: card
    topic: chronic
    front: What do untreated tophi look like and do?
    back: They enlarge into knobbly white nodules (chalky under the skin) that may ulcerate, discharging white gritty material with local inflammation.
    src: { page: 34, quote: "Nodules are white may ulcerate discharging white gritty material and associated with local inflammation (erythema and pus)." }
    status: unverified
  - id: rheum.L02.055
    kind: card
    topic: chronic
    front: Which joints most often show damage and synovitis in chronic tophaceous gout?
    back: First MTP joint, midfoot, finger joints and wrists.
    src: { page: 34, quote: "Joints most commonly involved with signs of damage and synovitis are the first MTP joint, midfoot, finger joints and wrists" }
    status: unverified
  - id: rheum.L02.056
    kind: cloze
