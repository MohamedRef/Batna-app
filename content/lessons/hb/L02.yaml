          في الـ pathway ده الـ LSM عنده رقمين: 8 و 12 kPa. ما تخلطهمش بمسطرة الـ Metavir (7، 9.5، 12.5) ولا بالـ Vizzutti (6 و 12.5).

          القاعدة اللي تمشي بيها في سؤال **non-alcoholic fatty liver disease (NAFLD)**: 8 kPa هي باب الـ rule-out، زي ما شفناها في الدرس الأول.
