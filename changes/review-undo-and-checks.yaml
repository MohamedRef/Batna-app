# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: new
  ar_eg: زرار «تراجع» في جلسة المذاكرة بيرجّع آخر تقييم بجد، فالسؤال بيرجعلك وميعاد مراجعته بيرجع زي ما كان، على كل أجهزتك
  en: Undo in a study session really takes the last rating back, so the item returns and its schedule is restored on every device
- kind: improved
  ar_eg: تقييم تذكّرك بقى اسمه «افتكرتها قد إيه؟»، و«مراجعة صحة المحتوى» بقت في مربع لوحدها عشان الاتنين ما يتلخبطوش
  en: The memory rating is now titled "how well did you remember it?", and the content check sits in its own box so the two never mix
