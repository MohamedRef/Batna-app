        items: [hem.L07.067, hem.L07.070, hem.L07.076, hem.L07.077, hem.L07.080]
    recap:
      - "بعد الـ CR: أهم هدف منع الرجوع. تحت 60: consolidation × 3، auto، أو allo (unfavorable cytogenetics)."
