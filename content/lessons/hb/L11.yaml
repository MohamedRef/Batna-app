lecture: hb.L11
lessons:
  # ------------------------------------------------------------------
  - id: hb.L11.lesson1
    title: "إمتى نزرع كبد؟"
    hook: "الـ decompensation بتقص العمر من 12 سنة لسنتين. السؤال مش «نزرع ولا لأ»، السؤال «إمتى بالظبط»."
    minutes: 9
    pages: [188, 189]
    topics: [timing, indications, meld-exceptions]
    goals:
      - "تقول إمتى المريض يتحوّل لتقييم الزرع حسب AASLD"
      - "تعرف الـ MELD معمول من إيه، واتعمل ليه أصلًا"
      - "تعدّ indications الـ LDLT في Child C وقواعد الـ listing بالأرقام"
      - "تعرف ليه فيه أمراض بتاخد MELD exception points"
    status: unverified
    steps:
      - kind: explain
        page: 188
        title: "الرقم اللي يخضّ"
        quote: "the development of decompansation is associated with a decreased median survival from greater than 12 years to 2 years"
        text: |
          الـ compensated cirrhosis ممكن تعيش معاها **أكتر من 12 سنة** (median survival). أول ما يحصل **decompensation** (ascites، variceal bleeding، HE، jaundice) الرقم بينزل لـ **سنتين بس**.

          علشان كده الـ decompensation هي جرس الإنذار الأول اللي بيقول: «ابدأ فكّر في الزرع».

          والكتاب بيقول كمان إن كل transplant program ليه **program specific guidelines** خاصة بيه، واللي جاي ده هو بروتوكول البرنامج اللي في الكتاب.
      - kind: figure
        page: 188
        title: "التوقيت المثالي"
        alt: "A graph of risk against time. The risk of dying from liver disease starts low and rises steeply after decompensation. The risk of dying from the operation rises slowly. Where the two lines cross is marked as the ideal timing of transplantation."
        caption: "الخط الأحمر: خطر الموت من المرض. الخط التاني: خطر الموت من العملية. **الزرع المثالي** لما الأحمر يعدّي التاني."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L11a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <text x="165" y="18" text-anchor="middle" class="t-b t-lg">When to transplant?</text>
            <path d="M30 230V40" class="fg-arrow" marker-end="url(#L11a)"/>
            <path d="M30 230H318" class="fg-arrow" marker-end="url(#L11a)"/>
            <text x="36" y="48" class="t-sm t-mut">risk of death</text>
            <text x="316" y="248" text-anchor="end" class="t-sm t-mut">time</text>
            <polyline points="30,215 120,205 190,175 240,135 290,85 315,60" class="fg-arrow-bad"/>
            <polyline points="30,140 315,155" class="fg-arrow-acc"/>
            <text x="300" y="56" text-anchor="end" class="t-sm t-bad t-b">dying of the liver disease</text>
            <text x="34" y="132" class="t-sm t-acc t-b">dying of the operation</text>
            <path d="M150 230V100" class="fg-thin"/>
            <text x="150" y="262" text-anchor="middle" class="t-sm">decompensation</text>
            <text x="150" y="276" text-anchor="middle" class="t-sm t-mut">survival: &gt;12 y to 2 y</text>
            <circle cx="225" cy="147" r="7" class="fg-dot-good"/>
            <rect x="178" y="176" width="146" height="38" rx="6" class="fg-good"/>
            <text x="251" y="192" text-anchor="middle" class="t-sm t-b">Ideal timing:</text>
            <text x="251" y="206" text-anchor="middle" class="t-sm">disease risk &gt; surgery risk</text>
          </svg>
      - kind: reveal
        page: 188
        prompt: "طب ليه منزرعش بدري «احتياطي»؟ وليه منستناش لحد آخر لحظة؟"
        answer: |
          الكتاب بيقول التوقيت المثالي لما **risk of dying from the liver disease** يبقى **أكبر من** **risk of dying from the surgical procedure**.

          - **بدري قوي:** بتعرّض واحد كان هيعيش سنين لخطر عملية كبيرة و immunosuppression طول العمر من غير داعي.
          - **متأخر قوي:** المريض بيبقى أضعف من إنه يستحمل العملية، فبتخسره على الترابيزة.

          (السببين دول منطق مقبول، الكتاب كاتب القاعدة بس.)
      - kind: explain
        page: 188
        title: "إمتى نبدأ التقييم؟ و MELD ده إيه؟"
        text: |
          **AASLD** بتقول ابدأ **candidate evaluation** لما يحصل واحدة من التلاتة:

          - **decompensation**
          - **CTP score ≥ 7**
          - **MELD score ≥ 10**

          الـ **MELD** بيقيس **«sickness of the liver»**، وهو رقم محسوب من **serum bilirubin** و **INR** و **creatinine**.

          اتعمل أصلًا في **Mayo Clinic** (Rochester, Minnesota) علشان **يتوقع الـ survival بعد TIPS** في الـ cirrhosis، وبعدين اتعمل بيه **organ allocation** من **February 2002**.
      - kind: mnemonic
        page: 188
        word: "BIC"
        parts:
          - { key: "B", text: "Bilirubin (serum)" }
          - { key: "I", text: "INR" }
          - { key: "C", text: "Creatinine" }
        hook: |
          الـ MELD زي **قلم BIC** الأزرق: أرخص حاجة في الشنطة، بس هو اللي بيكتب مين ياخد الكبد الأول. ✍️
      - kind: aside
        tone: joke
        page: 188
        text: |
          الـ MELD اتولد في Mayo Clinic علشان يجاوب سؤال صغير: «المريض ده هيعيش بعد الـ TIPS؟»

          وبعدين لقى نفسه بيوزّع الأكباد على أمريكا كلها. زي واحد دخل الشغل «مساعد مؤقت» وطلع بعد كام سنة المدير العام. 😄

          **الممتحن بيحب السؤال ده:** الـ MELD اتعمل originally لإيه؟ **TIPS.**
      - kind: check
        page: 188
        question: "A compensated cirrhotic (no ascites, bleeding or HE) has CTP 6 and MELD 11. Per AASLD in the book, what now?"
        options:
          - "Start transplant candidate evaluation"
          - "Wait until the first decompensation"
          - "Wait until CTP reaches 10 (Child C)"
          - "Wait until MELD reaches 15"
        answer: 0
        why:
          - "صح: **MELD ≥ 10** لوحده كفاية علشان يبدأ التقييم، حتى من غير decompensation ولا CTP ≥ 7."
          - "الـ decompensation واحدة من التلاتة، مش شرط. الـ MELD 11 كفاية."
          - "CTP ≥ 7 هو اللي يبدأ التقييم، مش 10. وهنا أصلًا الـ MELD كفّى."
          - "MELD 15 ده رقم **الزرع** في البرنامج، مش رقم بداية **التقييم**."
      - kind: mnemonic
        page: 189
        word: "PHASE C"
        parts:
          - { key: "P", text: "Portal hypertension: bleeding varices and/or intractable ascites" }
          - { key: "H", text: "Hyperbilirubinemia" }
          - { key: "A", text: "Albumin falling and PT rising: synthetic dysfunction" }
          - { key: "S", text: "Sick of life: unacceptable quality of life (weakness, malaise, cholestasis, itching)" }
          - { key: "E", text: "Encephalopathy: recurrent HE" }
          - { key: "C", text: "CTP score C (10-15): the frame for all of the above" }
        hook: |
          المريض دخل **«PHASE C»**: المرحلة اللي فيها Child C، وكل حرف indication من الخمسة اللي في الكتاب لـ LDLT في ESLD.
      - kind: explain
        page: 189
        title: "قواعد البرنامج بالأرقام"
        text: |
          - **Child B** (CPS > 7): بيتعمله **listing بس من غير زرع**، لحد ما يبقى **Child C** أو **MELD 15**.
          - **MELD ≥ 15:** بنزرع.
          - **MELD > 30:** **case by case**.
          - **MELD < 15:** بنزرع **لو** فيه **refractory ascites** أو **repeated HE**.

          يعني الـ MELD هو البوابة، بس فيه حالتين بيعدّوا من الباب الجانبي: الـ ascites اللي مش بتخلص، والـ HE اللي بتتكرر. الاتنين بيبوّظوا حياة المريض مع إن رقم الـ MELD «شكله كويس».
      - kind: aside
        tone: trap
        page: 189
        text: |
          الكتاب قال «We do not transplant child B patients» وفي نفس الصفحة «We transplant patients with MELD < 15 if they have refractory ascites or repeated HE». مريض Child B عنده repeated HE يدخل في الاتنين!

          في الامتحان: لو السؤال عن **MELD < 15 + refractory ascites أو repeated HE** جاوب **بنزرع**. ولو عن Child B من غير كده: **listed but not transplanted**.
      - kind: figure
        page: 189
        title: "مسطرة الـ MELD"
        alt: "A vertical MELD ruler from 6 to 40. At 10: AASLD evaluation starts. Below 15: transplant only for refractory ascites or repeated HE. At 15 and above: transplant. Above 30: case by case."
        caption: "10 = ابدأ التقييم. 15 = ازرع. فوق 30 = نقعد نتناقش. وتحت 15 فيه باب جانبي: refractory ascites أو repeated HE."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="18" text-anchor="middle" class="t-b t-lg">The MELD ruler (book program)</text>
            <rect x="40" y="36" width="34" height="300" rx="6" class="fg-box"/>
            <rect x="40" y="36" width="34" height="75" rx="6" class="fg-bad"/>
            <rect x="40" y="111" width="34" height="112" class="fg-good"/>
            <rect x="40" y="223" width="34" height="113" rx="6" class="fg-acc"/>
            <text x="34" y="40" text-anchor="end" class="t-sm t-mut">40</text>
            <path d="M74 111h20" class="fg-ink"/>
            <text x="34" y="115" text-anchor="end" class="t-sm t-b">30</text>
            <path d="M74 223h20" class="fg-ink"/>
            <text x="34" y="227" text-anchor="end" class="t-sm t-b">15</text>
            <path d="M74 279h20" class="fg-ink"/>
            <text x="34" y="283" text-anchor="end" class="t-sm t-b">10</text>
            <text x="34" y="340" text-anchor="end" class="t-sm t-mut">6</text>
            <text x="102" y="70" class="t-sm t-bad t-b">MELD &gt; 30</text>
            <text x="102" y="86" class="t-sm">discussed case by case</text>
            <text x="102" y="160" class="t-sm t-good t-b">MELD ≥ 15</text>
            <text x="102" y="176" class="t-sm">we transplant</text>
            <text x="102" y="240" class="t-sm t-acc t-b">MELD &lt; 15</text>
            <text x="102" y="256" class="t-sm">only if refractory ascites</text>
            <text x="102" y="270" class="t-sm">or repeated HE</text>
            <rect x="98" y="290" width="222" height="40" rx="6" class="fg-acc"/>
            <text x="106" y="306" class="t-sm t-b">MELD ≥ 10 or CTP ≥ 7 or decompensation</text>
            <text x="106" y="322" class="t-sm">AASLD: start candidate evaluation</text>
          </svg>
      - kind: explain
        page: 189
        title: "MELD exception points: ليه الرقم ساعات بيكدب؟"
        text: |
          الـ MELD بيبص على **bilirubin و INR و creatinine** بس. فيه أمراض بتموّت المريض من طريق تاني خالص والتلاتة دول لسه كويسين، فبنديلها **exception points** علشان متتظلمش في الطابور.

          الكتاب بيعدّ **10**:

          - **HCC**
          - **Hepatopulmonary syndrome** و **Portopulmonary hypertension** (الرئة)
          - **Recurrent cholangitis** و **Intractable pruritus** (المرارة والحكة)
          - **Budd-Chiari syndrome**
          - **Cystic fibrosis** و **Familial amyloidosis** و **Polycystic liver disease**
          - **Small for size syndrome** (بعد زرع graft صغير)
      - kind: sort
        page: 189
        prompt: "مين في قائمة الـ MELD exception points اللي في الكتاب، ومين لأ؟"
        bins: ["MELD exception (book list)", "Not on the list"]
        cards:
          - { text: "Hepatopulmonary syndrome", bin: 0 }
          - { text: "Recurrent cholangitis", bin: 0 }
          - { text: "Small for size syndrome", bin: 0 }
          - { text: "Familial amyloidosis", bin: 0 }
          - { text: "Intractable pruritus", bin: 0 }
          - { text: "Refractory ascites", bin: 1 }
          - { text: "Repeated hepatic encephalopathy", bin: 1 }
          - { text: "Hepatorenal syndrome", bin: 1 }
        why: "الـ refractory ascites والـ repeated HE مش exception points؛ دول بيخلّونا **نزرع تحت MELD 15**. والـ HRS بيرفع الـ creatinine فالـ MELD شايفه لوحده، وفي الكتاب هو **high risk factor** (الدرس التالت)."
      - kind: try
        items: [hb.L11.003, hb.L11.008, hb.L11.010, hb.L11.015, hb.L11.011]
    recap:
      - "Decompensation: الـ median survival من **> 12 سنة لسنتين**."
      - "AASLD: ابدأ التقييم عند **decompensation أو CTP ≥ 7 أو MELD ≥ 10**."
      - "MELD = **BIC** (bilirubin، INR، creatinine)، اتعمل في Mayo علشان **TIPS**، واتعمل بيه allocation من **2002**."
      - "التوقيت المثالي: خطر المرض أكبر من خطر العملية."
      - "Indications في Child C: **PHASE C**. نزرع عند **MELD ≥ 15**، وتحت 15 لو refractory ascites أو repeated HE، وفوق 30 case by case."
      - "الـ MELD exception points عشرة، أولها HCC."
    practice: [hb.L11.001, hb.L11.002, hb.L11.003, hb.L11.004, hb.L11.005, hb.L11.006, hb.L11.007, hb.L11.008, hb.L11.009, hb.L11.010, hb.L11.011, hb.L11.015, hb.L11.016, hb.L11.017, hb.L11.051, hb.L11.052, hb.L11.061, hb.L11.065]
  # ------------------------------------------------------------------
  - id: hb.L11.lesson2
    title: "مين كمان يستاهل كبد جديد؟"
    hook: "الـ HCC لازم يعدّي 4 بوابات، والعيال ليهم قايمة لوحدهم أولها biliary atresia."
    minutes: 8
    pages: [190, 191]
    topics: [hcc, indications, pediatric]
    goals:
      - "تعدّ الـ 4 شروط علشان مريض HCC يتقبل للـ LDLT"
      - "تعرف يعني إيه bridging therapy وليه"
      - "تقسّم باقي الأمراض اللي بتتعالج بالزرع لمجموعاتها"
      - "تعدّ الـ pediatric indications ومين أشهرهم"
    status: unverified
    steps:
      - kind: explain
        page: 190
        title: "الـ HCC: أهم exception"
        text: |
          علشان مريض الـ **HCC** يدخل الزرع لازم الأربعة دول:

          - **Within accepted criteria:** **Milan** و **San Francisco** criteria.
          - **No extrahepatic spread:** بـ **normal CT chest** و **bone scan**.
          - **No macrovascular invasion** في radiological work up كامل.
          - **AFP < 400 ng/ml**.

          والمنطق: الزرع بيشيل الكبد كله. لو الورم **جوه** الكبد بس، شلته معاه. لو **برّه** الكبد، الكبد الجديد مش هيعالجه.
      - kind: figure
        page: 190
        title: "أربع بوابات"
        alt: "A vertical flow of four gates for an HCC patient: within Milan or San Francisco criteria, no extrahepatic spread on CT chest and bone scan, no macrovascular invasion, AFP below 400 ng/ml. Passing all four leads to listing with locoregional bridging therapy while waiting. Failing any gate leads to not eligible."
        caption: "يعدّي الأربعة كلهم → يتعمله listing و **bridging** لحد ما الـ donor يتوفر. يقع في واحدة → مش هيتزرع."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L11b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="L11c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="70" y="8" width="150" height="30" rx="15" class="fg-ink"/>
            <text x="145" y="28" text-anchor="middle" class="t-b">HCC in cirrhosis</text>
            <path d="M145 38v16" class="fg-arrow" marker-end="url(#L11b)"/>
            <rect x="20" y="58" width="220" height="44" rx="6" class="fg-acc"/>
            <text x="30" y="76" class="t-sm t-b">1. Within accepted criteria</text>
            <text x="30" y="92" class="t-sm">Milan and San Francisco</text>
            <path d="M145 102v16" class="fg-arrow" marker-end="url(#L11b)"/>
            <rect x="20" y="122" width="220" height="44" rx="6" class="fg-acc"/>
            <text x="30" y="140" class="t-sm t-b">2. No extrahepatic spread</text>
            <text x="30" y="156" class="t-sm">normal CT chest and bone scan</text>
            <path d="M145 166v16" class="fg-arrow" marker-end="url(#L11b)"/>
            <rect x="20" y="186" width="220" height="44" rx="6" class="fg-acc"/>
            <text x="30" y="204" class="t-sm t-b">3. No macrovascular invasion</text>
            <text x="30" y="220" class="t-sm">on a devoted radiological work up</text>
            <path d="M145 230v16" class="fg-arrow" marker-end="url(#L11b)"/>
            <rect x="20" y="250" width="220" height="44" rx="6" class="fg-acc"/>
            <text x="30" y="268" class="t-sm t-b">4. AFP &lt; 400 ng/ml</text>
            <text x="30" y="284" class="t-sm">tumour biology still acceptable</text>
            <path d="M240 80h40v234" class="fg-arrow-bad"/>
            <path d="M240 144h40M240 208h40M240 272h40" class="fg-arrow-bad"/>
            <path d="M280 314v10" class="fg-arrow-bad" marker-end="url(#L11c)"/>
            <rect x="248" y="328" width="76" height="40" rx="6" class="fg-bad"/>
            <text x="286" y="345" text-anchor="middle" class="t-sm t-b">any fails:</text>
            <text x="286" y="360" text-anchor="middle" class="t-sm">not eligible</text>
            <path d="M130 294v40" class="fg-arrow" marker-end="url(#L11b)"/>
            <rect x="10" y="338" width="230" height="72" rx="6" class="fg-good"/>
            <text x="20" y="358" class="t-sm t-b t-good">All four passed: list for LDLT</text>
            <text x="20" y="376" class="t-sm">while waiting for a donor:</text>
            <text x="20" y="394" class="t-sm t-b">locoregional bridging therapy</text>
          </svg>
      - kind: aside
        tone: tip
        page: 190
        text: |
          الكتاب ذكر **Milan** بالاسم من غير أرقام. الأرقام المعروفة (Mazzaferro 1996، **مش من الكتاب**): **ورم واحد ≤ 5 cm**، أو **لحد 3 أورام كل واحد ≤ 3 cm**، ومن غير vascular invasion ولا extrahepatic spread.

          افتكرها **«5 أو 3×3»**.
      - kind: reveal
        page: 190
        prompt: "ليه بالذات CT chest و bone scan؟ وليه نهتم بالـ AFP لو الورم صغير؟"
        answer: |
          - الـ HCC لما يطلع برّه الكبد بيروح أكتر حاجة **للرئة والعضم**، فدول اللي بنصورهم قبل ما نقرر. (منطق مقبول، الكتاب كاتب الفحوص بس.)
          - الـ **AFP العالي** بيعني ورم **biology** بتاعته عدوانية، واحتمال يرجع بعد الزرع أعلى، خصوصًا إن الـ **immunosuppression** بعد الزرع بتساعد أي خلية ورم فاضلة. علشان كده الكتاب حاطط حد: **< 400 ng/ml**.
      - kind: explain
        page: 190
        title: "Bridging therapy: نمسك الورم مكانه"
        quote: "Locoregional Bridging therapy, if possible, is one of options used to manage patients on waiting list till a donor becomes available."
        text: |
          المريض بيستنى donor، والورم مش بيستنى. فبنعمل **locoregional therapy** (زي ablation أو chemoembolization) علشان الورم **يفضل جوه الـ criteria** لحد ما الكبد يتوفر.

          يعني الـ bridging زي ما تحط الأكل في التلاجة لحد ما الضيوف يوصلوا: مش بيعالج، بس بيمنع إنه يبوظ.
      - kind: check
        page: 190
        question: "A cirrhotic has a single 4 cm HCC, normal CT chest and bone scan, no macrovascular invasion, and AFP 650 ng/ml. Can he be listed under the book's criteria?"
        options:
          - "No: AFP must be below 400 ng/ml"
          - "Yes: he is within Milan criteria"
          - "No: a 4 cm tumour is beyond Milan"
          - "Yes, but only after a negative PET scan"
        answer: 0
        why:
          - "صح: الأربع بوابات كلهم لازم يتعدّوا، والـ AFP هنا فوق 400."
          - "الـ Milan بوابة واحدة بس من أربعة؛ الـ AFP وقّعه."
          - "ورم واحد 4 cm جوه Milan (الحد 5 cm لورم واحد)."
          - "الكتاب مش بيطلب PET؛ بيطلب CT chest و bone scan، والـ AFP هو المشكلة."
      - kind: explain
        page: 190
        title: "أمراض تانية بتتعالج بالزرع"
        text: |
          الكتاب بيقسمهم أربع مجموعات:

          - **Cholestatic:** **PBC**، **PSC**.
          - **Metabolic:** **Hemochromatosis**، **Alpha1-antitrypsin deficiency**، **Wilson's disease**، **Tyrosinemia**، **Cystic fibrosis**.
          - **Hepatic malignancy (other than HCC):** **Hepatoblastoma**، **hepatic carcinoid**، بشرط within accepted criteria ومن غير extrahepatic spread ولا vascular invasion.
          - **Miscellaneous:** **Cryptogenic cirrhosis**، **Polycystic liver disease**، **Budd-Chiari syndrome**، **Amyloidosis**.

          الـ metabolic دي بالذات هتقابلها تاني في Lecture 12: الزرع فيها مش بس بيغيّر كبد بايظ، ده بيغيّر **المصنع اللي فيه العيب الجيني**.
      - kind: match
        page: 190
        prompt: "وصّل كل مرض بالمجموعة بتاعته في الكتاب:"
        pairs:
          - ["PSC", "Cholestatic disorders"]
          - ["Tyrosinemia", "Metabolic diseases"]
          - ["Hepatic carcinoid", "Malignancy other than HCC"]
          - ["Polycystic liver disease", "Miscellaneous"]
        why: "الـ hepatic carcinoid و hepatoblastoma هما الـ malignancy غير الـ HCC، بنفس الشروط: within criteria ومن غير spread ولا vascular invasion."
      - kind: explain
        page: 190
        title: "الأطفال: قايمة لوحدها"
        text: |
          **Pediatric indications of LDLT:**

          - **EHBA** (extrahepatic biliary atresia): **50-60% of cases**، يعني نص الحالات تقريبًا.
          - **Familial Intrahepatic Cholestasis (FIHC)**
          - **Alagille's syndrome**
          - **Budd-Chiari syndrome**
          - **AIH**
          - **Rarely** viral hepatitis leading to ESLD

          وفيه كمان **metabolic** خاصة بالأطفال (صفحة 191): **Alpha one antitrypsin deficiency**، **Tyrosinemia**، **Hyperoxaluria**، **Amyloidosis**.
      - kind: aside
        tone: analogy
        page: 190
        text: |
          الـ **biliary atresia** زي شقة جديدة اتسلّمت **من غير مواسير صرف**. الكبد بيعمل bile عادي، بس مفيش طريق يخرج منه، فالـ bile بيرجع يحرق الكبد من جوه وبيوصل لـ cirrhosis بدري جدًا. علشان كده هي **أشهر سبب** لزرع الكبد في العيال.
      - kind: mnemonic
        page: 191
        word: "A HAT"
        parts:
          - { key: "A", text: "Alpha one antitrypsin deficiency" }
          - { key: "H", text: "Hyperoxaluria" }
          - { key: "A", text: "Amyloidosis" }
          - { key: "T", text: "Tyrosinemia" }
        hook: |
          العيل الصغير رايح الزرع لابس **A HAT** (طاقية): دي الـ metabolic indications بتاعة الأطفال.
      - kind: check
        page: 191
        question: "Which of these is in the book's **pediatric metabolic** list for LDLT, but not in the adult metabolic list?"
        options:
          - "Hyperoxaluria"
          - "Wilson's disease"
          - "Hemochromatosis"
          - "Cystic fibrosis"
        answer: 0
        why:
          - "صح: الـ hyperoxaluria موجودة في قايمة الأطفال بس (الـ H في A HAT)."
          - "Wilson في الـ metabolic بتاعة الكبار في صفحة 190."
