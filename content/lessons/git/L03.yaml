  - id: git.L03.lesson5
    title: "الـ IBS: مين، وأنواعه، وليه بيحصل"
    hook: "واحد من كل 8 تقريبًا، وأغلبهم ما بيروحوش لدكتور. ألم بيروح بالحمام، وانتفاخ بيزيد مع اليوم."
    minutes: 9
    pages: [114, 119]
    topics: [ibs]
    goals:
      - "تعرّف الـ IBS وتعرف أرقامه"
      - "تقسّم الـ subtypes بالـ Bristol scale"
      - "تشرح الآليات وتعرف الصورة الإكلينيكية والـ overlap"
    status: unverified
    steps:
      - kind: explain
        page: 114
        quote: "About 10–15% of the population are affected at some time but only 10% of these consult their doctors because of symptoms."
        title: "مرض كتير، ومرضى قليلين في العيادة"
        text: |
          الـ ==IBS==: abdominal pain مع **altered bowel habits** من غير organic pathology تفسّرها.

          - بيصيب **10–15%** من الناس في وقت ما، بس **10% بس منهم** بيروحوا للدكتور.
          - ومع كده هو ==the most common cause of gastrointestinal (GI) referral==، وبيعمل غياب كتير عن الشغل.
          - **Young women** أكتر من الرجالة **2–3 مرات**.

          التفسير المقبول (مش في الكتاب): ليه 10% بس بيستشيروا؟ لأن أغلب الناس أعراضهم خفيفة ومتعايشين معاها. اللي بيوصلوا للعيادة غالبًا أعراضهم أشد أو عندهم قلق أو psychosocial factors (فاكر الـ referral centers؟)، وده بيفسّر ليه مرضى العيادة أصعب في العلاج.
      - kind: figure
        page: 115
        title: "الـ subtypes في الكتاب"
        image: { file: git/L03-ibs-subtypes.webp, book: true }
        alt: "Book figure: a table of IBS-C, IBS-D, mixed IBS and unsubtyped IBS with their stool descriptions using the 25 percent cut-off, and below it the Bristol stool types 1 to 7 beside a box placing functional constipation, IBS and functional diarrhoea along constipation-diarrhoea and pain axes."
        caption: |
          - **IBS-C**: hard، ممكن painful، أكتر من **25%** من الوقت.
          - **IBS-D**: loose أو watery أكتر من **25%**.
          - **Mixed**: الاتنين، كل واحد أكتر من **25%**.
          - **Unsubtyped**: أعراض IBS من غير اضطراب واضح في البراز.

          التفسير المقبول (مش في الكتاب) للرسمة اللي تحت: الـ **functional constipation** والـ **functional diarrhoea** في الأطراف، والـ IBS في النص. والفرق إن الـ IBS فيه **ألم** (السهم اللي تحت). يعني لو مفيش ألم، فكّر في functional constipation أو diarrhoea، مش IBS.
      - kind: reveal
        page: 114
        quote: "IBS is the most common cause of gastrointestinal referral and accounts for frequent absenteeism from work and impaired quality of life."
        prompt: "مرض مش بيموّت، ليه الكتاب بيهتم بيه كده؟"
        answer: |
          الكتاب: الـ IBS ==the most common cause of gastrointestinal referral==، وبيعمل **absenteeism** كتير من الشغل، و **impaired quality of life**. والستات الصغيرين **2–3 أضعاف** الرجالة.

          التفسير المقبول (مش في الكتاب): العبء هنا مش في الوفيات، في **العدد والتكرار**: ملايين الناس، سنين من الأعراض، أيام غياب، وفحوصات متكررة. يعني لو عرفت تشخّصه صح من غير ما تكرر الفحوصات، وتعالجه كويس، وفّرت على المريض والنظام الصحي كتير. وده سبب إن Rome بيدّي **positive diagnosis** بدل ما نستنى نستبعد كل حاجة كل مرة.
