      - kind: reveal
        page: 144
        quote: "Higher levels of TPO were associated with increased megakaryocyte numbers and rapid progression to myelofibrosis."
        prompt: "ليه الـ TPO العالي بيسرّع التليف؟"
        answer: |
          الـ **TPO** بيكتّر الـ **megakaryocytes**، والـ megakaryocytes هي مصنع الـ **TGFβ-1 و PDGF و VEGF**.

          يعني megakaryocytes أكتر = cytokines أكتر = ==rapid progression to myelofibrosis==.
      - kind: table
        page: 145
        quote: "Presence of megakaryocytic proliferation and atypia, usually accompanied by either reticulin and/or collagen fibrosis grades 2 or 3"
