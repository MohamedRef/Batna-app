  en: Tapping a lesson figure opens it full screen, with pinch, buttons or double tap to zoom, starting at its top left
- kind: fixed
  ar_eg: السحب لتقليب الصفحة بقى شغال وصباعك على الصورة كمان
  en: Swiping to turn the page now works on a figure too
