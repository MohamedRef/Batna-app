  - id: dm.L12.lesson7
    title: "الـ screening والـ staging: امتى تشك في كلية تانية"
    hook: "تحليلين في السنة بيلقطوا الـ DKD بدري، وعشر علامات بتقولك: ده مش سكر، دوّر على حاجة تانية."
    minutes: 8
    pages: [143, 144]
    topics: [screening]
    goals:
      - "تعرف تعمل screening لمين وامتى، وليه الـ type 1 بيستنى 5 سنين"
      - "تعرف الـ 10 clues للـ non-DKD وليه كل واحدة بتشكّك"
      - "تعمل staging بالـ G والـ A وتعرف ليه الاتنين"
    status: unverified
    steps:
      - kind: explain
        page: 143
        title: "الـ screening"
        quote: "At least once a year, assess urinary albumin (e.g., spot urinary albumin-to-creatinine ratio) and estimated glomerular filtration rate (eGFR)"
        text: |
          ==At least once a year==: **spot urine ACR + eGFR**.

          - **Type 1**: من بعد ==≥5 years== من التشخيص.
          - **Type 2**: كله، من التشخيص.
          - ACR >30 mg/g و/أو eGFR <60؟ تابع **مرتين في السنة**.

          ليه الفرق بين النوعين؟ التفسير المقبول (مش في الكتاب): الـ **type 1** بدايته معروفة بالظبط، والـ DKD محتاج سنين سكر عالي عشان يبدأ، فمفيش داعي تدوّر قبل 5 سنين. الـ **type 2** بقى ممكن يكون موجود سنين قبل ما يتشخّص، يعني الكلية ممكن تكون اتأذت **قبل** يوم التشخيص، عشان كده بنعمل screening من أول يوم. والمتابعة مرتين في السنة لما الأرقام تبوظ عشان العلاج بيتغيّر عليها (الكتاب: ==to guide therapy==).
      - kind: check
        page: 143
        quote: "In patients with type 1 diabetes with a duration of ≥5 years"
        question: "A patient with type 1 DM for 3 years asks when kidney screening should begin. Answer?"
        options:
          - "Once diabetes duration reaches 5 years, then yearly"
          - "Now, and every year from diagnosis"
          - "Only if retinopathy appears"
          - "At age 40"
        answer: 0
        why:
          - "صح: الـ type 1 من ≥5 years، لأن بدايته معروفة والـ DKD محتاج سنين."
          - "ده للـ type 2: من التشخيص لأن بدايته مش معروفة."
          - "الـ screening مش مستني الـ retinopathy."
          - "السن مش هو المعيار، المعيار مدة السكر."
      - kind: sort
        page: 144
        quote: "When to consider non-DKD and/or pursue a kidney biopsy\n  1. Atypical Presentation of renal disease in DM\n  2. Absence of retinopathy (T1D)\n  3. Albuminuria developing <5 or >25 the onset of disease (T1D)\n  4. Immunological markers or active urinary sediment\n  5. Acute/sudden onset macroalbuminuria or the nephrotic syndrome\n  6. Nephritic syndrome\n  7. Hematuria\n  8. Rapid decline in renal function\n  9. Significant reduction in eGFR (>30%) after initiation RAASi"
        prompt: "ده شكل DKD معتاد، ولا clue لـ non-DKD؟"
        bins: ["DKD", "Non-DKD"]
        cards:
          - { text: "Retinopathy present", bin: 0 }
          - { text: "Slow eGFR decline", bin: 0 }
          - { text: "Albuminuria after 15 years of T1D", bin: 0 }
          - { text: "Active urinary sediment", bin: 1 }
          - { text: "Nephritic syndrome", bin: 1 }
          - { text: "eGFR falls >30% after RAAS inhibitor (RAASi)", bin: 1 }
          - { text: "Albuminuria 2 years after T1D onset", bin: 1 }
          - { text: "Sudden nephrotic syndrome", bin: 1 }
        why: "الـ 10 clues: atypical presentation، no retinopathy (T1D)، albuminuria <5 أو >25 سنة (T1D)، immunological markers أو active sediment، sudden macroalbuminuria/nephrotic، nephritic، hematuria، rapid decline، eGFR ↓>30% بعد RAAS inhibitor (RAASi)، acute kidney injury."
      - kind: explain
        page: 144
        title: "ليه كل clue من دول بيشكّك؟"
        quote: "When to consider non-DKD and/or pursue a kidney biopsy"
        text: |
          ارجع للـ **DRAG** (بطيء، مع retinopathy، albuminuria من غير دم). أي حاجة تكسر الشكل ده بتقول: ==consider non-DKD== أو kidney biopsy. التفسير المقبول (مش في الكتاب) للمجموعات:

          - **التوقيت غلط** (albuminuria قبل 5 سنين أو بعد 25 سنة في الـ T1D، أو غياب الـ retinopathy في الـ T1D): الـ DKD ليه ميعاد ومعاه أذى في العين، فلو جه بدري أو لوحده يبقى غالبًا سبب تاني.
          - **علامات التهاب** (immunological markers، active sediment، nephritic، hematuria): دي لغة الـ **glomerulonephritis**، والـ DKD مش التهابي.
          - **السرعة** (sudden nephrotic، rapid decline، AKI): الـ DKD بيمشي على سنين، فأي انهيار سريع ليه سبب تاني.
          - **eGFR وقع >30% بعد RAASi**: نزول بسيط متوقّع، بس النزول الكبير بيخلّيك تفكر في **renal artery stenosis**، لأن الكلية دي كانت عايشة على الـ efferent constriction.
      - kind: figure
        page: 144
        quote: "Risk of chronic kidney disease (CKD) progression, frequency of visits, and referral to nephrology according to glomerular filtration rate (GFR) and albuminuria.\nCKD is classified based on: Cause (C), GFR (G), Albuminuria (A)\n| GFR categories (mL/min/1.73m2) | A1: Normal to mildly increased (<30 mg/g, <3 mg/mmol) | A2: Moderately increased (30-299 mg/g, 3-29 mg/mmol) | A3: Severely increased (≥300 mg/g, ≥30 mg/mmol) |\n|---|---|---|---|\n| G1: Normal to high (≥90) | 1 if CKD | Treat 1 | Refer* 2 |\n| G2: Mildly decreased (60-89) | 1 if CKD | Treat 1 | Refer* 2 |\n| G3a: Mildly to moderately decreased (45-59) | Treat 1 | Treat 2 | Refer 3 |\n| G3b: Moderately to severely decreased (30-44) | Treat 2 | Treat 3 | Refer 3 |\n| G4: Severely decreased (15-29) | Refer* 3 | Refer* 3 | Refer 4+ |\n| G5: Kidney failure (<15) | Refer 4+ | Refer 4+ | Refer 4+ |"
