  - id: git.L02.lesson5
    title: "نحرق، نجمّد، ونضوّي"
    hook: "RF للـ GERD، ثلج للـ Barrett، ونور للـ cancer، وغاز argon للنزيف. كل واحد بعمقه وبمريضه."
    minutes: 9
    pages: [69, 75]
    topics: [ablation, ai]
    goals:
      - "تختار المريض المناسب للـ Stretta"
      - "تعرف عمق وأمان الـ APC ودواعيه"
      - "تفرق بين PDT و APC والـ cryotherapy"
    status: unverified
    steps:
      - kind: explain
        page: 69
        quote: "It involves the application of controlled RF energy to induces collagen contraction in the LES region."
        title: "الـ RF و Stretta"
        text: |
          الـ **RF**: تيار متردد سريع ← حرارة ← **tissue necrosis**. لحد **900 MHz**، وفوقها **microwave**.

          بيتستخدم في **GERD** و**nodular HCC أقل من 3-4 cm**.

          في الـ GERD (**Stretta**): RF energy بتعمل ==collagen contraction== في منطقة الـ **LES**، بديل minimally invasive للجراحة.
          - Generator بأربع قنوات، وكل إبرة فيها **thermocouple** يظبط الحرارة.
          - الحرارة **أقل من 100°C** علشان الضرر الجانبي يقل.
          - حلقات lesions **2 cm** فوق وتحت الـ cardia، **48-60 lesion** في حوالي **50 دقيقة**.
      - kind: sort
        page: 70
        quote: "Have > 2 cm long fixed hiatal hernia. • Have significant dysphagia."
        prompt: "Stretta: المريض ده مناسب ولا لأ؟"
        bins: ["Ideal candidate", "Not a good candidate"]
        cards:
          - { text: "LES pressure at least 5 mm Hg, good peristalsis", bin: 0 }
          - { text: "Acid exposure time above 4% on 24-h pH", bin: 0 }
          - { text: "Nonerosive or Savary-Miller grade I-II", bin: 0 }
          - { text: "Responds to PPI, relapses off it", bin: 0 }
          - { text: "Fixed hiatal hernia over 2 cm", bin: 1 }
          - { text: "Significant dysphagia", bin: 1 }
          - { text: "Grade III-IV esophagitis or extensive Barrett", bin: 1 }
          - { text: "Poor peristalsis, incomplete LES relaxation", bin: 1 }
        why: "المنطق: الـ Stretta بتشد الـ LES، فلازم يكون فيه **peristalsis كويسة** و**reflux حقيقي** (أكتر من 4%) و**مرض خفيف بيستجيب للـ PPI**. الـ hernia الكبيرة والـ dysphagia والـ esophagitis الشديدة بتطلّعه برّه."
      - kind: explain
        page: 70
        quote: "MCT cannot be used as a single treatment for HCCs >2 cm on the long axis"
        title: "Microwave و cryotherapy"
        text: |
          **Microwave coagulation (MCT)**: microwave لإبرة **monopolar**، والعمق = **طول الـ electrode**.
          - الأورام اللي اتعالجت **أقل من 40 mm** وبعيدة **10 mm** على الأقل عن الأوعية الكبيرة.
          - **مش لوحده** لـ HCC أكبر من **2 cm**: محتاج applications كتير.

          **Endoscopic cryotherapy**: **nitrous oxide** تحت ضغط عالي من catheter. لـ **hemostasis** و **mucosal ablation** (زي **Barrett's**).
          - فوري: ==cryonecrosis 0.5 mm==.
          - متأخر: inflammation بتكمّل الـ ablation في كام يوم.
      - kind: explain
        page: 71
        quote: "PDT is a non-thermal procedure which acts by endoscopic laser irradiation with an appropriate wave-length after administration of a photosensitizer"
        title: "Laser و PDT"
        text: |
          - **FREDDY**: frequency-doubled double-pulse **Nd:YAG** laser، في الـ **ERCP** من balloon catheter، لتكسير الـ **difficult stones**: آمن وفعال ورخيص.
          - ==PDT==: **non-thermal**. بتدي **photosensitizer** بيتحجز أكتر في الـ **cancer**، وبعدين laser بالـ wavelength المناسب ← الخلايا السرطانية بس اللي بتموت.
            - في **esophageal cancer**: palliation كويس للـ **dysphagia**، وأسهل وأريح من Nd:YAG.
            - كمان: palliation لـ colon و gastric و pancreatic cancer، ampullary و para-ampullary adenomas، و **FAP**.
            - بيقتل **H. pylori** in vitro، بس مفيش clinical data.
      - kind: explain
        page: 72
        quote: "The limited depth of coagulation (2-3 mm) explains the low risk of perforation."
        title: "الـ APC"
        text: |
          ==Argon plasma coagulation==: **non-contact** electrocoagulation، تيار high frequency بيعدّي في **ionized argon gas**.

          العمق محدود ==2-3 mm== ← **low risk of perforation**.

          دواعيه المعروفة:
          - نزيف من **angiodysplasia** أو مكان **polypectomy**
          - **Radiation proctitis**
          - **Palliation** للـ malignant colorectal stenosis
          - **Early gastric cancer**

          وبعد الـ **piecemeal** polypectomy بيشيل بواقي الـ polyp عند الحواف.
      - kind: table
        page: 72
        quote: "APC is an endoscopic non-contacct electrocoagulation technique where high frequency alternating current is delivered through ionized argon gas."
        title: "مين بيعمل إيه؟"
        columns: ["Method", "Energy", "Key fact"]
        rows:
          - ["Stretta (RF)", "Radiofrequency heat", "LES collagen contraction; below 100°C"]
          - ["MCT", "Microwave, monopolar needle", "Depth = electrode length; tumors under 40 mm"]
          - ["Cryotherapy", "Nitrous oxide", "0.5 mm cryonecrosis; Barrett"]
          - ["PDT", "Laser after photosensitizer", "Non-thermal; selective tumor kill"]
          - ["APC", "Current through argon", "Non-contact; 2-3 mm; low perforation"]
        hide: [[0, 2], [2, 1], [3, 2], [4, 2]]
      - kind: check
        page: 72
        quote: "Hemorrhage from angiodysplastic lesion or polypectomy site. • Radiation proctitis."
        question: "A man bleeds from colonic angiodysplasia. Which therapy is well established and safest against perforation?"
        options:
          - "Argon plasma coagulation"
          - "Stretta"
          - "Microwave coagulation"
          - "Photodynamic therapy"
        answer: 0
        why:
          - "صح: الـ APC well established للـ angiodysplasia، وعمقه 2-3 mm بس."
          - "الـ Stretta للـ GERD."
          - "الـ MCT للأورام زي الـ HCC."
          - "الـ PDT للـ cancer palliation."
      - kind: explain
        page: 74
        quote: "There are four primary AI types:  Reactive.  Limited memory.  Theory of mind.  Self-aware."
        title: "وأخيرًا: الـ AI"
        text: |
          الـ **AI**: أنظمة بتعمل حاجات محتاجة ذكاء بشري (رؤية، كلام، قرار، ترجمة).

          أنواعه الأربعة: **reactive**، **limited memory**، **theory of mind**، **self-aware**.

          في الأجهزة الطبية: **data management**، **remote surgery**، مساعدة في التشخيص والإجراء، **clinical trials**، وكفاءة التصنيع.

          والـ digital chromoendoscopy الأكتر استخدامًا: **FICE** و **NBI** و **I-Scan**، ومع الـ **CLE** زادت قيمة المنظار في التشخيص.
      - kind: aside
        tone: joke
        text: |
          من الأربع أنواع، الـ **self-aware AI** لسه مجاش. لما ييجي، أول حاجة هيعملها إنه يرفض يعمل الـ night shift. 😄
      - kind: try
        items: [git.L02.090, git.L02.092, git.L02.102, git.L02.103, git.L02.098]
    recap:
      - "RF لحد 900 MHz؛ Stretta بتعمل collagen contraction في الـ LES؛ أقل من 100°C؛ 48-60 lesion."
      - "Stretta مناسب: LES 5 mm Hg أو أكتر، AET أكتر من 4%، esophagitis خفيفة، بيستجيب للـ PPI. لا: hernia أكبر من 2 cm، dysphagia، grade III-IV، Barrett واسع."
      - "MCT: العمق = الـ electrode؛ مش لوحده لـ HCC أكبر من 2 cm. Cryo: N2O و 0.5 mm."
      - "PDT non-thermal و selective. APC non-contact، 2-3 mm، للنزيف والـ radiation proctitis."
      - "AI: reactive، limited memory، theory of mind، self-aware."
