        quote: "Post-polypectomy surveillance for serrated lesions\nPatients with serrated polyps resected (excluding diminutive hyperplastic lesions)\n  All serrated polyps <10 mm in size, no associated dysplasia and not meeting criteria for Serrated Polyposis Syndrome (SPS): No surveillance on the basis of serrated polyps\n  Serrated polyps either ≥10 mm in size, with associated dysplasia or TSA: One off surveillance colonoscopy at 3 years\n  Multiple serrated polyps meeting criteria for SPS: surveillance colonoscopy every 1-2 years once colon cleared"
        title: "BSG: بعد شيل الـ serrated"
        text: |
          (excluding diminutive hyperplastic)

          - كلهم **under 10 mm**، من غير dysplasia، ومش SPS: ==no surveillance== على أساس الـ serrated.
          - أي واحد **10 mm أو أكتر**، أو dysplasia، أو **traditional serrated adenoma (TSA)**: one-off colonoscopy **at 3 years**.
          - **SPS**: colonoscopy **every 1-2 years** بعد ما القولون يتنضف.

          التفسير المقبول (مش في الكتاب): ليه الـ SPS كل سنة أو سنتين؟ لأن القولون ده بيطلّع serrated lesions كتير وبسرعة، وبعضها مسطّح بيتفوّت، فالمسافة القصيرة بتعوّض.
