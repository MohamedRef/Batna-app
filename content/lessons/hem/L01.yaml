  - id: hem.L01.lesson2
    title: "الـ CFU-GEMM والنخاع من جوّه"
    hook: "الـ myeloid progenitor جوهرة بتطلّع أربع عائلات، والنخاع عامل لها بيت فيه مرتبة و velcro."
    minutes: 8
    pages: [4, 5]
    topics: [myelopoiesis, microenvironment]
    goals:
      - "تعدّ ولاد الـ CFU-GEMM وتعرف الـ BFU-E جه منين"
      - "تشرح الـ microenvironment: الـ stroma والـ extracellular matrix"
      - "تفهم الـ CAMs: ليه الـ stem cells المحقونة بتلزق في النخاع، وإزاي الخلية الناضجة بتطلع"
    status: unverified
    steps:
      - kind: explain
        remind: [hem.L01.024]
        page: 4
        title: "الـ CFU-GEMM: أبو الـ myeloid"
        quote: "The myeloid stem cell progresses to the progenitor colony forming unit, granulocyte-eythrocyte-monocyte-megakaryocyte (CFU-GEMM)"
        text: |
          الـ **myeloid stem cell** بيتحول لـ ==CFU-GEMM==: colony forming unit **G**ranulocyte-**E**rythrocyte-**M**onocyte-**M**egakaryocyte. الاسم نفسه بيعدّ ولاده.

          ومنه بتطلع committed progenitors: **CFU-GM**، **CFU-eosinophil**، **CFU-basophil**، **CFU-megakaryocyte**. وفي الـ erythropoiesis بيتحول لـ **BFU-E** (burst-forming unit erythroid).

          كل colony-forming unit (CFU) في الظروف المناسبة يطلّع **colony من lineage واحد**. يعني كل ما تنزل في السلسلة، الاختيارات بتقل لحد ما الخلية يبقى مكتوب لها مصير واحد.
      - kind: mnemonic
        page: 4
        quote: "The myeloid stem cell progresses to the progenitor colony forming unit, granulocyte-eythrocyte-monocyte-megakaryocyte (CFU-GEMM)"
        word: "GEMM"
        parts:
          - { key: "G", text: "Granulocyte" }
          - { key: "E", text: "Erythrocyte" }
          - { key: "M", text: "Monocyte" }
          - { key: "M", text: "Megakaryocyte" }
        hook: "**GEMM** = جوهرة (gem)؛ الـ myeloid progenitor ده جوهرة بتطلّع 4 أنواع. الـ lymphocyte مش منهم: ده من الـ lymphoid stem cell."
      - kind: check
