  # ---------- p137-139: management, PRP ----------
  - id: geri.L08.042
    kind: enumerate
    topic: tendon-mx
    prompt: Which interventions have been studied for rotator cuff and gluteal tendinopathies?
    points:
      - Exercise
      - Corticosteroid or platelet-rich plasma injections
      - Radial pressure wave and focused shock wave therapy
      - Topical glyceryl nitrate
    pass: 3
    hook: "اللي اتجرب في الـ rotator cuff والـ gluteal «رياضة، حقن، موجات، ولزقة»: exercise، corticosteroid أو PRP injections، radial pressure wave وfocused shock wave، وtopical glyceryl nitrate."
    src: { page: 137, quote: "The best approaches for clinical management of rotator cuff and gluteal tendinopathies have yet to be elucidated. Careful analysis of the medical history and symptoms must guide clinical decision making. Studied interventions include exercise, interventional approaches (i.e., corticosteroid or platelet-rich plasma injections), physical therapy modalities (radial pressure wave treatment and focused shock wave therapy), and topical glyceryl nitrate application. Positioning and exercise therapy seem to be effective in both rotator cuff tendinopathy and greater trochanteric pain syndrome; however is not clear what protocol is the best." }
    status: unverified
  - id: geri.L08.043
    kind: card
    topic: tendon-mx
    front: First-line treatment of tendinopathy?
    back: Conservative treatment through exercise and load management, aided by other conservative options such as extracorporeal shock-wave therapy (ESWT) (extracorporeal shockwave therapy).
    src: { page: 137, quote: "Current advances and research in tendinopathy shows that even though there is still a lot we do not know, conservative treatment through exercise and load management should be the first source of treatment, aided by other conservative treatments like ESWT (extracorporeal shockwave therapy). Surgical approach should only be used as a last resource once the conservative options have failed after six to twelve months of treatment. Future research lines are necessary in order to achieve a consensus of exercises dosage, intensity and type." }
    status: unverified
    tags: [high-yield]
