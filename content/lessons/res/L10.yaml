  - id: res.L10.lesson10
    title: "الـ key words والـ search والتنظيم"
    hook: "MeSH ولا كلماتك؟ AND ولا OR؟ وبعد ما تلاقي، تنظم وتلخّص إزاي؟"
    minutes: 10
    pages: [100, 122]
    topics: [search]
    goals:
      - "تختار key words من الـ MeSH ومن مقالات على الموضوع"
      - "تفرّق بين AND وOR وNOT وNEAR"
      - "تنظم الـ documents وتلخّص الـ review"
    status: unverified
    steps:
      - kind: explain
        page: 100
        quote: "MEDLINE does not provide the full text of articles, but rather lists the title, authors, source of the publication, the authors’ abstract (if one is available) and key word subject headings.\n  For some journals, the full text of articles can be accessed via a link on the search results page."
        title: "MEDLINE بيديك إيه؟"
        text: |
          الـ **MEDLINE «PubMed»** بيديره الـ **National Library of Medicine**: **free**، بيتحدّث كتير، وسهل.

          بس ==does not provide the full text==: بيديك الـ title والـ authors والـ source والـ abstract (لو موجود) والـ key word subject headings. لبعض الـ journals في **link** للـ full text.
      - kind: explain
        page: 102
        quote: "3. Identify Key Words\n  Key words are terms that describe the characteristics of the subject being reviewed.\n  Most bibliographic databases require the use of standardized key words.\n  These key words are often found in the list of Medical Subject Heading (MeSH) terms."
        title: "Key words والـ MeSH"
        text: |
          الـ **key words** بتوصف الموضوع. معظم الـ databases عايزة **standardized key words** من لستة الـ ==Medical Subject Heading (MeSH)== terms.

          تجيبها منين؟
          - **ورقتين** عن الموضوع (واحدة جديدة وواحدة أقدم): في الـ abstract بتاعهم لستة MeSH terms.
          - **اللستة الأبجدية** للـ MeSH على النت.
          - **كلماتك انت**: الـ MEDLINE بيقبلها، بس البحث **أقل دقة**.
      - kind: check
        page: 105
        quote: "There is also a screen “Search details” which includes MeSH terms. This screen may be helpful when entering open text on a search, and noting that an indicated MeSH term may be a better choice."
        question: "Which PubMed side screen shows the MeSH terms behind the words you typed?"
        options: ["Search details", "Titles with your search terms", "Send to"]
        answer: 0
        why:
          - "صح: الـ Search details فيها الـ MeSH terms، وممكن تلاقي MeSH term أحسن من كلامك."
          - "دي بتوريك مقالات شبه بحثك عشان تراجع وتزوّد search terms."
          - "دي بتحفظ المقالات."
      - kind: explain
        page: 107
        quote: "For a literature search in MEDLINE, these sources of key words are useful:\n  1. Identify two scientific papers that cover the topic of interest: one more recent and one less recent.\n  In the MEDLINE abstract, a list of MeSH terms will be provided. These can, in turn, be used in subsequent searches."
        title: "تجيب الـ key words منين؟"
        text: |
          مصادر الـ key words في MEDLINE:

          1. هات ==بحثين== على الموضوع: ==واحد جديد وواحد أقدم==. في الـ abstract هتلاقي ==list of MeSH terms== تستخدمها في الـ search الجاي.

          ليه بحثين من سنين مختلفة؟ الـ MeSH terms بتتغير مع الوقت، فالاتنين مع بعض بيغطوا الكلمات القديمة والجديدة. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 109
        quote: "3. MEDLINE does not require users to use standardized key words. Therefore, you can select your own key words.\n  Generally, using non-standardized key words provides a less precise literature search than does using standardized terms.\n  However, the MEDLINE allows complete searching without a detailed knowledge of MeSH terms."
        title: "Key words بتاعتك ولا standardized؟"
        text: |
          - MEDLINE ==مش بتطلب== standardized key words، فتقدر تختار كلماتك.
          - بس الـ ==non-standardized== key words بتدّي search ==أقل دقة== من الـ standardized terms.
          - ومع ذلك MEDLINE بتسمح بـ search كامل من غير معرفة تفصيلية بالـ MeSH.

          ليه أقل دقة؟ نفس المرض ليه أسماء كتير، والـ MeSH بيجمعهم تحت اسم واحد. التفسير المقبول (مش في الكتاب).
      - kind: explain
        remind: [res.L10.086]
        page: 111
        quote: "Searches can be limited to English-language publications, to a certain date of publication, or the search can be limited to “journal article.” An initial search can focus on review articles by selecting the publication type."
        title: "النتايج كتير؟ ضيّق"
        text: |
          أول search هيطلّعلك آلاف المقالات، كتير منها مالوش دعوة. ضيّق بـ **limits**:
          - **English-language** بس، و**date** معيّن، و**journal article**.
          - ابدأ بالـ ==review articles== من الـ **publication type**.

          ولقيت مقالة حلوة؟ دوس **related articles**، ودوّر باسم الكاتب (**last name + first and middle initials**)، واحفظ بـ «**send to**».
      - kind: explain
        page: 113
        quote: "If a particularly useful article is found, the author’s name can be searched for other similar studies. The same author will often have multiple publications on the same subject.\n  To avoid irrelevant retrievals, you should use the author’s last name and first and middle initials in the search."
        title: "لقيت مقالة حلوة؟ دوّر على صاحبها"
        text: |
          - لو لقيت article مفيدة، دوّر على ==اسم الكاتب==: غالبًا عنده ==publications تانية== في نفس الموضوع.
          - علشان تتجنب نتايج مالهاش علاقة: استخدم ==last name + first and middle initials==.

          ليه الحروف الأولى؟ أسماء العيلة بتتكرر كتير، والحروف بتفرّق بين الكاتب ده وغيره. التفسير المقبول (مش في الكتاب).
      - kind: figure
        page: 116
        quote: "The word AND used in this way combines the search terms so that the yield includes articles including both.\n  An example of the operator NOT would be: accidents NOT automobile.\n  The operator OR permits coupling two search terms that may tap a similar domain."
        title: "AND وOR وNOT بالدواير"
        alt: "Three pairs of overlapping circles A and B. AND combines the search terms: only the overlap, articles including both. OR, coupling two terms: both whole circles. NOT, as in accidents NOT automobile: circle A without the overlap with B."
        caption: "**AND** = التقاطع بس. **OR** = الدايرتين كلهم. **NOT** = الأولى من غير التانية."
        svg: |
          <svg viewBox="0 0 330 150" xmlns="http://www.w3.org/2000/svg">
            <circle cx="40" cy="60" r="28" class="fg-thin"/>
            <circle cx="70" cy="60" r="28" class="fg-thin"/>
            <path d="M55 36A28 28 0 0 1 55 84A28 28 0 0 1 55 36z" class="fg-dot-acc"/>
            <text x="55" y="118" text-anchor="middle" class="t-b">AND</text>
            <text x="55" y="138" text-anchor="middle" class="t-sm t-mut">both</text>
            <circle cx="150" cy="60" r="28" class="fg-dot-acc"/>
            <circle cx="180" cy="60" r="28" class="fg-dot-acc"/>
            <text x="165" y="118" text-anchor="middle" class="t-b">OR</text>
            <text x="165" y="138" text-anchor="middle" class="t-sm t-mut">either or both</text>
            <circle cx="260" cy="60" r="28" class="fg-dot-acc"/>
            <circle cx="290" cy="60" r="28" class="fg-box"/>
            <text x="275" y="118" text-anchor="middle" class="t-b">NOT</text>
            <text x="275" y="138" text-anchor="middle" class="t-sm t-mut">A without B</text>
          </svg>
      - kind: check
        page: 116
        quote: "The word AND used in this way combines the search terms so that the yield includes articles including both."
        question: "Searching for \"Obesity AND Hypertension\" may yield articles about:"
        options: ["Obesity and hypertension together", "Obesity alone", "Hypertension alone", "All of the above"]
        answer: 0
        why:
          - "صح: AND = المقالات اللي فيها الاتنين."
          - "مقالة obesity بس بتطلع برّه."
          - "مقالة hypertension بس بتطلع برّه."
          - "ده اللي OR بيعمله."
      - kind: check
        page: 116
        quote: "The operator OR permits coupling two search terms that may tap a similar domain."
        question: "Searching for \"Smoking OR Lung cancer\" may yield articles about:"
        options: ["All of the above", "Smoking alone", "Lung cancer alone", "Smoking and lung cancer together"]
        answer: 0
        why:
          - "صح: OR بيجيب أي مقالة فيها واحدة منهم أو الاتنين."
          - "صح بس ناقص."
          - "صح بس ناقص."
          - "صح بس ناقص؛ ده لوحده نتيجة AND."
      - kind: explain
        page: 117
        quote: "The operator NEAR will define two search terms that must appear within 10 words of each other in order to select an article.\n  Use of parentheses will define a search term that must appear as listed.\n  For example, the search terms (school clinic) must appear as that phrase to be identified, rather than search “school” and “clinic” separately."
        title: "NEAR والأقواس"
        text: |
          الـ **Boolean operators** بتتكتب **CAPS**: AND، NOT، OR، NEAR، و( ).
          - ==NEAR==: الكلمتين لازم يبقوا **في حدود 10 كلمات** من بعض.
          - **الأقواس** (school clinic): لازم تظهر **كـ phrase** زي ما هي، مش «school» لوحدها و«clinic» لوحدها.
      - kind: update
        page: 117
        quote: "Use of parentheses will define a search term that must appear as listed.\n  For example, the search terms (school clinic) must appear as that phrase to be identified, rather than search “school” and “clinic” separately."
        text: "في PubMed النهارده الـ phrase بتتكتب بين **علامات تنصيص** \"school clinic\"، والأقواس بتجمّع الكلمات وبتحدد ترتيب AND وOR وNOT. في الامتحان: الأقواس = phrase، زي الشريحة."
        ref: "PubMed Help (National Library of Medicine), 2024"
      - kind: explain
        page: 118
        quote: "5. Select and Organize Documents for Review\n  Generally, it is helpful to organize the documents by the type of study (original research, review article, review article with quantitative synthesis, guideline).\n  It is useful to enter documents into a reference management database such as EndNote (http://www.endnote.com)\n  These software applications allow users to switch from one reference format to another and to download journal citations directly from the Internet, eliminating the chance for typing errors. They also have helpful search and sort capabilities."
        title: "خطوة 5: نظّم الورق"
        text: |
          - رتّب الـ documents حسب ==نوع الدراسة==: original research، review article، review with quantitative synthesis، guideline.
          - دخّلها في ==reference management database== زي ==EndNote==.
          - البرامج دي بتبدّل بين reference formats، وبتنزّل الـ citations من الإنترنت من غير أخطاء كتابة، وفيها search و sort.

          ليه برنامج؟ لما المراجع تبقى مية، الكتابة بإيدك بتجيب أخطاء وتغيير الـ format بياخد أيام. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 120
        quote: "6. Abstract Pertinent Information from Each Document\n  The next step is to create an evidence matrix: a spreadsheet with rows and columns that allows users to abstract the key information from each article.\n  Creating a matrix provides a structure for putting the information in order.\n  In developing a matrix, the choice of column topics is a key consideration.\n  It is often useful to consider both methodological characteristics and content-specific results as column headings."
        title: "رتّب، طلّع، لخّص"
        text: |
          - **5. Organize**: رتّب الورق حسب **type of study**، ودخّله **reference manager** زي **EndNote** (بيغيّر الـ reference format، بينزّل الـ citations من غير أخطاء كتابة، وبيعمل search وsort).
          - **6. Abstract**: اعمل ==evidence matrix==: spreadsheet، كل صف مقالة، والأعمدة **methodological characteristics** (author، year، design، population، sample size) و**content-specific results** (results، conclusions).
          - **7. Summarize**: الملخص بيستخدم لـ budget item جديد قدام الـ administrator، أو تقنع **policy makers**، أو **grant application**.
      - kind: figure
        page: 121
        title: "شريحة 121: شكل الـ evidence matrix"
        image: { file: res/L10-s121-evidence-matrix.webp, book: true }
        alt: "Table 7-2, example evidence matrix for literature on physical activity promotion at various levels of an ecologic framework. Column groups: methodological characteristics (lead author, article title and journal citation; year; study design; study population; sample size; intervention characteristics) and content-specific findings (results; conclusions; other comments). One row at the individual level: Brownson et al., 2000, cross-sectional, ethnically diverse U.S. women aged 40 years and older, sample size 2912, not an intervention; physical activity lowest among African American and American Indian women; minority women are among the least active subgroups; cross-sectional nature limits causal inferences and telephone survey data may not be representative."
        caption: |
          ده مثال للـ evidence matrix اللي الخطوة فوق بتوصفه:

          - **نص الأعمدة الشمال (Methodological characteristics)**: author والمقالة، **Year**، **Study Design**، **Study Population**، **Sample Size**، **Intervention Characteristics**.
          - **النص اليمين (Content-specific findings)**: **Results**، **Conclusions**، **Other Comments**.
          - **صف واحد = مقالة واحدة**: Brownson 2000، cross-sectional على 2912 ست فوق الـ 40: الـ physical activity أقل في الأقليات، و**Other Comments** بتقول إن الـ cross-sectional ==مايثبتش سببية==.

          اللي تاخده: كل مقالة بتاخد ==نفس الأعمدة==، فتقدر تقارن الدراسات جنب بعض بسرعة.
      - kind: explain
        page: 122
        quote: "7. Summarize and Apply the Literature Review\n  Purposes of summarization:\n  To provide background information for a new budget item that is being presented to the administrator of an agency.\n  To convince key policy makers of the need for a particular program or policy.\n  To build the case for a grant application that seeks external support for a particular program."
        title: "خطوة 7: لخّص واستخدم"
        text: |
          الـ summary بيتعمل علشان:

          - ==Background== لـ budget item جديد قدام مدير الجهة.
          - ==إقناع صناع القرار== بأهمية program أو policy.
          - ==بناء الحجة لـ grant application==.

          ليه الخطوة دي؟ الـ review مش هدف لوحده: قيمته إنه يقنع حد ياخد قرار أو يدفع فلوس. التفسير المقبول (مش في الكتاب).
      - kind: try
        items: [res.L10.084, res.L10.087, res.L10.095]
    recap:
      - "MeSH = Medical Subject Heading؛ هاته من abstract بحثين (جديد وقديم)."
      - "Non-standardized key words = search أقل دقة."
      - "AND = الاتنين، OR = أي واحد، NOT = استبعد، NEAR = في حدود 10 كلمات."
      - "رتّب حسب نوع الدراسة، واستخدم EndNote؛ والـ summary بيقنع صناع القرار أو الممول."
