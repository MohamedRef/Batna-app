        prompt: "ليه في الـ cirrhosis تأكّل العيان كويس ويفضل عضله يدوب؟"
        answer: |
          لأن المشكلة مش بس في المدخلات.

          الـ ==anabolic resistance== معناها إن العضل نفسه مش بيستجيب للبروتين. وفيه أكتر من حاجة بتبوّظ الـ proteostasis:
          - **ammonia**
          - **myostatin**
          - **endotoxin**
          - قلة الـ **testosterone**
          - الـ **mitochondrial dysfunction**

          علشان كده الكتاب بيقول failure to respond to standard supplementation. والحل إنك تضرب أكتر من mechanism في نفس الوقت: أكل + **BCAA** + **exercise**.
