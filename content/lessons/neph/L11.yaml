            <text x="260" y="33" text-anchor="middle" class="t-b">sFlt-1 ↑</text>
            <path d="M260 48 L260 76" class="fg-arrow" marker-end="url(#N11b)"/>
            <rect x="120" y="78" width="200" height="40" rx="8" class="fg-box"/>
            <text x="220" y="96" text-anchor="middle" class="t-sm">Binds PlGF + VEGF</text>
            <text x="220" y="111" text-anchor="middle" class="t-sm t-mut">free levels fall</text>
            <path d="M220 118 L220 146" class="fg-arrow" marker-end="url(#N11b)"/>
            <rect x="60" y="148" width="260" height="40" rx="8" class="fg-bad"/>
            <text x="190" y="166" text-anchor="middle" class="t-sm t-b">Endothelial dysfunction</text>
            <text x="190" y="181" text-anchor="middle" class="t-sm">HTN, glomerular endotheliosis</text>
            <rect x="10" y="204" width="310" height="46" rx="8" class="fg-good"/>
            <text x="20" y="224" class="t-sm t-b">sFlt-1/PlGF ≤ 38</text>
            <text x="20" y="241" class="t-sm">rules out PE for 1 week (NPV 99.3%)</text>
          </svg>
      - kind: explain
        page: 377
        title: "الهدف والولادة"
        quote: "For patients with preeclampsia, delivery is recommended at 37 weeks or later if no severe features such as hemolysis, thrombocytopenia, or liver dysfunction are observed. Stabilization and delivery at or>34 weeks are recommended in those women with severe features or adverse maternal or fetal conditions, such as fetal growth restriction or fetal distress. If delivery is done before 34 weeks' gestation, corticosteroids should be administered to the mother for fetal lung maturity.(70) Many patients with preeclampsia are treated with magnesium sulfate to minimize the risk of seizures. As magnesium is excreted by kidneys, a lower dose is recommended for women with kidney failure. Careful monitoring for clinical signs of magnesium toxicity and magnesium levels is needed.(72)"
        text: |
          - **CHIPS**: الضبط الشديد قلّل الـ severe hypertension بس من غير فرق في النتيجة. **CHAP**: ==<140/90== قلّل النتايج السيئة (30.2% مقابل 37%). فالهدف على الغسيل <140/90.
          - Preeclampsia من غير severe features: ولادة عند ==37 أسبوع==. مع severe features: استقرار وولادة عند **34** أو بعدها، و steroids لو قبل 34.
          - **Magnesium sulfate** بجرعة **أقل**: الكلية هي اللي بتطلّعه.
      - kind: reveal
        page: 377
        quote: "Many patients with preeclampsia are treated with magnesium sulfate to minimize the risk of seizures. As magnesium is excreted by kidneys, a lower dose is recommended forwomen with kidney failure."
        prompt: "ليه الـ magnesium sulfate بجرعة أقل عند الست اللي على الغسيل؟"
        answer: |
          الكتاب بيقول السبب: الـ magnesium ==excreted by kidneys==. والكلية مش شغالة، فالجرعة العادية هتتراكم.

          التفسير المقبول (مش في الكتاب): الـ magnesium العالي بيعمل ضعف عضلات، يبدأ بإن الـ **reflexes** تختفي، وبعدين **respiratory depression**. عشان كده الكتاب بيقول راقب ==clinical signs of magnesium toxicity== والـ levels.
      - kind: explain
        page: 378
        title: "المتابعة"
        quote: "The incidence of cervical incompetence is high in women treated with dialysis, and screening is suggested between 18 and 20 weeks. Preeclampsia should be screened by monitoring BP and laboratory chemistries, including complete blood counts and liver function tests, twice a month. (77) Minimizing fluctuations in BP during dialysis sessions prevents uteroplacental insufficiency. For a patient receiving dialysis, pregnancy is considered high risk, and fetal anomaly screening is recommended. (78)"
        text: |
          75-80% بس بيوصلوا الـ second trimester بطفل عايش، و **82%** منهم preterm.
          - **Cervical incompetence**: screening في ==18-20 أسبوع==.
          - **Preeclampsia**: ضغط و complete blood count (CBC) و liver function tests **مرتين في الشهر**.
          - قلل تقلبات الضغط في الجلسة عشان متعملش uteroplacental insufficiency، واعمل **fetal anomaly scan**.
      - kind: explain
        page: 378
        title: "ليه المتابعة دي بالذات؟"
        quote: "The incidence of cervical incompetence is high in women treated with dialysis, and screening is suggested between 18 and 20 weeks. Preeclampsia should be screened by monitoring BP and laboratory chemistries, including complete blood counts and liver function tests, twice a month."
        text: |
          الكتاب بيقول إن الـ fetal morbidity جاية من **premature rupture of membranes** و **premature labor** و ==cervical incompetence==. والمتابعة بتطارد التلاتة دول:

          - **Cervical incompetence** عالي على الغسيل، فـ screening في **18-20 أسبوع**.
          - **Preeclampsia:** ضغط و CBC و liver tests **مرتين في الشهر**، لأن البول مش هيساعدك.
          - **تقلبات الضغط في الجلسة:** الكتاب بيقول تقليلها بيمنع **uteroplacental insufficiency**. التفسير المقبول (مش في الكتاب): لو الضغط وقع في الجلسة، المشيمة أول واحدة تجوع.
          - **Fetal anomaly screening:** لأن الحمل ده **high risk**.
      - kind: check
        page: 377
        quote: "Despite the best care offered to pregnant dialysis women, only 75%-80% of pregnancies reach the second trimester with surviving infants, out of which 82% are born premature. Fetal morbidity can be because of premature rupture of membranes, premature labor, and cervical incompetence."
        question: "Which causes of fetal morbidity in dialysis pregnancies does the lecture list?"
