    kind: enumerate
    topic: thrombocytosis
    prompt: Enumerate the causes of reactive thrombocytosis.
    points: [Iron deficiency, Blood loss (acute or chronic), Hyposplenism or splenectomy, Surgery, Acute bacterial infection, Chronic inflammation, Malignancies, Rebound thrombocytosis, Drugs (vincristine)]
    pass: 6
    src: { page: 139, quote: "Iron deficiency Blood loss (acute or chronic) Hyposplenism/splenectomy Surgery" }
    status: unverified
