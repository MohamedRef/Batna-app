  - id: hem.L03.lesson5
    title: "الفول والـ antibodies: G6PD والـ immune haemolysis"
    hook: "طبق فول أخضر ممكن يودّي طفل المستشفى. وجسمك نفسه ممكن يعمل antibodies ضد كراتك، سخنة أو باردة."
