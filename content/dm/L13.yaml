  - id: dm.L13.102
    kind: case
    topic: treatment
    stem: Mrs. Halima, 23, primigravida with type 1 DM for 15 years, is 6 weeks pregnant. Her retinal exam shows moderate non-proliferative retinopathy, and her A1C is 9.2%.
    steps:
      - question: What caution applies when you tighten her control?
        options: [Rapid tight control can worsen retinopathy, Tight control always improves retinopathy at once, Retinopathy is irrelevant in pregnancy, Stop insulin until an ophthalmology review]
        answer: 0
        why: Rapid implementation of tight control with retinopathy is associated with worsening; she needs eye follow-up.
      - question: Which monitoring does ADA recommend for her?
        options: [CGM with SMBG for pre- and postprandial goals, A1C every 3 months only, Glucose management indicator as her A1C, Urine glucose]
        answer: 0
        why: CGM is recommended in T1DM pregnancy and reduces LGA infants and neonatal hypoglycemia.
      - reveal: At 30 weeks she needs more insulin every week.
        question: Why?
        options: [Insulin resistance rises until about 37 weeks, Insulin crosses the placenta, The 1st-trimester fall is ending, Lactation]
        answer: 0
        why: Rapidly increasing insulin resistance needs weekly or biweekly dose increases until about the 37th week.
      - question: How should her TDI be split by now?
        options: [Basal <50% and prandial >50%, Basal 80% and prandial 20%, Basal only, Equal fixed doses]
        answer: 0
        why: There is a shift toward prandial insulin over pregnancy.
      - question: In active labor, what happens to her insulin needs?
        options: [Less insulin per hour, but never zero, Stop all insulin, Double the basal dose, Switch to metformin]
        answer: 0
        why: Active labor needs less insulin per hour, but T1DM requires exogenous insulin at all times.
