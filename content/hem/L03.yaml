  - id: hem.L03.141
    kind: order
    topic: pnh
    prompt: Order the chain from complement lysis to smooth muscle symptoms in PNH.
    steps:
      - Complement breaks down the red cell membrane
      - Haemoglobin is released and saturates haptoglobin
      - Free haemoglobin binds nitric oxide irreversibly
      - NO is depleted
      - Smooth muscle contracts (vasoconstriction, gut spasm, pulmonary hypertension)
    src: { page: 50, quote: "Breakdown of RBC membranes by complement leads to the release of hemoglobin into the circulation. Hemoglobin is bound to haptoglobin for efficient clearance from the circulation. After saturating the haptoglobin, free hemoglobin circulates and binds irreversibly with nitric oxide (NO), depleting NO levels in peripheral blood." }
    status: unverified
