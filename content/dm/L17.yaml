  # ---------- p216-217: secondary osteoporosis ----------
  - id: dm.L17.014
    kind: enumerate
    topic: secondary
    prompt: Mention causes of secondary osteoporosis listed in the lecture text.
    points:
      - Glucocorticoid excess
      - Male hypogonadism
      - Hyperparathyroidism
      - Hyperthyroidism
      - Malignancy
      - Immobilization
      - Hepatic insufficiency
      - Gastrectomy
      - Rheumatoid arthritis
      - Acromegaly
      - COPD
      - Chronic renal failure
      - Heparin therapy
    pass: 8
    src: { page: 216, quote: "Secondary osteoporosis may result from many causes, including glucocorticoid excess, male hypogonadism, hyperparathyroidism, hyperthyroidism, malignancy, immobilization" }
    status: unverified
  - id: dm.L17.015
    kind: cloze
    topic: secondary
    text: "Secondary causes account for less than {{c1::5%}} of osteoporosis in postmenopausal women, but a much higher share in {{c2::young women and men of all ages}}."
    src: { page: 216, quote: "These secondary causes account for < 5% of all cases of osteoporosis in postmenopausal women." }
    status: unverified
    tags: [numbers]
  - id: dm.L17.016
    kind: card
    topic: secondary
    front: What must be considered when an elderly patient has osteoporosis?
    back: Multiple causes.
    src: { page: 217, quote: "Furthermore, in the elderly, multiple causes must be considered." }
    status: unverified
  - id: dm.L17.017
    kind: card
    topic: secondary
    front: Leading cause of premature osteoporosis?
    back: Endogenous or exogenous glucocorticoid excess.
    src: { page: 217, quote: "Endogenous or exogenous glucocorticoid excess is a leading cause of premature osteoporosis." }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.018
    kind: enumerate
    topic: secondary
    prompt: How do corticosteroids cause osteoporosis?
    points:
      - Inhibit osteoblastic function
      - Stimulate bone resorption
      - Increase parathyroid hormone secretion
      - Inhibit intestinal calcium absorption
      - Decrease end-organ response to vitamin D
    pass: 4
    src: { page: 217, quote: "Corticosteroids inhibit osteoblastic function, stimulate bone resorption, increase parathyroid hormone secretion, inhibit intestinal calcium absorption" }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.019
    kind: table
    topic: secondary
    title: Table 258-2 Secondary causes of osteoporosis
    columns: [Group, Examples]
    rows:
      - [Endocrine, "Female hypogonadism (hyperprolactinemia, hypothalamic amenorrhea, anorexia nervosa, premature ovarian failure), male hypogonadism (Klinefelter, hypogonadotropic, delayed puberty), hyperthyroidism, hyperparathyroidism, hypercortisolism, GH deficiency, vitamin D deficiency, idiopathic hypercalciuria, diabetes mellitus"]
      - [Gastrointestinal, "Subtotal gastrectomy, malabsorption, chronic obstructive jaundice, primary biliary cirrhosis and other cirrhoses, alactasia"]
      - [Bone marrow, "Multiple myeloma, lymphoma, leukemia, hemolytic anemias, systemic mastocytosis, disseminated carcinoma"]
      - [Connective tissue, "Osteogenesis imperfecta, Ehlers-Danlos, Marfan, homocystinuria"]
      - [Drugs, "Alcohol, heparin, glucocorticoids, thyroxine, anticonvulsants, GnRH agonists, cyclosporine, tacrolimus, chemotherapy"]
      - [Miscellaneous, "Immobilization, rheumatoid arthritis, renal tubular acidosis"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 217, quote: "SECONDARY CAUSES OF OSTEOPOROSIS" }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.020
    kind: enumerate
    topic: secondary
    prompt: Name drugs that cause secondary osteoporosis (Table 258-2).
    points:
