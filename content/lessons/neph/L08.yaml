        title: "ليه الجدار صلب؟"
        quote: "In dense deposit disease the capillary walls appear rigid & thickened"
        text: |
          الكتاب: في الـ ==dense deposit disease== الـ capillary walls بتبان **rigid & thickened**.

          ليه؟ التفسير المقبول (مش في الكتاب): في معظم الأمراض الـ deposits بتقعد **جنب** الغشا (تحت الـ endothelium أو تحت الـ podocyte). في الـ DDD الـ deposits بتدخل **جوّه** الـ GBM نفسه وتحل محل وسطه، زي ما تحط أسمنت جوّه خرطوم. الخرطوم المرن يبقى ماسورة: تخينة وما بتتنيش، والـ IF بيوري الـ C3 شرايط (ribbons) ماشية مع الجدار. وده نفس سبب إنه مختلف عن الـ type I MPGN اللي فيه double contour: هنا مفيش غشا جديد، فيه غشا اتملى.

          وليه الـ DDD مشهور بالـ transplant؟ التفسير المقبول (مش في الكتاب): المشكلة في الـ **complement** اللي في الدم، مش في الكلية. فلما تزرع كلية جديدة، نفس الـ complement المنفلت بيوصلها ويعمل نفس الـ deposits، عشان كده الـ recurrence عالي. ونفس الفكرة بتشرح ليه الـ C3 في الدم بيفضل واطي سنين: الجسم بيستهلكه طول الوقت.
      - kind: check
