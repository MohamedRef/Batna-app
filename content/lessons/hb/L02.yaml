  # ------------------------------------------------------------------
  - id: hb.L02.lesson1
    # Three topics on purpose: p23-24 introduce the principle and the two test families in one list; 2 pages, about 15 cards.
    title: "نستبعد الأول: منطق الـ NITs"
    hook: "ليه الـ non-invasive tests بتطمّنك أكتر ما بتخضّك، وإيه اللي في صندوق العُدّة."
    minutes: 8
    pages: [23, 24]
    topics: [principles, serum-tests, elastography]
    goals:
      - "تشرح ليه الـ NITs بتستبعد (rule out) أكتر ما بتشخّص في الناس قليلة الخطورة"
      - "تفرّق بين الـ patented والـ non-patented serum tests"
      - "تفرّق بين أنواع الـ elastography: shear wave speed ولا displacement"
    status: unverified
    steps:
      - kind: explain
        page: 23
        title: "القاعدة رقم واحد"
        quote: "Non-invasive fibrosis tests should be used for ruling out rather than diagnosing advanced fibrosis in low prevalence populations (LoE 1, Strong recommendation)."
        text: |
          الـ **non-invasive tests (NITs)** معمولة علشان نبطّل نعمل **liver biopsy** لكل واحد عنده إنزيمات عالية شوية.

          الكتاب بيبدأ بأهم جملة: في الناس اللي الـ **advanced fibrosis** نادرة فيهم (low prevalence)، الـ NITs بتستخدم علشان تستبعد (==rule out==)، مش علشان تشخّص.

          ليه؟ تعالى نحسبها بمثال:
          - عندك 100 واحد، 3 بس منهم عندهم advanced fibrosis.
          - حتى لو التست كويس، هيطلع positive غلط في كام واحد من الـ 97 السليمين، فأغلب الـ positives هتبقى **false positive**.
          - لكن لو التست طلع negative، احتمال إنه غلطان صغير جدًا، يعني الـ ==negative predictive value== عالية.

          فالنتيجة الواطية بتقفل الملف، والعالية بتفتح تحقيق مش أكتر.

          وعلشان كده بنستخدمها في الناس اللي عندهم risk، مش في الـ unselected general population:
          - **Metabolic risk factors**: سكر، سمنة، دهون.
          - و/أو **harmful use of alcohol**.
      - kind: aside
        tone: analogy
        page: 23
        quote: "| Serum biomarkers: Non Patented | Serum biomarkers: Patented | Elastography techniques |\n|---|---|---|\n| AST/ALT ratio | FibroTest® | TE |\n| APRI | ELF™ | ARFI / 2D SWE |\n| FIB-4 | FibroMètre® | MRE |\n| NAFLD fibrosis score (NFS) | Hepascore | |\nAvailability → Cost: Primary care → Liver clinics"
        text: |
          الـ non-invasive tests (NIT) زي كمين المرور: لو عدّيت والجهاز ما صفّرش، غالبًا انت تمام وروّح.

          لو صفّر؟ مش معناها إنك مجرم، معناها ركّن على جنب نتأكد (transient elastography (TE)، patented test، أو biopsy). وما ينفعش تعمل كمين في كل شارع في البلد، اعمله في الطريق اللي فيه المشاكل: الـ metabolic والـ alcohol.
      - kind: figure
        remind: [hb.L02.004, hb.L02.003]
        page: 23
        quote: "| Serum biomarkers: Non Patented | Serum biomarkers: Patented | Elastography techniques |\n|---|---|---|\n| AST/ALT ratio | FibroTest® | TE |\n| APRI | ELF™ | ARFI / 2D SWE |\n| FIB-4 | FibroMètre® | MRE |\n| NAFLD fibrosis score (NFS) | Hepascore | |\nAvailability → Cost: Primary care → Liver clinics"
        title: "صندوق العُدّة في الكتاب: الدم والـ elastography"
        image: { file: hb/L02-nit-toolbox.webp, book: true }
        alt: "Book figure: two groups of tools. Serum biomarkers: non-patented (AST/ALT ratio, APRI, FIB-4, NAFLD fibrosis score) and patented (FibroTest, ELF, FibroMeter, Hepascore). Elastography techniques with photos of the machines: TE, ARFI/2D SWE and MRE. Below, an arrow shows availability falling and cost rising from primary care to liver clinics."
        caption: |
          دي صورة الكتاب اللي في أول المحاضرة، وفيها كل الأدوات اللي الدرس ده بيتكلم عنها:

          - **شمال فوق: Serum biomarkers** في عمودين: الـ **Non Patented** (AST/ALT ratio، AST-to-platelet ratio index (APRI)، fibrosis-4 index (FIB-4)، NAFLD fibrosis score) والـ **Patented** (FibroTest، ELF، FibroMeter، Hepascore).
          - **يمين فوق: Elastography techniques** بصور الأجهزة: **TE** (الـ FibroScan)، **ARFI / 2D SWE** (على جهاز الـ ultrasound)، و **magnetic resonance elastography (MRE)** (جهاز الرنين).
          - **تحت**: سهمين: ==Availability== (الأخضر، بيقل كل ما تروح يمين) و **Cost** (الأحمر، بيزيد كل ما تروح يمين)، وتحتهم سهم أزرق من **Primary care** لـ **Liver clinics**.

          يعني الترتيب من الشمال لليمين هو ترتيب الاستخدام: تبدأ بالـ FIB-4 الرخيص المتاح في الـ primary care، وتسيب الـ MRE الغالي لعيادة الكبد. وده نفس منطق الـ ==rule out== اللي فوق: التست الرخيص المتاح يستبعد الأغلبية، والغالي للقلة اللي فضلت.
      - kind: sort
        page: 23
        quote: "| Serum biomarkers: Non Patented | Serum biomarkers: Patented | Elastography techniques |\n|---|---|---|\n| AST/ALT ratio | FibroTest® | TE |\n| APRI | ELF™ | ARFI / 2D SWE |\n| FIB-4 | FibroMètre® | MRE |\n| NAFLD fibrosis score (NFS) | Hepascore | |\nAvailability → Cost: Primary care → Liver clinics"
        prompt: "حط كل test في مكانه:"
        bins: ["Non-patented", "Patented"]
        cards:
          - { text: "FIB-4", bin: 0 }
          - { text: "AST-to-platelet ratio index (APRI)", bin: 0 }
          - { text: "Aspartate aminotransferase (AST)/ALT ratio", bin: 0 }
          - { text: "Non-alcoholic fatty liver disease (NAFLD) fibrosis score (NFS)", bin: 0 }
          - { text: "FibroTest", bin: 1 }
          - { text: "Enhanced liver fibrosis (ELF)", bin: 1 }
          - { text: "FibroMeter", bin: 1 }
          - { text: "Hepascore", bin: 1 }
        why: "الـ **non-patented** معادلات ببلاش من تحاليل روتينية (aspartate aminotransferase (AST)، alanine aminotransferase (ALT)، platelets، age). الـ **patented** ليها براءة اختراع، يعني kit بفلوس فيه markers مش روتينية زي haptoglobin و hyaluronic acid."
      - kind: explain
        remind: [hb.L02.003]
        page: 24
        quote: "ALT, AST and platelet count should be part of the routin investigations in primary care in patients with suspected liver disease, so that simple non-invasive scores can be readily calculated (LoE 2, Strong recommendation)."
        title: "علشان المعادلات تشتغل، لازم التحاليل تبقى موجودة"
        text: |
          الكتاب بيوصّي إن **ALT** و **AST** و **platelet count** يبقوا جزء من الـ routine investigations في الـ primary care لأي حد مشكوك إن عنده liver disease.

          السبب بسيط: من التلاتة دول، ومعاهم السن، تقدر تحسب الـ scores البسيطة زي ==fibrosis-4 index (FIB-4)== و **AST-to-platelet ratio index (APRI)** فورًا، من غير أي تحليل زيادة.

          وبيوصّي كمان بـ automatic calculation and systematic reporting للـ FIB-4 في الناس اللي عندهم risk (metabolic أو alcohol)، علشان الـ **risk stratification** يتحسن.

          يعني المعمل يطبع الـ FIB-4 تحت النتيجة لوحده. الدكتور المشغول مش محتاج يفتكر يحسبه، والمريض اللي في خطر ما يعدّيش من غير ما حد يشوفه.
      - kind: explain
        page: 24
        quote: "Display of shear wave speed, which is calculated by measuring the arrival time of a shear wave at different locations in the tissue. These elastography techniques are called shear wave elastography (SWE) and include transient elastography (TE), point shear wave elastography (pSWE), and multidimensional shear wave elastography (2D-SWE and 3D-SWE)."
        title: "الـ elastography بتقيس إيه بالظبط؟"
        text: |
          الفكرة كلها: بنزق النسيج زقّة صغيرة ونشوف بيتصرف إزاي. الكتاب بيقول فيه طريقتين نعرض بيهم النتيجة:

          - **Displacement without further processing**: بنشوف الإزاحة نفسها على الشاشة، ودي اللي في الـ **acoustic radiation force impulse (ARFI) imaging**.
          - **Shear wave speed**: السرعة بتتحسب من الـ arrival time بتاع الـ shear wave عند أماكن مختلفة في النسيج.

          الطريقة التانية دي هي عيلة الـ ==shear wave elastography (SWE)==، وفيها:
          - ==Transient elastography (TE)==: الـ FibroScan، أشهرهم.
          - **Point SWE (pSWE)**.
          - **2D-SWE** و **3D-SWE**.

          وليه السرعة بتقول على التليف؟ لأن الموجة بتجري أسرع في النسيج الناشف. الكبد المتليف زي حبل مشدود: تنقر طرفه، الرعشة توصل الطرف التاني بسرعة. والكبد السليم زي حبل سايب: الموجة بتمشي ببطء.
      - kind: check
        page: 24
        quote: "Display of shear wave speed, which is calculated by measuring the arrival time of a shear wave at different locations in the tissue. These elastography techniques are called shear wave elastography (SWE) and include transient elastography (TE), point shear wave elastography (pSWE), and multidimensional shear wave elastography (2D-SWE and 3D-SWE)."
        question: "According to the lecture, which elastography method displays **displacement without further processing**?"
        options:
          - "ARFI imaging"
          - "Transient elastography (TE)"
          - "Point shear wave elastography (pSWE)"
          - "2D shear wave elastography"
        answer: 0
        why:
          - "صح: الكتاب بيقول الـ displacement من غير processing هو اللي في الـ **ARFI imaging**."
          - "الـ TE من عيلة الـ **shear wave speed** (SWE)، مش displacement."
          - "الـ pSWE برضه **shear wave speed**، الكتاب حاططه مع الـ SWE."
          - "الـ 2D-SWE و 3D-SWE هما الـ **multidimensional** SWE، يعني shear wave speed."
      - kind: try
        items: [hb.L02.002, hb.L02.003, hb.L02.008]
    recap:
      - "الـ NITs في الناس قليلة الخطورة **بتستبعد** أكتر ما بتشخّص، واستخدمها في الـ at-risk (metabolic و/أو alcohol)."
      - "Non-patented (APRI، FIB-4) ببلاش من تحاليل روتين؛ patented (FibroTest، ELF…) بفلوس."
      - "ALT و AST و platelets روتين في الـ primary care، والـ FIB-4 يتحسب ويتطبع أوتوماتيك."
      - "SWE (TE، pSWE، 2D/3D-SWE) بتقيس **shear wave speed**، والـ ARFI بتعرض **displacement**."
    practice: [hb.L02.001, hb.L02.002, hb.L02.003, hb.L02.004, hb.L02.005, hb.L02.006, hb.L02.007, hb.L02.008, hb.L02.009, hb.L02.010, hb.L02.011, hb.L02.012, hb.L02.013, hb.L02.067, hb.L02.087]

  # ------------------------------------------------------------------
  - id: hb.L02.lesson6
    title: "الطرق في العيادة: primary care و ALD و HCV و NAFLD"
    hook: "FIB-4 الأول، وبعدين FibroScan، وإمتى تعيده بعد أسبوع من غير خمرة."
    minutes: 9
    pages: [24, 25]
    topics: [pathways]
    goals:
      - "تمشي في الـ primary-care pathway: fibrosis-4 index (FIB-4) ثم TE ثم patented tests"
      - "تعرف ليه الـ TE بيكدب في الـ ALD النشط وبعد الـ SVR"
      - "تحفظ أرقام الـ rule-out في non-alcoholic fatty liver disease (NAFLD): 8 kPa و 0.48 و 1.3"
    status: unverified
    steps:
      - kind: figure
        page: 24
        quote: "Patients at risk for chronic liver disease\n1. Check for liver risk factors: Metabolic syndrome, alcohol, HBV, HCV, familial history\n2. Test AST, ALT, GGT, ALP and platelet count\nViral hepatitis / other causes of chronic liver diseases or clinical signs of advanced liver disease / cirrhosis:\n  Liver clinic: Referral to liver specialist\nMetabolic co-factors and/or alcohol only?\n  Calculate FIB-4* (Age, AST, ALT, platelet)\n    <1.30, Low risk: No need for referral, Lifestyle modifications, Re-test in 1-3 years\n    ≥1.30, Intermediate-High risk: Liver stiffness by transient elastography*\n      <8 kPa, Low risk: No need for referral, Lifestyle modifications, Re-test in 1-3 years\n      ≥8 kPa, Intermediate-High risk:\n        Patented serum tests** Not available: Consider liver biopsy\n        Patented serum tests** Available = combine:\n          Discordance: Consider liver biopsy\n          Concordance: F3-F4 highly likely"
        title: "شكل 1 في الكتاب: الطريق من الـ primary care لعيادة الكبد"
        image: { file: hb/L02-fig1-pathway.webp, book: true }
        alt: "Book Figure 1 flowchart. A shaded upper-left area (primary care): patients at risk for chronic liver disease; check liver risk factors and test AST, ALT, GGT, ALP and platelets; 'Metabolic co-factors and/or alcohol only?'; calculate FIB-4. FIB-4 below 1.30 (low risk) leads left to 'No need for referral, lifestyle modifications, re-test in 1-3 years'. FIB-4 1.30 or more leads to liver stiffness by transient elastography; below 8 kPa goes back to the low-risk box. A dashed lower-right area (liver clinic): 8 kPa or more leads to patented serum tests, not available (consider liver biopsy) or available and combined; discordance means consider liver biopsy, concordance means F3-F4 highly likely. On the right, viral hepatitis, other causes or signs of cirrhosis go straight to referral to a liver specialist."
        caption: |
          ده **Fig. 1** اللي الكتاب بيشاور عليه في ص25 ("see Fig. 1")، ومقسوم لمنطقتين:

          - **المنطقة المظللة (فوق شمال) = الـ primary care**: من فوق لتحت: الـ risk factors والتحاليل (AST، ALT، GGT، ALP، platelets)، وبعدين السؤال الأحمر **Metabolic co-factors and/or alcohol only?**، وبعدين **Calculate FIB-4**.
          - من الـ FIB-4 سهمين: **<1.30 Low risk** نازل شمال للصندوق الأخضر (No need for referral، lifestyle، re-test in 1–3 years)، و **≥1.30** نازل يمين لـ **Liver stiffness by transient elastography**.
          - من الـ TE: لو **<8 kPa** السهم المتقطع بيرجع شمال لنفس الصندوق الأخضر.
          - **المنطقة المتقطعة (تحت يمين) = Liver clinic**: الـ **≥8 kPa** بينزل لـ **Patented serum tests**: مش متاحة ← Consider liver biopsy؛ متاحة ← combine: **Discordance** ← biopsy، **Concordance** ← ==F3-F4 highly likely== (الصندوق الأحمر تحت يمين).
          - **يمين فوق**: viral hepatitis أو أسباب تانية أو علامات cirrhosis ← **Referral to liver specialist** على طول، من غير FIB-4.

          الشكل بيثبت ترتيب الدرس: الـ ==FIB-4== هو البوّاب في العيادة العامة، والـ TE هو التفتيش التاني، والمريض الـ metabolic أو الـ alcohol ما يدخلش عيادة الكبد إلا لو الاتنين عاليين.
      - kind: case
        page: 24
        quote: "Patients at risk for chronic liver disease\n1. Check for liver risk factors: Metabolic syndrome, alcohol, HBV, HCV, familial history\n2. Test AST, ALT, GGT, ALP and platelet count\nViral hepatitis / other causes of chronic liver diseases or clinical signs of advanced liver disease / cirrhosis:\n  Liver clinic: Referral to liver specialist\nMetabolic co-factors and/or alcohol only?\n  Calculate FIB-4* (Age, AST, ALT, platelet)\n    <1.30, Low risk: No need for referral, Lifestyle modifications, Re-test in 1-3 years\n    ≥1.30, Intermediate-High risk: Liver stiffness by transient elastography*\n      <8 kPa, Low risk: No need for referral, Lifestyle modifications, Re-test in 1-3 years\n      ≥8 kPa, Intermediate-High risk:\n        Patented serum tests** Not available: Consider liver biopsy\n        Patented serum tests** Available = combine:\n          Discordance: Consider liver biopsy\n          Concordance: F3-F4 highly likely"
        stem: "Three patients in a primary-care clinic. Use the primary-care pathway on p24 (the step-wise pathway on p30 comes in lesson 3)."
        steps:
          - reveal: "Patient 1: 50-year-old woman, type 2 diabetes and obesity, no alcohol, no viral markers. FIB-4 is 1.1."
            question: "What next?"
            options:
              - "Low risk: no referral, lifestyle changes, re-test in 1–3 years"
              - "Transient elastography now to stage the fibrosis"
              - "Refer to a liver specialist for assessment"
              - "Liver biopsy to confirm the fibrosis stage"
            answer: 0
            why: "FIB-4 أقل من 1.30 = low risk. مفيش referral، lifestyle، ونعيد بعد **1–3 years**. الـ NIT هنا عمل شغلته: استبعد."
          - reveal: "Patient 2: same profile, but FIB-4 is 1.9. TE shows 14 kPa. A FibroTest is available and agrees."
            question: "How is this read?"
            options:
              - "F3–F4 highly likely"
              - "Low risk, re-test in 1–3 years"
              - "Consider liver biopsy"
              - "No conclusion without MRE"
            answer: 0
            why: "FIB-4 1.30 أو أكتر ودّاه للـ TE، و 8 kPa أو أكتر يبقى intermediate-high، والـ patented test **concordant** يبقى **F3–F4 highly likely**. لو كان discordant أو مش متاح: consider biopsy. (وفي pathway صفحة 30 كمان: أكتر من 12 kPa يبقى high risk، فالاتنين متفقين هنا.)"
          - reveal: "Patient 3: 40-year-old man, HBsAg positive, normal FIB-4."
            question: "Where does he go?"
            options:
              - "Straight to a liver specialist"
              - "Lifestyle advice and re-test in 1–3 years"
              - "TE first, then decide"
            answer: 0
            why: "الشجرة دي للـ metabolic و/أو alcohol only. الـ viral hepatitis أو أي سبب تاني، أو علامات advanced disease، يروحوا **liver clinic** على طول مهما كان الـ FIB-4."
      - kind: explain
        page: 25
        quote: "LSM by TE >12- 15 kPa is recommended to rule-in advanced fibrosis, after considering causes of false positives (LoE 2; strong recommendation). In patients with elevated liver stiffness and biochemical evidence of hepatic inflammation (AST or GGT >2xULN), LSM by TE should be repeated after at least 1 week of alcohol abstinence or reduced drinking (LoE 3; strong recommendation)."
        title: "ALD و HCV: الرقم ممكن يكدب"
        text: |
          **Alcohol (ALD)**

          لما المريض يتحوّل، **liver stiffness measurement (LSM)** بالـ TE أكتر من 12–15 kPa بيعمل ==rule-in== للـ advanced fibrosis. بس بشرط: تستبعد أسباب الـ false positive الأول.

          ولو الـ stiffness عالية ومعاها التهاب واضح (AST أو **gamma-glutamyl transferase (GGT)** أكتر من 2× upper limit of normal (ULN)):
          - أعد الـ TE بعد أسبوع على الأقل من الامتناع عن الخمرة أو تقليلها.
          - ليه؟ الالتهاب نفسه بيخلّي الكبد منفوخ وناشف، فالرقم بيطلع أعلى من التليف الحقيقي.
          - مثال: مريض LSM بتاعه 18 kPa والـ AST ضعفين ونص الطبيعي. ما تقولش cirrhosis النهارده، استنى أسبوع امتناع وأعد.

          **Hepatitis C virus (HCV) بعد الـ sustained virological response (SVR)**

          - الـ NITs والـ TE مش موصى بيها روتينيًا علشان نكشف الـ **fibrosis regression**.
          - والـ cut-offs بتاعة الـ untreated HCV ما تتستخدمش للـ staging بعد الـ ==SVR==.
          - ليه؟ الالتهاب راح فالـ stiffness نزلت بسرعة، بس ده مش معناه إن التليف اتشال بنفس السرعة. الرقم الواطي هنا ممكن يطمّنك على الفاضي.
      - kind: aside
        tone: joke
        page: 25
        quote: "LSM by TE should be repeated after at least 1 week of alcohol abstinence or reduced drinking"
        text: |
          المريض: «يا دكتور أنا بطّلت شرب من امبارح، اعملّي FibroScan تاني.» 😄

          الكتاب بيقول: أسبوع على الأقل. الكبد محتاج يفوق من السهرة قبل ما نصدّق رقمه.
      - kind: check
        page: 25
        quote: "Cut-offs of LSM by TE used in patients with untreated HCV should not be used to stage liver fibrosis after SVR (LoE 4; strong recommendation)."
        question: "A man had HCV with LSM 16 kPa before treatment. A year after SVR his LSM is 9 kPa. What does the lecture say?"
        options:
          - "Don't stage him with the untreated-HCV cut-offs; the fall doesn't prove regression"
          - "He has regressed to F2, so stop HCC surveillance"
          - "Repeat TE every 3 months to document regression"
          - "Use the NAFLD rule-out cut-off of 8 kPa instead"
        answer: 0
        why:
          - "صح: الكتاب بيقول الـ untreated cut-offs **should not be used** بعد الـ SVR، والـ NITs مش موصى بيها روتينيًا لكشف الـ regression. الالتهاب راح فالرقم نزل، والتليف ممكن يكون لسه موجود."
          - "ده بالظبط الغلط اللي الكتاب بيحذّر منه: الرقم الواطي بعد SVR مش staging موثوق."
          - "الكتاب: **routine use … not recommended to detect fibrosis regression after SVR**."
          - "الـ 8 kPa ده rule-out في الـ NAFLD، مش بعد HCV."
      - kind: explain
        page: 25
        quote: "In patients with NAFLD: Liver biopsy remains the reference standard for the diagnosis of NASH, because none of the available NITs has acceptable accuracy (LoE 2)."
        title: "NAFLD: تلات أرقام تقفل الملف"
        text: |
          في **non-alcoholic fatty liver disease (NAFLD)**، أي واحد من دول بيعمل rule out للـ advanced fibrosis:

          - ==LSM by TE==: أقل من 8 kPa.
          - ==FibroTest==: أقل من 0.48 (patented).
          - ==FIB-4==: أقل من 1.3 (non-patented).

          ولو FIB-4 فوق 1.3: ما تقفلش الملف، استخدم TE و/أو **patented serum tests** علشان تعمل rule out أو rule in. يعني الرقم البسيط بيفرز، والتست الأدق بيحسم.

          وخلي بالك من حاجتين:
          - الـ liver biopsy لسه هي الـ **reference standard** لتشخيص **non-alcoholic steatohepatitis (NASH)**، لأن مفيش NIT دقته مقبولة في الـ NASH نفسه (الالتهاب والـ ballooning محتاجين ميكروسكوب).
          - أدق NIT للـ staging هو **magnetic resonance elastography (MRE)**، بس هو بالكاد أحسن من الباقيين في F3–F4، وغالي ومش متاح، فمش first-line.
      - kind: aside
        tone: tip
        page: 25
        quote: "Patented tests: FibroTest® <0.48"
        text: |
