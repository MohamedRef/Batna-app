      - kind: explain
        remind: [neph.L09.180]
        page: 301
        title: "الـ intradialytic hypotension"
        quote: "Intradialytic hypotension mostly associated with increased UF can lead to:\n  Severe metabolic acidosis\n  Myocardial ischemia.\n  Ischemic cerebro-vascular accidents.\n  Venous thrombosis (retina vein)."
        text: |
          سببها الأساسي ==UF كتير==. نتايجها: severe metabolic acidosis، myocardial ischaemia و stunning، ischaemic stroke، venous thrombosis (retinal vein)، intestinal ischaemia، arteritis الرجلين بتسوء، الجلسة تتقفل بدري (inadequate dialysis)، الـ access يتجلّط، والوفيات تزيد.

          ليه الـ UF الكتير بيوقّع الضغط؟ التفسير المقبول (مش في الكتاب): الماكينة بتسحب مية من **الدم** بس. المية اللي في الأنسجة (الـ oedema) لازم ترجع للدم لوحدها (plasma refilling)، وده بطيء. لو سحبت أسرع من الـ refilling، الدم يقل والضغط يقع، حتى لو العيان لسه وارم. عشان كده الحل مش «اسحب أقل» بس، الحل **وقت أطول** أو جلسات أكتر، وتقليل الملح والمية بين الجلسات. والقلب اللي بيتعرض لهبوط كل جلسة بيعمل stunning يتراكم، وده سبب إن الـ IDH مربوط بالوفيات.
      - kind: aside
        tone: exam
        page: 302
        quote: "Dialysis Outcomes and Practice Patterns Study (DOPPS), which included 22 000 HD patients from seven countries, found that a UFR>10 mL/kg/h correlated with higher odds of IDH [odds ratio (OR) 1.30; P = 0.045] and a higher risk of all-cause mortality (relative risk 1.09; P = 0.02), while there was no association between UFR and cardiovascular mortality [Kidney Int 2006; 69: 1222–1228]."
        text: |
          رقم الـ Dialysis Outcomes and Practice Patterns Study (DOPPS): **ultrafiltration rate (UFR) أكتر من ==10 mL/kg/h==** = intradialytic hypotension (IDH) أكتر و **all-cause mortality** أعلى، بس **مش** cardiovascular mortality. ودراسة 2011: أكتر من 10–13 بيزوّد الاتنين.
