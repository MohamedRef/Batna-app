  - id: endo.L06.lesson4
    title: "الأدوية اللي بتلعب في الغدة"
    hook: "الـ amiodarone لوحده ممكن يعمل تلات أنماط مختلفة. والـ lithium والـ interferon والـ sunitinib ليهم وشوش تانية."
    minutes: 9
    pages: [107, 108]
    topics: [drugs]
    goals:
      - "تعرف الطريقتين اللي الأدوية بتلعب بيهم في الـ TFTs"
      - "تعرف أنماط الـ iodide والـ amiodarone والـ lithium والـ TKIs والـ immune modulators"
      - "تعرف الأدوية اللي بتوطّي الـ TSH وليه نادرًا بتعمل مرض"
    status: unverified
    steps:
      - kind: explain
        page: 107
        quote: "A lot of commonly prescribed drugs may result in altered thyroid function/status, either by – modulating the HPT axis itself, – or through downstream effects on thyroid hormone transport or metabolism."
        title: "الأدوية بتلعب بطريقتين"
        text: |
          الكتاب بيقسم الأدوية لنوعين:
          1. **بتغيّر الـ HPT axis نفسه**: يا إما بتأثر على الـ TSH من الـ pituitary، يا إما على إفراز T4 و T3 من الغدة. دول بيعملوا **مرض حقيقي** أحيانًا (hypo أو hyper).
          2. **بتأثر downstream** على الـ transport أو الـ metabolism: زي الأدوية اللي بتغيّر الـ TBG أو بتزاحم عليه (الدرس الجاي). دول غالبًا بيغيّروا **الرقم** مش حالة المريض.

          ليه التفريق ده مهم؟ لأن النوع الأول ممكن يحتاج علاج، والتاني محتاج بس تقرا التحليل صح. فلما تلاقي TFTs غريبة على دوا، اسأل: الدوا ده بيلعب في الغدة، ولا في التحليل؟
      - kind: explain
        page: 107
        quote: "Examples of drugs directly affecting pituitary TSH or thyroidal T4 & T3 secretion in previously euthyroid subjects.\n| Drugs | Drug | TFT patterns | Comments |\n|---|---|---|---|\n| Drugs affecting thyroid hormone secretion | Iodide | 1. ↑TSH, ↓FT4 | Inorganic iodide (dietary/supplements) as well as iodine containing organic compounds (e.g. radiological contrast agents) can cause a transient disturbance of thyroid function; patients with diminished thyroid reserve (e.g. chronic autoimmune thyroiditis) are at risk of developing persistent hypothyroidism. |\n|  |  | 2. ↓TSH, ↑FT4 | Individuals with latent/low-grade thyroid autonomy (e.g. in a pre-existing MNG) may develop overt hyperthyroidism following exposure to iodine-containing compounds (Jod-Basedow effect), which may persist for months |\n|  | Amiodarone | 1. Transient ↑TSH; ↑FT4, normal FT3 | Short-lived rises in TSH are common during the first few months of treatment with amiodarone; inhibition of type 1 DIO leads to persistent elevation of FT4, but normal FT3 |\n|  |  | 2. ↓TSH, ↑FT4 | Two main types of thyrotoxicosis are recognised: type 1 (large iodine load precipitating latent thyroid autonomy); type 2 (destructive thyroiditis); amiodarone inhibits T4 → T3 conversion such that T4 is typically more markedly elevated than T3 |\n|  |  | 3. ↑TSH, ↓FT4 | Hypothyroidism occurs in up to 15% of patients (particularly women and those with positive antithyroid antibodies); it may reflect failure to escape from the Wolff-Chaikoff effect |\n|  | Lithium | 1. ↑TSH, ↓ or normal FT4 | Overt or subclinical hypothyroidism |\n|  |  | 2. ↓TSH, ↑FT4 | Thyroiditis occurs in a small number of patients and is typically self-limiting |\n|  | TKIs | 1. ↑TSH, ↓FT4 | Primary hypothyroidism (possibly due to a direct toxic effect on the thyroid gland) has been observed with some TKIs, e.g. Sunitinib, Sorafenib |\n|  |  | 2. ↓TSH, ↑FT4 | A prodromal thyrotoxic phase is occasionally seen in patients receiving Sunitinib |\n|  | Immune modulators | 1. ↓TSH, ↑FT4 | Graves' disease has been reported in patients receiving: (i) Alemtuzumab (a humanised monoclonal antibody directed against CD52) for multiple sclerosis; (ii) HAART for HIV infection; (iii) INFα for chronic hepatitis C |\n|  |  | 2. ↑TSH, ↓FT4 | Hashimoto's thyroiditis may complicate INFα therapy (± prodromal thyrotoxic phase) |"
        title: "اليود: يقفل ولا يفتح؟"
        text: |
          اليود من الأكل أو الـ supplements أو الـ **contrast** ممكن يعمل حاجتين عكس بعض:

          - **↑thyroid-stimulating hormone (TSH)، ↓free thyroxine (FT4)**: اضطراب مؤقت، وممكن hypothyroidism دايم لو الغدة احتياطيها قليل (chronic autoimmune thyroiditis).
          - **↓TSH، ↑FT4**: ==Jod-Basedow==، يعني overt hyperthyroidism بعد iodine-containing compounds لو فيه autonomy (زي multinodular goitre (MNG) قديمة)، وممكن يفضل شهور.

          والـ **Wolff-Chaikoff** = اليود العالي جوه الغدة بيوقف تصنيع T4 و T3.
