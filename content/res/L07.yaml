      It threatens the integrity of research, erodes public trust in science, and can harm the rights and welfare of subjects.
    src: { page: 81, quote: "Conflict of Interest:\n  Financial or other personal considerations may compromise an investigator's judgment in the conduct of research or the reporting of results.\n  Conflicts of interest may threaten the integrity of research, erode public trust in science, and negatively affect the rights and welfare of human subjects." }
    status: unverified
  - id: res.L07.081
    kind: card
    topic: ethics
    front: What is equipoise, and when is it ethical to run an experimental study?
    back: >-
      Genuine uncertainty about the right course of action, that is, whether to give or withhold a treatment: enough belief to justify
      exposing subjects to it and enough doubt to justify withholding it. A trial is ethical only when the expert community is in equipoise.
    src: { page: 82, quote: "Equipoise: Is a state of mind characterized by genuine uncertainty about the appropriate course of action, that is, to give or withhold a particular treatment.\nIt is ethical to conduct an experimental study only when there is a state of equipoise in the expert community:\n  Sufficient belief to justify exposing subjects to treatment\n  Sufficient doubt to justify withholding treatment from subjects" }
    status: unverified
