        caption: |
          الصورة تلات عواميد تحت **Perform LSM**:

          - **العمود الشمال**: **≤ 6 kPa** ← No significant fibrosis ← **F0، F1** ← **No biopsy**.
          - **العمود اللي في النص (الرمادي)**: **Intermediate values** ← ==Grey area== ← **F2** ← **Biopsy if results influence management**، وتحتها: استخدم non-invasive tests تانية (Implementation of other non-invasive tests).
          - **العمود اليمين**: **≥ 12.5 kPa** ← Advanced fibrosis ← **F3، F4** ← **No biopsy** ← **Treatment or Follow-up**.
          - السطر الصغير تحت شمال هو المرجع: Vizzutti et al., Gut 2009.

          الكتاب لوّن العمود اللي في النص بس بالرمادي: ده المكان الوحيد اللي الـ biopsy ليها فيه دور. الطرفين الاتنين مكتوب تحتهم **No biopsy**، وده بالظبط معنى إن الـ ==LSM== يغنيك عن الإبرة في أغلب الناس.
