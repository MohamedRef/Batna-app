            why: "Colonoscopy is more accurate for neoplasms of all sizes and takes tissue for histology; sigmoidoscopy misses the right colon."
      - kind: explain
        page: 177
        quote: "Tumors of the rectosigmoid region may manifest with hematochezia,"
        title: "الشمال: انسداد، والـ rectosigmoid: دم ومغص"
        text: |
          الكتاب:
          - الـ **distal colon** ممكن ينزف، بس غالبًا بيعمل ==constriction== للحيطة: abdominal cramping، stool obstruction، أو حتى **perforation**.
          - الـ **rectosigmoid**: **hematochezia**، **tenesmus**، و **narrowing of the caliber of the stool**.
          - الـ DD للـ rectal bleeding: hemorrhoids، angiodysplasia، diverticulosis، وأورام تانية.

          التفسير المقبول (مش في الكتاب): في الشمال البراز بقى **ناشف** والقولون **أضيق**، فأي ورم بيلف حوالين الحيطة (annular) بيسد بسرعة. والـ tenesmus هو إحساس إن لسه فيه حاجة عايزة تنزل، لأن الورم نفسه في الـ rectum بيتحس كأنه براز. وعلشان البواسير شائعة جدًا، أكبر غلطة إنك تقول «بواسير» لراجل عنده 60 سنة ونزيف من غير ما تشوف القولون.
      - kind: explain
        page: 177
        quote: "Metastatic spread to the pelvic region may become evident as bladder dysfunction, sacral or sciatic nerve pain, and vaginal discharge or bleeding."
        title: "لما ينتشر"
        text: |
          - **Hepatomegaly**، umbilical mass، ascites.
          - Pelvic spread: ==bladder dysfunction==، sacral أو sciatic pain، vaginal discharge أو bleeding.
          - الـ **lung** و bone marrow ممكن يفضلوا silent لحد advanced disease.
          - الـ digital rectal examination (DRE) ممكن يلاقي distal rectal cancer أو spread للـ rectal shelf.
          - الـ differential diagnosis (DD) للـ rectal bleeding: hemorrhoids، angiodysplasia، diverticulosis، وأورام تانية.

          التفسير المقبول (مش في الكتاب): ليه الـ bladder والـ sciatic؟ لأن الـ rectum والـ sigmoid قاعدين في الحوض جنب المثانة والرحم والأعصاب اللي خارجة من الـ sacrum، فالورم لما يكبر بيضغط عليهم أو يغزوهم. وليه الكبد أول حاجة؟ لأن دم القولون كله بيروح له بالـ portal vein.
      - kind: explain
        page: 177
        quote: "Prior history of colorectal cancer or adenomatous polyps"
        title: "الـ history والفحص: بتدوّر على إيه؟"
        text: |
          الكتاب: الـ diagnosis محتاج history و physical و lab و radiology بحكمة. في الـ history اسأل عن: ==prior CRC أو adenomatous polyps==، **IBD**، **inherited syndromes**، وأي **first-degree relative** عنده CRC.
          في الفحص: علامات **Peutz-Jeghers** برّه الأمعاء، والـ metastatic disease: **hepatomegaly**، **umbilical mass**، **ascites**.

          التفسير المقبول (مش في الكتاب): أسئلة الـ history دي هي نفسها عوامل الخطر اللي شفتها، ودورها هنا إنها تحدد المريض **average risk** ولا **high risk**، لأن ده بيغيّر الـ screening والمتابعة. والـ Peutz-Jeghers علامته المشهورة نقط بنية على الشفايف والبُق، فبصّة واحدة على وش المريض ممكن تغيّر التشخيص.
      - kind: explain
        page: 178
        quote: "Preop CEA reflects prognosis, disease extent (over 10-20 poor)"
        title: "المعمل والـ CEA"
        text: |
          - **Occult blood** في 40-80% من الـ advanced cases، و iron deficiency anemia، وممكن liver enzymes عالية.
          - ==Preop CEA== بيعكس الـ prognosis والـ extent (فوق 10-20 وحش)، وممكن يعلى في الـ poorly differentiated أو الـ rectal.
          - بس الكتاب واضح: **CEA really only good for follow up**.

          التفسير المقبول (مش في الكتاب): ليه الـ CEA مش للتشخيص؟ لأنه ممكن يبقى طبيعي في سرطان صغير، ويعلى عند المدخنين وفي أمراض تانية. بس لو كان عالي قبل العملية ونزل بعدها، أي طلوع جديد علامة إن الورم رجع، وده دوره الحقيقي.
      - kind: explain
        page: 178
        quote: "Colonoscopy is more accurate than radiographic studies for the detection of"
        title: "Colonoscopy: ليه هي الأساس؟"
        text: |
          الكتاب: الـ colonoscopy ==procedure of choice== لأي مريض عنده **occult blood** أو أعراض الـ CRC. وهي **أدق من الأشعة** لكل الأحجام، وبتاخد **tissue** للـ histology.
          وقبل العلاج: H&P، CXR، CBC، LFTs، urinalysis، EUS، proctoscopic exam، full colonoscopy، و CT colography. والـ **accurate preoperative staging critical** لأن الـ stage بيغيّر العلاج.

          التفسير المقبول (مش في الكتاب): الأشعة بتقولك «فيه حاجة»، لكن ما تقدرش تقولك إيه هي، وما تقدرش تشيلها. الـ colonoscopy بتشوف وتاخد biopsy وتشيل البوليب في نفس الجلسة. وليه الـ «full» colonoscopy قبل العملية حتى لو الورم معروف؟ علشان الـ synchronous lesions (زي اللي في Lynch) ممكن تغيّر حجم العملية.
      - kind: explain
        page: 179
        quote: "50-75% of involved LN are normal in size, so may not be picked up."
        title: "الـ EUS: أحسن واحد للعمق، وضعيف في الـ nodes"
        text: |
          الكتاب:
          - الـ **EUS** أدق tool للـ T stage: ==67-93% accuracy==، و superior to CT أو MRI للعمق. سهل يفرّق T1 من T3، وصعب T2 من T3.
          - حدوده: خبرة اللي بيعمله، الـ nodes ولا blood vessels، تغيّرات بعد الإشعاع، الأورام الضيقة، **overstaging 10-15%** و understaging 1-2%.
          - الـ nodes: EUS 62-83% و CT 35-73%. كل الـ tests بتشوف **الحجم** بس، و **50-75%** من الـ nodes المصابة **حجمها طبيعي**.
          - الـ node فوق **3 mm** و **hypoechoic** غالبًا malignant، والـ FNA تحت الـ EUS بتساعد.
          - الـ **CT** أحسن من الـ EUS للـ **contiguous organs** والـ distant spread.

          التفسير المقبول (مش في الكتاب): ليه الـ overstaging؟ الالتهاب حوالين الورم بيبان في السونار زيه بالظبط، فالجهاز بيشوف الورم أعمق من حقيقته. والـ T2 من T3 صعب لأن الفرق بينهم طبقة رفيعة (العضلة) والالتهاب بيغطيها.
      - kind: figure
        page: 179
        title: "سرطان القولون في المنظار"
        image: { file: git/L04-colon-cancer-colonoscopy.webp, book: true }
        alt: "Book colonoscopy picture of a bulky, lobulated mass growing from the colon wall into the lumen."
        caption: |
          **Mass** كبيرة متفصّصة طالعة من الحيطة. الـ ==colonoscopy== بتشوفها وتاخد منها biopsy في نفس الوقت.
      - kind: match
        page: 179
        quote: "Superior to CT or MRI for depth of tumor."
        prompt: "وصّل كل test بأحسن حاجة بيعملها في الـ CRC:"
        pairs:
