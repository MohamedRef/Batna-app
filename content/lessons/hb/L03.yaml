  - id: hb.L03.lesson5
    title: "النزيف: أول 12 ساعة"
    hook: "ليه نقل الدم الزيادة بيزوّد النزيف؟ وليه الـ FFP ما ينفعش رغم إن الـ INR 2؟ الـ ABCDE بتاع الدوالي."
    minutes: 10
    pages: [48, 52]
    topics: [acute-bleeding, endoscopy]
    goals:
      - "ترتّب أول خطوات النزيف الحاد: airway، دم بحساب، antibiotics، أدوية، منظار"
      - "تشرح ليه الـ Hb target 7–9 وليه الـ FFP ضار"
      - "تحفظ أرقام الأدوية والمنظار: 80%، 90%، 3–5 أيام، 12 ساعة"
      - "تقارن الـ band ligation بالـ sclerotherapy"
    status: unverified
    steps:
      - kind: mnemonic
        page: 48
        quote: "Initial measures are directed at general resuscitation, i.e. at securing the airway and at stabilization of the circulation."
        word: "ABCDE"
        parts:
          - { key: "A", text: "Airway and circulation first: general resuscitation" }
          - { key: "B", text: "Blood carefully: Hb between 7 and 9 g/dL; no fresh frozen plasma (FFP)" }
          - { key: "C", text: "Cover with antibiotics: short-term prophylaxis for all (IV ceftriaxone if advanced disease and unstable)" }
          - { key: "D", text: "Drugs, vasoactive: terlipressin, somatostatin or octreotide, for 3–5 days" }
          - { key: "E", text: "Endoscopy: band ligation within 12 hours (preferably 6)" }
        hook: |
          زي الـ **ABCDE** بتاع الطوارئ، بس نسخة الدوالي. كل حرف خطوة من الكتاب، والترتيب ده هو اللي هتكتبه في سؤال الـ essay.
      - kind: explain
        page: 48
        quote: "Initial measures are directed at general resuscitation, i.e. at securing the airway and at stabilization of the circulation."
        title: "A و B: الإنعاش من غير ما تغرّق المريض"
        text: |
          **Initial measures**: الـ general resuscitation الأول، وده معناه:
          - ==Securing the airway==: المريض بيرجّع دم وممكن يشفط، فالـ airway قبل أي حاجة.
          - **Stabilization of the circulation**.

          ==Careful replacement of volemia==: الـ Hb بين 7 و 9 g/dL.

          والكتاب بيقول: في **rat model** للـ portal hypertensive bleeding، الـ portal pressure والـ blood loss والـ mortality بيزيدوا مع الـ blood transfusion.
      - kind: reveal
        page: 48
        quote: "Rat model of portal hypertensive bleeding: portal pressure, blood loss and mortality increases with blood transfusion"
        prompt: "المريض بينزف... ليه ما نرفعش الـ Hb لـ 10 أو 12 ونرتاح؟"
        answer: |
          ارجع للمعادلة **P = R × F**.

          كل ما تزوّد الـ volume، الـ flow في الـ portal بيزيد، فالـ portal pressure يعلى، والـ clot اللي على الدوالي ممكن يتشال. يعني إنت بتطفي الحريقة بالبنزين.

          وده بالظبط اللي الـ rat model وريه: transfusion أكتر = ضغط أعلى ونزيف أكتر ووفيات أكتر.
      - kind: update
        page: 48
        quote: "Careful replacement of volemia: Hb between 7 and 9 g/dl"
        text: "Baveno VII بيستخدم **restrictive strategy**: transfusion لما الـ Hb يوصل حوالي 7 g/dL، والـ target 7–8 g/dL. رقم الكتاب 7–9 g/dL هو اللي يتكتب في الامتحان."
        ref: "Baveno VII consensus, 2021"
      - kind: figure
        page: 49
        title: "تجربة الـ 214 مريض في الكتاب"
        image: { file: hb/L03-restrictive-transfusion.webp, book: true }
        alt: "Book figure. Left: '214 Variceal bleeders' split into standard transfusion (n=105, aim Hb 9-10 g/dL) and restricted transfusion (n=109, aim Hb 7-8 g/dL). Right: survival curves over days; the green restricted-transfusion line stays above the blue standard-transfusion line, P=0.028."
        caption: |
          الصورة دي هي الدليل على رقم الـ Hb اللي فوق:

          - **شمال**: **214 Variceal bleeders** اتقسموا لمجموعتين: **Standard Transfusion** (n=105، Aim Hb 9-10 g/dL) و **Restricted Transfusion** (n=109، Aim Hb 7-8 g/dL).
          - **يمين**: منحنى الـ survival على الأيام: الخط ==الأخضر (restricted)== فوق الخط الأزرق (standard) طول الوقت، و **P=0.028** فوق.

          يعني لما نقّلنا دم أقل، المرضى عاشوا أكتر. وده نفس منطق الـ rat model: دم زيادة = ضغط أعلى = نزيف تاني.
      - kind: explain
        remind: [hb.L03.057]
        page: 49
        quote: "Multiple lines of evidence suggest that variceal bleeding, one of the most common bleeding complications, is fully unrelated to haemostatic failure but is altogether attributable to portal hypertension and local vascular abnormalities."
        title: "الـ INR عالي... بس دي مش مشكلة تجلّط"
        text: |
          **الـ international normalised ratio (INR) عالي، بس دي مش مشكلة تجلّط**

          - الأدلة بتقول إن الـ variceal bleeding unrelated to haemostatic failure، وسببه portal hypertension و local vascular abnormalities بالكامل.
          - يعني الدوالي بتنفجر من الضغط، مش لأن الدم مش بيتجلط. زي خرطوم مية مضغوط اتقطع: المشكلة في الضغط، مش في المية.

          ومع ذلك، المرضى بياخدوا blood products أو prohaemostatic therapy كتير «زي أي نزيف كبير»:
          - الـ ==fresh frozen plasma (FFP)== أو الـ **platelet concentrate** غالبًا ineffective.
          - ومرتبطين بـ infection، **transfusion-related acute lung injury (TRALI)**، و **transfusion-associated circulatory overload (TACO)**.

          الكتاب صريح: Transfusion of FFP during acute variceal bleeding is ineffective and does harm.
          - مرتبط بـ failure to control bleeding at 5 days.
          - ومرتبط بـ mortality at 42 days.

          والربط بالخطوة اللي فاتت: الـ FFP volume كمان، فبيرفع الـ F زي الدم بالظبط.
      - kind: aside
        tone: trap
        page: 49
        quote: "Transfusion of FFP during acute variceal bleeding is ineffective and does harm."
        text: |
          الـ INR في الـ cirrhosis ما بيعبّرش عن خطر النزيف زي ما بيعبّر في مريض الـ warfarin. الكبد بيقلل الـ pro-coagulants والـ anti-coagulants مع بعض.

          فلو السؤال قال «INR 2.1، platelets 60، variceal bleeding: give FFP?» ← **لأ**. الـ FFP كمان volume، يعني ضغط أعلى.
      - kind: explain
        page: 49
        quote: "Short-term antibiotic prophylaxis not only decreases the rate of bacterial infections but also increases survival and is considered standard of care."
        title: "C: الـ infection هو العدو الخفي"
        text: |
          من أهم مضاعفات الـ variceal hemorrhage: **bacterial infection**.

          ليه؟ الدم في الأمعاء والمناعة الضعيفة في الـ cirrhosis بيسهّلوا إن البكتيريا تعدّي. والـ infection نفسه بيرفع الـ portal pressure ويزوّد الـ rebleeding.

          - ==Short-term antibiotic prophylaxis== بيقلل الـ infections وبيزوّد الـ survival، وده standard of care لكل مريض.
          - و randomized controlled trial (RCT) حديثة: IV **ceftriaxone** ممكن يكون superior في مرضى advanced liver disease و haemodynamic instability.

          يعني المضاد الحيوي مش اختياري: ده جزء من علاج النزيف نفسه، زي الـ vasoactive drug بالظبط.
      - kind: explain
        page: 48
        quote: "Pharmacotherapy e.g. with octreotide, a synthetic somatostatin analogue, or terlipressin, a synthetic vasopressin analogue, has been shown to be effective in stopping hemorrhage, at least temporarily, in up to 80% of patients."
        title: "D و E: الأدوية والمنظار"
        text: |
          **Vasoactive drugs**
          - ==Octreotide== (synthetic somatostatin analogue) أو ==terlipressin== (synthetic vasopressin analogue) بيوقفوا النزيف، على الأقل مؤقتًا، في up to 80%.
          - **Somatostatin** may be superior to octreotide.

          إزاي بيشتغلوا؟ بيمنعوا إفراز الـ vasodilator hormones في الأمعاء، فيحصل splanchnic vasoconstriction و decreased portal inflow. الـ F تاني! والاتنين safe وأعراضهم الجانبية قليلة جدًا.

          **Endoscopy**
          - **Sclerotherapy** و **variceal ligation** بيوقفوا النزيف في up to 90%.
          - Octreotide (أو terlipressin) لمدة 3–5 أيام + endoscopic therapy أحسن من أي واحد لوحده: rebleeding أقل و transfusion أقل في الأيام الأولى.

          ليه الاتنين مع بعض؟ المنظار بيسد الثقب، والدوا بيوطّي الضغط اللي عمل الثقب. واحد بيصلّح الخرطوم، والتاني بيقفل الحنفية شوية.
      - kind: figure
        page: 50
        quote: "Top Left: large varix with red color sign in lower esophagus. Top Right: injection sclerotherapy using sclerosant with contrast medium."
        title: "الـ sclerotherapy بعينك"
        image: { file: hb/L03-sclerotherapy.webp, book: true }
        marks:
          - { at: [0.39, 0.48], label: "Red colour sign" }
          - { at: [0.86, 0.48], size: [0.22, 0.58], label: "Sclerosant with contrast in the varices", kind: box }
        alt: "Book figure. Left: endoscopy of a large varix with a red colour sign in the lower oesophagus. Right: X-ray during injection sclerotherapy, with sclerosant mixed with contrast medium filling the varices."
        caption: "دالية كبيرة عليها red sign (1). والمادة اللي بتتحقن (2) (مع صبغة) وهي ماشية جوه الدوالي. فهمت ليه بتعمل ulcers بعدين؟ دي كيميا بتحرق الجدار."
      - kind: figure
        page: 51
        quote: "Endoscopy shows two varices in the distal esophagus that have been banded. The bands are indicated with the green arrows. The two strings in the right of the field control the trigger device used to deploy the bands."
        title: "الرباط بيشتغل إزاي؟"
