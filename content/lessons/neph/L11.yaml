        tone: exam
        page: 373
        quote: "Second trimester and third-trimester use of ACEi/ARB is associated with complications, such as oligohydramnios and fetal and neonatal death. (61) Diuretics can be used during pregnancy in women with kidney failure. (62) Currently, there are no human trials to report the safety of sodium-glucose cotransporter-2 inhibitors in pregnant patients. Animal data suggest that they may affect in-utero kidney development and maturation, and it is therefore advised to stop sodium-glucose cotransporter-2 inhibitors 6 weeks before conception.(63) Statins have been contraindicated in pregnancy because of their teratogenic risk. The risk of teratogenicity has been shown in animal studies, in which it is commonly seen with lipophilic statins such as atorvastatin and less commonly seen with hydrophilic statins such as pravastatin. (64) In July 2021, however, the United States Food and Drug Administration requested to remove this recommendation based on recent human studies, which have failed to show major congenital malformations or still birth with statin use. (65) A cohort study published in 2015 failed to show a statistically significant increase in the risk of teratogenic effects after adjusting for potential confounders. (66) Another study did not show congenital anomalies with statin use during pregnancy but did identify a greater risk of low birth weight (RR,1.51; 95% CI, 1.05-2.16) and premature birth (RR, 1.99; 95% CI, 1.46-2.71) in comparison with women without statin use. (67) Anemia may worsen during pregnancy because of volume expansion and increased demands of the growing fetus. Increased doses of parenteral iron (oral or intravenous) and erythropoietin-stimulating agents may be needed during pregnancy to maintain a hemoglobin level of 10-11g/L. (68) For hyperphosphatemia during pregnancy, calcium-based binders and vitamin D analogs are preferred over non-calcium-based phosphate binders or calcimimetics because of limited data on the latter agents with pregnancy. (69)"
        text: "الكتاب فيه الاتنين: الـ Fig 3 (صفحة 374) بيحط الـ statins في الممنوع، والنص (صفحة 373 و 393) بيقول إن الـ US Food and Drug Administration (FDA) في يوليو 2021 طلبت تشيل الـ contraindication بعد دراسات على البشر ما بيّنتش تشوهات كبيرة. يعني الـ contraindication المطلقة اتشالت، بس الـ statins لسه مش دوا روتيني في الحمل، والـ FDA لسه بتنصح أغلب الحوامل يوقفوها."
      - kind: try
        items: [neph.L11.080, neph.L11.103, neph.L11.110, neph.L11.118, neph.L11.124]
