        page: 7
        title: "الـ platelets بتطلع إزاي؟"
        quote: "\"Large numbers of platelets are formed from the cytoplasm of each mature megakaryocyte, these are rapidly discharged directly into the marrow sinusoids. The residual \"\"bare\"\" megakaryocyte nucleus is phagocytosed by macrophages.\""
        text: |
          الـ ==megakaryocyte== الناضج **سيتوبلازمه** بيتفتت لعدد كبير من الـ **platelets**، اللي بتنزل على طول في الـ **marrow sinusoids**.

          النواة اللي بتفضل لوحدها (**bare nucleus**) بتاكلها الـ **macrophages**.

          ليه مباشرة في الـ sinusoids؟ بص على شكل ص 5: الـ megakaryocyte قاعد لازق في حيطة الـ **venous sinus**، فحتت السيتوبلازم بتتقطع جوه الدم على طول من غير ما تمشي في النخاع. وعشان الـ platelet مالهاش نواة، هي حتة سيتوبلازم مش خلية كاملة، ودي حاجة هتفرق معاك لما تتكلم عن عمرها القصير.
      - kind: explain
        page: 7
        title: "Extramedullary haematopoiesis: المصنع القديم يرجع يشتغل"
        quote: "In certain abnormal circumstances, the spleen, liver and lymph nodes revert back to producing immature blood cells. In these cases, enlargement of the spleen and liver is frequently noted on physical examination. This situation suggests that undifferentiated primitive blood cells may be present in these areas and are able to proliferate if an appropriate stimulus is present.\nThis occurs under the following conditions:\n  1- When the bone marrow becomes dysfunctional in cases such as: myelofibrosis, infiltration by malignant cells.\n  2- When the bone marrow is unable to meet the demands placed on it, as in severe hemolytic anemias."
        text: |
          في ظروف معينة الـ **spleen** والـ **liver** والـ **lymph nodes** بيرجعوا يعملوا خلايا دم صغيرة، فتلاقي ==hepatosplenomegaly== في الكشف.

          ده بيحصل في حالتين:
          1. **نخاع بايظ**: ==myelofibrosis==، أو **infiltration by malignant cells**.
          2. **نخاع مش ملاحق**: زي الـ **severe haemolytic anaemias**.
