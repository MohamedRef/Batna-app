      - kind: explain
        page: 19
        title: "الـ BNP مش بيكدب، بس مش لوحده"
        quote: "Causes of elevated natriuretic peptides"
        text: |
          الـ natriuretic peptides بتعلى في حاجات كتير غير الـ HF:

          **Cardiac:** acute coronary syndrome (ACS)، pulmonary embolism (PE)، myocarditis، left ventricular hypertrophy (LVH)، cardiomyopathies، valves، arrhythmias، cardioversion أو implantable cardioverter-defibrillator (ICD) shock، pulmonary hypertension…

          **Non-cardiac:** ==advanced age==، ==renal dysfunction==، stroke و subarachnoid haemorrhage (SAH)، cirrhosis with ascites، chronic obstructive pulmonary disease (COPD)، sepsis، burns، anemia، thyrotoxicosis و diabetic ketoacidosis (DKA).

          يعني عند الحاج اللي عنده 86 سنة و chronic kidney disease (CKD)، الـ B-type natriuretic peptide (BNP) ممكن يعلى شوية من غير HF. الـ echo هو اللي يحكم.
