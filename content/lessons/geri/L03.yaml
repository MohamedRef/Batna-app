  - id: geri.L03.lesson2
    title: "الكبد العجوز: Phase I تعبان، Phase II شغال"
    hook: "ليه الدكتور الكبير يكتب oxazepam مش diazepam؟ الإجابة في كلمتين: phase two."
    minutes: 8
    pages: [42, 46]
    topics: [hepatic, pk, renal]
    goals:
      - "تفرّق بين Phase I و Phase II ومين اللي بيتأثر بالسن"
      - "تعرف قاعدة جرعة الـ high و low extraction drugs"
      - "تحفظ الأدوية اللي بتخرج من الكلية"
    status: unverified
    steps:
      - kind: explain
        page: 42
        title: "الكبد بيصغر وبيبطّأ"
        quote: "Reduced liver function due to decreased liver size, blood flow, and disease (e.g. CHF)"
        text: |
          الـ drug metabolism ==very liver dependent==، والكبد عند الكبار:
          - **أصغر**.
          - الـ **blood flow** أقل.
          - وممكن فيه مرض زي **CHF**.

          والـ biotransforming enzymes عمومًا أقل.
      - kind: table
        page: 44
        quote: "Phase I (introduction of functional groups) Oxidation Reduction Hydrolysis Most metabolites active and potentially hepatotoxic"
        title: "Phase I ولا Phase II؟"
        columns: [Phase, Reactions, Products]
        rows:
          - ["I", "Oxidation, reduction, hydrolysis", "Active, maybe hepatotoxic"]
          - ["II", "Conjugation: glucuronidation etc.", "Inactive, not toxic"]
        hide: [[0, 2], [1, 2]]
      - kind: explain
        page: 42
        title: "السن بيضرب Phase I بس"
        quote: "phase I reactions (oxidative) in the liver impaired even with normal ageing, phase II (conjugation reactions) - relatively spared."
        text: |
          - **Phase I** أي الـ oxidation: بيضعف ==even with normal ageing==. مثال الكتاب للـ first pass: **propranolol**.
          - **Phase II** أي الـ conjugation: ==relatively spared==.

          علشان كده ==Phase II drugs are preferred==، ومثال الكتاب: **oxazepam**.
      - kind: mnemonic
        page: 45
        quote: "Lorazepam (II) Oxazepam (II)"
        word: "LOT"
        parts:
          - { key: "L", text: "Lorazepam" }
          - { key: "O", text: "Oxazepam" }
          - { key: "T", text: "Temazepam (not in the book's table)" }
        hook: "كلمة **LOT**: الـ benzodiazepines الآمنة للكبد العجوز بتعدّي على phase II بس. الكتاب ذكر **L و O**، والـ T زيادة من المراجع."
      - kind: check
        page: 42
        quote: "Phase II - drugs are preferred (oxazepam)"
        question: "80-year-old needs a short benzodiazepine course. Which is preferred?"
        options:
          - "Oxazepam"
          - "Diazepam"
          - "Flurazepam"
          - "Chlordiazepoxide"
        answer: 0
        why:
          - "صح: phase II بس، والـ phase II spared مع السن."
          - "Phase I و lipophilic، الـ t½ بيطول جدًا."
          - "Long-acting وله active metabolites."
          - "بيتعمله oxidation لـ active metabolites طويلة."
      - kind: figure
        page: 45
        title: "High ولا low extraction؟"
        image: { file: geri/L03-hepatic-extraction.webp, book: true }
        quote: "Hepatic extraction of drugs"
        caption: "جدول الكتاب: **High extraction** أكتر من 0.5 زي ==propranolol، verapamil، morphine==، و **low extraction** أقل من 0.5 زي warfarin و theophylline و phenytoin. علامة II جنب lorazepam و oxazepam معناها phase II بس."
        alt: "The book's two-column list: high extraction drugs (bromocriptine, chlorpromazine, clomethiazole, dihydroergotamine, diltiazem, metoclopramide, metoprolol, midazolam, morphine, nifedipine, propranolol, verapamil) and low extraction drugs with their metabolic phases (antidepressants, codeine, diazepam, isoniazid, lorazepam II, neuroleptics, oxazepam II, phenobarbital, phenytoin, procainamide, quinidine, theophylline, warfarin)."
      - kind: table
        page: 45
        quote: "High extraction drugs - reduce initial dose by approximately 50% - find appropriate maintenance dose by uptitration"
        title: "الجرعة حسب نوع الدوا"
        columns: [Drug, Dose rule]
        rows:
          - ["High extraction", "Start ~50% lower, uptitrate; keep 30–50% lower"]
          - ["Low, phase I + II", "Start at maintenance; keep 30–50% lower"]
          - ["Low, phase II only", "No change"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 46
        quote: "Bioavailability - \"first-pass effect\"↓ ↑"
        prompt: "ليه الـ high extraction drug بالذات محتاج الجرعة الأولى تقل للنص؟"
        answer: |
          الـ high extraction drug الكبد بيكسر أغلبه من **أول مرور** بعد البلع. عند الكبار الـ ==first-pass effect== بيقل، فالـ **bioavailability** تعلى، وكمية أكبر توصل الدم من نفس الحباية.

          علشان كده تبدأ بنص الجرعة وتطلع بالراحة. (تفسير فارماكولوجي.)
      - kind: check
        page: 45
        quote: "Low extraction drugs with phase II metabolism - No change"
        question: "Lorazepam is low extraction with phase II metabolism only. Hepatic dose change in an 80-year-old?"
        options:
          - "No change"
          - "Halve the first dose, then uptitrate"
          - "Start at maintenance, cut 30–50%"
          - "Contraindicated"
        answer: 0
        why:
          - "صح: low extraction و phase II بس ← no change. بس start low, go slow برضه علشان الـ sensitivity."
          - "دي قاعدة الـ high extraction."
          - "دي قاعدة الـ low extraction بـ phase I و II."
          - "بالعكس، ده من الأدوية المفضلة."
      - kind: explain
        page: 45
        title: "أدوية بتخرج من الكلية"
        quote: "Drugs with predominant renal elimination Aminoglycosides Antimycotics: fluconazole, flucytosine Antivirals: acyclovir, gancyclovir, ribavirin"
        text: |
          الجرعة دي بتتظبط على الـ ==CrCl==:
          - **Aminoglycosides**
          - **Antimycotics**: fluconazole، flucytosine
          - **Antivirals**: acyclovir، ganciclovir، ribavirin
          - **Beta-blockers**: atenolol، sotalol
          - **Beta-lactams**: penicillins، cephalosporins
          - **Digoxin**، **H2-blockers**، **Lithium**
      - kind: mnemonic
        page: 46
        quote: "Betablockers: atenolol, sotalol Betalactam antibiotics: penicillins, cepha-losporins Digoxin H2-Blockers Lithium"
        word: "A-A-A-B-B-D-H-L"
        parts:
          - { key: "A", text: "Aminoglycosides" }
          - { key: "A", text: "Antimycotics: fluconazole, flucytosine" }
          - { key: "A", text: "Antivirals: acyclovir, ganciclovir" }
          - { key: "B", text: "Beta-blockers: atenolol, sotalol" }
          - { key: "B", text: "Beta-lactams" }
          - { key: "D", text: "Digoxin" }
          - { key: "H", text: "H2-blockers" }
          - { key: "L", text: "Lithium" }
        hook: "**تلات A، اتنين B، وبعدين DHL**: زي شركة الشحن، الأدوية دي بتتشحن برّه الجسم عن طريق **الكلية**."
      - kind: table
        page: 46
        quote: "Alterations in pharmacokinetics in geriatric patients Absorption ±unchanged"
        title: "ملخص الـ PK عند الكبار"
        columns: [Parameter, Change]
        rows:
          - ["Absorption", "About unchanged"]
          - ["Bioavailability", "Up (less first pass)"]
          - ["Vd, hydrophilic", "Down"]
          - ["Vd, lipophilic", "Up"]
          - ["Kidney elimination", "Down"]
          - ["Liver elimination", "Down"]
        hide: [[1, 1], [2, 1], [3, 1], [5, 1]]
      - kind: try
        items: [geri.L03.025, geri.L03.026, geri.L03.030, geri.L03.022, geri.L03.036]
    recap:
      - "الكبد أصغر والدم أقل، والـ enzymes أقل."
      - "Phase I يضعف، Phase II spared ← oxazepam و lorazepam."
      - "High extraction: نص الجرعة الأولى، والـ maintenance −30–50%."
      - "Low extraction phase II بس: no change."
      - "الكلية: AAA BB DHL."
    practice: [geri.L03.024, geri.L03.025, geri.L03.026, geri.L03.027, geri.L03.028, geri.L03.029, geri.L03.030, geri.L03.031, geri.L03.032, geri.L03.033, geri.L03.034, geri.L03.035, geri.L03.036, geri.L03.037, geri.L03.038, geri.L03.039, geri.L03.040, geri.L03.022, geri.L03.023]
  # ------------------------------------------------------------------
  - id: geri.L03.lesson3
    title: "الجسم بيحس بالدوا غير، والروشتة بتغلط"
    hook: "الـ morphine اللي بيسكّن الشاب ممكن ينيّم الحاج. والـ propranolol اللي بيبطّأ قلب الشاب، عند الحاج تأثيره أضعف."
    minutes: 8
    pages: [46, 48]
    topics: [pd, problems]
    goals:
      - "تعرف الـ pharmacodynamic changes لكل عضو"
      - "تحفظ الـ medication therapy problems التسعة"
      - "تعرف أمثلة الـ undertreatment و Beers"
    status: unverified
    steps:
      - kind: explain
        page: 46
        title: "الـ pharmacodynamics: نفس التركيز، تأثير مختلف"
        quote: "Ageing is associated with an increased sensitivity for many compounds- opiates, decreased B-adrenergic responses in the elderly"
        text: |
          مش بس الدوا بيوصل بكمية مختلفة، كمان الـ **receptor** بيرد بشكل مختلف:
          - ==increased sensitivity== لأدوية كتير، زي الـ **opiates**.
          - ==decreased β-adrenergic responses==، زي الـ propranolol والـ isoproterenol.
      - kind: table
        page: 46
        quote: "Urinary bladder: Anticholinergics → urine retention Eye: Anticholinergics → disturbed accommodation, acute glaucoma"
        title: "كل عضو والدوا اللي بيتعبه"
        columns: [Organ, Drug, Effect]
        rows:
          - ["Bladder", "Anticholinergics", "Retention"]
          - ["Eye", "Anticholinergics", "Glaucoma, blurred"]
          - ["CNS", "Benzos, opiates", "Sedation"]
          - ["CNS", "BB, digoxin", "Depression"]
          - ["BP", "ACEI, neuroleptics", "Hypotension"]
          - ["Kidney", "NSAIDs", "Renal failure"]
          - ["Heart, lungs", "BB, sympathomimetics", "Less response"]
        hide: [[0, 2], [1, 2], [3, 2], [4, 2], [5, 2]]
      - kind: match
        page: 47
        quote: "Blood pressure regulation: ACE-inhibitors, neuroleptics → hypotonia Kidney: NSAIDs → renal failure"
        prompt: "وصّل الدوا بالمشكلة اللي بيعملها عند الحاج:"
        pairs:
          - ["Anticholinergics", "Urine retention"]
          - ["Digoxin", "Depression"]
          - ["Opiates", "Sedation"]
          - ["NSAIDs", "Renal failure"]
          - ["Neuroleptics", "Hypotension"]
        why: "الجدول في ص 46–47."
      - kind: explain
        page: 47
        title: "إيه المختلف في روشتة الكبار؟"
        quote: "Risk/Benefit Ratio in this vulnerable, frail population. Ability to recognize side effects in the elderly is reduced."
        text: |
          - المشكلة ممكن تكون **underuse أو overuse أو misuse**.
          - الـ **PK والـ PD** متغيرين.
          - الـ ==risk/benefit== مختلف في الـ frail.
          - الـ **side effects** صعب تتعرف.
          - **دكاترة كتير** ومحدش بيكلم التاني.
          - الـ **adherence**.
      - kind: explain
        page: 47
        title: "تسع مشاكل في الأدوية"
        quote: "Polypharmacy: drug use without indication Undertreatment: indication without drug use"
        text: |
          - ==Polypharmacy==: دوا من غير indication.
          - ==Undertreatment==: indication من غير دوا.
          - Dose too low، و dose too high.
          - Adverse drug reaction، و drug interaction.
          - Inappropriate drug.
          - Lack of adherence.
          - Medication error.
      - kind: aside
        tone: joke
        text: "الـ polypharmacy والـ undertreatment زي اتنين أخوات بيتخانقوا على نفس الشنطة: واحد حاطط فيها أدوية مالهاش لازمة، والتاني ناسي فيها التطعيم. والحاج شايل الشنطة."
      - kind: explain
        page: 47
        title: "الـ undertreatment: الأدوية اللي بتتنسي"
        quote: "Examples of Undertreatment Pain management Pneumococcal and flu vaccine Depression Secondary heart attack prevention"
        text: |
          أمثلة الكتاب:
          - **Pain management**: الحاج بيستحمل الألم.
          - **Pneumococcal و flu vaccine**.
          - **Depression**: بيتحسب على إنه «كبر».
          - **Secondary heart attack prevention**.
      - kind: check
        page: 47
        quote: "Polypharmacy: drug use without indication Undertreatment: indication without drug use"
        question: "A 76-year-old had an MI last year and takes no statin or aspirin, with no contraindication. This is:"
        options:
          - "Undertreatment"
          - "Polypharmacy"
          - "Drug interaction"
          - "Dose too high"
        answer: 0
        why:
          - "صح: indication من غير دوا، وده من أمثلة الكتاب: secondary heart attack prevention."
          - "Polypharmacy = دوا من غير indication."
          - "مفيش دوا أصلًا علشان يعمل interaction."
          - "مفيش دوا أصلًا."
      - kind: explain
        page: 48
        title: "الـ ADEs بالأرقام"
        quote: "Rate of ADEs requiring hospitalization is nearly seven times greater for persons age 65 or over versus persons under age 65."
        text: |
          مقارنة بالأصغر من 65:
          - زيارات الطوارئ بسبب الـ ADE: ==أكتر من الضعف==.
          - دخول المستشفى بسبب الـ ADE: ==حوالي 7 أضعاف==.
      - kind: explain
        page: 48
        title: "الأدوية الـ inappropriate و Beers"
        quote: "\"Beers medications\" - medications considered potentially inappropriate for older adults based on risk versus benefit (expert consensus)"
        text: |
          مثالين للـ **inappropriate drug**:
          - **Antibacterial** لـ viral infection.
          - الـ ==Beers medications==: أدوية potentially inappropriate للكبار على أساس risk vs benefit، بـ **expert consensus**.
      - kind: update
