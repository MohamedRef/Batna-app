schema: batna.lesson/v1
lecture: rheum.L17
lessons:
  # ------------------------------------------------------------------
  - id: rheum.L17.lesson1
    title: "عيلة الـ spondyloarthritis: من الـ HLA-B27 للـ enthesis"
    hook: "ضهر شاب في العشرينات بيوجعه الصبح ويرتاح لما يتحرك. ده مش ضهر عادي، ده باب عيلة كاملة من الأمراض."
    minutes: 8
    pages: [279, 282]
    topics: [spa, as-history, etiology, pathology]
    goals:
      - "تعرف صفات الـ SpA المشتركة وتقسيمها"
      - "تلقط الـ AS من الـ history"
      - "تفهم دور HLA-B27 و ERAP-1 و IL-23/IL-17 والأمعاء"
    status: unverified
    steps:
      - kind: explain
        page: 279
        title: "يعني إيه SpA؟"
        quote: "which are classified as peripheral or axial (axSpA) based on what parts of the body are predominantly affected."
        text: |
          الـ ==spondyloarthropathy== عيلة أمراض روماتيزمية مختلفة بس قرايب: ليهم صفات clinical و genetic مشتركة.

          بنقسمهم حسب المكان اللي أكتر متأثر: **axial** (axSpA: العمود الفقري والـ sacroiliac) أو **peripheral**.
      - kind: mnemonic
        page: 279
        quote: "Absence of rheumatoid factor. Axial arthritis including spondylitis and sacroiliitis. Peripheral inflammatory oligoarthritis."
        word: "SPINE"
        parts:
          - { key: "S", text: "Seronegative: no rheumatoid factor" }
          - { key: "P", text: "Peripheral inflammatory oligoarthritis" }
          - { key: "I", text: "Inflammation of the enthesis (enthesitis rather than synovitis)" }
          - { key: "N", text: "Not just joints: eye, aortic valve, lung, skin" }
          - { key: "E", text: "Everybody in the family + HLA-B27 (familial aggregation, overlap)" }
        hook: "صفات الـ SpA كلها في **SPINE**: العمود الفقري نفسه هو اسم العيلة."
      - kind: explain
        page: 279
        title: "أفراد العيلة"
        quote: "Ankylosing spondylitis (AS). Non-radiographic axial SpA (nr-axSpA). Undifferentiated spondyloarthritis (UspA)."
        text: |
          1. **Ankylosing spondylitis** (AS)
          2. **Non-radiographic axial SpA** (nr-axSpA)
          3. **Undifferentiated SpA** (uSpA)
          4. **Reactive arthritis** (Reiter)
          5. SpA مع ==psoriasis==
          6. SpA مع ==IBD== (Crohn و UC)
          7. Juvenile-onset AS
      - kind: check
        page: 279
        quote: "Enthesitis rather than synovitis."
        question: "إيه الـ lesion الأساسي في الـ SpA اللي بيفرّقها عن الـ RA؟"
        options: ["Enthesitis", "Synovitis", "Vasculitis", "Crystal deposition"]
        answer: 0
        why:
          - "صح: الـ SpA = enthesitis أكتر من synovitis. الـ enthesis هو مكان ما الـ tendon أو الـ ligament بيمسك في العضم."
          - "الـ synovitis هو أساس الـ RA."
          - "الـ vasculitis مش الـ lesion الأساسي هنا."
          - "الـ crystals دي gout و pseudogout."
      - kind: explain
        page: 280
        title: "الـ history اللي يصرخ AS"
        quote: "Insidious onset of low back pain. Onset of symptoms before age 40 years(20-30years). Presence of symptoms for more than 3 months."
        text: |
          - Low back pain بيبدأ ==بالراحة== (insidious)
          - قبل **40 سنة** (غالبًا 20-30)
          - أكتر من **3 شهور**
          - ==أوحش الصبح== أو مع قلّة الحركة
          - **بيتحسّن مع الرياضة**

          الـ M:F = **4:1**، والـ prevalence قريب من الـ RA.
      - kind: aside
        tone: analogy
        page: 280
        quote: "Symptoms worse in the morning or with inactivity. Improvement of symptoms with exercise."
        text: "الـ mechanical back pain زي العربية اللي بتسخن لما تمشي كتير: الحركة بتوجّعها والراحة بتريّحها. الـ **inflammatory** بالعكس: زي الباب اللي مفصّلاته صدّت، أول ما تفتحه وتقفله كذا مرّة يلين: أسوأ في الـ **morning**، وأحسن مع الـ **exercise**."
      - kind: reveal
        page: 280
        quote: "Women tend to have more peripheral joint manifestations thus leading to an inappropriate diagnosis of RA."
        prompt: "ليه الـ AS ممكن يتوه في الستات؟"
        answer: "3 أسباب: الأعراض **non-specific** ووجع الستات بيتشخّص أقل، وعندهم **peripheral joints** أكتر فيتقال RA، و **new bone formation أقل** فالـ X-ray مش بيبيّن."
      - kind: explain
        page: 281
        title: "الـ HLA-B27 بالأرقام"
        quote: "It is present in1% in the general population & in 20% of relatives of AS patients."
        text: |
          - موجود في ==90-95%== من عيانين الـ AS
          - في **1%** من الناس العاديين، و **20%** من قرايب العيانين
          - اللي عنده HLA-B27 عنده risk **20 ضعف**
          - بس مسؤول عن **حوالي 20%** بس من الـ heritability

          الفكرة: الـ HLA-B27 (class I MHC) بيقدّم antigen للـ ==CD8+ T cells==، فالمناعة تهاجم الـ fibrocartilage أو الـ cartilage.
      - kind: aside
        tone: trap
        page: 281
        quote: "the overall contribution of HLA-B27 to AS heritability is only ~20%, indicating that other genetic influences contribute to AS."
        text: "متلخبطش الرقمين: **90-95%** من عيانين الـ AS عندهم HLA-B27، بس الـ HLA-B27 بيفسّر **20%** بس من الـ **heritability**. يعني فيه genes تانية."
      - kind: figure
        page: 281
        quote: "ERAP-1 is involved in trimming peptides to optimal length for binding to HLA class 1 molecules (including HLA-B27)."
        title: "من الـ gene للالتهاب"
        alt: "Vertical chain: ERAP-1 trims peptides; HLA-B27 presents them to CD8+ T cells; IL-23 activates Th17 cells; IL-17A drives inflammation at the enthesis. A side box shows the gut: Klebsiella, dysbiosis and subclinical gut inflammation in 60% feed the same process."
        caption: "الـ ==ERAP-1== بيقص الـ peptides على مقاس الـ **HLA-B27**. والمحور التاني **IL-23 → Th17 → IL-17A**. والأمعاء (dysbiosis) بتصب في نفس النار."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R17a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="200" height="44" rx="8" class="fg-box"/>
            <text x="20" y="30" class="t-b">ERAP-1</text>
            <text x="20" y="46" class="t-sm">trims peptides</text>
            <path d="M110 54 L110 74" class="fg-arrow" marker-end="url(#R17a)"/>
            <rect x="10" y="76" width="200" height="44" rx="8" class="fg-acc"/>
            <text x="20" y="96" class="t-b">HLA-B27 (class I)</text>
            <text x="20" y="112" class="t-sm">presents to CD8+ T cells</text>
            <path d="M110 120 L110 140" class="fg-arrow" marker-end="url(#R17a)"/>
            <rect x="10" y="142" width="200" height="44" rx="8" class="fg-acc"/>
            <text x="20" y="162" class="t-b">IL-23 → Th17</text>
            <text x="20" y="178" class="t-sm">IL-17A-producing CD4+ cells</text>
            <path d="M110 186 L110 206" class="fg-arrow" marker-end="url(#R17a)"/>
            <rect x="10" y="208" width="310" height="50" rx="8" class="fg-bad"/>
            <text x="20" y="229" class="t-b">Enthesitis, osteitis, synovitis</text>
            <text x="20" y="247" class="t-sm">heals with fibrosis and ankylosis</text>
            <rect x="222" y="10" width="98" height="176" rx="8" class="fg-thin"/>
            <text x="232" y="32" class="t-b">Gut</text>
            <text x="232" y="54" class="t-sm">Klebsiella</text>
            <text x="232" y="74" class="t-sm">Chlamydia</text>
            <text x="232" y="94" class="t-sm">prostatitis</text>
            <text x="232" y="122" class="t-sm">dysbiosis</text>
            <text x="232" y="142" class="t-sm">gut inflamed</text>
            <text x="232" y="162" class="t-sm t-b">in 60%</text>
            <path d="M270 186 L270 206" class="fg-arrow" marker-end="url(#R17a)"/>
            <rect x="10" y="270" width="310" height="50" rx="8" class="fg-box"/>
            <text x="20" y="291" class="t-sm">HLA-B27: 90-95% of AS, 1% of public,</text>
            <text x="20" y="308" class="t-sm">20-fold risk, ~20% of heritability</text>
          </svg>
      - kind: explain
        page: 282
        title: "البيئة: الأمعاء"
        quote: "subclinical gut inflammation is observed in 60% of patients with AS, implicating a potential gut–joint axis in AS pathogenesis."
        text: |
          الـ infection ممكن تكون الشرارة: **Klebsiella** في البراز، chronic prostatitis، و **chlamydia** في الـ urethra.

          و ==60%== من عيانين الـ AS عندهم subclinical gut inflammation: محور ==gut-joint==. الـ **dysbiosis** بيبوّظ الحاجز المخاطي ويطلّع cytokines.
      - kind: explain
        page: 282
        title: "الـ pathology: الـ enthesis الأول"
        quote: "The enthesis is thought to be the primary site of pathology (annulus fibrosis of intervertebral discs, the tendon Achilles)."
        text: |
          المكان الأساسي ==enthesis==: الـ **annulus fibrosus** بتاع الـ discs، والـ **Achilles**.

          وكمان: subchondral bone (**osteitis**)، الـ periosteum (**periostitis**)، والـ synovium (synovitis).

          الالتهاب بيخف بـ ==fibrosis و ankylosis==: المفصل يلحم.
      - kind: try
        items: [rheum.L17.002, rheum.L17.004, rheum.L17.006, rheum.L17.012, rheum.L17.016]
    recap:
      - "SpA: seronegative، axial + peripheral oligoarthritis، enthesitis، extra-articular، عيلة، HLA-B27 (SPINE)."
      - "7 أفراد: AS، nr-axSpA، uSpA، reactive، psoriasis، IBD، juvenile."
      - "AS history: insidious، قبل 40، أكتر من 3 شهور، الصبح أوحش، الرياضة بتحسّن. M:F 4:1."
      - "HLA-B27: 90–95% من AS، 1% من الناس، 20 ضعف risk، 20% بس من الـ heritability."
      - "ERAP-1 بيقص الـ peptides؛ IL-23 → Th17 → IL-17A."
      - "Gut: Klebsiella، dysbiosis، 60% gut inflammation. الـ enthesis هو المكان الأساسي."
    practice: [rheum.L17.001, rheum.L17.002, rheum.L17.003, rheum.L17.004, rheum.L17.005, rheum.L17.006, rheum.L17.007, rheum.L17.008, rheum.L17.009, rheum.L17.010, rheum.L17.011, rheum.L17.012, rheum.L17.013, rheum.L17.014, rheum.L17.015, rheum.L17.016, rheum.L17.017, rheum.L17.018, rheum.L17.019, rheum.L17.020, rheum.L17.021, rheum.L17.022, rheum.L17.023, rheum.L17.024, rheum.L17.025]
