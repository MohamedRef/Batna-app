lessons:
  # ------------------------------------------------------------------
  - id: rheum.L16.lesson1
    title: "الـ RA بيبدأ إزاي؟ من الـ gene للـ pannus"
    hook: "مفصل بيتاكل من جوّه بإيد الجهاز المناعي نفسه. تعالى نشوف مين بيدّي الأوامر ومين بينفّذ."
    minutes: 8
    pages: [241, 244]
    topics: [intro, pathogenesis, pathology]
    goals:
      - "تعرّف الـ RA وتحفظ أرقامه (1%، 2:1)"
      - "ترسم خريطة الـ cytokines: مين بيعمل إيه في مين"
      - "ترتّب مراحل الـ pathology لحد الـ ankylosis"
    status: unverified
    steps:
      - kind: explain
        page: 241
        title: "يعني إيه rheumatoid arthritis؟"
        quote: "Symmetrical, deforming, small and large joint polyarthritis often associated with systemic disturbance and extra- articular disease features."
        text: |
          الـ ==RA== هو **polyarthritis**:
          - **symmetrical** (الناحيتين زي بعض)
          - **deforming** (بيشوّه المفاصل)
          - في المفاصل **الصغيرة والكبيرة**
          - ومعاه غالبًا أعراض systemic و **extra-articular features**.

          منتشر: **1%** من الناس في العالم، والستات ضعف الرجالة (**F:M = 2:1**).
      - kind: explain
        page: 241
        title: "التلات أسباب"
        quote: "Shared epitope: Increased susceptibility with a specific aminoacid sequence on B chain of HLA DR1. DR4."
        text: |
          الكتاب بيدّيك 3 حاجات مع بعض:
          1. **Genetic background**: HLA-DR1 و DR4 و DRw14. والأهم ==shared epitope==: تسلسل amino acids معيّن على الـ **beta chain** بتاع DR1 و DR4. وبيزيد في الـ first-degree relatives.
          2. **Environmental antigen** محتمل: viruses (parvovirus، EBV)، retroviruses، mycoplasma، mycobacteria.
          3. **Self-perpetuation** بالـ autoimmunity: الشرارة تولّع، والمناعة تكمّل لوحدها.
      - kind: aside
        tone: analogy
        page: 241
        quote: "Self perpetuation through autoimmunity."
        text: "تخيّل الـ gene هو البنزين، والفيروس هو الكبريتة، والـ **autoimmunity** هي النار اللي بتفضل والعة حتى بعد ما الكبريتة تطفي."
      - kind: figure
        page: 242
        quote: "Macrophage present processed antigen to TH1."
        title: "خريطة الـ cytokines في الـ RA"
        alt: "Diagram: a macrophage presents antigen to a Th1 cell. Th1 sends IL-2 to lymphocytes and IFN-gamma back to the macrophage. The macrophage sends IL-6 to the liver (ESR, CRP), IL-8 to neutrophils, and IL-1 plus TNF to fibroblasts and chondrocytes, which release metalloproteinases (cartilage loss) and PGE2 (bone loss). A Th17 cell adds IL-17."
        caption: "الـ **macrophage** يقدّم الـ antigen للـ **Th1**. الـ Th1 يرد بـ **IFN-γ** يشغّل الـ macrophage أكتر (حلقة مفرغة). والـ macrophage يطلع **IL-6** (ESR و CRP) و **IL-8** (polymorphs) و **IL-1 + TNF** اللي بيهدّوا الغضروف والعضم."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R16a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="R16b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="10" y="10" width="130" height="50" rx="8" class="fg-acc"/>
            <text x="75" y="32" text-anchor="middle" class="t-b">Macrophage</text>
            <text x="75" y="50" text-anchor="middle" class="t-sm t-mut">presents antigen</text>
            <rect x="190" y="10" width="130" height="50" rx="8" class="fg-acc"/>
            <text x="255" y="32" text-anchor="middle" class="t-b">Th1 cell</text>
            <text x="255" y="50" text-anchor="middle" class="t-sm t-mut">IL-2 to lymphocytes</text>
            <path d="M140 28 L188 28" class="fg-arrow" marker-end="url(#R16a)"/>
            <path d="M190 48 L142 48" class="fg-arrow" marker-end="url(#R16a)"/>
            <text x="165" y="70" text-anchor="middle" class="t-sm t-acc">IFN-γ</text>
            <path d="M40 60 L40 98" class="fg-arrow" marker-end="url(#R16a)"/>
            <rect x="10" y="100" width="150" height="44" rx="8" class="fg-box"/>
            <text x="20" y="120" class="t-b">IL-6</text>
            <text x="20" y="137" class="t-sm">ESR, CRP (acute phase)</text>
            <path d="M110 60 L230 98" class="fg-arrow" marker-end="url(#R16a)"/>
            <rect x="170" y="100" width="150" height="44" rx="8" class="fg-box"/>
            <text x="180" y="120" class="t-b">IL-8</text>
            <text x="180" y="137" class="t-sm">calls polymorphs</text>
            <path d="M75 60 L75 70 L165 70 L165 168" class="fg-arrow-bad" marker-end="url(#R16b)"/>
            <rect x="10" y="170" width="310" height="70" rx="8" class="fg-bad"/>
            <text x="20" y="192" class="t-b">IL-1 + TNF</text>
            <text x="20" y="210" class="t-sm">fibroblasts + chondrocytes</text>
            <text x="20" y="228" class="t-sm">adhesion molecules, angiogenesis</text>
            <path d="M80 240 L80 268" class="fg-arrow-bad" marker-end="url(#R16b)"/>
            <path d="M240 240 L240 268" class="fg-arrow-bad" marker-end="url(#R16b)"/>
            <rect x="10" y="270" width="150" height="44" rx="8" class="fg-bad"/>
            <text x="20" y="290" class="t-b">Metalloproteinases</text>
            <text x="20" y="307" class="t-sm">cartilage destroyed</text>
            <rect x="170" y="270" width="150" height="44" rx="8" class="fg-bad"/>
            <text x="180" y="290" class="t-b">PGE2</text>
            <text x="180" y="307" class="t-sm">bone demineralized</text>
            <rect x="10" y="325" width="310" height="30" rx="8" class="fg-thin"/>
            <text x="165" y="345" text-anchor="middle" class="t-sm">Th17 → IL-17: proinflammatory</text>
          </svg>
      - kind: check
        page: 242
        quote: "IL6: stimulates acute phase response (ESR CRP)."
        question: "العيانة عندها ESR و CRP عاليين. مين الـ cytokine المسؤول في الكتاب؟"
        options: ["IL-6", "IL-2", "IL-8", "IFN-γ"]
        answer: 0
        why:
          - "صح: الـ IL-6 من الـ macrophage بيشغّل الـ acute phase response."
          - "IL-2 من الـ Th1 بيشغّل الـ lymphocytes."
          - "IL-8 بينادي على الـ polymorphs."
          - "IFN-γ بيشغّل الـ macrophage."
      - kind: reveal
        page: 242
        quote: "Stimulation of angiogenesis to supply the proliferating synovium."
        prompt: "ليه الـ IL-1 و TNF بيعملوا angiogenesis؟ إيه فايدة الأوعية الجديدة للمرض؟"
        answer: "الـ **synovium** بيتكاثر وبيتحوّل لنسيج تخين، ومحتاج دم يغذّيه. الأوعية الجديدة هي خط الإمداد بتاع الـ pannus. ومع **adhesion molecules** زيادة، خلايا التهاب أكتر بتدخل."
      - kind: explain
        page: 242
        title: "والـ B cells؟"
        quote: "immune complexes that may be responsible for some of extra- articular features."
        text: |
          الأساس **cell-mediated** (macrophage + Th1).

          بس الـ **B cells** ليها دور: بتبقى plasma cells تعمل antibodies و ==immune complexes==، ودي ممكن تكون سبب جزء من الـ **extra-articular features**.
      - kind: order
        page: 243
        quote: "Formation of inflammatory granulation tissue (pannus) spreading over and under the articular cartilage which becomes eroded."
        prompt: "رتّب اللي بيحصل في المفصل من الأول للآخر:"
        steps:
          - "Synovial microvascular injury"
          - "Synovial swelling, cell infiltration, effusion"
          - "Villous synovial hypertrophy"
          - "Pannus erodes cartilage"
          - "Fibrous or bony ankylosis"
        why: "البداية في الأوعية الصغيرة، بعدين الغشاء يورم ويتملي خلايا، يتضخّم بـ villi، يطلع الـ **pannus** ياكل الغضروف، وفي الآخر المفصل ممكن يلحم (ankylosis)."
      - kind: explain
        page: 243
        title: "التشوّه جاي منين؟"
        quote: "Inflammatory destruction of soft tissues laxity of ligaments and tendons – deformities."
        text: |
          الالتهاب مش بياكل الغضروف بس. بيهدّ الـ **soft tissues** كمان، فالـ **ligaments** والـ tendons ترتخي، والمفصل يزوغ عن مكانه: دي ==deformities==.

          وكمان العضلات اللي جنب المفصل الملتهب بتضمر (**muscle atrophy**).
      - kind: explain
        page: 244
        title: "الـ nodule تحت الميكروسكوب"
        quote: "Central area of fibrinoid necrosis. Palisade of mononuclear cells."
        text: |
          الـ **rheumatoid nodule**: في النص ==fibrinoid necrosis==، وحواليها ==palisade== من الـ mononuclear cells (صف خلايا واقفة جنب بعض زي السور).

          ونفس الفكرة في الأنسجة التانية: mononuclear infiltrate مع fibrinoid necrosis بدرجات و nodules.
      - kind: aside
        tone: exam
        page: 243
        quote: "Early change: injury to synovial microvasculature."
        text: "لو اتسألت عن **أول** تغيير في الـ RA: هو **injury to synovial microvasculature**، مش الـ pannus. الـ pannus بييجي بعدين."
      - kind: try
        items: [rheum.L16.004, rheum.L16.010, rheum.L16.011, rheum.L16.016, rheum.L16.021]
    recap:
      - "RA: symmetrical deforming polyarthritis؛ 1%؛ F:M = 2:1."
      - "Gene (DR1، DR4، shared epitope) + antigen محتمل + autoimmunity بتكمّل لوحدها."
      - "Macrophage ↔ Th1 (IL-2، IFN-γ). Macrophage: IL-6 (ESR/CRP)، IL-8 (polymorphs)."
      - "IL-1 + TNF: metalloproteinases (غضروف)، PGE2 (عضم)، adhesion، angiogenesis. IL-17 من Th17."
      - "Microvascular injury ← synovitis ← villi ← pannus ← ankylosis."
      - "Nodule: fibrinoid necrosis في النص + palisade."
    practice: [rheum.L16.001, rheum.L16.002, rheum.L16.003, rheum.L16.004, rheum.L16.005, rheum.L16.006, rheum.L16.007, rheum.L16.008, rheum.L16.009, rheum.L16.010, rheum.L16.011, rheum.L16.012, rheum.L16.013, rheum.L16.014, rheum.L16.015, rheum.L16.016, rheum.L16.017, rheum.L16.018, rheum.L16.019, rheum.L16.020, rheum.L16.021, rheum.L16.022, rheum.L16.023]
