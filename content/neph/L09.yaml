    src: { page: 299, quote: "Hemodialysis: The main mechanism of solute removal in hemodialysis is diffusion, which is chiefly effective in the removal of small solutes. Hemodialysis involves the use of a hemodialyzer, where blood and dialysate solution circulate counter-current or co-current. A counter-current configuration is preferred because the average concentration gradient is kept higher along the whole length of the dialyzer." }
