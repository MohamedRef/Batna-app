  - id: geri.L10.lesson3
    title: "نَفَس قصير و Velcro تحت السماعة"
    hook: "مريض بيقولك «بنهج من السلم»، وانت حاطط السماعة وسامع صوت لزق الـ Velcro وهو بيتفك. ده الـ IPF."
    minutes: 9
    pages: [177, 180]
    topics: [course, clinical, prognosis]
    goals:
      - "تفرّق chronic و subacute (COP) و acute (AIP)"
      - "تعرف أعراض وعلامات الـ IPF واللي مش منه"
      - "تعرف الـ complications وعلامات الـ poor prognosis"
    status: unverified
    steps:
      - kind: table
        page: 177
        quote: "1) Chronic, insidious, and slowly progressive. 2) Subacute, with a resolving, remitting, relapsing, or progressive course."
        title: "تلات سرعات للـ DPLD"
        columns: ["Course", "Typified by", "Key point"]
        rows:
          - ["Chronic, insidious, slowly progressive", "IPF (UIP); CTD, pneumoconioses, drugs", "Like IPF"]
