items:
  # ---------- p123: introduction ----------
  - id: rheum.L08.001
    kind: card
    topic: basics
    front: Define the vasculitides.
    back: A heterogeneous group of conditions marked by inflammation and necrosis of blood vessels.
    src: { page: 123, quote: "Vasculitides are a hetrogenous group of conditions characterized by inflammation and necrosis of blood vessels." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L08.002
    kind: card
    topic: basics
    front: Why does vasculitis produce such a wide variety of signs and symptoms?
    back: Vessels of any size and in any organ may be affected.
    src: { page: 123, quote: "Vessels of any size and of any organ may be affected." }
    status: unverified
  - id: rheum.L08.003
    kind: card
    topic: basics
    front: Why does vasculitis need a systematic diagnostic approach?
    back: It ranges from a benign, regionally restricted process to a life-threatening systemic disorder, so it can mimic or be mimicked by many diseases.
    src: { page: 123, quote: "Thus, they can mimic or be mimicked by a variety of diseases." }
    status: unverified
  - id: rheum.L08.004
    kind: enumerate
    topic: basics
    prompt: The two processes in the pathogenesis of vasculitis?
    points:
      - Inflammation of the vessel wall
      - Ischaemia of tissues
    pass: 2
    src: { page: 123, quote: "Pathogenesis of vasculitis involves two processes, namely. 1. Inflammation of vessel wall. 2. Ischaemia of tissues." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L08.005
    kind: card
    topic: basics
    front: Are most vasculitic syndromes idiopathic or secondary?
    back: Idiopathic; they are immune-mediated diseases and most have no known cause.
    src: { page: 123, quote: "Vasculitic syndromes are immune-mediated diseases. Most are idiopathic." }
    status: unverified
  # ---------- p123-124: mechanisms ----------
  - id: rheum.L08.006
    kind: table
    topic: basics
    title: Mechanisms of vessel wall involvement
    columns: [Mechanism, Features, Examples]
    rows:
      - [Allergic angiitis, "Eosinophilia, raised IgE in blood and tissues", Churg–Strauss syndrome (EGPA)]
      - [Antibody mediated (pauci-immune), ANCA-associated vasculitis, "Wegener (GPA), CSS, microscopic polyangiitis"]
      - [Immune complex mediated, "Deposition or in-situ formation; low complement", "Henoch–Schönlein purpura, PAN"]
      - [T-cell mediated hypersensitivity, Th1-induced inflammatory infiltrate, "Giant cell arteritis, Takayasu"]
    blanks: [[0, 2], [1, 1], [2, 1], [3, 2]]
    src: { page: 124, quote: "Immune complex mediated with immune complex deposition or formation in situ. This is associated with low complement levels" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L08.007
    kind: cloze
    topic: basics
    text: "Allergic angiitis has {{c1::eosinophilia}} and raised {{c2::IgE}} in blood and tissues, as in {{c3::Churg–Strauss syndrome}}."
    src: { page: 123, quote: "Allergic angiitis with eosinophilia and raised IgE levels in blood and in tissues e.g. in Churg Strauss syndrome (CSS)." }
    status: unverified
  - id: rheum.L08.008
    kind: cloze
    topic: basics
    text: "ANCA-associated vasculitis is the {{c1::pauci-immune}} (antibody-mediated) type."
    src: { page: 124, quote: "Antibody mediated (pauci-immune type) vasculitis which includes ANCA associated vasculitis (AAV)" }
    status: unverified
  - id: rheum.L08.009
    kind: card
    topic: basics
    front: Which complement finding goes with immune-complex vasculitis, and two book examples?
    back: Low complement levels; Henoch–Schönlein purpura and polyarteritis nodosa.
    src: { page: 124, quote: "This is associated with low complement levels, e.g. Henoch-Schonlein purpura (HSP), polyarteritis nodosa (PAN)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L08.010
    kind: card
    topic: basics
    front: Which T-helper cells drive the infiltrate in giant cell and Takayasu arteritis?
    back: Th1 cells (T-cell mediated hypersensitivity).
    src: { page: 124, quote: "T cell mediated hypersentivitiy characterized by an inflammatory infiltrate induced by Th1 cells" }
    status: unverified
  - id: rheum.L08.011
    kind: mcq
    topic: basics
    stem: A biopsy of a vasculitic lesion shows few or no immune deposits, and serum complement is normal. Which mechanism fits best?
    options:
      - Pauci-immune, antibody-mediated (ANCA) vasculitis
      - Immune complex vasculitis
      - Th1 T-cell mediated vasculitis
      - Allergic angiitis with high IgE
    answer: 0
    why:
      - "Correct: pauci-immune means few deposits; this is the ANCA-associated group (p124)."
      - Immune complex vasculitis deposits complexes and lowers complement (HSP, PAN).
      - The T-cell type is large vessel (GCA, Takayasu) with a Th1 infiltrate, not described by deposits.
      - Allergic angiitis is defined by eosinophilia and raised IgE, not by the absence of deposits.
    src: { page: 124, quote: "Antibody mediated (pauci-immune type) vasculitis which includes ANCA associated vasculitis (AAV)" }
    status: unverified
  # ---------- p124: pathology and epidemiology ----------
  - id: rheum.L08.012
    kind: card
    topic: basics
    front: Is the pathology of a vasculitis biopsy diagnostic of a specific syndrome?
    back: No. Patterns overlap a lot, and involvement can be focal and segmental, so not all of the vessel is involved.
    src: { page: 124, quote: "Pathologic findings not diagnostic for a specific syndrome." }
    status: unverified
  - id: rheum.L08.013
    kind: order
    topic: basics
    prompt: Put the vessel-wall consequences of vasculitis in the book's sequence.
    steps:
      - Increased permeability (limited response)
      - Weakening (aneurysm and/or haemorrhage)
      - Intimal proliferation and thrombosis
      - Obstruction and local ischaemia
    src: { page: 124, quote: "(Limited Response) Increased permeability. Weakening (Aneurysm +/ hemorrhage) Intimal proliferation and thrombosis. Obstruction and local ischemia." }
    status: unverified
  - id: rheum.L08.014
    kind: cloze
    topic: basics
    text: "UK annual incidence of primary systemic vasculitis is {{c1::19.8 per million}}; peak age at diagnosis is {{c2::65–74}}, with {{c3::male}} preponderance."
    src: { page: 124, quote: "annual incidence of 19.8 per million. Peak age at diagnosis was 65-74. Male preponderance." }
    status: unverified
    tags: [numbers]
  # ---------- p125-126: classification ----------
  - id: rheum.L08.015
    kind: table
    topic: classification
    title: Primary and secondary vasculitides
    columns: [Group, Members]
    rows:
      - [Primary, "Temporal arteritis, Takayasu arteritis, Wegener granulomatosis, Churg–Strauss syndrome, polyarteritis nodosa, Henoch–Schönlein purpura"]
      - [Secondary, "Polysystemic autoimmune diseases, infections, hypersensitivity, cryoglobulinaemic vasculitis, others (Cogan, Sweet syndromes)"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 125, quote: "Primary Secundary Arteritis temporalis Polysystemic autoimmun diseases Takayasu arteritis Infections" }
    status: unverified
  - id: rheum.L08.016
    kind: table
    topic: classification
    title: Chapel Hill 2012 (CHCC) by vessel size
    columns: [Group, Members]
    rows:
      - [Large vessel vasculitis, "Takayasu arteritis, giant cell arteritis"]
      - [Medium vessel vasculitis, "Polyarteritis nodosa, Kawasaki disease"]
      - ["Small vessel, ANCA-associated", "MPA, GPA (Wegener), EGPA (Churg–Strauss)"]
      - ["Small vessel, immune complex", "Anti-GBM, cryoglobulinemic, IgA vasculitis (HSP), hypocomplementemic urticarial (anti-C1q)"]
      - [Variable vessel vasculitis, "Behçet disease, Cogan syndrome"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 125, quote: "Large Vessel Vasculitis (LVV) Takayasu Arteritis (TAK). Giant Cell Arteritis (GCA). Medium Vessel Vasculitis (MVV) Polyarteritis Nodosa (PAN). Kawasaki Disease (KD)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L08.017
    kind: card
    topic: classification
    front: Which Chapel Hill 2012 group holds Behçet disease and Cogan syndrome?
    back: Variable vessel vasculitis.
    src: { page: 126, quote: "Variable Vessel Vasculitis (VVV) Behçet‘s Disease (BD). Cogan‘s Syndrome (CS)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L08.018
    kind: card
    topic: classification
    front: What is the CHCC 2012 name for Henoch–Schönlein purpura?
    back: IgA vasculitis (IgAV).
    src: { page: 125, quote: "IgA Vasculitis (Henoch-Schönlein)(IgAV)." }
    status: unverified
  - id: rheum.L08.019
    kind: card
    topic: classification
    front: What is the other name of hypocomplementemic urticarial vasculitis?
    back: Anti-C1q vasculitis.
    src: { page: 125, quote: "Hypocomplementemic Urticarial Vasculitis (Anti-C1q Vasculitis)." }
    status: unverified
  - id: rheum.L08.020
    kind: enumerate
    topic: classification
    prompt: Single-organ vasculitides named in CHCC 2012?
    points:
      - Cutaneous leukocytoclastic angiitis
      - Cutaneous arteritis
      - Primary CNS vasculitis
      - Isolated aortitis
    pass: 3
    src: { page: 126, quote: "Single Organ Vasculitis (SOV) Cutaneous Leukocytoclastic Angiitis. Cutaneous Arteritis. Primary CNS Vasculitis. Isolated Aortitis." }
    status: unverified
  - id: rheum.L08.021
    kind: enumerate
    topic: classification
    prompt: Vasculitis associated with a probable etiology (CHCC 2012)?
    points:
      - HCV-associated cryoglobulinemic vasculitis
      - HBV-associated vasculitis
      - Syphilis-associated aortitis
      - Drug-associated immune complex vasculitis
      - Drug-associated ANCA-associated vasculitis
      - Cancer-associated vasculitis
    pass: 4
    src: { page: 126, quote: "Vasculitis Associated with Probable Etiology Hepatitis C Virus-Associated Cryoglobulinemic Vasculitis. Hepatitis B Virus-Associated Vasculitis. Syphilis-Associated Aortitis." }
    status: unverified
  - id: rheum.L08.022
    kind: card
    topic: classification
    front: Three vasculitides associated with systemic disease (CHCC 2012)?
    back: Lupus vasculitis, rheumatoid vasculitis and sarcoid vasculitis.
    src: { page: 126, quote: "Vasculitis Associated with Systemic Disease Lupus Vasculitis. Rheumatoid Vasculitis. Sarcoid Vasculitis." }
    status: unverified
  - id: rheum.L08.023
    kind: mcq
    topic: classification
    stem: Under the 2012 Chapel Hill nomenclature, Kawasaki disease is classified as which type?
    options:
      - Medium vessel vasculitis
      - Large vessel vasculitis
      - Small vessel immune complex vasculitis
      - Variable vessel vasculitis
      - Single-organ vasculitis
    answer: 0
    why:
      - "Correct: medium vessel vasculitis is PAN and Kawasaki disease (p125)."
      - Large vessel is Takayasu and giant cell arteritis.
      - Immune complex small vessel includes anti-GBM, cryoglobulinemic, IgA and anti-C1q vasculitis.
      - Variable vessel is Behçet and Cogan.
      - Single-organ examples are cutaneous, CNS and isolated aortitis.
    src: { page: 125, quote: "Medium Vessel Vasculitis (MVV) Polyarteritis Nodosa (PAN). Kawasaki Disease (KD)." }
    status: unverified
  # ---------- p126-127: when to suspect ----------
  - id: rheum.L08.024
    kind: enumerate
    topic: clues
    prompt: Clues that should make you suspect a vasculitic syndrome?
    points:
      - Occlusive arterial disease or hypertension in young adults
      - Unexplained fever and weight loss
      - Unexplained proteinuria with or without casts
      - Splinter haemorrhages and palpable purpura or erythema
      - Subcutaneous nodules or urticaria
      - Sudden retinal vascular disease without hypertension or diabetes
      - Persistent headache with sudden monocular blindness in the elderly, jaw claudication
      - Sudden peripheral neuropathy (wrist or foot drop)
      - Cerebrovascular or cardiovascular events in the young
      - Unexplained pulmonary nodular or cavitary lesions
    pass: 6
    src: { page: 126, quote: "Occlusive arterial disease or hypertension in youngadults Unexplained fever, weight loss. Unexplained proteinuria with or without casts." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L08.025
    kind: card
    topic: clues
    front: Elderly patient, persistent headache, sudden monocular blindness. Which vasculitis must you think of?
    back: Giant cell (temporal) arteritis; jaw claudication is the companion clue.
    src: { page: 127, quote: "Persistent headache with sudden visual impairment (monocular blindness) in elderly." }
    status: unverified
  - id: rheum.L08.026
    kind: card
    topic: clues
    front: Sudden wrist drop or foot drop without trauma suggests what?
    back: Vasculitic peripheral neuropathy (mononeuritis), a clue to systemic vasculitis.
    src: { page: 127, quote: "Sudden appearance of peripheral neuropathy - wrist drop,foot drop." }
    status: unverified
  - id: rheum.L08.027
    kind: cloze
    topic: clues
    text: "Systemic vasculitis usually presents in the {{c1::2nd–5th}} decades; the exceptions are {{c2::HSP and Kawasaki disease}} (children) and {{c3::Takayasu arteritis}} (young females)."
    src: { page: 127, quote: "Systemic vasculitis usually presents in individuals of 2-5th decade, the exceptions being HSP and Kawasaki disease which are common in children" }
    status: unverified
    tags: [numbers]
  - id: rheum.L08.028
    kind: card
    topic: clues
    front: What helps identify the specific vasculitic syndrome clinically?
    back: The pattern of organ systems involved.
    src: { page: 127, quote: "The pattern of different organ system involvement may help in identifying the specific vasculitic syndrome." }
    status: unverified
  - id: rheum.L08.029
    kind: enumerate
    topic: clues
    prompt: Salient features of predominantly cutaneous vasculitis?
    points:
      - Absence of systemic involvement
      - Negative serology
      - Small vessel leucocytoclastic vasculitis
      - Better prognosis
    pass: 3
    src: { page: 127, quote: "Absence of systemic involvement. Negative serology. Small vessel leucocytoclastic vasculitis. Better prognosis." }
    status: unverified
  - id: rheum.L08.030
    kind: card
    topic: clues
    front: Usual lesions and site of predominantly cutaneous vasculitis?
    back: Palpable purpura, urticaria, bullous ulcers or splinter haemorrhages, mainly limited to the lower extremities.
    src: { page: 127, quote: "palpable purpura,urticaria, bullous ulcers or splinter haemorrhages, mainly limited to lower extremities." }
    status: unverified
  - id: rheum.L08.031
    kind: card
    topic: organs
    front: Prognosis of systemic vasculitis in general?
    back: Poor (it involves various organ systems), unlike cutaneous vasculitis.
    src: { page: 128, quote: "Systemic vasculitis involves various organ systems. Prognosis in general is poor." }
    status: unverified
  # ---------- p128-129: organs ----------
  - id: rheum.L08.032
    kind: card
    topic: organs
    front: Which two vasculitides spare the kidney's glomeruli in the book's table?
    back: Classical PAN and Takayasu arteritis; the kidney is affected in most others.
    src: { page: 128, quote: "Kidney -Affected in most of the vasculitis except PAN and TA: - Glomerulonephritis (absent in classical PAN)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L08.033
    kind: enumerate
    topic: organs
    prompt: Renal manifestations of systemic vasculitis?
    points:
      - Glomerulonephritis (absent in classical PAN)
      - Renal failure
      - Hypertension (usually; not seen in WG)
      - Renal infarction
    pass: 3
    src: { page: 128, quote: "Glomerulonephritis (absent in classical PAN). Renal failure. Hypertension usually (not seen in WG). Renal infarction." }
    status: unverified
  - id: rheum.L08.034
    kind: card
    topic: organs
    front: Which three vasculitides involve the lungs in the book's table?
    back: Wegener granulomatosis (GPA), Churg–Strauss (EGPA) and microscopic polyangiitis.
    src: { page: 128, quote: "Lungs – Involved in WG, CSS, MPA:" }
    status: unverified
  - id: rheum.L08.035
    kind: card
    topic: organs
    front: Triad of alveolar haemorrhage in vasculitis?
    back: Haemoptysis, anaemia and bilateral evanescent lung opacities.
    src: { page: 128, quote: "Alveolar haemorrhage, characterized by haemoptysis, anaemia and bilateral evanescent lung opacities." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L08.036
    kind: card
    topic: organs
    front: Which lung manifestation in the table belongs to Churg–Strauss only?
    back: Asthma.
    src: { page: 128, quote: "Nodules with/without cavities. Infarction. Asthma (CSS)." }
    status: unverified
  - id: rheum.L08.037
    kind: table
    topic: organs
    title: Organ manifestations of systemic vasculitis (Table 2)
    columns: [System, Features]
    rows:
      - [Cardiovascular, "MI, ischaemic cardiomyopathy and CHF, pulselessness"]
      - [Abdomen, "Ischaemic mucosal necrosis (haematemesis, melaena), bowel infarction, hepatic and pancreatic infarction"]
      - [CNS, "Focal deficit, altered mental state, seizures"]
      - [Nerves, "Acute mononeuropathies, mononeuritis multiplex"]
      - [Muscles, "Jaw claudication (GCA), arm claudication (TA), myalgia, weakness"]
      - [Genitourinary, "Testicular, epididymal pain, ovarian involvement"]
      - [Skin, "Rash, purpura, cutaneous infarcts, livedo reticularis, Raynaud"]
      - [ENT, "Otitis media, nasal obstruction, epistaxis (WG)"]
    blanks: [[3, 1], [4, 1], [5, 1], [7, 1]]
    src: { page: 129, quote: "Nerves: Mononeuropathies (acute onset). Mononeuritis multiplex." }
    status: unverified
  - id: rheum.L08.038
    kind: card
    topic: organs
    front: Arm claudication suggests which vasculitis; jaw claudication which?
    back: Arm claudication, Takayasu arteritis; jaw claudication, giant cell arteritis.
    src: { page: 129, quote: "Jaw claudication as in GCA. Myalgia. Arm claudication as in TA." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L08.039
    kind: card
    topic: organs
    front: Ocular manifestations of systemic vasculitis?
    back: Conjunctivitis, scleritis, episcleritis, dacryocystitis, uveitis and proptosis.
    src: { page: 129, quote: "Conjunctivitis, scleritis, episcleritis, dacryocystitis, uveitis,proptosis." }
    status: unverified
  - id: rheum.L08.040
    kind: card
    topic: organs
    front: Constitutional (B) symptoms of vasculitis?
    back: Fever, malaise, anorexia, arthralgia and weight loss.
    src: { page: 129, quote: "Constitutional (B symptoms): Fever, malaise, anorexia, arthralgia, weight loss." }
    status: unverified
  - id: rheum.L08.041
    kind: mcq
    topic: organs
    stem: A 45-year-old man has chronic nasal obstruction with epistaxis, otitis media, haemoptysis and bilateral cavitating lung nodules. Urine shows red cell casts but his BP is normal. Which vasculitis fits best?
    options:
      - Wegener granulomatosis (GPA)
      - Classical polyarteritis nodosa
      - Takayasu arteritis
      - Giant cell arteritis
      - Henoch–Schönlein purpura
    answer: 0
    why:
      - "Correct: ENT (nasal obstruction, epistaxis, otitis), cavitating nodules and GN; the book notes hypertension is not seen in WG (pp128-129)."
      - Classical PAN has no glomerulonephritis and does not involve the lungs.
      - Takayasu spares the glomeruli and causes pulselessness and arm claudication.
      - GCA is an elderly large vessel disease with headache and jaw claudication.
      - HSP is mainly a childhood purpura with arthritis, abdominal pain and GN, not ENT or cavities.
    src: { page: 129, quote: "ENT: Otitis media, nasal obstruction or epistaxis (in WG)." }
    status: unverified
  # ---------- p130: workup and mimics ----------
  - id: rheum.L08.042
    kind: enumerate
    topic: workup
    prompt: Diagnostic workup of suspected vasculitis?
    points:
      - Haemogram
      - Urinalysis
      - Serum proteins
      - ANCA (c-ANCA, p-ANCA, atypical)
      - Renal and hepatic function tests
      - Angiography
      - Echocardiography
      - Organ biopsy
    pass: 6
    src: { page: 130, quote: "Laboratory investigations. Haemogram. Urinalysis. Serum proteins. Antineutrophil cytoplasmic autoantibodies (ANCA):" }
    status: unverified
  - id: rheum.L08.043
    kind: card
    topic: workup
    front: Three ANCA immunofluorescence patterns?
    back: Cytoplasmic (c-ANCA), perinuclear (p-ANCA), and atypical (A- or x-ANCA).
    src: { page: 130, quote: "Cytoplasmic ANCA (c-ANCA). ii. Perinuclear ANCA (p-ANCA). iii. Atypical staining (A or x-ANCA)." }
    status: unverified
  - id: rheum.L08.044
    kind: enumerate
    topic: workup
    prompt: Mimics of vasculitis?
    points:
      - Bacterial endocarditis
      - Antiphospholipid antibody syndrome
      - Viral infections (HIV, CMV, HBV, HCV)
      - Cholesterol emboli syndrome
      - Vasoconstrictor drugs (ergot poisoning)
      - Hypertensive arteriopathy
      - Thoracic outlet syndrome
      - Sepsis and DIC
      - Sarcoidosis
      - TTP
      - Lymphoma, hairy cell leukaemia
    pass: 6
    src: { page: 130, quote: "Mimicks of vasculitis Bacterial endocarditis. Antiphospholipid antibody syndrome. Viral infections like HIV, CMV, HBV, HCV etc. Cholesterol emboli syndrome." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L08.045
    kind: mcq
    topic: workup
    stem: A 70-year-old man develops livedo reticularis, painful blue toes and rising creatinine two weeks after coronary angiography. Which vasculitis mimic does the book list that fits?
    options:
      - Cholesterol emboli syndrome
      - Thoracic outlet syndrome
      - Hairy cell leukaemia
      - Ergot poisoning
    answer: 0
    why:
      - "Correct: cholesterol emboli after arterial instrumentation mimic vasculitis (p130)."
      - Thoracic outlet syndrome gives arm ischaemia from compression, not toes and kidneys after angiography.
      - Hairy cell leukaemia is a mimic, but nothing here points to it.
      - Ergot causes vasospasm after drug exposure, not after angiography.
    src: { page: 130, quote: "Cholesterol emboli syndrome. Vasoconstrictor drugs (ergot poisoning). Hypertensive arteriopathy. Thoracic outlet syndrome." }
    status: unverified
