lecture: hb.L07
lessons:
  # ------------------------------------------------------------------
  - id: hb.L07.lesson1
    title: "فيروس بيعمل نسخة احتياطية في النواة"
    hook: "ليه الـ HBV بيرجع كل ما توقف العلاج؟ الإجابة في حلقة صغيرة اسمها cccDNA."
    minutes: 8
    pages: [113, 114]
    topics: [virology, acute]
    goals:
      - "تعرف مكوّنات الـ virion وكل antigen جاي منين"
      - "تفهم الـ life cycle وفين بالظبط الـ NAs بتضرب"
      - "تحفظ أرقام الـ perinatal transmission وحكاية الرضاعة"
    status: unverified
    steps:
      - kind: explain
        page: 113
        quote: "Envelop; HB S antigen (HBsAg); HB e Antigen (Hbe Ag); HB c Antigen (Hbc Ag); Nuclear capsid; DNA polymerase"
        title: "الفيروس من بره لجوه"
        text: |
          الـ HBV فيروس DNA صغير، وكل طبقة فيه ليها antigen باسمها، وده سر الـ serology كلها بعدين:

          - **Envelope** (الغلاف) عليه ==HBsAg==: الـ s = surface.
          - جواه **nuclear capsid** وده ==HBcAg==: الـ c = core.
          - ==HBeAg==: الرسمة في الكتاب بتحطه مع الـ core.
          - وفي القلب: **viral DNA** ومعاه **DNA polymerase**.

          افتكر الترتيب ده كويس: لما نقرا الـ serology، كل antibody هيقولك الجهاز المناعي "شاف" أنهي طبقة.
      - kind: figure
        page: 113
        quote: "Envelop; HB S antigen (HBsAg); HB e Antigen (Hbe Ag); HB c Antigen (Hbc Ag); Nuclear capsid; DNA polymerase"
        title: "الـ virion في رسمة الكتاب"
        image: { file: hb/L07-virion.webp, book: true }
        alt: "Book drawing of the HBV virion: an outer green envelope labelled HBs antigen, an inner circle labelled HBe antigen and HBc antigen, a hexagonal nuclear capsid in the centre, and DNA polymerase with the viral DNA inside the capsid."
        caption: "امشي من بره لجوه: الغلاف الأخضر = ==HBsAg==، الدايرة اللي جواه = **HBcAg** (والكتاب حاطط **HBeAg** معاه)، وفي النص الـ capsid والـ DNA polymerase."
      - kind: match
        page: 113
        quote: "Envelop; HB S antigen (HBsAg); HB c Antigen (Hbc Ag); Nuclear capsid; DNA polymerase"
        prompt: "وصّل كل جزء من الـ virion بالـ antigen أو الإنزيم بتاعه:"
        pairs:
          - ["Envelope", "HBsAg"]
          - ["Nuclear capsid", "HBcAg"]
          - ["Enzyme inside the core with the DNA", "DNA polymerase"]
        why: "الغلاف = surface = **HBsAg**، الـ capsid = core = **HBcAg**، والإنزيم اللي جوه مع الـ DNA هو **DNA polymerase**."
      - kind: aside
        tone: exam
        page: 113
        quote: "Genotype C: delayed HBeAg seroconversion and higher risk of HCC."
        text: |
          **10 genotypes (A–J)**، والممتحن بيحب اتنين بس:

          - **Genotype A**: افتكره طالب A+ مع الـ interferon، يعني **better response to interferon**.
          - **Genotype C**: افتكره Cancer + Converts late، يعني **delayed HBeAg seroconversion** و **higher risk of HCC**.

          والتفسير المقبول (مش في الكتاب) إن الاتنين مرتبطين: كل ما الـ HBeAg يفضل موجب مدة أطول، الفيروس بيفضل يتكاثر سنين أكتر، والكبد بياخد ضرب أكتر.
      - kind: explain
        page: 113
        quote: "Viral entry; Endocytosis; Uncoating; cccDNA formation; Transcription; Pregenomic RNA; Encapsidation; Budding; Secretion"
        title: "دورة حياة الفيروس في الـ hepatocyte"
        text: |
          الرسمة التانية في صفحة 113 بتحكي القصة دي:

          - الـ virion بيمسك في **receptor** على الـ hepatocyte ويدخل بالـ **endocytosis**.
          - يحصل **uncoating**، والـ DNA يروح النواة ويتقفل في حلقة اسمها ==cccDNA== (covalently closed circular DNA).
          - الـ cccDNA هو القالب: منه بيتعمل **transcription** لـ RNAs، منهم **pregenomic RNA (3.5 kb)**.
          - الـ pregenomic RNA بيدخل capsid جديد (**encapsidation**)، وجوه الـ capsid بيتعمل ==reverse transcription==: الأول negative-strand DNA وبعدين positive-strand DNA.
          - الـ capsid ياخد **envelope protein** من الـ ER، يعمل **budding**، ويطلع بره (**secretion**).
          - وجزء من الـ capsids بيرجع النواة يزوّد الـ cccDNA (**cccDNA amplification**).
      - kind: figure
        page: 113
        quote: "Nucleoside/tide analogues; Negative strand synthesis HBV DNA; Positive strand synthesis HBV DNA; cccDNA amplification"
        title: "الـ life cycle وفين الـ NAs بتوقفه"
        alt: "Vertical flow of the HBV life cycle: virion binds receptor, endocytosis and uncoating, then inside a dashed nucleus box cccDNA formation and transcription to pregenomic RNA, then encapsidation, reverse transcription (marked as blocked by nucleos(t)ide analogues), envelope from the ER with budding, and secretion. A dashed loop returns new capsids to the nucleus for cccDNA amplification."
        caption: "الـ NAs بتوقف الـ **reverse transcription** جوه الـ capsid، بس الـ **cccDNA** اللي في النواة مش بتلمسه."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L07a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
