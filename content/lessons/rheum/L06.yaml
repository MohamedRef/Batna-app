            <text x="75" y="101" text-anchor="middle" class="t-sm">α2</text>
            <rect x="50" y="121" width="50" height="36" rx="16" class="fg-acc"/>
            <text x="75" y="144" text-anchor="middle" class="t-sm">α3</text>
            <circle cx="122" cy="139" r="17" class="fg-good"/>
            <text x="122" y="143" text-anchor="middle" class="t-sm">β2m</text>
            <path d="M75 157 V215" class="fg-ink" stroke-width="3"/>
            <rect x="190" y="78" width="45" height="36" rx="16" class="fg-acc"/>
            <text x="212" y="101" text-anchor="middle" class="t-sm">α1</text>
            <rect x="190" y="121" width="45" height="36" rx="16" class="fg-acc"/>
            <text x="212" y="144" text-anchor="middle" class="t-sm">α2</text>
            <rect x="255" y="78" width="45" height="36" rx="16" class="fg-good"/>
            <text x="277" y="101" text-anchor="middle" class="t-sm">β1</text>
            <rect x="255" y="121" width="45" height="36" rx="16" class="fg-good"/>
            <text x="277" y="144" text-anchor="middle" class="t-sm">β2</text>
            <path d="M212 157 V215 M277 157 V215" class="fg-ink" stroke-width="3"/>
            <rect x="10" y="175" width="310" height="22" class="fg-thin"/>
            <text x="165" y="191" text-anchor="middle" class="t-sm t-mut">membrane</text>
            <text x="10" y="240" class="t-sm t-b">All nucleated cells</text>
            <text x="10" y="258" class="t-sm">→ CD8 cytotoxic T</text>
            <text x="10" y="276" class="t-sm t-mut">β2m gene: chr 15</text>
            <text x="180" y="240" class="t-sm t-b">Professional APCs</text>
            <text x="180" y="258" class="t-sm">macrophage, DC, B cell</text>
            <text x="180" y="276" class="t-sm">→ CD4 helper T</text>
            <text x="180" y="294" class="t-sm t-mut">more diverse</text>
          </svg>
      - kind: aside
        tone: tip
        page: 87
        quote: "Class I to cytotocic and class II to helper T cells"
        text: |
          قاعدة الضرب: حاصل الضرب دايمًا ==8==.

          - **CD8** مع **class I**، لأن 8 × 1 = 8
          - **CD4** مع **class II**، لأن 4 × 2 = 8

          ومنطقها: أي خلية ممكن يدخلها virus، فكل الخلايا المنوّاة عندها **class I** علشان الـ CTL يقدر يقتلها. أما **class II** فبس عند اللي شغلتهم يقدّموا antigen للـ helper.
      - kind: check
        page: 87
        quote: "Class I are expressed on all nucleated cells"
        question: "A hepatocyte is infected by a virus. What presents the viral peptide, and to whom?"
        options: ["Class I, to CD8 cytotoxic T cells", "Class II, to CD4 helper T cells", "Class II, to CD8 T cells", "Class III, to NK cells"]
        answer: 0
        why:
          - "صح: الـ hepatocyte nucleated، فعنده class I يعرض بيه على الـ CD8."
          - "الـ class II بس على الـ professional APCs."
          - "الـ class II بيروح للـ CD4 مش الـ CD8."
          - "الـ class III region فيه C4 و C2 و TNF، مش جزيئات بتعرض peptides."
      - kind: explain
        page: 89
        title: "الـ polymorphism"
        quote: "There exist nine DRB genes DRB1-9 (4 are functional)"
        text: |
          - الـ **DR** فيه **α chain gene واحد** اسمه DRA، فكل الـ HLA-DR نفس الـ α chain.
          - فيه **9 DRB genes**، منهم **4 functional**، وكل واحد ليه alleles كتير.
          - لما عدد الـ alleles يبقى كبير ده اسمه ==gene polymorphism==: **DRB1 لوحده 60 allele**.
          - النتيجة: كل واحد فينا HLA مختلف ← **diverse susceptibility to disease** و **prompt rejection of organ transplant**.
          - **DQ**: الـ α والـ β الاتنين polymorphic. **DP**: الـ β highly polymorphic.
      - kind: match
        page: 90
        quote: "Letter designing locus DR."
        prompt: "فكّك الاسم DRB1*0101: كل حتة معناها إيه؟"
        pairs:
          - ["DR", "The locus"]
          - ["B", "The β chain"]
          - ["1", "Which DRB gene"]
          - ["*01", "Type, same as serology"]
          - ["*0101", "Variant"]
        why: "الـ locus، وبعدين السلسلة، B يعني β، ورقم الجين، والنجمة، والـ **type** برقمين زي الـ serology، وأخيرًا الـ **variant**. زمان كانت بالـ serology، ودلوقتي بالـ genotyping لأن جزيئين شبه بعض serologically ممكن يختلفوا جينيًا."
      - kind: explain
        page: 90
        title: "الوراثة"
        quote: "Both maternal and paternal derived allelic forms are expressed: codominance."
        text: |
          - بتورث **haplotype** من الأم وواحد من الأب. الـ haplotype هو string of genes linked on one chromosome.
          - الاتنين بيتعبّروا: ده ==codominance==.
          - **Linkage disequilibrium**: alleles معيّنة بتيجي مع بعض على نفس الـ haplotype **أكتر من الصدفة** في الـ meiosis، زي **HLA-B8 و DR3**. يعني حتت كبيرة من الـ MHC بتتورث سليمة كـ **extended haplotypes** من جيل لجيل.
      - kind: reveal
        page: 91
        quote: "HLA A1, B8, DR3 vigorous response to infection?"
        prompt: "الكتاب بيسأل عن الـ A1, B8, DR3: «too much of a good thing?». يقصد إيه؟"
        answer: |
          الـ haplotype ده ممكن يدّي **رد فعل قوي ضد العدوى** (ميزة زمان لما العدوى كانت بتقتل).

          بس نفس القوة دي ممكن تبقى ==aggressive hyper-responsiveness== وأمراض **inflammatory** و autoimmune. الحاجة الحلوة لو زادت بقت مشكلة.
      - kind: try
        items: [rheum.L06.019, rheum.L06.022, rheum.L06.026, rheum.L06.029, rheum.L06.032]
    recap:
      - "HLA = human MHC على chromosome 6. Class I على كل الخلايا المنوّاة ← CD8. Class II على الـ APCs ← CD4."
      - "Class I = α + β2-microglobulin (chr 15). Class II = α و β transmembrane، وأكتر diversity."
      - "9 DRB genes، 4 functional، DRB1 فيه 60 allele = polymorphism."
      - "Codominance: الاتنين بيتعبّروا. Linkage disequilibrium: B8 و DR3 مع بعض."
    practice: [rheum.L06.017, rheum.L06.018, rheum.L06.019, rheum.L06.020, rheum.L06.021, rheum.L06.022, rheum.L06.023, rheum.L06.024, rheum.L06.025, rheum.L06.026, rheum.L06.027, rheum.L06.028, rheum.L06.029, rheum.L06.030, rheum.L06.031, rheum.L06.032, rheum.L06.033, rheum.L06.034]
