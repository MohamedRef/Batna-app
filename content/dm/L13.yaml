  # ---------- p161-162: burden and scenarios ----------
  - id: dm.L13.001
    kind: cloze
    topic: burden
    text: About {{c1::16%}} of pregnancies worldwide are affected by some form of hyperglycemia, and GDM accounts for about {{c2::84%}} of these.
    src: { page: 161, quote: "16% of total pregnancies globally were affected by some form of hyperglycemia" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L13.002
    kind: cloze
    topic: burden
    text: About {{c1::21.4 million}} live births are at risk of intrauterine exposure to hyperglycemia (first global estimates for HIP).
    src: { page: 161, quote: "21.4 million live births at risk of being exposed to hyperglycemia intrauterine" }
    status: unverified
    tags: [numbers]
  - id: dm.L13.003
    kind: card
    topic: burden
    front: Why are more pregnant women now found to have undiagnosed type 2 DM?
    back: The ongoing epidemic of obesity and diabetes has raised T2DM in women of childbearing age.
    src: { page: 161, quote: "The ongoing epidemic of obesity & DM has led to more T2DM in women of childbearing age" }
    status: unverified
  - id: dm.L13.004
    kind: card
    topic: burden
    front: Which pregnant women should be tested for diabetes at the first prenatal visit, and with what criteria?
    back: Women with risk factors for T2DM, using the standard (non-pregnant) diagnostic criteria.
    src: { page: 161, quote: "it is reasonable to test women with risk factors for T2DM at their initial prenatal visit, using standard diagnostic criteria." }
    status: unverified
    tags: [high-yield]
  - id: dm.L13.005
    kind: table
    topic: burden
    title: The three common scenarios of diabetes with pregnancy
    columns: [Scenario, Example in the lecture, Key point]
    rows:
      - ["Type 1 DM with pregnancy", "Mrs. Halima, 23, primigravida, T1DM for 15 years", "Pre-existing DM known before pregnancy"]
      - ["Previously undiagnosed type 2 DM", "Mrs. Karima, 37, G3P2, first-trimester FPG ≥126 and 2-h OGTT ≥200", "Overt DM found early: standard criteria"]
      - ["Gestational DM (the majority)", "Mrs. Fatima, 28, G1P0, diagnosed in the 2nd trimester", "GDM criteria at 24-28 weeks"]
    blanks: [[1, 2], [2, 2]]
    src: { page: 162, quote: "Mrs. Fatima (The Majority, Gestational Diabetes (GDM))" }
    status: unverified
  # ---------- p162-165: diagnosis ----------
  - id: dm.L13.006
    kind: enumerate
    topic: diagnosis
    prompt: Enumerate the four criteria for the diagnosis of diabetes (any one is enough).
    points:
      - "FPG ≥126 mg/dL (no caloric intake for at least 8 h)"
      - "2-h PG ≥200 mg/dL during a 75 g OGTT"
      - "A1C ≥6.5% (NGSP-certified lab, DCCT-standardized)"
      - "Random PG ≥200 mg/dL with classic symptoms or hyperglycemic crisis"
    pass: 4
    src: { page: 162, quote: "FPG ≥ 126 mg/dL (Fasting is defined as no caloric intake for at least 8 h)" }
    status: unverified
    tags: [high-yield]
  - id: dm.L13.007
    kind: cloze
    topic: diagnosis
    text: The diagnostic OGTT uses a glucose load equivalent to {{c1::75 g}} anhydrous glucose dissolved in water; fasting means no caloric intake for at least {{c2::8 h}}.
    src: { page: 162, quote: "using a glucose load containing the equivalent of 75 g anhydrous glucose dissolved in water" }
    status: unverified
    tags: [numbers]
  - id: dm.L13.008
    kind: card
    topic: diagnosis
    front: What is required of the lab for an A1C ≥6.5% to diagnose diabetes?
    back: A method that is NGSP certified and standardized to the DCCT assay.
    src: { page: 162, quote: "The test should be performed in a laboratory using a method that is NGSP certified and standardized to the DCCT assay." }
    status: unverified
  - id: dm.L13.009
    kind: card
    topic: diagnosis
    front: Define gestational diabetes mellitus (GDM).
    back: Any degree of glucose intolerance first recognized during pregnancy (2nd or 3rd trimester) that is not pre-existing type 1 or type 2 diabetes.
    src: { page: 163, quote: "Any degree of glucose intolerance that was first recognized during pregnancy (2nd or 3rd trimester of pregnancy" }
    status: unverified
    tags: [high-yield]
  - id: dm.L13.010
    kind: cloze
    topic: diagnosis
    text: Test for GDM at {{c1::24-28}} weeks of gestation in women not previously known to have diabetes.
    src: { page: 163, quote: "Test for GDM at 24–28 weeks of gestation in pregnant women not previously known to have DM." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L13.011
    kind: card
    topic: diagnosis
    front: What was the HAPO study?
    back: A large multinational cohort of more than 23,000 pregnant women relating maternal glycemia at 24-28 weeks to pregnancy outcomes.
    src: { page: 163, quote: "A large-scale multinational cohort study of> 23,000 pregnant women" }
    status: unverified
  - id: dm.L13.012
    kind: card
    topic: diagnosis
    front: What did the HAPO study find about maternal glucose and adverse outcomes?
    back: Risk of adverse maternal, fetal and neonatal outcomes rose continuously with maternal glycemia, even within ranges once thought normal, with no threshold for most complications. This led to new GDM criteria.
    src: { page: 163, quote: "For most complications, there was no threshold for risk." }
    status: unverified
    tags: [high-yield]
  - id: dm.L13.013
    kind: card
    topic: diagnosis
    front: How is the one-step 75 g OGTT for GDM performed?
    back: In the morning after an overnight fast of at least 8 hours, with plasma glucose measured fasting, at 1 hour and at 2 hours.
    src: { page: 164, quote: "OGTT should be performed in the morning after an overnight fast of at least 8 hours." }
    status: unverified
  - id: dm.L13.014
    kind: cloze
    topic: diagnosis
    text: "One-step 75 g OGTT: GDM if any one value is met or exceeded: fasting {{c1::92}}, 1 hour {{c2::180}}, 2 hours {{c3::153}} mg/dL."
    src: { page: 164, quote: "If any one of the following plasma glucose values are met or exceeded, GDM is diagnosed" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L13.015
    kind: cloze
    topic: diagnosis
    text: "Two-step strategy, step 1: a {{c1::50 g}} glucose load test, {{c2::non-fasting}}, with plasma glucose at 1 hour; proceed if ≥{{c3::130}} mg/dL."
    src: { page: 164, quote: "Perform a 50 g GLT (non-fasting), with plasma glucose measurement at 1 hour." }
    status: unverified
    tags: [numbers]
  - id: dm.L13.016
    kind: card
    topic: diagnosis
    front: "Two-step strategy, step 2: which test, and how many abnormal values diagnose GDM?"
    back: A fasting 100 g OGTT; GDM if at least two of the four readings are met or exceeded.
    src: { page: 164, quote: "GDM is diagnosed if at least two of the following four readings are met or exceeded." }
    status: unverified
    tags: [high-yield]
  - id: dm.L13.017
    kind: table
    topic: diagnosis
    title: 100 g OGTT thresholds (step 2), mg/dL
    columns: [Time, Carpenter/Coustan, NDDG]
    rows:
      - [Fasting, "95", "105"]
      - [1 hour, "180", "190"]
      - [2 hours, "155", "165"]
      - [3 hours, "140", "145"]
    blanks: [[0, 1], [0, 2], [2, 1], [3, 1], [3, 2]]
    src: { page: 164, quote: "Carpenter/Coustan NDDG" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L13.018
    kind: table
    topic: diagnosis
    title: One-step vs two-step GDM diagnosis
    columns: [Feature, One-step, Two-step]
    rows:
      - [Glucose load, "75 g OGTT", "50 g GLT, then 100 g OGTT"]
      - ["Fasting?", "Yes, overnight ≥8 h", "Step 1 non-fasting; step 2 fasting"]
      - [Samples, "Fasting, 1 h, 2 h", "Step 1 at 1 h; step 2 fasting, 1, 2, 3 h"]
      - [Abnormal values needed, "One", "Two of four"]
    blanks: [[0, 1], [0, 2], [3, 1], [3, 2]]
    src: { page: 164, quote: "Perform a 75-g oral glucose tolerance test (OGTT), with plasma glucose measurement at fasting, 1 hour & 2 hours." }
    status: unverified
  - id: dm.L13.019
    kind: cloze
    topic: diagnosis
    text: The one-step strategy was expected to raise GDM incidence from {{c1::5-6%}} to {{c2::15-20%}}, mainly because {{c3::one abnormal value (not two)}} is enough.
    src: { page: 165, quote: "increase the incidence of GDM (5–6% to 15–20%), primarily because only one abnormal value (not two) became sufficient" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L13.020
    kind: mcq
    topic: diagnosis
    stem: A 29-year-old G1P0 at 26 weeks, not known to have diabetes, has a morning 75 g OGTT after an overnight fast. Fasting 90, 1 hour 184, 2 hours 140 mg/dL. Interpretation?
    options: ["GDM, because the 1-hour value is ≥180", "Normal, because two values are needed", Overt diabetes, Repeat with a 100 g OGTT, "Normal, because the fasting value is <92"]
    answer: 0
    why:
      - In the one-step strategy one value at or above threshold (92, 180, 153) diagnoses GDM.
      - Two abnormal values are the two-step (100 g) rule, not the one-step rule.
      - Overt DM needs standard criteria such as FPG ≥126 or 2-h ≥200.
      - The 100 g test is step 2 of the two-step strategy after an abnormal 50 g screen.
      - Any single value suffices; a normal fasting value does not cancel an abnormal 1-hour value.
    src: { page: 164, quote: "If any one of the following plasma glucose values are met or exceeded, GDM is diagnosed" }
    status: unverified
    tags: [high-yield]
  - id: dm.L13.021
    kind: mcq
    topic: diagnosis
    stem: A 31-year-old at 25 weeks has a non-fasting 50 g glucose load test; the 1-hour value is 142 mg/dL. Her fasting 100 g OGTT then shows fasting 93, 1 h 185, 2 h 160, 3 h 130 mg/dL. Using Carpenter/Coustan, what is the result?
    options: [GDM (two values abnormal), Not GDM (only one value abnormal), GDM (one value is enough), Not GDM (the screen was negative), Overt type 2 DM]
    answer: 0
    why:
      - 1 h 185 ≥180 and 2 h 160 ≥155 are two abnormal values, which makes the diagnosis.
      - Fasting 93 is below 95 and 3 h 130 is below 140, but two values are already abnormal.
      - One value is enough only in the one-step 75 g test.
      - A 50 g value of 142 is ≥130, so the screen was positive.
      - Nothing here meets standard criteria for overt diabetes.
    src: { page: 164, quote: "GDM is diagnosed if at least two of the following four readings are met or exceeded." }
    status: unverified
  # ---------- p162-163, 171-172: preconception ----------
  - id: dm.L13.022
    kind: enumerate
    topic: preconception
    prompt: Enumerate the four main points of preconception care in a woman with diabetes.
    points:
      - "Preconception counseling for glycemia as close to normal as safely possible, ideally A1C <6.5%"
      - "Family planning and effective contraception"
      - "Risks of potentially teratogenic drugs (ACE inhibitors, statins)"
      - "Counseling on the risk of development or progression of retinopathy"
    pass: 3
    src: { page: 162, quote: "Provide preconception counseling to keep glycemic control as close to normal as is safely possible, ideally A1C < 6.5%." }
    status: unverified
    tags: [high-yield]
  - id: dm.L13.023
    kind: cloze
    topic: preconception
    text: Preconception counseling aims for glycemia as close to normal as is safely possible, ideally A1C {{c1::<6.5%}}.
    src: { page: 162, quote: "Provide preconception counseling to keep glycemic control as close to normal as is safely possible, ideally A1C < 6.5%." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L13.024
    kind: card
    topic: preconception
    front: Which two potentially teratogenic drugs does the lecture name for preconception review?
    back: ACE inhibitors and statins.
    src: { page: 163, quote: "Risks related to certain medications. (Potentially teratogenic medications as ACE inhibitors & statins)." }
    status: unverified
    tags: [high-yield]
  - id: dm.L13.025
    kind: cloze
    topic: preconception
    text: The routine preconception folic acid supplement is {{c1::400-800 µg/day}}.
    src: { page: 171, quote: "Folic acid supplement (400-800 jug/day routine)" }
    status: unverified
    tags: [numbers]
  - id: dm.L13.026
    kind: enumerate
    topic: preconception
    prompt: "Preconception education (Table 15.1): list the lifestyle recommendations."
    points:
      - Regular moderate exercise
      - Avoidance of hyperthermia (hot tubs)
      - Adequate sleep
    pass: 3
    src: { page: 171, quote: "Avoidance of hyperthermia (hot tubs)" }
    status: unverified
  - id: dm.L13.027
    kind: enumerate
    topic: preconception
    prompt: "Preconception education (Table 15.1): what does the comprehensive nutrition assessment cover?"
    points:
      - Overweight and obesity or underweight
      - Meal planning
      - Correction of dietary nutritional deficiencies
      - Caffeine intake
      - Safe food preparation technique
    pass: 4
    src: { page: 171, quote: "Comprehensive nutrition assessment and recommendations for" }
    status: unverified
  - id: dm.L13.028
    kind: card
    topic: preconception
    front: Which pregnancy risks should preconception counseling explain to a woman with diabetes (Table 15.1)?
    back: Miscarriage, stillbirth, congenital malformations, macrosomia, preterm labor and delivery, and hypertensive disorders of pregnancy.
    src: { page: 171, quote: "risks to pregnancy including miscarriage, stillbirth, congenital malformations, macrosomia, preterm labor and delivery, hypertensive disorders in pregnancy" }
    status: unverified
  - id: dm.L13.029
    kind: card
    topic: preconception
    front: Which comorbidities should the preconception health assessment look for (Table 15.1)?
    back: Hyperlipidemia, hypertension, MASLD, PCOS and thyroid dysfunction, plus DKA history, severe hypoglycemia or unawareness, and barriers to care.
    src: { page: 171, quote: "comorbidities such as hyperlipidemia, hypertension, MASLD, PCOS, and thyroid dysfunction" }
    status: unverified
  - id: dm.L13.030
    kind: card
    topic: preconception
    front: Which obstetric history items belong in the preconception assessment (Table 15.1)?
    back: Cesarean section, congenital malformations or fetal loss, contraception, hypertensive disorders, postpartum hemorrhage, preterm delivery, previous macrosomia, Rh incompatibility, and thrombotic events (DVT/PE).
    src: { page: 171, quote: "previous macrosomia, Rh incompatibility, and thrombotic events (DVT/PE)" }
    status: unverified
  - id: dm.L13.031
    kind: enumerate
    topic: preconception
    prompt: "Preconception screening for complications in pre-existing diabetes (Table 15.1): what is checked?"
    points:
      - Comprehensive foot exam
      - Comprehensive ophthalmologic exam
      - ECG from age 35 with cardiac signs, symptoms or risk factors
      - Lipid panel
      - Serum creatinine
      - TSH
      - Urine albumin-to-creatinine ratio
    pass: 5
    src: { page: 172, quote: "comprehensive foot exam; comprehensive ophthalmologic exam; ECG in individuals starting at age 35 years who have cardiac signs or symptoms" }
    status: unverified
  - id: dm.L13.032
    kind: card
    topic: preconception
    front: Which genetic carrier states are screened before conception, based on history (Table 15.1)?
    back: Cystic fibrosis, sickle cell anemia, Tay-Sachs disease, thalassemia, and others if indicated.
    src: { page: 172, quote: "Genetic carrier status (based on history)" }
    status: unverified
  - id: dm.L13.033
    kind: card
    topic: preconception
    front: What contraceptive plan does the preconception checklist require?
    back: Contraception to prevent pregnancy until glycemic goals are achieved.
    src: { page: 172, quote: "Contraceptive plan to prevent pregnancy until glycemic goals are achieved" }
    status: unverified
  - id: dm.L13.034
    kind: mcq
    topic: preconception
    stem: A 30-year-old with type 2 DM on metformin, lisinopril and atorvastatin wants to conceive next year. A1C is 8.4%. What is the best preconception advice?
    options: ["Effective contraception until glycemic goals are met, aim A1C <6.5% if safe, and review lisinopril and atorvastatin", Stop contraception now and tighten control once pregnant, Aim for A1C <8% before conception, Continue all drugs because they are safe in pregnancy, "Aim A1C <6% regardless of hypoglycemia"]
    answer: 0
    why:
      - Contraception until goals, ideal A1C <6.5% if safe, and review of teratogenic ACE inhibitors and statins are the core points.
      - Conception should wait for glycemic goals under a contraceptive plan.
      - The preconception ideal is A1C <6.5%, not <8%.
      - ACE inhibitors and statins are named as potentially teratogenic.
      - The target is as close to normal as is safely possible, not at the cost of hypoglycemia.
    src: { page: 162, quote: "Family planning should be discussed & effective contraception prescribed." }
    status: unverified
  # ---------- p165-166: risks ----------
  - id: dm.L13.035
    kind: enumerate
    topic: risks
    prompt: Enumerate the fetal and neonatal risks of uncontrolled diabetes in pregnancy.
    points:
      - Spontaneous abortion
      - Fetal anomalies
      - Preeclampsia
      - Macrosomia
      - Neonatal hypoglycemia
      - Neonatal hyperbilirubinemia
    pass: 5
    src: { page: 165, quote: "Risks of uncontrolled DM in Pregnancy" }
    status: unverified
    tags: [high-yield]
  - id: dm.L13.036
    kind: card
    topic: risks
    front: Which long-term risks follow diabetes in pregnancy, for the mother and the offspring?
    back: "Mother: more T2DM and cardiovascular morbidity. Offspring: more obesity and T2DM later in life."
    src: { page: 165, quote: "Increase the risk of obesity & T2DM in offspring later in life" }
    status: unverified
  - id: dm.L13.037
    kind: card
    topic: risks
    front: Why is DKA a special danger in pregnancy?
    back: Pregnancy is a ketogenic state, so DKA can occur at lower glucose levels than outside pregnancy (euglycemic DKA).
    src: { page: 165, quote: "Pregnancy is a ketogenic state, ↑↑risk for DKA even at lower BG levels than in the non-pregnant state (Euglycemic DKA)." }
    status: unverified
    tags: [high-yield]
  - id: dm.L13.038
    kind: card
    topic: risks
    front: What should pregnant women with pre-existing diabetes (especially T1DM) have at home to prevent DKA?
    back: Ketone strips, plus education on DKA prevention (sick-day rules) and detection.
    src: { page: 165, quote: "Women with preexisting diabetes, especially T1DM, need ketone strips at home & education on DKA prevention (sick day rules) & detection." }
    status: unverified
  - id: dm.L13.039
    kind: cloze
    topic: risks
    text: Women with type 1 or type 2 DM should take low-dose aspirin {{c1::60-150 mg/day}} (usual dose {{c2::81 mg/day}}) from the end of the {{c3::1st trimester}} until delivery to lower preeclampsia risk.
    src: { page: 165, quote: "low-dose aspirin 60–150 mg/day (usual dose 81 mg/day) from the end of the 1st trimester until the baby is born" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L13.040
    kind: card
    topic: risks
    front: What is the "take care" warning about retinopathy in pregnancy?
    back: Rapidly implementing tight glycemic control when retinopathy is present is associated with worsening of the retinopathy.
    src: { page: 166, quote: "The rapid implementation of tight glycemic control in the setting of retinopathy is associated with a worsening of retinopathy." }
    status: unverified
    tags: [high-yield]
  - id: dm.L13.041
    kind: cloze
    topic: risks
    text: "Diabetes with chronic hypertension in pregnancy (ADA 2025): start or titrate treatment at {{c1::140/90}} mmHg, de-intensify below {{c2::90/60}} mmHg, and aim for {{c3::110-135/85}} mmHg."
    src: { page: 166, quote: "a blood pressure threshold of 140/90 mmHg for initiation or titration of therapy is associated with better pregnancy outcomes" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L13.042
    kind: card
    topic: risks
    front: Does treating chronic hypertension from 140/90 mmHg in pregnant women with diabetes increase small-for-gestational-age births?
    back: No. It gives better pregnancy outcomes than reserving treatment for severe hypertension, with no rise in SGA birth weight.
    src: { page: 166, quote: "with no increase in the risk of small-for-gestational-age birth weight" }
    status: unverified
  - id: dm.L13.043
    kind: mcq
    topic: risks
    stem: A 26-year-old with type 1 DM is 13 weeks pregnant. A1C 6.4%, BP 118/72. Which drug does the lecture recommend to start now until delivery?
    options: [Low-dose aspirin 81 mg/day, Labetalol, Atorvastatin, Lisinopril, No additional drug]
    answer: 0
    why:
      - Women with T1 or T2DM take low-dose aspirin 60-150 mg/day (usually 81) from the end of the 1st trimester to lower preeclampsia risk.
      - Her BP is normal; treatment starts at 140/90 mmHg.
      - Statins are potentially teratogenic.
      - ACE inhibitors are potentially teratogenic.
      - Aspirin is recommended for every woman with pre-existing T1 or T2DM.
    src: { page: 165, quote: "Women with T1 or T2DM should be prescribed low-dose aspirin 60–150 mg/day (usual dose 81 mg/day)" }
    status: unverified
    tags: [high-yield]
  - id: dm.L13.044
    kind: mcq
    topic: risks
    stem: A 25-year-old with type 1 DM at 20 weeks has had vomiting for a day. Glucose is 190 mg/dL, pH 7.18, bicarbonate 10 mEq/L and urine ketones 3+. Her husband says DKA is impossible with "such a low sugar." What explains it?
    options: [Pregnancy is ketogenic; DKA occurs at lower glucose (euglycemic DKA), DKA needs glucose >350 mg/dL in pregnancy, The ketones are only starvation ketosis, Pregnancy lowers the risk of DKA, This is lactic acidosis from metformin]
    answer: 0
    why:
      - Pregnancy is a ketogenic state with a higher risk of DKA even at lower glucose (euglycemic DKA).
      - There is no such threshold; DKA happens at lower glucose in pregnancy.
      - pH 7.18 and bicarbonate 10 are a true acidosis, not simple starvation ketosis.
      - The risk is higher in pregnancy, not lower.
      - She has type 1 DM on insulin, with ketones; nothing suggests metformin.
    src: { page: 165, quote: "Pregnancy is a ketogenic state, ↑↑risk for DKA even at lower BG levels than in the non-pregnant state (Euglycemic DKA)." }
    status: unverified
  # ---------- p166-169: targets ----------
  - id: dm.L13.045
    kind: card
    topic: targets
    front: Why is fasting glucose lower in normal pregnancy than outside pregnancy?
    back: The fetus and placenta take up glucose independently of insulin.
    src: { page: 166, quote: "Fasting BG levels are lower than in the non-pregnant state due to insulin-independent glucose uptake by the fetus &placenta." }
    status: unverified
    tags: [high-yield]
  - id: dm.L13.046
    kind: card
    topic: targets
    front: Why is postprandial glucose higher in normal pregnancy?
    back: Diabetogenic placental hormones cause carbohydrate intolerance.
    src: { page: 166, quote: "Postprandial BG is higher (hyperglycemia & carbohydrate intolerance) as a result of diabetogenic placental hormones." }
    status: unverified
  - id: dm.L13.047
    kind: card
    topic: targets
    front: In pregnancy, which is the primary glycemic measure, SMBG or A1C?
    back: SMBG; A1C is a secondary measure.
    src: { page: 166, quote: "In pregnancy, SMBG is more important than HbA1C (2ry measure)." }
    status: unverified
    tags: [high-yield]
  - id: dm.L13.048
    kind: card
    topic: targets
    front: How often is A1C checked in pregnancy, and why?
    back: More often than usual (monthly), because of rapid red cell turnover and physiological changes in glycemic parameters.
    src: { page: 166, quote: "A1C levels may need to be monitored more frequently than usual (monthly)." }
    status: unverified
  - id: dm.L13.049
    kind: cloze
    topic: targets
    text: Observational studies show the lowest rates of adverse fetal outcomes with A1C {{c1::<6-6.5%}}.
    src: { page: 167, quote: "Observational studies show the lowest rates of adverse fetal outcomes in association with A1C < 6–6.5%." }
    status: unverified
    tags: [numbers]
  - id: dm.L13.050
    kind: cloze
    topic: targets
    text: "ACOG and ADA glucose targets in pregnancy (pre-gestational DM and GDM): fasting ≤{{c1::95}} mg/dL and either 1-hour postprandial ≤{{c2::140}} or 2-hour postprandial ≤{{c3::120}} mg/dL."
    src: { page: 167, quote: "recommend the following targets for women with pre-gestational T1 or T2DM (the same for GDM)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L13.051
    kind: card
    topic: targets
    front: What is the benefit of postprandial (rather than only preprandial) monitoring in pregnancy?
    back: Better glycemic control and a lower risk of preeclampsia.
    src: { page: 167, quote: "Postprandial monitoring is associated with better glycemic control & lower risk of preeclampsia." }
    status: unverified
  - id: dm.L13.052
    kind: table
    topic: targets
    title: Blood glucose goals in pregnancy (ADA Table 15.2), mg/dL
