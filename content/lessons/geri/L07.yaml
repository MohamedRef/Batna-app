        quote: "TABLE 2. Means and Standard Deviations for Grip Strength (kg) According to Age and Sex\n| Age (yrs) | Hand | Mean (men) | SD± (men) | Mean (women) | SD± (women) |\n|---|---|---|---|---|---|\n| 50 to 54 | Right | 44.72 | 9.60 | 28.19 | 6.29 |\n| | Left | 42.22 | 9.75 | 25.56 | 5.60 |\n| 55 to 59 | Right | 44.89 | 9.20 | 26.90 | 6.33 |\n| | Left | 40.86 | 8.72 | 24.34 | 5.61 |\n| 60 to 64 | Right | 42.10 | 9.99 | 25.58 | 6.08 |\n| | Left | 39.32 | 9.00 | 23.05 | 5.55 |\n| 65 to 69 | Right | 40.00 | 8.28 | 24.17 | 5.97 |\n| | Left | 36.39 | 7.81 | 21.62 | 5.16 |\n| 70 to 74 | Right | 36.90 | 8.45 | 23.01 | 5.59 |\n| | Left | 34.39 | 7.77 | 20.58 | 9.29 |\n| 75 to 79 | Right | 34.27 | 7.94 | 20.91 | 5.36 |\n| | Left | 31.36 | 7.38 | 18.49 | 4.95 |\n| 80 to 84 | Right | 30.35 | 8.07 | 18.87 | 4.76 |\n| | Left | 27.84 | 7.35 | 16.73 | 4.21 |\n| 85 to 89 | Right | 28.41 | 7.95 | 16.93 | 4.46 |\n| | Left | 25.49 | 7.20 | 15.22 | 4.77 |\n± SD = standard deviation"
        text: |
          جداول الكتاب بتوري إن الـ ==grip strength== بتقل مع السن: الراجل 65–69 حوالي **40 kg** في اليد اليمين، والست حوالي **24 kg**، وعند 85–89 حوالي **28** و **17**. الست أقل في كل الأعمار.

          ليه القبضة بالذات؟ التفسير المقبول (مش في الكتاب): قوة القبضة مقياس لعضل الجسم كله (الـ sarcopenia)، والعضل هو احتياطي الكبير ضد الوقعة والمرض. وهي سهلة: جهاز صغير، ثواني، ومن غير ما يقوم من السرير، يعني تنفع حتى للي مش قادر يعمل الـ timed up and go.

          وليه الجدول مقسّم بالسن والجنس؟ عشان الرقم لوحده مالوش معنى: 24 kg طبيعي لست عندها 70 وضعيف لراجل في نفس السن.
