    src: { page: 443, quote: "Figure 23: Treatment algorithm for selecting glucose-lowering drugs for patients with type 2 diabetes (T2D) and chronic kidney disease (CKD).\nLifestyle therapy:\n  Physical activity, Nutrition, Weight loss\nFirst-line therapy:\n  Metformin: eGFR < 45 Reduce dose; eGFR < 30 Discontinue; Dialysis Discontinue\n  + SGLT2 inhibitor: eGFR < 20 Do not initiate; Dialysis Discontinue\nAdditional drug therapy as needed for glycemic control:\n  GLP-1 receptor agonist (preferred)\n  DPP-4 inhibitor, Insulin, Sulfonylurea, TZD, Alpha-glucosidase inhibitor\n  Guided by patient preferences, comorbidities, eGFR, and cost\n  Includes patients with eGFR < 30 ml/min per 1.73 m2 or treated with dialysis\n  See Figure 25\nKidney icon indicates estimated glomerular filtration rate (eGFR; ml/min per 1.73 m2); dialysis machine icon indicates dialysis. DPP-4, dipeptidyl peptidase-4; GLP-1, glucagon-like peptide-1; SGLT2, sodium–glucose cotransporter-2; TZD, thiazolidinedione." }
    status: unverified
    tags: [high-yield]
