      - kind: explain
        page: 119
        title: "الـ biological activities"
        quote: "C3b – primary opsonin, also C4b."
        text: |
          1. **Opsonins**: ==C3b هو الـ primary opsonin==، ومعاه C4b. الـ phagocytes بتمسكه بـ **CR1 و CR3 و CR4**.
          2. **Anaphylatoxins**: C5a و C3a و C4a بيطلّعوا **histamine** من الـ mast cells والـ basophils ← permeability، وجذب neutrophils، وانقباض smooth muscle.
          3. **Cell lysis**: بالـ **MAC**، آخر مرحلة في التلات طرق.
      - kind: explain
        page: 120
        title: "وكمان: B cells و immune complexes والخلايا الميتة"
        quote: "Interactions of the complement fragment C3d and CR2 with a microbial"
        text: |
          4. **B cell response**: ==C3d + CR2==. الـ B cell بتستجيب أسرع للـ antigen المتغطي C3d، وبيتخزّن على الـ germinal-centre dendritic cells كـ deposit طويل ← **memory**.
          5. **Immune complexes**: الـ C3b بيفكّك الـ complexes الكبيرة، وبيخليها تمسك في **CR1 على الـ RBCs** اللي بتوديها الـ **spleen**.
          6. **Dead cells**: الـ mitochondria والـ ER بينشّطوا الـ classical والـ alternative، فبيتشالوا ويحصل **homeostasis**.
