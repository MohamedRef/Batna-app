        prompt: "ليه الـ CTL محتاجة الـ TH cell تشوف الـ virus الأول، مش بتقتل على طول؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ CTL **سلاح خطير**، بيقتل خلايا من الجسم نفسه. فلو كانت بتشتغل لوحدها، أي غلطة = تدمير نسيج سليم.

