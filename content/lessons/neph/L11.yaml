  - id: neph.L11.lesson2
    title: "الرباعي الخطير: preeclampsia و HELLP و AFLP و TMA"
    hook: "4 أمراض بتلبس نفس اللبس: ضغط، صفائح واطية، إنزيمات كبد عالية. إزاي تفرقهم وكل واحد علاجه إيه؟"
    minutes: 9
    pages: [356, 359]
    topics: [preeclampsia, hellp, aflp, tma]
    goals:
      - "تحفظ تعريف الـ preeclampsia والـ severe features بالأرقام"
      - "تفرّق HELLP عن AFLP عن TTP و aHUS"
      - "تعرف مين بيتعالج بالولادة ومين بالـ plasma exchange"
    status: unverified
    steps:
      - kind: explain
        page: 356
        title: "الـ preeclampsia بالأرقام"
        quote: "Diagnosis of preeclampsia is made by the new onset of hypertension after 20 weeks of gestation in a previously normotensive woman."
        text: |
          ضغط **جديد** بعد ==20 weeks== في واحدة كان ضغطها طبيعي:
          - **BP ≥140/90** مرتين بينهم 4 ساعات، أو **≥160/110** في وقت أقصر.
          - **Proteinuria ≥300 mg/24 h**، أو PCR **0.3**، أو dipstick **1+**.

          بتصيب **5-8%** من الحوامل، وبتعمل ==15-20%== من الـ AKI في الحمل.
      - kind: explain
        page: 356
        title: "من غير بروتين؟ ينفع"
        quote: "preeclampsia can be diagnosed in the absence of proteinuria if any of the following signs of end-organ dysfunction are present"
        text: |
          لو مفيش proteinuria، الـ ==end-organ dysfunction== يكفي:
          - **Creatinine >1.1 mg/dL** أو اتضاعف.
          - **Platelets <100,000/µL**.
          - **Transaminases ≥2×** الطبيعي.
          - **Pulmonary edema**.
          - أعراض **مخ أو نظر**.

          والـ ==severe features== (حوالي 40-50%): **≥160/110** مع proteinuria، أو ≥140/90 مع end-organ dysfunction.
      - kind: check
        page: 356
        quote: "elevated serum creatinine > 1.1 mg/dl or doubling of serum creatinine in the absence of other kidney disease, thrombocytopenia (<100,000/microliter)"
        question: "At 30 weeks: BP 148/94 twice, urine PCR 0.1, platelets 85,000/µL. Is this preeclampsia?"
        options:
          - "Yes: thrombocytopenia is end-organ dysfunction"
          - "No: proteinuria is required"
          - "No: BP must be ≥160/110"
          - "No: it is gestational hypertension"
        answer: 0
        why:
          - "صح: platelets أقل من 100,000 تكفي من غير proteinuria."
          - "مش لازم البروتين لو فيه end-organ dysfunction."
          - "160/110 ده للـ severe features أو لتأكيد أسرع، مش شرط."
          - "الـ gestational hypertension من غير proteinuria ومن غير end-organ damage. هنا فيه."
      - kind: explain
        page: 357
        title: "Preeclampsia ولا CKD بيسوء؟"
        quote: "maternal serum levels of soluble angiogenic factors soluble fms-like tyrosine kinase-1 and placental growth factor may be utilized to distinguish between preeclampsia and CKD"
        text: |
          الـ GFR في الـ preeclampsia بيقع **30-40%** بس. لكن عند عيانة عندها CKD قبل الحمل الصورة بتتلخبط.

          الحل: سرعة نزول الكلى، زيادة البروتين، والـ ==sFlt-1/PlGF ratio==: الـ median **436** في الـ preeclampsia مقابل **4** في الـ CKD.
      - kind: explain
        page: 358
        title: "HELLP: الـ ATN مش الـ TMA"
        quote: "HELLP syndrome is considered a thrombotic microangiopathy like syndrome due to occurrence of thrombocytopenia, hemolysis, and AKI."
        text: |
          **H**emolysis، **EL**evated liver enzymes، **L**ow **P**latelets.

          - الـ AKI في **3-15%**، و recovery لحد **80%** حتى لو شديد.
          - السبب multifactorial: تغييرات الـ preeclampsia + **coagulopathy** ونزيف و ATN.
          - شبه TMA، لكن الـ biopsy غالبًا بيبيّن ==acute tubular necrosis==.
      - kind: explain
        page: 358
        title: "AFLP: الكبد هو اللي بيوقع الكلية"
        quote: "AKI is more common in AFLP, being present in 20-100% of women. AKI in AFLP usually manifests similarly to hepatorenal syndrome"
        text: |
          بعد ==30 weeks==. في **20%** السبب إن الجنين عنده **LCHAD deficiency**: الـ fatty acids بتعدّي المشيمة وتسمم كبد الأم.

          الـ AKI أشيع من HELLP (**20-100%**)، وشكله ==hepatorenal==: liver failure و ascites و vasodilation.

          العلاج: **ولادة**، صفائح لو **<40,000** قبل الولادة، و liver transplant في الحالات الشديدة.
      - kind: mnemonic
        page: 358
        quote: "encephalopathy, hyperbilirubinemia, abdominal ascites, hypoglycemia, and micro vesicular steatosis on liver biopsy, can differentiate AFLP from HELLP"
        word: "BEACH"
        parts:
          - { key: "B", text: "Bilirubin high (hyperbilirubinemia)" }
          - { key: "E", text: "Encephalopathy" }
          - { key: "A", text: "Ascites" }
          - { key: "C", text: "Cells full of tiny fat: microvesicular steatosis on biopsy" }
          - { key: "H", text: "Hypoglycemia" }
        hook: "الـ AFLP = كبد رايح **BEACH** يصيّف وساب الشغل: الـ Swanson features اللي بتفرقه عن HELLP."
      - kind: table
        page: 359
        quote: "aHUS is typically diagnosed in the postpartum period and is more common in multiparous women"
        title: "TTP ولا aHUS؟"
        columns: ["", "TTP", "aHUS"]
        rows:
          - ["السبب", "ADAMTS13 deficiency", "Complement dysregulation"]
          - ["التوقيت", "2nd-3rd trimester", "Postpartum"]
          - ["مين", "أي حامل", "Multiparous أكتر"]
          - ["العلاج", "Plasma exchange (± rituximab)", "Plasma exchange + eculizumab"]
        hide: [[0, 1], [1, 2], [3, 2]]
      - kind: reveal
        page: 359
        quote: "ADAMTS13 levels tend to decline as the pregnancy progresses, and as such, TTP is usually seen in the second and third trimesters"
        prompt: "ليه الـ TTP بيطلع في آخر الحمل مش أوله؟"
        answer: "لأن الـ **ADAMTS13** (اللي بيقص الـ von Willebrand factor) بيقل كل ما الحمل يتقدم. وأول ما تشك في TTP أو aHUS ابدأ **plasma exchange** على طول، من غير ما تستنى نتيجة الـ ADAMTS13."
      - kind: case
        page: 359
        quote: "Plasma exchange should be started when TTP or aHUS is suspected while waiting for the ADAMTS13 levels."
        stem: "Day 8 after her third delivery: hemoglobin 7.5 g/dL with schistocytes, platelets 50,000/µL, normal PT/aPTT, creatinine 3.8 mg/dL, BP 130/80."
        steps:
          - question: "Most likely diagnosis?"
            options: ["Atypical HUS", "HELLP syndrome", "AFLP", "DIC"]
            answer: 0
            why: "MAHA + low platelets + AKI بعد الولادة في multiparous = aHUS. الـ coagulation طبيعي، فمش DIC."
          - question: "First step?"
            options: ["Start plasma exchange now", "Wait for ADAMTS13", "Kidney biopsy first", "Urgent liver transplant"]
            answer: 0
            why: "ابدأ plasma exchange وانت مستني الـ ADAMTS13. والـ eculizumab مفيد في الـ aHUS. الـ biopsy بس لو الـ AKI ما اتحسنش."
      - kind: try
        items: [neph.L11.024, neph.L11.025, neph.L11.039, neph.L11.040, neph.L11.045]
    recap:
      - "Preeclampsia: ضغط جديد بعد 20 أسبوع ≥140/90 + proteinuria ≥300 mg أو end-organ dysfunction."
      - "Severe features: ≥160/110 مع proteinuria، أو ضغط مع end-organ damage."
      - "sFlt-1/PlGF عالي جدًا في الـ preeclampsia (436) مقابل CKD (4)."
      - "HELLP: AKI 3-15%، recovery 80%، الـ biopsy غالبًا ATN."
      - "AFLP بعد 30 أسبوع، LCHAD، AKI hepatorenal-like، Swanson = BEACH، العلاج ولادة."
      - "TTP آخر الحمل (ADAMTS13 بيقل)، aHUS بعد الولادة (complement). Plasma exchange فورًا."
    practice: [neph.L11.021, neph.L11.022, neph.L11.023, neph.L11.024, neph.L11.025, neph.L11.026, neph.L11.027, neph.L11.028, neph.L11.029, neph.L11.030, neph.L11.031, neph.L11.032, neph.L11.033, neph.L11.034, neph.L11.035, neph.L11.036, neph.L11.037, neph.L11.038, neph.L11.039, neph.L11.040, neph.L11.041, neph.L11.042, neph.L11.043, neph.L11.044, neph.L11.045, neph.L11.046, neph.L11.047, neph.L11.048]
