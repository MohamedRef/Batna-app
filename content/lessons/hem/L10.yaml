  - id: hem.L10.lesson6
    title: "تشخيص الـ PV: الـ criteria والـ algorithm"
    hook: "A و B، وبعدين WHO 2008 و 2016، وليه الـ Hb threshold نزل: كل criterion بيستبعد حاجة."
    minutes: 9
    pages: [162, 164]
    topics: [pv-criteria]
    goals:
      - "تعرف ليه نخاع الـ PV mandatory"
      - "تكتب الـ A/B criteria و 2016 WHO criteria وتعرف كل واحد بيثبت إيه"
      - "تمشي على algorithm الـ erythrocytosis"
    status: unverified
    steps:
      - kind: explain
        page: 162
        title: "ليه النخاع mandatory؟"
        quote: "BM biopsy is mandatory because it helps differentiate early PV with concomitant thrombocytosis from ET, and in patients with increased Hb levels, yet below the WHO threshold. Repeat the biopsy when evolution to PPV-MF or acute leukemia is suspected."
        text: |
          الكتاب بيقول ==BM biopsy is mandatory== لتلات أسباب:
          1. يفرّق **early PV مع thrombocytosis** من الـ **essential thrombocythaemia (ET)**: الاتنين ممكن يبانوا صفائح عالية والـ Hb لسه ما علاش قوي.
          2. لو الـ **Hb عالي بس تحت الـ WHO threshold**: النخاع هو اللي هيكشف الـ PV المستخبية.
          3. **يتعاد** لو شاكك في **post-PV myelofibrosis (PPV-MF)** أو **acute leukemia**.

          والفرق في النخاع، تفسير مقبول (مش في الكتاب) مبني على الدرسين: الـ ET بيزوّد الـ megakaryocytes بس، والـ PV **panmyelosis** (التلات خطوط). نفس الصفائح العالية، بس النخاع بيحكي قصتين مختلفين.
      - kind: table
        page: 162
        quote: "A1 + A2 + either another A or another two B establishes polycythaemia vera."
        title: "الـ A/B criteria"
        columns: [Code, Criterion]
        rows:
          - ["A1", "Red cell mass >25% above predicted, or PCV ≥0.60 men / 0.56 women"]
          - ["A2", "SaO2 >92% and EPO not raised"]
          - ["A3", "Palpable splenomegaly"]
          - ["A4", "Clonal abnormality (not BCR-ABL)"]
          - ["B1–B2", "Platelets >400; neutrophils >10 (12.5 in smokers)"]
          - ["B3–B4", "Radiological splenomegaly; EEC or low EPO"]
          - ["Diagnosis", "A1 + A2 + another A or two B"]
        hide: [[0, 1], [1, 1], [6, 1]]
      - kind: explain
        page: 162
        title: "الـ A/B criteria: كل واحد بيثبت إيه؟"
        quote: "A1 + A2 + either another A or another two B establishes polycythaemia vera."
        text: |
          التشخيص = **A1 + A2 + (A تالتة أو B اتنين)**. التفسير المقبول (مش في الكتاب) لكل جزء:
          - **A1** (red cell mass أو PCV عالي): بيثبت إنها ==true polycythemia==، مش relative.
          - **A2** (SaO2 >92% و EPO مش عالي): بيستبعد الـ **secondary** (hypoxia أو EPO من ورم).
          - **A3** (palpable spleen) و **B3** (radiological spleen): علامة **MPN** (extramedullary hematopoiesis).
          - **A4** (clonal abnormality، مش BCR-ABL): بيثبت إنه **ورم clonal**، مش CML.
          - **B1–B2** (platelets و neutrophils): بيوروا إن التلات خطوط زايدين.
          - **B4** (EEC أو EPO واطي): خلايا شغالة من غير أمر.

          يعني الـ A1 و A2 دايمًا لازم: «الكرات زايدة فعلًا، ومش من سبب برّا النخاع».
      - kind: explain
        page: 163
        title: "2008 ضد 2016"
        quote: "Revised 2016 WHO diagnostic criteria for PRV\n  Major criteria\n    1. Hemoglobin >16.5 g/dL in men, Hemoglobin >16.0 g/dL in women, or, Hematocrit >49% in men, Hematocrit >48% in women, or, increased red cell mass (RCM)*\n    2. BM biopsy showing hypercellularity for age with trilineage growth (panmyelosis) including prominent erythroid, granulocytic, and megakaryocytic proliferation with pleomorphic, mature megakaryocytes (differences in size)\n    3. Presence of JAK2V617F or JAK2 exon 12 mutation\n  Minor criterion\n    Subnormal serum erythropoietin level\nDiagnosis of PV requires meeting either all 3 major criteria, or the first 2 major criteria and the minor criterion†"
        text: |
          **WHO 2008**: Hb **>18.5** (رجالة) و **>16.5** (ستات)، ومعاهم JAK2، ومينور (marrow، EPO واطي، endogenous erythroid colonies (EEC)).

          **Revised 2016 WHO** (المهم):
          1. Hb ==>16.5 g/dL رجالة / >16.0 ستات==، أو Hct **>49% / >48%**، أو RCM عالي
          2. نخاع **hypercellular** مع **panmyelosis** و megakaryocytes **pleomorphic** mature
          3. **JAK2 V617F أو exon 12**

          **Minor**: EPO **subnormal**. التشخيص = **التلاتة**، أو **أول اتنين + الـ minor**.
      - kind: figure
        page: 163
        quote: "WHO Diagnostic Criteria OF PRV 2008"
        title: "صورة الكتاب: الـ WHO criteria سنة 2008"
        image: { file: hem/L10-who-2008.webp, book: true }
        alt: "Book slide titled Polycythemia Vera. Left upper block, supportive or positive criteria, current: A1 elevated red cell mass or haemoglobin above 18.5 g/dL in men or 16.5 g/dL in women; A2 no cause of secondary erythrocytosis; A3 splenomegaly; A4 clonal abnormality, non BCR-ABL; A5 endogenous erythroid colony formation in vitro; B1 thrombocytosis above 400; B2 leukocytosis above 12; B3 PV bone marrow changes; B4 low serum erythropoietin. Right upper block, proposed: major criteria haemoglobin above 18.5 or 16.5 g/dL or increased red cell volume, and JAK2 V617F; minor criteria marrow changes, low serum EPO, endogenous erythroid colonies. Lower left block, exclusionary criteria: A2, no secondary erythrocytosis, listing hypoxia, high oxygen affinity haemoglobin, truncated erythropoietin receptor and inappropriate erythropoietin production by tumour."
        caption: |
          الـ slide القديمة (2008) اللي الكتاب حاططها فوق الـ 2016 عشان تقارن:

          - **فوق شمال** (supportive/positive، الـ **current** وقتها): نفس منطق الـ A/B اللي فات: **A1** red cell mass أو Hb ==>18.5 رجالة / >16.5 ستات==، **A2** مفيش سبب secondary، A3 splenomegaly، A4 clonal abnormality (مش BCR-ABL)، A5 endogenous erythroid colonies، وبعدين **B1–B4**.
          - **فوق يمين** (الـ **proposed**): major = نفس الـ Hb العالي + ==JAK2 V617F==، و minor = نخاع PV، EPO واطي، endogenous colonies.
          - **تحت شمال** (exclusionary): الـ A2 بالتفصيل: hypoxia (pO2 ≤92%)، high-affinity Hb، truncated EPO receptor، أو EPO من ورم.

          اللي تاخده: حدود الـ Hb كانت **أعلى** (18.5 / 16.5)، والـ JAK2 كان لسه «proposed».
      - kind: figure
        page: 163
        quote: "Revised 2016 WHO diagnostic criteria for PRV"
        title: "صورة الكتاب: الـ WHO criteria المعدّلة 2016"
        image: { file: hem/L10-who-2016.webp, book: true }
        alt: "Book slide on grey bands: major criteria. 1, haemoglobin above 16.5 g/dL in men or above 16.0 g/dL in women, or haematocrit above 49 percent in men or above 48 percent in women, or increased red cell mass. 2, bone marrow biopsy showing hypercellularity for age with trilineage growth (panmyelosis) including prominent erythroid, granulocytic and megakaryocytic proliferation with pleomorphic, mature megakaryocytes. 3, presence of JAK2 V617F or JAK2 exon 12 mutation. Minor criterion: subnormal serum erythropoietin level. Diagnosis requires all three major criteria, or the first two major criteria and the minor criterion."
        caption: |
          ودي الـ 2016، اللي هي المهمة للامتحان، من فوق لتحت:

          - **Major 1**: Hb ==>16.5 رجالة / >16.0 ستات==، أو Hct **>49% / >48%**، أو red cell mass عالي. (أقل من 2008 بكتير.)
          - **Major 2**: نخاع **hypercellular** فيه **panmyelosis** (التلات خطوط)، و megakaryocytes **pleomorphic** mature.
          - **Major 3**: **JAK2 V617F أو exon 12**.
          - **Minor**: EPO ==subnormal==.
          - **آخر سطر**: التشخيص = التلات major، أو **أول اتنين + الـ minor**.

          قارنها بالصورة اللي فوق: الحد نزل عشان يمسك الـ **masked PV** (ص 164)، والـ JAK2 بقى major.
