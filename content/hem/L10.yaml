    topic: secondary
    stem: "A 30-year-old woman has isolated erythrocytosis, a low serum EPO, normal WBC and platelets, no splenomegaly and a normal P50. JAK2 V617F and exon 12 are negative. Her mother has the same. Most likely diagnosis?"
