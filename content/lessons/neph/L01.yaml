  - id: neph.L01.lesson3
    title: "Delta ratio و compensation: المشكلة المستخبية"
    hook: "مريض ممكن يكون عنده اتنين أو تلاتة acid–base disorders مع بعض. الحسبة الصغيرة دي بتكشفهم."
    minutes: 10
    pages: [10, 14]
    topics: [delta, compensation]
    goals:
      - "تحسب الـ delta ratio وتقرا الـ bands"
      - "تعرف مين بيعوّض مين"
      - "تحسب الـ expected pCO2 والـ expected HCO3"
    status: unverified
    steps:
      - kind: explain
        page: 10
        quote: "the increase in AG above normal (called ∆AG) is equal to the decrease in HCO3− from normal value"
        title: "كل أنيون جديد ياكل bicarbonate واحد"
        text: |
          في ==high AG metabolic acidosis== البسيطة: كل **1 mEq/L** زيادة في الـ AG بيقابلها **1 mEq/L** نقص في الـ HCO3، لأن كل H+ جه مع الأنيون اتعادل بـ HCO3 واحد.

          يعني **ΔAG = ΔHCO3** والنسبة = **1**. أي بُعد كبير عن الـ 1 = **mixed disorder**.
      - kind: explain
        page: 12
        quote: "Delta ratio = Measured anion gap - 12 24 - Measured [HCO3]"
        title: "المعادلة"
        text: |
          - **Delta ratio = (AG − 12) / (24 − HCO3)**

          - البسط: الـ AG زاد قد إيه عن 12.
          - المقام: الـ HCO3 قل قد إيه عن 24.

          بيستخدموه لتقييم الـ elevated AG metabolic acidosis، ولكشف هل فيه ==mixed disorder==.
      - kind: figure
        page: 12
        quote: "0.8 - 2.0 Pure high anion gap metabolic acidosis"
        title: "مسطرة الـ delta ratio"
        alt: "A horizontal scale of the delta ratio with bands: below 0.4 normal AG metabolic acidosis; 0.4 to 0.8 mixed normal and high AG acidosis; 0.8 to 2.0 pure high AG acidosis; above 2.0 high AG acidosis plus metabolic alkalosis or pre-existing compensated respiratory acidosis."
        caption: "تحت 0.8: الـ HCO3 نزل **أكتر** من المتوقع، فيه normal AG acidosis كمان. فوق 2: الـ HCO3 **أعلى** من المتوقع، فيه alkalosis (أو respiratory acidosis قديمة متعوّضة)."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="50" rx="8" class="fg-thin"/>
            <text x="20" y="32" class="t-b">&lt; 0.4</text>
            <text x="20" y="50" class="t-sm">Normal AG metabolic acidosis</text>
            <rect x="10" y="70" width="310" height="50" rx="8" class="fg-acc"/>
            <text x="20" y="92" class="t-b">0.4 - 0.8</text>
            <text x="20" y="110" class="t-sm">Mixed normal AG + high AG acidosis</text>
            <rect x="10" y="130" width="310" height="50" rx="8" class="fg-good"/>
            <text x="20" y="152" class="t-b">0.8 - 2.0</text>
            <text x="20" y="170" class="t-sm">Pure high AG metabolic acidosis</text>
            <rect x="10" y="190" width="310" height="60" rx="8" class="fg-bad"/>
            <text x="20" y="212" class="t-b">&gt; 2.0</text>
            <text x="20" y="229" class="t-sm">High AG acidosis + metabolic alkalosis</text>
            <text x="20" y="244" class="t-sm t-mut">(or old compensated respiratory acidosis)</text>
          </svg>
      - kind: check
        page: 11
        quote: "In a mixed high AG metabolic acidosis and metabolic alkalosis, the HCO3− level is inappropriately high relative to the increase in AG."
        question: "DKA patient who vomited for 3 days: AG 32, HCO3 18 mEq/L. Delta ratio and meaning?"
        options:
          - "About 3.3: high AG acidosis plus metabolic alkalosis"
          - "About 1: pure high AG acidosis"
          - "About 0.5: added normal AG acidosis"
          - "About 0.3: normal AG acidosis only"
        answer: 0
        why:
          - "صح: (32 − 12)/(24 − 18) = 20/6 ≈ 3.3. الـ HCO3 عالي على قد الـ AG لأن الترجيع شال HCl وساب HCO3."
          - "ده لو الـ HCO3 كان نزل 20 كمان."
          - "ده لو الـ HCO3 نزل أكتر من الـ AG."
          - "الـ AG هنا عالي جدًا."
      - kind: aside
        page: 11
        quote: "Average A/A of lactic acidosis is 1.6 Up to half of acid load is buffered intracellularly"
        tone: trap
        text: "**Pitfalls**: الـ lactic acidosis متوسطها **1.6** مش 1 (نص الحمض بيتعادل جوه الخلايا). والـ DKA بتبدأ حوالي **2** وتنزل لـ **0** متأخر، لأن الـ ketones بتطلع في البول. فمتتسرعش تقول mixed عند 1.6."
      - kind: explain
        page: 12
        quote: "In a metabolic acid–base disorder, the compensatory response is respiratory."
        title: "مين بيعوّض مين؟"
        text: |
          الـ ==compensation== (secondary physiologic response) بتقلل تغيّر الـ H+:

          - **Metabolic** disorder: الرئة بتعوّض. Acidosis = **hyperventilation** (pCO2 ينزل). Alkalosis = **hypoventilation** (pCO2 يطلع).
          - **Respiratory** disorder: الكلية بتعوّض بتعديل الـ **HCO3 reabsorption**.

          والكتاب بيأكد: الـ compensation **بترجّع** الـ pH ناحية الطبيعي، مش بتعلّيه لفوق الطبيعي.
      - kind: table
        page: 13
        quote: "Primary acid—base disturbances and their secondary response"
        title: "Table 4.1"
        columns: [Disorder, Primary, Secondary]
        rows:
          - ["Metabolic acidosis", "↓ HCO3", "↓ pCO2"]
          - ["Metabolic alkalosis", "↑ HCO3", "↑ pCO2"]
          - ["Respiratory acidosis", "↑ pCO2", "↑ HCO3"]
          - ["Respiratory alkalosis", "↓ pCO2", "↓ HCO3"]
        hide: [[0, 2], [1, 2], [2, 2], [3, 2]]
      - kind: aside
        page: 13
        quote: "these compensatory mechanisms do not increase the pH to normal but rather return the pH to normal."
        tone: analogy
        text: "الـ compensation زي الفرامل، مش زي الريوس: بتهدّي العربية ناحية الطبيعي، عمرها ما ترجّعك لورا. لو لقيت الـ pH **عدّى** الطبيعي للناحية التانية، يبقى فيه disorder تاني."
      - kind: explain
        page: 14
        quote: "Expected 1.5 X [HCO3]+8 (+/- 2)"
        title: "الأرقام اللي لازم تتحفظ"
        text: |
          **Metabolic** (الرئة بتعوّض، احسب الـ pCO2):

          - **Metabolic acidosis: pCO2 = 1.5 × HCO3 + 8 (± 2)** (Winter)
          - **Metabolic alkalosis: pCO2 = 0.7 × HCO3 + 20 (± 5)**

          **Respiratory** (الكلية بتعوّض، لكل 10 mmHg تغيير في الـ pCO2):

          - **Acidosis: HCO3 ↑ 1 acute, ↑ 3.5 chronic** (ص 14 بتقرّبها × 4)
          - **Alkalosis: HCO3 ↓ 2 acute, ↓ 4–5 chronic** (ص 14 × 5)
      - kind: aside
        page: 13
        quote: "Quick check: Pco, = value should approximate last two digits of pH"
        tone: tip
        text: "**Quick check** في الـ metabolic acidosis: الـ pCO2 المتوقع ≈ **آخر رقمين في الـ pH**. pH 7.25 يبقى pCO2 حوالي 25."
      - kind: match
        page: 13
        quote: "Failure of the Pco, to decrease to expected value = complicating respiratory acidosis"
        prompt: "طابق النتيجة بالـ disorder الإضافي:"
        pairs:
          - ["Metabolic acidosis, pCO2 above expected", "Added respiratory acidosis"]
          - ["Metabolic acidosis, pCO2 below expected", "Added respiratory alkalosis"]
          - ["Respiratory acidosis, HCO3 below expected", "Added metabolic acidosis"]
          - ["Respiratory acidosis, HCO3 above expected", "Added metabolic alkalosis"]
        why: "القاعدة: الرقم اللي **مقصّر** أو **زايد** عن المتوقع بيكشف disorder من النوع التاني في نفس الاتجاه بتاعه."
      - kind: check
        page: 14
        quote: "Expected 1.5 X [HCO3]+8 (+/- 2)"
        question: "Metabolic acidosis, HCO3 10 mEq/L, PaCO2 15 mmHg. What else is going on?"
        options:
          - "Added respiratory alkalosis"
          - "Appropriate compensation"
          - "Added respiratory acidosis"
          - "Added metabolic alkalosis"
        answer: 0
        why:
          - "صح: المتوقع 1.5 × 10 + 8 = **23 ± 2**، و 15 أقل بكتير = hyperventilation زيادة (زي الـ sepsis أو الـ salicylate)."
          - "15 مش جوه 21–25."
          - "ده لو الـ pCO2 أعلى من 25."
          - "الـ pCO2 هو اللي بيحكم على الجزء التنفسي هنا."
      - kind: try
        items: [neph.L01.060, neph.L01.062, neph.L01.070, neph.L01.072, neph.L01.076]
    recap:
      - "Delta ratio = (AG − 12)/(24 − HCO3)."
      - "< 0.4 normal AG؛ 0.4–0.8 mixed؛ 0.8–2 pure high AG؛ > 2 + metabolic alkalosis."
      - "Metabolic ← الرئة؛ respiratory ← الكلية؛ الـ compensation عمرها ما تعدّي الطبيعي."
      - "Winter: 1.5 × HCO3 + 8 ± 2؛ alkalosis: 0.7 × HCO3 + 20 ± 5."
      - "Resp acidosis 1 / 3.5 لكل 10؛ resp alkalosis 2 / 4–5 لكل 10."
