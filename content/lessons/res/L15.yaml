schema: batna.lesson/v1
lecture: res.L15
lessons:
- id: res.L15.lesson1
  title: 'الإحصاء: من العيّنة للناس كلها'
  hook: إنت بتقيس ضغط 100 عيان في العيادة، بس عايز تتكلم عن كل الناس. إزاي ده يبقى صح؟
  minutes: 10
  pages: [4, 12]
  topics: [intro]
  goals:
  - تعرف الإحصاء بيعمل إيه في 6 خطوات
  - تفرّق بين الـ population والـ sample ورموزهم
  - تفرّق بين الـ descriptive والـ analytic والـ vital statistics
  status: unverified
  steps:
  - kind: explain
    page: 4
    quote: |-
      Definition
      Statistics is the scientific field that deals with
      collection,
      classification,
      presentation
      description
      analysis
      & interpretation of data.
    title: الإحصاء بيعمل إيه؟
    text: |-
      الإحصاء مش «حسابات وبس». هو علم بيمسك الـ **data** من أولها لآخرها:

      - ==collection== (تجمع) ← **classification** (تصنّف) ← **presentation** (تعرض)
      - **description** (توصف) ← **analysis** (تحلل) ← ==interpretation== (تفسّر)

      ولما الكلام ده يتطبّق على الطب والعلوم البيولوجية اسمه **biostatistics**.
    remind: [res.L15.001]
  - kind: explain
    page: 5
    quote: |-
      Some definitions
      Population (target population)
      Is the population about which one wishes to make an inference. It is a large set of individuals( human) or other living organisms (animals ,insects ,plant or non living organisms (water ,vaccines)
      Sample:
      Is a subset of the population selected in a way that is representative of the target population.
      It should reflect the similarities and differences found in the population .Result from it can be generalized to the population
    title: الـ population والـ sample
    text: |-
      - **Population (target population)**: الناس (أو الكائنات، أو حتى ماية ولقاحات) اللي ==عايز تطلع عليهم استنتاج==.
      - **Sample**: جزء منهم، بتختاره بطريقة تخليه ==representative==: يشيل نفس التشابه والاختلاف اللي في الـ population.

      ليه representative؟ لأن النتيجة هتتعمم على الناس كلها، مش على الـ 100 اللي قستهم وبس.
  - kind: figure
    page: 6
    quote: |-
      Population: quantity (count) = N; mean = μ; standard deviation = σ
      Sample: quantity (count) = n; mean = x̄; standard deviation = s
    title: نفس المقاييس، رموز مختلفة
    svg: |-
      <svg viewBox="0 0 340 170" xmlns="http://www.w3.org/2000/svg">
        <defs><marker id="L15a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
        <ellipse cx="96" cy="80" rx="90" ry="62" class="fg-box"/>
        <text x="96" y="30" text-anchor="middle" class="t-sm t-b">Population</text>
        <g class="fg-dot-acc"><circle cx="50" cy="60" r="4"/><circle cx="70" cy="90" r="4"/><circle cx="96" cy="55" r="4"/><circle cx="120" cy="100" r="4"/><circle cx="140" cy="70" r="4"/><circle cx="60" cy="115" r="4"/><circle cx="100" cy="120" r="4"/><circle cx="150" cy="105" r="4"/><circle cx="35" cy="88" r="4"/><circle cx="118" cy="45" r="4"/></g>
        <text x="96" y="160" text-anchor="middle" class="t-sm">N · μ · σ</text>
        <path d="M190 80H226" class="fg-arrow" marker-end="url(#L15a)"/>
        <text x="208" y="70" text-anchor="middle" class="t-sm t-mut">select</text>
        <ellipse cx="282" cy="80" rx="52" ry="40" class="fg-acc"/>
        <text x="282" y="34" text-anchor="middle" class="t-sm t-b">Sample</text>
        <g class="fg-dot-acc"><circle cx="262" cy="72" r="4"/><circle cx="290" cy="64" r="4"/><circle cx="300" cy="92" r="4"/><circle cx="270" cy="96" r="4"/></g>
        <text x="282" y="160" text-anchor="middle" class="t-sm">n · x̄ · s</text>
        <path d="M282 124C250 150 140 150 110 146" class="fg-arrow-acc" marker-end="url(#L15a)"/>
        <text x="196" y="138" text-anchor="middle" class="t-sm t-acc">generalize</text>
      </svg>
    caption: الـ population ليها N وμ وσ، والعيّنة ليها n وx̄ وs. العيّنة بتتعمم على الـ population.
    alt: A large ellipse labelled population with N, mu, sigma and a smaller ellipse labelled sample with n, x-bar, s; an
      arrow selects the sample and another generalizes back.
  - kind: table
    page: 6
    quote: |-
      Population: quantity (count) = N; mean = μ; standard deviation = σ
      Sample: quantity (count) = n; mean = x̄; standard deviation = s
    title: احفظ الرموز
    columns:
    - Measure
    - Population
    - Sample
    rows:
    - - Count
      - N
      - n
    - - Mean
      - μ
      - x̄
    - - Standard deviation
      - σ
      - s
    hide:
    - - 0
      - 2
    - - 1
      - 1
    - - 2
      - 2
  - kind: aside
    page: 6
    quote: |-
      Population: quantity (count) = N; mean = μ; standard deviation = σ
      Sample: quantity (count) = n; mean = x̄; standard deviation = s
    tone: tip
    text: |-
      قاعدة سهلة: **اليوناني والكابيتال للـ population** (N، μ، σ)، و**اللاتيني الصغير للـ sample** (n، x̄، s). الكبير للكل، والصغير للجزء.
  - kind: explain
    page: 7
    quote: |-
      1- Descriptive statistics:
      Which is concerned with the summary measures of data for a sample of a population.
      E.g.: % of age and sex distribution
      Average blood pressure
    title: Descriptive statistics
    text: |
      الـ **descriptive statistics** بتهتم بـ ==summary measures== لبيانات sample من population.

      أمثلة السلايد: ==% توزيع السن والنوع==، أو ==متوسط الضغط==.

      ليه بنبدأ بيها؟ لأن قبل أي استنتاج لازم توصف العيّنة بتاعتك: مين هما وأرقامهم شكلها إيه. التفسير المقبول (مش في الكتاب).
  - kind: check
    page: 7
    quote: |-
      1- Descriptive statistics:
      Which is concerned with the summary measures of data for a sample of a population.
      E.g.: % of age and sex distribution
      Average blood pressure
    question: 'Reporting the average blood pressure and the % age and sex distribution of a study sample is:'
    options:
    - Descriptive statistics
    - Analytic statistics
    - Vital statistics
    - Biostatistics inference
    answer: 0
    why:
    - 'صح: ده وصف للعيّنة بأرقام ملخصة.'
    - الـ analytic بتختبر علاقة وتستنتج للـ population.
    - الـ vital statistics مواليد ووفيات وجواز.
    - الـ inference استنتاج للـ population، مش وصف.
  - kind: explain
    page: 8
    quote: |-
      2- Analytic statistics:
      Concerned with the use of data from a sample of population to make inferences about the population (ex: to come to a conclusion about the relation between a condition ( disease and its cause) to be generalized over the population
      Example : relation between smoking and lung cancer
    title: 3 فروع
    text: |-
      - **Descriptive statistics**: بتلخّص العيّنة، زي ==% age and sex distribution== أو **average blood pressure**.
      - **Analytic statistics**: بتستخدم العيّنة عشان ==تستنتج== حاجة عن الـ population، زي علاقة **smoking** بالـ **lung cancer**.
      - **Vital statistics**: الحكومة بتجمع على طول births، deaths، marriage، divorces، والحالات الصحية، ومكتب الصحة هو اللي بيبلّغ.
    remind: [res.L15.010]
  - kind: check
    page: 8
    quote: |-
      2- Analytic statistics:
      Concerned with the use of data from a sample of population to make inferences about the population (ex: to come to a conclusion about the relation between a condition ( disease and its cause) to be generalized over the population
      Example : relation between smoking and lung cancer
    question: A study concludes, from a sample, that smoking is related to lung cancer in the population. Which branch?
    options:
    - Analytic statistics
    - Descriptive statistics
    - Vital statistics
    answer: 0
    why:
    - 'صح: استنتاج من العيّنة عن علاقة في الـ population.'
    - الـ descriptive بيلخّص العيّنة بس من غير استنتاج.
    - الـ vital دي سجلات الحكومة للمواليد والوفيات وغيرها.
  - kind: explain
    page: 9
    quote: |-
      3- Vital statistics:
      It is the ongoing collection by government agencies of data relating to events such as:
      Births
      Deaths
      Marriage
      Divorces
      Health and disease related conditions
      reportable by local health authorities ( health office or health center)
    title: Vital statistics
    text: |
      الـ **vital statistics** = جمع مستمر من ==جهات حكومية== لبيانات عن:

      - Births و Deaths
      - Marriage و Divorces
      - ==Health and disease related conditions==

      وبيبلّغ عنها ==local health authorities== (مكتب الصحة أو الوحدة الصحية).

      ليه حكومية ومستمرة؟ لأنها أرقام البلد كلها اللي بنحسب منها المعدلات، فلازم تتجمع بانتظام ومن مصدر رسمي. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 10
    quote: |-
      Biostatistics
      Application of statistical procedures in the field of biological sciences & medicine
    title: يعني إيه biostatistics؟
    text: |
      الـ **biostatistics** = ==تطبيق الطرق الإحصائية== في مجال ==العلوم البيولوجية والطب==.

      ليه اسم خاص؟ لأن البيانات الطبية ليها طبيعتها (عيانين، أمراض، علاج)، والطرق دي اتكيفت عليها. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 12
    quote: |-
      Statistics is helpful to assess:
      Diagnostic testing
      Effects of new drugs and treatment modalities.
      Epidemiologists need to know how to:
      Calculate rates
      Compare between groups and to decide how likely the differences in comparison groups could be due to chance.
    title: طب ليه الدكتور يتعب نفسه؟
    text: |-
      لأنك هتقرا papers طول عمرك، ولازم تعرف ==تقيّم وتنقد== اللي فيها. الإحصاء بيساعدك تقيّم:

      - **diagnostic testing** و**effects of new drugs**.
      - والـ epidemiologist بيحسب **rates** ويقارن الـ groups ويسأل: الفرق ده ==ممكن يكون chance==؟
    remind: [res.L15.014]
  - kind: aside
    page: 11
    quote: |-
      Uses in Medicine:
      Biostatistics is necessary for both clinical and preventive medicine.
      Physicians should have the basic knowledge for evaluation and criticism of researches published in medical journals.
    tone: joke
    text: |-
      الدكتور اللي مبيعرفش إحصاء بيقرا الـ abstract ويصدّق. واللي بيعرف بيبص على الـ n الأول. 😄
  - kind: try
    items: [res.L15.001, res.L15.003, res.L15.004, res.L15.007]
  recap:
  - 'الإحصاء: collection → classification → presentation → description → analysis → interpretation.'
  - الـ sample لازم تكون representative عشان النتيجة تتعمم.
  - N، μ، σ للـ population؛ n، x̄، s للـ sample.
  - descriptive يلخّص، analytic يستنتج، vital سجلات الحكومة.
  practice: [res.L15.001, res.L15.002, res.L15.003, res.L15.004, res.L15.005, res.L15.006, res.L15.007, res.L15.008, res.L15.009,
    res.L15.010, res.L15.011, res.L15.012, res.L15.013, res.L15.014]
- id: res.L15.lesson2
  title: 'أنواع المتغيرات: بتقيس ولا بتعد ولا بتصنّف؟'
  hook: الوزن والنبض الاتنين أرقام. بس واحد continuous والتاني discrete. الفرق ده بيحدد الجدول والرسمة والتست.
  minutes: 10
  pages: [13, 127]
  topics: [variables]
  goals:
  - تفرّق بين الـ constant data والـ variables
  - 'تصنّف أي متغير: continuous، discrete، ordinal، nominal'
  - تتجنب فخ الـ pulse وعدد العيال
  status: unverified
  steps:
  - kind: explain
    page: 13
    quote: |-
      Data
      Data are the basic building blocks of statistics and refer to the individual values measured or observed. Data can be derived from a total population or a sample.
    title: يعني إيه data؟
    text: |
      الـ **data** هي ==حجر الأساس== في الإحصاء: ==القيم الفردية== اللي اتقاست أو اتلاحظت.

      وممكن تيجي من ==population كاملة== أو من sample.

      ليه نفرق المصدر؟ لأن الرموز والمعادلات بتختلف بين الـ sample والـ population. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 14
    quote: |-
      Types of data:
      Data are classified into:
      Constant data:
      These are observations which do not vary from one person to another such as number of eyes, fingers, ears... etc
      Variables:
      These are observations, which vary from one person to another or from one group of members to others and are subdivided into the following:
    title: ثابت ولا متغير؟
    text: |-
      - **Constant data**: ==مبتتغيرش== من شخص للتاني: عدد العينين، الصوابع، الودان.
      - **Variables**: بتتغير من شخص لشخص أو من group لـ group، ودي اللي الإحصاء بيشتغل عليها.
  - kind: figure
    page: 15
    quote: |-
      Quantitative variables:
      These may be continuous or discrete.
      a- Continuos quantitative variable:
      Which are obtained by measurement and its value could be integer or fractionated value.
      Examples:
      Weight, height, hemoglobin, age, income, volume of urine.
    title: شجرة المتغيرات
    svg: |-
      <svg viewBox="0 0 340 196" xmlns="http://www.w3.org/2000/svg">
        <defs><marker id="L15b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
        <rect x="120" y="4" width="100" height="26" rx="6" class="fg-ink"/>
        <text x="170" y="21" text-anchor="middle" class="t-sm t-b">Data</text>
        <path d="M150 30L70 50" class="fg-arrow" marker-end="url(#L15b)"/>
        <path d="M190 30L270 50" class="fg-arrow" marker-end="url(#L15b)"/>
