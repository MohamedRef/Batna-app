            <text x="215" y="248" text-anchor="middle" class="t-sm t-mut">reassess at 5 to 10 years</text>
          </svg>
      - kind: explain
        page: 229
        title: "الـ bisphosphonate holiday"
        quote: "Women with low or moderate risk should be considered for a bisphosphonate holiday (temporary discontinuation for up to 5years)"
        text: |
          - بعد **5 سنين oral** أو **3 سنين parenteral**: قيّم الـ fracture risk تاني.
          - **High risk**: كمّل بدوا تاني.
          - ==Low or moderate risk==: **bisphosphonate holiday** لحد **5 سنين**.

          ليه؟ لأن الاستخدام أكتر من 5 سنين مربوط بـ **atypical femoral fractures** و **osteonecrosis of the jaw (ONJ)**. والـ bisphosphonate بيفضل في العضم سنين بعد ما توقفه.
      - kind: explain
        page: 229
        title: "الـ zoledronic acid والـ 5 سنين"
        quote: "Bisphosphonate therapy for more than 5 years causes atypical femoral fractures and osteonecrosis of the jaw."
        text: |
          - **Zoledronic acid**: قيّم الـ fracture risk بعد ==3 سنين==، ولو الـ BMD stable، كمّل لحد ==6 سنين==.
          - أي bisphosphonate أكتر من 5 سنين: الكتاب بيربطه بـ ==atypical femoral fractures== و osteonecrosis of the jaw.

          التفسير المقبول (مش في الكتاب) للـ atypical fracture: عشان لما الـ turnover يقف سنين، الشروخ الصغيرة اللي العضم كان بيصلحها لوحده ما بتتصلحش، فبتتجمع لحد ما العضمة تتكسر بحركة عادية. وده اللي بيخلّي الـ holiday منطقي في اللي خطرهم مش عالي.
      - kind: reveal
        page: 229
        quote: "A drug holiday is not recommended if stopped vertebral fractures increased (BTM) and BMD decreased to the pre-treatment level within 24 months. Fracture risk reassessment is done after 5 to 10 years."
        prompt: "ليه الـ denosumab مفيهوش holiday زي الـ bisphosphonate؟"
        answer: |
          الـ bisphosphonate بيتخزن في العضم ويفضل شغال. الـ denosumab **antibody** بيخلص من الجسم، فلما توقفه الـ osteoclasts ترجع بقوة (rebound):
          - الـ **BTM** يعلى
          - الـ BMD يرجع لـ ==pre-treatment level within 24 months==
          - والـ **vertebral fractures** تزيد

          علشان كده **no drug holiday**، والـ reassessment بعد **5 to 10 years**.
      - kind: explain
        page: 230
        title: "الـ PTH: سنتين وبعدين antiresorptive"
        quote: "Treatment with teriparatide or abaloparatide is for up to 2 years to women at very high risk for fracture, such as those with severe or multiple vertebral fractures, then continue treatment after that course with an antiresorptive drug to maintain bone density gains."
        text: |
          **Teriparatide** أو **abaloparatide** لحد ==2 years== للـ **very high risk** (زي severe أو multiple vertebral fractures)، وبعدها **antiresorptive** علشان تحافظ على المكسب.
      - kind: check
        page: 230
        quote: "Treatment with teriparatide or abaloparatide is for up to 2 years to women at very high risk for fracture, such as those with severe or multiple vertebral fractures, then continue treatment after that course with an antiresorptive drug to maintain bone density gains."
        question: "A woman with multiple vertebral fractures finishes 2 years of teriparatide. What next, per the lecture?"
        options:
          - "Continue with an antiresorptive drug to keep the gains"
          - "Stop all treatment; the gains are permanent"
          - "Repeat teriparatide for another 2 years"
          - "Switch to calcitonin only"
        answer: 0
        why:
          - "صح: بعد السنتين لازم antiresorptive يحافظ على المكسب."
          - "الكتاب صريح إن المكسب محتاج antiresorptive يحافظ عليه."
          - "الكورس لحد سنتين بس."
          - "الـ calcitonin ضعيف ومش هو اللي الكتاب قاله."
