  - id: res.L03.040
    kind: card
    topic: finer
    front: Before testing a new therapy or procedure on patients, what evidence must already exist?
    back: >-
      Evidence that it can be superior to the current alternatives, and adequate data from animal studies
      and from a small number of human subjects that confirm safety and suggest effectiveness.
    src: { page: 30, quote: "(E) Ethical (cont.): If the research topic involves experimentation on human subjects, the following issues should be considered:\n  If the topic is about testing a new therapy or procedure, evidence should already be available to suggest that it can be superior to currently available alternatives.\n  Adequate data must be available from animal studies and from studies on a small number of human subjects to confirm safety and to suggest effectiveness, before subjecting patients to a new drug or procedure. The ethically acceptable practice is to step up clinical trials in successive phases, starting first with a small number of subjects, and only moving to the next phase after the successful completion of the previous phase." }
    status: unverified
  - id: res.L03.041
    kind: card
    topic: finer
    front: What is the ethically acceptable way to step up clinical trials?
    back: >-
