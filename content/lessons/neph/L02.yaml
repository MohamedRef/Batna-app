        title: "الوقاية: القواعد الذهبية"
        text: |
          ص 27 فيها **Prevention of CKD** بصورة قواعد ذهبية لكلى سليمة (من حملة World Kidney Day): افحص وظيفة الكلى، **تحكّم في السكر** بانتظام، **كُل أكل صحي وحافظ على وزنك**، و**اشرب مية كفاية**.

