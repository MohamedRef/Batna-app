  - id: neph.L11.lesson1
    title: "الكلية وهي حامل: أرقام جديدة لكل حاجة"
    hook: "كرياتينين 0.9 عند حامل مش طبيعي. الحمل بيغيّر المسطرة كلها."
    minutes: 9
    pages: [352, 354]
    topics: [physiology, aki-epi]
    goals:
      - "تعرف التغييرات الطبيعية في الكلية أثناء الحمل وليه بتحصل"
      - "تفهم ليه الـ AKI في الحمل بيزيد في أمريكا وأعلى في الدول النامية"
      - "تعرف ليه الكرياتينين الطبيعي في الحمل 0.4-0.6 وليه الـ criteria العادية مش validated"
    status: unverified
    steps:
      - kind: explain
        page: 352
        title: "الكلية بتكبر وبتشتغل أكتر"
        quote: "During the gestational period, the kidneys undergo changes: there is a 30% increase in renal volume; from 1.0 to 1.5 cm enlargement in renal bipolar diameter; and 50-80% increase in renal blood flow, especially in the first trimester. Proteinuria is normal, due to the increased glomerular filtration rate and the increased permeability of the glomerular basement membrane. In pregnant women, because of this physiological excess of protein excretion, the reference value is different from that of the remaining population; and proteinuria is considered normal up to 300 mg/24 hours."
        text: |
          الحمل بيعمل للكلية **overtime**:
          - حجم الكلية يزيد ==30%==، وطولها يزيد **1-1.5 cm**.
          - الـ **renal blood flow** يزيد **50-80%**، أغلبه في الـ first trimester.
          - الـ proteinuria لحد **300 mg/24 h** تعتبر طبيعية، لأن الـ glomerular filtration rate (GFR) عالي والـ glomerular basement membrane (GBM) بقت permeable أكتر.
      - kind: reveal
        page: 352
        quote: "In the beginning of pregnancy, women experience an increase in urination frequency, mainly due to hormonal factors, and at the end of pregnancy this frequency also increases, but for mechanical reasons. A normal pregnancy generates an average weight increase of 10 to 14 kg, corresponding to about 9"
        prompt: "الحامل بتدخل الحمام كتير في أول الحمل وفي آخره. هل السبب واحد؟"
        answer: "لأ. في الأول السبب **hormonal**، وفي الآخر السبب **mechanical** (الرحم الكبير بيضغط على المثانة). والوزن بيزيد **10-14 kg**، منهم حوالي **9 لتر مية**."
      - kind: explain
        page: 353
        title: "9 لتر مية: إيه اللي بيحصل للدم؟"
        quote: "This increase in circulating volume leads to a state ofhemodilution, with a physiological increase in cardiac output."
        text: |
          الوزن بيزيد **10-14 kg**، منهم حوالي **9 لتر مية**. الكتاب بيقول إن الـ circulating volume الزيادة دي بتعمل ==hemodilution== و **physiological increase in cardiac output**.

          التفسير المقبول (مش في الكتاب) للي يهمك في الكلى:
          - **Hemodilution:** البلازما بتزيد أكتر من كرات الدم، فالـ Hb بيوطى شوية من غير ما يكون فيه نزيف (physiological anemia).
          - **Cardiac output أعلى:** دم أكتر بيوصل للكلية، وده نفس سبب الـ **renal blood flow** الزيادة **50-80%**.

          يعني الكلية بتشتغل **overtime** عشان اتنين، وكل أرقامها بتتحرك. افتكر ده وانت بتقرا أي تحليل لحامل.
      - kind: explain
        page: 353
        title: "مشكلة كبيرة ولسه بتكبر"
        quote: "liters of water in the body. This increase in circulating volume leads to a state ofhemodilution, with a physiological increase in cardiac output. (1) ❖ Pregnancy-Related Acute Kidney Injury Acute kidney injury (AKI) during pregnancy is a public health problem and is a significant cause of maternal and fetal morbidity and mortality. Furthermore, AKI is associated with a decline in kidney function resulting in chronic kidney disease (CKD) and end-stage kidney disease (ESKD), increased risk for adverse cardiovascular events, higher health care utilization, and longer hospital stays.(2,3) Therefore, early recognition and treatment for AKI in pregnancy are of paramount importance and a potentially life-saving measure. Although the incidence in pregnancy-related AKI is low in developed countries due to improved prenatal care, the rates have increased almost three-fold in the recent decade in the United States possibly due to older maternal age with more comorbidities, higher detection rates of AKI, increase in the incidence of hypertensive disorders of pregnancy, and increase in obesity rates.(4,5) A recent study identified 42,190,790 pregnancy-related hospitalizations in the United States in women aged 15–49 years old and showed an increase in the rate of AKI during pregnancy-related hospitalizations from 0.04% in 2006 to 0.12% in 2015.5 Similarly, Mehrabadi et al (6) reported an increase in the incidence of AKI in pregnancy from 2.4 per 10,000 deliveries in 1999–2001 to 6.3 per 10,000 deliveries in 2010–2011. In contrast, although developing countries report an overall reduction in pregnancy-related AKI in the recent years, pregnancy-related AKI rates continue to remain higher than in the developed countries due to lack of antenatal care and higher frequency of septic abortions. For example, in India, there was a decline in pregnancy-related AKI from 15% in the 1980s to 1.5% in the 2010s among hospitalized women.(7) Similarly, a study from China showed a decline in the incidence of pregnancy-related AKI ranging from 0.2% to 1.8%.(8)"
        text: |
          الـ acute kidney injury (AKI) في الحمل بيرفع وفيات الأم والجنين، وبيسيب وراه **chronic kidney disease (CKD)** و **end-stage kidney disease (ESKD)** وأمراض قلب.

          في أمريكا زاد تقريبًا **3 أضعاف** (سن الأم أكبر، أمراض أكتر، hypertensive disorders، سمنة). وفي الدول النامية لسه أعلى بسبب ==قلة الـ antenatal care== و **الـ septic abortion**.
      - kind: explain
        page: 353
        title: "ليه زاد 3 أضعاف في أمريكا؟"
        quote: "Although the incidence in pregnancy-related AKI is low in developed countries due to improved prenatal care, the rates have increased almost three-fold in the recent decade in the United States possibly due to older maternal age with more comorbidities, higher detection rates of AKI, increase in the incidence of hypertensive disorders of pregnancy, and increase in obesity rates."
        text: |
          الكتاب بيدّي أربع أسباب. التفسير المقبول (مش في الكتاب) لكل واحد:

          - **Older maternal age with more comorbidities:** الأم الأكبر غالبًا جاية ومعاها ضغط أو سكر أو CKD، فالكلية داخلة الحمل تعبانة.
          - **Higher detection rates:** جزء من الزيادة إننا **بقينا بنقيس** أكتر، مش بس إن المرض زاد.
          - ==Hypertensive disorders of pregnancy==: الـ preeclampsia من أهم أسباب الـ AKI في آخر الحمل (هتشوفها في درس جاي).
          - **Obesity:** بتزوّد الضغط والسكر والـ preeclampsia.

          الأرقام: من **0.04%** (2006) لـ **0.12%** (2015) من الـ hospitalizations، ومن **2.4** لـ **6.3** لكل 10,000 ولادة.
      - kind: check
        page: 353
        quote: "In contrast, although developing countries report an overall reduction in pregnancy-related AKI in the recent years, pregnancy-related AKI rates continue to remain higher than in the developed countries due to lack of antenatal care and higher frequency of septic abortions."
        question: "Why do developing countries still have higher pregnancy-related AKI rates than developed countries?"
        options:
          - "Lack of antenatal care and more septic abortions"
          - "Older maternal age and obesity"
          - "Higher detection rates of AKI"
          - "More use of NSAIDs after delivery"
        answer: 0
        why:
          - "صح: ده سبب الكتاب بالحرف (ص 353)."
          - "دي أسباب الزيادة في أمريكا، مش الدول النامية."
          - "ده كمان من أسباب أمريكا."
          - "الـ NSAIDs سبب postpartum، مش ده تفسير الفرق بين الدول."
      - kind: explain
        page: 354
        title: "الفرق بين الأعراق: سببه إيه؟"
        quote: "These racial differences in pregnancy-related AKI are significant, and are likely attributed to the differential access to obstetric care and level of education."
        text: |
          في أمريكا، الستات السود عندهم احتمال AKI أعلى **52%**، والـ Native American أعلى **45%**، مقارنة بالبيض.

          الكتاب بيقول السبب غالبًا ==differential access to obstetric care== و **level of education**. يعني نفس الفكرة اللي في الدول النامية: اللي مش بيتابع حمله، المشكلة بتتمسك متأخر.

          ولذلك الكتاب بيختم إن **early recognition and treatment** هو ==potentially life-saving measure==.
      - kind: explain
        page: 354
        title: "ليه الكرياتينين بيقل؟"
        quote: "While AKI in the general population is well defined by the RIFLE (Risk, Injury, Failure, Loss and End stage) criteria, the KDIGO (Kidney Disease Improving Outcomes) guidelines and the AKI Network (AKIN) criteria, pregnancy-related AKI is difficult to determine due to non-validation of these AKI diagnostic criteria in the pregnant population.(9) Pregnancy results in an increase in blood volume, a decrease in systemic vascular resistance, and an increase in cardiac output. In the setting of hyper filtration, intra renal vasodilation and an increase in effective plasma flow, glomerular filtration rate increases by 40–60%, resulting in a physiological reduction in serum creatinine.(10) The normal level of serum creatinine in pregnancy is lower than the baseline usually ranging between 0.4 and 0.6 mg/dL range. Due to the lower baseline creatinine in pregnancy, the detection of AKI is further confounded.(11) Often, a serum creatinine value is unavailable prior to pregnancy. This, along with limited accuracy of the current AKI diagnostic criteria in the general population, makes the early and accurate diagnosis of AKI in pregnancy challenging. Since routine monitoring of kidney function is not a standard of care in pregnant women, a comprehensive assessment of AKI, including differentials, is warranted."
        text: |
          الدم بيزيد، والـ systemic vascular resistance بتقل، والـ cardiac output يعلى. جوه الكلية فيه **vasodilation** فالـ ==GFR== يزيد **40-60%**.

          النتيجة: الكرياتينين الطبيعي في الحمل ==0.4-0.6 mg/dL== بس. يعني رقم "طبيعي" برّه الحمل زي 0.9 ممكن يبقى معناه إن الكلية فقدت جزء كبير من شغلها.
      - kind: figure
        page: 354
