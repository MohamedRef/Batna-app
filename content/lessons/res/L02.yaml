      - kind: explain
        page: 20
        quote: "7. Special subgroups records\n8. Morbidity Surveys\n9. Record Linkage: To link records that belong to the same individual from different sources"
        title: "الـ record linkage بمثال الدكتورة"
        text: |
          الـ ==record linkage==: تجمع السجلات اللي بتخص **نفس الشخص** من أكتر من مصدر.

          - مثال الدكتورة: سجله في **المستشفى** + **المدرسة** + **الشغل**.
          - النتيجة: صورة أشمل عن صحته من أي سجل لوحده.
      - kind: explain
        page: 22
        quote: "3. Rates: the relative frequency of cases in a population during a specified period of time. e.g., Morbidity-Rates, Mortality-Rates"
        title: "الـ count للتخطيط، والـ rate للمقارنة"
        text: |
          - **Count**: كويس عشان تقدّر الموارد (كام قرص chloroquine تطلب السنة الجاية).
          - بس ==مش بيقارن== بين مكانين حجمهم مختلف: 500 حالة في محافظة كبيرة ممكن تكون أقل من 250 في محافظة صغيرة.
          - **Rate**: بسط + مقام (الـ population) + ==فترة زمنية محددة==. الدكتورة أكدت على الزمن: من غيره مايبقاش rate.
      - kind: check
        page: 42
        quote: "P = I * D\n80 = 20 * D\nD = 80/20 = 4 years"
        question: "Incidence 20 per 10,000,000/year, mortality 4 per 10,000,000/year, prevalence 80 per 10,000,000. Average duration?"
        options: ["4 years", "20 years", "5 years", "1 year"]
        answer: 0
        why:
          - "صح: D = P ÷ I = 80 ÷ 20 = 4 سنين. الدكتورة قرت الـ prevalence 80 من السلايد."
          - "80 ÷ 4: قسمت على الـ mortality، وده مش في المعادلة."
          - "20 ÷ 4: الـ incidence على الـ mortality، مالهاش معنى."
          - "مفيش قسمة من الأرقام دي تدّي سنة."
      - kind: explain
        page: 58
        quote: "Example: There were 6000 deaths (1250 leukemia, 1750 stroke, 250 pneumonia, 250 Hodgkin's disease, and 2500 acute myocardial infarction) in Cook County, which had a population of 2.5 million in 1991. The cause-specific mortality rate for acute myocardial infarction is: (2500/2,500,000) x 1000 = 1 per 1000"
        title: "حاسبات جديدة للوفيات"
        text: |
          في **Calculators ← Research** بقى فيه:

          - **Disease duration (D = P / I)**: مدة المرض من الـ prevalence والـ incidence.
          - **Death rate**: crude أو cause-specific أو age-specific أو sex-specific، ×1000 أو ×100,000.
          - **Perinatal mortality rate**: (fetal deaths ≥28 weeks + first-week deaths) ÷ (fetal deaths + live births) × 1000.
          - **Maternal mortality ratio**: maternal deaths ÷ live births × 100,000.

          جرّب بمثال السلايد: 2500 وفاة MI في 2.5 مليون = **1 per 1000**.
      - kind: explain
        page: 23
        quote: "Rate:\n  Measures the occurrence of an event or disease in a given population during a given period (one Year). (Birth rate, growth rate, accident rate)\n  Usually expressed per 100 or per 1000 population.\n  It has a time dimension, whereas a PROPORTION does not."
        title: "نقط زيادة من ملاحظات الفيديو"
        text: |
          - **Coverage مش impact**: 95% أخدوا التطعيم دي ==coverage==؛ الـ impact هو الحالات قلّت ولا لأ.
          - الـ epidemiology مش للأوبئة بس: معدية، مزمنة، و**health behaviours** زي التدخين.
          - الـ attack rate والـ prevalence حسابيًا ==proportions==؛ الـ true rate مقامه person-time. في الامتحان استخدم أسماء المحاضرة.
          - **P = I × D** تقريب: محتاج steady state ونفس الوحدات، وأدق لما المرض نادر.
          - الـ **under-five mortality rate** مقامه live births، أما الـ age-specific فمقامه سكان الفئة نفسها.
