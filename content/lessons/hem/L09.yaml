        title: "الطحال: صغير أو بيكبر أو بيضمر"
        quote: "Splenomegaly is present in about 10-20% of ET patients at diagnosis and it is rarely more than mild. Progressive enlargement of the spleen during the course of ET should raise suspicion of evolving myelofibrosis. It has been suggested that over time, some patients with ET develop splenic atrophy secondary to silent microinfarcts in the splenic microcirculation."
        text: |
          - **Splenomegaly** في **10–20%** وقت التشخيص، ونادرًا أكتر من **mild**.
          - لو الطحال ==بيكبر مع الوقت== ← شك في **evolving myelofibrosis**.
          - بعض المرضى الطحال **بيضمر** من **silent microinfarcts** في الـ splenic microcirculation، بس الـ **frank hyposplenism** ومضاعفاته نادرة.

          ليه الطحال اللي بيكبر علامة خطر؟ التفسير المقبول (مش في الكتاب): لما النخاع يتليّف، الطحال بيرجع يشتغل **مصنع دم** زي أيام الجنين (extramedullary haemopoiesis)، فبيكبر. يعني الطحال بيكبر **لأن** النخاع بيفشل.
