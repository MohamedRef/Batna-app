        text: |
          1. **استبعد الـ pseudohyperkalemia** الأول.
          2. Dietary counseling، و **ابعد عن salt substitutes** (فيها KCl).
          3. وقّف الأدوية اللي بتمنع إفراز الـ K، واسأل عن **non-steroidal anti-inflammatory drugs (NSAIDs) والأعشاب**.
