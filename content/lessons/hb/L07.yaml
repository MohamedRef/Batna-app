        why: "HBsAg+ أو exposed مع **high-risk IS** (B-cell depleting زي rituximab، أو SCT) → prophylaxis. exposed مع moderate-risk → monitor (والرسمة بتسمح كمان بـ prophylaxis). naïve → vaccinate."
