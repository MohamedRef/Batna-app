  - id: geri.L07.lesson4
    title: "المزاج والـ frailty: GDS وسلّم Rockwood"
    hook: "الاكتئاب في الكبير بيستخبى في الجسم، والـ frailty ليها سلّم من 1 لـ 9."
    minutes: 9
    pages: [118, 122]
    topics: [psych, frailty]
    goals:
      - "تعرف ليه الاكتئاب بيتفوّت في الكبير وعوامل خطر الانتحار"
      - "تحسب الـ GDS-15"
      - "تقرأ الـ Clinical Frailty Scale"
    status: unverified
    steps:
      - kind: explain
        page: 118
        title: "الاكتئاب المستخبي"
        quote: "Depression in older people has a prevalence of 5-10 per cent in those aged over 65, but is frequently under-recognised. It is associated with higher morbidity and poorer outcomes from physical illness. Older people under-report symptoms of depression, and may attribute them to the effects of ageing. Somatic symptoms are more common than in younger people with depression."
        text: |
          - ==5–10%== من اللي فوق 65، ومع ذلك **under-recognised**.
          - بيزوّد الـ morbidity ويسوّء نتايج الأمراض الجسدية.
          - الكبير **بيقلّل** من الأعراض وبيقول «ده من السن».
          - ==Somatic symptoms== أكتر من الشباب: «جسمي كله بيوجعني» بدل «أنا حزين».

          ليه بيتفوّت؟ الكتاب بيقول الكبير **بيقلّل** الأعراض وبينسبها للسن، والأعراض **الجسدية** أكتر. التفسير المقبول (مش في الكتاب): جيل كامل اتربى إن «الزعل» مش مرض، فبيشتكي من جسمه، والدكتور بيدوّر على سبب عضوي وما بيسألش عن المزاج.

          وليه مهم؟ لأن الكتاب بيقول إنه بيزوّد الـ **morbidity** ويسوّء نتايج الأمراض الجسدية: المكتئب ما بياكلش، وما بيتحركش، وما بياخدش أدويته.
      - kind: aside
        tone: trap
        page: 118
        quote: "Older adults with depression are at higher risk of completed suicide than younger people, so specific enquiry into suicidal thoughts should always be made. Risk factors for suicide in older people include:\n  Older age, male gender.\n  Social isolation and or bereavement.\n  History of attempts and or evidence of planning."
        text: "الكبير المكتئب **أعلى** في الـ **completed suicide** من الشاب، فلازم تسأل عن الأفكار الانتحارية **دايمًا**. السؤال ما بيزرعش الفكرة."
      - kind: sort
        page: 118
        quote: "Older adults with depression are at higher risk of completed suicide than younger people, so specific enquiry into suicidal thoughts should always be made. Risk factors for suicide in older people include:\n  Older age, male gender.\n  Social isolation and or bereavement.\n  History of attempts and or evidence of planning."
        prompt: "عامل خطر للانتحار في الكبير حسب الكتاب؟"
        bins: ["Risk factor", "Not listed"]
        cards:
          - { text: "Male gender", bin: 0 }
          - { text: "Bereavement", bin: 0 }
          - { text: "Previous attempt or planning", bin: 0 }
          - { text: "Chronic painful illness", bin: 0 }
          - { text: "Alcohol use", bin: 0 }
          - { text: "Female gender", bin: 1 }
          - { text: "Living with a large family", bin: 1 }
        why: "الكتاب: older age و ==male gender==، social isolation أو bereavement، attempts أو planning، chronic painful illness أو disability، drug أو alcohol use."
      - kind: explain
        page: 119
        quote: "Chronic painful illness or disability.\nDrug or alcohol use"
        title: "ليه دول بالذات خطر انتحار؟"
        text: |
          قايمة الكتاب (ص 118 لـ 119): **older age، male gender**، **social isolation أو bereavement**، **history of attempts أو evidence of planning**، **chronic painful illness أو disability**، و **drug أو alcohol use**.

          التفسير المقبول (مش في الكتاب) للمنطق:
          - **الرجالة الكبار** بيطلبوا مساعدة أقل، ومحاولاتهم بتبقى أخطر، فهي «completed» أكتر.
          - **العزلة** و **الفقد** (موت شريك الحياة): مفيش حد يلاحظ ولا حد يعيش عشانه.
          - **محاولة قبل كده أو خطة**: أقوى علامة إن الفكرة اتحولت لفعل.
          - **الألم المزمن والإعاقة**: إحساس إن الحال مش هيتحسن.
          - **الكحول والمخدرات**: بتشيل الفرامل.

          عشان كده الكتاب بيقول **specific enquiry into suicidal thoughts should always be made**.
      - kind: explain
        page: 119
        title: "GDS-15: الحساب"
        quote: "Geriatric Depression Scale (Short Form)\nInstructions: Choose the best answer for how you felt over the past week. Note: when asking the patient to complete the form, provide the self-rated form (included on the following page).\n| No. | Question | Answer indicating depression |\n|---|---|---|\n| 1 | Are you basically satisfied with your life? | NO |\n| 2 | Have you dropped many of your activities and interests? | YES |\n| 3 | Do you feel that your life is empty? | YES |\n| 4 | Do you often get bored? | YES |\n| 5 | Are you in good spirits most of the time? | NO |\n| 6 | Are you afraid that something bad is going to happen to you? | YES |\n| 7 | Do you feel happy most of the time? | NO |\n| 8 | Do you often feel helpless? | YES |\n| 9 | Do you prefer to stay at home, rather than going out and doing new things? | YES |\n| 10 | Do you feel you have more problems with memory than most people? | YES |\n| 11 | Do you think it is wonderful to be alive? | NO |\n| 12 | Do you feel pretty worthless the way you are now? | YES |\n| 13 | Do you feel full of energy? | NO |\n| 14 | Do you feel that your situation is hopeless? | YES |\n| 15 | Do you think that most people are better off than you are? | YES |\n(Sheikh & Yesavage, 1986)\nScoring: Answers indicating depression are in bold and italicized; score one point for each one selected. A score of 0 to 5 is normal. A score greater than 5 suggests depression."
        text: |
          **15** سؤال yes/no عن **الأسبوع اللي فات**. كل إجابة «مكتئبة» = نقطة.

          - **0–5** ← normal
          - ==>5== ← suggests depression

          خد بالك: الأسئلة الإيجابية («satisfied with your life؟»، «wonderful to be alive؟»، «full of energy؟») النقطة فيها على **No**.

          ليه yes/no عن **الأسبوع اللي فات**؟ التفسير المقبول (مش في الكتاب): الإجابة بآه أو لأ سهلة على كبير تعبان أو عنده مشكلة بسيطة في الذاكرة، والأسبوع فترة قريبة يفتكرها. وكمان الـ GDS **مافيهاش أسئلة جسدية** (نوم، شهية، طاقة جسمانية بشكل أساسي)، عشان أعراض الأمراض التانية عند الكبير ما تتحسبش اكتئاب غلط.
