items:
  # ---------- p214-215: definition, bones liable to fracture ----------
  - id: dm.L17.001
    kind: card
    topic: definition
    front: What imbalance causes osteoporosis?
    back: More bone is resorbed than deposited, so bone density is progressively lost and bone tissue thins.
    src: { page: 214, quote: "The bone disease osteoporosis is caused by more bone cells being resorbed than being deposited." }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.002
    kind: card
    topic: definition
    front: Why do osteoporotic bones fracture easily?
    back: They are more porous after progressive loss of density and thinning of bone tissue.
    src: { page: 214, quote: "Osteoporotic bones are more porous and therefore more vulnerable to fracture." }
    status: unverified
  - id: dm.L17.003
    kind: enumerate
    topic: definition
    prompt: Which bones are liable to fracture in osteoporosis (the lecture's figure)?
    points:
      - Vertebral bodies
      - Distal radius
      - Proximal femur
    pass: 3
    src: { page: 215, quote: "Bones liable to fracture in osteoporosis Vertebral bodies, distal radius, proximal femur." }
    status: unverified
    tags: [high-yield]
  # ---------- p215-216: types ----------
  - id: dm.L17.004
    kind: table
    topic: types
    title: Type 1 vs type 2 osteoporosis
    columns: [Feature, Type 1 (postmenopausal), Type 2 (senile)]
    rows:
      - [Women to men, "6 : 1", "2 : 1"]
      - [Bone mainly affected, Trabecular, Trabecular and cortical]
      - [Typical fractures, "Vertebral crush, Colles'", Femoral and vertebral]
      - [Age, After menopause, Mainly over 70 years]
      - [Probable cause, Postmenopausal endocrine changes, Age-related change in vitamin D synthesis]
    blanks: [[0, 1], [0, 2], [1, 1], [2, 1], [2, 2], [4, 2]]
    src: { page: 215, quote: "Affects six times as many women as men, and is mainly responsible for the increased risk of osteoporotic fractures." }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.005
    kind: cloze
    topic: types
    text: "Type 1 osteoporosis affects {{c1::six}} times as many women as men; type 2 affects {{c2::twice}} as many women as men."
    src: { page: 215, quote: "Affects six times as many women as men" }
    status: unverified
    tags: [numbers]
  - id: dm.L17.006
    kind: card
    topic: types
    front: Why does type 1 osteoporosis cause vertebral crush and Colles' fractures?
    back: It primarily affects trabecular bone.
    src: { page: 215, quote: "Because it primarily affects trabecular bone, type 1 osteoporosis is mainly responsible for vertebral crush fractures and Colles' fractures." }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.007
    kind: card
    topic: types
    front: Describe a Colles' fracture.
    back: A break across the end of both lower-arm bones, with the hand displaced backward and outward relative to the wrist.
    src: { page: 215, quote: "a Colles' fracture results in a backward and outward position of the hand in relation to the wrist." }
    status: unverified
  - id: dm.L17.008
    kind: cloze
    topic: types
    text: "Type 2 osteoporosis, also called {{c1::involutional or senile}} osteoporosis, is gradual age-related bone loss mainly in persons over {{c2::70}} years."
    src: { page: 215, quote: "Also known as involutional or senile osteoporosis, it occurs mainly in persons > 70 years" }
    status: unverified
    tags: [numbers]
  - id: dm.L17.009
    kind: card
    topic: types
    front: Why does type 2 osteoporosis cause femoral fractures as well as vertebral ones?
    back: Density falls in both trabecular and cortical bone.
    src: { page: 216, quote: "Because density decreases in both trabecular and cortical bone, type 2 osteoporosis results in femoral and vertebral fractures." }
    status: unverified
  - id: dm.L17.010
    kind: cloze
    topic: types
    text: "{{c1::Postmenopausal endocrinologic}} changes probably cause type 1 osteoporosis; age-related changes in {{c2::vitamin D synthesis}} are thought to cause type 2."
    src: { page: 216, quote: "age-related changes in vitamin D synthesis are thought to lead to type 2 osteoporosis." }
    status: unverified
  - id: dm.L17.011
    kind: card
    topic: types
    front: What is the biphasic pattern of bone loss in women?
    back: Type 1 and type 2 osteoporosis appearing at the same time.
    src: { page: 216, quote: "In women, type 1 and type 2 may appear simultaneously, resulting in a biphasic pattern of bone loss." }
    status: unverified
  - id: dm.L17.012
    kind: mcq
    topic: types
    stem: A 58-year-old woman, 6 years after menopause, falls on an outstretched hand and breaks her distal radius. Which description fits her osteoporosis?
    options:
      - "Type 1: mainly trabecular bone, linked to postmenopausal endocrine change"
      - "Type 2: cortical and trabecular loss from age-related vitamin D change"
      - "Secondary osteoporosis, which is most cases in postmenopausal women"
      - "Type 2, which affects six times as many women as men"
      - "Osteomalacia, because a fracture is present"
    answer: 0
    why:
      - "Correct: Colles' and vertebral crush fractures come from type 1, a trabecular disease of the postmenopausal years (p215-216)."
      - Type 2 is mainly over 70 and causes femoral and vertebral fractures.
      - Secondary causes are under 5% of cases in postmenopausal women (p216).
      - Six to one is type 1; type 2 is two to one.
      - Fractures occur in all metabolic bone diseases; nothing here points to osteomalacia.
    src: { page: 215, quote: "Because it primarily affects trabecular bone, type 1 osteoporosis is mainly responsible for vertebral crush fractures and Colles' fractures." }
    status: unverified
  # ---------- p216: peak bone mass ----------
  - id: dm.L17.013
