      - kind: table
        page: 188
        quote: "Collections of monoclonal plasma cells either in bone (solitary osseous plasmacytoma) or in soft tissue (extramedullary plasmacytoma)"
        title: "الـ plasmacytoma: نوعين"
        columns: ["", "Solitary bone", "Extramedullary"]
        rows:
