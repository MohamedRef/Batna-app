    src: { page: 171, quote: "Some expert advocate venesection when PCV>0.60 and others venesection for symptoms (hemoptysis, marked fatigue, exercise intolerance)" }
    status: unverified
  - id: hem.L10.102
    kind: card
    topic: secondary
    front: How do high-affinity hemoglobins cause polycythemia, and what is pathognomonic?
    back: They release less O2 at a given pO2, causing tissue hypoxia and EPO-driven polycythemia. A left-shifted O2 dissociation curve is pathognomonic.
    src: { page: 171, quote: "Pathognomonic anomaly is left shift of oxygen dissociation curve." }
    status: unverified
    tags: [high-yield]
  - id: hem.L10.103
    kind: card
    topic: secondary
    front: Where are high-affinity Hb mutations clustered, and how are they inherited?
    back: In globin regions that regulate the tense (T) to relaxed (R) transition; over 40 variants, mostly β-globin, all dominantly inherited.
    src: { page: 171, quote: "Over 40 Hb variants detected, most mutation in -globin, all are dominantly inherited." }
    status: unverified
  - id: hem.L10.104
    kind: enumerate
