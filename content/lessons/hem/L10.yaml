        page: 167
        title: "Anagrelide: صفائح بس"
        quote: "Selective effect on megakaryocytic maturation result in reduced platelet production.\nNo effect on other lineage.\nNo mutagenic effect.\nSide effect, headache, arrythmia, fluid retention, dizziness. Contraindicated in cardiac patient and in pregnancy."
        text: |
          - **Oral imidazoquinazoline** بـ **anti-cyclic phosphodiesterase activity** (ص 166).
          - ==Selective== على نضج الـ **megakaryocytes**، فالصفائح تقل، و **no effect on other lineage**.
          - **No mutagenic effect**.
          - أعراضه: **headache، arrhythmia، fluid retention، dizziness**. ==Contraindicated in cardiac patient and in pregnancy==.

          ليه selective مهمة؟ لأنه بينفع لما المشكلة **صفائح** والباقي ماشي، من غير ما ينزّل الـ WBC. وليه القلب؟ التفسير المقبول (مش في الكتاب): الـ phosphodiesterase inhibition في القلب والأوعية بيقوّي الضربات ويوسّع الأوعية، فييجي الـ arrhythmia والصداع والـ fluid retention، وده خطر على قلب تعبان أصلًا.
