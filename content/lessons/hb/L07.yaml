            <text x="275" y="258" text-anchor="middle" class="t-sm">Encephalopathy</text>
            <text x="275" y="274" text-anchor="middle" class="t-sm">or ascites</text>
            <path d="M165 284v24" class="fg-arrow-bad" marker-end="url(#L07h)"/>
            <rect x="40" y="310" width="250" height="44" rx="8" class="fg-acc"/>
            <text x="165" y="328" text-anchor="middle" class="t-sm t-b">Antivirals: entecavir, tenofovir</text>
            <text x="165" y="345" text-anchor="middle" class="t-sm">or double-dose lamivudine</text>
          </svg>
      - kind: order
        page: 114
        quote: "Classic: 3 stages: 1- Prodromal 3-4 days. - Profound malaise, fever, anorexia nausea. - Vomiting, abdominal pain. 2- Icteric 1-4 weeks."
        prompt: "رتّب اللي بيحصل في الـ classic acute hepatitis B:"
        steps:
          - "Prodrome (3–4 days): malaise, fever, anorexia, nausea"
          - "Change of urine colour"
          - "Jaundice and itching (icteric phase, 1–4 weeks)"
          - "Convalescence"
        why: "الكتاب: الـ prodromal **3–4 days**، وبعدين الـ icteric **1–4 weeks** وفيه **change of urine color followed by jaundice and itching**، وآخر حاجة الـ convalescent."
      - kind: aside
        tone: trap
        page: 114
        quote: "Patient feels generally better and appetite returns. - Tender hepatomegaly."
        text: |
          في الـ **icteric phase** العيان بيبقى feels generally better و appetite returns، مع إنه أصفر ومعاه **tender hepatomegaly**.

          يعني الصفرا هنا مش معناها إن الحالة بتسوء. لو السؤال وصف إن الصفرا ظهرت والعيان felt better، ده الطبيعي في الكتاب.
      - kind: reveal
        page: 114
        quote: "During the prodromal period, a serum sickness-like syndrome manifesting as fever, skin rash, and arthralgia may develop."
        prompt: "في الـ prodrome ممكن يطلع **fever، skin rash و arthralgia**. الكتاب بيسميه إيه، وليه بيحصل؟"
        answer: |
          الكتاب بيسميه ==serum sickness–like syndrome==.

          التفسير المقبول: الجسم بيعمل antibodies ضد الـ HBsAg وهو لسه كتير في الدم، فيتكوّن **immune complexes** تترسب في الجلد والمفاصل، زي الـ serum sickness بالظبط.
      - kind: explain
        page: 115
        quote: "peak levels 1-2 days before or after onset of jaundice. Levels > x 10 ULN. - Useful in early diagnosis and detection of anicteric cases."
        title: "التشخيص بالمعمل"
        text: |
          - ==SGOT, SGPT== (AST, ALT): بيوصلوا الـ peak قبل أو بعد بداية الـ jaundice بـ 1–2 days، وبيعدّوا 10 × ULN.
          - **Early diagnosis**: علشان بيطلعوا بدري، هما اللي بيكشفوا الـ **anicteric cases** اللي مفيهاش صفرا تلفت النظر.
          - **Bilirubin & ALP**: عادة عاليين.
          - ==PT==: prolonged.

          ركّز على الـ PT بالذات: ده اللي بيقيس قد إيه الكبد لسه بيصنّع، وهو نفسه اللي هيدخل في تعريف الـ severe (الـ INR > 1.5).

          والخبر الحلو: أقل من 1% من الـ acute hepatitis B بيعملوا **acute liver failure**.
      - kind: explain
        page: 115
        quote: "Antiviral treatment (lamivudine in double dose, entecavir, Tenofovir) in severe acute HB."
        title: "العلاج: غالبًا مش هتعمل حاجة"
        text: |
          - **Symptomatic & supportive** هو الأساس.
          - **Antiviral treatment** بس في الـ ==severe acute HB==: **lamivudine in double dose**، أو **entecavir**، أو **tenofovir**.

          طب إمتى نسميها severe؟ عندنا 3 علامات.
      - kind: mnemonic
        page: 115
        quote: "1. Coagulopathy (INR > 1.5). 2. Protracted course (persistent symptoms or marked jaundice for > 4 weeks). 3. Hepatic encephalopathy or ascites."
        word: "CPE"
        parts:
          - { key: "C", text: "Coagulopathy: INR > 1.5" }
          - { key: "P", text: "Protracted course: persistent symptoms or marked jaundice for > 4 weeks" }
          - { key: "E", text: "Encephalopathy (hepatic) or ascites" }
        hook: |
          **CPE** زي الـ cytopathic effect في الميكروبيولوجي: لو الفيروس عمل **CPE** في الكبد، يبقى وقت الـ antivirals.
      - kind: case
        page: 115
        quote: "Antiviral treatment (lamivudine in double dose, entecavir, Tenofovir) in severe acute HB. Characteristics of severe acute hepatitis B: 1. Coagulopathy (INR > 1.5)."
        stem: "A 29-year-old man has acute hepatitis B. Week 2: ALT 1,600 IU/L, bilirubin 6 mg/dL, INR 1.2, alert, no ascites."
        steps:
          - question: "What is the treatment now?"
            options:
              - "Symptomatic and supportive care"
