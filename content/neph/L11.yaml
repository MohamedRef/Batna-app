items:
  # ---------- p352-353: physiology ----------
  - id: neph.L11.001
    kind: cloze
    topic: physiology
    text: "In pregnancy renal volume rises by {{c1::30%}}, the bipolar diameter by {{c2::1.0-1.5 cm}}, and renal blood flow by {{c3::50-80%}} (mostly in the first trimester)."
    src: { page: 352, quote: "there is a 30% increase in renal volume; from 1.0 to 1.5 cm enlargement in renal bipolar diameter; and 50-80% increase in renal blood flow" }
    status: unverified
    tags: [numbers]
  - id: neph.L11.002
    kind: card
    topic: physiology
    front: Up to what level is proteinuria considered normal in pregnancy, and why is it higher than outside pregnancy?
    back: Up to 300 mg/24 h, because GFR rises and the glomerular basement membrane becomes more permeable.
    src: { page: 352, quote: "proteinuria is considered normal up to 300 mg/24 hours" }
    status: unverified
    tags: [high-yield, numbers]
  - id: neph.L11.003
    kind: card
    topic: physiology
    front: Why does urinary frequency rise early in pregnancy and again at the end?
    back: Early it is mainly hormonal; at the end it is mechanical.
    src: { page: 352, quote: "mainly due to hormonal factors, and at the end of pregnancy this frequency also increases, but for mechanical reasons" }
    status: unverified
  - id: neph.L11.004
    kind: cloze
    topic: physiology
    text: "A normal pregnancy adds {{c1::10-14 kg}} of weight, about {{c2::9 liters}} of it water, giving hemodilution and a physiological rise in cardiac output."
    src: { page: 352, quote: "A normal pregnancy generates an average weight increase of 10 to 14 kg, corresponding to about 9" }
    status: unverified
    tags: [numbers]
  # ---------- p353-354: burden and definition of AKI ----------
  - id: neph.L11.005
    kind: enumerate
    topic: aki-epi
    prompt: Mention the long-term consequences linked to pregnancy-related AKI.
    points:
      - Decline in kidney function to CKD and ESKD
      - Higher risk of adverse cardiovascular events
      - Higher health care utilization
      - Longer hospital stays
    pass: 3
    src: { page: 353, quote: "AKI is associated with a decline in kidney function resulting in chronic kidney disease (CKD) and end-stage kidney disease (ESKD)" }
    status: unverified
  - id: neph.L11.006
    kind: enumerate
    topic: aki-epi
    prompt: Why has pregnancy-related AKI risen almost three-fold in the US in the last decade?
    points:
      - Older maternal age with more comorbidities
      - Higher detection rates of AKI
      - More hypertensive disorders of pregnancy
      - Rising obesity rates
    pass: 3
    src: { page: 353, quote: "possibly due to older maternal age with more comorbidities, higher detection rates of AKI, increase in the incidence of hypertensive disorders of pregnancy" }
    status: unverified
  - id: neph.L11.007
    kind: cloze
    topic: aki-epi
    text: "In US pregnancy-related hospitalizations, the AKI rate rose from {{c1::0.04%}} in 2006 to {{c2::0.12%}} in 2015."
    src: { page: 353, quote: "an increase in the rate of AKI during pregnancy-related hospitalizations from 0.04% in 2006 to 0.12% in 2015" }
    status: unverified
    tags: [numbers]
  - id: neph.L11.008
    kind: card
    topic: aki-epi
    front: Why do developing countries still have higher pregnancy-related AKI rates than developed ones?
    back: Lack of antenatal care and more septic abortions.
    src: { page: 353, quote: "continue to remain higher than in the developed countries due to lack of antenatal care and higher frequency of septic abortions" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.009
    kind: cloze
    topic: aki-epi
    text: "In India, pregnancy-related AKI among hospitalized women fell from {{c1::15%}} in the 1980s to {{c2::1.5%}} in the 2010s."
    src: { page: 353, quote: "there was a decline in pregnancy-related AKI from 15% in the 1980s to 1.5% in the 2010s among hospitalized women" }
    status: unverified
    tags: [numbers]
  - id: neph.L11.010
    kind: card
    topic: aki-epi
    front: Which US groups have a higher likelihood of AKI in pregnancy than white women, and why?
    back: Black women (52% higher) and Native American women (45% higher), likely from unequal access to obstetric care and education.
    src: { page: 354, quote: "black women having a 52% higher likelihood of AKI during pregnancy and Native American women having a 45% higher likelihood" }
    status: unverified
  - id: neph.L11.011
    kind: card
    topic: aki-epi
    front: Why are RIFLE, AKIN and KDIGO hard to apply to pregnancy-related AKI?
    back: They have not been validated in pregnant women, and the physiological fall in creatinine and the frequent lack of a pre-pregnancy value confound them.
    src: { page: 354, quote: "pregnancy-related AKI is difficult to determine due to non-validation of these AKI diagnostic criteria in the pregnant population" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.012
    kind: cloze
    topic: aki-epi
    text: "In pregnancy GFR rises by {{c1::40-60%}}, so the normal serum creatinine is about {{c2::0.4-0.6 mg/dL}}."
    src: { page: 354, quote: "glomerular filtration rate increases by 40-60%, resulting in a physiological reduction in serum creatinine" }
    status: unverified
    tags: [high-yield, numbers]
  - id: neph.L11.013
    kind: order
    topic: aki-epi
    prompt: Order the chain that lowers serum creatinine in normal pregnancy.
    steps:
      - Blood volume and cardiac output rise, systemic vascular resistance falls
      - Intrarenal vasodilation increases effective renal plasma flow
      - Hyperfiltration raises GFR by 40-60%
      - Serum creatinine falls to about 0.4-0.6 mg/dL
    src: { page: 354, quote: "Pregnancy results in an increase in blood volume, a decrease in systemic vascular resistance, and an increase in cardiac output." }
    status: unverified
  - id: neph.L11.014
    kind: mcq
    topic: aki-epi
    stem: "A 29-year-old at 26 weeks has a serum creatinine of 0.9 mg/dL. She has no earlier value. How should this be read?"
    options:
      - It is normal, because 0.9 mg/dL is within the adult reference range
      - It may reflect kidney injury, because normal creatinine in pregnancy is about 0.4-0.6 mg/dL
      - It is diagnostic of KDIGO stage 3 AKI
      - It can only be interpreted after a 24-hour urine collection
      - It is explained by hemoconcentration of late pregnancy
    answer: 1
    why:
      - The non-pregnant range does not apply; hyperfiltration lowers the baseline.
      - "Correct: the lower pregnancy baseline means a 'normal-looking' value can hide AKI."
      - Staging needs a baseline; none is available, and KDIGO is not validated in pregnancy.
      - The book stresses trends in creatinine, not a mandatory 24-hour collection.
      - Pregnancy causes hemodilution, not hemoconcentration.
    src: { page: 354, quote: "The normal level of serum creatinine in pregnancy is lower than the baseline usually ranging between 0.4 and 0.6 mg/dL range." }
    status: unverified
  # ---------- p354-356: causes by trimester ----------
  - id: neph.L11.015
    kind: card
    topic: aki-causes
    front: Which two factors are key determinants of the cause of AKI in a pregnant woman?
    back: The gestational age and the clinical presentation.
    src: { page: 354, quote: "Age of gestation and clinical presentation are important determinants of AKI in a" }
    status: unverified
  - id: neph.L11.016
    kind: enumerate
    topic: aki-causes
    prompt: Mention the causes of AKI in the first trimester.
    points:
      - Hyperemesis gravidarum (volume depletion)
      - Septic abortion (acute tubular necrosis)
      - De novo or flare of glomerulonephritis such as lupus nephritis
      - Placental rupture and hemorrhage (prerenal)
    pass: 3
    src: { page: 355, quote: "Hyperemesis gravidarum, with the associated volume depletion, can result in AKI. Septic abortion is another common cause of AKI" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.017
    kind: card
    topic: aki-causes
    front: Why are pregnant women at high risk of acute cortical necrosis?
    back: Pregnancy is hypercoagulable, so severe hypotension can lead to cortical necrosis.
    src: { page: 355, quote: "Due to the hypercoagulable nature of pregnancy, women have a high risk of acute cortical necrosis in the setting of severe hypotension" }
    status: unverified
  - id: neph.L11.018
    kind: enumerate
    topic: aki-causes
    prompt: Mention the pregnancy-specific causes of AKI in the second and third trimesters.
    points:
      - Preeclampsia
      - HELLP syndrome
      - Acute fatty liver of pregnancy
      - TTP and atypical HUS
      - Urinary tract infection and pyelonephritis
      - Obstruction by the growing uterus
    pass: 4
    src: { page: 355, quote: "These include preeclampsia, hemolysis, elevated liver enzymes, low platelet count (HELLP) syndrome, acute fatty liver of pregnancy" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.019
    kind: card
    topic: aki-causes
    front: Why is post-obstructive AKI more common in the second and third trimesters?
    back: The growing uterus directly compresses the nearby ureters.
    src: { page: 355, quote: "Post-obstructive AKI is more common in the second and third trimester due to the growing uterus" }
    status: unverified
  - id: neph.L11.020
    kind: table
    topic: aki-causes
    title: "Fig 1: timing of AKI in pregnancy"
    columns: [Cause, When it occurs]
    rows:
      - [Septic abortion, First trimester]
      - [Hyperemesis gravidarum, First trimester]
      - [Acute pyelonephritis, Late first to third trimester]
      - ["Preeclampsia, eclampsia, HELLP", Late second to early postpartum]
      - [Acute fatty liver, Third trimester]
      - [TTP, Second and third trimesters]
      - [Atypical HUS, Postpartum]
      - [Cortical necrosis, Third trimester to postpartum]
      - [NSAID use, Postpartum]
      - [Glomerulonephritis flare, Any time]
    blanks: [[0, 1], [3, 1], [4, 1], [6, 1], [8, 1]]
    src: { page: 356, quote: "Fig 1: Timing of AKI in pregnancy" }
    status: unverified
    tags: [high-yield]
  # ---------- p356-357: preeclampsia ----------
  - id: neph.L11.021
    kind: cloze
    topic: preeclampsia
    text: "Preeclampsia affects {{c1::5-8%}} of pregnancies and causes {{c2::15-20%}} of pregnancy-related AKI."
    src: { page: 356, quote: "Preeclampsia affects 5-8% of pregnancies and accounts for 15-20% of pregnancy- related AKI." }
    status: unverified
    tags: [numbers]
  - id: neph.L11.022
    kind: card
    topic: preeclampsia
    front: How is preeclampsia diagnosed?
    back: "New-onset hypertension after 20 weeks in a previously normotensive woman, with proteinuria (or, without proteinuria, signs of end-organ dysfunction)."
    src: { page: 356, quote: "Diagnosis of preeclampsia is made by the new onset of hypertension after 20 weeks of gestation in a previously normotensive woman." }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.023
    kind: cloze
    topic: preeclampsia
    text: "Hypertension in preeclampsia is BP {{c1::≥140/90 mm Hg on two occasions 4 hours apart}}, or {{c2::≥160/110 mm Hg}} within a shorter interval."
    src: { page: 356, quote: "Hypertension is defined by blood pressure ≥ 140/90 mm Hg on two occasions 4 hours apart, or ≥160/110 mm Hg within a shorter interval" }
    status: unverified
    tags: [high-yield, numbers]
  - id: neph.L11.024
    kind: cloze
    topic: preeclampsia
    text: "Proteinuria for preeclampsia is {{c1::≥300 mg/24 h}}, or a spot protein creatinine ratio of {{c2::0.3}} (dipstick {{c3::1+}})."
    src: { page: 356, quote: "proteinuria ≥ 300-mg/24-hour urine or spot urine protein creatinine ratio 0.3g (dipstick 1+)" }
    status: unverified
    tags: [high-yield, numbers]
  - id: neph.L11.025
    kind: enumerate
    topic: preeclampsia
    prompt: Mention the end-organ signs that allow preeclampsia to be diagnosed without proteinuria.
    points:
      - Serum creatinine > 1.1 mg/dL or doubling without other kidney disease
      - Platelets < 100,000/µL
      - Transaminases ≥ twice normal
      - Pulmonary edema
      - Cerebral or visual symptoms
    pass: 4
    src: { page: 356, quote: "preeclampsia can be diagnosed in the absence of proteinuria if any of the following signs of end-organ dysfunction are present" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.026
    kind: card
    topic: preeclampsia
    front: Define preeclampsia with severe features.
    back: "Systolic ≥160 or diastolic ≥110 mm Hg with proteinuria, or BP ≥140/90 mm Hg with or without proteinuria but with end-organ dysfunction. About 40-50% of preeclampsia."
    src: { page: 356, quote: "about 40-50% will experience preeclampsia with severe features, which is defined as systolic blood ≥160 mmHg or diastolic blood pressure ≥110 mmHg" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.027
    kind: card
    topic: preeclampsia
    front: By how much does GFR fall in preeclampsia?
    back: Only 30-40%, so serum creatinine rises only slightly.
    src: { page: 357, quote: "the glomerular filtration rate decreases by only 30% to 40%, which causes a small increase in serum creatinine" }
    status: unverified
    tags: [numbers]
  - id: neph.L11.028
    kind: cloze
    topic: preeclampsia
    text: "In a South African cohort of women with preeclampsia, {{c1::15.3%}} met AKI criteria and only {{c2::two-thirds}} recovered kidney function; hypertension in a previous pregnancy raised the odds of AKI stage 2-3 {{c3::2.2}}-fold."
    src: { page: 357, quote: "Of the study cohort, 15.3% met AKI criteria" }
    status: unverified
    tags: [numbers]
  - id: neph.L11.029
    kind: card
    topic: preeclampsia
    front: How can preeclampsia be told apart from progression of pre-existing CKD?
    back: The rate of kidney function decline, worsening proteinuria, and the angiogenic markers sFlt-1, PlGF and the sFlt-1/PlGF ratio.
    src: { page: 357, quote: "maternal serum levels of soluble angiogenic factors soluble fms-like tyrosine kinase-1 and placental growth factor may be utilized to distinguish between preeclampsia and CKD" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.030
    kind: cloze
    topic: preeclampsia
    text: "Rolfo et al: the median sFlt-1/PlGF ratio was {{c1::436}} in preeclampsia versus {{c2::4}} in CKD."
    src: { page: 357, quote: "soluble fms-like tyrosine kinase-1 to placental growth factor ratio (median 436) as compared to women with CKD (median 4)" }
    status: unverified
    tags: [numbers]
  - id: neph.L11.031
    kind: mcq
    topic: preeclampsia
    stem: "A 32-year-old with known IgA nephropathy is at 30 weeks. Her BP and proteinuria are rising. Which test best helps separate superimposed preeclampsia from CKD progression?"
    options:
      - Serum complement C3 and C4
      - sFlt-1/PlGF ratio
      - Urine sodium
      - Kidney ultrasound
      - Serum uric acid alone
    answer: 1
    why:
      - Complement rises in pregnancy and is used for lupus, not this question.
      - "Correct: a very high sFlt-1/PlGF ratio (median 436 vs 4 in CKD) points to preeclampsia."
      - Urine sodium does not separate these two.
      - Ultrasound looks for obstruction, not preeclampsia.
      - The book names angiogenic factors, not uric acid alone, for this distinction.
    src: { page: 357, quote: "Rolfo et al showed that women with preeclampsia had a significant increase in soluble fms-like tyrosine kinase- 1 levels" }
    status: unverified
  # ---------- p357-358: HELLP ----------
  - id: neph.L11.032
    kind: cloze
    topic: hellp
    text: "AKI occurs in {{c1::3-15%}} of HELLP syndrome, and even severe AKI has a kidney recovery rate of up to {{c2::80%}}."
    src: { page: 357, quote: "AKI occurs in 3- 15% of patients with HELLP syndrome." }
    status: unverified
    tags: [numbers]
  - id: neph.L11.033
    kind: card
    topic: hellp
    front: Why is AKI in HELLP syndrome multifactorial?
    back: The kidney changes of preeclampsia plus coagulopathy causing bleeding and acute tubular necrosis.
    src: { page: 358, quote: "in addition to the kidney changes characteristic of preeclampsia, there is associated coagulopathy, resulting in bleeding and acute tubular necrosis" }
    status: unverified
  - id: neph.L11.034
    kind: card
    topic: hellp
    front: What does a kidney biopsy usually show in HELLP syndrome?
    back: Mostly acute tubular necrosis; thrombotic microangiopathy only occasionally.
    src: { page: 358, quote: "show manifestations consistent with acute tubular necrosis" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.035
    kind: card
    topic: hellp
    front: Why is HELLP called a thrombotic microangiopathy-like syndrome?
    back: It combines thrombocytopenia, hemolysis and AKI.
    src: { page: 358, quote: "HELLP syndrome is considered a thrombotic microangiopathy like syndrome due to occurrence of thrombocytopenia, hemolysis, and AKI." }
    status: unverified
  # ---------- p358: AFLP ----------
  - id: neph.L11.036
    kind: card
    topic: aflp
    front: When is acute fatty liver of pregnancy usually diagnosed?
    back: Late in pregnancy, mostly after 30 weeks (third trimester).
    src: { page: 358, quote: "AFLP is diagnosed later in the pregnancy, mostly after 30 weeks." }
    status: unverified
  - id: neph.L11.037
    kind: card
    topic: aflp
    front: What is the pathogenesis of about 20% of AFLP cases?
    back: Fetal long-chain 3-hydroxyacyl CoA dehydrogenase (LCHAD) deficiency; fetal free fatty acids cross the placenta and are hepatotoxic to the mother.
    src: { page: 358, quote: "The pathogenesis in 20% of cases of AFLP is secondary to fetal long-chain 3- hydroxyacyl CoA dehydrogenase deficiency" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.038
    kind: cloze
    topic: aflp
    text: "AKI is more common in AFLP than in HELLP, present in {{c1::20-100%}} of women, and behaves like {{c2::hepatorenal syndrome}}."
    src: { page: 358, quote: "AKI is more common in AFLP, being present in 20-100% of women. AKI in AFLP usually manifests similarly to hepatorenal syndrome" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.039
    kind: enumerate
    topic: aflp
    prompt: Mention the features of the Swanson criteria that separate AFLP from HELLP or preeclampsia.
    points:
      - Encephalopathy
      - Hyperbilirubinemia
      - Ascites
      - Hypoglycemia
      - Microvesicular steatosis on liver biopsy
    pass: 4
    src: { page: 358, quote: "encephalopathy, hyperbilirubinemia, abdominal ascites, hypoglycemia, and micro vesicular steatosis on liver biopsy, can differentiate AFLP from HELLP" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.040
    kind: card
    topic: aflp
    front: How is AFLP managed?
    back: Expectant (prompt) delivery, platelet transfusion before delivery if platelets < 40,000/µL, and liver transplant evaluation in severe cases.
    src: { page: 358, quote: "platelet transfusion prior to delivery if platelet count less than 40,000 per microliter, and evaluation for liver transplant in severe cases" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.041
    kind: mcq
    topic: aflp
    stem: "At 34 weeks a woman has vomiting, jaundice, confusion, ascites and a glucose of 45 mg/dL. Creatinine is 2.4 mg/dL. Which diagnosis fits best?"
    options:
      - HELLP syndrome
      - Acute fatty liver of pregnancy
      - Hyperemesis gravidarum
      - Atypical HUS
      - Septic abortion
    answer: 1
    why:
      - HELLP overlaps, but encephalopathy, ascites and hypoglycemia are Swanson features of AFLP.
      - "Correct: third trimester, liver failure picture with hypoglycemia; AKI is common and hepatorenal-like."
      - Hyperemesis is a first-trimester cause of prerenal AKI.
      - aHUS is usually postpartum with hemolysis and thrombocytopenia.
      - Septic abortion is a first-trimester cause.
    src: { page: 358, quote: "Swanson Criteria, defined by clinical symptoms and laboratory derangements of encephalopathy, hyperbilirubinemia, abdominal ascites, hypoglycemia" }
    status: unverified
  # ---------- p359: TTP and aHUS ----------
  - id: neph.L11.042
    kind: card
    topic: tma
    front: Why is TTP usually seen in the second and third trimesters?
    back: ADAMTS13 (the von Willebrand factor protease) falls as pregnancy progresses.
    src: { page: 359, quote: "ADAMTS13 levels tend to decline as the pregnancy progresses, and as such, TTP is usually seen in the second and third trimesters" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.043
    kind: enumerate
    topic: tma
    prompt: Mention the diagnostic criteria of TTP in pregnancy.
    points:
      - Thrombocytopenia
      - Schistocytosis
      - Neurologic manifestations
      - No coagulation abnormalities of DIC
    pass: 4
    src: { page: 359, quote: "Diagnostic criteria for TTP includes thrombocytopenia, schistocytosis, neurologic manifestations and absence of coagulation abnormalities" }
    status: unverified
  - id: neph.L11.044
    kind: cloze
    topic: tma
    text: "Severe AKI is seen in up to {{c1::10%}} of TTP in pregnancy."
    src: { page: 359, quote: "Severe AKI is seen in up to 10% of patients with TTP during pregnancy." }
    status: unverified
    tags: [numbers]
  - id: neph.L11.045
    kind: table
    topic: tma
    title: TTP versus atypical HUS in pregnancy
    columns: [Feature, TTP, Atypical HUS]
    rows:
      - [Mechanism, ADAMTS13 deficiency, Complement dysregulation and uncontrolled activation]
      - [Timing, Second and third trimesters (mostly third), Postpartum]
      - [Who, Any pregnancy, More common in multiparous women]
      - [Treatment, Plasma exchange, Plasma exchange and eculizumab]
    blanks: [[0, 1], [0, 2], [1, 2], [2, 2], [3, 2]]
    src: { page: 359, quote: "aHUS is typically diagnosed in the postpartum period and is more common in multiparous women" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.046
    kind: card
    topic: tma
    front: When should plasma exchange be started for suspected TTP or aHUS in pregnancy?
    back: As soon as either is suspected, without waiting for the ADAMTS13 result.
    src: { page: 359, quote: "Plasma exchange should be started when TTP or aHUS is suspected while waiting for the ADAMTS13 levels." }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.047
    kind: card
    topic: tma
    front: When should a kidney biopsy be considered in pregnancy-related TMA?
    back: If the AKI does not resolve despite appropriate treatment.
    src: { page: 359, quote: "A kidney biopsy can be considered if the AKI is not resolving despite appropriate treatment." }
    status: unverified
  - id: neph.L11.048
    kind: mcq
    topic: tma
    stem: "Ten days after an uneventful delivery of her third child, a woman has hemoglobin 7.8 g/dL with schistocytes, platelets 60,000/µL, normal coagulation and creatinine 3.5 mg/dL. BP is 135/85. What is the most likely diagnosis and first step?"
    options:
      - HELLP syndrome; urgent delivery
      - Atypical HUS; start plasma exchange while awaiting ADAMTS13
      - Acute fatty liver; liver transplant evaluation
      - Postpartum NSAID nephropathy; stop NSAIDs only
      - DIC from retained products; give fresh frozen plasma
    answer: 1
    why:
      - She has already delivered; HELLP is a preeclampsia-spectrum disease before or just around delivery.
      - "Correct: postpartum MAHA, low platelets and AKI in a multiparous woman suggests aHUS; plasma exchange starts while ADAMTS13 is pending, eculizumab helps."
      - There are no liver failure features.
      - NSAIDs do not cause hemolysis with schistocytes and thrombocytopenia.
      - Normal coagulation argues against DIC.
    src: { page: 359, quote: "aHUS is characterized by microangiopathic hemolytic anemia, thrombocytopenia, and decreased kidney function" }
    status: unverified
  # ---------- p359-360: outcomes ----------
  - id: neph.L11.049
    kind: cloze
    topic: aki-outcomes
    text: "In Liu's meta-analysis, maternal deaths were {{c1::13.3%}} with pregnancy-related AKI versus {{c2::4.2%}} without, with a {{c3::2.1-day}} longer ICU stay."
    src: { page: 360, quote: "deaths (13.3% vs. 4.2%), and a longer intensive care unit stay of 2.1 days than did women without pregnancy- related AKI" }
    status: unverified
    tags: [numbers]
  - id: neph.L11.050
