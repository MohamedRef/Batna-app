  - id: geri.L07.061
    kind: card
    topic: fracture
    front: When should fracture risk be assessed in people under 50?
    back: Not routinely, only if they have major risk factors, such as current or frequent recent oral or systemic glucocorticoids, untreated premature menopause, or a previous fragility fracture.
    src: { page: 115, quote: "Do not routinely assess fracture risk in people aged under 50 years unless they have major risk factors (for example, current or frequent recent use of oral or systemic glucocorticoids, untreated premature menopause, or previous fragility fracture)." }
    status: unverified
  - id: geri.L07.062
    kind: mcq
    topic: fracture
    stem: Which tool is recommended by NICE guidelines to assess 10-year osteoporotic fracture risk?
    options: [BMI Calculator, STOPP/START criteria, Q-Fracture or FRAX, Geriatric Depression Scale, Timed Up and Go Test]
    answer: 2
    why:
      - BMI is one input, not a fracture risk tool.
      - STOPP/START is for prescribing review.
      - "Correct: QFracture or FRAX estimate the 10-year osteoporotic fragility fracture risk (p115)."
      - The GDS screens for depression.
      - The TUG tests gait and balance.
    src: { page: 115, quote: "Use Q-Fracture or FRAX tools to assess the 10-year osteoporotic fragility fracture risk." }
