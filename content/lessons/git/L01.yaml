          - ["NSAIDs (incl. aspirin)", "More often gastric"]
          - ["Other drugs", "Steroids or bisphosphonates with NSAIDs; sirolimus, SSRIs, 5-FU"]
          - ["Smoking", "Synergistic with H. pylori"]
          - ["Neoplasms", "Gastrinoma, gastric adenocarcinoma, carcinoid"]
        hide: [[1, 1], [2, 1], [3, 1], [4, 1]]
      - kind: explain
        page: 26
        quote: "No cause identified despite thorough investigation"
        title: "كل risk factor بيعمل ulcer إزاي؟"
        text: |
          الكتاب بيدّي الجدول، والـ «ليه» التفسير المقبول (مش في الكتاب):

          - ==H. pylori==: أكتر بكتير في الـ **developing nations**، وبيعمل gastric و duodenal. الالتهاب بيضعف الغشاء، وفي الـ antrum بيزوّد الـ gastrin فالحمض يزيد على الـ duodenum.
          - ==NSAIDs== (ومنها **aspirin (ASA)**): أكتر مع الـ **gastric** ulcers، لأن الضرب الموضعي بيحصل في الحمض، والحمض في المعدة.
          - **Corticosteroids** و **bisphosphonates** **مع** الـ NSAIDs: بيزوّدوا الخطر، والـ steroids بتبطّأ الالتئام.
          - **Sirolimus**، **SSRIs**، **5-FU**: أدوية بتأثر على تجدد الخلايا أو التجلط.
          - **Smoking**: **synergistic** مع الـ H. pylori، يعني الاتنين مع بعض أسوأ من مجموعهم.
          - **Neoplasms**: **gastrinoma** (حمض بزيادة)، **gastric adenocarcinoma**، و **carcinoid**.
          - **Idiopathic**: مفيش سبب رغم thorough investigation.
