        text: |
          سؤال "حصوات بعد الـ cholecystectomy جت منين؟" إجابته في الكتاب سطرين:

          - ==Migrated==: نزلت للـ duct.
          - ==Formed in the duct==: وخصوصًا في الـ brown، اتكوّنت ورا **stricture** بسبب **stasis and infection**.

          يعني شيل المرارة مش ضمان إن الحصوات خلصت، لأن الـ brown أصلًا مش محتاجة مرارة.
