# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: حاسبة KDIGO للـ AKI مبقتش تقول Stage 3 لكرياتينين ثابت فوق 4؛ لازم يكون طلع الأول
  en: The KDIGO AKI calculator no longer calls a stable creatinine of 4 or more stage 3; it must have risen
- kind: fixed
  ar_eg: حاسبة التعويض المتوقع بقت تقول الكلام الصح في القلوية الأيضية (الـ pCO2 المفروض يطلع مش ينزل)
  en: Expected compensation now words metabolic alkalosis results correctly (the pCO2 should rise, not fall)
- kind: improved
  ar_eg: الـ ABI فوق 1.40 بقى نتيجة لوحده «شرايين مش بتتضغط» مع الخطوة الجاية، بدل ما يتقال طبيعي
  en: An ABI above 1.40 now has its own non-compressible result and next steps instead of reading normal
- kind: improved
  ar_eg: الصوديوم المصحح وتصفية الكرياتينين (Cockcroft-Gault) بقوا يقولوا الرقم معناه إيه، واطي ولا طبيعي ولا عالي
  en: Corrected sodium and Cockcroft-Gault now say what the number means (low, normal or high bands)
- kind: improved
  ar_eg: ملاحظات أوضح في FIB-4 فوق 65 سنة، والـ RA 2010، والـ Atlanta، والـ FiO2 بقى ينكتب نسبة مئوية كمان
  en: Clearer notes for FIB-4 over 65, RA 2010 and Atlanta; FiO2 can be typed as a percentage too
