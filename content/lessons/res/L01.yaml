          - { text: "Phase III trial", bin: 1 }
          - { text: "Phase IV trial", bin: 2 }
          - { text: "Implementation research", bin: 2 }
          - { text: "Population outcome studies", bin: 3 }
        why: "T1: preclinical، animal، first-in-human، phase I. T2: phase II وIII. T3: phase IV وdissemination وimplementation. T4: T3 studies in the community وpopulation outcome studies."
