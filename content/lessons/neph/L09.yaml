      - kind: explain
        page: 301
        title: "الـ disequilibrium syndrome"
        quote: "Disequilibrium syndrome: Cerebral edema from urea removal from the blood more rapidly than from the CSF and brain tissue generating a urea osmotic gradient.\nHD generates a CO2 gradient between plasma and CSF lowering the pH in the CSF and brain tissue."
        text: |
          الـ urea بتنزل من **الدم** أسرع من **المخ والـ cerebrospinal fluid (CSF)**. المخ يفضل osmolality أعلى، فالمية تدخله: ==cerebral oedema==. وكمان الـ HD بيعمل CO2 gradient فالـ pH في الـ CSF ينزل.

          **مين؟** أول جلسات، الكبار والأطفال، central nervous system (CNS) lesions (stroke أو head trauma)، brain oedema (malignant hypertension (HTN)، hyponatraemia، hepatic encephalopathy)، و ==BUN عالي قبل الغسيل==.
