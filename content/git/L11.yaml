    src: { page: 304, quote: "Anticoagulation should be resumed as soon as the bleeding has been controlled, preferably within or soon after 7 days of the bleeding event based on thromboembolic risk. Rapid onset of action of DOAC, as compared to VKA, must be considered in this context." }
