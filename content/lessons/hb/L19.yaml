          - "ده وصف الـ **black** stones."
          - "الأغلبية في الغرب **cholesterol**."
          - "بالعكس: الـ brown بالذات بتتكوّن في الـ **ducts**، وده اللي بيفسّر إنها تظهر بعد شيل المرارة."
      - kind: aside
