        quote: "Fasting BG levels are lower than in the non-pregnant state due to insulin-independent glucose uptake by the fetus &placenta."
        title: "الحمل بيشد السكر في اتجاهين"
        alt: "Two stacked boxes. Top: fasting glucose goes down because the fetus and placenta take up glucose without insulin. Bottom: postprandial glucose goes up because diabetogenic placental hormones cause carbohydrate intolerance."
        caption: "الجنين بياكل جلوكوز طول الليل، والمشيمة بتفرز هرمونات ضد الإنسولين بعد الأكل."
        svg: |
          <svg viewBox="0 0 330 210" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="90" rx="8" class="fg-good"/>
            <text x="20" y="36" class="t-b">Fasting glucose ↓</text>
            <text x="20" y="60" class="t-sm">Fetus + placenta take up glucose</text>
            <text x="20" y="80" class="t-sm">independent of insulin</text>
            <rect x="10" y="112" width="310" height="90" rx="8" class="fg-bad"/>
            <text x="20" y="138" class="t-b">Postprandial glucose ↑</text>
            <text x="20" y="162" class="t-sm">Diabetogenic placental hormones</text>
            <text x="20" y="182" class="t-sm">→ carbohydrate intolerance</text>
          </svg>
      - kind: explain
        page: 166
        quote: "HbA1C in Pregnancy:\n  1. In pregnancy, SMBG is more important than HbA1C (2ry measure).\n  2. Rapid turnover in RBCs during pregnancy and physiological changes in glycemic parameters, A1C levels may need to be monitored more frequently than usual (monthly)."
        title: "الـ A1C في الحمل"
        text: |
          - ==Self-monitoring of blood glucose (SMBG)== هو الأساس، والـ **haemoglobin A1c (A1C)** مقياس تاني (2ry).
          - كرات الدم الحمرا بتتجدد بسرعة في الحمل، فالـ A1C بيتقاس ==monthly==.
          - أقل مضاعفات للجنين مع **A1C <6-6.5%**.

          ليه الـ A1C أضعف في الحمل؟ لأن الكتاب بيقول فيه **rapid turnover in RBCs**: كرات حمرا جديدة كتير ما لحقتش تتسكّر، فالـ A1C بيبان أوطى من الحقيقة. وكمان المشكلة في الحمل بعد الأكل، والـ A1C متوسط ما بيبيّنش القمم دي. عشان كده الـ SMBG هو اللي بيوجّه العلاج.
      - kind: mnemonic
        page: 167
        quote: "The American College of Obstetricians and Gynecologists (ACOG) & ADA recommend the following targets for women with pre-gestational T1 or T2DM (the same for GDM):"
        word: "FOT"
        hook: "أرقام ACOG و ADA (نفسها لـ T1، T2، و GDM):"
        parts:
          - { key: "F", text: "Fasting ≤95 mg/dL" }
          - { key: "O", text: "One-hour postprandial ≤140 mg/dL" }
          - { key: "T", text: "Two-hour postprandial ≤120 mg/dL (واحد من الاتنين بعد الأكل)" }
      - kind: aside
        tone: tip
        page: 167
        quote: "Postprandial monitoring is associated with better glycemic control & lower risk of preeclampsia."
        text: |
          افتكرها كده: **95** للصبح، **140** بعد ساعة، **120** بعد ساعتين. والقياس ==بعد الأكل== مرتبط بضبط أحسن و preeclampsia أقل.
      - kind: explain
        page: 167
        title: "ليه الأهداف دي أوطى من أهداف غير الحامل؟"
        quote: "Postprandial monitoring is associated with better glycemic control & lower\n       risk of preeclampsia."
        text: |
          غير الحامل هدفها صيام **80–130** وبعد الأكل **<180**. الحامل ==≤95== و ==≤140== أو **≤120**. التفسير المقبول (مش في الكتاب):

          - الهدف إنك تقرّب سكر الأم من **سكر الحامل الطبيعية**، وده أصلًا أوطى في الصيام (الجنين بيسحب) وما بيعلاش كتير بعد الأكل.
          - الجنين بيتأثر بأي زيادة (HAPO: مفيش threshold)، فبنضغط أكتر.
          - وبنقيس **بعد الأكل** لأن ده مكان المشكلة (هرمونات المشيمة)، والكتاب بيقول إن ده مرتبط بضبط أحسن و **preeclampsia** أقل.

          والجدول بيقول الحد التحتاني (70 للصيام) ما ينطبقش على الـ T2DM اللي على أكل بس، لأن مفيش دوا يوطّيها، وإن الأهداف تبقى أخف لو مش هتتحقق من غير hypoglycemia شديدة.
      - kind: table
        page: 167
        quote: "Table 15.2: Blood glucose goals in pregnancies associated with diabetes\n| Glucose measurement | Type 1 diabetes or type 2 diabetes^ | GDM treated with insulin | GDM not treated with insulin |\n|---|---|---|---|\n| Fasting glucose | 70–95 mg/dL (3.9–5.3 mmol/L) | 70–95 mg/dL (3.9–5.3 mmol/L) | <95 mg/dL (<5.3 mmol/L) |\n| 1-h postprandial glucose | 110–140 mg/dL* (6.1–7.8 mmol/L) | 110–140 mg/dL* (6.1–7.8 mmol/L) | <140 mg/dL* (<7.8 mmol/L) |\n| 2-h postprandial glucose | 100–120 mg/dL (5.6–6.7 mmol/L) | 100–120 mg/dL (5.6–6.7 mmol/L) | <120 mg/dL (<6.7 mmol/L) |\nGestational diabetes mellitus (GDM) blood glucose goals shown are recommended by the Fifth International Workshop-Conference on Gestational Diabetes Mellitus. ^Lower glucose limits do not apply to individuals with type 2 diabetes treated with nutrition alone. Aim for less stringent goals if these cannot be achieved without significant hypoglycemia, based on clinical experience and individualization of care. *Optimal goal includes either a 1-h postprandial glucose level or 2-h postprandial glucose level within column of type of diabetes."
        title: "Blood glucose goals in pregnancy: Table 15.2 (mg/dL)"
        columns: ["القياس", "T1/T2 DM", "GDM بدون إنسولين"]
        rows:
          - ["Fasting", "70-95", "<95"]
          - ["1-h", "110-140", "<140"]
          - ["2-h", "100-120", "<120"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 167
        quote: "Glycemic Goals in Pregnancy 15.11 Recommend CGM to pregnant individuals with type 1 diabetes. A In conjunction with aims to achieve traditional pre- and postprandial glycemic goals, real-time CGM can reduce the risk for large-for-gestational-age infants and neonatal hypoglycemia in pregnancy complicated by type 1 diabetes."
        title: "الـ CGM"
        text: |
          - **15.11**: الـ ==continuous glucose monitoring (CGM)== لكل حامل type 1 diabetes mellitus (T1DM) (A). بيقلل الـ **large for gestational age (LGA)** والـ **neonatal hypoglycemia**.
          - **15.12**: الـ CGM metrics مع الـ SMBG للوصول للـ targets (E).
          - **15.13**: ==لا estimated A1C ولا glucose management indicator (GMI)== في الحمل (C).

          ليه الـ CGM بيفرق في الـ T1DM؟ التفسير المقبول (مش في الكتاب): الـ SMBG بيدّيك 4–7 نقط في اليوم، والقمم بعد الأكل والـ hypos بالليل ممكن تقع بينهم. الـ CGM بيقيس كل كام دقيقة، فبتشوف القمم اللي بتكبّر الجنين (LGA). وليه لا GMI؟ لأن المعادلة اتعملت على ناس مش حوامل، والـ A1C نفسه في الحمل متأثر بالـ rapid RBC turnover، فالرقم ده مش هيعبّر عن حاجة.
      - kind: check
