  # ---------- p145-146: definition and genetics ----------
  - id: neph.L07.001
    kind: card
    topic: adpkd-genetics
    front: Define ADPKD.
    back: A multisystem genetic disorder with multiple bilateral renal cysts and cysts in other organs (liver, pancreas, arachnoid membranes), inherited as autosomal dominant.
    src: { page: 145, quote: "Definition Autosomal dominant polycystic kidney disease (ADPKD) is a multisystem disorder characterized by multiple, bilateral renal cysts and associated with cysts in other organs, such as liver, pancreas, and arachnoid mem-branes. It is a genetic disorder caused by mutations in either of two major genes and is inherited in an autosomal dominant pattern, with Inheritance (Genetic) ADPKD is inherited in an autosomal dominant manner. Mutations in the genes pkd-1 (located on chromosome 16) and pkd-2 (chromosome 4) result in defective synthesis of the proteins polycystin-1 and -2, respec-tively. Both polycystin-1 and -2 are ubiquitously expressed by epithelial cells throughout the" }
    status: unverified
    tags: [high-yield]
