        quote: "Hypoglycemic drugs need dose adjustment in CRF. Metformin & other oral hypoglycemic agents are contra - indicated when GFR declines to be 50% or less."
        text: "الكتاب: metformin وباقي الـ oral agents ممنوعين لما الـ glomerular filtration rate (GFR) يوصل 50% أو أقل (ودي إجابة الامتحان). الإرشادات الحالية بتسمح بالـ metformin لحد eGFR 30 (بجرعة أقل تحت 45، وبيتوقف تحت 30)، وفيه أدوية أحدث زي الـ sodium–glucose cotransporter 2 (SGLT2) inhibitors والـ DPP-4 بتتستخدم في الـ chronic kidney disease (CKD)."
