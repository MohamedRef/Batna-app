    kind: case
    topic: basal
    stem: A 63-year-old man, 80 kg, type 2 DM for 12 years, on maximal metformin and glimepiride. HbA1c 9.4%, fasting glucose 190 mg/dl.
    steps:
      - question: Is insulin indicated?
        options: ["Yes: oral therapy has failed", "No: add a third oral drug only", "No: insulin is only for type 1", "Only if he is pregnant"]
