      - kind: explain
        page: 158
        quote: "INNATE IMMUNE RESPONSE : AGE-ASSOCIATED CHANGES NK CELLS AND DENDRITIC CELLS\n| Cell | Changes |\n|---|---|\n| NK CELLS | DECREASED: CD69 expression; IL 2 and IL12 mediated Chemokine production; Calcium Mobilization; Cytotoxicity; IL2 dependant IFNγ production. INCREASED: Numbers. No Change in antibody-dependant cytotoxicity |\n| DENDRITIC CELLS | DECREASED: Langerhans cell density in skin; Processing capacity; Micropinocytosis; Phagocytosis; Migration; TLR function; LPS - induced IL12 production; IFNα production |"
        title: "ليه الـ dendritic cell هي نقطة الضعف"
        text: |
          الصورة التانية في الصفحة بتقول إن الـ **dendritic cells** في الكبير: ==Langerhans cell density في الجلد أقل==، والـ processing capacity أقل، والـ micropinocytosis والـ phagocytosis أقل، والـ **migration** أقل، والـ TLR function أقل، وإنتاج الـ IL-12 والـ IFN-α أقل.

          التفسير المقبول (مش في الكتاب) للترتيب ده: شغلانة الـ dendritic cell ليها خطوات: **تمسك** الـ antigen (phagocytosis)، **تجهّزه** (processing)، **تسافر** بيه للـ lymph node (migration)، و **تعرضه** على الـ T cell. يعني كل خطوة من دول ضعفت، فالرسالة بتوصل للـ acquired immunity متأخرة وناقصة. النتيجة: الـ T والـ B بيبدأوا متأخر، والتطعيم بيدّي رد أضعف.

          والـ **NK cells** في نفس الصورة: CD69 expression أقل، chemokine production أقل، calcium mobilisation أقل، cytotoxicity أقل، و IFN-γ أقل، مع إن ==العدد بيزيد==. والحاجة الوحيدة اللي ما بتتغيرش: الـ **antibody-dependent cytotoxicity**.
