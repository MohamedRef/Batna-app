  - id: neph.L07.034
    kind: mcq
    topic: adpkd-renal
    stem: A 56-year-old man with known ADPKD has his first ever episode of frank hematuria. It has lasted 10 days. What must you exclude?
    options:
      - Neoplasm
      - Simple cyst hemorrhage only, so reassure
      - Thin basement membrane disease
      - Nephrotic syndrome
      - Intracranial aneurysm rupture
    answer: 0
    why:
      - "Correct: hematuria lasting over a week or first appearing after 50 needs neoplasm excluded (p149)."
