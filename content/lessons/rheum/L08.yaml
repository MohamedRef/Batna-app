lecture: rheum.L08
lessons:
  # ------------------------------------------------------------------
  - id: rheum.L08.lesson1
    title: "الأوعية بتولّع: ليه وإزاي نقسّمها؟"
    hook: "مرض واحد ممكن يعمل صداع، أو purpura، أو فشل كلوي. السر في حجم الوعاء."
    minutes: 8
    pages: [123, 126]
    topics: [basics, classification]
    goals:
      - "تفهم الـ pathogenesis: التهاب في الجدار + ischaemia"
      - "تعرف الأربع mechanisms وأمثلتها"
      - "ترسم الـ Chapel Hill 2012 حسب حجم الوعاء"
    status: unverified
    steps:
      - kind: explain
        page: 123
        title: "يعني إيه vasculitis؟"
        quote: "Vasculitides are a hetrogenous group of conditions characterized by inflammation and necrosis of blood vessels."
        text: |
          الـ **vasculitides** مجموعة أمراض مختلفة، يجمعها ==inflammation and necrosis of blood vessels==.

          - أي وعاء، بأي حجم، في أي organ ممكن يتصاب.
          - علشان كده الأعراض متنوعة جدًا: من مرض **benign** في الجلد بس، لحد مرض **life-threatening** systemic.
          - وبالتالي بيقلّد أمراض كتير، وأمراض كتير بتقلّده. فلازم **systematic approach**.
      - kind: explain
        page: 123
        title: "عمليتين بس"
        quote: "Pathogenesis of vasculitis involves two processes, namely. 1. Inflammation of vessel wall. 2. Ischaemia of tissues."
        text: |
          الـ pathogenesis كلها عمليتين:
          1. ==Inflammation of vessel wall==
          2. **Ischaemia of tissues** (الوعاء ضاق أو اتسد، فالعضو اللي بيغذيه جاع)

          أغلبهم **immune-mediated** و **idiopathic**.
      - kind: table
        page: 124
        quote: "Immune complex mediated with immune complex deposition or formation in situ. This is associated with low complement levels"
        title: "إزاي الجدار بيتضرب؟"
        columns: [Mechanism, Clue, Example]
        rows:
          - ["Allergic angiitis", "Eosinophils, high IgE", "Churg–Strauss"]
          - ["Pauci-immune (ANCA)", "Few deposits", "GPA, MPA, CSS"]
          - ["Immune complex", "Low complement", "HSP, PAN"]
          - ["T cell (Th1)", "Granulomatous infiltrate", "GCA, Takayasu"]
        hide: [[0, 2], [1, 1], [2, 1], [3, 2]]
      - kind: check
        page: 124
        quote: "This is associated with low complement levels, e.g. Henoch-Schonlein purpura (HSP), polyarteritis nodosa (PAN)."
        question: "Which vasculitis mechanism typically lowers serum complement?"
        options:
          - "Immune complex mediated"
          - "Pauci-immune ANCA"
          - "Th1 T-cell mediated"
          - "Allergic angiitis"
        answer: 0
        why:
          - "صح: الـ immune complexes بتستهلك الـ complement (HSP، PAN)."
          - "الـ pauci-immune معناها deposits قليلة، فالـ complement عادي."
          - "الـ Th1 ده GCA و Takayasu، مفيش استهلاك complement."
          - "الـ allergic angiitis علامته eosinophilia و IgE."
      - kind: explain
        page: 124
        title: "الـ pathology مش هتقولك الاسم"
        quote: "Pathologic findings not diagnostic for a specific syndrome. Can be focal and segmental. Not all the vessel may be involved."
        text: |
          - الأنماط بتتداخل جامد، والـ pathology ==not diagnostic== لمرض بعينه.
          - الإصابة ممكن تبقى **focal and segmental**: حتة مصابة وحتة سليمة (skip lesions).
          - الجدار الملتهب: permeability تزيد، يضعف (**aneurysm** أو نزيف)، أو الـ intima تتكاثر و thrombosis، والنهاية **obstruction and ischaemia**.

          الأرقام: incidence **19.8 per million** في السنة، الذروة **65–74** سنة، والرجالة أكتر.
      - kind: reveal
        page: 124
        quote: "Can be focal and segmental. Not all the vessel may be involved."
        prompt: "ليه الـ focal and segmental دي بتهمك عمليًا قدام عيان GCA؟"
        answer: |
          لأن الـ biopsy ممكن تيجي **سليمة** لو أخدت حتة ما فيهاش التهاب. علشان كده في GCA بناخد **4–6 cm**، ولو الشك قوي والـ biopsy سليمة نعمل الناحية التانية (هتشوفها في درس 3).
      - kind: figure
        page: 125
        quote: "Large Vessel Vasculitis (LVV) Takayasu Arteritis (TAK). Giant Cell Arteritis (GCA). Medium Vessel Vasculitis (MVV) Polyarteritis Nodosa (PAN). Kawasaki Disease (KD)."
        title: "Chapel Hill 2012: حسب حجم الوعاء"
        alt: "Three vessels drawn from large to small. The aorta-sized tube is labelled Takayasu and GCA; the medium artery tube is labelled PAN and Kawasaki; the small vessel splits into ANCA-associated (MPA, GPA, EGPA) and immune complex (anti-GBM, cryoglobulinemic, IgA vasculitis, anti-C1q). A side box says variable vessel: Behçet, Cogan."
        caption: "كل ما الوعاء يصغر، تبقى الإصابة أقرب للجلد والكلى والرئة. الـ ==variable vessel== هو **Behçet** و **Cogan**."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <rect x="15" y="15" width="300" height="70" rx="35" class="fg-acc"/>
            <text x="165" y="42" text-anchor="middle" class="t-b">Large vessel</text>
            <text x="165" y="64" text-anchor="middle" class="t-sm">Takayasu · Giant cell arteritis</text>
            <rect x="55" y="105" width="220" height="50" rx="25" class="fg-good"/>
            <text x="165" y="126" text-anchor="middle" class="t-b">Medium vessel</text>
            <text x="165" y="145" text-anchor="middle" class="t-sm">PAN · Kawasaki</text>
            <rect x="15" y="175" width="145" height="110" rx="12" class="fg-bad"/>
            <text x="87" y="196" text-anchor="middle" class="t-sm t-b">Small: ANCA</text>
            <text x="87" y="218" text-anchor="middle" class="t-sm">MPA</text>
            <text x="87" y="238" text-anchor="middle" class="t-sm">GPA (Wegener)</text>
            <text x="87" y="258" text-anchor="middle" class="t-sm">EGPA (Churg–Strauss)</text>
            <rect x="170" y="175" width="145" height="110" rx="12" class="fg-bad"/>
            <text x="242" y="196" text-anchor="middle" class="t-sm t-b">Small: immune complex</text>
            <text x="242" y="218" text-anchor="middle" class="t-sm">Anti-GBM</text>
            <text x="242" y="236" text-anchor="middle" class="t-sm">Cryoglobulinemic</text>
            <text x="242" y="254" text-anchor="middle" class="t-sm">IgA vasculitis (HSP)</text>
            <text x="242" y="272" text-anchor="middle" class="t-sm">Anti-C1q urticarial</text>
            <rect x="15" y="300" width="300" height="45" rx="10" class="fg-thin"/>
            <text x="165" y="320" text-anchor="middle" class="t-sm t-b">Variable vessel: Behçet · Cogan</text>
            <text x="165" y="337" text-anchor="middle" class="t-sm t-mut">+ single organ, systemic disease, probable etiology</text>
          </svg>
      - kind: mnemonic
        page: 125
        quote: "Large Vessel Vasculitis (LVV) Takayasu Arteritis (TAK). Giant Cell Arteritis (GCA). Medium Vessel Vasculitis (MVV) Polyarteritis Nodosa (PAN). Kawasaki Disease (KD)."
        word: "LMSV"
        parts:
          - { key: "L", text: "Large: Takayasu, giant cell arteritis" }
          - { key: "M", text: "Medium: PAN, Kawasaki" }
          - { key: "S", text: "Small: ANCA (MPA, GPA, EGPA) + immune complex (anti-GBM, cryo, IgA, anti-C1q)" }
          - { key: "V", text: "Variable: Behçet, Cogan" }
        hook: "**L-M-S-V** زي مقاسات التيشيرت: Large, Medium, Small... والـ **V** ده Behçet اللي بيلبس أي مقاس."
      - kind: sort
        page: 126
        quote: "Vasculitis Associated with Probable Etiology Hepatitis C Virus-Associated Cryoglobulinemic Vasculitis. Hepatitis B Virus-Associated Vasculitis. Syphilis-Associated Aortitis."
        prompt: "الكتاب كمّل بأقسام تانية. حط كل واحدة في مكانها:"
        bins: ["Single organ", "Systemic disease", "Probable etiology"]
        cards:
          - { text: "Primary CNS vasculitis", bin: 0 }
          - { text: "Isolated aortitis", bin: 0 }
          - { text: "Lupus vasculitis", bin: 1 }
          - { text: "Sarcoid vasculitis", bin: 1 }
          - { text: "HCV cryoglobulinemic vasculitis", bin: 2 }
          - { text: "Syphilis-associated aortitis", bin: 2 }
          - { text: "Drug-associated AAV", bin: 2 }
        why: "الـ single organ محصور في عضو واحد (جلد، CNS، aorta). الـ systemic disease جزء من مرض تاني (lupus، RA، sarcoid). والـ probable etiology ليه سبب: فيروس، syphilis، دوا، أو cancer."
      - kind: try
        items: [rheum.L08.004, rheum.L08.006, rheum.L08.016, rheum.L08.017, rheum.L08.021]
    recap:
      - "Vasculitis = inflammation + necrosis of vessels، والـ pathogenesis = التهاب الجدار + ischaemia."
      - "Mechanisms: allergic (EGPA)، pauci-immune ANCA، immune complex (complement واطي: HSP، PAN)، Th1 (GCA، Takayasu)."
      - "الـ pathology مش بتدي الاسم، والإصابة focal and segmental."
      - "Chapel Hill: **LMSV**."
    practice: [rheum.L08.001, rheum.L08.002, rheum.L08.003, rheum.L08.004, rheum.L08.005, rheum.L08.006, rheum.L08.007, rheum.L08.008, rheum.L08.009, rheum.L08.010, rheum.L08.011, rheum.L08.012, rheum.L08.013, rheum.L08.014, rheum.L08.015, rheum.L08.016, rheum.L08.017, rheum.L08.018, rheum.L08.019, rheum.L08.020, rheum.L08.021, rheum.L08.022, rheum.L08.023]
