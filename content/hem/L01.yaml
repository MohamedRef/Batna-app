  # ---------- p5: CAMs, stroma figure, growth factors ----------
  - id: hem.L01.031
    kind: card
    topic: microenvironment
    front: How do maturing marrow cells leave the marrow for the circulation?
    back: As they differentiate they lose their cell adhesion molecules (CAMs), so they can leave the marrow.
    src: { page: 5, quote: "As the marrow cells differentiate, they lose cell adhesion molecules (CAMS), thus they can leave the marrow to the circulation." }
    status: unverified
    tags: [high-yield]
  - id: hem.L01.032
    kind: mcq
    topic: microenvironment
    stem: A donor's stem cells are given as a simple intravenous infusion, yet they settle in the recipient's marrow within weeks. What explains the homing?
    options:
      - CAM receptors in the marrow microenvironment
      - Erythropoietin secreted by the recipient's kidney
      - Loss of adhesion molecules by the stem cells
      - Thymic education of the donor cells
      - Phagocytosis of the cells by marrow macrophages
    answer: 0
    why:
      - "Correct: infused stem cells seed the marrow because of CAM receptors in the BM microenvironment (p4–5)."
      - EPO drives red cell production; it does not make stem cells home.
      - Losing CAMs is how mature cells leave the marrow, the opposite of homing.
      - The thymus matures T-cell progenitors; it has nothing to do with marrow seeding.
      - Macrophages engulf bare megakaryocyte nuclei; they do not anchor stem cells.
    src: { page: 4, quote: "If haematopoietic stem cells are infused intravenously, they seed the marrow of the recipient successfully" }
    status: unverified
  - id: hem.L01.033
    kind: enumerate
    topic: microenvironment
    prompt: What is the marrow stroma composed of (book figure, p5)?
    points:
      - Fibroblast-like reticular cells
      - Collagenous fibres
      - Extracellular matrix
    pass: 3
    src: { page: 5, quote: "The stroma is composed of fibroblast-like reticular cells, collagenous fibers, and extracellular matrix." }
    status: unverified
  - id: hem.L01.034
    kind: card
    topic: platelets
    front: In the marrow figure (p5), how do platelets form, and what does the reticulocyte do before it leaves?
    back: Fragments of the megakaryocyte break off to become platelets; the reticulocyte forms by expelling its nucleus. Mature cells squeeze through the endothelium into the circulation.
    src: { page: 5, quote: "Fragments of megakaryocyte break off to become platelets." }
    status: unverified
  - id: hem.L01.035
    kind: card
    topic: growth-factors
    front: What do haematopoietic growth factors do?
    back: They regulate proliferation and differentiation of haemopoietic progenitor cells and the function of mature blood cells.
    src: { page: 5, quote: "regulate the proliferation and differentiation of haemopoietic progenitor cells and the function of mature blood cells" }
