schema: batna.lesson/v1
lecture: rheum.L19
lessons:
  # ------------------------------------------------------------------
  - id: rheum.L19.lesson1
    title: "مين بيجيله lupus؟ الأرقام والجينات"
    hook: "ست في العشرينات، X زيادة، و complement ناقص: الجينات بتحمّل المسدس."
    minutes: 8
    pages: [309, 311]
    topics: [definition, genetics]
    goals:
      - "تعرّف SLE وتحفظ أرقام الـ epidemiology"
      - "تفهم ليه الستات أكتر: الـ X chromosome مش الهرمونات بس"
      - "تعرف ليه نقص الـ complement المبكر يعمل lupus"
    status: unverified
    steps:
      - kind: explain
        page: 309
        title: "التعريف"
        quote: "Chronic relapsing inflammatory, multisystem autoimmune disorder of connective tissue characterized by involvement of the skin, joints and serosal membranes."
        text: |
          الـ **systemic lupus erythematosus (SLE)** مرض ==chronic relapsing== inflammatory، **multisystem autoimmune** في الـ connective tissue.

          التلات أماكن اللي بتميّزه: **skin**، **joints**، و **serosal membranes** (pleura و pericardium).

          ليه التلاتة دول بالذات؟ لأنهم أنسجة فيها connective tissue وأغشية كتير، والـ immune complexes بتترسب فيها (درس الـ pathology). وكلمة **relapsing** معناها إن المرض بيروح ويرجع، علشان كده المتابعة طول العمر.
      - kind: table
        page: 309
        quote: "Female: Male ratio:\n  > 90% cases of SLE occur in women 9:1.\n  Frequently during childbearing age (20-40years).\n  20% of cases diagnosed during 1st 2 decades of life."
        title: "الأرقام"
        columns: [Fact, Number]
        rows:
          - ["Highest rate (African/Caribbean women)", "1:250"]
          - ["Women", ">90%, F:M 9:1"]
          - ["Usual age", "20–40 years"]
          - ["Diagnosed in first 2 decades", "20%"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: reveal
        page: 309
        quote: "The disease is rarely reported in blacks in Africa, suggesting that there may be an environmental trigger, as well as a genetic basis, for disease in the UK population."
        prompt: "الـ SLE نادر في السود في أفريقيا، بس عالي في السود في بريطانيا. ده بيقولك إيه؟"
        answer: |
          نفس الجينات، بيئة مختلفة، نتيجة مختلفة. يبقى فيه ==environmental trigger== جنب الـ **genetic basis**.

          الجينات بتحمّل المسدس، والبيئة بتدوس على الزناد.
      - kind: reveal
        page: 310
        quote: "Risk of men is similar to pre-pubertal / postmenopausal women."
        prompt: "ليه الراجل عنده نفس risk الست اللي قبل البلوغ أو بعد سن اليأس؟"
        answer: |
          الكتاب بيدّينا معلومتين: الـ risk بيعلى في الـ **reproductive years**، والراجل عنده نفس risk الست اللي ==مفيهاش estrogen كتير== (قبل البلوغ أو بعد اليأس).

          يعني الهرمونات بتزوّد الـ risk، بس مش هي كل الحكاية. علشان كده الكتاب بيكمّل بـ **Klinefelter (XXY)**: الراجل اللي عنده X زيادة الـ risk بتاعه يبقى زي الست. الخطوات الجاية بتفصّل الجينات دي واحدة واحدة.
      - kind: explain
        page: 310
        title: "الجينات: HLA والـ complement"
        quote: "Complete deficiency of the early complement components C2, C4, and C1q results in SLE in 75%, 10%, and 90% of cases, respectively."
        text: |
          - **HLA** (الـ major histocompatibility complex (MHC) على chromosome 6): أول genetic link، بيدي **~2-fold risk**. أثبتهم في الـ Caucasians: ==HLA-DR2 و DR3==. والـ DQ/DR مرتبطين بالـ autoantibodies.
          - **Complement:** الـ complete deficiency نادر، بس لما يحصل: **C1q 90%**، **C2 75%**، **C4 10%** (أرقام الكتاب).
          - الأشيع: **low C4 copy number** = risk، و high copy number = protective.

          يعني الـ HLA بيحدد إزاي الـ antigens بتتعرض للـ T cells، فالـ alleles دي بتسهّل إن المناعة تشوف «نفسها» كعدو؛ وده سبب ارتباط الـ DQ/DR بالـ autoantibodies (التفسير المقبول، مش في الكتاب).
      - kind: figure
        page: 310
        quote: "Complete deficiency of the early complement components C2, C4, and C1q results in SLE in 75%, 10%, and 90% of cases, respectively."
        title: "الـ complement deficiency: كام في المية يعملوا lupus؟"
        alt: "Horizontal bar chart of the book's figures for complete early complement deficiency causing SLE: C1q 90%, C2 75%, C4 10%. A note below says complete deficiencies are rare; a low C4 gene copy number is the common risk and a high copy number protects."
        caption: "أرقام **الكتاب**: ==C1q 90%==، C2 75%، C4 10%. الـ complete deficiency نادر جدًا، علشان كده الأشيع في الواقع هو الـ **low C4 copy number**."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="22" class="t-sm t-b">Complete deficiency → SLE (book)</text>
            <text x="10" y="58" class="t-sm t-b">C1q</text>
            <rect x="60" y="42" width="225" height="24" rx="4" class="fg-bad"/>
            <text x="292" y="58" class="t-sm">90%</text>
            <text x="10" y="98" class="t-sm t-b">C2</text>
            <rect x="60" y="82" width="188" height="24" rx="4" class="fg-acc"/>
            <text x="255" y="98" class="t-sm">75%</text>
            <text x="10" y="138" class="t-sm t-b">C4</text>
            <rect x="60" y="122" width="25" height="24" rx="4" class="fg-box"/>
            <text x="92" y="138" class="t-sm">10%</text>
            <rect x="10" y="164" width="310" height="56" rx="8" class="fg-box"/>
            <text x="165" y="186" text-anchor="middle" class="t-sm">Rare. Common risk: low C4 copy number</text>
            <text x="165" y="206" text-anchor="middle" class="t-sm t-mut">high C4 copy number protects</text>
          </svg>
      - kind: update
        page: 310
        quote: "Complete deficiency of the early complement components C2, C4, and C1q results in SLE in 75%, 10%, and 90% of cases, respectively."
        text: "أغلب المراجع بتقول العكس في C2 و C4: حوالي 75% مع **C4** deficiency و 10–30% مع **C2**، والـ C1q فوق 90%. في الامتحان اكتب أرقام الكتاب."
        ref: "Macedo & Isaac, Frontiers in Immunology 2016"
      - kind: reveal
        page: 310
        quote: "More commonly, a low gene copy number of C4 is seen as a risk factor for SLE, whereas a high copy number of C4 is protective against SLE."
        prompt: "ليه نقص الـ complement المبكر (C1q، C2، C4) يعمل lupus، مع إن المنطقي إن نقص المناعة يقلل الـ autoimmunity؟"
        answer: |
          الـ early complement بيلم الـ **apoptotic debris** والـ immune complexes ويخلّص منهم بهدوء.

          لو ناقص (أو الـ **C4 gene copy number** قليل)، الحطام النووي يفضل موجود، والجهاز المناعي يشوفه ويعمل ضده **autoantibodies**. ده تفسير مقبول، وهتشوف في الدرس الجاي إن الـ **defective clearance of apoptotic material** هو قلب المرض.
      - kind: explain
        page: 311
        title: "الـ X chromosome هو السر"
        quote: "These suggest that the predisposition of women to developing SLE is related to X chromosome copy number, not to sex or sex hormones."
        text: |
          - الرجالة اللي عندهم SLE عندهم **Klinefelter (47,XXY)** بـ **15 ضعف**، والـ XXY risk بتاعهم **زي الستات**.
          - والـ **47,XXX** أكتر في الستات اللي عندهم SLE.
          - الخلاصة: ==X chromosome copy number==، مش الجنس ولا الهرمونات لوحدها.

          **Twins:** monozygotic **24–35%** مقابل dizygotic **2–5%**. و **10–12%** عندهم قريب درجة أولى أو تانية.

          ليه الـ twins مهمين؟ لأن الـ monozygotic نفس الجينات بالظبط، ولو المرض جيني بس كانت النسبة هتبقى قريبة من 100%. الفرق بين 24–35% و 2–5% بيقول الجينات مهمة، والباقي بيئة (الدرس الجاي).
      - kind: check
        page: 311
        quote: "Twin studies estimated that the rate of SLE concordance in monozygotic twins is 24%-35%, compared to 2%–5% in dizygotic twin pairs."
        question: "Monozygotic twin concordance for SLE is only 24–35%. What does that tell you?"
        options:
          - "Genes matter, but environment is needed too"
          - "SLE is purely genetic"
          - "SLE is purely environmental"
          - "SLE is X-linked recessive"
        answer: 0
        why:
          - "صح: لو جينات بس كانت هتبقى قريبة من 100%؛ ولو بيئة بس ما كانتش هتبقى أعلى من الـ dizygotic (2–5%) بالشكل ده."
          - "الـ identical twins نفس الجينات، ومع ذلك أغلبهم مش بيتصابوا."
          - "الفرق الكبير بين monozygotic (MZ) و dizygotic (DZ) بيقول إن الجينات ليها دور."
          - "مش single-gene X-linked؛ الكتاب بيتكلم عن X dose."
      - kind: try
        items: [rheum.L19.001, rheum.L19.005, rheum.L19.008, rheum.L19.012, rheum.L19.016]
    recap:
      - "SLE: chronic relapsing multisystem autoimmune؛ skin، joints، serosa."
      - "F:M 9:1، سن 20–40، 1:250 في الـ African/Caribbean women؛ 20% في أول عقدين."
      - "HLA-DR2/DR3 (~2-fold)؛ complement: C1q 90%، C2 75%، C4 10% (الكتاب)؛ low C4 copy = risk."
      - "X dose: XXY risk زي الستات. MZ 24–35% مقابل DZ 2–5%؛ 10–12% عندهم قريب."
    practice: [rheum.L19.001, rheum.L19.002, rheum.L19.003, rheum.L19.004, rheum.L19.005, rheum.L19.006, rheum.L19.007, rheum.L19.008, rheum.L19.009, rheum.L19.010, rheum.L19.011, rheum.L19.012, rheum.L19.013, rheum.L19.014, rheum.L19.015, rheum.L19.016, rheum.L19.105]
