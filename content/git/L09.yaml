    front: What is the principle of the breath hydrogen test, and what gives a false positive?
    back: Unabsorbed carbohydrate (such as lactose in lactase deficiency) is fermented by colonic bacteria into hydrogen, which is exhaled. SIBO gives a false positive with an early hydrogen rise.
