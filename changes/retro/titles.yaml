# What pull requests merged without a changes/ line should have said, keyed
# by their title as the feed shows it (no "(#123)"). The feed builder uses it
# for commits with no file and rewrites the English lines older feeds carry
# (crates/tools/src/changes.rs). `[]`: nothing Mohamed would notice.
# CI now requires a changes/<topic>.yaml in every pull request, so this list
# only grows for commits pushed straight to main.

