      - kind: explain
        page: 439
        title: "الـ MRA فوق الـ ACEi/ARB"
        quote: "Emerging evidence shows that the use of mineralocorticoid receptor blockers in combination with ACE inhibitors or ARBs might have benefits on albuminuria in diabetic kidney disease, a phenomenon referred to as \"aldosterone breakthrough\".\nThe combination of spironolactone with an ACE inhibitor or ARB significantly decreased albuminuria compared with the results of placebo.\nMore patients with diabetic nephropathy who received an ACE inhibitor or an ARB as well as finerenone showed an improvement in urinary ACR compared to the number of patients who received one of these plus a placebo."
        text: |
          **كلام الكتاب (ده اللي تكتبه في الامتحان):** إضافة ==mineralocorticoid receptor antagonist (MRA)== على angiotensin-converting enzyme inhibitor (ACEi) أو angiotensin II receptor blocker (ARB) ممكن تقلل الـ **albuminuria** في الـ DKD، والكتاب بيسمّي ده **"aldosterone breakthrough"**.
          - الـ **spironolactone** مع ACEi أو ARB قلّل الـ albuminuria بوضوح عن الـ placebo.
          - الـ **finerenone** مع ACEi أو ARB حسّن الـ albumin-to-creatinine ratio (ACR) عند عدد أكبر من العيانين.

          **ملحوظة على المصطلح (من برّه الكتاب):** المعنى الدقيق لـ ==aldosterone breakthrough== هو إن الـ aldosterone **بيرجع يعلى** تاني رغم إن العيان واخد ACEi أو ARB لمدة طويلة. والعلو ده هو **السبب** اللي بيخلينا نضيف MRA، مش فايدة الـ albuminuria نفسها. جملة الكتاب ماشية بالمعنى الواسع، فاحفظ الاتنين.
      - kind: explain
        page: 440
        title: "FIDELIO-DKD: الـ finerenone اتجرّب إزاي؟"
        quote: "Does finerenone slow progression of CKD and reduce cardiovascular mortality in patients with type 2 diabetes?\nPhase 3, double-blind, multicenter, randomized, controlled trial; 5674 patients with type 2 diabetes and CKD; 2.6 year median follow up\n| Outcome | Finerenone (10 mg or 20mg daily), n = 2833 | Hazard ratio | Placebo, n = 2841 |\n| Primary Composite Outcome: Kidney Failure with >40% decrease in eGFR over 4-week period or death from renal causes | 17.8% (504/2833) | HR 0.82 (0.73 − 0.93), p = 0.001 | 21.1% (600/2841) |\n| Secondary Composite Outcome: Death from cardiovascular causes or hospitalization for any cause | 13.0% (367/2833) | HR 0.86 (0.75 − 0.99), p = 0.03 | 14.8% (420/2841) |\nIn patients with CKD and type 2 diabetes, treatment with finerenone resulted in lower risk of CKD progression and cardiovascular events than placebo."
        text: |
          الـ trial اللي في الكتاب (ص 440): عيانين **T2D + CKD** على **ACEi أو ARB (مش الاتنين)**:

          - الجرعة: ==10 mg== لو الـ eGFR أقل من 60، و **20 mg** لو 60 أو أكتر، وبتتظبط حسب الـ **K⁺** والـ eGFR.
          - النتيجة: **CKD progression** أقل (**HR 0.82**: 17.8% ضد 21.1%)، و **cardiovascular events** أقل (**HR 0.86**).

          ليه الجرعة بتتظبط على الـ K⁺؟ التفسير المقبول (مش في الكتاب): أي MRA بيمنع الـ aldosterone يطلّع potassium، وفوقه ACEi أو ARB بيعملوا نفس الحاجة، فالـ hyperkalemia هي الخطر الأساسي.
      - kind: check
        page: 440
        quote: "What's the Design of the \"Finerenone in Reducing Kidney Failure and Disease Progression in Diabetic Kidney Disease\" Trial (FIDELIO-DKD)?\nFIDELIO-DKD: 47 countries; Randomized, double-blind, placebo-controlled, parallel-group, event-driven trial; 5.5 years (expected duration); 5.734 patients; eGFR ≥25–<75 mL/min/1.73 m2; Urinary ACR ≥30–≤5,000 mg/g\n4-12 w Run In Period, then randomized to Finerenone or Placebo:\n  Finerenone 10mg if eGFR <60mL/min/1.73m2\n  Finerenone 20mg if eGFR ≥60mL/min/1.73m2\n  Dose titration (K+, eGFR)\n  Treatment with either ACEi or ARB but not both\n  Monthly visits\nPrimary Outcome: Time to renal composite event:\n  ↓ eGFR >40% from baseline\n  eGFR <15mL/min/1.73m2\n  ESRD (HD, PD or KTx)\nSecondary Outcome: Time to cardiovascular composite event:\n  CV death\n  Non-fatal myocardial infarction\n  Non-fatal stroke\n  Hospitalization for heart failure\n  All-cause mortality\n  All cause hospitalization\n  ΔUACR\nThe overall trial population is predominately male (70.2%) and white (65.9%), with a mean age of 65.6 years and a mean duration of diabetes of 16.6 years. Mean eGFR 44.3 mL/min/1.73 m2, mean serum potassium 4.4 mEq/L, and median UACR 851 mg/g.\nConclusion: The results of FIDELIO-DKD will determine whether an optimally treated cohort of T2D patients with CKD at high risk of progression of their renal disease and CV events will experience cardiorenal benefits with the addition of finerenone to their treatment regimen. Results are expected in 2020."
