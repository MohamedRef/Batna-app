schema: batna.content/v1
lecture: rheum.L01
title: Cytokines
author: Dr. Abeer Aly Abd Elaaty
book: { chapter: 3, pages: [1, 22] }
topics:
  - { id: intro, title: "Definition, producers and action modes" }
  - { id: naming, title: "Denomination of cytokines" }
  - { id: attributes, title: "Functional attributes" }
  - { id: functions, title: "Biological functions and functional groups" }
  - { id: families, title: "The six cytokine families" }
  - { id: th-subsets, title: "Cytokines and T-helper subsets" }
  - { id: receptors, title: "Cytokine receptors and signalling" }
  - { id: storm, title: "Hypercytokinemia (cytokine storm)" }
  - { id: diseases, title: "Cytokine-related diseases and antagonists" }
  - { id: therapy, title: "Cytokine-based therapies" }
  - { id: ra, title: "Cytokines in rheumatoid arthritis" }
