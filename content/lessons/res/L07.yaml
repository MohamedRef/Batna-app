          </svg>
      - kind: check
        page: 100
        quote: "Quasi-experiments are subject to concerns regarding internal validity, because the treatment and control groups may not be comparable at baseline (pre-intervention characteristics).\nInternal validity refers to the degree to which a researcher can be sure that the treatment was responsible for the change in the experimental group."
        question: "Why are quasi-experiments a concern for internal validity?"
        options:
          - "The groups may not be comparable at baseline"
          - "They always have too few subjects"
          - "They cannot measure outcomes before the intervention"
          - "They never have a comparison group"
        answer: 0
        why:
          - "صح: من غير قرعة، الجروبين ممكن يختلفوا من الأول، فمش متأكد إن العلاج هو اللي عمل الفرق."
          - "العدد مش هو المشكلة الأساسية."
