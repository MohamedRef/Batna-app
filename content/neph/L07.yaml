items:
  # ---------- p145-146: definition and genetics ----------
  - id: neph.L07.001
    kind: card
    topic: adpkd-genetics
    front: Define ADPKD.
    back: A multisystem genetic disorder with multiple bilateral renal cysts and cysts in other organs (liver, pancreas, arachnoid membranes), inherited as autosomal dominant.
    src: { page: 145, quote: "multisystem disorder characterized by multiple, bilateral renal cysts and associated with cysts in other organs, such as liver, pancreas, and arachnoid" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.002
    kind: table
    topic: adpkd-genetics
    title: ADPKD genes
    columns: [Gene, Chromosome, Protein]
    rows:
      - [PKD1, "16", Polycystin-1]
      - [PKD2, "4", Polycystin-2]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 145, quote: "Mutations in the genes pkd-1 (located on chromosome 16) and pkd-2 (chromosome 4)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.003
    kind: card
    topic: adpkd-genetics
    front: Where are polycystin-1 and -2 expressed?
    back: Ubiquitously, by epithelial cells throughout the body.
    src: { page: 145, quote: "Both polycystin-1 and -2 are ubiquitously expressed by epithelial cells throughout the" }
    status: unverified
  - id: neph.L07.004
    kind: cloze
    topic: adpkd-genetics
    text: "PKD1 mutations are about {{c1::seven}} times more common than PKD2 and more aggressive: ESRD comes on average {{c2::15}} years earlier."
    src: { page: 146, quote: "with more aggressive disease (onset of esrd, on average, 15 years earlier)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.005
    kind: card
    topic: adpkd-genetics
    front: What does a GANAB mutation cause?
    back: Mild polycystic kidney disease with more variable polycystic liver disease.
    src: { page: 146, quote: "Mutations in a third gene, ganab, have been identified in families with mild polycystic kidney and more variable polycystic liver disease." }
    status: unverified
  # ---------- p146: pathophysiology ----------
  - id: neph.L07.006
    kind: card
    topic: adpkd-path
    front: Where do polycystin-1 and polycystin-2 sit, and what is polycystin-2?
    back: Together in the cilia of renal collecting duct epithelial cells. Polycystin-1 is a membrane receptor signalling protein; polycystin-2 is a calcium-permeable channel.
    src: { page: 146, quote: "polycystin-2 (a calcium-permeable channel) within the cilia of renal collecting duct epithelial cells" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.007
    kind: card
    topic: adpkd-path
    front: What does the polycystin complex normally do?
    back: It is an extracellular mechanosensor (luminal flow bends the cilia) that regulates cell proliferation, adhesion, differentiation and maturation, keeping tubular integrity and calibre.
    src: { page: 146, quote: "This polycystin complex acts as an extra-cellular mechanosensor (luminal flow disturbs the cilia and triggers the apparatus)" }
    status: unverified
  - id: neph.L07.008
    kind: order
    topic: adpkd-path
    prompt: Order how a cyst forms in ADPKD.
    steps:
      - The polycystin complex fails to form
      - Cell turnover is dysregulated with uncontrolled proliferation to growth factors
      - Proliferating tubular cells form a cyst
      - The cyst closes off its nephron and expands over time
    src: { page: 146, quote: "Proliferating tubular cells form tubular cysts that close off the associated nephron and expand in size over time." }
    status: unverified
  - id: neph.L07.009
    kind: cloze
    topic: adpkd-path
    text: "Fewer than {{c1::1%}} of nephrons undergo cystic transformation in ADPKD."
    src: { page: 146, quote: "It is estimated that <1% of nephrons undergo such cystic transforma-" }
    status: unverified
    tags: [numbers]
  - id: neph.L07.010
    kind: card
    topic: adpkd-path
    front: In the ADPKD signal pathway figure, how does vasopressin drive cyst growth?
    back: AVP on the V2 receptor activates adenylyl cyclase 6, raising cAMP. cAMP activates PKA, which drives CFTR chloride (fluid) secretion and, through Src, MAPK and mTOR, cell proliferation. Low intracellular Ca removes the brake on cAMP.
    src: { page: 146, quote: "Signal Pathway" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.011
    kind: card
    topic: adpkd-path
    front: In the signal pathway figure, how does somatostatin oppose cyst growth?
    back: Somatostatin on its receptor (SSTR) acts through Gi to inhibit adenylyl cyclase 6, lowering cAMP.
    src: { page: 146, quote: "Signal Pathway" }
    status: unverified
  # ---------- p147: epidemiology and clinical ----------
  - id: neph.L07.012
    kind: cloze
    topic: adpkd-genetics
    text: "The prevalence of genetically affected individuals at birth is about 1 in {{c1::400}} to 1 in {{c2::1000}}."
    src: { page: 147, quote: "with a prevalence of geneti- cally affected individuals at birth estimated at 1 in 400 to 1 in 1000" }
    status: unverified
    tags: [numbers]
  - id: neph.L07.013
    kind: card
    topic: adpkd-genetics
    front: Why are only a fraction of people with an ADPKD mutation aware of it at any time?
    back: The diagnosis is usually made decades after birth, and some patients are never diagnosed.
    src: { page: 147, quote: "In most patients the diagnosis is made decades later, and some patients are never diagnosed." }
    status: unverified
  - id: neph.L07.014
    kind: cloze
    topic: adpkd-genetics
    text: "In ADPKD, {{c1::50%}} of offspring should be affected, yet {{c2::25–40%}} of new patients have no family history."
    src: { page: 147, quote: "Importantly, 25-40% of new patients will have no family history." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.015
    kind: enumerate
    topic: adpkd-genetics
    prompt: Mention family-history clues that may identify ADPKD gene carriers.
    points:
      - Renal disease
      - Raised BP
      - Stroke (intracranial hemorrhage)
      - Premature death
    pass: 3
    src: { page: 147, quote: "A careful history for renal disease, ↑ BP, stroke (intracranial haemorrhage), or premature death may pinpoint carriers" }
    status: unverified
  - id: neph.L07.016
    kind: enumerate
    topic: adpkd-renal
    prompt: Mention the renal manifestations of ADPKD.
    points:
      - Flank or loin pain from large cysts (acute pain suggests cyst rupture or bleeding)
      - Dipstick-positive hematuria, with or without episodic frank hematuria
      - Raised BP
      - Nocturia and polyuria (loss of concentrating ability)
      - Low-grade proteinuria, usually under 1 g/day
      - Uremic symptoms if presenting late
    pass: 5
    src: { page: 147, quote: "Flank or loin pain arising from large cysts. Acute pain may suggest cyst rupture or bleeding." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.017
    kind: card
    topic: adpkd-renal
    front: Why do ADPKD patients have nocturia and polyuria?
    back: Loss of urinary concentrating ability.
    src: { page: 147, quote: "Nocturia and polyuria (loss of urinary concentrating ability)." }
    status: unverified
  - id: neph.L07.018
    kind: cloze
    topic: adpkd-renal
    text: "Proteinuria in ADPKD is low grade, usually below {{c1::1 g/day}}."
    src: { page: 147, quote: "Low-grade proteinuria may be present (usually <1g/day)." }
    status: unverified
    tags: [numbers]
  # ---------- p148: kidney size, hypertension, ESRD ----------
  - id: neph.L07.019
    kind: card
    topic: adpkd-renal
    front: What correlates with the manifestations of ADPKD?
    back: The severity of the structural abnormality (kidney enlargement) correlates with pain, hematuria, hypertension and renal impairment; enlargement eventually occurs in 100% of patients.
    src: { page: 148, quote: "The severity of the structural abnormality correlates with the manifestations of ADPKD, such as pain, hematuria, hypertension, and renal impairment." }
    status: unverified
  - id: neph.L07.020
    kind: card
    topic: adpkd-renal
    front: What can massive renal enlargement compress?
    back: Local structures, such as the inferior vena cava, and the gut (digestive symptoms).
    src: { page: 148, quote: "Massive renal enlargement can lead to compression of local structures, resulting in such complica-tions as inferior vena cava (IVC) compression" }
    status: unverified
  - id: neph.L07.021
    kind: cloze
    topic: adpkd-renal
    text: "In the CRISP study, kidney and cyst volumes grew {{c1::exponentially}}, averaging {{c2::5.3%}} per year, and baseline {{c3::total kidney volume}} predicted later growth and GFR decline."
    src: { page: 148, quote: "Rates of growth were relatively constant, averaging 5.3% per year, but highly variable from patient to patient." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.022
    kind: card
    topic: adpkd-renal
    front: What is the most common manifestation of ADPKD?
    back: Hypertension. It is a major contributor to renal progression and to cardiovascular morbidity and mortality.
    src: { page: 148, quote: "Hypertension is the most common manifestation of ADPKD and a major contributor to renal disease progression" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.023
    kind: card
    topic: adpkd-renal
    front: Which independent risk factors for renal decline are more common in hypertensive ADPKD patients?
    back: Microalbuminuria, proteinuria and hematuria.
    src: { page: 148, quote: "Microalbuminuria, proteinuria, and hematuria, which are independent risk factors for renal functional decline, are more common in hypertensive patients" }
    status: unverified
  - id: neph.L07.024
    kind: card
    topic: adpkd-renal
    front: Which ADPKD complications does hypertension make worse besides the kidney?
    back: Valvular heart disease and intracranial aneurysms.
    src: { page: 148, quote: "Hypertension also may increase morbidity from valvular heart disease and intracranial aneurysms" }
    status: unverified
  - id: neph.L07.025
    kind: cloze
    topic: adpkd-renal
    text: "Renal function usually stays normal until the {{c1::fourth to sixth}} decade; once it declines, GFR falls about {{c2::4.4–5.9}} mL/min per year."
    src: { page: 148, quote: "At this stage, the average rate of GFR decline is 4.4 to 5.9 ml/min per year." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.026
    kind: card
    topic: adpkd-renal
    front: Is ESRD inevitable in ADPKD?
    back: No. Up to 77% have preserved renal function at age 50 and 52% at age 73.
    src: { page: 149, quote: "Up to 77% of patients are alive with preserved renal function at age 50 years, and 52% at age 73." }
    status: unverified
    tags: [numbers]
  # ---------- p149: risk factors, hematuria ----------
  - id: neph.L07.027
    kind: enumerate
    topic: adpkd-renal
    prompt: Mention risk factors for renal failure in ADPKD.
    points:
      - Male sex
      - Black race
      - Diagnosis before age 30
      - First hematuria before age 30
      - Hypertension before age 35
      - Hyperlipidemia and low HDL
      - Sickle cell trait
      - PKD1 truncating mutations
    pass: 5
    src: { page: 149, quote: "Other risk factors for renal failure include Black race, diagnosis of ADPKD before age 30, first episode of hematuria before age 30" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.028
    kind: card
    topic: adpkd-renal
    front: What did CRISP find to be the strongest predictors of renal decline in ADPKD?
    back: Kidney and cyst volumes.
    src: { page: 149, quote: "The CRISP study confirmed that kidney and cyst volumes are the strongest predic-tors of renal functional decline." }
    status: unverified
  - id: neph.L07.029
    kind: card
    topic: adpkd-renal
    front: What did the HALT PKD post hoc analysis link to kidney growth?
    back: Dietary sodium intake.
    src: { page: 149, quote: "a post hoc analysis of the HALT PKD clinical trials showed an association of dietary sodium with the rate of kidney growth" }
    status: unverified
  - id: neph.L07.030
    kind: cloze
    topic: adpkd-renal
    text: "Visible hematuria occurs in up to {{c1::40%}} of ADPKD patients over the disease course and may be the first symptom."
    src: { page: 149, quote: "Visible hematuria may be the initial presenting symptom and occurs in up to 40% of patients with ADPKD" }
    status: unverified
    tags: [numbers]
  - id: neph.L07.031
    kind: enumerate
    topic: adpkd-renal
    prompt: Give the differential diagnosis of visible hematuria in ADPKD.
    points:
      - Cyst hemorrhage
      - Stone
      - Infection
      - Tumor
    pass: 4
    src: { page: 149, quote: "Differential diagnosis includes cyst hem-orrhage, stone, infection, and tumor." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.032
    kind: card
    topic: adpkd-renal
    front: Why can cyst hemorrhage cause flank pain without hematuria?
    back: Gross hematuria needs the cyst to communicate with the collecting system; often it does not, so only flank pain occurs (sometimes with fever, mimicking infection).
    src: { page: 149, quote: "Frequently, the cyst does not communicate with the collecting system, and flank pain without hematuria occurs." }
    status: unverified
  - id: neph.L07.033
    kind: cloze
    topic: adpkd-renal
    text: "Cyst hemorrhage usually resolves in {{c1::2–7}} days. If hematuria or flank pain lasts over {{c2::1 week}}, or the first hematuria occurs after age {{c3::50}}, exclude neoplasm."
    src: { page: 149, quote: "if the initial episode of hematuria occurs after age 50 years, neoplasm should be excluded" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.034
    kind: mcq
    topic: adpkd-renal
    stem: A 56-year-old man with known ADPKD has his first ever episode of frank hematuria. It has lasted 10 days. What must you exclude?
    options:
      - Neoplasm
      - Simple cyst hemorrhage only, so reassure
      - Thin basement membrane disease
      - Nephrotic syndrome
      - Intracranial aneurysm rupture
    answer: 0
    why:
      - "Correct: hematuria lasting over a week or first appearing after 50 needs neoplasm excluded (p149)."
      - Cyst hemorrhage usually settles in 2–7 days; this is too long and too late in life.
      - TBM causes persistent microscopic hematuria from youth, not a new episode at 56.
      - Nephrotic syndrome is not a cause of frank hematuria here.
      - Aneurysm rupture causes subarachnoid hemorrhage, not hematuria.
    src: { page: 149, quote: "if the initial episode of hematuria occurs after age 50 years, neoplasm should be excluded" }
    status: unverified
  # ---------- p150: UTI and stones ----------
  - id: neph.L07.035
    kind: card
    topic: adpkd-renal
    front: Why may UTI incidence in ADPKD be overestimated?
    back: Sterile pyuria is common in these patients.
    src: { page: 150, quote: "may have been overestimated because sterile pyuria is common in these patients" }
    status: unverified
  - id: neph.L07.036
    kind: card
    topic: adpkd-renal
    front: Which organisms cause most UTIs in ADPKD, and what is the usual route?
    back: E. coli, Klebsiella, Proteus and other Enterobacteriaceae. The route is usually retrograde from the bladder, so cystitis must be treated promptly.
    src: { page: 150, quote: "The route of infection in acute pyelonephritis and cyst infection is usually retrograde from the bladder" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.037
    kind: cloze
    topic: adpkd-renal
    text: "Stones occur in about {{c1::20%}} of ADPKD patients, mostly {{c2::uric acid}}, calcium oxalate or both."
    src: { page: 150, quote: "Renal stone disease occurs in about 20% of patients with ADPKD. Most stones are composed of uric acid, calcium oxalate, or both." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.038
    kind: card
    topic: adpkd-renal
    front: Which imaging has replaced IV urography for stones in ADPKD, and why?
    back: CT urography. It is more sensitive for small or radiolucent stones and separates stones from tumor, clot and cyst wall or parenchymal calcification. Dual-energy CT can tell calcium from uric acid stones.
    src: { page: 150, quote: "CT urography has replaced IV urography in many centers; it is more sensitive in detect-ing small or radiolucent stones" }
    status: unverified
  # ---------- p151-153: extrarenal ----------
  - id: neph.L07.039
    kind: card
    topic: adpkd-extrarenal
    front: What is the most common extrarenal manifestation of ADPKD?
    back: Polycystic liver disease (PLD), seen with both PKD1 and PKD2.
    src: { page: 151, quote: "Polycystic Liver Disease PLD is the most common extrarenal manifestation of ADPKD." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.040
    kind: card
    topic: adpkd-extrarenal
    front: Which women with ADPKD have worse polycystic liver disease?
    back: Those with multiple pregnancies, or who used oral contraceptives or postmenopausal estrogen replacement.
    src: { page: 151, quote: "Women who have multiple pregnancies or who have used oral contraceptives (OCs) or estrogen replacement therapy (ERT)" }
    status: unverified
  - id: neph.L07.041
    kind: enumerate
    topic: adpkd-extrarenal
    prompt: Mention symptoms and mass-effect complications of polycystic liver disease.
    points:
      - Dyspnea and orthopnea
      - Early satiety and gastroesophageal reflux
      - Mechanical low back pain, uterine prolapse, rib fracture
      - Hepatic venous outflow obstruction
      - IVC or portal vein compression
      - Bile duct compression with obstructive jaundice
    pass: 4
    src: { page: 151, quote: "Symptoms include dyspnea, orthopnea, early satiety, gastroesophageal reflux, mechanical low back pain, uterine prolapse, and even rib fracture." }
    status: unverified
  - id: neph.L07.042
    kind: card
    topic: adpkd-extrarenal
    front: Are hepatic cysts common in children with ADPKD?
    back: No, they are exceedingly rare in children; their frequency rises with age.
    src: { page: 151, quote: "Hepatic cysts are exceedingly rare in children with ADPKD. Their frequency increases with age" }
    status: unverified
  - id: neph.L07.043
    kind: cloze
    topic: adpkd-extrarenal
    text: "Intracranial aneurysms occur in about {{c1::8%}} of ADPKD patients: {{c2::6%}} with a negative and {{c3::16%}} with a positive family history."
    src: { page: 151, quote: "intracranial aneurysms occur in 6% of patients with a negative family history and 16% of those with a positive family history" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.044
    kind: cloze
    topic: adpkd-extrarenal
    text: "Yearly aneurysm rupture risk rises from under {{c1::0.5%}} for aneurysms below 5 mm to {{c2::4%}} above 10 mm; rupture carries {{c3::35–55%}} severe morbidity and mortality."
    src: { page: 151, quote: "ranging from less than 0.5% for aneurysms smaller than 5 mm in diameter to 4% for aneurysms larger than 10 mm" }
    status: unverified
    tags: [numbers]
  - id: neph.L07.045
    kind: card
    topic: adpkd-extrarenal
    front: How can an unruptured intracranial aneurysm in ADPKD present?
    back: Most are asymptomatic; an enlarging one may compress local structures and cause focal signs such as cranial nerve palsy or seizure.
    src: { page: 151, quote: "Focal findings, such as cranial nerve palsy and seizure, may result from compression of local structures by an enlarging aneurysm" }
    status: unverified
  - id: neph.L07.046
    kind: cloze
    topic: adpkd-extrarenal
    text: "Mean age at aneurysm rupture in ADPKD is {{c1::39}} years (vs {{c2::51}} in the general population); up to {{c3::29%}} have normal BP at rupture."
    src: { page: 152, quote: "The mean age at rupture in ADPKD is 39 years (vs. 51 years in the general population)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.047
    kind: enumerate
    topic: adpkd-extrarenal
    prompt: Mention indications to screen ADPKD patients for intracranial aneurysm.
    points:
      - Family history of intracranial aneurysm or subarachnoid hemorrhage
      - Previous aneurysmal rupture
      - Elective surgery with possible hemodynamic instability
      - High-risk occupation (airline pilots)
      - Significant anxiety despite adequate information
    pass: 4
    src: { page: 152, quote: "Indications for screening in patients with a good life expectancy include family history of intracranial aneurysm or subarachnoid hemorrhage" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.048
    kind: card
    topic: adpkd-extrarenal
    front: What is the imaging of choice to screen for intracranial aneurysm in ADPKD, and why?
    back: "Magnetic resonance angiography: noninvasive and needs no IV contrast. CT angiography is an alternative if contrast is allowed."
    src: { page: 152, quote: "Magnetic resonance angiography is the diagnostic imaging modality of choice for presymptomatic screening" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.049
    kind: cloze
    topic: adpkd-extrarenal
    text: "Patients with a strong family history of aneurysm or rupture should be re-screened after {{c1::5–10}} years."
    src: { page: 152, quote: "Repeated screening of patients with a strong family history of intra-cranial aneurysms or aneurysmal rupture after 5 to 10 years is recommended." }
    status: unverified
    tags: [numbers]
  - id: neph.L07.050
    kind: mcq
    topic: adpkd-extrarenal
    stem: A 34-year-old woman with ADPKD has no symptoms and a normal neurological exam. Her mother died of a subarachnoid hemorrhage. What should you offer?
    options:
      - Screening magnetic resonance angiography
      - Contrast CT of the brain every year
      - Cerebral catheter angiography
      - "No screening: it is never indicated"
      - Lumbar puncture
    answer: 0
    why:
      - "Correct: a family history of SAH is an indication, and MRA is the modality of choice (p152)."
      - Contrast CT is not the screening test, and yearly scans are not advised.
      - Catheter angiography is invasive and not used for screening.
      - Screening is not for everyone, but a family history is an indication.
      - LP is for suspected acute bleeding, not screening.
    src: { page: 152, quote: "Magnetic resonance angiography is the diagnostic imaging modality of choice for presymptomatic screening" }
    status: unverified
  - id: neph.L07.051
    kind: enumerate
    topic: adpkd-extrarenal
    prompt: Mention vascular abnormalities associated with ADPKD.
    points:
      - Thoracic aortic dissection
      - Cervicocephalic arterial dissection
      - Coronary artery aneurysms
      - Retinal artery and vein occlusions
    pass: 3
    src: { page: 152, quote: "Vascular abnormalities, such as thoracic aortic and cervicocephalic arte- rial dissections, coronary artery aneurysms, and retinal artery and vein occlusions" }
    status: unverified
  - id: neph.L07.052
    kind: card
    topic: adpkd-extrarenal
    front: What is the most common valvular abnormality in ADPKD, and how often?
    back: Mitral valve prolapse, in up to 25% on echocardiography.
    src: { page: 153, quote: "Mitral valve prolapse is the most common valvular abnormality and has been demonstrated in up to 25% of patients with ADPKD" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.053
    kind: card
    topic: adpkd-extrarenal
    front: Should every ADPKD patient have a screening echocardiogram?
    back: No, only if a murmur is heard on examination.
    src: { page: 153, quote: "Screening echocardiography is not indicated unless a murmur is detected on physical examination." }
    status: unverified
  - id: neph.L07.054
    kind: table
    topic: adpkd-extrarenal
    title: Other extrarenal cysts and findings in ADPKD
    columns: [Finding, Frequency or note]
    rows:
      - [Seminal vesicle cysts, "40% (vs 2% of unaffected men), usually multiple and bilateral"]
      - [Arachnoid membrane cysts, "8%"]
      - [Pancreatic cysts, "5%, almost always asymptomatic"]
      - [Small pericardial effusion on CT, "Up to 35%"]
      - [Ovarian cysts, Not associated with ADPKD]
      - [Sperm abnormalities, "Defective motility; rarely male infertility"]
    blanks: [[0, 1], [1, 1], [2, 1], [4, 1]]
    src: { page: 153, quote: "Seminal vesicle cysts, usually multiple and bilateral, are found in 40% of ADPKD compared with 2% of non affected males." }
    status: unverified
    tags: [numbers]
  - id: neph.L07.055
    kind: card
    topic: adpkd-extrarenal
