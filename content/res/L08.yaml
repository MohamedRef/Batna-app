  - id: res.L08.030
    kind: mcq
    topic: designs
    stem: A study of physicians compares the occurrence of lung cancer in smokers with that in non-smokers. The design is
    options: [Cross sectional, Correlation study, Prospective cohort, Case control, Retrospective cohort]
    answer: 2
    why:
      - Nothing here measures disease and exposure at one moment.
      - Correlation studies use group-level data, not individuals.
      - Groups are defined by exposure (smoking) and the occurrence of new cancers is compared, which is the classic doctors' cohort (Doll and Hill).
      - A case-control study would start from people who already have lung cancer.
      - Nothing says the data come from past records.
