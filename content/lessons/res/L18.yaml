lessons:
  # ------------------------------------------------------------------
  - id: res.L18.lesson1
    title: "الـ non-parametric: لما الداتا متمشيش على الـ bell"
    hook: "الـ t-test بيحب الداتا normal زي الجرس. طب لو الداتا مايلة؟ ليها توأم تاني."
    minutes: 8
    pages: [2, 4]
    topics: [nonparametric]
    goals:
      - "تعرف ميزتين الـ non-parametric tests وبيختبروا إيه"
      - "تفتكر الـ normal curve: 68، 95، 99"
      - "تطلّع لكل parametric test التوأم الـ non-parametric بتاعه"
    status: unverified
    steps:
      - kind: explain
        page: 2
        quote: "Non parametric tests\nAdvantages:\n1- Don't assume a normal distribution (distribution free methods)\n2- Small sample sizes\nThey actually test the hypothesis that medians (or mean rank), rather than mean, are equal."
        title: "ليه نسيب الـ t-test أصلًا؟"
        text: |
          الـ **parametric tests** (زي الـ t-test والـ ANOVA) بتفترض إن الداتا **normal**، وبتقارن **means**.

          الـ ==non-parametric tests== ليها ميزتين:
          - **مش بتفترض normal distribution**، عشان كده اسمها **distribution free methods**.
          - تنفع مع الـ **small sample sizes**.

          والأهم: هي بتختبر إن الـ ==medians (or mean rank)== متساوية، **مش** الـ means.
      - kind: reveal
        page: 2
        quote: "They actually test the hypothesis that medians (or mean rank), rather than mean, are equal."
        prompt: "ليه منطقي إن الـ test اللي مش بيفترض normal يقارن medians مش means؟"
        answer: |
          لأن في الداتا الـ **skewed** الـ mean بيتشد ناحية القيم المتطرفة (مريض واحد قعد 90 يوم في القسم يبوّظ الـ mean). الـ **median** والـ **ranks** مش بيتأثروا بيه.

          عشان كده الـ non-parametric بيرتّب القيم (1، 2، 3…) ويشتغل على **الرتب**.
      - kind: figure
        page: 3
        quote: "Empirical properties of the standard normal distribution\nBp 120±10 mm/Hg\n-2.58 -1.96 -1.00 0 1.00 1.96 2.58\n68% of area\n95% of area\n99% of area"
        title: "الجرس: 68، 95، 99"
        alt: "A bell-shaped normal curve centred on 0 (blood pressure 120). Vertical lines mark ±1, ±1.96 and ±2.58 standard deviations. Brackets underneath read 68% of area for ±1 SD (110 to 130), 95% for ±1.96 SD and 99% for ±2.58 SD."
        caption: "ضغط متوسطه **120 ± 10**: حوالي **68%** بين 110 و130، و**95%** جوه ±1.96 SD، و**99%** جوه ±2.58 SD. ده الشكل اللي الـ parametric tests بتفترضه."
        svg: |
          <svg viewBox="0 0 330 222" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 149.6 L20 149.4 L25 149.1 L30 148.7 L35 148.2 L40 147.6 L45 146.7 L50 145.6 L55 144.2 L60 142.4 L65 140.3 L70 137.6 L75 134.4 L80 130.7 L85 126.3 L90 121.3 L95 115.7 L100 109.5 L105 102.7 L110 95.5 L115 88.0 L120 80.2 L125 72.5 L130 65.0 L135 57.9 L140 51.4 L145 45.8 L150 41.2 L155 37.8 L160 35.7 L165 35.0 L170 35.7 L175 37.8 L180 41.2 L185 45.8 L190 51.4 L195 57.9 L200 65.0 L205 72.5 L210 80.2 L215 88.0 L220 95.5 L225 102.7 L230 109.5 L235 115.7 L240 121.3 L245 126.3 L250 130.7 L255 134.4 L260 137.6 L265 140.3 L270 142.4 L275 144.2 L280 145.6 L285 146.7 L290 147.6 L295 148.2 L300 148.7 L305 149.1 L310 149.4 L315 149.6" class="fg-ink" fill="none"/>
            <line x1="10" y1="150" x2="320" y2="150" class="fg-thin"/>
            <line x1="165" y1="35" x2="165" y2="150" class="fg-thin"/>
            <line x1="120" y1="80" x2="120" y2="150" class="fg-thin"/><line x1="210" y1="80" x2="210" y2="150" class="fg-thin"/>
            <line x1="77" y1="126" x2="77" y2="150" class="fg-thin"/><line x1="253" y1="126" x2="253" y2="150" class="fg-thin"/>
            <line x1="49" y1="143" x2="49" y2="150" class="fg-thin"/><line x1="281" y1="143" x2="281" y2="150" class="fg-thin"/>
            <g class="t-sm" text-anchor="middle">
              <text x="77" y="163">-1.96</text><text x="120" y="163">-1</text><text x="165" y="163">0</text><text x="210" y="163">+1</text><text x="253" y="163">+1.96</text>
              <text x="40" y="163">-2.58</text><text x="290" y="163">+2.58</text>
            </g>
            <g class="t-sm t-mut" text-anchor="middle"><text x="120" y="70">110</text><text x="165" y="28">120</text><text x="210" y="70">130</text></g>
            <line x1="120" y1="178" x2="210" y2="178" class="fg-arrow-acc" stroke-width="2"/><text x="165" y="175" text-anchor="middle" class="t-sm t-acc t-b">68%</text>
            <line x1="77" y1="196" x2="253" y2="196" class="fg-arrow" stroke-width="2"/><text x="165" y="193" text-anchor="middle" class="t-sm t-b">95%</text>
            <line x1="49" y1="214" x2="281" y2="214" class="fg-arrow" stroke-width="2"/><text x="165" y="211" text-anchor="middle" class="t-sm t-mut">99%</text>
            <text x="320" y="20" text-anchor="end" class="t-sm t-b">BP 120 ± 10 mmHg</text>
          </svg>
      - kind: check
        page: 3
        quote: "Empirical properties of the standard normal distribution\nBp 120±10 mm/Hg\n-2.58 -1.96 -1.00 0 1.00 1.96 2.58\n68% of area\n95% of area\n99% of area"
        question: "BP is 120 ± 10 mmHg and normally distributed. About what share of people lie between 110 and 130?"
        options: ["68%", "95%", "99%", "50%"]
        answer: 0
        why:
          - "صح: 110–130 = mean ± 1 SD = حوالي 68%."
          - "الـ 95% محتاجة ±1.96 SD، يعني 100.4 لـ 139.6."
          - "الـ 99% محتاجة ±2.58 SD."
          - "50% هي اللي فوق الـ mean أو تحته، مش ±1 SD."
      - kind: table
        page: 4
        quote: "| Comparison | Parametric Test | Non parametric test |\n|---|---|---|\n| One sample against the population | One sample t test | Kolmogrov Sminrov test |\n| Paired comparison (mean difference)--------one group | Paired t-test | Wilcoxon signed rank test |\n| 2 independent groups | Student t-test | Mann whitney |\n| 3 or more groups (A means) | ANOVA | Kruskall wallis |\n| Correlation (r) | Pearson | Spearman |"
        title: "كل test وتوأمه"
        columns: ["Comparison", "Parametric", "Non-parametric"]
        rows:
          - ["One sample vs population", "One-sample t-test", "Kolmogorov-Smirnov"]
          - ["Paired (same group twice)", "Paired t-test", "Wilcoxon signed rank"]
          - ["2 independent groups", "Student t-test", "Mann-Whitney"]
          - ["3 or more groups", "ANOVA", "Kruskal-Wallis"]
          - ["Correlation (r)", "Pearson", "Spearman"]
        hide: [[1, 2], [2, 2], [3, 2], [4, 2]]
      - kind: mnemonic
        page: 4
        quote: "| Paired comparison (mean difference)--------one group | Paired t-test | Wilcoxon signed rank test |\n| 2 independent groups | Student t-test | Mann whitney |\n| 3 or more groups (A means) | ANOVA | Kruskall wallis |\n| Correlation (r) | Pearson | Spearman |"
        word: "WMKS"
        parts:
          - { key: "W", text: "Wilcoxon signed rank: نفس الناس مرتين (paired) ← بدل الـ paired t-test." }
          - { key: "M", text: "Mann-Whitney: مجموعتين مختلفتين ← بدل الـ Student t-test." }
          - { key: "K", text: "Kruskal-Wallis: 3 مجموعات أو أكتر ← بدل الـ ANOVA." }
          - { key: "S", text: "Spearman: correlation ← بدل الـ Pearson." }
        hook: "«**W**ala **M**ish **K**ida **S**a7» 😄: Wilcoxon للـ paired، Mann-Whitney لاتنين، Kruskal لـ 3+، وSpearman للـ correlation. والـ «**S**igned» في Wilcoxon بتفكرك إن نفس الشخص بيمضي مرتين (قبل وبعد)."
      - kind: aside
        tone: trap
        page: 4
        quote: "| Paired comparison (mean difference)--------one group | Paired t-test | Wilcoxon signed rank test |\n| 2 independent groups | Student t-test | Mann whitney |"
        text: |
          أشهر فخ: **Wilcoxon** vs **Mann-Whitney**.

          - نفس المرضى **قبل وبعد** العلاج = **paired** ← Wilcoxon signed rank.
          - رجالة vs ستات، أو شغالين vs ربات بيوت = **independent** ← Mann-Whitney.

          اسأل نفسك الأول: **نفس الناس ولا ناس تانيين؟**
      - kind: update
        page: 4
        quote: "| One sample against the population | One sample t test | Kolmogrov Sminrov test |"
        text: "الـ Kolmogorov-Smirnov one-sample test بيقارن **شكل التوزيع كله** بتوزيع مرجعي (وغالبًا بيتستخدم يشيك على الـ normality). كتب الإحصاء بتحط Wilcoxon signed rank (أو الـ sign test) لمقارنة median عينة واحدة برقم ثابت. في الامتحان: جدول الدكتورة."
        ref: "Altman, Practical Statistics for Medical Research, 1991"
      - kind: sort
        page: 4
        quote: "| Comparison | Parametric Test | Non parametric test |\n|---|---|---|\n| One sample against the population | One sample t test | Kolmogrov Sminrov test |\n| Paired comparison (mean difference)--------one group | Paired t-test | Wilcoxon signed rank test |\n| 2 independent groups | Student t-test | Mann whitney |\n| 3 or more groups (A means) | ANOVA | Kruskall wallis |\n| Correlation (r) | Pearson | Spearman |"
        prompt: "حط كل test في عيلته."
        bins: ["Parametric", "Non-parametric"]
        cards:
          - { text: "Paired t-test", bin: 0 }
          - { text: "Wilcoxon signed rank", bin: 1 }
          - { text: "ANOVA", bin: 0 }
          - { text: "Kruskal-Wallis", bin: 1 }
          - { text: "Pearson", bin: 0 }
          - { text: "Spearman", bin: 1 }
          - { text: "Mann-Whitney", bin: 1 }
          - { text: "Student t-test", bin: 0 }
        why: "الـ parametric بيفترض normal ويقارن means؛ التوأم الـ non-parametric بيشتغل على الـ ranks والـ medians."
      - kind: check
        page: 4
        quote: "| 2 independent groups | Student t-test | Mann whitney |"
        question: "Knowledge score about osteoporosis (not normally distributed): working women vs housewives. The most suitable test is:"
        options: ["Mann-Whitney test", "Student t-test", "Wilcoxon signed rank test", "ANOVA"]
        answer: 0
        why:
          - "صح: مجموعتين independent والداتا مش normal."
          - "ده الاختيار لو الـ score كان normal."
          - "ده للـ paired: نفس الستات مرتين."
          - "الـ ANOVA لـ 3 مجموعات أو أكتر، وparametric كمان."
      - kind: try
        items: [res.L18.001, res.L18.003, res.L18.006, res.L18.007, res.L18.009]
    recap:
      - "الـ non-parametric: مش بتفترض normal (distribution free)، وتنفع للـ small samples، وبتقارن medians/mean ranks."
      - "الـ normal curve: ±1 SD = 68%، ±1.96 = 95%، ±2.58 = 99%."
      - "Paired ← Wilcoxon، 2 groups ← Mann-Whitney، 3+ ← Kruskal-Wallis، correlation ← Spearman، one sample ← Kolmogorov-Smirnov."
    practice: [res.L18.001, res.L18.002, res.L18.003, res.L18.004, res.L18.005, res.L18.006, res.L18.007, res.L18.008, res.L18.009, res.L18.010]
  # ------------------------------------------------------------------
  - id: res.L18.lesson2
    title: "الـ scatter والـ r: علاقة قوية ولا ضعيفة؟"
    hook: "كل ما الوزن يزيد الضغط بيزيد؟ ارسم النقط الأول، وبعدين اسأل الـ r."
    minutes: 9
    pages: [5, 18]
    topics: [correlation]
    goals:
      - "تعرف الـ correlation وأول خطوة فيه (الـ scatter)"
      - "تقرأ الـ r: الإشارة اتجاه، والرقم قوة"
      - "تختار Pearson أو Spearman، وتحسب r²"
    status: unverified
    steps:
      - kind: explain
        page: 5
        quote: "Simple Correlation (BI-Variate)\nCorrelation is a measure of the strength of association between two quantitative variables"
        title: "الـ correlation = قوة العلاقة"
        text: |
          الـ ==correlation== (bivariate) = مقياس **لقوة العلاقة** بين **متغيرين كميين** (quantitative)، زي الطول والوزن.

          واحد فيهم **independent (explanatory)** والتاني **dependent (response)**، زي الحرارة والنبض: الحرارة بتعلى ← النبض بيعلى.
      - kind: explain
        page: 7
        quote: "In conducting correlation, we initially start by scatter plot to identify non linear relationship.\nAn important point to note is that correlation & regression describe only linear relationship"
        title: "أول خطوة دايمًا: ارسم"
        text: |
          قبل أي رقم، ارسم ==scatter diagram==: كل مريض نقطة (x = الأول، y = التاني).

          ليه؟ لأن الـ correlation والـ regression بيوصفوا **العلاقة الخطية بس** (==linear==). لو العلاقة منحنية (curvilinear)، الـ r ممكن يطلع صفر والعلاقة موجودة وقوية!
      - kind: figure
        page: 6
        quote: "Scatter diagrams\nPositive linear r = +.82\nNegative linear r = -.70\nIndependent r = 0.00\nCurvilinear r = 0.00\nCurvilinear r = 0.00"
        title: "4 أشكال للنقط"
        alt: "Four small scatter plots stacked in a 2 by 2 grid. Top left: dots rising from left to right, labelled positive linear r = +0.82. Top right: dots falling, negative linear r = -0.70. Bottom left: a shapeless cloud, independent r = 0. Bottom right: dots forming an arch, curvilinear r = 0."
        caption: "طالعة = **positive**، نازلة = **negative**، سحابة = مفيش علاقة. والقوس؟ علاقة واضحة جدًا، بس **مش خطية**، فالـ r = 0."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <g class="fg-thin"><path d="M20 15V105H155"/><path d="M180 15V105H315"/><path d="M20 135V225H155"/><path d="M180 135V225H315"/></g>
            <g class="fg-dot-good"><circle cx="35" cy="95" r="3"/><circle cx="50" cy="85" r="3"/><circle cx="62" cy="88" r="3"/><circle cx="75" cy="70" r="3"/><circle cx="90" cy="66" r="3"/><circle cx="102" cy="50" r="3"/><circle cx="118" cy="45" r="3"/><circle cx="132" cy="30" r="3"/><circle cx="145" cy="25" r="3"/></g>
            <g class="fg-dot-bad"><circle cx="195" cy="25" r="3"/><circle cx="210" cy="35" r="3"/><circle cx="222" cy="30" r="3"/><circle cx="238" cy="52" r="3"/><circle cx="252" cy="58" r="3"/><circle cx="265" cy="70" r="3"/><circle cx="280" cy="85" r="3"/><circle cx="295" cy="80" r="3"/><circle cx="305" cy="97" r="3"/></g>
            <g class="fg-dot-acc"><circle cx="40" cy="160" r="3"/><circle cx="60" cy="200" r="3"/><circle cx="75" cy="150" r="3"/><circle cx="90" cy="185" r="3"/><circle cx="105" cy="165" r="3"/><circle cx="120" cy="205" r="3"/><circle cx="135" cy="155" r="3"/><circle cx="70" cy="178" r="3"/><circle cx="125" cy="182" r="3"/></g>
            <g class="fg-dot-acc"><circle cx="190" cy="215" r="3"/><circle cx="205" cy="185" r="3"/><circle cx="220" cy="165" r="3"/><circle cx="237" cy="150" r="3"/><circle cx="252" cy="146" r="3"/><circle cx="268" cy="152" r="3"/><circle cx="283" cy="168" r="3"/><circle cx="297" cy="190" r="3"/><circle cx="310" cy="216" r="3"/></g>
            <g class="t-sm" text-anchor="middle">
              <text x="88" y="122" class="t-good">Positive linear r = +0.82</text>
              <text x="248" y="122" class="t-bad">Negative linear r = -0.70</text>
              <text x="88" y="243">Independent r = 0</text>
              <text x="248" y="243">Curvilinear r = 0</text>
            </g>
          </svg>
      - kind: check
        page: 7
        quote: "An important point to note is that correlation & regression describe only linear relationship"
        question: "A scatter of age vs a lab value forms a clear arch (U-shape) and r = 0. The best conclusion is:"
        options: ["There is no linear relation, but a curved one exists", "The two are completely unrelated", "There is a strong negative correlation", "The regression line will predict well"]
        answer: 0
        why:
          - "صح: الـ r بيقيس الخطي بس، والقوس علاقة منحنية."
          - "الـ scatter نفسه بيقول إن فيه علاقة؛ الـ r = 0 بينفي الخطية بس."
          - "الـ negative كان هيطلع r أقل من صفر."
          - "خط مستقيم على قوس هيطلع توقع وحش."
      - kind: explain
        page: 12
        quote: "Correlation coefficient \"r\"\nIt gives us an estimate of the strength and direction of the linear association between two numerical variables.\nPositive Correlation +1.00\nInverse Correlation -1.00\nNo Correlation 0.00"
        title: "الـ r بيقول حاجتين"
        text: |
          الـ ==correlation coefficient r== بيدينا تقدير لـ **قوة** و**اتجاه** العلاقة الخطية بين متغيرين رقميين. قيمته من **-1** لـ **+1**:

          - **الإشارة = الاتجاه**: موجب = الاتنين بيطلعوا مع بعض؛ سالب (inverse) = واحد يطلع والتاني ينزل.
          - **الرقم = القوة**: قريب من 1 (أو -1) = قوي؛ قريب من 0 = ضعيف.

          يعني **-0.99 و +0.99 نفس القوة بالظبط**، الفرق في الاتجاه بس.
      - kind: figure
        page: 13
        quote: "Correlation Coefficient\nShows Strength & Direction of Correlation\nStrong <- Weak | Weak -> Strong\n-1.0 -0.5 0.0 +0.5 +1.0\nNegative Correlation\nZero\nPositive Correlation"
        title: "مسطرة الـ r"
        alt: "A horizontal ruler from -1.0 to +1.0. The left half is red and labelled negative correlation, the right half green and labelled positive correlation, with zero in the middle. Arrows show strength growing from weak near 0 to strong at both ends. Bands under the ruler mark weak below 0.4, moderate 0.4 to 0.6 and strong 0.6 and above on each side."
        caption: "القوة بتزيد كل ما تبعد عن الصفر **في الاتجاهين**. والإشارة بس بتقولك العلاقة طردية ولا عكسية."
        svg: |
          <svg viewBox="0 0 330 160" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L18a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <text x="92" y="22" text-anchor="middle" class="t-sm t-bad t-b">Negative (inverse)</text>
            <text x="238" y="22" text-anchor="middle" class="t-sm t-good t-b">Positive</text>
            <line x1="135" y1="36" x2="30" y2="36" class="fg-arrow" marker-end="url(#L18a)"/>
            <line x1="195" y1="36" x2="300" y2="36" class="fg-arrow" marker-end="url(#L18a)"/>
            <text x="165" y="40" text-anchor="middle" class="t-sm t-mut">stronger</text>
            <line x1="20" y1="62" x2="165" y2="62" class="fg-arrow-bad" stroke-width="5"/>
            <line x1="165" y1="62" x2="310" y2="62" class="fg-arrow" stroke-width="5"/>
            <g class="fg-thin"><line x1="69" y1="52" x2="69" y2="72"/><line x1="117" y1="52" x2="117" y2="72"/><line x1="213" y1="52" x2="213" y2="72"/><line x1="261" y1="52" x2="261" y2="72"/><line x1="165" y1="48" x2="165" y2="76"/></g>
            <g class="t-sm" text-anchor="middle">
              <text x="20" y="88">-1</text><text x="69" y="88">-0.6</text><text x="117" y="88">-0.4</text><text x="165" y="88">0</text><text x="213" y="88">+0.4</text><text x="261" y="88">+0.6</text><text x="310" y="88">+1</text>
            </g>
            <g class="t-sm t-b" text-anchor="middle">
              <text x="44" y="110">strong</text><text x="93" y="110">mod.</text><text x="141" y="110">weak</text>
              <text x="189" y="110">weak</text><text x="237" y="110">mod.</text><text x="286" y="110">strong</text>
            </g>
            <text x="165" y="138" text-anchor="middle" class="t-sm t-mut">r = 0: no linear association · r = ±1: perfect</text>
            <text x="165" y="154" text-anchor="middle" class="t-sm t-mut">(bands drawn evenly, not to scale)</text>
          </svg>
      - kind: table
        page: 15
        quote: "Strength of Correlation coefficient \"r\"\nr = 0 : no association\n0 < r <0.4 : weak association\n0.6 > r ≥ 0.4 : moderate association\n1 > r ≥ 0.6 : strong association\nr = 1 : perfect association"
        title: "قوة الـ r (بالقيمة المطلقة)"
        columns: ["r", "Association"]
        rows:
          - ["0", "No association"]
          - ["0 to < 0.4", "Weak"]
          - ["0.4 to < 0.6", "Moderate"]
          - ["0.6 to < 1", "Strong"]
          - ["1", "Perfect"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: tip
        page: 15
        quote: "0 < r <0.4 : weak association\n0.6 > r ≥ 0.4 : moderate association\n1 > r ≥ 0.6 : strong association"
        text: |
          احفظ رقمين بس: **0.4** و **0.6**.

          تحت 0.4 ضعيف، من 0.4 لـ 0.6 متوسط، و0.6 وطالع قوي. وبص على الرقم **من غير الإشارة**.
      - kind: check
        page: 15
        quote: "0 < r <0.4 : weak association\n0.6 > r ≥ 0.4 : moderate association\n1 > r ≥ 0.6 : strong association"
        question: "Age and a test score: r = −0.45. This is:"
        options: ["A moderate inverse association", "A weak inverse association", "A strong inverse association", "A moderate positive association"]
        answer: 0
        why:
          - "صح: 0.45 بين 0.4 و0.6 = moderate، والسالب = inverse."
          - "الضعيف تحت 0.4."
          - "القوي من 0.6 وطالع."
          - "الإشارة سالبة، يبقى inverse."
      - kind: explain
        page: 17
        quote: "If the two variables are normally distributed Pearson correlation is calculated while if not normally distributed Spearman rank correlation is calculated."
        title: "Pearson ولا Spearman؟"
        text: |
          نفس قاعدة الدرس اللي فات:

          - الاتنين **normally distributed** ← ==Pearson correlation==.
          - مش normal ← ==Spearman rank correlation== (بيشتغل على الرتب). وبينفع كمان مع متغير **رتبي** زي درجات شدة المرض.
      - kind: explain
        page: 18
        quote: "Coefficient of determination (r2)\nIt is the square of (r) .\nit is expressed as % of variation in dependent variable accounted or explained by the other variable (independent)\nExample: if (r) is 0.9 between temperature & pulse, it means that 81% of variation in pulse is explained by temperature."
        title: "r² = النسبة اللي اتفسرت"
        text: |
          الـ ==coefficient of determination (r²)== = **مربع الـ r**.

          معناه: **كام %** من التغير (variation) في الـ **dependent** بيتفسر بالـ **independent**.

          مثال الدكتورة: r = 0.9 بين الحرارة والنبض ← r² = 0.81 ← **81%** من التغير في النبض بتفسره الحرارة. والـ 19% الباقيين؟ عوامل تانية (قلق، أنيميا، أدوية…).
