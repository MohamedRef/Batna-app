  - id: neph.L02.lesson5
    title: "الحموضة والبوتاسيوم"
    hook: "الكلية وهي بتنضّف الحمض بتليّف نفسها. والبوتاسيوم في الخيارة غير البوتاسيوم في بديل الملح."
    minutes: 9
    pages: [53, 55]
    topics: [acidosis, potassium]
    goals:
      - "تعرف أرقام البيكربونات وليه الحموضة بتأذي"
      - "تمشي على سلّم علاج الـ hyperkalemia وتعرف سبب كل درجة"
      - "تعرف امتصاص البوتاسيوم من كل أكل"
    status: unverified
    steps:
      - kind: explain
        page: 53
        quote: "Aim for serum bicarbonate > 22 mmol/L. Decreases progression and improves nitrogen balance."
        title: "الـ metabolic acidosis"
        text: |
          الحموضة نفسها بتليّف الكلى (ammonium و endothelin و renin–angiotensin system (RAS) ← ==tubulointerstitial fibrosis==) وبتكسّر العضلات.

          - امنع الـ severe acidosis: ==bicarbonate < 16==
          - علشان تبطّأ الـ progression: **sodium bicarbonate** وهدف ==> 22 mmol/L==
          - راقب إن العلاج مايعليش الـ HCO3 فوق الطبيعي، ومايبوّظش الضغط أو الـ K أو الـ fluid status
      - kind: update
        page: 53
        quote: "Use dietary and/or pharmacological treatment to prevent severe acidosis (e.g., bicarbonate <16 mmol/l)."
        text: "الكتاب قال امنع الـ severe acidosis عند **bicarbonate < 16**. الـ KDIGO 2024 بيقول فكّر في العلاج الدوائي (مع الدايت أو من غيره) لما الـ bicarbonate يبقى ==< 18 mmol/L== في الكبار، والـ KDIGO 2012 كان بيعالج تحت **22**. في الامتحان اكتب رقم الكتاب: **< 16**."
        ref: "KDIGO 2024 CKD guideline, Practice Point 3.10.1"
      - kind: explain
        page: 53
        quote: "Decreases progression and improves nitrogen balance."
        title: "ليه الـ bicarbonate بيحسّن الـ nitrogen balance؟"
        text: |
          الكتاب: الـ sodium bicarbonate بهدف **> 22 mmol/L** بيقلّل الـ progression و**يحسّن الـ nitrogen balance**.

          التفسير المقبول (مش في الكتاب): الحموضة بتشغّل تكسير ==بروتين العضلات== (وده في رسمة ص 54: muscle catabolism و amino acids)، فالجسم يخسر nitrogen في البول ويضعف. لما تصلّح الحموضة، التكسير يقف والعضل يتحافظ عليه.

          وليه الكتاب بيقول راقب إن العلاج ماييجيش على الضغط والـ K والـ fluid؟ لأن الـ sodium bicarbonate فيه **sodium**، والـ sodium بيحبس مية ويعلّي الضغط.
