  - id: res.L04.039
    kind: card
    topic: case-reports
    front: Define a case series.
    back: >-
      A descriptive observational study reporting on a group of patients with a defined disease treated in a
      similar way, without a control group.
    src: { page: 38, quote: "A case series (or clinical study):\n  Case series studies are commonly used to report on a group of patients with a defined disease who have been treated in a similar manner (without a control group).\n  A type of descriptive observational study useful for identifying similar or differing characteristics between selected cases.\n  Can be prospective or retrospective and usually involves only a small number of individuals.\n  Can include either non-consecutive (includes some, but not all, of the eligible patients) or consecutive individuals (include all cases) with the same condition or disease.\n  The information gained from a case series can be used to generate clinical hypotheses which can be tested by stronger study designs such as case control study." }
