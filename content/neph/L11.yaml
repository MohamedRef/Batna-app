  - id: neph.L11.139
    kind: table
    topic: dialysis-htn
    title: Monitoring a dialysis pregnancy
    columns: [What, How or when]
    rows:
      - [Cervical incompetence, Screen at 18-20 weeks]
      - [Preeclampsia, "BP, CBC and liver function twice a month"]
      - [Uteroplacental insufficiency, Minimize BP swings during dialysis]
