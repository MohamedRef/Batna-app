        title: "أكتر abnormality: الـ hypogonadism"
        text: |
          - ==Hypogonadism== = **أكتر abnormality** في الـ endocrine function في الـ HIV (والـ adrenal = **أكتر غدة** بتتأثر؛ ما تخلطش).
          - Libido قليل في **أكتر من النص**، و impotence مع T واطي لحد **30%**.
          - الـ gonadotrophins واطية أو «inappropriately» طبيعية، يعني central. وفي دراسات تانية luteinising hormone (LH) و follicle-stimulating hormone (FSH) عاليين = primary testicular. فالاتنين موجودين.
          - أدوية: ketoconazole، ganciclovir، megestrol acetate، acyclovir، بتقلل الـ testosterone أو الـ spermatogenesis.
          - الستات: menstrual irregularities شائعة في الـ advanced HIV.
