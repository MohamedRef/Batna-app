  - id: geri.L10.lesson7
    title: "العلاج: nintedanib و pirfenidone واللي ممنوع"
    hook: "لو الـ IPF مرض fibroblasts مش التهاب، يبقى العلاج لازم يوقف الـ fibroblasts. وده بالظبط اللي الـ nintedanib بيعمله."
    minutes: 9
    pages: [184, 187]
    topics: [treatment]
    goals:
      - "تعرف الـ general strategies وليه كل واحدة"
      - "تشرح الـ nintedanib والـ pirfenidone ومشاكلهم"
      - "تعرف اللي ممنوع في الـ IPF، وعلاج الـ non-idiopathic"
    status: unverified
    steps:
      - kind: explain
        page: 184
        quote: "Therefore, in selecting patients for treatment, careful consideration should be paid to the risk-to-benefit ratio."
        title: "قرار بيتاخد مع المريض"
        text: |
          الكتاب بيبدأ بجملة صريحة: الـ **optimal medical therapy** للـ IPF ==لسه متحددتش==.

          يعني إيه؟ يعني مفيش دوا بيشفي، فلازم:

          - توازن الـ **risk-to-benefit ratio** لكل مريض.
          - والمريض **يفهم** الـ adverse effects والفايدة المتوقعة قبل ما يقرر.

          ده مهم أكتر في المسن: عنده أدوية كتير، وكلى وكبد أضعف، وممكن الأعراض الجانبية تتعبه أكتر من المرض في الأول.
      - kind: explain
        page: 184
        quote: "General Strategies\n  Management of comorbid conditions.\n  Stop smoking and offer pharmacotherapy as needed.\n  Oxygen therapy.\n  Vaccinate against influenza and pneumococcal infection."
        title: "علاج الـ IPF"
        text: |
          الـ optimal therapy لسه متحددش، فوازن الـ risk/benefit مع المريض.

          **General**: comorbidities، وقف التدخين، oxygen، vaccine للـ influenza والـ pneumococcus. التفسير المقبول (مش في الكتاب): التدخين trigger للـ epithelium، والعدوى ممكن تقلب exacerbation، فبنقفل الأبواب دي الأول.

          **Antifibrotics** (الاتنين US Food and Drug Administration (FDA) 2014):
          - ==Nintedanib== (Ofev): tyrosine kinase inhibitor على vascular endothelial growth factor (VEGF) receptor (VEGFR) و fibroblast growth factor receptor (FGFR) و platelet-derived growth factor receptor (PDGFR)، بيوقف signaling الـ fibroblast. أكتر سبب لوقفه: diarrhea، nausea، vomiting.
          - **Pirfenidone** (Esbriet): anti-inflammatory و antioxidant و antifibrotic، mechanism مش واضح؛ بيبطّأ (وأحيانًا يوقف) نزول الـ FVC ويحسّن progression-free survival.
      - kind: figure
        page: 185
        quote: "Binding to these receptors blocks the intracellular signaling, which is crucial for the proliferation, migration, and transformation of fibroblasts, representing essential mechanisms of the idiopathic pulmonary fibrosis pathology."
        title: "الـ nintedanib بيقفل إيه؟"
        alt: "Three growth factors (VEGF, FGF, PDGF) reach three receptors (VEGFR, FGFR, PDGFR) on the fibroblast membrane. Inside, the tyrosine kinase signal is blocked by nintedanib. Below, the fibroblast's proliferation, migration and transformation to myofibroblast are crossed out."
        caption: "الـ cytokines اللي شفتها في الـ pathogenesis بتكلّم الـ fibroblast عن طريق receptors. الـ nintedanib بيقطع الخط جوّه الخلية، فالـ fibroblast ما يسمعش الأمر."
