  - id: rheum.L17.lesson4
    title: "علاج الـ AS: الأدوية وليه كل واحد"
    hook: "في الـ RA الـ methotrexate ملك. في الـ AS الـ csDMARDs ما بتعملش حاجة للضهر خالص."
    minutes: 9
    pages: [290, 292]
    topics: [drugs]
    goals:
      - "تعرف دور الـ NSAIDs والـ csDMARDs والـ steroids في الـ AS وليه"
      - "تعرف الـ TNFi والـ IL-17i والـ JAKi وأعراضهم"
      - "تعرف الـ screening قبل الـ biologic والجراحة"
    status: unverified
    steps:
      - kind: explain
        page: 290
        title: "الهدف والبداية"
        quote: "Treatment is aimed at maintaining normal upright posture & spinal mobility and reducing pain and stiffness."
        text: |
          ==مفيش cure==. الهدف: **وقفة مفرودة**، ضهر بيتحرك، وألم و stiffness أقل.

          **لكل العيانين**: education، ==وقف التدخين==، depression screening، دعم نفسي، وتظبيط الـ comorbidities.

          **Physical therapy** مهم جدًا: تمارين في البيت، breathing، **swimming** و hydrotherapy.

          ليه وقف التدخين والـ breathing بالذات؟ التفسير المقبول (مش في الكتاب): الـ chest expansion محدود أصلًا والرئة ممكن يجيلها apical fibrosis، فالتدخين بيزوّد الحمل على صدر مش قادر يتمدد. والـ swimming بيحرّك العمود كله من غير حمل.
      - kind: figure
        page: 290
        quote: "Sulfasalazine: in doses reaching 1 gram twice daily is sometimes effective in relieving symptoms especially for peripheral arthritis but has little symptomatic effect on spinal and sacroiliac disease."
        title: "مين بيشتغل على الضهر ومين على الأطراف"
        alt: "Two columns. Axial disease (spine, sacroiliac): NSAIDs, TNF inhibitors, IL-17A inhibitors, JAK inhibitors work; sulfasalazine, methotrexate and systemic steroids do not. Peripheral arthritis and enthesitis: NSAIDs, local steroid injection, sulfasalazine, then biologics."
        caption: "الضهر (==axial==) بيرد على الـ NSAIDs والـ biologics والـ JAKi بس. الـ **csDMARDs** (SSZ، MTX) تنفع للأطراف، مش للضهر."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="8" width="152" height="234" rx="8" class="fg-acc"/>
