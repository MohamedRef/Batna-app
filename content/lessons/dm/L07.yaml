schema: batna.lesson/v1
lecture: dm.L07
lessons:
  # ------------------------------------------------------------------
  - id: dm.L07.lesson1
    title: "القلب لما أعصابه تتقطع: CAN"
    hook: "مريض سكر نبضه 95 وثابت، ومش بيتغير لا بالنفس ولا بالوقوف: ده مش «قلق»، ده CAN."
    minutes: 8
    pages: [76, 77]
    topics: [definition, prevalence]
    goals:
      - "تعرّف الـ CAN وتعرف قاعدة الـ two tests وليه اتنين"
      - "تفرّق الـ transient من الـ symptomatic"
      - "تحفظ الـ prevalence"
    status: unverified
    steps:
      - kind: explain
        page: 76
        title: "يعني إيه CAN؟"
        quote: "Definition Cardiovascular autonomic neuropathy is a common form of autonomic neuropathy, causing abnormalities in heart rate control and central and peripheral vascular dynamics."
        text: |
          الـ ==Cardiovascular autonomic neuropathy== نوع شائع من الـ autonomic neuropathy، بيبوّظ:
          - **heart rate control**
          - **central and peripheral vascular dynamics** (الضغط وتوزيع الدم)

          القلب عنده دواسة بنزين (**sympathetic**) وفرامل (**vagus**). الـ cardiovascular autonomic neuropathy (CAN) بيقطع السلكين.

          ليه الاتنين (القلب والأوعية) بيتأثروا مع بعض؟ لأن نفس الأسلاك اللي بتسرّع وتبطّأ القلب هي اللي بتضيّق وتوسّع الأوعية. السلك لما يتقطع، الاتنين يفقدوا التحكم في نفس الوقت.
      - kind: figure
        page: 76
        quote: "Definition Cardiovascular autonomic neuropathy is a common form of autonomic neuropathy, causing abnormalities in heart rate control and central and peripheral vascular dynamics."
        title: "دواسة البنزين والفرامل"
        alt: "Diagram. The brainstem sends two wires: the vagus (parasympathetic, brake) to the heart and the sympathetic (accelerator) to the heart and the blood vessels. In CAN both wires are cut, shown by red crosses, so heart rate control and vascular dynamics are lost."
        caption: "التفسير المقبول (مش في الكتاب): الـ ==vagus== فرامل للقلب، والـ **sympathetic** بنزين للقلب وللأوعية. الـ CAN بيقطع الاتنين، فيبوّظ الـ **heart rate control** والـ **vascular dynamics** زي ما الكتاب بيقول."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L07a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="fg-head"/></marker></defs>
            <rect x="110" y="10" width="110" height="34" rx="8" class="fg-ink"/>
            <text x="165" y="32" text-anchor="middle" class="t-sm t-b">Brainstem</text>
            <path d="M130 44 L60 150" class="fg-arrow" marker-end="url(#L07a)"/>
            <path d="M200 44 L250 150" class="fg-arrow-acc" marker-end="url(#L07a)"/>
            <path d="M200 44 L110 150" class="fg-arrow-acc" marker-end="url(#L07a)"/>
            <text x="20" y="90" class="t-sm t-b">Vagus</text>
            <text x="20" y="105" class="t-sm t-mut">brake</text>
            <text x="245" y="90" class="t-sm t-b t-acc">Sympathetic</text>
            <text x="245" y="105" class="t-sm t-mut">accelerator</text>
            <text x="82" y="102" class="t-lg t-bad t-b">×</text>
            <text x="216" y="92" class="t-lg t-bad t-b">×</text>
            <rect x="30" y="152" width="110" height="34" rx="8" class="fg-bad"/>
            <text x="85" y="174" text-anchor="middle" class="t-sm t-b">Heart rate</text>
            <rect x="195" y="152" width="120" height="34" rx="8" class="fg-bad"/>
            <text x="255" y="174" text-anchor="middle" class="t-sm t-b">Blood vessels</text>
            <text x="165" y="215" text-anchor="middle" class="t-sm t-mut">CAN: both wires cut</text>
          </svg>
      - kind: explain
        remind: [dm.L07.003]
        page: 76
        title: "التشخيص: اتنين من أربعة"
        quote: "c. Diagnostic Criteria To diagnose CAN, at least two of the four autonomic tests should be abnormal:\n  a. HRV: Deep breathing\n  b. HRV: Lying to Standing\n  c. HRV: Valsalva Manoveure\n  d. Orthostatic hypotension"
        text: |
          علشان تقول **CAN** لازم ==at least two== من الـ **autonomic tests** يطلعوا abnormal:
          1. **Heart rate variability (HRV)** مع **deep breathing**
          2. **HRV** من **lying to standing**
          3. **HRV** مع **Valsalva**
          4. **Orthostatic hypotension** (نزول الـ systolic blood pressure (SBP) مع الوقوف)

          واللي عندهم **two or more** positive tests عندهم dysfunction أشد و co-morbidities أكتر و mortality أعلى.
      - kind: check
        page: 76
        quote: "c. Diagnostic Criteria To diagnose CAN, at least two of the four autonomic tests should be abnormal:\n  a. HRV: Deep breathing\n  b. HRV: Lying to Standing\n  c. HRV: Valsalva Manoveure\n  d. Orthostatic hypotension"
        question: "How many abnormal autonomic tests are needed to diagnose CAN?"
        options: ["At least two", "One", "All four", "Three"]
        answer: 0
        why:
          - "صح: two of the four."
          - "واحد بس مش كفاية حسب الكتاب."
          - "مش لازم الأربعة."
          - "الكتاب قال اتنين."
      - kind: reveal
        page: 76
        quote: "Studies have shown that patients with two or more positive tests have more severe autonomic dysfunction and a higher frequency of other co-morbid complications that contribute to their higher mortality risk."
        prompt: "ليه الكتاب بيطلب اتنين من أربعة، مش اختبار واحد abnormal؟"
        answer: |
          الكتاب بيدّيك نص الإجابة: اللي عندهم **two or more positive tests** عندهم **more severe autonomic dysfunction** و co-morbid complications أكتر و **higher mortality risk**. يعني الاتنين بيفرزوا اللي فعلًا في خطر.

          والتفسير المقبول (مش في الكتاب) للنص التاني: كل اختبار لوحده بيتأثر بحاجات ملهاش علاقة بالعصب، زي السن، والعيان ما نفخش كويس في الـ Valsalva، أو دوا بيبطّأ القلب. اختبار واحد ممكن يكون صدفة؛ اتنين بيتفقوا يبقى العصب نفسه هو اللي تعبان.
      - kind: explain
        page: 77
        title: "نوعين"
        quote: "Transient: occurs in newly diagnosed type1diabetic patients, minor symptoms that recover with the establishment of euglycemia."
        text: |
          - ==Transient==: في **newly diagnosed type 1**، أعراض بسيطة **بتروح** لما السكر يتظبط (**euglycemia**).
          - **Symptomatic**: عادة بيمشي مع الـ **somatic neuropathy** (يعني لو الرجل فيها neuropathy، دوّر على القلب).

          ليه الـ transient بيخف؟ التفسير المقبول (مش في الكتاب): في الأول العصب **متسمم** من السكر العالي بس لسه **سليم في تركيبه**، فلما السكر يتظبط الشغل يرجع. مع السنين الألياف نفسها بتموت، وده اللي بيخلي الـ symptomatic مش بيرجع بسهولة. وعشان نفس العملية بتضرب أعصاب الرجل، الـ symptomatic غالبًا بيمشي مع الـ **somatic neuropathy**.
      - kind: table
        page: 77
        quote: "Cardiovascular autonomic neuropathy occurs in ~17% of patients with type 1 diabetes and 22% of those with type 2."
        title: "الـ prevalence"
        columns: [Group, CAN, Borderline]
        rows:
          - ["Type 1", "~17%", "+9%"]
          - ["Type 2", "22%", "+12%"]
        hide: [[0, 1], [1, 1]]
      - kind: aside
        tone: tip
        page: 77
        quote: "Cardiovascular autonomic neuropathy occurs in ~17% of patients with type 1 diabetes and 22% of those with type 2."
        text: "افتكرها كده: **type 1 = 17**، و **type 2 = 22** (2 و 2). والـ borderline: **9 و 12**."
      - kind: check
        page: 77
        quote: "Transient: occurs in newly diagnosed type1diabetic patients, minor symptoms that recover with the establishment of euglycemia."
        question: "Newly diagnosed type 1 diabetic, mild autonomic symptoms that disappear once glucose is controlled. Type of CAN?"
        options:
          - "Transient"
          - "Symptomatic autonomic neuropathy"
          - "Borderline dysfunction"
          - "Autonomic cardiopathy"
        answer: 0
        why:
          - "صح: newly diagnosed type 1 + أعراض بسيطة بتروح مع الـ euglycemia = transient."
          - "الـ symptomatic بيمشي مع الـ somatic neuropathy ومش بيروح بظبط السكر."
          - "الـ borderline رقم في الـ prevalence (9% و 12%)، مش نوع إكلينيكي."
          - "الـ autonomic cardiopathy خلل في وظيفة الـ LV، مش أعراض بتختفي."
      - kind: try
        items: [dm.L07.001, dm.L07.002, dm.L07.003, dm.L07.005, dm.L07.007]
    recap:
      - "CAN = خلل في التحكم في الـ HR والـ vascular dynamics: الفرامل والبنزين اتقطعوا."
      - "التشخيص: two of four autonomic tests abnormal؛ اتنين بيفرزوا الأشد والأخطر."
      - "Transient في T1 الجديد ويروح مع euglycemia؛ symptomatic مع الـ somatic neuropathy."
      - "T1 17%، T2 22%، والـ borderline 9% و 12%."
    practice: [dm.L07.001, dm.L07.002, dm.L07.003, dm.L07.004, dm.L07.005, dm.L07.006, dm.L07.007, dm.L07.008]
