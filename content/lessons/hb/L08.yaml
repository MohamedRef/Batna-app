        text: |
          **Anabolic steroids** و **Thorotrast** موجودين في صف الـ **HCC** وصف الـ **angiosarcoma** الاتنين. والـ anabolic steroids في الـ adenoma كمان. لو السؤال "which agent causes both HCC and angiosarcoma" الإجابة واحد منهم.

          وخد بالك: الـ **vinyl chloride** طبيًا معروف أكتر بالـ **angiosarcoma**، بس جدول الكتاب حاطه في صف الـ HCC بس. في الامتحان: إجابة الكتاب.
      - kind: try
        items: [hb.L08.055, hb.L08.057, hb.L08.058, hb.L08.059, hb.L08.065]
    recap:
      - "Granulomatous: fever، sweats، RUQ، granuloma on biopsy، أول **2 months**. Drugs = **GQ CHAMP**."
      - "Drug AIH: **> 80%** female، intake **2–24 months**، AST/ALT **5–50×**، ANA/ASMA، يتحسن لما الدوا يقف."
      - "Multiple cases = **M&M's** (methyldopa، nitrofurantoin، minocycline). Flucloxacillin = AMA."
      - "VOD: herbal tea alkaloids، **BMT**، azathioprine؛ weight gain، ascites، jaundice، portal HTN."
      - "Tumours: FNH (OCP)، adenoma (OCP، anabolic، danazol)، HCC و angiosarcoma (anabolic، Thorotrast)."
