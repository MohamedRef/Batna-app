            <text x="180" y="52" class="t-sm t-good">✓ NSAIDs</text>
            <text x="180" y="72" class="t-sm t-good">✓ Local steroid</text>
            <text x="180" y="92" class="t-sm t-good">✓ Sulfasalazine</text>
