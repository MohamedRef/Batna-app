      - kind: reveal
        page: 416
        quote: "In addition, patients at high risk for TLS should receive a xanthine oxidase inhibitor (allopurinol or febuxostat) to blunt de novo formation of uric acid."
        prompt: "عيان TLS والـ uric acid بتاعه 14 فعلًا. هل الـ allopurinol هينزّله بسرعة؟"
        answer: |
          لأ. الكتاب بيقول إنه بيعمل ==blunt de novo formation==: يعني بيمنع تكوين uric acid **جديد** من الـ purines، لكنه مش بيكسّر اللي اتعمل خلاص.

          عشان كده مكانه **الوقاية** قبل الـ chemo، مش إنقاذ عيان الـ uric acid بتاعه عالي ومعاه AKI. ده محتاج hydration، ولو الكلية وقفت: dialysis.
      - kind: reveal
        page: 416
        quote: "Urinary alkalinization, which increases the solubility of uric acid in the renal tubules, is not recommended because it can increase the likelihood of calcium-phosphate precipitation and symptomatic hypocalcemia."
        prompt: "الـ uric acid بيذوب أكتر في البول القلوي. ليه الكتاب بيقول لأ للـ urinary alkalinization؟"
        answer: |
          لأن الـ **calcium phosphate** بالعكس، بيترسب أكتر في الوسط القلوي. فأنت بتحل مشكلة الـ urate وبتعمل **nephrocalcinosis** و **symptomatic hypocalcemia**.

          والـ phosphate عالي أصلًا في الـ TLS، فالمكسب مش يستاهل.
      - kind: update
        page: 416
        quote: "In addition, patients at high risk for TLS should receive a xanthine oxidase inhibitor (allopurinol or febuxostat) to blunt de novo formation of uric acid."
        ref: "Cairo et al. TLS recommendations 2010; NCCN supportive care 2024"
        text: "عمليًا الـ rasburicase (urate oxidase) بيتدّي في الـ high risk أو لو الـ uric acid عالي فعلًا، وممنوع في الـ glucose-6-phosphate dehydrogenase (G6PD) deficiency. الكتاب ذكر الـ xanthine oxidase inhibitors بس، وده اللي يتكتب في الامتحان."
