  - id: neph.L13.lesson8
    title: "اللي جاي: endothelin، TGF-β، والـ AGEs"
    hook: "العلاج الجاي بيستهدف نفس الطرق اللي شفتها في الـ pathogenesis."
    minutes: 6
    pages: [445, 446]
    topics: [future]
    goals:
      - "تعدّ أهداف العلاج المستقبلي (growth factors، vasopeptides، biochemical)"
      - "تعرف ليه الـ atrasentan بيتجرب فوق الـ RAAS blockade"
      - "تراجع الـ holistic approach بتاع KDIGO"
    status: unverified
    steps:
      - kind: explain
        remind: [neph.L13.101]
        page: 445
        title: "المستقبل"
        quote: "ETA-selective antagonists (Atrasentan) have been shown to provide renoprotective effects, supplying a rationale for clinical trials involving administration of ETA-receptor antagonists in addition to RAAS blockade in patients with diabetic nephropathy."
        text: |
          - **Growth factors:** IGF-1، growth hormone، **TGF-β**، anti-VEGF، **endothelin-1 (ETA) antagonists** زي ==atrasentan== فوق الـ renin–angiotensin–aldosterone system (RAAS) blockade.
          - **Anti-TGF-β:** الـ TGF-β **fibrogenic** ومهم في الـ DKD (نجح في الحيوانات).
          - **Biochemical:** protein kinase C inhibitors، منع تكوين الـ **advanced glycation end-products (AGE)**، AGE cross-link breakers، blockade للـ receptor بتاع الـ AGE.
      - kind: explain
        page: 445
        title: "ليه الأهداف دي بالذات؟"
        quote: "Studies performed in the last two decades have suggested that the endothelin (ET) system is an important therapeutic target for diabetic nephropathy."
        text: |
          ارجع للـ figure بتاع الـ pathogenesis (ص 427): الـ **IGF-1** والـ **TGF-β** والـ **VEGF** والـ **ET-1** كانوا مكتوبين في طريق الـ hemodynamic. يعني العلاج الجاي بيقفل **نفس الأسهم**.

