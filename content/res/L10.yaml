    kind: mcq
    topic: structure
    stem: "In designing a data collection questionnaire, which of the following are most commonly used for background variables such as marital status or education?"
    options: [Completely open-ended questions, Partially categorized questions, Closed questions, Probing questions, Leading questions]
    answer: 2
    why:
      - Open-ended questions suit exploring a topic; known categories don't need free answers.
      - A partially categorized question adds "other (please specify)" to the list; marital status needs no open option.
      - When the possible answers are known in advance, the researcher gives the choices and the respondent selects one (slide 40); this is how background variables are asked.
      - A probing question asks the interviewee to say more about a topic.
      - Leading questions are a wording error to avoid (slide 55).
    src: { page: 40, quote: "Closed-ended Questions\n  The researcher provides a choice of answers, and respondents are asked to select one or more of the alternatives given.\n  Answers can be \"yes/no\" or a choice of multiple answers." }
    status: unverified
    tags: [revision, lecturer]
  - id: res.L10.110
    kind: mcq
    topic: content
    stem: "You should avoid using double-barreled questions in a survey because:"
    options:
      - They rely too much on a respondent's memory
      - They make the questions too long, so respondents lose interest
      - They are too abstract and general in scope
      - They confuse respondents by asking about two different things
    answer: 3
    why:
      - Memory problems are handled by aided recall, not by splitting questions.
      - Length is not the problem; one short question can still hold two concepts.
      - Abstract scope is a different wording problem (define the issue, use ordinary words).
      - Each question should contain one concept; two questions combined into one confuse respondents and give unsatisfactory answers, so ask them separately (slides 20-21).
    src: { page: 21, quote: "To avoid confusion, these questions should be asked separately,\nHow many cups of the following do you drink during a typical day?\n  Coffee: ----- cups/day\n  Tea: -----cups/day" }
    status: unverified
    tags: [revision, high-yield]
  - id: res.L10.111
    kind: mcq
    topic: structure
    stem: Which of the following is a disadvantage of using closed questions in a survey?
    options:
      - They reduce the risk of variability in the way answers are recorded
      - They make answers easier to process and analyze
      - They prevent respondents from giving spontaneous, unexpected answers
      - Closed questions are quicker and easier for respondents to complete
    answer: 2
    why:
      - Uniform recording is an advantage of closed questions.
      - Easier analysis and tabulation is an advantage (slide 46).
      - Restricting responses to predefined alternatives blocks answers the researcher did not expect; open-ended questions avoid that bias (slide 37), and the list of options itself introduces bias (slide 47).
      - Being quicker and easier to answer is an advantage (slides 46 and 48).
    src: { page: 37, quote: "When to use it??\n  As first questions on a topic.\n  They enable the respondents to express general attitudes and opinions without the bias associated with restricting responses to predefined alternatives\n  This can help the researcher interpret their responses to structured questions.\n  Useful in exploratory research." }
    status: unverified
    tags: [revision]
  - id: res.L10.112
    kind: card
    topic: techniques
    front: What is the difference between a data collection technique and a data collection tool? Give examples.
    back: >-
      The technique is how you collect the data: using available information (record review), observing, interviewing,
      administering written questionnaires. The tool is what you record or measure with: checklist and data compilation
      forms, the senses with pen/paper, watch, scales or microscope, an interview guide or tape recorder, the questionnaire.
      Don't confuse the name of the tool with the technique or with the study design.
    src: { page: 6, quote: "Data collection techniques and tools\n| Data collection techniques | Data collection tools |\n|---|---|\n| Using available information | Checklist; data compilation forms |\n| Observing | Eyes and other senses, pen/paper, watch, scales, microscope, etc. |\n| Interviewing | Interview guide, checklist, questionnaire, tape recorder |\n| Administering written questionnaires | Questionnaire |" }
    status: unverified
    tags: [lecturer]
  - id: res.L10.113
    kind: card
    topic: sources
    front: Does every systematic review end in a meta-analysis?
    back: >-
      No. A systematic review integrates the findings of individual studies in a systematic, organized and structured way; a
      meta-analysis adds a summary statistical estimate of the measure of association. A systematic review may end without
      pooling when the studies are too heterogeneous or cannot be combined statistically.
    src: { page: 82, quote: "3. Systematic review\n  An approach that provides a systematic, organized, and structured way of integrating the findings of individual research studies.\n  In meta-analysis, researchers produce a summary statistical estimate of the measure of association." }
    status: unverified
