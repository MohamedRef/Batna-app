        title: "التشخيص"
        text: |
          **Blood tests:**
          - **Ceruloplasmin:** البروتين اللي بيشيل النحاس في الدم؛ غالبًا **low**.
          - **Copper:** ممكن يبقى **higher- or lower-than-normal**.
          - **ALT و AST:** عالية لو فيه liver damage.
          - **Red blood cells:** ممكن تبقى **low**.

          وكمان **liver biopsy**.
      - kind: reveal
        page: 200
        prompt: "الجسم مليان نحاس... إزاي الـ ceruloplasmin يطلع واطي؟ وإزاي الـ copper في الدم يطلع واطي أحيانًا؟"
        answer: |
          تفسير مقبول (الكتاب كاتب النتايج بس):

          - الـ **ATP7B** هو كمان اللي بيحمّل النحاس على الـ ceruloplasmin جوه الكبد. من غيره الـ ceruloplasmin بيطلع فاضي ويتكسّر بسرعة، فمستواه **بيقل**.
          - معظم النحاس اللي بنقيسه في الدم **راكب على الـ ceruloplasmin**. لما الـ ceruloplasmin يقل، **الـ total copper ممكن يقل**، مع إن النحاس **الحر** اللي بيأذي عالي. وعلشان كده الكتاب قال **higher- or lower-than-normal**.
