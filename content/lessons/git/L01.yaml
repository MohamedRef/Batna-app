  - id: git.L01.lesson6
    title: "الـ PPI صاحبك، والـ gastrinoma عدوّك"
    hook: "دوا بنكتبه كل يوم: يتكسّر بأنهي enzyme، بيتخانق مع مين، وبيعمل إيه على المدى الطويل؟ وبعدين: الـ ulcer اللي مش بيخف."
    minutes: 10
    pages: [32, 39]
    topics: [ppi, pud-management, zes]
    goals:
      - "تعدّ indications و adverse effects الـ PPI"
      - "تختار الـ PPI مع الـ clopidogrel وتعرف ليه"
      - "تشك في ZES وتمشي في الـ algorithm"
    status: unverified
    steps:
      - kind: explain
        page: 32
        quote: "With the exception of omeprazole (pregnancy class C) all PPIs have been categorized as class B agents."
        title: "الـ PPI بنكتبه في إيه؟"
        text: |
          سبعة indications:
          - **Acute peptic ulcer**
          - **NSAID ulcer**: علاج ووقاية
          - **GERD**
          - **ZES** قبل الجراحة
          - **GI hemorrhage**: علاج ووقاية
          - **Stress ulcer bleeding** في الـ critically ill
          - جزء من **H. pylori eradication**

          وفي الحمل: كل الـ PPIs **class B** ما عدا ==omeprazole (class C)==.
      - kind: explain
        page: 32
        quote: "CYP2C19 is responsible for > 80% of the metabolism of omeprazole, lansoprazole, and pantoprazole metabolism."
        title: "CYP2C19: ليه نفس الجرعة بتفرق من واحد للتاني"
        text: |
          الـ PPIs بتتكسّر بـ ==CYP2C19== و **CYP3A4**.

          - الـ CYP2C19 مسؤول عن أكتر من **80%** من metabolism الـ **omeprazole** و **lansoprazole** و **pantoprazole**.
          - فيه 4 phenotypes: **extensive**، **intermediate**، **ultra-rapid**، **poor** metabolizers.
          - في الـ **extensive** والـ **ultra-rapid**، الـ omeprazole والـ lansoprazole ممكن **ميكفوش**.
          - **Esomeprazole** (الـ S-isomer) بيتكسّر بالـ CYP2C19 أقل، و **rabeprazole** أغلبه **non-enzymatic** لـ rabeprazole thioether.
      - kind: aside
        tone: analogy
        page: 33
        quote: "the effectiveness of omeprazole and lansoprazole is sometimes insufficient in EM and ultra-rapid metabolizers."
        text: |
          الـ **ultra-rapid metabolizer** زي واحد بياكل بسرعة: تحطله الأكل، يخلّصه قبل ما تقعد. الـ omeprazole بيتهضم قبل ما يلحق يشتغل.

          علشان كده لو مريض «مش بيستجيب» على omeprazole، فكّر في الـ CYP2C19 قبل ما تقول refractory.
      - kind: match
        page: 33
        quote: "Separate medications and antacids by 4 hours."
        prompt: "التفاعل ← الحل:"
        pairs:
          - ["Omeprazole + clopidogrel", "Switch to pantoprazole"]
          - ["PPI + nelfinavir or rilpivirine", "Switch to an H2 blocker"]
          - ["PPI + Harvoni", "Omeprazole 20 mg or an H2 blocker"]
          - ["PPI + methotrexate", "H2 blocker or watch for toxicity"]
          - ["Antacid + fluoroquinolone or tetracycline", "Separate by 4 hours"]
        why: "الـ omeprazole والـ esomeprazole بيمنعوا الـ CYP2C19 اللي بيفعّل الـ clopidogrel؛ الـ pantoprazole مش بيمنعه. الـ pH العالي بيقلل امتصاص الـ antiretrovirals والـ Harvoni (وبيزوّد الـ digoxin). الـ PPI بيقلل الـ renal tubular secretion للـ methotrexate. والـ antacids بتعمل chelates."
      - kind: table
        page: 34
        quote: "Mechanism is reduced calcium absorption from increased gastric pH"
        title: "الـ PPI على المدى الطويل (سؤال امتحان)"
        columns: ["Adverse effect", "Why or note"]
        rows:
          - ["C. difficile infection", "Overgrowth at high gastric pH"]
          - ["Pneumonia", "PPIs and H2 antagonists; sucralfate spares gastric pH"]
          - ["Hip, wrist, spine fractures", "Less calcium absorption"]
          - ["Rebound reflux on stopping", "Symptoms worsen on discontinuation"]
          - ["Iron deficiency anemia", "Less iron absorption"]
          - ["Cardiac events with clopidogrel", "Avoid omeprazole; pantoprazole is fine"]
        hide: [[0, 1], [2, 1], [4, 1], [5, 1]]
      - kind: explain
        page: 34
        quote: "substitution of non-selective NSAIDs with COX-2- selective NSAIDs;"
        title: "مريض لازم ياخد NSAID؟"
        text: |
          الكتاب بيدي 3 طرق للوقاية:
          - **Co-therapy** مع **PPI** أو **H2RA** أو **misoprostol**.
          - تغيّر لـ **COX-2-selective NSAID**.
          - أو ==COX-2-selective NSAID + gastroprotective agent==.
      - kind: explain
        page: 37
        quote: "Ulcers in unusual locations; associated with severe .esophagitis; resistant to therapy with frequent recurrences;"
        title: "الـ ulcer اللي مش طبيعي: فكّر في ZES"
        text: |
          إمتى تشك في **Zollinger-Ellison**؟
          - **Multiple** ulcers أو في **أماكن غريبة** (post-bulbar).
          - مع **severe esophagitis**، **resistant**، و **بترجع** كتير.
          - ==مفيش NSAID ولا H. pylori==.
          - **Diarrhea** أو steatorrhea من غير سبب.
          - **Hypercalcemia**، أو family history لـ pancreatic islet أو pituitary أو parathyroid tumor (**MEN1**).
          - **Ulcer** راجع بعد العملية، و **prominent gastric folds**.
      - kind: reveal
        page: 37
        quote: "Gastric hypochlorhydria or achlorhydria(the most frequent), with or without pernicious anemia"
        prompt: "الـ gastrin عالي. هل كده gastrinoma؟"
        answer: |
          لأ، مش لازم. الطبيعي **<150 pg/mL**، وتقريبًا كل الـ gastrinoma فوق **150-200**، وأكتر من **10 أضعاف** الطبيعي بيرجّح ZES جامد. بس فيه أسباب تانية:

          - **Anti-secretory drugs** (الـ PPI نفسه!)
          - ==Hypochlorhydria أو achlorhydria== (الأكتر)، مع أو من غير pernicious anemia
          - **G cell hyperplasia**، **gastric outlet obstruction**، **renal insufficiency**
          - RA، vitiligo، DM، pheochromocytoma

          المنطق: لما الحمض يقل، المعدة بتعلّي الـ gastrin علشان تعوّضه. وعلشان كده بتعيد القياس.
      - kind: figure
        page: 39
        quote: "Gastric pH probe (off PPI for one week)"
        title: "الـ algorithm بتاع ZES"
        alt: "Flow chart: suspected ZES, then serum gastrin off PPI one week. If 110 to under 1000 pg/mL, secretin stimulation test: negative means reassess later, positive goes to localization. If 1000 or more, gastric pH probe: above 4.0 no further work-up, 4.0 or less goes to localization. Localization by EUS and somatostatin receptor scintigraphy; liver metastases mean medical treatment; no liver metastases means evaluate for MEN1: positive means medical treatment (surgery if pancreatic tumor over 2 cm), negative means surgical exploration."
        caption: "خطوتين قبل الصورة: gastrin **off PPI أسبوع**، وبعدين يا **secretin** يا **pH probe** حسب الرقم. الـ liver mets ← medical treatment؛ والـ MEN1 positive ← medical، والجراحة بس لو الـ pancreatic tumor أكبر من 2 cm."
        svg: |
          <svg viewBox="0 0 330 580" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="G1c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
