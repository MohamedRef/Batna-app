  - id: neph.L08.lesson7
    title: "Case 12: الـ graft بيترفض، و Banff للـ TCMR والـ ABMR"
    hook: "Creatinine طلع من 1.4 لـ 2.4 بعد sore throat. Infection؟ دوا؟ CNI؟ ولا rejection؟ الـ C4d هيقول."
    minutes: 10
    pages: [278, 284]
    topics: [transplant]
    goals:
      - "تحفظ الـ DD للـ AKI في الـ transplant وتعرف تستبعد كل سبب من الـ labs"
      - "تعرف درجات الـ TCMR (acute و chronic active) في Banff 2017"
      - "تفهم معايير الـ ABMR التلاتة، والـ C4d من غير rejection"
    status: unverified
    steps:
      - kind: explain
        remind: [neph.L08.186]
        page: 278
        title: "Case 12"
        quote: "D.D of AKI in Tx patients Pre-renal. ATN. Acute interstitial nephritis. CNI toxicity. Infections. Acute rejection."
        text: |
          راجل **36 سنة**، كلية من أخته (match 5/6) من 3 سنين، على **mycophenolate mofetil (MMF) + cyclosporine + prednisolone 5 mg**. الـ creatinine baseline 1.4، وفجأة ==2.4== بعد sore throat خد عليه azithromycin.

          الـ DD للـ acute kidney injury (AKI) في الـ transplant: **pre-renal**، **acute tubular necrosis (ATN)**، **acute interstitial nephritis (AIN)**، ==calcineurin inhibitor (CNI) toxicity==، **infections**، **acute rejection**، **recurrence**، **vascular thrombosis**، و **obstruction**.

          ليه الـ DD بالترتيب ده؟ التفسير المقبول (مش في الكتاب): التوقيت بيفرق. في أول أسبوع بعد الزرع فكّر في ATN والـ thrombosis والـ obstruction. في أول سنة فكّر في الـ acute rejection والـ CNI والـ CMV والـ BK. بعد سنين (زي هنا، 3 سنين) فكّر في الـ chronic rejection، والـ recurrence، والـ CNI المزمن. وفوق كل ده: أي **infection** أو **دوا جديد** (زي الـ azithromycin هنا) لازم يتسأل عنه، لأن الأدوية بتتفاعل مع الـ CNI.
      - kind: mnemonic
        page: 278
        quote: "D.D of AKI in Tx patients Pre-renal. ATN. Acute interstitial nephritis. CNI toxicity. Infections. Acute rejection."
        word: "PAACIRROV"
        parts:
          - { key: "P", text: "Pre-renal" }
          - { key: "A", text: "ATN" }
          - { key: "A", text: "Acute interstitial nephritis" }
          - { key: "C", text: "CNI toxicity" }
          - { key: "I", text: "Infections" }
          - { key: "R", text: "Rejection (acute)" }
          - { key: "R", text: "Recurrence of native disease" }
          - { key: "O", text: "Obstruction of the urinary tract" }
          - { key: "V", text: "Vascular thrombosis" }
        hook: "اقسمها جغرافيًا: قبل الكلية (P)، جوّه الكلية (A A C I R R)، بعدها (O)، والأوعية (V)."
      - kind: explain
        page: 278
        title: "الـ labs بتشطب إيه من الـ DD؟"
        quote: "Cyclosporine trough level: 93."
        text: |
          على الكشف: ==clinically free==، euvolemic، BP 140/70، مفيش حرارة، و urine output كويس. والـ labs:
          - urea 51، creatinine **2.57**
          - WBC 10، Hb 13.3، PLT 271
          - urine analysis **free**، no active sediment
          - CRP 9
          - ==cyclosporine trough 93==
          - CMV PCR **سلبي**

          ليه كل رقم مهم؟ التفسير المقبول (مش في الكتاب):
          - **euvolemic** مع urine كويس، فالـ pre-renal بعيد.
          - الـ cyclosporine trough مش عالي، فالـ **CNI toxicity** أبعد.
          - الـ CMV سلبي والـ urine نضيف، فالـ infection والـ recurrence (sediment نشط) أبعد.
          - الـ **azithromycin** ممكن يرفع مستوى الـ CNI، بس المستوى طلع مش عالي، ومحتاج نفكر في الـ AIN من الدوا.
          يعني بعد الشطب، أقوى احتمال **rejection**، والـ Doppler والـ biopsy هيحسموا.
      - kind: explain
        page: 279
        title: "عملوا إيه؟"
        quote: "Patient was admitted for Pulse Methyl Prednisolone 1 gm per day for 3 days He was continued on the same immunosuppressive medications."
        text: |
          الـ cyclosporine trough 93، cytomegalovirus (CMV) PCR سلبي، و Doppler طبيعي (RI 0.64–0.69).

          اتعمل ==pulse methylprednisolone 1 g × 3 أيام==، و **panel reactive antibodies (PRA)** urgent، و **biopsy**. الـ PRA طلع سلبي.

          الـ biopsy: ==C4d 3== في الـ peritubular capillaries، **moderate tubulitis**، interstitial infiltrate، و **peritubular capillaritis**.

          ليه الـ pulse قبل ما الـ biopsy يطلع؟ التفسير المقبول (مش في الكتاب): بعد ما استبعدوا الـ CNI والـ CMV والـ obstruction (Doppler طبيعي من غير hydronephrosis)، الـ **rejection** بقى الأقرب، وكل يوم تأخير بيكلّف nephrons. والـ **PRA** بيدوّر على antibodies ضد HLA، **عشان** يعرف هل فيه antibody-mediated rejection.
          والـ creatinine نزل لـ **1.7** بعد الـ pulse وبعدين رجع **2.7**: الـ steroids هدّت الـ T cells، بس الـ antibodies لسه شغّالة. وده اللي الـ C4d 3 هيأكده: فيه جزء ABMR الـ pulse لوحده ما يكفيهوش.
      - kind: figure
        page: 280
        title: "Case 12 بالـ LM والـ C4d"
        image: { file: neph/L08-tx-case12.webp, book: true }
        caption: "Tubulitis و interstitial infiltrate و **peritubular capillaritis**، والـ C4d بني ماشي ==diffuse على الـ peritubular capillaries==."
        alt: "Book panel of case 12: three light-microscopy images with interstitial inflammation, tubulitis and inflamed peritubular capillaries, and a brown C4d immunostain lining the peritubular capillaries diffusely."
      - kind: check
        page: 281
        quote: "Mixed Acute/Active Cellular Rejection: Microvascular Inflammation Consistent with Active Antibody Mediated Rejection, C4d Positive and Acute T- Cell Mediated Rejection, Banff Type IA (Tubulointerstitial)."
        question: "C4d 3 + peritubular capillaritis + interstitial inflammation with moderate tubulitis. Diagnosis?"
        options:
          - "Mixed active ABMR (C4d+) and acute TCMR IA"
          - "Pure acute TCMR IIA"
          - "CNI toxicity"
          - "C4d staining without rejection"
        answer: 0
        why:
          - "صح: الـ capillaritis + C4d = ==antibody-mediated rejection (ABMR)==، و الـ tubulitis المتوسطة = **T cell–mediated rejection (TCMR) Banff grade IA (tubulointerstitial)**."
          - "IIA محتاج intimal arteritis (v1)."
          - "الـ CNI toxicity مش بيعمل C4d ولا capillaritis."
          - "الـ category دي محتاجة مفيش tissue injury خالص."
      - kind: table
        page: 281
        quote: "Acute TCMR\n| Grade | Criteria |\n| Grade IA | Interstitial inflammation involving >25% of nonsclerotic cortical parenchyma (i2 or i3) with moderate tubulitis (t2) involving 1 or more tubules, not including tubules that are severely atrophic. |\n| Grade IB | Interstitial inflammation involving >25% of nonsclerotic cortical parenchyma (i2 or i3) with severe tubulitis (t3) involving 1 or more tubules, not including tubules that are severely atrophic. |\n| Grade IIA | Mild to moderate intimal arteritis (v1), with or without interstitial inflammation and/or tubulitis. |\n| Grade IIB | Severe intimal arteritis (v2), with or without interstitial inflammation and/or tubulitis. |\n| Grade III | Transmural arteritis and/or arterial fibrinoid necrosis of medial smooth muscle with accompanying mononuclear cell intimal arteritis (v3), with or without interstitial inflammation and/or tubulitis. |"
        title: "Acute TCMR (Banff 2017)"
        columns: [Grade, Lesion]
        rows:
          - ["IA", "i > 25% + moderate tubulitis (t2)"]
          - ["IB", "i > 25% + severe tubulitis (t3)"]
          - ["IIA", "Mild–moderate intimal arteritis (v1)"]
          - ["IIB", "Severe intimal arteritis (v2)"]
          - ["III", "Transmural arteritis / fibrinoid necrosis (v3)"]
        hide: [[0, 1], [1, 1], [2, 1], [4, 1]]
      - kind: aside
        tone: tip
        page: 281
        quote: "Acute TCMR\n| Grade | Criteria |\n| Grade IA | Interstitial inflammation involving >25% of nonsclerotic cortical parenchyma (i2 or i3) with moderate tubulitis (t2) involving 1 or more tubules, not including tubules that are severely atrophic. |\n| Grade IB | Interstitial inflammation involving >25% of nonsclerotic cortical parenchyma (i2 or i3) with severe tubulitis (t3) involving 1 or more tubules, not including tubules that are severely atrophic. |\n| Grade IIA | Mild to moderate intimal arteritis (v1), with or without interstitial inflammation and/or tubulitis. |\n| Grade IIB | Severe intimal arteritis (v2), with or without interstitial inflammation and/or tubulitis. |\n| Grade III | Transmural arteritis and/or arterial fibrinoid necrosis of medial smooth muscle with accompanying mononuclear cell intimal arteritis (v3), with or without interstitial inflammation and/or tubulitis. |"
        text: |
          الـ TCMR ليها سلّم: **I** = tubules (t2 أو t3)، **II** = **intima** للشريان (v1 أو v2)، **III** = **transmural** (v3).

          كل ما تدخل أعمق في الشريان، الـ grade يعلى. والـ **chronic active grade II** = ==chronic allograft arteriopathy==.

          ليه الشريان أخطر من الـ tubules؟ التفسير المقبول (مش في الكتاب): الـ tubule المتعوّر ممكن يتجدد، بس الشريان لو اتقفل، كل الـ nephrons اللي بعده بتموت مرة واحدة. عشان كده الـ grade II و III محتاجين علاج أقوى (زي الـ antithymocyte globulin) من الـ grade I اللي غالبًا بيرد على الـ steroids.
      - kind: explain
        page: 281
        title: "الـ chronic active TCMR"
        quote: "Revised Banff 2017 classification of antibody‐mediated rejection (ABMR) and T cell–mediated rejection (TCMR) in renal allografts"
        text: |
          الكتاب بيحط جنب الـ acute TCMR جدول ==Revised Banff 2017== للـ **chronic active TCMR**:
          - **Grade IA/IB**: inflammation > 25% من الـ **total cortex** (ti 2–3) و > 25% من الـ **sclerotic cortex** (i-IFTA 2–3)، مع tubulitis **moderate (t2) = IA** أو **severe (t3) = IB**، بعد ما تستبعد أسباب تانية للـ i-IFTA.
          - **Grade II**: ==chronic allograft arteriopathy==: fibrosis في الـ intima بتاع الشريان فيها mononuclear inflammation، و **neointima**.

          ليه «chronic active»؟ التفسير المقبول (مش في الكتاب): الـ T cells لسه شغّالة (active)، بس على نسيج **اتليّف** خلاص (chronic). فالسؤال بقى: الالتهاب ده جوّه الـ scar ولا جوّه النسيج السليم؟ عشان كده Banff بيعدّ الـ inflammation في الـ **sclerotic** cortex لوحده (i-IFTA).

          إزاي ده بيغيّر العلاج؟ التفسير المقبول (مش في الكتاب): الـ acute TCMR غالبًا بيرد على الـ pulse steroids لأن الالتهاب جديد والنسيج سليم. الـ chronic active أصعب، لأن جزء من النسيج اتليّف خلاص، فاللي تكسبه هو إنك **توقف** الالتهاب قبل ما يليّف الباقي. يعني الهدف بيتغيّر من «نرجّع الـ creatinine» لـ «نحافظ على اللي فاضل».
      - kind: figure
        page: 282
        quote: "Active ABMR; all 3 criteria must be met for diagnosis"
        title: "Active ABMR: لازم التلاتة"
        alt: "Three boxes joined by plus signs. One: acute tissue injury such as microvascular inflammation, arteritis, TMA or acute tubular injury. Two: antibody contact with endothelium such as linear C4d in peritubular capillaries or g plus ptc at least 2. Three: donor-specific antibodies. All three equal active antibody-mediated rejection."
        caption: "**Injury** + **antibody touching endothelium** (C4d أو microvascular inflammation ≥ 2) + ==donor-specific antibodies (DSA)==. الـ C4d أو الـ transcripts ممكن يعوّضوا الـ DSA، بس الـ DSA testing لازم."
        svg: |
          <svg viewBox="0 0 330 280" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="8" width="310" height="62" rx="8" class="fg-bad"/>
            <text x="165" y="28" text-anchor="middle" class="t-b">1. Acute tissue injury</text>
            <text x="165" y="46" text-anchor="middle" class="t-sm">MVI (g &gt; 0 / ptc &gt; 0), arteritis (v &gt; 0),</text>
            <text x="165" y="62" text-anchor="middle" class="t-sm">acute TMA or acute tubular injury</text>
            <text x="165" y="88" text-anchor="middle" class="t-lg t-b">+</text>
            <rect x="10" y="96" width="310" height="62" rx="8" class="fg-acc"/>
            <text x="165" y="116" text-anchor="middle" class="t-b">2. Antibody on endothelium</text>
            <text x="165" y="134" text-anchor="middle" class="t-sm">linear C4d in PTC, or g + ptc ≥ 2,</text>
            <text x="165" y="150" text-anchor="middle" class="t-sm">or validated ABMR transcripts</text>
            <text x="165" y="176" text-anchor="middle" class="t-lg t-b">+</text>
            <rect x="10" y="184" width="310" height="44" rx="8" class="fg-acc"/>
            <text x="165" y="204" text-anchor="middle" class="t-b">3. Donor-specific antibodies</text>
            <text x="165" y="220" text-anchor="middle" class="t-sm">HLA or non-HLA</text>
            <rect x="70" y="240" width="190" height="34" rx="8" class="fg-ink"/>
            <text x="165" y="262" text-anchor="middle" class="t-b">= Active ABMR</text>
          </svg>
      - kind: explain
        page: 282
        title: "ليه التلات معايير؟"
        quote: "Evidence of current/recent antibody interaction with vascular endothelium,"
        text: |
          الكتاب: الـ **active ABMR** محتاج ==كل الـ 3==:
          1. **Acute tissue injury**: microvascular inflammation (g > 0 و/أو ptc > 0)، أو arteritis (v > 0)، أو acute TMA، أو acute tubular injury من غير سبب تاني.
          2. **Antibody بيلمس الـ endothelium**: linear **C4d** (C4d2–3 بالـ IF، أو > 0 بالـ IHC)، أو ==g + ptc ≥ 2==، أو gene transcripts validated.
          3. **DSA** (HLA أو غيره). والـ C4d أو الـ transcripts ممكن يعوّضوا الـ DSA، بس الـ DSA testing (ومعاه non-HLA لو الـ HLA سلبي) ==strongly advised==.

          ليه التلاتة؟ التفسير المقبول (مش في الكتاب): زي جريمة: **ضرر** حصل (1)، و **بصمة** السلاح على المكان (2، الـ C4d هو أثر الـ complement اللي الـ antibody شغّله)، و **المتهم** نفسه في الدم (3، الـ DSA). وفيه شرط مهم: لو فيه TCMR أو borderline أو infection، الـ ptc لوحده مش كفاية ولازم g ≥ 1، **لأن** الـ T cells والعدوى بيلهبوا الـ peritubular capillaries لوحدهم.

          إزاي تطبقها على case 12؟ التفسير المقبول (مش في الكتاب): (1) injury: **ptc capillaritis** موجودة. بس الـ glomeruli «unremarkable» (يعني g = 0)، والقاعدة بتقول إن مع TCMR الـ ptc لوحده مش كفاية ولازم g ≥ 1. فالمعيار ده هنا على الحافة، والكتاب كتب «Microvascular Inflammation Consistent with Active ABMR»؛ وفي الامتحان إجابة الكتاب هي الإجابة. (2) **C4d 3** linear، فالمعيار التاني متحقق. (3) الـ PRA سلبي، بس الـ C4d بيعوّض الـ DSA في المعيار 3. فالـ ABMR اتقال، والـ TCMR IA معاه.
      - kind: update
        page: 282
        quote: "Active ABMR; all 3 criteria must be met for diagnosis"
        text: "Banff 2022 زوّد category اسمها **probable ABMR**: DSA موجب و C4d سلبي و microvascular inflammation قليل. وزوّد كمان **microvascular inflammation, DSA-negative and C4d-negative**. في الامتحان: Banff 2017 بتاع الكتاب."
        ref: "Banff 2022 Kidney Meeting Report, Am J Transplant 2024"
      - kind: explain
        page: 283
        title: "Chronic active ABMR، و C4d من غير rejection"
        quote: "Transplant glomerulopathy (cg >0) if no evidence of chronic TMA or chronic recurrent/de novo glomerulonephritis"
        text: |
          الـ **chronic active ABMR**: نفس المعيار 2 و 3، بس المعيار 1 بقى **chronic injury**:
          - ==transplant glomerulopathy (cg > 0)==، حتى لو بالـ EM بس (cg1a)
          - **severe peritubular capillary basement membrane multilayering** (محتاج EM)
          - **arterial intimal fibrosis** جديدة؛ والـ leukocytes جوّه الـ intima بتميل للـ ABMR لو مفيش TCMR قبل كده

          ليه الـ GBM بيعمل double contour هنا؟ التفسير المقبول (مش في الكتاب): الـ antibody بيأذي الـ endothelium مرة ورا مرة، وكل مرة الخلية بتبني **غشا جديد** تحته، فيبان طبقتين أو أكتر. يعني الـ multilayering هو «عدّاد» لعدد مرات الضرب.

          وفيه category تانية: ==C4d staining without evidence of rejection==.
      - kind: check
        page: 283
        quote: "C4d Staining without Evidence of Rejection; all 4 features must be present for diagnosis"
        question: "Linear C4d2 in peritubular capillaries, no acute or chronic tissue injury, no molecular evidence of ABMR, no TCMR or borderline changes. What is it?"
        options:
          - "C4d staining without evidence of rejection"
          - "Active ABMR"
          - "Chronic active ABMR"
          - "Acute TCMR IA"
        answer: 0
        why:
          - "صح: الـ ==4 features== كلهم موجودين: C4d موجب، criterion 1 مش متحقق، مفيش molecular evidence، ومفيش TCMR."
          - "الـ active ABMR محتاج acute tissue injury، ومفيش."
          - "الـ chronic active محتاج chronic injury (cg أو multilayering أو intimal fibrosis)."
          - "الـ TCMR محتاج interstitial inflammation و tubulitis."
      - kind: explain
        page: 284
        title: "Case 13: ولد عنده lupus وكلية من أبوه"
        quote: "Post-Tx cross matching was done and was found to be negative. PCR for CMV was repeated and was found to be negative. BK virus was also negative."
        text: |
          ولد **16 سنة**، **living related kidney transplant (LRKT)** من أبوه، match 4/6:
          - الـ IS: **neoral و MMF و solupred**، وبعد شهر **certican (everolimus)** والـ MMF اتسحب تدريجيًا.
          - بعد 1.5 شهر **حرارة**: الـ CMV PCR موجب، فـ IV **cymevene** وبعدين **valcyte**.
          - بعد 1.5 شهر كمان: **vomiting و diarrhea**، والـ creatinine من **1.9 لـ ==4.3==**.
          - الـ post-Tx **cross-match** سلبي، و CMV و **BK** سلبيين.
          - **pulse steroids 5 أيام**، والـ certican اتبدّل بـ ==prograf (tacrolimus)==، والـ MMF رجع.

          ليه الخطوات دي بالترتيب ده؟ التفسير المقبول (مش في الكتاب): الإسهال ممكن يكون CMV راجع أو من الـ MMF نفسه، والـ creatinine ممكن يكون جفاف أو BK أو rejection. فاستبعدوا العدوى الأول (CMV و BK)، وبعدين عالجوا كـ rejection، **لأن** الـ IS اتقلّل جامد (MMF اتسحب) وده بيفتح الباب للرفض.

          وليه الـ CMV مهم مع الـ rejection؟ التفسير المقبول (مش في الكتاب): الـ CMV نفسه بيرفع الـ HLA على خلايا الكلية ويشغّل المناعة، فبيزوّد خطر الرفض. وعلاجه غالبًا بيخلّي الأطباء يقللوا الـ IS، فالرفض يلاقي فرصته. فالـ CMV والرفض بيمشوا سوا كتير، وده اللي حصل هنا.
      - kind: try
        items: [neph.L08.186, neph.L08.189, neph.L08.193, neph.L08.197, neph.L08.213]
    recap:
      - "AKI في الـ transplant: pre-renal، ATN، AIN، CNI، infection، rejection، recurrence، obstruction، thrombosis؛ اشطب بالـ labs."
      - "TCMR: I tubulitis، II intimal arteritis، III transmural؛ والـ chronic active II = allograft arteriopathy."
      - "Active ABMR = injury + antibody على الـ endothelium + DSA؛ C4d مش شرط."
      - "C4d من غير rejection = 4 features كلهم."
