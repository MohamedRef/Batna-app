lecture: neph.L02
lessons:
  # ------------------------------------------------------------------
  - id: neph.L02.lesson1
    title: "يعني إيه CKD؟ التعريف والـ eGFR والـ ACR"
    hook: "واحد من كل عشرة عنده CKD ومعظمهم مايعرفوش. رقمين بس (eGFR و ACR) بيكشفوه."
    minutes: 9
    pages: [23, 30]
    topics: [epidemiology, definition, hyperfiltration, screening, egfr, albuminuria]
    goals:
      - "تعرف تعريف KDIGO للـ CKD وعلامات الـ kidney damage"
      - "تفهم الـ hyperfiltration وليه المرض بيكمّل لوحده بعد ما نص النفرونات يروح"
      - "تعرف مين تعمله screening، وإيه اللي بيبوّظ الـ eGFR والـ ACR"
    status: unverified
    steps:
      - kind: explain
        page: 23
        quote: "CVD Main cause of death in CKD"
        title: "مرض شائع وبيقتل بالقلب"
        text: |
          في 2017 كان فيه حوالي **843.6 مليون** إنسان عندهم chronic kidney disease (CKD)، يعني تقريبًا **1 من كل 10**. الوفيات زادت **41.5%** من 1990، ومتوقع يبقى **السبب الخامس** للوفاة.

          والمهم للامتحان: مريض الـ CKD غالبًا **مش بيموت من الكلى**. ==cardiovascular disease (CVD)== هو السبب الأول للوفاة.
      - kind: explain
        page: 24
        quote: "CKD is defined as abnormalities of kidney structure or function, present for > 3 months, with implications for health and CKD is classified based on cause, GFR category, and albuminuria category (CGA)."
        title: "تعريف KDIGO 2012"
        text: |
          الـ ==CKD== = abnormality في **structure** أو **function** الكلى، موجودة **أكتر من 3 شهور**، ولها تأثير على الصحة.

          ويتصنّف بالـ ==CGA==: **C**ause، **G**FR category، **A**lbuminuria category.

          المعيار: واحد من دول لمدة > 3 شهور:

          - **glomerular filtration rate (GFR) < 60** (G3a–G5)، **أو**
          - **marker of kidney damage**: albuminuria (ACR ≥ 30 mg/g)، urine sediment، tubular disorder، histology، imaging، أو تاريخ زرع كلى
      - kind: check
        page: 24
        quote: "Criteria for CKD (either of the following present for > 3 months)\n| Markers of kidney damage (one or more) | Albuminuria (AER ≥ 30 mg/24 hours; ACR ≥ 30 mg/g [≥ 3 mg/mmol]) |\n| | Urine sediment abnormalities |\n| | Electrolyte and other abnormalities due to tubular disorders |\n| | Abnormalities detected by histology |\n| | Structural abnormalities detected by imaging |\n| | History of kidney transplantation |\n| Decreased GFR | GFR < 60 ml/min/1.73 m2 (GFR categories G3a-G5) |"
        question: "eGFR 85 and ACR 50 mg/g, persisting for 6 months. CKD?"
        options:
          - "Yes: albuminuria is a marker of damage, so this is CKD G2A2"
          - "No: eGFR is above 60"
          - "No: ACR must be above 300"
          - "Only if the kidneys are small on ultrasound"
        answer: 0
        why:
          - "صح: أي marker of damage لمدة > 3 شهور يكفي حتى لو الـ GFR فوق 60."
          - "الـ GFR < 60 معيار، بس مش المعيار الوحيد."
          - "الحد 30 mg/g، و > 300 ده A3."
          - "الـ imaging marker تاني، مش شرط."
      - kind: figure
        page: 24
        quote: "Causes of Renal Hyperfiltration\n  Increased sympathetic activity\n  Increased renin-angiotensin-aldesterone activity\n  Hyperglycaemia and insulin resistance\n  Obesity\n  Increased autoimmune activation\n  Impaired glomerular haemodynamics\n  Inhibition of tubuloglomerular feedback (macula densa signals)\nGlomerular Hyperfiltration\n  Afferent ateriole: Reduced arterial resistance\n  Efferent ateriole: Increased arterial resistance\n  Increased glomerular permeability to macromolecules: Proteinuria, Albuminuria\n  Increased oxdative stress; Increased inflammation\n  Endothelial dysfunction: Increased arterial stiffness; Increased blood pressure; Impaired blood pressure variation\n  Increased Sodium Uptake\n  Increased cardiovascular disease and mortality"
        title: "الـ hyperfiltration: النفرونات الباقية بتشتغل زيادة"
        alt: "A glomerulus drawn as a circle with a wide afferent arteriole entering on the left labelled reduced resistance, and a narrow efferent arteriole leaving on the right labelled increased resistance. Inside, high pressure. Below, the chain: high single-nephron GFR, proteinuria and RAAS, fibrosis, fewer nephrons, which loops back."
        caption: "الـ **afferent** بيتوسّع والـ **efferent** بيضيق ← الضغط جوه الـ glomerulus يعلى ← proteinuria وfibrosis ← نفرونات أقل ← hyperfiltration أكتر. دايرة مقفولة."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="N2a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
              <marker id="N2b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="10" y="62" width="110" height="26" rx="6" class="fg-good"/>
            <text x="65" y="80" text-anchor="middle" class="t-sm">Afferent wide</text>
            <circle cx="165" cy="75" r="40" class="fg-bad"/>
            <text x="165" y="72" text-anchor="middle" class="t-sm t-b">High</text>
            <text x="165" y="88" text-anchor="middle" class="t-sm t-b">pressure</text>
            <rect x="215" y="68" width="105" height="14" rx="5" class="fg-acc"/>
            <text x="267" y="104" text-anchor="middle" class="t-sm">Efferent narrow</text>
            <text x="65" y="108" text-anchor="middle" class="t-sm t-mut">↓ resistance</text>
            <text x="267" y="62" text-anchor="middle" class="t-sm t-mut">↑ resistance</text>
            <rect x="40" y="140" width="250" height="28" rx="8" class="fg-box"/>
            <text x="165" y="159" text-anchor="middle" class="t-sm">↑ single-nephron GFR</text>
            <line x1="165" y1="168" x2="165" y2="186" class="fg-arrow-bad" marker-end="url(#N2b)"/>
            <rect x="40" y="188" width="250" height="28" rx="8" class="fg-box"/>
            <text x="165" y="207" text-anchor="middle" class="t-sm">Proteinuria + RAAS + angiotensin II</text>
            <line x1="165" y1="216" x2="165" y2="234" class="fg-arrow-bad" marker-end="url(#N2b)"/>
            <rect x="40" y="236" width="250" height="28" rx="8" class="fg-bad"/>
            <text x="165" y="255" text-anchor="middle" class="t-sm">Fibrosis → fewer nephrons</text>
            <path d="M290 250 Q320 200 290 154" class="fg-arrow-acc" fill="none" marker-end="url(#N2a)"/>
            <text x="165" y="290" text-anchor="middle" class="t-sm t-mut">once half are lost, CKD progresses whatever the cause</text>
          </svg>
      - kind: aside
        page: 25
        quote: "Once half of the total nephrons are lost, CKD progresses similarly regardless of etiology. Initial hyperfiltration activates RAAS and causes proteinuria. Angiotensin II and protein uptake at the tubules causes inflammation and fibrosis of the glomerulus and tubules. Progressive decline in GFR and systemic complications occurs."
        tone: exam
        text: "جملة امتحان: لما **نص النفرونات** يروح، الـ CKD بيكمّل **بنفس الطريقة أيًا كان السبب**. علشان كده علاج الـ hyperfiltration (RAASi و sodium–glucose cotransporter 2 (SGLT2) inhibitor (SGLT2i)) بينفع مع معظم الأسباب."
      - kind: table
        page: 25
        quote: "Prevalence of CKD\n  12-14% General pop\n  40% Diabetes\n  40% Cardio-vascular diseases\n  33% Age ≥ 65 years\n  22% HTN"
        title: "الـ CKD منتشر قد إيه؟"
        columns: [Group, CKD]
        rows:
          - ["General population", "12–14%"]
          - ["Diabetes", "40%"]
          - ["CVD", "40%"]
          - ["Age ≥ 65", "33%"]
          - ["Hypertension", "22%"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 26
        quote: "Hypertension; diabetes; Cardiovascular disease; AKI/hospitalization history; FH kidney disease; obesity; other high-risk comorbidities (e.g., SLE, environmental exposures, nephrotoxic drugs, genetic factors, preeclampsia, low birth weight)."
        title: "مين نعمله screening؟"
        text: |
          الـ screening بيبقى ==cost-effective== في الناس اللي عندهم risk factor بس:

          - **Hypertension**، **diabetes**، **CVD**
          - تاريخ **acute kidney injury (AKI)** أو دخول مستشفى، **family history** لمرض كلى، **obesity**
          - systemic lupus erythematosus (SLE)، nephrotoxic drugs، genetic، **preeclampsia**، **low birth weight**

          اعمل **estimated glomerular filtration rate (eGFR) + ACR**. لو غير طبيعي: استبعد AKI، و**أكّد بعد 3 شهور**، وبعدين stage، cause، risk، treatment.
      - kind: order
        page: 26
        quote: "Figure 2: Screening algorithm for diagnosis and staging of chronic kidney disease (CKD)."
        prompt: "رتّب خطوات الـ screening:"
        steps:
          - "eGFR + ACR in a person at risk"
          - "Abnormal: exclude AKI"
          - "Repeat after 3 months"
          - "Add cystatin C (eGFRcr-cys) if available"
          - "Stage by G and A"
          - "Cause, risk, treatment"
      - kind: table
        page: 29
        quote: "| Age | GFR threshold for diagnosis of CKD |\n| <40 years | < 75 mL/min |\n| 40-65 years | < 60 mL/min |\n| >65 years | < 45 mL/min |"
        title: "حد الـ GFR بيتغير مع السن"
        columns: [Age, GFR threshold]
        rows:
          - ["< 40 years", "< 75"]
          - ["40–65 years", "< 60"]
          - ["> 65 years", "< 45"]
        hide: [[0, 1], [2, 1]]
      - kind: reveal
        page: 29
        quote: "Examples of eGFR calculation\nCKD-Epi 2021 updated formula\n| | Creatinine 1.3 mg/dl | Creatinine 4.5 mg/dl |\n| Male 24 yrs old | 78.7 ml/min/1.73m2 | 17.7 ml/min/1.73m2 |\n| Male 60 yrs old | 62.9 ml/min/1.73m2 | 14.2 ml/min/1.73m2 |\n| Female 24 yrs old | 58.9 ml/min/1.73m2 | 13.3 ml/min/1.73m2 |\n| Female 60 yrs old | 47.1 ml/min/1.73m2 | 10.6 ml/min/1.73m2 |"
        prompt: "شاب عنده 24 سنة وست عندها 60 سنة، الاتنين creatinine 1.3. نفس الكلى؟"
        answer: "لأ خالص. بالـ CKD-EPI 2021: الشاب **78.7** والست **47.1** (يعني G3a). الـ creatinine لوحده بيخدع: لازم السن والنوع. وعند creatinine 4.5 الأرقام 17.7 مقابل 10.6."
      - kind: sort
        page: 28
        quote: "| Domain | Specific clinical condition |\n| Body habitus and changes in muscle mass | Anorexia nervosa |\n| | Extreme sport/exercise/body builder |\n| | Above knee amputation |\n| | Spinal cord injury with paraplegia/paraparesis or quadriplegia/quadriparesis |\n| | Class III obesity (BMI>40 kg/m2) |\n| Lifestyle | Smoking |\n| Diet | Low protein diet |\n| | Keto-diets |\n| | Vegetarian |\n| | High protein diets and creatine supplements |\n| Illness other than CKD | Malnutrition |\n| | Cancer |\n| | Heart failure |\n| | Cirrhosis |\n| | Catabolic consuming diseases |\n| | Muscle wasting diseases |\n| Medication effects | Steroids (anabolic, hormone) |\n| | Decreases in tubular secretion |\n| | Broad spectrum antibiotics that decrease extrarenal elimination |"
        prompt: "الـ creatinine هيتغير إزاي بعيد عن الـ GFR؟"
        bins: ["Creatinine falsely LOW (eGFR too high)", "Creatinine falsely HIGH (eGFR too low)"]
        cards:
          - { text: "Above-knee amputation", bin: 0 }
          - { text: "Anorexia nervosa", bin: 0 }
          - { text: "Cirrhosis", bin: 0 }
          - { text: "Vegetarian diet", bin: 0 }
          - { text: "Body builder", bin: 1 }
          - { text: "Creatine supplements", bin: 1 }
          - { text: "Drug that blocks tubular secretion", bin: 1 }
      - kind: explain
        page: 30
        quote: "Table 17: Factors causing biological variation in urine albumin or urine protein. ACR, albumin-to-creatinine ratio; AKI, acute kidney injury; PCR, protein-to-creatinine ratio\n| | Factor | False positive | False negative |\n| Variability in urine albumin or protein | Hematuria | Increases albumin and protein in the urine | |\n| | Menstruation | Increases albumin and protein in the urine | |\n| | Exercise | Increases albumin more than other proteins in the urine | |\n| | Infection | Symptomatic urinary infection can cause production of protein from the organism. | |\n| | Non-albumin proteins | | Other proteins may be missed by albumin reagent strips |\n| Variability in urinary creatinine concentration | Biological sex | Females have lower creatinine excretion, therefore higher ACR. | Males have higher creatinine excretion, therefore lower ACR. |\n| | Weight | High creatinine excretion consistent with high weight can cause low ACR or PCR relative to timed excretion | Low creatinine excretion consistent with low weight can cause high ACR or PCR relative to timed excretion |\n| | Changes in creatinine excretion | Lower urinary creatinine concentration with AKI | Increased urinary creatinine concentration with meat intake or exercise |"
        title: "الـ ACR ممكن يكدب"
        text: |
          في البالغين بنقيس ==albuminuria== (ACR)، وفي الأطفال proteinuria.

          **Albumin عالي غلط**: hematuria، menstruation، exercise، urinary tract infection (UTI).

          **الـ creatinine في البول** هو المقام، فأي حاجة بتغيره بتغير الـ ratio:

          - **ستات** و**وزن قليل** و**AKI** ← creatinine أقل ← ==ACR أعلى==
          - **رجالة** و**وزن كبير** و**لحمة/رياضة** ← creatinine أكتر ← ACR أقل
      - kind: aside
        page: 30
        quote: "Table 17: Factors causing biological variation in urine albumin or urine protein. ACR, albumin-to-creatinine ratio; AKI, acute kidney injury; PCR, protein-to-creatinine ratio\n| | Factor | False positive | False negative |\n| Variability in urine albumin or protein | Hematuria | Increases albumin and protein in the urine | |\n| | Menstruation | Increases albumin and protein in the urine | |\n| | Exercise | Increases albumin more than other proteins in the urine | |\n| | Infection | Symptomatic urinary infection can cause production of protein from the organism. | |\n| | Non-albumin proteins | | Other proteins may be missed by albumin reagent strips |\n| Variability in urinary creatinine concentration | Biological sex | Females have lower creatinine excretion, therefore higher ACR. | Males have higher creatinine excretion, therefore lower ACR. |\n| | Weight | High creatinine excretion consistent with high weight can cause low ACR or PCR relative to timed excretion | Low creatinine excretion consistent with low weight can cause high ACR or PCR relative to timed excretion |\n| | Changes in creatinine excretion | Lower urinary creatinine concentration with AKI | Increased urinary creatinine concentration with meat intake or exercise |"
        tone: analogy
        text: "الـ ACR زي سعر الكيلو: لو الميزان (الـ creatinine) بيقيس أقل من الحقيقة، السعر يطلع أغلى من غير ما البضاعة تتغير. 🧮"
      - kind: try
        items: [neph.L02.004, neph.L02.006, neph.L02.013, neph.L02.025, neph.L02.031]
    recap:
      - "CKD = abnormality > 3 شهور؛ GFR < 60 أو marker of damage (ACR ≥ 30 mg/g)."
      - "تصنيف CGA: Cause، GFR، Albuminuria."
      - "CVD هو السبب الأول لوفاة مريض الـ CKD."
      - "بعد نص النفرونات: hyperfiltration ← proteinuria ← fibrosis، أيًا كان السبب."
      - "Screening لمرضى الـ risk؛ أكّد بعد 3 شهور."
      - "حد الـ GFR بالسن: < 75 تحت 40، < 60 من 40–65، < 45 فوق 65."
    practice: [neph.L02.001, neph.L02.002, neph.L02.003, neph.L02.004, neph.L02.005, neph.L02.006, neph.L02.007, neph.L02.008, neph.L02.009, neph.L02.010, neph.L02.011, neph.L02.012, neph.L02.013, neph.L02.014, neph.L02.015, neph.L02.016, neph.L02.017, neph.L02.018, neph.L02.019, neph.L02.020, neph.L02.021, neph.L02.022, neph.L02.023, neph.L02.024, neph.L02.025, neph.L02.026, neph.L02.027, neph.L02.028, neph.L02.029, neph.L02.030, neph.L02.031, neph.L02.154, neph.L02.155, neph.L02.156]
