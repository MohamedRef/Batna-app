      - kind: explain
        page: 192
        quote: "No previous Portocaval Shunts- a Mesocaval shunt is the only exception Initial assessment is done to determine and confirm the"
        title: "Recipient criteria للـ living donor"
        text: |
          - No evidence of extra-hepatic malignancy
          - No percutaneous stents in place
          - ==No previous portocaval shunts==، والاستثناء الوحيد هو الـ ==mesocaval shunt==

          تعريفين:

          - **Portocaval shunt**: توصيلة بين الـ portal vein والـ IVC، بتسحب دم الـ portal بعيد عن الكبد.
          - **Mesocaval shunt**: توصيلة بين الـ SMV والـ IVC، بعيد عن منطقة الكبد نفسها.

          ليه الفرق؟ الكبد الجديد محتاج الـ portal vein سليم ودمه داخل عليه. الـ portocaval بيلعب في الوريد ده بالظبط، أما الـ mesocaval فبعيد عنه. (منطق مقبول، الكتاب كاتب القاعدة بس.)

          وكمان الـ initial assessment هدفه يحدد ويتأكد من الـ **etiology** بتاع الـ chronic liver disease، ويحسب CP score و MELD score.

          ليه السبب مهم؟ لأن بعض الأسباب، زي HBV، لازم تتعالج قبل وبعد الزرع، وإلا هتاكل الكبد الجديد. ده الدرس الجاي.
