      - kind: explain
        page: 170
        quote: "ascites (primary prophylaxis) particularly when Child-Pugh score ≥9, serum bilirubin level ≥3 mg/dl, impaired renal function or hyponatremia."
        title: "الـ long-term prophylaxis"
        text: |
          **Prophylaxis** بالـ oral antibiotics: norfloxacin 400 mg/day أو ciprofloxacin 500 mg/day. لمين؟

          ==Primary prophylaxis== (لسه ماعملش SBP):
          - ascitic protein واطي، أقل من 1.5 (الكتاب كاتبها g/L والمقصود g/dL).
          - خصوصًا لو معاه واحدة من دول: Child-Pugh score 9 أو أكتر، bilirubin 3 mg/dl أو أكتر، impaired renal function، أو hyponatremia.

          ==Secondary prophylaxis==: أي حد عمل SBP قبل كده، لأن 69% بترجعلهم خلال سنة.

          **ليه الـ low protein بالذات؟** التفسير المقبول (مش في الكتاب): البروتين في المية فيه opsonins والـ complement اللي بيساعدوا يقتلوا البكتيريا. كل ما البروتين يقل، المية تبقى بيئة أسهل للعدوى.
      - kind: aside
        tone: trap
        page: 170
        quote: "Patients with cirrhosis and low protein (<1.5 g/L) ascites (primary prophylaxis) particularly when Child-Pugh score ≥9"
        text: |
          متلخبطش بين رقمين:
          - **<1 g/dL** = **risk factor** للـ SBP (p. 166) ورقم الـ protein في التشخيص (p. 167).
          - <1.5 = حد الـ **primary prophylaxis** (p. 170).
      - kind: explain
        page: 170
        quote: "may be facilitated by antibiotic therapy, acute GI bleeding, immunosuppression and malnutrition that are common in advanced cirrhosis"
        title: "SFP: لما الفطريات تدخل"
        text: |
          **Spontaneous fungal peritonitis (SFP)**: fungal infection في الـ ascitic fluid من غير intra-abdominal source معروف. أقل شيوعًا من الـ SBP، وبتيجي في الـ advanced cirrhosis.

          **Pathogenesis**: الـ fungal translocation من الأمعاء. وبيسهّله:
          - antibiotic therapy (بيقتل البكتيريا الطبيعية فالفطريات تاخد مكانها)
          - acute GI bleeding
          - immunosuppression
          - malnutrition

          **التشخيص**:
          - **SFP**: PMN ≥250 cells/mm³ + fungal culture positive، حتى لو فيه بكتيريا معاها.
          - **Fungal ascites**: fungal culture positive مع PMN أقل من 250، زي الـ bacterascites بالظبط.

          **الكائن الأشهر**: ==Candida albicans==.

          **اختبارات أحدث وأسرع**: **pan-fungal PCR** و **1,3 beta-D-glucan**. أحسن sensitivity، وبيقصّروا الوقت للتشخيص.

          **العلاج**:
          - ==Echinocandins==: first-line في الـ critically ill.
          - **Fluconazole**: للحالات الأخف.
