  # ------------------------------------------------------------------
  - id: hem.L06.lesson5
    title: "Massive transfusion: الدم البارد اللي فيه citrate"
    hook: "عشرين كيس في ساعات بيصلّحوا النزيف ويعملوا مشاكل جديدة: الكالسيوم بيقع، والبوتاسيوم بيعلى، والعيان بيبرد."
    minutes: 8
    pages: [101, 103]
    topics: [massive]
    goals:
      - "تعرّف الـ massive transfusion"
      - "تشرح citrate toxicity وإزاي تعالجها"
      - "تعرف الـ hyperkalemia والـ hypomagnesemia والـ hypothermia"
    status: unverified
    steps:
      - kind: explain
        page: 101
        title: "التعريف"
        quote: "The administration of blood components over a 24-hour period in amounts that equal or exceed the total blood volume of the patient 10 units of whole blood or 20 units of packed RBC in the adult)."
        text: |
          ==Massive transfusion==: في **24 ساعة** تدي كمية تساوي أو أكتر من **total blood volume**، يعني حوالي **10 units whole blood** أو **20 units packed red blood cells (RBCs)** في البالغ.

          المشاكل: **dilution** و consumption للـ platelets والـ factors (DIC)، **hypothermia**، **acidosis**، **electrolytes**، و **hypocalcemia** من الـ citrate.

          يعني العيان دمه **اتغيّر كله تقريبًا** بدم مخزّن. والدم المخزّن مختلف عن الدم الطازة: بارد، فيه citrate، فيه K طالع من الكرات، وفقير في الـ platelets والـ factors الشغالة. كل مشكلة في الدرس ده جاية من صفة من دول.
      - kind: explain
        page: 101
        title: "Dilutional coagulopathy"
        quote: "Dilutional coagulopathy: During haemorrhagic shock, there is fluid shift from the interstitial to the intravascular compartment that leads to dilution of the"
        text: |
          في الـ hemorrhagic shock، السوايل بتتنقل من الـ interstitium للأوعية فتخفّف الـ factors. ولما تعوّض بسوايل مفيهاش factors، الموضوع يزيد. والـ ==colloids والـ crystalloids== بيعملوا coagulopathy أكتر من مجرد dilution.

          وكمان **low colloid oncotic pressure** ← interstitial edema.

          ليه ده مهم؟ لأن كل لتر saline أو PRBCs من غير FFP و platelets بيخفّف اللي فاضل، فالنزيف يزيد، فتدّي سوايل أكتر: دايرة. والتفسير المقبول (مش في الكتاب): عشان كده الـ massive transfusion بيدّي الـ plasma والـ platelets مع الكرات من بدري، مش بعد ما الـ coagulopathy تبان.
      - kind: figure
        page: 102
        quote: "Unmetabolised citrate can then lead to hypocalcaemia, hypomagnesemia and worsen the acidosis. Hypocalcaemia can lead to myocardial depression that manifests earlier than hypocalcaemic coagulopathy."
        title: "دايرة الـ citrate"
        alt: "A cycle. Each bag carries 3 g citrate. Normally the liver clears it in 5 minutes. In shock and hypothermia the liver clears it slowly, so citrate builds up. Citrate binds calcium and magnesium, causing myocardial depression and fluid-resistant hypotension, which worsens liver perfusion and slows citrate clearance further."
        caption: "الـ citrate بيمسك الـ ==calcium== والـ magnesium. والقلب الضعيف بيقلّل دم الكبد، فالكبد يتأخر في تكسير الـ citrate أكتر."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L06b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="85" y="10" width="160" height="44" rx="10" class="fg-acc"/>
            <text x="165" y="30" text-anchor="middle" class="t-sm t-b">Each bag: ~3 g citrate</text>
            <text x="165" y="46" text-anchor="middle" class="t-sm">liver clears it in 5 min</text>
            <path d="M245 40 Q310 80 270 115" class="fg-arrow" marker-end="url(#L06b)"/>
            <rect x="175" y="118" width="150" height="44" rx="10" class="fg-box"/>
            <text x="250" y="138" text-anchor="middle" class="t-sm t-b">Shock, hypothermia</text>
            <text x="250" y="154" text-anchor="middle" class="t-sm">slow liver clearance</text>
            <path d="M250 162 Q260 215 210 230" class="fg-arrow" marker-end="url(#L06b)"/>
            <rect x="85" y="215" width="160" height="44" rx="10" class="fg-bad"/>
            <text x="165" y="235" text-anchor="middle" class="t-sm t-b">Citrate builds up</text>
            <text x="165" y="251" text-anchor="middle" class="t-sm">binds Ca²⁺ and Mg²⁺</text>
            <path d="M85 240 Q20 215 40 165" class="fg-arrow-bad" marker-end="url(#L06b)"/>
            <rect x="5" y="118" width="150" height="44" rx="10" class="fg-bad"/>
            <text x="80" y="138" text-anchor="middle" class="t-sm t-b">Myocardial depression</text>
            <text x="80" y="154" text-anchor="middle" class="t-sm">fluid-resistant low BP</text>
            <path d="M155 140 H172" class="fg-arrow-bad" marker-end="url(#L06b)"/>
            <text x="165" y="300" text-anchor="middle" class="t-sm t-good t-b">Give calcium; watch QTc and ionized Ca</text>
          </svg>
      - kind: explain
        page: 102
        title: "Citrate toxicity"
        quote: "- Citrate toxicity: 80 ml of citrate phosphate dextrose adenine solution present in each blood bag contains approximately 3 g citrate. A healthy adult can metabolise this load in 5 min."
        text: |
          كل كيس فيه **80 ml citrate phosphate dextrose adenine (CPDA)** بـ ==3 g citrate==، والبالغ السليم بيكسّره في **5 دقايق** (في الكبد).

          بس الـ **hypoperfusion** و **hypothermia** بيبطّأوا ده، فالـ citrate يتراكم ← **hypocalcemia** و hypomagnesemia و acidosis أسوأ.

          ليه الكيس فيه citrate أصلًا؟ التفسير المقبول (مش في الكتاب): الـ citrate بيمسك الـ calcium، والـ calcium لازم للتجلّط (فاكر رسمة الـ cascade في محاضرة 5؟)، فالكيس ما يتجلطش. نفس الخاصية دي هي اللي بتعمل المشكلة جوه العيان: بيمسك الـ calcium بتاعه.
      - kind: check
        page: 102
        quote: "Hypocalcaemia can lead to myocardial depression that manifests earlier than hypocalcaemic coagulopathy."
        question: "In citrate-induced hypocalcaemia during massive transfusion, what usually shows first?"
        options: ["Myocardial depression with fluid-resistant hypotension", "Hypocalcaemic coagulopathy", "Tetany", "Hyperkalaemic arrest"]
        answer: 0
        why:
          - "صح: الكتاب بيقول الـ myocardial depression بتيجي قبل الـ coagulopathy، وتبان كـ hypotension مش بتستجيب للسوايل."
          - "بتيجي بعد الـ myocardial depression."
          - "الكتاب مش بيذكرها هنا."
          - "الـ K مشكلة تانية بتزيد مع السرعة العالية، مش أول علامة للـ citrate."
      - kind: aside
        tone: exam
        page: 102
        quote: "Hypotension not responding to fluids should alert the physician to this complication. Calcium supplementation is thus required in most cases of MBT."
        text: |
          الـ **myocardial depression** بتيجي **قبل** الـ hypocalcemic coagulopathy. فلو لقيت ==hypotension not responding to fluids== في massive transfusion، فكّر في الـ calcium. وأغلب حالات الـ massive blood transfusion (MBT) محتاجة **calcium supplementation**.
      - kind: explain
        page: 102
        title: "المتابعة وأنهي calcium"
        quote: "The risk of hypocalcemia can be reduced by paying attention to the rate of transfusion and following physiologic markers such as the blood pressure and corrected QT interval. The ionized calcium concentration is typically measured with the ion-specific electrode on a blood gas machine."
        text: |
          - راقب **سرعة النقل** والـ **blood pressure (BP)** والـ ==corrected QT==.
          - قيس الـ **ionized calcium** على جهاز الـ blood gas.
          - في **liver disease** أو ischemic hepatic dysfunction الخطر أعلى، فراقب أكتر.
          - **Calcium chloride** أحسن من **gluconate** لو الكبد تعبان، لأن الـ ionized Ca من الـ chloride ما يحتاجش كبد شغّال.
      - kind: check
        page: 103
        quote: "For individuals with abnormal liver function, calcium chloride may be preferable to calcium gluconate since release of ionized calcium from calcium chloride does not require normal liver function"
        question: "A trauma patient with shock liver needs calcium during massive transfusion. Which salt?"
        options: ["Calcium chloride", "Calcium gluconate", "Calcium carbonate orally", "No calcium needed"]
        answer: 0
        why:
          - "صح: الـ chloride بيطلّع ionized calcium من غير ما يحتاج الكبد."
          - "الـ gluconate محتاج liver function علشان يطلّع الـ calcium."
          - "العيان في shock ومحتاج IV، مش أقراص."
          - "أغلب حالات الـ MBT محتاجة calcium."
      - kind: explain
        page: 103
        title: "Potassium و magnesium و البرد"
        quote: "Hypothermia: Factors contributing to hypothermia include infusion of cold fluids and blood and blood products, opening of coelomic cavities and decreased heat production. Hypothermia leads to decreased citrate metabolism and drug clearance and more importantly, contributes to the development of coagulopathy. Slowing of enzyme activity and decreased platelet function individually have been shown to contribute to hypothermic coagulopathy at core temperatures below 34°C."
        text: |
          - **Hyperkalemia**: الـ K في الـ packed red blood cells (PRBCs) من **7 لـ 77 mEq/L** حسب عمر الكيس. بتحصل مع سرعة فوق **100–150 ml/min**، ومع الكلى والـ acidosis. والـ hypocalcemia بتزوّد تأثيرها على القلب. ليه الكيس القديم أعلى؟ التفسير المقبول (مش في الكتاب): الكرات في البرد بتسرّب الـ K بالتدريج، فكل يوم تخزين يزوّده.
          - **Hypomagnesemia**: الـ citrate بيمسك الـ Mg، والسوايل فقيرة في Mg.
          - **Hypothermia**: سوايل ودم بارد، بطن مفتوحة، heat production قليل. بتبطّأ الـ citrate والأدوية، وبتعمل ==coagulopathy below 34°C==.
      - kind: reveal
        page: 103
        quote: "Coagulopathy due to hypothermia is not reflected in laboratory tests as the samples are warmed during processing."
        prompt: "العيان بينزف من كل حتة وحرارته 33°C، والـ PT جاي شبه طبيعي. المعمل غلطان؟"
        answer: |
          لأ. المعمل ==بيدفّي العينة== لـ 37°C قبل التحليل، فالـ enzymes بتشتغل كويس في الأنبوبة. أما جوه العيان البارد فهي بطيئة.

          يعني الـ lab مش بيبيّن الـ hypothermic coagulopathy. دفّي العيان والسوايل، وعالج العيان مش الورقة.
      - kind: try
        items: [hem.L06.101, hem.L06.105, hem.L06.106, hem.L06.108, hem.L06.113]
    recap:
      - "Massive = blood volume في 24 ساعة (10 whole blood أو 20 PRBC)."
      - "Citrate (3 g/كيس) يتراكم في الـ shock والبرد ← hypocalcemia و hypomagnesemia و acidosis."
      - "Hypotension مش بتستجيب للسوايل = فكّر calcium. راقب QTc و ionized Ca. Chloride لو الكبد تعبان."
      - "K في الكيس 7–77، hyperkalemia فوق 100–150 ml/min."
      - "Hypothermia تحت 34°C = coagulopathy مش باينة في المعمل."
