        page: 52
        quote: "Digoxin 250 mcg daily; Metoprolol 50 mg/day, Diclofenac 75 mg twice daily; Frusemide 40 mg daily"
        stem: "Mr Ahmed, 69, 4 days of malaise, vomiting, confusion and falls. AF, CAD, HTN, gout, insomnia, BPH, edema, dizziness. On simvastatin 40, verapamil 240, quinine, perindopril/indapamide, digoxin 250 mcg, metoprolol 50, diclofenac 75 bd, furosemide 40, betahistine, paracetamol, warfarin, flurazepam 30, vitamin D."
        steps:
          - reveal: "Supine BP 122/70, erect 92/62, pulse 52. eGFR 38, K+ 2.8, Na+ 126, Hb 10.2."
            question: "Which drugs best explain the pulse of 52?"
            options:
              - "Digoxin + verapamil + metoprolol"
              - "Simvastatin + vitamin D"
              - "Paracetamol"
              - "Betahistine"
            answer: 0
            why: "Digoxin + antiarrhythmic ← bradycardia، ص 51. والـ digoxin 250 mcg فوق خط الـ 0.125، ص 50، مع eGFR 38 و K+ 2.8."
          - question: "Most likely cause of K+ 2.8 and Na+ 126?"
            options:
              - "Indapamide + furosemide"
              - "Perindopril alone"
              - "Warfarin"
              - "Paracetamol"
            answer: 0
            why: "Diuretic + diuretic ← electrolyte imbalance و dehydration، ص 51. والـ K الواطي بيزوّد الـ digoxin toxicity."
          - question: "Which drug is the riskiest with his warfarin, eGFR 38 and edema?"
            options:
              - "Diclofenac"
              - "Paracetamol"
              - "Vitamin D"
              - "Metoprolol"
            answer: 0
            why: "NSAIDs: renal failure و fluid retention و bleeding مع الـ warfarin، ص 47 و 51. الـ paracetamol هو البديل."
          - question: "Which drug most raises his falls and confusion?"
            options:
              - "Flurazepam 30 mg"
              - "Vitamin D"
              - "Simvastatin"
              - "Paracetamol"
            answer: 0
            why: "Long-acting benzo، lipophilic، phase I ← بيتراكم. يتوقف بالتدريج."
      - kind: check
        page: 53
        quote: "A systematic approach should be considered to determine which medications are necessary for a patient given his/ co-morbidities"
        question: "In order to reduce polypharmacy in Mr Ahmed:"
        options:
          - "A systematic approach decides which drugs he needs"
          - "Stop all and restart one by one"
          - "Stop the newest drugs first"
          - "Stop any second drug for the same condition"
        answer: 0
        why:
          - "صح، ده **B** في الكتاب. الكتاب ما كتبش الإجابة."
          - "توقيف الكل مرة واحدة خطر: rebound و AF rate و anticoagulation."
          - "قِدَم الدوا مالوش علاقة بإنه لازم ولا لأ."
          - "ساعات دواين لنفس المرض صح، دي مش قاعدة."
      - kind: reveal
        page: 52
        quote: "Simvastatin 40 mg daily; Verapamil 240 mg daily; Quinine Sulphate 300 mg daily"
        prompt: "إيه كمان في الروشتة غلط غير اللي فات؟"
        answer: |
          - **Simvastatin 40 مع verapamil**: خطر myopathy. الـ FDA سنة 2011 حدّد الـ simvastatin بـ 10 mg مع الـ verapamil.
          - **Quinine** للـ cramps: الـ FDA بيحذّر منه بسبب hematologic reactions خطيرة.
          - **Betahistine** للـ dizziness: indication ضعيف.
          - **Warfarin** مع falls و Hb 10.2: راجع الـ bleeding risk والـ INR.

          الحل: systematic review لكل دوا قصاد كل مرض، وغيّر حاجة واحدة في المرة.
