  - id: neph.L08.039
    kind: mcq
    topic: if-em
    stem: Immunofluorescence of a renal biopsy shows fine granular IgG along all capillary walls with no mesangial staining. Which disease fits best?
    options:
      - Membranous glomerulopathy
      - Anti-GBM GN
      - IgA nephropathy
      - Post-infectious GN
      - Type II MPGN
    answer: 0
    why:
      - Correct. Finely granular capillary wall IgG is the membranous pattern.
      - Anti-GBM GN gives linear, not granular, GBM staining.
      - IgA nephropathy is mesangial IgA.
      - Post-infectious GN is coarsely granular capillary wall C3.
      - Type II MPGN is band-like capillary wall C3 with coarse mesangial granules.
