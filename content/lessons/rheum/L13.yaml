      - kind: table
        page: 216
        quote: "Active pattern: Frequent giant capillaries and hemorrhages, moderate capillary loss."
        title: "الـ Scleroderma patterns"
        columns: ["Pattern", "Features"]
        rows:
          - ["Normal", "Uniform hairpin loops, evenly spaced, no bleeds"]
          - ["Early", "Few enlarged loops, few bleeds, architecture preserved"]
          - ["Active", "Frequent giant loops and bleeds, moderate loss"]
          - ["Late", "Severe loss, disorganized, ramified loops"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: mnemonic
        page: 216
        quote: "Late pattern: Severe capillary loss, disorganized architecture, ramified capillaries."
        word: "EAL"
        parts:
          - { key: "E", text: "Early: Enlarged loops, few, architecture kept" }
          - { key: "A", text: "Active: giAnt loops And bleeds, moderate loss" }
          - { key: "L", text: "Late: Loss, disorganized, ramified" }
        hook: |
          **E → A → L**: Enlarged، بعدين giAnt، بعدين Loss. كل ما تمشي في الحروف، الصف بيبوظ أكتر.
      - kind: reveal
        page: 216
        quote: "Active pattern: Frequent giant capillaries and hemorrhages, moderate capillary loss.\n3. Late pattern: Severe capillary loss, disorganized architecture, ramified capillaries."
        prompt: "ليه الـ capillaries بتكبر الأول (giant)، وبعدين بتختفي، وفي الآخر بتتفرّع (ramified)؟"
