          - { text: "More after fizzy drinks", bin: 1 }
          - { text: "Impedance rise from the distal to the proximal channel", bin: 1 }
        why: "الـ supragastric الهوا **داخل** للمريء الأول (antegrade) وبعدين يطلع، والسلوك بيختفي لما المريض يتلهي. الـ gastric الهوا **طالع** من المعدة لفوق، فالـ impedance بتعلى من تحت لفوق."
      - kind: reveal
        page: 108
        quote: "Impedance monitoring is the gold standard in the diagnosis of belching and aerophagia and helps to identify the underlying cause of belching and to differentiate supragastric belching from gastric belching."
        prompt: "إزاي الـ impedance بيفرّق بين النوعين؟"
        answer: |
          الكتاب: الـ ==impedance monitoring== هو الـ **gold standard** في الـ belching والـ aerophagia، لأنه بيبيّن **وجود الهوا وحركته** في المريء.
          - **Gastric belching**: الـ impedance بيعلى من الـ **distal** channel ويطلع لحد الأكتر **proximal**.
          - **Supragastric belching**: هوا داخل **antegrade** بسرعة (impedance حوالي 1000 Ω)، وبعدين بيطلع **retrograde** ويرجع للـ baseline.

          والأول قبل أي جهاز: **history** و **physical examination** يتأكد مفيش **red flags** زي weight loss و dysphagia، ويفهم التكرار والتوقيت.

          التفسير المقبول (مش في الكتاب): الهوا بيوصّل الكهربا وحش، فالـ impedance بيعلى مكان ما الهوا يعدّي. في الـ gastric الهوا طالع من تحت لفوق بس. في الـ supragastric الهوا **داخل من فوق وخارج تاني من فوق**، يعني عمره ما وصل المعدة.
      - kind: explain
        page: 108
        quote: "Psychoeducation is considered as the most effective strategy for treatment of supragastric belching and consists of speech pathology and cognitive behavioral therapy."
        title: "التشخيص والعلاج"
        text: |
          - الأول **history and examination**: تتأكد مفيش red flags زي weight loss أو dysphagia.
          - ==Impedance monitoring== هو **the gold standard**، وهو اللي بيفرق النوعين.
          - الـ **proton pump inhibitors (PPIs)** بتقلل التكريع في الـ gastroesophageal reflux disease (GERD)، غالبًا لأنها بتشيل الإحساس المزعج اللي بيشغّل الـ supragastric behavior.

          العلاج: ==psychoeducation== هو الأنجح، وهو **speech pathology** + **CBT**. والـ **baclofen** بس لو كل حاجة فشلت.

          والـ Rome IV بيطلب belching مزعج **more than 3 days a week**.
      - kind: table
        page: 109
        quote: "Table 1. Definitions of key terms\n| Term | Definition |\n|---|---|\n| Nausea | a painless, unpleasant, subjective feeling of wanting to vomit |\n| Vomiting | the forceful expulsion of gastric or intestinal contents |\n| Retching | abdominal muscle contractions with laboured rhythmic respiration |\n| Rumination | the effortless regurgitation of recently ingested food typically in the absence of nausea. Often the food tastes good and is re-swallowed. Rumination should be distinguished from vomiting even though patients will often refer to their problem as vomiting when they present with this condition |"
        title: "المصطلحات"
        columns: ["Term", "Meaning"]
        rows:
          - ["Nausea", "Painless, unpleasant, subjective feeling of wanting to vomit"]
          - ["Vomiting", "Forceful expulsion of gastric or intestinal contents"]
          - ["Retching", "Abdominal muscle contractions with laboured rhythmic respiration"]
          - ["Rumination", "Effortless regurgitation of recently eaten food, usually without nausea"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: case
        page: 106
        quote: "Supragastric belching is considered as an unintentional reaction to unpleasant feeling in the abdomen and/or retrosternal region which does not happen during sleep, speech, or during patient‘s distraction."
        stem: "A 35-year-old belches dozens of times an hour while sitting in clinic. It stops completely while he talks about his work and never happens at night."
        steps:
          - question: "Which type of belching is this?"
            options: ["Supragastric belching", "Gastric belching", "Rumination", "Aerophagia from carbonated drinks"]
            answer: 0
            why: "الكتاب: الـ supragastric **ما بيحصلش** في النوم أو الكلام أو لما المريض ينشغل."
          - question: "What is the most effective first treatment in the lecture?"
            options: ["Psychoeducation: speech therapy and CBT", "Baclofen first", "Fundoplication", "High-dose PPI for life"]
            answer: 0
            why: "الكتاب: الـ **psychoeducation** (speech pathology و CBT) أكتر استراتيجية فعّالة، والـ **baclofen** بس لو الباقي فشل."
      - kind: check
        page: 107
        quote: "Gamma-aminobutyric acid, metabotropic glutamate receptors, cannabinoid receptor 1, nitric oxide, and cholecystokinin are neurotransmitters that impact the amount of TLESRs."
        question: "Which drug from the belching section works on one of the TLESR mediators the lecture lists?"
        options:
          - "Baclofen, a GABA-B agonist"
          - "Domperidone"
          - "Ondansetron"
          - "Loperamide"
        answer: 0
        why:
          - "صح: الكتاب بيعدّ **GABA** من الـ neurotransmitters اللي بتأثر على عدد الـ TLESRs، وبيذكر الـ **baclofen** لو العلاجات التانية فشلت. التفسير المقبول (مش في الكتاب): الـ baclofen بيشتغل على مستقبل الـ GABA-B فبيقلّل الـ TLESRs."
          - "الـ domperidone للـ chronic idiopathic nausea."
          - "الـ ondansetron للـ CIN الـ refractory والـ IBS-D."
          - "الـ loperamide للإسهال."
      - kind: try
