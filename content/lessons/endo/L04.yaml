        page: 54
        quote: "Motility Disorders\n  a) Esophageal dysfunction -DM- Hyperthroidism.\n  b) Gastroparesis & billiary dyskinasia in DM.\n  c) Diarrhea:\n    DM (nocturnal diarrhea).\n    Hyperthyriodism.\n    Addisons disease.\n  d) Constipation:\n    Hypercalcemia.\n    Hypothyroidism."
