        why: "أول كارت فيه كل شروط الـ resectability. الباقي كلهم في قايمة الكتاب: main portal vein، atrophy + contralateral vessel، nodes، **cirrhosis** (patient factor)، و peritoneal mets."
      - kind: explain
        page: 335
        title: "Transplant: لمين؟"
        text: |
          النتايج **mixed**، بس ممكن نعمله في **highly selected** مرضى unresectable:

          - **Locally advanced disease (غالبًا hilar)** ماسك الأوعية الكبيرة (**portal vein, hepatic artery**) وممتد لـ **secondary biliary radicles**.
          - عنده **underlying biliary inflammation** (زي **PSC**) أو **hepatic dysfunction** تمنع الجراحة.

          **يُستبعد** لو فيه **regional lymph nodes** أو **distant metastasis**.

          وأغلب الـ high-volume centers بيدّوا **neoadjuvant chemo أو chemoradiotherapy** قبل الـ transplant، علشان يقللوا الـ recurrence من الـ metastasis والـ lymphatic spread.
      - kind: aside
        tone: trap
        page: 335
        text: |
          لاحظ المفارقة: الورم اللي **ماسك الـ portal vein والـ hepatic artery** مايتشالش بعملية resection، بس **ممكن ياخد transplant**.

          المنطق: في الـ transplant بتشيل الكبد **كله** بأوعيته، فمش محتاج «نص سليم». اللي بيمنع الـ transplant هو اللي **بره الكبد**: **nodes** و **distant mets**.
