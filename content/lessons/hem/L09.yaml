      - kind: update
        page: 140
        quote: "Based on their age and risk of vascular complications, patients may be stratified into:\n  Low risk\n  Intermediate risk\n  High risk\nHigh-risk patients are those;\n  Over 60 years old\n  With one or more high-risk features:\n    A platelet count ≥1500 × 10⁹/L\n    A prior history of thrombosis\n    Significant thrombotic risk factors such as diabetes or hypertension.\nIn high-risk patients, control of the platelet count with hydroxyurea reduces thrombotic events compared to no cytoreductive therapy."
        text: "الـ European LeukemiaNet بيستخدم **revised IPSET-thrombosis** (age >60، prior thrombosis، Janus kinase 2 (JAK2) V617F) وبيقسم لـ very low و low و intermediate و high. في الامتحان اكتب تقسيم الكتاب التلاتي."
        ref: "European LeukemiaNet MPN recommendations 2018 (revised IPSET-thrombosis)"
      - kind: reveal
        page: 140
        quote: "In high-risk patients, control of the platelet count with hydroxyurea reduces thrombotic events compared to no cytoreductive therapy."
        prompt: "ليه بننزّل الصفائح في الـ high risk بس، ومش في كل الـ ET؟"
        answer: |
          الكتاب بيقول إن في الـ **high-risk**، الـ hydroxyurea ==reduces thrombotic events compared to no cytoreductive therapy==. يعني الفايدة **اتثبتت** في المجموعة دي.

          التفسير المقبول (مش في الكتاب): أي دوا له تمن (cytopenias، جلد، قلق leukaemia). في مريض احتمال جلطته عالي، الفايدة أكبر من التمن. في شاب ما عندوش أي عامل خطر، الجلطة نادرة أصلًا، فالتمن أكبر من الفايدة، وده بيرجع في الـ intermediate اللي الكتاب بيقول «مش واضح» فيها.
      - kind: check
        page: 140
        quote: "High-risk patients are those;\n  Over 60 years old\n  With one or more high-risk features:\n    A platelet count ≥1500 × 10⁹/L\n    A prior history of thrombosis\n    Significant thrombotic risk factors such as diabetes or hypertension.\nIn high-risk patients, control of the platelet count with hydroxyurea reduces thrombotic events compared to no cytoreductive therapy."
        question: "67-year-old, JAK2+ ET, platelets 720, no thrombosis, no DM or HTN. Best treatment?"
        options: ["Hydroxycarbamide + aspirin", "Aspirin alone", "Observation", "Anagrelide first line"]
        answer: 0
        why:
          - "صح: فوق 60 لوحدها = high risk، و hydroxyurea + aspirin هو الـ first line."
          - "الـ aspirin لوحده للـ low risk (تحت 40)."
          - "الـ high risk بيتعالج؛ الـ hydroxyurea بيقلل التجلط."
          - "الـ anagrelide second line."
      - kind: explain
        remind: [hem.L09.055, hem.L10.074]
        page: 140
        title: "Hydroxycarbamide (hydroxyurea)"
        quote: "Hydroxycarbamide (hydroxyurea)\n  Orally bioavailable and generally very well tolerated, and it will reduce the hematocrit, leukocyte count and platelet count.\n  The commonest complications are leukopenia or thrombocytopenia, which are dose dependent and can usually be avoided by close monitoring of the blood count when the drug is first introduced.\n  In susceptible patients it can cause photosensitivity, painful leg ulcers and gastrointestinal side-effects.\n  Other important cutaneous toxicities include increased risk of sun-induced squamous skin lesions, these may be both cancerous and precancerous, and"
        text: |
          - **Oral** و **well tolerated**، بينزّل الـ **Hct والـ white blood cell (WBC) والـ platelets**.
          - أشهر مضاعفة: ==leukopenia or thrombocytopenia== (dose dependent)، فتابع الـ complete blood count (CBC) كويس **أول ما تبدأه**.
          - كمان: **photosensitivity**، **painful leg ulcers**، gastrointestinal (GI) upset، **sun-induced squamous skin lesions** (cancerous و precancerous)، و pigmentation. يعني نبّهه وانصحه يبعد عن الشمس.
          - الجرعة **0.5–2 g/day**.

          ليه بينزّل التلات خطوط مع بعض؟ التفسير المقبول (مش في الكتاب): هو بيوقّف تصنيع الـ **DNA** في أي خلية بتنقسم بسرعة، والنخاع كله بينقسم بسرعة. عشان كده الـ cytopenia **dose dependent**، وعشان كده الجلد (اللي بيتجدد بسرعة) بيتأثر.
      - kind: reveal
        page: 141
        quote: "At present, no convincing data show that hydroxycarbamide, when used as a single agent, significantly increases the risk of leukemia, although a small effect cannot be excluded.\nPreliminary data from studies of hydroxycarbamide in sickle cell disease are reassuring (follow-up of >20 years); however, sickle cell disease is not an acquired clonal disease with an inherent tendency to leukemic transformation, so whilst this data is reassuring; it is not directly transferable to MPN patient populations."
        prompt: "مرضى الـ sickle cell بياخدوا hydroxycarbamide أكتر من 20 سنة ومفيش leukaemia زيادة. ليه ده مش كفاية يطمّنا في الـ MPN؟"
        answer: |
          لأن الـ **sickle cell disease** ==not an acquired clonal disease with an inherent tendency to leukemic transformation==.

          الـ MPN نفسه **clone** عنده ميل يتحول. فالسؤال مش «الدوا بيعمل leukaemia في نخاع سليم؟»، السؤال «هل بيزقّ clone جاهز أصلًا؟». والـ data بتاعة الـ sickle cell ما بتجاوبش على السؤال ده، فهي **reassuring** بس **not directly transferable**.

          والخلاصة زي ما الكتاب قال: **no convincing data** إنه لوحده بيزوّد الخطر، بس **small effect cannot be excluded**. والقلق القديم جه من دراسات صغيرة أو مرضى خدوا cytotoxics تانية معاه.
      - kind: explain
        page: 141
        title: "Anagrelide: second line للـ ET بس"
        quote: "Anagrelide can be useful in controlling the platelet count and can be combined with hydroxycarbamide allowing lower doses of both agents.\nThe usual dose is 1–2 mg daily, but occasional patients may require doses of up to 8 mg daily.\nIts side-effects are mainly secondary to its inotropic and vasodilatory properties (e.g. headaches, palpitations and fluid retention) although marked anemia may also occur.\nAnagrelide is currently only approved for patients with ET and as second-line therapy."
        text: |
          - ==Anagrelide== بينزّل **الصفائح**، وممكن مع الـ hydroxycarbamide عشان **lower doses of both agents**.
          - الجرعة **1–2 mg/day**، ونادرًا لحد **8 mg**.
          - أعراضه من الـ **inotropic and vasodilatory** properties: **headaches، palpitations، fluid retention**، وممكن **marked anemia**.
          - **Approved for ET only**، و **second line**.

          ليه الجمع بين الاتنين مفيد؟ التفسير المقبول (مش في الكتاب): كل دوا بينزّل الصفائح بطريقة مختلفة، فلما تجمعهم بجرعة صغيرة من كل واحد، بتاخد نفس النتيجة وأعراض كل دوا أقل (الـ cytopenia من ده، والقلب من ده).

          وليه الأعراض قلب وأوعية؟ لأن الدوا بيوسّع الأوعية (صداع) وبيقوّي ضربات القلب (palpitations)، والأوعية الموسّعة بتسرّب سوائل (fluid retention).
      - kind: aside
        tone: joke
        page: 141
        quote: "Its side-effects are mainly secondary to its inotropic and vasodilatory properties (e.g. headaches, palpitations and fluid retention) although marked anemia may also occur."
        text: "الـ anagrelide عامل زي تالت فنجان قهوة الساعة 2 بالليل في النبطشية: قلبك بيدق (palpitations)، دماغك بتوجعك، وفي الآخر رجلك ورمت."
      - kind: check
