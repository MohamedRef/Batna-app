          الـ DD للـ acute kidney injury (AKI) في الـ transplant: **pre-renal**، **acute tubular necrosis (ATN)**، **allergic interstitial nephritis (AIN)**، ==calcineurin inhibitor (CNI) toxicity==، **infections**، **acute rejection**، **recurrence**، **vascular thrombosis**، و **obstruction**.
      - kind: mnemonic
