      - kind: explain
        page: 77
        quote: "Screening for Depression\n  Depression is the most common mental disorder of old age.\n  Depression in old age is often both underdetected and untreated.\n  The use of screening questionnaires increases recognition rates of depression."
        title: "مستخبي وبيموّت"
        text: |
          - الـ ==depression== هو **most common mental disorder of old age**، وغالبًا **underdetected and untreated**.
          - الـ **screening questionnaires** بتزوّد التشخيص.

          وبيزوّد الخطر:
          - موت من الـ **cardiovascular** (RR **1.8**)، بس **مش** من الـ cancer.
          - **Coronary heart disease** (RR **2.1**).
          - موت لحد 10 سنين بعد **stroke** (RR **أكتر من 3**).

          ليه underdetected؟ التفسير المقبول (مش في الكتاب): الكبير ممكن يشتكي من **أعراض جسمية** (تعب، نوم، أكل، ألم) بدل «أنا زعلان»، والأعراض دي بتتنسب للسن أو للمرض العضوي. علشان كده الـ **screening questionnaires** بتفرق: بتسأل السؤال اللي محدش بيسأله.

          وليه بيزوّد موت القلب ومش الـ cancer؟ التفسير المقبول (مش في الكتاب): الاكتئاب بيأثر على حاجات القلب حساس ليها: التزام أقل بالأدوية والرياضة، تدخين أكتر، وstress hormones أعلى. علشان كده الكتاب بيربطه بالـ coronary heart disease والـ stroke، مش بالأورام.
