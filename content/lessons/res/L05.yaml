      - kind: case
        page: 72
        quote: "Qs 1-4: In a community-based study, the incidence rate of lung cancer was 120/100,000 for smokers and 10/100,000 for nonsmokers.\n1. What is the Relative Risk (Risk Ratio) of developing lung cancer for smokers compared with nonsmokers?\n  A. 5\n  B. 12\n  C. 50\n  D. 100\n  E. 120\n2. The above calculated Relative Risk is interpreted as follows:\n  A. The risk of developing lung cancer is 'x' times higher in smokers compared to nonsmokers.\n  B. The probability of being a smoker is 'x' times greater among those with lung cancer compared to those without lung cancer."
        stem: "Lung cancer incidence: 120/100,000 in smokers, 10/100,000 in non-smokers (the lecturer's own questions)."
        steps:
          - question: "Relative risk?"
            options: ["5", "12", "50", "120"]
            answer: 1
            why: "120 ÷ 10 = **12**."
          - question: "Interpretation?"
            options:
              - "The risk of lung cancer is 12 times higher in smokers than non-smokers"
              - "The probability of being a smoker is 12 times greater among those with lung cancer"
            answer: 0
            why: "الـ RR بيتكلم عن **risk of disease**. الجملة التانية لغة الـ OR في الـ case-control."
          - question: "Attributable risk?"
            options: ["11/100,000", "50/100,000", "110/100,000", "120/100,000"]
            answer: 2
            why: "120 − 10 = **110 per 100,000**."
          - question: "Attributable risk percent?"
            options: ["78%", "80%", "92%", "99%"]
            answer: 2
            why: "110 ÷ 120 × 100 = 91.7% ≈ **92%**."
