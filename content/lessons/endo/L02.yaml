  - id: endo.L02.lesson5
    title: "الغدة الدرقية في الحمل: مين نفحصه، والـ hyperthyroidism"
    hook: "الـ total T4 عالي، والغدة كبيرة، والنبض سريع. وكل ده ممكن يبقى حمل طبيعي."
    minutes: 9
    pages: [25, 27]
    topics: [thyroid-screening, hyperthyroid]
    goals:
      - "تعرف مين نعمله thyroid screening في الحمل وليه"
      - "تشخّص الـ hyperthyroidism صح وتعرف خطر الـ TSHR antibodies"
      - "تعرف علاج Graves' في الحمل وسبب كل ممنوع"
    status: unverified
    steps:
      - kind: explain
        page: 25
        quote: "SCREENING FOR THYROID DYSFUNCTION DURING PREGNANCY\n  1. Women with a history of hyperthyroid or hypothyroid disease, PPT, or thyroid lobectomy.\n  2. Women with a family history of thyroid disease.\n  3. Women with a goiter.\n  4. Women with thyroid antibodies (when known).\n  5. Women with symptoms or clinical signs suggestive of thyroid underfunction or overfunction, including anemia, elevated cholesterol, and hyponatremia.\n  6. Women with type I diabetes.\n  7. Women with other autoimmune disorders.\n  8. Women with infertility who should have screening with TSH as part of their infertility work-up.\n  9. Women with previous therapeutic head or neck irradiation.\n  10. Women with a history of miscarriage or preterm delivery."
        title: "مين نعمله screening؟"
        text: |
          ==عشر فئات==:
          1. تاريخ hyper أو hypo، أو postpartum thyroiditis (PPT)، أو lobectomy.
          2. Family history.
          3. Goiter.
          4. Thyroid antibodies معروفة.
          5. أعراض أو علامات، ومنها anemia، cholesterol عالي، hyponatremia.
          6. Type 1 diabetes.
          7. أمراض autoimmune تانية.
          8. Infertility (TSH من ضمن الـ work-up).
          9. Head or neck irradiation.
          10. Miscarriage أو preterm delivery قبل كده.

          ليه دول بالذات؟ لو بصيت هتلاقيهم أربع مجموعات:
          - **الغدة نفسها عندها تاريخ أو شكل** (1، 3، 9): غدة اتأذت أو كبرت قبل كده.
          - **المناعة** (2، 4، 6، 7): الـ thyroid disease في الحمل أغلبه autoimmune، فاللي عندها مرض مناعي أو عيلة أو antibodies احتمالها أعلى.
          - **علامات بتلمّح** (5): الـ anemia والـ cholesterol العالي والـ hyponatremia بيحصلوا في الـ hypothyroidism.
          - **نتيجة حمل وحشة** (8، 10): لأن الغدة المضطربة نفسها بتسبب infertility وإجهاض.
      - kind: mnemonic
        page: 25
        quote: "Mechanism of Thyroid Dysfunction During Pregnancy\n  Immunological modifications.\n  Relative iodine deficiency.\n  Changes in thyroid hormone metabolism\n  Direct effect of HCG on the thyroid gland."
        word: "IIMH"
        parts:
          - { key: "I", text: "Immunological modifications" }
          - { key: "I", text: "Iodine: relative deficiency" }
          - { key: "M", text: "Metabolism of thyroid hormone changes" }
          - { key: "H", text: "Human chorionic gonadotropin (hCG) acts directly on the thyroid" }
        hook: "الحمل بيلعب في الغدة بـ 4 طرق: **I-I-M-H**. الـ hCG شبه الـ TSH، فبيقدر ينبّه الغدة نفسها."
      - kind: explain
        page: 26
        quote: "Hyperthyroidism and Pregnancy Diagnosis\n  Both pregnancy and hyperthyroidism are accompanied by thyroid enlargement, hyperdynamic circulation\n  Amenorrhea many occur in hyperthyroidism not associated with pregnancy.\n  In both conditions total T3 and T4 are elevated.\n  Thyroid function tests should be monitored in every pregnant women with severe hyperemesis gravidarum.\n  The most accurate test for diagnosis of hyperthyroidism during pregnancy is the combination of elevated FT4 and suppressed TSH levels (0.1 mu/L)."
        title: "تشخيص الـ hyperthyroidism"
        text: |
          الحمل والـ hyperthyroidism الاتنين فيهم: thyroid enlargement، hyperdynamic circulation، و ==total T3 و T4 عاليين==.

          ==أدق تحليل==: **free thyroxine (FT4) عالي + thyroid-stimulating hormone (TSH) suppressed (0.1 mU/L)**.

          وأي ست عندها **severe hyperemesis gravidarum** نعملها thyroid function.

          ليه الـ hyperemesis بالذات؟ الكتاب في ص 25 بيقول إن من أسباب اضطراب الغدة في الحمل ==direct effect of HCG on the thyroid==. التفسير المقبول (مش في الكتاب): الـ hCG شبه الـ TSH في التركيب، والـ hyperemesis بيحصل لما الـ hCG يبقى عالي قوي، فيبقى عالي كفاية إنه ينبّه الغدة. وليه الـ TSH مع الـ FT4 مش الـ total؟ شوف السؤال الجاي.
      - kind: reveal
