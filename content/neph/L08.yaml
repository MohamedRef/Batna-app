  - id: neph.L08.193
    kind: essay
    topic: transplant
    prompt: State the Banff 2017 criteria for active antibody-mediated rejection.
    outline:
      - "1. Acute tissue injury (≥1)": ["Microvascular inflammation (g > 0 and/or ptc > 0) without GN", "Intimal or transmural arteritis (v > 0)", "Acute TMA or acute tubular injury without another cause"]
      - "2. Antibody interaction with endothelium (≥1)": ["Linear C4d in peritubular capillaries", "At least moderate MVI (g + ptc ≥ 2)", "Validated ABMR gene transcripts"]
      - "3. Donor-specific antibodies": ["DSA to HLA or other antigens; C4d or transcripts may substitute, but DSA testing is strongly advised"]
    src: { page: 282, quote: "Active ABMR; all 3 criteria must be met for diagnosis" }
