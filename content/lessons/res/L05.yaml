          - **Ie** = death rate مع Apgar 0-3 = ==34.4%==.
          - **Io** = death rate مع Apgar أعلى (4-6) = ==12.5%==.

          بالرقمين دول هتحسب الـ ARP في السؤال الجاي.
      - kind: check
        page: 61
        quote: "For the Apgar score–infant mortality data, the attributable risk percent is ARP = (0.344 - 0.125) / 0.344 X 100 = 63.7%\nAlmost two thirds of the total risk of infant mortality for newborns who weigh more than 2500 g and have 10-minute Apgar scores of 0–3 (exposed) is related to an Apgar score below the 4–6 level.\nThe attributable risk percent typically is used as an indicator of the public health impact of exposure.\nThese data suggest that birth asphyxia is a major contributor (63.7%) to, but not the sole cause of, infant mortality among severely asphyxiated children."
        question: "Death rate 34.4% with Apgar 0–3 vs 12.5% with Apgar 4–6. The attributable risk percent is:"
