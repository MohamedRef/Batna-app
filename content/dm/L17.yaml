    status: unverified
  - id: dm.L17.055
    kind: card
    topic: radiology
    front: What are Schmorl's nodes, and in which bone disease are they more common?
    back: Herniation of the nucleus pulposus through a weakened end-plate into the vertebral body; more common in primary osteoporosis and rare in osteomalacia.
    src: { page: 221, quote: "Schmorl's nodes are more common in primary osteoporosis and rarely appear in osteomalacia." }
    status: unverified
    tags: [high-yield]
