        text: |
          الكتاب بيحط 4 شروط:

          - **مفيش** metastases، ولا **regional lymph nodes**، ولا **portal vein extension**، ولا **bilateral ductal extension**.
          - **Sufficient functional liver volume** (اللي هيفضل لازم يكفي).
          - الـ imaging بيقول إن الجرّاح يقدر يشيل بـ **clear margins** و **يضّف جنب واحد على الأقل** من الـ biliary tree.
          - مفيش **comorbidities** تمنع العملية.
      - kind: aside
        tone: analogy
