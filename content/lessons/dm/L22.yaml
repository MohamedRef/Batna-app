            <text x="148" y="184" class="t-sm">16.2% IPE</text>
            <text x="10" y="210" class="t-sm t-acc">−26% · NNT 28</text>
          </svg>
      - kind: check
        page: 279
        quote: "ADA 2024: Diabetic Dyslipidemia\n10.30 In individuals with atherosclerotic cardiovascular disease or other cardiovascular risk factors on a statin with controlled LDL cholesterol but elevated triglycerides (135–499 mg/dL), the addition of icosapent ethyl can be considered to reduce cardiovascular risk. A"
        question: "Per ADA 2024, icosapent ethyl is considered when TG on a statin (with controlled LDL-C) is:"
