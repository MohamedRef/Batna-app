        title: "مين بيقلّد الـ IBS؟"
        text: |
          جدول الكتاب (ص 120) بيقارن الـ IBS بالأمراض اللي ممكن تقلّده، وكل واحد بعلامته:
          - **Crohn's disease**: fatigue، diarrhoea، ألم، **weight loss**، **fever**، **rectal bleeding**، oral ulcers، **perianal fistulae** و abscesses، وممكن mass في الـ ileocecal area.
          - **Ulcerative colitis**: **bloody diarrhoea**، urgency، و extraintestinal manifestations؛ الـ colonoscopy فيها **rectal involvement** و continuous erythema.
          - **Coeliac disease**: iron-deficiency anaemia، hypocalcaemia، ممكن weight loss و osteoporosis؛ الـ antiendomysial والـ tissue transglutaminase antibodies، و **villous atrophy** في الـ biopsy.
          - **Colon cancer**: تغيّر في الـ bowel habit، دم في البراز، وأحيانًا rectal mass.
          - **Giardia lamblia**: diarrhoea، nausea، bloating؛ الـ stool exam والـ Giardia antigen.

          التفسير المقبول (مش في الكتاب): لاحظ إن كل واحد فيهم عنده حاجة **الـ IBS ما عندوش**: دم، وزن بينزل، حرارة، أنيميا، antibodies. علشان كده الـ IBS تشخيص بأعراض **إيجابية** (Rome) **و** غياب العلامات دي.
