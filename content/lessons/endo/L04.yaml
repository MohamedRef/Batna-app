  - id: endo.L04.lesson5
    title: "البطن والغدد: الـ malabsorption والحركة والبنكرياس"
    hook: "طفل قصير عنده Crohn's، الـ GH بتاعه عالي مش واطي. إزاي يبقى قصير والـ GH عالي؟"
    minutes: 9
