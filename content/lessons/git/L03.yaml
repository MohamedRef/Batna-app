  - id: git.L03.lesson2
    title: "المريء سليم، بس بيوجع"
    hook: "حرقان مش بيرد على الـ PPI، وكل الفحوصات نضيفة. هنمشي الـ algorithm خطوة خطوة لحد ما نوصل للتشخيص."
    minutes: 10
    pages: [88, 99]
    topics: [heartburn, chest-pain, globus-dysphagia]
    goals:
      - "تمشي الـ algorithm من الـ PPI trial لحد functional heartburn"
      - "تفرّق functional heartburn عن reflux hypersensitivity من نتيجة الـ pH test"
      - "تعرف work-up الـ noncardiac chest pain وعلاجه"
      - "تفرّق globus عن functional dysphagia"
    status: unverified
    steps:
      - kind: explain
        page: 88
        quote: "The diagnosis is typically made after the exclusion of gastroesophageal reflux disease and a primary esophageal motility abnormality"
        title: "تشخيص بالاستبعاد"
        text: |
          الـ **functional esophageal disorders** أعراض مفروض جاية من المريء، بس الفحوصات المتاحة مش بتلاقي سبب.

          فالتشخيص بييجي بعد ما تستبعد حاجتين: ==GERD== و **primary motility abnormality** زي achalasia أو diffuse esophageal spasm.

          الـ domain A فيه: **functional chest pain**، **functional heartburn**، **reflux hypersensitivity**، **globus** و **functional dysphagia**.
      - kind: figure
        page: 89
        quote: "an ambulatory or an impedance pH test is undertaken after keeping the patient off a PPI for at least 7 days"
        title: "الـ algorithm بتاع الحرقان"
        alt: "Flowchart down the left: heartburn without alarm symptoms, then a 4-week optimal-dose PPI trial (response means GERD), then EGD if no response (abnormal means treat the cause), then pH-impedance off PPI for at least 7 days if EGD is normal (high acid exposure means GERD), then symptom association with normal acid exposure (positive means reflux hypersensitivity), then manometry if negative (achalasia or DES means a motor disorder), and finally a normal manometry means functional heartburn. A note says alarm symptoms skip the PPI trial and go to EGD first."
        caption: "كل خطوة بتشيل سبب. اللي يفضل في الآخر بعد ما الـ pH والـ manometry يطلعوا نضاف هو الـ functional heartburn."
        svg: |
