  - id: neph.L07.079
    kind: card
    topic: adpkd-tx
    front: Why are ACE inhibitors or ARBs preferred for hypertension in ADPKD?
    back: They increase renal blood flow, are well tolerated and may be renoprotective beyond BP control; HALT PKD supports them as the antihypertensive of choice.
    src: { page: 159, quote: "Control of hypertension is essential because uncontrolled hypertension accelerates the decline in renal function and aggravates extra renal com- plications. Antihypertensive agents of choice and optimal BP targets in ADPKD have not been established. Angiotensin-converting enzyme (ACE) inhibitors or angiotensin receptor blockers (ARBs) increase renal blood flow in ADPKD, have a favorable side effect profile, and may have renoprotective properties that go beyond BP control. The HALT PKD study, a recent double-blind, placebo- controlled randomized clini-cal trial (RCT), examined the role of RAS blockade in both early and advanced ADPKD.31,32 Monotherapy with ACE inhibitors gave good BP min/1.73 m²). The HALT PKD study therefore supports the use of an ACE inhibitor or ARB as the antihypertensive medication of choice in most patients with ADPKD and a rigorous BP target (95 to 110/60 to 75 mm Hg) in young patients with ADPKD with normal renal function and without other significant comorbidities." }
    status: unverified
    tags: [high-yield]
