        title: "خطة الـ AAV"
        alt: "Algorithm. New AAV splits into organ- or life-threatening disease treated with cyclophosphamide or rituximab plus glucocorticoid, and non-organ-threatening disease treated with methotrexate or mycophenolate plus glucocorticoid. Rapidly progressive renal failure or pulmonary haemorrhage adds consideration of plasma exchange. Both lead to remission, then maintenance with azathioprine, methotrexate or rituximab and a glucocorticoid taper, and after 2 years taper or stop."
        caption: "السؤال الأول: ==organ-threatening ولا لأ؟== وبعدين maintenance **≥24 شهر**."
