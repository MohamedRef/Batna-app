      - kind: explain
        page: 330
        title: "الأشكال بتتغير"
        quote: "Some patients present with more than one pattern, and many change the pattern of their arthritis during follow-up."
        text: |
          خلي بالك من حاجتين في الـ Moll and Wright (1973):
          - فيه عيانين بييجوا بـ **أكتر من pattern**، وكتير منهم ==بيغيّروا الـ pattern== مع المتابعة.
          - الـ **oligoarticular** كان **70%** في الوصف الأصلي، بس دراسات بعد كده لقت **polyarticular 63%** مقابل oligo **13%**.

          ليه الأرقام اختلفت؟ لأن المرض بيتغيّر مع الوقت: اللي بيبدأ oligo ممكن يبقى poly بعد سنين، فالدراسة اللي بتتابع أطول بتلاقي poly أكتر (التفسير المقبول، مش في الكتاب). في الامتحان: الكتاب بيقول **oligo 70%**، وبعدين يذكر الـ 63/13.

          والـ **sausage-shaped digit** (dactylitis) شائع في الـ oligo pattern.
      - kind: reveal
        page: 331
        quote: "Of the hands & feet is sometimes referred to as \"classic psoriatic arthropathy\" (10%), Nail pitting, transverse depressions and subungual hyperkeratosis often occur in association with this pattern. DIP joints are frequently involved in PsA but not so in RA because these joints have many entheses but very little synovial tissue."
        prompt: "ليه الـ DIP بتتعب في الـ PsA ومش في الـ RA؟"
        answer: |
          الـ **RA** مرض **synovitis**: محتاج synovium كتير. الـ DIP فيها synovium قليل جدًا.

          الـ **PsA** مرض **enthesitis**: والـ DIP مليانة ==entheses== (أوتار وأربطة داخلة في العضم). علشان كده الـ DIP + الضافر المنقّر = PsA.
      - kind: check
        page: 331
        quote: "A severe deforming arthritis in which there is massive destruction of the phalanges. Although it is rare, it may develop in more patients with time if their disease is not properly controlled."
        question: "Which PsA pattern shows massive destruction of the phalanges?"
        options: ["Arthritis mutilans", "Asymmetric DIP", "Oligoarticular", "Symmetric RA-like"]
        answer: 0
        why:
          - "صح: 5%، ومحتمل يزيد لو المرض مش متسيطر عليه."
          - "الـ DIP pattern بيبقى مع الـ nail changes."
          - "الـ oligo asymmetric مع sausage digit."
          - "الـ RA-like symmetric، RF negative."
      - kind: table
        page: 332
        quote: "Patients who are HLA-B27 negative have different clinical features with similar frequency in males and females, older age of onset, less back pain, more frequent cervical spine disease, with radiographic features including asymmetrical, unilateral sacroiliitis and non-marginal, bulky syndesmophytes which are often asymmetric and discontinuous skipping vertebral levels."
        title: "الـ axial PsA: B27 بيفرق"
        columns: [Feature, B27+, B27−]
        rows:
          - ["Onset", "Earlier", "Older"]
          - ["Back pain", "More", "Less"]
          - ["Neck", "–", "More cervical"]
          - ["SI joints", "Like AS", "Unilateral, asymmetric"]
          - ["Syndesmophytes", "Like AS", "Bulky, skipping"]
        hide: [[0, 2], [2, 2], [3, 2], [4, 2]]
      - kind: aside
        tone: tip
        page: 332
        quote: "Axial disease in PsA is more complicated. HLA-B27 gene is present in about 30% of patients with axial PsA. Predominant spondyloarthritis is uncommon, although spinal involvement may be found in 40% to 70% of PsA cases, depending on whether or not radiographs are taken."
        text: "الـ **B27** موجود في **30%** بس من الـ axial PsA، والعمود الفقري ممكن يتأثر في **40–70%** (حسب لو عملت أشعة ولا لأ). الـ B27-negative بيعمل syndesmophytes **bulky** و **non-marginal** و **بتنطّ** فقرات."
      - kind: explain
        page: 332
        title: "الـ enthesitis"
        quote: "The most common entheseal sites involved are:\n  The Achilles.\n  Plantar fascia insertions.\n  Insertions of the quadriceps and patellar tendons.\n  The iliac crest.\n  The rotator cuff.\n  The epicondyles at the elbow."
        text: |
          ممكن تكون أول عرض: ألم و tenderness وأحيانًا تورم.

          أشهر الأماكن: ==Achilles==، **plantar fascia**، **quadriceps/patellar** tendons، **iliac crest**، **rotator cuff**، و **epicondyles**.

          وممكن تبقى **asymptomatic**: الـ **ultrasound (US)** أحسن من الـ palpation.

          ليه الأماكن دي؟ لأنها أكبر نقط بيشد فيها وتر أو رباط على العضم وعليها حمل ميكانيكي كبير، والـ PsA مرض enthesis في الأساس (زي ما شفت في الـ DIP).
      - kind: check
        page: 332
        quote: "Entheseal involvement may be asymptomatic, and US is more sensitive than clinical palpation."
        question: "A PsA patient has no heel pain, but you suspect Achilles enthesitis. Best way to detect it?"
