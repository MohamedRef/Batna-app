  - id: res.L07.084
    kind: card
    topic: ethics
    front: What is the International Standard Randomised Controlled Trial Number (ISRCTN) registry?
    back: >-
      International Standard Randomised Controlled Trial Number: a World Health Organization (WHO)-recognized primary registry that accepts all clinical research
      studies involving humans (proposed, ongoing or completed), gives the unique number needed for publication, and is freely searchable.
