  # ---------------- cases ----------------
  - id: res.L06.082
    kind: case
    topic: allocation
    stem: >-
      A chest physician at Abbassia wants to compare a new long-acting inhaler with the current one in 30 patients
      with chronic stable asthma. The new drug's half-life is 12 hours.
    steps:
      - question: Which design lets each patient act as their own control and needs the smallest sample?
        options: [Parallel, Crossover, Cluster, Factorial]
        answer: 1
        why: Chronic stable disease and a drug whose effect develops during the period fit a planned crossover; subjects are their own controls and the sample is smaller.
      - question: How long should the washout between the two periods be?
        options: [12 hours, 24 hours, 60 hours, 2 weeks is never needed]
        answer: 2
        why: Washout = five half-lives, 5 × 12 h = 60 h, so the first inhaler does not carry over into the second period.
      - question: "Ten patients feel better on whichever inhaler they get first, just from being in the study. Which crossover disadvantage is this?"
        options: [Carryover, Effect of the order of interventions (psychological response), Dropouts from the 2nd treatment, Cluster effect]
        answer: 1
        why: The order of treatments can change the response psychologically; carryover is a drug effect leaking into the next period.
    src: { page: 27, quote: "Wash out period five times half life of the drug" }
    status: unverified
  - id: res.L06.083
    kind: case
    topic: superiority
    stem: >-
      A pharmaceutical company in 6th of October City has a cheaper oral anticoagulant with fewer drug interactions.
      They want to show it is not worse than the current standard drug at preventing stroke in atrial fibrillation.
    steps:
      - question: What kind of trial by hypothesis?
        options: [Superiority, Non-inferiority, Phase I, Split-body]
        answer: 1
        why: Its selling point is cost and fewer interactions; it only needs to be not worse than the standard.
      - question: What should the control group receive?
        options: [Placebo, No treatment, The current standard drug (active control), Half the new drug]
        answer: 2
        why: Withholding anticoagulation in AF is unsafe; the comparison is with usual care, an active control.
      - question: In which phase does this large, randomised, double-blind, multicentre comparison usually take place?
        options: [Phase I, Phase II, Phase III, Phase IV]
        answer: 2
        why: Phase III is large, randomised, active-controlled, double blind, parallel and multicentre.
    src: { page: 19, quote: "Fewer side effects, Greater convenience, Lower cost, Higher quality of life . Fewer drug interaction" }
    status: unverified
