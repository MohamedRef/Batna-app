- id: res.L14.001
  kind: enumerate
  topic: screening
  prompt: Enumerate the three levels of prevention, with the slide's example of each.
  points:
  - 'Primary prevention: intervene before the disease develops (e.g. immunisation)'
  - 'Secondary prevention: intervene after the disease develops to reduce severity or recurrence (e.g. screening)'
  - 'Tertiary prevention: intervene after the disease develops to reduce its consequences (e.g. screening for diabetic eye
    disease)'
  pass: 3
  hook: 'الوقاية 3 أدوار «قبل، بدري، وبعد»: primary قبل المرض (immunisation)، secondary تقلل الـ severity (screening)، و tertiary
    تقلل الـ consequences (screening for diabetic eye disease).'
  src:
    page: 2
    quote: |-
      Intervene before disease develops: primary prevention e.g. immunisation
      Intervene after disease develops to reduce severity or recurrence: secondary prevention e.g. screening
      Intervene after disease develops to reduce consequences: tertiary prevention e.g. screening for diabetic eye disease
  status: unverified
  tags: [high-yield]
- id: res.L14.002
  kind: mcq
  topic: screening
  stem: 'On the slide''s prevention timeline, screening diabetics for eye disease is an example of:'
  options:
  - Tertiary prevention
  - Primary prevention
  - Secondary prevention
  - Health promotion
  answer: 0
  why:
  - The diabetes is already there; finding its eye complication early reduces the consequences (disability), which the slide
    calls tertiary prevention.
  - Primary prevention acts before the disease develops, like immunisation.
  - Secondary prevention screens for the disease itself to reduce its severity; here the disease (diabetes) is already known.
  - Health promotion is not one of the three levels on the slide.
  src:
    page: 2
    quote: |-
      Intervene before disease develops: primary prevention e.g. immunisation
      Intervene after disease develops to reduce severity or recurrence: secondary prevention e.g. screening
      Intervene after disease develops to reduce consequences: tertiary prevention e.g. screening for diabetic eye disease
  status: unverified
  tags: [high-yield]
- id: res.L14.003
  kind: card
  topic: screening
  front: What is the iceberg phenomenon of disease?
  back: Disease progresses from sub-clinical stages to overt disease. The hidden mass of unrecognised (undiagnosed) cases
    in the community is the submerged part of the iceberg; the apparent, overt cases physicians see are the floating tip.
    Detecting the hidden mass is a challenge to preventive medicine.
  src:
    page: 3
    quote: |-
      Iceberg Phenomenon
      The disease progress from sub-clinical stages to overt or apparent disease
      The hidden mass of unrecognised disease in the community (undiagnosed cases) corresponds to the submerged portion of the iceberg
      What physicians see in their practices (apparent and overt cases) corresponds to the floating tip
      Detection of this mass is a challenge to preventive medicine
  status: unverified
  tags: [high-yield]
- id: res.L14.004
  kind: mcq
  topic: screening
  stem: 'In the iceberg phenomenon, the submerged portion of the iceberg corresponds to:'
  options:
  - Undiagnosed cases of unrecognised disease in the community
  - The cases physicians see in their practices
  - People who will never develop the disease
  - Cases that have died of the disease
  answer: 0
  why:
  - The hidden mass of unrecognised disease is under the water, and finding it is preventive medicine's challenge.
  - Those apparent, overt cases are the floating tip.
  - Healthy people are not part of the iceberg at all.
  - Deaths are not what the iceberg describes; it contrasts hidden and overt cases.
  src:
    page: 3
    quote: |-
      The hidden mass of unrecognised disease in the community (undiagnosed cases) corresponds to the submerged portion of the iceberg
      What physicians see in their practices (apparent and overt cases) corresponds to the floating tip
  status: unverified
- id: res.L14.005
  kind: card
  topic: screening
  front: Define disease screening.
  back: A process of identifying apparently healthy people who may be at increased risk of a disease. They can then be offered
    further diagnostic tests and appropriate treatment to reduce the risk of the disease or its complications.
  src:
    page: 4
    quote: |-
      A process of identifying apparently healthy people who may be at increased risk of a disease.
      They can then be offered further diagnostic tests and appropriate treatment to reduce the risk of the disease or its related complications.
  status: unverified
  tags: [high-yield]
