          - المشكلة الحقيقية إن نتيجتها **variable and unpredictable**: مش هتعرف هتنفع معاه هو ولا لأ.

          يعني الصراحة مع العيان: آمنة غالبًا، بس مش مضمونة. وده سبب إن الكتاب حاططها كـ «preliminary evidence» مش أول علاج.
