  - id: endo.L04.lesson8
    title: "المخ والمفاصل: الغدد في أمراض الأعصاب والروماتيزم"
    hook: "ست عندها lupus والـ prolactin عالي، وواحدة تانية عندها antiphospholipid syndrome وقعت فجأة بـ addisonian crisis. الروماتيزم بيلعب في الغدد إزاي؟"
    minutes: 9
    pages: [56, 58]
    topics: [cns, rheumatic]
    goals:
      - "تشرح الرابط بين الـ CNS والغدد وتعدّ 4 أمراض عصبية ليها تغير هرموني"
      - "تعرف التأثير الهرموني لأمراض الروماتيزم"
      - "توصّل علامة الروماتيزم بالغدة اللي ممكن تكون وراها"
    status: unverified
    steps:
      - kind: explain
        page: 56
        quote: "The endocrine and nervous system are linked together. The hypothalamus connects these two important systems."
        title: "المخ والغدد: الـ hypothalamus هو الكوبري"
        text: |
          الرابط بين الجهازين هو ==الـ hypothalamus== في قاعدة الـ forebrain. ليه هو بالذات؟ لأنه بيعمل الشغلتين:
          - **عصبي**: بيتحكم في الاحتياجات الأساسية زي النوم والجوع والعطش والجنس، وفي الانفعالات والـ stress responses.
          - **هرموني**: بيتحكم في الـ **pituitary**، واللي بدوره بيتحكم في إفراز باقي الغدد.

          يعني أي مرض في المخ قريب من المنطقة دي ممكن يلخبط الغدد، وأي اضطراب هرموني ممكن يبان كأعراض نوم أو جوع أو مزاج. ده إجابة سؤال 10 في ص 76.
      - kind: match
        page: 56
        quote: "a) Myotonia Dystrophica Small testes with impairment of both spermatogenses & leydig cell function.\nb) Spinobulbar muscular atrophy: Infertility & androgen resistance.\nc) Spinal cord lesions\n  Paraplegia.\n  Temporary decrease in testosterone.\n  Persistent defect in spermatogenesis.\n  Some paients retain the capacity for penile erection & ejaculation.\nd) Adrenoleukodystrophy\n  It is a X-linked disorder.\n  Progressive spastic paraparesis (early adulthood).\n  PN (mild).\n  Adrenal insufficiency (childhood)."
        prompt: "وصّل المرض العصبي بالتغير الهرموني:"
        pairs:
          - ["Myotonic dystrophy", "Small testes, ↓ spermatogenesis and Leydig function"]
          - ["Spinobulbar muscular atrophy", "Infertility, androgen resistance"]
          - ["Spinal cord lesion", "Temporary ↓ testosterone, persistent ↓ sperm"]
          - ["Adrenoleukodystrophy", "X-linked; childhood adrenal insufficiency"]
        why: "الـ adrenoleukodystrophy كمان فيها spastic paraparesis في أول الشباب و PN خفيف."
      - kind: explain
        page: 56
        quote: "c) Spinal cord lesions\n  Paraplegia.\n  Temporary decrease in testosterone.\n  Persistent defect in spermatogenesis.\n  Some paients retain the capacity for penile erection & ejaculation."
        title: "الحبل الشوكي والـ adrenoleukodystrophy"
        text: |
          - ==Spinal cord lesions== (paraplegia): الـ testosterone بيقل **مؤقتًا**، بس الـ spermatogenesis بيفضل بايظ **على طول**. يعني الهرمون بيرجع والخصوبة لأ. وبعض المرضى بيفضل عندهم القدرة على الـ erection والـ ejaculation، لأن دول reflexes ممكن تفضل شغالة تحت مستوى الإصابة (التفسير المقبول، مش في الكتاب).
          - ==Adrenoleukodystrophy==: **X-linked**، فبتيجي في الولاد. الـ adrenal insufficiency بتبدأ في **الطفولة**، والـ spastic paraparesis بتيجي بعدها في **أول الشباب**، مع peripheral neuropathy (PN) خفيف. فلو ولد عنده Addison's وبعدين رجليه اتشنجت، فكّر فيها.
      - kind: explain
        page: 56
        quote: "Endocrine abnormalities is important to look for in evaluation of patients presenting with musculoskeletal symptoms. Endocrine disorders such as diabetes, hyperthyroidism, hypothyroidism, hyperparathyroidism, hypoparathyroidism, hyperadrenocorticism, and acromegaly cause a unique array of rheumatic manifestations."
        title: "الطريق في الاتجاهين"
        text: |
          الكتاب بيقول: أي مريض جاي بأعراض في العضلات والمفاصل، **دوّر على غدة**. ليه؟ لأن 7 أمراض هرمونية بتعمل «unique array of rheumatic manifestations»: diabetes، hyperthyroidism، hypothyroidism، hyperparathyroidism، hypoparathyroidism، hyperadrenocorticism، و acromegaly.

          والعكس كمان صحيح: أمراض الروماتيزم نفسها ليها endocrine effects (ص 57). فالعلاقة رايحة جاية، وده إجابة سؤال 12 في ص 76.
      - kind: explain
