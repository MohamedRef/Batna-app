        quote: "AFP < 400 ng/ml Locoregional Bridging therapy, if possible, is one of options used to manage patients on waiting list"
        title: "أربع بوابات"
        alt: "A vertical flow of four gates for an HCC patient: within Milan or San Francisco criteria, no extrahepatic spread on CT chest and bone scan, no macrovascular invasion, AFP below 400 ng/ml. Passing all four leads to listing with locoregional bridging therapy while waiting. Failing any gate leads to not eligible."
        caption: "يعدّي الأربعة كلهم → يتعمله listing و **bridging** لحد ما الـ donor يتوفر. يقع في واحدة → مش هيتزرع."
