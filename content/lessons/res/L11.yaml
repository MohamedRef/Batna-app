  - id: res.L11.lesson7
    title: "Cluster و multistage: تختار قرية مش فرد"
    hook: "مفيش list بكل الناس؟ هات list بالقرى، اختار منها random، وقابل كل اللي فيها."
    minutes: 8
    pages: [39, 92]
    topics: [probability]
    goals:
      - "تعرف إمتى تستخدم cluster sampling ووحداته"
      - "تفرّق بين one-stage و two-stage و multistage"
      - "ترتّب شجرة الـ probability sampling"
    status: unverified
    steps:
      - kind: explain
        page: 39
        quote: "However, when a list of groupings of study units is available (e.g., villages or schools) or can be easily compiled, a number of these groupings can be randomly selected.\nThe selection of groups of study units (clusters) instead of the selection of study units individually is called CLUSTER SAMPLING."
        title: "إمتى cluster؟"
        text: |
          لو فيه ==list بمجموعات== الـ units (قرى أو مدارس) أو سهل تعملها، تقدر تختار ==عدد من المجموعات دي random==.

          اختيار ==مجموعات (clusters)== بدل الأفراد واحد واحد اسمه cluster sampling.

          ليه؟ لما مفيش list بكل الأفراد، أو الناس متفرّقين على مساحة كبيرة، أسهل تروح لقرى معينة وتقابل كل اللي فيها. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 40
        quote: "Cluster sampling is a sampling method in which the entire population of the study is divided into externally homogeneous but internally heterogeneous groups called clusters. Essentially, each cluster is a mini-representation of the entire population."
        title: "4. Cluster sampling"
        text: |
          لما **مفيش list كاملة** بالأفراد، أو الناس **متفرقين** في مساحة كبيرة، بس عندك list بالمجموعات (قرى، مدارس):

          اختار **مجموعات كاملة عشوائي** بدل الأفراد؛ ده ==cluster sampling==.

          الـ clusters غالبًا **geographic** (districts، شياخات، قرى) أو **organizational** (عيادات، مدارس). وكل cluster ==mini-representation== للـ population: **heterogeneous من جوه، وشبه بعض من بره**.
      - kind: figure
        page: 40
        quote: "Cluster sampling is a sampling method in which the entire population of the study is divided into externally homogeneous but internally heterogeneous groups called clusters. Essentially, each cluster is a mini-representation of the entire population."
        title: "Strata ضد clusters"
        alt: "Left panel, stratified: three horizontal bands, each a single colour, with a few dots taken from every band. Right panel, cluster: four circles each holding mixed colours; two whole circles are highlighted as sampled."
        caption: "**Strata**: كل طبقة لون واحد (homogeneous)، وبناخد شوية من **كل** طبقة. **Clusters**: كل دايرة فيها كل الألوان (mini-population)، وبناخد **دواير كاملة** بس."
        svg: |
          <svg viewBox="0 0 330 190" xmlns="http://www.w3.org/2000/svg">
            <text x="80" y="18" text-anchor="middle" class="t-sm t-b">Stratified</text>
