      - kind: aside
        tone: trap
        page: 224
        quote: "Mild pain (1-4/10): Begin acetaminophen or a nonsteroidal anti-inflammatory agent in select patients (those with normal renal function and minimal risk of gastrointestinal toxicity). Do not exceed 3 or 2 g/d for those with hepatic dysfunction. If pain is not controlled by acetaminophen, initiate opioid therapy."
        text: |
          الـ non-steroidal anti-inflammatory drugs (NSAID) في الكبير مش دواء أول خط لأي حد. ==select patients== بس: **كلى سليمة** و **gastrointestinal (GI) risk قليل**. واحد estimated glomerular filtration rate (eGFR) بتاعه 28 وعنده GI bleed قديم؟ acetaminophen.

          ليه؟ التفسير المقبول (مش في الكتاب): الـ NSAIDs بتقلل الـ prostaglandins اللي بتحافظ على دم الكلى وبتحمي بطانة المعدة. الكبير كليته أضعف أصلًا، فالـ NSAID ممكن يوقّعها أو يعمل نزيف.
      - kind: explain
        page: 224
        quote: "Mild pain (1-4/10): Begin acetaminophen or a nonsteroidal anti-inflammatory agent in select patients (those with normal renal function and minimal risk of gastrointestinal toxicity). Do not exceed 3 or 2 g/d for those with hepatic dysfunction. If pain is not controlled by acetaminophen, initiate opioid therapy."
        title: "سقف الـ acetaminophen"
        text: |
          - ماتعديش ==3 g/day==.
          - ولو فيه **hepatic dysfunction**: ==2 g/day==.
          - لو مانفعش: ابدأ **opioid**.

          ليه سقف أقل مع الكبد؟ التفسير المقبول (مش في الكتاب): الـ acetaminophen بيتكسر في الكبد، والجرعات العالية بتعمل hepatotoxicity، والكبد التعبان بيوصل للحد ده أسرع. عشان كده السقف بينزل من 3 لـ 2.
      - kind: check
        page: 225
        quote: "Moderate pain (-5-6/10): Begin a short-acting standing opioid (morphine or oxycodone) and titrate every several days by 25%-50% of the current dose until pain relief is achieved. Once pain is well controlled, consider switching to a sustained release oral opioid or transdermal fentanyl."
        question: "Pain 6/10 despite regular acetaminophen. Next step?"
        options: ["Short-acting standing morphine or oxycodone", "Transdermal fentanyl", "IV morphine every 30 min", "Double the acetaminophen to 6 g/day"]
        answer: 0
        why:
