  - id: endo.L05.lesson6
    title: "الماركرز والتصوير: نلاقي الورم إزاي"
    hook: "الورم صغير، والهرمون عالي، والـ CT ساكت. هنا الـ somatostatin receptor بيبقى الكشاف."
    minutes: 9
    pages: [80, 82]
    topics: [markers, localization]
    goals:
      - "تعرف الـ CgA وأرقامه وإمتى بيفيد في المتابعة"
      - "تعدّ وسائل الـ localization وتعرف ليه الـ somatostatin scan هو الأحسن"
      - "تحفظ أرقام الـ Octreoscan والـ EUS للأورام الصغيرة"
    status: unverified
    steps:
      - kind: explain
        page: 80
        quote: "Presentation\n  Asymptomatic or present with obstructive symptoms.\n  Symptoms usually due to liver metastases.\n  Hormone release into circulation (e.g., serotonin, tachykinin)."
        title: "المريض بييجي إزاي؟"
        text: |
          الكتاب بيدّي تلات صور:
          - **Asymptomatic**، أو **obstructive symptoms** لأن الورم بيسد مكانه (الأمعاء أو الـ bile duct).
          - الأعراض غالبًا **بسبب الـ liver metastases**.
          - **Hormone release** في الدم، زي الـ serotonin والـ tachykinin.

          ليه الـ liver mets بالذات؟ التفسير المقبول (مش في الكتاب): الكبد بيكسّر الهرمونات اللي جاية من الأمعاء في الـ portal vein، فالورم الأولاني بيبقى ساكت. لما الورم يوصل الكبد نفسه، بيصب هرمونه في الـ hepatic veins على طول، فالأعراض تبدأ. (هتشوفها في رسمة الـ carcinoid في ص 95.)
      - kind: explain
        page: 80
        quote: "Chromogranin A\n  Represents a constitutive neuroendocrine secretory protein.\n  Most widely accepted biomarker.\n  Compared to a panel of biomarkers, CgA proved most accurate.\n    Specificity: 85.7%.\n    Sensitivity: 67.9%.\n  Elevated in 60–80% of patients with NETs.\n  Correlates with disease burden and poor outcomes.\n  Serial CgA testing is being investigated to determine treatment response.\n  In pancreatic NETs, early declines in CgA during treatment with chemotherapy and everolimus are associated with improved prognosis."
        title: "الـ CgA: الماركر العام"
        text: |
          الـ ==chromogranin A== بروتين بيتفرز طول الوقت (constitutive)، وهو **most widely accepted biomarker**.

          - Specificity **85.7%**، sensitivity **67.9%**.
          - عالي في **60-80%** من الـ NETs، والكتاب كاتب كمان 90-100% كـ general marker.
          - بيمشي مع الـ **disease burden**، وفي الـ pancreatic neuroendocrine tumor (pNET) لو نزل بدري مع chemo أو **everolimus** = prognosis أحسن.
          - الماركر التاني: **pancreatic polypeptide** 40-60%، وبيتعمله **meal stimulation test** كل 10 دقايق لمدة ساعة ونص.

          ليه الـ CgA بالذات؟ لأنه **constitutive**، يعني الخلية بتفرزه طول الوقت حتى لو الورم non-functioning ومش بيفرز هرمون معروف. فكل ما الخلايا تكتر، الـ CgA يعلى، وده اللي بيخلّيه يمشي مع حجم المرض وينفع للمتابعة.
      - kind: check
        page: 80
        quote: "Chromogranin A\n  Represents a constitutive neuroendocrine secretory protein.\n  Most widely accepted biomarker.\n  Compared to a panel of biomarkers, CgA proved most accurate.\n    Specificity: 85.7%.\n    Sensitivity: 67.9%.\n  Elevated in 60–80% of patients with NETs.\n  Correlates with disease burden and poor outcomes.\n  Serial CgA testing is being investigated to determine treatment response.\n  In pancreatic NETs, early declines in CgA during treatment with chemotherapy and everolimus are associated with improved prognosis."
        question: "A patient with a pancreatic neuroendocrine tumour (NET) on everolimus has a falling CgA after 2 months. What does it suggest?"
        options: ["Better prognosis", "Tumour dedifferentiation", "Lab error; CgA does not change", "Everolimus toxicity"]
        answer: 0
        why:
          - "صح: الـ early decline في الـ CgA مع chemo أو everolimus مرتبط بـ improved prognosis."
          - "الـ CgA بيمشي مع حجم المرض، النزول معناه حمل أقل مش dedifferentiation."
          - "الـ CgA بيتغير مع الـ disease burden، وبيتدرس كـ serial marker."
          - "مفيش علاقة بالـ toxicity في الكتاب."
      - kind: reveal
        page: 80
        quote: "General Stimulation Test for Neuroendocrine Pancreatic Tumors\nMeal stimulation test with measurement of PP every 10 minutes for 1.5 hours."
        prompt: "الـ CgA عالي في 60-80% بس. ليه الكتاب ضايف pancreatic polypeptide و meal test؟"
        answer: "لأن مفيش ماركر واحد بيمسك كل الأورام: الـ CgA sensitivity بتاعته **67.9%** بس، فتلت المرضى ممكن يفلتوا. الـ **pancreatic polypeptide (PP)** عالي في **40-60%**، والـ **meal stimulation test** (PP كل 10 دقايق لمدة ساعة ونص) بيكشف الورم اللي مستواه في الصيام طبيعي. التفسير المقبول (مش في الكتاب): الأكل بيحفّز الـ PP طبيعي، والورم بيطلّع رد أكبر من الطبيعي، فالاختبار بيفرّق اللي الرقم العادي ما فرّقهوش."
      - kind: explain
        page: 81
        quote: "Radiolabeled somatostatin scanning is the best noninvasive modality, identifying up to 70% of primary tumors. This modality can also distinguish GEP tumors from nonendocrine tumors."
        title: "الكشاف: somatostatin receptor"
        text: |
          الـ neuroendocrine tumours (NETs) مليانة **somatostatin receptors**. لو علّمنا octreotide بمادة مشعة، الورم هينوّر.

          - ==Radiolabeled somatostatin scanning== = **best noninvasive modality**.
          - بيلاقي لحد **70%** من الـ primaries، وبيفرّق الـ gastroenteropancreatic (GEP) tumour من الـ nonendocrine، لأن الأورام التانية ما عليهاش الـ receptors دي.
          - الـ **Octreoscan** (¹¹¹In-DTPA-octreotide): للـ total body screening والـ staging. الـ sensitivity **40%** تحت 10 mm، و **90%** عند 10 mm، و **90%** للـ liver mets. يعني الحجم بيفرق جدًا: الورم الصغير ما فيهوش receptors كفاية تنوّر.
      - kind: table
        page: 81
        quote: "Tumor Localization\n  Transabdominal ultrasound.\n  CT.\n  MRI.\n  Selective arterial angiography.\n  Selective venous sampling.\n  Hepatic venous sampling.\n  Radiolabeled somatostatin scanning.\n  Endoscopic and intraoperative ultrasound."
        title: "وسائل الـ localization: إجابة سؤال 4"
        columns: ["Group", "Modalities", "Why"]
        rows:
          - ["Cross-sectional", "Transabdominal US, CT, MRI", "Anatomy, liver mets"]
          - ["Vascular", "Selective arterial angiography", "NETs are vascular"]
          - ["Sampling", "Selective venous, hepatic venous sampling", "Hormone gradient"]
          - ["Functional", "Radiolabeled somatostatin scan", "Receptors light up"]
          - ["Endoscopic", "Endoscopic and intraoperative US", "Small tumours"]
        hide: [[0, 1], [3, 1], [4, 1]]
