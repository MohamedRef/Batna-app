  - id: hb.L18.lesson7
    title: "BCLC B و C و D: من TACE للـ immunotherapy"
    hook: "ورم كتير، أو ماسك الأوعية، أو الكبد تعب... كل واحد ليه سلاحه. وفي الآخر أرقام الـ survival اللي لازم تحفظها."
    minutes: 10
    pages: [369, 374]
    topics: [locoregional, systemic, prognosis]
    goals:
      - "تعرف الـ TACE لمين وممنوع على مين"
      - "ترتّب الـ systemic therapy: first line و second line وشروط NICE"
      - "تعرف BCLC D وأرقام الـ prognosis"
    status: unverified
    steps:
      - kind: explain
        page: 369
        title: "BCLC B: الـ intermediate"
        text: |
          - **1st line: TACE أو TARE.** و **consider percutaneous ablation**.
          - **TACE** هو العلاج المعتاد لـ **multinodular HCC** من غير vascular invasion ولا extrahepatic spread، و liver function **محفوظة نسبيًا**. وبيحسّن **2-year survival** في الـ unresectable بحالة كويسة و cirrhosis compensated.
          - **Contraindications للـ TACE:** **portal vein thrombosis**، **decompensated liver disease**، و **end-stage liver cancer**.
          - **TARE:** اختيار تاني للـ multifocal، **survival ومضاعفات زي الـ TACE**، وممكن **ألم و toxicity أقل**.
          - **TACE + percutaneous ablation** (PEI أو RFA): meta-analysis لقت **overall survival أحسن في سنة و 2 و 3** مقارنة بالـ monotherapy.
      - kind: reveal
        page: 370
        prompt: "ليه الـ **portal vein thrombosis** contraindication للـ TACE؟ (افتكر الكبد بياخد دمه منين)"
        answer: |
          الـ TACE بيسد **الشريان**. الكبد العادي عايش أساسًا على الـ **portal vein**، فبيستحمل إنك تقفل شوية شريان.

          بس لو الـ **portal vein نفسه مقفول** بـ thrombus، يبقى الشريان هو مصدر الدم الوحيد للكبد كله. تقفله؟ الكبد السليم حوالين الورم كمان هيموت (**ischemic necrosis**) ويحصل liver failure. ونفس المنطق ليه الـ **decompensated** liver ممنوع: مفيش احتياطي.
      - kind: check
        page: 370
        question: "Which patient is NOT a TACE candidate per the book?"
        options:
          - "Multifocal HCC with main portal vein thrombosis"
          - "Four nodules, Child-Pugh A6, ECOG 0, no vascular invasion"
          - "BCLC B with compensated cirrhosis"
          - "Small-burden BCLC A unfit for surgery or ablation"
        answer: 0
        why:
          - "صح: **portal vein thrombosis** contraindication صريح."
          - "ده الـ **BCLC B** النموذجي للـ TACE."
          - "TACE بيحسّن الـ 2-year survival في الـ compensated cirrhosis."
          - "الكتاب: TACE ممكن يفيد مختارين **BCLC A لحد early B** مش مناسبين للجراحة أو الـ ablation."
      - kind: explain
        page: 370
        title: "BCLC C: الـ systemic therapy"
        text: |
          **1st line: systemic therapy.** **2nd line: TARE.**

          **First line المفضّل:**
          - **Atezolizumab + bevacizumab**: لـ BCLC C مع **Child-Pugh A** و **ECOG 0–1**، **بعد علاج الـ oesophageal varices لو موجودة**. **IMbrave150**: median OS **19.2 مقابل 13.4 شهر** مع sorafenib (HR **0.66**). والـ **subcutaneous atezolizumab/hyaluronidase** ينفع بدل الـ IV.
          - **Durvalumab + tremelimumab**: كمان preferred، وحسّن الـ OS مقارنة بالـ sorafenib.

          **First line تانية:** durvalumab لوحده، **lenvatinib**، **sorafenib**، tislelizumab، أو pembrolizumab.
          - **Sorafenib** ممكن في مختارين **Child-Pugh B**.
          - **Lenvatinib** **non-inferior** للـ sorafenib، بس **hypertension** أكتر. والـ UK: بس لو **Child A و ECOG 0–1**.
      - kind: reveal
        page: 371
        prompt: "ليه لازم نعالج الـ **varices** الأول قبل atezolizumab + bevacizumab؟"
        answer: |
          الـ **bevacizumab** مضاد للـ **VEGF**، والمعروف عنه إنه بيزوّد خطر **النزيف** (وبيأثر على التئام الأوعية). ومريض الـ cirrhosis عنده varices جاهزة تنزف أصلًا. فلازم نأمّنها الأول (banding أو beta-blocker حسب الحالة) قبل ما نبدأ.

          الكتاب بيقول الشرط ده صريح: **following management of esophageal varices if present**.
      - kind: mnemonic
        page: 371
        word: "C = AB"
        parts:
          - { key: "C", text: "BCLC C (advanced), Child-Pugh A, ECOG 0-1" }
          - { key: "A", text: "Atezolizumab" }
          - { key: "B", text: "Bevacizumab (treat varices first)" }
        hook: |
          **Stage C؟ ابدأ بالـ A و B.** 🔤

          والبديل المفضّل التاني بحرفين برضه: **D + T** = **D**urvalumab + **T**remelimumab.
      - kind: explain
        page: 372
        title: "Second line وبعده"
        text: |
          الاختيار بيعتمد على اللي اتاخد first line.

          - **TKI:** **sorafenib، lenvatinib، cabozantinib، regorafenib**.
          - **Immunotherapy:** **pembrolizumab** أو **nivolumab + ipilimumab**.
          - بعد progression على **sorafenib**: **regorafenib، nivolumab، pembrolizumab، cabozantinib** بيدّوا survival benefit.
          - **UK (NICE):** **regorafenib** أو **cabozantinib** (بديل) بعد sorafenib، بس لو **Child-Pugh A و ECOG 0–1**.
          - **مفيش systemic therapy** ثبتت فايدتها كـ **adjuvant** بعد resection أو ablation.

          **TARE في الـ advanced:** بيطوّل الـ survival، و **safe مع limited portal vein invasion**. بيحدّه: liver function، PS، و **hepatopulmonary shunting**. والـ multifocal محتاج **staged lobar treatment** وده بيزوّد خطر **radiation-induced liver disease**.
      - kind: aside
        tone: trap
        page: 373
        text: |
          فخّين في جملة واحدة:

          - الـ **TARE** **مسموح** مع **limited** portal vein invasion، بس الـ **TACE** **ممنوع** مع **portal vein thrombosis**. (الـ microspheres بتشعّ مش بتسد الشريان زي الـ TACE.)
          - **مفيش adjuvant systemic therapy** في الـ HCC (عكس الـ cholangiocarcinoma اللي فيها capecitabine 6 شهور!).
      - kind: explain
        page: 373
        title: "BCLC D والـ prognosis"
        text: |
          **BCLC D:** **hospice care**، ± **transplant** لمختارين: **Child-Pugh C** بس **PS ≤1** و **within Milan**. غير كده مفيش علاج specific، و **palliative care**.

          **Prognosis:** الـ HCC ورم **very aggressive**، والمصير بيعتمد على الـ stage وحالة الكبد.
          - **Symptomatic HCC:** 5-year survival **0–10%**.
          - **Transplant:** **4-year survival 75%**، و **recurrence 8–20%**.
          - **Resection في non-cirrhotic:** **58% في 3 سنين**، **42% في 5 سنين**.
          - **Intermediate على TACE:** median **19–20 شهر** (لحد **40** في الـ good responders).
          - **Advanced:** median **10.7 شهر**.
      - kind: reveal
        page: 373
        prompt: "مريض **Child-Pugh C** و PS 0 و HCC جوه Milan: ليه ممكن ياخد transplant رغم إنه BCLC D؟"
        answer: |
          لأن المشكلة الأساسية هنا **الكبد** مش الورم: الورم صغير وجوه Milan، والمريض نفسه كويس (PS ≤1).

          والـ transplant **بيعالج الاتنين**: بيشيل الورم و بيشيل الكبد البايظ. علشان كده الكتاب بيقول إن الـ LT هو **main course of therapy** في الـ cirrhosis حتى مع **poor liver function**. بس لو الـ PS وحش أو بره Milan، يبقى hospice.
