  - id: rheum.L06.lesson2
    title: "الـ HLA: بطاقة الرقم القومي للخلية"
    hook: "ليه زرع الكلية صعب؟ لأن كل واحد فينا شايل HLA مختلف، و DRB1 لوحده فيه 60 شكل."
    minutes: 10
    pages: [87, 91]
    topics: [hla]
    goals:
      - "تفرّق بين class I و class II في المكان والتركيب والوظيفة"
      - "تفهم ليه الـ HLA مختلف من واحد للتاني، وده بيعمل إيه في الزرع"
      - "تقرا اسم allele زي DRB1*0101"
      - "تعرّف الـ codominance والـ linkage disequilibrium"
    status: unverified
    steps:
      - kind: explain
        page: 87
        title: "يعني إيه HLA؟"
        quote: "The MHC is a collection of genes many of which are involved in immune functions. The human MHC is known as HLA and the genes are found on chromosome 6."
        text: |
          الـ **major histocompatibility complex (MHC)** مجموعة جينات أغلبها ليه وظيفة مناعية، وفي الإنسان اسمها ==human leukocyte antigen (HLA)==، وجيناتها على **chromosome 6**.

          جزيئات **class I و II** دي **glycoproteins** على سطح الخلية، بتمسك **short processed peptides** وتعرضها على الـ **T cell receptor**. وفي ناس الـ HLA بتاعها بيخليها أكثر عرضة لأمراض معيّنة.
      - kind: explain
        page: 87
        title: "خريطة chromosome 6"
        quote: "Class Ill\nChromosome 6 Class || Class |"
        text: |
          شكل الكتاب في ص 87 بيرسم الـ **short arm** بتاع chromosome 6 تلات مناطق، من ناحية الـ centromere:
          - **Class II**: الـ **DP** و **DQ** و **DR**، وجنبهم جينات بتجهّز الـ peptides زي **TAP1/TAP2** و **LMP2/LMP7**.
          - **Class III**: مش بتعرض peptides خالص، فيها **C4B و C4A** و **factor B** و **C2** (complement)، و **HSP**، و **TNF**.
          - **Class I**: الـ **B** و **C** و **A**.

          يعني الـ MHC اسمه "complex" عشان هو **حتة من الكروموسوم** مليانة جينات مناعة، مش جين واحد. وده هيفرق معاك في الـ **linkage disequilibrium**: لما الحتة دي كلها تتورث مع بعض، الـ complement والـ TNF بيمشوا مع الـ HLA.
      - kind: figure
