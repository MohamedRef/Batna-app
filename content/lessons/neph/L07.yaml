        answer: "جلد الإنسان فيه **α5(IV)** بس، مفيهوش α3 ولا α4. الـ X-linked بيبوّظ الـ **α5**، فيختفي من الجلد عند الرجالة ويبقى **mosaic** عند الستات. الـ autosomal recessive (AR) بيبوّظ **α3/α4**، والـ α5 في الجلد بيفضل **موجود**، فالـ skin biopsy يطلع طبيعي. ساعتها محتاج ==kidney biopsy== بالـ electron microscopy (EM) وصبغة α3 و α4 و α5."
      - kind: explain
        page: 183
        title: "تحت الميكروسكوب"
        quote: "Alport syndrome (EM) EM frequently reveals diagnostic abnormalities. In most patients with AS there is variable thickening, thinning, basket weaving, and lamellation of the GBM (Fig. 46.7). The thick segments measure up to 1200 nm in depth, usually have irregular outer and inner contours, and are found more frequently in males than in females. The lamina densa is transformed into a heterogeneous network of membranous strands, which enclose clear electron-lucent areas that may contain round granules of variable density measuring 20 to 90 nm in diameter. There are variable degrees of epithelial foot process fusion."
        text: |
          **Alport**:
          - light microscopy (LM) و immunofluorescence (IF) **مفيهمش حاجة pathognomonic**. قبل 5 سنين طبيعي، بعدين mesangial expansion، وبعدين **focal segmental glomerulosclerosis (FSGS)** و interstitial fibrosis بعد 10 سنين.
          - الـ ==EM هو المفتاح==: GBM **سميك (لحد 1200 nm) ورفيع**، ==basket weaving==، و lamellation.

          **TBMN**: LM و IF طبيعيين، والـ EM يوري **GBM رفيع كله** (diffuse thinning).
