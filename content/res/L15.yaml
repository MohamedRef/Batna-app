- id: res.L15.003
  kind: card
  topic: intro
  front: Define a sample, and what must it reflect?
  back: A subset of the population selected in a way that is representative of the target population. It should reflect the
    similarities and differences found in the population, so its results can be generalized to the population.
  src:
    page: 5
    quote: |-
      Sample:
      Is a subset of the population selected in a way that is representative of the target population.
      It should reflect the similarities and differences found in the population .Result from it can be generalized to the population
  status: unverified
  tags: [high-yield]
