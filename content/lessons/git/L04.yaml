  - id: git.L04.lesson11
    title: "أنواع سرطان المعدة تحت الميكروسكوب وفي المنظار"
    hook: "خلية شكلها خاتم، ومعدة ناشفة زي الجلد، وbiopsy سليمة والورم موجود. إزاي؟"
    minutes: 8
    pages: [156, 157]
    topics: [gastric-path]
    goals:
      - "تعرف الـ histological types ونسبهم"
      - "تفهم الـ signet ring cell وليه الـ imaging بيفوّته"
      - "تفرّق بين Borrmann و WHO وتعرف ليه الـ linitis محتاج biopsy خاصة"
    status: unverified
    steps:
      - kind: explain
        page: 156
        quote: "Previous gastric surgery for non- cancerous conditions"
        title: "آخر الـ precursors: Menetrier والجراحة القديمة"
        text: |
          الكتاب بيكمّل الـ **precursors of gastric cancer**: ==Menetrier's disease== و **previous gastric surgery for non-cancerous conditions**.

          التفسير المقبول (مش في الكتاب): بعد جراحة زمان لقرحة (partial gastrectomy)، الـ **bile** بيرجع للمعدة على طول، فيعمل **bile gastritis** (اللي الكتاب ذكرها في الـ medical risk factors). التهاب مزمن سنين طويلة = خلايا بتتأذي وتتصلح كتير = فرصة mutation. وعلشان كده الخطر بيبان بعد سنين من العملية مش على طول. والـ Menetrier فيه **folds** متضخمة بخلايا بتنقسم زيادة، وده نفس المنطق.
      - kind: figure
        page: 156
        quote: "Adenocarcinoma – 90% Lymphoma – 5% GIST – Gastrointestinal stromal tumors – 2%"
        title: "مين بيعمل سرطان المعدة؟"
        alt: "Horizontal bars of gastric cancer histological types: adenocarcinoma 90 percent, lymphoma 5 percent, GIST 2 percent, squamous cell carcinoma, carcinoid and adenoacanthoma each under 1 percent. A note says the stomach is the commonest GI site of lymphoma."
        caption: "الـ adenocarcinoma هو كل الحكاية تقريبًا (90%)، وبعده lymphoma 5% و GIST 2%."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="20" class="t-b">Histological types</text>
            <text x="10" y="48" class="t-sm">Adenocarcinoma</text>
            <rect x="120" y="36" width="180" height="16" rx="3" class="fg-dot-acc"/>
            <text x="304" y="49" class="t-sm t-b">90%</text>
            <text x="10" y="78" class="t-sm">Lymphoma</text>
            <rect x="120" y="66" width="10" height="16" rx="3" class="fg-dot-good"/>
            <text x="136" y="79" class="t-sm t-b">5%</text>
            <text x="10" y="108" class="t-sm">GIST</text>
            <rect x="120" y="96" width="4" height="16" rx="2" class="fg-dot-bad"/>
            <text x="130" y="109" class="t-sm t-b">2%</text>
            <text x="10" y="138" class="t-sm">SCC, carcinoid,</text>
            <text x="10" y="153" class="t-sm">adenoacanthoma</text>
            <rect x="120" y="134" width="2" height="16" class="fg-ink"/>
            <text x="128" y="147" class="t-sm t-b">under 1% each</text>
            <rect x="10" y="180" width="310" height="56" rx="8" class="fg-thin"/>
            <text x="20" y="202" class="t-sm">No normal lymphoid tissue in gastric mucosa,</text>
            <text x="20" y="222" class="t-sm t-b">yet stomach = commonest GI site of lymphoma</text>
          </svg>
      - kind: reveal
        page: 156
        quote: "Although no normal lymphoid tissue is found in the gastric mucosa, the"
        prompt: "المعدة مفيهاش lymphoid tissue طبيعي. إزاي تبقى أشهر مكان للـ lymphoma في الـ GI tract؟"
        answer: |
          الكتاب: رغم إن **no normal lymphoid tissue** في الـ gastric mucosa، المعدة هي ==the most common site for lymphomas of the GI tract==.

          التفسير المقبول (مش في الكتاب): الـ lymphoid tissue بييجي **مكتسب**: الـ H. pylori بيعمل التهاب مزمن، والجسم بيجيب lymphocytes تعمل follicles في الـ mucosa (acquired MALT). ومع الوقت واحدة من الخلايا دي بتهرب من التحكم. وعلشان كده هتشوف بعد كام صفحة إن الـ MALT lymphoma «most commonly preceded by H. pylori gastritis»، وإن الـ eradication لوحده ممكن يشفيه.
      - kind: explain
        page: 156
        quote: "Cells contain abundant mucin in the cytoplasm. So nucleus is shifted to periphery to produce ―signet ring‖ shape."
        title: "الـ signet ring cell"
        text: |
          نوع **highly malignant** من الـ adenocarcinoma. الخلية مليانة **mucin**، فالـ nucleus بيتزق على الجنب، فتبان زي ==signet ring== (خاتم الختم).

          - أشهر مكان: المعدة (وأقل: breast، gallbladder، bladder، pancreas).
          - عكس باقي سرطانات المعدة: الـ incidence بتاعه **بيزيد**.
          - بيكبر في **sheets**، فالـ computed tomography (CT) والـ positron emission tomography (PET) أضعف في تشخيصه.
          - السبب: **CDH1** (E-cadherin) أو **APC**. لما الخلية تفقد الـ E-cadherin بتبقى أسهل في الحركة.

          التفسير المقبول (مش في الكتاب): الـ E-cadherin هو «الصمغ» اللي بيلزق الخلايا في بعض. من غيره الخلية بتفك وتمشي لوحدها، فبتتسرب في الحيطة بدل ما تعمل كتلة، وده اللي هتفهم بيه الخطوات الجاية.
      - kind: explain
        page: 156
        quote: "SRCC tumors grow in characteristic sheets, which makes diagnosis using"
        title: "ليه الـ CT والـ PET بيفوّتوا الـ SRCC؟"
        text: |
          الكتاب: الـ SRCC بيكبر في **characteristic sheets**، فالتشخيص بالـ **CT** والـ **PET** ==less effective==. والخلايا لما تفقد الـ **E-cadherin** حركتها بتزيد.

          التفسير المقبول (مش في الكتاب): الـ CT بيدوّر على **كتلة**، والورم ده مش بيعمل كتلة: خلاياه منفصلة عن بعض (مفيش E-cadherin يلزقها) فبتتسرّب في الحيطة زي الحبر في القماش. والـ PET بيدوّر على خلايا بتاكل glucose كتير ومتجمعة، وخلايا الـ SRCC معظمها **mucin** ومتفرقة، فالإشارة ضعيفة. وده نفس السبب اللي بيخليه ينتشر في الـ **peritoneum**: خلايا مش لازقة في بعض بتقع وتزرع نفسها.
      - kind: reveal
        page: 157
        quote: "Prognosis Early SRCC – better or at least similar to than of non-SRCC Advanced SRCC – poor than non-SRCC and lower chemosensitivity and peritoneal carcinomatosis is the most frequent metastatic site"
        prompt: "الـ SRCC الـ prognosis بتاعه أحسن ولا أوحش؟"
        answer: "حسب المرحلة: الـ early SRCC أحسن أو زي الـ non-SRCC. الـ advanced SRCC أوحش، والـ chemosensitivity أقل، وأشهر مكان metastasis هو peritoneal carcinomatosis."
      - kind: order
        page: 157
        quote: "BORRMANN CLASSIFICATION\n  Based on macroscopic apperance\n  Useful as endoscopic finding\n    Phymatoid/polypoid (protruded type)\n    Ulcerative\n    Infiltrative ulcerative\n    Diffuse infiltrative\n    Can't be classified"
        prompt: "رتّب الـ Borrmann types (I → V):"
        steps:
          - "Polypoid (protruded)"
          - "Ulcerative"
          - "Infiltrative ulcerative"
          - "Diffuse infiltrative"
          - "Cannot be classified"
        why: "الترتيب ماشي من الورم اللي طالع لبرّه (polypoid) لحد اللي غاطس في الحيطة كلها (diffuse infiltrative). الـ Borrmann macroscopic ومفيد كـ endoscopic finding."
      - kind: figure
        page: 157
        quote: "BORRMANN CLASSIFICATION\n  Based on macroscopic apperance\n  Useful as endoscopic finding\n    Phymatoid/polypoid (protruded type)\n    Ulcerative\n    Infiltrative ulcerative\n    Diffuse infiltrative\n    Can't be classified"
        title: "Borrmann كسلّم"
        alt: "Four cross-sections of the gastric wall. Type I polypoid: a mass bulging into the lumen. Type II ulcerative: an ulcer with raised sharp edges. Type III infiltrative ulcerative: an ulcer whose base spreads into the wall. Type IV diffuse infiltrative: the whole wall thickened, linitis plastica. Type V cannot be classified."
        caption: "من I لـ IV الورم بيدخل في الحيطة أكتر. Type IV هو الـ linitis plastica."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="18" class="t-sm t-mut">lumen above, wall below</text>
            <rect x="10" y="50" width="310" height="22" class="fg-box"/>
            <path d="M60 50c0-30 50-30 50 0z" class="fg-acc"/>
            <text x="130" y="44" class="t-b">I Polypoid (protruded)</text>
            <rect x="10" y="120" width="310" height="22" class="fg-box"/>
            <path d="M50 120l15-12l10 12h30l10-12l15 12" class="fg-ink"/>
            <text x="150" y="112" class="t-b">II Ulcerative</text>
            <rect x="10" y="190" width="310" height="22" class="fg-box"/>
            <path d="M50 190l15-10l10 10h30l10-10l15 10" class="fg-ink"/>
            <rect x="60" y="190" width="80" height="22" class="fg-bad"/>
            <text x="150" y="182" class="t-b">III Infiltrative ulcerative</text>
            <rect x="10" y="260" width="310" height="40" class="fg-bad"/>
            <text x="20" y="252" class="t-b">IV Diffuse infiltrative</text>
            <text x="20" y="285" class="t-sm">whole wall thick: linitis plastica</text>
            <text x="10" y="322" class="t-sm t-mut">V Cannot be classified</text>
          </svg>
      - kind: explain
        page: 157
        quote: "Linitis Plastica\n  Diffuse-type gastric cancer\n  Tumor often infiltrates the submucosa and muscularis propria\n  Superficial biopsies may be falsely negative\n  Combination of strip and bite biopsy needed if suspicious for linitis plastic"
        title: "Linitis plastica: المعدة الجلد"
        text: |
          ده **diffuse-type gastric cancer**: الورم بيمشي في الـ ==submucosa== والـ muscularis propria، والـ mucosa فوقه ممكن تبان سليمة.

          عشان كده **superficial biopsies may be falsely negative**. لو شاكك: **strip and bite biopsy** مع بعض.

          التفسير المقبول (مش في الكتاب): الـ biopsy العادية بتاخد من الـ mucosa بس، والورم هنا تحتها، فالنتيجة ممكن تطلع سليمة والمعدة كلها ورم. الـ strip and bite معناها إنك تاخد عينة فوق عينة في نفس المكان علشان توصل للطبقة اللي تحت.
      - kind: explain
        page: 157
        quote: "Classification based on morphologic features"
        title: "Borrmann ولا WHO؟"
        text: |
          الكتاب:
          - **Borrmann**: based on **macroscopic appearance**، ومفيد كـ **endoscopic finding**.
          - **WHO**: based on **morphologic features** تحت الميكروسكوب. الـ adenocarcinoma بيتقسم حسب الـ growth pattern: ==papillary، tubular، mucinous، signet ring==. وبعده adenosquamous، squamous cell، undifferentiated، unclassified.

          التفسير المقبول (مش في الكتاب): التقسيمين مش بيتنافسوا، كل واحد بيجاوب على سؤال. Borrmann هو اللي **بتشوفه بعينك في المنظار** وبتكتبه في التقرير قبل ما النتيجة تطلع. والـ WHO هو اللي **الـ pathologist** بيكتبه بعد الـ biopsy. وفيه نقطة لقاء: الـ signet ring (WHO) غالبًا بيبان في المنظار Borrmann IV (diffuse infiltrative)، لأن الخلايا المتفرقة بتتسرب بدل ما تطلع لبرّه.
      - kind: check
        page: 157
        quote: "Superficial biopsies may be falsely negative"
        question: "A stiff, non-distensible stomach on endoscopy, normal-looking mucosa, and two superficial biopsies are negative. Best next step?"
        options: ["Combined strip and bite biopsies", "Reassure; biopsies are negative", "Repeat the same superficial biopsies in a year", "Barium meal alone"]
        answer: 0
        why:
          - "صح: الكتاب: superficial biopsies may be falsely negative، فلو شاكك في linitis plastica: combination of strip and bite biopsy. الورم في الـ submucosa والـ muscularis propria، تحت المكان اللي الـ biopsy العادية بتوصله."
          - "دي بالظبط الغلطة اللي الكتاب بيحذّر منها: الـ negative هنا ممكن تكون false."
          - "التأجيل بنفس الطريقة هيدّي نفس النتيجة الغلط، والورم بيكبر."
          - "الـ barium ممكن يورّي معدة ناشفة، بس مش هيدّيك تشخيص نسيجي."
      - kind: try
        items: [git.L04.080, git.L04.083, git.L04.086, git.L04.089, git.L04.238]
    recap:
      - "Adenocarcinoma 90%، lymphoma 5%، GIST 2%، SCC و carcinoid و adenoacanthoma أقل من 1%؛ المعدة أشهر مكان للـ GI lymphoma."
      - "SRCC: mucin بيزق الـ nucleus؛ incidence بيزيد؛ sheets فالـ CT والـ PET أضعف؛ CDH1 أو APC؛ early زي غيره، advanced أوحش و peritoneal."
      - "Borrmann (منظار): polypoid، ulcerative، infiltrative ulcerative، diffuse infiltrative، unclassified؛ WHO (ميكروسكوب)؛ linitis: strip and bite biopsy."
