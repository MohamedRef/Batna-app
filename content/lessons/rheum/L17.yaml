          - **Large proximal**: ==hips==، knees، shoulders
          - الـ small peripheral joints ==نادرًا==.

          ليه الـ hips والكتف (large proximal) مش صوابع الإيد؟ التفسير المقبول (مش في الكتاب): لأنهم قريبين من العمود وفيهم entheses كبيرة، والمرض بيبدأ من المحور ويمتد للمفاصل اللي جنبه.
