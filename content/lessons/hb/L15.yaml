  # ------------------------------------------------------------------
  - id: hb.L15.lesson2
    title: "Acute pancreatitis: مين ولّع الحريقة؟"
    hook: "سبع عائلات أسباب في جملة واحدة عن طيارة MiG، وليه الـ amylase ممكن تبقى normal والمريض بيموت من الوجع."
    minutes: 9
    pages: [277, 280]
    topics: [ap-cause, ap-labs]
    goals:
      - "تعدّ أسباب الـ AP بمجموعات الكتاب السبعة"
      - "تشخّص الـ AP بقاعدة 2 من 3"
      - "تعرف امتى الـ amylase تضحك عليك، وإيه التحاليل اللي بتتنبأ بالخطورة"
    status: unverified
    steps:
      - kind: explain
        page: 277
        title: "التعريف، والسبب الأشهر"
        quote: "Acute inflammation of pancreatic parenchyma."
        text: |
          الـ **acute pancreatitis** في الكتاب ببساطة: acute inflammation of pancreatic parenchyma.

          افتكر الدرس الأول: المرض كله إن الـ trypsin اتفعّل جوه البنكرياس بدل الـ duodenum. أي حاجة تسد الماسورة، أو تسمّم الخلية، أو تقلّل الدم، ممكن تولّع الفتيل ده.

          الكتاب بيقسّم الأسباب لـ 7 مجموعات في جدول. أشهر 3 أرقام فيه:
          - **Gall stones**: 80% of cases في جدول الكتاب. الحصوة بتعدّي وتسد الـ ampulla، فالعصارة ترجع.
          - **Alcoholism**: 5–60%، وبيحتاج حوالي 5 years من أكتر من 50 g/d.
          - **Hyperlipoproteinemia**: لما الـ TG تعدّي 1000 mg/dl.
      - kind: mnemonic
        page: 277
        word: "MIGS VIM"
        parts:
          - { key: "M", text: "Mechanical: gall stones, trauma, operative procedures, post-ERCP" }
          - { key: "I", text: "Immune: AIP, IgG4 disease" }
          - { key: "G", text: "Genetic: mutations in cationic trypsinogen and trypsinogen-inhibitor genes" }
          - { key: "S", text: "Structural: cystic fibrosis, congenital anomalies, SOD, tumors" }
          - { key: "V", text: "Vascular: shock, atheroembolism, vasculitis" }
          - { key: "I", text: "Infections: mumps and other viruses, Ascaris, SARS-CoV-2" }
          - { key: "M", text: "Metabolic: alcoholism, hyperlipoproteinemia (TG > 1000 mg/dl), hypercalcemia, drugs (azathioprine)" }
        hook: |
          شوية طيارات **MiG** (جمعها **MIGS**) ضربت البنكرياس فولّع، وجم ينضّفوا الحريقة بـ **Vim**. 😄

          سبع حروف = السبع مجموعات اللي في جدول الكتاب، ومفيش مجموعة ناقصة.
      - kind: sort
        page: 277
        prompt: "حط كل سبب في المجموعة بتاعته في جدول الكتاب:"
        bins: ["Metabolic", "Mechanical", "Vascular", "Infections"]
        cards:
          - { text: "Hypercalcemia", bin: 0 }
          - { text: "TG > 1000 mg/dl", bin: 0 }
          - { text: "Azathioprine", bin: 0 }
          - { text: "Post-ERCP", bin: 1 }
          - { text: "Trauma", bin: 1 }
          - { text: "Shock", bin: 2 }
          - { text: "Vasculitis", bin: 2 }
          - { text: "Mumps", bin: 3 }
          - { text: "Ascaris", bin: 3 }
        why: "الملاحظة الغريبة: الكتاب حاطط الـ **drugs** (زي azathioprine) والـ **alcohol** تحت **Metabolic**، والـ gall stones والـ post-ERCP تحت **Mechanical**."
      - kind: explain
        page: 278
        title: "الأشهر، والأدوية، والسن"
        text: |
          - **The most common causes**: biliary, alcohol, post-ERCP.
          - **Idiopathic**: 20% من الحالات، يعني كل خامس مريض مش هتلاقي له سبب من أول مرة.
          - السن: لو المريض فوق 40 سنة، فكّر في **cancer** كسبب، لأن الورم ممكن يسد الـ duct زي الحصوة بالظبط.

          الأدوية اللي في الكتاب (13 دوا، قسّمها علشان تتحفظ):
          - مسكنات ومضادات التهاب: acetaminophen, NSAIDs, sulindac, 5-ASA.
          - مثبطات مناعة: azathioprine, 6-mercaptopurine.
          - مضادات حيوية: erythromycin, metronidazole, tetracycline.
          - هرمونات وسكر: estrogen, exenatide.
          - باقي: furosemide, valproic acid.
      - kind: aside
        tone: exam
        page: 278
        text: |
          افتكر رقم 40 كويس: هيرجعلك في الدرس الجاي. مريض > 40 بـ AP من غير سبب واضح هو واحد من 3 indications للـ **contrast CT**، علشان تدوّر على **pancreatic tumor**.
      - kind: explain
        page: 278
        title: "شكله في الطوارئ، وقاعدة 2 من 3"
        text: |
          الوجع النموذجي: sudden, epigastric (Lt UQ), sharp، وممكن يروح للضهر (لأن البنكرياس retroperitoneal)، ومعاه severe nausea and vomiting.

          الاستثناء: في الـ alcoholic, hereditary, metabolic, drug-induced الوجع ممكن يبدأ أهدى ومش متحدد كويس. فمتستناش الوجع الصارخ علشان تفكّر في الـ AP.

          التشخيص = 2 من 3:
          - **Clinical**: وجع يناسب المرض.
          - **Lab**: amylase و/أو lipase أكتر من **3 × ULN**.
          - **Imaging**: شكل مميز في الأشعة.

          ليه 2 من 3؟ لأن ولا واحد لوحده مضمون: الإنزيم ممكن يبقى normal (هنشوف ليه)، والأشعة بدري ممكن تبقى نضيفة.

          علامتين على الجلد (ص 279) بيعنوا نزيف في الـ retroperitoneum وصل للجلد:
          - **Cullen sign**: كدمة حوالين السُرّة.
          - **Grey-Turner sign**: كدمة في الـ flank.
      - kind: check
        page: 278
        question: "Typical epigastric pain radiating to the back. Lipase is **2 × ULN**. Ultrasound shows a swollen, non-homogeneous pancreas. Is this acute pancreatitis?"
        options:
          - "Yes: pain plus imaging meet 2 of the 3 criteria"
          - "No: lipase must be above 3 × ULN"
          - "Only if amylase is also raised"
          - "Only after contrast CT shows necrosis"
        answer: 0
        why:
          - "صح: القاعدة 2 من 3، والـ clinical + imaging كفاية حتى لو الإنزيم مش واصل 3 أضعاف."
          - "الإنزيم معيار واحد بس من التلاتة، مش شرط."
          - "الكتاب بيقول amylase و/أو lipase، ومش محتاجهم لو فيه معيارين تانيين."
          - "الـ necrosis مش شرط تشخيص. والـ CT مش روتين أصلًا (الدرس الجاي)."
