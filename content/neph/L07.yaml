    kind: card
    topic: fabry
    front: How does autonomic dysfunction show in Fabry disease?
    back: Hypohidrosis, acral paresthesias and pain, and altered intestinal motility.
    src: { page: 190, quote: "Nervous system Autonomic dysfunction is a prominent feature of Fabry disease, typi-cally manifested by hypohidrosis, acral paresthesias and pain, and altered intestinal motility. Cerebrovascular symptoms (secondary to narrowing of the vascular lumen from accumulation of glycosphingolipid in vas-cular endothelial cells) tend to appear during the fourth decade and include hemiparesis, vertigo, diplopia, dysarthria, nystagmus, nausea and vomiting, headache, ataxia, and memory loss. The vertebrobasilar circulation is preferentially involved. Symptoms are often recurrent. Life-threatening intra cerebral hemorrhage and infarction are not unusual." }
