      - kind: explain
        page: 148
        title: "الدم بيقول إيه؟"
        quote: "The anemia is mainly due to reduced erythropoiesis, but may be compounded by hypersplenism, bleeding and iron or folate deficiency."
        text: |
          - **Anemia**: في أغلبهم وبتزيد مع التليف. سببها الأساسي ==reduced erythropoiesis==، وفوقيها hypersplenism، bleeding، iron أو folate deficiency.
          - **Platelets**: عالية في لحد النص في الأول (تجلط)، وبعدين **thrombocytopenia**. والـ **dysmegakaryopoiesis** بتزوّد النزيف.
          - **WBC**: **leukoerythroblastic** picture، neutrophilia، basophils و eosinophils زيادة شوية. ومع الوقت **leukopenia** (hypersplenism، dysmyelopoiesis، fibrosis).
