        title: "Systolic CHF: الأدوات"
        quote: "Treatment of CHF due to systolic dysfunction"
        text: |
          علاج الـ CHF بسبب الـ systolic dysfunction:
          - Diet و exercise
          - **Diuretics**
          - ==ACE inhibitors و ARBs==
          - **Digoxin**
          - Vasodilators
          - ==Beta-blockers==
      - kind: figure
