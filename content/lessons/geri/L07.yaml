        page: 126
        title: "Social history: أكتر من كلمة «متجوز»"
        quote: "How often have you seen a social history comprising one word 'married'?"
        text: "أغلب الكشوفات بتحصل **بعيد عن البيت** ومن غير الـ next of kin أو الـ carers. والكتاب بيسأل: كام مرة شفت social history كلمة واحدة: ==«married»==؟ اسأل مين بيساعده، البيت شكله إيه، بيصرف منين."
      - kind: explain
        page: 126
        title: "الـ medication review: قلب الـ CGA"
        quote: "Medication review is a core component of CGA. Older patients with multiple comorbidities can have indications for multiple medications, some of which may be based on sound, relevant evidence, but others may do more harm than good, particularly in combination."
        text: |
          - الـ guidelines اتعملت على trials **ما كانش فيها** frail elderly.
          - دوا قديم ممكن يبقى مالوش لازمة: المرض خلص، الـ ==physiology اتغيّرت==، أو كان بيعالج **side effect** لدوا تاني.
          - أدوية **long-term risk reduction** (ضغط، renal disease في السكر، lipid lowering) أقل أهمية مع **limited lifespan**.

          الحل: علاج **individualized** باستخدام ==Screening Tool of Older Persons' Prescriptions (STOPP) & Screening Tool to Alert to Right Treatment (START)==.
      - kind: reveal
        page: 126
        quote: "The evidence base for guideline-based prescribing may not be directly relevant to frail older people or those with significant comorbidity (as such people are unlikely to have been represented in trial participants). Further, even established medications may no longer be useful as diseases may have run their course, physiology may have changed, or the reason for their prescription may have been to treat another drug's side effect."
        prompt: "عيانة بتاخد amlodipine، وبعدين furosemide لورم الرجل منه، وبعدين potassium علشان الـ furosemide. إيه المشكلة؟"
        answer: "دي **prescribing cascade**: دوا بيعالج **side effect** دوا تاني. الكتاب بيقول إن الدوا ممكن يكون اتكتب «to treat another drug's side effect». الـ review ممكن يشيل التلاتة بدل ما يزوّد رابع. (المثال للتوضيح، والفكرة من الكتاب.)"
