        quote: "In June 2021, the FDA authorized the first disease-modifying medication and major approval for AD in almost 2 decades, aducanumab (Aduhelm; Biogen Inc), and"
        title: "الـ disease-modifying drugs"
        text: |
          - **June 2021**: الـ US Food and Drug Administration (FDA) وافق على ==aducanumab==، أول **disease-modifying** دوا.
          - **January 2023**: ==lecanemab==.

          ليه اسمها **disease-modifying**؟ لأن الـ cholinesterase inhibitors بتحسّن الأعراض بس (بتعوّض الناقل)، أما دي antibodies بتشيل الـ **amyloid** نفسه، يعني بتحاول تغيّر مسار المرض. وعلشان كده الكتاب بيقول إنها أول approval كبير من **almost 2 decades**.
