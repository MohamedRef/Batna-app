  - id: neph.L04.013
    kind: mcq
    topic: measurement
    stem: A 50-year-old woman's clinic BP is 146/92. Her 24-hour ambulatory record shows a night-time average of 128/76. How do you read the night value?
    options:
      - Normal, because night threshold equals the clinic threshold
      - Hypertensive, because the night threshold is 120/70
      - Normal, because only the 24-hour average counts
      - Hypertensive only if above 135/85
    answer: 1
    why:
      - The clinic threshold is 140/90; night is lower.
      - "Correct: the night threshold is 120/70 mmHg (p81); 128/76 is above it."
      - The table gives separate thresholds for 24-hour, day, night and home.
      - 135/85 is the upper day and home threshold.
    src: { page: 81, quote: "Office or Clinic 140 90 24-hour 125-130 80 Day 130-135 85 Night 120 70" }
    status: unverified
  # ---------- p82: BHS classification and secondary causes ----------
  - id: neph.L04.014
    kind: table
    topic: classification
    title: "British Hypertension Society classification (mmHg)"
    columns: [Category, SBP, DBP]
    rows:
      - ["Optimal", "<120 and", "<80"]
      - ["Normal", "120–129 and/or", "80–84"]
      - ["High normal", "130–139 and/or", "85–89"]
      - ["Grade 1 (mild)", "140–159 and/or", "90–99"]
      - ["Grade 2 (moderate)", "160–179 and/or", "100–109"]
      - ["Grade 3 (severe)", "≥180 and/or", "≥110"]
      - ["Isolated systolic grade 1", "140–149", "<90"]
      - ["Isolated systolic grade 2", ">160", "<90"]
    blanks: [[2, 1], [3, 1], [3, 2], [4, 1], [5, 1], [5, 2]]
