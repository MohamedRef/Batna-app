  # ---------- p235-236: acute gouty arthritis ----------
  - id: dm.L18.018
    kind: cloze
    topic: acute
    text: "{{c1::90%}} of first gout attacks are monoarticular, and {{c2::50%}} of them are in the {{c3::first MTP joint (podagra)}}."
    src: { page: 235, quote: "90% of the first attacks are monoarticular, and 50% of them occur in the 1 st MTPJ (podagra)" }
