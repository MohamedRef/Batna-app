schema: batna.lesson/v1
lecture: res.L13
lessons:
  # ------------------------------------------------------------------
  - id: res.L13.lesson1
    title: "الـ paper ليه ليه شكل ثابت؟ ومن العنوان نبدأ"
    hook: "رسالتك هتخلص بـ paper. أول حاجة المحكّم هيشوفها هي العنوان، فخلّيه يقول كل حاجة في 12 كلمة."
    minutes: 7
    pages: [2, 6]
    topics: [structure]
    goals:
      - "تعرف ليه شكل الـ paper متوحّد ومين اللي حاطط القواعد"
      - "ترتّب أجزاء الـ paper"
      - "تكتب عنوان و running title صح"
    status: unverified
    steps:
      - kind: explain
        page: 2
        quote: "Writing a scientific paper\nWriting a scientific paper is the most common way of communicating the results of research to other scientists and to health professionals.\nThe format for writing a scientific paper for publication in biomedical journals has been standardized to provide a systematic and organized way to present the data."
        title: "الـ paper = اللغة المشتركة"
        text: |
          كتابة ==scientific paper== هي **أكتر طريقة** بنوصّل بيها نتايج البحث للعلماء وللـ health professionals.

          وعشان كل القرّاء يلاقوا المعلومة في نفس المكان، شكل الـ paper في الـ biomedical journals بقى **standardized**: طريقة **systematic** و**organized** لعرض الداتا.
      - kind: explain
        page: 3
        quote: "Writing a scientific paper\nThe International Committee of Medical Journal Editors issues a set of uniform requirements for submitting manuscripts to biomedical journals. These requirements are revised periodically."
        title: "مين حاطط القواعد؟"
        text: |
          الـ ==International Committee of Medical Journal Editors== بتطلّع **uniform requirements** لتقديم الأبحاث للـ biomedical journals.

          والقواعد دي **بتتراجع كل فترة** (revised periodically)، فكل جورنال ممكن يضيف تعليماته فوقها.
      - kind: figure
        page: 4
        quote: "Selecting a title for the paper\nAbstract\nIntroduction\nMethodology\nResults\nDiscussion\nConclusion\nAcknowledgements\nReferences"
        title: "الـ paper من فوق لتحت"
        alt: "A vertical ladder of nine boxes joined by down arrows: Title, Abstract, Introduction, Methodology, Results, Discussion, Conclusion, Acknowledgements, References. The four middle boxes, Introduction to Discussion, are circled as the core."
        caption: "السلايد بتلف دايرة حوالين الـ 4 الأساسيين: **Introduction ← Methodology ← Results ← Discussion**. والباقي بيلفّ حواليهم."
        svg: |
          <svg viewBox="0 0 300 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L13a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="60" y="6" width="180" height="24" rx="5" class="fg-box"/><text x="150" y="23" text-anchor="middle" class="t-sm t-b">Title</text>
            <rect x="60" y="42" width="180" height="24" rx="5" class="fg-box"/><text x="150" y="59" text-anchor="middle" class="t-sm">Abstract</text>
            <rect x="40" y="74" width="220" height="146" rx="12" class="fg-thin"/>
            <rect x="60" y="80" width="180" height="24" rx="5" class="fg-acc"/><text x="150" y="97" text-anchor="middle" class="t-sm t-b">Introduction</text>
            <rect x="60" y="116" width="180" height="24" rx="5" class="fg-acc"/><text x="150" y="133" text-anchor="middle" class="t-sm t-b">Methodology</text>
            <rect x="60" y="152" width="180" height="24" rx="5" class="fg-acc"/><text x="150" y="169" text-anchor="middle" class="t-sm t-b">Results</text>
            <rect x="60" y="188" width="180" height="24" rx="5" class="fg-acc"/><text x="150" y="205" text-anchor="middle" class="t-sm t-b">Discussion</text>
            <text x="268" y="150" class="t-sm t-acc" transform="rotate(90 268 150)" text-anchor="middle">the core</text>
            <rect x="60" y="230" width="180" height="24" rx="5" class="fg-box"/><text x="150" y="247" text-anchor="middle" class="t-sm">Conclusion</text>
            <rect x="60" y="266" width="180" height="24" rx="5" class="fg-box"/><text x="150" y="283" text-anchor="middle" class="t-sm">Acknowledgements</text>
            <rect x="60" y="302" width="180" height="24" rx="5" class="fg-box"/><text x="150" y="319" text-anchor="middle" class="t-sm">References</text>
            <path d="M150 30V40" class="fg-arrow" marker-end="url(#L13a)"/>
            <path d="M150 66V78" class="fg-arrow" marker-end="url(#L13a)"/>
            <path d="M150 104V114" class="fg-arrow" marker-end="url(#L13a)"/>
            <path d="M150 140V150" class="fg-arrow" marker-end="url(#L13a)"/>
            <path d="M150 176V186" class="fg-arrow" marker-end="url(#L13a)"/>
            <path d="M150 212V228" class="fg-arrow" marker-end="url(#L13a)"/>
            <path d="M150 254V264" class="fg-arrow" marker-end="url(#L13a)"/>
            <path d="M150 290V300" class="fg-arrow" marker-end="url(#L13a)"/>
          </svg>
      - kind: aside
        tone: analogy
        page: 4
        quote: "Selecting a title for the paper\nAbstract\nIntroduction\nMethodology\nResults\nDiscussion\nConclusion\nAcknowledgements\nReferences"
        text: |
          الـ 4 الأساسيين بيجاوبوا 4 أسئلة زي حكاية الكشف:
          - **Introduction**: إنت جاي ليه؟
          - **Methods**: عملنا إيه؟
          - **Results**: لقينا إيه؟
          - **Discussion**: يعني إيه؟
      - kind: order
        page: 4
        quote: "Selecting a title for the paper\nAbstract\nIntroduction\nMethodology\nResults\nDiscussion\nConclusion\nAcknowledgements\nReferences"
        prompt: "رتّب أجزاء الـ paper زي السلايد"
        steps: ["Title", "Abstract", "Introduction", "Methodology", "Results", "Discussion", "Conclusion", "Acknowledgements"]
        why: "العنوان والملخص الأول (الواجهة)، بعدين الـ 4 الأساسيين بالترتيب، والخلاصة والشكر والمراجع في الآخر."
      - kind: explain
        page: 5
        quote: "Selecting a title for the paper\nA good title should adequately describe the contents of the paper in the fewest possible words. It should not be too long or too short; generally, it should consist of 10–12 words.\nSome journals, but not all, allow sub-titles.\nThe title should not include any unnecessary words, nor waste space with phrases such as \"Observations on\" or \"A study of\"."
        title: "العنوان: أقل كلام، أكتر معنى"
        text: |
          العنوان الكويس **يوصف المحتوى** بـ **أقل عدد كلمات**: مش طويل ومش قصير، غالبًا ==10–12 كلمة==.

          - في جورنالات (مش كلها) بتسمح بـ **sub-title**.
          - **ممنوع** الكلام الزيادة زي «Observations on» أو «A study of»: ماهو أكيد study!
      - kind: explain
        page: 6
        quote: "Selecting a title for the paper\nIt should not contain abbreviations.\nMany journals require a running title (short title) to be printed at the top or bottom of every page of the article when it is published. Usually, this is between 30 and 50 characters."
        title: "لا اختصارات، وفيه running title"
        text: |
          - العنوان **مايبقاش فيه اختصارات**.
          - جورنالات كتير بتطلب ==running title== (short title) بيتطبع **فوق أو تحت كل صفحة** في المقالة المنشورة، وطوله غالبًا **من 30 لـ 50 حرف** (characters، مش كلمات).
      - kind: check
        page: 5
        quote: "Selecting a title for the paper\nA good title should adequately describe the contents of the paper in the fewest possible words. It should not be too long or too short; generally, it should consist of 10–12 words.\nSome journals, but not all, allow sub-titles.\nThe title should not include any unnecessary words, nor waste space with phrases such as \"Observations on\" or \"A study of\"."
        question: "Which title best follows the lecture's rules?"
        options:
          - "Few workers exposed to wood dust are detected with specific IgE against pine wood"
          - "A study of observations on wood workers"
          - "Pine IgE in FWs"
          - "Wood dust"
        answer: 0
        why:
          - "صح: ده عنوان المقالة اللي في السلايدات، بيحكي المحتوى في حوالي 12 كلمة."
          - "«A study of» و«Observations on» بالظبط الكلام اللي اتقال نشيله."
          - "فيه اختصارات (FWs)، والعنوان ممنوع فيه اختصارات."
          - "قصير قوي ومش بيوصف المحتوى."
      - kind: aside
        tone: exam
        page: 6
        quote: "Selecting a title for the paper\nIt should not contain abbreviations.\nMany journals require a running title (short title) to be printed at the top or bottom of every page of the article when it is published. Usually, this is between 30 and 50 characters."
        text: "الأرقام اللي بتيجي في الامتحان: العنوان **10–12 كلمة**، والـ running title **30–50 حرف**. ماتلخبطش الكلمات بالحروف."
      - kind: try
        items: [res.L13.003, res.L13.006, res.L13.007]
    recap:
      - "شكل الـ paper standardized، والـ uniform requirements من الـ International Committee of Medical Journal Editors."
      - "الترتيب: Title ← Abstract ← Introduction ← Methodology ← Results ← Discussion ← Conclusion ← Acknowledgements ← References."
      - "العنوان 10–12 كلمة، من غير «A study of» ولا اختصارات."
      - "الـ running title من 30 لـ 50 حرف."
    practice: [res.L13.001, res.L13.002, res.L13.003, res.L13.004, res.L13.005, res.L13.006, res.L13.007]
  # ------------------------------------------------------------------
  - id: res.L13.lesson2
    title: "الـ abstract: الـ paper في بُق واحد"
    hook: "ناس كتير مش هتقرا غير الـ abstract. لو مافهموش منه البحث كله، كأنك ماكتبتش."
    minutes: 8
    pages: [8, 13]
    topics: [abstract]
    goals:
      - "تعرف الـ abstract بيقول إيه"
      - "تفرّق بين structured و unstructured وحدود الكلمات"
      - "تعرف قواعد الـ key words"
    status: unverified
    steps:
      - kind: explain
        page: 8
        quote: "Abstract\nAn abstract should be included at the beginning of the paper.\nThe abstract should state:\nPurposes of the study or investigation,\nBasic procedures (selection of study subjects or laboratory animals; observational and analytical methods),\nMain findings (giving specific data and their statistical significance, if possible) and\nPrincipal conclusions."
        title: "4 أسئلة في الـ abstract"
        text: |
          الـ ==abstract== بيتحط **في أول الـ paper**، ولازم يقول:

          - **Purposes**: الدراسة عايزة إيه.
          - **Basic procedures**: اخترنا الناس (أو الحيوانات) إزاي، والطرق الـ observational والـ analytical.
          - **Main findings**: بأرقام محددة والـ statistical significance لو ينفع.
          - **Principal conclusions**: الخلاصة.
      - kind: mnemonic
        page: 8
        quote: "Abstract\nAn abstract should be included at the beginning of the paper.\nThe abstract should state:\nPurposes of the study or investigation,\nBasic procedures (selection of study subjects or laboratory animals; observational and analytical methods),\nMain findings (giving specific data and their statistical significance, if possible) and\nPrincipal conclusions."
        word: "PPMC"
        parts:
          - { key: "P", text: "Purposes: ليه؟" }
          - { key: "P", text: "Procedures (basic): عملنا إيه؟" }
          - { key: "M", text: "Main findings: لقينا إيه، بالأرقام؟" }
          - { key: "C", text: "Conclusions (principal): يعني إيه؟" }
        hook: "«بي بي إم سي»: ليه، عملنا إيه، لقينا إيه، ويعني إيه."
      - kind: explain
        page: 9
        quote: "Abstract\nA good abstract should be a miniature version of the paper, provide a brief summary of each of the main sections of the paper and follow the structure of the paper.\nMany journals require a structured abstract, which includes subtitles such as objective, type of design, setting, material or subjects, methods, results, and conclusions."
        title: "نسخة مصغّرة من الـ paper"
        text: |
          الـ abstract الكويس ==miniature version== من الـ paper: ملخص قصير لكل قسم، **بنفس ترتيب** الـ paper.

          جورنالات كتير بتطلب ==structured abstract== بعناوين فرعية زي: objective، type of design، setting، material or subjects، methods، results، conclusions.
      - kind: figure
        page: 9
        quote: "Abstract\nA good abstract should be a miniature version of the paper, provide a brief summary of each of the main sections of the paper and follow the structure of the paper.\nMany journals require a structured abstract, which includes subtitles such as objective, type of design, setting, material or subjects, methods, results, and conclusions."
        title: "Structured abstract: كل عنوان في سطره"
        alt: "A card titled Abstract with seven labelled rows down the left: Objective, Design, Setting, Subjects, Methods, Results, Conclusions, each with a grey bar of text beside it. Under the card a strip reads Key words, 3 to 10, MeSH."
        caption: "كده شكل الـ **structured abstract**: كل subtitle قصاده سطر أو اتنين. وتحته على طول الـ **key words**."
        svg: |
          <svg viewBox="0 0 320 250" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="8" width="300" height="196" rx="10" class="fg-box"/>
            <text x="160" y="28" text-anchor="middle" class="t-sm t-b">Abstract (structured, &lt;250 words)</text>
            <g class="t-sm">
              <text x="22" y="54" class="t-b t-acc">Objective</text><rect x="110" y="45" width="185" height="10" rx="3" class="fg-thin"/>
              <text x="22" y="76" class="t-b t-acc">Design</text><rect x="110" y="67" width="150" height="10" rx="3" class="fg-thin"/>
              <text x="22" y="98" class="t-b t-acc">Setting</text><rect x="110" y="89" width="120" height="10" rx="3" class="fg-thin"/>
              <text x="22" y="120" class="t-b t-acc">Subjects</text><rect x="110" y="111" width="170" height="10" rx="3" class="fg-thin"/>
              <text x="22" y="142" class="t-b t-acc">Methods</text><rect x="110" y="133" width="185" height="10" rx="3" class="fg-thin"/>
              <text x="22" y="164" class="t-b t-acc">Results</text><rect x="110" y="155" width="185" height="10" rx="3" class="fg-thin"/>
              <text x="22" y="186" class="t-b t-acc">Conclusions</text><rect x="110" y="177" width="140" height="10" rx="3" class="fg-thin"/>
            </g>
            <rect x="10" y="214" width="300" height="28" rx="8" class="fg-acc"/>
            <text x="160" y="233" text-anchor="middle" class="t-sm">Key words: 3–10, from MeSH</text>
          </svg>
      - kind: table
        page: 11
        quote: "Abstract\nThe number of words in an abstract should generally be less than 150 for unstructured abstracts, and less than 250 for structured abstracts. Some electronic databases are programmed to accept only up to this limited number of words.\nAbstracts are generally written in the past tense."
        title: "حدود الكلمات"
        columns: ["Abstract", "Words"]
        rows:
          - ["Unstructured", "Less than 150"]
          - ["Structured", "Less than 250"]
        hide: [[0, 1], [1, 1]]
      - kind: explain
        page: 11
        quote: "Abstract\nThe number of words in an abstract should generally be less than 150 for unstructured abstracts, and less than 250 for structured abstracts. Some electronic databases are programmed to accept only up to this limited number of words.\nAbstracts are generally written in the past tense."
        title: "ليه الحد ده مهم؟ وبأنهي زمن؟"
        text: |
          مش ذوق وبس: بعض الـ **electronic databases** مبرمجة **تقبل لحد العدد ده بس**، فالزيادة بتتقص.

          والـ abstract غالبًا بيتكتب بالـ ==past tense==: «we examined… we found…»، لأن الدراسة خلصت.
      - kind: explain
        page: 12
        quote: "Abstract\nThe abstract should be self-contained and able to stand alone without need to consult the full text. As such:\nIt should not include references to literature or to figures and tables in the body of paper.\nIt should not include information that is not in the paper.\nIt should not contain abbreviations or acronyms unless standard or very well known."
        title: "يقف على رجليه لوحده"
        text: |
          الـ abstract لازم يكون ==self-contained==: يتفهم من غير ما تفتح الـ paper. يعني:

          - **مافيهوش references** للأدب العلمي ولا للـ figures والـ tables.
          - **مافيهوش معلومة** مش موجودة في الـ paper.
          - **مافيهوش اختصارات** إلا الـ standard أو المشهورة جدًا.
      - kind: check
        page: 12
        quote: "Abstract\nThe abstract should be self-contained and able to stand alone without need to consult the full text. As such:\nIt should not include references to literature or to figures and tables in the body of paper.\nIt should not include information that is not in the paper.\nIt should not contain abbreviations or acronyms unless standard or very well known."
        question: "An abstract says \"...as shown in Table 2 (14)\". What is wrong?"
        options:
          - "It isn't self-contained: no references to tables or literature"
          - "It's in the past tense"
          - "It's a structured abstract"
          - "Nothing; this is recommended"
        answer: 0
        why:
          - "صح: الـ abstract لازم يتفهم لوحده، فمافيهوش Table 2 ولا مرجع رقم 14."
          - "الـ past tense هو المطلوب أصلًا."
          - "الـ structured مش غلط؛ جورنالات كتير بتطلبه."
          - "السلايد بتقول صراحة لأ."
      - kind: explain
        page: 13
        quote: "Abstract\nKey words: most scientific journals require authors to provide 3-10 key words or short phrases that will assist indexers in cross-indexing the article.\nKey words are usually placed beneath the abstract. Terms from the Medical Subject Headings (MeSH) list of PubMed (US National Library of Medicine) should be used wherever possible, to facilitate indexing and retrieval."
        title: "الـ key words"
        text: |
          معظم الجورنالات بتطلب ==3–10 key words== أو short phrases، بتساعد الـ indexers يفهرسوا المقالة.

          - مكانها غالبًا **تحت الـ abstract**.
          - استخدم مصطلحات من ==MeSH== (Medical Subject Headings) بتاعة PubMed (US National Library of Medicine) عشان الفهرسة والبحث.
      - kind: aside
        tone: tip
        page: 13
        quote: "Abstract\nKey words: most scientific journals require authors to provide 3-10 key words or short phrases that will assist indexers in cross-indexing the article.\nKey words are usually placed beneath the abstract. Terms from the Medical Subject Headings (MeSH) list of PubMed (US National Library of Medicine) should be used wherever possible, to facilitate indexing and retrieval."
        text: "قبل ما تختار key words، دوّر على الكلمة في MeSH على PubMed. لو مكتوبة هناك، يبقى اللي بيدوّر هيلاقي بحثك."
      - kind: try
        items: [res.L13.008, res.L13.011, res.L13.014, res.L13.016]
    recap:
      - "الـ abstract: purposes، basic procedures، main findings، principal conclusions."
      - "miniature version من الـ paper؛ والـ structured له subtitles."
      - "أقل من 150 كلمة (unstructured) و 250 (structured)، بالـ past tense."
      - "self-contained: لا references ولا tables ولا معلومة جديدة ولا اختصارات."
      - "3–10 key words تحت الـ abstract، من MeSH."
    practice: [res.L13.008, res.L13.009, res.L13.010, res.L13.011, res.L13.012, res.L13.013, res.L13.014, res.L13.015, res.L13.016]
  # ------------------------------------------------------------------
  - id: res.L13.lesson3
    title: "الـ Introduction والـ Methods: ليه، وعملنا إيه بالظبط"
    hook: "لو حد قرا الـ methods بتاعتك ومعرفش يعيد الدراسة، يبقى الـ methods ناقصة."
    minutes: 9
    pages: [15, 24]
    topics: [intro-methods]
    goals:
      - "تعرف المقدمة تعمل إيه وماتعملش إيه"
      - "تكتب الـ methods بحيث تتعاد"
      - "تعرف قواعد الـ ethics والـ statistics في الـ methods"
    status: unverified
    steps:
      - kind: explain
        page: 15
        quote: "Introduction\nThe introduction should:\nTell the reader why the research was started, and make clear what question the research was designed to answer. Research is not a fishing expedition. It is designed with a specific question in mind.\nRaise the interest of the reader. The first few lines in the paper may attract or put off the reader. Investigators are advised to convey their enthusiasm but not to exaggerate."
        title: "المقدمة: ليه بدأنا، وإيه السؤال"
        text: |
          المقدمة لازم:
          - تقول **ليه البحث بدأ**، و**إيه السؤال** اللي اتصمم يجاوبه. البحث ==not a fishing expedition==: متصمم على سؤال محدد.
          - **تشد القارئ**: أول سطور ممكن تجذبه أو تطفّشه. وريه حماسك، **من غير مبالغة**.
      - kind: aside
        tone: joke
        page: 15
        quote: "Introduction\nThe introduction should:\nTell the reader why the research was started, and make clear what question the research was designed to answer. Research is not a fishing expedition. It is designed with a specific question in mind.\nRaise the interest of the reader. The first few lines in the paper may attract or put off the reader. Investigators are advised to convey their enthusiasm but not to exaggerate."
        text: "الـ fishing expedition = ترمي السنارة في البحر وتشوف هيطلع إيه. ده مش بحث، ده رحلة للعجمي. 🎣 البحث بيبدأ بسؤال، والسنارة على سمكة معينة."
      - kind: explain
        page: 16
        quote: "Introduction\nThe introduction should not:\nExplain what can be found in any textbook in the field.\nBe over-referenced; it should give only strictly pertinent references.\nInclude data or conclusions from the work being reported."
        title: "المقدمة ماتعملش 3 حاجات"
        text: |
          - **ماتشرحش** اللي موجود في أي textbook.
          - **ماتبقاش over-referenced**: بس الـ references اللي ليها علاقة مباشرة.
          - **ماتحطش** داتا أو conclusions من الشغل نفسه؛ دي مكانها الـ results والـ discussion.
      - kind: explain
        page: 18
        quote: "Methodology\nPrinciples\nReplicability of results is the heart of science. The methods section should provide a detailed exposition of the research design. A reader of the methods section should be able to repeat the study and to validate the findings.\nA methods section less than two double-spaced pages is probably inadequate."
        title: "الـ Methods: قلب العلم إنك تتعاد"
        text: |
          ==Replicability== هي قلب العلم. الـ methods لازم تشرح الـ **research design** بالتفصيل، لدرجة إن القارئ **يقدر يعيد الدراسة** ويتأكد من النتايج.

          وقاعدة السلايد: methods **أقل من صفحتين double-spaced** غالبًا ==inadequate==.
      - kind: table
        page: 19
        quote: "Methodology\n1. Established methods should be referenced but no description is necessary.\n2. Published but not well known methods, a reference as well as a brief description should be given.\n3. New or substantially modified methods should be clearly described, with reasons given for using them and with their limitations outlined."
        title: "كل method تتوصف قد إيه؟"
        columns: ["Method", "What to write"]
        rows:
          - ["Established", "Reference only, no description"]
