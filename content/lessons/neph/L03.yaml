            <rect x="60" y="302" width="210" height="44" rx="14" class="fg-bad"/>
            <text x="165" y="320" text-anchor="middle" class="t-sm t-b">Sympathetic + RAA activation,</text>
            <text x="165" y="336" text-anchor="middle" class="t-sm t-b">vasoconstriction</text>
            <path d="M165 282V298" class="fg-arrow-bad" marker-end="url(#L03c)"/>
            <path d="M272 324 C326 324 326 26 240 26" class="fg-arrow-bad" fill="none" marker-end="url(#L03c)"/>
          </svg>
      - kind: explain
        page: 70
        title: "CRS-2 و CRS-3"
        quote: "Normal Kidney Function Initiation of Kidney Damage Progression to CKD Chronic hypofusion, Apoptosis Sclerosis-Fibrosis"
        text: |
          **CRS-2 (chronic heart disease):** **low cardiac output**، **chronic hypoperfusion** و ==increased venous pressure== ومعاهم inflammation و arterial/endothelial calcification. الكلى بتمشي: **normal** ← **initiation of damage** (hypoperfusion، apoptosis) ← **progression to CKD** (sclerosis-fibrosis).

          وبعدين الكلى ترد: **anemia، hypertension، electrolyte imbalance** يرجعوا يتعبوا القلب.

          **CRS-3 (AKI أولًا):** electrolyte و coagulation imbalances، **hypertension** (↓GFR ← Na و water retention ← ↑preload)، **sympathetic** و **RAAS activation**، و humoral ← endothelial ← cytokines.
      - kind: explain
        page: 71
        title: "CRS-4 و CRS-5"
        quote: "Mechanism of damage in CRS-4. CKD, chronic kidney disease; CRS, cardiorenal syndrome; EPO, erythropoietin; LDL, low-density lipoprotein."
        text: |
          **CRS-4** بيكبر مع الـ CKD stage:
          - **Stage 1–2:** genetic risk، **diabetes**، primary nephropathy، **hypertension**، chronic inflammation.
          - **Stage 3–4:** **anemia**، **uremic toxins**، chronic inflammation، electrolyte imbalance.
          - **Stage 5:** فوق كده ==tissue calcification== و **EPO resistance**، و cytokines: endothelial dysfunction، LDL oxidation، oxidative stress، atherosclerosis، bone remodeling.

          **CRS-5:** **sepsis، diabetes، amyloidosis، vasculitis** بيعملوا monocyte activation و cytokines، hypoxia و oxidative stress، hypoperfusion و ischemia، و sympathetic activation، فالاتنين يتأذوا مع بعض.
      - kind: check
        page: 71
        quote: "Mechanism of damage in CRS-5. CRS, cardiorenal syndrome."
        question: "Which disease is NOT shown as a systemic cause of CRS-5 in Figure 5?"
        options:
          - "Vasculitis"
          - "Amyloidosis"
          - "Sepsis"
          - "Acute myocardial infarction"
        answer: 3
        why:
          - "Vasculitis موجودة في Figure 5."
          - "Amyloidosis موجودة في Table 1 و Figure 5."
          - "Sepsis موجودة في الاتنين."
          - "صح: الـ MI مرض قلب primary، فده type 1 مش 5."
      - kind: aside
        tone: joke
        text: |
          الـ type 5 زي حماة جاية تزور: مش القلب اللي بدأ ولا الكلى اللي بدأت، هي جت **وبهدلت الاتنين** مع بعض.
      - kind: try
        items: [neph.L03.003, neph.L03.012, neph.L03.015, neph.L03.024, neph.L03.029]
    recap:
      - "CRS = dysfunction في عضو بتجيب dysfunction في التاني (2008 consensus)."
      - "1–2 القلب الأول، 3–4 الكلى الأول، 5 مرض systemic؛ فردي acute وزوجي chronic."
      - "Type 1: renal perfusion هو الـ trigger، خصوصًا مع الـ congestion."
      - "Type 2: renal fibrosis؛ type 3: salt، water، neurohormones، uremia؛ type 4: HTN، dialysis، fluid shifts."
      - "Type 5: sepsis، diabetes، amyloidosis، vasculitis."
