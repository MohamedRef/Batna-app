  - id: endo.L03.lesson3
    title: "Ectopic ACTH: Cushing على السريع"
    hook: "مش هتلاقي moon face ولا buffalo hump. هتلاقي بوتاسيوم 2 ومريض بيدبل في شهرين."
    minutes: 8
    pages: [36, 38]
    topics: [acth]
    goals:
      - "تعرف أسباب الـ ectopic ACTH ونسبها"
      - "تفرّقها عن Cushing's disease"
      - "تفهم ليه البوتاسيوم بيقع"
    status: unverified
    steps:
      - kind: table
        page: 36
        quote: "1. Small cell or oat cell pulmonary carcinoma 50%. 2. Carcinoma of thymus 10%."
        title: "الأسباب"
        columns: ["Tumour", "%"]
        rows:
          - ["Small cell (oat cell) lung", "50%"]
          - ["Thymus carcinoma", "10%"]
          - ["Pancreas (carcinoid, islet)", "10%"]
          - ["Pheochromocytoma", "5%"]
          - ["Medullary Ca thyroid", "5%"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: explain
        page: 36
        quote: "Increased expression of proopiomelanocortin gene which encodes ACTH"
        title: "الميكانيزم"
        text: |
          ==POMC gene expression== بيزيد. الـ POMC بيتقطع لـ ACTH و lipotropin و MSH و endorphin. نادرًا الورم بيعمل **CRH**.

          وفي حالات نادرة الغدة نفسها عليها **ectopic receptors**:
          - **GIP receptors**: الأكل يعلّي الـ cortisol.
          - **LH receptors** مع macronodular hyperplasia: cushingoid في الحمل، وكامل بعد الـ menopause.

          الورم نادرًا بيعمل steroids، لأن تركيبها معقد.
      - kind: explain
        page: 37
        quote: "1) Presence of marked hypokalemia. 2) Marked increase of ACTH. 3) Marked increase of serum and urine cortisol."
        title: "إزاي تفرّقها عن Cushing's disease"
        text: |
          كلمة السر: ==marked==.
          1. **Marked hypokalemia**.
          2. **Marked** ACTH ↑.
          3. **Marked** cortisol ↑ في الدم والبول.
          4. ==No suppression== بالـ high-dose dexamethasone.
          5. Metabolic alkalosis.
          6. Fluid retention و hypertension.
          7. DM.
          8. Steroid psychosis.
      - kind: figure
        page: 37
        quote: "Marked elevation of cortisol overwhelm 11 B- hydroxysteroid dehydrogenase enzyme type2"
        title: "ليه البوتاسيوم بيقع؟"
        alt: "Kidney tubule cell. Normally 11-beta HSD2 converts cortisol to inactive cortisone, guarding the mineralocorticoid receptor. In ectopic ACTH, a flood of cortisol overwhelms the enzyme, so cortisol binds the mineralocorticoid receptor, causing sodium retention, potassium loss and alkalosis. ACTH also drives adrenal mineralocorticoids directly."
        caption: "الـ 11β-HSD2 زي البواب: بيحوّل الـ cortisol لـ cortisone قبل ما يوصل للـ receptor. لما الـ cortisol يبقى سيل، البواب يغرق."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="E03b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="E03c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <text x="10" y="20" class="t-sm t-b t-good">Normal</text>
            <text x="10" y="45" class="t-sm">Cortisol</text>
            <path d="M65 41H110" class="fg-arrow" marker-end="url(#E03b)"/>
            <rect x="112" y="26" width="90" height="28" rx="6" class="fg-good"/>
            <text x="120" y="45" class="t-sm t-b">11β-HSD2</text>
            <path d="M202 41H240" class="fg-arrow" marker-end="url(#E03b)"/>
            <text x="245" y="45" class="t-sm">Cortisone</text>
            <text x="245" y="62" class="t-sm t-mut">(inactive)</text>
            <text x="10" y="105" class="t-sm t-b t-bad">Ectopic ACTH</text>
            <text x="10" y="132" class="t-b t-bad">CORTISOL ↑↑↑</text>
            <path d="M115 128H150" class="fg-arrow-bad" marker-end="url(#E03c)"/>
            <rect x="152" y="113" width="90" height="28" rx="6" class="fg-bad"/>
            <text x="158" y="132" class="t-sm t-b">overwhelmed</text>
            <path d="M197 141V170" class="fg-arrow-bad" marker-end="url(#E03c)"/>
            <rect x="120" y="172" width="155" height="30" rx="6" class="fg-acc"/>
            <text x="128" y="192" class="t-sm t-b">Mineralocorticoid receptor</text>
            <text x="10" y="228" class="t-sm">→ Na and water retention, hypertension</text>
            <text x="10" y="248" class="t-sm t-b t-bad">→ K ↓↓, metabolic alkalosis</text>
          </svg>
      - kind: check
        page: 37
        quote: "No suppression of ACTH or cortisol by high Dexamethasone dose suppression test."
        question: "Which result favours ectopic ACTH over Cushing's disease?"
        options: ["No suppression with high-dose dexamethasone", "Mild hypokalaemia only", "ACTH 40 pg/mL", "Suppression of cortisol by 70%"]
        answer: 0
        why:
          - "صح: الـ ectopic مش بيتكبت بالـ high dose."
          - "الـ ectopic بيعمل hypokalemia شديدة."
          - "الـ ectopic غالبًا أكتر من 100."
          - "الكبت بأكتر من 50% بيميل لـ Cushing's disease."
      - kind: table
        page: 38
        quote: "Urinary free cortisol is 2 to 4 times normal level. ACTH is usually more than 100 pg/ml."
        title: "التشخيص والعلاج"
        columns: ["Item", "Value"]
        rows:
          - ["UFC", "2-4 times normal"]
          - ["ACTH", "Usually >100 pg/ml"]
          - ["High-dose DST", "Negative (no 50% fall)"]
          - ["Ketoconazole", "200-400 mg twice daily"]
          - ["Metyrapone", "250-500 mg every 6 h"]
          - ["Mitotane", "1 g every 6 h"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 38
        quote: "Consider cortisol replacement therapy after medical or surgical adrenalectomy."
        title: "العلاج"
        text: |
          - ==عالج الورم الأصلي==.
          - قلّل الـ cortisol: **medical** (ketoconazole، metyrapone، mitotane) أو **surgical** (bilateral adrenalectomy).
          - بعد الـ adrenalectomy الدوائية أو الجراحية: فكّر في **cortisol replacement**.
      - kind: aside
        tone: exam
        page: 37
        quote: "Ectopic ACTH Cushing can be differentiated from Cushing disease"
        text: "سؤال \"diagnostic features of ectopic Cushing\" من أسئلة الكتاب. اكتب التمانية بالترتيب، وبعدها الميكانيزم (ACTH بيشغّل الـ gluco والـ mineralo، والـ cortisol بيغرّق الـ 11β-HSD2)، وبعدها أرقام التشخيص."
      - kind: try
        items: [endo.L03.028, endo.L03.033, endo.L03.034, endo.L03.035, endo.L03.076]
    recap:
      - "Small cell lung 50%، thymus 10%، pancreas 10%، pheo 5%، MTC 5%."
      - "POMC ↑؛ نادرًا CRH؛ ectopic adrenal receptors (GIP، LH)."
      - "Marked: hypokalemia، ACTH، cortisol؛ no high-dose suppression؛ alkalosis، HTN، DM، psychosis."
