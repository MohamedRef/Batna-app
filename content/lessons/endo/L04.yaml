        quote: "The cause of hypocalcemia is unclear. PTH values are reported to be low normal or elevated, and both resistance to PTH & impaired PTH secrteion have been postulated."
        title: "البنكرياس"
        text: |
          - **Acute pancreatitis**: ==hypocalcaemia== مستمرة، ودرجتها على قد شدة الـ pancreatitis. السبب مش واضح؛ الـ parathyroid hormone (PTH) low normal أو عالي، فممكن PTH resistance أو secretion ضعيف.
