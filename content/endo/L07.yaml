items:
  # ---------- p111: overview, apoplexy ----------
  - id: endo.L07.001
    kind: enumerate
    topic: overview
    prompt: Enumerate the endocrine emergencies covered in the lecture.
    points: [Pituitary apoplexy, Myxedema coma, Thyroid storm, Acute hypocalcemia, Acute hypercalcemia, Acute adrenal insufficiency, Pheochromocytoma crisis]
    pass: 6
    hook: "الطوارئ 7 «1 + 2 + 2 + 2»: pituitary apoplexy؛ الدرقية (myxedema coma، thyroid storm)؛ الكالسيوم (acute hypocalcemia، acute hypercalcemia)؛ والأدرينال (acute adrenal insufficiency، pheochromocytoma crisis)."
    src: { page: 111, quote: "Endocrine Emergencies include\n  1. Pituitary apoplexy.\n  2. Myxedema coma.\n  3. Thyroid storm.\n  4. Acute hypocalcemia.\n  5. Acute hypercalcemia.\n  6. Acute adrenal insufficiency.\n  7. Pheochromocytoma crisis." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.002
    kind: card
    topic: apoplexy
    front: What is pituitary apoplexy, and how common is it in treated adenomas?
    back: Haemorrhage into a pituitary adenoma; rare, but reported in 0.6% to 25% of treated adenomas.
    src: { page: 111, quote: "Pituitary apoplexy results from hemorrhage into a pituitary adenoma. It is a rare disorder but is reported to occur in 0.6% to 25% of cases of treated adenoma." }
    status: unverified
  - id: endo.L07.003
    kind: card
    topic: apoplexy
    front: Which hormone deficiency is the most serious in pituitary apoplexy, and why?
    back: Cortisol deficiency, because it can cause life-threatening hypotension.
    src: { page: 111, quote: "It results in hypopituitarism, but cortisol deficiency is the most serious amongst all hormone deficiencies because it can cause life-threatening hypotension." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.004
    kind: enumerate
    topic: apoplexy
    prompt: Which conditions are associated with pituitary apoplexy?
    points: [Trauma, Hypertension, Cardiac surgery, Dynamic pituitary function tests, Many other conditions]
    pass: 4
    hook: "الـ apoplexy بييجي مع 5: «خبطة، ضغط، عملية قلب، اختبارات النخامية، وحاجات تانية كتير»."
    src: { page: 112, quote: "Cardiac surgery.\nDynamic pituitary function tests.\nA large number of other conditions." }
    status: unverified
  # ---------- p112-113: apoplexy clinical and treatment ----------
  - id: endo.L07.005
    kind: enumerate
    topic: apoplexy
    prompt: The usual triad of pituitary apoplexy.
    points: [Sudden severe headache, Diplopia, Features of hypopituitarism]
    pass: 3
    hook: "ثلاثي الـapoplexy «راس، عين، غدة»: headache مفاجئ وشديد، diplopia، وfeatures of hypopituitarism."
    src: { page: 112, quote: "The usual triad for apoplexy is:\n  Sudden severe headache.\n  Diplopia.\n  Features of hypopituitarism." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.006
    kind: enumerate
    topic: apoplexy
    prompt: Symptoms and signs of pituitary apoplexy, evolving over hours or days.
    points: [Sudden severe headache, Visual field defects and visual loss, Nausea and vomiting, Focal neurological deficit, "Altered consciousness, confusion, coma", Shock]
    pass: 5
    hook: "الـ apoplexy 6: «صداع مفاجئ جامد، نظر بيروح (field defects وvisual loss)، رجّيع، عجز عصبي بؤري، وعي ملخبط لحد coma، وshock»."
    src: { page: 112, quote: "Symptoms and signs may evolve over several hours or days and include:\n  Sudden onset of severe headache.\n  Visual field defects and visual loss.\n  Nausea and vomiting.\n  Focal neurological deficit.\n  Altered conscious level, confusion and even coma.\n  Shock." }
    status: unverified
  - id: endo.L07.007
    kind: card
    topic: apoplexy
    front: What is the differential diagnosis of pituitary apoplexy, and how is it settled?
    back: Subarachnoid haemorrhage and bacterial meningitis; brain imaging identifies the pituitary problem.
    src: { page: 112, quote: "Differential Diagnosis\n  Subarachnoid hemorrhage and\n  Bacterial meningitis This will require imaging of the brain and should identify a pituitary problem." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.008
    kind: card
    topic: apoplexy
    front: Supportive treatment in pituitary apoplexy?
    back: Close observation of vital functions and blood glucose every 1-2 hours; treat cardiovascular collapse with hydrocortisone 100 mg IV every 6 hours in normal saline.
    src: { page: 113, quote: "Treatment of cardiovascular collapse by giving hydrocortisone 100 mg iv every six hours in normal saline." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L07.009
    kind: card
    topic: apoplexy
    front: In hypopituitarism after apoplexy, why must glucocorticoid come before thyroxine?
    back: Thyroxine raises the metabolic rate and would worsen the cardiovascular collapse if cortisol is still lacking.
    src: { page: 113, quote: "If thyroxine is to be given it must be given after the administration of glucorticoids, to avoid exacerbation of the cardiovascular collapse after correction of the metabolic rate." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.010
    kind: card
    topic: apoplexy
    front: When is early transsphenoidal surgery favoured in apoplexy, and when may it add nothing?
    back: Favoured with visual acuity or field abnormalities (better recovery). With no visual deficit, or one resolving spontaneously, early surgery may not improve neuro-ophthalmic or endocrine outcome over conservative care.
    src: { page: 113, quote: "Routine early transsphenoidal surgery, especially when there are visual acuity or visual field abnormalities, as recovery is greater." }
    status: unverified
  - id: endo.L07.011
    kind: card
    topic: apoplexy
    front: What follow-up do apoplexy patients need once stable?
    back: Full endocrine investigation for hormone replacement, and lifelong follow-up.
    src: { page: 113, quote: "Once these patients are stable, they will require a full endocrine investigation to assess the requirement of hormone replacement, and life- long follow-up will be required." }
    status: unverified
  - id: endo.L07.012
    kind: order
    topic: apoplexy
    prompt: Order the treatment steps for pituitary apoplexy as the lecture lists them on page 113.
    steps: [Hydrocortisone 100 mg IV 6-hourly in saline, "Thyroxine only after glucocorticoids", Transsphenoidal surgery if visual deficit, Full endocrine work-up and lifelong follow-up]
    src: { page: 113, quote: "Treatment of cardiovascular collapse by giving hydrocortisone 100 mg iv every six hours in normal saline.\nIt is highly probable for other pituitary hormone deficiencies to be manifested.\nIf thyroxine is to be given it must be given after the administration of glucorticoids, to avoid exacerbation of the cardiovascular collapse after correction of the metabolic rate.\nRoutine early transsphenoidal surgery, especially when there are visual acuity or visual field abnormalities, as recovery is greater.\nSome studies have found that, in patients in whom there is no visual deficit, or the deficit is resolving spontaneously, early surgical intervention does not offer any improvement in outcomes in terms of final neuro-ophthalmological defect or endocrine deficiencies compared with conservative management.\nOnce these patients are stable, they will require a full endocrine investigation to assess the requirement of hormone replacement, and life- long follow-up will be required." }
    status: unverified
  - id: endo.L07.013
    kind: mcq
    topic: apoplexy
    stem: A 52-year-old man with a known macroadenoma has a sudden thunderclap headache, diplopia and BP 82/50 mmHg. What should you give first?
    options: [Hydrocortisone 100 mg IV, Levothyroxine IV, Bromocriptine, Nimodipine]
    answer: 0
    why:
      - "Correct: cortisol deficiency causes the life-threatening hypotension; hydrocortisone 100 mg IV 6-hourly."
      - "Thyroxine before steroids can worsen the collapse."
      - "Not part of the lecture's emergency treatment."
      - "That is subarachnoid haemorrhage treatment; imaging will show the pituitary cause."
    src: { page: 113, quote: "Treatment of cardiovascular collapse by giving hydrocortisone 100 mg iv every six hours in normal saline." }
    status: unverified
  # ---------- p113-115: myxedema coma ----------
  - id: endo.L07.014
    kind: card
    topic: myxedema
    front: Define myxedema coma.
    back: Severe hypothyroidism with depressed mental status, hypothermia and reduced function of other organs; an emergency with high mortality.
    src: { page: 113, quote: "Myxedema Coma\n  Myxedema coma is a medical emergency with a high mortality rate.\n  It is defined as severe hypothyroidism with:\n    Depressed mental status.\n    Hypothermia.\n    Reduced function of other organs.\n  Early diagnosis of myxedema coma is important.\n  Myxedema means puffiness of the limbs and face which is due to abnormal deposits of mucin in the skin and other tissues." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.015
    kind: card
    topic: myxedema
    front: What does "myxedema" mean?
    back: Puffiness of the limbs and face from abnormal mucin deposits in the skin and other tissues.
    src: { page: 113, quote: "Myxedema Coma\n  Myxedema coma is a medical emergency with a high mortality rate.\n  It is defined as severe hypothyroidism with:\n    Depressed mental status.\n    Hypothermia.\n    Reduced function of other organs.\n  Early diagnosis of myxedema coma is important.\n  Myxedema means puffiness of the limbs and face which is due to abnormal deposits of mucin in the skin and other tissues." }
    status: unverified
  - id: endo.L07.016
    kind: enumerate
    topic: myxedema
    prompt: Historical clues to myxedema coma.
    points: [Thyroid surgery, Radioactive iodine, Poor compliance with thyroid hormone]
    pass: 3
    hook: "الـ myxedema coma اسأل عن 3: «اتشالت درقيته، أخد radioactive iodine، أو مش منتظم على الدوا»."
    src: { page: 114, quote: "Clues to Myxedema Coma\n  Previous history of:\n    Thyroid surgery.\n    Administration of radioactive iodine.\n    Poor compliance to treatment with thyroid hormone." }
    status: unverified
  - id: endo.L07.017
    kind: enumerate
    topic: myxedema
    prompt: Clinical features of myxedema coma.
    points: [Depressed mental state, Bradycardia, Hypothermia, "Hypotension (prognostic)", "Type 2 respiratory failure (↓O2, ↑CO2)"]
    pass: 5
    hook: "الـmyxedema coma = «كله واطي وبطيء» 5: الوعي (depressed mental state)، النبض (bradycardia)، الحرارة (hypothermia)، الضغط (hypotension، وده prognostic)، والنفس (type 2 respiratory failure: ↓O2، ↑CO2)."
    src: { page: 114, quote: "Clinical Features\n  A depressed mental state.\n  Bradycardia.\n  Hypothermia.\n  Hypotension (has prognostic significance).\n  Type 2 respiratory failure (↓ O2 and ↑ CO2).\n  Despite the name myxedema coma, patients present with:\n    Reduced consciousness.\n    Confusion.\n    Psychosis, etc." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.018
    kind: card
    topic: myxedema
    front: Are patients with "myxedema coma" usually comatose?
    back: No; they usually have reduced consciousness, confusion or psychosis rather than coma.
    src: { page: 114, quote: "Rather than a comatose state." }
    status: unverified
  - id: endo.L07.019
    kind: cloze
    topic: myxedema
    text: "In myxedema coma, {{c1::hyponatraemia}} is seen in at least {{c2::50%}}; {{c3::hypoglycaemia}} is another common feature."
    src: { page: 114, quote: "Investigations\n  Hyponatremia is common and seen in at least 50% of the patients.\n  Any patient with a low serum sodium and normal volume status should be suspected of having an underactive thyroid.\n  Hypoglycemia is another common feature.\n  Blood should be drawn for\n    Thyroid stimulating hormone (TSH).\n    Free T4.\n    Cortisol." }
    status: unverified
    tags: [numbers]
  - id: endo.L07.020
    kind: card
    topic: myxedema
    front: Which patients with hyponatraemia should make you suspect hypothyroidism?
    back: Any patient with a low serum sodium and normal volume status.
    src: { page: 114, quote: "Investigations\n  Hyponatremia is common and seen in at least 50% of the patients.\n  Any patient with a low serum sodium and normal volume status should be suspected of having an underactive thyroid.\n  Hypoglycemia is another common feature.\n  Blood should be drawn for\n    Thyroid stimulating hormone (TSH).\n    Free T4.\n    Cortisol." }
    status: unverified
  - id: endo.L07.021
    kind: card
    topic: myxedema
    front: Which bloods are drawn in suspected myxedema coma, and which extra test is considered?
    back: TSH, free T4 and cortisol; a short synacthen test if possible, since hypoadrenalism may coexist, especially with secondary (pituitary) hypothyroidism.
    src: { page: 115, quote: "If possible, a short synacthen test should be considered, as coexisting hypoadrenalism is a possibility, particularly so in secondary hypothyroidism due to a pituitary cause." }
    status: unverified
  - id: endo.L07.022
    kind: table
    topic: myxedema
    title: Treatment of myxedema coma
    columns: [Element, Detail]
    rows:
      - [Start, Quickly when suspicion is high]
      - [Thyroid hormone, "T4 200-400 µg/day IV + T3 10 µg three times a day IV"]
      - [Dose adjustment, "Higher for the young, obese and low cardiac risk"]
      - [Steroid cover, "Hydrocortisone 100 mg 8-hourly until hypoadrenalism is excluded"]
      - [Supportive, "Careful warming, correct bradycardia, hypotension (BP and respiration), hyponatraemia; treat the cause"]
    blanks: [[1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 115, quote: "Treatment\n  When clinical suspicion is high, treatment should be initiated quickly.\n  Treatment is preferably with a combination of T4 and T3.\n  The dose of T4 is between 200 μg and 400 μg per day iv and the dose of T3 is 10 μg three times a day iv.\n  The young, obese and those with less likely cardiac risk should receive a higher dose than their counterparts.\n  Give steroid cover in the form of hydrocortisone 100 mg every eight hours until hypoadrenalism is excluded.\n  The crucial aspect of the management of this condition is supportive treatment by correction of:\n    Hypothermia by careful warming.\n    Bradycardia.\n    Hypotension by supporting abp and respiration.\n    Hyponatremia.\n  Supportive treatment also includes treating the underlying disease." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L07.023
    kind: card
    topic: myxedema
    front: What is the crucial aspect of managing myxedema coma, according to the lecture?
    back: Supportive treatment, correcting hypothermia (careful warming), bradycardia, hypotension (BP and respiratory support) and hyponatraemia, and treating the underlying disease.
    src: { page: 115, quote: "Treatment\n  When clinical suspicion is high, treatment should be initiated quickly.\n  Treatment is preferably with a combination of T4 and T3.\n  The dose of T4 is between 200 μg and 400 μg per day iv and the dose of T3 is 10 μg three times a day iv.\n  The young, obese and those with less likely cardiac risk should receive a higher dose than their counterparts.\n  Give steroid cover in the form of hydrocortisone 100 mg every eight hours until hypoadrenalism is excluded.\n  The crucial aspect of the management of this condition is supportive treatment by correction of:\n    Hypothermia by careful warming.\n    Bradycardia.\n    Hypotension by supporting abp and respiration.\n    Hyponatremia.\n  Supportive treatment also includes treating the underlying disease." }
    status: unverified
  - id: endo.L07.024
    kind: cloze
    topic: myxedema
    text: "Despite aggressive treatment, around {{c1::a third}} of patients with myxedema coma die."
    src: { page: 115, quote: "In spite of aggressive treatment with thyroid hormone replacement, supportive care and other measures, around a third may succumb to the illness." }
    status: unverified
    tags: [numbers]
  - id: endo.L07.025
    kind: mcq
    topic: myxedema
    stem: A 74-year-old woman who stopped levothyroxine after radioiodine is brought in drowsy with temperature 34°C, pulse 46, BP 85/50, Na 122 mmol/L and PaCO2 62 mmHg. Besides IV T4 and T3, what must be given until adrenal insufficiency is excluded?
    options: [Hydrocortisone 100 mg 8-hourly, Fludrocortisone, Hypertonic saline 3%, Rapid active external rewarming]
    answer: 0
    why:
      - "Correct: steroid cover until hypoadrenalism is excluded."
      - "Mineralocorticoid is not the lecture's cover."
      - "The book corrects hyponatraemia as supportive care but names no hypertonic saline."
      - "The book says careful warming, not rapid."
    src: { page: 115, quote: "Treatment\n  When clinical suspicion is high, treatment should be initiated quickly.\n  Treatment is preferably with a combination of T4 and T3.\n  The dose of T4 is between 200 μg and 400 μg per day iv and the dose of T3 is 10 μg three times a day iv.\n  The young, obese and those with less likely cardiac risk should receive a higher dose than their counterparts.\n  Give steroid cover in the form of hydrocortisone 100 mg every eight hours until hypoadrenalism is excluded.\n  The crucial aspect of the management of this condition is supportive treatment by correction of:\n    Hypothermia by careful warming.\n    Bradycardia.\n    Hypotension by supporting abp and respiration.\n    Hyponatremia.\n  Supportive treatment also includes treating the underlying disease." }
    status: unverified
  - id: endo.L07.026
    kind: mcq
    topic: myxedema
    stem: Which feature of myxedema coma has prognostic significance?
    options: [Hypotension, Hyponatraemia, Hypoglycaemia, Facial puffiness]
    answer: 0
    why:
      - "Correct, as stated in the lecture."
      - "Common (50%) but not named as prognostic."
      - "Common, not named as prognostic."
      - "That is what myxedema means, not a prognostic sign."
    src: { page: 114, quote: "Clinical Features\n  A depressed mental state.\n  Bradycardia.\n  Hypothermia.\n  Hypotension (has prognostic significance).\n  Type 2 respiratory failure (↓ O2 and ↑ CO2).\n  Despite the name myxedema coma, patients present with:\n    Reduced consciousness.\n    Confusion.\n    Psychosis, etc." }
    status: unverified
  # ---------- p115-118: thyroid storm ----------
  - id: endo.L07.027
    kind: enumerate
    topic: storm
    prompt: Enumerate the precipitating events of thyroid storm.
    points: [Surgery, Sepsis, Burns, Diabetic ketoacidosis, Cardiovascular accident, Parturition, Status epilepticus, I-131 treatment, Iodinated contrast]
    pass: 7
    hook: "الـthyroid storm بيولّع من 9 = 3 تلاتات: «جسم مضروب» surgery، sepsis، burns؛ «أزمات» DKA، cardiovascular accident، status epilepticus؛ «ولادة وإشعاع وصبغة» parturition، I-131 treatment، iodinated contrast. 3 × 3 = 9."
    src: { page: 116, quote: "Diabetic ketoacidosis.\nCardiovascular accident.\nParturition.\nStatus epilepticus.\nI131 treatment.\nIodinated contrast dyes." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.028
    kind: card
    topic: storm
    front: Does thyroxine overdose cause thyroid storm? What is the proposed pathogenesis?
    back: No. Pathogenesis is unclear; acute discharge of T4 and T3 from the gland and inhibition of their binding to globulin are implicated.
    src: { page: 116, quote: "Pathogenesis\n  Thyroxine overdose does not cause thyroid storm.\n  The pathogenesis remains unclear.\n  The following factors are implied:\n    Acute discharge of T4 and T3 from the thyroid gland and\n    Inhibition of T4/T3 to binding globulin." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.029
    kind: enumerate
    topic: storm
    prompt: Clinical features of thyroid storm.
    points: ["Fever (38.5°C)", Tachycardia out of proportion to the fever, Confusion, Agitation, Nausea and vomiting, Hypertension, Congestive cardiac failure]
    pass: 6
    hook: "الـstorm 7 «سخن، قلب، مخ، بطن»: fever (38.5°C)؛ tachycardia أكتر من الحرارة، hypertension، congestive cardiac failure؛ confusion، agitation؛ وnausea وvomiting. 1 + 3 + 2 + 1 = 7."
    src: { page: 116, quote: "Clinical Features\n  The clinical features are usually those of thyrotoxicosis but are more severe, and include:\n    Fever (38.5°C).\n    Tachycardia out of proportion to the fever.\n    Confusion.\n    Agitation.\n    Nausea and vomiting.\n    Hypertension.\n    Congestive cardiac failure." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.030
    kind: card
    topic: storm
    front: Which investigations support thyroid storm?
    back: Thyrotoxic biochemistry (↓TSH, ↑T3, ↑T4) plus raised ALT, alkaline phosphatase and bilirubin.
    src: { page: 117, quote: "Increased alanine transaminase,\nIncreased alkaline phosphatase and\nIncreased bilirubin." }
    status: unverified
  - id: endo.L07.031
    kind: enumerate
    topic: storm
    prompt: The three treatment principles in thyroid storm.
    points: [Decrease production and release of thyroid hormones, Block the effects of circulating T4 and T3, Deal with the precipitant]
    pass: 3
    hook: "العاصفة الدرقية 3: «اقفل المصنع (production وrelease)، اكسر اللي في الدم (block T4 وT3)، وعالج اللي فجّرها»."
    src: { page: 117, quote: "The treatment principles are to:\n  Decrease the production and release of thyroid hormones,\n  Block the effects of circulating t4 and t3.\n  Deal with the underlying precipitants.\n  To block the thyroid hormone synthesis:\n  Intravenous methimazole 20 mg every 4–6 hours until the patient is able to take oral carbimazole 30 mg twice daily, or\n  Propylthiouracil 200 mg every 4 hours (orally or via nasogastric tube) as it will also block T4 to T3 conversion." }
    status: unverified
  - id: endo.L07.032
    kind: table
    topic: storm
    title: Drugs in thyroid storm (book doses)
    columns: [Aim, Drug and dose]
    rows:
      - [Block synthesis, "Methimazole 20 mg IV 4-6-hourly, then carbimazole 30 mg twice daily; or PTU 200 mg 4-hourly (oral/NG)"]
      - [Block T4 to T3 / release, "Lugol's iodine 0.3 ml in 50 ml 8-hourly for 5 days"]
      - [If iodine allergy, "Lithium carbonate 300 mg 6-hourly, target 1 mmol/l"]
      - [Steroids, "Dexamethasone 4 mg or hydrocortisone 100 mg four times daily IV"]
      - [β-blocker, "Propranolol 80 mg three times daily, or 1 mg/min IV to pulse 100"]
      - [If β-blocker contraindicated, "Calcium-channel blockers or digoxin"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 117, quote: "Both drugs can also be given per rectum.\n  To block the conversion of T4 to T3:\n  Lugol's iodine: 0.3 ml diluted to 50 ml every 8 hours given orally or via nasogastric tube for 5 days.\n  Sodium iodide was used previously intravenously, but sterile forms are no longer available.\n  If patients are allergic to iodine, use instead lithium carbonate 300 mg every 6 hours, with twice daily lithium levels checked until a therapeutic dose of 1 mmol/l is attained.\n  Intravenous steroids: dexamethasone 4 mg four times daily or hydrocortisone 100 mg four times daily." }
    update:
      text: "Give iodine (Lugol's or potassium iodide) at least 1 hour after the first thionamide dose (methimazole or PTU), so the gland cannot use it as substrate for new hormone and worsen the storm. In the exam give the book's drugs and doses."
      ref: "Ross et al., American Thyroid Association guidelines for hyperthyroidism and other causes of thyrotoxicosis, Thyroid 2016"
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L07.033
    kind: card
    topic: storm
    front: Why is PTU an option in thyroid storm, and how else can antithyroid drugs be given?
    back: Besides blocking synthesis, PTU also blocks T4 to T3 conversion. Both methimazole and PTU can be given per rectum.
    src: { page: 117, quote: "The treatment principles are to:\n  Decrease the production and release of thyroid hormones,\n  Block the effects of circulating t4 and t3.\n  Deal with the underlying precipitants.\n  To block the thyroid hormone synthesis:\n  Intravenous methimazole 20 mg every 4–6 hours until the patient is able to take oral carbimazole 30 mg twice daily, or\n  Propylthiouracil 200 mg every 4 hours (orally or via nasogastric tube) as it will also block T4 to T3 conversion." }
    status: unverified
  - id: endo.L07.034
    kind: card
    topic: storm
    front: Why is IV sodium iodide not used now in thyroid storm?
    back: Sterile forms are no longer available.
    src: { page: 117, quote: "Both drugs can also be given per rectum.\n  To block the conversion of T4 to T3:\n  Lugol's iodine: 0.3 ml diluted to 50 ml every 8 hours given orally or via nasogastric tube for 5 days.\n  Sodium iodide was used previously intravenously, but sterile forms are no longer available.\n  If patients are allergic to iodine, use instead lithium carbonate 300 mg every 6 hours, with twice daily lithium levels checked until a therapeutic dose of 1 mmol/l is attained.\n  Intravenous steroids: dexamethasone 4 mg four times daily or hydrocortisone 100 mg four times daily." }
    status: unverified
  - id: endo.L07.035
    kind: card
    topic: storm
    front: Supportive treatment in thyroid storm, and which antipyretic is avoided?
    back: Vigorous fluids if appropriate, external cooling, paracetamol, HDU care (consider ICU). Avoid salicylates; they inhibit thyroid hormone binding and can worsen the storm.
    src: { page: 118, quote: "If β-blockers are contraindicated, the possible alternatives would include calcium channel blockers or digoxin.\nSupportive treatment may include:\n  Vigorous fluid resuscitation if appropriate.\n  External cooling.\n  Paracetamol for pyrexia.\n  Salicylates should be avoided as they inhibit thyroid hormone binding and can worsen the thyroid storm.\n  Patients should ideally be managed in a medical high- dependency unit and intensive care unit should be considered." }
    status: unverified
    tags: [high-yield]
  - id: endo.L07.036
    kind: mcq
    topic: storm
    stem: A woman with untreated Graves' disease has an emergency caesarean section. Six hours later she has temperature 39.6°C, pulse 160, agitation and vomiting. For fever, which drug should be avoided?
    options: [Aspirin, Paracetamol, External cooling, Propranolol]
    answer: 0
    why:
      - "Correct: salicylates displace thyroid hormone from binding proteins and worsen the storm."
