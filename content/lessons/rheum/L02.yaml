            why: "الـ non-steroidal anti-inflammatory drugs (NSAID) ممنوع (CKD 4، PUD، asthma). الـ colchicine خطر: CKD 4 + verapamil + simvastatin (interactions). الـ allopurinol والـ febuxostat urate-lowering therapy (ULT) مش علاج نوبة. يبقى steroid."
