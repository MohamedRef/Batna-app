    front: What is an unblinded (open label) study?
    back: A study with no attempt at blinding.
    src: { page: 44, quote: "Blinding (or masking):\n  Triple blinding: neither subject, observer or person analysing the data have any information about allocation of the subject to treatment or comparison groups\n  Unblinded or open label studies: no attempt at blinding" }
