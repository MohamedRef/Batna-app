        quote: "Metavir: *Common for biopsy results*. Assigns two scores\n1. Activity or prediction of progression:\n  A0: no activity\n  A1: mild activity\n  A2: moderate activity\n  A3: severe activity\n2. Fibrosis level:\n  F0: no fibrosis\n  F1: portal fibrosis without septa\n  F2: portal fibrosis with infrequent septa\n  F3: numerous septa but no cirrhosis\n  F4: cirrhosis\nLast stage before cirrhosis: A3F3"
