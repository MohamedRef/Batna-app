    src: { page: 144, quote: "Table 1: Definitions of selected terms used in the recommendations for PAN\n| Term | Definition |\n|---|---|\n| Disease states | |\n| Suspected disease | Clinical signs and/or symptoms suggestive of PAN and not explained by other conditions |\n| Active disease | New, persistent, or worsening clinical signs and/or symptoms attributed to PAN and not related to prior damage |\n| Severe disease | Vasculitis with life- or organ-threatening manifestations (e.g., renal disease, mononeuritis multiplex, muscle disease, mesenteric ischemia, coronary involvement, limb/digit ischemia) |\n| Nonsevere disease | Vasculitis without life- or organ-threatening manifestations (e.g., mild systemic symptoms, uncomplicated cutaneous disease, mild inflammatory arthritis) |\n| Remission | Absence of clinical signs or symptoms attributed to PAN, on or off immunosuppressive therapy |\n| Refractory disease | Persistent active disease despite an appropriate course of immunosuppressive therapy |\n| Relapse | Recurrence of active disease following a period of remission |\n| Treatments | |\n| IV pulse GCs | IV methylprednisolone 500-1,000 mg/day (adults) or 30 mg/kg/day (children; maximum 1,000 mg/day) or equivalent for 3-5 days |\n| High-dose oral GCs | Prednisone 1 mg/kg/day (adults; generally up to 80 mg/day) or 1-2 mg/kg/day (children; generally up to 60 mg/day) or equivalent |\n| Moderate-dose oral GCs | Prednisone 0.25-0.5 mg/kg/day (adults; generally 10-40 mg/day) or ~0.5 mg/kg/day (children; generally 10-30 mg/day) or equivalent |\n| Low-dose oral GCs | Prednisone ≤10 mg/day (adults) or ≤0.2 mg/kg/day (children; maximum 10 mg/day) or equivalent |\n| Non-GC immunosuppressive therapy | Azathioprine, cyclophosphamide, methotrexate, mycophenolate mofetil |\nPAN = polyarteritis nodosa; IV = intravenous; GCs = glucocorticoids." }
