- id: res.L20.lesson2
  title: نوع الدراسة في 3 أسئلة، وسؤال PICO(T)
  hook: قبل ما تقرا الـ results، اعرف إنت قدام أنهي نوع دراسة. 3 أسئلة بس هتحسمها.
  minutes: 8
  pages:
  - 12
  - 17
  topics:
  - studytype
  goals:
  - تعرف ليه نوع الدراسة مهم
  - تحدد التصميم بـ 3 أسئلة
  - تفك حروف PICO(T) وتعرف إمتى ينفع
  status: unverified
  steps:
  - kind: explain
    page: 12
    quote: |-
      After introducing the article, it is important to state the type of study because this sets the stage for determining the quality, reliability, and validity of the study as it applies to the clinical domain.
      Participating in a clinical study (intervention or observational) contributes to medical knowledge. The results of these studies can make a difference in the care of future patients by providing information about the benefits and risks of therapeutic, preventative, or diagnostic products or interventions.
      This information is important because it determines:
      The applicability of the study and accuracy in determining whether its results should be taken into consideration in real practice
      Whether its recommendations set the stage for future development of practice guidelines
    title: ليه نحدد نوع الدراسة بدري؟
    text: |-
      نوع الدراسة بيحدد ==quality, reliability, and validity== بتاعتها.

      ومهم كمان لأنه بيحدد:
      - **Applicability**: هل نتايجها تتاخد في الـ real practice؟
      - هل الـ recommendations بتاعتها تبني **practice guidelines** بعدين؟
  - kind: figure
    page: 13
    quote: |-
      To recognize the type of study, one should ask three questions
      1. Aim of the study
      a. To simply describe a population → descriptive
      b. To quantify the relationship between factors (PICO applicable) → analytic
      2. If intervention analytic:
      a. Randomized → randomized controlled trial (RCT)
      b. Non-randomized → Quazi-experimental
      3. If observational analytic, when the outcomes were determined?
      a. Some time after the exposure → prospective cohort
      b. At the same time of the exposure → cross-sectional
      c. Before the exposure was determined → case-control study
    title: 3 أسئلة توصلك للتصميم
    alt: 'A decision tree. Question 1, aim: describe goes to descriptive, quantify a relationship goes to analytic. Analytic splits into intervention and observational. Intervention: randomized goes to
      RCT, non-randomized to quasi-experimental. Observational: outcome after exposure goes to prospective cohort, same time to cross-sectional, before exposure was determined to case-control.'
    caption: 'السؤال الأول: **الهدف** (وصف ولا علاقة؟). التاني: لو intervention، **عشوائي ولا لأ**؟ التالت: لو observational، **النتيجة اتقاست إمتى**؟'
    svg: |
      <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
        <defs><marker id="L20b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
        <g class="t-sm">
        <rect x="115" y="6" width="100" height="26" rx="6" class="fg-ink"/><text x="165" y="24" text-anchor="middle" class="t-b">1. Aim?</text>
        <path d="M140 32L70 58" class="fg-arrow" marker-end="url(#L20b)"/><path d="M190 32L250 58" class="fg-arrow" marker-end="url(#L20b)"/>
        <rect x="10" y="60" width="110" height="26" rx="6" class="fg-box"/><text x="65" y="78" text-anchor="middle">Descriptive</text>
        <rect x="200" y="60" width="110" height="26" rx="6" class="fg-acc"/><text x="255" y="78" text-anchor="middle">Analytic (PICO)</text>
        <path d="M230 86L120 118" class="fg-arrow" marker-end="url(#L20b)"/><path d="M270 86L270 118" class="fg-arrow" marker-end="url(#L20b)"/>
        <rect x="40" y="120" width="120" height="26" rx="6" class="fg-ink"/><text x="100" y="138" text-anchor="middle" class="t-b">2. Intervention</text>
        <rect x="205" y="120" width="120" height="26" rx="6" class="fg-ink"/><text x="265" y="138" text-anchor="middle" class="t-b">3. Observational</text>
        <rect x="10" y="170" width="90" height="40" rx="6" class="fg-good"/><text x="55" y="186" text-anchor="middle">Randomized</text><text x="55" y="202" text-anchor="middle" class="t-b">RCT</text>
        <rect x="104" y="170" width="94" height="40" rx="6" class="fg-box"/><text x="151" y="186" text-anchor="middle">Non-random</text><text x="151" y="202" text-anchor="middle" class="t-b">Quasi-exp.</text>
        <path d="M80 146L55 168" class="fg-arrow" marker-end="url(#L20b)"/><path d="M120 146L150 168" class="fg-arrow" marker-end="url(#L20b)"/>
        <path d="M265 146L265 222" class="fg-arrow" marker-end="url(#L20b)"/>
        <text x="322" y="240" text-anchor="end" class="t-mut">Outcome determined:</text>
        <rect x="10" y="250" width="100" height="44" rx="6" class="fg-box"/><text x="60" y="267" text-anchor="middle">After exposure</text><text x="60" y="284" text-anchor="middle" class="t-b">Prosp. cohort</text>
        <rect x="115" y="250" width="100" height="44" rx="6" class="fg-box"/><text x="165" y="267" text-anchor="middle">Same time</text><text x="165" y="284" text-anchor="middle" class="t-b">Cross-sectional</text>
        <rect x="220" y="250" width="105" height="44" rx="6" class="fg-box"/><text x="272" y="267" text-anchor="middle">Before exposure</text><text x="272" y="284" text-anchor="middle" class="t-b">Case-control</text>
        </g>
      </svg>
  - kind: aside
    tone: trap
    text: 'خلي بالك من الكلمة: السؤال التالت عن **إمتى النتيجة (outcome) اتحددت** بالنسبة للـ exposure. في الـ case-control النتيجة (المرض) معروفة **قبل** ما ندوّر على الـ exposure.'
    page: 13
    quote: |-
      3. If observational analytic, when the outcomes were determined?
      a. Some time after the exposure → prospective cohort
      b. At the same time of the exposure → cross-sectional
      c. Before the exposure was determined → case-control study
  - kind: check
    page: 13
    quote: |-
      2. If intervention analytic:
      a. Randomized → randomized controlled trial (RCT)
      b. Non-randomized → Quazi-experimental
    question: Investigators assign an intervention without randomization. What is the design?
    options:
    - Quasi-experimental
    - Randomized controlled trial
    - Prospective cohort
    - Case series
    answer: 0
    why:
    - 'صح: intervention + non-randomized = quasi-experimental.'
    - الـ RCT لازم randomization.
    - في الـ cohort الباحث مش بيدّي intervention.
    - الـ case series descriptive.
  - kind: mnemonic
    page: 16
    quote: |-
      This includes identifying the
      (P) patients or population studied coupled with
      (I) the intervention performed,
      (C) the comparison used,
      (O) the studied outcomes, and
      (T) the time in which the study was conducted.
    word: PICOT
    parts:
    - key: P
      text: Patients or population studied
    - key: I
      text: The intervention performed
    - key: C
      text: The comparison used
    - key: O
      text: The studied outcomes
    - key: T
      text: The time in which the study was conducted
    hook: مين (P) خد إيه (I) قصاد إيه (C) وحصله إيه (O) وفي قد إيه (T).
  - kind: explain
    page: 16
    quote: |-
      PICO(T)
      The adequate (well-constructed) research question allows for the correct definition of which information (evidence) is needed to solve the clinical research question.
      In approaching an article, especially in the introduction, one should always keep in mind the PICO(T) algorithm.
      The PICO strategy can be used to construct several kinds of research questions, originated from clinical practice.
    title: ليه السؤال المظبوط مهم؟
    text: |-
      السؤال المتبني صح (==well-constructed==) بيحدد بالظبط **أنهي evidence** محتاجها عشان تحل المشكلة الإكلينيكية.

      وإنت بتقرا مقال، **خصوصًا في المقدمة**، خلي الـ PICO(T) في دماغك. الطريقة دي اتوصفت أول مرة بـ **Sackett et al.** كطريقة سريعة وسهلة لأي سؤال أو مقال.
  - kind: explain
    page: 17
    quote: |-
      Within this paradigm, you would introduce the objective and aims of the study.
      This method is easily applied to experimental studies; however, this may be a bit challenging in certain studies. The PICO(T) method is best used in analytic studies. This includes experimental analytic (RCT or controlled trials) and observational analytic studies (cohorts, cross-sectional, case control).
      It would therefore be difficult to apply this method, specifically the intervention aspect of it to non-analytic studies (systematic reviews/meta-analysis, cross-sectional surveys). Therefore, it would only be possible to apply the P and O (patient or population) and outcome.
    title: PICO(T) ينفع مع مين؟
    text: |-
      الـ PICO(T) ==best used in analytic studies==:
      - **Experimental analytic**: RCT أو controlled trials.
      - **Observational analytic**: cohorts، cross-sectional، case-control.

      في الـ **non-analytic** (systematic reviews/meta-analysis، cross-sectional surveys) صعب تطبّق الـ intervention، فبتاخد بس ==P and O==.
  - kind: aside
    tone: exam
    text: سؤال السلايد بيقول إن الـ systematic reviews/meta-analysis بياخدوا P وO بس. ده جواب الامتحان، حتى لو في مراجع تانية بتبني سؤال الـ SR بـ PICO كامل.
  - kind: check
    page: 14
    quote: |-
      PICO(T) applicable studies are:
      A. Descriptive studies
      B. Intervention analytic studies
      C. Observational analytic studies
      D. B and C
      E. All types of studies (analytic and non analytic)
      D
    question: 'PICO(T) applicable studies are:'
    options:
    - Intervention and observational analytic studies
    - Descriptive studies only
    - All types of studies (analytic and non analytic)
    - Systematic reviews only
    answer: 0
    why:
    - 'صح: الإجابة D على السلايد (B and C).'
    - الـ descriptive مفيهاش علاقة بين عوامل.
    - الـ non-analytic بتاخد P وO بس.
    - الـ SR non-analytic هنا.
  - kind: try
    items:
    - res.L20.018
    - res.L20.022
    - res.L20.025
    - res.L20.026
  recap:
  - نوع الدراسة بيحدد الـ quality والـ validity والـ applicability.
  - 'Aim: describe ← descriptive، quantify ← analytic.'
  - 'Intervention: randomized ← RCT، non-randomized ← quasi-experimental.'
  - 'Observational: النتيجة بعد ← prospective cohort، مع ← cross-sectional، قبل ← case-control.'
  - PICOT للـ analytic studies؛ الـ non-analytic بتاخد P وO بس.
