  - id: neph.L09.084
    kind: card
    topic: pd-principles
    front: How big is the peritoneal membrane, and how much of it matters for dialysis?
    back: About one square metre, of which only the visceral part (about 10–15%) is relevant; microvilli and blebs of the mesothelium increase the surface 40-fold.
    src: { page: 311, quote: "Semipermeable membrane is: peritoneam The size of the peritoneum is one square metre, which, compared to the surface of a filter for haemodialysis, is small. In addition, only the visceral parts (representing around 10-15%) are relevant for dialysis. However, the microvilli, small blebs and fingers of the mesothelial surface, increase it by a factor of 40 During the first weeks of dialysis the peritoneum often looses microvilli and to a greater extent the mesothelial cells. EDTNA|ERCA JOURNAL 2005 XXXI 3" }
    status: unverified
    tags: [numbers]
