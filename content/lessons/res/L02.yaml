  - id: res.L02.lesson4
    title: "البانيو: prevalence = incidence × duration"
    hook: "الحنفية بتملا، والبلاعتين بيفضّوا. لو قفلت بلاعة الموت، البانيو هيعمل إيه؟"
    minutes: 10
    pages: [31, 43]
    topics: [prevalence]
    goals:
      - "تفرق بين point وperiod prevalence"
      - "تفرق بين incidence وprevalence في 4 خصائص"
      - "تستخدم P = I × D وتحل أسئلة الـ slides"
    status: unverified
    steps:
      - kind: table
        page: 31
        quote: "Prevalence Rate:\n  Point prevalence = Number of existing cases at a specific point of time / Total midpoint population at risk\n  Period prevalence = Number of existing cases at a specific period of time / Total midperiod population at risk"
        title: "Prevalence rate"
        columns: ["Type", "Numerator", "Denominator"]
        rows:
          - ["Point prevalence", "Existing cases at a specific point of time", "Total midpoint population at risk"]
          - ["Period prevalence", "Existing cases during a specific period", "Total midperiod population at risk"]
        hide: [[0, 1], [1, 1]]
      - kind: explain
        remind: [res.L02.028]
        page: 32
        quote: "They indicate amount of illness requiring care.\nAffected by migration of diseased people.\nEasier to measure than incidence rate."
        title: "الـ prevalence مفيد في إيه؟"
        text: |
          الـ **prevalence** = ==existing cases== (القديم + الجديد) في وقت أو فترة.

          - بيوري **amount of illness requiring care**: كام سرير وكام علبة دوا محتاجين.
          - بيتأثر بـ **migration of diseased people**: لو عيانين الـ dialysis بيروحوا يعيشوا جنب مركز كويس، الـ prevalence هناك بيعلى.
          - ==Easier to measure== من الـ incidence: مسح واحد (cross-sectional) بيكفي، بينما الـ incidence محتاج متابعة.
      - kind: table
        page: 33
        quote: "Difference between Incidence & Prevalence\n| Characteristic | What is measured | Time of disease diagnosis | Period of time | Denominator |\n|---|---|---|---|---|\n| Incidence | Rapidity of disease occurrence | Newly diagnosed | Period of study that allows monitoring disease occurrence | Population at-risk |\n| Prevalence | Proportion of population with disease | Surviving cases diagnosed at any time | Specific time | Whole population |"
        title: "Incidence vs prevalence"
        columns: ["Characteristic", "Incidence", "Prevalence"]
        rows:
          - ["What is measured", "Rapidity of disease occurrence", "Proportion of population with disease"]
          - ["Time of diagnosis", "Newly diagnosed", "Surviving cases diagnosed at any time"]
          - ["Period of time", "Study period that allows monitoring occurrence", "Specific time"]
          - ["Denominator", "Population at risk", "Whole population"]
        hide: [[0, 1], [0, 2], [1, 2], [3, 1], [3, 2]]
      - kind: reveal
        page: 35
        quote: "What is the prevalence of disease in Year 2?\n  What is the numerator? 5 cases in Year 1 + 7 cases in Year 2 = 12\n  What is the denominator? Total sample size = 30\n  Prevalence = 12/30 = 0.4\nThe prevalence of disease in Year 2 is 40%"
        prompt: "نرجع للـ 30 شخص: 5 في سنة 1 و7 في سنة 2. الـ prevalence في سنة 2 كام؟"
        answer: |
          **12/30 = 40%**.

          الـ numerator = **كل** الحالات الموجودة: 5 + 7 = 12.
          الـ denominator = ==whole population== = 30.

          قارن بالـ incidence اللي طلعت 7/25 = 28%: نفس الداتا، سؤالين مختلفين.
      - kind: figure
        page: 40
        quote: "Relationship Between Prevalence and Incidence: Prevalence = Incidence x Duration (avg), P = I x D\n  New/Incident Cases flow into the Prevalence \"Pot\"\n  Out migration: 1) cure (Recovery), 2) death (Mortality)\nNote: Assumes constant incidence (the epidemiologist's bathtub)"
        title: "The epidemiologist's bathtub"
        alt: "A bathtub. A tap above pours water labelled incidence (new cases). The water in the tub is labelled prevalence. Steam rising off the top is labelled recovery, and a drain at the bottom is labelled death (mortality). Below: prevalence equals incidence times average duration, assuming constant incidence."
        caption: "الحنفية = ==incidence==. المية = ==prevalence==. البخار (recovery) والبلاعة (death) بيفضّوا. الـ duration = المية بتقعد قد إيه قبل ما تخرج."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L02b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
              <marker id="L02d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <path d="M40 30h70v30" class="fg-ink" stroke-width="6"/>
            <path d="M110 66v50" class="fg-arrow-acc" marker-end="url(#L02b)"/>
            <text x="120" y="92" class="t-b t-acc">Incidence</text>
            <text x="120" y="108" class="t-sm t-mut">new cases in</text>
            <path d="M232 110c-8-12 8-20 0-32M252 110c-8-12 8-20 0-32M272 110c-8-12 8-20 0-32" class="fg-arrow-acc"/>
            <text x="252" y="64" text-anchor="middle" class="t-b t-good">Recovery</text>
            <text x="252" y="48" text-anchor="middle" class="t-sm t-mut">cure out</text>
            <path d="M40 130h250l-18 100h-214z" class="fg-acc"/>
            <text x="165" y="176" text-anchor="middle" class="t-lg t-b">Prevalence</text>
            <text x="165" y="198" text-anchor="middle" class="t-sm">all existing cases</text>
            <path d="M165 230v40" class="fg-arrow-bad" marker-end="url(#L02d)"/>
            <text x="178" y="256" class="t-b t-bad">Death</text>
            <text x="178" y="272" class="t-sm t-mut">(mortality) out</text>
            <rect x="20" y="300" width="290" height="44" rx="8" class="fg-box"/>
            <text x="165" y="320" text-anchor="middle" class="t-b">P = I × D</text>
            <text x="165" y="336" text-anchor="middle" class="t-sm t-mut">assumes constant incidence</text>
          </svg>
      - kind: figure
        page: 40
        title: "شريحة 40: الـ prevalence pot والبانيو"
        image: { file: res/L02-s40-bathtub.webp, book: true }
        alt: "Slide in two panels. Left, on a dark background, titled Relationship Between Prevalence and Incidence: Prevalence = Incidence x Duration (avg), P = I x D-bar. A red arrow labelled New/Incident Cases goes into a box, the Prevalence Pot, holding horizontal lines from X to X labelled duration; a cyan arrow labelled Out migration, 1) cure, 2) death, leaves it. Note: assumes constant incidence. Right, the epidemiologist's bathtub: a tap dripping drops labelled Incidence into a tub labelled Prevalence, wavy arrows rising from it labelled Recovery, and a drain below spilling into a puddle labelled Death (Mortality)."
        caption: |
          الشريحة فيها رسمتين لنفس المعادلة:

          - **شمال، الـ Prevalence "Pot"**: سهم أحمر **New/Incident Cases** داخل الوعاء، وجوّه خطوط من X لـ X، طول كل خط = الـ **duration** بتاعة الحالة. سهم لبني طالع **Out migration**: يا **cure** يا **death**. فوق مكتوب **P = I × D** (الـ D بشرطة = متوسط الـ duration)، وتحت ملاحظة: الكلام ده لو الـ incidence ثابتة.
          - **يمين، البانيو**: الحنفية بتنقّط **Incidence**، المية في البانيو **Prevalence**، البخار الطالع **Recovery**، والبلاعة تحت بتنزّل **Death (Mortality)**.

          اللي تاخده: الـ prevalence بتزيد لو الـ ==incidence زادت== أو لو الناس ==قعدت أطول== في البانيو (علاج بيمنع الموت من غير ما يشفي)، وبتقل لو الشفا أو الموت بقوا أسرع.
      - kind: explain
        page: 37
        quote: "Prevalence = Incidence x Mean Duration\nExample:\n  Incidence = 10 cases per 1000 population per year\n  Mean Duration of Disease = 5 years\n  Prevalence = 10 x 5 = 50 per 1000 population"
        title: "المعادلة"
        text: |
          ==Prevalence = Incidence × Mean duration==

          مثال slide 37:

          - **Incidence 10 per 1000 per year × duration 5 years = prevalence 50 per 1000**

          وبالعكس:

          - **D = P ÷ I**
      - kind: table
        page: 39
        quote: "Relationship Between Incidence and Prevalence (cont.)\n| Disease | Incidence | Duration | Prevalence |\n|---|---|---|---|\n| Cancer of the pancreas | low | short | low |\n| Common cold | high | short | low |\n| Adult onset diabetes | low | long | high |\n| Essential hypertension | high | long | high |"
        title: "Incidence + duration ← prevalence"
        columns: ["Disease", "Incidence, duration", "Prevalence"]
        rows:
          - ["Cancer of the pancreas", "Low, short", "Low"]
          - ["Common cold", "High, short", "Low"]
          - ["Adult-onset diabetes", "Low, long", "High"]
          - ["Essential hypertension", "High, long", "High"]
        hide: [[0, 2], [1, 2], [2, 2], [3, 2]]
      - kind: aside
        tone: exam
        page: 38
        quote: "Notice the following: Low incidence diseases become important public health problems due to high prevalence. For example, if the incidence of a disease is low but the duration of disease (i.e. until recovery or death) is long (incurable disease and non fatal), the prevalence will be high relative to the incidence. For e.g diabetes"
        text: |
          الـ **duration** هو اللي بيحسم: مرض ==incidence واطي بس مزمن ومبيموتش== (زي الـ diabetes) بيبقى prevalence عالي ومشكلة public health كبيرة. والـ common cold incidence عالي جدًا بس بيخلص في أسبوع، فالـ prevalence واطي.
      - kind: check
        page: 41
        quote: "If a drug prevents mortality but does not affect cure, then which of the following will be true:\n  (a) Incidence will decrease\n  (b) Incidence will increase\n  (c) Prevalence will decrease\n  (d) Prevalence will increase"
        question: "If a drug prevents mortality but does not affect cure, which will be true?"
        options:
          - "Prevalence will increase"
          - "Prevalence will decrease"
          - "Incidence will decrease"
          - "Incidence will increase"
        answer: 0
        why:
          - "صح، ودي إجابة الـ slide: قفلت بلاعة الموت وبلاعة الشفا زي ما هي ← الناس بتعيش أطول بالمرض ← duration بيزيد ← البانيو بيتملي."
          - "ده يحصل لو الدوا بيشفي (بيفتح بلاعة الـ recovery)."
          - "الدوا مش بيمنع حالات جديدة، الحنفية زي ما هي."
          - "مفيش سبب لحالات جديدة أكتر."
      - kind: check
        page: 42
        quote: "P = I * D\n80 = 20 * D\nD = 80/20 = 4 years"
        question: "Incidence 20 per 10,000,000 per year, mortality 4 per 10,000,000, prevalence 80 per 10,000,000. Average duration?"
        options: ["4 years", "5 years", "20 years", "Insufficient data"]
        answer: 0
        why:
          - "صح: D = P/I = 80/20 = 4."
          - "80/4 = 20 و20/4 = 5: الاتنين استخدموا الـ mortality غلط، وهي مش داخلة في المعادلة."
          - "80/4: الـ mortality مش الـ incidence."
          - "P وI كفاية."
      - kind: case
        page: 43
        quote: "The incidence and prevalence rates of pneumococcal pneumonia in children under five years of age in a defined community are illustrated in the following figure (Fig. 5.1 Pneumococcal Pneumonia in Children Under Age Five, rate per 100,000, 1981 to 1991).\nQ 42. Possible conclusions that can be obtained from the data include:\n  (A) Primary prevention is successful due to vaccination\n  (B) The duration of the disease is increasing\n  (C) Incidence is decreasing\n  (D) Recovery from the disease is becoming rapid\n  (E) The rate of recovery remains the same"
        stem: "Pneumococcal pneumonia في أطفال أقل من 5 سنين، 1981-1991: الـ incidence ثابتة تقريبًا حوالي 10 per 100,000، والـ prevalence نازلة من حوالي 50 لأقل من 20."
        steps:
          - question: "With incidence flat, what must have changed to lower the prevalence?"
            options: ["Duration got shorter", "Fewer new cases", "Duration got longer"]
            answer: 0
            why: "P = I × D. الـ I ثابت، فالـ P نزل لأن الـ D قصر."
          - question: "Which conclusion fits the figure?"
            options:
              - "Recovery from the disease is becoming rapid"
              - "Primary prevention by vaccination is succeeding"
              - "Incidence is decreasing"
              - "The rate of recovery remains the same"
            answer: 0
            why: "Duration قصير = الناس بتخف أسرع (أو بتموت أسرع، بس ده مش في الاختيارات). الـ vaccination كانت هتنزّل الـ incidence، وهي ثابتة."
      - kind: figure
        page: 43
        title: "شريحة 43: الـ pneumococcal pneumonia من 1981 لـ 1991"
        image: { file: res/L02-s43-pneumonia.webp, book: true }
        alt: "Line chart, rate per 100,000 on the vertical axis from 0 to 50, years 1981 to 1991 on the horizontal axis. The upper line, labelled Prevalence, falls steadily from about 53 in 1981 to about 10 after 1991. The lower line, labelled Incidence, zigzags between about 6 and 13 with no trend."
        caption: |
          دي الرسمة اللي الـ case فوق مبني عليها:

          - **المحور الرأسي (شمال)**: Rate per 100,000 من 0 لـ 50.
          - **المحور الأفقي (تحت)**: السنين من 1981 لـ 1991.
          - **الخط اللي فوق، Prevalence**: نازل باستمرار من حوالي 53 لحوالي 10.
          - **الخط اللي تحت، Incidence**: بيطلع وينزل بين حوالي 6 و13، من غير اتجاه.

          اللي تاخده: خط الـ incidence ==ثابت== والـ prevalence ==نازلة==، فمن P = I × D الحاجة الوحيدة اللي اتغيرت هي الـ **duration**: العيانين بقوا يخفّوا أسرع.
      - kind: try
        items: [res.L02.027, res.L02.029, res.L02.031, res.L02.033]
    recap:
      - "Prevalence = **existing** cases ÷ whole population، point أو period."
      - "Incidence = سرعة، newly diagnosed، at risk. Prevalence = حجم، surviving cases، whole population."
      - "**P = I × D**، و D = P/I. الـ mortality مش داخلة في المعادلة."
      - "تقفل بلاعة الموت ← prevalence يزيد. تشفي أسرع ← prevalence يقل."
    practice: [res.L02.027, res.L02.028, res.L02.029, res.L02.031, res.L02.032, res.L02.033, res.L02.034, res.L02.035, res.L02.036, res.L02.037, res.L02.079]  # ------------------------------------------------------------------
  - id: res.L02.lesson5
    title: "Secondary attack rate: العدوى في البيت"
    hook: "طفل جاب hepatitis A من الحضانة، وبعد فترة حضانة أخوه وأمه تعبوا. نحسب البيت إزاي من غير ما نعدّ الطفل الأول؟"
    minutes: 6
    pages: [44, 50]
    topics: [secondary]
    goals:
      - "تكتب الـ secondary attack rate (SAR) formula وتعرف تشيل مين من المقام"
      - "تحل أمثلة الـ shigellosis والـ hepatitis A"
    status: unverified
    steps:
      - kind: explain
        page: 44
        quote: "Secondary Attack Rate: SAR = Number of exposed persons developing the disease within the range of the incubation period / Total number of exposed/\"susceptible\" contacts x 100\nThe primary case is excluded from both the numerator and denominator."
        title: "الـ SAR"
        text: |
          الـ **secondary attack rate** بيقيس الحالات الجديدة بين ==contacts== حالة معروفة (الـ primary case). مهم في الأمراض اللي بتنتقل person-to-person: tuberculosis (TB)، measles، shigellosis، varicella.

          - **secondary attack rate (SAR) = exposed persons who develop the disease within the incubation period ÷ total exposed susceptible contacts × 100**

          يعني بتعدّ بس اللي تعبوا ==within the incubation period==، وبتقسم على الـ **susceptible** contacts.

          والقاعدة الذهبية: الـ **primary case** بيطلع من البسط والمقام.
      - kind: aside
        tone: exam
        page: 45
        quote: "Secondary Attack Rate\nThe no. of secondary cases\n----------------------------------- x100\nNo. of susceptibles\nNotice: Incubation period & state of immunity\nare important."
        text: |
          معادلة slide 45: **SAR = secondary cases ÷ susceptibles × 100**، وتحتها تنبيه: ==incubation period & state of immunity are important==.

          ليه؟ لأن حالة ظهرت **بعد** الـ incubation period غالبًا جت من مصدر تاني مش من الـ primary case، فماتتحسبش. واللي عنده **immunity** مش susceptible، فيطلع من المقام.
      - kind: reveal
        page: 46
        quote: "Secondary Attack Rate = Number of cases among contacts of primary cases / Total number of contacts at risk × 100\nA secondary attack rate measures the frequency of new cases of a disease among the contacts of known cases. This can be very important for diseases that are spread from person to person, such as tuberculosis, measles, shigellosis, and varicella.\nE.G., To calculate the number of household contacts (denominator), subtract the number of primary cases from the total number living in the households. Immune individuals should also be subtracted."
        prompt: "مين تاني بيطلع من المقام غير الـ primary case؟ وليه؟"
        answer: |
          الـ ==immune individuals== (متطعمين أو جالهم قبل كده).

          المقام = **susceptibles** بس. اللي مش ممكن يتعدي مالوش مكان فيه. علشان كده slide 45 بيقول إن الـ **incubation period** والـ **state of immunity** مهمين.
      - kind: figure
        page: 46
        quote: "To calculate the number of household contacts (denominator), subtract the number of primary cases from the total number living in the households. Immune individuals should also be subtracted."
        title: "بيت واحد: مين في البسط ومين في المقام"
        alt: "A household. The primary case is excluded from numerator and denominator. An immune contact is excluded from the denominator. Five susceptible contacts form the denominator; two fall ill within one incubation period and are the numerator, so SAR equals 2 over 5, 40 percent. Anyone ill later is from another source and not counted."
        caption: |
          الصورة بتطبّق slide 46 على بيت واحد:

          - **الـ primary case** (الأحمر فوق): بيطلع من البسط والمقام.
          - **الـ immune** (الأخضر): مش ممكن يتعدي، فبيطلع من المقام.
          - الصندوق الملوّن هو ==المقام==: 5 susceptible contacts.
          - اتنين منهم تعبوا ==within one incubation period==، دول البسط: SAR = 2/5 = 40%.
          - اللي تعب بعد كده غالبًا اتعدى من مصدر تاني، فمايتحسبش.

          أول ما تشوف سؤال SAR ارسم البيت ده في دماغك: اطرح الـ primary، اطرح الـ immune، وعدّ اللي تعب في الوقت بس.
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="8" width="314" height="196" rx="10" class="fg-thin"/>
            <text x="165" y="28" text-anchor="middle" class="t-sm t-mut">one household</text>
            <circle cx="44" cy="62" r="13" class="fg-dot-bad"/>
            <text x="66" y="58" class="t-sm t-b">Primary case</text>
            <text x="66" y="74" class="t-sm t-mut">out of top and bottom</text>
            <circle cx="44" cy="108" r="13" class="fg-dot-good"/>
            <text x="66" y="104" class="t-sm t-b">Immune contact</text>
            <text x="66" y="120" class="t-sm t-mut">out of the denominator</text>
            <rect x="20" y="138" width="290" height="58" rx="8" class="fg-acc"/>
            <text x="165" y="156" text-anchor="middle" class="t-sm t-b">Susceptible contacts = denominator</text>
            <circle cx="60" cy="178" r="9" class="fg-dot-acc"/>
            <circle cx="84" cy="178" r="9" class="fg-dot-acc"/>
            <circle cx="108" cy="178" r="9" class="fg-box"/>
            <circle cx="132" cy="178" r="9" class="fg-box"/>
            <circle cx="156" cy="178" r="9" class="fg-box"/>
            <text x="176" y="182" class="t-sm">2 ill of 5</text>
            <text x="14" y="232" class="t-sm"><tspan class="t-b t-acc">ill within one incubation period</tspan></text>
            <text x="14" y="250" class="t-sm">= secondary case, counted on top</text>
            <text x="14" y="276" class="t-sm"><tspan class="t-b">ill later</tspan> = another source,</text>
            <text x="14" y="294" class="t-sm">not counted</text>
            <text x="316" y="276" text-anchor="end" class="t-b t-acc">SAR = 2/5</text>
            <text x="316" y="294" text-anchor="end" class="t-b t-acc">= 40%</text>
          </svg>
      - kind: case
        page: 48
        quote: "Secondary attack rate = The no. of secondary cases / No. of susceptibles x 100\n  No. of susceptibles = 86 – 18 = 68\n  17 / 68 x 100"
        stem: "Shigellosis: 18 شخص في 18 بيت مختلف تعبوا، والقرية 1,000. بعد incubation period، 17 كمان تعبوا في نفس البيوت. الـ 18 بيت فيهم 86 شخص."
        steps:
          - question: "Overall attack rate in the community?"
            options: ["1.8%", "18%", "3.5%"]
            answer: 0
            why: "18/1,000 × 100 = 1.8%."
          - question: "SAR denominator?"
            options: ["68", "86", "69", "1,000"]
            answer: 0
            why: "86 − 18 primary = 68 susceptible contacts."
          - question: "Secondary attack rate?"
            options: ["25%", "19.8%", "94%", "1.7%"]
            answer: 0
            why: "17/68 × 100 = 25%. لو قسمت على 86 (19.8%) نسيت تشيل الـ primary cases."
      - kind: check
        page: 49
        quote: "Example: Seven cases of hepatitis A occurred among 70 children attending a childcare center. Each infected child came from a different family. The total number of persons in the 7 affected families was 32. One incubation period later, 5 family members of the 7 infected children also developed hepatitis A. We will calculate the attack rate in the childcare center and the secondary attack rate among family contacts of those cases.\n1. Attack rate in childcare center:\n  x = cases of hepatitis A among children in childcare center = 7\n  y = number of children enrolled in the childcare center = 70\n  Attack rate = x/y x 100 = 7/70 x 100 = 10%\n2. Secondary attack rate (refer to Figure 1):\n  x = cases of hepatitis A among family contacts of children with hepatitis A = 5\n  y = number of persons at risk in the families (total number of family members – children already infected) = 32 – 7 = 25\n  Secondary attack rate = x/y X 100 = 5/25 X 100 = 20%"
        question: "7 of 70 nursery children get hepatitis A, each from a different family. The 7 families hold 32 people; 5 family members fall ill one incubation period later. Secondary attack rate?"
        options: ["20%", "15.6%", "10%", "7.1%"]
        answer: 0
        why:
          - "صح: at risk = 32 − 7 = 25، و5/25 = 20%."
          - "5/32: نسيت تشيل الأطفال الـ primary."
          - "ده الـ attack rate في الحضانة (7/70)."
          - "5/70: مقام غلط خالص."
      - kind: aside
        tone: trap
        page: 47
        quote: "EXAMPLE: Calculating Secondary Attack Rates\n  Consider an outbreak of shigellosis in which 18 persons in 18 different households all became ill. If the population of the community was 1,000, then the overall attack rate was 18/1,000 × 100 = 1.8%.\n  One incubation period later, 17 persons in the same households as these \"primary\" cases developed shigellosis. If the 18 households included 86 persons, calculate the secondary attack rate."
        text: |
          في الامتحان هتلاقي رقمين: ==عدد البيت كله== و==عدد الـ primary cases==. اطرح دايمًا، وبعدين اسأل نفسك: هل فيه immune مذكورين؟ اطرحهم كمان.
      - kind: explain
        page: 50
        quote: "Recovery Rate = The no. of recoveries from a certain disease in a certain period of time in a certain area / The no. of ill persons in the same period of time and same area x 100"
        title: "Recovery rate"
        text: |
          - **Recovery rate = recoveries from a disease ÷ ill persons in the same period and area × 100**

          يعني نسبة اللي ==خفّوا== من العيانين.

          افتكر البانيو: ده حجم بلاعة الـ **recovery**.
      - kind: try
        items: [res.L02.038, res.L02.039, res.L02.042]
    recap:
      - "SAR = حالات بين الـ contacts خلال الـ incubation period ÷ susceptible contacts × 100."
      - "اطرح الـ primary cases والـ immune من المقام، والـ primary من البسط."
      - "Recovery rate = recoveries ÷ ill persons × 100."
    practice: [res.L02.038, res.L02.039, res.L02.040, res.L02.041, res.L02.042, res.L02.060, res.L02.063, res.L02.064, res.L02.081]  # ------------------------------------------------------------------
  - id: res.L02.lesson6
    title: "الوفيات: crude، specific، fatality، ولا proportionate؟"
    hook: "6000 وفاة في مقاطعة، 1200 منهم leukemia. ده 20%؟ ولا 0.48 per 1000؟ الإجابتين صح، بس لسؤالين مختلفين."
    minutes: 10
    pages: [52, 62]
    topics: [mortality]
    goals:
      - "تفرق بين crude وcause-specific وproportionate وcase fatality بالمقام"
      - "تحسب crude وage-specific وcase fatality من أمثلة السلايدات"
      - "تحل أسئلة الـ slides 61 و62"
    status: unverified
    steps:
      - kind: explain
        remind: [res.L02.055]
        page: 53
        quote: "Table 1-3: Types of Mortality Rates\n| Rate | Formula |\n|---|---|\n| Crude mortality rate | Deaths / Population |\n| Cause-specific mortality rate | Deaths from cause / Population |\n| Case-fatality rate | Deaths from cause / Number of persons with the disease/cause |\n| Proportionate mortality rate (PMR) | Deaths from cause / All deaths |"
        title: "السر كله في المقام"
        text: |
          - **Crude death rate = all deaths ÷ estimated midyear population × 1000**
          - **Age-specific = deaths in an age group ÷ midyear population of that age group × 1000**
          - **Cause-specific = deaths from a disease ÷ total midyear population × 1000**
          - **Proportionate mortality = deaths from a disease ÷ all deaths × 100**
          - **Case fatality = deaths from a disease ÷ people with the same disease × 100**

          البسط في آخر 3 واحد (deaths from a disease). ==المقام== هو اللي بيقولك أنهي rate.
      - kind: explain
        remind: [res.L02.055]
        page: 52
        quote: "Common Mortality rates:\n  Crude death rate\n  Age-specific mortality rate\n  Sex-specific mortality rate\n  Cause-specific mortality rate\n  Proportionate mortality ratio\n  Case fatality rate\n  Fetal death rate\n  Perinatal mortality rate\n  Neonatal mortality rate\n  Infant mortality rate\n  Child mortality rate\n  Under-five mortality rate\n  Maternal mortality ratio"
        title: "13 معدل وفيات في slide واحد"
        text: |
          slide 52 بيعدّ الـ common mortality rates. قسّمهم لعيلتين علشان يتحفظوا:

          - **عامة ومتخصصة**: crude، age-specific، sex-specific، cause-specific، proportionate mortality ratio، ==case fatality rate==.
          - **حوالين الولادة والأمومة**: fetal death، perinatal، neonatal، infant، child، under-five، ==maternal mortality ratio==.

          التقسيم ده من عندنا علشان الحفظ (مش في السلايد): العيلة الأولى مقامها ناس أو وفيات، والتانية مقامها غالبًا **live births**.
