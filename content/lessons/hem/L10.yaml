  - id: hem.L10.lesson3
    title: "تحاليل الـ PV: الـ EPO والـ JAK2 والنخاع"
    hook: "سؤالين بيحلّوا أغلب الحالات: الـ JAK2 إيه؟ والـ EPO قد إيه؟ وكل تحليل تاني له سبب."
    minutes: 9
    pages: [160, 161]
    topics: [pv-tests]
    goals:
      - "تقرأ الـ CBC والـ red cell mass والـ SaO2 وتعرف كل رقم بيقول إيه"
      - "تفهم ليه الـ EPO بيفصل بين PV و secondary"
      - "تعرف شكل النخاع في الـ PV"
    status: unverified
    steps:
      - kind: explain
        page: 160
        title: "الـ CBC والـ red cell mass"
        quote: "Red cell mass (measured using patient RBC labelled with 51Cr) and plasma volume (using 131 I labelled albumin) ."
        text: |
          - **Complete blood count (CBC)**: Red blood cell (RBC) و Hb عاليين، و **mean corpuscular volume (MCV) واطي أو normal** (من الـ iron deficiency).
          - **Neutrophils و platelets** عاليين في الـ polycythaemia vera (PV)، ونادر ده في الـ secondary: لأن الـ PV **trilineage** (ص 156)، والـ secondary بيزوّد الكرات الحمرا بس عن طريق الـ EPO.
          - **Neutrophil alkaline phosphatase (NAP) score** عالي.
          - **Red cell mass** بـ ⁵¹Cr، و **plasma volume** بـ ¹³¹I-albumin. لو ==RCM >25%== فوق المتوقع = diagnostic.
          - **Arterial oxygen saturation (SaO2) <92%** = فكّر في **secondary** (chronic hypoxia).

          وليه الـ MCV واطي؟ التفسير المقبول (مش في الكتاب): المصنع بيعمل كرات كتير جدًا فبيخلّص مخزون الحديد، والفصد بعدين بيشيل حديد أكتر. فتلاقي **كرات كتير صغيرة**.
      - kind: table
        page: 160
        quote: "| | PV | SE | RE |\n| Red cell mass | ↑ | ↑ | ↑ Within NR or N |\n| Plasma volume | N or ↑ | N | Reduced |"
        title: "مين عالي ومين واطي؟"
        columns: [Measure, PV, Secondary, Relative]
        rows:
          - ["Red cell mass", "↑", "↑", "Normal range"]
          - ["Plasma volume", "N or ↑", "N", "Reduced"]
        hide: [[0, 3], [1, 1], [1, 3]]
      - kind: reveal
        page: 160
        quote: "Red cell mass (measured using patient RBC labelled with 51Cr) and plasma volume (using 131 I labelled albumin) ."
        prompt: "ليه نقيس الـ plasma volume كمان، مش الـ red cell mass بس؟"
        answer: |
          لأن الـ Hct **نسبة**: كرات على (كرات + بلازما). ممكن يعلى لو الكرات زادت، أو لو **البلازما قلّت**.

          فالقياسين مع بعض بيقولولك أنهي واحد: في الـ **relative** (و Gaisbock) الـ red cell mass في النطاق الطبيعي والـ plasma volume **reduced**. في الـ PV والـ secondary الـ red cell mass ==عالي فعلًا==.
      - kind: explain
        page: 161
        title: "باقي الـ work-up، كل تحليل ليه؟"
        quote: "Hematinic assay serum ferritin  or normal (esp in PV reflect Fe deficiency anemia), serum vit B12 commonly  in PV due to  transcobalamin reflecting associated granulocytosis. Folate deficiency may occur."
        text: |
          - **Ferritin** واطي أو normal (الـ iron deficiency)، **B12** غالبًا ==عالي== لأن الـ **transcobalamin** عالي من الـ granulocytes الكتير، وممكن **folate deficiency**.
          - **Renal function** (renal impairment)، **uric acid** (غالبًا عالي)، و liver function tests (LFTs) (liver disease).
          - **U/S بطن**: hepatosplenomegaly، وكمان الكلى والحوض. **CT بطن** و **MRI مخ**. **Chest X-ray** و pulmonary function tests (PFTs) لو فيه مرض صدر، و **echo** للـ congenital heart disease.

          ليه الأشعة دي كلها؟ لأنك بتدوّر على أسباب الـ **secondary** اللي هتشوفها آخر المحاضرة: ورم كلى أو أكياس، HCC، cerebellar hemangioma (عشان كده MRI مخ)، مرض صدر، قلب cyanotic. وليه الـ uric acid عالي؟ التفسير المقبول (مش في الكتاب): خلايا كتير بتتعمل وتموت، والـ DNA بتاعها بيتكسر لـ uric acid.
      - kind: explain
        page: 161
        title: "الـ EPO والـ JAK2: الاتنين الأهم"
        quote: "Serum erythropoietin is low/subnormal in PRV , while normal/high in 2ry erythrocytosis."
        text: |
          - ==Serum erythropoietin (EPO)==: **low/subnormal** في الـ PV، **normal/high** في الـ secondary.
          - **Janus kinase 2 (JAK2) V617F**: sensitivity **97%**، specificity تقريبًا **100%** في التفريق بين الـ PV وأي سبب تاني للـ Hct العالي.
          - **Cytogenetics**: **30%** (20q−، +8، +9، 13q−).
          - **BFU-E culture**: الـ progenitors حساسة للـ growth factors، وبتعمل ==endogenous erythroid colonies== من غير EPO.

          ليه الـ EPO بيفصل؟ لأنه هرمون بيشتغل بـ **feedback**: الكلية بتطلّعه لما الأكسجين يقل. في الـ secondary الكلية **شايفة** hypoxia (أو ورم بيطلّعه) فهو عالي. في الـ PV المصنع شغال لوحده والأكسجين كويس، فالكلية بتقفله.
      - kind: figure
        page: 161
        quote: "Serum erythropoietin is low/subnormal in PRV , while normal/high in 2ry erythrocytosis."
        title: "الـ EPO feedback: مين بيدّي الأمر؟"
        alt: "Two loops. Secondary erythrocytosis: hypoxia or an EPO-secreting tumour, the kidney releases EPO, EPO is normal or high, the marrow makes more red cells. Polycythemia vera: the clonal marrow makes red cells on its own, oxygen is plentiful, the kidney switches EPO off, so EPO is low or subnormal."
        caption: "في الـ **secondary** الأمر جاي من فوق (EPO ==عالي==). في الـ **PV** المصنع شغال لوحده، فالكلية بتسكت (EPO واطي)."
