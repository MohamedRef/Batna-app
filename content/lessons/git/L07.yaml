        quote: "Table 2: Differential Diagnosis and Treatment of Acute Lower Gastrointestinal Bleeding\n| Diagnosis | Distinguishing features | Evaluation and treatment |\n|---|---|---|\n| Angiodysplasia, angioectasias, or arteriovenous malformation | Recurrent painless bleeding episodes; patient > 60 years | Colonoscopy with endoscopic argon plasma coagulation. Consider long-term treatment with lanreotide (Somatuline), 120 mg subcutaneously every 4 weeks (adjust dosing for patients with renal or hepatic impairment) |\n| Colon cancer | Slow, chronic blood loss with occasional changes in bowel habit | Colonoscopy with endoscopic therapy (e.g., cautery, banding, clipping, epinephrine injection) to control bleeding. Referral to surgical and oncologic specialists |\n| Diverticular bleeding | Acute, severe, painless bleeding; history of or suspected diverticular disease | Colonoscopy with endoscopic therapy to control bleeding. Consider abdominal CTA to localize the bleeding site |\n| Hemorrhoids | Bleeding associated with bowel movements. External: painful and itchy. Internal: painless, may be itchy | Fiber supplementation (decreases bleeding by 50%); banding or infrared photocoagulation for grades I to III; surgery likely required for symptomatic grade III and grade IV |\n| Infectious colitis | Bloody diarrhea with fever; new or concerning food exposures | Antibiotics based on identified pathogen, except for Shiga toxin-producing Escherichia coli and Salmonella, which are treated with supportive care alone |\n| Inflammatory bowel disease | Bloody diarrhea associated with recurrent abdominal pain and weight loss | Colonoscopy with biopsies to confirm diagnosis. Fecal calprotectin ≥ 250 mcg per g. Rectal 5-aminosalicylic acid derivatives (e.g., mesalamine) |\n| Ischemic colitis | Bloody diarrhea followed by acute lower abdominal pain, especially in patients with cardiac risk factors | Colonoscopy or CTA to confirm diagnosis. Medical management of underlying vascular disease; may require surgery |\n| Postpolypectomy bleeding | Bleeding within 30 days of polypectomy or biopsy | Colonoscopy with endoscopic therapy to control bleeding |\nNote: Colonoscopy should always be preceded by adequate bowel preparation. CTA = computed tomographic angiography"
        text: |
          - **Angiodysplasia:** colonoscopy مع ==argon plasma coagulation==، وممكن **lanreotide 120 mg subcutaneous (SC) كل 4 أسابيع**.
          - **Hemorrhoids:** **fiber** (بيقلل النزيف **50%**)، **banding** أو infrared لـ grades I–III، وجراحة غالبًا لـ III و IV.
          - **Infectious colitis:** antibiotics حسب الميكروب، **ماعدا** Shiga toxin E. coli و **Salmonella**: supportive بس.
          - **IBD:** colonoscopy مع biopsy، calprotectin **≥250 mcg/g**، و rectal **5-ASA**.
          - **Ischemic colitis:** colonoscopy أو CTA، وعلاج الـ vascular disease، وممكن جراحة.

          ليه العلاجات دي؟ التفسير المقبول (مش في الكتاب):
          - الـ **fiber** بيطرّي البراز ويخلّي الحزق أقل، فالضغط على الـ hemorrhoids يقل والنزيف يقل.
          - الـ **Shiga toxin E. coli**: الـ antibiotics ممكن تكسّر البكتيريا فتطلّع toxin أكتر وتزوّد خطر الـ haemolytic uraemic syndrome. والـ **Salmonella** الـ antibiotics ممكن تطوّل حملها في الأمعاء.
          - الـ **lanreotide** (somatostatin analogue) بيقلل الدم الواصل للأوعية الهشة في الـ angiodysplasia.
