  - id: neph.L05.lesson6
    title: "الحكاية والكشف والبول"
    hook: "الحكاية والكشف بيدّوك العنوان، والبول بيأكّده: الـ tubule لسه بيحوّش ولا لأ."
    minutes: 10
    pages: [107, 109]
    topics: [workup, indices]
    goals:
      - "تقرأ علامات الـ prerenal والـ postrenal والـ systemic وتعرف ليه"
      - "تختار التحاليل وتعرف كل واحد بيدوّر على إيه"
      - "تفرّق الـ prerenal من الـ ATN بالـ indices والـ sediment وتعرف ليه"
    status: unverified
    steps:
      - kind: explain
        page: 107
        quote: "Oliguria is a well-recognized and poor prognostic indicator in patients with"
        title: "الـ oliguria: ليه بتقلقنا؟"
        text: |
          الكتاب: الـ **oliguria** poor prognostic indicator، بتصعّب الـ **fluid balance**، والـ **diuretics** بتتدّي كمحاولة إننا نحوّل الـ oliguric لـ non-oliguric.

          التفسير المقبول (مش في الكتاب): لما البول يقل، كل محلول ودوا بتدّيه **بيفضل في الجسم**، **فـ** بسرعة يحصل overload ورئة مليانة مية. تحويله لـ non-oliguric بيسهّل الإدارة **بس** ما بيصلّحش الضرر نفسه، **عشان** كده الـ KDIGO (هنشوفه) مش بيوصي بالـ diuretics إلا للـ volume overload.
      - kind: explain
        remind: [neph.L05.048]
        page: 107
        title: "الحكاية والكشف"
        quote: "Colicky flank pain radiating to the groin suggests acute ureteric obstruction"
        text: |
          - **Prerenal:** ترجيع، إسهال، **glycosuria** بـ polyuria، diuretics/NSAIDs/ACE inhibitor (ACEi)/ARBs. الكشف: orthostatic hypotension، tachycardia، jugular venous pressure واطي، skin turgor قليل، بُق ناشف.
          - **Postrenal:** ==colicky flank pain للـ groin== = ureteric. nocturia و hesitancy = البروستاتا. suprapubic fullness = مثانة كبيرة.
          - راجع ==كل الأدوية==: سبب؟ ومحتاجة dose adjustment؟

          الخطوة الجاية بتشرح **ليه** العلامات دي بتشاور على العنوان.
      - kind: explain
        page: 107
        quote: "Examination : Physical signs of orthostatic hypotension, tachycardia,"
        title: "ليه العلامات دي بتقول prerenal أو postrenal؟"
        text: |
          التفسير المقبول (مش في الكتاب) لعلامات الكتاب:

          - **Orthostatic hypotension و tachycardia:** الأوعية فاضية، **فـ** لما يقف الضغط يقع والقلب يعوّض بالسرعة.
          - **JVP واطي، skin turgor قليل، بُق ناشف:** كلها بتقيس **المية اللي برّه الخلايا**، يعني الـ volume.
          - **Glycosuria بـ polyuria:** السكر بيسحب مية معاه في البول، **فـ** العيان يجف وهو بيعمل بول كتير.
          - **Colicky flank pain للـ groin:** حصوة بتتحرك في الحالب وعضلته بتنقبض عليها.
          - **Suprapubic fullness:** مثانة مليانة مش بتفضى.
      - kind: explain
        page: 108
        quote: "Livedo reticularis and other signs of emboli to the legs."
        title: "علامات في الجسم بتقولك السبب"
        text: |
          الكتاب:

          - **Systemic vasculitis مع GN:** palpable purpura، pulmonary hemorrhage، sinusitis.
          - **Atheroembolic:** livedo reticularis وعلامات emboli في الرجلين.
          - **Rhabdomyolysis:** علامات limb ischemia.
          - **TMA:** **HUS D+** (إسهال وبعدين AKI)، و **TTP** (TMA مع fever و neurological manifestations).

          التفسير المقبول (مش في الكتاب): الأمراض دي **مش مرض كلية** بس، **فـ** بتسيب بصمة في أماكن تانية. الـ vasculitis بتلتهب نفس الأوعية الصغيرة في الجلد والرئة والكلية. الـ cholesterol emboli بتسد شرايين صغيرة في الرجل والكلية مع بعض (غالبًا بعد قسطرة). والـ toxin بتاع الإسهال في الـ HUS بيضرب الـ endothelium في الكلية.
