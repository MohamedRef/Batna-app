  - id: git.L05.lesson4
    title: "تلاقيه، تشيله، وترجع تبص إمتى"
    hook: "كاب على المنظار، snare بارد ولا سخن، وتاتو 3 سنتي. وبعدها: 10 سنين ولا 3 ولا شهرين؟"
    minutes: 10
    pages: [197, 205]
    topics: [detection, polypectomy, surveillance]
    goals:
      - "تعرف الأجهزة اللي بتزوّد الـ adenoma detection"
      - "تمشي في الـ ESGE algorithm بالحجم والـ invasion"
      - "تحفظ فترات الـ ACS surveillance للـ increased و high risk"
    status: unverified
    steps:
      - kind: explain
        page: 197
        quote: "multiple flexible \"arms\" which opens up the field of view by holding back colonic folds during colonoscope withdrawal."
        title: "إزاي ما نفوّتش بوليب"
        text: |
          البوليبات بتستخبى ورا الـ folds. عشان نرفع الـ ==adenoma detection rate==:

          - **ENDOCUFF / ENDOCUFF VISION**: cap فيه arms بتمسك الـ **colonic folds** وانت بتسحب.
          - **RetroView** (PENTAX): منظار رفيع بـ short turn radius وزاوية 210 درجة يشوف ورا الـ folds.
          - **Third Eye**: retrograde view يلاقي ويشيل البوليب المستخبي.
      - kind: explain
        page: 199
        quote: "Hot‖ refers to techniques using the electrosurgery generator unit (ESU) and ―cold‖ means without use of the ESU."
        title: "طرق الـ polypectomy"
        text: |
          - Cold و hot **forceps**.
          - Cold و hot **snare**.
          - **EMR** (endoscopic mucosal resection).
          - **ESD** (endoscopic submucosal dissection).

          ==Hot== = بالـ **electrosurgery generator unit (ESU)**، و cold = من غيره.
      - kind: figure
        page: 201
        quote: "Submucosal injection prior to HSP should be considered to reduce the risk of deep thermal injury."
        title: "ESGE: الشجرة كلها"
        alt: "Decision tree. Superficial colorectal neoplastic polyp, sessile or flat. 5 mm or less and 5 to 9 mm: cold snare en bloc. 10 mm or more: advanced imaging for submucosal invasion. Non-invasive 10 to 19 mm: hot snare, consider submucosal injection. Non-invasive 20 mm or more: en bloc EMR, piecemeal if not feasible, over 40 mm or complex to expert centre. Suspected superficial invasion: tattoo 3 cm distal, expert centre for EMR, ESD or surgery. Suspected deep invasion: tattoo, surgery. Pedunculated: head under 20 and stalk under 10 mm hot snare; otherwise adrenaline or clip then hot snare."
        caption: "تحت 10 mm: cold snare. فوق 10: بص الأول على الـ invasion. Non-invasive: hot snare أو EMR حسب الحجم. Invasion: تاتو، و expert أو جراحة."
        svg: |
          <svg viewBox="0 0 330 520" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="G05d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
