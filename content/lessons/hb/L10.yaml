          - { text: "Acute Budd-Chiari syndrome", bin: 0 }
          - { text: "Fulminant Wilson disease", bin: 0 }
          - { text: "HBV reactivation", bin: 0 }
          - { text: "Ischemic hepatitis", bin: 1 }
          - { text: "Lymphoma", bin: 1 }
          - { text: "Severe alcoholic hepatitis", bin: 1 }
          - { text: "Extensive liver resection", bin: 1 }
        why: "**Primary**: viral، drug/toxin، acute Budd-Chiari، acute autoimmune، pregnancy-related، fulminant Wilson، chronic AIH و chronic Budd-Chiari بصورة acute، و HBV reactivation. **Secondary**: ischemic، systemic diseases (HLH، metabolic، infiltrative، lymphoma، malaria، leptospirosis، rickettsia)، severe alcoholic hepatitis، و extensive resection."
