  # Split from lesson1 on 2026-11-13 (#828): the fears and beliefs, the
  # targets and the physiological insulin profile.
  - id: dm.L11.lesson5
    title: "الخوف من الـ insulin والأهداف"
    hook: "العيان خايف من الإبرة ومن الـ hypo ومن الوزن، ومقتنع إن الـ insulin فشل. نرد على كل واحدة، ونعرف رايحين فين."
    minutes: 8
    pages: [131, 132]
    topics: [barriers, targets]
    goals:
      - "تعرف الـ fears والـ beliefs وترد على كل واحدة بسبب"
      - "تحفظ أهداف ADA Table 6.3 وتعرف ليه الأرقام دي"
      - "توصف الـ physiological insulin profile اللي كل regimen بيقلّده"
    status: unverified
    steps:
      - kind: sort
        page: 132
        quote: "2. Insulin causes complications\n3. Insulin is a personal failure\n4. Adverse impact on relationships/lifestyle"
        prompt: "صنّف كلام العيان: fear ولا belief؟"
        bins: ["Fear", "Belief"]
        cards:
          - { text: "Needles", bin: 0 }
          - { text: "Hypoglycemia", bin: 0 }
          - { text: "Weight gain", bin: 0 }
          - { text: "Insulin is the last option", bin: 1 }
          - { text: "Insulin causes complications", bin: 1 }
          - { text: "Insulin is a personal failure", bin: 1 }
          - { text: "It will ruin my relationships and lifestyle", bin: 1 }
        why: "الـ **fears** تلاتة (needles، hypoglycemia، weight gain). الـ **beliefs** أربعة: last option، complications، personal failure، وأثره على الحياة والعلاقات."
      - kind: explain
        page: 131
        title: "ترد على الـ fears إزاي؟"
        quote: "1. Common Fears:\n      1. Needles\n      2. Hypoglycemia\n      3. Weight gain"
        text: |
          الكتاب بيعدّ الـ fears بس. الردود دي التفسير المقبول (مش في الكتاب)، والفكرة إن كل خوف ليه سبب حقيقي وليه حل:

          - **Needles**: الخوف من إبرة الحقن العضل. إبرة الـ **insulin pen** رفيعة وقصيرة جدًا، وعشان كده الكتاب نفسه بيقول بعد صفحتين إن الـ pens بتزوّد الـ acceptance.
          - **Hypoglycemia**: خوف حقيقي، لأن الـ insulin مالوش سقف. الحل إننا نبدأ بجرعة صغيرة ونزوّد ببطء، ونختار basal **من غير peak**.
          - **Weight gain**: بيحصل لأن السكر اللي كان بيضيع في البول بقى بيدخل الخلايا ويتخزن. عشان كده بنبدأ بالـ basal (==limited weight gain==) ونفضل على metformin.
      - kind: explain
        page: 132
        title: "والـ beliefs: كلها غلط مفهوم"
        quote: "2. Insulin causes complications\n3. Insulin is a personal failure\n4. Adverse impact on relationships/lifestyle"
        text: |
          التفسير المقبول (مش في الكتاب) للأربعة:

          - **Insulin is the last option**: الحقيقة إن Fact 2 بيقول أغلبهم هيحتاجوه، يعني ده خطوة في الطريق مش نهايته.
          - **Insulin causes complications**: الناس شافت قريب بدأ insulin وبعدها عِمي أو اتغسل، فربطوا الاتنين. السبب إنه بدأ **متأخر** بعد سنين سكر عالي، والـ complications كانت ماشية من قبل الحقنة.
          - **Personal failure**: المرض progressive، يعني البنكرياس هو اللي تعب مش العيان.
          - **Lifestyle**: حقنة basal واحدة بالليل غالبًا مش هتغيّر يومه، وده سبب إننا بنبدأ بيها.
      - kind: aside
        tone: joke
        page: 132
        quote: "Insulin is a personal failure"
        text: "العيان: «الـ insulin معناه إني فشلت». انت: «لأ يا حاج، معناه إن البنكرياس طلع معاش بدري، وإحنا بنجيبله بديل.» 😄 الفشل مش بتاع العيان، ده **progressive disease**. وكتير بيفتكروا ==Insulin causes complications== لأنهم شافوا ناس بدأوه متأخر بعد ما الـ complications حصلت."
      - kind: check
        page: 131
        quote: "Thoughts/ concerns about starting insulin:\n  1. Common Fears:\n    1. Needles\n    2. Hypoglycemia\n    3. Weight gain\n    2. Common Beliefs:"
        question: "Which is a common FEAR (not a belief) about insulin?"
        options:
          - "Weight gain"
          - "Insulin is the last option"
          - "Insulin is a personal failure"
          - "Insulin causes complications"
        answer: 0
        why:
          - "صح: needles، hypoglycemia، weight gain = fears."
          - "دي belief."
          - "دي belief."
          - "دي belief."
      - kind: table
        page: 132
        quote: "Table 6.3—Summary of glycemic recommendations for many nonpregnant adults with diabetes\n| Measure | Goal |\n|---|---|\n| A1C | <7.0% (53 mmol/mol)* |\n| Preprandial capillary plasma glucose | 80–130 mg/dL* (4.4–7.2 mmol/L) |\n| Peak postprandial capillary plasma glucose† | <180 mg/dL* (10.0 mmol/L) |"
        title: "الأهداف (ADA Table 6.3)"
        columns: [Measure, Target]
        rows:
          - [A1C, "<7.0% (53 mmol/mol)"]
          - [Preprandial, "80–130 mg/dl"]
          - [Peak postprandial, "<180 mg/dl"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 132
        title: "ليه الأرقام دي بالذات؟"
        quote: "When to initiate insulin therapy:\n    3. Glycemic target"
        text: |
          الكتاب بيقول امتى تبدأ insulin = لما العيان ما يوصلش للـ **glycemic target**، فلازم تعرف الهدف كويس. التفسير المقبول (مش في الكتاب) لكل رقم:

          - **A1C <7%**: تحت الرقم ده الـ microvascular complications بتقل بوضوح، ونزوله أكتر بيجيب hypoglycemia أكتر من الفايدة عند أغلب الكبار.
          - **Preprandial 80–130**: الحد التحتاني ==80== عشان نبعد عن الـ hypo، والفوقاني 130 عشان الصيام هو الأرضية اللي اليوم كله قاعد عليها.
          - **Peak postprandial <180**: قريب من الـ renal threshold، يعني فوقه السكر بيبدأ ينزل في البول.

          وكلمة "**many nonpregnant adults**" في عنوان الجدول معناها إن الحامل والكبير الهش ليهم أهداف تانية.
      - kind: reveal
        page: 132
        quote: "Physiological insulin secretion profile:"
        prompt: "البنكرياس السليم بيطلّع insulin إزاي طول اليوم؟"
        answer: |
          حاجتين فوق بعض:
          - **basal** ثابت وواطي ليل ونهار (يمسك سكر الصيام).
          - **prandial peaks** عالية بعد الفطار والغدا والعشا.

          كل الـ regimens اللي جاية بتحاول تقلّد الشكل ده: الـ basal insulin للخط الثابت، والـ prandial للقمم.
      - kind: figure
        page: 132
        title: "رسمة الكتاب ص 132: الـ insulin الطبيعي"
        image: { file: dm/L11-physiological-profile.webp, book: true }
        alt: "Book chart of plasma insulin over 24 hours from 4:00 to 4:00. Arrows mark breakfast, lunch and dinner, each followed by a tall grey peak. A flat red line runs across the whole day at a low level, under the peaks."
        caption: |
          - **الأسهم السودا**: الفطار والغدا والعشا، وبعد كل واحد **قمة رمادي** = الـ prandial.
          - **الخط الأحمر** اللي ماشي على طول اليوم والليل = ==الـ basal== الثابت.
      - kind: check
        page: 132
        quote: "Physiological insulin secretion profile:"
        question: "In the physiological profile, which part does a once-daily basal insulin copy?"
        options:
          - "The steady low level between meals and overnight"
          - "The peak after breakfast"
          - "The peaks after all three meals"
          - "Neither: basal insulin is only for type 1"
        answer: 0
        why:
          - "صح: الـ basal بيقلّد الخط الثابت اللي بيمسك سكر الصيام وبالليل."
          - "القمة دي شغلة الـ prandial insulin."
          - "القمم كلها prandial، وده اللي هنكثّف بيه بعدين."
          - "الـ basal أول خطوة في الـ type 2 كمان، وده الدرس الجاي."
      - kind: try
        items: [dm.L11.009, dm.L11.010, dm.L11.011, dm.L11.012, dm.L11.013]
    recap:
      - "Fears: needles، hypo، weight؛ كل واحدة ليها حل (pen، جرعة صغيرة و basal من غير peak، metformin)."
      - "Beliefs: last option، complications، failure، lifestyle؛ الـ complications من السنين المتأخرة مش من الحقنة."
      - "Targets: A1C <7%، preprandial 80–130، peak postprandial <180."
      - "الطبيعي = basal ثابت + prandial peaks؛ الـ basal insulin بيقلّد الخط الثابت."
    practice: [dm.L11.009, dm.L11.010, dm.L11.011, dm.L11.012, dm.L11.013]
