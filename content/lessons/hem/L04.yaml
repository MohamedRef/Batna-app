      - kind: figure
        page: 61
        title: "شكل الكتاب ص 61: Blood stem cells بالتفصيل"
        image: { file: hem/L04-stem-cell-chart.webp, book: true }
        alt: "Book chart in coloured bands. Top: pluripotential stem cells split into myeloid stem cells (left) and lymphoid stem cells (right). Myeloid gives progenitor cells, then blast cells: proerythroblast, myeloblast, monoblast; lymphoid gives lymphoblast. Below: erythroblast stages and reticulocyte to erythrocyte; megakaryocyte to platelets; myelocytes and band cells to basophil, eosinophil and neutrophil (granulocytes); promonocyte to monocyte; prolymphocyte to lymphocytes (agranulocytes). The bottom band is formed elements of blood."
        caption: |
          ده الشكل الأصلي اللي الشجرة اللي فوق مختصراه. الشكل **أحزمة ملوّنة**، كل حزام مرحلة، من فوق لتحت:

          - **فوق يمين**: **pluripotential stem cells**، بتطلّع سهمين: ==myeloid stem cells== (الحزام البرتقاني شمال) و **lymphoid stem cells** (المربع الأزرق يمين).
          - **Progenitor cells** ثم **blast cells** (الحزام البنفسجي): proerythroblast، myeloblast، monoblast، و lymphoblast.
          - **تحت الـ myeloblast**: مربعين **myelocytes** و **band cells**، وبعدهم basophil و eosinophil و neutrophil.
          - **الحزام الأحمر تحت (Formed elements of blood)**: erythrocyte، platelets (من الـ megakaryocyte الكبير)، الـ **granulocytes** التلاتة، والـ **agranulocytes** (monocyte و lymphocytes).

          الشكل بيثبت سطر الكتاب: ==كله من الـ myeloid ما عدا الـ lymphocytes==، وإن كل خلية بتعدي على مرحلة **committed** (progenitor) قبل ما تبقى blast.
      - kind: check
        page: 61
        quote: "Blood stem cells\n  1. Myeloid stem\n  2. Lymphoid stem cells\nAll except for lymphocytes arise from myeloid stem cells"
        question: "Which cell does NOT come from the myeloid stem cell?"
        options: ["Lymphocyte", "Monocyte", "Megakaryocyte", "Eosinophil"]
        answer: 0
        why:
          - "صح: الـ lymphocytes بس من الـ lymphoid stem cell."
          - "الـ monocyte myeloid، وبيبقى macrophage في الـ tissues."
          - "الـ megakaryocyte myeloid وبيطلّع platelets."
          - "الـ eosinophil granulocyte، يعني myeloid."
      - kind: table
        page: 62
        quote: "Complete Blood Count (CBC)\n  WBC: White Blood Cells: 4,000 - 10,000 / mm3\n  RBC: Red Blood Cells: 4.2 - 5.9 million / mm3\n  Hb.: Hemoglobin: Males: 14 - 18 g / dL; Females: 12 - 16 g / dL\n  Hematocrit: Males: 40 - 54%; Females: 37 - 47%\n  MCV: Mean Corpuscular Volume: 86 - 98 μm3 / cell\n  MCH: Mean Corpuscular Hemoglobin: 27 - 32 μμg / RBC\n  RDW: Red Cell Distribution Width – 11.5-14.5\n  Platelet Count: 150,000 - 400,000 / mm3\n  WBC Differential:\n    Neutrophils: 40-75%\n    Lymphocytes: 15-45%\n    Monocytes: 1-10%\n    Eosinophils: 1-6%\n    Basophils: 0-2%"
        title: "الـ CBC الطبيعي"
        columns: [Test, Normal]
        rows:
          - ["WBC", "4,000–10,000 /mm³"]
          - ["RBC", "4.2–5.9 million /mm³"]
          - ["Hb", "M 14–18, F 12–16 g/dL"]
          - ["Hct", "M 40–54%, F 37–47%"]
          - ["MCV", "86–98 µm³"]
          - ["MCH", "27–32 pg"]
          - ["RDW", "11.5–14.5"]
          - ["Platelets", "150,000–400,000 /mm³"]
        hide: [[0, 1], [2, 1], [4, 1], [7, 1]]
      - kind: figure
        page: 62
        quote: "Complete Blood Count (CBC)"
        title: "سلايد الكتاب ص 62: الـ CBC كامل بالـ differential"
        image: { file: hem/L04-cbc-normals.webp, book: true }
        alt: "Book slide titled Complete Blood Count (CBC) listing normal values: WBC 4,000 to 10,000 per mm3; RBC 4.2 to 5.9 million per mm3; haemoglobin males 14 to 18, females 12 to 16 g/dL; haematocrit males 40 to 54%, females 37 to 47%; MCV 86 to 98; MCH 27 to 32; RDW 11.5 to 14.5; platelets 150,000 to 400,000 per mm3; WBC differential: neutrophils 40 to 75%, lymphocytes 15 to 45%, monocytes 1 to 10%, eosinophils 1 to 6%, basophils 0 to 2%."
        caption: |
          ده السلايد اللي الجدول اللي فوق ماخد منه، وفيه حتة الجدول ما حطّهاش: **الـ WBC differential** في آخره.

          - **أول 8 سطور**: نفس أرقام الجدول (WBC، RBC، Hb، hematocrit، MCV، MCH، RDW، platelets).
          - **تحت (WBC Differential)**: ==neutrophils 40–75%==، lymphocytes 15–45%، monocytes 1–10%، eosinophils 1–6%، و ==basophils 0–2%==.

          لاحظ الترتيب من فوق لتحت: من الأكتر للأقل. الـ **neutrophils** أغلبية، والـ **basophils** ممكن تبقى صفر وده طبيعي. ودي الأرقام اللي هتقيس عليها كل "-philia" و "-penia" في باقي المحاضرة.
      - kind: figure
        page: 62
        title: "الـ smear قبل وبعد الصبغة (صورة الكتاب ص 62)"
        image: { file: hem/L04-smear-slides.webp, book: true }
        alt: "Book photo of two glass slides with a blood smear spread on each. The left smear is pale pink-orange and unstained; the right smear is purple after staining, with a small dark drop at its base where the blood was placed."
        caption: |
          صورة شريحتين إزاز عليهم **blood smear** (الكتاب في ص 58: "Blood is examined in a smear… Smears are stained"):

          - **الشمال**: smear **من غير صبغة**، لونه برتقاني باهت، ومش هتعرف تميّز الخلايا فيه.
          - **اليمين**: نفس الـ smear **بعد الصبغة**، بقى ==بنفسجي==، والنقطة الغامقة تحت هي مكان نقطة الدم اللي اتفرد منها.

          الصبغة هي اللي بتلوّن ==النواة والـ granules== فتقدر تعدّ وتفرّق الـ WBCs، وده اللي بيطلع منه الـ differential اللي فوق.
      - kind: mnemonic
        page: 62
        quote: "Complete Blood Count (CBC)\n  WBC: White Blood Cells: 4,000 - 10,000 / mm3\n  RBC: Red Blood Cells: 4.2 - 5.9 million / mm3\n  Hb.: Hemoglobin: Males: 14 - 18 g / dL; Females: 12 - 16 g / dL\n  Hematocrit: Males: 40 - 54%; Females: 37 - 47%\n  MCV: Mean Corpuscular Volume: 86 - 98 μm3 / cell\n  MCH: Mean Corpuscular Hemoglobin: 27 - 32 μμg / RBC\n  RDW: Red Cell Distribution Width – 11.5-14.5\n  Platelet Count: 150,000 - 400,000 / mm3\n  WBC Differential:\n    Neutrophils: 40-75%\n    Lymphocytes: 15-45%\n    Monocytes: 1-10%\n    Eosinophils: 1-6%\n    Basophils: 0-2%"
        word: "NLMEB"
        parts:
          - { key: "N", text: "Neutrophils 40–75%" }
          - { key: "L", text: "Lymphocytes 15–45%" }
          - { key: "M", text: "Monocytes 1–10%" }
          - { key: "E", text: "Eosinophils 1–6%" }
          - { key: "B", text: "Basophils 0–2%" }
        hook: "**Never Let Monkeys Eat Bananas**: الترتيب من الأكتر للأقل في الـ differential. والترتيب ده نفسه بيقولك مين الطبيعي يكون غالب: لو الـ lymphocytes بقت أكتر من الـ neutrophils في واحد كبير، فيه حاجة."
      - kind: reveal
        page: 62
        quote: "Differential if ordered: broken down to amount of each type WBC"
        prompt: "الـ WBC الكلي طبيعي. ليه ممكن تحتاج الـ differential برضه؟"
        answer: |
          الكتاب بيقول الـ **differential** بيكسّر الـ WBC لكمية كل نوع، وبيتعمل **لو طلبته**.

          التفسير المقبول (مش في الكتاب): الرقم الكلي ممكن يبقى طبيعي والتوزيع بايظ. مثلًا neutrophils واطية جدًا ومعاها lymphocytes عالية، فالمجموع يطلع في الـ normal range والعيان معرض لعدوى. عشان كده الأرقام اللي بتفرق في المحاضرة دي كلها **absolute counts** لنوع واحد (زي الـ ANC 0.5)، مش الـ WBC الكلي.
      - kind: try
        items: [hem.L04.005, hem.L04.007, hem.L04.011, hem.L04.013, hem.L04.015]
    recap:
      - "Plasma 55%، buffy coat أقل من 1% (WBCs + platelets)، RBCs 45%."
      - "Serum = plasma من غير clotting factors."
      - "Hematopoiesis في الـ red marrow؛ كله من pluripotent stem cell واحدة؛ والخلايا بتكبر برّه الـ sinusoids."
      - "كله من الـ myeloid stem cell ما عدا الـ lymphocytes. الـ committed cells اسمها CFUs وبتعمل نوع واحد."
      - "WBC 4,000–10,000، platelets 150,000–400,000، والـ differential **Never Let Monkeys Eat Bananas**."
