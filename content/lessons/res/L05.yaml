      - kind: order
        page: 41
        quote: "Steps of a cohort study:\n  1. Selection of study subjects\n  2. Obtaining data on exposure\n  3. Selection of a comparison group\n  4. Follow up\n  5. Analysis"
        prompt: "رتّب خطوات الـ cohort study:"
