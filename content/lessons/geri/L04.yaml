        text: |
          الـ ==delirium== هو **acute disorder of attention and cognitive function**.

          وهو **the most frequent complication of hospitalization** عند الكبار، ومشكلة ممكن تبقى devastating.

          ليه أشهر complication في المستشفى؟ التفسير المقبول (مش في الكتاب): المخ الكبير احتياطيه قليل، والمستشفى فيها كل الشرارات مع بعض: مرض حاد، أدوية جديدة، قلة نوم، مكان غريب، catheter. وليه **devastating**؟ لأنه بيطوّل الإقامة وبيزوّد الوفيات (الأرقام في الرسمة الجاية)، وكتير بيعدّي من غير تشخيص.
