      - kind: figure
        page: 56
        title: "Hyperuricemia في الـ CKD: رسمة الكتاب"
        image: { file: neph/L02-hyperuricemia-evaluation.webp, book: true }
        alt: "Book flowchart: patient presenting to nephrology service for CKD evaluation; history, physical exam, serum urate testing, urine testing for pH and urate crystalluria. Three branches. No history of gout, normouricemia (SU under 6 mg/dl in women, under 7 in men): follow, or if low urine pH (under 6) with urate crystalluria, consider urinary alkalinization with bicarbonate or citrate. Asymptomatic hyperuricemia: diet (reduce alcohol, sugar and HFCS, purine-rich foods), adjust meds (consider reducing thiazide/loop diuretics, consider losartan as ARB, consider SGLT2 inhibitors, consider weight loss drug), other (exercise, good hydration, vitamin C, supplements); if hyperuricemia remains severe and persistent (for example over 9 mg/dl), more testing for crystals (DECT, US, urinalysis) and consider drug treatment after discussion with the patient. History of gout or tophi: gout management."
        caption: |
          فوق: مريض CKD جه للنفرولوجي ← history، exam، **serum urate**، و**urine pH** وبلورات اليوريك. وبعدين 3 فروع:

          - **شمال: No history of gout و normouricemia** ← **Follow**، ولو البول حمضي (pH <6) وفيه بلورات ← **urinary alkalinization** بالـ bicarbonate أو citrate.
          - **النص: Asymptomatic hyperuricemia** ← 3 صناديق:
            - **Diet**: قلّل الكحول، السكر والـ **high-fructose corn syrup**، والأكل الغني بالـ purines.
            - **Adjust meds**: قلّل الـ thiazide/loop diuretics، **losartan** كـ ARB، **SGLT2 inhibitors**.
            - **Other**: رياضة، مية، vitamin C.
            - ولو فضل عالي **>9 mg/dl** ← دوّر على بلورات (DECT، US) و==ناقش== العلاج بالدوا مع المريض.
          - **يمين: History of gout أو tophi** ← **Gout management**.

          الرسمة بتوضح إن ==الـ asymptomatic hyperuricemia مابتتعالجش بالدوا على طول==: أكل وتعديل أدوية الأول.
      - kind: explain
        page: 56
        quote: "Acute gout flare in a patient with CKD\n  Classical or atypical presentation?\n    Classical: Clinical diagnosis\n      Acute treatment\n        Colchicine (1.2 mg orally followed by 0.6 mg 1 h later; if subsequent dosing required, adjust per kidney function)\n        or Prednisone 30 mg with taper (10–14 d)\n        or Intra-articular steroids (only if few joints involved)\n        or Consider anakinra or canakinumab (if above treatment fails)\n    Atypical\n      Diagnostic testing\n        Aspirate joint to look for urate crystals and to rule out infection or other causes such as pseudogout from calcium pyrophosphate crystals\n        Consider DECT imaging if available\n      Gout is diagnosed: Acute treatment"
        title: "النقرس في الـ CKD"
        text: |
          **الحاد**: ==colchicine== 1.2 mg وبعده 0.6 mg بعد ساعة، أو **prednisone 30 mg** مع taper على 10–14 يوم، أو intra-articular لو مفاصل قليلة. لو فشل: anakinra أو canakinumab. **مش non-steroidal anti-inflammatory drugs (NSAIDs)**.

          **المزمن**: ==xanthine oxidase inhibitor== أحسن من الـ uricosurics.

          - **Allopurinol**: ابدأ **50 mg** وزوّد بالراحة لحد 800 mg
          - قبله اعمل **HLA-B*5801 testing** للآسيويين والأفارقة
          - **Febuxostat**: 20–40 لحد 120
          - الهدف: ==serum urate (SU) < 6 mg/dL==
          - فشل؟ **pegloticase + methotrexate** لو الـ estimated glomerular filtration rate (eGFR) فوق 40
          - أو **pegloticase + mycophenolate** لو الـ eGFR تحت 40

          التفسير المقبول (مش في الكتاب): مش NSAIDs **لأن** بيقللوا الدم الواصل للكلية وممكن يعملوا AKI. وبنبدأ الـ allopurinol بجرعة صغيرة **عشان** نقلل خطر الـ hypersensitivity والـ flare.
      - kind: figure
        page: 56
        quote: "Acute gout flare in a patient with CKD"
        title: "Acute gout flare في مريض CKD"
        image: { file: neph/L02-acute-gout-flare.webp, book: true }
        alt: "Book flowchart: acute gout flare in a patient with CKD; classical or atypical presentation? Classical: clinical diagnosis, then acute treatment: colchicine 1.2 mg orally followed by 0.6 mg 1 h later, subsequent dosing adjusted per kidney function; or prednisone 30 mg with taper (10-14 d); or intra-articular steroids if few joints; or anakinra or canakinumab if the above fail. Atypical: diagnostic testing (aspirate the joint to look for urate crystals and rule out infection or other causes such as pseudogout; consider DECT imaging), with an arrow 'gout is diagnosed' to acute treatment."
        caption: |
          فوق: **Acute gout flare** في مريض CKD ← السؤال: **Classical** ولا **Atypical**؟

          - **شمال: Classical** ← **Clinical diagnosis** ← **Acute treatment** (الصندوق الكبير):
            - **Colchicine 1.2 mg** وبعد ساعة **0.6 mg**، وباقي الجرعات ==حسب وظيفة الكلية==.
            - أو **Prednisone 30 mg** وتنزل في 10–14 يوم.
            - أو **intra-articular steroids** لو مفاصل قليلة.
            - أو **anakinra/canakinumab** لو اللي فات فشل.
          - **يمين: Atypical** ← **Diagnostic testing**: ==اسحب من المفصل== تدوّر على بلورات اليوريك وتستبعد infection أو pseudogout، و**DECT** لو متاح. ولما يتأكد ← السهم شمال للعلاج.

          لاحظ إن ==الـ NSAIDs مش موجودة== في القايمة خالص: ده بالظبط كلام الكتاب إن الـ colchicine والـ steroids أحسن منها في الـ CKD.
      - kind: explain
        page: 56
        quote: "and to rule out infection or other causes"
        title: "ليه نبزل المفصل، وليه نبدأ allopurinol بالراحة؟"
        text: |
          رسمة ص 56: لو الـ presentation مش كلاسيكي، **aspirate the joint** تدوّر على urate crystals، **و to rule out infection or other causes** زي الـ pseudogout، وممكن DECT.

          التفسير المقبول (مش في الكتاب): المفصل الملتهب ممكن يبقى **septic arthritis**، ولو اديته steroids وهو عدوى هتدمّر المفصل. والـ **pseudogout** علاجه مختلف ومش بيستفيد من تخفيض الـ urate.

          وفي ص 57: الـ ==allopurinol== بيبدأ **50 mg** ويزيد بالراحة، وقبله **HLA-B*5801** في الآسيويين والأفارقة. التفسير المقبول (مش في الكتاب): الـ metabolite بتاعه بيطلع من الكلية وبيتجمع في الـ CKD، والجرعة العالية بدري و الـ ==HLA-B*5801== مرتبطين بـ hypersensitivity خطيرة على الجلد.

          **يعني** البزل بيحدد التشخيص، والبداية الهادية بتحمي المريض.
      - kind: figure
        page: 57
        title: "تنزيل اليوريك على المدى الطويل: رسمة الكتاب"
        image: { file: neph/L02-gout-urate-lowering.webp, book: true }
        alt: "Book flowchart: positive history for gout; address diet, lifestyle, medications (left) and address comorbidities (right: uncontrolled gout as a major risk factor, evaluate for CAD and chronic inflammation). Goal to reduce SU to under 6 mg/dl. Usual first-line: allopurinol (test HLA-B*5801 is negative for Asians and African Americans), initiate at 50 mg/d and slowly escalate to 800 mg/d if needed. Alternative first-line: febuxostat (could include HLA-B58-positive subjects), initiate at 20-40 mg daily and escalate to 120 mg/d. With or without colchicine prophylaxis. Failure to reach target or other complications (draining joints, tophaceous gout): pegloticase + methotrexate if eGFR over 40, pegloticase + mycophenolate if eGFR under 40. Once the goal is reached: XOI to maintain SU under 6 mg/dl."
        caption: |
          - **فوق**: **Positive history for gout** ← شمال: الأكل والـ lifestyle والأدوية، ويمين: الأمراض المصاحبة (CAD، inflammation).
          - **الهدف في النص**: **SU (serum urate) <6 mg/dl**.
          - **فرعين**:
            - **شمال: Allopurinol** (الأول عادةً): اعمل **HLA-B*5801** للآسيويين والأفارقة، وابدأ ==50 mg/d== وزوّد بالراحة لحد 800.
            - **يمين: Febuxostat** (البديل، ينفع لو HLA-B58 positive): ابدأ 20–40 mg ولحد 120.
            - بينهم: **with/without colchicine prophylaxis**.
          - **لو فشل** (أو tophi): **Pegloticase + methotrexate** (eGFR >40) أو **+ mycophenolate** (eGFR <40).
          - **تحت**: بعد الهدف ← **XOI** (xanthine oxidase inhibitor) يفضل يمسك اليوريك <6.

          يعني في الـ CKD ==الـ xanthine oxidase inhibitor هو الأساس== وبنبدأه بجرعة صغيرة ونطلع بالراحة.
