        prompt: "ليه منطقي إن مرض فيه BAFF عالي يبقى عنده risk عالي للـ B-cell lymphoma؟"
        answer: |
          الـ **BAFF** معناه B-cell activating factor: بيخلّي الـ B cells تعيش وتتكاثر.

          لو الـ B cells فضلت متحفّزة سنين جوه الغدة، احتمال إن clone منها يفلت ويبقى **lymphoma** بيزيد. ده تفسير منطقي؛ الرقم (**44 times** risk) هتشوفه في الدرس الجاي.
