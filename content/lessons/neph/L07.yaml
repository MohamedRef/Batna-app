  - id: neph.L07.lesson5
    title: "Tuberous sclerosis: الـ hamartomas في كل حتة"
    hook: "جين جار الـ PKD1 على نفس الكروموسوم، وورم دهني في الكلية ممكن ينزف لحد ما يموّت. ده الـ TSC."
    minutes: 10
    pages: [169, 173]
    topics: [tsc]
    goals:
      - "تعرف الجينين وليه الـ TSC2 أوحش وإيه الـ PKDTS"
      - "تعرف الصورة الإكلينيكية والجلد"
      - "تفهم الـ AML والأكياس والـ RCC في الـ TSC وليه الكلية أشهر سبب وفاة"
    status: unverified
    steps:
      - kind: explain
        page: 169
        title: "TSC: tumor suppressor وقع"
        quote: "TSC results from inactivating mutations in one of two genes, TSC1 on chromosome 9q32-q34 and TSC2 on chromosome 16p13, adjacent to the PKD1 gene. Large deletions involving both PKD1 and TSC2 results in the PKD1/TSC2 (infantile severe polycystic kidney disease with tuber-ous sclerosis [PKDTS]) contiguous gene deletion syndrome. as tumor suppressor genes."
        text: |
          الـ ==tuberous sclerosis complex (TSC)== **autosomal dominant tumor-suppressor syndrome**: **hamartomas** في الكلى والمخ والقلب والرئة والجلد.

          - **tuberous sclerosis gene 1 (TSC1)** على 9q32–q34، **tuberous sclerosis gene 2 (TSC2)** على 16p13 ==جنب الـ PKD1==.
          - لو deletion كبيرة شالت الـ TSC2 والـ PKD1 مع بعض: **polycystic kidney disease with tuberous sclerosis (PKDTS)** (polycystic kidney شديد في الرضّع + TSC).
          - حوالي **70% sporadic**. في الـ sporadic الـ TSC2 أشهر **5 مرات**، والـ TSC1 أخف (second hits أقل).

          ليه "tumor suppressor"؟ التفسير المقبول (مش في الكتاب): الـ hamartin (TSC1) والـ tuberin (TSC2) بيقفلوا الـ mTOR، اللي هو "دواسة البنزين" بتاعة نمو الخلية. لو الاتنين راحوا في خلية، الـ mTOR يفضل شغال فتطلع hamartoma. وليه الـ TSC2 أشد؟ لأنه هو الجزء اللي بيعمل الشغل الفعلي في الـ complex. وليه الـ PKDTS؟ لأن الجينين جيران على نفس الـ chromosome فـ deletion واحدة تشيلهم.
      - kind: figure
        page: 169
        quote: "TSC results from inactivating mutations in one of two genes, TSC1 on chromosome 9q32-q34 and TSC2 on chromosome 16p13, adjacent to the PKD1 gene."
        title: "جيران على chromosome 16"
        alt: "Chromosome 16p13 drawn as a bar with TSC2 and PKD1 side by side. A small mutation in TSC2 gives tuberous sclerosis. A large deletion covering both TSC2 and PKD1 gives the PKD1/TSC2 contiguous gene deletion syndrome: tuberous sclerosis plus severe infantile polycystic kidney disease. TSC1 lies on chromosome 9q."
        caption: "الـ ==TSC2== جنب الـ **PKD1** على طول. deletion كبيرة تشيلهم الاتنين = **PKDTS**: TSC مع polycystic kidney شديد من وهو رضيع."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="20" class="t-sm t-b">Chromosome 16p13</text>
