  - id: geri.L12.lesson2
    title: "خمس أنواع، ومين اللي بيأذي"
    hook: "الإساءة مش بس ضرب. ساعات بتبقى كارت فيزا، وساعات تهديد بدار مسنين، وساعات أكل مااتقدمش."
    minutes: 8
    pages: [214, 216]
    topics: [types, risk]
    goals:
      - "تفرّق الخمس أنواع بالأمثلة"
      - "تعرف مين المؤذي في العادة"
      - "تعرف الـ risk factors في الكبير وفي اللي بيرعاه"
    status: unverified
    steps:
      - kind: table
        page: 214
        quote: "Financial or material Illegal or improper use of funds Theft of debit or credit cards,"
        title: "الخمس أنواع"
        columns: ["Type", "What it is", "Example"]
        rows:
          - ["Financial", "Improper use of funds, exploitation", "Card theft, forced transfer of property"]
          - ["Neglect", "Caregiver fails to meet needs (intent or not)", "No food, hygiene, medical care"]
          - ["Physical", "Pain or injury", "Hitting, force-feeding, restraint"]
          - ["Psychological", "Mental anguish", "Threat of a care home, isolation"]
          - ["Sexual", "Nonconsensual contact or talk", "Touching a nonconsenting person"]
        hide: [[0, 2], [1, 1], [2, 2], [3, 2]]
      - kind: aside
        tone: exam
        page: 214
        quote: "Neglect or abandonment Intentional or unintentional Failure to provide adequate"
        text: "فخ امتحان: الـ ==neglect== ممكن يكون **unintentional**. البنت التعبانة اللي مش بتأكّل أبوها كفاية من غير قصد، ده برضه neglect."
      - kind: sort
        page: 214
        quote: "Slapping, hitting, kicking, force-feeding, restraint, striking with objects"
        prompt: "حط كل موقف في نوعه:"
        bins: ["Financial", "Neglect", "Physical", "Psychological"]
        cards:
          - { text: "Son keeps her pension card", bin: 0 }
          - { text: "Forced transfer of the flat", bin: 0 }
          - { text: "No bath for weeks", bin: 1 }
          - { text: "No glasses or hearing aid provided", bin: 1 }
          - { text: "Force-feeding", bin: 2 }
          - { text: "Tied to the bed", bin: 2 }
          - { text: "'We'll put you in a home'", bin: 3 }
          - { text: "Kept away from friends", bin: 3 }
        why: "الـ force-feeding والـ restraint physical حتى لو شكلهم «رعاية». العزل الاجتماعي والتهديد بالدار psychological."
      - kind: explain
        page: 214
        quote: "Children and living relatives who have a history of substance abuse or have had other life troubles are of particular .concern."
        title: "مين المؤذي؟"
        text: |
          أي حد: زوج أو زوجة، ولاد، قرايب، جار، متطوع، عامل بأجر، ممارس صحي، محامي، أو أي حد عايز ياخد موارد شخص ضعيف.

          الأخطر: ==children and relatives== اللي عندهم **substance abuse** أو مشاكل في حياتهم.

          والمكان؟ **غالبًا البيت** (ولاد كبار، أحفاد، أزواج)، وممكن في **long-term care facilities**.
      - kind: explain
        page: 215
        quote: "Has memory problems (such as dementia). Has physical disabilities. Has depression, loneliness, or lack of social support."
        title: "Risk factors في الكبير"
        text: |
          - **Dementia** و memory problems.
          - Physical disabilities.
          - Depression، وحدة، مفيش support.
          - Alcohol أو substances.
          - بيتخانق مع الـ caregiver لفظيًا أو جسديًا، أو عنده ميل للعدوانية.
          - ==Shared living==، و **isolation**: هو والـ caregiver لوحدهم طول الوقت.
          - كان هو نفسه أب أو زوج مؤذي زمان، أو فيه domestic violence في البيت.
      - kind: explain
        page: 215
        quote: "Feels overwhelmed or resentful. Has a history of substance abuse or a history of abusing others."
        title: "Risk factors في الـ caregiver"
        text: |
          - **Overwhelmed** أو **resentful**، ومش قادر يتعامل مع الضغط.
          - Substance abuse، أو أذى ناس تانيين قبل كده، أو **criminal history**.
          - ==Dependent== على الكبير في السكن أو الفلوس.
          - Mental health problems، و **depression** (شائع في الـ caregivers).
          - Unemployed.
          - Shared living، ومفيش حد تاني يساعده.
          - شايف الرعاية **عبء من غير أي مقابل نفسي**.
      - kind: figure
        page: 215
        quote: "There are also several risk factors, which increase the likelihood that a caregiver will participate in elder abuse."
        title: "العاصفة الكاملة"
        alt: "Two overlapping circles. Left circle, the elder: dementia, disability, depression, aggression, past abuser. Right circle, the caregiver: overwhelmed, substance abuse, dependent on the elder, unemployed, depressed. The overlap is labelled shared living and isolation, with the words highest risk."
        caption: "لما الكبير الضعيف والـ caregiver المضغوط يعيشوا لوحدهم مع بعض، ده أعلى خطر."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <circle cx="115" cy="150" r="105" class="fg-acc"/>
            <circle cx="215" cy="150" r="105" class="fg-bad" fill-opacity="0.6"/>
            <text x="30" y="40" class="t-sm t-b">Elder</text>
            <text x="250" y="40" class="t-sm t-b">Caregiver</text>
            <text x="22" y="105" class="t-sm">dementia</text>
            <text x="22" y="125" class="t-sm">disability</text>
            <text x="22" y="145" class="t-sm">depression</text>
            <text x="22" y="165" class="t-sm">aggression</text>
            <text x="22" y="185" class="t-sm">past abuser</text>
            <text x="232" y="105" class="t-sm">overwhelmed</text>
            <text x="232" y="125" class="t-sm">substances</text>
            <text x="232" y="145" class="t-sm">dependent</text>
            <text x="232" y="165" class="t-sm">unemployed</text>
            <text x="232" y="185" class="t-sm">depressed</text>
            <text x="135" y="140" class="t-sm t-b">shared</text>
            <text x="135" y="158" class="t-sm t-b">living,</text>
            <text x="135" y="176" class="t-sm t-b">isolated</text>
            <text x="110" y="290" class="t-sm t-b t-bad">highest risk</text>
          </svg>
      - kind: check
        page: 215
        quote: "Is dependent on the older person for housing, finances, or other needs."
        question: "Which caregiver feature is a risk factor for elder abuse?"
        options: ["Depends on the elder for housing and money", "Has a full-time job", "Gets regular respite", "Lives in another city"]
        answer: 0
        why:
          - "صح: الـ dependency من أهم الـ risk factors."
          - "الـ unemployment هو الـ risk factor، مش الشغل."
          - "الـ respite بيقلل الضغط وبيحمي."
          - "الـ shared living هو الـ risk factor."
      - kind: try
        items: [geri.L12.021, geri.L12.022, geri.L12.027, geri.L12.028]
    recap:
      - "Financial، neglect (حتى من غير قصد)، physical (منها force-feeding و restraint)، psychological (تهديد بالدار، عزل)، sexual."
      - "المؤذي غالبًا من العيلة، خصوصًا مع substance abuse؛ المكان غالبًا البيت."
      - "الكبير: dementia، disability، depression، aggression، shared living، isolation."
      - "الـ caregiver: overwhelmed، substances، dependent، unemployed، depressed، شايفها عبء."
    practice: [geri.L12.021, geri.L12.022, geri.L12.023, geri.L12.024, geri.L12.025, geri.L12.026, geri.L12.027, geri.L12.028, geri.L12.029, geri.L12.030, geri.L12.031, geri.L12.032, geri.L12.033, geri.L12.059, geri.L12.060, geri.L12.061, geri.L12.062, geri.L12.063, geri.L12.074]
