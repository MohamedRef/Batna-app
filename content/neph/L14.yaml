    status: unverified
  - id: neph.L14.173
    kind: card
    topic: hrs
    front: Give the terlipressin doses in HRS.
    back: "IV boluses 0.5-1 mg every 4-6 h up to 2 mg every 4 h, or continuous infusion 2 mg/day up to 12 mg/day; always with albumin."
    src: { page: 492, quote: "Terlipressin can be administered both as intravenous boluses (starting from 0.5-1 mg every 4-6 h to a maximum dose of 2 mg every 4 h) and as continuous intravenous infusions (starting from 2 mg/day to maximum dose of 12 mg/day)." }
    update:
      text: "Boxed warning: serious or fatal respiratory failure. Check SpO2 before starting and keep monitoring it; do not start if SpO2 is <90%. Volume overload and ACLF grade 3 raise the risk, so watch for fluid overload and cut or stop albumin if it appears. Patients with creatinine ≥5 mg/dL are unlikely to benefit. In the exam give the book's answer."
