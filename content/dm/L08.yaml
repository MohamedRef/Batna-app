    kind: cloze
    topic: fats
    text: "The AHA advises limiting saturated fat to less than {{c1::7%}} of daily calories and trans fat to less than {{c2::1%}}."
    src: { page: 95, quote: "advises limiting saturated fat consumption to less than 7% of daily calories and transfat consumption to less than 1%." }
    status: unverified
    tags: [numbers, high-yield]
    update:
      text: "AHA 2021 dietary guidance and ADA 2025 advise keeping saturated fat low (under about 6–10% of calories) and avoiding trans fat altogether. The book's 7% and 1% are the exam answer."
      ref: "AHA Dietary Guidance 2021; ADA Standards of Care 2025, section 5"
