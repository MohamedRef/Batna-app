name: Release
run-name: Release (${{ inputs.channel || 'alpha' }})

# Builds a real Batna release and publishes it (docs/RELEASE.md §4–5): the
# signed release APK, the signed Batna.app and the content pack. Since
# 2026-11-08 (Mohamed) the version is the calendar's, YEAR.MONTH.N
# (2026.11.1 = the first release of November 2026), and the build number is
# one counter shared with the preview builds (scripts/version.sh). Nothing
# needs bumping first. The release goes on
#
# - the channel feed(s) the version belongs to (`batna-alpha`, …): the
#   signed update.json the installed apps read, files first, manifest last
#   (alpha unless the `channel` input says beta or stable);
# - a release of its own (`v<version>`, e.g. v2026.11.1) with the APK and
#   the zipped Batna.app for installing by hand.
#
# By hand only (Actions › Release › Run workflow): nothing is released
# unless Mohamed says go. The keys come from repo secrets that
# scripts/release-secrets.sh copies from the Mac's Keychain; the public
# update key is crates/app/update-key.pub. Same build steps as
# batna-android-preview.yml and mac.yml, with the release keys.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel (a beta also reaches alpha, a stable release everyone)"
        type: choice
        options: [alpha, beta, stable]
        default: alpha
      notes_en:
        description: "Short notes (English, optional: what's new comes from changes/)"
        required: false
        default: ""
      notes_ar_eg:
        description: "Short notes (Egyptian Arabic, optional)"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Batna Cloud and Google sign-in, built in like the preview builds
  # (crates/app/src/cloud/mod.rs, docs/CLOUD.md §3.5). The URL and client id
  # are public; the client secret (a repo secret) is passed only to the two
  # build steps. Never echo these.
  BATNA_CLOUD_URL: ${{ vars.BATNA_CLOUD_URL || 'https://batna-cloud.hamorefaat85.workers.dev' }}
  BATNA_GOOGLE_CLIENT_ID: ${{ vars.BATNA_GOOGLE_CLIENT_ID || '1001052243528-3d8bmf0efprgdvov9f663fm8u63kblck.apps.googleusercontent.com' }}

jobs:
  prepare:
    name: Version, keys and content pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      channels: ${{ steps.v.outputs.channels }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The build number counts the commits; the version counts this
          # month's release tags.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-tools
          save-if: false
      - name: Release version, build number and channels
        id: v
        env:
          CHANNEL: ${{ inputs.channel || 'alpha' }}
        run: |
          read -r v build < <(scripts/version.sh release)
          [ -z "$(git tag -l "v$v")" ] || { echo "::error::v$v exists already"; exit 1; }
          scripts/version.sh apply "$v"
          channels="$(cargo run -q -p batna-tools -- update channels --version "$v" --channel "$CHANNEL" | tr '\n' ' ')"
          [ -n "${channels// }" ] || { echo "::error::$v belongs on no channel"; exit 1; }
          { echo "version=$v"; echo "build=$build"; echo "channels=$channels"; } >> "$GITHUB_OUTPUT"
          echo "Batna $v, build $build → $channels"
      - name: Every key is there
        env:
          HAVE_UPDATE: ${{ secrets.BATNA_UPDATE_SECRET != '' }}
          HAVE_KEYSTORE: ${{ secrets.BATNA_ANDROID_KEYSTORE != '' && secrets.BATNA_ANDROID_KEYSTORE_PASSWORD != '' }}
          HAVE_MAC: ${{ secrets.BATNA_MAC_CERT_P12 != '' && secrets.BATNA_MAC_CERT_PASSWORD != '' }}
          HAVE_GOOGLE: ${{ secrets.BATNA_GOOGLE_CLIENT_SECRET != '' }}
        run: |
          ok=true
          grep -q '^[A-Za-z0-9+/]\{43\}=$' crates/app/update-key.pub \
            || { echo "::error::crates/app/update-key.pub holds no key: run scripts/release-secrets.sh on the Mac and commit it"; ok=false; }
          [ "$HAVE_UPDATE" = true ] || { echo "::error::secret BATNA_UPDATE_SECRET is missing (scripts/release-secrets.sh)"; ok=false; }
          [ "$HAVE_KEYSTORE" = true ] || { echo "::error::secrets BATNA_ANDROID_KEYSTORE(_PASSWORD) are missing (scripts/release-secrets.sh)"; ok=false; }
          [ "$HAVE_MAC" = true ] || { echo "::error::secrets BATNA_MAC_CERT_P12/_PASSWORD are missing (scripts/release-secrets.sh)"; ok=false; }
          [ "$HAVE_GOOGLE" = true ] || echo "::warning::BATNA_GOOGLE_CLIENT_SECRET is missing: Google sign-in for sync may fail (docs/CLOUD.md §3.5)"
          $ok
      - name: Content pack (built in and on the feed)
        run: |
          cargo run -q -p batna-tools -- validate
          cargo run -q -p batna-tools -- packs build --out dist/packs
      - uses: actions/upload-artifact@v4
        with:
          name: batna-release-pack
          path: dist/packs/
          retention-days: 30

  android:
    name: Release APK
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BATNA_BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Release version into Cargo.toml (the app's label, versionName, CFBundleShortVersionString)
        run: scripts/version.sh apply "${{ needs.prepare.outputs.version }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: batna-android-preview
          save-if: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0
      - name: Install dx 0.7.10
        run: cargo binstall -y --force dioxus-cli@0.7.10
      - uses: actions/download-artifact@v4
        with:
          name: batna-release-pack
          path: dist/packs
      - name: Build identity
        run: |
          {
            echo "BATNA_COMMIT=${GITHUB_SHA::7}"
            echo "BATNA_BUILTIN_CONTENT=$(sha256sum dist/packs/batna-content.pack | cut -d' ' -f1)"
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME"
          } >> "$GITHUB_ENV"
          ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1 >> "$GITHUB_PATH"
      - name: Build APK
        working-directory: crates/app
        env:
          BATNA_GOOGLE_CLIENT_SECRET: ${{ secrets.BATNA_GOOGLE_CLIENT_SECRET }}
        run: |
          dx bundle --platform android --release --package-types apk \
            --target aarch64-linux-android --no-default-features --features mobile \
            --out-dir ../../dist/android/raw
      - name: Rebuild as a release APK (not debuggable, R8, versionCode)
        run: |
          APK="$(scripts/android-release-apk.sh)"
          scripts/android-check-apk.sh "$APK"
          mkdir -p dist/android/release && cp "$APK" dist/android/release/batna-unsigned.apk
      - name: Sign with the release key
        env:
          KEYSTORE_B64: ${{ secrets.BATNA_ANDROID_KEYSTORE }}
          PASS: ${{ secrets.BATNA_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/batna-release.jks"
          printf %s "$KEYSTORE_B64" | base64 -d > "$ks"
          zipalign -f -p 4 dist/android/release/batna-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          apksigner sign --ks "$ks" --ks-key-alias batna --ks-pass env:PASS --key-pass env:PASS \
            --out dist/android/batna.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$ks"
          apksigner verify --print-certs dist/android/batna.apk
          unzip -l dist/android/batna.apk | grep -q 'lib/arm64-v8a/' \
            || { echo "APK has no arm64-v8a library"; exit 1; }
          ls -lh dist/android/batna.apk
      - uses: actions/upload-artifact@v4
        with:
          name: batna-release-apk
          path: dist/android/batna.apk
          retention-days: 30

  mac:
    name: Release Batna.app
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BATNA_BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Release version into Cargo.toml (the app's label, versionName, CFBundleShortVersionString)
        run: scripts/version.sh apply "${{ needs.prepare.outputs.version }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
          save-if: false
      - name: Install dx 0.7.10
        run: |
          if ! dx --version 2>/dev/null | grep -q '0.7.10'; then
            cargo install dioxus-cli --version 0.7.10 --locked
          fi
      - uses: actions/download-artifact@v4
        with:
          name: batna-release-pack
          path: dist/packs
      - name: Build Batna.app
        env:
          BATNA_GOOGLE_CLIENT_SECRET: ${{ secrets.BATNA_GOOGLE_CLIENT_SECRET }}
        run: |
          export BATNA_COMMIT="${GITHUB_SHA::7}"
          export BATNA_BUILTIN_CONTENT="$(shasum -a 256 dist/packs/batna-content.pack | cut -d' ' -f1)"
          cd crates/app
          if ! dx bundle --platform macos --release --package-types macos --out-dir ../../dist/mac/raw > ../../dx-bundle.log 2>&1; then
            grep -iE 'error|failed|panick|not found|no such' ../../dx-bundle.log | grep -v ' INFO Compiled' | tail -n 9 | sed 's/^/::error::/'
            exit 1
          fi
          cd ../..
          app="$(find dist/mac/raw -maxdepth 4 -name '*.app' | head -1)"
          test -n "$app"
          rm -rf dist/mac/Batna.app && cp -R "$app" dist/mac/Batna.app
          # Apple's split (before signing): the release people read, and the
          # build number that only grows.
          plist=dist/mac/Batna.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ needs.prepare.outputs.version }}" "$plist" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${{ needs.prepare.outputs.version }}" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BATNA_BUILD" "$plist" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BATNA_BUILD" "$plist"
      - name: Sign as "Batna Code Signing" (the identity installed apps trust)
        env:
          P12_B64: ${{ secrets.BATNA_MAC_CERT_P12 }}
          P12_PASS: ${{ secrets.BATNA_MAC_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/batna.keychain-db"
          kcpass="$(openssl rand -hex 16)"
          printf %s "$P12_B64" | base64 -d > "$RUNNER_TEMP/batna.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/batna.p12" -k "$kc" -P "$P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/batna.p12"
          codesign --force --deep --keychain "$kc" --sign "Batna Code Signing" dist/mac/Batna.app
          codesign --verify --deep --strict dist/mac/Batna.app
          codesign -dvv dist/mac/Batna.app 2>&1 | grep -E 'Authority|Identifier'
          ditto -c -k --keepParent dist/mac/Batna.app dist/mac/Batna.app.zip
          ls -lh dist/mac/Batna.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: batna-release-mac
          path: dist/mac/Batna.app.zip
          retention-days: 30

  publish:
    name: Publish the release and its update feed
    needs: [prepare, android, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BATNA_BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # What's new reads the changes/ files merged since the feed's build.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-tools
          save-if: false
      - uses: actions/download-artifact@v4
        with:
          path: dist/in
      - name: Signed feed per channel
        env:
          V: ${{ needs.prepare.outputs.version }}
          CHANNELS: ${{ needs.prepare.outputs.channels }}
          NOTES_EN: ${{ inputs.notes_en }}
          NOTES_AR_EG: ${{ inputs.notes_ar_eg }}
          BATNA_UPDATE_SECRET: ${{ secrets.BATNA_UPDATE_SECRET }}
        run: |
          apk=dist/in/batna-release-apk/batna.apk
          zip=dist/in/batna-release-mac/Batna.app.zip
          pack=dist/in/batna-release-pack/batna-content.pack
          for channel in $CHANNELS; do
            out="dist/update/$channel"
            curl -fsSL --retry 3 -o /tmp/previous.json \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/batna-$channel/update.json" \
              || rm -f /tmp/previous.json
            cargo run -q -p batna-tools -- update manifest --channel "$channel" --version "$V" \
              --build "$BATNA_BUILD" --commit "${GITHUB_SHA::7}" \
              --notes-en "$NOTES_EN" --notes-ar-eg "$NOTES_AR_EG" --previous /tmp/previous.json --changes \
              --asset "android-arm64=$apk" --asset "macos-arm64=$zip" --asset "content=$pack" --out "$out"
            cargo run -q -p batna-tools -- update sign "$out"
            # The app's own checks, against the key built into release builds.
            cargo run -q -p batna-tools -- update verify "$out"
            ls -l "$out"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: batna-release-feeds
          path: dist/update/
          retention-days: 30
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.prepare.outputs.version }}
          CHANNELS: ${{ needs.prepare.outputs.channels }}
          NOTES_EN: ${{ inputs.notes_en }}
          NOTES_AR_EG: ${{ inputs.notes_ar_eg }}
        run: |
          # The release people install from by hand: built as a draft, files
          # uploaded, then published, so the page never shows half a release.
          # Alpha and beta stay pre-releases; a stable one becomes "Latest".
          tag="v$V"
          channel="$(awk '{print $NF}' <<<"$CHANNELS")"   # the one picked; the others are below it
          mkdir -p dist/human
          cp dist/in/batna-release-apk/batna.apk "dist/human/Batna-$V-android.apk"
          cp dist/in/batna-release-mac/Batna.app.zip "dist/human/Batna-$V-mac.zip"
          (cd dist/human && sha256sum Batna-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          scripts/release-notes.sh "dist/update/$channel/update.json" "$channel" "$NOTES_EN" "$NOTES_AR_EG" \
            > dist/release-notes.md
          cat dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"
          kind=(--prerelease --latest=false)
          [ "$channel" != stable ] || kind=(--latest)
          gh release create "$tag" --draft "${kind[@]}" --target "$GITHUB_SHA" --title "Batna $V" \
            --notes-file dist/release-notes.md dist/human/*
          gh release edit "$tag" --draft=false
          echo "released $V: https://github.com/$GH_REPO/releases/tag/$tag"
          # The feeds: files first, the signed manifest last.
          for channel in $CHANNELS; do
            feed="batna-$channel"
            out="dist/update/$channel"
            if ! gh release view "$feed" >/dev/null 2>&1; then
              gh release create "$feed" --prerelease --latest=false --target "$GITHUB_SHA" --title "Batna updates ($channel)" \
                --notes "Batna's $channel update feed. The app reads update.json, checks its signature and each file's SHA-256. Published by the Release workflow; never edit by hand."
            fi
            files=()
            for f in "$out"/*; do
              case "$(basename "$f")" in update.json|update.json.sig) ;; *) files+=("$f") ;; esac
            done
            gh release upload "$feed" "${files[@]}" --clobber
            gh release upload "$feed" "$out/update.json.sig" "$out/update.json" --clobber
            echo "published $V on $channel: https://github.com/$GH_REPO/releases/tag/$feed"
          done
