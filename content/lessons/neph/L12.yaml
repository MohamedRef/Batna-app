  # Split from lesson1 on 2026-11-13 (#828): AKI in malignancy.
  - id: neph.L12.lesson5
    title: "الـ AKI في عيان السرطان: ابدأ بالـ prerenal"
    hook: "أغلب الـ AKI هنا ناشفة مش مكسورة: لو لحقتها بدري بترجع."
    minutes: 7
    pages: [412, 413]
    topics: [aki]
    goals:
      - "تقسّم الـ AKI في السرطان prerenal و intrarenal و postrenal"
      - "تعرف ليه الـ prerenal بيرجع لو اتمسك بدري"
      - "تعدّ أسباب الـ prerenal في السرطان وبعد الـ stem cell transplant وتفهم كل سبب"
    status: unverified
    steps:
      - kind: explain
        page: 412
        title: "الـ AKI: نفس الـ schema"
        quote: "Prerenal etiologies are especially common and if early detected could be reversed."
        text: |
          الـ AKI في عيان السرطان بتتشخص زي أي حد: **prerenal** ولا **intrarenal** (vascular, glomerular, tubular, interstitial) ولا **postrenal** (obstruction).

          الـ ==prerenal== هو الأشهر، ولو مسكته بدري **بيرجع**. علشان كده اسأل عن الأكل والترجيع والإسهال قبل أي حاجة.
      - kind: figure
        page: 412
        quote: "The diagnostic schema for AKI in the patient with cancer is the same as that for other patient groups and rests on determining whether the etiology is prerenal (from volume depletion or decreased effective circulating volume), intrarenal (such as from vascular, glomerular, tubular, or interstitial causes or postrenal [because of obstruction of urine flow at some point along the urinary tract])."
        title: "نفس الخريطة، بأمثلة من المحاضرة"
        alt: "Three columns: prerenal (volume depletion or low effective circulating volume), intrarenal (vascular, glomerular, tubular, interstitial) and postrenal (obstruction of urine flow). Under each, examples from this lecture: poor intake, sepsis and IL-2 capillary leak; TMA, paraneoplastic glomerular disease, cisplatin and ifosfamide, tumor infiltration; ureteric compression by cervical cancer and prostatic disease."
        caption: "الخريطة هي هي في أي عيان. اللي بيتغير الأمثلة: ==prerenal== (أكل قليل، sepsis، IL-2)، **intrarenal** (TMA، glomerular، الـ chemo، infiltration)، **postrenal** (ورم بيضغط). وكل الأمثلة دي هتشوفها في الدروس الجاية."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="10" width="100" height="56" rx="8" class="fg-good"/>
            <text x="58" y="32" text-anchor="middle" class="t-sm t-b">Prerenal</text>
            <text x="58" y="50" text-anchor="middle" class="t-sm">low volume</text>
            <rect x="115" y="10" width="100" height="56" rx="8" class="fg-acc"/>
            <text x="165" y="32" text-anchor="middle" class="t-sm t-b">Intrarenal</text>
            <text x="165" y="50" text-anchor="middle" class="t-sm">kidney itself</text>
            <rect x="222" y="10" width="100" height="56" rx="8" class="fg-bad"/>
            <text x="272" y="32" text-anchor="middle" class="t-sm t-b">Postrenal</text>
            <text x="272" y="50" text-anchor="middle" class="t-sm">obstruction</text>
            <text x="58" y="92" text-anchor="middle" class="t-sm">Poor intake</text>
            <text x="58" y="112" text-anchor="middle" class="t-sm">Vomiting, diarrhea</text>
            <text x="58" y="132" text-anchor="middle" class="t-sm">Sepsis</text>
            <text x="58" y="152" text-anchor="middle" class="t-sm">IL-2 capillary leak</text>
            <text x="58" y="172" text-anchor="middle" class="t-sm">Hypercalcemia</text>
            <text x="165" y="92" text-anchor="middle" class="t-sm">Vascular: TMA</text>
            <text x="165" y="112" text-anchor="middle" class="t-sm">Glomerular: MN</text>
            <text x="165" y="132" text-anchor="middle" class="t-sm">Tubular: cisplatin</text>
            <text x="165" y="152" text-anchor="middle" class="t-sm">Interstitial: ATIN</text>
            <text x="165" y="172" text-anchor="middle" class="t-sm">Infiltration</text>
            <text x="272" y="92" text-anchor="middle" class="t-sm">Uric acid crystals</text>
            <text x="272" y="112" text-anchor="middle" class="t-sm">Methotrexate</text>
            <text x="272" y="132" text-anchor="middle" class="t-sm">Cervical cancer</text>
            <text x="272" y="152" text-anchor="middle" class="t-sm">Prostate</text>
            <rect x="8" y="196" width="314" height="52" rx="10" class="fg-good"/>
            <text x="165" y="218" text-anchor="middle" class="t-sm t-b">Prerenal: the most common</text>
            <text x="165" y="236" text-anchor="middle" class="t-sm">reversible if detected early</text>
          </svg>
      - kind: reveal
        page: 412
        quote: "Prerenal etiologies are especially common and if early detected could be reversed."
        prompt: "ليه الـ prerenal بالذات هو اللي بيرجع لو لحقته بدري؟"
        answer: |
          التفسير المقبول (مش في الكتاب): في الـ prerenal الكلية **سليمة**، هي بس مش واصلها دم كفاية، فالـ GFR بيقل كـ **رد فعل طبيعي**. رجّع الـ volume، الدم يوصل، والـ GFR يرجع.

          بس لو سبتها، الـ tubules اللي ناقصها oxygen بتبتدي تموت، والـ prerenal يتقلب **intrarenal** (acute tubular necrosis)، وساعتها مش هيرجع بالمحلول بس. عشان كده الكتاب بيقول ==if early detected==.
      - kind: explain
        page: 413
        title: "أسباب الـ prerenal في الأورام: كل سبب بيسحب الدم إزاي؟"
        quote: "Hematological and Solid Organ Cancers:\n  Poor oral intake owing to chemotherapy-induced anorexia, emesis and diarrhea\n  Sepsis with renal hypoperfusion\n  Coexistent cirrhosis or heart failure\n  Hypercalcemia\n  Medications (ACE inhibitors, angiotensin-receptor blockers, NSAIDs, diuretics)"
        text: |
          الـ Figure (ص 413) بتدّيك خمس أسباب. الأسماء من الكتاب، والآلية التفسير المقبول (مش في الكتاب):

          - **Poor oral intake** (anorexia، emesis، diarrhea من الـ chemo): مية داخلة أقل ومية خارجة أكتر، فالـ volume بيقل فعلًا.
          - **Sepsis with renal hypoperfusion:** الأوعية بتتوسّع والضغط بيقع، فالدم موجود بس مش واصل الكلية.
          - **Cirrhosis أو heart failure:** دول ==decreased effective circulating volume==: الجسم فيه مية كتير بس الدم اللي بيوصل للكلية قليل.
          - **Hypercalcemia:** الكالسيوم بيقبّض الأوعية الداخلة للـ glomerulus، وبيخلي الكلية تفقد مية في البول، فبتنشف.
          - **ACEi و ARB و NSAIDs و diuretics:** الأولانيين بيشيلوا الـ angiotensin اللي بيحافظ على ضغط الـ glomerulus، والـ NSAIDs بتشيل الـ prostaglandins اللي بتوسّع الشريان الداخل، والـ diuretics بتسحب volume.
      - kind: sort
        page: 413
        quote: "Hematological and Solid Organ Cancers:\n  Poor oral intake owing to chemotherapy-induced anorexia, emesis and diarrhea\n  Sepsis with renal hypoperfusion\n  Coexistent cirrhosis or heart failure\n  Hypercalcemia\n  Medications (ACE inhibitors, angiotensin-receptor blockers, NSAIDs, diuretics)\nStem Cell Transplantation:\n  Poor oral intake owing to chemotherapy-induced anorexia, emesis and diarrhea\n  Sepsis with renal hypoperfusion\n  Coexistent cirrhosis (veno-occlusive disease) or heart failure\n  Medications (ACE inhibitors, angiotensin-receptor blockers, NSAIDs, diuretics, calcineurin inhibitors)\n  Cytokine release syndrome\n  Early veno-occlusive disease"
        prompt: "أسباب الـ prerenal AKI في الـ Figure (ص 413). صنّف: موجودة في العمودين، ولا بعد الـ stem cell transplant بس؟"
        bins: ["Both columns", "Stem cell transplant only"]
        cards:
          - { text: "Poor intake: chemo anorexia, emesis, diarrhea", bin: 0 }
          - { text: "Sepsis with renal hypoperfusion", bin: 0 }
          - { text: "Angiotensin-converting enzyme inhibitors (ACEi), angiotensin II receptor blockers (ARB), non-steroidal anti-inflammatory drugs (NSAIDs), diuretics", bin: 0 }
          - { text: "Calcineurin inhibitors", bin: 1 }
          - { text: "Cytokine release syndrome", bin: 1 }
          - { text: "Early veno-occlusive disease", bin: 1 }
        why: "العمود الأصفر (cancers) فيه كمان cirrhosis و heart failure و hypercalcemia. العمود الأزرق (stem cell transplant) زوّد الـ calcineurin inhibitors والـ cytokine release syndrome والـ veno-occlusive disease، لأنها كلها مرتبطة بالـ transplant نفسه."
      - kind: explain
        page: 413
        title: "بعد الـ stem cell transplant: إيه الجديد؟"
        quote: "Stem Cell Transplantation:\n  Poor oral intake owing to chemotherapy-induced anorexia, emesis and diarrhea\n  Sepsis with renal hypoperfusion\n  Coexistent cirrhosis (veno-occlusive disease) or heart failure\n  Medications (ACE inhibitors, angiotensin-receptor blockers, NSAIDs, diuretics, calcineurin inhibitors)\n  Cytokine release syndrome\n  Early veno-occlusive disease"
        text: |
          نفس الأسباب، وزيادة تلاتة. التفسير المقبول (مش في الكتاب) لكل واحد:

          - **Calcineurin inhibitors:** بيقبّضوا الشريان الداخل للـ glomerulus، فالـ GFR بيقل من غير ما الكلية تتكسر.
          - **Cytokine release syndrome:** الـ cytokines بتفتح الـ capillaries، فالسوايل بتهرب برا الأوعية (capillary leak)، والكلية بتشوف دم أقل.
          - ==Early veno-occlusive disease==: الأوردة الصغيرة في الكبد بتتسد، فبيحصل شكل شبه الـ cirrhosis: سوايل في البطن وكلية حاسة إن الدم قليل.

          لاحظ إن الكتاب حاطط الـ **veno-occlusive disease** جنب الـ cirrhosis في العمود ده، وده بيأكد نفس المنطق.
      - kind: check
        page: 413
        quote: "Stem Cell Transplantation:\n  Poor oral intake owing to chemotherapy-induced anorexia, emesis and diarrhea\n  Sepsis with renal hypoperfusion\n  Coexistent cirrhosis (veno-occlusive disease) or heart failure\n  Medications (ACE inhibitors, angiotensin-receptor blockers, NSAIDs, diuretics, calcineurin inhibitors)\n  Cytokine release syndrome\n  Early veno-occlusive disease"
        question: "Which prerenal cause of AKI appears after stem cell transplantation but not in the list for hematological and solid organ cancers?"
        options:
          - "Cytokine release syndrome"
          - "Sepsis with renal hypoperfusion"
          - "Hypercalcemia"
          - "NSAIDs"
        answer: 0
        why:
          - "صح: الـ cytokine release syndrome في عمود الـ stem cell transplantation بس."
          - "غلط: الـ sepsis موجود في العمودين."
          - "غلط: الـ hypercalcemia في عمود الأورام بس، مش الـ transplant."
          - "غلط: الـ NSAIDs موجودة في العمودين."
      - kind: aside
        tone: exam
        page: 413
        quote: "Hematological and Solid Organ Cancers:\n  Poor oral intake owing to chemotherapy-induced anorexia, emesis and diarrhea\n  Sepsis with renal hypoperfusion\n  Coexistent cirrhosis or heart failure\n  Hypercalcemia\n  Medications (ACE inhibitors, angiotensin-receptor blockers, NSAIDs, diuretics)"
        text: "فخ: الـ **hypercalcemia** مكتوبة في الكتاب كسبب **prerenal**، مش intrarenal. لو اتسألت «hypercalcemia of malignancy بتعمل AKI إزاي»، ابدأ بالـ volume depletion، ولذلك أول علاج هو الـ **normal saline** (هتشوفه في درس الكالسيوم)."
      - kind: try
        items: [neph.L12.018, neph.L12.019, neph.L12.020, neph.L12.021]
    recap:
      - "الـ AKI في السرطان بتتقسم زي أي عيان: prerenal، intrarenal، postrenal."
      - "الـ prerenal هو الأشهر وبيرجع لو اتمسك بدري، قبل ما الـ tubules تموت."
      - "أسباب الأورام: poor intake، sepsis، cirrhosis أو heart failure، hypercalcemia، الأدوية."
      - "بعد الـ transplant زوّد: calcineurin inhibitors، cytokine release syndrome، early veno-occlusive disease."
