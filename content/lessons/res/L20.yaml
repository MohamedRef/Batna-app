    quote: |-
      3. Review of the Medical Literature
      As part of the introduction, it is important to review the current medical literature regarding a particular topic.
      This is important because:
      It sets the stage for the relevance and applicability of that study
      More importantly, it indicates to the reason why that research was chosen.
      It is important to understand
      The available current knowledge
      Cross reference it with the current gaps in knowledge or research
      Tie the gap into the current study
      What it adds to the body of literature
    title: 'الـ literature review: فين الفجوة؟'
    text: |-
      جزء من المقدمة إنك تراجع الـ medical literature الحالية. أهميته:
      - بيحدد **relevance and applicability** الدراسة.
      - والأهم: بيقول ==the reason why that research was chosen==.

      ومنه لازم تفهم بالترتيب: المعرفة الحالية ← الـ **gaps** ← ربط الفجوة بالدراسة دي ← هتضيف إيه للـ literature.
  - kind: explain
    page: 29
    quote: |-
      4. Methods
      The most important part of the Methods section is discussing the inclusion and exclusion criteria that the authors used in their study.
      This, coupled with the actual methodology of the study, can determine how valid and reliable results are.
      For results to be accurate and sound, they should arise from a non-biased, representative sample that would in turn validate the positive or negative results of a study.
      In this section, one can mention the study design and how it was implemented.
    title: 'الـ Methods: مين دخل ومين اتشال'
    text: |-
      أهم حاجة في الـ Methods هي ==the inclusion and exclusion criteria==.

      دي مع الـ methodology بتحدد النتايج **valid and reliable** ولا لأ. والنتيجة السليمة لازم تطلع من **non-biased, representative sample**.

      وهنا تذكر الـ study design واتنفّذ إزاي.
