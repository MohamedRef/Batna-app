            <path d="M165 258 V278" class="fg-arrow" marker-end="url(#L08w)"/>
            <rect x="40" y="280" width="250" height="40" rx="10" class="fg-box"/>
            <text x="165" y="305" text-anchor="middle" class="t-sm t-b">5 Name it: vessel size + organs</text>
          </svg>
      - kind: reveal
        page: 130
        prompt: "ليه الـ cholesterol emboli والـ ergot والـ thoracic outlet syndrome داخلين في قايمة الـ mimics، وهم مش التهاب أصلًا؟"
        quote: "Cholesterol emboli syndrome."
        answer: |
          لأن الـ vasculitis بتبان للعيان والدكتور على هيئة **ischaemia**: عضو أو طرف الدم مش واصله. وأي حاجة تانية تقفل الوعاء أو تضيّقه هتعمل **نفس الصورة** من غير ما يكون فيه التهاب في الجدار.

          التفسير المقبول (مش في الكتاب) لكل واحد:
          - **Cholesterol emboli syndrome**: بلورات cholesterol بتطلع من plaque بعد قسطرة أو جراحة وتسد الشرايين الصغيرة، فتعمل صوابع زرقا و livedo وفشل كلوي، وده شبه الـ small/medium vessel vasculitis بالظبط.
          - **Vasoconstrictor drugs (ergot)**: الشريان بيتقفل من ==spasm== مش من التهاب، فتلاقي برودة وغرغرينا في الأطراف.
          - **Thoracic outlet syndrome**: ضغط ميكانيكي على الـ subclavian عند رفع الدراع، فالنبض يضعف في دراع واحد، وده شبه الـ Takayasu.
          - **Hypertensive arteriopathy**: الضغط العالي جدًا بيأذي جدار الشرايين الصغيرة ويعمل نزيف وفشل أعضاء.

          يعني القاعدة: قبل ما تقول vasculitis، اسأل نفسك **الوعاء مقفول ليه؟** التهاب ولا سدة ولا spasm ولا ضغط من برّه.
      - kind: explain
        page: 130
        title: "Sepsis و DIC و TTP و الـ lymphoma: ليه دول كمان؟"
        quote: "Thrombotic thrombocytopenic purpura (TTP)."
        text: |
          الكتاب بيكمّل القايمة بـ **sepsis و DIC**، **sarcoidosis**، **thrombotic thrombocytopenic purpura (TTP)**، و **lymphoma و hairy cell leukaemia**، وكمان **viral infections** زي HIV و CMV و HBV و HCV.

          التفسير المقبول (مش في الكتاب) للرابط بينهم:
          - **Sepsis و DIC**: purpura وفشل أعضاء متعددة وسخونية، يعني نفس **multisystem** الصورة اللي بتخليك تشك في vasculitis.
          - **TTP**: جلطات صغيرة جوه الـ small vessels بتعمل purpura وكلية ومخ، بس السبب ==جلطة مش التهاب==، والعلاج مختلف تمامًا، وsteroids لوحدها مش هتنقذه.
          - **Lymphoma و hairy cell leukaemia**: سخونية ونزول وزن و ESR عالي، نفس الـ constitutional symptoms.
          - **Sarcoidosis**: granulomas في أعضاء كتير، زي الـ granulomatous vasculitis.
          - **الـ viruses**: مش بس بتقلّد، دي ممكن **تعمل** vasculitis حقيقية: الـ HBV مع الـ PAN (ص 137)، والـ HCV مع الـ cryoglobulinaemia (ص 162).

          يعني الـ mimics مش قايمة للحفظ؛ كل واحد فيهم بيقول **ليه لازم تثبت الالتهاب** قبل ما تكتب steroids وcyclophosphamide.
      - kind: try
        items: [rheum.L08.042, rheum.L08.043, rheum.L08.044, rheum.L08.045, rheum.L08.194]
    recap:
      - "Workup: CBC، urinalysis (casts = GN)، serum proteins، ANCA، كلية وكبد، echo، angiography، و biopsy هي الإثبات."
      - "c-ANCA = cytoplasmic = PR3 = GPA؛ p-ANCA = perinuclear = MPO = MPA."
      - "Mimics: endocarditis، APS، HIV/CMV/HBV/HCV، cholesterol emboli، ergot، hypertensive arteriopathy، thoracic outlet، sepsis/DIC، sarcoid، TTP، lymphoma."
      - "Endocarditis قبل steroids دايمًا: cultures و echo."
