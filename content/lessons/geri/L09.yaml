          </svg>
      - kind: explain
        page: 156
        title: "Replicative senescence"
        quote: "Replicative senescence is the age-related shortening of telomere length and impairment of cell division. Clonal expansion is diminished in old, with T cell unable to replicate as avidly upon binding with an antigen."
        text: |
          الـ ==telomeres بتقصر== والخلية ما بتعرفش تنقسم كويس.

          فالـ **clonal expansion** بيقل: الـ T cell لما تمسك antigen ما بتتكاترش بنفس الحماس بتاع زمان.

          ليه ده بيفرق؟ التفسير المقبول (مش في الكتاب): الـ T cell اللي بتلاقي الـ antigen بتاعها لازم تتكاتر بسرعة لجيش كبير (ده الـ clonal expansion) عشان تلحق الميكروب قبل ما هو يتكاتر. ولما الـ telomeres تقصر، كل خلية عندها عدد مرات انقسام أقل، فالجيش بيطلع **أصغر وأبطأ**. النتيجة: الـ infection بتلحق تنتشر قبل ما الرد يكمل.
      - kind: explain
        page: 156
        quote: "The decrease in naive cells and the increase in memory cells, make the immune system with an intact capacity to defend against previously recognized pathogen& decrease ability to respond to novel antigen."
        title: "القديم سليم والجديد لأ"
        text: |
          الكتاب بيقول إن **قلة الـ naive** و **زيادة الـ memory** بيعملوا جهاز مناعي:
          - ==سليم== قدام الـ pathogen اللي شافه قبل كده
          - ==ضعيف== قدام الـ **novel antigen**

          ليه؟ الـ memory cells «فاكرة» عدو قديم بعينه، فلما يرجع بترد على طول. لكن العدو الجديد محتاج **naive cell** لسه ما اتبرمجتش، ودول هما اللي قلّوا.

          التفسير المقبول (مش في الكتاب) في الكلينك: ده بيفسر ليه الكبير ممكن يعدّي البرد المعتاد عادي، بس يقع جامد من فيروس أول مرة يشوفه، وليه التطعيم بـ antigen جديد بيشتغل عنده أضعف.
      - kind: mnemonic
        page: 156
        quote: "Figure (Medscape; Source: Immunotherapy © 2013 Future Medicine Ltd): Aging → Immunosenescence (driven also by CMV, Obesity, Stress), with thymic involution, leading to:\n  A. Changes in lymphocyte subpopulations: ↓ Naive, ↑ Memory\n  B. Inflammaging: ↑ IL-6, TNF-α, PCR, ↓ IL-10\n  C. Accumulation of senescent T cells: CD28 lost, KLRG1, CD57\n  D. Telomere shortening and resistance to apoptosis\n  → ↑ Autoimmune diseases, cardiovascular diseases and cancer; ↑ Severity of infections; ↓ Response to vaccines\nImmunosenescence\nFigure: AGING → Immune system dysregulation → Immunosenescence; AGING also acts on Endocrine function, Neural function, Cardiovascular health, Muscle homeostasis, Glucose metabolism, Oxidative stress (two-way with immunosenescence).\n| Immunosenescence | Leads to |\n|---|---|\n| ↓ Naive CD4+ T cells | Infection |\n| ↓ Immunosurveillance | Cancer |\n| Inflam-Aging | Chronic inflammatory diseases |\n| Loss of specificity | Autoimmune disorders |\n| Nutrition | Frailty |\nImmune Risk Phenotype (+): CD8+CD28-CD57+; CD4:CD8 < 1; CMV seropositivity; T-cell proliferation"
        word: "CMV 1"
        parts:
          - { key: "C", text: "CD8+ CD28− CD57+ cells pile up" }
          - { key: "M", text: "Mitogen and T-cell proliferation is poor" }
          - { key: "V", text: "Virus: cytomegalovirus (CMV) seropositivity" }
          - { key: "1", text: "CD4:CD8 ratio below 1" }
        hook: "الـ **immune risk phenotype** في صورة الـ immunosenescence في الكتاب اسمه تقريبًا ==CMV 1==: فيروس الـ CMV، والـ ratio تحت 1. وده الكبير اللي مناعته في خطر."
      - kind: reveal
        page: 156
        quote: "Figure (Medscape; Source: Immunotherapy © 2013 Future Medicine Ltd): Aging → Immunosenescence (driven also by CMV, Obesity, Stress), with thymic involution, leading to:\n  A. Changes in lymphocyte subpopulations: ↓ Naive, ↑ Memory\n  B. Inflammaging: ↑ IL-6, TNF-α, PCR, ↓ IL-10\n  C. Accumulation of senescent T cells: CD28 lost, KLRG1, CD57\n  D. Telomere shortening and resistance to apoptosis\n  → ↑ Autoimmune diseases, cardiovascular diseases and cancer; ↑ Severity of infections; ↓ Response to vaccines\nImmunosenescence\nFigure: AGING → Immune system dysregulation → Immunosenescence; AGING also acts on Endocrine function, Neural function, Cardiovascular health, Muscle homeostasis, Glucose metabolism, Oxidative stress (two-way with immunosenescence).\n| Immunosenescence | Leads to |\n|---|---|\n| ↓ Naive CD4+ T cells | Infection |\n| ↓ Immunosurveillance | Cancer |\n| Inflam-Aging | Chronic inflammatory diseases |\n| Loss of specificity | Autoimmune disorders |\n| Nutrition | Frailty |\nImmune Risk Phenotype (+): CD8+CD28-CD57+; CD4:CD8 < 1; CMV seropositivity; T-cell proliferation"
        prompt: "الـ immunosenescence بتوصل لإيه في الآخر؟"
        answer: |
          حسب الـ figure في الكتاب:
          - ==Infection== أكتر وأشد، و **response to vaccines** أضعف
          - **Cancer** (immunosurveillance أقل)
          - **Chronic inflammatory diseases** و **autoimmune disorders**
          - **Frailty**

          واللي بيسرّعها: **cytomegalovirus (CMV)**، **obesity**، و **stress**.
