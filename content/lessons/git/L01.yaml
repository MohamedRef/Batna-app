      - kind: explain
        page: 27
        quote: "Inhibition of constitutively expressed cyclooxygenase 1 (COX-1)-derived prostaglandins which is regarded as the main mechanism."
        title: "الـ prostaglandins كانوا بيحموا إيه؟"
        text: |
          الكتاب: الـ NSAIDs بتضرب **systemic** و **local**، والـ ==systemic (COX-1)== هو الـ **main mechanism**.

          النتيجة اللي الكتاب بيعدّها، والـ «ليه» التفسير المقبول (مش في الكتاب):
          - **Low mucus and bicarbonate**: دي طبقة الحماية اللي بتعادل الحمض على السطح، فبتقل.
          - **Inhibition of cell proliferation**: أي خدش صغير ما بيتصلحش بسرعة.
          - **Decreased mucosal blood flow**: الدم هو اللي بيشيل الحمض اللي دخل ويجيب bicarbonate، فلما يقل الغشاء يموت.

          والـ **topical**: الـ NSAID **weak acid**، في الحمض بيبقى ==nonionized lipophilic== فيعدّي جوه الخلية، وجوه الـ pH متعادل فيتأيّن ويتحبس (**ion trapping**). وكمان بيغيّر الـ mucus فالـ H+ والـ pepsin يرجعوا (**back diffusion**)، وبيفعّل الـ **lipoxygenase** فيطلع TNF و leukotrienes.
      - kind: check
        page: 27
        quote: "NSAIDs are weak acids that remain in a nonionized lipophilic form when found within the acid environment of the stomach and migrate across lipid membranes of epithelial cells, leading to cell injury once trapped intracellularly in an ionized form."
        question: "Which NSAID mechanism does the lecture call the main one?"
        options:
          - "Inhibition of COX-1-derived prostaglandins"
          - "Ion trapping of the nonionized drug in epithelial cells"
          - "Back-diffusion of H+ and pepsin"
          - "Activation of the lipoxygenase pathway"
        answer: 0
        why:
          - "صح: الـ **COX-1** inhibition هو **the main mechanism**."
          - "ده **topical** damage، مش الأساسي."
          - "ده topical كمان، بسبب تغيّر الـ surface mucous layer."
          - "ده topical، بيطلّع TNF و leukotrienes."
      - kind: explain
        page: 27
        quote: "Pain is epigastric or retrosternal; gnawing, burning discomfort (dyspepsia) that is relieved by intake of certain foods or liquids (eg, ice cream, milk) or antacids,(DD is CAD)"
        title: "المريض بيشتكي من إيه؟"
        text: |
          ممكن يبقى **asymptomatic**. ولو **uncomplicated**:
          - ألم **epigastric أو retrosternal**، gnawing أو burning، ==بيهدى== بالأكل (ice cream، لبن) أو antacids. والـ differential diagnosis (DD) المهم: **coronary artery disease (CAD)**.
          - **DU و GU مش بيتفرقوا clinically**، بس الـ **hunger** والـ **nocturnal pain** أكتر مع الـ DU.
          - وممكن: weight loss، early satiety، bloating، loss of appetite، nausea/vomiting، halitosis.

          ليه الأكل بيهدّي؟ التفسير المقبول (مش في الكتاب): الأكل واللبن بيعادلوا الحمض لفترة. وليه الـ DU بيصحّي بالليل؟ لأن الحمض بيفضل يتفرز والمعدة فاضية، فمفيش أكل يعادله وهو نازل على الـ duodenum.
      - kind: explain
        page: 28
        quote: "Many patients present initially with complications of disease, with bleeding, perforation, and gastric outlet obstruction being most common"
        title: "أول ظهور ممكن يبقى complication"
        text: |
          ناس كتير ==أول مرة== تيجي بـ complication، وأشهرهم تلاتة:
          - **Bleeding**: hematemesis أو melena.
          - **Perforation**: **sudden onset** ألم epigastric شديد.
          - **Gastric outlet obstruction**: nausea و vomiting.

          ليه ممكن ما يحسش قبلها؟ التفسير المقبول (مش في الكتاب): خصوصًا مع الـ NSAIDs، لأنها نفسها مسكّن، فالألم بيتغطى لحد ما القرحة تنزف أو تخرّم.
