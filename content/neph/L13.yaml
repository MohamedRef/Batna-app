  # ---------- cases and essays ----------
  - id: neph.L13.104
    kind: case
    topic: screening
    stem: A 58-year-old man has had T2DM for 10 years and hypertension. Routine labs are due.
    steps:
      - question: What does yearly DKD screening include?
        options: ["Urine albumin/creatinine ratio plus creatinine-based eGFR (CKD-EPI)", "Urine dipstick for protein plus a fasting glucose", "Kidney ultrasound plus a urine dipstick for protein", "Serum cystatin C alone as the only kidney test"]
        answer: 0
        why: "Screening = ACR plus creatinine and CKD-EPI eGFR (p431-432). Dipsticks miss microalbuminuria."
      - reveal: "ACR 140 and 190 mg/g on two samples 3 months apart; eGFR 54 then 52 on the same two visits. He has background retinopathy. BP 146/88."
        question: How do you classify him?
        options: ["DKD with microalbuminuria and eGFR <60", "Macroalbuminuria with a preserved eGFR", "Non-diabetic disease that needs a biopsy", "Normal ageing kidney, no DKD"]
        answer: 0
        why: "Two of three samples 30-300 mg/g = microalbuminuria; with eGFR <60 for >3 months = DKD (p426, p432). Retinopathy supports DKD."
      - question: Which BP target does the lecture give for him?
        options: ["130/80 mm Hg (albuminuria)", "140/90 mm Hg", "150/90 mm Hg", "120/70 for everyone"]
        answer: 0
        why: "ADA: 130/80 with albuminuria; JNC 8: 140/90 for diabetes or CKD in general (p438)."
      - reveal: "He is on metformin 1 g twice daily. Repeat eGFR 41."
        question: What happens to metformin?
        options: [Halve the dose, Stop it, Keep full dose, Switch to glimepiride]
        answer: 0
        why: "eGFR 30-44: halve the dose (Figure 27, p444); stop below 30. Glimepiride is stage 1-2 only."
      - question: Which first-line drug should be added for kidney protection?
        options: [SGLT2 inhibitor, Acarbose, Glibenclamide, Pioglitazone]
        answer: 0
        why: "First-line in T2D with CKD = metformin + SGLT2 inhibitor (Figure 23, p443)."
    src: { page: 432, quote: "Screening for DKD should also include measurement of serum creatinine and eGFR." }
    status: unverified
  - id: neph.L13.105
    kind: case
    topic: pathogenesis
    stem: A 22-year-old with type 1 diabetes for 3 years has a measured GFR of 125 mL/min and transient albuminuria after a football match.
    steps:
      - question: Which DKD stage best fits?
        options: [Latent nephropathy (2-5 years), Hypertrophy-hyperfunction (0-2 years), Overt nephropathy, Microalbuminuria stage]
        answer: 0
        why: "2-5 years, GFR normal or high, microalbuminuria only with exercise or ketosis (p431)."
      - question: What drives the early hyperfiltration of diabetes?
        options: ["Raised intraglomerular pressure from more proximal Na-glucose reabsorption and less distal Na", "Immune complex deposition along the glomerular basement membrane with inflammation", "Renal artery stenosis activating renin and constricting the efferent arteriole", "Acute tubular necrosis lowering proximal sodium and glucose reabsorption"]
        answer: 0
        why: "Hyperfiltration reflects raised intraglomerular pressure (p426); more SGLT2 reabsorption means less distal Na and less tubuloglomerular feedback (p441)."
      - question: When does his annual screening start?
        options: ["5 years after onset (in 2 years)", "Already overdue (from diagnosis)", "Now, 3 years after diagnosis", "At age 30, whatever the duration"]
        answer: 0
        why: "T1DM screening starts 5 years after onset (p431)."
    src: { page: 431, quote: "Latent nephropathy (2-5y) GFR normal or high normal histological lesions, microalbuminuria may occur with exercise or ketosis" }
    status: unverified
  - id: neph.L13.106
    kind: essay
    topic: definition
    prompt: Define diabetic kidney disease and distinguish it from diabetic nephropathy. Outline its pathology.
    outline:
      - "Definition: CKD in diabetes, ACR ≥30 mg/g and/or eGFR <60 for ≥3 months; DN = histologic diagnosis"
      - "Epidemiology: 20-50% of T2DM, leading cause of ESKD (50%)"
      - "LM: mesangial expansion, Kimmelstiel-Wilson nodules, microaneurysms, tip lesion"
      - "IF: linear IgG and albumin; EM: GBM thickening first, no immune complexes"
    src: { page: 426, quote: "Typically, DKD is defined by the presence of chronic kidney disease (CKD) characterized by persistently (at least 3 months) elevated urinary albumin excretion (albumin-to-creatine ratio ≥ 30 mg/g) and/or low estimated glomerular filtration rate (eGFR < 60 mL/min/1.73 m2) in a person with diabetes." }
    status: unverified
  - id: neph.L13.107
    kind: essay
    topic: screening
    prompt: Discuss screening for diabetic kidney disease and when to suspect another diagnosis.
    outline:
      - "When: yearly from T2DM diagnosis; 5 years after T1DM onset"
      - "How: 24-h urine, timed collection or spot ACR; 2 of 3 abnormal over 3-6 months; >300 single sample; plus creatinine and CKD-EPI eGFR"
      - "False positives: CHF, exercise within 24 h, fever, infection, marked hyperglycemia, menstruation"
      - "Red flags: no retinopathy, low or falling GFR, >30% GFR drop on ACEi/ARB, active sediment, rapid proteinuria, refractory HTN, systemic disease"
    src: { page: 431, quote: "Screening for microalbuminuria can be completed in three ways:" }
    status: unverified
  - id: neph.L13.108
    kind: essay
    topic: sglt2
    prompt: Outline the management of diabetic kidney disease.
    outline:
      - "Classic: glycemia (A1C <7% ADA, 7-8% ACP), BP (140/90 JNC 8; 130/80 with albuminuria), lipids, anemia, phosphate"
      - "RAAS blockade plus MRA (spironolactone, finerenone: FIDELIO-DKD)"
      - "SGLT2 inhibitors (EMPA-REG, CANVAS, DAPA-CKD) and GLP-1 RA; metformin by eGFR"
      - "Future: ETA antagonists (atrasentan), anti-TGF-β, protein kinase C inhibitors, AGE blockers; holistic KDIGO approach"
    src: { page: 438, quote: "Glycemic control. Blood pressure control. Treatment of dyslipidemia. Management of anemia. Management of Hyperphosphatemia." }
    status: unverified
