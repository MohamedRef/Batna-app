  - id: rheum.L03.lesson4
    title: "Type II: الـ antibody على باب الخلية"
    hook: "في type II الـ antibody مش بيلف في الدم: بيقف على باب الخلية نفسها، يا يكسره يا يقفله يا يفتحه غصب."
    minutes: 6
    pages: [61, 63]
    topics: [type2]
    goals:
      - "تعرف تلات طرق بتموت بيها الخلية في type II"
      - "تعدّ أمثلة الـ complement lysis"
      - "تفرّق Graves عن myasthenia gravis"
    status: unverified
    steps:
      - kind: explain
        page: 61
        quote: "the direct binding of antibody (IgG or IgM) to cell surface antigens."
        title: "Direct antibody-mediated cytotoxicity"
        text: |
          ==Type II== = antibody (**IgG أو IgM**) بيمسك في **antigen على سطح الخلية** ← cell lysis.

          الخلية بتموت بـ:
          1. **Phagocytosis**
          2. **Complement activation**
          3. ==ADCC== (antibody-dependent cell-mediated cytotoxicity) بالـ **NK cells**
      - kind: figure
        page: 62
        quote: "activation of complement via the classical pathway"
        title: "تلات طرق للقتل"
        alt: "A target cell covered in antibodies in the centre. Left: complement activated by the classical pathway, arrow down to lysis. Bottom: antibody acts as opsonin, a phagocyte with Fc and C3b receptors engulfs the cell. Right: an NK cell binds the antibody and kills the cell, labelled ADCC."
        caption: "1) complement (classical pathway) ← lysis. 2) opsonin ← phagocytosis. 3) NK cell ← ADCC."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R03b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <circle cx="165" cy="95" r="44" class="fg-good"/>
            <text x="165" y="92" text-anchor="middle" class="t-sm t-b">target</text>
            <text x="165" y="108" text-anchor="middle" class="t-sm t-b">cell</text>
            <path d="M165 51v-12M195 64l8-8M209 95h12M135 64l-8-8M121 95h-12M165 139v12" class="fg-ink" stroke-width="2"/>
            <text x="165" y="22" text-anchor="middle" class="t-sm t-mut">IgG / IgM on surface</text>
            <text x="8" y="72" class="t-sm t-b">1 complement</text>
            <text x="8" y="88" class="t-sm t-mut">classical pathway</text>
            <path d="M50 96v30" class="fg-arrow-bad" marker-end="url(#R03b)"/>
            <text x="34" y="146" class="t-sm t-bad">lysis</text>
            <circle cx="290" cy="95" r="22" class="fg-acc"/>
            <text x="290" y="99" text-anchor="middle" class="t-sm">NK</text>
            <path d="M266 95h-38" class="fg-arrow-bad" marker-end="url(#R03b)"/>
            <text x="248" y="134" class="t-sm t-b">3 ADCC</text>
            <circle cx="165" cy="196" r="20" class="fg-acc"/>
            <text x="165" y="200" text-anchor="middle" class="t-sm">Mφ</text>
            <path d="M165 174v-14" class="fg-arrow-bad" marker-end="url(#R03b)"/>
            <text x="194" y="190" class="t-sm t-b">2 opsonin</text>
            <text x="194" y="206" class="t-sm t-mut">Fc + C3b receptors</text>
          </svg>
      - kind: explain
        page: 62
        quote: "Effector mechanisms of anti-body mediated disease."
        title: "Effector mechanisms: complement و Fc receptors"
        text: |
          رسمة صفحة 62 (A و B):

          - **Opsonization**: الخلية متغطية بـ antibody و ==C3b== ← الـ phagocyte يمسكها بالـ **Fc** والـ **C3b receptors** ويبلعها.
          - **Inflammation**: antibody على نسيج ← Fc receptors على الـ neutrophils + complement ← ==C5a و C3a== ← neutrophil activation ← inflammation و tissue injury.
      - kind: explain
        page: 63
        quote: "Examples of type II reactions in which complement is activated and cells are destroyed"
        title: "أمثلة بتكسّر الخلايا"
        text: |
          Complement بيتنشّط والخلايا بتتكسّر في:

          - ==Incompatible blood transfusion==
          - **Haemolytic disease of the newborn**
          - **Autoimmune haemolytic anaemia**
      - kind: table
        page: 63
        quote: "In Graves disease stimulating antibodies are directed against the receptor for TSH."
        title: "يفتح ولا يقفل؟"
        columns: ["Disease", "Target", "Antibody"]
        rows:
          - ["Graves", "TSH receptor", "Stimulates without ligand"]
          - ["Myasthenia gravis", "ACh receptor", "Blocks ligand binding"]
        hide: [[0, 2], [1, 2]]
      - kind: aside
        tone: analogy
        page: 63
        quote: "In myasthenia gravis blocking antibodies are directed against the Ach receptor."
        text: "في Graves الـ antibody زي واحد ساند على جرس الباب: الغدة شغالة طول الوقت من غير TSH. في myasthenia زي واحد حاطط لزق على الجرس: الـ ACh بييجي ومش عارف يرن. والاتنين من غير ما الخلية تتكسر."
      - kind: check
        page: 63
        quote: "Several disease are caused by antibody directed against cell surface receptors which can stimulate or block the receptor."
        question: "A woman has fatigable ptosis and diplopia. Which antibody mechanism fits?"
        options: ["Blocking antibody to the ACh receptor", "Stimulating antibody to the TSH receptor", "IgE on mast cells", "Immune complexes in glomeruli"]
        answer: 0
        why:
          - "صح: myasthenia gravis = blocking antibodies ضد الـ ACh receptor."
          - "ده Graves."
          - "ده type I."
          - "ده type III."
      - kind: try
        items: [rheum.L03.063, rheum.L03.064, rheum.L03.069, rheum.L03.070, rheum.L03.073]
    recap:
      - "Type II: IgG/IgM على antigen في سطح الخلية."
      - "القتل: complement (classical) ← lysis، opsonin ← phagocytosis، NK ← ADCC."
      - "Lysis: transfusion غلط، HDN، autoimmune haemolytic anaemia."
      - "Graves يفتح الـ TSH receptor، myasthenia يقفل الـ ACh receptor."
    practice: [rheum.L03.063, rheum.L03.064, rheum.L03.065, rheum.L03.066, rheum.L03.067, rheum.L03.068, rheum.L03.069, rheum.L03.070, rheum.L03.071, rheum.L03.072, rheum.L03.073, rheum.L03.074, rheum.L03.100]
