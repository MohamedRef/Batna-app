  - id: res.L03.028
    kind: card
    topic: types
    front: In the lecture's qualitative example on visual display units (VDU), what is the research question?
    back: >-
      To explore how psychosocial aspects of working with VDUs are related to job stress, and what their
      consequences are for mental and physical health. Sub-questions then define each term: psychosocial
      aspects, job stress, physical and mental health.
    src: { page: 19, quote: "Qualitative research:\n  Research topic: Visual display units\n  Research problem: Do visual display units affect the health of users?\n  Research question: To explore how psychosocial aspects of working with visual display units (VDU) are related to job stress and what their consequences are for mental and physical health.\n  Sub-questions:\n    What are \"psychosocial aspects\" of work and how are they detected and determined?\n    What is \"job stress\" and how is it detected and determined?\n    What is meant by \"physical and mental health\" and how is it detected and determined?" }
    status: unverified
  - id: res.L03.029
    kind: card
    topic: types
