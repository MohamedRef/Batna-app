schema: batna.lesson/v1
lecture: dm.L15
lessons:
  # ------------------------------------------------------------------
  - id: dm.L15.lesson1
    title: "DKA و HHS: أخين مش توأم"
    hook: "الاتنين سكر عالي وجفاف، بس واحد حمضي والتاني تقيل. والفرق كله في كمية الإنسولين."
    minutes: 8
    pages: [185, 187]
    topics: [background, pathogenesis, clinical]
    goals:
      - "تشرح ليه DKA فيه كيتونات و HHS لأ"
      - "تقارن الوبائيات والوفيات"
      - "تعدّ الـ precipitating factors"
    status: unverified
    steps:
      - kind: explain
        page: 185
        quote: "DKA: Absolute insulin deficiency HHS: Relative insulin deficiency"
        title: "أخطر مضاعفتين حادتين"
        text: |
          الـ ==DKA== والـ ==HHS== أخطر **acute metabolic complications** للسكر.

          - **DKA**: ==absolute insulin deficiency==.
          - **HHS**: **relative insulin deficiency**.

          حوالي **1%** من دخول مرضى السكر المستشفى بسببهم، والـ DKA زاد **55%** في العشر سنين اللي فاتوا، خصوصًا تحت 45 سنة.
      - kind: figure
        page: 186
        quote: "Pathogenesis of DKA & HHS"
        title: "ليه واحد فيه كيتونات والتاني لأ؟"
        alt: "Two stacked panels. DKA: absolute insulin deficiency plus counter-regulatory hormones cause lipolysis, free fatty acids to the liver, ketogenesis and ketoacidosis, together with hyperglycaemia and osmotic diuresis. HHS: relative insulin deficiency keeps ketogenesis absent or minimal, while hyperglycaemia, osmotic diuresis and decreased fluid intake cause dehydration and hyperosmolarity."
        caption: "شوية إنسولين كفاية يقفلوا مصنع الكيتونات، بس مش كفاية يدخلوا السكر الخلايا."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L15a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="10" y="10" width="310" height="150" rx="8" class="fg-bad"/>
            <text x="20" y="34" class="t-b">DKA · absolute deficiency</text>
            <text x="20" y="58" class="t-sm">No insulin + counter-regulatory hormones</text>
            <text x="20" y="82" class="t-sm">Lipolysis → FFA to liver → ketogenesis</text>
            <text x="20" y="106" class="t-sm">Hyperglycemia → osmotic diuresis</text>
            <text x="20" y="138" class="t-b t-bad">Ketoacidosis</text>
            <rect x="10" y="172" width="310" height="150" rx="8" class="fg-acc"/>
            <text x="20" y="196" class="t-b">HHS · relative deficiency</text>
            <text x="20" y="220" class="t-sm">Some insulin: ketogenesis absent/minimal</text>
            <text x="20" y="244" class="t-sm">Hyperglycemia → osmotic diuresis</text>
            <text x="20" y="268" class="t-sm">+ decreased fluid intake</text>
            <text x="20" y="300" class="t-b t-acc">Dehydration + hyperosmolarity</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 185
        quote: "DKA: Absolute insulin deficiency HHS: Relative insulin deficiency"
        text: |
          الإنسولين زي البواب: لو **مش موجود خالص** (DKA)، الجسم يفتكر إنه جعان ويكسّر الدهون، فالكيتونات تغرق الدنيا. لو **موجود بس ضعيف** (HHS)، يقدر يقفل باب الدهون، بس مش قادر يدخّل السكر، فالسكر يتراكم والمية تطلع في البول لحد ما المريض ينشف.
      - kind: table
        page: 186
        quote: "Mortality attributed to HHS is considerably higher 5–20%."
        title: "مين وقد إيه؟"
        columns: ["", "DKA", "HHS"]
        rows:
          - ["العمر", "18-44", "45-64"]
          - ["النوع", "T1D (70.6%)", "غالبًا T2D"]
          - ["Mortality", "<1% في الكبار", "5-20%"]
        hide: [[0, 1], [0, 2], [2, 1], [2, 2]]
      - kind: explain
        page: 186
        quote: "Infections (most common, 30-40%)"
        title: "إيه اللي بيفجّر الـ DKA؟"
        text: |
          - **Infection**: الأشهر، ==30-40%==.
          - Trauma، surgery، CV events، و drugs.
          - **Insulin omission** أو **new-onset T1DM**: 15-25%.
          - ==مفيش سبب==: 20-25%.

          و 2/3 عندهم T1DM معروف. ولو DKA جه لمريض **T2DM**: "==look under the sheets==" ودوّر على السبب بقوة.
      - kind: check
        page: 187
        quote: "When DKA occurs in an individual with T2DM, the clinician should ―look under the sheets‖"
        question: "A 60-year-old with T2DM on metformin presents in DKA. What does the lecture tell you to do?"
        options:
          - "Search intensively for a precipitating factor"
          - "Assume insulin omission"
          - "Diagnose new T1DM"
          - "Treat as HHS"
        answer: 0
        why:
          - "صح: look under the sheets، دوّر على infection، MI، drugs..."
          - "مش على إنسولين أصلًا."
          - "ممكن، بس الكتاب بيقول دوّر على الـ precipitant الأول."
          - "الكيتونات والـ acidosis = DKA."
      - kind: mnemonic
        page: 187
        quote: "Restricted water intake due to altered thirst response of the elderly."
        word: "IWD"
        hook: "الـ HHS بيجي من:"
        parts:
          - { key: "I", text: "Infection: الأشهر" }
          - { key: "W", text: "Water restricted: العطش بيضعف في الكبار" }
          - { key: "D", text: "Delayed recognition: 20% ملهمش سكر معروف" }
      - kind: sort
        page: 187
        quote: "Metabolic acidosis: GIT, Kussmaul‘s Breathing"
        prompt: "العلامة دي أقرب لأنهي واحد؟"
        bins: ["DKA", "HHS"]
        cards:
          - { text: "Acetone breath", bin: 0 }
          - { text: "Kussmaul breathing", bin: 0 }
          - { text: "Abdominal pain and vomiting", bin: 0 }
          - { text: "Marked dehydration, minimal ketosis", bin: 1 }
          - { text: "Elderly, no known diabetes", bin: 1 }
        why: "الـ DKA: كيتونات (ريحة acetone) و acidosis (Kussmaul و GIT). الـ HHS: جفاف شديد وكيتونات قليلة، وغالبًا في الكبار."
      - kind: try
        items: [dm.L15.001, dm.L15.005, dm.L15.006, dm.L15.010, dm.L15.013]
    recap:
      - "DKA = absolute insulin deficiency؛ HHS = relative."
      - "DKA: شباب 18-44، T1D، mortality <1%. HHS: 45-64، mortality 5-20%."
      - "DKA precipitants: infection 30-40%، insulin omission/new T1D 15-25%، ولا حاجة 20-25%."
      - "DKA في T2DM: look under the sheets."
    practice: [dm.L15.001, dm.L15.002, dm.L15.003, dm.L15.004, dm.L15.005, dm.L15.006, dm.L15.007, dm.L15.008, dm.L15.009, dm.L15.010, dm.L15.011, dm.L15.012, dm.L15.013, dm.L15.064]
  # ------------------------------------------------------------------
  - id: dm.L15.lesson2
    title: "D و K و A: اقرا الأرقام"
    hook: "تلات حروف بتشخص الـ DKA، وتلات أرقام بتقولك يروح الوارد ولا العناية."
    minutes: 9
    pages: [188, 189]
    topics: [diagnosis, labs]
    goals:
      - "تحفظ criteria الـ DKA والـ HHS"
      - "تصنّف الـ DKA mild/moderate/severe"
      - "تصحح الصوديوم وتفهم البوتاسيوم"
    status: unverified
    steps:
      - kind: mnemonic
        page: 188
        quote: "Diagnostic criteria DKA"
        word: "DKA"
        hook: "الاسم نفسه هو الـ criteria:"
        parts:
          - { key: "D", text: "Diabetes: glucose ≥200 mg/dL أو سكر معروف" }
          - { key: "K", text: "Ketosis: β-hydroxybutyrate ≥3.0 mmol/L أو urine ketones 2+" }
          - { key: "A", text: "Acidosis: pH <7.3 و/أو bicarbonate <18 mmol/L" }
      - kind: figure
        page: 188
        quote: "DKA classification and suggested level of care by severity: mild, moderate, or severe"
        title: "سلّم الشدة"
        alt: "Three stacked rungs from mild to severe DKA. Mild: pH above 7.25 to below 7.30 or bicarbonate 15-18, BOHB 3-6, alert, regular ward. Moderate: pH 7.0-7.25, bicarbonate 10 to below 15, BOHB 3-6, alert or drowsy, step-down unit. Severe: pH below 7.0, bicarbonate below 10, BOHB above 6, stupor or coma, ICU."
        caption: "كل ما الـ pH والـ bicarbonate ينزلوا، المريض يطلع درجة في الرعاية."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="86" rx="8" class="fg-good"/>
            <text x="20" y="32" class="t-b">Mild → ward</text>
            <text x="20" y="54" class="t-sm">pH &gt;7.25 to &lt;7.30 or HCO3 15-18</text>
            <text x="20" y="74" class="t-sm">BOHB 3.0-6.0 · alert</text>
            <rect x="10" y="106" width="310" height="86" rx="8" class="fg-acc"/>
            <text x="20" y="128" class="t-b">Moderate → step-down</text>
            <text x="20" y="150" class="t-sm">pH 7.0-7.25 · HCO3 10 to &lt;15</text>
            <text x="20" y="170" class="t-sm">BOHB 3.0-6.0 · alert/drowsy</text>
            <rect x="10" y="202" width="310" height="86" rx="8" class="fg-bad"/>
            <text x="20" y="224" class="t-b">Severe → ICU</text>
            <text x="20" y="246" class="t-sm">pH &lt;7.0 · HCO3 &lt;10</text>
            <text x="20" y="266" class="t-sm">BOHB &gt;6.0 · stupor/coma</text>
          </svg>
      - kind: check
        page: 188
        quote: "DKA classification and suggested level of care by severity: mild, moderate, or severe"
        question: "Glucose 410, BOHB 5.2, pH 7.15, HCO3 12, drowsy. Where does he go?"
        options:
          - "Step-down or intermediate care (moderate)"
          - "Regular ward (mild)"
          - "ICU (severe)"
          - "Home with s.c. insulin"
        answer: 0
        why:
          - "صح: pH 7.0-7.25 و HCO3 10-15 = moderate."
          - "الـ mild محتاج pH فوق 7.25."
          - "الـ severe تحت 7.0 أو HCO3 تحت 10 أو stupor."
          - "ده DKA مش حالة بيت."
      - kind: explain
        page: 188
        quote: "10% of the DKA population. RBG <200 mg/dL in the presence of ketosis and metabolic acidosis criteria of DKA"
        title: "Euglycemic DKA"
        text: |
          حوالي **10%** من الـ DKA: السكر ==أقل من 200== بس الكيتونات والـ acidosis موجودين.

          أسبابه:
          - **Insulin** اتاخد في الطريق للمستشفى.
          - **Food restriction** قبلها.
          - **Pregnancy** (الحمل ketogenic، شوف dm.L13).
          - ==SGLT2 inhibitors==.
      - kind: aside
        tone: trap
        page: 188
        quote: "SGLT2 inhibitors"
        text: |
          مريض على **empagliflozin** بيرجّع وسكره 165؟ ما تطمنش. الـ SGLT2 بيطلّع السكر في البول فالرقم يبان كويس، والكيتونات شغالة. ==اعمل gas وكيتونات==.
      - kind: table
        page: 189
        quote: "Diagnostic criteria HHS"
        title: "HHS criteria"
        columns: ["Criterion", "Value"]
        rows:
          - ["Glucose", "≥600 mg/dL"]
          - ["Effective osmolality", ">300 mOsm/kg (أو total >320)"]
          - ["Ketones", "BOHB <3.0 أو urine <2+"]
          - ["Acid-base", "pH ≥7.3 و HCO3 ≥15"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: reveal
        page: 189
        quote: "Usually low due to osmotic flux of water from the intracellular to the extracellular space by hyperglycemia."
        prompt: "مريض سكره 900 والصوديوم 148. ده معناه إيه؟"
        answer: "السكر العالي بيسحب مية من جوه الخلايا لبرا فالصوديوم ==المفروض ينزل==. لو طالع normal أو عالي يبقى فيه ==free water loss شديد== جدًا."
      - kind: explain
        page: 189
        quote: "Corrected Sodium = Measured Sodium + 0.016 x (Serum glucose - 100)"
        title: "تصحيح الصوديوم"
        text: |
          **Corrected Na** = measured Na + ==0.016 × (glucose − 100)==

          يعني زوّد **1.6 mEq/L** لكل **100 mg/dL** سكر فوق الـ 100.

          مثال الكتاب: سكر 500 وصوديوم 132 → 1.6 × 4 = 6.4 → **138.4**.
      - kind: check
        page: 189
        quote: "The sodium should be increased 1.6 mEq/L for every 100 mg/dL increase in serum glucose from a starting level of 100 mg/dL"
        question: "Glucose 600 mg/dL, measured Na 130 mEq/L. Corrected Na?"
        options:
          - "138"
          - "130"
          - "134"
          - "146"
        answer: 0
        why:
          - "صح: 1.6 × 5 = 8، و 130 + 8 = 138."
          - "ده المقاس من غير تصحيح."
          - "نسيت تحسب من 100: الفرق 500 مش 250."
          - "ده تصحيح أكبر من اللازم."
      - kind: explain
        page: 189
        quote: "Patients with low normal or low serum K have severe total-body K deficiency."
        title: "البوتاسيوم: الرقم بيكدب"
        text: |
          الـ **K** بيطلع عالي في الأول: ==insulin deficiency==، hypertonicity، و acidemia بيزقوه برا الخلايا.

          بس الحقيقة إن الجسم كله ناقص K (بيضيع في البول). فلو جالك ==low أو low-normal== من الأول، يبقى النقص ==شديد جدًا==.
      - kind: try
        items: [dm.L15.014, dm.L15.015, dm.L15.016, dm.L15.018, dm.L15.025]
    recap:
      - "DKA: glucose ≥200 (أو سكر معروف)، BOHB ≥3، pH <7.3 أو HCO3 <18."
      - "Severe: pH <7.0، HCO3 <10، BOHB >6، stupor → ICU."
      - "EuDKA: <200؛ insulin في الطريق، صيام، حمل، SGLT2."
      - "HHS: ≥600، osmolality >300، BOHB <3، pH ≥7.3 و HCO3 ≥15."
      - "Na: زوّد 1.6 لكل 100 فوق 100. K واطي في الأول = نقص شديد."
    practice: [dm.L15.014, dm.L15.015, dm.L15.016, dm.L15.017, dm.L15.018, dm.L15.019, dm.L15.020, dm.L15.021, dm.L15.022, dm.L15.023, dm.L15.024, dm.L15.025, dm.L15.026, dm.L15.027, dm.L15.065]
  # ------------------------------------------------------------------
  - id: dm.L15.lesson3
    title: "مية، إنسولين، بوتاسيوم"
    hook: "تلات عواميد في الـ algorithm. الترتيب غلط ممكن يموّت المريض، فلازم تحفظه."
    minutes: 10
    pages: [190, 192]
    topics: [fluids, insulin]
    goals:
      - "تقدّر الـ fluid deficit من النبض والضغط"
      - "تحفظ جرعات الإنسولين في الـ DKA والـ HHS"
      - "تعرف إمتى ما تديش إنسولين"
    status: unverified
    steps:
      - kind: figure
        page: 190
        quote: "When glucose reaches <250 mg/dL, reduce short-acting insulin dose to 0.05 units/kg/h i.v."
        title: "الـ algorithm في صفحة واحدة"
        alt: "Three stacked columns. IV fluids: severe hypovolaemia 0.9 percent saline 1 litre per hour, then replace 50 percent of the deficit over 8 to 12 hours, add 5 to 10 percent dextrose when glucose is below 250. Insulin: mild DKA subcutaneous 0.1 units per kg, moderate or severe DKA intravenous 0.1 units per kg per hour, HHS 0.05 units per kg per hour, then 0.05 when glucose below 250; keep glucose 150 to 200 in DKA and 200 to 250 in HHS. Potassium after urine output: below 3.5 give 10 to 20 mmol per hour and hold insulin, 3.5 to 5 add 10 to 20 mmol per litre, above 5 give none and check every 2 hours."
        caption: "المية الأول، الـ K قبل الإنسولين، والدكستروز لما السكر ينزل تحت 250."
        svg: |
          <svg viewBox="0 0 330 420" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="120" rx="8" class="fg-acc"/>
            <text x="20" y="32" class="t-b">1 · IV fluids</text>
            <text x="20" y="54" class="t-sm">Severe hypovolemia: 0.9% NaCl 1 L/h</text>
            <text x="20" y="74" class="t-sm">Then replace 50% of deficit in 8-12 h</text>
            <text x="20" y="94" class="t-sm">Glucose &lt;250: add 5-10% dextrose</text>
            <text x="20" y="114" class="t-sm t-mut">EuDKA: dextrose from the start</text>
            <rect x="10" y="140" width="310" height="140" rx="8" class="fg-box"/>
            <text x="20" y="162" class="t-b">2 · Insulin</text>
            <text x="20" y="184" class="t-sm">Mild DKA: s.c. analog 0.1 units/kg</text>
            <text x="20" y="204" class="t-sm">Mod/severe DKA: IV 0.1 units/kg/h</text>
            <text x="20" y="224" class="t-sm">HHS: IV 0.05 units/kg/h</text>
            <text x="20" y="244" class="t-sm">Glucose &lt;250: 0.05 units/kg/h</text>
            <text x="20" y="266" class="t-sm t-b">Keep DKA 150-200 · HHS 200-250</text>
            <rect x="10" y="290" width="310" height="120" rx="8" class="fg-bad"/>
            <text x="20" y="312" class="t-b">3 · Potassium (urine ~0.5 mL/kg/h)</text>
            <text x="20" y="334" class="t-sm">K &lt;3.5: 10-20 mmol/h, hold insulin</text>
            <text x="20" y="354" class="t-sm">K 3.5-5: 10-20 mmol per liter</text>
            <text x="20" y="374" class="t-sm">K &gt;5: no K, insulin, check every 2 h</text>
            <text x="20" y="396" class="t-sm t-mut">Labs every 2-4 h until stable</text>
          </svg>
      - kind: explain
        page: 190
        quote: "It usually started before insulin therapy especially in patients with severe volume contraction and hypokalemia."
        title: "المية الأول"
        text: |
          الهدف: نصلّح الـ ==volume depletion== (intravascular و interstitial و intracellular)، والـ **hypertonicity**، والـ **renal perfusion**.

          والسوائل ==قبل الإنسولين==، خصوصًا مع severe volume contraction أو hypokalemia. ليه؟ الإنسولين بيدخّل السكر والمية والـ K جوه الخلايا، فالدورة الدموية الناشفة تنشف أكتر والـ K يقع.
      - kind: table
        page: 190
        quote: "An orthostatic drop in B.P. ( >15/10 mmHg) indicates a 15-20 % decrease in ECV ( i.e. 3-4 liters)"
        title: "قيس الجفاف بالنبض والضغط"
        columns: ["العلامة", "ECV", "تقريبًا"]
        rows:
          - ["Pulse ↑ >10 والضغط ثابت", "~10%", "2 L"]
          - ["BP ↓ >15/10 orthostatic", "15-20%", "3-4 L"]
          - ["Supine hypotension", ">20%", ">4 L"]
        hide: [[0, 2], [1, 2], [2, 2]]
      - kind: reveal
        page: 191
        quote: "Hyperglycemia is corrected faster (6h) than acidosis (12h); RBG <250 mg/dl, 5-10% dextrose should be added"
        prompt: "السكر نزل 230 والـ pH لسه 7.18. نوقف الإنسولين؟"
        answer: "لأ! السكر بيتصلح في ==6 ساعات== والـ acidosis في ==12==. فنزوّد **5-10% dextrose** ونكمّل الإنسولين (ونقلله لـ 0.05) لحد ما الكيتونات تخلص، من غير ما نعمل hypo."
      - kind: aside
        tone: joke
        page: 191
        quote: "Insulin therapy is cornerstone in management."
        text: |
          الإنسولين في الـ DKA زي المكنسة: شغلته الحقيقية إنه يكنس ==الكيتونات==، مش السكر بس. لو وقفته لما السكر نضف، الكيتونات هتفضل مستخبية تحت السجادة.
      - kind: explain
        page: 191
        quote: "Insulin should NOT be given if hypokalemia or severe volume contraction is present unless these conditions are corrected."
        title: "إمتى ما تديش إنسولين؟"
        text: |
          - **Regular insulin** IV infusion (low-dose protocol) هو الـ **cornerstone**.
          - الأحسن تستنى نتيجة الـ ==K== قبل ما تبدأ.
          - ==ممنوع== مع **hypokalemia** أو **severe volume contraction** لحد ما يتصلحوا.
      - kind: case
        page: 190
        quote: "Give 10–20 mmol/L K+ in each liter of i.v. fluid as needed to keep serum K+ between 4 and 5 mmol/L"
        stem: "A 70 kg man with moderate DKA, urine output fine."
        steps:
          - question: "K is 3.1 mmol/L. First?"
            options: ["K 10-20 mmol/h until >3.5, insulin waits", "Insulin 7 units/h now", "Bicarbonate", "No K needed"]
            answer: 0
            why: "تحت 3.5: الـ K الأول والإنسولين يستنى."
          - reveal: "K is now 4.0."
            question: "Insulin rate?"
            options: ["7 units/h (0.1 units/kg/h)", "3.5 units/h (0.05)", "14 units/h", "s.c. 7 units every 2 h"]
            answer: 0
            why: "Moderate DKA = IV 0.1 units/kg/h، يعني 7."
          - question: "And K now?"
            options: ["10-20 mmol in each liter", "None", "40 mmol/h", "Only orally"]
            answer: 0
            why: "بين 3.5 و 5: 10-20 mmol في كل لتر عشان يفضل 4-5."
      - kind: mnemonic
        page: 191
        quote: "Paradoxical CSF acidosis"
        word: "OHHCP"
        hook: "ليه بنخاف من الـ bicarbonate؟"
        parts:
          - { key: "O", text: "Overshoot alkalosis" }
          - { key: "H", text: "Hypoxia في الأنسجة (altered oxygenation) و ketones أكتر" }
          - { key: "H", text: "Hypokalemia" }
          - { key: "C", text: "Cerebral edema" }
          - { key: "P", text: "Paradoxical CSF acidosis" }
      - kind: explain
        page: 192
