    question: Of 180 positives, 80 have the disease. What is the PPV, and what does it tell a patient who tested positive?
    options:
    - '44.4%: fewer than half of positives really have it'
    - '80%: most positives have it'
    - '97.6%: the result is almost certain'
    - '10%: the prevalence'
    answer: 0
    why:
    - 'صح: 80/180. يعني تطمّنها شوية: أكتر من نص الـ positives طلعوا سليمين، ولازم diagnostic test.'
    - 80% دي الـ sensitivity، بتتحسب على العيانين مش على الـ positives.
    - 97.6% دي الـ NPV.
    - 10% دي الـ prevalence.
  - kind: explain
    page: 19
    quote: |-
      Sensitivity and specificity are characteristics of the test but they do not help a clinician to interpret the results of an individual test.
      Positive and negative predictive values are useful in a clinical setting as they give the probabilities that an individual is truly positive given that they tested positive, or truly negative given that they tested negative.
    title: ليه الـ PPV/NPV أهم في العيادة؟
    text: |-
      الـ ==sensitivity والـ specificity== صفات للـ **test**، بس مش بيساعدوك تفسّر نتيجة **عيان واحد**.

      الـ **PPV** والـ **NPV** بيدّوك الاحتمال إن الشخص ده **truly positive** لما طلع positive، أو **truly negative** لما طلع negative. ده اللي العيان محتاجه.
  - kind: figure
    page: 25
    quote: |-
      Effect of prevalence
      If the sensitivity and specificity for a test are known but we wish to use the test on a different population from the one it was developed in, the PPV and NPV can be calculated using the following standard formula
      PPV = sensitivity x prevalence / [sensitivity x prevalence] + [(1-specificity) x (1-prevalence)]
      NPV = specificity x (1-prevalence) / [(1-sensitivity) x prevalence] + [specificity x (1-prevalence)]
    title: نفس الـ test، prevalence مختلفة
    alt: 'Two bar groups for 1,000 people screened with the same test (sensitivity 80%, specificity 88.9%). At prevalence
