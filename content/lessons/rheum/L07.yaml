        title: "تنضيف الخلايا الميتة"
        quote: "Complement cells removes dead or dying from the tissues and helps in maintaining homeostasis."
        text: |
          آخر activity في القايمة: الـ **necrotic tissue** (نسيج ميت) والـ **subcellular membranes** زي الـ **mitochondria** والـ **endoplasmic reticulum** بينشّطوا الـ **classical** والـ **alternative** pathways، وبيتشالوا بنفس الطريقة (C3b ← phagocytes).

          يعني الـ complement بيشيل الخلايا الميتة والبتموت من الأنسجة، وده بيحافظ على الـ ==homeostasis==.

          ليه ده مهم؟ التفسير المقبول (مش في الكتاب): الحتت دي جواها حاجات الجهاز المناعي ما شافهاش قبل كده، زي الـ DNA والـ nuclear proteins. لو فضلت سايبة، ممكن المناعة تعتبرها عدو وتعمل ضدها **autoantibodies**. وده اللي هتشوفه في الـ reveal الجاي.
