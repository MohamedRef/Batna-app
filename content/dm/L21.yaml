    topic: fh
    prompt: How is familial hypercholesterolemia diagnosed?
    points:
      - LDL-C raised, usually 200-400 mg/dL
      - Normal triglyceride
      - Decreased LDL receptor activity in cultured skin fibroblasts
    pass: 3
    hook: "تشخيص الـ FH: «LDL عالي (200-400)، TG طبيعي، والمستقبل ضعيف في خلايا الجلد» = LDL-C مرتفع، normal TG، وdecreased LDL receptor activity في الـ fibroblasts."
    src: { page: 264, quote: "Diagnosis of FH\n  1. Elevated plasma levels of LDL-C (usually 200–400 mg/dL)\n  2. Normal levels of triglyceride\n  3. Decreased LDL receptor activity in cultured skin fibroblasts." }
    status: unverified
    tags: [high-yield]
