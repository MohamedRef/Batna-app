  # ---------- p387-390: contraception after transplant ----------
  - id: neph.L11.178
    kind: card
    topic: tx-contraception
    front: What are the pros and cons of barrier contraception after transplant?
    back: Safe, easy and free of drug interactions, but efficacy depends on compliance; cervical caps doubled UTI in graft recipients.
    src: { page: 387, quote: "cervical caps were associated with a twofold increase in urinary tract infections in graft recipients" }
    status: unverified
  - id: neph.L11.179
    kind: card
    topic: tx-contraception
    front: Why are IUDs a good choice after kidney transplant?
    back: Copper and levonorgestrel IUDs are safe, effective, reversible, have no interaction with immunosuppressants and no added pelvic infection risk.
    src: { page: 387, quote: "intrauterine devices, both copper and levonorgestrel, represent a safer and more effective choice for kidney transplant women" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.180
    kind: card
    topic: tx-contraception
    front: Why must combined hormonal contraceptives be watched in transplant recipients on CNIs?
    back: They are metabolized by CYP3A4, the same pathway as calcineurin inhibitors, and they can cause hypertension, migraine and thromboembolism.
    src: { page: 387, quote: "As combined hormone contraceptives are metabolized primarily by cytochrome P 450 3A4, careful attention to their interactions with calcineurin inhibitors" }
    status: unverified
  - id: neph.L11.181
    kind: card
    topic: tx-contraception
    front: Why might a patch or vaginal ring interact less with CNIs than the combined pill?
    back: They skip first-pass liver metabolism, so they interfere less with CYP3A4.
    src: { page: 388, quote: "transdermal and vaginal preparations do not undergo first-pass liver metabolism" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.182
    kind: card
    topic: tx-contraception
    front: What is the two-way interaction between hormonal contraceptives and CNIs?
    back: Combined and progestin-only pills inhibit CYP3A4 and raise CNI (especially cyclosporine) levels; CNIs (especially tacrolimus) induce CYP3A4 and may lower contraceptive efficacy.
    src: { page: 388, quote: "Combined oral contraceptive and progestin-only contraceptives have an inhibitory effect on P 450 3A4, thus increasing the concentration of CNI" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.183
    kind: card
    topic: tx-contraception
    front: What is the advantage of the vaginal ring?
    back: It contains less ethinylestradiol than combined pills, so fewer adverse reactions, and it can control the cycle.
    src: { page: 388, quote: "advantage of containing a lower concentration of ethinylestradiol in comparison to combined hormonal contraceptives" }
    status: unverified
