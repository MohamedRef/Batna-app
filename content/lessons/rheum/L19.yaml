        title: "الـ pathology والكلية"
        quote: "Immune complex deposition seen in mesangium & subendothelial/subepithelial surface of basement membrane."
        text: |
          **الأساسيات (p315):** inflammation، **band or occlusive vasculopathy**، vasculitis، immune complex deposition. والـ **fibrinoid** (مادة eosinophilic) على الأوعية والألياف.

          **الكلية** أوضح organ:
          - **Light/immunofluorescence (IF):** mesangial proliferation، **fibrinoid necrosis**، inflammation، Ig أو complement deposits.
          - **EM:** deposits في الـ ==mesangium== والـ **subendothelial / subepithelial** surfaces.

          ليه الكلية بالذات «best characterized»؟ لأن الـ glomerulus فلتر بيعدّي عليه دم كتير، فالـ immune complexes بتتحجز فيه، وكمان الـ biopsy سهل نسبيًا فبقت أكتر عضو اتدرس.
      - kind: explain
        page: 315
        title: "الـ pathology: أربع حاجات أساسية"
        quote: "Basic Pathological Features of SLE\n  a. Inflammation.\n  b. Band or Occlusive Vasculopathy.\n  c. Vasculitis.\n  d. Immune complex deposition."
        text: |
          الكتاب بيلخّص الـ immunopathology في أربع نقط:
          1. **Inflammation**
          2. **Band or occlusive vasculopathy**
          3. **Vasculitis**
          4. ==Immune complex deposition==

          ليه الأربعة دول؟ لأنهم نتيجة الـ pathogenesis اللي اتعلمناه: الـ autoantibodies بتعمل **immune complexes** مع الـ nuclear antigens، تترسب في جدار الأوعية والأنسجة، فتعمل **inflammation** و **vasculitis**. ولما الوعاء يتأذي ويقفل يبقى **occlusive vasculopathy**. ده بيفسّر ليه المرض بيلمس أي عضو فيه أوعية: الجلد، الكلى، المخ، الـ serosa.
      - kind: reveal
        page: 314
        quote: "Pathology: SLE characterized by wide-spread immune complex deposition, inflammation and vasculitis. Fibrinoid (eosinophilic material) is found along blood vessels and tissue fibres."
        prompt: "إيه الـ fibrinoid اللي بيتشاف تحت الميكروسكوب في الـ lupus، وفين؟"
        answer: |
          مادة ==eosinophilic== (لونها وردي بالـ H&E) بتتشاف **على طول الأوعية الدموية وألياف الأنسجة**.

          الكتاب بيحطها جنب الـ **wide-spread immune complex deposition** والـ vasculitis. التفسير المقبول (مش في الكتاب): الـ fibrinoid هو خليط من الـ immune complexes والـ fibrin والبروتينات اللي خرجت من جدار وعاء ملتهب، يعني «بصمة» الضرر. وهتلاقيها تاني في الكلية تحت اسم **fibrinoid necrosis**.
      - kind: check
