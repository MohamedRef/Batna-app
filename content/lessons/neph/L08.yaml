        text: |
          الكتاب بيدّي مثالين بأماكن الـ deposits:
          - **Subepithelial hump-like deposits** ← ==postinfectious GN==.
          - **Subendothelial deposits with mesangial interposition** ← ==type I MPGN==.

          ليه الشكل ده؟ التفسير المقبول (مش في الكتاب):
          - الـ **hump** كتلة complexes كبيرة قاعدة **برّه** الـ GBM تحت الـ podocyte. في الـ post-infectious بتتكوّن بسرعة بعد العدوى، والجسم بيشيلها في أسابيع، علشان كده المرض غالبًا بيخف.
          - الـ **mesangial interposition**: لما الـ deposits تقعد **تحت الـ endothelium**، الـ mesangial cells بتزحف من النص وتدخل بين الـ endothelium والـ GBM، وتبني غشا جديد جوّه القديم. النتيجة: جدار بطبقتين، وده اللي هتشوفه بعدين بالـ silver كـ **double contour**.

          يعني الـ EM مش بيوصف بس؛ مكان الـ deposit بيشرح ليه الـ post-infectious nephritic وبيخف، وليه الـ MPGN جداره تخين ومزدوج.

          ليه الشكلين دول بيتلخبطوا في الامتحان؟ التفسير المقبول (مش في الكتاب): الاتنين deposits، بس الـ **hump** فوق الغشا (subepithelial) كبير ومنفرد، وبيختفي بعد أسابيع لأن الـ infection خلص. أما الـ **interposition** فده الـ mesangium **زاحف** بين الغشا القديم والـ endothelium، وبيبني غشا جديد، وده مرض **مزمن** ماشي. يعني الـ hump = حادثة، والـ interposition = بناء على مدى طويل. ولو الـ C3 واطي في الاتنين، المدة هي اللي بتفرق: الـ post-infectious بيرجع طبيعي في 8 أسابيع، والـ MPGN لأ.
