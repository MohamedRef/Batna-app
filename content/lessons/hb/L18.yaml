  - id: hb.L18.lesson4
    title: "العيان بييجي إزاي؟ ومضاعفات «مصنع الهرمونات»"
    hook: "مريض cirrhosis كان ماشي كويس وفجأة بقى decompensated؟ قبل ما تلوم الملح... دوّر على HCC."
    minutes: 9
    pages: [352, 358]
    topics: [clinical, labs]
    goals:
      - "تجمّع الـ symptoms والـ signs الطويلة في مجموعات"
      - "تعرف المضاعفات وآلية كل واحدة، وخصوصًا الـ rupture"
      - "تقرا الـ labs: FBC، electrolytes، LFTs، INR و AFP بحدودها"
    status: unverified
    steps:
      - kind: explain
        page: 352
        title: "القايمة الطويلة في 4 مجموعات"
        text: |
          الكتاب بيعدّ أكتر من 20 علامة. سهّلها كده:

          - **الورم نفسه:** **hepatomegaly**، **RUQ pain**، **early satiety**، **weight loss**، **cachexia**، **vascular bruit**، **severe abdominal pain**، **bone pain** (mets).
          - **الكبد بيفشل (decompensation):** **abdominal distension** (ascites)، **variceal bleeding**، **hepatic encephalopathy**، **asterixis**، **jaundice**، **fetor hepaticus**، **lower limb oedema**.
          - **علامات الـ cirrhosis والـ portal hypertension:** **spider naevi**، **palmar erythema**، **splenomegaly**، **periumbilical collaterals**، **enlarged haemorrhoidal veins**.
          - **حاجات تانية:** **diarrhea**، **paraneoplastic syndrome**، **obstructive jaundice**.

          وفيه ناس كتير **asymptomatic** بـ cirrhosis compensated. واللي **مالوش chronic liver disease** غالبًا بييجي بـ **RUQ pain**.
      - kind: reveal
        page: 353
        prompt: "ليه ممكن تسمع **bruit** على كبد فيه HCC؟"
        answer: |
          لأن الـ HCC ورم **hypervascular** بياخد دمه من الـ **hepatic artery** (هتشوف ده في الـ CT: enhancement جامد في الـ arterial phase). الدم الكتير الماشي بسرعة جوه أوعية الورم بيعمل turbulence، وده الصوت اللي بتسمعه بالسماعة.
      - kind: case
        page: 353
        stem: "الحالة الأولى في الكتاب: راجل 60 سنة آسيوي، عنده chronic HBV من زمان ومعاه cirrhosis. بقاله أسابيع abdominal distension، عينيه صفرا، RUQ pain، شهيته قلت، وزنه نزل، ونومه اتلخبط. الكشف: cachectic، jaundice، palmar erythema، ascites، mass في الـ RUQ، و asterixis."
        steps:
          - question: "His change in sleep pattern with asterixis most likely reflects:"
            options:
              - "Hepatic encephalopathy"
              - "Hypercalcemia from bone metastases"
              - "Depression from the diagnosis"
            answer: 0
            why: "تغيّر النوم (sleep inversion) مع الـ **asterixis** = **hepatic encephalopathy**، من علامات الـ decompensation في القايمة."
          - question: "Which first blood test supports HCC here, keeping its limits in mind?"
            options:
              - "Serum AFP, knowing a normal value does not exclude HCC"
              - "CA 19-9, the best HCC marker"
              - "Serum amylase"
              - "Ferritin alone"
            answer: 0
            why: "الـ **AFP** هو الـ marker في الـ labs، بس عالي في **60%** بس (غالبًا الـ advanced). ومعاه نعمل **triphasic CT أو MRI**."
      - kind: explain
        page: 354
        title: "المضاعفات"
        text: |
          - **Jaundice:** obstructive عن طريق **invasion of the biliary tree**، **compression** لقناة intrahepatic، أو نادرًا **haemobilia**.
          - **Cachexia:** ممكن تبقى life-threatening. لو محتاج hospitalization وتغذية، راقب **re-feeding syndrome**.
          - **Hypoglycemia (non-diabetic):** نادرًا من **IGF-2**، أو في الـ advanced من **high metabolic needs** للورم.
          - **Hepatic failure:** variceal bleeding (**common cause of death**)، encephalopathy، ascites، SBP، hepatorenal.
          - **Watery diarrhea:** uncommon، غالبًا **VIP أو gastrin**. محتاج **aggressive fluids and electrolytes**.
          - **Hypercalcemia:** **osteolytic metastases** أو **PTH-related protein**.
          - **Intraperitoneal bleeding (rupture):** life-threatening.
      - kind: match
        page: 355
        prompt: "الـ HCC بيشتغل «مصنع هرمونات». وصّل كل مضاعفة بسببها:"
        pairs:
          - ["Non-diabetic hypoglycemia", "IGF-2 production"]
          - ["Hypercalcemia", "PTH-related protein or osteolytic metastases"]
          - ["Chronic watery diarrhea", "VIP or gastrin immunoreactivity"]
          - ["Obstructive jaundice", "Biliary invasion, duct compression or haemobilia"]
        why: "الـ HCC ممكن يفرز **IGF-2** (سكر واطي)، **PTHrP** (كالسيوم عالي)، و **VIP/gastrin** (إسهال مية). وده ليه الكتاب بيحط **paraneoplastic syndrome** في الـ clinical features."
      - kind: explain
        page: 355
        title: "الـ rupture: الطوارئ"
        text: |
          - **الصورة:** **sudden severe abdominal pain** مع **distension**، **acute drop in hematocrit**، و **hypotension**.
          - **التشخيص:** **peritoneal lavage و laparotomy**، والـ **CT** بيوري liver mass و **free intraperitoneal blood**.
          - **Risk factors للـ spontaneous rupture:** **advanced Child-Pugh**، **advanced Okuda stage**، و **peripheral location**.
          - **العلاج:** **urgent angiography** و **embolization** للوعاء النازف، أو حتى **surgery**. ورغم إن خطر الـ peritoneal dissemination عالي، ممكن **delayed resection** لو feasible.
      - kind: aside
        tone: analogy
        page: 355
        text: |
          ليه الـ **peripheral** location خطر؟ تخيّل **بلّونة مية** مستخبية جوه كيس قطن (ورم في نص الكبد) مقابل بلّونة لازقة في حيطة الكيس من بره (ورم تحت الكبسولة على طول). التانية أي خبطة أو ضغط بتفرقعها في البطن على طول.
      - kind: explain
        page: 356
        title: "الـ labs وبتقول إيه"
        text: |
          - **FBC:** **low MCV + low Hb** → فكّر في **variceal bleeding**. **High MCV** ممكن في الـ **alcohol-related** cirrhosis. **Low platelets** → **portal hypertension**.
          - **Electrolytes:** **hyponatremia** (volume overload أو diuretics). **Urea عالية**: prerenal، AKI، CKD، أو **hepatorenal**.
          - **LFTs:** transaminases و ALP و bilirubin عاليين مع **albumin واطي**. ومهمين لأن الـ **resection محتاجة liver function كويسة**.
          - **PT/INR:** بيقيس الـ **synthetic function**، ومهم لو المريض candidate لـ resection أو transplant.
          - **Viral panel:** HBV و HCV كسبب.
      - kind: explain
        page: 357
        title: "الـ AFP: صاحب مش مضمون"
        text: |
          - عالي في **60% بس** من الـ HCC (غالبًا الـ **advanced**)، يعني **AFP normal ماينفيش HCC**.
          - بيعلى كمان في **intrahepatic cholangiocarcinoma**، **gastric cancer**، و **germ cell tumours**، و **mild** في chronic hepatitis من غير HCC.
          - **ارتفاعه** في مريض cirrhosis لازم يخليك **تشك في HCC**.
          - **Sensitivity 41–65%**، **specificity 80–94%**، والـ specificity **بتزيد كل ما الرقم يعلى**.
      - kind: check
        page: 357
        question: "A cirrhotic patient has a new 3 cm liver lesion and a normal AFP. What is the right conclusion?"
        options:
          - "HCC is still possible: AFP is raised in only about 60%"
          - "HCC is excluded"
          - "The lesion must be a germ cell tumour"
          - "Repeat AFP in a year before any imaging"
        answer: 0
        why:
          - "صح: الكتاب صريح، **normal AFP does not rule out HCC**. كمّل بالـ triphasic CT أو MRI."
          - "ده بالظبط الغلط اللي الكتاب بيحذر منه."
          - "الـ germ cell tumours **بتعلّي** الـ AFP، والـ AFP هنا normal."
          - "عندك lesion جديدة: لازم تعمل imaging دلوقتي، مش تستنى."
      - kind: try
        items: [hb.L18.068, hb.L18.071, hb.L18.081, hb.L18.083, hb.L18.088]
    recap:
      - "الأعراض: الورم (mass، pain، weight loss، bruit)، decompensation (ascites، bleeding، HE)، stigmata، و paraneoplastic. بدون liver disease: RUQ pain."
      - "Complications: jaundice، cachexia (refeeding)، **hypoglycemia (IGF-2)**، hepatic failure (varices = سبب وفاة شائع)، **diarrhea (VIP/gastrin)**، **hyperCa (PTHrP/mets)**، rupture."
      - "Rupture: ألم فجأة + Hct نازل + hypotension. Risk: Child متقدم، Okuda متقدم، **peripheral**. علاج: angiography + embolization."
      - "FBC: MCV واطي = varices، platelets واطية = portal HTN. Na واطي، urea عالية."
      - "AFP: عالي في **60%** بس، sens 41–65%، spec 80–94%. **Normal لا ينفي**."
    practice: [hb.L18.068, hb.L18.069, hb.L18.070, hb.L18.071, hb.L18.072, hb.L18.073, hb.L18.074, hb.L18.075, hb.L18.076, hb.L18.077, hb.L18.078, hb.L18.079, hb.L18.080, hb.L18.081, hb.L18.082, hb.L18.083, hb.L18.084, hb.L18.085, hb.L18.086, hb.L18.087, hb.L18.088, hb.L18.089, hb.L18.090, hb.L18.091, hb.L18.092, hb.L18.191, hb.L18.192, hb.L18.201, hb.L18.197]

