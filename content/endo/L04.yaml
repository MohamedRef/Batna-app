  - id: endo.L04.250
    kind: essay
    topic: myopathy
    prompt: What are the effects of hyperthyroidism on the musculoskeletal system?
    outline:
      - Proximal weakness and atrophy
      - Respiratory and oesophageal muscles occasionally (dysphagia, dysphonia, aspiration); brisk reflexes
      - Periodic paralysis
      - Myasthenia gravis
      - Graves' ophthalmopathy (ocular myopathy, proptosis)
      - Normal CK; histology shows atrophy
