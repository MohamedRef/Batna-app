    pass: 4
    hook: "الوصفي 4، اتنين «كيس» واتنين «حجم»: correlational (ecological) وcase reports وcase series… وexploratory (small-scale) وcross-sectional (large-scale). 2 + 2 = 4."
    src: { page: 17, quote: "Descriptive studies:\n  (1) Correlational (Ecological) studies\n  (2) Case reports and case series\n  (3) Exploratory studies (small-scale)\n  (4) Cross-sectional studies (large-scale)" }
    status: unverified
  # --- Ecological studies (slides 18-27, 33) ---
  - id: res.L04.018
    kind: card
    topic: ecological
    front: What is the unit of observation in a correlational (ecological) study?
    back: Population groups, not individuals; the study is done at population level.
    src: { page: 18, quote: "Correlational (Ecological) Studies:\n  Conducted at a population level rather than on an individual level.\n  The units of observation are population groups rather than individuals.\n  They explore differences in disease rates by:\n    PLACE (geographical studies) or by\n    TIME (time trends studies) in the same region at different times to identify disease patterns that suggest a hypothesis about the cause of disease." }
    status: unverified
    tags: [high-yield]
  - id: res.L04.019
    kind: card
    topic: ecological
    front: Name the two kinds of ecological study and what each compares.
    back: >-
      Geographical studies compare disease rates by place; time-trend studies compare rates in the same
      region at different times. Both look for patterns that suggest a hypothesis about cause.
    src: { page: 18, quote: "Correlational (Ecological) Studies:\n  Conducted at a population level rather than on an individual level.\n  The units of observation are population groups rather than individuals.\n  They explore differences in disease rates by:\n    PLACE (geographical studies) or by\n    TIME (time trends studies) in the same region at different times to identify disease patterns that suggest a hypothesis about the cause of disease." }
    status: unverified
  - id: res.L04.020
    kind: mcq
    topic: ecological
    stem: >-
      A study plots fat calorie intake against breast cancer incidence for 30 countries and finds that
      countries with higher fat intake have higher incidence. What type of study is this?
    options: [Time-trend ecological study, Geographical ecological study, Cross-sectional survey, Case series]
    answer: 1
    why:
      - A time-trend study follows one region over time; here different countries are compared at once.
      - Comparing rates across places with country-level data is a geographical correlational study (positive correlation).
      - A cross-sectional survey measures exposure and outcome in individuals.
      - A case series describes individual patients with a disease.
    src: { page: 20, quote: "Correlation between fat intake and breast cancer by country:\n  Countries with high fat calories intake are associated with higher incidence of breast cancer\n  +ve correlation\n  Geographical study" }
    status: unverified
  - id: res.L04.021
    kind: card
    topic: ecological
    front: In the lecture's time-trend example, how did non-steroidal anti-inflammatory drug (NSAID) use relate to colorectal cancer?
    back: NSAID use was associated with a lower incidence of colorectal cancer, a negative correlation.
    src: { page: 19, quote: "Ecological studies, time series: Secular trends in NSAID use and colorectal cancer incidence\n  NSAID use was associated with lower incidence of colorectal cancer\n  Negative correlation\n  Time trend study" }
    status: unverified
  - id: res.L04.022
    kind: enumerate
    topic: ecological
    prompt: Enumerate the uses of an ecological study design.
    points:
      - Correlate changes in risk factor profiles with disease rates over time
      - Monitor the effectiveness of health interventions
      - Surveillance of communicable and non-communicable diseases
      - Explore inequalities in care
      - Explore the quality of care (e.g. mortality between hospitals or regions)
      - Inform resource allocation or health promotion programs
      - Generate hypotheses about causal or preventive factors
      - Study the physical characteristics of a place (air pollution, temperature, climate)
    pass: 5
    hook: "الـ ecological بيستخدم في 8: «زمن، تدخل، مراقبة» (risk factors مع الأمراض عبر الوقت، effectiveness of interventions، surveillance) + «ظلم وجودة وفلوس» (inequalities، quality of care، resource allocation) + «فرضية ومكان» (generate hypotheses، physical characteristics of a place). 3 + 3 + 2 = 8."
    src: { page: 22, quote: "What research questions are best answered with an ecological study design? Ecological studies may be used:\n  To investigate possible correlations between changes in risk factor profiles and disease rates over time.\n  To monitor the effectiveness of health interventions.\n  For the surveillance of communicable and non-communicable diseases.\n  To explore the inequalities in care; e.g. is the incidence rate of hospital admissions for community-acquired pneumonia higher in deprived areas?\n  To explore the quality of care, e.g. comparing mortality rates between different hospitals or geographical regions.\n  To inform resource allocation or health promotion programs.\n  To generate hypotheses about what factors (e.g. environmental) may be involved in preventing or causing a disease.\n  To investigate the physical characteristics of a place in which members of each group work or live, e.g. air-pollution level, temperature or climate." }
    status: unverified
  - id: res.L04.023
    kind: card
    topic: ecological
    front: What rule applies to the exposure and outcome data in an ecological study?
    back: They must be at the same level of aggregation (the same time period, city, region, country or continent).
    src: { page: 23, quote: "The data on exposure (independent) and the outcome (dependent) variables should be at the same level of aggregation (e.g time period, city, region, country, continent)\nThe studies often use data previously collected for alternative purpose (secondary data source). These data are either from records of primary care, secondary care (hospitals), mortality or census data, infectious disease notification data, or national survey data\nWhile using routinely collected data makes ecological studies less time consuming and less expensive than if the data was systematically collected, however the data is less accurate and may be of poor quality" }
    status: unverified
  - id: res.L04.024
    kind: card
    topic: ecological
    front: Where do ecological studies usually get their data, and what is the trade-off?
    back: >-
      From data collected earlier for another purpose (secondary data: primary/secondary care records,
      mortality, census, notifications, national surveys). It is quicker and cheaper, but less accurate
      and may be of poor quality.
    src: { page: 23, quote: "The data on exposure (independent) and the outcome (dependent) variables should be at the same level of aggregation (e.g time period, city, region, country, continent)\nThe studies often use data previously collected for alternative purpose (secondary data source). These data are either from records of primary care, secondary care (hospitals), mortality or census data, infectious disease notification data, or national survey data\nWhile using routinely collected data makes ecological studies less time consuming and less expensive than if the data was systematically collected, however the data is less accurate and may be of poor quality" }
    status: unverified
  - id: res.L04.025
    kind: card
    topic: ecological
    front: Define the ecological fallacy.
    back: >-
      A logic error in interpreting data: drawing conclusions about specific individuals from aggregate
      data on the larger group. It is the major source of error in ecological studies.
    src: { page: 25, quote: "The weakness of ecological approach is that exposure and disease are measured at the population (group) level.\nEcological fallacy (Definition) is a logic error in the interpretation of statistical data. Drawing conclusions about specific individuals based on the analysis of aggregate data on the larger group.\nThere is assumption that all members of a given population share the same exposure and same risk of disease. Hence caution must be exercised in drawing causal inferences/conclusions for the individual based on the results of an ecological study.\nThe term \"ecological fallacy\" is applied to such conclusions, since the true relation between exposure and disease is distorted by the inability to control for the confounding variables." }
    status: unverified
    tags: [high-yield]
  - id: res.L04.026
    kind: mcq
    topic: ecological
    stem: >-
      Governorates with more mobile phone towers have higher brain tumour rates. A journalist concludes that
      each person living near a tower has a higher personal risk. What error is this?
    options: [Recall bias, Ecological fallacy, Selection bias from refusal, Publication bias]
    answer: 1
    why:
      - Recall bias comes from people remembering exposures differently; no one was asked anything here.
      - Group-level data were used to judge individuals, the ecological fallacy.
      - Refusal (survival) bias belongs to surveys of individuals.
      - Publication bias is about which results get published.
    src: { page: 25, quote: "The weakness of ecological approach is that exposure and disease are measured at the population (group) level.\nEcological fallacy (Definition) is a logic error in the interpretation of statistical data. Drawing conclusions about specific individuals based on the analysis of aggregate data on the larger group.\nThere is assumption that all members of a given population share the same exposure and same risk of disease. Hence caution must be exercised in drawing causal inferences/conclusions for the individual based on the results of an ecological study.\nThe term \"ecological fallacy\" is applied to such conclusions, since the true relation between exposure and disease is distorted by the inability to control for the confounding variables." }
    status: unverified
  - id: res.L04.027
    kind: card
    topic: ecological
    front: Why does the ecological fallacy happen, per the lecture?
    back: >-
      The study assumes every member of a population shares the same exposure and risk, and it cannot
      control for confounding variables, so the true exposure-disease relation is distorted.
    src: { page: 25, quote: "The weakness of ecological approach is that exposure and disease are measured at the population (group) level.\nEcological fallacy (Definition) is a logic error in the interpretation of statistical data. Drawing conclusions about specific individuals based on the analysis of aggregate data on the larger group.\nThere is assumption that all members of a given population share the same exposure and same risk of disease. Hence caution must be exercised in drawing causal inferences/conclusions for the individual based on the results of an ecological study.\nThe term \"ecological fallacy\" is applied to such conclusions, since the true relation between exposure and disease is distorted by the inability to control for the confounding variables." }
    status: unverified
  - id: res.L04.028
    kind: table
    topic: ecological
    title: Ecological studies, advantages and disadvantages
    columns: [Advantage, Disadvantage]
    rows:
      - ["Can test whether differences in exposure between areas are bigger than at individual level", "Associations cannot be confirmed at the individual level"]
      - ["Use routinely collected health data: cheap and quick", "Potential ecological fallacy when group results are applied to individuals"]
      - ["Generate hypotheses to test at individual level", "Lack of data on confounding factors"]
      - ["Study exposures measured over groups (diet, air pollution, temperature)", "Areas may differ systematically in how disease frequency is measured"]
      - ["Search for associations in large populations", "Areas may differ systematically in how exposures are measured"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 33, quote: "Advantages and disadvantages of correlational (ecological) studies\n| Advantages | Disadvantages |\n|---|---|\n| Can investigate whether differences in exposure between areas are bigger than at the individual level. | Associations cannot be confirmed at the individual level. |\n| Utilise routinely collected health data; therefore, may be relatively cheap and quick to conduct. | There is potential for ecological fallacy when applying grouped results to the individual level. |\n| Generate hypotheses which can be investigated at the individual level using studies higher up in the hierarchy of evidence. | There is lack of available data on confounding factors. |\n| Can investigate the effect of exposures that are measured over groups or areas, e.g. diet, air pollution and temperature. | There is potential for systematic differences between areas in how disease frequency is measured, e.g. differences in disease classification and coding. |\n| Can search for associations in large populations. | There is potential for systematic differences between areas in how exposures are measured. |" }
