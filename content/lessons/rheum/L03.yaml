      - kind: try
        items: [rheum.L03.040, rheum.L03.043, rheum.L03.044, rheum.L03.046, rheum.L03.047]
    recap:
      - "Localized: hay fever، asthma، urticaria، eczema، food allergy: المرض مكان ما الـ allergen دخل."
