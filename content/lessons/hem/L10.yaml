      - kind: explain
        page: 167
        title: "Aspirin والـ supportive"
        quote: "Aspirin\n  Low dose 75 mg/day\n  In patient with risk of thrombosis (obesity, hypertension, DM, history of MI).\n  Avoid in those with a history of Hge esp. GIT."
        text: |
          - **Aspirin 75 mg/day** للي عندهم خطر تجلط (obesity، hypertension (HTN)، diabetes mellitus (DM)، myocardial infarction (MI) قبل كده). ابعد عنه لو فيه **نزيف قديم**، خصوصًا ==GIT==: افتكر إن الـ PV أصلًا فيها **peptic ulcer** أكتر (histamine والـ acid).
          - **Supportive**: سوايل كفاية، **allopurinol**، و antihistamine أو **H2 antagonist** أو IFN للـ pruritus.
          - **Bone marrow transplantation (BMT) is not advocated** في الـ stable PV، بسبب **سن المرضى** والـ **natural history** الهادية نسبيًا.

          ليه كل واحد؟ التفسير المقبول (مش في الكتاب): السوايل عشان ما يتنشفش الدم التقيل أصلًا، والـ **allopurinol** عشان الـ uric acid العالي ما يعملش gout أو حصوات، والـ **H2 antagonist** و antihistamine لأن الهرش من **histamine** (ص 159). والـ BMT خطره أكبر من مرض بيعيش معاه المريض سنين طويلة.
