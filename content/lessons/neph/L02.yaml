        title: "قواعد الـ CKD-MBD"
        text: |
          - ابدأ المتابعة بدري: ==chronic kidney disease (CKD) G3a==
          - عالج ==trends== مش رقم واحد
          - خد calcium و phosphate و PTH و alkaline phosphatase (و vitamin D) مع بعض
          - صحّح الأول: hyperphosphatemia، hypocalcemia، vitamin D deficiency
          - تجنّب: **hypercalcemia**، **hyperphosphatemia**، و PTH ==عالي قوي أو واطي قوي==
          - الـ calcitriol/vitamin D receptor activators (VDRAs): مش روتين قبل الغسيل، إلا G4–G5 مع PTH بيعلى بشدة
          - راقب كويس بعد أي علاج

          التفسير المقبول (مش في الكتاب): بنعالج الـ trends مش رقم واحد **لأن** الـ PTH والـ phosphate بيتهزوا بين تحليل والتاني، والـ PTH الواطي قوي **بيسبب** adynamic bone زي ما العالي قوي بيسبب osteitis fibrosa.
