        quote: "Transplantation and Alport syndrome In <5%, transplanted Alport patients may develop de novo anti-GBM anti-bodies that cause an RPGN; i.e. donor a5 type IV collagen is recognized as non-self. It is not a contraindication to transplantation."
        text: |
