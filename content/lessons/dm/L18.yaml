          **General measures:**
          1. **Weight reduction**
          2. **Moderate protein and low-fat diet**
          3. **Avoid alcohol**
          4. **Revise drugs** (زي الـ thiazides)
          5. **High fluid intake**: urine > **2000 ml/day**

