- id: res.L14.028
  kind: mcq
  topic: validity
  stem: A student computes sensitivity from the slide's table as 80/180. What went wrong?
  options:
  - 180 is all test positives (the PPV denominator); sensitivity divides by all with the disease, 100
  - 'Nothing: sensitivity is true positives over all positives'
  - Sensitivity should be 800/900
  - Sensitivity should be 80/1000
  answer: 0
  why:
  - 'Sensitivity starts from the true state, disease present (a + c = 100): 80/100 = 80%. 80/180 is the PPV.'
  - True positives over all positives is the positive predictive value, not sensitivity.
  - 800/900 is the specificity.
  - Dividing by everyone tested gives no named measure here; the denominator is the diseased.
  src:
    page: 14
    quote: |-
      | Screening Results | Disease | No Disease | Total |
      |---|---|---|---|
      | Positive | 80 | 100 | 180 |
      | Negative | 20 | 800 | 820 |
      | Total | 100 | 900 | 1,000 |
      Sensitivity = 80/100 = 80%
  status: unverified
  tags: [high-yield]
- id: res.L14.029
  kind: card
  topic: validity
  front: Why does every test have some false positives and false negatives, and which error type is each on the slide?
  back: Ideally sensitivity and specificity are both close to 1.0 (100%), but in reality it is hard to have both high. So
    there are always some false positives (type I error) and some false negatives (type II error).
  src:
    page: 15
    quote: |-
      Ideally tests should have both sensitivity and specificity close to 1.0 (or 100% if they are presented as percentages), although it is often difficult in reality to have both high sensitivity and specificity.
      Which means that we will always have some false positives (type I error) and some false negatives (type II error)
  status: unverified
- id: res.L14.030
  kind: mcq
  topic: validity
  stem: 'On the slide, a false positive result is likened to:'
  options:
  - A type I error
  - A type II error
  - A sampling error
  - A random error of the gold standard
  answer: 0
  why:
  - 'Calling someone diseased when they are not, like rejecting a true null hypothesis: type I.'
  - 'Type II is the false negative: missing a real case.'
  - Sampling error is about choosing a sample, not test results.
  - The gold standard is taken as true; the error is the test's.
  src:
    page: 15
    quote: Which means that we will always have some false positives (type I error) and some false negatives (type II error)
  status: unverified
