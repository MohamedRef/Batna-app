    status: unverified
    steps:
      - kind: explain
        page: 37
        title: "Immune haemolysis: التقسيم"
        quote: "Haemolytic disease of newborn-Rh or ABO."
        text: |
          1. **Autoimmune**: ==warm== أو ==cold==.
          2. **Alloimmune**: haemolytic disease of the newborn (Rh أو ABO)، و haemolytic transfusion reactions.
          3. **Drug-induced**.

          الـ **warm autoimmune haemolytic anaemia (AIHA)** أشهر نوع: **Immunoglobulin G (IgG)** أو **C3b** على الكرة، والـ macrophages في **الطحال** بتمسكها وتكسرها، لأن عندها **receptors** بتتعرف على الـ IgG والـ C3b اللي على الكرة. يعني الـ antibody مش بيكسّر الكرة بنفسه؛ هو بيعلّم عليها، والطحال ينفّذ.
      - kind: figure
        page: 37
        quote: "IgG-coated red cells are trapped in the spleen. And are sequestered and destroyed ."
        title: "Warm ولا cold: مين بيكسّر الكرة؟"
        alt: "Two panels. Warm: IgG at 37 °C coats a red cell, a spleen macrophage with Fc receptors grabs it; the cell loses membrane and leaves as a microspherocyte. Cold: IgM at 0 to 4 °C in cold fingers binds several red cells together (agglutination) and fixes complement."
        caption: "الـ ==warm IgG== بيعلّم الكرة والطحال ياكلها، فتطلع **microspherocytes**. الـ **cold IgM** بيلم الكرات في البرد ويشغّل الـ complement، فتشوف **agglutination**."
        svg: |
