  - id: neph.L08.025
    kind: card
    topic: histology
    front: Define endocapillary hypercellularity.
    back: Increased cellularity internal to the GBM, made of leukocytes, endothelial cells and/or mesangial cells.
    src: { page: 215, quote: "Increased cellularity internal to the GBM composed of leukocytes, endothelial cells and/or mesangial cells." }
    status: unverified
  - id: neph.L08.026
    kind: card
    topic: histology
    front: Define extracapillary hypercellularity.
    back: Increased cellularity in Bowman's space, i.e. more than one layer of parietal or visceral epithelial cells, or monocytes/macrophages.
    src: { page: 215, quote: "Increased cellularity in Bowman‘s space, i.e. > one layer of parietal or visceral epithelial cells, or monocytes/macrophages." }
    status: unverified
