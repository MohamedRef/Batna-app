            <text x="18" y="136" class="t-sm t-mut">&lt;10% bleed at 2 y</text>
            <path d="M83 144V188" class="fg-arrow-bad" marker-end="url(#L03d)"/>
            <text x="76" y="172" text-anchor="end" class="t-sm t-bad">12%/y</text>
            <rect x="176" y="150" width="146" height="34" rx="8" class="fg-acc"/>
            <text x="184" y="172" class="t-sm t-b">Prevent growth</text>
