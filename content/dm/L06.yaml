  - id: dm.L06.019
    kind: mcq
    topic: neuro
    stem: A 50-year-old man with type 2 diabetes has symmetric burning feet. He cannot feel the 10-g monofilament at three sites and has reduced vibration at the big toe. Ankle reflexes are absent. What is the next step to confirm diabetic peripheral neuropathy?
    options:
      - No further test is needed; nerve conduction is not necessary
      - Nerve conduction studies for all patients
      - Sural nerve biopsy
      - MRI of the lumbar spine
      - Electromyography of the thigh muscles
    answer: 0
    why:
      - "Correct: nerve conduction studies are not necessary to assess DPN (p69)."
      - NCS are only for a suspected non-diabetic cause (p70).
      - Biopsy is not part of the lecture's assessment.
      - A symmetric distal picture does not call for spine imaging.
      - EMG is not needed for typical DPN.
    src: { page: 69, quote: "Nerve Conduction Studies (NCS):\n  NOT necessary to assess diabetic peripheral neuropathy." }
    status: unverified
