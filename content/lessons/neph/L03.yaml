  - id: neph.L03.lesson1
    title: "القلب والكلى: مين وقّع مين؟"
    hook: "عضوين متجوزين جواز كاثوليكي: لو واحد تعب، التاني بيتعب وراه. السؤال بس مين بدأ."
    minutes: 9
    pages: [68, 71]
    topics: [definition, pathogenesis]
    goals:
      - "تعرّف الـ cardiorenal syndrome زي الـ 2008 consensus"
      - "تفرّق الخمس أنواع في ثانية: مين primary ومين secondary، acute ولا chronic"
      - "تفهم إزاي كل نوع بيأذي التاني (Figures 1–5)"
    status: unverified
    steps:
      - kind: explain
        page: 68
        title: "التعريف"
        quote: "disorders of the heart and kidneys whereby acute or chronic dysfunction in one organ may induce acute or chronic dysfunction of the other"
        text: |
          الـ **cardiorenal syndrome (CRS)** اتعرّف في **2008 consensus conference** كده:

          ==disorders of the heart and kidneys== اللي فيها **acute أو chronic dysfunction** في عضو بتعمل **acute أو chronic dysfunction** في التاني.

          يعني مش مجرد عيان عنده مرضين؛ لازم يكون واحد فيهم هو اللي **جاب** التاني.
      - kind: figure
        page: 69
        quote: "Alteration of renal perfusion is the main trigger (in particular when congestive heart failure is present)"
        title: "الخمس أنواع في صورة واحدة"
        alt: "Five columns for CRS types 1 to 5. Each shows the primary organ on top and the secondary organ below with an arrow. Types 1 and 2: heart to kidney. Types 3 and 4: kidney to heart. Type 5: a systemic disease box on top with both heart and kidney below. Odd types are acute, even types chronic."
        caption: "الأنواع **1 و 2** القلب بادئ، **3 و 4** الكلى بادئة، و **5** مرض systemic ضرب الاتنين. والفردي **acute** والزوجي **chronic**."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L03a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
