  # ------------------------------------------------------------------
  - id: hb.L03.lesson4
    title: "قبل أول نزيف: beta-blocker ولا رباط؟"
    hook: "الـ carvedilol بيقفل الحنفية ويرخّي الصباع في نفس الوقت. وإمتى الـ EBL يكسب؟"
    minutes: 9
    pages: [45, 48]
    topics: [primary-prophylaxis]
    goals:
      - "تعرف إن مفيش pre-primary prophylaxis بالـ beta-blockers في الكتاب"
      - "تختار بين NSBB و EBL في الـ primary prophylaxis"
      - "تربط كل علاج بالـ R أو الـ F في المعادلة"
      - "تشرح ميزة الـ carvedilol، تعريف الـ haemodynamic response، وجرعته"
    status: unverified
    steps:
      - kind: explain
        remind: [hb.L03.035]
        page: 45
        quote: "Cirrhosis, no varices: No specific pre-primary prophylaxis, Treat underlying liver disease, f/u endoscopy after 2-3 years"
        title: "Cirrhosis من غير varices"
        text: |
          الكتاب (Conclusion I) بيقول للمريض اللي عنده cirrhosis ومعندوش دوالي:

          - ==No specific pre-primary prophylaxis==: مفيش علاج وقائي خاص.
          - Treat the underlying liver disease: عالج السبب (فيروس، كحول، دهون).
          - **Follow-up endoscopy**: بعد 2–3 سنين.

          والأهم (صفحة 46): beta-blockers cannot be recommended to prevent the formation of varices. يعني ما تدّيش **propranolol** لواحد معندوش دوالي علشان «ما تطلعش».

          ليه؟ لأن الدراسات ما لقتش فايدة في المرحلة دي، والمريض هياخد أعراض جانبية على الفاضي. علاج السبب هنا هو اللي بيفرق: لو الفيروس اتعالج، الضغط ممكن ينزل لوحده.
      - kind: update
        page: 46
        quote: "Beta-blockers cannot be recommended to prevent the formation of varices."
        text: |
          **Baveno VII** بيدّي **non-selective beta-blocker (NSBB)** (carvedilol preferred) لأي compensated cirrhosis عنده **clinically significant portal hypertension (CSPH)** علشان يمنع الـ decompensation، سواء فيه varices ولا لأ.

          بس برضه مش علشان «يمنع تكوين الـ varices» في مريض معندوش CSPH.

          في الامتحان: الكتاب بيقول beta-blockers cannot be recommended to prevent the formation of varices.
        ref: "Baveno VII consensus, 2021"
      - kind: figure
        page: 46
        quote: "Beta-blockers cannot be recommended to prevent the formation of varices."
        title: "Baveno IV في الكتاب"
        image: { file: hb/L03-baveno-iv.webp, book: true }
        alt: "Book graphic: two document covers at the top, 'Baveno IV' on the left and a practice guideline on 'Prevention and Management of Gastroesophageal Varices and Variceal Hemorrhage in Cirrhosis' on the right, joined by a blue three-way arrow that points down to a box: 'Beta-blockers cannot be recommended to prevent the formation of varices.'"
        caption: |
          فوق صورتين لغلاف مرجعين: **Baveno IV** شمال، وعلى اليمين practice guideline للـ varices والـ variceal hemorrhage. السهم الأزرق بيجمعهم وينزل لصندوق واحد تحت: **Beta-blockers cannot be recommended to prevent the formation of varices.**

          يعني الرسمة بتقول إن ==المرجعين متفقين==: مريض cirrhosis من غير varices ما ياخدش beta-blocker علشان يمنع تكوينها. وده رقم الكتاب اللي يتكتب، حتى لو Baveno VII غيّر الكلام زي ما الخطوة اللي فوق قالت.
      - kind: explain
        page: 45
        quote: "Patients with small varices could be treated, specially if there are red color signs and/or if the patient is in Child C class"
        title: "الـ primary prophylaxis"
        text: |
          **مين يتعالج قبل أول نزيف؟**

          - **No varices**: no indication to treat.
          - **Small varices**: could be treated، specially لو فيه ==red colour signs== و/أو **Child C**. والباقيين ممكن يتعالجوا علشان يمنعوا النمو، بس further studies are needed.
          - **Moderate or large varices**: الـ beta-blockers هي الـ treatment of choice، و ==endoscopic band ligation (EBL)== للي عندهم contraindications أو intolerance للـ beta-blockers.

          ليه الـ red signs والـ Child C بيقلبوا القرار في الـ small varices؟ لأنهم أقوى مؤشرات للنزيف: الدوالي صغيرة بس جدارها رفيع، أو الكبد ضعيف جدًا ومش هيستحمل نزيف.

          **Baveno IV (2005)** للـ medium/large varices:
          - **Non-selective beta-blockers (NSBBs)** بتقلل خطر أول نزيف.
          - **Prophylactic EBL** مفيد.
          - الـ EBL أكثر فاعلية من الـ NSBB في منع أول نزيف، بس ما بيحسّنش الـ survival، والـ long-term benefit مش أكيد لأن الـ follow-up كان قصير.
      - kind: reveal
        page: 46
        quote: "EBL is more effective than non-selective beta-blockers in preventing first variceal bleeding but does not improve survival."
        prompt: "الـ EBL بيمنع النزيف أحسن... طب ليه ما بيحسّنش الـ survival؟"
        answer: |
          لأن الـ EBL علاج موضعي: بيربط الوريد اللي قدامك، بس الـ portal pressure اللي وراه زي ما هو.

          الـ NSBB بيقلل الـ **F** في المعادلة، فبينزّل الضغط في كل حتة: مش بس الـ varices، كمان باقي مضاعفات الـ PH. (ده المنطق الفسيولوجي، الكتاب بيدّيك النتيجة بس.)
      - kind: figure
        page: 46
        quote: "Rationale Basis for the Treatment of Portal Hypertension: ▲ Portal Pressure = Resistance x Blood Flow\n| Increased Hepatic Resistance (mechanic / dynamic) | Increased Splanchnic Blood Flow |\n|---|---|\n| Vasodilators (nitrates); TIPS | Vasoconstrictors: BBlockers; Terlipressin, SMT |\n| ✗ Increased Portal Pressure | ✗ Increased Portal Pressure |"
        title: "Rationale Basis في الكتاب"
        image: { file: hb/L03-treatment-rationale.webp, book: true }
        alt: "Book diagram under 'Portal Pressure = Resistance x Blood Flow'. Two ovals: 'Increased Hepatic Resistance (mechanic / dynamic)' on the left and 'Increased Splanchnic Blood Flow' on the right. Under the left oval: vasodilators (nitrates), TIPS. Under the right: vasoconstrictors, beta-blockers, terlipressin, SMT. Red crosses under both point down to 'Increased Portal Pressure'."
        caption: |
          تحت المعادلة **Portal Pressure = Resistance x Blood Flow**:

          - **البيضاوي الشمال**: **Increased Hepatic Resistance (mechanic / dynamic)**، وتحته العلاج: **Vasodilators (nitrates)** و **TIPS**.
          - **البيضاوي اليمين**: **Increased Splanchnic Blood Flow**، وتحته **Vasoconstrictors**: الـ beta-blockers والـ terlipressin والـ somatostatin (مكتوبين في الصورة مختصرين).
          - **تحت**: علامتين X حمرا على الطريق لـ **Increased Portal Pressure**: كل علاج بيقطع رجل من الرجلين.

          الصورة بتقسم العلاجات على ==R ولا F==، والرسمة اللي بعدها بتزوّد عليها الـ carvedilol اللي بيضرب في الاتنين.
      - kind: figure
        page: 46
        quote: "Rationale Basis for the Treatment of Portal Hypertension: ▲ Portal Pressure = Resistance x Blood Flow\n| Increased Hepatic Resistance (mechanic / dynamic) | Increased Splanchnic Blood Flow |\n|---|---|\n| Vasodilators (nitrates); TIPS | Vasoconstrictors: BBlockers; Terlipressin, SMT |\n| ✗ Increased Portal Pressure | ✗ Increased Portal Pressure |"
        title: "كل علاج بيضرب في أنهي حتة من المعادلة؟"
        alt: "Portal pressure equals resistance times flow. Left: increased hepatic resistance (mechanic or dynamic) is lowered by vasodilators such as nitrates and by TIPS. Right: increased splanchnic blood flow is lowered by vasoconstrictors: beta-blockers, terlipressin, somatostatin. Bottom: carvedilol acts on both, beta-blockade lowering flow and alpha-1 blockade lowering resistance."
        caption: "الـ **R** بتنزل بالـ nitrates والـ TIPS، والـ **F** بتنزل بالـ beta-blockers والـ terlipressin والـ somatostatin. والـ **carvedilol** بيضرب في الاتنين."
        svg: |
          <svg viewBox="0 0 330 316" xmlns="http://www.w3.org/2000/svg">
            <defs>
