items:
  # ---------- p103: overview and goals ----------
  - id: dm.L09.001
    kind: card
    topic: overview
    front: What is fundamental at every stage of type 2 diabetes treatment?
    back: Diet therapy and exercise, to reach glycemic goals; drugs are added on top as the disease progresses.
    src: { page: 103, quote: "Type 2 diabetes is a progressive disease. In all stages diet therapy and exercise are fundamental in order to attain glycemic goals." }
    status: unverified
  - id: dm.L09.002
    kind: cloze
    topic: overview
    text: "Start oral {{c1::monotherapy}} when HbA1c is below {{c2::7.5%}}; with HbA1c 7.5–9% at diagnosis you can start with {{c3::dual oral}} therapy."
    src: { page: 103, quote: "Initially oral monotherapy is used when the HBA1c is less than 7.5%" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L09.003
    kind: cloze
    topic: overview
    text: "If HbA1c at diagnosis exceeds {{c1::9%}}, you can begin with {{c2::dual or triple}} oral therapy."
    src: { page: 103, quote: "if the HBA1c is exceeding 9% we can begin by dual or triple oral therapy." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L09.004
    kind: card
    topic: overview
    front: Why is insulin often needed later in type 2 diabetes?
    back: Because beta-cell exhaustion continues as the disease progresses.
    src: { page: 103, quote: "As beta- cell exhaustion continues,̰ the addition of insulin is often needed." }
    status: unverified
  - id: dm.L09.005
    kind: card
    topic: overview
    front: What is the essential goal of treating type 2 diabetes, per the lecture?
    back: Treat to target, to prevent or at least delay diabetes-related complications.
    src: { page: 103, quote: "Our essential goal is to treat to target and to prevent or at least delay the diabetes related complications." }
    status: unverified
  - id: dm.L09.006
    kind: enumerate
    topic: overview
    prompt: Two goals of glycemic control?
    points:
      - Relieve symptoms
      - Prevent or delay micro- and macrovascular complications
    pass: 2
    src: { page: 103, quote: "To prevent/delay micro and macrovascular complications." }
    status: unverified
  - id: dm.L09.007
    kind: table
    topic: overview
    title: ADA treatment goals for glycemic control
    columns: [Measure, Goal]
    rows:
      - [Preprandial blood glucose, "80–130 mg/dl"]
      - [Postprandial blood glucose, "<180 mg/dl"]
      - [HbA1c, "<7%"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 103, quote: "Preprandial BG 80-130 mg/dl Postprandial BG <180 mg/dl HbA1c <7%" }
    status: unverified
    tags: [numbers, high-yield]
  # ---------- p104: the classes ----------
  - id: dm.L09.008
    kind: enumerate
    topic: overview
    prompt: The 8 classes of oral antidiabetic drugs?
    points:
      - Sulfonylureas
      - Biguanides
      - Alpha-glucosidase inhibitors
      - Meglitinides
      - Thiazolidinediones
      - DPP-4 inhibitors (incretin enhancers)
      - SGLT2 inhibitors
      - Oral GLP-1 RA (incretin mimetics)
    pass: 7
    src: { page: 104, quote: "8 distinct classes of oral antidiabetic agents are actually available" }
    status: unverified
    tags: [high-yield]
  # ---------- p104-106: sulfonylureas ----------
  - id: dm.L09.009
    kind: cloze
    topic: su
    text: "Sulfonylureas lower HbA1c by {{c1::1–2% (about 1.5%)}}."
    src: { page: 104, quote: "Sulfonylureas (SUs): Decrease HbA1c 1%-2% (~ 1.5%)" }
    status: unverified
    tags: [numbers]
  - id: dm.L09.010
    kind: table
    topic: su
    title: First-generation sulfonylureas (rarely used)
    columns: [Drug, Daily dose, Duration]
    rows:
      - [Tolbutamide (Rastinon), "500–3000 mg", "Short acting, 4–6 h"]
      - [Acetohexamide (Dymelor), "250–1500 mg", "Intermediate, 12–24 h"]
      - [Chlorpropamide (Pamidine), "100–500 mg", "Long acting, 24–60 h"]
    blanks: [[0, 2], [1, 2], [2, 2]]
    src: { page: 104, quote: "Chlorpropamide: 100-500 mg/d (Pamidine)……….(long acting 24-60h)" }
    status: unverified
  - id: dm.L09.011
    kind: table
    topic: su
    title: Second- and third-generation sulfonylureas
    columns: [Drug, Daily dose, Duration]
    rows:
      - [Glibenclamide (Daonil), "0.5–20 mg", Intermediate]
      - [Gliclazide (Diamicron), "80–240 mg", Intermediate]
      - [Gliclazide MR (Diamicron MR), "30–120 mg", Intermediate]
      - [Glipizide (Minidiab), "2.5–40 mg", Short]
      - [Glimepiride (3rd generation), "1–8 mg", Intermediate]
    blanks: [[0, 1], [1, 1], [3, 2], [4, 1]]
    src: { page: 104, quote: "Glimepiride: 1-8 mg/d ……………………………( Intermediate acting)" }
    status: unverified
    tags: [numbers]
  - id: dm.L09.012
    kind: card
    topic: su
    front: Which sulfonylurea is the only short-acting one among the commonly used second-generation drugs?
    back: Glipizide (Minidiab), 2.5–40 mg/d.
    src: { page: 104, quote: "Glipizide: 2.5-40 mg/d (Minidiab)……….(short acting)" }
    status: unverified
  - id: dm.L09.013
    kind: card
    topic: su
    front: Main (pancreatic) mechanism of sulfonylureas?
    back: They bind SU receptors (SURs) on the beta-cell membrane and close ATP-sensitive K+ (KATP) channels, which stimulates insulin secretion.
    src: { page: 104, quote: "leading to closure of the ATP-sensitive K+ (KATP) channels." }
    status: unverified
    tags: [high-yield]
  - id: dm.L09.014
    kind: card
    topic: su
    front: What is the status of the extrapancreatic effect of sulfonylureas?
    back: It is a controversial debate.
    src: { page: 105, quote: "Extrapancreatic Effect of SUs is a Controversial Debate" }
    status: unverified
  - id: dm.L09.015
    kind: enumerate
    topic: su
    prompt: Proposed extrapancreatic effects of sulfonylureas?
    points:
      - Less hyperglycemia improves peripheral insulin sensitivity
      - Lower hepatic extraction of insulin, so higher peripheral insulin levels
      - A direct insulin-mimetic effect
      - A direct insulin-sensitizing effect
    pass: 3
    src: { page: 105, quote: "SUs decrease the rate of hepatic extraction of insulin, leading to increased peripheral insulin levels." }
    status: unverified
  - id: dm.L09.016
    kind: card
    topic: su
    front: What is the insulin-mimetic effect of glimepiride and some second-generation SUs?
    back: They stimulate GLUT4 translocation to the cell membrane (by dephosphorylating GLUT4, which prevents its internalization), improving peripheral glucose uptake.
    src: { page: 105, quote: "Glimepiride and some of the 2nd generation SUs stimulate GLUT4 translocation in both normal and insulin-resistant cells through dephosphorylation of GLUT4" }
    status: unverified
  - id: dm.L09.017
    kind: card
    topic: su
    front: How do glimepiride and some second-generation SUs sensitize to insulin?
    back: They stimulate adiponectin and inhibit TNF-alpha release from adipocytes, improving insulin action at the receptor.
    src: { page: 105, quote: "They stimulate adiponectin and inhibit TNF alpha release from adipocytes, which leads to improvement in insulin sensitivity." }
    status: unverified
  - id: dm.L09.018
    kind: cloze
    topic: su
    text: "Most SUs bind {{c1::SUR1 (140 kDa)}} on beta cells; glimepiride binds {{c2::SURx (65 kDa)}}."
    src: { page: 106, quote: "SURx (65 Kd) in pancreatic -cells for binding of glimepiride (3rd generation SU)" }
    status: unverified
  - id: dm.L09.019
    kind: enumerate
    topic: su
    prompt: Side effects of sulfonylureas?
    points:
      - Hypoglycemia
      - Weight gain
      - Skin rashes
      - Cholestatic jaundice (chlorpropamide, acetohexamide)
      - Blood dyscrasia and bone marrow depression
      - Frequent primary or secondary failure
    pass: 5
    src: { page: 106, quote: "Hypoglycemia. Weight gain. Skin rashes. Cholestatic jaundice in case of chlorpropamide & acetohexamide" }
    status: unverified
    tags: [high-yield]
  - id: dm.L09.020
    kind: card
    topic: su
    front: Which sulfonylureas cause cholestatic jaundice?
    back: Chlorpropamide and acetohexamide.
    src: { page: 106, quote: "Cholestatic jaundice in case of chlorpropamide & acetohexamide" }
    status: unverified
  - id: dm.L09.021
    kind: card
    topic: su
    front: Two advantages of sulfonylureas?
    back: High efficacy and low cost.
    src: { page: 106, quote: "Advantages: o High efficacy o Inexpensive" }
    status: unverified
  - id: dm.L09.022
    kind: cloze
    topic: su
    text: "Sulfonylureas: effect on CVD {{c1::neutral}}, on heart failure {{c2::neutral}}, on DKD progression {{c3::neutral}}."
    src: { page: 106, quote: "Effect on CVD: neutral. 7. Effect on HF: neutral. 8. Effect on progression of DKD: neutral." }
    status: unverified
  - id: dm.L09.023
    kind: mcq
    topic: su
    stem: A 58-year-old man on glibenclamide 15 mg/d has gained 4 kg and has two episodes of sweating and confusion before lunch. Which mechanism explains both problems?
    options:
      - Insulin secretion driven by KATP channel closure, regardless of glucose level
      - Inhibition of hepatic gluconeogenesis
      - Delayed carbohydrate absorption
      - PPAR-gamma activation with fluid retention
      - Glucose-dependent GLP-1 receptor activation
    answer: 0
    why:
      - "Correct: SUs close KATP channels and release insulin even when glucose is low, causing hypoglycemia and weight gain (p104, p106)."
      - "That is metformin; it causes no hypoglycemia as monotherapy and is weight neutral."
      - "That is the alpha-glucosidase inhibitors; weight neutral and no hypoglycemia alone."
      - "TZDs cause weight gain and edema but not hypoglycemia as monotherapy."
      - "GLP-1 action is glucose-dependent, so hypoglycemia is not expected, and weight falls."
    src: { page: 106, quote: "Hypoglycemia. Weight gain. Skin rashes." }
    status: unverified
  # ---------- p106-109: metformin ----------
  - id: dm.L09.024
    kind: cloze
    topic: metformin
    text: "Biguanides lower HbA1c by {{c1::1–2% (about 1.5%)}}; of phenformin, metformin and buformin, only {{c2::metformin}} is still used."
    src: { page: 106, quote: "Metformin is the only biguanide currently in clinical use." }
    status: unverified
    tags: [numbers]
  - id: dm.L09.025
    kind: card
    topic: metformin
    front: Does metformin stimulate insulin secretion?
    back: No. Its exact mode of action is controversial, but it certainly does not stimulate insulin secretion.
    src: { page: 106, quote: "The precise mode of action of metformin remains controversial; most certainly, it does not stimulate insulin secretion." }
    status: unverified
    tags: [high-yield]
  - id: dm.L09.026
    kind: card
    topic: metformin
    front: Main mechanism of metformin?
    back: It inhibits hepatic gluconeogenesis, directly or through insulin sensitization, so hepatic glucose output falls.
    src: { page: 106, quote: "inhibiting gluconeogenesis: directly or through insulin sensitizing effect (main effect)." }
    status: unverified
    tags: [high-yield]
  - id: dm.L09.027
    kind: enumerate
    topic: metformin
    prompt: Mechanisms of action of metformin?
    points:
      - Inhibits hepatic gluconeogenesis (main effect)
      - Stimulates anaerobic glycolysis in muscle
      - Increases insulin-mediated peripheral glucose uptake
      - Increases GLUT4 in the membrane of insulin-resistant cells
      - May cause anorexia and decreases intestinal glucose absorption
    pass: 4
    src: { page: 107, quote: "Increases GLUT4 in the plasma membrane of insulin-resistant cells. May lead to anorexia, and it decreases intestinal glucose absorption." }
    status: unverified
    tags: [book-question]
  - id: dm.L09.028
    kind: cloze
    topic: metformin
    text: "Dose of metformin: {{c1::500–2500 mg/d}}."
    src: { page: 107, quote: "Dose of Metformin: 500-2500 mg/d" }
    status: unverified
    tags: [numbers]
  - id: dm.L09.029
    kind: enumerate
    topic: metformin
    prompt: Non-glycemic benefits of metformin?
    points:
      - Weight neutral (may promote weight loss)
      - No hypoglycemia as monotherapy or with non-secretagogues
      - Lowers TG and LDL-C (improves diabetic dyslipidemia)
      - Lowers PAI-1
      - Improves endothelial function (anti-atherosclerotic)
      - Improves ovulation in PCOS
      - Anticancer effect
      - Possible cardiovascular benefit
      - Rare primary and secondary failure
      - Inexpensive
    pass: 7
    src: { page: 107, quote: "Decreases the antifibrinolytic factor PAI-1." }
    status: unverified
    tags: [high-yield]
  - id: dm.L09.030
    kind: card
    topic: metformin
    front: Which study is the only one that examined metformin's overall effect on long-term complications?
    back: UKPDS (1998).
    src: { page: 107, quote: "UKPDS (1998) is the only study that has examined the overall effectiveness of metformin on long-term complications" }
    status: unverified
  - id: dm.L09.031
    kind: table
    topic: metformin
    title: "UKPDS 1998: risk reduction with metformin"
    columns: [Endpoint, Reduction]
    rows:
      - [Any DM-related endpoint, "32%"]
      - [DM-related deaths, "42%"]
      - [All-cause mortality, "36%"]
      - [Myocardial infarction, "39%"]
      - [All macrovascular endpoints, "30%"]
      - [Microvascular endpoints, Not significant]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [5, 1]]
    src: { page: 107, quote: "32% -----in any DM-related endpoint - 42% -----in DM-related deaths - 36% -----in all cause mortality - 39% -----in the risk of MI" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L09.032
    kind: card
    topic: metformin
    front: In UKPDS, what happened to microvascular endpoints with metformin?
    back: They fell, but not significantly.
    src: { page: 108, quote: "Microvascular endpoints were non significantly decreased." }
    status: unverified
  - id: dm.L09.033
    kind: cloze
    topic: metformin
    text: "Metformin: effect on CVD {{c1::potential benefit}}, on heart failure {{c2::neutral}}, on DKD progression {{c3::neutral}}."
    src: { page: 108, quote: "Effect on CVD (cardiovascular disease): potential benefit. Effect on HF (Heart failure): neutral." }
    status: unverified
  - id: dm.L09.034
    kind: enumerate
    topic: metformin
    prompt: Side effects of metformin?
    points:
      - "GI: nausea, dyspepsia, anorexia, diarrhea"
      - Lactic acidosis (rare, fatal in 30%)
      - Lower vitamin B12 and folic acid absorption
    pass: 3
    src: { page: 108, quote: "Gastrointestinal complications: nausea, dyspepsia, anorexia, diarrhea." }
    status: unverified
  - id: dm.L09.035
    kind: cloze
    topic: metformin
    text: "Metformin lactic acidosis is rare but fatal in {{c1::30%}}; it occurs with high doses, especially with {{c2::impaired kidney function}} or uncontrolled {{c3::CHF}}."
    src: { page: 108, quote: "Lactic acidosis: rare and fatal in 30% of cases, it occurs if metformin is given in high doses particularly in patients with impaired kidney functions" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L09.036
    kind: cloze
    topic: metformin
    text: "Metformin is contraindicated with eGFR below {{c1::30 ml/min/1.73 m²}} and in {{c2::chronic alcoholism}}."
    src: { page: 108, quote: "Contraindicated in severely impaired renal function (eGFR <30 ml/min/1.73m2), chronic alcoholism." }
    status: unverified
    tags: [numbers, high-yield]
    update:
      text: "The FDA label also advises against starting metformin when eGFR is 30–45 ml/min/1.73 m²."
      ref: "FDA metformin labeling revision, 2016"
  - id: dm.L09.037
    kind: card
    topic: metformin
    front: What vitamin deficiency does long-term metformin cause?
    back: Reduced vitamin B12 (and folic acid) absorption.
    src: { page: 108, quote: "Decrease in vitamin B12 and folic acid absorption." }
    status: unverified
  - id: dm.L09.038
    kind: card
    topic: metformin
    front: How should metformin be handled around IV iodinated contrast?
    back: Stop it at the time of or before the study, withhold it for 48 hours after, and restart only after renal function is rechecked and normal.
    src: { page: 108, quote: "Metformin should be withheld for 48 hours subsequent to the procedure and reinstituted only after renal function has been re-evaluated and found to be normal." }
    status: unverified
    tags: [high-yield]
  - id: dm.L09.039
    kind: cloze
    topic: metformin
    text: "Contrast-related lactic acidosis on metformin occurs in about {{c1::1 in 500,000}} patients undergoing a contrast study."
    src: { page: 108, quote: "lactic acidosis in patients receiving metformin in about 1 in 500,000 patients taking Metformin and undergoing a diagnostic procedure" }
    status: unverified
    tags: [numbers]
  - id: dm.L09.040
    kind: card
    topic: metformin
    front: Metformin and general anesthesia?
    back: Stop it on the morning of surgery and restart when renal function is rechecked and normal.
    src: { page: 108, quote: "With the use of general anesthesia: stop metformin on the morning of surgery and restart when renal function are re-evaluated & found to be normal." }
    status: unverified
  - id: dm.L09.041
    kind: mcq
    topic: metformin
    stem: A 62-year-old woman on metformin 2 g/d is booked for a contrast CT abdomen tomorrow. eGFR is 70. What is the right plan for metformin?
    options:
      - Stop it at or before the scan, withhold 48 h, restart once renal function is rechecked and normal
      - Continue it unchanged because her eGFR is above 30
      - Stop it permanently and start a sulfonylurea
      - Hold it for 6 hours only
      - Halve the dose for one week
    answer: 0
    why:
      - "Correct: this is the lecture's rule for IV iodinated contrast (p108)."
      - "The book says to stop it for any IV iodinated contrast study, not only with low eGFR."
      - "No need to stop permanently; restart once renal function is normal."
      - "The book says 48 hours, not 6."
      - "Dose reduction is not the book's plan."
    src: { page: 108, quote: "Metformin should be temporarily discontinued at the time of or prior to radiologic studies involving the use of IV iodinated contrast materials" }
    status: unverified
    update:
      text: "Current guidance (FDA 2016, ACR) asks to stop metformin for iodinated contrast mainly when eGFR is 30–60, with liver disease, alcoholism, heart failure or intra-arterial contrast, and to recheck eGFR 48 h after."
      ref: "FDA metformin labeling revision, 2016; ACR Manual on Contrast Media"
  - id: dm.L09.042
    kind: mcq
    topic: metformin
    stem: A 55-year-old man with type 2 DM, eGFR 25 ml/min/1.73 m² and uncontrolled heart failure is taking metformin 2.5 g/d. Which complication is he most at risk of from metformin?
    options:
      - Lactic acidosis
      - Hypoglycemia
      - Cholestatic jaundice
      - Bladder cancer
      - Genital mycotic infection
    answer: 0
    why:
      - "Correct: high dose plus impaired kidneys and uncontrolled CHF is the lecture's setting for lactic acidosis (p108)."
      - "Metformin alone causes no hypoglycemia."
      - "Cholestatic jaundice is a chlorpropamide and acetohexamide effect."
      - "Bladder cancer is a TZD concern."
      - "Genital infection is an SGLT2 inhibitor effect."
    src: { page: 108, quote: "it occurs if metformin is given in high doses particularly in patients with impaired kidney functions or uncontrolled CHF." }
    status: unverified
  - id: dm.L09.043
    kind: card
    topic: metformin
    front: Three advantages of metformin?
    back: High efficacy, low cost, and its non-glycemic benefits.
    src: { page: 109, quote: "High efficacy. Inexpensive. Non glycemic benefits mentioned above." }
    status: unverified
  # ---------- p109-110: alpha-glucosidase inhibitors ----------
  - id: dm.L09.044
    kind: cloze
    topic: agi
    text: "Alpha-glucosidase inhibitors ({{c1::acarbose, miglitol, voglibose}}) lower HbA1c by {{c2::0.5–0.8%}}."
    src: { page: 109, quote: "Alpha-glucosidase inhibitors: Acarbose, Miglitol, Voglibose Decrease HbA1c 0.5-0.8%" }
    status: unverified
    tags: [numbers]
  - id: dm.L09.045
    kind: card
    topic: agi
    front: Mechanism of alpha-glucosidase inhibitors?
    back: Competitive inhibition of intestinal brush-border alpha-glucosidase delays digestion and absorption of disaccharides and complex carbohydrates, blunting postprandial glucose peaks.
    src: { page: 109, quote: "through competitive inhibition of the action of the intestinal brush border alpha- glucosidase enzyme. So, the postprandial blood glucose peaks are blunted." }
    status: unverified
    tags: [high-yield]
  - id: dm.L09.046
    kind: card
    topic: agi
    front: Which incretin do alpha-glucosidase inhibitors increase?
    back: GLP-1, which stimulates insulin and suppresses glucagon.
    src: { page: 109, quote: "They increase the release of GLP-1 which in turn stimulates insulin and suppresses glucagon secretion." }
    status: unverified
  - id: dm.L09.047
    kind: cloze
    topic: agi
    text: "Doses: acarbose {{c1::25–300 mg/d}}, miglitol {{c2::25–300 mg/d}}."
    src: { page: 109, quote: "Dose: Acarbose: 25-300 mg/d Miglitol: 25-300 mg/d" }
    status: unverified
    tags: [numbers]
  - id: dm.L09.048
    kind: enumerate
    topic: agi
    prompt: Advantages of alpha-glucosidase inhibitors?
    points:
      - Weight neutral
      - No hypoglycemia alone or with non-secretagogues
      - May reduce CV mortality by lowering postprandial hyperglycemia (theoretical)
    pass: 2
    src: { page: 109, quote: "No weight gain (weight neutral). No hypoglycemia if used as monotherapy or with non secretagogues." }
    status: unverified
  - id: dm.L09.049
    kind: enumerate
    topic: agi
    prompt: Side effects and disadvantages of alpha-glucosidase inhibitors?
    points:
      - "GI distress: discomfort, flatulence, diarrhea (often stopped)"
      - Complex dosing, 3 times a day
      - Less efficacy than SUs and metformin
      - Hypoglycemia with insulin or SUs, reversed only by glucose
    pass: 3
    src: { page: 109, quote: "GIT distress: abdominal discomfort, flatulence and diarrhea, frequently leading to discontinuation of the drug." }
    status: unverified
  - id: dm.L09.050
    kind: card
    topic: agi
    front: A patient on acarbose plus a sulfonylurea becomes hypoglycemic. What must he take?
    back: Glucose (dextrose). Hypoglycemia in the presence of alpha-glucosidase inhibitors is reversed only by glucose intake.
    src: { page: 110, quote: "the hypoglycemia which occurs in the presence of alpha-glucosidase inhibitors is only reversed by glucose intake." }
    status: unverified
    tags: [high-yield]
  - id: dm.L09.051
    kind: mcq
    topic: agi
    stem: A man on gliclazide and acarbose feels shaky and sweaty; glucose is 52 mg/dl. His wife brings a glass of sweetened tea (sucrose). What is the best advice?
    options:
      - Take pure glucose, because acarbose blocks sucrose digestion
      - Sucrose is fine because it is absorbed directly
      - Eat a starchy meal instead
      - Inject insulin
      - Take an extra acarbose tablet
    answer: 0
    why:
      - "Correct: only glucose reverses hypoglycemia with alpha-glucosidase inhibitors (p110)."
      - "Sucrose is a disaccharide; its digestion is delayed by the drug."
      - "Starch digestion is delayed even more."
      - "Insulin would worsen hypoglycemia."
      - "More acarbose delays carbohydrate absorption further."
    src: { page: 110, quote: "the hypoglycemia which occurs in the presence of alpha-glucosidase inhibitors is only reversed by glucose intake." }
    status: unverified
  # ---------- p110-111: meglitinides ----------
  - id: dm.L09.052
    kind: card
    topic: glinides
    front: Two meglitinides and their chemical classes?
    back: Repaglinide (benzoic acid derivative) and nateglinide (phenylalanine derivative, rarely used).
    src: { page: 110, quote: "Repaglinide: benzoic acid derivative Nateglinide: phenylalanine derivative (rarely in clinical use)" }
    status: unverified
  - id: dm.L09.053
    kind: cloze
    topic: glinides
    text: "Doses: repaglinide {{c1::1–16 mg/d}}, nateglinide {{c2::120–360 mg/d}}."
    src: { page: 110, quote: "Dose: Repaglinide: 1-16 mg/d Nateglinide: 120-360 mg/d" }
    status: unverified
    tags: [numbers]
  - id: dm.L09.054
    kind: card
