            <text x="164" y="236" text-anchor="middle" class="t-sm">IL-12</text>
            <text x="254" y="236" text-anchor="middle" class="t-sm">more</text>
            <text x="30" y="285" text-anchor="middle" class="t-sm t-mut">TH</text>
            <text x="120" y="285" text-anchor="middle" class="t-sm t-mut">Mφ</text>
            <text x="210" y="285" text-anchor="middle" class="t-sm t-mut">TH</text>
          </svg>
      - kind: explain
        page: 5
        quote: "Synergism: when the combined effects of two cytokines on cellular activity is greater than the additive effects of the individual cytokines."
        title: "الطباع الخمسة، وليه بتحصل"
        text: |
          - **Pleiotropy**: cytokine واحد وتأثيرات مختلفة. السبب في صفحة 3: كل خلية عندها الـ receptor بتترجم الإشارة بطريقتها.
          - **Redundancy**: أكتر من cytokine بيعملوا نفس الحاجة. التفسير المقبول (مش في الكتاب): كذا cytokine بيتشاركوا **نفس سلسلة الـ receptor** (هتشوف الـ common γ chain في صفحة 11)، فبيوصلوا لنفس الإشارة جوه الخلية.
          - ==Synergism==: الاتنين مع بعض **أكبر من مجموعهم**، يعني 1 + 1 = 5 مش 2.
          - **Antagonism**: واحد بيلغي أو بيعادل تأثير التاني.
          - ==Cascade induction==: الـ cytokine يخلي الخلية تفرز cytokines تانية، واللي بدوره يشغّل خلايا تانية.

          الخمسة دول هم اللي بيخلوا الـ cytokines "شبكة" مش خطوط منفصلة.
      - kind: match
        page: 5
        quote: "| Attribute | Producing cell | Cytokine | Target cell | Effect |\n|---|---|---|---|---|\n| PLEIOTROPY | Activated TH cells | IL-4 | B cell | Activation, Proliferation, Differentiation |\n| PLEIOTROPY | Activated TH cells | IL-4 | Thymocyte | Proliferation |\n| PLEIOTROPY | Activated TH cells | IL-4 | Mast cell | Proliferation |\n| REDUNDANCY | Activated TH cells | IL-2, IL-4, IL-5 | B cell | Proliferation |\n| SYNERGY | Activated TH cells | IL-4 + IL-5 | B cell | Induces class switch to IgE |\n| ANTAGONISM | Activated TH cells | IL-4, IFN-γ | B cell | Blocks class switch to IgE induced by IL-4 |\nCASCADE INDUCTION\n  Activated TH cells\n  IFN-γ\n  Macrophage\n  IL-12\n  Activated TH cells\n  IFN-γ, TNF, IL-2, and other cytokines"
        prompt: "وصّل كل مثال من رسمة الكتاب بالـ attribute بتاعه:"
        pairs:
          - ["IL-4 acts on B cells, thymocytes and mast cells", "Pleiotropy"]
          - ["IL-2, IL-4 and IL-5 all make B cells proliferate", "Redundancy"]
          - ["IL-4 + IL-5 together switch B cells to IgE", "Synergy"]
          - ["IFN-γ blocks the IgE switch induced by IL-4", "Antagonism"]
          - ["IFN-γ → macrophage → IL-12 → Th → more cytokines", "Cascade induction"]
        why: "ده بالظبط Figure 12-2 في صفحة 5. لاحظ إن IFN-γ لوحده بيعمل cascade و synergy (مع TNF-α على الـ macrophage) و antagonism (ضد IL-4)."
      - kind: check
        page: 5
        quote: "Antagonism: the effects of one cytokine inhibit or offset the effects of another cytokine."
        question: "IL-4 and IL-5 together switch B cells to IgE more than either alone could. Which attribute is this?"
        options: ["Synergism", "Redundancy", "Pleiotropy", "Cascade induction"]
        answer: 0
        why:
          - "صح: التأثير المشترك أكبر من مجموع كل واحد لوحده."
          - "الـ redundancy إن كل واحد لوحده يعمل نفس الشغل (زي IL-2 و IL-4 و IL-5 على تكاثر الـ B cell)."
          - "الـ pleiotropy cytokine واحد على خلايا كتير، زي IL-4 على B cell و thymocyte و mast cell."
          - "الـ cascade إن cytokine يخلي خلية تطلّع cytokine تاني، زي IFN-γ ← macrophage ← IL-12."
      - kind: aside
        tone: analogy
        page: 5
        quote: "Redundancy: two or more cytokines that mediate similar functions. Redundancy makes it difficult to ascribe a particular activity to a single cytokine."
        text: "الـ redundancy زي إن خمس أشخاص في الشغل بيعملوا نفس المهمة: لو حصلت غلطة مش هتعرف تلبسها لمين. عشان كده صعب تنسب activity لـ cytokine واحد."
      - kind: explain
        page: 5
        quote: "Cascade induction: Occurs when the action of one cytokine on target cell induces that cell to produce one or more other cytokines, which in turn may induce other target cells to produce other cytokines."
        title: "ليه ده يهمك كدكتور؟"
        text: |
          التفسير المقبول (مش في الكتاب)، ودي نتايج منطقية للطباع اللي في الكتاب:

          - **عشان الـ redundancy**: لو قفلت cytokine واحد، ممكن غيره يعوّض. ده سبب إن مش كل مريض بيستجيب لنفس الـ biologic.
          - **عشان الـ pleiotropy**: الدوا اللي بيقفل cytokine في المفصل بيقفله في كل مكان تاني، فتظهر side effects زي العدوى.
          - **عشان الـ cascade**: لو قفلت cytokine بدري في السلسلة، بتقطع كل اللي بعده. ده اللي بيخلي قفل ==TNF== لوحده ينفع في الـ RA.
          - **عشان الـ cascade برضه**: من غير فرامل، السلسلة ممكن تكبر لحد ما تبقى ==cytokine storm== (صفحة 15).
      - kind: try
        items: [rheum.L01.014, rheum.L01.017, rheum.L01.021, rheum.L01.022, rheum.L01.025]
    recap:
      - "8 أسامي: monokine، lymphokine، CSF، interleukin، interferon، TNF، growth factor، chemokine."
      - "الاسم إما من الخلية (lymphokine، monokine) أو من أول تأثير اتشاف (TNF، CSF)، يعني قصة الاكتشاف مش الوظيفة."
