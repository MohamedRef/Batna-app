        prompt: "ليه الـ CASPAR بيدّي نقطة للـ nail lesions، وللـ juxta-articular new bone، وبيشترط إنه «distinct from osteophytes»؟"
        answer: |
          كل بند بيمثّل حاجة الـ PsA بيعملها والأمراض التانية لأ:
          - **Nails** (onycholysis، pitting، hyperkeratosis): نفس الـ DIP pattern اللي بيجي مع الـ nail changes، والضافر قريب من الـ entheses.
          - **Dactylitis**: صباع كله وارم (sausage)، علامة enthesitis + synovitis.
          - ==Juxta-articular new bone==: ده الـ **osteoproliferation** بتاع الـ IL-23 axis، الهدم والبنا في نفس المفصل.

          والشرط «distinct from osteophytes» علشان الـ **osteophyte** بتاع الـ osteoarthritis كمان عضم جديد جنب المفصل، فلو ماتفرقش هتدّي نقطة لأي حد عنده خشونة (التفسير المقبول، مش في الكتاب).
      - kind: explain
        page: 334
        title: "المعمل: usually seronegative"
        quote: "Although its absence is considered an important distinguishing feature from RA, low levels of RF may be found in patients (5% to 16%) with typical PsA features."
        text: |
          - **Erythrocyte sedimentation rate (ESR) و C-reactive protein (CRP)** ممكن يعلوا أو لأ.
          - **RF** low-level في **5–16%**.
          - **Anti-citrullinated protein antibodies (ACPA)** في حوالي **5%**.
          - **Antinuclear antibodies (ANA)** > 1:80 في **14%**.

          علشان كده الوصف الأدق: ==usually seronegative==.
