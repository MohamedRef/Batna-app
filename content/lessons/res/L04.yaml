schema: batna.lesson/v1
lecture: res.L04
lessons:
  # ------------------------------------------------------------------
  - id: res.L04.lesson1
    title: "تختار الـ study design إزاي؟"
    hook: "نفس السؤال ممكن تجاوبه بـ case report أو بـ RCT. الفرق بينهم هو الفرق بين «حكاية» و«دليل»."
    minutes: 9
    pages: [3, 15]
    topics: [designs, hierarchy]
    goals:
      - "تفرّق بين prevalence و incidence من غير تفكير"
      - "تعرف الـ 6 عوامل اللي بتحدد الـ design"
      - "ترسم شجرة الـ designs: experimental ولا observational، وبعدين descriptive ولا analytic"
    status: unverified
    steps:
      - kind: explain
        page: 7
        quote: "Introduction:\n  The scientific value and quality of information provided by a medical research are determined to a major extent by the study design.\n  Health researchers use both observational (descriptive and analytic) and experimental study designs to answer research questions.\n  Each type of design represents a different way of collecting the necessary information."
        title: "الـ design هو العمود الفقري"
        text: |
          تخيّل إنك عايز تعرف: **الشيشة بتعمل lung cancer ولا لأ؟** ممكن تحكي عن عيان واحد شافه في العيادة، وممكن تمسك 5000 واحد وتتابعهم 20 سنة. الاتنين «بحث»، بس قيمتهم مختلفة خالص.

          المحاضرة بتقول إن ==scientific value and quality== أي بحث بتتحدد إلى حد كبير بالـ ==study design==.

          والباحثين بيستخدموا نوعين كبار: **observational** بنوعيه descriptive و analytic، و **experimental**. كل واحد طريقة مختلفة لجمع المعلومة.
      - kind: explain
        page: 5
        quote: "Definitions of terms:\n  OUTCOME: Disease or other health-related event under study\n  EXPOSED: Having, or being exposed to, a potential cause or risk factor for disease or other outcome\n  PREVALENCE: A measure of the burden of disease in a population, calculated as the number of individuals with a disease or outcome divided by the total number of individuals in a defined population at a given time. Prevalence is expressed as a proportion\n  INCIDENCE: A measure of the rate at which new development of a disease in a population, calculated as the number of new cases divided by the population at risk over time. Incidence is expressed as a rate per unit time (for example, annual rate)"
        title: "4 كلمات هتسمعهم في كل سطر"
        text: |
          - **Outcome**: المرض أو الحدث الصحي اللي بندرسه (الـ lung cancer).
          - **Exposed**: اللي عنده أو اتعرض لـ potential cause أو ==risk factor== (اللي بيشرب شيشة).
          - **Prevalence**: كل الحالات الموجودة ÷ كل الناس في وقت معين. بتقيس ==burden== المرض، وبتتكتب **proportion**.
          - **Incidence**: الحالات ==الجديدة== ÷ الـ population at risk على مدة. بتتكتب **rate per unit time** (زي annual rate).
      - kind: aside
        tone: analogy
        page: 5
        quote: "Definitions of terms:\n  OUTCOME: Disease or other health-related event under study\n  EXPOSED: Having, or being exposed to, a potential cause or risk factor for disease or other outcome\n  PREVALENCE: A measure of the burden of disease in a population, calculated as the number of individuals with a disease or outcome divided by the total number of individuals in a defined population at a given time. Prevalence is expressed as a proportion\n  INCIDENCE: A measure of the rate at which new development of a disease in a population, calculated as the number of new cases divided by the population at risk over time. Incidence is expressed as a rate per unit time (for example, annual rate)"
        text: |
          الـ **prevalence** زي صورة لعنبر الباطنة الساعة 8 الصبح: كام سرير مليان دلوقتي.

          الـ **incidence** زي دفتر الدخول: كام عيان **جديد** دخل في الشهر.

          عنبر فيه عيانين قاعدين كتير ممكن يكون الـ prevalence عالي والـ incidence واطي. افتكر الصورة دي في أي سؤال.
      - kind: check
        page: 5
        quote: "Definitions of terms:\n  OUTCOME: Disease or other health-related event under study\n  EXPOSED: Having, or being exposed to, a potential cause or risk factor for disease or other outcome\n  PREVALENCE: A measure of the burden of disease in a population, calculated as the number of individuals with a disease or outcome divided by the total number of individuals in a defined population at a given time. Prevalence is expressed as a proportion\n  INCIDENCE: A measure of the rate at which new development of a disease in a population, calculated as the number of new cases divided by the population at risk over time. Incidence is expressed as a rate per unit time (for example, annual rate)"
        question: "Which statement about prevalence is correct?"
        options:
          - "It counts only new cases over a period of time"
          - "It is a proportion of all existing cases in a population at a given time"
          - "It is expressed as a rate per unit time"
          - "Its denominator is only the population at risk"
        answer: 1
        why:
          - "ده **incidence**: new cases بس."
          - "صح: كل الحالات الموجودة ÷ كل الناس في وقت معين = proportion."
          - "الـ rate per unit time بتاعة **incidence**."
          - "الـ population at risk هي مقام الـ **incidence**."
      - kind: explain
        page: 8
        quote: "The selection of an appropriate study design depends on:\n  Knowledge already available about the problem (gaps of knowledge to be filled)\n  Purpose of the research (research questions/objectives/hypotheses)\n  Nature of the problem and its characteristics (specific features of exposure and disease)\n  Time and resources available for the research\n  Skills and creativity of the researcher\n  Ethical considerations"
        title: "أختار الـ design على أساس إيه؟"
        text: |
          المحاضرة بتدّي 6 عوامل:

          - ==Knowledge already available==: إيه الـ gap اللي هنملاه.
          - **Purpose**: الـ research question والـ objectives والـ hypotheses.
          - **Nature of the problem**: خصائص الـ exposure والمرض.
          - **Time and resources**.
          - **Skills and creativity** بتاعة الباحث.
          - **Ethical considerations**.
      - kind: mnemonic
        page: 8
        quote: "The selection of an appropriate study design depends on:\n  Knowledge already available about the problem (gaps of knowledge to be filled)\n  Purpose of the research (research questions/objectives/hypotheses)\n  Nature of the problem and its characteristics (specific features of exposure and disease)\n  Time and resources available for the research\n  Skills and creativity of the researcher\n  Ethical considerations"
        word: "KNOWTS"
        parts:
          - { key: "K", text: "Knowledge already available (the gap)" }
          - { key: "N", text: "Nature of the problem (exposure and disease)" }
          - { key: "O", text: "Objectives: purpose, questions, hypotheses" }
          - { key: "W", text: "Wallet and watch: time and resources" }
          - { key: "T", text: "Talent: skills and creativity of the researcher" }
          - { key: "S", text: "Safety: ethical considerations" }
        hook: "قبل ما تختار design اسأل نفسك: أنا **KNOWTS** إيه؟ (knows بلكنة صعيدي 😄)"
      - kind: explain
        page: 10
        quote: "Research questions and study types\n| State of knowledge of the problem | Type of research questions | Type of study |\n|---|---|---|\n| Knowing that a problem exists but knowing little about its characteristics or possible causes. | What is the nature/magnitude of the problem? Who is affected? How do the affected people behave? What do they know, believe, think about the problem and its causes? | Exploratory studies, or Descriptive studies: Descriptive case studies; Cross-sectional surveys |\n| Suspecting that certain factors contribute to the problem. | Are certain factors indeed associated with the problem? (e.g., Is lack of pre-school education related to low school performance? Is low fibre diet related to carcinoma of the large intestine?) | Analytical (comparative) studies: Cross-sectional comparative studies; Case-control studies; Cohort studies |\n| Having established that certain factors are associated with the problem: desiring to establish the extent to which a particular factor causes or contributes to the problem. | What is the cause of the problem? Will the removal of a particular factor prevent or reduce the problem? (e.g., stopping smoking, providing safe water) | Cohort studies; Experimental or quasi-experimental studies |\n| Having sufficient knowledge about cause(s) to develop and assess an intervention that would prevent, control or solve the problem. | What is the effect of a particular intervention/strategy? (e.g., treating with a particular drug; being exposed to a certain type of health education) Which of two alternate strategies gives better results? Which strategy is most cost-effective? | Experimental or quasi-experimental studies |"
        title: "حالة المعرفة بتختار الـ design"
        text: |
          ده أهم جدول في المحاضرة. كل ما معرفتك بالمشكلة تزيد، الـ design بيطلع درجة:

          - ==عارف إن في مشكلة بس مش عارف عنها حاجة== ← **exploratory / descriptive** (case studies، cross-sectional surveys).
          - **شاكك إن عوامل معينة ليها دور** ← **analytical**: cross-sectional comparative، case-control، cohort.
          - **عارف إن في association وعايز تعرف قد إيه سبب** ← **cohort**.
          - ==عارف السبب كفاية تعمل intervention== ← **experimental / quasi-experimental**.
      - kind: figure
        page: 10
        quote: "Research questions and study types\n| State of knowledge of the problem | Type of research questions | Type of study |\n|---|---|---|\n| Knowing that a problem exists but knowing little about its characteristics or possible causes. | What is the nature/magnitude of the problem? Who is affected? How do the affected people behave? What do they know, believe, think about the problem and its causes? | Exploratory studies, or Descriptive studies: Descriptive case studies; Cross-sectional surveys |\n| Suspecting that certain factors contribute to the problem. | Are certain factors indeed associated with the problem? (e.g., Is lack of pre-school education related to low school performance? Is low fibre diet related to carcinoma of the large intestine?) | Analytical (comparative) studies: Cross-sectional comparative studies; Case-control studies; Cohort studies |\n| Having established that certain factors are associated with the problem: desiring to establish the extent to which a particular factor causes or contributes to the problem. | What is the cause of the problem? Will the removal of a particular factor prevent or reduce the problem? (e.g., stopping smoking, providing safe water) | Cohort studies; Experimental or quasi-experimental studies |\n| Having sufficient knowledge about cause(s) to develop and assess an intervention that would prevent, control or solve the problem. | What is the effect of a particular intervention/strategy? (e.g., treating with a particular drug; being exposed to a certain type of health education) Which of two alternate strategies gives better results? Which strategy is most cost-effective? | Experimental or quasi-experimental studies |"
        title: "سلّم المعرفة"
        alt: "A staircase of four steps. Step 1: problem known, little else, leads to exploratory or descriptive studies. Step 2: factors suspected, leads to analytical studies (cross-sectional comparative, case-control, cohort). Step 3: association known, how much does it cause, leads to cohort. Step 4: cause known, test an intervention, leads to experimental or quasi-experimental."
        caption: "كل ما تطلع درجة في المعرفة، الـ design بيطلع درجة في القوة. أول درجة: **descriptive**. آخر درجة: **experimental**."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="228" width="314" height="62" rx="8" class="fg-thin"/>
            <text x="18" y="250" class="t-b">1. Problem exists, little known</text>
            <text x="18" y="272" class="t-sm t-acc">Exploratory / descriptive</text>
            <rect x="38" y="158" width="284" height="62" rx="8" class="fg-box"/>
            <text x="48" y="180" class="t-b">2. Factors suspected</text>
            <text x="48" y="202" class="t-sm t-acc">Analytical: CS comparative, case-control, cohort</text>
            <rect x="68" y="88" width="254" height="62" rx="8" class="fg-acc"/>
            <text x="78" y="110" class="t-b">3. How much does it cause?</text>
            <text x="78" y="132" class="t-sm t-acc">Cohort</text>
            <rect x="98" y="18" width="224" height="62" rx="8" class="fg-good"/>
            <text x="108" y="40" class="t-b">4. Cause known: intervene</text>
            <text x="108" y="62" class="t-sm t-good">Experimental / quasi-exp.</text>
          </svg>
      - kind: table
        page: 11
        quote: "Ideal study designs according to purpose of study\n| Purpose | Observational design | Intervention design |\n|---|---|---|\n| To estimate prevalence | Cross sectional | |\n| To determine natural history | Cohort | |\n| To identify causes or risk factors or people at high risk | Cohort, case-control, or cross sectional | Randomised trial |\n| To prevent disease | | Randomised trial |\n| To alter course of disease | | Randomised trial |"
        title: "Ideal design by purpose"
        columns: ["Purpose", "Observational", "Intervention"]
        rows:
          - ["Estimate prevalence", "Cross sectional", "-"]
          - ["Natural history", "Cohort", "-"]
          - ["Causes / risk factors", "Cohort, case-control, cross sectional", "Randomised trial"]
          - ["Prevent disease", "-", "Randomised trial"]
          - ["Alter course of disease", "-", "Randomised trial"]
        hide: [[0, 1], [1, 1], [3, 2]]
      - kind: aside
        tone: exam
        page: 11
        quote: "Ideal study designs according to purpose of study\n| Purpose | Observational design | Intervention design |\n|---|---|---|\n| To estimate prevalence | Cross sectional | |\n| To determine natural history | Cohort | |\n| To identify causes or risk factors or people at high risk | Cohort, case-control, or cross sectional | Randomised trial |\n| To prevent disease | | Randomised trial |\n| To alter course of disease | | Randomised trial |"
        text: |
          الدكتورة سألت: «عايزين نعرف **burden** المرض علشان resource allocation، نعمل إيه؟» الإجابة **cross-sectional**.

          كلمة **burden** = **prevalence** = cross-sectional. اربطهم في دماغك سلسلة واحدة، دي أول سطر في جدول الـ **ideal study designs according to purpose**.
      - kind: figure
        page: 13
        quote: "Overview of Epidemiologic Study Designs:\n  EXPERIMENTAL: Random allocation of study subjects; Investigator assigns treatment or exposure:\n    Randomized Control Trials\n    Community Trials\n    Laboratory Trials\n  OBSERVATIONAL: Investigators study people and exposures \"in nature\". Comparison Group?\n    NO, DESCRIPTIVE: Correlational; Case Series; Case Reports; Cross-Sectional\n    YES, ANALYTIC: Case-Control; Cohort"
        title: "شجرة الـ designs"
        alt: "A decision tree. Did the investigator assign the exposure? Yes: experimental (RCT, community trial, laboratory trial). No: observational. Then: comparison group? No: descriptive (correlational, case report, case series, cross-sectional). Yes: analytic (case-control, cohort)."
        caption: "سؤالين بس: **مين اللي حدد الـ exposure؟** وبعدين **في comparison group؟** دول بيصنّفوا أي study في الامتحان."
        svg: |
          <svg viewBox="0 0 330 380" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R04a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="55" y="8" width="220" height="44" rx="8" class="fg-ink"/>
            <text x="165" y="27" text-anchor="middle" class="t-b">Investigator assigns</text>
            <text x="165" y="44" text-anchor="middle" class="t-b">the exposure?</text>
            <path d="M110 52L70 92" class="fg-arrow" marker-end="url(#R04a)"/>
            <path d="M220 52L260 92" class="fg-arrow" marker-end="url(#R04a)"/>
            <text x="78" y="72" class="t-sm t-mut">yes</text>
            <text x="244" y="72" class="t-sm t-mut">no</text>
            <rect x="6" y="96" width="140" height="84" rx="8" class="fg-good"/>
            <text x="76" y="116" text-anchor="middle" class="t-b t-good">Experimental</text>
            <text x="76" y="136" text-anchor="middle" class="t-sm">RCT</text>
            <text x="76" y="152" text-anchor="middle" class="t-sm">Community trial</text>
            <text x="76" y="168" text-anchor="middle" class="t-sm">Laboratory trial</text>
            <rect x="184" y="96" width="140" height="44" rx="8" class="fg-acc"/>
            <text x="254" y="116" text-anchor="middle" class="t-b">Observational</text>
            <text x="254" y="132" text-anchor="middle" class="t-sm t-mut">"in nature"</text>
            <rect x="184" y="160" width="140" height="44" rx="8" class="fg-ink"/>
            <text x="254" y="180" text-anchor="middle" class="t-b">Comparison</text>
            <text x="254" y="196" text-anchor="middle" class="t-b">group?</text>
            <path d="M254 140L254 158" class="fg-arrow" marker-end="url(#R04a)"/>
            <path d="M220 204L110 238" class="fg-arrow" marker-end="url(#R04a)"/>
            <path d="M270 204L270 238" class="fg-arrow" marker-end="url(#R04a)"/>
            <text x="150" y="222" class="t-sm t-mut">no</text>
            <text x="278" y="226" class="t-sm t-mut">yes</text>
            <rect x="6" y="242" width="190" height="110" rx="8" class="fg-thin"/>
            <text x="101" y="262" text-anchor="middle" class="t-b">Descriptive</text>
            <text x="101" y="284" text-anchor="middle" class="t-sm">Correlational (ecological)</text>
            <text x="101" y="302" text-anchor="middle" class="t-sm">Case report / case series</text>
            <text x="101" y="320" text-anchor="middle" class="t-sm">Cross-sectional</text>
            <text x="101" y="342" text-anchor="middle" class="t-sm t-mut">suggest hypotheses</text>
            <rect x="210" y="242" width="114" height="110" rx="8" class="fg-bad"/>
            <text x="267" y="262" text-anchor="middle" class="t-b t-bad">Analytic</text>
            <text x="267" y="284" text-anchor="middle" class="t-sm">Case-control</text>
            <text x="267" y="302" text-anchor="middle" class="t-sm">Cohort</text>
            <text x="267" y="342" text-anchor="middle" class="t-sm t-mut">test hypotheses</text>
          </svg>
      - kind: explain
        page: 12
        quote: "Hierarchy of Scientific Evidence (levels of evidence, top to bottom):\n  Secondary, pre-appraised or filtered studies:\n    Clinical Practice Guidelines\n    Meta-Analysis, Systematic Reviews\n  Primary studies:\n    Level 1, Experimental: Randomized Controlled Trial. Prospective: tests treatment\n    Level 2, Nonexperimental observational: Cohort Studies. Prospective: cohort has been exposed to a risk; observe for outcome of interest\n    Level 3, Nonexperimental observational: Case Control Studies. Retrospective: subjects have the outcome of interest; looking for risk factor\n  Level 4, No design: Case Report or Case Series; Narrative reviews, expert opinions, or editorials\n  Level 5, Not involved with humans: Animal and Laboratory Studies\n(©2016 Forrest & Miller, EBDM in Action; Developing Competence in EB Practice)"
        title: "هرم الأدلة"
        text: |
          الـ **hierarchy of scientific evidence** من فوق لتحت، حسب المحاضرة:

          - **Clinical practice guidelines** و **systematic reviews**: دول ==secondary== (pre-appraised, filtered).
          - **RCT**: experimental، بيختبر علاج.
          - **Cohort**: prospective، ناس اتعرضوا لـ risk وبنستنى الـ outcome.
          - **Case-control**: retrospective، عندهم الـ outcome وبندوّر على الـ risk factor.
          - **Case report / case series**: ==no design==.
          - تحت خالص: narrative reviews و expert opinions و editorials.
      - kind: order
        page: 12
        quote: "Hierarchy of Scientific Evidence (levels of evidence, top to bottom):\n  Secondary, pre-appraised or filtered studies:\n    Clinical Practice Guidelines\n    Meta-Analysis, Systematic Reviews\n  Primary studies:\n    Level 1, Experimental: Randomized Controlled Trial. Prospective: tests treatment\n    Level 2, Nonexperimental observational: Cohort Studies. Prospective: cohort has been exposed to a risk; observe for outcome of interest\n    Level 3, Nonexperimental observational: Case Control Studies. Retrospective: subjects have the outcome of interest; looking for risk factor\n  Level 4, No design: Case Report or Case Series; Narrative reviews, expert opinions, or editorials\n  Level 5, Not involved with humans: Animal and Laboratory Studies\n(©2016 Forrest & Miller, EBDM in Action; Developing Competence in EB Practice)"
        prompt: "رتّب حسب الـ hierarchy of evidence، من أقوى دليل لأضعف دليل:"
        steps:
          - "Systematic reviews"
          - "Randomized controlled trial"
          - "Cohort study"
          - "Case-control study"
          - "Case report or case series"
          - "Expert opinion"
        why: "الـ secondary فوق، وبعدين الـ RCT (experimental)، وبعدين cohort قبل case-control، والـ case report بلا design، والرأي تحت الكل."
      - kind: check
        page: 13
        quote: "Overview of Epidemiologic Study Designs:\n  EXPERIMENTAL: Random allocation of study subjects; Investigator assigns treatment or exposure:\n    Randomized Control Trials\n    Community Trials\n    Laboratory Trials\n  OBSERVATIONAL: Investigators study people and exposures \"in nature\". Comparison Group?\n    NO, DESCRIPTIVE: Correlational; Case Series; Case Reports; Cross-Sectional\n    YES, ANALYTIC: Case-Control; Cohort"
        question: "A cross-sectional survey with no comparison group belongs to which branch?"
        options: ["Experimental", "Observational, analytic", "Observational, descriptive", "Secondary research"]
        answer: 2
        why:
          - "الباحث ما حددش الـ exposure لحد، فهو مش experimental."
          - "الـ analytic محتاج **comparison group**."
          - "صح: observational ومفيش comparison group = **descriptive**."
          - "الـ secondary زي systematic review و meta-analysis، بتجمع دراسات تانية."
      - kind: try
        items: [res.L04.002, res.L04.005, res.L04.008, res.L04.013, res.L04.010]
    recap:
      - "**Prevalence** = كل الحالات ÷ الكل في وقت معين (proportion). **Incidence** = الجديد ÷ الـ at risk على مدة (rate)."
      - "الـ design بيحدده: **KNOWTS** (knowledge، nature، objectives، time/resources، talent، safety/ethics)."
      - "معرفة قليلة ← descriptive. عوامل مشكوك فيها ← analytic. سبب معروف ← experimental."
      - "**Burden/prevalence ← cross-sectional**. Natural history ← cohort. Prevent / alter course ← randomised trial."
      - "سؤالين بيصنفوا أي study: الباحث حدد الـ exposure؟ وفي comparison group؟"
    practice: [res.L04.001, res.L04.002, res.L04.003, res.L04.004, res.L04.005, res.L04.006, res.L04.007, res.L04.008, res.L04.009, res.L04.010, res.L04.011, res.L04.012, res.L04.013, res.L04.014, res.L04.015]

  # ------------------------------------------------------------------
  - id: res.L04.lesson2
    title: "الـ ecological study وفخ الـ fallacy"
    hook: "البلاد اللي بتاكل دهون أكتر عندها breast cancer أكتر. يبقى جارتك اللي بتحب الفطير المشلتت في خطر؟ مش بالضرورة!"
    minutes: 8
    pages: [16, 33]
    topics: [descriptive, ecological]
    goals:
      - "تعدّ الـ 4 أنواع descriptive"
      - "تعرف إن وحدة الـ ecological study هي المجموعة مش الفرد"
      - "تشرح الـ ecological fallacy بمثال"
    status: unverified
    steps:
      - kind: explain
        page: 16
        quote: "Descriptive studies:\n  No testing of a causal hypothesis\n  No Comparison Group\n  Can generate a hypothesis"
        title: "الـ descriptive study في 3 كلمات"
        text: |
          الـ **descriptive study**:

          - ==No testing of a causal hypothesis==: مش بيثبت سبب.
          - **No comparison group**.
          - بس ==can generate a hypothesis==: بيدّيك الفكرة اللي الـ analytic هيختبرها بعدين.

          هو الكشاف اللي بيقولك «بص هنا»، مش القاضي اللي بيحكم.
      - kind: explain
        page: 17
        quote: "Descriptive studies:\n  (1) Correlational (Ecological) studies\n  (2) Case reports and case series\n  (3) Exploratory studies (small-scale)\n  (4) Cross-sectional studies (large-scale)"
        title: "4 أنواع"
        text: |
          1. **Correlational (ecological)** studies
          2. **Case reports and case series**
          3. **Exploratory** studies (small-scale)
          4. **Cross-sectional** studies (large-scale)
      - kind: mnemonic
        page: 17
        quote: "Descriptive studies:\n  (1) Correlational (Ecological) studies\n  (2) Case reports and case series\n  (3) Exploratory studies (small-scale)\n  (4) Cross-sectional studies (large-scale)"
        word: "CREW"
        parts:
          - { key: "C", text: "Correlational (ecological)" }
          - { key: "R", text: "Reports: case reports and case series" }
          - { key: "E", text: "Exploratory (small-scale)" }
          - { key: "W", text: "Wide cross-sectional survey (large-scale)" }
        hook: "الـ descriptive **CREW**: طاقم بيوصف المشكلة قبل ما حد يحكم عليها."
      - kind: explain
        page: 18
        quote: "Correlational (Ecological) Studies:\n  Conducted at a population level rather than on an individual level.\n  The units of observation are population groups rather than individuals.\n  They explore differences in disease rates by:\n    PLACE (geographical studies) or by\n    TIME (time trends studies) in the same region at different times to identify disease patterns that suggest a hypothesis about the cause of disease."
        title: "Ecological: بنبص على البلاد مش الناس"
        text: |
          الـ **correlational (ecological)** study معمول على ==population level==. الوحدة اللي بنقيسها **مجموعة** (بلد، محافظة، سنة)، مش شخص.

          وبيقارن معدلات المرض حسب:

          - ==PLACE==: **geographical studies** (بلاد مختلفة في نفس الوقت).
          - ==TIME==: **time-trend studies** (نفس المكان في أوقات مختلفة).

          الهدف: نلاقي pattern يقترح hypothesis عن السبب.
      - kind: sort
        page: 19
        quote: "Ecological studies, time series: Secular trends in NSAID use and colorectal cancer incidence\n  NSAID use was associated with lower incidence of colorectal cancer\n  Negative correlation\n  Time trend study"
        prompt: "كل مثال من المحاضرة نوعه إيه؟"
        bins: ["Geographical study", "Time-trend study"]
        cards:
          - { text: "Fat calorie intake vs breast cancer across countries", bin: 0 }
          - { text: "Cigarette manufacture vs lung cancer deaths (35-44 y) across countries", bin: 0 }
          - { text: "non-steroidal anti-inflammatory drug (NSAID) use vs colorectal cancer over the years", bin: 1 }
        why: "مقارنة **بلاد** في نفس الوقت = geographical. نفس المكان على مر **السنين** = time trend. وخلي بالك: الـ non-steroidal anti-inflammatory drugs (NSAIDs) **negative** correlation، والاتنين التانيين **positive**."
      - kind: explain
        page: 23
        quote: "The data on exposure (independent) and the outcome (dependent) variables should be at the same level of aggregation (e.g time period, city, region, country, continent)\nThe studies often use data previously collected for alternative purpose (secondary data source). These data are either from records of primary care, secondary care (hospitals), mortality or census data, infectious disease notification data, or national survey data\nWhile using routinely collected data makes ecological studies less time consuming and less expensive than if the data was systematically collected, however the data is less accurate and may be of poor quality"
        title: "الداتا جاية منين؟"
        text: |
          - الـ exposure والـ outcome لازم يكونوا على ==same level of aggregation== (نفس المدة، المدينة، البلد...).
          - غالبًا بيستخدم ==secondary data==: سجلات primary care، مستشفيات، الوفيات، التعداد، الـ notification، المسوح القومية.
          - النتيجة: **أرخص وأسرع**، بس الداتا **less accurate** وممكن تكون poor quality.
      - kind: explain
        page: 22
        quote: "What research questions are best answered with an ecological study design? Ecological studies may be used:\n  To investigate possible correlations between changes in risk factor profiles and disease rates over time.\n  To monitor the effectiveness of health interventions.\n  For the surveillance of communicable and non-communicable diseases.\n  To explore the inequalities in care; e.g. is the incidence rate of hospital admissions for community-acquired pneumonia higher in deprived areas?\n  To explore the quality of care, e.g. comparing mortality rates between different hospitals or geographical regions.\n  To inform resource allocation or health promotion programs.\n  To generate hypotheses about what factors (e.g. environmental) may be involved in preventing or causing a disease.\n  To investigate the physical characteristics of a place in which members of each group work or live, e.g. air-pollution level, temperature or climate."
        title: "بنستخدمه في إيه؟"
        text: |
          - نشوف علاقة تغيّر الـ risk factors بمعدلات المرض على مر الوقت.
          - **Monitor** فعالية برامج صحية، و **surveillance** للأمراض المعدية وغير المعدية.
          - **Inequalities in care**: هل pneumonia admissions أعلى في المناطق الفقيرة؟
          - **Quality of care**: مقارنة الـ mortality بين مستشفيات أو مناطق.
          - ==Resource allocation== وبرامج الـ health promotion.
          - ==Generate hypotheses== عن عوامل بيئية.
          - خصائص المكان: تلوث الهوا، الحرارة، المناخ.
      - kind: explain
        page: 25
        quote: "The weakness of ecological approach is that exposure and disease are measured at the population (group) level.\nEcological fallacy (Definition) is a logic error in the interpretation of statistical data. Drawing conclusions about specific individuals based on the analysis of aggregate data on the larger group.\nThere is assumption that all members of a given population share the same exposure and same risk of disease. Hence caution must be exercised in drawing causal inferences/conclusions for the individual based on the results of an ecological study.\nThe term \"ecological fallacy\" is applied to such conclusions, since the true relation between exposure and disease is distorted by the inability to control for the confounding variables."
        title: "الـ ecological fallacy"
        text: |
          ده ==the major source of error== في الـ ecological studies.

          **التعريف**: logic error إنك تحكم على ==specific individuals== من ==aggregate data== بتاعة المجموعة.

          ليه بيحصل؟ لأننا بنفترض إن كل الناس في البلد عندهم نفس الـ exposure ونفس الـ risk، ولأننا مش قادرين نعمل control للـ **confounding variables**.
      - kind: figure
        page: 26
        quote: "Ecological fallacy: the same association plotted for Countries (a few aggregate points) and for Individuals (clusters of individual points)"
        title: "نقطة البلد بتخبي جواها ناس"
        alt: "Two scatter plots. Left, Countries: four dots rising in a straight line. Right, Individuals: the same four positions as clouds of many people; inside each cloud the people are spread with no clear trend."
        caption: "على مستوى **البلاد** الخط طالع ومقنع. بس جوه كل بلد الناس متفرقين، والفرد مش لازم يمشي زي متوسط بلده."
        svg: |
          <svg viewBox="0 0 330 350" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="18" text-anchor="middle" class="t-b">Countries</text>
