      - kind: explain
        page: 376
        quote: "Gallstones are the commonest biliary pathology"
        title: "حصوات من أيام الفراعنة"
        text: |
          الكتاب بيبدأ بجملتين:

          - **Gallstones are the commonest biliary pathology.**
          - **Most disorders of the biliary tract result from gallstones.**

          يعني لو فهمت الحصوة كويس، فهمت أغلب أمراض المرارة والقنوات: الـ colic والـ cholecystitis والـ cholangitis والـ biliary pancreatitis كلهم بيبدأوا منها.

          ومعلومة لطيفة: فيه أدلة أثرية إن أفراد من العيلة المالكة المصرية القديمة كان عندهم حصوات. يعني المرض ده مصري أصيل من أيام الفراعنة. 😄

          وفي صفحة 376 رسمة للـ **congenital anomalies**، وهي الصورة الجاية. بص عليها مرة علشان تعرف أشكالها، ومش هنحفظها في الدرس ده؛ هتلاقيها card في المراجعة.
      - kind: figure
        page: 376
        title: "المرارة والقنوات لوحدهم"
        image: { file: hb/L19-gb-ducts.webp, book: true }
        alt: "Book drawing of the gallbladder alone with its ducts: a pear-shaped gallbladder on the left, the cystic duct leaving its neck and joining the common hepatic duct, which continues down as the common bile duct."
        caption: |
          نفس المرارة من غير الكبد، علشان تحفظ الشكل الطبيعي قبل الأشكال الخِلقية اللي جاية:

          - الـ **gallbladder** على الشمال: كيس شكله كمترى، قاعه الواسع تحت ورقبته فوق.
          - من رقبتها طالع الـ ==cystic duct== لفوق ويمين.
          - على اليمين الـ **common hepatic duct** نازل من فوق، ولما الـ cystic duct يدخل فيه بيكمّل لتحت واسمه ==common bile duct==.

          خلّي الشكل ده في دماغك: كل anomaly في الصورة الجاية تغيير في واحد من دول: المرارة نفسها، أو الـ cystic duct، أو مكان المرارة من الكبد.
      - kind: figure
        page: 376
        quote: "Congenital GB disease:\n  Double GB\n  Y cystic duct\n  Bilobed GB\n  Folded GB\n  Retroserosal\n  GB Diverticulum\n  Hourglass GB\n  Intrahepatic GB\n  GB with mesentery"
        title: "أشكال المرارة الخِلقية"
        image: { file: hb/L19-gb-anomalies.webp, book: true }
        alt: "Book chart of congenital gallbladder anomalies drawn as outlines: double gallbladder, Y-shaped cystic duct, bilobed, folded, retroserosal, gallbladder diverticulum, hourglass, intrahepatic, and gallbladder with a mesentery."
        caption: |
          - Double gallbladder (GB) و bilobed: مرارتين أو مرارة بفصّين.
          - Folded GB و hourglass: المرارة متنية أو مخنوقة من النص (الـ folded اسمها كمان Phrygian cap، والاسم ده من برّه الكتاب).
          - Intrahepatic، و GB with a mesentery (معلّقة؛ ومن برّه الكتاب: ممكن تلف).

          مش هتتسأل عليهم بالتفصيل، بس اعرف شكلهم لو شفتهم في الـ US.
      - kind: table
        page: 377
        quote: "In Egypt 20%. Prevalence in women is twice that in men. Among cirrhotics 30%."
        title: "أرقام لازم تبقى على طرف لسانك"
        columns: ["Where", "Number"]
        rows:
          - ["Adults worldwide", "10–20%"]
          - ["Female : male", "≈ 2 : 1"]
          - ["Egypt", "20%"]
          - ["Egyptian cirrhotics", "30%"]
          - ["Stay asymptomatic for life", "70–80%"]
          - ["Become symptomatic per year", "1–3% (risk falls with age)"]
        hide: [[2, 1], [3, 1], [4, 1]]
      - kind: mnemonic
        page: 377
        quote: "Risk factors for gallstones include female sex, obesity, increased age, American Indian ethnicity, a Western diet, and a family history. Certain drugs :pills ,anabolic steroids, and somatostatins,hypolipdemicdrugs."
        word: "FAD WAFER"
        parts:
          - { key: "F", text: "Female sex (≈ 2:1)" }
          - { key: "A", text: "Age: advancing age" }
          - { key: "D", text: "Drugs: contraceptive pills, anabolic steroids, somatostatin (long-term octreotide), hypolipidaemic drugs" }
          - { key: "W", text: "Western diet" }
          - { key: "A", text: "American Indian ethnicity" }
          - { key: "F", text: "Family history" }
          - { key: "E", text: "Excess weight: obesity" }
          - { key: "R", text: "Rapid weight loss" }
        hook: |
          الـ **wafer** بقى fad (موضة) في الأكل الغربي، والموضة دي بتعمل حصوات. 🍫

          وفي مصر الكتاب بيزوّد مجموعات انتشارها أعلى:
          - **Diabetics**
          - بعد **gastrectomy** أو **ileal resection**
          - **Hypolipidaemic drugs** و long-term **octreotide** و contraceptive pills
          - **Cirrhotics**: الانتشار 30%

          والـ ileal resection منطقية: الـ bile salts بتترجع من الـ ileum، فلو اتشال، الـ bile salts بتقل والـ cholesterol بيفضل من غير شيّال.
      - kind: explain
        page: 377
        quote: "Risk factors for gallstones include female sex, obesity, increased age, American Indian ethnicity, a Western diet, and a family history."
        title: "ليه عوامل الخطر دي بالذات؟"
        text: |
          الكتاب بيعدّ عوامل الخطر من غير ما يقول ليه. بس كلها بترجع لخطوط المصنع التلاتة اللي في الدرس الجاي: **supersaturation** و **nucleation** و **stasis**. لو ربطتها بيهم مش هتنساها.

          **من الكتاب نفسه (صفحة 380)**:
          - الـ **obesity** والـ **diabetes** بيزوّدوا الـ cholesterol secretion، ودي أشهر سبب للـ supersaturation.
          - الـ **ileal resection** بتقلّل الـ bile salts اللي شايلة الـ cholesterol.

          **التفسير المقبول (مش في الكتاب)**:
          - **Female sex** و **contraceptive pills**: الـ oestrogen بيزوّد الـ cholesterol في الـ bile، والـ progesterone بيكسّل انقباض المرارة. يعني supersaturation و stasis مع بعض.
          - **Rapid weight loss**: الجسم بيطلّع cholesterol من مخازنه في الـ bile، والأكل القليل مش بيخلّي المرارة تنقبض.
          - **Octreotide (somatostatin)**: بيمنع انقباض المرارة، فيعمل stasis.
          - **Hypolipidaemic drugs** (خصوصًا الـ fibrates): بتطلّع cholesterol أكتر في الـ bile.
          - **Gastrectomy**: لو فروع الـ vagus اتقطعت، انقباض المرارة بيضعف.
          - **Cirrhosis**: الـ hypersplenism والـ haemolysis بيزوّدوا الـ bilirubin، فالحصوات هنا غالبًا pigment.

          يعني بدل ما تحفظ عشر عوامل، اسأل 3 أسئلة: الـ cholesterol زاد؟ الـ bile salts قلّت؟ المرارة كسلانة؟
      - kind: check
        page: 377
        quote: "Pigmented stones, on the other hand, are far more often seen in people, particularly with disorders of haemoglobin, resulting in an increase in haemolysis."
        question: "Which patient is MOST prone to **pigment** stones rather than cholesterol stones?"
        options:
          - "A young man with sickle cell disease"
          - "An obese 45-year-old woman"
          - "A woman losing weight fast after bariatric surgery"
          - "A woman on the contraceptive pill"
        answer: 0
        why:
          - "صح: الكتاب بيقول الـ pigment stones في **disorders of haemoglobin** اللي بتزوّد الـ haemolysis. الـ bilirubin الزيادة هو المادة الخام."
          - "دي البروفايل الكلاسيكي للـ **cholesterol** stones (female + obesity)."
          - "الـ **rapid weight loss** بيعمل cholesterol stones."
          - "الـ pills من عوامل الخطر العامة، ومش بتخص الـ pigment."
      - kind: check
        page: 377
        quote: "Prevalence is higher among diabetics after gastrectomy, ilealresection with hypolipaedemicdrugs, long term octreotide, and c pills."
        question: "In Egypt, which group does the book NOT list as having a higher gallstone prevalence?"
        options:
          - "Patients after appendicectomy"
          - "Diabetics"
          - "Patients on long-term octreotide"
          - "Patients after ileal resection"
        answer: 0
        why:
          - "صح: الـ appendicectomy مش في القايمة. القايمة: diabetics، gastrectomy، ileal resection، hypolipidaemic drugs، long-term octreotide و contraceptive pills، والـ cirrhotics (30%)."
          - "الـ **diabetics** أول اسم في القايمة، والـ diabetes بيزوّد الـ cholesterol secretion (صفحة 380)."
          - "الـ **octreotide** في القايمة؛ والتفسير المقبول إنه بيمنع انقباض المرارة."
          - "الـ **ileal resection** في القايمة، لأنها بتقلّل الـ bile salts."
      - kind: try
        items: [hb.L19.005, hb.L19.006, hb.L19.009, hb.L19.010, hb.L19.011]
