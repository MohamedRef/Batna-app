            <text x="18" y="412" class="t-sm">self-expanding metal stent</text>
            <text x="8" y="446" class="t-sm t-mut">Rebleed = hematemesis &gt; 2 h after therapy,</text>
            <text x="8" y="461" class="t-sm t-mut">or Hb drop &gt; 3 g/dL.</text>
