  - id: dm.L01.lesson4
    title: "سلّم الأرقام: تشخّص السكر بالجلوكوز"
    hook: "100، 126، 140، 200، 5.7، 6.5: ستة أرقام بتفرق بين واحد سليم وواحد diabetic."
    minutes: 9
    pages: [8, 10]
    topics: [lab]
    goals:
      - "تحفظ الـ cut-offs للـ FPG والـ 2h-PPPG والـ A1C"
      - "تعرف امتى test واحد يكفي وامتى لازم اتنين"
      - "تعرف ليه الـ glycosuria وسكر البلازما لوحدهم مش كفاية"
    status: unverified
    steps:
      - kind: explain
        remind: [dm.L01.060]
        page: 8
        title: "ليه نهتم بالتشخيص؟"
        quote: "Diagnosis of DM\n  Diabetes Mellitus is a very common disease\n  One third of cases are undiagnosed\n  10-20% of cases of type 2 diabetes have serious vascular disease at presentation."
        text: |
          - ==تلت== الحالات **undiagnosed**.
          - **10–20%** من type 2 عندهم **serious vascular disease** وقت التشخيص.

          التشخيص بيبقى بـ **glucose in venous plasma** أو **haemoglobin A1c (A1C)**. أما الـ **glycosuria**؟ لازم **urgent blood glucose**، بس ==not a diagnostic tool==: الـ renal threshold (حوالي **180**) بيختلف من حد للتاني.

          ليه نعمل screening لناس مالهمش أعراض؟ يعني لو تلت الحالات مش متشخّصة، وواحد من كل 5–10 عنده مضاعفة في الأوعية أول ما يتشخّص، فالسكر بيشتغل سنين في السكوت. كل ما نلحقه بدري، كل ما نمنع ضرر.
      - kind: reveal
        page: 9
        quote: "The renal threshold for glucose is approximately 180 mg/dL and exhibits individual variations."
        prompt: "الـ glycosuria معناها إن السكر في البول. ليه الكتاب بيقول إنها مش diagnostic tool؟"
        answer: |
          لأن الـ **renal threshold** حوالي **180 mg/dL** و **exhibits individual variations**. يعني:

          - واحد الـ threshold بتاعه واطي (زي الحامل) ممكن يطلع عنده سكر في البول وسكر دمه طبيعي.
          - وواحد الـ threshold بتاعه عالي ممكن يبقى diabetic وبوله نضيف.

          فالبول بيقولك «روح قيس سكر الدم **فورًا**» (**requires urgent blood glucose measurements**)، بس عمره ما يشخّص لوحده.
      - kind: explain
        page: 9
        title: "سكر البلازما: رخيص بس متقلّب"
        quote: "Disadvantages include:\n  1- The high diurnal variation in glucose and fasting requirement.\n  2- Individuals may have difficulty fasting for the full 8-h period or may misreport their fasting status.\n  3- Its level is affected by recent physical activity, illness, or acute stress\n  4- Glycolysis is also an important and underrecognized concern with glucose testing. Glucose concentrations will be falsely low if samples are not processed promptly or appropriately stored prior to analysis."
        text: |
          **مميزاته:** رخيص، ومتاح في كل حتة.

          **عيوبه:**
          - **diurnal variation** عالية، ومحتاج صيام.
          - العيان ممكن ما يقدرش يصوم **8 ساعات** أو يكدب في الصيام.
          - بيتأثر بـ **المجهود، المرض، الـ stress**.
          - ==Glycolysis==: لو العينة اتأخرت، السكر يطلع **falsely low**.

          العيوب كلها ليها نفس الجذر: الجلوكوز **رقم بيتحرك** طول اليوم، مع الأكل والمجهود والـ stress. عشان كده الـ fasting بيثبّت الظروف، وعشان كده الكتاب بيصرّ إن العينة تتحلل بسرعة.
      - kind: reveal
        page: 9
        quote: "Disadvantages include:\n  1- The high diurnal variation in glucose and fasting requirement.\n  2- Individuals may have difficulty fasting for the full 8-h period or may misreport their fasting status.\n  3- Its level is affected by recent physical activity, illness, or acute stress\n  4- Glycolysis is also an important and underrecognized concern with glucose testing. Glucose concentrations will be falsely low if samples are not processed promptly or appropriately stored prior to analysis."
        prompt: "العينة قعدت 4 ساعات على الرف. السكر هيطلع أعلى ولا أقل؟ وليه؟"
        answer: |
          **أقل.** كرات الدم في الأنبوبة لسه عايشة وبتاكل جلوكوز (**glycolysis**)، فكل ساعة السكر بينقص.

          علشان كده الكتاب بيقول falsely low لو العينة **not processed promptly**. (الـ mechanism فسيولوجي، والنتيجة من الكتاب.)
      - kind: explain
        remind: [dm.L01.060]
        page: 10
        title: "التلات tests"
        quote: "3-2 hours post oral glucose load (75 g oral glucose) plasma glucose (2h- PPPG): blood sample taken 2 hours after a person has consumed a 75 g oral glucose powder dissolved in 250 ml water"
        text: |
          1. **Random plasma glucose:** أي وقت.
          2. **Fasting plasma glucose:** صيام **8 لحد 12 ساعة** (overnight).
          3. **2h-PPPG:** بعد ساعتين من ==75 g glucose== في **250 ml** ميه.

          ليه 75 g بالظبط؟ التفسير المقبول (مش في الكتاب): ده **حِمل موحّد**، فكل الناس تتقاس على نفس الامتحان، والـ 2-h بيوريك البنكرياس قدر يرجّع السكر لطبيعته ولا لأ. والـ random من غير أعراض ضعيف لأنك ما تعرفش العيان أكل إمتى.
