  - id: dm.L04.015
    kind: mcq
    topic: cardiorenal
    stem: Type 2 diabetes, eGFR 38, ACR 420 mg/g, on maximal ARB. SGLT2 inhibitors cause him recurrent genital infections and he stops them. Next cardiorenal choice?
    options: [GLP-1 RA with proven CVD benefit, Second ARB, Pioglitazone, Glimepiride]
    answer: 0
    why:
      - "Correct: GLP-1 RA if SGLT2i not tolerated or contraindicated (p39)."
      - Dual RAS blockade is not recommended (p43).
      - TZD is an add-on in the ASCVD arm, not the CKD alternative.
      - No kidney benefit.
    src: { page: 39, quote: "GLP-1 RA with proven CVD benefit if SGLT2i not tolerated or contraindicated" }
    status: unverified
