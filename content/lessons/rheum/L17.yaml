          - "الـ synovitis موجود بس مش هو الأساس؛ ده الـ RA."
          - "الغضروف مش المكان الأول في الكتاب."
          - "الـ subchondral bone (osteitis) من الأماكن التانية، مش الأساسي."
      - kind: try
