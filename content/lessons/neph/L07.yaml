  - id: neph.L07.lesson13
    title: "Nail-patella: ضوافر ورُكبة وكلية"
    hook: "نقفل Fabry بسؤال الزرع، وبعدين: ضوافر بايظة، رُكبة من غير صابونة، وقرون في الحوض. ولو شفت ده، اسأل عن البول."
    minutes: 8
    pages: [193, 197]
    topics: [fabry, nps]
    goals:
      - "تعرف الـ NPS: الجين، الهيكل، الضوافر"
      - "تعرف الكلية فيه وليه لازم EM"
      - "تعرف العلاج والزرع والمتبرع"
      - "تقفل Fabry: الزرع بيصلّح الكلية بس، ومين ما يتبرعش"
    status: unverified
    steps:
      - kind: explain
        page: 193
        title: "الزرع: بيصلّح الكلية بس"
        quote: "Renal transplantation is an effective treatment for advanced Fabry nephropathy but does not ameliorate the extrarenal manifestations."
        text: |
          الكتاب:
          - الـ **renal transplantation** ==فعّال للكلية==، بس **ما بيحسّنش** الـ extrarenal manifestations.
          - الكلية المزروعة ممكن تتجمع فيها inclusions، بس غالبًا **مش مهمة إكلينيكيًا**.
          - **الـ heterozygotes ما يتبرعوش**.
          - الموت بعد الزرع غالبًا من **coronary و cerebrovascular disease**.
          - عيان الزرع **مرشّح للـ agalsidase**.

          ليه؟ التفسير المقبول (مش في الكتاب): الكلية الجديدة بتعمل الإنزيم لنفسها جوّه خلاياها، بس الإنزيم ده ما بيلفّش في الجسم كفاية علشان ينضّف القلب والأوعية. والست الـ heterozygous كليتها نفسها فيها المرض (لحد 10% بيوصلوا ESRD)، فإنك تاخد منها كلية بيعرّضها هي والمريض للخطر.
      - kind: explain
        page: 194
        title: "Nail-patella syndrome"
        quote: "Introduction Nail-patella syndrome (NPS) is an uncommon autosomal dominant condition characterized by hypoplasia or absence of the patellae, dys-trophic nails, dysplasia of the elbows and iliac horns, and renal disease."
        text: |
          **Autosomal dominant**، جين ==LMX1B== (transcription factor مهم للأطراف والكلية).

          - **Patella** غايبة أو صغيرة في **أكتر من 90%**.
          - ==Iliac horns== في **80%**: **pathognomonic**.
          - **Nails** في **98%**: bilateral، الإيد أكتر، dystrophic، koilonychia، و **triangular lunulae**.
          - **Elbows**: aplasia أو hypoplasia.
          - **الكلية** في أقل من النص: microhematuria و proteinuria خفيفة في المراهقة، وخطر ESRD **3–5%** بس.

          ليه العضم والضوافر والكلية مع بعض؟ التفسير المقبول (مش في الكتاب): الـ LMX1B transcription factor بيقول للطرف "ده الضهر"، ويقول للـ podocyte إزاي يبني الـ GBM. لما يبوظ، الضهر بتاع الطرف ما يتكوّنش صح (الضوافر والـ patella في ضهر الطرف) والـ podocyte يبني GBM غلط فيحصل proteinuria. وليه الـ iliac horns pathognomonic؟ لأنها مش موجودة في أي مرض تاني.
      - kind: explain
        page: 194
        title: "جين واحد للأطراف والكلية"
        quote: "Although LMXIB appears to be important for normal limb and kidney development, the precise mechanisms for the renal effects of LMX1B mutations remain under investigation."
        text: |
          الكتاب: الـ NPS من mutations في ==LMX1B==، وده **LIM homeodomain transcription factor**، يعني بروتين بيشغّل جينات تانية وقت التكوين. وهو مهم لتكوين **الأطراف والكلية** الاتنين، والآلية في الكلية لسه بتتدرس.

          التفسير المقبول (مش في الكتاب) لربط الصورة: جين واحد بيوجّه **ظهر الطرف** (فيه الضافر والرضفة والكوع)، ونفس الجين بيشتغل في الـ **podocytes**. علشان كده العيوب كلها في **ضهر** الأطراف: الضوافر، والـ patella، والكوع، والـ iliac horns بارزة لورا.

          والوراثة **autosomal dominant**: **يعني** 50% من الأولاد، وده اللي هيفرق في موضوع المتبرع.
      - kind: figure
        page: 196
        quote: "In about 80% of patients, osseous processes project posteriorly from the iliac wings (iliac horns), which is pathog-nomonic"
        title: "الـ NPS بالأرقام"
        alt: "Nail-patella syndrome features with frequencies. Nails abnormal in about 98 percent (bilateral, fingernails more, triangular lunulae). Patellae absent or hypoplastic in over 90 percent. Iliac horns in about 80 percent, pathognomonic. Elbow dysplasia. Kidney disease clinically apparent in under half, 3 to 5 percent reach ESRD."
        caption: "الضوافر ==98%==، الرضفة **أكتر من 90%**، الـ iliac horns **80%** (pathognomonic)، والكلية في **أقل من النص**، و ESRD **3–5%** بس."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="5" width="320" height="38" rx="8" class="fg-acc"/>
            <text x="15" y="29" class="t-sm t-b">Nails</text>
