        title: "3 و 4: المجهود والعمليات"
        quote: "Patients with CAN need to rely on their perceived exertion, not heart rate."
        text: |
          **Exercise intolerance** بسبب: ضعف الـ sympathetic والـ parasympathetic responses، **reduced ejection fraction**، systolic dysfunction وقلة الـ diastolic filling.

          ← العيان يعتمد على ==perceived exertion== مش على الـ heart rate. ليه؟ لأن النبض نفسه مش بيطلع مع المجهود، فلو استنى يوصل لرقم معين هيتعب قبله بكتير أو يزوّدها من غير ما يحس.

          **العمليات:** الـ perioperative morbidity والـ mortality **2–3 أضعاف** في السكر. في التخدير: الـ HR والـ blood pressure (BP) ينزلوا أكتر عند الـ induction، ويعلوا أقل بعد الـ intubation، ومحتاجين **vasopressors** أكتر.

          وليه التخدير خطير؟ أدوية التخدير بتوسّع الأوعية وبتهدّي القلب، والطبيعي إن الـ reflexes تعوّض. في الـ CAN مفيش تعويض، فالضغط يقع أكتر، ولما الأنبوبة تدخل (أكبر stimulus في العملية) القلب مش بيرد.
      - kind: check
