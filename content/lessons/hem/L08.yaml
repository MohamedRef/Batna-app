        title: "busulfan ولا hydroxyurea؟"
        quote: "Side effects are uncommon, although rash, mucositis and diarrhea can occur."
        text: |
          الاتنين **palliative**: بيظبطوا العدد وما بيشيلوش الـ Ph1.

          - ==Hydroxyurea==: آثاره الجانبية **قليلة** (rash، mucositis، diarrhea)، وبتوقفه لما الـ WBC يوصل **5,000**.
