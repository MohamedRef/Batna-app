  - id: git.L06.lesson2
    title: "الـ Crohn: من البُق للشرج وعامل نُقَط"
    hook: "مرض بيخرم الحيطة كلها وبينط من مكان لمكان: اعرف شكله وتصنيفه والعيان بيشتكي من إيه."
    minutes: 9
    pages: [208, 218]
    topics: [cd-pattern, cd-clinical]
    goals:
      - "تفهم ليه الـ transmural بيعمل fistula و stricture"
      - "تصنّف أي Crohn بالـ Montreal في ثانية"
      - "تربط كل fistula بالعَرَض بتاعها"
    status: unverified
    steps:
      - kind: explain
        page: 208
        title: "الـ Crohn بيخرم الحيطة كلها"
        quote: "The inflammation in Crohn disease is typically transmural. This frequently leads to complications from perforating disease or from progressive fibrosis and stricturing."
        text: |
          Dr. Crohn وصف المرض في أمريكا سنة **1932**.

          أهم كلمة فيه: ==transmural==. الالتهاب مش واقف عند الـ mucosa، ده واخد الحيطة كلها. وعلشان كده بيعمل حاجتين:
          - **perforating disease**: abscesses و fistulae
          - **fibrosis and stricturing**: تضيّق

          وبيقدر يمسك **any part of the alimentary canal** بشكل **skip lesions**: حتة عيانة، حتة سليمة، حتة عيانة.
      - kind: figure
        page: 208
        quote: "Nearly half of all patients with Crohn disease have inflammation localized to the Terminal ileum and cecum"
        title: "فين الـ Crohn بيحب يقعد؟"
        alt: "Sketch of the gut from mouth to anus. Patchy red segments mark Crohn skip lesions; the terminal ileum and cecum are shaded darkest and labelled 'nearly half'. The upper GI tract is faint and labelled rare, only with small bowel or colonic disease. A perianal fistula is drawn near the anus."
        caption: "نُص العيانين تقريبًا الالتهاب عندهم في ==terminal ileum and cecum==. الـ upper GI نادر جدًا ومش بيجي لوحده من غير small bowel أو colon."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="20" text-anchor="middle" class="t-b">Crohn: skip lesions, mouth to anus</text>
            <rect x="140" y="34" width="50" height="60" rx="10" class="fg-thin"/>
            <text x="200" y="58" class="t-sm t-mut">Esophagus, stomach,</text>
            <text x="200" y="74" class="t-sm t-mut">duodenum: rare</text>
            <path d="M165 94 C 60 110, 60 150, 165 160 C 270 170, 270 200, 165 210" class="fg-ink" fill="none" stroke-width="10"/>
            <path d="M92 128 C 88 136, 90 142, 96 148" class="fg-arrow-bad" fill="none" stroke-width="10"/>
            <path d="M232 178 C 240 186, 240 192, 232 198" class="fg-arrow-bad" fill="none" stroke-width="10"/>
            <text x="20" y="118" class="t-sm">Small bowel</text>
            <circle cx="165" cy="232" r="22" class="fg-bad"/>
            <text x="165" y="237" text-anchor="middle" class="t-sm t-b">TI</text>
            <text x="196" y="228" class="t-sm t-b">Terminal ileum + cecum</text>
            <text x="196" y="244" class="t-sm t-bad t-b">nearly half of patients</text>
            <rect x="60" y="262" width="210" height="22" rx="8" class="fg-acc"/>
            <rect x="120" y="262" width="40" height="22" rx="4" class="fg-dot-bad"/>
            <text x="165" y="300" text-anchor="middle" class="t-sm">Colon: patchy; rectum often spared</text>
            <rect x="150" y="310" width="30" height="24" rx="6" class="fg-box"/>
            <path d="M180 326 l40 14" class="fg-arrow-bad" stroke-width="3"/>
            <text x="225" y="345" class="t-sm t-bad">Perianal fistula</text>
          </svg>
      - kind: order
        page: 208
        quote: "inflammatory disease frequently progresses to penetrating disease, and then to fibrosis and stricturing"
        prompt: "الـ Crohn behaviour بيتطور عند نفس العيان إزاي؟ رتّب:"
        steps:
          - "Inflammatory"
          - "Penetrating (abscess, fistula)"
          - "Fibrosis and stricturing"
        why: "الكتاب: الـ inflammatory غالبًا بيبقى **penetrating** وبعدين **fibrosis and stricturing**. يعني الـ behaviour مش ثابت عند نفس العيان."
      - kind: table
        page: 218
        quote: "A1 <16 years A2 17-40 years A3 >40 years"
        title: "Montreal classification of Crohn (Table 1)"
        columns: [Domain, Codes]
        rows:
          - ["Age (A)", "A1 <16 · A2 17–40 · A3 >40"]
          - ["Location (L)", "L1 ileal · L2 colonic · L3 ileocolonic · L4 isolated upper"]
          - ["Behaviour (B)", "B1 non-stricturing non-penetrating · B2 stricturing · B3 penetrating"]
          - ["Modifier", "p = perianal disease"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: exam
        page: 218
        quote: "A1 < 40 years A2 >40 years"
        text: |
          الفرق بين **Vienna** و **Montreal** سؤال حلو:
          - Vienna: سنّين بس (**A1 <40**، **A2 >40**).
          - Montreal: تلاتة (**A1 <16**، **A2 17–40**، **A3 >40**)، و L4 بقت **isolated upper**، وزوّد الـ **p** للـ perianal.

          افتكر **16 و 40**: الـ Montreal فصل الأطفال لوحدهم.
      - kind: check
        page: 218
        quote: "B1 non-stricturing, non-penetrating B2 stricturing B3 penetratng p perianal disease modifier"
        question: "A 45-year-old has colonic Crohn with an enterovesical fistula. Montreal code?"
        options:
          - "A3 L2 B3"
          - "A2 L2 B3"
          - "A3 L3 B2"
          - "A3 L2 B1p"
        answer: 0
        why:
          - "صح: فوق 40 = **A3**، colonic = **L2**، fistula = penetrating = **B3**."
          - "A2 من 17 لـ 40، وهو 45."
          - "مفيش ileum هنا، ومفيش stricture."
          - "الـ fistula دي للـ bladder مش perianal، والـ behaviour penetrating مش B1."
      - kind: explain
        page: 209
        title: "العيان بيشتكي من إيه؟"
        quote: "Abdominal pain and diarrhea are the most typical symptoms. Unlike ulcerative colitis, the diarrhea in Crohn disease is often nonbloody."
        text: |
          البداية **insidious**، والـ course متغيّر جدًا: نوبات ونوبات هدوء.

          - أشهر حاجتين: **abdominal pain** و **diarrhea**.
          - الإسهال غالبًا ==nonbloody== (عكس الـ UC).
          - **fever** و **weight loss** شائعين.

          والقاعدة: الـ **location** والـ **phenotype** والـ **severity** هما اللي بيحددوا الأعراض.
      - kind: match
        page: 209
        quote: "gut—diarrhea, weight loss; skin—drainage; vagina—drainage; bladder—pneumaturia"
        prompt: "وصّل كل fistula بالعَرَض بتاعها:"
        pairs:
          - ["Entero-enteric (gut)", "Diarrhea, weight loss"]
          - ["Enterovesical (bladder)", "Pneumaturia"]
          - ["Enterocutaneous (skin)", "Drainage on the skin"]
          - ["Perianal", "Pain and purulent or fecal drainage"]
        why: "الـ fistula بتوصّل الأمعاء بعضو تاني، فالعَرَض بيطلع في العضو ده: هوا في البول لو bladder، إفرازات لو skin أو vagina، وإسهال لو وصّلت الأمعاء ببعضها (short circuit)."
      - kind: aside
        tone: joke
        page: 209
        quote: "bladder—pneumaturia"
        text: |
          عيان Crohn قالك «يا دكتور بعمل حمّام وبيطلع فقاقيع زي البيبسي» 🥤

          ده مش مشروب غازي، ده **pneumaturia**: الـ fistula وصلت الـ bladder.
      - kind: explain
        page: 209
        title: "والكشف؟"
        quote: "Signs of Crohn disease include abdominal tenderness, most classically in the right lower quadrant. An abdominal mass may be palpable."
        text: |
          - **tenderness** في الـ ==right lower quadrant== (مكان الـ terminal ileum).
          - ممكن **abdominal mass**.
          - **temporal wasting** و **cachexia**: malnutrition شديد.
          - في الـ stenosing: علامات **small bowel obstruction** (distention، tympany، high-pitched bowel sounds).
          - افحص الـ perineum والجلد كويس: الـ fistulae بتبان بسهولة.
      - kind: reveal
        page: 209
        quote: "Perianal disease, including abscesses and fistulae, is commonly encountered, particularly in conjunction with terminal ileal disease."
        prompt: "عيان عنده RLQ pain و perianal fistula. تتوقع الـ Crohn فين بالظبط؟"
        answer: "في الـ **terminal ileum**. الكتاب بيقول الـ perianal disease شائع **particularly in conjunction with terminal ileal disease**، والـ RLQ tenderness هو مكان الـ TI."
      - kind: try
        items: [git.L06.022, git.L06.028, git.L06.033, git.L06.035, git.L06.041]
    recap:
      - "Crohn = **transmural** + **skip lesions** + أي حتة من البُق للشرج."
      - "Phenotypes: inflammatory → penetrating → stricturing."
      - "نُص العيانين: terminal ileum + cecum. الـ upper GI نادر ومش لوحده."
      - "Montreal: A1 <16، A2 17–40، A3 >40؛ L1–L4؛ B1–B3؛ p perianal."
      - "إسهال غالبًا nonbloody، RLQ tenderness، والـ fistula عَرَضها في العضو اللي وصلته."
    practice: [git.L06.020, git.L06.021, git.L06.022, git.L06.023, git.L06.024, git.L06.025, git.L06.026, git.L06.027, git.L06.028, git.L06.029, git.L06.030, git.L06.031, git.L06.032, git.L06.033, git.L06.034, git.L06.035, git.L06.036, git.L06.037, git.L06.038, git.L06.039, git.L06.040, git.L06.041, git.L06.131]
