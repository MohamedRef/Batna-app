  # ------------------------------------------------------------------
  - id: neph.L14.lesson9
    title: "الـ light chains: من MGUS لـ myeloma kidney"
    hook: "مش لازم سرطان كبير عشان الكلية تقع. بروتين واحد غلط، بكمية قليلة، ممكن يكفي."
    minutes: 9
    pages: [494, 498]
    topics: [dysprot]
    goals:
      - "تعرف الـ dysproteinemic kidney disease وصورها"
      - "تفرّق بين MGUS و MGRS وتفهم ليه بروتين قليل ممكن يأذي"
      - "تشرح الـ cast nephropathy وأذى الـ proximal tubule"
      - "تقرا Table 2 بالمرض والآلية"
    status: unverified
    steps:
      - kind: explain
        page: 494
        title: "بروتين من clone واحد"
        quote: "Dysproteinemic kidney diseases occur when B or plasma cell clones produce pathogenic monoclonal immunoglobulins or light chains that cause kidney damage."
        text: |
          الـ dysproteinemic kidney disease = **B cell** أو **plasma cell clone** بيطلّع ==pathogenic monoclonal immunoglobulins or light chains== بتأذي الكلية.

          والصورة واسعة جدًا: من **sub-nephrotic proteinuria** أو hematuria بسيطة والكلية سليمة، لحد **nephrotic syndrome** شديد، أو **AKI** أو **RPGN**. والـ patterns: **cast nephropathy**، **deposition diseases**، **amyloidosis**، و **inflammatory GN**.

          ليه الصورة واسعة كده؟ لأن البروتين بيأذي حسب **فين بيقف** وإزاي بيتصرف، وده اللي هتشوفه في الدرس.

          والـ clone نفسه ممكن يكون **myeloma** أو **lymphoma** واضح، أو clone **صغير** (وده الـ MGRS).
      - kind: explain
        page: 495
        title: "MGUS ولا MGRS؟"
        quote: "When monoclonal gammopathy-related kidney damage occurs in the absence of overt malignancy, the hematologic disorder is categorized as monoclonal gammopathy of renal significance (MGRS)."
        text: |
          - "**monoclonal gammopathy of undetermined significance (MGUS)**: monoclonal protein **من غير** end-organ damage."
          - "==monoclonal gammopathy of renal significance (MGRS)==: الـ monoclonal protein **بيأذي الكلية** من غير malignancy واضحة."
          - "**Myeloma**: ~**11/100,000** سنوياً، و **20-30%** بييجوا بـ estimated glomerular filtration rate (eGFR) **<30 mL/min/1.73 m²** وقت التشخيص."

          الفكرة: بروتين قليل ممكن يبقى سام لوحده، مش لازم clone كبير.

          يعني الفرق بين الـ MGUS والـ MGRS مش حجم الـ clone، الفرق إن البروتين أذى الكلية. وعشان كده الـ MGRS بيتعالج حتى لو الـ clone صغير.
      - kind: explain
        page: 495
        title: "ليه بروتين قليل ممكن يبقى سام؟"
        quote: "A monoclonal protein may be toxic due to its ability to bind other proteins, misfold or deposit in tissues. These properties are determined by the physiochemical properties of the protein. which is influenced by its amino acid sequence."
        text: |
          الكتاب بيقول بعض البروتينات ==toxic even at low serum concentrations== وبتأذي ==independent of the underlying clonal cell burden==.

          والسبب: البروتين ممكن **يلزق في بروتينات تانية**، أو **يتطبق غلط (misfold)**، أو **يترسب** في الأنسجة. وده كله بيتحدد بخصائصه الكيميائية اللي جاية من الـ **amino acid sequence**.

          النتيجة العملية: هدف العلاج ==hematologic response== (البروتين يقل أو يختفي) عن طريق إنك **eradicating the underlying clone**، **مهما كان حجم الـ clone**. والـ organ response **dependent on achieving hematologic response**. ومن غير علاج: **progressive CKD** و **ESKD**.
      - kind: explain
        page: 496
        title: "الـ myeloma والكلية بالأرقام"
        quote: "The most common cause of decreased GFR in patients with multiple myeloma is light chain cast nephropathy. In an autopsy series, more than two-thirds of patients with myeloma with renal involvement had cast nephropathy."
        text: |
          - الـ GFR ممكن يقع **بعدين** في المرض، ==usually during relapse==. التفسير المقبول (مش في الكتاب): الـ relapse = الـ clone رجع يطلّع light chains تاني.
          - أشهر سبب لنزول الـ GFR في الـ myeloma: ==light chain cast nephropathy==.
          - في autopsy series: أكتر من **تلتين** مرضى الـ myeloma اللي كليتهم متأثرة كان عندهم cast nephropathy.

          فلو مريض myeloma عنده AKI، أول حاجة في دماغك الـ casts.
      - kind: explain
        page: 496
        title: "Cast nephropathy"
        quote: "The most common cause of decreased GFR in patients with multiple myeloma is light chain cast nephropathy."
        text: |
          الـ **free light chains** بتلزق في **Tamm-Horsfall protein** (uromodulin) في الـ **distal** nephron وتعمل casts ← obstruction ← **giant cell reaction** و interstitial inflammation.

          وفي الـ proximal: endocytosis زيادة عن طريق **cubilin-megalin** ← NF-κB ← IL-6 و TGF-β1 ← fibrosis.

          ليه في الـ distal بالذات؟ لأن الـ Tamm-Horsfall protein بيتعمل هناك، فهناك بس الـ light chain بتلاقي اللي تلزق فيه.
      - kind: explain
        page: 496
        title: "ليه الـ cast بيعمل التهاب كبير؟"
        quote: "This is mediated by hydrogen peroxide produced by the FLC that induces ASK) (apoptosis signal-regulating kinase and NFKB (nuclear factor-KB) through an Src kinase pathway. ASK and NFKB promote the inflammatory reaction'."
        text: |
          الـ cast مش بس سدّة. الكتاب بيقول الـ obstruction ==elicits an intense immune response==: **giant cell reaction** حوالين الـ casts و interstitial inflammation.

          والآلية: الـ free light chain نفسه بيطلّع **hydrogen peroxide**، وده بيشغّل **ASK1** و **NF-κB** عن طريق **Src kinase**، والاتنين بيعملوا التهاب.

          يعني الـ light chain سام **مرتين**: بيسد الـ tubule، وبيولّع الالتهاب حواليه.
      - kind: explain
        page: 497
        title: "الـ proximal tubule: لما الـ reabsorption يبقى أذى"
        quote: "The excessive endocytosis of FLCs by the cubilin-megalin complex expressed on PTCs can trigger apoptotic, proinflammatory and fibrotic pathways."
        text: |
          الـ light chains صغيرة فبتعدّي الـ glomerulus، والـ proximal tubule بيحاول يرجّعها بالـ **cubilin-megalin**. بس لما الكمية ==very high==، الـ endocytosis الزيادة نفسها بتأذي الخلية:

          - **Apoptotic** و **proinflammatory** و **fibrotic** pathways.
          - Redox ← **NF-κB** و **MAPK** ← **IL-6** و **IL-8** و **CCL2** و **TGF-β1**.

          وفي الـ distal: الـ FLC بيلزق في الـ **THP** (Tamm-Horsfall) ويترسب casts، و ==tubular atrophy proximal to the cast== مع inflammation و fibrosis بتزيد.

          التفسير المقبول (مش في الكتاب): الـ IL-6 والـ IL-8 = التهاب، والـ TGF-β1 = تليّف. فالكلية ممكن تفضل ضعيفة حتى بعد ما الـ casts تتشال.

          النتيجة: الـ light chain بيأذي الكلية في مكانين مختلفين بطريقتين مختلفتين.
      - kind: explain
        page: 498
        title: "Table 2: كل مرض وآليته"
        quote: "Table 2: Dysproteinemia-Associated Kidney Diseases\n| Kidney Biopsy Diagnosis | Clinical Presentation | Hypothesized Mechanism of Injury | Clone Detection Rate | Paraprotein Detection Rate |\n| Light chain cast nephropathy | AKI, decreased kidney function, nonalbumin proteinuria | Light chain binds to uromodulin and precipitates in distal tubules, resulting in obstruction and interstitial nephritis | ~100% | ~100% |\n| Monoclonal immunoglobulin amyloidosis: Light chain (AL) amyloidosis; Heavy chain (AH) amyloidosis; Light and heavy chain (AHL) amyloidosis | Proteinuria, NS, decreased kidney function | Monoclonal immunoglobulin forms amyloid fibrils in extracellular tissue | ~100% | ~100% |\n| Monoclonal immunoglobulin deposition disease (MIDD): Light chain deposition disease (LCDD); Heavy chain deposition ... | Decreased kidney function long term, proteinuria | Deposition of pathogenic light chain; in HCDD, almost all patients have CH1 deletion leading to production of truncated HC | LCDD: 90%-100%; HCDD: 100%; LHCDD: 90%-100% | LCDD: 90%-100%; HCDD: 80%-100%; LHCDD: 100% |"
        text: |
          اقرا الجدول بسؤال: **البروتين بيعمل إيه؟** والصورة الإكلينيكية بتطلع منه:

          - **Light chain cast nephropathy:** بيلزق في الـ **uromodulin** ويترسب في الـ distal ← obstruction و interstitial nephritis. فالصورة **AKI** و ==nonalbumin proteinuria==. التفسير المقبول (مش في الكتاب): الـ glomerulus سليم، فالبروتين في البول light chains مش albumin، والـ dipstick ممكن ميشوفهاش.
          - **Amyloidosis (AL، AH، AHL):** البروتين بيعمل ==amyloid fibrils== في الأنسجة، فبيقعد في الـ glomerulus ← **proteinuria** و **NS**.
          - **MIDD (LCDD، HCDD، LHCDD):** ترسيب على الـ basement membranes ← kidney function بتقل **على المدى الطويل** مع proteinuria. وفي الـ **HCDD** تقريبًا كلهم عندهم **CH1 deletion** فالـ heavy chain بيطلع مقطوع.

          والـ clone والـ paraprotein بيتلقوا في **~100%** في الأولانيين، و **80-100%** في الـ MIDD.
      - kind: check
        page: 498
        quote: "Table 2: Dysproteinemia-Associated Kidney Diseases\n| Kidney Biopsy Diagnosis | Clinical Presentation | Hypothesized Mechanism of Injury | Clone Detection Rate | Paraprotein Detection Rate |\n| Light chain cast nephropathy | AKI, decreased kidney function, nonalbumin proteinuria | Light chain binds to uromodulin and precipitates in distal tubules, resulting in obstruction and interstitial nephritis | ~100% | ~100% |\n| Monoclonal immunoglobulin amyloidosis: Light chain (AL) amyloidosis; Heavy chain (AH) amyloidosis; Light and heavy chain (AHL) amyloidosis | Proteinuria, NS, decreased kidney function | Monoclonal immunoglobulin forms amyloid fibrils in extracellular tissue | ~100% | ~100% |\n| Monoclonal immunoglobulin deposition disease (MIDD): Light chain deposition disease (LCDD); Heavy chain deposition ... | Decreased kidney function long term, proteinuria | Deposition of pathogenic light chain; in HCDD, almost all patients have CH1 deletion leading to production of truncated HC | LCDD: 90%-100%; HCDD: 100%; LHCDD: 90%-100% | LCDD: 90%-100%; HCDD: 80%-100%; LHCDD: 100% |"
        question: "A myeloma patient has AKI. Dipstick shows trace protein, but 24-hour urine protein is 4 g. Which lesion fits best?"
        options:
          - "Light chain cast nephropathy: nonalbumin proteinuria"
          - "AL amyloidosis: nephrotic syndrome with albuminuria"
          - "Heavy chain deposition disease with CH1 deletion"
          - "Lupus nephritis class V"
        answer: 0
        why:
          - "صح: الجدول بيقول cast nephropathy = AKI + nonalbumin proteinuria، والـ dipstick بيقيس albumin أساسًا."
          - "الـ amyloidosis بيعمل proteinuria و NS (albumin)، فالـ dipstick كان هيطلع موجب."
          - "الـ HCDD صورته نزول بطيء مع proteinuria، مش AKI فجأة."
          - "مفيش lupus في القصة."
      - kind: try
        items: [neph.L14.178, neph.L14.179, neph.L14.181, neph.L14.182, neph.L14.185]
    recap:
      - "Dysproteinemic: clone بيطلّع monoclonal Ig أو light chains سامة؛ من proteinuria بسيطة لحد AKI و RPGN."
      - "MGUS: مفيش end-organ damage؛ MGRS: أذى للكلية من غير malignancy؛ البروتين ممكن يأذي بكمية قليلة."
      - "Myeloma ~11/100,000؛ 20-30% eGFR <30 وقت التشخيص؛ cast nephropathy أشهر سبب (>2/3)."
      - "FLC + Tamm-Horsfall ← casts ← obstruction و giant cells؛ H2O2 ← ASK1 و NF-κB."
      - "Proximal: cubilin-megalin endocytosis زيادة ← التهاب و TGF-β1 تليّف."
