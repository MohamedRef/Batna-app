    title: "مضاعفات الـ Crohn: خرم، تضييق، ونقص"
    hook: "ليه عيان شالوا له متر من الـ ileum بقى عنده براز دهني وحصوة كلى؟ الإجابة في الـ bile salts والـ oxalate."
    minutes: 8
    pages: [212, 212]
    topics: [cd-imaging, cd-complications]
    goals:
      - "تعرف ليه الـ capsule ممنوعة مع الـ stricture"
      - "تفهم حكاية الـ 50 و 100 cm ileum"
      - "تفهم الـ short gut والـ bacterial overgrowth والـ oxalate stones"
    status: unverified
    steps:
      - kind: aside
        tone: trap
        page: 212
        quote: "Capsule endoscopy can visualize the small intestine provided there was no stricture otherwise retention of the capsule can occur and require surgical exploration."
        text: |
          فخ: عيان Crohn عنده أعراض obstruction (ألم، انتفاخ، ترجيع) وحد اقترح **capsule endoscopy**؟

          لأ. الـ stricture هيحبس الكبسولة والعيان هيروح العمليات علشان يطلّعها. استبعد الـ stricture الأول.
      - kind: explain
        remind: [git.L06.064]
        page: 212
        title: "المضاعفات: خرم، تضييق، ونقص"
        quote: "Deficiencies in iron, folate, vitamin B12, and fat-soluble vitamins (A, D, E, and K) are common, with resulting complications including anemia and osteoporosis. Because Crohn disease has a predilection for the ileum, bile salt reabsorption is frequently compromised. Resection of 50–100 cm of ileum typically causes bile salts to spill into the colon, resulting in a bile salt– induced diarrhea (responsive to bile acid sequestrants). If more than 100 cm of ileum is resected or diseased, reabsorption of bile salts may be so impaired that the total pool is depleted, causing fat maldigestion and steatorrhea."
        text: |
          - من الـ **penetrating و stenosing**: perforation، abscess، fistulae، obstruction.
          - نقص **iron، folate، B12** و الـ fat-soluble vitamins **A, D, E, K** ← anemia و osteoporosis.
          - **short gut syndrome** بعد resection كبير ← protein-calorie deficiency واعتماد على ==parenteral nutrition==.
          - **small bowel bacterial overgrowth**، خصوصًا مع stricture أو بعد شيل الـ **ileocecal valve**.

          التفسير المقبول (مش في الكتاب): ليه الـ osteoporosis؟ لأن نقص الـ vitamin D والكالسيوم من الـ malabsorption بيضعّف العضم، ومعاه الكورتيزون اللي المرضى بياخدوه كتير.
      - kind: figure
        page: 212
        quote: "Deficiencies in iron, folate, vitamin B12, and fat-soluble vitamins (A, D, E, and K) are common, with resulting complications including anemia and osteoporosis. Because Crohn disease has a predilection for the ileum, bile salt reabsorption is frequently compromised. Resection of 50–100 cm of ileum typically causes bile salts to spill into the colon, resulting in a bile salt– induced diarrhea (responsive to bile acid sequestrants). If more than 100 cm of ileum is resected or diseased, reabsorption of bile salts may be so impaired that the total pool is depleted, causing fat maldigestion and steatorrhea."
