  - id: rheum.L14.lesson5
    title: "مين بيجيله osteoporosis وليه؟"
    hook: "ست بعد سن اليأس، راجل كبير، وشاب على cortisone: تلات طرق مختلفة لنفس العضم الضعيف."
    minutes: 7
    pages: [222, 223]
    topics: [types, risk]
    goals:
      - "تفرّق type I من type II وتعرف الـ secondary causes وليه"
      - "تفرّق الـ risk factors اللي تتغير من اللي ما تتغيرش"
    status: unverified
    steps:
      - kind: aside
        tone: analogy
        page: 222
        quote: "Primary Osteoporosis\n  Type I (Postmenopausal): Estrogen deficiency leads to increased osteoclast activity.\n  Type II (Senile): Age-related decline in osteoblast function."
        text: "العضم بنك: الـ osteoclast بيسحب والـ osteoblast بيودّع. في **type I** (بعد سن اليأس) الـ estrogen راح فالسحّاب اتجنن وبقى يسحب كتير. في **type II** (senile) المودِع كبر وتعب وبقى يودّع قليل. الاتنين النتيجة واحدة: الرصيد بيقل."
      - kind: figure
        page: 222
        quote: "Primary Osteoporosis\n  Type I (Postmenopausal): Estrogen deficiency leads to increased osteoclast activity.\n  Type II (Senile): Age-related decline in osteoblast function."
        title: "الهد والبنا: إيه اللي اختل؟"
        alt: "Three pairs of bars. Normal: resorption by osteoclasts and formation by osteoblasts are equal, bone is balanced. Type I postmenopausal: estrogen falls, the resorbing bar is much longer than formation, so bone is lost. Type II senile: age weakens osteoblasts, the formation bar is shorter than resorption, so bone is lost."
        caption: "نفس تشبيه البنك في أرقام. في كل صف الشريط الأحمر هو الهد (osteoclast) والأخضر هو البنا (osteoblast). فوق الطبيعي: الاتنين قد بعض. في النص ==type I== (بعد سن اليأس): الـ estrogen راح فالأحمر **طوّل**، والأخضر زي ما هو. تحت ==type II== (senile): الأحمر زي ما هو بس الأخضر **قصّر** لأن الـ osteoblast كبر. الطريقين مختلفين والنتيجة واحدة: الهد أكتر من البنا والعضم بيخسر."
        svg: |
          <svg viewBox="0 0 330 262" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="8" width="16" height="10" class="fg-dot-bad"/>
            <text x="30" y="18" class="t-sm">Resorbs (osteoclast)</text>
            <rect x="168" y="8" width="16" height="10" class="fg-dot-good"/>
            <text x="190" y="18" class="t-sm">Forms (osteoblast)</text>
            <text x="8" y="48" class="t-sm t-b">Normal</text>
            <rect x="8" y="56" width="150" height="14" class="fg-dot-bad"/>
            <rect x="8" y="74" width="150" height="14" class="fg-dot-good"/>
            <text x="168" y="78" class="t-sm t-good t-b">balanced</text>
            <text x="8" y="118" class="t-sm t-b">Type I: estrogen ↓ → osteoclasts ↑</text>
            <rect x="8" y="126" width="236" height="14" class="fg-dot-bad"/>
            <rect x="8" y="144" width="150" height="14" class="fg-dot-good"/>
            <text x="168" y="156" class="t-sm t-bad t-b">net loss</text>
            <text x="8" y="188" class="t-sm t-b">Type II: age → osteoblasts ↓</text>
            <rect x="8" y="196" width="150" height="14" class="fg-dot-bad"/>
            <rect x="8" y="214" width="84" height="14" class="fg-dot-good"/>
            <text x="168" y="226" class="t-sm t-bad t-b">net loss</text>
            <text x="8" y="252" class="t-sm t-mut">Same end: bone mass falls.</text>
          </svg>
      - kind: check
        page: 222
        quote: "Primary Osteoporosis\n  Type I (Postmenopausal): Estrogen deficiency leads to increased osteoclast activity.\n  Type II (Senile): Age-related decline in osteoblast function."
        question: "Senile (type II) osteoporosis is mainly due to:"
        options: ["Age-related decline in osteoblast function", "Estrogen deficiency raising osteoclast activity", "Glucocorticoids", "Hyperthyroidism"]
        answer: 0
        why:
          - "صح: المودِع (osteoblast) تعب."
          - "ده type I (postmenopausal)."
          - "ده secondary cause."
          - "ده secondary cause."
      - kind: explain
        page: 222
        quote: "Caused by:\n  Endocrine disorders (e.g., hyperthyroidism, Cushing's).\n  Medications (e.g., glucocorticoids, heparin, anticonvulsants).\n  Malabsorption syndromes.\n  Chronic illnesses (e.g., RA, CKD)."
        title: "الـ Secondary osteoporosis"
        text: |
          - **Endocrine**: hyperthyroidism، Cushing's.
          - **أدوية**: ==glucocorticoids==، heparin، anticonvulsants.
          - **Malabsorption**.
          - **أمراض مزمنة**: Rheumatoid arthritis (RA)، chronic kidney disease (CKD).

          التفسير المقبول (مش في الكتاب): كل بند بيضرب واحد من الاتنين: يا بيزوّد الهد (hyperthyroidism، الـ steroids، الالتهاب في الـ RA)، يا بيقلل الطوب الداخل (الـ malabsorption بتضيّع الكالسيوم والـ vitamin D). عشان كده تدوّر عليهم قبل ما تقول primary.
      - kind: reveal
        page: 222
        quote: "Caused by:\n  Endocrine disorders (e.g., hyperthyroidism, Cushing's).\n  Medications (e.g., glucocorticoids, heparin, anticonvulsants).\n  Malabsorption syndromes.\n  Chronic illnesses (e.g., RA, CKD)."
        prompt: "إزاي كل سبب من دول بيضعّف العضم؟"
        answer: |
          الكتاب بيدّي الأسماء. التفسير المقبول (مش في الكتاب):
          - **Hyperthyroidism**: بيسرّع الـ remodeling كله، والهد بيسبق البنا
          - **Cushing's والـ ==glucocorticoids==**: بيوقفوا الـ osteoblast وبيقللوا امتصاص الكالسيوم
          - **Malabsorption**: الكالسيوم والـ vitamin D مش بيدخلوا
          - **RA**: الـ cytokines (TNF، IL-6) بتشغّل الـ osteoclast، وقلة الحركة، والـ steroids
          - **CKD**: الكلى مش بتفعّل الـ vitamin D، والـ PTH بيعلى
      - kind: sort
        page: 223
        quote: "Modifiable\n  Low body weight.\n  Smoking.\n  Excess alcohol intake.\n  Sedentary lifestyle.\n  Poor calcium/vitamin D intake."
        prompt: "الـ risk factor ده ينفع نغيّره ولا لأ؟"
        bins: ["Modifiable", "Non-modifiable"]
        cards:
          - { text: "Smoking", bin: 0 }
          - { text: "Low body weight", bin: 0 }
          - { text: "Excess alcohol", bin: 0 }
          - { text: "Sedentary lifestyle", bin: 0 }
          - { text: "Poor calcium or vitamin D", bin: 0 }
          - { text: "Advanced age", bin: 1 }
          - { text: "Female sex", bin: 1 }
          - { text: "Caucasian or Asian ethnicity", bin: 1 }
          - { text: "Family history of hip fracture", bin: 1 }
        why: "اللي في إيد المريض يغيّره: السجاير، الوزن، الكحول، الحركة، والكالسيوم والـ vitamin D. السن والجنس والعرق والعيلة ثابتين."
      - kind: explain
        remind: [rheum.L14.013]
        page: 223
        title: "ليه الـ risk factors دي؟"
        quote: "Modifiable\n  Low body weight.\n  Smoking.\n  Excess alcohol intake.\n  Sedentary lifestyle.\n  Poor calcium/vitamin D intake."
        text: |
          **Non-modifiable** في الكتاب: السن، الأنثى، Caucasian أو Asian، و family history لـ osteoporosis أو hip fracture.
          **Modifiable**: ==low body weight==، smoking، excess alcohol، sedentary lifestyle، وقلة الكالسيوم والـ vitamin D.

          ليه؟ التفسير المقبول (مش في الكتاب):
          - **الست**: عضمها أصغر من الأول، وبتخسر الـ estrogen فجأة في سن اليأس
          - **Low body weight**: حمل أقل على العضم، ودهن أقل بيعمل estrogen بعد سن اليأس
          - **Sedentary**: من غير mechanical stress العضم ما بيتبنيش (ص 222)
          - **Smoking و alcohol**: بيأذوا الـ osteoblast مباشرة
      - kind: check
        page: 222
        quote: "Primary Osteoporosis\n  Type I (Postmenopausal): Estrogen deficiency leads to increased osteoclast activity."
        question: "Type I primary osteoporosis is mainly due to:"
        options:
          - "Estrogen deficiency increasing osteoclast activity"
          - "Age-related decline in osteoblast function"
          - "Long-term glucocorticoids"
          - "Chronic kidney disease"
        answer: 0
        why:
          - "صح: type I = postmenopausal، الـ estrogen راح فالـ osteoclast نشط."
          - "ده type II (senile)."
          - "ده secondary، مش primary."
          - "ده secondary، مش primary."
      - kind: check
        page: 222
        quote: "Medications (e.g., glucocorticoids, heparin, anticonvulsants)."
        question: "Which of the following is NOT a risk factor for secondary osteoporosis?"
        options:
          - "Beta blockers"
          - "Rheumatoid arthritis"
          - "Long-term corticosteroids"
          - "Type 1 diabetes"
        answer: 0
        why:
          - "صح: الـ beta blockers مش في قايمة الكتاب، وشرح السؤال في الكتاب بيقول مش مرتبطة بـ bone loss."
          - "الكتاب: chronic illnesses زي RA."
          - "الكتاب: glucocorticoids أول دوا في القايمة."
          - "الكتاب في شرح السؤال بيعتبر الأمراض المزمنة والـ autoimmune مرتبطة بفقد العضم."
      - kind: try
        items: [rheum.L14.009, rheum.L14.010, rheum.L14.012, rheum.L14.013, rheum.L14.053]
    recap:
      - "Type I postmenopausal: estrogen ↓ ← osteoclast ↑. Type II senile: osteoblast ↓ مع السن."
      - "Secondary: endocrine (hyperthyroid، Cushing's)، أدوية (steroids، heparin، anticonvulsants)، malabsorption، أمراض مزمنة (RA، CKD)."
      - "Non-modifiable: سن، أنثى، Caucasian/Asian، family history. Modifiable: وزن قليل، سجاير، كحول، قعدة، قلة كالسيوم و vitamin D."
