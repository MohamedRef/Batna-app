            <rect x="10" y="96" width="310" height="128" rx="10" class="fg-box"/>
            <text x="22" y="120" class="t-sm">Creatinine up 50% or over 120% ULN</text>
            <text x="22" y="144" class="t-sm">Proteinuria over 2+</text>
            <text x="22" y="168" class="t-sm">Haematuria over 2+ or over 10 RBC/HPF</text>
            <text x="22" y="192" class="t-sm">Platelets under 100</text>
            <text x="22" y="214" class="t-sm">Haemolysis (schistocytes)</text>
            <path d="M165 224 V246" class="fg-arrow" marker-end="url(#L21r)"/>
            <rect x="10" y="248" width="310" height="72" rx="10" class="fg-acc"/>
            <text x="165" y="272" text-anchor="middle" class="t-sm">Headache, encephalopathy,</text>
            <text x="165" y="292" text-anchor="middle" class="t-sm">seizures, LV failure</text>
            <text x="165" y="312" text-anchor="middle" class="t-sm t-bad">BP under 140/90: worse prognosis</text>
          </svg>
      - kind: reveal
        page: 348
        quote: "Can cause headache, encephalopathy, seizures, LV failure."
        prompt: "ليه الـ renal crisis ممكن يجيب headache و seizures و heart failure؟"
        answer: |
          لأن قلبه ==abruptly developing severe hypertension==: الضغط بيطلع **فجأة**. المخ والقلب مش لاحقين يتأقلموا:
          - **المخ:** headache، **encephalopathy**، **seizures**.
          - **القلب:** الـ left ventricle بيضخ ضد ضغط عالي فجأة ← **LV failure**.

          والـ thrombocytopenia والـ hemolysis (schistocytes) في التعريف علشان الأوعية الصغيرة المتأذية بتقطّع كرات الدم وبتستهلك الصفايح (التفسير المقبول، مش في الكتاب). يعني دي **طوارئ**، مش مجرد «ضغط عالي».
      - kind: table
        page: 348
        quote: "90% with blood pressure > 150/90.\nCan occur also with lower blood pressures < 140/90 and this confers worse prognosis."
        title: "أرقام الـ renal crisis"
        columns: [Fact, Book]
        rows:
          - ["Patients with BP > 150/90", "90%"]
          - ["Crisis with BP < 140/90", "Worse prognosis"]
          - ["Prednisone dose that raises risk", "> 15 mg"]
