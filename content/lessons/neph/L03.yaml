      - kind: figure
        page: 77
        quote: "Figure 6: Volume Management in Patients with Acute Heart Failure and CRS\nEscalating doses of loop diuretics are the first-line of therapy for volume removal, with combination diuretic therapy used for patients who do not respond adequately to loop diuretics.\nA target urine output of 3 to 5 l/day has been used in studies of stepped- diuretic therapy."
        title: "شكل 6 في الكتاب: سلّم الـ volume management"
        image: { file: neph/L03-volume-management.webp, book: true }
        alt: "Book Figure 6, a stepped flowchart. Top blue box: initiate intravenous loop diuretic based on prior dose, bolus dosing for most patients, continuous infusion if hemodynamic instability. Each step has an 'effective' green box on the right (continue the current regimen) and an 'ineffective' box below: yellow, increase the loop diuretic dose or consider infusion using a stepped protocol; yellow, add a second diuretic (thiazide first-line, spironolactone or tolvaptan second-line); orange, hemodynamic assessment and vasoactive therapy if inadequate cardiac output; red, consider hypertonic saline and initiate RRT if poor response (SCUF if no/mild AKI, CRRT if severe AKI). Curved arrows on the left: increase loop diuretic, increase second diuretic, titrate vasoactive therapy as needed."
        caption: |
          سلّم بينزل من فوق لتحت، والألوان بتسخن كل درجة:

          1. **الأزرق فوق**: ابدأ **IV loop diuretic** على حسب جرعته القديمة: **bolus** لمعظم المرضى، و**infusion** لو مش مستقر.
          2. **أول درجة (أصفر)**: لو **ineffective** ← **زوّد جرعة الـ loop** أو infusion بالـ stepped protocol.
          3. **التانية (أصفر)**: **Add second diuretic**: **thiazide** الأول، و spironolactone أو tolvaptan بعده.
          4. **التالتة (برتقاني)**: **Hemodynamic assessment** و **vasoactive therapy** لو الـ cardiac output قليل.
          5. **الأخيرة (أحمر)**: **hypertonic saline**، و==RRT لو مافيش استجابة==: **slow continuous ultrafiltration (SCUF)** لو الـ AKI بسيط، و **continuous renal replacement therapy (CRRT)** لو شديد.

          - **يمين كل درجة (أخضر)**: **Effective** ← ==كمّل على نفس اللي شغال==.
          - **الأسهم الملفوفة شمال**: زوّد الجرعة جوه نفس الدرجة قبل ما تنزل.

          يعني الـ ultrafiltration ==آخر درجة== مش أول حل.
      - kind: explain
        page: 77
        quote: "Escalating doses of loop diuretics are the first-line of therapy for volume"
        title: "ليه السلّم ماشي بالترتيب ده؟"
        text: |
          الكتاب (Figure 6): **loop diuretic IV** على حسب الجرعة القديمة (bolus لأغلب العيانين، **continuous infusion** لو فيه hemodynamic instability) ← **زوّد** الـ loop ← ضيف **second diuretic** ← vasoactive therapy ← **extracorporeal** لو العلاج فشل. والهدف **3–5 l/day** بول.

          التفسير المقبول (مش في الكتاب):

          - الـ loop diuretic **threshold drug**: تحت تركيز معيّن في الـ tubule مفيش أي تأثير، **فـ** لو الجرعة مش شغالة بنضاعفها مش بنكرّرها.
          - الـ **second diuretic** (thiazide زي metolazone) بيقفل الـ distal tubule اللي بيمص الصوديوم اللي الـ loop سابه، **يعني** بنقفل الباب التاني.
          - الـ **infusion** بيدّي تركيز ثابت من غير peak يوقّع الضغط، **عشان** كده بنختاره في العيان المش مستقر.
          - **IV** مش oral **لأن** الأمعاء نفسها بتبقى متورّمة في الـ congestion والامتصاص بيقل.
