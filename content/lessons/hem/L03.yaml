        quote: "Splenic sequestration crisis: Sudden and massive accumulation of blood in spleen causes rapid increase in size of spleen over a period of several hours, progressive anaemia, and circulatory failure."
        text: |
          الـ **haematologic crisis** = الأنيميا بتزيد فجأة. وفيه تلات طرق:
          - **Aplastic**: الـ **parvovirus** بيصيب الـ erythroblasts بالذات، فالإنتاج يقف **7–10 أيام**. ليه ده خطر هنا بالذات؟ التفسير المقبول (مش في الكتاب): الكرة في الـ sickle بتعيش أيام قليلة بدل 120 يوم، فلو الإنتاج وقف أسبوع، الـ Hb ينهار. عشان كده ==النقل ضروري== في الفترة دي.
          - **Haemolytic**: التكسير بيزيد، فالـ Hb ينزل، والـ **icterus** والـ **reticulocytes** يعلوا لأن النخاع لسه شغال.
          - **Splenic sequestration**: الدم بيتحبس فجأة في الطحال، فيكبر **في ساعات**، والأنيميا تزيد، ويحصل ==circulatory failure== لأن الدم اتشال من الدورة.

          يعني الـ retics هي المفتاح: **واطية** = aplastic، **عالية** = haemolytic.
