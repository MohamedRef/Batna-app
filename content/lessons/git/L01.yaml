  - id: git.L01.lesson7
    title: "الـ pH test والـ EoE: نثبت الـ GERD إزاي؟"
    hook: "تلاتة مرضى نفس الشكوى ونفس الـ PPI، والـ pH test طلّع تلات إجابات مختلفة. وواحد رابع المنظار عنده شكله عادي وطلع EoE."
    minutes: 8
    pages: [5, 7]
    topics: [refractory-gerd, eoe]
    goals:
      - "تعرف امتى تعمل الـ pH-impedance وانت on PPI وامتى off"
      - "تقرا الـ acid exposure time (AET) والـ symptom-reflux association (SRA) وتطلّع التشخيص"
      - "تعرف قاعدة الـ biopsy بتاعة الـ EoE ورقم الـ eosinophils"
    status: unverified
    steps:
      - kind: explain
        page: 5
        quote: "Not infrequently, pH testing in these scenarios is negative for\nGERD and helps to guide the evaluation and management away\nfrom GERD."
        title: "التاني في الـ objective tests: الـ impedance pH"
        text: |
          الكتاب بيقسم المرضى نصّين:

          - **عمره ما اتثبتله GERD objective**: يعمل ==impedance pH OFF PPI== (wireless أو catheter-based)، علشان يشوف الـ **baseline GERD**.
          - **اتثبتله قبل كده pathologic GERD**: يعمل الـ test ==ON PPI==.

          ليه الفرق ده؟ لأن السؤال مختلف. اللي ماتثبتلوش لسه بنسأل «هو أصلًا عنده GERD؟»، فلازم نشيل الـ PPI علشان نشوف الحمض على طبيعته. واللي اتثبتله خلاص، السؤال «الـ PPI مسيطر ولا لأ؟»، فنقيس وهو واخده.

          ولما الـ test يطلع **negative** وهو off PPI، ده مكسب: بيوجّهك **بعيد عن الـ GERD** بدل ما تفضل تزوّد في الجرعة.
      - kind: table
        page: 5
        quote: "Diagnostic evaluation begins with esophageal pH-impedance monitoring on PPI therapy to assess for PPI refractory acid exposure."
        title: "الـ pH test: on ولا off PPI؟"
        columns: ["الحالة", "الـ test", "ليه"]
        rows:
          - ["No previous objective GERD", "Impedance-pH OFF PPI", "Look for baseline GERD"]
          - ["Proven pathologic GERD (LA C/D, stricture, Barrett, abnormal pH)", "pH-impedance ON PPI", "Look for PPI-refractory acid exposure"]
        hide: [[0, 1], [1, 1]]
      - kind: aside
        tone: exam
        page: 5
        quote: "According to the GERD Consensus Group, esophageal acid exposure time greater than 6% on PPI is consistent with PPI refractory GERD."
        text: |
          الرقم اللي هيتسأل: **acid exposure time ==greater than 6%== on PPI** = PPI-refractory GERD (GERD Consensus Group).

          وخلي بالك: كتير الـ pH test off PPI بيطلع **negative**، وده مفيد مش فشل، لأنه بيبعدك عن الـ GERD وتدوّر على سبب تاني.
      - kind: case
        page: 5
        quote: "According to the GERD Consensus Group, esophageal acid exposure time greater than 6% on PPI is consistent with PPI refractory GERD."
        stem: "A 45-year-old woman had LA grade C esophagitis two years ago. She still has heartburn on double-dose PPI. Endoscopy now is normal."
        steps:
          - question: "Which pH test fits her?"
            options: ["pH-impedance ON PPI", "pH monitoring OFF PPI", "No pH test; she has proven GERD", "Gastric pH probe"]
            answer: 0
            why: "عندها **proven** GERD (LA grade C)، فالسؤال: الـ PPI مسيطر؟ يبقى الـ test ==ON PPI==."
          - reveal: "Acid exposure time on PPI: 8%."
            question: "Interpretation?"
            options: ["PPI-refractory GERD", "Reflux hypersensitivity", "Functional heartburn", "Normal study"]
            answer: 0
            why: "أكتر من **6%** on PPI = **PPI-refractory GERD** (GERD Consensus Group)."
      - kind: figure
        page: 6
        title: "الطريقين: unproven ولا proven GERD"
        image: { file: git/L01-gerd-pathways.webp, book: true }
        alt: "Book flow chart: troublesome GERD symptoms despite PPI with normal endoscopy splits into unproven GERD (pH monitoring off PPI) and proven GERD (pH-impedance on PPI). Each ends in three boxes: AET normal with negative SRA, AET normal with positive SRA, and AET elevated."
        caption: |
          الشمال **unproven** (off PPI)، واليمين **proven** (on PPI). وكل ناحية فيها نفس التلات خانات: **AET normal + SRA negative**، **AET normal + SRA positive**، و **AET elevated**.
      - kind: explain
        page: 6
        quote: "Troublesome GERD symptoms despite PPI therapy (Normal endoscopy)\nUnproven GERD: pH monitoring (+/- impedance) OFF PPI\n  AET normal, Negative SRA: Functional. Rule out alternate esophageal disorder\n  AET normal, Positive SRA: Reflux hypersensitivity\n  AET elevated: GERD (nonerosive)\nProven GERD: pH-impedance monitoring ON PPI\n  AET normal, Negative SRA: Functional with GERD overlap\n  AET normal, Positive SRA: Reflux hypersensitivity with GERD overlap\n  AET elevated: PPI-refractory GERD"
        title: "إزاي تقرا التلات خانات"
        text: |
          رقمين بيحددوا كل حاجة:
          - **AET** (acid exposure time): الـ esophagus قعد في الحمض أد إيه.
          - **SRA** (symptom-reflux association): الأعراض بتيجي مع نوبات الـ reflux ولا لأ.

          في الـ **unproven** (off PPI):
          - AET normal + SRA negative ← ==Functional==، ودوّر على alternate esophageal disorder.
          - AET normal + SRA positive ← **Reflux hypersensitivity**.
          - AET elevated ← **GERD (nonerosive)**.

          في الـ **proven** (on PPI) نفس المنطق، بس الـ GERD موجود أصلًا: **functional with GERD overlap**، **reflux hypersensitivity with GERD overlap**، أو ==PPI-refractory GERD== لو الـ AET لسه عالي.

          ليه الـ SRA بيفرق؟ لأن الحمض لو طبيعي والأعراض **ماشية مع** الـ reflux، يبقى المشكلة في الإحساس مش في كمية الحمض.
      - kind: match
        page: 6
        quote: "Troublesome GERD symptoms despite PPI therapy (Normal endoscopy)\nUnproven GERD: pH monitoring (+/- impedance) OFF PPI\n  AET normal, Negative SRA: Functional. Rule out alternate esophageal disorder\n  AET normal, Positive SRA: Reflux hypersensitivity\n  AET elevated: GERD (nonerosive)\nProven GERD: pH-impedance monitoring ON PPI\n  AET normal, Negative SRA: Functional with GERD overlap\n  AET normal, Positive SRA: Reflux hypersensitivity with GERD overlap\n  AET elevated: PPI-refractory GERD"
        prompt: "الـ pH test طلع كده. التشخيص إيه؟"
        pairs:
          - ["Off PPI: AET normal, SRA negative", "Functional; rule out other esophageal disorder"]
          - ["Off PPI: AET normal, SRA positive", "Reflux hypersensitivity"]
          - ["Off PPI: AET elevated", "Nonerosive GERD"]
          - ["On PPI (proven GERD): AET elevated", "PPI-refractory GERD"]
        why: "الـ AET بيقولك الحمض كتير ولا لأ، والـ SRA بيقولك الأعراض ماشية معاه ولا لأ. الـ AET العالي وهو **on PPI** = الـ PPI مش مكفّي = refractory."
      - kind: figure
        page: 6
        title: "منظار المريض: GERD ولا EoE؟"
        image: { file: git/L01-case-endoscopy.webp, book: true }
        alt: "Book endoscopic photo of the patient's esophagus: reddish mucosa with linear streaks running along the lumen."
        caption: |
          الكتاب كتب تحت الصورة: **GERD LA grade D** أو **eosinophilic esophagitis**. الفرق **بالـ biopsy**، حتى لو المنظار طبيعي.
      - kind: explain
        page: 7
        quote: "Eosinophilic esophagitis is diagnosed with\nintraepithelial eosinophils ≥15 in ≥2 hpfs\nor ≥25 in any single hpf."
        title: "قاعدة الـ biopsy في الـ EoE"
        text: |
          من الـ **Guidelines on the Use of Endoscopy in EoE** (Gastrointestinal Endoscopy 2022):

          - خد **at least six biopsies** من الـ **distal** والـ **mid/proximal** esophagus.
          - خدها **regardless of the endoscopic appearance** لو شاكك.
          - التشخيص: ==≥15 eosinophils== في **≥2 hpfs**، أو **≥25** في hpf واحد.

          ليه ست عينات ومن مستويين؟ التفسير المقبول (مش في الكتاب): الـ eosinophils بتتوزع **patchy**، فعينة أو اتنين ممكن يقعوا في حتة سليمة. وليه حتى لو المنظار عادي؟ لأن الـ EoE ممكن ما يعملش شكل واضح، والعين لوحدها بتفوّته.
      - kind: mnemonic
        page: 7
        quote: "For the endoscopic diagnosis of eosinophilic esophagitis (EoE), at least six biopsy samples taken from the distal and mid/proximal esophagus are recommended."
        word: "EOE"
        parts:
          - { key: "E", text: "Eight minus two: at least 6 biopsies" }
          - { key: "O", text: "Over two levels: distal and mid/proximal" }
          - { key: "E", text: "Even if normal-looking: ≥15 in ≥2 hpfs or ≥25 in one" }
        hook: "اسم المرض نفسه بيفكّرك بالقاعدة: **ستة، مستويين، ولو شكله سليم**."
      - kind: check
        page: 7
        quote: "Eosinophilic esophagitis is diagnosed with\nintraepithelial eosinophils ≥15 in ≥2 hpfs\nor ≥25 in any single hpf."
        question: "Biopsies show 18 eosinophils/hpf in one field and 9 in every other field. Does this meet the lecture's EoE criterion?"
        options:
          - "No: 15 or more is needed in at least 2 hpfs, or 25 in one"
          - "Yes: one field over 15 is enough"
          - "Yes: any eosinophils in the esophagus are diagnostic"
          - "No: EoE needs over 50 per hpf"
        answer: 0
        why:
          - "صح: الـ 18 في field واحد بس، وأقل من 25. القاعدة ≥15 في **≥2 hpfs** أو ≥25 في واحد."
          - "الـ field الواحد لازم يوصل **25**."
          - "لازم توصل للرقم، مش أي eosinophil."
          - "الرقم ده مش في الكتاب."
      - kind: try
        items: [git.L01.016, git.L01.018, git.L01.022, git.L01.024]
    recap:
      - "Unproven GERD: pH test off PPI. Proven: pH-impedance on PPI."
      - "AET بيقيس الحمض، والـ SRA بيربط الأعراض بالـ reflux."
      - "AET طبيعي + SRA positive = hypersensitivity. AET عالي on PPI (أكتر من 6%) = refractory."
      - "EoE: ست biopsies من مستويين حتى لو المنظار سليم؛ ≥15 في ≥2 hpfs أو ≥25 في واحد."
    practice: [git.L01.016, git.L01.017, git.L01.018, git.L01.019, git.L01.020, git.L01.021, git.L01.022, git.L01.023, git.L01.024, git.L01.164, git.L01.166, git.L01.167, git.L01.195]
