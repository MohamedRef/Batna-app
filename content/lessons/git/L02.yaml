        page: 74
        quote: "There are four primary AI types:  Reactive.  Limited memory.  Theory of mind.  Self-aware."
        title: "وأخيرًا: الـ AI"
        text: |
          الـ **AI**: أنظمة بتعمل حاجات محتاجة ذكاء بشري (رؤية، كلام، قرار، ترجمة).

          أنواعه الأربعة: **reactive**، **limited memory**، **theory of mind**، **self-aware**.

          في الأجهزة الطبية: **data management**، **remote surgery**، مساعدة في التشخيص والإجراء، **clinical trials**، وكفاءة التصنيع.

          والـ digital chromoendoscopy الأكتر استخدامًا: **Flexible spectral imaging color enhancement (FICE)** و **narrow-band imaging (NBI)** و **I-Scan**، ومع الـ **confocal laser endomicroscopy (CLE)** زادت قيمة المنظار في التشخيص.

          التفسير المقبول (مش في الكتاب) للأنواع: الـ **reactive** بيرد على اللي قدامه بس من غير ذاكرة، الـ **limited memory** بيتعلم من داتا قديمة (زي أنظمة الصور)، الـ **theory of mind** يفهم مشاعر ونوايا البشر، والـ **self-aware** يبقى عنده وعي بنفسه.
      - kind: explain
        page: 74
        quote: "Recent technological advances in imaging enhancement have enabled detection of GI lesions without the need for dye injection, using:"
        title: "الخلاصة: نشوف من غير صبغة"
        text: |
          آخر صفحة في الكتاب بتلم الصورة: التطور في الـ **imaging enhancement** خلّى اكتشاف الـ GI lesions ممكن **من غير dye injection**، بالـ ==digital chromoendoscopy== (FICE، NBI، I-Scan أشهرهم)، ومع **magnification** و **high-definition** optics، والـ **confocal laser endomicroscopy** زوّدت الـ **in vivo diagnosis**.

          التفسير المقبول (مش في الكتاب): ده بيربط المحاضرة كلها: نشوف أحسن (NBI، FICE، CLE) ← نلاقي بدري ← نشيل بالمنظار (EMR، ESD) أو نحرق (APC، RF) بدل الجراحة.
      - kind: explain
        page: 74
        quote: "There are many good uses for AI in the medical device industry, such as data management, remote surgery, diagnostic and procedural assisting, clinical trials, and more."
        title: "الـ AI في المنظار: ليه دلوقتي؟"
        text: |
          الكتاب بيعرّف الـ AI إنه أنظمة بتعمل مهام محتاجة **human intelligence**: **visual perception**، **speech recognition**، **decision-making**، و**translation**. وفي الأجهزة الطبية: **data management**، **remote surgery**، **diagnostic and procedural assisting**، **clinical trials**، وكمان **manufacturing efficiency**.

          التفسير المقبول (مش في الكتاب) للربط بالمحاضرة: أول بند في التعريف هو **visual perception**، والمنظار كله صور. يعني كل اللي اتعلمته (NBI، FICE، chromo) بيطلّع صور أوضح، والـ AI يقدر يساعد يلاحظ الـ lesion الصغيرة اللي العين التعبانة في آخر اليوم ممكن تعدّيها. ومن الأنواع الأربعة، اللي شغالين النهارده هم **reactive** و **limited memory**؛ الـ theory of mind والـ self-aware لسه أفكار.
