            <path d="M170 162v14" class="fg-arrow" marker-end="url(#L07a)"/>
            <rect x="60" y="178" width="220" height="32" rx="6" class="fg-box"/>
            <text x="170" y="199" text-anchor="middle" class="t-sm">Transcription: 3.5 kb pgRNA</text>
            <path d="M170 210v20" class="fg-arrow" marker-end="url(#L07a)"/>
            <rect x="60" y="232" width="220" height="32" rx="6" class="fg-box"/>
