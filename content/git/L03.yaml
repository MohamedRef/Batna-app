    kind: mcq
    topic: ibs
    stem: >-
      A 24-year-old woman has lower abdominal cramps 2 days a week for 5 months, eased after defecation, with
      hard pellety stools on most bad days and loose stools under 25% of the time. Mucus, no blood, weight stable.
      Symptoms began 7 months ago. Which subtype is this?
    options:
      - IBS-C
      - IBS-D
      - IBS-M
      - IBS-U
      - Functional constipation
    answer: 0
    why:
      - "Correct: pain at least 1 day/week related to defecation, with Bristol 1-2 over 25% and 6-7 under 25%."
      - IBS-D needs loose stools over 25% of abnormal movements.
      - IBS-M needs both hard and loose stools over 25%.
      - IBS-U means no stool type passes 25%.
      - Functional constipation requires insufficient criteria for irritable bowel syndrome (IBS); she has pain that meets IBS.
    src: { page: 126, quote: "IBS subtypes:\nIBS Subtypes are based on >25% of abnormal BM (types 1,2 or 6,7)\n  IBS-C Types 1,2 not 6,7 >25%\n  IBS-D Types 6,7 not 1,2 >25%\n  IBS-M Types 1,2 and 6,7 >25%\n  IBS-U No Type >25%" }
    status: unverified
  - id: git.L03.210
    kind: mcq
    topic: ibs
    stem: >-
      A 56-year-old man has had altered bowel habit with abdominal pain for 4 months. His father had colon cancer.
      He fulfils Rome IV criteria. What is the next step?
    options:
      - Further evaluation including colonoscopy
      - Confirm IBS and start an antispasmodic
      - Celiac serology alone, then reassure
      - Low-FODMAP diet trial
      - Rifaximin course
    answer: 0
    why:
      - "Correct: onset after 50 and a family history of colon cancer are warning signs; he needs blood tests, stool tests and colonoscopy."
      - Irritable bowel syndrome (IBS) cannot be confirmed with warning signs present.
      - Celiac serology alone is the path only when there are no warning signs.
      - Diet trials come after organic disease is excluded.
      - Rifaximin is a second-line IBS-D drug, not a work-up step.
    src: { page: 121, quote: "Patient with recurrent abdominal pain or discomfort and altered bowel habit\nRome criteria:\n  No: Appropriate symptom-guided evaluation\n  Yes: Warning signs?\nWarning signs:\n  Rectal bleeding\n  Anemia\n  Weight loss\n  Fever\n  Family history of colon cancer\n  Onset of first symptom after 50 yr of age\n  Major change in symptoms\nNo warning signs: Serologic testing for celiac sprue\n  Negative: No further evaluation: IBS diagnosis confirmed\n  Positive: Full evaluation for celiac sprue; Negative: IBS diagnosis confirmed\nWarning signs present: Further evaluation needed\n  Complete cell count\n  Blood chemical studies\n  Measurement of thyrotropin levels\n  Stool testing for occult blood and ova and parasites\n  Colonoscopy and other symptom-guided diagnostic testing; Negative: IBS diagnosis confirmed" }
    status: unverified
  - id: git.L03.211
    kind: mcq
    topic: ibs
    stem: >-
      Which feature in a patient with suspected IBS most strongly argues for IBD instead?
    options:
      - Nocturnal bloody stools with tenesmus
      - Mucus in the stool
      - Pain relieved by defecation
      - Bloating that worsens through the day
      - Hard pellety stools
    answer: 0
    why:
      - "Correct: bloody stools and tenesmus are + in inflammatory bowel disease (IBD) and - in irritable bowel syndrome (IBS); rectal bleeding does not occur in IBS."
      - Mucus is common in IBS.
      - Pain related to defecation is a Rome IV IBS criterion.
      - Bloating worsening through the day is typical of IBS.
      - Pellety stools are typical of IBS-C.
    src: { page: 121, quote: "IBD - Differential Diagnosis\n| Clinical features | IBD | IBS |\n|---|---|---|\n| Anemia, ↑platelets, ↑sed. rate, ↓albumin | + | - |\n| Weight loss, fever | + | - |\n| Perianal disease | + | - |\n| Bloody stools, tenesmus | + | - |\n| Fecal WBC, occult blood | + | - |" }
    status: unverified
  - id: git.L03.212
    kind: mcq
    topic: ibs
    stem: >-
      A 30-year-old with IBS-C and marked pain and bloating has not improved on ispaghula, PEG and peppermint oil.
      What is the second-line regimen in the lecture?
    options:
      - An SSRI such as citalopram plus linaclotide, with CBT or hypnotherapy as adjunct
      - Loperamide plus colestyramine
      - Alosetron
      - A tricyclic antidepressant such as amitriptyline
      - Rifaximin
    answer: 0
    why:
      - "Correct: the IBS-C with pain/bloating second line is selective serotonin reuptake inhibitor (SSRI) (citalopram/paroxetine) plus linaclotide."
      - Antidiarrheals worsen constipation.
      - Alosetron is for IBS-D and constipates.
      - TCAs constipate; the lecture places them in IBS-D and mixed irritable bowel syndrome (IBS).
      - Rifaximin is an IBS-D option.
    src: { page: 123, quote: "Constipation-predominant\n| | 1st | 2nd |\n|---|---|---|\n| Without pain or bloating | lifestyle and dietary modifications + Ispaghula/lactulose/polyethylene glycol/electrolytes | lifestyle and dietary modifications + lubiprostone or linaclotide |\n| With pain or bloating | lifestyle and dietary modifications + Ispaghula/lactulose/polyethylene glycol/electrolytes + antispasmodics Dicycloverine/hyoscyamine/peppermint oil | lifestyle and dietary modifications + selective serotonin-reuptake inhibitor (SSRI) Citalopram/paroxetine + linaclotide; adjunct cognitive behaviour therapy (CBT) or hypnotherapy |" }
    status: unverified
  - id: git.L03.213
    kind: mcq
    topic: ibs
    stem: >-
      A 26-year-old with IBS-D and pain has not improved on loperamide and antispasmodics. Which drug is the
      lecture's second-line choice?
    options:
      - Amitriptyline
      - Lubiprostone
      - Linaclotide
      - Lactulose
      - Citalopram plus linaclotide
    answer: 0
    why:
      - "Correct: for IBS-D with pain or bloating, second line is a tricyclic antidepressant (TCA) (desipramine, amitriptyline, doxepin)."
      - Lubiprostone is a secretagogue for IBS-C and worsens diarrhea.
      - Linaclotide is a secretagogue for IBS-C.
      - Lactulose is an osmotic laxative.
      - That combination is the IBS-C second line.
    src: { page: 124, quote: "Diarrhoea-predominant\n| | 1st | 2nd |\n|---|---|---|\n| Without pain or bloating | lifestyle and dietary modifications + antidiarrheals; 1st options: loperamide/colestyramine; 2nd options: alosetron/eluxadoline | |\n| With pain or bloating | lifestyle and dietary modifications; antidiarrheals 1st options: loperamide/colestyramine; 2nd options: alosetron/eluxadoline/rifaximin; antispasmodics Dicycloverine/hyoscyamine/peppermint oil | lifestyle and dietary modifications; tricyclic antidepressants Desipramine/amitriptyline/doxepin; adjunct cognitive behaviour therapy (CBT) or hypnotherapy |" }
    status: unverified
  # ---------------------------------------------------------------- bowel-other
  - id: git.L03.214
    kind: enumerate
    topic: bowel-other
    prompt: "State the Rome IV criteria for functional constipation (C2)."
    points:
      - "Two or more of, in more than 25% of defecations: straining; lumpy or hard stools (Bristol 1-2); incomplete evacuation; anorectal obstruction/blockage; manual maneuvers"
      - Fewer than three spontaneous bowel movements per week
      - Loose stools rarely present without laxatives
      - Insufficient criteria for IBS
    pass: 4
    hook: "الـ functional constipation في 4: اتنين أو أكتر في أكتر من 25% من المرات من «زقّ، ناشف (Bristol 1 أو 2)، مش مخلّص، مسدود، وبالإيد»، أقل من 3 spontaneous bowel movements في الأسبوع، loose stools نادرة من غير laxatives، ومش مكمّل criteria الـ IBS."
    src: { page: 127, quote: "C2. Functional constipation\nDiagnostic criteria*\n  1. Must include two or more of the following:**\n    a. Straining during more than 1/4 (25%) of defecations\n    b. Lumpy or hard stools (Bristol Stool Form Scale 1-2) more than 1/4 (25%) of defecations\n    c. Sensation of incomplete evacuation more than 1/4 (25%) of defecations\n    d. Sensation of anorectal obstruction/blockage more than 1/4 (25%) of defecations\n    e. Manual maneuvers to facilitate more than 1/4 (25%) of defecations (e.g., digital evacuation, support of the pelvic floor)\n    f. Fewer than three SBM per week\n  2. Loose stools are rarely present without the use of laxatives\n  3. Insufficient criteria for irritable bowel syndrome\n*Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis\n**For research studies, patients meeting criteria for opioid-induced constipation (OIC) should not be given a diagnosis of FC because it is difficult to distinguish between opioid side effects and other causes of constipation. However, clinicians recognize that these two conditions may overlap." }
    status: unverified
    tags: [high-yield]
