  - id: hem.L10.lesson2
    title: "عيان الـ PV: دماغ تقيلة، هرش في الدُش، ووش أحمر"
    hook: "عشر علامات بتحكي قصة دم تقيل، وتلات مراحل بتحكي عمر المرض."
    minutes: 10
    pages: [158, 160]
    topics: [pv-clinical, pv-course]
    goals:
      - "تعدّ أعراض الـ hyperviscosity والتجلط وتعرف كل عرض جاي منين"
      - "تشرح الـ pruritus والـ plethora والـ Gaisbock"
      - "ترتب الـ natural history وتعرف نسب الـ AML"
    status: unverified
    steps:
      - kind: explain
        page: 158
        title: "مين وإزاي؟"
        quote: "Clinical features\n  Incidence 2-3 per 100,000\n  Male to female ratio 0.8:1.2\n  Median age at onset 55-60y\n  Symptoms are often insidious in onset."
        text: |
          - Incidence **2–3 لكل 100,000**، و median age **55–60**.
          - الأعراض ==insidious==: بتيجي بالراحة.

          ليه بالراحة؟ التفسير المقبول (مش في الكتاب): الـ Hct بيعلى ببطء على شهور، والجسم بيتعوّد. فالمريض ممكن يفضل سنين حاسس بس بصداع خفيف ودماغ تقيلة، ويتكشف صدفة في CBC، أو للأسف أول مرة بجلطة.
      - kind: explain
        page: 158
        title: "الـ hyperviscosity: كل عرض جاي منين"
        quote: "1. Symptoms due to blood hyperviscosity secondary to a marked increase in the cellular elements of blood, which impairs microcirculation, sludgging of blood flow, and thrombosis, poor oxygen delivery include\n  Headache,\n  Dizziness,\n  Vertigo,\n  Tinnitus,\n  Visual disturbances, angina pectoris, or\n  Intermittent claudication."
        text: |
          الكتاب بيدّيك السلسلة: خلايا أكتر ← ==hyperviscosity== ← الـ **microcirculation** تتعطل و الدم **sludging** و thrombosis ← **poor oxygen delivery**.

          فالأعراض بتظهر في الأعضاء اللي عايشة على أوعية صغيرة وبتحتاج أكسجين كتير:
          - **المخ**: headache، dizziness، vertigo
          - **الودن الداخلية**: tinnitus
          - **العين**: visual disturbances
          - **القلب**: angina pectoris
          - **عضلات الرجل وهي ماشية**: intermittent claudication

          المفارقة: عنده كرات حمرا **أكتر**، والأنسجة واخدة أكسجين **أقل**، لأن الدم التقيل بيمشي أبطأ.
      - kind: figure
        page: 158
        quote: "1. Symptoms due to blood hyperviscosity secondary to a marked increase in the cellular elements of blood, which impairs microcirculation, sludgging of blood flow, and thrombosis, poor oxygen delivery include\n  Headache,\n  Dizziness,\n  Vertigo,\n  Tinnitus,\n  Visual disturbances, angina pectoris, or\n  Intermittent claudication."
        title: "Hyperviscosity: الدم عامل زي العسل"
