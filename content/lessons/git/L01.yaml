  - id: git.L01.lesson4
    title: "الـ H. pylori: أسلحته وإزاي نكشف عليه"
    hook: "باكتيريا عايشة في الحمض. نعرف أسلحتها، ومين من الناس بيتعب منها أكتر، ونكشف عليها بأنهي test من غير ما نتضحك علينا."
    minutes: 9
    pages: [21, 23]
    topics: [hp-biology, hp-tests]
    goals:
      - "تعرف أسلحة H. pylori: urease، adhesins، cytotoxin-associated gene A (CagA)، vacuolating cytotoxin A (VacA)"
      - "تعرف الـ host factors اللي بتفرق النتيجة"
      - "تختار الـ test المناسب للتشخيص وللـ follow-up وتعرف الـ false negatives"
    status: unverified
    steps:
      - kind: explain
        page: 21
        quote: "Urease to create an alkaline environment, which is essential for its survival in the stomach under the mucosal barrier."
        title: "إزاي بتعيش في الحمض؟"
        text: |
          الـ outcome بيتحدد من **bacterial factors** و **host factors** مع بعض.

          أسلحة البكتيريا:
          - ==Urease==: بتعمل **alkaline environment** حواليها، وده سر إنها تعيش تحت الـ mucosal barrier.
          - **Adhesins**: **Blood group antigen-binding adhesin (BabA)** و **outer inflammatory protein A (OipA)** بيلزقوها في الـ epithelium.
          - **Pathogenicity island**: بيشفّر **CagA** و **PicB**، ودول مرتبطين بالـ inflammation والـ epithelial injury.

          إزاي الـ urease بيعمل alkaline؟ التفسير المقبول (مش في الكتاب): بيكسّر الـ **urea** لـ **ammonia** و CO2، والـ ammonia بتعادل الحمض حوالين البكتيريا. ونفس الفكرة دي هي اللي بيشتغل عليها الـ rapid urease test والـ urea breath test.
      - kind: explain
        page: 22
        quote: "It has been shown that H. pylori vacA s1 and m1 strains are associated with high levels of inflammation in the gastric mucosa and increased risk for gastric atrophy and carcinoma, compared with the less virulent vacA s2 and m2 strains"
        title: "CagA و VacA: مين الأخطر؟"
        text: |
          - **CagA-positive** strains مرتبطة مباشرة بـ **acute gastritis** و **gastric ulcer** و **gastric cancer**.
          - **vacA**: كل الـ strains تقريبًا فيها الجين، بس **نصهم** مش بيطلّعوا البروتين. الـ genotype بيتحدد من 3 مناطق: **signal (s)**، **mid (m)**، **intermediate (i)**.
          - ==s1/m1== هو الأشرس: inflammation أعلى و risk أعلى للـ **atrophy** والـ **carcinoma** من s2 و m2.

          ومن ناحية الـ host: **IL-1β** (مع الـ hypochlorhydria)، **tumor necrosis factor (TNF)** و **lymphotoxin-α**، و **Toll-like receptor 1 (TLR1)** locus.
