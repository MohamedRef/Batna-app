  - id: res.L13.lesson4
    title: "الـ Results: جدول ولا رسمة؟"
    hook: "عندك 20 رقم. تكتبهم في النص؟ تعمل جدول؟ ولا graph؟ القرار ده ليه قواعد."
    minutes: 8
    pages: [25, 36]
    topics: [results]
    goals:
      - "تعرف مبادئ كتابة النتايج"
      - "تختار بين النص والجدول والـ graph"
      - "تعرف قواعد الجداول والصور للنشر"
    status: unverified
    steps:
      - kind: explain
        page: 25
        quote: "Results\nPrinciples\nResults that do not relate to the research objective should not be mentioned. Sufficient detail should be given to allow the scientists to assess the validity and accuracy of the results.\nStatistics should not take over the paper, but statistical analysis of the results should be adequately described.\nResults should be presented in a logical sequence in the text, tables, and illustrations."
        title: "مبادئ النتايج"
        text: |
          - **اللي ملوش علاقة بالـ objective ماتكتبوش.**
          - تفاصيل **كفاية** إن العلماء يحكموا على الـ validity والـ accuracy.
          - الـ statistics **ماتاخدش الـ paper**، بس اوصف التحليل كويس.
          - النتايج بـ ==logical sequence== في النص والجداول والصور.
      - kind: explain
        page: 26
        quote: "Results\nPrinciples\nAuthors should not repeat in the text the numerical data contained in figures and tables.\nThe number of tables and figures should be restricted to those needed to explain the argument of the paper and to support its findings. A good rule about whether to include figures or not is: When in doubt, leave it out."
        title: "ماتكرّرش، وقلّل"
        text: |
          - **ماتعيدش** في النص الأرقام اللي في الجداول والـ figures.
          - عدد الجداول والصور على قد ما **يشرح الفكرة ويدعم النتايج** بس.

          والقاعدة الذهبية: ==When in doubt, leave it out==.
      - kind: table
        page: 27
        quote: "Results\nTables\nTables should be used:\nTo show the exact values of more data than can be summarized in a few sentences of text; or\nWhen the objective of presenting data is to present specific inter-relationships.\nTables should not be used:\nWhen the data can be easily presented in the text; or\nWhen there is no relation between the data or to a time sequence."
        title: "إمتى جدول؟"
        columns: ["", "Situation 1", "Situation 2"]
        rows:
          - ["Use a table", "Exact values of more data than a few sentences", "Specific inter-relationships"]
          - ["Don't use a table", "Data easily said in the text", "No relation between data or to time"]
        hide: [[0, 1], [0, 2], [1, 1]]
      - kind: figure
        page: 34
        quote: "Results\nIllustrations\nIllustrations should be used only for:\nA specific purpose. An illustration may be used as evidence to support the argument, since \"seeing is believing\".\nGraphs are used to illustrate relationships. If exact values are important, a table is preferable to a graph; when trends and relationships are more important than exact values, a graph is more efficient."
        title: "Text ولا table ولا graph؟"
        alt: "A small decision tree. Top box: few numbers? yes leads to Text. No leads to a second box: exact values matter most? Yes leads to Table; no, trends or relationships matter most, leads to Graph."
