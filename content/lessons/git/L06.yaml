      - kind: explain
        page: 216
        title: "المضاعفات والـ CRC"
        quote: "Colorectal cancer: is the most feared long-term complication for ulcerative colitis."
        text: |
          - **life-threatening hemorrhage**
          - **acute severe UC**: ممكن يحتاج colectomy لو حصل perforation أو toxic megacolon
          - **pouchitis**: بس عند اللي عمل **IPAA**
          - ==Colorectal cancer==: أكتر حاجة بنخاف منها على المدى البعيد

          **Risk factors:** duration، extent، severity of inflammation، family history of CRC، **PSC**، وغالبًا early onset.

          الـ excess risk بيبان بعد **8–10 سنين**، فالكتاب: **screening colonoscopy بعد 8 سنين** في الـ extensive colitis، و **surveillance كل 1–2 سنة**.
      - kind: update
        page: 216
        quote: "The excess risk of CRC appears after 8–10 years of disease. Hence, a screening colonoscopy is recommended after 8 years"
        text: "الـ ECCO والـ BSG بيقولوا screening colonoscopy بعد حوالي 8 سنين من الأعراض **لكل** عيان UC (علشان نعيد تحديد الـ extent)، وبعدين surveillance حسب الـ risk كل 1 أو 3 أو 5 سنين، والـ PSC كل سنة من التشخيص. في الامتحان اكتب إجابة الكتاب."
        ref: "ECCO UC guideline 2017; BSG IBD guideline 2019"
      - kind: explain
        page: 217
        title: "التشخيص والـ differential"
        quote: "Of particular importance is the exclusion of infectious pathogens, as the treatment of active IBD frequently involves immunosuppressive medications."
        text: |
          التشخيص ==clinical==: history + exam + labs + imaging + endoscopy + histology. مفيش finding واحد.

          وفي كل flare لازم تستبعد **infection** الأول، لأن علاج الـ IBD **immunosuppressive**.

          الـ differential: **indeterminate colitis**، **IBS**، **infectious colitis**، mimics زي diverticulitis و appendicitis و lymphoma و malignancy، و non-infectious colitis: **microscopic**، **radiation**، **ischemic**، **NSAID**، و diversion و CGD و GVHD و amyloid.
      - kind: sort
        page: 223
        quote: "Triad of watery diarrhea, endoscopically normal mucosa and collagenous or lymphocytic infiltrate"
        prompt: "Table 5: صنّف الـ mimic"
        bins: ["Infectious", "Non-infectious"]
        cards:
          - { text: "Yersinia", bin: 0 }
          - { text: "CMV", bin: 0 }
          - { text: "Entamoeba histolytica", bin: 0 }
          - { text: "NSAIDs (eosinophilic infiltrate)", bin: 1 }
          - { text: "Ischemic: normal rectal biopsy", bin: 1 }
          - { text: "Radiation: telangiectasia", bin: 1 }
          - { text: "Microscopic colitis: normal endoscopy", bin: 1 }
        why: "الـ bacteria والـ viruses والـ protozoa infectious. الباقي non-infectious وكل واحد ليه clue: eosinophils للـ NSAIDs، rectal biopsy طبيعية في الـ ischemic والـ diverticular، telangiectasia للـ radiation، و normal endoscopy للـ microscopic colitis."
