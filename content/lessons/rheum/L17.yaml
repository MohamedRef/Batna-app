          - "الـ HLA-B27 موجود في 90–95% من الـ AS، مش بيحدد الـ IBD risk."
          - "الـ anti-CCP للـ RA."
          - "الـ amylase مالوش علاقة."
      - kind: explain
        page: 286
        title: "الـ sacroiliac في الـ X-ray"
        quote: "Imaging\n  Plain X-ray (not very sensitive).\n  Sacroiliac joints.\n  Sacroiliitis is usually symmetrical and bilateral.\n  There are subchondral erosions, sclerosis, and proliferation on the iliac side.\n  At end-stage, there may be total occlusion of the SI joint."
