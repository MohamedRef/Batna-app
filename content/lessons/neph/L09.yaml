        text: |
          كل عيان ليه: مدة الجلسة، blood flow، تركيب المحلول، dialysate flow، كام هنسحب مية، والـ anticoagulation.

          بتفرق: **acute ولا chronic**، **أول جلسة**، الـ residual renal function، الأمراض التانية (hypotension، قلب، كبد)، والـ acid–base والـ electrolytes.

