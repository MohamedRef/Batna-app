  - id: neph.L14.081
    kind: order
    topic: ln-response
    prompt: Put the steps for an unsatisfactory response to lupus nephritis therapy in order (Figure 12).
    steps:
      - Verify adherence to treatment
      - Ensure adequate dosing (drug levels, MPA level, infusion records)
      - Repeat biopsy if chronicity or another diagnosis (such as TMA) is suspected
      - Switch to an alternative first-line regimen if disease stays active
      - "Refractory: add rituximab or another biologic, extended IV pulse cyclophosphamide, or a clinical trial"
    src: { page: 461, quote: "Figure 12: Management of patients who show unsatisfactory response to initial therapy for active lupus nephritis.\n1. Verify adherence to treatment\n2. Ensure adequate dosing of immunosuppressive medications by measuring plasma drug levels if applicable or available (check mycophenolic acid level if on mycophenolic acid analogs/check infusion records if on cyclophosphamide)\n3. Repeat biopsy if concern for chronicity or other diagnosis (e.g., thrombotic microangiopathy)\n4. Consider switching to an alternative first-line regimen when there is persistent disease activity\n5. Consider the following in patients refractory to first-line treatment regimens:\n  Addition of rituximab or other biologic therapies\n  Extended course of i.v. pulse cyclophosphamide\n  Enrollment in clinical trials if eligible\ni.v., intravenous." }
    status: unverified
    tags: [high-yield]
