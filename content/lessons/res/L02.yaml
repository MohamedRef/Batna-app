      - kind: explain
        page: 64
        quote: "Neonatal Mortality Rate = Number of neonatal deaths / Total number of live births during the same year x 1000\nExample: Memphis, Tennessee, with a population of 1.37 million, reported a total number of 150 neonatal deaths and 30,000 live births in 1982. The neonatal mortality rate is 150/30,000 x 1000 = 5, or 5 neonatal deaths per 1000 live births per year.\nThe neonatal period is defined as the interval of time between birth and 28 days postpartum."
        title: "Neonatal mortality rate"
        text: |
          **NMR = neonatal deaths ÷ ==live births== in the same year × 1000**

          الـ **neonatal period** = من الولادة لحد ==28 days== postpartum.

          مثال slide 64: 150 neonatal death و30,000 live birth: 150 ÷ 30,000 × 1000 = **5 per 1000 live births**.

          ليه live births مش السكان؟ لأن اللي ممكن يموت كـ neonate هو اللي اتولد حي بس؛ المقام لازم يبقى الناس اللي معرضين للحدث. التفسير المقبول (مش في الكتاب).
