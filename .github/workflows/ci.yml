name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests, content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: No build output, book text or huge files in git
        run: scripts/check-tracked-files.sh
      - name: System libraries for the desktop WebView
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Content checks (schema, ids, pages, approvals)
        run: cargo run -q -p batna-tools -- validate
      - name: Offline content pack builds and round-trips
        run: cargo run -q -p batna-tools -- packs build --check

  android:
    name: Android arm64 compiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy for aarch64-linux-android with the runner's NDK
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android28-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android28-clang"
          cargo clippy -p batna-app --target aarch64-linux-android --no-default-features --features mobile -- -D warnings

  macos:
    # The Mac-only code (the .app swap for updates, the Mac menu, the Keychain
    # session) never compiles on Linux. Free on a public repo. Not a required
    # check, so a slow Mac runner never blocks a merge, but it runs on every
    # PR so a break shows up before `just bundle-mac` does.
    # adapted from kabar-app main: .github/workflows/ci.yml (macos)
    name: Mac app compiles
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # dx strips the release binary with rust-objcopy, which needs
          # libLLVM from llvm-tools.
          components: clippy, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - run: cargo clippy -p batna-app --all-targets -- -D warnings
      - run: cargo test -p batna-app
      # Built from source: the prebuilt macOS dx links Homebrew's OpenSSL at
      # the Intel path, which Apple-silicon runners don't have.
      - name: Install dx 0.7.10
        run: |
          if ! dx --version 2>/dev/null | grep -q '0.7.10'; then
            cargo install dioxus-cli --version 0.7.10 --locked
          fi
      - name: Bundle Batna.app
        run: |
          cd crates/app
          if ! dx bundle --platform macos --release --package-types macos --out-dir ../../dist/mac > ../../dx-bundle.log 2>&1; then
            grep -iE 'error|failed|panick|not found|no such' ../../dx-bundle.log | grep -v ' INFO Compiled' | tail -n 9 | sed 's/^/::error::/'
            exit 1
          fi
          tail -n 5 ../../dx-bundle.log
          app="$(find ../../dist/mac -maxdepth 3 -name '*.app' -print -quit)"
          test -n "$app"
          plutil -lint "$app/Contents/Info.plist"

  worker:
    name: Batna Cloud Worker compiles (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p batna-server --target wasm32-unknown-unknown -- -D warnings
