      - kind: mnemonic
        page: 377
        quote: "Risk factors for gallstones include female sex, obesity, increased age, American Indian ethnicity, a Western diet, and a family history."
        word: "FAD WAFER"
        parts:
          - { key: "F", text: "Female sex (≈ 2:1)" }
          - { key: "A", text: "Age: advancing age" }
          - { key: "D", text: "Drugs: contraceptive pills, anabolic steroids, somatostatin (long-term octreotide), hypolipidaemic drugs" }
          - { key: "W", text: "Western diet" }
          - { key: "A", text: "American Indian ethnicity" }
          - { key: "F", text: "Family history" }
          - { key: "E", text: "Excess weight: obesity" }
          - { key: "R", text: "Rapid weight loss" }
        hook: |
          الـ **wafer** بقى fad (موضة) في الأكل الغربي، والموضة دي بتعمل حصوات. 🍫

          وفي مصر الكتاب بيزوّد مجموعات انتشارها أعلى:
          - **Diabetics**
          - بعد **gastrectomy** أو **ileal resection**
          - **Hypolipidaemic drugs** و long-term **octreotide** و contraceptive pills
          - **Cirrhotics**: الانتشار 30%

          والـ ileal resection منطقية: الـ bile salts بتترجع من الـ ileum، فلو اتشال، الـ bile salts بتقل والـ cholesterol بيفضل من غير شيّال.
      - kind: check
        page: 377
        quote: "female sex with a tendency to obesity, and a history of rapid weight loss are particularly prone to develop cholesterol"
        question: "Which patient is MOST prone to **pigment** stones rather than cholesterol stones?"
        options:
          - "A young man with sickle cell disease"
          - "An obese 45-year-old woman"
          - "A woman losing weight fast after bariatric surgery"
          - "A woman on the contraceptive pill"
        answer: 0
        why:
          - "صح: الكتاب بيقول الـ pigment stones في **disorders of haemoglobin** اللي بتزوّد الـ haemolysis. الـ bilirubin الزيادة هو المادة الخام."
          - "دي البروفايل الكلاسيكي للـ **cholesterol** stones (female + obesity)."
          - "الـ **rapid weight loss** بيعمل cholesterol stones."
          - "الـ pills من عوامل الخطر العامة، ومش بتخص الـ pigment."
      - kind: explain
        page: 378
        quote: "It consists of Ca bilirubinate (a polymer of bilirubin), cholesterol microcrystals, and mucin. > Sludge develops during gallbladder stasis"
        title: "الـ sludge: الحصوة وهي لسه عيّلة"
        text: |
          الـ ==biliary sludge== غالبًا هو اللي بيسبق الحصوة. اعتبره الحصوة وهي لسه طين.

          مكوّن من 3 حاجات:
          - **Ca bilirubinate**: polymer of bilirubin
          - **Cholesterol microcrystals**
          - **Mucin**

          بيتكوّن إمتى؟ لما المرارة تركد (==stasis==). والكتاب بيدي مثالين:
          - **Pregnancy**
          - **TPN**: العيان مش بياكل بالبُق، فمفيش أكل يوصل الـ duodenum يقول للمرارة تنقبض.

          وبعدين إيه؟ تلات طرق:
          - معظمه asymptomatic وبيختفي لوحده لما السبب يروح.
          - أو يكبر ويبقى حصوة.
          - أو ينزل في الـ ducts ويسدّها، فيعمل **biliary pain** أو **cholangitis** أو **pancreatitis**.
      - kind: figure
        page: 378
        quote: "cholesterol microcrystals, and mucin. > Sludge develops during gallbladder stasis, as occurs during pregnancy or"
        title: "مصنع الحصوات: 3 خطوط إنتاج"
        alt: "Three boxes at the top: supersaturation (more cholesterol, fewer bile salts and lecithin), nucleation (mucin scaffold, glycoproteins, calcium) and stasis (poor gallbladder emptying, pregnancy, TPN). All three arrows meet at biliary sludge (calcium bilirubinate, cholesterol microcrystals, mucin). From sludge, three outcomes: most disappears when the cause ends; it can grow into a stone at 1 to 2 mm a year; or it can migrate and cause pain, cholangitis or pancreatitis."
        caption: "التلاتة لازم يتجمعوا: ==supersaturated bile==، حاجة تلمّ البلورات (mucin)، ومرارة راكدة تسيبهم يكبروا."
