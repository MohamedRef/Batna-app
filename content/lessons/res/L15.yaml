    title: c × r table
    text: |
      الـ **c × r table** بيستخدم لما يبقى فيه ==أكتر من صفين و/أو أكتر من عمودين==.

      بيوضح ==العلاقة بين condition و characteristic== لما واحد منهم أو الاتنين ليه ==أكتر من احتمالين==.

