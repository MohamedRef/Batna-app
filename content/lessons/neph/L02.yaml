          - "بنوقف كآخر حل، ومش هنا."
          - "الـ ACEi + ARB ممنوع (1B)."
          - "مفيش داعي."
      - kind: explain
        page: 32
        quote: "Imaging findings such as reduced kidney size and reduction in cortical"
        title: "ليه دول بيثبتوا إنه chronic؟"
        text: |
          الكتاب بيثبت الـ **chronicity** (أكتر من 3 شهور) بـ: تحاليل GFR وبول قديمة، **imaging** (كلية صغيرة و cortex رفيع)، **pathology** (fibrosis و atrophy)، التاريخ المرضي، وتكرار التحليل قبل وبعد 3 شهور.

          التفسير المقبول (مش في الكتاب): كل علامة من دول **محتاجة وقت** علشان تحصل:

          - الكلية بتصغر والـ ==cortex== يرفع لما nephrons كتير تموت وتتليف، وده ماييجيش في أسبوع.
          - الـ ==fibrosis== والـ atrophy ندبة، والندبة علامة على جرح قديم.
          - الأنيميا والـ CKD-MBD (ص 33) بياخدوا شهور لأن الـ erythropoietin والـ vitamin D بيقلّوا بالتدريج.

          يعني الـ AKI بيغيّر **الأرقام**، والـ CKD بيغيّر **الشكل**.
      - kind: explain
        page: 33
        quote: "Examination: Uremic facies, scratch marks, bone tenderness, neuropathy. Investigations: anemia of CKD, CKD-MBD, small kidneys by U/S, Biopsy. 1.1.4. Evaluation of cause"
        title: "CKD ولا AKI؟"
        text: |
          **History**: تحاليل قديمة، أعراض طويلة (fatigue، anorexia، itching، bone pain، 2ry amenorrhea، infertility، polyuria)، risk factors.

          **Exam**: uremic facies، scratch marks، bone tenderness، neuropathy.

          **Investigations**: ==anemia of CKD==، CKD-MBD، و ==small kidneys== بالـ U/S، أو biopsy.

          والـ **chronicity** بتتأكد بتحاليل قديمة، imaging (كلى صغيرة وcortex رفيع)، pathology (fibrosis وatrophy)، أو تكرار التحليل بعد 3 شهور.

          التفسير المقبول (مش في الكتاب): الفرق مهم **لأن** الـ AKI ممكن يرجع لو لحقناه، والكلى الصغيرة والأنيميا والـ MBD محتاجين شهور يتكوّنوا، **فـ** وجودهم بيقول إن المرض قديم.
