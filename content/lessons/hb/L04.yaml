      - "تعرف تقيّم PVT في الـ cirrhosis وإمتى تبدأ anticoagulation"
      - "تشرح ليه الـ UFH والـ INR مش بيشتغلوا صح في الـ cirrhosis"
      - "تختار الـ DOAC الصح حسب الـ Child class"
    status: unverified
    steps:
      - kind: explain
        page: 82
        quote: "Evaluate portal vein patency in all patients with cirrhosis. Always evaluate the extension of PVT with CT scan or MRI."
        title: "الـ cirrhosis = prothrombotic condition"
        text: |
          **PVT** هو أشهر **thrombotic event** في عيانين الـ **cirrhosis**. (افتكر من الدرس الأول: **stasis** بسبب الـ intrahepatic block.)

          **Recommendations:**

          - قيّم ==portal vein patency== في كل عيان cirrhosis.
          - قيّم الـ **extension** دايمًا بـ CT أو **MRI**.
          - لو عنده **HCC**: استبعد ==neoplastic PVT== (contrast US/CT/MRI أو biopsy من الجلطة).
          - فكّر في screening للـ **genetic thrombophilia**.
      - kind: reveal
        page: 82
        quote: "In patients with underlying HCC, rule out neoplastic PVT by contrast enhanced ultrasound/CT scan/MRI or biopsy of the thrombus."
        prompt: "عيان HCC عنده جلطة في الـ portal vein. ليه لازم تعرف الأول إذا كانت **neoplastic**؟"
        answer: |
          لأن الـ ==tumour thrombus== مش جلطة دم: ده ورم ماشي جوه الوريد. الـ anticoagulant مش هيذوّبه، وهيعرّض العيان لنزيف من غير فايدة، وكمان بيغيّر الـ staging والعلاج بتاع الـ HCC كله.
      - kind: explain
        page: 82
        quote: "minimally occlusive thrombosis (<50% of the lumen) … shows progress within 1–3 months or if the thrombus is spreading in the superior mesenteric vein"
        title: "إمتى أبدأ؟"
        text: |
          ==Minimally occlusive thrombosis== يعني جلطة بتقفل أقل من 50% من الـ lumen. هنا فكّر في anticoagulation لو:

          - الجلطة بتكبر خلال 1–3 شهور، أو
          - بتمتد للـ **superior mesenteric vein (SMV)**.

          قبل ما تبدأ، وازن الـ risk/benefit لكل عيان. الـ bleeding risk factors اتنين:

          - **Untreated oesophageal varices**: عالجها الأول.
          - **Severe thrombocytopenia**: platelets < 50 × 10⁹/L.

          الخطة:

          - **Dose and duration**: therapeutic dose لمدة 6 شهور على الأقل.
          - ==Lifelong anticoagulation==: في الـ SMV thrombosis، أو past history of intestinal ischaemia، أو liver transplant candidates.
          - **TIPS**: لو transplant candidate والـ PVT بيكبر رغم الـ anticoagulation.
      - kind: figure
        page: 82
        quote: "In patients with superior mesenteric vein thrombosis, with a past history suggestive of intestinal ischaemia or liver transplant candidates, consider lifelong anticoagulation."
        title: "PVT في الـ cirrhosis خطوة خطوة"
