          - تحتها الـ GBM: ==سميك جدًا ومقسوم طبقات== زي السبت المنسوج، وحوافه مش منتظمة.

          يعني ==basket weaving و lamellation==، عكس الشريط الرفيع المنتظم في الصورة اللي فاتت. والسميك ده ممكن يوصل 1200 nm.
      - kind: explain
        page: 184
        title: "الـ TBMN تحت الـ EM: رقم 250"
        quote: "Typically, a value of 250 nm will accurately separate adults with normal GBM from those with TBMN. For children, the cut-off is in the range of 200 to 250 nm."
        text: |
          الكتاب:
          - الـ LM والـ IF ==unremarkable== في الـ TBMN التقليدي.
          - الـ EM: **diffuse thinning** للـ GBM كله وللـ **lamina densa**.
          - سُمك الـ GBM الطبيعي بيعتمد على **السن والجنس**، علشان كده كل معمل محتاج أرقامه.
          - الـ cut-off: ==250 nm في الكبار==، و **200–250** في الأطفال.

          ليه الأطفال أقل؟ التفسير المقبول (مش في الكتاب): الـ GBM بيتخن مع النمو لحد البلوغ، فالطفل الطبيعي أصلًا GBM بتاعه أرفع من الكبير.

          والفرق المهم عن الـ Alport: الـ TBMN **رفيع ومنتظم**، والـ Alport **سميك ورفيع ومنسوج** (basket weaving).
