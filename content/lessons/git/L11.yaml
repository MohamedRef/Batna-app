      - kind: explain
        page: 302
        quote: "Patients with active bleeding manifested by hematemesis or bright red blood on nasogastric aspirate, shock, persistent hemodynamic derangement despite fluid resuscitation, serious comorbid medical illness, or evidence of advanced liver disease require admission to an ICU."
        title: "مين يدخل ICU؟"
        text: |
          - **Active bleeding**: hematemesis أو دم أحمر في الـ nasogastric (NG) aspirate.
          - ==Shock==.
          - **Persistent hemodynamic derangement** رغم المحاليل.
          - **Serious comorbid illness**.
          - **Advanced liver disease**.

          ليه دول بالذات؟ التفسير المقبول (مش في الكتاب): كل واحد يا إما بيقول إن النزيف **شغال دلوقتي** (hematemesis، دم أحمر في الـ aspirate)، يا إما إن الجسم **مش قادر يعوّض** (shock، derangement رغم المحاليل)، يا إما إن أي نزيف صغير هيقلب كارثة (comorbidity، أو liver disease بالـ coagulopathy والدوالي). ودول محتاجين متابعة كل دقيقة.
      - kind: explain
        page: 302
        quote: "The ideal crystalloid fluid type to be used in hemodynamic resuscitation either saline 0.9% sodium chloride or balanced crystalloids (e.g ringer's lactate which showed reduce both mortality and major adverse renal events in critically ill patients."
        title: "المحاليل والـ NG tube"
        text: |
          الـ ==early intensive resuscitation== بتقلل الـ mortality، تصلّح الـ hypovolemia، وتمنع الـ multiorgan failure.

          - المحلول: **crystalloids**، يا **0.9% saline** يا **balanced** زي **Ringer's lactate** (قلل الـ mortality والـ renal events في الـ critically ill).
          - الـ **NG tube** مش روتين. ممكن يفيد في triage حالات مختارة، ولو طلع دم أحمر أو **coffee grounds** يبقى المصدر upper.

          ليه الـ balanced؟ الكتاب: قلل الـ mortality والـ renal events في الـ critically ill. التفسير المقبول (مش في الكتاب): الـ saline فيه chloride أعلى من البلازما، فاللترات الكتير منه بتعمل hyperchloremic acidosis وبتقلل دم الكلى. وليه الـ NG tube مش روتين؟ لأنه مزعج، ولو الـ aspirate طلع نضيف ده ما بينفيش نزيف من الـ duodenum، فغالبًا مش هيغيّر قرارك.
      - kind: explain
        page: 303
        quote: "A restrictive red blood cell (RBC) transfusion strategy is considered standard of care in non- massive, acute UGIH both in variceal or nonvariceal."
        title: "نقل الدم: restrictive"
        text: |
          الـ ==restrictive strategy== هي الـ standard of care في النزيف الـ non-massive، variceal أو non-variceal، ومعاها **in-hospital mortality** أقل.

          - من غير قلب: انقل لو **Hb <7**، والهدف **7-9**.
          - مع **cardiovascular disease**: انقل لو **Hb <8**، والهدف **>10**.
          - في الدوالي (الدرس 4): خليه حوالي **8**.

          ليه restrictive؟ التفسير المقبول (مش في الكتاب): الدم الزيادة بيرفع الـ volume والضغط، فممكن يفك الجلطة اللي قفلت القرحة، وفي الدوالي بيرفع الـ portal pressure فتنزف تاني. وليه مريض القلب حدّه أعلى؟ لأن عضلة القلب بتسحب أغلب الأكسجين من الدم أصلًا، فأي نقص في الـ Hb ممكن يعمل ischemia.
      - kind: figure
