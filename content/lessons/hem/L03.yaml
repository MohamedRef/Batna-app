            <text x="247" y="60" text-anchor="middle" class="t-sm">no anchor, no shields</text>
            <text x="247" y="188" text-anchor="middle" class="t-sm t-mut">free Hb out</text>
          </svg>
      - kind: order
        page: 50
        quote: "Breakdown of RBC membranes by complement leads to the release of hemoglobin into the circulation. Hemoglobin is bound to haptoglobin for efficient clearance from the circulation. After saturating the haptoglobin, free hemoglobin circulates and binds irreversibly with nitric oxide (NO), depleting NO levels in peripheral blood."
        prompt: "رتّب الطريق من الـ complement للمغص:"
        steps:
          - "Complement lyses the red cell"
          - "Haemoglobin saturates haptoglobin"
          - "Free Hb binds nitric oxide"
          - "NO is depleted"
          - "Smooth muscle contracts"
        why: "الـ nitric oxide (NO) بيرخّي العضلات الملسا. لما الـ Hb الحر يخطفه، العضلات تنقبض: **vasoconstriction**، **مغص وانتفاخ**، **esophageal spasm**، **erectile dysfunction**، **pulmonary hypertension**."
      - kind: reveal
        page: 51
        quote: "Abdominal pain, Bloating, Back pain, Headaches, Esophageal spasms, Erectile dysfunction and Fatigue"
        prompt: "إيه علاقة مرض في الدم بـ esophageal spasm و erectile dysfunction؟"
        answer: |
          الكتاب بيربطهم بالـ **nitric oxide (NO)**. الـ Hb الحر في الـ PNH، بعد ما يشبّع الـ haptoglobin، بيمسك الـ NO **مسكة نهائية**، فالـ NO في الدم يقل.

          الـ NO بيرخّي الـ **smooth muscle**. من غيره العضلات الملسا تنقبض في كل حتة:
          - المريء: **esophageal spasm** و dysphagia.
          - الأمعاء: **ألم بطن** و **انتفاخ**.
          - الأوعية: vasoconstriction و **pulmonary hypertension**.
          - الـ corpora cavernosa محتاجة NO عشان ترتخي وتتملي دم، فيحصل **erectile dysfunction**.

          يعني الأعراض دي بتزيد مع **نوبات الـ haemolysis**، لأن كل نوبة بتطلّع Hb حر أكتر.
      - kind: explain
        page: 51
        title: "الأعراض وأماكن الجلطات"
        quote: "The most frequent sites of thrombosis include the hepatic, pulmonary, cerebral, and deep and superficial veins, as well as the inferior vena cava."
        text: |
          **أعراض NO**: ألم بطن، انتفاخ، ألم ضهر، صداع، esophageal spasm، erectile dysfunction، fatigue.

          **الصورة**: أعراض أنيميا، ==haemoglobinuria (25% بس)==، haemolysis على نوبات، كلى، dysphagia، عدوى، ونزيف من الـ thrombocytopenia.

          **الجلطات** في أماكن غريبة: ==hepatic (Budd-Chiari)==، pulmonary، cerebral، deep و superficial veins، والـ inferior vena cava (IVC).

          ليه الجلطات؟ التفسير المقبول (مش في الكتاب): الصفايح كمان ناقصها الـ CD59، فالـ complement بينشّطها بدل ما يكسرها، ونقص الـ NO بيشيل فرامل تانية من على الصفايح والأوعية. والـ haemoglobinuria في 25% بس لأن الـ haemolysis بيجي **نوبات**، وبين النوبات البول ممكن يبان طبيعي.
      - kind: match
        page: 51
        quote: "Other physical examination findings may include the following: (Thromboembolic complications)\n  Hepatomegaly and ascites in the presence of Budd-Chiari syndrome\n  Splenomegaly in the presence of splenic vein thrombosis\n  Absent bowel sounds in the presence of bowel necrosis\n  Papilledema in the presence of cerebral vein thrombosis\n  Skin nodules that are red and painful in the presence of dermal vein thrombosis"
        prompt: "الجلطة فين؟ العلامة إيه؟"
        pairs:
          - ["Budd-Chiari", "Hepatomegaly and ascites"]
          - ["Splenic vein", "Splenomegaly"]
          - ["Bowel necrosis", "Absent bowel sounds"]
          - ["Cerebral vein", "Papilloedema"]
          - ["Dermal vein", "Red painful skin nodules"]
        why: "أي **Budd-Chiari** أو جلطة **cerebral** أو **intra-abdominal** في شاب، فكّر في الـ PNH، خصوصًا لو معاها haemolysis."
      - kind: table
        page: 52
        quote: "Table 40-1: Recommendation for Screening Patients for PNH\nHistory of episodic hemoglobinuria\nEvidence of nonspherocytic, Coombs negative intravascular hemolysis (must have abnormally high serum lactate dehydrogenase)\nPatients with aplastic anemia (screen at diagnosis and once yearly even in the absence of intravascular hemolysis)\nPatients with refractory anemia (RA) or refractory cytopenias with multilineage dysplasia (RCMD) variants of myelodysplastic syndrome (MDS)\nPatients with venous thrombosis involving unusual sites (usually have evidence of intravascular hemolysis)\n  Budd-Chiari syndrome\n  Other intraabdominal sites\n  Cerebral veins\n  Dermal veins"
        title: "مين نعمله screening؟ (Table 40-1)"
        columns: [Who, Note]
        rows:
          - ["Episodic haemoglobinuria", "History"]
          - ["Coombs-negative haemolysis", "Non-spherocytic, high LDH"]
          - ["Aplastic anaemia", "At diagnosis, then yearly"]
          - ["MDS (RA, RCMD)", "Refractory cytopenias"]
          - ["Unusual venous thrombosis", "Budd-Chiari, cerebral, dermal"]
        hide: [[1, 1], [2, 1], [4, 1]]
      - kind: explain
        page: 52
        title: "التحاليل"
        quote: "Basic evaluation of PNH:\n  CBC:\n    Anaemia of varying variety (mostly severe)\n    Leucopenia: due to reduction in neutrophils\n    Thrombocytopenia (mild).\n  Urine examination:\n    When the rate of blood destruction is increased, the urine contains increased amounts of urobilinogen.\n    Intravascular hemolysis leads to depletion of serum haptoglobin, which results in the continuous presence of hemoglobin in the glomerular filtrate in the kidney\n  Reticulocyte count: Increased (lesser comparing degree of anaemia).\n  Serum LDH: increased"
        text: |
          - **Complete blood count (CBC)**: anaemia (غالبًا شديدة)، leucopenia (neutrophils)، thrombocytopenia خفيفة.
          - **البول**: urobilinogen، و haemoglobinuria و ==haemosiderinuria==؛ والحديد بيضيع في البول فالـ **iron stores قليلة**.
          - **Retics** عالية بس **أقل من المتوقع**، عشان النخاع نفسه ضعيف (الـ PNH بيطلع من stem cell، وكتير معاه marrow failure). ولنفس السبب فيه leucopenia و thrombocytopenia.
          - **Lactate dehydrogenase (LDH)** و unconjugated bilirubin عاليين، و haptoglobin واطي.
          - **Bone marrow**: يفرّق PNH من PNH فوق bone marrow failure تانية.
          - الاختبارات القديمة: **Ham test** و **sucrose haemolysis test**.
          - ==Flow cytometry==: الأسهل **CD59 (MIRL)** على الكرات، و **CD55 (DAF)** كمان مفيد.
      - kind: reveal
        page: 52
        quote: "Intravascular hemolysis leads to depletion of serum haptoglobin, which results in the continuous presence of hemoglobin in the glomerular filtrate in the kidney"
        prompt: "مرض فيه haemolysis، والمفروض الحديد يتراكم. ليه الـ iron stores في الـ PNH قليلة؟"
        answer: |
          لأن الـ haemolysis **intravascular**. الكتاب بيشرح: الـ haemolysis بيخلّص الـ **haptoglobin**، فالـ Hb بيفضل موجود في الـ **glomerular filtrate** على طول.

          يعني الحديد بيطلع **في البول** كـ haemoglobin و ==haemosiderin== بدل ما يرجع للجسم. عكس الـ extravascular (زي الـ HS والثلاسيميا) اللي الـ macrophage بيحتفظ فيه بالحديد.

          عشان كده علاج الأنيميا في الـ PNH فيه **iron supplementation**، وده غريب على مرض haemolytic.
      - kind: reveal
        page: 53
        quote: "Bone marrow aspiration and biopsy: Bone marrow aspirate and biopsy are done to distinguish PNH from PNH in setting of another bone marrow failure syndrome."
        prompt: "التشخيص بالـ flow cytometry. ليه نعمل bone marrow كمان؟"
        answer: |
          الكتاب بيقول الـ **bone marrow aspirate and biopsy** بيفرّق الـ PNH **لوحده** من الـ PNH اللي جاي **فوق bone marrow failure syndrome تاني** (زي الـ aplastic anaemia).

          ليه ده يفرق؟ التفسير المقبول (مش في الكتاب): لو النخاع فاضي، المشكلة الأساسية **فشل النخاع**، وعلاجها مختلف (ATG أو transplant)، والـ complement inhibitor لوحده مش هيملى النخاع. ولو النخاع مليان، الأنيميا غالبًا من الـ **haemolysis**.

          وده نفس سبب إن الـ aplastic anaemia في قايمة الـ screening للـ PNH: الاتنين بيطلعوا من نفس الأرض.
      - kind: check
        page: 53
        quote: "Flow cytometry\n  By analyzing expression of GPI-AP on hematopoietic cells using monoclonal antibodies and flow cytometry, the abnormal cells can be readily identified.\n  The simplest method is to analyze expression of MIRL (CD59) on erythrocytes.\n  Analysis of erythrocyte DAF (CD55) expression is also informative."
        question: "Best diagnostic test for PNH?"
        options:
          - "Flow cytometry for CD59 and CD55"
          - "Direct antiglobulin test"
          - "ADAMTS13 activity"
          - "Hb electrophoresis"
        answer: 0
        why:
          - "صح: الـ flow cytometry بيبيّن الخلايا اللي ناقصها الـ GPI-anchored proteins."
          - "الـ DAT سالب في الـ PNH (Coombs-negative haemolysis)."
          - "ده للـ TTP."
          - "ده للـ haemoglobinopathies."
      - kind: case
        page: 53
        quote: "Flow cytometry"
        stem: "A 28-year-old man has dark urine in the morning, tiredness and painful swallowing. He has never had a blood transfusion."
        steps:
          - reveal: "Hb 7.9 g/dL, WBC 3.1, platelets 95 × 10⁹/L, LDH very high, haptoglobin absent, DAT negative."
            question: "What is the leading diagnosis?"
            options: ["PNH", "Warm AIHA", "Hereditary spherocytosis", "β-thalassaemia minor"]
            answer: 0
            why: "Haemolysis **intravascular** و Coombs سالب و pancytopenia و dysphagia من نقص الـ NO = **PNH**."
          - question: "Best test to confirm it?"
            options: ["Flow cytometry for CD59 and CD55", "Osmotic fragility", "Hb electrophoresis", "ADAMTS13 activity"]
            answer: 0
            why: "الـ flow cytometry بيبيّن الكرات الناقصها الـ GPI-anchored proteins؛ الأسهل CD59 (MIRL) و CD55 (DAF) مفيد."
          - question: "His ferritin is low. Why?"
            options: ["Iron is lost in urine as haemoglobin and haemosiderin", "He eats no meat", "Transfusional overload", "Hepcidin is high"]
            answer: 0
            why: "الـ haptoglobin خلص، فالـ Hb بيعدّي في الـ glomerular filtrate، والحديد بيضيع في البول."
