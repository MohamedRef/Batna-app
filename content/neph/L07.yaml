  - id: neph.L07.155
    kind: card
    topic: tbm
    front: What was thin membrane disease previously called, and how does it present?
    back: Benign familial hematuria. A common autosomal dominant condition with microscopic hematuria and almost always normal renal function; found in about 5% of post-mortems and often in potential live donors.
    src: { page: 178, quote: "TMD was previously known as ―benign familial haematuria'. It is present in ~5% of post-mortem studies" }
