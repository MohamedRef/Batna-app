- id: res.L19.018
  kind: card
  topic: concept
  front: How did David Sackett define evidence-based medicine?
  back: The conscientious, explicit and judicious use of current best available evidence in making decisions about the care
    of an individual patient. In other words, EBM encourages using evidence from clinical research to support clinical decision
    making for individual patients (Sackett et al. 2000).
