      - kind: explain
        page: 168
        title: "سلّم العلاج: ليه كل درجة؟"
        quote: "Cyclophosphamide is used in rapidly progressive ILD."
        text: |
          الكتاب: **prednisone** أول خطوة، و **steroid-sparing agents** (methotrexate، azathioprine، mycophenolate mofetil)، و **IVIG أو rituximab** للـ resistant، و ==cyclophosphamide للـ rapidly progressive ILD==.

          التفسير المقبول (مش في الكتاب):
          - **Prednisone الأول**: أسرع حاجة تطفي الالتهاب وتوقف تكسير الألياف.
          - **Steroid-sparing بدري**: المرض مزمن، والـ steroids لسنين بتعمل **steroid myopathy** نفسها (ضعف proximal!)، فتتلخبط: هو المرض ولا الدوا؟ الدوا التاني يخليك تنزل الـ prednisone.
          - **IVIG أو rituximab**: لما الـ antibodies هي اللي شغالة والخطوات الأولى ما نفعتش؛ الـ rituximab بيشيل الـ B cells اللي بتصنعها.
          - **Cyclophosphamide للـ RP-ILD**: الرئة بتتليف في **أسابيع** (افتكر anti-MDA5)، فمحتاج أقوى دوا عندك من الأول.
