  # ------------------------------------------------------------------
  - id: geri.L11.lesson1
    title: "رئة عندها 80 سنة"
    hook: "الرئة الكبيرة مش مريضة، بس اتغيرت: أوسع، أرخى، وحابسة هوا أكتر. لازم تعرف الطبيعي قبل ما تقول COPD."
    minutes: 9
    pages: [188, 192]
    topics: [volumes, aging]
    goals:
      - "تفتكر الـ lung volumes والـ capacities بأرقامها"
      - "تفهم الـ senile emphysema وليه الـ TLC مش بيتغير"
      - "تعرف ليه الـ FEV1/FVC بيضلّلنا في الكبار"
    status: unverified
    steps:
      - kind: figure
        page: 188
        quote: "TLC … = TV+ IRV+ ERV+ RV = 4‐6 L VC …. = TV+IRV+ERV = 4800mL FRC … = RV+ERV = 1800 –2200 mL"
        title: "الأحجام في عمود واحد"
        alt: "A vertical bar for total lung capacity of 4 to 6 litres, split from bottom to top into residual volume 1200 ml, expiratory reserve volume 700 to 1200 ml, tidal volume 300 to 500 ml and inspiratory reserve volume 1900 to 3300 ml. Brackets on the right: FRC is RV plus ERV, IC is TV plus IRV, VC is everything except RV."
        caption: "الـ capacity = مجموع volumes. الـ VC هي كل حاجة ما عدا الـ RV، والـ FRC هي اللي فاضل بعد زفير عادي."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="10" width="120" height="120" class="fg-acc"/>
            <rect x="20" y="130" width="120" height="50" class="fg-good"/>
            <rect x="20" y="180" width="120" height="70" class="fg-box"/>
            <rect x="20" y="250" width="120" height="100" class="fg-bad"/>
            <text x="30" y="60" class="t-sm t-b">IRV</text>
            <text x="30" y="80" class="t-sm">1900-3300 ml</text>
            <text x="30" y="152" class="t-sm t-b">TV</text>
            <text x="30" y="170" class="t-sm">300-500 ml</text>
            <text x="30" y="210" class="t-sm t-b">ERV</text>
            <text x="30" y="230" class="t-sm">700-1200 ml</text>
            <text x="30" y="290" class="t-sm t-b">RV</text>
            <text x="30" y="310" class="t-sm">1200 ml</text>
            <path d="M150 10v170" class="fg-arrow-acc" stroke-width="3"/>
            <text x="158" y="100" class="t-sm t-b t-acc">IC</text>
            <path d="M150 180v170" class="fg-arrow" stroke-width="3"/>
            <text x="158" y="270" class="t-sm t-b">FRC 1.8-2.2 L</text>
            <path d="M240 10v240" class="fg-arrow-acc" stroke-width="3"/>
            <text x="248" y="130" class="t-sm t-b t-acc">VC</text>
            <text x="248" y="148" class="t-sm">4.8 L</text>
            <path d="M300 10v340" class="fg-arrow" stroke-width="3"/>
            <text x="190" y="345" class="t-sm t-b">TLC 4-6 L</text>
          </svg>
      - kind: match
        page: 188
        quote: "TLC … = TV+ IRV+ ERV+ RV = 4‐6 L VC …. = TV+IRV+ERV = 4800mL FRC … = RV+ERV = 1800 –2200 mL"
        prompt: "وصّل الـ capacity باللي بتتكون منه:"
        pairs:
          - ["IC", "IRV + TV"]
          - ["FRC", "RV + ERV"]
          - ["VC", "TV + IRV + ERV"]
          - ["TLC", "TV + IRV + ERV + RV"]
        why: "افتكر: الـ RV عمره ما بيطلع، فهو جوه الـ FRC والـ TLC بس. الـ VC هي اللي تقدر تنفخها كلها."
      - kind: explain
        page: 190
        quote: "―Senile Emphysema‖ results in alveolar dilatation without any destructive changes to the alveolar walls but due to degeneration of elastic fibers around the alveolar duct."
        title: "الـ senile emphysema"
        text: |
          التغيير في السن بيحصل في الـ **alveoli** مش في الـ large airways.

          الـ alveoli بتفقد الـ ==elastic recoil== وتوسع، وده اسمه **senile emphysema**: dilatation **من غير destruction** في الحيطان، بسبب degeneration للـ elastic fibers حوالين الـ alveolar duct.

          وده الفرق الجوهري عن الـ emphysema بتاع الـ COPD، اللي فيه destruction.
      - kind: explain
        page: 190
        quote: "Healthy older persons have approximately 25% lower diaphragmatic strength."
        title: "الصدر والعضلات"
        text: |
          - الـ chest wall بيبقى **أنشف**، والعضلات أضعف.
          - الشهيق بيعتمد أساسًا على الـ **diaphragm**، وده أضعف بحوالي ==25%== في الكبار الأصحاء.
          - الـ diaphragm الضعيف = **VC أقل**.
      - kind: reveal
        page: 190
        quote: "Thus, the two together result in an almost unchanged TLC with age."
        prompt: "الـ recoil قلّ (الرئة بتتمد أسهل) والـ chest wall نشف. يحصل إيه للـ TLC؟"
        answer: "الأولى بتزوّد الـ TLC والتانية بتقلّله، فبيلغوا بعض، والـ ==TLC== يفضل **تقريبًا ثابت** مع السن."
      - kind: explain
        page: 190
        quote: "Abnormally high RV/TLC is called hyperinflation, which can often be seen on a chest x-ray"
        title: "Air trapping"
        text: |
          الـ recoil القليل بيخلي الـ alveoli تقفل بدري في الزفير، فالهوا يتحبس ← الـ **RV يزيد**، والـ VC يقل.

          لو الـ RV/TLC عالي بشكل غير طبيعي = ==hyperinflation==، وبيبان في الـ X-ray. بيحصل في **asthma** و **COPD** و **السن المتقدم**.
      - kind: aside
        tone: analogy
        page: 190
        quote: "Elastic recoil of lung tissue decreases with aging, which makes it easier for the lungs to expand with less effort, increasing TLC."
        text: "الرئة الكبيرة زي بلونة اتنفخت كتير: بتتمد بسهولة، بس لما تسيبها مش بترجع لحجمها، وبيفضل فيها هوا."
      - kind: explain
        page: 191
        quote: "Adults normally experience declinein FEV1 with age (about one-third liter per decade)."
        title: "الـ FEV1 والـ ratio"
        text: |
          - الـ ==FEV1== بينزل حوالي **تلت لتر كل 10 سنين**.
          - بينزل **أكتر** من الـ FVC، فالـ **FEV1/FVC كمان بينزل** مع السن.
          - الرئة عندها reserve كبير، فده مش بيبان إلا لو فيه مرض.
          - الـ ratio تحت **0.65** عادة معناه obstruction، فالـ parameter ده ممكن **يبالغ** في تشخيص الـ obstruction في الكبار.
      - kind: check
        page: 191
        quote: "TLC does not change with age. Decreased VC with a corresponding increase in RV."
        question: "Which pair of changes is expected in a healthy 80-year-old lung?"
        options: ["TLC unchanged, RV up, VC down", "TLC up, RV down, VC up", "TLC down, RV down, VC down", "TLC unchanged, FEV1/FVC up"]
        answer: 0
        why:
          - "صح: ده ملخّص الكتاب بالظبط."
          - "الـ RV بيزيد مش بيقل، والـ VC بيقل."
          - "الـ TLC تقريبًا ثابت والـ RV بيزيد."
          - "الـ ratio بينزل لأن الـ FEV1 بينزل أكتر من الـ FVC."
      - kind: explain
        page: 191
        quote: "increases linearly with age from approximately 10% of TLC inyoung adults to approximately 30% of TLC by the age of 70."
        title: "الـ closing volume"
        text: |
          الـ **closing volume (CV)**: الحجم اللي عنده الـ basal airways بتقفل في الزفير العادي. الـ CV + RV = **closing capacity (CC)**.

          الـ CC بتزيد خطيًا من حوالي ==10%== من الـ TLC في الشباب لـ **30%** عند سن 70، لأن الـ recoil القليل بيخلي الـ small airways تقع.
      - kind: try
        items: [geri.L11.002, geri.L11.005, geri.L11.008, geri.L11.011, geri.L11.015]
    recap:
      - "TLC = TV + IRV + ERV + RV (4-6 L)؛ VC 4.8 L؛ FRC = RV + ERV."
      - "Senile emphysema: dilatation من غير destruction."
      - "Diaphragm أضعف 25%، chest wall أنشف."
      - "TLC ثابت، RV يزيد، VC يقل."
      - "FEV1 ينزل ثلث لتر كل 10 سنين؛ الـ ratio ممكن يبالغ في الـ obstruction."
      - "Closing capacity: من 10% لـ 30% من الـ TLC عند 70."
    practice: [geri.L11.001, geri.L11.002, geri.L11.003, geri.L11.004, geri.L11.005, geri.L11.006, geri.L11.007, geri.L11.008, geri.L11.009, geri.L11.010, geri.L11.011, geri.L11.012, geri.L11.013, geri.L11.014, geri.L11.015, geri.L11.016, geri.L11.097, geri.L11.098, geri.L11.099, geri.L11.122]
