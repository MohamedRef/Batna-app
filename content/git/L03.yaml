items:
  # ---------------------------------------------------------------- concept
  - id: git.L03.001
    kind: card
    topic: concept
    front: Define functional gastrointestinal disorders (FGIDs).
    back: Recurring GI symptoms that cannot be attributed to organic disease, structural or biochemical causes. They are disorders of gut-brain interaction.
    src: { page: 76, quote: "Functional gastrointestinal disorders (FGIDs) are characterized by recurring gastrointestinal (GI) symptoms that cannot be attributed to organic disease, structural, or biochemical causes." }
    status: unverified
    tags: [definition, high-yield]
  - id: git.L03.002
    kind: card
    topic: concept
    front: What is the newer name for functional GI disorders?
    back: Disorders of gut-brain interaction (DGBI).
    src: { page: 76, quote: "Functional GI disorders are disorders of gut–brain interaction." }
    status: unverified
    tags: [definition]
  - id: git.L03.003
    kind: cloze
    topic: concept
    text: "Functional gastrointestinal disorders (FGIDs) are the {{c1::most common}} diagnoses in gastroenterology."
    src: { page: 76, quote: "Functional GI disorders (FGIDs), the most common diagnoses in gastroenterology, are recognized by morphologic and physiological abnormalities." }
    status: unverified
  - id: git.L03.004
    kind: enumerate
    topic: concept
    prompt: Enumerate the five disturbances whose combination produces the GI symptoms of FGIDs.
    points:
      - Motility disturbance
      - Visceral hypersensitivity
      - Altered mucosal and immune function
      - Altered gut microbiota
      - Altered central nervous system (CNS) processing
    pass: 4
    hook: "الـ FGIDs خلطة من 5: «حركة، حساسية، مناعة، بكتيريا، ودماغ»: motility، visceral hypersensitivity، altered mucosal and immune function، altered gut microbiota، وaltered CNS processing."
    src: { page: 76, quote: "Motility disturbance Visceral hypersensitivity Altered mucosal and immune function Altered gut microbiota Altered central nervous system (CNS) processing." }
    status: unverified
    tags: [high-yield]
  - id: git.L03.005
    kind: card
    topic: concept
    front: Which body created the diagnostic criteria for FGIDs?
    back: The Rome Foundation (current criteria are Rome IV).
    src: { page: 76, quote: "The Rome Foundation has played a pivotal role in creating diagnostic criteria" }
    status: unverified
  - id: git.L03.006
    kind: cloze
    topic: concept
    text: "Rome IV builds on {{c1::Rome III}}, which was published in {{c2::2006}}."
    src: { page: 77, quote: "Rome IV is a compendium of the knowledge accumulated since Rome III was published 2006. It improves upon Rome III by:" }
    status: unverified
    tags: [numbers]
  - id: git.L03.007
    kind: enumerate
    topic: concept
    prompt: How does Rome IV improve on Rome III?
    points:
      - Updates the basic and clinical literature
      - New information on gut microenvironment, gut-brain interactions, pharmacogenomics, biopsychosocial, gender and cross-cultural aspects
      - Reduces imprecise and stigmatizing terms
      - Uses updated diagnostic algorithms
      - Incorporates the patient illness experience and physiological subgroups or biomarkers for targeted treatment
    pass: 4
    hook: "Rome IV أحسن في «5»: literature متحدّث، معلومات جديدة (microenvironment، gut-brain، pharmacogenomics، biopsychosocial، gender، cross-cultural)، كلمات stigmatizing أقل، algorithms جديدة، وتجربة المريض مع subgroups أو biomarkers للعلاج الموجه."
    src: { page: 77, quote: "Reduces the use of imprecise and occasionally stigmatizing terms when possible" }
    status: unverified
  - id: git.L03.008
    kind: card
    topic: concept
    front: "In the biopsychosocial model of FGIDs, which two systems are linked by the brain-gut axis?"
    back: The central nervous system (CNS) (brain) and the ENS (enteric nervous system of the gut).
    src: { page: 78, quote: "Fig 1. Biopsychosocial model of functional gastrointestinal disorders.\nEarly life, genetic and environmental factors: Social support, Parental beliefs and behaviours, Social learning, Abuse and trauma, Infection and antibiotics, Diet, Sex, Ethnicity and culture.\nBrain:\n  Psychological factors: anxiety, depression, somatisation, life stress, coping mechanisms.\n  CNS structure and function: structural brain abnormalities, visceral hypersensitivity, emotional arousal, conditioned responses, neurotransmitters.\nBrain-gut axis: Brain CNS, Gut ENS\nPhysiology: Motility, Sensation, Altered microbiota, Gut permeability, Secretion, Immune-cell infiltration.\nFGID presentation: Symptoms, Severity, Behaviour.\nOutcomes: Quality of life, Daily functioning, Primary/secondary care visits, Medications." }
    status: unverified
  - id: git.L03.009
    kind: enumerate
    topic: concept
    prompt: "In the biopsychosocial model, what outcomes does an FGID produce?"
    points: [Health care use, Daily function, Quality of life, Health care costs]
    pass: 3
    hook: "الـ FGID بيطلّع «مستشفى، يوم، حياة، وفلوس»: health care use، daily function، quality of life، وhealth care costs."
    src: { page: 77, quote: "Biopsychosocial Conceptual Model\nEarly Life:\n  Genetics\n  Culture\n  Environment: Trauma, Infection, Parental behaviors\nPsychosocial Factors:\n  Life stress\n  Personality traits\n  Psychologic state\n  Coping/cognitions\n  Social support\nBrain CNS <-> Gut ENS\nPhysiology:\n  Motility\n  Sensation\n  Immune dysfunction/inflammation\n  Altered microflora\n  Food/diet\nFGID Presentation:\n  Symptoms\n  Severity\n  Behaviors\nOutcome:\n  Health Care Use\n  Daily function\n  Quality of life\n  Health Care Costs" }
    status: unverified
  - id: git.L03.010
    kind: table
    topic: concept
    title: Major clinical domains in gastroenterology
    columns: [Feature, Organic GI disorder, Functional GI disorder]
    rows:
      - [Basis, "Organ morphology: pathology (disease)", "Illness experience: symptoms"]
      - [Assessed by, "Histology, endoscopy, radiology", "Motility, visceral sensitivity, symptom criteria (Rome), psychosocial"]
      - [Examples, "Esophagitis, peptic ulcer, IBD, colon cancer", "IBS, functional dyspepsia"]
    blanks: [[0, 2], [1, 1], [1, 2]]
    src: { page: 78, quote: "Table 1. Major Clinical Domains in Gastroenterology\n| | Organic GI disorder | Motility disorder | Functional GI disorder |\n|---|---|---|---|\n| Primary domain | Organ morphology | Organ function | Illness experience |\n| Criterion | Pathology (disease) | Altered motility | Symptoms |\n| Measurement | Histology, Pathology, Endoscopy, Radiology | Motility, Visceral sensitivity | Motility, Visceral sensitivity, Symptom criteria (Rome), Psychosocial |\n| Examples | Esophagitis, Peptic ulcer, IBD, Colon cancer | Diffuse esophageal spasm, Gastroparesis, Pseudo-obstruction, Colonic inertia | Esophageal chest pain, Functional dyspepsia, IBS, Functional constipation |" }
    status: unverified
  - id: git.L03.011
    kind: card
    topic: concept
    front: How are organic (structural) GI disorders classified, and what is the criterion for disease?
    back: By organ morphology; the criterion is pathology at a macro- or microscopic level (e.g., esophagitis, IBD).
    src: { page: 78, quote: "The Organic (structural) Disorders (e.g., esophagitis, inflammatory bowel disease) are classified in terms of organ morphology and the criterion for a disease is pathology at a macro- or microlevel." }
    status: unverified
  - id: git.L03.012
    kind: card
    topic: concept
    front: How is a motility disorder (e.g., gastroparesis, intestinal pseudo-obstruction) classified?
    back: By organ function, specifically altered motility; it is a persistent or recurrent dysmotility recognized as a clinical entity, variably associated with symptoms.
    src: { page: 78, quote: "A Motility Disorder (e.g., gastroparesis, intestinal pseudoobstruction), is classified in terms of organ function and specifically altered motility." }
    status: unverified
  - id: git.L03.013
    kind: card
    topic: concept
    front: Why is dysmotility alone not a reliable marker of disease?
    back: Dysmotility may come and go with repeated physiological testing.
    src: { page: 79, quote: "Dysmotility may come and go with repeated physiological testing." }
    status: unverified
  - id: git.L03.014
    kind: card
    topic: concept
    front: How is a functional GI disorder (e.g., IBS, functional dyspepsia) classified?
    back: Primarily by symptoms; it relates to the patient's interpretation and reporting of an illness experience.
    src: { page: 79, quote: "A Functional GI Disorder (e.g., IBS, functional dyspepsia) relates to the patient's interpretation and reporting of an illness experience, and it is classified primarily in terms of symptoms." }
    status: unverified
    tags: [high-yield]
  - id: git.L03.015
    kind: card
    topic: concept
    front: Define a symptom.
    back: A noticeable experiential change in the body reported by the patient as different from normal; it may or may not be interpreted as meaningful.
    src: { page: 79, quote: "A symptom is a noticeable experiential change in the body or its parts that is reported by the patient as being different from normal and may or may not be interpreted as meaningful." }
    status: unverified
    tags: [definition]
  - id: git.L03.016
    kind: card
    topic: concept
    front: Define a syndrome.
    back: The association of several clinically recognizable symptoms or signs that occur together to define a clinical entity.
    src: { page: 79, quote: "A syndrome relates to the association of several clinically recognizable symptoms or signs that occur together to define a clinical entity." }
    status: unverified
    tags: [definition]
  - id: git.L03.017
    kind: cloze
    topic: concept
    text: "A functional gastrointestinal (GI) disorder is a {{c1::syndrome}} based on symptoms that cluster together and are diagnosed by {{c2::Rome criteria}}."
    src: { page: 79, quote: "A functional GI disorder is a syndrome based on symptoms that cluster together and are diagnosed by Rome criteria." }
    status: unverified
    tags: [high-yield]
  - id: git.L03.018
    kind: mcq
    topic: concept
    stem: >-
      A resident says: "Gastroparesis and IBS are the same kind of disorder, since both cause bloating and pain."
      According to the lecture, what classifies gastroparesis differently from IBS?
    options:
      - Gastroparesis is classified by organ function (altered motility); IBS by symptoms
      - Gastroparesis is classified by histology; IBS by motility
      - Both are classified by Rome symptom criteria only
      - Gastroparesis is an organic disorder defined by macroscopic pathology
      - IBS is classified by organ morphology at endoscopy
    answer: 0
    why:
      - "Correct: a motility disorder is classified by organ function; a functional disorder by the patient's reported symptoms."
      - Histology defines organic disorders such as esophagitis, not motility disorders.
      - Rome symptom criteria define functional disorders, not motility disorders like gastroparesis.
      - Organic disorders (esophagitis, IBD) have macro- or microscopic pathology; gastroparesis is a motility disorder.
      - Irritable bowel syndrome (IBS) has no organ morphology abnormality; it is classified by symptoms.
    src: { page: 78, quote: "A Motility Disorder (e.g., gastroparesis, intestinal pseudoobstruction), is classified in terms of organ function and specifically altered motility." }
    status: unverified
  # ---------------------------------------------------------------- psychosocial
  - id: git.L03.019
    kind: card
    topic: psychosocial
    front: Are psychosocial factors required to diagnose an FGID?
    back: "No. But via the brain-gut axis they influence gastrointestinal (GI) physiology (motility, sensitivity, barrier function), modulate pain experience and symptom behavior, and affect treatment and outcome."
    src: { page: 79, quote: "Although psychosocial factors are not required for diagnosis, they influence physiological functioning of the GI tract via the brain–gut axis (motility, sensitivity, barrier function), are modulators of the patient's pain experience and symptom behavior, and, ultimately, affect treatment selection and the clinical outcome When evaluating for psychosocial factors, the clinician should consider four general observations: Psychological stress or one's emotional response to stress exacerbates gastrointestinal symptoms and may contribute to FGID development." }
    status: unverified
    tags: [high-yield]
  - id: git.L03.020
    kind: enumerate
    topic: psychosocial
    prompt: What four general observations should the clinician consider when evaluating psychosocial factors in FGIDs?
    points:
      - Psychological stress (or the emotional response to it) exacerbates GI symptoms and may contribute to FGID development
      - Psychosocial factors modify the illness experience and illness behaviors such as health care seeking
      - An FGID may have psychosocial consequences (on well-being, daily function, sense of control, QOL)
      - Psychosocial effects of illness (emotional distress, maladaptive cognitions) may feed back to perpetuate and amplify symptoms
    pass: 3
    hook: "الـ psychosocial في الـ FGIDs «4 اتجاهات»: الـ stress بيزوّد الأعراض وممكن يعمل المرض، بيغير تجربة المرض وسلوكه (زي الدوران على دكاترة)، المرض نفسه ليه نتايج نفسية (well-being، function، control، QOL)، والنفسي بيرجع يكبّر ويطوّل الأعراض."
    src: { page: 79, quote: "Although psychosocial factors are not required for diagnosis, they influence physiological functioning of the GI tract via the brain–gut axis (motility, sensitivity, barrier function), are modulators of the patient's pain experience and symptom behavior, and, ultimately, affect treatment selection and the clinical outcome When evaluating for psychosocial factors, the clinician should consider four general observations: Psychological stress or one's emotional response to stress exacerbates gastrointestinal symptoms and may contribute to FGID development." }
    status: unverified
    tags: [high-yield]
  - id: git.L03.021
    kind: card
    topic: psychosocial
    front: Give a common example of an FGID that develops after a stressful physical event.
    back: Postinfection irritable bowel syndrome (IBS) or postinfection dyspepsia.
    src: { page: 80, quote: "gastrointestinal disorders, a common example being postinfection IBS or dyspepsia." }
    status: unverified
  - id: git.L03.022
    kind: card
    topic: psychosocial
    front: What is the effect of the high association of psychosocial comorbidity, life stress and abuse in FGID patients?
    back: Poorer outcomes.
    src: { page: 80, quote: "There is a high association of psychosocial comorbidities, life stress, and abuse among patients with FGIDs, which lead to poorer outcomes." }
    status: unverified
  - id: git.L03.023
    kind: card
    topic: psychosocial
    front: Where is a history of psychosocial trauma (sexual or physical abuse) more common in FGID patients, and what does it do?
    back: More common in referral centers than in primary care; it may lower the pain threshold, increase symptom reporting and is linked to a poorer outcome.
    src: { page: 80, quote: "This explains why psychosocial trauma (e.g., sexual or physical abuse history) is more common in referral centers than in primary care, may decrease the pain threshold and symptom reporting, and is associated with a poorer clinical outcome." }
    status: unverified
  - id: git.L03.024
    kind: card
    topic: psychosocial
    front: What buffers the effect of psychosocial factors on the illness experience?
    back: Adaptive coping skills and social support (and the palliative response of family, society and culture).
    src: { page: 80, quote: "These factors can be reduced or buffered by adaptive coping skills and social support." }
    status: unverified
  - id: git.L03.025
    kind: card
    topic: psychosocial
    front: What happens to patients with severe FGID symptoms who catastrophize, and what do they need?
    back: "Morbid pessimism, helplessness and hypervigilance to symptoms cause visceral anxiety, lower sensation thresholds and poor self-efficacy. They need a behavioral intervention."
    src: { page: 81, quote: "In these cases, a behavioral intervention is needed to help reestablish a psychological substrate of improved health." }
    status: unverified
  - id: git.L03.026
    kind: mcq
    topic: psychosocial
    stem: >-
      A 30-year-old woman with long-standing IBS has become convinced her pain means cancer. She checks her abdomen
      many times a day and now reports pain with normal meals. Normal colonoscopy last year. Which step does the
      lecture recommend for this pattern?
    options:
      - A behavioral intervention
      - Repeat colonoscopy to reassure her
      - Long-term opioid analgesia
      - Empirical antibiotics for bacterial overgrowth
      - No action, since psychosocial factors are not part of the Rome criteria
    answer: 0
    why:
      - "Correct: catastrophizing and hypervigilance lower sensation thresholds; the book says a behavioral intervention is needed."
      - Repeating normal tests reinforces illness behavior and does not treat hypervigilance.
      - Opioids can cause narcotic bowel syndrome and worsen pain.
      - Nothing here suggests bacterial overgrowth.
      - Psychosocial factors are not needed for diagnosis, but they affect treatment and outcome.
    src: { page: 81, quote: "Patients with severe symptoms may develop a morbid pessimism and helplessness (i.e., catastrophize) and selectively attend to and be hypervigilant to their symptoms, leading to visceral anxiety, all of which decreases sensation thresholds and produces feelings of poor self-efficacy and self-esteem." }
    status: unverified
  # ---------------------------------------------------------------- physiology
  - id: git.L03.027
    kind: card
    topic: physiology
    front: Which symptoms can disturbed GI motility generate?
    back: Nausea, vomiting, diarrhea, acute abdominal pain, incontinence and others.
    src: { page: 81, quote: "1- Abnormal Motility Disturbed GI motility can generate symptoms of nausea, vomiting, diarrhea, acute abdominal pain, incontinence, and others." }
    status: unverified
  - id: git.L03.028
    kind: card
    topic: physiology
    front: Do motility changes explain chronic abdominal pain in FGIDs?
    back: No. Functional gastrointestinal disorder (FGID) patients have a greater motility response to stress, but motor responses only partly correlate with symptoms and do not explain chronic or recurrent pain.
    src: { page: 81, quote: "These motor responses only partially are correlated with symptoms, and are not sufficient to explain reports of chronic or recurrent abdominal pain." }
    status: unverified
  - id: git.L03.029
    kind: card
    topic: physiology
    front: What concept explains the poor link between pain and motility in many FGIDs?
    back: Visceral hypersensitivity.
    src: { page: 81, quote: "2- Visceral hypersensitivity The poor association of pain with GI motility with many functional GI disorders ( functional chest pain, functional dyspepsia–epigastric pain syndrome, IBS, and so forth) is explained by the concept of visceral hypersensitivity." }
    status: unverified
    tags: [high-yield]
  - id: git.L03.030
    kind: table
    topic: physiology
    title: Two faces of visceral hypersensitivity
    columns: [Term, Meaning]
    rows:
      - [Visceral hyperalgesia, Lower pain threshold to balloon distension of the bowel]
      - [Allodynia, Increased sensitivity even to normal intestinal function]
    blanks: [[0, 1], [1, 1]]
    src: { page: 81, quote: "These patients have a lower pain threshold with balloon distension of the bowel (visceral hyperalgesia), or they have increased sensitivity even to normal intestinal function (allodynia)." }
    status: unverified
    tags: [high-yield]
  - id: git.L03.031
    kind: card
    topic: physiology
    front: What happens with repetitive colonic balloon inflations in FGID patients compared with healthy subjects?
    back: Both show a progressive but transient rise in pain intensity; in functional gastrointestinal disorders (FGIDs) it lasts longer (sensitization).
    src: { page: 82, quote: "Visceral hypersensitivity may be amplified in patients with FGIDs: repetitive balloon inflations in the colon lead to progressive although transient increase in pain intensity in healthy subjects and for a longer period in patients with FGIDs." }
    status: unverified
  - id: git.L03.032
    kind: order
    topic: physiology
    prompt: Order the chain from altered barrier to visceral hypersensitivity (postinfection IBS model).
    steps:
      - Increased mucosal permeability (altered tight junctions)
      - More intraluminal antigens reach the submucosa
      - Low-grade mast cell activation and inflammatory cytokine release
      - Altered receptor sensitivity at the mucosa and myenteric plexus
      - Visceral hypersensitivity
    src: { page: 82, quote: "These actions alter receptor sensitivity at the gut mucosa and myenteric plexus, producing visceral hypersensitivity." }
    status: unverified
  - id: git.L03.033
    kind: enumerate
    topic: physiology
    prompt: Which factors contribute to the immune and barrier dysfunction of FGIDs?
    points: [Genetics, Psychological stress via mast cell activation, Altered receptor sensitivity at mucosa and myenteric plexus, Altered bacterial environment or outright infection]
    pass: 3
    hook: "الـ barrier بيبوظ بـ«جينات، توتر، receptors، وبكتيريا»: genetics، stress عن طريق mast cells، receptor sensitivity متغيرة في الـ mucosa والـ myenteric plexus، وبكتيريا متغيرة أو infection."
    src: { page: 82, quote: "Factors contributing to this occurrence include genetics, psychological stress via mast cell activation, and altered receptor sensitivity at the gut mucosa and myenteric plexus." }
    status: unverified
  - id: git.L03.034
    kind: cloze
    topic: physiology
    text: "Irritable bowel syndrome (IBS) patients show increased {{c1::Firmicutes}}, reduced Bacteroidetes and Bifidobacteria, and reduced fecal microbial {{c2::diversity}}."
    src: { page: 83, quote: "Differences among IBS patients in the bacterial composition of the gut (e.g., increased firmicutes and reduced Bacteroidetes and Bifdobacteria), and also reduced fecal microbial diversity relative to healthy individuals, have implied a causative role in the onset and maintenance of IBS.This is supported by the modest effect of probiotics and more substantive benefit of periodic antibiotic treatment in improving IBS symptoms." }
    status: unverified
  - id: git.L03.035
    kind: card
    topic: physiology
    front: What treatment evidence supports a causal role of the microbiome in IBS?
    back: A modest effect of probiotics and a more substantive benefit of periodic antibiotic treatment.
    src: { page: 83, quote: "Differences among IBS patients in the bacterial composition of the gut (e.g., increased firmicutes and reduced Bacteroidetes and Bifdobacteria), and also reduced fecal microbial diversity relative to healthy individuals, have implied a causative role in the onset and maintenance of IBS.This is supported by the modest effect of probiotics and more substantive benefit of periodic antibiotic treatment in improving IBS symptoms." }
    status: unverified
  - id: git.L03.036
    kind: card
    topic: physiology
    front: Why may a low-FODMAP or gluten-restricted diet help some FGID patients?
    back: Reduced osmotic effects or alterations in the gut mucosa. No one diet is of specific value; treatment must be individualized.
    src: { page: 83, quote: "Certain specific alterations in diet such as low fermentable oligo-, di-, and monosaccharides and polyols, or gluten restriction in some patients, may provide benefit as a result of reduced osmotic effects or alterations in gut mucosa." }
    status: unverified
  - id: git.L03.037
    kind: card
    topic: physiology
    front: How does diet link to IBS pathogenesis through the microbiota?
    back: Diet provides substrates for microbial fermentation; with an altered microbiota in irritable bowel syndrome (IBS), food, microbiota composition and fermentation products may drive symptoms.
    src: { page: 83, quote: "The diet provides substrates for microbial fermentation, and because the composition of the intestinal microbiota is altered in IBS, the link between food and diet, microbiota composition, and fermentation products may play an important role in IBS pathogenesis." }
    status: unverified
  - id: git.L03.038
    kind: card
    topic: physiology
    front: Define the brain-gut axis.
    back: The neuroanatomic substrate through which psychosocial factors influence the gastrointestinal (GI) tract and vice versa.
    src: { page: 83, quote: "The brain-gut axis is the neuroanatomic substrate in which the psychosocial factors influence the GI tract and vice versa." }
    status: unverified
    tags: [definition]
  - id: git.L03.039
    kind: card
    topic: physiology
    front: What do fear, anger, anxiety, pain and physical stress do to GI transit?
    back: They delay gastric emptying and intestinal transit, but stimulate colonic motor function (faster colonic transit, defecation, diarrhea).
    src: { page: 84, quote: "Thus, emotions such as fear, anger, anxiety, painful stimuli, and physical stress can delay gastric emptying and intestinal transit." }
    status: unverified
  - id: git.L03.040
    kind: card
    topic: physiology
    front: How does psychological stress cause pain and diarrhea as in IBS?
    back: It disrupts the gut pain threshold and impairs mucosal secretory and barrier functions, allowing transmigration of bacterial cell products.
    src: { page: 84, quote: "Psychological stress can disrupt the gut-pain threshold and impair mucosal secretory and barrier functions, and this is associated with transmigration of bacterial cell products leading to GI pain and diarrhea, as with IBS." }
    status: unverified
  - id: git.L03.041
    kind: card
    topic: physiology
    front: How can the gut affect the brain (the upward direction of the axis)?
    back: Enhanced motility, visceral inflammation and injury amplify ascending visceral pathways, causing more pain and contributing to anxiety and depression.
    src: { page: 84, quote: "Enhanced motility, visceral inflammation, and injury can amplify ascending visceral pathways and affect brain areas, leading to greater pain and contributing to altered mental functioning including anxiety and depression." }
    status: unverified
  - id: git.L03.042
    kind: card
    topic: physiology
    front: Which brain structure is dysfunctional in IBS and other functional pain, and what is its role?
    back: The anterior cingulate cortex, involved in the motivational and affective components of the emotional arousal and salience network.
    src: { page: 85, quote: "The anterior cingulate cortex, involved in the motivational and affective components of the emotional arousal and salience network, is dysfunctional with IBS and other functional GI pain, fibromyalgia, and other functional somatic symptoms." }
    status: unverified
  - id: git.L03.043
    kind: card
    topic: physiology
    front: Explain the gate control mechanism of pain in FGIDs.
    back: "The brain's pain control system filters incoming signals: up-regulation enhances pain, down-regulation blocks it. In functional gastrointestinal (GI) pain down-regulation works poorly, and psychosocial distress opens the gate, lowering the pain threshold."
    src: { page: 84, quote: "In effect, the brain's pain control system can act as a filter to enhance or block pain by up-regulating or down-regulating the incoming neural signals affecting symptom perception through this gate control mechanism." }
    status: unverified
    tags: [high-yield]
  - id: git.L03.044
    kind: enumerate
    topic: physiology
    prompt: Which factors can improve pain control by closing the gate?
    points: [Focused attention, Hypnosis, Psychological treatment, Certain antidepressants]
    pass: 3
    hook: "اقفل البوابة بـ«انتباه، تنويم، علاج نفسي، ودوا»: focused attention، hypnosis، psychological treatment، وantidepressants معينة."
    src: { page: 85, quote: "Conversely, improvement in pain control can be enabled by cognitive or emotional factors such as focused attention, hypnosis, psychological treatment, and certain antidepressants." }
    status: unverified
  - id: git.L03.045
    kind: card
    topic: physiology
    front: Why may psychological treatments and antidepressants have lasting effects in FGIDs?
    back: Growing evidence that they enhance neurogenesis, beyond their physiological effect.
    src: { page: 85, quote: "These effects may be more than physiological based on growing evidence for their role in enhancing neurogenesis as well, thus possibly contributing to more lasting effects for these treatments." }
    status: unverified
  - id: git.L03.046
    kind: mcq
    topic: physiology
    stem: >-
      Barostat studies in a 28-year-old woman with IBS show pain at a much lower rectal balloon volume than controls,
      and she reports pain with normal amounts of gas. Which mechanism best explains her symptoms?
    options:
      - Visceral hypersensitivity
      - Accelerated colonic transit
      - Bile acid malabsorption
      - Small bowel bacterial overgrowth
      - Delayed gastric emptying
    answer: 0
    why:
      - "Correct: a lower pain threshold to balloon distension is visceral hyperalgesia; pain with normal gas is allodynia."
      - Faster transit causes diarrhea but does not lower the distension threshold.
      - Bile acid malabsorption is not discussed as a functional gastrointestinal disorder (FGID) mechanism and does not explain a low balloon threshold.
      - Overgrowth may cause bloating, but the barostat finding points to sensory processing.
      - Delayed gastric emptying is a dyspepsia mechanism, not a rectal sensory one.
    src: { page: 81, quote: "These patients have a lower pain threshold with balloon distension of the bowel (visceral hyperalgesia), or they have increased sensitivity even to normal intestinal function (allodynia)." }
    status: unverified
  - id: git.L03.047
    kind: mcq
    topic: physiology
    stem: >-
      Six months after Campylobacter enteritis, a 25-year-old man has abdominal pain and loose stools. Which sequence
      does the lecture use to explain his symptoms?
    options:
      - Increased permeability, mast cell activation and cytokines, altered receptor sensitivity, visceral hypersensitivity
      - Persistent colonic ulceration with crypt abscesses
      - Villous atrophy from the infection
      - Loss of the anterior cingulate cortex
      - Fixed fibrotic stricture of the terminal ileum
    answer: 0
    why:
      - "Correct: the postinfection model runs from leaky tight junctions to low-grade mast cell activation to altered receptor sensitivity."
      - Ulceration and crypt abscesses are inflammatory bowel disease (IBD), an organic disease.
      - Villous atrophy suggests celiac disease or tropical sprue.
      - The ACC is dysfunctional in functional pain, not lost; and this is not the postinfection model.
      - A fibrotic stricture is structural (Crohn's), not functional.
    src: { page: 82, quote: "These associations increase the access of intraluminal antigens into the submucosa associated with low-grade activation of mast cells and increased inflammatory cytokine release." }
    status: unverified
  - id: git.L03.048
    kind: card
    topic: physiology
    front: "In sum, from which interacting systems does the FGID phenotype emerge?"
    back: "Peripheral systems (microbiome, mucosal inflammation, visceral hypersensitivity) and brain systems (emotional arousal, sensorimotor, central autonomic networks) interacting in both directions."
    src: { page: 85, quote: "In sum, the clinical phenotype that we understand as FGIDs emerges from the interactions of multiple systems in the periphery (microbiome, altered mucosal inflammation, visceral hypersensitivity) and in the brain (brain network systems of emotional arousal, sensorimotor function, central autonomic function) interacting with each other in bidirectional ways that lead to the FGID phenotype." }
    status: unverified
