              <text x="20" y="16" class="t-sm t-mut">R</text><text x="128" y="16" class="t-sm t-mut">L</text>
              <ellipse cx="60" cy="48" rx="30" ry="10" transform="rotate(45 60 48)" class="fg-dot-bad"/>
              <ellipse cx="94" cy="48" rx="30" ry="10" transform="rotate(-45 94 48)" class="fg-dot-bad"/>
              <ellipse cx="77" cy="70" rx="13" ry="12" class="fg-dot-bad"/>
              <text x="77" y="132" text-anchor="middle" class="t-sm t-b">4: both ducts</text>
            </g>
          </svg>
      - kind: aside
        tone: tip
        page: 323
        text: |
          إزاي ماتلخبطش 3a و 3b؟ احنا بنقول **«ادخل برجلك اليمين»**: اليمين الأول دايمًا.

          يبقى **a** (الأول) = **right**، و **b** (التاني) = **left**.
      - kind: match
        page: 323
        prompt: "وصّل كل Bismuth type بوصفه:"
        pairs:
          - ["Type 1", "Below the confluence of the right and left ducts"]
          - ["Type 2", "Reaches the confluence, sparing both hepatic ducts"]
          - ["Type 3a", "Common hepatic duct plus the right hepatic duct"]
          - ["Type 3b", "Common hepatic duct plus the left hepatic duct"]
          - ["Type 4", "Multicentric, or the confluence and both hepatic ducts"]
        why: "الكتاب صفحة 323. الـ 4 ليها طريقين: يا **multicentric** يا ماسكة الـ confluence **والقناتين**."
      - kind: explain
        page: 323
        title: "العيان بييجي بإيه؟"
        text: |
          - **Painless jaundice: 90%**. ده نجم العرض.
          - **Weight loss: 35%** و **abdominal pain: 35%**.
          - **Pruritus: 26%**.
          - **Fever + jaundice + RUQ pain** (triad الـ acute cholangitis): **10%**.
          - **Palpable gallbladder** و **hepatomegaly**: **rare**.
          - **Dark urine** و **pale stools**: uncommon، ولو فيه obstructive jaundice.
          - **Asymptomatic**: uncommon.

          والـ iCCA ممكن تتلقط **incidental** في الـ **surveillance imaging** لمرضى الـ cirrhosis: دراسة لقت **28%** من الـ iCCA و **4%** بس من الـ eCCA اتلقطوا صدفة.
      - kind: reveal
        page: 325
        prompt: "ليه الـ iCCA بتتلقط صدفة أكتر بكتير من الـ extrahepatic (28% مقابل 4%)؟"
        answer: |
          الكتاب بيقول إن الـ presentation بتعتمد على **مكان الورم** وعلى **وجود obstructive jaundice أو لأ**.

          الـ extrahepatic قاعدة على القناة الرئيسية، فبتقفلها بدري وتعمل **jaundice** واضح. أما الـ intrahepatic ففي قناة صغيرة جوه الكبد، فالـ bile بيلاقي طريق تاني ومفيش صفار، فتفضل ساكتة لحد ما **mass** تبان في الـ imaging. وعلشان كده الـ early tumours اللي لسه ماقفلتش القناة بتيجي بـ **vague abdominal pain** و **LFT abnormalities** بس.
      - kind: aside
        tone: exam
        page: 325
        text: |
          **Courvoisier's sign:** gallbladder **منفوخة وبتتحس** من غير وجع، مع obstructive jaundice. الكتاب بيقولها في **advanced distal extrahepatic** cholangiocarcinoma.

          المنطق: الورم تحت مدخل الـ cystic duct، فالـ bile بيرجع يملا المرارة. لو الورم فوق (hilar)، المرارة مش هتتملي.
      - kind: check
        page: 325
        question: "A 70-year-old has painless jaundice and a non-tender palpable gallbladder. Where is the cholangiocarcinoma most likely?"
        options:
          - "Distal extrahepatic bile duct"
          - "Hilar confluence (Bismuth type 2)"
          - "Peripheral intrahepatic duct"
          - "Left hepatic duct only"
        answer: 0
        why:
          - "صح: Courvoisier's sign في الكتاب بييجي مع **advanced distal extrahepatic** CCA، لأن الانسداد تحت الـ cystic duct فالمرارة بتتملي."
          - "الـ hilar بيقفل فوق الـ cystic duct، فالمرارة مش هتتنفخ."
          - "الـ intrahepatic غالبًا مش بتعمل obstructive jaundice كامل، وكتير بتتلقط صدفة."
