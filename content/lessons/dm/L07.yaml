        title: "الأدوية"
        quote: "pyridostigmine (inhibitor of acetylcholinesterase) improved symptoms and orthostatic BP, with only modest effects in supine BP"
        text: |
          - ==Pyridostigmine== (acetylcholinesterase inhibitor) بيقوّي الـ **ganglionic transmission**: الأعراض والـ **orthostatic BP** يتحسنوا، وتأثيره على الـ **supine BP** بسيط.
          - **Adrenergic blockers** للـ **tachycardia**.
          - **Anticholinergics** للـ **orthostatic bradycardia**.
      - kind: reveal
        page: 87
        quote: "pyridostigmine (inhibitor of acetylcholinesterase) improved symptoms and orthostatic BP, with only modest effects in supine BP"
        prompt: "ليه pyridostigmine ما بيعليش الضغط وهو نايم زي باقي أدوية الضغط؟"
        answer: |
          هو بيقوّي الإشارة في الـ **sympathetic ganglia** بس لما يكون فيه إشارة أصلًا. الإشارة دي بتطلع **لما يقف** (الـ baroreflex بيشتغل)، فالتقوية بتحصل وقت الوقوف.

          وهو نايم مفيش طلب، فمفيش تقوية، فالـ **supine hypertension** بتبقى بسيطة. (تفسير فسيولوجي.)
