            <text x="165" y="328" text-anchor="middle" class="t-sm">inflammation, erosions, new bone</text>
          </svg>
      - kind: reveal
        page: 339
        quote: "Tofacitinib & upadacitinib are also able to interfere in the inflammatory cascade of IL-17, IL-21, and IL-23."
        prompt: "الـ apremilast والـ JAK inhibitors الاتنين oral. إيه الفرق بينهم وبين الـ biologics في طريقة الشغل؟"
        answer: |
          الـ **biologics** (TNF-i، ustekinumab، secukinumab) antibodies بتمسك ==cytokine واحد برّه الخلية==.

          الاتنين التانيين **small molecules** بيشتغلوا **جوه الخلية**:
          - **Apremilast:** oral **phosphodiesterase-4 inhibitor**، specific للـ **cAMP**، فبيعلّي الـ cAMP جوه الخلية.
          - **Tofacitinib و upadacitinib:** بيدخلوا في الـ cascade بتاع **IL-17 و IL-21 و IL-23** مرة واحدة.

          التفسير المقبول (مش في الكتاب): الـ cAMP العالي بيقلل إنتاج الـ pro-inflammatory cytokines، وعلشان الـ JAK في طريق إشارة cytokines كتير، دوا واحد بيأثر على أكتر من cytokine. وده سبب إنهم oral ومش محتاجين حقن.
      - kind: try
        items: [rheum.L20.063, rheum.L20.064, rheum.L20.066, rheum.L20.068, rheum.L20.070]
    recap:
      - "NSAIDs للـ mild؛ MTX drug of choice للجلد والمفاصل."
      - "Antimalarials ممكن تزوّد الصدفية؛ steroids: taper بالراحة، ومفيش IA من plaque."
      - "TNF-i: arthritis، dactylitis، enthesitis، spondylitis، skin. Ustekinumab IL-12/23، secukinumab IL-17A."
      - "Apremilast oral PDE-4 ← cAMP؛ JAK (tofacitinib، upadacitinib) على IL-17، IL-21، IL-23."
