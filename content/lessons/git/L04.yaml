          - "صح: type I أو II أقل من 1 cm أو أقل من 3-5 lesions: endoscopic resection ومتابعة كل 6 شهور."
          - "ده للـ type III حسب الحجم."
          - "لازم surveillance."
          - "مبالغة لـ type I صغير."
      - kind: explain
        page: 168
        quote: "Type III disease should be considered for en bloc resection with"
        title: "Type III: عملية كبيرة، بس بتفكير"
        text: |
          الكتاب: الـ **type III** يتفكر له في ==en bloc resection with lymphadenectomy== حسب حجم الورم، بس **الـ high incidence of hepatic metastasis** لازم تهدّي القرار ده. والـ 5-year survival: type I أو II **60% و 75%**، و type III **أقل من 50%**.

          التفسير المقبول (مش في الكتاب): ليه type III مختلف؟ type I و II بيكبروا بسبب **gastrin عالي** بيزق الـ ECL cells (يعني السبب برّه الورم)، فبيطلعوا كتير وصغيرين وهاديين. type III **sporadic** بالـ gastrin طبيعي، يعني الورم نفسه هو اللي ماشي لوحده، فبيبقى أعدى وبينتشر. والجملة «tamper this decision» معناها: لو الكبد فيه انتشار، العملية الكبيرة مش هتشفي، فتراجع قبل ما تعرّض المريض ليها.
