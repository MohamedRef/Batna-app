            <text x="295" y="30" text-anchor="middle" class="t-sm t-b">7</text>
            <text x="10" y="70" class="t-sm">Ara-C</text>
            <rect x="70" y="52" width="245" height="28" rx="8" class="fg-acc"/>
            <text x="192" y="71" text-anchor="middle" class="t-sm">100 mg/m2/day IV infusion</text>
