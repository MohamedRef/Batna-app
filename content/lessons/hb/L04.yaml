        quote: "two or more of the following criteria: (Seattle or Baltimore criteria) weight gain, ascites, tender hepatomegaly and jaundice within 20 days after BMT."
        title: "SOS: الساعة بعد الـ transplant"
        alt: "A vertical timeline. Conditioning with busulfan, cyclophosphamide, melphalan or total-body irradiation. Day 0: HSCT or BMT. Days 0 to 20: two or more of weight gain, ascites, jaundice and tender hepatomegaly means consider SOS. Then exclude mimics: GvHD, infection, sepsis with cholestasis, DILI, cardiac disease, renal failure. If still unclear: transjugular liver biopsy. Prevention: defibrotide in HSCT."
        caption: "الـ SOS بيتشخص بالشك والاستبعاد: **WAJH** في أول 20 يوم، بعدها استبعد اللي بيقلّده، والـ biopsy تبقى **transjugular**. والوقاية بالـ ==defibrotide==."
        svg: |
