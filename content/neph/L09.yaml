  - id: neph.L09.039
    kind: card
    topic: transport
    front: Define ultrafiltration in dialysis.
    back: Transport of plasma water (free of cells and colloids) across a semipermeable membrane, driven by the pressure gradient (transmembrane pressure) between blood and dialysate compartments.
    src: { page: 298, quote: "Ultrafiltration describes the transport of plasma water (solvent free of cells and colloids) through a semipermeable membrane, driven by a pressure gradient between blood and dialysate/ultrafiltrate compartments. is influenced by the intrinsic properties of the filter and the pressure gradient across the membrane (e.g., transembrane pressure TMP).(in clinical dialysis solvent is plasma water) The membrane ultrafiltration coefficient (KUF) in ml/h/mmHg(pressure gradient across the membrane )/m2) represents the water permeability of the filter membrane per unit of pressure and surface." }
    status: unverified
  - id: neph.L09.040
    kind: card
    topic: transport
    front: What are KUF and DKUF?
    back: KUF is the membrane water permeability per unit pressure and surface (mL/h/mmHg/m²); DKUF is KUF × membrane surface area of the filter (mL/h/mmHg).
    src: { page: 298, quote: "Filter/dialyser ultrafiltration coefficient (DKUF) is defined as the product of the KUF and membrane surface area of filter: ml/h/mmHg Dalton A unit of mass used to express atomic and molecular masses. It is the approximate mass of a hydrogen atom, a proton, or a neutron. Small solutes MW <500 D: sodium, phosphorus, potassium, urea(60) ,creatinine(113), uric acid (186),glucose (180)." }
