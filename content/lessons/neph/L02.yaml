      - kind: explain
        page: 64
        quote: "Consider planning for preemptive kidney transplantation and/or dialysis"
        title: "ليه الغسيل مش برقم، والتجهيز بدري؟"
        text: |
          الكتاب: قرار بدء الغسيل **composite** (الأعراض، جودة الحياة، رأي المريض، الـ GFR، التحاليل)، والـ indications غالبًا بتظهر عند GFR 5–10. والتخطيط للـ **pre-emptive transplant** أو الـ **dialysis access** يبدأ عند ==GFR < 20== أو KRT risk > 40% في سنتين.

          التفسير المقبول (مش في الكتاب):

          - الغسيل مش علاج للرقم، ده علاج للمريض. واحد GFR 8 ومرتاح ممكن يستنى، وواحد GFR 12 بـ pericarditis لازم يبدأ النهارده.
