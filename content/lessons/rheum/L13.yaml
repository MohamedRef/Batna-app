  - id: rheum.L13.lesson3
    title: "الـ Capillaroscopy: الضافر بيحكي عن الرئة"
    hook: "عدسة على جلد الضافر ممكن تقولك إن الرئة والقلب في خطر قبل ما المريض يحس بحاجة."
    minutes: 9
    pages: [215, 220]
    topics: [nfc, patterns, nfc-practice]
    goals:
      - "تعرف ليه وإزاي بنعمل capillaroscopy"
      - "تفرّق الـ normal والـ early والـ active والـ late patterns"
      - "تعرف إيه اللي بيرتبط بيه وصورته في الأمراض التانية"
    status: unverified
    steps:
      - kind: explain
        page: 215
        quote: "Nailfold capillaroscopy (NFC) is a non-invasive technique that visualizes the capillaries at the nailfold to assess microvascular involvement."
        title: "يعني إيه capillaroscopy؟"
        text: |
          ==Nailfold capillaroscopy (NFC)==: طريقة non-invasive بتشوف الـ capillaries عند الـ nailfold عشان تقيّم الـ microvascular involvement.

          بنعملها عشان:

          - تلقط **early microangiopathy** في الـ SSc والـ CTDs التانية.
          - تفرّق **primary من secondary Raynaud's**.
          - تتنبأ بالـ **internal organ involvement** في الـ SSc.
      - kind: explain
        page: 215
        quote: "Acclimatize patient to room temperature (20–22°C) for 15–20 minutes."
        title: "الـ Technique"
        text: |
          - **المكان**: nailfold صوابع **2 لـ 5**، والإبهام غالبًا بيتشال.
          - **الأجهزة**: dermatoscope، videocapillaroscope، أو ophthalmoscope، مع ==immersion oil== أو gel.
          - **التحضير**: المريض يقعد في أوضة **20–22 درجة** لمدة **15–20 دقيقة**، ومن غير caffeine أو سجاير أو برد قبلها.
      - kind: reveal
        page: 215
        quote: "Avoid caffeine, smoking, or cold exposure before the exam."
        prompt: "ليه نمنع السجاير والقهوة والبرد قبل الفحص؟"
        answer: "الـ caffeine والـ smoking والـ cold exposure التلاتة بيعملوا vasoconstriction في الأوعية الصغيرة، فالـ capillaries تبان أقل أو مقفولة ونقول dropout وهو مش موجود (false finding). والـ oil بيخلي الجلد شفاف فنشوف أوضح."
      - kind: figure
        page: 216
        quote: "Late pattern: Severe capillary loss, disorganized architecture, ramified capillaries."
        title: "من الطبيعي للـ late"
        alt: "Four panels stacked. Normal: a neat row of identical hairpin loops. Early: mostly normal loops with one or two enlarged loops and a small haemorrhage. Active: several giant loops, haemorrhage dots and a gap where loops are lost. Late: few loops left, wide empty avascular gaps and bushy branched capillaries."
        caption: "الصف بيبوظ تدريجيًا: loops أكبر، بعدين giant و نزيف، وفي الآخر فراغات و ramified capillaries."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <text x="5" y="18" class="t-sm t-b">Normal</text>
            <path d="M30 70V35a6 6 0 0 1 12 0V70M70 70V35a6 6 0 0 1 12 0V70M110 70V35a6 6 0 0 1 12 0V70M150 70V35a6 6 0 0 1 12 0V70M190 70V35a6 6 0 0 1 12 0V70M230 70V35a6 6 0 0 1 12 0V70M270 70V35a6 6 0 0 1 12 0V70" class="fg-ink"/>
            <text x="5" y="98" class="t-sm t-b">Early</text>
            <path d="M30 150V115a6 6 0 0 1 12 0V150M70 150V115a6 6 0 0 1 12 0V150M150 150V115a6 6 0 0 1 12 0V150M190 150V115a6 6 0 0 1 12 0V150M270 150V115a6 6 0 0 1 12 0V150" class="fg-ink"/>
            <path d="M105 150V112a12 12 0 0 1 24 0V150M225 150V112a12 12 0 0 1 24 0V150" class="fg-arrow-acc"/>
            <circle cx="168" cy="108" r="3" class="fg-dot-bad"/>
            <text x="5" y="178" class="t-sm t-b">Active</text>
            <path d="M30 230V195a6 6 0 0 1 12 0V230M260 230V195a6 6 0 0 1 12 0V230" class="fg-ink"/>
            <path d="M60 230V192a22 22 0 0 1 44 0V230M165 230V192a22 22 0 0 1 44 0V230" class="fg-arrow-acc"/>
            <circle cx="125" cy="190" r="4" class="fg-dot-bad"/>
            <circle cx="140" cy="200" r="4" class="fg-dot-bad"/>
            <circle cx="230" cy="186" r="4" class="fg-dot-bad"/>
            <text x="5" y="258" class="t-sm t-b">Late</text>
            <path d="M40 315V285M40 295L28 275M40 290L52 272M40 285L40 270" class="fg-arrow-bad"/>
            <path d="M210 315V285M210 295L198 275M210 290L222 272M210 285L210 270" class="fg-arrow-bad"/>
            <text x="85" y="300" class="t-sm t-mut">avascular</text>
            <text x="250" y="300" class="t-sm t-mut">loss</text>
          </svg>
      - kind: table
        page: 216
        quote: "Active pattern: Frequent giant capillaries and hemorrhages, moderate capillary loss."
        title: "الـ Scleroderma patterns"
        columns: ["Pattern", "Features"]
        rows:
          - ["Normal", "Uniform hairpin loops, evenly spaced, no bleeds"]
          - ["Early", "Few enlarged loops, few bleeds, architecture preserved"]
          - ["Active", "Frequent giant loops and bleeds, moderate loss"]
          - ["Late", "Severe loss, disorganized, ramified loops"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: mnemonic
        page: 216
        quote: "Late pattern: Severe capillary loss, disorganized architecture, ramified capillaries."
        word: "EAL"
        parts:
          - { key: "E", text: "Early: Enlarged loops, few, architecture kept" }
          - { key: "A", text: "Active: giAnt loops And bleeds, moderate loss" }
          - { key: "L", text: "Late: Loss, disorganized, ramified" }
        hook: |
          **E → A → L**: Enlarged، بعدين giAnt، بعدين Loss. كل ما تمشي في الحروف، الصف بيبوظ أكتر.
      - kind: explain
        page: 216
        quote: "Specific ―scleroderma pattern‖ is part of the 2013 ACR/EULAR classification criteria."
        title: "في الـ SSc والأمراض التانية"
        text: |
          الـ ==scleroderma pattern== جزء من **2013 ACR/EULAR classification criteria** للـ SSc، وبيرتبط بـ:

          - **Pulmonary arterial hypertension**.
          - **Interstitial lung disease**.
          - **Digital ulcers**.

          في الأمراض التانية:

          - **Dermatomyositis**: dropout، dilated loops، haemorrhages.
          - **SLE**: non-specific.
          - **Primary Raynaud's**: normal أو minimally altered.

          وأهم استخدام: early diagnosis في **ANA-positive** عنده Raynaud's.
      - kind: sort
        page: 216
        quote: "Dermatomyositis: Capillary dropout, dilated loops, hemorrhages. SLE: Non-specific changes. Primary Raynaud‘s: Normal or minimally altered pattern."
        prompt: "الـ finding ده يميل لأنهي ناحية؟"
        bins: ["Primary Raynaud's", "SSc or dermatomyositis"]
        cards:
          - { text: "Uniform hairpin loops", bin: 0 }
          - { text: "Minimally altered pattern", bin: 0 }
          - { text: "Giant capillaries", bin: 1 }
          - { text: "Capillary dropout", bin: 1 }
          - { text: "Haemorrhages with dilated loops", bin: 1 }
          - { text: "Ramified capillaries with avascular areas", bin: 1 }
        why: "الـ primary Raynaud's بيبقى normal أو قريب منه. الـ giant loops والـ dropout والنزيف والـ ramification بتاعة الـ SSc (والـ dermatomyositis فيه dropout و dilated loops ونزيف)."
      - kind: table
        page: 216
        quote: "Target Joints, tendons, entheses Nailfold capillaries"
