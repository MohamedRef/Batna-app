    status: unverified
  # ---------- p169-176: tuberous sclerosis ----------
  - id: neph.L07.121
    kind: card
    topic: tsc
    front: Define tuberous sclerosis complex (TSC).
    back: An autosomal dominant tumor-suppressor gene syndrome in which hamartomas develop in many organs, including kidneys, brain, heart, lungs and skin.
    src: { page: 169, quote: "Definition TSC is an autosomal dominant, tumor-suppressor gene syndrome in which benign focal malformations, called hamartomas, develop in mul-tiple organ systems, including the kidneys, brain, heart, lungs, and skin." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.122
    kind: table
    topic: tsc
    title: TSC genes
    columns: [Gene, Chromosome, Note]
    rows:
      - [TSC1, 9q32–q34, "Milder disease; 1:1 with TSC2 in familial cases"]
      - [TSC2, 16p13 (next to PKD1), "About 5 times commoner in sporadic cases; more severe"]
    blanks: [[0, 1], [1, 1], [1, 2]]
    src: { page: 169, quote: "TSC results from inactivating mutations in one of two genes, TSC1 on chromosome 9q32-q34 and TSC2 on chromosome 16p13, adjacent to the PKD1 gene. Large deletions involving both PKD1 and TSC2 results in the PKD1/TSC2 (infantile severe polycystic kidney disease with tuber-ous sclerosis [PKDTS]) contiguous gene deletion syndrome. as tumor suppressor genes." }
    status: unverified
    tags: [high-yield]
