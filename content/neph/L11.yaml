  # ---------- p387-390: contraception after transplant ----------
  - id: neph.L11.178
    kind: card
    topic: tx-contraception
    front: What are the pros and cons of barrier contraception after transplant?
    back: Safe, easy and free of drug interactions, but efficacy depends on compliance; cervical caps doubled UTI in graft recipients.
    src: { page: 387, quote: "It involves the use of barrier techniques, such as condoms, diaphragms, spermicides, sponges, and cervical caps. Though they are safe for transplant recipients, convenient, and easy to use, with no concerns regarding interaction with immunosuppressants, their efficacy depends on user compliance which is difficult to achieve in most cases. Moreover, cervical caps were associated with a twofold increase in urinary tract infections in graft recipients. (99,100) However, intrauterine devices, both copper and levonorgestrel, represent a safer and more effective choice for kidney transplant women with no immunosuppression drug interaction concerns. Besides, it is reversible after intrauterine device removal and with no added risk of developing pelvic infections. (99) (2) Pharmacological contraception:" }
    status: unverified
  - id: neph.L11.179
    kind: card
    topic: tx-contraception
    front: Why are IUDs a good choice after kidney transplant?
    back: Copper and levonorgestrel IUDs are safe, effective, reversible, have no interaction with immunosuppressants and no added pelvic infection risk.
    src: { page: 387, quote: "It involves the use of barrier techniques, such as condoms, diaphragms, spermicides, sponges, and cervical caps. Though they are safe for transplant recipients, convenient, and easy to use, with no concerns regarding interaction with immunosuppressants, their efficacy depends on user compliance which is difficult to achieve in most cases. Moreover, cervical caps were associated with a twofold increase in urinary tract infections in graft recipients. (99,100) However, intrauterine devices, both copper and levonorgestrel, represent a safer and more effective choice for kidney transplant women with no immunosuppression drug interaction concerns. Besides, it is reversible after intrauterine device removal and with no added risk of developing pelvic infections. (99) (2) Pharmacological contraception:" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.180
    kind: card
    topic: tx-contraception
    front: Why must combined hormonal contraceptives be watched in transplant recipients on CNIs?
    back: They are metabolized by CYP3A4, the same pathway as calcineurin inhibitors, and they can cause hypertension, migraine and thromboembolism.
    src: { page: 387, quote: "(a) Combined hormonal contraceptives: low-dose estrogen–progesterone preparations are commonly used and are highly effective with a minimal failure rate. They are available in an oral formulation, a transdermal patch, or a vaginal ring. Any of these formulations might be used in kidney transplant recipients. However, because of the possibility of causing hypertension, exacerbated migraines, or thromboembolism, they should be used with caution. As combined hormone contraceptives are metabolized primarily by cytochrome P 450 3A4, careful attention to their interactions with calcineurin inhibitors (CNI) should be paid. These formulations are described by the authors(101-103)" }
    status: unverified
  - id: neph.L11.181
    kind: card
    topic: tx-contraception
    front: Why might a patch or vaginal ring interact less with CNIs than the combined pill?
    back: They skip first-pass liver metabolism, so they interfere less with CYP3A4.
    src: { page: 388, quote: "Evidence indicates that the combined hormonal patch and the combined vaginal ring provide safety and pharmacokinetic profiles comparable to combined oral contraceptives, with similar hormone formulations. However, a potentially favorable aspect is the fact that transdermal and vaginal preparations do not undergo first-pass liver metabolism; therefore, they have a lower risk of potentially dangerous pharmacologic interferences involving the cytochrome P 450 3A4. This is particularly important in the case of CNIs, metabolized by the same pathway. (103) Combined oral contraceptive and progestin-only contraceptives have an inhibitory effect on P 450 3A4, thus increasing the concentration of CNI (particularly cyclosporine). However, CNIs (in particular tacrolimus) have an inductive effect on P 450 3A4, potentially reducing the contraceptive efficacy.(101)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.182
    kind: card
    topic: tx-contraception
    front: What is the two-way interaction between hormonal contraceptives and CNIs?
    back: Combined and progestin-only pills inhibit CYP3A4 and raise CNI (especially cyclosporine) levels; CNIs (especially tacrolimus) induce CYP3A4 and may lower contraceptive efficacy.
    src: { page: 388, quote: "Evidence indicates that the combined hormonal patch and the combined vaginal ring provide safety and pharmacokinetic profiles comparable to combined oral contraceptives, with similar hormone formulations. However, a potentially favorable aspect is the fact that transdermal and vaginal preparations do not undergo first-pass liver metabolism; therefore, they have a lower risk of potentially dangerous pharmacologic interferences involving the cytochrome P 450 3A4. This is particularly important in the case of CNIs, metabolized by the same pathway. (103) Combined oral contraceptive and progestin-only contraceptives have an inhibitory effect on P 450 3A4, thus increasing the concentration of CNI (particularly cyclosporine). However, CNIs (in particular tacrolimus) have an inductive effect on P 450 3A4, potentially reducing the contraceptive efficacy.(101)" }
    status: unverified
