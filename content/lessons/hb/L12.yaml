    steps:
      - kind: explain
        page: 201
        title: "إيه الـ AATD؟"
        text: |
          **Genetic disorder** بسبب mutations في **SERPINA1 gene**، فبيبقى فيه **low levels of alpha-1 antitrypsin (AAT)**.

          الـ AAT **protective enzyme** بيتعمل **أساسًا في الكبد**، وبيحمي الأنسجة، **خصوصًا الرئة**، من الـ **enzymes released by inflammatory cells**.

          يعني المصنع في الكبد، والزبون الأساسي الرئة.
