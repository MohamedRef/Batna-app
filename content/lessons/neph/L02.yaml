  - id: neph.L02.lesson4
    title: "الضغط والـ RAASi"
    hook: "هدف ضغط واطي، ودوا بيفتح الـ efferent. والإيقاف دايمًا آخر حل."
    minutes: 10
    pages: [45, 48]
    topics: [bp, raasi]
    goals:
      - "تعرف هدف الضغط في الـ CKD وليه، وإمتى تخففه"
      - "تعرف مين ياخد RAASi وليه أقوى مع الـ albuminuria"
      - "تتعامل مع الـ creatinine والـ K بعد ما تبدأ"
    status: unverified
    steps:
      - kind: explain
        page: 45
        quote: "Fasting in Ramadan Risk Table and Recommendations Summary 3.4. Blood pressure control Target systolic blood pressure (SBP) of <120 mm Hg, when tolerated, using standardized office BP measurement."
        title: "هدف الضغط"
        text: |
          Kidney Disease: Improving Global Outcomes (KDIGO): ==systolic blood pressure (SBP) < 120 mmHg== لو المريض مستحمل، بقياس **standardized office BP**.

          وخفف الهدف في: **frailty**، خطر **وقوع**، **life expectancy** قصير، أو **postural hypotension** بأعراض.

          الـ European Society of Hypertension (ESH) 2023 (الـ general population): < 130/80 من 18–64 سنة، و< 140/80 من 65–79.

          التفسير المقبول (مش في الكتاب): الهدف بيتخفف في الحالات دي **لأن** الضغط الواطي ممكن يوقّع المريض أو يعمل دوخة، والفايدة محتاجة سنين.
      - kind: explain
        page: 45
        quote: "using standardized office BP measurement."
        title: "ليه < 120 وليه standardized؟"
        text: |
          الكتاب: **SBP < 120 mmHg** لو المريض مستحمل، بقياس **standardized office BP**، ونفس هدف KDIGO 2021.

          التفسير المقبول (مش في الكتاب):

          - مريض الـ CKD بيموت بالقلب أكتر ما بيموت بالكلى، والضغط الأقل بيقلّل الـ stroke والـ heart failure.
          - الضغط العالي بيوصل للـ glomerulus اللي أصلًا تحت hyperfiltration.
          - الـ ==standardized== measurement (قعدة هادية، دقايق راحة، كذا قراية) هو اللي الدراسات استخدمته. القياس العادي في العيادة بيطلع **أعلى**، فلو هدفت 120 بقياس عادي، هتنزّل الضغط الحقيقي أوطى من اللازم.

          **يعني** الرقم 120 ميتقارنش برقم عيادة عادي: لو قسته وانت مستعجل هيطلع أعلى، وهتزوّد دوا مش محتاجه.
      - kind: explain
        page: 46
        quote: "Less intensive BP -lowering therapy in people with frailty, high risk of"
        title: "ليه أقل تشدد في الـ frail؟"
        text: |
          الكتاب بيخفّف الهدف في: **frailty**، **high risk of falls**، **very limited life expectancy**، و **symptomatic postural hypotension**.

          التفسير المقبول (مش في الكتاب): الفايدة من الضغط الواطي بتيجي **بعد سنين**، والضرر (دوخة، وقعة، كسر في الحوض، AKI من قلة الدم الواصل للكلية) بييجي **بكرة**. في مريض عمره المتوقع قصير أو بيقع، الضرر بيسبق الفايدة.

          وجدول الـ **ESH 2023** في نفس الصفحة للـ general population: ==< 130/80== من 18 لـ 64 سنة، و ==< 140/80== من 65 لـ 79 (و 130/80 لو مستحمل).

          **يعني** في الـ frail الهدف الأقل تشدد مش تقصير، ده **عشان** نحمي المريض من ضرر قريب.
