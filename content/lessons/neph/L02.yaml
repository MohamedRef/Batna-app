        title: "الهدف: مش الكلى بس"
        text: |
          الكتاب بيقول إن علاج الـ CKD **comprehensive treatment strategy** هدفها تقلّل خطر الـ **progression** وخطر **المضاعفات** مع بعض. و Figure 46 بتوري الـ **optimal care model** حسب شدة الـ CKD: من primary care في الأول، لحد nephrology و kidney replacement therapy (KRT) في الآخر.

          التفسير المقبول (مش في الكتاب): لأن المريض ممكن يموت بالقلب قبل ما الكلية تفشل، فعلاج الكلية لوحدها مش كفاية. الـ care بيكبر مع الـ stage: كل ما الـ GFR ينزل، مضاعفات أكتر محتاجة متابعة، وناس أكتر في الفريق.
