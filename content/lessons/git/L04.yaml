  - id: git.L04.lesson4
    title: "تشخيص سرطان المعدة و staging"
    hook: "عقدة فوق الترقوة الشمال، وكتلة في السرة. وبعدين: CT ولا EUS الأول؟ والـ PET فين؟"
    minutes: 9
    pages: [158, 161]
    topics: [gastric-dx]
    goals:
      - "تعرف الأعراض والعلامات وليه المريض بييجي متأخر"
      - "تعرف الـ EGD والـ barium والـ markers وحدود كل واحد"
      - "ترتّب الـ staging: CT، بعدين EUS، والـ PET دوره إيه"
    status: unverified
    steps:
      - kind: explain
        remind: [git.L04.092]
        page: 158
        quote: "Most patients present with advanced stage.. why? They are often asymptomatic in early stages."
        title: "بيجيلك بإيه؟"
        text: |
          أغلبهم **advanced stage** لأنهم **asymptomatic** في الأول.

          - Symptoms: epigastric pain، bloating، **early satiety**، nausea و vomiting، dysphagia، anorexia، **weight loss**، upper GI bleeding.
          - Signs: anemia، cachexia، epigastric mass، hepatomegaly، ascites، jaundice، والعلامات اللي ليها أسامي.

          التفسير المقبول (مش في الكتاب): ليه الـ dysphagia والترجيع آخر حاجة؟ لأنهم بيحصلوا بس لما الورم يسد مدخل المعدة (الـ cardia) أو مخرجها (الـ pylorus)، والورم في نص المعدة الواسعة ممكن يكبر كتير قبل ما يسد حاجة.
      - kind: reveal
        page: 158
        quote: "Most patients present with advanced stage.. why? They are often"
        prompt: "الكتاب نفسه بيسأل: ليه أغلب المرضى بييجوا advanced؟"
        answer: |
          الكتاب: لأنهم غالبًا ==asymptomatic in early stages==.

          التفسير المقبول (مش في الكتاب): الأعراض اللي في القايمة (epigastric pain، bloating، early satiety) هي نفس أعراض الـ dyspepsia اللي عند ناس كتير، فلا المريض ولا الدكتور بيقلق في الأول. والأعراض «الواضحة» زي الـ dysphagia والترجيع (اللي الكتاب معلّم عليهم بنجمة) بتيجي لما الورم يسد الـ cardia أو الـ pylorus، يعني بعد ما يكبر. والـ **early satiety** بالذات مهمة: المعدة اللي حيطتها ناشفة (linitis) ما بتتمددش، فالمريض بيشبع بلقمتين.
      - kind: match
        page: 158
        quote: "Epigastric pain Bloating early satiety nausea & vomiting* dysphagia* anorexia weight loss upper GI bleeding (hematemesis, melena, iron deficiency anemia) -Anemia. -Wt.loss ( cachexia) -Epigastric mass,Hepatomegaly,Ascitis -Jaundice. -Blumers shelf -Virchows node -Sister mary joseph node -Krukenberg tumor -Irish node"
        prompt: "وصّل كل علامة بمكانها:"
        pairs:
          - ["Virchow's node", "Left supraclavicular node"]
          - ["Sister Mary Joseph node", "Umbilicus"]
          - ["Blumer's shelf", "Rectal shelf (felt on PR)"]
          - ["Krukenberg tumor", "Ovary"]
          - ["Irish node", "Left axilla"]
        why: "الأسامي في الكتاب في صفحة 158، والأماكن دي معروفة في الـ clinical exam (الكتاب ذكر الأسامي بس)."
      - kind: explain
        page: 158
        quote: "mary joseph node -Krukenberg tumor -Irish node"
        title: "العلامات اللي ليها أسامي معناها إيه؟"
        text: |
          الكتاب بيعدّ الـ signs: anemia، weight loss (cachexia)، **epigastric mass**، **hepatomegaly**، **ascites**، **jaundice**، وبعدين ==Blumer's shelf، Virchow's node، Sister Mary Joseph node، Krukenberg tumor، Irish node==.

          التفسير المقبول (مش في الكتاب): كل العلامات اللي ليها أسامي معناها حاجة واحدة: الورم **خرج من المعدة**. الـ Virchow's وصل بالـ lymphatics لحد الـ thoracic duct، والـ Krukenberg والـ Blumer's وقعوا خلايا في الـ peritoneum ونزلوا بالجاذبية للحوض، والـ Sister Mary Joseph ماشي على الـ peritoneum للسرة. يعني لو لقيت واحدة منهم، المريض غالبًا **stage IV** والعلاج palliative. وعلشان كده الفحص الكامل (الترقوة، السرة، الـ PR، والمبيض في الستات) جزء من الـ staging قبل ما تفكر في عملية.
      - kind: explain
        page: 158
        quote: "A low serum pepsinogen I/I I ratioused to better select patients .It increased risk for atrophic gastritis and gastric cancer."
        title: "Screening و markers"
        text: |
          - **Screening** بينجح في الـ high-risk areas. في اليابان sensitivity و specificity حوالي 90%، بالـ double-contrast barium أو المنظار.
          - ==Low pepsinogen I/II ratio== بيختار المرضى: معناه risk أعلى لـ atrophic gastritis و gastric cancer.
          - **Carcinoembryonic antigen (CEA)** و**CA19-9** بيرتبطوا بالعمق والـ nodes والـ stage والـ survival. الـ CEA sensitivity واطية، بس لو عالي بيمشي مع الـ stage.
          - **Beta-HCG** و**CA 125** ممكن يعكسوا aggressive biology، بس فايدتهم في الـ staging محدودة.

          التفسير المقبول (مش في الكتاب): ليه الـ screening بينجح في البلاد عالية الخطر بس؟ لأن لما المرض نادر، أغلب النتايج الـ positive هتطلع غلط، والمنظار لكل الناس مكلف. أما في اليابان فالمرض شائع، فكل منظار ليه فرصة حقيقية يلاقي حاجة. والـ pepsinogen الواطي معناه إن الخلايا اللي بتفرزه ضمرت (atrophy)، وده أصلًا precursor.
      - kind: check
        page: 158
        quote: "EGD esophagogastroduodenoscopy Diagnostic accuracy is 98% if up to 7 biopsies is taken."
        question: "EGD reaches 98% diagnostic accuracy for gastric cancer when:"
        options:
          - "Up to 7 biopsies are taken"
          - "A single deep biopsy is taken"
          - "It is combined with CEA"
          - "It is done after a barium meal"
        answer: 0
        why:
          - "صح: diagnostic accuracy 98% if up to 7 biopsies."
          - "عينة واحدة مش كفاية، وفي الـ linitis كمان محتاج strip and bite."
          - "الـ CEA sensitivity واطية."
          - "الـ barium ممكن يفوّت early lesions ومش بيفرّق benign ulcer من ulcerating adenocarcinoma."
      - kind: explain
        page: 159
        quote: "Early superficial gastric mucosal lesion can be missed."
        title: "الـ barium ومشاكله، وباقي الـ investigations"
        text: |
          الكتاب، **double contrast barium**:
          1. ==Early superficial lesion can be missed==.
          2. **Can't differentiate** بين benign ulcer و ulcerating adenocarcinoma.

          والـ **investigations**: blood (low Hb، high ESR)، stool for **occult blood**، **gastric function test** (hypo أو achlorhydria)، **endoscopy** للـ early cases والـ biopsy، **ultrasonography** (سُمك الحيطة، local invasion، peritoneum، ascites)، **CT** (الامتداد، الـ nodes، الكبد)، barium و CT gastrography، و **staging laparoscopy**.

          التفسير المقبول (مش في الكتاب): الـ barium بيشوف **الشكل** بس، مش اللون ولا النسيج. القرحة الحميدة والخبيثة الاتنين «حفرة»، والفرق بينهم محتاج عين في المنظار وـ biopsy. وعلشان كده الـ EGD هو الأساس، والـ barium دوره يوضّح الخريطة. والـ staging laparoscopy بتلاقي الـ peritoneal deposits الصغيرة اللي الـ CT مش بيشوفها، فتوفّر على المريض عملية كبيرة مالهاش لازمة.
      - kind: figure
        page: 159
        title: "سرطان المعدة في المنظار"
        image: { file: git/L04-gastric-cancer-egd.webp, book: true }
        alt: "Book endoscopy pictures of gastric cancer: on the left, two views of an ulcerated lesion with dark slough and irregular edges; on the right, an ulcer with a pale base sitting in thick, nodular folds."
        caption: |
          قرح **irregular** حوافيها مش منتظمة، وقاعها فيه slough، والطيّات حواليها **نودولار** وتخينة.

          ده سبب إن ==EGD + biopsy== هو التشخيص: الـ barium مش بيفرّق بين قرحة benign و ulcerating adenocarcinoma.
      - kind: explain
        page: 159
        quote: "Nodal staging is significantly different"
        title: "نظامين للـ staging"
        text: |
          الكتاب: فيه **2 major staging systems**: الـ **American Joint Committee on Cancer** والـ **Japanese Classification of Gastric Carcinoma**. اليابانيين بيستخدموا T و M زي الـ AJCC، بس ==nodal staging is significantly different==.

          التفسير المقبول (مش في الكتاب): ليه اليابان ليها نظام لوحدها؟ لأن سرطان المعدة هناك شائع جدًا، والجراحين هناك بيشيلوا الـ nodes بتفصيل كبير، فبيقسّموها حسب **مكانها** (محطات حوالين المعدة). أما الـ AJCC فبيعدّ **عدد** الـ nodes المصابة. يعني لما تقرا paper ياباني، اتأكد هو بيتكلم بأنهي نظام قبل ما تقارن الأرقام.
      - kind: aside
        tone: trap
        page: 160
        quote: "T stage based on depth of tumor (not size)"
        text: "في الـ American Joint Committee on Cancer (AJCC) الـ T stage بيعتمد على depth of tumor مش size. ورم 8 cm سطحي ممكن يبقى T أقل من ورم 2 cm غاطس."
      - kind: explain
        page: 160
        quote: "extending into E-G junction Staged using the TNM staging for esophageal"
        title: "ورم الـ cardia: معدة ولا مريء؟"
        text: |
          الكتاب، تغييرات الـ **7th edition** من الـ AJCC:
          - ورم في الـ **E-G junction**، أو في الـ cardia على بُعد **أقل من 5 cm** من الـ junction و==بيمتد جوه الـ junction==: يتعمله staging كـ **esophageal cancer**.
          - ورم أقل من 5 cm من الـ junction و**ما بيمتدش** للمريء: يتعمله staging كـ **gastric cancer**.

          التفسير المقبول (مش في الكتاب): السؤال الحقيقي هنا «الورم ده بيتصرف إزاي؟». الورم اللي داخل الـ junction بيصرّف lymphatics لفوق ناحية الصدر زي أورام المريء، وجراحته بتشمل جزء من المريء. وده نفس رقم الـ 5 cm اللي شفته في درس المريء (الـ adenocarcinoma اللي مركزه جوه 5 cm من الـ EGJ). يعني القاعدة واحدة في الدرسين.
      - kind: figure
        page: 160
        quote: "CT scanning is used first to stage the gastric carcinoma; if no metastases and no invasion of local organs are found, EUS is used to refine the local stage."
        title: "الـ staging بالترتيب"
        alt: "Flowchart: gastric cancer diagnosed by EGD and biopsy, then CT first. If CT shows metastases or local organ invasion, stage IV or advanced. If not, EUS refines the local stage (depth, layers). Side notes: CT T-staging accuracy 64 percent, N sensitivity 24 to 43 percent, detects 85 percent of intra-abdominal metastases; PET not primary, only 50 percent PET-avid."
        caption: "CT الأول للانتشار، ولو نضيف يبقى endoscopic ultrasound (EUS) للعمق. والـ PET مش primary staging."
        svg: |
          <svg viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="G04s1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
