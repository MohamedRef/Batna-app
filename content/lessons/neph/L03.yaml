  # ------------------------------------------------------------------
  - id: neph.L03.lesson1
    title: "القلب والكلى: مين وقّع مين؟"
    hook: "عضوين متجوزين جواز كاثوليكي: لو واحد تعب، التاني بيتعب وراه. السؤال بس مين بدأ."
    minutes: 8
    pages: [68, 69]
    topics: [definition, pathogenesis]
    goals:
      - "تعرّف الـ cardiorenal syndrome زي الـ 2008 consensus"
      - "تفرّق الخمس أنواع في ثانية: مين primary ومين secondary، acute ولا chronic"
      - "تفهم المحرّك في كل نوع وليه"
    status: unverified
    steps:
      - kind: explain
        page: 68
        title: "التعريف"
        quote: "A 2008 consensus conference defined \"disorders of the heart and kidneys where by acute or chronic dysfunction in one organ may induce acute or chronic dysfunction of the other\" as cardiorenal syndrome (CRS)."
        text: |
          الـ **cardiorenal syndrome (CRS)** اتعرّف في **2008 consensus conference** كده:

          ==disorders of the heart and kidneys== اللي فيها **acute أو chronic dysfunction** في عضو بتعمل **acute أو chronic dysfunction** في التاني.

          يعني مش مجرد عيان عنده مرضين؛ لازم يكون واحد فيهم هو اللي **جاب** التاني.
      - kind: explain
        page: 68
        quote: "A 2008 consensus conference defined"
        title: "ليه نهتم مين بدأ؟"
        text: |
          الكتاب (من الـ **2008 consensus conference** للتعريف) بيقسّم الـ **cardiorenal syndrome (CRS)** حسب **مين بدأ** (القلب ولا الكلى ولا مرض systemic) و**بسرعة إزاي** (acute ولا chronic).

          التفسير المقبول (مش في الكتاب): التقسيم ده مش حفظ وبس، **لأن** العلاج بيمشي ورا العضو اللي بدأ:

          - **Type 1–2** (القلب بدأ): بنعالج الـ **congestion** والـ low output **عشان** الكلية تاخد دم أحسن.
          - **Type 3–4** (الكلية بدأت): بنعالج الـ **AKI** أو الـ **CKD** نفسه (volume، K، acidosis، anemia) **عشان** القلب يرتاح.
          - **Type 5**: بنعالج **السبب** (sepsis، diabetes، amyloidosis) **لأن** هو اللي ضرب الاتنين.
      - kind: figure
        page: 69
        quote: "Figure 1: Classification and pathogenesis of Cardiorenal Syndrome\n| Type | Primary disease | Pathogenesis | Secondary disease |\n| Type 1: Acute CRS | Heart | Alteration of renal perfusion is the main trigger (in particular when congestive heart failure is present) | Kidney |\n| Type 2: Chronic CRS | Heart | Renal fibrosis is particularly important in type 2. Also to be considered drug induced renal toxicity and VAD induced renal effects | Kidney |\n| Type 3: Acute RCS | Kidney | Salt and water, neuro-hormonal and uremia induced dysregulations are the most important aspects | Heart |\n| Type 4: Chronic RCS | Kidney | Hypertension, CKD induced myopathy, chronic hemodialysis and fluids shifts may be in cause | Heart |\n| Type 5: Secondary CRS | Systemic condition | Common pathogenetic patterns (i.e. auto-immunity, micro-circulatory dysfunction, cytokine release) | Heart and kidney |"
        title: "شكل 1 في الكتاب: الخمس أنواع"
        image: { file: neph/L03-crs-types.webp, book: true }
        alt: "Book Figure 1: five columns, Type 1 acute CRS, Type 2 chronic CRS, Type 3 acute RCS, Type 4 chronic RCS, Type 5 secondary CRS. A big black arrow on the left runs from 'primary disease' (top) to 'secondary disease' (bottom). Types 1-2 show a heart at the top and kidneys at the bottom; types 3-4 kidneys at the top and a heart at the bottom; type 5 an infusion bag and thermometer at the top and both organs at the bottom. Each column has a box: alteration of renal perfusion is the main trigger (type 1); renal fibrosis, drug-induced renal toxicity and VAD-induced renal effects (type 2); salt and water, neurohormonal and uremia-induced dysregulations (type 3); hypertension, CKD-induced myopathy, chronic hemodialysis and fluid shifts (type 4); common pathogenetic patterns such as auto-immunity, microcirculatory dysfunction, cytokine release (type 5)."
        caption: |
          السهم الأسود شمال بيقول ازاي تقرا الصورة: **فوق = Primary disease** (اللي بدأ)، و**تحت = Secondary disease** (اللي اتأثر).

          - **Type 1 (Acute CRS)** و **Type 2 (Chronic CRS)**: قلب فوق وكلى تحت = ==القلب بدأ==. في الـ 1 المحرّك **alteration of renal perfusion** (congestion)، وفي الـ 2 **renal fibrosis** وأدوية.
          - **Type 3 (acute renocardiac)** و **Type 4 (chronic renocardiac)**: كلى فوق وقلب تحت = ==الكلى بدأت==. في الـ 3 ملح ومية و neurohormones و uremia، وفي الـ 4 الضغط و **CKD-induced myopathy** والغسيل.
          - **Type 5 (Secondary)**: فوق كيس محلول وترمومتر (مرض systemic زي الـ sepsis)، وتحت القلب والكلى مع بعض.

          القاعدة من الصورة: الفردي **acute** والزوجي **chronic**، و**مين فوق** هو اللي بدأ.
      - kind: aside
        tone: tip
        page: 68
        quote: "Table 1: Classification of Cardiorenal Syndrome with Causes of Morbidity\n| Cardiorenal types | Characteristics | Causes of morbidity |\n| Type 1 (acute cardiorenal) | Acute cardiac impairment leading to acute kidney injury (AKI) | Cardiogenic shock and AKI, acute decompensated heart failure (ADHF) resulting in AKI |\n| Type 2 (chronic cardiorenal) | Chronic cardiac impairment leading to renal impairment | Chronic heart failure |\n| Type 3 (acute renocardiac) | AKI leading to cardiac impairment | Heart failure in the setting of AKI from volume overload, inflammatory surge and accompanying metabolic disturbances |\n| Type 4 (chronic renocardiac) | Chronic kidney disease (CKD) leading to cardiac impairment | Myocardial remodeling and heart failure from CKD-associated cardiomyopathy |\n| Type 5 (secondary cardiorenal) | Systemic condition leading to both cardiac and renal impairment | Diabetes, amyloidosis and sepsis |"
        text: |
          الاسم نفسه بيقولك مين بدأ: **cardio-renal** = القلب الأول، **reno-cardiac** = الكلى الأول.

          وبعدين **فردي = acute** (1 و 3) و **زوجي = chronic** (2 و 4)، و **5** = الـ **secondary**: مرض من برّه ضرب الاتنين.
      - kind: table
        page: 68
        quote: "Table 1: Classification of Cardiorenal Syndrome with Causes of Morbidity\n| Cardiorenal types | Characteristics | Causes of morbidity |\n| Type 1 (acute cardiorenal) | Acute cardiac impairment leading to acute kidney injury (AKI) | Cardiogenic shock and AKI, acute decompensated heart failure (ADHF) resulting in AKI |\n| Type 2 (chronic cardiorenal) | Chronic cardiac impairment leading to renal impairment | Chronic heart failure |\n| Type 3 (acute renocardiac) | AKI leading to cardiac impairment | Heart failure in the setting of AKI from volume overload, inflammatory surge and accompanying metabolic disturbances |\n| Type 4 (chronic renocardiac) | Chronic kidney disease (CKD) leading to cardiac impairment | Myocardial remodeling and heart failure from CKD-associated cardiomyopathy |\n| Type 5 (secondary cardiorenal) | Systemic condition leading to both cardiac and renal impairment | Diabetes, amyloidosis and sepsis |"
        title: "Table 1: الأنواع وأسباب الـ morbidity"
        columns: [Type, Causes of morbidity]
        rows:
          - ["1 acute cardiorenal", "Cardiogenic shock and AKI, acute decompensated heart failure (ADHF) resulting in AKI"]
          - ["2 chronic cardiorenal", "Chronic heart failure"]
          - ["3 acute renocardiac", "HF in AKI from volume overload, inflammatory surge, metabolic disturbances"]
          - ["4 chronic renocardiac", "Myocardial remodeling and HF from CKD-associated cardiomyopathy"]
          - ["5 secondary", "Diabetes, amyloidosis and sepsis"]
        hide: [[0, 1], [2, 1], [3, 1], [4, 1]]
      - kind: sort
        page: 68
        quote: "Table 1: Classification of Cardiorenal Syndrome with Causes of Morbidity\n| Cardiorenal types | Characteristics | Causes of morbidity |\n| Type 1 (acute cardiorenal) | Acute cardiac impairment leading to acute kidney injury (AKI) | Cardiogenic shock and AKI, acute decompensated heart failure (ADHF) resulting in AKI |\n| Type 2 (chronic cardiorenal) | Chronic cardiac impairment leading to renal impairment | Chronic heart failure |\n| Type 3 (acute renocardiac) | AKI leading to cardiac impairment | Heart failure in the setting of AKI from volume overload, inflammatory surge and accompanying metabolic disturbances |\n| Type 4 (chronic renocardiac) | Chronic kidney disease (CKD) leading to cardiac impairment | Myocardial remodeling and heart failure from CKD-associated cardiomyopathy |\n| Type 5 (secondary cardiorenal) | Systemic condition leading to both cardiac and renal impairment | Diabetes, amyloidosis and sepsis |"
        prompt: "صنّف كل عيان على نوعه:"
        bins: ["Type 1", "Type 3", "Type 4", "Type 5"]
        cards:
          - { text: "Cardiogenic shock after myocardial infarction (MI), then creatinine doubles", bin: 0 }
          - { text: "ADHF admission with rising creatinine", bin: 0 }
          - { text: "Rhabdomyolysis acute kidney injury (AKI), then pulmonary edema from overload", bin: 1 }
          - { text: "AKI with hyperkalemia and arrhythmia", bin: 1 }
          - { text: "10 years on hemodialysis, now left ventricular hypertrophy (LVH) and heart failure (HF)", bin: 2 }
          - { text: "Septic shock with AKI and new left ventricle dysfunction", bin: 3 }
          - { text: "Amyloidosis with heart failure and nephrotic proteinuria", bin: 3 }
        why: "دوّر على مين اتأذى **الأول**: لو القلب acute = 1، لو الكلى acute = 3، لو chronic kidney disease (CKD) قديم = 4، ولو مرض systemic (sepsis، amyloid، diabetes) ضرب الاتنين = 5."
      - kind: explain
        remind: [neph.L03.015, neph.L03.016]
        page: 69
        title: "Figure 1: المحرّك في كل نوع"
        quote: "Figure 1: Classification and pathogenesis of Cardiorenal Syndrome\n| Type | Primary disease | Pathogenesis | Secondary disease |\n| Type 1: Acute CRS | Heart | Alteration of renal perfusion is the main trigger (in particular when congestive heart failure is present) | Kidney |\n| Type 2: Chronic CRS | Heart | Renal fibrosis is particularly important in type 2. Also to be considered drug induced renal toxicity and VAD induced renal effects | Kidney |\n| Type 3: Acute RCS | Kidney | Salt and water, neuro-hormonal and uremia induced dysregulations are the most important aspects | Heart |\n| Type 4: Chronic RCS | Kidney | Hypertension, CKD induced myopathy, chronic hemodialysis and fluids shifts may be in cause | Heart |\n| Type 5: Secondary CRS | Systemic condition | Common pathogenetic patterns (i.e. auto-immunity, micro-circulatory dysfunction, cytokine release) | Heart and kidney |"
        text: |
          - **Type 1:** ==alteration of renal perfusion== هو الـ main trigger، خصوصًا لو فيه **congestive heart failure**.
          - **Type 2:** **renal fibrosis**، وكمان **drug-induced renal toxicity** وتأثير الـ **ventricular assist device** على الكلى.
          - **Type 3:** **salt and water** و **neurohormonal** و **uremia-induced dysregulations**.
          - **Type 4:** **hypertension**، **CKD-induced myopathy**، **chronic hemodialysis** و **fluid shifts**.
          - **Type 5:** patterns مشتركة: **autoimmunity**، **microcirculatory dysfunction**، **cytokine release**.

          الخطوة الجاية بتشرح **ليه** كل محرّك بيعمل اللي بيعمله.
      - kind: explain
        page: 69
        quote: "Figure 1: Classification and pathogenesis of Cardiorenal Syndrome\n| Type | Primary disease | Pathogenesis | Secondary disease |\n| Type 1: Acute CRS | Heart | Alteration of renal perfusion is the main trigger (in particular when congestive heart failure is present) | Kidney |\n| Type 2: Chronic CRS | Heart | Renal fibrosis is particularly important in type 2. Also to be considered drug induced renal toxicity and VAD induced renal effects | Kidney |\n| Type 3: Acute RCS | Kidney | Salt and water, neuro-hormonal and uremia induced dysregulations are the most important aspects | Heart |\n| Type 4: Chronic RCS | Kidney | Hypertension, CKD induced myopathy, chronic hemodialysis and fluids shifts may be in cause | Heart |\n| Type 5: Secondary CRS | Systemic condition | Common pathogenetic patterns (i.e. auto-immunity, micro-circulatory dysfunction, cytokine release) | Heart and kidney |"
        title: "ليه كل محرّك بيعمل اللي بيعمله؟"
        text: |
          الكتاب (Figure 1) بيدّي لكل نوع **المحرّك الأساسي**. التفسير المقبول (مش في الكتاب):

          - **Type 1 (renal perfusion):** الكلية محتاجة **فرق ضغط** بين الشريان والوريد. القلب الضعيف بيقلّل الداخل، والـ congestion بيعلّي الخارج، **فـ** الـ perfusion بيقع من الناحيتين.
          - **Type 2 (renal fibrosis):** الـ hypoperfusion المزمن والـ RAAS الشغال على طول بيحوّلوا الـ nephrons لـ scar، **يعني** الضرر بيبقى دايم مش وظيفي بس.
          - **Type 3 (salt, water, neurohormones, uremia):** الكلية الواقفة مش بتطلّع صوديوم ولا مية، **فـ** الـ preload يعلى والقلب يغرق.
          - **Type 4 (hypertension, myopathy, dialysis):** سنين من الضغط العالي والأنيميا والـ fluid shifts بتتعب عضلة القلب **بالراحة**.
          - **Type 5:** نفس الـ cytokines والـ microcirculation بتوصل للعضوين في نفس الوقت.
      - kind: reveal
        page: 69
        quote: "Figure 1: Classification and pathogenesis of Cardiorenal Syndrome\n| Type | Primary disease | Pathogenesis | Secondary disease |\n| Type 1: Acute CRS | Heart | Alteration of renal perfusion is the main trigger (in particular when congestive heart failure is present) | Kidney |\n| Type 2: Chronic CRS | Heart | Renal fibrosis is particularly important in type 2. Also to be considered drug induced renal toxicity and VAD induced renal effects | Kidney |\n| Type 3: Acute RCS | Kidney | Salt and water, neuro-hormonal and uremia induced dysregulations are the most important aspects | Heart |\n| Type 4: Chronic RCS | Kidney | Hypertension, CKD induced myopathy, chronic hemodialysis and fluids shifts may be in cause | Heart |\n| Type 5: Secondary CRS | Systemic condition | Common pathogenetic patterns (i.e. auto-immunity, micro-circulatory dysfunction, cytokine release) | Heart and kidney |"
        prompt: "ليه الـ congestion (مش بس الـ low output) بيأذي الكلى في type 1؟"
        answer: |
          الكلى عايزة **فرق ضغط**: arterial pressure داخل ناقص **venous pressure** خارج. في الـ congestive heart failure (HF) الـ venous pressure بيعلى، فالـ **perfusion pressure** بيقل حتى لو الـ blood pressure (BP) مقبول.

          علشان كده Figure 2 بتكتب **decreased perfusion, increased venous pressure** جنب بعض. (تفسير فسيولوجي؛ الكلام عن الـ perfusion من الكتاب.)
      - kind: figure
        page: 69
        quote: "Figure 2: Mechanism of damage in CRS-1. ACE, angiotensin-converting enzyme; CKD, chronic kidney disease; CRS, cardiorenal syndrome; RAA, rennin-angiotensin-Aldosterone\nAcute Heart Failure\n  Humoral signaling → Endothelial Activation → Cytokine secretion → Acute Renal Disease\n  Diuretic and ACE inhibitor → Toxicity, Vasoconstriction → Acute Renal Disease\n  Hemodynamically mediated damage → Decreased perfusion, increased venous pressure → Acute Renal Disease\n  Sympathetic Activation → Acute Renal Disease and Acute Heart Failure\nAcute Renal Disease\n  RAA activation, vasoconstricition → Acute Heart Failure"
        title: "شكل 2 في الكتاب: CRS-1"
        image: { file: neph/L03-crs1-mechanism.webp, book: true }
        alt: "Book Figure 2, mechanism of damage in CRS-1: acute heart failure at the top, acute renal disease at the bottom. Middle chain in green: humoral signaling, endothelial activation, cytokine secretion. Right: diuretic and ACE inhibitor leading to toxicity and vasoconstriction; hemodynamically mediated damage leading to decreased perfusion and increased venous pressure. Left: sympathetic activation and RAA activation with vasoconstriction, with arrows looping from the kidney back up to the heart."
        caption: |
          **فوق: Acute Heart Failure**، و**تحت: Acute Renal Disease**، وبينهم 3 طرق نازلة:

          - **في النص (الأخضر)**: **Humoral signaling** ← **Endothelial activation** ← **Cytokine secretion**.
          - **يمين (البرتقاني)**: **Diuretic and ACE inhibitor** ← **Toxicity, vasoconstriction**: علاجنا نفسه ممكن يأذي.
          - **أقصى اليمين (الأزرق)**: **Hemodynamically mediated damage** ← **Decreased perfusion، increased venous pressure** (الكلية محشورة بين دم داخل قليل ودم راجع مضغوط).
          - **شمال (الأصفر)**: **Sympathetic activation** و **RAA activation، vasoconstriction**، والأسهم بتاعتهم ==طالعة من الكلية للقلب تاني==.

          الرسمة بتثبت إن الـ CRS-1 ==مش بس low output==: الـ venous congestion والأدوية والـ cytokines، والـ loop الشمال بيقفل vicious cycle.
      - kind: check
        page: 69
        quote: "Figure 1: Classification and pathogenesis of Cardiorenal Syndrome\n| Type | Primary disease | Pathogenesis | Secondary disease |\n| Type 1: Acute CRS | Heart | Alteration of renal perfusion is the main trigger (in particular when congestive heart failure is present) | Kidney |\n| Type 2: Chronic CRS | Heart | Renal fibrosis is particularly important in type 2. Also to be considered drug induced renal toxicity and VAD induced renal effects | Kidney |\n| Type 3: Acute RCS | Kidney | Salt and water, neuro-hormonal and uremia induced dysregulations are the most important aspects | Heart |\n| Type 4: Chronic RCS | Kidney | Hypertension, CKD induced myopathy, chronic hemodialysis and fluids shifts may be in cause | Heart |\n| Type 5: Secondary CRS | Systemic condition | Common pathogenetic patterns (i.e. auto-immunity, micro-circulatory dysfunction, cytokine release) | Heart and kidney |"
        question: "In Figure 1, what is the main trigger of type 1 (acute) CRS?"
        options:
          - "Alteration of renal perfusion, especially with congestive heart failure"
          - "Renal fibrosis"
          - "Uremia-induced dysregulation"
          - "Cytokine release from a systemic disease"
        answer: 0
        why:
          - "صح: الـ **alteration of renal perfusion** هو الـ main trigger، خصوصًا مع الـ congestion."
          - "الـ renal fibrosis هو المهم في **type 2** (المزمن)."
          - "الـ salt و water والـ uremia بتاعة **type 3**، لما الكلية هي اللي بدأت."
          - "الـ cytokines والـ autoimmunity في **type 5** (secondary)."
