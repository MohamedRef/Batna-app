        quote: "Drug eluting coronary artery stents within 12 mo of placement. Bare metal coronary artery stents within 1 mo of placement."
        text: |
          المنطق: الـ **mitral** أسوأ من الـ aortic (الدم أبطأ)، والجديد أسوأ من القديم (VTE < 3 شهور، stroke < 3 شهور، stent جديد).

