  - id: rheum.L08.lesson6
    title: "Behçet والمخ وباقي العيلة"
    hook: "قرحة في البق 3 مرات في السنة ونقطة حمرا مكان الإبرة: كده عرفت Behçet."
    minutes: 9
    pages: [157, 163]
    topics: [behcet, pacns, other]
    goals:
      - "تطبّق criteria الـ Behçet والـ scoring"
      - "تعرف الـ 7 heuristics بتاعة PACNS"
      - "تفرّق Buerger و hypersensitivity و HSP و cryoglobulinemia"
    status: unverified
    steps:
      - kind: explain
        page: 157
        title: "Behçet 1990"
        quote: "reported reliably by a patient that recurs at least 3 times in one 12-month period plus 2 of the following"
        text: |
          **لازم:** ==recurrent oral ulcers ≥3 مرات في 12 شهر==
          **+ 2 من:**
          - **Genital** ulcers أو scars (خصوصًا الرجالة)
          - **Eye:** anterior/posterior uveitis، vitreous cells، retinal vasculitis
          - **Skin:** erythema nodosum-like، pseudofolliculitis، papulopustular، acneiform nodules (بعد البلوغ ومن غير steroids)
          - ==Positive pathergy==
      - kind: explain
        page: 157
        title: "الـ pathergy test"
        quote: "An erythematous papule larger than 2 mm at the prick site 48 hours after the application of a 20- to 22-gauge sterile needle"
        text: |
          إبرة **20–22 gauge** معقمة تدخل مايلة في جلد avascular لعمق **5 mm**، وتقرا بعد ==48 hours==: papule حمرا **>2 mm** = positive.

          الفكرة: الـ neutrophils في Behçet "متحمسين زيادة"، فأي جرح بسيط يعمل التهاب أكبر من حجمه.
      - kind: figure
        page: 157
        quote: "Ocular lesions 2 Genital aphthosis 2 Oral aphthosis 2 Skin lesions 1 Neurological manifestations 1 Vascular manifestations 1"
        title: "Behçet points"
        alt: "Bar chart of Behçet scoring points: ocular lesions 2, genital aphthosis 2, oral aphthosis 2, skin lesions 1, neurological manifestations 1, vascular manifestations 1, positive pathergy test 1."
        caption: "العين والأعضاء التناسلية والبق بـ ==2==، والباقي بـ **1**. الكتاب ما كتبش cut-off (الـ ICBD 2014: ≥4)."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="30" class="t-sm">Ocular lesions</text><rect x="150" y="17" width="140" height="18" rx="4" class="fg-dot-acc"/><text x="300" y="31" class="t-sm t-b">2</text>
            <text x="10" y="62" class="t-sm">Genital aphthosis</text><rect x="150" y="49" width="140" height="18" rx="4" class="fg-dot-acc"/><text x="300" y="63" class="t-sm t-b">2</text>
            <text x="10" y="94" class="t-sm">Oral aphthosis</text><rect x="150" y="81" width="140" height="18" rx="4" class="fg-dot-acc"/><text x="300" y="95" class="t-sm t-b">2</text>
            <text x="10" y="126" class="t-sm">Skin lesions</text><rect x="150" y="113" width="70" height="18" rx="4" class="fg-dot-good"/><text x="230" y="127" class="t-sm t-b">1</text>
