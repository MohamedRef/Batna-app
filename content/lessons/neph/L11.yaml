          ومميزات الـ PD (الكتاب): ultrafiltration مضبوط، hemodynamics أهدى، anemia أقل، ضغط أحسن، ومفيش anticoagulation. التفسير المقبول (مش في الكتاب): الـ PD شغال كل يوم وبهدوء، زي الكلية الطبيعية، فمفيش الطلعات والنزلات اللي في الـ HD.

          ولذلك الحل مش إنك تغيّر الغشاء، الحل إنك تقلل الـ **dwell volume** (مكان أقل) وتزوّد **عدد الـ exchanges**.
