  # ---------- p32–33: chronicity, AKI vs CKD ----------
  - id: neph.L02.039
    kind: enumerate
    topic: chronicity
    prompt: How can chronicity (> 3 months) of kidney disease be proven?
    points:
      - Review of past GFR measurements or estimates
      - Review of past albuminuria/proteinuria and urine microscopy
      - Imaging (reduced kidney size, reduced cortical thickness)
      - Kidney pathology (fibrosis and atrophy)
      - Medical history of conditions causing CKD
      - Repeat measurements within and beyond the 3-month point
    pass: 4
    hook: "تثبت إن الكلية عيانة من فوق 3 شهور بـ «أرشيف مرتين، صورة، عينة، حكاية، وإعادة»: GFR قديم، albuminuria/proteinuria وurine microscopy قديمة، imaging (كلية صغيرة وcortex رفيع)، pathology (fibrosis وatrophy)، تاريخ مرض بيعمل CKD، وتكرار القياس قبل وبعد علامة الـ 3 شهور."
    src: { page: 32, quote: "Proof of chronicity (duration of >3 months) can be established by:\nReview of past measurements/estimations of GFR;\nReview of past measurements of albuminuria or proteinuria and urine microscopic examinations;\nImaging findings such as reduced kidney size and reduction in cortical thickness;\nkidney pathological findings such as fibrosis and atrophy;\nMedical history, especially conditions known to cause or contribute to CKD;\nRepeat measurements within and beyond the 3-month point." }
    status: unverified
    tags: [high-yield]
