        why:
          - "صح: 6 شهور لو فيه tophi (و EULAR 2016: 6 شهور للكل)."
          - "3 شهور لو مفيش tophi."
          - "قصير جدًا."
          - "المدة بالشهور مش بالمعمل."
      - kind: explain
        page: 43
        quote: "Start low and go slow: 100mg/d for healthy patients. 50mg/d in pts with CKD (stage 4 or more). Titrate/2-4 weeks."
        title: "الـ allopurinol"
        text: |
          - **Target**: ==urate أقل من 6 mg/dL== (أو أقل من 5 لو محتاج تحسن أكتر).
          - XOI بيشتغل على الـ under-excreters والـ over-producers.
          - **Start low, go slow**: 100 mg/d، و **50 mg/d في CKD 4 أو أكتر**، وزوّد كل 2-4 أسابيع.
          - **ماتوقفوش في النوبة**.
          - الـ ACR: مقبول تبدأه أثناء النوبة لو المريض بيستجيب للـ anti-inflammatory.
          - Lifelong.
      - kind: aside
        tone: trap
        page: 43
        quote: "Should be started only 2 weeks after attack is well-controlled"
        text: "الكتاب في نفس الصفحة فيه رأيين: الرسمة بتقول ابدأ بعد النوبة بأسبوعين، والنص بيقول الـ ACR بيسمح أثناء النوبة. لو السؤال قال «ACR»: أثناء النوبة مقبول. والاتنين متفقين: لو المريض واخده، ماتوقفوش."
      - kind: table
