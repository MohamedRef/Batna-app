      - kind: table
        page: 95
        quote: "First Ig synthesized in an antibody response potent activator complement,"
        title: "الخمس classes"
        columns: [Ig, Chain, Key point]
        rows:
          - ["IgM", "μ", "First made; potent complement activator"]
          - ["IgG", "γ", "Most abundant; secondary response"]
          - ["IgA", "α", "Next most abundant; mucosal protection"]
          - ["IgE", "ε", "Very low; parasites and atopy"]
          - ["IgD", "δ", "Very low, unknown; B-cell maturation"]
        hide: [[0, 2], [1, 2], [2, 2], [3, 2], [4, 2]]
      - kind: explain
        page: 95
        title: "ليه كل antibody في مكانه؟"
        quote: "First Ig synthesized in an antibody response potent activator complement,"
        text: |
          الكتاب بيدّيك الوظيفة، والتفسير المقبول (مش في الكتاب) بيدّيك السبب:

          - **IgM** = أول واحد يتعمل و **potent complement activator**: لأن الـ B cell أول ما تتنشّط بتفرز الـ antibody اللي على سطحها (sIgM)، ومحتاجتش وقت تغيّر النوع. وهو **pentamer** (5 وحدات)، فرجليه كتير قريبة من بعض، وده اللي الـ complement محتاجه عشان يتشغّل.
          - **IgG** = **most abundant** وبتاع الـ ==secondary response==: الـ memory B cells اتعلمت تطلّعه بعد ما الـ T cell ساعدتها، فلما العدو يرجع يطلع IgG كتير وبسرعة.
          - **IgE** = واطي جدًا في الدم: لأنه قاعد **لازق على الـ mast cells** مش سايب في البلازما، وده بيعلّى مع الـ **parasites** والـ **atopy**.
      - kind: explain
        page: 96
        title: "IgA و IgD"
        quote: "Protect against bacterial, viral, protozoal infections of mucosa."
        text: |
          - **IgA**: **next most abundant**، وبيحمي الـ **mucosa** من البكتيريا والـ viruses والـ protozoa. افتكر خريطة ص 83: الـ ==MALT== على الأبواب، والـ antibody بتاعه هو IgA، فمنطقي إنه يبقى بتاع الأسطح.
          - **IgD**: **very low** في الدم و **unknown function**. بس وجوده **على سطح الـ immature B cell** ليه دور حاسم في الـ **B lymphocyte maturation**.

          يعني الـ IgD شغله **على الخلية** مش في الدم، وعشان كده تلاقيه مع الـ IgM على الـ mature B cell (sIgM و sIgD) زي ما شفت في الدرس اللي فات.
      - kind: mnemonic
        page: 95
        quote: "Most abundant – 2ry immune response complement activation."
        word: "MGAED"
        parts:
          - { key: "M", text: "IgM: Make it first, complement activator" }
          - { key: "G", text: "IgG: Greatest amount, secondary response" }
          - { key: "A", text: "IgA: At the mucosa, next most abundant" }
          - { key: "E", text: "IgE: Eosinophils, parasites and atopy" }
          - { key: "D", text: "IgD: Developing B cells, function unknown in serum" }
        hook: "**MGAED** بالترتيب ده: أول واحد يتعمل، أكتر واحد، اللي بعده في الكمية، والاتنين الواطيين في الآخر."
      - kind: explain
        page: 97
        title: "الـ antibody بيعمل إيه في الحقيقة؟ (شكل ص 97)"
        quote: "neutralization\nopsonization"
        text: |
          الـ plasma cell بتطلّع الـ antibody، وشكل الكتاب بيوريك سته شغلانات:
          - ==Direct neutralization==: يلزق على الـ toxin أو الـ virus فيقفل الحتة اللي بيدخل بيها.
          - **Immune complex formation**: كذا antibody يمسكوا كذا antigen في كتلة.
          - **Opsonization** ← **phagocytosis** بالـ mononuclear phagocytes والـ neutrophils.
          - **Complement activation** ← **cell lysis**.
          - **Sensitization of target cells** ← **antibody-dependent cell-mediated cytotoxicity (ADCC)** بالـ large granular lymphocytes.
          - **Sensitization of mast cells/basophils** ← **control of inflammatory response**.

          لاحظ إن أغلبهم بيستخدم **رجل الـ antibody** (الـ Fc): هي اللي بتكلّم الـ phagocyte والـ complement والـ NK، والطرفين فوق شغلتهم يمسكوا الـ antigen بس.
      - kind: explain
        page: 96
        title: "الـ B cell بتتنشّط إزاي؟"
        quote: "B cell activation\n  Thymus independent pathway 1 is not antigen specific.\n  It results in activation of all B cells. (Poly clonal activation).\n  Thymus independent pathway 2 is antigen specific- IgM response-little memory.\n  Thymus dependent: most important- high affinity IgG-Memory-protection against auto immunity."
        text: |
          - **Thymus independent 1**: **مش antigen specific**، بتنشّط كل الـ B cells: **polyclonal activation**.
          - **Thymus independent 2**: antigen specific، **Immunoglobulin M (IgM) response**، **little memory**.
          - ==Thymus dependent==: **الأهم**: **high-affinity Immunoglobulin G (IgG)**، **memory**، و**protection against autoimmunity**.
      - kind: reveal
