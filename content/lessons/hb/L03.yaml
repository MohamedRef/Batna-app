lecture: hb.L03
lessons:
  # ------------------------------------------------------------------
  - id: hb.L03.lesson1
    title: "الضغط بيتحبس فين؟"
    hook: "دم الأمعاء رايح للقلب، والزحمة ممكن تبقى قبل الكبد أو جوّاه أو بعده. البلهارسيا فين؟"
    minutes: 9
    pages: [37, 38]
    topics: [overview, classification]
    goals:
      - "تقول هدف علاج الـ portal hypertension في الـ compensated والـ decompensated"
      - "تحفظ أرقام الـ varices (30% ثم 90%) والـ predictors التلاتة"
      - "تصنّف أي سبب: pre-hepatic، hepatic (pre / sinusoidal / post)، post-hepatic"
      - "تقرأ wedged و free hepatic pressure وتعرف المستوى"
    status: unverified
    steps:
      - kind: explain
        remind: [hb.L03.003]
        page: 37
        title: "أهم مضاعفة للـ cirrhosis"
        quote: "Portal hypertension (PH) is the most common complication of cirrhosis and represents the main driver of hepatic decompensation."
        text: |
          الـ ==portal hypertension (PH)== هو أشهر مضاعفة للـ cirrhosis، وهو المحرّك الأساسي للـ ==hepatic decompensation==. يعني لو فهمته، فهمت نص الهيباتولوجي.

          ليه بالأهمية دي؟ لأن أغلب اللي بيدخّل مريض الـ cirrhosis المستشفى بييجي من الضغط: الدوالي بتنزف، المية بتتجمع في البطن، والدم بيلف حوالين الكبد ويوصل المخ من غير تنضيف.

          والهدف من العلاج بيتغير حسب المريض فين:

          - **Compensated cirrhosis**: الهدف الكبير إننا نقلل خطر أول decompensation، يعني ascites، variceal bleeding، أو hepatic encephalopathy.
          - **Decompensated cirrhosis**: الهدف نمنع further decompensation ونحسّن الـ survival.

          الـ further decompensation في الكتاب بتشمل: recurrent/refractory ascites، variceal rebleeding، recurrent encephalopathy، **spontaneous bacterial peritonitis (SBP)**، و **hepatorenal syndrome**.
      - kind: sort
        page: 37
        quote: "In decompensated patients, PH-directed therapies aim at avoiding further decompensation (i.e. recurrent/refractory ascites, variceal rebleeding, recurrent encephalopathy, spontaneous bacterial peritonitis, or hepatorenal syndrome) and at improving survival."
        prompt: "كل حدث من دول بنمنعه في أنهي مرحلة حسب الكتاب؟"
        bins: ["Compensated: prevent first decompensation", "Decompensated: prevent further decompensation"]
        cards:
          - { text: "First ascites", bin: 0 }
          - { text: "First variceal bleeding", bin: 0 }
          - { text: "First hepatic encephalopathy", bin: 0 }
          - { text: "Variceal rebleeding", bin: 1 }
          - { text: "Spontaneous bacterial peritonitis", bin: 1 }
          - { text: "Hepatorenal syndrome", bin: 1 }
          - { text: "Refractory ascites", bin: 1 }
        why: "التلاتة الكبار (ascites، bleeding، encephalopathy) هما تعريف الـ **decompensation**. بعد ما تحصل، القايمة بتكبر: rebleeding، recurrent HE، refractory ascites، **SBP و hepatorenal syndrome (HRS)**، والهدف يبقى كمان **survival**."
      - kind: explain
        page: 37
        quote: "Approximately 30% of cirrhotics have esophageal varices at the time of diagnosis; this proportion increases with time and reaches 90% after approximately ten years"
        title: "الـ varices: مسألة وقت"
        text: |
          الدوالي مش بتظهر مرة واحدة، دي بتتبني مع السنين:

          - حوالي 30% من مرضى الـ cirrhosis عندهم ==esophageal varices== وقت التشخيص.
          - النسبة بتزيد مع الوقت لحد 90% بعد حوالي 10 سنين.

          وفيه تلات حاجات بتتوقع وجود الـ varices:

          - **International normalised ratio (INR)**: أكتر من 1.5، علامة إن الكبد ضعيف.
          - **Portal vein diameter**: أكتر من 13 mm، الوريد متمدد من الضغط.
          - **Thrombopenia**: صفايح واطية، لأن الطحال كبر وحجزها.

          الربط: التلاتة بيقيسوا حاجة واحدة من زوايا مختلفة، وهي إن الكبد متأذي والضغط عالي. وده ممكن يأثر على قرار الـ **gastroscopy** للبحث عن varices علشان الـ primary prophylaxis.
      - kind: aside
        tone: tip
        page: 37
        quote: "INR) >1.5, a portal vein diameter of >13mm and thrombopenia have been found to predict the likelihood of varices being present in cirrhotics"
        text: |
          الـ predictors كلها منطقية: INR أكتر من 1.5 = الكبد مش بيصنّع كويس (مرض متقدم)، portal vein > 13 mm = الوريد منفوخ من الضغط، و platelets واطية = طحال كبير بيحجزها.

          ورقمين يتحفظوا مع بعض: **1.5 و 13**.
      - kind: figure
        remind: [hb.L03.010]
        page: 38
        quote: "Classification of Portal Hypertension Pre-hepatic Portal vein thrombosis Splenic vein thrombosis Massive splenomegaly"
        title: "رحلة الدم والزحمة فين"
        alt: "Blood flows down the page from spleen and gut, through the splenic and portal veins, through the liver (portal venule, sinusoid, central venule), then the hepatic veins and IVC to the right heart. Causes are listed beside each level. Pre-hepatic: portal vein thrombosis, splenic vein thrombosis, massive splenomegaly. Pre-sinusoidal: schistosomiasis, congenital hepatic fibrosis. Sinusoidal: cirrhosis, alcoholic hepatitis. Post-sinusoidal: hepatic sinusoidal obstruction. Post-hepatic: Budd-Chiari syndrome, IVC webs, cardiac causes (restrictive cardiomyopathy, constrictive pericarditis, severe heart failure). Portal hypertension is a portal to hepatic vein pressure gradient above 10 mmHg."
        caption: "امشي مع الدم من فوق لتحت: الانسداد **قبل** الكبد، **جوّاه** (قبل الـ sinusoid أو فيه أو بعده)، أو **بعده** لحد القلب. والـ **cirrhosis** sinusoidal."
        svg: |
