  - id: dm.L13.lesson6
    title: "الأقراص في الحمل، والمتابعة بعد الـ GDM"
    hook: "الـ metformin لطيف بس بيعدّي المشيمة، والـ glyburide أسوأ. وبعد الـ GDM المتابعة ما بتخلصش."
    minutes: 8
    pages: [176, 177]
    topics: [oral, postpartum]
    goals:
      - "تقارن metformin و glyburide في الحمل وتعرف ليه الـ insulin أحسن"
      - "تعرف متابعة ما بعد الـ GDM وليه مدى الحياة"
    status: unverified
    steps:
      - kind: aside
        tone: joke
        page: 176
        quote: "Metformin (lower risk of hypoglycemia & lower weight gain) but……Metformin crosses the placenta"
        text: |
          الـ **metformin** في الحمل زي ضيف لطيف بيدخل البيت من غير ما يستأذن: ما بيعملش hypo ولا بيتخن، بس ==بيعدّي المشيمة== وكمان بيقعد عند الجنين أكتر من الأم (cord levels أعلى).
      - kind: explain
        page: 176
        title: "الـ metformin: مزايا وتمن"
        quote: "Umbilical cord blood levels of metformin are higher than maternal levels"
        text: |
          الكتاب بيدّي الـ metformin حسنتين: **lower risk of hypoglycemia** و **lower weight gain**. ليه؟ التفسير المقبول (مش في الكتاب): لأنه مش بيزوّد إفراز الـ insulin، هو بيقلل خروج الـ glucose من الكبد، فمش بينزّل السكر تحت الطبيعي ولا بيخزّن دهون.

          بس التمن:
          - ==Metformin crosses the placenta==، و **umbilical cord levels** أعلى من الأم.
          - بيزوّد الـ **prematurity** شوية، و **long-term studies are lacking**: يعني مش عارفين أثره على الطفل لما يكبر.
          - لو اتاخد للـ **PCOS** عشان التبويض، يتوقف بآخر الـ **1st trimester**.

          عشان كده الـ **insulin** هو الـ preferred: ما بيعديش المشيمة خالص.
      - kind: table
        page: 177
        quote: "Concentrations of glyburide in umbilical cord plasma are approximately 70% of maternal levels."
        title: "مين بيعدّي المشيمة؟"
        columns: ["الدوا", "المشيمة", "النقطة"]
        rows:
          - ["Insulin", "لأ", "Preferred"]
          - ["Metformin", "أيوه، cord أعلى من الأم", "Prematurity بسيطة؛ يتوقف آخر 1st trimester لو للـ PCOS"]
          - ["Glyburide", "أيوه، cord ~70%", "Inferior: neonatal hypo و macrosomia"]
        hide: [[1, 1], [2, 1], [2, 2]]
      - kind: check
        page: 177
        quote: "Several meta-analyses and large observational studies examining maternal & fetal outcomes have suggested that sulfonylureas (glyburide) are inferior to insulin & metformin due to increased risk of neonatal hypoglycemia & macrosomia with this class."
        question: "Why is glyburide considered inferior to insulin and metformin in pregnancy?"
        options:
          - "More neonatal hypoglycemia and macrosomia"
          - "It does not cross the placenta"
          - "It causes maternal ketoacidosis"
          - "It is teratogenic in the first trimester"
        answer: 0
        why:
          - "صح: meta-analyses ودراسات كبيرة."
          - "بالعكس، بيعدّي (حوالي 70% من مستوى الأم)."
          - "مش ده السبب اللي في الكتاب."
          - "الكتاب ما قالش كده."
      - kind: reveal
        page: 177
        quote: "Concentrations of glyburide in umbilical cord plasma are approximately\n   70% of maternal levels."
        prompt: "ليه الـ glyburide بالذات بيعمل neonatal hypoglycemia و macrosomia؟"
        answer: |
          الكتاب بيدّيك الدليل: تركيزه في الـ **umbilical cord plasma** حوالي ==70%== من الأم، يعني بيوصل الجنين بكمية كبيرة.

          التفسير المقبول (مش في الكتاب): الـ glyburide **sulfonylurea**، يعني شغلته إنه يعصر الـ beta cells تطلّع insulin. لما يعدّي، بيعصر **بنكرياس الجنين** كمان. الـ insulin الزيادة عند الجنين بيكبّره (**macrosomia**)، وبعد الولادة بيفضل الـ insulin عالي والـ glucose الجاي من الأم وقف، فيقع في **neonatal hypoglycemia**. نفس سلسلة السكر العالي، بس الدوا هو اللي عملها.
      - kind: explain
        page: 177
        quote: "Screen women with GDM for persistent DM at 4–12 weeks postpartum, using the OGTT test & clinically appropriate non-pregnancy diagnostic criteria."
        title: "بعد الـ GDM: المتابعة مدى الحياة"
        text: |
          - **Oral glucose tolerance test (OGTT)** بعد الولادة بـ ==4-12 weeks== بالـ criteria العادية.
          - Screening ==مدى الحياة== كل **3 سنين** على الأقل.
          - لو prediabetes: **intensive lifestyle** أو **metformin**.
      - kind: explain
        page: 177
        title: "ليه المتابعة مدى الحياة؟"
        quote: "Women with a history of GDM should have lifelong screening for the\n          development of DM or pre-diabetes at least every 3 years."
        text: |
          التفسير المقبول (مش في الكتاب): الـ GDM معناه إن البنكرياس **ما قدرش** يجاري الـ insulin resistance بتاعة الحمل. الحمل كان **stress test** كشف إن الـ beta cells احتياطيها قليل.

          - بعد الولادة الـ resistance بتقع، فالسكر بيرجع طبيعي غالبًا، بس **العيب الأصلي لسه موجود**.
          - عشان كده الـ OGTT بعد ==4-12 weeks== يتأكد إن السكر رجع، والـ screening **كل 3 سنين على الأقل** طول العمر، لأن الخطر بتاع الـ T2DM عالي على طول.
          - ولو طلع **prediabetes** نتدخل بدري بـ **intensive lifestyle** أو **metformin** قبل ما يبقى سكر.

          وليه OGTT مش A1C بعد الولادة؟ التفسير المقبول (مش في الكتاب): بعد الولادة فيه نزيف وكرات حمرا جديدة، فالـ A1C بيبان أوطى من الحقيقة، والـ OGTT بيقيس قدرة البنكرياس على تحمّل glucose دلوقتي، وده بالظبط السؤال. وفي الحمل الجاي الست دي بتتفحص بدري من أول زيارة، لأن احتمال الـ GDM يرجع عالي.
      - kind: check
