      - kind: explain
        page: 106
        quote: "Supragastric belching is considered as an unintentional reaction to unpleasant feeling in the abdomen and/or retrosternal region which does not happen during sleep, speech, or during patient's distraction."
        title: "الـ supragastric: سلوك من غير قصد"
        text: |
          الـ ==supragastric belching== **unintentional reaction** لإحساس مزعج في البطن أو ورا القص، وعلشان كده **مش بيحصل** في النوم أو الكلام أو لما المريض يتلهي.

          آليتين: **air suction** (الحجاب الحاجز بيعمل negative pressure، والـ upper esophageal sphincter (UES) يفتح، فالهوا يتشفط) و **air injection**.

          أما الـ ==gastric belching== فهو **gastric venting**: الـ TLESR بتطلّع الهوا اللي اتبلع علشان البطن ما تنتفخش، وبيزيد بعد الـ carbonated beverages.
      - kind: explain
        page: 107
        quote: "It is a physiological mechanism and triggers by gastric extension which happens in average of 30 times in 24 h, more frequently after consumption of carbonated beverages."
        title: "الـ gastric belching: صمام أمان"
        text: |
          الكتاب: الـ ==gastric belching== هوا بيطلع فجأة من المعدة عن طريق **transient relaxation of the LES (TLESR)**، وده ==gastric venting mechanism== بيمنع البطن تنتفخ زيادة من الهوا اللي اتبلع.

          - **Physiological**، بيتحفّز بتمدد المعدة، في المتوسط **30 مرة في 24 ساعة**، وأكتر بعد الـ **carbonated beverages**.
          - الـ neurotransmitters اللي بتتحكم في عدد الـ TLESRs: **GABA**، **metabotropic glutamate receptors**، **cannabinoid receptor 1**، **nitric oxide**، و **cholecystokinin**.

          التفسير المقبول (مش في الكتاب): يعني المعدة زي حلّة الضغط، ليها صمام بيفتح لوحده لما الضغط يزيد. علشان كده الحاجة الساقعة الفوّارة بتطلّع تكريع: الغاز بيمدد المعدة، فالصمام يفتح. ده **مش** مرض، ده الجسم بيحمي نفسه.
      - kind: explain
        page: 107
        quote: "Perhaps this can be explained by the notion that PPIs reduce the unpleasant abdominal or retrosternal sensation that triggers the behavior and leads to supragastric belching."
        title: "التكريع مع الـ GERD والـ FD والـ rumination"
        text: |
          الكتاب:
          - **GERD**: الـ PPIs بتقلّل عدد التكريعات كمان. والتفسير اللي الكتاب بيقترحه: الـ PPI بيقلّل **الإحساس المزعج** في البطن أو ورا القص، اللي هو نفسه اللي بيحفّز سلوك الـ supragastric belching.
          - **Functional dyspepsia**: التكريع شكوى شائعة، ومرضى الـ FD عندهم **gas reflux symptoms** أكتر.
          - **Rumination**: ==recurrent unintentional regurgitation== لأكل اتاكل قريب. الآلية: **habitual contracture** لعضلات البطن الإرادية، فالضغط جوه المعدة يزيد ويزق المحتوى للمريء ولفوق.

          التفسير المقبول (مش في الكتاب) للربط: الـ supragastric belching **ردّ فعل** على إحساس مزعج (زي ما الكتاب قال ص 106). فأي حاجة تقلّل الإحساس ده (PPI للحمض مثلًا) بتقلّل التكريع. ودي نفس فكرة العلاج النفسي: مش بنقفل الصمام، بنشيل السبب اللي بيخلّي المريض يشفط الهوا.
      - kind: sort
        page: 108
        quote: "Criteria for diagnosis of supragastric belching is a rapid antegrade movement of gas (impedance of 1000 Ω), followed by retrograde expulsion back to the baseline impedance level."
