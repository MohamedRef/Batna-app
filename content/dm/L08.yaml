  # ---------- p100-102: GI, GL ----------
  - id: dm.L08.052
    kind: card
    topic: gi
    front: Define the glycemic index (GI).
    back: A number associated with a food that shows its effect on blood glucose, compared with pure glucose, which is 100.
    src: { page: 100, quote: "The glycemic index (GI) is a number associated with a particular type of food that indicates the food‘s effect on a person‘s blood glucose level." }
    status: unverified
    tags: [high-yield]
  - id: dm.L08.053
    kind: cloze
    topic: gi
    text: "The GI reference value is {{c1::100}}, an equivalent amount of pure {{c2::glucose}}."
    src: { page: 100, quote: "A value of 100 represents the standard, an equivalent amount of pure glucose." }
    status: unverified
    tags: [numbers]
  - id: dm.L08.054
    kind: card
    topic: gi
    front: Which foods have a high GI and which a low GI?
    back: "High GI: carbohydrates that break down quickly and release glucose rapidly. Low GI: carbohydrates that break down slowly and release glucose gradually."
    src: { page: 100, quote: "Foods with carbohydrates that break down quickly during digestion and release glucose rapidly into the bloodstream tend to have a high GI" }
    status: unverified
