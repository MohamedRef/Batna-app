- kind: new
  ar_eg: "في تمرين «صنّف» بقيت تقدر تسحب الكارت وتحطه في خانته (على الموبايل: دوس مطوّل واسحب)، والدوس العادي لسه شغال."
  en: "Sort steps support drag and drop (long-press and drag on a phone); tap-then-bin still works."
- kind: fixed
  ar_eg: "أسماء الخانات والكروت الطويلة في «صنّف» بقت تتلف جوه الخانة بدل ما تطلع برّه، والخانات بقت صفوف مرتبة على الموبايل وفيها عدد الكروت."
  en: "Long bin and card names in sort steps wrap inside their boxes; bins stack neatly on phones and show how many cards they hold."
