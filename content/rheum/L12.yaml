  - { id: classification, title: "ILAR categories of JIA" }
  - { id: oligo, title: "Oligoarticular JIA" }
  - { id: poly, title: "Polyarticular JIA" }
  - { id: systemic, title: "Systemic onset JIA" }
  - { id: psoriatic, title: "Juvenile psoriatic arthritis" }
  - { id: era, title: "Enthesitis-related arthritis" }
  - { id: labs, title: "Laboratory findings" }
  - { id: prognosis, title: "Prognosis and eye screening" }
