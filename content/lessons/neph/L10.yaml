          - { text: "Ampicillin", bin: 1 }
          - { text: "Nitrofurantoin", bin: 1 }
          - { text: "Oral cephalosporins", bin: 1 }
        why: "ابعد عن tetracycline و trimethoprim و sulphonamides و quinolones. ينفع amoxicillin و ampicillin و nitrofurantoin و oral cephalosporins."
