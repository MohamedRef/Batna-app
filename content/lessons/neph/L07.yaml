        quote: "Women who have multiple pregnancies or who have used oral contraceptives (OCs) or estrogen replacement therapy (ERT) in the postmenopausal period may have worse disease."
        prompt: "ليه الكبد الـ polycystic أوحش في الستات اللي حملوا كتير أو خدوا estrogen، وليه الأعراض بقت أكتر الأيام دي؟"
        answer: |
