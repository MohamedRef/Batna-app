      - kind: explain
        page: 98
        quote: "Dysphagia is an alarm symptom when it is accompanied by reflux symptoms and prompts an endoscopic evaluation."
        title: "الـ functional dysphagia: استبعد الأول"
        text: |
          الكتاب:
          - الـ dysphagia مع **reflux symptoms** تبقى ==alarm symptom== ولازم **endoscopy**.
          - المريض بيوصفها إحساس إن الأكل الـ **solid أو liquid** بيقف في الصدر وهو نازل.
          - الـ functional dysphagia، زي باقي الـ functional، ==diagnosis of exclusion==.
          - الأدوات (لما تكون محتاجها): **upper endoscopy**، **barium swallow**، **PPI trial**، **esophageal manometry**، و **video swallow study**.

          التفسير المقبول (مش في الكتاب) لكل أداة: الـ endoscopy للـ mucosa (esophagitis، stricture، cancer)، الـ barium للشكل والـ rings الصغيرة، الـ PPI trial لو الـ reflux هو السبب، الـ manometry للـ achalasia والـ spasm، والـ video swallow للمشاكل العالية في الـ pharynx. لما كلهم يطلعوا سليمين، ساعتها بس تقول functional.
      - kind: explain
        page: 99
        quote: "Empiric dilation with 14–18 mm dilators has been described in patients with nonobstructive dysphagia with relatively good outcomes ."
        title: "الـ functional dysphagia: تشخيص وعلاج"
        text: |
          الـ dysphagia مع **reflux symptoms** تبقى ==alarm symptom== ولازم endoscopy.

          الـ functional dysphagia **diagnosis of exclusion**: EGD، barium swallow، PPI trial، manometry، و **video swallow** لو المشكلة proximal (cricopharyngeal bar، Zenker's).

          العلاج:
          - **Reassurance**، مضغ كويس، وبلاش الأكل اللي بيعمل الأعراض.
          - **Low-dose trazodone** أو TCAs أو SSRIs، لأن الإحساس جوه المريء نفسه abnormal.
          - ==Empiric dilation== بـ **14–18 mm** dilators، ونتايجها كويسة نسبيًا.
          - **Botulinum toxin** لـ localized motility disorder مش achalasia، والفايدة مؤقتة.
      - kind: figure
        page: 99
        quote: "Diagnostic Algorithm for Dysphagia."
        title: "الـ algorithm بتاع الـ dysphagia"
        image: { file: git/L03-dysphagia-algorithm.webp, book: true }
        alt: "Book flow chart for dysphagia: rule out non-esophageal causes and do EGD with or without barium swallow; intrinsic structural lesions are found or, if negative, ask about reflux symptoms (yes: PPI trial; response means GERD). Otherwise a motility study finds achalasia, DES or absent peristalsis; if negative, proximal dysphagia gets a video swallow, and the rest is functional dysphagia."
        caption: |
          الـ ==functional dysphagia== في آخر السلّم: بعد ما تستبعد الـ **structural lesions** بالـ EGD أو barium، والـ **GERD** بالـ PPI trial، والـ **achalasia أو DES** بالـ motility study.

          ولو الـ dysphagia **proximal**، اعمل **video swallow** علشان الـ cricopharyngeal bar والـ Zenker's.
