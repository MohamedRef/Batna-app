        title: "العلاج"
        quote: "Endoscopic treatmentis recommended if diagnosis is confirmed. If no diagnosis treatment with oral or IV iron."
        text: |
          - لقيت السبب ← ==endoscopic treatment==.
          - ما لقيتش ← **oral أو IV iron**.
          - النزيف مستمر أو بيرجع ← فكّر في **somatostatin**، **iron**، **antiangiogenesis**.

          ليه **somatostatin**؟ التفسير المقبول (مش في الكتاب): بيقلل الدم الواصل للأمعاء (splanchnic blood flow)، فالأوعية الهشة تنزف أقل. والـ **iron** عشان يعوّض اللي ضاع لما المصدر ما يتلاقاش أو يفضل ينزف شوية.
