          - "الـ lithium safe بس مش first line هنا."
      - kind: explain
        page: 79
        quote: "Late onset depression, when accompanied with cognitive dysfunction, converts to dementia during follow-up (up to 10 years)"
        title: "الاكتئاب والـ dementia"
        text: |
          - فيه **symptomatic overlap** كبير.
          - ==Late onset depression== مع cognitive dysfunction ممكن **converts to dementia** (لحد 10 سنين).
          - الـ cognitive dysfunction في الاكتئاب غالبًا **persists** بعد الـ remission.
          - علشان كده الكتاب بيقول: ابعد عن كلمة **pseudodementia** (و pseudodepression).
      - kind: explain
        page: 80
        quote: "One point for \"No\" to questions 1, 5, 7, 11, 13 One point for \"Yes\" to other questions"
        title: "الـ GDS-15"
        text: |
          الـ ==Geriatric Depression Scale== (15 سؤال، Yes/No):
          - نقطة لـ **No** في 1، 5، 7، 11، 13 (الأسئلة الإيجابية: راضي؟ مبسوط؟ مليان طاقة؟).
          - نقطة لـ **Yes** في الباقي.
          - **Normal 3 ± 2**، **mild 7 ± 3**، **very depressed 12 ± 2**.

          وفيه scales تانية: CES-D، WHO-5، MADRS، HAMD، DMAS.
      - kind: explain
        page: 80
        quote: "late –life suicide prevention efforts focus on adequate recognition and treatment of depression."
        title: "ليه مابيتعالجش؟"
        text: |
          - أغلبهم مش بياخدوا **optimal meds**، وأقل من **10%** بياخدوا psychotherapy فعّالة.
          - **Stigma**: بيتشاف «moral weakness» أو ضعف شخصية.
          - بيرفضوا الـ referral وبيوقفوا العلاج.

          وعلاج الاكتئاب في الـ primary care قلّل الـ **suicide**، فالـ ==suicide prevention== عند الكبار = اكتشف وعالج الاكتئاب.
      - kind: explain
        page: 82
        quote: "60-80% respond to medications if prescribed according to guidelines."
        title: "العلاج"
        text: |
          - **Start low, go slow**: 25-50% من الجرعة المعتادة.
          - ==SSRIs== أفضل: effective وأقل toxicity.
          - **60-80%** بيستجيبوا؛ الفايدة الكاملة **4-6 weeks**؛ نصهم بيستجيب لأول دوا.
          - كمّل **at least 6 months** (الـ relapse لحد سنتين أو أكتر).
          - **Benzodiazepines/neuroleptics**: مؤقت بس (psychosis، suicidality، أرق شديد).
          - **Lithium** و**ECT**: safe and efficacious زي الشباب.
