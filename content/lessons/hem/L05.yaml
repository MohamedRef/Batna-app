  - id: hem.L05.lesson2
    title: "PT ولا APTT؟ التحليل بيقولك العيب فين"
    hook: "تلات تحاليل بسيطة بيقولولك العيب في أنهي نهر، قبل ما تطلب أي factor assay."
    minutes: 8
    pages: [73, 74]
    topics: [screening, deficiencies]
    goals:
      - "تقرا الـ TT والـ PT والـ APTT وتعرف كل واحد بيشوف أنهي حتة"
      - "تعدّ الـ congenital والـ acquired deficiencies"
    status: unverified
    steps:
      - kind: figure
        page: 73
        quote: "Hemophilia, christinas"
        title: "كل تحليل بيشوف حتة"
        alt: "The cascade drawn as three zones. PT covers the extrinsic factor VII plus the common pathway. APTT covers the intrinsic factors XII, XI, IX, VIII plus the common pathway. Thrombin time covers only fibrinogen to fibrin."
        caption: "الـ **PT** بيشوف VII + الـ common، والـ **APTT** بيشوف XII و XI و IX و VIII + الـ common، والـ ==thrombin time== بيشوف آخر خطوة بس (fibrinogen ← fibrin). عشان كده الـ hemophilia بتطوّل الـ APTT لوحده."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="140" height="80" rx="10" class="fg-acc"/>
            <text x="80" y="32" text-anchor="middle" class="t-sm t-b">APTT</text>
            <text x="80" y="52" text-anchor="middle" class="t-sm">XII, XI</text>
            <text x="80" y="70" text-anchor="middle" class="t-sm">IX, VIII</text>
            <rect x="180" y="10" width="140" height="80" rx="10" class="fg-good"/>
            <text x="250" y="32" text-anchor="middle" class="t-sm t-b">PT</text>
            <text x="250" y="52" text-anchor="middle" class="t-sm">VII</text>
            <text x="250" y="70" text-anchor="middle" class="t-sm">(+ tissue factor)</text>
            <rect x="60" y="110" width="210" height="60" rx="10" class="fg-ink"/>
            <text x="165" y="132" text-anchor="middle" class="t-sm t-b">Common: X, V, II</text>
            <text x="165" y="152" text-anchor="middle" class="t-sm t-mut">long PT and long APTT</text>
