      - kind: case
        page: 81
        quote: "Infections may also injure tissues and release antigens that are normally sequestrated from the immune system. Example of some sequestrated antigens (eye & testis) are normally not seen by the immune system, release of these antigens may initiate an autoimmune reaction against the tissue.\n  Take home message."
        stem: "A man has a penetrating injury to his right eye. Weeks later, his left eye becomes inflamed."
        steps:
          - question: "Best explanation from the lecture?"
            options: ["Release of a sequestered antigen", "HLA-B27", "Failure of central B tolerance", "Ignorance"]
            answer: 0
            why: "الـ eye antigens **sequestered**: المناعة عمرها ما شافتها، فما اتعملهاش tolerance. الإصابة طلّعتها، فالمناعة هاجمت العينين الاتنين."
      - kind: explain
        page: 82
        title: "الـ take-home message"
        quote: "Immunologic tolerance is specific unresponsiveness to an antigen induced by exposure of lymphocytes to that antigen. All individuals are tolerant or (unresponsive to) their own (self) antigens."
        text: |
          - **Immunologic tolerance** = ==specific unresponsiveness== لـ antigen، بتتعمل لما الـ lymphocytes تتعرّض له. وكلنا tolerant لـ self antigens بتوعنا.
          - ممكن نعمل tolerance بإعطاء الـ antigen بطريقة معيّنة: علاج immunologic diseases ومنع الـ transplant rejection.
          - الـ **autoimmune diseases** = **failure of self tolerance**، وعواملها: immunologic abnormalities و susceptibility genes و infections.
          - أقوى ارتباط بين الـ **human leukocyte antigen (HLA) genes** والـ **T cell–mediated** autoimmune diseases.

          التفسير المقبول (مش في الكتاب): ليه الرسالة دي مهمة للعلاج؟ عشان لو الـ autoimmunity هي **فشل الـ tolerance**، يبقى العلاج المثالي إنك **ترجّع الـ tolerance** لـ antigen معيّن بدل ما تكبت المناعة كلها. وده سبب إن الكتاب بيقول الـ tolerance induction بتتجرّب في الـ allergy والـ transplant.
