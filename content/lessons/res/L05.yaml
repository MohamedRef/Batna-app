        question: "Which is INCORRECT about a case-control study?"
        options:
          - "Many risk factors can be studied at the same time"
          - "It proceeds from outcome to exposure"
          - "The temporal relationship is not known"
          - "Several possible outcomes can be studied"
        answer: 3
        why:
