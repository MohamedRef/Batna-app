  - id: git.L03.lesson10
    title: "ألم الصدر: القلب الأول، وبعدين المريء"
    hook: "ألم ضاغط في نص الصدر بيروح للدراع. القلب طلع سليم. ليه المريء بيعمل نفس الألم، وإزاي نوصل للتشخيص؟"
    minutes: 8
    pages: [92, 95]
    topics: [heartburn, chest-pain]
    goals:
      - "تلخّص علاج الـ functional heartburn وليه الأفضل محافظ"
      - "تعرف أسباب الـ esophageal chest pain الأكيدة والمحتملة"
      - "تمشي على الـ algorithm من القلب لحد الـ functional chest pain"
    status: unverified
    steps:
      - kind: explain
        page: 92
        quote: "In summary, there is no strong evidence-based treatment available for functional heartburn."
        title: "علاج الـ functional heartburn: الأدوية والخلاصة"
        text: |
          الكتاب:
          - لأن المشكلة **heightened esophageal sensitivity**، الـ **pain modulators** زي **TCAs** و **SSRIs** ممكن تفيد.
          - بس مش واضح من الأدلة الحالية إن الـ SSRIs فعّالة في الـ functional heartburn.
          - الـ **tegaserod** (serotonin type 4 partial agonist) قلّل الأعراض اللي بتطلع من منبّهات mechanical أو chemical.
          - الخلاصة: ==no strong evidence-based treatment==، ودكاترة كتير بيستخدموا SSRIs أو **CBT** رغم ضعف الأدلة.

          والأهم: الـ natural history مش واضح، بس الأرجح إن المسار **benign**. فأحسن approach: **reassurance**، تغيير الـ lifestyle، علاج الـ psychosomatic illness، و ==الأدوية اللي ليها side effects للـ debilitating symptoms بس==.

          التفسير المقبول (مش في الكتاب): لما المرض benign والعلاج ضعيف الأدلة، الدوا اللي ليه أعراض جانبية ممكن يبقى أوحش من المرض. علشان كده الطمأنة هنا علاج فعلي مش مجاملة.
      - kind: check
        page: 92
        quote: "Giving reassurance, making lifestyle changes and addressing underlying psychosomatic illnesses, reserving treatments with side effects to only those with debilitating symptoms may be the best therapeutic approach"
        question: "A 30-year-old with mild functional heartburn asks for a strong medicine. What does the lecture call the best approach?"
        options:
          - "Reassurance and lifestyle changes; drugs with side effects only if debilitating"
          - "Double-dose PPI indefinitely"
          - "Anti-reflux surgery"
          - "High-dose SSRI for everyone"
        answer: 0
        why:
          - "صح: الكتاب: reassurance، lifestyle، علاج الـ psychosomatic، والأدوية ذات الـ side effects للـ **debilitating symptoms** بس."
          - "الحمض طبيعي أصلًا، فالـ PPI مش هيفيد."
          - "الكتاب ما ذكرش جراحة، ومفيش reflux مرضي."
          - "الكتاب: مش واضح إن الـ SSRIs فعّالة هنا."
      - kind: explain
        page: 93
        quote: "Rule out life-threatening conditions (eg, ischemic heart disease)."
        title: "Esophageal chest pain: الأساسيات"
        text: |
          الكتاب، **essentials of diagnosis**:
          - أعراض ==chronic==.
          - استبعد الـ **life-threatening** (زي ischemic heart disease).
          - استبعد **panic disorder** والأمراض النفسية القريبة، والـ **musculoskeletal**.
          - الأسباب الأكيدة: **reflux esophagitis**، **achalasia**، **diffuse esophageal spasm**.
          - الأسباب المحتملة: **hypertensive esophageal motor disorders**، **sustained longitudinal muscle contraction**، و **esophageal hypersensitivity**.

          والشكل: **pressure-type** في نص الصدر، بيروح للضهر أو الدراعات أو الفك.

          التفسير المقبول (مش في الكتاب) للترتيب: الشكل ده نفس وصف الـ angina بالظبط، فأول غلطة ممكنة إنك تقول «مريء» على قلب. علشان كده الترتيب بيبدأ بالحاجة اللي **تموّت** (القلب)، وبعدين اللي **بتتعالج بسهولة** (reflux)، وفي الآخر الـ functional.
      - kind: explain
        page: 94
        quote: "This overlap is due to the spinal primary sensory afferent that carries cardiac and esophageal nociceptive information and also innervates common cutaneous segments."
        title: "Chest pain: القلب الأول دايمًا"
        text: |
          أول خطوة في الـ esophageal chest pain: ==rule out life-threatening conditions== زي ischemic heart disease، وبعدها panic disorder والـ musculoskeletal causes.

          ألم المريء بيشبه القلب: **pressure** في نص الصدر بيروح للضهر والدراعات والفك. السبب إن نفس الـ **spinal primary sensory afferent** شايل إشارات القلب والمريء.

          - **Well-accepted causes:** reflux esophagitis (==the most common==)، achalasia، diffuse esophageal spasm.
          - **Probable causes:** hypertensive motility (nutcracker esophagus)، sustained longitudinal muscle contraction، esophageal hypersensitivity.
      - kind: explain
        page: 94
        quote: "Until recently, it is recommended that patients with noncardiac chest pain be placed empirically on a PPI, usually twice daily for 4 weeks."
        title: "PPI الأول ولا منظار الأول؟"
        text: |
          الكتاب:
          - الـ **noncardiac chest pain** مرتبط بالـ **GERD** أكتر من الـ esophageal spasm.
          - لحد قريب: **PPI empiric مرتين في اليوم لمدة 4 أسابيع**.
          - لو الأعراض فضلت: نستبعد الـ GERD والـ motility disorders بـ **endoscopy**، و **pH أو impedance-pH** مع **symptom association**، و **manometry**، فنوصل لـ ==functional chest pain of presumed esophageal origin==.
          - بس ==it may be prudent== نبدأ بـ endoscopy و pH monitoring **قبل** الـ PPI trial.

          التفسير المقبول (مش في الكتاب) للتغيير ده: لو بدأت بالـ PPI والمريض اتحسن جزئيًا، هتفضل محتار: GERD ولا لأ؟ ولو عايز تعمل pH بعدها لازم توقف الـ PPI أسبوع تاني. البداية بالـ endoscopy والـ pH بتدّيك إجابة واضحة من الأول.

          والأسباب الأكيدة: **reflux esophagitis** (==most common cause== of noncardiac chest pain)، والـ **achalasia** والـ **diffuse esophageal spasm**. والمحتملة: **nutcracker esophagus**، **hypertensive LES**، **hypercontracting LES**، الـ longitudinal contraction، وعيوب الـ sensory nerves والـ pain perception.

          يعني الخلاصة العملية: لو تقدر تعمل منظار و pH بسهولة، ابدأ بيهم علشان التشخيص يبقى واضح من أول مرة.
      - kind: explain
        page: 95
        quote: "Diagnostic Algorithm for Functional Chest Pain of Presumed Esophageal Origin"
        title: "الـ algorithm في سطور"
        text: |
          الـ **algorithm** في الكتاب (ص 95):
          1. **Cardiac evaluation**: history، **ECG**، **stress test**، **coronary angiography**. لو abnormal ← cardiac chest pain.
          2. لو طبيعي ← **noncardiac chest pain**: **EGD**. لو فيه **erosive esophagitis** ← PPI.
          3. لو طبيعي أو قريب منه ← **ambulatory pH (off PPI)**. لو **AET** عالي أو **symptom association** إيجابي ← GERD (nonerosive) أو hypersensitivity.
          4. لو سلبي ← **motility study**. لو achalasia أو DES ← علاجهم.
          5. لو سلبي ← ==functional chest pain of presumed esophageal origin==. ولو برضه مفيش حاجة: **chronic chest pain of unknown origin**، وفكّر في **panic disorder** و trigger points.

          التفسير المقبول (مش في الكتاب): يعني كل خطوة بتستبعد سبب **ليه علاج**، بالترتيب من الأخطر للأسهل علاجًا. والـ functional بيتقال في الآخر بس، لما كل اللي ممكن يتعالج بشكل محدد يطلع سليم.
      - kind: figure
        page: 95
        quote: "Diagnostic Algorithm for Functional Chest Pain of Presumed Esophageal Origin"
        title: "الـ algorithm بتاع الـ functional chest pain"
        image: { file: git/L03-chest-pain-algorithm.webp, book: true }
        alt: "Book flow chart: non-cardiac chest pain goes to EGD; erosive esophagitis LA grades B-D means GERD, titrate PPI. Normal or LA grade A goes to ambulatory pH study off PPI; a positive acid exposure or symptom association means GERD. If negative, a motility study: achalasia or DES, otherwise functional chest pain of presumed esophageal origin."
        caption: |
          نفس الخطوات اللي فاتت في رسمة: **EGD**، وبعدين **pH study (off PPI)**، وبعدين **motility study**. كل مرحلة بتشيل سبب، واللي يفضل في الآخر هو ==functional chest pain==.
      - kind: figure
        page: 95
        quote: "Chronic Chest Pain of Unknown Origin (CPUO)"
        title: "الصورة الأوسع: chest pain سببه مش معروف"
        image: { file: git/L03-cpuo-algorithm.webp, book: true }
        alt: "Book flow chart for chronic chest pain of unknown origin: cardiac evaluation first; if normal, noncardiac chest pain splits into esophageal (EGD, 24-hour pH, manometry, hypersensitivity testing, each with its diagnosis and treatment), musculoskeletal trigger points, and panic disorder, anxiety or depression treated as psychosomatic."
        caption: |
          الرسمة التانية بتبدأ من بدري: ==cardiac evaluation== الأول (ECG، stress test، coronary angiography). لو طبيعي يبقى **noncardiac chest pain**، وليه 3 طرق: **esophageal**، **musculoskeletal** (trigger points)، و**panic, anxiety, depression**.

          وفي فرع الـ esophageal كل test ليه تشخيص وعلاج: EGD ← erosive esophagitis، pH ← nonerosive، manometry ← motor disorder، hypersensitivity testing ← **TCA**.
