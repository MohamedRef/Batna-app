        text: |
          الـ **management** algorithm في الكتاب: **كل** FSGS lesion ياخد ==RAS blockade== ± diuretics ± statin. الـ **primary** بس ياخد **prednisone 1 mg/kg/day** لمدة 4–8 أسابيع (لحد 16 لو البروتين بينزل)، وبعدين taper على 3 شهور. لو resistant أو toxicity أو dependence: ==calcineurin inhibitor (CNI)== (ابدأ واطي وحط حد أعلى)، والـ responders يفضلوا عليه **1–2 سنة** ويتقبل الـ partial remission. والـ **secondary**: عالج السبب، وفكّر في الـ overlap category لو ما ردش على الـ RAS blockade.

          ليه؟ التفسير المقبول (مش في الكتاب):
          - الـ **RAS blockade** بيوسّع الـ efferent arteriole فيقلل الضغط جوّه الـ glomerulus، وده بيفيد أي FSGS، primary أو adaptive.
          - الـ **steroids** بتشتغل على الـ **permeability factor** المناعي، فمالهاش لازمة في الـ adaptive أو الـ genetic، وبتأذي (سكر، وزن) من غير فايدة.
          - الـ **CNI** غير إنه immunosuppressant، بيثبّت الـ **cytoskeleton** بتاع الـ podocyte، علشان كده بيقلل البروتين حتى في حالات مش مناعية بالكامل.
          - والـ **monthly dipstick** بعد الـ remission لأن الـ relapse بيبان في البول قبل الـ edema.

          إزاي تعرف إن الـ FSGS adaptive من غير gene test؟ التفسير المقبول (مش في الكتاب): ثلاث علامات بتساعد: **الـ albumin طبيعي أو قريب** رغم الـ proteinuria، و **effacement segmental** في الـ EM (مش diffuse)، و **سبب واضح** (سمنة، كلية واحدة، ضغط). case 4 فيها الأولى: uPCR 1.13 و albumin 3.6. والعكس: albumin واطي جدًا مع effacement diffuse يرجّح primary يحتاج IS.
