  # ------------------------------------------------------------------
  - id: neph.L03.lesson3
    title: "نشيل المية إزاي؟ GDMT والـ stepped diuretics"
    hook: "سلّم بخمس درجات: كل ما الدرجة اللي قبلها تفشل، تطلع واحدة."
    minutes: 10
    pages: [75, 79]
    topics: [gdmt, volume, resistance]
    goals:
      - "تعرف الـ GDMT في الـ HFrEF وليه بيتساب في الـ dialysis"
      - "تعمل furosemide stress test وتقرأه"
      - "تمشي على Figure 6 و Table 9 وتفهم الـ diuretic resistance"
    status: unverified
    steps:
      - kind: explain
        page: 75
        title: "الـ GDMT: الخمسة اللي بيطوّلوا العمر"
        quote: "However, patients with HF and ESKD have been excluded from landmark trials of all these therapies."
        text: |
          في الـ **HFrEF** الخمسة دول بيقللوا الـ mortality: **beta-blockers**، **ARNIs**، **RAAS inhibitors**، **MRAs**، **SGLT2 inhibitors**.

          المشكلة: عيانين الـ ==HF and ESKD== **اتشالوا من الـ landmark trials** كلها. علشان كده الـ GDMT على الـ dialysis غالبًا **بيتساب أو ما بيتعليش** للـ target dose، بسبب safety و tolerability وقلة الـ data.
      - kind: table
        page: 75
        quote: "Digoxin May Improve symptoms, quality of life, and exercise tolerance in mild to moderate heart failure; no mortallty benefit Risks likely outweigh any potential benefits"
        title: "Table 7: على الـ dialysis ولا لأ"
        columns: [Drug, Off dialysis, On dialysis]
        rows:
          - ["Beta blockers", "↑ survival", "Uncertain; maybe symptoms"]
          - ["Loop diuretics", "Fewer symptoms", "Less weight gain if residual function"]
          - ["Digoxin", "Symptoms only; no mortality benefit", "Risks likely outweigh benefits"]
          - ["SGLT2i, ARNI", "↑ survival, fewer HF admissions", "Trials: DAPA-HF, EMPEROR, PARADIGM-HF"]
        hide: [[0, 2], [1, 2], [2, 2]]
      - kind: aside
        tone: exam
        page: 75
        quote: "CONSENSUS,SOLVD-Treatment.Val-HeFT,CHARM. RALES Trial,EMPHASIS-HF Trial,EPHESUS Trial"
        text: |
          خلي بالك: في Table 7 خانة **on dialysis** لـ ACEI/ARB و MRA و SGLT2i و ARNI مكتوب فيها **أسماء trials** بس (CONSENSUS، RALES، DAPA-HF، PARADIGM-HF…)، ودي trials على عيانين **مش على dialysis**. احفظ الأسامي كـ evidence للدوا، مش كإثبات فايدة على الغسيل.
      - kind: explain
        page: 76
        title: "Table 8: ICD و CRT"
        quote: "LVEF ≤ 35% Sinus rhythm with left bundle branch block and QRS ≥ 130 ms"
        text: |
          الاتنين محتاجين ==LVEF ≤35%== و **≥NYHA class 2** على علاج مناسب.

          - **ICD:** ≥**40 يوم** بعد الـ MI لو من غير revascularization، أو **3 شهور** لو اتعمله، و expected survival >**1 سنة**.
          - **CRT:** sinus rhythm مع **LBBB و QRS ≥130 ms**، أو **non-LBBB و QRS ≥150 ms**.
      - kind: explain
        page: 76
        title: "الـ furosemide stress test"
        quote: "measuring the urine output after a dose of 1.0 to 1.5 mg/kg of intravenous furosemide"
        text: |
          عيان عنده AKI: ادّيله ==1.0–1.5 mg/kg IV furosemide== وقيس البول.

          - أقل من **200 ml في أول 2 ساعة** ← risk أعلى لـ **progressive AKI** واحتمال **RRT**.
          - أقل من **600 ml في 6 ساعات** ← بيتنبأ بالحاجة لـ RRT في **stage III AKI**.
      - kind: reveal
        page: 76
        quote: "Patients who have a urine output <200 ml over the first 2 h are at increased risk of progressive AKI"
        prompt: "ليه الـ furosemide بيقيس صحة الـ tubules؟"
        answer: |
          الـ furosemide لازم **يتفرز** من الـ proximal tubule علشان يوصل الـ loop ويشتغل. لو الـ tubules سليمة هيوصل ويطلّع **urine output** كتير؛ لو مجروحة مش هيوصل والـ urine هيفضل قليل، فالعيان في risk لـ **progressive AKI**.

          فالـ test عامل زي **stress test للقلب**، بس للـ tubules. (الشرح فسيولوجي؛ الأرقام من الكتاب.)
      - kind: figure
        page: 77
        quote: "Escalating doses of loop diuretics are the first-line of therapy for volume removal, with combination diuretic therapy"
        title: "Figure 6: سلّم الـ volume management"
        alt: "A five-step ladder. Step 1: IV loop diuretic from prior dose, bolus for most, infusion if unstable. Step 2 if ineffective: increase loop dose, stepped infusion. Step 3: add second diuretic, thiazide first, spironolactone or tolvaptan second. Step 4: hemodynamic assessment, vasoactive therapy if low output. Step 5: hypertonic saline, RRT if poor response, SCUF for no or mild AKI, CRRT for severe AKI. Each step has an effective branch: continue."
        caption: "كل درجة: لو **effective** كمّل على نفس الجرعة؛ لو **ineffective** اطلع اللي بعدها. والهدف **3–5 l/day** بول."
        svg: |
          <svg viewBox="0 0 330 390" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L03d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="10" y="8" width="230" height="52" rx="8" class="fg-box"/>
            <text x="20" y="28" class="t-sm t-b">1. IV loop diuretic (prior dose)</text>
            <text x="20" y="46" class="t-sm">Bolus most; infusion if unstable</text>
            <rect x="10" y="84" width="230" height="52" rx="8" class="fg-acc"/>
            <text x="20" y="104" class="t-sm t-b">2. Increase loop dose</text>
            <text x="20" y="122" class="t-sm">Stepped infusion (Table 9)</text>
            <rect x="10" y="160" width="230" height="52" rx="8" class="fg-acc"/>
            <text x="20" y="180" class="t-sm t-b">3. Add second diuretic</text>
            <text x="20" y="198" class="t-sm">Thiazide 1st; spiro or tolvaptan 2nd</text>
            <rect x="10" y="236" width="230" height="52" rx="8" class="fg-bad"/>
            <text x="20" y="256" class="t-sm t-b">4. Hemodynamic assessment</text>
            <text x="20" y="274" class="t-sm">Vasoactive if low cardiac output</text>
            <rect x="10" y="312" width="230" height="70" rx="8" class="fg-bad"/>
            <text x="20" y="332" class="t-sm t-b">5. Hypertonic saline; RRT</text>
            <text x="20" y="350" class="t-sm">SCUF if no or mild AKI</text>
            <text x="20" y="368" class="t-sm">CRRT if severe AKI</text>
            <path d="M125 60V80" class="fg-arrow" marker-end="url(#L03d)"/>
            <path d="M125 136V156" class="fg-arrow" marker-end="url(#L03d)"/>
            <path d="M125 212V232" class="fg-arrow" marker-end="url(#L03d)"/>
            <path d="M125 288V308" class="fg-arrow" marker-end="url(#L03d)"/>
            <text x="132" y="74" class="t-sm t-mut">ineffective</text>
            <rect x="252" y="20" width="70" height="320" rx="10" class="fg-good"/>
            <text x="287" y="160" text-anchor="middle" class="t-sm t-b">Effective:</text>
            <text x="287" y="178" text-anchor="middle" class="t-sm">continue</text>
            <text x="287" y="196" text-anchor="middle" class="t-sm">regimen</text>
            <path d="M240 34H248" class="fg-arrow" marker-end="url(#L03d)"/>
            <path d="M240 110H248" class="fg-arrow" marker-end="url(#L03d)"/>
            <path d="M240 186H248" class="fg-arrow" marker-end="url(#L03d)"/>
            <path d="M240 262H248" class="fg-arrow" marker-end="url(#L03d)"/>
          </svg>
      - kind: table
        page: 78
        quote: "Stepped Diuretic Algorithm Used in the CARRESS-HF and AVOID-HF Trials"
        title: "Table 9: الـ stepped algorithm"
        columns: [Home furosemide, IV furosemide, Metolazone]
        rows:
          - ["≤80 mg/day", "40 mg + 5 mg/h", "0"]
          - ["81–160 mg/day", "80 mg + 10 mg/h", "5 mg QD"]
          - ["161–240 mg/day", "80 mg + 20 mg/h", "5 mg BID"]
          - [">240 mg/day", "80 mg + 30 mg/h", "5 mg BID"]
        hide: [[0, 1], [1, 1], [1, 2], [2, 1], [3, 1]]
      - kind: aside
        tone: tip
        page: 78
        quote: "the patient is moved to a higher diuretic dose if urine output is <3 l/day on the current dose"
        text: |
          الـ bolus تقريبًا ثابت (**40** وبعدين **80**)، والـ infusion بيطلع **5 ← 10 ← 20 ← 30 mg/h**. والـ metolazone: **0 ← QD ← BID ← BID**.

          تطلع درجة لو البول أقل من **3 l/day**. ولو لسه أقل من 3 بعد **step 4** ← ضيف **vasodilator أو inotrope**.
      - kind: mnemonic
        page: 79
        quote: "Reduced protein binding of loop diuretics due to hypoalbuminemia and metabolic acidosis."
        word: "BEST R"
        parts:
          - { key: "B", text: "Binding reduced: hypoalbuminemia, metabolic acidosis" }
          - { key: "E", text: "Excess sodium intake" }
          - { key: "S", text: "Secretion reduced: organic acids block the transporter" }
          - { key: "T", text: "Thiazide and mineralocorticoid receptor remodelling: distal Na reabsorption" }
          - { key: "R", text: "Rebound sodium reabsorption as the effect wears off" }
        hook: "الـ diuretic مش **BEST** مع الـ **R**enal failure: خمس أسباب للـ resistance."
      - kind: explain
        page: 79
        title: "إيه اللي بيساعد وإيه لأ"
        quote: "dopamine has not improved clinical or renal outcomes in patients with AKI."
        text: |
          - **Small-volume hypertonic saline:** ممكن يحسّن الـ diuretic response ووظيفة الكلى، غالبًا بتقليل الـ neurohormonal activation.
          - ==Dopamine==: ليه inotropic و direct kidney effects وممكن يزوّد البول، **بس ما حسّنش الـ clinical ولا الـ renal outcomes في الـ AKI**.
          - **Inotropes:** بس لو فيه **hypotension** أو دليل موضوعي على **low cardiac output**؛ الـ empirical use ممنوع علشان الـ toxicity.
      - kind: figure
        page: 79
        quote: "Clinical trials of ultrafiltration therapy"
        title: "دايرة الـ ultrafiltration"
        alt: "Blood leaves the patient, passes a rotary blood pump into a hollow-fiber filter, and returns to the patient. A second rotary pump on the ultrafiltrate side pulls fluid across the filter into a collection bag."
        caption: "الدم يطلع ← **rotary pump** ← **filter** ← يرجع للعيان. ومن الناحية التانية **pump** للـ **ultrafiltrate** يسحب المية للـ **collection bag**."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L03e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            <marker id="L03f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker></defs>
            <rect x="10" y="90" width="70" height="50" rx="10" class="fg-box"/>
