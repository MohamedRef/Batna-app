  # ---------- p40-41: challenges and polypharmacy ----------
  - id: geri.L03.001
    kind: card
    topic: challenges
    front: What is "homeostenosis"?
    back: The impaired physiological reserve of older patients, the first geriatric therapeutic challenge.
    src: { page: 40, quote: "Impaired physiological reserve in older patients- \"homeostenosis\"." }
    status: unverified
    tags: [high-yield]
  - id: geri.L03.002
    kind: enumerate
    topic: challenges
    prompt: List the geriatric therapeutic challenges.
    points:
      - Impaired physiological reserve (homeostenosis)
      - Multiple disease and multiple drug use
      - Non-specific or cryptic presentation
      - Rapid deterioration if untreated (age-associated loss of adaptability)
      - High incidence of complications of disease and treatment
    pass: 4
    src: { page: 40, quote: "Multiple disease and multiple drug use. Non-specific or cryptic presentation. Rapid deterioration if untreated (age-associated loss of adaptability)." }
    status: unverified
    tags: [high-yield]
  - id: geri.L03.003
    kind: cloze
    topic: challenges
    text: "Older patients deteriorate rapidly if untreated because of age-associated loss of {{c1::adaptability}}, and they have a high incidence of {{c2::complications}} of both disease and treatment."
    src: { page: 40, quote: "Rapid deterioration if untreated (age-associated loss of adaptability). High incidence of complications (of disease and treatment)." }
    status: unverified
  - id: geri.L03.004
    kind: mcq
    topic: challenges
    stem: "In the book's chart (May 1977), roughly what share of patients taking 16–20 drugs had side effects?"
    options:
      - "About 55%"
      - "About 5%"
      - "About 10%"
      - "About 25%"
    answer: 0
    why:
      - "Correct: the 16–20 bar reaches just over 50%; side effects climb steeply with the number of drugs."
      - "About 5% is the 0–5 drugs bar."
      - "About 10% is the 6–10 drugs bar."
      - "About 25–28% is the 11–15 drugs bar."
    src: { page: 40, quote: "Relationship between number of drugs and side effects" }
    status: unverified
    tags: [numbers]
  - id: geri.L03.005
    kind: card
    topic: challenges
    front: How does the percentage of patients with side effects change with the number of drugs taken?
    back: "It rises steeply: about 5% with 0–5 drugs, 10% with 6–10, about 28% with 11–15 and over 50% with 16–20 (May et al. 1977)."
    src: { page: 40, quote: "Relationship between number of drugs and side effects" }
    status: unverified
    tags: [high-yield, numbers]
  - id: geri.L03.006
    kind: card
    topic: challenges
    front: How does the number of prescribing physicians relate to drug side effects, and which drug group shows it most?
    back: "Drug side effects rise with the number of prescribing physicians, most of all for psychotropic drugs (about 17% with one prescriber to about 34% with five); NSAIDs and cardiovascular drugs rise less (Tamblyn 1996)."
    src: { page: 41, quote: "Number of prescribing physicians and risk of side effects" }
    status: unverified
    tags: [high-yield]
  # ---------- p41-43: pharmacokinetics ----------
  - id: geri.L03.007
    kind: enumerate
    topic: pk
    prompt: Name the four parts of pharmacokinetics in the lecture.
    points:
      - Absorption
      - Distribution
      - Metabolism
      - Clearance
    pass: 4
    src: { page: 41, quote: "Pharmacokinetics Absorption Distribution Metabolism Clearance" }
    status: unverified
  - id: geri.L03.008
    kind: card
    topic: pk
    front: Is drug absorption a practical problem in the elderly? What is the caveat?
    back: Usually not. The caveat is continuous tube feeding, which may reduce absorption.
    src: { page: 41, quote: "From a practical standpoint this is not usually a problem in the elderly Caveat: Tube feedings may reduce absorption if continuous" }
    status: unverified
    tags: [high-yield]
  - id: geri.L03.009
    kind: card
    topic: pk
    front: How does low serum albumin change drug distribution in the elderly?
    back: It changes the free versus bound proportion of drugs (more free drug for highly bound drugs).
    src: { page: 41, quote: "Low serum albumin -- results in changing the free vs. bound proportion of drugs" }
    status: unverified
  - id: geri.L03.010
    kind: cloze
    topic: pk
    text: "Increased body fat in the elderly increases the {{c1::half-life}} of {{c2::lipophilic}} drugs such as diazepam and anesthetics."
    src: { page: 42, quote: "Increased fat -- increases the half life of lipophylic drugs (e.g. diazepam, anesthetics)" }
    status: unverified
    tags: [high-yield]
  - id: geri.L03.011
    kind: mcq
    topic: pk
    stem: "Which age-related change in distribution does the lecture call the most important?"
    options:
      - "Decreased body water, lowering the Vd of polar drugs"
      - "Increased body fat"
      - "Decreased muscle mass"
      - "Increased alpha-1 acid glycoprotein"
    answer: 0
    why:
      - "Correct: less body water gives a lower Vd for polar (water-soluble) drugs, so levels run higher."
      - "Body fat rises and prolongs lipophilic drug half-life, but the book calls body water the most important change."
      - "Muscle mass falls, but it is not named the most important."
      - "It rises with age (p44 table) but is not the change the book singles out."
    src: { page: 42, quote: "Decreased body water -- the most important change, lower Vd. in polar drugs" }
    status: unverified
    tags: [high-yield]
  - id: geri.L03.012
    kind: enumerate
    topic: pk
    prompt: List the age-related changes that alter drug distribution in the elderly.
    points:
      - Low serum albumin (free vs bound proportion changes)
      - Increased fat (longer half-life of lipophilic drugs)
      - Decreased body water (lower Vd of polar drugs; the most important)
      - Decreased muscle mass
    pass: 3
    src: { page: 42, quote: "Decreased body water -- the most important change, lower Vd. in polar drugs Decreased muscle mass" }
    status: unverified
  - id: geri.L03.013
    kind: table
    topic: pk
    title: "Volume of distribution in geriatric patients"
    columns: [Drug type, Vd with age, Reason]
    rows:
      - ["Hydrophilic (Qo <0.3)", "Decreased", "Less body water"]
      - ["Lipophilic (Qo >0.5)", "Increased", "More body fat"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 46, quote: "Volume of distribution (Vd) - Hydrophilic drugs (Qo<0.3) ↓ - Lipophilic drugs (Qo>0.5) ↑" }
    status: unverified
    tags: [high-yield]
  - id: geri.L03.014
    kind: cloze
    topic: pk
    text: "Half-life (t1/2) is roughly proportional to {{c1::volume of distribution}} divided by {{c2::clearance}}."
    src: { page: 43, quote: "Half-life(t1/2) ≈ vol. of distribution(Vd) over clearance(CI)" }
    status: unverified
    tags: [high-yield]
  - id: geri.L03.015
    kind: card
    topic: pk
    front: Why does diazepam last much longer in an old person?
    back: "More body fat raises its Vd, and lower clearance (reduced phase I metabolism) adds to it; since t1/2 ≈ Vd / clearance, both lengthen the half-life."
    src: { page: 42, quote: "Increased fat -- increases the half life of lipophylic drugs (e.g. diazepam, anesthetics)" }
    status: unverified
  # ---------- p42-43: renal clearance ----------
  - id: geri.L03.016
    kind: cloze
    topic: renal
    text: "Renal function declines by about {{c1::one third}} with normal ageing; take care with {{c2::digoxin}} and gentamicin."
    src: { page: 43, quote: "Renal function declines by about 1/3 with normal ageing- NB- digoxin, gentamicin." }
    status: unverified
    tags: [high-yield, numbers]
  - id: geri.L03.017
    kind: card
    topic: renal
    front: Do normal renal function tests mean normal renal function in an old person?
    back: No. Serum creatinine is not a reliable measure; estimate clearance (Cockcroft-Gault).
    src: { page: 43, quote: "NB normal renal function tests do not mean normal renal function in the elderly." }
    status: unverified
    tags: [high-yield]
  - id: geri.L03.018
    kind: enumerate
    topic: renal
    prompt: Why is GFR lower in the elderly (renal clearance reduced)?
    points:
      - Decreased kidney size
      - Decreased tubular secretion
      - Decreased renal blood flow
    pass: 3
    src: { page: 42, quote: "Lower GFR (decreased: size, tubular secretion, renal blood flow)" }
    status: unverified
  - id: geri.L03.019
    kind: cloze
    topic: renal
    text: "Cockcroft-Gault: CrCl = ({{c1::140 − age}}) × body weight (kg) ÷ ({{c2::72}} × serum creatinine), × {{c3::0.85}} for women."
    src: { page: 42, quote: "(140-age) x body wt. (kg.) Cr cl. = 72 x Serum Cr. (x 0.85 for Women)" }
    status: unverified
    tags: [high-yield]
  - id: geri.L03.020
    kind: calc
    topic: renal
    calculator: cockcroft_gault
    stem: "An 85-year-old woman weighing 50 kg has a 'normal' serum creatinine of 1.0 mg/dl. Estimate her creatinine clearance."
    inputs: { age_years: 85, weight_kg: 50, creatinine_mg_dl: 1.0, sex: female }
    expect: "32.5 mL/min"
    interpret: "About 32 ml/min: a normal creatinine hides a clearance under a third of a young adult's, so renally cleared drugs need dose review."
    src: { page: 42, quote: "(140-age) x body wt. (kg.) Cr cl. = 72 x Serum Cr. (x 0.85 for Women)" }
    status: unverified
    tags: [high-yield]
  - id: geri.L03.021
    kind: calc
    topic: renal
    calculator: cockcroft_gault
    stem: "A 78-year-old man weighing 65 kg has a serum creatinine of 1.4 mg/dl. Estimate his creatinine clearance."
    inputs: { age_years: 78, weight_kg: 65, creatinine_mg_dl: 1.4, sex: male }
    expect: "40.0 mL/min"
    interpret: "About 40 ml/min, so digoxin, aminoglycosides and other renally cleared drugs need lower doses."
    src: { page: 42, quote: "Serum creatinine is not a reliable measure and Cockcroft-Gault is an estimate" }
    status: unverified
  - id: geri.L03.022
    kind: enumerate
    topic: renal
    prompt: List the drug groups with predominant renal elimination given in the lecture.
    points:
      - Aminoglycosides
      - "Antimycotics: fluconazole, flucytosine"
      - "Antivirals: acyclovir, ganciclovir, ribavirin"
      - "Beta-blockers: atenolol, sotalol"
      - "Beta-lactam antibiotics: penicillins, cephalosporins"
      - Digoxin
      - H2-blockers
      - Lithium
    pass: 6
    src: { page: 46, quote: "Betablockers: atenolol, sotalol Betalactam antibiotics: penicillins, cepha-losporins Digoxin H2-Blockers Lithium" }
    status: unverified
    tags: [high-yield]
  - id: geri.L03.023
    kind: mcq
    topic: renal
    stem: "Which beta-blocker is listed by the lecture as mainly renally eliminated, so its dose needs review when CrCl is low?"
    options:
      - "Atenolol"
      - "Propranolol"
      - "Metoprolol"
      - "Carvedilol"
    answer: 0
    why:
      - "Correct: atenolol and sotalol are the renally cleared beta-blockers in the list."
      - "Propranolol is a high-extraction hepatically metabolised drug (p45)."
      - "Metoprolol is a high-extraction hepatically metabolised drug (p45)."
      - "Carvedilol is hepatically metabolised and not in the renal list."
    src: { page: 46, quote: "Betablockers: atenolol, sotalol" }
    status: unverified
  # ---------- p42, 44-45: hepatic metabolism ----------
  - id: geri.L03.024
    kind: card
    topic: hepatic
    front: Why is liver drug metabolism reduced in the elderly?
    back: "Smaller liver, lower hepatic blood flow and disease such as CHF; biotransforming enzymes are generally reduced."
    src: { page: 42, quote: "Reduced liver function due to decreased liver size, blood flow, and disease (e.g. CHF)" }
    status: unverified
  - id: geri.L03.025
    kind: cloze
    topic: hepatic
    text: "With ageing, phase {{c1::I}} (oxidative) reactions in the liver are impaired even with normal ageing, while phase {{c2::II}} (conjugation) reactions are relatively spared."
    src: { page: 42, quote: "phase I reactions (oxidative) in the liver impaired even with normal ageing, phase II (conjugation reactions) - relatively spared." }
    status: unverified
    tags: [high-yield]
  - id: geri.L03.026
    kind: mcq
    topic: hepatic
    stem: "An 80-year-old needs a short course of a benzodiazepine. Which is preferred on metabolic grounds?"
    options:
      - "Oxazepam"
      - "Diazepam"
      - "Flurazepam"
      - "Chlordiazepoxide"
    answer: 0
    why:
      - "Correct: oxazepam (like lorazepam) needs only phase II conjugation, which is spared with age."
      - "Diazepam needs phase I oxidation and is lipophilic, so its half-life is much longer in the elderly."
      - "Flurazepam is a long-acting benzodiazepine with active phase I metabolites."
      - "Chlordiazepoxide is oxidised (phase I) to long-acting active metabolites."
    src: { page: 42, quote: "Phase II - drugs are preferred (oxazepam)" }
    status: unverified
    tags: [high-yield]
  - id: geri.L03.027
    kind: card
    topic: hepatic
    front: Which first-pass example does the lecture give for reduced phase I activity with age?
    back: Propranolol (first-pass oxidative/reduction activities are reduced).
    src: { page: 42, quote: "Phase I - first pass oxidative/reduction activities are reduced (e.g. propranolol)" }
    status: unverified
  - id: geri.L03.028
    kind: table
    topic: hepatic
    title: "Hepatic metabolism of lipophilic drugs"
    columns: [Phase, Reactions, Metabolites]
    rows:
      - ["Phase I (functional groups)", "Oxidation, reduction, hydrolysis", "Mostly active, potentially hepatotoxic"]
      - ["Phase II (conjugation)", "Glucuronidation, acetylation, methylation, sulfation", "Mostly inactive, not toxic"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 44, quote: "Phase I (introduction of functional groups) Oxidation Reduction Hydrolysis Most metabolites active and potentially hepatotoxic" }
    status: unverified
    tags: [high-yield]
  - id: geri.L03.029
    kind: enumerate
    topic: hepatic
    prompt: Name the phase II (conjugation) reactions in the lecture.
    points:
      - Glucuronidation
      - Acetylation
      - Methylation
      - Sulfation
    pass: 3
    src: { page: 44, quote: "Phase II (conjugation) Glucuronidation Acetylation Methylation Sulfatation" }
    status: unverified
  - id: geri.L03.030
    kind: table
    topic: hepatic
    title: "Dosing of hepatically metabolised drugs in geriatric patients"
    columns: [Drug type, How to dose]
    rows:
      - ["High extraction", "Initial dose ~50% lower; uptitrate; maintenance 30–50% lower"]
      - ["Low extraction, phase I and II", "Start with the maintenance dose; maintenance 30–50% lower"]
      - ["Low extraction, phase II only", "No change"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 45, quote: "High extraction drugs - reduce initial dose by approximately 50% - find appropriate maintenance dose by uptitration" }
    status: unverified
    tags: [high-yield]
  - id: geri.L03.031
    kind: cloze
    topic: hepatic
    text: "For high-extraction drugs in the elderly, reduce the initial dose by about {{c1::50%}}, find the maintenance dose by {{c2::uptitration}}; the maintenance dose is generally {{c3::30–50%}} lower."
    src: { page: 45, quote: "reduce initial dose by approximately 50% - find appropriate maintenance dose by uptitration - maintenance dose is generally reduced by 30-50%" }
    status: unverified
    tags: [numbers]
  - id: geri.L03.032
    kind: mcq
    topic: hepatic
    stem: "How should the dose of lorazepam, a low-extraction drug with phase II metabolism only, be changed in an older patient, according to the lecture's hepatic rules?"
    options:
      - "No change for hepatic reasons"
      - "Cut the initial dose by 50% and uptitrate"
      - "Start with the maintenance dose, reduced by 30–50%"
      - "Avoid it completely"
    answer: 0
    why:
      - "Correct: low-extraction drugs with phase II metabolism need no hepatic dose change (p45). Start-low-go-slow still applies for sensitivity (p50)."
      - "That is the rule for high-extraction drugs."
      - "That is the rule for low-extraction drugs with phase I and II metabolism."
      - "The table lists it as a phase II drug, the preferred kind."
    src: { page: 45, quote: "Low extraction drugs with phase II metabolism - No change" }
    status: unverified
  - id: geri.L03.033
    kind: card
    topic: hepatic
    front: Give examples of high-extraction (>0.5) drugs from the lecture.
    back: "Bromocriptine, chlorpromazine, clomethiazole, dihydroergotamine, diltiazem, metoclopramide, metoprolol, midazolam, morphine, nifedipine, propranolol, verapamil."
    src: { page: 45, quote: "Hepatic extraction of drugs" }
    status: unverified
  - id: geri.L03.034
    kind: mcq
    topic: hepatic
    stem: "Which of these is a low-extraction (<0.5) drug in the lecture's table?"
    options:
      - "Warfarin"
      - "Verapamil"
      - "Morphine"
      - "Propranolol"
    answer: 0
    why:
      - "Correct: warfarin is low extraction with phase I and II metabolism, like theophylline, phenytoin and diazepam."
      - "Verapamil is high extraction."
      - "Morphine is high extraction."
      - "Propranolol is high extraction."
    src: { page: 45, quote: "Hepatic extraction of drugs" }
    status: unverified
  - id: geri.L03.035
    kind: card
    topic: hepatic
    front: Which low-extraction drugs in the lecture's table rely on phase II metabolism only?
    back: Lorazepam and oxazepam. The rest (antidepressants, codeine, diazepam, isoniazid, neuroleptics, phenobarbital, phenytoin, procainamide, quinidine, theophylline, warfarin) use phases I and II.
    src: { page: 45, quote: "Hepatic extraction of drugs" }
    status: unverified
