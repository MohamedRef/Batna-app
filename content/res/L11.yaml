  - id: res.L11.085
    kind: mcq
    topic: probability
    stem: "When each member of a population has an equal chance of being selected in the sample, this is called:"
    options: [Quota sampling, Convenience sampling, Probability sampling, Snowball sampling, Judgmental sampling]
    answer: 2
    why:
      - Quota sampling fills a set number per category with no random selection.
      - Convenience sampling takes whoever is easiest to reach, so chances are not equal.
      - "Probability sampling: every unit has an equal, or at least a known, chance of being included (slide 15)."
      - Snowball sampling follows referrals from one informant to the next.
      - Judgmental (purposive) sampling picks informants on purpose.
    src: { page: 15, quote: "Each unit of the sample is chosen on the basis of chance.\nAll units of the study population should have an equal, or at least a known chance of being included in the sample.\nThat guarantee requires subjects to be selected at random, or that randomization be employed." }
    status: unverified
    tags: [revision]
