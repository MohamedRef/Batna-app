          - "فشل الـ target في 6 شهور = غيّر، متكمّلش."
          - "الـ steroids الطويلة أعراضها الجانبية مش مقبولة."
      - kind: explain
        page: 262
        title: "الـ footnotes اللي بتيجي في الامتحان"
        quote: "Phase III:\n  Change the bDMARD or JAK-inhibitor\n  Improved at 3 months and achieved target at 6 months? Yes: Continue → Dose reduction / interval increase in sustained remission; No: change again\nNotes:\n  1. 2010 ACR-EULAR classification criteria can support early diagnosis.\n  2. \"Methotrexate should be part of the first treatment strategy\". While combination therapy of csDMARDs is not preferred by the Task Force, starting with methotrexate does not exclude its use in combination with other csDMARDs although more adverse events without added benefit are to be expected, especially if MTX is combined with glucocorticoids.\n  3. The treatment target is clinical remission according to ACR-EULAR definitions or, if remission is unlikely to be achievable, at least low disease activity; the target should be reached after 6 months, but therapy should be adapted or changed if insufficient improvement (less than 50% of disease activity) is seen after 3 months.\n  4. Sustained remission: ≥ 6 months ACR/EULAR index based or Boolean remission.\n  5. Consider contraindications and risks. TNF-inhibitors (adalimumab, certolizumab, etanercept, golimumab, infliximab, including EMA/FDA approved bsDMARDs), abatacept, IL-6R inhibitors, or rituximab (under certain conditions); in patients who cannot use csDMARDs as comedication IL6-inhibitors and tsDMARDs have some advantages.\n  6. The following risk factors for cardiovascular events and malignancies must be considered when intending to prescribe a JAK-inhibitor: Age over 65 years, history of current or past smoking, other cardiovascular risk factors, other risk factors for malignancy, risk factors for thromboembolic events.\n  7. The most frequently used combination comprises methotrexate, sulfasalazine and hydroxychloroquine.\n  8. Dose reduction or interval increase can be safely done with all bDMARDs and tsDMARDs with little risk of flares; stopping is associated with high flare rates; most but not all patients can recapture their good state upon re-institution of the same bDMARD/tsDMARD, but before all this glucocorticoids must have been discontinued.\n  9. From a different or the same class."
        text: |
          - الـ **target**: clinical remission، ولو صعب يبقى على الأقل low disease activity، في **6 شهور**. لو التحسّن ==أقل من 50%== في 3 شهور غيّر.
          - **Sustained remission** = 6 شهور أو أكتر.
          - أشهر combination: **Methotrexate (MTX) + sulfasalazine + hydroxychloroquine**.
          - الـ biologic disease-modifying antirheumatic drug (bDMARD)/tsDMARD ممكن تقلّل جرعته أو تبعّد المسافة بأمان، بس **الإيقاف** بيعمل flares كتير، والـ steroids لازم تقف الأول.

          والـ steroids بتقف الأول لأن أعراضها الجانبية على المدى الطويل مش مقبولة (ص 264).
      - kind: aside
        tone: exam
        page: 262
        quote: "Phase III:\n  Change the bDMARD or JAK-inhibitor\n  Improved at 3 months and achieved target at 6 months? Yes: Continue → Dose reduction / interval increase in sustained remission; No: change again\nNotes:\n  1. 2010 ACR-EULAR classification criteria can support early diagnosis.\n  2. \"Methotrexate should be part of the first treatment strategy\". While combination therapy of csDMARDs is not preferred by the Task Force, starting with methotrexate does not exclude its use in combination with other csDMARDs although more adverse events without added benefit are to be expected, especially if MTX is combined with glucocorticoids.\n  3. The treatment target is clinical remission according to ACR-EULAR definitions or, if remission is unlikely to be achievable, at least low disease activity; the target should be reached after 6 months, but therapy should be adapted or changed if insufficient improvement (less than 50% of disease activity) is seen after 3 months.\n  4. Sustained remission: ≥ 6 months ACR/EULAR index based or Boolean remission.\n  5. Consider contraindications and risks. TNF-inhibitors (adalimumab, certolizumab, etanercept, golimumab, infliximab, including EMA/FDA approved bsDMARDs), abatacept, IL-6R inhibitors, or rituximab (under certain conditions); in patients who cannot use csDMARDs as comedication IL6-inhibitors and tsDMARDs have some advantages.\n  6. The following risk factors for cardiovascular events and malignancies must be considered when intending to prescribe a JAK-inhibitor: Age over 65 years, history of current or past smoking, other cardiovascular risk factors, other risk factors for malignancy, risk factors for thromboembolic events.\n  7. The most frequently used combination comprises methotrexate, sulfasalazine and hydroxychloroquine.\n  8. Dose reduction or interval increase can be safely done with all bDMARDs and tsDMARDs with little risk of flares; stopping is associated with high flare rates; most but not all patients can recapture their good state upon re-institution of the same bDMARD/tsDMARD, but before all this glucocorticoids must have been discontinued.\n  9. From a different or the same class."
        text: "قبل الـ **Janus kinase (JAK) inhibitor** اسأل عن: سن **فوق 65**، **التدخين** (حالي أو قديم)، cardiovascular (CV) risk، malignancy risk، و thromboembolic risk. ده سؤال امتحان أكيد."
      - kind: figure
        page: 262
        title: "خطوط العلاج"
        image: { file: rheum/L16-lines.webp, book: true }
        alt: "Slide titled Lines of treatment. Active RA leads to NSAIDs, plus or minus low-dose corticosteroids, plus at least one DMARD. These lead to remission. From remission, the NSAIDs and steroids are discontinued, and the DMARD goes on at a maintenance dose."
        caption: |
          - **فوق**: Active RA ← **NSAIDs** (± **low dose corticosteroids**) + ==at least one DMARD==.
          - **في النص**: الاتنين بيوصلوا للـ **Remission**.
          - **تحت**: من الـ remission، الـ NSAIDs والـ steroids ← **Discontinue**، والـ DMARD ← ==maintenance dose==.

          يعني الـ NSAIDs والـ steroids مسكّنات مؤقتة، والـ DMARD هو اللي بيفضل.
      - kind: explain
        page: 262
        title: "العلاج الطبيعي: مش رفاهية"
        quote: "Physical therapy is important\n 1- Passive movement to maintain full range of movement.\n 2- Graded exercise program.\n 3- Heat therapy: Warm pools — paraffin bath.\n 4- Rest splints for v. painful joints.\n 5- Surgery and rehabilitation may be needed."
        text: |
          الكتاب بيقول ==physical therapy is important==، وكل بند فيه بيرد على مشكلة شفناها:

          - **Passive movement** يحافظ على الـ full range. التفسير المقبول (مش في الكتاب): المفصل اللي ما بيتحركش يتلم بـ fibrous tissue ويتيبّس (افتكر الـ ankylosis).
          - **Graded exercise**: ضد الـ **muscle atrophy** جنب المفاصل (ص 243). Graded يعني بالتدريج علشان ما تولّعش الالتهاب.
          - **Heat** (warm pools، paraffin bath): التفسير المقبول (مش في الكتاب): الحرارة بترخّي العضلات وبتقلّل التيبّس فالحركة تبقى أسهل.
          - **Rest splints** للمفاصل اللي **بتوجع جدًا**: راحة مؤقتة تهدّي الالتهاب وتسند المفصل في وضع سليم.
          - **Surgery and rehabilitation** للي حصله ضرر خلاص.
      - kind: explain
        page: 263
        title: "الـ NSAIDs: مسكّن مش علاج"
        quote: "They control inflammation and pain (analgesic effect).\nThey do not prevent the structural damage."
        text: |
          بتهدّي الألم والالتهاب، بس ==مش بتمنع الـ damage==.

          - **COX-1** constitutive: بيحمي الـ gastric mucosa، والـ renal blood flow، والـ platelets.
          - **COX-2** induced في الالتهاب: وقفه هو اللي بيدّي الـ analgesic و anti-inflammatory و antipyretic.
          - الـ selective COX-2 (celecoxib، rofecoxib): مفيش ulcer risk زيادة، بس باقي الأعراض موجودة.

          علشان كده عمرها ما تبقى العلاج الأساسي: بتريّح العيان، بس الـ DMARD هو اللي بيحمي المفصل.
