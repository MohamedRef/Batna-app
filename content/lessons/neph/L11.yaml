    title: "قبل الحمل وأثناءه على الغسيل: aspirin، heparin، وكل دوا"
    hook: "ستة أسابيع قبل الحمل هي الفرق بين بيبي سليم وبيبي فيه تشوه."
    minutes: 10
    pages: [371, 374]
    topics: [dialysis-care]
    goals:
      - "تعرف الـ prenatal care وليه كل خطوة"
      - "تعرف مين محتاجة anticoagulation وليه"
      - "تفرّق الأدوية الآمنة من الممنوعة وتعرف السبب"
    status: unverified
    steps:
      - kind: explain
        page: 371
        title: "قبل وأثناء الحمل"
        quote: "Prenatal Care Preconception counseling on the higher risk of adverse maternal and fetal outcomes with pregnancy among women receiving maintenance dialysis is imperative. In women with autoimmune diseases, such as lupus nephritis, it is recommended to postpone conception until the disease is inactive for at least 6 months before conception to reduce the risks of adverse maternal and fetal outcomes.(51) Low-dose aspirin should be started by the end of the first trimester for all pregnant women receiving maintenance dialysis to reduce the risk of preeclampsia.(52) The recommended blood pressure (BP) goal during pregnancy is<140/90mm Hg.(53) Folic acid is removed with hemodialysis, and the dose should be increased to 5mg following conception.(54)"
        text: |
          - Lupus **هادي 6 شهور** قبل الحمل.
          - ==Low-dose aspirin== قبل آخر الـ first trimester ضد الـ preeclampsia.
          - **blood pressure (BP) <140/90**.
          - **Folic acid 5 mg**: عشان الغسيل بيشيله.
          - **Heparin أو low-molecular-weight heparin** (لحد 6 أسابيع بعد الولادة) لو nephrotic proteinuria، albumin واطي، antiphospholipid syndrome (APS)، أو thrombosis قبل كده.
          - الأدوية الـ teratogenic تقف **6 أسابيع** قبل الحمل، أو فورًا لو الحمل جه فجأة.
      - kind: explain
        page: 371
        title: "ليه كل خطوة من دول؟"
        quote: "Low-dose aspirin should be started by the end of the first trimester for all pregnant women receiving maintenance dialysis to reduce the risk of preeclampsia."
        text: |
          - **Lupus هادي 6 شهور:** عشان يقلل ==adverse maternal and fetal outcomes== (الكتاب). التفسير المقبول (مش في الكتاب): الـ lupus النشط بيهيج في الحمل وبيأذي المشيمة.
          - **Low-dose aspirin** قبل آخر الـ first trimester: عشان **preeclampsia** (الكتاب). التفسير المقبول (مش في الكتاب): بيقلل الـ thromboxane فالدم يمشي أحسن في المشيمة الصغيرة.
          - **Folic acid 5 mg:** الكتاب بيقول السبب صريح: ==removed with hemodialysis==.
          - **BP <140/90.**

          وليه الـ **anticoagulation** للي عندها nephrotic proteinuria أو albumin واطي؟ التفسير المقبول (مش في الكتاب): البول بيسرّب بروتينات مضادة للتجلط (زي الـ antithrombin)، والكبد بيعمل عوامل تجلط أكتر، والحمل نفسه hypercoagulable.
      - kind: explain
        page: 372
        title: "الـ immunosuppression: إيه يقف وإيه يكمّل"
        quote: "Immunosuppressive agents that are associated with teratogenicity, such as mycophenolate or cyclophosphamide, should be discontinued 6 weeks before planned conception to prevent fetal malformation and spontaneous pregnancy loss."
        text: |
          - **Mycophenolate** و **cyclophosphamide:** يقفوا ==6 weeks before== عشان التشوهات والإجهاض.
          - **Cyclophosphamide** أكتر من **10 g** تراكمي: قيّم الـ infertility بدري، ولو IVF: **single embryo transfer**. التفسير المقبول (مش في الكتاب): بيضرب المبيض، والحمل التوأم على الغسيل خطره مضاعف.
          - **Azathioprine:** ==first-line== بدل الـ mycophenolate.
          - **CNIs:** آمنين، بس لو الـ tacrolimus **unmonitored**: infection 22%، hypertension 56%، preeclampsia 32%، low birth weight 46%.
          - **Biologics** (infliximab، etanercept، adalimumab، rituximab): الشركات بتقول وقّفهم قبل الحمل لأن البيانات قليلة.
      - kind: aside
        tone: exam
        page: 372
        quote: "past should be assessed early for infertility, and, if assisted reproduction techniques are sought, single embryo transfer should be pursued. (53) Figure 3 outlines medications that are considered safe or contraindicated during pregnancy on maintenance dialysis. Immunosuppressive agents that are associated with teratogenicity, such as mycophenolate or cyclophosphamide, should be discontinued 6 weeks before planned conception to prevent fetal malformation and spontaneous pregnancy loss. (56) Azathioprine is the first-line agent to replace mycophenolate during pregnancy. Calcineurin inhibitors are other pregnancy-safe alternative agents that can be considered for immunosuppression, because they are not associated with an increased risk of pregnancy loss or congenital malformations.(56) However, especially tacrolimus, if unmonitored during pregnancy, can lead to complications including infection (22%), hypertension (56%), preeclampsia (32%), and low birth weight infants (46%).43 Evidence on the use of biological agents (infliximab, etanercept, adalimumab, and rituximab) during pregnancy is limited, and manufacturers recommend discontinuation of them before conception. Although rituximab has been associated with transient B cell depletion in mothers and infants, a recent case series did not report this. (57,58) Antihypertensive drugs of choice in pregnancy include β-blockers such as labetalol, dihydropyridine calcium channel blockers such as nifedipine, hydralazine, and methyldopa. Angiotensin-converting enzyme inhibitors (ACEis) and angiotensin receptor blockers (ARBs) should be discontinued 6 weeks before conception or at the diagnosis of pregnancy because of their high risk for teratogenicity.(59) A meta- analysis and systemic review published in 2021 showed that in comparison to those without gestational ACEi/ARB use, the use of ACEi/ARB in the first trimester resulted in a higher risk of fetal malformations (OR, 1.81; 9% CI, 1.42-2.34), cardiovascular malformations (OR, 2.50; 95% CI, 1.62-3.87), and stillbirths (OR,1.75; 95% CI, 1.21-2.53).(60)"
        text: |
          ==ACE inhibitor (ACEi)/angiotensin II receptor blocker (ARB)==: تقف **6 أسابيع** قبل الحمل أو أول ما يتعرف. في الأول: malformations (قلب بالذات) و stillbirth. في التاني والتالت: **oligohydramnios** وموت الجنين. والـ **SGLT2 inhibitor (SGLT2i)** كمان تقف 6 أسابيع قبل.
      - kind: explain
        page: 373
        title: "الأنيميا والـ phosphate والـ SGLT2"
        quote: "Anemia may worsen during pregnancy because of volume expansion and increased demands of the growing fetus."
        text: |
          - **Anemia:** بتسوء بسبب ==volume expansion== والـ **increased demands of the growing fetus** (الكتاب). فالـ iron والـ ESA بجرعات أعلى، والهدف Hb **10-11**.
          - **Phosphate:** الـ **calcium-based binders** والـ **vitamin D analogs** أحسن من الـ non-calcium binders والـ calcimimetics، عشان ==limited data== على التانيين في الحمل.
          - **Diuretics:** مسموحة.
          - **SGLT2 inhibitors:** مفيش human trials، والحيوانات بتقول ممكن تأثر على **in-utero kidney development**، فوقّفه 6 أسابيع قبل.
      - kind: aside
        tone: exam
        page: 373
        quote: "Second trimester and third-trimester use of ACEi/ARB is associated with complications, such as oligohydramnios and fetal and neonatal death. (61) Diuretics can be used during pregnancy in women with kidney failure. (62) Currently, there are no human trials to report the safety of sodium-glucose cotransporter-2 inhibitors in pregnant patients. Animal data suggest that they may affect in-utero kidney development and maturation, and it is therefore advised to stop sodium-glucose cotransporter-2 inhibitors 6 weeks before conception.(63) Statins have been contraindicated in pregnancy because of their teratogenic risk. The risk of teratogenicity has been shown in animal studies, in which it is commonly seen with lipophilic statins such as atorvastatin and less commonly seen with hydrophilic statins such as pravastatin. (64) In July 2021, however, the United States Food and Drug Administration requested to remove this recommendation based on recent human studies, which have failed to show major congenital malformations or still birth with statin use. (65) A cohort study published in 2015 failed to show a statistically significant increase in the risk of teratogenic effects after adjusting for potential confounders. (66) Another study did not show congenital anomalies with statin use during pregnancy but did identify a greater risk of low birth weight (RR,1.51; 95% CI, 1.05-2.16) and premature birth (RR, 1.99; 95% CI, 1.46-2.71) in comparison with women without statin use. (67) Anemia may worsen during pregnancy because of volume expansion and increased demands of the growing fetus. Increased doses of parenteral iron (oral or intravenous) and erythropoietin-stimulating agents may be needed during pregnancy to maintain a hemoglobin level of 10-11g/L. (68) For hyperphosphatemia during pregnancy, calcium-based binders and vitamin D analogs are preferred over non-calcium-based phosphate binders or calcimimetics because of limited data on the latter agents with pregnancy. (69)"
        text: "الكتاب فيه الاتنين: الـ Fig 3 (صفحة 374) بيحط الـ statins في الممنوع، والنص (صفحة 373 و 393) بيقول إن الـ US Food and Drug Administration (FDA) في يوليو 2021 طلبت تشيل الـ contraindication بعد دراسات على البشر ما بيّنتش تشوهات كبيرة. يعني الـ contraindication المطلقة اتشالت، بس الـ statins لسه مش دوا روتيني في الحمل، والـ FDA لسه بتنصح أغلب الحوامل يوقفوها."
