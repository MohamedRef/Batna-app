          - **Age-specific = deaths in an age group ÷ midyear population of that age group × 1000**
          - **Cause-specific = deaths from a disease ÷ total midyear population × 1000**
          - **Proportionate mortality = deaths from a disease ÷ all deaths × 100**
          - **Case fatality = deaths from a disease ÷ people with the same disease × 100**

