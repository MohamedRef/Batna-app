  # ------------------------------------------------------------------
  - id: rheum.L19.lesson1
    title: "مين بيجيله lupus وليه؟"
    hook: "ست في العشرينات، شمس، دوا ضغط، وكروموسوم X زيادة: كل واحد فيهم بيزوّد الحكاية."
    minutes: 9
    pages: [309, 312]
    topics: [definition, genetics, environment]
    goals:
      - "تعرّف SLE وتحفظ أرقام الـ epidemiology"
      - "تفهم ليه الستات أكتر: الـ X chromosome مش الهرمونات بس"
      - "تعدّ الـ environmental triggers والأدوية"
    status: unverified
    steps:
      - kind: explain
        page: 309
        title: "التعريف"
        quote: "Chronic relapsing inflammatory, multisystem autoimmune disorder of connective tissue characterized by involvement of the skin, joints and serosal membranes."
        text: |
          الـ **SLE** مرض ==chronic relapsing== inflammatory، **multisystem autoimmune** في الـ connective tissue.

          التلات أماكن اللي بتميّزه: **skin**، **joints**، و **serosal membranes** (pleura و pericardium).
      - kind: table
        page: 309
        quote: "> 90% cases of SLE occur in women 9:1. - Frequently during childbearing age (20-40years)."
        title: "الأرقام"
        columns: [Fact, Number]
        rows:
          - ["Highest rate (African/Caribbean women)", "1:250"]
          - ["Women", ">90%, F:M 9:1"]
          - ["Usual age", "20–40 years"]
          - ["Diagnosed in first 2 decades", "20%"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: reveal
        page: 309
        quote: "suggesting that there may be an environmental trigger, as well as a genetic basis, for disease in the UK population."
        prompt: "الـ SLE نادر في السود في أفريقيا، بس عالي في السود في بريطانيا. ده بيقولك إيه؟"
        answer: |
          نفس الجينات، بيئة مختلفة، نتيجة مختلفة. يبقى فيه ==environmental trigger== جنب الـ **genetic basis**.

          الجينات بتحمّل المسدس، والبيئة بتدوس على الزناد.
      - kind: explain
        page: 310
        title: "الجينات: HLA والـ complement"
        quote: "Complete deficiency of the early complement components C2, C4, and C1q results in SLE in 75%, 10%, and 90% of cases, respectively."
        text: |
          - **HLA** (الـ MHC على chromosome 6): أول genetic link، بيدي **~2-fold risk**. أثبتهم في الـ Caucasians: ==HLA-DR2 و DR3==. والـ DQ/DR مرتبطين بالـ autoantibodies.
          - **Complement:** الـ complete deficiency نادر، بس لما يحصل: **C1q 90%**، **C2 75%**، **C4 10%** (أرقام الكتاب).
          - الأشيع: **low C4 copy number** = risk، و high copy number = protective.
      - kind: update
        page: 310
        quote: "Complete deficiency of the early complement components C2, C4, and C1q results in SLE in 75%, 10%, and 90% of cases, respectively."
        text: "أغلب المراجع بتقول العكس في C2 و C4: حوالي 75% مع **C4** deficiency و 10–30% مع **C2**، والـ C1q فوق 90%. في الامتحان اكتب أرقام الكتاب."
        ref: "Macedo & Isaac, Frontiers in Immunology 2016"
      - kind: reveal
        page: 310
        quote: "a low gene copy number of C4 is seen as a risk factor for SLE"
        prompt: "ليه نقص الـ complement المبكر (C1q، C2، C4) يعمل lupus، مع إن المنطقي إن نقص المناعة يقلل الـ autoimmunity؟"
        answer: |
          الـ early complement بيلم الـ **apoptotic debris** والـ immune complexes ويخلّص منهم بهدوء.

          لو ناقص (أو الـ **C4 gene copy number** قليل)، الحطام النووي يفضل موجود، والجهاز المناعي يشوفه ويعمل ضده **autoantibodies**. ده تفسير مقبول، وهتشوف في الدرس الجاي إن الـ **defective clearance of apoptotic material** هو قلب المرض.
      - kind: explain
        page: 311
        title: "الـ X chromosome هو السر"
        quote: "the predisposition of women to developing SLE is related to X chromosome copy number, not to sex or sex hormones."
        text: |
          - الرجالة اللي عندهم SLE عندهم **Klinefelter (47,XXY)** بـ **15 ضعف**، والـ XXY risk بتاعهم **زي الستات**.
          - والـ **47,XXX** أكتر في الستات اللي عندهم SLE.
          - الخلاصة: ==X chromosome copy number==، مش الجنس ولا الهرمونات لوحدها.

          **Twins:** monozygotic **24–35%** مقابل dizygotic **2–5%**. و **10–12%** عندهم قريب درجة أولى أو تانية.
      - kind: check
        page: 311
        quote: "concordance in monozygotic twins is 24%-35%, compared to 2%–5% in dizygotic twin pairs."
        question: "Monozygotic twin concordance for SLE is only 24–35%. What does that tell you?"
        options:
          - "Genes matter, but environment is needed too"
          - "SLE is purely genetic"
          - "SLE is purely environmental"
          - "SLE is X-linked recessive"
        answer: 0
        why:
          - "صح: لو جينات بس كانت هتبقى قريبة من 100%؛ ولو بيئة بس ما كانتش هتبقى أعلى من الـ dizygotic (2–5%) بالشكل ده."
          - "الـ identical twins نفس الجينات، ومع ذلك أغلبهم مش بيتصابوا."
          - "الفرق الكبير بين MZ و DZ بيقول إن الجينات ليها دور."
          - "مش single-gene X-linked؛ الكتاب بيتكلم عن X dose."
      - kind: explain
        page: 311
        title: "الـ triggers من بره"
        quote: "Ultraviolet light stimulates keratinocytes, which leads to the secretion of cytokines that simulate increased autoantibody production."
        text: |
          - ==Ultraviolet light==: بيحفّز الـ **keratinocytes** يطلّعوا cytokines تزوّد الـ autoantibodies. **تلتين** العيانين UV sensitive.
          - **Viruses:** EBV، CMV، **parvovirus B19**، **HBV**، human endogenous retroviruses.
          - **Silica dust**، **stress**، **smoking**.
          - **Diet:** high caloric؛ الستات بـ **BMI > 21** risk أعلى.
          - **Hormones:** بيزيد في الـ reproductive years، ويتعب مع الحمل والدورة ← **estrogen**.
      - kind: mnemonic
        page: 312
        quote: "Anti hypertension - Hydralazine, methyldopa, and captopril. - Anti arrhythmics - Procainamide and quinidine."
        word: "HMC PQ PS"
        parts:
          - { key: "H", text: "Hydralazine (antihypertensive)" }
          - { key: "M", text: "Methyldopa (antihypertensive)" }
          - { key: "C", text: "Captopril (antihypertensive)" }
          - { key: "P", text: "Procainamide (antiarrhythmic)" }
          - { key: "Q", text: "Quinidine (antiarrhythmic)" }
          - { key: "P", text: "Penicillamine (anti-inflammatory)" }
          - { key: "S", text: "Sulfasalazine (anti-inflammatory)" }
        hook: "تلات مجموعات: **ضغط** (HMC)، **قلب** (PQ)، **التهاب** (PS). وفي قايمة الـ triggers كمان **chlorpromazine** و **isoniazid**."
      - kind: aside
        tone: joke
        page: 311
        quote: "About two-thirds of the people with lupus are UV light sensitive."
        text: "عيانة الـ lupus في مصر في أغسطس: «الشمس مش بتحبني يا دكتور». معاها حق: **تلتين** العيانين UV sensitive. الـ sunscreen هنا مش رفاهية. ☀️🧴"
      - kind: try
        items: [rheum.L19.005, rheum.L19.011, rheum.L19.014, rheum.L19.021, rheum.L19.017]
    recap:
      - "SLE: chronic relapsing multisystem autoimmune؛ skin، joints، serosa."
      - "F:M 9:1، سن 20–40، 1:250 في الـ African/Caribbean women."
      - "HLA-DR2/DR3؛ complement: C1q 90%، C2 75%، C4 10% (الكتاب)؛ low C4 copy = risk."
      - "X dose: XXY risk زي الستات. MZ 24–35% مقابل DZ 2–5%."
      - "UV (تلتين)، viruses، silica، BMI > 21، smoking، estrogen. أدوية: HMC PQ PS."
    practice: [rheum.L19.001, rheum.L19.002, rheum.L19.003, rheum.L19.004, rheum.L19.005, rheum.L19.006, rheum.L19.007, rheum.L19.008, rheum.L19.009, rheum.L19.010, rheum.L19.011, rheum.L19.012, rheum.L19.013, rheum.L19.014, rheum.L19.015, rheum.L19.016, rheum.L19.017, rheum.L19.018, rheum.L19.019, rheum.L19.020, rheum.L19.021, rheum.L19.022, rheum.L19.023, rheum.L19.024, rheum.L19.025, rheum.L19.026, rheum.L19.027, rheum.L19.105]
