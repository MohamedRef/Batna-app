  - id: endo.L05.lesson2
    title: "نلاقيه فين؟ ونعالجه إزاي؟"
    hook: "الورم صغير، والهرمون عالي، والـ CT ساكت. هنا الـ somatostatin receptor بيبقى الكشاف."
    minutes: 9
    pages: [81, 87]
    topics: [localization, treatment, targeted]
    goals:
      - "تعرف أرقام الـ Octreoscan والـ EUS"
      - "تعرف دور الـ somatostatin analogs وأعراضها الجانبية وليه"
      - "تعرف الـ targeted therapy"
    status: unverified
    steps:
      - kind: explain
        page: 81
        quote: "Radiolabeled somatostatin scanning is the best noninvasive modality, identifying up to 70% of primary tumors."
        title: "الكشاف: somatostatin receptor"
        text: |
          الـ NETs مليانة **somatostatin receptors**. لو علّمنا octreotide بمادة مشعة، الورم هينوّر.

          - ==Radiolabeled somatostatin scanning== = **best noninvasive modality**.
          - بيلاقي لحد **70%** من الـ primaries، وبيفرّق الـ GEP tumour من الـ nonendocrine.
      - kind: figure
        page: 81
        quote: "Sensitivity for <10 mm tumors: ~50%. Combined SRI + EUS sensitivity for <10 mm tumors: ~90%."
        title: "الأورام الصغيرة: مين بيشوف أحسن؟"
        alt: "Bar chart of sensitivity for tumours under 10 mm: ultrasound 10 to 30 percent, octreoscan 40 percent, EUS about 50 percent, SRI plus EUS about 90 percent."
        caption: "اللوحدها ضعيفة، مع بعض 90%. وفي الـ liver mets: Octreoscan و US الاتنين 90%."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="20" class="t-sm t-mut">Tumours under 10 mm</text>
            <text x="10" y="52" class="t-sm">US</text>
            <rect x="90" y="38" width="60" height="22" class="fg-bad"/>
            <text x="156" y="54" class="t-sm">10-30%</text>
            <text x="10" y="92" class="t-sm">Octreoscan</text>
            <rect x="90" y="78" width="88" height="22" class="fg-acc"/>
            <text x="184" y="94" class="t-sm">40%</text>
            <text x="10" y="132" class="t-sm">EUS</text>
            <rect x="90" y="118" width="110" height="22" class="fg-acc"/>
            <text x="206" y="134" class="t-sm">~50%</text>
            <text x="10" y="172" class="t-sm t-b">SRI + EUS</text>
            <rect x="90" y="158" width="198" height="22" class="fg-good"/>
            <text x="294" y="174" class="t-sm t-b">90%</text>
            <text x="10" y="208" class="t-sm t-mut">Octreoscan at 10 mm: 90%</text>
          </svg>
      - kind: check
        page: 81
        quote: "Combined SRI + EUS sensitivity for <10 mm tumors: ~90%."
        question: "Best way, per the lecture, to find an 8 mm pancreatic NET?"
        options: ["SRI plus EUS", "Transabdominal ultrasound", "Octreoscan alone", "Plain CT"]
        answer: 0
        why:
          - "صح: مع بعض حوالي 90% للأورام أقل من 10 mm."
          - "الـ US بيلاقي 10-30% بس من الصغيرين."
          - "الـ Octreoscan لوحده 40% تحت 10 mm."
          - "الـ CT في الكتاب complement، مش الأداة الأساسية للصغير."
      - kind: update
        page: 82
        quote: "With C11-5HTP or C11-L-dopa. Traditional Techniques (always a complement)."
        text: "النهارده الـ 68Ga-DOTATATE PET/CT أخد مكان الـ Octreoscan كأول functional imaging. الكتاب بيذكر PET بـ C11-5HTP و C11-L-dopa، واكتب ده في الامتحان."
        ref: "ENETS guidance 2023 / SNMMI appropriate use criteria 2018"
      - kind: explain
        page: 84
        quote: "Complete surgical removal of a solitary tumor offers a chance of cure."
        title: "العلاج: جراحة لو ينفع"
        text: |
          - **Solitary resectable**: ==complete surgical removal== = فرصة شفا.
          - **مش قابل للشفا**: نتحكم في الأعراض والنمو: debulking، antisecretory (الـ gastrinoma)، **somatostatin analogs** (الـ VIPoma)، embolization ± chemo، cryotherapy، RFA، chemo (streptozotocin + doxorubicin: 69% response)، radiolabeled SSA، interferon، وحتى **liver transplantation**.
      - kind: explain
        page: 84
        quote: "First-line for neuroendocrine gastroenteropancreatic tumors. Second- or third-line for insulinomas and gastrinomas."
        title: "الـ somatostatin analogs"
        text: |
          **Octreotide** و **lanreotide**، من الثمانينات.

          - ==First-line== للـ GEP NETs.
          - **Second- or third-line** للـ insulinoma والـ gastrinoma (ليهم علاج أنسب: الـ PPI للـ gastrinoma مثلًا).
      - kind: reveal
        page: 84
        quote: "Gallstones (due to inhibition of cholecystokinin release)."
        prompt: "مريض على octreotide سنين وجاله biliary colic. ليه؟"
        answer: "الـ somatostatin بيمنع الـ **cholecystokinin** وبيقلل انقباض المرارة والـ bile flow، فالصفرا بتركد وتعمل **gallstones**. باقي الأعراض: ألم مكان الحقنة، hypo/hyperglycaemia، rash، alopecia، fluid retention."
      - kind: aside
        tone: joke
        page: 85
        quote: "Inhibits GI and pancreatic peptide hormone secretion."
        text: "الـ somatostatin ده \"الحماة\" بتاعة الجهاز الهضمي: يقفل الحمض، يقفل المرارة، يقفل البنكرياس، يبطّأ الأمعاء، ويقلل الدم الواصل للكبد. بس عشان كده هو بالظبط اللي محتاجينه مع ورم بيفرز كتير."
      - kind: sort
        page: 86
        quote: "VEGF Inhibitors Bevacizumab. Sunitinib. Sorafenib. Pazopanib. mTOR Inhibitor Everolimus."
        prompt: "حط كل دوا في الـ target بتاعه:"
        bins: ["VEGF", "mTOR", "IGF-1"]
        cards:
          - { text: "Bevacizumab", bin: 0 }
          - { text: "Sunitinib", bin: 0 }
          - { text: "Sorafenib", bin: 0 }
          - { text: "Pazopanib", bin: 0 }
          - { text: "Everolimus", bin: 1 }
          - { text: "AMG-479", bin: 2 }
        why: "الأربعة الأوائل VEGF inhibitors، الـ everolimus هو الـ mTOR inhibitor الوحيد، والـ AMG-479 للـ IGF-1."
      - kind: figure
        page: 87
        quote: "SST receptor → G protein → PI3K → Akt → mTOR → Cell cycle activation, protein synthesis."
        title: "ليه mTOR؟"
        alt: "A vertical pathway: SST receptor, G protein, PI3K, Akt, mTOR, then cell cycle activation and protein synthesis. Everolimus blocks at mTOR."
        caption: "نفس الطريق اللي بيبدأ من الـ somatostatin receptor بيوصل لـ mTOR، فالـ everolimus بيقفل آخره."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="E05b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="20" y="8" width="140" height="30" rx="6" class="fg-box"/>
            <text x="35" y="28" class="t-sm t-b">SST receptor</text>
            <path d="M90 38v14" class="fg-arrow" marker-end="url(#E05b)"/>
            <rect x="20" y="54" width="140" height="30" rx="6" class="fg-box"/>
            <text x="45" y="74" class="t-sm">G protein</text>
            <path d="M90 84v14" class="fg-arrow" marker-end="url(#E05b)"/>
            <rect x="20" y="100" width="140" height="30" rx="6" class="fg-box"/>
            <text x="68" y="120" class="t-sm">PI3K</text>
            <path d="M90 130v14" class="fg-arrow" marker-end="url(#E05b)"/>
            <rect x="20" y="146" width="140" height="30" rx="6" class="fg-box"/>
            <text x="75" y="166" class="t-sm">Akt</text>
            <path d="M90 176v14" class="fg-arrow" marker-end="url(#E05b)"/>
            <rect x="20" y="192" width="140" height="30" rx="6" class="fg-acc"/>
            <text x="70" y="212" class="t-sm t-b t-acc">mTOR</text>
            <path d="M90 222v14" class="fg-arrow" marker-end="url(#E05b)"/>
            <rect x="5" y="238" width="170" height="44" rx="6" class="fg-thin"/>
            <text x="12" y="256" class="t-sm">cell cycle activation,</text>
            <text x="12" y="274" class="t-sm">protein synthesis</text>
            <rect x="200" y="192" width="120" height="30" rx="6" class="fg-bad"/>
            <text x="212" y="212" class="t-sm t-b t-bad">everolimus</text>
            <path d="M200 207h-36" class="fg-arrow-bad"/>
          </svg>
      - kind: try
        items: [endo.L05.026, endo.L05.027, endo.L05.034, endo.L05.042, endo.L05.045]
    recap:
      - "Somatostatin scan: best noninvasive، 70% من الـ primaries."
      - "تحت 10 mm: Octreoscan 40%، EUS 50%، الاتنين 90%؛ US 10-30%."
      - "Solitary tumour: جراحة = فرصة شفا."
      - "SSA: first-line للـ GEP-NET، second/third للـ insulinoma والـ gastrinoma؛ gallstones من منع الـ CCK."
      - "Interferon للـ midgut carcinoid. Everolimus = mTOR. VEGF: bevacizumab، sunitinib، sorafenib، pazopanib."
    practice: [endo.L05.025, endo.L05.026, endo.L05.027, endo.L05.028, endo.L05.029, endo.L05.030, endo.L05.031, endo.L05.032, endo.L05.033, endo.L05.034, endo.L05.035, endo.L05.036, endo.L05.037, endo.L05.038, endo.L05.039, endo.L05.040, endo.L05.041, endo.L05.042, endo.L05.043, endo.L05.044, endo.L05.045, endo.L05.110, endo.L05.113, endo.L05.115, endo.L05.117]
