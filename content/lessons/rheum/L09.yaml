          أسئلة الكتاب كلها ماشية على نفس الطريقة: ==كلمة واحدة في السؤال بتشاور على النوع==.
          - **Heliotrope و Gottron's** = **dermatomyositis** (السؤال 5): الكتاب بيقول **classic cutaneous signs**.
          - **Rapidly progressive ILD** = **anti-MDA5** (السؤال 4).
          - **Malignancy** = **anti-TIF1γ** (السؤال 2، والشرح بيقول **paraneoplastic risk**).
          - **راجل كبير + asymmetric + resistant** = **IBM** (السؤال 8).
          - **فين تاخد الـ biopsy** = **MRI** (السؤال 6، لأنه بيوري الـ inflammation والـ oedema).

          التفسير المقبول (مش في الكتاب): لو لقيت السؤال بيقول "**best** describes" أو "**most** closely"، يبقى فيه اختيار تاني صح جزئيًا، فدوّر على **الكلمة المميزة** مش على أي حاجة ليها علاقة.
