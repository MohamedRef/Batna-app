items:
  # ---------- p143-144: esophageal tumors, epidemiology and types ----------
  - id: git.L04.001
    kind: cloze
    topic: eso-epi
    text: Esophageal cancer is the {{c1::seventh}} most frequently diagnosed cancer and the {{c2::sixth}} leading cause of cancer-related deaths in the world.
    src: { page: 143, quote: "Esophageal cancer is the seventh most frequently diagnosed cancer and the sixth leading cause of cancer-related deaths in the world." }
    status: unverified
    tags: [numbers]
  - id: git.L04.002
    kind: card
    topic: eso-epi
    front: Why do most US patients with esophageal cancer present at an advanced stage?
    back: There is no routine screening for esophageal cancer in the US.
    src: { page: 143, quote: "In the US where there is no routine screening for esophagus cancer, most patients present with advanced stages" }
    status: unverified
  - id: git.L04.003
    kind: cloze
    topic: eso-epi
    text: "Esophageal cancer at presentation: nearly {{c1::50%}} are advanced beyond locoregional disease, less than {{c2::60%}} of locoregional cases can have a curative resection, and {{c3::70-80%}} of resected specimens show lymph node spread."
    src: { page: 143, quote: "Nearly 50% are advanced beyond localregional" }
    status: unverified
    tags: [numbers]
  - id: git.L04.004
    kind: card
    topic: eso-epi
    front: What proportion of esophageal tumors are malignant?
    back: More than 99%; fewer than 1% are benign.
    src: { page: 143, quote: "Most (> 99%) esophageal tumors are MALIGNANT, fewer than 1% are benign." }
    status: unverified
    tags: [high-yield]
  - id: git.L04.005
    kind: enumerate
    topic: eso-epi
    prompt: Enumerate the benign tumors of the esophagus.
    points:
      - Squamous cell papilloma
      - Adenoma
      - Leiomyoma
      - Lipoma
      - Fibroma
      - Neurofibroma
      - Rhabdomyoma
      - Lymphangioma
      - Hemangioma
    pass: 6
    src: { page: 143, quote: "Benign tumors: Squamous cell papilloma, Adenoma, leiomyoma, lipoma, fibroma, neurofibroma, rhabdomyoma, lymphangioma & hemangioma." }
    status: unverified
  - id: git.L04.006
    kind: card
    topic: eso-epi
    front: Why are malignant esophageal tumors almost always carcinomas?
    back: Because esophageal sarcomas are extremely rare.
    src: { page: 143, quote: "Malignant tumors: are carcinomas because sarcomas are extremely rare." }
    status: unverified
  - id: git.L04.007
    kind: card
    topic: eso-epi
    front: Where in the esophagus is squamous cell carcinoma most often found, and from which cells does it arise?
    back: The upper and middle parts; it arises from the thin, flat squamous cells lining the esophagus.
    src: { page: 143, quote: "This cancer is most often found in the upper and middle part of the esophagus" }
    status: unverified
    tags: [high-yield]
  - id: git.L04.008
    kind: card
    topic: eso-epi
    front: Where does esophageal adenocarcinoma usually form, and from which cells?
    back: In the lower esophagus near the stomach; it begins in the glandular (secretory, mucus-producing) cells.
    src: { page: 144, quote: "Adenocarcinomas usually form in the lower part of the esophagus, near the stomach." }
    status: unverified
    tags: [high-yield]
  - id: git.L04.009
    kind: cloze
    topic: eso-epi
    text: In the 1960s squamous cancer was more than {{c1::90%}} of esophageal cancers; adenocarcinoma has since risen dramatically to over {{c2::60%}} of cases in the US, while squamous cancer is now less than {{c3::30%}}.
    src: { page: 144, quote: "over the last two decades adenocarcinoma has dramatically increased and is now over 60% in the US" }
    status: unverified
    tags: [numbers]
  - id: git.L04.010
    kind: card
    topic: eso-epi
    front: How are EGJ tumors and tumors of the proximal 5 cm of the stomach that extend into the EGJ or esophagus staged?
    back: As esophageal cancers (the Siewert III EGJ tumors).
    src: { page: 144, quote: "Tumors at the esophagogastric junction and proximal 5 cm of the stomach that extend into the EGJ or esophagus are classified and staged as" }
    status: unverified
    tags: [high-yield]
  - id: git.L04.011
    kind: card
    topic: eso-epi
    front: Which tumors near the EGJ are staged as gastric cancers?
    back: Tumors with an epicenter in the stomach more than 5 cm from the EGJ, or within 5 cm of the EGJ but without extension into the esophagus.
    src: { page: 144, quote: "All other tumors with an epicenter in the stomach >5 cm from the EGJ, or those within 5 cm of the EGJ without extension" }
    status: unverified
  # ---------- p144-146: risk factors ----------
  - id: git.L04.012
    kind: card
    topic: eso-risk
    front: The two major risk factors for esophageal squamous cancer?
    back: Tobacco and alcohol.
    src: { page: 144, quote: "Tobacco and Alcohol are the major risk factors" }
    status: unverified
    tags: [high-yield]
  - id: git.L04.013
    kind: enumerate
    topic: eso-risk
    prompt: Mention the high-risk factors for esophageal adenocarcinoma listed on the lecture's adenocarcinoma slide.
    points:
      - Obesity and a high BMI
      - GERD
      - Barrett's esophagus (risk 30-60 times higher)
      - "White men (now the most common type in the US, especially in white men)"
    pass: 3
    src: { page: 144, quote: "Obesity and a high Body Mass Index (BMI) are high risk factors" }
    status: unverified
  - id: git.L04.014
    kind: cloze
    topic: eso-risk
    text: Barrett's esophagus raises the risk of esophageal adenocarcinoma {{c1::30-60}} times; its annual cancer incidence has been estimated at {{c2::0.1 to 2.0}} percent.
    src: { page: 144, quote: "Estimates of the annual cancer incidence in patients with Barrett's esophagus have ranged from 0.1 to 2.0 percent." }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L04.015
    kind: card
    topic: eso-risk
    front: Barrett's esophagus raises esophageal cancer risk at least 30-fold. Is the absolute risk high?
    back: No. The relative risk is high but the absolute risk of developing cancer is low.
    src: { page: 144, quote: "the absolute risk of developing cancer is low" }
    status: unverified
  - id: git.L04.016
    kind: enumerate
    topic: eso-risk
    prompt: Enumerate the risk factors for esophageal adenocarcinoma.
    points:
      - Barrett esophagus
      - Age over 60 (6th-7th decades)
      - Male sex (7 times more common in men)
      - Documented dysplasia
      - Tobacco use
      - Obesity
      - Prior radiation therapy
      - White race
    pass: 6
    src: { page: 145, quote: "Barrett esophagus Age- over 60 (6th -7th decades) Sex- more common in MEN (7times) documented dysplasia tobacco use, obesity, prior radiation therapy." }
    status: unverified
    tags: [high-yield]
  - id: git.L04.017
    kind: card
    topic: eso-risk
    front: Describe the morphology of esophageal adenocarcinoma.
    back: Usually in the distal third, may invade the gastric cardia. It starts as flat or raised patches in intact mucosa, then may form large nodular masses of 5 cm or more, or infiltrate diffusely or ulcerate and invade deeply.
    src: { page: 145, quote: "Esophageal adenocarcinoma usually occurs in the distal third of the esophagus and may invade the adjacent gastric cardia." }
    status: unverified
  - id: git.L04.018
    kind: enumerate
    topic: eso-risk
    prompt: Illustrate the risk factors for esophageal SCC (book groups I-XI).
    points:
      - "Esophageal disorders: long-standing esophagitis, achalasia, Plummer-Vinson syndrome"
      - "Life style: alcohol, tobacco"
      - "Dietary: vitamin and trace metal deficiency, fungal contamination of food, high nitrites/nitrosamines, very hot beverages"
      - "Genetic: tylosis; p16/INK4 and EGFR abnormalities, p53 mutation in 50%"
      - Age over 45
      - Male sex (4 times more than females)
      - Poverty
      - Black race (6 times)
      - Previous mediastinal radiation
      - HPV
      - Coeliac disease
    pass: 8
    src: { page: 145, quote: "Risk factors of SCC of Esophagus I. Esophageal disorders: Long standing esophagitis Achalasia Plummer-Vinson Syndrome II. Life style: Alcohol Tobacco" }
    status: unverified
    tags: [high-yield]
  - id: git.L04.019
    kind: cloze
    topic: eso-risk
    text: "Esophageal disorders that predispose to SCC: long-standing {{c1::esophagitis}}, {{c2::achalasia}} and {{c3::Plummer-Vinson syndrome}}."
    src: { page: 145, quote: "Esophageal disorders: Long standing esophagitis Achalasia Plummer-Vinson Syndrome" }
    status: unverified
  - id: git.L04.020
    kind: enumerate
    topic: eso-risk
    prompt: Mention the dietary risk factors for esophageal SCC.
    points:
      - Vitamin deficiency
      - Trace metal deficiency
      - Fungal contamination of food stuffs
      - High content of nitrites/nitrosamines
      - Frequent consumption of very hot beverages
    pass: 4
    src: { page: 145, quote: "Fungal contamination of food stuffs High content of nitrites/nitrosamines Frequent consumption of very hot beverages." }
    status: unverified
  - id: git.L04.021
    kind: card
    topic: eso-risk
    front: Which genetic skin condition predisposes to esophageal SCC?
    back: Tylosis.
    src: { page: 145, quote: "IV. Genetic predisposition: Tylosis" }
    status: unverified
  - id: git.L04.022
    kind: cloze
    topic: eso-risk
    text: In esophageal SCC, abnormalities of the {{c1::p16/INK4}} tumor suppressor gene and the {{c2::epidermal growth factor receptors}} are frequent, and {{c3::p53}} is mutated in 50% of tumors.
    src: { page: 146, quote: "Abnormalities affecting the p16/INK4 tumor suppressor gene and the epidermal growth factor receptors are frequently present in SCC of the esophagus." }
    status: unverified
  - id: git.L04.023
    kind: cloze
    topic: eso-risk
    text: "Esophageal SCC: age over {{c1::45}}, males {{c2::4}} times more than females, and {{c3::6}} times more common in Blacks."
    src: { page: 146, quote: "V. Age. Over 45 VI. Sex. Males 4 times more frequently than females." }
    status: unverified
    tags: [numbers]
  - id: git.L04.024
    kind: card
    topic: eso-risk
    front: Besides age, sex and race, which other risk factors for esophageal SCC does the lecture list on p146?
    back: Poverty, previous radiation therapy to the mediastinum, HPV and coeliac disease.
    src: { page: 146, quote: "IX. Previous radiation therapy to the mediastinum. X. HPV XI. Coeliac disease" }
    status: unverified
  - id: git.L04.025
    kind: table
    topic: eso-risk
    title: Esophageal SCC versus adenocarcinoma (lecture 4)
    columns: [Feature, Squamous cell carcinoma, Adenocarcinoma]
    rows:
      - [Cell of origin, "Squamous cells lining the esophagus", "Glandular (mucus-secreting) cells"]
      - [Usual site, "Upper and middle esophagus", "Lower (distal third) esophagus, near the stomach"]
      - [Share of US cases now, "Less than 30%", "Over 60%"]
      - [Major risk factors, "Tobacco and alcohol", "Barrett's, GERD, obesity/high BMI"]
      - [Sex ratio, "Males 4 times females", "Males 7 times females"]
      - [Race, "Blacks 6 times", "Whites"]
    blanks: [[1, 1], [1, 2], [3, 1], [3, 2], [4, 2]]
    src: { page: 144, quote: "Squamous Cancer Now only accounts for less than 30% of cases in the US" }
    status: unverified
    tags: [high-yield]
  # ---------- p146-148: clinical features, prognosis, molecular ----------
  - id: git.L04.026
    kind: enumerate
    topic: eso-clinic
    prompt: Mention the clinical features of esophageal carcinoma.
    points:
      - Dysphagia (progressive, obstruction)
      - Odynophagia (severe pain on swallowing)
      - Progressive weight loss, anorexia, fatigue, weakness
      - Hematemesis
      - Chest pain
      - Cough, vomiting, frequent choking, hiccups
      - Manifestations of metastasis
    pass: 5
    src: { page: 146, quote: "Clinical Features Dysphagia, Odynophagia (severe pain on swallowing) Obstruction progressive weight loss, Anorexia, Fatigue, Weakness, hematemesis, chest pain" }
    status: unverified
  - id: git.L04.027
    kind: card
    topic: eso-clinic
    front: Define odynophagia.
    back: Severe pain on swallowing.
    src: { page: 146, quote: "Odynophagia (severe pain on swallowing)" }
    status: unverified
  - id: git.L04.028
    kind: card
    topic: eso-clinic
    front: Why is the prognosis of esophageal cancer poor?
    back: By the time symptoms appear the tumor has usually spread to submucosal lymphatics, so it is diagnosed at an advanced stage.
    src: { page: 146, quote: "By the time symptoms appear, the tumor has usually spread to submucosal lymphatic vessels." }
    status: unverified
    tags: [high-yield]
  - id: git.L04.029
    kind: cloze
    topic: eso-clinic
    text: Overall 5-year survival of esophageal cancer is less than {{c1::25% (15%)}}, with most patients dying within the {{c2::first year}}; it approaches {{c3::80%}} for adenocarcinoma limited to the mucosa or submucosa.
    src: { page: 146, quote: "5-year survival approximates 80% in the few patients with adenocarcinoma limited to the mucosa or submucosa" }
    status: unverified
    tags: [numbers]
  - id: git.L04.030
    kind: enumerate
    topic: eso-clinic
    prompt: Which molecular tests are used in managing locally advanced, unresectable and metastatic esophageal and EGJ cancers?
    points:
      - HER2 status
      - Microsatellite instability (MSI) status
      - PD-L1 expression
    pass: 3
    src: { page: 147, quote: "molecular testing for HER2 status, microsatellite instability status, and programmed deathligand 1 (PD-L1) expression are used in the clinical management" }
    status: unverified
  - id: git.L04.031
    kind: card
    topic: eso-clinic
    front: What does HER2 positivity mean for prognosis in esophageal and EGJ cancer, and how is it targeted?
    back: It correlates with tumor invasion and nodal metastasis, so a poor prognosis. Adding HER2 monoclonal antibodies to chemotherapy is a promising option for HER2-positive metastatic disease.
    src: { page: 147, quote: "HER2 positivity is correlated with tumor invasion and lymph node metastasis, and thus indicates a poor prognosis." }
    status: unverified
  - id: git.L04.032
    kind: cloze
    topic: eso-clinic
    text: HER2 positivity in esophageal and EGJ cancers ranges {{c1::2%-45%}}; it is commoner in adenocarcinoma ({{c2::15%-30%}}) than in SCC ({{c3::5%-13%}}).
    src: { page: 148, quote: "is more frequently seen in adenocarcinoma of the esophagus (15%–30%) than in SCC (5%–13%)." }
    status: unverified
    tags: [numbers]
  - id: git.L04.033
    kind: card
    topic: eso-clinic
    front: Is HER2 positivity higher in EGJ adenocarcinoma or gastric adenocarcinoma?
    back: In EGJ adenocarcinoma.
    src: { page: 148, quote: "HER2 positivity has been reported to be higher in patients with EGJ adenocarcinomas than in patients with gastric adenocarcinomas." }
    status: unverified
  - id: git.L04.034
    kind: card
    topic: eso-clinic
    front: When is HER2 testing recommended in esophageal or EGJ cancer?
    back: For all patients at diagnosis if metastatic disease is documented or suspected.
    src: { page: 148, quote: "HER2 testing is recommended for all patients with esophageal or EGJ cancer at the time of diagnosis if metastatic disease is documented or suspected" }
    status: unverified
    tags: [high-yield]
  - id: git.L04.035
    kind: card
    topic: eso-clinic
    front: Why should MSI-H/dMMR status be checked in esophageal or EGJ adenocarcinoma, and when?
    back: Because the FDA approved pembrolizumab for unresectable or metastatic MSI-H or dMMR solid tumors (second line or later). Check it in all patients with esophageal or EGJ adenocarcinoma if metastatic disease is documented or suspected.
    src: { page: 148, quote: "MSI-H/dMMR status should be assessed in all patients with esophageal or EGJ adenocarcinoma if metastatic disease is documented or suspected" }
    status: unverified
  - id: git.L04.036
    kind: enumerate
    topic: eso-clinic
    prompt: Pathological classification of esophageal neoplasia (book figure). Mention the preinvasive lesions and the invasive malignant types.
    points:
      - "Preinvasive: esophageal intraepithelial neoplasia; glandular dysplasia/adenocarcinoma in situ in Barrett's mucosa"
      - "Invasive: squamous cell carcinoma and adenocarcinoma (together 95%)"
      - "Invasive, rare: adenoid cystic, mucoepidermoid, adenosquamous and small cell carcinoma"
      - "Invasive, rare: carcinoid tumor, malignant melanoma, sarcomas"
    pass: 3
    src: { page: 147, quote: "Esophageal intraepithelial neoplasia" }
    status: unverified
  - id: git.L04.037
    kind: enumerate
    topic: eso-dx
    prompt: List the NCCN workup of esophageal cancer shown in the lecture.
    points:
      - History and physical; upper GI endoscopy and biopsy
      - Chest/abdominal CT with oral and IV contrast; pelvic CT as clinically indicated
      - PET-CT if no evidence of M1 disease; CBC and chemistry profile
      - EUS if no evidence of M1 disease; EMR may help staging of early cancers
      - Nutritional assessment and counseling; biopsy of metastatic disease as indicated
      - HER2-neu testing if metastatic adenocarcinoma is documented or suspected
      - Bronchoscopy if the tumor is at or above the carina with no M1 disease
      - Assign Siewert category; smoking cessation; screen for family history
    pass: 6
    src: { page: 147, quote: "Upper GI endoscopy and biopsy" }
    status: unverified
  # ---------- p149-151: staging and diagnosis ----------
  - id: git.L04.038
    kind: table
    topic: eso-dx
    title: AJCC TNM classification of esophageal cancer (book figure, p149)
    columns: [Stage, Description]
    rows:
      - [Tis, High-grade dysplasia and carcinoma in situ]
      - [T1a, Lamina propria and muscularis mucosae involvement]
      - [T1b, Submucosa involvement]
      - [T2, Invasion of muscularis propria]
      - [T3, Invasion of adventitia]
      - [T4a, "Pleura, pericardial or diaphragm involvement"]
      - [T4b, "Other organs (aorta, vertebral body, trachea)"]
      - [N1, 1-2 regional lymph node metastases]
      - [N2, 3-6 regional lymph node metastases]
      - [N3, 7 or more regional lymph node metastases]
      - [M1, "Distant organs (retroperitoneal, paraaortic nodes, lung, liver, bone)"]
    blanks: [[1, 1], [2, 1], [4, 1], [5, 1], [7, 1], [8, 1], [9, 1]]
    src: { page: 149, quote: "High-grade dysplasia and carcinoma in situ (CIS)" }
    status: unverified
    tags: [high-yield, numbers]
  - id: git.L04.039
    kind: cloze
    topic: eso-dx
    text: "Esophageal cancer N stage: N1 = {{c1::1-2}} regional nodes, N2 = {{c2::3-6}}, N3 = {{c3::7 or more}}."
    src: { page: 149, quote: "3~6 regional lymph nodes metastases" }
    status: unverified
    tags: [numbers]
  - id: git.L04.040
    kind: cloze
    topic: eso-dx
    text: "Esophageal T4: T4a = involvement of the {{c1::pleura, pericardium or diaphragm}}; T4b = {{c2::other organs (aorta, vertebral body, trachea)}}."
    src: { page: 149, quote: "Pleura, pericardial or diaphragm involvement" }
    status: unverified
  - id: git.L04.041
    kind: card
    topic: eso-dx
    front: What does EGD provide in esophageal cancer besides biopsy?
    back: Direct visualization, the proximal and distal distance of the tumor from the incisors, and whether Barrett's esophagus is present.
    src: { page: 150, quote: "EGD Endoscopy: allow direct visualization and biopsy, measure proximal & distal distance of tumor from incisor, presence of Barrett‘s esophagus." }
    status: unverified
  - id: git.L04.042
    kind: card
    topic: eso-dx
    front: Why is CT of the chest and abdomen essential for staging esophageal cancer?
    back: It identifies extension beyond the esophageal wall, enlarged lymph nodes and visceral metastases.
    src: { page: 150, quote: "Essential for staging because it can identify extension beyond the esophageal wall, enlarged lymph nodes and visceral metastases." }
    status: unverified
  - id: git.L04.043
    kind: card
    topic: eso-dx
    front: What does EUS assess in esophageal cancer, and what limits it?
    back: Depth of penetration and lymph node involvement. It is limited by the degree of obstruction.
    src: { page: 150, quote: "Assess the depth of penetration and LN involvement. Limited by the degree of obstruction." }
    status: unverified
    tags: [high-yield]
  - id: git.L04.044
    kind: card
    topic: eso-dx
    front: CT or EUS for the extent of tumor within the esophageal wall?
    back: EUS. CT is not reliable for the extent of tumor in the esophageal wall.
    src: { page: 150, quote: "Compared with EUS, CT is not a reliable tool for evaluation of the extent of tumor in the esophageal wall." }
    status: unverified
  - id: git.L04.045
    kind: cloze
    topic: eso-dx
    text: PET in esophageal cancer detects up to {{c1::15-20%}} of metastases not seen on CT and EUS, but has {{c2::low accuracy for local nodal disease}} compared to CT/EUS.
    src: { page: 150, quote: "can detect up to 15–20% of metastases not seen on CT and EUS low accuracy in detecting local nodal disease compared to CT / EUS" }
    status: unverified
    tags: [numbers]
  - id: git.L04.046
    kind: card
    topic: eso-dx
    front: Two further uses of PET in esophageal cancer?
    back: Evaluating response to chemotherapy and radiotherapy, and (added to CT) improving the specificity and accuracy of noninvasive staging.
    src: { page: 150, quote: "Value in evaluating response to Chemo Therapy & Radio Therapy addition of PET to CT can improve specificity and accuracy of noninvasive staging" }
    status: unverified
  - id: git.L04.047
    kind: card
    topic: eso-dx
    front: Roles of barium swallow and bronchoscopy in esophageal cancer?
    back: Barium swallow delineates the proximal and distal margins. Bronchoscopy rules out a fistula in mid-esophageal lesions.
    src: { page: 150, quote: "Barium swallow: can delineate proximal and distal margins. Bronchoscopy: rule-out fistula in midesophageal lesions." }
    status: unverified
  - id: git.L04.048
    kind: card
    topic: eso-tx
    front: On what does the management of esophageal cancer depend?
    back: Site of disease, extent of disease involvement, comorbid conditions and patient preference.
    src: { page: 151, quote: "Site of disease ✠ Extent of disease involvement ✠ Co-morbid conditions ✠ Patient preference." }
    status: unverified
  - id: git.L04.049
    kind: card
    topic: eso-tx
    front: Which esophageal cancer patients should be considered for esophagectomy?
    back: All medically fit patients with resectable cancer more than 5 cm from the cricopharyngeus.
    src: { page: 151, quote: "Esophagectomy should be considered for all medically ﬁt patients with resectable esophageal cancer (.5 cm from cricopharyngeus)." }
    status: unverified
    tags: [high-yield]
  - id: git.L04.050
    kind: card
    topic: eso-tx
    front: How are cervical or cervicothoracic esophageal cancers less than 5 cm from the cricopharyngeus treated?
    back: With definitive chemoradiation.
    src: { page: 151, quote: "Cervical or cervicothoracic esophageal cancers ,5 cm from the cricopharyngeus should be treated with deﬁnitive chemoradiation." }
    status: unverified
    tags: [high-yield]
  - id: git.L04.051
    kind: card
    topic: eso-tx
    front: For preoperative nutritional support in esophageal cancer, jejunostomy or gastrostomy tube, and why?
    back: Jejunostomy. A gastrostomy tube may compromise the stomach as the conduit for reconstruction.
    src: { page: 151, quote: "A jejunostomy feeding tube is preferred over a gastrostomy feeding tube for preoperative nutritional support" }
    status: unverified
    tags: [high-yield]
  - id: git.L04.052
    kind: card
    topic: eso-tx
    front: When should enteral nutritional support be considered in esophageal cancer?
    back: In patients with significant dysphagia and/or weight loss, before or during induction therapy.
    src: { page: 151, quote: "Enteral nutritional support should be considered for patients with signiﬁcant dysphagia and/or weight loss before or during induction therapy." }
    status: unverified
  - id: git.L04.053
    kind: card
    topic: eso-tx
    front: Indications for surgery in esophageal cancer listed in the lecture?
    back: Lower-third disease involving the GE junction, tumor size under 5 cm, and palliative surgery (prerequisite, disease 5 cm beyond the cricopharyngeus).
    src: { page: 151, quote: "Lower 1/3 rd oesophageal ds involving GE junction. Tumor size <5 cm . Palliative surgery" }
    status: unverified
  - id: git.L04.054
    kind: card
    topic: eso-tx
    front: Does chemotherapy alone improve survival in esophageal cancer?
    back: There is no data proving that it does. Partial response, not long-term remission, is the rule.
    src: { page: 151, quote: "No data proving that chemotherapy alone provides improved survival or palliation. Partial response, not long-term remission, is the rule" }
    status: unverified
  - id: git.L04.055
    kind: card
    topic: eso-tx
