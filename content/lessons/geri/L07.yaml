        title: "ليه الـ IADL بتقع الأول؟"
        text: |
          الـ **Lawton IADL** تمن domains: telephone، shopping، food preparation، housekeeping، laundry، transportation، medications، finances. كل واحد **0 أو 1** حسب **أعلى مستوى** بيعمله، والمجموع **0–8 للستات** و **0–5 للرجالة** «to avoid potential gender bias».

          التفسير المقبول (مش في الكتاب): الـ IADL محتاجة **تخطيط وذاكرة وتنظيم** (تحسب فلوس، ترتب أدوية، تركب مواصلة)، مش بس عضل. عشان كده هي أول حاجة بتقع في الـ dementia البدري، قبل ما الـ ADL تتأثر بكتير. يعني:
          - IADL واقعة و ADL سليمة ← فكّر في cognition، والعيان ممكن يعيش لوحده بمساعدة في الفلوس والأدوية.
          - ADL واقعة ← محتاج حد جنبه في جسمه.

          ولاحظ في الـ Lawton إن الأدوية **المحضّرة مسبقًا** في جرعات = **0**، عشان المهم إنه يقدر يرتّبها بنفسه.
