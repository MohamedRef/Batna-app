  - id: neph.L11.lesson7
    title: "الشهر بيقولك السبب: AKI من أول الحمل لبعد الولادة"
    hook: "قبل ما تفكر في أي حاجة، اسأل: هي في الشهر الكام؟"
    minutes: 7
    pages: [354, 356]
    topics: [aki-causes]
    goals:
      - "تقسّم أسباب الـ AKI في الحمل حسب الـ trimester"
      - "تفهم ليه كل سبب بيظهر في وقته"
      - "تعرف ليه الحامل معرضة للـ acute cortical necrosis"
    status: unverified
    steps:
      - kind: explain
        page: 354
        title: "التوقيت بيقولك السبب"
        quote: "Causes of acute kidney injury during pregnancy Like the general population, the causes of AKI in pregnant women can be divided into three groups: prerenal, intra renal, and postrenal causes. Age of gestation and clinical presentation are important determinants of AKI in a pregnant woman (Fig1)."
        text: |
          **First trimester**: ==hyperemesis gravidarum== (جفاف = prerenal)، **septic abortion** (ATN)، glomerulonephritis (GN) flare زي lupus، ونزيف المشيمة.

          **Second و third**: preeclampsia، haemolysis, elevated liver enzymes, low platelets (HELLP)، **acute fatty liver of pregnancy (AFLP)**، thrombotic thrombocytopenic purpura (TTP) و atypical hemolytic uremic syndrome (aHUS)، pyelonephritis، و **obstruction** من الرحم الكبير اللي بيضغط على الحالبين.

          والحمل **hypercoagulable**، فلو حصل hypotension شديد ممكن يعمل ==acute cortical necrosis==.
      - kind: explain
        page: 355
        title: "ليه كل سبب في وقته؟"
        quote: "In the first trimester, due to hormonal variations, women commonly experience ―morning sickness‖ with an increase in nausea and vomiting as well as poor appetite. Hyperemesis gravidarum, with the associated volume depletion, can result in AKI."
        text: |
          الكتاب بيقول إن ==age of gestation and clinical presentation== هم اللي بيحددوا السبب. والمنطق:

          - **أول الحمل:** الهرمونات بتعمل **morning sickness**، ولو بقت **hyperemesis gravidarum** الـ **volume depletion** بيعمل prerenal AKI. والإجهاض لسه ممكن، فالـ **septic abortion** بيعمل **ATN**.
          - **التاني والتالت:** المشيمة كبرت وبتشتغل، فهنا الأمراض ==specific to an isolated pregnancy-related complication== (preeclampsia وأخواتها). والرحم كبر، فبيضغط على الحالبين (**post-obstructive AKI**).
          - **بعد الولادة:** الـ **aHUS** والـ **NSAIDs** (مسكنات بعد الولادة).

          والـ **GN flare** (زي الـ lupus) ممكن في أي وقت.
      - kind: reveal
        page: 355
        quote: "Due to the hypercoagulable nature of pregnancy, women have a high risk of acute cortical necrosis in the setting of severe hypotension."
        prompt: "ليه الحامل بالذات معرضة للـ acute cortical necrosis لو ضغطها وقع جامد؟"
        answer: |
          الكتاب بيقول السبب: ==hypercoagulable nature of pregnancy==.

          التفسير المقبول (مش في الكتاب): الحمل بيعلّي عوامل التجلط عشان يحمي الأم من النزيف وقت الولادة. لو حصل **severe hypotension** (زي نزيف المشيمة)، الدم بيمشي ببطء في الأوعية الصغيرة في الـ cortex، والدم اللي جاهز يتجلط بيسد. النتيجة مش ATN بيرجع، دي **necrosis** للـ cortex، وغالبًا مش بترجع.
      - kind: figure
        page: 356
        quote: "Figure 1: Timing of AKI in pregnancy\n| Cause | Timing (First Trimester, Second Trimester, Third Trimester, Postpartum) |\n| Septic Abortion | First Trimester |\n| Hyperemesis gravidarum | First Trimester (into early Second Trimester) |\n| Acute Pyelonephritis | First Trimester to Third Trimester |\n| NSAID use | Postpartum |\n| Cortical Necrosis | Third Trimester to early Postpartum |\n| Preeclampsia/Eclampsia/HELLP | late Second Trimester to early Postpartum |\n| Acute Fatty Liver | Third Trimester |\n| Thrombotic Thrombocytopenic Purprua | Second Trimester to early Postpartum |\n| Atypical HUS | late Third Trimester to Postpartum |\n| Obstruction | Third Trimester |\n| Glomerulonephritis Flare | First Trimester to Postpartum |"
        title: "شكل 1 في الكتاب، ص 356: تايملاين الـ AKI في الحمل"
        alt: "Timeline with four columns, first trimester, second trimester, third trimester and postpartum. Bars: septic abortion and hyperemesis in the first trimester; acute pyelonephritis from late first to third; TTP second to third; preeclampsia, eclampsia and HELLP late second to early postpartum; acute fatty liver third; obstruction third; cortical necrosis third to postpartum; atypical HUS and NSAID use postpartum; glomerulonephritis flare across all."
        caption: "اقرا العيانة بالشهر: أول الحمل = **جفاف وإجهاض**، آخره = **preeclampsia وأخواتها**، بعد الولادة = ==aHUS و non-steroidal anti-inflammatory drugs (NSAIDs)==."
