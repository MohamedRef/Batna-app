    status: unverified
    tags: [numbers, high-yield]
    update:
      text: "ESH 2023 keeps the same grades (grade 1 140–159/90–99, grade 2 160–179/100–109, grade 3 ≥180/≥110). ACC/AHA 2017 calls 130–139/80–89 stage 1."
      ref: "ESH 2023; ACC/AHA 2017"
  - id: neph.L04.015
    kind: card
    topic: classification
    front: If SBP and DBP fall into different categories, which one classifies the patient?
    back: The higher category.
    src: { page: 82, quote: "If systolic blood pressure and diastolic blood pressure fall into different categories, the higher value should be taken for classification." }
    status: unverified
  - id: neph.L04.016
    kind: cloze
    topic: classification
    text: "In the BHS table notes, the threshold for hypertension on home monitoring is >{{c1::135/85}} mmHg and on 24-hour ambulatory monitoring >{{c2::125/80}} mmHg."
    src: { page: 82, quote: "Threshold blood pressure levels for the diagnosis of hypertension using self/home monitoring are >135/85 mmHg" }
    status: unverified
    tags: [numbers]
  - id: neph.L04.017
    kind: mcq
    topic: classification
    stem: A 45-year-old man has a clinic BP of 152/104 mmHg on two visits. How is he classified by the BHS table?
    options:
      - High normal
      - Grade 1 (mild)
      - Grade 2 (moderate)
      - Grade 3 (severe)
      - Isolated systolic hypertension
    answer: 2
    why:
      - High normal is 130–139/85–89.
      - SBP 152 alone is grade 1, but DBP 104 is grade 2.
      - "Correct: when SBP and DBP fall into different categories, the higher one counts: DBP 100–109 = grade 2 (p82)."
      - Grade 3 needs ≥180 or ≥110.
      - Isolated systolic needs DBP <90.
    src: { page: 82, quote: "If systolic blood pressure and diastolic blood pressure fall into different categories, the higher value should be taken for classification." }
    status: unverified
