  - id: neph.L11.157
    kind: cloze
    topic: pd-rx
    text: "PD adequacy target in pregnancy: Kt/V {{c1::2.2-2.4}}, usually about {{c2::20 liters}} of dialysate a day; calories {{c3::25 kcal/kg/day}}."
    src: { page: 381, quote: "Adopt right or left lateral decubitus position during the draining phase. Although it is not a regular practice to check the adequacy of peritoneal dialysis during pregnancy, a Kt/V between 2.2 and 2.4 is recommended, which usually requires a daily dialysate volume of about 20 liters. A suggested calorie intake of 25kcal/kg/d is recommended during pregnancy for those receiving peritoneal dialysis. (86,87) Complications associated with peritoneal dialysis during pregnancy include peritonitis, exit site infections, catheter displacement, hemoperitoneum, drain pain, gastroesophageal reflux, and, in rare instances, postpartum peritonitis" }
