  - id: geri.L08.047
    kind: order
    topic: tendon-mx
    prompt: Order the steps of a PRP injection.
    steps:
      - Take one to a few tubes of the patient's own blood
      - Spin it down in a centrifuge
      - Collect and concentrate the platelets 2 to 8 times
      - Mix the platelets into a plasma liquid base
      - Inject into the injured area, sometimes ultrasound-guided
    src: { page: 138, quote: "PRP injections are prepared by taking anywhere from one to a few tubes of your own blood. It is then run (\"spun down\") in a centrifuge to separates the blood into its various components: red and white blood cells, plasma, platelets, etc. The platelets are collected and concentrated from 2 to 8 times their normal number. The platelets are then mixed into a blood plasma liquid base and injected directly into the area of injury. Ultrasound imaging is sometimes used to guide the injection. The images below show a PRP injection into a patient's torn tendon. The ultrasound guidance is shown at left and the injection is shown at right." }
    status: unverified
  - id: geri.L08.048
    kind: card
