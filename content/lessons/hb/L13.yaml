          - **Bacterial cholangitis**: الصفرا واقفة ورا الـ strictures، فالبكتيريا بتلاقي فرصة.
          - **Biliary stone disease**: نفس السبب، الركود بيعمل حصوات.
          - ==Dominant stricture==: ضيق واحد شديد بيسد السكة.
          - ==Cholangiocarcinoma==: من الـ chronic inflammation في القنوات.
