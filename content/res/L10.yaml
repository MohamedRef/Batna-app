      Textbooks are limited for information on the cause, diagnosis, prognosis or treatment of a disorder: to stay up to date a
      textbook may need yearly revision, while research and journal publication take years. Review articles and guidelines are a
      useful short cut for busy practitioners.
    src: { page: 86, quote: "Review articles and guidelines vs. Textbooks\n  Review articles and guidelines often present a useful short cut for many busy practitioners who do not have the time to master the literature on multiple public health topics.\n  To find the best quality evidence for medical decision making, Sackett and colleagues recommended that practitioners burn their (traditional) textbooks.\n  Although this approach may seem radical, it does bring to light the limitations of textbooks for providing information on the cause, diagnosis, prognosis, or treatment of a disorder." }
    status: unverified
