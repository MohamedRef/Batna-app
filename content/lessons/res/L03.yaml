      - "Specific objectives: smaller portions، تفاصيل: إيه، فين، علشان إيه."
      - "افحص أي objective: action verb، population، place، time، feasible، realistic."
      - "To understand… = vague. كل تلاميذ مصر = not feasible. نقضي على HCV في 2022 = not realistic."
    practice: [res.L03.072, res.L03.073, res.L03.074, res.L03.075, res.L03.076, res.L03.077, res.L03.078, res.L03.079, res.L03.080, res.L03.081, res.L03.082]
