  # ---------- p202-204: exacerbation ----------
  - id: geri.L11.056
    kind: card
    topic: exacerbation
    front: Define an acute exacerbation of COPD.
    back: An acute change in sputum volume or purulence and/or more dyspnea beyond usual day-to-day variation that warrants a change in therapy.
    src: { page: 202, quote: "Defined as an acute change in sputum volume or purulence, and/or an increase in dyspnea beyond usual day-to-day variation that warrants a change in therapy." }
    status: unverified
    tags: [high-yield]
