  - id: git.L03.251
    kind: mcq
    topic: biliary
    stem: >-
      Two years after cholecystectomy, a 48-year-old woman has recurrent RUQ biliary-type pain. During attacks ALT
      is 2.5 times normal, and MRCP shows a 12 mm CBD without stones. What is the best next step?
    options:
      - Empirical endoscopic sphincterotomy without manometry
      - Sphincter of Oddi manometry before any sphincterotomy
      - Nifedipine and review
      - Cholescintigraphy with CCK
      - Reassurance; this is a functional disorder
    answer: 0
    why:
      - "Correct: pain plus raised enzymes plus duct over 10 mm is biliary type I; SOM is not indicated and sphincterotomy relieves 90-95%."
      - SOM is misleading (normal in 14-35%) in type I and adds endoscopic retrograde cholangiopancreatography (ERCP) pancreatitis risk.
      - Drugs lack consistent outcome data; type I has a clear structural answer.
      - Gallbladder scintigraphy is for functional gallbladder disorder; she has no gallbladder.
      - Type I sphincter of Oddi dysfunction (SOD) is an obstructive disorder that responds to sphincterotomy.
    src: { page: 134, quote: "When the SOM result is normal, pain relief after sphincterotomy still occurs in 90% to 95% of patients with type I biliary SOD." }
    status: unverified
