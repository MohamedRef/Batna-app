          - **في النص**: 6 مربعات من الشمال لليمين: ↓ hyperglycaemia، ↓ visceral adiposity، ↓ serum uric acid، ↓ oxidative stress، ↓ inflammation، و==↑ adiponectin== (الوحيد اللي بيطلع).
          - **تحت**: كل الأسهم بتتجمع على الكبد = ==↓ NAFLD و↓ NASH==.
