  - id: res.L09.lesson2
    title: "الأخلاقيات اتكتبت بعد فضايح: من Nuremberg لـ Belmont"
    hook: "كل قاعدة في أخلاقيات البحث وراها حكاية حد اتأذى. اعرف الحكاية تفتكر القاعدة."
    minutes: 8
    pages: [16, 33]
    topics: [ethics-basics, history]
    goals:
      - "تعرّف ethics و research و human subject research"
      - "ترتّب Nuremberg و Helsinki و Belmont وتعرف كل واحد قال إيه"
      - "تعدّ مشاكل الأبحاث اللي خلّت الـ guidelines تتكتب"
    status: unverified
    steps:
      - kind: explain
        page: 19
        quote: "What do we mean by ethics?\n  Morality or ethics represents a code of conduct that governs how people treat each other.\n  In essence, it is concerned with the way people act or behave.\n  The term 'ethics' usually refers to the moral principles, guiding conduct, which are held by a group or even a profession\" (Wellington, 2000: 54)"
        title: "يعني إيه ethics؟"
        text: |
          الكلمة من اليوناني **ethos**: «مجموعة المبادئ الأخلاقية» (slide 18).

          الـ ==ethics== = **code of conduct** بيحكم الناس بتتعامل مع بعض إزاي، ويخص طريقة تصرفهم. وعادة يقصد بيه المبادئ اللي **جماعة أو مهنة** ماشية بيها.

          والـ **bioethics** = نفس الكلام بس على الجانب الأخلاقي في الـ biomedical research والممارسة (slide 20).
      - kind: explain
        remind: [res.L09.019]
        page: 21
        quote: "WHY WORRY ABOUT RESEARCH ETHICS?\n  The science itself\n  Other scientists\n  The research participant\n  The public\n  The future\n  Ourselves"
        title: "ليه نقلق من أخلاقيات البحث؟"
        text: |
          لأن البحث الوحش بيأذي ٦ أطراف:

          - **The science itself**
          - **Other scientists**
          - **The research participant**
          - **The public**
          - **The future**
          - **Ourselves**
      - kind: explain
        page: 24
        quote: "Human Subject Research\nA research Involving living individuals about whom the researcher obtains:\n  Data through intervention or interaction\n  OR\n  Identifiable Private/Human material AND information"
        title: "إمتى البحث يبقى human subject research؟"
        text: |
          الـ ==research== = **systematic investigation** (فيه development و testing و evaluation) هدفه **generalizable knowledge** (slide 23).

          ويبقى ==human subject research== لما يكون على **ناس عايشين**، والباحث بياخد منهم:

          - **data through intervention or interaction**، **أو**
          - **identifiable private information** أو human material.

          والهدف دايمًا **balancing two goals**: تقدم العلم، وحماية حقوق وسلامة المشارك (slide 25).
      - kind: explain
        page: 27
        quote: "History of Research Ethics\nCodes, guidelines & regulations developed to guide research involving human participants.\nGuidelines were created in response to:\n  1. An ethical lapses in research.\n  2. Provide answers to new problems and challenges in research."
        title: "الـ guidelines اتعملت ليه؟"
        text: |
          الـ codes والـ guidelines اتكتبت **رد فعل** على حاجتين:

          1. **Ethical lapses** في الأبحاث (فضايح).
          2. **مشاكل وتحديات جديدة** محتاجة إجابة.
      - kind: figure
        remind: [res.L09.032]
        page: 33
        quote: "The Belmont Report\n  In 1974, the National Commission for the Protection of Human Subjects of Biomedical and Behavioral Research was established.\n  In 1978, it submitted The Belmont Report that sets the fundamental ethical principles\n    1. Respect for persons\n    2. Beneficence\n    3. Justice"
        title: "خط الزمن"
        alt: "Timeline: Nuremberg Code 1947, voluntary consent; Declaration of Helsinki 1964 by the World Medical Association in Finland, subject before science; National Commission 1974; Belmont Report 1978 with respect for persons, beneficence and justice."
        caption: "**1947** Nuremberg ← **1964** Helsinki ← **1974** National Commission ← **1978** Belmont."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R09h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <path d="M20 110H315" class="fg-arrow" marker-end="url(#R09h)"/>
            <circle cx="40" cy="110" r="6" class="fg-dot-acc"/>
            <circle cx="125" cy="110" r="6" class="fg-dot-acc"/>
            <circle cx="210" cy="110" r="6" class="fg-dot-acc"/>
            <circle cx="290" cy="110" r="6" class="fg-dot-good"/>
            <text x="40" y="135" text-anchor="middle" class="t-sm t-b">1947</text>
            <text x="125" y="135" text-anchor="middle" class="t-sm t-b">1964</text>
            <text x="210" y="135" text-anchor="middle" class="t-sm t-b">1974</text>
            <text x="290" y="135" text-anchor="middle" class="t-sm t-b">1978</text>
            <rect x="5" y="20" width="110" height="64" rx="6" class="fg-box"/>
            <text x="60" y="40" text-anchor="middle" class="t-sm t-b">Nuremberg Code</text>
            <text x="60" y="58" text-anchor="middle" class="t-sm">voluntary consent</text>
            <text x="60" y="74" text-anchor="middle" class="t-sm">withdraw any time</text>
            <rect x="120" y="20" width="110" height="64" rx="6" class="fg-box"/>
            <text x="175" y="40" text-anchor="middle" class="t-sm t-b">Helsinki (WMA)</text>
            <text x="175" y="58" text-anchor="middle" class="t-sm">subject first,</text>
            <text x="175" y="74" text-anchor="middle" class="t-sm">written consent</text>
            <rect x="150" y="150" width="175" height="62" rx="6" class="fg-good"/>
            <text x="237" y="170" text-anchor="middle" class="t-sm t-b">Belmont Report</text>
            <text x="237" y="188" text-anchor="middle" class="t-sm">respect for persons,</text>
            <text x="237" y="204" text-anchor="middle" class="t-sm">beneficence, justice</text>
            <rect x="5" y="150" width="135" height="44" rx="6" class="fg-thin"/>
            <text x="72" y="168" text-anchor="middle" class="t-sm">National Commission</text>
            <text x="72" y="184" text-anchor="middle" class="t-sm t-mut">established</text>
          </svg>
      - kind: explain
        page: 29
        quote: "Nuremberg Code (1947)\nFirst Codification of Research Guidelines\nHuman Rights + Welfare of Subjects\n  The first and longest principle: \"The voluntary consent of the human subject is absolutely essential.\"\n  Articles (2-8, 10):\n    1. Scientific value\n    2. Favorable risk/benefit ratio\n    3. Suffering by subjects should be avoided\n  Article (9): Subjects have the right to withdraw at any time"
        title: "Nuremberg Code (1947)"
        text: |
          أول **codification** لقواعد البحث: Do no harm + human rights.

          - أول وأطول مبدأ: «==The voluntary consent of the human subject is absolutely essential==».
          - المواد (2-8، 10): **scientific value**، **favorable risk/benefit ratio**، و**نتجنب معاناة** المشاركين.
          - المادة 9: من حقه **ينسحب في أي وقت**.
      - kind: explain
        page: 31
        quote: "The Declaration of Helsinki\nIt indicates:\n  The well-being of the subject should take precedence over the interests of science and society.\n  Physician should obtain the subject's freely given informed consent in writing.\n  Ethical review committee approval is a must."
        title: "Declaration of Helsinki (1964)"
        text: |
          عملها الـ **World Medical Association (WMA)** في فنلندا سنة **1964**، واتحدّثت 1975 و1983 و1989 و1996 و2000 و2008 (slide 30).

          بتقول:

          - ==مصلحة المشارك قبل مصلحة العلم والمجتمع==.
          - الدكتور ياخد **informed consent** بحرية و**مكتوب**.
          - موافقة **ethical review committee** لازم.
      - kind: check
        page: 31
        quote: "The Declaration of Helsinki\nIt indicates:\n  The well-being of the subject should take precedence over the interests of science and society.\n  Physician should obtain the subject's freely given informed consent in writing.\n  Ethical review committee approval is a must."
        question: "Which document first required ethical review committee approval and written consent from the subject?"
        options: ["Declaration of Helsinki", "Nuremberg Code", "Belmont Report"]
        answer: 0
        why:
          - "صح: Helsinki = subject before science، consent مكتوب، ولجنة أخلاقيات لازم."
          - "Nuremberg قال voluntary consent والانسحاب، بس الـ slides مش بتنسبله اللجنة."
          - "Belmont جه بعدها وحط الـ ٣ مبادئ."
      - kind: explain
        page: 32
        quote: "Problems with research include;\n  Lack of informed consent\n  Use of vulnerable population\n  Exploitation of vulnerable population\n  Withholding information and / or treatment\n  Putting subjects at risk\n  Risks outweigh benefits\n  Deception and violation of rights"
        title: "المشاكل اللي حصلت في أبحاث قبل كده"
        text: |
          - **Lack of informed consent**
          - **Use** و **exploitation** للـ vulnerable population
          - **Withholding** معلومات و/أو علاج
          - تعرّض المشاركين لـ **risk**
          - **Risks outweigh benefits**
          - **Deception** و **violation of rights**
      - kind: mnemonic
        page: 33
        quote: "The Belmont Report\n  In 1974, the National Commission for the Protection of Human Subjects of Biomedical and Behavioral Research was established.\n  In 1978, it submitted The Belmont Report that sets the fundamental ethical principles\n    1. Respect for persons\n    2. Beneficence\n    3. Justice"
        word: "RBJ"
        parts:
          - { key: "R", text: "Respect for persons" }
          - { key: "B", text: "Beneficence" }
          - { key: "J", text: "Justice" }
        hook: "**Belmont** (1978) = ٣ مبادئ بس: احترام، خير، عدل. كل الـ codes بتتفق عليهم."
      - kind: try
        items: [res.L09.029, res.L09.032, res.L09.019]
    recap:
      - "Human subject research = ناس عايشين + data من intervention/interaction أو identifiable private information."
      - "Nuremberg 1947: voluntary consent absolutely essential، وحق الانسحاب (المادة 9)."
      - "Helsinki 1964 (WMA، فنلندا): المشارك قبل العلم، consent مكتوب، لجنة أخلاقيات لازم."
      - "Belmont 1978: respect for persons، beneficence، justice."
    practice: [res.L09.016, res.L09.017, res.L09.018, res.L09.019, res.L09.020, res.L09.021, res.L09.022, res.L09.023, res.L09.024, res.L09.025, res.L09.026, res.L09.027, res.L09.028, res.L09.029, res.L09.030, res.L09.031, res.L09.032, res.L09.033, res.L09.034]
