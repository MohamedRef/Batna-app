  - id: rheum.L02.lesson3
    title: "النوبة: أسوأ وجع في حياته"
    hook: "مش قادر يحط الشراب، ولا حتى الملاية على صباعه. ده الـ podagra."
    minutes: 9
    pages: [31, 35]
    topics: [clinical, acute, chronic]
    goals:
      - "تعدّ الأربع syndromes"
      - "توصف النوبة الحادة بالأرقام"
      - "تعرف الـ tophi والكلى في الـ chronic gout"
    status: unverified
    steps:
      - kind: reveal
        page: 31
        quote: "Hyperuricaemia causes 4 clinical syndromes Acute urate synovitis- acute gout. Chronic polyarticular gout. Chronic tophaceous gout."
        prompt: "الـ hyperuricaemia بتعمل كام syndrome؟ عدّهم."
        answer: |
          أربعة:
          1. **Acute urate synovitis** (acute gout).
          2. **Chronic polyarticular gout**.
          3. **Chronic tophaceous gout**.
          4. **Urate stones** و **chronic urate nephropathy**.
      - kind: figure
        page: 31
        quote: "Natural History of Gout: Crystal Load Worsens if Uricemia Remains High"
        title: "الـ crystal load بيكبر"
        alt: "A timeline. First a long flat phase of high uric acid with no symptoms, 5 years or longer. Then flare bars that grow taller over time while the gaps between them shrink. A rising red line labelled crystal load ends in a large block labelled advanced gout."
        caption: "طول ما الـ urate عالي: النوبات تطول وتشتد، والفترات بينها تقصر، لحد advanced gout."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R02d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <path d="M20 180H320" class="fg-arrow" marker-end="url(#R02d)"/>
            <path d="M20 180V20" class="fg-arrow" marker-end="url(#R02d)"/>
            <text x="26" y="30" class="t-sm t-mut">pain</text>
            <text x="290" y="200" class="t-sm t-mut">time</text>
            <rect x="25" y="170" width="70" height="10" class="fg-good"/>
            <text x="25" y="200" class="t-sm">no symptoms</text>
            <text x="25" y="214" class="t-sm t-mut">5 years or more</text>
            <rect x="100" y="150" width="10" height="30" class="fg-acc"/>
            <rect x="140" y="130" width="12" height="50" class="fg-acc"/>
            <rect x="175" y="100" width="14" height="80" class="fg-acc"/>
            <rect x="205" y="75" width="16" height="105" class="fg-acc"/>
            <rect x="235" y="40" width="70" height="140" class="fg-bad"/>
            <text x="240" y="110" class="t-sm t-b">advanced</text>
            <text x="250" y="126" class="t-sm t-b">gout</text>
            <path d="M60 150L230 50" class="fg-arrow-bad" stroke-width="3"/>
            <text x="60" y="98" class="t-sm t-bad t-b">crystal load</text>
          </svg>
      - kind: explain
        page: 32
        quote: "Especially targeting the first metatarsophalangeal and small joints feet and hands."
        title: "بيبدأ فين؟"
        text: |
          الـ MSUM بتترسب في الـ **peripheral connective tissue** جوه وحوالين المفاصل، و**الرجل قبل الإيد**:

          - ==First MTP== والمفاصل الصغيرة في الرجلين والإيدين.
          - Knee، ankle، midtarsal، wrist، elbow.

          ليه الأطراف؟ الـ urate بيذوب أقل في الحرارة الأقل، والأطراف أبرد (تفسير فسيولوجي مقبول). والبلورات بتاخد **شهور لسنين** عشان تكبر، فيه asymptomatic phase طويلة.
      - kind: mnemonic
        page: 32
        quote: "Extremely rapid onset, reaching maximum severity in 2-6 hours, often awaking the patient in the early morning."
        word: "SOCKS"
        hook: "مش قادر يلبس الشراب (socks). خمس صفات للنوبة الحادة."
        parts:
          - { key: "S", text: "Sudden: peak في 2-6 ساعات، بيصحيه الفجر" }
          - { key: "O", text: "Ouch: أسوأ وجع في حياته" }
          - { key: "C", text: "Can't bear a sock or bedding: extreme tenderness" }
          - { key: "K", text: "Kind of red, shiny, swollen skin" }
          - { key: "S", text: "Self-limiting في 5-14 يوم ويرجع طبيعي" }
      - kind: check
        page: 33
        quote: "Main differential diagnosis septic arthritis, infective cellulitis or another crystal disease."
        question: "Hot swollen first MTP with fever and malaise. What is the main differential?"
        options: ["Septic arthritis", "Osteoarthritis", "Plantar fasciitis", "Stress fracture"]
        answer: 0
        why:
          - "صح: الـ gout ممكن يعمل fever و malaise و confusion، فالـ sepsis لازم يتنفى (ومعاه cellulitis وبلورات تانية)."
          - "الـ OA مش بيعمل مفصل أحمر سخن بالشكل ده."
          - "مش بيعمل مفصل MTP ملتهب."
          - "مش inflammatory بالصورة دي."
      - kind: explain
        page: 33
        quote: "In most a second attack occurs within 1 year."
        title: "ما بين النوبات"
        text: |
          الـ ==intercritical periods== مفيهاش أعراض.

          - ناس مش بيجيلها نوبة تانية خالص، وناس بعد سنين.
          - **أغلبهم: الـ second attack خلال سنة**.
          - مع الوقت النوبات تكتر وتشتد وتمسك مفاصل أكتر.
          - من أول نوبة للـ chronic: حوالي **10 سنين**، والمحدد الأساسي **مستوى الـ uric acid**.

          وفي آخر النوبة: **pruritus** و **desquamation** للجلد.
      - kind: explain
