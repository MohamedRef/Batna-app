  # ---------- p6-7: other islet tumours ----------
  - id: endo.L01.036
    kind: card
    topic: other-islet
    front: Characteristic skin rash of glucagonoma?
    back: Necrolytic migratory erythema.
    src: { page: 6, quote: "Glucagonoma\n  Necrolytic migratory erythema.\n  Hypoaminoacidaemia, Type 2 DM, muscle wasting, cachexia, DVT.\n  Tail of Pancreas most common site.\n  Surgical removal is treatment of choice.\n  However, 50-80% with metastases at time of diagnosis.\n  Optimize medical conditions, Total pancreatectomy, octreotide.\n  Chemotherapy: - 5FU, streptozotocin, dacarbazine." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.037
    kind: card
    topic: other-islet
    front: Features of glucagonoma besides the rash?
    back: Hypoaminoacidaemia, type 2 diabetes, muscle wasting, cachexia and DVT.
    src: { page: 6, quote: "Glucagonoma\n  Necrolytic migratory erythema.\n  Hypoaminoacidaemia, Type 2 DM, muscle wasting, cachexia, DVT.\n  Tail of Pancreas most common site.\n  Surgical removal is treatment of choice.\n  However, 50-80% with metastases at time of diagnosis.\n  Optimize medical conditions, Total pancreatectomy, octreotide.\n  Chemotherapy: - 5FU, streptozotocin, dacarbazine." }
    status: unverified
  - id: endo.L01.038
    kind: cloze
