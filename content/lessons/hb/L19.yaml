        quote: "Complications and Sequelae of Gall Stones\nI. IN THE GALL BLADDER:\n  a. Silent gall stones.\n  b. Acute cholecystitis.\n  c. Chronic cholecystitis.\n  d. Gangrene of gall bladder.\n  e. Perforation of gall bladder.\n  f. Mucocele of gall bladder.\n  g. Empyaema of gall bladder.\n  h. Emphysematous cholecystitis.\n  i. Hydrops of gall bladder.\n  j. Adenomyomatosis of gall bladder.\n  k. Cholesterosis of gall bladder.\n  l. Polyposis of gall bladder.\n  m. Cholecystitis glandularis proliferans.\n    Diverticulosis of gall bladder.\n    Thypoid gall bladder.\n    Carcinoma of gall bladder."
        title: "المضاعفات بالمكان: أسهل شكل للـ essay"
        text: |
          أسهل شكل تكتب بيه المضاعفات في الـ essay: قسّمها بالمكان.

          **In the gallbladder**:
          - silent stones، acute و chronic cholecystitis
          - **gangrene**، **perforation**
          - **mucocele**، **empyema**، **hydrops**
          - **emphysematous cholecystitis**
          - adenomyomatosis، cholesterosis، polyposis، cholecystitis glandularis proliferans، diverticulosis، typhoid GB
          - **carcinoma**

          **In the bile ducts**:
          - **Obstructive jaundice**
          - **Cholangitis**
          - **Acute relapsing pancreatitis**

          **In the intestine**:
          - ==Gallstone ileus==: acute intestinal obstruction
          - **Bouveret's syndrome**

          والقايمة المختصرة في صفحة 386 بتزوّد ==Mirizzi syndrome== و rupture GB (والـ pyocele = empyema).

          ليه التقسيم بالمكان أسهل؟ لأن مكان الحصوة هو اللي بيحدد المرض، زي الرسمة اللي فاتت: نفس الحصوة في الـ cystic duct غير في الـ CBD غير في الـ ileum.
      - kind: explain
        page: 386
        quote: "Mucocele of the GB, Pyocele of the GB."
        title: "كل مضاعفة: إيه اللي حصل جوّه المرارة؟"
        text: |
          الكتاب بيدّي الأسماء بس. ده التفسير المقبول (مش في الكتاب) لأهم مضاعفات المرارة، وكلها نفس البداية: حصوة قفلت الـ cystic duct. السؤال: إيه اللي حصل للي جوّه؟

          - **Mucocele (hydrops)**: الباب اتقفل ومفيش infection. الـ bile pigments بتتمص، والـ mucosa بتفضل تفرز mucus، فالمرارة تتملي مخاط وتكبر.
          - **Empyema (pyocele)**: نفس المرارة المقفولة، بس دخلها bacteria، فبقت كيس صديد.
          - **Gangrene**: الضغط جوّه بيعلى لحد ما يقفل الدم عن الجدار.
          - **Perforation / rupture**: الجدار الميت بيتقطع. لو اتلم حواليه = abscess، ولو مفتوح = biliary peritonitis.
          - **Emphysematous cholecystitis**: bacteria بتعمل غاز في الجدار، وأكتر في الـ diabetics.
          - **Carcinoma**: التهاب مزمن سنين. علشان كده الكتاب في صفحة 385 بيشيل المرارة الصامتة لو الحصوة > 3 cm أو المرارة porcelain.

          يعني مش محتاج تحفظهم كقايمة: اسأل الباب مقفول؟ فيه bacteria؟ الدم وصل؟
