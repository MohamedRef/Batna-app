        text: |
          ظهور الـ ascites في chronic liver disease معناه إن الـ prognosis **بيسوء**:
          - mortality **50% خلال سنتين** و **80% خلال 5 سنين** من أول episode.
          - الـ high-risk: **persistent ascites**، **Na <130**، **SBP**، و **renal impairment**.
      - kind: check
