      - kind: explain
        page: 180
        quote: "1) The finding of UIP on lung biopsy predicts a median survival of less than 5 years. 2) A low DLCO"
        title: "Complications و prognosis"
        text: |
          **Complications**: pulmonary hypertension، acute exacerbation، respiratory infection، ACS، thromboembolism، adverse drug effects، و ==lung cancer==.

