        caption: "الرقم بيتغير حسب الموقف: في الـ cirrhosis أي DNA، في الـ healthcare worker **> 200**، وفي غير كده DNA أعلى من 2,000 مع الـ ALT. الكروت جاية من 3 صفحات: الـ cirrhosis ص 120، والـ healthcare worker والـ HCV ص 121، والـ occult HBV ص 122."
        svg: |
