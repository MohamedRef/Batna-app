  - id: rheum.L01.lesson8
    title: "الـ cytokines جوه مفصل الـ RA"
    hook: "اللي بيهد مفصل الـ RA هو نفسه اللي بنعالجه: TNF. ولو عرفت مين بيعمل إيه، هتعرف الدوا بيقفل إيه."
    minutes: 10
    pages: [19, 21]
    topics: [ra, classification]
    goals:
      - "تشرح دور TNF-α و IL-1 والـ Th subsets في الـ RA"
      - "تعرف مين بيبني الـ osteoclast ومين بيوقفه"
      - "تعدّ تصنيفات الـ cytokines في صفحة 21"
    status: unverified
    steps:
      - kind: explain
        page: 20
        quote: "In RA, the inflammatory response is mainly mediated by TNFα, whereas cartilage and bone destruction is mostly directed by IL-1."
        title: "الـ RA: مين بيعمل إيه؟"
        text: |
          - ==TNF-α== = **inflammation**.
          - ==IL-1== = **cartilage and bone destruction**.
          - في الـ synovial fluid: **Th1 predominance**، وزيادة واضحة في **Th17**.
          - الـ **imbalance** بين Th1/Th2/Th17 هو المفتاح.

          Th1 cytokines (IL-2، IFN-γ) ← cellular immunity. Th2 (IL-4، 5، 6، 10، 13) ← antibodies. Th17 ← fungi و extracellular pathogens.
      - kind: explain
        page: 20
        quote: "Th1 cytokines are defined as the cytokines that favor T-cell mediated cellular immunity, cytotoxicity and monocyte activation, leading to the amplified production of pro-inflammatory cytokines."
        title: "ليه سيطرة Th1 بتولّع المفصل؟"
        text: |
          الكتاب بيعرّف الـ **Th1 cytokines** إنها بتشجّع:
          - **T-cell mediated cellular immunity**.
          - **Cytotoxicity**.
          - **Monocyte activation**، وده اللي بيعمل ==amplified production== للـ pro-inflammatory cytokines.

          والـ **pro-inflammatory cytokines** بتبدأ الـ inflammation cascade بإنها تشغّل genes بتصنّع **small inflammatory mediator molecules**.

          يعني الدايرة: Th1 ← monocyte/macrophage يتنشّط ← TNF-α و IL-1 أكتر ← التهاب أكتر ← Th1 أكتر. عشان كده سيطرة Th1 في الـ synovial fluid مش تفصيلة، دي **الموتور**.
      - kind: aside
        tone: exam
        page: 20
        quote: "In RA, the inflammatory response is mainly mediated by TNFα, whereas cartilage and bone destruction is mostly directed by IL-1."
        text: "فخ امتحان مشهور: «inflammation في الـ RA سببها الرئيسي؟» TNF-α. «تآكل الغضروف والعضم؟» IL-1. ماتبدّلهمش."
      - kind: reveal
        page: 20
        quote: "Synovial T cells may be activated by T-cell receptor (TCR) and co- stimulation pathways and by cytokine- or Toll-like receptor-driven stimuli."
        prompt: "الـ T cell في الـ synovium بيتنشّط إزاي؟"
        answer: |
          الكتاب بيقول بطريقتين:
          - **TCR + co-stimulation**: الطريقة الكلاسيكية، يعني antigen بيتعرض عليه.
          - **Cytokines أو Toll-like receptors (TLRs)**: من غير antigen محدد.

          التفسير المقبول (مش في الكتاب): الطريقة التانية بتفسّر ليه الالتهاب ممكن يكمّل حتى لو الـ antigen الأصلي مش واضح، عشان الـ cytokines اللي في المفصل نفسها بتنشّط T cells جديدة.
      - kind: figure
        page: 19
        quote: "Cytokines and the osteoclast (figure)\nTH17 cells:\n  IL-17, IL-1, TNF → RANKL, M-CSF → Osteoclast precursor cell → Osteoclast\nSynovial fibroblast:\n  IL-7, RANKL, M-CSF → Osteoclast precursor cell → Osteoclast\nTH1 cells:\n  RANKL, M-CSF (promote)\n  IFNγ, GM-CSF (inhibit), induced by IL-18\nTH2 cells:\n  IL-4, IL-10 (inhibit)"
        title: "مين بيبني الـ osteoclast؟"
        alt: "An osteoclast precursor in the centre becomes an osteoclast at the bottom. From the top, TH17 releases IL-17, IL-1 and TNF; synovial fibroblasts release IL-7; these raise RANKL and M-CSF which push the precursor forward. From the sides, TH2 releases IL-4 and IL-10, and TH1 releases IFN-gamma and GM-CSF, which block the step; IL-18 also blocks it."
        caption: "من فوق: IL-17 و IL-1 و TNF و IL-7 ← receptor activator of NF-κB ligand (RANKL) و M-CSF ← osteoclast. من الجناب: IL-4 و IL-10 و IFN-γ و GM-CSF و IL-18 بيقفلوا."
        svg: |
          <svg viewBox="0 0 330 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R01d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="5" y="10" width="320" height="44" rx="8" class="fg-bad"/>
