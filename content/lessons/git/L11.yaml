  # Split from lesson1 on 2026-11-13 (#828): causes.
  - id: git.L11.lesson5
    title: "الأسباب: مين بينزف وليه؟"
    hook: "القرحة لوحدها قرب نص الحالات، والدوالي لحد الخُمس. والباقي أسماء غريبة بس كل واحد ليه شكل يتحفظ."
    minutes: 8
    pages: [300, 308]
    topics: [causes]
    goals:
      - "تحفظ أسباب الـ upper gastrointestinal bleeding (UGIB) بنسبها"
      - "تفرّق بين angioectasia و telangiectasia و Dieulafoy"
      - "تعرف ليه الـ erosive gastritis نادرًا تنزف جامد"
    status: unverified
    steps:
      - kind: table
        page: 300
        quote: "Peptic ulcers account for 40% of major upper gastrointestinal bleeding with an overall mortality rate of less than 5%. The incidence of bleeding from ulcers is declining due to eradication of H pylori and prophylaxis with proton pump inhibitors in high-risk patients. Portal hypertension accounts for 10–20% of upper gastrointestinal bleeding. Bleeding usually arises from esophageal varices and less commonly gastric or duodenal varices or portal hypertensive gastropathy."
        title: "الأسباب بالنسب"
        columns: ["Cause", "Share of UGIB"]
        rows:
          - ["Peptic ulcer", "40% (mortality <5%)"]
          - ["Portal hypertension", "10-20%"]
          - ["Vascular anomalies", "7%"]
          - ["Erosive gastritis", "<5% of severe bleeds"]
          - ["Gastric neoplasms", "1%"]
        hide: [[0, 1], [1, 1], [2, 1], [4, 1]]
      - kind: explain
        page: 300
        quote: "Peptic ulcers account for 40% of major upper gastrointestinal bleeding with an overall mortality rate of less than 5%. The incidence of bleeding from ulcers is declining due to eradication of H pylori and prophylaxis with proton pump inhibitors in high-risk patients. Portal hypertension accounts for 10–20% of upper gastrointestinal bleeding. Bleeding usually arises from esophageal varices and less commonly gastric or duodenal varices or portal hypertensive gastropathy."
        title: "القرحة والدوالي"
        text: |
          - ==Peptic ulcer== لسه السبب الأول، بس بيقل بفضل **H. pylori eradication** و **proton pump inhibitor (PPI) prophylaxis** للـ high-risk.
          - ==Portal hypertension==: من **esophageal varices** غالبًا، وأقل من gastric أو duodenal varices أو **portal hypertensive gastropathy**. (تفاصيل الدوالي في hb.L03.)

          ليه نزيف القرحة بيقل؟ الكتاب: بفضل الـ **H. pylori eradication** والـ **PPI prophylaxis** للـ high-risk. يعني لو شلت السبب (البكتيريا) القرحة ما بترجعش، ولو حميت المعدة من الحمض عند اللي على NSAIDs أو aspirin القرحة ما بتتعملش أصلًا. وليه الدوالي بتنزف جامد؟ التفسير المقبول (مش في الكتاب): دي veins ضغطها عالي، جدارها رفيع ومن غير عضلات تحميها، فلما تتفتح بتنزف كتير ومفيش انقباض يقفلها.
      - kind: explain
        page: 300
        quote: "Vascular anomalies are found throughout the gastrointestinal tract and may be the source of chronic or acute gastrointestinal bleeding. They account for 7% of cases of acute upper tract bleeding. The most common are Angio ectasias (angiodysplasias), which are 1–10 mm distorted, aberrant submucosal vessels caused by chronic, intermittent obstruction of submucosal veins."
        title: "الـ vascular anomalies: 7%"
        text: |
          الـ ==vascular anomalies== موجودة في الـ GI tract كله، وبتعمل نزيف **chronic أو acute**، وهي **7%** من الـ acute upper bleeding.

          أشهرها الـ ==angioectasias== (angiodysplasias): أوعية **1-10 mm** مشوّهة تحت الـ mucosa.

          ليه بتتكوّن؟ الكتاب: من **chronic, intermittent obstruction of submucosal veins**. يعني الـ vein بيتقفل ويتفتح سنين، فالضغط بيرجع على الشعيرات اللي قبله، فتوسع وتتلخبط لحد ما تبقى كُبّة أوعية رفيعة قريبة من السطح تنزف بسهولة، أحيانًا رشح (chronic) وأحيانًا نوبة (acute).
      - kind: match
        page: 301
        quote: "They have a bright red stellate appearance and occur throughout the gastrointestinal tract but most commonly in the right colon. Telangiectasias are small, cherry red lesions caused by dilation of venules that may be part of systemic conditions (hereditary hemorrhagic telangiectasia, CREST syndrome) or occur sporadically. The Dieulafoy lesion is an aberrant, large-caliber submucosal artery, most commonly in the proximal stomach that causes recurrent, intermittent bleeding."
        prompt: "وصّل كل vascular lesion بوصفها:"
        pairs:
          - ["Angioectasia", "1-10 mm stellate vessels, mostly right colon"]
          - ["Telangiectasia", "Cherry-red dilated venules; HHT or CREST"]
          - ["Dieulafoy lesion", "Large submucosal artery, proximal stomach"]
          - ["Aortoenteric fistula", "Complicates 2% of aortic grafts"]
        why: "الـ angioectasia = أوعية مشوّهة 1-10 mm، أكتر حاجة في الـ right colon. الـ telangiectasia = venules متوسعة، مع HHT أو Calcinosis, Raynaud's, esophageal dysmotility, sclerodactyly, telangiectasia (CREST). الـ Dieulafoy = شريان كبير غلط تحت الـ mucosa، بينزف ويقف ويرجع. والـ aortoenteric fistula مع 2% من الـ aortic grafts."
      - kind: aside
        tone: analogy
        page: 301
        quote: "They have a bright red stellate appearance and occur throughout the gastrointestinal tract but most commonly in the right colon. Telangiectasias are small, cherry red lesions caused by dilation of venules that may be part of systemic conditions (hereditary hemorrhagic telangiectasia, CREST syndrome) or occur sporadically. The Dieulafoy lesion is an aberrant, large-caliber submucosal artery, most commonly in the proximal stomach that causes recurrent, intermittent bleeding."
        text: |
          الـ **Dieulafoy** زي ماسورة مياه رئيسية معدّية تحت بلاط رفيع. البلاط يتشرخ شرخ صغير، المية تطرطش جامد، وبعدين يقف. المنظار ممكن يطلع normal مرتين قبل ما تمسكه وهو بينزف.
      - kind: explain
        page: 301
        quote: "Gastric neoplasms result in 1% of upper gastrointestinal hemorrhages. Erosive gastritis is superficial, so it is a relatively unusual cause of severe gastrointestinal bleeding (less than 5% of cases) and more commonly results in chronic blood loss. Gastric mucosal erosions are due to NSAIDs, alcohol, or severe medical or surgical illness (stress-related mucosal disease). Severe erosive esophagitis due to chronic gastroesophageal reflux may rarely cause significant upper gastrointestinal bleeding, especially in patients who are bedbound long-term. An aortoenteric fistula complicates 2% of abdominal aortic grafts or, rarely, can occur as the initial presentation of a previously untreated aneurysm. Unusual causes of upper gastrointestinal bleeding include hemobilia (from hepatic tumor, angioma, penetrating trauma), and pancreatic malignancy and pseudoaneurysm (hemosuccus pancreaticus)."
        title: "الباقي"
        text: |
          - **Erosive gastritis**: superficial فنادرًا تعمل نزيف شديد (<5%)، وغالبًا **chronic loss**. أسبابها **nonsteroidal anti-inflammatory drugs (NSAIDs)**، **alcohol**، و **stress-related mucosal disease**.
          - **Severe erosive esophagitis** نادرًا تنزف جامد، خصوصًا في اللي نايمين على السرير مدة طويلة.
          - غريبة: ==hemobilia== (hepatic tumor، angioma، trauma) و ==hemosuccus pancreaticus== (pancreatic malignancy أو pseudoaneurysm).

          ليه الـ erosive gastritis نادرًا تنزف جامد؟ الكتاب: لأنها **superficial**. التفسير المقبول (مش في الكتاب): الـ erosion بتقف عند الـ mucosa، والشرايين الكبيرة تحتها في الـ submucosa، فبتنزف رشح من شعيرات (chronic loss)، عكس القرحة اللي بتحفر لحد ما توصل لشريان. وليه الـ aortoenteric fistula مرعبة؟ لأن الـ graft بيلزق في الأمعاء ويآكل جدارها لحد ما يفتح فيها، فالنزيف بيبقى من الأورطى نفسه.
      - kind: figure
        page: 308
        quote: "Figure 1: The most common causes of GI bleeding according to its location."
        title: "الأسباب على خريطة الـ GI tract"
        image: { file: git/L11-bleeding-sites.webp, book: true }
        alt: "Book drawing of the digestive tract with bleeding causes labelled by site. Upper: Mallory-Weiss tear, esophageal varices, gastric ulcer, duodenal ulcer, hemorrhagic gastritis. Small intestinal: ischemic bowel disease, intussusception, Meckel diverticulum. Lower: angiodysplasia, colonic carcinoma, rectosigmoid carcinoma, inflammatory bowel disease, diverticulosis, hemorrhoids, anal fissure."
        caption: |
          كل سبب في مكانه:
          - **فوق**: varices، Mallory-Weiss، ==peptic ulcer== (gastric و duodenal)، hemorrhagic gastritis.
          - **الـ small bowel**: ischemic bowel، intussusception، **Meckel**.
          - **تحت**: ==diverticulosis==، angiodysplasia، carcinoma، inflammatory bowel disease، hemorrhoids و fissure.
      - kind: sort
        page: 308
        quote: "Table 1: The most common causes of upper GIT bleeding:\n| Etiologies of non-variceal upper gastrointestinal bleeding |  |\n|---|---|\n| Ulcer/ inflammation | Peptic ulcer disease; Erosive esophagitis, gastritis or duodenitis; Anastomotic ulcers (post gastric bypass) |\n| Vascular lesions | Gastric antral vascular ectasia; Dieulafoy's lesion; Angiodysplasia/ Arteriovenous malformation; Aorto-enteric fistula |\n| Congestive gastropathy | Portal hypertensive gastropathy |\n| Malignant lesions | Gastrointestinal stromal tumors (GIST); Non-GIST (e.g., Lipoma, schwannoma); Gastric and esophageal cancer; Metastatic lesions in the upper GI tract |\n| Post procedural | Endoscopic mucosal and submucosal dissection; Post sphincterotomy |\n| Others | Mallory Weis tear; Cameron ulcers |"
        prompt: "حط كل سبب في مجموعته من Table 1 (etiologies of non-variceal bleeding):"
        bins: ["Ulcer / inflammation", "Vascular", "Malignant", "Others / post procedural"]
        cards:
          - { text: "Anastomotic ulcer after gastric bypass", bin: 0 }
          - { text: "Erosive duodenitis", bin: 0 }
          - { text: "GAVE", bin: 1 }
          - { text: "Dieulafoy lesion", bin: 1 }
          - { text: "GIST", bin: 2 }
          - { text: "Schwannoma", bin: 2 }
          - { text: "Mallory-Weiss tear", bin: 3 }
          - { text: "Post sphincterotomy", bin: 3 }
          - { text: "Cameron ulcer", bin: 3 }
        why: "الجدول بيقسّم: ulcer/inflammation، vascular، congestive (PHG)، malignant (GIST، non-GIST زي lipoma و schwannoma، cancer، metastases)، post procedural، و others (Mallory-Weiss و Cameron)."
      - kind: case
        page: 301
        quote: "The Dieulafoy lesion is an aberrant, large-caliber submucosal artery, most commonly in the proximal stomach that causes recurrent, intermittent bleeding."
        stem: "A 55-year-old man has had three episodes of large, painless hematemesis over two months. Two endoscopies between episodes were normal."
        steps:
          - question: "Most likely lesion?"
            options: ["Dieulafoy lesion", "Erosive gastritis", "Gastric neoplasm", "Telangiectasia"]
            answer: 0
            why: "شريان كبير تحت الـ mucosa بينزف ويقف ويرجع (recurrent, intermittent)، فالمنظار بين النوبات ممكن يطلع normal."
          - question: "Where is it most commonly found?"
            options: ["Proximal stomach", "Right colon", "Third part of the duodenum", "Distal esophagus"]
            answer: 0
            why: "الـ proximal stomach. الـ right colon ده مكان الـ angioectasia."
      - kind: try
        items: [git.L11.012, git.L11.017, git.L11.019, git.L11.021, git.L11.025]
    recap:
      - "Peptic ulcer 40% (بيقل بالـ eradication والـ PPI)، portal hypertension 10-20%، vascular 7%، erosive gastritis أقل من 5%، neoplasm 1%."
      - "Angioectasia: أوعية 1-10 mm من انسداد الـ veins المتقطع، أكتر في الـ right colon. Telangiectasia: HHT و CREST."
      - "Dieulafoy = شريان كبير في الـ proximal stomach، بينزف ويقف ويرجع. Aortoenteric fistula في 2% من الـ grafts."
      - "Table 1: ulcer/inflammation، vascular، congestive، malignant، post procedural، و Mallory-Weiss و Cameron."
    practice: [git.L11.012, git.L11.013, git.L11.014, git.L11.015, git.L11.016, git.L11.017, git.L11.018, git.L11.019, git.L11.020, git.L11.021, git.L11.022, git.L11.023, git.L11.024, git.L11.025, git.L11.026, git.L11.027, git.L11.028]
