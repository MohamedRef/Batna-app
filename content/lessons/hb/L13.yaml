        quote: "Table 7: Primary versus secondary sclerosing cholangitis\n| | Primary | Secondary |\n|---|---|---|\n| Clinical setting | With or without inflammatory bowel disease; Chronic cholestatis; Presence of anti-neutrophil cytoplasmic antibodies (ANCA) | Biliary surgery; Choledocholithiasis; Trauma; Ischemia; Chemical injury of the bile ducts (e.g., chemotherapy); Infectious agents; Congenital anomalies of the bile ducts; Human immunodeficiency virus (HIV) infection; Malignancy; Idiopathic adulthood ductopenia; Amyloidosis; Hodgkin's disease |\n| Ducts involved | Intrahepatic and extrahepatic (classic or global) | Perihilar and extrahepatic |"
