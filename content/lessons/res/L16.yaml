- id: res.L16.lesson3
  title: 'الـ Z-score: بعيد عن المتوسط بكام SD؟'
  hook: سارة جابت 99 وفارس جاب 39. مين فيهم «غريب»؟ ومين لازم نراجع درجته؟
  minutes: 10
  pages: [17, 23]
  topics: [zscore]
  goals:
  - تحسب الـ Z-score وتقرا إشارته
  - 'تصنّف القيمة: ordinary، unusual، extreme'
  - تقارن درجات من امتحانات مختلفة
  status: unverified
  steps:
  - kind: explain
    page: 22
    quote: |-
      The Z - Score
      The standard score, or Z-score, represents the number of standard deviations a random variable X falls away from the mean.
      i.e. How many standard deviations a particular data point is above or below the mean?
      Formula for Z-score: Z = (Xi - X̄) / s
    title: التعريف
    text: |-
      الـ ==standard score== أو ==Z-score== = **عدد الـ standard deviations** اللي القيمة بعيدة بيها عن الـ mean.

      يعني بيجاوب على سؤال واحد: «القيمة دي **فوق** أو **تحت** المتوسط بكام SD؟»
  - kind: explain
    page: 17
    quote: 'Formula for Z-score: Z = (Xi - X̄) / s'
    title: المعادلة
    text: |-
      **Z = (Xi − X̄) ÷ s**

      - اطرح الـ **mean** من القيمة.
      - اقسم على الـ **SD**.

      والإشارة: ==موجب== = فوق المتوسط، ==سالب== = تحت المتوسط، و**صفر** = هو المتوسط نفسه.

      مثال محمد: (87 − 75) ÷ 10 = **+1.2**. حاسبة «Z-score» في Batna بتعملها.
  - kind: check
    page: 17
    quote: Z = (87-75)/10 = 1.2
    question: 'Ahmed scored 71 (mean 75, SD 10). His Z-score is:'
    options:
    - −0.4
    - '+0.4'
    - −4
    - −7.1
    answer: 0
    why:
    - 'صح: (71 − 75) ÷ 10 = −0.4، تحت المتوسط بشوية.'
    - 'الإشارة غلط: 71 أقل من 75.'
    - نسيت تقسم على 10.
    - قسمت 71 على 10 من غير ما تطرح المتوسط.
  - kind: figure
    page: 19
    title: "شريحة 19: محورين تحت نفس الجرس، الدرجة والـ Z"
    image: { file: res/L16-s19-z-histogram.webp, book: true }
    alt: "Histogram of scores in red bars with a blue normal curve over it. Brackets above mark 68% between mean minus s and mean plus s, 95% between mean minus 2s and plus 2s, and 99.7% between mean minus 3s and plus 3s. Under the X axis the mean is labelled 75 in a yellow box; a second axis below it reads Z from -3 to 3. A black arrow labelled Mohamed rises from just past Z = 1, beyond mean plus s."
    caption: |
      - **العمدان الحمرا**: histogram لدرجات حقيقية، و**الخط الأزرق** فوقها هو الـ normal curve، شكل الجرس.
      - **الأقواس فوق**: **68%** بين X̄ − s و X̄ + s، و**95%** بين ±2s، و**99.7%** بين ±3s.
      - **المحور الأول تحت (X)**: X̄ − 3s لحد X̄ + 3s، والـ mean في النص في المربع الأصفر = **75**.
      - **المحور التاني (Z)**: من **−3** لـ **+3**، كل رقم قصاد نفس النقطة اللي فوقه: X̄ + s يعني Z = 1، و X̄ − 2s يعني Z = −2.
      - **السهم الأسود Mohamed**: طالع من بعد Z = 1 بشوية، يعني درجته **87** = Z **1.2**.

      يعني الـ Z مجرد ==نفس المحور بوحدة الـ SD==: الـ mean بقى صفر، وكل SD بقى 1، فتعرف مكان أي درجة على الجرس من غير ما ترسم الدرجات نفسها.
  - kind: explain
    page: 18
    quote: |-
      Unusual observations would have a Z-score over 2 or under -2.
      Extreme observations would have Z-scores over 3 or under -3 and should be investigated as potential outliers.
    title: ordinary ولا unusual ولا extreme؟
    text: |-
      - ==Ordinary==: Z بين **−2 و+2** (حوالي 95% من القيم).
      - ==Unusual==: Z **فوق 2 أو تحت −2**.
      - ==Extreme==: Z **فوق 3 أو تحت −3**، ودي لازم **investigate as potential outliers**: ممكن تكون قيمة حقيقية، وممكن غلطة في القياس أو الإدخال.
  - kind: figure
