    kind: table
    topic: screening
    title: "GFR categories (KDIGO grid, p144), ml/min/1.73 m²"
    columns: [Category, Description, GFR]
    rows:
      - [G1, Normal or high, "≥90"]
      - [G2, Mildly decreased, "60–89"]
      - [G3a, Mildly to moderately decreased, "45–59"]
