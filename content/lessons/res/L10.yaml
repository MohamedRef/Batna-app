      - kind: explain
        page: 126
        quote: "It can be difficult to locate the fugitive literature.\n  Experts on the topic of interest are probably the best source of information — you can write or e-mail key informants asking them to provide information on relevant published literature that would not be identified through database searching."
        title: "تلاقي الـ fugitive literature إزاي؟"
        text: |
          الـ fugitive literature ==صعب تلاقيها==.

          أحسن مصدر غالبًا: ==الخبراء في الموضوع==. ابعت لـ ==key informants== إيميل أو جواب واطلب منهم المنشورات اللي الـ database search مش هيوصلها.

          ليه الخبراء؟ هما اللي بيحضروا المؤتمرات وبيكتبوا التقارير، فعارفين الحاجات اللي مش متفهرسة. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 128
        quote: "A program may evolve over time and what is in the published literature may differ from what is currently being done.\n  In addition, many good program and policy evaluations go unpublished.\n  In these cases, key informant interviews may be useful."
        title: "ليه key informant interviews؟"
        text: |
          - البرنامج ممكن ==يتطور مع الوقت==، فاللي في الـ published literature يختلف عن ==اللي بيتعمل دلوقتي==.
          - و==تقييمات كتير كويسة== للبرامج والسياسات ماتنشرتش.

          في الحالتين دول الـ key informant interviews مفيدة.

          ليه؟ اللي شغال في البرنامج النهارده يعرف الحاجات اللي الورق القديم مايعرفهاش. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 129
        quote: "Key informants are experts on a certain topic and may include a university researcher who has years of experience in a particular intervention area or a local program manager who has the field experience to know what works when it comes to designing and implementing effective interventions."
        title: "Key informant interviews"
        text: |
          ليه؟ الـ **process** (إزاي البرنامج اتعمل) صعب تفهمه من الـ methods section، والبرنامج ممكن **يكون اتغيّر** عن المنشور، وتقييمات كتير **ماتنشرتش**.

          الـ ==key informants== = خبرا: أستاذ جامعة عنده سنين في المجال، أو **local program manager** عارف من الميدان إيه اللي بيشتغل. زي مدير وحدة صحية شغّال في البرنامج من 10 سنين.
