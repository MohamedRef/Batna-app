  - id: endo.L04.lesson7
    title: "الـ HIV والخصية وأمراض متفرقة"
    hook: "مريض AIDS تعبان وضغطه بيقع لما يقف والصوديوم واطي. هل ده الـ HIV؟ ولا الـ adrenal؟ ولا الـ rifampin؟"
    minutes: 8
    pages: [65, 76]
    topics: [cfs, hiv, testicular, misc, crf-reproductive, crf-glucose]
    goals:
      - "تعرف صورة الـ CFS الهرمونية"
      - "تعرف أكتر غدة بتتأثر في الـ HIV وأكتر abnormality"
      - "تعدّ أمراض الخصية في الأمراض العامة، والـ cirrhosis بالذات"
    status: unverified
    steps:
      - kind: explain
        page: 65
        quote: "Some propose that CFS is fundamently a psychiatric disorder & that the various neuro-endocrine & immune disturbance arise secondarliy. Endorcine manifestations:\n  1- Reduced production of CRH.\n  2- Lower serum cortisol.\n  3- Increases ACTH.\n  4- Mild to moderate depression in 1/2 to 2/3 of pts."
        title: "الـ chronic fatigue syndrome"
        text: |
          فيه رأي إن الـ chronic fatigue syndrome (CFS) أصلًا ==psychiatric== والتغيرات الهرمونية ثانوية. الكتاب بيقول:
          - **↓ corticotropin-releasing hormone (CRH)**، **↓ cortisol**، و **↑ adrenocorticotropic hormone (ACTH)**.
          - Depression خفيف لمتوسط في **1/2 لـ 2/3**.
      - kind: aside
        tone: trap
        page: 65
        quote: "Some propose that CFS is fundamently a psychiatric disorder & that the various neuro-endocrine & immune disturbance arise secondarliy. Endorcine manifestations:\n  1- Reduced production of CRH.\n  2- Lower serum cortisol.\n  3- Increases ACTH.\n  4- Mild to moderate depression in 1/2 to 2/3 of pts."
        text: "فسيولوجيًا، الـ CRH الواطي المفروض يقلل الـ ACTH، فالمجموعة دي غريبة. بس دي إجابة الكتاب، احفظها زي ما هي."
      - kind: explain
        page: 66
        quote: "Fatigue, anorexia, nausea, vomiting, orthostatic hypotension, and hyponatremia are symptoms frequently noted in many HIV-infected patients Basal 8 A.M. plasma cortisol levels are usually higher in patients with advanced HIV disease than in asymptomatic patients and uninfected healthy controls. However, other ACTH-dependent steroids, such as desoxycorticosterone (DOC), compound B, and 18- hydroxy-DOC, are not elevated and show a blunted response to corticotropin (ACTH) stimulation, implying subnormal adrenal reserves."
        title: "الـ HIV والـ adrenal"
        text: |
          الكتاب بيقول إن أعراض زي fatigue، anorexia، nausea، vomiting، orthostatic hypotension، و **hyponatraemia** بتتشاف كتير في مرضى الـ human immunodeficiency virus (HIV). (إنها شبه الـ adrenal insufficiency دي ملاحظة مننا، مش كلام الكتاب.)

          الـ basal cortisol الصبح ==أعلى== من الطبيعي، بس الـ deoxycorticosterone (DOC) و compound B و 18-OH-DOC **مش عاليين** وردّهم على الـ ACTH ضعيف. يعني الـ **adrenal reserve قليل**.
      - kind: figure
        page: 73
        quote: "The adrenal gland is the endocrine gland most commonly affected in AIDS adrenal insufficiency is observed in <8% of AIDS patients."
        title: "الـ adrenal في الـ AIDS"
        alt: "The adrenal is the gland most often affected in AIDS, though adrenal insufficiency is under 8 percent. Three causes: infection, with CMV in up to 50 percent of adrenal pathology and MAC, Kaposi, Cryptococcus or Histoplasma in 5 to 12 percent; drugs, with ketoconazole blocking synthesis and rifampin increasing cortisol clearance; and central, with normal or low ACTH. Test: cortisol under 20 micrograms per decilitre 60 minutes after ACTH."
        caption: "أكتر غدة بتتأثر، بس الـ insufficiency أقل من 8%. والاختبار: cortisol أقل من 20 بعد ساعة من الـ ACTH."
