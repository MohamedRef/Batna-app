  - id: rheum.L02.lesson7
    title: "الـ pseudogout: النقرس بتاع الركبة الكبيرة"
    hook: "ست عندها 70 سنة، ركبتها ورمت بعد عملية. مش gout: دي البلورة التانية."
    minutes: 10
    pages: [48, 50]
    topics: [pseudogout]
    goals:
      - "تعرف مين بيجيله الـ pseudogout وفين، وليه"
      - "تفرّق بلورة CPPD عن MSU"
      - "تعرف الأسباب الـ metabolic والعلاج"
    status: unverified
    steps:
      - kind: explain
        page: 48
        quote: "Mono- or oligoarticular (the knee is most commonly affected followed by wrist, shoulder and ankle) disease resembling gout, RA, ankylosing spondylitis, haemarthrosis & neuropathic arthropathy."
        title: "يعني إيه pseudogout؟"
        text: |
          ==Calcium pyrophosphate deposition (CPPD)== deposition disease. Mono أو oligoarticular: **الركبة أولًا**، بعدها wrist و shoulder و ankle.

          بيقلّد gout و rheumatoid arthritis (RA) و ankylosing spondylitis (AS) و haemarthrosis و neuropathic joint. وفكّر فيه في أي **degenerative arthritis توزيعها غريب**.

          البلورات بتتكون من **calcium + pyrophosphate** زيادة محليًا (الـ pyrophosphate ناتج طبيعي من adenosine triphosphate (ATP) ← adenosine monophosphate (AMP)).

          التفسير المقبول (مش في الكتاب): ليه بيقلّد أمراض كتير؟ عشان البلورة بتعمل التهاب حاد زي الـ gout، والترسيب المزمن في الغضروف بيعمل تآكل زي الـ OA، والـ inflammation المزمن في أكتر من مفصل ممكن يبان زي الـ RA. يعني لو شفت degenerative arthritis في wrist أو كتف (أماكن مش بتاعة الـ OA العادي)، فكّر في الـ CPPD.
      - kind: explain
        page: 48
        quote: "CPP crystals form due to elevated local levels of calcium and pyrophosphate which is a normal metabolite from the conversion of ATP to AMP."
        title: "ليه البلورة دي بتتكون؟"
        text: |
          الكتاب بيقول السبب في سطر: **calcium و pyrophosphate عاليين محليًا** في المفصل، والـ pyrophosphate ناتج طبيعي من تحويل ATP لـ AMP.

          يعني المعادلة: ==calcium × pyrophosphate== لو زاد عن حد معين ← بلورة. ومن هنا تفهم الأسباب الثانوية في الكتاب، والتفسير المقبول (مش في الكتاب):
          - **Hyperparathyroidism**: calcium عالي.
          - **Hypomagnesaemia**: الـ magnesium بيساعد الإنزيم اللي بيكسّر الـ pyrophosphate، فلو قل الـ pyrophosphate بيتراكم.
          - **Haemochromatosis**: الحديد بيترسب في الغضروف ويسهّل تكوين البلورة.
          - **السن (sporadic، فوق 55)**: الغضروف القديم بيتغير ويبقى أرض أسهل للترسيب.
      - kind: table
        page: 48
        quote: "Pseudogout may be acute or chronic and is primary (esp. in elderly), familial or secondary (hypothyroidism, hyperparathyroidism, hypomagnesemia)."
        title: "الأنواع والأسباب"
        columns: ["Type", "Details"]
        rows:
          - ["Primary / sporadic", "Elderly, ageing, over 55; common"]
          - ["Familial", "Rare"]
          - ["Secondary", "Hypothyroidism, hyperparathyroidism, hypomagnesaemia"]
          - ["Metabolic", "Haemochromatosis, hyperparathyroidism, Wilson's"]
        hide: [[2, 1], [3, 1]]
      - kind: mnemonic
        page: 48
        quote: "Metabolic disease associated form rare {haemochromatosis, hyperparathyroidism, Wilson's disease}."
        word: "HHHW"
        hook: "«Three H and a W»: الأسباب الـ metabolic والثانوية في الكتاب."
        parts:
          - { key: "H", text: "Haemochromatosis" }
          - { key: "H", text: "Hyperparathyroidism" }
          - { key: "H", text: "Hypothyroidism و hypomagnesaemia" }
          - { key: "W", text: "Wilson's disease" }
      - kind: explain
        page: 48
        quote: "Sites of predilection are hyaline and fibrocartilage of knee, triangular ligament of wrist, symphysis pubis and hyaline cartilage of hips and shoulders."
        title: "التشخيص والـ chondrocalcinosis"
        text: |
          التشخيص بيعتمد على تلات حاجات: **CP** (البلورة)، **نمط المفاصل** (wrist و knee و shoulder)، و **calcification جوه المفصل على الأشعة** = ==chondrocalcinosis==.

          أماكنها المفضلة: hyaline و fibrocartilage الركبة (الـ menisci)، الـ **triangular ligament of wrist**، الـ **symphysis pubis**، وغضروف الـ hip والـ shoulder.

          بس خلي بالك من حاجتين في الكتاب:
          - الـ chondrocalcinosis ممكن تبقى **asymptomatic**. يعني صورة فيها calcium مش معناها إن ده سبب الوجع.
          - ==Definitive diagnosis== بالبلورات في الـ joint fluid، زي الـ gout بالظبط.
      - kind: explain
        page: 49
        quote: "Commonest cause of acute monoarthritis of the elderly.\n  Triggering factors trauma or illness.\n  Typical attack resembles acute gout = pain+ swelling.\n  Physical exam. Reveals warmth, swelling with effusion tenderness and limitation of motion and overlying erythema.\n  Fever\n  Attack is self-limiting but takes 1-3 weeks to resolve.\n  DD: sepsis and gout.\n  Chronic pyrophosphate arthritis: in elderly women with chronic pain + early morning and inactivity stiffness.\n  Affected joints show features of OA(bony swelling, crepitus and effusion)."
        title: "الصورة الإكلينيكية"
        text: |
          - ستات **65-75** أكتر؛ الركبة ثم الـ wrist والـ pelvis.
          - ==أشهر سبب acute monoarthritis في كبار السن==.
          - Trigger: **trauma أو illness** (عملية مثلًا).
          - شبه الـ gout: وجع وورم وسخونية و effusion وأحمرار و fever.
          - Self-limiting بس بياخد **1-3 أسابيع** (أطول من الـ gout).
          - **Chronic** في ستات كبار: وجع مزمن و morning/inactivity stiffness وشكل Osteoarthritis (OA).

          التفسير المقبول (مش في الكتاب): ليه كبار السن؟ عشان الغضروف مع السن بيطلّع pyrophosphate أكتر ويتغيّر تركيبه، فالبلورة تتكون أسهل. والعملية أو المرض بيعمل تغيّر مفاجئ في الـ calcium وفي المفصل، فالبلورات تتقلقل وتعمل نوبة. يعني مريض كبير بعد عملية وعنده ركبة سخنة: فكّر في pseudogout، بس اسحب واستبعد الـ sepsis.
      - kind: check
        page: 49
        quote: "Commonest cause of acute monoarthritis of the elderly."
        question: "A 78-year-old woman has an acutely hot, swollen knee three days after hip surgery. Per the book, what is the commonest cause of acute monoarthritis at her age?"
        options: ["Pseudogout (CPPD)", "Gout", "Rheumatoid arthritis", "Ankylosing spondylitis"]
        answer: 0
