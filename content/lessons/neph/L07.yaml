      - kind: sort
        page: 174
        quote: "BOX 45.1 Clinical Diagnostic Criteria for Tuberous Sclerosis Complex*\nMajor\n  Facial angiofibromas or forehead plaque\n  Nontraumatic ungual or periungual fibroma\n  Hypomelanotic macules (>3)\n  Shagreen patch (connective tissue nevus)\n  Multiple retinal nodular hamartomas\n  Cortical tuber(s)\n  Subependymal nodule\n  Subependymal giant cell astrocytoma\n  Cardiac rhabdomyoma(s) (≥1)\n  Lymphangioleiomyomatosis\n  Renal angiomyolipoma\nMinor\n  Multiple, random dental pits\n  Hamartomatous gastrointestinal or rectal polyps\n  Bone cysts\n  White matter radial migration lines\n  Gingival fibromas\n  Nonrenal hamartoma\n  Retinal achromic patch\n  \"Confetti\" skin lesions\n  Multiple renal cysts\n*Two major features or one major feature with two minor features indicate definite TSC, one major feature and one minor feature indicate probable TSC, and one major feature or two minor features indicates possible TSC."
        prompt: "Major ولا minor في Box 45.1؟"
        bins: ["Major", "Minor"]
        cards:
