  # ---------- p221-223: bone density ----------
  - id: dm.L17.061
    kind: card
    topic: bmd
    front: What do bone density measurements do in prophylaxis?
    back: They predict fracture risk and help decide the need for preventive therapy.
    src: { page: 221, quote: "Bone density measurements predict fracture risk and help determine the need for preventive therapy." }
    status: unverified
  - id: dm.L17.062
    kind: cloze
    topic: bmd
    text: "The lecture's treatment cut-off: bone density {{c1::1 SD}} below the mean for age (Z score {{c2::-1}}), which it equates with a T score of {{c3::-2.5}}."
    src: { page: 221, quote: "a bone density measurement of 1 SD below the mean for age [Z score=-1, which equals T score=-2.5" }
    status: unverified
    tags: [numbers, high-yield]
    update:
      text: "The densitometric definition compares with young adults (T-score): T ≤ -2.5 is osteoporosis and T between -1 and -2.5 is osteopenia (low bone mass). A Z-score (age-matched) of -1 is not the same as a T-score of -2.5."
      ref: "WHO criteria 1994; BHOF Clinician's Guide 2022"
  - id: dm.L17.063
    kind: card
    topic: bmd
    front: What does the T-score compare a patient with?
    back: The mean of young adults of the same sex (the Z-score compares with the mean for age).
    src: { page: 221, quote: "T score=-2.5 below the mean of young adults with the same sex" }
    status: unverified
  - id: dm.L17.064
    kind: card
    topic: bmd
    front: Does the lecture recommend widespread osteoporosis screening of asymptomatic women?
    back: No; cost-effective screening guidelines for asymptomatic perimenopausal women have not been established.
    src: { page: 222, quote: "Therefore, widespread screening for osteoporosis in asymptomatic women cannot be recommended." }
    status: unverified
    update:
      text: "USPSTF recommends BMD screening for all women aged 65 and over, and for younger postmenopausal women at increased risk (for example by FRAX)."
      ref: "USPSTF osteoporosis screening 2018"
  - id: dm.L17.065
    kind: cloze
    topic: bmd
    text: "Women with bone density between the mean and {{c1::1 SD}} below it should get a second measurement in {{c2::2 to 5}} years."
    src: { page: 222, quote: "women with a bone density between the mean and 1 SD below the mean should obtain a second measurement in 2 to 5 yr." }
    status: unverified
    tags: [numbers]
  - id: dm.L17.066
    kind: card
    topic: bmd
    front: Are serial bone density measurements to follow bone loss or therapy routinely recommended (p222)?
    back: No; they are controversial and cannot be routinely recommended.
    src: { page: 222, quote: "Serial bone density measurements to assess the rate of bone loss or the therapeutic response are controversial and cannot be routinely recommended." }
    status: unverified
  - id: dm.L17.067
    kind: enumerate
    topic: bmd
    prompt: Name the four methods of measuring bone density.
    points:
      - Single-photon absorptiometry (SPA)
      - Dual-photon absorptiometry (DPA)
      - Quantitative CT
      - Dual-energy X-ray absorptiometry (DEXA)
    pass: 4
    src: { page: 222, quote: "four methods of measuring bone density are available: single- photon absorptiometry, dual-photon absorptiometry, quantitative computed tomography, and dual-energy x-ray absorptiometry." }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.068
    kind: table
    topic: bmd
    title: Bone density methods compared
    columns: [Method, Strength, Weakness]
    rows:
      - ["SPA (radius, ulna, heel)", "Cheap, little radiation, widely available, reasonably accurate", Does not measure vertebrae or femur directly]
      - [DPA, Measures vertebrae and femur directly; best in young and middle-aged, "Costly, less available, long scan; falsely high with DJD, compression fractures, calcified vessels"]
      - [Quantitative CT, Mainly lumbar spine, "Very high radiation (not in childbearing age or serially), poor reproducibility, costly"]
      - [DEXA, "Precise, little radiation, short scan, low cost; best for serial scans", Fracture prediction less studied (assumed equal to DPA)]
    blanks: [[0, 2], [1, 2], [2, 2], [3, 1]]
    src: { page: 223, quote: "Together with its low cost, these characteristics make DEXA the method of choice." }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.069
    kind: card
    topic: bmd
    front: Main drawback of single-photon absorptiometry?
    back: It does not directly measure density in the vertebrae or femur, the commonest and most disabling fracture sites.
    src: { page: 222, quote: "However, it does not directly measure bone density in vertebrae or femurs, the most common and disabling sites of osteoporotic fractures." }
    status: unverified
  - id: dm.L17.070
    kind: enumerate
    topic: bmd
    prompt: What can falsely elevate dual-photon absorptiometry values?
    points:
      - Degenerative joint disease
      - Compression fractures
      - Closely situated calcified vessels
    pass: 3
    src: { page: 222, quote: "Falsely elevated values may occur with degenerative joint disease, compression fractures, or closely situated calcified vessels." }
    status: unverified
  - id: dm.L17.071
    kind: card
    topic: bmd
    front: Why should quantitative CT not be used in women of childbearing age or for serial scans?
    back: Its radiation exposure is extremely high (and reproducibility for serial measurements is poor).
    src: { page: 223, quote: "Because of the extremely high radiation exposure with quantitative CT, it should not be used in women of childbearing age or for serial measurements." }
    status: unverified
  - id: dm.L17.072
    kind: card
    topic: bmd
    front: Why is DEXA the method of choice for bone density?
    back: Precise, little radiation, short scan time and low cost; it measures radius, ulna, spine, femur and total body, and suits serial measurements.
    src: { page: 223, quote: "Together with its low cost, these characteristics make DEXA the method of choice." }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.073
    kind: mcq
    topic: bmd
    stem: A 30-year-old woman on long-term steroids needs a baseline bone density scan and a repeat in 2 years. Which method is best?
    options:
      - DEXA
      - Quantitative CT
      - Single-photon absorptiometry of the heel
      - Dual-photon absorptiometry
      - Plain X-ray of the spine
    answer: 0
    why:
      - "Correct: DEXA is precise, low radiation and best suited to serial measurements (p223)."
      - Extremely high radiation; not for childbearing age or serial scans (p223).
      - Does not measure spine or femur, the main fracture sites.
      - More expensive, less available and slower than DEXA.
      - Radiolucency needs about 30% bone loss before it shows.
    src: { page: 223, quote: "Because it is more precise than other methods, DEXA is better suited to serial measurements." }
    status: unverified
