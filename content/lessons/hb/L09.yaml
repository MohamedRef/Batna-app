        title: "الـ prognosis: الجرس بيرن"
        text: |
          أول ما الـ ascites تظهر في chronic liver disease، الـ prognosis بيسوء. دي علامة إن الكبد دخل مرحلة الـ decompensation.

          الأرقام بعد أول episode:
          - الـ mortality 50% خلال سنتين.
          - و 80% خلال 5 سنين.

          مين أخطر؟ الكتاب بيحدد 4 علامات:
          - **Persistent ascites**: المية مش بتمشي.
          - ==Low serum Na== (<130 mmol/L): الـ ADH شغال على الآخر، يعني الـ underfilling شديد.
          - **SBP**.
          - ==Renal impairment==.

          لاحظ الرابط: التلاتة الأخيرين هما نفس الـ complications اللي بتعرّف الـ complicated ascites.
