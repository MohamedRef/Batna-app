  - id: neph.L14.lesson6
    title: "HUS: الإسهال ولا الـ complement؟"
    hook: "الطفل اللي جاله إسهال بدم وبعدها بطل يعمل بول: ده STEC-HUS، ومتديلوش antibiotic."
    minutes: 7
    pages: [471, 477]
    topics: [hus]
    goals:
      - "تفرّق typical عن atypical HUS بالأرقام"
      - "تعرف ليه الـ antibiotics ممنوعة في STEC-HUS ومسموحة في الـ pneumococcal"
      - "تعالج aHUS بالـ eculizumab وتعرف آثاره"
    status: unverified
    steps:
      - kind: explain
        page: 471
        title: "الـ HUS: يعني إيه وأنواعه"
        quote: "Hemolytic uremic syndrome (HUS) is a thrombotic microangiopathy (TMA) characterized by thrombocytopenia, microangiopathic hemolytic anemia, and AKI.\nHUS is most commonly caused by Shiga toxin (typical HUS) or, less commonly, infections or genetic abnormalities activating the alternative complement pathway (atypical HUS).\nAdditional causes can be secondary to malignancy, autoimmune disorders, genetic mutations, and medication use.\nTypical HUS\nShiga toxin-producing Escherichia coli (STEC), called typical HUS, is the most common cause of HUS.\nTypical HUS comprises 90% to 95% of HUS cases and commonly arises from consuming contaminated food or drink and through person-to-person contact."
        text: |
          - الـ ==hemolytic uremic syndrome (HUS)== نوع من الـ thrombotic microangiopathy (TMA): **thrombocytopenia** + **microangiopathic hemolytic anemia** + **acute kidney injury (AKI)**.
          - **Typical HUS** سببه الـ Shiga toxin-producing Escherichia coli (STEC)، وهو الأشهر: ==90-95%== من الحالات، من أكل أو شرب ملوّث أو من شخص لشخص.
          - **Atypical HUS (aHUS)** أقل، من infections أو genetic abnormalities بتشغّل الـ alternative complement pathway.
      - kind: table
        page: 472
        quote: "Atypical HUS (aHUS) constitutes 5% to 10% of HUS cases and is linked to genetic mutations affecting the alternative complement pathway.\nUnder physiological conditions, the alternative complement system is continuously active at low levels. However, inflammatory conditions such as infections can induce endothelial damage, triggering the activation of the coagulation cascade and causing a TMA presentation.\nThe initial clinical manifestation of aHUS typically involves nonspecific symptoms like fatigue, pallor, or somnolence. These symptoms can progress to signs of AKI, including oliguria, uremia, and fluid overload. The risk of progression to stage 3 or 4 CKD and ESRD in aHUS is high.\nIn contrast to typical HUS, patients with aHUS often fail to regain kidney function without treatment. Untreated, approximately 50% of aHUS cases progress to dialysis dependency, with a mortality rate of 25%.\nSimilar to typical HUS, aHUS may exhibit extrarenal manifestations, notably cardiac and neurological, including HF, pulmonary HTN, seizures, coma, and blindness. These manifestations significantly contribute to the morbidity and mortality associated with aHUS. In contrast to typical HUS, patients with aHUS commonly relapse; patients must be monitored closely for relapse after treatment is discontinued."
        title: "Typical vs atypical HUS"
        columns: [Feature, Typical (STEC), Atypical]
        rows:
          - [Share, "Most cases (the rest)", "5-10%"]
          - [Cause, "Shiga toxin E. coli", "Complement mutations"]
          - [Untreated outcome, "Usually recovers", "~50% dialysis, 25% death"]
          - [Relapse, Uncommon, Common]
        hide: [[0, 2], [1, 2], [2, 2]]
      - kind: explain
        page: 472
        title: "STEC-HUS بالأرقام"
        quote: "The incidence of HUS among individuals infected with STEC ranges from 5% to 15%, predominantly affecting children younger than 5."
        text: |
          - **5-15%** من عدوى الـ Shiga toxin-producing Escherichia coli (STEC) بيعملوا hemolytic uremic syndrome (HUS)، أغلبهم **أطفال تحت 5**.
          - **Bloody diarrhea** يوم **2-3** بعد التعرض، والـ HUS بعدها بـ **3-10 أيام**.
          - Vomiting **67%**، fever **37%**، abdominal pain **29%**.
      - kind: order
        page: 473
        quote: "HUS is typically associated with bacterial infection resulting from the consumption of undercooked beef, unpasteurized milk.\nOnce ingested, STEC penetrates the mucous layer of the intestine and secretes Shiga toxin, which binds to the receptor Gb3."
        prompt: "رتّب طريق الـ Shiga toxin:"
        steps:
          - "STEC is eaten"
          - "Shiga toxin secreted in the gut"
          - "Toxin binds Gb3"
          - "Protein synthesis blocked, apoptosis"
          - "Glomerular endothelial damage, TMA"
        why: "العدوى بتيجي من **undercooked beef** أو **unpasteurized milk**. الـ Gb3 أكتر حاجة في الـ glomerular microvasculature، عشان كده الكلية أول ضحية. والتوكسين كمان بيثبّط factor H فيشغّل الـ complement."
      - kind: aside
        tone: trap
        text: "الـ **S. pneumoniae** هو السبب الوحيد لـ **Coombs-positive** HUS (الـ neuraminidase بيكشف antigens)، وهنا الـ **antibiotics بدري** مطلوبة. أما STEC-HUS: **ممنوع** antibiotics و antimotility."
      - kind: check
        page: 476
        quote: "Antimotility agents and antibiotics are avoided in typical HUS caused by STEC, as they correlate with poorer outcomes, likely due to heightened Shiga toxin exposure. On the other hand, if S dysenteriae or S pneumonia is present, early antibiotics are associated with improved outcomes."
        question: "In STEC-HUS, why are antibiotics avoided?"
        options:
          - "They correlate with worse outcomes, likely from more Shiga toxin exposure"
          - "They cause Coombs-positive hemolysis"
          - "They block eculizumab"
          - "They are nephrotoxic in all children"
        answer: 0
        why:
          - "صح: الـ antibiotic ممكن يزوّد خروج التوكسين."
          - "الـ Coombs-positive خاص بالـ pneumococcus."
          - "الـ eculizumab مش علاج الـ STEC-HUS أصلاً."
          - "مش السبب المذكور."
      - kind: explain
        page: 476
        title: "علاج aHUS"
        quote: "The cornerstones of treatment for aHUS are first-line treatment with eculizumab and second-line with plasma exchange."
        text: |
          - ==Eculizumab== (anti-**C5**) **first-line**، و **plasma exchange** second-line.
          - كل ما بدري كل ما أحسن.
          - "قلّل الـ end-stage renal disease (ESRD) أو الوفاة: أطفال من **30-50%** لـ **9%**، كبار من **60%** لـ **6-15%**."
          - "**Ravulizumab**: C5 inhibitor بنفس الفعالية و half-life **4 أضعاف**."
      - kind: table
        page: 475
        quote: "Table 2: Genetic Abnormalities and Clinical Outcome in Patients with Atypical Hemolytic-Uremic Syndrome.\n| Gene | Protein Affected | Main Effect | Frequency (%) | Response to Short-Term Plasma Therapy† | Long-Term Outcome‡ | Outcome of Kidney Transplantation |\n| CFH | Factor H | No binding to endothelium | 20–30 | Rate of remission: 60% (dose and timing dependent) | Rate of death or ESRD: 70–80% | Rate of recurrence: 80–90%§ |\n| CFHR1/3 | Factor HR1, R3 | Anti–factor H antibodies | 6 | Rate of remission: 70–80% (plasma exchange combined with immunosuppression) | Rate of ESRD: 30–40% | Rate of recurrence: 20%¶ |\n| MCP | Membrane cofactor protein | No surface expression | 10–15 | No definitive indication for therapy | Rate of death or ESRD: <20% | Rate of recurrence: 15–20%¶ |\n| CFI | Factor I | Low level or low cofactor activity | 4–10 | Rate of remission: 30–40% | Rate of death or ESRD: 60–70% | Rate of recurrence: 70–80%§ |\n| CFB | Factor B | C3 convertase stabilization | 1–2 | Rate of remission: 30% | Rate of death or ESRD: 70% | Recurrence in one case |\n| C3 | Complement C3 | Resistance to C3b inactivation | 5–10 | Rate of remission: 40–50% | Rate of death or ESRD: 60% | Rate of recurrence: 40–50% |\n| THBD | Thrombomodulin | Reduced C3b inactivation | 5 | Rate of remission: 60% | Rate of death or ESRD: 60% | Recurrence in one case |\nESRD denotes end-stage renal disease.\n† Remission was defined as either complete remission or partial remission (i.e., hematologic remission with renal sequelae).\n‡ The long-term outcome was defined as the outcome 5 to 10 years after onset.\n§ Patients in this category were eligible for combined liver and kidney transplantation.\n¶ Patients in this category were eligible for single kidney transplantation."
