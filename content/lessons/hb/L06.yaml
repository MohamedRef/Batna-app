        title: "DPP-4 و SGLT2: الدليل مختلف"
        text: |
          هنا الامتحان بيسأل عن **مستوى الدليل**، مش بس النتيجة:

          - **Linagliptin (DPP-4 inhibitor)**: عنده high exposure in hepatic tissue، وعمل anti-inflammatory و anti-steatotic activity. بس ده كان في ==mouse model== of non-alcoholic steatohepatitis (NASH) (Klein, 2013). يعني لسه ماتجربش على بني آدمين في الكتاب.
          - **Empagliflozin (sodium–glucose cotransporter 2 (SGLT2) inhibitor)**: ==RCT== (double-blind، placebo-controlled) في non-alcoholic fatty liver disease (NAFLD) without type 2 diabetes mellitus (T2DM) (Taheri, 2020). حسّن الـ steatosis، والأهم الـ fibrosis، بالـ transient elastography والـ controlled attenuation parameter (CAP).

