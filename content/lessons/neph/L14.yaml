schema: batna.lesson/v1
lecture: neph.L14
lessons:
  # ------------------------------------------------------------------
  - id: neph.L14.lesson1
    title: "الـ Lupus والكلية: تعرف إمتى تشك وإمتى تعمل biopsy"
    hook: "الـ lupus nephritis ممكن تفضل ساكتة شهور، فلازم تدوّر عليها قبل ما هي تبان."
    minutes: 10
    pages: [447, 451]
    topics: [ln-overview, ln-general]
    goals:
      - "تعرف الست أمراض اللي في المحاضرة وليه اتجمعوا مع بعض"
      - "تحفظ أرقام الـ LN ومين أكتر ناس في خطر، وتفهم ليه المتابعة لازم تكون دورية"
      - "تعرف الـ renal domain في معايير الـ EULAR/ACR وليه الـ biopsy لوحدها بتكسب 10 points"
      - "ترتّب الـ general measures حسب الخطر اللي كل واحد بيمنعه"
      - "تعرف امتى الـ biopsy وإيه اللي لازم يتكتب في التقرير وليه"
    status: unverified
    steps:
      - kind: explain
        page: 447
        title: "ست أمراض، كلية واحدة"
        quote: "Lupus Nephritis. TMA. Viral related GN. Hepatorenal syndrome. Dysproteinemia. Sarcoidosis."
        text: |
          المحاضرة دي مش عن مرض واحد. هي عن **الكلية لما مرض في الجسم كله يوصلها**: lupus nephritis، thrombotic microangiopathy (TMA)، الـ GN اللي جاي من الفيروسات، hepatorenal syndrome، الـ dysproteinemia، والـ sarcoidosis.

          التفسير المقبول (مش في الكتاب): الكلية بتاخد حوالي **ربع** الـ cardiac output، والـ glomerulus فلتر رفيع جدًا. فأي حاجة ماشية في الدم (immune complexes، جلطات صغيرة، بروتين غريب، أو مشكلة في الدورة الدموية زي الكبد) بتعدّي عليه وتسيب أثرها.

          فخلّي في دماغك سؤال واحد وانت بتذاكر كل جزء: **الضرر جاي من فين؟** immune، ولا vascular، ولا hemodynamic، ولا deposition. ده اللي هيفسّر العلاج.
      - kind: explain
        remind: [neph.L14.006]
        page: 448
        title: "قد إيه شائعة؟"
        quote: "Among patients with systemic lupus erythematosus (SLE), the reported lifetime incidence of lupus nephritis (LN) is 20%–60%."
        text: |
          - من **20%** لـ **60%** من مرضى الـ ==systemic lupus erythematosus (SLE)== بيعملوا lupus nephritis في حياتهم.
          - الـ kidney involvement بيعلّي الـ **mortality**، خصوصاً لو وصل لـ kidney failure.
          - شُك أكتر في **Asian** و **African/Caribbean** و **Hispanic**.
          - "الـ **childhood-onset SLE**: نسبة lupus nephritis (LN) أعلى ومرض أشد."

          الهدف من العلاج: تحافظ على الكلية وتقلل الـ chronic kidney disease (CKD)، **وفي نفس الوقت** تقلل سُمّية الأدوية.

          ليه الأعراق دي؟ التفسير المقبول (مش في الكتاب): الـ lupus عندهم بييجي أشد ومع genes بتزوّد أذى الكلية (زي الـ APOL1 اللي هتشوفه في درس الـ refractory). وليه الهدف فيه «سُمّية الأدوية»؟ لأن العلاج نفسه (steroid و cyclophosphamide) ممكن يأذي أكتر من المرض لو مااتظبطش.
      - kind: reveal
        page: 448
        quote: "Childhood-onset SLE is associated with a higher incidence of LN and more severe disease than adult-onset SLE."
        prompt: "طفلة عندها SLE وأمها عندها SLE. مين فيهم الكتاب بيقولك تقلق على كليتها أكتر، وليه لازم تتابع الاتنين حتى لو مفيش أعراض؟"
        answer: |
          الطفلة. الكتاب بيقول ==childhood-onset SLE== معاه **incidence أعلى** للـ LN ومرض **أشد** من الـ adult-onset.

          وليه المتابعة للاتنين؟ عشان الكتاب بيقول الـ kidney involvement ممكن يفضل ==silent or asymptomatic== فترة طويلة. يعني مش هتستنى ورم أو بول أحمر: لازم تدوّر بنفسك.

          التفسير المقبول (مش في الكتاب): المرض اللي بيبدأ بدري بيكون غالبًا وراه عوامل وراثية أقوى، فالـ immune system أعنف من الأول.
      - kind: aside
        tone: trap
        text: "الـ LN ممكن تكون **silent** خالص. فلو مريض SLE حاسس إنه كويس، ده مش معناه إن كليته كويسة: اعمل urine و creatinine بانتظام."
      - kind: table
        page: 448
        quote: "New EULAR/ACR criteria for the classification of SLE\n| Domain | Criterion | Points |\n| Clinical: Constitutional domain | Fever | 2 |\n| Clinical: Cutaneous domain | Non-scarring alopecia | 2 |\n| | Oral ulcers | 2 |\n| | Subacute cutaneous or discoid lupus | 4 |\n| | Acute cutaneous lupus | 6 |\n| Clinical: Arthritis domain | Synovitis or tenderness in at least 2 joints | 6 |\n| Clinical: Neurologic domain | Delirium | 2 |\n| | Psychosis | 3 |\n| | Seizure | 5 |\n| Clinical: Serositis domain | Pleural or pericardial effusion | 5 |\n| | Acute pericarditis | 6 |\n| Clinical: Hematologic domain | Leukopenia | 3 |\n| | Thrombocytopenia | 4 |\n| | Autoimmune hemolysis | 4 |\n| Clinical: Renal domain | Proteinuria > 0.5 g/24 hr | 4 |\n| | Class II or V lupus nephritis | 8 |\n| | Class III or IV lupus nephritis | 10 |\n| Immunologic: Antiphospholipid antibody domain | Anticardiolipin IgG > 40 GPL or anti-β2GP1 IgG > 40 units or lupus anticoagulant | 2 |\n| Immunologic: Complement proteins domain | Low C3 or low C4 | 3 |\n| | Low C3 and low C4 | 4 |\n| Immunologic: Highly specific antibodies domain | Anti-dsDNA antibody | 6 |\n| | Anti-Sm antibody | 6 |"
        title: "الـ renal domain في معايير EULAR/ACR"
        columns: [Renal finding, Points]
        rows:
          - ["Proteinuria >0.5 g/24 h", "4"]
          - ["Class II or V LN", "8"]
          - ["Class III or IV LN", "10"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 448
        title: "قواعد المعايير"
        quote: "Classification criteria are not diagnosis criteria\nAll patients classified as having SLE must have ANA ≥ 1:80 (entry criterion)\nPatients must have ≥ 10 points to be classified as SLE\nItems can only be counted for classification if there is no more likely cause\nOnly the highest criterion in a given domain counts\nSLE classification requires points from at least one clinical domain"
        text: |
          - "**Entry criterion**: ==antinuclear antibodies (ANA) ≥1:80==."
          - محتاج **10 points** على الأقل، ومن **clinical domain** واحد على الأقل.
          - في كل domain بيتحسب **أعلى** criterion بس.
          - دي **classification** criteria، مش diagnostic.

          لاحظ: biopsy فيها **class III أو IV** لوحدها = **10** points، يعني كفاية تصنّف SLE مع ANA موجب.
      - kind: explain
        page: 448
        title: "ليه الـ biopsy لوحدها بتكسب 10؟"
        quote: "Classification criteria are not diagnosis criteria\nAll patients classified as having SLE must have ANA ≥ 1:80 (entry criterion)\nPatients must have ≥ 10 points to be classified as SLE\nItems can only be counted for classification if there is no more likely cause\nOnly the highest criterion in a given domain counts\nSLE classification requires points from at least one clinical domain"
        text: |
          بص على الأرقام: proteinuria **>0.5 g** = **4**، class **II أو V** = **8**، class **III أو IV** = **10**.

          يعني الـ **class III/IV** لوحدها بتكمّل الـ 10 points، وده معناه إن مريض عنده **ANA موجب** وbiopsy فيها proliferative LN يتصنّف SLE حتى لو مفيش ولا عَرَض تاني.

          ليه؟ التفسير المقبول (مش في الكتاب): الـ proliferative LN بالـ subendothelial deposits دي **بصمة** للـ lupus تقريبًا، صعب تلاقي سبب تاني يعملها. أما الـ proteinuria لوحدها فممكن تيجي من سكر أو ضغط، فوزنها أقل.

          وافتكر شرطين من الكتاب: ==Only the highest criterion in a given domain counts==، والـ item **مايتحسبش** لو فيه سبب تاني أرجح.
      - kind: reveal
        page: 449
        quote: "A holistic assessment including clinical, urinary, and laboratory parameters, and repeated investigations to note the progression of abnormal findings over time, are important in informing clinical management decisions."
        prompt: "مريضة lupus عملت تحليل بول مرة واحدة طلع فيه بروتين بسيط. تقرر العلاج على الرقم ده؟"
        answer: |
          لأ. الكتاب بيقول القرار مبني على ==holistic assessment==: clinical و urinary و laboratory مع بعض، وكمان **repeated investigations** عشان تشوف الـ abnormal findings ماشية لفين ==over time==.

          يعني الـ **trend** أهم من الرقم. بروتين بيزيد كل زيارة غير بروتين ثابت من سنة.
      - kind: explain
        remind: [neph.L14.017]
        page: 450
        title: "إمتى تقول البول abnormal؟"
        quote: "Suspicion of disease flare\n  Testing panel: Serum creatinine and eGFR; Urinalysis (dipstick and sediment); Spot protein–creatinine ratio (PCR); Serology (anti-dsDNA and complement)\n    Is there evidence of abnormal proteinuria or urine sediment: Abnormal proteinuria assessed by dipstick protein ≥2+ (any level of specific gravity), dipstick protein 1+ (low specific gravity), or spot PCR >500 mg/g (50 mg/mmol); Urine sediment positive for acanthocytes (≥5%), red blood cell casts or white blood cell casts\n      No → No further urine testing at this time\n      Yes → Quantify proteinuria → Is 24-hour proteinuria ≥500 mg/d?\n    Is there evidence of decreased or decreasing GFR: For example, abnormal eGFR that is below the expected level based on age and clinical history, or decreasing eGFR, with no attributable cause other than systemic lupus erythematosus\n      No → No further kidney function testing at this time\n      Yes → Repeat testing"
        text: |
          الـ **testing panel**: creatinine و estimated glomerular filtration rate (eGFR)، urinalysis (dipstick و sediment)، spot ==PCR==، و serology (**anti-dsDNA** و **complement**).

          البول يعتبر abnormal لو:
          - dipstick **≥2+** (أو 1+ لو الـ specific gravity واطي)
          - spot PCR **>500 mg/g**
          - **acanthocytes ≥5%**، أو **red blood cell (RBC)** أو **white blood cell (WBC) casts**

          ليه الـ acanthocytes والـ casts؟ التفسير المقبول (مش في الكتاب): الـ acanthocyte كرة حمرا اتشوّهت وهي بتعدّي من glomerulus ملتهب، والـ RBC cast اتعمل جوه الـ tubule، فالاتنين بيقولوا إن الدم جاي من الـ glomerulus مش من المثانة. وليه 1+ يكفي لو الـ specific gravity واطي؟ عشان البول المخفف بيقلل تركيز البروتين فالـ dipstick بيكدب.
      - kind: explain
        page: 450
        title: "الـ general measures: كل واحد بيمنع إيه؟"
        quote: "| Risk | Management |\n| Cardiovascular risk | Lifestyle modifications – smoking cessation, body weight optimization, exercise; Dyslipidemia management; Low-dose aspirin during pregnancy; Blood pressure control |\n| Proteinuria and CKD progression (refer to Chapter 1) | Avoid high-sodium diet; Optimize blood pressure; Renoprotective medications, such as RAAS blockade, SGLT2 inhibitor, etc., in stable patients without AKI; Avoid nephrotoxic insult; Prevent AKI |\n| Infection risk | Assess medical history of herpes zoster and tuberculosis; Screening for HBV, HCV, HIV, and HBV vaccination; Pneumocystis jirovecii prophylaxis (issue of potential adverse drug reaction discussed below); Influenza and pneumococcal vaccination; Individualized consideration for recombinant zoster vaccine; Individualized consideration for other infectious organisms as dictated by public health concerns at the time of treatment |\n| Bone injury | Bone mineral density and fracture risk assessment; Calcium and vitamin D supplementation; Bisphosphonates when appropriate |\n| Ultraviolet light exposure | Broad-spectrum sunscreen; Limit ultraviolet light exposure |\n| Premature ovarian failure | Gonadotropin-releasing hormone agonists (i.e. leuprolide) |"
        text: |
          الكتاب بيرتّب الـ general care حسب **الخطر**، فاحفظها بالسبب:

          - **Cardiovascular risk:** وقف التدخين، وزن، رياضة، دهون، ضغط، و ==low-dose aspirin during pregnancy==. التفسير المقبول (مش في الكتاب): الـ lupus والـ steroids الاتنين بيسرّعوا الـ atherosclerosis، والـ aspirin في الحمل ضد الـ preeclampsia.
          - **Proteinuria و CKD progression:** ملح قليل، ضغط مظبوط، و **RAAS blockade** و **SGLT2 inhibitor** في المريض المستقر ==without AKI==. التفسير المقبول (مش في الكتاب): الأدوية دي بتقلل الضغط جوه الـ glomerulus، بس في الـ AKI ممكن تنزّل الـ GFR أكتر، عشان كده الشرط.
          - **Infection risk:** اسأل عن الـ **herpes zoster** والـ **TB**، واعمل screening لـ HBV و HCV و HIV، وطعّم ضد HBV والإنفلونزا والـ pneumococcus، و prophylaxis ضد الـ Pneumocystis jirovecii. والسبب إنك داخل على **immunosuppression** هيصحّي أي حاجة نايمة.
          - **Bone injury:** DXA و calcium و vitamin D و bisphosphonates. التفسير المقبول (مش في الكتاب): عشان الـ steroids.
          - **Ultraviolet light:** sunscreen وقلّل الشمس، لأن الـ UV بيهيّج الـ lupus.
          - **Premature ovarian failure:** ==leuprolide== (GnRH agonist) مع الـ cyclophosphamide.
      - kind: sort
        page: 450
        quote: "| Risk | Management |\n| Cardiovascular risk | Lifestyle modifications – smoking cessation, body weight optimization, exercise; Dyslipidemia management; Low-dose aspirin during pregnancy; Blood pressure control |\n| Proteinuria and CKD progression (refer to Chapter 1) | Avoid high-sodium diet; Optimize blood pressure; Renoprotective medications, such as RAAS blockade, SGLT2 inhibitor, etc., in stable patients without AKI; Avoid nephrotoxic insult; Prevent AKI |\n| Infection risk | Assess medical history of herpes zoster and tuberculosis; Screening for HBV, HCV, HIV, and HBV vaccination; Pneumocystis jirovecii prophylaxis (issue of potential adverse drug reaction discussed below); Influenza and pneumococcal vaccination; Individualized consideration for recombinant zoster vaccine; Individualized consideration for other infectious organisms as dictated by public health concerns at the time of treatment |\n| Bone injury | Bone mineral density and fracture risk assessment; Calcium and vitamin D supplementation; Bisphosphonates when appropriate |\n| Ultraviolet light exposure | Broad-spectrum sunscreen; Limit ultraviolet light exposure |\n| Premature ovarian failure | Gonadotropin-releasing hormone agonists (i.e. leuprolide) |"
        prompt: "صنّف: الإجراء ده بيمنع أنهي خطر؟"
        bins:
          - "Infection"
          - "CKD progression"
          - "Bone"
          - "Ovarian failure"
        cards:
          - { text: "Screening for HBV, HCV and HIV", bin: 0 }
          - { text: "Pneumocystis jirovecii prophylaxis", bin: 0 }
          - { text: "SGLT2 inhibitor in a stable patient", bin: 1 }
          - { text: "Avoid high-sodium diet", bin: 1 }
          - { text: "Calcium and vitamin D", bin: 2 }
          - { text: "Leuprolide", bin: 3 }
        why: "الـ screening والـ prophylaxis قبل الـ immunosuppression، والملح والـ SGLT2 للكلية، والـ calcium للعضم ضد الـ steroids، والـ leuprolide بيحمي المبيض من الـ cyclophosphamide."
      - kind: explain
        remind: [neph.L14.024]
        page: 451
        title: "إمتى الـ biopsy؟"
        quote: "Systemic Lupus Erithematosus (SLE)\n  Proteinuria > 0.5 g/24-hours\n  Urinary sediment abnormalities (dysmorphic red blood cells, red blood cell casts, leukocyte casts) concomitant with the presence of proteinuria\n  Impairment of renal function secondary to SLE\n    Kidney Biopsy\n      Non-proliferative LN\n        Class II (Mesangial)\n        Class V (Membranous): Nephrotic and non-nephrotic\n      Proliferative LN\n        Class III (Focal)\n        Class IV (Diffuse)\n        Class III/IV + V (Mixed)\n      Always report: Activity and Chronicity Index (NIH); Tubulo-interstitial injury and vascular involvement; Types of deposits by immunofluorescence\n      Other clinico-histological forms (Non-LN)\n        Lupus podocytopathy\n        Thrombotic microangiopathy (aHUS, TTP, APS)\n        Interstitial nephritis\n        Cryoglobulinemic glomerulonephritis\n        Acute tubular necrosis"
        text: |
          اعمل ==kidney biopsy== لو فيه:
          - Proteinuria **>0.5 g/24 h**
          - **Urinary sediment** abnormal (dysmorphic red blood cells (RBCs)، RBC أو leukocyte casts) مع proteinuria
          - **Impaired renal function** بسبب الـ SLE

          وفي التقرير لازم يتكتب: **National Institutes of Health (NIH) activity and chronicity index**، الـ tubulo-interstitial والـ vascular involvement، ونوع الـ deposits على الـ immunofluorescence (IF).
      - kind: explain
        page: 451
        title: "الـ biopsy مش دايمًا LN"
        quote: "Systemic Lupus Erithematosus (SLE)\n  Proteinuria > 0.5 g/24-hours\n  Urinary sediment abnormalities (dysmorphic red blood cells, red blood cell casts, leukocyte casts) concomitant with the presence of proteinuria\n  Impairment of renal function secondary to SLE\n    Kidney Biopsy\n      Non-proliferative LN\n        Class II (Mesangial)\n        Class V (Membranous): Nephrotic and non-nephrotic\n      Proliferative LN\n        Class III (Focal)\n        Class IV (Diffuse)\n        Class III/IV + V (Mixed)\n      Always report: Activity and Chronicity Index (NIH); Tubulo-interstitial injury and vascular involvement; Types of deposits by immunofluorescence\n      Other clinico-histological forms (Non-LN)\n        Lupus podocytopathy\n        Thrombotic microangiopathy (aHUS, TTP, APS)\n        Interstitial nephritis\n        Cryoglobulinemic glomerulonephritis\n        Acute tubular necrosis"
        text: |
          ليه نعمل biopsy أصلًا لو المريض معروف إنه lupus؟ عشان الكتاب بيوريك إن الـ biopsy ممكن تطلع **حاجة تانية خالص** غير الـ LN الكلاسيكي:

          - **Lupus podocytopathy**
          - **Thrombotic microangiopathy** (aHUS، TTP، APS)
          - **Interstitial nephritis**
          - **Cryoglobulinemic glomerulonephritis**
          - **Acute tubular necrosis**

          وكل واحدة فيهم علاجها مختلف: الـ TMA مثلًا ممكن تحتاج anticoagulation أو plasma exchange، مش cyclophosphamide.

          وفي التقرير ==Always report==: الـ **activity and chronicity index (NIH)**، الـ tubulo-interstitial والـ vascular involvement، ونوع الـ deposits بالـ immunofluorescence. التفسير المقبول (مش في الكتاب): الـ activity بيقولك فيه إيه **يتعالج**، والـ chronicity بيقولك فيه إيه **خلاص اتليّف** ومش هيرجع، فبتوزن الـ immunosuppression على قد الفايدة.
      - kind: check
        page: 451
        quote: "Systemic Lupus Erithematosus (SLE)\n  Proteinuria > 0.5 g/24-hours\n  Urinary sediment abnormalities (dysmorphic red blood cells, red blood cell casts, leukocyte casts) concomitant with the presence of proteinuria\n  Impairment of renal function secondary to SLE\n    Kidney Biopsy\n      Non-proliferative LN\n        Class II (Mesangial)\n        Class V (Membranous): Nephrotic and non-nephrotic\n      Proliferative LN\n        Class III (Focal)\n        Class IV (Diffuse)\n        Class III/IV + V (Mixed)\n      Always report: Activity and Chronicity Index (NIH); Tubulo-interstitial injury and vascular involvement; Types of deposits by immunofluorescence\n      Other clinico-histological forms (Non-LN)\n        Lupus podocytopathy\n        Thrombotic microangiopathy (aHUS, TTP, APS)\n        Interstitial nephritis\n        Cryoglobulinemic glomerulonephritis\n        Acute tubular necrosis"
        question: "Which of these is NOT one of the non-LN forms a lupus biopsy may show?"
        options:
          - "IgA nephropathy"
          - "Lupus podocytopathy"
          - "Thrombotic microangiopathy"
          - "Cryoglobulinemic glomerulonephritis"
        answer: 0
        why:
          - "صح: الشكل بيذكر podocytopathy و TMA (aHUS, thrombotic thrombocytopenic purpura (TTP), antiphospholipid syndrome (APS)) و interstitial nephritis و cryoglobulinemic glomerulonephritis (GN) و acute tubular necrosis (ATN). مفيش immunoglobulin A (IgA)."
          - "دي أول واحدة في القائمة."
          - "موجودة: aHUS و TTP و APS."
          - "موجودة في القائمة."
      - kind: try
        items: [neph.L14.001, neph.L14.007, neph.L14.008, neph.L14.018, neph.L14.025]
    recap:
      - "المحاضرة: LN، TMA، viral GN، HRS، dysproteinemia، sarcoidosis؛ اسأل دايمًا الضرر جاي من فين."
      - "LN في 20-60% من الـ SLE، وممكن تكون silent؛ شُك أكتر في Asian و African و Hispanic والأطفال."
      - "EULAR/ACR: ANA ≥1:80، ≥10 points؛ III/IV = 10، II/V = 8، proteinuria >0.5 g = 4."
      - "General care حسب الخطر: قلب، كلية، عدوى، عضم، شمس، مبيض."
      - "Biopsy: proteinuria >0.5 g/24 h، active sediment، أو impaired function؛ اكتب NIH activity/chronicity."
