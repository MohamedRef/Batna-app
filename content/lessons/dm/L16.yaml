      - kind: reveal
        page: 207
        quote: "The coexistence of hypokalemia with metabolic acidosis is encountered in very few conditions, including proximal & distal renal tubular acidosis, DKA, amphotericin toxicity & acetazolamide overdose."
        prompt: "عادةً الـ acidosis بتعلّي الـ K. ليه الخمسة دول بيعملوا العكس؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الخمسة بيخلّوا الكلية ==تسيب K يهرب== وهي بتتعامل مع الـ acid.
          - **Proximal RTA** و **acetazolamide**: الـ bicarbonate بيهرب في البول، ومعاه K.
          - **Distal RTA** و **amphotericin**: الـ tubule مش قادر يطلّع H+، فبيطلّع K بداله.
          - **DKA**: الـ osmotic diuresis بتغسل الـ K (الكتاب بيقولها في ص 208).
      - kind: explain
