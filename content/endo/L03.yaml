items:
  # ---------- p31 ----------
  - id: endo.L03.001
    kind: card
    topic: definition
    front: How does the book define a neoplasm?
    back: Unregulated cell growth producing undifferentiated cells.
    src: { page: 31, quote: "Neoplasm is defined as\n  \"Unregulated cell growth producing undifferentiated cells\".\n  This may physiologically occur during embryogenesis or wound repair.\n  But this occurs for a limited time at a specific period." }
    status: unverified
  - id: endo.L03.002
    kind: card
    topic: definition
    front: When does undifferentiated cell growth occur physiologically, and how does it differ from neoplasia?
    back: During embryogenesis and wound repair, but only for a limited time at a specific period.
    src: { page: 31, quote: "Neoplasm is defined as\n  \"Unregulated cell growth producing undifferentiated cells\".\n  This may physiologically occur during embryogenesis or wound repair.\n  But this occurs for a limited time at a specific period." }
    status: unverified
  - id: endo.L03.003
    kind: card
    topic: definition
    front: Why can neoplastic cells make hormones of other tissues?
    back: Undifferentiated primitive cells keep some criteria and capabilities of many differentiated cells, such as their mother cell.
    src: { page: 31, quote: "These Undifferentiated primitive neoplastic cells bear some criteria and capability of multiple differentiated cells, which may be its mother cell during normal life cell cycle." }
    status: unverified
  - id: endo.L03.004
    kind: card
    topic: definition
    front: Define paraneoplastic syndromes (PNS).
    back: Clinical syndromes involving non-metastatic systemic effects that accompany neoplastic disease; broadly, signs and symptoms from the tumour's secretory products.
    src: { page: 31, quote: "Clinical syndromes involving non metastatic systemic effects that accompany neoplastic diseases" }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.005
    kind: table
    topic: definition
    title: Clinical picture of neoplastic disease
    columns: [Effect, Examples]
    rows:
      - [Mass effect, "Obstruction, invasion or compression"]
      - [Remote effect, "Metastatic, or non-metastatic (paraneoplastic)"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 31, quote: "Clinical picture of neoplastic disease\n  1) Mass effect Obstruction, invasion or compression.\n  2) Remote effect\n  Metastatic.\n  Non-metastatic (Paraneoplastic synd.)." }
    status: unverified
  # ---------- p32 ----------
  - id: endo.L03.006
    kind: enumerate
    topic: pathophysiology
    prompt: Pathophysiology of paraneoplastic syndromes.
    points:
      - Antibodies against tumour that cross-react with normal tissue (e.g. CNS)
      - "Physiologically active products: hormones, precursors, enzymes, cytokines, fetal proteins"
      - Interference with steroid hormone metabolic pathways
      - Unknown
    pass: 3
    hook: "الـparaneoplastic بيحصل بـ«3 + علامة استفهام»: antibodies ضد الورم تخبط في نسيج طبيعي (زي CNS)، منتجات شغالة (hormones، precursors، enzymes، cytokines، fetal proteins)، ولخبطة في سكة steroid hormone metabolism… والرابعة unknown. 3 + ؟ = 4."
    src: { page: 32, quote: "Pathophysiology of Paraneoplasic Syndromes\n  1) Production of antibodies against neoplastic tissue that cross react with normal body tissue like CNS.\n  2) Production of physiologically active products like hormones, hormone precursors, enzymes, cytokines and fetal proteins.\n  3) Interference with metabolic pathway of steroid hormones.\n  4) Unknown." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.007
    kind: enumerate
    topic: pathophysiology
    prompt: Systems that paraneoplastic syndromes may involve.
    points: [Endocrine, Central nervous system, Haematologic, Dermatological, Renal, Gastrointestinal, Rheumatologic, Neuromuscular, Non-specific]
    pass: 6
    hook: "الـ paraneoplastic بيلف الجسم كله، 9: «غدد، مخ، دم، جلد، كلى، بطن، مفاصل، عضل وأعصاب، وحاجات عامة» = endocrine، CNS، haematologic، dermatological، renal، GI، rheumatologic، neuromuscular، non-specific."
    src: { page: 32, quote: "Because of their complexity and varieties, the clinical picture of these syndromes vary greatly. It may involve the following systems:\n  1) Endocrine system.\n  2) Central nervous system.\n  3) Hematologic system.\n  4) Dermatological system.\n  5) Renal system.\n  6) Gastro-intestinal system.\n  7) Rheumatologic system.\n  8) Neuro-muscular system.\n  9) Non-specific." }
    status: unverified
  - id: endo.L03.008
    kind: enumerate
    topic: criteria
    prompt: Criteria for diagnosing an endocrine paraneoplastic syndrome, part 1 (criteria 1–4, p32).
    points:
      - Tumour associated with features of hormone excess
      - mRNA of the hormone shown in tumour tissue
      - High circulating hormone level
      - Hormone fails to respond to normal suppression
    pass: 3
    hook: "عشان تتهم الورم بالهرمون، أول 4 أدلة زي القضية: ورم مع علامات hormone excess، mRNA الهرمون في نسيج الورم، الهرمون عالي في الدم، ومبيتكتمش بالـsuppression. (والـ 3 الباقيين في الجزء التاني.)"
    src: { page: 32, quote: "Criteria for diagnosing Endocrinal Paraneoplastic Syndrome\n  1) Association of neoplastic disease with manifestations of excess hormone secretion.\n  2) Demonstration of mRNA in neoplastic tissue.\n  3) Demonstration of high hormone level in the circulation.\n  4) Failure of plasma or urinary hormone level to respond to normal suppression." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.009
    kind: cloze
    topic: criteria
    text: One criterion of endocrine PNS is an {{c1::arteriovenous step-up gradient}} of the hormone across the tumour of more than {{c2::ten}}.
    src: { page: 33, quote: "5) Arteriovenous step-up gradient more than ten if the hormone level across the tumor.\n6) Exclusion of other causes of excess hormone secretion.\n7) Biochemical and clinical improvement after neoplasm Rx." }
    status: unverified
  - id: endo.L03.010
    kind: card
    topic: criteria
    front: Which response to treatment supports an endocrine paraneoplastic syndrome?
    back: Biochemical and clinical improvement after the neoplasm is treated.
    src: { page: 33, quote: "5) Arteriovenous step-up gradient more than ten if the hormone level across the tumor.\n6) Exclusion of other causes of excess hormone secretion.\n7) Biochemical and clinical improvement after neoplasm Rx." }
    status: unverified
  # ---------- p33 ----------
  - id: endo.L03.011
    kind: card
    topic: ectopic-nature
    front: Why does the book say "ectopic" hormone secretion is really "eutopic"?
    back: It is increased expression of genes that non-neoplastic cells normally express in low amounts.
    src: { page: 33, quote: "It represents increased expression of genes normally expressed in low amounts by non-neoplastic cells." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.012
    kind: table
    topic: ectopic-nature
    title: Physiologically active products of neoplastic cells
    columns: [Class, Example]
    rows:
      - [Hormone, ACTH]
      - [Hormone precursor, Pro-opiomelanocortin]
      - [Enzyme, Alkaline phosphatase]
      - [Fetal protein, Alpha-fetoprotein]
      - [Cytokine, Colony stimulating factor]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 33, quote: "The gene expression products of undifferentiated neoplastic cells are usually physiologically active, and it includes:\n  1) Hormones - ACTH.\n  2) Hormone precursor - Proopiomelanocortin.\n  3) Enzymes - Alkaline phosphatase.\n  4) Fetal protein - Alpha-Fetoprotein.\n  5) Cytokine - Colony stimulating F." }
    status: unverified
  - id: endo.L03.013
    kind: enumerate
    topic: ectopic-nature
    prompt: Clinical implications of neoplastic secretory products.
    points:
      - Tumour marker
      - Follow-up of patients
      - Detection of recurrence
      - Serious manifestations (e.g. PTHrP hypercalcaemia)
      - Tumour growth by autocrine effect
    pass: 4
    hook: "منتجات الورم ليها 5: 3 «متابعة» (tumour marker، follow-up، كشف recurrence) + 2 «مشاكل» (مظاهر خطيرة زي PTHrP hypercalcaemia، والورم يكبّر نفسه بـautocrine effect). 3 + 2 = 5."
    src: { page: 33, quote: "These products have many clinical implications\n  1) It is used as a tumor marker.\n  2) It is important for follow up of patients.\n  3) It is important for detection of recurrence.\n  4) It may be responsible for serious manifestations like PTHRP causing hypercalcemia.\n  5) It may promote the growth of the tumor by autocrine effect." }
    status: unverified
    tags: [high-yield]
  # ---------- p34 ----------
  - id: endo.L03.014
    kind: card
    topic: ectopic-nature
    front: How does an ectopic polypeptide hormone differ from the native hormone?
    back: Its amino acid sequence is identical; differences come from incomplete or abnormal processing of the precursor.
    src: { page: 34, quote: "The sequence of AA in poly-peptide ectopic hormone is identical to that of the native hormone." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.015
    kind: card
    topic: ectopic-nature
    front: Why can an ectopic hormone read high on immunoassay but low on bioassay?
    back: Abnormal precursor processing makes molecules that are recognised by antibodies but are less active.
    src: { page: 34, quote: "Accordingly, Immunoassay of ectopic hormone may show high level with low bioassay level:\n  High molecular weight ectopic hormone due to incomplete enzymatic cleavage of the precursor:\" Proopiomelanocortin\".\n  Low molecular weight ectopic hormone due to fragment of unregulated intracellular processing like \"GHRH fragment\".\n  Altered glycosylation of ectopic hormones like:\n    Failure of cleavage of CHOes molecule as glycosylated ACTH.\n    Failure of normal glycosylation of Alpha subunit of HCG." }
    status: unverified
