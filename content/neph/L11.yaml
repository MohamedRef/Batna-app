  # ---------- p380-382: peritoneal dialysis ----------
  - id: neph.L11.152
    kind: enumerate
    topic: pd-rx
    prompt: Mention the advantages of peritoneal dialysis in pregnancy.
    points:
      - Controlled ultrafiltration
      - Better hemodynamic stability
      - Less anemia
      - Better BP control
      - No anticoagulation
    pass: 4
    hook: "PD في الحمل «هادي ومن غير سيولة»: controlled ultrafiltration، hemodynamic stability أحسن، BP control أحسن، anemia أقل، ومفيش anticoagulation."
    src: { page: 380, quote: "Peritoneal Dialysis During Pregnancy Although pregnancy is rare in women who are receiving peritoneal dialysis because of the possible effects of hypertonic dialysate on the transit of the ovum to the uterus, women can continue pregnancy on peritoneal dialysis with modifications in peritoneal dialysis prescriptions. The advantages of peritoneal dialysis during pregnancy are controlled ultrafiltration, better hemodynamic stability, a lesser incidence of anemia, better control of BP, and avoidance of anticoagulation." }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.153
    kind: card
    topic: pd-rx
    front: Why does PD become harder as pregnancy advances?
    back: The enlarging uterus reduces the effective peritoneal surface area, although the membrane keeps its clearance and ultrafiltration capacity.
    src: { page: 380, quote: "As the gestational age increases, peritoneal dialysis becomes difficult for many patients. With the increasing size of the uterus, effective peritoneal exchanges may not take place because of a reduction in effective peritoneal surface area, even though the peritoneal membrane continues to maintain the clearance and ultrafiltration capability during pregnancy. Thus, the prescription may need to be adjusted during pregnancy to reduce the dwell volume and" }
    status: unverified
  - id: neph.L11.154
    kind: card
    topic: pd-rx
    front: What residual urine output predicts better outcomes for pregnancy on PD?
    back: More than 500 mL a day.
    src: { page: 381, quote: "increase the number of exchanges. A successful pregnancy occurring during peritoneal dialysis may also depend on residual kidney function. Women with residual urine output of>500mL have been shown to have better fetal and maternal outcomes. (84,85) Similarly, the lesser the uremic milieu, the better the fetal outcomes. The following modifications in peritoneal dialysis prescriptions are suggested during pregnancy (fig5):" }
    status: unverified
    tags: [numbers]
  - id: neph.L11.155
    kind: enumerate
    topic: pd-rx
    prompt: Mention the peritoneal dialysis prescription changes in pregnancy (Fig 5).
    points:
