          - "ده المرشح المثالي."
          - "ده بالظبط اللي الكتاب بيقصده."
          - "السمع الطبيعي شرط مش مانع."
      - kind: explain
        page: 209
        quote: "VaccinationInfluenzavaccination, Pneumococcal vaccination. Smoking cessation. Long-term oxygen therapy (LTOT)."
        title: "من غير أدوية"
        text: |
          - Vaccines: **influenza** و **pneumococcal**.
          - **Smoking cessation**.
