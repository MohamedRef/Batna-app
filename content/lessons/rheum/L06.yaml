  - id: rheum.L06.lesson3
    title: "HLA والأمراض، والـ macrophage"
    hook: "ليه DR3 بيتكرر في SLE و Sjögren و Graves؟ والـ macrophage بيعمل إيه غير إنه بياكل؟"
    minutes: 9
    pages: [91, 93]
    topics: [hla-disease, macrophages]
    goals:
      - "تشرح 4 mechanisms للـ HLA disease association وليه كل واحد منطقي"
      - "تحفظ قائمة الـ HLA associations"
      - "تعرف حياة الـ monocyte ووظايف الـ macrophage الثلاثة"
    status: unverified
    steps:
      - kind: explain
        page: 91
        title: "الـ HLA بيعمل المرض إزاي؟"
        quote: "By what mechanism do MHC genes confer disease susceptibility:\n  T cell maturation: MHC molecules are pivotal in the process by which immune system decides whether naïve T cells are allowed to survive in the thymus and develop or whether they must die.\n  MHC molecules control what T cells can see, because T cells cannot recognize antigens alone but in association with MHC molecules and the sequence of a.a. in an MHC molecule determine which antigenic peptide can bind to that molecule.\n  Molecular mimicry theory:\n    HLA molecule may bear similarity to a certain antigen (pathogen).\n    Either pathogen is recognized as self → severe unabated disease.\n    Or immune response against pathogen and self HLA → autoimmune disease.\n  Linkage disequilibrium."
        text: |
          الـ HLA مش بيعمل المرض لوحده، بس بيهيّئ له. الـ mechanisms:

          1. **T cell maturation**: الـ major histocompatibility complex (MHC) هو اللي بيقرر أنهي naïve T cell تعيش في الـ thymus.
          2. **بيتحكم في اللي الـ T cell بتشوفه**: الـ amino acids في الـ MHC بتحدد أنهي peptide يمسك فيه.
          3. ==Molecular mimicry==.
          4. **Linkage disequilibrium**: الـ HLA نفسه بريء، بس بيتورث مع الجين الحقيقي.
      - kind: reveal
        page: 91
        quote: "Molecular mimicry theory:\n  HLA molecule may bear similarity to a certain antigen (pathogen).\n  Either pathogen is recognized as self → severe unabated disease.\n  Or immune response against pathogen and self HLA → autoimmune disease."
        prompt: "الـ molecular mimicry ليها نتيجتين عكس بعض. إيه هما؟"
        answer: |
          الـ HLA شبه antigen بتاع pathogen، فـ:
          - يا المناعة تعتبر الـ pathogen **self** وما تهاجموش ← **severe unabated disease**.
          - يا تهاجم الـ pathogen وتهاجم معاه الـ **self HLA** ← ==autoimmune disease==.
      - kind: explain
        page: 92
        title: "الـ HLA بريء بس صاحبه متهم"
        quote: "HLA molecules may not confer susceptibility to the disease with which they are associated but they are commonly inherited in association with another gene that actually confers susceptibility to the disease."
        text: |
          الـ mechanism الرابع (**linkage disequilibrium**) ليه صفحة لوحده في الكتاب: ساعات الـ HLA نفسه **ما بيعملش** القابلية للمرض، بس هو **بيتورث مع جين تاني** هو اللي بيعملها.

          يعني لو لقيت الـ HLA ده كتير في عيانين مرض معيّن، ده **ارتباط** مش بالضرورة **سبب**. تخيّل حد بيظهر دايمًا في مكان الحادثة عشان هو صاحب السوّاق، مش هو اللي سايق.

          وافتكر خريطة chromosome 6 من الدرس اللي فات: جنب الـ HLA قاعدة جينات **complement** و **TNF**، فلما الحتة دي تتورث كلها، أي واحد فيهم ممكن يكون السبب الحقيقي.
      - kind: reveal
        page: 91
        quote: "Certain HLA molecules may confer susceptibility to certain diseases, even though they do not independently cause them."
        prompt: "واحد عمل HLA typing وطلع عنده B27. هل كده هيجيله seronegative spondyloarthritis؟"
        answer: |
          لأ. الكتاب واضح: الـ HLA بيدّي **susceptibility**، بس **do not independently cause them**.

          يعني الـ B27 بيزوّد الاحتمال، ومحتاج عوامل تانية (جينات تانية، عدوى، بيئة) عشان المرض يحصل. عشان كده الـ HLA typing **مش تشخيص**، هو حتة من الصورة.
      - kind: table
        page: 92
        quote: "HLA-DR3: SLE, Sjogren's syndromes Grave's disease, type 1 DM."
        title: "أشهر الـ HLA associations"
        columns: [HLA, Diseases]
        rows:
          - ["A29", "Birdshot choroidoretinitis"]
          - ["B5", "Behçet, UC, polycystic kidney"]
          - ["B27", "Seronegative spondyloarthritis"]
          - ["DR1", "RA"]
          - ["DR2", "MS, Goodpasture"]
          - ["DR3", "SLE, Sjögren, Graves, type 1 DM"]
          - ["DR4", "RA, type 1 DM"]
          - ["DR5", "Pauciarticular JRA, Hashimoto"]
          - ["DQ", "SLE, type 1 DM"]
        hide: [[1, 1], [2, 1], [4, 1], [5, 1], [7, 1]]
      - kind: aside
        tone: joke
        page: 92
        quote: "HLA-DR2: Multiple sclerosis, Good pasture's syndrome."
        text: |
          **DR2** = **2** أمراض بتاكل الـ myelin والـ basement membrane: **multiple sclerosis** و **Goodpasture syndrome**.

          **DR3** = **3** حروف S: **S**lupus erythematosus (LE) و **S**jögren و **S**ugar، يعني type 1 DM. وزوّد عليهم Graves علشان ما يزعلش.
      - kind: check
        page: 92
        quote: "HLA-DR2: Multiple sclerosis, Good pasture's syndrome."
        question: "Goodpasture syndrome is associated with which HLA, per the lecture?"
        options: ["DR2", "DR3", "B27", "DR5"]
        answer: 0
        why:
          - "صح: DR2 = MS و Goodpasture."
          - "DR3 = systemic lupus erythematosus (SLE) و Sjögren و Graves و type 1 diabetes mellitus (T1DM)."
          - "B27 = seronegative spondyloarthritis."
          - "DR5 = pauciarticular juvenile rheumatoid arthritis (JRA) و Hashimoto."
      - kind: explain
        remind: [rheum.L06.043]
        page: 93
        title: "الـ monocyte–macrophage"
        quote: "Function of macrophage\n  1- Macrophage function as phagocytes (slower than neutrophils)\n  2-They release secretory products.\n  (Cytokines: IL1, TNF, IL6, IFN, prostaglandins, leukotrenes, enzymes, superoxides).\n  3-They affect the lymphocyte response through.\n  a) Mediators (IL1, TNF).\n  b) Act as antigen presenting cells (APC)."
        text: |
          الـ **monocyte** بيتعمل في الـ bone marrow، يلف في الدم **يوم واحد**، وبعدين يستقر في الأنسجة كـ **macrophage (histiocyte)**.

          **بيتنشّط** بـ: contact مع الميكروب، endotoxins، breakdown products، complement، coagulation products، و ==IFN-γ من الـ T helper 1 (TH1)==.

          **وظايفه:**
          1. **Phagocytosis**، أبطأ من الـ neutrophils.
          2. **Secretions**: IL-1 و tumour necrosis factor (TNF) و IL-6 و interferon (IFN) و prostaglandins و leukotrienes و enzymes و superoxides.
          3. **يأثر على الـ lymphocytes** بالـ mediators زي IL-1 و TNF، وبإنه **antigen-presenting cell (APC)**.
