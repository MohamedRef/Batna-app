  - id: geri.L01.lesson6
    title: "علاج الـ HF: السلّم والجرعات وحذر الكبار"
    hook: "تبدأ صغير وتطلع ببطء. ده مش بس مبدأ، دي الجرعات بالمللي اللي في الكتاب."
