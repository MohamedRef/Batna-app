      500 women aged 40-54 at routine check-ups are asked about meat consumption; 20% are vegetarian. Over the next 5 years,
      5 vegetarians and 43 non-vegetarians develop colorectal cancer. The design is
    options: [Case series report, Cohort study, Case-control study, Cross-sectional study, Randomized clinical trial]
    answer: 1
    why:
      - A case series has no comparison group.
      - Groups by exposure (diet), then followed for 5 years for new cancers. Risk is 5/100 = 5% vs 43/400 = 10.75%.
