  - id: geri.L10.lesson2
    title: "شجرة الـ ILD والـ UIP: ندبة فوق ندبة"
    hook: "قبل ما تقول IPF لازم تعرف هو قاعد فين في الشجرة، وشكله تحت الميكروسكوب عامل إزاي."
    minutes: 9
    pages: [171, 173]
    topics: [classification, pathology]
    goals:
      - "ترسم شجرة تصنيف الـ interstitial lung disease (ILD)"
      - "تعرّف الـ usual interstitial pneumonia (UIP) بالـ temporal و spatial heterogeneity وتعرف ليه"
      - "تعرف إمتى الـ UIP يبقى idiopathic pulmonary fibrosis (IPF) وإمتى لأ"
    status: unverified
    steps:
