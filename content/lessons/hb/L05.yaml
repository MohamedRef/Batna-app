          - reveal: "Now imagine glecaprevir/pibrentasvir is not available in her hospital."
            question: "What does the lecture allow?"
            options: ["A sofosbuvir regimen with close observation, same sofosbuvir dose", "Halve the sofosbuvir dose", "Wait until she gets a kidney transplant", "No treatment is possible"]
