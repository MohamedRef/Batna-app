  # ---------- cases and essays across the lecture ----------
  - id: neph.L11.205
    kind: case
    topic: dialysis-care
    stem: "A 31-year-old on hemodialysis three times a week for lupus nephritis finds she is 7 weeks pregnant. She wants to continue the pregnancy."
    steps:
      - reveal: "Her drugs: mycophenolate, ramipril, warfarin for a past DVT, sevelamer, folic acid 1 mg."
        question: Which immunosuppressant replaces mycophenolate first-line?
        options:
          - Azathioprine
          - Cyclophosphamide
          - Sirolimus
          - Rituximab
        answer: 0
        why: "Azathioprine is first-line; CNIs are the other safe choice. Cyclophosphamide and sirolimus are on the unsafe list; biologics are stopped."
      - question: What replaces warfarin?
        options:
          - Low-molecular-weight heparin, through 6 weeks postpartum
          - A direct oral anticoagulant
          - Aspirin alone
          - Stop anticoagulation
        answer: 0
        why: "Previous thrombosis is an indication; heparin or low-molecular-weight heparin is used through pregnancy and 6 weeks postpartum. Warfarin and direct oral anticoagulants are unsafe."
      - question: How is her dialysis changed?
        options:
          - "4-6 sessions of 4-6 h, BUN <50, bicarbonate 25-30, single-use dialyzer"
          - Keep the same schedule
          - Switch to PD immediately
          - Twice-weekly long sessions
        answer: 0
        why: "Intensive dialysis improves outcomes; low-bicarbonate dialysate avoids alkalemia in pregnancy's respiratory alkalosis."
      - question: What else is started or changed?
        options:
          - Folic acid 5 mg and low-dose aspirin by the end of the first trimester
          - A statin
          - Cinacalcet
          - Spironolactone for BP
        answer: 0
        why: "Hemodialysis removes folate, so 5 mg; aspirin prevents preeclampsia. Statins, cinacalcet and spironolactone are on the unsafe list; swap ramipril for labetalol, nifedipine, methyldopa or hydralazine."
    src: { page: 372, quote: "past should be assessed early for infertility, and, if assisted reproduction techniques are sought, single embryo transfer should be pursued. (53) Figure 3 outlines medications that are considered safe or contraindicated during pregnancy on maintenance dialysis. Immunosuppressive agents that are associated with teratogenicity, such as mycophenolate or cyclophosphamide, should be discontinued 6 weeks before planned conception to prevent fetal malformation and spontaneous pregnancy loss. (56) Azathioprine is the first-line agent to replace mycophenolate during pregnancy. Calcineurin inhibitors are other pregnancy-safe alternative agents that can be considered for immunosuppression, because they are not associated with an increased risk of pregnancy loss or congenital malformations.(56) However, especially tacrolimus, if unmonitored during pregnancy, can lead to complications including infection (22%), hypertension (56%), preeclampsia (32%), and low birth weight infants (46%).43 Evidence on the use of biological agents (infliximab, etanercept, adalimumab, and rituximab) during pregnancy is limited, and manufacturers recommend discontinuation of them before conception. Although rituximab has been associated with transient B cell depletion in mothers and infants, a recent case series did not report this. (57,58) Antihypertensive drugs of choice in pregnancy include β-blockers such as labetalol, dihydropyridine calcium channel blockers such as nifedipine, hydralazine, and methyldopa. Angiotensin-converting enzyme inhibitors (ACEis) and angiotensin receptor blockers (ARBs) should be discontinued 6 weeks before conception or at the diagnosis of pregnancy because of their high risk for teratogenicity.(59) A meta- analysis and systemic review published in 2021 showed that in comparison to those without gestational ACEi/ARB use, the use of ACEi/ARB in the first trimester resulted in a higher risk of fetal malformations (OR, 1.81; 9% CI, 1.42-2.34), cardiovascular malformations (OR, 2.50; 95% CI, 1.62-3.87), and stillbirths (OR,1.75; 95% CI, 1.21-2.53).(60)" }
    status: unverified
  - id: neph.L11.206
    kind: case
    topic: pd-rx
    stem: "A 33-year-old on CAPD (4 × 2 L exchanges) is 22 weeks pregnant. She has drain pain and heartburn, and needs 4.25% bags to stay dry."
    steps:
      - question: How should the PD prescription change?
        options:
          - Smaller dwell volumes with more exchanges, using a cycler
          - Larger 3 L dwells, fewer exchanges
          - Stop PD and wait for delivery
          - Keep the prescription
        answer: 0
        why: "The growing uterus cuts the effective surface area; smaller dwells and more frequent exchanges keep clearance."
      - question: What eases the drain pain and reflux?
        options:
          - Tidal PD leaving 15% of the volume in, and lateral decubitus while draining
          - More 4.25% dextrose
          - Supine drain with abdominal binder
          - Shorter dwell, no other change
        answer: 0
        why: "Tidal PD reduces drain pain and reflux; lateral decubitus helps drainage. Highly hypertonic bags should be minimized."
      - question: What adequacy target and calorie intake apply?
        options:
          - "Kt/V 2.2-2.4 (about 20 L/day), 25 kcal/kg/day"
          - "Kt/V 1.7, 35 kcal/kg/day"
          - "Predialysis BUN <50, 35 kcal/kg/day"
          - No target in pregnancy
        answer: 0
        why: "Kt/V 2.2-2.4 is recommended in pregnancy on PD; 35 kcal/kg/day is the hemodialysis figure."
      - reveal: "At 30 weeks, ultrasound shows polyhydramnios. Her urea is high."
        question: What is the likely mechanism?
        options:
          - Fetal osmotic diuresis from maternal urea
          - Fetal renal agenesis
          - Maternal diabetes insipidus
          - Peritonitis
        answer: 0
        why: "High maternal urea causes a fetal osmotic diuresis and more fetal urine. Intensify dialysis."
    src: { page: 381, quote: "Intensify the prescription by decreasing the dwell volume and increasing the frequency of exchanges. This may be facilitated using cyclers, particularly in the second trimester and beyond." }
    status: unverified
  - id: neph.L11.207
    kind: case
    topic: tx-risk
    stem: "A 29-year-old transplant recipient, 3 years post-transplant, is 24 weeks pregnant. Baseline creatinine 1.2 mg/dL; now 1.8 mg/dL, BP 150/95 and proteinuria rising."
    steps:
      - question: Which differential diagnoses matter most?
        options:
          - Acute rejection, preeclampsia and urinary tract infection
          - Hyperemesis and septic abortion
          - Physiological rise of pregnancy
          - Atypical HUS only
        answer: 0
        why: "Rejection can mimic preeclampsia, and UTI affects up to 40% of pregnant recipients. Creatinine normally falls in pregnancy."
      - reveal: "Urine culture is negative. sFlt-1/placental growth factor ratio is low."
        question: What is the next step before changing immunosuppression?
        options:
          - Allograft biopsy
          - Empirical antithymocyte globulin
          - Immediate delivery
          - Switch tacrolimus to sirolimus
        answer: 0
        why: "Biopsy should confirm rejection before immunosuppression is modified."
      - reveal: "Biopsy shows acute cellular rejection."
        question: What is first-line treatment?
        options:
          - High-dose steroids
          - Rituximab
          - Antithymocyte globulin
          - Mycophenolate
        answer: 0
        why: "High-dose steroids are first-line in pregnancy; data on ATG and rituximab are limited, and MMF is teratogenic."
    src: { page: 384, quote: "Allograft biopsy should be done to confirm acute rejection before modifying immunosuppression. High-dose steroids have been successful in treating allograft rejection during pregnancy and remain the first-line therapy. Data on the use of other agents like antithymocyte globulin and rituximab for treating acute rejection in pregnancy are limited and there are no specific recommendations. (94)" }
    status: unverified
  - id: neph.L11.208
    kind: essay
    topic: aki-causes
    prompt: Discuss the causes of pregnancy-related AKI by trimester, and how to approach its diagnosis.
    outline:
      - "First trimester: hyperemesis gravidarum, septic abortion (ATN), GN flare, hemorrhage; cortical necrosis with severe hypotension"
      - "Second and third: preeclampsia, HELLP, AFLP, TTP, pyelonephritis, obstruction by the uterus"
      - "Postpartum: atypical HUS, NSAIDs"
      - "Diagnosis: no pregnancy-specific criteria; baseline creatinine 0.4-0.6, follow trends; history, urine, metabolic and coagulation panels, serology, drugs, ultrasound"
      - "Biopsy: when non-diagnostic and it changes treatment; first or second trimester, avoid after 25 weeks or deliver first"
    src: { page: 361, quote: "Diagnosis of AKI in pregnancy The diagnosis of AKI in pregnancy is not standardized in clinical practice due to inconsistency in the definition of pregnancy-related AKI and non-validation of the KDIGO (Kidney Disease Improving Outcomes) guidelines, RIFLE (Risk, Injury, Failure, Loss and End-stage) and the AKIN (Acute Kidney Injury Network) criteria for the non-pregnant population in pregnant women.(9) Furthermore, detection AKI is confounded by the physiological lowering of serum creatinine due to glomerular hyper filtration in pregnancy. For instance, an increase in serum creatinine concentration by 0.4 mg/dl, consistent with stage 1 in the AKIN criteria, may point towards significant kidney injury. Currently, there are no distinct criteria for the diagnosis of AKI in pregnancy. Attention should be paid to trends in serum creatinine levels in pregnancy, and even small changes in creatinine are sensitive in picking up early kidney injury in specific clinical settings. For example, in a woman with new onset hypertension, concomitant increase in serum creatinine by 0.3 mg/dl with increases in liver enzymes and thrombocytopenia, represents AKI and requires close follow of kidney function.(23) Initial evaluation for AKI should start with a comprehensive review of the patient's history of CKD, chronic hypertension, diabetes, preeclampsia in prior pregnancies, systemic lupus erythematous, and preexisting glomerular diseases. The onset of AKI during pregnancy by trimester can point towards the underlying etiology. While hyperemesis gravidarum and septic abortions are common causes of AKI in the first trimester, majority of AKI occurring in the second and trimester are specific to a pregnancy complication of preeclampsia, HELLP syndrome, AFLP, thrombotic microangiopathies like TTP, and placental abruptio. Atypical HUS and NSAID's induced kidney injury are common causes of AKI in the postpartum period. Diagnostic evaluation should include urinalysis, urine microscopy, comprehensive metabolic panel, coagulation panel, and appropriate serological workup along with a thorough review of medications. Serum complement levels can be elevated in pregnancy due to increased synthesis by the" }
    status: unverified
  - id: neph.L11.209
    kind: essay
    topic: hd-rx
    prompt: Discuss the management of pregnancy in a woman on maintenance dialysis.
    outline:
      - "Preconception: counsel risks, encourage transplant, contraception (intrauterine device preferred), lupus quiet 6 months, stop teratogens 6 weeks before"
      - "Drugs: aspirin by end of first trimester, folic acid 5 mg, heparin/low-molecular-weight heparin if thrombotic risk, safe antihypertensives, more iron and ESA"
      - "BP <140/90; diagnose preeclampsia clinically; deliver at 37 weeks (34 with severe features), steroids before 34, low-dose magnesium"
      - "HD: 4-6 × 4-6 h, BUN <50, bicarbonate 25-30, K 3-3.5, Ca 2.5, single-use dialyzer, dry weight +400 g/week, 35 kcal and 1.5-1.8 g protein/kg"
      - "PD: smaller dwells, more exchanges, tidal, lateral drain, Kt/V 2.2-2.4, 25 kcal/kg"
      - "Monitoring: cervix at 18-20 weeks, labs twice monthly, anomaly scan"
    src: { page: 378, quote: "Hemodialysis During Pregnancy Intensive hemodialysis is recommended during pregnancy because it is associated with better fetal and maternal outcomes. Up to 36 hours of dialysis weekly is recommended for women, targeting predialysis serum blood urea nitrogen of<50mg/dL. In a series of 344 pregnancies, Okundaye et al(79) observed that infants born to women who had>20 hours/wk of dialysis had prolonged gestational age and a higher birth weight. Intensive hemodialysis is associated with improved pregnancy outcomes with a lower incidence of prematurity, a higher incidence of live birth rate, higher birth weight, and lower neonatal mortality rates.(78)" }
    status: unverified
  - id: neph.L11.210
    kind: essay
    topic: tx-plan
    prompt: Discuss pregnancy in a kidney transplant recipient.
    outline:
      - "Fertility returns in 1-6 months; contraception and counseling; risks to mother, fetus and graft"
      - "Graft: safe if creatinine ≤1.5; >1.5 with proteinuria >500 mg predicts loss; rejection 2-14.5%, biopsy then steroids"
      - "Criteria (Table 2): ≥1 year, creatinine <2 (pref <1.5), no rejection 6 months, safe drugs, BP controlled on one drug, proteinuria <300 mg, normal US"
      - "Drugs: stop MMF/MPA and mTOR (contraception 3 months), azathioprine ≤2 mg/kg, CNI, prednisolone; stop ACEi/ARB, avoid atenolol; folic acid, aspirin, low-molecular-weight heparin if proteinuria >2 g"
      - "Delivery: vaginal, hydrocortisone 100 mg q6h; breastfeeding allowed on prednisolone, azathioprine, CNI"
    src: { page: 386, quote: "Table 2: Suggested criteria for safe pregnancy in kidney transplant recipients\n1. No less than 1-year posttransplantation\n2. Stable allograft function with serum creatinine <2.0 mg/dl, preferably <1.5 mg/dl\nAn eGFR of 40ml/min/1.73 m2 entitles the lowest GFR range to plan pregnancy\n3. No episodes of acute rejection within the past 6 months\n4. Stable (and minimal) pregnancy-safe immunosuppression, preferably with cyclosporine (or TAC), AZA, and steroids\n5. Normotensive or well-controlled hypertension on one antihypertensive agent\n6. Minimal (<300mg/24h) or no proteinuria\n7. Normal allograft ultrasound" }
