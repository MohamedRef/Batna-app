    hook: "القلب المزمن بيخنق الكلية: «الدم مش جاي، ومش عارف يرجع، وكمان بيتكلّس» = low cardiac output وchronic hypoperfusion؛ venous pressure وvenous resistance عاليين؛ وinflammation مع arterial وendothelial calcification. 2 + 2 + 1."
    src: { page: 70, quote: "Figure 2: Mechanism of damage in CRS-2. CKD, chronic kidney disease; CRS, cardiorenal syndrome.\nChronic Heart Disease\n  Genetic predisposition, Environmental risk factors → Normal Kidney Function\n  Low Cardiac Output, Inflammation, Arterial calcification, Endothelial calcification → Initiation of Kidney Damage\n  Chronic hypoperfusion, Increased venous pressure, Increased venous resistance → Progression to CKD\nNormal Kidney Function → (Chronic hypofusion, Apoptosis) → Initiation of Kidney Damage → (Sclerosis-Fibrosis) → Progression to CKD\nKidney → Anemia, Hypertension, Electrolyte imbalance → Chronic Heart Disease" }
    status: unverified
