        title: "يعني إيه obscure؟"
        quote: "Obscure gastrointestinal bleeding (OGIB) is defined as recurrent or persistent gastrointestinal bleeding from a source that cannot be identified using upper or lower endoscopy and is associated with a so-called \"gastrointestinal disease of unknown cause."
        text: |
          ==OGIB== = نزيف **recurrent or persistent** مصدره مش باين في الـ **upper ولا lower endoscopy**.

          بيحصل في حوالي **5%** من كل حالات الـ GI bleeding.

          وأول خطوة في الكتاب: **contrast-enhanced helical computed tomography (CT)** للـ small bowel (لو مفيش renal failure أو contrast allergy). ولو طلع فيه حاجة ← **deep enteroscopy** (DBE، single-balloon enteroscopy (SBE)، spiral) من البُق أو من تحت حسب مكان الـ lesion.

          ليه CT الأول؟ التفسير المقبول (مش في الكتاب): الـ small bowel أمتار والـ scope مش بيوصل كله، فالـ CT بيمسحه كله مرة واحدة ويقولك تدخل منين: من البُق لو الـ lesion فوق، ومن تحت لو تحت. والـ contrast بيتعب الكلية وممكن يعمل allergy، عشان كده الاستثناءين دول.
      - kind: explain
        page: 230
        title: "قبل ما تدوّر في الـ small bowel: بُص تاني"
        quote: "Second-look upper endoscopy should be considered in cases of recurrent hematemesis, melena, or a previously incomplete exam."
        text: |
          - **Second-look upper endoscopy:** recurrent hematemesis أو melena، أو الأول كان **incomplete**.
          - **Second-look colonoscopy:** recurrent hematochezia أو شاكك في مصدر تحت.
          - **Push enteroscopy** ممكن تبقى هي الـ second look.

          لو الـ second looks **normal** ← ==small bowel evaluation==.

          ليه تبص تاني قبل الـ small bowel؟ التفسير المقبول (مش في الكتاب): كتير من الـ lesions اللي بتتسمى obscure بتطلع في الآخر في مكان المنظار الأول وصلّه بس اتفوّتت: دم مغطيها، أو prep وحش، أو الفحص ما كملش.
