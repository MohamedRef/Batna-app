  - id: rheum.L04.lesson3
    title: "العلاج: warfarin، حمل، وحالات خاصة"
    hook: "سؤال الامتحان الكلاسيكي: عيان APS عمل DVT، تديله إيه ولحد امتى؟ وست حامل؟"
    minutes: 9
    pages: [73, 76]
    topics: [thrombotic, obstetric, adjunct]
    goals:
      - "تعرف علاج الـ thrombotic APS والـ INR المطلوب"
      - "تعرف ليه الـ DOACs ممنوعة في الـ high risk"
      - "تعالج الـ obstetric APS وتعرف الـ primary prevention"
    status: unverified
    steps:
      - kind: explain
        page: 73
        title: "Thrombotic APS"
        quote: "lifelong anticoagulation is generally required to prevent recurrence."
        text: |
          بعد أول جلطة: ==lifelong anticoagulation== غالبًا.

          - **في الأول:** **heparin**، يا **UFH** يا **LMWH**. الـ **UFH** ميزته إنك تقدر **تعكسه بسرعة**.
          - **على المدى الطويل:** **warfarin** هو الأساس، **INR 2–3** لمعظم العيانين.
          - **INR 3–4** لو الجلطة رجعت رغم الـ standard anticoagulation.
      - kind: aside
        tone: trap
        page: 73
        quote: "NOT recommended in high-risk APS:"
        text: |
          الـ ==DOACs== زي rivaroxaban و apixaban **NOT recommended** في الـ **high-risk APS**، خصوصًا الـ **triple positive**: التجارب ورّت **زيادة في الجلطات المتكررة**.

          يعني الدوا "الحديث المريح" هنا هو الغلط. warfarin القديم يكسب.
      - kind: update
        page: 73
        quote: "DOACs (e.g., rivaroxaban, apixaban)"
        text: "الـ **EULAR 2019** بتقول: ما تديش rivaroxaban للـ triple positive، وابعد عن الـ DOACs بعد الـ arterial events. والـ EMA سنة 2019 حذّرت من الـ DOACs في APS بتاريخ جلطات."
        ref: "EULAR recommendations for APS in adults, 2019"
      - kind: check
        page: 73
        quote: "INR 3–4 may be considered in recurrent events despite standard anticoagulation."
        question: "Triple-positive man on warfarin, INRs 2.3–2.8, has a second DVT. Next step?"
        options: ["Raise target INR to 3–4", "Switch to apixaban", "Stop warfarin, start hydroxychloroquine", "Add aspirin and keep INR 2–3 forever, no change"]
        answer: 0
        why:
          - "صح: recurrence رغم standard anticoagulation ← فكّر في **INR 3–4**."
          - "الـ DOACs بتزوّد الـ recurrence في الـ triple positive."
          - "الـ HCQ adjunct، مش بديل للـ anticoagulation."
          - "الكتاب ما قالش aspirin هنا؛ قال INR أعلى."
      - kind: explain
        page: 74
        title: "Obstetric APS"
        quote: "Low-dose aspirin (LDA) 75–100 mg/day Prophylactic low-molecular-weight heparin (LMWH)"
        text: |
          الست اللي عندها APS وتاريخ pregnancy loss: ==LDA + prophylactic LMWH==.

          - **Low-dose aspirin 75–100 mg/day**
          - **Prophylactic LMWH**
          - ابدأ **بدري في الحمل** وكمّل طول الحمل.
          - وقّف الـ LMWH **قبل الولادة بشوية**، ورجّعه **postpartum**.

          **Refractory:** LMWH بجرعة أعلى، **hydroxychloroquine**، أو **IVIG** في حالات مختارة.
      - kind: reveal
        page: 74
        quote: "Discontinue LMWH shortly before delivery and resume postpartum to reduce thrombosis risk."
        prompt: "ليه بنوقف الـ LMWH قبل الولادة وبعدين نرجّعه على طول؟"
        answer: |
          قبل الولادة: علشان **النزيف** وعلشان الـ **epidural/spinal** تبقى آمنة.

          بعد الولادة: الـ ==postpartum== من أعلى أوقات الـ thrombosis أصلًا، وعيانة APS خطرها مضاعف. فنرجّعه **to reduce thrombosis risk**. شرح الأمان مع الـ neuraxial ده منطق عملي، والقاعدة نفسها من الكتاب.
      - kind: explain
        page: 74
        title: "Primary prevention والحالات الخاصة"
        quote: "Patients with APS undergoing surgery should receive perioperative prophylactic anticoagulation."
        text: |
          - **Asymptomatic persistent aPL**، خصوصًا triple positive أو LA positive: **مفيش consensus**، بس كتير بيدّوا **low-dose aspirin** مع control للـ CV risk factors زي smoking و hypertension.
          - **Surgery/immobilisation:** ==perioperative prophylactic anticoagulation==، ولو وقفت الـ warfarin ← **bridge with LMWH**.
          - **Malignancy أو infection** كـ trigger: عالج السبب، ده **provoked APS**.
