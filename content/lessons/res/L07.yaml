  - id: res.L07.lesson4
    title: "NNT: كام عيان نعالج علشان ننقذ واحد؟"
    hook: "دوا بيقلل الوفيات 50%... بس ده ممكن يعني ٤ عيانين أو ٤٠٠٠ عيان. الفرق كله في الـ NNT."
    minutes: 9
    pages: [51, 63]
    topics: [effect-measures]
    goals:
      - "تحسب CER و EER و RRR و ARR و NNT من 2x2 table"
      - "تفهم ليه الـ RRR لوحده بيخدع"
      - "تحل تمرين الـ INH وتمرين الـ zidovudine وتلاقي غلطة الشريحة"
    status: unverified
    steps:
      - kind: explain
        page: 52
        quote: "The relative risk reduction (RRR) The absolute risk reduction (ARR) The numbers needed to treat (NNT)"
        title: "Step 12: حجم الأثر بـ 3 أرقام"
        text: |
          في الـ analysis: أول حاجة **baseline table** يقارن الجروبين، وبعدين **2x2 table** بخانات a و b و c و d.

          وعلشان تحكم على حجم الأثر عندك 3 مقاييس:
          - ==Relative risk reduction (RRR)==
          - ==Absolute risk reduction (ARR)==
          - ==Number needed to treat (NNT)==
      - kind: table
        page: 53
        quote: "Number Needed to Treat NNT =1/ ARR"
        title: "المعادلات"
        columns: ["Measure", "Formula"]
        rows:
          - ["CER (control)", "c / (c + d)"]
          - ["EER (experimental)", "a / (a + b)"]
          - ["RRR", "(CER - EER) / CER"]
          - ["ARR", "CER - EER"]
          - ["NNT", "1 / ARR"]
        hide: [[2, 1], [3, 1], [4, 1]]
      - kind: figure
        page: 54
        quote: "We need to treat 20 people to prevent one death"
        title: "مثال المحاضرة: 17% ضد 12%"
        alt: "Bar chart. Control mortality 17 percent, intervention 12 percent. The gap between the bars is the absolute risk reduction, 5 percent. The relative risk reduction is 5 divided by 17, 29 percent. The number needed to treat is 100 divided by 5, 20."
        caption: "الفرق بين العمودين هو الـ **ARR = 5%**. اقسمه على عمود الـ control تاخد **RRR = 29%**. و **NNT = 100 / 5 = 20**."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 210H300" class="fg-thin"/>
            <rect x="70" y="40" width="70" height="170" rx="4" class="fg-bad"/>
            <text x="105" y="32" text-anchor="middle" class="t-sm t-b">17%</text>
            <text x="105" y="230" text-anchor="middle" class="t-sm">Control</text>
            <rect x="190" y="90" width="70" height="120" rx="4" class="fg-good"/>
            <text x="225" y="82" text-anchor="middle" class="t-sm t-b">12%</text>
            <text x="225" y="230" text-anchor="middle" class="t-sm">Intervention</text>
            <path d="M150 40H270M270 40V90" class="fg-arrow-acc"/>
            <text x="278" y="60" class="t-sm t-acc t-b">ARR</text>
            <text x="278" y="76" class="t-sm t-acc">5%</text>
            <text x="165" y="248" text-anchor="middle" class="t-sm t-mut">RRR = 5/17 = 29% · NNT = 100/5 = 20</text>
          </svg>
      - kind: explain
        page: 56
        quote: "Importance of NNT"
        title: "ليه الـ RRR لوحده بيخدع؟"
        text: |
          الـ RRR ==does not discriminate== بين أثر absolute ضخم وأثر تافه. بص على 3 أدوية كلهم **RRR = 50%**:

          - CER 50%، EER 25%: ARR 25%، **NNT = 4**.
          - CER 5%، EER 2.5%: ARR 2.5%، **NNT = 40**.
          - CER 0.05%، EER 0.025%: ARR 0.025%، **NNT = 4000**.

          نفس الـ 50%، بس التالت محتاج تعالج **4000 واحد** علشان تنفع واحد. القاعدة: ==ARR = RRR × baseline risk==، فكل ما الـ baseline risk يقل، الـ NNT يكبر.
      - kind: aside
        tone: analogy
        page: 55
        quote: "does not discriminate between huge absolute treatment effects and trivial ones"
        text: |
          إعلان: «خصم 50%!» على إيه؟ لو على عربية، ده فرق مهول. لو على باكو لبان، فرقت معاك نص جنيه.

          الـ **RRR** هو الـ «50%» اللي في الإعلان. الـ **ARR** هو الفرق الـ absolute: الفلوس اللي وفّرتها فعلًا. وشركات الأدوية بتحب تكتب الـ RRR بخط كبير.
      - kind: check
        page: 62
        quote: "which scenario results in the lowest NNT"
        question: "Which scenario gives the lowest NNT?"
        options:
          - "Greater RRR and higher baseline risk"
          - "Lower RRR and lower baseline risk"
          - "Lower RRR and higher baseline risk"
          - "Greater RRR and lower baseline risk"
        answer: 0
        why:
          - "صح: ARR = RRR × baseline risk، فالاتنين عاليين يدّوا أكبر ARR وأصغر NNT."
          - "الاتنين واطيين = أصغر ARR = أكبر NNT."
          - "الـ RRR الواطي بيصغّر الـ ARR."
          - "الـ baseline risk الواطي بيصغّر الـ ARR."
      - kind: case
        page: 59
        quote: "CER = 9/45 = 20%"
        stem: "100 أطفال contacts لعيانين TB. 10 عندهم TB أصلًا. من الـ 90 الباقيين: 45 خدوا isoniazid و 3 منهم جالهم TB، و 45 ماخدوش و 9 منهم جالهم TB."
        steps:
          - question: "What are CER and EER?"
            options: ["CER 20%, EER 6.67%", "CER 6.67%, EER 20%", "CER 9%, EER 3%", "CER 10%, EER 3%"]
            answer: 0
            why: "الـ control هم اللي ماخدوش: 9/45 = 20%. الـ experimental خدوا INH: 3/45 = 6.67%. والـ 10 اللي عندهم TB أصلًا برّه الحسبة."
          - question: "ARR and RRR?"
            options: ["ARR 13.33%, RRR 0.67", "ARR 0.67, RRR 13.33%", "ARR 6.67%, RRR 0.33", "ARR 20%, RRR 0.5"]
            answer: 0
            why: "ARR = 20 - 6.67 = 13.33%. RRR = 13.33 / 20 = 0.67."
          - question: "NNT?"
            options: ["7.69, so treat 8 children", "13", "20", "3"]
            answer: 0
            why: "NNT = 1 / 0.1333 = 7.69، والـ NNT دايمًا بيتقرّب لفوق: 8 أطفال علشان نمنع حالة TB واحدة."
      - kind: case
        page: 60
        quote: "EER = 13/180 =0.07"
        stem: "Zidovudine للحوامل: 13 من 180 طفل اتعدوا بالـ HIV في جروب الـ zidovudine، و 40 من 183 في الـ placebo."
        steps:
          - question: "EER and CER?"
            options: ["EER 0.07, CER 0.22", "EER 0.22, CER 0.07", "EER 0.13, CER 0.40", "EER 0.07, CER 0.15"]
            answer: 0
            why: "EER = 13/180 = 0.07. CER = 40/183 = 0.22."
          - question: "RRR and ARR?"
            options: ["RRR 68%, ARR 0.15", "RRR 15%, ARR 0.68", "RRR 32%, ARR 0.15", "RRR 68%, ARR 0.22"]
            answer: 0
            why: "RRR = 0.15 / 0.22 = 68%. ARR = 0.22 - 0.07 = 0.15."
          - question: "The slide prints RR = 3.14 and NNT = 100/15 = 6. What is right?"
            options: ["RR = 0.33; NNT = 7", "RR = 3.14; NNT = 6", "RR = 0.68; NNT = 15", "RR = 3.14; NNT = 7"]
            answer: 0
            why: "الـ 3.14 هي CER/EER، مقلوبة. الـ RR = EER/CER = 0.07/0.22 = حوالي 0.33، يعني الدوا بيحمي. و 100/15 = 6.7، والـ NNT بيتقرّب لفوق: 7."
      - kind: aside
        tone: exam
        page: 63
        quote: "the control event rate (CER) was 20% and the treatment event rate (TER) was 10%"
        text: |
          سؤال شريحة 63 بيتكرر كتير: CER 20%، treatment 10%.

          - **RR** = 10/20 = **0.5** (مش 2.0: الـ RR دايمًا treated على control).
          - **RRR** = 1 - 0.5 = **50%**.
          - **ARR** = 20 - 10 = **10%**.
          - **NNT** = 1/0.10 = **10**.

          لو شفت RR = 2.0 في الاختيارات، ده فخ القسمة بالمقلوب.
      - kind: try
        items: [res.L07.053, res.L07.054, res.L07.057]
    recap:
      - "CER = c/(c+d)، EER = a/(a+b)، RRR = (CER-EER)/CER، ARR = CER-EER، NNT = 1/ARR، وبيتقرّب لفوق."
      - "17% ضد 12%: RRR 29%، ARR 5%، NNT 20."
      - "الـ RRR مابيفرّقش بين أثر ضخم وتافه. ARR = RRR × baseline risk."
      - "INH: CER 20%، EER 6.67%، ARR 13.33%، RRR 0.67، NNT 7.69. Zidovudine: الـ RR الصح 0.33 مش 3.14، والـ NNT 7."
    practice: [res.L07.051, res.L07.052, res.L07.053, res.L07.054, res.L07.055, res.L07.056, res.L07.057, res.L07.058, res.L07.059, res.L07.060, res.L07.061, res.L07.062]
