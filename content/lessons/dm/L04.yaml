  # Split from lesson4 on 2026-11-13 (#828): lipid-lowering drugs and statins by setting.
  - id: dm.L04.lesson5
    title: "الدهون: statin الأول، والـ LDL goal بالخطر"
    hook: "‏<70 ولا <55؟ الرقم بيتحدد بالعيان مش بالتحليل. ولو الـ statin مش كفاية، فيه سكتين تانيين."
    minutes: 9
    pages: [46, 47]
    topics: [lipids]
    goals:
      - "ترتّب الـ lipid-lowering drugs: statin، ezetimibe، PCSK9i"
      - "تختار الـ intensity والـ LDL goal في primary و secondary prevention"
      - "تعرف الـ lifestyle للدهون، والـ statin فوق 75 وفي الحمل"
    status: unverified
    steps:
      - kind: explain
        page: 46
        title: "الـ statin الأول، وبعده مين؟"
        quote: "Statins are recommended as the first-choice lipid-lowering treatment in patients with DM and high LDL-C levels: administration of statins is defined based on the CV risk profile of the patient and the recommended LDL-C (or non–HDL-C) target levels."
        text: |
          1. ==Statins== هي **first choice** في السكر مع LDL عالي، والجرعة بتتحدد بـ **CV risk profile** والـ LDL target.
          2. ما وصلتش للهدف؟ ضيف **ezetimibe**.
          3. **Very high risk** ولسه الـ LDL عالي على أقصى statin + ezetimibe، أو **statin intolerance**: **PCSK9 inhibitor**.

          ليه الترتيب ده؟ لأن الـ statin هو أقوى دوا وأرخصه وأكتر واحد أثبت إنه بيقلل الجلطات. الـ ezetimibe بيقفل **امتصاص** الكوليسترول من الأمعاء، يعني سكة تانية غير الـ statin اللي بيقفل **التصنيع** في الكبد، فبيكمّلوا بعض. والـ PCSK9i أقوى بس أغلى وحقن، فبيتأجل للي محتاجه فعلًا (التفسير مقبول، مش في الكتاب).
      - kind: explain
        page: 46
        title: "الـ lifestyle للدهون"
        quote: "Lifestyle modification Weight loss (if indicated) Mediterranean or DASH eating pattern Reduction of saturated fat and trans fat Increase of dietary n-3 fatty acids, Plant stanols/sterols intake Increased physical activity"
        text: |
          - **Weight loss** لو محتاج
          - **Mediterranean** أو **DASH** eating pattern
          - ==Reduction of saturated و trans fat==
          - **n-3 fatty acids** أكتر
          - **Plant stanols/sterols**
          - **Physical activity** أكتر

          ليه الأكل مهم مع الدوا؟ عشان الأكل بيأثر على نفس الأرقام. والتفسير المقبول (مش في الكتاب) لكل واحدة: الدهون المشبعة والـ trans بتخلّي الكبد يعمل LDL أكتر ويسحب أقل، والـ stanols/sterols شبه الكوليسترول فبتزاحمه على الامتصاص في الأمعاء، والـ n-3 بتنزّل الـ triglycerides، والحركة بتعلّي الـ HDL وتحسّن الـ insulin resistance.
      - kind: explain
        page: 46
        title: "الـ statin بالسن والخطر"
        quote: "Statin Treatment—Primary Prevention\n  10) For people with diabetes aged 40–75 years without ASCVD, use moderate-intensity statin therapy in addition to lifestyle therapy.\n  11) For people with diabetes aged 40–75 at higher cardiovascular risk, including those with one or more ASCVD risk factors, it is recommended to use high-intensity statin therapy to reduce LDL cholesterol by ≥50% of baseline and to target an LDL cholesterol goal of <70 mg/dL."
        text: |
          - **40–75 من غير ASCVD:** moderate-intensity.
          - **40–75 + risk factor واحد أو أكتر:** ==high-intensity==، low-density lipoprotein (LDL) ↓ ≥50% و **<70 mg/dL**.
          - **ASCVD (أي سن):** high-intensity، LDL ↓ ≥50% و **<55 mg/dL**.
          - مش وصلت؟ **ezetimibe** أو **proprotein convertase subtilisin/kexin type 9 (PCSK9) inhibitor (PCSK9i)**.
          - "**>75:** ممكن تبدأ moderate بعد نقاش؛ لو بياخده كمّل. **الحمل: ممنوع.**"

          ليه risk factor واحد بيقلبك من moderate لـ high؟ لأن مريض السكر نفسه بادئ من خطر عالي، فأي حاجة زيادة (ضغط، تدخين، albuminuria) بتحطه في منطقة الجلطة القريبة، والـ moderate بينزّل الـ LDL 30–49% بس، مش كفاية يوصل لـ <70. والـ ASCVD هدفه أوطى (<55) عشان الجلطة حصلت خلاص، والتانية أقرب.
      - kind: figure
        page: 47
        quote: "High-intensity statin therapy is recommended to target an LDL cholesterol reduction of ≥50% from baseline and an LDL cholesterol goal of <55 mg/dL"
        title: "الـ LDL goal بالسيناريو"
        alt: "Three boxes by setting. Diabetes aged 40 to 75 without ASCVD: moderate-intensity statin. Aged 40 to 75 with one or more ASCVD risk factors: high-intensity statin, LDL down 50 percent or more and under 70 mg/dL. Any age with ASCVD: high-intensity statin, LDL down 50 percent or more and under 55 mg/dL. Not at goal on maximum tolerated statin: add ezetimibe or a PCSK9 inhibitor."
        caption: "كل ما الخطر يعلى، الـ **intensity** تعلى والـ ==LDL goal== ينزل: مفيش رقم، بعدين **<70**، بعدين **<55**."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L04g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
