      - kind: check
        page: 105
        quote: "3. Pregnancy:\n  Pregnancy has a significant impact on hpt physiology.\n  Tbg ↑as a consequence of oestrogen-induced increased hepatic synthesis, together with reduced degradation.\n  Total t4 and t3 ↑ to 150% of non-pregnant values during the first half of pregnancy and maintained until parturition.\n  Transient ↑ in ft4 in first trimester is due to the stimulatory effects of ↑ hcg acting on the tsh receptor.\n  In hyperemesis gravidarum women become overtly thyrotoxic with a fully suppressed tsh.\n  In this setting, it is important to distinguish gestational hyperthyroidism from other causes of thyrotoxicosis (e.g. Graves' disease) & (trab) measurement is helpful."
        question: "A woman with hyperemesis gravidarum has a suppressed TSH and high FT4. Which test best separates gestational hyperthyroidism from Graves'?"
        options: ["TRAb", "Total T4", "TBG", "Reverse T3"]
        answer: 0
        why:
          - "صح: الـ TSH receptor antibodies (TRAb) موجبة في الـ Graves'."
          - "الـ total T4 عالي في الحمل أصلًا بسبب الـ TBG."
