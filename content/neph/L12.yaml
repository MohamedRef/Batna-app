  - { id: lactic, title: "Type B lactic acidosis" }
items:
  # ---------- p410: spectrum ----------
  - id: neph.L12.001
    kind: card
    topic: spectrum
    front: What does the field of onconephrology cover?
    back: The intersection of nephrology with oncology; the needs of patients who have cancer and also kidney disease in its many forms.
    src: { page: 410, quote: "The field of onconephrology encompasses the intersection of nephrology with oncology" }
    status: unverified
  - id: neph.L12.002
    kind: card
    topic: spectrum
    front: What kind of care does onconephrology highlight the need for?
    back: A multidisciplinary, coordinated team.
    src: { page: 410, quote: "This highlights the need for multidisciplinary, coordinated team." }
    status: unverified
  - id: neph.L12.003
    kind: enumerate
    topic: spectrum
    prompt: Enumerate the onconephrology spectrum.
    points:
      - Acute kidney injury (AKI)
      - CKD
      - Glomerular diseases
      - Kidney cancer
      - Kidney manifestations of multiple myeloma
      - Electrolyte and acid-base disorders
      - Treatment-related nephrotoxicity
      - Urinary tract obstruction
      - Kidney disorders associated with HSCT
    pass: 6
    src: { page: 410, quote: "The myriad kidney manifestations of multiple myeloma (MM). Various electrolyte and acid-base disorders, Treatment related nephrotoxicity. Urinary tract obstruction." }
    status: unverified
    tags: [high-yield]
  # ---------- p411-412: epidemiology and GFR ----------
  - id: neph.L12.004
    kind: card
    topic: gfr
    front: Why does CKD often preexist in patients with cancer?
    back: Because comorbid conditions such as diabetes mellitus and hypertension are highly prevalent in the population.
    src: { page: 411, quote: "This is likely because of comorbid conditions, such as diabetes mellitus and hypertension, that are highly prevalent in the population." }
    status: unverified
  - id: neph.L12.005
    kind: card
    topic: gfr
    front: CKD itself raises the risk of which malignancies especially?
    back: Cancers of the urinary tract.
    src: { page: 411, quote: "CKD in itself may be associated with a higher risk for certain malignancies, especially those of the urinary tract." }
    status: unverified
  - id: neph.L12.006
    kind: cloze
    topic: gfr
    text: "AKI is common in patients with cancer owing to {{c1::sepsis}}, {{c2::drugs}} and {{c3::dehydration}}."
    src: { page: 411, quote: "Acute Kidney Injury is a common occurrence in patients with cancer owing to sepsis, drugs and dehydration." }
    status: unverified
  - id: neph.L12.007
    kind: card
    topic: gfr
    front: Why must kidney function be determined in a cancer patient before chemotherapy?
    back: Accurate dosing of chemotherapy is needed for optimal outcomes and to avoid toxicity, especially for drugs excreted by the kidney.
    src: { page: 411, quote: "Accurate dosing of chemotherapeutic agents is required to ensure optimal outcomes and to avoid toxicity." }
    status: unverified
  - id: neph.L12.008
    kind: enumerate
    topic: gfr
    prompt: Which factors make serum creatinine only roughly track the GFR?
    points:
      - Age
      - Muscle mass
      - Meat intake
      - Race
      - Creatine supplements
    pass: 4
    src: { page: 411, quote: "Serum creatinine levels only roughly track with the GFR because of factors such as age, muscle mass, meat intake, race and intake of creatine supplements" }
    status: unverified
  - id: neph.L12.009
    kind: card
    topic: gfr
    front: If only serum creatinine is used, these confounders tend to do what to the GFR estimate?
    back: Overestimate the GFR. So use GFR estimation equations or measured creatinine clearance instead.
    src: { page: 411, quote: "which can lead to overestimation of the GFR if only the serum creatinine is used." }
    status: unverified
  - id: neph.L12.010
    kind: cloze
    topic: gfr
    text: "Cystatin C is a {{c1::13,000}}-Dalton {{c2::cysteine proteinase inhibitor}} produced by all nucleated cells at a {{c3::constant}} rate."
    src: { page: 411, quote: "Cystatin C is a 13,000-Dalton cysteine proteinase inhibitor produced by all nucleated cells at a constant rate." }
    status: unverified
    tags: [numbers]
  - id: neph.L12.011
    kind: card
    topic: gfr
    front: How does the kidney handle cystatin C, and why does that make it a GFR marker?
    back: It is freely filtered, then catabolized in the tubules with insignificant urinary excretion, so its serum level depends on the GFR.
    src: { page: 411, quote: "It is freely filtered at the glomerulus and then undergoes catabolism within the kidney tubules, resulting in insignificant urinary excretion." }
    status: unverified
  - id: neph.L12.012
    kind: card
    topic: gfr
    front: Why is an isolated cystatin C questioned for GFR and nephrotoxicity in oncology?
    back: Both the malignancy and chemotherapy appear to have independent effects on cystatin C levels that confound it.
    src: { page: 412, quote: "there appear to be independent effects of both the malignancy and chemotherapy on cystatin C levels that confound its utility." }
    status: unverified
    tags: [high-yield]
  - id: neph.L12.013
    kind: card
    topic: gfr
    front: Which endogenous filtration markers do GFR-estimating equations use?
    back: Serum creatinine and serum cystatin C.
    src: { page: 412, quote: "These GFR-estimating equations use endogenous filtration markers such as serum creatinine and serum cystatin C." }
    status: unverified
  - id: neph.L12.014
    kind: cloze
    topic: gfr
    text: "The {{c1::CKD-EPI}} equation is currently recommended by the {{c2::KDOQI}}; it uses race, age, sex and serum creatinine."
    src: { page: 412, quote: "The Chronic Kidney Disease Epidemiology Collaboration (CKD-EPI) equation is currently recommended by the KDOQI." }
    status: unverified
    tags: [high-yield]
    update:
      text: "The 2021 CKD-EPI creatinine equation dropped the race variable, and KDIGO 2024 recommends it (with cystatin C where creatinine is unreliable). The book's version with race is the exam answer."
      ref: "KDIGO 2024 CKD guideline; CKD-EPI 2021"
  - id: neph.L12.015
    kind: card
    topic: gfr
    front: Which GFR equation has been validated in cancer cohorts and performs better than other methods there?
    back: The CKD-EPI equation.
    src: { page: 412, quote: "The CKD-EPI equation has been validated in cohort studies of patients with cancer" }
    status: unverified
  - id: neph.L12.016
    kind: mcq
    topic: gfr
    stem: A 70-year-old cachectic woman with metastatic breast cancer has serum creatinine 0.6 mg/dL. Carboplatin dosing depends on GFR. What is the best approach to her kidney function?
    options:
      - Use the CKD-EPI equation or a measured creatinine clearance
      - Accept the low creatinine as proof of normal GFR
      - Use an isolated cystatin C level alone
      - Use blood urea alone
      - Skip assessment because carboplatin is not renally cleared
    answer: 0
    why:
      - "Correct: creatinine alone overestimates GFR with low muscle mass; use an estimating equation (CKD-EPI) or measured clearance (p411-412)."
      - Low muscle mass lowers creatinine and leads to overestimation of the GFR.
      - Isolated cystatin C is questioned in cancer because the tumor and chemotherapy affect its level.
      - Urea is not one of the lecture's GFR methods.
      - Drugs excreted by the kidney are exactly the ones that need a GFR.
    src: { page: 411, quote: "either GFR estimation equations (which adjust for some of these confounding factors) or measured creatinine clearance must be used to better assess GFR." }
    status: unverified
  # ---------- p412-413: AKI ----------
  - id: neph.L12.017
    kind: card
    topic: aki
    front: Is the diagnostic schema for AKI different in a patient with cancer?
    back: "No: it is the same as in other patients; decide whether the cause is prerenal, intrarenal or postrenal."
    src: { page: 412, quote: "The diagnostic schema for AKI in the patient with cancer is the same as that for other patient groups" }
    status: unverified
  - id: neph.L12.018
    kind: card
    topic: aki
    front: Which category of AKI is especially common in cancer, and why does early detection matter?
    back: Prerenal AKI; if detected early it can be reversed.
    src: { page: 412, quote: "Prerenal etiologies are especially common and if early detected could be reversed." }
    status: unverified
    tags: [high-yield]
  - id: neph.L12.019
    kind: enumerate
    topic: aki
    prompt: Prerenal causes of AKI in hematological and solid organ cancers?
    points:
      - Poor oral intake from chemotherapy-induced anorexia, emesis and diarrhea
      - Sepsis with renal hypoperfusion
      - Coexistent cirrhosis or heart failure
      - Hypercalcemia
      - Medications (ACE inhibitors, ARBs, NSAIDs, diuretics)
    pass: 4
    src: { page: 413, quote: "Poor oral intake owing to chemotherapy-induced anorexia, emesis and diarrhea Sepsis with renal hypoperfusion" }
    status: unverified
  - id: neph.L12.020
    kind: table
    topic: aki
    title: Prerenal AKI in cancer versus stem cell transplantation
    columns: [Cause, Solid and hematological cancers, Stem cell transplantation]
    rows:
      - ["Poor oral intake (anorexia, emesis, diarrhea)", "Yes", "Yes"]
      - [Sepsis with renal hypoperfusion, "Yes", "Yes"]
      - [Liver or heart, "Cirrhosis or heart failure", "Veno-occlusive disease or heart failure"]
      - [Hypercalcemia, "Yes", "Not listed"]
      - [Medications, "ACEi, ARB, NSAIDs, diuretics", "Same plus calcineurin inhibitors"]
      - [Cytokine release syndrome, "Not listed", "Yes"]
      - [Early veno-occlusive disease, "Not listed", "Yes"]
    blanks: [[2, 2], [3, 1], [4, 2], [5, 2]]
    src: { page: 413, quote: "Stem Cell Transplantation Medications (ACE inhibitors, angiotensin-receptor blockers, NSAIDs, diuretics, calcineurin inhibitors) Cytokine release syndrome Early veno-occlusive disease" }
    status: unverified
  - id: neph.L12.021
    kind: card
    topic: aki
    front: Which prerenal AKI causes appear after stem cell transplantation but not in the cancer column?
    back: Calcineurin inhibitors, cytokine release syndrome and early veno-occlusive disease.
    src: { page: 413, quote: "Cytokine release syndrome Early veno-occlusive disease" }
    status: unverified
  # ---------- p413-416: TLS ----------
  - id: neph.L12.022
    kind: card
    topic: tls
    front: Define tumor lysis syndrome.
    back: An emergency in which tumor cells break down, spontaneously or with treatment, releasing intracellular contents into the circulation.
    src: { page: 413, quote: "It is an emergency condition in which breakdown of tumor cells, either spontaneously or in response to treatment, releases intracellular contents into the circulation" }
    status: unverified
    tags: [high-yield]
  - id: neph.L12.023
    kind: enumerate
    topic: tls
    prompt: Metabolic results of tumor lysis syndrome?
    points:
      - Hyperuricemia
      - Hyperkalemia
      - Hyperphosphatemia
      - Secondary hypocalcemia
      - Metabolic acidosis
      - AKI
    pass: 5
    src: { page: 413, quote: "resulting in hyperuricemia, hyperkalemia, hyperphosphatemia, secondary hypocalcemia, metabolic acidosis, and AKI." }
    status: unverified
    tags: [high-yield]
  - id: neph.L12.024
    kind: card
    topic: tls
    front: Besides the metabolic changes, TLS may be associated with which two clinical events?
    back: Cardiac arrhythmias and seizures.
    src: { page: 413, quote: "TLS may also be associated with cardiac arrhythmias and seizures." }
    status: unverified
  - id: neph.L12.025
    kind: card
    topic: tls
    front: Which malignancies most commonly cause TLS?
    back: "Those with large tumor burden and rapid growth: non-Hodgkin lymphoma, AML, ALL, Burkitt lymphoma, and solid cancers with large masses."
    src: { page: 413, quote: "such as non-Hodgkin lymphoma, acute myeloid leukemia, acute lymphocytic leukemia, Burkitt lymphoma, and solid organ cancers with large masses." }
    status: unverified
    tags: [high-yield]
  - id: neph.L12.026
    kind: cloze
    topic: tls
    text: "In-hospital mortality of TLS can reach {{c1::20%}}, and nearly {{c2::70%}} of patients have serious complications."
    src: { page: 413, quote: "The in-hospital mortality rate associated with TLS can be as high as 20%, and nearly 70% of patients experience serious complications" }
    status: unverified
    tags: [numbers]
  - id: neph.L12.027
    kind: enumerate
    topic: tls
    prompt: Serious complications of TLS listed by the lecture?
    points:
      - Sepsis
      - Need for acute dialysis
      - Acute respiratory failure
      - Need for mechanical ventilation
      - Cardiac arrest
      - Seizures
    pass: 4
    src: { page: 413, quote: "sepsis, need for acute dialysis, acute respiratory failure, need for mechanical ventilation, cardiac arrest, or seizures" }
    status: unverified
  - id: neph.L12.028
    kind: card
    topic: tls
    front: Which criteria define TLS?
    back: The Cairo-Bishop criteria (2004).
    src: { page: 414, quote: "The definition of TLS has used the Cairo-Bishop criteria" }
    status: unverified
  - id: neph.L12.029
    kind: card
    topic: tls
    front: Why is the current TLS definition not sensitive or specific for spontaneous TLS?
    back: Patients with TLS may not have more than 2 laboratory abnormalities at the same time.
    src: { page: 414, quote: "Because patients with TLS may not have >2 laboratory manifestations present at the same time" }
    status: unverified
  - id: neph.L12.030
    kind: cloze
    topic: tls
    text: "Laboratory TLS needs {{c1::2 or more}} criteria within the same {{c2::24-hour}} period, from {{c3::3 days before to 7 days after}} starting chemotherapy."
    src: { page: 414, quote: "presence of 2 or more of the following criteria within the same 24-hour period from 3 days before to 7 days after chemotherapy initiation" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L12.031
    kind: table
    topic: tls
    title: Cairo-Bishop laboratory criteria for TLS
    columns: [Lab, Absolute value, Or change from baseline]
    rows:
      - [Uric acid, "≥8.0 mg/dL", "25% increase"]
      - [Potassium, "≥6.0 mEq/L", "25% increase"]
      - [Phosphorus, "≥4.5 mg/dL (≥6.5 mg/dL in children)", "25% increase"]
      - [Calcium, "≤7.0 mg/dL", "25% decrease"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [3, 2]]
    src: { page: 414, quote: "Calcium 25% decrease from baseline or ≤7.0 mg/dL" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L12.032
    kind: cloze
    topic: tls
    text: "Cairo-Bishop uric acid criterion: {{c1::≥8 mg/dL}} or a {{c2::25%}} increase from baseline."
    src: { page: 414, quote: "Hyperuricemia (>8 mg/dL or a 25% increase from baseline)," }
    status: unverified
    tags: [numbers]
  - id: neph.L12.033
    kind: cloze
    topic: tls
    text: "Cairo-Bishop phosphorus criterion: {{c1::≥4.5 mg/dL}} in adults, {{c2::≥6.5 mg/dL}} in children, or a 25% increase."
    src: { page: 414, quote: "Hyperphosphatemia (>4.5 mg/dL [6.5 mg/dL in children] or a 25% increase from baseline)," }
    status: unverified
    tags: [numbers]
  - id: neph.L12.034
    kind: card
    topic: tls
    front: How does Cairo-Bishop grade the severity of TLS?
    back: From grade 0 (asymptomatic) to grade 5 (death), by creatinine rise, type of arrhythmia and seizure severity.
    src: { page: 414, quote: "ranging from grade O (asymptomatic) to 5 (death), based on factors such as the extent of serum creatinine elevation" }
    status: unverified
  - id: neph.L12.035
    kind: card
    topic: tls
    front: Define clinical tumor lysis syndrome.
    back: "Laboratory TLS plus one or more of: seizure, creatinine >1.5 × the age-adjusted upper limit of normal, or cardiac arrhythmia or sudden death."
    src: { page: 415, quote: "Clinical tumor lysis syndrome is defined by the presence of laboratory tumor lysis syndrome plus one or more of the following" }
    status: unverified
    tags: [high-yield]
  - id: neph.L12.036
    kind: cloze
    topic: tls
    text: "In clinical TLS the creatinine criterion is creatinine greater than {{c1::1.5}} times the upper limit of normal of an {{c2::age-adjusted}} range."
    src: { page: 415, quote: "Creatinine greater than 1.5 times the upper limit of normal of an age-adjusted reference range" }
    status: unverified
    tags: [numbers]
  - id: neph.L12.037
    kind: card
    topic: tls
    front: How does released DNA raise uric acid in TLS?
    back: DNA releases purines (adenosine and guanosine) that xanthine oxidase converts to uric acid.
    src: { page: 415, quote: "increase in purines (adenosine and guanosine), which are converted to uric acid through the actions of xanthine oxidase" }
    status: unverified
  - id: neph.L12.038
    kind: card
    topic: tls
    front: Why does hypocalcemia happen in TLS?
    back: Released phosphate raises the calcium-phosphate product, so calcium phosphate precipitates (nephrocalcinosis) and serum calcium falls.
    src: { page: 415, quote: "The release of large amounts of phosphate increases the calcium-phosphate concentration product, leading to calcium-phosphate precipitation with nephrocalcinosis and hypocalcemia." }
    status: unverified
    tags: [high-yield]
  - id: neph.L12.039
    kind: enumerate
    topic: tls
    prompt: Mechanisms of AKI in tumor lysis syndrome?
    points:
      - Uric acid nephropathy
      - Cytokine release
      - Nephrocalcinosis
    pass: 3
    src: { page: 415, quote: "The mechanisms of AKI are due to uric acid nephropathy, cytokine release and nephrocalcinosis." }
    status: unverified
    tags: [high-yield]
  - id: neph.L12.040
    kind: table
    topic: tls
    title: Risk factors for TLS (Figure 5)
    columns: [Group, Risk factors]
    rows:
      - [Tumor - leukemia, "ALL with WBC >100,000; AML with WBC >50,000"]
      - [Tumor - lymphoma, "Burkitt, lymphoblastic, diffuse large B-cell lymphoma"]
      - [Tumor - other, "Large tumor burden; LDH >1500 IU; chemotherapy-responsive tumor; extensive bone marrow involvement"]
      - [Patient, "Older age; reduced GFR; dehydration or volume depletion; baseline hyperuricemia; splenomegaly; CNS or renal involvement by tumor; mediastinal mass"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 415, quote: "Risk Factors for Tumor Lysis Syndrome (TLS). BM indicates bone marrow; CNS, central nervous system; GFR, glomerular filtration rate; LDH, lactate dehydrogenase" }
    status: unverified
    tags: [numbers]
  - id: neph.L12.041
    kind: cloze
    topic: tls
    text: "TLS tumor risk thresholds (Figure 5): ALL with WBC above {{c1::100,000}}, AML with WBC above {{c2::50,000}}, LDH above {{c3::1500 IU}}."
    src: { page: 415, quote: "Risk Factors for Tumor Lysis Syndrome (TLS)." }
    status: unverified
    tags: [numbers]
  - id: neph.L12.042
    kind: card
    topic: tls
    front: How is a patient at low risk of TLS managed?
    back: Oral hydration and avoidance of other nephrotoxic agents.
    src: { page: 416, quote: "Those patients considered at low risk for TLS should be treated with oral hydration and avoidance of other nephrotoxic agents." }
    status: unverified
  - id: neph.L12.043
    kind: cloze
    topic: tls
    text: "Higher-risk TLS: IV 0.9% saline or, preferably, a {{c1::balanced isotonic crystalloid}} at {{c2::1-2 mL/kg/hour}}, started {{c3::24 to 48 hours}} before therapy."
    src: { page: 416, quote: "a balanced isotonic crystalloid solution (1-2 mL/kg/hour) should be administered to maintain adequate hydration status and GFR." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L12.044
    kind: card
    topic: tls
    front: Why does hydration help in TLS?
    back: It maintains tubular flow, which clears and dilutes uric acid and clears potassium and phosphate.
    src: { page: 416, quote: "Hydration will also maintain tubular flow rates that facilitate clearance and dilution of uric acid as well as the clearance of potassium and phosphate." }
    status: unverified
  - id: neph.L12.045
    kind: card
    topic: tls
    front: Which drug class do high-risk TLS patients receive, and why?
    back: A xanthine oxidase inhibitor (allopurinol or febuxostat), to blunt new uric acid formation.
    src: { page: 416, quote: "patients at high risk for TLS should receive a xanthine oxidase inhibitor (allopurinol or febuxostat) to blunt de novo formation of uric acid." }
    status: unverified
    tags: [high-yield]
  - id: neph.L12.046
    kind: card
    topic: tls
    front: Is urinary alkalinization recommended in TLS? Why?
    back: No. It raises uric acid solubility but increases calcium-phosphate precipitation and symptomatic hypocalcemia.
    src: { page: 416, quote: "Urinary alkalinization, which increases the solubility of uric acid in the renal tubules, is not recommended" }
    status: unverified
    tags: [high-yield]
    update:
      text: "Rasburicase (recombinant urate oxidase) is used for high-risk TLS or established hyperuricemia in current practice (contraindicated in G6PD deficiency); the book lists only xanthine oxidase inhibitors."
      ref: "ASCO/ASH-endorsed Cairo et al. TLS recommendations 2010; NCCN supportive care 2024"
  - id: neph.L12.047
    kind: card
    topic: tls
    front: When is emergent hemodialysis needed in TLS?
    back: Established AKI, especially if oliguric or anuric; it corrects the electrolyte disorders quickly and safely.
    src: { page: 416, quote: "For patients presenting with established AKI, especially if they are oliguric or anuric, emergent hemodialysis may be required" }
    status: unverified
  - id: neph.L12.048
    kind: cloze
    topic: tls
    text: "Serum uric acid falls by about {{c1::50%}} with each {{c2::6-hour}} hemodialysis treatment."
    src: { page: 416, quote: "serum uric acid levels fall by approximately 50% with each 6-hour treatment." }
    status: unverified
    tags: [numbers]
  - id: neph.L12.049
    kind: card
    topic: tls
    front: Advantage of continuous renal replacement therapy in TLS?
    back: It avoids the risk of rebound metabolic disturbances.
    src: { page: 416, quote: "Continuous renal replacement may be particularly effective, avoids the risks of rebound metabolic disturbances." }
    status: unverified
  - id: neph.L12.050
    kind: order
    topic: tls
    prompt: Order the TLS prevention and treatment steps as the lecture escalates them.
    steps:
      - "Low risk: oral hydration, avoid nephrotoxins"
      - "Higher risk: IV balanced crystalloid 1-2 mL/kg/h from 24-48 h before therapy"
      - "High risk: add a xanthine oxidase inhibitor"
      - "Correct electrolyte disorders rapidly"
      - "Established oliguric AKI: emergent hemodialysis or CRRT"
    src: { page: 416, quote: "Electrolyte disorders should be identified and corrected rapidly according to standard protocols)." }
    status: unverified
  - id: neph.L12.051
    kind: mcq
    topic: tls
    stem: A 24-year-old man with Burkitt lymphoma starts chemotherapy. On day 2 uric acid is 11 mg/dL, K 6.4 mEq/L, phosphate 7 mg/dL and calcium 6.8 mg/dL. Creatinine is normal and he feels well. What does he have?
    options:
      - Laboratory tumor lysis syndrome
      - Clinical tumor lysis syndrome
      - No TLS, because creatinine is normal
      - No TLS, because labs must be abnormal before chemotherapy
      - Hypercalcemia of malignancy
    answer: 0
    why:
      - "Correct: 2 or more Cairo-Bishop lab criteria within 3 days before to 7 days after chemotherapy (p414)."
      - Clinical TLS needs laboratory TLS plus seizure, creatinine >1.5 × ULN or arrhythmia (p415).
      - Creatinine is not one of the laboratory criteria.
      - The window runs from 3 days before to 7 days after starting chemotherapy.
      - His calcium is low, not high.
    src: { page: 414, quote: "Tumor lysis syndrome diagnosis requires the presence of 2 or more of the following criteria within the same 24-hour period" }
    status: unverified
  - id: neph.L12.052
    kind: mcq
    topic: tls
    stem: A man with bulky diffuse large B-cell lymphoma and LDH 2100 IU is about to start chemotherapy. A resident suggests sodium bicarbonate infusion to alkalinize his urine. What is the best reply?
    options:
      - "Avoid it: alkalinization favors calcium-phosphate precipitation and hypocalcemia"
      - "Give it: it is the main way to prevent uric acid nephropathy"
      - "Give it only if uric acid exceeds 15 mg/dL"
      - "Give it instead of IV fluids"
      - "Give it with allopurinol in every patient"
    answer: 0
    why:
      - "Correct: the lecture does not recommend alkalinization for this reason (p416)."
      - The main measures are hydration and a xanthine oxidase inhibitor.
      - The lecture gives no threshold that allows it.
      - Hydration is the core of prevention and cannot be replaced.
      - Alkalinization is not recommended at all.
    src: { page: 416, quote: "it can increase the likelihood of calcium-phosphate precipitation and symptomatic hypocalcemia." }
    status: unverified
  - id: neph.L12.053
    kind: mcq
    topic: tls
    stem: "Which patient is at the highest risk of TLS?"
    options:
      - ALL with WBC 150,000 and LDH 1800 IU
      - Early breast cancer before surgery
      - CML in chronic phase on oral therapy
      - Localized prostate cancer
      - Small renal cell carcinoma
    answer: 0
    why:
      - "Correct: ALL with WBC >100,000 and LDH >1500 IU are both tumor-related risk factors (Figure 5, p415)."
      - Small, slowly growing tumor burden.
      - Not a rapidly lysing, chemotherapy-responsive bulky tumor.
      - Low burden and slow growth.
      - A small solid mass, not a large tumor burden.
    src: { page: 415, quote: "Risk Factors for Tumor Lysis Syndrome (TLS)." }
    status: unverified
  - id: neph.L12.054
    kind: mcq
    topic: tls
