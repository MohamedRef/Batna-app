  # ------------------------------------------------------------------
  - id: dm.L18.lesson1
    title: "الـ uric acid: بيتعمل كتير ولا بيخرج قليل؟"
    hook: "كل أسباب الـ hyperuricemia بتتقسم لسؤال واحد: المصنع شغال زيادة، ولا الكلية مش بتصرّف؟"
    minutes: 8
    pages: [233, 234]
    topics: [definition, causes]
    goals:
      - "تعرّف الـ gout بالأربع entities (سؤال كتاب)"
      - "تحفظ أرقام الـ hyperuricemia"
      - "تقسّم أسباب الـ chronic hyperuricemia (سؤال كتاب)"
    status: unverified
    steps:
      - kind: explain
        page: 233
        title: "يعني إيه gout؟"
        quote: "A term representing a heterogeneous group of congenital and acquired disorders characterized by chronic hyperuricemia"
        text: |
          الـ ==gout== مش مرض واحد، ده **heterogeneous group of congenital and acquired disorders** فيها **chronic hyperuricemia** والـ urates بتترسب في الأنسجة. بيظهر بواحدة أو أكتر من:
          1. **Acute inflammatory arthritis**
          2. **Tophi** (urate crystal aggregates)
          3. **Urate interstitial nephropathy**
          4. **Uric acid urolithiasis**
      - kind: mnemonic
        page: 233
        quote: "Acute inflammatory arthritis 2. Urate Crystal aggregates called TOPHI 3. Urate interstitial nephropathy 4. Uric acid urolithiasis"
        word: "ATNS"
        parts:
          - { key: "A", text: "Acute inflammatory Arthritis" }
          - { key: "T", text: "Tophi" }
          - { key: "N", text: "Nephropathy (urate interstitial)" }
          - { key: "S", text: "Stones (uric acid urolithiasis)" }
        hook: "**ATNS**: «أتنس» من الوجع. مفصل، tophi، كلية، حصوة."
      - kind: explain
        page: 233
        title: "الأرقام"
        quote: "It is defined as plasma uric acid >7mg/dl in males and > 6 mg /dl in females"
        text: |
          ==Hyperuricemia== هي الـ **hallmark of gout**:
          - **Males: > 7 mg/dl**
          - **Females: > 6 mg/dl**

          والـ uric acid هو **end product of purine metabolism**. وأغلب الحالات **idiopathic**.
      - kind: check
        page: 233
        quote: "It is defined as plasma uric acid >7mg/dl in males and > 6 mg /dl in females"
        question: "Hyperuricemia in a woman is plasma uric acid above:"
        options:
          - "6 mg/dl"
          - "7 mg/dl"
          - "5 mg/dl"
          - "8 mg/dl"
        answer: 0
        why:
          - "صح: الستات > 6، الرجالة > 7."
          - "ده رقم الرجالة."
          - "مش في الكتاب."
          - "مش في الكتاب."
      - kind: figure
        page: 234
        quote: "Idiopathic: including increased urate production or decreased urinary clearance or both"
        title: "حوض مية: الحنفية والبالوعة"
        alt: "A tank of uric acid with a tap above labelled increased production (enzyme defects, nucleic acid turnover) and a drain below labelled decreased renal excretion (renal disease, lead, tubular causes); the water level marks 7 mg/dl in men and 6 in women."
        caption: "الـ uric acid زي حوض مية: يا **الحنفية** فاتحة زيادة (**increased production**)، يا **البالوعة** مسدودة (**decreased renal excretion**). والـ idiopathic ممكن يبقى الاتنين."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L18a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="fg-head-bad"/></marker></defs>
            <rect x="10" y="8" width="310" height="70" rx="10" class="fg-bad"/>
            <text x="165" y="28" text-anchor="middle" class="t-b t-bad">Increased production</text>
            <text x="165" y="48" text-anchor="middle" class="t-sm">Enzymes: HGPRT, PRPP synthetase, G6Pase</text>
            <text x="165" y="66" text-anchor="middle" class="t-sm">Turnover: hemolysis, leukemia, lymphoma, psoriasis</text>
            <path d="M165 80 L165 110" class="fg-arrow-bad" marker-end="url(#L18a)"/>
            <rect x="85" y="115" width="160" height="110" rx="6" class="fg-ink"/>
            <rect x="87" y="150" width="156" height="73" class="fg-acc"/>
            <path d="M80 150 H250" class="fg-thin"/>
            <text x="255" y="146" class="t-sm t-b">♂ 7</text>
            <text x="255" y="162" class="t-sm t-b">♀ 6</text>
            <text x="165" y="195" text-anchor="middle" class="t-b t-acc">Uric acid</text>
            <path d="M165 227 L165 250" class="fg-arrow-bad" marker-end="url(#L18a)"/>
            <rect x="10" y="252" width="310" height="70" rx="10" class="fg-box"/>
            <text x="165" y="272" text-anchor="middle" class="t-b">Decreased renal excretion</text>
            <text x="165" y="292" text-anchor="middle" class="t-sm">Renal disease, chronic lead poisoning</text>
            <text x="165" y="310" text-anchor="middle" class="t-sm">Tubular: drugs, acidosis, nephrogenic DI, MetS</text>
          </svg>
      - kind: explain
        page: 234
        title: "Increased production"
        quote: "Congenital Enzyme Defects: a- HGPRT deficiency b- PRP synthase defects c- Glucose 6-phosphatase deficiency"
        text: |
          **1. Congenital enzyme defects:**
          - ==HGPRT deficiency== (لو كامل = Lesch-Nyhan)
          - **PRPP synthetase** defects
          - **Glucose-6-phosphatase** deficiency

          **2. Increased nucleic acid turnover** (خلايا كتير بتموت ← purines كتير):
          - **RBCs:** chemical hemolysis، polycythemia
          - **WBCs:** leukemia · **Lymphocytes:** lymphomas
          - **Cytotoxic drugs**، disseminated cancer، **extensive psoriasis**
      - kind: explain
        page: 234
        title: "Decreased renal excretion"
        quote: "Drugs: salicylates, L-dopa, Thiazides"
        text: |
          1. **Intrinsic renal disease**
          2. **Renal toxins**: chronic **lead poisoning**
          3. **Impaired tubular excretion:**
             - **Drugs:** ==salicylates, L-dopa, thiazides==
             - **Metabolic acidosis:** alcohol، salicylate intoxication، DKA، lactic acidosis
             - **Nephrogenic DI** (vasopressin resistant)
             - **Metabolic syndrome**
      - kind: reveal
        page: 234
        quote: "Metabolic acidosis: alcohol& salicylate intoxication, diabetic& lactic acidosis"
        prompt: "ليه الـ lactic acidosis والـ ketoacidosis بيرفعوا الـ uric acid؟"
        answer: |
          الكلية بتطلّع الـ urate من خلال **organic anion transporters** في الـ proximal tubule. الـ lactate والـ ketones كمان **organic anions** وبيتنافسوا معاه على نفس الطريق، فالـ urate بيتحجز.

          علشان كده الكتاب حاططهم تحت ==impaired tubular excretion==. (التفسير فسيولوجي، القائمة من الكتاب.)
      - kind: sort
        page: 234
        quote: "Increased nucleic acid turnover: 1. RBCs; chemical hemolysis, polycythemia 2. WBCs; leukemia 3. Lymphocytes; lymphomas"
        prompt: "صنّف كل سبب: بيزوّد الـ production ولا بيقلل الـ excretion؟"
        bins: ["Increased production", "Decreased excretion"]
        cards:
          - { text: "HGPRT deficiency", bin: 0 }
          - { text: "Polycythemia", bin: 0 }
          - { text: "Extensive psoriasis", bin: 0 }
          - { text: "Cytotoxic drugs", bin: 0 }
          - { text: "Thiazides", bin: 1 }
          - { text: "Lead poisoning", bin: 1 }
          - { text: "Lactic acidosis", bin: 1 }
          - { text: "Nephrogenic DI", bin: 1 }
        why: "الـ production: enzyme defects أو خلايا بتتكسر كتير (polycythemia، psoriasis، cytotoxics). الـ excretion: الكلية نفسها (lead) أو الـ tubules (thiazides، acidosis، nephrogenic DI)."
      - kind: aside
        tone: joke
        page: 234
        quote: "Drugs: salicylates, L-dopa, Thiazides"
        text: "عيان ضغط بياخد **thiazide**، وبياخد **aspirin**، وبيحب الفتة في العزومات... ده مش مريض، ده **مشروع gout** متكامل 😅"
      - kind: try
        items: [dm.L18.001, dm.L18.003, dm.L18.007, dm.L18.010, dm.L18.093]
    recap:
      - "Gout = chronic hyperuricemia + urate deposition: arthritis، tophi، nephropathy، stones (ATNS)."
      - "Hyperuricemia: > 7 mg/dl رجالة، > 6 ستات. أغلبها idiopathic."
      - "Production ↑: HGPRT، PRPP، G6Pase؛ hemolysis، polycythemia، leukemia، lymphoma، cytotoxics، cancer، psoriasis."
      - "Excretion ↓: renal disease، lead؛ salicylates، L-dopa، thiazides، acidosis، nephrogenic DI، MetS."
    practice: [dm.L18.001, dm.L18.002, dm.L18.003, dm.L18.004, dm.L18.005, dm.L18.006, dm.L18.007, dm.L18.008, dm.L18.009, dm.L18.010, dm.L18.011, dm.L18.012, dm.L18.013, dm.L18.092, dm.L18.093]
