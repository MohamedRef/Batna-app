  # Split from lesson1 on 2026-11-13 (#828): MSUS in RA and spondyloarthritis.
  - id: rheum.L13.lesson4
    title: "السونار في الـ RA والـ SpA"
    hook: "ست إيدها بتوجعها من شهرين والتحاليل سلبية والأشعة سليمة. وراجل كعبه بيوجعه وصباع رجله منفوخ. السونار هيقول الحقيقة للاتنين."
    minutes: 8
    pages: [212, 213]
    topics: [ra, spa]
    goals:
      - "تعرف علامات الـ RA في السونار وليه بتسبق الـ serology"
      - "تعرف شكل الـ enthesis المريض في الـ SpA"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L13.008]
        page: 212
        quote: "These features are especially helpful in diagnosing early RA, often before serologic markers appear or radiographic erosions develop."
        title: "الـ MSUS في الـ RA"
        text: |
          بيشوف ==grey-scale (GS)== و ==power Doppler (PD)==:

          - **Synovial hypertrophy** (GS).
          - **Joint effusion**.
          - **PD activity** = synovium فيه أوعية (vascularized).
          - **Erosions**.

          وده مفيد في الـ **early rheumatoid arthritis (RA)**، غالبًا قبل ما الـ serology تطلع أو الـ erosions تبان في الـ X-ray.

          ليه الـ PD مهم مع الـ GS؟ لأن الـ GS بيوريك إن الـ synovium متضخم، والـ PD بيوريك إنه لسه شغال وفيه دم زيادة، يعني التهاب نشط مش أثر قديم.
      - kind: figure
        page: 212
        quote: "Ultrasound Findings in RA\n  Synovial hypertrophy (GS).\n  Joint effusion.\n  Power Doppler activity (vascularized synovium).\n  Erosions."
        title: "مفصل RA في السونار"
        alt: "A schematic finger joint seen on ultrasound. Two bone ends with a joint space. A thick grey band of synovial hypertrophy fills the joint recess, a dark area of effusion beside it, red dots of power Doppler signal inside the synovium, and a notch in one bone surface marked erosion."
        caption: "أربع حاجات: ==synovial hypertrophy== (رمادي)، **effusion** (أسود)، **PD** (نقط حمرا = أوعية)، و **erosion** (حفرة في العضم)."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 150 L140 150 Q150 150 152 140 L152 120" class="fg-ink" stroke-width="3"/>
            <path d="M320 150 L190 150 Q180 150 178 140 L178 120" class="fg-ink" stroke-width="3"/>
            <path d="M60 150 Q65 140 70 150" class="fg-arrow-bad" stroke-width="3"/>
            <text x="65" y="172" text-anchor="middle" class="t-sm t-bad">erosion</text>
            <path d="M100 118 Q165 40 230 118 Z" class="fg-acc"/>
            <text x="165" y="70" text-anchor="middle" class="t-sm t-b">synovial hypertrophy (GS)</text>
            <ellipse cx="165" cy="108" rx="14" ry="8" class="fg-ink"/>
            <text x="250" y="110" class="t-sm">effusion</text>
            <circle cx="135" cy="92" r="4" class="fg-dot-bad"/>
            <circle cx="150" cy="82" r="4" class="fg-dot-bad"/>
            <circle cx="190" cy="88" r="4" class="fg-dot-bad"/>
            <circle cx="205" cy="98" r="4" class="fg-dot-bad"/>
            <text x="165" y="30" text-anchor="middle" class="t-sm t-bad">PD signal = vascularized synovium</text>
            <text x="75" y="140" class="t-sm t-mut">bone</text>
            <text x="235" y="140" class="t-sm t-mut">bone</text>
          </svg>
      - kind: reveal
        page: 212
        quote: "These features are especially helpful in diagnosing early RA, often before serologic markers appear or radiographic erosions develop."
        prompt: "ليه السونار ممكن يشخّص RA قبل ما الـ RF والـ anti-CCP يطلعوا، وقبل الـ erosions في الأشعة؟"
        answer: |
          الكتاب بيقول كده: ==before serologic markers appear or radiographic erosions develop==.

          التفسير المقبول (مش في الكتاب): السونار بيشوف **المرض نفسه** وهو بيحصل: synovium متضخم ودم زيادة فيه. الـ serology علامة غير مباشرة ممكن تتأخر أو ما تطلعش أصلًا (seronegative RA)، والـ erosion في الأشعة **نتيجة** متأخرة بعد شهور من الالتهاب. فاللي بيشوف السبب بيسبق اللي بيشوف الأثر.
      - kind: check
        page: 212
        quote: "These features are especially helpful in diagnosing early RA, often before serologic markers appear or radiographic erosions develop."
        question: "A 35-year-old woman has 8 weeks of hand pain; RF and anti-CCP are negative and X-rays are normal. Which MSUS finding would most support early RA?"
        options:
          - "Synovial hypertrophy with power Doppler signal"
          - "Double contour sign over the cartilage"
          - "Halo sign around the artery"
          - "Chondrocalcinosis in the cartilage"
        answer: 0
        why:
          - "صح: GS synovial hypertrophy مع PD، وغالبًا قبل الـ serology والـ erosions."
          - "دي علامة الـ gout."
          - "دي علامة الـ giant cell arteritis."
          - "دي علامة الـ CPPD."
      - kind: explain
        remind: [rheum.L13.012]
        page: 213
        quote: "Entheseal abnormalities include:\n  Thickening.\n  Hypoechogenicity.\n  Calcification.\n  Erosions.\n  Doppler signal at the enthesis."
        title: "الـ MSUS في الـ SpA"
        text: |
          بيلاقي ==enthesitis== (التهاب مكان دخول الوتر أو الرباط في العضمة)، peripheral arthritis، dactylitis، و tenosynovitis.

          شكل الـ enthesis المريض:

          - Thickening.
          - Hypoechogenicity.
          - Calcification.
          - Erosions.
          - Doppler signal at the enthesis.

          وبيلقط الـ **subclinical enthesitis** ويتابع الاستجابة للـ biologics.

          ليه الـ calcification والـ erosion؟ التفسير المقبول (مش في الكتاب): الالتهاب المتكرر عند نقطة دخول الوتر بياكل العضم الأول (erosion)، وبعدين الجسم بيحاول يصلّح فبيرسّب عضم جديد (calcification).
      - kind: reveal
        page: 213
        quote: "Enthesitis: Inflammation at tendon or ligament insertions.\n  Peripheral arthritis and dactylitis.\n  Tenosynovitis."
        prompt: "ليه الـ enthesis بالذات هو المكان اللي بندوّر فيه في الـ SpA، مش الـ synovium زي الـ RA؟"
        answer: |
          الكتاب بيعرّف الـ ==enthesitis==: **inflammation at tendon or ligament insertions**، وده أول حاجة الـ MSUS بيدوّر عليها في الـ SpA.

          التفسير المقبول (مش في الكتاب): الـ spondyloarthritis مرض بيبدأ عند المكان اللي الوتر بيدخل فيه العضم، المكان اللي عليه شد ميكانيكي كبير، مش في بطانة المفصل زي الـ RA. علشان كده الكعب (Achilles) والـ plantar fascia والضهر، وعلشان كده الكتاب بيقول السونار بيلقط **subclinical enthesitis**: المريض لسه ما حسّش بيها.
      - kind: check
        page: 213
        quote: "MSUS is increasingly used in SpA assessment due to its ability to detect subclinical enthesitis and monitor response to biologic therapy."
        question: "Which of the following is a typical MSUS finding in spondyloarthritis?"
        options:
          - "Enthesitis with Doppler signal"
          - "Perifascicular atrophy"
          - "Erosions with power Doppler in the MCP joints"
          - "Subcutaneous calcification"
        answer: 0
        why:
          - "صح: الـ enthesitis مع Doppler at the enthesis من الـ entheseal abnormalities في الكتاب."
          - "دي biopsy finding في الـ dermatomyositis، مش سونار."
          - "دي أقرب لصورة الـ RA."
          - "مش من قايمة الكتاب للـ SpA."
      - kind: case
        page: 213
        quote: "Entheseal abnormalities include:\n  Thickening.\n  Hypoechogenicity.\n  Calcification.\n  Erosions.\n  Doppler signal at the enthesis."
        stem: "A 30-year-old man with psoriasis has heel pain and a swollen 'sausage' toe. X-rays are normal."
        steps:
          - question: "Which imaging is most sensitive for early enthesitis?"
            options: ["MSUS", "Plain X-ray", "CT", "Capillaroscopy"]
            answer: 0
            why: "إجابة الكتاب: MSUS sensitive و preferred للـ early inflammation عند الـ enthesis."
          - reveal: "Achilles insertion: thick, hypoechoic, with Doppler signal at the enthesis."
            question: "What does this show?"
            options: ["Active enthesitis", "Gouty tophus", "Halo sign", "Normal tendon"]
            answer: 0
            why: "Thickening و hypoechogenicity و Doppler at the enthesis = entheseal abnormalities."
          - reveal: "He starts a biologic. Three months later the Doppler signal has gone."
            question: "What does this mean?"
            options: ["Response to treatment (towards remission)", "Disease progression", "Scan is unreliable", "Calcification"]
            answer: 0
            why: "الـ PD اللي بيقل = remission، والـ MSUS بيتابع الـ response للـ biologic (ص 213–214)."
      - kind: check
        page: 213
        quote: "MSUS is increasingly used in SpA assessment due to its ability to detect subclinical enthesitis and monitor response to biologic therapy."
        question: "Which imaging is most sensitive for early enthesitis (book answer)?"
        options: ["MSUS", "X-ray", "MRI", "CT"]
        answer: 0
        why:
          - "صح: إجابة الكتاب، sensitive و preferred للـ enthesis."
          - "الـ X-ray مش بيشوف الالتهاب البدري."
          - "مش إجابة الكتاب في السؤال ده."
          - "مش بيشوف الالتهاب البدري."
      - kind: try
        items: [rheum.L13.008, rheum.L13.009, rheum.L13.011, rheum.L13.012, rheum.L13.045]
    recap:
      - "RA: synovial hypertrophy (GS)، effusion، PD (vascularized synovium)، erosions. بيسبق الـ serology والـ X-ray."
