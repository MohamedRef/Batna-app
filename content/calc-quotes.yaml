  # Hepatology (hb)
  - calculator: child_pugh
    lecture: hb.L01
    page: 14
    quote: |-
      Child-Pugh classification
        The Child-Pugh classification depends on 5 parameters: ascites, encephalopathy, serum albumin, bilirubin, and prothrombin time (Table 2) and gives a good short-term prognostic guide.
        The total score classifies patients into class A (5-6 points); Class B (7-9 points); Class C (10-15 points).
        One- and two-year survival rates for these classes are 100% and 85% (class A), 80% and 60% (class B), and 45% and 35% (class C).
      Table 2: Child-Pugh classification
      Points scored
      | Variable | 1 | 2 | 3 |
      |---|---|---|---|
      | Encephalopathy | None | Stage 1-2 | Stage 3-4 |
      | Ascites | Absent | Mild to moderate | Severe |
      | Bilirubin (mg/dL) | <2 | 2-3 | >3 |
      | Albumin (g/dL) | >3.5 | 2.8-3.5 | <2.8 |
      | Prothrombin time (seconds prolonged) | <4 | 4-6 | >6 |
