  - id: neph.L07.lesson4
    title: "أكياس تانية: ARPKD و NPHP و ADTKD و sponge"
    hook: "مش كل كلية فيها أكياس ADPKD. السن والـ family history ومكان الأكياس بيفرّقوا بينهم."
    minutes: 8
    pages: [165, 168]
    topics: [cystic-other]
    goals:
      - "تعرف ARPKD و nephronophthisis و ADTKD و medullary sponge kidney"
      - "تقرا Table 7.6 وتفرّق cortex من medulla"
    status: unverified
    steps:
      - kind: explain
        page: 165
        title: "ARPKD: مرض الأطفال"
        quote: "Caused by a rare mutation of the PKHD1 gene (located on chromosome 6) encoding polyductin."
        text: |
          الـ ==ARPKD==: جين **PKHD1** على **chromosome 6** بيعمل **polyductin**.

          بيظهر في **الرضّع والأطفال**: polycystic kidneys، CKD بيتقدم، و ==congenital hepatic fibrosis== مع **portal hypertension**. أندر بكتير من الـ ADPKD (حوالي **1:20,000**).
      - kind: explain
        page: 165
        title: "Nephronophthisis: الـ nephrons بتختفي"
        quote: "Imaging characteristically reveals echo-bright kidneys with a few corticomedullary cysts."
        text: |
          الاسم يوناني معناه **"ضياع الـ nephrons تدريجيًا"**. ==autosomal recessive== tubulointerstitial nephropathy، ومن أشهر أسباب الـ ESRD الوراثية في **الأطفال والمراهقين**.

          - **NPHP1** = 21% من الحالات (وبدري أكتر)؛ كل جين تاني أقل من 4%.
          - يبدأ بعد سنة من العمر، و ESRD في المراهقة.
          - Imaging: **echo-bright kidneys** مع **أكياس قليلة corticomedullary**.
          - Polyuria و polydipsia، بس غالبًا يظهر وهو ESRD.
      - kind: mnemonic
        page: 165
        quote: "May also be associated with retinitis pigmentosa in the Senior-Løken syndrome."
        word: "JOBS"
        parts:
          - { key: "J", text: "Joubert: cerebellar vermis hypoplasia, oculomotor apraxia" }
          - { key: "O", text: "Organ reversal: situs inversus" }
          - { key: "B", text: "Bones: cone-shaped epiphyses; plus liver fibrosis" }
          - { key: "S", text: "Senior-Løken: retinitis pigmentosa" }
        hook: "الـ NPHP عنده **JOBS** برّه الكلية، عكس الـ medullary cystic disease اللي مالوش extrarenal."
      - kind: explain
        page: 166
        title: "ADTKD (medullary cystic kidney disease)"
        quote: "Disease-causing mutations in four genes: MUC1, UMOD, REN, and HNF1B, are responsible for most cases."
        text: |
          **Autosomal dominant**، يبان في **أول الشباب** مع family history.

          - الجينات: **MUC1، UMOD، REN، HNF1B**؛ الـ ==UMOD = hyperuricemia== و gout.
          - أكياس صغيرة **1–10 mm** في الـ corticomedullary junction، مع scarring، والـ **glomeruli سليمة**.
          - Nocturia و polyuria، **dipstick نضيف**، والضغط غالبًا **طبيعي** (salt loss).
          - الكلى **صغيرة لطبيعية** على السونار.
          - ESRD حوالي **60 سنة** (MUC1 بعد 60، UMOD في العقد 4–7). مفيش علاج خاص؛ صلّح الملح والميه.
      - kind: explain
        page: 167
        title: "Medullary sponge kidney: مش وراثي"
        quote: "Impaired calcium handling in the collecting ducts predisposes to formation of calcium-containing stones (often in cysts)."
        text: |
          شائع و **benign**، و ==developmental مش genetic== (مفيش family history).

          الـ collecting ducts مش بتتعامل مع الـ calcium كويس، فتعمل **calcium stones** جوّه الأكياس. فكّر فيه في **شاب عنده calcium stones**. وكمان hematuria و UTI متكرر.

          التشخيص: **IVU** (الشكل الكلاسيكي ==calyceal brush== أو "paintbrush")، ودلوقتي **CT**. الـ renal impairment **نادر جدًا**.
      - kind: table
        page: 168
        quote: "Medullary sponge kidney Medullary cystic kidney disease"
        title: "Sponge ولا cystic؟"
        columns: [Feature, Sponge, Cystic (ADTKD)]
        rows:
          - ["Age", "Any", "20–30"]
          - ["CKD/ESRD", "No", "Yes, ESRD <60"]
          - ["Salt loss", "No", "Yes"]
          - ["Ca stones", "Yes", "No"]
          - ["Family history", "No", "Yes"]
        hide: [[1, 2], [3, 1], [4, 2]]
      - kind: figure
        page: 168
        quote: "Table 7.6 Classification of cystic kidney diseases"
        title: "الأكياس في الـ cortex ولا الـ medulla؟"
        alt: "Two columns of cystic kidney diseases. Cortex: ADPKD (any age, strong family history), juvenile PKD (under 10), simple cysts (over 65, no family history). Medulla: medullary sponge kidney (any age, no family history, no CKD), medullary cystic kidney (20-30, family history, CKD), nephronophthisis (under 15, CKD)."
        caption: "قسّم الأكياس **cortex** (ADPKD، juvenile، simple) و **medulla** (sponge، cystic، NPHP). والسن هو المفتاح التاني: **أقل من 10** و **أقل من 15** و **20–30** و **فوق 65**."
