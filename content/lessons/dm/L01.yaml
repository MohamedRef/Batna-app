      - kind: explain
        page: 13
        title: "الـ Prediabetes: مش مرض، بس جرس إنذار"
        quote: "IFG and IGT are not clinical entities but are risk factors for: 1- Cardiovascular /cerebrovascular diseases"
        text: |
          **Prediabetes** = metabolic stage ==بين الطبيعي والـ diabetes==: **Impaired fasting glucose (IFG) (100–125)** و/أو **impaired glucose tolerance (IGT) (140–199)**. اسمه كمان borderline، subclinical، early diabetes.

          الـ IFG والـ IGT **not clinical entities**، لكنهم risk factors لـ:
          1. **Cardiovascular / cerebrovascular disease**
          2. **diabetes** بعد كده (predictor)
          3. سكر في رينج الـ diabetes بيبان مع الـ **stress**

          ليه بنهتم بيه لو مش مرض؟ لأن نفس الـ insulin resistance اللي هتعمل السكر بعدين شغالة من دلوقتي على الشرايين، فالخطر على القلب بيبدأ قبل ما السكر يوصل لرقم الـ diabetes. ومع أي **stress** (عدوى، عملية) الـ β-cell التعبانة ما تقدرش تزوّد، فيبان سكر diabetic مؤقت.
