      - kind: explain
        page: 52
        quote: "c) 2ry Hyperparathyriodism (HPT) A) HPT is the result of hypocalcaemia which develops due to the following causes:\n  a) Reduced synthesis of 1,25(OH) D3 in CRD (The key role in pathogenesis of HPT as it is formed in the proximal renal tubules).\n  b) Hyperphosphatemia (it has a suppressive effect on the renal 1 a – hydroxylase).\n  c) A decrease in the number of calcitriol receptors in parathyroid in CRF. B) Since vit D also has an antiproliferative effect on parathyroid cells, this may provide an explanation for marked PTH secretion as well as the abnormal growth pattern characteristic of the nodular hypeparathyroidism."
        title: "الـ secondary HPT"
        text: |
          السبب الأساسي ==hypocalcaemia==، والغدة بتشتغل زيادة عشان ترفع الكالسيوم. الـ hypocalcaemia جاية من:
          1. **↓ 1,25(OH)2 D3**: ده الـ **key role**، لأنه بيتعمل في الـ **proximal renal tubules**، فلما الكلية تبوظ، المصنع نفسه يقفل، والأمعاء ما تمتصش كالسيوم.
          2. **Hyperphosphataemia**: الفوسفات بيتراكم لأن الكلية مش بتطلّعه، وهو **بيكبت الـ 1α-hydroxylase**، فيقلل الـ calcitriol أكتر.
          3. **↓ calcitriol receptors** في الـ parathyroid، فحتى الـ calcitriol القليل الموجود الغدة مش سامعاه.

          وكمان الـ vitamin D ==antiproliferative== على خلايا الـ parathyroid، يعني بيمنعها تتكاثر. لما يقل، الـ parathyroid hormone (PTH) يعلى جدًا والغدة تكبر بشكل ==nodular==.
