      - kind: explain
        page: 56
        quote: "Acute gout flare in a patient with CKD"
        title: "النقرس في الـ CKD"
        text: |
          **الحاد**: ==colchicine== 1.2 mg وبعده 0.6 mg بعد ساعة، أو **prednisone 30 mg** مع taper على 10–14 يوم، أو intra-articular لو مفاصل قليلة. لو فشل: anakinra أو canakinumab. **مش NSAIDs**.

          **المزمن**: ==XOI== أحسن من الـ uricosurics.

          - **Allopurinol**: ابدأ **50 mg** وزوّد بالراحة لحد 800 mg
          - قبله اعمل **HLA-B*5801 testing** للآسيويين والأفارقة
          - **Febuxostat**: 20–40 لحد 120
          - الهدف: ==SU < 6 mg/dL==
          - فشل؟ **pegloticase + methotrexate** لو الـ eGFR فوق 40
          - أو **pegloticase + mycophenolate** لو الـ eGFR تحت 40
      - kind: aside
        page: 57
        quote: "GOUT DIETARY AND LIFESTYLE GUIDELINES"
        tone: joke
        text: "الكبدة والكلاوي والممبار والبيرة والعصير المحلّى… قايمة عزومة العيد هي نفسها قايمة **ممنوعات النقرس**. 😅 والمسموح: خضار، بقوليات، ألبان قليلة الدسم، مية كتير."
      - kind: explain
        page: 58
        quote: "Recommend oral low-dose aspirin for prevention of recurrent ischemic cardiovascular disease events (i.e., secondary prevention)"
        title: "القلب والدهون"
        text: |
          - احسب **10-year CV risk** بأداة validated
          - **Mediterranean-style** diet مع العلاج
          - ==Aspirin== low-dose للـ **secondary prevention** بس (1C)
          - **LDL**: ==< 1.8 mmol/L (70 mg/dL)== في الـ high risk، وأقل من **1.4 mmol/L (55 mg/dL)** في الـ very high risk
          - Statin: كل CKD + diabetes من 18 سنة، وكل CKD فوق 50
