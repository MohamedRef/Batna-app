  # ---------- p249: Lp(a) ----------
  - id: dm.L19.037
    kind: card
    topic: lpa
    front: What is lipoprotein(a)?
    back: An LDL particle with an Apo(a) moiety covalently bound to its ApoB component.
    src: { page: 249, quote: "LDL particle with an Apo(a) moiety covalently bound to its ApoB component." }
    status: unverified
    tags: [high-yield]
  - id: dm.L19.038
    kind: card
    topic: lpa
    front: How does Lp(a) cause atherosclerosis like LDL does?
    back: It is under 70 nm, so it crosses the endothelium freely and can be retained in the arterial wall.
    src: { page: 249, quote: "It is <70 nm in diameter and can freely flux across the endothelial barrier" }
    status: unverified
  - id: dm.L19.039
    kind: card
    topic: lpa
    front: Why is Lp(a) pro-thrombotic?
    back: Its Apo(a) resembles plasminogen and binds the plasminogen receptor, increasing thrombosis.
    src: { page: 249, quote: "similar structure to plasminogen and binds to the plasminogen receptor, leading to increased thrombosis" }
    status: unverified
    tags: [high-yield]
