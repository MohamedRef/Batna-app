    topic: diuretics-uf
    text: "Ultrafiltration can cause three kinds of hemorrhage: from {{c1::venous return disconnection}}, from a {{c2::hollow fiber blood leak}}, and from {{c3::systemic anticoagulation}}."
    src: { page: 74, quote: "Hemorrhage from venous return disconnection Hemorrhage from hollow fiber blood leak Hemorrhage complicating systemic anticoagulation" }
    status: unverified
