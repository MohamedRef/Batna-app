  - id: res.L03.lesson3
    title: "من فكرة واسعة لسؤال FINER (1): F وI وN"
    hook: "\"صحة الستات\" مش سؤال بحث. هنضيّقها خطوة خطوة، وبعدين نعدّيها على خمس فلاتر."
    minutes: 8
    pages: [22, 35]
    topics: [narrowing, finer]
    goals:
      - "تضيّق topic of interest لحد ما يبقى focused research question"
      - "تحفظ FINER وتعرف كل حرف بيسأل عن إيه"
      - "تعرف الشروط الأخلاقية قبل أي تجربة على بني آدمين"
    status: unverified
    steps:
      - kind: explain
        page: 23
        quote: "Examples for research questions:\n  Topic of interest: Women's health\n  Narrowed topic: Women and cancer\n  Focused topic: Relationship between postmenopausal hormone replacement therapy and subsequent development of endometrial carcinoma\n  Focused research question: Does post-menopausal hormone replacement therapy predispose women to develop endometrial cancer?\nHow variables will be measured??"
        title: "القمع"
        text: |
          المحاضرة بتمشي في كل مثال بنفس السلم:

          - **Topic of interest:** Women's health
          - **Narrowed topic:** Women and cancer
          - **Focused topic:** post-menopausal hormone replacement therapy (HRT) and endometrial carcinoma
          - **Focused research question:** Does post-menopausal HRT predispose women to develop endometrial cancer

          وبعدها على طول: ==How variables will be measured==
      - kind: figure
        page: 23
        quote: "Examples for research questions:\n  Topic of interest: Women's health\n  Narrowed topic: Women and cancer\n  Focused topic: Relationship between postmenopausal hormone replacement therapy and subsequent development of endometrial carcinoma\n  Focused research question: Does post-menopausal hormone replacement therapy predispose women to develop endometrial cancer?\nHow variables will be measured??"
        title: "من الواسع للضيق"
