            <rect x="10" y="200" width="310" height="40" rx="8" class="fg-box"/>
            <text x="165" y="225" text-anchor="middle" class="t-sm">Drugs: TG and/or cholesterol up, HDL down</text>
          </svg>
      - kind: table
        page: 261
        quote: "II. Secondary hyperlipidemia\n| Causes | Main Lipid Abnormalities |\n|---|---|\n| Diabetes mellitus | ↑ TG & ↓ HDL |\n| Alcohol abuse | ↑ TG, ↑ HDL (in mild intake) |\n| Therapeutic i.e. iatrogenic (Diuretics, oral contraceptives, retinoids, corticosteroids, anabolic steroids, etc…) | ↑ TG &/or Cholesterol and ↓ HDL |\n| Hypothyroidism | ↑ Cholesterol |\n| Chronic Renal failure | ↑ TG |\n| Nephrotic syndrome | ↑ Cholesterol & ± ↑ TG |\n| Cholestasis | ↑ Cholesterol |\n| Bulimia | ↑ TG |\n| Anorexia nervosa | ↑ Cholesterol |\n| Pregnancy | ↑ TG |"
        title: "الـ secondary causes (جدول ص 261)"
        columns: [Cause, Main change]
        rows:
          - ["Diabetes", "↑ TG, ↓ HDL"]
          - ["Alcohol", "↑ TG (mild: ↑ HDL)"]
          - ["Drugs", "↑ TG/chol, ↓ HDL"]
          - ["Hypothyroidism", "↑ Chol"]
          - ["Chronic renal failure", "↑ TG"]
          - ["Nephrotic", "↑ Chol ± ↑ TG"]
          - ["Cholestasis", "↑ Chol"]
          - ["Bulimia", "↑ TG"]
          - ["Anorexia nervosa", "↑ Chol"]
          - ["Pregnancy", "↑ TG"]
        hide: [[0, 1], [3, 1], [4, 1], [7, 1], [8, 1]]
      - kind: explain
        remind: [dm.L21.009]
        page: 261
        title: "ليه كل سبب بيعلّي اللي بيعلّيه؟"
        quote: "II. Secondary hyperlipidemia\n| Causes | Main Lipid Abnormalities |\n|---|---|\n| Diabetes mellitus | ↑ TG & ↓ HDL |\n| Alcohol abuse | ↑ TG, ↑ HDL (in mild intake) |\n| Therapeutic i.e. iatrogenic (Diuretics, oral contraceptives, retinoids, corticosteroids, anabolic steroids, etc…) | ↑ TG &/or Cholesterol and ↓ HDL |\n| Hypothyroidism | ↑ Cholesterol |\n| Chronic Renal failure | ↑ TG |\n| Nephrotic syndrome | ↑ Cholesterol & ± ↑ TG |\n| Cholestasis | ↑ Cholesterol |\n| Bulimia | ↑ TG |\n| Anorexia nervosa | ↑ Cholesterol |\n| Pregnancy | ↑ TG |"
        text: |
          الجدول بيقول **إيه** بيعلى، ومش بيقول **ليه**. التفسير المقبول (مش في الكتاب):
          - **Hypothyroidism** ← cholesterol: الـ thyroid hormone بيشغّل الـ LDL receptors؛ لما يقل، الـ LDL يتشال أبطأ.
          - **Nephrotic syndrome** ← cholesterol (± TG): الكبد بيعوّض الـ albumin اللي بيضيع في البول، فبيصنّع بروتينات كتير ومعاها lipoproteins.
          - **Cholestasis** ← cholesterol: الكوليسترول بيخرج من الجسم في الـ bile؛ لما الـ bile يتسد، يرجع الدم.
          - **Diabetes mellitus** ← ==TG عالي و HDL واطي==: الـ insulin resistance بتبعت دهون حرة كتير للكبد فيعمل VLDL أكتر، والـ LPL بيضعف.
          - **Chronic renal failure** ← TG: تكسير الـ VLDL بيبطأ.
          - **Pregnancy** ← TG: الـ estrogen بيزوّد تصنيع الـ VLDL.
          - **Alcohol abuse** ← TG، و ↑ HDL مع الكمية القليلة: الكحول بيزوّد الـ VLDL في الكبد، وبيزوّد الـ ApoA-I كمان.
      - kind: aside
        tone: trap
        page: 261
        quote: "II. Secondary hyperlipidemia\n| Causes | Main Lipid Abnormalities |\n|---|---|\n| Diabetes mellitus | ↑ TG & ↓ HDL |\n| Alcohol abuse | ↑ TG, ↑ HDL (in mild intake) |\n| Therapeutic i.e. iatrogenic (Diuretics, oral contraceptives, retinoids, corticosteroids, anabolic steroids, etc…) | ↑ TG &/or Cholesterol and ↓ HDL |\n| Hypothyroidism | ↑ Cholesterol |\n| Chronic Renal failure | ↑ TG |\n| Nephrotic syndrome | ↑ Cholesterol & ± ↑ TG |\n| Cholestasis | ↑ Cholesterol |\n| Bulimia | ↑ TG |\n| Anorexia nervosa | ↑ Cholesterol |\n| Pregnancy | ↑ TG |"
        text: "فخ سؤال الكتاب: **Bulimia** ← **triglycerides (TG)**، و **Anorexia nervosa** ← **Cholesterol**. البوليميا بتاكل كتير (سكريات ← VLDL ← TG)، والأنوركسيا جعانة (cholesterol عالي)."
      - kind: sort
        page: 261
        quote: "II. Secondary hyperlipidemia\n| Causes | Main Lipid Abnormalities |\n|---|---|\n| Diabetes mellitus | ↑ TG & ↓ HDL |\n| Alcohol abuse | ↑ TG, ↑ HDL (in mild intake) |\n| Therapeutic i.e. iatrogenic (Diuretics, oral contraceptives, retinoids, corticosteroids, anabolic steroids, etc…) | ↑ TG &/or Cholesterol and ↓ HDL |\n| Hypothyroidism | ↑ Cholesterol |\n| Chronic Renal failure | ↑ TG |\n| Nephrotic syndrome | ↑ Cholesterol & ± ↑ TG |\n| Cholestasis | ↑ Cholesterol |\n| Bulimia | ↑ TG |\n| Anorexia nervosa | ↑ Cholesterol |\n| Pregnancy | ↑ TG |"
        prompt: "يعلّي الكوليسترول ولا الـ TG أساسًا؟"
        bins: ["Cholesterol", "TG"]
        cards:
          - { text: "Hypothyroidism", bin: 0 }
          - { text: "Cholestasis", bin: 0 }
          - { text: "Anorexia nervosa", bin: 0 }
          - { text: "Chronic renal failure", bin: 1 }
          - { text: "Bulimia", bin: 1 }
          - { text: "Pregnancy", bin: 1 }
          - { text: "Alcohol abuse", bin: 1 }
        why: "Cholesterol: hypothyroidism و cholestasis و anorexia (والـ nephrotic). TG: Chronic renal failure (CRF) و bulimia و pregnancy و alcohol (والـ diabetes mellitus (DM) مع high-density lipoprotein (HDL) واطي)."
      - kind: explain
        remind: [dm.L21.011]
        page: 261
        title: "الأدوية (iatrogenic)"
        quote: "Therapeutic i.e. iatrogenic (Diuretics, oral contraceptives, retinoids, corticosteroids, anabolic steroids, etc…)"
        text: |
          الكتاب بيسمّيها **therapeutic** يعني ==iatrogenic==: إحنا اللي عملناها بالعلاج.
          - **Diuretics**
          - **Oral contraceptives**
          - **Retinoids**
          - **Corticosteroids**
          - **Anabolic steroids**

          والنتيجة: ↑ **TG و/أو cholesterol**، و ↓ **HDL**.

          ليه؟ التفسير المقبول (مش في الكتاب): الـ thiazide diuretics والـ corticosteroids بيزوّدوا الـ insulin resistance، فنفس سلسلة السكر (VLDL أكتر). الـ estrogen في حبوب منع الحمل والـ retinoids بيزوّدوا تصنيع الـ VLDL في الكبد. والـ anabolic steroids بتشغّل الـ hepatic lipase، فالـ HDL يتكسّر أسرع (زي ما شفنا في محاضرة الـ HDL).
      - kind: check
        page: 261
        quote: "Chronic Renal failure"
        question: "Which secondary cause raises mainly triglycerides, according to the book's table?"
        options:
          - "Chronic renal failure"
          - "Hypothyroidism"
          - "Cholestasis"
          - "Anorexia nervosa"
        answer: 0
        why:
          - "صح: CRF ← ↑ TG، زي الـ bulimia والـ pregnancy."
          - "ده ↑ cholesterol (الـ LDL receptors بتقل)."
          - "ده ↑ cholesterol (الـ bile مسدود)."
          - "ده ↑ cholesterol؛ الـ bulimia هي اللي ↑ TG."
      - kind: explain
        page: 262
        title: "الجدول الكبير (ص 262)"
        quote: "Table 356-5: Secondary Forms of Hyperlipidemia\n  LDL Elevated\n    Hypothyroidism\n    Nephrotic syndrome\n    Cholestasis\n    Acute intermittent porphyria\n    Anorexia nervosa\n    Hepatoma\n    Drugs: thiazides, cyclosporin, tegretol\n  LDL Reduced\n    Severe liver disease\n    Malabsorption\n    Malnutrition\n    Gaucher's disease\n    Chronic infectious disease\n    Hyperthyroidism\n    Drugs: niacin toxicity\n  HDL Elevated\n    Alcohol\n    Exercise\n    Exposure to chlorinated hydrocarbons\n    Drugs: estrogen\n  HDL Reduced\n    Smoking\n    DM type 2\n    Obesity\n    Malnutrition\n    Gaucher's disease\n    Drugs: anabolic steroids, beta blockers\n  VLDL Elevated\n    Obesity\n    DM type 2\n    Glycogen storage disease\n    Hepatitis\n    Alcohol\n    Renal failure\n    Sepsis\n    Stress\n    Cushing's syndrome\n    Pregnancy\n    Acromegaly\n    Lipodystrophy\n    Drugs: estrogen, beta blockers, glucocorticoids, bile acid binding resins, retinoic acid\n  IDL Elevated\n    Multiple myeloma\n    Monoclonal gammopathy\n    Autoimmune disease\n    Hypothyroidism\n  Chylomicrons Elevated\n    Autoimmune disease\n    DM type 2\n  Lp(a) Elevated\n    Renal insufficiency\n    Inflammation\n    Menopause\n    Orchidectomy\n    Hypothyroidism\n    Acromegaly\n    Nephrosis\n    Drugs: growth hormone, isotretinoin"
        text: |
          الجدول ده بيقسم الـ secondary causes **حسب الـ lipoprotein**. أهم اللقطات، ومعاها التفسير المقبول (مش في الكتاب):
          - **IDL عالي**: ==multiple myeloma==، monoclonal gammopathy، autoimmune disease، hypothyroidism. الـ antibodies (أو الـ paraprotein) بتمسك في الـ lipoproteins وتعطّل تنضيفها.
          - **Lp(a) عالي**: renal insufficiency، inflammation، menopause، orchidectomy، hypothyroidism، acromegaly، nephrosis، growth hormone، isotretinoin. الكلية بتشارك في تنضيفه، والـ sex hormones بتوطّيه، فشيلهم (menopause، orchidectomy) يعلّيه.
          - **LDL واطي**: severe liver disease، malabsorption، malnutrition، hyperthyroidism. الكبد هو اللي بيصنع، والأكل هو الخام؛ والـ hyperthyroidism عكس الـ hypo: receptors أكتر.
          - **HDL واطي**: smoking، DM type 2، obesity، anabolic steroids، beta-blockers: نفس قايمة محاضرة الـ HDL تقريبًا.
      - kind: reveal
        page: 261
        quote: "Hypothyroidism"
        prompt: "ست عندها LDL عالي، وتعب وبرد وإمساك ووزنها زاد. قبل ما تكتب statin، تطلب إيه؟"
        answer: "**TSH**. الـ hypothyroidism في جدول الكتاب بيعلّي الـ cholesterol. التفسير المقبول (مش في الكتاب): علاجه بالـ thyroxine بيرجّع الـ LDL receptors تشتغل، فالدهون ممكن تتصلّح من غير statin. ده معنى \"دوّر على الـ secondary الأول\"."
