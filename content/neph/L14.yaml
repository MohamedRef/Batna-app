  - id: neph.L14.016
    kind: mcq
    topic: ln-classes
    stem: "A lupus biopsy shows endocapillary proliferation with subendothelial deposits in 60% of glomeruli; most involved glomeruli show segmental lesions. Which class?"
    options:
      - Class IV-S
      - Class IV-G
      - Class III
      - Class V
      - Class II
    answer: 0
    why:
      - "Correct: ≥50% of glomeruli = class IV; ≥50% of involved glomeruli segmental = IV-S (p449)."
      - IV-G needs ≥50% of involved glomeruli with global lesions.
      - Class III is <50% of glomeruli.
      - Class V is subepithelial (membranous) deposits.
      - Class II is mesangial only.
    src: { page: 449, quote: "Figure 3: Histopathology classification of lupus nephritis according to the criteria established by the International Society of Nephrology and the Renal Pathology Society (ISN/RPS) in 2003 revised in 2018\n| Class | Name | Description |\n| Class I | Minimal Mesangial Lupus Nephritis | Deposition of imune complexes detectable by immunofluorescence techniques. |\n| Class II | Mesangial Proliferative Lupus Nephritis | Mesangial hipercelularity of any degree or mesangial matrix expansion with immune deposits detectable by light microscopy. |\n| Class III | Focal Lupus Nephritis | Active or inactive focal, segmental or global endo/extracapillary glomerulonephritis involving <50% of all glomeruli. |\n| | | Manifestations include active lesions (A), chronic inactive lesions (C) or active and chronic lesions (A/C) |\n| Class IV | Diffuse Lupus Nephritis | Active or inactive diffuse, segmental or global endo/extracapillary glomerulonephritis involving ≥50% of all glomeruli. Subendothelial diffuse immune deposits, with or without mesangial alterations, are common. |\n| | | This class is also divided in: diffuse segmental (IV-S), when ≥ 50% of the involved glomeruli have segmental lesions, and diffuse global (IV-G), when ≥ 50% of the involved glomeruli have global lesions. |\n| | | It can also manifest A, C or A/C lesions. |\n| Class V | Membranous Lupus Nephritis | Global or segmental subepithelial immune deposition or their morphologic sequelae detectable by light, immunofluorescence or electron microscopy, with or without mesangial alterations. |\n| | | It can occur in combination with class III or IV and it can manifest advanced sclerosis. |\n| Class VI | Advanced Sclerosis Lupus Nephritis | Lupus Nephritis with terminal prognosis. |\n| | | ≥90% of the glomeruli in global sclerosis. |" }
    status: unverified
  # ---------- p450: general measures ----------
  - id: neph.L14.017
    kind: enumerate
    topic: ln-general
    prompt: Urinary findings that count as abnormal when screening SLE patients for kidney involvement (Figure, p450)?
    points:
      - Dipstick protein ≥2+ (or 1+ at low specific gravity)
      - Spot PCR >500 mg/g (50 mg/mmol)
      - Glomerular hematuria with ≥5% acanthocytes
      - Red or white cell casts
    pass: 3
    hook: "بول مريض الذئبة يبقى غلط في «2 بروتين + 2 خلايا»: dipstick protein 2+ أو أكتر (أو 1+ لو الـ specific gravity واطي)، spot PCR فوق 500 mg/g (50 mg/mmol)؛ glomerular hematuria فيها acanthocytes 5% أو أكتر، وcasts حمرا أو بيضا."
    src: { page: 450, quote: "Suspicion of disease flare\n  Testing panel: Serum creatinine and eGFR; Urinalysis (dipstick and sediment); Spot protein–creatinine ratio (PCR); Serology (anti-dsDNA and complement)\n    Is there evidence of abnormal proteinuria or urine sediment: Abnormal proteinuria assessed by dipstick protein ≥2+ (any level of specific gravity), dipstick protein 1+ (low specific gravity), or spot PCR >500 mg/g (50 mg/mmol); Urine sediment positive for acanthocytes (≥5%), red blood cell casts or white blood cell casts\n      No → No further urine testing at this time\n      Yes → Quantify proteinuria → Is 24-hour proteinuria ≥500 mg/d?\n    Is there evidence of decreased or decreasing GFR: For example, abnormal eGFR that is below the expected level based on age and clinical history, or decreasing eGFR, with no attributable cause other than systemic lupus erythematosus\n      No → No further kidney function testing at this time\n      Yes → Repeat testing" }
    status: unverified
  - id: neph.L14.018
    kind: enumerate
    topic: ln-general
    prompt: Kidney-protective general measures in lupus nephritis (Figure, p450)?
    points:
      - Avoid a high-sodium diet
      - Optimize blood pressure
      - RAAS blockade and SGLT2 inhibitor in stable patients without AKI
      - Avoid nephrotoxic insults and prevent AKI
    pass: 3
    hook: "حماية الكلية في LN «ملح، ضغط، حبايتين، ومفيش أذية»: ابعد عن high-sodium diet، ظبّط الضغط، RAAS blockade + SGLT2 inhibitor في المستقر اللي مفيهوش AKI، وابعد عن nephrotoxic insults وامنع AKI."
    src: { page: 450, quote: "| Risk | Management |\n| Cardiovascular risk | Lifestyle modifications – smoking cessation, body weight optimization, exercise; Dyslipidemia management; Low-dose aspirin during pregnancy; Blood pressure control |\n| Proteinuria and CKD progression (refer to Chapter 1) | Avoid high-sodium diet; Optimize blood pressure; Renoprotective medications, such as RAAS blockade, SGLT2 inhibitor, etc., in stable patients without AKI; Avoid nephrotoxic insult; Prevent AKI |\n| Infection risk | Assess medical history of herpes zoster and tuberculosis; Screening for HBV, HCV, HIV, and HBV vaccination; Pneumocystis jirovecii prophylaxis (issue of potential adverse drug reaction discussed below); Influenza and pneumococcal vaccination; Individualized consideration for recombinant zoster vaccine; Individualized consideration for other infectious organisms as dictated by public health concerns at the time of treatment |\n| Bone injury | Bone mineral density and fracture risk assessment; Calcium and vitamin D supplementation; Bisphosphonates when appropriate |\n| Ultraviolet light exposure | Broad-spectrum sunscreen; Limit ultraviolet light exposure |\n| Premature ovarian failure | Gonadotropin-releasing hormone agonists (i.e. leuprolide) |" }
    status: unverified
  - id: neph.L14.019
    kind: enumerate
    topic: ln-general
    prompt: Infection-related measures before immunosuppression in lupus nephritis (Figure, p450)?
    points:
      - Ask about prior herpes zoster and tuberculosis
      - Screen for HBV, HCV and HIV, and vaccinate against HBV
      - Pneumocystis jirovecii prophylaxis
      - Influenza and pneumococcal vaccination
      - Consider recombinant zoster vaccine
    pass: 4
    hook: "قبل ما تكسر المناعة «اسأل، افحص، احمي، طعّم»: اسأل عن herpes zoster وTB قبل كده، افحص HBV وHCV وHIV وطعّم ضد HBV، اعمل Pneumocystis jirovecii prophylaxis، طعّم influenza وpneumococcus، وفكّر في recombinant zoster vaccine. الـ zoster بيظهر مرتين: سؤال في الأول وتطعيم في الآخر."
    src: { page: 450, quote: "| Risk | Management |\n| Cardiovascular risk | Lifestyle modifications – smoking cessation, body weight optimization, exercise; Dyslipidemia management; Low-dose aspirin during pregnancy; Blood pressure control |\n| Proteinuria and CKD progression (refer to Chapter 1) | Avoid high-sodium diet; Optimize blood pressure; Renoprotective medications, such as RAAS blockade, SGLT2 inhibitor, etc., in stable patients without AKI; Avoid nephrotoxic insult; Prevent AKI |\n| Infection risk | Assess medical history of herpes zoster and tuberculosis; Screening for HBV, HCV, HIV, and HBV vaccination; Pneumocystis jirovecii prophylaxis (issue of potential adverse drug reaction discussed below); Influenza and pneumococcal vaccination; Individualized consideration for recombinant zoster vaccine; Individualized consideration for other infectious organisms as dictated by public health concerns at the time of treatment |\n| Bone injury | Bone mineral density and fracture risk assessment; Calcium and vitamin D supplementation; Bisphosphonates when appropriate |\n| Ultraviolet light exposure | Broad-spectrum sunscreen; Limit ultraviolet light exposure |\n| Premature ovarian failure | Gonadotropin-releasing hormone agonists (i.e. leuprolide) |" }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.020
    kind: enumerate
    topic: ln-general
    prompt: Bone protection measures in lupus nephritis (Figure, p450)?
    points:
      - Bone mineral density and fracture risk assessment
      - Calcium and vitamin D supplementation
      - Bisphosphonates when appropriate
    pass: 3
    hook: "العضم في LN «قيس، غذّي، ادعم»: bone mineral density وfracture risk assessment، calcium وvitamin D، وbisphosphonates لما يكون مناسب."
    src: { page: 450, quote: "| Risk | Management |\n| Cardiovascular risk | Lifestyle modifications – smoking cessation, body weight optimization, exercise; Dyslipidemia management; Low-dose aspirin during pregnancy; Blood pressure control |\n| Proteinuria and CKD progression (refer to Chapter 1) | Avoid high-sodium diet; Optimize blood pressure; Renoprotective medications, such as RAAS blockade, SGLT2 inhibitor, etc., in stable patients without AKI; Avoid nephrotoxic insult; Prevent AKI |\n| Infection risk | Assess medical history of herpes zoster and tuberculosis; Screening for HBV, HCV, HIV, and HBV vaccination; Pneumocystis jirovecii prophylaxis (issue of potential adverse drug reaction discussed below); Influenza and pneumococcal vaccination; Individualized consideration for recombinant zoster vaccine; Individualized consideration for other infectious organisms as dictated by public health concerns at the time of treatment |\n| Bone injury | Bone mineral density and fracture risk assessment; Calcium and vitamin D supplementation; Bisphosphonates when appropriate |\n| Ultraviolet light exposure | Broad-spectrum sunscreen; Limit ultraviolet light exposure |\n| Premature ovarian failure | Gonadotropin-releasing hormone agonists (i.e. leuprolide) |" }
    status: unverified
