  # ---------------- chance (slides 64-68) ----------------
  - id: res.L07.063
    kind: card
    topic: chance
    front: What are the two methods of assessing the role of chance?
    back: >-
      P-values (hypothesis testing): a statistical test of the null hypothesis, significant if p < 0.05.
      Confidence intervals (estimation): the range of values likely to include the true value.
    src: { page: 64, quote: "Two methods of assessing the role of chance:\n  P-values (Hypothesis Testing): use statistical test to examine the 'null' hypothesis; associated with \"p values\": if p<0.05 then result is statistically significant\n  Confidence Intervals (Estimation): estimates the range of values that is likely to include the true value\nRelationship between p-values and confidence intervals: if the value corresponding to 'no effect' (RR of 1 or risk difference of 0) falls outside the CI then the result is statistically significant" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.064
    kind: card
    topic: chance
    front: How do you read statistical significance from a confidence interval?
    back: >-
      If the value of no effect (RR = 1, or relative risk reduction (RRR) or risk difference = 0) falls outside the confidence interval (CI), the result is statistically significant.
      If the CI includes it, the groups are not significantly different.
    src: { page: 65, quote: "Confidence intervals:\n  show a range within which the true effect of the intervention is likely to be.\n  a confidence interval that includes the value of no effect (e.g. RR=1 or RRR=0) shows that the intervention group is not statistically significantly different from the control." }
