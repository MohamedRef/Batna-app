        quote: "Filtered load 600–700 mEq/day\nProximal tubule: K+ reabsorption 70–80%\nLoop: K+ reabsorption 15–20%\nDistal tubule (early, mid, late): K+ secretion\nCollecting tubule: K secretion\nUrinary excretion 90 mEq/day"
