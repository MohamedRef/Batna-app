    status: unverified
  - id: endo.L01.079
    kind: card
    topic: men2-treatment
    front: Advantage and drawback of cortical-sparing adrenalectomy?
    back: It removes the phaeochromocytoma and medulla and avoids steroid replacement, but phaeochromocytoma recurs in a small percentage.
    src: { page: 11, quote: "eliminates the necessity for steroid hormone replacement, although pheochromocytoma recurs in a small percentage" }
