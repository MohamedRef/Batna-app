        quote: "| Criterion | Definition |\n|---|---|\n| 1. Malar rash | A constant red, rash over the cheek bones that spares the natural crease between the nose and corner of the mouth (nasolabial fold). This rash is often called a \"butterfly rash\" because of its mask-like shape. |\n| 2. Discoid rash | Red to violaceous raised patches that can occur anywhere on the skin. Lesions can be acute or chronic, and in some chronic cases may produce decreased pigmentation and even scarring. Skin lesions are usually painless. |\n| 3. Photosensitivity | Skin reaction to sunlight, manifested as a rash, demonstrated either by history or physician observation. |\n| 4. Oral ulcers | Physician-observed mouth (oral) or throat (nasopharyngeal) ulcers. Such ulcers are usually painless. |"
        text: "قرح الـ lupus **painless**، علشان كده لازم **الدكتور يشوفها**. لو العيان بيشتكي من قرحة بتوجع جامد، فكّر في حاجة تانية. وبرضو الـ **Raynaud** شائع في الـ lupus بس **مش specific**: أبيض ← أزرق ← أحمر مع البرد أو الانفعال."
      - kind: explain
        remind: [rheum.L19.051]
        page: 317
        title: "المفاصل: Jaccoud arthropathy"
        quote: "Subluxation with hyperlaxity of joints."
        text: |
          - **Polyarthralgia** مع morning stiffness
          - **Avascular necrosis**
          - Arthritis **bilateral**: hands، wrists، knees
          - **Swan neck**، **ulnar deviation**، و ==subluxation with hyperlaxity==

          ليه الاسم Jaccoud؟ لأنها arthropathy من غير erosions: التشوّه من الأربطة السايبة (hyperlaxity) مش من العضم. والـ avascular necrosis في القايمة بسبب الـ vasculopathy (والـ steroids، التفسير المقبول مش في الكتاب).
      - kind: reveal
        page: 317
        quote: "Subluxation with hyperlaxity of joints."
        prompt: "الـ swan neck والـ ulnar deviation موجودين في RA وفي lupus. إيه الفرق؟"
        answer: |
          في الـ **RA** الـ synovitis بياكل العضم (**erosions**) فالتشوّه **fixed**.

          في الـ **lupus** المشكلة في الأوتار والأربطة: **hyperlaxity** و **subluxation**. التشوّه **reducible** (لما تفرد إيده على الترابيزة بيرجع) ومن غير erosions. علشان كده **erosive deformed arthritis** هي الإجابة الغلط في سؤال الكتاب.
      - kind: explain
        remind: [rheum.L19.058]
        page: 317
        title: "الرئة"
        quote: "Pleurisy.\n  It is the most common manifestation of pulmonary involvement of SLE.\n  The volume of pleural effusions usually is small to moderate and maybe unilateral or bilateral. Large pleural effusion are uncommon. It usually exudative in character. Pleural effusions may also occur in SLE patients with nephrotic syndrome, infection, cardiac failure."
        text: |
          - ==Pleurisy== = **أشيع** حاجة في الرئة. الـ effusion **small to moderate**، uni أو bilateral، **exudative**. الـ large نادر. (وممكن الـ effusion يكون من nephrotic أو infection أو heart failure.)
          - **Acute lupus pneumonitis:** fever، dyspnea، cough بـ scanty sputum، **hemoptysis**، tachypnea، pleuritic pain.
          - **Pulmonary hemorrhage** و **chronic interstitial lung disease**.

          ليه الـ pleura أشيع؟ لأنها serosal membrane، والـ serosa من التلات أماكن اللي بتميّز الـ lupus من التعريف.
      - kind: reveal
        page: 317
        quote: "Pleural effusions may also occur in SLE patients with nephrotic syndrome, infection, cardiac failure."
        prompt: "عيانة SLE عندها pleural effusion. ليه ماتقولش على طول «lupus pleurisy»؟"
        answer: |
          لأن الكتاب بيدّيك تلات أسباب تانية لنفس الـ effusion في نفس العيانة:
          - **Nephrotic syndrome** (من الـ lupus nephritis): الـ albumin يقل فالسوائل تطلع، وده **transudate**.
          - **Infection**: العيانة غالبًا على immunosuppression.
          - **Cardiac failure**: من الـ myocarditis أو الـ hypertension.

          الـ lupus pleurisy نفسه ==exudative== و small to moderate. فلو الـ effusion كبير أو transudate، ده يخلّيك تدوّر على سبب من التلاتة. ونفس المنطق بيتكرر في الـ pneumonitis: **استبعد العدوى الأول**.
      - kind: aside
        tone: exam
        page: 318
        quote: "The diagnosis should not be made until infectious processes such as viral pneumonia, tuberculosis, and other bacterial, fungal and pneumocystis carinii infection have been completely excluded."
        text: "قبل ما تكتب «lupus pneumonitis»: **استبعد الـ infection تمامًا**: viral، **tuberculosis (TB)**، bacterial، fungal، و **Pneumocystis**. العيانة واخدة immunosuppression، والعدوى بتلبس نفس اللبس."
      - kind: explain
        remind: [rheum.L19.060]
        page: 318
        title: "القلب"
        quote: "Pericarditis is the most common cardiac manifestation of SLE."
        text: |
          - ==Pericarditis== = **أشيع** حاجة في القلب.
          - **Myocarditis** شبه الـ viral myocarditis.
          - **Libman-Sacks endocarditis**: vegetations **flat, reddish-tan** على الـ **mitral valve** والـ chordae.
          - **Hypertension**، heart failure، **accelerated coronary artery disease (CAD)**، dysrhythmias.

          نفس المنطق: الـ pericardium غشاء serosal، علشان كده الـ pericarditis أشيع حاجة في القلب.
      - kind: figure
        page: 318
        quote: "Shown here is Libman-Sacks endocarditis in which there are many flat, reddish-tan vegetations spreading over the mitral valve and chordae."
        title: "الـ Libman-Sacks endocarditis"
        image: { file: rheum/L19-libman-sacks.webp, book: true }
        marks:
          - { at: [0.16, 0.38], label: "Flat reddish-tan vegetation" }
          - { at: [0.76, 0.59], label: "Vegetations along the valve edge" }
        alt: "Autopsy photograph of an opened heart with a centimetre ruler at the top. Along the edge of the mitral valve, above the thin white chordae, sit many flat, reddish-tan and yellowish patches."
        caption: |
          قلب مفتوح في الـ autopsy، والمسطرة فوق بالسنتيمتر:

          - **في النص**: حافة الـ ==mitral valve==، وتحتها خيوط بيضا رفيعة هي الـ **chordae**.
          - **على الحافة**: بقع **مسطّحة لونها أحمر بني ومصفر** منتشرة على الصمام والـ chordae: دي الـ vegetations.

          ده الـ ==Libman-Sacks endocarditis==: vegetations **flat** وكتير، **منتشرة** على الصمام والـ chordae.
      - kind: reveal
        page: 318
        quote: "Shown here is Libman-Sacks endocarditis in which there are many flat, reddish-tan vegetations spreading over the mitral valve and chordae."
        prompt: "ليه القلب في الـ lupus بيتأذي في كل طبقاته (pericardium، myocardium، endocardium، coronaries)؟"
        answer: |
          ارجع لتعريف المرض: **multisystem** و **serosal membranes**. الـ pericardium غشاء serosal زي الـ pleura، علشان كده ==pericarditis== أشيع حاجة في القلب زي ما الـ pleurisy أشيع حاجة في الرئة.

          والباقي من الـ **immune complexes** والالتهاب: myocarditis شبه الـ viral، و **Libman-Sacks**: vegetations **flat, reddish-tan** على الـ mitral والـ chordae (sterile، مش بكتيريا). والـ **accelerated CAD** بيكمّل الصورة: التهاب مزمن في الأوعية (والـ steroids كمان، التفسير المقبول مش في الكتاب).
