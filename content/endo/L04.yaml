  - id: endo.L04.241
    kind: essay
    topic: thyroid-heart
    prompt: What are the effects of thyroxine changes on the cardiovascular system?
    outline:
      - Thyroid disorders worsen old cardiac symptoms, cause new ones and accelerate heart disease
      - "Hypothyroidism: systolic and diastolic dysfunction"
      - "Bradycardia 10–20 bpm, but more PVCs and AF"
      - "Diastolic hypertension: less NO (stiff arteries), β down with α up, SIAD volume expansion; thyroxine normalises DBP in 32%"
      - Worsens or unmasks heart failure
