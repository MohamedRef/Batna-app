  - id: hb.L13.lesson6
    title: "الـ PSC: نعالج المضاعفات ونستنى الزرع صح"
    hook: "الـ transplant هو الحل الأقوى، والـ UDCA مش زي ما فاكر، وفيه 20 دوا جديد كلهم «خفّضوا الـ ALP»."
    minutes: 10
    pages: [227, 230]
    topics: [psc-treatment]
    goals:
      - "تعرف goals الـ management وعلاج كل complication"
      - "تحفظ أرقام الـ dominant stricture والـ transplant"
      - "تفهم ليه الـ UDCA مش recommended long-term في الـ PSC"
      - "ترتّب الأدوية الجديدة حسب الـ mechanism"
    status: unverified
    steps:
      - kind: explain
        remind: [hb.L13.137]
        page: 227
        quote: "Relieve symptoms. Prevent or treat complications. Halt progression of disease. Optimize timing of liver transplantation."
        title: "الهدف إيه؟"
        text: |
          الـ primary sclerosing cholangitis (PSC) مالوش علاج بيشفيه، فالـ management goals 4:

          - **Relieve symptoms**: زي الهرش.
          - **Prevent or treat complications**: الـ cholangitis والـ strictures والـ cancer.
          - **Halt progression**: نحاول نوقف المرض.
          - ==Optimize timing of liver transplantation==: مش بدري زيادة، ومش متأخر بعد ما المريض يتعب جدًا.

          ليه الهدف الأخير «optimize timing» مش «امنع الزرع»؟ عشان مفيش دوا لحد دلوقتي بيوقف المرض، فالزرع هو النهاية عند أغلبهم، والشطارة إنك تزرع قبل الـ cholangiocarcinoma أو الـ liver failure.
      - kind: match
        page: 228
        quote: "Managments of Complications specific to Primary sclerosing cholangitis:\n  1. Bacterial cholangitis: Should be treated with broad-spectrum i.v. antibiotic ciprofloxacin.\n  2. Stricture: should be treated endoscopically or radiologically with ballon dilation.\n  3. Cholangiocarcinoma: Carries a poor prognosis and responds poorly to chemotherapy or radiation therapy. Liver transplant is contraindicated."
        prompt: "وصّل كل مشكلة بعلاجها في الكتاب:"
        pairs:
          - ["Bacterial cholangitis", "Broad-spectrum IV antibiotic (ciprofloxacin)"]
          - ["Dominant stricture", "Endoscopic or radiologic balloon dilation"]
          - ["Cholangiocarcinoma", "Poor prognosis; transplant contraindicated"]
          - ["Advanced PSC", "Liver transplantation"]
        why: "الكتاب: cholangitis → IV ciprofloxacin، stricture → balloon dilation، cholangiocarcinoma → prognosis وحش ومش بيستجيب لـ chemo/radiation والـ transplant **contraindicated**، والـ advanced PSC → transplant هو الأكثر فاعلية."
      - kind: explain
        page: 228
        quote: "Liver transplantation has been shown to be the most effective treatment option for individuals with advanced PSC. The time between diagnosis and liver transplantation typically ranges from 20-25 years. It is important to note that patients who undergo liver transplantation after a diagnosis of PSC are susceptible to experiencing acute or chronic cellular rejection. Furthermore, there is a risk of PSC recurrence (30-50%) following orthotopic liver transplantation, which may require a subsequent liver transplant."
        title: "الـ transplant والـ dominant stricture"
        text: |
          **Transplant**:

          - بين التشخيص والـ transplant عادةً 20–25 سنة.
          - بعده ممكن يحصل **acute** أو **chronic cellular rejection**.
          - **Recurrence**: الـ PSC بيرجع في 30–50%، وممكن المريض يحتاج transplant تاني.
          - الـ **human leukocyte antigen (HLA) serotyping** عمومًا مش بيفرق كتير. بس الـ prescreening ممكن يحسّن النتيجة، لأن alleles معيّنة في الـ recipient والـ graft مرتبطة بالـ failure.

          ==Dominant stricture==:

          - complication شائعة وخطيرة.
          - **Mean survival**: 14 سنة معاها، مقابل 27 سنة من غيرها.
          - بتزوّد خطر الـ **CCA** (cholangiocarcinoma). علشان كده فكّر فيه لو الـ right upper quadrant (RUQ) pain أو الـ labs بدأوا يسوءوا subacutely.
          - ==Balloon dilatation==: الـ standard therapy.
          - **Stenting**: لسه controversial.
