  # ------------------------------------------------------------------
  - id: res.L05.lesson5
    title: "Case-control ولا cohort؟ والـ cohort اللي بيرجع لورا"
    hook: "مرض نادر؟ exposure نادر؟ عايز نتيجة بسرعة؟ كل سؤال ليه design. ونختم بأسئلة الدكتورة نفسها."
    minutes: 10
    pages: [62, 73]
    topics: [cohort-merits, compare, retrospective, risk]
    goals:
      - "تعرف نقاط قوة وضعف الـ cohort"
      - "تختار بين case-control و cohort في أي سيناريو"
      - "تعرف الـ retrospective (historical) cohort"
    status: unverified
    steps:
      - kind: sort
        page: 62
        quote: "Cohort studies\n| Strengths | Weaknesses |\n|---|---|\n| Incidence rate and risks | Attrition |\n| Multiple outcomes | Large sample |\n| Dose response ratio | Not for rare diseases |\n| Temporal relationship | Long time |\n| Rare exposure | Expensive |\n| Minimal selection and information bias | Ethical problem |"
        prompt: "Strength ولا weakness للـ cohort؟"
        bins: ["Strength", "Weakness"]
        cards:
          - { text: "Incidence rate and risks", bin: 0 }
          - { text: "Multiple outcomes", bin: 0 }
          - { text: "Dose-response ratio", bin: 0 }
          - { text: "Temporal relationship", bin: 0 }
          - { text: "Rare exposure", bin: 0 }
          - { text: "Attrition", bin: 1 }
          - { text: "Large sample, long time, expensive", bin: 1 }
          - { text: "Not for rare diseases", bin: 1 }
          - { text: "Ethical problem", bin: 1 }
        why: "الـ cohort بيدّي incidence و relative risk (RR) و attributable risk (AR)، وبيدرس أمراض كتير، وبيعرف مين جه الأول، وممتاز للـ exposure النادر. بس طويل وغالي وعينة كبيرة، والناس بتقع من المتابعة (**attrition**)، ومش نافع للمرض النادر."
      - kind: explain
        page: 63
        quote: "| Case Control Studies | Cohort Studies |\n|---|---|\n| Proceeds from effect to cause | Proceeds from cause to effect |\n| Starts with the disease | Starts with people exposed to the risk factor or suspected cause |\n| Tests whether the suspected cause occurs more frequently in those with disease than those without disease | Tests whether disease occurs more frequently in those exposed than in those not exposed |\n| Usually the 1st approach to the testing of hypothesis, but also useful for exploratory studies | Reserved for the testing of precisely formulated hypothesis |\n| Involves fewer study subjects | Involves larger number of subjects |\n| Yields results relatively quickly | Long follow-up, delayed results |\n| Suitable for study of rare diseases | Inappropriate when disease or exposure under investigation is rare |\n| Generally, yields only estimate of relative risk (Odds ratio) | Yields incidence rates, relative risk, attributable risk |\n| Cannot yield information about disease other than that under study | Can give information about more than one disease outcome |\n| Relatively inexpensive | Expensive |"
        title: "الاتنين جنب بعض"
        text: |
          - **الاتجاه**: case-control من ==effect to cause==، الـ cohort من ==cause to effect==.
          - **بيبدأ بـ**: المرض ↔ الناس اللي اتعرضوا.
          - **العدد**: أقل ↔ أكبر.
          - **النتيجة**: سريعة ↔ follow-up طويل.
          - **المقياس**: odds ratio (OR) (تقدير لـ RR) ↔ incidence و RR و AR.
          - **الأمراض**: المرض اللي بندرسه بس ↔ أكتر من مرض.
          - **التكلفة**: رخيص ↔ غالي.
      - kind: table
        page: 64
        quote: "Comparing case control to cohort\n| | Case control | Cohort |\n|---|---|---|\n| Logistic of the study: Time | quick | long term |\n| Cost | relatively cheap | costly |\n| Sample size | small | larger |\n| Ethical problem | - | + |\n| Type of investigation: Rare disease | best | - |\n| Disease with long LP | best | - |\n| Rare exposure | - | best |\n| Multiple outcomes | - | best |\n| Several risk factors | best | - |"
        title: "أنهي design أحسن؟"
        columns: ["Situation", "Case-control", "Cohort"]
        rows:
          - ["Rare disease", "Best", "-"]
          - ["Long latent period", "Best", "-"]
          - ["Rare exposure", "-", "Best"]
          - ["Multiple outcomes", "-", "Best"]
          - ["Several risk factors", "Best", "-"]
        hide: [[0, 1], [2, 2], [3, 2], [4, 1]]
      - kind: mnemonic
        page: 64
        quote: "Comparing case control to cohort\n| | Case control | Cohort |\n|---|---|---|\n| Logistic of the study: Time | quick | long term |\n| Cost | relatively cheap | costly |\n| Sample size | small | larger |\n| Ethical problem | - | + |\n| Type of investigation: Rare disease | best | - |\n| Disease with long LP | best | - |\n| Rare exposure | - | best |\n| Multiple outcomes | - | best |\n| Several risk factors | best | - |"
        word: "DOC"
        parts:
          - { key: "D", text: "rare Disease → case-control (start from the Disease)" }
          - { key: "O", text: "many Outcomes → cohort" }
          - { key: "C", text: "rare Cause (exposure) → Cohort (start from the Cause)" }
        hook: "اسأل الـ **DOC**: الحاجة النادرة اللي عندك، ابدأ **منها**. مرض نادر ← ابدأ من العيانين. exposure نادر ← ابدأ من المتعرضين."
      - kind: table
        page: 65
        quote: "Comparing case control to cohort\n| | Case control | Cohort |\n|---|---|---|\n| Problems: Selection bias | always present | - |\n| Recall bias | present | - |\n| Temporal relationship | not certain | certain |\n| Attrition problem | little | problematic |\n| Changes in the environment/behavior | not a problem | problematic |\n| Measurements: Incidence rate | cannot be calculated | yes |\n| Relative risk | approximation OR | yes |\n| Attributable risk | cannot be calculated | yes |\n| Dose response ratio | no | best |"
        title: "Problems and measurements"
        columns: ["", "Case-control", "Cohort"]
        rows:
          - ["Selection bias", "Always present", "-"]
          - ["Recall bias", "Present", "-"]
          - ["Temporal relationship", "Not certain", "Certain"]
          - ["Attrition", "Little", "Problematic"]
          - ["Incidence / AR", "Cannot be calculated", "Yes"]
          - ["Relative risk", "Approximation (OR)", "Yes"]
          - ["Dose-response", "No", "Best"]
        hide: [[0, 1], [2, 2], [3, 2], [5, 1]]
      - kind: check
        page: 64
        quote: "Comparing case control to cohort\n| | Case control | Cohort |\n|---|---|---|\n| Logistic of the study: Time | quick | long term |\n| Cost | relatively cheap | costly |\n| Sample size | small | larger |\n| Ethical problem | - | + |\n| Type of investigation: Rare disease | best | - |\n| Disease with long LP | best | - |\n| Rare exposure | - | best |\n| Multiple outcomes | - | best |\n| Several risk factors | best | - |"
        question: "Which situation is best studied by a cohort rather than a case-control design?"
        options: ["A rare disease", "A disease with a long latent period", "A rare exposure", "Several risk factors for one disease"]
        answer: 2
        why:
          - "المرض النادر أحسن بـ **case-control**."
          - "الـ long latency أحسن بـ **case-control**."
          - "صح: الـ exposure النادر (زي كيماوي في مصنع) نبدأ منه، فـ **cohort**."
          - "عوامل كتير لمرض واحد = **case-control**."
      - kind: explain
        page: 66
        quote: "Retrospective Cohort Study:\n  A retrospective cohort study is one in which the outcome have all occurred before the start of investigation.\n  Investigator goes back to the past to select study group from existing records of the past employment, medical and other records and traces them forward through time from the past date fixed on the records usually to the present.\n  Known with the name of Historical Cohort and noncurrent cohort"
        title: "الـ retrospective cohort"
        text: |
          ده cohort بس ==كل الـ outcomes حصلت قبل ما الدراسة تبدأ==.

          الباحث بيرجع للماضي ويختار المجموعة من ==records قديمة== (شغل، طبية...)، ويتتبعهم **لقدّام** من التاريخ ده لحد النهارده.

          اسمه كمان ==historical cohort== أو **non-concurrent cohort**.
      - kind: aside
        tone: trap
        page: 67
        quote: "Prospective versus Retrospective Cohort Studies\n| | Exposure | Outcome |\n|---|---|---|\n| Prospective | Assessed at the beginning of the study (present) | Followed into the future for outcome |\n| Retrospective | Assessed at some point in the past | Outcome has already occurred |"
        text: |
          متخلطش الـ **retrospective cohort** بالـ **case-control**!

          في الاتنين الـ **outcome has already occurred**، وبيبصوا للماضي، بس الفرق في **بتختار الناس على أساس إيه**:

          - على أساس الـ **exposure** (من الـ records) وتمشي لقدّام = **retrospective cohort**.
          - على أساس **المرض** وترجع لورا = **case-control**.
      - kind: table
        page: 67
        quote: "Prospective versus Retrospective Cohort Studies\n| | Exposure | Outcome |\n|---|---|---|\n| Prospective | Assessed at the beginning of the study (present) | Followed into the future for outcome |\n| Retrospective | Assessed at some point in the past | Outcome has already occurred |"
        title: "Prospective vs retrospective cohort"
        columns: ["", "Prospective", "Retrospective"]
        rows:
          - ["Exposure", "Assessed at the start (present)", "Assessed at some point in the past"]
          - ["Outcome", "Followed into the future", "Already occurred"]
        hide: [[0, 2], [1, 2]]
      - kind: explain
        page: 68
        quote: "Retrospective cohort: Requires good records of past exposure for a group of people who can then be traced to determine their current health. E.g., studying the effects of exposure to industrial hazards, studying mortality or cancer outcomes."
        title: "بنستخدمه إمتى؟"
        text: |
          محتاج ==good records of past exposure== لمجموعة نقدر نوصلهم ونعرف صحتهم دلوقتي.

          ممتاز لـ ==unusual or occupational exposures==: industrial hazards والكيماويات، مع outcomes زي الـ mortality والـ cancer.
      - kind: check
        page: 66
        quote: "Retrospective Cohort Study:\n  A retrospective cohort study is one in which the outcome have all occurred before the start of investigation.\n  Investigator goes back to the past to select study group from existing records of the past employment, medical and other records and traces them forward through time from the past date fixed on the records usually to the present.\n  Known with the name of Historical Cohort and noncurrent cohort"
        question: "In 2026, researchers use 1995 factory records to find workers exposed and not exposed to benzene, then trace both to today to compare leukaemia. Design?"
        options: ["Case-control study", "Retrospective (historical) cohort", "Prospective cohort study", "Cross-sectional survey"]
        answer: 1
        why:
          - "الـ case-control كان هيبدأ من عيانين الـ leukaemia."
          - "صح: اخترنا على أساس الـ **exposure** من records قديمة وتتبعناهم لحد النهارده."
          - "في الـ prospective الـ exposure بيتقاس دلوقتي والـ outcome في المستقبل."
          - "مش مقاسين في لحظة واحدة."
      - kind: case
        page: 72
        quote: "Qs 1-4: In a community-based study, the incidence rate of lung cancer was 120/100,000 for smokers and 10/100,000 for nonsmokers.\n1. What is the Relative Risk (Risk Ratio) of developing lung cancer for smokers compared with nonsmokers?\n  A. 5\n  B. 12\n  C. 50\n  D. 100\n  E. 120\n2. The above calculated Relative Risk is interpreted as follows:\n  A. The risk of developing lung cancer is 'x' times higher in smokers compared to nonsmokers.\n  B. The probability of being a smoker is 'x' times greater among those with lung cancer compared to those without lung cancer."
        stem: "Lung cancer incidence: 120/100,000 in smokers, 10/100,000 in non-smokers (the lecturer's own questions)."
        steps:
          - question: "Relative risk?"
            options: ["5", "12", "50", "120"]
            answer: 1
            why: "120 ÷ 10 = **12**."
          - question: "Interpretation?"
            options:
              - "The risk of lung cancer is 12 times higher in smokers than non-smokers"
              - "The probability of being a smoker is 12 times greater among those with lung cancer"
            answer: 0
            why: "الـ RR بيتكلم عن **risk of disease**. الجملة التانية لغة الـ OR في الـ case-control."
          - question: "Attributable risk?"
            options: ["11/100,000", "50/100,000", "110/100,000", "120/100,000"]
            answer: 2
            why: "120 − 10 = **110 per 100,000**."
          - question: "Attributable risk percent?"
            options: ["78%", "80%", "92%", "99%"]
            answer: 2
            why: "110 ÷ 120 × 100 = 91.7% ≈ **92%**."
      - kind: try
        items: [res.L05.052, res.L05.054, res.L05.055, res.L05.057, res.L05.051]
    recap:
      - "Cohort: incidence/RR/AR، outcomes كتير، dose-response، temporal أكيد، rare exposure. بس attrition، عينة كبيرة، وقت وفلوس، ومش للمرض النادر."
      - "**DOC**: rare Disease ← case-control؛ many Outcomes ← cohort؛ rare Cause ← cohort."
      - "Case-control: selection bias دايمًا و recall bias، والـ RR مجرد تقدير (OR)."
      - "**Retrospective = historical = non-concurrent cohort**: نختار بالـ exposure من records قديمة ونتتبع لحد النهارده؛ للـ occupational exposures."
      - "RR 120/10 = 12، AR = 110/100,000، attributable risk percent (ARP) ≈ 92%."
