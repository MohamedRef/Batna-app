    status: unverified
    steps:
      - kind: explain
        page: 102
        title: "Who to screen?"
        text: |
          **General population-based screening for MASLD is not advised.** بس محتاجين 3 حاجات:

          - **Screen all prediabetics and type 2 DM.**
          - **Identify high-risk patients** of progressive disease.
          - **Assess the degree of fibrosis** and **stage** the liver disease.
      - kind: reveal
        page: 102
        prompt: "ليه مرضى السكر بالذات، وليس كل الناس؟"
        answer: |
          جمّع من الدروس اللي فاتت: **T2DM و obesity** أقوى risk factors للـ fibrosis والـ cirrhosis والـ HCC، والـ **enzymes مش بتكشفهم** (NASH في 58% رغم ALT واطي). يعني ده المكان اللي فيه المرض المخبّي اللي بيتطور.

          أما الناس كلها: أعداد ضخمة وأغلبهم simple steatosis، فالكتاب مش بينصح بالـ screening الشامل.
      - kind: explain
        page: 104
        title: "EASL 2021: primary care أو diabetology clinic"
        text: |
          - **Check for liver risk factors** واعمل **AST، ALT، GGT، ALP و platelets**.
          - فيه **viral hepatitis** أو chronic liver disease تاني، أو **signs of advanced disease/cirrhosis**؟ → **referral to liver specialist** على طول.
          - **Metabolic co-factors and/or alcohol only?** → احسب **FIB-4**.
          - **< 1.30** = low risk: **no referral، lifestyle modifications، re-test in 1–3 years**.
          - **≥ 1.30** → **transient elastography**: **< 8 kPa** low risk، **≥ 8 kPa** intermediate-high risk.
          - بعد ≥ 8 kPa: **patented serum test** لو متاح (combine): **concordance** = **F3–F4 highly likely** → liver clinic. **Discordance** أو مفيش test → **consider liver biopsy**.
