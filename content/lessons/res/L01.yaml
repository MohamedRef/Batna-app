        alt: "Slide with three graphics. Left, a pyramid divided by dashed lines into phases 0 to IV, a downward arrow on its left: phase 0 effect on body; phase I weeks, tens, safety in humans; phase II months, hundreds, effectiveness at treating diseases; phase III years, thousands, larger scale safety and effectiveness; phase IV ongoing, long term safety; people icons grow in number from top to bottom, with a key for healthy and affected. Right, a wheel of phases I to IV around early discovery and ongoing research, each quarter with its own note. Bottom, five arrows: preclinical (lab and animal studies), phase I (safety study, 20-80 people), phase II (safety study, identify side effects, measure effectiveness, 100-300 people), phase III (measure effectiveness, monitor side effects, 1,000-3,000 people), phase IV (monitor long-term side effects)."
        caption: |
          الشريحة دي فيها 3 رسومات لنفس الـ phases:

          - **الهرم (شمال)**: كل ما تنزل phase، الهرم يوسع: الوقت من **weeks** لـ **months** لـ **years** لـ **ongoing**، والناس من **tens** لـ **hundreds** لـ **thousands**. والهدف جنب كل دور: effect on body، safety in humans، effectiveness، larger scale safety and effectiveness، long term safety. الأشخاص البرتقاني فوق = healthy، والغامق تحت = affected.
          - **العجلة (يمين)**: Phase I لـ IV حوالين **Early discovery and ongoing research**، وجنب كل ربع ملاحظته (مثلًا Phase III بتقارن الجديد بالـ standard treatment).
          - **الأسهم (تحت)**: Preclinical ← Phase I (20-80) ← Phase II (100-300) ← Phase III (1,000-3,000) ← Phase IV.

          اللي تاخده من الهرم: ==العدد والمدة بيكبروا مع كل phase==، والـ Phase I غالبًا في **healthy** volunteers وبعدها في العيانين.
