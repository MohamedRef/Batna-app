        title: "ليه نص ونص، وليه 1/6؟"
        quote: "Starting a Basal-Bolus Regimen"
        text: |
          الحسبة بتاعة الكتاب: **TDD = weight × 0.5 U/kg**، ==½ basal== و **½ bolus**، والـ bolus متقسّم **1/6 TDD** قبل كل وجبة من التلاتة.

          التفسير المقبول (مش في الكتاب) للأرقام:

          - **نص ونص**: لأن البنكرياس السليم في اليوم بيطلّع تقريبًا نص الـ insulin بتاعه basal ثابت ونص على شكل قمم بعد الأكل، يعني الحسبة بتقلّد الـ physiological profile اللي شفناه في أول المحاضرة.
          - **1/6 لكل وجبة**: هو نص الـ TDD مقسوم على 3. ده **رقم بداية** متساوي، وبعدين كل جرعة وجبة بتتظبط لوحدها على القراية اللي بعدها، وده ميزة الـ basal-bolus: كل وجبة ليها زرار لوحدها.
          - **0.5 U/kg**: جرعة بداية متوسطة؛ العيان الـ insulin resistant جدًا هيحتاج أكتر مع الـ titration.
      - kind: reveal
        page: 140
        quote: "Starting a Basal-Bolus Regimen"
        prompt: "عيان 80 kg هيبدأ basal-bolus بحسبة الكتاب. احسب الـ basal وجرعة كل وجبة."
        answer: |
          - **TDD** = 80 × 0.5 = **40 U**
          - **Basal** = ½ × 40 = **20 U** مرة واحدة
          - **كل وجبة** = 40 ÷ 6 ≈ **7 U** قبل الفطار والغدا والعشا

          اتأكد إن 20 + (7 × 3) ≈ 40، يعني الحسبة راجعة لنفس الـ TDD.
