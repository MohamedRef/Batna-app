          - { text: "Familial amyloidosis", bin: 0 }
          - { text: "Intractable pruritus", bin: 0 }
          - { text: "Repeated hepatic encephalopathy", bin: 1 }
          - { text: "Hepatorenal syndrome", bin: 1 }
        why: "الـ repeated HE مش في قايمة L11؛ هي اللي بتخلّينا نزرع تحت MELD 15 هي والـ refractory ascites. وخلي بالك: L09 (صفحة 156) بيقول إن الـ refractory ascites بتعتبر exception للـ MELD في أولوية الـ waiting list، مع إن قايمة L11 مش فيها. والـ HRS بيرفع الـ creatinine فالـ MELD شايفه لوحده، وفي الكتاب هو high risk factor (الدرس التالت)."
      - kind: try
        items: [hb.L11.003, hb.L11.008, hb.L11.010, hb.L11.015, hb.L11.011]
    recap:
      - "Decompensation: الـ median survival من **> 12 سنة لسنتين**."
      - "AASLD: ابدأ التقييم عند **decompensation أو CTP ≥ 7 أو MELD ≥ 10**."
      - "MELD = **BIC** (bilirubin، INR، creatinine)، اتعمل في Mayo علشان **TIPS**، واتعمل بيه allocation من **2002**."
