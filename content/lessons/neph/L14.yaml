        text: |
          الـ workup: **ADAMTS13**، stool **STEC**، pneumococcal urinary antigen، HIV، ANA و anti-dsDNA و anticardiolipin، والأطفال: **B12** و **methylmalonic acid**.

          | النتيجة | العلاج |
