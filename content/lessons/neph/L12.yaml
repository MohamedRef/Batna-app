  - id: neph.L12.lesson2
    title: "Tumor lysis syndrome: الورم لما يفرقع"
    hook: "الـ chemo شغال كويس أوي لدرجة إن الخلايا بتنفجر وتغرق الكلية."
    minutes: 10
    pages: [413, 416]
    topics: [tls]
    goals:
      - "تعرف الـ TLS ونتايجه الست"
      - "تحفظ الـ Cairo-Bishop (lab و clinical) بالأرقام"
      - "تفهم الـ pathophysiology وتعمل prevention وعلاج صح"
    status: unverified
    steps:
      - kind: explain
        page: 413
        title: "إيه اللي بيحصل؟"
        quote: "It is an emergency condition in which breakdown of tumor cells, either spontaneously or in response to treatment, releases intracellular contents into the circulation"
        text: |
          الـ ==tumor lysis syndrome== **emergency**: خلايا الورم بتتكسر (لوحدها أو مع العلاج) وتطلّع اللي جواها في الدم:

          - **hyperuricemia**
          - **hyperkalemia**
          - **hyperphosphatemia**
          - **secondary hypocalcemia**
          - **metabolic acidosis**
          - **AKI**

          وممكن كمان **cardiac arrhythmias** و **seizures**.
      - kind: figure
        page: 415
        quote: "The release of large amounts of phosphate increases the calcium-phosphate concentration product, leading to calcium-phosphate precipitation with nephrocalcinosis and hypocalcemia."
        title: "من الخلية للكلية"
        alt: "Pathway: a lysed tumor cell releases potassium, phosphate and DNA. DNA becomes purines, then uric acid via xanthine oxidase, causing uric acid nephropathy. Phosphate binds calcium, causing nephrocalcinosis and hypocalcemia. Potassium causes arrhythmia. Cytokine release is a third AKI mechanism."
        caption: "تلات طرق للـ AKI: ==uric acid nephropathy== و **nephrocalcinosis** و **cytokine release**. والـ allopurinol بيقفل سهم الـ xanthine oxidase."
        svg: |
          <svg viewBox="0 0 330 366" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L12b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="85" y="10" width="160" height="40" rx="20" class="fg-bad"/>
            <text x="165" y="35" text-anchor="middle" class="t-sm t-b">Tumor cell lysis</text>
            <path d="M120 50 L55 80" class="fg-arrow" marker-end="url(#L12b)"/>
            <path d="M165 50 V80" class="fg-arrow" marker-end="url(#L12b)"/>
            <path d="M210 50 L275 80" class="fg-arrow" marker-end="url(#L12b)"/>
            <rect x="10" y="84" width="90" height="34" rx="8" class="fg-box"/>
            <text x="55" y="106" text-anchor="middle" class="t-sm t-b">DNA</text>
            <rect x="120" y="84" width="90" height="34" rx="8" class="fg-box"/>
            <text x="165" y="106" text-anchor="middle" class="t-sm t-b">Phosphate</text>
            <rect x="230" y="84" width="90" height="34" rx="8" class="fg-box"/>
            <text x="275" y="106" text-anchor="middle" class="t-sm t-b">Potassium</text>
            <path d="M55 118 V140" class="fg-arrow" marker-end="url(#L12b)"/>
            <text x="55" y="156" text-anchor="middle" class="t-sm">Purines</text>
            <path d="M55 162 V190" class="fg-arrow-acc" marker-end="url(#L12b)"/>
            <text x="66" y="181" class="t-sm t-acc">xanthine oxidase</text>
            <rect x="10" y="194" width="90" height="34" rx="8" class="fg-acc"/>
            <text x="55" y="216" text-anchor="middle" class="t-sm t-b">Uric acid</text>
            <path d="M165 118 V190" class="fg-arrow" marker-end="url(#L12b)"/>
            <text x="172" y="150" class="t-sm t-mut">+ calcium</text>
            <rect x="120" y="194" width="90" height="34" rx="8" class="fg-acc"/>
            <text x="165" y="210" text-anchor="middle" class="t-sm t-b">Ca-P deposit</text>
            <text x="165" y="223" text-anchor="middle" class="t-sm">low serum Ca</text>
            <path d="M275 118 V190" class="fg-arrow" marker-end="url(#L12b)"/>
            <rect x="230" y="194" width="90" height="34" rx="8" class="fg-bad"/>
            <text x="275" y="216" text-anchor="middle" class="t-sm t-b">Arrhythmia</text>
            <path d="M55 228 L120 280" class="fg-arrow-bad" marker-end="url(#L12b)"/>
            <path d="M165 228 V276" class="fg-arrow-bad" marker-end="url(#L12b)"/>
            <rect x="60" y="280" width="210" height="78" rx="10" class="fg-bad"/>
            <text x="165" y="300" text-anchor="middle" class="t-sm t-bad t-b">AKI mechanisms</text>
            <text x="165" y="317" text-anchor="middle" class="t-sm">uric acid nephropathy</text>
            <text x="165" y="332" text-anchor="middle" class="t-sm">nephrocalcinosis</text>
            <text x="165" y="348" text-anchor="middle" class="t-sm">cytokine release</text>
          </svg>
      - kind: explain
        page: 413
        title: "مين اللي بيعمله؟"
        quote: "such as non-Hodgkin lymphoma, acute myeloid leukemia, acute lymphocytic leukemia, Burkitt lymphoma, and solid organ cancers with large masses."
        text: |
          الأورام اللي ==large tumor burden== و **rapid cell growth**:
          - **non-Hodgkin lymphoma** و **Burkitt lymphoma**
          - **AML** و **ALL**
          - **solid cancers** بكتلة كبيرة

          والـ in-hospital mortality ممكن توصل **20%**، و **70%** بيحصلهم complications خطيرة (sepsis، dialysis، respiratory failure، ventilation، cardiac arrest، seizures).
      - kind: table
        page: 414
        quote: "Calcium 25% decrease from baseline or ≤7.0 mg/dL"
        title: "Cairo-Bishop: الـ laboratory TLS"
        columns: [Lab, Value, Or]
        rows:
          - ["Uric acid", "≥8.0 mg/dL", "↑25%"]
          - ["Potassium", "≥6.0 mEq/L", "↑25%"]
          - ["Phosphorus", "≥4.5 mg/dL (child ≥6.5)", "↑25%"]
          - ["Calcium", "≤7.0 mg/dL", "↓25%"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: tip
        page: 414
        quote: "presence of 2 or more of the following criteria within the same 24-hour period from 3 days before to 7 days after chemotherapy initiation"
        text: |
          افتكر **8 - 6 - 4.5 - 7**: uric acid **8**، potassium **6**، phosphate **4.5**، calcium **7** (ده الوحيد اللي بينزل).

          والقاعدة: **2 أو أكتر** في نفس الـ **24 ساعة**، من **3 أيام قبل** لـ **7 أيام بعد** بداية الـ chemo.
      - kind: explain
        page: 415
        title: "امتى يبقى clinical؟"
        quote: "Clinical tumor lysis syndrome is defined by the presence of laboratory tumor lysis syndrome plus one or more of the following"
        text: |
          ==Clinical TLS== = laboratory TLS + واحدة على الأقل من:
          - **seizure**
          - **creatinine > 1.5 × ULN** (age-adjusted)
          - **cardiac arrhythmia** أو **sudden death**

          الـ Cairo-Bishop كمان بيعمل grading من **0** (asymptomatic) لـ **5** (death).
      - kind: check
        page: 415
        quote: "Creatinine greater than 1.5 times the upper limit of normal of an age-adjusted reference range"
        question: "Day 2 of chemo: uric acid 10, K 6.5, Ca 7.6, creatinine 2.0 mg/dL (ULN 1.1). No seizure or arrhythmia. Diagnosis?"
        options:
          - "Clinical TLS"
          - "Laboratory TLS only"
          - "No TLS: calcium is above 7"
          - "No TLS: creatinine is not a lab criterion"
        answer: 0
        why:
          - "صح: uric acid و K = اتنين lab criteria، والـ creatinine 2.0 أكبر من 1.5 × 1.1 = 1.65، فبقى clinical."
          - "ناقص: الـ creatinine عدّى 1.5 × ULN."
          - "الكالسيوم مش لازم؛ كفاية أي اتنين."
          - "صح إنه مش lab criterion، بس هو clinical criterion."
      - kind: explain
        page: 416
        title: "الوقاية حسب الـ risk"
        quote: "a balanced isotonic crystalloid solution (1-2 mL/kg/hour) should be administered to maintain adequate hydration status and GFR."
        text: |
          - **Low risk:** **oral hydration** وابعد عن الـ nephrotoxins.
          - **Higher risk:** IV **0.9% saline** أو الأحسن ==balanced isotonic crystalloid== بمعدل **1-2 mL/kg/hour**، تبدأ **24-48 ساعة قبل** العلاج.
          - **High risk:** زوّد **xanthine oxidase inhibitor** (allopurinol أو febuxostat) علشان يمنع تكوين uric acid جديد.

          الـ hydration بيحافظ على الـ **tubular flow** فيغسل الـ uric acid والـ K والـ phosphate.
      - kind: reveal
        page: 416
        quote: "Urinary alkalinization, which increases the solubility of uric acid in the renal tubules, is not recommended"
        prompt: "الـ uric acid بيذوب أكتر في البول القلوي. ليه الكتاب بيقول لأ للـ urinary alkalinization؟"
        answer: |
          لأن الـ **calcium phosphate** بالعكس، بيترسب أكتر في الوسط القلوي. فأنت بتحل مشكلة الـ urate وبتعمل **nephrocalcinosis** و **symptomatic hypocalcemia**.

          والـ phosphate عالي أصلًا في الـ TLS، فالمكسب مش يستاهل.
      - kind: update
        page: 416
        quote: "patients at high risk for TLS should receive a xanthine oxidase inhibitor (allopurinol or febuxostat) to blunt de novo formation of uric acid."
        ref: "Cairo et al. TLS recommendations 2010; NCCN supportive care 2024"
        text: "عمليًا الـ rasburicase (urate oxidase) بيتدّي في الـ high risk أو لو الـ uric acid عالي فعلًا، وممنوع في الـ G6PD deficiency. الكتاب ذكر الـ xanthine oxidase inhibitors بس، وده اللي يتكتب في الامتحان."
      - kind: explain
        page: 416
        title: "لما الكلية تقف"
        quote: "serum uric acid levels fall by approximately 50% with each 6-hour treatment."
        text: |
          لو فيه **established AKI** خصوصًا **oliguric أو anuric**: ==emergent hemodialysis== بيصلح الـ electrolytes بسرعة وأمان.

          - الـ uric acid بينزل حوالي **50%** في كل جلسة **6 ساعات**.
          - الـ **CRRT** مفيد لأنه بيمنع الـ **rebound** metabolic disturbances.
      - kind: order
        page: 416
        quote: "Electrolyte disorders should be identified and corrected rapidly according to standard protocols)."
        prompt: "رتّب السلم من الأخف للأتقل:"
        steps:
          - "Oral hydration, avoid nephrotoxins"
          - "IV balanced crystalloid 1-2 mL/kg/h"
          - "Add allopurinol or febuxostat"
          - "Correct electrolytes rapidly"
          - "Emergent hemodialysis or CRRT"
        why: "بتطلع درجة كل ما الـ risk يزيد، والـ dialysis للـ established oliguric AKI."
      - kind: try
        items: [neph.L12.023, neph.L12.031, neph.L12.035, neph.L12.039, neph.L12.046]
    recap:
      - "الـ TLS: uric acid ↑، K ↑، phosphate ↑، Ca ↓، acidosis، AKI (+ arrhythmia، seizures)."
      - "Cairo-Bishop lab: ≥2 من (urate 8، K 6، P 4.5، Ca 7 أو تغيير 25%) من 3 أيام قبل لـ 7 بعد الـ chemo."
      - "Clinical = lab + seizure أو creatinine >1.5 × ULN أو arrhythmia."
      - "AKI = uric acid nephropathy + nephrocalcinosis + cytokines."
      - "Hydration 1-2 mL/kg/h قبلها بـ 24-48 ساعة + xanthine oxidase inhibitor. لا للـ alkalinization."
      - "Oliguric AKI = hemodialysis (urate ↓50% كل 6 ساعات) أو CRRT."
    practice: [neph.L12.022, neph.L12.023, neph.L12.024, neph.L12.025, neph.L12.026, neph.L12.027, neph.L12.028, neph.L12.029, neph.L12.030, neph.L12.031, neph.L12.032, neph.L12.033, neph.L12.034, neph.L12.035, neph.L12.036, neph.L12.037, neph.L12.038, neph.L12.039, neph.L12.040, neph.L12.041, neph.L12.042, neph.L12.043, neph.L12.044, neph.L12.045, neph.L12.046, neph.L12.047, neph.L12.048, neph.L12.049, neph.L12.050, neph.L12.051, neph.L12.052, neph.L12.053, neph.L12.054, neph.L12.055]
