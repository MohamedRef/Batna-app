  # ------------------------------------------------------------------
  - id: neph.L02.lesson1
    title: "يعني إيه CKD؟ التعريف والتصنيف"
    hook: "واحد من كل عشرة عنده CKD ومعظمهم مايعرفوش. التعريف رقمين ومدة."
    minutes: 8
    pages: [23, 24]
    topics: [epidemiology, definition]
    goals:
      - "تعرف تعريف KDIGO للـ CKD وليه 3 شهور"
      - "تعرف علامات الـ kidney damage وليه هي بالذات"
      - "تفهم ليه مريض الـ CKD بيموت بالقلب"
    status: unverified
    steps:
      - kind: explain
        page: 23
        quote: "CVD Main cause of death in CKD"
        title: "مرض شائع وبيقتل بالقلب"
        text: |
          في 2017 كان فيه حوالي **843.6 مليون** إنسان عندهم chronic kidney disease (CKD)، يعني تقريبًا **1 من كل 10**. الوفيات زادت **41.5%** من 1990، ومتوقع يبقى **السبب الخامس** للوفاة.

          والمهم للامتحان: مريض الـ CKD غالبًا **مش بيموت من الكلى**. ==cardiovascular disease (CVD)== هو السبب الأول للوفاة.
      - kind: "figure"
        page: 23
        quote: "Epidemiology of chronic kidney disease: an update 2022"
        title: "شكل الـ epidemiology في الكتاب، ص 23"
        image: { file: neph/L02-epidemiology-2022.webp, book: true }
        caption: "الـ infographic ده هو مصدر أرقام الخطوة اللي فاتت، في 3 أعمدة:\n\n- **Extremely common**: ==843.6 million== في 2017، يعني **1 in 10**، وتحتها الدايرة بتاعة **More prevalent in**: الـ diabetes، الـ hypertension، الستات، كبار السن، والـ racial minorities.\n- **Increasing death rate**: ==+41.5%== من 1990 لـ 2017، والأعمدة بتوري ترتيبها في أسباب الوفاة طالع من **19th** (2013) لـ **13th** و **12th**، ومتوقع **5th** في 2040.\n- **Large burden** في الدول الـ low- و middle-income، ومن **top 10 causes** للوفاة في Singapore و Greece و Israel.\n\nالخلاصة اللي تحت (**Conclusion**): مرض شائع ونتايجه وحشة، فالهدف نقلل حدوثه ونبطّأ تقدمه، وده اللي باقي الـ lecture بيعمله."
        alt: "Book infographic 'Epidemiology of chronic kidney disease: an update 2022' (Kovesdy 2022). Left: 843.6 million in 2017, approximately 1 in 10, more prevalent in individuals with diabetes, hypertension, women, elderly and racial minorities. Middle: death rate up 41.5% from 1990 to 2017; rank in cause of death 19th in 2013, 13th in 2016, 12th in 2017, projected 5th in 2040. Right: world map, large burden in low- and middle-income countries, among the top 10 causes of death in Singapore, Greece and Israel. Bottom: conclusion box."
      - kind: figure
        page: 23
        quote: "CVD Main cause of death in CKD"
        title: "الـ CVD هو اللي بيموّت مريض الـ CKD"
        image: { file: neph/L02-cvd-death-chart.webp, book: true }
        alt: "Book bar chart, adjusted percentages of cardiovascular disease by CKD status: five bars per disease (no CKD, any CKD, stages 1-2, stage 3, stages 4-5). Diseases on the x axis: any CVD, HF, CAD, AMI, VHD, PAD, CVA/TIA, AF, SCA, VTE/PE. Any CVD, HF and CAD are boxed in red; the bars rise from no CKD to stages 4-5. Text on the right: CVD main cause of death in CKD."
        caption: |
          رسم أعمدة، وكل مرض قلب ليه 5 أعمدة ملوّنة: **No CKD** (كحلي)، **Any CKD** (أحمر)، **Stages 1-2** (رمادي)، **Stage 3** (أخضر)، **Stages 4-5** (أزرق فاتح).

          - **شمال في المربع الأحمر: Any CVD**: من حوالي 35% من غير CKD لحوالي 75% في stages 4-5.
          - **المربع الأحمر التاني: HF** (heart failure) و **CAD** (coronary artery disease): نفس السلّم، كل ما الـ stage يزيد العمود يطول.
          - **باقي الأمراض يمين** (AMI، PAD، AF...): نفس الاتجاه بس أرقام أصغر.
          - **فوق يمين**: **CVD Main cause of death in CKD**.

          الرسمة بتثبت إن ==الخطر على القلب بيزيد مع كل stage==، فمريض الـ CKD غالبًا بيموت من ==قلبه قبل كليته==.
      - kind: explain
        page: 24
        quote: "CKD is defined as abnormalities of kidney structure or function, present for > 3 months, with implications for health and CKD is classified based on cause, GFR category, and albuminuria category (CGA)."
        title: "تعريف KDIGO 2012"
        text: |
          الـ ==CKD== = abnormality في **structure** أو **function** الكلى، موجودة **أكتر من 3 شهور**، ولها تأثير على الصحة.

          ويتصنّف بالـ ==CGA==: **C**ause، **G**FR category، **A**lbuminuria category.

          المعيار: واحد من دول لمدة > 3 شهور:

          - **glomerular filtration rate (GFR) < 60** (G3a–G5)، **أو**
          - **marker of kidney damage**: albuminuria (ACR ≥ 30 mg/g)، urine sediment، tubular disorder، histology، imaging، أو تاريخ زرع كلى

          التفسير المقبول (مش في الكتاب): شرط الـ **3 شهور** موجود **عشان** نفرّق المرض المزمن عن AKI أو نزول مؤقت بيرجع. والتصنيف بالـ CGA **لأن** السبب والـ GFR والـ albuminuria هم اللي بيحددوا الـ prognosis والعلاج.
      - kind: figure
        page: 24
        quote: "CKD is defined as abnormalities of kidney structure or"
        title: "التعريف في رسمة واحدة"
        alt: "Two boxes joined by OR: GFR under 60, or a marker of kidney damage such as ACR 30 mg/g or more, sediment, tubular disorder, histology, imaging or transplant. Both feed a clock labelled more than 3 months, which leads to CKD, classified by Cause, GFR category and Albuminuria category."
        caption: "**واحد** من الاتنين يكفي، بس لازم يفضل **أكتر من 3 شهور**. وبعدها التصنيف بالـ **CGA**."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="N2d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="140" height="56" rx="8" class="fg-acc"/>
            <text x="80" y="34" text-anchor="middle" class="t-b">GFR &lt; 60</text>
            <text x="80" y="54" text-anchor="middle" class="t-sm">G3a to G5</text>
            <text x="165" y="43" text-anchor="middle" class="t-b">OR</text>
            <rect x="180" y="10" width="140" height="56" rx="8" class="fg-acc"/>
