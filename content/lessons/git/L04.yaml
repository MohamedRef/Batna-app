      - kind: figure
        page: 171
        title: "من خلية طبيعية لـ metastasis"
        image: { file: git/L04-adenoma-carcinoma-sequence.webp, book: true }
        alt: "Book drawing of the adenoma-carcinoma sequence: normal epithelium, hyperproliferation (aberrant crypt focus), adenoma, carcinoma in situ, and invasion with metastasis, the cells piling up more at each step."
        caption: |
          نفس الكلام في خلايا: **normal epithelium** ← **hyperproliferation (ACF)** ← ==adenoma== ← **carcinoma in situ** ← **invasion و metastasis**.

          لاحظ الخلايا بتتكوّم أكتر في كل خطوة، وفي الآخر بتسيب مكانها.
      - kind: order
        page: 171
        quote: "1. APC mutation -> (LOH) -> K-ras mutation -> Chrom 18 loss -> p53 loss: FAP ~70-80% CRC\n2. MMR -> (MSI) -> TGFβ, IIR, BAX: HNPCC 10-15% CRC\n3. p53 loss -> (Inflammation) -> Dysplasia (low---high) -> Carcinoma\nNormal epithelium -> Hyperproliferation ACF -> Adenoma -> Carcinoma in situ -> Invasion metastasis"
        prompt: "رتّب الـ chromosomal pathway:"
        steps: ["APC mutation", "K-ras mutation", "Chromosome 18 loss", "p53 loss"]
        why: "الـ APC هو بوابة الدخول (gatekeeper)، وبعده K-ras، وبعدين chromosome 18، والـ p53 في الآخر هو اللي بيحوّل الـ late adenoma لـ cancer."
      - kind: explain
        page: 171
        quote: "Cooking meats at high temperatures (frying, broiling, or grilling)"
        title: "الـ lifestyle: ليه اللحمة المشوية؟"
        text: |
          الكتاب، **lifestyle factors**: diet عالي في الـ ==red meats== (beef، pork، lamb، liver) والـ **processed meats**، وطبخ اللحمة على **حرارة عالية** (frying، broiling، grilling)، **physical inactivity**، **obesity**، **smoking**، و **heavy alcohol**.
          وعوامل تانية: **age فوق 50**، تاريخ شخصي لـ CRC أو polyps، **IBD**، **family history**، و inherited syndromes.

          التفسير المقبول (مش في الكتاب): الشوي على نار عالية بيكوّن مواد مسرطنة على سطح اللحمة (من البروتين والدهن اللي بيتحرق)، والـ processed meat فيه nitrites زي اللي شفتها في المعدة. والمواد دي بتعدّي على الـ mucosa بتاعة القولون مع البراز. والحركة القليلة بتبطّأ مرور البراز، فالـ mucosa بتتعرض أطول. يعني معظم عوامل الـ lifestyle بترجع لـ «إيه اللي بيلمس البطانة، وقد إيه».
