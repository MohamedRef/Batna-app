    src: { page: 478, quote: "Antiplatelet drugs, immunosuppressive agents, HIV, estrogen-containing birth control, and pregnancy are the most commonly listed triggers for ADAMTS13 autoantibody formation causing acquired TTP." }
    status: unverified
