  - id: neph.L05.lesson3
    title: "امنع الأول، وبعدين عالج صح"
    hook: "An ounce of prevention is worth a pound of cure. نص علاج الـ AKI هو إنك ما تعملش حاجات غلط."
    minutes: 10
    pages: [110, 112]
    topics: [prevention, treatment]
    goals:
      - "تختار الـ imaging وتمنع الـ CIN وتعرف ليه"
      - "تستخدم الـ aminoglycosides بأمان وتعرف ليه جرعة واحدة"
      - "تختار المحاليل والـ pressors وعلاج الـ HRS وتعرف ليه"
    status: unverified
    steps:
      - kind: explain
        page: 110
        title: "الـ imaging"
        quote: "DTPA and MAG3: renal function, urinary excretion and upper tract outflow"
        text: |
          - **Ultrasound:** للـ ==obstruction==.
          - **Doppler:** الـ renal blood flow.
          - **computed tomography (CT)**.
          - **dimercaptosuccinic acid (DMSA):** anatomy. **diethylenetriaminepentaacetic acid (DTPA) و mercaptoacetyltriglycine (MAG3):** function و excretion و upper-tract outflow.

          الخطوة الجاية بتشرح **ليه** الـ ultrasound أول حاجة.
      - kind: explain
        page: 110
        quote: "Renal ultrasound (useful for obstructive forms)"
        title: "ليه الـ ultrasound أول حاجة؟"
        text: |
          التفسير المقبول (مش في الكتاب): الـ **ultrasound** بيكشف الـ **hydronephrosis** بسرعة من غير contrast ولا إشعاع، والـ postrenal ده **أسرع سبب يترجع**، **فـ** مينفعش يفوت. وكمان بيقيس حجم الكلية: كلى صغيرة **يعني** المرض قديم (CKD) مش AKI. والـ **Doppler** بيشوف الدم الواصل، والـ **nuclear scans** بيفرّقوا الشكل (DMSA) عن الوظيفة والتصريف (DTPA، MAG3). والـ CT بالصبغة بنأجله لو الكلية أصلًا ضعيفة.
      - kind: table
        page: 110
        quote: "KDIGO guideline recommends using normal saline or sodium bicarbonate infusion Normal saline regimen: 1ml/kg/h for 12hours before and after procedure. Sodium bicarbonate regimen: 3ml/kg/hours forone hour before procedure and 1ml/kg/hours for 6 hours postcontrast."
        title: "منع الـ contrast-induced nephropathy"
        columns: [Regimen, How]
        rows:
          - ["Normal saline", "1 ml/kg/h, 12 h before and 12 h after"]
          - ["Sodium bicarbonate", "3 ml/kg/h × 1 h before, then 1 ml/kg/h × 6 h after"]
          - ["N-acetylcysteine", "600–1200 mg PO q12h × 2–3 days, 2 doses before"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 110
        quote: "Hydration to prevent contrast induced nephrotoxicity"
        title: "ليه المحاليل بتحمي من الـ contrast؟"
        text: |
          الكتاب: **hydration**؛ normal saline أو sodium bicarbonate حسب الـ regimens، و **N-acetylcysteine**.

          التفسير المقبول (مش في الكتاب):

          - المحلول بيزوّد سريان البول، **فـ** الصبغة تتخفف وتعدّي الـ tubule بسرعة بدل ما تقعد جنب الخلايا.
          - وبيقلّل الـ vasoconstriction اللي الصبغة بتعمله في أوعية الكلية.
          - الـ **bicarbonate** كانت الفكرة إنه بيقلّل الـ free radicals في البول القلوي، والـ **NAC** antioxidant. (والـ update اللي بعد كده بيقول الدراسات الكبيرة ما أثبتتش إنهم أحسن.)
      - kind: update
        page: 110
        quote: "N-acetylcysteine (600-1200mg orally every 12 hours for 2-3 days, the first two doses precontrast)"
        text: "الـ **PRESERVE trial (2018)**: الـ bicarbonate مش أحسن من الـ saline، والـ **N-acetylcysteine** مش أحسن من الـ placebo. الـ ACR-NKF 2020 بيوصّي بـ isotonic volume expansion للـ high risk ومش بيوصّي بالـ N-acetylcysteine. في الامتحان جاوب بالـ regimens اللي في الكتاب."
        ref: "PRESERVE trial 2018; ACR-NKF consensus 2020"
      - kind: explain
        page: 111
        title: "الـ ICU والـ aminoglycosides"
        quote: "KDIGO suggests using single dose daily rather than multiple-dose daily treatment regimens"
        text: |
          - في الـ intensive care unit (ICU): **glucose 110–149 mg/dl** بالـ insulin.
          - الـ **aminoglycosides**: ما تستخدمهاش لو فيه بديل أقل nephrotoxic، وابعد عنها فوق ==65 سنة==، والـ diabetes mellitus (DM)، والـ septic shock.
          - لو لازم: ==single daily dose==، و topical أو local (aerosol، beads) لو ينفع.

          الخطوة الجاية بتشرح **ليه** الجرعة الواحدة أأمن. التفسير المقبول (مش في الكتاب): السكر **110–149** مش أقل **لأن** الـ hypoglycemia في الـ ICU خطيرة هي كمان.
      - kind: explain
        page: 111
        quote: "KDIGO suggests using single dose daily rather than multiple-dose daily"
        title: "ليه جرعة واحدة في اليوم أأمن؟"
        text: |
          الكتاب: aminoglycosides بس لو مفيش بديل، ابعد عنها في **> 65 سنة** و DM و septic shock، و **single daily dose**، و topical/local لو ينفع. وفي الـ ICU: glucose **110–149 mg/dl**.

          التفسير المقبول (مش في الكتاب):

          - خلايا الـ proximal tubule بتمص الـ aminoglycoside بسرعة **محدودة**. الجرعة الواحدة الكبيرة بتعدّي أغلبها في البول، والجرعات الصغيرة المتكررة بتخلّي الخلية تمص طول اليوم.
          - والدوا بيقتل البكتيريا على حسب **الذروة**، **فـ** الجرعة الواحدة بتكسب في الناحيتين.
          - الـ **local** (aerosol، beads) بيوصل مكان العدوى من غير ما يعدّي على الكلية.
          - الـ **> 65 و DM و septic shock** كلية أضعف أو دم أقل، **يعني** خطر أعلى.
      - kind: explain
        page: 111
        title: "تلات قواعد عامة"
        quote: "Elimination of nephrotoxic agents (e.g., ACE inhibitors, ARBS, NSAIDs, aminoglycosides) if possible"
        text: |
          1. ظبّط الـ **hemodynamics**: fluids و vasopressors بعقل.
          2. ==وقّف الـ nephrotoxic agents==: angiotensin-converting enzyme (ACE) inhibitors، angiotensin II receptor blockers (ARBs)، non-steroidal anti-inflammatory drugs (NSAIDs)، aminoglycosides.
          3. ابدأ **renal replacement therapy (RRT)** لما يكون فيه indication.

          التفسير المقبول (مش في الكتاب): الترتيب ده منطقي **لأن** أغلب الـ AKI في المستشفى من نقص الدم الواصل أو من أدوية، فلو صلّحت الاتنين الكلية بتلحق ترجع لوحدها، والـ RRT بيشتري وقت لحد ما ده يحصل.
      - kind: explain
        page: 111
        title: "Fluids و pressors"
        quote: "KDIGO suggest using isotonic crystalloids rather than colloids (albumin or starches)"
        text: |
          - ==Isotonic crystalloids== قبل الـ colloids. الـ colloids لو محتاج volume كبير، أو cirrhosis مع spontaneous bacterial peritonitis (SBP)، أو burns.
          - الـ **albumin** renoprotective، والـ hyperoncotic **starch** nephrotoxic.
          - لو shock بعد الـ resuscitation: **mean arterial pressure 65–70**، والـ ==norepinephrine== أحسن من الـ dopamine (adverse events أقل).

          الخطوة الجاية بتشرح **ليه** الـ starch بيأذي وليه MAP 65.
      - kind: explain
        page: 112
        quote: "Colloids-Albumin is renoprotective and Hyperoncotic starch shows nephro-"
        title: "ليه crystalloids، وليه MAP 65؟"
        text: |
          الكتاب: **isotonic crystalloids** قبل الـ colloids، الـ **albumin** renoprotective والـ **hyperoncotic starch** nephrotoxic، الـ target **MAP 65–70**، والـ **dopamine** adverse events أكتر من الـ norepinephrine.

          التفسير المقبول (مش في الكتاب):

          - الـ **starch** بيتمص في خلايا الـ tubule ويعمل ورم فيها (osmotic nephrosis).
          - **MAP 65:** تحت الرقم ده الكلية بتفقد الـ **autoregulation**، **فـ** الـ GFR يمشي مع الضغط مباشرة.
          - الـ **dopamine** بيعمل **tachyarrhythmias** أكتر، وفايدته على الكلية ما اتثبتتش.
      - kind: check
        page: 112
        quote: "Colloids-Albumin is renoprotective and Hyperoncotic starch shows nephro-"
        question: "Which resuscitation choice does the book warn is nephrotoxic?"
        options:
          - "Hyperoncotic starch"
          - "Albumin"
          - "Isotonic crystalloids"
          - "Norepinephrine to MAP 65–70"
        answer: 0
        why:
          - "صح: **hyperoncotic starch shows nephrotoxicity**."
          - "الـ albumin الكتاب بيقول renoprotective."
          - "الـ isotonic crystalloids هي اللي الـ KDIGO بيقترحها."
          - "الـ norepinephrine adverse events أقل من الـ dopamine."
      - kind: aside
        tone: trap
        page: 112
        quote: "KDIGO recommends not using low-dose dopamine to prevent or treat AKI. (1A)"
        text: |
          "**Renal-dose dopamine**" إجابة غلط دايمًا: Kidney Disease: Improving Global Outcomes (KDIGO) ==بيوصّي ضدها== للـ prevention والـ treatment، **grade 1A**.
      - kind: explain
        page: 112
        title: "HRS و CRS"
        quote: "Bridge therapies that have shown promise include terlipressin (a vasopressin analog), combination therapy with octreotide (a somatostatin analog) and midodrine (an a 1-adrenergic agonist), and norepinephrine, all in combination with intravenous albumin (maximum 100 g/d)."
        text: |
          - **SBP:** الـ albumin مع الـ antibiotics ممكن يمنع الـ acute kidney injury (AKI).
          - **hepatorenal syndrome (HRS) bridge:** ==terlipressin==، أو octreotide + midodrine، أو norepinephrine، وكلهم مع **intravenous (IV) albumin** (max 100 g/d).
          - **Cardiorenal:** ظبّط القلب: inotropes، preload و afterload reduction، antiarrhythmics، و **intra-aortic balloon pump**.

          التفسير المقبول (مش في الكتاب): في الـ CRS بنظبط القلب **لأن** الكلية هنا ضحية الـ low output والـ congestion، زي ما شفنا في محاضرة الـ cardiorenal. والخطوة الجاية بتشرح الـ HRS.
      - kind: explain
        page: 112
        quote: "Bridge therapies that have shown promise include terlipressin (a vasopressin"
        title: "ليه الـ terlipressin والـ albumin في الـ HRS؟"
        text: |
          الكتاب: terlipressin، أو octreotide + midodrine، أو norepinephrine، **كلهم مع IV albumin**.

          التفسير المقبول (مش في الكتاب): في الـ cirrhosis أوعية البطن (splanchnic) **مفتوحة على الآخر**، **فـ** الدم بيتجمع هناك والكلية بتحس إن الجسم ناشف وتضيّق أوعيتها. الـ **terlipressin** والـ midodrine والـ norepinephrine بيضيّقوا الأوعية دي، **يعني** الدم يرجع للدورة. والـ **albumin** بيمسك المية جوه الأوعية. الاتنين مع بعض بيرجّعوا الدم للكلية. والـ octreotide بيقلّل الـ splanchnic vasodilators.
      - kind: try
        items: [neph.L05.065, neph.L05.066, neph.L05.067, neph.L05.068]
    recap:
      - "Ultrasound أول حاجة: hydronephrosis وحجم الكلية."
      - "CIN: saline أو bicarbonate حسب الـ regimen، و NAC."
      - "Aminoglycosides: بس لو مفيش بديل، single daily dose."
      - "Crystalloids؛ starch nephrotoxic؛ MAP 65–70؛ norepinephrine أحسن من dopamine؛ low-dose dopamine لأ (1A)."
      - "HRS: terlipressin أو octreotide + midodrine أو norepinephrine، مع albumin."
