  - id: hem.L09.lesson4
    title: "الـ PMF: لما النخاع يتحول ليفي"
    hook: "أسوأ prognosis في العيلة: megakaryocytes بتطلق cytokines والنخاع يتليّف. وإزاي تتأكد إنه PMF مش تليّف من سبب تاني."
    minutes: 9
    pages: [144, 146]
    topics: [pmf-biology, pmf-criteria]
    goals:
      - "تشرح ليه النخاع بيتليّف في الـ PMF ودور الـ TPO"
      - "تكتب WHO criteria (major و minor) وتعرف كل واحد بيستبعد إيه"
      - "تعدّ الـ differential of marrow fibrosis"
    status: unverified
    steps:
      - kind: explain
        page: 144
        title: "الأخ الأخطر"
        quote: "PMF has the poorest prognosis of the MPNs. PV and ET can develop into a condition that resembles PMF, usually after a latency of many years.\nJAK2 V617F mutation has been identified in approximately half the cases of PMF and ET. Also, many patients with JAK2-unmutated ET or PMF carry CALR mutations, and a smaller number have MPL mutations.\nPatients with PMF harbor more mutations, have more cytogenetic abnormalities and display an increased risk of leukemic transformation compared to PV and ET."
        text: |
          - ==Primary myelofibrosis (PMF) has the poorest prognosis of the myeloproliferative neoplasms (MPNs)==.
          - الـ polycythaemia vera (PV) والـ essential thrombocythaemia (ET) ممكن يوصلوا لصورة شبهه بعد **latency of many years**.
          - Janus kinase 2 (JAK2) V617F في حوالي النص، وكتير من الـ JAK2-unmutated عندهم CALR، وأقل thrombopoietin receptor gene (MPL).

          ليه هو الأسوأ؟ الكتاب نفسه بيدّيك السبب: عنده **طفرات أكتر**، و **cytogenetic abnormalities** أكتر، وخطر **leukemic transformation** أعلى من PV و ET. يعني الـ clone هنا **أخطر وراثيًا**، مش بس بيعمل خلايا كتير.
      - kind: figure
        page: 144
        quote: "Primary myelofibrosis is a clonal MPN of the pluripotent hematopoietic stem cell, in which progressive bone marrow fibrosis is thought to be secondary to the release of pro-inflammatory cytokines from abnormal clonal cells (primarily megakaryocytes), which stimulate fibroblast proliferation and fibrosis."
        title: "التليف بيحصل إزاي؟"
        alt: "Vertical chain. Clonal megakaryocytes, boosted by high TPO, release TGF-beta1, PDGF and VEGF. These stimulate fibroblasts, giving marrow fibrosis. The failing marrow leads to extramedullary hemopoiesis in spleen and liver, causing splenomegaly and a leukoerythroblastic blood film with teardrop cells."
