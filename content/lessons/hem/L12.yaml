  # ------------------------------------------------------------------
  - id: hem.L12.lesson6
    title: "السلحفاة والأرنب: follicular و DLBCL"
    hook: "واحد بيعيش 10 سنين في هدوء، والتاني بيجري في أسابيع بس ممكن يتعالج. ده الفرق بين الـ indolent والـ aggressive."
    minutes: 10
    pages: [204, 206]
    topics: [follicular, dlbcl]
    goals:
      - "تعرف الـ follicular: الـ biology والـ course والعلاج"
      - "تعرف الـ DLBCL: الـ histology والـ prognosis والـ R-CHOP"
      - "تفهم ليه الـ aggressive ممكن يتشفي والـ indolent غالبًا لأ"
    status: unverified
    steps:
      - kind: explain
        page: 204
        quote: "Low-grade non-Hodgkin's Lymphoma (Indolent Lymphoma). This is the most common form of indolent NHL and is associated with t (14;18) translocation and constitutive BCL-2 expression in the great majority of cases."
        title: "Follicular: السلحفاة"
        text: |
          ==Follicular lymphoma== أشهر **indolent Non-Hodgkin lymphoma (NHL)** (low-grade).

          - **t(14;18)** و **BCL-2** شغّال على طول في معظم الحالات.
          - Middle-aged أو elderly.
          - **Benign course لسنين (حوالي 10)** مع painless lymphadenopathy.
          - Histology: follicular pattern من ==small cleaved B cells==.

          كل معلومة هنا متربطة باللي قبلها: الـ **BCL-2** بيمنع الموت (ص 191)، فالخلايا **صغيرة وهادية** بتتراكم على مهل، فالـ course **benign لسنين**، والغدة **painless** لأنها بتكبر ببطء. والـ cleaved nucleus هو نفس اللي في جدول ص 200.
      - kind: explain
        page: 204
        quote: "The majority of patients will have stage III or IV disease. However, sudden transformation may occur to aggressive diffuse tumours which are sometimes associated with a leukemic phase."
        title: "المفارقة"
        text: |
          معظمهم بييجوا ==stage III أو IV==، ومع ذلك بيعيشوا سنين.

          الخطر الحقيقي: **sudden transformation** لـ **aggressive diffuse tumour**، وأحيانًا مع leukaemic phase.

          ليه بييجي متأخر؟ لأنه **مش بيوجع ومش بيعمل أعراض**، فبيلف في الجسم سنين قبل ما حد يلاحظه. وليه بيتحول؟ التفسير المقبول (مش في الكتاب): الـ clone عايش سنين طويلة ومش بيموت، فبيلحق يجمّع mutations تانية زي اللي بتزوّد الانقسام، فيقلب من «مش بيموت» لـ «بيجري» كمان.
      - kind: aside
        tone: analogy
        page: 204
        quote: "The disease is characterized by a benign course for many years (around 10 years) presenting with painless lymphadenopathy; which is characterized by being of follicular or nodular pattern showing small cleaved B-cell lymphocytes."
        text: "الـ follicular زي السلحفاة (benign course، painless lymphadenopathy لسنين): منتشرة في كل حتة (stage IV) بس ماشية براحة. الـ BCL-2 بيخلّي الخلايا ماتموتش، مش إنها تجري. والـ transformation هو لما السلحفاة تقلب أرنب."
      - kind: explain
        remind: [hem.L12.070]
        page: 204
        quote: "Treatment is usually with single oral agents i.e. Chlorambucil or Cyclophosphamide, Vincristine and Predisolone (CVP) combination. Fludarabine alone or in combination with Cyclophosphamide or Mitozantrone could be used."
        title: "علاج الـ follicular في الكتاب"
        text: |
          - **Single oral agent**: chlorambucil.
          - أو ==CVP==: cyclophosphamide، vincristine، prednisolone.
          - **Fludarabine** لوحده أو مع cyclophosphamide أو mitoxantrone.
          - ==Rituximab (anti-CD20)== لوحده أو مع الـ chemo.

          ليه علاج **خفيف** كده (حباية بالبُق) مع إن المرض stage IV؟ التفسير المقبول (مش في الكتاب): الـ chemo بيقتل الخلايا اللي **بتتقسم**، والـ follicular خلاياه أغلبها مش بتتقسم، فالـ chemo القوي ما بيكسبش كتير وبيأذي. فالهدف إنك **تسيطر** عليه سنين بأقل أذى. والـ rituximab شغال لأن الخلايا B cells عليها CD20 (ص 192).
      - kind: update
        page: 204
        quote: "Rituximab (Anti CD20) is also effective alone or in combination with chemotherapy."
        text: "دلوقتي الـ advanced symptomatic أو الـ high-burden بياخد غالبًا rituximab (anti-CD20) + chemo، زي bendamustine أو cyclophosphamide, doxorubicin, vincristine, prednisolone (CHOP)، والـ low-burden ممكن watch and wait. في الامتحان: إجابة الكتاب."
        ref: "ESMO Clinical Practice Guidelines for follicular lymphoma 2021"
      - kind: explain
        page: 205
        quote: "It is a rapidly progressive lymphadenopathy (high–grade Lymphoma). It is aggressive but potentially curable. Histologically, the disorder is characterized by the presence of Large cells of B-cell origin (centroblasts or immunoblasts). Cases associated with 3q27 translocation showing BCL-6 over expression, have a relative good prognosis. DNA microarray analysis can give prognostic information."
        title: "DLBCL: الأرنب"
        text: |
          ==Diffuse large B-cell lymphoma==: rapidly progressive، **high-grade**.

          - **Aggressive but potentially curable**.
          - Large B cells: **centroblasts أو immunoblasts**.
          - **3q27 translocation** مع **BCL-6** overexpression = prognosis أحسن نسبيًا.
          - الـ **deoxyribonucleic acid (DNA) microarray** بيدي prognostic information.

          إزاي aggressive و curable في نفس الوقت؟ التفسير المقبول (مش في الكتاب): نفس السبب اللي خلّى الـ follicular صعب يتشفي بالعكس. الـ DLBCL خلاياه **بتتقسم كتير**، والـ chemo بيقتل اللي بيتقسم، فبيقضي على معظم الـ clone. السرعة اللي بتخوّف هي نفسها نقطة ضعفه.
      - kind: figure
        page: 205
        quote: "Iliac crest trephine biopsy in lymphocytic lymphoma. Prominent nodules of lymphoid tissue are seen in the intertrabecular space and paratrabecular areas."
        title: "صورة الكتاب: الـ lymphoma في النخاع"
        image: { file: hem/L12-trephine.webp, book: true }
        alt: "Book low-power photomicrograph of an iliac crest trephine biopsy: pale pink bone trabeculae and fat spaces, with two large dense purple nodules of lymphoid cells filling the spaces between and alongside the trabeculae."
        caption: |
          عينة نخاع من الـ iliac crest في **lymphocytic lymphoma**:

          - **البمبي الفاتح** اللي بيقطع الصورة = **bone trabeculae**، والفراغات البيضا = **fat**.
          - **الكتلتين البنفسجي الغامقة** (في النص وتحت) = ==nodules== من الـ lymphoid tissue، قاعدة **بين** الـ trabeculae (intertrabecular) و **لازقة فيها** (paratrabecular).

          وده ليه الكتاب بيقول إن الـ ==bone marrow biopsy== مهمة في staging الـ NHL: النخاع بيتصاب كتير، والـ trephine بيورّي الـ nodules دي اللي الـ aspirate ممكن يفوّتها.
      - kind: explain
        page: 206
        quote: "The disorder occurs at all ages but becomes commoner in later life. It represents one-third of all Lymphomas. Patients may present with night sweats, fever, weight loss and lymphadenopathy or with extranodal involved sites such as GIT, testis, brain or bone."
        title: "مين وإزاي؟"
        text: |
          - كل الأعمار، بس أكتر مع الكبر. ==One-third== من كل الـ lymphomas.
          - B symptoms و lymphadenopathy، أو **extranodal**: Gastrointestinal tract (GIT)، testis، brain، bone.

          لاحظ إن الـ extranodal ده بالظبط اللي في مقارنة ص 204: الـ NHL بيروح الـ GIT كتير والـ CNS أحيانًا. فلو جالك راجل كبير بـ testicular mass أو brain lesion وطلع lymphoma، أول اسم يجي في دماغك DLBCL لأنه أشهر واحد (تلت الـ lymphomas).
      - kind: figure
        page: 206
        title: "صورة الكتاب: أربع lymphomas تحت التكبير"
        image: { file: hem/L12-nhl-high-power.webp, book: true }
        alt: "Four book high-power photomicrographs of lymph node biopsies, labelled a to d. (a) Top left: sheets of small round lymphocytes with dark round nuclei. (b) Top right: small cells with irregular, angular nuclei. (c) Bottom left: larger cells with round nuclei and prominent nucleoli, with mitoses. (d) Bottom right: very large cells with a single big nucleolus and plenty of dark-staining cytoplasm."
        caption: |
          أربع صور high power، والحروف تحت كل واحدة. الكتاب بيوصفها كده:

          - **(a) فوق شمال**: **lymphocytic lymphoma**: lymphocytes **صغيرة** نواتها مدورة والـ chromatin متكتل.
          - **(b) فوق يمين**: **mantle cell lymphoma**: خلايا صغيرة نواتها **مزوّية** (angular) = **centrocytes**.
          - **(c) تحت شمال**: ==DLBCL==: الخلايا **أكبر بكتير** من الـ lymphocytes، nucleoli واضحة جنب الغشا (**centroblasts**)، و mitoses.
          - **(d) تحت يمين**: DLBCL برضه: خلايا **ضخمة** بـ nucleolus **واحد** كبير و cytoplasm غامق (**immunoblasts**).

          قارن الحجم من (a) لـ (d): ده الفرق بين الـ indolent والـ ==aggressive== اللي بتشوفه بعينك.
      - kind: mnemonic
        page: 206
        quote: "Treatment is with combination chemotherapy of Cyclophosphamide, Doxorubicin (Hydroxydaunorubicin) Vincristine (Oncovin) and Predisolone (CHOP).This CHOP combination has been considered the gold standard regimen for Large B-cell Lymphoma."
        word: "CHOP"
        parts:
          - { key: "C", text: "Cyclophosphamide" }
          - { key: "H", text: "Hydroxydaunorubicin (doxorubicin)" }
          - { key: "O", text: "Oncovin (vincristine)" }
          - { key: "P", text: "Prednisolone" }
        hook: "R-CHOP: الـ R (rituximab) جه يقطّع (chop) الـ CD20. كل 3 أسابيع، 6 أو 8 courses."
      - kind: explain
        page: 206
        quote: "Recently, the addition of CD20 antibody (Rituximab) to CHOP has improved survival rates. The treatment is administered every 3 weeks for a total of six or eight courses."
        title: "العلاج"
