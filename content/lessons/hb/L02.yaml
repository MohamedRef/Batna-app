            answer: 0
            why: "الـ **HVPG** هو الوحيد الـ validated للشدة الدقيقة وللـ haemodynamic response. الـ LSM والـ spleen stiffness بيعملوا risk stratification بس."
      - kind: update
        page: 35
        quote: "In patients with cACLD due to untreated viral hepatitis, HIV-HCV coinfection, alcohol, NAFLD, PBC and PSC, the finding of LSM by TE <20 kPa and platelet count >150 G/L (Baveno VI criteria) is a validated tool to rule-out high-risk varices and avoid endoscopic screening."
        text: |
          الكتاب بيقول أكتر من 20–25 kPa للـ CSPH. **Baveno VII** بيحدد الأرقام أكتر:

          - **Rule-in للـ CSPH**: LSM ≥ 25 kPa.
          - **Rule-out للـ CSPH**: LSM ≤ 15 kPa مع platelets 150 أو أكتر (وده نفس اللي في صورة الكتاب صفحة 30).
          - **تجنّب المنظار**: فضّل قاعدة الـ أقل من 20 kPa و أكتر من 150.

          في الامتحان اكتب رقم الكتاب.
        ref: "Baveno VII consensus, 2021"
      - kind: explain
        page: 36
        quote: "In patients with cACLD, liver stiffness at diagnosis should be used in addition to liver function tests to stratify the risk of clinical decompensation and mortality (LoE 1, strong recommendation)."
        title: "الـ CT والـ prognosis"
        text: |
          **الـ CT والـ varices**
          - الـ **CT** مش للـ primary screening للـ oesophageal و gastric varices. المنظار هو الأساس.
          - بس لو عملت CT لسبب تاني (مثلًا متابعة كتلة)، دوّر على الـ varices واكتبها في التقرير. معلومة ببلاش، ما ترميهاش.

          **الـ prognosis**
          - الـ ==liver stiffness at diagnosis== مع الـ liver function tests بتعمل risk stratification للـ clinical decompensation and mortality (strong recommendation).
          - **Annual repeated LSM** ممكن تحسّن التقدير (weak recommendation)، لأن الرقم اللي بيعلى سنة بعد سنة بيقول إن المرض ماشي لقدام.
      - kind: check
