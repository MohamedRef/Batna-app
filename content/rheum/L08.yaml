    pass: 5
    hook: "PAN الـ minor «جلد، عضل، ضغط، عصب، كلى، خصية، وعضو تاني»: livedo أو nodules، myalgia، hypertension، neuropathy، urine غلط أو GFR أقل من نص الطبيعي، testicular pain، وvasculitis في GI أو قلب أو رئة أو CNS."
    src: { page: 141, quote: "A systemic illness accompanied by either a biopsy showing small and mid- size artery necrotizing vasculitis or angiographic abnormalities (aneurysms or occlusions) (mandatory criteria) (should include conventional angiography if magnetic resonance angiography is negative), plus at least two of the following seven criteria:\n  Skin involvement (livedo reticularis, tender subcutaneous nodules, other vasculitic lesions).\n  Myalgia or muscle tenderness.\n  Systemic hypertension, relative to childhood normative data.\n  Mononeuropathy or polyneuropathy.\n  Abnormal urine analysis and/or impaired renal function (glomerular filtration rate<50% of normal for age).\n  Testicular pain or tenderness.\n  Signs or symptoms suggesting vasculitis of any other major organ system (gastrointestinal, cardiac, pulmonary, or central nervous system)." }
    status: unverified
  - id: rheum.L08.109
