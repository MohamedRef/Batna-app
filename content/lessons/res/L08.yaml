        quote: "Solve the Following Problems: Study of physicians comparing the occurrence of lung cancer in smokers to that in non smokers.\n  a) Cross sectional\n  b) Correlation study\n  c) Prospective cohort\n  d) Case control\n  e) Retrospective cohort"
