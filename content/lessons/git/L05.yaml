      - "Sessile أو flat: تحت 10 mm cold snare en bloc؛ 10 mm+ advanced imaging للـ invasion الأول."
      - "10-19 mm: hot snare مع submucosal injection؛ 20 mm+: en bloc EMR (piecemeal لو لازم)؛ فوق 40 أو complex: expert center."
