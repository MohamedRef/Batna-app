    kind: card
    topic: tx-drugs
    front: Which antihypertensives are safe in transplant pregnancy, and which beta-blocker is avoided?
    back: Methyldopa, hydralazine, labetalol and calcium channel blockers are safe; atenolol is avoided because of fetal growth retardation.
    src: { page: 392, quote: "Angiotensin II receptor antagonists and angiotensin-converting enzyme inhibitors during pregnancy are contraindicated because of their fetal teratogenic effects and should be discontinued before conception. Adverse effects might include oligohydramnios, intrauterine growth retardation, skull hypoplasia, limb deformities, fetal renal dysplasia, pulmonary hypoplasia, and patent ductus arteriosus.(111) Methyldopa, hydralazine, and labetalol are safe during pregnancy. Similarly, calcium channel blockers can be used. Atenolol is better avoided because of the possibility of fetal growth retardation.(109, 112)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.196
    kind: card
    topic: tx-drugs
    front: What preventive drugs are given to a transplant recipient planning pregnancy?
    back: Folic acid from 3 months before, low-dose aspirin against preeclampsia, and prophylactic low-molecular-weight heparin if proteinuria >2 g.
    src: { page: 392, quote: "(2) Other medications Folic acid is started 3 months before a planned pregnancy, as well as aspirin in small doses to reduce preeclampsia. Prophylactic dose low-molecular weight heparin is recommended if proteinuria more than 2 g as proteinuria is a risk factor for venous thromboembolism.(109)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.197
    kind: card
    topic: tx-drugs
    front: What does the book advise about valganciclovir and valaciclovir in pregnancy?
    back: Ganciclovir is toxic and teratogenic in animals. Stop valaciclovir before conception (though used off-label without reported teratogenicity); avoid valganciclovir unless maternal benefit outweighs fetal risk.
    src: { page: 393, quote: "twice the human exposure level. However, there are no available human data on the use of valganciclovir (Valcyte) or ganciclovir in pregnant women causing drug-associated risks. It is recommended to discontinue Valaciclovir before conception.(113) Nevertheless, valaciclovir has been used off-label during pregnancy with no reported teratogenicity effects. Therefore, valganciclovir should not be used in pregnancy unless the therapeutic benefit for the mother outweighs the potential risk of any teratogenic damage to the fetus.(114)" }
    status: unverified
  - id: neph.L11.198
    kind: card
    topic: tx-drugs
    front: Is cotrimoxazole safe in pregnancy per the book?
    back: Folate inhibition raised concern for neural tube, cardiac, urinary and oral cleft defects, but Ford's meta-analysis found rates no higher than the general population, suggesting it is safe.
    src: { page: 393, quote: "(B) Cotrimoxazole (trimethoprim/sulfamethoxazole) Some studies suggest that cotrimoxazole exposure during pregnancy is associated with congenital anomalies, such as neural tube defects, cardiovascular defects, urinary tract defects, and oral clefts, due to the inhibition of folate synthesis. Nevertheless, Ford and colleagues in a meta-analysis of all published data concerning the use of cotrimoxazole during pregnancy, found a high level of heterogeneity between different studies and the overall pooled prevalence did not exceed the reported rates in the general population, suggesting its safe use during conception.(115)" }
    status: unverified
  - id: neph.L11.199
    kind: mcq
    topic: tx-drugs
    stem: "A transplant recipient planning pregnancy takes sirolimus, prednisolone, ramipril, atenolol and cotrimoxazole. Which drug may be continued according to the book?"
    options:
      - Sirolimus
      - Ramipril
      - Atenolol
      - Prednisolone
      - None of them
    answer: 3
    why:
      - mTOR inhibitors are withdrawn and switched to a CNI plus prednisolone.
      - ACE inhibitors are teratogenic and stopped before conception.
      - Atenolol is avoided because of fetal growth retardation.
      - "Correct: prednisolone does not suppress fetal corticotropin and is safe. (Cotrimoxazole is also judged safe by meta-analysis.)"
      - Prednisolone is safe.
    src: { page: 391, quote: "In experimental animals, mTOR inhibitors increase fetal mortality rates. Nevertheless, there is lack of experience on pregnant transplant recipients treated with these drugs to quantify their precise risks in humans. Although the FDA categorizes these medications as category C (risk of teratogenicity cannot be ruled out due to lack of information), there have been several published reports of healthy babies born to mothers taking mTOR inhibitors, (107,108) and thus their use during pregnancy should depend on clinician clinical experience, confidence, and their clinical judgment. Because of the lack of safety data, clinical practice guidelines for pregnancy and kidney disease advise against using sirolimus and everolimus in pregnant transplant recipients. (109) Renal transplant recipients on mTOR inhibitor-based immunosuppression should be switched over to safer regimens including CNI and prednisolone. CNI is considered safe with no proven teratogenicity or mutagenicity data in animals or humans. There have been reports of intrauterine growth retardation and prematurity in some cases with cyclosporine use, probably related to chronic (109) vasoconstriction. CNI metabolism might enhance during pregnancy necessitating close monitoring and dose adjustment. Despite its ability to cross the human placenta, prednisolone does not suppress fetal corticotropin, and no consistent anomalies have been detected in the offspring of transplant women (110) receiving corticosteroids during pregnancy, making it safe during pregnancy." }
    status: unverified
  # ---------- p394-395: delivery and breastfeeding ----------
  - id: neph.L11.200
    kind: card
    topic: tx-delivery
    front: What is the preferred mode of delivery in a kidney transplant recipient, and why?
    back: Normal vaginal delivery without abdominal compression; the graft lies in the false pelvis, so it rarely obstructs labor or gets injured. Cesarean only for obstetric reasons.
    src: { page: 394, quote: "Labor and delivery Normal vaginal delivery without abdominal compression is the safest and recommended method of delivery in transplant recipients, as the renal allograft is placed in the false pelvis, and there is little risk of obstruction of the birth canal or mechanical injury to the allograft. Spontaneous labor can be allowed up to 38–40 weeks if there are no obstetrical complications. Cesarean section is indicated only for standard obstetric indications.(117)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.201
    kind: cloze
    topic: tx-delivery
    text: "Spontaneous labor can be allowed up to {{c1::38-40 weeks}}. During labor give hydrocortisone {{c2::100 mg every 6 h}} to cover stress and prevent postpartum rejection."
    src: { page: 394, quote: "In the perinatal period, the steroid dose should be augmented to cover the stress of labor and to prevent postpartum rejection. Hydrocortisone, 100 mg every 6 h, should be given during labor and delivery. Maternal hypertension and fluid balance should be monitored carefully. Few cases of postpartum acute renal failure resembling hemolytic uremic syndrome have been described.(117,118)" }
    status: unverified
    tags: [high-yield, numbers]
  - id: neph.L11.202
    kind: card
    topic: tx-delivery
    front: Which drugs did the 2019 pregnancy and renal disease guideline allow during breastfeeding?
    back: Prednisolone, azathioprine, tacrolimus, cyclosporine, captopril, enalapril, amlodipine, nifedipine, labetalol and atenolol (grade 1C).
    src: { page: 394, quote: "Posttransplant breastfeeding CNIs and other immune suppressants may enter the breast milk, thus some had advised against lactation in transplant recipients, as the adverse consequences on infants are unknown, though none have been reported to date. Indeed, Grekas et al. (119) did not report any risk of infections, hematological complications, or growth retardation in infants of two lactating mothers taking maintenance doses of prednisolone and azathioprine. Similarly, different analyses confirmed the safety of steroids and CNI in breastfeeding mothers with no reported side effects in infants.(120-121) Clinical practice guidelines on pregnancy and renal diseases, published in 2019, recommended breastfeeding in females taking prednisolone, azathioprine, tacrolimus, cyclosporine, captopril, enalapril, amlodipine, nifedipine, labetalol, and atenolol (graded 1C recommendation).(109)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.203
    kind: card
    topic: tx-delivery
    front: Which immunosuppressants have no breastfeeding data?
    back: MMF/MPA, sirolimus and everolimus.
    src: { page: 395, quote: "MMF/MPA, though contraindicated during pregnancy, there no human research has been conducted on the effects of these medications on breastfeeding. Similarly, sirolimus and everolimus have not been tested in breastfeeding mothers." }
    status: unverified
  - id: neph.L11.204
    kind: mcq
    topic: tx-delivery
    stem: "A kidney transplant recipient on prednisolone 5 mg, tacrolimus and azathioprine goes into spontaneous labor at 38 weeks. What is correct?"
    options:
      - Elective cesarean because the graft blocks the birth canal
      - Vaginal delivery with hydrocortisone 100 mg every 6 h, and she may breastfeed
      - Stop tacrolimus during labor
      - Vaginal delivery, but breastfeeding is forbidden on tacrolimus
      - Give fundal pressure to shorten the second stage
    answer: 1
    why:
      - The graft sits in the false pelvis; cesarean is for obstetric indications only.
      - "Correct: stress-dose steroids cover labor, and these drugs are compatible with breastfeeding."
      - Immunosuppression continues; stopping it risks rejection.
      - The 2019 guideline allows breastfeeding on tacrolimus.
      - Delivery should be without abdominal compression.
    src: { page: 394, quote: "Labor and delivery Normal vaginal delivery without abdominal compression is the safest and recommended method of delivery in transplant recipients, as the renal allograft is placed in the false pelvis, and there is little risk of obstruction of the birth canal or mechanical injury to the allograft. Spontaneous labor can be allowed up to 38–40 weeks if there are no obstetrical complications. Cesarean section is indicated only for standard obstetric indications.(117)" }
