        options: ["MRI: highly sensitive but nonspecific", "Angiography: 100% specific for CNS arteritis", "CT: diagnostic when normal", "PET: replaces lumbar puncture"]
        answer: 0
        why:
          - "صح: الـ MRI test of choice، حساس جدًا (نادر يطلع طبيعي) بس مش specific."
          - "الكتاب بيقول NO angiographic picture is 100% specific."
          - "الـ CT مش مذكور، والصورة الطبيعية مش بتشخّص حاجة."
          - "مفيش حاجة بتغني عن الـ LP في الـ PACNS."
      - kind: explain
        page: 159
        title: "المفاصل في الـ Behçet: ليه مهمة رغم إنها مش في الـ criteria؟"
        quote: "Multiple-joint involvement is common."
        text: |
          الكتاب: **أكتر من نص العيانين** بيجيلهم synovitis أو arthritis أو arthralgia، والـ **multiple-joint involvement is common**، والصورة: وجع، tenderness، تورم، حركة محدودة، سخونية، و morning stiffness. وفي الأطفال الـ arthritis هي أشهر minor feature (11 من 40).

          التفسير المقبول (مش في الكتاب): المفاصل **مش** في الـ 1990 criteria لأنها مش مميزة؛ نص أمراض الروماتيزم بتعمل نفس الشكل. بس لو شاب عنده قرح في البق بتتكرر ومفاصل متورمة، ==فكّر في Behçet== قبل ما تقول rheumatoid arthritis، واسأل عن القرح التناسلية والعين.
      - kind: explain
        page: 159
        title: "PACNS: ليه التعريف كله استبعاد؟"
        quote: "No evidence of systemic vasculitis or any condition that could elicit the"
        text: |
          الكتاب بيقول الـ **primary angiitis of the CNS (PACNS)** = neurologic deficit **مكتسب ومش مفسّر** مع:
          - (a) شكل angiitis في الـ CNS بالـ **angiography أو الـ histopathology**.
          - (b) **No evidence of systemic vasculitis** أو أي حاجة تانية تعمل نفس الشكل.

          التفسير المقبول (مش في الكتاب): كلمة **primary** معناها إن المخ هو العضو **الوحيد**. لو فيه vasculitis في الكلية أو الجلد، يبقى ده systemic vasculitis واصل للمخ، وده علاجه وتوقّعه مختلف. وكتير من اللي بيعمل نفس شكل الـ angiography (spasm، infection، atherosclerosis) ==مش التهاب==، فلازم يتشال الأول.
      - kind: reveal
        page: 160
        prompt: "ليه الكتاب بيقول إن الـ PACNS اللي ما استجابش للـ cyclophosphamide غالبًا مش PACNS؟"
        quote: "The must-rule-outs are infection and malignancy."
        answer: |
          الكتاب: الـ **must-rule-outs** هما **infection و malignancy**، والـ **failure to respond to cyclophosphamide** غالبًا معناه **alternative diagnosis**، والـ brain biopsy مفيدة للتشخيص ولاستبعاد الـ mimics، والموضوع **multispeciality**.

          التفسير المقبول (مش في الكتاب): الـ vasculitis الحقيقية بتهدى مع الـ immunosuppression. لو العيان ساء رغم الـ cyclophosphamide، يبقى الالتهاب **مش هو المشكلة**: عدوى أو lymphoma في المخ مثلًا، والـ immunosuppression هنا ==بتأذي== مش بتعالج. عشان كده الـ LP والـ biopsy قبل العلاج مش رفاهية، ومحتاج neurology و rheumatology و radiology مع بعض.
      - kind: figure
        page: 160
        title: "الـ PACNS في الـ MRI"
        image: { file: rheum/L08-pacns-mri.webp, book: true }
        alt: "Axial brain MRI: several bright white patches in the brain substance on both sides; two printed arrows point to a large patch at the back on the left of the image and a smaller one at the front on the right."
        caption: |
          MRI للمخ، والسهمين المطبوعين بيشاوروا على **بقعتين بيض** في مكانين بعيد عن بعض (ورا وقدام)، وفيه بقع تانية.

          دي **strokes في territories مختلفة**، وده اللي الكتاب بيقول يخليك تشك. بس افتكر: الـ MRI ==sensitive بس مش specific==، فالصورة دي لوحدها مش تشخيص؛ لازم LP وغالبًا biopsy.
