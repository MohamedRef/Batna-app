  - id: dm.L09.lesson2
    title: "Metformin: الدوا اللي بيقفل حنفية الكبد"
    hook: "أرخص دوا، ومفيهوش hypoglycemia، وفوائده برّه السكر كتير. بس عنده قواعد مع الـ contrast والعمليات."
    minutes: 9
    pages: [106, 109]
    topics: [metformin]
    goals:
      - "تشرح الـ mechanism من غير ما تقع في فخ insulin secretion"
      - "تعدّ الـ non-glycemic benefits وأرقام UKPDS"
      - "تعرف امتى توقفه: eGFR <30، contrast، anesthesia"
    status: unverified
    steps:
      - kind: explain
        page: 106
        title: "مش بيطلّع insulin"
        quote: "The precise mode of action of metformin remains controversial; most certainly, it does not stimulate insulin secretion."
        text: |
          من الـ **biguanides** (phenformin، metformin، buformin) فاضل **metformin** بس. بينزّل الـ HbA1c حوالي **1.5%**.

          الـ mechanism بالظبط controversial، بس المؤكد إنه ==does not stimulate insulin secretion==. علشان كده مفيش hypoglycemia لوحده.
      - kind: figure
        page: 107
        quote: "Increases GLUT4 in the plasma membrane of insulin-resistant cells. May lead to anorexia, and it decreases intestinal glucose absorption."
        title: "Metformin شغال فين؟"
        alt: "Three stacked panels. Liver: gluconeogenesis blocked, the main effect. Muscle: more anaerobic glycolysis and more GLUT4 in the membrane. Gut: less glucose absorption and anorexia."
        caption: "التأثير الرئيسي في الـ ==liver==: يقفل الـ gluconeogenesis. والعضلات بتاخد glucose أكتر، والأمعاء بتمتص أقل."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <rect x="15" y="10" width="300" height="70" rx="12" class="fg-acc"/>
            <text x="30" y="35" class="t-b t-acc">Liver (main effect)</text>
            <text x="30" y="55" class="t-sm">Gluconeogenesis blocked</text>
            <text x="30" y="70" class="t-sm">→ less hepatic glucose output</text>
            <rect x="15" y="95" width="300" height="70" rx="12" class="fg-box"/>
            <text x="30" y="120" class="t-b">Muscle and peripheral tissue</text>
            <text x="30" y="140" class="t-sm">Anaerobic glycolysis ↑</text>
            <text x="30" y="155" class="t-sm">Insulin-mediated uptake ↑, GLUT4 in membrane ↑</text>
            <rect x="15" y="180" width="300" height="70" rx="12" class="fg-box"/>
            <text x="30" y="205" class="t-b">Gut and appetite</text>
            <text x="30" y="225" class="t-sm">Intestinal glucose absorption ↓</text>
            <text x="30" y="240" class="t-sm">May cause anorexia</text>
          </svg>
      - kind: aside
        tone: trap
        page: 106
        quote: "inhibiting gluconeogenesis: directly or through insulin sensitizing effect (main effect)."
        text: "سطر الكتاب مكتوب «Increases hepatic glucose production by inhibiting gluconeogenesis»، وده غلط مطبعي واضح: لو ==inhibiting gluconeogenesis== يبقى الـ hepatic glucose output **بيقل**. في الامتحان اكتب: decreases hepatic glucose output by inhibiting gluconeogenesis (main effect)."
      - kind: explain
        page: 107
        title: "فوايد برّه السكر"
        quote: "Decreases the antifibrinolytic factor PAI-1."
        text: |
          الجرعة **500–2500 mg/d**. والـ **non-glycemic benefits** (سؤال كتاب):

          - **Weight**: neutral، وممكن ينزّل.
          - **No hypoglycemia** لوحده أو مع non-secretagogues.
          - **Lipids**: TG ↓ و LDL-C ↓.
          - ==PAI-1== ↓ و endothelial function أحسن (anti-atherosclerotic).
          - **PCOS**: بيحسّن الـ ovulation.
          - **Anticancer** effect، و potential CV benefit.
          - primary/secondary failure نادر، ورخيص.
      - kind: mnemonic
        page: 107
        quote: "Improves ovulatory function in PCOS."
        word: "WHALE PC"
        parts:
          - { key: "W", text: "Weight neutral (may lose)" }
          - { key: "H", text: "Hypoglycemia: none alone" }
          - { key: "A", text: "Anti-atherosclerotic: endothelium better, PAI-1 down" }
          - { key: "L", text: "Lipids: TG and LDL-C down" }
          - { key: "E", text: "Economic (inexpensive), rare failure" }
          - { key: "P", text: "PCOS ovulation improves" }
          - { key: "C", text: "Cancer: anticancer effect, plus CV benefit" }
        hook: "الـ metformin **حوت** (WHALE) في فوايده، ومعاه **PC**."
      - kind: table
        page: 107
        quote: "32% -----in any DM-related endpoint - 42% -----in DM-related deaths - 36% -----in all cause mortality - 39% -----in the risk of MI"
        title: "UKPDS 1998 مع metformin"
        columns: [Endpoint, Reduction]
        rows:
          - [Any DM-related endpoint, "32%"]
          - [DM-related deaths, "42%"]
          - [All-cause mortality, "36%"]
          - [MI, "39%"]
          - [All macrovascular, "30%"]
          - [Microvascular, Not significant]
        hide: [[0, 1], [1, 1], [3, 1], [5, 1]]
      - kind: aside
        tone: tip
        page: 107
        quote: "UKPDS (1998) is the only study that has examined the overall effectiveness of metformin on long-term complications"
        text: "عشان تحفظ الأرقام: **32 – 42 – 36 – 39 – 30**. الرقم الكبير (42) للـ **deaths**، والـ **MI** قريب منه (39). و **UKPDS** هي الدراسة الوحيدة اللي بصّت على الـ long-term complications."
      - kind: explain
        page: 108
        title: "الـ side effects"
        quote: "Lactic acidosis: rare and fatal in 30% of cases, it occurs if metformin is given in high doses particularly in patients with impaired kidney functions"
        text: |
          - **GI**: nausea، dyspepsia، anorexia، diarrhea (الأشهر).
          - ==Lactic acidosis==: نادرة بس **fatal in 30%**، مع الجرعات العالية خصوصًا لو الكلى بايظة أو CHF مش متظبط.
          - **Vitamin B12** و folic acid absorption ↓.

          Contraindicated لو **eGFR <30** أو chronic alcoholism.
      - kind: reveal
        page: 108
        quote: "IV iodinated materials can lead to acute alteration of renal function and lactic acidosis in patients receiving metformin"
        prompt: "ليه بنوقف metformin قبل الـ CT بالصبغة؟"
        answer: |
          الـ **IV iodinated contrast** ممكن يعمل AKI. الـ metformin بيطلع من الكلى، فلو الكلى وقفت فجأة يتراكم ← **lactic acidosis** (حوالي 1 in 500,000).

          علشان كده: وقّفه **at or before** الصبغة، **withhold 48 hours**، ورجّعه بس لما الـ renal function تبقى normal. وفي الـ general anesthesia: وقّفه **صباح العملية** ورجّعه بعد ما الكلى تتأكد.
      - kind: update
        page: 108
        quote: "Contraindicated in severely impaired renal function (eGFR <30 ml/min/1.73m2), chronic alcoholism."
        text: "الـ FDA (2016) بتقول كمان: ما تبدأش metformin لو eGFR 30–45، ووقّفه مع الصبغة أساسًا لو eGFR 30–60 أو liver disease أو alcoholism أو heart failure أو intra-arterial contrast. في الامتحان: الكتاب (CI <30، stop مع أي IV contrast 48 h)."
        ref: "FDA metformin labeling revision, 2016"
      - kind: check
        page: 108
        quote: "With the use of general anesthesia: stop metformin on the morning of surgery and restart when renal function are re-evaluated & found to be normal."
        question: "Patient on metformin for elective surgery under general anesthesia. When to stop it?"
        options:
          - "On the morning of surgery"
          - "3–4 days before"
          - "One week before"
          - "No need to stop"
        answer: 0
        why:
          - "صح: صباح العملية، ويرجع لما الـ renal function تبقى normal."
          - "3–4 days ده rule الـ SGLT2 inhibitors."
          - "مش محتاج أسبوع."
          - "الكتاب بيقول وقّفه."
      - kind: try
        items: [dm.L09.026, dm.L09.029, dm.L09.031, dm.L09.035, dm.L09.038]
    recap:
      - "Metformin: مش بيطلّع insulin. Main effect: يقفل الـ hepatic gluconeogenesis. HbA1c ↓ 1.5%."
      - "Non-glycemic: **WHALE PC**."
      - "UKPDS: 32 / 42 / 36 / 39 / 30؛ microvascular مش significant."
      - "Side effects: GI، lactic acidosis (fatal 30%)، B12 ↓. CI: eGFR <30، alcoholism."
      - "Contrast: stop قبل، 48 h، ورجّع بعد ما الكلى تتأكد. Anesthesia: صباح العملية."
    practice: [dm.L09.024, dm.L09.025, dm.L09.026, dm.L09.027, dm.L09.028, dm.L09.029, dm.L09.030, dm.L09.031, dm.L09.032, dm.L09.033, dm.L09.034, dm.L09.035, dm.L09.036, dm.L09.037, dm.L09.038, dm.L09.039, dm.L09.040, dm.L09.041, dm.L09.042, dm.L09.043, dm.L09.131, dm.L09.134, dm.L09.142, dm.L09.143]
  # ------------------------------------------------------------------
  - id: dm.L09.lesson3
    title: "Acarbose والـ glinides والـ TZDs"
    hook: "دوا بيأخّر النشويات، ودوا بيدّي insulin على الأكل بس، ودوا بيصالح الخلايا على الـ insulin."
    minutes: 10
    pages: [109, 115]
    topics: [agi, glinides, tzd]
    goals:
      - "تعرف ليه الـ hypoglycemia مع acarbose بتتعالج بـ glucose بس"
      - "تفرّق الـ glinide عن الـ SU"
      - "تفهم الـ PPAR-gamma وتحفظ الـ side effects بتاعة الـ fluid retention"
    status: unverified
    steps:
      - kind: explain
        page: 109
        title: "Alpha-glucosidase inhibitors"
        quote: "through competitive inhibition of the action of the intestinal brush border alpha- glucosidase enzyme. So, the postprandial blood glucose peaks are blunted."
        text: |
          **Acarbose، miglitol، voglibose**: HbA1c ↓ **0.5–0.8%** بس.

          بتعمل ==competitive inhibition== لإنزيم الـ **alpha-glucosidase** في الـ brush border، فالـ disaccharides والنشويات تتهضم أبطأ، والـ **postprandial peaks** تتسطّح. وكمان بتزوّد الـ **GLP-1**.

          الجرعة: acarbose و miglitol **25–300 mg/d**.
      - kind: reveal
        page: 110
        quote: "the hypoglycemia which occurs in the presence of alpha-glucosidase inhibitors is only reversed by glucose intake."
        prompt: "عيان على acarbose + SU جاله hypoglycemia. ليه العصير بالسكر (sucrose) مش هينفع؟"
        answer: |
          الـ **sucrose** disaccharide، محتاج alpha-glucosidase علشان يتكسر لـ glucose + fructose. والإنزيم ده **متقفّل** بالدوا.

          علشان كده الـ hypoglycemia مع الـ AGIs ==only reversed by glucose intake== (glucose tablets أو dextrose).
      - kind: aside
        tone: joke
        page: 109
        quote: "GIT distress: abdominal discomfort, flatulence and diarrhea, frequently leading to discontinuation of the drug."
        text: "الكربوهيدرات اللي ما اتهضمتش بتوصل القولون والبكتيريا تعمل عليها حفلة ← **flatulence** و diarrhea. علشان كده عيان الـ acarbose بيبطّل الدوا قبل ما أهله يبطّلوه هو. 😄 وكمان الجرعة **3 مرات في اليوم** والـ efficacy أقل من SU و metformin."
      - kind: explain
        page: 110
        title: "Meglitinides: insulin على قد الأكلة"
        quote: "Meglitinides are distinguished from SUs by their rapid onset of action and short metabolic half-lives."
        text: |
          **Repaglinide** (benzoic acid، 1–16 mg/d) و **nateglinide** (phenylalanine، 120–360 mg/d، نادر).

          بيشتغلوا على الـ KATP channel زي الـ SU بس على **site مختلف**، وبيركبوا ويسيبوا بسرعة. الفرق: ==rapid onset== و **short half-life**.

          تاخده **قبل الأكلة** ← دفعة insulin قصيرة، والـ beta cell ترتاح بين الأكلات:
          - postprandial excursion أقل
          - hypoglycemia متأخرة أقل
          - weight gain أقل
      - kind: sort
        page: 111
        quote: "Hypoglycemia: less than SUs. Weight gain: less than SUs. Nateglinide appears to be a less potent secretagogue."
        prompt: "صنّف: ده بيحصل مع الـ AGIs ولا الـ meglitinides؟"
        bins: ["Alpha-glucosidase inhibitors", "Meglitinides"]
        cards:
          - { text: "Flatulence and diarrhea", bin: 0 }
          - { text: "Raises GLP-1 release", bin: 0 }
          - { text: "Weight neutral, no hypoglycemia alone", bin: 0 }
          - { text: "Hypoglycemia, less than SUs", bin: 1 }
          - { text: "Efficacy like SUs (repaglinide)", bin: 1 }
          - { text: "Binds a site distinct from the SU site", bin: 1 }
        why: "الاتنين جرعتهم 3 مرات في اليوم. الـ AGI بيشتغل في الأمعاء (gas، GLP-1، weight neutral). الـ glinide secretagogue زي الـ SU بس أخف (hypoglycemia و weight أقل)."
      - kind: explain
        page: 111
        title: "TZDs: PPAR-gamma"
        quote: "PPAR binds to retinoid X receptor to form a heterodimer that enhances production of proteins essential in cell response to insulin"
        text: |
          **Pioglitazone** و **rosiglitazone** (HbA1c ↓ 0.5–1.4%). أول واحد **troglitazone** اتسحب **March 2000** بسبب hepatocellular injury.

          بيشغّلوا الـ ==PPAR-gamma== (nuclear receptor) اللي يركب مع الـ **retinoid X receptor** ويطلّعوا proteins لـ glucose transport و lipid metabolism. النتيجة: **insulin sensitivity** أحسن في العضلات والدهون والكبد، و **GLUT4** أكتر.
