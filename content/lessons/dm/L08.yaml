      - kind: explain
        page: 101
        title: "Glycemic load"
        quote: "Glycemic Load (GL) is a measure of both the quality (the GI value) and quantity (grams per serve) of a carbohydrate in a meal."
        text: |
          الـ GI بيقول **نوع** الكارب، بس مش **كميته**. الـ ==glycemic load== بيجمع الاتنين:

          **Glycaemic load (GL) = GI ÷ 100 × net carbs**
          (net carbs = total carbohydrate − **dietary fiber**)

          - **Low ≤10**، **medium 11–19**، **high ≥20**

          والـ **American Diabetes Association (ADA)** بتدعم الـ GI، بس بتقول إن ==total carbohydrate== هو أقوى مؤشر.

          ليه الـ GI لوحده ممكن يضلّلك؟ لأنه بيتقاس على **كمية ثابتة من الكارب**، مش على الحصة اللي بتاكلها فعلًا. حاجة GI بتاعها عالي بس الحصة فيها كارب قليل (زي البطيخ) مش هتعمل حاجة كبيرة، وحاجة GI متوسط بس بتاكل منها طبق كبير هتعلّي السكر جامد. الـ GL بيصحّح ده.
      - kind: reveal
        page: 101
        quote: "GL = GI / 100 × Net Carbs (Net Carbs are equal to the Total Carbohydrates minus Dietary Fiber)"
        prompt: "ليه بنطرح الـ dietary fiber قبل ما نحسب الـ GL؟"
        answer: |
          الكتاب بيعرّف **net carbs = total carbohydrates − dietary fiber**.

          التفسير المقبول (مش في الكتاب): الـ fiber كارب على الورق، بس الأمعاء ما عندهاش إنزيم يكسّره لـ glucose، فبيعدّي من غير ما يعلّي السكر. لو سبته في الحساب هتظلم الأكل الغني بالـ fiber (العيش الأسمر، البقول) وتطلّعه أوحش من حقيقته. وده نفس السبب إن الـ whole grain اتفضّل في الهرم.

