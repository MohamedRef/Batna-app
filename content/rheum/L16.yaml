    src: { page: 244, quote: "ONSET\n  Gradual (usually).\n  Acute in a minority.\n  Occasionally palindromic (pain, swelling, erythema that resolve but recur 50% develop RA).\n  Systemic symptoms: Fatigue, malaise, weakness, low grade fever, loss of weight.\n  Joints: pain- swelling- tender on pressure.\n  Morning stiffness: due to edema and inflammatory mediator accumulation during sleep or inactivity.\n  Joints commonly involved: joints of hand (MCP-PIP-Wrist) foot joints-knee.\n  Also affected: shoulder- hip- ankle —sternoclavicular joints.\n  Less commonly: Tempromandibular and cricoarytenoid joint.\n  Spinal involvement is limited to upper cervical area, sacroiliac joint is spared.\n  Symmetry and non involvement of DIP is characteristic." }
