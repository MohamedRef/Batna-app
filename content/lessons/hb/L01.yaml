  - id: hb.L01.lesson5
    title: "هيعيش قد إيه؟ Child-Pugh و MELD"
    hook: "خمس حاجات تتجمع في رقم واحد، وقلم BIC بيحسب الباقي."
    minutes: 9
    pages: [13, 15]
    topics: [prognosis]
    goals:
      - "تحفظ أرقام الـ survival والانتقال بين المراحل"
      - "تحسب Child-Pugh من غير جدول"
      - "تعرف مكونات MELD وفايدته"
    status: unverified
    steps:
      - kind: explain
        page: 13
        title: "الأرقام اللي بتتسأل"
        text: |
          - **Compensated**: risk of death low، **median survival > 12 years**. واللي **without varices** mortality أقل بكتير من اللي عنده varices.
          - الانتقال compensated → decompensated: حوالي **5–7% per year**.
          - **Decompensated**: median survival بتنزل لحوالي **2 years**.
          - **HCC**: **3–5% per year** في الـ alcohol-associated و viral cirrhosis.
      - kind: explain
        page: 13
        title: "علامات الـ poor prognosis"
        text: |
          - **marked ascites** (خصوصًا refractory) و **variceal bleeding**
          - advanced age، **mean arterial pressure ≤ 82 mmHg**، high daily alcohol
          - prolonged PT، high bilirubin و alkaline phosphatase، **low albumin**، **hyponatremia**
          - infections، severe kidney dysfunction، ventilatory insufficiency، و poor nutrition
      - kind: aside
        tone: exam
        page: 13
        text: |
          الرقم الغريب اللي الممتحن بيحبه: **MAP ≤ 82 mmHg**. أي حد بيقول «الضغط واطي» هتلاقي كل الطلبة كاتبين كلام عام، وانت تكتب الرقم.
      - kind: mnemonic
        page: 14
        word: "ABCDE"
        parts:
          - { key: "A", text: "Albumin" }
          - { key: "B", text: "Bilirubin" }
          - { key: "C", text: "Clotting: prothrombin time (seconds prolonged)" }
          - { key: "D", text: "Distension: ascites" }
          - { key: "E", text: "Encephalopathy" }
        hook: "الـ Child-Pugh **ABCDE** زي الإسعافات الأولية بالظبط، بس للكبد. اتنين clinical (D و E) وتلاتة lab (A و B و C)."
      - kind: table
        page: 14
        title: "Child-Pugh (book Table 2): fill in the gaps"
        columns: ["Variable", "1 point", "2 points", "3 points"]
        rows:
          - ["Encephalopathy", "None", "Stage 1-2", "Stage 3-4"]
          - ["Ascites", "Absent", "Mild to moderate", "Severe"]
          - ["Bilirubin (mg/dL)", "<2", "2-3", ">3"]
          - ["Albumin (g/dL)", ">3.5", "2.8-3.5", "<2.8"]
          - ["PT (seconds prolonged)", "<4", "4-6", ">6"]
        hide: [[2, 1], [2, 3], [3, 1], [3, 2], [4, 2], [0, 2]]
      - kind: aside
        tone: tip
        page: 14
        text: |
          الأرقام كأنها أغنية: **Bili 2–3، Albumin 3.5–2.8، PT 4–6**.

          والـ albumin الوحيد اللي **بيقل** كل ما الحالة تسوء، فالسهم بتاعه بالعكس.
      - kind: figure
        page: 14
        title: "النقط بتقولك إيه"
        alt: "A scale from 5 to 15 points: class A 5 to 6 with 1- and 2-year survival 100 and 85 percent, class B 7 to 9 with 80 and 60 percent, class C 10 to 15 with 45 and 35 percent."
        caption: "Class A = **5–6**، B = **7–9**، C = **10–15**. وتحت كل class الـ one- و two-year survival."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <text x="45" y="22" text-anchor="middle" class="t-b t-good">Class A</text>
            <text x="120" y="22" text-anchor="middle" class="t-b t-acc">Class B</text>
            <text x="243" y="22" text-anchor="middle" class="t-b t-bad">Class C</text>
            <rect x="10" y="34" width="70" height="44" rx="6" class="fg-good"/>
            <rect x="82" y="34" width="76" height="44" rx="6" class="fg-acc"/>
            <rect x="160" y="34" width="166" height="44" rx="6" class="fg-bad"/>
            <text x="45" y="62" text-anchor="middle" class="t-b">5–6</text>
            <text x="120" y="62" text-anchor="middle" class="t-b">7–9</text>
            <text x="243" y="62" text-anchor="middle" class="t-b">10–15 points</text>
            <text x="10" y="110" class="t-sm t-mut">1-year survival</text>
            <text x="45" y="134" text-anchor="middle" class="t-lg t-b t-good">100%</text>
            <text x="120" y="134" text-anchor="middle" class="t-lg t-b t-acc">80%</text>
            <text x="243" y="134" text-anchor="middle" class="t-lg t-b t-bad">45%</text>
            <text x="10" y="170" class="t-sm t-mut">2-year survival</text>
            <text x="45" y="194" text-anchor="middle" class="t-lg t-b t-good">85%</text>
            <text x="120" y="194" text-anchor="middle" class="t-lg t-b t-acc">60%</text>
            <text x="243" y="194" text-anchor="middle" class="t-lg t-b t-bad">35%</text>
            <path d="M10 220h316" class="fg-thin"/>
            <text x="168" y="244" text-anchor="middle" class="t-sm t-mut">Good short-term prognostic guide (book)</text>
          </svg>
      - kind: case
        page: 14
        stem: "A 58-year-old man with HCV cirrhosis: no encephalopathy, mild ascites, bilirubin 2.5 mg/dL, albumin 3.0 g/dL, prothrombin time prolonged by 3 seconds."
        steps:
          - question: "Total Child-Pugh points?"
            options: ["6", "7", "8", "9"]
            answer: 2
            why: "HE none = 1, mild ascites = 2, bilirubin 2-3 = 2, albumin 2.8-3.5 = 2, PT <4 = 1. Total **8**."
          - question: "Class?"
            options: ["A", "B", "C"]
            answer: 1
            why: "7-9 points = **class B**."
          - question: "Book one- and two-year survival for his class?"
            options: ["100% and 85%", "80% and 60%", "45% and 35%"]
            answer: 1
            why: "Class B: **80% and 60%**."
      - kind: explain
        page: 14
        title: "MELD"
        text: |
          **MELD** بيتحسب (عادة بـ web-based calculator) من **serum creatinine**، **INR**، و **serum bilirubin**، والـ range **6–40**.

          ولو زوّدت **serum sodium** يبقى **MELD-Na**، و **predictive ability** بتتحسن.

          اتعمل أصلًا للـ **liver transplantation allocation** (مين ياخد الكبد الأول)، وبقى كمان measure لـ **mortality risk** و complications.
      - kind: aside
        tone: joke
        page: 14
        text: |
          الـ MELD بيتكتب بقلم **BIC** 🖊️: **B**ilirubin، **I**NR، **C**reatinine.
          ولو رشّيت عليه شوية **ملح (Na)** يبقى **MELD-Na**، وطعمه (predictive ability) يحلو.
      - kind: check
        page: 14
        question: "Which variable is in **Child-Pugh** but **not** in MELD?"
        options:
          - "Albumin"
          - "Bilirubin"
          - "INR"
          - "Serum creatinine"
        answer: 0
        why:
          - "صح: الـ albumin في ABCDE، ومش في BIC."
          - "الـ bilirubin في الاتنين."
          - "الـ INR في MELD، وفي Child-Pugh الـ clotting بيتقاس بالـ PT."
          - "الـ creatinine في MELD بس، مش في Child-Pugh."
      - kind: update
        page: 15
        text: |
          فيه نسخة أحدث اسمها **MELD 3.0** بتضيف **sex** و **albumin** على MELD-Na، وبقت هي المستخدمة في توزيع الأكباد في أمريكا. في الامتحان اكتب MELD و MELD-Na زي الكتاب.
        ref: "MELD 3.0: Kim et al., Gastroenterology 2021; OPTN allocation policy 2023"
      - kind: try
        items: [hb.L01.057, hb.L01.062, hb.L01.194]
    recap:
      - "Compensated: survival > 12 سنة. Decompensated: حوالي سنتين. الانتقال 5–7% في السنة. HCC 3–5% في السنة."
      - "MAP ≤ 82 mmHg من علامات الـ poor prognosis."
      - "Child-Pugh = **ABCDE**: A 5–6، B 7–9، C 10–15."
      - "Survival: A 100/85، B 80/60، C 45/35."
      - "MELD = **BIC** (6–40)، و MELD-Na أدق."
    practice: [hb.L01.051, hb.L01.052, hb.L01.053, hb.L01.054, hb.L01.055, hb.L01.056, hb.L01.057, hb.L01.058, hb.L01.059, hb.L01.060, hb.L01.061, hb.L01.062, hb.L01.091, hb.L01.141, hb.L01.142, hb.L01.143, hb.L01.144, hb.L01.171, hb.L01.172, hb.L01.194, hb.L01.199, hb.L01.200, hb.L01.201]
