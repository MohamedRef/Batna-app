  - id: hb.L01.lesson2
    title: "البورتال هايبرتنشن: أول وأخطر حاجة"
    hook: "زحمة على الكبد، طرق جانبية، ودم بيزيد بدل ما يقل: الـ vicious cycle اللي ورا معظم المضاعفات."
    minutes: 9
    pages: [4, 6]
    topics: [pathogenesis, presentation]
    goals:
      - "تشرح ليه الـ portal pressure بتفضل عالية حتى بعد ما الـ collaterals تفتح"
      - "تعرف الكبد المتليف بالكشف، وتقسّم مظاهر الـ PH على مصادرها"
      - "تفرق بين compensated و decompensated، وتعدّ الحاجات اللي بتقلب واحدة للتانية"
    status: unverified
    steps:
      - kind: explain
        page: 4
        title: "ليه الـ PH أول حاجة؟"
        text: |
          الكتاب صريح: **PH is the earliest and most important consequence of cirrhosis**، وهي ورا مضاعفات كتير. وبتحصل **regardless of the severity of liver disease**.

          الأعراض والعلامات كلها بتيجي من 3 مصادر بس:
          - **(A) Portal hypertension**
          - **(B) Hepatic decompensation** (liver failure)
          - **(C) Hepatocellular carcinoma (HCC)**

          والـ prognosis والعلاج بيعتمدوا على حجم المضاعفات دي.
      - kind: explain
        page: 4
        title: "الضغط بيعلى على مرحلتين"
        text: |
          - **الأول:** الـ fibrosis والـ nodules بيرفعوا الـ **intrahepatic vascular resistance**. الدم مش لاقي طريق سهل.
          - لما الضغط يوصل لـ **critical level**، الـ **portosystemic collaterals (PSS)** اللي موجودة أصلًا بتفتح علشان تخفف (decompress).
          - **التاني:** الضغط بيزيد أكتر بسبب **increase in portal blood inflow** نتيجة **splanchnic arteriolar vasodilatation**.
      - kind: figure
        page: 4
        title: "الـ vicious cycle"
        alt: "A loop: raised intrahepatic resistance raises portal pressure; collaterals open; vasodilators bypass the liver; splanchnic arterioles dilate; portal inflow rises and raises portal pressure again."
        caption: "الـ collaterals المفروض تخفف، بس الكتاب بيقول إن الـ PSS بتخلّي الـ endogenous vasodilators تعدّي من غير ما الكبد يكسّرها (ص 19)، ومع الـ **splanchnic arteriolar vasodilatation** (ص 4) يدخل دم أكتر، والضغط يفضل عالي."
        svg: |
          <svg viewBox="0 0 330 520" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L01b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="L01c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="55" y="10" width="220" height="54" rx="10" class="fg-box"/>
            <text x="165" y="33" text-anchor="middle" class="t-b">↑ Intrahepatic resistance</text>
            <text x="165" y="52" text-anchor="middle" class="t-sm t-mut">fibrosis + regenerative nodules</text>
            <path d="M165 66v30" class="fg-ink" marker-end="url(#L01b)"/>
            <rect x="65" y="100" width="200" height="56" rx="28" class="fg-bad"/>
            <text x="165" y="134" text-anchor="middle" class="t-b t-lg t-bad">↑ Portal pressure</text>
            <path d="M165 158v30" class="fg-ink" marker-end="url(#L01b)"/>
            <rect x="55" y="192" width="220" height="54" rx="10" class="fg-box"/>
            <text x="165" y="215" text-anchor="middle" class="t-b">Portosystemic collaterals open</text>
            <text x="165" y="234" text-anchor="middle" class="t-sm t-mut">to decompress the portal system</text>
            <path d="M165 248v30" class="fg-ink" marker-end="url(#L01b)"/>
            <rect x="55" y="282" width="220" height="54" rx="10" class="fg-box"/>
            <text x="165" y="305" text-anchor="middle" class="t-b">Vasodilators bypass the liver</text>
            <text x="165" y="324" text-anchor="middle" class="t-sm t-mut">through the shunts (p19)</text>
            <path d="M165 338v30" class="fg-ink" marker-end="url(#L01b)"/>
            <rect x="55" y="372" width="220" height="54" rx="10" class="fg-acc"/>
            <text x="165" y="395" text-anchor="middle" class="t-b">Splanchnic arteriolar</text>
            <text x="165" y="414" text-anchor="middle" class="t-b">vasodilatation</text>
            <path d="M275 399h30V128h-34" class="fg-arrow-bad" marker-end="url(#L01c)"/>
            <text x="318" y="270" text-anchor="middle" transform="rotate(90 318 270)" class="t-sm t-bad t-b">↑ portal inflow</text>
            <rect x="20" y="446" width="290" height="62" rx="10" class="fg-thin"/>
            <text x="165" y="468" text-anchor="middle" class="t-sm t-b">Shows up as</text>
            <text x="165" y="490" text-anchor="middle" class="t-sm">collaterals (varices) · splenomegaly · ascites</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 4
        text: |
          الكبد المتليف زي **محور 26 يوليو الساعة 3 العصر**. العربيات (الدم) واقفة، فبتلاقي **طرق جانبية** (collaterals) وتهرب منها.

          المشكلة إن اللي هربوا من الطرق الجانبية هم كمان **الـ vasodilators** اللي كان الكبد بيكسرها. فبيوصلوا للـ splanchnic arterioles ويوسّعوها، يعني **بيفتحوا مداخل جديدة للمحور**. عربيات أكتر داخلة على نفس الزحمة.
      - kind: reveal
        page: 4
        prompt: "الـ collaterals فتحت علشان تخفّف الضغط... طب ليه الضغط ما بيرجعش طبيعي؟"
        answer: |
          لأن الضغط بيتغذّى من ناحيتين: **resistance** في الكبد، و**inflow** داخل عليه.

          الـ collaterals بتخفف شوية من الـ resistance، لكن الـ **splanchnic arteriolar vasodilatation** بتزوّد الـ **portal blood inflow**، فالكتاب بيقول إن الضغط **is aggravated**.
      - kind: explain
        page: 4
        title: "هتعرفه بإيدك إزاي؟"
        text: |
          التشخيص بالـ **morphological changes**. الكبد المتليف في الكشف:
          - الحجم: **shrunken, enlarged or normal**. (أيوه، التلاتة!)
          - الـ edge: **sharp**، وممكن يبقى **irregular**
          - الـ surface: **smooth or nodular**
          - الـ consistency: **firm**، وعادة **not tender**
      - kind: sort
        page: 5
        prompt: "كل مظهر من مظاهر الـ PH جاي منين؟"
        bins: ["Portosystemic shunts", "Splenomegaly", "Ascites"]
        cards:
          - { text: "Hematemesis and melena", bin: 0 }
          - { text: "Caput medusae", bin: 0 }
          - { text: "Venous hum", bin: 0 }
          - { text: "Dilated abdominal wall veins", bin: 0 }
          - { text: "Left hypochondrial pain", bin: 1 }
          - { text: "Hypersplenism", bin: 1 }
          - { text: "Transudation into the peritoneal cavity", bin: 2 }
        why: "الـ PSS بتعمل upper GI bleeding (وأقل: lower)، dilated veins، caput medusae و venous hum. الطحال: left hypochondrial pain و hypersplenism. والـ ascites هي transudation للـ peritoneum."
      - kind: aside
        tone: exam
        page: 5
        quote: "Ascites is due to the accumulation of endogenous vasodilators. PH acts as a localizing factor"
        text: |
          الكتاب بيكتب سبب الـ ascites في جملتين، احفظهم زي ما هما:

          **Ascites is due to the accumulation of endogenous vasodilators**، و **PH acts as a localizing factor** بيوجّه الـ transudation من الـ intravascular compartment للـ peritoneal cavity.

          يعني الـ PH مش هي «سبب» السوائل لوحدها، هي اللي بتحدد **فين** السوائل هتتجمع.
      - kind: figure
        page: 5
        title: "المراحل"
        alt: "Three stages left to right: compensated, decompensated, further decompensation, with first decompensation between the first two, and a dashed band above saying ACLF can happen at any stage."
        caption: "الـ compensated → الـ first decompensation (بالراحة أو فجأة) → decompensated → further decompensation. والـ ACLF ممكن تخبط في أي مرحلة."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L01d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="310" height="40" rx="8" class="fg-bad" stroke-dasharray="6 4"/>
            <text x="165" y="35" text-anchor="middle" class="t-b t-bad">⚡ ACLF can develop at any stage</text>
            <rect x="20" y="70" width="290" height="80" rx="12" class="fg-good"/>
            <text x="165" y="96" text-anchor="middle" class="t-b t-lg t-good">Compensated</text>
            <text x="165" y="118" text-anchor="middle" class="t-sm">no present or past decompensation</text>
            <text x="165" y="136" text-anchor="middle" class="t-sm">often asymptomatic · varices may bleed</text>
            <path d="M165 152v34" class="fg-ink" marker-end="url(#L01d)"/>
            <text x="175" y="174" class="t-sm t-mut">first decompensation: insidious or acute</text>
            <rect x="20" y="192" width="290" height="96" rx="12" class="fg-acc"/>
            <text x="165" y="218" text-anchor="middle" class="t-b t-lg t-acc">Decompensated</text>
            <text x="165" y="240" text-anchor="middle" class="t-sm">≥1 complication of liver failure:</text>
            <text x="165" y="258" text-anchor="middle" class="t-sm">ascites (most frequent first) · HE</text>
            <text x="165" y="276" text-anchor="middle" class="t-sm">coagulopathy ± jaundice</text>
            <path d="M165 290v34" class="fg-ink" marker-end="url(#L01d)"/>
            <rect x="20" y="328" width="290" height="92" rx="12" class="fg-bad"/>
            <text x="165" y="352" text-anchor="middle" class="t-b t-lg t-bad">Further decompensation</text>
            <text x="165" y="374" text-anchor="middle" class="t-sm">recurrent bleeding · recurrent HE</text>
            <text x="165" y="392" text-anchor="middle" class="t-sm">refractory ascites · SBP · HRS-AKI</text>
            <text x="165" y="410" text-anchor="middle" class="t-sm">bacterial infections · ACLF</text>
          </svg>
      - kind: explain
        page: 5
        title: "Compensated: هادي من برّه"
        text: |
          **Compensated cirrhosis** = **absence of present or past episode of hepatic decompensation**.

          - المريض غالبًا **asymptomatic**، وبتكتشفه **incidentally** في كشف أو تحاليل أو imaging.
          - في الكشف: **cirrhotic liver** و **enlarged spleen**.
          - و **variceal bleeding may occur**.

          **Decompensated** = **symptomatic** وفيه **manifestations of liver failure**. والتحوّل (first decompensation) يا إما **insidious** (synthetic function بتقل بالراحة والضغط بيعلى)، يا إما **acute** على مدار ساعات أو أيام.
      - kind: aside
        tone: trap
        page: 5
        text: |
          **Compensated مش معناها «مفيش varices».** الكتاب بيقول في الـ compensated إن **variceal bleeding may occur**، والنزيف نفسه من أسباب إن المريض يقلب decompensated.
      - kind: mnemonic
        page: 5
        word: "SHIBS"
        parts:
          - { key: "S", text: "Surgery (major)" }
          - { key: "H", text: "HCC" }
          - { key: "I", text: "Infections (bacterial)" }
          - { key: "B", text: "Bleeding (variceal)" }
          - { key: "S", text: "Superimposed liver damage: acute alcoholic hepatitis, DILI, HAV/HEV, HBV flare" }
        hook: |
          اقراها **شيبس** 🥔. الكبد الـ compensated كان ماشي كويس، لحد ما أكل **SHIBS** فقلب decompensated.
      - kind: case
        page: 5
        stem: "A 56-year-old man with untreated chronic HCV has never had ascites, jaundice or confusion. Exam: firm liver with a sharp irregular edge and a palpable spleen. Platelets 95,000/mm³."
        steps:
          - question: "Stage of his cirrhosis?"
            options: ["Compensated", "Decompensated", "Further decompensation", "ACLF"]
            answer: 0
            why: "No present or past decompensating event = **compensated**. The big spleen and low platelets are portal hypertension, not liver failure."
          - reveal: "Six months later he has pneumonia. A week after, his abdomen swells with full flanks."
            question: "What happened?"
            options: ["The infection precipitated his first decompensation (ascites)", "Further decompensation", "He is still compensated", "Hepatopulmonary syndrome"]
            answer: 0
            why: "Bacterial infection is a listed precipitating factor, and ascites is the most frequent first decompensating event (p6)."
          - question: "Which of these is also a listed precipitant of decompensation?"
            options: ["Variceal bleeding", "Mild hypoalbuminaemia", "Oesophageal candidiasis", "A rise in platelets"]
            answer: 0
            why: "Book list (SHIBS): major surgery, HCC, bacterial infections, variceal bleeding, superimposed liver damage."
      - kind: try
        items: [hb.L01.013, hb.L01.015, hb.L01.016]
    recap:
      - "الـ PH هي **earliest and most important consequence**، ومظاهرها: PSS، splenomegaly، ascites."
      - "الضغط: ↑ intrahepatic resistance، وبعدين ↑ portal inflow من splanchnic vasodilatation، رغم إن الـ collaterals فتحت."
      - "Ascites = endogenous vasodilators، والـ PH **localizing factor**."
      - "Compensated = مفيش decompensation حالية ولا قديمة، وممكن ينزف من varices."
      - "اللي بيقلبه decompensated: **SHIBS**."
    practice: [hb.L01.011, hb.L01.012, hb.L01.013, hb.L01.014, hb.L01.015, hb.L01.016, hb.L01.098, hb.L01.107, hb.L01.109, hb.L01.110, hb.L01.111, hb.L01.112, hb.L01.113, hb.L01.114, hb.L01.115, hb.L01.164, hb.L01.165, hb.L01.166, hb.L01.190, hb.L01.191, hb.L01.198]
