          - "ده tofacitinib."
      - kind: explain
        page: 177
        title: "Belimumab: ليه في الـ SLE بالذات؟"
        quote: "It is available for use for the treatment of systemic lupus erythematosus and is"
        text: |
          الكتاب: الـ **belimumab** = **anti-B lymphocyte stimulator (BLyS) mAb**، بيمسك الـ **soluble BLyS** فيمنعه يركب على الـ B cells وينشّطها. متاح للـ ==systemic lupus erythematosus==، وتحت الدراسة في الـ **Sjögren syndrome**، وبيتدّي **IV كل 4 أسابيع** بعد loading doses.

          التفسير المقبول (مش في الكتاب): الـ BLyS ده **أكل** الـ B cells؛ من غيره بتضعف وتموت. فالـ belimumab مش بيقتل الخلايا مباشرة زي الـ rituximab، هو **بيجوّعها**. وده مناسب للـ **SLE** والـ Sjögren's لأنهم أمراض **Th2/antibody** (ص 174): الـ B cell هي محور المرض. يعني:
          - **Rituximab** = **deplete** (شيل).
          - **Belimumab** = **inhibit** (جوّع).
