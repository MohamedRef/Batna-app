        title: "شكل المريض (Table 4)"
        text: |
          Table 4 بيلخّص المريض في 4 خانات:

          - **Symptoms**: fatigue، و upper abdominal discomfort، و pruritus خفيف، و anorexia، و polymyalgias، و diarrhea، و cushingoid features، و fever لحد 40°C.
          - **Signs**: hepatomegaly، و jaundice، و splenomegaly، و spider angiomas، و ascites، و encephalopathy، و concurrent immune diseases.
          - **Labs**: AST مرتفع، و hyperbilirubinemia، و alkaline phosphatase (ALP) (الكتاب كاتب ≥ 2× normal).
