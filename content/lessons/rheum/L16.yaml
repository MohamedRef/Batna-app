          - "مش شهري: الـ B cell depletion بيقعد أكتر من 6 شهور."
          - "ده الـ adalimumab."
          - "ده الـ tocilizumab."
      - kind: explain
        page: 272
        title: "Tocilizumab: اقفل الـ IL-6"
        quote: "Improve anaemia through inhibition of IL6 induced hepcidin production. (Hepcidin stop ferroportin from releasing iron stores."
        text: |
          **Humanized** anti-**IL-6 receptor**. بيوقف: B و T activation، الـ acute phase proteins، الـ neutrophils والـ pannus، والـ vascular endothelial growth factor (VEGF).

          وفوايد إضافية:
          - ==الأنيميا تتحسّن==: الـ IL-6 بيعمل **hepcidin**، والـ hepcidin بيقفل الـ ferroportin فالحديد يتحبس.
          - الـ fatigue والمود (HPA axis).
          - الـ osteoporosis (يوقف الـ osteoclasts).

          **8 mg/kg** IV كل شهر، والاستجابة في **أسبوعين**.
      - kind: reveal
        page: 272
        quote: "Induction of acute phase protein synthesis."
        prompt: "عيان على tocilizumab عنده سخونية والـ CRP طبيعي. تطمّن؟"
        answer: |
          لأ. الكتاب بيقولك إن الـ tocilizumab بيمنع الـ ==IL-6 induced acute phase protein synthesis==، والـ CRP واحد منهم (افتكر الـ IL-6 → ESR و CRP من أول درس).

          التفسير المقبول (مش في الكتاب): يعني الـ CRP **مش هيعلى** حتى لو فيه infection، وده خطر لأن الـ infections (ومنها **TB**) أول أعراضه الجانبية. افحص العيان نفسه، ما تعتمدش على الرقم.
