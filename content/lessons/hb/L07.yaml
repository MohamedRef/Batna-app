      - kind: explain
        page: 123
        title: "قبل أي immunosuppression"
        text: |
          **Screen for HBsAg and anti-HBc** قبل ما تبدأ الـ IS:

          - **HBsAg−, anti-HBc−**: لو **anti-HBs+** فهو vaccinated. لو **anti-HBs−** (naïve) → **vaccinate if indicated**.
          - **HBsAg−, anti-HBc+** (exposed): **moderate risk IS** → **monitor every 1–3 months** (ALT، HBV DNA، HBsAg) و **treat if reactivation**؛ والرسمة كمان فيها سهم من الـ moderate risk لـ **start antiviral PPX**. **High-risk IS** (**B cell-depleting therapy or SCT**) → **antiviral prophylaxis**.
          - **HBsAg+** (CHB) → **start antiviral prophylaxis**.
      - kind: sort
