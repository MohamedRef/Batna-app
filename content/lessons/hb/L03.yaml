  - id: hb.L03.lesson2
    title: "P = R × F: ليه الضغط بيعلى؟"
    hook: "الكبد بخيل بالـ NO على نفسه وكريم بيه على الأمعاء. ومن التناقض ده بتبدأ الحكاية كلها."
    minutes: 9
    pages: [39, 42]
    topics: [pathophysiology]
    goals:
      - "تشرح الـ portal hypertension بمعادلة واحدة: P = R × F"
      - "تقسّم الـ intrahepatic resistance لـ fixed (~70%) و dynamic (~30%)"
      - "تعدّ الـ vasoconstrictors جوه الكبد والـ vasodilators في الـ splanchnic bed"
      - "ترسم الـ vicious cycle من الـ vasodilation للـ hyperdynamic circulation"
    status: unverified
    steps:
      - kind: explain
        page: 39
        title: "قانون أوم بتاع الكبد"
        text: |
          الضغط (**P**) بيطلع من تفاعل الـ **resistance (R)** والـ **flow (F)**:

          **P = R × F**

          يعني الـ portal hypertension بييجي من:
          - **زيادة الـ resistance** للـ portal flow، و/أو
          - **زيادة الـ portal venous inflow**

          والكبد الطبيعي عنده قدرة إنه **يستوعب تغييرات كبيرة في الـ flow من غير ما الضغط يتغير** تقريبًا. في الـ cirrhosis، الاتنين بيحصلوا مع بعض: الـ resistance بتعلى **و** الـ inflow بيزيد.
      - kind: aside
        tone: analogy
        page: 39
        text: |
          افتكر **خرطوم الجنينة**: لو **ضغطت على آخره بصباعك** (resistance) **وفتحت الحنفية على الآخر** (flow)، المية بتطرطش بعيد.

          الـ cirrhosis بتعمل الاتنين: الكبد المتليف هو الصباع، والـ splanchnic vasodilation هي الحنفية المفتوحة. وعلشان كده العلاج بيا يرخّي الصباع، يا يقفل الحنفية، يا الاتنين.
      - kind: explain
        page: 40
        title: "الـ resistance جوه الكبد: جزء ثابت وجزء بيتحرك"
        text: |
          **1. Architectural disturbances (~70%):**
          - تشوّه الـ vascular architecture بالـ **fibrosis و scarring و regenerative nodules**، وكمان **thrombosis**.
          - ده الـ **mechanical component**: **fixed**.

          **2. Functional alterations (~30%):**
          - **Active contraction** للـ **hepatic stellate cells**، والـ **vascular smooth muscle cells** في الـ portal venules، والـ **myofibroblasts**.
          - ده الـ **dynamic component**: **modifiable by drugs**.

          فاكر الـ HSC اللي اتحوّلت لـ myofibroblast في درس الـ cirrhosis؟ هي نفسها اللي بتنقبض وتضيّق الـ sinusoid.
      - kind: check
        page: 40
        question: "Which part of the increased intrahepatic resistance in cirrhosis can drugs modify?"
        options:
          - "The functional (dynamic) part, about 30%, from active contraction of stellate cells and myofibroblasts"
          - "The architectural (fixed) part, about 70%, from fibrosis and nodules"
          - "Both parts equally"
          - "Neither: resistance is entirely structural"
        answer: 0
        why:
          - "صح: الـ **dynamic component** (~30%) هو اللي الأدوية تقدر عليه، لأنه انقباض خلايا مش ندبة."
          - "الـ 70% دي **mechanical, fixed**: ندبة و nodules، الدوا ما بيفكّهاش."
          - "الكتاب بيفرّق بينهم بوضوح: **fixed** و **modifiable by drugs**."
          - "فيه 30% functional، فالـ resistance مش كلها structural."
      - kind: explain
        page: 40
        title: "جوه الكبد: الميزان مايل للتضييق"
        text: |
          الـ intrahepatic resistance كمان بتعلى بسبب **imbalance بين الـ vasodilators والـ vasoconstrictors**:

          - **Vasoconstrictors** (كتير): **endothelin، angiotensin، norepinephrine، vasopressin، leukotrienes، thromboxane**.
          - **Vasodilators** (مش كفاية جوه الكبد): **nitric oxide (NO)** و **carbon monoxide (CO)**.

          النتيجة: الـ sinusoids والـ venules جوه الكبد **متضيّقة**.
      - kind: explain
        page: 41
        title: "برّه الكبد: الميزان مايل للتوسيع"
        text: |
          في الـ **splanchnic circulation** (الأمعاء والطحال) الصورة **العكس**: فيه **splanchnic vasodilatation** بسبب **increased vasodilators**:

          - **Glucagon**
          - **Endocannabinoids**
          - **Nitric oxide**
          - **Prostacyclin**
          - **Carbon monoxide**

          ومعاهم **increased angiogenesis** (angiogenic factors زي **VEGF**) بتعمل أوعية جديدة.

          والأوعية المتوسعة دي بتصب **دم أكتر** في الـ portal vein، فالـ **F** في المعادلة بتزيد.
      - kind: aside
        tone: trap
        page: 41
        text: |
          الـ **NO** موجود في القايمتين، وده الفخ:

          - **جوه الكبد: NO قليل** ← الـ resistance بتعلى.
          - **في الـ splanchnic bed: NO كتير** ← vasodilation والـ inflow بيزيد.

          الكبد بخيل بالـ NO على نفسه وكريم بيه على الأمعاء. 😄 والاتنين بيرفعوا الضغط.
      - kind: sort
        page: 40
        prompt: "الحاجة دي بتزيد فين في الـ cirrhosis وبتعمل إيه؟"
        bins: ["Intrahepatic vasoconstrictor (↑ R)", "Splanchnic vasodilator (↑ F)"]
        cards:
          - { text: "Endothelin", bin: 0 }
          - { text: "Thromboxane", bin: 0 }
          - { text: "Norepinephrine", bin: 0 }
          - { text: "Leukotrienes", bin: 0 }
          - { text: "Glucagon", bin: 1 }
          - { text: "Endocannabinoids", bin: 1 }
          - { text: "Prostacyclin", bin: 1 }
        why: "الـ constrictors (endothelin، angiotensin، norepinephrine، vasopressin، leukotrienes، thromboxane) بيضيّقوا جوه الكبد فالـ **R** تعلى. الـ splanchnic dilators (glucagon، endocannabinoids، NO، prostacyclin، CO) بيوسّعوا برّه فالـ **F** تزيد."
      - kind: figure
        page: 42
        title: "الدايرة اللي ما بتقفلش"
        alt: "Top panel: cirrhosis raises resistance (fixed and functional), vasodilators such as NO, and angiogenic factors such as VEGF. Resistance raises portal pressure. Vasodilators cause splanchnic vasodilation and more portal inflow, which also raises portal pressure. Angiogenic factors form new vessels. Portal pressure and new vessels lead to varices, variceal growth and rupture. Bottom panel: lower splanchnic and systemic arteriolar resistance lowers effective arterial blood volume, activates neurohumoral systems such as RAAS, causes sodium and water retention and a hyperdynamic circulation, which feeds back into more portal inflow. Clinical results: variceal hemorrhage, ascites, encephalopathy."
        caption: "فوق: الـ R والـ F بيرفعوا الضغط، والـ VEGF بيبني أوعية جديدة، والنتيجة **varices**. تحت: الـ vasodilation بيخدع الجسم إنه «ناشف»، فيحتفظ بالملح والمية، فالدورة الدموية تبقى **hyperdynamic** وتزوّد الـ inflow تاني."
        svg: |
          <svg viewBox="0 0 330 640" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="L03c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
