            <rect x="26" y="328" width="278" height="50" rx="10" class="fg-box"/>
            <text x="165" y="350" text-anchor="middle" class="t-b">Liver biopsy</text>
            <text x="165" y="368" text-anchor="middle" class="t-sm">gold standard · etiology + activity</text>
          </svg>
      - kind: explain
        page: 9
        title: "الـ imaging"
        text: |
          - **US**: surface nodularity، dense reflective echoes، **enlarged caudate lobe**، regenerating nodules، و splenomegaly و ascites. وهو أداة **HCC screening** كل **6 months** مع أو من غير **AFP**.
          - **CT**: nodules، fatty change، و SOL زي HCC (**multiphase CT**).
          - **MRI**: nodules و malignancy (**multiphase MRI**)، كمان **iron** (hemochromatosis)، **fat** (steatosis)، و biliary obstruction (**MRCP**).
      - kind: figure
        page: 10
        title: "الكبد المتليّف في الـ US"
        image: { file: hb/L01-cirrhosis-us.webp, book: true }
        alt: "Ultrasound of a cirrhotic liver with a coarse echo pattern and an arrow on its irregular edge."
        caption: "السهم على ==irregular edges== بتاعة الكبد، والنسيج كله ==coarse echo pattern== بدل ما يبقى ناعم (ده شرح الصورة في الكتاب ص10). الـ US هو كمان أداة الـ HCC screening كل 6 months."
      - kind: explain
        page: 10
        title: "الـ biopsy"
        text: |
          **Gold standard**، عادة **guided by US or CT**. صعبة ساعات، بس بتدّي **clue to the etiology and inflammatory activity**.

          - **Transjugular route** لما يكون فيه contraindication زي **ascites** أو **coagulation defect**.
          - Complications (نادرة بس خطيرة): **bleeding**، **infection**، و **injury to nearby organs**.
      - kind: check
        page: 10
        question: "A cirrhotic with **tense ascites** and **INR 2.1** needs a liver biopsy. Best route?"
        options:
          - "Transjugular"
          - "Percutaneous, US-guided"
          - "Open surgical biopsy"
          - "Biopsy is never allowed"
        answer: 0
        why:
          - "صح: الكتاب بيقول transjugular لما يكون فيه ascites أو coagulation defect."
          - "الـ percutaneous مع ascites و coagulopathy خطر bleeding."
          - "الجراحة في cirrhotic poor operative risk، ومش اللي الكتاب بيقوله."
          - "مش ممنوعة، فيه route مخصوص للحالة دي."
      - kind: explain
        page: 11
        title: "الـ FibroScan بيشتغل إزاي؟"
        text: |
          **Transient elastography (TE)** = ultrasound-based **non-imaging** technique (**no B-mode**). الـ transducer بيطلّع **shear waves** تمشي في الكبد.

          **The stiffer the liver, the faster the wave**. السرعة بتتحوّل لـ **liver stiffness measurement (LSM) in kPa**. وهو **the most widely validated tool** للـ advanced fibrosis و cirrhosis.
      - kind: aside
        tone: analogy
        page: 11
        text: |
          زي ما بتخبط على حيطة: الحيطة الخرسانة الصوت بيعدّي فيها بسرعة، والإسفنج بيبلع الخبطة. الكبد الناشف (fibrotic) بيوصّل الموجة **أسرع**، فالرقم **أعلى**.

          بس خلي بالك: أي حاجة تخلي الكبد «مشدود» مؤقتًا هتعلّي الرقم حتى من غير fibrosis.
      - kind: mnemonic
        page: 11
        word: "C-FIVE"
        parts:
          - { key: "C", text: "Cholestasis" }
          - { key: "F", text: "Food ingestion" }
          - { key: "I", text: "Inflammation (hepatic)" }
          - { key: "V", text: "Venous congestion" }
          - { key: "E", text: "Exercise" }
        hook: |
          المريض داخل الأوضة **C-FIVE**: لسه فاطر فول، جاي من الجيم، وعنده hepatitis نشطة؟ الـ FibroScan هيقولك F4 وهو بريء. 😅 كل ده **overestimates fibrosis**.
      - kind: explain
        page: 11
        title: "التحاليل"
        text: |
          - في الـ decompensated: **albumin low** (الكبد بيصنعه) و **PT prolonged** (coagulation factor defects).
          - **AST > ALT**، mildly to moderately elevated، و **normal levels do not exclude cirrhosis**.
          - **Bilirubin و GGT** ممكن يعلوا.
          - **Immunoglobulins** (خصوصًا gamma-globulins) عالية بسبب **impaired clearance by the liver**.
      - kind: explain
        page: 12
        title: "الدم والـ AFP"
        text: |
          - **WBC**: low = hypersplenism، high = infection.
          - **Thrombocytopenia**: hypersplenism، **thrombopoietin deficiency**، immune، و bone marrow suppression من alcohol أو HCV.
          - **Erythrocytosis** ممكن تحصل مع **HCC**.
          - تابع: renal function، electrolytes، و **AFP**.
      - kind: table
        page: 12
        title: "Anemia in cirrhosis: 3 types"
        columns: ["Type", "Causes (book)"]
        rows:
          - ["Normocytic normochromic", "Acute GI bleeding, hypersplenism, marrow aplasia (alcohol or HCV)"]
          - ["Microcytic hypochromic", "Chronic occult GI blood loss, anemia of chronic disease"]
          - ["Macrocytic", "Vitamin B12 and folate deficiency"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: match
        page: 12
        prompt: "كل سبب للـ cirrhosis والتحليل اللي بيشاور عليه:"
        pairs:
          - ["Wilson disease", "Low ceruloplasmin, high 24-h urine copper"]
          - ["Hemochromatosis", "High transferrin saturation and ferritin"]
          - ["PBC", "Anti-mitochondrial antibodies"]
          - ["Autoimmune", "Autoantibodies and high IgG"]
          - ["MASH", "High fasting glucose or HbA1c, hyperlipidemia"]
          - ["Alpha-1 antitrypsin deficiency", "A1AT level and PI phenotype"]
      - kind: explain
        page: 13
        title: "وتلات حاجات كمان"
        text: |
          - **Endoscopy**: بتأكد الـ **varices**، وبتلاقي أسباب النزيف في المريء والمعدة والـ proximal duodenum.
          - **HCC screening**: **US every 6 months** ± AFP.
          - **HVPG**: بيثبت **presence and cause of PH** و **response to therapy**.
      - kind: try
        items: [hb.L01.037, hb.L01.039, hb.L01.044]
    recap:
      - "التشخيص = widespread nodules + fibrosis. الـ biopsy gold standard، والـ transjugular لو ascites أو coagulopathy."
      - "TE: stiffer = faster = kPa أعلى. وبيكدب لفوق مع **C-FIVE**."
      - "APRI = AST + platelets. FIB-4 = age، AST، ALT، platelets."
      - "AST > ALT، albumin ↓، PT ↑، Ig ↑، والـ normal enzymes ما بتنفيش cirrhosis."
      - "HCC screening: US كل 6 شهور ± AFP."
    practice: [hb.L01.035, hb.L01.036, hb.L01.037, hb.L01.038, hb.L01.039, hb.L01.040, hb.L01.041, hb.L01.042, hb.L01.043, hb.L01.044, hb.L01.045, hb.L01.046, hb.L01.047, hb.L01.048, hb.L01.049, hb.L01.050, hb.L01.095, hb.L01.128, hb.L01.129, hb.L01.130, hb.L01.131, hb.L01.132, hb.L01.133, hb.L01.134, hb.L01.135, hb.L01.136, hb.L01.137, hb.L01.138, hb.L01.139, hb.L01.140, hb.L01.167, hb.L01.168, hb.L01.169, hb.L01.184, hb.L01.186, hb.L01.187]
