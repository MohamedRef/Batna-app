# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: improved
  ar_eg: "شاشة الحاسبات بقت زي MDCalc: بحث بالاسم أو بالعربي أو بالعضو، وفلتر للأقسام، وكل حاسبة في صف كامل وتحتها سطر بيقول بتستخدمها في إيه"
  en: "The Calculators screen works like MDCalc: search by name, Arabic or organ, an area filter, and each calculator on a full row with a line on what it is for"
- kind: new
  ar_eg: "نجمة ☆ تثبّت الحاسبة في «المفضلة» فوق القايمة وبتتزامن بين أجهزتك، وقسم «آخر ما فتحت» بيرجّعك لآخر حاسبات استخدمتها"
  en: "A ☆ pins a calculator to Favourites at the top (synced across devices), and Recent brings back the last ones you opened"
- kind: improved
  ar_eg: "على الماك والتابلت بالعرض الحاسبة بتفتح جنب القايمة ومفيش فراغ فاضي، وعلى الموبايل زرار الرجوع بيرجّعك لنفس مكانك في القايمة"
  en: "On the Mac and a landscape tablet the calculator opens beside the list with no empty pane; on phones Back returns to the same spot in the list"
- kind: improved
  ar_eg: "صفحة الحاسبة بقت زي MDCalc: الاختيارات زراير بدل القوايم، والوحدة جوه خانة الرقم، والنتيجة في شريط تحت قدامك وانت بتملا، وتحته «يعني إيه»"
  en: "The calculator page works like MDCalc: options are buttons, the unit sits in the number box, and the result stays in a bar at the foot as you fill it in"
- kind: fixed
  ar_eg: "سهم القوايم المنسدلة مبقاش لازق في طرف الخانة، في كل الشاشات"
  en: "The dropdown arrow no longer sits on the edge of the box, on every screen"
