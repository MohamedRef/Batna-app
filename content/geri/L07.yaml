  - id: geri.L07.103
    kind: card
    topic: social-meds
    front: What is the lecture's warning about the social history?
    back: Most consultations happen away from the patient's home and without the next of kin or carers, so the social history is often thin (a single word, "married").
    src: { page: 126, quote: "How often have you seen a social history comprising one word 'married'?" }
    status: unverified
  - id: geri.L07.104
    kind: card
    topic: social-meds
    front: Why may guideline-based prescribing not fit frail older people?
    back: Frail older people and those with major comorbidity are unlikely to have been represented in the trials behind the guidelines.
    src: { page: 126, quote: "The evidence base for guideline-based prescribing may not be directly relevant to frail older people or those with significant comorbidity (as such people are unlikely to have been represented in trial participants). Further, even established medications may no longer be useful as diseases may have run their course, physiology may have changed, or the reason for their prescription may have been to treat another drug's side effect." }
    status: unverified
    tags: [high-yield]
  - id: geri.L07.105
    kind: enumerate
    topic: social-meds
    prompt: Why may an established medication no longer be useful in an older person?
    points:
      - The disease may have run its course
      - Physiology may have changed
      - It may have been prescribed to treat another drug's side effect
      - It is for long-term risk reduction, less relevant with a limited lifespan
