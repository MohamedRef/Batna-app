  - id: git.L03.116
    kind: enumerate
    topic: dyspepsia
    prompt: What does the FD-focused history assess?
    points:
      - Alarm symptoms or signs
      - Date of onset and duration
      - Postinfection onset, or onset after stress or psychological trauma
      - Other upper GI symptoms; reflux symptoms in isolation are not FD
      - Epigastric pain related to bowel habit or relieved by defecation (likely IBS)
      - Weight loss (amount and time)
      - Other DGBI and functional non-GI disorders
      - Family history of gastro-oesophageal cancer or coeliac disease
      - Medications (NSAIDs, opioids)
    pass: 5
    hook: "هيستوري الـ FD «9»: alarm، بدأت إمتى وبقالها قد إيه، بعد infection أو stress أو trauma، أعراض upper GI تانية (الـ reflux لوحده مش FD)، وجع مع التبرز أو بيروح بيه (غالبًا IBS)، weight loss (قد إيه وفي قد إيه)، DGBI ومشاكل وظيفية تانية، family history لـ gastro-oesophageal cancer أو coeliac، وأدوية (NSAIDs، opioids)."
    src: { page: 102, quote: "Symptoms compatible with FD\nFD-focused history taking and physical examination:\n  Assess for presence of alarm symptoms or signs\n  Date of onset and duration of symptoms of dyspepsia\n  Evidence of postinfection onset, or after acute or chronic stress or psychological trauma\n  Assess for presence of other upper gastrointestinal symptoms\n  If epigastric pain is present, confirm this is not related to a change in bowel habit or relieved by defaecation; this is likely to be IBS\n  Assess for presence of gastro-oesophageal reflux symptoms (heartburn or regurgitation); if present in isolation this is not FD\n  Assess for weight loss (amount lost and over what time period)\n  Elicit lower gastrointestinal symptoms for presence of other DGBI\n  Assess for presence of other functional non-gastrointestinal disorders\n  Family history of gastro-oesophageal cancer or coeliac disease\n  Medications (including NSAIDs and opioids)\nBaseline investigations:\n  Full blood count in patients aged ≥55 years and coeliac serology in patients with overlap of IBS-type symptoms\n  Breath or stool testing for H. pylori" }
    status: unverified
