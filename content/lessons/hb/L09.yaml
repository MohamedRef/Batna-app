    steps:
      - kind: explain
        page: 167
        quote: "a pathological bacterial translocation from the gut to mesenteric lymph nodes then to the ascitic fluid due to a disruption of the intestinal permeability"
        title: "SBP يعني إيه؟"
        text: |
          **Spontaneous bacterial peritonitis (SBP)**: acute bacterial infection في الـ ascitic fluid، من غير أي intra-abdominal source. ومن هنا كلمة spontaneous: محدش خرم حاجة.

          **Pathogenesis**، خطوتين:
          - ==Bacterial translocation==: الـ portal hypertension بتبوّظ الـ intestinal permeability والـ motility (**leaky gut**). البكتيريا بتعدّي من الأمعاء للـ mesenteric lymph nodes، وبعدين للـ ascites.
          - ==Impaired immunity==: الـ local والـ systemic immunity ضعيفة، فمش قادرة تسيطر على البكتيريا، فبتتكاثر في المية.

          لاحظ الرابط: نفس الـ bacterial translocation اللي بيزوّد الـ vasodilatation في الدرس الأول هو اللي بيعمل الـ SBP هنا.
      - kind: mnemonic
        page: 166
        quote: "(1) acute gastrointestinal (GI) bleeding, (2) a previous SBP episode, and (3) low protein levels in ascitic fluid (< 1 g/dL)"
        word: "BLP"
        parts:
