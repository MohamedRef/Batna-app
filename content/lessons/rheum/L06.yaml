  - id: rheum.L06.lesson8
    title: "الـ NK cells: الكمين اللي بيمسك اللي من غير بطاقة"
    hook: "الـ virus يخبّي الـ class I علشان الـ CTL ما تشوفهوش، فالـ NK تقتله لأنه خبّاه."
    minutes: 8
    pages: [102, 104]
    topics: [nk]
    goals:
      - "تعرف الـ NK cells وإزاي بتتنشّط على مرحلتين"
      - "تشرح طريقتين القتل: ADCC والـ cell contact"
      - "تفهم ليه غياب الـ class I هو اللي بيقتل الخلية"
    status: unverified
    steps:
      - kind: explain
        page: 102
        title: "الـ NK cells"
        quote: "NK cells kill tumour cells and virally infected cells without the need for prior sensitisation."
        text: |
          - شبه الـ lymphocytes بس ==separate lineage== عن الـ T و B.
          - بتقتل **tumour cells** و **virally infected cells** من غير **prior sensitisation**.
          - بتفرز **IFN-γ** يشغّل الـ phagocytes ويجيب الـ T cells.
          - بتتنشّط بـ **IFN-γ و IL-2 و IL-12**.
          - بتقتل بطريقتين: **Antibody-dependent cell-mediated cytotoxicity (ADCC)**، والهدف متغطي Immunoglobulin G (IgG) والـ natural killer (NK) بتمسكه بالـ **fc-gamma receptor III (FcγRIII)**؛ أو **cell–cell contact** بـ receptor للـ class I و receptor للـ carbohydrates.
      - kind: reveal
        page: 102
        quote: "NK cells kill tumour cells and virally infected cells without the need for prior sensitisation."
        prompt: "الـ NK شبه الـ lymphocytes، بس بتقتل من غير prior sensitisation. ده بيخليها innate ولا adaptive؟ وليه ده مهم؟"
        answer: |
          **Innate**: الكتاب حاططها مع الـ macrophages والـ neutrophils في جدول الـ innate (ص 85)، وبتقتل من غير ما تتعلّم العدو قبل كده.

          ليه مهم؟ لأن الـ CTL محتاجة **3–5 أيام** clonal expansion. في الأيام الأولى للـ virus، الـ ==NK== هي اللي بتقتل الخلايا المصابة، وبتفرز **IFN-γ** يشغّل الـ macrophages ويجيب الـ T cells. يعني بتسلّم الشغل للـ adaptive.
      - kind: explain
        page: 103
        title: "الـ NK بتتنشّط على مرحلتين"
        quote: "The first stage is mediated by cytokines"
        text: |
          شكل الكتاب في ص 103 بيقسّم التنشيط:
          1. **المرحلة الأولى بالـ cytokines**: الـ **IL-12** والـ **IL-2** بيوصلوا للـ NK، فتتشغّل وتفرز **IFN-γ**.
          2. **المرحلة التانية contact** مع الخلية الهدف: الـ ==NKR-P1== (lectin) بيمسك **carbohydrate** على سطح الخلية.

          وفي نفس الصفحة الـ **antibody-dependent cell-mediated cytotoxicity (ADCC)**: الهدف متغطي **IgG**، والـ NK بتمسك رجل الـ IgG بالـ **FcγRIII** وتقتله.

          ليه مرحلتين؟ التفسير المقبول (مش في الكتاب): الـ cytokines بتقول "فيه عدوى في المنطقة، اصحي"، والـ contact بيقول "الخلية دي بالذات". زي ما الـ T cell محتاجة إشارتين، الـ NK كمان ما بتقتلش من إشارة واحدة.
