        text: "الكتاب بيستشهد بـ Beers **2003**. النسخة الحالية **AGS Beers Criteria 2023**، وفي أوروبا **STOPP/START v3 2023**، والـ START بيفكّرك بالـ undertreatment. في الامتحان: كلام الكتاب."
        ref: "AGS Beers Criteria 2023; STOPP/START version 3, 2023"
