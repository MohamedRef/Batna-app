  - id: endo.L07.lesson6
    title: "الـ pheo crisis: الـ alpha قبل الـ beta"
    hook: "غلطة واحدة في الترتيب تعمل hypertensive crisis أسوأ من اللي بدأت بيه."
    minutes: 8
    pages: [132, 138]
    topics: [pheo]
    goals:
      - "تعرف الـ crisis والـ precipitants"
      - "تختار التحليل والأشعة"
      - "تعالج بالترتيب الصح والجرعات"
    status: unverified
    steps:
      - kind: explain
        page: 132
        quote: "either in the form of hypertensive crisis or cardiogenic (or adrenergic) shock."
        title: "الـ crisis"
        text: |
          ==Pheochromocytoma crisis==: اضطراب hemodynamic يهدد الحياة، يا **hypertensive crisis** يا **cardiogenic adrenergic shock**. الكتاب كاتب mortality حوالي 85%.

          مفيش رقم ثابت، بس الحدود المقبولة: **220/120 mmHg**.

          **Precipitants**: straining، exercise، **pressure on the abdomen**، وأدوية زي الـ **anaesthesia**.
      - kind: explain
        page: 133
        quote: "Sustained or paroxysmal hypertension is the most common sign; however, around 10% may have normal blood pressure."
        title: "الصورة"
        text: |
          الـ paroxysm من دقايق لساعات، ممكن كذا مرة في اليوم أو مرة في الشهر.

          - **Triad**: episodic headache، sweating، tachycardia.
          - ==Hypertension== sustained أو paroxysmal هي أشيع علامة، بس **10%** ضغطهم طبيعي.
          - Pallor، numbness، tingling، أطراف ساقعة.
          - الـ triad مع hypertension: **specificity 93.8%**، **sensitivity 90.9%**.
      - kind: table
        page: 133
        quote: "measuring the fractionated metanephrines in the plasma, is a first-line test."
        title: "التشخيص"
        columns: ["Step", "Test"]
        rows:
          - ["High suspicion", "Plasma fractionated metanephrines"]
          - ["Low suspicion", "24-h urine catecholamines + metanephrines"]
          - ["Then", "CT or MRI adrenals"]
          - ["No adrenal mass", "123I-MIBG scan"]
        hide: [[0, 1], [1, 1], [3, 1]]
