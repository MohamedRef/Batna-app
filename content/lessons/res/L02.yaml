schema: batna.lesson/v1
lecture: res.L02
lessons:
  # ------------------------------------------------------------------
  - id: res.L02.lesson1
    title: "الوبائيات في 3 كلمات"
    hook: "كام واحد عيان؟ فين ومين وإمتى؟ وليه هما بالذات؟ دي الـ epidemiology كلها."
    minutes: 10
    pages: [3, 15]
    topics: [definition, uses]
    goals:
      - "تعرّف الـ epidemiology بالـ 3 كلمات: frequency، distribution، determinants"
      - "تفرق بين descriptive وanalytic epidemiology"
      - "تعدّ الـ uses of epidemiology وترتب الـ natural history of disease"
    status: unverified
    steps:
      - kind: explain
        page: 3
        quote: "Epidemiology is the study of:\n  Frequency\n  Distribution\n  Determinants\nof health related phenomenon in the human population."
        title: "التعريف"
        text: |
          **Epidemiology** = دراسة الـ ==frequency== والـ ==distribution== والـ ==determinants== لأي health-related phenomenon في **human population**.

          - **Frequency**: كام؟ (rates وratios).
          - **Distribution**: المرض متوزع إزاي: **who? when? where?**
          - **Determinants**: إيه اللي بيخلي الـ risk مختلف بين مجموعة والتانية؟

          لاحظ: الطب الإكلينيكي بيبص على **عيان واحد**، والـ epidemiology بتبص على **population**.
      - kind: reveal
        page: 4
        quote: "Epidemiology\nThe Study of how disease\ndistributes in human\npopulation\n“Distribution”"
        prompt: "«Distribution» في تعريف الـ epidemiology معناها إيه بالظبط؟"
        answer: |
          الـ epidemiology = ==the study of how disease distributes in human population==: المرض موجود **عند مين** و**فين** و**إمتى**.

          ليه نبدأ بالتوزيع؟ لأن المرض مش بيوزّع نفسه عشوائي: لو لقيته متجمع في سن معين أو مكان معين أو موسم معين، ده أول خيط للسبب. التفسير المقبول (مش في الكتاب).
      - kind: figure
        page: 5
        quote: "Hepatitis B endemicity map:\n  Low endemicity <2%\n  Intermediate endemicity 2-8%\n  High endemicity >8%\n  No data"
        title: "Distribution على الخريطة"
        alt: "Three boxes from the slide map legend for hepatitis B endemicity: low below 2 percent, intermediate 2 to 8 percent, high above 8 percent."
        caption: "الخريطة دي بتجاوب «where?»: نفس الفيروس، بس الـ ==distribution== مختلف جدًا من بلد للتانية."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="18" text-anchor="middle" class="t-b">HBV endemicity (slide 5)</text>
            <rect x="10" y="34" width="100" height="40" rx="6" class="fg-good"/>
            <text x="60" y="52" text-anchor="middle" class="t-sm t-b">Low</text>
            <text x="60" y="67" text-anchor="middle" class="t-sm">&lt;2%</text>
            <rect x="115" y="34" width="100" height="40" rx="6" class="fg-acc"/>
            <text x="165" y="52" text-anchor="middle" class="t-sm t-b">Intermediate</text>
            <text x="165" y="67" text-anchor="middle" class="t-sm">2-8%</text>
            <rect x="220" y="34" width="100" height="40" rx="6" class="fg-bad"/>
            <text x="270" y="52" text-anchor="middle" class="t-sm t-b">High</text>
            <text x="270" y="67" text-anchor="middle" class="t-sm">&gt;8%</text>
            <text x="165" y="110" text-anchor="middle" class="t-sm t-mut">Same virus, very different burden</text>
            <text x="165" y="130" text-anchor="middle" class="t-sm t-mut">from one region to another</text>
            <text x="165" y="180" text-anchor="middle" class="t-sm">Who? When? Where? = distribution</text>
          </svg>
      - kind: figure
        page: 5
        title: "شريحة 5: خريطة الـ hepatitis B الحقيقية"
        image: { file: res/L02-s05-hbv-map.webp, book: true }
        alt: "World map of hepatitis B endemicity, countries shaded by a legend at the bottom left: yellow no data, very light blue low endemicity under 2%, mid blue intermediate endemicity 2-8%, dark blue high endemicity over 8%. Most of sub-Saharan Africa, Mongolia and parts of East and Southeast Asia are dark blue; Russia, North Africa, the Middle East, South Asia and parts of South America are mid blue; North America, western Europe and Australia are light blue."
        caption: |
          دي الخريطة الأصلية اللي الرسمة المبسّطة فوق متاخدة منها. المفتاح **تحت شمال**:

          - **أصفر**: No data.
          - **أزرق فاتح جدًا**: Low endemicity أقل من 2%: أمريكا الشمالية، غرب أوروبا، أستراليا.
          - **أزرق متوسط**: Intermediate 2-8%: روسيا، شمال أفريقيا، الشرق الأوسط، جنوب آسيا.
          - **أزرق غامق**: High أكتر من 8%: معظم أفريقيا جنوب الصحرا، منغوليا، وأجزاء من شرق وجنوب شرق آسيا.

          اللي تاخده: نفس المرض، بس لما ترسمه على الخريطة تسأل على طول «==where?==»، وده سؤال الـ **distribution**؛ والسؤال اللي بعده «ليه هنا أكتر؟» هو بداية الـ **determinants**.
      - kind: explain
        page: 6
        quote: "Epidemiology: What determines differences in disease risk among different population subgroups (\"Determinants\")"
        title: "و«Determinants»"
        text: |
          الكلمة التالتة في التعريف: ==determinants== = إيه اللي **بيحدد الفرق في الـ risk** بين subgroups مختلفة من الناس.

          - **Distribution** بيقولك المرض أكتر عند مين.
          - **Determinants** بيسأل: ليه هما بالذات؟

          يعني الأولاني وصف، والتاني تفسير. وده نفس الفرق بين **descriptive** و**analytic** epidemiology اللي جاي.
      - kind: check
        page: 7
        quote: "Components Of Epidemiology:\n  Disease frequency\n  Distribution of disease\n  Determinants of disease"
        question: "Which of these is NOT one of the three components of epidemiology?"
        options:
          - "Disease treatment"
          - "Disease frequency"
          - "Distribution of disease"
          - "Determinants of disease"
        answer: 0
        why:
          - "صح: العلاج شغل الإكلينيكي مع العيان الواحد؛ الـ epidemiology بتدرس frequency وdistribution وdeterminants في population."
          - "مكوّن: قد إيه المرض موجود (counts، rates)."
          - "مكوّن: عند مين وفين وإمتى."
          - "مكوّن: ليه الفرق في الـ risk."
      - kind: table
        page: 8
        quote: "Components:\n  1. Frequency: Rates & Ratios\n  2. Distribution: Who? When? Where? Descriptive epidemiology"
        title: "Components of epidemiology"
        columns: ["Component", "Question", "Branch"]
        rows:
          - ["Frequency", "How many? (rates, ratios)", "Measurement"]
          - ["Distribution", "Who? When? Where?", "Descriptive epidemiology"]
          - ["Determinants", "Why? (causes, risk factors)", "Analytic epidemiology"]
        hide: [[1, 2], [2, 2]]
      - kind: figure
        page: 9
        quote: "Knowledge of frequency and distribution leads to:\n  Formulate hypothesis\n  Possible causal or preventive factors\n3. Determinants: Analytic epidemiology. Test hypothesis and identify causes or risk factors"
        title: "من الوصف للسبب"
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L02h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="20" y="8" width="290" height="44" rx="8" class="fg-box"/>
            <text x="165" y="27" text-anchor="middle" class="t-sm t-b">1-2 Frequency + distribution</text>
            <text x="165" y="43" text-anchor="middle" class="t-sm t-mut">descriptive: who, where, when</text>
            <path d="M165 54v14" class="fg-arrow" marker-end="url(#L02h)"/>
            <rect x="20" y="72" width="290" height="44" rx="8" class="fg-acc"/>
            <text x="165" y="91" text-anchor="middle" class="t-sm t-b">Formulate a hypothesis</text>
            <text x="165" y="107" text-anchor="middle" class="t-sm t-mut">possible causal or preventive factors</text>
            <path d="M165 118v14" class="fg-arrow" marker-end="url(#L02h)"/>
            <rect x="20" y="136" width="290" height="44" rx="8" class="fg-box"/>
            <text x="165" y="155" text-anchor="middle" class="t-sm t-b">3 Determinants</text>
            <text x="165" y="171" text-anchor="middle" class="t-sm t-mut">analytic: test the hypothesis</text>
            <path d="M165 182v14" class="fg-arrow" marker-end="url(#L02h)"/>
            <rect x="20" y="200" width="290" height="32" rx="8" class="fg-box"/>
            <text x="165" y="221" text-anchor="middle" class="t-sm t-b">Causes or risk factors identified</text>
          </svg>
        caption: "معرفة الـ frequency والـ distribution بتولّد ==hypothesis==، والـ analytic epidemiology بتختبرها وتطلّع الأسباب أو الـ risk factors. الفرضية هي الكوبري بين النصين."
        alt: "Chain: frequency and distribution, then formulate a hypothesis, then determinants (analytic epidemiology), then causes identified."
      - kind: explain
        page: 10
        quote: "Broad Characterizations of Epidemiology Practices:\n  Descriptive Epidemiology: Examining, identifying, and reporting on the frequency and distribution of disease in a population. Learning the basic features of its distribution.\n  Analytic Epidemiology: Identifying factors underlying disease or health events. Testing a hypothesis by studying how exposures relate to outcomes"
        title: "Descriptive بيولّد فرضية، وAnalytic بيختبرها"
        text: |
          - ==Descriptive epidemiology==: بتفحص وتبلّغ عن الـ **frequency and distribution**. بتعرف الـ basic features.
          - ==Analytic epidemiology==: بتدوّر على العوامل ورا المرض، **testing a hypothesis** بدراسة علاقة الـ **exposures** بالـ **outcomes**.

          الكوبري بينهم (slide 9): لما تعرف الـ frequency والـ distribution، تقدر **formulate a hypothesis** عن عوامل ممكن تكون causal أو preventive. وبعدين الـ analytic تختبرها.

          مثال: لاحظت إن الـ hepatitis C virus (HCV) أعلى في قرى الدلتا عند الكبار (descriptive). فرضيتك: حقن الـ tartar emetic القديمة. بتختبرها بـ case-control (analytic).
      - kind: order
        page: 11
        quote: "There is a logical sequence to the practice of epidemiology in disease prevention:\n  Descriptive → Analytical → Interventions → Programs → Disease prevention"
        prompt: "رتّب الـ logical sequence of epidemiology in disease prevention:"
        steps: ["Descriptive", "Analytical", "Interventions", "Programs"]
        why: "توصف ← تلاقي السبب ← تجرب حل ← تعمّمه في برنامج، والنتيجة disease prevention."
      - kind: explain
        remind: [res.L02.009]
        page: 12
        quote: "Uses of Epidemiology:\n  1. Natural history of disease\n  2. Classification of disease\n  3. Identify determinants (risk factors)\n  4. Planning and evaluation\n  5. Data related to availability, accessibility and utilization"
        title: "الـ uses of epidemiology"
        text: |
          - **Natural history of disease**.
          - **Classification of disease**.
          - **Identify determinants** (risk factors).
          - **Planning and evaluation**: حجم المشكلة علشان تخطط الخدمات، وتقييم برنامج تطعيم مثلًا.
          - **Data on availability, accessibility and utilization** للخدمات.
      - kind: explain
        page: 15
        quote: "Planning and evaluation. Example:\n  The extent of a health problem for planning health services\n  Evaluation of an immunization program\nData related to availability, accessibility and utilization"
        title: "Planning and evaluation"
        text: |
          من استخدامات الـ epidemiology: ==planning and evaluation==. أمثلة slide 15:

          - **حجم المشكلة** علشان تخطط الـ health services (كام سرير؟ كام دكتور؟).
          - **Evaluation of an immunization program**.
          - داتا عن **availability, accessibility and utilization** للخدمة.

          وخلي بالك في التقييم: الـ **coverage** (كام طفل خد التطعيم) غير الـ **impact** (الحالات قلّت ولا لأ). 95% coverage مش معناها إن البرنامج نجح لوحدها؛ النجاح بيبان في نزول الحالات (من شرح الدكتورة في التسجيل).
      - kind: figure
        page: 13
        quote: "Natural history of disease timeline:\n  Exposure, then Pathologic Changes, then Onset of Symptoms, then Usual Time of Diagnosis\n  Stage of Susceptibility\n  Stage of Subclinical Disease\n  Stage of Clinical Disease\n  Stage of Recovery, Disability or Death\nSource: Centers for Disease Control and Prevention. Principles of epidemiology, 2nd ed. Atlanta: U.S. Department of Health and Human Services; 1992."
        title: "الـ natural history of disease"
        alt: "A horizontal timeline in four stages: susceptibility, subclinical disease, clinical disease, and recovery, disability or death. Arrows mark exposure (start of susceptibility to subclinical), pathologic changes (start of subclinical), onset of symptoms and the usual time of diagnosis (start of clinical disease)."
        caption: "التشخيص عادةً بيحصل ==بعد== الـ symptoms. كل اللي قبله (subclinical) هو هدف الـ screening."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L02n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="20" y="10" width="290" height="58" rx="6" class="fg-good"/>
            <text x="165" y="34" text-anchor="middle" class="t-b">1 Stage of susceptibility</text>
            <text x="165" y="54" text-anchor="middle" class="t-sm">ends with: exposure</text>
            <path d="M165 68v14" class="fg-arrow" marker-end="url(#L02n)"/>
            <rect x="20" y="86" width="290" height="58" rx="6" class="fg-acc"/>
            <text x="165" y="110" text-anchor="middle" class="t-b">2 Stage of subclinical disease</text>
            <text x="165" y="130" text-anchor="middle" class="t-sm">starts with: pathologic changes</text>
            <path d="M165 144v14" class="fg-arrow" marker-end="url(#L02n)"/>
            <rect x="20" y="162" width="290" height="72" rx="6" class="fg-bad"/>
            <text x="165" y="186" text-anchor="middle" class="t-b">3 Stage of clinical disease</text>
            <text x="165" y="206" text-anchor="middle" class="t-sm">starts with: onset of symptoms</text>
            <text x="165" y="224" text-anchor="middle" class="t-sm t-b">then the usual time of diagnosis</text>
            <path d="M165 234v14" class="fg-arrow" marker-end="url(#L02n)"/>
            <rect x="20" y="252" width="290" height="58" rx="6" class="fg-box"/>
            <text x="165" y="276" text-anchor="middle" class="t-b">4 Recovery, disability</text>
            <text x="165" y="296" text-anchor="middle" class="t-b">or death</text>
          </svg>
      - kind: check
        page: 13
        quote: "Natural history of disease timeline:\n  Exposure, then Pathologic Changes, then Onset of Symptoms, then Usual Time of Diagnosis\n  Stage of Susceptibility\n  Stage of Subclinical Disease\n  Stage of Clinical Disease\n  Stage of Recovery, Disability or Death\nSource: Centers for Disease Control and Prevention. Principles of epidemiology, 2nd ed. Atlanta: U.S. Department of Health and Human Services; 1992."
        question: "A smoker has early dysplasia on bronchoscopy but no symptoms. Which stage of the natural history is he in?"
        options:
          - "Subclinical disease"
          - "Susceptibility"
          - "Clinical disease"
          - "Recovery, disability or death"
        answer: 0
        why:
          - "صح: فيه pathologic changes ومفيش symptoms."
          - "الـ susceptibility قبل أي تغير مرضي."
          - "الـ clinical تبدأ مع الـ onset of symptoms."
          - "لسه ماوصلش للنهاية."
      - kind: explain
        page: 14
        quote: "Classification of diseases\n| Clinically | Epidemiology |\n|---|---|\n| diarrheal diseases; Respiratory diseases; Febrile diseases | By mode of transmission: Water born; Food borne; Vector born |\n| → Treatment | → prevention |\nExample: a man with high fever ---- malaria"
        title: "تصنيف الدكتور وتصنيف الوبائي"
        text: |
          - **Clinically (diarrheal, respiratory, febrile diseases)**: ده بيخدم ==treatment==. عيان سخن جدًا في منطقة malaria؟ فكّر malaria.
          - **Epidemiologically, by mode of transmission (water-borne, food-borne, vector-borne)**: ده بيخدم ==prevention==. لو المرض water-borne، الحل في المية.
      - kind: try
        items: [res.L02.001, res.L02.002, res.L02.006, res.L02.013, res.L02.076]
    recap:
      - "Epidemiology = frequency + distribution + determinants في population."
      - "Descriptive: who/when/where ← hypothesis. Analytic: تختبر الـ hypothesis."
      - "Sequence: descriptive ← analytical ← interventions ← programs."
      - "Natural history: susceptibility ← subclinical ← clinical ← recovery/disability/death."
      - "Clinical classification للعلاج، epidemiological (by transmission) للوقاية."
    practice: [res.L02.001, res.L02.002, res.L02.003, res.L02.004, res.L02.005, res.L02.006, res.L02.007, res.L02.008, res.L02.009, res.L02.010, res.L02.011, res.L02.012, res.L02.013, res.L02.076, res.L02.077]  # ------------------------------------------------------------------
  - id: res.L02.lesson2
    title: "الأرقام بتيجي منين؟ عدد، نسبة، ولا معدل؟"
    hook: "«عندنا 80 طفل malaria» جملة ناقصة. 80 من كام؟ وفي قد إيه؟ هنا بتفرق الـ count والـ proportion والـ rate."
    minutes: 6
    pages: [16, 23]
    topics: [sources, measures]
    goals:
      - "تعدّ الـ 9 sources of epidemiological data"
      - "تفرق بين count وproportion وrate"
    status: unverified
    steps:
      - kind: explain
        remind: [res.L02.014]
        page: 16
        quote: "Sources of epidemiological data:\n  1. Census\n  2. Population estimates: Planning services; Computing rates\n  3. Vital Records:\n    Birth registration\n    Death registration"
        title: "9 مصادر للداتا"
        text: |
          - **Census** و**Population estimates**: بيدّوك الـ ==denominator==، لتخطيط الخدمات وحساب الـ rates.
          - **Vital records**: تسجيل المواليد والوفيات.
          - **Notification of infectious diseases**: بتوري الـ fluctuation في حدوث الأمراض المعدية.
          - **Disease registers**: لأمراض ليها أهمية public health: **National cancer registry in Egypt**، tuberculosis (TB)، hepatitis.
          - **Hospital records**: inpatient وoutpatient.
          - **Special subgroups records** (مدارس، مصانع، جيش...).
          - **Morbidity surveys**.
          - ==Record linkage==: ربط سجلات نفس الشخص من مصادر مختلفة.
      - kind: explain
        page: 17
        quote: "4.Notification of infectious\ndiseases\nFluctuation of occurrence\nPlanning and evaluation"
        title: "4. Notification of infectious diseases"
        text: |
          الأمراض المُعدية الـ notifiable بتتبلّغ أول بأول، وده بيدّيك حاجتين:

          - ==fluctuation of occurrence==: تشوف المرض بيعلى ويوطى إمتى (موسم، outbreak).
          - **planning and evaluation**: تعرف تجهّز وتقيّم الخدمة.

          ليه الإبلاغ بالذات مفيد للتذبذب؟ لأنه مستمر وسريع، فبيلقط الزيادة وهي لسه بتبدأ. التفسير المقبول (مش في الكتاب).
      - kind: match
        page: 18
        quote: "5. Disease registers: Diseases of public health importance\nExamples:\n  National cancer registry in EGYPT\n  Tuberculosis\n  Hepatitis"
        prompt: "وصّل المثال بمصدر الداتا:"
        pairs:
          - ["National cancer registry in Egypt", "Disease register"]
          - ["Birth and death certificates", "Vital records"]
          - ["Linking one person's clinic and lab files", "Record linkage"]
          - ["Weekly reports of measles cases", "Notification"]
          - ["Counting the whole population every 10 years", "Census"]
        why: "الـ registers للأمراض المهمة، الـ vital records للمواليد والوفيات، الـ notification للأمراض المعدية، والـ census بيعدّ الكل."
      - kind: explain
        page: 21
        quote: "Measures of Disease Frequency:\n  1. Counting cases (raw numbers). Example: A health planner may want to know the number of cases of malaria seen in the last year, so that they can estimate how many chloroquine tablets to order for the next year.\n  2. Proportions (%). Example: Of the 120 cases of malaria admitted to hospital X last year, 80 were children. The proportion (percentage) of children among cases is (80/120) x 100 or 66.7%."
        title: "1. Count و 2. Proportion"
        text: |
          - **Counting cases (raw numbers)**: مفيد للتخطيط المباشر: عدد حالات الـ malaria السنة اللي فاتت علشان تعرف تطلب كام علبة **chloroquine**.
          - **Proportion (%)**: جزء من كل. من 120 حالة malaria في المستشفى، 80 أطفال:
          - **Children among cases = 80/120 × 100 = 66.7%**

          في الـ proportion الـ numerator ==جزء من== الـ denominator.
      - kind: check
        page: 22
        quote: "3. Rates: the relative frequency of cases in a population during a specified period of time. e.g., Morbidity-Rates, Mortality-Rates"
        question: "A rate is the relative frequency of cases in a population during a ______."
        options:
          - "specified period of time"
          - "single point in time, with no time dimension"
          - "hospital ward"
          - "group of cases only, without the population"
        answer: 0
        why:
          - "صح: slide 22، rate = cases ÷ population ==during a specified period== (عادة سنة)، زي morbidity وmortality rates."
          - "ده الفرق بالظبط: الـ proportion ملوش time dimension، الـ rate ليه."
          - "المقام population، مش عنبر."
          - "من غير population في المقام يبقى count، مش rate."
      - kind: explain
        page: 23
        quote: "Rate:\n  Measures the occurrence of an event or disease in a given population during a given period (one Year). (Birth rate, growth rate, accident rate)\n  Usually expressed per 100 or per 1000 population.\n  It has a time dimension, whereas a PROPORTION does not."
        title: "3. Rate: فيه زمن"
        text: |
          الـ **rate** = الـ relative frequency للحالات في population ==خلال فترة زمنية محددة== (غالبًا سنة).

          - بيتكتب غالبًا **per 100 أو per 1000** population.
          - أمثلة: birth rate، growth rate، accident rate، morbidity وmortality rates.
          - الفرق الجوهري: الـ rate ليه **time dimension**، والـ **proportion** لأ.
      - kind: figure
        page: 23
        quote: "It has a time dimension, whereas a PROPORTION does not."
        title: "عدد، نسبة، معدل: الفرق في صورة واحدة"
        alt: "Three rows. Count: 120 malaria cases, a raw number. Proportion: a bar of 120 with 80 children shaded, 80 over 120 equals 66.7 percent, part of the whole with no time. Rate: cases over population at risk, with a time arrow from 1 January to 31 December labelled during one year."
        caption: |
          اقرأها من فوق لتحت، وكل سطر بيزوّد حاجة على اللي قبله:

          - **Count**: رقم لوحده، 120 حالة malaria. ينفع للتخطيط بس مايقارنش.
          - **Proportion**: الشريط كله 120، والجزء الملوّن 80 طفل منهم. الـ numerator ==جوه== الـ denominator، ومفيش زمن.
          - **Rate**: نفس القسمة بس على الـ population اللي ممكن تتعب، و==خلال فترة== (السهم من يناير لديسمبر). الزمن هو اللي بيخليها rate.

          يعني لو شفت رقم من غير «خلال سنة» أو «per 1000 per year» يبقى غالبًا proportion مش rate.
