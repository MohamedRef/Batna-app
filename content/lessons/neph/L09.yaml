lecture: neph.L09
lessons:
  - id: neph.L09.lesson1
    title: "اختيار الـ RRT وماكينة الغسيل من جوّه"
    hook: "قبل ما تختار غسيل ولا زراعة، لازم تعرف الماكينة بتعمل إيه في الـ 4 ساعات دول، وليه 120 لتر مية لازم تبقى أنضف من مية الشرب."
    minutes: 10
    pages: [292, 295]
    topics: [modalities, hd-machine]
    goals:
      - "تعرف الـ RRT المثالي لازم يحقق إيه، وإزاي تختار بين HD و PD والزراعة"
      - "تفرّق CRRT و SLED/PIRRT و HD العادي بالوقت والماكينة"
      - "تفهم الـ dialyser والـ dialysate والمية والإنذارات، وجرعة الغسيل"
    status: unverified
    steps:
      - kind: explain
        page: 292
        title: "المحاضرة دي عن إيه؟"
        quote: "Optimal RRT should fulfill the followings:"
        text: |
          المحاضرة بتغطي كل طرق الـ **renal replacement therapy (RRT)**:
          - الـ **haemodialysis** وأنواعه: الـ conventional، والـ CRRT (CKRT)، والـ SLED.
          - الـ **plasmapheresis** كإجراء قريب من الغسيل.
          - الـ **peritoneal dialysis**.
          - الـ **transplantation**: مين يزرع، مين يتبرع، الـ HLA، الـ rejection، والـ immunosuppression.

          والـ learning objectives بتطلب منك حاجة مهمة: ==تقارن== وتختار الأنسب لكل عيان، في الـ AKI مقابل الـ ESRD.

          ليه نبدأ بـ «optimal RRT»؟ التفسير المقبول (مش في الكتاب): لأن مفيش طريقة واحدة بتحقق كل الشروط. فالشروط دي هي «المسطرة» اللي هتقيس بيها كل modality في المحاضرة:
          - الـ HD بيشيل الـ toxins بسرعة، بس بيهز الضغط.
          - الـ CKRT هادي على الضغط، بس محتاج ICU وتكلفته عالية.
          - الـ PD بيحافظ على الـ residual function، بس بيمص سكر.
          يعني كل ما تقرا عن طريقة، اسأل: كسبت أنهي شرط وخسرت أنهي شرط؟

          وليه الـ objectives بتفرّق الـ AKI عن الـ ESRD؟ التفسير المقبول (مش في الكتاب): عيان الـ AKI غالبًا في الـ ICU، ضغطه مش ثابت، والكلية ممكن ترجع، فعايز طريقة هادية بتحمي الكلية (CKRT أو SLED أو acute PD). عيان الـ ESRD مستقر نسبيًا وهيعيش سنين، فعايز طريقة يعيش بيها حياته (HD 3 مرات، PD في البيت، أو زراعة). نفس الماكينة، بس هدف مختلف.

          وإزاي تذاكرها؟ التفسير المقبول (مش في الكتاب): المحاضرة فيها أرقام كتير (ساعات، flows، أحجام، percentages). ما تحفظهاش لوحدها: اربط كل رقم بالسبب. الـ 120 لتر بتشرح ليه المية لازم تبقى نضيفة، والـ 15,000 D بتشرح الفرق بين الغسيل والـ plasma exchange، والـ 10 mL/kg/h بتشرح ليه الضغط بيقع. الرقم اللي ليه سبب ما بيتنسيش.
      - kind: explain
        page: 293
        title: "الـ RRT المثالي"
        quote: "Prevent further deterioration of renal function. Preserve residual renal function."
        text: |
          الـ renal replacement therapy (RRT) المثالي بيعمل 6 حاجات:
          - ينضّف الـ **uraemic toxins**.
          - يظبط الـ **electrolytes** والـ **acid–base**.
          - يحافظ على الـ ==residual renal function== وما يبوّظش الكلية أكتر.
          - يسرّع رجوع الكلية في الـ **acute kidney injury (AKI)**.
          - مريح ومرن (tolerance, flexibility).
          - ما يضيّعش nutrients.

          ليه الـ residual renal function في القايمة؟ التفسير المقبول (مش في الكتاب): الكلية الباقية، حتى لو بتعمل 5% بس، شغالة 24 ساعة: بتطلّع مية و middle molecules و phosphate بشكل مستمر، وبتسهّل الـ fluid restriction. فأي طريقة بتوقع الضغط وتخلّص على الباقي (زي UF عنيف في الـ HD) بتخسّر العيان حاجة ما بترجعش. وليه «no nutrient loss»؟ لأن الغشا اللي بيشيل toxins ممكن يشيل amino acids وفيتامينات و albumin كمان، وعيان الـ ESRD أصلًا معرض للـ malnutrition.
      - kind: explain
        page: 293
        title: "HD ولا PD ولا زراعة؟"
        quote: "Important renal replacement therapies (RRT) for end-stage renal disease (ESRD) patients are hemodialysis (HD), peritoneal dialysis (PD) and renal transplantation (RT). The outcome comparison suggest that RT is a better overall treatment forESRD patients. On the other hand, the studies that compared patient outcome for HD and PD have yielded conflicting results. Neither treatment modality is best suited for all patients. The choice should be discussed and analyzed for each particular patient considering his demographic, comorbidity, availability of suitable living-related or cadaveric donor, economic factors and social circumstances, morbidity and quality of life on RRT. In practice, most patients in the world are treated with hemodialysis (80%). Councelling for RRT should be in stage 4CKD, to allow time for hepatitis B vaccination, and sufficient time for creation and maturation of arteriovenous fistula in case of hemodialysis."
        text: |
          الـ end-stage renal disease (ESRD) ليه 3 حلول: **haemodialysis (HD)**، **peritoneal dialysis (PD)**، و ==renal transplantation==. الزراعة **أحسن في المجمل** (better overall treatment).

          بين HD و PD الدراسات متضاربة؛ مفيش واحد ينفع الكل. الاختيار حسب المريض: السن، الأمراض التانية، فيه متبرع ولا لأ، الفلوس، الظروف الاجتماعية، وجودة الحياة. وفي العالم كله حوالي ==80%== على الـ HD.

          ليه 80% على الـ HD رغم إن الزراعة أحسن؟ التفسير المقبول (مش في الكتاب): الزراعة محتاجة **متبرع**، والمتبرعين قليلين؛ ومحتاجة عيان يستحمل العملية والـ immunosuppression. والـ PD محتاج عيان (أو حد معاه) يقدر يغيّر الأكياس بنظافة في البيت، وبطن ما اتعملش فيها عمليات كتير. أما الـ HD فبيتعمل لأي حد تقريبًا في الوحدة بإيد التمريض. يعني الاختيار مش «الأحسن نظريًا»، ده «الأنسب للعيان ده في ظروفه».
