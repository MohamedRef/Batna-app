    steps:
      - kind: explain
        page: 80
        title: "ليه APS مهم؟"
        quote: "The essential features are arterial or venous thrombosis or recurrent pregnancy loss or placental dysfunction occurring in a subject in whom laboratory tests for antiphospholipid antibody are persistently positive."
        text: |
          ==acquired thrombophilia== منتشرة وليها morbidity و mortality عالية.

          الأساس: **arterial أو venous thrombosis**، أو **recurrent pregnancy loss** أو **placental dysfunction**، في حد الـ **antiphospholipid antibody** عنده **persistently positive**.

          لاحظ إنه **thrombophilia** مش نزيف، مع إنه جاي في محاضرة الـ hemostasis بعد الـ DIC. يعني الـ antibody بيقلب الميزان ناحية التجلّط. والحمل جزء منه عشان المشيمة أوعية صغيرة، وأي جلطات فيها بتجوّع الجنين (التفسير المقبول، مش في الكتاب).
      - kind: figure
        page: 81
        quote: "There must be at least one clinical and at least one laboratory criterion present. The laboratory test must be consistently positive on at least two occasions 12 weeks apart as transient antibodies may occur, for example in infection."
        title: "1 + 1 + 12"
        alt: "Two boxes joined by a plus sign: one clinical criterion (thrombosis or a pregnancy complication) and one laboratory criterion (anticardiolipin, anti-beta2-GPI or lupus anticoagulant). Below, a timeline: first positive test, an arrow of 12 weeks, second positive test, then the diagnosis of APS."
        caption: "==clinical واحد== + **lab واحد**، والـ lab يتعاد positive بعد **12 weeks** عشان نستبعد الـ transient antibodies."
