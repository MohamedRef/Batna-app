        text: |
          الأسباب هنا من الكتاب نفسه:

          - ==Denosumab== (يوقف RANKL): لو الـ zoledronic acid مانفعش، أو الكلية تعبانة، لأنه **not cleared by the kidneys**. وبيتدّي كمان بانتظام لعيانين السرطان عشان يمنع مضاعفات العضم.
          - **Glucocorticoids:** للي عندهم **1,25-dihydroxy vitamin D** عالي (lymphomas، granulomatous diseases)، لأنها بتقلل إنتاج الـ vitamin D وامتصاص الكالسيوم.
          - **Cinacalcet** (calcimimetic): في عيانين الـ **hemodialysis** والـ **parathyroid cancer**.

          وفكّر في الـ zoledronic acid على إنه **الاختيار الأول** للكلية السليمة، لأن الـ nephrotoxicity من أعراضه الجانبية.
