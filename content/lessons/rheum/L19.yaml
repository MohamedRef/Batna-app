  - id: rheum.L19.lesson6
    title: "الشمس والفيروس والدوا: الـ triggers"
    hook: "الجينات جهزت، والشمس أو الدوا أو الفيروس بيدوسوا على الزناد."
    minutes: 8
    pages: [311, 312]
    topics: [environment]
    goals:
      - "تفهم إزاي الـ UV بيزوّد الـ autoantibodies"
      - "تحفظ أدوية الـ drug-induced lupus بالمجموعات"
      - "تعرف دور الأكل والسجاير والـ estrogen"
    status: unverified
    steps:
      - kind: figure
        page: 311
        quote: "Ultraviolet light stimulates keratinocytes, which leads to the secretion of cytokines that simulate increased autoantibody production."
        title: "إزاي الشمس بتولّع الـ lupus"
        alt: "Three boxes joined by arrows: ultraviolet light hits skin keratinocytes; keratinocytes secrete cytokines; cytokines increase autoantibody production. A side note says about two-thirds of lupus patients are UV sensitive."
        caption: "الـ UV مش بيأذي الجلد بس: بيخلّي الـ ==keratinocytes== تطلّع cytokines، والـ cytokines تزوّد الـ **autoantibodies**. علشان كده تلتين العيانين **UV sensitive**."
        svg: |
          <svg viewBox="0 0 330 290" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L19u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="45" y="10" width="240" height="50" rx="10" class="fg-acc"/>
            <text x="165" y="41" text-anchor="middle" class="t-b">Ultraviolet light</text>
            <path d="M165 60 V84" class="fg-arrow" marker-end="url(#L19u)"/>
            <rect x="45" y="86" width="240" height="50" rx="10" class="fg-box"/>
            <text x="165" y="108" text-anchor="middle" class="t-sm t-b">Keratinocytes stimulated</text>
            <text x="165" y="126" text-anchor="middle" class="t-sm">secrete cytokines</text>
            <path d="M165 136 V160" class="fg-arrow" marker-end="url(#L19u)"/>
            <rect x="45" y="162" width="240" height="50" rx="10" class="fg-bad"/>
            <text x="165" y="193" text-anchor="middle" class="t-sm t-b t-bad">More autoantibodies</text>
            <rect x="45" y="226" width="240" height="50" rx="10" class="fg-thin"/>
            <text x="165" y="257" text-anchor="middle" class="t-sm">2/3 of patients are UV sensitive</text>
          </svg>
      - kind: explain
        remind: [rheum.L19.019, rheum.L19.017]
        page: 311
        title: "الـ triggers من بره"
        quote: "Ultraviolet light stimulates keratinocytes, which leads to the secretion of cytokines that simulate increased autoantibody production."
        text: |
          - ==Ultraviolet light==: بيحفّز الـ **keratinocytes** يطلّعوا cytokines تزوّد الـ autoantibodies. **تلتين** العيانين ultraviolet (UV) sensitive.
          - **Viruses:** Epstein–Barr virus (EBV)، cytomegalovirus (CMV)، **parvovirus B19**، **Hepatitis B virus (HBV)**، human endogenous retroviruses.
          - **Silica dust**، **stress**، **smoking**.
          - **Diet:** high caloric؛ الستات بـ **body mass index (BMI) > 21** risk أعلى.
          - **Hormones:** بيزيد في الـ reproductive years، ويتعب مع الحمل والدورة ← **estrogen**.

          الكتاب نفسه بيقول إن الـ triggers دي «not fully known»، يعني دي عوامل بتزوّد الـ risk أو بتعمل flare، مش أسباب أكيدة. علشان كده النصيحة العملية: sunscreen، بطّل سجاير، وراجع الأدوية.
      - kind: reveal
        page: 311
        quote: "Viral infection\n  EBV.\n  Cytomegalovirus.\n  Parvovirus B19.\n  Hepatitis B virus.\n  Human endogenous retroviruses."
        prompt: "الكتاب بيعدّ خمس فيروسات (EBV، CMV، parvovirus B19، HBV، endogenous retroviruses). إزاي فيروس يعمل مرض autoimmune؟"
        answer: |
          الكتاب بيقول بس إن الـ triggers دي ممكن **تبدأ المرض أو تعمل flare**، ومش بيشرح الآلية.

          التفسير المقبول (مش في الكتاب): العدوى بتنشّط المناعة جامد وبتموّت خلايا كتير، فالـ **apoptotic debris** والـ nuclear antigens تزيد في وقت المناعة فيه صاحية. وده نفس الخيط اللي هتشوفه في الـ pathogenesis: ==apoptosis زيادة + clearance ضعيف==. وبعض الفيروسات (زي الـ EBV) بتعيش جوه الـ **B cells** نفسها، فبتلعب في الخلية اللي بتعمل الـ antibodies.
      - kind: mnemonic
        page: 312
        quote: "Drugs\n  Anti hypertension - Hydralazine, methyldopa, and captopril.\n  Anti arrhythmics - Procainamide and quinidine.\n  Anti-inflammatories - Penicilamine and sulfasalazine."
        word: "HMC PQ PS"
        parts:
          - { key: "H", text: "Hydralazine (antihypertensive)" }
          - { key: "M", text: "Methyldopa (antihypertensive)" }
          - { key: "C", text: "Captopril (antihypertensive)" }
          - { key: "P", text: "Procainamide (antiarrhythmic)" }
          - { key: "Q", text: "Quinidine (antiarrhythmic)" }
          - { key: "P", text: "Penicillamine (anti-inflammatory)" }
          - { key: "S", text: "Sulfasalazine (anti-inflammatory)" }
        hook: "تلات مجموعات: **ضغط** (HMC)، **قلب** (PQ)، **التهاب** (PS). وفي قايمة الـ triggers كمان **chlorpromazine** و **isoniazid**."
      - kind: check
        page: 312
        quote: "Drugs\n  Anti hypertension - Hydralazine, methyldopa, and captopril.\n  Anti arrhythmics - Procainamide and quinidine.\n  Anti-inflammatories - Penicilamine and sulfasalazine."
        question: "Which of the following is NOT related to drug-induced lupus?"
        options: ["Methyl folate", "Methyldopa", "Hydralazine", "Procainamide"]
        answer: 0
        why:
          - "صح: الـ methyl folate فيتامين، مش في قايمة الكتاب. الفخ إن اسمه شبه methyldopa."
          - "الـ methyldopa من الـ antihypertensives في القايمة (H M C)."
          - "الـ hydralazine أول دوا في الـ antihypertensives."
          - "الـ procainamide من الـ antiarrhythmics (P Q)."
      - kind: reveal
        page: 312
        quote: "Women experience worsening of symptoms during pregnancy and with their menstrual periods."
        prompt: "إيه الملاحظتين اللي خلّوا الدكاترة يشكّوا في الـ estrogen؟"
        answer: |
          1. الـ SLE أكتر في الستات في الـ ==reproductive years==.
          2. الأعراض بتتعب **during pregnancy** (مع الحمل) و**with menstrual periods** (مع الدورة)، يعني لما الـ estrogen يعلى.

          بس خلي بالك: الكتاب بيقول «may play a role». السبب إن بيانات الـ X chromosome (الدرس اللي فات) بتقول إن الـ **X copy number** أهم من الهرمونات. الاتنين مع بعض: الـ X بيحدد مين معرّض، والـ estrogen بيزوّد النشاط. وده كمان سبب إن حبوب الـ **estrogen** بتتحسب بحذر في الـ APS (هتشوفها بعدين).
      - kind: aside
        tone: joke
        page: 311
        quote: "Ultraviolet light\n  Ultraviolet light stimulates keratinocytes, which leads to the secretion of cytokines that simulate increased autoantibody production.\n  About two-thirds of the people with lupus are UV light sensitive."
        text: "عيانة الـ lupus في مصر في أغسطس: «الشمس مش بتحبني يا دكتور». معاها حق: **تلتين** العيانين UV sensitive. الـ sunscreen هنا مش رفاهية. ☀️🧴"
      - kind: explain
        page: 312
        title: "الأكل والسجاير والضغط النفسي"
        quote: "Women with a body mass index (BMI) greater than 21 kg/m2 tended to have a greater risk of SLE compared with women with lower BMI."
        text: |
          - **Diet:** الـ ==high caloric diet==، والستات اللي الـ BMI بتاعهم **فوق 21 kg/m²** عندهم risk أعلى من اللي أقل.
          - **Smoking:** المدخنين risk أعلى من غير المدخنين.
          - **Stress:** الستات أكتر تأثرًا بيه.

          ليه ده مهم في الامتحان؟ لأن سؤال الكتاب «All are risk factors except» بيحط **obesity** كـ risk factor صح، وبيحط حاجة غريبة (زي **HCV**) هي اللي مش في القايمة. الفيروسات اللي في الكتاب هي EBV، CMV، parvovirus B19، **HBV**، والـ retroviruses بس.
      - kind: try
        items: [rheum.L19.017, rheum.L19.018, rheum.L19.021, rheum.L19.025, rheum.L19.026]
    recap:
      - "UV ← keratinocytes ← cytokines ← autoantibodies؛ تلتين العيانين UV sensitive."
      - "Viruses: EBV، CMV، parvovirus B19، HBV، endogenous retroviruses. و silica."
      - "أدوية: HMC (ضغط) PQ (قلب) PS (التهاب)، و chlorpromazine و isoniazid."
      - "BMI > 21، high caloric، smoking، stress؛ estrogen: reproductive years، الحمل والدورة."
    practice: [rheum.L19.017, rheum.L19.018, rheum.L19.019, rheum.L19.020, rheum.L19.021, rheum.L19.022, rheum.L19.023, rheum.L19.024, rheum.L19.025, rheum.L19.026, rheum.L19.027]
  # ------------------------------------------------------------------
  - id: rheum.L19.lesson2
    title: "الحطام النووي والأجسام المضادة"
    hook: "الخلايا بتموت كتير والزبالة مش بتتشال، فالجسم يعمل antibodies ضد الـ DNA بتاعه."
    minutes: 9
    pages: [312, 315]
    topics: [immunology, antibodies]
    goals:
      - "تفهم دور الـ B cells والـ T cells والـ apoptosis"
      - "توصّل كل antibody بمرضه ونسبته"
      - "تعرف ليه الـ anti-Ro خطر على قلب الجنين"
    status: unverified
    steps:
      - kind: explain
        page: 312
        title: "الـ B cells"
        quote: "Systemic lupus erythematosus (SLE) is associated with the loss of B-cell tolerance, B-cell dysregulation and autoantibody production."
        text: |
          الـ systemic lupus erythematosus (SLE) فيه ==loss of B-cell tolerance== و B-cell dysregulation.

          الـ immune stimulation + impaired regulation ← **polyclonal activation** للـ B cells ← autoantibodies كتير ضد **nuclear self antigens**.

          الـ antibodies دي بتعمل **immune complexes** مع الـ nuclear antigens، تترسب في الأنسجة، وتعمل **inflammation**.

          يعني الـ antibody لوحده مش هو الضرر؛ الضرر بييجي لما يمسك الـ antigen ويترسب.
      - kind: explain
        page: 313
        title: "والـ T cells كمان"
        quote: "Regulatory T cells have been shown to be low in SLE and their suppressive function impaired."
        text: |
          - **Abnormal signaling** وبيطلّعوا cytokines تزوّد الالتهاب.
          - ==Regulatory T cells== قليلة ووظيفتها ضعيفة.
          - الـ **cytotoxic** والـ **suppressor T cells** (اللي المفروض تهدّي المناعة) قليلة.

          يعني الفرامل بايظة والبنزين زيادة.

          علشان كده الكتاب بيقول إن الـ T-cell dysregulation «critical aspect» زي الـ B cells: الـ T cells هي اللي بتساعد الـ B cells تعمل الـ autoantibodies (الـ figure الجاية).
      - kind: figure
        page: 313
        title: "تلات أشكال للـ SLE"
        image: { file: rheum/L19-three-forms.webp, book: true }
        alt: "Diagram titled Three potential forms of SLE in three columns. Left, T cell dominant: a T cell with effector function. Middle, T and B cell cooperation: T cells help B cells, and B cells present antigen back to T cells. Right, B cell dominant: B cells producing proinflammatory autoantibodies and innate activation."
        caption: |
          - **الشمال (T cell dominant)**: الـ T cells لوحدها بتعمل الأذى (**effector function**).
          - **النص (T and B cell cooperation)**: الـ T cell بتدّي **help** للـ B cell، والـ B cell بترجّع **antigen-presentation** للـ T cell: دايرة بتغذّي نفسها.
          - **اليمين (B cell dominant)**: الـ B cells بتعمل ==autoantibodies== وبتنشّط الـ **innate** immunity.

          يعني الـ SLE مش مرض B cells بس: الـ T cells ممكن تبقى هي الأساس، أو الـ B cells، أو الاتنين ==مع بعض==.
