      - kind: explain
        page: 135
        title: "الـ major criteria: ليه الـ subclavian بالذات؟"
        quote: "Three major criteria"
        text: |
          الكتاب بيحط **three major criteria** للـ Takayasu arteritis (TAK):
          1. **Left mid subclavian artery lesion** بالـ angiography.
          2. **Right mid subclavian artery lesion** بالـ angiography.
          3. **Characteristic signs and symptoms لمدة شهر على الأقل**: limb claudication، pulselessness أو فرق نبض، فرق ضغط **>10 mmHg** systolic، سخونية، neck pain، transient amaurosis، blurred vision، syncope، dyspnea أو palpitations.

          التفسير المقبول (مش في الكتاب): الـ subclavian هو ==أكتر شريان بيتصاب== في الـ TAK، عشان كده اتنين من التلاتة major عليه. والكتاب بيحدد **مكان بالسنتيمتر** حوالين فتحة الـ vertebral artery، عشان الـ angiography تقيس نفس الحتة عند كل العيانين وما تتلخبطش مع atherosclerosis اللي بتمسك الأصل.

          وشرط **شهر على الأقل** للأعراض؟ لأن المرض **مزمن**، والأعراض اللي بتيجي يومين وتروح غالبًا حاجة تانية.
      - kind: explain
        page: 135
        title: "الـ minor criteria: كل واحد بيدلّ على إيه"
        quote: "Neck muscle tenderness is unacceptable."
        text: |
          الـ minor criteria في الكتاب: **ESR >20 mm/h** غير مفسّر، **carotid artery tenderness**، **hypertension** (>140/90 في الدراع أو >160/90 في الـ popliteal)، **aortic regurgitation أو annuloaortic ectasia**، **pulmonary artery lesion**، وبعدهم lesions في الـ left common carotid، الـ brachiocephalic trunk، الـ descending thoracic aorta، الـ abdominal aorta، والـ coronary.

          التفسير المقبول (مش في الكتاب) لكل واحد:
          - **ESR**: الالتهاب لسه **active**.
          - **Carotid tenderness**: الشريان نفسه ملتهب، عشان كده الكتاب بيقول neck muscle tenderness ==unacceptable==: وجع العضلة مش وجع الشريان.
          - **Hypertension**: غالبًا من تضييق الـ **renal artery** أو الـ aorta. وليه بيقيسوه في الـ **popliteal**؟ لأن الدراعين ممكن **مافيهمش نبض**، فقياسهم يضحك عليك.
          - **AR و ectasia**: الـ aortic root بيتوسّع من التهاب الجدار، فالـ valve ما تقفلش.

          يعني كل criterion هو **عضو تاني على نفس الطريق**: الـ aorta وفروعها.
