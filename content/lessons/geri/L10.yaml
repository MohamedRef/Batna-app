        text: |
          كل سؤال في الـ history بيدوّر على حاجة محددة:

          - **Drugs، exposure، collagen-vascular**: لو أي واحدة إيجابية، ده بقى ==ILD of known cause==، مش IPF. والعلاج يبدأ بإنك توقف الدوا أو تبعد عن التعرض أو تعالج الروماتيزم.
          - **Obstructive sleep apnoea (OSA)**: الكتاب بيقول إن الـ prevalence بتاعتها **عالية في الـ IPF**، فدوّر عليها حتى لو هو مش جاي يشتكي منها.

