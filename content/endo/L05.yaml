    topic: carcinoid
    front: Why are carcinoids called "carcinoid", and what does "enterochromaffin" mean?
    back: They looked different from, and less aggressive than, intestinal adenocarcinoma. They arise from enterochromaffin cells, which stain with potassium chromate (chromaffin), a feature of serotonin-containing cells.
    src: { page: 94, quote: "Carcinoids arise from enterochromaffin cells of the gastrointestinal tract. The term enterochromaffin refers to the ability to stain with potassium chromate\n  (chromaffin) , a feature of cells that contain serotonin." }
