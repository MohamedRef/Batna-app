  - id: res.L08.043
    kind: mcq
    topic: designs
    stem: >-
      Hospital officials believe chemical waste from a factory causes acute lymphocytic leukaemia (ALL) in children aged 5-12.
      In a study to test this, who most likely forms the control group?
    options:
      - Children exposed to the waste who do not have ALL
      - Children not exposed to the waste who do not have ALL
      - Children from the hospital's outpatient clinic who do not have ALL
      - Children not exposed to the waste who have ALL
      - Children who had ALL but were cured
    answer: 2
    why:
      - Controls must be chosen without regard to exposure; picking only exposed children fixes the answer.
      - Choosing only unexposed children also builds the exposure into the selection.
      - A rare disease suggests a case-control study, and controls are children without ALL from the same source, with exposure unknown at selection.
      - These children have the disease, so they are cases.
      - Cured children had ALL, so they are cases too.
    src: { page: 47, quote: "which of the following subjects are most likely to comprise the control group" }
    status: unverified
  - id: res.L08.044
