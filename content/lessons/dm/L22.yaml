      - kind: explain
        page: 272
        title: "إزاي السكر بيوصل للـ endothelium؟"
        quote: "Cardiovascular Risk in Diabetes\n  Diabetes Mellitus → Hyperglycemia, Excess Free Fatty Acids, Insulin Resistance\n  → Oxidative Stress, Protein Kinase C Activation, Receptor for Advanced Glycation End Product (RAGE) Activation\n  → Endothelium\n    ↓ Nitric Oxide, ↑ Endothelin-1, ↑ Angiotensin II → Vasoconstriction: Hypertension, Vascular Smooth Muscle Cell Growth\n    ↓ Nitric Oxide, ↑ Activation of NF-κB, ↑ Angiotensin II, ↑ Activation of Activator Protein-1 → Inflammation: Release of Chemokines, Release of Cytokines, Expression of Cellular Adhesion Molecules\n    ↓ Nitric Oxide, ↑ Tissue Factor, ↑ Plasminogen Activator Inhibitor-1, ↓ Prostacyclin → Thrombosis: Hypercoagulation, Platelet Activation, Decreased Fibrinolysis\n  → Atherogenesis"
        text: |
          الرسمة بتقول **إيه**: 3 مداخل (**hyperglycemia**، **excess free fatty acids**، **insulin resistance**) بيشغّلوا **oxidative stress** و **protein kinase C activation** و **RAGE activation**. التفسير المقبول (مش في الكتاب) بيقول **إزاي**:
          - **Hyperglycemia**: السكر بيلزق في البروتينات ويعمل **advanced glycation end products**؛ لما تمسك في الـ ==RAGE== على الخلية، تولّع oxidative stress والتهاب.
          - **Free fatty acids** و **insulin resistance**: بيشغّلوا الـ **PKC** جوّه الخلية، وده بيقلل تصنيع الـ NO ويزوّد الـ endothelin-1.
          - والـ oxidative stress نفسه بيكسّر الـ **nitric oxide (NO)** أول ما يتعمل.

          عشان كده ==↓ NO== مكتوب في رأس الـ 3 أذرع: الـ NO عادة بيوسّع، وبيهدّي الالتهاب، وبيمنع الصفايح. لما يقل، التلاتة يفلتوا مع بعض.
      - kind: check
        page: 272
        quote: "Cardiovascular Risk in Diabetes\n  Diabetes Mellitus → Hyperglycemia, Excess Free Fatty Acids, Insulin Resistance\n  → Oxidative Stress, Protein Kinase C Activation, Receptor for Advanced Glycation End Product (RAGE) Activation\n  → Endothelium\n    ↓ Nitric Oxide, ↑ Endothelin-1, ↑ Angiotensin II → Vasoconstriction: Hypertension, Vascular Smooth Muscle Cell Growth\n    ↓ Nitric Oxide, ↑ Activation of NF-κB, ↑ Angiotensin II, ↑ Activation of Activator Protein-1 → Inflammation: Release of Chemokines, Release of Cytokines, Expression of Cellular Adhesion Molecules\n    ↓ Nitric Oxide, ↑ Tissue Factor, ↑ Plasminogen Activator Inhibitor-1, ↓ Prostacyclin → Thrombosis: Hypercoagulation, Platelet Activation, Decreased Fibrinolysis\n  → Atherogenesis"
        question: "In diabetes, which change pushes towards thrombosis?"
        options:
          - "Increased PAI-1"
          - "Increased prostacyclin"
          - "Increased nitric oxide"
          - "Decreased tissue factor"
        answer: 0
        why:
          - "صح: الـ PAI-1 بيقفل الـ fibrinolysis، ومعاه tissue factor (TF) عالي و prostacyclin واطي."
          - "الـ prostacyclin بيقل في السكر."
          - "الـ NO بيقل في التلات أذرع."
          - "الـ TF بيزيد مش بيقل."
      - kind: explain
        page: 272
        title: "الـ 3 أذرع، وكل دراع بيعمل إيه"
        quote: "Cardiovascular Risk in Diabetes\n  Diabetes Mellitus → Hyperglycemia, Excess Free Fatty Acids, Insulin Resistance\n  → Oxidative Stress, Protein Kinase C Activation, Receptor for Advanced Glycation End Product (RAGE) Activation\n  → Endothelium\n    ↓ Nitric Oxide, ↑ Endothelin-1, ↑ Angiotensin II → Vasoconstriction: Hypertension, Vascular Smooth Muscle Cell Growth\n    ↓ Nitric Oxide, ↑ Activation of NF-κB, ↑ Angiotensin II, ↑ Activation of Activator Protein-1 → Inflammation: Release of Chemokines, Release of Cytokines, Expression of Cellular Adhesion Molecules\n    ↓ Nitric Oxide, ↑ Tissue Factor, ↑ Plasminogen Activator Inhibitor-1, ↓ Prostacyclin → Thrombosis: Hypercoagulation, Platelet Activation, Decreased Fibrinolysis\n  → Atherogenesis"
        text: |
          - ==Vasoconstriction==: ↓ NO، ↑ **endothelin-1**، ↑ **angiotensin II** ← **hypertension** ونمو الـ vascular smooth muscle cells.
          - **Inflammation**: ↑ **NF-κB** و ↑ **activator protein-1** ← chemokines و cytokines و **cellular adhesion molecules**.
          - **Thrombosis**: ↑ **tissue factor**، ↑ **plasminogen activator inhibitor-1 (PAI-1)**، ↓ **prostacyclin** ← hypercoagulation، platelet activation، و **decreased fibrinolysis**.

          ليه الـ PAI-1 خطير بالذات؟ اسمه بيقول: بيقفل الـ plasminogen activator، يعني الجسم مش بيعرف يدوّب الجلطة الصغيرة فتكبر (التفسير المقبول، مش في الكتاب). والـ 3 أذرع نهايتهم واحدة: **atherogenesis**. وده بيشرح ليه السكري بيجيله MI أكتر حتى لو الـ LDL مش عالي جدًا.
      - kind: match
        page: 272
        quote: "Cardiovascular Risk in Diabetes\n  Diabetes Mellitus → Hyperglycemia, Excess Free Fatty Acids, Insulin Resistance\n  → Oxidative Stress, Protein Kinase C Activation, Receptor for Advanced Glycation End Product (RAGE) Activation\n  → Endothelium\n    ↓ Nitric Oxide, ↑ Endothelin-1, ↑ Angiotensin II → Vasoconstriction: Hypertension, Vascular Smooth Muscle Cell Growth\n    ↓ Nitric Oxide, ↑ Activation of NF-κB, ↑ Angiotensin II, ↑ Activation of Activator Protein-1 → Inflammation: Release of Chemokines, Release of Cytokines, Expression of Cellular Adhesion Molecules\n    ↓ Nitric Oxide, ↑ Tissue Factor, ↑ Plasminogen Activator Inhibitor-1, ↓ Prostacyclin → Thrombosis: Hypercoagulation, Platelet Activation, Decreased Fibrinolysis\n  → Atherogenesis"
        prompt: "وصّل كل تغيير بنتيجته في رسمة الكتاب:"
        pairs:
          - ["↑ Endothelin-1", "Vasoconstriction"]
          - ["↑ NF-κB", "Inflammation"]
          - ["↑ PAI-1", "Decreased fibrinolysis"]
          - ["Hyperglycemia", "RAGE activation"]
        why: "الـ endothelin-1 مضيّق؛ الـ NF-κB مفتاح الالتهاب؛ الـ PAI-1 بيقفل تدويب الجلطة؛ والسكر العالي بيعمل glycation products بتمسك في الـ RAGE."
      - kind: reveal
        page: 271
        quote: "Lab Investigations :\n  1. FBG: 112 mg/dl, PPBG: 163 mg/dl, HbA1C: 6.9%.\n  2. Lipid panel: TC: 209 mg/dl, LDL-C: 128 mg/dl, HDL-C: 35 mg/dl, TG: 230 mg/dl.\n  3. Serum Creatinine: 0.9 mg/dl [eGFR: 88]- UACR: 16 mg/g."
        prompt: "الـ stress ECG والـ echo طبيعيين، والـ HbA1c 6.9%. يبقى العيان ده مش محتاج statin؟"
        answer: "لأ. الـ ECG الطبيعي بيقول إن مفيش **ischaemia دلوقتي**، مش إن الشريان سليم. الرسمة بتقول إن السكر شغّال على الـ endothelium من سنين، وعنده كمان تدخين وضغط و HDL 35 و TG 230. ولما نحسب خطره في درس الـ ESC هيطلع **27.6%** في 10 سنين، يعني very high."
      - kind: aside
        tone: exam
        page: 271
        quote: "Lab Investigations :\n  1. FBG: 112 mg/dl, PPBG: 163 mg/dl, HbA1C: 6.9%.\n  2. Lipid panel: TC: 209 mg/dl, LDL-C: 128 mg/dl, HDL-C: 35 mg/dl, TG: 230 mg/dl.\n  3. Serum Creatinine: 0.9 mg/dl [eGFR: 88]- UACR: 16 mg/g."
        text: "شكل الـ **diabetic dyslipidemia** في عيان الكتاب: **TG عالي** (230)، **HDL واطي** (35)، و **LDL مش بعيد عن الطبيعي** (128). التفسير المقبول (مش في الكتاب): الـ LDL في السكري بيبقى **صغير وكثيف** (small dense LDL)، فبيدخل الجدار ويتأكسد أسهل، ورقمه بيخدعك. عشان كده ما تستناش الـ LDL يبقى 190 عشان تقلق."
      - kind: try
        items: [dm.L22.001, dm.L22.004, dm.L22.005, dm.L22.006, dm.L22.040]
    recap:
      - "عيان الكتاب: 55 سنة، T2DM، HTN، مدخن، LDL 128، HDL 35، TG 230."
      - "السكر: hyperglycemia و FFA و insulin resistance ← oxidative stress و PKC و RAGE ← ↓NO."
