  # ---------- p462, 465-466: relapse ----------
  - id: neph.L14.083
    kind: cloze
    topic: ln-relapse
    text: "Lupus nephritis flare rates of {{c1::10%-50%}} are reported; a flare predicts {{c2::poor long-term kidney survival}}."
    src: { page: 462, quote: "Figure 8: Prevention and treatment of relapses. 10.2.4.3 Treatment of LN relapse Relapses of LN are common, and LN flare is an important predictor of poor long-term kidney survival. 270-273 LN flare rates of 10%-50% have been reported, and relapses occur over time. 274 Failure to achieve complete remission increases the risk of subsequent relapse, 93. 110, 275 Relapse rates of 39% and 64% were found in patients who achieved complete remission or partial remission, respectively, and time-to-relapse after complete response was 36 months, compared to 18 months after partial response.93 Similarly, an HR of 6.2 for relapse was reported in Chinese patients who did not achieve complete remission after initial therapy. 110 Practice Point 10.2.4.3.1: After a complete or partial remission has been achieved, LN relapse should be treated with the same initial therapy used to achieve the original response, or an alternative recommended first-line therapy." }
    status: unverified
    tags: [numbers]
