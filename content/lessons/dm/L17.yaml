            question: "Give the injection today?"
            options: ["No; correct the calcium first", "Yes; calcium does not matter", "Yes, with a double dose", "No; denosumab is never used after bisphosphonates"]
            answer: 0
            why: "Denosumab should not be given until low calcium is corrected (p227); it can lower calcium itself."
          - reveal: "Calcium normal after vitamin D and calcium. You give it."
            question: "When is the next dose?"
            options: ["In six months", "In one week", "In one year", "In one month"]
