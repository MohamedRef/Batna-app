          - ==Serum HBV DNA==: قد إيه الفيروس شغّال.
          - ==Serum ALT==: المناعة بتضرب في الكبد ولا لأ.
          - ==Severity of liver disease==: الكبد اتأذى قد إيه، يعني fibrosis أو cirrhosis.

          ده نفس منطق المراحل في الدرس اللي فات: فيروس شغّال + خناقة = hepatitis، وده اللي بنعالجه.
