schema: batna.lesson/v1
lecture: res.L11
lessons:
  # ------------------------------------------------------------------
  - id: res.L11.lesson1
    title: "ليه بناخد sample أصلًا؟"
    hook: "عايز تعرف نسبة الأنيميا في ستات مصر الحوامل. هتكشف على كام مليون؟ ولا هتختار صح؟"
    minutes: 9
    pages: [3, 14]
    topics: [population]
    goals:
      - "تعرّف الـ population والـ study unit والـ sample"
      - "تعرف مزايا وعيوب الـ sampling"
      - "ترتّب خطوات الـ sampling process"
    status: unverified
    steps:
      - kind: explain
        page: 3
        quote: "What is the group of people (study population) from which we want to draw a sample?\nHow many people do we need in our sample?\nHow will these people be selected?\nSampling Methods and Sample Size"
        title: "3 أسئلة قبل أي بحث"
        text: |
          أول ما تقرر تعمل بحث، هيقابلك 3 أسئلة:

          - **مين؟** الـ ==study population== اللي هتسحب منها الـ sample.
          - **كام؟** الـ ==sample size==.
          - **إزاي؟** هتختارهم بأنهي طريقة، أي الـ **sampling method**.

          المحاضرة كلها إجابة على السؤالين الأخيرين.
      - kind: explain
        page: 4
        quote: "A population is as a well-defined group of people or objects that share common characteristics\nE.g. All immigrants from Egypt or all patients with left hemiplegia.\nA population in a research study is a group about which some information is sought."
        title: "يعني إيه population؟"
        text: |
          الـ **population** = ==well-defined group== من ناس أو حاجات ==بيشتركوا في صفات==، وهي المجموعة اللي البحث ==عايز يعرف عنها معلومة==.

          أمثلة السلايد: كل المهاجرين من مصر، أو كل العيانين اللي عندهم left hemiplegia.

          ليه «well-defined»؟ لأن لو الحدود مش واضحة مش هتعرف مين جوه ومين بره، ونتيجتك هتتعمم على مين. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 5
        quote: "The study population has to be clearly defined. Apart from persons, a study population may consist of villages, institutions, records, etc.\nEach study population consists of STUDY UNITS. The way we define our study population and our study unit depends on the problem we want to investigate and on the objectives of the study."
        title: "الـ population مش لازم تكون ناس"
        text: |
          ==Population== = مجموعة **well-defined** من ناس أو حاجات بيشتركوا في صفات، وعايزين نعرف عنهم معلومة (مثلًا كل مرضى الـ left hemiplegia).

          الـ study population ممكن تكون **قرى، مؤسسات، أو records**، مش بس أشخاص. وكل population متكونة من ==study units==.

          تحديد الاتنين بيعتمد على **المشكلة** و**الـ objectives** بتوعك.

          الدكتورة فرّقت في الشرح بين الـ **target population** (كل الحوامل في مصر مثلًا) والـ population اللي تقدر فعلًا تسحب منها في مكان الدراسة (الحوامل اللي بيترددوا على مستشفى معيّن). نتيجة مستشفى واحد **مش بتتعمم أوتوماتيك** على كل الحوامل من غير ما تسأل: هل المستشفى ده بيمثّلهم؟
      - kind: table
        page: 6
        quote: "Example of Study Population and Study Units\n| Problem | Study population | Study unit |\n|---|---|---|\n| Malnutrition related to weaning in district X | All children 6-24 months of age in District X | One child between 6-24 months in District X |\n| High dropout rates in primary schools in District Y | All primary schools in District Y | One primary school in District Y |\n| Inappropriate record-keeping for leprosy patients registered in Hospital Z | All records on leprosy patients in hospital Z | One record on a leprosy patient registered in hospital Z |"
        title: "المشكلة بتحدد الـ unit"
        columns: ["Problem", "Study population", "Study unit"]
        rows:
          - ["Weaning malnutrition", "Children 6-24 months in district X", "One child"]
          - ["School dropout", "Primary schools in district Y", "One school"]
          - ["Leprosy record-keeping", "Leprosy records in hospital Z", "One record"]
        hide: [[1, 2], [2, 2]]
      - kind: check
        page: 6
        quote: "Example of Study Population and Study Units\n| Problem | Study population | Study unit |\n|---|---|---|\n| Malnutrition related to weaning in district X | All children 6-24 months of age in District X | One child between 6-24 months in District X |\n| High dropout rates in primary schools in District Y | All primary schools in District Y | One primary school in District Y |\n| Inappropriate record-keeping for leprosy patients registered in Hospital Z | All records on leprosy patients in hospital Z | One record on a leprosy patient registered in hospital Z |"
        question: "Studying high dropout rates in the primary schools of district Y, what is the study unit?"
        options: ["One primary school in district Y", "One pupil who dropped out", "All primary schools in district Y", "District Y"]
        answer: 0
        why:
          - "صح: المشكلة عن معدل الـ dropout في المدارس، فالـ unit هي المدرسة."
          - "التلميذ unit لمشكلة تانية؛ هنا بنقارن مدارس."
          - "دي الـ study population كلها، مش الـ unit."
          - "الـ district هو المكان، مش الوحدة اللي بنقيسها."
      - kind: figure
        page: 11
        quote: "A sample is a small subset of the population that has been chosen to be studied.\nThe sample should represent the population and have sufficient size to be subjected to a fair statistical analysis.\nA representative sample has all the important characteristics of the population from which it is drawn."
        title: "Population ← sampling frame ← sample"
        alt: "Three nested shapes. The large outer one is the population; inside it a dashed box is the sampling frame, the listed part we can select from; inside that a small solid circle is the sample. An arrow labelled generalization runs from the sample back out to the population."
        caption: "الـ sample حتة صغيرة من الـ **sampling frame**، وبنعمم نتيجتها على الـ **population** كلها؛ عشان كده لازم تكون **representative**."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L11a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <ellipse cx="150" cy="105" rx="140" ry="88" class="fg-box"/>
            <text x="150" y="34" text-anchor="middle" class="t-sm t-b">Population</text>
            <rect x="62" y="48" width="176" height="118" rx="10" class="fg-thin"/>
            <text x="150" y="66" text-anchor="middle" class="t-sm t-mut">Sampling frame (the list)</text>
            <circle cx="150" cy="118" r="34" class="fg-acc"/>
            <text x="150" y="115" text-anchor="middle" class="t-sm t-b">Sample</text>
            <text x="150" y="131" text-anchor="middle" class="t-sm">representative</text>
            <path d="M186 118C260 118 300 80 292 40" class="fg-arrow-acc" marker-end="url(#L11a)"/>
            <text x="322" y="30" text-anchor="end" class="t-sm t-acc">generalization</text>
          </svg>
      - kind: explain
        page: 9
        quote: "Advantages:\na smaller number of subjects\nmore time efficient\nless costly\npotentially more accurate (since it is more feasible to maintain control over a smaller number of subjects).\nDisadvantages:\nPotential bias in the selection of subjects, which may decrease the ability to generalize the results beyond the subjects actually studied"
        title: "الـ sample: كسبنا إيه وخسرنا إيه؟"
        text: |
          المثالي إنك تدرس الـ population كلها (عشان الـ **generalization**)، بس غالبًا هي كبيرة أو متفرقة جدًا.

          **المزايا** (Advantages):
          - عدد أقل، وقت أقل، و**less costly**.
          - و**potentially more accurate**: أسهل تتحكم في جودة القياس لـ 300 واحد من 3 مليون.

          **العيب** (Disadvantage):
          - ==Selection bias==: لو اخترت غلط، النتيجة متتعممش على حد غير اللي درستهم.
      - kind: mnemonic
        page: 12
        quote: "3 factors that influence sample representativeness\nSampling procedure\nSample size\nParticipation (response rate)\nWhen might you sample the entire population?\nWhen your population is very small\nWhen you have extensive resources\nWhen you don't expect a very high response"
        word: "SSP"
        parts:
          - { key: "S", text: "Sampling procedure: الطريقة اللي اخترت بيها." }
          - { key: "S", text: "Sample size: العدد كفاية ولا لأ." }
          - { key: "P", text: "Participation (response rate): كام واحد رد فعلًا." }
        hook: "3 حاجات بتحدد الـ representativeness: **إزاي** اخترت، **كام** اخترت، و**مين رد**. وتاخد الـ population كلها لو صغيرة جدًا، أو عندك resources كتير، أو مش متوقع response عالي."
      - kind: aside
        tone: exam
        page: 12
        quote: "3 factors that influence sample representativeness\nSampling procedure\nSample size\nParticipation (response rate)\nWhen might you sample the entire population?\nWhen your population is very small\nWhen you have extensive resources\nWhen you don't expect a very high response"
        text: |
          في المحاضرة اتقال إن **80%** هدف شائع للـ ==response rate==. بس النسبة لوحدها مش ضمان: المهم هل اللي ردّوا **مختلفين** عن اللي مردّوش في حاجة تأثر على النتيجة؟

          وخلّي بالك: **كبر العدد لوحده مش بيصلّح sample متحيّزة**، ولو دعيت الـ population كلها برضه مش كله هيرد.
      - kind: order
        page: 13
        quote: "Process of sampling\nThe sampling process comprises several stages:\nDefining the population of concern\nSpecifying a sampling frame, a set of persons, units or events possible to measure\nSpecifying a sampling method for selecting individuals or events from the frame\nDetermining the sample size\nImplementing the sampling plan\nSampling and data collecting"
        prompt: "رتّب خطوات الـ sampling process"
        steps:
          - "Define the population of concern"
          - "Specify a sampling frame"
          - "Specify a sampling method"
          - "Determine the sample size"
          - "Implement the sampling plan"
          - "Sample and collect the data"
        why: "بتبدأ بـ **مين** (population ثم الـ list بتاعتها)، بعدين **إزاي** (method)، بعدين **كام** (size)، وبعدين تنفّذ وتجمع."
      - kind: explain
        page: 14
        quote: "There are two main categories of sampling, probability and nonprobability."
        title: "نوعين sampling"
        text: |
          فيه ==category==ين أساسيين للـ sampling:

          - ==Probability== sampling
          - ==Non-probability== sampling

          ليه التقسيم ده أول حاجة؟ لأنه بيحدد تقدر تعمّم النتيجة إحصائيًا ولا لأ: في الـ probability كل واحد ليه فرصة معروفة يتختار. التفسير المقبول (مش في الكتاب).
      - kind: aside
        tone: joke
        page: 7
        quote: "In clinical research it would be ideal to include the entire population\nGENERALIZATION\nHowever, in most cases, the population in question is too large or too spread out over time and distance to allow for measuring or evaluating each member of the population."
        text: |
          الدكتور اللي عايز يدرس «كل» مرضى السكر في مصر قبل ما يكتب الرسالة، هيناقشها وهو على المعاش. 😄

          عشان كده بناخد **sample** كويسة ونعمم منها (generalization).
      - kind: try
        items: [res.L11.001, res.L11.009, res.L11.011]
    recap:
      - "3 أسئلة: مين (study population)، كام (sample size)، إزاي (sampling method)."
      - "الـ study unit ممكن تكون شخص أو مدرسة أو record، حسب المشكلة."
      - "الـ sample: أرخص وأسرع وممكن أدق، بس عيبها الـ selection bias."
      - "الـ representativeness: sampling procedure، sample size، participation."
    practice: [res.L11.001, res.L11.002, res.L11.003, res.L11.004, res.L11.005, res.L11.006, res.L11.007, res.L11.008, res.L11.009, res.L11.010, res.L11.011, res.L11.012, res.L11.083]
  # ------------------------------------------------------------------
  - id: res.L11.lesson2
    title: "Simple random و systematic: القرعة والكل خامس واحد"
    hook: "اختيار 100 طالب من 1200 بالقرعة، ولا كل 12 واحد؟ الاتنين probability، بس كل واحد له فخ."
    minutes: 9
    pages: [15, 94]
    topics: [probability]
    goals:
      - "تعرّف الـ probability sampling والـ sampling frame"
      - "تحسب الـ sampling interval في الـ systematic sampling"
      - "تعرف إمتى الـ systematic sampling يعمل bias"
    status: unverified
    steps:
      - kind: explain
        page: 15
        quote: "Each unit of the sample is chosen on the basis of chance. All units of the study population should have an equal, or at least a known chance of being included in the sample.\nThat guarantee requires subjects to be selected at random, or that randomization be employed."
        title: "Probability sampling = الحظ هو اللي بيختار"
        text: |
          في الـ ==probability sampling== كل unit بتتختار **by chance**: كل واحد في الـ population له فرصة **equal** (أو على الأقل **known**) إنه يدخل الـ sample.

          والضمان الوحيد لده هو الـ **randomization**.

          وعشان تعمل randomization لازم يكون عندك ==sampling frame==: الجزء من الـ population اللي هتختار منه، وغالبًا **list**: خرايط، directories، أو **hospital admission list**.
      - kind: explain
        page: 16
        quote: "The portion of the population from which a sample is to be selected.\nUsually defined by geographical listings, maps, directories, membership, hospital admission list or other kinds of lists."
        title: "الـ sampling frame"
        text: |
          الـ **sampling frame** = ==الجزء من الـ population اللي هتسحب منه الـ sample==.

          غالبًا بيتحدد بـ ==list==: geographical listings، maps، directories، membership، أو ==hospital admission list==.

          ليه محتاج list؟ لأنك ماتقدرش تختار random من ناس مش عارف هما مين، فالـ list هي اللي بتدّي كل واحد رقم يتسحب. التفسير المقبول (مش في الكتاب).
      - kind: check
        page: 16
        quote: "The portion of the population from which a sample is to be selected.\nUsually defined by geographical listings, maps, directories, membership, hospital admission list or other kinds of lists."
        question: "The list of all study population units from which the sample is selected is called:"
        options:
          - "Sampling frame"
          - "Sample size"
          - "Sampling error"
          - "Sampling ratio"
          - "Sampling procedure"
        answer: 0
        why:
          - "صح: الـ list اللي هتسحب منها = sampling frame."
          - "ده عدد اللي هتاخدهم."
          - "ده الفرق بالصدفة بين الـ sample والـ population."
          - "ده n ÷ N، رقم مش list."
          - "دي طريقة السحب نفسها."
      - kind: explain
        page: 21
        quote: "Applicable for small, homogenous and readily available populations\nA sampling frame is essential\nMethods of Simple random sampling:\nLottery method (Ideal bowel technique)\nTables of random numbers\nComputer software."
        title: "1. Simple random sampling"
        text: |
          ==Simple random sampling== زي **القرعة**: كل واحد في الـ list فرصته متساوية.

          **إزاي؟**
          - القرعة: **lottery method** (الورق في البولة).
          - جدول الأرقام العشوائية: **tables of random numbers**.
          - برنامج كمبيوتر: **computer software**.

          **ينفع إمتى؟** population **صغيرة، homogeneous، وفي متناول إيدك**. والـ sampling frame **essential**.
      - kind: check
        page: 17
        quote: "This is similar to lottery method that provides everyone in the population the equal chance to be picked as sample."
        question: "Simple random sampling:"
        options: ["Gives each unit an equal chance of being picked", "Picks every 5th or 10th unit at regular intervals", "Makes the sample represent each stratum", "Needs no sampling frame"]
        answer: 0
        why:
          - "صح: زي القرعة، كل واحد فرصته متساوية."
          - "ده الـ systematic sampling."
          - "ده الـ stratified sampling."
          - "بالعكس، الـ sampling frame essential."
      - kind: check
        page: 94
        quote: "Simple random sampling:\n  a. Provides least number of possible samples\n  b. Equal chance to each for collection of certain number for a sample\n  c. Picking every 5th or 10th at regular intervals\n  d. Sample represent, a corresponding strata of universe"
        question: "From the quiz: which statement describes simple random sampling?"
        options:
          - "Equal chance to each unit of being collected for a sample of a certain number"
          - "Provides the least number of possible samples"
          - "Picking every 5th or 10th at regular intervals"
          - "The sample represents a corresponding stratum of the universe"
        answer: 0
        why:
          - "صح (b في السلايد): زي القرعة، كل واحد فرصته متساوية."
          - "مش ده تعريفه."
          - "ده الـ systematic."
          - "ده الـ stratified."
      - kind: explain
        page: 22
        quote: "In SYSTEMATIC sampling individuals are chosen at regular intervals (for example every fifth) from the sampling frame.\nIdeally we randomly select a number to tell us where to start selecting individuals from the list.\nA sampling frame is essential"
        title: "2. Systematic sampling: كل K واحد"
        text: |
          في الـ ==systematic sampling== بتختار على **مسافات ثابتة** من الـ list (كل خامس واحد مثلًا).

          - المسافة دي اسمها ==sampling interval (K)== = عدد الـ population ÷ عدد الـ sample.
          - **أول رقم** بتختاره **عشوائي** بين 1 و K.
          - برضه محتاج **sampling frame**، وينفع مع population **كبيرة** ليها list كاملة.

          الدكتورة وضّحت في الشرح: الـ **sampling fraction** = n/N (100/1200)، والـ **interval** هو **مقلوبها** N/n = 1200/100 = **12**. ولو البداية العشوائية طلعت **7**، تاخد 7 ثم 19 ثم 31 … (كل مرة تزوّد 12).
      - kind: figure
        page: 25
        quote: "Systematic Random Sampling\nN = 100\nwant n = 20\nN/n = 5\nselect a random number from 1-5: chose 4\nstart with #4 and take every 5th unit"
        title: "N = 100، عايز n = 20"
        alt: "A row of numbered boxes from 1 to 20 standing for the list. A random start at box 4 is highlighted, then every fifth box after it (9, 14, 19) is highlighted too. Labels read N/n = 5 and random start 4."
        caption: "K = N/n = 100/20 = **5**. اخترنا عشوائي من 1 لـ 5 فطلع **4**، فبناخد 4، 9، 14، 19 … لحد ما نكمّل 20."
        svg: |
          <svg viewBox="0 0 330 120" xmlns="http://www.w3.org/2000/svg">
            <text x="8" y="20" class="t-sm t-b">K = N/n = 100/20 = 5</text>
            <text x="322" y="20" text-anchor="end" class="t-sm t-acc">random start = 4</text>
            <g class="t-sm">
              <rect x="8" y="40" width="14" height="22" class="fg-box"/><rect x="24" y="40" width="14" height="22" class="fg-box"/><rect x="40" y="40" width="14" height="22" class="fg-box"/>
              <rect x="56" y="40" width="14" height="22" class="fg-acc"/>
              <rect x="72" y="40" width="14" height="22" class="fg-box"/><rect x="88" y="40" width="14" height="22" class="fg-box"/><rect x="104" y="40" width="14" height="22" class="fg-box"/><rect x="120" y="40" width="14" height="22" class="fg-box"/>
              <rect x="136" y="40" width="14" height="22" class="fg-acc"/>
              <rect x="152" y="40" width="14" height="22" class="fg-box"/><rect x="168" y="40" width="14" height="22" class="fg-box"/><rect x="184" y="40" width="14" height="22" class="fg-box"/><rect x="200" y="40" width="14" height="22" class="fg-box"/>
              <rect x="216" y="40" width="14" height="22" class="fg-acc"/>
              <rect x="232" y="40" width="14" height="22" class="fg-box"/><rect x="248" y="40" width="14" height="22" class="fg-box"/><rect x="264" y="40" width="14" height="22" class="fg-box"/><rect x="280" y="40" width="14" height="22" class="fg-box"/>
              <rect x="296" y="40" width="14" height="22" class="fg-acc"/>
              <rect x="312" y="40" width="14" height="22" class="fg-box"/>
            </g>
            <text x="63" y="80" text-anchor="middle" class="t-sm t-acc t-b">4</text>
            <text x="143" y="80" text-anchor="middle" class="t-sm t-acc t-b">9</text>
            <text x="223" y="80" text-anchor="middle" class="t-sm t-acc t-b">14</text>
            <text x="303" y="80" text-anchor="middle" class="t-sm t-acc t-b">19</text>
            <text x="165" y="108" text-anchor="middle" class="t-sm t-mut">every 5th unit until n = 20</text>
          </svg>
      - kind: case
        page: 24
        quote: "The sampling interval is, therefore, 12. The number of the first student to be included in the sample is chosen randomly, for example by blindly picking one out of twelve pieces of paper, numbered 1- 12.\nif number 6 is picked, then every twelfth student will be included in the sample, starting with student number 6, until 100 students are selected: then numbers selected would be 6, 18, 30, 42, etc."
        stem: "مدرسة فيها 1200 طالب، وعايز systematic sample من 100 طالب."
        steps:
          - question: "What is the sampling interval?"
            options: ["12", "100", "1/12"]
            answer: 0
            why: "K = 1200 ÷ 100 = **12**. والـ sampling fraction = 100/1200."
          - question: "You blindly pick paper number 6 out of papers numbered 1-12. Which students are selected?"
            options: ["6, 18, 30, 42 ...", "6, 12, 18, 24 ...", "12, 24, 36, 48 ..."]
            answer: 0
            why: "تبدأ بالـ **random start** = 6 وتزود 12 كل مرة، لحد ما تكمّل 100."
      - kind: explain
        page: 27
        quote: "Systematic sampling is usually less time consuming and easier to perform than simple random sampling. However, there is a risk of bias, as the sampling interval may coincide with a systematic variation in the sampling frame.\nFor instance, if we want to select a random sample of days on which to count clinic attendance, systematic sampling with a sampling interval of 7 days would be inappropriate, as all study days would fall on the same day of the week, which might, for example, be market day."
        title: "أسهل، بس فيه فخ"
        text: |
          الـ systematic sampling **أسرع وأسهل** من الـ simple random.

          بس فيه ==risk of bias== لو الـ **sampling interval** صادف **systematic variation** في الـ list.

          مثال الشريحة: عايز تعد زيارات العيادة، واخترت يوم كل **7 أيام**. كل الأيام هتطلع **نفس يوم الأسبوع**… ولو طلع يوم السوق، العيادة فاضية والنتيجة كلها غلط.
      - kind: check
        page: 27
        quote: "Systematic sampling is usually less time consuming and easier to perform than simple random sampling. However, there is a risk of bias, as the sampling interval may coincide with a systematic variation in the sampling frame.\nFor instance, if we want to select a random sample of days on which to count clinic attendance, systematic sampling with a sampling interval of 7 days would be inappropriate, as all study days would fall on the same day of the week, which might, for example, be market day."
        question: "Why is a 7-day interval wrong for sampling days to count clinic attendance?"
        options: ["The interval coincides with the weekly cycle, so every study day is the same weekday", "Seven days give too small a sample", "Systematic sampling cannot be used for days", "It needs a sampling frame of patients"]
        answer: 0
        why:
          - "صح: الـ interval طابق تكرار أسبوعي في الـ frame، فده bias."
          - "المشكلة مش في العدد، في إن كل الأيام شبه بعض."
          - "ينفع مع الأيام، بس بـ interval ميطابقش دورة الأسبوع."
          - "الـ frame هنا هو الأيام، وموجود."
