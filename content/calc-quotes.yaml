      Biphasic Twice-daily Regimen:
        1. Indications:
          1. Type 2 diabetics not controlled on a once-daily regimen.
        1. Guidelines:
          1. Starting daily dose = 0.3 U/Kg body weight.
          2. Give 2/3 of the total daily dose before breakfast and 1/3 before dinner.
          3. Titrate the dose according to FBG and PPG.
      Disadvantages of Biphasic Twice-daily Regimen:
        1. Not flexible.
        2. Must have 3 meals a day.
        3. You cannot skip a meal.
        4. Difficult to adjust dose if there is a significant variation in the CHO component of the meal.
        5. Difficult to adjust dose if there is a sudden increase in physical activity.
