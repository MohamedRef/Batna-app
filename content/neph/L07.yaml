    front: What did the HALT PKD post hoc analysis link to kidney growth?
    back: Dietary sodium intake.
    src: { page: 149, quote: "Recently, a post hoc analysis of the HALT PKD clinical trials showed an association of dietary sodium with the rate of kidney growth in." }
