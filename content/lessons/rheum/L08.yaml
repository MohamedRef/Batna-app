  - id: rheum.L08.lesson5
    title: "ANCA: GPA و MPA و EGPA وعلاجهم"
    hook: "أنف بتنزف ورئة فيها كهوف وكلية بتقع: ده الـ c-ANCA بيكلمك."
    minutes: 10
    pages: [145, 156]
    topics: [aav, aav-rx]
    goals:
      - "تفرّق GPA و MPA و EGPA بالأعضاء والـ ANCA والـ criteria"
      - "تختار induction حسب organ-threatening ولا لأ"
      - "تحفظ الـ maintenance والـ refractory والـ monitoring"
    status: unverified
    steps:
      - kind: table
        page: 146
        quote: "GPA c-ANCA+ PR-3+ Necrotizing vasculitis and granulomas MPA p-ANCA+ MPO+ Necrotizing vasculitis"
        title: "GPA ضد MPA"
        columns: [Feature, GPA, MPA]
        rows:
          - ["ANCA", "c-ANCA", "p-ANCA"]
          - ["Antigen", "PR-3", "MPO"]
          - ["Histology", "Vasculitis + granulomas", "Vasculitis only"]
          - ["Top organ", "ENT 80–90%", "Kidney 90–100%"]
        hide: [[0, 1], [1, 2], [2, 1], [3, 2]]
      - kind: aside
        tone: tip
        page: 146
        quote: "GPA c-ANCA+ PR-3+ Necrotizing vasculitis and granulomas MPA p-ANCA+ MPO+ Necrotizing vasculitis"
        text: |
          **C** = **C**lassic Wegener = **c**-ANCA = PR3 (حرف الـ **P** في الـ PR3 بيقعد مع الـ **c**، مش منطقي بس بيتحفظ).
          **M**PA = **M**PO = p-ANCA: حرف **M** مع **M**.
      - kind: explain
        page: 147
        title: "2022 ACR/EULAR: GPA ≥5"
        quote: "Sum scores for 10 items, if present. A score of ≥ 5 is needed for classification of granulomatosis with polyangiitis."
        text: |
          **+5** c-ANCA/PR3، **+3** nasal discharge/crusting/septal perforation، **+2** cartilage (saddle nose، stridor)، **+2** lung nodules/cavity، **+2** granuloma، **+1** hearing loss، **+1** sinusitis/mastoiditis، **+1** pauci-immune GN.

          بالسالب: **−1** p-ANCA/MPO، و ==−4 eosinophils ≥1 × 10⁹/L== (علشان دي EGPA).
      - kind: explain
        page: 147
        title: "MPA ≥5"
        quote: "Sum scores for 6 items, if present. A score of ≥ 5 is needed for classification of microscopic polyangiitis."
        text: |
          ==+6 p-ANCA/MPO==، **+3** fibrosis أو ILD، **+3** pauci-immune GN.
          بالسالب: **−3** nasal disease، **−1** c-ANCA، **−4** eosinophils.

          المنطق: الأنف علامة GPA، فبتطرح من الـ MPA.
      - kind: check
        page: 147
        quote: "Positive test for perinuclear antineutrophil cytoplasmic antibodies or antimyeloperoxidase antibodies ANCA positive +6"
        question: "MPO-ANCA +, ILD, pauci-immune GN, no nasal disease, normal eosinophils. MPA score?"
        options:
          - "12"
          - "9"
          - "6"
          - "15"
        answer: 0
        why:
          - "صح: 6 + 3 + 3 = 12، أكتر من 5."
          - "نسيت بند من الـ +3."
          - "عدّيت الـ MPO بس."
          - "مفيش بنود تانية بالموجب."
      - kind: table
        page: 149
        quote: "Nasal polyposis. Pulm infilterate. Cardiomyopathy. Polyneuropathy. Esinophilic gastritis. Histopatholgy. Esinophil tissue infilteration."
        title: "EGPA: وشّين"
        columns: [Feature, ANCA +, ANCA −]
        rows:
          - ["Clinical", "Necrotizing GN, purpura, lung haemorrhage, mononeuritis", "Nasal polyps, lung infiltrate, cardiomyopathy, polyneuropathy, eosinophilic gastritis"]
