        hook: "سؤال كتاب: **ideal basal insulin**. الستة دول بالترتيب: **M-P-L-N-O-P**، اقرأها «ام بي ال نوب»."
      - kind: explain
        page: 134
        title: "ليه الستة دول هما المثالي؟"
        quote: "IDEAL BASAL INSULIN:\n      1. Closely mimic normal pancreatic basal insulin secretion\n      2. No distinct peak effect\n      3. Continued effect over 24 hours\n      4. Reduce nocturnal hypoglycemia\n      5. Once-daily administration for patient compliance\n      6. Predictable absorption pattern"
        text: |
          الستة مربوطين ببعض، والتفسير المقبول (مش في الكتاب) كده:

          - **Mimic** الـ basal الطبيعي: لأن البنكرياس السليم بيطلّع خط ثابت، فأي basal لازم يبقى شبهه.
          - **No distinct peak**: لأن الـ peak لو جه بالليل وانت مش بتاكل يعمل hypo، وده بالظبط عيب الـ NPH في الرسمة.
          - **24 hours**: عشان حقنة واحدة تغطي اليوم كله من غير «فجوة» قبل الجرعة الجاية يطلع فيها السكر.
          - **Reduce ==nocturnal hypoglycemia==**: نتيجة مباشرة للـ no peak.
          - **Once daily**: نتيجة الـ 24 ساعة، وبتزوّد الـ compliance.
          - **Predictable absorption**: يعني نفس الجرعة تعمل نفس الأثر كل يوم، فالـ titration بالأرقام تبقى منطقية.
