          </svg>
      - kind: aside
        tone: analogy
        page: 38
        quote: "Classification of Portal Hypertension Pre-hepatic Portal vein thrombosis Splenic vein thrombosis Massive splenomegaly"
        text: |
          تخيّل الدم عربيات طالعة من الجيزة (الأمعاء والطحال) رايحة رمسيس (القلب)، ولازم تعدّي على وسط البلد (الكبد).

          - حادثة على الكوبري قبل وسط البلد = **pre-hepatic** (portal vein thrombosis).
          - زحمة جوّه شوارع وسط البلد = **hepatic**: في أول الشارع (pre-sinusoidal، البلهارسيا)، في الشارع نفسه (sinusoidal، الـ cirrhosis)، أو عند المخرج (post-sinusoidal).
          - الزحمة عند ميدان رمسيس نفسه = **post-hepatic** (Budd-Chiari، inferior vena cava (IVC) web، أو القلب).

          في كل الحالات العربيات اللي ورا بتتكوّم، وده الـ portal hypertension.
      - kind: sort
        page: 38
        quote: "Classification of Portal Hypertension Pre-hepatic Portal vein thrombosis Splenic vein thrombosis Massive splenomegaly"
        prompt: "صنّف الأسباب دي:"
        bins: ["Pre-hepatic", "Hepatic", "Post-hepatic"]
        cards:
          - { text: "Portal vein thrombosis", bin: 0 }
          - { text: "Splenic vein thrombosis", bin: 0 }
          - { text: "Massive splenomegaly", bin: 0 }
          - { text: "Schistosomiasis", bin: 1 }
          - { text: "Cirrhosis", bin: 1 }
          - { text: "Congenital hepatic fibrosis", bin: 1 }
          - { text: "Budd-Chiari syndrome", bin: 2 }
          - { text: "Constrictive pericarditis", bin: 2 }
          - { text: "Inferior vena caval web", bin: 2 }
        why: |
          رتّبهم على طريق الدم:

          - **Pre-hepatic**: الـ massive splenomegaly، علشان بتزوّد الـ flow الداخل للـ portal (مش انسداد).
          - **Pre-sinusoidal** (جوه الكبد): البلهارسيا و congenital hepatic fibrosis.
          - **Sinusoidal**: الـ cirrhosis.
          - **Post-hepatic** (القلب): restrictive cardiomyopathy، constrictive pericarditis، severe congestive heart failure (CHF).
      - kind: aside
        tone: exam
        page: 38
        quote: "Classification of Portal Hypertension\nPre-hepatic:\n  Portal vein thrombosis\n  Splenic vein thrombosis\n  Massive splenomegaly\nHepatic:\n  Pre-sinusoidal:\n    Schistosomiasis\n    Congenital hepatic fibrosis\n  Sinusoidal:\n    Cirrhosis\n    Alcoholic hepatitis\n  Post-sinusoidal:\n    Hepatic sinusoidal obstruction\nPost-hepatic:\n  Budd-Chiari syndrome\n  Inferior vena caval webs\n  Cardiac causes"
        text: |
          في مصر الـ **Schistosomiasis** نجمة الامتحان: هي **pre-sinusoidal** (البيض بيقعد في الـ portal venules).

          سؤال الكتاب نفسه: «Which can cause **pre-sinusoidal** PH?» والاختيارات right heart failure و Budd-Chiari و constrictive pericarditis و IVC… كلهم **post-hepatic**، والإجابة **Schistosomiasis**.
      - kind: reveal
        page: 38
        quote: "Classification of Portal Hypertension\nPre-hepatic:\n  Portal vein thrombosis\n  Splenic vein thrombosis\n  Massive splenomegaly\nHepatic:\n  Pre-sinusoidal:\n    Schistosomiasis\n    Congenital hepatic fibrosis\n  Sinusoidal:\n    Cirrhosis\n    Alcoholic hepatitis\n  Post-sinusoidal:\n    Hepatic sinusoidal obstruction\nPost-hepatic:\n  Budd-Chiari syndrome\n  Inferior vena caval webs\n  Cardiac causes"
        prompt: "لو عملنا قسطرة للـ hepatic vein: الـ **wedged** pressure (WHVP) بيقيس إيه؟ وإزاي ده بيفرّق بين المستويات؟"
        answer: |
          (ده من الـ physiology المعروفة، الكتاب بيسأل عنه في سؤال 6 من غير ما يشرحه.)

          لما تسد الـ hepatic vein بالـ balloon، الضغط اللي بتقيسه بيبقى ضغط الـ **sinusoids**. والـ **HVPG = WHVP − free hepatic venous pressure (FHVP)**.

          - **Sinusoidal** (cirrhosis): الـ wedged **عالي** والـ free طبيعي، فالـ HVPG **عالي**.
          - **Pre-sinusoidal / pre-hepatic** (schistosomiasis، portal vein thrombosis): الانسداد **قبل** الـ sinusoid، فالـ wedged **طبيعي** والـ HVPG طبيعي رغم إن فيه PH.
          - **Post-hepatic** (قلب، Budd-Chiari): الـ wedged والـ free الاتنين عاليين، فالفرق (HVPG) ممكن يبقى طبيعي.
      - kind: check
        page: 38
        quote: "Classification of Portal Hypertension\nPre-hepatic:\n  Portal vein thrombosis\n  Splenic vein thrombosis\n  Massive splenomegaly\nHepatic:\n  Pre-sinusoidal:\n    Schistosomiasis\n    Congenital hepatic fibrosis\n  Sinusoidal:\n    Cirrhosis\n    Alcoholic hepatitis\n  Post-sinusoidal:\n    Hepatic sinusoidal obstruction\nPost-hepatic:\n  Budd-Chiari syndrome\n  Inferior vena caval webs\n  Cardiac causes"
        question: "Before TIPS, a woman's free hepatic venous pressure is 6 mmHg and her wedged hepatic venous pressure is 13 mmHg. Which cause best fits?"
        options:
          - "Alcoholic cirrhosis"
          - "Portal vein thrombosis"
          - "Constrictive pericarditis"
          - "Schistosomiasis"
        answer: 0
        why:
          - "صح: Hepatic venous pressure gradient (HVPG) = 13 − 6 = 7 mmHg مع wedged عالي وfree طبيعي، يعني المشكلة **sinusoidal**، زي الـ cirrhosis."
          - "الـ portal vein thrombosis (PVT) **pre-hepatic**: الـ wedged بيبقى طبيعي لأن الانسداد قبل الكبد."
          - "الـ constrictive pericarditis **post-hepatic**: الـ free pressure نفسه كان هيبقى عالي، مش 6."
          - "البلهارسيا **pre-sinusoidal**: الـ wedged بيبقى طبيعي أو قريب منه."
      - kind: update
        page: 38
        quote: "Definition of portal hypertension: ΔP > 10 mm Hg"
        text: "Baveno VII بيعرّف الـ portal hypertension بـ **HVPG > 5 mmHg** (الطبيعي 1–5)، والـ clinically significant portal hypertension (CSPH) بـ HVPG ≥ 10 mmHg. رقم الكتاب أكتر من 10 mmHg هو رقم الـ CSPH، وفي الامتحان اكتب رقم الكتاب."
        ref: "Baveno VII consensus, 2021"
      - kind: figure
        page: 38
        quote: "Definition of portal hypertension: ΔP > 10 mm Hg"
        title: "تعريف الـ portal hypertension في الكتاب"
        image: { file: hb/L03-ph-definition.webp, book: true }
        alt: "Book drawing: a red liver with the portal vein entering from below and the hepatic veins leaving at the top towards the inferior vena cava (blue). Two horizontal arrows, one at the hepatic veins above and one at the portal vein below, are joined by a vertical bracket labelled 'ΔP > 10 mm Hg'."
        caption: |
          الرسمة دي هي التعريف كله في صورة واحدة:

          - **فوق**: الأزرق هو الـ hepatic veins والـ inferior vena cava، يعني الدم الخارج من الكبد.
          - **تحت**: الوريد الأزرق الداخل للكبد الأحمر هو الـ **portal vein**.
          - **على اليمين**: سهمين، واحد عند الخارج فوق وواحد عند الداخل تحت، وبينهم القوس المكتوب عليه ==ΔP > 10 mm Hg==.

          يعني الكتاب مش بيقيس ضغط الـ portal vein لوحده، بيقيس **الفرق** بين الداخل والخارج (الـ ==gradient==). وده بالظبط اللي الـ HVPG بيقيسه، ورقم أكتر من 10 ده هو رقم الـ CSPH زي ما الخطوة اللي فوق قالت.
      - kind: try
        items: [hb.L03.007, hb.L03.010, hb.L03.008, hb.L03.004, hb.L03.003]
    recap:
      - "الـ PH أشهر مضاعفة للـ cirrhosis والمحرّك الأساسي للـ decompensation."
      - "Compensated: امنع أول decompensation. Decompensated: امنع اللي بعدها (rebleeding، SBP، HRS، …) وحسّن الـ survival."
      - "Varices: 30% وقت التشخيص، 90% بعد 10 سنين. Predictors: INR أكتر من 1.5، portal vein > 13 mm، thrombopenia."
      - "Pre-hepatic: PVT، splenic vein thrombosis، massive splenomegaly. Pre-sinusoidal: schistosomiasis، congenital hepatic fibrosis."
      - "Sinusoidal: cirrhosis، alcoholic hepatitis. Post-sinusoidal: hepatic sinusoidal obstruction. Post-hepatic: Budd-Chiari، IVC webs، cardiac."
      - "HVPG = wedged − free. عالي في الـ sinusoidal، طبيعي في الـ pre-sinusoidal والـ pre-hepatic."
    practice: [hb.L03.001, hb.L03.002, hb.L03.003, hb.L03.004, hb.L03.005, hb.L03.006, hb.L03.007, hb.L03.008, hb.L03.009, hb.L03.011, hb.L03.094, hb.L03.099]

  # ------------------------------------------------------------------
  - id: hb.L03.lesson2
    title: "P = R × F: ليه الضغط بيعلى؟"
    hook: "الكبد بخيل بالـ NO على نفسه وكريم بيه على الأمعاء. ومن التناقض ده بتبدأ الحكاية كلها."
    minutes: 9
    pages: [39, 42]
    topics: [pathophysiology]
    goals:
      - "تشرح الـ portal hypertension بمعادلة واحدة: P = R × F"
      - "تقسّم الـ intrahepatic resistance لـ fixed (~70%) و dynamic (~30%)"
      - "تعدّ الـ vasoconstrictors جوه الكبد والـ vasodilators في الـ splanchnic bed"
      - "ترسم الـ vicious cycle من الـ vasodilation للـ hyperdynamic circulation"
    status: unverified
    steps:
      - kind: explain
        page: 39
        quote: "Pressure (P) results from the interaction of resistance (R) and flow (F): P=RxF"
        title: "قانون أوم بتاع الكبد"
        text: |
          الضغط (**P**) بيطلع من تفاعل الـ **resistance (R)** والـ **flow (F)**:

          ==P = R × F==

          يعني الـ portal hypertension بييجي من واحدة من اتنين، أو الاتنين:
          - زيادة الـ resistance للـ portal flow.
          - زيادة الـ **portal venous inflow**.

          الكبد الطبيعي عنده قدرة إنه يستوعب تغييرات كبيرة في الـ flow من غير ما الضغط يتغير تقريبًا. مثال: بعد الأكل الـ flow بيزيد، والضغط بالكاد بيتحرك، لأن الـ sinusoids بتتفتح وتستقبل.

          في الـ cirrhosis، الاتنين بيحصلوا مع بعض: الـ resistance بتعلى والـ inflow بيزيد. وده سر إن العلاج بيضرب في الاتنين، زي ما هنشوف في الـ prophylaxis.
      - kind: figure
        page: 39
        quote: "Pathophysiology of portal hypertension haemodynamic factors"
        title: "الـ P = R × F في الكتاب"
        image: { file: hb/L03-haemodynamic-factors.webp, book: true }
        alt: "Book diagram headed 'Portal pressure = resistance x blood flow'. Two boxes, 'Increased resistance (dynamic/mechanic)' on the left and 'Increased blood flow (splanchnic vasodilation)' on the right, each with an arrow down to 'Increased portal pressure'. Source line below: Sorrento Somatostatin-14 Symposium, presentation by Jaime Bosch."
        caption: |
          الرسمة بتحط المعادلة في تلات صناديق:

          - **فوق**: **Portal pressure = resistance x blood flow**.
          - **شمال**: **Increased resistance (dynamic/mechanic)**: الـ R، وليها جزء ثابت (mechanic) وجزء بيتغير (dynamic).
          - **يمين**: **Increased blood flow (splanchnic vasodilation)**: الـ F، وجاية من توسّع أوعية الأمعاء.
          - السهمين بيتقابلوا **تحت** في **Increased portal pressure**.

          يعني الضغط العالي ليه ==رجلين== مش رجل واحدة، وكل الدرس ده هو شرح الرجلين دول بالترتيب: الـ R جوه الكبد، وبعدين الـ F برّه.
      - kind: aside
        tone: analogy
        page: 39
        quote: "The normal liver has the ability to accommodate large changes in portal blood flow without appreciable alterations in portal pressure. Portal hypertension results from a combination of increased portal venous inflow and increased resistance to portal blood flow."
        text: |
          افتكر خرطوم الجنينة: لو ضغطت على آخره بصباعك (resistance) وفتحت الحنفية على الآخر (flow)، المية بتطرطش بعيد.

          الـ cirrhosis بتعمل الاتنين: الكبد المتليف هو الصباع، والـ splanchnic vasodilation هي الحنفية المفتوحة. وعلشان كده العلاج بيا يرخّي الصباع، يا يقفل الحنفية، يا الاتنين.
      - kind: explain
        page: 40
        quote: "Increased intrahepatic resistance in cirrhosis\n| | Architectural disturbances | Functional alterations |\n|---|---|---|\n| Mechanism | Distortion of vascular architecture by fibrosis, scarring, regenerative nodules. Thrombosis | Active contraction of hepatic stellate cells, vascular smooth cells in the portal venules, and myofibroblasts |\n| Component | Mechanical Component (\"fixed\") | Dynamic Component (modifiable by drugs) |\n| Share | ~70% | ~30% |"
        title: "الـ resistance جوه الكبد: جزء ثابت وجزء بيتحرك"
        text: |
          الـ resistance جوه الكبد ليها مصدرين، واحد ما يتلمسش وواحد الدوا يقدر عليه.

          **1. Architectural disturbances (~70%)**
          - تشوّه الـ vascular architecture بالـ **fibrosis** والـ scarring والـ **regenerative nodules**، وكمان **thrombosis**.
          - ده الـ ==mechanical component==، وهو fixed.

          **2. Functional alterations (~30%)**
          - Active contraction للـ **hepatic stellate cells**، والـ vascular smooth muscle cells في الـ portal venules، والـ **myofibroblasts**.
          - ده الـ ==dynamic component==، وهو modifiable by drugs.

          فاكر الـ hepatic stellate cell (HSC) اللي اتحوّلت لـ myofibroblast في درس الـ cirrhosis؟ هي نفسها اللي بتنقبض وتضيّق الـ sinusoid. فالتليف والضغط قصة واحدة.

          الخلاصة العملية: الأدوية زي الـ carvedilol بتلعب في الـ 30% بس. علشان كده ما تقدرش ترجّع الضغط طبيعي بالدوا لوحده في cirrhosis متقدمة.
      - kind: check
        page: 40
        quote: "Increased intrahepatic resistance in cirrhosis\n| | Architectural disturbances | Functional alterations |\n|---|---|---|\n| Mechanism | Distortion of vascular architecture by fibrosis, scarring, regenerative nodules. Thrombosis | Active contraction of hepatic stellate cells, vascular smooth cells in the portal venules, and myofibroblasts |\n| Component | Mechanical Component (\"fixed\") | Dynamic Component (modifiable by drugs) |\n| Share | ~70% | ~30% |"
        question: "Which part of the increased intrahepatic resistance in cirrhosis can drugs modify?"
        options:
          - "The functional (dynamic) part, about 30%, from active contraction of stellate cells and myofibroblasts"
          - "The architectural (fixed) part, about 70%, from fibrosis and nodules"
          - "Both parts equally"
          - "Neither: resistance is entirely structural"
        answer: 0
        why:
          - "صح: الـ **dynamic component** (~30%) هو اللي الأدوية تقدر عليه، لأنه انقباض خلايا مش ندبة."
          - "الـ 70% دي **mechanical, fixed**: ندبة و nodules، الدوا ما بيفكّهاش."
          - "الكتاب بيفرّق بينهم بوضوح: **fixed** و **modifiable by drugs**."
          - "فيه 30% functional، فالـ resistance مش كلها structural."
      - kind: explain
        page: 40
        quote: "Vasoconstrictors: Endothelin, Angiotensin, Norepinephrine, Vasopressin, Leukotrienes, Thromboxane"
        title: "جوه الكبد: الميزان مايل للتضييق"
        text: |
          الـ intrahepatic resistance كمان بتعلى بسبب imbalance بين الـ vasodilators والـ vasoconstrictors.

          **Vasoconstrictors** (كتير):
          - **endothelin**، **angiotensin**، **norepinephrine**، **vasopressin**، **leukotrienes**، **thromboxane**.

          **Vasodilators** (مش كفاية جوه الكبد):
          - ==nitric oxide (NO)== و **carbon monoxide (CO)**.

          النتيجة: الـ sinusoids والـ venules جوه الكبد متضيّقة.

          ليه الـ NO قليل جوه الكبد؟ لأن الـ sinusoidal endothelium المتأذي ما بيطلّعش NO كفاية. وده بيوصلنا للمفارقة اللي في الخطوة الجاية.
      - kind: figure
        page: 40
        quote: "Vasodilator/vasoconstrictor imbalance in the pathogenesis of increased intrahepatic vascular resistance in cirrhosis"
        title: "الميزان المايل في الكتاب"
        image: { file: hb/L03-vasoactive-seesaw.webp, book: true }
        alt: "Book drawing of a seesaw on a black triangle. The left end, lower, carries a box 'Vasoconstrictors: endothelin, angiotensin, norepinephrine, vasopressin, leukotrienes, thromboxane, other?'. The right end, higher, carries a box headed 'Vasodilators' listing nitric oxide (NO), carbon monoxide (CO), other?"
        caption: |
          الكتاب رسم الـ imbalance كميزان:

          - **الكفة الشمال (نازلة، تقيلة)**: **Vasoconstrictors**: endothelin، angiotensin، norepinephrine، vasopressin، leukotrienes، thromboxane.
          - **الكفة اليمين (طالعة، خفيفة)**: **Vasodilators**: nitric oxide (NO)، carbon monoxide (CO).

          خلّي بالك من حاجتين في الصورة: عنوان الصندوق اليمين مكتوب فيه «Vasodilators Endothelin» وجوّاه Angiotensin، ودول في الحقيقة من الـ constrictors زي ما الكفة الشمال بتقول؛ وعلامة الاستفهام «Other?» في الاتنين معناها إن القايمة لسه مش كاملة.

          الصورة بتثبت الفكرة: جوه الكبد الميزان ==مايل ناحية التضييق==، فالـ dynamic part من الـ R بتعلى.
      - kind: explain
        remind: [hb.L03.020, hb.L09.013]
        page: 41
        quote: "Splanchnic vasodilatation in cirrhosis\nIncreased vasodilators:\n  Glucagon\n  Endocannabinoids\n  Nitric oxide\n  Prostacyclin\n  Carbon monoxide\nIncreased angiogenesis"
        title: "برّه الكبد: الميزان مايل للتوسيع"
        text: |
          في الـ **splanchnic circulation** (الأمعاء والطحال) الصورة العكس. فيه ==splanchnic vasodilatation== بسبب increased vasodilators:

          - **Glucagon**
          - **Endocannabinoids**
          - **Nitric oxide**
          - **Prostacyclin**
          - **Carbon monoxide**

          ومعاهم increased **angiogenesis** (angiogenic factors زي **vascular endothelial growth factor (VEGF)**)، فبتتعمل أوعية جديدة.

          والأوعية المتوسعة دي بتصب دم أكتر في الـ portal vein، فالـ F في المعادلة بتزيد.

          المفارقة: نفس الـ NO قليل جوه الكبد (فيضيق) وكتير برّه (فيوسّع). والاتنين بيرفعوا الضغط، واحد من ناحية الـ R والتاني من ناحية الـ F.
      - kind: figure
        page: 41
        title: "الكبد المتليف والطحال في الكتاب"
        image: { file: hb/L03-cirrhotic-liver.webp, book: true }
        alt: "Book illustration on a dark blue background labelled 'Cirrhotic Liver'. A nodular orange liver on the left with a small square of fibrous mesh drawn on it; blue portal vessels run from the liver to a large purple spleen on the right. Labels: 'Porto-systemic collaterals' at the top pointing at vessels between them, 'Increased portal pressure' at the lower left on the portal vein, and 'Splenomegaly' at the lower right."
        caption: |
          دي صورة الـ portal hypertension من برّه، من الشمال لليمين:

          - **الكبد البرتقاني (شمال)**: سطحه محبّب (nodules)، والمربع الصغير عليه شبكة الـ fibrosis: ده مصدر الـ R.
          - **الوريد الأزرق تحت**: مكتوب عليه **Increased portal pressure**، والسهم الأصفر عليه بيوضّح اتجاه الدم ناحية الكبد.
          - **فوق**: **Porto-systemic collaterals**: الأوعية الرفيعة اللي بتربط الـ portal بالـ systemic علشان الدم يهرب من الضغط.
          - **يمين تحت**: الطحال البنفسجي الكبير: **Splenomegaly**.

          الصورة بتربط الحكاية: ==الضغط العالي== بيكبّر الطحال (ومن هنا الصفايح الواطية) ويفتح ==collaterals==، والأوعية دي هي اللي هتبقى الـ varices.
      - kind: aside
        tone: trap
        page: 41
        quote: "Splanchnic vasodilatation in cirrhosis\nIncreased vasodilators:\n  Glucagon\n  Endocannabinoids\n  Nitric oxide\n  Prostacyclin\n  Carbon monoxide\nIncreased angiogenesis"
        text: |
          الـ **NO** موجود في القايمتين، وده الفخ:

          - جوه الكبد: NO قليل ← الـ resistance بتعلى.
          - في الـ splanchnic bed: NO كتير ← vasodilation والـ inflow بيزيد.

          الكبد بخيل بالـ NO على نفسه وكريم بيه على الأمعاء. 😄 والاتنين بيرفعوا الضغط.
      - kind: sort
        page: 40
        quote: "Vasoconstrictors: Endothelin, Angiotensin, Norepinephrine, Vasopressin, Leukotrienes, Thromboxane"
        prompt: "الحاجة دي بتزيد فين في الـ cirrhosis وبتعمل إيه؟"
        bins: ["Intrahepatic vasoconstrictor (↑ R)", "Splanchnic vasodilator (↑ F)"]
        cards:
          - { text: "Endothelin", bin: 0 }
          - { text: "Thromboxane", bin: 0 }
          - { text: "Norepinephrine", bin: 0 }
          - { text: "Leukotrienes", bin: 0 }
          - { text: "Glucagon", bin: 1 }
          - { text: "Endocannabinoids", bin: 1 }
          - { text: "Prostacyclin", bin: 1 }
        why: |
          - **جوه الكبد**: الـ constrictors (endothelin، angiotensin، norepinephrine، vasopressin، leukotrienes، thromboxane) بيضيّقوا، فالـ R تعلى.
          - **برّه الكبد**: الـ splanchnic dilators (glucagon، endocannabinoids، NO، prostacyclin، CO) بيوسّعوا، فالـ F تزيد.
      - kind: figure
        page: 42
        quote: "Cirrhosis (Modified from Garcia-Tsao and Bosch. NEJM 2010;362:9):\n  ↑Resistance to portal flow (fixed and functional) → ↑ Portal pressure → Varices → Variceal growth\n  ↑ Portal pressure → ↑ Vasodilating factors (e.g NO) → Splanchnic → ↑Portal blood inflow → ↑ Portal pressure\n  ↑Angiogenic factors (e.g. VEGF) → Formation of new vessels → ↑Portal blood inflow; Varices"
        title: "الدايرة اللي ما بتقفلش في الكتاب (1): الطريق للـ varices"
        image: { file: hb/L03-garcia-tsao-varices.webp, book: true }
        alt: "Book flowchart 'Cirrhosis', modified from Garcia-Tsao and Bosch, NEJM 2010. Left column: increased resistance to portal flow (fixed and functional), down to increased portal pressure, down to varices, down to variceal growth. From portal pressure an arrow goes right to increased vasodilating factors (e.g. NO), down to splanchnic, down to increased portal blood inflow, which points back to portal pressure. Right: increased angiogenic factors (e.g. VEGF) down to formation of new vessels, which points to portal blood inflow and, by a long arrow, to varices."
        caption: |
          اقرا الرسمة تلات عواميد:

          - **العمود الشمال**: **↑Resistance** (fixed and functional) ← **↑Portal pressure** ← **Varices** ← **Variceal growth**.
          - **العمود اللي في النص**: من الـ portal pressure سهم يمين لـ **↑Vasodilating factors (e.g NO)** ← **Splanchnic** ← **↑Portal blood inflow**، والسهم التخين راجع شمال للـ portal pressure تاني. دي ==الدايرة==: الضغط يعلّي الـ inflow والـ inflow يعلّي الضغط.
          - **العمود اليمين**: **↑Angiogenic factors (e.g. VEGF)** ← **Formation of new vessels**، وسهم منها للـ inflow وسهم طويل للـ **Varices**.

          يعني الـ varices مش بس «أوعية اتنفخت من الضغط»، ده كمان ==أوعية جديدة== بتتبني. والسطر الصغير تحت هو المرجع (Garcia-Tsao and Bosch, NEJM 2010).
      - kind: figure
        page: 42
        title: "الدايرة اللي ما بتقفلش في الكتاب (2): الـ hyperdynamic circulation"
        image: { file: hb/L03-garcia-tsao-hyperdynamic.webp, book: true }
        alt: "Second book flowchart 'Cirrhosis'. Increased resistance to portal flow leads to increased portal pressure, which leads to varices and then to variceal haemorrhage, ascites and encephalopathy. Portal pressure also leads to decreased splanchnic arteriolar resistance and increased portal blood inflow; this leads to decreased systemic arteriolar resistance and decreased effective arterial blood volume, then activation of neurohumoral systems (RAAS, etc), sodium and water retention and a hyperdynamic circulatory state, which feeds back into portal inflow and into the complications box."
        caption: |
          الرسمة التانية بتكمّل الحكاية لحد المضاعفات:

          - **شمال**: **↑Resistance** ← **↑Portal pressure** ← **Varices** ← الصندوق اللي فيه **Variceal hemorrhage، Ascites، Encephalopathy**.
          - **في النص**: من الـ portal pressure ← **↓Splanchnic arteriolar resistance** و **↑Portal blood inflow**.
          - **العمود اليمين من فوق لتحت**: **↓Systemic arteriolar resistance** ← **↓Effective arterial blood volume** ← **Activation of neurohumoral systems** (renin-angiotensin-aldosterone system (RAAS)) ← **Sodium and water retention** ← **Hyperdynamic circulatory state**.
          - من آخر صندوق تحت يمين: سهم طالع للـ **portal blood inflow** وسهم للمضاعفات.

          الجسم ==فاكر نفسه ناشف== (الـ effective volume واطي)، فيحبس ملح ومية، والدم الزيادة بيرجع يزوّد الـ inflow. علشان كده الـ ascites والنزيف طالعين من نفس الدايرة.
      - kind: order
        page: 42
        quote: "Cirrhosis:\n  ↑Resistance to portal flow (fixed and functional) → ↑ Portal pressure → Varices → Variceal hemorrhage, Ascites, Encephalopathy\n  ↑ Portal pressure → ↓Splanchnic arteriolar resistance → ↑Portal blood inflow → ↑ Portal pressure\n  ↓Splanchnic arteriolar resistance; ↓Systemic arteriolar resistance → ↓Effective arterial blood volume → Activation of neurohumoral systems (RAAS, etc) → Sodium and water retention → Hyperdynamic circulatory state\n  Hyperdynamic circulatory state → ↑Portal blood inflow; Variceal hemorrhage, Ascites, Encephalopathy"
        prompt: "رتّب السلسلة اللي بتوصّل للـ hyperdynamic circulation:"
        steps:
          - "Splanchnic and systemic arteriolar vasodilation"
          - "Decreased effective arterial blood volume"
          - "Activation of neurohumoral systems (RAAS, etc.)"
          - "Sodium and water retention"
          - "Hyperdynamic circulatory state, adding to portal inflow"
        why: "الأوعية المتوسعة بتخلّي الـ effective volume يبان قليل، فالجسم يشغّل الـ renin–angiotensin–aldosterone system (RAAS) ويحتفظ بالملح والمية، والـ volume الزيادة بيعمل hyperdynamic circulation ويزوّد الـ portal inflow. ومن هنا كمان بتطلع الـ **ascites**."
      - kind: aside
        tone: tip
        page: 41
        quote: "Portal pressure correlates well with severity of fibrosis in chronic hepatitis"
        text: |
          جملة صغيرة في الكتاب بتتسأل: portal pressure correlates well with severity of fibrosis in chronic hepatitis. كل ما التليف يزيد، الضغط يعلى، وده نفس اللي خلّى الـ liver stiffness measurement (LSM) يتنبأ بالـ clinically significant portal hypertension (CSPH) في المحاضرة اللي فاتت.
      - kind: figure
        page: 41
        quote: "Portal pressure correlates well with severity of fibrosis in chronic hepatitis"
        title: "الضغط بيعلى مع التليف في الكتاب"
        image: { file: hb/L03-whvp-fibrosis.webp, book: true }
        alt: "Book chart on a blue background: wedged hepatic venous pressure (WHVP, mmHg, 0 to 25) on the vertical axis for four groups. Normal (n=8) about 3 to 4, chronic active hepatitis (n=12) about 5 to 7, pre-cirrhosis (n=9) about 8 to 13, cirrhosis (n=8) about 10 to 21. Each group is a coloured box with a yellow line at its middle."
        caption: |
          الرسم ده أعمدة من الشمال لليمين، والمحور الرأسي هو الـ **wedged hepatic venous pressure (WHVP)** بالـ mmHg:

          - **Normal**: صندوق أصفر صغير حوالي 3–4.
          - **Chronic active hepatitis**: أعلى شوية، حوالي 5–7.
          - **Pre-cirrhosis**: برتقاني، حوالي 8–13.
          - **Cirrhosis**: أحمر كبير، من حوالي 10 لـ 21، والخط الأصفر في نصه حوالي 15.

          يعني كل ما تمشي يمين (تليف أكتر) الصندوق ==بيطلع لفوق==. وده اللي الجملة فوق بتقوله: portal pressure correlates well with severity of fibrosis.
