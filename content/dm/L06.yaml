  # ---------- p68: necrosis, amputation ----------
  - id: dm.L06.013
    kind: cloze
    topic: stages
    text: "In the necrotic foot, {{c1::wet}} necrosis goes with the neuropathic foot and {{c2::dry}} necrosis with the ischaemic foot."
