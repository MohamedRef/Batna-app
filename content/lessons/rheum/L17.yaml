      - kind: aside
        tone: exam
        page: 283
        quote: "Patient with severe disease may exhibit chronic infiltrative and fibrotic changes in the upper lung field with cavitation and fungal infection that mimic TB (Apical fibrobullous disease)."
        text: "قارن الرئتين: الـ **rheumatoid arthritis (RA)** = fibrosis في الـ **lower lobes**. الـ **ankylosing spondylitis (AS)** = ==apical== fibrobullous disease في الـ **upper** zone مع cavitation و fungal infection، يقلّد الـ tuberculosis (TB)."
      - kind: reveal
        page: 284
        quote: "Aortitis of the ascending aorta and the resulting fibrosis can cause dilatation of the aortic ring and aortic valve incompetence (AR) in 5% of patients."
        prompt: "ليه الـ AS بيعمل aortic regurgitation و heart block بالذات؟"
        answer: |
          الكتاب بيدّيك الآلية: ==aortitis== في الـ **ascending aorta** ← **fibrosis** ← الـ aortic ring يوسع ← الصمام ما يقفلش: **AR** في 5%. ونفس الـ fibrosis لو مسك الـ **bundle of His** أو الـ **AV node** يعمل conduction block.

          التفسير المقبول (مش في الكتاب): أول الـ aorta والـ aortic ring والجزء اللي فوقهم من الـ septum (اللي فيه الـ AV node) نسيج ليفي شبه الـ enthesis، فنفس الالتهاب اللي بيخف بـ fibrosis في الضهر بيعمل نفس الحكاية هنا. والكتاب بيحذّر: ممكن يبقى ==clinically silent==.
      - kind: explain
        page: 284
        title: "الكلى والعضم والأعصاب"
        quote: "Unlike other CT diseases as SLE, glomerular function is usually unimpaired in AS."
        text: |
          **الكلى**: الـ glomeruli غالبًا ==سليمة== (مش زي الـ systemic lupus erythematosus (SLE)). لو اتأثرت: **Non-steroidal anti-inflammatory drugs (NSAIDs)**، **Immunoglobulin A (IgA) nephropathy**، أو **amyloidosis**.

          **العضم**: **osteoporosis** من قلّة الحركة، وكسر من خبطة بسيطة. والغريب إن الـ AS بيعمل **new bone** (syndesmophytes) و **bone resorption** مع بعض.

          **الأعصاب**: كسر، instability، أو التهاب الـ nerve roots (radicular، **cauda equina**)، و anterior atlantoaxial subluxation في ==2%==.

          يعني لو عيان AS عنده protein في البول، دوّر على السبب برّه المرض: الـ NIA.
      - kind: reveal
        page: 284
        quote: "Osteoporosis occurs due to restricted mobility of the spine. Bone fracture can occur with trivial trauma."
        prompt: "إزاي عيان AS عنده عضم جديد (syndesmophytes) و osteoporosis في نفس الوقت؟"
        answer: |
          الكتاب: الـ **osteoporosis** سببها ==restricted mobility of the spine==، والـ AS typical إن فيه **bone formation و bone resorption مع بعض**.

          التفسير المقبول (مش في الكتاب): العضم الجديد بيطلع **برّه** الفقرة (على الحواف والأربطة)، بس **جوّه** الفقرة العضم بيرق لأن العمود اتلحم ومابيتحركش ومفيش حمل طبيعي عليه. والنتيجة عمود **ناشف وهش**: زي عصاية خشب ناشفة بتتكسر من خبطة بسيطة. علشان كده الكتاب بيقولك **fracture with trivial trauma**، وده سبب من أسباب المضاعفات العصبية.
