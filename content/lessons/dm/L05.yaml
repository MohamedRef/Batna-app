  # ------------------------------------------------------------------
  - id: dm.L05.lesson1
    title: "رجل السكري: من foot at risk لحد gangrene"
    hook: "15% من مرضى السكر هيجيلهم diabetic foot. السؤال: مين، وليه، وإزاي تكتشفه بدري؟"
    minutes: 9
    pages: [51, 53]
    topics: [definition, pathogenesis, wagner, screening]
    goals:
      - "تعرّف الـ diabetic foot وتحفظ أرقامه"
      - "تعرف الـ 3 mechanisms والـ risk factors"
      - "تحفظ Wagner من 0 لـ 5"
      - "تعرف امتى تبدأ screening للـ DPN"
    status: unverified
    steps:
      - kind: explain
        page: 51
        title: "يعني إيه diabetic foot؟"
        quote: "Diabetic foot is a spectrum of pathological entities that affect the foot of a diabetic patient as a result of its complications"
        text: |
          الـ ==diabetic foot== مش مرض واحد. هو **spectrum of pathological entities** بتصيب رجل مريض السكر نتيجة **complications** السكر نفسه.

          - بيبدأ من **foot at risk** (رجل سليمة شكلًا بس معرضة)
          - وبيوصل لـ **frank gangrene**

          ونتيجته: **morbidity** و **mortality** عالية وتكلفة اقتصادية ضخمة، علشان كده الـ management لازم يبقى **multidisciplinary**.
      - kind: table
        page: 51
        quote: "Diabetic foot affects 15% of all diabetics globally, 15– 20% may require amputation."
        title: "أرقام لازم تتحفظ"
        columns: [Fact, Number]
        rows:
          - ["Diabetics affected globally", "15%"]
          - ["Of those, may need amputation", "15–20%"]
          - ["DFU mortality in DM", "Up to 24%"]
          - ["Egypt: males", "14.1%"]
          - ["Egypt: females", "9.7%"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: joke
        page: 51
        quote: "significantly higher among the male population (14.1%) compared to the female population (9.7%)."
        text: "دراسة Assad-Khalil في مصر لقت الـ **male population** أكتر (14.1% قدام 9.7%). مش محتاجة دراسة: كام راجل تعرفه بيبص على رجله كل يوم؟ 😄"
      - kind: explain
        page: 51
        title: "3 طرق توصل للقرحة"
        quote: "a. Peripheral Neuropathy 80 – 90% b. Peripheral vascular disease 30-40%"
        text: |
          - ==Peripheral neuropathy==: موجودة في **80–90%**. الرجل مش حاسة، فالجرح بيكبر من غير ما حد ياخد باله.
          - **Peripheral vascular disease**: في **30–40%**. الدم مش واصل، فالجرح مش بيلم.
          - **Neuroischaemic**: الاتنين مع بعض.

          لاحظ إن الأرقام بتعدّي 100% لأن ناس كتير عندهم الاتنين.
      - kind: check
        page: 51
        quote: "a. Peripheral Neuropathy 80 – 90% b. Peripheral vascular disease 30-40%"
        question: "Which mechanism contributes to most diabetic foot problems?"
        options:
          - "Peripheral neuropathy"
          - "Peripheral vascular disease"
          - "Fungal infection"
          - "Venous insufficiency"
        answer: 0
        why:
          - "صح: الـ neuropathy في 80–90%."
          - "الـ PVD في 30–40% بس."
          - "الـ fungal infection بتظهر في الـ inspection بين الصوابع، مش mechanism أساسي في الكتاب."
          - "الـ venous مش من الـ 3 mechanisms في الكتاب."
      - kind: explain
        page: 52
        title: "مين معرض أكتر؟"
        quote: "The risk of ulcers or amputations is increased in people with the following risk factors"
        text: |
          الـ **risk factors** للـ ulcers والـ amputation:
          - **Poor glycemic control**
          - **Peripheral neuropathy, loss of protective sensation**
          - **Cigarette smoking**
          - **Foot deformities, preulcerative callus or corn**
          - **PAD**
          - قرحة أو بتر قبل كده: ==history of foot ulcer==, **amputation**
          - **Visual impairment** (مش شايف رجله أصلًا)
          - **DKD**، خصوصًا اللي على **dialysis**
      - kind: figure
        page: 52
        quote: "Stage 0 = Foot at risk"
        title: "سلم Wagner"
        alt: "A six-step staircase labelled Wagner 0 to 5: foot at risk, superficial ulcer, deep ulcer, deep ulcer with abscess or osteomyelitis, forefoot gangrene, hindfoot gangrene. Steps 4 and 5 are red."
        caption: "كل درجة أعمق من اللي قبلها: سطح ← عمق ← عضم وصديد ← gangrene قدام ← gangrene ورا. ==Wagner== بيحدد العلاج بعدين."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="250" width="310" height="40" rx="6" class="fg-good"/>
            <text x="20" y="275" class="t-b">0</text>
            <text x="45" y="275" class="t-sm">Foot at risk (no ulcer)</text>
            <rect x="10" y="205" width="310" height="40" rx="6" class="fg-box"/>
            <text x="20" y="230" class="t-b">1</text>
            <text x="45" y="230" class="t-sm">Superficial ulcer / blister</text>
            <rect x="10" y="160" width="310" height="40" rx="6" class="fg-box"/>
            <text x="20" y="185" class="t-b">2</text>
            <text x="45" y="185" class="t-sm">Deep ulcer</text>
            <rect x="10" y="115" width="310" height="40" rx="6" class="fg-acc"/>
            <text x="20" y="140" class="t-b">3</text>
            <text x="45" y="140" class="t-sm">Deep ulcer + abscess / osteomyelitis</text>
            <rect x="10" y="70" width="310" height="40" rx="6" class="fg-bad"/>
            <text x="20" y="95" class="t-b">4</text>
            <text x="45" y="95" class="t-sm">Forefoot gangrene</text>
            <rect x="10" y="25" width="310" height="40" rx="6" class="fg-bad"/>
            <text x="20" y="50" class="t-b">5</text>
            <text x="45" y="50" class="t-sm">Hindfoot gangrene</text>
          </svg>
      - kind: mnemonic
        page: 52
        quote: "Stage 3 =Deep ulcer with abscess, osteomyelitis"
        word: "RSDOFH"
        parts:
          - { key: "R", text: "0 = at Risk (no ulcer)" }
          - { key: "S", text: "1 = Superficial ulcer or blister" }
          - { key: "D", text: "2 = Deep ulcer" }
          - { key: "O", text: "3 = Osteomyelitis or abscess with a deep ulcer" }
          - { key: "F", text: "4 = Forefoot gangrene" }
          - { key: "H", text: "5 = Hindfoot gangrene" }
        hook: "**R**ijl **S**ukkari **D**ayman **O**'a **F**e **H**alak: «رجل سكري دايمًا أوعى فـ هلاك». سطح، عمق، عضم، قدام، ورا."
      - kind: check
        page: 52
        quote: "Stage 3 =Deep ulcer with abscess, osteomyelitis"
        question: "Deep plantar ulcer, probe to bone, osteomyelitis on X-ray, no gangrene. Wagner stage?"
        options: ["3", "2", "4", "1"]
        answer: 0
        why:
          - "صح: deep ulcer + osteomyelitis أو abscess = 3."
          - "الـ 2 deep ulcer من غير abscess أو osteomyelitis."
          - "الـ 4 لازم يبقى فيه forefoot gangrene."
          - "الـ 1 superficial بس."
      - kind: explain
        page: 52
        title: "ليه نكتشف الـ neuropathy بدري؟"
        quote: "Up to 50% of diabetic peripheral neuropathy (DPN) may be asymptomatic ."
        text: |
          - **Diabetic neuropathy** هو ==diagnosis of exclusion==: لازم تستبعد أسباب تانية.
          - فيه **numerous treatment options**.
          - لحد **50% من الـ DPN asymptomatic**: العيان مش هيشتكي، إنت اللي لازم تدور.
          - الاكتشاف والعلاج بيحسّنوا الأعراض ويقللوا الـ sequelae والـ quality of life تتحسن.
      - kind: reveal
        page: 53
        quote: "All patients should be assessed for DPN starting at diagnosis for T2DM and 5 years after diagnosis of T1DM and at least annually thereafter."
        prompt: "ليه الـ T2DM نعمله screening من يوم التشخيص، والـ T1DM نستنى 5 سنين؟"
        answer: |
          الـ **T1DM** بيبدأ فجأة وبنعرف تاريخه بالظبط، والـ neuropathy محتاجة سنين سكر عالي علشان تظهر.

          الـ **T2DM** بيبقى موجود ساكت سنين قبل ما يتشخص، فممكن الـ **DPN** تكون موجودة يوم التشخيص. (التفسير فسيولوجي؛ القاعدة من الكتاب: **T2 at diagnosis، T1 بعد 5 years، وبعدين annually**.)
      - kind: explain
        page: 53
        title: "الـ history: اسأل عن إيه؟"
        quote: "Negative (e.g., numbness, feet feel dead)"
        text: |
          **Past history:** ulceration، amputation، **Charcot joint**، vascular surgery، angioplasty، smoking.

          **Neuropathic symptoms:**
          - **Positive:** burning, shooting pain, electrical or sharp sensations
          - **Negative:** ==numbness==، «رجلي ميتة» (feet feel dead)

          **Vascular symptoms:** claudication، **rest pain**، non-healing ulcer.

          وكمان **autonomic neuropathy** تتسأل عنها في أي حد عنده microvascular complications.
      - kind: sort
        page: 53
        quote: "Negative (e.g., numbness, feet feel dead)"
        prompt: "صنّف الشكوى:"
        bins: ["Positive neuropathic", "Negative neuropathic", "Vascular"]
        cards:
          - { text: "Burning pain", bin: 0 }
          - { text: "Electric shocks", bin: 0 }
          - { text: "Numbness", bin: 1 }
          - { text: "Feet feel dead", bin: 1 }
          - { text: "Claudication", bin: 2 }
          - { text: "Rest pain", bin: 2 }
          - { text: "Non-healing ulcer", bin: 2 }
        why: "الـ positive = العصب بيطلع إشارات غلط (حرقان، كهربا). الـ negative = العصب سكت (تنميل، رجل ميتة). الـ vascular = العضلة والجلد مش واصلهم دم كفاية."
      - kind: try
        items: [dm.L05.007, dm.L05.009, dm.L05.012, dm.L05.019, dm.L05.023]
    recap:
      - "Diabetic foot = spectrum من foot at risk لحد gangrene؛ 15% من مرضى السكر، و15–20% منهم ممكن amputation."
      - "Neuropathy 80–90%، PVD 30–40%، والاتنين = neuroischaemic."
      - "Wagner: 0 at risk، 1 superficial، 2 deep، 3 abscess/osteomyelitis، 4 forefoot gangrene، 5 hindfoot."
      - "50% من الـ DPN asymptomatic. Screening: T2 من التشخيص، T1 بعد 5 سنين، وبعدين كل سنة."
    practice: [dm.L05.001, dm.L05.002, dm.L05.003, dm.L05.004, dm.L05.005, dm.L05.006, dm.L05.007, dm.L05.008, dm.L05.009, dm.L05.010, dm.L05.011, dm.L05.012, dm.L05.013, dm.L05.014, dm.L05.015, dm.L05.016, dm.L05.017, dm.L05.018, dm.L05.019, dm.L05.020, dm.L05.021, dm.L05.022, dm.L05.023, dm.L05.024]
