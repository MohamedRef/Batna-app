- id: hb.L18.153
  kind: mcq
  topic: early-treatment
  stem: A 56-year-old man with HCV cirrhosis, Child-Pugh A5, has clinically significant portal hypertension (varices)
    and a single 2.5 cm HCC. He is not a transplant candidate. What is first-line treatment per the book?
  options:
  - Surgical resection
  - RFA
  - TACE
  - Sorafenib
  - Hospice care
  answer: 1
  why:
  - Portal hypertension rules out resection in cirrhosis.
  - 'Correct: for BCLC 0-A not suitable for resection or transplant, RFA is first line (and works best <=3 cm).'
  - TACE is second line here.
  - Systemic therapy is for BCLC C.
  - He has early, treatable disease.
  src:
    page: 368
    quote: "Non-transplant candidate: 1st line – RFA 2nd line – TACE or TARE or PEI"
  status: unverified
- id: hb.L18.154
  kind: mcq
  topic: early-treatment
  stem: A 50-year-old woman with HBV cirrhosis, Child-Pugh B8, ECOG 0, has two HCC nodules of 2.8 and 2.0 cm, no
    vascular invasion. Her MELD is high. What is the best treatment?
  options:
  - Resection
  - Liver transplantation
  - TACE alone
  - Atezolizumab plus bevacizumab
  - PEI
  answer: 1
  why:
  - Child-Pugh B8 is not preserved liver function in BCLC (B up to 7 without ascites), so resection is unsafe.
  - 'Correct: she is within Milan (2-3 lesions all <=3 cm) with a high MELD; LT cures both the tumour and the cirrhosis.'
  - TACE is bridging or BCLC B therapy, not cure.
  - Systemic therapy is for advanced disease.
  - PEI is a second-line local option, not curative of the liver disease.
  src:
    page: 367
    quote: "It is an option for those patients who have a high MELD score, with HCC within Milan criteria."
  status: unverified
- id: hb.L18.155
  kind: mcq
  topic: early-treatment
  stem: Which patient is OUTSIDE the Milan criteria?
  options:
  - Single 4.8 cm HCC, no vascular invasion, PS 0
  - Three nodules of 3, 2.5 and 1 cm, PS 1
  - Two nodules of 3.5 and 2 cm, PS 0
  - Single 2 cm HCC, PS 1
  - Two nodules of 2 and 1.5 cm, PS 0
  answer: 2
  why:
  - A single lesion <=5 cm is within Milan.
  - 2-3 lesions all <=3 cm and PS <=1 is within Milan.
  - 'Correct: with 2-3 lesions, all must be <=3 cm; 3.5 cm exceeds it.'
  - 'Single small lesion, PS 1: within Milan.'
  - 'Two lesions both <=3 cm: within Milan.'
  src:
    page: 368
    quote: "Milan criteria These are a single lesion ≤5 cm or 2-3 lesions all ≤3 cm"
  status: unverified
- id: hb.L18.156
  kind: card
  topic: locoregional
  front: Which patients may benefit from TACE (early disease)?
