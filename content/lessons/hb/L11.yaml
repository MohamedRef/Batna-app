      - "**Bridging** locoregional therapy بتمسك الورم جوه الـ criteria لحد ما الـ donor يتوفر."
      - "باقي الأمراض: cholestatic (PBC، PSC)، metabolic، malignancy غير HCC، و miscellaneous."
      - "الأطفال: **EHBA = 50-60%**، وبعدها FIHC، Alagille، Budd-Chiari، AIH، ونادرًا viral."
      - "Metabolic الأطفال: **A HAT**."
