schema: batna.lesson/v1
lecture: dm.L16
lessons:
  # ------------------------------------------------------------------
  - id: dm.L16.lesson1
    title: "DKA والسكر 105؟ أيوه ممكن"
    hook: "مريض T1DM بيرجّع، والسكر طبيعي. لو بصيت على السكر بس، هتروّحه وهو في DKA."
    minutes: 9
    pages: [196, 200]
    topics: [eudka]
    goals:
      - "تقرا Case 1 رقم رقم وتعرف كل رقم بيقول إيه"
      - "تشرح ليه الصيام بيعمل كيتونات والسكر طبيعي"
      - "تعدّ أسباب الـ euglycemic ketoacidosis والـ differential وتعرف ليه كل سبب في القايمة"
    status: unverified
    steps:
      - kind: explain
        page: 196
        title: "Case 1: راجل زوّد الإنسولين ومقاسش"
        quote: "He did, however, empirically increase his insulin doses during times of illness & had increased his NPH insulin to 15 units during the 3 days prior to presentation."
        text: |
          راجل 34 سنة، **T1DM** من 19 سنة، جاي طوارئ بـ 4 أيام **nausea** و **vomiting** وأعراض زي الـ flu.

          - نظامه **basal-bolus**: 8 units **lispro** مع كل وجبة، و 12 units **NPH** بالليل.
          - ==مش بيقيس السكر== خالص، بس وهو عيّان بيزوّد الجرعة "بالإحساس"، وفعلًا رفع الـ NPH لـ ==15 units== آخر 3 أيام.

          ليه التفصيلة دي مهمة؟ عشان هي اللي هتفسّر اللغز بعدين: الراجل **عمره ما وقّف الإنسولين**، فالإنسولين اللي واخده كفاية يمسك السكر، بس مش كفاية يوقف الكيتونات وهو مش بياكل (ص 198).
      - kind: explain
        page: 197
        title: "ليه الكتاب بيعدّ حاجات مش موجودة؟"
        quote: "He denied any salicylate consumption"
        text: |
          الكتاب بيقولك إن مفيش **family history**، ولا **alcohol**، ولا تاريخ نفسي، ولا أمراض تانية، وإنه ==نفى أي salicylate==.

          الـ negatives دي مش حشو: كل واحدة بتشطب سبب من أسباب الـ **acidosis** في مريض سكر اللي هتشوفها في ص 199 (alcohol، salicylate). يعني الكتاب بيجهّزك للـ differential من أول الحكاية.

          وفيه تفصيلة صغيرة هتفرق بعدين: اعترف إنه ==خسّ في الوزن== من غير ما يعرف قد إيه. خلّيها في دماغك.
      - kind: explain
        page: 197
        title: "الفحص: الجسم بيقولك إيه؟"
        quote: "Respiratory rate =30 breaths per minute."
        text: |
          - **RR 30** والـ oxygen saturation ==99%==: بينهج والرئة سليمة. التفسير المقبول (مش في الكتاب): ده نَفَس الـ acidosis؛ الجسم بيطلّع CO2 عشان يعوّض الـ acid.
          - **HR 106** و **dry oral mucosa**: dehydration.
          - الـ BP نزل شوية وهو قاعد (131/85 ← 122/80)، وده برضه بيقول إن السوائل ناقصة.
          - **BMI 19**: نحيف، ومع الوزن اللي نزل ده بيلمّح إنه مش بياكل من زمان.
      - kind: explain
        page: 197
        title: "التحاليل: سكر طبيعي وجسم حامض"
        quote: "Plasma Glucose = 105 mg/dl"
        text: |
          - **Glucose 105** mg/dL: طبيعي.
          - **pH 7.3** و **HCO3 10**: metabolic acidosis واضحة.
          - **Anion gap 29**: الـ acid ده مش chloride، ده anion غريب (كيتونات).
          - **Urine ketones 4+** و ==no glucosuria==. التفسير المقبول (مش في الكتاب): الكلية مش بتطلّع سكر غير لما يعدّي عتبة الـ renal threshold، والسكر هنا 105 بس، فالبول فيه كيتونات من غير سكر.
          - **Lactate 1.1** طبيعي، و **amylase** طبيعي، و salicylate و alcohol و methanol ==مش موجودين==.

          النتيجة: كل الأسباب التانية للـ high anion gap اتشطبت، وفضلت الكيتونات.
      - kind: reveal
        page: 197
        quote: "Anion gap = 29 mEq/l"
        prompt: "Na 134، Cl 101، HCO3 10، K 5.7. احسب الـ anion gap. ليه الكتاب كاتب 29؟"
        answer: |
          التفسير المقبول (مش في الكتاب، الحساب نفسه): **Na − (Cl + HCO3)** = 134 − 111 = ==23==. لو دخّلت الـ K: 134 + 5.7 − 111 = ==28.7==، يعني الـ 29 اللي في الكتاب.

          أي رقم فيهم عالي، فالمعنى واحد: **high anion gap acidosis**. لو السؤال عن Case 1 بالذات، الكتاب كاتب 29.
      - kind: case
        page: 198
        quote: "Euglycemic ketoacidosis\n  1. He was treated with 0.9% saline rehydration, 10% dextrose, & intravenous insulin\n  2. His acidosis gradually improved.\n  3. Later, his HbA1C was found to be 11.5%, suggesting poor control.\n  4. Upon further assessment it was noticed that he had anhedonia, & he appeared to have no interest in his food or the management of his DM despite having insight into the complications.\n  5. He also admitted to not having eaten for nearly 2 to 3 weeks prior to his presentation."
        stem: "Case 1: a 34-year-old with T1DM for 19 years, 4 days of vomiting and flu-like illness. He raised his NPH without checking glucose."
        steps:
          - reveal: "Glucose 105 mg/dL, pH 7.3, HCO3 10, anion gap 29, urine ketones 4+, lactate normal, no toxins."
            question: "Diagnosis?"
            options: ["Euglycemic DKA", "Lactic acidosis", "Simple starvation ketosis", "Salicylate poisoning"]
            answer: 0
            why: "high anion gap + كيتونات 4+ والسكر 105: ده euglycemic diabetic ketoacidosis (DKA)."
          - question: "Treatment?"
            options: ["0.9% saline, 10% dextrose and IV insulin", "Hold insulin; glucose is normal", "Bicarbonate only", "Oral fluids"]
            answer: 0
            why: "الـ dextrose بيخلّي الإنسولين يكمّل شغله على الكيتونات من غير hypo."
          - reveal: "HbA1c 11.5%. Anhedonia, no interest in food or his diabetes; barely ate for 2-3 weeks."
            question: "Underlying cause?"
            options: ["Severe depression with prolonged poor intake", "Insulin overdose taken on purpose", "An SGLT2 inhibitor started recently", "Acute pancreatitis from gallstones"]
            answer: 0
            why: "الطب النفسي شخّص severe depression، والصيام الطويل عمل الصورة دي."
      - kind: explain
        page: 198
        quote: "During these times of decreased caloric intake, patients with DM who continue taking sufficient amounts of insulin may maintain euglycemia, but are unable to stop the ketone body formation & can present with DKA with only mild elevations of BG or even relative normoglycemia."
        title: "إزاي السكر طبيعي والكيتونات طالعة؟ (euglycemia + ketone formation)"
        text: |
          - المريض بياخد إنسولين **كفاية يمسك السكر**، بس ==مش كفاية يوقف الكيتونات==.
          - الصيام الطويل: ==glycogen depletion== شبه كامل، فالسكر مش لاقي مصدر يطلع منه.
          - في نفس الوقت الصيام بيزوّد **lipolysis** و **free fatty acids (FFA)**، والإنسولين بيبقى أضعف في إنه يوقف الـ ketogenesis.

          التفسير المقبول (مش في الكتاب) للنقطة الأخيرة: في الصيام الـ **glucagon** بيعلى والـ insulin بيقل، والكبد بيسمع للنسبة بينهم مش للإنسولين لوحده. فنفس جرعة الإنسولين اللي كانت بتوقف الكيتونات وهو بياكل، ما بقتش كفاية وهو صايم.
      - kind: figure
        page: 198
        quote: "In cases of prolonged fasting, near-total glycogen depletion contributes to the normoglycemia as metabolic acidosis continues to develop."
        title: "الصيام + الإنسولين"
        alt: "Two arrows from prolonged fasting with insulin. One path: glycogen depleted, so glucose stays near normal. Other path: lipolysis and free fatty acids rise, ketogenesis continues, so ketoacidosis develops. Both meet at euglycemic DKA."
        caption: "السكر هادي، والكيتونات شغالة في الخلفية."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L16a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="65" y="10" width="200" height="40" rx="8" class="fg-box"/>
            <text x="165" y="35" text-anchor="middle" class="t-b">Fasting + some insulin</text>
            <path d="M120 50L75 95" class="fg-arrow" marker-end="url(#L16a)"/>
            <path d="M210 50L255 95" class="fg-arrow" marker-end="url(#L16a)"/>
            <rect x="10" y="98" width="145" height="62" rx="8" class="fg-acc"/>
            <text x="82" y="122" text-anchor="middle" class="t-sm">Glycogen depleted</text>
            <text x="82" y="145" text-anchor="middle" class="t-b t-acc">Glucose ~normal</text>
            <rect x="175" y="98" width="145" height="62" rx="8" class="fg-bad"/>
            <text x="247" y="122" text-anchor="middle" class="t-sm">Lipolysis, FFA ↑</text>
            <text x="247" y="145" text-anchor="middle" class="t-b t-bad">Ketogenesis on</text>
            <path d="M82 160L150 195" class="fg-arrow" marker-end="url(#L16a)"/>
            <path d="M247 160L180 195" class="fg-arrow" marker-end="url(#L16a)"/>
            <rect x="75" y="198" width="180" height="40" rx="8" class="fg-bad"/>
            <text x="165" y="223" text-anchor="middle" class="t-b">Euglycemic DKA</text>
          </svg>
      - kind: reveal
        page: 198
        quote: "A decrease in caloric intake is frequently associated with the development of DKA, usually due to nausea or vomiting caused by a precipitating illness or by worsening ketoacidosis itself."
        prompt: "ليه قلة الأكل بتمشي إيد في إيد مع الـ DKA؟"
        answer: |
          الكتاب بيدّيك السببين: الـ **nausea** والـ **vomiting** جايين يا من ==المرض اللي فجّر الأزمة== (زي الـ flu عند Case 1)، يا من ==الـ ketoacidosis نفسها==.

          يعني دي **vicious cycle**: الكيتونات بترجّع ← المريض مش بياكل ← الصيام بيزوّد الكيتونات ← بيرجّع أكتر. عشان كده المريض اللي بيرجّع مش هيخف لوحده في البيت.
      - kind: check
        page: 198
        quote: "In cases of prolonged fasting, near-total glycogen depletion contributes to the normoglycemia as metabolic acidosis continues to develop."
        question: "In Case 1, what mainly kept glucose near 105 mg/dL despite ketoacidosis?"
        options:
          - "Ongoing insulin plus near-total glycogen depletion from weeks of not eating"
          - "Excess insulin caused true hypoglycaemia"
          - "Ketones directly lower blood glucose"
          - "Glucose was lost in the urine"
        answer: 0
        why:
          - "صح: إنسولين مستمر + مخزن glycogen فاضي = سكر هادي والكيتونات شغالة."
          - "السكر كان 105، مش hypoglycaemia."
          - "الكيتونات مش بتنزّل السكر؛ هي بديل وقود."
          - "مكانش فيه glucosuria أصلًا."
      - kind: table
        page: 199
        quote: "Causes of Euglycemic Ketoacidosis *As a result of decreased circulating glucose concentration"
        title: "أسباب الـ euglycemic ketoacidosis"
        columns: ["الآلية", "الأسباب"]
        rows:
          - ["Low circulating glucose", "Starvation، vomiting، dieting، depression، pregnancy، glycogen storage، cirrhosis"]
          - ["Endogenous H+", "Lactic acidosis، pancreatitis، sepsis، RTA"]
          - ["Exogenous H+", "Salicylate، methanol"]
        hide: [[0, 1], [2, 1]]
      - kind: explain
        page: 199
        title: "ليه كل سبب في القايمة؟"
        quote: "Causes of Euglycemic Ketoacidosis\n   *As a result of decreased circulating glucose concentration\n      1. Starvation\n      2. Vomiting (ketoacidosis, gastroparesis)\n      3. Intentional dieting\n      4. Depression, anhedonia\n      5. Pregnancy\n      6. Glycogen storage disorders\n      7. Cirrhosis"
        text: |
          الكتاب بيقسّمها نصّين. التفسير المقبول (مش في الكتاب) لكل بند:

          **سكر قليل في الدم** (الكيتونات طالعة والسكر مش لاقي يرتفع):
          - **Starvation، vomiting، dieting، depression**: ==مفيش carbohydrate داخل==. الـ depression هنا بالظبط زي Case 1: مش عايز ياكل.
          - **Pregnancy**: الجنين بيسحب glucose طول الوقت، فالأم بتوصل لصورة الصيام أسرع.
          - **Glycogen storage disorders** و **cirrhosis**: الكبد ==مش قادر يخزّن أو يطلّع== سكر.

          **H+ زيادة** (الـ acid جاي من حتة تانية مع الكيتونات):
          - **Endogenous**: الـ lactic acidosis والـ sepsis (lactate)، الـ pancreatitis، والـ **RTA** (الكلية مش بتطلّع الـ acid).
          - **Exogenous**: الـ **salicylate** والـ **methanol** نفسهم acids.
      - kind: mnemonic
        page: 199
        quote: "Differential diagnoses include: prolonged starvation, excess alcohol consumption, salicylate overdose, lactic acidosis, tricyclic antidepressant overdose, & renal tubular acidosis."
        word: "STARSL"
        hook: "الـ differential لـ acidosis في مريض سكر غير الـ DKA:"
        parts:
          - { key: "S", text: "Starvation (prolonged)" }
          - { key: "T", text: "Tricyclic antidepressant overdose" }
          - { key: "A", text: "Alcohol excess" }
          - { key: "R", text: "Renal tubular acidosis" }
          - { key: "S", text: "Salicylate overdose" }
          - { key: "L", text: "Lactic acidosis" }
      - kind: aside
        tone: joke
        page: 200
        quote: "Patients with T1DM presenting with nausea & vomiting & found to have a normal glucose may still have life-threatening ketoacidosis, & an assessment of their acid/base status is still indicated."
        text: |
          الجلوكوميتر قالك 105 وانت ارتحت؟ الجهاز ده ==مش بيقيس كيتونات==. مريض type 1 diabetes mellitus (T1DM) بيرجّع: اعمل **blood gas** حتى لو السكر بيضحكلك.
      - kind: check
        page: 200
        quote: "Patients with T1DM presenting with nausea & vomiting & found to have a normal glucose may still have life-threatening ketoacidosis, & an assessment of their acid/base status is still indicated."
        question: "A T1DM patient has 3 days of vomiting, kept full basal insulin, glucose 140 mg/dL, urine ketones 3+. Next?"
        options:
          - "Assess acid-base status (blood gas, ketones)"
          - "Reassure; glucose is normal so no DKA"
          - "Stop insulin until she can eat again"
          - "Give glucagon for the low intake"
        answer: 0
        why:
          - "صح: السكر الطبيعي مش بينفي ketoacidosis."
          - "ده بالظبط شكل الـ euglycemic DKA."
          - "وقف الإنسولين يزوّد الكيتونات."
          - "الجلوكاجون بيرفع السكر ومش بيعالج الكيتونات."
      - kind: try
        items: [dm.L16.001, dm.L16.002, dm.L16.007, dm.L16.008, dm.L16.049]
    recap:
      - "Euglycemic DKA: كيتونات و acidosis والسكر شبه طبيعي."
      - "السبب: إنسولين كفاية للسكر بس مش للكيتونات + صيام فرّغ الـ glycogen."
      - "Case 1: depression وأسابيع من غير أكل في T1DM؛ العلاج saline + 10% dextrose + IV insulin."
      - "الأسباب نصّين: سكر قليل داخل (جوع، حمل، كبد) أو H+ زيادة (lactate، RTA، salicylate، methanol)."
      - "T1DM + vomiting + سكر طبيعي = لازم blood gas."
    practice: [dm.L16.001, dm.L16.002, dm.L16.003, dm.L16.004, dm.L16.005, dm.L16.006, dm.L16.007, dm.L16.008, dm.L16.009, dm.L16.010, dm.L16.046, dm.L16.048, dm.L16.049]
