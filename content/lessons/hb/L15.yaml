      - kind: sort
        page: 286
        prompt: "سمّي الـ collection:"
        bins: ["APFC", "Pseudocyst", "Acute necrotic collection", "Walled-off necrosis"]
        cards:
          - { text: "Week 2, edematous AP, fluid, no wall", bin: 0 }
          - { text: "Week 6, edematous AP, encapsulated fluid", bin: 1 }
          - { text: "Week 2, necrotizing AP, fluid + necrotic tissue, no wall", bin: 2 }
          - { text: "Week 6, well-defined enhancing wall around necrosis", bin: 3 }
          - { text: "Non-encapsulated, involves pancreatic parenchyma", bin: 2 }
          - { text: "Encapsulated, contains fluid only", bin: 1 }
        why: "سؤالين بس: عدّى 4 أسابيع؟ (لو آه فيه جدار) و **فيه necrosis؟** (لو آه يبقى necrotic/WON). الإجابتين بيحددوا الخانة."
      - kind: aside
        tone: analogy
        page: 286
        text: |
          الجسم زي مقاول بطيء: بياخد 4 أسابيع يبني سور حوالين أي كركبة.

          قبل الـ 4 أسابيع: مية سايبة (**APFC**) أو مية بكراكيب (**ANC**). بعد ما السور يتبني: مية محاوطة (**pseudocyst**) أو كراكيب محاوطة (**WON**).
      - kind: explain
        page: 287
        title: "مضاعفات تانية"
        text: |
          جدول الكتاب في صفحة 287. الـ local كتير، فقسّمه على حسب "الحريقة طالت مين":

          **Local:**
          - **الـ collections نفسها**: peripancreatic و necrotic collections، pseudocysts، WON، و **infected necrosis**.
          - الأوعية اللي جنبه: splenic/portal vein thrombosis، و bleeding.
          - الأمعاء والمعدة: colonic necrosis، gastric outlet syndrome، bowel fistula.
          - المرارة: acute necrotizing cholecystitis.
          - البطن كلها: **abdominal compartment syndrome** (ضغط عالي من السوائل والورم يخنق الأعضاء).

          **Systemic** (الالتهاب خرج للجسم): renal، cardiovascular، respiratory dysfunction، worsening of comorbidity، و **SIRS**.
      - kind: mnemonic
        page: 287
        word: "BISAP"
        parts:
          - { key: "B", text: "BUN > 25 mg/dl" }
          - { key: "I", text: "Impaired mental status (GCS < 15)" }
          - { key: "S", text: "SIRS" }
          - { key: "A", text: "Age > 60 years" }
          - { key: "P", text: "Pleural effusion" }
        hook: |
          الاسم نفسه هو الـ mnemonic. كل حرف = نقطة.

          الكتاب: **BISAP ≥ 2** = severe AP و organ failure و mortality.
      - kind: check
        page: 288
        question: "A 66-year-old with gallstone pancreatitis: BUN 30 mg/dl, GCS 15, no SIRS, small right pleural effusion. BISAP score and meaning?"
        options:
          - "3: severe by the book (≥ 2)"
          - "2: mild"
          - "1: mild"
          - "4: severe"
        answer: 0
        why:
          - "صح: BUN > 25 (1) + age > 60 (1) + pleural effusion (1) = 3. والـ cut-off في الكتاب 2 أو أكتر."
          - "نسيت نقطة. والـ 2 عند الكتاب أصلًا severe مش mild."
          - "عدّيت نقطة واحدة بس؛ السن والـ effusion والـ BUN التلاتة موجودين."
          - "الـ GCS 15 يعني مفيش impaired mental status، ومفيش SIRS."
      - kind: mnemonic
        page: 288
        word: "GA LAW C HOBBS"
        parts:
          - { key: "G", text: "Glucose > 200 mg/dl (admission)" }
          - { key: "A", text: "Age > 55 (admission)" }
          - { key: "L", text: "LDH > 350 (admission)" }
          - { key: "A", text: "AST > 250 (admission)" }
          - { key: "W", text: "WBC > 16,000 (admission)" }
          - { key: "C", text: "Calcium < 8 (48 h)" }
          - { key: "H", text: "Hematocrit fall > 10% (48 h)" }
          - { key: "O", text: "O2: PaO2 < 60 (48 h)" }
          - { key: "B", text: "BUN increase > 5 (48 h)" }
          - { key: "B", text: "Base deficit > 4 (48 h)" }
