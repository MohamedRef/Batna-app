      - kind: explain
        page: 198
        title: "مين يتعمله screening؟"
        text: |
          أول ما مريض يتشخّص، بنعمل screening لـ:

          - الـ spouse
          - الـ brothers and sisters
          - الأولاد فوق 18 سنة

          الأخوات أهم حد، لأن عندهم ==25% chance== يورثوا الجينات المعيوبة من نفس الأب والأم. الرسمة اللي فاتت بتوضح الرقم ده.

          وليه الـ spouse؟ لو طلع carrier، الأولاد احتمالهم يزيد. ده تفسير مقبول.

          والفايدة إننا نكتشف الحديد قبل ما يعمل أذى، والعلاج وقتها سهل: phlebotomy.
      - kind: check
        page: 198
        question: "A man is newly diagnosed with hemochromatosis. Who is NOT on the book's list to check now?"
        options:
          - "His 15-year-old daughter"
          - "His wife"
          - "His older brother"
          - "His 24-year-old son"
        answer: 0
        why:
          - "صح: الكتاب قال **children over the age of 18**، والبنت 15 سنة."
          - "الـ **spouse** في القائمة."
          - "الأخوات في القائمة، وهم الأهم (25%)."
          - "ابنه فوق 18، يبقى في القائمة."
      - kind: explain
        page: 199
        title: "الـ HCC والعلاج"
        text: |
          HCC screening:

          - أي مريض عنده haemochromatosis + cirrhosis يتعمله كل 6 شهور، ==regardless of iron depletion==.
          - الـ imaging ممكن يتعمل مع AFP كل 6 شهور.

          Treatment:

          - الـ first-line للـ iron depletion: ==therapeutic phlebotomy==.
          - **Erythrocytapheresis**: personalized، والـ preferred في selected cases. الجهاز بياخد كرات الدم الحمرا بس ويرجّع الباقي، فبيشيل حديد أكتر في الجلسة.

          وزي ما شفنا في L11: الـ phlebotomy بتكمّل لحد ما المخزون يخلص، وبعدها maintenance for life حسب الـ ferritin.
      - kind: aside
        tone: trap
        page: 199
        text: |
          الـ ferritin رجع طبيعي بعد الـ phlebotomy؟ ممتاز.

          بس لو المريض cirrhotic، الـ ==HCC surveillance كل 6 شهور مكمّلة==.

          الكتاب صريح: «regardless of iron depletion». فضّيت الحديد، بس الـ cirrhosis اللي اتعملت لسه موجودة، والـ cirrhosis نفسها هي اللي بتولّد الـ HCC.
      - kind: case
        page: 199
