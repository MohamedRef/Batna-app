      - kind: explain
        page: 215
        title: "جوّه ولا برّه الـ GBM؟"
        quote: "Endocapillary hypercellularity: ‑ Increased cellularity internal to the GBM composed of leukocytes, endothelial cells and/or mesangial cells."
        text: |
          - ==Endocapillary hypercellularity==: cells زيادة **جوّه** الـ GBM (leukocytes، endothelial، mesangial).
          - **Extracapillary hypercellularity**: أكتر من طبقة cells في **Bowman's space** (parietal أو visceral epithelium، أو macrophages).
          - ==Crescent==: extracapillary hypercellularity، **ما عدا** الـ epithelial hyperplasia بتاعة الـ collapsing focal segmental glomerulosclerosis (FSGS).
          - **Fibrinoid necrosis**: تدمير cells و matrix مع fibrin-rich acidophilic material.

          ليه التفرقة دي مهمة؟ التفسير المقبول (مش في الكتاب): الـ GBM زي سور. اللي **جوّه** السور (endocapillary) معناه إن الالتهاب جاي من الدم: immune complexes تحت الـ endothelium بتنده leukocytes، زي الـ post-infectious و lupus class IV. اللي **برّه** السور (extracapillary) معناه إن السور نفسه **اتخرم**: fibrin و cells عدّوا لـ Bowman's space وعملوا crescent، وده RPGN.
          وليه الـ collapsing FSGS متشال من تعريف الـ crescent؟ لأن الـ epithelial hyperplasia هناك جاية من podocytes بتتكاثر من غير خرم ولا fibrin، فلو سميتها crescent هتدّي علاج RPGN غلط.

          وإزاي تعرف عمر الـ crescent؟ التفسير المقبول (مش في الكتاب): **cellular** = cells بس، جديد، وممكن يرجع بالعلاج. **fibrocellular** = cells و collagen، في النص. **fibrous** = collagen بس، ندبة خلاص. فلما تقرا «crescents in 6 of 21»، دوّر على النوع، لأن الـ cellular هي اللي تبرر علاج قوي سريع، والـ fibrous بتقول إن الوقت فات على الـ glomerulus ده.
