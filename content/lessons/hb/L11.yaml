  - id: hb.L11.lesson4
    title: "نعالج المرض الأصلي قبل ما ياكل الكبد الجديد"
    hook: "HBV ممكن يرجع يهجم على الـ graft من أول يوم. الحل: قفلين، واحد بالـ antiviral وواحد بالـ HBIg."
    minutes: 9
    pages: [192, 194]
    topics: [hbv, underlying]
    goals:
      - "تشرح خطة الـ antiviral للـ HBV قبل وبعد الزرع"
      - "تحفظ بروتوكول الـ HBIg بالجرعات والمدد"
      - "تعرف علاج الـ HHC و PBC و PSC و AIH قبل الزرع بالأرقام اللي في الكتاب"
    status: unverified
    steps:
      - kind: explain
        page: 192
        title: "HBV: القفل الأول، الـ antivirals"
        text: |
          - في **HBV-related cirrhosis**: نفكّر في **antiviral therapy** لو فيه **replication**، يعني **HBV DNA +ve**.
          - اللي جاي على **lamivudine**: لو الـ **HBV DNA negative** يكمّل lamivudine، ولو **HBV DNA +ve** نحوّله **entecavir 1 mg daily**.
          - الـ **nucleotide or nucleoside analogue** بيكمل **مدى الحياة**، قبل وبعد الـ LTx.
      - kind: reveal
        page: 192
        prompt: "مريض على lamivudine من سنين والـ HBV DNA طلع موجب. الدوا مش شغال ليه؟ وليه entecavir بالـ 1 mg؟"
        answer: |
          الـ DNA الموجب وهو بياخد الدوا معناه غالبًا إن الفيروس عمل **resistance** للـ lamivudine (ده منطق مقبول، الكتاب كاتب القرار بس).

          والـ **1 mg** (مش 0.5 mg) هي جرعة الـ entecavir للي جايين من lamivudine. والكتاب قال: **shift to entecavir 1mg daily**.
      - kind: update
        page: 192
        text: |
          الـ guidelines الحديثة بتفضّل **tenofovir** (TDF أو TAF) في الـ **lamivudine resistance**، لأن الـ entecavir resistance بتطلع أسهل في الحالة دي. **في الامتحان: entecavir 1 mg زي الكتاب.**
        ref: "EASL HBV guidelines 2017; AASLD HBV guidance 2018"
      - kind: figure
        page: 192
        title: "بروتوكول الـ HBIg"
        alt: "A vertical timeline of HBIg after liver transplant. Intraoperative: 4000 IU IM. Week 1: 2000 IU daily until anti-HBs above 300 to 500. Rest of month 1: 2000 IU weekly guided by anti-HBs. Months 2 to 12: monthly, to keep anti-HBs about 300 for one year. Stop if HBsAg turns negative. Nucleos(t)ide analogue continues for life alongside."
        caption: "القفل التاني: **HBIg**. 4000 في العمليات، 2000 يوميًا أول أسبوع، 2000 أسبوعيًا باقي الشهر، وبعدين شهري لحد سنة. والـ antiviral شغال جنبه طول العمر."
        svg: |
          <svg viewBox="0 0 330 420" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L11d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <text x="165" y="18" text-anchor="middle" class="t-b t-lg">HBIg after LT (book protocol)</text>
            <rect x="290" y="34" width="30" height="340" rx="6" class="fg-good"/>
            <text x="305" y="200" text-anchor="middle" class="t-sm t-b" transform="rotate(-90 305 200)">NA (entecavir) for life</text>
            <rect x="10" y="34" width="268" height="54" rx="6" class="fg-acc"/>
            <text x="20" y="54" class="t-b">Intraoperative</text>
            <text x="20" y="74" class="t-sm">4000 IU IM</text>
            <path d="M140 88v14" class="fg-arrow" marker-end="url(#L11d)"/>
            <rect x="10" y="106" width="268" height="62" rx="6" class="fg-acc"/>
            <text x="20" y="126" class="t-b">Week 1</text>
            <text x="20" y="144" class="t-sm">2000 IU daily</text>
            <text x="20" y="160" class="t-sm t-mut">until anti-HBs &gt; 300-500</text>
            <path d="M140 168v14" class="fg-arrow" marker-end="url(#L11d)"/>
            <rect x="10" y="186" width="268" height="62" rx="6" class="fg-acc"/>
            <text x="20" y="206" class="t-b">Rest of month 1</text>
            <text x="20" y="224" class="t-sm">2000 IU weekly</text>
            <text x="20" y="240" class="t-sm t-mut">according to anti-HBs level</text>
            <path d="M140 248v14" class="fg-arrow" marker-end="url(#L11d)"/>
            <rect x="10" y="266" width="268" height="62" rx="6" class="fg-acc"/>
            <text x="20" y="286" class="t-b">Then monthly, for 1 year</text>
            <text x="20" y="304" class="t-sm">to sustain anti-HBs about 300</text>
            <rect x="10" y="342" width="268" height="40" rx="6" class="fg-bad"/>
            <text x="20" y="366" class="t-sm t-b">Stop HBIg if HBsAg turned negative</text>
            <text x="165" y="408" text-anchor="middle" class="t-sm t-mut">All donors should be vaccinated</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 192
        text: |
          الكبد الجديد شقة جديدة والفيروس حرامي من الحتة القديمة.

          - الـ **antiviral** زي entecavir بيقفل **المصنع** اللي بيطلّع حرامية، يعني الـ replication.
          - الـ **HBIg** هو **البواب**: أجسام مضادة جاهزة بتمسك أي فيروس واقف على الباب قبل ما يدخل الـ graft.

          قفلين أحسن من قفل واحد، خصوصًا في السنة الأولى.
      - kind: explain
        page: 193
        title: "الـ donor والـ anti-HBc"
        text: |
          - **All donors should be vaccinated** (ضد HBV).
          - البرنامج بيقبل **HBcIgG positive donor** بشرط إن الـ **recipient كمان HBcIgG positive** ويقبل **lifelong prophylaxis**.

          ليه؟ كبد الـ donor اللي عنده anti-HBc ممكن يكون شايل فيروس كامن جواه، فالـ recipient لازم يبقى على حماية طول عمره.
      - kind: check
        page: 192
        question: "In the book's protocol, how is HBIg given during the first postoperative week?"
        options:
          - "2000 IU daily until anti-HBs exceeds 300-500"
          - "4000 IU daily for one week"
          - "2000 IU weekly"
          - "Monthly, to keep anti-HBs about 300"
        answer: 0
        why:
          - "صح: بعد الـ **4000 IU IM intraoperative**، بيبقى **2000 IU daily** أسبوع لحد ما الـ HBsAb يعدّي 300-500."
          - "الـ 4000 IU جرعة واحدة **وقت العملية** بس."
          - "الـ weekly ده لباقي **الشهر الأول**، بعد الأسبوع الأول."
          - "الـ monthly بيبدأ بعد الشهر الأول، ولحد سنة."
      - kind: explain
        page: 193
        title: "Hemochromatosis و PBC"
        text: |
          **HHC:** حسب AASLD، أي مريض عنده **iron overload** نشجعه بقوة على **regular phlebotomies** لحد ما الـ **iron stores** تخلص، وبعدين **phlebotomy for life**، والـ maintenance frequency حسب الـ **serum ferritin**.

          **PBC:** أي مريض PBC عنده **abnormal liver enzymes** يتفكّر له في **specific therapy**. الـ **UDCA**:
          - بيحسّن الـ **biochemical markers of cholestasis** بشكل واضح
          - **بيبطّأ الـ progression**
          - بس **مش بيخلّص المرض**: no resolution
          - الجرعة: **13-15 mg/kg**، single أو divided
