  # ------------------------------------------------------------------
  - id: geri.L07.lesson1
    title: "الـ CGA: الكشف اللي بيشوف العيان كله"
    hook: "العيان الكبير مش «قلب» و«كلى» و«ركبة». هو شخص واحد، وده الكشف اللي بيشوفه كده."
    minutes: 9
    pages: [106, 110]
    topics: [population, cga, indications, benefits, mdt, components]
    goals:
      - "تحفظ تقسيم الأعمار وخصائص المرض في السن الكبير"
      - "تعرّف الـ CGA وترسم الـ cycle بتاعه"
      - "تعدّ الـ indications والـ benefits والـ MDT والـ 12 component"
    status: unverified
    steps:
      - kind: table
        page: 106
        quote: "60–80: young elderly or old adults 80–100: old elderly 100–110: Centenarians"
        title: "مين العجوز؟"
        columns: [Age, Group]
        rows:
          - ["60–80", "Young elderly (old adults)"]
          - ["80–100", "Old elderly"]
          - ["100–110", "Centenarians"]
          - ["≥110", "Supercentenarians"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: joke
        page: 106
        quote: "60–80: young elderly or old adults"
        text: "يعني جدّك اللي عنده 75 سنة وبيقول «أنا لسه شباب»... طلع عنده حق: هو رسميًا **young elderly**."
      - kind: explain
        page: 107
        title: "المرض في الكبير شكله غير"
        quote: "Senescence Impaired homeostasis Atypical features Non-specific presentation Multiple pathology Multiple aetiological factors Unreported illnesses"
        text: |
          الكتاب بيعدّ 7 حاجات بتميّز المرض في السن الكبير:
          - **Senescence** و ==impaired homeostasis==: الجسم احتياطيه قليل، فأي حاجة بسيطة بتوقّعه.
          - **Atypical features** و ==non-specific presentation==: الـ pneumonia ممكن تيجي «مش على بعضه» من غير سخونية.
          - **Multiple pathology** و **multiple aetiological factors**: أكتر من مرض وأكتر من سبب في نفس الوقت.
          - **Unreported illnesses**: حاجات زي الـ incontinence والوقعات، بيستكسف يقولها أو فاكرها «من السن».
      - kind: explain
        page: 107
        title: "أهداف الـ geriatric medicine"
        quote: "Maintenance of maximum independence consistent with irreversible disease and disability."
        text: |
          1. صحة في السن الكبير: engagement عالي وتجنّب الأمراض.
          2. **Early detection** وعلاج مناسب.
          3. ==Maximum independence== على قد ما الـ disease والـ disability اللي مش هترجع يسمحوا.
          4. رعاية ودعم بإنسانية في الـ **terminal illness**.
      - kind: figure
        page: 108
        quote: "Assessment Regular planned view"
        title: "الـ CGA دايرة مش ورقة"
        alt: "A cycle of five boxes: Assessment, Creation of problem list, Personalised care plan, Intervention, Regular planned review, with an arrow back to Assessment."
        caption: "==CGA== = process of care: تقييم، problem list، خطة شخصية، تدخّل، وبعدين **regular planned review** وترجع تقيّم تاني."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="G07a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker></defs>
            <rect x="105" y="10" width="120" height="40" rx="10" class="fg-acc"/>
            <text x="165" y="35" text-anchor="middle" class="t-b">Assessment</text>
            <rect x="200" y="95" width="125" height="48" rx="10" class="fg-box"/>
            <text x="262" y="115" text-anchor="middle" class="t-sm t-b">Creation of</text>
            <text x="262" y="132" text-anchor="middle" class="t-sm t-b">problem list</text>
            <rect x="175" y="215" width="130" height="48" rx="10" class="fg-box"/>
            <text x="240" y="235" text-anchor="middle" class="t-sm t-b">Personalised</text>
            <text x="240" y="252" text-anchor="middle" class="t-sm t-b">care plan</text>
            <rect x="25" y="215" width="120" height="48" rx="10" class="fg-box"/>
            <text x="85" y="244" text-anchor="middle" class="t-sm t-b">Intervention</text>
            <rect x="5" y="95" width="125" height="48" rx="10" class="fg-good"/>
            <text x="67" y="115" text-anchor="middle" class="t-sm t-b">Regular</text>
            <text x="67" y="132" text-anchor="middle" class="t-sm t-b">planned review</text>
            <path d="M225 30 H262 V90" class="fg-arrow-acc" marker-end="url(#G07a)"/>
            <path d="M262 143 V180 H240 V210" class="fg-arrow-acc" marker-end="url(#G07a)"/>
            <path d="M175 239 H150" class="fg-arrow-acc" marker-end="url(#G07a)"/>
            <path d="M60 215 V148" class="fg-arrow-acc" marker-end="url(#G07a)"/>
            <path d="M67 95 V30 H100" class="fg-arrow-acc" stroke-dasharray="4 4" marker-end="url(#G07a)"/>
          </svg>
      - kind: explain
        page: 108
        title: "مين محتاج CGA؟"
        quote: "Elderly with frailty or one of the frailty syndromes as falls, confusion, reduced mobility and increasing incontinence"
        text: |
          1. ==Frailty== أو frailty syndrome: **falls، confusion، reduced mobility، increasing incontinence**، حتى لو السبب باين إنه reversible (دوا جديد أو infection بسيطة).
          2. **At risk of frailty**.
          3. بعد الـ **discharge**، خصوصًا لو دخل بـ frailty syndrome أو قعد كتير لسبب تافه.
          4. كل اللي في **care homes**.
          5. الـ **perioperative period**.
          6. أي حد اتحوّل لـ CGA.
      - kind: check
        page: 108
        quote: "even if these appear to be due to a reversible cause (such as a new medication or minor infection)."
        question: "82-year-old started a new sleeping pill and fell twice this month. CGA?"
        options:
          - "Yes: falls are a frailty syndrome even with a reversible cause"
          - "No: stop the pill and the problem is solved"
          - "Only if she is in a care home"
          - "Only if she needs surgery"
        answer: 0
        why:
          - "صح: الكتاب قالها صريحة: «even if these appear to be due to a reversible cause»."
          - "إيقاف الدوا مهم، بس الوقعة نفسها indication للـ CGA."
          - "الـ care home indication لوحدها، مش شرط."
          - "الـ perioperative indication تانية، مش شرط."
      - kind: explain
        page: 109
        title: "بيفرق في إيه؟"
        quote: "Comprehensive assessment and individualized care planning can reverse the progression of frailty."
        text: |
          **أقل:** admissions، length of stay، hospital complications، mortality، readmission.

          **أكتر/أحسن:** discharge للبيت بدل nursing home، discharge بحالة أحسن، diagnostic accuracy، quality of life، خطة management و rehabilitation، advance care planning، ونتايج أحسن حوالين العمليات.

          وأهم واحدة للامتحان: ==can reverse the progression of frailty==.
      - kind: mnemonic
        page: 109
        quote: "Core Members: Geriatrician Nurse Social Worker Occupational Therapist Physiotherapist"
        word: "GNSOP"
        parts:
          - { key: "G", text: "Geriatrician" }
          - { key: "N", text: "Nurse" }
          - { key: "S", text: "Social worker" }
          - { key: "O", text: "Occupational therapist" }
          - { key: "P", text: "Physiotherapist" }
        hook: "**G**ood **N**urses **S**upport **O**ld **P**eople: دول الـ ==core members==. الباقي (podiatrist، speech، dietitian، orthotist، psychogeriatrician، psychologist، volunteer) **supporting**."
      - kind: sort
        page: 110
        quote: "Supporting Members Podiatrist Speech Therapist Dietitian Prosthetic & orthotic specialist Psychogeriatrician Clinical psychologist Volunteer"
        prompt: "Core ولا supporting member؟"
        bins: ["Core", "Supporting"]
        cards:
          - { text: "Social worker", bin: 0 }
          - { text: "Occupational therapist", bin: 0 }
          - { text: "Nurse", bin: 0 }
          - { text: "Dietitian", bin: 1 }
          - { text: "Psychogeriatrician", bin: 1 }
          - { text: "Speech therapist", bin: 1 }
          - { text: "Podiatrist", bin: 1 }
        why: "الخمسة core: geriatrician، nurse، social worker، OT، physiotherapist. سؤال الكتاب جاب الـ social worker هو الإجابة وسط 4 supporting."
      - kind: explain
        page: 110
        title: "الـ 12 component"
        quote: "Components of CGA"
        text: |
          1. Ordinary clinical examination
          2. ==Functional== (ADL، IADL)
          3. Mobility
          4. Falls & fracture
          5. Cognitive
          6. Psychological
          7. Frailty
          8. Nutritional
          9. Socioeconomic & environmental
          10. Medications review
          11. Quality of life
          12. Goals of care، advance care preferences و spirituality

          باقي دروس المحاضرة ماشية على الترتيب ده بالظبط.
      - kind: try
        items: [geri.L07.001, geri.L07.008, geri.L07.011, geri.L07.022, geri.L07.025]
    recap:
      - "60–80 young elderly، 80–100 old elderly، 100–110 centenarians، ≥110 supercentenarians."
      - "المرض في الكبير: atypical، non-specific، multiple pathology، unreported."
      - "CGA = assessment ← problem list ← care plan ← intervention ← regular review."
      - "Indications: frailty syndromes حتى لو reversible، at risk، بعد الـ discharge، care homes، perioperative، referral."
      - "Core MDT: **GNSOP**. والـ CGA ممكن يعكس الـ frailty."
    practice: [geri.L07.001, geri.L07.002, geri.L07.003, geri.L07.004, geri.L07.005, geri.L07.006, geri.L07.007, geri.L07.008, geri.L07.009, geri.L07.010, geri.L07.011, geri.L07.012, geri.L07.013, geri.L07.014, geri.L07.015, geri.L07.016, geri.L07.017, geri.L07.018, geri.L07.019, geri.L07.020, geri.L07.021, geri.L07.022, geri.L07.023, geri.L07.024, geri.L07.025, geri.L07.026, geri.L07.110]
