        quote: "In single blinding, … is unaware of the status of the subject?\n  (a) Analyzer\n  (b) Observer\n  (c) Subject\n  (d) All of the above"
        prompt: "مين مش عارف الجروب في كل نوع blinding؟"
        bins: ["Single", "Double", "Triple"]
        cards:
