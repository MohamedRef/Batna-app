      - kind: explain
        page: 60
        quote: "Hyposensitization: SC injections of ever increasing amounts of purified allergen every week or month for several years."
        title: "ليه الـ hyposensitization والـ omalizumab مختلفين؟"
        text: |
          الاتنين بيشتغلوا **فوق** في السلسلة، بس كل واحد بطريقة:

          - ==Hyposensitization==: حقن SC بجرعات **بتزيد** من الـ allergen المتنقّي، كل أسبوع أو شهر، **لسنين**. التفسير المقبول (مش في الكتاب): الجرعات الصغيرة المتكررة بتعلّم المناعة تتعامل مع الـ allergen بهدوء بدل ما تعمل IgE، عشان كده بياخد سنين.
          - ==Omalizumab==: بيمسك الـ **IgE اللي في الدم** selectively، فمايلحقش يقعد على الـ FcεRI. الـ mast cell بيفضل **مش متعمّر**.

          وفي نفس الصفحة: **deviation من Th2 لـ Th1** بالـ IL-12 (افتكر محاضرة الـ cytokines: IL-12 ← Th1)، و blocking cytokines و chemokines، و vaccines و gene therapy.
      - kind: update
        page: 60
        quote: "Lipoxygenase inhibitors (leukotriene inhibitors) = zileuton, montelukast."
        text: "الكتاب حاطط الاتنين lipoxygenase inhibitors. بالظبط: zileuton هو الـ 5-lipoxygenase inhibitor، والـ montelukast بيقفل الـ leukotriene receptor (LTRA). في الامتحان: إجابة الكتاب."
