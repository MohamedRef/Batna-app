  - id: geri.L07.lesson1
    title: "الـ CGA: الكشف اللي بيشوف العيان كله"
    hook: "العيان الكبير مش «قلب» و«كلى» و«ركبة». هو شخص واحد، وده الكشف اللي بيشوفه كده."
    minutes: 8
    pages: [106, 108]
    topics: [population, cga]
    goals:
      - "تحفظ تقسيم الأعمار وتعرف ليه بنقسّم أصلًا"
      - "تشرح خصائص المرض في السن الكبير، كل واحدة بسببها"
      - "تعرّف الـ comprehensive geriatric assessment (CGA) وترسم الـ cycle بتاعه"
    status: unverified
    steps:
      - kind: table
        page: 106
        quote: "Elderly Population\n  60–80: young elderly or old adults\n  80–100: old elderly\n  100–110: Centenarians\n  ≥ 110: Supercentenarians"
        title: "مين العجوز؟"
        columns: [Age, Group]
        rows:
          - ["60–80", "Young elderly (old adults)"]
          - ["80–100", "Old elderly"]
          - ["100–110", "Centenarians"]
          - ["≥110", "Supercentenarians"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 106
        quote: "Elderly Population\n  60–80: young elderly or old adults\n  80–100: old elderly\n  100–110: Centenarians\n  ≥ 110: Supercentenarians"
        title: "ليه نقسّم الكبار أصلًا؟"
        text: |
          الكتاب بيقسّم الـ **elderly population** لأربع فئات: **60–80** young elderly (old adults)، **80–100** old elderly، **100–110** centenarians، و **≥110** supercentenarians.

          التفسير المقبول (مش في الكتاب) لفايدة التقسيم ده: الاحتياطي بتاع الجسم بيقل بالتدريج، فكل فئة ليها توقعات مختلفة:
          - الـ **young elderly** غالبًا لسه مستقلين وشغالين، فالهدف إنهم **يفضلوا** كده.
          - الـ **old elderly** هما اللي الـ frailty والـ multiple pathology بتتجمع عندهم، يعني الـ CGA بيفرق معاهم أكتر.
          - والـ **centenarians** نجوا من أمراض كتير، فبنعاملهم كفئة لوحدها.

          وده سؤال الكتاب رقم 2: الـ ==young elderly== هما **60–80**.
      - kind: aside
        tone: joke
        page: 106
        quote: "Elderly Population\n  60–80: youngelderlyoroldadults\n  80–100:oldelderly\n  100–110:Centenarians\n  ≥ 110:Supercentenarians"
        text: "يعني جدّك اللي عنده 75 سنة وبيقول «أنا لسه شباب»... طلع عنده حق: هو رسميًا **young elderly**."
      - kind: explain
        remind: [geri.L07.003]
        page: 107
        title: "المرض في الكبير شكله غير"
        quote: "Special Characteristics of Diseases in Old Age\n  Senescence\n  Impaired homeostasis\n  Atypical features\n  Non-specific presentation\n  Multiple pathology\n  Multiple aetiological factors\n  Unreported illnesses"
        text: |
          الكتاب بيعدّ 7 حاجات بتميّز المرض في السن الكبير:
          - **Senescence** و ==impaired homeostasis==: الجسم احتياطيه قليل، فأي حاجة بسيطة بتوقّعه.
          - **Atypical features** و ==non-specific presentation==: الـ pneumonia ممكن تيجي «مش على بعضه» من غير سخونية.
          - **Multiple pathology** و **multiple aetiological factors**: أكتر من مرض وأكتر من سبب في نفس الوقت.
          - **Unreported illnesses**: حاجات زي الـ incontinence والوقعات، بيستكسف يقولها أو فاكرها «من السن».

          ليه ده كله مهم؟ عشان كل خاصية بتقولك هتغلط فين:
          - لو الـ homeostasis ضعيفة، يبقى مرض بسيط (UTI) ممكن يعمل **confusion** أو وقعة.
          - لو فيه **multiple pathology**، يبقى الوقعة الواحدة ممكن يكون ليها 4 أسباب مع بعض (دوا ضغط، نظر ضعيف، ركبة، سجادة)، وعلاج واحد منهم مش هيكفي.
          - ولو المرض **unreported**، يبقى لازم إنت اللي تسأل بنفسك، وده بالظبط اللي الـ CGA بيعمله.
      - kind: reveal
        page: 107
        quote: "Special Characteristics of Diseases in Old Age\n  Senescence\n  Impaired homeostasis\n  Atypical features\n  Non-specific presentation\n  Multiple pathology\n  Multiple aetiological factors\n  Unreported illnesses"
        prompt: "راجل 84 سنة جاي بـ «مش على بعضه» من يومين، من غير سخونية ولا كحة. ليه ممكن يكون pneumonia؟"
        answer: |
          عشان الكتاب بيقول إن المرض في السن الكبير بييجي بـ **atypical features** و **non-specific presentation**، ومعاه **impaired homeostasis**.

          التفسير المقبول (مش في الكتاب): المناعة في الكبير بتطلّع سخونية أضعف، والمخ أقل عضو عنده احتياطي، فأول ما الجسم يتعب بيبان في الوعي والحركة قبل الصدر. يعني «مش على بعضه» عند الكبير عرض حقيقي، مش «دلع»، ومحتاج تدوّر على السبب.
      - kind: explain
        page: 107
        title: "أهداف الـ geriatric medicine"
        quote: "Aims of Geriatric Medicine\n  Maintenance of health in old age by high level of engagement and avoidance of diseases.\n  Early detection and appropriate treatment of diseases.\n  Maintenance of maximum independence consistent with irreversible disease and disability.\n  Sympathetic care and support during the terminal illness."
        text: |
          1. صحة في السن الكبير: engagement عالي وتجنّب الأمراض.
          2. **Early detection** وعلاج مناسب.
          3. ==Maximum independence== على قد ما الـ disease والـ disability اللي مش هترجع يسمحوا.
          4. رعاية ودعم بإنسانية في الـ **terminal illness**.

          لاحظ إن الهدف التالت مش «الشفا». الكتاب بيقول **consistent with irreversible disease and disability**، يعني لما المرض مش هيروح، الشغل يبقى إن العيان يعمل أكتر حاجة يقدر عليها بنفسه.

          ليه الـ independence بالذات؟ التفسير المقبول (مش في الكتاب): لأن الكبير بيقيس حياته بـ «بقدر أدخل الحمام لوحدي؟» أكتر من رقم التحليل، وفقدان الاستقلال هو اللي بيوديه دار رعاية.
      - kind: explain
        page: 107
        quote: "Comprehensive Geriatric Assessment (CGA) is a process of care comprising a number of steps. Initially, a multidimensional holistic assessment of an older person considers health and wellbeing and leads to the formulation of a plan to address issues which are of concern to the older person (and their family and carers when relevant). Interventions are then arranged in support of the plan. Progress is reviewed and the original plan reassessed at appropriate intervals with the interventions reconsidered accordingly."
        title: "الـ CGA عملية مش كشف"
        text: |
          تعريف الكتاب: الـ ==CGA== هو **process of care** فيه كذا خطوة:
          1. **Multidimensional holistic assessment** للصحة والـ wellbeing.
          2. **Plan** للمشاكل اللي **تهم الكبير نفسه** (وعيلته والـ carers لو ليهم دور).
          3. **Interventions** بتتعمل عشان تخدم الخطة.
          4. **Review** على فترات مناسبة، والخطة تتقيّم تاني والتدخلات تتغيّر.

          ليه holistic؟ عشان المشاكل في الكبير **ماسكة في بعض**: الاكتئاب بيقلل الأكل، والأكل القليل بيضعف العضل، والعضل الضعيف بيوقّع. يعني لو كشفت على عضو واحد هتفوّت السلسلة كلها.

          وليه review؟ التفسير المقبول (مش في الكتاب): حالة الكبير بتتغير بسرعة، والخطة اللي نفعت الشهر ده ممكن ما تنفعش بعد مرض بسيط.
      - kind: figure
        page: 108
        quote: "Assessment → Creation of problem list → Personalised care plan → Intervention → Regular planned view → Assessment"
        title: "الـ CGA دايرة مش ورقة"
        alt: "A cycle of five boxes: Assessment, Creation of problem list, Personalised care plan, Intervention, Regular planned review, with an arrow back to Assessment."
        caption: "==CGA== = process of care: تقييم، problem list، خطة شخصية، تدخّل، وبعدين **regular planned review** وترجع تقيّم تاني."
