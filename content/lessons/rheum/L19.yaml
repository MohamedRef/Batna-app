  - id: rheum.L19.lesson7
    title: "المخ والدم والـ APS"
    hook: "Coombs-positive anemia، و aPL عند 40%: النص بس بيعملوا جلطة أو إجهاض."
    minutes: 9
    pages: [319, 322]
    topics: [neuro-heme, aps]
    goals:
      - "تعرف مظاهر الأعصاب وأرقام الدم وسبب كل واحد"
      - "تحفظ الـ Sapporo criteria"
      - "تختار علاج الـ APS حسب التاريخ"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L19.069]
        page: 319
        title: "الأعصاب والدم"
        quote: "Haemolytic anemia as detected by the Coombs‘ test is the feature of SLE."
        text: |
          **Nervous system:** seizures (generalized أو focal)، peripheral neuropathy، cognitive dysfunction (disorientation، memory)، psychiatric (severe depression، **psychosis**).

          **الدم:**
          - **Normochromic normocytic** anemia شائعة (chronic inflammation، drug-related bleeding)، بس الـ ==Coombs-positive hemolytic anemia== هي الـ feature.
          - **Thrombocytopenia < 100×10⁹/L**: anti-platelet أو antiphospholipid antibodies.
          - **Leucopenia < 4.0×10⁹/L**: autoantibodies، marrow، splenic pooling، complement. والـ immunosuppressants نفسها ممكن تعملها.

          ليه الـ Coombs-positive بالذات؟ لأنه دليل مباشر إن فيه antibody على كرات الدم الحمرا، يعني المرض نفسه هو اللي بيكسّرها، مش مجرد التهاب مزمن. وده سبب إنه هو اللي في الـ haematologic criterion.
      - kind: check
        page: 319
        quote: "Haemolytic anemia as detected by the Coombs‘ test is the feature of SLE."
        question: "A woman with SLE has anemia. Which type does the book call 'the feature of SLE'?"
        options: ["Coombs-positive haemolytic anemia", "Normochromic normocytic anemia of chronic inflammation", "Iron deficiency from drugs", "Pure red cell aplasia"]
        answer: 0
        why:
          - "صح: الشائع normocytic، بس اللي «feature» ومن الـ criteria هو الـ hemolytic اللي الـ Coombs بيكشفه."
          - "دي الأشيع (frequently found) بس مش الـ feature."
          - "الـ drug-related haemorrhage سبب للـ normocytic في الكتاب، مش الـ feature."
          - "الكتاب بيقول on rare occasion بس."
      - kind: reveal
        page: 320
        quote: "It should also noted that the immunosuppressive drugs used in the treatment of SLE may cause a marked leucopenia."
        prompt: "عيانة SLE على azathioprine، الـ WBC بقى 2.5. هل ده lupus نشط؟"
        answer: |
          مش لازم. الكتاب بيدّي **أربع أسباب للـ leucopenia من المرض نفسه**: autoantibodies بتكسّر الخلايا، **decreased marrow production**، **splenic pooling**، و **complement activation**.

          وبعدين بيحذّر: ==الـ immunosuppressive drugs نفسها== ممكن تعمل **marked leucopenia**. يعني نفس الرقم ممكن يكون المرض أو العلاج، والقرار مختلف تمامًا: في الأولى ممكن تزوّد العلاج، وفي التانية تقلله. علشان كده لازم تسأل على الأدوية قبل ما تفسّر الـ CBC.
      - kind: explain
        remind: [rheum.L19.076]
        page: 320
        title: "APS جوه الـ SLE"
        quote: "40% SLE patients have Antiphospholipid Antibody.\nOnly half develop thrombosis and or miscarriages."
        text: |
          - ستات **5x**، سن **30–40**.
          - ==40%== من عيانين الـ systemic lupus erythematosus (SLE) عندهم antiphospholipid antibodies (aPL)، بس **النص بس** بيعملوا thrombosis أو miscarriage.

          **Sapporo:**
          1. **Vascular thrombosis** (arterial، venous، small vessel)
          2. **Pregnancy morbidity:** loss بعد **10 أسابيع**، أو preterm قبل **34 أسبوع**، أو **3+** abortions متتالية
          3. **Lab:** Lupus anticoagulant (LA) أو anticardiolipin antibodies (aCL) medium titre، positive **over 6 weeks**

          ليه لازم clinical + lab مع بعض؟ لأن 40% عندهم الـ antibody ونصهم بس بيتعبوا، فالـ antibody لوحده مش تشخيص. والـ 6 weeks علشان تتأكد إنه ثابت مش transient (التفسير المقبول، مش في الكتاب).
      - kind: figure
        page: 320
        quote: "APS (Sapporo classification)\n  1- Vascular thrombosis (arterial, venous, small vessels).\n  2- Pregnancy morbidity (one or more fetal losses after 10 wk, one or more premature births before 34wk (pre-eclampsia or placental insufficiency), or three or more successive spontaneous abortions."
        title: "Sapporo: clinical + lab"
        alt: "Two clinical boxes, vascular thrombosis (arterial, venous, small vessel) and pregnancy morbidity (loss after 10 weeks, premature birth before 34 weeks, 3 or more successive abortions), joined by an OR, then a plus sign to a laboratory box: lupus anticoagulant or anticardiolipin medium titre, positive over 6 weeks."
        caption: "واحدة **clinical** على الأقل (==thrombosis== أو pregnancy morbidity) + **lab** إيجابي ومتكرر. الـ antibody لوحده من غير حدث مش APS: نص الـ aPL positive بس هما اللي بيتعبوا."
        svg: |
