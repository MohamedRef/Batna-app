          - "Hypertonic saline to Na 145–155, avoid straining"
          - "ICP > 20 or CPP < 60: head 20°, PaCO2 25, mannitol"
          - "Refractory: barbiturate-induced coma"
        why: "الكتاب بيبني السلّم بالترتيب ده: ICU من stage 2، ventilation و monitor من stage 3، hypertonic saline يقلل الـ risk، و HHM لما الأرقام تعدّي الحد، و barbiturates للـ refractory."
      - kind: check
        page: 179
        question: "Ventilated ALF patient: ICP 28 mmHg, MAP 80 mmHg, creatinine normal. Best immediate measure?"
        options:
          - "Mannitol 0.5 g/kg IV over 10 minutes"
          - "Large-volume hypotonic fluid to raise MAP"
          - "IV hydrocortisone to lower mortality"
          - "Frequent endotracheal suctioning"
        answer: 0
        why:
          - "صح: ICP >20 (والـ CPP = 52 <60) والكلية سليمة = **mannitol** مع head up و hyperventilation."
          - "الـ hypotonic fluids بكميات كبيرة **بتزوّد الـ ICP**."
          - "الـ glucocorticoids **ineffective** في تقليل الـ mortality."
          - "الـ suctioning بيعمل **straining** ويرفع الـ ICP."
      - kind: explain
        page: 179
        title: "حاجات تعرفها"
        text: |
          - **Subclinical seizures** شائعة، بس فايدة الـ **prophylactic phenytoin uncertain**.
          - **Adrenal insufficiency** شائع، بس الـ **glucocorticoids** مش بتقلل الـ mortality، وممكن **تقلل الـ survival** مع **MELD عالي**، وإن كانت بتقلل احتياج الـ vasopressors.
          - **Sudden fall in ICP** = ممكن **brain herniation**.
          - **ICP أعلى من الـ MAP لفترة طويلة** = ممكن **brain death**، وده غالبًا **contraindication للزرع**.
      - kind: aside
        tone: trap
