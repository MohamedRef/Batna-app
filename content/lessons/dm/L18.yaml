      - kind: explain
        page: 243
        title: "الحصوات"
        quote: "The incidence of uric acid stones in gout patients is 20% i.e., 200 times more common than in the general population."
        text: |
          - ==20%== من مرضى الـ gout (**200 مرة** أكتر من الناس العادية)، و **50%** عند uric acid **12 mg/dl**.
          - **Pure uric acid** (مش urates)، وبتعتمد على درجة الـ **uricosuria**.
          - بتبقى **nucleus** لحصوات تانية ← **calcium oxalate** أكتر.
          - العوامل: **concentration** الـ uric acid في البول و **acidity** البول (علشان كده المية والـ alkalinizers).
          - **Radiolucent**، تبان بالـ contrast (IVP) بس.
          - ممكن تبقى **العرض الوحيد**، قبل أو بعد الـ arthritis.
