        quote: "There is no arbitrary level of blood pressure at which hypertension becomes an emergency, rather than urgency."
        prompt: "لو مفيش رقم بيفرّق الـ emergency عن الـ urgency، الـ 220/120 دي لازمتها إيه؟"
        answer: "الكتاب بيقول مفيش **arbitrary level**، و **220/120** هي الـ generally accepted limiting values. التفسير المقبول (مش في الكتاب): اللي بيحوّل الـ urgency لـ emergency هو **الـ organ damage** مش الرقم: encephalopathy، chest pain، pulmonary oedema، kidney injury. يعني مريض 200/115 بيعمل pulmonary oedema في emergency، ومريض 225/125 مفيش عنده حاجة ممكن يكون urgency. الرقم بس إنذار يخلّيك تدوّر."
      - kind: explain
        page: 133
        quote: "Sustained or paroxysmal hypertension is the most common sign; however, around 10% may have normal blood pressure.\nProfound sweating.\nMarked tachycardia.\nPallor.\nNumbness.\nTingling.\nCold hands and feet."
        title: "الصورة"
        text: |
          الـ paroxysm من دقايق لساعات، ممكن كذا مرة في اليوم أو مرة في الشهر.

          - **Triad**: episodic headache، sweating، tachycardia.
          - ==Hypertension== sustained أو paroxysmal هي أشيع علامة، بس **10%** ضغطهم طبيعي.
          - Pallor، numbness، tingling، أطراف ساقعة.
          - الـ triad مع hypertension: **specificity 93.8%**، **sensitivity 90.9%**.

          التفسير المقبول (مش في الكتاب): الـ pallor والأطراف الساقعة لأن الـ α بيقفل الأوعية الطرفية، والـ tachycardia والعرق من الـ β والـ sympathetic. والإفراز بيبقى على دفعات، فبين النوبات الضغط ممكن يبان طبيعي، وده يفسّر جزء من الـ 10% اللي ضغطهم طبيعي.
