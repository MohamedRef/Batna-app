          ليه الأعراض بتتأخر؟ عشان البلورات بتاخد **شهور لسنين** لحد ما توصل لحجم يتحسّ. يعني لما المريض يجيلك بأول نوبة، البلورات كانت بتتراكم من زمان. وده سبب إن الـ ULT بياخد وقت طويل يدوّبها.
