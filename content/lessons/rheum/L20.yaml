  - id: rheum.L20.lesson8
    title: "الاستراتيجية: من الـ NSAID للـ biologic التالت"
    hook: "Erosions؟ TNF من الأول. مفيش؟ MTX. فشل TNF؟ جرّب TNF تاني قبل ما تغيّر."
    minutes: 9
    pages: [340, 342]
    topics: [treatment]
    goals:
      - "تطبّق treat-to-target والـ non-drug measures وتعرف ليه"
      - "تمشي على سلّم الـ peripheral arthritis"
      - "تعرف ترتيب الـ biologics بعد فشل أول TNF"
    status: unverified
    steps:
      - kind: explain
        page: 340
        title: "الاستراتيجية"
        quote: "A treat-to–target approach should be employed for peripheral and axial arthritis, with a target of remission/inactive disease or low/minimal disease activity."
        text: |
          - ابدأ **بدري**، وحسب الشدة في كل domain.
          - ==Treat-to-target==: remission أو low/minimal activity.
          - قبل الدوا: **screening** للـ comorbidities، baseline tests، و **vaccinations**.
          - **Non-drug:** physical therapy (PT)، occupational therapy (OT)، exercise، و **weight reduction** (السمنة بتقلل الاستجابة).
          - **Education:** المرض، أثر الـ **stress**، الأدوية والمتابعة.

          ليه treat-to-target؟ لأن 47% بيحصلهم damage في أول سنتين، فالهدف لازم يبقى واضح (remission أو low/minimal activity) وتغيّر العلاج لو ماوصلتش.
      - kind: reveal
        page: 340
        quote: "Weight reduction – Obesity and metabolic syndrome are common comorbidities in PsA and may lessen treatment response to treatment."
        prompt: "ليه الكتاب بيحط الـ weight reduction والـ screening والـ vaccinations جنب الأدوية؟"
        answer: |
          - **Weight reduction:** الكتاب بيقول إن الـ obesity والـ metabolic syndrome ==بيقللوا الاستجابة للعلاج==. يعني نفس الـ biologic هيشتغل أقل في عيان وزنه زايد، والوزن نفسه comorbidity شائعة في الـ PsA.
          - **Screening + vaccinations قبل الدوا:** لأن الأدوية دي immunosuppressive، فلازم تعرف الـ comorbidities (القلب والكبد) وتحصّن العيان **قبل** ما المناعة تقل.
          - **الـ liver disease** بالذات مهم مع الـ MTX (التفسير المقبول، مش في الكتاب).
      - kind: figure
        page: 341
        quote: "In patients presenting with severe disease (erosive disease and functional limitation), start a TNFinhibitor as first-line therapy, to limit joint damage and more rapidly restore function."
        title: "Peripheral PsA: السلّم"
        alt: "Flowchart for peripheral psoriatic arthritis. Mild, under four joints, no damage: NSAID, or apremilast 30 mg twice daily. Moderate to severe without erosions, or NSAID failure, no axial symptoms: methotrexate 15 to 25 mg weekly; alternatives leflunomide, sulfasalazine, apremilast if not erosive. Severe, erosive with functional limitation: TNF inhibitor first line, or secukinumab or ustekinumab. After 3 months of a cDMARD without improvement or more than three tender and swollen joints: TNF inhibitor."
        caption: "السؤال اللي بيحدد: ==فيه erosions و functional limitation؟== لو آه ← TNF من الأول. لو لأ ← methotrexate (MTX) الأول."
        svg: |
          <svg viewBox="0 0 330 420" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L20b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
