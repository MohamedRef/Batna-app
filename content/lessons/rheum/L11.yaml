  # Split from lesson1 on 2026-11-13 (#828): the clinical clues.
  - id: rheum.L11.lesson5
    title: "الميكروب بيشاور على الذراع"
    hook: "طفل كل شهر بالتهاب جديد: الميكروب نفسه وسن الطفل ومكان الالتهاب هيقولولك أنهي سلاح في الجيش مكسور."
    minutes: 9
    pages: [182, 184]
    topics: [clues]
    goals:
      - "تربط نوع الميكروب بالذراع الواقع وتعرف ليه"
      - "تعرف ليه B بيبان متأخر و T بيبان بدري"
      - "تفرق بين immunodeficiency وسبب تشريحي أو cystic fibrosis"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L11.009]
        page: 182
        title: "شكل الطفل اللي مناعته واقعة"
        quote: "History of chronic or recurrent infections.\nPrimary immune deficiencies occur mainly in children.\nInfections tend to be progressive and unremitting. Bacterial infections may respond poorly to appropriate antibiotics.\nUnusual opportunistic infections may occur. Because they are chronically infected, these children tend to be small for their age (\"failure to thrive\"). Finally, some of these children may have congenital abnormalities involving other organ systems."
        text: |
          الكتاب بيرسم الصورة كده:
          - **Chronic or recurrent infections**، و ==mainly in children==
          - الـ infections **progressive and unremitting**، والبكتيريا ممكن ما تردّش على المضاد الحيوي المناسب
          - **Unusual opportunistic infections**
          - صغير على سنه: ==failure to thrive==، والكتاب بيقول السبب: لأنه **chronically infected**
          - أحيانًا **congenital abnormalities** في أعضاء تانية

          ليه المضاد الحيوي بيفشل؟ التفسير المقبول (مش في الكتاب): المضاد بيوقف البكتيريا، لكن اللي بيخلّص عليها فعلًا هو المناعة. لو المناعة مش موجودة، البكتيريا بترجع أول ما توقف الكورس.
      - kind: figure
        page: 182
        quote: "Opportunistic infections (viruses, protozoa, fungi) suggest a defect in the T cell arm of the immune response"
        title: "الميكروب بيشاور على الذراع"
        alt: "Two columns. Left: opportunistic organisms (viruses, protozoa, fungi such as Candida and Pneumocystis) with an arrow to the T cell arm. Right: encapsulated pyogenic bacteria (pneumococci, meningococci, H. influenzae, group A streptococci) with arrows to B cells (antibody), phagocytes and complement."
        caption: "==Opportunistic== (فيروس، protozoa، fungi) ← **T cell**. ==Encapsulated pyogenic== bacteria ← **B cell** أو phagocytes أو complement."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L11o" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="fg-head"/></marker></defs>
            <rect x="10" y="10" width="145" height="90" rx="10" class="fg-acc"/>
            <text x="82" y="34" text-anchor="middle" class="t-sm t-b">Opportunistic</text>
            <text x="82" y="54" text-anchor="middle" class="t-sm">viruses, protozoa</text>
            <text x="82" y="72" text-anchor="middle" class="t-sm">fungi (Candida,</text>
            <text x="82" y="90" text-anchor="middle" class="t-sm">Pneumocystis)</text>
            <rect x="175" y="10" width="145" height="90" rx="10" class="fg-bad"/>
            <text x="247" y="34" text-anchor="middle" class="t-sm t-b">Encapsulated</text>
            <text x="247" y="54" text-anchor="middle" class="t-sm">pneumococci</text>
            <text x="247" y="72" text-anchor="middle" class="t-sm">meningococci, Hib</text>
            <text x="247" y="90" text-anchor="middle" class="t-sm">group A strep</text>
            <path d="M82 100 L82 165" class="fg-arrow" marker-end="url(#L11o)"/>
            <path d="M190 100 L190 248" class="fg-thin"/>
            <path d="M190 132 L202 132" class="fg-arrow" marker-end="url(#L11o)"/>
            <path d="M190 182 L202 182" class="fg-arrow" marker-end="url(#L11o)"/>
            <path d="M190 232 L202 232" class="fg-arrow" marker-end="url(#L11o)"/>
            <rect x="22" y="172" width="120" height="40" rx="8" class="fg-box"/>
            <text x="82" y="197" text-anchor="middle" class="t-sm t-b">T cell arm</text>
            <rect x="207" y="114" width="115" height="36" rx="8" class="fg-box"/>
            <text x="264" y="137" text-anchor="middle" class="t-sm t-b">B cell (antibody)</text>
            <rect x="207" y="164" width="115" height="36" rx="8" class="fg-thin"/>
            <text x="264" y="187" text-anchor="middle" class="t-sm">Phagocytes</text>
            <rect x="207" y="214" width="115" height="36" rx="8" class="fg-thin"/>
            <text x="264" y="237" text-anchor="middle" class="t-sm">Complement</text>
            <text x="82" y="232" text-anchor="middle" class="t-sm t-mut">present at 3–6 months</text>
            <text x="165" y="285" text-anchor="middle" class="t-sm t-mut">B defects present late in year 1 (maternal IgG)</text>
          </svg>
      - kind: reveal
        page: 183
        quote: "Whereas infections caused by encapsulated, pyogenic bacteria (pneumococci, meningococci, H. influenzae, group A streptococci) suggest an antibody defect (B cell deficiency) or impairment of nonspecific defense mechanisms which amplify the immune response (disorders of phagocytic cells or complement deficiencies."
        prompt: "ليه البكتيريا اللي ليها capsule بالذات بتدلّ على antibody أو complement أو phagocytes، والفيروس والفطر بيدلّوا على T؟"
        answer: |
          الكتاب بيدّي الربط، والسبب مش مكتوب. التفسير المقبول (مش في الكتاب):

          الـ ==capsule== زي جاكت ناعم الـ phagocyte مش عارف يمسكه. علشان ياكله لازم البكتيريا تتغلّف الأول بـ **antibody** و **complement** (opsonisation). فأي حلقة من التلاتة تقع، البكتيريا دي تعدّي.

          أما الفيروسات والفطريات والـ protozoa فبتعيش ==جوه الخلايا== أو على الأغشية، والـ antibody مش بيوصلها هناك. اللي بيقتل الخلية المصابة أو بيشغّل الـ macrophage هو الـ **T cell**.
      - kind: explain
        page: 183
        title: "أورام وتطعيمات"
        quote: "Opportunistic neoplasms, especially malignant lymphomas, are observed in several immunodeficiency disorders, often but not always late in the course of the disease. The increased frequency of malignant lymphoma, Kaposi's sarcoma, and other aggressive skin cancers in AIDS patients is an example of this susceptibility."
        text: |
          - **Opportunistic neoplasms**، خصوصًا ==malignant lymphomas==، غالبًا متأخر في المرض. والمثال في الكتاب: lymphoma و **Kaposi's sarcoma** و skin cancers عدوانية في الـ AIDS
          - **Live virus vaccines** ممكن تبقى ==disastrous== في نقص الـ T cell، ومثال الكتاب: **post-vaccination poliomyelitis**

          ليه الأورام؟ التفسير المقبول (مش في الكتاب): المناعة بتراقب الخلايا وبتقتل اللي بيتحول منها، وكمان بتمسك فيروسات بتعمل أورام (زي EBV مع الـ lymphoma). لما المراقبة تقع، الخلية الغلط تعيش وتكبر.
      - kind: reveal
        page: 183
        quote: "Since maternal IgG crosses the placenta, infants with B cell defects tend to present late in the first year of life. Conversely, patients with T cell defects present early in life, usually in the first 3-6 months after birth."
        prompt: "ليه طفل الـ B cell defect بيبان متأخر (آخر السنة الأولى) وطفل الـ T cell بيبان في أول 3–6 شهور؟"
        answer: |
          لأن ==maternal IgG== بيعدي الـ placenta ويحمي الطفل شهور لحد ما يخلص، فالـ **B cell defect** مستخبي. أما الـ **T cell** فمفيش حاجة من الأم بتعوضه، فالـ infections بتبدأ ==early in life==، غالبًا **first 3-6 months**.
      - kind: check
        page: 182
        quote: "Opportunistic infections (viruses, protozoa, fungi) suggest a defect in the T cell arm of the immune response"
        question: "A 4-month-old boy has persistent oral thrush, Pneumocystis pneumonia and chronic diarrhoea. No tonsils are seen. Which arm is most likely defective?"
        options:
          - "T-cell immunity"
          - "B-cell antibody production alone"
          - "Complement"
          - "Phagocyte killing"
        answer: 0
        why:
          - "صح: فطر و Pneumocystis (opportunistic)، وسن 4 شهور (T بيبان في 3–6 شهور)، ومفيش لوز (T defect مفيهوش lymphoid tissue، ص 184)."
          - "الـ B لوحده بيبان آخر السنة الأولى بسبب IgG الأم، وببكتيريا ليها capsule."
          - "الـ complement بيعمل encapsulated pyogenic infections، مش Pneumocystis."
          - "الـ phagocytes برضه pyogenic bacteria في الكتاب، مش opportunistic مع لوز غايبة."
      - kind: explain
        page: 183
        title: "مش كل infection متكررة = مناعة"
        quote: "Non-immune abnormalities must also be considered in the differential diagnosis of children with recurrent infections.\nFor example, anatomical abnormalities should be suspected if the infections occur repeatedly in one specific anatomic site (e.g. pneumonia in the right middle lobe of the lung)."
        text: |
          الكتاب بيقول فكّر في **non-immune abnormalities** الأول:
          - **Anatomical**: لو الـ infection بتتكرر في ==نفس المكان== (مثال الكتاب: pneumonia في الـ right middle lobe)
          - **Cystic fibrosis**: عيب في نقل الـ chloride ← mucus تقيل لزج يسد الشعب الصغيرة ← pneumonia. والكتاب بيقول إنه سبب **fairly common** للـ recurrent pneumonia في الأطفال
          - أما نقص المناعة فالـ infections ==generalized== في organ systems كتير

          ليه المكان الواحد بيبعد عن المناعة؟ التفسير المقبول (مش في الكتاب): المناعة الواقعة واقعة في الجسم كله، فمش هتختار فص واحد. الفص الواحد معناه حاجة محلية: انسداد، جسم غريب، أو عيب خلقي بيحبس الإفرازات.
      - kind: check
        page: 183
        quote: "For example, anatomical abnormalities should be suspected if the infections occur repeatedly in one specific anatomic site (e.g. pneumonia in the right middle lobe of the lung). Another example is, cystic fibrosis, a common genetic defect of chloride ion transport. The transport defect results in the formation of thick, tenacious mucus, which obstructs small bronchi in the lungs and promotes the development of pneumonia. This disease is a fairly common cause of recurrent pneumonia in children."
        question: "A child has had four pneumonias, all in the right middle lobe. What should you suspect first?"
        options:
          - "An anatomical abnormality in that site"
          - "Severe combined immunodeficiency"
          - "Complement deficiency"
          - "DiGeorge syndrome"
        answer: 0
        why:
          - "صح: نفس المكان كل مرة = anatomical abnormality. الـ immunodeficiency بتعمل infections generalized في organ systems كتير."
          - "الـ SCID بيعمل opportunistic infections وفشل نمو، مش فص واحد."
          - "الـ complement بيعمل encapsulated infections في أماكن مختلفة (زي Neisseria)."
          - "الـ DiGeorge = T cell، يعني opportunistic infections بدري."
      - kind: aside
        tone: trap
        page: 184
        quote: "In children with recurrent pneumonia a sweat chloride test for cystic fibrosis is indicated prior to further laboratory evaluation, since this disorder is relatively common."
        text: |
          قبل ما تطلب immunology panel لطفل عنده **recurrent pneumonia**: اعمل ==sweat chloride test== للـ **cystic fibrosis** الأول. الكتاب صريح: **prior to further laboratory evaluation**، والسبب اللي بيقوله: لأنه **relatively common**.
      - kind: aside
        tone: analogy
        page: 184
        quote: "Patients with T cell defects will often lack identifiable lymphoid tissue such as lymph nodes, tonsils, and adenoids even at sites draining active infections. Similarly, chest X-rays may reveal the lack of a thymus shadow."
        text: |
          الـ **T cell defect** زي معسكر فاضي: حتى والحرب شغالة جنبه، مفيش ==lymph nodes ولا tonsils== تتنفخ. ومعاه **thymus shadow** غايب في الـ chest X-ray.

          والعكس الغريب: بعض الـ **B cell** abnormalities (فشل التحول لـ plasma cells) بتعمل ==lymphoid hyperplasia== واضحة. التفسير المقبول (مش في الكتاب): الخلايا بتتكاثر بس مش قادرة تكمّل لآخر مرحلة، فبتتكوّم في الغدد والـ gut بدل ما تتحول لمصانع antibodies.
