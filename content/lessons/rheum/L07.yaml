  - id: rheum.L07.lesson2
    title: "الـ classical pathway: C1 بيصحى"
    hook: "C1q شكله زي بوكيه ورد بست رؤوس، ولما يمسك antibody الدومينو يبدأ."
    minutes: 7
    pages: [108, 110]
    topics: [classical]
    goals:
      - "تعرف إزاي الـ classical pathway بيبدأ"
      - "تحفظ وظيفة كل protein في جدول p110"
      - "توصل للـ C3 convertase"
    status: unverified
    steps:
      - kind: explain
        page: 109
        title: "البداية"
        quote: "The classical pathway is initiated primarily by the binding of C1q to"
        text: |
          الـ ==C1q== بيبدأ الطريق بطريقتين:
          - يمسك **antigen–antibody complexes**، وده جزء من الـ **adaptive** response.
          - أو يمسك **سطح الميكروب مباشرة**، وده **innate**.

          علشان كده الـ classical pathway **حلقة وصل** بين الـ innate والـ adaptive.
      - kind: explain
        page: 108
        title: "الـ C1 complex"
        quote: "C1q is composed of six identical subunits with globular heads and long collagen-like tails."
        text: |
          الـ **C1** = **C1q + C1r + C1s**.

          - الـ **C1q** فيه **6 subunits** متشابهة، ليها **globular heads** و **collagen-like tails**.
          - الديول بتمسك **2 C1r و 2 C1s**.
          - لما الرؤوس تمسك الـ Ig أو الميكروب ← **C1r** يتغيّر شكله ويقطع ويشغّل ==C1s==، اللي اسمه كمان C1 esterase.
      - kind: aside
        tone: analogy
        page: 108
        quote: "then cleaves and activates the C1s zymogen (C1estrase)."
        text: |
          تخيّل **C1q** بوكيه ورد بست وردات. وردة واحدة لو لمست antibody مش كفاية؛ لازم **أكتر من راس** يمسكوا علشان الساق تتلوي وتصحّي **C1r**، و C1r يصحّي **C1s**.
      - kind: table
        page: 110
        quote: "Proteins of the classical pathway of complement activation"
        title: "Proteins of the classical pathway"
        columns: [Fragment, Job]
        rows:
          - ["C1q", "Binds antibody or pathogen"]
          - ["C1r", "Cleaves C1s"]
          - ["C1s", "Cleaves C4 and C2"]
          - ["C4b", "Opsonizes; holds C2 for C1s"]
          - ["C2b", "Enzyme of the C3/C5 convertase"]
          - ["C2a", "Precursor of C2 kinin"]
          - ["C3b", "Opsonin; AP amplification; holds C5"]
          - ["C4a, C3a", "Weak and intermediate inflammation"]
        hide: [[1, 1], [2, 1], [3, 1], [4, 1], [6, 1]]
      - kind: order
        page: 110
        quote: "Cleaves C4 and C2"
        prompt: "رتّب الـ classical pathway لحد الـ C3 convertase:"
        steps:
          - "C1q binds the antigen–antibody complex"
          - "C1r activates C1s"
          - "C1s cleaves C4; C4b sticks to the surface"
          - "C2 joins C4b and C1s cleaves it"
          - "C4b2b is ready to cleave C3"
        why: "**C1 ← C4 ← C2 ← C3**. ده سبب إن C4 بيشتغل قبل C2 رغم الرقم: الأرقام بترتيب الاكتشاف."
      - kind: update
        page: 110
        quote: "Active enzyme of classical pathway C3/C5 convertase"
        text: "جدول الكتاب في p110 بيسمّي الحتة الكبيرة **C2b** والـ convertase ==C4b2b==، وده الاسم الحالي. الكتب القديمة وشكل p116 بيقولوا **C4b2a** لنفس الإنزيم. الاتنين صح حسب الكتاب اللي بتقرا منه."
        ref: "Bohlson et al., Complement nomenclature: deconvoluted, Front Immunol 2019"
      - kind: check
        page: 110
        quote: "Cleaves C4 and C2"
        question: "Which C1 subcomponent cleaves C4 and C2?"
        options: ["C1s", "C1q", "C1r", "C4b"]
        answer: 0
        why:
          - "صح: الـ C1s، أو C1 esterase، هو اللي بيقطع C4 و C2."
          - "C1q بيمسك بس."
          - "C1r بيشغّل C1s."
          - "C4b بيمسك C2 علشان C1s يقطعه."
      - kind: try
        items: [rheum.L07.015, rheum.L07.016, rheum.L07.018, rheum.L07.019]
    recap:
      - "C1q بيمسك antigen–antibody أو سطح الميكروب: حلقة وصل innate و adaptive."
      - "C1 = C1q + 2 C1r + 2 C1s. C1r يشغّل C1s، و C1s يقطع C4 و C2."
      - "C4b2b = C3 convertase. ومعاه C3b = C5 convertase."
    practice: [rheum.L07.015, rheum.L07.016, rheum.L07.017, rheum.L07.018, rheum.L07.019, rheum.L07.020]
  # ------------------------------------------------------------------
  - id: rheum.L07.lesson3
    title: "الـ alternative والـ lectin: من غير antibody"
    hook: "الـ C3 بيتكسر لوحده طول الوقت. خلاياك عندها فرامل، والميكروب لأ."
    minutes: 9
    pages: [111, 115]
    topics: [alternative, lectin]
    goals:
      - "تشرح ليه الـ AP بيشتغل على الميكروب ومش على خلاياك"
      - "تحفظ factor B و D و properdin و H و I"
      - "تقارن الـ lectin pathway بالـ classical"
    status: unverified
    steps:
      - kind: explain
        page: 111
        title: "الـ alternative pathway"
        quote: "response and it does not require an Ab for activation (Ab independent mech)."
        text: |
          اسمه **alternative** لأنه **اتكشف تاني** مش لأنه احتياطي.

          - بيبدأ لما **C3b** يمسك في سطح الميكروب، زي الـ **lipopolysaccharides** و **endotoxins**.
          - **innate** و ==Ab independent==: مش محتاج antibody.
          - أول C3b جاي من **spontaneous hydrolysis** للـ C3.
      - kind: figure
        page: 112
        quote: "the deposited C3b,then is cleaved by active factor D, into Ba & Bb. C3bBb is"
        title: "الـ amplification loop"
        alt: "A circular loop. C3b on a surface binds factor B. Factor D cuts factor B into Ba, released, and Bb, which stays. C3bBb, stabilised by properdin, is the C3 convertase. It cuts more C3 into C3a, released, and C3b, which deposits and feeds back into the loop."
        caption: "كل C3b بيعمل convertase بيعمل C3b أكتر. ده ==feedback loop== بيضاعف أي C3b، حتى لو جه من الـ classical أو الـ lectin."
        svg: |
          <svg viewBox="0 0 330 320" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L07b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fg-head-acc"/></marker></defs>
            <rect x="115" y="10" width="100" height="44" rx="10" class="fg-acc"/>
            <text x="165" y="37" text-anchor="middle" class="t-b">C3b</text>
            <path d="M215 40 C270 50 285 90 270 120" class="fg-arrow-acc" stroke-width="2" marker-end="url(#L07b)"/>
            <text x="240" y="75" class="t-sm">+ factor B</text>
            <rect x="215" y="125" width="110" height="60" rx="10" class="fg-box"/>
            <text x="270" y="148" text-anchor="middle" class="t-sm">factor D cuts B</text>
            <text x="270" y="168" text-anchor="middle" class="t-sm t-mut">Ba released</text>
            <path d="M260 185 C250 230 220 255 200 260" class="fg-arrow-acc" stroke-width="2" marker-end="url(#L07b)"/>
            <rect x="85" y="240" width="115" height="62" rx="10" class="fg-bad"/>
            <text x="142" y="265" text-anchor="middle" class="t-b">C3bBb(P)</text>
            <text x="142" y="287" text-anchor="middle" class="t-sm">C3 convertase</text>
            <path d="M85 265 C30 250 20 170 40 140" class="fg-arrow-acc" stroke-width="2" marker-end="url(#L07b)"/>
            <rect x="5" y="95" width="100" height="45" rx="10" class="fg-box"/>
            <text x="55" y="114" text-anchor="middle" class="t-sm">cuts C3</text>
            <text x="55" y="131" text-anchor="middle" class="t-sm t-mut">C3a away</text>
            <path d="M75 95 C90 65 100 45 113 38" class="fg-arrow-acc" stroke-width="2" marker-end="url(#L07b)"/>
            <text x="165" y="150" text-anchor="middle" class="t-sm t-mut">properdin (P)</text>
            <text x="165" y="166" text-anchor="middle" class="t-sm t-mut">stabilises</text>
          </svg>
      - kind: explain
        page: 112
        title: "اللاعيبة"
        quote: "In AP factor B is structurally & functionally homologous to C2."
        text: |
          - ==Factor B==: شبه **C2**، بيمسك في الـ C3b.
          - **Factor D**: بيقطع factor B لـ **Ba** و **Bb**.
          - **C3bBb**: الـ **AP C3 convertase**.
          - **Properdin (P)**: بيثبّته، فيبقى **C3bBbP** يقطع C3 لـ C3a و C3b، والـ C3b يكمّل الـ loop.
      - kind: explain
        page: 113
        title: "الفرامل: خلاياك ولا الميكروب؟"
        quote: "On host cells, the complement-regulatory proteins CR1, H, MCP, and DAF bind to C3b."
        text: |
          C3b بيقع على كل حاجة، بس:
          - **على خلاياك**: فيه ==CR1 و H و MCP و DAF== بيمسكوا الـ C3b ويزيحوا الـ Bb، و **factor I** يقطع الـ C3b لـ **iC3b** الخامل. مفيش activation.
          - **على الميكروب**: مفيش الـ regulators دول، فالـ **properdin** يثبّت الـ C3bBb، ويترسّب C3b كتير ← opsonization و MAC.
      - kind: aside
        tone: joke
        page: 111
        quote: "these regulators, the system fires to exhaustion, as in inherited deficiency of"
        text: |
          الـ AP زي **ولّاعة شغّالة طول الوقت**. خلاياك لابسة بدلة ضد الحريق (DAF و MCP و CR1)، والميكروب داخل بالبيجامة.

          ولو **factor H أو I** ناقصين وراثيًا؟ الولّاعة تفضل شغالة لحد ما ==يخلص الـ C3== كله: **fires to exhaustion**.
      - kind: match
        page: 113
        quote: "Factor B binds noncovalently to C3b on a cell surface and is cleaved to Bb by factor D"
        prompt: "وصّل كل factor بشغلته:"
        pairs:
          - ["Factor B", "Binds C3b; like C2"]
          - ["Factor D", "Cuts factor B into Ba and Bb"]
          - ["Properdin", "Stabilises C3bBb on pathogens"]
          - ["Factor I", "Cuts C3b to inactive iC3b on host cells"]
          - ["Factor H", "Fluid-phase regulator; displaces Bb"]
        why: "B و D و P بيبنوا الـ convertase، و H و I بيهدّوه على خلاياك."
      - kind: explain
        page: 114
        title: "الـ lectin pathway"
        quote: "MBL is a hepatocyte synthesized serum protein that prfrentially binds to repeating mannoses of the pathogen."
        text: |
          - الـ **lectins** = carbohydrate-binding proteins.
          - الـ ==MBL== بيتعمل في الـ liver، وبيمسك **repeating mannoses** على سطح الميكروب.
          - **MBL شبه C1q**، ولما يمسك السكر بينشّط **MASP-1 و MASP-2**.
          - **MASP-2** بيقطع **C4 و C2**، فيطلع **C4b2b**، نفس الـ C3 convertase بتاع الـ classical.
      - kind: check
        page: 114
        quote: "MASP-2 cleaves C4 into a&b and cleaves also C2 into a&b. C4b2b complex"
        question: "In the lectin pathway, which enzyme plays the role of C1s?"
        options: ["MASP-2", "Factor D", "MBL", "Factor B"]
        answer: 0
        why:
          - "صح: MASP-2 بيقطع C4 و C2 زي C1s بالظبط."
          - "Factor D في الـ alternative."
          - "الـ MBL هو اللي شبه C1q، مش C1s."
          - "Factor B شبه C2."
      - kind: case
        page: 111
        quote: "these regulators, the system fires to exhaustion, as in inherited deficiency of"
        stem: "A child has recurrent infections. C3 is very low. Factor H is absent from birth."
        steps:
          - question: "Why is C3 low?"
            options: ["The alternative pathway fires to exhaustion", "The liver cannot make C3", "No antibodies, no activation"]
            answer: 0
            why: "من غير الـ regulator، الـ AP بيستهلك الـ C3 لحد ما يخلص. الكبد بيعمل C3 عادي، والمشكلة استهلاك."
          - question: "Why the infections?"
            options: ["No C3b left to opsonize bacteria", "Too much C5a", "Too many antibodies"]
            answer: 0
            why: "**C3b هو الـ primary opsonin**. من غير C3 مفيش opsonization كويسة."
      - kind: try
        items: [rheum.L07.025, rheum.L07.026, rheum.L07.029, rheum.L07.030, rheum.L07.037]
    recap:
      - "AP: اتكشف تاني، innate، من غير antibody، و amplification loop لأي C3b."
      - "Factor B شبه C2، و D بيقطعه، و C3bBb = convertase، و properdin بيثبّته."
      - "خلاياك: CR1 و H و MCP و DAF، و factor I ← iC3b. الميكروب ما عندوش."
      - "Lectin: MBL شبه C1q، و MASP-2 شبه C1s، ونفس الـ C4b2b."
    practice: [rheum.L07.021, rheum.L07.022, rheum.L07.023, rheum.L07.024, rheum.L07.025, rheum.L07.026, rheum.L07.027, rheum.L07.028, rheum.L07.029, rheum.L07.030, rheum.L07.031, rheum.L07.032, rheum.L07.033, rheum.L07.034, rheum.L07.035, rheum.L07.036, rheum.L07.037]
