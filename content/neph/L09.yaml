  # ---------- p295-297: vascular access ----------
  - id: neph.L09.024
    kind: enumerate
    topic: access
    prompt: Why do we need an arterialised vein for haemodialysis?
    points:
      - Adequate blood flow for the dialyser (250–400 mL/min)
      - Tolerate large needles (typically 15 gauge)
      - Tolerate repeated puncture (thrice-weekly dialysis)
    pass: 3
    src: { page: 295, quote: "to give adequate blood flow for the dialyser 250-400ml /min" }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.025
    kind: cloze
    topic: access
    text: "Mean radial artery flow is only about {{c1::64 mL/min}} before fistula creation and can rise {{c2::ten-fold}} with maturation; the dialyser needs {{c3::250–400 mL/min}}."
    src: { page: 295, quote: "mean blood flow in the radial artery is only 64" }
    status: unverified
    tags: [numbers]
  - id: neph.L09.026
    kind: card
    topic: access
    front: What is the Brescia–Cimino fistula?
    back: A native radiocephalic fistula, anastomosing the radial artery to the cephalic vein.
    src: { page: 296, quote: "radial A to cephalic vein :BresciaCimino fistula, (radiocephalic)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.027
    kind: card
    topic: access
    front: Upper-arm or forearm fistula; which matures better, according to the book?
    back: The idea is that fistulas made with larger vessels (upper arm) have superior maturation rates.
    src: { page: 296, quote: "the idea that AVFs created with larger vessels have superior maturation rates" }
    status: unverified
  - id: neph.L09.028
    kind: cloze
    topic: access
    text: "A fistula is created about {{c1::6 months}} before use (stage {{c2::4}} CKD) so the arterialised vein can dilate and thicken."
    src: { page: 296, quote: "Fistula created 6 months before used (stage 4 CKD) to allow for maturation" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L09.029
    kind: enumerate
    topic: access
    prompt: When is an AV graft chosen instead of a native fistula?
    points:
      - Native fistula fails to mature
      - Poor arterial inflow
      - Inadequate or poor-calibre veins
    pass: 3
    src: { page: 296, quote: "AV graft chosen in case of: native fistula fail to mature, poor arterial inflow vasculature" }
    status: unverified
  - id: neph.L09.030
    kind: card
    topic: access
    front: What is an AV graft made of?
    back: Prosthetic material, usually polytetrafluoroethylene (PTFE), interposed between an artery and a vein.
    src: { page: 296, quote: "polyetrafluorethylene interposed between A,V" }
    status: unverified
  - id: neph.L09.031
    kind: card
    topic: access
    front: How is a fistula monitored, and when is Doppler needed?
    back: By extracorporeal pressures on dialysis and access flow; Doppler if stenosis or thrombosis is suspected, before surgical consultation or catheter-guided angioplasty.
    src: { page: 296, quote: "Doppler may be required if suspect stenosis or thrombosis" }
    status: unverified
  - id: neph.L09.032
    kind: order
    topic: access
    prompt: Order the veins for dialysis catheter insertion in AKI, from most to least preferred.
    steps:
      - Right jugular vein
      - Femoral vein
      - Left jugular vein
      - Subclavian vein
    src: { page: 297, quote: "the right jugular vein, the femoral vein, the left jugular vein or the subclavian vein" }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.033
    kind: card
    topic: access
    front: Why is the subclavian vein avoided for dialysis catheters?
    back: For fear of stenosis, which prevents a permanent vascular access on that side.
    src: { page: 297, quote: "subclavian is prohibited for fear of stenosis (prohibit permanent vascular access creation on this side)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.034
    kind: card
    topic: access
    front: Why is the femoral vein less preferred, and what if no central vein is available?
    back: Femoral risks infection and is avoided if transplantation is planned; with no central vein, a translumbar or transhepatic approach to the IVC may be needed.
    src: { page: 297, quote: "translumbar or transhepatic approach to IVC may be required if no available central vein" }
    status: unverified
  - id: neph.L09.035
    kind: mcq
    topic: access
    stem: A man with AKI needs urgent dialysis. He is a future transplant candidate with CKD. Ultrasound shows all central veins patent. Which site is preferred for the dialysis catheter?
    options:
      - Right internal jugular vein, under ultrasound guidance
      - Left subclavian vein
      - Right femoral vein
      - Left internal jugular vein
    answer: 0
    why:
      - "Correct: right jugular is first choice, and ultrasound guidance is recommended (2A) (p297)."
      - Subclavian is prohibited for fear of stenosis that ruins future access.
      - Femoral is second and less preferred (infection, planned transplant).
      - Left jugular is third.
    src: { page: 297, quote: "Ultrasound guidance for dialysis catheter insertion was recommended. (2A)" }
    status: unverified
  # ---------- p297-298: transport ----------
  - id: neph.L09.036
    kind: card
    topic: transport
    front: What is a semipermeable membrane?
    back: A membrane that lets small molecules pass but stops large ones.
    src: { page: 297, quote: "allows the passage of small molecules while preventing that of large molecules" }
    status: unverified
  - id: neph.L09.037
    kind: table
    topic: transport
    title: Solute transport mechanisms
    columns: [Mechanism, How it works, Best for]
    rows:
      - ["Diffusion", "Down a concentration gradient, blood to dialysate", "Low-MW solutes (<500–1,500 D)"]
      - ["Convection", "Solutes dragged with fluid (UF) by a pressure gradient", "Higher-MW solutes, at a higher rate"]
      - ["Adsorption", "Solute attaches to the membrane", "Hydrophobic (lipid-soluble) compounds"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 2]]
    src: { page: 297, quote: "Diffusion provides efficient clearance of low-molecular-weight solutes (< 500-1,500" }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.038
    kind: mcq
    topic: transport
    stem: Which mechanism removes higher-molecular-weight solutes at a higher rate than diffusion?
    options:
      - Convection
      - Diffusion
      - Adsorption
      - Osmosis across a non-porous membrane
    answer: 0
    why:
      - "Correct: convection drags solutes through pores with fluid, so larger solutes are removed faster (p297)."
      - Diffusion is efficient mainly for small solutes.
      - Adsorption binds hydrophobic compounds to the membrane.
      - A non-porous membrane removes no solute.
    src: { page: 297, quote: "convective transport permits the removal of higher molecular weight solutes at a higher rate" }
    status: unverified
  - id: neph.L09.039
    kind: card
    topic: transport
    front: Define ultrafiltration in dialysis.
    back: Transport of plasma water (free of cells and colloids) across a semipermeable membrane, driven by the pressure gradient (transmembrane pressure) between blood and dialysate compartments.
    src: { page: 298, quote: "Ultrafiltration describes the transport of plasma water (solvent free of cells and colloids) through a semipermeable membrane" }
    status: unverified
  - id: neph.L09.040
    kind: card
    topic: transport
    front: What are KUF and DKUF?
    back: KUF is the membrane water permeability per unit pressure and surface (mL/h/mmHg/m²); DKUF is KUF × membrane surface area of the filter (mL/h/mmHg).
    src: { page: 298, quote: "is defined as the product of the KUF and membrane surface area of filter" }
    status: unverified
  - id: neph.L09.041
    kind: table
    topic: transport
    title: Solutes by molecular weight
    columns: [Class, MW, Examples]
    rows:
      - ["Small", "<500 D", "Na, P, K, urea (60), creatinine (113), uric acid (186), glucose (180)"]
      - ["Middle", "500–15,000 D", "B12 (1355), beta-2 microglobulin (11,800)"]
      - ["Large", ">15,000 D", "Myoglobin (17,800), albumin (68,000)"]
    blanks: [[0, 1], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 298, quote: "Middle molecules MW 500-15000 B12(1355). B2 microglobulin (11800)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L09.042
    kind: table
    topic: transport
    title: Low-flux and high-flux filters
    columns: [Filter, Water permeability, "UF coefficient (mL/h/mmHg/m²)"]
    rows:
      - ["Low flux", "Low", "2–10"]
      - ["High flux", "Much higher; cut-off about 20 kD", "20–50"]
    blanks: [[0, 2], [1, 2], [1, 1]]
    src: { page: 298, quote: "Highflux dialyzers have cut-off values of" }
    status: unverified
    tags: [numbers]
  - id: neph.L09.043
    kind: mcq
    topic: transport
    stem: Beta-2 microglobulin (MW 11,800 D) is best classed as which kind of solute?
    options:
      - Middle molecule
      - Small solute
      - Large solute
      - Protein-bound solute only
    answer: 0
    why:
      - "Correct: middle molecules are 500–15,000 D, with B12 and beta-2 microglobulin (p298)."
      - Small solutes are under 500 D (urea, creatinine).
      - Large solutes are over 15,000 D (myoglobin, albumin).
      - The book classes solutes here by molecular weight.
    src: { page: 298, quote: "Middle molecules MW 500-15000 B12(1355). B2 microglobulin (11800)" }
    status: unverified
  # ---------- p299: prescription and indications ----------
  - id: neph.L09.044
    kind: card
    topic: transport
    front: What is the main solute-removal mechanism in haemodialysis, and why is countercurrent flow preferred?
    back: Diffusion, chiefly for small solutes; countercurrent keeps the average concentration gradient higher along the whole dialyser. High-flux filters add significant convection.
    src: { page: 299, quote: "A counter-current configuration is preferred because the average concentration gradient is kept higher" }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.045
    kind: enumerate
