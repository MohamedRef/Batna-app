          - **TNF inhibitors**: arthritis، dactylitis، enthesitis، spondylitis، والجلد.
          - **Apremilast**: oral **PDE-4 inhibitor** بيعلّي الـ cAMP.
          - **JAK** (tofacitinib، upadacitinib): بيأثروا على IL-17 و IL-21 و IL-23.
