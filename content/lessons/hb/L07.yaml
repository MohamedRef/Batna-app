        title: "HBV في الحمل (algorithm الكتاب)"
        alt: "Algorithm. Pregnant woman with HBV. First trimester: assess HBV replication and liver disease; side branch: active disease or advanced fibrosis, consider tenofovir. End of second trimester: quantitative HBV DNA and ALT. If HBV DNA below 200,000 IU/mL: monitor. If above 200,000 IU/mL: consider tenofovir, lamivudine or telbivudine at 28 to 32 weeks. Both branches end with the infant receiving HBIG and vaccine at birth."
