lessons:
  # ------------------------------------------------------------------
  - id: rheum.L07.lesson1
    title: "الـ complement: تلات طرق توصل لـ C3"
    hook: "بروتينات بتلف في الدم نايمة، ولما تصحى بتشتغل زي الدومينو: كل واحد يقطع اللي بعده."
    minutes: 9
    pages: [105, 108]
    topics: [overview, nomenclature]
    goals:
      - "تعرّف الـ complement وتعرف بيتعمل فين وليه بيشتغل cascade"
      - "تعرف وظايفه العامة والـ anaphylatoxins"
      - "تعدّ التلات طرق وتعرف ليه بيتقابلوا عند C3"
      - "تقرا أسامي الـ components والـ fragments"
    status: unverified
    steps:
      - kind: explain
        page: 105
        title: "يعني إيه complement؟"
        quote: "Complement is a collective term for a group of plasma & membrane proteins that play a key role in innate and adaptive immunity. The term complement refers to the ability of these proteins to assist, or complement, the antimicrobial activity of antibodies. These proteins are activated in a cascade sequence consisting of proenzymes that undergo sequential proteolytic cleavage, in a mech similar to coagulation pathway."
        text: |
          الـ **complement** اسم لمجموعة **plasma و membrane proteins** ليها دور أساسي في الـ **innate** والـ **adaptive** immunity.

          الاسم معناه إنها ==بتساعد (complement)== الـ antibodies في قتل الميكروبات.

          بتشتغل كـ **cascade** من **proenzymes** كل واحد بيتقطع ويقطع اللي بعده، زي الـ **coagulation pathway** بالظبط.
      - kind: reveal
        page: 105
        quote: "These proteins are activated in a cascade sequence consisting of proenzymes that undergo sequential proteolytic cleavage, in a mech similar to coagulation pathway."
        prompt: "ليه الجسم عامل الـ complement على شكل cascade من proenzymes، بدل بروتين واحد شغال على طول؟"
        answer: |
          التفسير المقبول (مش في الكتاب)، ونفس منطق الـ **coagulation** اللي الكتاب بيشبّهه بيه:
          - **Proenzymes** = نايمين، فمش بيأذوا خلاياك وهما بيلفوا في الدم طول الوقت.
          - كل إنزيم بيقطع **كذا جزيء** من اللي بعده، فإشارة صغيرة في الأول بتبقى ==تضخيم== كبير في الآخر.
          - وكل خطوة **نقطة تحكم** ممكن تتفرمل عندها.

          يعني تشغيل سريع وقوي، وفي نفس الوقت مقفول بأمان لحد ما يحتاجوه.
      - kind: explain
        page: 105
        title: "بيتعمل فين وبيعمل إيه؟"
        quote: "Most complement components are synthesized in the liver by hepatocytes, also by other cell types including: – blood monocytes, tissue macrophages, fibroblasts, – epithelial cells of gastrointestinal tracts, and genitourinary tracts."
        text: |
          - **أغلبه** بيتعمل في الـ ==liver== بالـ hepatocytes، وكمان monocytes و macrophages و fibroblasts و epithelial cells في الـ gastrointestinal tract (GIT) والـ genitourinary tract.
          - **أهم وظيفة**: يغطّي سطح الميكروب بحتت complement، ودي ==opsonization==.
          - **التانية**: ينشّط الخلايا علشان **inflammation** و immune response.
      - kind: explain
        page: 105
        title: "ليه الـ opsonization هي أهم وظيفة؟"
        quote: "The most imp function of the complement system is to modify the membrane of a pathogen by coating its surface with clusters of C activation fragments (opsonization)."
        text: |
          الكتاب بيقول أهم وظيفة إن الـ complement **يغيّر غشا الميكروب** ويغطّيه بـ **clusters of C activation fragments**، ودي الـ ==opsonization==.

          ليه دي الأهم؟ التفسير المقبول (مش في الكتاب): الـ phagocyte عنده **complement receptors**، فالميكروب المتغطّي بقى ليه **مقبض** يتمسك منه ويتبلع، بدل ما يزحلق. وده هيرجع معاك في ص 119: الـ **C3b** هو الـ primary opsonin، والـ phagocytes بتمسكه بـ CR1 و CR3 و CR4.

          وبيتعمل أغلبه في الـ **liver** زي باقي بروتينات البلازما، بس كمان الـ **monocytes** والـ **macrophages** والـ epithelial cells بتعمله، يعني فيه complement بيتعمل **في مكان العدوى نفسه**.
      - kind: reveal
        page: 106
        quote: "During the proteolytic steps of complement activation, mediators are released that activate nearby cells. These low MW fragments (C4a, C3a, C5a) are termed anaphylatoxins, because if released in excessive amounts can induce reaction resembling anaphylaxis."
        prompt: "ليه C4a و C3a و C5a اسمهم anaphylatoxins؟"
        answer: |
          لأنهم لو اتفرزوا بكمية كبيرة يعملوا رد فعل ==شبه الـ anaphylaxis==: بيطلّعوا histamine من الـ mast cells، فيحصل vasodilation و permeability.

          يعني الـ anaphylaxis من غير IgE.
      - kind: explain
        page: 106
        title: "تلات أبواب، أوضة واحدة"
        quote: "These pathways depend on different molecules for their initiation, but they converge to activate C3, which is the most abundant C protein in plasma"
        text: |
          فيه تلات طرق:
          1. **Classical pathway (CP)**
          2. **Alternative pathway (AP)**
          3. **Lectin pathway (LP)**

          كل واحد بيبدأ بـ **molecule مختلف**، بس التلاتة ==converge to activate C3==، أكتر complement protein في البلازما، وبيطلّعوا **نفس الـ effector molecules**.

          ليه تلات أبواب؟ التفسير المقبول (مش في الكتاب): كل باب بيشوف العدو بطريقة: الـ classical بيشوف **antibody** ماسك فيه، والـ alternative بيشوف **سطح** مفيهوش فرامل، والـ lectin بيشوف **سكر** الميكروبات. ولأن النهاية واحدة، أي باب يتفتح بيوصل لنفس النتيجة.
      - kind: figure
        page: 108
        quote: "The complement system\n| CLASSICAL PATHWAY | MB-LECTIN PATHWAY | ALTERNATIVE PATHWAY |\n|---|---|---|\n| Antigen:antibody complexes | Lectin binding to pathogen surfaces | Pathogen surfaces |\nComplement activation:\n  Recruitment of inflammatory cells\n  Opsonization of pathogens\n  Killing of pathogens"
        title: "تلات طرق، نقطة التقاء واحدة"
        alt: "Three roads at the top: classical pathway started by antigen–antibody complexes, lectin pathway started by MBL binding mannose on pathogens, alternative pathway started by pathogen surfaces. All three arrows meet at C3, the most abundant complement protein. From C3, three outcomes: recruitment of inflammatory cells, opsonization, and killing of pathogens by the MAC."
        caption: "كل الطرق بتوصل ==C3==، أكتر complement protein في الـ plasma. ومن C3 نفس النتايج: التهاب، opsonization، وقتل."
        svg: |
