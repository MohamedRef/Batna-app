      - kind: explain
        page: 39
        quote: "Discussion\nConclusion\nGood discussion should be structured to include the following six components:\n1. Statement of principal findings:\nThe opening of the discussion usually gives the answer to the research question. This should not normally be more than a few sentences. It is advisable that the discussion start with a sentence that clearly shows that the paper includes new information. Reviewers often start with a \"null hypothesis\" that the paper does not add anything new."
        title: "1. ابدأ بالإجابة"
        text: |
          أول الـ discussion **يجاوب سؤال البحث** في **جملتين تلاتة** مش أكتر.

          وأحسن تبدأ بجملة توضّح إن الـ paper فيه ==new information==؛ لأن المحكّمين بيبدأوا بـ «**null hypothesis**» إن الـ paper مابيضيفش جديد.
      - kind: explain
        page: 40
        quote: "Discussion\nConclusion\nGood discussion should be structured to include the following six components:\n2. Strengths and weaknesses of the study:\nEqual emphasis should be given to both of them. Reviewers are more interested in seeing that the author is aware of the weaknesses. A subheading such as \"limitations of the study\" or data is useful.\nFindings that have not been described in the results section should not be discussed."
        title: "2. نقط القوة والضعف"
        text: |
          ==Equal emphasis== للاتنين. والمحكّمين **أكتر** حاجة عايزين يشوفوها إنك **واخد بالك من نقط ضعفك**.

          - عنوان فرعي زي «**limitations of the study**» مفيد.
          - أي حاجة **ماتكتبتش في الـ results** ماتتناقشش هنا.
      - kind: explain
