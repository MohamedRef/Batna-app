      - kind: explain
        page: 188
        quote: "Multiple genetic pathways in colorectal cancer pathogenesis"
        title: "التلات طرق: ليه نفرّق بينهم؟"
        text: |
          الشكل في الكتاب فيه **multiple genetic pathways**:
          - **A. Chromosomal instability (CIN)**: APC، بعدين K-ras و 18q، بعدين TP53: normal، early adenoma، late adenoma، cancer.
          - **B. Microsatellite instability (MSI)**: فشل الـ mismatch repair، بعدين TGF-beta receptor II و BAX.
          - **C. Serrated**: ==BRAF mutation و DNA methylation==، وبعدين TP53 و p16.

          التفسير المقبول (مش في الكتاب): ليه نهتم بالطريق؟ لأن كل طريق بيبدأ من بوليب مختلف وفي مكان مختلف: الـ CIN من الـ adenoma الكلاسيكي في أي حتة، والـ serrated من بوليب مسطح في اليمين. فلو المنظار بيدوّر بس على البوليب البارز، هيفوّت الطريق التالت كله. وكمان الطريق بيأثّر على العلاج: أورام الـ MSI بتستجيب للـ immunotherapy.
      - kind: explain
        remind: [git.L05.017]
        page: 188
        quote: "Multiple genetic pathways in colorectal cancer pathogenesis WHO Classification of Serrated Lesions (2010) Hyperplastic polyp (HP) Microvesicular HP (MVHP) (60%)"
        title: "WHO 2010"
        text: |
          - ==Hyperplastic polyp (HP)==: microvesicular 60%، goblet cell rich 30%، mucin poor 10%.
          - **Sessile serrated adenoma/polyp (SSA/P)**: with atypia (adenomatous أو serrated) أو without atypia.
          - **Traditional serrated adenoma (TSA)**.

          التفسير المقبول (مش في الكتاب): ليه التقسيم ده مهم عمليًا؟ لأن الـ HP بأنواعه غالبًا بريء، بينما الـ SSA/P والـ TSA هما اللي على طريق السرطان، فالاسم اللي الـ pathologist بيكتبه هو اللي بيحدد المتابعة.
      - kind: figure
        page: 189
        title: "الـ serrated: dysplastic ولا لأ"
        image: { file: git/L05-serrated-classification.webp, book: true }
        alt: "Book table classifying serrated polyps. Non-dysplastic: aberrant crypt foci of hyperplastic type, hyperplastic polyp, microvesicular, goblet cell and mucin depleted serrated polyps, and sessile serrated adenoma. Dysplastic: serrated adenoma, admixed polyp, and serrated adenocarcinoma."
        caption: |
          تقسيم تاني للـ serrated lesions، بالـ dysplasia:

          - **Non-dysplastic**: aberrant crypt foci، الـ **hyperplastic polyp** بأنواعه (microvesicular، goblet cell، mucin depleted)، والـ **sessile serrated adenoma**.
          - **Dysplastic**: ==serrated adenoma==، **admixed polyp** (جزء serrated وجزء adenoma عادي)، و**serrated adenocarcinoma**.
      - kind: explain
        page: 189
        quote: "Most common non-neoplastic type accounting for 60–75% of all serrated"
        title: "الـ hyperplastic polyp: البريء غالبًا"
        text: |
          الكتاب:
          - الأشهر، ==non-neoplastic==، و **60-75%** من كل الـ serrated lesions.
          - أكتر في الـ **left colon** وفي **الرجالة**.
          - صغير **أقل من 5 mm**، flat أو sessile.
          - بس الكبير (**1 cm أو أكتر**) في الـ **right colon**، واللي في الـ **serrated polyposis syndrome (SPS)**، ممكن يبقى فيه malignant potential.

          التفسير المقبول (مش في الكتاب): ليه الكبير في اليمين بالذات؟ لأن الـ SSA/P (الخطير) بيحب اليمين وبيبقى كبير، وتحت الميكروسكوب ممكن يتلخبط مع الـ HP. فالـ «HP» الكبير في اليمين ممكن يكون SSA/P اتسمّى غلط، أو على نفس الطريق. يعني الحجم والمكان بيغيّروا معنى نفس الاسم.
      - kind: figure
        page: 189
        title: "الـ hyperplastic polyp في المنظار"
        image: { file: git/L05-hyperplastic-polyps.webp, book: true }
        alt: "Two book colonoscopy pictures of small, pale, smooth, slightly raised polyps a few millimetres across."
        caption: |
          **صغيرة** (أقل من 5 mm)، **flat أو sessile**، ولونها قريب من الـ mucosa اللي حواليها. ده الشكل ==البريء غالبًا==.
      - kind: check
        page: 189
