- kind: fixed
  ar_eg: "تسجيل الدخول بجوجل على الموبايل بقى بيكمّل: لو النت ما وصلش لباطنة وهي في الخلفية، بتكمّل الدخول لوحدها أول ما ترجع لها."
  en: "Google sign-in on Android now finishes: if Batna had no network while in the background, it completes the sign-in as soon as you're back."
- kind: improved
  ar_eg: "صفحة جوجل بعد الدخول فيها زرار «ارجع لباطنة» بيرجّعك للتطبيق على طول."
  en: "The page after Google sign-in has a \"back to Batna\" button that returns you to the app."
