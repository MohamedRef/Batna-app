    src: { page: 379, quote: "the risks of hypocalcemia, hypokalemia, and hypophosphatemia in the mother, it is recommended to use dialysate with a calcium concentration of 2.5 mEq/L and dialysate potassium between 3 and 3.5 mEq/L. Periodic monitoring of calcium, phosphorus, and other electrolytes is suggested for early identification and correction of electrolyte abnormalities.(80)" }
