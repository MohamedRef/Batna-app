- id: res.L15.006
  kind: card
  topic: intro
  front: What is descriptive statistics? Give the slide's examples.
  back: Statistics concerned with the summary measures of data for a sample of a population, e.g. the % age and sex distribution,
    or the average blood pressure.
  src:
    page: 7
    quote: |-
      1- Descriptive statistics:
      Which is concerned with the summary measures of data for a sample of a population.
      E.g.: % of age and sex distribution
      Average blood pressure
  status: unverified
- id: res.L15.007
  kind: card
  topic: intro
  front: What is analytic statistics? Give the slide's example.
  back: The use of data from a sample to make inferences about the population, e.g. reaching a conclusion about the relation
    between a disease and its cause (smoking and lung cancer) that is generalized over the population.
  src:
    page: 8
    quote: |-
      2- Analytic statistics:
      Concerned with the use of data from a sample of population to make inferences about the population (ex: to come to a conclusion about the relation between a condition ( disease and its cause) to be generalized over the population
      Example : relation between smoking and lung cancer
  status: unverified
  tags: [high-yield]
- id: res.L15.008
  kind: mcq
  topic: intro
  stem: 'A researcher uses a sample to conclude whether smoking is related to lung cancer in the whole population. This is:'
  options:
  - Analytic statistics
  - Descriptive statistics
  - Vital statistics
  - Constant data
  answer: 0
  why:
  - Inference from a sample about a relation in the population is analytic statistics; the slide's own example is smoking
    and lung cancer.
  - Descriptive statistics only summarizes the sample (percentages, averages) without inference.
  - Vital statistics is government collection of births, deaths, marriages and so on.
  - Constant data are observations that don't vary, like the number of eyes.
  src:
    page: 8
    quote: |-
      2- Analytic statistics:
      Concerned with the use of data from a sample of population to make inferences about the population (ex: to come to a conclusion about the relation between a condition ( disease and its cause) to be generalized over the population
      Example : relation between smoking and lung cancer
  status: unverified
  tags: [high-yield]
