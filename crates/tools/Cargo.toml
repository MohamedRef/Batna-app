[package]
name = "batna-tools"
description = "Batna's content tools: validate, anki, packs, verdicts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
batna-core.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
serde_json.workspace = true
batna-anki.workspace = true
# Update feeds (update.rs): hashes, signing and a fresh key.
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
getrandom = "0.3"
# `verdicts --cloud` (cloud_verdicts.rs): his marks from Batna Cloud with the read key.
batna-protocol.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
