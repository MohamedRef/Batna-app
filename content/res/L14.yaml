- id: res.L14.033
  kind: mcq
  topic: validity
  stem: A test with sensitivity 99% and specificity 60% comes back negative. What can you say?
  options:
  - The disease is very likely ruled out (SnNout)
  - The disease is ruled in (SpPin)
  - 'Nothing: specificity is too low to use a negative result'
  - The patient has a false negative result
  answer: 0
  why:
  - A very sensitive test rarely misses disease, so a negative result rules it out.
  - SpPin needs a highly specific test with a positive result; this one is negative and only 60% specific.
  - A negative result is read through sensitivity, which is high here.
  - With 99% sensitivity, false negatives are rare, not expected.
  src:
    page: 16
    quote: |-
      SpPin: A highly Specific test with a positive result tends to rule in the diagnosis of the disease.
      SnNout: A highly Sensitive test with a negative result tends to rule out the diagnosis of the disease.
      Don't forget:
  status: unverified
  tags: [high-yield]
- id: res.L14.034
  kind: card
  topic: predictive
  front: Define the positive predictive value, and what question does it answer for the patient?
  back: 'The probability of disease among patients with a positive test. It answers: if the test was positive, how likely
    is it that he really has the disease (how worried should he be)?'
  src:
    page: 17
    quote: |-
      Positive predictive value= probability of disease among patients with a positive test.
      Negative predictive value= probability of no test among patient with a negative test.
      When thinking about Predictive Value of a Test, ... imagine you are a physician discussing the results of a screening test with a patient.
      1) If the test was positive, how likely is it that he really has the disease? [How worried should he be?]
  status: unverified
  tags: [high-yield]
- id: res.L14.035
  kind: card
  topic: predictive
