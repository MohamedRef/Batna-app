  - id: git.L02.lesson9
    title: "نجمّد، نضوّي، ونكسّر: cryo و laser و PDT و APC"
    hook: "ثلج للـ Barrett، laser بيكسّر حصوة، نور بيقتل الـ cancer بس، وغاز argon للنزيف. وفي الآخر: الـ AI."
    minutes: 9
    pages: [71, 74]
    topics: [ablation, ai]
    goals:
      - "تعرف الـ cryotherapy بتشتغل إزاي وعلى مرحلتين"
      - "تفرق بين PDT و APC وتعرف دواعي كل واحد"
      - "تعدّ أنواع الـ AI الأربعة"
    status: unverified
    steps:
      - kind: explain
        page: 71
        quote: "With this device, epithelial ablation via cryonecrosis of 0.5 mm was achieved (immediate effect) and there was a latent inflammatory process that resulted in completion of the mucosal ablation (delayed effect) in several days."
        title: "الـ cryotherapy: تأثيرين"
        text: |
          الكتاب: ==endoscopic cryotherapy== طريقة **elegantly simple** للـ **hemostasis** والـ **mucosal ablation**، ومنها **Barrett's esophagus**. الجهاز بيطلّع **nitrous oxide** تحت ضغط عالي من catheter جوه المنظار.

          - **Immediate**: ==cryonecrosis 0.5 mm== في الـ epithelium.
          - **Delayed**: **inflammation** كامنة بتكمّل الـ ablation في كام يوم.
          - اتقيّم بالـ **EUS** و **full-thickness biopsy**: الـ mucosa اتشالت كلها **من غير** إصابة مهمة أو edema في اللي تحتها.

          التفسير المقبول (مش في الكتاب): ليه ده مناسب للـ Barrett؟ لأن المشكلة في الـ **mucosa** بس، فعايز تشيلها كلها وتسيب الـ muscle سليم. التجميد سطحي (0.5 mm)، والباقي بيكمّله الالتهاب ببطء، فمفيش حرق عميق يعمل stricture.
      - kind: explain
        page: 71
        quote: "It was applied via ERCP through a balloon catheter controlled by fluoroscopy, with significantly low fiber burn-off and better fragmentation of difficult stones."
        title: "الـ FREDDY: laser للحصوة"
        text: |
          الكتاب: ==FREDDY== = frequency doubled double-pulse **Nd-YAG**، solid state laser جديد.
          - بيتعمل في الـ **ERCP** من **balloon catheter** تحت **fluoroscopy**.
          - **low fiber burn-off** و **better fragmentation** للـ **difficult stones**.
          - **safe، effective، cheap، promising**، وممكن ينشر الـ **laser lithotripsy**.

          التفسير المقبول (مش في الكتاب): الـ balloon بيثبّت الـ catheter في نص الـ duct، فالـ laser يضرب الحصوة مش حيطة القناة. والـ «low fiber burn-off» يعني الـ fiber نفسها مش بتتحرق بسرعة، فالجلسة أرخص.
      - kind: explain
        remind: [git.L02.100]
        page: 71
        quote: "PDT is a non-thermal procedure which acts by endoscopic laser irradiation with an appropriate wave-length after administration of a photosensitizer, which retained preferentially by the cancerous tissue and can destroy tumor cells selectively."
        title: "Laser و PDT"
        text: |
          - **FREDDY**: frequency-doubled double-pulse **Nd:yttrium aluminium garnet (YAG)** laser، في الـ **endoscopic retrograde cholangiopancreatography (ERCP)** من balloon catheter، لتكسير الـ **difficult stones**: آمن وفعال ورخيص.
          - ==photodynamic therapy (PDT)==: **non-thermal**. بتدي **photosensitizer** بيتحجز أكتر في الـ **cancer**، وبعدين laser بالـ wavelength المناسب ← الخلايا السرطانية بس اللي بتموت.
            - في **esophageal cancer**: palliation كويس للـ **dysphagia**، وأسهل وأريح من Nd:YAG.
            - كمان: palliation لـ colon و gastric و pancreatic cancer، ampullary و para-ampullary adenomas، و **familial adenomatous polyposis (FAP)**.
            - بيقتل **H. pylori** in vitro، بس مفيش clinical data.

          التفسير المقبول (مش في الكتاب): ليه FREDDY في الـ ERCP؟ لأن الحصوة الكبيرة في الـ bile duct ممكن ما تعدّيش من الـ papilla حتى بعد الـ sphincterotomy، فلازم تتكسر جوه الأول.
      - kind: reveal
        page: 71
        quote: "PDT is a non-thermal procedure which acts by endoscopic laser irradiation with an appropriate wave-length after administration of a photosensitizer, which retained preferentially by the cancerous tissue and can destroy tumor cells selectively."
        prompt: "إزاي النور بيقتل خلايا الـ cancer بس؟"
        answer: |
          الكتاب: الـ **photosensitizer** بيتحجز **preferentially** في الـ cancerous tissue، والـ laser بالـ **wavelength** المناسب بيدمّر الخلايا دي **selectively**.

          التفسير المقبول (مش في الكتاب): المادة لوحدها مش بتأذي، والنور لوحده مش بيأذي. الاتنين **مع بعض** بس بيعملوا مواد سامة جوه الخلية. ولأن المادة متجمعة أكتر في الـ tumor، الضرر بيبقى فيه هو. وعلشان كده اسمه **non-thermal**: مفيش حرق، فيه تفاعل.
      - kind: explain
        page: 71
        quote: "Initial trials in esophageal cancer have demonstrated that PDT is effective in providing significant palliation from dysphagia."
        title: "الـ PDT بيتستخدم في إيه؟"
        text: |
          الكتاب:
          - **Esophageal cancer**: ==significant palliation from dysphagia==، وأسهل تقنيًا من **Nd:YAG laser** و**better tolerated**.
          - **Palliation** لـ colon و gastric و pancreatic cancer.
          - **Photodestruction** لـ ampullary neoplasm و para-ampullary adenomas، و lesions الـ **familial adenomatous polyposis**.
          - بيقتل **H. pylori** in vitro، بس **مفيش clinical data**.

          التفسير المقبول (مش في الكتاب): كلمة **palliation** هي المفتاح: الـ PDT هنا مش بيشفي الـ cancer المتقدم، بيفتح الطريق علشان المريض يبلع ويعيش أريح.
      - kind: explain
        remind: [git.L02.103]
        page: 72
        quote: "The limited depth of coagulation (2-3 mm) explains the low risk of perforation."
        title: "الـ APC"
        text: |
          ==Argon plasma coagulation==: **non-contact** electrocoagulation، تيار high frequency بيعدّي في **ionized argon gas**.

          العمق محدود ==2-3 mm== ← **low risk of perforation**.

          دواعيه المعروفة:
          - نزيف من **angiodysplasia** أو مكان **polypectomy**
          - **Radiation proctitis**
          - **Palliation** للـ malignant colorectal stenosis
          - **Early gastric cancer**

          وبعد الـ **piecemeal** polypectomy بيشيل بواقي الـ polyp عند الحواف.

          التفسير المقبول (مش في الكتاب): ليه دواعيه كلها «سطحية»؟ لأن العمق 2-3 mm بس: الـ angiodysplasia والـ radiation proctitis أوعية سطحية، والـ early gastric cancer لسه في الـ mucosa، والـ stenosis بنفتح فيها طريق من جوه.
      - kind: reveal
        page: 72
        quote: "The limited depth of coagulation (2-3 mm) explains the low risk of perforation."
        prompt: "ليه الـ APC آمن في القولون الرفيع؟"
        answer: |
          الكتاب: العمق المحدود **2-3 mm** هو اللي بيفسّر الـ **low risk of perforation**.

          التفسير المقبول (مش في الكتاب): وكمان هو **non-contact**: الـ probe مش بيلمس الحيطة، الغاز هو اللي بيوصّل التيار. والنسيج لما يتحرق ويبقى ناشف بيقاوم التيار، فالـ argon بيروح لوحده للحتة اللي لسه رطبة جنبها. فالحرق بيتوزع على السطح بدل ما يتعمّق، وده مثالي للـ **angiodysplasia** المسطحة ولحيطة القولون الرفيعة.
