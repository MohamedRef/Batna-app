  - id: geri.L05.lesson3
    title: "النزيف والعلاج: CT الأول"
    hook: "صداع زي ضربة على الراس، أو جدّ وقع من شهر ودلوقتي نايم على طول. الاتنين نزيف، بس كل واحد في طبقة."
    minutes: 9
    pages: [88, 90]
    topics: [hemorrhage, management]
    goals:
      - "تفرّق أنواع النزيف بالمكان والسبب والأعراض"
      - "تعرف الـ general measures والـ alteplase dose"
      - "تكتب الـ long-term treatment كامل"
    status: unverified
    steps:
      - kind: explain
        page: 88
        quote: "Usually related to chronic hypertension, usually massive & fatal, may simulate thromboembolic infarction, but there is usually severe headache & coma."
        title: "الـ intracerebral hemorrhage"
        text: |
          الـ ==intracerebral hemorrhage== غالبًا من **chronic hypertension**، وبيبقى **massive & fatal**.

          ممكن يتلخبط مع الـ thromboembolic infarction، بس الفرق: **severe headache** و**coma**.

          والأشعة: **CT more helpful than MRI** في التشخيص الأولاني.
      - kind: explain
        page: 88
        quote: "Headache, deterioration of consciousness with cerebellar signs."
        title: "النزيف اللي معاه cerebellar signs"
        text: |
          الكتاب كاتب النوع التاني «Cerebral hemorrhage»، بس أعراضه **headache**، **deterioration of consciousness** ومعاها ==cerebellar signs==. يعني فكّر فيه كنزيف في الـ cerebellum.
      - kind: figure
        page: 89
        quote: "Rupture of a vein in the subdural space follows head injury by days or months."
        title: "كل نزيف في طبقته"
        alt: "Layers from outside in: skull, extradural space with the middle meningeal artery, dura, subdural space with a bridging vein, arachnoid, subarachnoid space with a berry aneurysm, then brain. Each space has its bleed and cause labelled."
        caption: "من بره لجوه: الـ extradural من شريان بعد كسر، والـ subdural من vein بعد خبطة بأيام أو شهور، والـ subarachnoid من berry aneurysm أو AVM."
        svg: |
          <svg viewBox="0 0 330 270" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="28" class="fg-ink"/>
            <text x="20" y="29" class="t-b">Skull</text>
            <rect x="10" y="44" width="310" height="54" rx="6" class="fg-bad"/>
            <text x="20" y="64" class="t-b">Extradural</text>
