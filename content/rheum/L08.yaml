  - id: rheum.L08.190
    kind: case
    topic: gca
    stem: "A 76-year-old woman has 3 weeks of new left temporal headache, pain on chewing, and shoulder and hip girdle aching with morning stiffness. Today she lost vision in her right eye for 10 minutes. ESR 88 mm/h."
    steps:
      - question: Most likely diagnosis?
        options: ["Giant cell arteritis with PMR", "Migraine with aura", "Takayasu arteritis", "Polymyositis"]
        answer: 0
        why: "Age ≥50, headache, jaw claudication, PMR and visual disturbance (pp127, 131). Migraine does not raise the ESR to 88. Takayasu affects young females. PMR has no myopathy, and polymyositis does not cause headache or jaw claudication."
      - question: "GCA score so far (headache, visual disturbance, PMR, jaw claudication, ESR ≥50)?"
        options: ["6: GCA established", "4: GCA established", "3: borderline", "7: GCA established"]
        answer: 0
        why: "1 + 1 + 2 + 1 = 5 in domain I, plus ESR 1 = 6 (p131). Fever/anaemia is ignored with PMR (p132)."
      - question: What now?
        options: ["Start prednisone 40–60 mg/day immediately, then confirm by imaging or biopsy", "Wait for the biopsy before steroids", "Prednisone 15 mg as for PMR", "Start aspirin and anticoagulation"]
        answer: 0
        why: "Start high-dose GC immediately, and confirm by imaging or histology (p136). Waiting risks blindness. 15 mg is the PMR dose. Routine antiplatelets or anticoagulants are no longer recommended (p137)."
      - reveal: "The left temporal artery looks normal; a 1 cm biopsy is negative."
        question: Next step?
        options: ["Repeat with a 4–6 cm segment or biopsy the opposite side", "Exclude GCA", "Stop steroids", "Start cyclophosphamide"]
        answer: 0
        why: "Skip lesions: take 4–6 cm if not obviously abnormal, and biopsy the opposite side if suspicion is strong (p132)."
    src: { page: 136, quote: "High dose glucocorticoid therapy (40-60 mg/day prednisone-equivalent) should be initiated immediately for induction of remission in active giant cell arteritis (GCA) or Takayasu arteritis (TAK)." }
    status: unverified
