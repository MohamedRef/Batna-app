        title: "كل وظيفة ضاعت وعرضها: رسمة الكتاب"
        image: { file: neph/L02-lost-functions.webp, book: true }
        alt: "Book diagram: chronic kidney disease at the top branches into seven lost functions: sodium and water balance (hypertension, increased vascular volume, edema, heart failure), potassium balance (hyperkalemia), elimination of nitrogenous wastes (uremia, coagulopathies, bleeding, pericarditis), erythropoietin production (anemia), acid-base balance (acidosis, skeletal buffering), activation of vitamin D (hypocalcemia, hyperparathyroidism) and phosphate elimination. The bottom row lists the results: impaired immune function, skin disorders, gastrointestinal, neurologic manifestations, sexual dysfunction and osteodystrophies."
        caption: |
          فوق: **Chronic kidney disease**، ومنها 7 صناديق وردي، كل واحد = وظيفة ضاعت، وتحت كل واحد اللي بيحصل:

          - **Sodium and water balance** ← **Hypertension** و **increased vascular volume** ← **Edema** و **Heart failure**.
          - **Potassium balance** ← **Hyperkalemia**.
          - **Elimination of nitrogenous wastes** ← **Uremia** ← **Coagulopathies/Bleeding** و **Pericarditis**.
          - **Erythropoietin production** ← **Anemia**.
          - **Acid-base balance** ← **Acidosis**، و**Skeletal buffering** (العضم بيدفع التمن).
          - **Activation of vitamin D** و **Phosphate elimination** (يمين) ← **Hypocalcemia** ← **Hyperparathyroidism** ← **Osteodystrophies**.
          - **الصف اللي تحت**: immune، skin، GI، neurologic، sexual dysfunction.

          يعني كل عرض في الجدول اللي تحتها ليه ==وظيفة كلية ضاعت== وراه، ودي طريقة تحفظ بيها الأعراض بالمنطق مش بالرص.
