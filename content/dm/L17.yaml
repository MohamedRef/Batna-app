  - id: dm.L17.024
    kind: mcq
    topic: secondary
    stem: A 34-year-old man with severe asthma has taken oral prednisolone for 2 years. DEXA shows low bone density. Which mechanism is NOT one of the ways corticosteroids cause bone loss in the lecture?
    options:
      - Increased intestinal calcium absorption
      - Inhibition of osteoblastic function
      - Stimulation of bone resorption
      - Increased parathyroid hormone secretion
      - Decreased end-organ response to vitamin D
    answer: 0
    why:
      - "Correct: steroids INHIBIT intestinal calcium absorption (p217)."
      - Listed on p217.
      - Listed on p217.
      - Listed on p217.
      - Listed on p217.
    src: { page: 217, quote: "Corticosteroids inhibit osteoblastic function, stimulate bone resorption, increase parathyroid hormone secretion, inhibit intestinal calcium absorption" }
    status: unverified
  - id: dm.L17.025
    kind: mcq
    topic: secondary
    stem: Which of these is listed as a bone marrow cause of secondary osteoporosis in Table 258-2?
    options:
      - Systemic mastocytosis
      - Homocystinuria
      - Renal tubular acidosis
      - Alactasia
      - Klinefelter syndrome
    answer: 0
    why:
      - "Correct: systemic mastocytosis sits with myeloma, lymphoma and leukemia under bone marrow disorders."
      - Homocystinuria is a connective tissue cause.
      - Renal tubular acidosis is under miscellaneous causes.
      - Alactasia is a gastrointestinal cause.
      - Klinefelter syndrome is male hypogonadism, an endocrine cause.
    src: { page: 217, quote: "Bone marrow disorders Multiple myeloma Lymphoma Leukemia Hemolytic anemias Systemic mastocytosis" }
    status: unverified
  # ---------- p217-218: risk factors ----------
  - id: dm.L17.026
    kind: enumerate
    topic: risk
    prompt: Mention the major risk factors for osteoporosis.
    points:
      - Age
      - Female sex
      - White or Oriental race
      - Family history of osteoporosis
      - Thin habitus
      - Early menopause (before 45) or oophorectomy
      - Secondary amenorrhea
      - Lifelong low calcium intake (including lactose intolerance)
      - Sedentary lifestyle
      - Immobilization
    pass: 7
    src: { page: 217, quote: "The major risk factors for osteoporosis are age, female sex, white or Oriental race, family history of osteoporosis, thin habitus, early menopause" }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.027
    kind: cloze
    topic: risk
    text: "Early menopause, a major risk factor for osteoporosis, means menopause before age {{c1::45}}."
    src: { page: 218, quote: "(before age 45), oophorectomy, secondary amenorrhea, lifelong low calcium intake (including lactose intolerance), sedentary lifestyle, and immobilization." }
    status: unverified
    tags: [numbers]
  - id: dm.L17.028
    kind: enumerate
    topic: risk
    prompt: Mention the "other" (minor) risk factors for osteoporosis.
    points:
      - Nulliparity
      - Protein-calorie malnutrition
      - Gastrectomy
      - Alcohol abuse
      - Cigarette smoking
      - Drugs or illness that increase bone loss (corticosteroids, thyrotoxicosis)
    pass: 4
    src: { page: 218, quote: "Other risk factors include nulliparity, protein-calorie malnutrition, gastrectomy, alcohol abuse, cigarette smoking" }
    status: unverified
  - id: dm.L17.029
    kind: card
    topic: risk
    front: The chief single predictor of osteoporosis?
    back: Age.
    src: { page: 218, quote: "Age: The chief single predictor for osteoporosis is age." }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.030
    kind: card
    topic: risk
    front: Why are women at higher risk of osteoporosis than men?
    back: Lower peak bone mass at skeletal maturity, plus greatly accelerated bone loss for several years after menopause; by the sixth decade their bone density is clearly lower than men's.
    src: { page: 218, quote: "Women have a lower peak bone mass at skeletal maturity and a greatly accelerated phase of bone loss for several years after menopause." }
    status: unverified
  - id: dm.L17.031
    kind: card
    topic: risk
    front: Why is osteoporosis less common in black people?
    back: Greater peak bone mass at skeletal maturity, and possibly differences in nutrition, exercise and body weight.
    src: { page: 218, quote: "probably because blacks have a greater peak bone mass at skeletal maturity" }
    status: unverified
  - id: dm.L17.032
    kind: card
    topic: risk
    front: How is low body weight thought to raise osteoporosis risk?
    back: Less biologically active estrogen in thin postmenopausal women, and lower peak bone mass in thin young women.
    src: { page: 218, quote: "decreased availability of biologically active estrogen in thin postmenopausal women and lower peak bone mass in thin young women." }
    status: unverified
  - id: dm.L17.033
    kind: card
    topic: risk
    front: Why may obesity protect against osteoporosis?
    back: Higher estrogen levels and more skeletal weight bearing, which may stimulate bone formation.
    src: { page: 218, quote: "Obesity may protect because higher estrogen levels in obese men and women and increased skeletal weight bearing may stimulate bone formation." }
    status: unverified
  - id: dm.L17.034
    kind: card
    topic: risk
    front: A family history of what is a major risk factor for osteoporosis?
    back: Osteoporotic fractures.
    src: { page: 218, quote: "A family history of osteoporotic fractures is thought to be a major risk factor." }
    status: unverified
  - id: dm.L17.035
    kind: cloze
    topic: risk
    text: "{{c1::FRAX}}, developed by the {{c2::WHO}}, predicts the {{c3::10-year}} likelihood of a minimal trauma fracture."
    src: { page: 218, quote: "Fracture risk assessment tool [FRAX] developed by WHO to predict your 10-year likelihood of having a minimal trauma fracture" }
    status: unverified
    tags: [high-yield, numbers]
  - id: dm.L17.036
    kind: card
    topic: risk
    front: What is a minimal trauma fracture, and what makes FRAX more accurate?
    back: A bone broken by a fall from standing height or less; FRAX is more accurate when DEXA results are included.
    src: { page: 218, quote: "breaking a bone after falling from standing height or less" }
    status: unverified
  - id: dm.L17.037
    kind: mcq
    topic: risk
    stem: Which woman has the lowest risk of osteoporosis, according to the lecture's risk factors?
    options:
      - An obese black woman who walks daily
      - A thin white woman whose menopause was at 42
      - An Oriental woman with lactose intolerance and a low calcium intake
      - A nulliparous smoker who drinks heavily
      - A woman on long-term corticosteroids for asthma
    answer: 0
    why:
      - "Correct: blacks have a greater peak bone mass, obesity may protect, and she is active (p218)."
      - Thin habitus, white race and menopause before 45 are major risk factors.
      - Oriental race and lifelong low calcium intake are major risk factors.
      - Nulliparity, smoking and alcohol abuse are other risk factors.
      - Corticosteroid use is a drug that predisposes to bone loss.
    src: { page: 218, quote: "Obesity may protect because higher estrogen levels in obese men and women and increased skeletal weight bearing may stimulate bone formation." }
    status: unverified
  # ---------- p219: symptoms, history, examination ----------
  - id: dm.L17.038
    kind: card
    topic: clinical
    front: When do patients with osteoporosis usually get symptoms?
    back: Often not until a fracture occurs; the trigger may be as trivial as turning over in bed, though falls and lifting are more common.
    src: { page: 219, quote: "Individuals with osteoporosis often remain asymptomatic until a fracture occurs." }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.039
    kind: card
    topic: clinical
    front: Which bone disease causes diffuse bony tenderness and pain even without a fracture on X-ray?
    back: Osteomalacia (osteoporosis is usually silent until a fracture).
    src: { page: 219, quote: "osteomalacia often causes diffuse bony tenderness and pain, even in the absence of radiographically evident fractures." }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.040
    kind: card
    topic: clinical
    front: How is primary osteoporosis diagnosed, given it has no characteristic symptoms, signs or labs?
    back: By excluding other metabolic bone diseases (osteomalacia, malignancy and secondary osteoporosis), usually with history, examination and a few lab tests.
    src: { page: 219, quote: "diagnosis requires excluding other causes of metabolic bone disease, ie, osteomalacia, malignancy, and secondary osteoporosis." }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.041
    kind: enumerate
    topic: clinical
    prompt: What are the hallmarks of metabolic bone disease to ask about in a patient with a fracture or osteopenia?
    points:
      - Fractures
      - Loss of height
      - Bone pain
      - Muscle weakness
    pass: 3
    src: { page: 219, quote: "hallmarks of metabolic bone disease (eg, fractures, loss of height, bone pain, and muscle weakness)" }
    status: unverified
  - id: dm.L17.042
    kind: card
    topic: clinical
    front: Besides the hallmarks of bone disease, what drug history matters specifically in a patient with osteopenia?
    back: Drugs and disorders associated with vitamin D deficiency and osteomalacia.
    src: { page: 219, quote: "specifically about drugs and disorders associated with vitamin D deficiency and osteomalacia." }
    status: unverified
  - id: dm.L17.043
    kind: enumerate
    topic: clinical
    prompt: Which diseases should you look for on examination, especially in premature osteoporosis?
    points:
      - Alcohol abuse
      - Malabsorption
      - Hypercortisolism
      - Endocrinopathy
      - Malignancy
    pass: 4
    src: { page: 219, quote: "look for symptoms and signs of alcohol abuse, malabsorption, hypercortisolism, endocrinopathy, malignancy" }
    status: unverified
  # ---------- p220: labs ----------
  - id: dm.L17.044
    kind: enumerate
    topic: labs
    prompt: If the history shows no cause of secondary osteoporosis, which tests usually exclude underlying disorders?
    points:
      - CBC with differential
      - Routine serum chemistry
      - Thyroid function tests
      - Serum protein electrophoresis
      - Serum 25-hydroxycholecalciferol
      - 24-h urine calcium
    pass: 5
    src: { page: 220, quote: "A CBC count with differential, routine serum chemistry studies, thyroid function tests, serum protein electrophoresis" }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.045
    kind: card
    topic: labs
    front: In an osteopenic patient, an abnormal blood count or protein electrophoresis raises what possibility?
    back: A malignancy involving the bone marrow.
    src: { page: 220, quote: "any abnormality in blood count or protein electrophoresis raises the possibility of a malignancy involving the bone marrow." }
    status: unverified
  - id: dm.L17.046
    kind: table
    topic: labs
    title: Labs in primary osteoporosis
    columns: [Test, Result]
    rows:
      - ["Electrolytes, BUN, creatinine", Normal]
      - [Serum and urine calcium, Usually normal]
      - [Serum phosphate and alkaline phosphatase, Normal]
      - ["Vitamin D, 25-OH and 1,25-(OH)2 cholecalciferol", Normal; may be low from age-related changes]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 220, quote: "In primary osteoporosis, serum phosphate and alkaline phosphatase values are also normal." }
    status: unverified
    tags: [high-yield]
  - id: dm.L17.047
    kind: card
    topic: labs
    front: Why may vitamin D levels be low in primary osteoporosis even though they are "normal" for the disease?
    back: Age-related changes in vitamin D metabolism.
    src: { page: 220, quote: "are normal in primary osteoporosis but may be low because of age-related changes in vitamin D metabolism." }
    status: unverified
  - id: dm.L17.048
    kind: enumerate
    topic: labs
    prompt: Which metabolic markers of bone turnover does the lecture say are under investigation?
    points:
      - Serum osteocalcin
      - Urinary pyridinium and deoxypyridinium
      - Urinary hydroxyproline
    pass: 3
    src: { page: 220, quote: "The use of metabolic markers, such as serum osteocalcin, urinary excretion of pyridinium and deoxypyridinium, and urinary hydroxyproline" }
    status: unverified
  - id: dm.L17.049
    kind: mcq
    topic: labs
    stem: A 66-year-old woman has a vertebral fracture and osteopenia. CBC shows a normocytic anemia and serum protein electrophoresis shows a monoclonal band. What does this suggest?
    options:
      - A malignancy involving the bone marrow, such as multiple myeloma
      - Primary postmenopausal osteoporosis
      - Osteomalacia from vitamin D deficiency
      - Type 2 senile osteoporosis
      - A normal finding in primary osteoporosis
    answer: 0
    why:
      - "Correct: abnormal counts or electrophoresis in osteopenia raise marrow malignancy (p220); myeloma is in Table 258-2."
      - In primary osteoporosis the routine labs are normal.
      - Osteomalacia does not explain a monoclonal band.
      - Senile osteoporosis has normal blood counts.
      - Primary osteoporosis has no characteristic laboratory abnormality.
    src: { page: 220, quote: "any abnormality in blood count or protein electrophoresis raises the possibility of a malignancy involving the bone marrow." }
    status: unverified
  - id: dm.L17.050
    kind: mcq
    topic: labs
    stem: Which result fits primary osteoporosis?
    options:
      - Normal calcium, phosphate and alkaline phosphatase
      - Low calcium and high alkaline phosphatase
      - High calcium and low phosphate
      - High creatinine and high phosphate
      - Monoclonal band on electrophoresis
    answer: 0
    why:
      - "Correct: in primary osteoporosis calcium, phosphate and ALP are normal (p220)."
      - Suggests osteomalacia.
      - Suggests hyperparathyroidism.
      - Suggests chronic renal failure.
      - Suggests myeloma.
    src: { page: 220, quote: "In primary osteoporosis, serum phosphate and alkaline phosphatase values are also normal." }
    status: unverified
  # ---------- p220-221: radiology ----------
  - id: dm.L17.051
    kind: cloze
    topic: radiology
    text: "Radiolucency, the hallmark of osteopenia on plain X-ray, cannot be reliably detected until at least {{c1::30%}} of bone mass is lost."
    src: { page: 220, quote: "it cannot be reliably detected until at least 30% of the bone mass is lost." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L17.052
    kind: card
    topic: radiology
    front: Most common clue to osteoporosis in an asymptomatic postmenopausal woman?
    back: Incidental skeletal osteopenia on a chest X-ray.
    src: { page: 220, quote: "incidental skeletal osteopenia on a chest x-ray is the most common clue to osteoporosis in asymptomatic postmenopausal women." }
    status: unverified
  - id: dm.L17.053
    kind: card
    topic: radiology
    front: Why do the vertical trabeculae of osteoporotic vertebrae look more prominent?
