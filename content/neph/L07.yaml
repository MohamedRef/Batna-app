    front: How do somatostatin analogues act in polycystic disease, and why are analogues used?
    back: Somatostatin inhibits cAMP build-up in kidney and liver. Native somatostatin lasts about 3 minutes, so stable analogues (octreotide, lanreotide, pasireotide) are used.
    src: { page: 163, quote: "Somatostatin acting on somatostatin receptors inhibits cAMP accumu- lation not only in the kidney but also in the liver. Somatostatin has a half-life of approximately 3 minutes, so more stable synthetic peptides (octreotide, lanreotide, pasireotide) have been developed for clinical use, which vary in stability and receptor affinity. In preclinical studies, Orthologous to ARPKD and ADPKD. Three small RCTs of octreotide or lanreotide have been completed39-41 and extended as open-label, uncontrolled studies, 42-44 with similar results. Kidney growth is halted during the first year of treatment and then resumes, possibly at a lower rate than without treatment. Liver volume decreases by 4% to 6% during (mTOR) Inhibitors." }
