        page: 360
        title: "التمن غالي"
        quote: "deaths (13.3% vs. 4.2%), and a longer intensive care unit stay of 2.1 days than did women without pregnancy- related AKI. Pregnancy-related AKI was also associated with a 1.5-fold higher likelihood of cesarean deliveries, a 1.3-fold high likelihood of hemorrhage, a 1.9- fold higher likelihood of HELLP (21) syndrome, and a 2.0-fold higher likelihood of placental abruption. A recent study from the United States reported a 13.5-fold higher likelihood of inpatient mortality and a 10-fold higher likelihood of cardiovascular events with pregnancy-related AKI hospitalizations as compared to hospitalizations with no AKI. Of all pregnancy-related AKI hospitalizations, 8.9% required acute dialysis. As compared to non-AKI pregnancy-related hospitalizations, pregnancy-related AKI requiring acute dialysis was associated with a 32-fold (5) higher adjusted odds. AKI during pregnancy increases the risk of progression to chronic kidney disease and ESKD. About 2.4% of women with (21) pregnancy-related AKI progress to ESKD needing dialysis. A Canadian study showed that 1 in 10000 pregnancies were complicated by AKI needing dialysis and 3.9% remained on dialysis four months after delivery. Women with pregnancy- related AKI needing dialysis initiation had a 3.4 fold higher risk of low birth weight, small for gestational age, or preterm birth as compared to the (22) general population. Pregnancy-related AKI is associated with a lower mean gestational age at delivery (−0.70 week), lower mean birth weight (−740 grams), and a 3.4-fold higher likelihood of stillbirths and perinatal deaths as compared to (21) women without pregnancy-related AKI. Since routine monitoring of serum creatinine is not done prior to or during pregnancy, there is a need for continued research on early recognition and treatment of AKI. Early identification of AKI in pregnancy may reduce fetal and maternal mortality and lessen the risk of developing ESKD later in life."
        text: |
          في الـ meta-analysis بتاعة Liu:
          - وفيات الأم ==13.3%== مقابل 4.2%، و intensive care unit (ICU) أطول بيومين.
          - Cesarean ×1.5، نزيف ×1.3، haemolysis, elevated liver enzymes, low platelets (HELLP) ×1.9، **abruption ×2**.
          - الجنين: يتولد أبدري بـ 0.7 أسبوع، أخف بـ **740 g**، و stillbirth ×3.4.

          وحوالي ==2.4%== بيوصلوا لـ **end-stage kidney disease (ESKD)** ومحتاجين dialysis.
      - kind: explain
        page: 361
        title: "مفيش criteria خاصة: تابع الـ trend"
        quote: "Diagnosis of AKI in pregnancy The diagnosis of AKI in pregnancy is not standardized in clinical practice due to inconsistency in the definition of pregnancy-related AKI and non-validation of the KDIGO (Kidney Disease Improving Outcomes) guidelines, RIFLE (Risk, Injury, Failure, Loss and End-stage) and the AKIN (Acute Kidney Injury Network) criteria for the non-pregnant population in pregnant women.(9) Furthermore, detection AKI is confounded by the physiological lowering of serum creatinine due to glomerular hyper filtration in pregnancy. For instance, an increase in serum creatinine concentration by 0.4 mg/dl, consistent with stage 1 in the AKIN criteria, may point towards significant kidney injury. Currently, there are no distinct criteria for the diagnosis of AKI in pregnancy. Attention should be paid to trends in serum creatinine levels in pregnancy, and even small changes in creatinine are sensitive in picking up early kidney injury in specific clinical settings. For example, in a woman with new onset hypertension, concomitant increase in serum creatinine by 0.3 mg/dl with increases in liver enzymes and thrombocytopenia, represents AKI and requires close follow of kidney function.(23) Initial evaluation for AKI should start with a comprehensive review of the patient's history of CKD, chronic hypertension, diabetes, preeclampsia in prior pregnancies, systemic lupus erythematous, and preexisting glomerular diseases. The onset of AKI during pregnancy by trimester can point towards the underlying etiology. While hyperemesis gravidarum and septic abortions are common causes of AKI in the first trimester, majority of AKI occurring in the second and trimester are specific to a pregnancy complication of preeclampsia, HELLP syndrome, AFLP, thrombotic microangiopathies like TTP, and placental abruptio. Atypical HUS and NSAID's induced kidney injury are common causes of AKI in the postpartum period. Diagnostic evaluation should include urinalysis, urine microscopy, comprehensive metabolic panel, coagulation panel, and appropriate serological workup along with a thorough review of medications. Serum complement levels can be elevated in pregnancy due to increased synthesis by the"
        text: |
          طلعة **0.4 mg/dL** (يعني Acute Kidney Injury Network (AKIN) stage 1 بس) ممكن تبقى إصابة كبيرة في الحمل.

          مثال الكتاب: ضغط جديد + كرياتينين طلع ==0.3 mg/dL== + إنزيمات كبد عالية + صفائح واطية = **acute kidney injury (AKI)** ومحتاجة متابعة قريبة.
      - kind: explain
