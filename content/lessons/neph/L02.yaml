  - id: neph.L02.lesson11
    title: "الـ SGLT2i وأدوية السكر"
    hook: "دوا سكر بقى دوا كلى، حتى في اللي ماعندوش سكر. اعرف ليه، وإمتى يقعد على الدكة."
    minutes: 10
    pages: [49, 53]
    topics: [sglt2i]
    goals:
      - "تعرف مؤشرات الـ SGLT2i وإزاي بيحمي الكلية"
      - "تتعامل مع الـ eGFR dip وتعرف إمتى توقفه مؤقتًا"
      - "تختار أدوية السكر حسب الـ eGFR"
    status: unverified
    steps:
      - kind: table
        page: 49
        quote: "Indication SGLT2i in CKD\nCKD (G1–G4) /min\n| Albuminuria category | Diabetes | No diabetes |\n|---|---|---|\n| A1 | Recommended (1A) | Suggested in eGFR ≥20 to 45 ml/min per 1.73 m2 & urine ACR <200 mg/g (2B). |\n| A2 | Recommended (1A) | Suggested in eGFR ≥20 to 45 ml/min per 1.73 m2 & urine ACR <200 mg/g (2B). |\n| A3 | Recommended (1A) | Recommended in ACR ≥200 mg/g (1A). |"
        title: "مين ياخد SGLT2i؟"
        columns: [Patient, Strength]
        rows:
          - ["Diabetes, any albuminuria (A1–A3)", "1A recommend"]
          - ["No diabetes, ACR ≥ 200", "1A recommend"]
          - ["No diabetes, eGFR 20–45, ACR < 200", "2B suggest"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 49
        quote: "3.6. Sodium-glucose contransporter-2 inhibitors (SGLT2i)"
        title: "الـ SGLT2i بيحمي الكلية إزاي؟"
        text: |
          الكتاب في ص 50–51 بيقول إن الـ SGLT2 inhibition بيعمل ==afferent constriction== فبيقلّل الـ intraglomerular pressure والـ hyperfiltration.

          التفسير المقبول (مش في الكتاب) للي بيحصل قبلها: الـ SGLT2 في الـ proximal tubule بيمص glucose ومعاه Na. لما نقفله، Na أكتر بيكمّل لحد الـ **macula densa**. الـ macula densa تفهم إن الفلترة زيادة، فتضيّق الـ afferent (ده الـ ==tubuloglomerular feedback== اللي كان مقفول في السكر).

          علشان كده الدوا بيحمي الكلية **حتى في مرضى مش عندهم سكر**، وحتى لما الـ eGFR يبقى واطي والدوا مابقاش بينزّل السكر قوي.
      - kind: check
        page: 49
        quote: "3.6. Sodium-glucose contransporter-2 inhibitors (SGLT2i) Continue SGLT2i even if the eGFR falls below 20 ml/min per 1.73 m2, unless it is not tolerated or KRT is initiated."
        question: "A patient on empagliflozin now has eGFR 17, tolerating it, not on dialysis. What now?"
        options:
          - "Continue it until KRT is started"
          - "Stop it: eGFR below 20"
          - "Switch to metformin"
          - "Halve the dose"
        answer: 0
        why:
          - "صح: كمّل تحت 20 لحد ما يبدأ kidney replacement therapy (KRT) أو ميستحملش."
          - "الـ 20 حد **البدء** بس، مش الإيقاف."
          - "الـ metformin يتوقف تحت 30."
          - "الـ dose ثابتة (10 mg)."
      - kind: mnemonic
        page: 49
        quote: "Reasonable to withhold SGLT2i during times of prolonged fasting, surgery, or critical medical illness (when people may be at greater risk for ketosis)."
        word: "FSC"
        parts:
          - { key: "F", text: "Fasting (prolonged)" }
          - { key: "S", text: "Surgery" }
          - { key: "C", text: "Critical illness" }
        hook: "**F-S-C**: صيام، عملية، أو مرض شديد؟ الـ SGLT2i يقعد على الدكة لحد ما الأزمة تعدي، علشان خطر الـ ketosis. ⚽"
      - kind: explain
        page: 49
        quote: "Reasonable to withhold SGLT2i during times of prolonged fasting,"
        title: "ليه نوقفه في الصيام والعمليات؟"
        text: |
          الكتاب: معقول توقفه في **prolonged fasting** و **surgery** و **critical medical illness**، لأن المريض وقتها عنده خطر **ketosis** أكبر.

          التفسير المقبول (مش في الكتاب): الدوا بيرمي glucose في البول، فالـ insulin بيقل والـ glucagon بيعلى، والجسم يحرق دهون ويعمل ketones. ومع الصيام أو العملية أو العدوى، ده بيزيد. والمصيبة إن السكر ممكن يبقى **شبه طبيعي** (==euglycemic ketoacidosis==)، فمحدش بيشك بدري.

          ومرتبط بـ L01: دي high AG metabolic acidosis، والـ ketones هي الـ unmeasured anion.
      - kind: aside
        page: 50
        quote: "SGLT2i initiation or use does not necessitate alteration of frequency of CKD monitoring → the reversible decrease in eGFR on initiation is generally not an indication to discontinue therapy."
        tone: trap
        text: "الـ eGFR بينزل شوية أول ما تبدأ SGLT2i (dip). ده **مش** سبب توقفه، ومش محتاج تغيّر مواعيد المتابعة. ده دليل إن الضغط جوه الـ glomerulus نزل. ✅"
      - kind: explain
        page: 51
        quote: "Delays ESKD by 15 years"
        title: "الاتنين مع بعض"
        text: |
          رسمة ص 51 بتقارن: الـ **RAAS blockade** = efferent dilation، والـ **SGLT2 inhibition** = afferent constriction، ومع بعض = تأثير ممكن يبقى **additive** على الضغط جوه الـ glomerulus.

          والأرقام في نفس الصفحة: بعد الـ initial eGFR dip، الـ eGFR بينزل حوالي ==4.6 mL/min في السنة== على RAASi لوحده، وحوالي ==1.85 mL/min في السنة== على الاتنين، وده **Delays ESKD by 15 years**.

          التفسير المقبول (مش في الكتاب) للـ dip: الضغط جوه الـ glomerulus نزل، فالفلترة تقل شوية **فورًا**. ده زي ما تخفّف الحمل على عربية: بتمشي أبطأ شوية بس بتعيش أطول.

          **يعني** كل دوا بيقلّل الضغط جوه الـ glomerulus من ناحية: واحد بيوسّع اللي خارج، والتاني بيضيّق اللي داخل، **فـ** الأثر بيتجمع.
      - kind: figure
        page: 51
        quote: "SGLT2 vs RAAS Inhibition or Combined Therapy\nComparative Effect on Renal Segmental Resistances\n| Pharmacological actions | Hemodynamic effects and clinical implications |\n| RAAS blockade: Efferent dilation | Decreased intraglomerular pressure due to increased efferent resistance; Decreased hyperfiltration; Proven renal protection in clinical trials |\n| SGLT2 inhibition: Afferent constriction | Decreased intraglomerular pressure due to increased afferent resistance in T1D-H patients; Decreased hyperfiltration |\n| RAAS blockade and SGLT2 inhibition: Efferent dilation and Afferent constriction | Normalization of intraglomerular pressure due to increased afferent and decreased efferent resistance?; Potential for additive intraglomerular pressure reduction?; Potential for long-term renal protection? |"
        title: "الحنفية من الناحيتين"
        alt: "A glomerulus with an afferent arteriole on the left and an efferent arteriole on the right. An SGLT2i label points to the afferent side: constriction. A RAASi label points to the efferent side: dilation. Both lower the pressure inside the glomerulus."
        caption: "الـ **SGLT2 inhibitor (SGLT2i)** بيضيّق الـ **afferent** (الداخل)، والـ **RAAS inhibitor (RAASi)** بيوسّع الـ **efferent** (الخارج). الاتنين بيقللوا الضغط جوه الـ glomerulus، ومع بعض بيأخروا الـ end-stage kidney disease (ESKD) حوالي **15 سنة**."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="88" width="100" height="10" rx="4" class="fg-good"/>
            <text x="60" y="80" text-anchor="middle" class="t-sm t-b">Afferent</text>
            <text x="60" y="122" text-anchor="middle" class="t-sm t-good">SGLT2i: constrict</text>
            <circle cx="165" cy="93" r="40" class="fg-acc"/>
            <text x="165" y="89" text-anchor="middle" class="t-sm">↓ glomerular</text>
            <text x="165" y="104" text-anchor="middle" class="t-sm">pressure</text>
            <rect x="215" y="80" width="105" height="26" rx="6" class="fg-good"/>
            <text x="267" y="72" text-anchor="middle" class="t-sm t-b">Efferent</text>
            <text x="267" y="128" text-anchor="middle" class="t-sm t-good">RAASi: dilate</text>
            <rect x="40" y="152" width="250" height="34" rx="8" class="fg-thin"/>
            <text x="165" y="174" text-anchor="middle" class="t-sm t-b">Together: ESKD delayed ≈ 15 years</text>
          </svg>
      - kind: explain
        page: 52
        quote: "Nephroprotective effects of SGLT2is"
        title: "فوايد تانية غير الضغط جوه الـ glomerulus"
        text: |
          ص 52 (**Nephroprotective effects of SGLT2is**) بتعدّ فوايد تانية: **تحسّن شغل القلب** ويحافظ على الـ **renal perfusion**، يقلّل الـ **arterial stiffness**، يقلّل الـ **albuminuria** وتأثيرها السام على الـ tubules، ==يقلّل الـ hyperkalemia==، **يحسّن الأنيميا**، و**يقلّل الـ uric acid**.

          التفسير المقبول (مش في الكتاب) لكام واحدة:

          - الـ **K** بيقل لأن Na ومية أكتر بيوصلوا للـ distal tubule، فالـ K بيتفرز أكتر. فده بيساعد تكمّل الـ RAASi.
          - الـ **anemia** بتتحسن لأن الـ tubules اللي ارتاحت بتعمل erythropoietin أكتر.
          - الـ **uric acid** بيقل لأن الدوا بيزوّد خروجه في البول.

          وفي نفس الصفحة الـ **practical provider guide**: قيّم الـ **volume** قبل ما تبدأ، و**توقّع** نزول حاد في الـ eGFR.
      - kind: check
        page: 52
        quote: "Nephroprotective effects of SGLT2is"
        question: "Which effect is NOT listed among the nephroprotective effects of SGLT2 inhibitors?"
        options:
          - "Raising serum potassium"
          - "Reducing albuminuria"
          - "Improving anemia"
          - "Decreasing uric acid"
        answer: 0
        why:
          - "صح: بالعكس، الكتاب قال reduce hyperkalemia."
          - "مذكور."
          - "مذكور."
          - "مذكور."
      - kind: table
        page: 53
        quote: "Glucose-lowering therapies in patients with T2D and CKD\nLifestyle therapy: Physical activity; Nutrition; Weight loss\nFirst-line therapy: Metformin + SGLT-2 inhibitor\n  Metformin\n    eGFR < 45: Reduce dose\n    eGFR < 30: Discontinue\n    Dialysis: Discontinue\n  SGLT-2 inhibitor\n    eGFR < 20: Do not initiate\n    Dialysis: Discontinue\nAdditional drug therapy as needed for glycemic control\n  GLP-1 receptor agonist (preferred)\n  DPP-4 inhibitor; Insulin; Sulfonylurea; TZD; Alpha-glucosidase inhibitor\n  Guided by patient preferences, comorbidities, eGFR, and cost\n  Includes patients with eGFR < 30 ml/min per 1.73 m2 or treated with dialysis"
        title: "أدوية السكر مع الـ eGFR"
        columns: [Drug, Rule]
        rows:
          - ["Metformin", "Reduce < 45; stop < 30 and on dialysis"]
          - ["SGLT2i", "Do not start < 20; stop on dialysis"]
          - ["Add-on", "GLP-1 RA preferred"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 53
        quote: "Glucose-lowering therapies in patients with T2D and CKD"
        title: "أدوية السكر: ليه الأرقام دي؟"
        text: |
          الرسمة في ص 53 (**glucose-lowering therapies**): **lifestyle** الأول، وبعدين **metformin + SGLT2i** first-line، والـ **GLP-1 RA** المفضّل لو محتاج دوا زيادة.

          التفسير المقبول (مش في الكتاب):

          - الـ ==metformin== بيطلع من الكلية. لما الـ eGFR يقل بيتجمع ويزوّد خطر الـ **lactic acidosis**، علشان كده **قلّل تحت 45 ووقّف تحت 30**.
          - الـ **SGLT2i** مابيتبدأش تحت 20 لأن فايدته على السكر والكلية مااتثبتتش هناك، بس لو بدأ قبلها يكمّل.
          - الـ **GLP-1 RA** بينزّل السكر والوزن ومالوش خطر hypoglycaemia كبير ومابيتجمّعش في الكلية.
          - كل الاختيارات حسب رأي المريض، الأمراض التانية، الـ eGFR والتكلفة (الكتاب).
