  # ---------- p382-385: transplant fertility, graft and pregnancy risks ----------
  - id: neph.L11.161
    kind: card
    topic: tx-risk
    front: How does a successful kidney transplant restore fertility?
    back: The hypothalamic-pituitary-ovarian dysfunction remits; LH, FSH and prolactin fall and estrogen rises by the end of the first year, with return of menses and ovulation.
    src: { page: 382, quote: "Infertility in women with CKD post-transplantation A successful renal transplant restores ovulation due to remission of hypothalamus– pituitary–ovarian axis dysfunction, as there are significant declines in luteinizing hormone, follicle-stimulating hormone, and prolactin levels, and a rise in estrogen levels by the end of the first year, with the restoration of menses and ovulation. However, 20% of ESRD patients might" }
    status: unverified
  - id: neph.L11.162
    kind: cloze
    topic: tx-risk
    text: "After transplant, {{c1::20%}} of ESRD patients may have premature ovarian failure, and up to {{c2::31%}} do not regain their menses."
    src: { page: 383, quote: "develop premature ovarian failure. As many as 31% of women with end-stage kidney disease do not regain their menses after a renal transplant. (89) With the restoration of fertility in most, pregnancy can occur incidentally and rapidly posttransplant. In such circumstances, any unplanned pregnancy poses a great risk to both the mother and the child, as well as to the allograft. Therefore, such high risk should be conveyed to all female transplant recipients in the childbearing age group and their partners during the counseling process to help them in decision-making." }
    status: unverified
    tags: [numbers]
  - id: neph.L11.163
    kind: card
    topic: tx-risk
    front: Why must every transplant recipient of childbearing age be counseled early?
    back: Fertility returns quickly, so an unplanned pregnancy can happen and puts the mother, the child and the graft at great risk.
    src: { page: 383, quote: "develop premature ovarian failure. As many as 31% of women with end-stage kidney disease do not regain their menses after a renal transplant. (89) With the restoration of fertility in most, pregnancy can occur incidentally and rapidly posttransplant. In such circumstances, any unplanned pregnancy poses a great risk to both the mother and the child, as well as to the allograft. Therefore, such high risk should be conveyed to all female transplant recipients in the childbearing age group and their partners during the counseling process to help them in decision-making." }
    status: unverified
  - id: neph.L11.164
    kind: card
    topic: tx-risk
    front: Does pregnancy harm long-term allograft survival?
    back: No, as long as baseline graft function is excellent.
    src: { page: 383, quote: "The impact of pregnancy on allograft survival Based on many published data, pregnancy does not negatively impact long-term allograft function or survival as long as the baseline function of the allograft is excellent. For women with a serum creatinine of 1.5 mg/dl or lesser, 90% of pregnancies were reported to be successful. In contrast, when a baseline creatinine is 1.8–2 mg/dl or higher, allograft loss is more likely to occur typically within 2 years after conception.(90)" }
    status: unverified
    tags: [high-yield]
