  - id: neph.L03.lesson4
    title: "CRS 2 لـ 5: الدايرة المفرغة"
    hook: "في الـ CRS المزمن كل عضو بيرمي التاني، والدايرة مش بتقف لوحدها."
    minutes: 8
    pages: [70, 71]
    topics: [pathogenesis]
    goals:
      - "تشرح أسهم الـ CRS-2 في الاتجاهين وليه"
      - "تعرف إزاي الـ AKI بيوقّع القلب (CRS-3)"
      - "ترتّب عوامل الـ CRS-4 حسب الـ stage، وتعرف الـ CRS-5"
    status: unverified
    steps:
      - kind: explain
        remind: [neph.L03.022, neph.L03.024]
        page: 70
        title: "CRS-2 و CRS-3"
        quote: "Figure 2: Mechanism of damage in CRS-2. CKD, chronic kidney disease; CRS, cardiorenal syndrome.\nChronic Heart Disease\n  Genetic predisposition, Environmental risk factors → Normal Kidney Function\n  Low Cardiac Output, Inflammation, Arterial calcification, Endothelial calcification → Initiation of Kidney Damage\n  Chronic hypoperfusion, Increased venous pressure, Increased venous resistance → Progression to CKD\nNormal Kidney Function → (Chronic hypofusion, Apoptosis) → Initiation of Kidney Damage → (Sclerosis-Fibrosis) → Progression to CKD\nKidney → Anemia, Hypertension, Electrolyte imbalance → Chronic Heart Disease"
        text: |
          **CRS-2 (chronic heart disease):** **low cardiac output**، **chronic hypoperfusion** و ==increased venous pressure== ومعاهم inflammation و arterial/endothelial calcification. الكلى بتمشي: **normal** ← **initiation of damage** (hypoperfusion، apoptosis) ← **progression to CKD** (sclerosis-fibrosis).

          وبعدين الكلى ترد: **anemia، hypertension، electrolyte imbalance** يرجعوا يتعبوا القلب.

          **CRS-3 (AKI أولًا):** electrolyte و coagulation imbalances، **hypertension** (↓glomerular filtration rate (GFR) ← Na و water retention ← ↑preload)، **sympathetic** و **renin–angiotensin–aldosterone system (RAAS) activation**، و humoral ← endothelial ← cytokines.

          الخطوات الجاية بتشرح **ليه** كل سهم من دول بيحصل.
      - kind: explain
        page: 70
        quote: "Figure 2: Mechanism of damage in CRS-2. CKD, chronic kidney disease; CRS, cardiorenal syndrome.\nChronic Heart Disease\n  Genetic predisposition, Environmental risk factors → Normal Kidney Function\n  Low Cardiac Output, Inflammation, Arterial calcification, Endothelial calcification → Initiation of Kidney Damage\n  Chronic hypoperfusion, Increased venous pressure, Increased venous resistance → Progression to CKD\nNormal Kidney Function → (Chronic hypofusion, Apoptosis) → Initiation of Kidney Damage → (Sclerosis-Fibrosis) → Progression to CKD\nKidney → Anemia, Hypertension, Electrolyte imbalance → Chronic Heart Disease"
        title: "CRS-2: ليه الدايرة مش بتقف؟"
        text: |
          الكتاب بيرسم الـ CRS-2 في اتجاهين: القلب بيتعب الكلية (low cardiac output، chronic hypoperfusion، increased venous pressure)، والكلية بترجع تتعب القلب (anemia، hypertension، electrolyte imbalance).

          التفسير المقبول (مش في الكتاب) لكل سهم:

          - **Low output:** الكلية بتحس إن الدم قليل، **فـ** تشغّل الـ RAAS والـ sympathetic وتحبس صوديوم ومية، والـ volume ده يرجع على قلب أصلًا تعبان.
          - **Venous pressure عالي:** الكلية جوه كبسولة. الضغط الوريدي بيعلّي الضغط جوه الكلية نفسها، **فـ** الـ filtration يقل.
          - **Anemia:** الكلية التعبانة بتعمل EPO أقل. الأنيميا **بتخلّي** القلب يدق أسرع ويضخ أكتر علشان يوصّل أكسجين، ومع الوقت يحصل hypertrophy.
          - **Hypertension:** afterload أعلى = شغل أكتر على البطين.
          - **Electrolytes:** الـ K اللي بيعلى أو يقع **بيسبب** arrhythmias في قلب ضعيف.
      - kind: figure
        page: 70
        quote: "Figure 2: Mechanism of damage in CRS-2. CKD, chronic kidney disease; CRS, cardiorenal syndrome.\nChronic Heart Disease\n  Genetic predisposition, Environmental risk factors → Normal Kidney Function\n  Low Cardiac Output, Inflammation, Arterial calcification, Endothelial calcification → Initiation of Kidney Damage\n  Chronic hypoperfusion, Increased venous pressure, Increased venous resistance → Progression to CKD\nNormal Kidney Function → (Chronic hypofusion, Apoptosis) → Initiation of Kidney Damage → (Sclerosis-Fibrosis) → Progression to CKD\nKidney → Anemia, Hypertension, Electrolyte imbalance → Chronic Heart Disease"
        title: "شكل 2 في الكتاب: CRS-2"
        image: { file: neph/L03-crs2-mechanism.webp, book: true }
        alt: "Book Figure 2, mechanism of damage in CRS-2: chronic heart disease at the top, with three arrows down (genetic predisposition and environmental risk factors; low cardiac output, inflammation, arterial and endothelial calcification; chronic hypoperfusion and increased venous pressure and resistance) to a row: normal kidney function, initiation of kidney damage (chronic hypoperfusion, apoptosis), progression to CKD (sclerosis-fibrosis). Pink boxes on both sides, anemia, hypertension, electrolyte imbalance, carry arrows from the kidneys back up to the heart."
        caption: |
          - **فوق: Chronic Heart Disease**، و3 أسهم نازلة:
            - **شمال**: **Genetic predisposition** و risk factors.
            - **النص**: **Low cardiac output**، inflammation، و calcification.
            - **يمين**: **Chronic hypoperfusion** و **increased venous pressure**.
          - **تحت (البرتقاني)**: الكلية ماشية 3 خطوات: **Normal Kidney Function** ← **Initiation of Kidney Damage** (hypoperfusion، apoptosis) ← **Progression to CKD** (sclerosis-fibrosis).
          - **الصناديق الوردي على الجنبين**: **Anemia، Hypertension، Electrolyte imbalance**، والسهم منهم ==راجع لفوق للقلب==.

          يعني الـ CRS-2 دايرة مقفولة: القلب المزمن بيعمل CKD، والـ CKD بيرجّع ==أنيميا وضغط وأملاح== تتعب القلب أكتر.
      - kind: explain
        page: 70
        quote: "Figure 2: Mechanism of damage in CRS-2. CKD, chronic kidney disease; CRS, cardiorenal syndrome.\nChronic Heart Disease\n  Genetic predisposition, Environmental risk factors → Normal Kidney Function\n  Low Cardiac Output, Inflammation, Arterial calcification, Endothelial calcification → Initiation of Kidney Damage\n  Chronic hypoperfusion, Increased venous pressure, Increased venous resistance → Progression to CKD\nNormal Kidney Function → (Chronic hypofusion, Apoptosis) → Initiation of Kidney Damage → (Sclerosis-Fibrosis) → Progression to CKD\nKidney → Anemia, Hypertension, Electrolyte imbalance → Chronic Heart Disease"
        title: "CRS-3: ليه الـ AKI بيوقّع القلب؟"
        text: |
          الكتاب: في الـ CRS-3 الـ ↓GFR بيعمل **Na و water retention** ← **↑preload**، ومعاه **sympathetic** و **RAAS activation**، و electrolyte و coagulation imbalances.

          التفسير المقبول (مش في الكتاب):

          - **الـ preload:** المية اللي الكلية مش بتطلّعها بتروح الرئة، **فـ** يحصل pulmonary edema حتى في قلب كان كويس.
          - **الـ K:** الكلية هي اللي بتطلّع البوتاسيوم. لما تقف، الـ K يعلى **ويسبب** arrhythmias ممكن تكون قاتلة.
          - **الـ acidosis والـ uremia:** بيضعفوا انقباض عضلة القلب، **يعني** نفس الـ preload بقلب أضعف.
      - kind: figure
        page: 70
        quote: "Figure3: Mechanism of damage in CRS-3. CRS, cardiorenal syndrome; GFR, glomerular filtration rate; RAAS, renin-angiotensin-aldosterone system."
