      - "Energy ≥ 35 kcal/kg (non-obese) و protein 1.2–1.5 g/kg على الـ actual BW المصحح للـ ascites."
      - "3 وجبات + 3 سناكس؛ الـ **late-evening snack** أهمهم. والـ decompensated malnourished: late-evening ONS + breakfast."
