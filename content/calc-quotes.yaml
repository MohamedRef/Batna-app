    quote: |-
      In patients with cACLD due to untreated viral hepatitis, HIV-HCV coinfection, alcohol, NAFLD, PBC and PSC, the finding of LSM by TE <20 kPa and platelet count >150 G/L (Baveno VI criteria) is a validated tool to rule-out high-risk varices and avoid endoscopic screening. These criteria should be used whenever TE is available (LoE 1a; strong recommendation).
