            <text x="240" y="210" text-anchor="middle" class="t-sm t-b">4 °C overnight</text>
            <text x="240" y="88" text-anchor="middle" class="t-sm">cream</text>
            <text x="240" y="146" text-anchor="middle" class="t-sm">clear</text>
            <text x="165" y="20" text-anchor="middle" class="t-sm t-mut">Chylomicrons float to the top</text>
          </svg>
      - kind: explain
        page: 270
        title: "التحاليل والعلاج"
        quote: "Marked decrease in dietary fat (to as little as 15 g/d) with fat-soluble vitamin supplementation."
        text: |
          **التحاليل**: serum لبني، طبقة قشطة فوق serum رايق في 4 °C، **chylomicrons** في الـ lipogram، و TG عالي.

          **العلاج**: الدهون في الأكل تنزل لـ ==15 g/day== بس، مع **fat-soluble vitamins** (A، D، E، K). والـ **fish oils** نفعت مع بعض العيانين.
