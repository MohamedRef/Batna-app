        page: 468
        quote: "Thrombotic microangiopathy: Microangiopathic hemolytic anemia: decreased hemoglobin and serum haptoglobin, elevated serum LDH, ±schistocytes on smear; Thrombocytopenia: less than 150,000 /uL or >25% decrease of baseline; End organ damage: kidney, brain, heart, lung, etc\n  ADAMTS13 activity\n    <10% → Thrombotic thrombocytopenic purpura\n    >10% → Non-TTP thrombotic microangiopathy\n      Co-existing diseases\n        Yes → Secondary thrombotic microangiopathy\n          Infections: S. pneumonia, HIV, influenza, others\n          Medications: Calcineurin inhibitors, mTOR inhibitors; Chemotherapeutic agents: mytomycin C, gemcitabine, cisplatin; VEGF and tyrosin inhibitors; Others\n          Malignant hypertension\n          Pregnancy/ HELLP syndrome\n          Autoimmune diseases: Systemic lupus erythematosus; Anti-phospholipid syndrome; Scleroderma; Others\n          Bone marrow/ solid organ transplant\n          Inborn error of metabolism: Methylmalonic acidemia; Vitamin B12 deficiency\n        No → Shiga toxin/ Shiga toxin-producing E. coli (STEC)\n          Yes → STEC-hemolytic uremic syndrome\n          No → Atypical hemolytic uremic syndrome"
