  # ---------- p303-304: antithrombotics ----------
  - id: git.L11.045
    kind: card
    topic: antithrombotics
    front: "Low-dose aspirin for PRIMARY prophylaxis in a patient with acute UGIH: what to do?"
    back: Interrupt it temporarily, then restart only after careful re-evaluation of the indication.
    src: { page: 303, quote: "Management of antithrombotic agents (antiplatelet agents) and anticoagulants): In patients with acute UGIH who are taking low dose aspirin as monotherapy for primary cardiovascular prophylaxis, aspirin should be temporarily interrupted. Aspirin can be restarted after careful re-evaluation of its clinical indication. In patients with acute UGIH who are taking low dose aspirin as monotherapy for secondary cardiovascular prophylaxis, aspirin should not be interrupted." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.046
    kind: card
    topic: antithrombotics
    front: "Low-dose aspirin for SECONDARY prophylaxis in acute UGIH: what to do?"
    back: Do not interrupt it. If it is interrupted for any reason, restart as soon as possible, preferably within 3-5 days.
    src: { page: 303, quote: "If for any reason it is interrupted, aspirin should be restarted as soon as possible, preferably within 3–5 days. In patients with acute UGIH who are taking dual antiplatelet therapy (DAPT) for secondary cardiovascular prophylaxis, aspirin should not be interrupted. The second antiplatelet agent should be interrupted, but restarted as soon as possible, preferably within 5 days." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.047
    kind: card
    topic: antithrombotics
    front: "Dual antiplatelet therapy (secondary prophylaxis) in acute UGIH: what to do?"
    back: Continue aspirin. Interrupt the second antiplatelet agent and restart it as soon as possible, preferably within 5 days.
    src: { page: 303, quote: "If for any reason it is interrupted, aspirin should be restarted as soon as possible, preferably within 3–5 days. In patients with acute UGIH who are taking dual antiplatelet therapy (DAPT) for secondary cardiovascular prophylaxis, aspirin should not be interrupted. The second antiplatelet agent should be interrupted, but restarted as soon as possible, preferably within 5 days." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.048
    kind: card
    topic: antithrombotics
    front: "VKA (warfarin) in acute UGIH with hemodynamic instability: what to give?"
    back: Withhold the vitamin K antagonist (VKA) and give low-dose vitamin K plus IV prothrombin complex concentrate (PCC), or fresh frozen plasma (FFP) if PCC is not available.
    src: { page: 303, quote: "In patients with acute UGIH taking vitamin K antagonists (VKAs) the anticoagulant be withheld, If the patient hemodynamic instability, low dose vitamin K supplemented with intravenous prothrombin complex concentrate (PCC), or fresh frozen plasma (FFP) if PCC is not" }
    status: unverified
    tags: [high-yield]
  - id: git.L11.049
    kind: card
    topic: antithrombotics
    front: "DOAC in acute UGIH: what to do?"
    back: Withhold the direct oral anticoagulant (DOAC) and do not delay endoscopy. In severe ongoing bleeding consider a DOAC reversal agent or IV prothrombin complex concentrate (PCC).
    src: { page: 304, quote: "in patients with acute UGIH taking direct oral anticoagulants (DOACs), the anticoagulant should be withheld and endoscopy not delayed. In patients with severe ongoing bleeding, use of a DOAC reversal agent or intravenous PCC should be considered." }
