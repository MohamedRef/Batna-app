      - kind: mnemonic
        page: 125
        quote: "Schönlein-Henoch purpura Names for Vasculitides Adopted by the 2011-2012 International Chapel Hill Consensus Conference Nomenclature of the Vasculitides Large Vessel Vasculitis (LVV)\nTakayasu Arteritis (TAK).\nGiant Cell Arteritis (GCA).\nMedium Vessel Vasculitis (MVV)\nPolyarteritis Nodosa (PAN).\nKawasaki Disease (KD)."
        word: "LMSV"
        parts:
          - { key: "L", text: "Large: Takayasu, giant cell arteritis" }
          - { key: "M", text: "Medium: PAN, Kawasaki" }
          - { key: "S", text: "Small: ANCA (MPA, granulomatosis with polyangiitis (GPA), eosinophilic granulomatosis with polyangiitis (EGPA)) + immune complex (anti-GBM, cryo, immunoglobulin A (IgA), anti-C1q)" }
          - { key: "V", text: "Variable: Behçet, Cogan" }
        hook: "**L-M-S-V** زي مقاسات التيشيرت: Large, Medium, Small... والـ **V** ده Behçet اللي بيلبس أي مقاس."
      - kind: reveal
        page: 125
        quote: "Names for Vasculitides Adopted by the 2011-2012 International"
        prompt: "ليه Chapel Hill 2012 بيقسّم حسب حجم الوعاء؟ إيه اللي الحجم بيقولهولك عن العيان؟"
        answer: |
          التفسير المقبول (مش في الكتاب): حجم الوعاء بيحدد **شكل الإصابة**:
          - **Large** (الـ aorta وفروعها): تضييق طويل ← **claudication** في الدراع، **pulselessness**، فرق ضغط، أو blindness من شريان العين.
          - **Medium** (شرايين الأعضاء): **aneurysms** و **infarcts**: كلية، أمعاء، nerve، testis.
          - **Small** (capillaries و venules و arterioles): **palpable purpura**، **glomerulonephritis**، **alveolar haemorrhage**، لأن دي الأماكن اللي فيها capillaries كتير.

          فلو العيان عنده GN و نزيف في الرئة، فكّر في ==small vessel== على طول، ولو عنده aneurysms في الكلية والأمعاء من غير GN، فكّر في **medium** (PAN).
      - kind: sort
        page: 126
        quote: "Vasculitis Associated with Probable Etiology\n  Hepatitis C Virus-Associated Cryoglobulinemic Vasculitis.\n  Hepatitis B Virus-Associated Vasculitis.\n  Syphilis-Associated Aortitis.\n  Drug-Associated Immune Complex Vasculitis.\n  Drug-Associated ANCA-Associated Vasculitis.\n  Cancer-Associated Vasculitis.\n  Others."
