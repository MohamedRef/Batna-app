    hook: "الـ X-ray بيحكي نفس قصة الـ pathology بالترتيب، والسائل بيقولك التهاب ولا تآكل ولا صديد."
    minutes: 7
    pages: [259, 259]
    topics: [xray-fluid]
    goals:
      - "ترتّب تغيّرات الـ X-ray من بدري لمتأخر وتعرف ليه"
      - "تقرا جدول الـ synovial fluid وتعرف كل خانة بتقول إيه"
    status: unverified
    steps:
      - kind: explain
        page: 259
        title: "الـ X-ray"
        quote: "X ray\n  Early: soft tissue swelling.\n  Periarticular osteoporosis.\n    More advanced:\n      Narrowing of joint spaces.\n      Marginal erosions.\n      Subluxations (malalignment).\n      Deformities."
        text: |
          - **بدري**: soft tissue swelling و ==periarticular osteoporosis==.
          - **بعدين**: joint space يضيق، ==marginal erosions==، subluxation، deformities.

          يعني البدري لسه التهاب ممكن يهدى، والمتقدّم ضرر دايم، علشان كده بنتابع الـ damage بالـ X-ray.
      - kind: figure
        page: 259
        quote: "More advanced:\n - Narrowing of joint spaces.\n - Marginal erosions.\n - Subluxations (malalignment).\n - Deformities."
        title: "الـ X-ray بيتغيّر إزاي"
        alt: "Two joints side by side. Early: soft tissue swelling around the joint and paler (osteoporotic) bone next to the joint, joint space normal. Advanced: narrowed joint space, bites taken out of the bone margins (marginal erosions) and the bones out of line (subluxation)."
        caption: "**بدري**: ورم في الـ soft tissue وعضم فاتح جنب المفصل (==periarticular osteoporosis==). **متأخر**: المسافة تضيق، والحواف تتاكل (**marginal erosions**)، والعضم يزوغ."
