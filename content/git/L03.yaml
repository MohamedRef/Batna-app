  - id: git.L03.183
    kind: card
    topic: ibs
    front: What role does serotonin (5-HT) play in IBS?
    back: It stimulates extrinsic afferents for central nervous system (CNS) pain perception and intrinsic afferents that trigger motor responses; it is a key mediator of visceral hypersensitivity and abnormal bowel motility.
