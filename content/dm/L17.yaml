schema: batna.content/v1
lecture: dm.L17
title: "Calcium metabolism and osteoporosis"
author: "Prof. Dr. Magui Shalash"
# The lecture covers osteoporosis only; it has no separate calcium-metabolism section.
book: { chapter: 6, pages: [214, 232] }
topics:
  - { id: definition, title: "Definition and the bones that break" }
  - { id: types, title: "Type 1 and type 2 osteoporosis" }
  - { id: peak-mass, title: "Peak bone mass" }
  - { id: secondary, title: "Secondary osteoporosis and glucocorticoids" }
  - { id: risk, title: "Risk factors and FRAX" }
  - { id: clinical, title: "Symptoms, history and examination" }
  - { id: labs, title: "Laboratory evaluation" }
  - { id: radiology, title: "Radiologic findings" }
  - { id: bmd, title: "Bone density measurement and screening" }
  - { id: nondrug, title: "Calcium, vitamin D, exercise and smoking" }
  - { id: drugs, title: "Antiresorptive and anabolic drugs" }
