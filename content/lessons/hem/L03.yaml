  - id: hem.L03.lesson2
    title: "الثلاسيميا: لما سلسلة تقل والتانية تزيد"
    hook: "مش المشكلة إن الـ β ناقصة بس. المشكلة إن الـ α الزيادة بتترسب وتموّت الكرة وهي لسه في النخاع."
    minutes: 9
    pages: [21, 25]
    topics: [thal-class, beta-major]
    goals:
      - "تعرّف الثلاسيميا وتقسمها بطريقتين"
      - "تشرح pathogenesis الـ β-thalassaemia major خطوة خطوة"
      - "تربط العضم والحديد والطحال بالـ pathogenesis، وتعرف التحاليل"
    status: unverified
    steps:
      - kind: explain
        page: 21
        title: "الثلاسيميا وتقسيمها"
        quote: "characterized by reduced or absent production of one of the globin chains"
        text: |
          الـ ==thalassaemias== أمراض وراثية في الـ Hb فيها إنتاج **سلسلة globin** واحدة **قليل أو معدوم**.

          بتتقسم بطريقتين:
          1. **نوع السلسلة الناقصة**: أشهرهم **α** و **β**.
          2. **الشدة الإكلينيكية**: major، intermedia، minor.
      - kind: table
        page: 22
        quote: "Thalassaemia intermedia is characterized by intermediate degree of severity of anaemia that does not require regular blood transfusions."
        title: "Major ولا intermedia ولا minor؟"
        columns: [Type, Transfusion]
        rows:
          - ["Major", "Regular, dependent"]
          - ["Intermedia", "None or intermittent"]
          - ["Minor", "None (mild or no anaemia)"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 22
        title: "Cooley's anaemia: الـ pathogenesis"
        quote: "leading to the lysis of erythroblasts and red cells in the bone marrow (ineffective erythropoiesis)"
        text: |
          الـ **β-thalassaemia major** (==Cooley's anaemia==) أشد نوع:
          1. الخلية مش قادرة تعمل **β chains** كفاية.
          2. الـ **α chains** الحرة تتراكم.
          3. تترسب جوّه الـ erythroblasts والكرات، فتموت **في النخاع**: ==ineffective erythropoiesis==.
          4. الكرات اللي فيها α aggregates **ناشفة** وتتحبس في الطحال.
          5. Hb قليل = كرات **microcytic hypochromic**.
          6. التكسير برّه = **splenomegaly**.
          7. الـ **HbF** هو الغالب، وده بيزوّد الـ tissue hypoxia.
      - kind: figure
        page: 22
        quote: "The unbound chains precipitate within erythroblasts and red cells"
        title: "الحلقة المفرغة"
        alt: "A cycle: low beta chains leave excess alpha chains, which precipitate and kill erythroblasts (ineffective erythropoiesis) and make rigid red cells destroyed in the spleen; severe anaemia and hypoxia drive erythropoietin and marrow expansion (bone deformity), and raise iron absorption; transfusions add iron; iron overload damages organs."
        caption: "كل حاجة في الـ thalassaemia major طالعة من نقطة واحدة: ==α chains زيادة==. هي اللي بتموّت الخلايا، والـ anaemia بتزق النخاع يتمدد، والـ ineffective erythropoiesis بتزوّد امتصاص الحديد."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="h03a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="85" y="5" width="160" height="34" rx="8" class="fg-acc"/>
            <text x="165" y="27" text-anchor="middle" class="t-sm t-b">↓ β chains, free α excess</text>
            <path d="M120 39 L70 64" class="fg-arrow" marker-end="url(#h03a)"/>
            <path d="M210 39 L260 64" class="fg-arrow" marker-end="url(#h03a)"/>
            <rect x="5" y="66" width="150" height="48" rx="8" class="fg-bad"/>
            <text x="80" y="86" text-anchor="middle" class="t-sm t-b">α precipitates</text>
            <text x="80" y="102" text-anchor="middle" class="t-sm">ineffective erythropoiesis</text>
            <rect x="175" y="66" width="150" height="48" rx="8" class="fg-bad"/>
            <text x="250" y="86" text-anchor="middle" class="t-sm t-b">Rigid RBCs</text>
            <text x="250" y="102" text-anchor="middle" class="t-sm">trapped → splenomegaly</text>
            <path d="M80 114 L150 140" class="fg-arrow" marker-end="url(#h03a)"/>
            <path d="M250 114 L180 140" class="fg-arrow" marker-end="url(#h03a)"/>
            <rect x="85" y="142" width="160" height="40" rx="8" class="fg-box"/>
            <text x="165" y="160" text-anchor="middle" class="t-sm t-b">Severe anaemia + hypoxia</text>
            <text x="165" y="175" text-anchor="middle" class="t-sm t-mut">(HbF adds to hypoxia)</text>
            <path d="M120 182 L70 210" class="fg-arrow" marker-end="url(#h03a)"/>
            <path d="M210 182 L260 210" class="fg-arrow" marker-end="url(#h03a)"/>
            <rect x="5" y="212" width="150" height="48" rx="8" class="fg-acc"/>
            <text x="80" y="232" text-anchor="middle" class="t-sm t-b">Marrow expansion</text>
            <text x="80" y="248" text-anchor="middle" class="t-sm">skull, face, fractures</text>
            <rect x="175" y="212" width="150" height="48" rx="8" class="fg-acc"/>
            <text x="250" y="232" text-anchor="middle" class="t-sm t-b">Transfusion</text>
            <text x="250" y="248" text-anchor="middle" class="t-sm">+ ↑ gut iron absorption</text>
            <path d="M250 260 L200 284" class="fg-arrow" marker-end="url(#h03a)"/>
            <rect x="85" y="286" width="160" height="38" rx="8" class="fg-bad"/>
            <text x="165" y="310" text-anchor="middle" class="t-sm t-b">Iron overload → organs</text>
          </svg>
      - kind: check
        page: 22
        quote: "leading to the lysis of erythroblasts and red cells in the bone marrow (ineffective erythropoiesis)"
        question: "What is the main cause of ineffective erythropoiesis in β-thalassaemia major?"
        options:
          - "Free α chains precipitate in erythroblasts"
          - "Lack of erythropoietin"
          - "Iron deficiency"
          - "Antibodies against erythroblasts"
        answer: 0
        why:
          - "صح: الـ α الحرة بتترسب وتكسّر الـ erythroblasts في النخاع."
          - "الـ EPO عالي جدًا هنا، وده اللي بيمدد النخاع."
          - "بالعكس، فيه iron overload."
          - "مفيش antibodies في الثلاسيميا."
      - kind: explain
        page: 23
        title: "العضم والحديد"
        quote: "Thinning of cortex may lead to pathological fractures."
        text: |
          **العضم**: الـ anaemia والـ hypoxia بيشغّلوا النخاع ==hyperplasia== شديدة. النخاع بيتمدد فيضعّف ويشوّه **الجمجمة** و**عضم الوش**، والـ cortex يرق فيحصل **pathological fractures**.

          **الحديد** بيزيد من سببين:
          - **امتصاص أكتر من الأمعاء** بسبب الـ ineffective erythropoiesis.
          - **نقل الدم** المنتظم.

          والـ ==iron overload== بيبوّظ: البنكرياس (**DM**)، الكبد (**cirrhosis**)، الـ gonads (**infertility**)، الـ parathyroid والـ thyroid، و**القلب** (arrhythmias و heart failure).
      - kind: figure
        page: 23
        title: "Hair-on-end (صورة الكتاب ص 23)"
        image: { file: hem/L03-hair-on-end-xray.webp, book: true }
        alt: "Book lateral skull X-ray in thalassaemia major with arrows on the vertical striations of the expanded vault (hair-on-end appearance)."
        caption: "النخاع المتمدد بيرفع الـ periosteum فتطلع خطوط رأسية زي **الشعر الواقف**: ==hair-on-end==. والأسهم الزرقا عليها."
      - kind: mnemonic
        page: 23
        quote: "Iron overload may damage parenchymal cells of various organs such as pancreas (diabetes mellitus), liver (cirrhosis), gonads (infertility)"
        word: "PLGEH"
        parts:
          - { key: "P", text: "Pancreas: diabetes mellitus" }
          - { key: "L", text: "Liver: cirrhosis" }
          - { key: "G", text: "Gonads: infertility" }
          - { key: "E", text: "Endocrine: hypoparathyroidism, hypothyroidism" }
          - { key: "H", text: "Heart: arrhythmias, heart failure" }
        hook: "**P-L-G-E-H**: «**بلج** **إيه**؟» الحديد بيبلّج كل غدة وعضو. والقلب (**H**) هو أخطرهم: أشهر سبب وفاة في الـ iron overload."
      - kind: explain
        page: 24
        title: "مضاعفات تانية وتحاليل"
        quote: "a haemoglobin concentration between 2-6 gm/dl. Anaemia is typically microcytic and hypochromic."
        text: |
          **مضاعفات**: hypersplenism، بؤر **extramedullary haematopoiesis** ممكن تضغط على الـ **spinal cord**، والعيان من غير علاج بيموت قبل **5 سنين**، والنقل بينقل **HIV و HBV و HCV**.

          **التحاليل**:
          - Hb ==2–6 g/dL==، microcytic hypochromic.
          - Film: anisopoikilocytosis، hypochromia شديدة، **target cells** كتير، basophilic stippling، nucleated RBCs. الـ reticulocytes **modest** بس.
          - **Electrophoresis**: ==HbF 10–98%==، والـ HbA2 طبيعي أو عالي.
          - النخاع: erythroid hyperplasia شديدة؛ **ferritin** عالي؛ unconjugated bilirubin عالي.
      - kind: figure
        page: 25
        title: "Target cells (صورة الكتاب ص 25)"
        image: { file: hem/L03-target-cells.webp, book: true }
        alt: "Book blood film with hypochromic red cells and an arrow on a target cell with a central dot of haemoglobin."
        caption: "الـ ==target cell==: نقطة Hb في النص وحلقة حواليها، زي الـ target بتاع الرماية. من علامات الثلاسيميا."
      - kind: reveal
        page: 24
        quote: "Reticulocytosis is modest."
        prompt: "النخاع شغال بأقصى سرعة، ليه الـ reticulocytes مش عالية قوي زي الـ HS؟"
        answer: "لأن معظم الـ erythroblasts بتموت **جوّه النخاع** قبل ما تطلع (==ineffective erythropoiesis==). النخاع بيشتغل كتير بس الإنتاج اللي بيوصل الدم قليل، فالـ reticulocytosis **modest**."
      - kind: try
        items: [hem.L03.017, hem.L03.019, hem.L03.025, hem.L03.027, hem.L03.029]
    recap:
      - "Thalassaemia = سلسلة globin قليلة أو معدومة؛ تقسيم بالسلسلة (α، β) أو بالشدة (major، intermedia، minor)."
      - "Major = transfusion-dependent؛ intermedia = مش محتاج نقل منتظم؛ minor = asymptomatic غالبًا."
      - "β major: α زيادة تترسب ← ineffective erythropoiesis + كرات ناشفة في الطحال."
      - "النخاع يتمدد ← جمجمة hair-on-end ووش متشوّه وكسور."
      - "Iron overload من النقل + امتصاص زيادة ← DM، cirrhosis، infertility، hypothyroid/hypoparathyroid، قلب."
      - "Hb 2–6، target cells، HbF 10–98%، retics modest."
    practice: [hem.L03.015, hem.L03.016, hem.L03.017, hem.L03.018, hem.L03.019, hem.L03.020, hem.L03.021, hem.L03.022, hem.L03.023, hem.L03.024, hem.L03.025, hem.L03.026, hem.L03.027, hem.L03.028, hem.L03.029, hem.L03.030, hem.L03.031, hem.L03.032, hem.L03.163]
