        title: "ليه أدوات كتير كده؟"
        text: |
          جدول الكتاب بيرتّب أدوات الـ cognition حسب **الوقت**: very brief (أقل من 5 دقايق)، brief (6–10)، self-administered (أقل من 20)، و neuropsychological batteries (أكتر من 20). ولكل أداة الـ total score والـ sensitivity والـ specificity والـ cut-off والـ domains اللي بتقيسها.

          التفسير المقبول (مش في الكتاب) لاختيار الأداة:
          - في عيادة زحمة: **very brief** (Mini-Cog، clock drawing) عشان تفرز.
          - لو الفرز إيجابي: **brief** زي الـ **MMSE** أو الـ ==MoCA==. الـ MoCA فيها **executive function**، فبتلقط المشاكل البسيطة اللي الـ MMSE ممكن يفوّتها.
          - لو العيان مش قادر يتختبر (نظر، سمع، لغة): الـ **IQCODE** أو الـ **AD8**، اللي بيجاوب عليها حد من أهله.
          - والـ **batteries** الطويلة (ACE-R، CAMCOG) للمتخصص لما التشخيص صعب.

          يعني مفيش أداة «أحسن»، فيه أداة مناسبة للوقت والسؤال.
