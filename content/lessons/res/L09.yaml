  - id: res.L09.lesson3
    title: "٣ مبادئ: احترام، خير، عدل"
    hook: "دراسة على مساجين لأنهم «متاحين»؟ دراسة بتدفع آلاف عشان تقنعك بخطر كبير؟ المبادئ دي بتقولك فين الغلط."
    minutes: 9
    pages: [35, 53]
    topics: [principles]
    goals:
      - "تشرح respect for persons وحمايتها"
      - "تحلل الـ risks (magnitude و probability) والـ benefits"
      - "تعرف الـ justice والـ vulnerable populations"
      - "توصّل كل مبدأ بالـ application بتاعه"
    status: unverified
    steps:
      - kind: explain
        page: 35
        quote: "RESPECT FOR PERSONS\n  Means respecting their personality, culture and traditions [Autonomy].\n  Requires we respect privacy & confidentiality.\n  Requires we go through the process of informed consent.\n  Requires we conduct research is a convenient environment."
        title: "Respect for persons"
        text: |
          يعني تحترم **شخصيته وثقافته وتقاليده** (==autonomy==)، وده بيتطلب:

          - احترام الـ **privacy and confidentiality**.
          - المرور بالـ **informed consent process**.
          - البحث يتعمل في **مكان مريح**.
      - kind: table
        page: 36
        quote: "Respect for persons: the right to choose\n| What it asks | Protection |\n|---|---|\n| Allow people to choose for themselves | Informed Consent |\n| Respect for privacy; Protect sensitive data | Privacy & Confidentiality Protections |\n| Extra Protections for individuals with limited autonomy | Family Consent |"
        title: "الاحترام بيتحمي إزاي؟"
        columns: ["المطلوب", "الحماية"]
        rows:
          - ["Allow people to choose for themselves", "Informed consent"]
          - ["Respect privacy, protect sensitive data", "Privacy and confidentiality protections"]
          - ["Limited autonomy", "Extra protection: family consent"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 39
        quote: "Risks: Components\n  Magnitude of harm\n    Death\n    Slight discomfort\n  Probability of harm\n    1/ 1,000,000\n    1/ 10"
        title: "Beneficence: الـ risk ليه مكونين"
        text: |
          ==Non-maleficence== = **first do no harm**، وبعدها توازن: **maximize benefits** و **minimize risks** (slides 37-38).

          والـ risk ليه مكونين:

          - **Magnitude of harm**: من slight discomfort لحد death.
          - **Probability of harm**: من واحد في المليون لحد واحد في العشرة.
      - kind: explain
        page: 41
        quote: "LEVELS OF RISKS\n  Minimal risk: may be age dependent: blood draw may be minimal risk for an adult but not for a young child !!!\n  Remember: The risks need not be \"physical\" only in order to be \"greater than minimal risk\" e.g., privacy & confidentiality risks push the study into \"greater than minimal risk\""
        title: "Minimal risk مش رقم ثابت"
        text: |
          - **Minimal risk** بيعتمد على السن: سحب دم ممكن يبقى minimal risk للكبير، **بس مش للطفل الصغير**.
          - والـ risk **مش لازم يكون physical** عشان يبقى «greater than minimal risk»: الـ ==privacy and confidentiality risks== لوحدها بتطلّع الدراسة فوق الـ minimal.
      - kind: check
        page: 41
        quote: "LEVELS OF RISKS\n  Minimal risk: may be age dependent: blood draw may be minimal risk for an adult but not for a young child !!!\n  Remember: The risks need not be \"physical\" only in order to be \"greater than minimal risk\" e.g., privacy & confidentiality risks push the study into \"greater than minimal risk\""
        question: "A questionnaire study records names with HIV status. There is no physical procedure. Its risk is:"
        options: ["Greater than minimal risk", "Minimal risk", "No risk"]
        answer: 0
        why:
          - "صح: privacy and confidentiality risks بتطلّعها فوق الـ minimal (slide 41)."
          - "الاستبيان شكله غلبان، بس تسريب الـ HIV status ضرر حقيقي."
          - "الـ risk مش لازم يكون physical."
      - kind: explain
        page: 43
        quote: "Benefits\n  Are either:\n    1. Benefits to research subjects.\n    2. Benefits to society.\n  N.B. Payment or incentives should NOT be assessed as potential direct benefit to the subject. (Offering big sum of money to a high risk study?)\n  N.B. Do not over promise benefit."
        title: "الـ benefits"
        text: |
          - الـ benefits دالة في الـ ==opportunity== مش الـ probability: احتمال صغير لفايدة عظيمة (شفاء من مرض قاتل) **أحسن** من احتمال كبير لفايدة تافهة (slide 42).
          - نوعين: **benefits to subjects** و **benefits to society**.
          - للمشارك: **direct** (علاج، معرفة بتساعد في التشخيص) أو **indirect / collateral** (supervision زيادة، access to medical care، فوايد مش متوقعة) (slide 44).

          **N.B.**: الفلوس والـ incentives **مش** direct benefit. ولا تبالغ في الوعود.
      - kind: aside
        tone: trap
        page: 43
        quote: "Benefits\n  Are either:\n    1. Benefits to research subjects.\n    2. Benefits to society.\n  N.B. Payment or incentives should NOT be assessed as potential direct benefit to the subject. (Offering big sum of money to a high risk study?)\n  N.B. Do not over promise benefit."
        text: |
          سؤال الامتحان: «الدراسة بتدفع للمشارك مبلغ كبير، يبقى الـ benefit عالي». **غلط.**

          الـ payment مش بيتحسب direct benefit. ومبلغ كبير لدراسة high risk ده نفسه علامة استفهام: ممكن يضغط على الفقير يوافق على خطر مايقبلوش.
      - kind: explain
        page: 45
        quote: "Beneficence/Non-Maleficence\n  Maximize benefits, Minimize harms:\n    1. Favorable risk-benefit ratio\n    2. Use best possible research design to minimize harms\n    3. Use qualified investigators"
        title: "إزاي تكبّر الفايدة وتصغّر الضرر؟"
        text: |
          1. **Favorable risk-benefit ratio**.
          2. **Best possible research design** يقلل الضرر.
          3. **Qualified investigators**.

          وفي الـ risk-benefit analysis: الـ **risks** بيشيلها المشاركين، والـ **benefits** للمشاركين **+ المجتمع** (slide 46).
      - kind: explain
        remind: [res.L09.046]
        page: 47
        quote: "JUSTICE\n  Fair distribution of benefits & burdens\n  Protection of vulnerable groups\n  Research is relevant to the community\n  Should not, disproportionately, provide benefits to other populations"
        title: "Justice"
        text: |
          - ==Fair distribution of benefits and burdens==: مافيش group تشيل الحمل لوحدها أو تاخد الفايدة لوحدها.
          - **Protection of vulnerable groups**.
          - البحث يكون **relevant to the community** اللي اتعمل فيها.
          - مايديش فايدة **بشكل غير متناسب لناس تانية**.

          و **fairness in selection**: ماتختارش group عشان **ضعيفة** (compromised position)، ولا group مش هتستفيد من نتايج البحث (slide 48).
      - kind: sort
        page: 49
        quote: "VULNERABLE POPULATIONS\n  Pregnant women / fetuses\n  Children\n  Elderly\n  Mentally disabled\n  Sick persons\n  Unconscious persons\n  Prisoners\n  Persons with little/ no education\n  Poor persons"
        prompt: "مين من دول vulnerable حسب slide 49؟"
        bins: ["Vulnerable", "Not on the list"]
        cards:
          - { text: "Prisoners", bin: 0 }
          - { text: "Unconscious persons", bin: 0 }
          - { text: "Persons with little or no education", bin: 0 }
          - { text: "Pregnant women and fetuses", bin: 0 }
          - { text: "Healthy adult volunteers", bin: 1 }
          - { text: "Poor persons", bin: 0 }
          - { text: "Medical residents", bin: 1 }
        why: "القايمة ٩: pregnant women/fetuses، children، elderly، mentally disabled، sick، unconscious، prisoners، little/no education، poor."
      - kind: check
        page: 52
        quote: "Case 1: Is the investigator conducting human subjects research?\n  No:\n    Research involving only specimens and data from dead individuals is not human subjects research\n    Investigator is neither interacting nor intervening with living individuals for research\n  Definition of \"human subject\" is not met"
        question: "A researcher studies autopsy specimens and the dead individuals' identifiable medical records. Is it human subjects research?"
        options: ["No", "Yes, because the information is identifiable", "Yes, because it uses human material"]
        answer: 0
        why:
          - "صح: الـ definition محتاج **living individuals**، والباحث لا بيتعامل ولا بيتدخل مع حد عايش (case 1، slide 52)."
          - "الـ identifiable information بتفرق مع الأحياء بس."
          - "الـ human material من ميتين مش بتخليه human subject."
      - kind: figure
        remind: [res.L09.051, res.L09.032, res.L09.lesson2:RBJ]
        page: 53
        quote: "| Principle | Application |\n|---|---|\n| Respect for persons: Individuals should be treated as autonomous agents; Persons with diminished autonomy are entitled to protection | Informed consent: Subjects, to the degree that they are capable, must be given the opportunity to choose what shall or shall not happen to them. The consent process must include three elements: i) information, ii) comprehension, and iii) voluntariness |\n| Beneficence: Human subjects should not be harmed; Research should maximize possible benefits and minimize possible harm | Assessment of risks and benefits: The nature and scope of risks and benefits must be assessed in a systematic manner |\n| Justice: The benefits and risks of the research must be distributed fairly | Selection of subjects: There must be fair procedures and outcomes in the selection of research subjects |"
        title: "كل مبدأ وتطبيقه"
        alt: "Three columns. Respect for persons leads to informed consent, which needs information, comprehension and voluntariness. Beneficence leads to assessment of risks and benefits. Justice leads to selection of subjects."
        caption: "**Respect** ← informed consent. **Beneficence** ← risk/benefit assessment. **Justice** ← selection of subjects."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R09p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
