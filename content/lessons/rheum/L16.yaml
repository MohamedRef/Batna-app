  - id: rheum.L16.lesson2
    title: "شكله إيه في العيادة؟ والـ criteria بالنقط"
    hook: "إيدين الاتنين، الصبح متخشّبين، والـ DIP سليم. وبعدين تحسب النقط: 6 من 10 وخلاص."
    minutes: 8
    pages: [244, 246]
    topics: [onset, criteria]
    goals:
      - "تعرف أنواع الـ onset والمفاصل اللي بتتصاب"
      - "تحفظ الـ ACR 1987 وتفهم ليه الـ 6 أسابيع"
      - "تحسب الـ ACR/EULAR 2010 score لوحدك"
    status: unverified
    steps:
      - kind: explain
        page: 244
        title: "البداية"
        quote: "ONSET\n  Gradual (usually).\n  Acute in a minority.\n  Occasionally palindromic (pain, swelling, erythema that resolve but recur 50% develop RA).\n  Systemic symptoms: Fatigue, malaise, weakness, low grade fever, loss of weight.\n  Joints: pain- swelling- tender on pressure.\n  Morning stiffness: due to edema and inflammatory mediator accumulation during sleep or inactivity.\n  Joints commonly involved: joints of hand (MCP-PIP-Wrist) foot joints-knee.\n  Also affected: shoulder- hip- ankle —sternoclavicular joints.\n  Less commonly: Tempromandibular and cricoarytenoid joint.\n  Spinal involvement is limited to upper cervical area, sacroiliac joint is spared.\n  Symmetry and non involvement of DIP is characteristic."
        text: |
          الـ onset غالبًا ==gradual==، وأحيانًا acute، ونادرًا **palindromic**: نوبات ألم وورم واحمرار تروح وترجع، و **50%** منهم يطلع عندهم rheumatoid arthritis (RA).

          ومعاه أعراض systemic: fatigue، malaise، weakness، low-grade fever، نقص وزن.

          الأعراض العامة دي سببها إن الـ cytokines (IL-1، TNF، IL-6) بتطلع من المفصل للدم، فالمرض من أوله systemic مش موضعي.
      - kind: reveal
        page: 244
        quote: "Morning stiffness: due to edema and inflammatory mediator accumulation during sleep or inactivity."
        prompt: "ليه المفاصل بتبقى متخشّبة الصبح بالذات؟"
        answer: "وانت نايم مفيش حركة، فالـ **edema** والـ **inflammatory mediators** بيتجمّعوا في المفصل. أول ما تتحرك بيتصرّفوا والتخشّب يقل. علشان كده الـ **morning stiffness** علامة التهاب."
      - kind: explain
        page: 244
        title: "مين بيتصاب؟"
        quote: "ONSET\n  Gradual (usually).\n  Acute in a minority.\n  Occasionally palindromic (pain, swelling, erythema that resolve but recur 50% develop RA).\n  Systemic symptoms: Fatigue, malaise, weakness, low grade fever, loss of weight.\n  Joints: pain- swelling- tender on pressure.\n  Morning stiffness: due to edema and inflammatory mediator accumulation during sleep or inactivity.\n  Joints commonly involved: joints of hand (MCP-PIP-Wrist) foot joints-knee.\n  Also affected: shoulder- hip- ankle —sternoclavicular joints.\n  Less commonly: Tempromandibular and cricoarytenoid joint.\n  Spinal involvement is limited to upper cervical area, sacroiliac joint is spared.\n  Symmetry and non involvement of DIP is characteristic."
        text: |
          - **كتير**: الإيد (==MCP، proximal interphalangeal (PIP)، wrist==)، القدم، الركبة.
          - **كمان**: الكتف، الـ hip، الكاحل، الـ sternoclavicular.
          - **أقل**: الـ temporomandibular والـ **cricoarytenoid**.
          - **العمود الفقري**: الـ upper cervical بس، والـ ==sacroiliac سليم==.

          التفسير المقبول (مش في الكتاب): الـ RA مرض synovium، علشان كده بيختار المفاصل الـ synovial الصغيرة الكتير الحركة في الإيد والقدم. والكتاب بيقولك إن الـ **symmetry** وإن الـ DIP سليم هما اللي بيميّزوه، يعني لو شفت الاتنين دول فكّر في RA.
      - kind: reveal
        page: 244
        quote: "Less commonly: Tempromandibular and cricoarytenoid joint."
        prompt: "إيه اللي يجمع الـ temporomandibular والـ cricoarytenoid مع مفاصل الإيد؟ وليه الصوت بيتأثر؟"
        answer: |
          التفسير المقبول (مش في الكتاب): التلاتة **synovial joints**، والـ RA مرض الـ **synovium**، فأي مفصل فيه synovium ممكن يتصاب مهما كان صغير أو بعيد.

          الـ **cricoarytenoid** هو المفصل اللي بيحرّك الأحبال الصوتية، فالتهابه يعمل **dysphonia** وألم في البلع (الكتاب بيرجع له في الـ respiratory features ص 253). والـ temporomandibular = ألم في المضغ.
      - kind: aside
        tone: trap
        page: 244
        quote: "ONSET\n  Gradual (usually).\n  Acute in a minority.\n  Occasionally palindromic (pain, swelling, erythema that resolve but recur 50% develop RA).\n  Systemic symptoms: Fatigue, malaise, weakness, low grade fever, loss of weight.\n  Joints: pain- swelling- tender on pressure.\n  Morning stiffness: due to edema and inflammatory mediator accumulation during sleep or inactivity.\n  Joints commonly involved: joints of hand (MCP-PIP-Wrist) foot joints-knee.\n  Also affected: shoulder- hip- ankle —sternoclavicular joints.\n  Less commonly: Tempromandibular and cricoarytenoid joint.\n  Spinal involvement is limited to upper cervical area, sacroiliac joint is spared.\n  Symmetry and non involvement of DIP is characteristic."
        text: "الفخ: **Distal interphalangeal (DIP)** ملتهب؟ فكّر في Osteoarthritis (OA) أو psoriatic arthritis. الـ RA بيسيب الـ **DIP** في حاله، وبيبقى **symmetrical**."
      - kind: check
