        quote: "Restart after 7 days of interruption if … low thromboembolic risk. Restart after 3 days … high thromboembolic risk with heparin bridging."
        text: |
          **Restarting** (نص p89): ارجع للـ anticoagulant طالما لسه محتاجه. بعد 7 أيام من الإيقاف لو الـ thromboembolic risk **low**، وبعد 3 أيام مع **heparin bridging** لو **high**.

          خلي بالك إن الـ flowchart في نفس الصفحة بيقول warfarin نفس الليلة والـ DOAC بعد 2–3 أيام. لو السؤال «restarting anticoagulants» اكتب الـ 7 و3 زي النص.
