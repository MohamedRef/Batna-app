      - kind: sort
        page: 346
        quote: "Forms of Systemic Sclerosis:\n  Limited Scleroderma.\n  Skin thickening is distal to elbows and knees, not involving trunk.\n  Can involve perioral skin thickening (pursing of lips).\n  Less organ involvement.\n  Seen in CREST syndrome.\n  Isolated pulmonary hypertension can occur.\n  Diffuse Scleroderma.\n  Skin thickening proximal to elbows and knees, involving the trunk.\n  More likely to have organ involvement.\n  Pulmonary fibrosis and Renal Crisis are more common."
        prompt: "limited ولا diffuse؟"
        bins: ["Limited", "Diffuse"]
        cards:
          - { text: "Skin thick distal to elbows only", bin: 0 }
          - { text: "Perioral pursing of lips", bin: 0 }
          - { text: "CREST syndrome", bin: 0 }
          - { text: "Isolated pulmonary hypertension", bin: 0 }
