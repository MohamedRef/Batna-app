  - id: hem.L06.116
    kind: case
    topic: acute-reactions
    stem: A 50-year-old woman group O is given a unit labelled for the patient in the next bed (group A). Fifteen minutes later she has fever, chills, flank pain and chest tightness.
    steps:
      - question: Which reaction is this?
        options: [Acute hemolytic transfusion reaction, FNHTR, Mild allergic reaction, TACO]
        answer: 0
        why: "ABO mismatch: her IgM anti-A destroys the A cells (p95). FNHTR is a diagnosis of exclusion; allergic gives urticaria; TACO gives dyspnea with raised CVP."
      - question: First action?
        options: [Stop the transfusion, Slow it and give paracetamol, Give an antihistamine, Finish the unit then investigate]
        answer: 0
        why: "Stop, then support BP and renal flow and check identities (p96)."
      - reveal: "BP 85/50. Urine is dark red."
        question: Target urine output with fluids and diuresis?
        options: ["Above 100 ml/hour", "Above 30 ml/hour", "Above 0.5 ml/kg/hour", "No target"]
        answer: 0
        why: "Keep urine output above 100 ml/hour (p96)."
      - question: Which test confirms an immune AHTR?
        options: ["Positive DAT and elution showing the alloantibody", "Normal haptoglobin", "Negative DAT", "High platelet count"]
        answer: 0
        why: "Positive DAT (anti-IgG and/or anti-C3) and positive elution confirm it (p96). Haptoglobin falls in hemolysis."
    src: { page: 95, quote: "Acute hemolytic transfusion reaction (AHTR) = ABO incompatibility = Mismatched blood transfusion" }
