        page: 189
        quote: "Gastrointestinal disturbances include pain, nausea, vomiting, and rarely watery diarrhea. (This can easily be misdiagnosed as a surgical emergency. Bowel sounds in the absence of abdominal tenderness and normal CBC suggest conservative treatment)."
        text: |
          نوبة البطن في الـ HAE ==ممكن تتشخص غلط كـ surgical emergency==. الكتاب بيدّيك تلات علامات تميل بيها للـ **conservative**: **bowel sounds** موجودة، **مفيش abdominal tenderness**، و **CBC طبيعي**.

          التفسير المقبول (مش في الكتاب): اللي بيحصل oedema في جدار الأمعاء، مش التهاب ولا انثقاب، فالبطن بتوجع بس مش بتتشدّ، وكرات الدم البيضا ما بتعلاش.
      - kind: explain
        page: 189
        title: "العلاج والوقاية"
        quote: "The treatment of choice for severe abdominal attacks and life-threatening laryngeal edema is administration of C1INH plasma concentrates. Maintenance doses of danazol or stanozolol increases production of C1 esterase inhibitor and will often prevent or ameliorate attacks."
        text: |
          - **النوبة الشديدة** (بطن أو ==laryngeal oedema== بيهدد الحياة): **C1INH plasma concentrates**. ليه؟ بتدّيله الفرامل الناقصة جاهزة
          - **الوقاية:** ==danazol أو stanozolol==، والكتاب بيقول السبب: بيزوّدوا إنتاج الـ C1 esterase inhibitor، فبيمنعوا النوبات أو يخففوها

          والـ pathogenesis في الكتاب: ==C3a و C5a== مستمرين ← mast cells و basophils تطلّع histamine ومواد vasoactive.
      - kind: update
        page: 189
        quote: "It would seem that the pathogenesis results from continued production C3a and C5a which then induce mast cells and basophils to release histamine and other vasoactive mediators."
        text: "الكتاب بيقول الـ hereditary angioedema (HAE) من C3a و C5a و histamine. الصح النهاردة إنه bradykinin-mediated، علشان كده الـ antihistamines والـ steroids ما بتنفعش. والعلاج الحديث للنوبة: C1-INH concentrate أو icatibant أو ecallantide، والوقاية: lanadelumab أو C1-INH أو berotralstat، والـ danazol بقى خط تاني."
        ref: "WAO/EAACI hereditary angioedema guideline 2021"
      - kind: explain
        page: 189
        title: "IVIG: لمين"
        quote: "IVIG replacement therapy is the treatment of choice for all primary immunodeficiency syndromes (except IgA deficiency"
        text: |
          - ==IVIG== هو العلاج لكل الـ primary immunodeficiency **ما عدا IgA deficiency**
          - **IgG subclass deficiency:** IVIG بس لو ==فشل يعمل antibodies== للـ protein و polysaccharide antigens **و** ما ردّش على الـ prophylactic antibiotics
          - **Selective IgA deficiency:** مفيش IVIG. لو فيه **chronic diarrhoea** جرّب **oral Ig**، ولو معاه IgG deficiency: Ig products فيها IgA قليل و **washed blood products**

          ليه مفيش IVIG في الـ IgA؟ التفسير المقبول (مش في الكتاب): الـ IgG عنده طبيعي فمش محتاجه، والـ IVIG مش هيوصل IgA للأغشية. وليه washed؟ لأن بعضهم بيعمل antibodies ضد الـ IgA، فدم فيه IgA ممكن يعمل تفاعل شديد.
