  - id: hem.L02.lesson4
    title: "الـ megaloblastic والـ transfusion: إمتى تنقل دم؟"
    hook: "B12 ولا folate؟ تحليل واحد بيفرق. وإمتى الـ Hb 9 يستاهل كيس دم؟ الإجابة في القلب مش في الرقم بس."
    minutes: 8
    pages: [15, 17]
    topics: [megaloblastic, transfusion]
    goals:
      - "تعرف تحاليل الـ megaloblastic anaemia في الدم والنخاع"
      - "تفرّق نقص الـ B12 من الـ folate بالـ MMA"
      - "تحفظ thresholds الـ transfusion في الكتاب"
    status: unverified
    steps:
      - kind: explain
        page: 16
        title: "الـ megaloblastic anaemia في التحاليل"
        quote: "Laboratory Abnormalities in Megaloblastic Anemia"
        text: |
          **في الدم**:
          - **↓ Hb**، و ==↑ MCV== (غالبًا ≥ 120 fL)، **oval macrocytes**
          - **Leukopenia** و **thrombocytopenia**
          - ==Hypersegmented neutrophils==: أكتر من 5 فصوص في أي خلية، أو ≥ 5% من الـ neutrophils فيها 5 فصوص
          - **↑ LDH**، **↑ bilirubin**، **↓ haptoglobin**

          **في النخاع**: **megaloblasts** (erythroid precursors كبيرة ونواتها immature)، و **giant bands و metamyelocytes**.
      - kind: reveal
        page: 16
        quote: "Increased lactic dehydrogenase"
        prompt: "ليه الـ megaloblastic anaemia بتعمل LDH و bilirubin عاليين زي الـ haemolysis؟"
        answer: "الكتاب حاطّهم في جدول الـ lab abnormalities. التفسير الفسيولوجي: النخاع بيعمل خلايا **مشوهة** كتير بتموت **جوّه النخاع** قبل ما تطلع (ineffective erythropoiesis)، فالـ **lactic dehydrogenase** (LDH) والـ bilirubin يعلوا والـ haptoglobin ينزل. ما تتلخبطش وتقول haemolysis لوحدها."
      - kind: table
        page: 16
        quote: "Serum folate level"
        title: "Folate ولا B12؟"
        columns: [Test, Folate, B12]
        rows:
          - ["Serum folate", "↓", "N/↑"]
          - ["RBC folate", "↓", "↓"]
          - ["B12 level", "N", "↓"]
          - ["Methylmalonyl CoA", "N", "↑"]
          - ["Homocysteine", "↑", "↑"]
        hide: [[2, 2], [3, 1], [3, 2], [4, 1]]
      - kind: explain
        page: 16
        title: "القواعد اللي تطلع من الجدول"
        quote: "However, MMA is the more specific of the two."
        text: |
          - الـ **serum folate** بيتغير مع الأكل؛ الـ ==RBC folate== بيفضل واطي كام يوم، فهو أصدق.
          - الـ **MMA** والـ **homocysteine** الاتنين **sensitive** جدًا لنقص الـ B12، بس ==MMA أكثر specificity==: بيعلى في الـ B12 بس، والـ homocysteine بيعلى في الاتنين.
      - kind: mnemonic
        page: 16
        quote: "Both plasma methylmalonic acid (MMA) and plasma total homocysteine"
        word: "MB"
        parts:
          - { key: "M", text: "MMA up = B12 (Methylmalonyl needs B12 only)" }
          - { key: "B", text: "Both raise homocysteine: folate AND B12" }
        hook: "**M** مع **B12** بس، والـ homocysteine **Both**. لو الـ MMA طبيعي والـ homocysteine عالي، فكّر في الـ folate."
      - kind: check
        page: 16
        quote: "However, MMA is the more specific of the two."
        question: "Homocysteine high, MMA normal, B12 normal. Most likely?"
        options:
          - "Folate deficiency"
