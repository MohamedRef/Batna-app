  - id: neph.L08.lesson9
    title: "قاموس الـ lesions"
    hook: "focal ولا diffuse، segmental ولا global، جوّه الـ GBM ولا برّه: كل كلمة في التقرير ليها معنى بيغيّر التشخيص."
    minutes: 9
    pages: [211, 217]
    topics: [histology]
    goals:
      - "تفهم الـ interstitium والأوعية الطبيعية"
      - "تفرّق focal/diffuse عن segmental/global وتعرف حد الـ mesangial hypercellularity"
      - "تعرف endocapillary و extracapillary والـ crescent وباقي القاموس، وليه كل lesion بتطلع"
    status: unverified
    steps:
      - kind: figure
        page: 211
        title: "الـ interstitium والأوعية"
        image: { file: neph/L08-vessels.webp, book: true }
        caption: "فوق: **interstitium** و **blood vessel** و **nerve** (Gomori's trichrome، X300). في النص: **direct immunofluorescence for IgG** (X400). تحت: ==arcuate artery== (H&E، X100)."
        alt: "Three book images: Gomori's trichrome X300 showing interstitium between a blood vessel and a nerve; direct immunofluorescence for IgG X400 outlining a vessel wall in green; and H&E X100 of an arcuate artery with a thick muscular wall."
      - kind: explain
        page: 211
        title: "الـ interstitium والأوعية: الطبيعي ضيق"
        quote: "Gomori‘s trichrome, X300 Blood vessels Direct immunofluorescence for IgG, X400 H&E, X100"
        text: |
          الصفحة دي بتكمّل الـ compartments: الـ **interstitium** بالـ ==Gomori's trichrome== (جنب **blood vessel** و **nerve**)، والـ **blood vessels**: صورة **direct immunofluorescence for IgG**، و ==arcuate artery== بالـ H&E.

          ليه نبص عليهم؟ التفسير المقبول (مش في الكتاب): الـ interstitium الطبيعي **رفيع جدًا**؛ الـ tubules لازقة في بعض. فلو لقيت مسافات واسعة بينهم، يبقى فيه **edema** أو **inflammation** أو **fibrosis**، والـ fibrosis (اللي الـ trichrome بيلوّنها) هي أحسن حاجة بتتنبأ إن الكلية مش هترجع. والـ arteries بتقولك عن الضغط والـ **TMA** والـ **vasculitis**. علشان كده الـ glomerulus لوحده ما يكفيش: كلية بـ glomeruli كويسة و interstitium مليان fibrosis حالها وحش.

          ليه المسافة دي بتفرق؟ التفسير المقبول (مش في الكتاب): في الكلية الطبيعية الـ tubules لازقة في بعض، والـ interstitium خط رفيع. أي توسيع ليه معناه حاجة دخلت: **edema** (حاد)، **cells** (التهاب، زي الـ AIN والـ rejection)، أو **collagen** (fibrosis مزمن). والـ fibrosis هو أقوى عامل بيتنبأ بالـ creatinine بعدين، أقوى من شكل الـ glomeruli نفسها، عشان كده الكتاب بيكتب نسبته في كل تقرير.

          وليه الأوعية؟ التفسير المقبول (مش في الكتاب): الشريان الطبيعي جداره متناسب مع الـ lumen. لما الـ intima تتخن (intimal sclerosis) أو الـ arteriole يتملي hyaline، فده غالبًا **ضغط** أو **سكر** أو سن. والمعلومة دي مهمة لأن الـ ischemia من الأوعية لوحدها ممكن تعمل global sclerosis في الـ glomeruli، فما تحسبهاش على المرض الـ glomerular.
