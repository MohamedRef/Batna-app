  - id: rheum.L20.lesson2
    title: "خمس أشكال وصباع زي السجق"
    hook: "الـ DIP بتتعب في الـ PsA ومش في الـ RA، والسبب في كلمة واحدة: enthesis."
    minutes: 10
    pages: [329, 332]
    topics: [clinical, patterns]
    goals:
      - "تعدّ الـ domains وتدوّر على الصدفية المستخبية"
      - "تحفظ أشكال Moll and Wright بنسبها"
      - "تفرّق الـ axial PsA حسب الـ HLA-B27"
    status: unverified
    steps:
      - kind: explain
        page: 329
        title: "الـ domains"
        quote: "Peripheral arthritis. - Axial involvement. - Enthesitis. - Dactylitis. - Uveitis. - Cutaneous and nail psoriasis."
        text: |
          ستة domains: **peripheral arthritis**، **axial**، ==enthesitis==، **dactylitis**، **uveitis**، و **skin and nail psoriasis**.

          ومعاهم comorbidities: **metabolic syndrome**، obesity، **cardiovascular disease**، depression.

          ومفيش أي marker يتوقع مين من عيانين الصدفية هيجيله arthritis.
      - kind: aside
        tone: exam
        page: 330
        quote: "including the scalp, nails, umbilicus ,gluteal cleft and behind the ear."
        text: "عيان joints شكلها PsA وبيقول مفيش صدفية؟ دوّر في: **scalp**، **nails**، **umbilicus**، **gluteal cleft**، و **behind the ear**. الأماكن اللي محدش بيبصلها."
      - kind: table
        page: 330
        quote: "The skin lesions of psoriasis usually appear before the arthritis in up to 80% and typically by 5-10 years."
        title: "مين الأول: الجلد ولا المفصل؟"
        columns: [Order, Share]
        rows:
          - ["Skin first (by 5–10 y)", "Up to 80%"]
          - ["Together", "10–15%"]
          - ["Joints first", "10–15%"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 330
        title: "الجلد والمفاصل مش ماشيين مع بعض"
        quote: "In one prospective study, only 35% of patients reported that their skin and joint components flared at the same time."
        text: |
          - **Psoriasis vulgaris** هو أشيع phenotype.
          - شدة الجلد ==مالهاش علاقة كبيرة== بشدة المفاصل.
          - **35%** بس الـ flare بتاعهم بيبقى مع بعض.
      - kind: figure
        page: 330
        quote: "5 types of arthritis were originally described by Moll and Wright (1973)."
        title: "Moll and Wright: خمس أشكال"
        alt: "Five stacked hand sketches with percentages. Oligoarticular 70 percent: two asymmetric swollen joints and a sausage digit. Asymmetric DIP 10 percent: swollen fingertip joints with pitted nails. Arthritis mutilans 5 percent: shortened telescoped finger. Symmetric RA-like 15 percent: matching swollen joints on both hands. Psoriatic spondylitis 5 percent: a spine."
        caption: "الترتيب في الكتاب: ==oligo 70%==، DIP 10%، mutilans 5%، RA-like 15%، spondylitis 5%. (دراسات لاحقة لقت الـ poly 63% والـ oligo 13%.)"
        svg: |
          <svg viewBox="0 0 330 390" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="8" width="310" height="66" rx="10" class="fg-acc"/>
            <text x="22" y="34" class="t-b">Oligoarticular</text>
            <text x="22" y="54" class="t-sm t-mut">asymmetric, sausage digit</text>
            <text x="300" y="46" text-anchor="end" class="t-lg t-b t-acc">70%</text>
            <rect x="10" y="82" width="310" height="66" rx="10" class="fg-box"/>
            <text x="22" y="108" class="t-b">Asymmetric DIP</text>
            <text x="22" y="128" class="t-sm t-mut">nail pitting, "classic"</text>
            <text x="300" y="120" text-anchor="end" class="t-lg t-b">10%</text>
            <rect x="10" y="156" width="310" height="66" rx="10" class="fg-bad"/>
            <text x="22" y="182" class="t-b">Arthritis mutilans</text>
            <text x="22" y="202" class="t-sm t-mut">phalanges destroyed</text>
            <text x="300" y="194" text-anchor="end" class="t-lg t-b t-bad">5%</text>
            <rect x="10" y="230" width="310" height="66" rx="10" class="fg-box"/>
            <text x="22" y="256" class="t-b">Symmetric, RA-like</text>
            <text x="22" y="276" class="t-sm t-mut">RF usually negative</text>
            <text x="300" y="268" text-anchor="end" class="t-lg t-b">15%</text>
            <rect x="10" y="304" width="310" height="66" rx="10" class="fg-box"/>
            <text x="22" y="330" class="t-b">Psoriatic spondylitis</text>
            <text x="22" y="350" class="t-sm t-mut">axial</text>
            <text x="300" y="342" text-anchor="end" class="t-lg t-b">5%</text>
          </svg>
      - kind: reveal
        page: 331
        quote: "DIP joints are frequently involved in PsA but not so in RA because these joints have many entheses but very little synovial tissue."
        prompt: "ليه الـ DIP بتتعب في الـ PsA ومش في الـ RA؟"
        answer: |
          الـ **RA** مرض **synovitis**: محتاج synovium كتير. الـ DIP فيها synovium قليل جدًا.

          الـ **PsA** مرض **enthesitis**: والـ DIP مليانة ==entheses== (أوتار وأربطة داخلة في العضم). علشان كده الـ DIP + الضافر المنقّر = PsA.
      - kind: check
        page: 331
        quote: "A severe deforming arthritis in which there is massive destruction of the phalanges."
        question: "Which PsA pattern shows massive destruction of the phalanges?"
        options: ["Arthritis mutilans", "Asymmetric DIP", "Oligoarticular", "Symmetric RA-like"]
        answer: 0
        why:
          - "صح: 5%، ومحتمل يزيد لو المرض مش متسيطر عليه."
          - "الـ DIP pattern بيبقى مع الـ nail changes."
          - "الـ oligo asymmetric مع sausage digit."
          - "الـ RA-like symmetric، RF negative."
      - kind: table
        page: 332
        quote: "Patients who are HLA-B27 negative have different clinical features with similar frequency in males and females, older age of onset, less back pain"
        title: "الـ axial PsA: B27 بيفرق"
        columns: [Feature, B27+, B27−]
        rows:
          - ["Onset", "Earlier", "Older"]
          - ["Back pain", "More", "Less"]
          - ["Neck", "–", "More cervical"]
          - ["SI joints", "Like AS", "Unilateral, asymmetric"]
          - ["Syndesmophytes", "Like AS", "Bulky, skipping"]
        hide: [[0, 2], [2, 2], [3, 2], [4, 2]]
      - kind: aside
        tone: tip
        page: 332
        quote: "HLA-B27 gene is present in about 30% of patients with axial PsA."
        text: "الـ **B27** موجود في **30%** بس من الـ axial PsA، والعمود الفقري ممكن يتأثر في **40–70%** (حسب لو عملت أشعة ولا لأ). الـ B27-negative بيعمل syndesmophytes **bulky** و **non-marginal** و **بتنطّ** فقرات."
      - kind: explain
        page: 332
        title: "الـ enthesitis"
        quote: "The Achilles. - Plantar fascia insertions. - Insertions of the quadriceps and patellar tendons. - The iliac crest. - The rotator cuff."
        text: |
          ممكن تكون أول عرض: ألم و tenderness وأحيانًا تورم.

          أشهر الأماكن: ==Achilles==، **plantar fascia**، **quadriceps/patellar** tendons، **iliac crest**، **rotator cuff**، و **epicondyles**.

          وممكن تبقى **asymptomatic**: الـ **US** أحسن من الـ palpation.
      - kind: try
        items: [rheum.L20.020, rheum.L20.024, rheum.L20.027, rheum.L20.030, rheum.L20.034]
    recap:
      - "6 domains: peripheral، axial، enthesitis، dactylitis، uveitis، skin/nails."
      - "دوّر على الصدفية في scalp، nails، umbilicus، gluteal cleft، behind the ear."
      - "الجلد الأول في 80% (5–10 سنين)؛ الشدة مش مرتبطة."
      - "Oligo 70، DIP 10، mutilans 5، RA-like 15، spondylitis 5."
      - "DIP = entheses مش synovium. B27 في 30% من الـ axial؛ B27− = older، cervical، unilateral SI، bulky skipping."
    practice: [rheum.L20.020, rheum.L20.021, rheum.L20.022, rheum.L20.023, rheum.L20.024, rheum.L20.025, rheum.L20.026, rheum.L20.027, rheum.L20.028, rheum.L20.029, rheum.L20.030, rheum.L20.031, rheum.L20.032, rheum.L20.033, rheum.L20.034, rheum.L20.035, rheum.L20.036, rheum.L20.037, rheum.L20.038, rheum.L20.099, rheum.L20.100]
  # ------------------------------------------------------------------
  - id: rheum.L20.lesson3
    title: "التشخيص: CASPAR والأشعة"
    hook: "مفيش test واحد للـ PsA، بس فيه عدّاد نقط وصورة أشعة مشهورة: pencil-in-cup."
    minutes: 9
    pages: [333, 335]
    topics: [extraarticular, diagnosis, imaging]
    goals:
      - "تقارن الـ PsA بباقي الـ SpA"
      - "تحسب الـ CASPAR"
      - "تعرف علامات الأشعة"
    status: unverified
    steps:
      - kind: explain
        page: 333
        title: "بره المفاصل"
        quote: "Ocular disease: Iritis or uveitis occurs in 7% to 18%, more bilateral than in AS, but is usually found in patients with spinal involvement."
        text: |
          أقل من الـ RA:
          - ==Uveitis== في **7–18%**، **bilateral** أكتر من الـ AS، وغالبًا مع الـ spinal disease
          - **Aortic insufficiency**
          - **Metabolic syndrome** و cardiovascular risk
          - **IBD**، **amyloidosis**، fatigue و fibromyalgia
      - kind: table
        page: 333
        quote: "HLA-B27 45–50% 90–95% 70% 30%"
        title: "الـ PsA وإخواته"
        columns: [Feature, PsA, AS]
        rows:
          - ["M:F", "1:1", "2:1"]
          - ["HLA-B27", "45–50%", "90–95%"]
          - ["Peripheral", "95%", "30%"]
          - ["Axial", "50%", "100%"]
          - ["Dactylitis", "+++", "–"]
          - ["Psoriasis", "All", "10%"]
        hide: [[0, 1], [1, 1], [2, 1], [4, 1]]
      - kind: aside
        tone: tip
        page: 333
        quote: "HLA-B27 45–50% 90–95% 70% 30%"
        text: "وفي نفس الجدول: **reactive arthritis** M:F **3:1**، B27 **70%**، peripheral **90%**. والـ **enteropathic** M:F **2:1**، B27 **30%**، peripheral و axial **30%**، ومفيش dactylitis ولا enthesitis."
      - kind: explain
        page: 334
        title: "CASPAR (2006)"
        quote: "Inflammatory articular disease (joint,spine or entheseal)with 3 or more points from the following:"
        text: |
          الشرط: **inflammatory articular disease** (joint أو spine أو enthesis) + ==3 نقط أو أكتر==:

          - **Psoriasis:** current **2**، past **1**، أو family history **1** (لو هو مش مصاب)
          - **Nail lesions:** onycholysis، pitting، hyperkeratosis **1**
          - **Dactylitis** (حالي أو قديم، rheumatologist شافه) **1**
          - **RF negative** (أي طريقة غير latex) **1**
          - **Juxta-articular new bone** (مش osteophyte) **1**

          Specificity **98.7%**، sensitivity **91.4%**.
      - kind: check
        page: 334
        quote: "Skin psoriasis: present - 2 / previously present -1"
        question: "Inflammatory arthritis + current psoriasis + RF positive. Nothing else. CASPAR?"
        options: ["2: not classified", "3: classified", "4: classified", "1: not classified"]
        answer: 0
        why:
          - "صح: current psoriasis 2، والـ RF positive مش بيدّي نقطة. لازم 3."
          - "محتاج نقطة كمان: nails أو dactylitis أو new bone."
          - "مفيش بنود كفاية."
          - "الصدفية الحالية بـ 2 مش 1."
      - kind: explain
        page: 334
        title: "المعمل: usually seronegative"
        quote: "low levels of RF may be found in patients (5% to 16%) with typical PsA features."
        text: |
          - **ESR و CRP** ممكن يعلوا أو لأ.
          - **RF** low-level في **5–16%**.
          - **ACPA** في حوالي **5%**.
          - **ANA** > 1:80 في **14%**.

          علشان كده الوصف الأدق: ==usually seronegative==.
      - kind: figure
        page: 335
        quote: "Pencil-in-cup changes of digital joints. - Periostitis. - Joint ankyloses. - Tuft osteolysis."
        title: "Pencil-in-cup"
        alt: "Sketch of a finger joint. The proximal bone end is whittled to a pointed pencil tip; the distal bone base is widened into a cup that receives it. A fuzzy line along the shaft marks periostitis, and the fingertip tuft is partly dissolved."
        caption: "الطرف القريب بيتبري زي ==قلم رصاص==، والبعيد بيتوسّع زي **كوباية**. وجنبه **periostitis** (عضم جديد): destruction و new bone في نفس الصباع."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <path d="M120 20 L210 20 L210 120 L180 175 L150 175 L120 120 Z" class="fg-box"/>
            <path d="M100 205 Q165 160 230 205 L230 280 L100 280 Z" class="fg-box"/>
            <path d="M120 195 Q165 175 210 195" class="fg-ink"/>
            <path d="M112 30 Q106 70 112 110" class="fg-thin"/>
            <text x="225" y="70" class="t-sm t-b">Pencil</text>
            <text x="225" y="88" class="t-sm t-mut">bone end whittled</text>
            <text x="240" y="235" class="t-sm t-b">Cup</text>
