        quote: "Specific ―scleroderma pattern‖ is part of the 2013 ACR/EULAR classification criteria."
        title: "في الـ SSc والأمراض التانية"
        text: |
          الـ ==scleroderma pattern== جزء من **2013 American College of Rheumatology (ACR)/European League Against Rheumatism (EULAR) classification criteria** للـ SSc، وبيرتبط بـ:

          - **Pulmonary arterial hypertension**.
          - **Interstitial lung disease**.
          - **Digital ulcers**.

          في الأمراض التانية:

          - **Dermatomyositis**: dropout، dilated loops، haemorrhages.
          - **Systemic lupus erythematosus (SLE)**: non-specific.
          - **Primary Raynaud's**: normal أو minimally altered.

          وأهم استخدام: early diagnosis في **ANA-positive** عنده Raynaud's.
      - kind: reveal
        page: 216
        quote: "Correlates with:\n    Pulmonary arterial hypertension.\n    Interstitial lung disease.\n    Digital ulcers."
        prompt: "إزاي أوعية الضافر بتتنبأ بالرئة والقلب؟"
        answer: |
          الكتاب: الـ pattern ==correlates with== **pulmonary arterial hypertension**، **interstitial lung disease**، و **digital ulcers**.

          التفسير المقبول (مش في الكتاب): الـ SSc مرض أوعية صغيرة في الجسم كله. الضافر هو ==الشباك== الوحيد اللي نقدر نشوف منه الأوعية دي بعنينا. لو الشباك بيورّي loss و giant loops، غالبًا نفس الخراب حاصل في أوعية الرئة (فيعمل PAH) وفي أطراف الصوابع (فتعمل ulcers).
