            </g>
            <path d="M165 342v26" class="fg-arrow" marker-end="url(#L06g)"/>
            <text x="175" y="360" class="t-sm t-mut">decompensates</text>
            <rect x="10" y="372" width="310" height="30" rx="8" class="fg-bad"/>
