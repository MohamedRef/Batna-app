        quote: "Investigations\n  1- Confirm diagnosis by biopsy, best histology of lymph node by excision biopsy.\n  2- Blood picture: normochromic normocytic anaemia, reactive leucocytosis, eosinophilia and / or reactive mild thrombocytosis.\n  3- ESR/ plasma viscosity: high in active HD and could be good for follow up.\n  4- LDH: high in advanced disease.\n  5- Liver functions: may be abnormal in liver involvement in HD.\n  6- Blood uric acid: high i.e. secondary gout due to lympho-proliferative activity.\n  7- Abnormal kidney functions: due to involvement by HD or due to secondary gout.\n  8- Chest X-ray: for LN enlargement or infections secondary to immune suppression.\n  9- CT-chest, abdomen and pelvis: to define nodal and extra-nodal involvement.\n  10- Bone marrow trephine: to exclude marrow involvement.\n  11- MRI or PET scan: may be necessary in difficult cases."
