  - id: hem.L10.lesson4
    title: "علاج الـ PV: فصد، أسبرين، وحبة لو كبير"
    hook: "الهدف واحد: تمنع الجلطة من غير ما تعمل نزيف. والسن بيقرر الدوا."
    minutes: 10
    pages: [164, 168]
    topics: [pv-treatment]
    goals:
      - "تعرف هدف العلاج والـ risk groups"
      - "تكتب الـ venesection protocol"
      - "تختار الـ cytoreductive agent الصح"
    status: unverified
    steps:
      - kind: explain
        page: 164
        title: "الهدف"
        quote: "The goal of therapy in PV\n  1. Primarily to reduce the risk of thrombosis without increasing the bleeding tendency\n  2. and, secondarily, to ameliorate symptoms, particularly vasomotor manifestations"
        text: |
          1. أولًا: ==reduce the risk of thrombosis without increasing the bleeding tendency==.
          2. تانيًا: تخفيف الأعراض، خصوصًا **vasomotor**.
      - kind: table
        page: 168
        quote: "Criteria for risk stratification in patients with PV and risk-adapted therapy\n| Risk category | Risk variables | Therapy |\n| Low | Age <60 years old; and no thrombosis history | Phlebotomy and correction of CV risk factors, and aspirin |\n| High | Age ≥60 years old and/or thrombosis history | Cytoreduction, and correction of CV risk factors, and aspirin*, plus/minus phlebotomy† |"
        title: "الـ risk groups في الـ PV"
        columns: [Risk, Who, Therapy]
        rows:
          - [Low, "<60 and no thrombosis", "Phlebotomy + CV risk control + aspirin"]
          - [High, "≥60 and/or thrombosis", "Cytoreduction + CV risk control + aspirin ± phlebotomy"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2]]
      - kind: explain
        page: 165
        title: "Venesection"
        quote: "Venesection\n  Is the quickest way of reducing RCM.\n  450 ml of blood removed (± isovolaemic replacement with normal saline) in adult every 2-3 days, twice weekly in old patients.\n  Target Hct <0.45.\n  Maintenance therapy individual requirement are variable (from 2 procedures/year to monthly venesection)\n  Increased risk of thrombosis in 1st 3 years, add aspirin and cytoreductive treatment."
        text: |
          - ==أسرع طريقة== تنزّل الـ red cell mass.
          - **450 mL** كل **2–3 أيام** في البالغين (مع normal saline isovolemic)، و**مرتين في الأسبوع** في الكبار.
          - **Target Hct <0.45**.
          - الـ maintenance بتختلف: من مرتين في السنة لمرة كل شهر.
          - أول **3 سنين** خطر التجلط أعلى: زوّد **aspirin** و **cytoreduction**.
      - kind: aside
        tone: analogy
        page: 165
        quote: "Is the quickest way of reducing RCM."
        text: "الـ venesection زي ما تفتح حنفية الخزان لما يطفح: أسرع حل يقلل الـ red cell mass (RCM)، بس المصنع (النخاع) لسه شغال، فهتحتاج تفتحها تاني. علشان كده الـ high risk محتاج **cytoreduction** يهدّي المصنع نفسه."
      - kind: check
        page: 168
        quote: "Recommendations for management of patients with PV\n  1. Venesection to maintain hematocrit < 0.45\n  2. Low-dose aspirin (unless contraindicated) a\n  3. Manage reversible thrombotic risk factors aggressively (e.g., smoking, hypertension, hypercholesterolemia, obesity)\n  4. Consider cytoreduction if\n    (i) Patient intolerant of venesection\n    (ii) Thrombocytosis develops\n    (iii) Symptomatic or progressive splenomegaly\n  5. Choice of cytoreductive therapy:\n    (i) < 40 years – interferon-α b\n    (ii) > 40 years – hydroxyurea ,c\na. Avoid aspirin while platelet count > 1500 x 10⁹/L.\nb. Anagrelide plus venesection may be useful in patients intolerant of or resistant to hydroxyurea and interferon.\nc. Consider 32P or intermittent use of busulfan if patient is elderly and outpatient attendance is impractical."
        question: "45-year-old, JAK2+ PV, Hct 0.58, no thrombosis or risk factors. Plan?"
        options: ["Venesection to Hct <0.45 + aspirin", "Hydroxyurea + aspirin", "32P", "Observation"]
        answer: 0
        why:
          - "صح: low risk = phlebotomy + aspirin + CV risk control."
          - "الـ cytoreduction للـ high risk أو الـ indications."
          - "الـ 32P leukemogenic ومش تحت 65."
          - "لازم تنزّل الـ Hct علشان التجلط."
      - kind: explain
        remind: [hem.L10.074, hem.L09.055]
        page: 166
        title: "الأدوية"
        quote: "Hydroxyurea\n  Antimetabolite, ribonucleotide reductase inhibitor.\n  Onset of myelosuppression is rapid\n  Dose 30mg/kg reduce to 10-20 mg/kg\n  Close monitoring of the dose when 1st used.\n  Not increased risk of malignancy.\n  Side effect, myelosuppression, photosensitivity, leg ulcers, GIT side effects."
        text: |
          - ==Hydroxyurea==: antimetabolite، **ribonucleotide reductase inhibitor**، مفعوله سريع. **30 mg/kg** وبعدين **10–20 mg/kg**. الكتاب: **not increased risk of malignancy**. أعراضه: myelosuppression، photosensitivity، leg ulcers، gastrointestinal (GI).
          - **IFN-α**: بيظبط الصفائح والـ packed cell volume (PCV)؛ للصغيرين، والحمل، والـ intractable pruritus، واللي ما استحملوش غيره. **3–5 mU** تلات مرات/أسبوع؛ غالي و flu-like و depression.
          - **32P**: بينزّل الـ RCM بعد **12 أسبوع**، **2.3 mCi/m²** IV. تجلط أقل بس **acute myeloid leukaemia (AML)** أكتر بكتير، فـ **مش تحت 65**.
          - **Anagrelide**: imidazoquinazoline (anti-cAMP phosphodiesterase)، بيوقف نضج الـ megakaryocytes بس. صداع، arrhythmia، fluid retention، دوخة؛ **ممنوع في القلب والحمل**.
      - kind: match
        page: 167
        quote: "Side effect, headache, arrythmia, fluid retention, dizziness. Contraindicated in cardiac patient and in pregnancy."
        prompt: "وصّل الدوا بأهم معلومة عنه في الـ PV:"
        pairs:
          - ["Hydroxyurea", "Ribonucleotide reductase inhibitor, 30 then 10–20 mg/kg"]
          - ["Interferon-alpha", "Young, pregnancy, intractable pruritus"]
          - ["Radioactive phosphorus", "Not under 65: leukemogenic"]
          - ["Anagrelide", "Contraindicated in cardiac patients and pregnancy"]
          - ["Aspirin", "75 mg/day; avoid with past GI bleeding"]
        why: "كل دوا له مكان: الـ hydroxyurea للكبار، الـ interferon (IFN) للصغيرين والحوامل، الـ 32P للمسنين بس، الـ anagrelide بعيد عن القلب والحمل، والـ aspirin بجرعة صغيرة."
      - kind: explain
        page: 167
        title: "Aspirin والـ supportive"
        quote: "Aspirin\n  Low dose 75 mg/day\n  In patient with risk of thrombosis (obesity, hypertension, DM, history of MI).\n  Avoid in those with a history of Hge esp. GIT."
        text: |
          - **Aspirin 75 mg/day** للي عندهم خطر تجلط (obesity، hypertension (HTN)، diabetes mellitus (DM)، myocardial infarction (MI) قبل كده). ابعد عنه لو فيه **نزيف قديم**، خصوصًا GI.
          - **Supportive**: سوايل كفاية، **allopurinol**، و antihistamine أو **H2 blocker** أو IFN للـ pruritus.
          - ==Bone marrow transplantation (BMT) is not advocated== في الـ stable PV (سن المرضى والـ natural history الهادية نسبيًا).
      - kind: explain
        page: 168
        title: "التوصيات بالترتيب"
        quote: "Recommendations for management of patients with PV\n  1. Venesection to maintain hematocrit < 0.45\n  2. Low-dose aspirin (unless contraindicated) a\n  3. Manage reversible thrombotic risk factors aggressively (e.g., smoking, hypertension, hypercholesterolemia, obesity)\n  4. Consider cytoreduction if\n    (i) Patient intolerant of venesection\n    (ii) Thrombocytosis develops\n    (iii) Symptomatic or progressive splenomegaly\n  5. Choice of cytoreductive therapy:\n    (i) < 40 years – interferon-α b\n    (ii) > 40 years – hydroxyurea ,c\na. Avoid aspirin while platelet count > 1500 x 10⁹/L.\nb. Anagrelide plus venesection may be useful in patients intolerant of or resistant to hydroxyurea and interferon.\nc. Consider 32P or intermittent use of busulfan if patient is elderly and outpatient attendance is impractical."
        text: |
          1. Venesection لـ **Hct <0.45**
          2. **Low-dose aspirin** (ابعد عنه لو الصفائح ==>1500 × 10⁹/L==)
          3. تحكّم جامد في الـ risk factors (تدخين، HTN، كوليسترول، سمنة)
