lessons:
  # ------------------------------------------------------------------
  - id: hb.L03.lesson1
    title: "الضغط بيتحبس فين؟"
    hook: "دم الأمعاء رايح للقلب، والزحمة ممكن تبقى قبل الكبد أو جوّاه أو بعده. البلهارسيا فين؟"
    minutes: 9
    pages: [37, 39]
    topics: [overview, classification]
    goals:
      - "تقول هدف علاج الـ portal hypertension في الـ compensated والـ decompensated"
      - "تحفظ أرقام الـ varices (30% ثم 90%) والـ predictors التلاتة"
      - "تصنّف أي سبب: pre-hepatic، hepatic (pre / sinusoidal / post)، post-hepatic"
      - "تقرأ wedged و free hepatic pressure وتعرف المستوى"
    status: unverified
    steps:
      - kind: explain
        page: 37
        title: "أهم مضاعفة للـ cirrhosis"
        quote: "the most common complication of cirrhosis and represents the main driver of hepatic decompensation"
        text: |
          الـ **portal hypertension (PH)** هو **أشهر مضاعفة للـ cirrhosis**، وهو **المحرّك الأساسي للـ hepatic decompensation**. يعني لو فهمته، فهمت نص الهيباتولوجي.

          والعلاج بيتغير حسب المريض فين:

          - **Compensated cirrhosis:** الهدف الكبير إننا **نقلل خطر الـ decompensation**: ascites، variceal bleeding، hepatic encephalopathy.
          - **Decompensated:** الهدف نمنع **further decompensation** (recurrent/refractory ascites، variceal rebleeding، recurrent encephalopathy، SBP، hepatorenal syndrome) **ونحسّن الـ survival**.
      - kind: sort
        page: 37
        prompt: "كل حدث من دول بنمنعه في أنهي مرحلة حسب الكتاب؟"
        bins: ["Compensated: prevent first decompensation", "Decompensated: prevent further decompensation"]
        cards:
          - { text: "First ascites", bin: 0 }
          - { text: "First variceal bleeding", bin: 0 }
          - { text: "First hepatic encephalopathy", bin: 0 }
          - { text: "Variceal rebleeding", bin: 1 }
          - { text: "Spontaneous bacterial peritonitis", bin: 1 }
          - { text: "Hepatorenal syndrome", bin: 1 }
          - { text: "Refractory ascites", bin: 1 }
        why: "التلاتة الكبار (ascites، bleeding، encephalopathy) هما تعريف الـ **decompensation**. بعد ما تحصل، القايمة بتكبر: rebleeding، recurrent HE، refractory ascites، **SBP و HRS**، والهدف يبقى كمان **survival**."
      - kind: explain
        page: 37
        title: "الـ varices: مسألة وقت"
        text: |
          - حوالي **30%** من مرضى الـ cirrhosis عندهم **esophageal varices وقت التشخيص**.
          - النسبة بتزيد مع الوقت لحد **90% بعد حوالي 10 سنين**.

          وفيه تلات حاجات بتتوقع وجود الـ varices:

          - **INR أكتر من 1.5**
          - **Portal vein diameter > 13 mm**
          - **Thrombopenia** (صفايح واطية)

          ودي ممكن تأثر على **قرار الـ gastroscopy** للبحث عن varices علشان الـ primary prophylaxis.
      - kind: aside
        tone: tip
        page: 37
        text: |
          الـ predictors كلها منطقية: **INR أكتر من 1.5** = الكبد مش بيصنّع كويس (مرض متقدم)، **portal vein > 13 mm** = الوريد منفوخ من الضغط، و **platelets واطية** = طحال كبير بيحجزها.

          ورقمين يتحفظوا مع بعض: **1.5 و 13**.
      - kind: figure
        page: 38
        title: "رحلة الدم والزحمة فين"
        alt: "Blood flows down the page from spleen and gut, through the splenic and portal veins, through the liver (portal venule, sinusoid, central venule), then the hepatic veins and IVC to the right heart. Causes are listed beside each level. Pre-hepatic: portal vein thrombosis, splenic vein thrombosis, massive splenomegaly. Pre-sinusoidal: schistosomiasis, congenital hepatic fibrosis. Sinusoidal: cirrhosis, alcoholic hepatitis. Post-sinusoidal: hepatic sinusoidal obstruction. Post-hepatic: Budd-Chiari syndrome, IVC webs, cardiac causes (restrictive cardiomyopathy, constrictive pericarditis, severe heart failure). Portal hypertension is a portal to hepatic vein pressure gradient above 10 mmHg."
