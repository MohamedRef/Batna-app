  - id: git.L01.lesson12
    title: "الـ complications، الجراح، والـ gastrinoma"
    hook: "قرحة خرّمت، وقرحة سدّت المخرج، وقرحة ما بتخفّش أبدًا. التالتة وراها ورم صغير بيضخ gastrin."
    minutes: 10
    pages: [35, 39]
    topics: [pud-management, zes]
    goals:
      - "تعرف تشخيص وعلاج الـ gastric outlet obstruction والـ perforation"
      - "تعدّ الـ 5 indications للجراحة"
      - "تشك في Zollinger-Ellison syndrome (ZES) وتمشي في الـ algorithm"
    status: unverified
    steps:
      - kind: table
        page: 35
        quote: "Patient presents with vomiting of food consumed 2 -3days before"
        title: "الـ complications بتتعالج إزاي؟"
        columns: ["Complication", "Clue", "Management"]
        rows:
          - ["Gastric outlet obstruction", "Vomiting food eaten 2-3 days before", "Resuscitation, NG suction, balloon dilatation, bypass surgery"]
          - ["Perforation", "Acute abdomen; air under right cupola on erect X-ray", "NPO, IV antibiotics and fluids, surgery"]
        hide: [[0, 1], [0, 2], [1, 2]]
      - kind: explain
        page: 35
        quote: "Plain X ray chest and abdomen standing shows air under right copula of diaphragm"
        title: "الأعراض دي جاية منين؟"
        text: |
          التفسير المقبول (مش في الكتاب) للعلامات اللي الكتاب بيذكرها:

          - **Vomiting of food consumed 2-3 days before**: القرحة عند الـ pylorus عملت تليّف وتورّم فسدّت المخرج، فالأكل بيقعد في المعدة أيام. ونفس السبب للـ succussion splash.
          - **Resuscitation** و **NG suction** الأول: المريض ده جفّ من الترجيع، والمعدة المتمددة محتاجة تفضى قبل أي تدخل. وبعدها **balloon dilatation** أو **bypass surgery**.
          - ==Air under the right cupola==: القرحة خرّمت، فالهوا اللي في المعدة طلع للـ peritoneum وطلع لفوق تحت الـ diaphragm وهو واقف. عشان كده لازم **standing** film.
          - **NPO** و **IV antibiotics + fluids**: علشان ما يدخلش حاجة للبطن، والـ peritonitis بتتعالج، وبعدين **surgery**.
      - kind: figure
        page: 36
        title: "Perforation: هوا تحت الـ diaphragm"
        image: { file: git/L01-perforation-xray.webp, book: true }
        alt: "Book erect chest X-ray showing a thin crescent of free air under the right hemidiaphragm."
        caption: |
          الصورة في الكتاب واقف (**standing**): شوف الهلال الأسود الرفيع تحت الـ **right cupola** of the diaphragm. ده **free air** = perforation.
      - kind: explain
        remind: [git.L01.148]
        page: 36
        quote: "Refractory ulcers • Haemorrhage not responding to endoscopic treatment • Gastric outlet obstruction • Perforation • Suspicious of Malignancy"
        title: "إمتى الجراح؟"
        text: |
          خمسة:
          - **Refractory** ulcers
          - **Hemorrhage** مش بيستجيب للـ endoscopic treatment
          - **Gastric outlet obstruction**
          - **Perforation**
          - **Suspicion of malignancy**

          افتكرها بـ ==«RHOPS»==: «روبس»، الحبال اللي بيشدّ بيها الجراح المريض لأوضة العمليات. 😄
      - kind: reveal
        page: 36
        quote: "Refractory ulcers • Haemorrhage not responding to endoscopic treatment • Gastric outlet obstruction • Perforation • Suspicious of Malignancy"
        prompt: "الخمس indications بتوع الجراحة، إيه اللي بيجمعهم؟"
        answer: |
          كلهم حالات **العلاج الطبي أو المنظار مش هيحلها**. التفسير المقبول (مش في الكتاب) لكل واحدة:

          - **Refractory**: الـ PPI وعلاج الـ H. pylori ما نفعوش، فلازم نشيل المكان.
          - **Haemorrhage** مش بيستجيب للمنظار: الشريان لازم يتربط بإيد الجراح.
          - **Gastric outlet obstruction**: تليّف ميكانيكي، لو الـ balloon ما فتحوش يبقى bypass.
          - **Perforation**: خرم مفتوح على الـ peritoneum لازم يتقفل.
          - **Suspicion of malignancy**: محتاج resection وتشخيص أكيد.
      - kind: figure
        page: 36
        title: "الـ ZES في صورة واحدة"
        image: { file: git/L01-zes-sketch.webp, book: true }
        alt: "Book sketch: a gastrin-secreting tumor in a non-beta islet cell of the pancreas sends gastrin to the parietal cell, which pours hydrochloric acid into the stomach and causes ulcer formation; associated with MEN1; clinical features abdominal pain, chronic diarrhea, dyspepsia, weight loss and GI bleeding."
        caption: |
          ورم **gastrin-secreting** في **non-beta islet cell** ← gastrin ← **parietal cell** ← **hydrochloric acid** ← **ulcer formation**. ومرتبط بـ ==MEN1==.

          الـ clinical: **abdominal pain**، **chronic diarrhea**، **dyspepsia**، **weight loss**، **GI bleeding**.
      - kind: explain
        remind: [git.L01.149]
        page: 37
        quote: "Ulcers in unusual locations; associated with severe .esophagitis; resistant to therapy with frequent recurrences;"
        title: "الـ ulcer اللي مش طبيعي: فكّر في ZES"
        text: |
          إمتى تشك في **Zollinger-Ellison**؟
          - **Multiple** ulcers أو في **أماكن غريبة** (post-bulbar).
          - مع **severe esophagitis**، **resistant**، و **بترجع** كتير.
          - ==مفيش NSAID ولا H. pylori==.
          - Family history كبيرة لـ peptic ulcer، أو **ulcer راجع بعد العملية**.
          - **Diarrhea** أو steatorrhea من غير سبب.
          - **Hypercalcemia**، أو family history لـ pancreatic islet أو pituitary أو parathyroid tumor (**multiple endocrine neoplasia type 1 (MEN1)**).
          - **Prominent gastric or duodenal folds**.

          ليه كل واحدة؟ التفسير المقبول (مش في الكتاب): الحمض الكتير بيطلع لحد أماكن عمره ما يوصلها (post-bulbar، الـ esophagus). ولما ينزل للأمعاء بيعطّل الـ **lipase** وبيبوّظ الـ villi، فإسهال و steatorrhea. والـ gastrin **trophic** فبيكبّر الـ folds. والـ hypercalcemia من الـ parathyroid في الـ MEN1.
      - kind: reveal
        page: 37
        quote: "Gastric hypochlorhydria or achlorhydria(the most frequent), with or without pernicious anemia"
        prompt: "الـ gastrin عالي. هل كده gastrinoma؟"
        answer: |
          لأ، مش لازم. الطبيعي **<150 pg/mL**، وتقريبًا كل الـ gastrinoma فوق **150-200**، وأكتر من **10 أضعاف** الطبيعي بيرجّح ZES جامد. بس فيه أسباب تانية:

          - **Anti-secretory drugs** (الـ PPI نفسه!)
          - ==Hypochlorhydria أو achlorhydria== (الأكتر)، مع أو من غير pernicious anemia
          - **G cell hyperplasia**، **gastric outlet obstruction**، **renal insufficiency**
          - RA، vitiligo، DM، pheochromocytoma

          المنطق: لما الحمض يقل، المعدة بتعلّي الـ gastrin علشان تعوّضه. وعلشان كده بتعيد القياس.
      - kind: explain
        remind: [git.L01.158]
        page: 38
        quote: "An increase in gastrin of ≥120 pg within 15 min of secretin injection has a sensitivity and specificity of >90% for ZES."
        title: "الـ secretin test"
        text: |
          الـ provocative tests اتنين: **secretin stimulation** و **calcium infusion**، والـ ==secretin== هو **the most sensitive and specific**.

          - Positive = gastrin يزيد **≥120 pg** خلال **15 min** من الحقن ← sensitivity و specificity أكتر من **90%**.
          - **وقف الـ PPI أسبوع** قبله، لأن الـ hypochlorhydria بتاعته بتعمل **false positive**.
          - وفي الـ localization: **CT/MRI**، **endoscopic ultrasound (EUS)** (بيشوف الـ pancreas والـ LN بس **مش بيشوف الـ duodenal lesions**)، **octreotide scan**، و surgery.
