    kind: table
    topic: hd-machine
    title: Alarms on the dialysis machine
    columns: [Circuit, Alarms]
    rows:
      - ["Dialysate circuit", "Conductivity (sodium, bicarbonate), temperature, haemoglobin (blood leak)"]
      - ["Blood circuit", "Inflow pressure, outflow pressure, air detector"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 294, quote: "Dialysate circuit: The key components/processes of this circuit include: Heating; Deaeration; Proportioning; Monitoring; UF; and Disinfection. Alarm system for monitoring: Conductivity (reflection of sodium, bicarbonate conc), Temperature, Hemglobin (blood leak)." }
    status: unverified
  - id: neph.L09.018
    kind: mcq
    topic: hd-machine
    stem: During haemodialysis the conductivity alarm sounds. What does conductivity mainly reflect?
    options:
      - Dialysate sodium and bicarbonate concentration
      - Blood leak into the dialysate
      - Air in the venous line
      - Dialysate temperature
    answer: 0
    why:
      - "Correct: conductivity reflects sodium and bicarbonate concentration (p294)."
      - Blood leak is detected by the haemoglobin sensor.
      - Air is picked up by the air detector in the blood circuit.
      - Temperature has its own alarm.
    src: { page: 294, quote: "Dialysate circuit: The key components/processes of this circuit include: Heating; Deaeration; Proportioning; Monitoring; UF; and Disinfection. Alarm system for monitoring: Conductivity (reflection of sodium, bicarbonate conc), Temperature, Hemglobin (blood leak)." }
    status: unverified
  # ---------- p295: dose and anticoagulation ----------
  - id: neph.L09.019
    kind: cloze
    topic: hd-dose
    text: "Haemodialysis should be delivered at least {{c1::three times}} a week, for a total of at least {{c2::12 h}} a week."
    src: { page: 295, quote: "Dialysis should be delivered at least three times per week and the total duration should be at least 12 h per week." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L09.020
    kind: cloze
    topic: hd-dose
    text: "A pregnant woman on haemodialysis should receive at least {{c1::5}} sessions a week, at least {{c2::20 h}} a week."
    src: { page: 295, quote: "An increase in treatment time and/or frequency in certain conditions: hemodynamic, CV instability, resistant hypertension, impaired phosphate control. Pregnant women should receive at least 5 sessions/w, minimum duration of 20h/w." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L09.021
    kind: enumerate
    topic: hd-dose
    prompt: When should haemodialysis time or frequency be increased?
    points:
      - Haemodynamic or cardiovascular instability
      - Resistant hypertension
      - Impaired phosphate control
      - Pregnancy
    pass: 3
    hook: "زوّد وقت الجلسة أو عددها لو «قلب مش مستحمل، ضغط عنيد، فوسفور عاصي، أو حمل» = haemodynamic أو cardiovascular instability، resistant hypertension، impaired phosphate control، pregnancy."
    src: { page: 295, quote: "An increase in treatment time and/or frequency in certain conditions: hemodynamic, CV instability, resistant hypertension, impaired phosphate control. Pregnant women should receive at least 5 sessions/w, minimum duration of 20h/w." }
    status: unverified
  - id: neph.L09.022
    kind: card
    topic: hd-dose
    front: What is incremental haemodialysis, and what must be checked during it?
    back: Therapy increased progressively over time (later augmented schedules); lower doses may suit patients with significant residual renal function, which should be quantified intermittently.
    src: { page: 295, quote: "European Best practice guidelines (2007), Renal Association Clinical Practice Guideline on Haemodialysis, ESNT dialysis guidelines (2019) suggest that lower haemodialysis dose targets may be optimal in patients with significant residual renal function. [2D], recommend that residual renal function should be quantified intermittently in patients on incremental dialysis schedules. [1D]. Extracorporeal Anticoagulation:" }
    status: unverified
  - id: neph.L09.023
    kind: table
    topic: hd-dose
    title: Anticoagulation of the extracorporeal circuit
    columns: [Patient, Recommendation]
    rows:
      - ["No increased bleeding risk", "Unfractionated or low-molecular-weight heparin [1A]"]
      - ["Increased bleeding risk", "Omit or reduce systemic anticoagulation [1C]"]
      - ["Heparin allergy", "Non-heparin anticoagulation [1A]"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 295, quote: "It is recommend that patients without increased bleeding risk should be given unfractionated or low-molecular weight heparin during dialysis to reduce clotting of the extracorporeal system. [1A], that systemic anticoagulation should be omitted or deminished in patients with increased bleeding risk. [1C], that patients with heparin allergies should be prescribed a non-heparin form of anticoagulation. [1A]." }
    status: unverified
