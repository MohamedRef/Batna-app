        quote: "| | Sodium polystyrene sulfonate | Patiromer | Sodium zirconium cyclosilicate |\n| Mechanism of action | Na+-K+ exchange resin often given with sorbitol, nonselectively binds K+, Ca2+, Mg2+ | Exchanges Ca2+ for K+, also binds Mg2+ | Binds K+ in exchange for H+ and Na+ |\n| Time of onset | Variable (hours to days) | 7 h | 1 h |\n| Binding site | Colon | Colon | Entire intestinal tract |\n| Commonly reported adverse reactions and precautions | Diarrhea, metabolic alkalosis, hypernatremia, volume overload, rarely colonic necrosis, must separate dose from other oral drugs by at least 3 h | Constipation, diarrhea, flatulence, hypomagnesemia, must separate dose from other oral drugs by at least 3 h | Constipation, diarrhea, edema, can increase gastric pH potentially interfering with drugs having pH dependent solubility |"
