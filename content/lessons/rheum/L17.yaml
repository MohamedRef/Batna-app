  - id: rheum.L17.lesson3
    title: "الصور والـ criteria: من الـ bamboo spine للـ ASAS"
    hook: "الـ X-ray بيتأخر سنين، والـ MRI بيشوف النار وهي لسه بتولّع."
    minutes: 9
    pages: [286, 289]
    topics: [imaging, criteria, activity]
    goals:
      - "تقرا الـ sacroiliitis grades وعلامات الـ spine"
      - "تطبّق الـ modified New York والـ ASAS axial و peripheral"
      - "تعرف الـ BASDAI والـ ASDAS والـ cut-offs"
    status: unverified
    steps:
      - kind: explain
        page: 286
        title: "الـ sacroiliac في الـ X-ray"
        quote: "There are subchondral erosions, sclerosis, and proliferation on the iliac side."
        text: |
          الـ X-ray ==مش sensitive أوي==.

          الـ sacroiliitis في الـ AS: **symmetrical و bilateral**، فيه subchondral erosions و sclerosis و proliferation على ناحية الـ ==iliac==، وفي الآخر المفصل يتقفل خالص.
      - kind: order
        page: 286
        quote: "II: Minimal sclerosis with some erosion (pseudo-widening)."
        prompt: "رتّب الـ sacroiliitis من الأخف للأشد:"
        steps:
          - "Normal joint"
          - "Blurred margins (suspicious)"
          - "Minimal sclerosis, some erosion, pseudo-widening"
          - "Severe erosions, definite sclerosis both sides"
          - "Complete ankylosis"
        why: "Grade 0 طبيعي، I blurring، II sclerosis خفيف مع erosion (المفصل يبان أوسع)، III erosions شديدة و sclerosis الناحيتين، IV ankylosis."
      - kind: figure
        page: 286
        quote: "Syndesmophytes new bone formation growing vertically from the annulous fibrosis bony bridging of adjacent vertebrae ―bamboo spine‖."
        title: "الـ syndesmophyte ضد الـ osteophyte"
        alt: "Two pairs of vertebrae side by side. Left, AS: thin vertical bony bridges (syndesmophytes) grow from the annulus fibrosus at the corners and join the vertebrae, with squared vertebral bodies, giving a bamboo spine. Right, degenerative disease: horizontal beak-like osteophytes stick out sideways from the edges."
        caption: "الـ **syndesmophyte** بيطلع ==رأسي== ويربط الفقرات (bamboo spine)، والفقرة نفسها تبقى مربّعة (squaring). الـ **osteophyte** بتاع الـ degenerative بيطلع أفقي زي المنقار."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
