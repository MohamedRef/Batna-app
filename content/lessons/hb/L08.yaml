          كلمة **slow acetylators** بتتكرر مع: **sulfonamide**، **rifampicin**، و **pyrazinamide**. ولاحظ إن الـ **INH** نفسه risk factor للـ rifampicin والـ pyrazinamide، يعني الـ anti-TB combination بيقوّي بعضه في الأذى.
      - kind: figure
        page: 132
        quote: "Diagrammatic representation of Drug-induced liver injury (DILI)\nDrug → (CYP450) Metabolites:\n  Intrinsic Pathway: GSH ↓ → Covalent binding to various: Enzymes, lipids, nucleic acid → Mitochondrial permeability transition\n  ATP ↓, ROS ↑ → Direct mitochondrial inhibition → Mitochondrial permeability transition\n  Extrinsic Pathway → Kupffer cell → Release TNFα, FasL → Binds to Intracellular death receptor → Activate Caspase 8 → Activate Bcl2 pro-apoptotic protein, DISC → Leads to Mitochondrial permeability transition\nMitochondrial permeability transition (Final Step):\n  Cytochrome → Binds to Cytoplasmic scaffold proteins → Form Apoptosome → Activate Caspase → Cytoplasmic & nuclear condensation & fragmentation → APOPTOSIS\n  ↓ ATP → Bleb formation, Actin oxidation, Microfilament breakage, Cellular swelling → Cytokines release → NECROSIS"
        title: "الخلية بتموت إزاي؟ apoptosis ولا necrosis"
        alt: "Drug is metabolised by CYP450 to metabolites. Intrinsic pathway: covalent binding to enzymes, lipids and nucleic acids with glutathione depletion, and direct mitochondrial inhibition with ATP down and ROS up. Extrinsic pathway: Kupffer cell releases TNF alpha and FasL, which bind the death receptor and activate caspase 8 and pro-apoptotic Bcl2 and DISC. Both lead to mitochondrial permeability transition. Then cytochrome c release, apoptosome, caspase and apoptosis; or ATP fall, bleb formation, actin oxidation, swelling, cytokine release and necrosis."
        caption: "الـ **mitochondrial permeability transition** هي الـ **final step**. بعدها الـ **adenosine triphosphate (ATP)** بيقرر: cytochrome c → **apoptosis**، أو ATP ↓ → **necrosis**. ملحوظة: رسمة الكتاب (صفحة 132) كاتبة **ATP ↑** جنب الـ direct mitochondrial inhibition، وده غالبًا سهو؛ الـ inhibition بيقلل الـ ATP."
