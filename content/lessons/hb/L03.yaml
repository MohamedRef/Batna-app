        text: |
          الدوالي اللي نزفت مرة زي الحنفية اللي نقّطت مرة: لو سبتها، هتنقّط تاني. 63% في سنتين من غير وقاية. 😄

          وعلشان كده الـ **secondary prophylaxis** مش اختيار، دي إلزامي بعد أي نزيف.
      - kind: explain
        page: 44
        quote: "All cirrhotic patients should be screened for varices at diagnosis"
        title: "المنظار بيوريك إيه؟"
        text: |
          الكتاب بيقول: «All cirrhotic patients should be screened for varices at diagnosis.»

          يعني كل مريض cirrhosis يعمل منظار وقت التشخيص، إلا لو عدّى Baveno من المحاضرة اللي فاتت (liver stiffness measurement (LSM) أقل من 20 و platelets أكتر من 150).

          صورة الكتاب في الـ **esophagogastroduodenoscopy (EGD)** فيها حاجتين:
          - Large oesophageal varices with red colour signs: علامات حمرا على الدوالي، معناها إن جدارها رفيع وخطر النزيف عالي.
          - **Mild portal hypertensive gastropathy**.

          **الـ portal hypertensive gastropathy (PHG)**
          - الكتاب بيقول: The diagnosis of PHG is made ==endoscopically== (ص45).
          - الوصف الكلاسيكي (مش في الشرح، بس جه في سؤال الـ multiple-choice question (MCQ) في الكتاب ص63): الغشاء المخاطي للجزء القريب من المعدة شكله **mosaic** أو **snakeskin**، زي جلد التعبان.
          - ليه؟ الغشاء المخاطي محتقن بالدم من الضغط، فبيبان شبكة.
      - kind: figure
        page: 44
        quote: "Large oesophageal varices with red colour signs."
        title: "دوالي بعلامات حمرا"
        image: { file: hb/L03-egd-varices.webp, book: true }
        marks:
          - { at: [0.91, 0.55], label: "Red colour sign" }
