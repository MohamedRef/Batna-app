        page: 364
        title: "الهرمونات متلخبطة"
        quote: "Fertility and Chronic Kidney Disease Women with chronic kidney disease experience disruption of the hypothalamic- gonadal axis that leads to irregularity in the menstrual cycle, anovulation, decreased libido, and impaired fertility. Women on maintenance dialysis, especially with amenorrhea, have high serum prolactin because of impaired kidney clearance, increased luteinizing hormone and follicular stimulating hormone, and decreased estradiol and progesterone concentration. The persistently elevated gonadotropins because of loss of negative feedback on hypothalamic and pituitary centers and absence of luteinizing hormone surge leads to anovulation.(27) Of importance, there is restoration of hormones such as gonadotropins and prolactin after kidney transplantation, suggesting that the underlying cause of the hormonal imbalances with kidney failure is related to the dysfunction of the kidneys rather than permanent damage to the hypothalamic- pituitary-ovarian axis.(28)"
        text: |
          الـ chronic kidney disease (CKD) بيبوّظ الـ **hypothalamic-gonadal axis**:
          - **Prolactin عالي**: الكلية مش بتنضفه.
          - **luteinising hormone (LH) و follicle-stimulating hormone (FSH) عاليين**: مفيش negative feedback.
          - **Estradiol و progesterone واطيين**، و ==مفيش LH surge== = **anovulation**.

          بعد الزرع الهرمونات بترجع، يعني العيب من ==الكلية== مش من الـ axis نفسه.
