        why: "الآمن: labetalol و nifedipine و methyldopa و hydralazine، steroids و calcineurin inhibitor (CNI) و hydroxychloroquine (HCQ) و azathioprine، erythropoietin (EPO) و iron، calcium binders و calcitriol، heparin، vitamins و folic acid و aspirin. الممنوع: renin–angiotensin system (RAS) inhibitors و atenolol و spironolactone، mycophenolate mofetil (MMF) و mammalian target of rapamycin (mTOR) و cyclophosphamide، HIF-PH inhibitors، cinacalcet، warfarin و direct oral anticoagulants، non-steroidal anti-inflammatory drugs (NSAIDs) و statins."
      - kind: figure
        page: 374
        quote: "Figure 3: Safety of medications during pregnancy among patients receiving maintenance dialysis."
        title: "شكل 3 في الكتاب: آمن ولا لأ؟"
        image: { file: neph/L11-dialysis-drug-safety.webp, book: true }
        alt: "The book's Figure 3, medication safety during pregnancy on dialysis: rows for antihypertensives, immunosuppression, anemia, mineral bone disease, anticoagulants and other medications; a green safe column (labetalol, nifedipine, methyldopa, hydralazine, glucocorticoids, calcineurin inhibitors, hydroxychloroquine, azathioprine, erythropoietin, iron, calcium-based binders, calcitriol, heparins, water-soluble vitamins, folic acid, low-dose aspirin) and a red unsafe column (RAS inhibitors, atenolol, spironolactone, mycophenolate, sirolimus, cyclophosphamide, HIF prolyl hydroxylase inhibitors, non-calcium binders, cinacalcet, warfarin, direct anticoagulants, NSAIDs, statins)."
        caption: |
          الإجابة الكاملة للتمرين اللي فوق، في جدول بلونين:

          - **الأخضر (Safe)**: labetalol و nifedipine و methyldopa و hydralazine؛ steroids و CNI و hydroxychloroquine و ==azathioprine==؛ erythropoietin و iron؛ calcium-based binders و calcitriol؛ heparin؛ ودبل جرعة الـ water-soluble vitamins و folic acid و low-dose aspirin.
          - **الأحمر (Unsafe)**: ==RAS inhibitors== و atenolol و spironolactone؛ mycophenolate و sirolimus و cyclophosphamide؛ الـ HIF-PH inhibitors (roxadustat)؛ sevelamer و lanthanum و cinacalcet؛ warfarin والـ direct anticoagulants؛ NSAIDs و statins.

          اللي تاخده: كل صف فيه بديل آمن للممنوع: ACEi ← labetalol أو nifedipine، MMF ← azathioprine، warfarin ← heparin.
