      - kind: reveal
        page: 407
        prompt: "ليه بالذات سناك آخر الليل هو الأهم من الستة؟"
        answer: |
          لأن الليل هو أطول فترة من غير أكل (من العشا للفطار). ومع تلاجة glycogen فاضية، الصيام ده بيتحوّل لـ **gluconeogenesis from amino acids** يعني تكسير عضل طول الليل.

          السناك المتأخر بيقصّر الصيام ده، فبيحمي العضل. السبب ده physiology مقبولة؛ الكتاب بيقول الحكم بس: **the most important**.
      - kind: explain
        page: 408
        title: "نصايح للعيان (بالنص اللي بيحبه الممتحن)"
        text: |
          دي النصايح بنص الكتاب، ومعاها ليه:

          - ==With the exception of alcohol, virtually no food damages the liver==. الممنوع الحقيقي واحد بس، فما تحرمش العيان من أكل هو محتاجه.
          - **Fruit and vegetables** دايمًا، وكل ما كتر كل ما أحسن.
          - **Salt should be restricted.** ولو النصيحة دي قللت أكله، يبلّغ الدكتور أو الـ dietician، لأن قلة الأكل أخطر.
          - اللي عنده **HE** ممكن يستحمل vegetable and dairy proteins أحسن من الـ animal proteins.
          - ==A reduction in total protein intake is not advisable in cirrhosis==. ومايغيّرش البروتين من دماغه من غير دكتور.
          - لو عنده **concomitant disease** يبلّغ، لأنه ممكن يحتاج تعديل في الأكل.
      - kind: aside
        tone: joke
        page: 408
        text: |
          العيان: "يا دكتور الفسيخ ممنوع علشان الكبد؟"

          الكتاب: لأ، **virtually no food damages the liver** غير الـ alcohol.

          بس الفسيخ ممنوع برضه... علشان **salt should be restricted**. 🐟🧂
      - kind: sort
        page: 407
        prompt: "نصيحة صح ولا غلط للعيان الـ cirrhotic؟"
        bins: ["Advise it", "Avoid it"]
        cards:
