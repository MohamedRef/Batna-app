  # Split from lesson2 on 2026-11-13 (#828): TLS prevention and dialysis.
  - id: neph.L12.lesson6
    title: "نوقف الـ TLS قبل ما يبدأ: مية، allopurinol، وdialysis"
    hook: "العلاج كله فكرة واحدة: خلي البول يجري، وامنع الـ uric acid يتعمل."
    minutes: 7
    pages: [416, 416]
    topics: [tls]
    goals:
      - "ترتّب الوقاية حسب الـ risk وتعرف ليه كل خطوة"
      - "تعرف ليه الـ urinary alkalinization ممنوع"
      - "تعرف امتى الـ hemodialysis وليه الـ CRRT"
    status: unverified
    steps:
      - kind: explain
        page: 416
        title: "الوقاية حسب الـ risk"
        quote: "For patients with higher risk, intravenous 0.9% saline or, preferably, a balanced isotonic crystalloid solution (1-2 mL/kg/hour) should be administered to maintain adequate hydration status and GFR.\nHydration should be started 24 to 48 hours before therapy."
        text: |
          - **Low risk:** **oral hydration** وابعد عن الـ nephrotoxins.
          - **Higher risk:** intravenous (IV) **0.9% saline** أو الأحسن ==balanced isotonic crystalloid== بمعدل **1-2 mL/kg/hour**، تبدأ **24-48 ساعة قبل** العلاج.
          - **High risk:** زوّد **xanthine oxidase inhibitor** (allopurinol أو febuxostat) علشان يمنع تكوين uric acid جديد.

          الـ hydration بيحافظ على الـ **tubular flow** فيغسل الـ uric acid والـ K والـ phosphate.
      - kind: explain
        page: 416
        title: "ليه المية هي الأساس؟"
        quote: "Hydration will also maintain tubular flow rates that facilitate clearance and dilution of uric acid as well as the clearance of potassium and phosphate."
        text: |
          الكتاب بيدّيك السبب صريح: الـ hydration بيحافظ على ==tubular flow==، فالـ uric acid **بيتخفّف** و **بيتغسل**، ومعاه الـ K والـ phosphate.

          فكّر فيها زي الحوض: لو المية بتجري، الرواسب مش بتلحق تقعد. لو المية واقفة، كل حاجة بتترسب.

          وليه تبدأ **24-48 ساعة قبل** العلاج؟ عشان أول ما الخلايا تبتدي تتكسر، تكون الأنابيب شغالة على آخرها. وليه الـ **balanced crystalloid** أحسن من الـ saline؟ التفسير المقبول (مش في الكتاب): الكميات الكبيرة من الـ saline فيها chloride كتير بيعمل acidosis، والـ TLS فيه acidosis أصلًا.
      - kind: figure
        page: 416
        quote: "Hydration will also maintain tubular flow rates that facilitate clearance and dilution of uric acid as well as the clearance of potassium and phosphate."
        title: "الـ uric acid جاي منين، وكل علاج بيضرب فين؟"
        alt: "A vertical chain: tumour cells break down with treatment, their DNA releases purines, hypoxanthine becomes xanthine and then uric acid by xanthine oxidase; uric acid crystals block the tubules and cause AKI. A red bar on both xanthine oxidase steps is labelled allopurinol or febuxostat: stops new uric acid, does not remove what is already there. A green arrow at the tubule step is labelled hydration: fast tubular flow dilutes and washes it out."
