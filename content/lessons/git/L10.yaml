  # ------------------------------------------------------------------
  - id: git.L10.lesson3
    title: "الـ manometry وعلاج الـ achalasia"
    hook: "ألوان الـ HRM شكلها خريطة طقس، بس لو فهمت 3 رسومات هتعرف الـ type والعلاج."
    minutes: 9
    pages: [274, 279]
    topics: [manometry, achalasia-tx]
    goals:
      - "تحفظ الضغوط الطبيعية ومعايير الانقباضة الطبيعية"
      - "تفرّق بين types I و II و III"
      - "تختار العلاج وتعرف أرقام كل واحد"
    status: unverified
    steps:
      - kind: explain
        page: 274
        quote: "Esophageal manometry, or motility testing, entails positioning a pressure sensing catheter within the esophagus and then observing the contractility following test swallows."
        title: "الـ manometry بتعمل إيه"
        text: |
          بنحط **pressure-sensing catheter** في المريء ونخلي المريض يبلع، ونشوف الضغوط:
          - الـ upper esophageal sphincter (UES) والـ lower esophageal sphincter (LES) بيبانوا **high-pressure zones** بترتخي مع البلع.
          - الـ body بيعمل **peristaltic contractions**.

          ودلوقتي الـ ==high-resolution manometry== (12-36 channel، مع impedance) هي **the gold standard** لتشخيص الـ motility disorders. والـ impedance بيستخدم catheter فيه **paired electrodes**.

          يعني الـ manometry بتقيس **الوظيفة** مش الشكل: بتقولك الـ sphincter بيرتخي ولا لأ، والموجة ماشية بالترتيب ولا لأ. والـ impedance (الـ paired electrodes) بيقيس مقاومة الكهربا بين كل زوج، فبيعرف اللقمة عدّت ولا قعدت مكانها.
      - kind: explain
        page: 275
        title: "ليه الـ HRM بقت الـ gold standard؟"
        quote: "High-resolution manometry (12-36 channels pressure, 16 channels impedance) is now considered the gold standard for diagnosis of esophageal motility disorders."
        text: |
          الكتاب: الـ ==high-resolution manometry== (**12-36 channels pressure**، **16 channels impedance**) هي الـ **gold standard** دلوقتي، والصورة في ص 275 بتقارن الـ **esophageal pressure topography** (شمال) بالـ **conventional manometry** (يمين) لنفس البلعة الطبيعية.

          ليه أحسن؟ التفسير المقبول (مش في الكتاب): الـ conventional كان فيه حساسات قليلة متباعدة، فبتشوف خطوط متفرقة وتخمّن اللي بينهم. الـ HRM حساساتها قريبة جدًا، فالكمبيوتر يرسم **خريطة ألوان** متصلة: الضغط العالي ألوان سخنة. يعني بتشوف الموجة ماشية من الـ UES للـ LES بعينك، وده اللي خلّى تقسيم الـ achalasia لتلات types ممكن.
      - kind: figure
        page: 275
        quote: "Chicago classification v3.0"
        title: "Chicago classification v3.0"
        image: { file: git/L10-chicago-v3.webp, book: true }
        alt: "Book table of the Chicago classification version 3.0: incomplete LES relaxation (achalasia types I to III, EGJ outflow obstruction); major motility disorders never seen in healthy controls (absent contractility, distal esophageal spasm, hypercontractile esophagus); minor motility disorders that can be seen in healthy controls (ineffective esophageal motility, fragmented peristalsis); and normal esophageal motility."
        caption: |
          الـ HRM بيرتّب الأمراض في 4 خانات:

          1. ==Incomplete LES relaxation==: achalasia (I، II، III) و EGJ outflow obstruction.
          2. **Major** (عمره ما بيتشاف في السليم): absent contractility، distal esophageal spasm، hypercontractile.
          3. **Minor** (ممكن يتشاف في السليم): ineffective motility، fragmented peristalsis.
          4. **Normal**.
      - kind: figure
        page: 275
        quote: "High-resolution esophageal pressure topography (Lt) and conventional manometry (Rt) of a normal swallow."
        title: "بلعة طبيعية على الـ HRM"
        image: { file: git/L10-normal-hrm.webp, book: true }
        alt: "Book pressure topography plot of a normal swallow beside conventional line tracings: the UES band at the top relaxes, a diagonal band of contraction runs down the esophageal body, and the LES band at the bottom relaxes then contracts; colours show pressure from 0 to 150 mmHg."
        caption: |
          الشمال HRM: الطول على الرأسي والوقت على الأفقي، واللون = الضغط. الـ **UES** فوق، بعدين ==موجة مايلة لتحت== (peristalsis)، والـ **LES** بيرتخي ويقفل.

          اليمين نفس البلعة بالـ conventional tracings. احفظ الشكل الطبيعي ده علشان تقارن بالـ types.
      - kind: table
        page: 276
        quote: "Resting pressure = 100 mmHg"
        title: "الضغوط الطبيعية (mmHg)"
        columns: ["Site", "Resting", "With a swallow"]
        rows:
          - ["UES", "100", "Zero or below"]
          - ["Body", "-5", "Contracts 30-180"]
          - ["LES", "20-40", "Relaxes to 5"]
          - ["Gastric fundus", "5", "-"]
        hide: [[0, 1], [1, 2], [2, 1], [2, 2]]
      - kind: aside
        tone: trap
        page: 276
        quote: "Resting pressure = 20-40 mmHg"
        text: |
          في الكتاب البند التالت مكتوب **"Body of the Esophagus"** تاني، بس الأرقام (resting 20-40، relaxation 5) واضح إنها بتاعة الـ **LES**. ولاحظ إن صفحة 284 بتقول LES pressure **10-35**. لو اتسألت عن الجدول ده، اكتب أرقام الجدول.
      - kind: explain
        remind: [git.L10.044]
        page: 277
        quote: "Amplitude of 30-180 mmHg.\nDuration of 2-6 seconds.\nSingle and occasionally double peaked."
        title: "الانقباضة الطبيعية"
        text: |
          أربع معايير:
          - **Sequential (peristaltic)** من فوق لتحت.
          - ==Amplitude 30-180 mmHg==.
          - **Duration 2-6 seconds**.
          - **Single** وأحيانًا double peaked.

          احفظ الـ 180 والـ 6 كويس: الـ diffuse esophageal spasm (DES) في الدرس الجاي بيعدّيهم.

          ليه الأرقام دي بالذات؟ لأن كل معيار بيقيس حاجة: **sequential** = الأعصاب منظمة الدور، **30-180** = العضلة قوية كفاية بس مش متشنجة، **2-6 ثواني** = بتنقبض وترتخي في وقتها. أي معيار يقع بيشاور على مرض معين.
      - kind: explain
        remind: [git.L10.045]
        page: 277
        quote: "Elevated resting lower esophageal sphincter (LES) pressure (above 45 mmHg)."
        title: "الـ manometry في الـ achalasia"
        text: |
          - **Resting LES pressure** عالي: هنا مكتوب ==above 45 mmHg== (وصفحة 272 قالت 40، الاتنين في الكتاب).
          - **Incomplete LES relaxation** بعد البلع.
          - **Aperistalsis** في الجزء الـ smooth من الـ body.
          - لو الانقباضات الـ simultaneous أعلى من **60 mmHg** يبقى اسمها **vigorous achalasia**.

          ليه الـ simultaneous بدل الـ peristaltic؟ لأن الأعصاب اللي بتنظّم **الدور** (مين ينقبض الأول) راحت، فلما العضلة تنقبض، بتنقبض كلها مرة واحدة. ولو قوية (فوق 60) يبقى الـ vigorous، وده بيفسّر الـ chest pain عند بعضهم.
