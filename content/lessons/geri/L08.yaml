    title: "الكتف والورك: الوتر الزعلان وعلاجه"
    hook: "كبير مش عارف ينام على كتفه، وست بيوجعها جنب وركها لما تنام عليه. الاتنين وتر، والعلاج الأول مش حقنة."
    minutes: 9
    pages: [136, 139]
    topics: [tendon-clinic, tendon-mx]
    goals:
      - "تفرّق rotator cuff tendinopathy من frozen shoulder بالحركة وتعرف ليه"
      - "تعرف صورة الـ gluteal tendinopathy وليه النوم على الجنب بيوجع"
      - "ترتّب العلاج من الـ exercise للجراحة، وتعرف الـ PRP بيتعمل وبيشتغل إزاي"
    status: unverified
    steps:
      - kind: explain
        page: 136
        quote: "Core clinical characteristics of rotator cuff degenerative tendinopathy include old age, focal night pain, weakness of shoulder muscles, and movement restriction. Shoulder pain generally radiates to the deltoid and the middle part of the upper arm. Weakness, movement restriction, or both, especially in active external rotation, are found in half of radiologically confirmed rotator cuff tears."
        title: "الـ rotator cuff: الصورة وسببها"
        text: |
          الكتاب بيقول الـ core features: **old age**، ==focal night pain==، **weakness** في عضلات الكتف، و **movement restriction**. الألم بيروح لـ **الـ deltoid** ونص الدراع، والضعف أو التقييد، خصوصًا في الـ **active external rotation**، موجود في **نص** الـ tears المتأكدة بالأشعة.

          التفسير المقبول (مش في الكتاب):
          - **بالليل** ليه؟ لما ينام على الكتف بيضغط الوتر، وافتكر إن الضغط (compression) نفسه بيأذي الوتر.
          - الألم في **الـ deltoid** مش في المفصل: ده referred pain، فما تتلخبطش وتدوّر في الدراع.
          - الضعف في الـ **active** بس: لأن الوتر هو اللي بيحرك، فلو بايظ العيان مش هيقدر يلف دراعه، بس إنت تقدر تلفهاله.
      - kind: table
        page: 136
        quote: "Movement testing helps to distinguish rotator cuff degenerative tendinopathy from frozen shoulder (adhesive capsulitis). Frozen shoulder is an idiopathic and self-limiting condition in which movement of the shoulder becomes restricted in both active and passive external rotation."
        title: "الكتف: tendon ولا frozen؟"
        columns: [Feature, Rotator cuff, Frozen shoulder]
        rows:
          - ["Nature", "Degenerative, old age", "Idiopathic, self-limiting"]
