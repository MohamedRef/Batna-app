      - kind: explain
        remind: [git.L03.264]
        page: 141
        quote: "F3. Functional defecation disorders\nDiagnostic criteria* - Must include all of the following:\n  1. The patient must satisfy diagnostic criteria for functional constipation and/or irritable bowel syndrome with constipation\n  2. During repeated attempts to defecate, there must be features of impaired evacuation, as demonstrated by 2 of the following 3 tests:\n    a. Abnormal balloon expulsion test\n    b. Abnormal anorectal evacuation pattern with manometry or anal surface EMG\n    c. Impaired rectal evacuation by imaging\n*Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis\n~ Subcategories F3a and F3b apply to patients who satisfy criteria for FDD ~"
        title: "F3. Functional defecation disorders"
        text: |
          الشروط:
          - المريض يحقق criteria الـ ==functional constipation== و/أو **IBS-C**.
          - مع محاولات التبرّز، فيه impaired evacuation في ==2 of 3 tests==: balloon expulsion، manometry أو anal surface electromyography (EMG)، و imaging.

          وتحتها نوعين:
          - **F3a. Inadequate defecatory propulsion:** الـ propulsive force ضعيفة، مع أو من غير انقباض غلط.
          - **F3b. Dyssynergic defecation:** الـ propulsion كويسة بس الـ pelvic floor **بيتقبض** بدل ما يرتخي.

          التفسير المقبول (مش في الكتاب): ليه اتنين من تلاتة؟ لأن كل اختبار لوحده ممكن يطلع غلط (المريض مكسوف قدام الجهاز فما يعرفش يزق)، فلما اتنين يتفقوا، الثقة في التشخيص تبقى أعلى.
      - kind: reveal
        page: 142
        quote: "What are the criteria for diagnosis of functional dyspepsia"
        prompt: "آخر صفحة في المحاضرة فيها سؤالين: Classify FGIDs، و criteria for diagnosis of functional dyspepsia. جاوب التاني في دماغك الأول."
        answer: |
          - **FD:** واحد أو أكتر من: bothersome postprandial fullness، early satiation، epigastric pain، epigastric burning، و **no structural disease** حتى في الـ endoscopy.
          - لازم يحقق **PDS** و/أو **EPS**.
          - **PDS:** fullness و/أو early satiation، **3 days a week**.
          - **EPS:** pain و/أو burning، **1 day a week**.
          - آخر **3 months**، و onset من **6 months** على الأقل.

          وسؤال التصنيف إجابته الـ domains من A لـ F اللي في الدرس الأول.
