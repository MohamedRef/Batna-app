          </svg>
      - kind: sort
        page: 79
        quote: "Diagnosis\n  1. Thrombocytopenia.\n  2. Blood: film-red cell fragments and schistocytes.\n  3. Bleeding, prothombin time, APTT, and thrombin T prolonged.\n  4. Fibrinogen level-decreased, fibrin degredation products (FDP) and D-dimers presents.\nThe degree of consumption coagulopathy varies."
        prompt: "في الـ DIC، ده بيعلى ولا بيقل؟"
        bins: ["Up or prolonged", "Down"]
        cards:
          - { text: "PT", bin: 0 }
          - { text: "APTT", bin: 0 }
          - { text: "Thrombin time", bin: 0 }
          - { text: "D-dimer, FDPs", bin: 0 }
          - { text: "Platelets", bin: 1 }
          - { text: "Fibrinogen", bin: 1 }
        why: "اللي بيتاكل في الجلطات (platelets و fibrinogen) بيقل، والتحاليل اللي بتقيس وقت التجلّط بتطول، ونواتج التكسير (FDPs و D-dimer) بتعلى."
      - kind: explain
        page: 79
        title: "العيان شكله إيه؟"
        quote: "Clinical features\n  1. Some patients are asymptomatic.\n  2. Symptoms and sign related to associated diseases.\n  3. Symptom and signs related to DIC.\n    a. Haemorrhagic manifestation of variable severity (due to consumption coagulpathy).\n    b. Microangiopathic haemolytic anaemia."
        text: |
          - **Asymptomatic** في بعض المرضى، لأن الكتاب بيقول إن درجة الـ consumption ==varies==. التفسير المقبول (مش في الكتاب): لو الجسم لاحق يعوّض الـ factors، التحاليل بس هي اللي بتبان.
          - أعراض **المرض الأصلي** (sepsis، abruptio…).
          - **نزيف** على قد الـ consumption: الـ factors والـ platelets اتصرفوا في الجلطات الصغيرة، فمفضلش حاجة للجرح.
          - ==Microangiopathic haemolytic anaemia==: الـ RBCs بتعدّي في أوعية صغيرة فيها fibrin، فتتقطّع **schistocytes**.
          - وأحيانًا (ص 80) **thrombotic manifestations** كمان، لأن الجلطات الصغيرة نفسها ممكن تسد.
      - kind: explain
        remind: [hem.L05.059]
        page: 80
        title: "علاج الـ DIC وباقي الأسباب"
        quote: "Treatment of DIC\n  1. Treatment of the underlying disease e.g. antibiotics in septicemia.\n  2. General supportive measure e.g. treatment of hypoxia and shock.\n  3. Treatment of haemorrhage with:\n    a. Fresh blood\n    b. Fresh plasma, fresh frozen plasma and caryoprecipitate to replace clotting F.\n    c. Platelet concentrates.\n  4-Heparin; its use remains controversal"
        text: |
          1. ==Treat the underlying disease== (antibiotics في الـ septicemia)
          2. **Support**: hypoxia و shock
          3. النزيف: **fresh blood**، **FFP** و **cryoprecipitate**، **platelet concentrates**
          4. **Heparin**: لسه **controversial**

          ليه السبب **أولًا**؟ لأن طول ما الشرارة شغالة (البكتيريا، المشيمة) الجلطات الصغيرة هتفضل تاكل أي factors أو platelets بتدّيها. الـ replacement بيكسبك وقت بس.
      - kind: reveal
        page: 80
        quote: "4-Heparin; its use remains controversal"
        prompt: "الـ DIC أصله تجلّط زيادة. ليه الـ heparin (اللي بيوقف التجلّط) لسه controversial فيه؟"
        answer: |
          التفسير المقبول (مش في الكتاب): لأن العيان **بينزف أصلًا**. الـ heparin ممكن يوقف الجلطات الصغيرة ويحافظ على الـ factors، بس ممكن كمان يزوّد النزيف في عيان الـ platelets والـ fibrinogen عنده واطيين.

          الميزان ده مش محسوم، وده معنى ==controversial== في الكتاب. في الامتحان: العلاج = السبب + support + replacement، والـ heparin "controversial".
      - kind: explain
        page: 80
        title: "باقي الأسباب المكتسبة"
        quote: "IV- Inhibition of coagulation\n  1- Antibodies against F VIII components\n  2- Non specific inhibitors in SLE, RA\nV- Miscellaneous\n  1- Therapy with heparin & thrombolytics.\n  2- L- asparagines\n  3- Massive transfusion syndrome"
        text: |
          **Circulating inhibitors**: antibodies ضد Factor VIII (FVIII)، و non-specific inhibitors في **systemic lupus erythematosus (SLE)** و **rheumatoid arthritis (RA)**. يعني الـ factor موجود بس الـ antibody ماسكه، عشان كده إنك تدّي factor زيادة مش دايمًا بيحل.

          **Miscellaneous**:
          - **Heparin** و ==thrombolytics==: الأدوية نفسها بتوقف التجلّط أو بتدوّب الجلطة.
          - **L-asparaginase**: التفسير المقبول (مش في الكتاب): بيقلّل تصنيع البروتينات في الكبد، ومنها الـ factors.
          - **Massive transfusion**: التفسير المقبول (مش في الكتاب): الدم المخزّن فقير في الـ platelets والـ factors، فلما تدّي كميات كبيرة منه بتخفّف اللي فاضل في دم العيان.
      - kind: try
        items: [hem.L05.053, hem.L05.056, hem.L05.059, hem.L05.064, hem.L05.088]
    recap:
      - "DIC: sepsis، malaria، shock، obstetric، tissue factor (trauma، burns، malignancy). كلهم شرارة تجلّط في الدم كله."
      - "Microthrombi تاكل الـ factors والـ platelets ← نزيف؛ fibrinolysis ← FDPs و D-dimer؛ RBCs تتقطع ← MAHA."
