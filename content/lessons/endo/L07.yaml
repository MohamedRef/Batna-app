      - "تعرف إمتى steroids وإمتى cinacalcet"
    status: unverified
    steps:
      - kind: aside
        tone: tip
        page: 125
        quote: "X-ray left femur showing a well marginated cortical lytic lesion with endosteal scalloping in the distal femur (brown tumor) A pathological fracture through a similar lesion is noted proximally"
        text: "الـ **brown tumour** في الأشعة: lytic lesion حدودها واضحة مع **endosteal scalloping**، وممكن pathological fracture. والـ **nephrocalcinosis** في الـ ultrasound (US): أهرامات hyperechoic بـ acoustic shadowing."
      - kind: reveal
        page: 126
        quote: "Transabdominal ultrasound demonstrates pyramid-shaped hyperechoic structures within the kidneys bilaterally with posterior acoustic shadowing"
        prompt: "ليه الـ nephrocalcinosis بيبان في الـ ultrasound على شكل أهرامات؟"
        answer: "الكتاب بيوصف **pyramid-shaped hyperechoic structures** في الكليتين مع **posterior acoustic shadowing**. التفسير المقبول (مش في الكتاب): الكالسيوم بيترسّب في الـ **medullary pyramids** نفسها، لأن ده المكان اللي البول بيتركّز فيه والكالسيوم بيوصل لأعلى تركيز. والكالسيوم بيعكس الـ ultrasound زي الحصوة، فيبان أبيض وتحته ضل. يعني الـ hypercalcaemia الطويلة (زي الـ primary hyperparathyroidism) بتسيب علامتها في الكلية، وده سبب كفاية للجراحة حتى لو المريض مش حاسس بحاجة."
      - kind: explain
        remind: [endo.L07.058]
        page: 127
        quote: "If facilities to measure serum ionized calcium are available, it is preferable, especially when abnormalities in albumin levels or conditions like myeloma are suspected."
        title: "التحاليل بتقول إيه؟"
        text: |
          - **Ionized calcium** أفضل لو متاح، خصوصًا لو الـ **albumin** متغيّر أو فيه **myeloma**.
          - **Low serum inorganic phosphorus**.
          - **Elevated alkaline phosphatase (ALP)**.
          - **Hypercalciuria**.
          - **Elevated plasma PTH**.

          التفسير المقبول (مش في الكتاب): نص الكالسيوم في الدم شايله الـ albumin، فالـ total بيطلع ويقع مع الـ albumin، والـ ionized هو اللي بيعمل الأعراض. والـ myeloma ممكن البروتين بتاعها يمسك كالسيوم فيعلّي الـ total. أما الـ phosphate الواطي فلأن الـ PTH بيطلّعه في البول، والـ ALP العالي لأن العضم بيتهد ويتبني بسرعة. يعني phosphate واطي + PTH عالي = **primary hyperparathyroidism**.
