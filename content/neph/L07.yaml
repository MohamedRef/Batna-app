    src: { page: 152, quote: "Screening is not indicated for all patients with ADPKD because Indications for screening in patients with a good life expectancy include family history of intracranial aneurysm or subarachnoid hemorrhage, previous aneu- rysmal rupture, preparation for elective surgery with potential hemo-dynamic instability, high-risk occupations (e.g., airline pilots), and significant patient anxiety despite adequate information about the risks." }
