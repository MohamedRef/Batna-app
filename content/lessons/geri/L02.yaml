  # ------------------------------------------------------------------
  - id: geri.L02.lesson1
    title: "الكلية العجوزة: أقل عدد، نفس الشغل"
    hook: "الكلية بتخسر لحد نص الـ glomeruli وهي ساكتة. المشكلة بتبان أول ما تزوّدها حمل: ملح، ميه، أو دوا."
    minutes: 8
    pages: [25, 27]
    topics: [overview, anatomy]
    goals:
      - "تعرف رسايل المحاضرة الكبيرة"
      - "تعرف التغييرات التشريحية في الكلية مع السن وسبب كل واحدة"
      - "تشوف الـ juxtaglomerular apparatus اللي هيفسّر الـ renin الواطي في الدرس الجاي"
    status: unverified
    steps:
      - kind: explain
        page: 25
        title: "رسايل المحاضرة"
        quote: "Agenda\n  1. The most critical and important kidney physiological changes occur with aging.\n  2. GFR decreases with age.\n  3. ESRD has increased over the past 20 years and most of these changes have occurred in the aged population.\n  5. Cystatin-C is correlated well with renal function in the elderly.\n  6. UTI is a very common problem in elderly.\n  7. Symptomatic UTI must be differentiated from asymptomatic bacteriuria for which treatment in generally not indicated.\n  8. Catheter induced UTI is among the most common nosocomial infections."
        text: |
          المحاضرة كلها في كام جملة:
          - الـ ==glomerular filtration rate (GFR)== بيقل مع السن.
          - الـ **end-stage renal disease (ESRD)** زاد في آخر 20 سنة، وأغلب الزيادة عند الكبار.
          - **Cystatin C** بيعكس وظيفة الكلى عند الكبار كويس.
          - الـ **urinary tract infection (UTI)** شائع جدًا، ولازم تفرّقه عن ==asymptomatic bacteriuria== اللي غالبًا مش بتتعالج.
          - الـ **catheter-induced UTI** من أشهر الـ nosocomial infections.

          ليه الكتاب بيبدأ بالـ physiology؟ لأن كل اللي بعدها مبني عليها: الكلية العجوزة **شغالة في العادي** بس هامشها ضيق، زي القلب في المحاضرة اللي فاتت. فأي حمل زيادة (ملح قليل، ميه كتير، دوا بيخرج من الكلى، عدوى) بيبان عليها بسرعة.
      - kind: table
        page: 26
        quote: "Anatomical renal changes in elders\nKid wt.: ↓ gradually at age 40-50 yrs, Cortex > medulla.\nGlomeruli: ↓ in No (30-50%).\n  ↓ Cells\n  Sclerotic glomeruli\n  Glomerular ischaemia\nNephrons: ↓ No,\n  ↑ Size of residuals.\nBM: ↑ glomerular & tubular BM\n  ↑ type IV collagen.\nTubules: ↓ length\n  ↓ Proximal tubular volume.\n  ↓ Interstitium: ↑ fibrosis"
        title: "التشريح بيتغيّر إزاي؟"
        columns: [Part, Change]
        rows:
          - [Weight, "Falls from 40–50 y; cortex more"]
          - [Glomeruli, "Down 30–50%, sclerosis"]
          - [Nephrons, "Fewer; the rest enlarge"]
          - [BM, "Thicker; more type IV collagen"]
          - [Tubules, "Shorter; less proximal volume"]
          - [Interstitium, "More fibrosis"]
        hide: [[0, 1], [1, 1], [2, 1], [5, 1]]
      - kind: explain
        page: 26
        title: "ليه كل تغيير؟"
        quote: "Glomeruli: ↓ in No (30-50%)."
        text: |
          الجدول ده قصة واحدة: **الـ glomeruli بتموت، واللي فاضل بيشيل الحمل**.

          التفسير المقبول (مش في الكتاب) لكل سطر:
          - **الوزن بيقل والـ cortex أكتر من الـ medulla**: لأن الـ glomeruli قاعدة في الـ cortex، فلما هي تقل الـ cortex هو اللي يضمر.
          - **Sclerosis و ischaemia**: الشرايين الصغيرة بتضيق مع السن، فالـ glomerulus اللي الدم ما بيوصلوش كويس يتليّف ويقفل.
          - **الـ nephrons الباقية بتكبر**: علشان تعوّض اللي ماتوا وتفضل الفلترة ماشية. ده اللي بيخلّي الـ GFR يقل **ببطء** مش مرة واحدة.
          - **الـ BM بيتخن و type IV collagen بيزيد**: الغشا اللي الفلترة بتعدي منه بقى أتقل.
          - **Tubules أقصر و fibrosis**: الأنابيب هي اللي بتركّز البول وبتمسك الملح، فلما تقصر، ده هيفسّر الدرس الجاي كله.
      - kind: aside
        tone: analogy
        page: 26
        quote: "Glomerular ischaemia\n  Nephrons: ↓ No,\n↑ Size of residuals."
        text: "زي مصنع بيقفل خطوط إنتاج كل سنة، والعمال اللي فاضلين بيشتغلوا وقت إضافي: الـ **nephrons** بتقل، واللي فاضل بيكبر. الإنتاج العادي ماشي، بس أول طلبية كبيرة، المصنع يقع."
      - kind: figure
        page: 27
        title: "الـ renal corpuscle من الكتاب"
        image: { file: geri/L02-renal-corpuscle.webp, book: true }
        caption: "رسمة الكتاب في ص 27: الـ ==glomerulus== جوه الـ Bowman's capsule، وجنبه الـ **juxtaglomerular apparatus**: الـ granular juxtaglomerular cells (اللي بتطلّع الـ **renin**) والـ macula densa. افتكر المكان ده، لأن الـ renin الواطي عند الكبار هو اللي هيعمل الـ hyperkalemia في الدرس الجاي."
        alt: "The book's drawing of a renal corpuscle: glomerular capillaries inside Bowman's capsule leading to the proximal convoluted tubule, with afferent and efferent arterioles, granular juxtaglomerular cells, macula densa cells of the distal tubule and a mesangial cell forming the juxtaglomerular apparatus."
      - kind: figure
        page: 27
        title: "الكلية تحت الميكروسكوب"
        image: { file: geri/L02-kidney-histology.webp, book: true }
        alt: "The book's light micrograph of renal cortex stained pink: several round glomeruli, each inside a clear Bowman's space, scattered among many cut tubules."
        caption: |
          صورة histology من الكتاب تحت رسمة الـ corpuscle على طول، من غير labels:

          - **الدواير الكبيرة** (فوق على اليمين، وفي النص تحت، وتحت على اليمين): دي الـ ==glomeruli==، كل واحدة جوه فراغ أبيض رفيع هو الـ **Bowman's space**.
          - **الباقي كله**: مقاطع كتير في الـ **tubules**، فاضية من جوه.

          اللي تاخده: ده الـ **cortex**، والـ glomeruli اللي انت شايفها هي اللي بتقل **30–50%** مع السن في الجدول اللي فوق. الكتاب ما بيقولش الصورة دي لكلية كبير ولا صغير.
      - kind: reveal
        page: 26
        quote: "Nephrons: ↓ No, ↑ Size of residuals."
        prompt: "لو الـ glomeruli قلت 30–50%، ليه الـ GFR مش بيقع للنص؟"
        answer: |
          لأن اللي فاضل **بيكبر** (↑ size of residuals) ويفلتر أكتر من الأول، فالمجموع بيفضل قريب من الطبيعي.

          التفسير المقبول (مش في الكتاب): الـ nephron اللي بيشتغل over-time ضغطه جوه أعلى، وده مع الوقت بيتعبه هو كمان. علشان كده الـ GFR بيقل حاجة بسيطة كل سنة بدل ما يقع مرة واحدة، والمشكلة ما بتبانش غير تحت الحمل.
      - kind: check
        page: 26
        quote: "Kid wt.: ↓ gradually at age 40-50 yrs, Cortex > medulla."
        question: "Which part of the kidney shrinks most with age, per the book?"
        options:
          - "The cortex"
          - "The medulla"
          - "The renal pelvis"
          - "Neither; weight is unchanged"
        answer: 0
        why:
          - "صح: الوزن بيقل من 40–50 سنة، والـ cortex أكتر من الـ medulla، لأن الـ glomeruli فيه."
          - "الـ medulla بتقل أقل من الـ cortex."
          - "الكتاب ما ذكرش الـ pelvis."
          - "الكتاب بيقول الوزن بيقل تدريجيًا."
      - kind: try
        items: [geri.L02.004, geri.L02.005, geri.L02.006, geri.L02.008]
    recap:
      - "الـ GFR بيقل، والـ ESRD زاد عند الكبار، والـ cystatin C بيعكس الوظيفة كويس."
      - "Glomeruli تقل 30–50%، والـ cortex يضمر أكتر من الـ medulla."
      - "الـ nephrons الباقية تكبر وتعوّض، فالمشكلة تبان تحت الحمل."
      - "BM أتخن، tubules أقصر، و interstitium يتليّف."
      - "الـ juxtaglomerular cells هي اللي بتطلّع الـ renin."
    practice: [geri.L02.001, geri.L02.002, geri.L02.003, geri.L02.004, geri.L02.005, geri.L02.006, geri.L02.007, geri.L02.008, geri.L02.064]
