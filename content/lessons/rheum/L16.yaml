      - kind: explain
        page: 270
        title: "Anakinra و abatacept"
        quote: "Blocks activation of T lymphocytes by competing with binding of costimulatroy molecule CD28 on surface of T cells to CD80/CD86 on antigen presenting cells."
        text: |
          **Anakinra** (IL-1Ra): بينافس الـ IL-1 على الـ receptor. **أضعف من الـ anti-TNF** وحقنة **كل يوم**. infections بكتيرية (مش opportunistic)، injection site، neutropenia و thrombocytopenia قابلين للرجوع، ومع الـ anti-TNF infections شديدة.

          **Abatacept** (CTLA4-Ig): بيمسك ==CD80/CD86== على الـ antigen-presenting cell (APC) قبل الـ **CD28** ما يمسكها، فالـ T cell ما بيشتغلش (costimulation blockade). **10 mg/kg** IV: 3 مرات كل أسبوعين وبعدين كل شهر. آمن لوحده أو مع methotrexate (MTX)، بس **مع الـ anti-TNF infections كتير**.

          يعني الـ abatacept بيوقف الـ T cell **قبل** ما يشتغل، مش بيضرب cytokine بعد ما يطلع.
      - kind: reveal
        page: 270
        quote: "Alone or with methotrexate-good safety profile but with anti TNF high level of infections."
        prompt: "الكتاب بيقول الـ anakinra والـ abatacept مع الـ anti-TNF = infections شديدة. ليه ما نجمعش الـ biologics عشان نضرب المرض أقوى؟"
        answer: |
          التفسير المقبول (مش في الكتاب): كل biologic بيقفل باب من أبواب المناعة. لو قفلت بابين في نفس الوقت، الجسم بيفقد خطّين دفاع ضد البكتيريا مع بعض، والفايدة على المفصل ما بتزيدش قد الخطر.

          علشان كده القاعدة: biologic **واحد** + methotrexate. والـ **anakinra** كمان ==أضعف من الـ anti-TNF== وبيحتاج حقنة **كل يوم**، فمكانه محدود في الـ RA.
      - kind: explain
        page: 271
        title: "Rituximab: امسح الـ B cells"
        quote: "Pro B cells and plasma cells do not express CD20-They are spared, Immunoglobulin level (esp IgM) is lowered but remains within normal."
        text: |
          الـ B cells في الـ rheumatoid arthritis (RA) بتقدّم antigen، وتشغّل T cells، وتعمل antibodies و cytokines (TNF، lymphotoxin، IL-17).

          الـ ==rituximab==: chimeric anti-**CD20**. بيمسح الـ B cells **أكتر من 6 شهور** (ADCC، complement، apoptosis). فعّال مع MTX في الـ refractory RA.

          الـ **pro-B** والـ **plasma cells** ما عليهمش CD20، فالـ Ig بيقل (خصوصًا Immunoglobulin M (IgM)) بس ==يفضل طبيعي==.

          الكورس: **2 infusions × 1 g**، بينهم أسبوعين؛ وتعيد بعد 7-23 شهر. infusion reactions (premedicate بـ steroids)، ومفيش TB ولا opportunistic.
      - kind: reveal
        page: 271
        quote: "Infection rates within range reported in RA. Common infections – No TB-no opportunistic infections."
        prompt: "ليه الـ rituximab مش بيصحّي الـ TB زي الـ anti-TNF؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ TB محبوسة جوّه **granuloma** معمولة من macrophages و T cells، والـ **TNF** هو الأسمنت اللي ماسكها (افتكر الـ TB screening قبل الـ anti-TNF ص 269). الـ rituximab بيمسح الـ ==B cells== بس، والـ granuloma ما بتعتمدش عليهم، فتفضل قافلة.

          علشان كده الكتاب بيقول infections الـ rituximab **في حدود اللي في الـ RA نفسه**: common infections، **no TB، no opportunistic**.
      - kind: check
        page: 271
        quote: "Single course of 2 IV infusions.\n - 1 g each- 2 weeks apart.\n - Further courses after 7 to 23 months according to disease activity."
        question: "What is one course of rituximab for refractory RA in the book?"
        options: ["2 IV infusions of 1 g, 2 weeks apart", "1 g IV every month", "40 mg SC every other week", "8 mg/kg IV monthly"]
