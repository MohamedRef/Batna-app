  - id: hem.L09.166
    kind: mcq
    topic: pmf-treatment
    stem: "A 41-year-old man has high-risk PMF and a fit, HLA-matched sibling. What is the only treatment that can cure him?"
    options:
      - Allogeneic stem cell transplantation
      - Ruxolitinib
      - Splenectomy
      - Hydroxycarbamide
      - Interferon-alpha
    answer: 0
    why:
      - "Correct: allogeneic SCT is the only curative treatment; at ≤45 years long-term survival is about 50% (p151–152)."
      - Ruxolitinib controls symptoms and spleen size and improves survival, but does not cure.
      - Splenectomy is palliative, with about 10% mortality.
      - Cytoreduction only controls counts and organomegaly.
      - Interferon may help early disease but is not curative.
    src: { page: 151, quote: "The only curative treatment for PMF is allogeneic stem cell transplantation (SCT)." }
    status: unverified
  - id: hem.L09.167
    kind: mcq
    topic: pmf-treatment
    stem: "A woman with intermediate-2 PMF started ruxolitinib 14 weeks ago. Her spleen and night sweats are much better, but Hb fell from 10.5 to 9.5 g/dL. Platelets are stable. Best action?"
