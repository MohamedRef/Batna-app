    title: "الـ Reiter: العدوى مشيت والمفصل لسه والع"
    hook: "إسهال في رحلة أو حرقان في البول، وبعد كام أسبوع ركبة وارمة وعين حمرا. المفصل بيرد على عدوى في مكان تاني."
    minutes: 9
