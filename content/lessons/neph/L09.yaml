        options:
          - "An IgG autoantibody against the GBM"
          - "Lithium"
          - "Urea"
          - "Methanol"
        answer: 0
        why:
          - "صح: الـ **IgG** كبير (≥ 15,000 D بكتير) و half-life طويل و volume of distribution قليل نسبيًا، فالـ ==plasma exchange== هو اللي يشيله."
          - "الـ lithium صغير وبيدوب في المية: الـ HD بيشيله أحسن."
          - "الـ urea small solute، الـ HD شغلته."
          - "الـ methanol من السموم اللي الـ HD أشطر فيها."
      - kind: match
        page: 309
        quote: "Plasma pheresis by centrifugation method or by use of a filter and dialysis machine (membrane separation). Clin J Am Soc Nephrol 9: 181–190,"
        prompt: "وصّل كل طريقة plasma exchange بالـ anticoagulant بتاعها والـ extraction:"
        pairs:
          - ["Centrifuge TPE", "Citrate, 80% extraction"]
          - ["Membrane TPE", "Heparin, 30% extraction"]
          - ["Both methods", "Albumin or fresh frozen plasma replacement"]
        why: "الـ centrifuge بيفصل بالطرد المركزي مع citrate ويطلّع 80% من البلازما؛ الـ membrane فلتر مع heparin ويطلّع 30%. الاتنين بيرجّعوا albumin أو fresh frozen plasma."
      - kind: explain
        page: 309
        title: "ASFA والدواعي"
        quote: "Category I and II apheresis is first and second line therapy respectively.Category III, IIIV, apheresis is not established therapy or ineffective/harmful respectively."
        text: |
          **American Society for Apheresis (ASFA)**: I = first line، II = second line، III = مش متثبت، IV = مش بينفع أو مضر.

          **Category I كلوي**: antineutrophil cytoplasmic antibodies (ANCA) RPGN (dialysis dependent أو alveolar haemorrhage)، ==anti-GBM==، cryoglobulinaemia شديدة، **focal segmental glomerulosclerosis (FSGS) راجعة في الكلية المزروعة**، atypical HUS (factor H antibodies)، الزراعة (AMR و desensitisation)، **thrombotic thrombocytopenic purpura (TTP)**، و ticlopidine thrombotic microangiopathy (TMA).

          **غير كلوي**: Guillain–Barré، chronic inflammatory demyelinating polyneuropathy، hyperviscosity، myasthenia، N-methyl-D-aspartate (NMDA) encephalitis، fulminant Wilson.

          المضاعفات: الـ access، الـ replacement fluid، الـ anticoagulation، والعدوى.

          ليه التقسيم لـ categories؟ التفسير المقبول (مش في الكتاب): الـ TPE مكلف ومش من غير مخاطر (عدوى، نزيف، allergy من الـ FFP)، فالـ ASFA بتقول لك قوة الدليل: category I يعني الإجراء نفسه علاج أساسي، و III يعني جرّب بحذر، و IV يعني ما تعملوش. وليه الحالات العصبية كتير في القايمة؟ لأن أغلبها antibodies ضد الأعصاب أو الـ receptor (Guillain–Barré، myasthenia، NMDA)، فنفس المنطق: عدو في البلازما.
      - kind: explain
        page: 310
        title: "ليه الأمراض دي بالذات category I؟"
        quote: "Anti-GBM disease Diffuse alveolar hemorrhage or dialysis Independence."
        text: |
          افتكر شروط الـ TPE: حاجة **كبيرة**، **half-life طويل**، **سامة حادة**، و **في الدم**. وبص على القايمة:
          - **anti-GBM** و **ANCA RPGN**: antibodies بتكسر الـ glomerulus والرئة **دلوقتي**، فشيلها بسرعة بيلحق الكلية قبل ما الـ crescents تتليف.
          - **cryoglobulinaemia**: بروتينات كبيرة بتترسب في البرد وتسد الأوعية.
          - **FSGS راجعة بعد الزراعة**: الـ **circulating permeability factor** في البلازما، فشيله بيقلل الـ proteinuria.
          - **atypical HUS بـ factor H antibodies** و **TTP**: antibody ضد بروتين مهم، وفي الـ TTP كمان بنرجّع الإنزيم الناقص مع الـ fresh frozen plasma.
          - **ABO-incompatible** أو **positive cross-match**: نشيل الـ antibodies قبل الزراعة (desensitization).

          التفسير المقبول (مش في الكتاب): كل مرض في القايمة فيه ==عدو بيلف في البلازما==. لو المشكلة في الأنسجة نفسها أو الـ T cells، الـ TPE مش هيفيد.

          وليه بنرجّع FFP في بعض الحالات و albumin في غيرها؟ التفسير المقبول (مش في الكتاب): الـ **albumin** أأمن (مفيش عدوى ولا allergy كتير)، بس مفيهوش clotting factors ولا الإنزيمات. فلو العيان بينزف (alveolar haemorrhage، بعد biopsy) أو المرض نفسه نقص بروتين في البلازما (TTP، اللي فيه ADAMTS13 ناقص)، لازم **FFP** علشان نعوّض الناقص. يعني اختيار السائل جزء من العلاج، مش مجرد تعويض حجم.
      - kind: update
        page: 310
        quote: "ANCA-associated RPGN Dialysis dependence or diffuse alveolar Hemorrhage."
        text: "الكتاب حاطط الـ ANCA RPGN في category I، بس الـ **PEXIVAS** trial لقى إن الـ plasma exchange فوق العلاج العادي ==ما قللش الموت ولا الـ end-stage kidney disease (ESKD)== في الـ ANCA vasculitis الشديدة. فـ Kidney Disease: Improving Global Outcomes (KDIGO) 2024 مش بتديه روتيني: **ممكن يتفكّر فيه** لو الـ creatinine أعلى من 3.4 mg/dL، أو العيان على الغسيل أو الـ creatinine طالع بسرعة، أو فيه diffuse alveolar haemorrhage مع hypoxaemia. في الامتحان اكتب قايمة ASFA بتاعة الكتاب."
        ref: "PEXIVAS trial, NEJM 2020; KDIGO 2024 guideline for ANCA-associated vasculitis"
      - kind: check
        page: 310
        quote: "FSGS (recurrent in the transplanted kidney)."
        question: "Two weeks after a kidney transplant, a patient whose original disease was FSGS has 6 g/day proteinuria. Which apheresis indication does the book list?"
        options:
          - "Recurrent FSGS in the transplanted kidney (category I)"
          - "Hyperacute rejection"
          - "Chronic rejection"
          - "None; apheresis is never used after transplant"
        answer: 0
        why:
          - "صح: الكتاب حاطط ==FSGS recurrent in the transplanted kidney== في category I، لأن الـ permeability factor في البلازما."
          - "الـ hyperacute بيحصل في دقايق، والـ graft بيبوظ."
          - "الـ chronic rejection fibrosis، مش proteinuria سريعة بعد أسبوعين."
          - "الكتاب نفسه حاطط desensitization و AMR في القايمة."
      - kind: try
        items: [neph.L09.076, neph.L09.077, neph.L09.079, neph.L09.080, neph.L09.082]
    recap:
      - "TPE منطقي لو الحاجة ≥ 15,000 D، half-life طويل، سامة حادة، و volume of distribution قليل."
      - "Centrifuge: citrate و 80% extraction. Membrane: heparin و 30%. والاتنين albumin أو FFP."
      - "Category I = first line؛ IV = مضر. الكلوي: anti-GBM، ANCA RPGN، cryo، FSGS راجعة، aHUS، TTP، desensitization."
      - "PEXIVAS: الـ PLEX ما قللش الموت ولا ESKD في الـ ANCA."
