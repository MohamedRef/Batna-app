        text: |
          الهدف: **negative margins**، ولو حصلت: **5-year survival 20% إلى 43%**.

          **Positive predictors of survival:** negative margins، **مفيش lymph nodes**، **solitary lesion**، و **مفيش vascular invasion**.

          الـ **hilar involvement** بينزّل الـ median survival لـ **12–24 شهر**، مقابل **18–30 شهر** للأورام الأبعد (distal).

          والـ **adjuvant therapy** بعد الـ radical resection: meta-analysis لقت إنها بتزوّد الـ overall والـ disease-free survival مقارنة بالـ observation، فتتعمل للمؤهلين. بس مفيش head-to-head بين chemo و RT و chemoradiation.
