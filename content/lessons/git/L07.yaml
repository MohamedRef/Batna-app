  - id: git.L07.lesson1
    title: "دم من تحت: الحدود والأرقام والفخ"
    hook: "مش كل دم بينزل من تحت جاي من تحت. الحدود والأرقام والضغط بيقولولك تبص فين الأول."
    minutes: 8
    pages: [225, 226]
    topics: [definition, upper-source]
    goals:
      - "تعرّف الـ lower gastrointestinal bleeding (LGIB) وتحفظ أرقامه"
      - "تعرف ليه الدم بيطلع أحمر أو أسود"
      - "تعرف امتى الـ hematochezia تبقى نزيف من فوق، وليه"
    status: unverified
    steps:
      - kind: explain
        page: 225
        title: "الحدود: ligament of Treitz"
        quote: "It is bleeding below the ligament of Treitz. Normal fecal blood loss 1.2 ml/day. It is significant if the loss >10 ml/day."
        text: |
          الـ **lower GI bleeding** هو أي نزيف ==below the ligament of Treitz==.

          - الطبيعي إن البراز فيه دم **1.2 ml/day** من غير ما تاخد بالك.
          - بيبقى **significant** لو أكتر من **10 ml/day**.

          بيظهر كـ **hematochezia** (من دم أحمر فاتح لحد clots قديمة)، أو **melena** لو المصدر proximal والنزيف بطيء.
      - kind: explain
        page: 225
        title: "أحمر ولا أسود؟ السرعة والمسافة هم اللي بيقرروا"
        quote: "It might be presented as: Hematochezia ranges from bright red blood to old clots or Melena if the bleeding from proximal source with slow rate of bleeding."
        text: |
          الكتاب بيقول الـ LGIB يا إما **hematochezia** (من دم أحمر فاتح لحد clots قديمة)، يا إما **melena** لما المصدر ==proximal== والنزيف ==slow==.

          ليه؟ التفسير المقبول (مش في الكتاب): الدم بيسودّ لما يقعد وقت كفاية في الأمعاء والبكتيريا تكسّر الـ haemoglobin. يعني:
          - مصدر **بعيد عن الشرج** (small bowel، right colon) + نزيف **بطيء** = الدم قعد كتير ← أسود.
          - مصدر **قريب من الشرج** أو نزيف **سريع** = الدم خرج قبل ما يتغيّر ← أحمر أو clots.

          وبالكمية الكتاب بيقسّمه تلاتة: **massive**، **moderate**، و **occult** (يعني مستخبّي، مش باين بالعين).
      - kind: figure
        page: 225
        title: "الخط الفاصل: ligament of Treitz"
        quote: "It is bleeding below the ligament of Treitz."
        alt: "A vertical gut from oesophagus to anus. A line at the duodenojejunal flexure marks the ligament of Treitz: above it is upper GI bleeding, below it lower GI bleeding. A second line at the ileocaecal valve shows that 80 to 85 percent of lower GI bleeds come from below it and only 0.7 to 9 percent from the small intestine."
        caption: "الحد هو الـ ==ligament of Treitz==. وتحته، أغلب النزيف (80–85%) جاي من **بعد الـ ileocecal valve**، يعني من القولون والـ rectum."
        svg: |
          <svg viewBox="0 0 330 340" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="10" width="120" height="28" rx="6" class="fg-box"/>
            <text x="80" y="29" text-anchor="middle" class="t-sm">Oesophagus</text>
