  - id: hb.L05.lesson4
    title: "قبل وأثناء وبعد العلاج، والحالات الخاصة"
    hook: "حباية بتشفي، بس فيه 6 حاجات لازم تعملها قبلها، ودوا قلب واحد ممنوع خالص معاها."
    minutes: 10
    pages: [93, 94]
    topics: [management, special]
    goals:
      - "ترتّب الـ pre-treatment work-up زي الكتاب"
      - "تعرف ليه بنعمل HBcAb وليه amiodarone ممنوع"
      - "تعرف المتابعة بعد الـ SVR في الـ cirrhosis"
      - "تظبط العلاج في decompensated cirrhosis و CKD والحمل والـ coinfection"
    status: unverified
    steps:
      - kind: order
        page: 93
        prompt: "رتّب الـ **Before Treatment** checklist زي الكتاب:"
        steps:
          - "Confirm HCV RNA"
          - "Assess fibrosis (FIB-4, FibroScan)"
          - "Test for HIV and HBV (including total HBcAb)"
          - "Check liver and renal function"
          - "Pregnancy test (if relevant)"
          - "Check for drug-drug interactions"
        why: "ده ترتيب الكتاب بالظبط في **Management Strategies: Before Treatment**. أول حاجة تتأكد إن فيه فيروس أصلًا، وآخر حاجة تراجع أدويته."
      - kind: reveal
        page: 94
        prompt: "ليه نعمل **total HBcAb** مش HBsAg بس قبل الـ DAAs؟"
        answer: |
          الكتاب بيقول في الـ coinfection: **monitor HBV reactivation**.

          الشرح المقبول: الـ HCV والـ HBV لما يبقوا مع بعض، الـ HCV غالبًا بيكتم الـ HBV. أول ما الـ DAAs تشيل الـ HCV، الـ HBV ممكن يصحى ويعمل flare. والـ **HBcAb** بيكشف حتى العدوى القديمة الكامنة اللي الـ HBsAg فيها ممكن يكون negative.
      - kind: aside
        tone: exam
        page: 93
        quote: "Amiodarone is absolutely contraindicated… can result in serious bradycardia."
        text: |
          المثال الوحيد اللي الكتاب اختاره للـ **drug-drug interactions**: **Amiodarone**، **absolutely contraindicated**، لأنه ممكن يعمل **serious bradycardia** (مع الـ sofosbuvir regimens).

          لو شفت في السؤال «AF on amiodarone + HCV»، الإجابة جاهزة.
      - kind: explain
        page: 93
        title: "أثناء العلاج وبعده"
        text: |
          **During treatment:** حاجتين بس: **monitor adherence** و **check for drug interactions**.

          **After treatment:**

          - **HCV RNA at 12 weeks post-treatment (SVR12)**.
          - لو فيه **cirrhosis**: المتابعة مستمرة: **HCC surveillance every 6 months**، و **primary prophylaxis against variceal bleeding and decompensation** في اللي عندهم **CSPH**.
      - kind: reveal
        page: 93
        prompt: "المريض بقى cured (SVR12). ليه لسه بنعمله **HCC surveillance كل 6 شهور** لو عنده cirrhosis؟"
        answer: |
          الـ DAAs بتشيل **الفيروس**، بس مابتشيلش **الـ cirrhosis** اللي اتعملت خلاص. الكبد المتليف نفسه هو أرض الـ HCC (افتكر: HCC **mainly with cirrhosis**). وكمان الـ portal hypertension (CSPH) ماتختفيش بالـ SVR، فالـ varices لسه محتاجة prophylaxis.

          زي ما تطفي حريقة في بيت: النار طفت، بس الحيطان المحروقة لسه محتاجة كشف دوري.
      - kind: check
        page: 93
        question: "A patient with HCV cirrhosis and CSPH achieves SVR12. What follow-up does the lecture require?"
        options:
          - "HCC surveillance every 6 months and primary prophylaxis against variceal bleeding"
          - "Discharge: SVR12 means cure, no further follow-up"
          - "Repeat anti-HCV every year to confirm cure"
          - "Restart DAAs for another 12 weeks"
        answer: 0
        why:
          - "صح: الكتاب: **continued monitoring if cirrhosis is present**."
          - "الفيروس اتشال، بس الـ cirrhosis ومخاطرها لسه موجودة."
          - "الـ anti-HCV بيفضل positive بعد الشفا؛ مابيقيسش حاجة هنا."
          - "مفيش فيروس نعالجه؛ SVR12 = cure."
      - kind: explain
        page: 94
        title: "Special populations"
        text: |
          - **Decompensated cirrhosis:** محتاجة **adjusted regimens**: **add ribavirin** أو **increase the duration to 24 weeks**.
          - **Renal impairment:** الأفضل **avoid sofosbuvir in severe CKD** واستخدم **Glecaprevir/Pibrentasvir**. لو مش متاح: sofosbuvir-containing regimens **with close observation**، **من غير** ما تغيّر جرعة الـ sofosbuvir. والـ **ribavirin** جرعته تتظبط لو **CrCl < 50**.
          - **Pregnancy:** الـ DAAs **not currently approved in pregnancy or lactation**.
          - **Coinfection:** **treat HCV in HIV/HBV co-infection**، و **monitor HBV reactivation**.
      - kind: update
        page: 94
        text: "الـ protease-inhibitor regimens (glecaprevir/pibrentasvir، grazoprevir) ممنوعة في الـ decompensated cirrhosis (Child-Pugh B أو C) حسب الـ guidelines؛ بيستخدموا sofosbuvir/velpatasvir ± ribavirin. في الامتحان اكتب إجابة الكتاب: add ribavirin أو 24 weeks."
        ref: "EASL recommendations on treatment of hepatitis C, 2020"
      - kind: table
        page: 94
        title: "Special populations (book rules)"
        columns: ["Population", "What the lecture says"]
        rows:
          - ["Decompensated cirrhosis", "Add ribavirin, or extend to 24 weeks"]
          - ["Severe CKD", "Prefer glecaprevir/pibrentasvir; else sofosbuvir with close observation, no dose change"]
          - ["Ribavirin in renal impairment", "Adjust dose if CrCl < 50"]
          - ["Pregnancy or lactation", "DAAs not currently approved"]
          - ["HIV or HBV coinfection", "Treat HCV; monitor HBV reactivation"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
