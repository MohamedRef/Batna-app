  - id: neph.L07.lesson1
    title: "ADPKD: الكلية اللي بتطلّع عنب"
    hook: "جين واحد بايظ في الـ cilia، والنتيجة كلية وزنها كيلو مليانة أكياس. تعالى نفهم إزاي."
    minutes: 9
    pages: [145, 150]
    topics: [adpkd-genetics, adpkd-path, adpkd-renal]
    goals:
      - "تحفظ الـ genes والـ chromosomes والفرق بين PKD1 و PKD2"
      - "تفهم إزاي الـ polycystins لما تبوظ بتعمل cyst"
      - "تعرف أعراض الكلية وإمتى تقلق من الـ hematuria"
    status: unverified
    steps:
      - kind: explain
        page: 145
        title: "مرض في الجسم كله"
        quote: "multisystem disorder characterized by multiple, bilateral renal cysts and associated with cysts in other organs, such as liver, pancreas, and arachnoid"
        text: |
          الـ ==ADPKD== مش مرض كلى بس: ده **multisystem disorder** فيه أكياس كتير في **الكليتين**، ومعاها أكياس في **الكبد** والـ **pancreas** والـ **arachnoid**.

          الوراثة **autosomal dominant**: يعني **50%** من الأولاد هيورثوه. بس خلي بالك، **25–40%** من العيانين الجداد **مفيش عندهم family history**.
      - kind: table
        page: 145
        quote: "Mutations in the genes pkd-1 (located on chromosome 16) and pkd-2 (chromosome 4)"
        title: "الجينين"
        columns: [Gene, Chromosome, Protein]
        rows:
          - ["PKD1", "16", "Polycystin-1"]
          - ["PKD2", "4", "Polycystin-2"]
        hide: [[0, 1], [1, 1]]
      - kind: mnemonic
        page: 146
        quote: "with more aggressive disease (onset of esrd, on average, 15 years earlier)"
        word: "PKD1"
        parts:
          - { key: "P", text: "Polycystin-1, a receptor" }
          - { key: "K", text: "Kidney failure ~15 years earlier" }
          - { key: "D", text: "Dominant: 7 times commoner than PKD2" }
          - { key: "1", text: "chromosome 16: 1 + 6, and PKD2 on 4" }
        hook: "**PKD1** = النمرة **1** في كل حاجة: أشهر (7 أضعاف)، أوحش، والـ ESRD بدري بـ **15 سنة**."
      - kind: explain
        page: 146
        title: "الـ cilia: حساس السرعة"
        quote: "This polycystin complex acts as an extra-cellular mechanosensor (luminal flow disturbs the cilia and triggers the apparatus)"
        text: |
          الـ **polycystin-1** (receptor) والـ **polycystin-2** (==calcium channel==) قاعدين مع بعض في الـ **cilia** بتاعة خلايا الـ collecting duct.

          البول وهو ماشي بيهز الـ cilia، فالـ complex يشتغل كـ ==mechanosensor== ويقول للخلية: "اثبتي، ما تكبريش". لو الـ complex باظ، الخلايا **تتكاثر من غير ضابط**، تعمل cyst **يقفل** على الـ nephron بتاعه ويكبر. وده بيحصل في **أقل من 1%** من الـ nephrons بس.
      - kind: figure
        page: 146
        quote: "Signal Pathway"
        title: "الـ signal pathway في كلمتين"
        alt: "Simplified ADPKD cell signalling: vasopressin on the V2 receptor stimulates adenylyl cyclase, raising cAMP; somatostatin on its receptor inhibits it. cAMP activates PKA, which drives CFTR chloride and fluid secretion into the cyst and, through Src, MAPK and mTOR, cell proliferation. Low calcium from failed polycystin-2 removes a brake on cAMP."
        caption: "الـ ==cAMP== هو البنزين: الـ **vasopressin** (V2) بيزوّده والـ **somatostatin** بيقلّله. علشان كده الأدوية الجديدة: **tolvaptan** و **octreotide**."
        svg: |
          <svg viewBox="0 0 330 310" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L07a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="L07b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="5" y="5" width="150" height="44" rx="8" class="fg-bad"/>
            <text x="80" y="24" text-anchor="middle" class="t-sm t-b">Vasopressin → V2R</text>
            <text x="80" y="40" text-anchor="middle" class="t-sm">(tolvaptan blocks)</text>
            <rect x="175" y="5" width="150" height="44" rx="8" class="fg-good"/>
            <text x="250" y="24" text-anchor="middle" class="t-sm t-b">Somatostatin → SSTR</text>
            <text x="250" y="40" text-anchor="middle" class="t-sm">(octreotide mimics)</text>
            <path d="M80 50 L150 82" class="fg-arrow-bad" marker-end="url(#L07b)"/>
            <path d="M250 50 L180 82" class="fg-arrow" marker-end="url(#L07a)"/>
            <text x="225" y="74" class="t-sm t-good">inhibits</text>
            <rect x="85" y="84" width="160" height="36" rx="8" class="fg-ink"/>
            <text x="165" y="107" text-anchor="middle" class="t-b">cAMP ↑ (Ca²⁺ low)</text>
            <path d="M165 120 L165 140" class="fg-arrow" marker-end="url(#L07a)"/>
            <rect x="115" y="142" width="100" height="32" rx="16" class="fg-acc"/>
            <text x="165" y="163" text-anchor="middle" class="t-b">PKA</text>
            <path d="M140 174 L80 204" class="fg-arrow" marker-end="url(#L07a)"/>
            <path d="M190 174 L250 204" class="fg-arrow" marker-end="url(#L07a)"/>
            <rect x="5" y="206" width="150" height="58" rx="8" class="fg-box"/>
            <text x="80" y="228" text-anchor="middle" class="t-sm t-b">CFTR Cl⁻ secretion</text>
            <text x="80" y="248" text-anchor="middle" class="t-sm">cyst fills with fluid</text>
            <rect x="175" y="206" width="150" height="58" rx="8" class="fg-box"/>
            <text x="250" y="228" text-anchor="middle" class="t-sm t-b">Src → MAPK → mTOR</text>
            <text x="250" y="248" text-anchor="middle" class="t-sm">cell proliferation</text>
            <rect x="60" y="274" width="210" height="30" rx="8" class="fg-bad"/>
            <text x="165" y="294" text-anchor="middle" class="t-b">Cyst grows</text>
          </svg>
      - kind: check
        page: 146
        quote: "Pkd-1 mutations are seven times more com-mon than pkd-2"
        question: "Compared with PKD2 mutations, PKD1 mutations are:"
        options:
          - "Commoner and reaches ESRD about 15 years earlier"
          - "Rarer and milder"
          - "Commoner but milder"
          - "Linked to chromosome 4"
        answer: 0
        why:
          - "صح: 7 أضعاف و ESRD بدري بـ 15 سنة."
          - "العكس بالظبط."
          - "أشهر، بس أوحش مش أخف."
          - "الـ PKD2 هو اللي على chromosome 4."
      - kind: explain
        page: 147
        title: "الكلية بتشتكي إزاي؟"
        quote: "Flank or loin pain arising from large cysts. Acute pain may suggest cyst rupture or bleeding."
        text: |
          - **Flank/loin pain** من الأكياس الكبيرة؛ الألم المفاجئ = **rupture أو bleeding**.
          - **Hematuria** (dipstick ± frank).
          - ==Hypertension==: **أشهر manifestation** وأهم سبب للـ progression.
          - **Nocturia و polyuria**: الكلية فقدت قدرة التركيز.
          - **Proteinuria خفيفة** (أقل من 1 g/day).

          حجم الكلية بيكبر مع السن في **100%**، و CRISP لقى إنه بيكبر **5.3% في السنة**، والـ **total kidney volume** أقوى predictor للتدهور.
      - kind: explain
        page: 148
        title: "الـ ESRD: مش قدر"
        quote: "At this stage, the average rate of GFR decline is 4.4 to 5.9 ml/min per year. Nevertheless, ESRD is not inevitable in ADPKD."
        text: |
          الكلية بتفضل شغالة لحد **العقد الرابع–السادس**، وبعدين الـ GFR ينزل **4.4–5.9 mL/min في السنة**. بس ==ESRD مش حتمي==: **77%** كويسين عند 50 سنة و **52%** عند 73.

          **Risk factors** للـ renal failure: **ذكر**، Black race، تشخيص أو أول hematuria **قبل 30**، hypertension **قبل 35**، hyperlipidemia و HDL واطي، sickle cell trait، و **PKD1 truncating**.
      - kind: explain
        page: 149
        title: "الـ hematuria والـ cyst hemorrhage"
        quote: "if the initial episode of hematuria occurs after age 50 years, neoplasm should be excluded"
        text: |
          الـ **visible hematuria** بتحصل في لحد **40%**. الـ DD: ==cyst hemorrhage، stone، infection، tumor==.

          الـ cyst hemorrhage يعمل hematuria **بس لو الكيس متصل بالـ collecting system**؛ غير كده يبقى **flank pain بس** (وأحيانًا حرارة، فتلتبس بالـ infection). أغلبه بيخلص في **2–7 أيام**.

          ⚠ لو استمر **أكتر من أسبوع** أو أول hematuria **بعد 50**: استبعد **neoplasm**.
      - kind: explain
        page: 150
        title: "الـ UTI والـ stones"
        quote: "Renal stone disease occurs in about 20% of patients with ADPKD. Most stones are composed of uric acid, calcium oxalate, or both."
        text: |
          **UTI**: شائعة بس ممكن تتقدّر بزيادة لأن الـ **sterile pyuria** شائع. الميكروبات: **E. coli، Klebsiella، Proteus**. الطريق **retrograde من المثانة**، علشان كده عالج الـ cystitis بسرعة.

          **Stones** في حوالي ==20%==: أغلبها **uric acid** أو calcium oxalate. الأحسن **CT urography** (أحسن للـ radiolucent)، والـ **dual-energy CT** يفرّق الـ calcium من الـ uric acid.
      - kind: check
        page: 149
        quote: "Differential diagnosis includes cyst hem-orrhage, stone, infection, and tumor."
        question: "ADPKD patient, 35 years, flank pain with fever and no hematuria. Which is NOT on the list to consider?"
        options:
          - "Medullary sponge kidney"
          - "Cyst hemorrhage"
          - "Cyst infection"
          - "Stone"
        answer: 0
        why:
          - "صح: ده مرض تاني خالص، مش مضاعفة من مضاعفات الـ ADPKD."
          - "الكيس اللي مش متصل بالـ collecting system بيعمل ألم من غير hematuria، وممكن حرارة."
          - "الحرارة تخليك تفكر في الـ infection."
          - "الـ stones في 20%."
      - kind: try
        items: [neph.L07.002, neph.L07.004, neph.L07.016, neph.L07.027, neph.L07.033]
    recap:
      - "ADPKD = multisystem، autosomal dominant؛ 25–40% من غير family history."
      - "PKD1 (chr 16، polycystin-1) أشهر 7 مرات و ESRD بدري 15 سنة؛ PKD2 على chr 4."
      - "الـ polycystins في الـ cilia = mechanosensor؛ لو باظت: proliferation ← cyst."
      - "cAMP هو البنزين: vasopressin يزوّده، somatostatin يقلّله."
      - "Hypertension أشهر manifestation؛ GFR ينزل 4.4–5.9/سنة، و ESRD مش حتمي."
      - "Hematuria أكتر من أسبوع أو بعد 50 = استبعد tumor. Stones 20% (uric acid)."
    practice: [neph.L07.001, neph.L07.002, neph.L07.003, neph.L07.004, neph.L07.005, neph.L07.006, neph.L07.007, neph.L07.008, neph.L07.009, neph.L07.010, neph.L07.011, neph.L07.012, neph.L07.013, neph.L07.014, neph.L07.015, neph.L07.016, neph.L07.017, neph.L07.018, neph.L07.019, neph.L07.020, neph.L07.021, neph.L07.022, neph.L07.023, neph.L07.024, neph.L07.025, neph.L07.026, neph.L07.027, neph.L07.028, neph.L07.029, neph.L07.030, neph.L07.031, neph.L07.032, neph.L07.033, neph.L07.034, neph.L07.035, neph.L07.036, neph.L07.037, neph.L07.038]
