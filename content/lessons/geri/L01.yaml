  - id: geri.L01.lesson5
    title: "الـ heart failure: مين ومنين وإزاي تتأكد"
    hook: "نص العيانين بيموتوا في 5 سنين، حتى اللي شكلهم كويسين. يبقى لازم تشخّص صح وبدري."
    minutes: 9
    pages: [14, 19]
    topics: [hf-causes, hf-signs, hf-diagnosis]
    goals:
      - "تفرّق الـ systolic من الـ diastolic وأسبابهم"
      - "تعرف أرقام الـ prognosis"
      - "تمشي على الـ ESC 2016 algorithm بالـ natriuretic peptides"
    status: unverified
    steps:
      - kind: explain
        page: 14
        title: "Systolic ضد diastolic"
        quote: "Systolic dysfunction: is present when the ejection fraction is less than 40% (normal ejection fraction: 55-60%)"
        text: |
          **6–10%** من اللي فوق 65 عندهم heart failure.

          **Systolic dysfunction:** EF ==أقل من 40%== (الطبيعي 55–60%). الأسباب:
          - **CAD**: أشهر سبب
          - Hypertensive heart disease
          - Valves: **calcific AS** و **mitral annulus calcification**
          - Cor pulmonale، myocarditis، thyroid
          - Tachy- أو brady-arrhythmias
          - Idiopathic، وده تشخيص بالاستبعاد

          **Diastolic HF:** **30–50%** من الـ CHF عندهم systolic function طبيعية. أكتر مع ==السن== وفي **الستات**، والـ asymptomatic أكتر من الـ symptomatic.
      - kind: update
        page: 14
        quote: "Systolic dysfunction: is present when the ejection fraction is less than 40% (normal ejection fraction: 55-60%)"
        text: "الـ ESC 2021 بيقسّم: **HFrEF ≤40%**، **HFmrEF 41–49%**، **HFpEF ≥50%**. في الامتحان: الكتاب بيقول systolic = EF أقل من 40%."
        ref: "ESC heart failure guidelines, 2021"
      - kind: table
        page: 15
        quote: "Structural Abnormalities - Hypertrophy - Fibrosis - Constriction Functional Abnormalities - Ischemia - Calcium overload - ATP depletion"
        title: "أسباب الـ diastolic dysfunction"
        columns: [Type, Causes]
        rows:
          - [Structural, "Hypertrophy, fibrosis, constriction"]
          - [Functional, "Ischemia, calcium overload, ATP depletion"]
        hide: [[0, 1], [1, 1]]
      - kind: reveal
        page: 15
        quote: "Functional Abnormalities - Ischemia - Calcium overload - ATP depletion"
        prompt: "ليه الـ ischemia والـ ATP depletion بيبوّظوا الـ diastole نفسها، مش بس الـ systole؟"
        answer: |
          الـ **relaxation** عملية بتصرف طاقة: الـ calcium لازم يترجع للـ sarcoplasmic reticulum بمضخة (SERCA) شغالة بالـ **ATP**. من غير ATP، الكالسيوم يفضل جوه الخلية (**calcium overload**) والعضلة ما ترتخيش ← stiff ventricle.

          (تفسير فسيولوجي؛ الأسباب نفسها من الكتاب.)
      - kind: explain
        page: 15
        title: "الـ prognosis: ما تتخدعش"
        quote: "it may seem that patients are doing well, but the neurohormonal imbalance underlying heart failure is still silently occurring"
        text: |
          - حوالي ==50%== بيموتوا خلال **5 سنين** من التشخيص، حتى مع أحسن علاج.
          - في رسمة الكتاب: **34%** من NYHA I–II و **42%** من NYHA III–IV ماتوا.
          - السبب: الـ ==neurohormonal imbalance== شغال في السر حتى لو الأعراض اتظبطت.
          - الـ **sudden death** أشهر سبب للوفاة القلبية في الـ systolic HF (حوالي **45%**).
      - kind: aside
        tone: analogy
        page: 16
        quote: "The neurohormonal imbalance that causes the disease to progress is present in all heart failure patients"
        text: "زي حنفية بتنقّط في شقة مقفولة: انت شايف الصالة نضيفة (NYHA I)، بس الميه بتبوّظ الأرضية من تحت. الحنفية دي هي الـ **neurohormonal imbalance**. علشان كده العلاج اللي بيقفل الحنفية، زي ACEI و BB و MRA، مهم حتى لو العيان مرتاح."
      - kind: table
        page: 16
        quote: "Classic physical findings of congestive heart failure Vital signs: Tachypnea. Cheyne -Stokes Respiration Heart: S3 Gallop."
        title: "الكشف في الـ CHF"
        columns: [Region, Findings]
        rows:
          - [Vitals, "Tachypnea, Cheyne-Stokes"]
          - [Heart, "S3 gallop (or normal sounds)"]
          - [Neck, "Raised JVP, hepatojugular reflux"]
          - [Chest, "Bibasal rales, pulmonary edema, wheeze, effusion"]
          - [Abdomen, "Tender liver, ascites, sacral edema"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: figure
        page: 18
