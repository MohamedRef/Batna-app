        title: "رسمة الكتاب ص 81: مين مات أكتر؟"
        image: { file: dm/L07-can-mortality-chart.webp, book: true }
        alt: "Book bar chart of deaths in two groups. With CAN, on the left: 400 died (30%) and 1316 alive. Without CAN, on the right: 212 died (13%) and 1584 alive."
        caption: |
          في كل مجموعة العمود **الفاتح** = died والـ **الغامق** = alive.

          - **الشمال** (+CAN): **400** ماتوا، ==30%==.
          - **اليمين** (−CAN): **212** ماتوا، **13%**.

          يعني الـ CAN لوحده ضاعف الوفيات أكتر من مرتين.
      - kind: match
        page: 81
        quote: "The pathophysiology of LVDD includes\n  a. Delayed relaxation,\n  b. Impaired LV filling,\n  c. Increased stiffness."
        prompt: "وصّل كل مشكلة بمعناها:"
        pairs:
