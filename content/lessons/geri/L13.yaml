schema: batna.lesson/v1
lecture: geri.L13
lessons:
  # ------------------------------------------------------------------
  - id: geri.L13.lesson1
    title: "الـ palliative care مش آخر محطة"
    hook: "ناس كتير فاكرة إن الـ palliative care يعني «خلاص مفيش أمل». الكتاب بيقول العكس: ممكن تبدأ يوم التشخيص."
    minutes: 7
    pages: [220, 222]
    topics: [definition, team, goals]
    goals:
      - "تعرّف الـ palliative care وتعرف إنها مش مربوطة بمرحلة"
      - "تعرف أعضاء الفريق والأمراض غير السرطان اللي بتحتاجها"
      - "تعدّ أهداف العلاج الـ palliative"
    status: unverified
    steps:
      - kind: explain
        page: 220
        quote: "Palliative care is a multidisciplinary approach to specialized medical care for people with serious illnesses."
        title: "التعريف"
        text: |
          الـ ==palliative care== هي رعاية طبية متخصصة و **multidisciplinary** لأي حد عنده مرض خطير، بتخفف الأعراض والألم والضغط الجسدي والنفسي، **أيًا كان التشخيص**.

          الهدف: ==quality of life== أحسن للمريض **وللعيلة**.
      - kind: reveal
        page: 221
        quote: "palliative treatments may be used to alleviate the side effects of curative treatments, such as relieving the nausea associated with chemotherapy."
        prompt: "مريض لسه متشخّص بـ lymphoma وهيبدأ chemo بهدف الشفا. ينفع ياخد palliative care؟"
        answer: "أيوه. الـ palliative care تنفع **في أي سن وأي مرحلة**، كهدف أساسي أو ==جنب العلاج الشافي==. مثال الكتاب: علاج الـ nausea بتاعة الـ chemo نفسه palliative."
      - kind: explain
        page: 220
        quote: "in hospitals, in the patient's home, as part of community palliative care programs, and in skilled nursing facilities."
        title: "فين وإمتى؟"
        text: |
          بتتقدّم في:
          - المستشفى.
          - **بيت المريض**.
          - برامج الـ community palliative care.
          - الـ skilled nursing facilities.

          ومؤشرها: أي ==serious illness== معاه **distress** جسدي أو نفسي أو اجتماعي أو روحي، من المرض أو من العلاج.
      - kind: explain
        page: 221
        quote: "through the prevention and relief of suffering by means of early identification and impeccable assessment and treatment of pain and other problems"
        title: "تعريف الـ WHO"
        text: |
          الـ WHO: بتحسّن حياة المرضى **وعيلاتهم** اللي بيواجهوا ==life-threatening illness==، بالوقاية من المعاناة وتخفيفها عن طريق:
          - **early identification**.
          - **impeccable assessment** وعلاج الألم والمشاكل التانية: جسدية، نفسية، وروحية.
      - kind: explain
        page: 221
        quote: "Physicians. Nurses. Physiotherapists. Occupational therapists. Pharmacists. Chaplains. Social workers. Psychologists."
        title: "الفريق"
        text: |
          فريق كامل، مش دكتور لوحده:
          - **Physicians** و **nurses**.
          - Physiotherapists و occupational therapists.
          - Pharmacists.
          - ==Chaplains== (رجل الدين، للـ spiritual care).
          - Social workers و psychologists.
          - Nutritionists.
      - kind: explain
        page: 222
        quote: "Renal disease. Chronic heart failure. HIV/AIDS. Progressive neurological conditions."
        title: "مش للسرطان بس"
        text: |
          زمان كانت مرتبطة بالسرطان، دلوقتي بتتعمل أكتر في:
          - Chronic progressive **pulmonary** disorders.
          - **Renal** disease.
          - Chronic ==heart failure==.
          - HIV/AIDS.
          - Progressive **neurological** conditions (ALS، MS).

          وفيه مجال بيكبر بسرعة: ==pediatric palliative care== للأطفال.
      - kind: explain
        page: 222
        quote: "Relief from suffering Treatment of pain and other distressing symptoms as:"
        title: "الأهداف"
        text: |
          1. **Relief from suffering**.
          2. علاج الألم والأعراض المزعجة: fatigue، shortness of breath، constipation، nausea، فقدان الشهية، النوم، وأعراض العلاج الجانبية.
          3. ==Psychological== و ==spiritual== care.
          4. support system يخليه **يعيش نشيط** على قد ما يقدر، ويحس إنه **متحكم**.
          5. يخفف **عبء العيلة** ويقوّي العلاقات.
          6. فهم **واقعي** للمرض.
      - kind: check
        page: 221
        quote: "palliative treatments may be used to alleviate the side effects of curative treatments, such as relieving the nausea associated with chemotherapy."
        question: "Which is a palliative treatment by the book's definition?"
        options: ["Antiemetic for chemotherapy nausea", "The chemotherapy itself", "Surgery to remove the tumour", "Radiotherapy to cure the lymphoma"]
        answer: 0
        why:
          - "صح: أي حاجة بتخفف الأعراض، حتى أعراض العلاج الشافي، palliative."
          - "الـ chemo هنا شافي (curative)."
          - "الجراحة الاستئصالية curative."
          - "الـ radiotherapy بهدف الشفا curative."
      - kind: aside
        tone: analogy
        page: 220
        quote: "can be provided as the main goal of care or along with curative treatment"
        text: "فكّر فيها زي **مكيف العربية**: مش هو اللي بيوصّلك، بس بيخلّي الرحلة تتحمل. ينفع يشتغل من أول الطريق، مش لما تقرّب على النهاية."
      - kind: try
        items: [geri.L13.001, geri.L13.003, geri.L13.007, geri.L13.010, geri.L13.060]
    recap:
      - "Multidisciplinary، لأي serious illness، أيًا كان التشخيص؛ الهدف quality of life للمريض والعيلة."
      - "أي سن وأي مرحلة، لوحدها أو جنب الـ curative."
      - "المستشفى، البيت، community programs، skilled nursing."
      - "الفريق: أطباء، تمريض، PT/OT، صيدلي، chaplain، social worker، psychologist، nutritionist."
      - "مش سرطان بس: رئة، كلى، HF، HIV، أعصاب، والأطفال."
    practice: [geri.L13.001, geri.L13.002, geri.L13.003, geri.L13.004, geri.L13.005, geri.L13.006, geri.L13.007, geri.L13.008, geri.L13.009, geri.L13.010, geri.L13.011, geri.L13.060]
