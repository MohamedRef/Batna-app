  - id: rheum.L01.lesson5
    title: "الـ cytokines كدوا"
    hook: "لو عرفت الـ cytokine بيعمل إيه، هتعرف لوحدك ندّيه لمين ونقفله عند مين."
    minutes: 9
    pages: [18, 19]
    topics: [therapy]
    goals:
      - "تحفظ الـ biologics اللي بتقفل الـ cytokines ودواعيها"
      - "تعدّ الخمس anti-TNF"
      - "تحفظ الـ cytokines اللي بنديها كدوا، وتستنتج الداعي من وظيفة الـ cytokine"
    status: unverified
    steps:
      - kind: explain
        page: 18
        quote: "This class of biological agents first succeeded with a soluble form of the TNF receptor and anti-TNF antibodies, which bind to and neutralize TNF. These agents greatly benefit many patients with rheumatoid arthritis, Crohn's disease, and psoriasis."
        title: "إزاي بقت أدوية؟"
        text: |
          - أول نجاح: **soluble tumour necrosis factor (TNF) receptor** و **anti-TNF antibodies** ← rheumatoid arthritis (RA) و Crohn's و psoriasis.
          - **Anti-IL-6 receptor** ← juvenile و adult arthritis.
          - Antagonists لـ **IL-1** و ==p40== (المشترك بين IL-12 و IL-23) و **IL-17**.
          - **Type I interferons (IFNs)** ← hepatitis.
          - **IFN-γ** ← leprosy و toxoplasmosis، عشان يوجّه المناعة لـ cytotoxic response.
      - kind: explain
        page: 18
        quote: "IFN-γ is used clinically to bias the adaptive immune system toward a cytotoxic response in diseases such as leprosy and toxoplasmosis, in which antibody responses are less effective than those that destroy infected cells."
        title: "ليه نقفل ساعات ونِدّي ساعات؟"
        text: |
          فيه اتجاهين في العلاج، والسبب في الاتنين هو وظيفة الـ cytokine:

          - **نقفل** الـ cytokine لما هو اللي عامل المرض: TNF في الـ RA و Crohn's و psoriasis، و IL-6 receptor في الـ arthritis. منطقي، عشان الالتهاب نفسه هو المشكلة.
          - **نِدّي** الـ cytokine لما محتاجين شغلته: الكتاب بيشرح IFN-γ بالظبط. في الـ ==leprosy== والـ toxoplasmosis الميكروب **جوه الخلايا**، فالـ antibodies مش بتوصله. محتاجين response يقتل **الخلية المصابة** نفسها، و IFN-γ بيميّل المناعة للـ cytotoxic response ده.

          وعلى نفس المنطق: الـ **p40** مشترك بين IL-12 و IL-23، فقفله بيقفل الاتنين مرة واحدة.
