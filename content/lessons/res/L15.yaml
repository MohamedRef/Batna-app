- id: res.L15.lesson6
  title: 'المتوسط والوسيط: تحسبهم إزاي وإمتى؟'
  hook: '6 مرضى transplant: 5 منهم تحت الـ 65، وواحد 623. المتوسط 135.8! مين فيهم بيكذب؟'
  minutes: 8
  pages: [98, 111]
  topics: [central]
  goals:
  - تحسب الـ mean من قيم ومن جدول
  - تحسب الـ median لـ n فردي وزوجي
  - تعرف مميزات وعيوب كل واحد
  status: unverified
  steps:
  - kind: explain
    page: 98
    quote: |-
      Measures of Central Tendency
      I- Measures of central tendency
      These are computed values around which most observations tend to concentrate or allocate.
    title: Central tendency
    text: |-
      قيم محسوبة ==البيانات بتتجمع حواليها==. أشهرهم 3: **mean**، **median**، **mode**.

      الـ **mean** = مجموع القيم ÷ عددها: للـ sample اسمه ==x̄ = Σx ÷ n==، وللـ population ==μ = Σx ÷ N==.
  - kind: explain
    page: 101
    quote: |-
      Notation
      x̄ is pronounced 'x-bar' and denotes the mean of a set of sample values
      x̄ = Σx / n
      μ is pronounced 'mu' and denotes the mean of all values in a population
      μ = Σx / N
    title: x̄ و μ
    text: |
      - ==x̄ (x-bar)==: متوسط ==sample== = Σx ÷ ==n==.
      - μ (mu): متوسط population = Σx ÷ N.

      ليه رمزين؟ علشان تعرف من الرمز إنت بتتكلم عن عيّنتك ولا عن الناس كلهم. التفسير المقبول (مش في الكتاب).
  - kind: check
    page: 103
    quote: |-
      Test yourself
      Mean = sum of values / Sample size = Σ (values) / n
      Suppose data are: 90, 80, 95, 85, 65
      x1 = 90, x2 = 80, x3 = 95, x4 = 85, x5 = 65
      x̄ = Σxi / n = (x1+x2+x3+x4+x5) / 5 = (90+80+95+85+65) / 5 = 83
    question: Mean of 90, 80, 95, 85, 65?
    options:
    - '83'
    - '85'
    - '415'
    answer: 0
    why:
    - 'صح: 415 ÷ 5.'
    - 85 هو الـ median.
    - 415 المجموع.
  - kind: explain
    page: 104
    quote: |-
      Find midpoint (X) of each interval= UL+LL/2
      Multiply F by X for each interval
      Find the sum of these products
      Find arithmetic mean
    title: 'Mean من جدول: 4 خطوات'
    text: |
      1. هات ==midpoint (X)== كل فئة = (UL + LL) ÷ 2.
      2. اضرب ==f × X== لكل فئة.
      3. اجمعهم: ==ΣfX==.
      4. اقسم على مجموع الـ frequency: x̄ = ΣfX ÷ Σf.

      ليه الـ midpoint؟ لأننا مش عارفين القيم بالظبط جوه الفئة، فبنفترض إنهم كلهم عند نصها. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 105
    quote: |-
      Calculate the mean.
      | Age (year) | F | xi | fxi |
      |---|---|---|---|
      | 15- | 10 | 20 | 200 |
      | 25- | 12 | 30 | 360 |
      | 35- | 15 | 40 | 600 |
      | 45- | 8 | 50 | 400 |
      | 55 < 65 | 5 | 60 | 300 |
      | Total | f=50 |  | fxi = 1860 |
      x̄ = ΣfX / Σf = 1860 / 50 = 37.2years
    title: Mean من جدول (grouped)
    text: |-
      1. هات **midpoint (X)** لكل فئة.
      2. اضرب **f × X**.
      3. اجمعهم = **ΣfX**.
      4. اقسم على **Σf**.

      مثال السلايد: ΣfX = 1860، Σf = 50 → ==x̄ = 37.2 years==.
  - kind: explain
    page: 106
    quote: |-
      Advantages & Disadvantages
      Advantages:
      easy to compute and interpret
      generally the best measure of central location.
      Disadvantages:
      It cannot be used with qualitative variables
      It can take on a fraction when the variable itself can take only integer values.
      It is affected by the extreme observation or outliers.
      Can not be used for open-ended tables.
    title: 'الـ mean: مميزات وعيوب'
    text: |
      المميزات: ==سهل يتحسب ويتفهم==، وغالبًا ==أحسن مقياس== للـ central location.

      العيوب:

      - ماينفعش مع ==qualitative variables==.
      - ممكن يطلع كسر حتى لو المتغير أرقام صحيحة (2.4 طفل).
      - بيتأثر بالـ outliers.
      - ماينفعش مع open-ended tables.

      ليه الـ outliers بتأثر؟ لأن كل قيمة داخلة في المجموع، فقيمة واحدة كبيرة جدًا بتشد المتوسط ناحيتها. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 107
    quote: |-
      Median
      Defined as the middle value of the observations when arranged from smallest to largest.
      Computation of the median from ungrouped data:
      When n is odd:
      The steps are:
      Order observations ascending or descending
      Determine the rank of the median given by (n+1)/2
      Find the value of median.
    title: الـ median ورتبته لو n فردي
    text: |
      الـ **median** = ==القيمة اللي في النص== بعد ما ترتب القيم من الأصغر للأكبر.

      لو ==n فردي==: رتّب، والرتبة = ==(n + 1) ÷ 2==.

      مثال توضيحي: 5 قيم، الـ median هي القيمة التالتة. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 108
    quote: |-
      Example:
      Find the median age of the following values
      5, 8, 7, 12 and 10 years.
      Ordering the observation: 5, 7, 8, 10, 12
      The rank of the median = (n+1)/2 = (5+1)/2 = 6/2 = 3
      The median = 8 years.
    title: 'Median: اللي واقف في النص'
    text: |-
      ==رتّب الأول== (أي غلطة هنا بتضيّع السؤال).

      - **n فردي**: الـ rank = ==(n + 1) ÷ 2==. القيم 5، 8، 7، 12، 10 ← 5، 7، 8، 10، 12 ← الـ rank 3 ← **8 years**.
      - **n زوجي**: الـ ranks = n/2 و n/2 + 1، والـ median ==متوسطهم==. القيم 8، 6، 12، 3، 5، 7 ← 3، 5، 6، 7، 8، 12 ← (6 + 7) ÷ 2 = **6.5 kg**.
  - kind: explain
    page: 109
    quote: |-
      When n is even:
      The steps are:
      1. The observations are arranged in an ascending or descending magnitude.
      2. Determine the ranks of the two middle observations given by: n/2 and n/2 + 1
      3. Refer back to ordered observations and using the obtained ranks, we determine the two middle values.
      4. The median = Sum of the 2 middle values / 2
    title: الـ median لو n زوجي
    text: |
      1. ==رتّب== القيم.
      2. رتب القيمتين اللي في النص: ==n/2 و n/2 + 1==.
      3. اقرا القيمتين.
      4. الـ median = ==مجموعهم ÷ 2==.

      ليه اتنين؟ لأن العدد الزوجي مالوش قيمة واحدة في النص بالظبط. التفسير المقبول (مش في الكتاب).
  - kind: check
    page: 110
    quote: |-
      Example:
      Find the median weight of the following values: 8, 6, 12, 3, 5 and 7 Kg.
      Ordering the observation: 3, 5, 6, 7, 8, 12
      The ranks = 6/2 = 3 and 6/2 + 1 = 4
      Median = (6 + 7) / 2 = 6.5 Kg
    question: Median weight of 8, 6, 12, 3, 5 and 7 kg?
    options:
    - 6.5 kg
    - 6 kg
    - 7 kg
    - 6.83 kg
    answer: 0
    why:
    - 'صح: رتّب 3، 5، 6، 7، 8، 12 → (6 + 7) ÷ 2 = 6.5.'
    - دي القيمة التالتة بس.
    - دي القيمة الرابعة بس.
    - ده الـ mean مش الـ median.
  - kind: explain
    page: 111
    quote: |-
      Median Advantages & Disadvantages:
      Advantages:
      Used with quantitative and qualitative ordinal variables.
      Used in open ended tables.
      Not affected by extreme values.
    title: 'الـ median: مميزات وعيوب'
    text: |
      المميزات:

      - بينفع مع ==quantitative و qualitative ordinal==.
      - بينفع في ==open-ended tables==.
      - ==مابيتأثرش بالقيم المتطرفة==.

      العيوب: ماينفعش مع الـ nominal، مش سهل في التحليل الإحصائي، وبياخد قيمة أو اتنين بس مش كل القيم.

      ليه مابيتأثرش بالـ outlier؟ لأنه بيبص على الترتيب، فلو أكبر قيمة كبرت أكتر، اللي في النص لسه في النص. التفسير المقبول (مش في الكتاب).
  - kind: try
    items: [res.L15.086, res.L15.088, res.L15.091]
  recap:
  - Mean = Σx ÷ n؛ grouped = ΣfX ÷ Σf.
  - 'Median: رتّب، (n + 1) ÷ 2 للفردي، ومتوسط الاتنين اللي في النص للزوجي.'
  - 'Mode: الأكتر تكرار؛ الوحيد للـ nominal؛ ممكن bimodal أو no mode.'
  - الـ mean بيتأثر بالـ outliers ومينفعش مع open-ended table؛ الـ median والـ mode لأ.
  practice: [res.L15.081, res.L15.082, res.L15.083, res.L15.084, res.L15.085, res.L15.086, res.L15.087, res.L15.088, res.L15.089,
    res.L15.090, res.L15.091, res.L15.092, res.L15.093]
