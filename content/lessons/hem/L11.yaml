schema: batna.lesson/v1
lecture: hem.L11
lessons:
  # ------------------------------------------------------------------
  - id: hem.L11.lesson1
    title: "الـ plasma cell اللي اتجننت"
    hook: "خلية وظيفتها تعمل antibodies تحميك، فجأة بقت تعمل نسخة واحدة بس من antibody ملهوش لازمة، وبتاكل العضم كمان."
    minutes: 8
    pages: [176, 178]
    topics: [classification, definition, etiology, pathogenesis]
    goals:
      - "تعرّف الـ multiple myeloma وتعرف الـ paraprotein بيبقى إيه"
      - "تحفظ أرقام الـ epidemiology وأقوى risk factor"
      - "تفهم ليه العضم بيتآكل: IL-6 و osteoclast-activating factors"
    status: unverified
    steps:
      - kind: explain
        page: 177
        quote: "Clonal B-cell malignancy characterised by proliferation of plasma cells that accumulate mainly within bone marrow and usually secrete paraprotein"
        title: "التعريف"
        text: |
          الـ ==multiple myeloma== هو **clonal B-cell malignancy**: plasma cells من clone واحد بتتكاثر وتتجمع أساسًا في الـ **bone marrow**.

          - معظمها بتفرز **paraprotein** (M protein): نفس الـ immunoglobulin بالظبط، نسخ ورا نسخ.
          - الأشهر **IgG (55%)**، بعده **IgA (20%)**، ونادرًا IgD.
      - kind: explain
        page: 177
        quote: "excretion of light chains in the urine (Bence Jones protein), either kappa or lambda"
        title: "Bence Jones"
        text: |
          الـ paraprotein ممكن يجي معاه **light chains** في البول، اسمها ==Bence Jones protein==، يا kappa يا lambda.

          وفي حوالي **20%** مفيش paraprotein في الدم خالص، بس light chains في البول. علشان كده لو عملت electrophoresis للسيرم بس، ممكن تفوّت الحالة.
      - kind: figure
        page: 177
        quote: "usually secrete paraprotein mainly IgG (55%) or IgA (20%) and rarely IgD"
        title: "مين بيفرز إيه"
        alt: "A bar chart of myeloma paraprotein types: IgG 55 percent, IgA 20 percent, light chain only about 20 percent, IgD rare."
        caption: "IgG الأكتر بفارق كبير. الـ light-chain only قريب من الـ IgA."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="22" class="t-b">Paraprotein in myeloma</text>
            <rect x="110" y="40" width="200" height="28" class="fg-acc"/>
            <text x="10" y="59" class="t-sm t-b">IgG</text>
            <text x="270" y="59" class="t-sm t-b">55%</text>
            <rect x="110" y="80" width="73" height="28" class="fg-good"/>
            <text x="10" y="99" class="t-sm t-b">IgA</text>
            <text x="190" y="99" class="t-sm">20%</text>
            <rect x="110" y="120" width="73" height="28" class="fg-box"/>
            <text x="10" y="139" class="t-sm t-b">Light chain</text>
            <text x="190" y="139" class="t-sm">~20% (urine)</text>
            <rect x="110" y="160" width="8" height="28" class="fg-bad"/>
            <text x="10" y="179" class="t-sm t-b">IgD</text>
            <text x="125" y="179" class="t-sm">rare</text>
          </svg>
      - kind: check
        page: 177
        quote: "In approximately 20% there is no paraproteinaemia, only light chains in the urine."
        question: "A patient with myeloma has a normal serum electrophoresis. What is the most likely explanation?"
        options: ["Light-chain myeloma: only Bence Jones protein in urine", "IgG myeloma", "Smoldering myeloma", "MGUS"]
        answer: 0
        why:
          - "صح: حوالي 20% مفيش paraprotein في الدم، بس light chains في البول."
          - "الـ IgG كان هيبان spike واضح في السيرم."
          - "الـ smoldering تعريفه M protein ≥ 3 g/dL، يعني لازم يبان."
          - "الـ MGUS برضه تعريفه وجود paraprotein في السيرم."
      - kind: explain
        page: 177
        quote: "Median age at presentation > 60 years. Rare under 40 years of age. Annual incidence is 4/100 000."
        title: "مين بيجيله؟"
        text: |
          - مرض ==كبار السن==: median age **> 60**، ونادر تحت 40.
          - **4/100 000** في السنة. أكتر في الرجالة والـ black Africans، وأقل في الآسيويين.
          - **1%** من كل السرطانات، و**10%** من الـ hematologic malignancies.
      - kind: explain
        page: 177
        quote: "Exposure to ionizing radiation 10 - 15 years prior to diagnosis (the most convincing risk factor)"
        title: "السبب؟ مش معروف، بس فيه متهمين"
        text: |
          - أقوى متهم: ==ionizing radiation== قبل التشخيص بـ **10-15 سنة**.
          - شغل الزراعة (grain dusts، aflatoxins)، benzene (possible)، وأدوية زي phenytoin و phenobarbital و diazepam.
          - **Familial occurrence**: established.
          - أمراض قبله: polymyositis/dermatomyositis، systemic sclerosis، AIHA، pernicious anaemia، ankylosing spondylitis. الـ RA: الدراسات مختلفة.
      - kind: aside
        tone: exam
        page: 177
        quote: "Exposure to ionizing radiation 10 - 15 years prior to diagnosis (the most convincing risk factor)"
        text: "لو السؤال قال \"the most convincing risk factor\" فالإجابة radiation، مش benzene (اللي الكتاب كاتبه possible بس)."
      - kind: explain
        page: 178
        quote: "Adhesion of MM cells to BMSCs triggers secretion in BMSCs of IL-6, the major cytokine mediating MM cell growth, survival, and resistance to drug"
        title: "إزاي بيعيش في النخاع؟"
        text: |
          الـ premyeloma cells بتروح النخاع بالـ **adhesion molecules**.

          لما تلزق في الـ **bone marrow stromal cells (BMSCs)**، الـ stroma تفرز ==IL-6==: الـ cytokine الأساسي اللي بيخلّي الـ myeloma يكبر ويعيش ويقاوم العلاج.
      - kind: figure
        page: 178
        quote: "Proposed osteoclast-activating factors include lymphotoxin, TNF-α, hepatocyte growth factor, IL-6, IL-1, metalloproteinases 1, 2, 9, RANKL"
        title: "الحلقة المفرغة في النخاع"
        alt: "A cycle. A myeloma cell sticks to a stromal cell by adhesion molecules. The stromal cell secretes IL-6, which feeds the myeloma cell. The myeloma cell and stroma release osteoclast-activating factors such as RANKL, TNF-alpha, IL-1 and MIP-1 alpha, which switch on osteoclasts that eat bone, giving lytic lesions and high calcium."
        caption: "الـ myeloma بيأكّل نفسه بالـ IL-6، وبيشغّل الـ osteoclasts تاكل العضم: lytic lesions و calcium عالي."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="H11a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="H11b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <circle cx="70" cy="60" r="38" class="fg-acc"/>
            <text x="38" y="56" class="t-sm t-b">Myeloma</text>
            <text x="50" y="72" class="t-sm t-b">cell</text>
            <rect x="200" y="25" width="120" height="70" rx="10" class="fg-box"/>
            <text x="215" y="55" class="t-sm t-b">Stromal cell</text>
            <text x="230" y="72" class="t-sm">(BMSC)</text>
            <path d="M110 50H195" class="fg-arrow" marker-end="url(#H11a)"/>
            <text x="118" y="42" class="t-sm t-mut">adhesion</text>
            <path d="M195 80H112" class="fg-arrow" marker-end="url(#H11a)"/>
            <text x="135" y="98" class="t-sm t-b t-acc">IL-6</text>
            <path d="M120 120L160 165" class="fg-arrow-bad" marker-end="url(#H11b)"/>
            <rect x="60" y="170" width="210" height="50" rx="8" class="fg-bad"/>
            <text x="72" y="192" class="t-sm t-b">RANKL, TNF-α, IL-1, IL-6</text>
            <text x="72" y="210" class="t-sm">MIP-1α, lymphotoxin, MMPs</text>
            <path d="M165 222V250" class="fg-arrow-bad" marker-end="url(#H11b)"/>
            <text x="60" y="275" class="t-b t-bad">Osteoclasts eat bone</text>
            <text x="60" y="293" class="t-sm">lytic lesions, high calcium</text>
          </svg>
      - kind: explain
        page: 178
        quote: "Abnormalities of 14 q (the location of IgH) (most common). Specific chromosome changes involve 14q32 in the majority of cases"
        title: "الـ chromosome"
        text: |
          أشهر cytogenetic abnormality في ==14q==، مكان الـ **IgH** gene، وتحديدًا **14q32** في معظم الحالات.

          منطقي: الخلية دي بتعمل immunoglobulin، فالـ translocation بيحصل جنب الجين اللي شغّال طول الوقت.
      - kind: try
        items: [hem.L11.008, hem.L11.009, hem.L11.011, hem.L11.015, hem.L11.020]
    recap:
      - "MM = clonal plasma cells في النخاع، بتفرز paraprotein: IgG 55%، IgA 20%."
      - "20% light chains بس في البول (Bence Jones)."
      - "> 60 سنة، 1% من السرطانات، 10% من الـ hematologic malignancies."
      - "أقوى risk factor: radiation قبلها بـ 10-15 سنة."
      - "IL-6 من الـ stroma = وقود الـ myeloma؛ RANKL وأصحابه بيشغلوا الـ osteoclasts."
    practice: [hem.L11.001, hem.L11.002, hem.L11.003, hem.L11.008, hem.L11.009, hem.L11.010, hem.L11.011, hem.L11.012, hem.L11.013, hem.L11.014, hem.L11.015, hem.L11.016, hem.L11.017, hem.L11.018, hem.L11.019, hem.L11.020, hem.L11.021, hem.L11.022]
