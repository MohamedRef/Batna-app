          - { text: "IVIg for the arthritis of polyarticular JIA", bin: 1 }
          - { text: "Live vaccine during etanercept", bin: 1 }
        why: "الـ IL-6 مهم في الـ systemic فالـ tocilizumab نفع بعد تاني جرعة. الـ IVIg ما نفعش للـ arthritis في دراستين controlled (يمكن ينفع الـ systemic features). والـ live vaccines ممنوعة مع الـ biologics."
      - kind: explain
        page: 209
        quote: "However, there is a significant mortality rate associated with ASCT (15%), thus ASCT must still be regarded as an experimental procedure in JIA."
        title: "آخر الخط"
        text: |
          - **Autologous stem-cell transplant**: للـ systemic أو poly المزمن المقاوم، بس الـ mortality **15%** فلسه ==experimental==.
          - **Surgery**: تغيير مفصل بايظ وموجع، soft tissue release، synovectomy.
          - **Physical و occupational therapy**: تمارين للقوة والحركة مع splints للـ alignment.
