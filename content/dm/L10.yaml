  # ---------- p125: indications ----------
  - id: dm.L10.001
    kind: card
    topic: indications
    front: Why is insulin given in type 1 DM?
    back: For survival.
    src: { page: 125, quote: "Type 1 DM: for survival." }
    status: unverified
  - id: dm.L10.002
    kind: enumerate
    topic: indications
    prompt: Indications for insulin in type 2 DM?
    points:
      - Failure of oral therapy
      - Hyperglycemic crises (DKA or HHS)
      - "Stress: ACS, ICU, major surgery, severe infection, corticosteroids"
      - Pregnancy or planning pregnancy
      - Significant liver or kidney disease
    pass: 4
    src: { page: 125, quote: "Patients in whom oral therapy has failed. 2. Hyperglycemic crises (DKA or HHS)." }
    status: unverified
    tags: [high-yield]
  - id: dm.L10.003
    kind: card
    topic: indications
    front: Name the stressful situations that call for insulin in type 2 DM.
    back: Acute coronary syndrome, ICU stay, major surgery, severe infection, corticosteroid therapy, and the like.
    src: { page: 125, quote: "Stressful situations (ACS, ICU, major surgery, severe infection, corticosteroid therapy, etc)." }
    status: unverified
  - id: dm.L10.004
    kind: mcq
    topic: indications
    stem: A 34-year-old woman with type 2 DM well controlled on metformin and gliclazide plans to become pregnant next year. What does the lecture advise?
    options:
      - Switch to insulin
      - Add an SGLT2 inhibitor
      - Continue the same oral drugs through pregnancy
      - Add a DPP-4 inhibitor
      - Stop all treatment and rely on diet
    answer: 0
    why:
      - "Correct: pregnancy or planning pregnancy is an indication for insulin in type 2 DM (p125)."
      - "SGLT2 inhibitors are contraindicated in pregnancy (dm.L09 p122)."
      - "The lecture lists planning pregnancy as an insulin indication."
      - "No oral agent is the lecture's answer here."
      - "Diet alone does not replace a needed drug."
    src: { page: 125, quote: "Pregnancy or planning to get pregnant." }
    status: unverified
  - id: dm.L10.005
    kind: mcq
    topic: indications
    stem: A 61-year-old man with type 2 DM on metformin and sitagliptin is admitted to the ICU with severe pneumonia and septic shock. Glucose 320 mg/dl. What is the glucose-lowering treatment of choice?
    options:
      - Insulin
      - Increase metformin to 3 g/d
      - Add glibenclamide
      - Add empagliflozin
      - Add acarbose
    answer: 0
    why:
      - "Correct: stressful situations such as ICU and severe infection are insulin indications (p125)."
      - "Metformin's maximum is 2.5 g/d, and lactic acidosis risk rises in shock."
      - "Oral secretagogues are not the answer in critical illness."
      - "SGLT2 inhibitors should not be started in critically ill inpatients (dm.L09 p122)."
      - "Acarbose is weak and unsuitable in the ICU."
    src: { page: 125, quote: "Stressful situations (ACS, ICU, major surgery, severe infection, corticosteroid therapy, etc)." }
    status: unverified
  # ---------- p126: A1C reduction and power of insulin ----------
