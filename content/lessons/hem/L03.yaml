  - id: hem.L03.lesson4
    title: "الـ sickle cell: حرف واحد غيّر كل حاجة"
    hook: "Valine مكان glutamic acid، في مكان واحد من سلسلة واحدة. والنتيجة: كرة بتتحول لمنجل لما الأكسجين يقل."
    minutes: 9
    pages: [30, 33]
    topics: [scd, scd-clinical]
    goals:
      - "تشرح الطفرة والـ polymerisation وإيه اللي بيزوّد الـ sickling"
      - "تربط كل مضاعفة بالـ vaso-occlusion أو بالطحال"
      - "تفرّق أنواع الـ haematologic crises وتعرف الـ aplastic crisis"
    status: unverified
    steps:
      - kind: explain
        page: 30
        title: "الطفرة"
        quote: "This in turn results in substitution of valine for glutamic acid at position 6 of β polypeptide chain. The amino acid substitution in HbS is represented as β6 Glu → Val."
        text: |
          - **Sickle cell anaemia** = **HbSS** (homozygous، الجين من الأب والأم).
          - **Sickle cell trait** = **HbAS** (heterozygous).

          الطفرة: base واحد **A → T** في الـ **codon 6** من جين الـ β، فالـ ==valine تيجي مكان glutamic acid== (**β6 Glu → Val**).

          الـ sickle haemoglobin (HbS) لما يفقد الأكسجين بيعمل ==polymerisation== جوّه الكرة، فتتحول **منجل** ناشف، والطحال يحبسه ويكسّره.

          ليه حرف واحد يعمل كل ده؟ التفسير المقبول (مش في الكتاب): الـ glutamic acid مشحون وبيحب الميه، والـ valine مش مشحون. فالـ HbS لما يسيب الأكسجين بيبان فيه **حتة لزقة** بتمسك في الجزيء اللي جنبه، والجزيئات تتصف في **ألياف طويلة** تشد الكرة وتخليها منجل.
      - kind: reveal
        page: 30
        quote: "Sickle cell trait: This is the heterozygous carrier state for HbS (Hb AS) in which sickle cell gene is inherited from one parent ."
        prompt: "صاحب الـ sickle cell trait (HbAS) عنده نفس الجين. ليه عادةً ما بيتعبش؟"
        answer: |
          التفسير المقبول (مش في الكتاب): كل كرة عنده فيها **adult haemoglobin** طبيعي جنب الـ HbS، والـ HbS أقل من النص. والـ adult haemoglobin ما بيدخلش في الـ polymer، فبيخفف تركيز الـ HbS، والـ polymer محتاج **تركيز عالي** عشان يتكوّن (أول حرف في الـ CHOCA).

          عشان كده الـ trait بيعيش طبيعي غالبًا، والمشكلة الحقيقية في الـ **HbSS**. ونفس الفكرة هي سر الـ **hydroxyurea**: يرفع Hb تاني (HbF) يخفف الـ HbS.
      - kind: mnemonic
        page: 31
        quote: "Factors which influence sickling\n  1) Intra cellular concentration of HbS and of other haemoglobins\n  2) cellular dehydration\n  3) Decreased oxygen tension\n  4) Cold induces vasoconstriction and increases sickling.\n  5) Low pH: acidosis increases sickling probably by inducing the deoxy state of haemoglobin."
        word: "CHOCA"
        parts:
          - { key: "C", text: "Concentration of HbS (and other Hbs)" }
          - { key: "H", text: "Hydration loss: cellular dehydration" }
          - { key: "O", text: "Oxygen tension low" }
          - { key: "C", text: "Cold: vasoconstriction" }
          - { key: "A", text: "Acidosis: favours deoxy Hb" }
        hook: "**CHOCA** زي **شوكولا**: كل حاجة من دول بتخلي الكرة «تجمد» وتتمنجل. ولاحظ: الـ dehydration بيزوّد تركيز الـ HbS، يعني **C** و **H** بيكملوا بعض."
      - kind: reveal
        page: 31
        quote: "Low pH: acidosis increases sickling probably by inducing the deoxy state of haemoglobin."
        prompt: "ليه الـ acidosis والبرد والـ dehydration كلهم بيعملوا crisis؟"
        answer: |
          كلهم بيزقّوا الـ HbS ناحية الـ **deoxy state** أو بيزوّدوا تركيزه، والـ deoxy HbS هو اللي بيعمل polymer:
          - **Acidosis**: الكتاب بيقول بيزوّد الـ sickling غالبًا لأنه بيخلي الـ Hb **deoxy**.
          - **Cold**: بيعمل **vasoconstriction**، فالدم يمشي أبطأ والأنسجة تسحب أكسجين أكتر.
          - **Dehydration**: الكرة بتنكمش فتركيز الـ HbS جوّاها **يعلى**، والجزيئات تقرب من بعض.

          التفسير المقبول (مش في الكتاب): عشان كده عيان الـ sickle اللي عنده حرارة وترجيع وبيتنفس بصعوبة بيدخل crisis بسهولة: dehydration و acidosis و hypoxia مع بعض.
