          - "صح: الكتاب: CO2 **minimize bloating**. التفسير المقبول (مش في الكتاب): بيتمص بسرعة من الأمعاء عكس الهوا."
          - "الكتاب ما قالش كده."
          - "الـ enteroscopy بتتعمل تحت **sedation** أو short-acting GA."
          - "مش مذكور."
      - kind: case
        page: 41
