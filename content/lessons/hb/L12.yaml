            <text x="272" y="72" text-anchor="middle" class="t-sm">lipid</text>
            <text x="272" y="86" text-anchor="middle" class="t-sm">peroxidation,</text>
            <text x="272" y="100" text-anchor="middle" class="t-sm">oxidative damage</text>
            <path d="M272 114v120h-56" class="fg-arrow-bad" marker-end="url(#L12a)"/>
            <path d="M20 302h-12V64" class="fg-thin"/>
            <path d="M8 64h8" class="fg-arrow-acc" marker-end="url(#L12b)"/>
            <rect x="20" y="284" width="290" height="36" rx="8" class="fg-good"/>
            <text x="165" y="306" text-anchor="middle" class="t-sm t-b">Abstinence: resolves steatosis, improves survival</text>
          </svg>
      - kind: reveal
        page: 195
        prompt: "زمان كانوا بيقولوا الـ alcoholic steatosis «benign». الكتاب بيقول لأ. ليه؟"
        answer: |
          لأن المرضى اللي عندهم chronic steatosis بيبقوا more susceptible to fibrotic liver disease.

          والسبب: وجود الدهون نفسه بيعني greater risk for ==lipid peroxidation== and oxidative damage.

          - **Lipid peroxidation**: الدهون بتتأكسد، وبتطلّع مواد بتأذي غشا الخلية وبتنشّط الالتهاب والتليّف.

          الدهون مش ضيف ساكت، دي وقود جاهز للحريقة. والكحول هو الكبريت.
      - kind: explain
        page: 195
        title: "تحت الميكروسكوب"
        text: |
          الـ histology: ==centrilobular macrovesicular steatosis== مع درجات مختلفة من الـ fibrosis.

          - **Centrilobular**: حوالين الـ central vein، يعني zone 3.
          - **Macrovesicular**: نقطة دهن واحدة كبيرة بتملى الخلية وبتزق النواة على جنب.

          فاكر من L01؟ الـ alcoholism بيبدأ الـ fibrosis في zone 3. السبب المقبول: zone 3 آخر حتة يوصلها الدم، فيها أقل oxygen وأكتر إنزيمات بتكسّر الكحول.

          والـ differential diagnosis اللي الكتاب كاتبه: Diabetes و Obesity. الاتنين بيعملوا fatty liver برضه، فلازم تسأل عن الكحول بالأرقام.
      - kind: explain
        page: 195
        title: "كام جرام؟ وكام سنة؟"
        quote: "Intake of 40 to 80 grams ethanol/day by males and of 20 to 40 grams/day by females for 10 to 12 years"
        text: |
          ده general predictor لـ alcoholic steatohepatitis, fibrosis, and cirrhosis:

          - الرجالة: ==40-80 g/day==
          - الستات: ==20-40 g/day==
          - لمدة ==10-12 سنة==

          - **Steatohepatitis**: دهون ومعاها التهاب، يعني المحطة التانية.

          لاحظ إن رقم الستات نص رقم الرجالة بالظبط. افتكرها كده: الست بنص الكمية بتوصل لنفس المكان، في نفس المدة.

          والشرطين مع بعض: كمية من غير مدة مش كفاية، ومدة بكمية قليلة مش كفاية.
      - kind: figure
        page: 195
        title: "الكمية والمدة على مسطرة واحدة"
        alt: "A horizontal scale of grams of ethanol per day from 0 to 100. The women's risk band covers 20 to 40 grams. The men's risk band covers 40 to 80 grams. Below both bands a note says the intake must last 10 to 12 years to predict steatohepatitis, fibrosis and cirrhosis."
        caption: "الستات من 20 لـ 40، والرجالة من 40 لـ 80: نفس الطول، بس بدري بالنص. والاتنين محتاجين 10-12 سنة."
        svg: |
