    title: "علاج الـ AML: الـ supportive والـ 3 + 7"
    hook: "تلات أيام anthracycline وسبعة Ara-C، وطول الوقت بتعوّض اللي النخاع مش بيعمله."
    minutes: 10
    pages: [111, 112]
