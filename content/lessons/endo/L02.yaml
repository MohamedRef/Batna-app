            <rect x="10" y="80" width="150" height="40" rx="8" class="fg-bad"/>
            <text x="18" y="98" class="t-sm t-b">Severe PPH</text>
            <text x="18" y="113" class="t-sm">hypotension / shock</text>
            <rect x="170" y="64" width="150" height="40" rx="8" class="fg-box"/>
