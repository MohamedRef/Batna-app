- id: hb.L09.191
  kind: essay
  topic: clinical
  prompt: Give a brief review on hepatic hydrothorax.
  outline:
  - Mechanism:
    - Usually right-sided; ascites crosses diaphragmatic defects
  - Features:
    - Dyspnea; transudate with serum-pleural albumin gradient ≥1.1 g/dL
    - Spontaneous bacterial empyema is managed like SBP
  - Treatment:
    - As for ascites; TIPS as bridge for refractory hydrothorax
    - LT best; thoracentesis and pleurodesis if others fail
  src:
    page: 149
    quote: "Hepatic hydrothorax is usually a right-sided effusion due to ascitic fluid translocating through diaphragmatic defects from the peritoneum to the pleural space."
