        text: |
          الكتاب (جدول ص 94) بيدّي لكل طارئة drug of choice و target. التفسير المقبول (مش في الكتاب):

          - **HF/pulmonary edema → nitroglycerin/nitroprusside:** بيوسّعوا الأوردة **فـ** الدم الراجع للقلب (preload) يقل والرئة تنشف.
          - **Pheochromocytoma و cocaine → phentolamine:** المشكلة **alpha** stimulation، **فـ** نقفل الـ alpha. ولو اديت beta-blocker لوحده الـ alpha يفضل من غير معارض والضغط يعلى أكتر.
          - **Eclampsia → MgSO4:** بيمنع **التشنجات**، وده أخطر حاجة على الأم.
          - **Bleeding → 10–15% بس:** كفاية علشان النزيف يقل من غير ما الأعضاء تتحرم من الدم.
          - **Renal → fenoldopam:** dopamine-1 agonist بيوسّع أوعية الكلية نفسها.
