  - id: hb.L14.lesson2
    title: "الروماتيزم وأدويته والكبد"
    hook: "الـ Still's بيرفع الـ ALT، الـ vasculitis بترفع الـ ALP، والـ azathioprine عامل 3 مصايب لوحده."
    minutes: 8
    pages: [257, 260]
    topics: [ctd, rheum-drugs]
    goals:
      - "تعرف شكل الكبد في كل collagen disease"
      - "تفرّق lupus hepatitis عن AIH/SLE overlap"
      - "تحفظ جدول الـ rheumatologic drugs (سؤال امتحان)"
    status: unverified
    steps:
      - kind: explain
        page: 257
        title: "الكبد في الـ connective tissue disease"
        text: |
          - **شائع** وغالبًا **asymptomatic**، بس ممكن يبقى فيه أعراض، واتوصف حتى **fulminant hepatitis**.
          - قبل ما تقول «ده من المرض نفسه» لازم **تستبعد** drug toxicity و viral hepatitis و autoimmune liver disease.
          - النوعين: **hepatocellular** (ALT و AST) أو **cholestatic** (ALP و GGT). الارتفاع عمومًا **mild** ومرتبط بالـ **disease activity**.
          - **ALT أعلى حاجة في adult-onset Still's disease.**
          - **ALP و GGT أعلى حاجة في الـ vasculitis.**
          - **RA:** transaminases و bilirubin عادةً **normal**، بس ALP مرتفع في **18–46%** و GGT في **23–77%** (ومرتبط بالـ activity).
      - kind: sort
        page: 257
        prompt: "مين بيرفع إيه أكتر؟"
        bins: ["Highest ALT", "Highest ALP / GGT"]
        cards:
          - { text: "Adult-onset Still's disease", bin: 0 }
          - { text: "Vasculitis syndrome", bin: 1 }
          - { text: "Hepatocellular pattern", bin: 0 }
          - { text: "Cholestatic pattern", bin: 1 }
        why: "الـ **Still's** هو بطل الـ ALT (hepatocellular)، والـ **vasculitis** بطلة الـ ALP و GGT (cholestatic)."
      - kind: explain
        page: 258
        title: "RA و SLE"
        text: |
          **RA ومشتقاته (Still's و Felty's):** LFTs بايظة كتير. وممكن تلاقي: PBC، autoimmune hepatitis، **nodular regenerative hyperplasia**، necrotizing arteritis، أو amyloidosis، وحتى **rheumatoid nodules** في الكبد.

          **SLE:**

          - Liver dysfunction في **8.6–59.7%**، و ALT مرتفع في **21%**.
          - الأسباب مش المرض بس: drugs، fatty infiltration، و overlapping autoimmune diseases.
          - **Lupus hepatitis:** hypertransaminasemia الـ ALT فيها **بيطلع وينزل مع نشاط الـ SLE**. غالبًا **subclinical**، fluctuating، وبتستجيب لـ prednisone (moderate لـ high) **من غير** ما توصل لـ end-stage.
          - أشهر histology: **steatosis** (ومش لازم تكون من الـ steroids).
          - **SLE + AIH** مع بعض **uncommon**، بس الـ AIH ممكن تعمل **fulminant failure** أو cirrhosis، فلازم تفرّق.
      - kind: reveal
        page: 258
        prompt: "ليه مهم تفرّق lupus hepatitis عن AIH/SLE overlap، طالما الاتنين بيتعالجوا بـ steroids؟"
        answer: |
          لأن **المصير مختلف**:

          - الـ **lupus hepatitis** subclinical و fluctuating، ومش بتوصل لـ end-stage liver disease.
          - الـ **AIH** ممكن تتطور لـ **fulminant hepatic failure** أو **cirrhosis**.

          يعني لو سمّيتها lupus hepatitis وهي AIH، ممكن تفوّت مرض بيمشي لقدّام.
      - kind: explain
        page: 259
        title: "HPS و PAN و GCA"
        text: |
          - **Reactive hemophagocytic syndrome (HPS):** ممكن يموّت. مرتبط بـ neoplasms و viral infections و autoimmune diseases منها **SLE**. شكله: **high fever**، lymphadenopathy، **hepatosplenomegaly**، **pancytopenia**، LFTs عالية، **hyperferritinemia**، و coagulopathy. السبب: **sustained macrophage activation** بعد cytokines زي **IL-6** و **TNF-α**.
          - **Polyarteritis nodosa:** necrotizing arteritis في الكبد → **infarction**.
          - **Polymyalgia rheumatica–giant cell arteritis:** **granulomatous arteritis** في الكبد.
      - kind: table
        page: 259
        title: "الأدوية والكبد (سؤال امتحان مباشر)"
        columns: ["Hepatotoxic effect", "Drugs"]
        rows:
          - ["Acute DILI: hepatocellular", "NSAIDs (diclofenac, sulindac, ibuprofen, ketoprofen, indomethacin); sulfasalazine, leflunomide"]
          - ["Acute DILI: cholestatic", "NSAIDs (sulindac, ibuprofen, piroxicam, naproxen, celecoxib); sulfasalazine, azathioprine"]
          - ["Nonalcoholic fatty liver", "Methotrexate"]
          - ["Ductopenic (vanishing bile duct) syndrome", "Azathioprine, gold salts"]
          - ["Nodular regenerative hyperplasia", "Azathioprine"]
          - ["Drug-induced AIH", "Infliximab, diclofenac, indomethacin"]
        hide: [[2, 1], [3, 1], [4, 1], [5, 1]]
      - kind: mnemonic
        page: 259
        word: "AZA"
        parts:
          - { key: "A", text: "Acute cholestatic DILI" }
          - { key: "Z", text: "Zero bile ducts: ductopenic (vanishing bile duct) syndrome, with gold salts" }
          - { key: "A", text: "Adds nodules: nodular regenerative hyperplasia" }
        hook: |
          الـ **AZA** اسمه بيحكي مصايبه التلاتة في الكبد: **A**cute cholestasis، **Z**ero ducts، و **A**dds nodules (NRH). ولو المريض جالك بـ portal hypertension من غير cirrhosis وهو على AZA، افتكر الـ NRH.
      - kind: check
        page: 259
        question: "Which rheumatologic drug is linked in the book to drug-induced autoimmune hepatitis?"
        options:
          - "Infliximab"
          - "Methotrexate"
          - "Gold salts"
          - "Leflunomide"
        answer: 0
        why:
          - "صح: الكتاب: **infliximab، diclofenac، indomethacin**."
          - "الـ methotrexate = **nonalcoholic fatty liver**."
          - "الـ gold salts = **ductopenic syndrome** (مع الـ azathioprine)."
          - "الـ leflunomide = acute **hepatocellular** DILI."
      - kind: aside
        tone: joke
        page: 259
        text: |
          الـ **diclofenac** واخد دور في كل مشهد: hepatocellular DILI **و** drug-induced AIH. زي الممثل اللي بيظهر في كل مسلسلات رمضان. افتكره في الخانتين. 😄
      - kind: try
        items: [hb.L14.014, hb.L14.019, hb.L14.026, hb.L14.028]
    recap:
      - "CTD: الكبد غالبًا asymptomatic؛ استبعد drugs و viral و AIH الأول."
      - "ALT أعلى في Still's، ALP/GGT أعلى في الـ vasculitis. RA: ALP 18–46%، GGT 23–77%."
      - "Lupus hepatitis: ALT مع الـ activity، subclinical، بتستجيب للـ prednisone. أشهر histology في SLE: steatosis."
      - "HPS: fever + hepatosplenomegaly + pancytopenia + ferritin عالي (IL-6، TNF-α)."
      - "MTX → fatty liver. AZA → cholestasis، ductopenia، NRH. Infliximab/diclofenac/indomethacin → drug-induced AIH."
    practice: [hb.L14.013, hb.L14.014, hb.L14.015, hb.L14.016, hb.L14.017, hb.L14.018, hb.L14.019, hb.L14.020, hb.L14.021, hb.L14.022, hb.L14.023, hb.L14.024, hb.L14.025, hb.L14.026, hb.L14.027, hb.L14.028, hb.L14.029, hb.L14.030, hb.L14.098, hb.L14.099, hb.L14.100, hb.L14.101, hb.L14.119]

  # ------------------------------------------------------------------
  - id: hb.L14.lesson3
    title: "الدم، الـ sepsis، الـ IBD، والـ granulomas"
    hook: "ALT بـ 4000 بعد shock، bilirubin بيطلع ببطء في الـ ICU، و granuloma بتقولك «I'm fine» والـ ALP عالي."
    minutes: 10
    pages: [260, 266]
    topics: [ctd, heme, sepsis, ibd, granuloma]
    goals:
      - "تعرف إزاي أمراض الدم وعلاجها بيأذوا الكبد"
      - "تفرّق hypoxic hepatitis عن cholestatic liver dysfunction في الـ ICU"
      - "تعرف الكبد في الـ IBD"
      - "تعدّ الـ 5 categories بتوع الـ hepatic granulomas"
    status: unverified
    steps:
      - kind: explain
        page: 260
        title: "الكبد في أمراض الدم"
        text: |
          - في الـ liver failure الـ coagulation كلها متلخبطة: الـ **bleeding risk** من الـ **hemodynamic changes** (portal pressure و venous congestion)، والـ **thrombotic risk** من تغيّرات الـ **coagulation system**.
          - أمراض الدم بتبان في الكبد بـ: LFTs بايظة، imaging بايظ، أو أعراض كبدية.
          - **Hematologic malignancies:** الخلايا بتدخل الكبد → LFTs + hepatosplenomegaly أو nodules، وممكن fulminant failure.
          - **العلاج نفسه بيأذي:** **iron overload** من نقل الدم المتكرر، **HBV reactivation** (fatal بس preventable) مع الـ chemo/immunosuppression، و **VOD (SOS)** بعد الـ hematopoietic cell transplant.
          - **ALP و LDH** بيعلوا كتير، بس الـ imaging (scintigraphy، US، CT، MRI) ممكن ما يبيّنش. وفي الـ lymphoma فيه sinusoidal infiltration و granulomas و nodules، فممكن تحتاج **peritoneoscopy**.
          - **Liver involvement بيتفترض** لو: كبد كبير + ALP أو LDH عالي + CRP أو ESR عالي.
      - kind: explain
        page: 262
        title: "Extramedullary hemopoiesis"
        text: |
          - في الجنين والـ neonate **طبيعي**، في الكبير **pathological**.
          - **Causes:** **aplastic anemia** و **marrow replacement**: myeloproliferative disease، osteomyelofibrosis، myelomatosis، marrow carcinomatosis، osteopetrosis.
          - Hepatomegaly و **massive splenomegaly** و portal hypertension مع ascites. والـ **NRH** بعد انسداد فروع الـ portal vein جوه الكبد بتزوّد الـ portal hypertension.
      - kind: aside
        tone: analogy
        page: 262
        text: |
          الـ EMH زي **مصنع اتقفل** (النخاع) فالعمّال راحوا يشتغلوا في **بيت العيلة القديم** (الكبد والطحال، اللي كانوا بيعملوا دم أيام الجنين). البيت يتزحم ويكبر، والدوشة توصل للـ portal vein.
      - kind: explain
        page: 262
        title: "الـ sepsis والـ ICU"
        text: |
          الـ sepsis بيأذي الكبد بـ: **infection** مباشرة، أو **circulating toxins** والـ inflammatory/immune response، أو **ischemia** من الـ septic shock، أو مزيج. والـ lesions: abscess، cholangitis، **pylephlebitis**، vasculitis، granulomas، necrosis.

          الكبد ليه دورين في الـ critical illness: **clearance** للميكروبات والـ toxins، و **acute phase reaction** (cytokines، mediators، coagulation factors). ولو الـ clearance ضعفت، الـ endotoxin بيـ «spillover» ويساعد في الـ **multiple organ failure**.

          الـ liver dysfunction الجديد في الـ ICU نوعين: **hypoxic (ischemic) hepatitis** و **cholestatic liver dysfunction**.
      - kind: table
        page: 263
        title: "HH ولا CLD؟"
        columns: ["", "Hypoxic hepatitis (HH)", "Cholestatic liver dysfunction (CLD)"]
        rows:
          - ["Setting", "Cardiac, respiratory or circulatory failure", "Critical illness, days after ICU admission"]
          - ["Onset", "Abrupt", "Insidious, progressive"]
          - ["Labs", "Transaminases ≥ 20× ULN, very short-lived", "Bilirubin > 2–3 mg/dL; ALP and GGT 2–3× normal"]
          - ["Then", "Coagulopathy; jaundice in a minority = worse outcome", "Rising bilirubin, ALP, GGT"]
          - ["Key step", "Exclude viral and drug-induced necrosis", "Look for sepsis, parenteral nutrition, hyperglycemia, drugs"]
        hide: [[1, 1], [1, 2], [2, 1], [2, 2]]
      - kind: check
        page: 263
        question: "A 65-year-old in cardiogenic shock after an MI has ALT 4200 U/L on day 2. Viral markers are negative and no new drugs were given. What is the diagnosis?"
        options:
          - "Hypoxic (ischemic) hepatitis"
          - "Cholestatic liver dysfunction of critical illness"
          - "Acute viral hepatitis"
          - "Congestive hepatopathy"
        answer: 0
        why:
          - "صح: الـ triad: **circulatory failure** + ارتفاع مفاجئ **≥ 20× ULN** + استبعاد viral و drugs."
          - "الـ CLD **insidious** وأيام بعد الدخول، والـ pattern **cholestatic**."
          - "الـ viral markers سالبة، والاستبعاد جزء من الـ triad."
          - "الـ congestive pattern **cholestatic** والـ transaminases normal أو moderate."
      - kind: explain
        page: 264
        title: "ليه الـ sepsis بيعمل cholestasis؟"
        text: |
          - الـ CLD من **critical illness–induced alteration of hepatobiliary transport**.
          - **Risk factors:** **sepsis** (endotoxemia + cytokines)، **parenteral nutrition**، **hyperglycemia**، و drug-induced cholestasis فوقهم.
          - الـ cholestasis بتحصل مع **gram-negative** (E. coli، Klebsiella) **أو gram-positive** (S. aureus).
          - الـ **TNF-α** و **IL-6** و **nitric oxide** بيـ **inhibit canalicular excretion of conjugated bilirubin**.
      - kind: explain
