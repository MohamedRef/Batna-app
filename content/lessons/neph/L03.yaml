        title: "CRS-4: ليه الخطر بيكبر مع الـ stage؟"
        text: |
          الكتاب (Figure 4) بيرصّ عوامل الـ CRS-4 حسب الـ **stage**: diabetes و hypertension بدري، anemia و uremic toxins في الوسط، و **calcification** و **EPO resistance** في الآخر.

          التفسير المقبول (مش في الكتاب): العوامل دي **بتتجمّع** مش بتتبدّل، **فـ** كل stage بيضيف حمل جديد فوق القديم:

          - الـ **anemia** والـ **hypertension** بيعملوا left ventricular hypertrophy (LVH).
          - الـ **phosphate** العالي بيترسّب في جدار الشرايين (calcification)، **فـ** الشرايين تبقى ناشفة والـ afterload يعلى.
          - الـ **inflammation** والـ LDL oxidation بيسرّعوا الـ atherosclerosis.

          عشان كده مريض الـ CKD المتأخر بيموت بالقلب أكتر ما بيوصل للغسيل.
