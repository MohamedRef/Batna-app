  # ---------- p260: definition and Fredrickson ----------
  - id: dm.L21.001
    kind: card
    topic: fredrickson
    front: On what basis did Fredrickson classify hyperlipoproteinemia in the 1960s?
    back: On the composition of serum lipoproteins; he described five phenotypes.
    src: { page: 260, quote: "based on the composition of serum lipoproteins, Fredrickson suggested five different phenotypes of hyperlipoproteinemia" }
    status: unverified
