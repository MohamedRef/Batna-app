  - id: dm.L01.lesson5
    title: "Type 1 ولا 2؟ والـ prediabetes"
    hook: "جدول من عشر سطور بيفرق بين النوعين، ومنطقة في النص اسمها prediabetes مش مرض بس جرس إنذار."
    minutes: 9
    pages: [12, 13]
    topics: [types]
    goals:
      - "تفرّق type 1 من type 2 بالجدول"
      - "تعرّف الـ prediabetes وأهميته"
      - "تفسّر كل علامة في type 1 (ketosis، never obese) بالـ mechanism"
    status: unverified
    steps:
      - kind: explain
        page: 12
        title: "Type 1 أنواع"
        quote: "1- Autoimmune:\n  Rapidly progressive young.\n    Slowly progressive LAD A (Late onset Autoimmune Diabetes in the Adulthood).\n  2- Idiopathic non-immune mediated."
        text: |
          **Type 1:**
          - **Autoimmune:** rapidly progressive (صغيرين)، أو slowly progressive = ==latent autoimmune diabetes in adults== (Late-onset Autoimmune Diabetes in Adulthood).
          - **Idiopathic** non-immune mediated.

          **Type 2:** الـ obese **80%** (resistant)، والـ non-obese **20%** (secretory)، والـ **maturity-onset diabetes of the young (MODY)** = Maturity Onset Diabetes of the Young.

          ليه الكتاب حاطط الـ MODY تحت type 2؟ لأنه **مش autoimmune**: البنكرياس موجود بس الإفراز فيه عيب، يعني أقرب لمنطق type 2 حتى لو بييجي للصغيرين. والـ idiopathic type 1 = نفس الصورة من غير antibodies.
      - kind: explain
        remind: [dm.L01.080]
        page: 12
        title: "علامات الـ type 1 السريع"
        quote: "a- Clinical markers:\n  Young < 30 years.\n  Classical, acute, and severe presentation.\n  Never obese.\n  Ketosis-prone (up to 30% of cases presented by DKA).\n  Insulin is required for survival"
        text: |
          **Clinical:** أقل من **30 سنة**، presentation classic حاد، **never obese**، ==ketosis-prone== (لحد **30%** بييجوا بـ **diabetic ketoacidosis (DKA)**)، والـ insulin **required for survival**.

          **Lab:** insulin و **C-peptide** absent أو very low، **GAD-Abs، islet cell antibodies (ICA)، insulin autoantibodies**، و **HLA-DR3/DR4**.

          كل علامة ليها سبب: **never obese** لأن مفيش insulin يبني دهون، و **ketosis-prone** لأن من غير insulin الدهون بتتكسّر لحد ما الكبد يعمل منها ketones، و **insulin required for survival** لأن مفيش β-cells تعوّض. الـ antibodies والـ HLA هما بصمة الحرب المناعية اللي شفناها في الـ 6 stages.
      - kind: reveal
        page: 12
        quote: "Ketosis-prone (up to 30% of cases presented by DKA)."
        prompt: "ليه لحد 30% من type 1 بييجوا بـ DKA كأول ظهور، و type 2 نادرًا؟"
        answer: |
          الكتاب بيقول type 1 **ketosis-prone** ولحد **30%** بيبدأوا بـ **DKA**.

          التفسير المقبول (مش في الكتاب): الـ insulin حتى لو قليل بيمنع الدهون تتكسّر. في type 1 مفيش insulin **خالص** (absolute)، فالدهون تتكسّر بالكوم والكبد يحوّلها **ketones** حمضية. في type 2 الـ insulin موجود (normal أو high في جدول الكتاب)، كفاية يمنع الـ ketones حتى لو مش كفاية يضبط السكر.
