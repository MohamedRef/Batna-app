        caption: "الكتاب راسمها شجرة من **Diagnosis CKD** لـ 4 فروع، كل فرع: **ليه** تحوّل (الصندوق الملوّن)، و**الهدف** من التحويل (الصندوق اللي جنبه)، و**إمتى** بالظبط (الصندوق المنقّط تحته):\n\n- **Causes**: السبب مش واضح، hereditary، أو stones متكررة ← تقييم وعلاج حسب التشخيص.\n- **eGFR/risk of KRT**: ==eGFR < 30==، نزول أكتر من 20–30%، أو risk 5 سنين > 3–5% ← ==تحضير للـ kidney replacement therapy==.\n- **Albuminuria and microscopic hematuria**: ACR ≥ 300 مع hematuria، ACR > 700، الـ albuminuria اتضاعفت، أو RBC casts ← تقييم وعلاج.\n- **Others**: ضغط مش بيتظبط على ==≥ 4 أدوية== أو potassium مش مظبوط ← علاج الـ complications.\n\nنفس القايمة اللي فاتت، بس الرسمة بتضيف **الهدف** لكل فرع: الفرع التاني بس هو اللي هدفه الـ dialysis أو الزرع."
        alt: "Redrawn from the book's Figure 44. Diagnosis CKD branches into four referral reasons, each with a goal and criteria. Causes: further evaluation and special management based on diagnosis; when the cause is uncertain, hereditary kidney disease or recurrent extensive nephrolithiasis. eGFR or risk of KRT: planning and preparation for kidney replacement therapy; eGFR below 30, a sustained fall in GFR of more than 20 or 30 percent after hemodynamically active therapies, or a 5-year KRT risk above 3 to 5 percent. Albuminuria and microscopic hematuria: further evaluation and management; significant albuminuria with hematuria, a twofold rise in albuminuria, ACR above 700 mg/g, red cell casts or more than 20 RBC per high power field. Others: provision management of CKD complications; hypertension refractory to 4 or more agents, persistent potassium abnormalities."
      - kind: explain
        page: 62
        quote: "Nephrology Referral"
        title: "ليه كل سبب من دول يستاهل نفرولوجي؟"
        text: |
          التفسير المقبول (مش في الكتاب) لمنطق قايمة الـ referral:

          - **GFR < 30** أو **KFRE ≥ 3–5%**: المريض داخل على مرحلة محتاج فيها تجهيز للغسيل أو الزرع ومتابعة مضاعفات.
          - **نزول سريع** (> 20%، أو > 30% بعد دوا hemodynamic): فيه حاجة نشطة بتحصل دلوقتي، ممكن تتصلح.
          - **ACR ≥ 300 مع hematuria**، أو **RBC casts**، أو **RBC > 20/HPF**: كده الـ ==glomerulus== ملتهب، يعني glomerulonephritis ممكن تحتاج biopsy وعلاج مناعي.
          - **ACR > 700** ثابت: خطر progression عالي جدًا.
          - **ضغط مش بيتظبط على 4 أدوية**: دوّر على سبب secondary زي الـ renal artery stenosis.
          - **سبب مش واضح** أو **hereditary** أو **stones** متكررة: محتاجين تشخيص أو genetic counselling.

          يعني الـ referral مش علشان "الكلية تعبانة" وبس، علشان فيه **قرار** محتاج متخصص.
