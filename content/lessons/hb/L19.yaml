      - kind: reveal
        page: 384
        quote: "expense, and risk of elective surgery are not worth removing an organ that may never cause clinical illness."
        prompt: "ليه أغلب اللي عندهم حصوات صامتة بيختاروا يستنّوا، وأول ما تبدأ الأعراض الكتاب بيقول شيلها؟"
        answer: |
          قبل الأعراض: الصامتة بتصحى بس حوالي 2% في السنة.
          - العيان بيوزن الـ discomfort والـ expense والـ risk بتاعة عملية elective.
          - قصاد ==organ that may never cause clinical illness==.
          - فأغلبهم بيقرروا يستنّوا.

          بعد الأعراض: الحسبة اتقلبت.
          - الـ pain **likely to recur** (20–40% في السنة).
          - و **serious complications can develop**.
          - فالـ cholecystectomy بقت indicated.
      - kind: explain
        page: 384
        quote: "Laparoscopic cholecystectomyis converted to an open procedure in 2 to 5% of patients, usually because biliaryanatomy cannot be identified or"
        title: "Open ولا laparoscopic؟"
        text: |
          **Open cholecystectomy**: آمنة وفعّالة، و overall mortality حوالي 0.1% لما تتعمل elective في فترة مفيهاش مضاعفات.

          ==Laparoscopic cholecystectomy==: هي الـ ==treatment of choice==. بتتعمل بـ video endoscopy من فتحات صغيرة، فمكسبها:
          - convalescence أقصر بكتير
          - وجع أقل بعد العملية
          - شكل أحسن
          - و **no increase in morbidity or mortality**

          **Conversion to open**: في 2–5%. غالبًا لأن الـ **biliary anatomy cannot be identified**، أو فيه complication مش عارفين يتعاملوا معاها بالمنظار.

          **Age**: الـ older age بيزوّد خطر أي عملية، open أو laparoscopic.
