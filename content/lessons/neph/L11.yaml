    goals:
      - "تعرف الإجراءات العامة وليه المحاليل بحذر"
      - "تختار الـ immunosuppression الآمن وتعرف ليه الـ CNI جرعته أعلى"
      - "تعرف علاج الـ preeclampsia الشديدة والـ HELLP والـ AFLP والـ TMA"
    status: unverified
    steps:
      - kind: explain
        page: 363
        title: "العلاج العام"
        quote: "Management of AKI in pregnancy Management of AKI in pregnancy should be done by a multidisciplinary team consisting of nephrologists, obstetricians, and neonatologists. General measures to treat pregnancy-related AKI include identification of the underlying cause of kidney injury, intravenous fluid resuscitation, timely initiation of dialysis if needed, and prompt delivery of fetus, if necessary. Intravenous fluid resuscitation is critical with prerenal causes of AKI but should be performed with caution due to the risk of developing pulmonary edema in women with preeclampsia or endotoxin-mediated injury. The treatment for other complications of kidney injury is similar to non- pregnant patients, for instance, use of alkali therapy for metabolic acidosis, loop diuretics for volume overload, blood transfusion for anemia, and potassium binders for hyperkalemia. Since pregnancy is a state of physiological respiratory alkalosis, arterial or venous blood gas should be used to diagnose metabolic acidosis along with a comprehensive metabolic panel. The specific treatment of AKI depends on the underlying cause of the injury. Treatment for glomerulonephritis includes steroid and immunosuppressive therapy, and risk and benefits should be weighted when therapy is initiated in a pregnant woman.(4)"
        text: |
          فريق: nephrologist و obstetrician و neonatologist.
          - **السبب** الأول.
          - **intravenous (IV) fluids** للـ prerenal، بس ==بحذر== في الـ preeclampsia والـ sepsis (pulmonary edema).
          - **Dialysis** في وقتها.
          - **الولادة** لو لازم: الـ severe preeclampsia و HELLP و acute fatty liver of pregnancy (AFLP) علاجها ولادة، ومعاها **steroids** لو قبل 34 أسبوع.
          - الباقي زي برّه الحمل: alkali، loop diuretics، دم، potassium binders.
      - kind: explain
        page: 363
        title: "ليه المحاليل بحذر؟"
        quote: "Intravenous fluid resuscitation is critical with prerenal causes of AKI but should be performed with caution due to the risk of developing pulmonary edema in women with preeclampsia or endotoxin-mediated injury."
        text: |
          الكتاب بيقول المحاليل ==critical== في الـ prerenal، بس بحذر عشان خطر الـ **pulmonary edema** في الـ **preeclampsia** أو الـ **endotoxin-mediated injury**.

          التفسير المقبول (مش في الكتاب): في الاتنين الـ **endothelium** بايظ، فالأوعية بتسرّب. وكمان الحامل الـ albumin بتاعها أقل (hemodilution)، فالضغط اللي بيمسك المية جوه الأوعية واطي. المحلول اللي بتديه بيخرج على الرئة بسرعة.

          يعني ادّي محاليل، بس بكميات صغيرة وانت بتسمع الصدر.
      - kind: reveal
        page: 363
        quote: "Management of AKI in pregnancy Management of AKI in pregnancy should be done by a multidisciplinary team consisting of nephrologists, obstetricians, and neonatologists. General measures to treat pregnancy-related AKI include identification of the underlying cause of kidney injury, intravenous fluid resuscitation, timely initiation of dialysis if needed, and prompt delivery of fetus, if necessary. Intravenous fluid resuscitation is critical with prerenal causes of AKI but should be performed with caution due to the risk of developing pulmonary edema in women with preeclampsia or endotoxin-mediated injury. The treatment for other complications of kidney injury is similar to non- pregnant patients, for instance, use of alkali therapy for metabolic acidosis, loop diuretics for volume overload, blood transfusion for anemia, and potassium binders for hyperkalemia. Since pregnancy is a state of physiological respiratory alkalosis, arterial or venous blood gas should be used to diagnose metabolic acidosis along with a comprehensive metabolic panel. The specific treatment of AKI depends on the underlying cause of the injury. Treatment for glomerulonephritis includes steroid and immunosuppressive therapy, and risk and benefits should be weighted when therapy is initiated in a pregnant woman.(4)"
        prompt: "ليه مينفعش تعتمد على الـ bicarbonate في الـ chemistry عشان تشخّص metabolic acidosis عند حامل؟"
        answer: "لأن الحمل فيه ==respiratory alkalosis== طبيعية، والكلية بتنزّل الـ bicarbonate تعويض. فالـ HCO3 الواطي ممكن يكون طبيعي. لازم **blood gas**."
      - kind: explain
        page: 363
        title: "ليه الـ tacrolimus محتاج جرعة أعلى في الحمل؟"
        quote: "During pregnancy, higher doses of tacrolimus and cyclosporine are needed to achieve therapeutic targets, and therefore frequent monitoring of drug trough levels should be done."
        text: |
          القواعد من الكتاب:
          - **Mycophenolate:** ممنوع (==teratogenicity==).
          - **Low dose steroids:** ماشي، بس راقب الـ **gestational diabetes**.
          - **Azathioprine** و **CNIs:** مش teratogenic.

          والـ CNIs محتاجة **higher doses** و **frequent trough levels**. التفسير المقبول (مش في الكتاب): حجم الدم أكبر فالدوا بيتخفف، والكبد بيكسّره أسرع في الحمل، والـ albumin الواطي بيغيّر الجزء الحر. فالجرعة القديمة بتطلع level أوطى من المطلوب، ومع تقدم الحمل بيتغير تاني، فلازم تقيس.
      - kind: table
        page: 363
        quote: "Antimetabolites, such as mycophenolate mofetil are contraindicated during pregnancy due to teratogenicity. Low dose steroids may be used during pregnancy but warrant monitoring for the development of gestational diabetes. Azathioprine and calcineurin inhibitors (cyclosporine and tacrolimus) are not teratogenic and commonly used immunosuppressive drugs in pregnancy. During pregnancy, higher doses of tacrolimus and cyclosporine are needed to achieve therapeutic targets, and therefore frequent monitoring of drug trough levels should be done.(26)"
        title: "الـ immunosuppression في الحمل"
