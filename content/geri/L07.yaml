  - id: geri.L07.068
    kind: card
    topic: cognition
    front: Key screening question for cognitive decline in CGA?
    back: Has the person been more forgetful in the last 12 months to the extent it has affected their daily life (phone, shopping lists, money, medication, driving)?
    src: { page: 117, quote: "Has the person been more forgetful in the last 12 months to the extent it has affected their daily life? For example, difficulty using the phone, managing shopping lists, using money, managing their medication, driving, etc." }
    status: unverified
  - id: geri.L07.069
    kind: card
    topic: cognition
    front: How does the rate of cognitive decline separate delirium from dementia?
    back: Rapid decline over days to weeks suggests delirium; decline over months or years suggests dementia.
    src: { page: 117, quote: "The rate of decline is important to distinguish delirium from dementia. Cognitive decline which is rapid and has taken place over days to weeks as opposed to months or years is more likely to represent delirium." }
    status: unverified
