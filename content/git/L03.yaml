    pass: 4
    hook: "الـ narcotic bowel «وجع على أفيون، مش مفسّر، واتنين من 3 (بيزيد مع الجرعة، soar and crash، بيتقدّم)»: chronic pain بيتعالج بـ narcotics، مش مفسّر بـ GI diagnosis، وأكتر من اتنين: بيوحش أو ما بيخفش مع زيادة الجرعة، بيوحش لما الجرعة تخلص ويتحسن لما ترجع، والـ frequency والـ duration والـ intensity بيزيدوا."
    src: { page: 129, quote: "D2. Narcotic bowel syndrome/Opioid-induced GI hyperalgesia\nDiagnostic criteria* - Must include all of the following:\n  1. Chronic or frequently recurring abdominal pain* that is treated with acute high-dose or chronic narcotics\n  2. The nature and intensity of the pain is not explained by a current or previous GI diagnosis**\n  3. Two or more of the following:\n    a. The pain worsens or incompletely resolves with continued or escalating dosages of narcotics\n    b. There is marked worsening of pain when the narcotic dose wanes and improvement when narcotics are re-instituted (soar and crash)\n    c. There is a progression of the frequency, duration, and intensity of pain episodes\n*Pain must occur most days\n**A patient may have a structural diagnosis (e.g., inflammatory bowel disease, chronic pancreatitis), but the character or activity of the disease process is not sufficient to explain the pain" }
