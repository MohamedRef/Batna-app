    hook: "صباع زي السجق من غير طفح، وولد عنده 12 سنة كعبه بيوجعه الصبح: نوعين بيتشخّصوا من حاجات بعيدة عن المفصل."
    minutes: 7
    pages: [202, 203]
    topics: [psoriatic, era]
    goals:
      - "تعرف معايير الـ psoriatic JIA لما الـ rash مش موجود"
      - "تعرف صورة الـ ERA وليه بيتعرف بالـ enthesitis"
    status: unverified
    steps:
      - kind: explain
        page: 202
        quote: "The condition is defined more specifically by the presence of arthritis and the typical psoriatic rash, or any two of the following if the rash is absent:\n  Family history of psoriasis in a first-degree relative.\n  Dactylitis (diffuse swelling of fingers extending beyond the joint margin)."
        title: "Juvenile psoriatic arthritis"
        text: |
          **Asymmetric arthritis** في large و small joints، بيبدأ في **mid childhood**.

          التشخيص: arthritis + psoriatic rash، **أو** لو مفيش rash، **أي اتنين** من:

          - Psoriasis في first-degree relative.
          - ==Dactylitis==: تورم الصباع كله لبعد حدود المفصل (sausage finger).
          - **Nail pitting**.

          وممكن uveitis، و antinuclear antibodies (ANA)+ و HLA-B27+ خصوصًا مع axial disease.

          ليه asymmetric؟ التفسير المقبول (مش في الكتاب): الـ psoriatic بيمسك مفاصل وأوتار متفرقة حسب المكان اللي الالتهاب بدأ فيه، مش بالتماثل اللي بيعمله الـ RA.
