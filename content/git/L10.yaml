    front: Define Barrett esophagus.
    back: Replacement of the esophageal squamous epithelium by metaplastic columnar epithelium with goblet and columnar cells (specialized intestinal metaplasia).
    src: { page: 288, quote: "the squamous epithelium of the esophagus is replaced by metaplastic columnar epithelium containing goblet and columnar cells (specialized intestinal metaplasia)." }
