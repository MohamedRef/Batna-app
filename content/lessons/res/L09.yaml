  - id: res.L09.lesson4
    title: "الـ informed consent: ورقة ولا process؟"
    hook: "إمضاء على ورقة مش consent. الـ consent عملية بتبدأ من أول كلمة وبتفضل لآخر يوم في الدراسة."
    minutes: 6
    pages: [55, 66]
    topics: [consent, rec]
    goals:
      - "ترتّب خطوات الـ consent process وتعرف شروط الورقة"
      - "تعرف مين يقدر يعمل waive للـ consent"
      - "تعرف المسؤولية النهائية على مين"
    status: unverified
    steps:
      - kind: reveal
        page: 55
        quote: "Informed consent is a Document or a Process ??\n  A Document...\n  A process...\n  Both..."
        prompt: "الـ informed consent ورقة ولا process؟"
        answer: |
          **الاتنين.** ورقة مكتوبة بتوثّق، و**process** بتبدأ من أول تواصل مع المشارك وبتكمل طول الدراسة.

          وهو **مش اختياري**: essential حسب الـ guidelines والـ regulations الحالية (slide 56).
      - kind: order
        page: 57
        quote: "The Consent process:\n  Information provided → Information understood → Decision made → Comprehension is monitored and maintained"
        prompt: "رتّب الـ consent process:"
        steps:
          - "Information provided"
          - "Information understood"
          - "Decision made"
          - "Comprehension monitored and maintained"
        why: "تدّي المعلومة ← تتأكد إنه فهمها ← هو يقرر ← وتفضل متابع فهمه طول الدراسة، مش خلاص بعد الإمضاء."
      - kind: figure
        page: 57
        quote: "The Consent process"
        title: "الـ consent: دايرة طول الدراسة، والورقة لحظة"
        alt: "Four boxes in a loop: information provided, information understood, decision made and signed, comprehension monitored, with an arrow from the last back to the first labelled again. Below, a time line from initial contact to end of study labelled the process runs all along; the form is one moment on it that records it."
        caption: |
          فوق: خطوات slide 57 الأربعة، بس مرسومة **دايرة** مش سهم: بعد ما يمضي، الباحث ==يتابع فهمه== ويرجع يشرح لو حاجة اتغيّرت (السهم «again»).

          تحت: خط الدراسة من أول تواصل لآخرها. الـ **process** ماشي على الخط كله (CIOMS)، والـ ==form== نقطة واحدة عليه بتوثّق القرار.

          علشان كده إجابة «ورقة ولا process؟» هي **الاتنين**: الورقة دليل، بس الـ consent نفسه بيعيش طول الدراسة.
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L09c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="10" y="10" width="140" height="48" rx="8" class="fg-box"/>
            <text x="80" y="31" text-anchor="middle" class="t-sm t-b">1. Information</text>
            <text x="80" y="48" text-anchor="middle" class="t-sm">provided</text>
            <rect x="180" y="10" width="140" height="48" rx="8" class="fg-box"/>
            <text x="250" y="31" text-anchor="middle" class="t-sm t-b">2. Information</text>
            <text x="250" y="48" text-anchor="middle" class="t-sm">understood</text>
            <rect x="180" y="104" width="140" height="48" rx="8" class="fg-box"/>
            <text x="250" y="125" text-anchor="middle" class="t-sm t-b">3. Decision</text>
            <text x="250" y="142" text-anchor="middle" class="t-sm">made (and signed)</text>
            <rect x="10" y="104" width="140" height="48" rx="8" class="fg-acc"/>
            <text x="80" y="125" text-anchor="middle" class="t-sm t-b">4. Comprehension</text>
            <text x="80" y="142" text-anchor="middle" class="t-sm">monitored</text>
            <path d="M152 34H176" class="fg-arrow" marker-end="url(#L09c)"/>
            <path d="M250 60V100" class="fg-arrow" marker-end="url(#L09c)"/>
            <path d="M178 128H154" class="fg-arrow" marker-end="url(#L09c)"/>
            <path d="M80 102V62" class="fg-arrow-acc" marker-end="url(#L09c)"/>
            <text x="88" y="86" class="t-sm t-acc">again</text>
            <line x1="10" y1="200" x2="320" y2="200" class="fg-ink"/>
            <circle cx="20" cy="200" r="5" class="fg-dot-acc"/>
            <circle cx="310" cy="200" r="5" class="fg-dot-acc"/>
            <text x="20" y="222" class="t-sm">initial contact</text>
            <text x="310" y="222" text-anchor="end" class="t-sm">end of study</text>
            <text x="165" y="190" text-anchor="middle" class="t-sm t-acc t-b">the process runs all along</text>
            <rect x="120" y="234" width="90" height="30" rx="6" class="fg-thin"/>
            <text x="165" y="254" text-anchor="middle" class="t-sm">the form</text>
            <path d="M165 232V206" class="fg-thin"/>
            <text x="165" y="286" text-anchor="middle" class="t-sm t-mut">one moment that records it</text>
          </svg>
      - kind: explain
        page: 64
        quote: "Informed consent must be documented using a written consent form.\n  Approved by the REC.\n  Signed by the research subject.\n  A copy must be given to the person signing the form."
        title: "مين محتاج consent؟ والورقة شكلها إيه؟"
        text: |
          ==كل الدراسات== لازم consent ياخدوه **قبل** (prospectively) من كل مشارك: كل الأنواع وكل مستويات الـ risk، **إلا لو الـ REC عملت waive** (slide 61).

          والـ consent يتوثّق في **written consent form**:

          - **Approved by the REC**.
          - **Signed** by the research subject.
          - **نسخة** للي مضى.
      - kind: explain
        page: 63
        quote: "Additional elements:\n  Statement that there may be risks which are unforeseeable.\n  Withdrawal criteria.\n  Additional costs to research subject.\n  Consequences of subject's withdrawal from research.\n  Statement that will be told of new findings.\n  Approximate number of subjects in study."
        title: "Additional elements في الورقة"
        text: |
          - إن فيه **risks مش متوقعة**.
          - **Withdrawal criteria**.
          - **تكاليف إضافية** على المشارك.
          - **عواقب الانسحاب**.
          - إنه **هيتقال له أي نتايج جديدة**.
          - **عدد المشاركين التقريبي**.
      - kind: explain
        page: 65
        quote: "CIOMS (2002)\n\"Obtaining informed consent is a process that is begun when initial contact is made with a prospective subject and continues throughout the course of the study. By informing the prospective subjects, by repetition and explanation, by answering their questions as they arise, and by ensuring that each individual understands each procedure, investigators elicit their informed consent and in so doing manifest respect for their dignity and autonomy....\""
        title: "CIOMS والمسؤولية"
        text: |
          الـ ==CIOMS (2002)==: الـ consent **process** بتبدأ من **initial contact** وبتكمل **throughout the course of the study**: بالشرح والتكرار والإجابة على الأسئلة، والتأكد إن كل واحد فاهم كل procedure. وده احترام لكرامته واستقلاله.

          والخلاصة (slide 66): المسؤولية النهائية عن حماية المشاركين على الـ **principal investigator (PI)**، والـ valid consent جزء مهم منها.

          الدكتورة أكدت في الشرح: موافقة اللجنة **ماتنقلش المسؤولية** من الـ PI ليها. اللجنة بتراجع وتراقب، بس الـ PI هو المسؤول يوم بيوم.

          وقالت تشرح للمشارك إيه: الغرض، والإجراءات، والمدة، والـ risks، والـ benefits، والبدائل، والتكاليف أو التعويض لو فيه، والسرية، وإزاي يتواصل معاكم، وحقه يرفض أو ينسحب من غير عقاب. وتاخد الموافقة **قبل** أي إجراء، مش ورق بعدين يغطي بحث بدأ. ونسخة للمشارك ونسخة للفريق.
      - kind: check
        page: 61
        quote: "All studies must have informed consent prospectively obtained from each research subject.\n  All types.\n  Level of risk.\n  Unless Research Ethics committee (REC) waives."
        question: "A low-risk survey wants to skip consent. Who can waive it?"
        options: ["The research ethics committee (REC)", "The principal investigator", "No one, ever"]
        answer: 0
        why:
          - "صح: consent لكل الدراسات إلا لو الـ REC عملت waive."
          - "الـ PI مسؤول عن الحماية، بس مايقررش لوحده يشيل الـ consent."
          - "الـ slide فيها استثناء واحد: الـ REC."
      - kind: explain
        page: 66
        quote: "BOTTOM LINE\nThe ultimate responsibility for protection of the rights and welfare of research subjects rests with the principal investigator.\nObtainment of valid informed consent is an important part of that protection."
        title: "Bottom line: المسؤولية على مين؟"
        text: |
          المسؤولية ==النهائية== عن حماية حقوق المشاركين وسلامتهم على ==الـ principal investigator==.

          والـ ==valid informed consent== جزء مهم من الحماية دي، مش كلها.

          ليه مش على اللجنة؟ لأن اللجنة بتراجع وتتابع من بعيد، لكن الباحث هو اللي مع المشارك كل يوم، فموافقة اللجنة مابتنقلش المسؤولية منه. التفسير المقبول (مش في الكتاب).
      - kind: try
        items: [res.L09.057, res.L09.059, res.L09.117]
    recap:
      - "Consent = ورقة + process: information ← understood ← decision ← monitored."
      - "كل الدراسات محتاجة consent إلا لو الـ REC عملت waive. الورقة: REC approved، ممضية، ونسخة للمشارك."
      - "المسؤولية النهائية على الـ principal investigator، حتى بعد موافقة اللجنة."
    practice: [res.L09.053, res.L09.054, res.L09.055, res.L09.056, res.L09.057, res.L09.058, res.L09.059, res.L09.060, res.L09.117]
