  - id: hb.L14.lesson4
    title: "الحمل والكبد: الزمن هو التشخيص"
    hook: "قولّي هي في أنهي أسبوع، أقولك غالبًا عندها إيه. خمس أمراض على خط زمني واحد."
    minutes: 10
    pages: [266, 269]
    topics: [preg-general, preg-unique]
    goals:
      - "تصنّف أمراض الكبد في الحمل"
      - "تعرف إيه الطبيعي في الحمل وإيه لأ"
      - "ترتّب الـ 5 أمراض الخاصة بالحمل على الخط الزمني"
      - "تفرّق HELLP عن AFLP عن ICP"
    status: unverified
    steps:
      - kind: explain
        page: 266
        title: "التقسيمة"
        text: |
          أمراض الكبد في الحمل نوعين كبار:

          **Unique to pregnancy** (3%):

          - ==Hyperemesis gravidarum==.
          - ==Intrahepatic cholestasis of pregnancy==.
          - ==Acute fatty liver of pregnancy==.
          - **Hypertension-related**: pre-eclampsia/eclampsia، و HELLP، و liver infarction/rupture.

          **Non pregnancy-related**:

          - **Pre-existing**: viral، و cirrhosis و portal hypertension، و post-transplant، و autoimmune.
          - **Coincident**: autoimmune، و viral، و drug-induced، و vascular (Budd-Chiari).

          الأعراض ممكن تبدأ من abdominal pain و nausea و vomiting، وتوصل لـ acute liver failure.
      - kind: explain
        page: 266
        title: "إيه الطبيعي في الحمل؟"
        text: |
          طبيعي في الحمل:

          - **Palmar erythema** و **spider angiomas**: شائعين، ووجودهم مش معناه chronic liver disease. (التفسير المعروف، مش من الكتاب: الـ estrogen العالي في الحمل.)
          - ==ALP==: ممكن يعلى في الـ third trimester، لأن الـ placenta بتعمله.

          مش طبيعي: أي ارتفاع في الـ aminotransferases، أو الـ bilirubin، أو الـ PT/INR. ده لازم يتفحص.

          **Imaging**:

          - ==Ultrasound==: آمن، وهو الـ preferred، خصوصًا لو الشك biliary.
          - **MRI** من غير gadolinium: في الـ second والـ third trimester.
          - **CT**: فيه risk teratogenesis و childhood hematologic malignancies. بس ممكن يتعمل بحذر، بـ protocol إشعاع قليل (2–5 rads).
          - **Liver biopsy**: نادرًا ما بنحتاجها.
      - kind: check
        page: 266
        question: "A woman at 34 weeks has ALP twice the upper limit, with normal ALT, bilirubin and INR. What is the best interpretation?"
