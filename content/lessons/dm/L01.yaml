  - id: dm.L01.lesson7
    title: "أنواع السكر: مين بيخسر الـ insulin ومين بيقاومه"
    hook: "كل أنواع السكر بتتقسم بسؤال واحد: الـ β-cell راحت، تعبت، ولا حد تاني بيعاكسها؟"
    minutes: 8
    pages: [2, 3]
    topics: [classification]
    goals:
      - "تقسّم الـ DM لـ primary و secondary بالأمثلة"
      - "تفرّق absolute من relative insulin deficiency"
      - "تفسّر ليه كل دوا وكل هرمون في القايمة بيعلّي السكر"
    status: unverified
    steps:
      - kind: explain
        remind: [dm.L01.016, dm.L01.017, dm.L01.018]
        page: 2
        title: "الـ Classification"
        quote: "1- Primary Diabetes Mellitus:\n  Type 1 diabetes (due to autoimmune β-cell destruction, leading to absolute insulin deficiency, including LAD A)\n  Type 2 diabetes (due to a non-autoimmune progressive loss of adequate β-cell insulin secretion, frequently classified into:\n    Predominantly insulin resistance (80%, obese)\n    Predominantly insulin secretory defect (20%, non-obese).\n  Gestational Diabetes Mellitus (GDM)."
        text: |
          **1. Primary diabetes mellitus (DM)**
          - **Type 1:** autoimmune β-cell destruction ← ==absolute insulin deficiency==، ومعاه **latent autoimmune diabetes in adults**.
          - **Type 2:** non-autoimmune progressive loss of β-cell secretion، وهو نوعين:
          - **Insulin resistance:** 80%، obese.
          - **Secretory defect:** 20%، non-obese.
          - **Gestational diabetes mellitus (GDM).**

          **2. Secondary DM**
          - **Pancreatic:** pancreatitis، pancreatectomy، neoplasia، hemochromatosis.
          - **Endocrinopathies:** acromegaly، Cushing's، pheochromocytoma، hyperthyroidism.
          - **Drugs:** corticosteroids، thiazides، thyroid hormone، β-agonists.

          الفرق بين type 1 و type 2 في كلمة واحدة: في type 1 الـ β-cells **اتقتلت**، فالـ insulin ==absolute== صفر تقريبًا، وعشان كده العيان بيعيش على الحقن. في type 2 الـ β-cells **موجودة بس تعبانة** (progressive loss)، فالـ insulin موجود بس مش كفاية للـ resistance.
      - kind: figure
        page: 2
        quote: "Types of diabetes mellitus are: 1- Primary Diabetes Mellitus"
        title: "شجرة الأنواع"
        alt: "A tree. Diabetes mellitus splits into primary and secondary. Primary: type 1 (autoimmune, absolute deficiency, includes LADA), type 2 (80 percent obese insulin resistant, 20 percent non-obese secretory defect) and GDM. Secondary: pancreatic diseases, endocrinopathies and drugs."
        caption: "الـ **primary** = العيب في الـ β-cell أو في الـ insulin action نفسه. الـ ==secondary== = حاجة من برا: البنكرياس اتشال أو اتدمر، أو هرمون أو دوا بيعاكس الـ insulin."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L01e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
