        title: "مين وإزاي؟"
        text: |
          - ==Middle-aged men==: حوالي 67% رجالة، ومتوسط السن حوالي 40. ده عكس الـ primary biliary cholangitis (PBC) بالظبط.
          - **Prevalence**: 8.5 لكل 100,000.

          بيظهر insidiously، يعني بالراحة، بأكتر من شكل:

          - Liver function tests (LFTs) مرتفعة من غير أعراض.
          - Pruritus، و fatigue، و jaundice.
          - **Recurrent bacterial cholangitis**.
          - Complications الـ cholestasis.

          Table 8:

          - **Symptoms**: fatigue، و pruritus، و jaundice، و weight loss، و fever، و variceal bleed، و ascites.
          - **Signs**: hepatomegaly، و jaundice، و splenomegaly، و hyperpigmentation، و xanthomas.

          **Histology**: periductal fibrosis، و inflammation، و bile duct proliferation، بالتبادل مع ductal obliteration و ductopenia.

          والعلامة المميزة هي ==onion skin lesion==: duct مسدود ومتلفّف بـ fibrous tissue.
