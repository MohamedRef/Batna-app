    title: "الـ cancer والعلاج"
    hook: "قبل ما تكتب prednisone: بص على عوامل الـ cancer، واعرف إمتى السلّم يطلع درجة."
    minutes: 8
    pages: [168, 168]
    topics: [malignancy, treatment]
    goals:
      - "تعرف مين محتاج cancer screening وليه"
      - "تحفظ سلّم العلاج وسبب كل درجة"
      - "تعرف إيه اللي بيحدد الـ prognosis"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L09.033]
        page: 168
        title: "الـ cancer"
        quote: "Older age\nMale sex\nAnti-TIF1γ positivity\nSevere skin disease\nRapid onset of muscle weakness\n  Screening for malignancy should include appropriate age- and sex-specific cancer screenings (e.g., mammogram, pelvic exam, CT scans, tumor markers)."
        text: |
          الـ ==adult-onset DM== مرتبط بزيادة الـ malignancy.

          **High risk:** older age، **male**، ==anti-TIF1γ==، **severe skin**، **rapid onset** weakness.

          الـ screening حسب السن والنوع: **mammogram**، pelvic exam، **computed tomography (CT)**، tumour markers.
      - kind: reveal
        page: 168
        prompt: "ليه بالذات الراجل الكبير اللي عنده جلد شديد وضعف سريع هو اللي نخاف عليه من الـ cancer؟"
        quote: "Rapid onset of muscle weakness"
        answer: |
          الكتاب بيعد الـ high-risk features: **older age**، **male sex**، **anti-TIF1γ**، **severe skin disease**، و **rapid onset of muscle weakness**.

          التفسير المقبول (مش في الكتاب): الفكرة إن الـ DM هنا ممكن يكون ==paraneoplastic==: الورم بيعمل proteins شبه بروتينات العضلة والجلد، والمناعة اللي بتهاجم الورم **بتهاجمهم هما كمان**.
          - **السن الكبير**: ده سن الأورام أصلًا.
          - **Anti-TIF1γ**: الـ antibody بتاع النوع المرتبط بالـ malignancy في الجدول (ص 167).
          - **جلد شديد وبداية سريعة**: الورم بيكبر بسرعة فالمناعة بتشتغل بقوة وفجأة، مش مرض autoimmune بيزحف على سنين.

          يعني لو العيان عنده الصورة دي، الـ screening مش رفاهية؛ والكتاب بيقول تكون **age- and sex-specific** (mammogram، pelvic exam، CT، tumour markers).
