  - id: endo.L04.lesson11
    title: "الحديد والـ amyloid والخصية في الأمراض المزمنة"
    hook: "راجل عنده 45 سنة، جلده غامق، سكر جديد، والـ libido راح قبل كل ده بسنين. الحديد بيعمل إيه في الغدد؟"
    minutes: 8
    pages: [67, 69]
    topics: [misc, crf-reproductive]
    goals:
      - "تعدّ مضاعفات الـ haemochromatosis والـ cystinosis والـ amyloidosis الهرمونية"
      - "تعرف الإضافات الجديدة على الـ CRF في ص 68-69"
      - "تفرّق بين صورة الخصية في الـ sickle والـ malnutrition والـ febrile illness"
    status: unverified
    steps:
      - kind: explain
        remind: [endo.L04.181, endo.L04.182]
        page: 67
        quote: "1- DM: It occurs in about 65% of pts due to direct damage of the pancreatic islets by iorn deposition. It has a genetic predisposition."
        title: "الـ haemochromatosis والـ cystinosis"
        text: |
          ==Haemochromatosis== (الحديد بيترسب في الأعضاء):
          1. **DM** في **حوالي 65%**، لأن الحديد بيدمّر الـ **pancreatic islets** مباشرة، وفيه genetic predisposition.
          2. **Hypogonadism** في **الجنسين**، و**بيسبق** باقي الأعراض. بيبان كـ loss of libido، impotence، amenorrhoea، testicular atrophy، و PN. يعني ممكن يكون أول علامة خالص، زي الـ hook.
          3. **Addison's**.

          ==Cystinosis==: hypothyroidism، insulin-dependent diabetes mellitus (IDDM)، و delayed puberty. التفسير المقبول (مش في الكتاب): الـ cystine بيترسب كبلورات جوه الخلايا، فالغدد نفسها بتتدمر.
      - kind: check
        page: 67
        quote: "1- DM: It occurs in about 65% of pts due to direct damage of the pancreatic islets by iorn deposition."
        question: "About what fraction of haemochromatosis patients develop diabetes, and why?"
        options: ["About 65%, iron damages the islets", "About 10%, from insulin resistance only", "All of them, from alcohol", "Under 5%, from drugs"]
        answer: 0
        why:
          - "صح: 65%، direct damage of the pancreatic islets by iron."
          - "الرقم والسبب غلط."
          - "مش مذكور."
          - "قليل قوي."
      - kind: explain
        page: 68
        quote: "Amyloid may infilterate the thyroid & other endocrine glands, including ; adrenal, pituitary, pancreas, medullary carcinoma of thyroid but rarely causes endocrine dysfunction."
        title: "الـ amyloid: بيدخل كتير ويبوّظ قليل"
        text: |
          الـ amyloid ممكن **يتسلل** للـ thyroid وغدد تانية: adrenal، pituitary، pancreas، والـ medullary carcinoma of thyroid. بس **نادرًا** بيعمل endocrine dysfunction.

          ليه؟ الكتاب بيقولها في الـ type 2 DM: الـ **pancreatic islet amyloid** بيتعمل من بروتين بتاع الـ B cell نفسها اسمه ==islet amyloid polypeptide==، ومش بيعمل dysfunction واضح **إلا** لو الغدة اتستبدلت بالـ amyloid بشكل كبير (massive replacement). يعني الغدة بتفضل شغالة طول ما فيه نسيج كفاية.
      - kind: explain
        page: 68
        quote: "1- In CRF androgen synthesis & sperm production decrease despite elevated plasma gondotrophins. The elevated LH level is due to production & reduced clearance but does not restore normal testosterone production."
        title: "الـ CRF تاني: الإضافات الجديدة"
        text: |
          الكتاب بيرجع للـ CRF (بعد ما كرر الـ CFS من ص 65)، بس فيه حاجات جديدة:
          1. الـ androgen والـ sperm بيقلوا رغم الـ gonadotrophins العالية. والـ LH عالي **لسببين**: production زيادة و clearance قليل. بس العلو ده **ما بيرجّعش** الـ testosterone، لأن الخصية نفسها مش سامعة (Leydig resistance من ص 49).
          2. الـ hyperprolactinaemia موجودة، بس دورها في تقليل الـ testosterone **مش واضح**.
          3. ==Gynaecomastia== في **حوالي 50%**، من **الاتنين مع بعض**: testosterone واطي و oestrogen عالي. يعني الميزان بين الهرمونين هو اللي بيعمل الثدي، زي الـ cirrhosis.
          4. ==Libido قليل و impotence== في **حوالي 50%**.

          والـ haemodialysis بيحسّن الـ testosterone **بشكل ناقص**، بس الـ transplantation الناجح ممكن يرجّع الخصية طبيعي.
      - kind: check
        page: 68
        quote: "3- Gynecomastia in about 50% of men due to the combined effect of low testosterone & increased estrogen levels"
        question: "Why do about half of men with CRF develop gynaecomastia?"
        options: ["Low testosterone with raised oestrogen", "High prolactin alone", "High LH alone", "Dialysis drugs"]
        answer: 0
        why:
          - "صح: combined effect of low testosterone & increased estrogen."
          - "الكتاب بيقول دور الـ prolactin مش واضح."
          - "الـ LH مش هو السبب."
          - "مش مذكور."
      - kind: explain
        page: 69
        quote: "Impaired sexual development & testicular atrophy are present in about 1/3 of pts. The defect may be at either the testicular or hypothalamic-pituitary level."
        title: "الـ sickle والـ malnutrition والسرطان"
        text: |
          - ==Sickle cell disease==: impaired sexual development و testicular atrophy في **حوالي 1/3**، والعيب ممكن يكون في الخصية **أو** في الـ hypothalamic–pituitary level.
          - ==Malnutrition، advanced Hodgkin's، cancer، amyloidosis==: testosterone واطي و LH عالي. الكتاب بيقول ده «suggesting **combined** hypothalamic–pituitary & testicular defect»، يعني نفس منطق الـ CRF: لو العيب في الخصية بس، كان الـ LH هيعلى أكتر ويعوّض.
          - ==Non-specific illness== (عمليات، MI، حروق): نفس التغيرات.
          - **HIV** و **acute febrile illness**: الكتاب كرر نفس كلام ص 66.
      - kind: explain
        page: 69
        quote: "A) Circulating LH-receptor inhibitor\nRecently, a circulating LH-receptor inhibitor was suggested, which might contribute to Leydig-cell resistance and impaired feedback mechanism.\nB) Decreased urinary LH excretion in uraemia\nIt causes elevation blood levels and LH subtypes. Less acidic an bioactive LH forms might thus contribute to the decrease in testosterone production."
        title: "ليه الـ testosterone واطي؟ تلات أسباب تانية"
        text: |
          الكتاب بيرجع لأسباب الـ low testosterone في الـ uraemia:
          - **A) Circulating LH-receptor inhibitor**: بيعمل **Leydig-cell resistance** (الخصية مش سامعة)، وبيبوّظ الـ feedback.
          - **B) ↓ urinary LH excretion**: الكلية مش بتطلّع الـ LH في البول، فبيعلى في الدم. بس اللي بيتراكم **LH subtypes** «less acidic and bioactive»، يعني أشكال مختلفة من الـ LH، وده ممكن يساهم في قلة الـ testosterone. فالرقم في التحليل عالي، بس مش كله شغال زي الطبيعي.
          - **C) SHBG** بيزيد **+1.2%/سنة** مع السن، فالـ free T يقل أكتر.
      - kind: match
        page: 69
        quote: "Impaired sexual development & testicular atrophy are present in about 1/3 of pts. The defect may be at either the testicular or hypothalamic-pituitary level."
        prompt: "وصّل الرقم بالمرض:"
        pairs:
