        question: "عيان عنده inflammatory back pain و sacroiliitis في الـ MRI. ده يبعّدك عن الـ RA ليه؟"
        options:
          - "الـ RA بيسيب الـ sacroiliac joint"
          - "الـ RA بيصيب الـ lumbar spine بس"
          - "الـ RA مش بيصيب العمود الفقري خالص"
          - "الـ sacroiliitis علامة RA متأخر"
        answer: 0
        why:
          - "صح: الـ spine في الـ RA = upper cervical بس، والـ sacroiliac spared."
          - "الـ lumbar مش هو المكان، الـ upper cervical هو."
          - "لأ، الـ upper cervical بيتصاب (وخطير)."
          - "الـ sacroiliac spared في الـ RA مهما طال."
      - kind: explain
        page: 245
        title: "ACR 1987: سبعة، ولازم أربعة"
        quote: "4 or more criteria must be present for diagnosis."
        text: |
          1. Morning stiffness **1 ساعة** على الأقل
          2. ورم **3 مفاصل** أو أكتر
          3. ورم wrist أو MCP أو PIP
          4. Symmetric swelling
          5. X-ray الإيد: erosions أو decalcification
          6. Rheumatoid nodules
          7. Rheumatoid factor (RF) موجب (بطريقة موجبة في أقل من 5% من الأصحّاء)

          لازم ==4 أو أكتر==، والأعراض **6 أسابيع**.

          يعني criterion واحد لوحده ما يكفيش، لازم الصورة تتجمع.
      - kind: figure
        page: 245
        quote: "Joints that may be affected by rheumatoid arthritis"
        title: "المفاصل اللي الـ RA بيحبها"
        image: { file: rheum/L16-joint-map.webp, book: true }
        alt: "Front and back outlines of a body with pink circles on the joints RA may affect: neck, shoulders, elbows, wrists, hands, knees, ankles and feet, on both sides alike."
        caption: |
          الدواير الوردي على المفاصل اللي ممكن تتصاب:

          - **قدام**: الكتفين، الكوعين، الرسغين والإيدين، الركبتين، الكعبين والقدمين.
          - **ورا**: الرقبة (الـ cervical spine فوق بس).

          لاحظ إن كل دايرة ليها **توأم** في الناحية التانية: ده الـ ==symmetric== polyarthritis. ومفيش دواير على الضهر تحت: الـ sacroiliac **مش** بيتصاب في الـ RA.
      - kind: explain
        page: 245
        title: "كل criterion بيرجع لحاجة فهمناها"
        quote: "Serum RF by a method positive in less than 5% of normal."
        text: |
          الـ 7 criteria مش عشوائية، كل واحد فيهم صدى لحاجة في الـ pathology:

          - **Morning stiffness ساعة**: الـ edema والـ mediators اللي اتجمعوا بالليل (ص 244).
          - **3 مفاصل أو أكتر** و **symmetric**: الـ RA polyarthritis متماثل بالتعريف.
          - **Wrist أو MCP أو PIP**: دي المفاصل المفضّلة عنده.
          - **X-ray: erosions أو decalcification**: أثر الـ pannus والـ PGE2.
          - **Nodules**: نفس الـ fibrinoid necrosis برّه المفصل.
          - **RF بطريقة موجبة في أقل من 5% من الأصحّاء**: يعني اخترنا طريقة ==specific==؛ لو الطريقة بتطلع موجبة في ناس كتير سليمة، الـ criterion هيخسر قيمته.

          والـ 4 من 7 لمدة **6 أسابيع** علشان نستبعد اللي هيخف لوحده.
      - kind: reveal
        page: 245
        quote: "It prevents self limiting or vial arthritis to be labelled as RA."
        prompt: "ليه الـ 6 أسابيع مهمين أوي؟"
        answer: "علشان الـ **viral arthritis** والحاجات الـ **self-limiting** بتخف لوحدها في أسابيع. لو ما استنيتش، هتلزّق تشخيص RA لعيان كان عنده parvovirus. العيب: الـ criteria دي **مش sensitive للـ early RA**."
      - kind: explain
        page: 246
        title: "ليه الـ 2010 بيدّي نقط أكتر للمفاصل الصغيرة والـ serology؟"
        quote: "Patients are definitively diagnosed with RA if they score 6 or more points according to the following criteria"
        text: |
          الكتاب قالك في ص 245 إن الـ 1987 ==مش sensitive للـ early RA==. الـ 2010 اتعمل علشان يمسك العيان **بدري**، قبل الـ erosions والـ nodules (اللي بتيجي متأخر).

          التفسير المقبول (مش في الكتاب) لتوزيع النقط:
          - **المفاصل الصغيرة** بتاخد أكتر من الكبيرة (لحد **5**) لأنها اللي بتفرّق الـ RA عن أمراض تانية بتمسك الركبة أو الكاحل.
          - **الـ serology** (RF أو ACPA) لحد **3** لأنها بتقول "ده RA" قبل ما الـ X-ray يتكلّم، و **high titre** (أكتر من 3 مرات الـ ULN) أوثق من الـ low.
          - **Duration** و **acute phase reactants** نقطة واحدة بس: مهمين، بس مش خاصين بالـ RA.

          فالـ **6 من 10** ممكن تتجمع من المفاصل والـ serology من غير أي X-ray، وده بالظبط الهدف.
