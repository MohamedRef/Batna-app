lecture: res.L03
lessons:
  # ------------------------------------------------------------------
  - id: res.L03.lesson1
    title: "كل بحث بيبدأ بسؤال"
    hook: "قبل الـ sample size والـ SPSS والـ p-value: سؤال واحد واضح هو اللي بيحدد كل حاجة بعده."
    minutes: 8
    pages: [3, 11]
    topics: [process]
    goals:
      - "تعرّف الـ research question وتعرف هو بيعمل إيه في البحث"
      - "ترتّب خطوات الـ research proposal وتعرف السؤال والأهداف مكانهم فين"
      - "تختار الـ study design المناسب من نوع السؤال"
    status: unverified
    steps:
      - kind: explain
        page: 8
        quote: "Creating a good Research question: The first step in any research project is to clearly define the research question"
        title: "أول خطوة، مش أي خطوة"
        text: |
          تخيّل إنك قاعد في عيادة الصدر، وكل يوم يجيلك مريض **chronic obstructive pulmonary disease (COPD)** بيشرب شيشة. في دماغك سؤال: "هي الشيشة دي بتعمل إيه في الرئة بالظبط؟"

          الإحساس ده لسه مش بحث. البحث بيبدأ لما تحوّله لـ ==research question== واضح، وده بالنص **the first step in any research project**.

          من غير سؤال واضح هتلم data كتير ومش هتعرف تعمل بيها إيه.
      - kind: explain
        remind: [res.L03.004]
        page: 5
        quote: "What drives health research? Where do research ideas come from?\n  Curiosity-driven\n  Needs-driven\n  Profit-driven\n  Opportunity-driven"
        title: "الأفكار بتيجي منين؟"
        text: |
          المحاضرة بتقول إن الـ health research بيتحرك بأربع حاجات:

          - **Curiosity-driven:** حاجة شدّت انتباهك وعايز تفهمها.
          - **Needs-driven:** في مشكلة حقيقية محتاجة حل.
          - **Profit-driven:** حد هيكسب من النتيجة، زي شركة دوا.
          - **Opportunity-driven:** جات فرصة: جهاز جديد، grant، أو داتا جاهزة.

          الدكتور قال في الشرح: وجود فرصة تمويل (grant) لوحده مايكفيش. لسه لازم سؤال مهم، و methodology مناسبة، ويكون البحث feasible و ethical.
      - kind: sort
        page: 5
        quote: "What drives health research? Where do research ideas come from?\n  Curiosity-driven\n  Needs-driven\n  Profit-driven\n  Opportunity-driven"
        prompt: "كل فكرة بحث دي جاية منين؟"
        bins: ["Curiosity", "Needs", "Profit", "Opportunity"]
        cards:
          - { text: "You notice odd fatigue after hepatitis C virus (HCV) treatment and want to know why", bin: 0 }
          - { text: "The health directorate needs anaemia rates in Alexandria schools to plan", bin: 1 }
          - { text: "A drug company wants to show its proton pump inhibitor (PPI) beats the rival brand", bin: 2 }
          - { text: "Your department just got a FibroScan, so you build a thesis on it", bin: 3 }
        why: "الفضول = سؤال شدّك. الاحتياج = مشكلة لازم تتحل. الربح = حد هيستفيد ماديًا. الفرصة = الإمكانية ظهرت فجأة. ونفس البحث ممكن يكون وراه أكتر من دافع."
      - kind: explain
        page: 9
        quote: "What is the research question?\n\"A research question is a clear and concise question which expresses: \"what the research project aims to address/answer\" (defines the area of interest)\"\n→ Study Justification/Rationale"
        title: "التعريف اللي هيتسأل فيه"
        text: |
          الـ ==research question== هو **a clear and concise question** بيقول البحث عايز يجاوب على إيه بالظبط.

          - هو اللي بيحدد **the area of interest**.
          - ومنه بيطلع الـ **study justification/rationale**، يعني ليه البحث ده يستاهل يتعمل.
      - kind: figure
        page: 3
        quote: "How will the research proposal be developed?\n| Questions you must ask | Steps you will take | Important elements of each step |\n|---|---|---|\n| What is the problem and why should it be studied? | Selection, analysis and statement of the research problem | problem identification; prioritising problems; analysis; justification |\n| What information is available? | Literature review | literature and other available information |\n| Why do we want to carry out the research? What do we hope to achieve? | Formulation of research objectives | general and specific objectives; hypotheses |\n| What additional data do we need to meet our research objectives? How are we going to collect this information? | Research methodology | variables; types of study; data collection techniques; sampling; plan for data collection; plan for data processing and analysis; ethical considerations; pre-test or pilot study |\n| Who will do what, and when? | Work plan | human resources; timetable |\n| What resources do we need to carry out the study? What resources do we have? | Budget | material support and equipment; money |\n| How will the project be administered? How will utilisation of results be ensured? | Plan for project administration and utilisation of results | administration; monitoring; identification of potential users |\n| How will we present our proposal to relevant authorities, community and the funding agencies? | Proposal summary | briefing sessions and lobbying |"
        title: "خريطة الـ research proposal"
        alt: "A vertical flowchart of eight proposal steps: research problem, literature review, formulation of research objectives (highlighted), research methodology, work plan, budget, plan for administration and utilisation of results, proposal summary. A bracket marks the first step as the research question."
        caption: "الـ research question في أول الخريطة، والـ objectives والـ hypotheses في الخطوة التالتة (اللي متعلّمة). كل اللي تحتهم مبني عليهم."
        svg: |
          <svg viewBox="0 0 330 470" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03r1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="230" height="40" rx="6" class="fg-acc"/>
            <text x="20" y="27" class="t-sm t-b">1. Selection, analysis and</text>
            <text x="20" y="42" class="t-sm t-b">statement of the research problem</text>
            <path d="M248 10h8v40h-8" class="fg-ink"/>
            <text x="262" y="27" class="t-sm t-acc t-b">Research</text>
            <text x="262" y="42" class="t-sm t-acc t-b">question</text>
            <path d="M125 50v14" class="fg-arrow" marker-end="url(#L03r1)"/>
            <rect x="10" y="68" width="230" height="30" rx="6" class="fg-box"/>
