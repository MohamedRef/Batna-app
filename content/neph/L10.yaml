    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 340, quote: "Glycouria, bicabituria, phosphaturia, aminoaciduria, hypokalemia" }
    status: unverified
    tags: [high-yield]
  - id: neph.L10.034
    kind: mcq
    topic: atin-labs
    stem: A patient with acute TIN has hyperkalaemia, sodium wasting and a distal renal tubular acidosis. Which part of the nephron is failing?
    options:
      - Distal tubule
      - Proximal tubule
      - Renal medulla
      - Glomerulus
    answer: 0
    why:
      - "Correct: hyperkalaemia, sodium wasting and dRTA are distal tubular defects (p340)."
      - Proximal defects cause glycosuria, aminoaciduria, phosphaturia, bicarbonaturia and hypokalaemia.
      - Medullary defects cause failure to concentrate the urine.
      - Glomerular disease is not part of this pattern; proteinuria in TIN is modest and tubular.
    src: { page: 340, quote: "Hyperkalemia, Sodium wasting, DRTA. (DT defects)." }
    status: unverified
  - id: neph.L10.035
    kind: card
    topic: atin-labs
    front: How do renal function tests change in acute TIN?
    back: Blood urea and serum creatinine rise suddenly.
    src: { page: 340, quote: "Sudden rise of blood urea and serum creatinine" }
    status: unverified
