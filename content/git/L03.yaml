    topic: dyspepsia
    text: "Postprandial distress syndrome (PDS) symptoms must occur at least {{c1::3 days}} a week; epigastric pain syndrome (EPS) symptoms at least {{c2::1 day}} a week."
    src: { page: 105, quote: "B1b. Epigastric pain syndrome (EPS)\nDiagnostic criteria* - Must include one or both of the following symptoms at least 1 day a week:\n  1. Bothersome epigastric pain (i.e., severe enough to impact on usual activities)\n  2. Bothersome epigastric burning (i.e., severe enough to impact on usual activities)\n  3. No evidence of organic, systemic, or metabolic disease that is likely to explain the symptoms on routine investigations (including at upper endoscopy).\n*Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis\nSupportive criteria\n  1. Pain may be induced by ingestion of a meal, relieved by ingestion of a meal, or may occur while fasting\n  2. Postprandial epigastric bloating, belching, and nausea can also be present\n  3. Persistent vomiting likely suggests another disorder\n  4. Heartburn is not a dyspeptic symptom but may often co-exist\n  5. The pain does not fulfill biliary pain criteria\n  6. Symptoms that are relieved by evacuation of feces or gas generally should not be considered as part of dyspepsia\n  7. Other digestive symptoms (such as from GERD and IBS) may co-exist with EPS" }
    status: unverified
