    back: A collapsed tuft in the center, a clear space between tuft and crescent, and a proliferation of epithelial cells and mononuclear inflammatory cells inside Bowman's capsule.
    src: { page: 216, quote: "Notice the collapsed tuft in the center of the microphotography. There is a clear space between tuft and the crescent." }
    status: unverified
  - id: neph.L08.030
    kind: card
    topic: histology
    front: Define glomerular sclerosis.
    back: Increased collagenous extracellular matrix expanding the mesangium, obliterating capillary lumens, or forming adhesions to Bowman's capsule.
    src: { page: 217, quote: "Increased collagenous extracellular matrix that is expanding the mesangium, obliterating capillary lumens or forming adhesions to Bowman‘s capsule." }
    status: unverified
  - id: neph.L08.031
    kind: card
    topic: histology
    front: Define hyaline.
    back: Glassy acidophilic extracellular material.
    src: { page: 217, quote: "Hyaline: ‑ Glassy acidophilic extracellular material." }
    status: unverified
  - id: neph.L08.032
    kind: card
    topic: histology
    front: Define a membranoproliferative pattern.
    back: Combined capillary wall thickening and mesangial or endocapillary hypercellularity.
    src: { page: 217, quote: "Combined capillary wall thickening and mesangial or endocapillary hypercellularity." }
    status: unverified
    tags: [high-yield]
  - id: neph.L08.033
    kind: card
    topic: histology
    front: Define a lobular (hypersegmented) glomerulus.
    back: Consolidated expansion of segments that are demarcated by intervening urinary space.
    src: { page: 217, quote: "Consolidated expansion of segments that are demarcated by intervening urinary space." }
    status: unverified
  - id: neph.L08.034
    kind: card
    topic: histology
    front: Define mesangiolysis.
    back: Detachment of the paramesangial GBM from the mesangial matrix, or lysis of the mesangial matrix.
    src: { page: 217, quote: "Detachment of the paramesangial GBM from the mesangial matrix or lysis of mesangial matrix." }
    status: unverified
  - id: neph.L08.035
    kind: mcq
    topic: histology
    stem: A biopsy report reads "cellular crescents in 6 of 21 glomeruli, each involving part of the tuft". How should this distribution be described?
    options:
      - Focal and segmental
      - Diffuse and global
      - Focal and global
      - Diffuse and segmental
      - Lobular
    answer: 0
    why:
      - Correct. 6/21 is under 50% of glomeruli (focal) and part of each tuft is involved (segmental).
      - Diffuse needs 50% or more of glomeruli; global needs the whole tuft.
      - Focal is right, but the lesions involve only part of each tuft, so not global.
      - Fewer than half of the glomeruli are involved, so it is not diffuse.
      - Lobular means consolidated segments separated by urinary space, a different pattern.
    src: { page: 212, quote: "Focal Involving <50% of glomeruli. Diffuse Involving 50% or more of glomeruli." }
    status: unverified
  - id: neph.L08.036
    kind: mcq
    topic: histology
    stem: In a glomerulus, Bowman's space is filled by several layers of parietal epithelial cells and macrophages compressing the tuft. Which term describes this?
    options:
      - Crescent (extracapillary hypercellularity)
      - Endocapillary hypercellularity
      - Mesangial hypercellularity
      - Mesangiolysis
      - Hyalinosis
    answer: 0
    why:
      - Correct. More than one layer of epithelial cells or macrophages in Bowman's space is extracapillary hypercellularity, a crescent.
      - Endocapillary cells sit inside the GBM, within the capillary loops.
      - Mesangial hypercellularity is 4 or more nuclei in a mesangial segment.
      - Mesangiolysis is detachment or lysis of mesangial matrix.
      - Hyaline is glassy acidophilic extracellular material, not cells.
    src: { page: 215, quote: "Increased cellularity in Bowman‘s space, i.e. > one layer of parietal or visceral epithelial cells, or monocytes/macrophages." }
    status: unverified
