      - kind: aside
        tone: exam
        page: 331
        quote: "Clinical significance of anti-HLA donor-specific antibodies: renal transplant recipients with positive flowcytometry cross-match but negative CDC cross-match have a significantly greater risk of antibody-mediated rejection (AMR) and early graft loss with a positive predictive value for predicting AMR of 83%. transplantation 2009; 87 (7): 1052. J Am Soc Nephrol 2001; 12 (12): 2807."
        text: |
          **Flow cross-match موجب + CDC سالب** = خطر ==antibody-mediated rejection (AMR)== و early graft loss أعلى بكتير، بـ positive predictive value (PPV) 83%. يعني الـ CDC السالب لوحده مش ضمان.
      - kind: explain
        page: 331
        title: "الـ immunosuppression"
        quote: "Sparing cyclosporine and tacrolimus nephrotoxicisty."
        text: |
          3 مراحل: **induction**، **maintenance**، و **anti-rejection**.

          **ليه induction؟** rejection prophylaxis، علاج subclinical rejection أو rejection مستخبي ورا الـ early graft dysfunction، ==تقليل الـ calcineurin inhibitor (CNI) nephrotoxicity==، و tolerance.

          **Kidney Disease: Improving Global Outcomes (KDIGO) 2011**: ==IL-2RA== (basiliximab) first-line (1B)؛ **lymphocyte-depleting** (ATG) لو high immunologic risk (2B).

          **البروتوكول**: CNI (ciclosporin، tacrolimus) + steroids + adjuvant (azathioprine، mycophenolate mofetil (MMF)، sirolimus) + induction antibody + calcium channel blocker (CCB) + prophylaxis (TMP-SMX، cytomegalovirus (CMV) antivirals). والـ **mechanistic target of rapamycin (mTOR) inhibitor (mTORi)** ما يبدأش إلا بعد ما الكلية تشتغل والجرح يلم (1B).
      - kind: order
        page: 334
        quote: "Treatment of acute rejection KDIGO 2011:\n6.1: We recommend biopsy before treating acute rejection,unless the biopsy will substantially delay treatment.(1C)\n6.2: We suggest treating subclinical and borderline acute rejection. (2D)\n6.3: We recommend corticosteroids for the initial treatment of acute cellular rejection. (1D)\n6.3.1: We suggest adding or restoring maintenance prednisone in patients not on steroids who have a rejection episode.(2D)\n6.3.2: We suggest using lymphocyte-depleting antibodies or OKT3 for acute cellular rejections that do not respond to corticosteroids and for recurrent acute cellular rejections (2C).\n6.4: We suggest treating antibody-mediated acute rejection with one or more of the following alternatives, with or without corticosteroids (2C):\n  Plasma exchange;\n  Intravenous immunoglobulin;\n  Anti-CD20 antibody;\n  Lymphocyte-depleting antibody."
        prompt: "Acute cellular rejection (KDIGO 2011). رتّب:"
        steps:
          - "Biopsy (unless it delays treatment)"
          - "Corticosteroids"
          - "Add back maintenance prednisone if off steroids"
          - "Lymphocyte-depleting antibody if steroid-resistant"
        why: "Biopsy الأول (1C)، steroids (1D)، رجّع الـ prednisone لو مش واخده (2D)، ولو مقاوم أو متكرر: lymphocyte-depleting أو OKT3 (2C). والـ AMR: plasma exchange، intravenous immunoglobulin، anti-CD20، أو lymphocyte-depleting."
      - kind: explain
