schema: batna.content/v1
lecture: git.L11
title: Gastrointestinal Bleeding
author: Prof. Abeer Ibrahim
book: { chapter: 2, pages: [299, 312] }
topics:
  - { id: overview, title: "Burden, types and clinical presentation" }
  - { id: causes, title: "Causes of upper GI bleeding" }
  - { id: risk, title: "Risk stratification and the Glasgow-Blatchford score" }
  - { id: resuscitation, title: "Resuscitation, fluids and transfusion" }
  - { id: antithrombotics, title: "Antiplatelets and anticoagulants in UGIB" }
  - { id: drugs, title: "PPI, vasoactive drugs and prokinetics" }
  - { id: endoscopy, title: "Endoscopic and post-endoscopic management" }
  - { id: variceal, title: "Variceal bleeding: risk, screening and management" }
items:
  # ---------- p299-300: overview ----------
  - id: git.L11.001
    kind: cloze
    topic: overview
    text: Acute GI bleeding causes {{c1::250,000-300,000}} hospitalizations a year, with a mortality of about {{c2::6-8%}}.
    src: { page: 299, quote: "Acute gastrointestinal bleeding is one of the most common medical emergencies with 250,000 to 300,000 hospitalizations annually." }
    status: unverified
    tags: [numbers]
  - id: git.L11.002
    kind: card
    topic: overview
    front: Who has the highest risk of dying from GI bleeding?
    back: Patients of advanced age or with severe comorbidities.
    src: { page: 299, quote: "The risk of mortality is highest in patients of advanced age or those with severe co morbidities." }
    status: unverified
  - id: git.L11.003
    kind: card
    topic: overview
    front: What landmark separates upper from lower GI bleeding?
    back: The ligament of Treitz. Upper GI bleeding comes from a source proximal to it.
    src: { page: 299, quote: "Upper GI bleeding (UGIB) is defined as bleeding derived from a source proximal to the ligament of Treitz." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.004
    kind: cloze
    topic: overview
    text: Upper GI bleeding is about {{c1::4}} times more common than lower GI bleeding.
    src: { page: 299, quote: "Bleeding from the upper GI tract is approximately 4 times more common than bleeding from the lower GI tract." }
    status: unverified
    tags: [numbers]
  - id: git.L11.005
    kind: card
    topic: overview
    front: How is GI bleeding classified by severity (course)?
    back: Acute, chronic, intermittent, or occult.
    src: { page: 299, quote: "Acute-chronic-intermittent- occult" }
    status: unverified
  - id: git.L11.006
    kind: card
    topic: overview
    front: How is UGIB divided by source?
    back: Non-variceal and variceal.
    src: { page: 300, quote: "UGIB can be divided according to its source into non variceal and variceal." }
    status: unverified
  - id: git.L11.007
    kind: card
    topic: overview
    front: What does hematemesis with blood clots indicate?
    back: The most severe form; a rapid rate of bleeding that does not allow the clots to dissolve.
    src: { page: 300, quote: "The most severe form presents with hematemesis with blood clots represent rapid rate of bleeding" }
    status: unverified
  - id: git.L11.008
    kind: card
    topic: overview
    front: What does hematochezia mean when the source is in the upper GI tract?
    back: Rapid, huge blood loss, about 1 liter.
    src: { page: 300, quote: "Hematochezia (fresh bleeding per rectum) if associated with upper GI bleeding presents rapid and huge blood loss (about 1 liter)." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.009
    kind: card
    topic: overview
    front: Describe melena and what it usually indicates.
    back: Dark, tarry, offensive black stool from slow upper GI bleeding; it may follow hematemesis or even gum bleeding for a few days. It is rarely from very slow lower GI bleeding.
    src: { page: 300, quote: "Melena is dark tarry blackish stool with offensive odor presents slow upper GIT bleeding" }
    status: unverified
  - id: git.L11.010
    kind: cloze
    topic: overview
    text: Melena can develop after as little as {{c1::50-100 mL}} of upper GI blood loss.
    src: { page: 300, quote: "Melena develops after as little as 50–100 mL of blood loss in the upper gastrointestinal tract." }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L11.011
    kind: mcq
    topic: overview
    stem: A 60-year-old on aspirin passes large volumes of fresh red blood per rectum, and his BP is 85/50 mmHg. Nasogastric aspirate shows red blood. What does the lecture say about hematochezia from an upper source?
    options: ["It means rapid, huge blood loss of about 1 liter", It means slow bleeding of 50-100 mL, It rules out an upper source, It is the usual picture of a Mallory-Weiss tear, It means bleeding has stopped]
    answer: 0
    why:
      - Hematochezia with an upper source presents rapid and huge loss (about 1 liter).
      - 50-100 mL is the volume that can cause melena.
      - The red aspirate confirms an upper source; hematochezia does not exclude it.
      - The lecture does not tie hematochezia to Mallory-Weiss tears.
      - Fresh blood and hypotension mean active, rapid bleeding.
    src: { page: 300, quote: "Hematochezia (fresh bleeding per rectum) if associated with upper GI bleeding presents rapid and huge blood loss (about 1 liter)." }
    status: unverified
  # ---------- p300-301 + table p308: causes ----------
  - id: git.L11.012
    kind: cloze
    topic: causes
    text: Peptic ulcers cause {{c1::40%}} of major upper GI bleeding, with an overall mortality below {{c2::5%}}.
    src: { page: 300, quote: "Peptic ulcers account for 40% of major upper gastrointestinal bleeding with an overall mortality rate of less than 5%." }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L11.013
    kind: card
    topic: causes
    front: Why is bleeding from peptic ulcers declining?
    back: H. pylori eradication and PPI prophylaxis in high-risk patients.
    src: { page: 300, quote: "The incidence of bleeding from ulcers is declining due to eradication of H pylori and prophylaxis with proton pump inhibitors in high-risk patients." }
    status: unverified
  - id: git.L11.014
    kind: cloze
    topic: causes
    text: Portal hypertension causes {{c1::10-20%}} of upper GI bleeding, mostly from {{c2::esophageal varices}}.
    src: { page: 300, quote: "Portal hypertension accounts for 10–20% of upper gastrointestinal bleeding." }
    status: unverified
    tags: [numbers]
  - id: git.L11.015
    kind: card
    topic: causes
    front: Apart from esophageal varices, what portal hypertensive lesions bleed?
    back: Gastric or duodenal varices, and portal hypertensive gastropathy (less common).
    src: { page: 300, quote: "Bleeding usually arises from esophageal varices and less commonly gastric or duodenal varices or portal hypertensive gastropathy." }
    status: unverified
  - id: git.L11.016
    kind: cloze
    topic: causes
    text: Vascular anomalies cause {{c1::7%}} of acute upper GI bleeding; the most common are {{c2::angioectasias (angiodysplasias)}}.
    src: { page: 300, quote: "They account for 7% of cases of acute upper tract bleeding. The most common are Angio ectasias (angiodysplasias)" }
    status: unverified
    tags: [numbers]
  - id: git.L11.017
    kind: card
    topic: causes
    front: What are angioectasias, and where are they most common?
    back: Distorted, aberrant submucosal vessels of 1-10 mm from chronic intermittent obstruction of submucosal veins; bright red and stellate; most common in the right colon.
    src: { page: 301, quote: "They have a bright red stellate appearance and occur throughout the gastrointestinal tract but most commonly in the right colon." }
    status: unverified
  - id: git.L11.018
    kind: card
    topic: causes
    front: What are telangiectasias, and with which systemic conditions do they occur?
    back: Small cherry-red lesions from dilated venules; part of hereditary hemorrhagic telangiectasia or CREST syndrome, or sporadic.
    src: { page: 301, quote: "Telangiectasias are small, cherry red lesions caused by dilation of venules that may be part of systemic conditions" }
    status: unverified
  - id: git.L11.019
    kind: card
    topic: causes
    front: What is a Dieulafoy lesion?
    back: An aberrant, large-caliber submucosal artery, most commonly in the proximal stomach, that causes recurrent, intermittent bleeding.
    src: { page: 301, quote: "The Dieulafoy lesion is an aberrant, large-caliber submucosal artery, most commonly in the proximal stomach that causes recurrent, intermittent bleeding." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.020
    kind: cloze
    topic: causes
    text: Gastric neoplasms cause {{c1::1%}} of upper GI hemorrhages; erosive gastritis causes less than {{c2::5%}} of severe bleeds because it is {{c3::superficial}}.
    src: { page: 301, quote: "Gastric neoplasms result in 1% of upper gastrointestinal hemorrhages. Erosive gastritis is superficial" }
    status: unverified
    tags: [numbers]
  - id: git.L11.021
    kind: card
    topic: causes
    front: Three causes of gastric mucosal erosions?
    back: NSAIDs, alcohol, and severe medical or surgical illness (stress-related mucosal disease).
    src: { page: 301, quote: "Gastric mucosal erosions are due to NSAIDs, alcohol, or severe medical or surgical illness (stress-related mucosal disease)." }
    status: unverified
  - id: git.L11.022
    kind: card
    topic: causes
    front: When may erosive esophagitis cause significant upper GI bleeding?
    back: Rarely, when severe from chronic GERD, especially in long-term bedbound patients.
    src: { page: 301, quote: "Severe erosive esophagitis due to chronic gastroesophageal reflux may rarely cause significant upper gastrointestinal bleeding, especially in patients who are bedbound long-term." }
    status: unverified
  - id: git.L11.023
    kind: cloze
    topic: causes
    text: An aortoenteric fistula complicates {{c1::2%}} of abdominal aortic grafts, or rarely presents a previously untreated {{c2::aneurysm}}.
    src: { page: 301, quote: "An aortoenteric fistula complicates 2% of abdominal aortic grafts or, rarely, can occur as the initial presentation of a previously untreated aneurysm." }
    status: unverified
  - id: git.L11.024
    kind: card
    topic: causes
    front: "Hemobilia and hemosuccus pancreaticus: what are they and their causes?"
    back: "Unusual causes of UGIB. Hemobilia: bleeding into the biliary tree from hepatic tumor, angioma or penetrating trauma. Hemosuccus pancreaticus: from pancreatic malignancy or pseudoaneurysm."
    src: { page: 301, quote: "Unusual causes of upper gastrointestinal bleeding include hemobilia (from hepatic tumor, angioma, penetrating trauma), and pancreatic malignancy and pseudoaneurysm" }
    status: unverified
  - id: git.L11.025
    kind: table
    topic: causes
    title: Etiologies of non-variceal upper GI bleeding (Table 1)
    columns: [Group, Causes]
    rows:
      - [Ulcer / inflammation, "Peptic ulcer; erosive esophagitis, gastritis or duodenitis; anastomotic ulcers (post gastric bypass)"]
      - [Vascular lesions, "GAVE; Dieulafoy lesion; angiodysplasia / AVM; aorto-enteric fistula"]
      - [Congestive gastropathy, Portal hypertensive gastropathy]
      - [Malignant lesions, "GIST; non-GIST (lipoma, schwannoma); gastric and esophageal cancer; metastases"]
      - [Post procedural, "Endoscopic mucosal and submucosal dissection; post sphincterotomy"]
      - [Others, "Mallory-Weiss tear; Cameron ulcers"]
    blanks: [[1, 1], [2, 1], [4, 1], [5, 1]]
    src: { page: 308, quote: "Etiologies of non-variceal upper gastrointestinal bleeding" }
    status: unverified
    tags: [high-yield]
  - id: git.L11.026
    kind: mcq
    topic: causes
    stem: A 55-year-old has three episodes of large painless hematemesis over a month; two endoscopies were normal. On the third, a single pulsating vessel is seen in normal mucosa of the proximal stomach. Diagnosis?
    options: [Dieulafoy lesion, Angioectasia, Mallory-Weiss tear, Portal hypertensive gastropathy, Cameron ulcer]
    answer: 0
    why:
      - An aberrant large submucosal artery in the proximal stomach with recurrent intermittent bleeding is a Dieulafoy lesion.
      - Angioectasias are 1-10 mm bright red stellate lesions, most common in the right colon.
      - A Mallory-Weiss tear is a mucosal tear, usually after retching.
      - PHG occurs with portal hypertension and gives mosaic congested mucosa.
      - Cameron ulcers sit in a hiatal hernia.
    src: { page: 301, quote: "The Dieulafoy lesion is an aberrant, large-caliber submucosal artery, most commonly in the proximal stomach that causes recurrent, intermittent bleeding." }
    status: unverified
  - id: git.L11.027
    kind: mcq
    topic: causes
    stem: A 68-year-old with an abdominal aortic graft placed 3 years ago has a small "herald" hematemesis followed by massive bleeding. Which cause should be suspected?
    options: [Aortoenteric fistula, Erosive gastritis, Gastric cancer, Hemobilia, Telangiectasia]
    answer: 0
    why:
      - An aortoenteric fistula complicates 2% of abdominal aortic grafts.
      - Erosive gastritis is superficial and rarely causes severe bleeding.
      - Gastric neoplasms cause only 1% and are not tied to grafts.
      - Hemobilia follows hepatic tumor, angioma or trauma.
      - Telangiectasias give small cherry-red lesions with chronic loss.
    src: { page: 301, quote: "An aortoenteric fistula complicates 2% of abdominal aortic grafts" }
    status: unverified
  - id: git.L11.028
    kind: mcq
    topic: causes
    stem: Which is the most common cause of major upper GI bleeding according to the lecture?
    options: [Peptic ulcer (40%), Portal hypertension (10-20%), Vascular anomalies (7%), Erosive gastritis (<5%), Gastric neoplasms (1%)]
    answer: 0
    why:
      - Peptic ulcers account for 40% of major UGIB.
      - Portal hypertension accounts for 10-20%.
      - Vascular anomalies account for 7%.
      - Erosive gastritis causes under 5% of severe bleeds.
      - Gastric neoplasms cause 1%.
    src: { page: 300, quote: "Peptic ulcers account for 40% of major upper gastrointestinal bleeding with an overall mortality rate of less than 5%." }
    status: unverified
  # ---------- p301-302 + table p309: risk stratification ----------
  - id: git.L11.029
    kind: enumerate
    topic: risk
    prompt: Enumerate the questions the lecture asks in every case of GI bleeding.
    points:
      - How to stratify by severity
      - What initial assessment fits the severity and type
      - When the patient can be discharged and followed as an outpatient
      - What the indications for admission are
      - Where to admit (ward or ICU)
    pass: 4
    src: { page: 301, quote: "When the patient with acute bleeding can be discharged and followed up as an outpatient?" }
    status: unverified
  - id: git.L11.030
    kind: card
    topic: risk
    front: Which score is recommended for pre-endoscopy risk stratification in UGIB?
    back: The Glasgow-Blatchford score (GBS).
    src: { page: 302, quote: "The use of the Glasgow– Blatchford Score (GBS) (Table 2) is highly recommended for preendoscopy risk stratification." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.031
    kind: cloze
    topic: risk
    text: Patients with a GBS of {{c1::≤ 1}} are at very low risk and can be managed as {{c2::outpatients with outpatient endoscopy}}.
    src: { page: 302, quote: "Patients with GBS ≤ 1 are at very low risk of rebleeding, mortality within 30 days, or needing hospital-based intervention" }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L11.032
    kind: card
    topic: risk
    front: What does the GBS predict best?
    back: The need for hospital-based intervention (RBC transfusion, endoscopic treatment, arterial embolization, surgery) or death; it has the highest accuracy for this.
    src: { page: 302, quote: "The GBS was reported to have the highest accuracy for predicting need for hospital-based intervention" }
    status: unverified
  - id: git.L11.033
    kind: enumerate
    topic: risk
    prompt: Enumerate the indications for ICU admission in acute upper GI bleeding.
    points:
      - Active bleeding (hematemesis or bright red blood on NG aspirate)
      - Shock
      - Persistent hemodynamic derangement despite fluid resuscitation
      - Serious comorbid medical illness
      - Evidence of advanced liver disease
    pass: 4
    src: { page: 302, quote: "shock, persistent hemodynamic derangement despite fluid resuscitation, serious comorbid medical illness, or evidence of advanced liver disease require admission to an ICU." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.034
    kind: table
    topic: risk
    title: Glasgow-Blatchford score (Table 2)
    columns: [Risk factor at admission, Range, Points]
    rows:
      - ["BUN (mg/dL)", "18.2 to <22.4", "2"]
      - ["BUN (mg/dL)", "22.4 to <28.0", "3"]
      - ["BUN (mg/dL)", "28.0 to <70.0", "4"]
      - ["BUN (mg/dL)", "≥70.0", "6"]
      - ["Hemoglobin (g/dL)", "12.0 to <13.0 (men); 10.0 to <12.0 (women)", "1"]
      - ["Hemoglobin (g/dL)", "10.0 to <12.0 (men)", "3"]
      - ["Hemoglobin (g/dL)", "<10.0", "6"]
      - ["Systolic BP (mmHg)", "100-109", "1"]
      - ["Systolic BP (mmHg)", "90-99", "2"]
      - ["Systolic BP (mmHg)", "<90", "3"]
      - ["Heart rate", "≥100/min", "1"]
      - [Melena, present, "1"]
      - [Syncope, present, "2"]
      - [Hepatic disease, present, "2"]
      - [Cardiac failure, present, "2"]
    blanks: [[3, 2], [6, 2], [9, 2], [11, 2], [12, 2], [13, 2], [14, 2]]
    src: { page: 309, quote: "Table 2: Glasgow-Blatchford score" }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L11.035
    kind: cloze
    topic: risk
    text: In the Glasgow-Blatchford score, a hemoglobin below {{c1::10}} g/dL or a BUN of {{c2::70}} mg/dL or more each scores {{c3::6}} points.
    src: { page: 309, quote: "Table 2: Glasgow-Blatchford score" }
    status: unverified
    tags: [numbers]
  - id: git.L11.036
    kind: cloze
    topic: risk
    text: "In the GBS, melena scores {{c1::1}}, while syncope, hepatic disease and cardiac failure each score {{c2::2}}."
    src: { page: 309, quote: "Table 2: Glasgow-Blatchford score" }
    status: unverified
    tags: [numbers]
  - id: git.L11.037
    kind: mcq
    topic: risk
    stem: "A 30-year-old man had one black stool. HR 88/min, SBP 125 mmHg, Hb 13.8 g/dL, BUN 15 mg/dL, no syncope, no liver or heart disease. What is his GBS and the best plan?"
    options: [GBS 1; discharge with outpatient endoscopy, GBS 0; no endoscopy needed, GBS 3; admit to the ward, GBS 6; ICU admission, GBS 1; urgent endoscopy within 12 hours]
    answer: 0
    why:
      - Only melena scores (1 point); GBS ≤1 is very low risk and suits outpatient management with outpatient endoscopy.
      - Melena scores 1, so the GBS is not 0; and he still needs outpatient endoscopy.
      - None of BUN, Hb, SBP or HR score here.
      - He has no ICU criteria.
      - Endoscopy within 12 hours is for active bleeding after resuscitation or suspected varices.
    src: { page: 302, quote: "Patients with GBS ≤ 1 are at very low risk of rebleeding, mortality within 30 days, or needing hospital-based intervention" }
    status: unverified
  - id: git.L11.038
    kind: mcq
    topic: risk
    stem: "A 64-year-old man with melena: HR 108/min, SBP 96 mmHg, Hb 11 g/dL, BUN 30 mg/dL, no syncope, known heart failure. What is his Glasgow-Blatchford score?"
    options: ["13", "11", "15", "9"]
    answer: 0
    why:
      - "BUN 30 = 4, Hb 11 in a man = 3, SBP 96 = 2, HR 108 = 1, melena = 1, cardiac failure = 2: total 13."
      - "11 leaves out the 2 points for cardiac failure."
      - "15 scores BUN 30 as 6 points; 6 needs a BUN of 70 or more."
      - "9 scores his Hb as 1 (the women's band) and leaves out cardiac failure."
    src: { page: 309, quote: "Table 2: Glasgow-Blatchford score" }
    status: unverified
  # ---------- p302-303: resuscitation ----------
  - id: git.L11.039
    kind: card
    topic: resuscitation
    front: What does early intensive hemodynamic resuscitation achieve in acute UGIH?
    back: It significantly decreases mortality, corrects hypovolemia, restores tissue perfusion and prevents multiorgan failure.
    src: { page: 302, quote: "Early intensive hemodynamic resuscitation of patients with acute UGIH has been shown to significantly decrease mortality" }
    status: unverified
  - id: git.L11.040
    kind: card
    topic: resuscitation
    front: Which fluids does the lecture recommend for resuscitation in UGIH?
    back: Crystalloids, either 0.9% saline or balanced crystalloids such as Ringer's lactate (which reduced mortality and major adverse renal events in critically ill patients).
    src: { page: 302, quote: "either saline 0.9% sodium chloride or balanced crystalloids" }
    status: unverified
  - id: git.L11.041
    kind: card
    topic: resuscitation
    front: Is a nasogastric tube routine in UGIB, and what does its aspirate tell you?
    back: Not routine; it may help triage selected patients with suspected active upper bleeding. Red blood or coffee grounds confirm an upper GI source.
    src: { page: 302, quote: "Placement of a nasogastric tube is not routinely recommended." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.042
    kind: card
    topic: resuscitation
    front: Which transfusion strategy is standard of care in non-massive acute UGIH?
    back: A restrictive RBC transfusion strategy, in both variceal and non-variceal bleeding; it is associated with lower in-hospital mortality.
    src: { page: 303, quote: "A restrictive red blood cell (RBC) transfusion strategy is considered standard of care in non- massive, acute UGIH both in variceal or nonvariceal." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.043
    kind: cloze
    topic: resuscitation
    text: Transfuse packed RBCs if Hb is below {{c1::7}} g/dL, targeting {{c2::7-9}} g/dL; with cardiovascular disease start below {{c3::8}} g/dL, targeting above 10 g/dL.
    src: { page: 303, quote: "in patients with cardiovascular diseases transfusion should start if Hg <8 gm targeting > 10 gm." }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L11.044
    kind: mcq
    topic: resuscitation
    stem: "A 70-year-old with stable angina has a bleeding duodenal ulcer. He is no longer actively bleeding; Hb is 7.6 g/dL. Per the lecture, what about transfusion?"
    options: [Transfuse because with cardiovascular disease the threshold is Hb <8 g/dL, No transfusion until Hb is below 7 g/dL, Transfuse only if Hb falls below 6 g/dL, Transfuse to a target above 13 g/dL, Give FFP instead of RBCs]
    answer: 0
    why:
      - With cardiovascular disease transfusion starts at Hb <8 g/dL (target >10).
      - The <7 g/dL threshold is for patients without cardiovascular disease.
      - 6 g/dL is not a threshold in the lecture.
      - The lecture's targets are 7-9 (or >10 with CVD), not 13.
      - FFP does not replace red cells.
    src: { page: 303, quote: "in patients with cardiovascular diseases transfusion should start if Hg <8 gm targeting > 10 gm." }
    status: unverified
  # ---------- p303-304: antithrombotics ----------
  - id: git.L11.045
    kind: card
    topic: antithrombotics
    front: "Low-dose aspirin for PRIMARY prophylaxis in a patient with acute UGIH: what to do?"
    back: Interrupt it temporarily, then restart only after careful re-evaluation of the indication.
    src: { page: 303, quote: "who are taking low dose aspirin as monotherapy for primary cardiovascular prophylaxis, aspirin should be temporarily interrupted." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.046
    kind: card
    topic: antithrombotics
    front: "Low-dose aspirin for SECONDARY prophylaxis in acute UGIH: what to do?"
    back: Do not interrupt it. If it is interrupted for any reason, restart as soon as possible, preferably within 3-5 days.
    src: { page: 303, quote: "If for any reason it is interrupted, aspirin should be restarted as soon as possible, preferably within 3–5 days." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.047
    kind: card
    topic: antithrombotics
    front: "Dual antiplatelet therapy (secondary prophylaxis) in acute UGIH: what to do?"
    back: Continue aspirin. Interrupt the second antiplatelet agent and restart it as soon as possible, preferably within 5 days.
    src: { page: 303, quote: "The second antiplatelet agent should be interrupted, but restarted as soon as possible, preferably within 5 days." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.048
    kind: card
    topic: antithrombotics
    front: "VKA (warfarin) in acute UGIH with hemodynamic instability: what to give?"
    back: Withhold the VKA and give low-dose vitamin K plus IV prothrombin complex concentrate (PCC), or FFP if PCC is not available.
    src: { page: 303, quote: "low dose vitamin K supplemented with intravenous prothrombin complex concentrate (PCC), or fresh frozen plasma (FFP) if PCC is not" }
    status: unverified
    tags: [high-yield]
  - id: git.L11.049
    kind: card
    topic: antithrombotics
    front: "DOAC in acute UGIH: what to do?"
    back: Withhold the DOAC and do not delay endoscopy. In severe ongoing bleeding consider a DOAC reversal agent or IV PCC.
    src: { page: 304, quote: "the anticoagulant should be withheld and endoscopy not delayed." }
    status: unverified
  - id: git.L11.050
    kind: cloze
    topic: antithrombotics
    text: Resume anticoagulation once bleeding is controlled, preferably within or soon after {{c1::7 days}}, based on {{c2::thromboembolic risk}}; remember the {{c3::rapid onset}} of DOACs compared with VKAs.
    src: { page: 304, quote: "Anticoagulation should be resumed as soon as the bleeding has been controlled, preferably within or soon after 7 days of the bleeding event" }
    status: unverified
    tags: [numbers]
  - id: git.L11.051
    kind: table
    topic: antithrombotics
    title: Antithrombotics in acute UGIH
    columns: [Drug, During the bleed, Restart]
    rows:
      - [Aspirin for primary prophylaxis, Interrupt temporarily, After re-evaluating the indication]
      - [Aspirin for secondary prophylaxis, Do not interrupt, "If stopped: within 3-5 days"]
      - [DAPT (secondary prophylaxis), Keep aspirin; stop the second agent, Second agent within 5 days]
      - [VKA, "Withhold; if unstable: low-dose vitamin K + IV PCC (FFP if no PCC)", "Within or soon after 7 days"]
      - [DOAC, "Withhold; don't delay endoscopy; severe: reversal agent or IV PCC", "Within or soon after 7 days"]
