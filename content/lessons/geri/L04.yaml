        quote: "Risk Factors\n  Age, Female sex\n  Most potent risk factor - presence of the apolipoprotein e4 (APOE e4) allele.\n  Lifetime risk of AD for an individual\n  Without the e4 allele is approximately 9%\n  Carrying at least 1 e4 allele is 29%\n  e4 genotype is not sufficiently specific or sensitive for the diagnosis of AD to allow its use as a diagnostic test."
        title: "الـ APOE e4 بالأرقام"
        text: |
          أقوى ==risk factor==: الـ **APOE e4 allele**.
          - Lifetime risk من غير e4: **9%**.
          - مع e4 واحد على الأقل: **29%**.

          بس الـ e4 **not sufficiently specific or sensitive**، فمش test تشخيصي.

          ليه 9% لـ 29% ومع ذلك مش test؟ لأن ناس كتير عندهم e4 ومابيجيلهمش زهايمر، وناس كتير عندهم زهايمر من غير e4. يعني الـ e4 بيغيّر **الاحتمال**، مش بيحسم **التشخيص**، والنتيجة الإيجابية ممكن تخوّف واحد سليم على الفاضي.

          وليه **age** و**female sex**؟ التفسير المقبول (مش في الكتاب): كل سنة زيادة وقت أطول للتراكم، والستات بيعيشوا أطول في المتوسط، فبيوصلوا لسن الخطر أكتر.
