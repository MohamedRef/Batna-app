        title: "الـ CHB بيبان إزاي؟"
        text: |
          - **Many patients have no symptoms**، وناس تانية عندها **fatigue** أو **right upper quadrant discomfort**.
          - الكشف ممكن يبقى **normal** أو فيه **mild hepatomegaly**.
          - أو تشوف **manifestations of cirrhosis** لو المرض اتقدم.

          يعني مش هتعرف المرحلة من الكشف. هتعرفها من المعمل.
      - kind: explain
