      - kind: explain
        page: 25
        quote: "What is Translational Research (TR)?\nTranslational Research is the process of transforming discoveries made in the laboratory and clinic into interventions that improve public health and well being.\n3 main pillars of TR:\n  Bench (Basic Biomedical Research)\n  Bedside (Clinical Research)\n  Community (Improved Health)"
        title: "Translational research"
        text: |
          **Translational research (TR)** = تحويل الاكتشافات اللي بتحصل في ==the laboratory and clinic== لـ **interventions** بتحسّن صحة الناس.

          الـ **3 main pillars**:

          - **Bench**: basic biomedical research (المعمل).
          - **Bedside**: clinical research (العيان).
          - **Community**: improved health (الناس).

          بين bench وbedside فيه **T1**، وبين bedside وcommunity فيه **T2** (في رسمة slide 25).
      - kind: figure
        page: 25
        title: "شريحة 25: الـ 3 pillars والـ T1 والـ T2"
        image: { file: res/L01-s25-pillars.webp, book: true }
        alt: "Slide diagram in an orange frame: three round pictures in a row. Left, Bench: a gloved hand with culture plates, labelled Basic Biomedical Research. Middle, Bedside: a stethoscope, labelled Clinical Research. Right, Community: a crowd of people, labelled Improved Health. A double arrow labelled Translational Research (T1) joins bench and bedside, and another labelled Translational Research (T2) joins bedside and community."
        caption: |
          دي رسمة الـ pillars اللي في slide 25، من الشمال لليمين:

          - **شمال، Bench**: إيد بجوانتي وأطباق معمل = **Basic Biomedical Research**.
          - **في النص، Bedside**: سماعة = **Clinical Research**.
          - **يمين، Community**: زحمة ناس = **Improved Health**.
          - **بين الصور**: سهم بوشّين مكتوب عليه **Translational Research (T1)** بين bench وbedside، وسهم تاني **(T2)** بين bedside وcommunity.

          اللي تاخده: الـ ==T1== هو النقلة من المعمل للعيان، والـ ==T2== من العيان للناس كلها، والأسهم بوشّين لأن اللي بنشوفه في العيان بيرجّع أسئلة جديدة للمعمل.
      - kind: figure
        page: 26
        title: "شريحة 26: دايرة الـ translation continuum"
        image: { file: res/L01-s26-continuum.webp, book: true }
        alt: "Slide diagram: a ring in four coloured quarters, each with a question beside it. Green, top left, Basic Scientific Discovery: what are the basic mechanisms of human disease? Blue, top right, Clinical Research (including clinical trials): do basic scientific discoveries have clinical implications, and do research-based interventions work in patients? Red, bottom right, Clinical Practice: do interventions work in real-world settings? Orange, bottom left, Implementation Research: what factors or interventions influence health in the general population? Blue clouds on the right read Clinical applications and Create new preventive measures, therapies, medical procedures, diagnostics or behavioral changes; a yellow cloud on the left reads Public health improvements."
        caption: |
          نفس الـ continuum اللي فوق، بس كدايرة من 4 أرباع، وجنب كل ربع السؤال اللي بيجاوبه:

          - **فوق شمال (أخضر)، Basic Scientific Discovery**: إيه الـ basic mechanisms of human disease؟
          - **فوق يمين (أزرق)، Clinical Research** (including clinical trials): هل الاكتشاف ليه clinical implications، وهل الـ intervention بيشتغل في العيانين؟
          - **تحت يمين (أحمر)، Clinical Practice**: هل بيشتغل في الـ ==real-world settings==؟
          - **تحت شمال (برتقاني)، Implementation Research**: إيه اللي بيأثر على صحة الـ general population؟
          - **السحاب**: على اليمين الأزرق **Clinical applications** (preventive measures، therapies، procedures، diagnostics، behavioral changes)، وعلى الشمال الأصفر **Public health improvements**.

          اللي تاخده: كل ربع ليه **سؤال بحث مختلف**، والدايرة مقفولة لأن نتايج الـ implementation بترجّع أسئلة جديدة للـ ==basic science==.
      - kind: explain
        page: 26
        quote: "Translation continuum. Translation occurs at multiple points along the scientific research continuum including: from basic to clinical research, from clinical research to clinical practice, and from clinical practice to the implementation and dissemination of public health interventions.\nClinical applications: Create new preventive measures, therapies, medical procedures, diagnostics or behavioral changes\nPublic health improvements"
        title: "الترجمة بتحصل فين؟"
        text: |
          الـ **translation continuum**: الترجمة مش نقطة واحدة، بتحصل في ==3 نقط== على الطريق:

          - من **basic** لـ **clinical research**.
          - من **clinical research** لـ **clinical practice**.
          - من **clinical practice** لـ ==implementation and dissemination== of public health interventions.

          والناتج: **clinical applications** (preventive measures، therapies، procedures، diagnostics، behavioral changes) وبعدين **public health improvements**.

          ليه 3 نقط؟ لأن كل نقلة ليها عقبة مختلفة: اللي اشتغل في الفار ممكن مايشتغلش في الإنسان، واللي نجح في trial ممكن الدكاترة مايستخدموهوش، واللي الدكاترة بيستخدموه ممكن مايوصلش للناس. التفسير المقبول (مش في الكتاب).
