        quote: "Figure 27: Actions to manage hyperkalemia (potassium >5.5 mmol/l) in chronic kidney disease\n1st line: Correctable factors\n  Optimize serum bicarbonate levels\n  Optimize glycemic control\n  Consider loop diuretics and SGLT-2i as adjuncts\n2nd line: Dietary restriction\n  Assess dietary K+ intake and consider lowering (dietetic referral)\n3rd line: Medications\n  Dose adjust (or stop) K+ elevating or K+ sparing medication if necessary (signpost to restart disease modifying therapy, such as RAASi/MRA, at a later date if possible)\n  Licensed exchange resins are available to lower potassium"
