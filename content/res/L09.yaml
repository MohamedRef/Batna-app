items:
  # ---------------- budget ----------------
  - id: res.L09.001
    kind: enumerate
    topic: budget
    prompt: "Why do we need to design a research budget? Give the two reasons."
    points:
      - "It identifies which resources are already locally available and which additional resources may be required"
      - "Designing it makes you consider aspects of the work plan you had not thought about, and reminds you of planned activities as the research gets underway"
    pass: 2
    hook: "الـ budget بيعمل حاجتين: يقولك «عندك إيه وناقصك إيه» (resources)، ويفكّرك بالـ work plan اللي نسيته."
    src: { page: 2, quote: "BUDGET\nWhy do we need to design a budget?\n  A detailed budget will help you to identify which resources are already locally available and which additional resources may be required.\n  The process of budget design will encourage you to consider aspects of the work plan you have not thought about before, and will serve as a useful reminder of activities planned, as your research gets underway." }
    status: unverified
    tags: [high-yield]
  - id: res.L09.002
    kind: card
    topic: budget
    front: "What is the starting point for preparing a research budget, and what do you determine for each resource?"
    back: "The work plan. For each activity in the work plan, specify the resources required, then determine each resource's unit cost and total cost."
    src: { page: 3, quote: "How should a budget be prepared?\n  It is necessary to use the work plan as a starting point. Specify, for each activity in the work plan, what resources are required. Determine for each resource needed, the unit cost and the total cost.\nYou may include in your project budget:\n  Personnel allowances: salaries and benefits (e.g., researchers, research assistants, secretarial and administrative, drivers)\n  Supplies and equipment\n  Other costs (compensation for subjects, transportation costs, and medical intervention costs, stationery supplies), etc.\n  Communications (e.g., telephone, fax, postage)" }
    status: unverified
    tags: [high-yield]
  - id: res.L09.003
    kind: enumerate
