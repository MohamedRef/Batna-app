  - id: geri.L08.lesson5
    title: "العضم الهش والألم اللي في كل حتة"
    hook: "Osteoporosis ساكتة لحد ما حاجة تتكسر، و fibromyalgia بتوجع في كل حتة والتحاليل سليمة."
    minutes: 8
    pages: [148, 152]
    topics: [osteoporosis, fibromyalgia]
    goals:
      - "تعرف risk factors والوقاية والـ T-score"
      - "تعرف أدوية الـ osteoporosis"
      - "تعرف صورة الـ fibromyalgia وعلاجها"
    status: unverified
    steps:
      - kind: explain
        remind: [geri.L08.094]
        page: 148
        title: "Osteoporosis"
        quote: "Bone is living tissue that is constantly being broken down and replaced. Osteoporosis occurs when the creation of new bone doesn't keep up with the loss of old bone."
        text: |
          العضم بيتهد ويتبني طول الوقت. الـ ==osteoporosis== لما البنا ما يلحقش الهدم.

          الصورة: **back pain** من vertebra مكسورة، **loss of height**، **stooped posture**، وعضمة تتكسر أسهل من المتوقع.

          ليه الأعراض دي؟ التفسير المقبول (مش في الكتاب): الـ osteoporosis نفسها ما بتوجعش، الكسر هو اللي بيوجع. الفقرة اللي بتنهار بتعمل **back pain**، وكل فقرة بتقصر شوية فالطول بيقل، والفقرات اللي اتكسرت من قدّام بتعمل **stooped posture**. يعني أول عرض غالبًا هو أول كسر، وعشان كده الـ screening مهم.

          والكتاب بيقول إن **الأدوية والأكل الصحي والـ weight-bearing exercise** بيمنعوا الفقد أو بيقوّوا العضم الضعيف، فالمرض بيتمنع.
      - kind: explain
        page: 148
        quote: "Risk Factors\n  Female sex.\n  Old age.\n  White or Asian descent.\n  Positive family history.\n  Dietary Factors as low calcium intake.\n  Hormonal levels as low sex hormone, hyperthyroidism, overactive parathyroid and adrenal gland.\n  Medications like corticosteroids, anticonvulsants, proton pump inhibitors, drugs used in the treatment of cancer and transplant rejection.\n  Medical problems like IBD, MM, chronic liver& kidney dis."
        title: "ليه كل risk factor؟"
        text: |
          القايمة في الكتاب: **female sex**، **old age**، **white or Asian descent**، **family history**، **low calcium intake**، **hormones** (low sex hormones، hyperthyroidism، parathyroid و adrenal أوفر)، **أدوية** (corticosteroids، anticonvulsants، PPIs، أدوية الكانسر والـ transplant)، و **أمراض** (IBD، multiple myeloma، chronic liver و kidney disease).

          التفسير المقبول (مش في الكتاب)، كله بيرجع لميزان البنا والهدم:
          - **الستات بعد الـ menopause**: الـ estrogen كان فرامل للهدم، فلما يقل الهدم يسبق.
          - **الـ thyroid والـ parathyroid والـ cortisol** الزيادة: بيسرّعوا الهدم (افتكر محاضرة الغدة).
          - **PPIs**: الحموضة القليلة بتقلل امتصاص الكالسيوم.
          - **IBD**: امتصاص ضعيف والتهاب و steroids.
          - **Myeloma**: الخلايا السرطانية بتنشّط الـ osteoclasts.
          - **الكبد والكلى**: مسؤولين عن تفعيل vitamin D.

          ولاحظ إن ده نفس منطق الـ secondary osteoporosis في جدول الـ QFracture في محاضرة الـ CGA.
      - kind: sort
        page: 148
        quote: "Risk Factors\n  Female sex.\n  Old age.\n  White or Asian descent.\n  Positive family history.\n  Dietary Factors as low calcium intake.\n  Hormonal levels as low sex hormone, hyperthyroidism, overactive parathyroid and adrenal gland.\n  Medications like corticosteroids, anticonvulsants, proton pump inhibitors, drugs used in the treatment of cancer and transplant rejection.\n  Medical problems like IBD, MM, chronic liver& kidney dis."
        prompt: "Risk factor للـ osteoporosis حسب الكتاب؟"
        bins: ["Risk factor", "Not listed"]
        cards:
          - { text: "Proton pump inhibitors", bin: 0 }
          - { text: "Anticonvulsants", bin: 0 }
          - { text: "Hyperthyroidism", bin: 0 }
          - { text: "Multiple myeloma", bin: 0 }
          - { text: "White or Asian descent", bin: 0 }
          - { text: "Male sex", bin: 1 }
          - { text: "High calcium intake", bin: 1 }
        why: "الكتاب: female، old age، white/Asian، family history، **low calcium**، low sex hormones، hyperthyroidism، hyperparathyroidism، adrenal، أدوية (steroids، anticonvulsants، **proton pump inhibitors (PPIs)**، cancer و transplant drugs)، و inflammatory bowel disease (IBD) و multiple myeloma (MM) و chronic liver/kidney disease."
      - kind: explain
        page: 149
        title: "الوقاية"
        quote: "Most people need 600 IU/day, increased to 800IU/day at 70 years."
        text: |
          - **Calcium**: low-fat dairy، الخضار الورقي الغامق، سردين أو سالمون معلّب بعضمه، tofu، cereals و orange juice مدعّمين.
          - **Vitamin D**: cod liver oil و salmon. ==600 IU/day==، وتبقى **800 IU/day عند 70**.
          - **Exercise**: strength training + weight-bearing + **balance**. بينفع في أي سن، والأحسن تبدأ صغير.

          ليه الـ vitamin D بيزيد لـ **800 IU عند 70**؟ التفسير المقبول (مش في الكتاب): جلد الكبير بيصنع vitamin D أقل من الشمس، والكلى بتفعّله أقل، وهو كمان بيقعد في البيت أكتر.

          وليه **balance** مع الـ strength والـ weight-bearing؟ لأن الكسر محتاج حاجتين: عضم ضعيف **و** وقعة. الـ weight-bearing بيقوّي العضم (العضم بيبني نفسه على قد الحِمل)، والـ balance بيمنع الوقعة.
      - kind: explain
        page: 149
        quote: "The T-scorecorresponds to the number of standard deviations that the patient's bone mineral density differs from the peak bone mass of a healthy, young person of the same sex and race/ethnicity."
        title: "ليه بنقارن بشاب؟"
        text: |
          التشخيص بالـ **DXA**، والنتيجة ==T-score==: كام **standard deviation** الـ bone density بتاعة العيان بعيدة عن **peak bone mass** لشاب صحيح **من نفس الجنس والعرق**.

          ليه الشاب مش حد في سنه؟ التفسير المقبول (مش في الكتاب): لأن الكسر بيحصل من العضم الضعيف بغض النظر عن السن. لو قارنا بناس في سنه، كل الكبار هيطلعوا «طبيعي» لأن كلهم فقدوا عضم، مع إن خطر الكسر عالي فعلًا. يعني الـ T-score بيسأل: العضم ده بعيد قد إيه عن أقوى ما كان ممكن يبقى؟

          والـ WHO حطت الحدود: **-1 لـ -2.5** = osteopenia، و **-2.5 أو أقل** = osteoporosis.
      - kind: figure
        page: 150
        quote: "A T-score between -1.0 and -2.5 defines osteopenia. A T-score - 2.5 or more defines osteoporosis."
        title: "الـ T-score على مسطرة"
        alt: "A horizontal T-score ruler: zero and above -1 is normal (green), between -1 and -2.5 is osteopenia (accent), -2.5 and below is osteoporosis (red)."
        caption: "الـ ==T-score== = كام standard deviation (SD) بعيد عن peak bone mass لشاب من نفس الجنس والعرق (DXA). بين -1 و -2.5 osteopenia، و **-2.5 أو أقل** osteoporosis."
        svg: |
          <svg viewBox="0 0 330 140" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="40" width="100" height="40" class="fg-good"/>
            <rect x="110" y="40" width="110" height="40" class="fg-acc"/>
            <rect x="220" y="40" width="100" height="40" class="fg-bad"/>
            <text x="60" y="65" text-anchor="middle" class="t-sm t-b">Normal</text>
            <text x="165" y="65" text-anchor="middle" class="t-sm t-b">Osteopenia</text>
