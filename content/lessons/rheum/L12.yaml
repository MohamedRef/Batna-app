  - id: rheum.L12.lesson6
    title: "جوه المفصل، والسبع أنواع"
    hook: "الـ T cells بتدخل المفصل وما بتخرجش، والفرامل بايظة. وبعدين: إزاي تعدّ المفاصل وتعرف النوع."
    minutes: 8
    pages: [198, 199]
    topics: [pathophysiology, classification]
    goals:
      - "تشرح ليه الالتهاب بيفضل مستمر"
      - "ترتب الـ ILAR categories السبعة وتعرف الفاصل بين oligo و poly"
    status: unverified
    steps:
      - kind: figure
        page: 198
        quote: "There is good evidence that T-cells play an important role, with recruitment to the joint by up-regulation of adhesion molecules on synovial endothelium, and retention in the joint of activated cells."
        title: "باب بيدخّل وما بيخرّجش"
        alt: "A synovial blood vessel with adhesion molecules drawn as hooks on its lining. T cells stick to the hooks and pass into the joint. Inside the joint the activated T cells and monocytes release TNF, IL-1 and IL-6 (arrows up), while regulatory T cells and IL-4, IL-10 and TGF-beta are drawn small (arrows down). A loop arrow shows activated cells staying in the joint."
        caption: "الـ endothelium بيرفع ==adhesion molecules== فيشد الـ T cells، والخلايا المتنشطة بتتحبس جوه. البنزين (TNF، IL-1، IL-6) عالي والفرامل (Tregs، IL-10) واطية."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="R12a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="fg-head"/></marker></defs>
            <rect x="10" y="10" width="310" height="44" rx="10" class="fg-thin"/>
            <text x="165" y="28" text-anchor="middle" class="t-sm t-b">synovial vessel</text>
            <text x="165" y="46" text-anchor="middle" class="t-sm t-mut">adhesion molecules up</text>
            <path d="M80 54 L80 92" class="fg-arrow" marker-end="url(#R12a)"/>
            <path d="M165 54 L165 92" class="fg-arrow" marker-end="url(#R12a)"/>
            <path d="M250 54 L250 92" class="fg-arrow" marker-end="url(#R12a)"/>
            <text x="300" y="80" text-anchor="middle" class="t-sm t-mut">T cells in</text>
            <rect x="10" y="94" width="310" height="156" rx="14" class="fg-acc"/>
            <text x="165" y="114" text-anchor="middle" class="t-sm t-b">joint</text>
            <rect x="24" y="126" width="138" height="78" rx="8" class="fg-bad"/>
            <text x="93" y="146" text-anchor="middle" class="t-sm t-b">raised</text>
            <text x="93" y="166" text-anchor="middle" class="t-sm">T: TNF, IFN, IL-2</text>
            <text x="93" y="186" text-anchor="middle" class="t-sm">mono: TNF, IL-1, IL-6</text>
            <rect x="170" y="126" width="138" height="78" rx="8" class="fg-thin"/>
            <text x="239" y="146" text-anchor="middle" class="t-sm t-b">reduced</text>
            <text x="239" y="166" text-anchor="middle" class="t-sm">regulatory T cells</text>
            <text x="239" y="186" text-anchor="middle" class="t-sm">IL-4, IL-10, TGF-β</text>
            <path d="M120 224 C 150 244, 190 244, 220 224" class="fg-arrow" marker-end="url(#R12a)"/>
            <text x="165" y="222" text-anchor="middle" class="t-sm t-mut">activated cells retained</text>
          </svg>
      - kind: explain
        page: 198
        quote: "There is good evidence that T-cells play an important role, with recruitment to the joint by up-regulation of adhesion molecules on synovial endothelium, and retention in the joint of activated cells."
        title: "إيه اللي بيحصل جوه المفصل؟"
        text: |
          الـ ==T-cells== هي البطل: الـ synovial endothelium بيرفع **adhesion molecules** فيشد الـ T cells للمفصل، وبعدين الخلايا المتنشطة بتفضل محبوسة جواه.

          - **من الـ T-cells**: Tumour necrosis factor (TNF)، interferon (IFN)، IL-2.
          - **من الـ monocytes**: TNF، IL-1، IL-6، IL-8، IL-12.
          - الفرامل ضعيفة: **Regulatory T-cells** و IL-4، IL-10، TGF-β **قليلين**.
          - **HLA-A2** مرتبط بـ early-onset oligoarthritis في البنات.

          النتيجة: خلايا بتدخل وما بتخرجش، وبنزين عالي وفرامل ضعيفة، علشان كده الالتهاب chronic ومش بيهدى لوحده.
      - kind: reveal
        page: 198
        quote: "Pro-inflammatory cytokine levels in the joint are high, released from T- cells (TNF, INF, IL2) and from monocytes (TNF, IL1, IL6, IL8, IL12). Regulatory T-cells and anti-inflammatory cytokines (IL4, IL10 and TGF β) appear reduced"
        prompt: "ليه الالتهاب بيفضل مستمر (chronic) بدل ما يهدى لوحده؟"
        answer: "عشان البنزين كتير (TNF و IL-1 و IL-6 عالية) والفرامل بايظة: الـ Regulatory T-cells والـ anti-inflammatory cytokines (IL-4 و IL-10 و TGF-β) قليلة. والخلايا المتنشطة محبوسة جوه المفصل، فالنار مش بتطفي."
      - kind: explain
        page: 198
        title: "الـ HLA: الجينات بتختار النوع"
        quote: "A number of HLA class I and class II antigens are found in association with subtypes of JIA. For example HLA-A2 is associated with early onset oligoarthritis in girls."
        text: |
          الكتاب: فيه HLA class I و class II مرتبطين بـ ==subtypes== معينة، والمثال: **HLA-A2** مع **early onset oligoarthritis في البنات**.

          وهتقابل في المحاضرة كمان **HLA-B27** مع الـ late-onset في الولاد والـ ERA (ص 198 و 203).

          ليه الـ HLA بالذات؟ التفسير المقبول (مش في الكتاب): الـ HLA هي "الصينية" اللي الخلية بتعرض عليها الـ antigen للـ T cell. شكل الصينية بيحدد إيه اللي الـ T cell هتشوفه وتهاجمه، فكل HLA بيميل لنوع معين من المرض.
      - kind: table
        page: 199
        quote: "Oligoarticular JIA (PO or EO) < 4 joints in the first 6 months"
        title: "الـ categories السبعة"
        columns: ["Category", "Definition"]
        rows:
          - ["Systemic (SO)", "Arthritis + fever + 1 of rash, LN, liver/spleen, serositis"]
          - ["Oligo (PO/EO)", "≤ 4 joints in first 6 months; persistent or extended"]
          - ["RF-ve poly", "≥ 5 joints in first 6 months, RF-ve"]
          - ["RF+ve poly", "≥ 5 joints in first 6 months, RF+ve"]
          - ["ERA", "Arthritis + enthesitis"]
          - ["Psoriatic", "Arthritis + psoriasis"]
          - ["Undiff.", "No category, or > 1 category"]
        hide: [[0, 1], [1, 1], [2, 1], [4, 1], [6, 1]]
      - kind: explain
        page: 199
        title: "إزاي تعدّ وتصنّف"
        quote: "Young girls with early involvement of small joints are at risk for progression to polyarticular involvement and have a poor prognosis."
        text: |
          الفاصل كله في ==أول 6 شهور==:
          - **4 مفاصل أو أقل** = oligoarticular. ولو بعد الـ 6 شهور وصل 4–5 أو أكتر = **extended**، ولو فضل قليل = **persistent**
          - **5 أو أكتر** = polyarthritis، وبعدين بتفرّقه بالـ **RF**: negative أو positive
          - **Systemic**: arthritis + fever + واحدة من rash، غدد، كبد أو طحال، serositis
          - **ERA**: arthritis + enthesitis. **Psoriatic**: arthritis + psoriasis
          - **Undifferentiated**: ما ينطبقش على أي نوع، أو ينطبق على أكتر من واحد

          ليه 6 شهور؟ التفسير المقبول (مش في الكتاب): النمط بيبان ويستقر في الشهور الأولى، فبنستنى عشان ما نسميهوش oligo وهو في الطريق لـ poly. والكتاب نفسه بيقول البنات الصغيرين اللي small joints بتتأثر بدري عندهم خطر يقلبوا poly.
      - kind: match
        page: 199
        quote: "Enthesitis related JIA (ERA) Arthritis and enthesitis"
        prompt: "وصّل كل category بالي بيعرّفها:"
        pairs:
          - ["Oligoarticular", "≤ 4 joints in the first 6 months"]
          - ["Polyarthritis", "≥ 5 joints in the first 6 months"]
          - ["ERA", "Arthritis and enthesitis"]
          - ["Systemic onset", "Arthritis, fever and rash, nodes, organomegaly or serositis"]
          - ["Undifferentiated", "Fits no category or more than one"]
        why: "الرقم الفاصل بين oligo و poly هو 4 و 5 مفاصل في أول 6 شهور. الـ by mouth (PO) و extended oligoarticular (EO) يعني persistent و extended oligo."
      - kind: check
        page: 199
        quote: "Oligoarticular JIA (PO or EO) < 4 joints in the first 6 months"
        question: "A 10-year-old boy has had 7 swollen joints in the first 4 months of disease, no fever, no enthesitis and no psoriasis. RF is negative. Category?"
        options:
          - "RF-negative polyarthritis"
          - "Extended oligoarticular JIA"
          - "Systemic onset JIA"
          - "Undifferentiated JIA"
        answer: 0
        why:
          - "صح: 5 مفاصل أو أكتر في أول 6 شهور و RF سلبي."
          - "الـ extended يبدأ oligo (4 أو أقل) في أول 6 شهور وبعدين يزيد. هنا 7 من الأول."
          - "مفيش fever ولا features الـ systemic."
          - "بيطابق نوع واحد بالظبط، فمش undifferentiated."
      - kind: try
        items: [rheum.L12.012, rheum.L12.013, rheum.L12.014, rheum.L12.015, rheum.L12.092]
    recap:
      - "T cells بتتشد بالـ adhesion molecules وبتتحبس. TNF/IL-1/IL-6 عالية و Tregs و IL-4/IL-10/TGF-β قليلة: علشان كده مزمن."
      - "HLA-A2: early oligo في البنات. HLA-B27: late-onset ولاد و ERA."
      - "Oligo 4 أو أقل، poly 5 أو أكتر في أول 6 شهور. سبعة أنواع: systemic، oligo، RF−، RF+، ERA، psoriatic، undifferentiated."
    practice: [rheum.L12.012, rheum.L12.013, rheum.L12.014, rheum.L12.015, rheum.L12.016, rheum.L12.017, rheum.L12.092]
