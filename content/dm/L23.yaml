  # ---------- p290-291: ezetimibe ----------
  - id: dm.L23.032
    kind: card
    topic: ezetimibe
    front: How does ezetimibe complement a statin?
    back: "Ezetimibe blocks intestinal cholesterol absorption (NPC1L1); the statin blocks hepatic synthesis (HMG-CoA reductase). Less hepatic cholesterol raises LDL receptors and LDL-C clearance."
    src: { page: 291, quote: "NPC1L1 = Niemann-Pick C1-like 1; HMG-CoA = 3-hydroxy-3-methylglutaryl acetyl coenzyme A" }
    status: unverified
    tags: [high-yield]
  - id: dm.L23.033
    kind: cloze
    topic: ezetimibe
    text: "With a statin, ezetimibe lowers {{c1::hsCRP}} and LDL-C up to {{c2::3-fold}} compared with statin monotherapy."
    src: { page: 290, quote: "ezetimibe reduces hsCRP and LDL-C levels up to 3-fold, compared with statin monotherapy." }
    status: unverified
