- kind: fixed
  ar_eg: "النهارده على شاشة متوسطة العرض (تابلت أو شباك ماك ضيق): أسامي المحاضرات بقت تتقري بدل ما تتكسر حرف حرف."
  en: "Today on a medium-width window: lecture titles read normally instead of breaking one letter per line."
- kind: fixed
  ar_eg: "الحاسبات على شاشة متوسطة العرض بتفتح الحاسبة بعرض كويس بدل ما تتحشر جنب القايمة."
  en: "Calculators on a medium-width window open at a usable width instead of squeezed beside the list."
- kind: fixed
  ar_eg: "أرقام «تقدّمي» بقت مظبوطة نحويًا: يوم واحد، 5 أيام، 5 دقايق."
  en: "Progress tiles agree with their numbers (1 day, 5 days, 5 minutes)."
- kind: fixed
  ar_eg: "خانات البحث والكارت الجديد بتكتب التلميح من اليمين، ورقم النسخة في الإعدادات بقى بيتقري صح، و«التفاصيل» في الحاسبة عليها سهم يبيّن إنها بتتفتح."
  en: "Search and new-card hints start on the right, the version in Settings reads correctly, and a calculator's breakdown shows an arrow that it opens."
