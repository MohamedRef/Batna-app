  # ------------------------------------------------------------------
  - id: res.L01.lesson4
    title: "تختار موضوع رسالتك إزاي؟"
    hook: "عندك 5 أفكار ورسالة واحدة. فيه 7 معايير و3 درجات، والموضوع اللي يكسب ياخد أعلى مجموع."
    minutes: 10
    pages: [32, 52]
    topics: [lmic, priority]
    goals:
      - "تعرف ليه الدول النامية متأخرة في البحث"
      - "تعدّ الـ 7 criteria for prioritizing a research topic وتعرف معنى كل واحد"
      - "تقيّم موضوع بالـ rating scale 1-3 وتجمع الدرجة"
    status: unverified
    steps:
      - kind: explain
        page: 32
        quote: "Why are low to middle income countries lagging in research?"
        title: "ليه الدول النامية متأخرة؟"
        text: |
          slide 32 بيقسم المشاكل على 4 مراحل:

          - **Planning + design**: poor research culture، lack of funding، demotivated researchers، مش قادر توصل للـ literature، design غلط.
          - **Data collection + conduct**: ==tedious review process== (الـ IRB بتتقابل مرة في الشهر)، وقت التجربة بيقصر، والفلوس بتتصرف على التخطيط مش التنفيذ.
          - **Analysis + manuscript**: inadvertent **plagiarism**، poor writing، statistics غلط.
          - **Publication**: الـ journals بترفض لضعف الجودة أو لأنك مش قادر تدفع رسوم النشر.

          والحل المقترح (**101 framework**): مساعدة رخيصة في الـ design والإحصاء، infrastructure للداتا والنشر، ونشر ثقافة البحث بين الشباب.
      - kind: explain
        page: 34
        quote: "the selection and analysis of the research topic should involve those who are responsible for the health status of the community (stakeholders)."
        title: "مين يختار الموضوع؟"
        text: |
          الـ **health research** هدفه يدّي معلومات لاتخاذ قرار يحسّن الرعاية. علشان كده اختيار الموضوع لازم يشترك فيه ==stakeholders==: اللي مسؤولين عن صحة المجتمع.

          وكل موضوع مقترح يتحكم عليه بـ **criteria**، ويتقارن بباقي الاختيارات قبل ما تقرر.
      - kind: mnemonic
        page: 36
        quote: "Relevance: The importance of the problem, and its priority in the country and in the local area"
        word: "PURE FAA"
        parts:
          - { key: "P", text: "Political acceptability" }
          - { key: "U", text: "Urgency of data needed (timeliness)" }
          - { key: "R", text: "Relevance" }
          - { key: "E", text: "Ethical acceptability" }
          - { key: "F", text: "Feasibility" }
          - { key: "A", text: "Avoidance of duplication" }
          - { key: "A", text: "Applicability of results" }
        hook: |
          موضوعك لازم يكون **PURE** (نضيف)، وياخد موافقة الـ **FAA** (هيئة الطيران) علشان يطير. الـ 7 criteria في كلمتين.
      - kind: explain
        page: 39
        quote: "A strong research topic/idea should pass the “so what” test."
        title: "1. Relevance: اختبار «So what?»"
        text: |
          أول وأهم معيار. اسأل:

          - **How large or widespread** المشكلة؟
          - **Who is affected?**
          - **How serious** هي؟

          والموضوع الـ relevant لازم يعدّي ==the "so what" test==: يقدر **advance scientific knowledge** أو **influence clinical management** أو **influence health policy** أو **guide further research**.

          وخلي بالك إن policy-makers والأطباء والمجتمع ممكن يشوفوا نفس المشكلة بأهمية مختلفة.
      - kind: aside
        tone: trap
        page: 38
        quote: "If you do not consider a topic relevant, it is not worthwhile to continue rating it."
        text: |
          لو الموضوع **not relevant**: ماتكمّلش تقييم الباقي، ==drop it==. مش «هياخد 1 في الـ relevance ويعوّض في الباقي».
      - kind: explain
        page: 40
        quote: "If the topic has been researched, the results should be reviewed to explore whether major questions that deserve further investigation remain unanswered."
        title: "2. Avoidance of duplication"
        text: |
          قبل ما تبدأ، دوّر: الموضوع اتدرس قبل كده في نفس المكان أو مكان شبهه؟

          - لو اتدرس: راجع النتايج. فيه ==major questions لسه ماتجاوبتش==؟ كمّل عليها.
          - لو مفيش: اختار موضوع تاني.

          وكمان: لو الإجابة موجودة في معلومات **unpublished** متاحة، أو تتعرف بالـ **common sense**، شيل الموضوع من القائمة.
      - kind: explain
        page: 42
        quote: "In general, it is advisable to research a topic that has the interest and support of the local/national authorities."
        title: "3-7: الباقي في جملة"
        text: |
          - **Urgency (timeliness)**: النتايج محتاجينها قد إيه دلوقتي لقرار أو intervention؟ إيه يتعمل الأول وإيه يستنى؟
          - **Political acceptability**: موضوع عليه ==interest and support of the authorities== نتايجه فرصتها أكبر تتنفذ. ولو بحثك ممكن يثبت إن سياسة الحكومة محتاجة تتعدل، اشرك الـ policy-makers **بدري** علشان تقلل المواجهة بعدين.
          - **Feasibility**: الـ manpower والوقت والـ equipment والفلوس. ابدأ بالـ **local**، بعدين **national** (research units، councils، universities)، وبعدين **external** assistance.
          - **Applicability**: التوصيات هتتنفذ؟ ده بيعتمد على قدرة الفريق، **blessing of the authorities**، الموارد، ورأي الـ clients والـ staff.
          - **Ethical acceptability**: (الخطوة الجاية).
      - kind: explain
        page: 45
        quote: "Can informed consent be obtained from the research subjects?"
        title: "7. Ethical acceptability"
        text: |
          ممكن نأذي ناس وإحنا بنعمل بحث، فاسأل:

          - البحث **acceptable** للناس اللي هتدرسهم؟ (==cultural sensitivity==) والمشكلة مشتركة بين الـ target group والباحثين؟
          - نقدر ناخد ==informed consent==؟
          - هناخد حالة المشاركين في الاعتبار؟ لو لقينا حد محتاج علاج هنعالجه؟ حتى لو ده هيأثر على النتايج؟
          - النتايج هترجع للناس اللي اتدرسوا؟ وهتحسّن حياتهم؟

          مثال مصري: بحث عن HCV في قرية: لو لقيت حالات positive، لازم يبقى عندك خطة تحوّلهم لعلاج.
      - kind: sort
        page: 36
        quote: "Feasibility of study: Study is feasible, considering available resources."
        prompt: "كل مشكلة دي بتخسّر الموضوع في أنهي criterion؟"
        bins: ["Feasibility", "Avoidance of duplication", "Ethical acceptability", "Applicability"]
        cards:
          - { text: "No PCR machine and no budget for one", bin: 0 }
          - { text: "Two Egyptian studies already answered it", bin: 1 }
          - { text: "Patients can't give informed consent", bin: 2 }
          - { text: "Ministry has no money to act on the results", bin: 3 }
          - { text: "Only you and 3 months available", bin: 0 }
          - { text: "Positive cases won't be offered treatment", bin: 2 }
        why: "Feasibility = الموارد (ناس، وقت، أجهزة، فلوس). Duplication = المعلومة موجودة. Ethics = consent والعلاج. Applicability = فرصة إن التوصيات تتنفذ."
      - kind: table
        page: 51
        quote: "Relevance 1. = Not relevant 2. = Relevant 3. = Very relevant"
        title: "Scales for rating research topics (2 = in between)"
        columns: ["Criterion", "Score 1 (low)", "Score 3 (high)"]
        rows:
          - ["Relevance", "Not relevant", "Very relevant"]
          - ["Avoidance of duplication", "Sufficient info already available", "No sound info available"]
          - ["Urgency", "Not urgently needed", "Very urgently needed"]
          - ["Political acceptability", "Not acceptable", "Fully acceptable"]
          - ["Feasibility", "Not feasible", "Very feasible"]
          - ["Applicability", "No chance of implementation", "Good chance"]
          - ["Ethical acceptability", "Major ethical problems", "No ethical problems"]
        hide: [[1, 1], [1, 2], [6, 1], [6, 2]]
      - kind: aside
        tone: exam
        page: 51
        quote: "3. = No sound information available on which to base problem-solving"
        text: |
          الـ **3 دايمًا = أحسن** للموضوع. فخ الامتحان: في **avoidance of duplication**، الـ 3 معناها ==مفيش معلومات كفاية== (وده كويس للبحث)، والـ 1 معناها المعلومات موجودة. وفي الـ ethics، الـ 3 = no ethical problems.
      - kind: case
        page: 52
        quote: "Rating scale: 1 = low, 2 = medium, 3 = high."
        stem: "مجموعتك بتستخدم الـ nominal group technique (NGT) علشان تختار موضوع. بتقارن «Fatty liver among Alexandria bus drivers» بـ «HCV prevalence in blood donors»."
        steps:
          - question: "The HCV topic already has a national survey and a recent local study with the same question. Avoidance of duplication score?"
            options: ["1", "2", "3"]
            answer: 0
            why: "Sufficient information already available = 1."
          - question: "Fatty liver topic: relevance 3, duplication 3, urgency 2, political 3, feasibility 2, applicability 2, ethics 3. Total?"
            options: ["18", "21", "16", "7"]
            answer: 0
            why: "3+3+2+3+2+2+3 = 18 من 21. الموضوع الأعلى مجموعًا ياخد الأولوية."
          - question: "What should the group do with the HCV topic before dropping it?"
            options:
              - "Review the published results for major unanswered questions"
              - "Rate it on the other six criteria anyway"
              - "Repeat the survey in another hospital"
            answer: 0
            why: "slide 40: راجع النتايج؛ لو مفيش سؤال مهم لسه مفتوح، اختار موضوع تاني."
      - kind: explain
        page: 49
        quote: "Liver diseases Viral hepatitis Hepatitis C Specific research area"
        title: "ضيّق الموضوع: المثلث المقلوب"
        text: |
          الـ **research topic triangle**: ابدأ واسع وضيّق بالـ keywords:

          - **Liver diseases → Viral hepatitis → Hepatitis C**
          - ثم ==specific research area==: therapy, diagnosis, etiology, prognosis, harm, prevention, or quality improvement.

          زي ما شفنا في الدرس الأول: سؤال ضيق = بحث يخلص.
