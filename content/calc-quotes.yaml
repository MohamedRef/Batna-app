  - calculator: sos_criteria
    lecture: hb.L04
    page: 81
    quote: |-
      Diagnosis
        Consider SOS in patients with two or more of the following criteria: (Seattle or Baltimore criteria) weight gain, ascites, tender hepatomegaly and jaundice within 20 days after BMT.
        Lack of specific clinical signs or serological diagnostic tools makes recognition of SOS challenging.
          Diagnosis is based on a high index of clinical suspicion.
          After exclusion of potential mimicking causes.
            Acute liver graft versus host disease (GvHD).
            Liver infections.
            Sepsis associated with cholestasis.
            Other drug-induced liver diseases.
            Cardiac diseases.
            Other causes of ascites.
            Renal failure.
        In patients who do not meet clinical criteria of SOS or when other diagnoses have to be excluded, use transjugular liver biopsy.
