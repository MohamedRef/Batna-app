  - id: neph.L09.171
    kind: case
    topic: prescription
    stem: A 62-year-old with AKI after sepsis is anuric, with K+ 7.0 mmol/L, pH 7.08 and lung crackles. He is on noradrenaline.
    steps:
      - question: Does he need dialysis now?
        options: ["Yes", Not yet; wait for uraemic symptoms, Only if creatinine is above 10 mg/dL, No; give more diuretic]
        answer: 0
        why: "Hyperkalaemia, acidosis with anuria and volume overload not responding to medical treatment are indications (p299–300)."
      - question: Best catheter site?
        options: [Right internal jugular under ultrasound, Left subclavian, Left jugular, Femoral without ultrasound]
        answer: 0
        why: "Right jugular first; ultrasound guidance recommended (2A) (p297)."
      - question: Which modality suits him on noradrenaline?
        options: [CKRT, Conventional 4-h HD with high UF, Isolated UF, PD]
        answer: 0
        why: "Haemodynamically unstable on inotropes is an indication for CKRT, with less hypotension (p303–304)."
      - reveal: After 3 days on CKRT his phosphate is 0.5 mmol/L.
        question: What explains it?
        options: [A known disadvantage of CKRT, A dialysate potassium error, Disequilibrium syndrome, Hyperparathyroidism]
        answer: 0
        why: "CKRT increases the risk of hypophosphataemia (p304)."
    src: { page: 303, quote: "CKRT blood purification techniques intended to run for 24 hours or longer without interruption.Continuous treatment allows for a lower ultrafiltration rate, slower rate of solute clearance than is possible with intermittent KRT. Indicated in Critically ill AKI specially on ventilator.Specially if Heodynamically unstable on inotrope. Patients with cerebral edema or liver failure. Severe acidosis pH < 7.1 to 7.2 or serum bicarbonate level < 12 to 15 mmol/L. Earlier initiation of RRT may be necessary in patients receiving lung-protective ventilation, as severe acidemia can result from the combination of metabolic and respiratory acidosis." }
    status: unverified
