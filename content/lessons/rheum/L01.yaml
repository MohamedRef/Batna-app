          - الدوا اللي بيقفل receptor مشترك ممكن يقفل أكتر من cytokine مرة واحدة.

          والكتاب بيقفل الصفحة بجملتين: كلهم **أقل من 30 kDa**، و **few rarely act alone**: نادرًا ما cytokine بيشتغل لوحده.
