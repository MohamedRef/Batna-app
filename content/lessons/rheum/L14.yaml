  - id: rheum.L14.lesson2
    title: "الـ DEXA بيقول إيه؟"
    hook: "رقم واحد سالب على ورقة الـ DEXA بيفرق بين طمّن المريضة وابدأ علاج. تعالى نقرا الـ T-score صح."
    minutes: 8
    pages: [223, 224]
    topics: [dexa, screening]
    goals:
      - "تقرا الـ T-score وتصنّف"
      - "تعرف الـ FRAX ومين يعمل BMD وليه"
      - "تعرف التحاليل اللي بتدوّر على السبب"
    status: unverified
    steps:
      - kind: explain
        page: 223
        quote: "Bone Mineral Density (BMD) Testing\n  Dual-energy X-ray absorptiometry (DEXA) is the gold standard.\n  T-score interpretation:\n    Normal: T ≥ –1.\n    Osteopenia: –1 > T > –2.5.\n    Osteoporosis: T ≤ –2.5.\n    Severe osteoporosis: T ≤ –2.5 + fragility fracture."
        title: "الـ DEXA"
        text: |
          الـ ==dual-energy X-ray absorptiometry (DEXA)== هو الـ **gold standard** لقياس الـ bone mineral density (BMD). والنتيجة بتطلع **T-score**: بُعدك عن الشاب الطبيعي بالـ standard deviation.
      - kind: figure
