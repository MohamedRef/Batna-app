schema: batna.lesson/v1
lecture: res.L07
lessons:
  # ------------------------------------------------------------------
  - id: res.L07.lesson1
    title: "حجم العينة: كام عيان يكفي؟"
    hook: "عيّنة صغيرة تضيّع مجهودك، وعيّنة كبيرة تضيّع فلوسك. الرقم الصح بيطلع من ٥ حاجات بس."
    minutes: 8
    pages: [1, 18]
    topics: [sample-size]
    goals:
      - "تفرّق بين type I و type II error ومعنى الـ power"
      - "تعدّ الـ 5 factors اللي بتحدد الـ sample size واتجاه كل واحد"
      - "تعرف مكان كل حاجة في معادلة الـ sample size"
    status: unverified
    steps:
      - kind: explain
        page: 1
        quote: "Step 5 - Sample Size Calculation:\n  Too small a sample would produce insignificant results and would be a waste of efforts.\n  Every subject in a clinical trial costs tremendous amount of money, so even one additional subject may mean poor financial management."
        title: "Step 5: ليه نحسب الـ sample size؟"
        text: |
          كمّلنا الـ 12 step بتوع تخطيط الـ randomized controlled trial (RCT). الـ step الخامسة: ==sample size calculation==.

          - عيّنة **صغيرة**: النتيجة تطلع **insignificant** حتى لو الدوا شغّال، يعني مجهود ضايع.
          - عيّنة **كبيرة زيادة**: كل subject في الـ trial بيكلّف فلوس كتير، فحتى subject واحد زيادة يبقى **poor financial management**.

          والطريقة العملية الوحيدة إنك تقلّل الـ random error: عدد كافي من الناس، محسوب بـ **sample size calculation** أو **power analysis**.
      - kind: explain
        page: 2
        quote: "Random error can be divided into two types of errors with respect of hypothesis testing.\n  Type I error refers to the probability of drawing a false-positive conclusion by rejection of a true null hypothesis,\n  Type II error refers to the probability of a false-negative conclusion accepting a false null hypothesis\nThe most feasible way to improve the estimate of random error is to recruit a sufficient number of subjects according to a sample size calculation or power analysis."
        title: "غلطتين ممكن تقع فيهم"
        text: |
          - ==Type I error (alpha)==: لقيت **فرق مش موجود** في الحقيقة. رفضت null hypothesis صح. ده **false positive**.
            بالبلدي: **نزّلت دوا ملوش لازمة السوق**.
          - ==Type II error (beta)==: فاتك **فرق موجود فعلًا**. فشلت ترفض null hypothesis غلط. ده **false negative**.
            بالبلدي: **خبّيت دوا كويس عن العيانين**.
      - kind: figure
        page: 5
        quote: "Possible trial outcomes\n| Reality | Trial Results |\n|---|---|\n| Treatments do NOT differ | Treatments do NOT differ (correct); Treatment do differ (α = Type 1 error) |\n| Treatments do differ | Treatments do NOT differ (β = Type 2 error); Treatment do differ (correct) |"
        title: "الحقيقة ضد نتيجة الـ trial"
        alt: "Two by two grid. Columns are the truth: no real difference, or a real difference. Rows are the trial result: treatments differ, or do not differ. Differ when there is no real difference is a type I error, alpha. Do not differ when there is a real difference is a type II error, beta. The other two cells are correct; finding a real difference is the power, 1 minus beta."
        caption: "خانتين صح وخانتين غلط. الـ **power** هي الخانة الخضرا اللي تحت **real difference**."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <text x="215" y="16" text-anchor="middle" class="t-sm t-b">The truth</text>
            <rect x="110" y="26" width="105" height="34" rx="6" class="fg-thin"/>
            <text x="162" y="47" text-anchor="middle" class="t-sm">No difference</text>
            <rect x="220" y="26" width="105" height="34" rx="6" class="fg-thin"/>
            <text x="272" y="47" text-anchor="middle" class="t-sm">Real difference</text>
            <text x="55" y="16" text-anchor="middle" class="t-sm t-b">Trial says</text>
            <rect x="5" y="66" width="100" height="80" rx="6" class="fg-box"/>
            <text x="55" y="102" text-anchor="middle" class="t-sm t-b">Differ</text>
            <text x="55" y="120" text-anchor="middle" class="t-sm t-mut">p &lt; 0.05</text>
            <rect x="5" y="152" width="100" height="80" rx="6" class="fg-box"/>
            <text x="55" y="188" text-anchor="middle" class="t-sm t-b">Do not differ</text>
            <text x="55" y="206" text-anchor="middle" class="t-sm t-mut">p ≥ 0.05</text>
            <rect x="110" y="66" width="105" height="80" rx="6" class="fg-bad"/>
            <text x="162" y="98" text-anchor="middle" class="t-sm t-b">Type I error</text>
            <text x="162" y="116" text-anchor="middle" class="t-sm">alpha</text>
            <text x="162" y="134" text-anchor="middle" class="t-sm t-mut">false positive</text>
            <rect x="220" y="66" width="105" height="80" rx="6" class="fg-good"/>
            <text x="272" y="98" text-anchor="middle" class="t-sm t-b">Correct</text>
            <text x="272" y="116" text-anchor="middle" class="t-sm">Power</text>
            <text x="272" y="134" text-anchor="middle" class="t-sm t-mut">1 - beta</text>
            <rect x="110" y="152" width="105" height="80" rx="6" class="fg-good"/>
            <text x="162" y="184" text-anchor="middle" class="t-sm t-b">Correct</text>
            <text x="162" y="202" text-anchor="middle" class="t-sm">1 - alpha</text>
            <rect x="220" y="152" width="105" height="80" rx="6" class="fg-bad"/>
            <text x="272" y="184" text-anchor="middle" class="t-sm t-b">Type II error</text>
            <text x="272" y="202" text-anchor="middle" class="t-sm">beta</text>
            <text x="272" y="220" text-anchor="middle" class="t-sm t-mut">false negative</text>
          </svg>
      - kind: mnemonic
        page: 4
        quote: "What is β (Type II error)?\n  Type II error refers to the probability of a false-negative conclusion by fail to reject a false null hypothesis\n  (keep a good medicine away from patients!)"
        word: "PN"
        parts:
          - { key: "P", text: "Type I = false Positive: شفت فرق مش موجود. دوا فاشل نزل السوق." }
          - { key: "N", text: "Type II = false Negative: فاتك فرق حقيقي. دوا كويس اتحرم منه العيانين." }
        hook: "زي ترتيب الحروف: **P** الأول (type I)، و **N** بعده (type II). والـ **power = 1 - beta**: فرصتك ماتفوتكش الفرق."
      - kind: check
        page: 13
        quote: "QUESTION 3: A RCT comparing the efficacy of 2 drugs showed a difference between the two (p<0.05). Assume in reality, however, the 2 groups do not differ. This is therefore an example of:\n  a. Type 1 error (α error)\n  b. Type 2 error (β error)\n  c. 1- α\n  d. 1- β\nAnswer: a"
        question: "An RCT finds a difference between two drugs (p < 0.05), but in reality they do not differ. This is:"
        options:
          - "Type 1 error (alpha)"
          - "Type 2 error (beta)"
          - "Power"
          - "1 - alpha"
        answer: 0
        why:
          - "صح: لقينا فرق مش موجود في الحقيقة، يعني false positive."
          - "الـ type 2 هو إن يفوتك فرق موجود، وهنا مفيش فرق أصلًا."
          - "الـ power هو إنك تلاقي فرق موجود فعلًا."
          - "الـ 1 - alpha هو إنك صح تقول مفيش فرق."
      - kind: explain
        page: 7
        quote: "Minimal clinically relevant difference (MCRD) δ:\n  For continuous outcome (body weight) the MCRD may be 5 Kg\n  For a trial with a binary outcome, for example the effect of a drug on the development of a myocardial infarction (yes/no), an investigator could choose a difference of 10% between the treatment group and the control group as MCRD"
        title: "الـ MCRD: أقل فرق يفرق مع العيان"
        text: |
          ==Minimal clinically relevant difference== (delta): أقل فرق بين المجموعتين **الباحث شايفه مهم إكلينيكيًا**.

          - outcome **continuous** زي الوزن: ممكن الـ minimal clinically relevant difference (MCRD) يبقى **5 kg**.
          - outcome **binary** زي myocardial infarction (MI) أيوه ولا لأ: ممكن تختار فرق **10%** بين الـ treatment والـ control.

          وخلي بالك: لو delta **كبيرة أوي**، أدوية مش فعالة هتعدّي كـ non-inferior وتنزل السوق. لو **صغيرة أوي**، أدوية مفيدة هتتهمل.
      - kind: table
        page: 8
        quote: "Factors affecting sample size of RCT\n| Component | Definition |\n|---|---|\n| Alpha (type I error) | The probability of falsely rejecting H0 and detecting a significant difference when the groups in reality are not different |\n| Beta (type II error) | The probability of falsely accepting H0 and not detecting a statistically significant when a specified difference between the groups in reality exist |\n| Power (1-beta) | The possibility of correctly rejecting H0 and detecting statistically significant difference when it is true |\n| (MCRD) δ | The minimal difference between the groups that the investigator considers clinically relevant |\n| Variance | The variability of the outcome measure as the SD in case of continuous outcome |"
        title: "الـ 5 factors: لو زوّدت الحاجة دي، العيّنة تعمل إيه؟"
        columns: ["Factor increased", "Sample size", "Why"]
        rows:
          - ["Alpha", "Smaller", "Z alpha falls"]
          - ["Power", "Larger", "Z beta rises"]
          - ["MCRD (delta)", "Smaller", "Big effects are easy to see"]
          - ["Variance (SD)", "Larger", "Noise hides the effect"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: analogy
        page: 8
        quote: "Factors affecting sample size of RCT\n| Component | Definition |\n|---|---|\n| Alpha (type I error) | The probability of falsely rejecting H0 and detecting a significant difference when the groups in reality are not different |\n| Beta (type II error) | The probability of falsely accepting H0 and not detecting a statistically significant when a specified difference between the groups in reality exist |\n| Power (1-beta) | The possibility of correctly rejecting H0 and detecting statistically significant difference when it is true |\n| (MCRD) δ | The minimal difference between the groups that the investigator considers clinically relevant |\n| Variance | The variability of the outcome measure as the SD in case of continuous outcome |"
        text: |
          تخيّل إنك عايز تسمع حد بيكلّمك في فرح.

          - لو صوته **عالي** (delta كبيرة) هتسمعه من أول كلمة: عيّنة صغيرة تكفي.
          - لو **الدوشة** حواليك عالية (variability أو variance كبيرة) محتاج تقرّب أكتر: عيّنة أكبر.
          - ولو عايز تبقى **متأكد** إنك مش هتفوّت ولا كلمة (power أعلى): برضه عيّنة أكبر.
      - kind: aside
        tone: exam
        page: 8
        quote: "Factors affecting sample size of RCT\n| Component | Definition |\n|---|---|\n| Alpha (type I error) | The probability of falsely rejecting H0 and detecting a significant difference when the groups in reality are not different |\n| Beta (type II error) | The probability of falsely accepting H0 and not detecting a statistically significant when a specified difference between the groups in reality exist |\n| Power (1-beta) | The possibility of correctly rejecting H0 and detecting statistically significant difference when it is true |\n| (MCRD) δ | The minimal difference between the groups that the investigator considers clinically relevant |\n| Variance | The variability of the outcome measure as the SD in case of continuous outcome |"
        text: |
          الدكتورة قالت في الشرح: **مش مطلوب تحفظ المعادلة**. المطلوب تفهم المدخلات وكل واحد بيأثر إزاي: alpha، beta، الـ ==power==، الفرق المهم إكلينيكيًا (delta)، والـ **variance**.

          - Power = 1 - beta: لو beta = **20%** يبقى الـ power = **80%**، ولو beta = **10%** يبقى **90%**.
          - فرق أصغر عايز تكشفه، أو variance (SD) أعلى، أو alpha أصغر، أو power أعلى: كله بيكبّر العيّنة.
          - والـ delta لازم يبقى فرق **يهم العيان** فعلًا، يتحدد قبل الحساب، مش رقم تظبطه علشان العيّنة تطلع مريحة.
      - kind: figure
        page: 11
        quote: "Simple formula for difference in means: n = 2 × σ²(Zβ + Zα/2)² / difference²\n  n: Sample size in each group (assumes equal sized groups)\n  σ: Standard deviation of the outcome variable\n  Zβ: Represents the desired power (typically .84 for 80% power).\n  Zα/2: Represents the desired level of statistical significance (typically 1.96).\n  difference: Effect Size (the difference in means)"
        title: "معادلة الـ sample size للـ means"
        alt: "Formula: n per group equals 2 times sigma squared times the square of Z beta plus Z alpha over 2, divided by the difference squared. Labels: sigma is the standard deviation of the outcome, Z beta is the desired power, 0.84 for 80 percent, Z alpha over 2 is the significance level, 1.96, and the difference is the effect size. Variability and power sit on top; the effect size sits underneath."
        caption: "اللي **فوق** الكسر بيكبّر العيّنة: variance و power. اللي **تحت** بيصغّرها: الـ effect size. وللـ proportions بتحط **p(1-p)** مكان sigma تربيع."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <text x="20" y="96" class="t-lg t-b">n = 2 ×</text>
            <text x="200" y="80" text-anchor="middle" class="t-lg">σ² (Zβ + Zα/2)²</text>
            <path d="M110 92H292" class="fg-arrow"/>
            <text x="200" y="120" text-anchor="middle" class="t-lg">difference²</text>
            <rect x="120" y="20" width="60" height="30" rx="6" class="fg-box"/>
            <text x="150" y="40" text-anchor="middle" class="t-sm">SD</text>
            <rect x="190" y="20" width="60" height="30" rx="6" class="fg-good"/>
            <text x="220" y="40" text-anchor="middle" class="t-sm">0.84</text>
            <rect x="260" y="20" width="60" height="30" rx="6" class="fg-acc"/>
            <text x="290" y="40" text-anchor="middle" class="t-sm">1.96</text>
            <text x="150" y="14" text-anchor="middle" class="t-sm t-mut">variability</text>
            <text x="220" y="14" text-anchor="middle" class="t-sm t-mut">80% power</text>
            <text x="290" y="14" text-anchor="middle" class="t-sm t-mut">alpha 0.05</text>
            <rect x="140" y="140" width="120" height="30" rx="6" class="fg-thin"/>
            <text x="200" y="160" text-anchor="middle" class="t-sm">effect size (MCRD)</text>
            <text x="165" y="200" text-anchor="middle" class="t-sm t-bad">Top grows → more patients</text>
            <text x="165" y="220" text-anchor="middle" class="t-sm t-good">Bottom grows → fewer patients</text>
          </svg>
      - kind: check
        page: 18
        quote: "All of the followings can be increased to get smaller sample size in RCT EXCEPT?\n  a. α error\n  b. Power\n  c. (MCRD) δ"
        question: "All of the following can be increased to get a smaller sample size EXCEPT:"
        options:
          - "Alpha error"
          - "Power"
          - "MCRD (delta)"
          - "Beta error"
        answer: 1
        why:
          - "لو قبلت alpha أكبر، الـ Z alpha يقل والعيّنة تصغر."
          - "صح: power أعلى يعني Z beta أكبر فوق الكسر، يعني عيّانين أكتر."
          - "الـ delta تحت الكسر؛ لما تكبر العيّنة تصغر."
          - "beta أكبر يعني power أقل، يعني عيّنة أصغر."
      - kind: aside
        tone: trap
        page: 17
        quote: "In a well designed clinical trial of treatment of ovarian cancer, remission rate at one year is similar for new drug and usual care, p = 0.4. This means that:\n  a. Both treatment are effective\n  b. Neither treatment is effective\n  c. The statistical power of this study is 60%\n  d. The best estimate of treatment effect is 0.4\n  e. It is not possible to decide which treatment is better based on these information\nAnswer: e"
        text: |
          سؤال الـ ovarian cancer: remission متشابه، **p = 0.4**. الإجابة: **مش ممكن نحكم أنهي treatment أحسن من المعلومات دي**.

          الفخاخ: الـ p مش «الـ power = 60%» ولا «الـ effect = 0.4». والـ p الكبيرة مش معناها إن الاتنين فاشلين أو الاتنين شغالين؛ مفيش placebo أصلًا.
      - kind: try
        items: [res.L07.004, res.L07.008, res.L07.011]
    recap:
      - "Type I (alpha) = false positive، دوا فاشل نزل السوق. Type II (beta) = false negative، دوا كويس اتحرم منه الناس."
      - "Power = 1 - beta: فرصة إنك تلاقي الفرق الحقيقي."
      - "الـ 5 factors: alpha، beta، power، MCRD، variance. Power و variance أكبر = عيّنة أكبر. Alpha و MCRD أكبر = عيّنة أصغر."
      - "المعادلة: Zβ = 0.84 لـ 80% power، Zα/2 = 1.96."
    practice: [res.L07.001, res.L07.002, res.L07.003, res.L07.004, res.L07.005, res.L07.006, res.L07.007, res.L07.008, res.L07.009, res.L07.010, res.L07.011, res.L07.012, res.L07.013, res.L07.014, res.L07.015, res.L07.016, res.L07.017, res.L07.018, res.L07.019, res.L07.020, res.L07.115]
