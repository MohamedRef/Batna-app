      - kind: sort
        page: 23
        prompt: "حط كل test في مكانه:"
        bins: ["Non-patented", "Patented"]
        cards:
          - { text: "FIB-4", bin: 0 }
          - { text: "APRI", bin: 0 }
          - { text: "AST/ALT ratio", bin: 0 }
          - { text: "NAFLD fibrosis score (NFS)", bin: 0 }
          - { text: "FibroTest", bin: 1 }
          - { text: "ELF", bin: 1 }
          - { text: "FibroMeter", bin: 1 }
          - { text: "Hepascore", bin: 1 }
        why: "الـ **non-patented** معادلات ببلاش من تحاليل روتينية (AST، ALT، platelets، age). الـ **patented** ليها براءة اختراع، يعني kit بفلوس فيه markers مش روتينية زي haptoglobin و hyaluronic acid."
      - kind: explain
        page: 24
        title: "علشان المعادلات تشتغل، لازم التحاليل تبقى موجودة"
        text: |
          الكتاب بيوصّي إن **ALT و AST و platelet count** يبقوا جزء من الـ **routine investigations** في الـ primary care لأي حد مشكوك إن عنده liver disease. السبب بسيط: من التلاتة دول (ومعاهم السن) تقدر تحسب الـ scores البسيطة فورًا.

          وبيوصّي كمان بـ **automatic calculation and systematic reporting** للـ **FIB-4** في الناس اللي عندهم risk (metabolic أو alcohol)، علشان الـ **risk stratification** يتحسن. يعني المعمل يطبع الـ FIB-4 تحت النتيجة لوحده من غير ما حد يفتكر.
      - kind: explain
        page: 24
        title: "الـ elastography بتقيس إيه بالظبط؟"
        text: |
          الفكرة: بنزق النسيج زقّة صغيرة ونشوف بيتصرف إزاي. الكتاب بيقول فيه طريقتين نعرض بيهم النتيجة:

          - **Display of displacement without further processing:** بنشوف الإزاحة نفسها، ودي اللي في الـ **ARFI imaging**.
          - **Display of shear wave speed:** السرعة بتتحسب من **arrival time** بتاع الـ shear wave عند أماكن مختلفة في النسيج. ودي عيلة الـ **shear wave elastography (SWE)**: **transient elastography (TE)** و **point SWE (pSWE)** و **2D-SWE و 3D-SWE**.

          وليه السرعة بتقول على التليف؟ لأن الموجة بتجري أسرع في النسيج الناشف: الكبد المتليف زي حبل مشدود، والكبد السليم زي حبل سايب.
      - kind: check
        page: 24
        question: "According to the lecture, which elastography method displays **displacement without further processing**?"
        options:
          - "ARFI imaging"
          - "Transient elastography (TE)"
          - "Point shear wave elastography (pSWE)"
          - "2D shear wave elastography"
        answer: 0
        why:
          - "صح: الكتاب بيقول الـ displacement من غير processing هو اللي في الـ **ARFI imaging**."
          - "الـ TE من عيلة الـ **shear wave speed** (SWE)، مش displacement."
          - "الـ pSWE برضه **shear wave speed**، الكتاب حاططه مع الـ SWE."
          - "الـ 2D-SWE و 3D-SWE هما الـ **multidimensional** SWE، يعني shear wave speed."
      - kind: figure
        page: 24
        title: "الطريق في الـ primary care"
        alt: "Flowchart. A patient at risk of chronic liver disease gets a risk-factor check and AST, ALT, GGT, ALP and platelets. If the cause is not only metabolic or alcohol (viral, other causes or signs of advanced disease) the patient goes to a liver specialist. If only metabolic or alcohol, calculate FIB-4. FIB-4 below 1.30 is low risk: no referral, lifestyle changes, re-test in 1 to 3 years. FIB-4 1.30 or more leads to transient elastography. Below 8 kPa is low risk. 8 kPa or more is intermediate-high risk and leads to patented serum tests: if not available or discordant, consider liver biopsy; if available and concordant, F3-F4 is highly likely."
        caption: "شوف الشجرة: الـ FIB-4 هو البوّاب، الـ TE هو التفتيش التاني، والـ patented tests هي اللي بتحسم. والـ viral hepatitis أو علامات الـ cirrhosis بيروحوا للـ **liver specialist** على طول."
        svg: |
          <svg viewBox="0 0 330 476" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L02b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
