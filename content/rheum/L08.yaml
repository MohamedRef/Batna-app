    src: { page: 159, quote: "Proposed criteria for the diagnosis of PACNS The presence of an acquired and otherwise unexplained neurologic deficit with: (a) The presence of either classic angiographic or histopathologic features of angiitis with the CNS. (b) No evidence of systemic vasculitis or any condition that could elicit the angiographic or pathologic features." }
