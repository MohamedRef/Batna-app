    topics: [lifestyle]
    goals:
      - "تدّي أرقام الرياضة والملح وتعرف ليه"
      - "تعرف أرقام البروتين وإمتى ماتقللش"
    status: unverified
    steps:
      - kind: explain
        page: 38
        quote: "Physical activity compatible with cardiovascular health, tolerance, and"
        title: "رياضة على قد القلب"
        text: |
          الكتاب بيبدأ الـ lifestyle بـ **physical activity** على قد صحة القلب والتحمّل ودرجة الـ **frailty**.

          التفسير المقبول (مش في الكتاب): الرياضة بتنزّل الضغط والسكر والوزن، والتلاتة دول أسباب hyperfiltration. وكمان بتحافظ على العضل، ومريض الـ CKD بيفقد عضل من الحموضة وقلة الأكل. بس مريض عنده heart failure أو frail مايتطلبش منه زي الشاب السليم، علشان كده الكلمة "compatible".
      - kind: explain
        page: 39
        quote: "moderate-intensity physical activity for a cumulative duration of at least 150 minutes per week, or to a level compatible with their cardiovascular and physical tolerance"
        title: "Lifestyle"
        text: |
          - رياضة متوسطة ==150 دقيقة في الأسبوع== (أو على قد ما قلبه وجسمه يستحمل)، وبلاش قعدة طول اليوم
          - **body mass index (BMI)** مظبوط، **بلاش تدخين**، نوم كفاية وعلاج الـ sleep apnea
          - أكل **plant-based** أكتر، و**ultra-processed** أقل
          - صوديوم أقل من ==2 g/day==، إلا في الـ sodium-wasting nephropathy

          التفسير المقبول (مش في الكتاب): كل بند هنا موجود **عشان** يشيل حمل عن الكلية: الرياضة والوزن بيقللوا الضغط والسكر، والتدخين **بيسبب** ضرر للأوعية، والـ sleep apnea بتعلّي الضغط بالليل.
      - kind: explain
        page: 39
        quote: "Sodium restriction to <2 g of sodium per day except in sodium-wasting"
        title: "ليه الملح والنبات؟"
        text: |
          الكتاب: أكل **plant-based** أكتر من الحيواني، **ultra-processed** أقل، و**sodium < 2 g/day**، إلا في الـ **sodium-wasting nephropathy**، واستعين بأخصائي تغذية.

          التفسير المقبول (مش في الكتاب):

          - الـ ==sodium== بيحبس مية فالضغط يعلى، وبيقلّل تأثير الـ ACEi و ARB، وبيزوّد الـ albuminuria.
          - الـ **plant-based**: البروتين النباتي بيعمل حمض أقل، والـ phosphate اللي فيه بيتمص أقل، والـ K اللي فيه بيتمص أقل (هتشوف الأرقام في ص 55).
          - الـ **ultra-processed**: مليان ملح و phosphate و potassium salts مخفيين.
          - الـ ==sodium-wasting== nephropathy: الكلية نفسها بترمي ملح، فلو منعته المريض يجف ويعمل AKI.

          باختصار: الملح **بيعلّي** الضغط والـ albuminuria، والنبات بيعمل حمض أقل، **فـ** الكلية بتتعب أقل.
