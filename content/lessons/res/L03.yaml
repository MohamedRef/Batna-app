  - id: res.L03.lesson6
    title: "هدف عام وأهداف خاصة… وتصليح الغلط"
    hook: "هدف واحد كبير بيتقسم لحتت صغيرة، وأي حتة ناقصها مكان أو وقت هتتمسك عليك."
    minutes: 8
    pages: [57, 64]
    topics: [objectives]
    goals:
      - "تفرّق بين الـ general والـ specific objectives"
      - "تكتشف الناقص في أي objective: verb، population، place، time"
    status: unverified
    steps:
      - kind: explain
        page: 57
        quote: "Types of Research Objectives. Commonly, research objectives are classified into:\n  general objectives\n  specific objectives.\nThe general and specific objectives are logically connected to each other and the specific objectives are commonly considered as smaller portions of the general objectives.\nIt is important to ascertain that the general objective is closely related to the statement of the problem."
        title: "General و Specific"
        text: |
          - الـ ==general objective== بيقول **in general terms** البحث هيحقق إيه وليه، ولازم يكون **closely related to the statement of the problem**.
          - الـ ==specific objectives== هي **smaller portions** منه: بتقول **in greater detail** هتعمل إيه، فين، وعلشان إيه، وبتغطي جوانب المشكلة **systematically**.
      - kind: figure
        page: 62
        quote: "Example:\nGeneral objective: To estimate prevalence of depression among diabetes mellitus patients attending Smouha Health Center in Alexandria.\nSpecific objectives:\n  1- Identify the socio-demographic characteristics of patients with diabetes attending Smouha Health Center\n  2- Determine the prevalence of depression among diabetic patients attending Smouha Health Center\n  3- Identify risk factors that may predispose to development of depression among diabetic patients attending Smouha Health Center."
        title: "مثال سموحة"
        alt: "A tree: the general objective box at the top (estimate prevalence of depression among diabetic patients at Smouha Health Center, Alexandria) branches into three specific objectives: socio-demographic characteristics, prevalence of depression, risk factors for depression."
        caption: "هدف عام واحد فوق، وتحته 3 أهداف خاصة. لاحظ إن كل specific objective بيبدأ بـ action verb وفيه نفس المكان."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="76" rx="8" class="fg-acc"/>
            <text x="165" y="32" text-anchor="middle" class="t-sm t-mut">General objective</text>
            <text x="165" y="52" text-anchor="middle" class="t-sm t-b">Estimate prevalence of depression</text>
            <text x="165" y="70" text-anchor="middle" class="t-sm t-b">among DM patients, Smouha HC</text>
            <path d="M165 86v24M40 110h250M40 110v18M165 110v18M290 110v18" class="fg-ink"/>
            <rect x="10" y="130" width="310" height="60" rx="8" class="fg-good"/>
            <text x="20" y="153" class="t-sm t-b">1. Identify</text>
            <text x="20" y="173" class="t-sm">socio-demographic characteristics</text>
            <rect x="10" y="200" width="310" height="60" rx="8" class="fg-good"/>
            <text x="20" y="223" class="t-sm t-b">2. Determine</text>
            <text x="20" y="243" class="t-sm">prevalence of depression</text>
            <rect x="10" y="270" width="310" height="60" rx="8" class="fg-good"/>
            <text x="20" y="293" class="t-sm t-b">3. Identify</text>
            <text x="20" y="313" class="t-sm">risk factors for depression</text>
            <text x="10" y="350" class="t-sm t-mut">Specific = smaller portions of the general</text>
          </svg>
      - kind: check
        page: 61
        quote: "Example 2. A study looking into factors influencing utilization of maternal health care services in X District has the following objectives:\nGeneral objective: To assess factors influencing utilization of maternal healthcare services in District X.\nSpecific Objectives:\n  To assess the knowledge, attitude and practice of pregnant women regarding antenatal care, and TT vaccination,\n  To identify factors that influence women's attendance at antenatal care (ANC) and institutional delivery care services,\n  To identify the sources of delivery service and mothers' preference of place of delivery,\n  To determine coverage with ANC and TT vaccination among mothers."
        question: "In a study of factors influencing use of maternal health services in District X, \"To determine coverage with antenatal care (ANC) and tetanus toxoid (TT) vaccination among mothers\" is:"
