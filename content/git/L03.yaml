    src: { page: 133, quote: "Patients in whom SOD is suspected have the highest complication rates for ERCP. Such patients have a 3-fold increase in the risk of post-ERCP pancreatitis, with absolute rates exceeding 25% if no prophylactic interventions are implemented." }
