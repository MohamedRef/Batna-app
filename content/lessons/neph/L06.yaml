lecture: neph.L06
lessons:
  # ------------------------------------------------------------------
  - id: neph.L06.lesson1
    title: "الميه والصوديوم: مين بيلعب بالـ Na؟"
    hook: "الصوديوم الواطي مش دايمًا نقص صوديوم. أوقات ميه زيادة، وأوقات سكر، وأوقات المعمل بيضحك عليك."
    minutes: 8
    pages: [127, 129]
    topics: [water, sodium, hypo-types, hypo-volume]
    goals:
      - "تفهم الـ osmoreceptors والـ ADH بيظبطوا الميه إزاي"
      - "تفرّق الـ hypertonic والـ pseudo والـ hypotonic hyponatremia"
      - "تمشي في الـ algorithm بالـ volume status والـ urine Na"
    status: unverified
    steps:
      - kind: explain
        page: 127
        title: "ترموستات الميه"
        quote: "BW is mainly regulated by cerebral and peripheral osmoreceptors capable of sensing changes in ECF osmolality"
        text: |
          الجسم عنده ==osmoreceptors== في المخ وبرّه، بتحس بالـ **osmolality** بتاعة الـ ECF.

          - الـ osmolality عليت؟ ييجي **عطش** ويتفرز **ADH** (vasopressin) من الـ pituitary.
          - الـ osmolality نزلت (شربت ميه كتير)؟ العطش والـ ADH يقفوا، والبول يبقى مخفف، والـ osmolality ترجع **285 mOsmol/kg** في حوالي **6 ساعات**.
          - ناشف؟ ADH يحبس الميه والبول يبقى مركّز جدًا، والعطش هو اللي يعوّض النقص في الآخر.
      - kind: figure
        page: 127
        quote: "ADH binds V 2 (vasopressin) receptors on the Basolateral aspect of the principal cells in the collecting duct"
        title: "الـ ADH بيفتح شبابيك الميه"
        alt: "A collecting duct principal cell. ADH from the blood side binds the V2 receptor on the basolateral membrane; aquaporin channels move to the apical (urine) membrane; water flows from the tubule lumen through the cell into the hypertonic interstitium."
        caption: "الـ ==ADH== بيمسك في **V2** على الناحية الـ basolateral، فالـ **aquaporins** تطلع على الناحية الـ apical، والميه تعدّي للـ interstitium الـ hypertonic."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L06a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="L06b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <rect x="5" y="20" width="85" height="200" rx="6" class="fg-thin"/>
            <text x="47" y="40" text-anchor="middle" class="t-sm t-b">Tubule lumen</text>
            <text x="47" y="56" text-anchor="middle" class="t-sm t-mut">(urine)</text>
            <rect x="100" y="20" width="130" height="200" rx="10" class="fg-box"/>
            <text x="165" y="40" text-anchor="middle" class="t-sm t-b">Principal cell</text>
            <rect x="240" y="20" width="85" height="200" rx="6" class="fg-acc"/>
            <text x="282" y="40" text-anchor="middle" class="t-sm t-b">Interstitium</text>
            <text x="282" y="56" text-anchor="middle" class="t-sm t-mut">(hypertonic)</text>
            <circle cx="232" cy="90" r="9" class="fg-dot-acc"/>
            <text x="282" y="94" text-anchor="middle" class="t-sm t-acc">ADH → V2</text>
            <path d="M222 94 L114 124" class="fg-arrow-acc" marker-end="url(#L06b)"/>
            <rect x="94" y="115" width="14" height="30" rx="3" class="fg-good"/>
            <text x="170" y="138" text-anchor="middle" class="t-sm">aquaporins</text>
            <text x="170" y="152" text-anchor="middle" class="t-sm">move apical</text>
            <path d="M40 175 L300 175" class="fg-arrow" marker-end="url(#L06a)"/>
            <text x="165" y="195" text-anchor="middle" class="t-sm t-b">H2O</text>
            <text x="165" y="211" text-anchor="middle" class="t-sm t-mut">free water reabsorbed</text>
          </svg>
      - kind: explain
        page: 128
        title: "الصوديوم: الكلية هي المدير"
        quote: "Kidneys are the principal regulator"
        text: |
          الـ Na الطبيعي **135–145 mEq/L**، وهو ==principal active solute== اللي ماسك حجم الدم والـ interstitium.

          بيتمص من الأمعاء كلها بالـ Na/K-ATPase، لكن **الكلية هي المدير**:
          - **PCT**: يرجّع **2/3** الـ Na المترشح.
          - **Loop of Henle**: الـ countercurrent system للـ Na والميه.
          - **DCT والـ collecting duct**: الـ ==aldosterone== بيرجّع زيادة.
      - kind: explain
        page: 128
        title: "Hyponatremia: هادي بس خطيرة"
        quote: "In hospital, symptomatic hyponatraemia is associated with a mortality of 10-50%."
        text: |
          الـ ==hyponatremia== = Na أقل من **135**.

          أغلب العيانين **مفيش عندهم أعراض**، بس الـ perception والمشي بيتلخبطوا كل ما الـ Na ينزل. أما الـ **symptomatic** في المستشفى فـ mortality **10–50%**. يعني ما تستهونش بيها.
      - kind: reveal
        page: 128
        quote: "Extracellular hypertonicity associated with hyperglycemia favors efflux of water into the extracellular space, in turn decreasing the [Na+]."
        prompt: "عيان DKA سكره 700 والـ Na بتاعه 128. هل عنده نقص صوديوم؟"
        answer: "غالبًا لأ. ده ==translocational (hypertonic) hyponatremia==: السكر العالي بيشد **ميه من جوّه الخلايا** للـ ECF فيخفف الـ Na. الـ tonicity هنا **أكتر من 295**. والقاعدة: الـ Na بينزل **1.6 mEq/L لكل 100 mg/dL** زيادة في السكر."
      - kind: aside
        tone: analogy
        page: 129
        quote: "[Na+] decreases by 1.6 mEq/L for every 100 mg/dL increase in serum glucose level."
        text: "زي كوباية شاي سكرها زيادة: تحط ميه عليها، **التركيز** بيقل وكمية السكر زي ما هي. الـ glucose هنا هو اللي بيجيب الميه من الخلايا ويخفف الـ Na."
      - kind: mnemonic
        page: 129
        quote: "Glycine- or sorbitol-containing bladder irrigants may also be absorbed."
        word: "LIPG"
        parts:
          - { key: "L", text: "Lipids high" }
          - { key: "I", text: "Increased plasma proteins (myeloma)" }
          - { key: "P", text: "Plus hyperglycemia" }
          - { key: "G", text: "Glycine or sorbitol bladder irrigants" }
        hook: "**LIPG** للـ ==pseudohyponatremia==: المعمل بيقرا Na واطي والجسم مش واطي فعلًا (إلا الـ irrigants اللي بتتمص)."
      - kind: figure
        page: 129
        quote: "Assess volume status"
        title: "الـ algorithm: شوف الـ volume الأول"
        alt: "Hyponatremia algorithm. Assess volume status. Hypovolemia: urine Na above 20 means renal losses (diuretics, mineralocorticoid deficiency, salt-losing nephropathy, cerebral salt wasting); below 20 means extrarenal losses (vomiting, diarrhea, third spacing). Euvolemia: glucocorticoid deficiency, hypothyroidism, stress, drugs, SIADH. Hypervolemia: urine Na above 20 means kidney injury; below 20 means nephrotic syndrome, cirrhosis, heart failure."
        caption: "سؤالين بس: العيان **ناشف ولا طبيعي ولا وارم**؟ وبعدين الـ ==urine Na== أكتر ولا أقل من **20**؟"
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <rect x="85" y="5" width="160" height="28" rx="8" class="fg-ink"/>
            <text x="165" y="24" text-anchor="middle" class="t-b">Assess volume status</text>
            <rect x="5" y="45" width="320" height="95" rx="8" class="fg-bad"/>
            <text x="15" y="64" class="t-b">Hypovolemia (TBW ↓, Na ↓↓)</text>
            <text x="15" y="84" class="t-sm">Urine Na &gt;20: renal losses</text>
            <text x="25" y="100" class="t-sm t-mut">diuretics, mineralocorticoid def., salt-losing</text>
            <text x="25" y="114" class="t-sm t-mut">nephropathy, osmotic diuresis, cerebral salt wasting</text>
            <text x="15" y="132" class="t-sm">Urine Na &lt;20: vomiting, diarrhea, third spacing</text>
            <rect x="5" y="150" width="320" height="75" rx="8" class="fg-box"/>
            <text x="15" y="169" class="t-b">Euvolemia, no edema (TBW ↑, Na =)</text>
            <text x="15" y="189" class="t-sm">Urine Na &gt;20</text>
            <text x="15" y="207" class="t-sm t-mut">glucocorticoid def., hypothyroidism, stress,</text>
            <text x="15" y="221" class="t-sm t-mut">drugs, SIADH</text>
            <rect x="5" y="235" width="320" height="85" rx="8" class="fg-acc"/>
            <text x="15" y="254" class="t-b">Hypervolemia (TBW ↑↑, Na ↑)</text>
            <text x="15" y="276" class="t-sm">Urine Na &gt;20: acute or chronic kidney injury</text>
            <text x="15" y="298" class="t-sm">Urine Na &lt;20: nephrotic syndrome, cirrhosis,</text>
            <text x="25" y="312" class="t-sm">cardiac failure</text>
          </svg>
      - kind: sort
        page: 129
        quote: "Assess volume status"
        prompt: "حط كل سبب في الـ volume status بتاعه:"
        bins: ["Hypovolemia", "Euvolemia", "Hypervolemia"]
        cards:
          - { text: "Vomiting", bin: 0 }
          - { text: "Cerebral salt wasting", bin: 0 }
          - { text: "SIADH", bin: 1 }
          - { text: "Hypothyroidism", bin: 1 }
          - { text: "Glucocorticoid deficiency", bin: 1 }
          - { text: "Cirrhosis", bin: 2 }
          - { text: "Nephrotic syndrome", bin: 2 }
          - { text: "Burns (third spacing)", bin: 0 }
        why: "الناشف خسر Na أكتر من الميه (من الكلية أو برّه). الـ euvolemic زادت ميته من غير ما الـ Na يتغير. الوارم زاد الاتنين والميه أكتر."
      - kind: explain
        page: 129
        title: "الأعراض: المخ بينفخ"
        quote: "Symptoms due to cerebral swelling as osmolality falls: the encephalopathy."
        text: |
          الأعراض جاية من ==cerebral swelling==: الـ osmolality بتنزل فالميه تدخل خلايا المخ.

          - **نادرة** لو chronic أو Na **فوق 125**.
          - **شائعة** لو acute أو Na **تحت 110**: صداع، apathy، confusion (خصوصًا الكبار)، تشنجات و coma.
      - kind: check
        page: 129
        quote: "Common in acute hyponatremia or Na <110mmol/L"
        question: "Which hyponatremic patient is most likely to have symptoms?"
        options:
          - "Na 112 that fell over 12 hours"
          - "Na 128 for 3 months"
          - "Na 130 with hyperglycemia"
          - "Na 126 for years in heart failure"
        answer: 0
        why:
          - "صح: acute ونازل بسرعة وقريب من 110، المخ ملحقش يتأقلم."
          - "Chronic وفوق 125: الأعراض نادرة."
          - "ده غالبًا translocational، والـ Na فوق 125."
          - "Chronic وفوق 125."
      - kind: try
        items: [neph.L06.005, neph.L06.015, neph.L06.016, neph.L06.018, neph.L06.020]
    recap:
      - "الـ osmoreceptors بتشغّل العطش والـ ADH؛ الـ ADH على V2 بيطلّع الـ aquaporins."
      - "Na طبيعي 135–145؛ الكلية المدير: PCT 2/3، loop، aldosterone."
      - "Hypertonic hyponatremia (>295) = السكر: Na ينزل 1.6 لكل 100 mg/dL."
      - "Pseudo = LIPG: lipids، proteins (myeloma)، glucose، glycine irrigants."
      - "الـ algorithm: volume status ثم urine Na فوق أو تحت 20."
      - "الأعراض من الـ cerebral swelling: نادرة فوق 125 أو chronic، شائعة تحت 110 أو acute."
    practice: [neph.L06.001, neph.L06.002, neph.L06.003, neph.L06.004, neph.L06.005, neph.L06.006, neph.L06.007, neph.L06.008, neph.L06.009, neph.L06.010, neph.L06.011, neph.L06.012, neph.L06.013, neph.L06.014, neph.L06.015, neph.L06.016, neph.L06.017, neph.L06.018, neph.L06.019, neph.L06.020, neph.L06.021, neph.L06.022, neph.L06.023, neph.L06.024]
  # ------------------------------------------------------------------
  - id: neph.L06.lesson2
    title: "SIADH والعلاج: ارفع الـ Na بس ما تجريش"
    hook: "الـ hypertonic saline بينقذ المخ، وبرضه لو استعجلت بيكسّر الـ pons. الفرق رقم واحد: 12."
    minutes: 9
    pages: [130, 132]
    topics: [siadh, hypo-treat, ods]
    goals:
      - "تحفظ الـ Bartter and Schwartz criteria والأرقام بتاعتها"
      - "تعالج حسب الأعراض والمدة (48 ساعة)"
      - "تعرف حدود التصحيح والـ ODS"
    status: unverified
    steps:
      - kind: explain
        page: 130
        title: "SIADH: ADH شغال من غير سبب"
        quote: "Bartter & Schwartz Criteria for SIADH"
        text: |
          الـ ==SIADH== = ADH بيتفرز رغم إن الـ osmolality واطية، فالكلية تحبس ميه.

          **Bartter & Schwartz criteria**:
          - **Hypotonic**: serum osm **أقل من 275**.
          - **Euvolemia**.
          - بول **مش مخفف للآخر**: urine osm **أكتر من 100**.
          - **Urine Na أكتر من 30** مع أكل وشرب عادي.
          - مفيش kidney disease متقدم ولا cirrhosis ولا heart failure.
          - مفيش hypothyroidism ولا نقص glucocorticoid ولا diuretics.
      - kind: mnemonic
        page: 130
        quote: "Hypotonic hyponatremia (effective Sosm < 275 mOsm/kg"
        word: "SIADH"
        parts:
          - { key: "S", text: "Serum osm < 275 (hypotonic)" }
          - { key: "I", text: "Isovolemic: euvolemia" }
          - { key: "A", text: "Above 100: urine osm not maximally dilute" }
          - { key: "D", text: "Discharging Na: urine Na > 30" }
          - { key: "H", text: "Heart, liver, kidney, thyroid, adrenal, diuretics: all excluded" }
        hook: "الاسم نفسه هو الـ criteria. الأرقام بالترتيب: **275، 100، 30**."
      - kind: explain
        page: 130
        title: "أدلة زيادة"
        quote: "Additional Data Supporting Diagnosis of SIADH"
        text: |
          أدلة تانية تدعّم الـ **SIADH**:

          - **Serum uric acid أقل من 4 mg/dL** و FE uric acid **أكتر من 10%**.
          - الـ Na ==بيسوء مع normal saline== (الكلية بتطلّع الملح وتحبس الميه).
          - **Vasopressin أو copeptin** عالي بالنسبة للـ osmolality.
          - **Water load test** غلط: يطلّع أقل من 80% من 20 mL/kg في 4 ساعات، والبول ما يتخففش تحت 100.
      - kind: aside
        tone: trap
        page: 130
        quote: "Worsening of hyponatremia with IV normal saline solution"
        text: "فخ كلاسيكي: تدي عيان SIADH **normal saline** والـ Na **ينزل أكتر**. الملح بيخرج في البول المركّز والميه بتفضل. علشان كده الـ SIADH بيتعالج بـ **water restriction** مش saline."
      - kind: match
        page: 130
        quote: "Box 4, Common Causes of SIADH"
        prompt: "وصّل كل مثال بمجموعته في أسباب الـ SIADH:"
        pairs:
          - ["Meningitis, head trauma", "CNS disease"]
          - ["Carbamazepine, SSRIs, vincristine", "Drugs"]
          - ["Small cell lung carcinoma", "Malignancy"]
          - ["Pneumonia, TB, COPD", "Pulmonary disease"]
          - ["HIV, postoperative state", "Other"]
        why: "أشهر malignancy هو ==small cell carcinoma of the lung==، بعده head and neck و non-small cell."
      - kind: figure
        page: 131
        quote: "Emergency correction needed"
        title: "العلاج: أعراض؟ ومن إمتى؟"
        alt: "Treatment algorithm. Symptomatic acute (under 48 h): emergency correction with 3% saline 1-2 mL/kg/h plus furosemide. Symptomatic chronic (over 48 h or unknown): some immediate correction, 3% saline if seizures otherwise isotonic saline, furosemide 20 mg IV, switch to water restriction after a 10% rise; do not exceed 12 mmol/L in 24 h, goal 8. Asymptomatic chronic: no immediate correction. Then long-term: treat cause, water restriction, demeclocycline, urea 15-60 g daily, V2 antagonist."
        caption: "القاعدة الذهبية في الـ chronic: ما تعدّيش **12 mmol/L في 24 ساعة**، والهدف ==8==."
        svg: |
          <svg viewBox="0 0 330 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L06c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="5" y="5" width="320" height="58" rx="8" class="fg-bad"/>
            <text x="15" y="24" class="t-b">Symptomatic, acute (&lt;48 h)</text>
            <text x="15" y="42" class="t-sm">Emergency: 3% saline 1–2 mL/kg/h</text>
            <text x="15" y="56" class="t-sm">+ furosemide</text>
            <rect x="5" y="72" width="320" height="104" rx="8" class="fg-acc"/>
            <text x="15" y="91" class="t-b">Symptomatic, chronic (&gt;48 h / unknown)</text>
            <text x="15" y="109" class="t-sm">3% saline if seizures, else isotonic saline</text>
            <text x="15" y="124" class="t-sm">Furosemide 20 mg IV</text>
            <text x="15" y="139" class="t-sm">Water restriction after Na rises 10%</text>
            <text x="15" y="160" class="t-sm t-b t-bad">Max 12 mmol/L per 24 h, goal 8</text>
            <rect x="5" y="185" width="320" height="34" rx="8" class="fg-good"/>
            <text x="15" y="207" class="t-b">Asymptomatic chronic: no immediate correction</text>
            <path d="M165 220 L165 236" class="fg-arrow" marker-end="url(#L06c)"/>
            <rect x="5" y="238" width="320" height="76" rx="8" class="fg-box"/>
            <text x="15" y="257" class="t-b">Long-term</text>
            <text x="15" y="274" class="t-sm">Treat cause · water restriction</text>
            <text x="15" y="290" class="t-sm">Demeclocycline 300–600 mg bid (2 weeks)</text>
            <text x="15" y="306" class="t-sm">Urea 15–60 g/day · V2 receptor antagonist</text>
          </svg>
      - kind: update
        page: 131
        quote: "Do not correct serum [Na+] >12 mmol/24 hours"
        text: "الـ European guideline سنة 2014 بيحط الحد **10 mmol/L في أول 24 ساعة** و 8 في كل 24 ساعة بعدها. في امتحان القسم اكتب رقم الكتاب: **12، والهدف 8**."
        ref: "European clinical practice guideline on hyponatraemia (ESE/ESICM/ERBP) 2014"
      - kind: explain
        page: 131
        title: "الـ hypertonic saline بيعمل إيه؟"
        quote: "Both 3% and 5% hypertonic saline (HS) is currently FDA-approved for use in hyponatremia and increased intracranial pressure (ICP)."
        text: |
          الـ **3% و 5%** معتمدين للـ hyponatremia والـ **ICP العالي**.

          بيرفع الـ osmolarity فيسحب ميه من برّه الأوعية لجوّه: ==brain edema== يقل، الـ cerebral blood flow يتحسن، والـ CSF يقل.

          مقارنة بالـ **20% mannitol**: نفس تأثير الـ ICP، بس الـ saline بيرفع الـ Na و **diuresis أقل** (الـ Na بيطلّع ADH)، ومحتاج **حجم أقل**.
      - kind: explain
        page: 132
        title: "أرقام لازم تتحفظ"
        quote: "Each 1 ml/kg/h of 3% saline solution administered can be expected to increase [na+] by 1 meq/l/h."
        text: |
          - Severe hyponatremia: صحّح **4–6 mEq/L في اليوم**، بـ **boluses 100 mL** من 3% كل **10 دقايق**، لحد **3 boluses**.
          - كل ==1 mL/kg/h== من 3% بيرفع الـ Na حوالي **1 mEq/L/h**.
          - الأحسن **central line**؛ الـ peripheral ينفع لو مفيش غيره.
      - kind: check
        page: 132
        quote: "Each 1 ml/kg/h of 3% saline solution administered can be expected to increase [na+] by 1 meq/l/h."
        question: "A 70-kg patient gets 3% saline at 70 mL/h. Expected Na rise per hour?"
        options:
          - "About 1 mEq/L/h"
          - "About 0.1 mEq/L/h"
          - "About 3 mEq/L/h"
          - "About 7 mEq/L/h"
        answer: 0
        why:
          - "صح: 70 mL/h ÷ 70 kg = 1 mL/kg/h، يعني حوالي 1 mEq/L كل ساعة."
          - "أقل بكتير من القاعدة."
          - "ده لو 3 mL/kg/h."
          - "خلطت بين الـ mL والـ mEq."
      - kind: explain
        page: 132
        title: "الأعراض الجانبية والـ ODS"
        quote: "Sequelae of ODS are often irreversible and include dysphagia, dysarthria, spasticity, behavioral disturbance, cognitive impairment, delirium"
        text: |
          الـ hypertonic saline ممكن يعمل:
          - **Hyperchloremic metabolic acidosis** (NaCl زيادة).
          - **Hypernatremia** مع الاستعمال الطويل.
          - مشاكل الـ IV (الأشهر): infection، thrombophlebitis، extravasation، و hypervolemia. خلي بالك في الـ **CHF و renal insufficiency**.

          والأخطر ==osmotic demyelination syndrome==: خلية المخ في الـ chronic hyponatremia رمت الـ **organic osmolytes** علشان ما تنفخش. لو الـ tonicity طلعت أسرع ما تلحق ترجّعهم، **تنكمش**. النتيجة غالبًا **irreversible**: dysphagia، dysarthria، spasticity، quadriparesis، و **locked-in**.
      - kind: aside
        tone: joke
        page: 132
        quote: "Osmotic demyelin- ation syndrome (ODS) can occur if correction of hypo-natremia is achieved too rapidly."
