          الكتاب: ==فوق 50، asymptomatic، average risk==، بس **أبدري** لأغلب اللي عندهم خطر زيادة من **family history** أو أمراض معينة.
          والـ tests نوعين: **visual examinations** (colonoscopy، CT colonography، double-contrast barium enema، flexible sigmoidoscopy) و **stool tests** (FIT، high-sensitivity guaiac، FIT-DNA).

          التفسير المقبول (مش في الكتاب): الفرق الجوهري بين النوعين: الـ visual بيلاقي **البوليب** قبل ما يبقى سرطان، فبيمنع المرض. الـ stool test بيلاقي **الدم**، والبوليب الصغير غالبًا ما بينزفش، فهو أحسن في إنه يلاقي السرطان بدري من إنه يمنعه. وده السبب إن أي stool test positive لازم بعده colonoscopy.
