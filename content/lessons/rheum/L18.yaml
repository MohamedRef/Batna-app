  - id: rheum.L18.lesson2
    title: "من البُق للكلى: الصورة الإكلينيكية"
    hook: "Sjögren مش بس عين وبُق: نص العيانين عندهم جلد، وفيه كلى وأعصاب ومفاصل ورئة."
    minutes: 8
    pages: [303, 304]
    topics: [glandular, extraglandular]
    goals:
      - "تعدّ الـ glandular manifestations وتعرف سبب كل واحدة"
      - "تمشي على الـ systems: جلد، كلى، أعصاب، مفاصل، رئة، أمعاء"
      - "تفتكر الأرقام: 50، 22، 53، 22"
    status: unverified
    steps:
      - kind: explain
        page: 303
        title: "البُق والعين"
        quote: "Clinical picture\n  Glandular manifestations Dry mouth (xerostomia).\n  Parotits, swellimg of salivary glands.\n  Cracked, peeling and atrophic appearance of lips.\n  Dry fissured tongue, oral candidiasis.\n  Dental caries and loss of teeth.\n  Lacrimal gland involvement:\n    Burning and itchy eye sensation.\n    Dryness of the eyes (keratoconjunctivits sicca."
        text: |
          **البُق:** ==xerostomia==، **parotitis** وتورم الغدد، شفايف **cracked, peeling, atrophic**، لسان **dry fissured**، **oral candidiasis**، و **dental caries** ووقوع سنان.

          **العين:** **burning** و **itching**، وجفاف = **keratoconjunctivitis sicca**.

          **المهبل:** dryness و burning.

          يعني كل الأعراض دي نتيجة حاجة واحدة: الغدة الـ exocrine اللي بتعمل الريق أو الدموع أو إفرازات المهبل اتملت lymphocytes وبطّلت تشتغل.
      - kind: figure
        page: 303
        quote: "Glandular manifestations Dry mouth (xerostomia)."
        title: "الغدد الأول، وبعدين الجسم"
        alt: "Two columns. Glandular (exocrine): eyes dry and burning, mouth dry with caries and candida, parotid swelling, lips cracked, vagina dry. Extraglandular: skin 50% (xeroderma, Sweet syndrome), kidney (nephrotic, vasculitis with hypertension), nerves (sensory neuropathy 22%), joints (arthralgia 53%, small asymmetric), lung (cough from xerotrachea), gut (malabsorption, pancreatitis, hepatitis)."
        caption: "على الشمال الـ **glandular**: كل غدة exocrine بتنشف. على اليمين الـ ==extraglandular==: نفس الـ lymphocytes بتروح الجلد والكلى والأعصاب والمفاصل والرئة والأمعاء."
        svg: |
          <svg viewBox="0 0 330 280" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="8" width="140" height="264" rx="8" class="fg-acc"/>
            <text x="78" y="30" text-anchor="middle" class="t-b">Glandular</text>
            <text x="18" y="58" class="t-sm">Eyes: dry, burning</text>
            <text x="18" y="84" class="t-sm">Mouth: dry, caries</text>
            <text x="18" y="102" class="t-sm">candida</text>
            <text x="18" y="128" class="t-sm">Parotid swelling</text>
            <text x="18" y="154" class="t-sm">Lips: cracked</text>
            <text x="18" y="180" class="t-sm">Vagina: dry</text>
            <rect x="158" y="8" width="164" height="264" rx="8" class="fg-box"/>
            <text x="240" y="30" text-anchor="middle" class="t-b">Extraglandular</text>
            <text x="168" y="58" class="t-sm">Skin 50%</text>
            <text x="168" y="84" class="t-sm">Kidney: nephrotic, HTN</text>
            <text x="168" y="110" class="t-sm">Nerve: sensory 22%</text>
            <text x="168" y="136" class="t-sm">Joints: arthralgia 53%</text>
            <text x="168" y="162" class="t-sm">Lung: cough</text>
            <text x="168" y="188" class="t-sm">Gut: malabsorption</text>
            <text x="168" y="206" class="t-sm">pancreatitis, hepatitis</text>
          </svg>
      - kind: reveal
        page: 303
        quote: "Clinical picture\n  Glandular manifestations Dry mouth (xerostomia).\n  Parotits, swellimg of salivary glands.\n  Cracked, peeling and atrophic appearance of lips.\n  Dry fissured tongue, oral candidiasis.\n  Dental caries and loss of teeth.\n  Lacrimal gland involvement:\n    Burning and itchy eye sensation.\n    Dryness of the eyes (keratoconjunctivits sicca."
        prompt: "ليه عيان Sjögren سنانه بتسوّس وبتجيله candidiasis في البُق؟"
        answer: |
          الريق مش بس مية: فيه **antibacterial** و **antifungal** proteins، وبيغسل الأكل من على السنان ويعادل الـ acid.

          لما الريق يقل، البكتيريا تاكل السنان (**caries**) والـ **Candida** تلاقي فرصتها. (تفسير فسيولوجي، والقائمة من الكتاب.)
      - kind: explain
        remind: [rheum.L18.025]
        page: 303
        title: "الجلد والكلى"
        quote: "Dermatological manifestations: It represents 50% of manifestations.\n  Xeroderma, scaling, pruritus.\n  Annular, popular erythema including SWEET syndrome."
        text: |
          - **Skin** = ==50%== من الـ manifestations: **xeroderma**، scaling، **pruritus**، و **annular papular erythema** ومنها **Sweet syndrome**.
          - **Renal:** **hematuria**، **proteinuria**، **nephrotic syndrome**، **renal vasculitis** مع hypertension واضح، و **renal insufficiency**.

          السبب في الخطوتين الجايين: الجلد من الغدد الضامرة، والكلى من الـ lymphocytes والأوعية.
      - kind: reveal
        page: 303
        quote: "Xeroderma, scaling, pruritus."
        prompt: "ليه جلد عيان Sjögren ناشف وبيهرش (xeroderma، pruritus)؟"
        answer: |
          ارجع للـ pathology في ص 302: الـ ==atrophy== مش في الغدد اللعابية بس، كمان في الـ **sebaceous glands** والـ **sweat glands**.

          يعني الجلد فقد الزيت والعرق اللي بيرطّبوه، فينشف ويتقشّر (scaling) ويهرش. نفس المرض، غدة exocrine تانية. وده سبب إن الجلد **50%** من الـ manifestations في الكتاب.
      - kind: reveal
        page: 303
        quote: "Renal vasculitis with significant hypertension."
        prompt: "ليه الكلى بتتأثر في مرض أصله غدد؟"
        answer: |
          التفسير المقبول (مش في الكتاب): نفس الـ **lymphocytes** اللي بتدخل الغدد بتدخل الكلى، وكمان الـ **immune complexes** ممكن تترسّب في الأوعية. علشان كده الكتاب بيذكر نوعين من الضرر:
          - **Hematuria، proteinuria، nephrotic syndrome**: الـ glomerulus اتأثر.
          - **Renal vasculitis مع hypertension واضح**: الأوعية نفسها ملتهبة، فالكلية تحس إن الدم قليل وتعلّي الضغط.

          والنتيجة في الآخر ممكن **renal insufficiency**. يعني افحص البول والضغط في كل متابعة، مش بس العين والبُق.
      - kind: table
        page: 304
        quote: "Peripheral neuropathy, primarily sensory, was found in 22% of patients with primary SS."
        title: "الأعصاب والمفاصل بالأرقام"
        columns: [Feature, Book]
        rows:
          - ["Peripheral neuropathy", "Mainly sensory, 22%"]
          - ["CNS disease", "Very rare"]
          - ["Arthritis pattern", "Intermittent, asymmetrical, small joints"]
          - ["Arthralgia", "Up to 53%"]
          - ["Myalgia", "Up to 22%"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: tip
        page: 304
        quote: "Musculoskeletal\n  Joint disease in primary SS is typically an intermittent asymmetrical poly-articular.\n  Arthropathy primarily affecting small joints.\n  Joint deformity and mild erosions occur.\n  Arthralgia's exist in as many as 53% of patients.\n  Myalgia's in as many as 22% of Sijogren patients."
        text: "المفاصل في الـ primary Sjögren syndrome (SS): **intermittent** و **asymmetrical** و **small joints**، وممكن **mild erosions** و deformity. افتكر **22 / 53 / 22**: neuropathy، arthralgia، myalgia."
      - kind: check
        page: 304
        quote: "Peripheral neuropathy, primarily sensory, was found in 22% of patients with primary SS."
        question: "A woman with primary Sjögren has numb, burning feet. Which fits the book?"
        options: ["Peripheral sensory neuropathy, about 22%", "CNS disease, the commonest form", "Motor neuropathy, about 53%", "Never seen in Sjögren"]
        answer: 0
        why:
          - "صح: peripheral neuropathy، primarily sensory، في 22%."
          - "الـ CNS نادر جدًا."
          - "الـ 53% دي الـ arthralgia مش neuropathy، والنوع sensory مش motor."
          - "الكتاب بيذكرها في 22%."
      - kind: explain
        remind: [rheum.L18.030]
        page: 304
        title: "الرئة والأمعاء"
        quote: "Cough is often the main respiratory symptom and is usually a symptom of xero-trachea."
        text: |
          الرئة **common** بس نادرًا **clinically significant**.

          - ==Cough== هو العرض الرئيسي، وسببه غالبًا **xerotrachea** (الـ trachea نفسها ناشفة).
          - مضاعفات تانية: **lymphocytic alveolitis**، **lymphocytic interstitial pneumonitis**، **fibrosis**، **pseudolymphoma**.

          **Gastrointestinal tract (GIT):** malabsorption، **pancreatitis**، **hepatitis**، sialadenitis.

          يعني نفس الفكرة: الـ trachea فيها غدد بتعمل mucus، لما تنشف الكحة تيجي (xerotrachea). والـ pancreas نفسه غدة exocrine، علشان كده الـ pancreatitis والـ malabsorption في القايمة (التفسير المقبول، مش في الكتاب).
      - kind: check
        page: 304
        quote: "Cough is often the main respiratory symptom and is usually a symptom of xero-trachea."
        question: "Which is TRUE about Sjögren syndrome in the lecture?"
        options:
          - "Cough is usually from xerotrachea"
          - "CNS disease is the commonest neurological form"
          - "The arthritis is symmetrical large-joint"
          - "Lung disease is usually clinically severe"
        answer: 0
        why:
          - "صح: الـ cough غالبًا من الـ xerotrachea."
          - "الـ central nervous system (CNS) نادر جدًا؛ الشائع peripheral sensory neuropathy (22%)."
          - "الـ arthritis asymmetrical وفي الـ small joints."
          - "الرئة common بس seldom clinically significant."
