        why: "ده جدول صفحة 44. لاحظ إن الـ asymptomatic hyperuricaemia الكتاب مش بيعالجها بدوا (صفحة 45)."
      - kind: check
        page: 45
        quote: "There is insufficient evidence to recommend treatment of asymptomatic hyperuricemia to prevent gouty arthritis, renal disease or cardiovascular events."
        question: "Uric acid 9 mg/dL, no gout, no stones. What does the book recommend?"
        options: ["Find and manage the cause; no ULT", "Allopurinol 100 mg", "Febuxostat 40 mg", "Colchicine prophylaxis"]
        answer: 0
        why:
