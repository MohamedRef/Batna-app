  - id: hem.L09.lesson6
    title: "صفائح عالية: ET ولا مجرد رد فعل؟"
    hook: "أغلب الصفائح العالية اللي هتشوفها في حياتك مش ورم. اعرف تفرّق في دقيقتين."
    minutes: 8
    pages: [138, 139]
    topics: [thrombocytosis]
    goals:
      - "تعرف إمتى الطفرة بتكفي للتشخيص وإمتى الـ ET تبقى exclusion"
      - "تعدّ أسباب الـ reactive thrombocytosis وتفهم كل سبب بيعلّي الصفائح ليه"
      - "تمشي على algorithm الـ thrombocytosis"
    status: unverified
    steps:
      - kind: explain
        remind: [hem.L09.041]
        page: 138
        title: "أغلب الصفائح العالية مش ET"
        quote: "The identification of a JAK2 V617F, CALR or MPL mutation now provides a very useful positive diagnostic criterion for approximately 80–90% of ET patients.\nHowever, for so-called triple-negative patients, ET remains a diagnosis of exclusion and can only be made after other clonal blood disorders and reactive thrombocytosis have been ruled out.\nReactive thrombocytosis\nThrombocytosis is most commonly reactive and secondary to increased levels of circulating cytokines that stimulate thrombopoiesis."
        text: |
          - الطفرة (JAK2 أو CALR أو thrombopoietin receptor gene (MPL)) بتدّي **positive diagnostic criterion** في **80–90%** من الـ ET.
          - الباقي **triple-negative**، والـ ET عندهم ==diagnosis of exclusion==: لازم تشيل الـ clonal disorders التانية والـ reactive الأول.
          - و **thrombocytosis is most commonly reactive**: **cytokines** في الدم بتنشّط الـ thrombopoiesis.

          ليه الـ cytokines بتعلّي الصفائح؟ التفسير المقبول (مش في الكتاب): الالتهاب بيطلّع **IL-6**، والـ IL-6 بيخلّي الكبد يعمل **thrombopoietin** أكتر، فالنخاع السليم يطلّع صفائح أكتر. يعني النخاع هنا **طبيعي** بيستجيب لأمر، مش ورم.
      - kind: explain
        page: 138
        title: "الـ reactive ممكن يعدّي 1000"
        quote: "Inflammatory, vasculitic and allergic disorders, acute and chronic infections, malignancies, hemolysis, iron deficiency and blood loss can all lead to an increased platelet count.\nReactive thrombocytosis can sometimes be marked and, occasionally, the platelet count can be greater than 1000 X10⁹/L. There is usually evidence of on-going inflammation in the form of ↑ESR or CRP but this is not always the case."
        text: |
          الأسباب: **inflammatory، vasculitic، allergic** disorders، **infections** (acute و chronic)، **malignancies**، **hemolysis**، **iron deficiency** و **blood loss**.

          نقطتين بيقعوا فيهم الناس:
          - الـ reactive ممكن يبقى ==marked==، وأحيانًا **فوق 1000**. فالرقم العالي لوحده ما بيثبتش ورم.
          - غالبًا فيه **ESR أو CRP عالي**، بس **مش دايمًا**. فالـ CRP الطبيعي ما بينفيش الـ reactive.

          الفرق الحقيقي إن الـ reactive **بيرجع طبيعي** لما السبب يتعالج. الـ ET لأ.
      - kind: sort
        page: 139
        quote: "Causes of reactive thrombocytosis\n  Iron deficiency\n  Blood loss (acute or chronic)\n  Hyposplenism/splenectomy\n  Surgery\n  Acute bacterial infection\n    Pneumonia, septicaemia, meningitis, diverticular abscess etc.\n  Chronic inflammation\n    Vasculitides\n    Inflammatory bowel disease\n    Connective tissue disorders\n    Rheumatoid arthritis\n    Chronic infections\n  Malignancies\n  Rebound thrombocytosis\n    Following treatment of immune thrombocytopenic purpura\n    Recovery from chemotherapy\n  Drugs\n    Vincristine"
        prompt: "صنّف كل سبب أو علامة:"
        bins: ["Reactive", "Clonal (MPN)"]
        cards:
          - { text: "Iron deficiency", bin: 0 }
          - { text: "After splenectomy", bin: 0 }
          - { text: "Recovery from chemotherapy", bin: 0 }
          - { text: "Vincristine", bin: 0 }
          - { text: "Rheumatoid arthritis", bin: 0 }
          - { text: "JAK2 V617F positive", bin: 1 }
          - { text: "Hyperlobulated megakaryocytes in marrow", bin: 1 }
          - { text: "CALR mutation", bin: 1 }
        why: "الـ reactive: iron deficiency، blood loss، hyposplenism/splenectomy، surgery، infection، chronic inflammation (vasculitis، inflammatory bowel disease (IBD)، connective tissue disease (CTD)، rheumatoid arthritis (RA))، malignancy، rebound (بعد immune thrombocytopenia (ITP) أو chemo)، و vincristine. الـ clonal بتبان بطفرة أو بنخاع شكله ET."
      - kind: figure
        page: 139
        quote: "Causes of reactive thrombocytosis"
        title: "صورة الكتاب: أسباب الـ reactive thrombocytosis"
        image: { file: hem/L09-reactive-causes.webp, book: true }
        alt: "Book list printed as a picture on a lilac background: iron deficiency; blood loss; hyposplenism or splenectomy; surgery; acute bacterial infection (pneumonia, septicaemia, meningitis, diverticular abscess); chronic inflammation (vasculitides, inflammatory bowel disease, connective tissue disorders, rheumatoid arthritis, chronic infections); malignancies; rebound thrombocytosis (after treatment of immune thrombocytopenic purpura, recovery from chemotherapy); drugs (vincristine)."
        caption: |
          قايمة الكتاب نفسها، مطبوعة كصورة. اقراها من فوق لتحت كمجموعات:

          - **فوق**: ==iron deficiency== و **blood loss**، وبعدهم **hyposplenism/splenectomy** و **surgery**.
          - **Acute bacterial infection**: pneumonia، septicaemia، meningitis، diverticular abscess.
          - **Chronic inflammation**: vasculitides، inflammatory bowel disease، connective tissue disorders، rheumatoid arthritis، chronic infections.
          - **Malignancies**.
          - **Rebound thrombocytosis**: بعد علاج الـ immune thrombocytopenic purpura، وبعد ما النخاع يفوق من الـ chemotherapy.
          - **تحت خالص**: **drugs** (vincristine).

          كل دول أسباب ==reactive==: الصفائح هتنزل لما السبب يتعالج، وده اللي لازم تستبعده قبل ما تقول ET.
      - kind: reveal
        page: 139
        quote: "Causes of reactive thrombocytosis\n  Iron deficiency\n  Blood loss (acute or chronic)\n  Hyposplenism/splenectomy\n  Surgery\n  Acute bacterial infection\n    Pneumonia, septicaemia, meningitis, diverticular abscess etc.\n  Chronic inflammation\n    Vasculitides\n    Inflammatory bowel disease\n    Connective tissue disorders\n    Rheumatoid arthritis\n    Chronic infections\n  Malignancies\n  Rebound thrombocytosis\n    Following treatment of immune thrombocytopenic purpura\n    Recovery from chemotherapy\n  Drugs\n    Vincristine"
        prompt: "ليه الـ splenectomy والـ rebound بعد علاج الـ ITP أو الـ chemo بيعلّوا الصفائح؟"
        answer: |
          التفسير المقبول (مش في الكتاب):
          - **Splenectomy / hyposplenism**: الطحال الطبيعي **بيخزّن** حوالي تلت الصفائح. شيلته، يبقى الصفائح دي كلها في الدم.
          - **Rebound** (بعد علاج الـ immune thrombocytopenic purpura (ITP) أو بعد ما النخاع يفوق من الـ chemo): الـ TPO كان عالي جدًا طول فترة النقص، فالنخاع لما يرجع يشتغل **بيزوّد في الإنتاج** (overshoot) قبل ما يهدى.

          وفي الاتنين الصفائح بتهدى لوحدها مع الوقت، فمفيش داعي لعلاج يقلّلها.
      - kind: reveal
        page: 139
        quote: "Causes of reactive thrombocytosis\n  Iron deficiency\n  Blood loss (acute or chronic)"
        prompt: "ليه الـ iron deficiency والـ blood loss بيعلّوا الصفائح، وهما أصلًا مشكلة كرات حمرا؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الكرات الحمرا والـ megakaryocytes **جايين من نفس الأب** (progenitor واحد مشترك). في النزيف ونقص الحديد الجسم بيزقّ الأب ده يشتغل أكتر، وجزء كبير من الشغل بيروح للـ megakaryocytes.

          ودي حاجة عملية: ست عندها صفائح **600** ونزيف دورة غزير و ferritin واطي، عالج الحديد الأول واعد العد قبل ما تفكّر في ET.
