        text: |
          - "**IV-S**: ≥50% من الـ glomeruli **المصابة** فيها lesions **segmental**."
          - "**IV-G**: ≥50% منها **global**."
          - **A** = active، **C** = chronic inactive، **A/C** = الاتنين.

          الـ A معناه فيه حاجة تتعالج، الـ C معناه scar مش هيرجع.

          ليه الفرق ده مهم؟ لأن العلاج كله (cyclophosphamide و MPAA) هدفه الـ A. لو الـ biopsy كلها C، يعني ندبة، فالـ immunosuppression هيدّي سُمّية من غير فايدة. وده نفس السبب اللي الكتاب بيطلب عشانه الـ activity والـ chronicity index في كل تقرير.
