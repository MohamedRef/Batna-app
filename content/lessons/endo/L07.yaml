            <text x="5" y="116" class="t-sm">brady, low BP</text>
            <text x="225" y="100" class="t-sm t-b">Lungs</text>
            <text x="225" y="116" class="t-sm">low O2, high CO2</text>
            <text x="5" y="170" class="t-sm t-b">Kidney</text>
            <text x="5" y="186" class="t-sm">low Na (50%)</text>
            <text x="225" y="170" class="t-sm t-b">Liver</text>
            <text x="225" y="186" class="t-sm">low glucose</text>
            <text x="90" y="272" class="t-sm t-mut">everything slows down</text>
          </svg>
      - kind: check
        page: 114
        quote: "Investigations\n  Hyponatremia is common and seen in at least 50% of the patients.\n  Any patient with a low serum sodium and normal volume status should be suspected of having an underactive thyroid.\n  Hypoglycemia is another common feature.\n  Blood should be drawn for\n    Thyroid stimulating hormone (TSH).\n    Free T4.\n    Cortisol."
        question: "A patient has Na 124 mmol/L and looks euvolaemic. Which condition should you suspect per the lecture?"
        options: ["Hypothyroidism", "Hyperthyroidism", "Pheochromocytoma", "Hypercalcaemia"]
        answer: 0
        why:
          - "صح: أي low sodium مع normal volume status فكّر في underactive thyroid."
          - "الـ hyperthyroidism مش بيعمل كده."
          - "مش مذكورة كسبب."
          - "الـ hypercalcaemia بتعمل polyuria مش hyponatraemia."
      - kind: explain
        page: 114
        quote: "Hyponatremia is common and seen in at least 50% of the patients."
        title: "ليه الصوديوم والسكر والـ CO2؟"
        text: |
          الكتاب بيدّينا الأرقام: ==hyponatraemia في 50% على الأقل==، و **hypoglycaemia** شائعة، و **type 2 respiratory failure** (O2 واطي و CO2 عالي).

          التفسير المقبول (مش في الكتاب):
          - **الصوديوم**: الكلية مش قادرة تطلّع المية الحرة لأن الـ cardiac output والـ GFR واطيين والـ ADH عالي، فالمية بتتحبس والصوديوم يتخفف. علشان كده الـ volume status طبيعي، وده بالظبط اللي بيخلّي الكتاب يقول: low sodium مع normal volume = فكّر في الغدة.
          - **السكر**: الـ gluconeogenesis بطيء، ولو معاه نقص cortisol (خصوصًا لو السبب pituitary) السكر يقع أكتر.
          - **الـ CO2**: الـ respiratory drive ضعيف وعضلات التنفس ضعيفة، فالمريض بيـ hypoventilate.
      - kind: explain
        page: 115
        quote: "If possible, a short synacthen test should be considered, as coexisting hypoadrenalism is a possibility, particularly so in secondary hypothyroidism due to a pituitary cause."
        title: "التحاليل"
        text: |
          اسحب **thyroid-stimulating hormone (TSH)**، **free T4**، و ==cortisol==.

          ولو تقدر، اعمل **short synacthen test**: ممكن يكون معاه hypoadrenalism، خصوصًا لو الـ hypothyroidism **secondary** من الـ pituitary.
      - kind: reveal
        page: 115
        quote: "Give steroid cover in the form of hydrocortisone 100 mg every eight hours until hypoadrenalism is excluded."
        prompt: "ليه نبدأ hydrocortisone قبل ما نتأكد إن فيه hypoadrenalism؟"
        answer: "لأن الكتاب بيقول إن الـ **hypoadrenalism** ممكن يكون موجود معاه، خصوصًا في الـ secondary hypothyroidism من الـ pituitary. ولو ادّيت thyroxine لمريض عنده نقص cortisol، الـ metabolic rate يعلى والـ cortisol القليل يخلص، فيدخل في **adrenal crisis**. نفس قاعدة الـ apoplexy: ==steroid الأول أو مع الـ thyroxine، مش بعده==. وتفضل الـ hydrocortisone 100 mg كل 8 ساعات **لحد ما الـ hypoadrenalism يتستبعد**. التفسير المقبول (مش في الكتاب): ضرر جرعات hydrocortisone كام يوم زيادة بسيط، وضرر إنك تفوّت adrenal crisis قاتل."
      - kind: table
        page: 115
