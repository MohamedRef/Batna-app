items:
  # ---------- p104: definition and etiology ----------
  - id: hem.L07.001
    kind: card
    topic: definition
    front: Define acute leukemia.
    back: A malignant event in an early hematopoietic precursor; instead of differentiating normally, the affected cell keeps proliferating in an uncontrolled fashion.
    src: { page: 104, quote: "Acute leukemia is the result of a malignant events, occurring in an early hematpoietic precursor" }
    status: unverified
    tags: [high-yield]
  - id: hem.L07.002
    kind: card
    topic: definition
    front: Why do patients with acute leukemia have low red cells, white cells and platelets?
    back: Immature cells (blasts) accumulate rapidly and replace the bone marrow, so production of normal red cells, white cells and platelets falls.
    src: { page: 104, quote: "immature cells often called blasts, rapidly accuumalate and replace the bone marrow" }
    status: unverified
  - id: hem.L07.003
    kind: enumerate
    topic: etiology
    prompt: Enumerate the etiological factors of acute leukemia.
    points:
      - Radiation (ionizing)
      - Oncogenic viruses (HTLV-1)
      - Genetic and congenital factors
      - Chemicals (benzene, alkylating agents)
    pass: 4
    src: { page: 104, quote: "Ionizing radiation is leukemogenic" }
    status: unverified
    tags: [high-yield]
  - id: hem.L07.004
    kind: card
    topic: etiology
    front: Which leukemias are increased after radiation, and in which groups was this shown?
    back: ALL, AML and CML; shown in patients given radiotherapy for ankylosing spondylitis and in atomic bomb survivors.
    src: { page: 104, quote: "acute lymphocytic leukemia (ALL), acute melogenous leukemia (AML), and chronic myelogenous leukemia (CML) are all increased" }
    status: unverified
  - id: hem.L07.005
    kind: cloze
    topic: etiology
    text: "The radiation risk of leukemia is greater with {{c1::higher doses}}, delivered over {{c2::shorter periods}}, to {{c3::younger patients}}."
    src: { page: 104, quote: "Greater risk results from higher dose radiation delivered over shorter periods to younger patients." }
    status: unverified
  - id: hem.L07.006
    kind: card
    topic: etiology
    front: Which non-ionizing exposure has raised concern as a possible cause of leukemia?
    back: Low-frequency non-ionizing electromagnetic fields.
    src: { page: 104, quote: "possible leukemio genic effects of low frequency non ionizing electromagnetic field" }
    status: unverified
  - id: hem.L07.007
    kind: card
    topic: etiology
    front: Which virus causes adult T-cell leukemia, and where is it found?
    back: HTLV-1 (human T-cell lymphotropic virus type 1); found in the Caribbean basin and Africa.
    src: { page: 104, quote: "Human T cell lymphotropic virus type 1 (HTLV-1) is considered the causative agent of adult T-cell leukemia." }
    status: unverified
  # ---------- p105: genetics, chemicals, incidence, pathophysiology ----------
  - id: hem.L07.008
    kind: enumerate
    topic: etiology
    prompt: Name congenital disorders that predispose to acute leukemia.
    points:
      - Fanconi anemia
      - Ataxia telangiectasia
      - Down syndrome
      - Infantile X-linked agammaglobulinemia
    pass: 3
    src: { page: 105, quote: "Other congential disorders associated with an increased incidence of leukemia as dawn syndrome and infantile x- linked agamma globulinemia" }
    status: unverified
  - id: hem.L07.009
    kind: cloze
    topic: etiology
    text: "Fanconi anemia and ataxia telangiectasia are {{c1::autosomal recessive}} disorders with {{c2::chromosomal instability}} that are prone to end in acute leukemia."
    src: { page: 105, quote: "Several autosomal recessive disorders associated with chromosomal instability are prone to terminate in acute leukemia including fanconi anemia and ataxia telangiectasia." }
    status: unverified
  - id: hem.L07.010
    kind: card
    topic: etiology
    front: How does occupational benzene exposure lead to acute leukemia?
    back: It frequently causes marrow hypoplasia, which sometimes evolves into acute leukemia.
    src: { page: 105, quote: "Occupational exposure to benzene frequently results in morrow hypoplasia which sometimes ivolves into acute leukemia." }
    status: unverified
  - id: hem.L07.011
    kind: card
    topic: etiology
    front: Which alkylating agents increase the risk of AML?
    back: Chlorambucil, melphalan and nitrogen mustard.
    src: { page: 105, quote: "Prior exposure to alkylating agents such as cholramboucil, melphalan and nitrogen mustard is associated with an increased risk of AML." }
    status: unverified
  - id: hem.L07.012
    kind: cloze
    topic: incidence
    text: "The annual incidence of all leukemias is {{c1::8 to 10}} per 100,000."
    src: { page: 105, quote: "The annual incidence of all leukemias is 8 to 10 per 100,000" }
    status: unverified
    tags: [numbers]
  - id: hem.L07.013
    kind: table
    topic: incidence
    title: Relative incidence of the four leukemias
    columns: [Leukemia, Share of all leukemias]
    rows:
      - [AML, "46% (the most common)"]
      - [CLL, "29%"]
      - [CML, "14%"]
      - [ALL, "11%"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 105, quote: "the relative incidence for the four categories of leukemia are as follows ALL 11%, CLL 29%, AML 46%, and CML 14%" }
    status: unverified
    tags: [numbers]
  - id: hem.L07.014
    kind: card
    topic: incidence
    front: What is the place of ALL among childhood cancers?
    back: ALL is the most common cancer and the second leading cause of death in children under 15 years.
    src: { page: 105, quote: "ALL is the most common cancer and the second leading cause of death in children under 15 years of age." }
    status: unverified
    tags: [high-yield]
  - id: hem.L07.015
    kind: card
    topic: incidence
    front: What does "monoclonal" mean for acute leukemia?
    back: The final leukemic event occurs in a single cell; the level of differentiation at which the malignancy shows is variable.
    src: { page: 105, quote: "The disease is monocolonal i.e, the final leukemic event occur in a single cell" }
    status: unverified
  - id: hem.L07.016
    kind: card
    topic: incidence
    front: In a hypercellular leukemic marrow, what causes the pancytopenia?
    back: Physical replacement of normal marrow precursors by leukemic cells; the clone expands at the expense of normal hematopoiesis.
    src: { page: 105, quote: "in patients with hypercellular marrows, pancytopenia is probably, the result of physical replacement of normal marrow precursors by leukemic cells." }
    status: unverified
  # ---------- p106: hypocellular marrow, classification, Table 1 ----------
  - id: hem.L07.017
    kind: card
    topic: incidence
    front: Some patients with acute leukemia have pancytopenia with a hypocellular marrow. What does this suggest?
    back: Marrow failure is not only physical replacement; leukemia inhibitory substances released by the malignant cells also suppress normal marrow.
    src: { page: 106, quote: "marrow failure is not simply due to physical replacement of the marrow but also due to leukemia inhibitory substances released by malignant cells" }
    status: unverified
  - id: hem.L07.018
    kind: enumerate
    topic: classification
    prompt: By what methods can the acute leukemias be classified?
    points:
      - Morphology
      - Cytochemistry
      - Cell-surface markers
      - Cytogenetics
      - Oncogene expression
    pass: 4
    src: { page: 106, quote: "including morphology, cytochemistry, cell surface markers, cyto genetics, and oncogene expression." }
    status: unverified
  - id: hem.L07.019
    kind: card
    topic: classification
    front: What is the most important distinction in classifying acute leukemia, and why?
    back: AML versus ALL, because they differ considerably in clinical behavior, prognosis and response to therapy.
    src: { page: 106, quote: "The most important distinction is between AML and ALL, since these two diseases differ considerably in their clinical behavior, prognosis and response to therapy" }
    status: unverified
    tags: [high-yield]
  - id: hem.L07.020
    kind: table
    topic: classification
    title: "FAB subtypes of AML (Table 1)"
    columns: [FAB, Name, "Clue (morphology; karyotype or marker)"]
    rows:
      - [M0, Acute undifferentiated leukemia, "Uniform, very undifferentiated"]
      - [M1, AML with minimal differentiation, "Very undifferentiated, few azurophilic granules"]
      - [M2, AML with differentiation, "Granulated blasts predominate; Auer rods may be seen"]
      - [M3, Acute promyelocytic leukemia, "Hypergranular promyelocytes; t(15;17)"]
      - [M4, "Acute myelomonocytic leukemia (M4E)", "Monoblasts and myeloblasts; inv/del(16)"]
      - [M5, "Acute monocytic leukemia (M5a, M5b)", "Monoblasts predominate (M5a >80% monoblasts, M5b >20% promonocytes); t(9;11)"]
      - [M6, Acute erythroleukemia, "Erythroblasts and megaloblastic red cell precursors; antiglycophorin, antispectrin"]
      - [M7, Acute megakaryocytic leukemia, "Undifferentiated blasts; antiplatelet GpIIb/IIIa"]
    blanks: [[2, 1], [3, 1], [3, 2], [4, 1], [5, 2], [6, 1], [7, 2]]
    src: { page: 106, quote: "M3, Acute promyelocytic leukemia Hypergranular promyelocytes predominate T(15;17)" }
    status: unverified
    tags: [high-yield]
    update:
      text: "FAB is the book's system. Current practice classifies AML by defining genetic abnormalities (WHO 5th edition and the International Consensus Classification, both 2022)."
      ref: "WHO Classification of Haematolymphoid Tumours, 5th ed., 2022; ICC 2022"
  - id: hem.L07.021
    kind: table
    topic: classification
    title: "FAB subtypes of ALL (Table 1)"
    columns: [FAB, Morphology, Marker or karyotype]
    rows:
      - ["L1 (childhood)", "Small, uniform blasts, nucleoli indistinct", "65% react with anti-CD10 (anti-CALLA)"]
      - ["L2 (adult)", "Larger, more irregular, nucleoli present", "20% react with anti-CD5, 3 or 2 (anti-T cell)"]
      - ["L3 (Burkitt-like)", "Large, strongly basophilic cytoplasm with vacuoles", "Surface immunoglobulin, CD19, CD20; t(8;14)"]
    blanks: [[0, 1], [1, 1], [2, 1], [2, 2]]
    src: { page: 106, quote: "L3, Burkitt-like acute lymphoid leukemia Large with strongly basophilic cytoplasm and vacuoles" }
    status: unverified
  - id: hem.L07.022
    kind: table
    topic: classification
    title: "Cytochemistry by FAB subtype (Table 1)"
    columns: [Subtype, Myeloperoxidase, Nonspecific esterase, PAS]
    rows:
      - [M0, "-", "-", "-"]
      - [M2, "+++", "+/-", "+"]
      - [M3, "+++", "+", "+"]
      - [M4, "++", "+++", "++"]
      - [M5, "+/-", "+++", "++"]
      - [M6, "-", "-", "++"]
      - [L1, "-", "-", "+++"]
      - [L3, "-", "-", "-"]
    blanks: [[1, 1], [3, 2], [4, 2], [5, 3], [6, 3]]
    src: { page: 106, quote: "Histochemistry Myeloperoxidase Nonspecific esterase PAS" }
    status: unverified
  - id: hem.L07.023
    kind: cloze
    topic: classification
    text: "In Table 1, {{c1::M5 (acute monocytic)}} carries t(9;11), {{c2::M3 (promyelocytic)}} carries t(15;17) and {{c3::L3 (Burkitt-like)}} carries t(8;14)."
    src: { page: 106, quote: "M5, Acute monocytic leukemia Monoblasts predominante T(9;11)" }
    status: unverified
  - id: hem.L07.024
    kind: card
    topic: classification
    front: "In Table 1, which FAB subtypes react with antiglycophorin and with antiplatelet GpIIb/IIIa?"
    back: "Antiglycophorin (and antispectrin): M6 erythroleukemia. Antiplatelet GpIIb/IIIa: M7 megakaryocytic leukemia."
    src: { page: 106, quote: "M6, acute erythroleukemia Antiglycophorin, antispectrin M7, Acute megakaryocytic Antiplatelet GpIIb/IIIa" }
    status: unverified
  - id: hem.L07.025
    kind: mcq
    topic: classification
    stem: A 58-year-old man has gum hypertrophy, fever and a WBC of 90,000/µL. Marrow blasts stain strongly (+++) for nonspecific esterase and only weakly (+/-) for myeloperoxidase; most are monoblasts (>80%). Which FAB subtype fits best?
    options:
      - M5a acute monocytic leukemia
      - M3 acute promyelocytic leukemia
      - M2 AML with differentiation
      - M6 acute erythroleukemia
      - L1 acute lymphoblastic leukemia
    answer: 0
    why:
      - "Correct: in Table 1 M5 is NSE +++ with MPO +/-, and M5a has >80% monoblasts (p106)."
      - M3 is MPO +++ with hypergranular promyelocytes.
      - M2 is MPO +++ with granulated blasts and only +/- esterase.
      - M6 is MPO and esterase negative with erythroblasts and PAS positivity.
      - L1 blasts are MPO and NSE negative and PAS positive.
    src: { page: 106, quote: "M5, Acute monocytic leukemia M5a M5b Monoblasts predominante Type a > 80%monoblasts" }
    status: unverified
  # ---------- p107: morphology ----------
  - id: hem.L07.026
    kind: cloze
    topic: morphology
    text: "AML blasts are typically {{c1::12 to 20 µm}} in diameter, with discrete nuclear chromatin, multiple nucleoli and cytoplasm that usually contains {{c2::azurophilic granules}}."
    src: { page: 107, quote: "Leukemic cells in AML typically are 12 to 20 um in diameter with discrete nuclear chromatin" }
    status: unverified
    tags: [numbers]
  - id: hem.L07.027
    kind: card
    topic: morphology
    front: What are Auer rods and what is their significance?
    back: Slender, fusiform cytoplasmic inclusions that stain red with Giemsa; they are pathognomonic of AML.
    src: { page: 107, quote: "auer rods which are slender, fusiform cytoplasmic inclusions that stain red with Giemsa stain, are pathognomic of AML." }
    status: unverified
    tags: [high-yield]
  - id: hem.L07.028
    kind: card
    topic: morphology
    front: How do ALL blasts differ from AML blasts under the microscope?
    back: ALL blasts are smaller than AML blasts and have no granules.
    src: { page: 107, quote: "The leukemic cells in ALL are smaller than AML blasts and devoid of granules." }
    status: unverified
  - id: hem.L07.029
    kind: card
    topic: morphology
    front: Contrast L1 and L2 blasts.
    back: "L1: uniform in size with scanty cytoplasm. L2: larger, more variable in size, and may have nucleoli."
    src: { page: 107, quote: "L1 blasts are uniform in size with scanty cytoplasm, L2 blasts are are larger and more variable in size and may have nucleoli" }
    status: unverified
  - id: hem.L07.030
    kind: cloze
    topic: morphology
    text: "L3 blasts are distinct, with {{c1::prominent nucleoli}} and {{c2::deeply basophilic cytoplasm with vacuoles}}."
    src: { page: 107, quote: "L3 blasts are quite distinct with prominent nucleoli and deeply basophilic cytoplasm with vacuoles" }
    status: unverified
  # ---------- p108: markers and cytogenetics ----------
  - id: hem.L07.031
    kind: card
    topic: markers
    front: Which CD antigens does AML express?
    back: CD13, CD14, CD33 and CD34.
    src: { page: 108, quote: "AML express CD13, CD14, CD33 and CD34" }
    status: unverified
    tags: [high-yield]
  - id: hem.L07.032
    kind: cloze
    topic: markers
    text: "About {{c1::60%}} of ALL cases express the common ALL antigen, CALLA ({{c2::CD10}})."
    src: { page: 108, quote: "in ALL approximately 60% of case express the common ALL antigen or CALLA (CD10)." }
    status: unverified
    tags: [numbers]
  - id: hem.L07.033
    kind: card
    topic: markers
    front: What do CALLA-positive ALL cells represent?
    back: A very early B-cell differentiation state.
    src: { page: 108, quote: "CALLA positive ALL are thought to represent a very early B cell differentiating state" }
    status: unverified
  - id: hem.L07.034
    kind: cloze
    topic: markers
    text: "About {{c1::20%}} of ALL cases are of T-cell phenotype, expressing early T-cell antigens such as {{c2::CD4, CD3 or CD2}}."
    src: { page: 108, quote: "20% of cases of ALL are of the T cell phenotype expressing antigens found on normal early T cells such as CD4, CD3, or CD2." }
    status: unverified
  - id: hem.L07.035
    kind: card
    topic: markers
    front: What is TdT and what is its diagnostic value?
    back: Terminal deoxynucleotidyl transferase, a nuclear enzyme found in more than 90% of ALL lymphoblasts and absent from normal mature myeloid or lymphoid cells.
    src: { page: 108, quote: "a nuclear enzyme that is found in more than 90% of cases of ALL lymphblasts." }
    status: unverified
    tags: [high-yield]
  - id: hem.L07.036
    kind: mcq
    topic: markers
    stem: A 5-year-old boy has pallor, petechiae and a WBC of 3,000/µL with blasts. The blasts are small without granules, myeloperoxidase negative, TdT positive and CD10 positive. Which is the most likely diagnosis?
    options:
      - Early B-cell (CALLA-positive) ALL
      - T-cell ALL
      - M2 AML
      - Acute promyelocytic leukemia
      - Chronic lymphocytic leukemia
    answer: 0
    why:
      - "Correct: TdT marks ALL lymphoblasts, and CALLA (CD10) positive ALL represents a very early B-cell state (p108)."
      - T-cell ALL expresses CD4, CD3 or CD2 rather than CALLA.
      - AML blasts are larger, granular, MPO positive and express CD13, CD33.
      - APL has hypergranular promyelocytes and DIC.
      - CLL is a disease of mature lymphocytes in older adults, not TdT-positive blasts.
    src: { page: 108, quote: "CALLA positive ALL are thought to represent a very early B cell differentiating state" }
    status: unverified
  - id: hem.L07.037
    kind: card
    topic: cytogenetics
    front: Which translocation does acute promyelocytic leukemia always have?
    back: "A translocation between chromosomes 15 and 17, t(15;17)."
    src: { page: 108, quote: "Acute promyelocytic leukemia always has a tanslocation involving chromosomes 15 and 17 t(15-17)." }
    status: unverified
    tags: [high-yield]
  # ---------- p109: cytogenetics, clinical ----------
  - id: hem.L07.038
    kind: card
    topic: cytogenetics
    front: Acute myelomonocytic leukemia (M4) with abnormal eosinophilia is associated with which chromosomal change?
    back: An inversion of chromosome 16.
    src: { page: 109, quote: "abnormal eosinophilia is associated with an inversion in chromosome 16" }
    status: unverified
  - id: hem.L07.039
    kind: card
    topic: cytogenetics
    front: "What is the outcome of M2 AML with t(8;21)?"
    back: Relatively favorable with chemotherapy (the book notes these patients express CD56).
    src: { page: 109, quote: "patients with M2 AML with t (8: 21) express CD56 have a relatively favorable outcome with chemotherapy." }
    status: unverified
  - id: hem.L07.040
    kind: table
    topic: cytogenetics
    title: Chromosomal changes and their leukemias
    columns: [Abnormality, Associated leukemia]
    rows:
      - ["t(15;17)", "Acute promyelocytic leukemia (M3), always"]
      - ["inv(16)", "Acute myelomonocytic leukemia (M4) with abnormal eosinophilia"]
      - ["t(8;21)", "M2 AML, relatively favorable outcome"]
      - ["t(4;11)", "ALL, mostly neonatal"]
      - ["t(8;14)", "L3 variant of ALL"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 109, quote: "t (4;11), an abnormality seen mostly in neonatal ALL, t (8: 14) an abnormality associated with the L3 varient" }
    status: unverified
    tags: [high-yield]
  - id: hem.L07.041
    kind: mcq
    topic: cytogenetics
    stem: A 30-year-old woman presents with gum bleeding and ecchymoses. Platelets 18,000/µL, prolonged PT, low fibrinogen. Marrow shows hypergranular promyelocytes. Which karyotype is expected?
    options:
      - "t(15;17)"
      - "t(8;21)"
      - "inv(16)"
      - "t(9;22)"
      - "t(8;14)"
    answer: 0
    why:
      - "Correct: APL (M3) always has t(15;17) and commonly presents with DIC (p108, p110)."
      - "t(8;21) goes with M2 AML."
      - "inv(16) goes with M4 with abnormal eosinophilia."
      - "t(9;22) is the Philadelphia chromosome of CML (lecture 8)."
      - "t(8;14) goes with L3 ALL."
    src: { page: 108, quote: "Acute promyelocytic leukemia always has a tanslocation involving chromosomes 15 and 17 t(15-17)." }
    status: unverified
  - id: hem.L07.042
    kind: mcq
    topic: cytogenetics
    stem: A 3-week-old neonate has hepatosplenomegaly and a WBC of 120,000/µL with lymphoblasts. Which chromosomal abnormality is most typical of this age?
    options:
      - "t(4;11)"
      - "t(8;14)"
      - "t(15;17)"
      - "inv(16)"
      - "t(8;21)"
    answer: 0
    why:
      - "Correct: t(4;11) is seen mostly in neonatal ALL (p109)."
      - "t(8;14) is associated with the L3 (Burkitt-like) variant."
      - "t(15;17) is APL, a myeloid leukemia."
      - "inv(16) is M4 AML with eosinophilia."
      - "t(8;21) is M2 AML."
    src: { page: 109, quote: "t (4;11), an abnormality seen mostly in neonatal ALL, t (8: 14) an abnormality associated with the L3 varient" }
    status: unverified
  - id: hem.L07.043
    kind: card
    topic: clinical
    front: The signs and symptoms of acute leukemia result from which two processes?
    back: Decreased normal marrow function, and invasion of normal organs by leukemic blasts.
    src: { page: 109, quote: "result from decreased normal marrow function and invasion of normal organs by leukemic blasts" }
    status: unverified
    tags: [high-yield]
  - id: hem.L07.044
    kind: enumerate
    topic: clinical
    prompt: List the manifestations of marrow failure in acute leukemia.
    points:
      - "Anemia: fatigue, pallor, headache"
      - "Thrombocytopenia: petechiae, ecchymoses, bleeding gums, epistaxis, hemorrhage"
      - "Granulocytopenia: significant or life-threatening infections"
    pass: 3
    src: { page: 109, quote: "Anemia is present at diagnosis in most patients, causing fatigue, pallor and headache." }
    status: unverified
  - id: hem.L07.045
    kind: card
    topic: clinical
    front: Why do many patients with acute leukemia present with serious infections?
    back: Most are significantly granulocytopenic at diagnosis, so infections can be significant or life threatening at presentation.
    src: { page: 109, quote: "most pathetns with acute leukemia at diagnosis are significantly granulocytopenic leading to significant or life threatening infections at presentation" }
    status: unverified
  # ---------- p110: infiltration, APL DIC, laboratory, DD ----------
  - id: hem.L07.046
    kind: card
    topic: clinical
    front: Which infiltrates normal organs more often, ALL or AML? Which organs enlarge?
    back: ALL. Enlarged lymph nodes, liver and spleen are common at diagnosis.
    src: { page: 110, quote: "ALL tends to infiltrate normal organs more often than AML." }
    status: unverified
  - id: hem.L07.047
    kind: card
    topic: clinical
    front: What causes bone pain in acute leukemia, and in whom is it common?
    back: Leukemic infiltration of the periosteum or expansion of the medullary cavity; common in children with ALL, many first misdiagnosed as juvenile rheumatoid arthritis.
    src: { page: 110, quote: "bone pain, thought to result from leukemic infiltration of the periosteum or expansion of the medullary cavity" }
    status: unverified
    tags: [high-yield]
  - id: hem.L07.048
    kind: card
    topic: clinical
    front: What are the features of leukemic meningitis?
    back: Leukemic infiltration of the leptomeninges causing headache, nausea, nerve palsies and seizures.
    src: { page: 110, quote: "leukemic cells may infiltrate, the leptomeninges, causing leukemic meningitis, leading to headache nausea, nerve palsies and seizures." }
    status: unverified
  - id: hem.L07.049
    kind: card
    topic: clinical
    front: Which clinical feature is typical of acute promyelocytic leukemia (M3), and why?
    back: Subclinical or clinical DIC, caused by tissue thromboplastins in the leukemic cells.
    src: { page: 110, quote: "patients with acute promyelocytic leukemia (M3) commonly have subclincial or clinical DIC, coaused by tissue thromboplastins present in the leukemic cells." }
    status: unverified
    tags: [high-yield]
  - id: hem.L07.050
    kind: mcq
    topic: clinical
    stem: A 7-year-old girl was treated for 6 weeks as juvenile rheumatoid arthritis for leg bone pain. She now has pallor, cervical lymphadenopathy and hepatosplenomegaly. CBC shows Hb 7 g/dL and platelets 30,000/µL. What is the most likely diagnosis?
    options:
      - Acute lymphoblastic leukemia
      - Juvenile rheumatoid arthritis with anemia of chronic disease
      - Aplastic anemia
      - Infectious mononucleosis
      - Chronic myeloid leukemia
    answer: 0
    why:
      - "Correct: bone pain from periosteal infiltration, organomegaly and cytopenias in a child = ALL, often first misdiagnosed as JRA (p110)."
      - JRA does not explain organomegaly with thrombocytopenia.
      - Aplastic anemia does not cause lymphadenopathy or hepatosplenomegaly; its marrow is hypoplastic.
      - Mononucleosis may mimic ALL but does not cause months of bone pain with severe cytopenias.
      - CML is a disease of adults with very high WBC and huge spleen.
    src: { page: 110, quote: "particularly in children with ALL, in many of whom the original diagnosis was juvenile rheumatoid arthritis" }
    status: unverified
