  - id: git.L04.lesson13
    title: "بوليبات القولون و FAP"
    hook: "تلت الناس عندهم adenoma عند 50. مين فيهم هيبقى سرطان؟ وعيلة كاملة ممكن تحتاج colectomy."
    minutes: 9
    pages: [172, 173]
    topics: [crc-risk, crc-hered]
    goals:
      - "تعرف اللي بيحمي واللي بيزوّد الخطر وليه"
      - "تعرف أرقام الـ adenoma وإمتى يبقى خطير"
      - "تعرف إمتى الـ polypectomy كفاية وإمتى colectomy، وتعرف FAP"
    status: unverified
    steps:
      - kind: explain
        page: 172
        quote: "Racial & Ethnic Backgrounds: African-Americans & Jewish persons of"
        title: "باقي عوامل الخطر"
        text: |
          الكتاب بيكمّل: **racial and ethnic backgrounds** (==African-Americans== و **Jewish persons of Eastern European descent**)، و **type 2 diabetes**.

          التفسير المقبول (مش في الكتاب): ليه العرق؟ الـ Ashkenazi Jews عندهم variants جينية معروفة بتزوّد الخطر، فالعرق هنا مش بس «ظروف»، ده كمان جينات. والـ diabetes من النوع التاني بيرتبط بالـ **insulin** العالي، والـ insulin بيحفّز الخلايا تنقسم، ومعاه سمنة وقلة حركة، فكلهم بيصبّوا في نفس الاتجاه.
      - kind: sort
        page: 172
        quote: "HRT, ASA, NSAIDS, COX2 protective and in some cases cause regression of polyps."
        prompt: "ده بيزوّد خطر سرطان القولون ولا بيحمي؟"
        bins: ["Raises risk", "Protective"]
        cards:
          - { text: "Red and processed meat", bin: 0 }
          - { text: "Grilling meat at high temperature", bin: 0 }
          - { text: "Type 2 diabetes", bin: 0 }
          - { text: "Heavy alcohol", bin: 0 }
          - { text: "Folate", bin: 1 }
          - { text: "Calcium supplements", bin: 1 }
          - { text: "Aspirin and non-steroidal anti-inflammatory drugs (NSAIDs)", bin: 1 }
          - { text: "HRT", bin: 1 }
        why: "الـ folate بيحمي (نقصه مرتبط بـ K-ras mutations)، والكالسيوم بيقلل adenomas جديدة، والـ ASA/NSAIDs/COX2 و hormone replacement therapy (HRT) بيحموا وأحيانًا البوليب يرجع. أما الـ fiber: مش مثبت لسه."
      - kind: reveal
        page: 172
        quote: "Folate is protective. (Decreased folate= Kras mutations.)"
        prompt: "ليه الـ folate بيحمي؟ والـ aspirin بيعمل إيه في البوليب؟"
        answer: |
          الكتاب: ==Folate is protective== (نقصه = **K-ras mutations**). الـ **calcium** بيقلل adenomas جديدة. الـ **fiber** لسه مش متأكدين منه. والـ **HRT، ASA، NSAIDs، COX2 inhibitors** protective، وأحيانًا بتعمل **regression** للـ polyps.

          التفسير المقبول (مش في الكتاب): الـ folate لازم لتصنيع وإصلاح الـ DNA، فنقصه بيخلّي الأخطاء تعدّي من غير تصليح، ومنها الـ K-ras. والـ COX-2 بيزيد في الـ adenoma وبيعمل prostaglandins بتشجّع الانقسام وتمنع الـ apoptosis، فلما الـ aspirin أو الـ NSAID يوقفه البوليب ممكن يصغر. والكالسيوم بيلم الـ bile acids المهيّجة في البراز.
      - kind: table
        page: 172
        quote: "Tubulovillous, villous(most in rectum) have most increased risk of cancer (20% and 40% respectively.)"
        title: "Adenomas: النوع والخطر"
        columns: ["Type", "Share", "Cancer risk"]
        rows:
          - ["Tubular", "75-87%", "Lowest"]
          - ["Tubulovillous", "8-15%", "20%"]
          - ["Villous (mostly rectal)", "5-10%", "40%"]
          - ["Any adenoma over 2 cm", "-", "46%"]
          - ["Severe dysplasia", "-", "34%"]
        hide: [[1, 2], [2, 2], [3, 2], [4, 2]]
      - kind: figure
        page: 172
        quote: "Tubulovillous, villous(most in rectum) have most increased risk of cancer (20% and 40% respectively.)"
        title: "كل ما الـ villous يزيد، الخطر يزيد"
        alt: "Bar chart of cancer risk by adenoma type: tubulovillous 20 percent, villous 40 percent, any adenoma over 2 cm 46 percent, severe dysplasia 34 percent. Tubular adenomas, 75 to 87 percent of adenomas, carry the lowest risk and are shown as a short bar."
        caption: |
          - **الـ tubular**: الأشهر (75–87%) و ==الأقل خطر==.
          - **tubulovillous 20%** ← **villous 40%**: كل ما الـ villous component يزيد الخطر يتضاعف.
          - **الحجم فوق 2 cm** (46%) والـ **severe dysplasia** (34%) كمان بيعلّوه.
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="16" text-anchor="middle" class="t-sm t-mut">Cancer risk in the adenoma</text>
            <path d="M120 26V214" class="fg-ink"/>
