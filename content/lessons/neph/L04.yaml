      - kind: explain
        page: 88
        title: "Oxidative stress"
        quote: "Salt sensitve HT and CKD have ↑ level of asymmetric dimethyl argenine (ADMA) which inhibits NO synthetase"
        text: |
          الكلى بتطلّع **reactive oxygen species (ROS)** وعندها enzymes تعادلها. في الـ chronic kidney disease (CKD) الـ enzymes دي بتبوظ ← ==↓NO== (nitrosative stress) ← vasoconstriction.

          وكمان **asymmetric dimethylarginine (ADMA)** بتعلى في الـ CKD والـ salt-sensitive HT، وهي بتمنع الـ **NO synthase**.

          التفسير المقبول (مش في الكتاب): الـ **NO** هو أهم موسّع للأوعية، **فـ** لما يقل (ROS أو ADMA)، الأوعية تفضل مضيّقة والضغط يعلى.
      - kind: reveal
        page: 88
        quote: "SNS is overactive in CKD"
        prompt: "عيان CKD ضغطه عالي رغم الأدوية. ليه الـ ACEi/ARB بالذات منطقي هنا، حسب الآليات اللي في الكتاب؟"
        answer: "**لأن** الآليات في الكتاب كلها بتعدّي على الـ **RAAS**: الـ SNS بيعلّي الـ renin، والكلية المريضة بتزوّد الـ **ACE expression** ← angiotensin II أكتر ← renal damage و salt-sensitive HT. الـ ACEi/ARB بيقطع الدايرة دي، وعشان كده الكتاب بيحطهم مع الـ denervation والـ nephrectomy في علاج الـ SNS overactivity."
      - kind: check
