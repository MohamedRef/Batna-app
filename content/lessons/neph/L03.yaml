        page: 78
        quote: "Diuretic resistance, especially in advanced CRS, is a huge challenge."
        question: "Why can hypoalbuminemia cause diuretic resistance, per the book?"
        options:
          - "Reduced protein binding of loop diuretics"
          - "Rebound sodium reabsorption"
          - "Remodelling of mineralocorticoid receptors"
          - "Excess sodium intake"
        answer: 0
        why:
          - "صح: **reduced protein binding** بسبب الـ hypoalbuminemia (والـ metabolic acidosis)."
          - "الـ rebound بيحصل لما مفعول الدوا يخلص."
          - "الـ remodelling في الـ distal nephron."
          - "ده سبب تاني في نفس القايمة، مالوش علاقة بالـ albumin."
      - kind: explain
        page: 79
        title: "إيه اللي بيساعد وإيه لأ"
        quote: "Dopamine has cardiac inotropic and direct kidney effects that can enhance kidney function and diuresis in some patients, but dopamine has not improved clinical or renal outcomes in patients with AKI."
        text: |
          - **Small-volume hypertonic saline:** ممكن يحسّن الـ diuretic response ووظيفة الكلى، غالبًا بتقليل الـ neurohormonal activation.
          - ==Dopamine==: ليه inotropic و direct kidney effects وممكن يزوّد البول، **بس ما حسّنش الـ clinical ولا الـ renal outcomes في الـ AKI**.
          - **Inotropes:** بس لو فيه **hypotension** أو دليل موضوعي على **low cardiac output**؛ الـ empirical use ممنوع علشان الـ toxicity.
      - kind: explain
        page: 79
        quote: "Dopamine has cardiac inotropic and direct kidney effects that can enhance"
        title: "ليه الـ dopamine خذلنا والـ inotropes ليهم شرط؟"
        text: |
          الكتاب: الـ **hypertonic saline** ممكن يحسّن الاستجابة، الـ **dopamine** ما حسّنش الـ outcomes في الـ AKI، والـ **inotropes** بس مع hypotension أو low cardiac output، والـ empirical use ممنوع **بسبب** الـ toxicity.

          التفسير المقبول (مش في الكتاب):

          - الـ **dopamine** بيزوّد البول فعلًا، **بس** البول الزيادة مش معناه إن الكلية اتحمت. الرقم اتحسّن والعيان لأ.
          - الـ **inotropes** بيخلّوا القلب يشتغل أكتر ويستهلك أكسجين أكتر، **فـ** ممكن يعملوا arrhythmias أو ischemia. لو المشكلة مش ضعف ضخ، الخطر من غير فايدة.
      - kind: figure
        page: 79
        quote: "Clinical trials of ultrafiltration therapy\nBlood entry from patient\nRotary pump (blood)\nFilter\nBlood return to patient\nRotary pump (ultrafiltrate)\nUltrafiltrate\nUltrafiltrate collection bag"
        title: "دايرة الـ ultrafiltration: رسمة الكتاب"
        image: { file: neph/L03-ultrafiltration-circuit.webp, book: true }
        alt: "Book drawing of an ultrafiltration circuit. Blood entry from the patient (bottom centre) passes up through a red line to a rotary pump (blood), then into a vertical filter; blood return to the patient runs from the top of the filter back down (red, bottom left). From the filter a blue line goes through a rotary pump (ultrafiltrate) down to an ultrafiltrate collection bag (bottom right)."
        caption: |
          تتبّع الخطوط:

          - **الأحمر (الدم)**: **Blood entry from patient** (تحت في النص، السهم لفوق) ← **Rotary pump (blood)** (الدواير شمال) ← **Filter** (العمود في النص) ← **Blood return to patient** (من فوق، وبعدين نازل تحت شمال).
          - **الأزرق (المية)**: من الـ filter ← **Rotary pump (ultrafiltrate)** (يمين فوق) ← **Ultrafiltrate** نازل ← **Ultrafiltrate collection bag** (تحت يمين).

          يعني الماكينة ==بتسحب مية وملح بس== (isotonic) من غير ما تعدّي على الـ nephron، وده ليه الـ UF مابيشغّلش الـ RAAS زي الـ diuretics. ونفس الدايرة دي هي اللي ليها مضاعفات Table 5 (نزيف، hemolysis، infection).
