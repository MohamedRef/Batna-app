      - kind: explain
        page: 144
        title: "ليه G و A مع بعض؟"
        quote: "Risk of chronic kidney disease (CKD) progression, frequency of visits, and referral to nephrology according to glomerular filtration rate (GFR) and albuminuria.\nCKD is classified based on: Cause (C), GFR (G), Albuminuria (A)\n| GFR categories (mL/min/1.73m2) | A1: Normal to mildly increased (<30 mg/g, <3 mg/mmol) | A2: Moderately increased (30-299 mg/g, 3-29 mg/mmol) | A3: Severely increased (≥300 mg/g, ≥30 mg/mmol) |\n|---|---|---|---|\n| G1: Normal to high (≥90) | 1 if CKD | Treat 1 | Refer* 2 |\n| G2: Mildly decreased (60-89) | 1 if CKD | Treat 1 | Refer* 2 |\n| G3a: Mildly to moderately decreased (45-59) | Treat 1 | Treat 2 | Refer 3 |\n| G3b: Moderately to severely decreased (30-44) | Treat 2 | Treat 3 | Refer 3 |\n| G4: Severely decreased (15-29) | Refer* 3 | Refer* 3 | Refer 4+ |\n| G5: Kidney failure (<15) | Refer 4+ | Refer 4+ | Refer 4+ |"
        text: |
          الكتاب بيصنّف الـ CKD بـ **Cause (C)** و **GFR (G)** و **Albuminuria (A)**، والجدول بيلوّن كل خانة بالخطر وعدد الزيارات والـ ==Refer==.

          ليه الاتنين؟ التفسير المقبول (مش في الكتاب): الـ **G** بيقيس الكلية **فاضل فيها قد إيه**، والـ **A** بيقيس **قد إيه بتتأذي دلوقتي**. عيان eGFR بتاعه 70 بس ACR 400 ممكن يبقى أخطر من عيان eGFR 50 و ACR طبيعي، لأن الـ albuminuria نفسها بتتنبأ بالـ progression والـ cardiovascular events. عشان كده الخطر بيزيد لما تنزل **أو** تروح يمين.
      - kind: try
        items: [dm.L12.014, dm.L12.015, dm.L12.017, dm.L12.018, dm.L12.022]
    recap:
      - "Screening سنوي ACR + eGFR: T1D بعد 5 سنين (بداية معروفة)، T2D من التشخيص (السكر كان مستخبي). ACR >30 أو eGFR <60 ← مرتين في السنة."
      - "10 clues للـ non-DKD: أي حاجة سريعة أو التهابية أو مش ماشية مع مدة السكر."
      - "Staging = Cause + G1–G5 + A1–A3؛ الاتنين لأن كل واحد خطر لوحده."
