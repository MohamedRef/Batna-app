        options: ["Add 3 units", "No change", "Minus 3 units", "Double the dose"]
        answer: 0
        why: "FPG >130 → add 3 units (p127)."
      - reveal: Months later fasting glucose is 110 mg/dl but HbA1c is 8.2%.
        question: Next step?
        options: ["Basal plus: add prandial insulin at the main meal", "Add 3 more basal units", "Stop basal insulin", "Switch to an alpha-glucosidase inhibitor"]
        answer: 0
        why: "HbA1c above target with FBG at target → basal plus, then basal-bolus (p127). More basal would push fasting glucose too low."
    src: { page: 127, quote: "Continue the Maximal dose of OADs. 2. Add NPH, Detemir, Glargine, or Degludec at bedtime." }
