items:
  # ---------- p43-44: cardiovascular hormones ----------
  - id: endo.L04.001
    kind: card
    topic: cv-hormones
    front: Besides pumping, what role does the heart now have according to the book?
    back: It makes cardiovascular hormones; three families are potent regulators of cardiovascular and renal function.
    src: { page: 43, quote: "Although the heart had long been considered merely a muscular pump that performed the physical labor of the circulation, it has been recognized three families of cardiovascular hormones have proven to be potent regulators of cardiovascular and renal function." }
    status: unverified
  - id: endo.L04.002
    kind: card
    topic: cv-hormones
    front: In what modes do the cardiovascular hormones act?
    back: As true endocrine hormones or as autocrine/paracrine hormones, with many physiological and pathological actions.
    src: { page: 43, quote: "Acting as either true endocrine or autocrine/paracrine hormones, they exert a wide variety of physiologically and pathologically actions." }
    status: unverified
  - id: endo.L04.003
    kind: enumerate
    topic: cv-hormones
    prompt: The cardiovascular hormones in the book's diagram.
    points:
      - Natriuretic peptides
      - Endothelins
      - Adrenomedullin
      - Nitric oxide (NO), shown with the endothelins
    pass: 3
    hook: "هرمونات القلب والأوعية 4: natriuretic peptides، endothelins، adrenomedullin، وNO اللي مرسوم جنب الـ endothelins."
    src: { page: 43, quote: "Cardiovascular Hormones\n  Natriuretic peptides\n  Adrenomedullin\n  Endothelins + Nitric oxide (NO)" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.004
    kind: table
    topic: cv-hormones
    title: The natriuretic peptides and where they come from
    columns: [Peptide, Secreted by]
    rows:
      - [Atrial natriuretic peptide (ANP), The heart]
      - [Brain natriuretic peptide (BNP), The heart]
      - [C-type natriuretic peptide (CNP), The endothelium]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 43, quote: "Natriuretic peptides\n  Secreted by the heart:\n    atrial natriuretic peptide (ANP)\n    brain natriuretic peptide (BNP)\n  Secreted by endothelium:\n    C-type natriuretic" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.005
    kind: cloze
    topic: cv-hormones
    text: ANP and BNP are secreted by the {{c1::heart}}, while C-type natriuretic peptide is secreted by the {{c2::endothelium}}.
    src: { page: 43, quote: "Natriuretic peptides\n  Secreted by the heart:\n    atrial natriuretic peptide (ANP)\n    brain natriuretic peptide (BNP)\n  Secreted by endothelium:\n    C-type natriuretic" }
    status: unverified
  - id: endo.L04.006
    kind: enumerate
    topic: cv-hormones
    prompt: Hormones of the endothelium (book diagram).
    points:
      - Endothelins (ET-1, ET-2, ET-3)
      - C-type natriuretic peptide
      - Nitric oxide (NO)
    pass: 3
    hook: "البطانة بتطلع 3: «ET-1 و2 و3، CNP، وNO»."
    src: { page: 44, quote: "Hormones of the Endothelium\n  ENDOTHELINS:\n    ET-1\n    ET-2\n    ET-3\n  C-type natriuretic\n  Nitric oxide (NO)" }
    status: unverified
  - id: endo.L04.007
    kind: cloze
    topic: cv-hormones
    text: The endothelin family has {{c1::three}} members, ET-1, ET-2 and ET-3.
    src: { page: 44, quote: "Hormones of the Endothelium\n  ENDOTHELINS:\n    ET-1\n    ET-2\n    ET-3\n  C-type natriuretic\n  Nitric oxide (NO)" }
    status: unverified
  - id: endo.L04.008
    kind: card
    topic: cv-hormones
    front: What do the endothelins do, and on which cells?
    back: They are potent hypertensive agents acting directly on vascular smooth muscle cells (VSMCs).
    src: { page: 44, quote: "The ETs are potent hypertensive agents that exert their effects directly on the VSMCs Adrenomedullin (Am) The peptide is produced in normal chromaffin cells of the adrenal gland, as well as a variety of other tissues, including brain, kidney, endothelial cells, and VSMCs." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.009
    kind: card
    topic: cv-hormones
    front: Where is adrenomedullin (AM) produced?
    back: In normal chromaffin cells of the adrenal gland, and also in brain, kidney, endothelial cells and VSMCs.
    src: { page: 44, quote: "The ETs are potent hypertensive agents that exert their effects directly on the VSMCs Adrenomedullin (Am) The peptide is produced in normal chromaffin cells of the adrenal gland, as well as a variety of other tissues, including brain, kidney, endothelial cells, and VSMCs." }
    status: unverified
  - id: endo.L04.010
    kind: card
    topic: cv-hormones
    front: Which hypotensive states may adrenomedullin be responsible for?
    back: The hypotension of inflammation, septic shock and atherosclerosis.
    src: { page: 44, quote: "AM may be responsible for the hypotension of inflammation, septic shock, and atherosclerosis." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.011
    kind: cloze
    topic: cv-hormones
    text: The actions of adrenomedullin may be predominantly {{c1::autocrine or paracrine}}.
    src: { page: 44, quote: "The actions of AM may be predominantly autocrine or paracrine in nature." }
    status: unverified
  # ---------- p44, p72: oestrogen ----------
  - id: endo.L04.012
    kind: enumerate
    topic: oestrogen
    prompt: Beneficial effects of oestrogen on the cardiovascular system.
    points:
      - Increases HDL cholesterol
      - Decreases LDL cholesterol
      - Relaxes smooth muscle and dilates vessels, so blood flow increases
    pass: 3
    hook: "الـ oestrogen بيحب القلب بـ 3: «HDL يطلع، LDL ينزل، والأوعية ترتاح وتوسع فالدم يزيد»."
    src: { page: 44, quote: "Estrogen and the cardiovascular system\n  Increases HDL cholesterol.\n  Decreases LDL cholesterol.\n  Relaxes, smooth muscles and dilates blood vessels so blood flow increases." }
    status: unverified
  - id: endo.L04.013
    kind: card
    topic: oestrogen
    front: Which effect of oestrogen works against its cardiovascular benefit?
    back: It promotes blood clot formation (increases coagulability).
    src: { page: 44, quote: "It causes some changes that have the opposite effect:\n  Promotes blood clot formation.\n  Soaks up free radicals, naturally occurring particles in the blood that can damage the arteries and other tissues." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.014
    kind: enumerate
    topic: oestrogen
    prompt: Oestrogen's cardioprotective effects (book list).
    points:
      - Antioxidant
      - Calcium-channel blocker
      - Lowers LDL
      - Raises HDL
    pass: 3
    hook: "الـ oestrogen بيحمي القلب بـ 4: «antioxidant، calcium-channel blocker، LDL ينزل، وHDL يطلع»."
    src: { page: 44, quote: "Estrogen cardioprotective effct\n  Anti-oxidant.\n  Ca – channel blocker.\n  ↓ LDL.\n  ↑ HDL." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.015
    kind: cloze
    topic: oestrogen
    text: Oestrogen soaks up {{c1::free radicals}}, particles in the blood that can damage the arteries.
    src: { page: 44, quote: "It causes some changes that have the opposite effect:\n  Promotes blood clot formation.\n  Soaks up free radicals, naturally occurring particles in the blood that can damage the arteries and other tissues." }
    status: unverified
  - id: endo.L04.016
    kind: card
    topic: oestrogen
    front: Besides lipids, what two other effects of oestrogen does the book list on p72?
    back: It increases triglycerides slightly and increases blood coagulability.
    src: { page: 72, quote: "Estrogen; other effects\n  It increases TG slightly.\n  It increases blood coaguablity." }
    status: unverified
  - id: endo.L04.017
    kind: cloze
    topic: oestrogen
    text: Oestrogen protects against atherogenesis because it {{c1::reduces LDL}} and {{c2::increases HDL}}.
    src: { page: 72, quote: "Estrogen-mediated protection against atherogenesis\nIt reduces LDL It increases HDL." }
    status: unverified
  # ---------- p45: heart failure ----------
  - id: endo.L04.018
    kind: enumerate
    topic: heart-failure
    prompt: Hormones activated in heart failure.
    points:
      - Renin-angiotensin system
      - Aldosterone
      - Sympathetic system (noradrenaline)
      - Neuropeptide Y
    pass: 4
    hook: "القلب الفاشل بيصحّي 4: «RAS، aldosterone، sympathetic (noradrenaline)، وneuropeptide Y»."
    src: { page: 45, quote: "Hormones in Heart Failure\n  1- Activation of the renin-angiotensin system: Abnormally high renin levels in renal venous blood in patients with heart failure.\n  2- Aldosterone.\n  3- Sympathetic system." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.019
    kind: card
    topic: heart-failure
    front: What renin finding is described in heart failure?
    back: Abnormally high renin levels in renal venous blood.
    src: { page: 45, quote: "Hormones in Heart Failure\n  1- Activation of the renin-angiotensin system: Abnormally high renin levels in renal venous blood in patients with heart failure.\n  2- Aldosterone.\n  3- Sympathetic system." }
    status: unverified
  - id: endo.L04.020
    kind: card
    topic: heart-failure
    front: Why is venous plasma noradrenaline useful in heart failure?
    back: It is an index of global sympathetic outflow and predicts prognosis; very high levels mean a worse prognosis.
    src: { page: 45, quote: "Plasma noradrenaline levels, which are often taken as an index of \"global sympathetic outflow\" have been shown to predict prognosis. That is, patients with extremely high venous noradrenaline levels have a worse prognosis as a group than do those with normal levels." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.021
    kind: cloze
    topic: heart-failure
    text: Heart failure patients with extremely high venous {{c1::noradrenaline}} levels have a {{c2::worse}} prognosis as a group.
    src: { page: 45, quote: "Plasma noradrenaline levels, which are often taken as an index of \"global sympathetic outflow\" have been shown to predict prognosis. That is, patients with extremely high venous noradrenaline levels have a worse prognosis as a group than do those with normal levels." }
    status: unverified
  - id: endo.L04.022
    kind: card
    topic: heart-failure
    front: What is neuropeptide Y, and what does its plasma level track in heart failure?
    back: A potent vasoconstrictor in the coronary circulation; its immunoreactivity correlates with plasma noradrenaline.
    src: { page: 45, quote: "4- Neuropeptide y (a potent vasoconstrictor in the coronary circulation. Plasma concentrations of neuropeptide." }
    status: unverified
  # ---------- p45-47 (repeated p71-73): thyroid and heart ----------
  - id: endo.L04.023
    kind: card
    topic: thyroid-heart
    front: How do thyroid disorders affect patients who already have heart disease?
    back: They can worsen old cardiac symptoms, cause new ones and accelerate the underlying heart problem.
    src: { page: 45, quote: "For people with almost any type of heart disease, disorders of the thyroid gland can worsen old cardiac symptoms or cause new ones, and can accelerate the underlying heart problem." }
    status: unverified
  - id: endo.L04.024
    kind: card
    topic: thyroid-heart
    front: Which phases of the cardiac cycle are weakened in hypothyroidism?
    back: Both contraction (systolic dysfunction, reduced ejection) and relaxation (diastolic dysfunction).
    src: { page: 46, quote: "In hypothyroidism the heart muscle is weakened in both its contraction phase, and also its relaxation phase. This means that the heart cannot pump as vigorously as it should, and the amount of blood it ejects with each heart beat is reduced systolic dysfunction. In addition, because the heart muscle does not relax normally in between heart beats, a potentially serious condition called diastolic dysfunction may result." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.025
    kind: cloze
    topic: thyroid-heart
    text: In hypothyroidism the heart muscle does not relax normally between beats, causing {{c1::diastolic dysfunction}}; reduced ejection is {{c2::systolic dysfunction}}.
    src: { page: 46, quote: "In hypothyroidism the heart muscle is weakened in both its contraction phase, and also its relaxation phase. This means that the heart cannot pump as vigorously as it should, and the amount of blood it ejects with each heart beat is reduced systolic dysfunction. In addition, because the heart muscle does not relax normally in between heart beats, a potentially serious condition called diastolic dysfunction may result." }
    status: unverified
  - id: endo.L04.026
    kind: cloze
    topic: thyroid-heart
    text: In hypothyroidism the heart rate is typically {{c1::10–20}} beats per minute slower than normal.
    src: { page: 46, quote: "The heart rate is modulated by thyroid hormone, so that in hypothyroidism the heart rate is typically 10 - 20 beats per minute slower than normal. Especially in patients who also have heart disease, (Hypothyroidism and the heart)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.027
    kind: card
    topic: thyroid-heart
    front: Despite bradycardia, which arrhythmias can hypothyroidism make worse?
    back: Premature beats such as PVCs, and even tachycardias such as atrial fibrillation.
    src: { page: 46, quote: "However, hypothyroidism may worsen the tendency for premature beats (such as pvcs) and even tachycardias such as atrial fibrillation. (Hypothyroidism and the heart)." }
    status: unverified
  - id: endo.L04.028
    kind: enumerate
    topic: thyroid-heart
    prompt: Mechanisms of diastolic hypertension in hypothyroidism.
    points:
      - Stiffer arteries from less nitric oxide in the vessel lining
      - Increased sympathetic activity in vascular smooth muscle; fewer β-receptors, so α-responses dominate
      - Extracellular volume expansion (SIAD) and increased systemic vascular resistance
    pass: 3
    hook: "ضغط الـhypothyroid الدياستولي 3 «شرايين ناشفة، سمبثاوي، مية»: nitric oxide أقل فالشرايين stiff، sympathetic زيادة في vascular smooth muscle مع β-receptors أقل فـα تكسب، وextracellular volume expansion (SIAD) مع systemic vascular resistance أعلى."
    src: { page: 46, quote: "1- Because the arteries are stiffer in hypothyroidism, (dt reduction of the amount of nitric oxide in the lining of the blood vessels, causing them to be stiff this leads to increase in the diastolic blood pressure (Hypothyroidism & CVS)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.029
    kind: cloze
    topic: thyroid-heart
    text: Arteries are stiffer in hypothyroidism because of reduced {{c1::nitric oxide}} in the vessel lining, which raises the {{c2::diastolic}} blood pressure.
    src: { page: 46, quote: "1- Because the arteries are stiffer in hypothyroidism, (dt reduction of the amount of nitric oxide in the lining of the blood vessels, causing them to be stiff this leads to increase in the diastolic blood pressure (Hypothyroidism & CVS)." }
    status: unverified
  - id: endo.L04.030
    kind: cloze
    topic: thyroid-heart
    text: In hypothyroidism the number of {{c1::β-adrenergic}} receptors falls, leading to increased {{c2::α-adrenergic}} responses.
    src: { page: 46, quote: "The number of ß-adrenergic receptors is decreased, leading to increased alpha-adrenergic responses, which may explain the increase in hypertension of hypothyroidism (Hypothyroidism & CVS)." }
    status: unverified
  - id: endo.L04.031
    kind: cloze
    topic: thyroid-heart
    text: In {{c1::32%}} of hypertensive hypothyroid patients, thyroxine replacement lowers diastolic pressure to {{c2::90 mm Hg}} or less.
    src: { page: 46, quote: "3- Diastolic hypertension may result from extra cellular volume expansion (SIAD) and increased systemic vascular resistance. In 32% of hypertensive hypothyroid patients, replacement therapy with thyroxine leads to a fall in diastolic blood pressure to 90 mm Hg or less (Hypothyroidism & CVS)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.032
    kind: card
    topic: thyroid-heart
    front: Which volume mechanism contributes to diastolic hypertension in hypothyroidism?
    back: Extracellular volume expansion (SIAD) with increased systemic vascular resistance.
    src: { page: 46, quote: "3- Diastolic hypertension may result from extra cellular volume expansion (SIAD) and increased systemic vascular resistance. In 32% of hypertensive hypothyroid patients, replacement therapy with thyroxine leads to a fall in diastolic blood pressure to 90 mm Hg or less (Hypothyroidism & CVS)." }
    status: unverified
  - id: endo.L04.033
    kind: card
    topic: thyroid-heart
    front: How can hypothyroidism affect heart failure?
    back: It can worsen well-controlled heart failure and can cause new heart failure in patients with only mild underlying heart disease.
    src: { page: 47, quote: "Worsening of heart failure, or the new onset of heart failure Hypothyroidism can make well- controlled heart failure worsen, and can produce heart failure for the first time in patients with relatively mild underlying heart disease." }
    status: unverified
