  - id: dm.L16.006
    kind: enumerate
    topic: eudka
    prompt: Enumerate the causes of euglycemic ketoacidosis due to decreased circulating glucose.
    points:
      - Starvation
      - Vomiting (ketoacidosis, gastroparesis)
