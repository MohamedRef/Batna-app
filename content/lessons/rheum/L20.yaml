lecture: rheum.L20
lessons:
  # ------------------------------------------------------------------
  - id: rheum.L20.lesson1
    title: "الصدفية لما تنزل على المفاصل"
    hook: "مش كل صدفية بتعمل arthritis، بس لما تعمل، IL-23 هو المايسترو."
    minutes: 8
    pages: [326, 328]
    topics: [definition, genetics, pathogenesis]
    goals:
      - "تعرّف الـ PsA وتعرف نسبتها في الصدفية"
      - "تربط الـ HLA alleles بشكل المرض"
      - "ترسم محور IL-23 / IL-17 / TNF"
    status: unverified
    steps:
      - kind: explain
        page: 326
        title: "التعريف"
        quote: "PsA is an inflammatory arthropathy occurring in 5-20% of patients with psoriasis."
        text: |
          الـ **psoriatic arthritis** (PsA) هو inflammatory arthropathy بيحصل في ==5–20%== من عيانين الصدفية.

          مرض **chronic immune-mediated** بيمسك: الـ **axial** والـ **peripheral joints**، الـ **nails**، الـ **skin**، والـ **entheses**.

          زمان كانوا فاكرينه خفيف، دلوقتي معروف إنه ممكن يبقى **progressive, destructive, deforming**.
      - kind: explain
        page: 326
        title: "الوراثة"
        quote: "Approximately 33 to 50% of PsA patients have at least one first-degree relative who also has PsO or PsA."
        text: |
          - **33–50%** عندهم قريب درجة أولى عنده PsO أو PsA.
          - جينات الـ PsA و الـ PsO ==مش متطابقة==، وفيه جينات بتحدد **phenotype** معين.
          - **HLA genes:** antigen presentation. **Non-HLA genes:** immune activation، cytokine signaling، T-cell function.
      - kind: match
        page: 327
        quote: "Axial involvement, symmetric sacroiliitis, enthesitis, dactylitis"
        prompt: "وصّل الـ HLA بالشكل اللي بيعمله (جدول p327):"
        pairs:
          - ["HLA-B*27:05", "Axial, symmetric sacroiliitis, dactylitis"]
          - ["HLA-B*08:01", "Joint damage, asymmetric sacroiliitis"]
          - ["HLA-C*06:02", "Milder, long delay after psoriasis"]
          - ["HLA-DR4", "Symmetric polyarthritis"]
          - ["HLA-B*44:02", "Protective, milder disease"]
        why: "الـ B27 بيجيب الـ axial والـ enthesitis، الـ B8 بيجيب الـ damage، والـ C*06:02 (جين الصدفية الأشهر) بيأخر الـ arthritis ويخففه."
      - kind: explain
        page: 328
        title: "الـ triggers من بره"
        quote: "joint trauma may induce a flare of arthritis, referred to as the \"internal\" or \"deep\" Koebner phenomenon."
        text: |
          - **Streptococcal infection** (guttate psoriasis) و **antibiotics** حديثة
          - ==Deep Koebner==: زي ما جرح الجلد بيطلّع صدفية (Koebner)، **trauma للمفصل** ممكن يعمل flare
          - **Dysbiosis**
          - **Tobacco** شكله **protective** (controversial)
      - kind: aside
        tone: joke
        page: 328
        quote: "Tobacco appears to be protective against the development of psoriatic arthritis (controversial)."
        text: "الكتاب بيقول التدخين شكله protective ضد الـ PsA. لو عيانك قالك «يبقى أدخّن يا دكتور؟»، قوله: «لا. هتحمي ركبتك وتبوّظ قلبك ورئتك، صفقة خسرانة.» 🚭 والكلمة المهمة هنا **controversial**."
      - kind: figure
        page: 328
        quote: "It stimulates resident T cells (CD3+, CD4-, CD8-, IL-23R+) leading to the production of IL-17, IL-22, and TNF-alpha"
        title: "محور IL-23"
        alt: "Flow diagram. Gut dysbiosis or barrier leak and macrophages and dendritic cells produce IL-23. IL-23 acts on resident IL-23R positive T cells, which release IL-17, IL-22 and TNF-alpha. These cause three outcomes: inflammation, bone erosion via neutrophils and osteoclasts, and new bone (osteoproliferation). TNF-alpha also kills osteoblasts, reducing repair."
        caption: "==IL-23== هو المايسترو، والـ **IL-17 / IL-22 / TNF-α** هم العازفين. علشان كده أدوية الـ PsA بتضرب **TNF** و **IL-17** و **IL-12/23**."
        svg: |
          <svg viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L20a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="20" y="10" width="290" height="50" rx="10" class="fg-box"/>
            <text x="165" y="31" text-anchor="middle" class="t-sm t-b">Macrophages, dendritic cells</text>
            <text x="165" y="49" text-anchor="middle" class="t-sm t-mut">gut barrier leak, dysbiosis</text>
            <path d="M165 60 V82" class="fg-arrow" marker-end="url(#L20a)"/>
            <rect x="95" y="84" width="140" height="40" rx="10" class="fg-acc"/>
            <text x="165" y="110" text-anchor="middle" class="t-lg t-b t-acc">IL-23</text>
            <path d="M165 124 V146" class="fg-arrow" marker-end="url(#L20a)"/>
            <rect x="20" y="148" width="290" height="46" rx="10" class="fg-box"/>
            <text x="165" y="176" text-anchor="middle" class="t-sm t-b">Resident IL-23R+ T cells</text>
            <path d="M165 194 V216" class="fg-arrow" marker-end="url(#L20a)"/>
            <rect x="20" y="218" width="290" height="40" rx="10" class="fg-acc"/>
            <text x="165" y="243" text-anchor="middle" class="t-b t-acc">IL-17 · IL-22 · TNF-α</text>
            <path d="M70 258 V290" class="fg-arrow" marker-end="url(#L20a)"/>
            <path d="M165 258 V290" class="fg-arrow" marker-end="url(#L20a)"/>
            <path d="M260 258 V290" class="fg-arrow" marker-end="url(#L20a)"/>
            <rect x="10" y="292" width="100" height="56" rx="10" class="fg-bad"/>
            <text x="60" y="316" text-anchor="middle" class="t-sm t-b">Inflammation</text>
            <text x="60" y="334" text-anchor="middle" class="t-sm t-mut">skin, joint</text>
            <rect x="115" y="292" width="100" height="56" rx="10" class="fg-bad"/>
            <text x="165" y="316" text-anchor="middle" class="t-sm t-b">Erosions</text>
            <text x="165" y="334" text-anchor="middle" class="t-sm t-mut">osteoclasts</text>
            <rect x="220" y="292" width="100" height="56" rx="10" class="fg-good"/>
            <text x="270" y="316" text-anchor="middle" class="t-sm t-b">New bone</text>
            <text x="270" y="334" text-anchor="middle" class="t-sm t-mut">proliferation</text>
            <text x="165" y="378" text-anchor="middle" class="t-sm t-mut">TNF-α also kills osteoblasts: less repair</text>
          </svg>
      - kind: reveal
        page: 328
        quote: "promote inflammation, bone loss with erosions, and osteoproliferation."
        prompt: "إزاي نفس المرض يعمل erosions ويعمل new bone في نفس الوقت؟"
        answer: |
          نفس الـ cytokines بتشتغل في اتجاهين: الـ **neutrophils** والـ **osteoclasts** بياكلوا العضم (**erosions**)، وفي نفس الوقت الالتهاب عند الـ **enthesis** بيحفّز **osteoproliferation**.

          ده بالظبط اللي هتشوفه في الأشعة: **destruction + new bone** في نفس الصباع.
      - kind: check
        page: 328
        quote: "IL-23, is a central cytokine in the pathogenesis of PsO & PsA."
        question: "Central cytokine in psoriasis and PsA, made by macrophages and dendritic cells?"
        options: ["IL-23", "IL-6", "Interferon-α", "IL-4"]
        answer: 0
        why:
          - "صح: IL-23 بيشغّل الـ resident T cells تطلّع IL-17 و IL-22 و TNF-α."
          - "مش في الـ pathway بتاع الكتاب للـ PsA."
          - "الـ interferon ده بتاع الـ SLE و Sjögren."
          - "IL-4 Th2، مش هنا."
      - kind: try
        items: [rheum.L20.001, rheum.L20.007, rheum.L20.013, rheum.L20.017, rheum.L20.018]
    recap:
      - "PsA في 5–20% من الصدفية؛ joints، axial، nails، skin، entheses."
      - "33–50% عندهم قريب. B27:05 = axial، B8 = damage، C*06:02 = milder، DR4 = symmetric."
      - "Triggers: strep، antibiotics، deep Koebner، dysbiosis؛ tobacco protective (controversial)."
      - "IL-23 ← T cells ← IL-17، IL-22، TNF-α ← inflammation + erosions + new bone."
    practice: [rheum.L20.001, rheum.L20.002, rheum.L20.003, rheum.L20.004, rheum.L20.005, rheum.L20.006, rheum.L20.007, rheum.L20.008, rheum.L20.009, rheum.L20.010, rheum.L20.011, rheum.L20.012, rheum.L20.013, rheum.L20.014, rheum.L20.015, rheum.L20.016, rheum.L20.017, rheum.L20.018, rheum.L20.019]
