  - id: git.L04.lesson8
    title: "عوامل الخطر بالتفصيل"
    hook: "Plummer-Vinson، tylosis، الشاي المغلي، والفقر. ليه كل ده بيروح للـ SCC، وإيه اللي بيروح للـ adenocarcinoma؟"
    minutes: 8
    pages: [145, 146]
    topics: [eso-risk]
    goals:
      - "تعدّ عوامل خطر الـ SCC بالمجموعات"
      - "تعرف أرقام السن والجنس والعرق لكل نوع"
      - "تعرف الجينات اللي بتتأثر"
    status: unverified
    steps:
      - kind: explain
        page: 145
        quote: "Risk of adenocarcinoma\n  Barrett esophagus Age- over 60 (6th -7th decades) Sex- more common in MEN (7times) documented dysplasia tobacco use, obesity, prior radiation therapy. Obesity Whites"
        title: "عوامل خطر الـ adenocarcinoma"
        text: |
          - **Barrett esophagus**، خصوصًا مع documented **dysplasia**.
          - **Age** فوق 60 (العقد السادس والسابع).
          - الرجالة 7 أضعاف الستات.
          - **Tobacco**, **obesity**, prior radiation، والبيض أكتر.

          والـ morphology: بيبدأ flat أو raised patches في الـ distal third، وممكن يكبر لـ nodular mass 5 cm أو أكتر، أو يعمل ulcer ويغزي للعمق.

          التفسير المقبول (مش في الكتاب): الخيط المشترك هنا هو الـ **reflux**: السمنة بتزود الضغط على المعدة فالحمض يطلع، والحمض المزمن يعمل Barrett، والـ Barrett يعمل dysplasia ثم adenocarcinoma. وعلشان كده النوع ده زاد في البلاد اللي السمنة فيها زادت.
      - kind: figure
        page: 145
        quote: "Esophageal adenocarcinoma usually occurs in the distal third of the esophagus and may invade the adjacent gastric cardia."
        title: "من الـ reflux للـ adenocarcinoma"
        alt: "A chain from obesity and reflux to Barrett oesophagus, then documented dysplasia, then adenocarcinoma. Beside it, a sketch of the oesophagus with the tumour in the distal third invading the gastric cardia. Risk boosters listed: men 7 times, age over 60, tobacco, prior radiation, whites."
        caption: |
          - **الشمال**: السلسلة (التفسير المقبول): السمنة والـ **reflux** ← **Barrett** ← ==documented dysplasia== ← adenocarcinoma.
          - **اليمين**: مكانه ==distal third== وممكن يغزو الـ **gastric cardia**.
          - **تحت**: باقي عوامل الكتاب: الرجالة 7 أضعاف، فوق 60، التدخين، الـ radiation، والبيض.
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L04a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
