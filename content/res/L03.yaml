  # ------------------------------------------------------------------ types
  - id: res.L03.014
    kind: card
    topic: types
    front: What does a descriptive research question do?
    back: >-
      It seeks to describe a phenomenon, often "how much", "how often", or "what is the change, clinical
      picture or consequences".
    src: { page: 13, quote: "1- Descriptive Questions: Seek to describe a phenomena and often study \"how much\", \"how often\", or \"what is the change/clinical picture/consequences\".\n  How much tobacco smoking is prevalent among different segments of population?\n  Why they smoke?\n  What they know about the risks of smoking?\n  What was their experience in trying to stop smoking?\n  How often do medical students use computer-assisted learning?\n  What is the pattern of occurrence of disease X in terms of person, place and time?\n  What is the prevalence of depression among medical students?" }
    status: unverified
    tags: [definition, high-yield]
  - id: res.L03.015
    kind: card
    topic: types
    front: What does a comparative research question do, and how does it often begin?
    back: >-
      It examines the difference between two or more groups in relation to one or more variables. It often
      begins with "What is the difference…".
    src: { page: 14, quote: "2- Comparative Questions: Aim to examine the difference between two or more groups in relation to one or more variables. The questions often begin with \"What is the difference…\".\n  What is the difference in growth pattern of breast-fed and bottle-fed infants?\n  What is the difference in maternal mortality in an urban compared to a rural community?\n  What is the difference between prevalence of depression among medical students and tourism students?" }
    status: unverified
    tags: [definition, high-yield]
  - id: res.L03.016
    kind: card
    topic: types
    front: What does a causal research question do, and what is its other name?
    back: >-
      It compares two or more phenomena and determines whether a relationship exists. It is often called a
      relationship research question.
    src: { page: 15, quote: "3- Causal Questions: Compares two or more phenomena and determines if a relationship exists. Often called relationship research questions.\n  Does the number of cigarettes smoked per day affect the severity of obstructive pulmonary disease COPD?\n  Does the time of moderate daily exercise affect the extent of improvement in blood pressure?" }
    status: unverified
    tags: [definition, high-yield]
  - id: res.L03.017
    kind: table
    topic: types
    title: The three main types of research question
    columns: [Type, What it does, Lecture example]
    rows:
      - [Descriptive, "Describes a phenomenon: how much, how often, what is the change or picture", "What is the prevalence of depression among medical students?"]
      - [Comparative, "Examines the difference between two or more groups in one or more variables", "What is the difference in maternal mortality in an urban compared to a rural community?"]
      - [Causal, "Compares phenomena and determines if a relationship exists", "Does the number of cigarettes smoked per day affect the severity of chronic obstructive pulmonary disease (COPD)?"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 12, quote: "Three main types of research questions:\n  1- Descriptive Questions\n  2- Comparative Questions\n  3- Causal Questions" }
    status: unverified
  - id: res.L03.018
    kind: mcq
    topic: types
    stem: '"What is the prevalence of depression among medical students?" What type of research question is this?'
    options: [Descriptive, Comparative, Causal, It is a hypothesis]
    answer: 0
    why:
      - "It asks how much of something there is in one group: descriptive."
      - "A comparative question needs two or more groups."
      - "A causal question asks whether one thing affects another."
      - "A hypothesis is a statement that predicts, not a question."
    src: { page: 13, quote: "1- Descriptive Questions: Seek to describe a phenomena and often study \"how much\", \"how often\", or \"what is the change/clinical picture/consequences\".\n  How much tobacco smoking is prevalent among different segments of population?\n  Why they smoke?\n  What they know about the risks of smoking?\n  What was their experience in trying to stop smoking?\n  How often do medical students use computer-assisted learning?\n  What is the pattern of occurrence of disease X in terms of person, place and time?\n  What is the prevalence of depression among medical students?" }
    status: unverified
  - id: res.L03.019
    kind: mcq
    topic: types
    stem: '"What is the difference between the prevalence of depression among medical students and tourism students?" What type of research question is this?'
    options: [Descriptive, Comparative, Causal, Qualitative]
    answer: 1
    why:
      - "It goes beyond describing one group: it sets two groups side by side."
      - "Two groups, one variable, \"what is the difference\": comparative."
      - "It does not ask whether studying medicine causes depression."
      - "It measures prevalence, a number: a quantitative question."
    src: { page: 14, quote: "2- Comparative Questions: Aim to examine the difference between two or more groups in relation to one or more variables. The questions often begin with \"What is the difference…\".\n  What is the difference in growth pattern of breast-fed and bottle-fed infants?\n  What is the difference in maternal mortality in an urban compared to a rural community?\n  What is the difference between prevalence of depression among medical students and tourism students?" }
    status: unverified
  - id: res.L03.020
    kind: mcq
    topic: types
    stem: '"Does the time of moderate daily exercise affect the extent of improvement in blood pressure?" What type of research question is this?'
    options: [Descriptive, Comparative, Causal, Not a research question]
    answer: 2
    why:
      - "It does not just describe how much people exercise."
      - "It compares no two named groups."
      - "\"Does X affect Y?\": it looks for a relationship, so it is causal (relationship) research."
      - "It is a clear question with measurable variables."
    src: { page: 15, quote: "3- Causal Questions: Compares two or more phenomena and determines if a relationship exists. Often called relationship research questions.\n  Does the number of cigarettes smoked per day affect the severity of obstructive pulmonary disease COPD?\n  Does the time of moderate daily exercise affect the extent of improvement in blood pressure?" }
    status: unverified
  - id: res.L03.021
    kind: mcq
    topic: types
    stem: '(Lecture quiz) What type of research question is: "How often do college students change majors?"'
    options: [Causal question, Descriptive question, Comparative question, None of these]
    answer: 1
    why:
      - "No relationship between two variables is asked about."
      - "\"How often\" describes a phenomenon: descriptive. This is the quiz answer."
      - "There is only one group."
      - "It fits the descriptive type."
    src: { page: 74, quote: "Quiz:\n1) What type of research question is the following: How often do college students change majors?\n  A. Causal Question\n  B. Descriptive Question\n  C. Comparative Question\n  D. None of these\n2) A hypothesis is commonly used in quantitative studies, but is not appropriate for qualitative studies.\n  A. True\n  B. False\n3) Would the following be an example of a research question or a research hypothesis: Motorcycle riders who wear helmets sustain fewer injuries.\n  A. Research Hypothesis\n  B. Research Question\n  C. Neither of these\n  D. Both of these" }
    status: unverified
    tags: [lecture-quiz]
  - id: res.L03.022
    kind: card
    topic: types
    front: '(Lecture quiz) True or false: "Causal research questions are used when wanting to compare a variable between two or more groups."'
    back: >-
      False (the quiz answer). Comparing a variable between two or more groups is a comparative question;
      a causal question looks for a relationship between phenomena.
    src: { page: 76, quote: "4) Causal research questions are used when wanting to compare a variable between two or more groups.\n  A. True\n  B. False\n5) If you were making a predictive statement about your research topic, which of the following would you use?\n  A. Research Question\n  B. Descriptive Question\n  C. Hypothesis\n  D. None of these" }
    status: unverified
    tags: [lecture-quiz]
  - id: res.L03.023
    kind: cloze
    topic: types
    text: "Comparative questions often begin with \"{{c1::What is the difference}}…\", and causal questions are often called {{c2::relationship}} research questions."
    src: { page: 15, quote: "3- Causal Questions: Compares two or more phenomena and determines if a relationship exists. Often called relationship research questions.\n  Does the number of cigarettes smoked per day affect the severity of obstructive pulmonary disease COPD?\n  Does the time of moderate daily exercise affect the extent of improvement in blood pressure?" }
    status: unverified
  - id: res.L03.024
    kind: card
    topic: types
    front: What can qualitative research add to health research?
    back: >-
      It can help close the gap between the science of discovery and the implementation of results. It is
      often needed to find out why research results are not translated into practice.
    src: { page: 17, quote: "Qualitative research can help in closing the gap between the science of discovery and the implementation of results. Qualitative research is often needed to find out why research results are often not translated into practice." }
    status: unverified
  - id: res.L03.025
    kind: card
    topic: types
    front: How do qualitative research questions differ from quantitative ones?
    back: >-
      Qualitative questions tend to be open and descriptive, and one general open question may be followed
      by several sub-questions. Quantitative questions should remain fixed.
    src: { page: 18, quote: "Qualitative research questions tend to be open and descriptive, unlike Quantitative research questions which should remain fixed.\nWords such as: 'seek to understand', 'describe', 'explore' give clues to the methodology to be used.\nOne general open question may be followed by a number of sub-questions." }
    status: unverified
    tags: [high-yield]
