  # ---------- p123-125: nutrition ----------
  - id: geri.L07.092
    kind: card
    topic: nutrition
    front: Why should frailty assessment include questions on diet, appetite and weight?
    back: Nutritional problems carry a poor prognosis but are potentially treatable, and they can also be markers of other underlying medical conditions.
    src: { page: 123, quote: "Recognition of nutritional problems in older people is important as these are associated with poor prognosis but are potentially treatable. Any assessment of frailty should include some key questions about diet, appetite and weight, as these can indicate specific problems related to nutrition as well as being markers of other underlying medical conditions." }
    status: unverified
  - id: geri.L07.093
    kind: cloze
    topic: nutrition
    text: "Malnutrition risk factors: involuntary weight loss of more than {{c1::5%}} over the last month or more than {{c2::10%}} over six months; body mass index (BMI) below {{c3::20}} in people aged 65 or more; and decreased appetite or intake."
    src: { page: 123, quote: "Frequently used risk factors for malnutrition are:\n  Involuntary weight loss (more than 5% over the last month or more than 10% over the last six months).\n  BMI less than 20 for elderly (≥ 65y).\n  Decreased appetite or reduced food intake" }
