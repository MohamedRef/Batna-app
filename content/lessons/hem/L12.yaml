lessons:
  # ------------------------------------------------------------------
  - id: hem.L12.lesson1
    title: "الـ lymphoma: كتلة مش سايل"
    hook: "الفرق بين lymphoma و leukaemia ساعات بيبقى بس: الخلية قاعدة في الغدة ولا نازلة تتمشى في الدم؟"
    minutes: 9
    pages: [190, 191]
    topics: [overview, cytogenetics]
    goals:
      - "تعرّف الـ lymphoma وتعرف أرقامه"
      - "تفهم ليه الـ WHO جمع CLL و ALL مع الـ lymphomas"
      - "تحفظ الـ translocations الأربعة وتأثير كل واحد، وليه بيفرق في السرعة"
    status: unverified
    steps:
      - kind: explain
        page: 190
        quote: "Lymphomas are malignant disorders that derive from Lymphoid cells. They may arise from mature T-cells or B-cells. Lymphomas are divided into Hodgkin's Lymphoma and non- Hodgkin's Lymphoma. Hodgkin's Lymphoma is diagnosed histologically by the presence of Reed-Sternberg cells. The overall incidence of Lymphomas is 5-10 cases per/100,000 population each year. There are approximately 2 cases of non-Hodgkin's Lymphoma for each case of Hodgkin's. Lymphoma as a class shows a 3:2 predilection for males."
        title: "التعريف"
        text: |
          الـ ==lymphomas== أورام خبيثة من الـ **lymphoid cells**، من الـ mature **T-cells أو B-cells**.

          - نوعين: **Hodgkin** و **non-Hodgkin**.
          - الـ Hodgkin بيتشخص بوجود ==Reed-Sternberg cells== في الـ histology.

          يعني التقسيمة الأولى مش بالأعراض ولا بالمكان، بالـ **ميكروسكوب**: لقيت RS cell يبقى Hodgkin، مالقيتش يبقى non-Hodgkin. وعشان كده أول خطوة في أي غدة مشكوك فيها هي الـ biopsy، مش الأشعة.
      - kind: explain
        page: 190
        quote: "Lymphomas are malignant disorders that derive from Lymphoid cells. They may arise from mature T-cells or B-cells. Lymphomas are divided into Hodgkin's Lymphoma and non- Hodgkin's Lymphoma. Hodgkin's Lymphoma is diagnosed histologically by the presence of Reed-Sternberg cells. The overall incidence of Lymphomas is 5-10 cases per/100,000 population each year. There are approximately 2 cases of non-Hodgkin's Lymphoma for each case of Hodgkin's. Lymphoma as a class shows a 3:2 predilection for males."
        title: "الأرقام"
        text: |
          - Incidence: **5-10/100,000** في السنة.
          - لكل حالة Hodgkin فيه حوالي **2 Non-Hodgkin lymphoma (NHL)**.
          - الرجالة أكتر: **3:2**.

          ليه الـ NHL ضعف الـ Hodgkin؟ التفسير المقبول (مش في الكتاب): الـ NHL مش مرض واحد، ده عيلة كاملة من أنواع كتير (هتشوفها في ص 199–202)، فطبيعي مجموعها يغلب مرض واحد زي الـ Hodgkin. ونفس الـ 3:2 للرجالة هترجع تقابلك في الـ NHL لوحده (ص 199).
      - kind: explain
        page: 190
        quote: "The distinction between Lymphomas and Lymphoid Leukaemias is somewhat artificial. Lymphomas are generally thought of as being solid (lumps), whereas Leukaemias are liquid with malignant cells found into the peripheral blood. Thus chronic Lymphocytic Leukaemia and acute Lymphoblastic Leukaemia are now classified according to WHO Classification with Lymphomas under the title of Lymphoid malignancies."
        title: "Lymphoma ولا leukaemia؟"
        text: |
          التفرقة **artificial** شوية:

          - الـ lymphoma = ==solid== (كتل، lumps).
          - الـ leukaemia = **liquid**: الخلايا الخبيثة في الدم.

          علشان كده الـ World Health Organization (WHO) حط الـ **chronic lymphocytic leukaemia (CLL)** والـ **acute lymphoblastic leukaemia (ALL)** مع الـ lymphomas تحت اسم واحد: **lymphoid malignancies**.

          ليه artificial؟ لأن الـ lymphocyte أصلًا خلية **بتتنقل**: بتلف بين الدم والغدد طول الوقت. فنفس الـ clone ممكن يتشاف كتلة في غدة النهارده، وفي الدم بكرة. والكتاب نفسه هيوريك ده في المقارنة (ص 203): الـ NHL بيوصل الـ peripheral blood في 10–40%.
      - kind: aside
        tone: analogy
        page: 190
        quote: "The distinction between Lymphomas and Lymphoid Leukaemias is somewhat artificial. Lymphomas are generally thought of as being solid (lumps), whereas Leukaemias are liquid with malignant cells found into the peripheral blood. Thus chronic Lymphocytic Leukaemia and acute Lymphoblastic Leukaemia are now classified according to WHO Classification with Lymphomas under the title of Lymphoid malignancies."
        text: "نفس العصابة: لو قاعدين في الشقة (الغدة) اسمهم lymphoma، لو نازلين الشارع (الدم) اسمهم leukaemia. الـ WHO قال خلاص دي عصابة واحدة."
      - kind: table
        page: 191
        quote: "Follicular Lymphoma: t (14;18) → BCL-2 expression leading to failure of apoptosis."
        title: "الـ translocations"
        columns: ["Lymphoma", "Lesion", "Effect"]
        rows:
          - ["Burkitt", "t(8;14), 75%", "c-MYC: proliferation"]
          - ["Follicular", "t(14;18)", "BCL-2: no apoptosis"]
          - ["Mantle cell", "t(11;14)", "Cyclin D1: proliferation"]
          - ["Large cell", "BCL-6", "-"]
        hide: [[0, 1], [1, 1], [2, 1], [1, 2], [3, 1]]
      - kind: explain
        page: 190
        quote: "Burkitt's Lymphoma: In 75% of cases t (8;14) leading to up-regulation and expression of the C-MyC protein→ cell proliferation and a failure of apoptosis."
        title: "Burkitt: الـ MYC بيدوس بنزين"
        text: |
          في **75%** من الـ Burkitt فيه ==t(8;14)==، والنتيجة **up-regulation** للـ **c-MYC protein**، فـ:

          - **Cell proliferation**: الخلايا بتتقسم بسرعة.
          - و **failure of apoptosis**: ومش بتموت كمان.

          يعني الـ Burkitt عنده الاتنين مع بعض: بنزين ومفيش فرامل. وعشان كده هتلاقيه في الـ WHO (ص 202) تحت **highly aggressive**. الصورة في ص 191 بتوري ورم Burkitt مالي الـ mandible والـ soft tissue حواليها: ورم بالسرعة دي بيكبر قدام عينك.
      - kind: figure
        page: 191
        quote: "Burkitt's lymphoma: characteristic facial swelling caused by extensive tumour involvement of the mandible and surrounding soft tissues."
        title: "صورة الكتاب: وش طفل عنده Burkitt"
        image: { file: hem/L12-burkitt-face.webp, book: true }
        alt: "Book clinical photograph of a young child's face: the lower face and jaw are hugely and asymmetrically swollen, more on the right side of the picture, with the eyes half closed and the lips pushed forward."
        caption: |
          صورة طفل، والكتاب كاتب تحتها إن ده الـ facial swelling المميز للـ ==Burkitt's lymphoma==:

          - **النص السفلي من الوش** (الفك والخدود) **منفوخ جامد**، وأكتر على **يمين الصورة**.
          - الورم ده جاي من **الـ mandible والـ soft tissues اللي حواليه**، مش من غدد في الرقبة.
          - العينين نص مقفولة والشفايف متزقوقة لقدام من الضغط.

          وده ربط بالخطوة اللي فوق: ==C-MYC== بيدوس بنزين على الانقسام، فالورم بيكبر في أيام، ومن هنا الكتلة الضخمة دي في طفل.
      - kind: explain
        page: 191
        quote: "Follicular Lymphoma: t (14;18) → BCL-2 expression leading to failure of apoptosis.\n  Mantle cell Lymphoma: t (11;14)→ BCL-1 (Cyclin D 1) expression→\n  cellular proliferation.\n  Large cell Lymphoma: characterized by the expression of BCL-6."
        title: "تلاتة كمان، وكل واحد بيعمل حاجة مختلفة"
        text: |
          - **Follicular**: ==t(14;18)== ← **BCL-2** ← **failure of apoptosis** بس.
          - **Mantle cell**: **t(11;14)** ← **BCL-1 (cyclin D1)** ← **proliferation**.
          - **Large cell**: بيتميز بالـ **BCL-6**.

          ليه ده يهمك في الامتحان؟ التفسير المقبول (مش في الكتاب): الـ translocation بيقولك **السرعة**. الـ follicular خلاياه **مش بتموت** بس مش بتجري، فبتتراكم على مهل سنين (indolent، ص 204). الـ mantle خلاياه **بتتقسم**، فبيبقى aggressive (ص 202). يعني «فشل الموت» = بطيء، «زيادة الانقسام» = سريع.
      - kind: reveal
        page: 191
        quote: "Follicular Lymphoma: t (14;18) → BCL-2 expression leading to failure of apoptosis."
        prompt: "ليه كل الـ translocations دي فيها chromosome 14؟"
        answer: "على 14q32 فيه الـ IgH gene، وده جين شغّال طول الوقت في الـ B cell. لما oncogene (MYC أو BCL-2 أو cyclin D1) يتلزق جنبه، بياخد نفس الـ promoter القوي ويشتغل على طول. نفس فكرة الـ 14q في الـ myeloma. (physiology معروفة، والكتاب ذكر الـ translocations.)"
      - kind: mnemonic
        page: 191
        quote: "Mantle cell Lymphoma: t (11;14)→ BCL-1 (Cyclin D 1) expression→ cellular proliferation."
        word: "BFM"
        parts:
          - { key: "B", text: "Burkitt = 8;14 = MYC (8 ← M, شكلها زي بعض)" }
          - { key: "F", text: "Follicular = 14;18 = BCL-2 (18 ← سن الرشد: مش عايز يموت)" }
          - { key: "M", text: "Mantle = 11;14 = cyclin D1 (BCL-1، والـ 1 في الـ 11)" }
        hook: "BCL-1 مع 11، BCL-2 مع 18، و MYC مع 8."
      - kind: match
        page: 190
        quote: "Burkitt's Lymphoma: In 75% of cases t (8;14) leading to up-regulation and expression of the C-MyC protein→ cell proliferation and a failure of apoptosis."
        prompt: "وصّل الـ translocation بالـ lymphoma:"
        pairs:
          - ["t(8;14)", "Burkitt"]
          - ["t(14;18)", "Follicular"]
          - ["t(11;14)", "Mantle cell"]
          - ["BCL-6", "Large cell"]
        why: "Burkitt: c-MYC. Follicular: BCL-2 (فشل الـ apoptosis). Mantle: BCL-1/cyclin D1. Large cell: BCL-6."
      - kind: check
        page: 191
        quote: "Follicular Lymphoma: t (14;18) → BCL-2 expression leading to failure of apoptosis."
        question: "Which lymphoma grows mainly because its cells fail to die (apoptosis), not because they divide fast?"
        options: ["Follicular (BCL-2)", "Burkitt (c-MYC)", "Mantle cell (cyclin D1)", "Large cell (BCL-6)"]
        answer: 0
        why:
          - "صح: الـ BCL-2 بيمنع الـ apoptosis، علشان كده الـ follicular بطيء (indolent)."
          - "الـ MYC بيزوّد الـ proliferation جامد، علشان كده Burkitt سريع جدًا."
          - "الـ cyclin D1 بيدفع الـ cell cycle (proliferation)."
          - "الكتاب ذكر بس إن الـ BCL-6 مميز للـ large cell."
      - kind: try
        items: [hem.L12.002, hem.L12.003, hem.L12.006, hem.L12.007, hem.L12.008]
    recap:
      - "Lymphoma = ورم من الـ lymphoid cells، Hodgkin (RS cells) و non-Hodgkin: التقسيمة بالميكروسكوب."
      - "5-10/100,000؛ NHL ضعف Hodgkin لأنه عيلة كاملة؛ رجالة 3:2."
      - "Solid = lymphoma، liquid = leukaemia؛ الـ lymphocyte بتلف، فالـ WHO جمعهم."
      - "Burkitt t(8;14) MYC: proliferation + no apoptosis = أسرع واحد."
      - "Follicular t(14;18) BCL-2 (مش بيموت = بطيء)؛ mantle t(11;14) cyclin D1 (بيتقسم = سريع)؛ large cell BCL-6."
    practice: [hem.L12.001, hem.L12.002, hem.L12.003, hem.L12.004, hem.L12.005, hem.L12.006, hem.L12.007, hem.L12.008, hem.L12.009, hem.L12.010, hem.L12.079, hem.L12.080]
  # ------------------------------------------------------------------
  - id: hem.L12.lesson2
    title: "شخّص وادّي stage"
    hook: "الـ biopsy بيقولك إيه هو، والـ Ann Arbor بيقولك وصل لفين. والـ B؟ دي اللي بتقلب الخطة."
    minutes: 10
    pages: [192, 193]
    topics: [workup, staging]
    goals:
      - "تعرف الـ B-cell markers وليه الـ CD20 بالذات مهم"
      - "تعرف الـ staging investigations وسبب كل واحد"
      - "تعمل Ann Arbor مع A/B، وتعرف الـ IPI"
    status: unverified
    steps:
      - kind: explain
        page: 192
        quote: "The CD 20 is one such molecule exclusively expressed on B-cells. Besides, CD 19, CD 22 and CD 79 are other examples of B-cell expressed molecules identified by antibody binding, by flow-cytometry method."
        title: "Immunophenotyping"
        text: |
          بنلزق **labelled antibodies** على الخلايا ونقراها بالـ **flow cytometry**. الأسامي بنظام الـ **CD (Cluster Differentiation)**.

          - ==CD20==: على الـ B-cells **بس**.
          - كمان **CD19, CD22, CD79**: B-cell markers.

          ليه الـ CD20 بالذات؟ لأن «exclusively on B-cells» معناها إنه **عنوان** يخلّيك تضرب الـ B cells من غير ما تلمس غيرها. وده بالظبط اللي الـ **rituximab (anti-CD20)** بيعمله في علاج الـ follicular والـ DLBCL (ص 204 و 206). يعني نفس الـ marker اللي بيشخّص هو اللي بيعالج.
      - kind: explain
        page: 192
        quote: "The diagnosis is based on the histological appearance of an enlarged lymph node or other affected tissues or cytology of blood, BM or cerebrospinal fluid (CSF), but this is usually backed by immunophenotyping, cytogenetic and molecular techniques."
        title: "التشخيص"
        text: |
          الأساس ==histology== لغدة كبيرة أو نسيج متأثر، أو cytology من الدم أو النخاع أو الـ cerebrospinal fluid (CSF).

          وبعدين بندعمه بالـ immunophenotyping والـ cytogenetics والـ molecular techniques.

          ليه مش الـ histology لوحدها؟ التفسير المقبول (مش في الكتاب): أنواع كتير من الـ NHL شكلها قريب تحت الميكروسكوب (small cells شبه بعض)، والفرق الحقيقي في الـ markers والـ translocation اللي في ص 190–191. فالـ histology بتقول «lymphoma»، والباقي بيقول «أنهي واحد».
      - kind: explain
        remind: [hem.L12.014]
        page: 192
        quote: "Once the diagnosis of lymphoma has been made by biopsy or examination of blood, pleural fluid or perhaps CSF, staging should be undertaken by:\n  1- CT-scanning; ultrasound; chest X-ray.\n  2- Bone marrow biopsy is important in non-Hodgkin's Lymphoma due to the high frequency of bone marrow involvement in this disorder.\n  3- Serum Lactate dehydrogenase → confers a poor prognosis.\n  4- Immunoglobulins should be measured and monoclonal proteins."
        title: "الـ staging work-up"
        text: |
          1. **Computed tomography (CT)، ultrasound، chest X-ray**: نشوف الغدد فين.
          2. ==Bone marrow biopsy==: مهم في الـ Non-Hodgkin lymphoma (NHL) **لأن** النخاع بيتصاب فيه كتير (الكتاب بيقول كده، والمقارنة في ص 204 بتأكد: frequent في الـ NHL و uncommon في الـ Hodgkin).
          3. **Lactate dehydrogenase (LDH)**: عالي = poor prognosis.
          4. **Immunoglobulins** و monoclonal proteins.

          ليه الـ LDH وحش؟ التفسير المقبول (مش في الكتاب): الـ LDH إنزيم جوه الخلايا، وبيطلع لما خلايا كتير تتكسر. فكل ما الورم أكبر وبيتقلب أسرع، الـ LDH بيعلى. يعني هو مقياس تقريبي لحجم وسرعة الورم.
      - kind: figure
        page: 193
        quote: "Ann Arbor staging classification:\n  Stage III: Involvement of lymph node groups on both sides of the diaphragm.\n  Stage IV: Involvement of extralymphatic sites e.g. bone marrow or liver."
        title: "Ann Arbor على الجسم"
        alt: "Four small body outlines with a dashed horizontal line for the diaphragm. Stage I: one node group in the neck. Stage II: neck and mediastinal nodes, both above the diaphragm. Stage III: nodes above and below the diaphragm. Stage IV: liver and bone marrow involved."
        caption: "الحجاب الحاجز هو الخط الفاصل: جانب واحد = II، الجانبين = III، عضو برّه الغدد = IV."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="20" width="75" height="190" rx="30" class="fg-box"/>
            <rect x="88" y="20" width="75" height="190" rx="30" class="fg-box"/>
            <rect x="171" y="20" width="75" height="190" rx="30" class="fg-box"/>
            <rect x="254" y="20" width="71" height="190" rx="30" class="fg-box"/>
            <path d="M5 110H325" class="fg-thin"/>
            <circle cx="42" cy="45" r="7" class="fg-dot-bad"/>
            <circle cx="125" cy="45" r="7" class="fg-dot-bad"/>
