    kind: card
    topic: ln-initial
    front: When is an MPAA-based regimen the preferred initial therapy for proliferative lupus nephritis?
    back: In patients at high risk of infertility, such as those with moderate-to-high prior cyclophosphamide exposure.
    src: { page: 457, quote: "Standard-dose i.v. cyclophosphamide was shown to be less toxic than oral cyclophosphamide, but the dose and duration of oral treatment in these reports were substantially higher and longer than those currently recommended (Supplementary Table S1313. 148). The incidence of bladder toxicity is also felt to be lower with i.v. cyclophosphamide. Reduced-dose i.v. cyclophosphamide has the most favorable immediate toxicity profile among the 3 cyclophosphamide regimens.\nThe risk of future hematologic malignancy is related to total lifetime exposure (>36 g), as is myelofibrosis (>80 g). Total lifetime exposure plus age constitutes a significant risk factor for premature ovarian failure (>7.5-15 g/m² for young to older pediatric patients, respectively; 300 mg/kg for adults). Point 10.2.3.1.3: An MPAA-based regimen is the preferred initial therapy of e LN for patients at high risk of infertility, patients who have a moderate to h namide exposure." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.041
    kind: enumerate
    topic: ln-initial
    prompt: When may a CNI-containing initial regimen (voclosporin, tacrolimus or cyclosporine) be preferred?
    points:
      - Relatively preserved kidney function
      - Nephrotic-range proteinuria from extensive podocyte injury
      - Cannot tolerate standard-dose MPAA
      - Unfit for or unwilling to use cyclophosphamide
    pass: 3
    hook: "الـ CNI يكسب في 4: «كلية لسه كويسة، بروتين nephrotic-range من podocytes مضروبة، MPAA بالجرعة العادية مش مستحمَل، وcyclophosphamide مش مناسب أو مرفوض». 1 كلية + 1 بروتين + 2 بدايل اتشالوا."
    src: { page: 457, quote: "MMF for initial treatment of proliferative LN have targeted dosing of 2-3 g/d. Sev shown that MMF has comparable short-term efficacy to oral or i.v. cyclophosphat complete and partial renal responses (Supplementary Table S713-15, 98, 116, 120-123) . M astrointestinal toxicity, and at moderate-to-high doses, some patients may not toler gastrointestinal intolerance, a trial of enteric-coated mycophenolic acid (MPA) in 0-2160 mg is warranted, in view of its greater gastrointestinal tolerance. 141 Actice Point 10.2.3.1.4: Initial therapy with an immunosuppressive regimen that include voclosporin, tacrolimus, or cyclosporine) may be preferred in patients with relatively ved kidney function and nephrotic-range proteinuria likely due to extensive podocyte ', as well as patients who cannot tolerate standard-dose MPAA or are unfit for or will n clophosphamide-based regimens." }
    status: unverified
  - id: neph.L14.042
    kind: card
    topic: ln-mpaa-cni
    front: Why do CNIs reduce proteinuria quickly in lupus nephritis?
    back: Besides blocking T-cell activation and IL-2 release, they stabilize the podocyte cytoskeleton.
    src: { page: 458, quote: "I are potent immunosuppressive medications due to their inhibition of T lymphocyte activat lease of interleukin-2. They also modulate the podocyte cytoskeleton, leading to reduction of nuria in various glomerular diseases. The use of a CNI in the treatment of LN may therefore re effective or more rapid reduction of proteinuria." }
    status: unverified
  - id: neph.L14.043
    kind: card
    topic: ln-mpaa-cni
    front: When is triple therapy with belimumab, glucocorticoids and MPAA or reduced-dose cyclophosphamide considered?
    back: In repeated renal flares or high risk of progression to kidney failure.
    src: { page: 458, quote: "Practice Point 10.2.3.1.5: A triple immunosuppressive regimen of belimumab with glucocorticoids and either MPAA or reduced-dose cyclophosphamide may be considered in patients with repeated renal flares or at high-risk for progression to kidney failure." }
    status: unverified
  - id: neph.L14.044
    kind: card
    topic: ln-mpaa-cni
    front: When may azathioprine or leflunomide with glucocorticoids replace the standard initial drugs, and at what cost?
    back: With intolerance, lack of availability or excessive cost of standard drugs; they may be less effective with more flares or toxicity.
    src: { page: 458, quote: "Practice Point 10.2.3.1.6: Other therapies, such as azathioprine or leflunomide combined with glucocorticoids, may be considered in lieu of the recommended initial drugs for proliferative LN in situations of patient intolerance, lack of availability, and/or excessive cost of standard drugs, but these alternatives may be associated with inferior efficacy, including increased rate of disease flares and/or increased incidence of drug toxicities. Practice Point 10.2.3.1.7. Newer biologic and non-biologic therapies are under development and may offer future options for the treatment of active LN. Rituximab may be considered for patients with persistent disease activity or inadequate response to initial standard-of-care therapy." }
    status: unverified
