lessons:
  # ------------------------------------------------------------------
  - id: dm.L12.lesson1
    title: "الكلية والسكر: إزاي تعرف الـ DKD"
    hook: "السكر هو السبب الأول للـ renal failure. نعرف شكله المعتاد، والشكل اللي من غير albuminuria، وإمتى نشك في حاجة تانية."
    minutes: 7
    pages: [142, 144]
    topics: [ckd-burden, dkd-diagnosis, screening]
    goals:
      - "تعرّف الـ CKD والـ DKD المعتاد"
      - "تعرّف الـ non-albuminuric DKD (سؤال كتاب)"
      - "تعرف الـ screening والـ 10 clues للـ non-DKD وتعمل staging"
    status: unverified
    steps:
      - kind: explain
        page: 142
        title: "الحجم الحقيقي للمشكلة"
        quote: "defined as either kidney damage or decreased kidney function for ≥ 3 months"
        text: |
          الـ **CKD** = kidney damage أو decreased kidney function لمدة ==≥ 3 months==، أيًا كان السبب.

          - ==Diabetes is the most common cause== of renal failure.
          - في أمريكا الـ ESRD عند الـ diabetics **اتضاعف 3 مرات** بين 1989 و1998، والـ hypertension فضل ثابت تقريبًا.
          - في الـ Native Americans السكر الأول، وفي الـ African Americans الضغط الأول.

          وليه صعب؟ glycemic control مش كويس، وcomorbidities، والأقراص لازم تتختار بحذر.
      - kind: check
        page: 143
        quote: "Problem in Insulin Metabolism 3. Reduce Gluconeogenesis 4. Incidence of Hypoglycemia"
        question: "Why must oral antidiabetics be chosen carefully in renal impairment?"
        options:
          - "Insulin metabolism changes, gluconeogenesis falls, hypoglycemia rises"
          - "The kidney makes more insulin in CKD"
          - "CKD raises gluconeogenesis and causes hyperglycemia only"
          - "Oral drugs stop working when eGFR falls"
        answer: 0
        why:
          - "صح: التلاتة بتوع الكتاب (p143)، وكلهم بيزوّدوا الـ hypoglycemia."
          - "بالعكس: الكلية بتكسّر الـ insulin، مش بتعمله."
          - "الـ gluconeogenesis بيقل مش بيزيد."
          - "مش بيبطلوا يشتغلوا، بس جرعاتهم بتتغيّر."
      - kind: mnemonic
        page: 143
        quote: "include a long-standing duration of diabetes, retinopathy, albuminuria without gross hematuria, and gradually progressive loss of eGFR"
        word: "DRAG"
        parts:
          - { key: "D", text: "Duration: long-standing diabetes" }
          - { key: "R", text: "Retinopathy" }
          - { key: "A", text: "Albuminuria without gross hematuria" }
          - { key: "G", text: "Gradually progressive loss of eGFR" }
        hook: "الـ DKD المعتاد بيـ**DRAG**: بيمشي ببطء. لو حاجة منهم ناقصة أو المشي بقى سريع، افتكر الـ non-DKD."
      - kind: figure
        page: 143
        quote: "Intrarenal arteriosclerosis is the main cause of renal impairment"
        title: "نوعين DKD"
        alt: "Two kidneys side by side. The left, albuminuric DKD, leaks albumin drops into the urine. The right, non-albuminuric DKD, has narrowed thickened arteries inside it and no albumin drops, labelled intrarenal arteriosclerosis."
        caption: "الـ ==non-albuminuric DKD==: الـ eGFR ناقص من غير albuminuria، والسبب الأساسي **intrarenal arteriosclerosis**."
        svg: |
          <svg viewBox="0 0 330 190" xmlns="http://www.w3.org/2000/svg">
            <path d="M60 30 C20 30 15 110 55 125 C80 132 92 110 84 90 C78 75 90 62 92 52 C96 36 80 30 60 30 Z" class="fg-box"/>
            <circle cx="62" cy="150" r="4" class="fg-dot-bad"/>
            <circle cx="74" cy="162" r="4" class="fg-dot-bad"/>
            <circle cx="52" cy="168" r="4" class="fg-dot-bad"/>
            <text x="60" y="20" text-anchor="middle" class="t-sm t-b">Albuminuric</text>
            <text x="100" y="160" class="t-sm t-bad">albumin</text>
            <path d="M230 30 C190 30 185 110 225 125 C250 132 262 110 254 90 C248 75 260 62 262 52 C266 36 250 30 230 30 Z" class="fg-box"/>
            <path d="M200 60 C215 70 225 80 240 78" class="fg-arrow-bad" fill="none" stroke-width="5"/>
            <path d="M205 95 C218 98 228 105 245 100" class="fg-arrow-bad" fill="none" stroke-width="5"/>
            <text x="230" y="20" text-anchor="middle" class="t-sm t-b">Non-albuminuric</text>
            <text x="230" y="150" text-anchor="middle" class="t-sm t-acc">intrarenal</text>
            <text x="230" y="165" text-anchor="middle" class="t-sm t-acc">arteriosclerosis</text>
            <text x="230" y="182" text-anchor="middle" class="t-sm t-mut">↓eGFR, no albuminuria</text>
          </svg>
      - kind: explain
        page: 143
        title: "الـ NADKD: سؤال كتاب"
        quote: "Prevalence of NADKD varies from 14.29 to 56.6% among diabetic patients"
        text: |
          - ==reduced eGFR without albuminuria== بيتشاف كتير في type 1 وtype 2، وممكن من غير retinopathy.
          - الـ prevalence من **14.29 لـ 56.6%** حسب الـ ethnicity.
          - الـ **macroangiopathy** أكتر فيه: age أكبر، hypertension، atherosclerosis، dyslipidemia.
          - السبب الأساسي ==intrarenal arteriosclerosis==.

          علشان كده الـ ACR لوحده مش كفاية: لازم eGFR كمان.
      - kind: explain
        page: 143
        title: "الـ screening"
        quote: "At least once a year, assess urinary albumin (e.g., spot urinary albumin-to-creatinine ratio) and estimated glomerular filtration rate (eGFR)"
        text: |
          ==At least once a year==: **spot urine ACR + eGFR**.

          - **Type 1**: من بعد ==≥5 years== من التشخيص.
          - **Type 2**: كله، من التشخيص.
          - ACR >30 mg/g و/أو eGFR <60؟ تابع **مرتين في السنة**.
      - kind: sort
        page: 144
        quote: "When to consider non-DKD and/or pursue a kidney biopsy"
        prompt: "ده شكل DKD معتاد، ولا clue لـ non-DKD؟"
        bins: ["DKD", "Non-DKD"]
        cards:
          - { text: "Retinopathy present", bin: 0 }
          - { text: "Slow eGFR decline", bin: 0 }
          - { text: "Albuminuria after 15 years of T1D", bin: 0 }
          - { text: "Active urinary sediment", bin: 1 }
          - { text: "Nephritic syndrome", bin: 1 }
          - { text: "eGFR falls >30% after RAASi", bin: 1 }
          - { text: "Albuminuria 2 years after T1D onset", bin: 1 }
          - { text: "Sudden nephrotic syndrome", bin: 1 }
        why: "الـ 10 clues: atypical presentation، no retinopathy (T1D)، albuminuria <5 أو >25 سنة (T1D)، immunological markers أو active sediment، sudden macroalbuminuria/nephrotic، nephritic، hematuria، rapid decline، eGFR ↓>30% بعد RAASi، AKI."
      - kind: figure
        page: 144
        quote: "GFR categories"
        title: "الـ staging: G × A"
        alt: "A grid of six GFR rows (G1 at least 90 down to G5 under 15) and three albuminuria columns (A1 under 30, A2 30 to 299, A3 at least 300 mg per g). Cells shade from green at top left to red at bottom right."
        caption: "الـ CKD بيتصنّف بالـ **Cause + GFR + Albuminuria**. كل ما تنزل وتروح يمين، الخطر يزيد."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <text x="135" y="14" text-anchor="middle" class="t-sm t-b">A1 &lt;30</text>
            <text x="205" y="14" text-anchor="middle" class="t-sm t-b">A2 30–299</text>
            <text x="280" y="14" text-anchor="middle" class="t-sm t-b">A3 ≥300</text>
            <text x="4" y="42" class="t-sm">G1 ≥90</text>
            <text x="4" y="75" class="t-sm">G2 60–89</text>
            <text x="4" y="108" class="t-sm">G3a 45–59</text>
            <text x="4" y="141" class="t-sm">G3b 30–44</text>
            <text x="4" y="174" class="t-sm">G4 15–29</text>
            <text x="4" y="207" class="t-sm">G5 &lt;15</text>
            <rect x="100" y="24" width="70" height="30" class="fg-good"/>
            <rect x="172" y="24" width="70" height="30" class="fg-acc"/>
            <rect x="244" y="24" width="70" height="30" class="fg-bad"/>
            <rect x="100" y="57" width="70" height="30" class="fg-good"/>
            <rect x="172" y="57" width="70" height="30" class="fg-acc"/>
            <rect x="244" y="57" width="70" height="30" class="fg-bad"/>
            <rect x="100" y="90" width="70" height="30" class="fg-acc"/>
            <rect x="172" y="90" width="70" height="30" class="fg-bad"/>
            <rect x="244" y="90" width="70" height="30" class="fg-bad"/>
            <rect x="100" y="123" width="70" height="30" class="fg-bad"/>
            <rect x="172" y="123" width="70" height="30" class="fg-bad"/>
            <rect x="244" y="123" width="70" height="30" class="fg-bad"/>
            <rect x="100" y="156" width="70" height="30" class="fg-bad"/>
            <rect x="172" y="156" width="70" height="30" class="fg-bad"/>
            <rect x="244" y="156" width="70" height="30" class="fg-bad"/>
            <rect x="100" y="189" width="70" height="30" class="fg-bad"/>
            <rect x="172" y="189" width="70" height="30" class="fg-bad"/>
            <rect x="244" y="189" width="70" height="30" class="fg-bad"/>
            <text x="279" y="210" text-anchor="middle" class="t-sm t-b">Refer</text>
            <text x="135" y="43" text-anchor="middle" class="t-sm">low risk</text>
          </svg>
      - kind: check
        page: 144
        quote: "<30 mg/g 30-299 mg/g"
        question: "eGFR 52 and ACR 150 mg/g, both persistent. Stage?"
        options:
          - "G3a A2"
          - "G3b A2"
          - "G2 A3"
          - "G3a A3"
        answer: 0
        why:
          - "صح: 45–59 = G3a، و30–299 = A2."
          - "G3b من 30 لـ 44."
          - "G2 من 60 لـ 89، وA3 من 300."
          - "150 لسه تحت 300."
      - kind: try
        items: [dm.L12.008, dm.L12.010, dm.L12.017, dm.L12.022]
    recap:
      - "CKD = damage أو ↓function ≥3 months. السكر السبب الأول للـ renal failure."
      - "DKD المعتاد = **DRAG**."
      - "NADKD: ↓eGFR من غير albuminuria، 14.29–56.6%، macroangiopathy، intrarenal arteriosclerosis."
      - "Screening سنوي ACR + eGFR: T1D بعد 5 سنين، T2D كله. ACR >30 أو eGFR <60 ← مرتين في السنة."
      - "10 clues للـ non-DKD، والـ staging = C + G1–G5 + A1–A3."
    practice: [dm.L12.001, dm.L12.002, dm.L12.003, dm.L12.004, dm.L12.005, dm.L12.006, dm.L12.007, dm.L12.008, dm.L12.009, dm.L12.010, dm.L12.011, dm.L12.012, dm.L12.013, dm.L12.014, dm.L12.015, dm.L12.016, dm.L12.017, dm.L12.018, dm.L12.019, dm.L12.020, dm.L12.021, dm.L12.022, dm.L12.105, dm.L12.110]
  # ------------------------------------------------------------------
  - id: dm.L12.lesson2
    title: "علاج الـ DKD: أكل وسكر وضغط"
    hook: "أربع خطوط علاج، وقاعدة الـ 30% اللي بتنقذ الـ ACE inhibitor من إنه يتوقف على الفاضي."
    minutes: 6
    pages: [145, 146]
    topics: [dkd-management]
    goals:
      - "تعدّ الـ main lines of treatment"
      - "تعرف أرقام البروتين والصوديوم"
      - "تعرف إمتى ACEi/ARB وإمتى ما توقفوش"
    status: unverified
    steps:
      - kind: explain
        page: 145
        title: "الهدف والخطوط الأربعة"
        quote: "Goal: Cardiorenal Risk Reduction in High-Risk Patients with Type 2 Diabetes"
        text: |
          الهدف: ==Cardiorenal risk reduction== فوق الـ CV risk management الكامل.

          1. **Lifestyle modification**
          2. **Glycemic control**
          3. **BP control**
          4. **Control of dyslipidemia**
      - kind: figure
        page: 145
        quote: "dietary protein intake should be ~0.8 g/kg body weight per day (the recommended daily allowance)"
        title: "طبق عيان الـ DKD"
        alt: "A plate with two labelled parts. Protein about 0.8 gram per kilogram per day, more on dialysis. A salt shaker with sodium under 2300 milligrams per day."
        caption: "بروتين ==~0.8 g/kg/day== (الـ RDA)، وأكتر على الـ dialysis علشان الـ malnutrition. صوديوم **<2,300 mg/day**."
        svg: |
          <svg viewBox="0 0 330 170" xmlns="http://www.w3.org/2000/svg">
            <circle cx="110" cy="85" r="70" class="fg-box"/>
            <circle cx="110" cy="85" r="52" class="fg-thin"/>
            <path d="M110 33 L110 137" class="fg-thin"/>
            <text x="85" y="80" text-anchor="middle" class="t-sm t-b">Protein</text>
            <text x="85" y="96" text-anchor="middle" class="t-sm t-acc">0.8 g/kg</text>
            <text x="137" y="80" text-anchor="middle" class="t-sm">Dialysis</text>
            <text x="137" y="96" text-anchor="middle" class="t-sm t-good">↑ more</text>
            <rect x="240" y="55" width="40" height="70" rx="10" class="fg-box"/>
            <circle cx="252" cy="68" r="2" class="fg-dot-acc"/>
            <circle cx="262" cy="64" r="2" class="fg-dot-acc"/>
            <circle cx="270" cy="70" r="2" class="fg-dot-acc"/>
            <text x="260" y="145" text-anchor="middle" class="t-sm t-b">Na &lt;2,300</text>
            <text x="260" y="160" text-anchor="middle" class="t-sm t-mut">mg/day</text>
          </svg>
      - kind: check
        page: 145
        quote: "consider use of a sodium–glucose cotransporter 2 inhibitor or glucagon-like peptide 1 receptor agonist"
        question: "Type 2 DM with CKD: which drug classes reduce CKD progression and CV events?"
        options:
          - "SGLT2 inhibitors or GLP-1 receptor agonists"
          - "Sulfonylureas or glinides"
          - "DPP-4 inhibitors only"
          - "Thiazolidinediones"
        answer: 0
        why:
          - "صح: الكتاب p145 بيقول consider SGLT2i أو GLP-1 RA."
          - "دول بيزوّدوا الـ hypoglycemia ومالهمش renal benefit."
          - "مش مذكورين كـ renoprotective هنا."
          - "مش في التوصية دي."
      - kind: explain
        page: 146
        title: "الـ ACEi / ARB"
        quote: "It is strongly recommended for individuals with a urinary albumin-to-creatinine ratio of≥300 mg/g creatinine"
        text: |
          عيان سكر + ضغط، مش حامل:

          - ACR **30–299** ← ACEi أو ARB ==recommended==.
          - ACR **≥300** و/أو eGFR **<60** ← ==strongly recommended==.

          وتابع **creatinine + potassium** بانتظام مع ACEi وARB والـ diuretics.
      - kind: aside
        tone: trap
        page: 146
        quote: "Do not discontinue renin-angiotensin system blockade for minor increases in serum creatinine (<30%) in the absence of volume depletion."
        text: "الـ creatinine طلع 15–20% بعد الـ ACEi؟ ده متوقّع (الـ efferent بيرتاح). ==ما توقفش== طول ما الزيادة **<30%** ومفيش **volume depletion**. أما لو الـ eGFR وقع **>30%**، ده من الـ clues للـ non-DKD (p144). والكتاب كرّر البندين دول 3 مرات في الصفحة، فاحفظهم كويس 😄"
      - kind: case
        page: 146
        quote: "Periodically monitor serum creatinine and potassium levels"
        stem: "Type 2 DM, BP 148/92, ACR 340 mg/g, eGFR 58. Started on lisinopril."
        steps:
          - question: "How strong is the indication for lisinopril?"
            options: ["Strongly recommended (ACR ≥300 and eGFR <60)", "Not indicated", "Only if ACR >1000", "Only in type 1"]
            answer: 0
            why: "ACR ≥300 و/أو eGFR <60 ← strongly recommended."
          - question: "Creatinine rises 22%, he is not dry. What now?"
            options: ["Continue and monitor creatinine and K", "Stop lisinopril", "Add an ARB", "Biopsy"]
            answer: 0
            why: "<30% من غير volume depletion ← كمّل."
      - kind: try
        items: [dm.L12.024, dm.L12.025, dm.L12.031, dm.L12.034]
    recap:
      - "الهدف cardiorenal risk reduction. الخطوط: lifestyle، glucose، BP، lipids."
      - "بروتين ~0.8 g/kg/day (أكتر على الـ dialysis)، صوديوم <2,300 mg."
      - "SGLT2i أو GLP-1 RA للـ T2D مع CKD."
      - "ACEi/ARB: ACR 30–299 recommended؛ ≥300 أو eGFR <60 strongly."
      - "Creatinine ↑ <30% من غير dehydration ← ما توقفش الـ RAS blockade."
    practice: [dm.L12.023, dm.L12.024, dm.L12.025, dm.L12.026, dm.L12.027, dm.L12.028, dm.L12.029, dm.L12.030, dm.L12.031, dm.L12.032, dm.L12.033, dm.L12.034, dm.L12.106]
