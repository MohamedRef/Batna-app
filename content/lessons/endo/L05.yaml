          - **Pasireotide (SOM230)**: multi-ligand، affinity أعلى لـ sst1 (30x)، sst3 (5x)، sst5 (40x)؛ في 45 مريض بيتدهوروا على الـ LAR: symptomatic response rate (RR) **27%**.
          - **Interferon alpha**: biochemical response 40%، stabilization 15-40%، ==regression 12%== بس.
          - Toxicity: fatigue، myelosuppression، fever، flu-like، **depression**.

          ليه الـ pasireotide بيشتغل لما الـ octreotide يفشل؟ لأن الـ octreotide بيمسك أساسًا sst2، والـ pasireotide بيمسك **أكتر من receptor** (multi-ligand)، فالورم اللي هرب من الـ sst2 لسه عليه receptors تانية. وكمان بيمنع الـ GH والـ IGF-1. والـ interferon أرقامه متواضعة: يثبّت أكتر ما يصغّر.
