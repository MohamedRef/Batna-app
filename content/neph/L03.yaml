    kind: enumerate
    topic: pathogenesis
    prompt: List the pathways by which AKI causes acute heart dysfunction in CRS-3 (Figure 3).
    points:
      - Electrolyte and coagulation imbalances
      - "Hypertension: decreased GFR, Na and water retention, increased preload"
      - Sympathetic activation
      - RAAS activation, vasoconstriction
      - "Humoral signaling → endothelial activation → cytokine secretion"
    pass: 4
    hook: "الـ AKI بيضرب القلب بـ 5: «أملاح وتجلّط، ضغط ومية، أعصاب، RAAS، وهرمونات» = electrolyte وcoagulation imbalance، hypertension (GFR أقل، Na ومية محبوسين، preload أعلى)، sympathetic activation، RAAS + vasoconstriction، وhumoral signaling → endothelial activation → cytokines."
    src: { page: 70, quote: "Figure 3: Mechanism of damage in CRS-3. CRS, cardiorenal syndrome; GFR, glomerular filtration rate; RAAS, renin-angiotensin-aldosterone system.\nAcute Kidney Injury → Acute Heart Dysfunction\n  Electrolyte & coagulation imbalances\n  Hypertension: Decreased GFR, Na + H2O retention, Increased pre-load\n  Sympathetic Activation\n  RAAS activation, Vasoconstriction\n  Humoral signaling → Endothelial activation → Cytokine secretion" }
    status: unverified
  - id: neph.L03.025
    kind: card
    topic: pathogenesis
    front: In CRS-3 (Figure 3), how does AKI cause hypertension that loads the heart?
    back: Decreased GFR causes sodium and water retention, which increases the preload.
    src: { page: 70, quote: "Figure 3: Mechanism of damage in CRS-3. CRS, cardiorenal syndrome; GFR, glomerular filtration rate; RAAS, renin-angiotensin-aldosterone system.\nAcute Kidney Injury → Acute Heart Dysfunction\n  Electrolyte & coagulation imbalances\n  Hypertension: Decreased GFR, Na + H2O retention, Increased pre-load\n  Sympathetic Activation\n  RAAS activation, Vasoconstriction\n  Humoral signaling → Endothelial activation → Cytokine secretion" }
    status: unverified
