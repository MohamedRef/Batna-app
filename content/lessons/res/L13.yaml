        quote: "Discussion\nConclusion\nGood discussion should be structured to include the following six components:\n3. Strengths and weaknesses in relation to other studies:\nAll evidence bearing on the argument, with or against, should be considered. Authors should discuss the opposing point of view, taking a \"devil's advocate\" position.\nFull credit should be given for supporting evidence."
        title: "3. قصاد الدراسات التانية"
        text: |
          - اعرض كل الأدلة، **مع وضد**، واقعد مكان ==devil's advocate==.
          - اِدّي **full credit** للأدلة اللي بتأيدك.
          - دراسة قبلك وصلت لنفس الإجابة؟ ماتدفنهاش في الـ discussion؛ **مكانها المقدمة**.
          - مش تلخيص أبحاث: ==critically evaluate== الـ methods والنتايج والـ conclusions بتاعتهم.
          - نتايجك مختلفة؟ فسّر؛ ولو مش عارف ليه، **قول مش عارف**، من غير ما تلمّح إن نتايجك أحسن.
      - kind: check
