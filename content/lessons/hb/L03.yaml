          - **(1)**: شريط **electrocardiogram (ECG)** على ورق وردي: إشارة لمشاكل الـ rhythm والـ conduction (زي الـ heart block والـ bradycardia).
          - **(2)**: **chest X-ray** فيه ظل قلب كبير جدًا: قلب متضخم.
          - **(3)**: chest X-ray رئته منفوخة وغامقة: شكل الـ obstructive lung disease (الـ asthma / COPD).

          يعني الصورة بتفكّرك بموانع الـ beta-blockers من القلب والصدر. ومع المريض ده الكتاب بيقول الاختيارات: no treatment، long-acting nitrates، أو ==EBL==.
