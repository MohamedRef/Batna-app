  - id: rheum.L06.lesson7
    title: "T و B: مين بيحارب مين"
    hook: "ليه عيان الـ hypogammaglobulinemia بيجيله pneumococcus بالذات، وعيان الـ AIDS بيجيله TB؟ الإجابة في نوع الـ lymphocyte اللي واقع."
    minutes: 8
    pages: [93, 94]
    topics: [lymphocytes]
    goals:
      - "تعرف الـ T و B cells وإزاي بنميّزهم"
      - "تفرّق humoral من cellular immunity وتعرف ليه كل واحد ضد ميكروبات معيّنة"
      - "تعرف حياة الـ B cell: plasma cell و memory cell"
    status: unverified
    steps:
      - kind: explain
        page: 93
        title: "T و B"
        quote: "T lymphocytes or T cells are thymus derived and express T cell receptor (TCR) on their surface.They are separated from other lymphocytes by use of monoclonal antibodies that recognize CD3, a component of T cell receptor. They majority of circulating lymphocytes are T cells."
        text: |
          - **T cells**: من الـ **thymus**، عليها **T-cell receptor (TCR)**، وبنعرفها بالـ ==CD3==. هي **أغلب** الـ lymphocytes في الدم.
          - **B cells**: من الـ **bone marrow**، بتفرز antibodies، وعليها **surface Ig**. ما بتعدّيش على الـ thymus، بتستقر في الـ spleen والـ lymph nodes.
      - kind: reveal
        page: 93
        quote: "They are separated from other lymphocytes by use of monoclonal antibodies that recognize CD3, a component of T cell receptor."
        prompt: "ليه الـ CD3 بالذات هو اللي بنعرف بيه الـ T cells، مش الـ CD4 أو الـ CD8؟"
        answer: |
          لأن الكتاب بيقول الـ **CD3** هو **component of T cell receptor**، وكل T cell لازم يكون عليها TCR. يعني CD3 = **كل** الـ T cells (100%).

          أما الـ **CD4** فعلى الـ helpers بس، والـ **CD8** على الـ cytotoxic بس، فكل واحد فيهم بيعدّ **جزء** من الـ T cells، زي ما هتشوف في جدول ص 97.
      - kind: table
        page: 93
        quote: "Humoral immunity is most important against bacteria, especially those with a polysaccharide capsule."
        title: "Humoral ولا cellular؟"
        columns: [Feature, Humoral, Cellular]
        rows:
          - ["By", "B cells, antibody", "T cells, cytokines"]
          - ["Against", "Bacteria, encapsulated", "Virus, parasites, fungi, TB"]
          - ["Deficiency", "Hypogammaglobulinemia", "AIDS"]
        hide: [[1, 1], [1, 2], [2, 1], [2, 2]]
      - kind: explain
        page: 93
        title: "ليه الـ antibody بالذات ضد البكتيريا اللي عليها capsule؟"
        quote: "Humoral immunity is most important against bacteria, especially those with a polysaccharide capsule."
        text: |
          الكتاب بيقول الـ **humoral immunity** أهم حاجة ضد البكتيريا، **خصوصًا** اللي عليها ==polysaccharide capsule==. السبب (التفسير المقبول، مش في الكتاب):

          - الـ capsule **ناعمة وزلقة**، فالـ phagocyte ما يعرفش يمسكها لوحده.
          - الـ antibody بيلزق على الـ capsule، والـ phagocyte عنده receptor لرجل الـ antibody (الـ Fc). يعني الـ antibody بيعمل **مقبض** يمسك منه، وده الـ **opsonization**.

          من غير antibody (زي الـ **hypogammaglobulinemia**) الـ **pneumococcus** والـ **Haemophilus influenzae** يلفّوا براحتهم، فيجي **recurrent sinopulmonary infection**: الجيوب والصدر، لأنهم الأماكن اللي البكتيريا دي بتعيش جنبها.
      - kind: case
        page: 93
        quote: "Patients with a severe antibody deficiency (hypogammaglobulinemia) suffer from recurrent sinopulmonary infection, especially with encapsulated organism (e.g pneumococcus, Haemophilus influenza)."
        stem: "24-year-old man: pneumococcal pneumonia twice, recurrent Haemophilus sinusitis. IgG, IgA and IgM very low."
        steps:
          - question: "Which arm is defective?"
            options: ["Humoral", "Cellular", "NK cells"]
            answer: 0
            why: "الـ antibody هو اللي بيعمل **opsonization** للبكتيريا اللي عليها capsule. من غيره ← **recurrent sinopulmonary infection** بالـ encapsulated organisms."
          - question: "Which infections would point to a T-cell defect instead?"
            options: ["Viruses, fungi, parasites, mycobacteria", "Encapsulated bacteria only", "Worms only"]
            answer: 0
            why: "الـ **cellular immunity** هي اللي بتحارب الـ intracellular pathogens، زي عيانين الـ **acquired immunodeficiency syndrome (AIDS)**."
      - kind: explain
        page: 94
        title: "وليه الـ T cells ضد الـ virus والـ TB؟"
        quote: "Cellular immunity is most important against virus, parasites, fungi, mycobacteria. AIDS patient (T cell dysfunction) suffer from infections with these agents."
        text: |
          الـ **cellular immunity** أهم ضد **virus** و **parasites** و **fungi** و **mycobacteria**، وعشان كده عيان الـ ==AIDS== (T cell dysfunction) بيجيله العدوى دي بالذات.

          السبب (التفسير المقبول، مش في الكتاب): أغلب الميكروبات دي بتعيش **جوه الخلايا**. الـ virus جوه الخلية، والـ TB جوه الـ macrophage نفسه. والـ antibody **ما بيدخلش الخلية**، فما يقدرش يوصل لهم.

          فالحل يبقى واحد من اتنين: T cell **تقتل الخلية المصابة** كلها (الـ CTL)، أو T cell تبعت **cytokines** تخلّي الـ macrophage يقتل اللي جواه (الـ TH1 و IFN-γ). وده نفس الكلام اللي هتقراه عن الـ Th1 و Th2 في ص 98.
      - kind: explain
        page: 94
        title: "حياة الـ B cell"
        quote: "When a B cell is exposed to an antigen it differentiates to antibody secreting cell (plasma cell) or memory cell."
        text: |
          - الـ mature B cell عليها **Surface IgM (sIgM) و Surface IgD (sIgD)** كـ receptors، وكل خلية ==specific for one antigen only==.
          - لما تقابل الـ antigen ← تبقى **plasma cell** (تفرز antibody) أو **memory cell**.
          - الـ **full activation** محتاجة **مساعدة الـ T cell**.
          - الـ plasma cells تعمل **clone** يفرز نفس الـ antibody اللي كان على سطح الخلية الأم.
          - الـ **memory cells** مسؤولة عن الـ **secondary immune response**.
      - kind: figure
        page: 94
        quote: "When a B cell is exposed to an antigen it differentiates to antibody secreting cell (plasma cell) or memory cell."
        title: "الـ B cell بعد ما تقابل الـ antigen"
        alt: "A mature B cell with surface IgM and IgD binds its antigen and receives help from a T cell. Two arrows: one to a plasma cell that multiplies into a clone secreting the same antibody; one to a memory cell, labelled secondary immune response."
        caption: "خلية واحدة specific لـ antigen واحد ← **clone** من الـ ==plasma cells== بيفرز نفس الـ antibody، و **memory cells** للمرة الجاية."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L06b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fg-head"/></marker></defs>
