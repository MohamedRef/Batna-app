  - id: hem.L09.lesson3
    title: "علاج الـ ET: السن بيكتب الروشتة"
    hook: "مين يتعالج ومين لأ؟ السن وتاريخ الجلطات بيقرروا، وأول دوا في الشنطة hydroxyurea."
    minutes: 9
    pages: [140, 141]
    topics: [et-treatment]
    goals:
      - "تقسّم الـ ET لـ low و intermediate و high risk وتعرف ليه"
      - "تعرف الـ hydroxycarbamide: بيعمل إيه، أعراضه، وقلق الـ leukaemia"
      - "تعرف الـ anagrelide: إمتى، وأعراضه جاية منين"
    status: unverified
    steps:
      - kind: explain
        remind: [hem.L09.050]
        page: 140
        title: "التقسيم: سن + خطر الأوعية"
        quote: "Based on their age and risk of vascular complications, patients may be stratified into:\n  Low risk\n  Intermediate risk\n  High risk\nHigh-risk patients are those;\n  Over 60 years old\n  With one or more high-risk features:\n    A platelet count ≥1500 × 10⁹/L\n    A prior history of thrombosis\n    Significant thrombotic risk factors such as diabetes or hypertension.\nIn high-risk patients, control of the platelet count with hydroxyurea reduces thrombotic events compared to no cytoreductive therapy."
        text: |
          الـ essential thrombocythaemia (ET) بيتقسم حسب ==age and risk of vascular complications==:
          - **High risk**: فوق **60**، أو أي **high-risk feature**: platelets **≥1500 × 10⁹/L**، أو **prior thrombosis**، أو **significant thrombotic risk factors** زي diabetes mellitus (DM) أو hypertension
          - **Intermediate**: **40–60** من غير high-risk features
          - **Low**: تحت **40** من غير high-risk features

          لاحظ إن القايمة دي هي نفسها **عوامل خطر التجلط** اللي في ص 136 (السن، الجلطة القديمة، الـ CV risk). ده منطقي: إحنا بنقسّم على حسب **احتمال الجلطة الجاية**، لأن الجلطة هي اللي بتموّت في الـ ET.
