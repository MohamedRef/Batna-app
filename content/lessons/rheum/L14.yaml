        text: |
          ==Anti-sclerostin monoclonal antibody== بـ dual action: بناء أكتر وهد أقل.

          - **210 mg SC شهريًا لمدة 12 شهر**.
          - للـ **high-risk postmenopausal osteoporosis**.
          - **Caution**: Cardiovascular (CV) events أكتر في بعض الـ trials، فتجنبه بعد **myocardial infarction (MI) أو stroke** قريب.

          يعني قبل ما تكتبه اسأل عن القلب والمخ. والـ dual action هي السبب إنه للـ high-risk: بيبني ويوقف الهد في نفس الوقت.
