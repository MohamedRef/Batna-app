    - الـ type I هو alpha.
    - ده systematic error مش قرار إحصائي.
    - ده كمان bias مش error إحصائي.
  - kind: explain
    page: 37
    quote: |-
      P-values VERSUS Confidence intervals
      P-value answers the question...
      "Is there a statistically significant difference between the two treatments?"
      The point estimate (effect size) and its confidence interval answers the question...(quantify the effect size)
      "What is the size of that treatment difference?", and
      "How precisely did the trial determine or estimate the treatment difference?"
    title: p-value بيقول «فيه فرق؟»، الـ CI بيقول «قد إيه؟»
    text: |-
      - **P-value**: «فيه فرق ==statistically significant== بين العلاجين؟»
      - **Point estimate + CI**: «الفرق **قد إيه**؟ واتقاس بدقة قد إيه؟»
  - kind: explain
    page: 38
    quote: The PE is a specific value (which maybe a sample mean, sample proportion, mean difference, effect size (relative risk, odds ratio, NNT) but does NOT represent a "true" value, rather, it represents
      the "best estimate" of the true value from the average of the sample and should be viewed in consideration of the range of CI (degree of certainty)
    title: الـ point estimate
    text: |-
      الـ ==PE== هو أحسن تخمين (**best estimate**) للقيمة الحقيقية من متوسط العينة: ممكن يكون mean، proportion، mean difference، أو effect size زي RR وOR وNNT.

      هو **مش** القيمة الحقيقية نفسها، فاقراه دايمًا مع مدى الـ **CI** (degree of certainty).
