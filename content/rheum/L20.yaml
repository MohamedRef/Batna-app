items:
  # ---------- p326: definition and etiology ----------
  - id: rheum.L20.001
    kind: card
    topic: definition
    front: Define psoriatic arthritis.
    back: A chronic immune-mediated inflammatory arthropathy in 5–20% of people with psoriasis, involving axial and peripheral joints, nails, skin and entheses.
    src: { page: 326, quote: "PsA is an inflammatory arthropathy occurring in 5-20% of patients with psoriasis." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L20.002
    kind: cloze
    topic: definition
    text: "Psoriatic arthritis occurs in {{c1::5–20%}} of patients with psoriasis."
    src: { page: 326, quote: "PsA is an inflammatory arthropathy occurring in 5-20% of patients with psoriasis." }
    status: unverified
    tags: [numbers]
  - id: rheum.L20.003
    kind: card
    topic: definition
    front: Is psoriatic arthritis a mild arthritis?
    back: It was once thought mild, but it can be progressive, destructive and deforming.
    src: { page: 326, quote: "there has been a growing appreciation that PsA can be progressive, destructive, and deforming." }
    status: unverified
  - id: rheum.L20.004
    kind: cloze
    topic: definition
    text: "About {{c1::33–50%}} of PsA patients have at least one first-degree relative with psoriasis or PsA."
    src: { page: 326, quote: "Approximately 33 to 50% of PsA patients have at least one first-degree relative who also has PsO or PsA." }
    status: unverified
    tags: [numbers]
  - id: rheum.L20.005
    kind: card
    topic: genetics
    front: Are the genes of PsA and psoriasis the same?
    back: No. Some PsA genes are not psoriasis genes and vice versa, and some genes go with specific PsA phenotypes.
    src: { page: 326, quote: "The genetic associations between PsA and PsO are not identical." }
    status: unverified
  - id: rheum.L20.006
    kind: card
    topic: genetics
    front: What do HLA and non-HLA genes do in PsA?
    back: HLA genes work in antigen presentation and immune recognition; non-HLA genes in immune activation and inflammation (intracellular signaling, cytokine signaling, T-cell effector function).
    src: { page: 326, quote: "Genes associated with PsA include those in the HLA region, which are involved in antigen presentation and immune recognition" }
    status: unverified
  # ---------- p327: genetics tables ----------
  - id: rheum.L20.007
    kind: table
    topic: genetics
    title: HLA genes and PsA expression (p327)
    columns: [Gene, Disease expression]
    rows:
      - [HLA-B*08:01, "Peripheral arthritis, joint damage, ankylosis, asymmetric sacroiliitis"]
      - [HLA-B*27:05, "Axial involvement, symmetric sacroiliitis, enthesitis, dactylitis"]
      - [HLA-B*44:02/03, Milder disease]
      - [HLA-C*06:02, "Milder disease, longer delay of arthritis after psoriasis"]
      - [HLA-DR4, Symmetric polyarthritis]
    blanks: [[0, 1], [1, 1], [3, 1], [4, 1]]
    src: { page: 327, quote: "Axial involvement, symmetric sacroiliitis, enthesitis, dactylitis" }
    status: unverified
  - id: rheum.L20.008
    kind: card
    topic: genetics
    front: Which HLA allele is listed as protective in PsA?
    back: HLA-B*44:02 (its haplotype is linked to milder disease).
    src: { page: 327, quote: "HLA-B*44:02 (protective)" }
    status: unverified
  - id: rheum.L20.009
    kind: table
    topic: genetics
    title: Non-HLA susceptibility genes in PsA (p327)
    columns: [Gene, Product and role]
    rows:
      - [IL23R, "IL-23 receptor; IL-17 pathway"]
      - [TNFAIP3, "TNF-α-induced protein 3; TNF-α-induced inflammation"]
      - [TRAF3IP2, "TRAF3-interacting protein 2; activates NF-κB or Jun kinase"]
      - [REL, "NF-κB subunit"]
      - [FBXL19, "Degrades the IL-1 receptor-like 1"]
      - [PTPN22, "Protein tyrosine phosphatase; immune regulation"]
    blanks: [[0, 1], [1, 1], [2, 1], [5, 1]]
    src: { page: 327, quote: "IL-23 Receptor; involved in the IL-17 pathway" }
    status: unverified
  - id: rheum.L20.010
    kind: mcq
    topic: genetics
    stem: A man with psoriasis develops axial PsA with symmetric sacroiliitis, enthesitis and dactylitis. Which HLA allele does the lecture link to this expression?
    options:
      - HLA-B*27:05
      - HLA-C*06:02
      - HLA-B*44:02
      - HLA-DR4
      - HLA-B*08:01
    answer: 0
    why:
      - "Correct: B*27:05 goes with axial involvement, symmetric sacroiliitis, enthesitis and dactylitis (p327)."
      - C*06:02 goes with milder disease and a longer delay after psoriasis.
      - B*44:02 is protective, milder disease.
      - DR4 goes with symmetric polyarthritis.
      - B*08:01 goes with asymmetric sacroiliitis and joint damage.
    src: { page: 327, quote: "Axial involvement, symmetric sacroiliitis, enthesitis, dactylitis" }
    status: unverified
  # ---------- p327-328: pathogenesis ----------
  - id: rheum.L20.011
    kind: card
    topic: pathogenesis
    front: Which triggers promote PsA in a predisposed person?
    back: Infections, dysbiosis or mechanical stress.
    src: { page: 327, quote: "triggering factors, like infections, dysbiosis or mechanic stress may promote the development of the disease." }
    status: unverified
  - id: rheum.L20.012
    kind: card
    topic: pathogenesis
    front: What follows Toll-like receptor stimulation in PsA?
    back: Activation of innate and adaptive immunity with expansion of dendritic cells, macrophages, CD4+ and CD8+ T cells, neutrophils, monocytes and NK cells, ending in inflammation and damage of skin, joints and entheses.
    src: { page: 327, quote: "Stimulation of Toll-like Receptors will lead to activation of the innate and adaptive immune system" }
    status: unverified
  - id: rheum.L20.013
    kind: card
    topic: pathogenesis
    front: What is the deep (internal) Koebner phenomenon?
    back: A flare of arthritis induced by joint trauma, by analogy with skin trauma inducing psoriatic lesions (Koebner phenomenon).
    src: { page: 328, quote: "joint trauma may induce a flare of arthritis, referred to as the \"internal\" or \"deep\" Koebner phenomenon." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L20.014
    kind: enumerate
    topic: pathogenesis
    prompt: List the environmental factors linked to PsA in the lecture.
    points:
      - Streptococcal infection (guttate psoriasis)
      - Recent antibiotic exposure
      - Joint trauma (deep Koebner)
      - Dysbiosis
      - Tobacco (appears protective, controversial)
    pass: 4
    src: { page: 328, quote: "Epidemiological studies have shown an association between streptococcal infection (guttate psoriasis) and recent antibiotic exposure." }
    status: unverified
  - id: rheum.L20.015
    kind: card
    topic: pathogenesis
    front: What is the effect of tobacco on the development of PsA, per the lecture?
    back: It appears protective (controversial).
    src: { page: 328, quote: "Tobacco appears to be protective against the development of psoriatic arthritis (controversial)." }
    status: unverified
  - id: rheum.L20.016
    kind: card
    topic: pathogenesis
    front: Which cells make IL-23 in PsA, and where may it come from?
    back: Macrophages and dendritic cells; the gut may be a source through a disturbed barrier or changed microbiota.
    src: { page: 328, quote: "Macrophages and dendritic cells produce IL-23. The GIT may be the source of IL-23 due to disturbed barrier function or changes in the microbiota." }
    status: unverified
  - id: rheum.L20.017
    kind: cloze
    topic: pathogenesis
    text: "{{c1::IL-23}} is the central cytokine of PsO and PsA: it stimulates resident T cells to make {{c2::IL-17}}, IL-22 and {{c3::TNF-alpha}}, causing inflammation, erosions and osteoproliferation."
    src: { page: 328, quote: "IL-23, is a central cytokine in the pathogenesis of PsO & PsA." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L20.018
    kind: card
    topic: pathogenesis
    front: How do neutrophils and TNF-α damage bone in PsA?
    back: Neutrophils activate synoviocytes, angiogenesis and osteoclast bone destruction; TNF-α also causes osteoblast apoptosis, reducing bone repair.
    src: { page: 328, quote: "TNF-α can also induce apoptosis of osteoblasts, which also subsequently decreases the capacity to repair bone." }
    status: unverified
  - id: rheum.L20.019
    kind: mcq
    topic: pathogenesis
    stem: Which cytokine does the lecture call central to the pathogenesis of both psoriasis and PsA, acting on resident IL-23R+ T cells?
    options: [IL-23, IL-1, IL-6, Interferon-alpha, IL-4]
    answer: 0
    why:
      - "Correct: IL-23 stimulates resident T cells to make IL-17, IL-22 and TNF-α (p328)."
      - Not named as central in the book's PsA pathway.
      - Not named as central in the book's PsA pathway.
      - Interferon-alpha belongs to the SLE and Sjögren story, not PsA.
      - IL-4 is a Th2 cytokine, not part of the PsA pathway.
    src: { page: 328, quote: "IL-23, is a central cytokine in the pathogenesis of PsO & PsA." }
    status: unverified
  # ---------- p329-330: clinical ----------
  - id: rheum.L20.020
    kind: enumerate
    topic: clinical
    prompt: List the clinical domains of PsA.
    points:
      - Peripheral arthritis
      - Axial involvement
      - Enthesitis
      - Dactylitis
      - Uveitis
      - Cutaneous and nail psoriasis
    pass: 5
    src: { page: 329, quote: "Peripheral arthritis. - Axial involvement. - Enthesitis. - Dactylitis. - Uveitis. - Cutaneous and nail psoriasis." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L20.021
    kind: enumerate
    topic: clinical
    prompt: Which comorbidities are associated with PsA?
    points:
      - Metabolic syndrome
      - Obesity
      - Cardiovascular disease
      - Depressive disorder
    pass: 3
    src: { page: 329, quote: "Metabolic syndrome. - Obesity. - Cardiovascular disease. - Depressive disorder." }
    status: unverified
  - id: rheum.L20.022
    kind: card
    topic: clinical
    front: Is there a marker that predicts which psoriasis patients will develop arthritis?
    back: No clinical, immunohistochemical or genetic marker has been identified.
    src: { page: 329, quote: "no specific marker, either clinical, immunohistochemical, or genetic, has been identified" }
    status: unverified
  - id: rheum.L20.023
    kind: card
    topic: clinical
    front: A patient has classic PsA joints but denies psoriasis. Where must you look for skin lesions?
    back: Scalp, nails, umbilicus, gluteal cleft and behind the ears.
    src: { page: 330, quote: "including the scalp, nails, umbilicus ,gluteal cleft and behind the ear." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L20.024
    kind: table
    topic: clinical
    title: Timing of skin and joint disease in PsA (p330)
    columns: [Sequence, Share]
    rows:
      - [Skin before arthritis (typically by 5–10 years), "Up to 80%"]
      - [Skin and joints together, "10–15%"]
      - [Joints first (may be labelled undifferentiated SpA), "10–15%"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 330, quote: "The skin lesions of psoriasis usually appear before the arthritis in up to 80% and typically by 5-10 years." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L20.025
    kind: card
    topic: clinical
    front: What is the most common skin phenotype in PsA?
    back: Psoriasis vulgaris.
    src: { page: 330, quote: "Psoriasis vulgaris, is the most common skin phenotype in patients with PsA." }
    status: unverified
  - id: rheum.L20.026
    kind: cloze
    topic: clinical
    text: "Skin severity and arthritis severity are {{c1::poorly related}}; in one study only {{c2::35%}} said skin and joints flared together."
    src: { page: 330, quote: "In one prospective study, only 35% of patients reported that their skin and joint components flared at the same time." }
    status: unverified
    tags: [numbers]
  # ---------- p330-332: patterns ----------
  - id: rheum.L20.027
    kind: table
    topic: patterns
    title: Moll and Wright (1973) patterns of PsA (book percentages)
    columns: [Pattern, Share, Clue]
    rows:
      - [Oligoarticular, "70%", "Asymmetric large and small joints; sausage digit"]
      - [Asymmetric DIP ("classic"), "10%", "Nail pitting, transverse depressions, subungual hyperkeratosis"]
      - [Arthritis mutilans, "5%", "Massive destruction of phalanges"]
      - [Symmetric polyarthritis like RA, "15%", "RF usually negative"]
      - [Psoriatic spondylitis, "5%", "Axial disease"]
    blanks: [[0, 1], [1, 1], [1, 2], [2, 1], [3, 1], [3, 2], [4, 1]]
    src: { page: 330, quote: "5 types of arthritis were originally described by Moll and Wright (1973)." }
    status: unverified
    tags: [high-yield, numbers]
  - id: rheum.L20.028
    kind: card
    topic: patterns
    front: Is the Moll and Wright pattern fixed for a patient?
    back: No. Some patients have more than one pattern and many change pattern during follow-up.
    src: { page: 330, quote: "Some patients present with more than one pattern, and many change the pattern of their arthritis during follow-up." }
    status: unverified
  - id: rheum.L20.029
    kind: cloze
    topic: patterns
    text: "Later publications found about {{c1::63%}} polyarticular vs {{c2::13%}} oligoarticular PsA, unlike the original 70% oligoarticular."
    src: { page: 330, quote: "approximately 63% of patients had polyarticular joint involvement, compared with 13% with oligoarticular disease." }
    status: unverified
    tags: [numbers]
  - id: rheum.L20.030
    kind: card
    topic: patterns
    front: Why are DIP joints often involved in PsA but not in RA?
    back: DIP joints have many entheses but very little synovium; PsA is an enthesitis-driven disease, RA a synovitis.
    src: { page: 331, quote: "DIP joints are frequently involved in PsA but not so in RA because these joints have many entheses but very little synovial tissue." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L20.031
    kind: card
    topic: patterns
    front: Which nail changes go with the asymmetric DIP pattern?
    back: Nail pitting, transverse depressions and subungual hyperkeratosis.
    src: { page: 331, quote: "Nail pitting, transverse depressions and subungual hyperkeratosis often occur in association with this pattern." }
    status: unverified
  - id: rheum.L20.032
    kind: card
    topic: patterns
    front: Define arthritis mutilans.
    back: A severe deforming arthritis with massive destruction of the phalanges (5%); rare, but it may develop in more patients if disease is not controlled.
    src: { page: 331, quote: "A severe deforming arthritis in which there is massive destruction of the phalanges." }
    status: unverified
  - id: rheum.L20.033
    kind: cloze
    topic: patterns
    text: "HLA-B27 is present in about {{c1::30%}} of axial PsA; spinal involvement may be found in {{c2::40–70%}} of PsA, depending on whether radiographs are taken."
    src: { page: 332, quote: "HLA-B27 gene is present in about 30% of patients with axial PsA." }
    status: unverified
    tags: [numbers]
  - id: rheum.L20.034
    kind: table
    topic: patterns
    title: Axial PsA by HLA-B27 (p332)
    columns: [Feature, HLA-B27 positive, HLA-B27 negative]
    rows:
      - [Resembles, Ankylosing spondylitis, Different picture]
      - [Age of onset, Earlier, Older]
      - [Back pain, More, Less]
      - [Sex, –, Similar in males and females]
      - [Spine, AS-like X-rays, "More cervical disease; asymmetric unilateral sacroiliitis; bulky non-marginal skipping syndesmophytes"]
    blanks: [[1, 1], [1, 2], [2, 2], [4, 2]]
    src: { page: 332, quote: "asymmetrical, unilateral sacroiliitis and non-marginal, bulky syndesmophytes which are often asymmetric and discontinuous skipping vertebral levels." }
    status: unverified
  - id: rheum.L20.035
    kind: enumerate
    topic: patterns
    prompt: List the most common entheseal sites in PsA.
    points:
      - Achilles
      - Plantar fascia insertions
      - Quadriceps and patellar tendon insertions
      - Iliac crest
      - Rotator cuff
      - Epicondyles at the elbow
    pass: 5
    src: { page: 332, quote: "The Achilles. - Plantar fascia insertions. - Insertions of the quadriceps and patellar tendons. - The iliac crest. - The rotator cuff." }
    status: unverified
  - id: rheum.L20.036
    kind: card
    topic: patterns
    front: Which is more sensitive for enthesitis, palpation or ultrasound?
    back: Ultrasound; entheseal involvement may be asymptomatic.
    src: { page: 332, quote: "Entheseal involvement may be asymptomatic, and US is more sensitive than clinical palpation." }
    status: unverified
  - id: rheum.L20.037
    kind: mcq
    topic: patterns
    stem: A 55-year-old woman with psoriasis, HLA-B27 negative, has neck pain. X-ray shows unilateral sacroiliitis and bulky, non-marginal syndesmophytes that skip vertebral levels. Diagnosis?
    options:
      - HLA-B27-negative axial PsA
      - Ankylosing spondylitis
      - Diffuse idiopathic skeletal hyperostosis
      - Enteropathic spondylitis
      - Rheumatoid cervical disease
    answer: 0
    why:
      - "Correct: B27-negative axial PsA: older onset, cervical disease, asymmetric unilateral sacroiliitis, bulky skipping syndesmophytes (p332)."
      - AS gives symmetric sacroiliitis and marginal, continuous syndesmophytes, like B27-positive PsA.
      - DISH is not discussed and lacks sacroiliitis.
      - Enteropathic spondylitis needs bowel disease.
      - RA does not give sacroiliitis or syndesmophytes.
    src: { page: 332, quote: "Patients who are HLA-B27 negative have different clinical features with similar frequency in males and females, older age of onset, less back pain" }
    status: unverified
  - id: rheum.L20.038
    kind: mcq
    topic: patterns
    stem: A man with psoriasis has swollen DIP joints of several fingers with pitted nails. Which pattern and why are DIPs spared in RA?
    options:
      - Classic asymmetric DIP PsA; DIPs have many entheses and little synovium
      - Arthritis mutilans; DIPs have the most synovium
      - RA-like symmetric polyarthritis; DIPs are always involved in RA
      - Psoriatic spondylitis; DIPs are axial joints
      - Oligoarticular PsA; nails are never involved
    answer: 0
    why:
      - "Correct: the asymmetric DIP pattern (10%) goes with nail pitting; DIPs are entheseal, not synovial (p331)."
      - Mutilans is phalangeal destruction, and DIPs have little synovium.
      - RA spares DIPs.
      - DIPs are peripheral joints.
      - Nail changes go with the DIP pattern.
    src: { page: 331, quote: "DIP joints are frequently involved in PsA but not so in RA because these joints have many entheses but very little synovial tissue." }
    status: unverified
  # ---------- p333: extra-articular and comparison ----------
  - id: rheum.L20.039
    kind: cloze
    topic: extraarticular
    text: "Iritis or uveitis occurs in {{c1::7–18%}} of PsA, more {{c2::bilateral}} than in AS, and usually with spinal involvement."
    src: { page: 333, quote: "Ocular disease: Iritis or uveitis occurs in 7% to 18%, more bilateral than in AS, but is usually found in patients with spinal involvement." }
    status: unverified
    tags: [numbers]
  - id: rheum.L20.040
    kind: enumerate
    topic: extraarticular
    prompt: List the extra-articular manifestations of PsA (less common than in RA).
    points:
      - Iritis or uveitis
      - Aortic insufficiency
      - Metabolic syndrome, cardiovascular risk factors
      - Inflammatory bowel disease
      - Amyloidosis
      - Fatigue and fibromyalgia
    pass: 5
    src: { page: 333, quote: "Aortic insufficiency has also been reported." }
    status: unverified
  - id: rheum.L20.041
    kind: table
    topic: extraarticular
    title: PsA compared with other spondyloarthritides (p333)
    columns: [Feature, PsA, AS, Reactive, Enteropathic]
    rows:
      - [M:F, "1:1", "2:1", "3:1", "2:1"]
      - [HLA-B27, "45–50%", "90–95%", "70%", "30%"]
      - [Peripheral, "95%", "30%", "90%", "30%"]
      - [Axial, "50%", "100%", "15–50%", "30%"]
      - [Dactylitis, "+++", "–", "+", "–"]
      - [Enthesitis, "++", "+++", "+", "–"]
      - [Psoriasis, All, "10%", Rare, Rare]
    blanks: [[0, 1], [1, 1], [1, 2], [2, 1], [4, 1], [5, 2]]
    src: { page: 333, quote: "Comparison with other SpAs" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L20.042
    kind: mcq
    topic: extraarticular
    stem: Which spondyloarthritis in the lecture's table has a 1:1 sex ratio and the most dactylitis (+++)?
    options: [Psoriatic arthritis, Ankylosing spondylitis, Reactive arthritis, Enteropathic SpA]
    answer: 0
    why:
      - "Correct: PsA is 1:1 with dactylitis +++ (p333)."
      - AS is 2:1 with no dactylitis and the most enthesitis.
      - Reactive arthritis is 3:1 with dactylitis +.
      - Enteropathic SpA is 2:1 without dactylitis.
    src: { page: 333, quote: "Dactylitis +++" }
    status: unverified
  # ---------- p333-334: diagnosis ----------
  - id: rheum.L20.043
    kind: card
    topic: diagnosis
    front: What is the simplest working definition of PsA?
    back: Arthritis in the presence of psoriasis and the absence of rheumatoid factor. There is no diagnostic test.
    src: { page: 333, quote: "PsA can be considered as an arthritis occurring in the presence of psoriasis, but in the absence of rheumatoid factor." }
    status: unverified
  - id: rheum.L20.044
    kind: table
    topic: diagnosis
    title: CASPAR criteria (2006)
    columns: [Item, Points]
    rows:
      - [Current psoriasis, "2"]
      - [Past psoriasis, "1"]
      - [Family history (patient not affected), "1"]
      - ["Nail lesions: onycholysis, pitting, hyperkeratosis", "1"]
      - [Dactylitis present or past (rheumatologist), "1"]
      - [Negative RF (any method except latex), "1"]
      - [Juxta-articular new bone (not osteophyte), "1"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [5, 1], [6, 1]]
    src: { page: 334, quote: "Skin psoriasis: present - 2 / previously present -1" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L20.045
    kind: cloze
    topic: diagnosis
    text: "CASPAR needs inflammatory articular disease (joint, spine or enthesis) with {{c1::3 or more}} points; specificity {{c2::98.7%}}, sensitivity {{c3::91.4%}}."
    src: { page: 334, quote: "Inflammatory articular disease (joint,spine or entheseal)with 3 or more points from the following:" }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L20.046
    kind: mcq
    topic: diagnosis
    stem: "A 40-year-old man has inflammatory knee and ankle arthritis. He has no psoriasis now and never had it, but his mother has psoriasis. His nails are pitted and RF is negative (ELISA). CASPAR score?"
    options:
      - "3: classified as PsA"
      - "2: not classified"
      - "4: classified"
      - "Cannot score without skin psoriasis"
      - "1: not classified"
    answer: 0
    why:
      - "Correct: family history 1 + nail lesions 1 + negative RF 1 = 3 (p334)."
      - Nails, family and RF each count.
      - He has no current (2) or past (1) psoriasis.
      - CASPAR can be met without skin psoriasis.
      - Three items each give 1.
    src: { page: 334, quote: "Family history, patient not affected – 1" }
    status: unverified
  - id: rheum.L20.047
    kind: cloze
    topic: diagnosis
    text: "In PsA, low-level RF occurs in {{c1::5–16%}}, ACPA in about {{c2::5%}}, and ANA above 1:80 in {{c3::14%}}."
    src: { page: 334, quote: "low levels of RF may be found in patients (5% to 16%) with typical PsA features." }
    status: unverified
    tags: [numbers]
  - id: rheum.L20.048
    kind: card
    topic: diagnosis
    front: Why does the lecture call PsA "usually seronegative"?
    back: Because low-level RF (5–16%), ACPA (~5%) and low-titre ANA can be positive in typical PsA.
    src: { page: 334, quote: "As a result, the term \"usually seronegative\" arthritis is most suitable for psa." }
    status: unverified
  # ---------- p335: imaging ----------
  - id: rheum.L20.049
    kind: card
    topic: imaging
    front: What radiological combination is characteristic of PsA?
    back: Bone destruction and pathologic new bone formation, often in the same digit or even the same joint.
