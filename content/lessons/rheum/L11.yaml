  - id: rheum.L11.lesson7
    title: "HIV: من الـ markers للـ AIDS والعلاج"
    hook: "رضيع أمه positive والتحليل عنده positive، وراجل اتعرض من أسبوعين والتحليل negative: الاتنين ممكن يكونوا غلط. اعرف كل marker بيبان إمتى."
    minutes: 9
    pages: [193, 195]
    topics: [hiv]
    goals:
      - "تختار الـ marker المناسب حسب الوقت"
      - "تحفظ مراحل المرض وتعرف ليه الـ CD4 بيقع والـ viral load بيعلى"
      - "تعرف دواعي العلاج في الكتاب وإيه اتغير"
    status: unverified
    steps:
      - kind: reveal
        page: 193
        quote: "They can cross the placenta, thus can be detected in babies born to infected mothers & are not markers of active infection, in an uninfected baby they will be lost within 18 months of life. IGg antibody to p24 (anti-p24)"
        prompt: "رضيع أمه HIV positive والـ anti-HIV عنده positive. هل هو مصاب؟"
        answer: |
          مش لازم. الـ ==anti-HIV IgG== بتاع الأم **cross the placenta**، فده مش marker للـ active infection، وفي الطفل السليم بيختفي خلال **18 شهر**. علشان كده بنعتمد على ==nucleic acid-based assays== للفيروس نفسه.
      - kind: explain
        page: 193
        title: "باقي الـ markers"
        quote: "Can be detected early in infection & through the asymptomatic phase.\nAntigen assays: Nucleic acid-based assays for HIV genome, used to aid diagnosis of HIV-infected mothers, or in the situations where serological tests are not adequate."
        text: |
          - **Anti-p24 IgG:** بيبان ==بدري== ويفضل طول الـ asymptomatic phase
          - **Nucleic acid-based assays:** للـ HIV genome. بنستعملها في أطفال الأمهات المصابين، ولما الـ serology ==مش كفاية==
          - **p24 antigen:** بيبان بعد العدوى بشوية، و ==بيختفي بعد 8–10 أسابيع==، فمفيد في اللي اتعدى **قريب**
          - **Isolation of virus in culture**

          ليه الـ p24 antigen بيختفي؟ التفسير المقبول (مش في الكتاب): أول ما الجسم يعمل anti-p24، الـ antibody بيمسك الـ antigen ويخفيه من التحليل، فالـ p24 بيبان في الأول بس قبل ما الـ antibodies تتكون.
