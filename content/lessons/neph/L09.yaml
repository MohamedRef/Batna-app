        text: |
          رقم الـ DOPPS: **UFR أكتر من ==10 mL/kg/h==** = IDH أكتر و **all-cause mortality** أعلى، بس **مش** cardiovascular mortality. ودراسة 2011: أكتر من 10–13 بيزوّد الاتنين.
      - kind: check
