        page: 60
        quote: "If the intraluminal space was the first space, and the extraluminal space denotes the second space, the successful and safe utilisation of the submucosal space utilising the concept of the mucosal flap that can be safely closed with endoscopic clips denotes the successful advancement into third space endoscopy."
        prompt: "يعني إيه **third-space endoscopy**؟"
        answer: |
          - **First space**: جوه الـ lumen (المنظار العادي).
          - **Second space**: برّه الأمعاء (الـ extraluminal).
          - **Third space**: الـ ==submucosa==: تدخلها بـ **mucosal flap** وتقفلها بأمان بالـ **clips**. ده اللي خلّى POEM وأخواتها ممكنين.
      - kind: explain
        page: 61
        quote: "The long myotomy offered by POEM may prove more beneficial for patients with spastic motility disorders of the esophagus, such as type III achalasia or diffuse esophageal spasm."
        title: "ليه الـ POEM للـ spastic disorders؟"
        text: |
          الكتاب: الـ POEM بيدّي ==long myotomy==، وده ممكن يفيد أكتر في الـ **spastic motility disorders** زي **type III achalasia** و **diffuse esophageal spasm**.

          التفسير المقبول (مش في الكتاب): في الأنواع دي التقلص مش في الـ LES بس، ده في جزء طويل من الـ esophagus. الجراحة من برّه (Heller) صعب تطوّل فوق في الصدر، لكن النفق من جوه تقدر تمدّه لفوق قد ما تحتاج.

          والتمن: ==significant risk of GERD==، لأن الـ LES بقى مفتوح، فلازم **counselling** قبل و**surveillance** بعد.
      - kind: explain
        page: 61
        quote: "Gastroparesis may be due to spasm of the pylorus muscle"
        title: "الـ G-POEM: نفس الفكرة على الـ pylorus"
        text: |
          الكتاب:
          - الـ **gastroparesis** ممكن يكون سببه ==spasm of the pylorus muscle==.
          - العلاجات: **endoscopic dilation**، **botulinum toxin**، **pyloric stenting**، **pyloroplasty**، أو **pyloromyotomy**.
          - تقنية الـ submucosal dissection بتاعة الـ POEM اتنقلت للـ **medically refractory gastroparesis**، واسمها **G-POEM** أو **per-oral pyloromyotomy (POP)**، ونتايجها القريبة **promising**.

          الخطوات في الكتاب (Fig. 4): **transverse lesser curve mucosotomy** ← النفق ورؤية الـ pylorus ← الـ pylorus قدامك ← **pyloromyotomy** ← قفل الفتحة.

          التفسير المقبول (مش في الكتاب): زي الـ achalasia بالظبط، بوابة مقفولة زيادة. الـ achalasia بوابة المريء، والـ gastroparesis هنا بوابة المعدة. فبنقطع العضلة الدائرية في الحالتين.

          يعني القاعدة اللي تربط الـ POEM وأخواته: **sphincter مشدود زيادة** ← نفق في الـ submucosa ← نقطع العضلة الدائرية ← نقفل بالـ clips.
      - kind: match
        page: 61
        quote: "The concept of POEM has expanded from achalasia to other GI dysmotility and structural disorders, (medically refractory gastroparesis as well as for Zenker's diverticulum)."
        prompt: "كل POEM ومكانه:"
        pairs:
          - ["POEM", "Achalasia: inner circular LES myotomy"]
          - ["G-POEM (POP)", "Refractory gastroparesis: pyloromyotomy"]
          - ["Z-POEM", "Zenker's: cricopharyngeal myotomy"]
