  - kind: aside
    page: 5
    quote: |-
      Negatives (Persons presumed to be free of disease under study)
      Positives (Persons presumed to have the disease or be at increased risk in future)
    tone: trap
    text: |-
      الـ ==screening مش تشخيص==. الـ positive اسمه في السلايد «**presumed** to have the disease»، والـ negative «**presumed** to be free».

      العلاج بييجي بس بعد الـ **diagnostic procedures** ما تأكد إن المرض أو الـ risk factor موجود فعلًا.
  - kind: sort
    page: 8
    quote: |-
      Criteria for the disease suitable for screening 1968
      Criteria related to the disease
      1. The disease is an important public health problem
      2. Availbility of acceptable treatment for patients
      3. Well known natural history of the disease
      4. Recognizable latent period of the disease(preclinical phase)
      Criteria related to the test
      1. Availability of a suitable test
      2. The test is acceptable
      3. The cost of the screening program is balanced in relation to the total expenditure
      Criteria related to the system
      1. Facilities to diagnose (confirm ) and treat patients
      2. Agreed policy on whom to treat as patients
      3. Case finding is a continous process
    prompt: حط كل معيار من معايير 1968 في مكانه
    bins:
    - The disease
    - The test
    - The system
    cards:
    - text: Important public health problem
      bin: 0
    - text: Recognizable latent (preclinical) period
      bin: 0
    - text: Well-known natural history
      bin: 0
    - text: Acceptable to the population
      bin: 1
    - text: Cost balanced against total expenditure
      bin: 1
    - text: Agreed policy on whom to treat
      bin: 2
    - text: Case finding is a continuous process
      bin: 2
    - text: Facilities to confirm and treat
      bin: 2
    why: 'المرض: مهم، ليه علاج، تاريخه الطبيعي معروف، وليه latent stage. الـ test: موجود، مقبول، وتكلفته معقولة. السيستم:
      facilities، policy مين يتعالج، والـ case finding مستمر.'
  - kind: mnemonic
    page: 7
    quote: |-
      Criteria for the disease suitable for screening 1968
      Box 1. Wilson and Jungner classic screening criteria
      1. The condition sought should be an important health problem.
      2. There should be an accepted treatment for patients with recognized disease.
      3. Facilities for diagnosis and treatment should be available.
      4. There should be a recognizable latent or early symptomatic stage.
      5. There should be a suitable test or examination.
      6. The test should be acceptable to the population.
      7. The natural history of the condition, including development from latent to declared disease, should be adequately understood.
      8. There should be an agreed policy on whom to treat as patients.
      9. The cost of case-finding (including diagnosis and treatment of patients diagnosed) should be economically balanced in relation to possible expenditure on medical care as a whole.
      10. Case-finding should be a continuing process and not a "once and for all" project.
    word: DTS
    parts:
    - key: D
      text: 'Disease (4): important problem، accepted treatment، latent stage، natural history understood.'
    - key: T
      text: 'Test (3): suitable test، acceptable، cost balanced.'
    - key: S
      text: 'System (3): facilities، agreed policy on whom to treat، case-finding continuing.'
    hook: 'الـ 10 بتوع **Wilson and Jungner (1968)** = **4 + 3 + 3**: المرض، الـ test، والسيستم.'
  - kind: explain
    page: 9
    quote: |-
      Examples for screening programs
      Neonatal screening for hypothyrodism
      Screning for hepatitis C
      Screening for breast cancer and cervical cancer
      Screening of diabetic patients for eye problems
      Hearing and visual defects in school children
    title: أمثلة من الواقع
    text: |-
      السلايد بيدي 5 برامج screening:

      - **Neonatal screening for hypothyroidism** (عينة كعب الرجل).
      - **Hepatitis C** (افتكر مبادرة 100 مليون صحة).
      - **Breast cancer** و **cervical cancer**.
      - **Diabetic patients** للـ eye problems.
      - **Hearing and visual defects** في تلاميذ المدارس.
