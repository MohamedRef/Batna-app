            <text x="183" y="227" class="t-sm">steroids, thiazides…</text>
          </svg>
      - kind: reveal
        page: 2
        quote: "leading to absolute insulin deficiency, including LAD A"
        prompt: "الـ LADA بييجي للكبار. ليه الكتاب حاطه تحت type 1 مش type 2؟"
        answer: |
          لأن التقسيم بالـ **mechanism** مش بالسن. الكتاب بيعرّف type 1 بإنه **autoimmune β-cell destruction ← absolute insulin deficiency**، وبيقول صراحة **including LADA**.

          الـ LADA نفس الحرب المناعية، بس بطيئة، فبتبان متأخر. عشان كده في الآخر هيحتاج insulin زي أي type 1، حتى لو بدأ على أقراص.
      - kind: check
        page: 2
        quote: "Predominantly insulin resistance (80%, obese)"
        question: "In the lecture's classification of type 2 diabetes, the obese subgroup is mainly which defect, and how big is it?"
        options:
          - "Insulin resistance, about 80%"
          - "Insulin secretory defect, about 80%"
          - "Insulin resistance, about 20%"
          - "Autoimmune destruction, about 20%"
        answer: 0
        why:
          - "صح: **80%** obese وغالبًا **insulin resistance**، لأن الدهون الزيادة بتعمل resistance."
          - "الـ secretory defect هو الـ 20% الـ non-obese."
          - "النسبة معكوسة."
          - "Type 2 **non-autoimmune** بتعريف الكتاب."
      - kind: mnemonic
        page: 2
        quote: "2-Secondary Diabetes:\n  Pancreatic diseases: Pancreatitis, pancreatectomy, neoplasia, and hemochromatosis.\n  Endocrinopathies: acromegaly, Cushing's syndrome, pheochromocytoma, and hyperthyroidism."
        word: "ACPH"
        parts:
          - { key: "A", text: "Acromegaly: growth hormone ضد الـ insulin" }
          - { key: "C", text: "Cushing's: cortisol يعلّي الـ gluconeogenesis" }
          - { key: "P", text: "Pheochromocytoma: catecholamines تقفل الـ insulin" }
          - { key: "H", text: "Hyperthyroidism: thyroid hormone يسرّع امتصاص السكر وتكسيره" }
        hook: "كل الأربعة **counter-regulatory hormones** زيادة: هرمونات بتعمل عكس الـ insulin. ونفس المنطق في الأدوية: **steroids**، **thyroid hormone**، **β-agonists**، ومعاهم **thiazides**."
      - kind: reveal
        page: 2
        quote: "Pancreatic diseases: Pancreatitis, pancreatectomy, neoplasia, and hemochromatosis."
        prompt: "إيه اللي بيجمع pancreatitis و pancreatectomy و neoplasia و hemochromatosis؟"
        answer: |
          الكتاب حاططهم مع بعض تحت **pancreatic diseases**.

          التفسير المقبول (مش في الكتاب): الـ islets عايشة جوه نسيج البنكرياس نفسه، فأي حاجة **تشيل أو تدمّر** النسيج بتاخدها معاها: الـ pancreatitis المزمنة بتليّفه، والـ pancreatectomy بتشيله، والـ neoplasia بتحتله، والـ **hemochromatosis** بترسّب حديد في الـ β-cells فتموّتها. يعني secondary DM هنا بيقلّد type 1 أكتر: insulin ناقص، مش resistance.
      - kind: explain
        page: 3
        title: "الأدوية: كل واحد بيعاكس الـ insulin بطريقة"
        quote: "Drugs or chemicals induced: corticosteroid, thiazide diuretics, thyroid hormone, β-adrenergic agonists."
        text: |
          الكتاب بيعدّ أربعة: ==corticosteroid==، **thiazide diuretics**، **thyroid hormone**، و **β-adrenergic agonists**.

          التفسير المقبول (مش في الكتاب) لكل واحد:
          - **Corticosteroids:** بيعلّوا الـ gluconeogenesis في الكبد وبيعملوا resistance في العضلات، عشان كده أشهر سبب دوائي.
          - **Thiazides:** بتنزّل الـ potassium، والـ β-cell محتاجة potassium طبيعي عشان تفرز الـ insulin، فالإفراز يقل.
          - **Thyroid hormone:** بيسرّع امتصاص السكر من الأمعاء وبيزوّد إنتاج الكبد.
          - **β-agonists:** نفس شغل الـ adrenaline: بتكسّر الـ glycogen وتطلّع سكر.

          يعني منطق الـ endocrinopathies نفسه: هرمون أو دوا بيعمل **عكس الـ insulin**.
      - kind: sort
        page: 3
        quote: "Drugs or chemicals induced: corticosteroid, thiazide diuretics, thyroid hormone, β-adrenergic agonists."
        prompt: "صنّف أسباب الـ secondary DM:"
        bins: ["Pancreatic", "Endocrine", "Drugs"]
        cards:
          - { text: "Hemochromatosis", bin: 0 }
          - { text: "Pancreatectomy", bin: 0 }
          - { text: "Pheochromocytoma", bin: 1 }
          - { text: "Acromegaly", bin: 1 }
          - { text: "Hyperthyroidism", bin: 1 }
          - { text: "Thiazide diuretics", bin: 2 }
          - { text: "β-adrenergic agonists", bin: 2 }
          - { text: "Corticosteroids", bin: 2 }
        why: "الـ **hemochromatosis** حديد بيترسب في البنكرياس فبيبقى pancreatic. الـ hyperthyroidism مرض endocrine، أما **thyroid hormone** كدوا فهو في الـ drugs."
      - kind: try
        items: [dm.L01.013, dm.L01.016, dm.L01.017, dm.L01.019, dm.L01.119]
    recap:
      - "Primary: type 1 (autoimmune، absolute، ومعاه LADA)، type 2 (80% obese resistant، 20% non-obese secretory)، GDM."
      - "التقسيم بالـ mechanism مش بالسن: LADA تحت type 1."
      - "Secondary pancreatic (النسيج اتشال أو اتدمر، والحديد في hemochromatosis)، endocrine (**ACPH**: anti-insulin hormones)، drugs (steroids، thiazides، thyroid، β-agonists)."
    practice: [dm.L01.013, dm.L01.014, dm.L01.015, dm.L01.016, dm.L01.017, dm.L01.018, dm.L01.019, dm.L01.020, dm.L01.119]
