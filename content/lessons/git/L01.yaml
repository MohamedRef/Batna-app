  - id: git.L01.lesson8
    title: "Kyoto score و Kimura-Takemoto: تقرا الخطر من المنظار"
    hook: "خمس علامات بس، تحسبهم على صوابعك، ويقولولك فيه H. pylori ولا لأ، والسرطان قريب ولا بعيد."
    minutes: 10
    pages: [16, 21]
    topics: [kyoto]
    goals:
      - "تحسب Kyoto score وتفسّره"
      - "ترتّب درجات Kimura-Takemoto وتحوّلها لنقط"
      - "تعرف شكل الـ intestinal metaplasia والـ light blue crest"
    status: unverified
    steps:
      - kind: explain
        remind: [git.L01.061]
        page: 16
        quote: "Diffuse redness with or without RAC, which is related to H. pylori infection status, are accounted for in the Kyoto classification score Table 2 The Kyoto classification score."
        title: "Kyoto: 19 علامة، بس 5 بيتحسبوا"
        text: |
          الـ **Kyoto classification** (2013) فيها **19** endoscopic finding، وهدفها حاجتين: تشخّص **H. pylori** بالمنظار، وتقدّر **gastric cancer risk**.

          الـ score بيتعمل من 5 بس:
          - **Atrophy**، **intestinal metaplasia**، **enlarged folds**، **nodularity**: مرتبطين بالـ ==cancer risk==.
          - **Diffuse redness** (مع أو من غير regular arrangement of collecting venules (RAC)): مرتبطة بـ ==H. pylori status==.
      - kind: table
        page: 16
        quote: "Table 2: The Kyoto classification score.\n| Endoscopic finding | Score | Grade | Finding |\n|---|---|---|---|\n| Mucosal atrophy | 0 | None | C0-CI according to Kimura Takemoto classification |\n| | 1 | Mild | CII-CIII |\n| | 2 | Severe | OI-OIII |\n| Intestinal metaplasia | 0 | None | None |\n| | 1 | Mild | Within the antrum |\n| | 2 | Severe | Up to the corpus |\n| Enlarged folds | 0 | Negative | < 5 mm gastric fold width |\n| | 1 | Positive | ≥ 5 mm gastric fold width |\n| Nodularity | 0 | Negative | None |\n| | 1 | Positive | Small nodules in the antrum |\n| Diffuse redness | 0 | None | None |\n| | 1 | Mild | Mild translucency of collecting venules in the body |\n| | 2 | Severe | Severe translucency of collecting venules in the body |"
        title: "Kyoto score (0-8)"
        columns: ["Finding", "1 point", "2 points"]
        rows:
          - ["Atrophy", "C2-C3", "O1-O3"]
          - ["Intestinal metaplasia", "Antrum", "Up to corpus"]
          - ["Enlarged folds", "Fold width ≥5 mm", "-"]
          - ["Nodularity", "Small antral nodules", "-"]
          - ["Diffuse redness", "Mild (with RAC)", "Severe"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [4, 2]]
      - kind: aside
        tone: exam
        page: 16
        quote: "A score of 0 indicates no Helicobacter pylori (H. pylori) infection, a score of ≥ 2 indicates current H. pylori infection, and a score of ≥ 4 indicates higher risk of gastric cancer risk."
        text: |
          التفسير: **0** = مفيش H. pylori. ==≥2== = **current** H. pylori. ==≥4== = **higher gastric cancer risk**.

          افتكرها بالزوجي: **صفر، اتنين، أربعة**: نضيف، مصاب، خطر.
      - kind: figure
        page: 17
        title: "الخمس علامات في المنظار"
        image: { file: git/L01-kyoto-findings.webp, book: true }
        alt: "Book Figure 1, magnified white light endoscopy: A mucosal atrophy, B intestinal metaplasia, C enlarged tortuous folds, D nodularity, E diffuse redness, F regular arrangement of collecting venules seen as fine regular red dots."
        caption: |
          **A** atrophy، **B** intestinal metaplasia، **C** enlarged folds، **D** nodularity، **E** diffuse redness، **F** regular arrangement of collecting venules (RAC).
      - kind: explain
        page: 17
        quote: "A: Mucosal atrophy; B: Intestinal metaplasia; C: Enlarged folds; D: Nodularity; E: Diffuse redness; F: Regular arrangement of collecting venules."
        title: "إزاي تقرا كل صورة"
        text: |
          التفسير المقبول (مش في الكتاب) لكل علامة شكلها كده ليه:

          - **Atrophy (A)**: الغشاء رق، فالأوعية اللي تحته بقت ==باينة== واللون باهت.
          - **Intestinal metaplasia (B)**: بقع رمادي-بيضا، لأن الخلايا بقت شبه الأمعاء.
          - **Enlarged folds (C)**: الالتهاب الشديد بيورّم الـ folds، فبتبقى عريضة ومتعرجة.
          - **Nodularity (D)**: حبيبات صغيرة في الـ antrum زي «جلد الفرخة»، من lymphoid follicles بتكبر مع العدوى.
          - **Diffuse redness (E)**: التهاب نشط في الـ body.
          - **RAC (F)**: نقط حمرا صغيرة **منتظمة** هي الـ venules العادية، وبتبان لما الغشاء **سليم**.

          يعني الأربعة الأولانيين بيحكوا تاريخ ضرر طويل (cancer risk)، والـ redness بتحكي عن عدوى **دلوقتي**.
      - kind: explain
        page: 18
        quote: "Kimura et al defined a visible capillary network, and yellowish pale in color as atrophic features, while diffuse redness with high mucosal height as characteristics of non-atrophy."
        title: "Atrophy بالعين وبالميكروسكوب"
        text: |
          الـ atrophy نوعين: ==pathological== و **endoscopic**.
          - **Pathological**: **loss of glandular tissue** تحت الميكروسكوب.
          - **Endoscopic** (Kimura-Takemoto، واللي Kyoto اختارته): **visible capillary network** ولون **yellowish pale**. والعكس، **diffuse redness** مع **high mucosal height**، يعني non-atrophy.

          والحلو إن الـ endoscopic atrophy ==correlates well== مع الـ pathological. يعني تقدر تثق في عينك.

          ليه الأوعية بتبان؟ لأن الغدد اللي كانت مغطياها ماتت، فالغشاء بقى رقيق وشفاف.
      - kind: figure
        page: 18
        title: "Kimura-Takemoto في المنظار"
        image: { file: git/L01-kimura-takemoto.webp, book: true }
        alt: "Six endoscopic photos A to F with a dotted atrophic border and a small stomach diagram in each corner showing the atrophic area in blue spreading from the antrum (A) up the lesser curvature (B, C) and over the cardia to the greater curvature (D to F)."
        caption: |
          الخط المنقّط هو حد الـ atrophy. الرسمة الزرقا في الركن بتوريك هو وصل لحد فين.

          - **A-C**: closed type (**C1-C3**)، الـ atrophy لسه على الـ lesser curvature.
          - **D-F**: open type (**O1-O3**)، عدّى الـ cardia ورايح للـ greater curvature.
      - kind: order
        page: 19
        quote: "A: C1 (Atrophy is limited to the antrum);"
        prompt: "رتّب الـ atrophy من الأقل للأوسع:"
        steps:
          - "C1: antrum only"
          - "C2: minor area of lesser curvature"
          - "C3: major area of lesser curvature"
          - "O1: over the cardia to the fundus"
          - "O2: border on the anterior wall"
          - "O3: border toward the greater curvature"
        why: "الـ atrophy بيطلع من الـ antrum على الـ lesser curvature (C)، وبعدين يعدّي الـ cardia ويلف للـ greater curvature (O). وفي Kyoto: C0-C1 = 0، C2-C3 = 1، O1-O3 = 2."
      - kind: explain
        page: 19
        quote: "Non-atrophy (C0) and C1 were scored as Atrophy score 0,"
        title: "من Kimura للنقط"
        text: |
          في الـ Kyoto score:
          - **C0** (non-atrophy) و **C1** ← **0**
          - **C2** و **C3** ← **1**
          - ==O1 to O3== ← **2**

          ليه الـ open type واخد أعلى نقط؟ التفسير المقبول (مش في الكتاب): الـ atrophy بتبدأ من الـ antrum وتطلع على الـ lesser curvature، فكل ما تعدّي الـ cardia وتلف للـ greater curvature، معناها إن المعدة **أغلبها** ضمرت، وده الملعب اللي الـ intestinal type cancer بيطلع فيه.
      - kind: check
        page: 19
        quote: "E: O2 (Atrophic border of the body lies on the anterior wall);"
        question: "The atrophic border of the body lies on the anterior wall. Kimura-Takemoto grade and Kyoto atrophy points?"
        options:
          - "O2, 2 points"
          - "C3, 1 point"
          - "O1, 1 point"
          - "O3, 2 points"
        answer: 0
        why:
          - "صح: الحد على الـ **anterior wall** = **O2**، وكل الـ O بياخدوا **2**."
          - "الـ C3 لسه على الـ lesser curvature وما عدّاش الـ cardia."
          - "الـ O1 الحد بين الـ lesser curvature والـ anterior wall، ونقطه 2 مش 1."
          - "الـ O3 الحد بين الـ anterior wall والـ greater curvature."
      - kind: check
        page: 16
        quote: "A score of 0 indicates no Helicobacter pylori (H. pylori) infection, a score of ≥ 2 indicates current H. pylori infection, and a score of ≥ 4 indicates higher risk of gastric cancer risk."
        question: "Atrophy C3, intestinal metaplasia up to the corpus, enlarged folds 6 mm, no nodularity, no diffuse redness. Kyoto score and meaning?"
        options:
          - "4: higher gastric cancer risk"
          - "3: current H. pylori"
          - "5: higher gastric cancer risk"
          - "2: current H. pylori only"
        answer: 0
        why:
          - "صح: C3 = 1، IM للـ corpus = 2، folds ≥5 mm = 1، الباقي صفر. المجموع 4 ← higher cancer risk."
          - "نسيت نقطة من الـ IM أو الـ folds."
          - "عدّيت الـ atrophy C3 على إنها 2، بس الـ 2 لـ O1-O3."
          - "ده أقل بكتير من المجموع الصح."
      - kind: explain
        page: 20
        quote: "Typically appears grayish-white and slightly elevated plaques surrounded by mixed patchy pink and pale areas of mucosa, forming an irregular uneven surface."
        title: "Intestinal metaplasia شكلها إيه؟"
        text: |
          - **Grayish-white**، slightly elevated plaques، وحواليها mucosa pink و pale متلخبطة، فالسطح **irregular**.
          - علامات مساعدة: **villous appearance**، **whitish mucosa**، **rough surface**.
          - الـ **narrow-band imaging (NBI)** حسّن الرؤية والدقة، والعلامة المشهورة: ==light blue crest== على حافة الـ epithelium في الـ magnified NBI.

          ليه أزرق فاتح؟ التفسير المقبول (مش في الكتاب): خلايا الـ intestinal metaplasia عندها **brush border** زي الأمعاء، والـ NBI بيستعمل ضوء أزرق قصير بينعكس عليه، فتبان الحافة بخط أزرق.
      - kind: aside
        tone: exam
        page: 21
        quote: "Kyoto classification score of ≥ 4 might indicate gastric cancer risk."
        text: |
          آخر الجزء ده في الكتاب (ص 21) بيلخّصه تاني:
          - **0** = مفيش H. pylori.
          - ==≥2== = H. pylori infection.
          - ==≥4== = **might** indicate gastric cancer risk.

          لو اتسألت «Kyoto score 3»، الإجابة: H. pylori موجود، بس لسه ما وصلش لعتبة الـ cancer risk.
      - kind: try
        items: [git.L01.063, git.L01.064, git.L01.070, git.L01.073]
    recap:
      - "Kyoto score من 5: atrophy، IM، folds، nodularity، diffuse redness."
      - "0 نضيف، ≥2 H. pylori، ≥4 cancer risk."
      - "Endoscopic atrophy = أوعية باينة ولون أصفر باهت، وبتتفق مع الـ pathology."
      - "Kimura-Takemoto: C0-C1 = 0، C2-C3 = 1، O1-O3 = 2."
      - "IM: plaques رمادي-بيضا؛ light blue crest على magnified NBI."
