  - id: dm.L04.lesson4
    title: "الدهون والـ aspirin: مين ياخد إيه"
    hook: "نص الـ high risk بياخدوا statin ضعيف وبيفضل الـ LDL عالي. الدرس ده علشان ما تبقاش منهم."
    minutes: 10
    pages: [44, 49]
    topics: [risk-categories, lipids, statin-choice, antiplatelet]
    goals:
      - "تصنّف عيان السكر: very high، high، moderate"
      - "تختار الـ statin intensity والـ LDL goal"
      - "تعرف امتى aspirin وامتى لأ"
    status: unverified
    steps:
      - kind: explain
        page: 44
        title: "الـ ESC: تلات درجات"
        quote: "High CV risk is defined as DM duration ≥ 10 years without target organ damage plus any other additional risk factor."
        text: |
          - **Very high:** established CVD، أو ==target organ damage== (proteinuria، eGFR <30، LVH، retinopathy)، أو **≥3** risk factors، أو type 1 بدري ومدته **>20 سنة**.
          - **High:** سكر **≥10 سنين** من غير organ damage + أي risk factor تاني.
          - **Moderate:** صغيّر (type 1 <35، type 2 <50)، مدة **<10 سنين**، من غير risk factors.
      - kind: update
        page: 44
        quote: "very high CV risk defined as DM with other target organ damage (proteinuria, eGFR < 30 mL/min/1.73 m2, left ventricular hypertrophy, or retinopathy)"
        text: "الـ ESC 2023 بقى يحسب الخطر في type 2 من غير ASCVD أو organ damage شديد بالـ **SCORE2-Diabetes**. في الامتحان: تقسيمة الكتاب."
        ref: "ESC Guidelines for CVD in patients with diabetes 2023"
      - kind: table
        page: 45
        quote: "A calculated SCORE ≥10% for 10-year risk of fatal CVD."
        title: "الـ SCORE (10-year fatal CVD)"
        columns: [Risk, SCORE]
        rows:
          - ["Very high", "≥10%"]
          - ["High", "≥5% and <10%"]
          - ["Moderate", "≥1% and <5%"]
          - ["Low", "<1%"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 46
        title: "الـ statin بالسن والخطر"
        quote: "For people with diabetes aged 40–75 years without ASCVD, use moderate-intensity statin therapy in addition to lifestyle therapy."
        text: |
          - **40–75 من غير ASCVD:** moderate-intensity.
          - **40–75 + risk factor واحد أو أكتر:** ==high-intensity==، LDL ↓ ≥50% و **<70 mg/dL**.
          - **ASCVD (أي سن):** high-intensity، LDL ↓ ≥50% و **<55 mg/dL**.
          - مش وصلت؟ **ezetimibe** أو **PCSK9i**.
          - "**>75:** ممكن تبدأ moderate بعد نقاش؛ لو بياخده كمّل. **الحمل: ممنوع.**"
      - kind: figure
        page: 48
        title: "تختار أنهي statin؟"
        image: { file: dm/L04-statin-choice.webp, book: true }
        caption: "الـ **myalgias** ← hydrophilic (rosuva، prava). الـ **adherence** ← long half-life (atorva، rosuva). ==CYP3A4== ← ابعد عن simva و lova و atorva."
        alt: "Book figure: four rows of arrows. Indication for high-intensity statin leads to atorvastatin 40 to 80 mg or rosuvastatin 20 to 40 mg. Previous myalgias leads to a hydrophilic statin, rosuvastatin or pravastatin. Adherence issues lead to a long half-life statin, atorvastatin or rosuvastatin. CYP3A4 interactions: avoid simvastatin, lovastatin and atorvastatin; use pravastatin or rosuvastatin."
      - kind: match
        page: 48
        quote: "High-Intensity Statin Therapy Daily dose lowers LDL on average by ≥50% Atorvastatin 40-80 mg Rosuvastatin 20-40 mg"
        prompt: "وصّل:"
        pairs:
          - ["Rosuvastatin 20–40 mg", "High intensity (LDL ↓ ≥50%)"]
          - ["Pravastatin 40–80 mg", "Moderate intensity (LDL ↓ 30–49%)"]
          - ["Previous myalgias", "Hydrophilic statin"]
          - ["CYP3A4 interactions", "Avoid simvastatin"]
      - kind: check
        page: 47
        quote: "Addition of ezetimibe or a PCSK9 inhibitor is recommended if this goal is not achieved on maximum tolerated statin therapy."
        question: "Diabetes + prior stroke, on atorvastatin 80. LDL 72 mg/dL. Next?"
        options: ["Add ezetimibe or a PCSK9 inhibitor", "Nothing: LDL <100", "Lower the statin dose", "Add a fibrate"]
        answer: 0
        why:
