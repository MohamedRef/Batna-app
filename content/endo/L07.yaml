    src: { page: 127, quote: "Treatment\n  The goal of treating hypercalcemia is to:\n    Lower hypercalcemia.\n    Treat the underlying cause.\n  Hypercalcemia, less than 12 mg, in asymptomatic patients may not warrant immediate treatment.\n  The initial treatment:\n    0.9% saline to correct dehydration (4-8 l every 24 hours).\n    Furosemide in patients who are at risk of fluid overload (80-120 mg every\n      2- 6 hours).\n    Monitor urine output, serum Mg, serum K, serum Na and CVP.\n  In severe symptomatic hypercalcemia: Calcitonin at a dose of 4 IU/kg subcutaneously or intramuscularly, twice daily, could be used (when available) for the first 48 hours due to their immediate effects, after which tachyphylaxis may develop.\n  Bisphosphonates are the preferred agents for treating hypercalcemia and they work by inhibiting osteoclastic activity.\n    Pamidronate 60 mg to 90 mg intravenously over 2 to 4 hours and\n    Zoledronic acid 4 mg IV over 15 to 30 minutes." }
