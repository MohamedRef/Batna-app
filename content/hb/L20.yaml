items:
  # ---------- malnutrition (p402-404) ----------
  - id: hb.L20.001
    kind: card
    topic: malnutrition
    front: What does the term "malnutrition" cover in this lecture?
    back: Both deficiencies and excesses in nutritional status.
    src: { page: 402, quote: "The term \"malnutrition\" can refer both to deficiencies and to excesses in nutritional status." }
    status: unverified
  - id: hb.L20.002
    kind: card
    topic: malnutrition
    front: Define sarcopenic obesity.
    back: Decreased muscle mass in the setting of increased fat mass.
    src: { page: 402, quote: "refers to the state of decreased muscle mass in the setting of increased fat mass" }
    status: unverified
    tags: [high-yield]
  - id: hb.L20.003
    kind: card
    topic: malnutrition
    front: Why is sarcopenic obesity hard to detect, and why is it increasing?
    back: Fat mass can mask muscle wasting, so it needs dedicated testing. It is rising because of more NASH-related cirrhosis.
    src: { page: 402, quote: "because fat mass can mask underlying muscle wasting, it is mostly due to the increased number of cirrhosis cases related to NASH." }
    status: unverified
  - id: hb.L20.004
    kind: cloze
    topic: malnutrition
    text: Malnutrition is present in about {{c1::20%}} of patients with compensated cirrhosis and in {{c2::more than 50%}} of those with decompensated cirrhosis.
    src: { page: 402, quote: "Malnutrition is a frequent burden in cirrhosis. In 20% of patients with compensated cirrhosis. In >50% of patients with decompensated cirrhosis." }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L20.005
    kind: card
    topic: malnutrition
    front: How does malnutrition track with liver disease?
    back: It progresses as liver failure progresses; it may be less evident in compensated cirrhosis and is easy to recognise in decompensated cirrhosis.
    src: { page: 402, quote: "Progression of malnutrition is associated with progression of liver failure. May be less evident in compensated cirrhosis. Easily recognizable in patients with decompensated cirrhosis." }
    status: unverified
  - id: hb.L20.006
    kind: cloze
    topic: malnutrition
    text: In cirrhosis, women more often lose {{c1::fat deposits}}, while men lose {{c2::muscle tissue}} more rapidly.
    src: { page: 403, quote: "In female patients, depletion of fat deposits is more frequent. In men, loss of muscle tissue is more rapid." }
    status: unverified
    tags: [high-yield]
  - id: hb.L20.007
    kind: card
    topic: malnutrition
    front: What is sarcopenia often used as an equivalent of?
    back: Severe malnutrition.
    src: { page: 403, quote: "Malnutrition and muscle mass loss (sarcopenia), which is often used as an equivalent of severe malnutrition" }
    status: unverified
  - id: hb.L20.008
    kind: enumerate
    topic: malnutrition
    prompt: Mention the complications associated with malnutrition and sarcopenia in cirrhosis.
    points:
      - Susceptibility to infections
      - Hepatic encephalopathy
      - Ascites
      - Lower survival in cirrhosis and after liver transplantation (independent predictors)
    pass: 3
    src: { page: 403, quote: "Susceptibility to infections. Hepatic encephalopathy. Ascites. Independent predictors of lower survival in cirrhosis and in patients undergoing liver transplantation." }
    status: unverified
  - id: hb.L20.009
    kind: card
    topic: malnutrition
    front: How should malnutrition and sarcopenia be regarded in cirrhosis?
    back: As complications of cirrhosis that worsen prognosis.
    src: { page: 403, quote: "Malnutrition and sarcopenia should be recognized as complications of cirrhosis that worsen the prognosis of patients." }
    status: unverified
  - id: hb.L20.010
    kind: card
    topic: malnutrition
    front: The vicious circle in the figure linking decompensated cirrhosis and malnutrition/sarcopenia goes through which three complications to reduced survival?
    back: Hepatic encephalopathy, bacterial infections and recurrent ascites.
    src: { page: 404, quote: "Hepatic encephalopathy Bacterial infections Recurrent ascites" }
    status: unverified
  - id: hb.L20.011
    kind: table
    topic: malnutrition
    title: Impact of malnutrition in special settings
    columns: [Setting, Effect of malnutrition]
    rows:
      - [HCC, Increased complications and reduced survival]
      - [After surgery, Reduced survival]
      - [Liver transplantation, Increased waiting-list mortality and post-operative complications]
    blanks: [[0, 1], [2, 1]]
    src: { page: 404, quote: "In HCC: increased complications and reduced survival. After surgery: reduced survival. In liver transplantation: increased waiting list mortality and post-operative complications." }
    status: unverified
  # ---------- screening and assessment (p404-406) ----------
  - id: hb.L20.012
    kind: card
    topic: screening
    front: Who should get a rapid nutritional screen?
    back: All patients with cirrhosis / advanced chronic liver disease, especially decompensated cirrhosis.
    src: { page: 404, quote: "all patients with advanced chronic liver disease, especially decompensated cirrhosis, should undergo a rapid nutritional screen" }
    status: unverified
  - id: hb.L20.013
    kind: cloze
    topic: screening
    text: "Assume high malnutrition risk if BMI is {{c1::below 18.5 kg/m²}} or the patient is {{c2::Child–Pugh C}}."
    src: { page: 404, quote: "Two criteria stratify patients at high risk of malnutrition: Being underweight (BMI <18.5 kg/m2) Advanced decompensated cirrhosis (Child–Pugh C)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L20.014
    kind: card
    topic: screening
    front: Who should assess patients at risk of malnutrition in detail?
    back: A registered dietician or nutrition expert.
    src: { page: 404, quote: "All patients at risk of malnutrition should undergo detailed nutritional assessment by a registered dietician or nutrition expert." }
    status: unverified
  - id: hb.L20.015
    kind: cloze
    topic: screening
    text: In high-risk patients, repeat the detailed nutritional assessment every {{c1::1–6 months}} as outpatients, and for inpatients {{c2::at admission and periodically during the stay}}.
    src: { page: 405, quote: "assess each component every 1–6 months in the outpatient setting and for inpatients, at admission and periodically throughout the hospital stay" }
    status: unverified
    tags: [numbers]
  - id: hb.L20.016
    kind: enumerate
    topic: screening
    prompt: Enumerate the components of the detailed nutritional assessment in cirrhosis.
    points:
      - "Muscle mass and sarcopenia: CT at L3, anthropometry (MAMC, MAMA, TSF), DEXA, handgrip strength"
      - Subjective global assessment (SGA), including the Royal Free Hospital-global assessment (RFH-GA)
      - Patient-reported dietary intake
    pass: 3
    src: { page: 405, quote: "Sarcopenia indicated by impaired skeletal muscle contractile function; via handgrip strength Subjective global assessment (SGA) uses clinical evaluation data to determine nutritional status" }
    status: unverified
  - id: hb.L20.017
    kind: card
    topic: screening
    front: How is skeletal muscle mass directly quantified, and when?
    back: By CT image analysis at the L3 vertebra, only when a CT is done for other reasons.
    src: { page: 405, quote: "Direct quantification of skeletal muscle mass via CT image analysis at the L3 vertebra (only when CT is available as being performed for other reasons)" }
    status: unverified
    tags: [high-yield]
  - id: hb.L20.018
    kind: card
    topic: screening
    front: Which anthropometric measures are used for body mass assessment?
    back: Mid-arm muscle circumference (MAMC), mid-arm muscular area (MAMA) and triceps skinfold (TSF).
    src: { page: 405, quote: "Including mid-arm muscle circumference (MAMC), mid-arm muscular area (MAMA) and triceps skinfold (TSF)" }
    status: unverified
  - id: hb.L20.019
    kind: card
    topic: screening
    front: What does DEXA measure in nutritional assessment?
    back: Bone mineral density, fat mass and fat-free mass.
    src: { page: 405, quote: "Bone mineral density, fat mass and fat-free mass via DEXA" }
    status: unverified
  - id: hb.L20.020
    kind: card
    topic: screening
    front: How is muscle function (contractile function) assessed in clinic?
    back: Handgrip strength (HGS) and/or the short physical performance battery (SPPB).
    src: { page: 405, quote: "Assess muscle function in the clinical setting with the most appropriate tools, such as handgrip strength (HGS) and/or the short physical performance battery (SPPB)" }
    status: unverified
  - id: hb.L20.021
    kind: card
    topic: screening
    front: What is subjective global assessment (SGA)?
    back: An assessment of nutritional status from clinical evaluation data without objective measurements. It includes the RFH-GA.
    src: { page: 405, quote: "Subjective global assessment (SGA) uses clinical evaluation data to determine nutritional status without objective measurements" }
    status: unverified
  - id: hb.L20.022
    kind: enumerate
    topic: screening
    prompt: What should the dietary intake assessment include?
    points:
      - Quality and quantity of food and supplements
      - Fluids
      - Sodium in the diet
      - Number and timing of meals during the day
      - Barriers to eating
    pass: 4
    src: { page: 405, quote: "quality and quantity of food and supplements, fluids, sodium in diet, number and timing of meals during the day and barriers to eating" }
    status: unverified
  - id: hb.L20.023
    kind: card
    topic: screening
    front: Alternatives to CT for assessing muscle mass that allow serial measurements?
    back: Anthropometry, DEXA or bioimpedance analysis (BIA).
    src: { page: 405, quote: "Anthropometry, DEXA or BIA are possible alternatives, which also allow serial measurements" }
    status: unverified
  - id: hb.L20.024
    kind: cloze
    topic: screening
    text: "To estimate dry weight in fluid retention, subtract {{c1::5%}} for mild, {{c2::10%}} for moderate and {{c3::15%}} for severe ascites."
    extra: Or use post-paracentesis weight, or weight before fluid retention, if available.
    src: { page: 406, quote: "or by subtracting a percentage of weight based upon severity of ascites (mild, 5%; moderate, 10%; severe, 15%)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L20.025
    kind: cloze
    topic: screening
    text: When estimating dry weight, subtract an extra {{c1::5%}} if {{c2::bilateral pedal oedema}} is present.
    src: { page: 406, quote: "with an additional 5% subtracted if bilateral pedal oedema is present." }
    status: unverified
    tags: [numbers]
  - id: hb.L20.026
    kind: table
    topic: screening
    title: Nutritional screening by BMI in cirrhosis (EASL summary)
    columns: [Finding, Risk group, Next step]
    rows:
      - ["BMI <18.5 kg/m² or Child–Pugh C", High risk, "Detailed assessment by dietician (SGA/RFH-GA, intake) and assess sarcopenia (CT at L3; DEXA or BIA if no fluid retention)"]
      - ["BMI 18.5–29.9 kg/m², Child A or B", "Screen with nutritional screening tools", "High, medium or low risk by tool result (high or medium → detailed assessment)"]
      - ["Low risk", Low risk, "Re-screen at least once a year"]
      - ["BMI ≥30 kg/m²", Obesity, "Nutritional assessment and lifestyle intervention (compensated cirrhosis); consider sarcopenia"]
    blanks: [[0, 1], [2, 2], [3, 2]]
    src: { page: 406, quote: "Detailed nutritional assessment (expert dietician) Subjective global assessment (SGA) Royal Free Hospital-global assessment (RFH-GA) Reported dietary intake" }
    status: unverified
  - id: hb.L20.027
    kind: cloze
    topic: screening
    text: "Low-risk patients are re-screened at least {{c1::once a year}}; malnourished or sarcopenic patients get supplementation with reassessment every {{c2::1–3 months}} in the first year."
    src: { page: 406, quote: "Treat: Nutrition supplementation and appropriate follow-up (repeat assessment every 1-3 months in first year)" }
    status: unverified
    tags: [numbers]
  # ---------- requirements (p407) ----------
  - id: hb.L20.028
    kind: card
    topic: requirements
    front: Why is cirrhosis called a state of accelerated starvation?
    back: Rapid post-absorptive physiology with a reduced respiratory quotient. Protein synthesis falls and gluconeogenesis from amino acids rises, needing proteolysis, which drives sarcopenia.
    src: { page: 407, quote: "Cirrhosis is a state of accelerated starvation characterized by a rapid post- absorptive physiology and reduced respiratory quotient" }
    status: unverified
    tags: [high-yield]
  - id: hb.L20.029
    kind: cloze
    topic: requirements
    text: Optimal daily energy intake in cirrhosis should not be lower than {{c1::35 kcal/kg}} actual body weight per day (in {{c2::non-obese}} patients).
    extra: Actual body weight corrected for ascites is considered safe. L01 gives 35–40 kcal/kg/day.
    src: { page: 407, quote: "Optimal daily energy intake should not be lower than the recommended 35 kcal/kg actual BW/day (in non-obese individuals)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L20.030
    kind: cloze
    topic: requirements
    text: Optimal daily protein intake in cirrhosis should not be lower than {{c1::1.2–1.5 g/kg}} actual body weight per day.
    src: { page: 407, quote: "Optimal daily protein intake should not be lower than the recommended 1.2–1.5 g/kg actual body weight/day" }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L20.031
    kind: card
    topic: requirements
    front: Which two meals should be included for malnourished patients with decompensated cirrhosis?
    back: A late evening oral nutritional supplement (ONS) and breakfast.
    src: { page: 407, quote: "Include late evening oral nutritional supplementation (ONS) and breakfast in the dietary regimen of malnourished patients with decompensated cirrhosis" }
    status: unverified
    tags: [high-yield]
  - id: hb.L20.032
    kind: card
    topic: requirements
    front: Who should provide nutritional counselling in malnourished cirrhotics?
    back: A multidisciplinary team, to help the patient reach adequate calorie and protein intake.
    src: { page: 407, quote: "Performance of nutritional counselling in patients with malnutrition and cirrhosis by a multidisciplinary team to help the patient achieve adequate calorie and protein intake" }
    status: unverified
  # ---------- practical advice (p407-408) ----------
  - id: hb.L20.033
    kind: card
    topic: practical-advice
    front: Which food is genuinely contraindicated in chronic liver disease?
    back: Only alcohol. Virtually no other food damages the liver.
    src: { page: 407, quote: "With the exception of alcohol, virtually no food damages the liver and is genuinely contraindicated in patients with chronic liver disease" }
    status: unverified
    tags: [high-yield]
  - id: hb.L20.034
    kind: cloze
    topic: practical-advice
    text: Food intake in cirrhosis is split into {{c1::three main meals}} and {{c2::three snacks}}; the {{c3::late-evening snack}} is the most important.
    src: { page: 407, quote: "Food intake should be split Three main meals: breakfast, lunch and dinner Three snacks: Mid-morning, mid-afternoon, late evening Late-evening snack is the most important" }
    status: unverified
    tags: [high-yield]
  - id: hb.L20.035
    kind: card
    topic: practical-advice
    front: What are the three snacks in the cirrhosis meal plan?
    back: Mid-morning, mid-afternoon and late evening.
    src: { page: 407, quote: "Three snacks: Mid-morning, mid-afternoon, late evening" }
    status: unverified
  - id: hb.L20.036
    kind: card
    topic: practical-advice
    front: Advice on fruit, vegetables and salt in cirrhosis?
    back: Always include fruit and vegetables, as many as possible; restrict salt. Patients should report reduced food intake caused by this advice.
    src: { page: 408, quote: "Fruit and vegetables should always be included in the diet. Salt should be restricted." }
    status: unverified
  - id: hb.L20.037
    kind: card
    topic: practical-advice
    front: Which proteins do patients with hepatic encephalopathy tolerate better?
    back: Vegetable and dairy proteins (animal proteins less well).
    src: { page: 408, quote: "May tolerate animal proteins less well than vegetable and dairy proteins" }
    status: unverified
    tags: [high-yield]
  - id: hb.L20.038
    kind: card
    topic: practical-advice
    front: Is reducing total protein intake advisable in cirrhosis?
    back: No. A reduction in total protein intake is not advisable; patients should consult a doctor or dietician before changing protein intake.
    src: { page: 408, quote: "A reduction in total protein intake is not advisable in cirrhosis" }
    status: unverified
    tags: [high-yield]
  # ---------- sarcopenia (p409-411) ----------
  - id: hb.L20.039
    kind: card
    topic: sarcopenia
    front: Which two processes cause sarcopenia and failure to respond to standard supplementation?
    back: Anabolic resistance and dysregulated proteostasis.
    src: { page: 409, quote: "Anabolic resistance and dysregulated proteostasis result in sarcopenia and/or failure to respond to standard supplementation" }
    status: unverified
  - id: hb.L20.040
    kind: enumerate
    topic: sarcopenia
    prompt: Enumerate the mechanisms of sarcopenia in cirrhosis shown in the figure.
    points:
      - Hyperammonaemia (from portosystemic shunting and hepatocellular dysfunction)
      - Increased myostatin
      - Endotoxin
      - Low testosterone and growth hormone
      - Mitochondrial dysfunction (low ATP, high ROS)
      - Accelerated starvation with low amino acids and intermediates
    pass: 4
    src: { page: 409, quote: "↑Ammonia, Endotoxin, Myostatin, ↓Testosterone, ↓Growth hormone, Mitochondrial dysfunction (↓ATP, ↑ROS), Accelerated starvation (↓Amino acids, ↓Intermediates)" }
    status: unverified
  - id: hb.L20.041
    kind: card
    topic: sarcopenia
    front: What is the largest protein store in the body, and what does it depend on?
    back: Skeletal muscle. It depends on age, gender, ethnicity and the severity and aetiology of liver disease.
    src: { page: 409, quote: "Skeletal muscle mass is the largest protein store in the body. Depends on age, gender, ethnicity, severity/aetiology of liver disease." }
    status: unverified
  - id: hb.L20.042
    kind: card
    topic: sarcopenia
    front: Which type of exercise is recommended for sarcopenia in cirrhosis?
    back: A combination of resistance and endurance exercise.
    src: { page: 409, quote: "Despite potential adverse effects, a combination of resistance and endurance exercise is likely to be appropriate and beneficial." }
    status: unverified
  - id: hb.L20.043
    kind: card
    topic: sarcopenia
    front: What if a malnourished cirrhotic cannot reach adequate intake by mouth, even with oral supplements?
    back: Give a period of enteral nutrition.
    src: { page: 410, quote: "who are unable to achieve adequate dietary intake with the oral diet (even with oral supplements), a period of enteral nutrition is recommended" }
    status: unverified
    tags: [high-yield]
  - id: hb.L20.044
    kind: card
    topic: sarcopenia
    front: When should BCAA or leucine-enriched amino acid supplements be considered?
    back: In decompensated cirrhosis when adequate nitrogen intake is not achieved by the oral diet.
    src: { page: 410, quote: "BCAA supplements and leucine-enriched amino acid supplements should be considered in patients with decompensated cirrhosis when adequate nitrogen intake is not achieved by oral diet" }
    status: unverified
  - id: hb.L20.045
    kind: card
    topic: sarcopenia
    front: Physical activity advice to prevent or improve sarcopenia in cirrhosis?
    back: Avoid hypomobility whenever possible and progressively increase physical activity (a structured exercise programme).
    src: { page: 411, quote: "Avoid hypomobility in patients with cirrhosis whenever possible, and progressively increase physical activity to prevent and/or ameliorate sarcopenia" }
    status: unverified
  - id: hb.L20.046
    kind: table
    topic: sarcopenia
    title: Management approaches to sarcopenia and their targets
    columns: [Approach, Target in the figure, Recommendation]
    rows:
      - [Oral supplements, "Accelerated starvation (calories, protein, amino acids)", "Enteral nutrition if adequate intake not reached orally"]
      - [BCAA and anaplerotic agents, Low amino acids and intermediates, "In decompensated cirrhosis when nitrogen intake is inadequate"]
      - [Structured exercise, Muscle contractile function, "Avoid hypomobility, progressively increase activity"]
    blanks: [[0, 2], [1, 1], [2, 1]]
    src: { page: 410, quote: "BCAA supplements and leucine-enriched amino acid supplements should be considered in patients with decompensated cirrhosis when adequate nitrogen intake is not achieved by oral diet" }
    status: unverified
  # ---------- obesity (p411-412) ----------
  - id: hb.L20.047
    kind: card
    topic: obesity
    front: Does obesity rule out malnutrition in cirrhosis?
    back: No. Malnutrition should be estimated and treated routinely in obese cirrhotics (BMI over 30 without fluid retention).
    src: { page: 411, quote: "Estimate and treat malnutrition routinely in obese patients with cirrhosis (BMI >30 kg/m2 in absence of fluid retention)" }
    status: unverified
    tags: [high-yield]
  - id: hb.L20.048
    kind: card
    topic: obesity
    front: In which cirrhosis is obesity present in most cases?
    back: NASH-related cirrhosis.
    src: { page: 411, quote: "Obesity is present in most cases of NASH-related cirrhosis" }
    status: unverified
  - id: hb.L20.049
    kind: card
    topic: obesity
    front: What must you always consider when diagnosing obesity (BMI >30) in cirrhosis?
    back: The confounding effect of fluid retention. Estimate dry body weight, although accuracy is low.
    src: { page: 411, quote: "In the diagnosis of obesity (BMI >30 kg/m2) always consider the confounding effect of fluid retention. Estimate dry body weight, although accuracy is low" }
    status: unverified
  - id: hb.L20.050
    kind: card
    topic: obesity
    front: How does sedentary lifestyle relate to cirrhosis?
    back: It is highly prevalent, raises obesity risk and may be a cofactor.
    src: { page: 406, quote: "Sedentary lifestyle is highly prevalent in patients with cirrhosis and might be seen as a cofactor" }
    status: unverified
  - id: hb.L20.051
    kind: cloze
    topic: obesity
    text: In obese cirrhotics (BMI >30 corrected for water retention), aim for progressive weight loss of {{c1::≥5–10%}}.
    src: { page: 412, quote: "Implement a nutritional and lifestyle programme to achieve progressive weight loss (≥5–10%) in obese patients with cirrhosis (BMI >30 kg/m2 corrected for water retention)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L20.052
    kind: cloze
    topic: obesity
    text: For obese cirrhotics, use a moderately hypocaloric diet ({{c1::−500 to −800 kcal/day}}) with adequate protein ({{c2::>1.5 g/kg ideal body weight/day}}).
    src: { page: 412, quote: "Adopt a tailored, moderately hypocaloric (-500–800 kcal/day) diet, including an adequate amount of protein (>1.5 g protein/kg ideal BW/day)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L20.053
    kind: card
    topic: obesity
    front: In which obese cirrhotic patients does weight loss improve outcomes, and how is it achieved?
    back: Compensated cirrhosis. Through nutritional therapy plus supervised moderate-intensity exercise tailored to the patient.
    src: { page: 412, quote: "Weight loss can be achieved by nutritional therapy and supervised moderate- intensity physical exercise tailored to the patient's ability" }
    status: unverified
  # ---------- micronutrients (p412-413) ----------
  - id: hb.L20.054
    kind: card
    topic: micronutrients
    front: Why do vitamin deficiencies occur in liver disease?
    back: Hepatic dysfunction and low reserves, with inadequate intake and malabsorption that increase with disease severity.
    src: { page: 412, quote: "Vitamin deficiencies in liver disease are generally related to hepatic dysfunction and diminished reserves Inadequate dietary intake and malabsorption increase with disease severity" }
    status: unverified
  - id: hb.L20.055
    kind: card
    topic: micronutrients
    front: Which two vitamin deficiencies do most transplant candidates have?
    back: Vitamin A and vitamin D.
    src: { page: 412, quote: "A majority of liver disease patients considered for liver transplantation present with vitamin A and D deficiencies" }
    status: unverified
    tags: [high-yield]
  - id: hb.L20.056
    kind: cloze
    topic: micronutrients
    text: Vitamin D levels below {{c1::20 ng/ml}} are reported in chronic cholestasis and correlate inversely with {{c2::disease severity and Child–Pugh score}}.
    src: { page: 412, quote: "Vitamin D levels <20 ng/ml are reported in chronic cholestatic conditions, and often inversely correlate with disease severity and Child–Pugh score" }
    status: unverified
    tags: [numbers]
  - id: hb.L20.057
    kind: cloze
    topic: micronutrients
    text: In cirrhotics with vitamin D below {{c1::20 ng/ml}}, give oral vitamin D to reach serum 25(OH)D above {{c2::30 ng/ml}}.
    src: { page: 412, quote: "Supplement vitamin D orally in patients with cirrhosis and vitamin D levels <20 ng/ml, to reach serum vitamin D (25(OH)D) >30 ng/ml" }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L20.058
    kind: card
    topic: micronutrients
    front: Vitamin D level correlates with treatment response in which conditions?
    back: HCV, NAFLD and patients who develop HCC.
    src: { page: 412, quote: "Vitamin D also correlates with treatment response in HCV, NAFLD and patients who develop HCC" }
    status: unverified
  - id: hb.L20.059
    kind: card
    topic: micronutrients
    front: When is hyponatraemia more likely in cirrhosis?
    back: When sodium intake is low with water intake unchanged or increased. Sodium and water intake need careful monitoring.
    src: { page: 413, quote: "Hyponatraemia is common in patients with cirrhosis, and more likely when sodium intake is low with water unchanged or increased." }
    status: unverified
  - id: hb.L20.060
    kind: cloze
    topic: micronutrients
    text: Recommended sodium intake in cirrhosis with ascites is about {{c1::80 mmol/day}}, equal to {{c2::2 g sodium}} or {{c3::5 g of added salt}} daily.
    extra: Keep the diet palatable, as salt restriction can reduce calorie intake.
    src: { page: 413, quote: "recommended intake of sodium ~80 mmol day = 2 g of sodium corresponding to 5 g of salt added daily to the diet" }
    status: unverified
    tags: [numbers, high-yield]
  # ---------- HE (p413) ----------
  - id: hb.L20.061
    kind: card
    topic: he
    front: Relationship between muscle mass and blood ammonia?
    back: Inverse. HE is more common in malnourished cirrhotics, because muscle helps clear ammonia.
    src: { page: 413, quote: "Inverse relationship between muscle mass and blood ammonia levels" }
    status: unverified
