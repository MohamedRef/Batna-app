        text: |
          الـ LDL-C targets كلها **Class I**: very high أقل من **55** (1.4 mmol/L)، high أقل من **70** (1.8)، moderate أقل من **100** (2.6).

          ليه مش رقم واحد للكل؟ التفسير المقبول (مش في الكتاب): نفس النزول في الـ LDL بيشيل **نسبة** ثابتة تقريبًا من الخطر. لو خطرك 30% وشلت ربعه، كسبت 7.5 من كل 100؛ لو خطرك 5% وشلت ربعه، كسبت 1.25 بس. يعني العيان العالي بيكسب أكتر من كل mg/dL، فيستاهل ==target أوطى==.
      - kind: explain
        page: 275
        title: "العلاج بالترتيب، وكل دوا بيشتغل إزاي"
        quote: "Lipid-lowering treatment\n| Recommendation | Class | Level |\n|---|---|---|\n| Statins are recommended as the first-choice LDL-C-lowering treatment in patients with diabetes and above-target LDL-C levels. Administration of statins is defined based on the CV risk profile of the patients and the recommended LDL-C (or non-HDL-C) target levels. | I | A |\n| If the target LDL-C is not reached with statins, combination therapy with ezetimibe is recommended. | I | B |\n| A PCSK9 inhibitor is recommended in patients at very high CV risk, with persistently high LDL-C levels above target despite treatment with a maximum tolerated statin dose, in combination with ezetimibe, or in patients with statin intolerance. | I | A |"
        text: |
          1. ==Statin== أول اختيار (**I A**)، والجرعة على حسب الخطر والـ target.
          2. الـ target ما اتحققش؟ ضيف **ezetimibe** (**I B**).
          3. Very high risk ولسه فوق الـ target على أعلى statin + ezetimibe، أو مش بيستحمل الـ statin؟ ==proprotein convertase subtilisin/kexin type 9 (PCSK9) inhibitor== (**I A**).

          ليه الترتيب ده بيكمّل بعضه؟ التفسير المقبول (مش في الكتاب): الـ statin بيقلل **تصنيع** الكوليسترول في الكبد؛ الـ ezetimibe بيقفل **امتصاصه** من الأمعاء؛ والـ PCSK9 inhibitor بيمنع **تكسير** الـ LDL receptors فتلف وترجع تشيل LDL تاني. 3 حنفيات مختلفة، فالأثر بيتجمع.
