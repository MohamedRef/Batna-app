        page: 182
        quote: "Bone marrow plasma cells is usually less than 20%\nNo osteolytic lesions\nThe amount of Bence Jones proteinuria is modest ."
        title: "الـ differential"
        columns: ["Mimic", "Clue"]
        rows:
          - ["Amyloidosis", "BM plasma cells < 20%, no lytic lesions, modest Bence Jones"]
          - ["Metastasis", "Lytic lesion, no M component"]
        hide: [[0, 1], [1, 1]]
      - kind: reveal
        page: 182
        quote: "Amyloidosis\n  Bone marrow plasma cells is usually less than 20%\n  No osteolytic lesions\n  The amount of Bence Jones proteinuria is modest ."
        prompt: "الـ amyloidosis فيه light chains برضه. ليه الـ plasma cells أقل وما فيش lytic lesions؟"
        answer: |
          الكتاب: في الـ **primary amyloidosis** الـ BM plasma cells ==usually less than 20%==، **no osteolytic lesions**، والـ Bence Jones **modest**.

          التفسير المقبول (مش في الكتاب): المشكلة هنا مش **حجم** الـ clone، المشكلة في **نوع** الـ light chain: بتتطوي غلط وتترسب في الأنسجة (كلية، قلب، أعصاب). فـ clone صغير يكفي يعمل ضرر كبير، ومش كبير كفاية يشغّل الـ osteoclasts ويخرّم العضم.
