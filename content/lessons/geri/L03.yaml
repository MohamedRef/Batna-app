      - kind: explain
        page: 53
        title: "ليه الـ systematic approach؟"
        quote: "A systematic approach should be considered to determine which medications are necessary for a patient given his/ co-morbidities"
        text: |
          الاختيارات التلاتة التانية كلها **قواعد ثابتة** بتتطبق على أي حد: وقّف الكل، وقّف الجديد، وقّف الدوا التاني. والحاج أحمد مش "أي حد": عنده AF ومحتاج rate control و anticoagulation، فلو وقّفت الكل مرة واحدة ممكن قلبه يسرّع أو يعمل stroke.

          الـ **systematic approach** معناه إنك تمسك كل دوا وتسأل: ليه بياخده؟ لسه محتاجه؟ الجرعة مظبوطة على **eGFR 38**؟ بيعمل side effect؟ وتبدأ بالأخطر: هنا الـ digoxin والـ verapamil والـ metoprolol مع بعض (نبض 52)، والـ diclofenac مع كلية ضعيفة، والـ flurazepam مع الوقعات.
