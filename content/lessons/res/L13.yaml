  - id: res.L13.lesson7
    title: "Vancouver جوه النص: أرقام وشرط وفواصل"
    hook: "(2-5,7,10). الشرطة والفاصلة والمسافة هنا ليها معنى، والامتحان بيحب يلعب فيها."
    minutes: 7
    pages: [71, 77]
    topics: [vancouver]
    goals:
      - "تكتب in-text citation صح"
      - "تجمع كذا رقم بالشرطة والفاصلة"
      - "تعرف مكان الرقم جنب علامات الترقيم"
    status: unverified
    steps:
      - kind: explain
        page: 71
        quote: "\"Vancouver\" referencing Style\nIt is a numbered referencing style commonly used in medicine and science, and consists of:\nIn-text citation\nReference list\nThe reference list should identify references cited (eg. book, journal article, pamphlet, internet site, cassette tape or film) in sufficient detail so that others may locate and consult your references."
        title: "Vancouver = نظام أرقام"
        text: |
          ==Vancouver== نظام **numbered**، منتشر في الطب والعلوم، وفيه حاجتين: **in-text citation** و**reference list**.

          والليستة لازم تعرّف كل مصدر (كتاب، مقالة، pamphlet، موقع، شريط أو فيلم) **بتفاصيل كفاية** إن أي حد يلاقيه.
      - kind: explain
        page: 72
        quote: "\"Vancouver\" In-text citing\nIn the Vancouver Style, citations within \"the text\" of your essay/paper are identified by Arabic numbers in round brackets. (1234567890)\nThis applies to references in text, tables and figures. e.g. (2) – this is the style used by the referencing software Endnote."
        title: "الرقم بين قوسين"
        text: |
          في النص، الـ citation = ==Arabic number== بين **أقواس عادية**: (1)، (2).

          وده في النص والجداول والصور، وهو الـ style اللي برنامج **EndNote** بيستخدمه.
      - kind: explain
        page: 73
        quote: "\"Vancouver\" In-text citing\nThe Vancouver System assigns a number to each reference as it is cited. A number must be used even if the author(s) is named in the sentence/text. Example: Smith (10) has argued that....\nIf the source is referred to again, the same number is used."
        title: "كل مصدر له رقم واحد"
        text: |
          - كل مصدر **بياخد رقم** أول ما يتذكر.
          - الرقم **لازم** حتى لو اسم المؤلف في الجملة: «Smith (10) has argued that...».
          - المصدر لو اتذكر تاني، ==نفس الرقم== يتكرر.
      - kind: explain
        page: 74
        quote: "\"Vancouver\" In-text citing\nWhen multiple references are cited at a given place in the text, use a hyphen \"–\" to join the first and last numbers that are inclusive\neg. (3-5) means 3,4,5 including 4\nUse commas (without spaces) to separate non inclusive numbers in a multiple citation eg. 2,3,4,5,7,10 is abbreviated to (2-5,7,10)\nDo not use a hyphen if there are no citation numbers in between that support your statement eg. 1- 2."
        title: "الشرطة والفاصلة"
        text: |
          - أرقام **متتالية**: **شرطة** بين الأول والآخر: (3-5) = 3 و 4 و 5.
          - أرقام **مش متتالية**: **فاصلة من غير مسافة**: 2,3,4,5,7,10 تتكتب ==(2-5,7,10)==.
          - رقمين مافيش بينهم حاجة (1 و 2)؟ **ماتحطش شرطة**: اكتب (1,2).
      - kind: check
        page: 74
        quote: "\"Vancouver\" In-text citing\nWhen multiple references are cited at a given place in the text, use a hyphen \"–\" to join the first and last numbers that are inclusive\neg. (3-5) means 3,4,5 including 4\nUse commas (without spaces) to separate non inclusive numbers in a multiple citation eg. 2,3,4,5,7,10 is abbreviated to (2-5,7,10)\nDo not use a hyphen if there are no citation numbers in between that support your statement eg. 1- 2."
        question: "References 2, 3, 4, 5, 7 and 10 support one sentence. Write it in Vancouver style:"
        options: ["(2-5,7,10)", "(2, 3, 4, 5, 7, 10)", "(2-10)", "(2-5; 7; 10)"]
        answer: 0
        why:
          - "صح: شرطة للمتتالي وفاصلة من غير مسافة للباقي."
          - "مافيش مسافات، و 2 لـ 5 تتجمع بشرطة."
          - "(2-10) معناها كمان 6 و 8 و 9."
          - "الـ semicolon بتاع Harvard."
      - kind: table
        page: 75
        quote: "\"Vancouver\" In-text citing\nAs a general rule, reference numbers should be placed:\n– after full stops . and commas,\n– before colons: and semicolons; however, this may vary according to the requirements of a particular journal.\nExamples:\nThere have been efforts to replace mouse inoculation testing with invitro tests, such as enzyme linked immunosorbent assays (57,60) or polymerase chain reaction, (20- 22) but these remain experimental. Moir and Jessel maintain \"that the sexes are interchangeable\". (1)"
        title: "الرقم قبل ولا بعد العلامة؟"
        columns: ["Punctuation", "Number goes"]
        rows:
          - ["Full stop (.)", "After"]
          - ["Comma (,)", "After"]
          - ["Colon (:)", "Before"]
          - ["Semicolon (;)", "Before"]
        hide: [[0, 1], [2, 1]]
      - kind: aside
        tone: tip
        page: 75
        quote: "\"Vancouver\" In-text citing\nAs a general rule, reference numbers should be placed:\n– after full stops . and commas,\n– before colons: and semicolons; however, this may vary according to the requirements of a particular journal.\nExamples:\nThere have been efforts to replace mouse inoculation testing with invitro tests, such as enzyme linked immunosorbent assays (57,60) or polymerase chain reaction, (20- 22) but these remain experimental. Moir and Jessel maintain \"that the sexes are interchangeable\". (1)"
        text: "تحفظها إزاي؟ **النقطة والفاصلة** (العلامات الصغيرة اللي بتقفل الكلام) الرقم **بعدهم**؛ **النقطتين والـ semicolon** (اللي بيفتحوا كلام جاي) الرقم **قبلهم**. وده ممكن يختلف حسب الجورنال."
      - kind: explain
        page: 77
        quote: "\"Vancouver\" References \"in the list\"\nReference list should appear at the end of your essay/report with the entries listed numerically and in the same order that they have been cited in the text.\nPunctuation marks and spaces in the reference list and citations are very important.\nPunctuation marks and spaces"
        title: "الليستة في الآخر"
        text: |
          الـ reference list **في آخر** الشغل، ==numerically== وبنفس ترتيب ظهورها في النص (مش أبجدي زي Harvard).

          و**علامات الترقيم والمسافات** في الليستة والـ citations ==very important==.
      - kind: try
        items: [res.L13.068, res.L13.069, res.L13.071]
    recap:
      - "Vancouver = أرقام عربي بين أقواس، في النص والجداول والصور."
      - "رقم حتى لو المؤلف مذكور؛ ونفس الرقم لو المصدر اتكرر."
      - "متتالي بشرطة، الباقي بفاصلة من غير مسافة: (2-5,7,10)؛ و (1,2) مش (1-2)."
      - "الرقم بعد النقطة والفاصلة، وقبل النقطتين والـ semicolon."
      - "الليستة بالأرقام حسب ترتيب الظهور، والترقيم والمسافات مهمين."
    practice: [res.L13.066, res.L13.067, res.L13.068, res.L13.069, res.L13.070, res.L13.071, res.L13.072]
