      - kind: explain
        page: 157
        title: "الـ innate immunity: كل خلية وعيبها"
        quote: "Innate Immunity\n  Monocyte or macrophage: reduced phagocytic capacity and enhanced oxidative stress.\n  Neutrophils: reduced in phagocytic activity, impaired free radical production.\n  Dendritic cells: reduced antigen presentation, impaired phagocytic capability to clean apoptotic cells.\n  Natural killer cells (NK): increase number of NK, reduced cytotoxicity."
        text: |
          - **Monocyte/macrophage:** phagocytosis أقل، و ==oxidative stress أكتر==.
          - **Neutrophils:** phagocytosis أقل، و free radical production ضعيف.
          - **Dendritic cells:** antigen presentation أقل، وما بتنضفش الـ apoptotic cells كويس.
          - **natural killer (NK) cells:** ==العدد بيزيد== بس الـ **cytotoxicity بتقل**.

          ليه كل عيب من دول بيفرق؟ التفسير المقبول (مش في الكتاب):
          - الـ **macrophage** بيبلع الميكروب وينضّف. لما الـ phagocytosis تقل الميكروب بيعيش أطول، ولما الـ oxidative stress يزيد بيأذي النسيج حواليه، فيغذّي الالتهاب المزمن.
          - الـ **neutrophil** أول واحد بيوصل، وسلاحه الـ free radicals. يعني لو السلاح ضعف، الضربة الأولى ضعفت.
          - الـ **dendritic cell** هي الكوبري للـ acquired immunity: بتعرض الـ antigen على الـ T cell. فلو الـ presentation قلت، الـ T cell ما بتعرفش إن فيه عدو، وده جزء من سبب ضعف التطعيم. ولو الـ apoptotic cells ما اتنضفتش، البواقي دي بتفضل تهيّج المناعة.
          - الـ **NK** بتقتل الخلايا المصابة بالفيروس والخلايا السرطانية. العدد بيزيد، بس كل واحدة بتقتل أقل، فالحصيلة ضعيفة.
