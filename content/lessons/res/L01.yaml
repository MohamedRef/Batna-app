  - id: res.L01.lesson3
    title: "من المعمل لسرير العيان للشارع"
    hook: "الـ sofosbuvir بدأ مركّب في معمل وانتهى إن مصر بقت تقريبًا خالية من الـ HCV. الطريق ده اسمه translational research."
    minutes: 9
    pages: [23, 31]
    topics: [contribution, translational]
    goals:
      - "تعرف البحث بيحسّن الصحة إزاي"
      - "تعرّف الـ translational research وتفرق بين T1 وT2 وT3 وT4"
      - "تحط كل phase من الـ clinical trials في مكانها"
    status: unverified
    steps:
      - kind: explain
        page: 23
        quote: "Research is integral to countries’ efforts to: ‒ reduce the disease burden ‒ improve the effectiveness of their health systems"
        title: "البحث بيعمل إيه للبلد؟"
        text: |
          الـ **research** جزء أساسي من مجهود أي بلد علشان:

          - **Reduce the disease burden**.
          - **Improve the effectiveness of health systems**.
          - **Improve the health of populations**.

          وهو الـ ==cornerstone== للـ **evidence-based clinical practice** وللـ **health decision-making**.
