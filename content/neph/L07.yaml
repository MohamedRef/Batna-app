    kind: card
    topic: tsc
    front: What is the PKD1/TSC2 contiguous gene deletion syndrome?
    back: A large deletion of both PKD1 and TSC2 (adjacent on chromosome 16) causing infantile severe polycystic kidney disease with tuberous sclerosis (PKDTS).
    src: { page: 169, quote: "TSC results from inactivating mutations in one of two genes, TSC1 on chromosome 9q32-q34 and TSC2 on chromosome 16p13, adjacent to the PKD1 gene. Large deletions involving both PKD1 and TSC2 results in the PKD1/TSC2 (infantile severe polycystic kidney disease with tuber-ous sclerosis [PKDTS]) contiguous gene deletion syndrome. as tumor suppressor genes." }
    status: unverified
