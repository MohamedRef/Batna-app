        why: "68 مفصل للـ tender و66 للـ swollen (الـ hips مش بتتعد swollen). الـ Bath Ankylosing Spondylitis Disease Activity Index (BASDAI) نفسه بتاع الـ AS. الـ Routine Assessment of Patient Index Data 3 (RAPID3) الأسهل في العيادة."
      - kind: explain
        page: 337
        title: "DAPSA"
        quote: "It calculates the following components:\n  Tender joint count (0-68).\n  Swollen joint count (0-66).\n  Crp level (mg/dl).\n  Patient vas for pain (0-10)."
        text: |
          مجموع خمس حاجات:
          - **Tender joints** (0–68)
          - **Swollen joints** (0–66)
          - **CRP** (mg/dl)
          - **Pain visual analogue scale (VAS)** (0–10)
          - **Patient global VAS** (0–10)

          القراءة: ==0–4 remission==، **5–14 low**، **15–28 moderate**، **> 28 high**.

          ليه الـ DAPSA؟ لأنه بيجمع المفاصل والـ CRP ورأي العيان في رقم واحد، فتقدر تقارن الزيارة بالزيارة وتعرف وصلت للهدف ولا لأ.
