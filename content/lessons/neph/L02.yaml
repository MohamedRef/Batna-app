          - { text: "Tophaceous gout", bin: 0 }
          - { text: "Asymptomatic urate 8.5, no gout", bin: 1 }
          - { text: "Asymptomatic urate 10, wish to slow CKD", bin: 1 }
      - kind: explain
        page: 56
        quote: "Acute gout flare in a patient with CKD\n  Classical or atypical presentation?\n    Classical: Clinical diagnosis\n      Acute treatment\n        Colchicine (1.2 mg orally followed by 0.6 mg 1 h later; if subsequent dosing required, adjust per kidney function)\n        or Prednisone 30 mg with taper (10–14 d)\n        or Intra-articular steroids (only if few joints involved)\n        or Consider anakinra or canakinumab (if above treatment fails)\n    Atypical\n      Diagnostic testing\n        Aspirate joint to look for urate crystals and to rule out infection or other causes such as pseudogout from calcium pyrophosphate crystals\n        Consider DECT imaging if available\n      Gout is diagnosed: Acute treatment"
        title: "النقرس في الـ CKD"
        text: |
          **الحاد**: ==colchicine== 1.2 mg وبعده 0.6 mg بعد ساعة، أو **prednisone 30 mg** مع taper على 10–14 يوم، أو intra-articular لو مفاصل قليلة. لو فشل: anakinra أو canakinumab. **مش non-steroidal anti-inflammatory drugs (NSAIDs)**.

          **المزمن**: ==xanthine oxidase inhibitor== أحسن من الـ uricosurics.

          - **Allopurinol**: ابدأ **50 mg** وزوّد بالراحة لحد 800 mg
          - قبله اعمل **HLA-B*5801 testing** للآسيويين والأفارقة
          - **Febuxostat**: 20–40 لحد 120
          - الهدف: ==serum urate (SU) < 6 mg/dL==
          - فشل؟ **pegloticase + methotrexate** لو الـ estimated glomerular filtration rate (eGFR) فوق 40
          - أو **pegloticase + mycophenolate** لو الـ eGFR تحت 40
      - kind: aside
        page: 57
        quote: "GOUT DIETARY AND LIFESTYLE GUIDELINES\nAdvice for people with gout generally consists of the following, but consult your doctor for individual guidance:\n| | Avoid | Limit | Enjoy |\n| Protein Foods | Organ and glandular meats high in purines, such as liver, kidney, heart and sweetbreads (glands) | No more than 4–6 ounces daily: Red meat (beef, pork, lamb); Fish high in purines, such as anchovies, sardines, herring, scallops and shellfish; Poultry | Plant proteins: vegetables, tofu/legumes, nuts/nut butters, whole grains; Yogurt and other low-fat dairy foods; Eggs |\n| Drinks | Beverages sweetened with high fructose corn syrup (or sugar); All alcohol during a flare-up | Fruit juice; Alcohol (especially beer and hard liquor/spirits), per doctor's advice | Low-fat or nonfat milk; Water (at least 8–16 cups daily during a flare-up); Unsweetened tea and coffee (if already habitual) |\n| Other | Smoking; Excess body weight; Crash diet/high protein diet | Table sugar, honey and other sweeteners; sugary desserts; Salt* | Whole fruit (unsweetened); Regular exercise |\n*Some evidence shows very-low-sodium intake (1,500 milligrams per day or less) is associated with increased uric acid levels."
        tone: joke
        text: "الكبدة والكلاوي والممبار والبيرة والعصير المحلّى… قايمة عزومة العيد هي نفسها قايمة **ممنوعات النقرس**. 😅 والمسموح: خضار، بقوليات، ألبان قليلة الدسم، مية كتير."
      - kind: explain
        page: 58
        quote: "Recommend oral low-dose aspirin for prevention of recurrent ischemic cardiovascular disease events (i.e., secondary prevention) in CKD and established ischemic cardiovascular disease (1C)."
        title: "القلب والدهون"
        text: |
          - احسب **10-year cardiovascular (CV) risk** بأداة validated
          - **Mediterranean-style** diet مع العلاج
          - ==Aspirin== low-dose للـ **secondary prevention** بس (1C)
          - **low-density lipoprotein (LDL)**: ==< 1.8 mmol/L (70 mg/dL)== في الـ high risk، وأقل من **1.4 mmol/L (55 mg/dL)** في الـ very high risk
          - Statin: كل chronic kidney disease (CKD) + diabetes من 18 سنة، وكل CKD فوق 50
