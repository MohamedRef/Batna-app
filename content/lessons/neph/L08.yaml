      - kind: explain
        page: 246
        title: "ليه نقسم الـ TMA كده؟"
        quote: "Types of TMA Primary TMA Secondary TMA Hereditary TTP. Idiopathic TTP."
        text: |
          الـ **types of TMA**:
          - **Primary**: **hereditary TTP** و **idiopathic TTP**؛ و **hereditary (atypical) HUS** و **sporadic (Shiga toxin-associated)**.
          - **Secondary immune-mediated**: pregnancy، autoimmune، infections، و ==clopidogrel و ticlopidine==.
          - **Secondary non-immune**: ==malignant hypertension==، solid organ transplantation، **HCT**، metastatic tumours، و cyclosporine و tacrolimus و IFN-α و mitomycin C.
          - والـ algorithm: ==ADAMTS-13 < 10%== مع fever و neuro = **TTP**؛ أكتر من 10% = **HUS**، typical لو diarrhea (Shiga toxin) و atypical لو مفيش.

          ليه الـ ADAMTS-13 بيفرّق؟ التفسير المقبول (مش في الكتاب): الـ ADAMTS-13 إنزيم بيقص الـ **von Willebrand factor** الطويل. لو غايب (وراثي أو antibody ضده)، الـ vWF الطويل بيلم الصفايح في كل الجسم، فالمخ بيتأثر (TTP). في الـ **HUS** الإنزيم سليم، والمشكلة إن الـ **endothelium** نفسه اتأذى: من الـ Shiga toxin، أو من **complement** مالوش فرامل (atypical)، أو من دوا أو ضغط عالي. وده بيفسّر ليه الـ clopidogrel immune (بيعمل antibody ضد الإنزيم)، والـ cyclosporine non-immune (بيأذي الـ endothelium مباشرة).
      - kind: check
        page: 246
        quote: "Types of TMA\n| Primary TMA | Secondary TMA |\n| Hereditary TTP.; Idiopathic TTP. | Immune-mediated: Pregnancy.; Autoimmune disorders.; Infections.; Medications (Clopidogrel, Ticlopidine). |\n| Hereditary (atypical) HUS.; Sporadic (Shigatoxin-associated). | Non-immune mediated: Malignant hypertension.; Solid organ transplantation.; HCT.; Metastatic tumours.; Medications (Cyclosporine, Tacrolimus, IFN-α, Mitomycin C). |"
        question: "Which drug causes immune-mediated secondary TMA in the book's table?"
        options:
          - "Clopidogrel"
          - "Cyclosporine"
          - "Mitomycin C"
          - "Tacrolimus"
        answer: 0
