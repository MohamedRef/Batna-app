  - id: hb.L07.lesson4
    title: "مراحل الـ chronic HBV: هدنة وخناقة"
    hook: "أربع مراحل بأسامي جديدة وقديمة؟ هتحتاج سؤالين بس: الـ HBeAg موجب؟ والكبد بيتأذي؟"
    minutes: 9
    pages: [116, 117]
    topics: [phases]
    goals:
      - "تسمّي الـ 4 phases بالأسامي الجديدة والقديمة"
      - "تعرف DNA و ALT في كل مرحلة من غير حفظ جدول أعمى"
      - "تحط أي عيان في مرحلته من نتايجه"
    status: unverified
    steps:
      - kind: explain
        page: 116
        quote: "others may experience fatigue or right upper quadrant discomfort. Physical examination may be normal or there may be mild hepatomegaly."
        title: "الـ CHB بيبان إزاي؟"
        text: |
          - **Symptoms**: many patients have no symptoms، وناس تانية عندها fatigue أو right upper quadrant discomfort.
          - **Examination**: ممكن يبقى normal، أو فيه **mild hepatomegaly**.
          - **Late disease**: تشوف **manifestations of cirrhosis** لو المرض اتقدم.

          يعني مش هتعرف المرحلة من الكشف. هتعرفها من المعمل.
      - kind: explain
        page: 117
        quote: "Chronic infection: ALT Normal, Liver disease None/minimal; Chronic hepatitis: ALT Elevated, Liver disease Moderate/severe"
        title: "سؤالين يحلّوا الجدول كله"
        text: |
          الأسامي الجديدة مبنية على سؤالين.

          السؤال الأول: الـ **HBeAg** موجب ولا سالب؟

          السؤال التاني: الكبد سليم ولا ملتهب؟

          - ==Chronic infection==: الكبد سليم. ALT normal، والـ liver disease none أو minimal.
          - ==Chronic hepatitis==: فيه التهاب. ALT elevated، والـ liver disease moderate أو severe.

          اضرب الاتنين في بعض يطلعوا 4 مراحل:

          - HBeAg+ chronic infection.
          - HBeAg+ chronic hepatitis.
          - HBeAg− chronic infection.
          - HBeAg− chronic hepatitis.

          وفي الآخر ممكن يحصل **HBsAg loss**.
      - kind: aside
        tone: analogy
        page: 117
        quote: "ALT: Normal, Elevated, Normal, Elevated; Liver disease: None/minimal, Moderate/severe, None, Moderate/severe"
        text: |
          - **Infection** = الفيروس ساكن في البيت والمناعة عاملة هدنة معاه: مفيش خناق، فالـ ALT طبيعي.
          - **Hepatitis** = خناقة: المناعة بتضرب الخلايا المصابة، فالـ ALT يطلع وينزل والـ DNA يتذبذب، والكبد هو اللي بيدفع التمن (fibrosis).
      - kind: figure
        page: 117
        quote: "HBV DNA; ALT; HBeAg+ chronic infection; HBeAg+ chronic hepatitis; HBeAg- chronic infection; HBeAg- chronic hepatitis; HBsAg loss"
