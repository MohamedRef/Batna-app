      - kind: explain
        page: 124
        title: "الـ flare وعلاج الـ reactivation"
        text: |
          - **Clinical hepatitis flare** = **ALT ≥ 3 × baseline** و **> 100 U/L**.
          - الـ immunosuppressed اللي عمل reactivation ياخد **antiviral treatment as early as possible regardless of ALT levels**.
          - ليه الاستعجال؟ **Severe hepatitis and hepatic failure** بيحصلوا في **25–50%** من الـ HBV reactivation.
      - kind: aside
        tone: trap
        page: 124
        text: |
          الـ ALT طبيعي **≠** استنى. في الـ reactivation الكتاب بيقول **regardless of ALT levels**. لو استنيت الـ flare تكون اتأخرت.
      - kind: explain
        page: 124
        title: "وخزة إبرة (post-exposure prophylaxis)"
        text: |
          - **Vaccinated**: **anti-HBs > 10 mIU/mL** → no treatment. **< 10** → **HBIG + booster dose**.
          - **Not vaccinated**: اعمل **HBsAg، anti-HBc، anti-HBs**. **anti-HBs > 10** → no treatment. **< 10** → **HBIG + vaccinate**.
          - التوقيت: الـ **vaccine** في أسرع وقت و **not later than 7 days**، و الـ **HBIG** **within 72 hours**.
          - المتابعة: **HBsAg، anti-HBc IgM** عند **6، 12، و 24 weeks**.
      - kind: mnemonic
        page: 124
        word: "10772"
        parts:
