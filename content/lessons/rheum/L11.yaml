      - kind: check
        page: 185
        quote: "To illustrate the utility of these tests, patients with AIDS and AIDS-related complex are often hypergammaglobulinemic, but form specific antibodies poorly."
        question: "An AIDS patient has a high total IgG. What does it tell you about antibody function?"
        options:
          - "Little: specific antibody responses are often poor"
          - "Antibody function is normal"
          - "It rules out B cell dysfunction"
          - "It means IVIG is harmful"
        answer: 0
        why:
          - "صح: الـ acquired immunodeficiency syndrome (AIDS) غالبًا hypergammaglobulinemic بس الـ specific antibodies ضعيفة، فاعمل specific antibodies after immunization."
          - "الرقم الكلي ما بيقيسش الوظيفة."
          - "مش بينفي، بالعكس الـ specific response ضعيف."
          - "ملوش علاقة بالـ intravenous immunoglobulin (IVIG)."
      - kind: explain
        page: 185
        title: "الـ chest X-ray"
        quote: "Abnormal findings on chest radiograph, such as interstitial infiltrates, bronchiectasis, emphysema or bullae, and scarring. Chest radiograph findings may be normal despite the presence of structural abnormalities.\nThe absence of a thymic shadow is a common finding in patients with SCID (severe combined immune defficiency).\nCupping and flaring of the costochondral junctions is typical for ADA (adenosine deaminase) deficiency."
        text: |
          - ممكن تلاقي **interstitial infiltrates**، **bronchiectasis**، emphysema أو bullae، و scarring، بس ==ممكن تبقى طبيعية== رغم إن فيه structural abnormalities
          - ==غياب الـ thymic shadow== شائع في **SCID**
          - **Cupping and flaring** في الـ costochondral junctions = typical لـ **ADA deficiency**

          ليه الـ bronchiectasis؟ التفسير المقبول (مش في الكتاب): كل pneumonia بتسيب ندبة، ومع التكرار الشعب بتتوسع وبتتشوه. وليه العضم في ADA؟ لأن الـ metabolites اللي الإنزيم المفروض يكسّرها بتتراكم وبتأذي الغضروف كمان، مش الـ lymphocytes بس.
      - kind: explain
        remind: [rheum.L11.029]
        page: 186
        title: "HRCT وتحاليل تانية"
        quote: "HRCT scans may be considered the criterion standard test to study lung abnormalities in these patients."
        text: |
          - **High-resolution computed tomography (HRCT)** هو الـ ==criterion standard== للرئة. في الـ CVID والـ primary hypogammaglobulinaemia بيبيّن pulmonary fibrosis، bronchiectasis، parenchymal scarring، pleural thickening، وأقل: emphysema أو nodules. ليه هو مش الـ X-ray؟ لأن الـ X-ray ممكن يطلع طبيعي (ص 185)
          - **ADA level** في كل عيان **SCID**
          - **RFLP** بيكشف الـ carriers، و ==umbilical cord blood== للـ prenatal diagnosis
          - الـ **"BALD" lymphocytes** في الـ scanning electron microscopy = diagnostic لـ Wiskott-Aldrich
          - **Red cell ADA** واطي في الجنين اللي عنده ADA deficiency
