            <text x="20" y="94" class="t-b">High</text>
            <text x="20" y="114" class="t-sm">10 to &lt; 20%</text>
            <rect x="220" y="72" width="100" height="54" rx="8" class="fg-good"/>
            <text x="270" y="105" text-anchor="middle" class="t-b">&lt; 70</text>
            <rect x="10" y="134" width="200" height="54" rx="8" class="fg-acc"/>
            <text x="20" y="156" class="t-b">Moderate</text>
            <text x="20" y="176" class="t-sm">5 to &lt; 10%</text>
            <rect x="220" y="134" width="100" height="54" rx="8" class="fg-good"/>
            <text x="270" y="167" text-anchor="middle" class="t-b">&lt; 100</text>
            <rect x="10" y="196" width="200" height="44" rx="8" class="fg-box"/>
            <text x="20" y="223" class="t-b">Low: &lt; 5%</text>
            <text x="270" y="223" text-anchor="middle" class="t-sm t-mut">LDL-C mg/dL</text>
          </svg>
      - kind: mnemonic
        page: 275
        quote: "| Risk | LDL-C target |\n|---|---|\n| Very high risk | LDL-C <1.4 mmol/L (<55 mg/dL) (Class I) |\n| High risk | LDL-C <1.8 mmol/L (<70 mg/dL) (Class I) |\n| Moderate risk | LDL-C <2.6 mmol/L (<100 mg/dL) (Class I) |"
        word: "VHM"
        parts:
          - { key: "V", text: "Very high: LDL-C < 55 mg/dL (1.4 mmol/L)" }
          - { key: "H", text: "High: < 70 mg/dL (1.8 mmol/L)" }
          - { key: "M", text: "Moderate: < 100 mg/dL (2.6 mmol/L)" }
        hook: "**55، 70، 100**: زي أرقام عربيات الميكروباص. والـ mmol: **1.4، 1.8، 2.6**."
      - kind: check
        page: 274
        quote: "Table 7: Cardiovascular risk categories in type 2 diabetes\n| Risk category | Patients with T2DM |\n|---|---|\n| Very high CV risk | Clinically established ASCVD or Severe TOD or 10-year CVD risk ≥20% using SCORE2-Diabetes |\n| High CV risk | Not fulfilling the very high-risk criteria and a 10-year CVD risk 10 to <20% using SCORE2-Diabetes |\n| Moderate CV risk | Not fulfilling the very high-risk criteria and a 10-year CVD risk 5 to <10% using SCORE2-Diabetes |\n| Low CV risk | Not fulfilling the very high-risk criteria and a 10-year CVD risk <5% using SCORE2-Diabetes |\nEuropean Heart Journal (2023) 44, 4043–4140 (2023 ESC Guidelines for the management of cardiovascular disease in patients with diabetes)"
        question: "The book's patient has SCORE2-Diabetes 27.6%, no ASCVD. Category and LDL-C target?"
        options:
          - "Very high; < 55 mg/dL"
          - "High; < 70 mg/dL"
          - "Moderate; < 100 mg/dL"
          - "Very high only if he had an MI; else < 100"
        answer: 0
        why:
          - "صح: ≥ 20% لوحده كفاية يخليه very high، و target أقل من 55."
          - "الـ high = 10 لـ أقل من 20%."
          - "الـ moderate = 5 لـ أقل من 10%."
          - "الـ ASCVD مش شرط؛ الـ score لوحده كفاية."
      - kind: explain
        page: 275
        title: "العلاج بالترتيب"
        quote: "Lipid-lowering treatment\n| Recommendation | Class | Level |\n|---|---|---|\n| Statins are recommended as the first-choice LDL-C-lowering treatment in patients with diabetes and above-target LDL-C levels. Administration of statins is defined based on the CV risk profile of the patients and the recommended LDL-C (or non-HDL-C) target levels. | I | A |\n| If the target LDL-C is not reached with statins, combination therapy with ezetimibe is recommended. | I | B |\n| A PCSK9 inhibitor is recommended in patients at very high CV risk, with persistently high LDL-C levels above target despite treatment with a maximum tolerated statin dose, in combination with ezetimibe, or in patients with statin intolerance. | I | A |"
        text: |
          1. ==Statin== أول اختيار (**I A**)، والجرعة على حسب الخطر والـ target.
          2. الـ target ما اتحققش؟ ضيف **ezetimibe** (**I B**).
          3. Very high risk ولسه فوق الـ target على أعلى statin + ezetimibe، أو مش بيستحمل الـ statin؟ ==proprotein convertase subtilisin/kexin type 9 (PCSK9) inhibitor== (**I A**).
      - kind: table
        page: 276
        quote: "Intensity of lipid-lowering treatment\n| Treatment | Average LDL-C reduction |\n|---|---|\n| Moderate-intensity statin | ≈30% |\n| High-intensity statin | ≈50% |\n| High-intensity statin plus ezetimibe | ≈65% |\n| PCSK9 inhibitor | ≈60% |\n| PCSK9 inhibitor plus high-intensity statin | ≈75% |\n| PCSK9 inhibitor plus high-intensity statin plus ezetimibe | ≈85% |"
        title: "كل علاج بينزّل كام؟"
        columns: [Treatment, LDL-C ↓]
        rows:
          - ["Moderate statin", "≈ 30%"]
          - ["High statin", "≈ 50%"]
          - ["High statin + ezetimibe", "≈ 65%"]
          - ["PCSK9 inhibitor", "≈ 60%"]
          - ["PCSK9i + high statin", "≈ 75%"]
          - ["PCSK9i + high statin + ezetimibe", "≈ 85%"]
        hide: [[0, 1], [1, 1], [2, 1], [5, 1]]
      - kind: aside
        tone: tip
        page: 276
        quote: "Intensity of lipid-lowering treatment\n| Treatment | Average LDL-C reduction |\n|---|---|\n| Moderate-intensity statin | ≈30% |\n| High-intensity statin | ≈50% |\n| High-intensity statin plus ezetimibe | ≈65% |\n| PCSK9 inhibitor | ≈60% |\n| PCSK9 inhibitor plus high-intensity statin | ≈75% |\n| PCSK9 inhibitor plus high-intensity statin plus ezetimibe | ≈85% |"
        text: "احفظها كده: **30، 50** للـ statin (moderate، high). الـ **ezetimibe يزوّد 15**، والـ **PCSK9 inhibitor يزوّد 25** على الـ high statin. فـ 50+15 = 65، 50+25 = 75، والتلاتة ≈ 85."
      - kind: reveal
        page: 276
        quote: "Intensity of lipid-lowering treatment\n| Treatment | Average LDL-C reduction |\n|---|---|\n| Moderate-intensity statin | ≈30% |\n| High-intensity statin | ≈50% |\n| High-intensity statin plus ezetimibe | ≈65% |\n| PCSK9 inhibitor | ≈60% |\n| PCSK9 inhibitor plus high-intensity statin | ≈75% |\n| PCSK9 inhibitor plus high-intensity statin plus ezetimibe | ≈85% |"
        prompt: "عيان الكتاب: LDL 128، والـ target أقل من 55. محتاج ينزل كام في المية؟ وأنهي علاج؟"
        answer: "128 ← 55 = نزول حوالي **57%**. الـ high statin لوحده (50%) يوصله لحوالي 64، **مش كفاية**. ==High statin + ezetimibe== (≈ 65%) يوصله لحوالي 45. ده العلاج."
      - kind: explain
        page: 276
        title: "I-ROSETTE"
        quote: "Clinical Trial to Compare the Efficacy and Safety of Combination Therapy With Ezetimibe and Rosuvastatin Versus Rosuvastatin Monotherapy in Patients With Hypercholesterolemia: I-ROSETTE (Ildong Rosuvastatin & Ezetimibe for Hypercholesterolemia) Randomized Controlled Trial"
        text: |
          Phase III، double-blind: ==rosuvastatin + ezetimibe== ضد rosuvastatin لوحده في الـ hypercholesterolemia.
          - المجموع: **−57%** ضد **−44.4%**.
          - Rosuvastatin 20 mg: **−62.2%** ضد **−47.1%**.

          الإضافة كسبت في كل جرعة (5 و 10 و 20 mg).
