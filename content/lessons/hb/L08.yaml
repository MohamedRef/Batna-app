          - ["Valproate", "Young age, other anticonvulsants"]
          - ["Diclofenac", "Female, osteoarthritis"]
          - ["Sulfonamide", "HIV, slow acetylator, genetic defect in defense"]
          - ["Anticonvulsants", "Genetic defect in detoxification"]
