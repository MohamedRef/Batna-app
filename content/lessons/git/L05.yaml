        page: 193
        title: "الـ DALM في المنظار"
        image: { file: git/L05-dalm.webp, book: true }
        alt: "Two book colonoscopy pictures of raised mucosal lesions in an inflamed colon: a rounded mass at the edge of the lumen, and a large irregular reddish mass."
        caption: |
          **Raised lesion** في قولون عنده **long-standing IBD**. ده مش inflammatory polyp بريء: فيه ==dysplasia==، وبيقلب سرطان أسرع من الـ adenoma.
      - kind: explain
        page: 193
        quote: "b- Hamartomatous polyps Also known as 'juvenile polyps', consist mainly of connective tissue covered by a hypertrophic epithelium. They are pedunculated, cherry-red, smooth polyps."
        title: "Hamartomatous (juvenile) polyps"
        text: |
          - **Connective tissue** متغطي بـ hypertrophic epithelium.
          - شكلها: ==pedunculated, cherry-red, smooth==.
          - الـ **sporadic**: غالبًا solitary، في سن صغير، ومن غير malignant potential.
          - أو جزء من **polyposis syndrome**.

          التفسير المقبول (مش في الكتاب): ليه اسمه juvenile؟ لأنه أشهر بوليب في الأطفال، مش لأنه بيظهر في الأطفال بس، وعلشان كده النزيف من الشرج عند طفل أول حاجة تفكر فيها.
      - kind: reveal
        page: 193
        quote: "A sporadic hamartomatous polyp is usually solitary, appears at an early"
        prompt: "طفل جه بنزيف من الشرج، ولقوا بوليب واحد أحمر أملس على stalk. تقلق قد إيه؟"
        answer: |
          الكتاب: الـ hamartoma (==juvenile polyp==) **pedunculated، cherry-red، smooth**. الـ **sporadic** غالبًا **solitary**، في **سن صغير**، و **ما فيهوش malignant potential** عادةً.

          التفسير المقبول (مش في الكتاب): الـ hamartoma نسيج طبيعي متلخبط في ترتيبه (connective tissue كتير وغدد متوسعة)، مش خلايا اتغيّرت جينيًا، علشان كده البوليب الواحد بريء. ولونه أحمر لأن سطحه مليان أوعية وبيتآكل بسهولة، فبينزف. بس لو لقيت **كتير** منهم، أو فيه قصة في العيلة، فكّر في syndrome، وده خطره مختلف.
      - kind: mnemonic
        page: 193
        quote: "Several different syndromes have been described as Juvenile Polyposis, Peutz-Jeghers syndrome, hereditary mixed polyposis syndrome, and the PTEN hamartoma tumor syndromes (Cowden and Bannayan-Riley-Ruvalcaba syndromes), which are autosomal-dominantly inherited, and Cronkhite-Canada syndrome, which is acquired."
        word: "JPHPC"
        parts:
