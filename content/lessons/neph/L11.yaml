  - id: neph.L11.lesson1
    title: "الكلية وهي حامل: أرقام جديدة وأسباب حسب الشهر"
    hook: "كرياتينين 0.9 عند واحدة حامل ممكن يكون مصيبة. ليه؟ وإزاي التوقيت لوحده بيقولك السبب؟"
    minutes: 8
    pages: [352, 356]
    topics: [physiology, aki-epi, aki-causes]
    goals:
      - "تعرف التغييرات الطبيعية في الكلية أثناء الحمل"
      - "تفهم ليه الـ AKI في الحمل صعب يتشخص"
      - "ترتب أسباب الـ AKI على التايملاين: أول الحمل، آخره، وبعد الولادة"
    status: unverified
    steps:
      - kind: explain
        page: 352
        title: "الكلية بتكبر وبتشتغل أكتر"
        quote: "there is a 30% increase in renal volume; from 1.0 to 1.5 cm enlargement in renal bipolar diameter; and 50-80% increase in renal blood flow"
        text: |
          الحمل بيعمل للكلية **overtime**:
          - حجم الكلية يزيد ==30%==، وطولها يزيد **1-1.5 cm**.
          - الـ **renal blood flow** يزيد **50-80%**، أغلبه في الـ first trimester.
          - الـ proteinuria لحد **300 mg/24 h** تعتبر طبيعية، لأن الـ GFR عالي والـ GBM بقت permeable أكتر.
      - kind: reveal
        page: 352
        quote: "mainly due to hormonal factors, and at the end of pregnancy this frequency also increases, but for mechanical reasons"
        prompt: "الحامل بتدخل الحمام كتير في أول الحمل وفي آخره. هل السبب واحد؟"
        answer: "لأ. في الأول السبب **hormonal**، وفي الآخر السبب **mechanical** (الرحم الكبير بيضغط على المثانة). والوزن بيزيد **10-14 kg**، منهم حوالي **9 لتر مية**."
      - kind: explain
        page: 354
        title: "ليه الكرياتينين بيقل؟"
        quote: "glomerular filtration rate increases by 40-60%, resulting in a physiological reduction in serum creatinine"
        text: |
          الدم بيزيد، والـ systemic vascular resistance بتقل، والـ cardiac output يعلى. جوه الكلية فيه **vasodilation** فالـ ==GFR== يزيد **40-60%**.

          النتيجة: الكرياتينين الطبيعي في الحمل ==0.4-0.6 mg/dL== بس. يعني رقم "طبيعي" برّه الحمل زي 0.9 ممكن يبقى معناه إن الكلية فقدت جزء كبير من شغلها.
      - kind: figure
        page: 354
        quote: "Pregnancy results in an increase in blood volume, a decrease in systemic vascular resistance, and an increase in cardiac output."
        title: "سلسلة الكرياتينين الواطي"
        alt: "Four stacked boxes joined by arrows: blood volume and cardiac output up with systemic vascular resistance down; intrarenal vasodilation with higher renal plasma flow; GFR up 40 to 60 percent; serum creatinine down to 0.4 to 0.6 mg/dL. A side note says a creatinine of 0.9 mg/dL may already be AKI in pregnancy."
        caption: "كل خطوة بتسلّم اللي بعدها. علشان كده **أي طلعة صغيرة** في الكرياتينين أثناء الحمل لازم تقلقك."
        svg: |
          <svg viewBox="0 0 330 290" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="N11a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="8" width="310" height="46" rx="8" class="fg-box"/>
            <text x="20" y="28" class="t-sm t-b">Blood volume ↑  Cardiac output ↑</text>
            <text x="20" y="45" class="t-sm">Systemic vascular resistance ↓</text>
            <path d="M165 54 L165 72" class="fg-arrow" marker-end="url(#N11a)"/>
            <rect x="10" y="74" width="310" height="40" rx="8" class="fg-box"/>
            <text x="20" y="99" class="t-sm">Intrarenal vasodilation, renal plasma flow ↑</text>
            <path d="M165 114 L165 132" class="fg-arrow" marker-end="url(#N11a)"/>
            <rect x="10" y="134" width="310" height="40" rx="8" class="fg-acc"/>
            <text x="20" y="159" class="t-b">GFR ↑ 40-60% (hyperfiltration)</text>
            <path d="M165 174 L165 192" class="fg-arrow" marker-end="url(#N11a)"/>
            <rect x="10" y="194" width="310" height="40" rx="8" class="fg-good"/>
            <text x="20" y="219" class="t-b">Creatinine 0.4-0.6 mg/dL</text>
            <rect x="10" y="244" width="310" height="40" rx="8" class="fg-bad"/>
            <text x="20" y="269" class="t-sm t-b">Creatinine 0.9 in pregnancy = think AKI</text>
          </svg>
      - kind: aside
        tone: trap
        page: 354
        quote: "pregnancy-related AKI is difficult to determine due to non-validation of these AKI diagnostic criteria in the pregnant population"
        text: |
          الـ **RIFLE** والـ **AKIN** والـ **KDIGO** كلهم ==مش validated== في الحمل (**non-validation** in the pregnant population). وغالبًا مفيش كرياتينين قبل الحمل تقارن بيه. الامتحان بيحب السؤال ده.
      - kind: explain
        page: 353
        title: "مشكلة كبيرة ولسه بتكبر"
        quote: "continue to remain higher than in the developed countries due to lack of antenatal care and higher frequency of septic abortions"
        text: |
          الـ AKI في الحمل بيرفع وفيات الأم والجنين، وبيسيب وراه **CKD** و **ESKD** وأمراض قلب.

          في أمريكا زاد تقريبًا **3 أضعاف** (سن الأم أكبر، أمراض أكتر، hypertensive disorders، سمنة). وفي الدول النامية لسه أعلى بسبب ==قلة الـ antenatal care== و **الـ septic abortion**.
      - kind: check
        page: 354
        quote: "The normal level of serum creatinine in pregnancy is lower than the baseline usually ranging between 0.4 and 0.6 mg/dL range."
        question: "At 28 weeks, which creatinine should worry you most about AKI?"
        options:
          - "0.5 mg/dL"
          - "0.45 mg/dL"
          - "1.0 mg/dL"
          - "0.6 mg/dL"
        answer: 2
        why:
          - "ده في النطاق الطبيعي للحمل."
          - "طبيعي في الحمل."
          - "صح: الطبيعي 0.4-0.6، فـ 1.0 يعني الـ GFR وقع كتير."
          - "الحد الأعلى للطبيعي في الحمل."
      - kind: explain
        page: 355
        title: "التوقيت بيقولك السبب"
        quote: "Hyperemesis gravidarum, with the associated volume depletion, can result in AKI. Septic abortion is another common cause of AKI"
        text: |
          **First trimester**: ==hyperemesis gravidarum== (جفاف = prerenal)، **septic abortion** (ATN)، GN flare زي lupus، ونزيف المشيمة.

          **Second و third**: preeclampsia، HELLP، **AFLP**، TTP و aHUS، pyelonephritis، و **obstruction** من الرحم الكبير اللي بيضغط على الحالبين.

          والحمل **hypercoagulable**، فلو حصل hypotension شديد ممكن يعمل ==acute cortical necrosis==.
      - kind: figure
        page: 356
        quote: "Fig 1: Timing of AKI in pregnancy"
        title: "تايملاين الـ AKI في الحمل (Fig 1)"
        alt: "Timeline with four columns, first trimester, second trimester, third trimester and postpartum. Bars: septic abortion and hyperemesis in the first trimester; acute pyelonephritis from late first to third; TTP second to third; preeclampsia, eclampsia and HELLP late second to early postpartum; acute fatty liver third; obstruction third; cortical necrosis third to postpartum; atypical HUS and NSAID use postpartum; glomerulonephritis flare across all."
        caption: "اقرا العيانة بالشهر: أول الحمل = **جفاف وإجهاض**، آخره = **preeclampsia وأخواتها**، بعد الولادة = ==aHUS و NSAIDs==."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <text x="45" y="16" text-anchor="middle" class="t-sm t-b">1st</text>
            <text x="125" y="16" text-anchor="middle" class="t-sm t-b">2nd</text>
            <text x="205" y="16" text-anchor="middle" class="t-sm t-b">3rd</text>
            <text x="285" y="16" text-anchor="middle" class="t-sm t-b">Postpartum</text>
            <path d="M5 24 L325 24" class="fg-ink"/>
            <path d="M85 20 L85 290 M165 20 L165 290 M245 20 L245 290" class="fg-thin"/>
            <rect x="5" y="32" width="100" height="20" rx="4" class="fg-acc"/>
            <text x="55" y="46" text-anchor="middle" class="t-sm">Septic abortion</text>
            <rect x="5" y="56" width="100" height="20" rx="4" class="fg-acc"/>
            <text x="55" y="70" text-anchor="middle" class="t-sm">Hyperemesis</text>
            <rect x="30" y="80" width="200" height="20" rx="4" class="fg-box"/>
            <text x="130" y="94" text-anchor="middle" class="t-sm">Acute pyelonephritis</text>
            <rect x="85" y="104" width="160" height="20" rx="4" class="fg-box"/>
            <text x="165" y="118" text-anchor="middle" class="t-sm">TTP</text>
            <rect x="140" y="128" width="125" height="20" rx="4" class="fg-bad"/>
            <text x="202" y="142" text-anchor="middle" class="t-sm">PE / eclampsia / HELLP</text>
            <rect x="170" y="152" width="75" height="20" rx="4" class="fg-bad"/>
            <text x="207" y="166" text-anchor="middle" class="t-sm">AFLP</text>
            <rect x="170" y="176" width="75" height="20" rx="4" class="fg-box"/>
            <text x="207" y="190" text-anchor="middle" class="t-sm">Obstruction</text>
            <rect x="180" y="200" width="95" height="20" rx="4" class="fg-box"/>
            <text x="227" y="214" text-anchor="middle" class="t-sm">Cortical necrosis</text>
            <rect x="245" y="224" width="80" height="20" rx="4" class="fg-good"/>
            <text x="285" y="238" text-anchor="middle" class="t-sm">aHUS</text>
            <rect x="245" y="248" width="80" height="20" rx="4" class="fg-good"/>
            <text x="285" y="262" text-anchor="middle" class="t-sm">NSAID use</text>
            <rect x="5" y="272" width="320" height="20" rx="4" class="fg-thin"/>
            <text x="165" y="286" text-anchor="middle" class="t-sm">Glomerulonephritis flare (any time)</text>
          </svg>
      - kind: sort
        page: 356
        quote: "Fig 1: Timing of AKI in pregnancy"
        prompt: "حط كل سبب في الوقت اللي بيظهر فيه غالبًا:"
        bins: ["First trimester", "Late pregnancy", "Postpartum"]
        cards:
          - { text: "Hyperemesis gravidarum", bin: 0 }
          - { text: "Septic abortion", bin: 0 }
          - { text: "Acute fatty liver of pregnancy", bin: 1 }
          - { text: "HELLP syndrome", bin: 1 }
          - { text: "Ureteric obstruction by the uterus", bin: 1 }
          - { text: "Atypical HUS", bin: 2 }
          - { text: "NSAID-induced injury", bin: 2 }
        why: "أول الحمل = جفاف من الترجيع وإجهاض ملوث. آخره = الأمراض الخاصة بالحمل (HELLP، AFLP) والرحم الكبير. بعد الولادة = aHUS والمسكنات."
      - kind: aside
        tone: joke
        page: 355
        quote: "Post-obstructive AKI is more common in the second and third trimester due to the growing uterus"
        text: |
          الجنين في التالت بيبقى زي الساكن اللي ركن عربيته على **الحالبين** وقفل الشارع. obstruction من غير ما حد يقصد.
      - kind: try
        items: [neph.L11.002, neph.L11.012, neph.L11.013, neph.L11.016, neph.L11.020]
    recap:
      - "الكلية تكبر 30%، الـ RBF يزيد 50-80%، proteinuria لحد 300 mg/24 h طبيعية."
      - "الـ GFR يزيد 40-60%، فالكرياتينين الطبيعي 0.4-0.6 mg/dL."
      - "RIFLE و AKIN و KDIGO مش validated في الحمل؛ تابع الـ trend."
      - "أول الحمل: hyperemesis و septic abortion. آخره: preeclampsia و HELLP و AFLP و TTP و obstruction. بعد الولادة: aHUS و NSAIDs."
      - "الحمل hypercoagulable، فالـ hypotension الشديد ممكن يعمل cortical necrosis."
