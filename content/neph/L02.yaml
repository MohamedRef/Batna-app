  # ---------- MCQs ----------
  - id: neph.L02.154
    kind: mcq
    topic: definition
    stem: A 50-year-old has eGFR 70 and ACR 45 mg/g on two tests 4 months apart. Best description?
    options:
    - CKD G2A3
    - CKD G3aA1
    - AKI
    - No CKD (eGFR > 60)
    - CKD G2A2
    answer: 4
    why:
    - A3 is > 300 mg/g.
    - G3a is 45–59.
    - Persistence over > 3 months means chronic.
    - CKD can be present with eGFR > 60 when a damage marker persists.
    - Albuminuria ≥ 30 mg/g for > 3 months is a marker of kidney damage; eGFR 60–89 = G2, ACR 30–300 = A2.
    src:
      page: 24
      quote: CKD is defined as abnormalities of kidney structure or function, present for > 3 months, with implications for health
    status: unverified
  - id: neph.L02.155
    kind: mcq
    topic: egfr
    stem: A 70-year-old has a stable eGFR of 50 with ACR 10 mg/g. Using the book's age-adapted threshold, what is it?
    options:
    - Not CKD by the age-adapted threshold (< 45 over 65)
    - AKI
    - CKD G3b
    - CKD G3a
    answer: 0
    why:
    - Over 65, the book's age-adapted threshold for diagnosing CKD is < 45 mL/min.
    - Stable values are not AKI.
    - G3b is 30–44.
    - Under the fixed < 60 rule it would be G3aA1, but the age-adapted table says otherwise.
    src:
      page: 29
      quote: GFR threshold for diagnosis of CKD
    status: unverified
  - id: neph.L02.156
    kind: mcq
    topic: albuminuria
    stem: Which factor gives a falsely HIGH ACR because of lower urinary creatinine?
    options:
    - AKI
    - High body weight
    - Exercise
    - Meat intake
    - Male sex
    answer: 0
    why:
    - AKI lowers urinary creatinine concentration, so the ratio rises.
    - 'High weight means high creatinine excretion: low ACR.'
    - Exercise raises urinary creatinine (and albumin), the creatinine effect lowers the ratio.
    - 'Meat raises urinary creatinine: lower ACR.'
    - 'Males excrete more creatinine: lower ACR.'
    src:
      page: 30
      quote: Lower urinary creatinine concentration with AKI
    status: unverified
  - id: neph.L02.157
    kind: mcq
    topic: staging
    stem: How many times a year should a patient with CKD G3bA2 be monitored?
    options:
    - 4 or more
    - '3'
    - '1'
    - '2'
    answer: 1
    why:
    - 4+ fits G4A3 and G5.
