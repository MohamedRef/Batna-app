            <text x="180" y="206" class="t-sm t-mut">-2.5 or less</text>
          </svg>
      - kind: explain
        page: 222
        title: "Screening ومتابعة الكثافة"
        quote: "Therefore, widespread screening for osteoporosis in asymptomatic women cannot be recommended."
        text: |
          - الكتاب: ==widespread screening== للستات اللي ملهمش أعراض **cannot be recommended**.
          - الـ **serial measurements** لمتابعة العلاج **controversial**.
          - لو الكثافة بين الـ mean و **1 SD** تحتها: قياس تاني بعد **2 to 5 years**.
      - kind: update
        page: 222
        quote: "Therefore, widespread screening for osteoporosis in asymptomatic women cannot be recommended."
        text: "الـ USPSTF بتوصي بـ BMD screening لكل ست عندها **65 سنة أو أكتر**، وللأصغر بعد سن اليأس لو الخطر عالي."
        ref: "USPSTF osteoporosis screening 2018"
      - kind: table
        page: 223
        quote: "Together with its low cost, these characteristics make DEXA the method of choice."
        title: "أربع طرق لقياس الكثافة"
        columns: [Method, Good, Bad]
        rows:
          - ["SPA", "Cheap, low radiation", "No spine or femur"]
          - ["DPA", "Spine + femur directly", "Costly, slow; false high"]
          - ["QCT", "Lumbar spine", "Very high radiation"]
          - ["DEXA", "Precise, low dose, cheap, fast", "Fracture data less studied"]
        hide: [[0, 2], [2, 2], [3, 1]]
      - kind: reveal
        page: 222
        quote: "Falsely elevated values may occur with degenerative joint disease, compression fractures, or closely situated calcified vessels."
        prompt: "ست كبيرة عندها osteoarthritis في العمود الفقري و aortic calcification. الـ DPA طلع طبيعي. تصدّقه؟"
        answer: |
          لأ بسهولة. الـ **DPA** بيدي ==falsely elevated values== مع الـ **degenerative joint disease**، والـ **compression fractures**، والـ **calcified vessels** القريبة. الكالسيوم الزيادة بيتحسب كأنه عضم.
      - kind: check
        page: 223
        quote: "Because of the extremely high radiation exposure with quantitative CT, it should not be used in women of childbearing age or for serial measurements."
        question: "Which bone density method should NOT be used in a 28-year-old woman or for serial scans?"
        options:
          - "Quantitative CT"
          - "DEXA"
          - "Single-photon absorptiometry"
          - "Dual-photon absorptiometry"
        answer: 0
        why:
          - "صح: الـ QCT فيه extremely high radiation."
          - "الـ DEXA هو الأنسب للـ serial measurements."
          - "قليل الإشعاع، بس مش بيقيس الـ spine."
          - "مش ممنوع، بس أغلى وأبطأ."
      - kind: explain
        page: 223
        title: "من غير دوا: تلات حاجات"
        quote: "There are three components to the nondrug therapy of osteoporosis: diet, exercise, and cessation of smoking."
        text: |
          ==diet, exercise, and cessation of smoking==، وكمان **avoid drugs that increase bone loss** زي الـ glucocorticoids لو ينفع.

          - **Calcium**: supplement **500–1000 mg/day** elemental، **divided doses at mealtime**، والإجمالي مع الأكل حوالي **1500 mg/day**.
          - **Vitamin D**: **800 IU/day**، أكتر مع الـ malabsorption أو الـ anticonvulsants.
      - kind: update
        page: 223
        quote: "such that their total calcium intake, including food calcium, approximates 1500 mg/day."
        text: "التوصية الحالية: إجمالي الكالسيوم **1200 mg/day** للستات من 51 سنة، من الأكل الأول والـ supplement يكمّل الناقص بس."
        ref: "BHOF Clinician's Guide 2022"
      - kind: explain
        page: 224
        title: "الرياضة والسجاير"
        quote: "Smoking one pack per day throughout adult life was associated with a 5 to 10 percent reduction in bone density."
        text: |
          - **Exercise**: على الأقل **30 minutes three times per week**، أي **weight-bearing** حتى المشي. في الكبار، الفايدة الأساسية من **muscular strength** (وقعات أقل) مش الكثافة.
          - **Smoking**: علبة في اليوم طول العمر = ==5 to 10%== أقل في الكثافة، وبيبوّظ فايدة الـ estrogen لأنه بيسرّع الـ **estrogen metabolism**.
      - kind: mnemonic
