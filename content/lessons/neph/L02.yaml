          - "الكتاب بيقول مفيش فايدة واضحة لزيادة المية في وقف الـ progression."
          - "مفيش استثناء في الكتاب للـ SGLT2i هنا؛ المية على قد العطش."
      - kind: explain
        page: 45
        quote: "In advanced CKD water restriction may be necessary."
        title: "ليه نقلّل المية في الـ advanced CKD؟"
        text: |
          الكتاب: أكتر من **1.5 L/day** questionable، وفي الـ **advanced CKD** ممكن نحتاج **نقلّل** المية.

          التفسير المقبول (مش في الكتاب): الكلية المتأخرة **مش بتعرف** تطلّع مية زيادة بسرعة، **فـ** المية اللي بيشربها بتفضل في الجسم: edema، ضغط عالي، وممكن **hyponatremia** **لأن** المية بتخفف الصوديوم. يعني نفس الكوباية اللي بتنفع واحد عنده stones ممكن تضر واحد في G5.
      - kind: explain
        page: 45
        quote: "Fasting in Ramadan"
        title: "ليه الصيام خطر على كلية ضعيفة؟"
        text: |
          جدول **Fasting in Ramadan** في الكتاب بيقسم المرضى لـ very high و high و lower risk.

          التفسير المقبول (مش في الكتاب) للتقسيم:

          - الصيام في الصيف = ساعات طويلة من غير مية، فالـ volume يقل والدم الواصل للكلية يقل (==pre-renal== AKI).
          - الكلية السليمة بتركّز البول وتحافظ على المية. الكلية المتأخرة (G4–5) **مش بتعرف تركّز**، فبتجف أسرع.
          - الـ ACEi و ARB والـ diuretics والـ SGLT2i بيقلّلوا الـ GFR أو الـ volume، فمع الصيام الضربة بتبقى اتنين.
          - مرضى الـ stones والـ UTI: بول مركّز = حصوات وعدوى أكتر.

          وعلشان كده اللي في الـ lower risk ولو أصرّ: ==creatinine بعد 5 أيام== صيام، علشان تلحق أي نزول بدري.
