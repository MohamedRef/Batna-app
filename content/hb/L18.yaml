- id: hb.L18.082
  kind: mcq
  topic: clinical
  stem: A 62-year-old man with HBV cirrhosis and a known 7 cm peripheral HCC suddenly develops severe abdominal
    pain and distension. BP 80/50, hemoglobin fell from 12 to 8 g/dL. What is the most appropriate next step after
    resuscitation and imaging?
  options:
  - Start sorafenib
  - Urgent angiography and embolization of the bleeding vessel
  - Large-volume paracentesis
  - Immediate liver transplantation
  - Percutaneous ethanol injection
  answer: 1
  why:
  - Systemic therapy does not stop bleeding.
  - 'Correct: tumour rupture needs urgent angiography and embolization, or surgery, to control bleeding.'
  - This is haemoperitoneum, not tense ascites; paracentesis does not treat it.
  - Transplant is not an emergency treatment for rupture.
  - PEI is for small early tumours, not for bleeding.
  src:
    page: 356
    quote: "Urgent angiography, embolization of the bleeding vessel, or even surgery is required to control bleeding."
  status: unverified
