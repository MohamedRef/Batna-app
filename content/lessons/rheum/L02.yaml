          التفسير المقبول (مش في الكتاب): ليه النوبات بتكتر مع الوقت؟ عشان الـ urate لسه عالي بين النوبات، فالبلورات بتفضل تترسب بهدوء وتكبر. يعني الهدوء ده مش شفا، ده وقت تخزين. وعشان كده الكتاب بيقول المحدد الأساسي هو مستوى الـ uric acid: لو نزّلته تحت 6 البلورات تدوب والسنين العشرة دي ممكن ماتحصلش. والـ desquamation في الآخر سببها إن الجلد اللي كان وارم ومشدود بيتقشّر لما الورم يخف.
