  - id: geri.L03.lesson3
    title: "الجسم بيحس بالدوا غير، والروشتة بتغلط"
    hook: "الـ morphine اللي بيسكّن الشاب ممكن ينيّم الحاج. والـ propranolol اللي بيبطّأ قلب الشاب، عند الحاج تأثيره أضعف."
    minutes: 8
    pages: [46, 48]
    topics: [pd, problems]
    goals:
      - "تعرف الـ pharmacodynamic changes لكل عضو"
      - "تحفظ الـ medication therapy problems التسعة"
      - "تعرف أمثلة الـ undertreatment و Beers"
    status: unverified
    steps:
      - kind: explain
        page: 46
        title: "الـ pharmacodynamics: نفس التركيز، تأثير مختلف"
        quote: "Ageing is associated with an increased sensitivity for many compounds- opiates, decreased B-adrenergic responses in the elderly (e.g., propanolol & isoproterenol)."
        text: |
          مش بس الدوا بيوصل بكمية مختلفة، كمان الـ **receptor** بيرد بشكل مختلف:
          - ==increased sensitivity== لأدوية كتير، زي الـ **opiates**.
          - ==decreased β-adrenergic responses==، زي الـ propranolol والـ isoproterenol.

          ليه؟ التفسير المقبول (مش في الكتاب):
          - **المخ** عند الكبار عنده reserve أقل (خلايا أقل و blood-brain barrier أضعف)، فالـ opiates والـ benzodiazepines بتنيّمه بجرعة أصغر.
          - الـ **β-receptors** بيقل عددها وردها مع السن، علشان الجسم عاش سنين في مستوى adrenaline عالي. فالـ propranolol بيبطّأ أقل، والـ isoproterenol بيسرّع أقل.

          الخلاصة: الدوا ممكن يوصل **أكتر** (الـ PK) ويأثّر **أكتر** (الـ PD) في نفس الوقت، أو العكس. ومش هتعرف غير بالمتابعة.
      - kind: table
        page: 46
        quote: "Pharmacodynamic alterations in geriatric patients\n  Urinary bladder: Anticholinergics → urine retention\n  Eye: Anticholinergics → disturbed accommodation, acute glaucoma\n  CNS: Benzodiazepines, opiates → sedation, Betablockers, Digoxin → depression."
        title: "كل عضو والدوا اللي بيتعبه"
        columns: [Organ, Drug, Effect]
        rows:
          - ["Bladder", "Anticholinergics", "Retention"]
          - ["Eye", "Anticholinergics", "Glaucoma, blurred"]
          - ["CNS", "Benzos, opiates", "Sedation"]
          - ["CNS", "BB, digoxin", "Depression"]
          - ["BP", "ACEI, neuroleptics", "Hypotension"]
          - ["Kidney", "NSAIDs", "Renal failure"]
          - ["Heart, lungs", "BB, sympathomimetics", "Less response"]
        hide: [[0, 2], [1, 2], [3, 2], [4, 2], [5, 2]]
      - kind: match
        page: 47
        quote: "Blood pressure regulation: ACE-inhibitors, neuroleptics → hypotonia\nKidney: NSAIDs → renal failure"
        prompt: "وصّل الدوا بالمشكلة اللي بيعملها عند الحاج:"
        pairs:
          - ["Anticholinergics", "Urine retention"]
          - ["Digoxin", "Depression"]
          - ["Opiates", "Sedation"]
          - ["NSAIDs", "Renal failure"]
          - ["Neuroleptics", "Hypotension"]
        why: "الجدول في ص 46–47."
      - kind: explain
        page: 47
        title: "إيه المختلف في روشتة الكبار؟"
        quote: "What is different about Geriatric Prescription?\n  Underuse, Overuse or Misuse problem?\n  Altered Pharmacokinetics and Pharmacodynamics.\n  Risk/Benefit Ratio in this vulnerable, frail population.\n  Ability to recognize side effects in the elderly is reduced.\n  Multiple physicians with poor communication among them.\n  Compliance/Adherence considerations"
        text: |
          - المشكلة ممكن تكون **underuse أو overuse أو misuse**.
          - الـ **PK والـ PD** متغيرين.
          - الـ ==risk/benefit== مختلف في الـ frail.
          - الـ **side effects** صعب تتعرف.
          - **دكاترة كتير** ومحدش بيكلم التاني.
          - الـ **adherence**.

          ليه الـ side effects صعب تتعرف؟ لأنها بتيجي على شكل حاجات الناس بتحسبها "كبر": لخبطة، وقعة، إمساك، احتباس بول، نسيان. فبدل ما الدكتور يوقف الدوا، بيكتب دوا تاني يعالج العرض. وده اللي هتشوفه في الحاج أحمد آخر المحاضرة.
      - kind: explain
        remind: [geri.L03.047]
        page: 47
        title: "تسع مشاكل في الأدوية"
        quote: "Medication Therapy Problems\n  Polypharmacy: drug use without indication\n  Undertreatment: indication without drug use\n  Dose too low\n  Dose too high\n  Adverse drug reaction\n  Drug interaction\n  Inappropriate drug\n  Lack of adherence or compliance\n  Medication error"
        text: |
          - ==Polypharmacy==: دوا من غير indication.
          - ==Undertreatment==: indication من غير دوا.
          - Dose too low، و dose too high.
          - Adverse drug reaction، و drug interaction.
          - Inappropriate drug.
          - Lack of adherence.
          - Medication error.

          ليه نحفظهم كده؟ لأن كل مشكلة هي **سؤال ما اتسألش**. فيه indication؟ (polypharmacy ولا undertreatment). الجرعة مظبوطة على الكلية والكبد؟ (too low ولا too high). بيتخانق مع دوا أو مرض تاني؟ (interaction). مناسب للسن؟ (inappropriate). الحاج فاهم وبياخده؟ (adherence و error).
      - kind: aside
        tone: joke
        text: "الـ polypharmacy والـ undertreatment زي اتنين أخوات بيتخانقوا على نفس الشنطة: واحد حاطط فيها أدوية مالهاش لازمة، والتاني ناسي فيها التطعيم. والحاج شايل الشنطة."
      - kind: explain
        remind: [geri.L03.049]
        page: 47
        title: "الـ undertreatment: الأدوية اللي بتتنسي"
        quote: "Examples of Undertreatment\n  Pain management\n  Pneumococcal and flu vaccine\n  Depression\n  Secondary heart attack prevention"
        text: |
          أمثلة الكتاب:
          - **Pain management**: الحاج بيستحمل الألم.
          - **Pneumococcal و flu vaccine**.
          - **Depression**: بيتحسب على إنه «كبر».
          - **Secondary heart attack prevention**.

          ليه الأدوية دي بالذات بتتنسي؟ لأن الدكتور خايف من الـ polypharmacy، فيشيل اللي "مش ضروري النهارده". التطعيم مش بيعالج عرض، والـ statin مش بيريّح حاجة، والألم والاكتئاب الحاج نفسه مش بيشتكي منهم. بس دول بالذات اللي بيمنعوا دخول المستشفى والـ MI التاني.
      - kind: check
        page: 47
        quote: "Medication Therapy Problems\n  Polypharmacy: drug use without indication\n  Undertreatment: indication without drug use\n  Dose too low\n  Dose too high\n  Adverse drug reaction\n  Drug interaction\n  Inappropriate drug\n  Lack of adherence or compliance\n  Medication error"
        question: "A 76-year-old had an MI last year and takes no statin or aspirin, with no contraindication. This is:"
        options:
          - "Undertreatment"
          - "Polypharmacy"
          - "Drug interaction"
          - "Dose too high"
        answer: 0
        why:
          - "صح: indication من غير دوا، وده من أمثلة الكتاب: secondary heart attack prevention."
          - "Polypharmacy = دوا من غير indication."
          - "مفيش دوا أصلًا علشان يعمل interaction."
          - "مفيش دوا أصلًا."
      - kind: explain
        page: 48
        title: "الـ ADEs بالأرقام"
        quote: "Rate of ADEs requiring hospitalization is nearly seven times greater for persons age 65 or over versus persons under age 65."
        text: |
          مقارنة بالأصغر من 65:
          - زيارات الطوارئ بسبب الـ adverse drug event (ADE): ==أكتر من الضعف==.
          - دخول المستشفى بسبب الـ ADE: ==حوالي 7 أضعاف==.

          ليه الفرق كبير كده في الدخول بالذات؟ لأن الـ ADE عند الكبير مش بيقف عند عرض بسيط: النعاس بيبقى وقعة وكسر، والـ NSAID بيبقى نزيف أو فشل كلوي، والـ digoxin بيبقى arrhythmia. يعني نفس الغلطة عند الشاب بتعدي، وعند الكبير بتدخّله المستشفى.
      - kind: explain
        page: 48
        title: "الأدوية الـ inappropriate و Beers"
        quote: "Inappropriate Drugs\n  Antibacterial to treat a viral infection\n  \"Beers medications\" - medications considered potentially inappropriate for older adults based on risk versus benefit (expert consensus)"
        text: |
          مثالين للـ **inappropriate drug**:
          - **Antibacterial** لـ viral infection.
          - الـ ==Beers medications==: أدوية potentially inappropriate للكبار على أساس risk vs benefit، بـ **expert consensus**.

          ليه expert consensus ومش trials؟ لأن الكبار، خصوصًا فوق 80 وعندهم أمراض كتير، **نادرًا ما بيدخلوا الـ trials**. فالخبرا قعدوا وقرروا: الدوا ده ضرره عند الكبير غالبًا أكبر من فايدته، وفي بديل أأمن.
      - kind: update
        page: 48
        quote: "Inappropriate Drugs\n  Antibacterial to treat a viral infection\n  \"Beers medications\" - medications considered potentially inappropriate for older adults based on risk versus benefit (expert consensus)\n  Ref: Arch Intern Med 2003;163:2716-24"
        text: "الكتاب بيستشهد بـ Beers **2003**. النسخة الحالية **American Geriatrics Society (AGS) Beers Criteria 2023**، وفي أوروبا **Screening Tool of Older Persons' Prescriptions (STOPP)/START v3 2023**، والـ Screening Tool to Alert to Right Treatment (START) بيفكّرك بالـ undertreatment. في الامتحان: كلام الكتاب."
        ref: "AGS Beers Criteria 2023; STOPP/START version 3, 2023"
      - kind: try
        items: [geri.L03.042, geri.L03.047, geri.L03.049, geri.L03.050, geri.L03.052]
    recap:
      - "PD: sensitivity أعلى للـ opiates، و β response أقل."
      - "Anticholinergics: retention و glaucoma. BB و digoxin: depression."
      - "Polypharmacy = دوا بلا indication. Undertreatment = indication بلا دوا."
