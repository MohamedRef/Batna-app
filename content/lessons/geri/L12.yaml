        quote: "If you live in a nursing home, call your Long Term Care Ombudsman. The ombudsman is your advocate and has the power to intervene."
        title: "الخلاصة: أربع أفعال"
        text: |
          الكتاب بيختم بأربع حاجات علينا نعملها:

          - **Listen**: اسمع الكبار **والـ caregivers** الاتنين.
          - **Intervene**: تدخّل لما ==تشك==، مش لما تتأكد.
          - **Educate**: علّم الناس يتعرفوا على الإساءة ويبلّغوا.
          - **Protect**: احمي الكبير وخد موقف.

          وفي دار المسنين، الكبير يكلّم الـ **Long Term Care Ombudsman**: ده المحامي بتاعه وعنده سلطة يتدخل.

          ليه نسمع الـ caregiver كمان؟ لأن أغلب الـ risk factors عنده تعب وضغط واكتئاب، ولو اتساعد، الإساءة نفسها بتقل.
