          - "قاعدة الـ 12 months دي للـ **HBeAg-positive** اللي عمل **HBeAg seroconversion**."
          - "الـ HBsAg لسه موجب، فمفيش endpoint للوقف."
          - "مفيش في الـ algorithm ده تحويل لـ interferon."
      - kind: figure
        page: 121
        quote: "LAM 24 38 49 67 70; ETV 0.2 0.5 1.2; TDF 0 0 0 0 0"
        title: "الـ NA resistance (رسمة الكتاب)"
        alt: "Horizontal bar chart of cumulative resistance. Lamivudine 24 percent at 1 year rising to 70 percent at 5 years. Adefovir 29 percent at 5 years. Telbivudine 17 percent at 2 years. Entecavir 1.2 percent at 5 years. Tenofovir DF 0 percent and tenofovir alafenamide 0 percent."
        caption: "الفرق بين **LAM 70%** و **ETV 1.2%** و **TDF/TAF 0%** هو سبب الـ first line كلها."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
