      - kind: explain
        page: 161
        title: "باقي الـ work-up"
        quote: "Serum erythropoietin is low/subnormal in PRV , while normal/high in 2ry erythrocytosis."
        text: |
          - **Ferritin** واطي أو normal، **B12** غالبًا عالي (transcobalamin من الـ granulocytes)، وممكن folate deficiency.
          - Renal function، **uric acid** (غالبًا عالي)، liver function tests (LFTs).
          - **U/S بطن**، computed tomography (CT) بطن، magnetic resonance imaging (MRI) مخ، chest X-ray، pulmonary function tests (PFTs)، echo حسب الحالة.
          - ==Serum erythropoietin (EPO)==: **low/subnormal** في الـ PV، **normal/high** في الـ secondary.
          - **Janus kinase 2 (JAK2) V617F**: sensitivity **97%**، specificity تقريبًا **100%**.
          - **Cytogenetics**: 30% (20q−، +8، +9، 13q−). **BFU-E**: endogenous erythroid colonies من غير EPO.
      - kind: explain
        page: 161
        title: "النخاع"
        quote: "BM examination: trephine biopsy may be diagnostic, typical features,\n  1) Hyprcellularity\n  2) Trilineage hyperplasia\n  3) Abnormal megakaryocytes (clustering with giant forms and increased ploidy)"
        text: |
          الـ **trephine** في الـ PV:
          1. Hypercellularity
          2. **Trilineage hyperplasia**
          3. ==Abnormal megakaryocytes==: clusters، giant، و ploidy أعلى
          4. Fibrosis ممكن
          5. نخاع طبيعي **ما يستبعدش** PV

          وهو **mandatory**: بيفرّق **early PV مع thrombocytosis** من الـ **essential thrombocythaemia (ET)**، وبيساعد لو الـ Hb عالي بس تحت الـ World Health Organization (WHO) threshold. ويتعاد لو شاكك في post-PV myelofibrosis (MF) أو leukemia.
