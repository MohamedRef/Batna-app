  # ---------------- bias (slides 57-62) ----------------
  - id: res.L08.048
    kind: mcq
    topic: bias
    stem: >-
      Any systematic error in the design, conduct or analysis of a study that gives a mistaken estimate of an exposure's effect
      on disease risk is called
    options: [Confounding, Bias, Interaction, Stratification]
    answer: 1
    why:
      - Confounding is mixing with a third factor; the definition asked for is broader.
      - A systematic (not random) error from design, conduct or analysis is bias.
      - Interaction (effect modification) is a real difference in effect between subgroups.
      - Stratification is an analysis method.
    src: { page: 57, quote: "Any systematic error in the design, conduct, or analysis of a study" }
    status: unverified
    tags: [high-yield]
  - id: res.L08.049
    kind: mcq
    topic: bias
    stem: The purpose of a double-blind or double-masked study is to
    options:
      - Achieve comparability of treated and untreated subjects
      - Reduce the effects of sampling variation
      - Avoid observer and subject bias
      - Avoid observer bias and sampling variation
    answer: 2
    why:
      - Comparability comes from randomization.
      - Sampling variation falls with a larger sample.
      - Hiding the treatment from subjects and observers stops both from biasing the results.
      - Blinding does nothing to sampling variation.
    src: { page: 58, quote: "Avoid observer and subject bias" }
    status: unverified
  - id: res.L08.050
    kind: mcq
    topic: bias
    stem: Randomization of study subjects in a clinical trial is most helpful for controlling
    options: [Placebo effect, Recall bias, Non-compliance, Effect modification (interaction), Confounding]
    answer: 4
    why:
      - The placebo effect is controlled by a placebo group and blinding.
      - Recall bias belongs to case-control studies.
      - Randomization cannot make people take the drug.
      - Effect modification is a real phenomenon to describe, not remove.
      - Randomization spreads known and unknown confounders equally between the groups.
    src: { page: 59, quote: "Randomization of study subjects in a clinical trial is most helpful for controlling" }
    status: unverified
    tags: [high-yield]
  - id: res.L08.051
    kind: mcq
    topic: bias
    stem: >-
      A case-control study finds alcohol strongly associated with lung cancer (OR = 2.5). When the subjects are split into
      smokers and non-smokers, there is no association within either group. This is an example of
    options: [Observer bias, Confounding, Placebo effect, Non-response bias, Recall bias]
    answer: 1
    why:
      - Nothing about how outcomes were assessed.
      - Smoking is linked to both drinking and lung cancer; once stratified by smoking, the alcohol effect disappears.
      - There is no treatment.
      - Nothing about people refusing to take part.
      - Recall bias would not vanish after stratifying by smoking.
    src: { page: 60, quote: "Subsequent statistical analysis does not reveal any association between alcohol consumption and lung cancer within either group" }
    status: unverified
    tags: [high-yield]
  - id: res.L08.052
    kind: mcq
    topic: bias
    stem: >-
      Two groups of pathologists read the same 1,000 kidney biopsies. The group that knows the patient's race reports
      "hypertensive nephropathy" far more often in black patients than the blinded group. Which bias is present?
    options: [Confounding, Non-response bias, Recall bias, Referral bias, Observer bias]
    answer: 4
    why:
      - The specimens are identical, so no third factor explains it.
      - Everyone's specimen was read.
      - Nobody is asked to remember anything.
      - The same biopsies go to both groups, so referral does not differ.
      - Knowing the race changed how the observers read the same slides.
    src: { page: 61, quote: "The first group of pathologists is aware of the race of the patient" }
    status: unverified
  - id: res.L08.053
    kind: mcq
    topic: bias
    stem: >-
      Mothers of children with neural tube defects and age-matched mothers of unaffected children answer a questionnaire about
      an over-the-counter pain reliever in pregnancy. Use increases the risk even after adjusting for race, medications, family
      history and folate (OR = 1.3, p = 0.03). Which bias is the major concern?
    options: [Non-response bias, Recall bias, Observer bias, Confounding, Selection bias]
    answer: 1
    why:
      - Nothing suggests different response rates.
      - Mothers of affected babies search their memory harder for every pill, so they over-report exposure, the classic case-control bias.
      - A standard questionnaire limits interviewer bias.
      - The main confounders were adjusted for.
      - Controls were age-matched from the same kind of mothers.
    src: { page: 62, quote: "Which of the following biases is of major concern when interpreting the study results" }
    status: unverified
    tags: [high-yield]
