  - id: rheum.L07.lesson4
    title: "C3 و C5 والـ MAC"
    hook: "C3 هو المفترق اللي التلات طرق بيوصلوا له، و C5 هو آخر قطعة قبل ما تتبني الماسورة اللي بتفجّر الخلية."
    minutes: 9
    pages: [115, 118]
    topics: [c3-c5, mac]
    goals:
      - "تعدّ activities الـ activated C3 (سؤال كتاب)"
      - "تعرف الـ C3 والـ C5 convertases في كل طريق"
      - "تعدّ تأثيرات الـ C5a وتعرف الـ C5b بيعمل إيه"
      - "تشرح بناء الـ MAC"
    status: unverified
    steps:
      - kind: explain
        page: 115
        title: "تكسير C3"
        quote: "Cleavage of C3 is a critical step in all three pathways. C3 convertases split C3 into two fragments:\n  C3a smaller, fluid-phase, anaphylatoxin.\n  C3b larger, continues the sequential activation of successive components."
        text: |
          تكسير **C3** خطوة أساسية في **التلات طرق**:
          - **C3a**: صغير، fluid phase، ==anaphylatoxin==.
          - **C3b**: كبير، بيكمّل الـ cascade.

          يعني من نفس الجزيء بيطلع **سلاحين**: الـ C3a ينادي الالتهاب في المكان، والـ C3b يقعد على الميكروب يغطّيه ويبني الخطوة الجاية. وعشان التلات طرق بيعدّوا هنا، أي خلل في C3 بيوقّع الكل.
      - kind: reveal
        page: 115
        quote: "Cleavage of C3 is a critical step in all three pathways."
        prompt: "ليه تكسير C3 هو الخطوة الحرجة، ولو C3 ناقص إيه اللي يقع؟"
        answer: |
          لأن التلات **pathways** بيتقابلوا عنده (ص 106)، وكل اللي بعده معتمد عليه: الـ **C3b** هو الـ opsonin، وهو اللي بيعمل الـ **C5 convertase**، وهو اللي بيلف الـ amplification loop.

          التفسير المقبول (مش في الكتاب): لو C3 ناقص، يقع **التلات طرق مرة واحدة**: مفيش opsonization كويسة، ومفيش C5a يجيب neutrophils، ومفيش MAC. فالعيان يجيله **عدوى متكررة شديدة**، زي الطفل اللي عنده نقص factor H وصرف الـ C3 كله.
      - kind: mnemonic
        page: 115
        quote: "Activities of activated C3\n  C3a promotes inflammation.\n  C3b fixation to surfaces leads to opsonization.\n  C3b fixation leads to immune complex clearance.\n  Generation of the C5 Convertase activity."
        word: "IOCC"
        parts:
          - { key: "I", text: "Inflammation: C3a" }
          - { key: "O", text: "Opsonization: C3b fixed to surfaces" }
          - { key: "C", text: "Clearance of immune complexes: C3b" }
          - { key: "C", text: "C5 convertase generation" }
        hook: "**IOCC**: ده جواب سؤال «activities of activated C3» بالترتيب بتاع الكتاب."
      - kind: table
        page: 116
        quote: "C3 and C5 Convertases of Each Pathway\n| Pathway | C3 convertase | C5 convertase |\n|---|---|---|\n| Classical and lectin pathways | C4b with C2a (figure labels) | C4b, C2a with C3b |\n| Alternative pathway | C3b with Bb | C3b, Bb with a second C3b |\nFigure: C3 is cleaved to C3a (released) and C3b; C5 is cleaved to C5a (released) and C5b, which binds the surface."
        title: "الـ convertases"
        columns: [Pathway, C3 convertase, C5 convertase]
        rows:
          - ["Classical, lectin", "C4b2b", "C4b2b3b"]
          - ["Alternative", "C3bBb", "C3bBb3b"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2]]
      - kind: explain
        page: 116
        title: "الـ C5 convertase = C3 convertase + C3b"
        quote: "C3 and C5 Convertases of Each Pathway"
        text: |
          شكل الكتاب في ص 116 بيوريك إن الـ C5 convertase مش إنزيم جديد: هو نفس الـ C3 convertase **ومعاه C3b زيادة**.
          - **Classical و lectin**: C4b2b يقطع C3، وواحد من الـ C3b يقعد جنبه ← **C4b2b3b** = ==C5 convertase==.
          - **Alternative**: C3bBb يقطع C3، و C3b زيادة يقعد ← **C3b2Bb** (C3b,Bb) = C5 convertase.

          ليه C3b زيادة؟ الكتاب في جدول ص 110 بيقول الـ C3b **binds C5 for cleavage**. يعني الـ C3b الزيادة هو **الإيد** اللي بتمسك C5 وتقرّبه للإنزيم يقطعه، زي ما C4b كان بيمسك C2 لـ C1s.
      - kind: explain
        page: 116
        title: "C5: الـ a بيندّه والـ b بيبني"
        quote: "C5b:\n  Binds to the cell surface,\n  Serves as a nucleus for binding the terminal complement components"
        text: |
          - **C5a**: في الـ fluid phase، ==potent anaphylatoxin==. وبيعمل: neutrophil **activation** و **adhesion** و **chemotaxis**، و **monocyte activation** بـ IL-1 و IL-6، و **mast cell degranulation**.
          - **C5b**: بيقعد على السطح وبيبقى **nucleus** للـ terminal components.

          لاحظ إن الـ C5a أقوى anaphylatoxin، أقوى من C3a و C4a. التفسير المقبول (مش في الكتاب): ده آخر نداء في الـ cascade، ومعناه إن الميكروب اتغطّى خلاص والـ MAC بيتبني، فده وقت إن الـ neutrophils تيجي فعلًا وبأعداد كبيرة.
      - kind: explain
        page: 117
        title: "الـ C5a بيعمل خمس حاجات (شكل ص 117)"
        quote: "Biological Effects of C5a"
        text: |
          شكل الكتاب بيحط **C5a** في النص وحواليه خمس أسهم:
          1. **Neutrophil activation**
          2. **Neutrophil adhesion** في الـ endothelium
          3. **Neutrophil emigration and chemotaxis**: يخرج من الوعاء ويمشي ناحية الإشارة
          4. **Monocyte activation**: يطلّع **IL-1** و **IL-6**
          5. **Mast cell degranulation** ← **smooth muscle contraction** و **increased vascular permeability**

          اقراها كقصة واحدة: الـ C5a صغير وذايب، فبيتنشر من مكان العدوى ويعمل **طريق** للـ neutrophil: يصحّيه، يلزّقه في الحيطة، يعدّيه، ويشدّه للمكان. وفي نفس الوقت الـ mast cell يفتح الأوعية عشان الخلايا والـ antibodies تعدّي. وده ليه الـ C5a هو ==potent anaphylatoxin==.
      - kind: check
        page: 117
        quote: "3. neutrophil emigration\nand chemotaxis"
        question: "Which effect of C5a is NOT shown in the lecture's p117 figure?"
        options: ["Forming the pore of the MAC", "Neutrophil chemotaxis", "Monocyte activation with IL-1 and IL-6", "Mast cell degranulation"]
