lessons:
  # ------------------------------------------------------------------
  - id: hb.L16.lesson1
    title: "كتلة في الكبد بالصدفة: متتخضّش"
    hook: "السونار كان للكلية فلقى حاجة في الكبد. أغلبها benign، بس الـ adenoma ليها 4 حالات لازم تتشال."
    minutes: 8
    pages: [311, 313]
    topics: [fll, adenoma]
    goals:
      - "تصنّف الـ benign liver tumours في 3 عائلات"
      - "ترتّب أشيع 3 أورام benign"
      - "تعرف الـ adenoma: مين، ليه، وامتى تتشال"
    status: unverified
    steps:
      - kind: explain
        page: 311
        quote: "Focal liver lesions (FLLs) are abnormal areas of tissue (mass/cyst) within the liver, often discovered incidentally during imaging tests"
        title: "يعني إيه FLL؟"
        text: |
          ==Focal liver lesion (FLL)==: abnormal area of tissue (mass أو cyst) جوه الكبد.

          بتتلقط إزاي؟ غالبًا بالصدفة، في US أو CT أو MRI معمولين لعضو تاني (كلية، مرارة، رحم). ومع كترة الأشعة النهارده، ناس كتير بتلاقي FLL من غير أي أعراض.

          الخبر الحلو: أغلبها ==benign==.

          بس لازم تتقيّم، علشان تستبعد التلاتة الخطيرين:
          - **HCC**: خصوصًا لو الكبد cirrhotic.
          - **Cholangiocarcinoma**.
          - **Metastases**: ورم جاي للكبد من مكان تاني.

          الدروس الجاية هي "قايمة الطيبين" اللي هتحتاج تعرفهم علشان تطمّن المريض.
      - kind: aside
        tone: joke
        page: 311
        quote: "most of these lesions are benign (non-cancerous). However, it is important to evaluate these lesions to rule out/exclude more serious conditions, like liver cancer"
        text: |
          المريض بيدخل عليك ماسك تقرير سونار مكتوب فيه "focal lesion" وهو كاتب وصيته في الطريق. 😄

          ابدأ بالجملة اللي في الكتاب: **most of these lesions are benign**، وبعدين قيّم علشان تستبعد الـ HCC والـ cholangio والـ mets.
      - kind: figure
        page: 311
        quote: "Classification of Benign Hepatic Tumors I) Hepatocellular tumors II) Biliary and cystic lesions III) Mesenchymal tumors"
        title: "شجرة العيلة"
        alt: "A classification tree. Benign hepatic tumors split into three groups. Hepatocellular: hepatocellular adenoma, focal nodular hyperplasia, nodular regenerative hyperplasia. Biliary and cystic: bile duct adenoma, biliary adenofibroma, biliary papillomatosis, simple hepatic cyst, polycystic disease. Mesenchymal: hemangioma, peliosis hepatis, angiomyolipoma."
        caption: "3 عائلات بس: **Hepatocellular** (من خلايا الكبد)، **Biliary & cystic** (من المواسير والأكياس)، **Mesenchymal** (من الأوعية والنسيج الضام). ده سؤال essay صريح."
        svg: |
          <svg viewBox="0 0 330 470" xmlns="http://www.w3.org/2000/svg">
            <rect x="60" y="6" width="210" height="36" rx="10" class="fg-ink"/>
            <text x="165" y="29" text-anchor="middle" class="t-b">Benign hepatic tumors</text>
            <path d="M20 42V432" class="fg-thin"/>
            <path d="M20 74H34M20 194H34M20 352H34" class="fg-arrow"/>
            <rect x="34" y="58" width="290" height="32" rx="8" class="fg-good"/>
            <text x="46" y="79" class="t-b">I. Hepatocellular</text>
            <text x="50" y="112" class="t-sm">Hepatocellular adenoma</text>
            <text x="50" y="130" class="t-sm">Focal nodular hyperplasia (FNH)</text>
            <text x="50" y="148" class="t-sm">Nodular regenerative hyperplasia (NRH)</text>
            <rect x="34" y="178" width="290" height="32" rx="8" class="fg-acc"/>
            <text x="46" y="199" class="t-b">II. Biliary and cystic</text>
            <text x="50" y="232" class="t-sm">Bile duct adenoma</text>
            <text x="50" y="250" class="t-sm">Biliary adenofibroma</text>
            <text x="50" y="268" class="t-sm">Biliary papillomatosis</text>
            <text x="50" y="286" class="t-sm">Simple hepatic cyst</text>
            <text x="50" y="304" class="t-sm">Polycystic disease</text>
            <rect x="34" y="336" width="290" height="32" rx="8" class="fg-bad"/>
            <text x="46" y="357" class="t-b">III. Mesenchymal</text>
            <text x="50" y="390" class="t-sm">Hemangioma (cavernous)</text>
            <text x="50" y="408" class="t-sm">Peliosis hepatis</text>
            <text x="50" y="426" class="t-sm">Angiomyolipoma</text>
            <text x="165" y="460" text-anchor="middle" class="t-sm t-mut">Commonest: hemangioma, then FNH, then adenoma</text>
          </svg>
      - kind: sort
        page: 311
        quote: "Classification of Benign Hepatic Tumors I) Hepatocellular tumors II) Biliary and cystic lesions III) Mesenchymal tumors"
        prompt: "حط كل ورم في عيلته:"
        bins: ["Hepatocellular", "Biliary and cystic", "Mesenchymal"]
        cards:
          - { text: "Adenoma", bin: 0 }
          - { text: "FNH", bin: 0 }
          - { text: "NRH", bin: 0 }
          - { text: "Biliary papillomatosis", bin: 1 }
          - { text: "Simple hepatic cyst", bin: 1 }
          - { text: "Polycystic disease", bin: 1 }
          - { text: "Hemangioma", bin: 2 }
          - { text: "Peliosis hepatis", bin: 2 }
          - { text: "Angiomyolipoma", bin: 2 }
        why: "الـ hepatocellular التلاتة كلهم من خلايا الكبد نفسها: adenoma و FNH و NRH. الـ biliary فيها **bile/biliary/cyst**. والـ mesenchymal دم ودهون وعضل: hemangioma و peliosis و angiomyolipoma."
      - kind: order
        page: 311
        quote: "It is the 3rd most common benign hepatic tumor, women are affected more than men, usually within childbearing years, usually single."
        prompt: "رتّب من الأشيع للأقل:"
        steps:
          - "Hemangioma"
          - "Focal nodular hyperplasia"
          - "Hepatocellular adenoma"
        why: "الكتاب: hemangioma **first most common** (في 5–10% من الناس)، FNH 2nd، adenoma 3rd. احفظها **H-F-A**: زي «هفّة» الواحد لما يتخض من التقرير."
      - kind: explain
        page: 312
        quote: "Malignant transformation in up to 8% of all patients & up to 40-50% in men"
        title: "Hepatocellular adenoma: البطاقة"
        text: |
          الـ **hepatocellular adenoma** ورم حقيقي من خلايا الكبد، وهو اللي ليه أخطر مضاعفات في الكتاب: نزيف و malignant transformation.

          البطاقة:
          - الترتيب: 3rd most common benign hepatic tumor.
          - مين: women أكتر من men، غالبًا في سن الإنجاب (سن حبوب منع الحمل)، وغالبًا **single**.

          **Clinical picture**، من الأهدى للأخطر:
          - **Asymptomatic**.
          - **Pressure**: على اللي جنبه (blood vessel، bile duct).
          - **Rt. hypochondrial pain**: من شد الـ capsule.
          - **Rupture**: diffuse abdominal pain + ==intraperitoneal hemorrhage==. ده الطوارئ.
          - ==Malignant transformation==: لحد 8% من كل المرضى، ولحد 40–50% في الرجالة. علشان كده الراجل بالذات بنشيله.

          **Lab**: normal (transaminases، ALP، AFP)، إلا لو بيضغط على الـ bile ducts ويعمل **obstructive jaundice**. يعني التحاليل النضيفة مش بتطمّنك.
      - kind: explain
        page: 312
        quote: "Risk factors for hepatocellular adenomas include: Long standing intake of OCP (up to 90% of cases had history of long use of OCP)"
        title: "جاي منين، وبنشوفه إزاي"
        text: |
          **Risk factors**: لاحظ إن 2 من 3 هرمونات، وده مفتاح العلاج.
          - ==Long standing OCP==: لحد 90% من الحالات كان عندهم history طويل.
          - **Long standing anabolic steroids**: الهرمون التاني (لاعيبة الجيم).
          - **Glycogen storage diseases**.

          **Diagnosis**، خطوة بخطوة:
          - بيتلقط: في routine abdominal US (رخيص و sensitive).
          - **بيتفرّق عن الـ FNH**: بـ ==contrast enhanced US أو MRI==. ده أهم سؤال، لأن الـ adenoma ليها indications أوسع للجراحة (منها الرجالة، علشان الـ malignant transformation)، والـ FNH غالبًا conservative إلا لو symptomatic أو كبيرة أو pedunculated (ص 314).
          - التأكيد: liver biopsy.
      - kind: figure
        page: 313
        quote: "Diagnosis: Imaging (US, Contrast enhanced US, MRI) & Biopsy (as in hepatic adenomas)."
        title: "كتلة على السونار: adenoma ولا FNH؟"
        image: { file: hb/L16-fnh-us.webp, book: true }
        alt: "An uncaptioned ultrasound from the book, placed between its adenoma and FNH sections: a rounded, well-defined, slightly brighter focal lesion inside the liver, with two caliper marks across its width."
        caption: "صورة سونار من غير تعليق، الكتاب حاططها بين جزء الـ adenoma وجزء الـ FNH: كتلة focal مدوّرة وحدودها واضحة، والعلامتين (+) قياس عرضها. ده بالظبط اللي الـ ==routine abdominal US== بيلاقيه، ومن الصورة دي لوحدها مش هتعرف هي إيه. علشان كده الخطوة الجاية ==contrast enhanced US أو MRI== (ص 312)."
      - kind: reveal
        page: 312
        quote: "Stop risk factors as: hormones, anabolic steroids."
        prompt: "مريضة عندها adenoma وبتاخد حبوب منع حمل من 10 سنين. إيه أول حاجة تعملها قبل ما تفكر في أي جراحة؟"
        answer: |
          **Stop risk factors**: وقّف الـ **hormones (OCP)** والـ **anabolic steroids**. دي أول سطر في العلاج في الكتاب.

          المنطق: الـ adenoma ورم حقيقي بيتغذّى على الهرمونات، ولو شلت الوقود ممكن يقف أو يصغر. (ده من الـ physiology المعروفة، مش مكتوب في الكتاب.)
      - kind: mnemonic
        page: 312
        quote: "Symptomatic, large more than 5 cm in diameter (liable to rupture & bleeding), pedunculated (torsion)"
        word: "SLaP M"
        parts:
          - { key: "S", text: "Symptomatic" }
          - { key: "La", text: "Large: more than 5 cm (liable to rupture and bleeding)" }
          - { key: "P", text: "Pedunculated (torsion)" }
          - { key: "M", text: "Men (high rate of malignant transformation)" }
        hook: |
          الـ adenoma اللي تستاهل قلم (SLaP) بالمشرط: لو عاملة أعراض، أو كبيرة > 5 cm، أو ليها رجل (pedunculated)، أو المريض راجل (Man).

          ولو بتنزف: **TAE** (trans-arterial embolization).
      - kind: check
        page: 312
        quote: "Stop risk factors as: hormones, anabolic steroids. Surgical excision if: Symptomatic, large more than 5 cm in diameter"
        question: "A 26-year-old woman on the pill has an incidental 3 cm single hepatic adenoma. She has no symptoms and it is not pedunculated. Best plan per the book?"
        options:
          - "Stop the pill and follow up"
          - "Surgical excision now"
          - "Trans-arterial embolization"
          - "Nothing: adenomas never change"
        answer: 0
        why:
          - "صح: مفيش ولا indication من **SLaP M** (مش symptomatic، أقل من 5 cm، مش pedunculated، ست). فالخطوة الأولى **stop risk factors** والمتابعة."
          - "الجراحة لو SLaP M، ومفيش واحدة منهم هنا."
          - "الـ TAE للـ **bleeding** adenoma."
          - "غلط: ممكن تنزف أو تقلب malignant (لحد 8%)."
      - kind: aside
        tone: exam
        page: 312
        quote: "Stop risk factors as: hormones, anabolic steroids. Surgical excision if: Symptomatic, large more than 5 cm in diameter (liable to rupture & bleeding)"
        text: |
          سؤال المحاضرة: **"Mention the treatment of hepatic adenoma"**. الإجابة في 3 سطور:
          - **Stop risk factors** (hormones، anabolic steroids).
          - **Surgical excision** لو: symptomatic، > 5 cm، pedunculated، male.
          - **Bleeding**: TAE.
      - kind: try
        items: [hb.L16.003, hb.L16.009, hb.L16.012, hb.L16.006]
    recap:
      - "FLL غالبًا incidental وأغلبها benign، بس استبعد HCC و cholangio و mets."
      - "3 عائلات: hepatocellular، biliary & cystic، mesenchymal."
      - "الأشيع: hemangioma ثم FNH ثم adenoma."
      - "Adenoma: ست في سن الإنجاب، single، OCP في 90%، labs normal، malignant لحد 8% (40–50% في الرجالة)."
      - "العلاج: وقّف الهرمونات، **SLaP M** = excision، والنزيف = TAE."
    practice: [hb.L16.001, hb.L16.002, hb.L16.003, hb.L16.004, hb.L16.005, hb.L16.006, hb.L16.007, hb.L16.008, hb.L16.009, hb.L16.010, hb.L16.011, hb.L16.012, hb.L16.013, hb.L16.014, hb.L16.015, hb.L16.016, hb.L16.041, hb.L16.042, hb.L16.043]

  # ------------------------------------------------------------------
  - id: hb.L16.lesson2
    title: "FNH وNRH: أورام بتيجي من مواسير بايظة"
    hook: "الـ FNH مش بتخاف من حبوب منع الحمل، والـ NRH بيعمل portal hypertension من غير cirrhosis. الاتنين بيبدأوا من مشكلة في الأوعية."
    minutes: 8
    pages: [313, 315]
    topics: [fnh, nrh]
    goals:
      - "تفرّق الـ FNH عن الـ adenoma في جدول"
      - "تشرح ليه الـ FNH مش contraindication للحمل والـ OCP"
      - "تعرف أسباب الـ NRH وشكله تحت الميكروسكوب"
    status: unverified
    steps:
      - kind: explain
        page: 313
        title: "FNH: البطاقة"
        quote: "FNH is thought to be a hyperplastic response to an artery to portal vein shunt."
        text: |
          الـ **focal nodular hyperplasia (FNH)**: اسمها بيشرحها. **Hyperplasia** يعني خلايا عادية كترت، مش خلايا غريبة.

          البطاقة:
          - الترتيب: 2nd most frequent benign hepatic tumor.
          - الحجم والعدد (الكتاب): usually multiple، أقل من 2 cm.
          - الهرمونات: ==not a contraindication== للـ hormonal therapy أو pregnancy.

          **Pathogenesis**: ==hyperplastic response to an artery to portal vein shunt==. يعني فيه شريان بيصب غلط، فالكبد حواليه بياخد دم زيادة ويكبر.

          **Histology**، وكل حاجة فيها بتيجي من الـ shunt:
          - **Normal hepatocytes**: علشان كده مش ورم خبيث.
          - **Fibrous tissue** فيها **large arteries** و proliferating bile ducts.
          - ==Central scar== في لحد 60%: مكان الشريان الغلط في النص.
          - **Background liver normal**: مش cirrhosis.

          **Diagnosis**: imaging (US، contrast enhanced US، MRI) و biopsy، زي الـ adenoma.
      - kind: update
        page: 313
        quote: "Lesions usually multiple, less than 2cm in diameter, FNH is not a contraindication to hormonal therapy or pregnancy."
        ref: "EASL CPG on benign liver tumours 2016"
        text: |
          الكتاب كاتب إن الـ FNH **usually multiple**. المراجع الحالية: الـ FNH غالبًا **solitary**، ومتعددة في حوالي 20% بس.

          في الامتحان اكتب كلام الكتاب.
      - kind: reveal
        page: 313
        quote: "Lesions usually multiple, less than 2cm in diameter, FNH is not a contraindication to hormonal therapy or pregnancy."
        prompt: "ليه الـ adenoma لازم نوقف معاها الـ OCP، والـ FNH لأ؟"
        answer: |
          من كلام الكتاب نفسه:

          - الـ **adenoma** ورم حقيقي، و 90% من المرضى كانوا على **OCP** لفترة طويلة، فالهرمون وقود.
          - الـ **FNH** في الكتاب **2nd most frequent benign hepatic tumor**، وأصلها **hyperplastic response** لـ **shunt** في الأوعية. صحيح الكتاب في L08 حاططها مع الـ **contraceptive steroids**، بس هي **static** ونادرًا ما بتنزف أو تقلب malignant، فالكتاب بيقول صراحة إنها **مش contraindication** للهرمونات ولا للحمل.
      - kind: aside
        tone: analogy
        page: 313
        quote: "FNH is thought to be a hyperplastic response to an artery to portal vein shunt."
        text: |
          الـ **adenoma** زي مستأجر جديد بيتغذى على الهرمونات وممكن يعمل مشاكل (نزيف، malignant).

          الـ **FNH** زي الزرع اللي بيطلع حوالين ماسورة بتهرّب (artery-to-portal vein shunt): مش غريب عن البيت، ده الكبد العادي (normal hepatocytes) بيكبر حوالين المشكلة، وفي النص ندبة (central scar) مكان الماسورة.
      - kind: figure
        page: 313
        quote: "fibrous tissue containing large arteries & proliferating bile ducts with central scar in upto 60% of cases. The background liver is normal."
        title: "Adenoma ضد FNH"
        alt: "Two liver sketches. Top: hepatic adenoma, a single round lesion with small dark spots of bleeding, labelled single, women on the pill, may bleed or rupture, malignant change up to 8 percent and 40 to 50 percent in men. Bottom: focal nodular hyperplasia, a lesion with a central star-shaped scar from which fibrous bands carry large arteries outward, in a normal background liver, labelled central scar in up to 60 percent, book says usually multiple and under 2 cm, conservative."
        caption: "فوق: **adenoma**: كتلة واحدة ممكن تنزف. تحت: **FNH**: ندبة في النص وأشرطة fibrous فيها **large arteries** و bile ducts، والكبد حواليها **normal**."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="18" text-anchor="middle" class="t-b t-lg t-bad">Hepatic adenoma</text>
            <path d="M14 70Q30 26 160 28Q318 30 318 78Q304 126 226 136Q130 162 46 146Q8 124 14 70Z" class="fg-box"/>
            <circle cx="120" cy="88" r="36" class="fg-bad"/>
