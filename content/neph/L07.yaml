  # ---------- p150: UTI and stones ----------
  - id: neph.L07.035
    kind: card
    topic: adpkd-renal
    front: Why may UTI incidence in ADPKD be overestimated?
    back: Sterile pyuria is common in these patients.
    src: { page: 150, quote: "Urinary tract infection (UTI) is common in ADPKD, but its incidence may have been overestimated because sterile pyuria is common in these patients. UTI presents as cystitis, acute pyelonephritis, cyst infection, and perinephric abscesses. As in the general population, women are affected more frequently than men. Most infections are caused by Esch-erichia coli, Klebsiella and Proteus species, and other Enterobacteriaceae." }
    status: unverified
  - id: neph.L07.036
    kind: card
    topic: adpkd-renal
    front: Which organisms cause most UTIs in ADPKD, and what is the usual route?
    back: E. coli, Klebsiella, Proteus and other Enterobacteriaceae. The route is usually retrograde from the bladder, so cystitis must be treated promptly.
    src: { page: 150, quote: "Most infections are caused by Esch-erichia coli, Klebsiella and Proteus species, and other Enterobacteriaceae. The route of infection in acute pyelonephritis and cyst infection is usually retrograde from the bladder; therefore cystitis should be promptly treated to prevent complicated infections." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.037
    kind: cloze
    topic: adpkd-renal
    text: "Stones occur in about {{c1::20%}} of ADPKD patients, mostly {{c2::uric acid}}, calcium oxalate or both."
    src: { page: 150, quote: "Nephrolithiasis Renal stone disease occurs in about 20% of patients with ADPKD. Most stones are composed of uric acid, calcium oxalate, or both. Uric acid stones are more common in ADPKD than in stone formers without tubular ectasia, found in 15% of patients with ADPKD. CT urography has replaced IV urography in many centers; it is more sensitive in detect-ing small or radiolucent stones and for differentiating stones from tumor, clot, and cyst wall or parenchymal calcification. Dual-energy CT is increasingly used to distinguish between calcium and uric acid stones." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.038
    kind: card
    topic: adpkd-renal
    front: Which imaging has replaced IV urography for stones in ADPKD, and why?
    back: CT urography. It is more sensitive for small or radiolucent stones and separates stones from tumor, clot and cyst wall or parenchymal calcification. Dual-energy CT can tell calcium from uric acid stones.
    src: { page: 150, quote: "Nephrolithiasis Renal stone disease occurs in about 20% of patients with ADPKD. Most stones are composed of uric acid, calcium oxalate, or both. Uric acid stones are more common in ADPKD than in stone formers without tubular ectasia, found in 15% of patients with ADPKD. CT urography has replaced IV urography in many centers; it is more sensitive in detect-ing small or radiolucent stones and for differentiating stones from tumor, clot, and cyst wall or parenchymal calcification. Dual-energy CT is increasingly used to distinguish between calcium and uric acid stones." }
    status: unverified
  # ---------- p151-153: extrarenal ----------
  - id: neph.L07.039
    kind: card
    topic: adpkd-extrarenal
    front: What is the most common extrarenal manifestation of ADPKD?
    back: Polycystic liver disease (PLD), seen with both PKD1 and PKD2.
    src: { page: 151, quote: "Polycystic Liver Disease PLD is the most common extrarenal manifestation of ADPKD. PLD is associated with both PKD1 and PKD2 genotypes. In contrast to the Hepatic cysts are exceedingly rare in children with ADPKD. Their frequency increases with age and may have been underestimated by age than men. Women who have multiple pregnancies or who have used oral contraceptives (OCs) or estrogen replacement therapy (ERT) in the postmenopausal period may have worse disease. After menopause Typically, PLD is asymptomatic, but reported symptoms have become more frequent as the life span of patients with ADPKD is prolonged with dialysis and transplantation. Symptoms result from mass effect or from complications related to the cysts themselves. Symptoms include dyspnea, orthopnea, early satiety, gastroesophageal reflux, mechanical low back pain, uterine prolapse, and even rib fracture. Other complications caused directly by mass effect include hepatic venous outflow obstruction, IVC compression, portal vein compression, and bile duct compression presenting as obstructive jaundice. Hepatic venous outflow." }
    status: unverified
    tags: [high-yield]
