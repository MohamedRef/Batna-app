    hook: "بعد ما شلت البوليب: 10 سنين ولا 3 ولا شهرين؟ وأبوه جاله سرطان في الـ 44: يبدأ إمتى؟"
    minutes: 8
    pages: [203, 204]
    topics: [surveillance]
    goals:
