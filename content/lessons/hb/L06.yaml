  - id: hb.L06.lesson3
    title: "نقيس الدهون والتليف: FIB-4 والـ FibroScan"
    hook: "أربع أرقام في معادلة واحدة بتقولك مين يحتاج FibroScan، وورقة FibroScan فيها رقم لو عدّى 30% ارميها."
    minutes: 10
    pages: [101, 102]
    topics: [steatosis, fibrosis]
    goals:
      - "تعرف أدوات تقييم الـ steatosis الأربعة"
      - "تعدّ الـ predictors of fibrosis وتفهم ليه الستات قبل الـ menopause أحسن"
      - "تحسب FIB-4 وتقرا ورقة FibroScan صح"
    status: unverified
    steps:
      - kind: explain
        page: 101
        title: "بنفحص إيه؟ الدهون والتليف"
        text: |
          عندنا سؤالين منفصلين: فيه دهون قد إيه؟ وفيه تليف قد إيه؟ الدرس ده بيبدأ بالدهون (steatosis assessment):

          - **US**: الـ ==preferred 1st line== imaging. متاح ورخيص، بس بيقولك «فيه دهون» من غير رقم دقيق.
          - **MRS** (Magnetic Resonance Spectroscopy): quantitative estimation of liver fat. بيدّيك نسبة الدهون بالرقم.
          - **FLI** (Fatty Liver Index): score من TG و BMI و waist circumference و GGT. مش محتاج جهاز، قياسات وتحاليل بس.
          - **NLS** (NAFLD Liver Score): score من MS (metabolic syndrome) و T2DM و fasting serum insulin و aminotransferases.

          وبعد الدهون، الكلام كله على الـ fibrosis، لأنها اللي بتحدد الـ prognosis.
      - kind: match
        page: 101
        prompt: "وصّل كل أداة بوصفها:"
        pairs:
          - ["Ultrasound", "Preferred first-line imaging"]
          - ["MRS", "Quantitative liver fat"]
          - ["FLI", "TG, BMI, waist, GGT"]
          - ["NLS", "MS, T2DM, fasting insulin, aminotransferases"]
        why: "الـ US أول خطوة، والـ MRS بيدّي رقم، والـ FLI والـ NLS scores من labs وقياسات."
      - kind: table
        page: 101
        title: "Predictors of progression to fibrosis in MASH"
        columns: ["Factor", "Detail"]
        rows:
          - ["Sex", "Men and post-menopausal women at higher risk"]
          - ["Age", "Older age, more severe fibrosis"]
          - ["Diabetes", "Its emergence parallels fibrosis progression"]
          - ["BMI", "Rise or fall goes with progression or resolution"]
          - ["Inflammation", "Degree linked to advanced fibrosis"]
          - ["AST/ALT ratio", "Normal ratio is < 1"]
          - ["Hepatic iron", "Iron in hepatocytes linked to mild NAFLD"]
          - ["PNPLA3, TM6SF2", "Genes for proteins that make and break down fat"]
        hide: [[0, 1], [2, 1], [5, 1], [7, 0]]
      - kind: reveal
        page: 101
        prompt: "ليه الست قبل الـ menopause خطرها أقل من الراجل؟"
        answer: |
          الكتاب: **Estrogen inhibits stellate cell activation and fibrogenesis**.

          يعني الـ estrogen بيمسك **أمين المخزن** (HSC) ويقوله «اقعد مكانك». بعد الـ menopause الـ estrogen يقل، فالحماية دي تروح والخطر يبقى زي الرجالة.
      - kind: sort
        page: 101
        prompt: "مين يزوّد خطر الـ fibrosis ومين يقلله؟"
        bins: ["Higher risk", "Lower risk"]
        cards:
          - { text: "Male sex", bin: 0 }
          - { text: "Post-menopausal woman", bin: 0 }
          - { text: "Older age", bin: 0 }
          - { text: "New-onset diabetes", bin: 0 }
          - { text: "PNPLA3 polymorphism", bin: 0 }
          - { text: "Pre-menopausal woman", bin: 1 }
          - { text: "Falling BMI", bin: 1 }
        why: "الـ estrogen بيحمي قبل الـ menopause، ونزول الـ BMI مرتبط بـ **resolution** of fibrosis. الباقي كله في جدول الكتاب بيزوّد الخطر."
      - kind: explain
        page: 102
        title: "FIB-4: أربع أرقام موجودة في أي ملف"
        text: |
          **FIB-4** معادلة من 4 حاجات موجودة في أي ملف: السن والـ AST والـ ALT والـ platelets. مش محتاج جهاز ولا تحليل خاص.

          ==FIB-4 = (age × AST) ÷ (platelet count × √ALT)==

          والـ bands في الكتاب (ص 102):

          - **Low risk**: أقل من 1.3
          - **Intermediate**: من 1.3 لـ 3.25
          - **High risk**: أكتر من 3.25

          ميزته الكبيرة إنه بيفرز: اللي تحت 1.3 غالبًا مش محتاج FibroScan دلوقتي.
      - kind: figure
        page: 102
        title: "مسطرة الـ FIB-4"
        alt: "The FIB-4 formula, age times AST over platelet count times the square root of ALT, above a three-band scale: below 1.3 low risk, 1.3 to 3.25 intermediate risk, above 3.25 high risk."
        caption: "فوق في البسط اللي بيزيد مع التليف (السن والـ AST)، وتحت في المقام اللي بيقل (الـ platelets). والحد التحتاني **1.3** ثابت في كل الـ pathways."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="22" text-anchor="middle" class="t-b">FIB-4 =</text>
            <text x="165" y="50" text-anchor="middle" class="t-lg t-b">Age × AST</text>
            <path d="M60 60h210" class="fg-ink"/>
            <text x="165" y="84" text-anchor="middle" class="t-lg t-b">Platelets × √ALT</text>
            <rect x="10" y="118" width="96" height="56" rx="6" class="fg-good"/>
            <rect x="112" y="118" width="106" height="56" rx="6" class="fg-acc"/>
            <rect x="224" y="118" width="96" height="56" rx="6" class="fg-bad"/>
            <text x="58" y="142" text-anchor="middle" class="t-b t-good">&lt; 1.3</text>
            <text x="58" y="162" text-anchor="middle" class="t-sm">low risk</text>
            <text x="165" y="142" text-anchor="middle" class="t-b">1.3–3.25</text>
            <text x="165" y="162" text-anchor="middle" class="t-sm">intermediate</text>
            <text x="272" y="142" text-anchor="middle" class="t-b t-bad">&gt; 3.25</text>
            <text x="272" y="162" text-anchor="middle" class="t-sm">high risk</text>
            <text x="10" y="204" class="t-sm t-mut">Book p102 bands. ADA 2025 (p104) uses 2.67</text>
            <text x="10" y="222" class="t-sm t-mut">as its upper cut-off; EASL 2021 uses 1.30 only.</text>
          </svg>
      - kind: reveal
        page: 102
        prompt: "ليه السن والـ AST فوق، والـ platelets تحت؟"
        answer: |
          كل حاجة فوق **بتزيد** مع التليف، وكل حاجة تحت **بتقل**:

          - **Age:** التليف بيتراكم مع السنين (والكتاب: older age = more severe fibrosis).
          - **AST:** مع تقدم التليف الـ AST بيعلى أكتر من الـ ALT، فالـ AST/ALT ratio يعدّي 1 (الطبيعي **< 1**).
          - **Platelets:** بتقل مع الـ portal hypertension (splenic sequestration) ومع قلة الـ thrombopoietin من الكبد.

          (الـ AST/ALT والـ age من جدول الكتاب؛ شرح الـ platelets physiology مقبول.)
      - kind: check
        page: 102
        question: "Age 50, AST 40, ALT 25, platelets 200 (×10⁹/L). FIB-4 and band?"
        options:
          - "2.0, intermediate risk"
          - "0.8, low risk"
          - "0.4, low risk"
          - "1.0, low risk"
        answer: 0
        why:
          - "صح: (50 × 40) ÷ (200 × √25) = 2000 ÷ (200 × 5) = 2000 ÷ 1000 = **2.0**، بين 1.3 و 3.25."
          - "غلط في الحساب: راجع إن √25 = 5."
          - "ده لو نسيت الـ √ واستعملت ALT نفسه: 2000 ÷ (200 × 25) = 0.4. الصح √25 = 5، فـ 2000 ÷ 1000 = 2.0."
          - "2000 ÷ 1000 = 2.0 مش 1.0؛ راجع الضرب."
      - kind: explain
        page: 102
        title: "اقرا ورقة الـ FibroScan"
        text: |
          الـ FibroScan بيقيس حاجتين في نفس القعدة، كل واحدة بوحدتها:

          - ==E (kPa)==: liver stiffness. الكبد المتليف أنشف، فالرقم الأعلى = fibrosis أكتر.
          - ==CAP (dB/m)==: الدهون بتضعّف الموجة، فده بيقيس الـ steatosis.

          وعلشان تثق في الرقم:

          - **Median**: بيتحسب من 10 valid measurements، مش قراءة واحدة.
          - **IQR**: انتشار نص القراءات اللي في النص. لازم يبقى صغير، يعني القراءات قريبة من بعض.
          - ==IQR/median > 30%==: يبقى no reliability، مهما كان الرقم حلو أو وحش.
      - kind: figure
        page: 102
        title: "ورقة FibroScan حقيقية"
        image: { file: hb/L06-fibroscan.webp, book: true }
        alt: "Book figure of a FibroScan screen. Top panel E in kPa: median 36.8, IQR 4.7, IQR over median 13 percent. Bottom panel CAP in dB per metre: median 239, IQR 43, IQR over median 18 percent."
        caption: "اقراها بالترتيب: **IQR/med** الأول (13% و 18%، الاتنين تحت 30% يعني reliable)، وبعدين الـ median: الـ E عالي جدًا، 36.8 kPa، يعني أعلى بكتير من حد الـ 8 kPa اللي الكتاب بيستخدمه في ص 104 (الصفحة دي نفسها مش بتدي cut-off للـ fibrosis stage). والـ CAP، اللي بيقيس الدهون، طالع 239 dB/m."
      - kind: aside
        tone: analogy
        page: 102
        text: |
          الـ IQR/median زي إنك تسأل **10 أشخاص** في الشارع على عنوان: لو قالوا كلام قريب من بعض تصدّق. لو كل واحد قالك حاجة (> 30%)، يبقى ماتعتمدش على أي حد فيهم وتعيد السؤال.
      - kind: check
        page: 102
        question: "A FibroScan shows E = 12 kPa with IQR/median 35%. How do you read it?"
        options:
          - "Not reliable: IQR/median is above 30%"
          - "Reliable: advanced fibrosis"
          - "Reliable: low risk"
          - "It measures steatosis grade"
        answer: 0
        why:
          - "صح: **IQR/median > 30% implies no reliability**، مهما كان الرقم."
          - "الرقم كبير، بس القراءات مش متسقة، فماينفعش تبني عليه."
          - "12 kPa مش واطي، والقراءة أصلًا مش reliable."
          - "الـ steatosis بتتقاس بالـ **CAP (dB/m)** مش الـ E (kPa)."
      - kind: try
        items: [hb.L06.025, hb.L06.027, hb.L06.029, hb.L06.032, hb.L06.034]
    recap:
