      - kind: update
        page: 57
        quote: "During banding, a small amount of oozing is observed that resolves with further band placement. What is the next step in treating this patient?"
        text: |
          **سؤال الكتاب رقم 2 (ص 57)**: varices صغيرة بقت كبيرة، واتربطت، وحصل oozing بسيط وقف مع رباط زيادة. الخطوة الجاية إيه؟

          الكتاب ما بيقولش كل قد إيه نكرر الرباط. الجايدلاين: الـ EBL **يتكرر كل 2–8 أسابيع لحد الـ eradication**، فالإجابة **endoscopy in 2 weeks**. والـ oozing اللي وقف أثناء الرباط مش acute variceal bleeding، فلا antibiotics ولا حجز.

          ده بيربط بكلام ص 56: الـ EBL محتاج **sessions** لحد الـ eradication، وعدد الـ sessions أقل من الـ sclerotherapy.
        ref: "Garcia-Tsao et al., AASLD practice guidance on portal hypertensive bleeding, Hepatology 2017"
      - kind: update
        page: 59
        quote: "Which of the following treatment options would have the highest potential to worsen the patient's ascites and esophageal varices? A. Balloon-occluded retrograde transvenous obliteration (BRTO)"
        text: |
          **سؤال الكتاب رقم 5 (ص 58–59)**: نزيف من fundal varices، و ascites كتير، و **splenorenal shunt** كبير. أنهي علاج ممكن **يزوّد** الـ ascites والـ oesophageal varices؟

          الـ BRTO مش مشروح في الكتاب. الفكرة (من الجايدلاين): الـ shunt الكبير ده طريق تصريف طبيعي بيخفف الـ portal pressure. الـ **balloon-occluded retrograde transvenous obliteration (BRTO)** بيسدّه علشان يقفل الـ gastric varices، فالدم يرجع على الـ portal system والضغط **يعلى**، فالـ ascites والـ oesophageal varices يسوءوا. فالإجابة **BRTO**.

          والعكس تمامًا: الـ **TIPS** والـ portacaval shunt بيصرّفوا الضغط فبيحسّنوا الاتنين.
        ref: "Garcia-Tsao et al., AASLD practice guidance, Hepatology 2017; de Franchis et al., Baveno VII, J Hepatol 2022"
      - kind: aside
        tone: exam
        page: 60
        quote: "Which of the following features correlates the least with the patient's risk of variceal hemorrhage over the next two years? A. Number of varices B. Size of varices C. Presence of bleeding stigmata D. Elevated hepatic venous pressure gradient > 12 mm Hg E. Child-Pugh class C cirrhosis"
        text: |
          **سؤال الكتاب رقم 8 (ص 60)**: مريض Child C عنده تلات أعمدة varices كبيرة بـ red wale signs. أنهي حاجة **أقل** ارتباط بخطر النزيف في السنتين الجايين؟

          الكتاب ما ادّاش مفتاح، بس الإجابة طالعة من الدرس ده نفسه:
          - الـ **size**: الكبيرة بتنزف أكتر (التاريخ الطبيعي، ص 44).
          - الـ **red colour signs**: علامة إن الجدار رفيع وعلى وشك ينفجر.
          - الـ **HVPG > 12 mmHg**: ده الرقم اللي فوقه الـ varices ممكن تنفجر (ص 43).
          - الـ **Child C**: الكتاب بيقول نعالج الـ small varices لو فيه red signs و/أو Child C (ص 45).

          يعني الأربعة دول predictors، والـ ==number of varices== هو اللي مالوش مكان في أي قايمة. التفسير المقبول (مش في الكتاب): الوريد بينفجر لما الشد على جداره يزيد، والشد بيكبر مع قُطر الوريد وضغطه ورقّة جداره، مش مع عدد الأعمدة.
      - kind: aside
        tone: exam
        page: 60
        quote: "It shows two columns of small varices in the distal esophagus. What will you recommend next? A. Nadolol B. Endoscopic variceal ligation (EVL) C. Transjugular intrahepatic portosystemic shunt D. Repeat endoscopy in 1 year E. Repeat endoscopy in 3 years"
        text: |
          **سؤال الكتاب رقم 9 (ص 60)**: راجل 79 سنة، compensated، نبضه 64 وضغطه 120/70، والمنظار فيه **small varices** من غير red signs.

          امشي بـ Conclusion بتاع ص 45:
          - الـ small varices **could be treated**، خصوصًا لو فيه ==red colour signs== و/أو ==Child C==، وهو ماعندوش ولا واحدة.
          - والباقيين «could be treated… but further studies are needed».
          - الـ EVL للـ moderate أو large بس، والـ TIPS مالوش دور في الـ primary prophylaxis.

          فإجابة الكتاب الأقرب: **متابعة بمنظار** (repeat endoscopy in 1 year)، لأن الـ varices الصغيرة ممكن تكبر والكبد لسه مريض. والـ 3 years دي بتاعة **cirrhosis من غير varices** (ص 45، 2–3 years).

          ولو اتسألت عن الجايدلاين الأحدث: Baveno VII بيدّي NSBB (carvedilol) لأي compensated عنده CSPH، والـ small varices معناها CSPH. اكتب إجابة الكتاب وقول الفرق ده لو السؤال essay.
      - kind: update
        page: 64
        quote: "Which of the following would be the least effective treatment for the cause of her anemia? A. Endoscopic coagulation with a heater probe B. Antrectomy C. Argon plasma coagulation D. Endoscopic radiofrequency ablation E. Transjugular intrahepatic portosystemic shunt"
        text: |
          **سؤال الكتاب رقم 15 (ص 64)**: خطوط حمرا مسطّحة طالعة من الـ pylorus في الـ antrum = ==gastric antral vascular ectasia (GAVE)==، «watermelon stomach». ده مش PHG.

          الكتاب ما بيشرحش الـ GAVE ولا بيدّي مفتاح. الجايدلاين: الـ GAVE **مش ناتجة عن الـ portal pressure**، فالـ **TIPS** (وكمان الـ beta-blockers) ما بيفيدوش، وعلاجها endoscopic thermal therapy (APC، heater probe، radiofrequency ablation)، والـ antrectomy للحالات العنيدة. فالإجابة **TIPS**.

          الفرق اللي يتسأل: الـ PHG في الـ fundus و body، mosaic «snakeskin»، وبتتحسن لما الضغط ينزل. الـ GAVE في الـ antrum، خطوط أو بقع حمرا، والضغط مالوش دعوة.
        ref: "Garcia-Tsao et al., AASLD practice guidance on portal hypertensive bleeding, Hepatology 2017"
