      - kind: sort
        page: 41
        quote: "In general, higher efficacy approaches have greater likelihood of achieving glycaemic goals. Efficacy for glucose lowering:\n  Very High: Dulaglutide (high dose), Semaglutide, Tirzepatide; Insulin; Combination Oral, Combination Injectable (GLP-1 RA/Insulin)\n  High: GLP-1 RA (not listed above), Metformin, SGLT2i, Sulfonylurea, TZD\n  Intermediate: DPP-4i"
        prompt: "قوة الدوا على السكر؟"
