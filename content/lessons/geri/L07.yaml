  - id: geri.L07.lesson4
    title: "المزاج والـ frailty: GDS وسلّم Rockwood"
    hook: "الاكتئاب في الكبير بيستخبى في الجسم، والـ frailty ليها سلّم من 1 لـ 9."
    minutes: 9
    pages: [118, 122]
    topics: [psych, frailty]
    goals:
      - "تعرف ليه الاكتئاب بيتفوّت في الكبير وعوامل خطر الانتحار"
      - "تحسب الـ GDS-15"
      - "تقرأ الـ Clinical Frailty Scale"
    status: unverified
    steps:
      - kind: explain
        page: 118
        title: "الاكتئاب المستخبي"
        quote: "Depression in older people has a prevalence of 5-10 per cent in those aged over 65, but is frequently under-recognised."
        text: |
          - ==5–10%== من اللي فوق 65، ومع ذلك **under-recognised**.
          - بيزوّد الـ morbidity ويسوّء نتايج الأمراض الجسدية.
          - الكبير **بيقلّل** من الأعراض وبيقول «ده من السن».
          - ==Somatic symptoms== أكتر من الشباب: «جسمي كله بيوجعني» بدل «أنا حزين».
      - kind: aside
        tone: trap
        page: 118
        quote: "Older adults with depression are at higher risk of completed suicide than younger people"
        text: "الكبير المكتئب **أعلى** في الـ **completed suicide** من الشاب، فلازم تسأل عن الأفكار الانتحارية **دايمًا**. السؤال ما بيزرعش الفكرة."
      - kind: sort
        page: 118
        quote: "Older age, male gender. Social isolation and or bereavement. History of attempts and or evidence of planning."
        prompt: "عامل خطر للانتحار في الكبير حسب الكتاب؟"
        bins: ["Risk factor", "Not listed"]
        cards:
          - { text: "Male gender", bin: 0 }
          - { text: "Bereavement", bin: 0 }
          - { text: "Previous attempt or planning", bin: 0 }
          - { text: "Chronic painful illness", bin: 0 }
          - { text: "Alcohol use", bin: 0 }
          - { text: "Female gender", bin: 1 }
          - { text: "Living with a large family", bin: 1 }
        why: "الكتاب: older age و ==male gender==، social isolation أو bereavement، attempts أو planning، chronic painful illness أو disability، drug أو alcohol use."
      - kind: explain
        page: 119
        title: "GDS-15: الحساب"
        quote: "Geriatric Depression Scale (Short Form)"
        text: |
          **15** سؤال yes/no عن **الأسبوع اللي فات**. كل إجابة «مكتئبة» = نقطة.

          - **0–5** ← normal
          - ==>5== ← suggests depression

          خد بالك: الأسئلة الإيجابية («satisfied with your life؟»، «wonderful to be alive؟»، «full of energy؟») النقطة فيها على **No**.
      - kind: check
        page: 119
        quote: "Do you feel full of energy?"
        question: "GDS-15: she answers NO to 'Do you feel full of energy?' Does it score?"
        options: ["Yes, 1 point", "No, 0 points", "Only if she also says yes to Q1", "Energy is not on the GDS"]
        answer: 0
        why:
          - "صح: في الأسئلة الإيجابية الـ No هي اللي بتاخد نقطة."
          - "الـ No هنا علامة اكتئاب."
          - "كل سؤال بيتحسب لوحده."
          - "ده السؤال 13 في الـ GDS-15."
      - kind: aside
        tone: tip
        page: 120
        quote: "GDS"
        text: "في ص 120 فيه **GDS** بالعربي، 30 سؤال (هل أنت راضٍ عن حياتك أساسًا؟...). نفس الفكرة، أسئلة أكتر."
      - kind: figure
        page: 121
        quote: "Clinical Frailty Scale"
        title: "سلّم الـ frailty (Rockwood)"
        alt: "A ladder of nine rungs from 1 Very fit at the bottom to 9 Terminally ill at the top, with fit levels 1 to 3 in green, 4 vulnerable in accent, and frail levels 5 to 8 in red."
        caption: "**1–3** fit، **4** vulnerable، ==5–8 frail== بالتدريج، **9** terminally ill (<6 months) حتى لو مش frail."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="32" rx="6" class="fg-thin"/>
            <text x="20" y="31" class="t-sm t-b">9 Terminally ill: life expectancy &lt;6 months</text>
            <rect x="10" y="46" width="310" height="32" rx="6" class="fg-bad"/>
            <text x="20" y="67" class="t-sm t-b">8 Very severely frail: end of life</text>
            <rect x="10" y="82" width="310" height="32" rx="6" class="fg-bad"/>
            <text x="20" y="103" class="t-sm t-b">7 Severely frail: dependent, stable</text>
            <rect x="10" y="118" width="310" height="32" rx="6" class="fg-bad"/>
            <text x="20" y="139" class="t-sm t-b">6 Moderately frail: outside, house, bathing</text>
            <rect x="10" y="154" width="310" height="32" rx="6" class="fg-bad"/>
            <text x="20" y="175" class="t-sm t-b">5 Mildly frail: high-order IADLs</text>
            <rect x="10" y="190" width="310" height="32" rx="6" class="fg-acc"/>
            <text x="20" y="211" class="t-sm t-b">4 Vulnerable: slowed up, not dependent</text>
            <rect x="10" y="226" width="310" height="32" rx="6" class="fg-good"/>
            <text x="20" y="247" class="t-sm t-b">3 Managing well: controlled problems</text>
            <rect x="10" y="262" width="310" height="32" rx="6" class="fg-good"/>
            <text x="20" y="283" class="t-sm t-b">2 Well: no active symptoms</text>
            <rect x="10" y="298" width="310" height="28" rx="6" class="fg-good"/>
            <text x="20" y="317" class="t-sm t-b">1 Very fit: robust, exercises</text>
          </svg>
      - kind: order
        page: 121
        quote: "Clinical Frailty Scale"
        prompt: "رتّب من الأحسن للأسوأ:"
        steps:
          - "Well"
          - "Vulnerable"
          - "Mildly frail"
          - "Moderately frail"
          - "Severely frail"
          - "Very severely frail"
        why: "الـ Clinical Frailty Scale: 2 well، 4 vulnerable، 5 mild، 6 moderate، 7 severe، 8 very severe."
      - kind: update
        page: 121
        quote: "Clinical Frailty Scale"
        text: "النسخة **2.0** من الـ CFS غيّرت الأسامي: 2 Fit، 4 Living with very mild frailty، 5–8 «Living with mild/moderate/severe/very severe frailty». المعنى والأرقام زي ما هي، وفي الامتحان أسامي الكتاب."
        ref: "Rockwood K, Clinical Frailty Scale version 2.0, 2020"
      - kind: explain
        page: 121
        title: "الـ frailty مع الـ dementia"
        quote: "Clinical Frailty Scale"
        text: |
          درجة الـ frailty = ==درجة الـ dementia==:
          - **Mild:** بينسى تفاصيل حدث قريب، بيكرر السؤال، social withdrawal.
          - **Moderate:** الذاكرة القريبة بايظة جدًا، بيعمل personal care بالـ **prompting**.
          - **Severe:** مش بيقدر يعمل personal care من غير مساعدة.
      - kind: explain
        page: 122
        title: "قوة القبضة (grip strength)"
        quote: "Means and Standard Deviations for Grip Strength (kg) According to Age and Sex"
        text: "جداول الكتاب بتوري إن الـ ==grip strength== بتقل مع السن: الراجل 65–69 حوالي **40 kg** في اليد اليمين، والست حوالي **24 kg**، وعند 85–89 حوالي **28** و **17**. الست أقل في كل الأعمار. علشان كده ضعف القبضة علامة frailty سهلة تتقاس."
      - kind: try
        items: [geri.L07.076, geri.L07.079, geri.L07.081, geri.L07.084, geri.L07.087]
    recap:
      - "اكتئاب الكبير 5–10% فوق 65، under-recognised، أعراض جسدية أكتر."
      - "خطر الانتحار أعلى من الشباب: اسأل دايمًا. Male، isolation/bereavement، attempts، chronic pain، alcohol."
      - "GDS-15: >5 = depression. الأسئلة الإيجابية تتحسب على No."
      - "CFS: 1–3 fit، 4 vulnerable، 5–8 frail، 9 terminally ill <6 months."
    practice: [geri.L07.076, geri.L07.077, geri.L07.078, geri.L07.079, geri.L07.080, geri.L07.081, geri.L07.082, geri.L07.083, geri.L07.084, geri.L07.085, geri.L07.086, geri.L07.087, geri.L07.088, geri.L07.089, geri.L07.090, geri.L07.091]
