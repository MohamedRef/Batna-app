      - kind: explain
        page: 124
        quote: "Renal Recovery"
        title: "ليه الـ apparent full recovery مش كاملة؟"
        text: |
          الكتاب (ص 124): بعد الـ insult فيه **adaptive repair** أو **maladaptive repair**. **Full recovery**: baseline GFR **> 90** و RFR **> 30**؛ **apparent full recovery**: GFR **> 90** بس RFR **< 30**؛ **kidney recovery**: GFR **> 60**؛ **non-recovery CKD**: GFR **< 60**.

          التفسير المقبول (مش في الكتاب): الـ **maladaptive repair** معناه إن مكان الخلايا اللي ماتت بقى fibrosis، والـ nephrons الباقية بتشتغل زيادة. الـ GFR العادي يبان كامل، **بس** الـ reserve راح، **فـ** أول ضربة جاية (contrast، عملية، dehydration) هتوقّعه بسرعة. **عشان** كده الكتاب بيقول تابع اللي رجع جزئيًا.
