      - "تقرأ صور الكتاب: الحصوة والـ sludge على الـ US، والـ MRCP، والـ ERCP"
    status: unverified
    steps:
      - kind: figure
        page: 390
        title: "الوجع بيبان فين؟"
        image: { file: hb/L19-colic-pain-sites.webp, book: true }
        alt: "Book drawing of biliary colic: a stone stuck in Hartmann's pouch of a distended gallbladder and another stone in the common duct; small figures mark the sites of pain in the upper abdomen and the back below the right shoulder blade; a man bends forward holding his upper abdomen in steady pain."
        caption: |
          - الحصوة واقفة في ==Hartmann's pouch== أو في الـ common duct، والمرارة بتتمدد وراها.
          - النقط على الجسم: الـ RUQ والـ epigastrium، ولورا تحت لوح الكتف اليمين.
          - العيان مايل لقدّام وبيتحرك: الوجع ==steady== مش بيروح ويرجع كل دقيقة.
      - kind: figure
        page: 390
        title: "الحصوة في كل محطة"
        image: { file: hb/L19-stone-sites.webp, book: true }
        alt: "Book drawing: on the left, an opened gallbladder full of rounded stones; on the right, a gallbladder and bile ducts with labelled stones at four sites: an intrahepatic stone at the top, a cystic duct stone, a common duct stone and an ampullary stone where the duct enters the duodenum. Printed text in the middle says stones in the gallbladder cause no symptoms, while stones that migrate into the cystic or common duct cause biliary colic or acute cholecystitis. A chronic calculous cholecystitis drawing begins at the bottom edge."
        caption: |
          الرسمة التانية في صفحة 390، وبتقول إن الـ clinical presentation بيعتمد على الحصوة واقفة فين:

          - **شمال**: مرارة مفتوحة مليانة حصوات مدوّرة. الحصوات دي جوّه المرارة، وده ==no symptoms==.
          - **يمين، من فوق لتحت**: **intrahepatic stone** جوّه الكبد، بعدين **cystic duct stone** عند رقبة المرارة، بعدين **common duct stone** في نص القناة، وآخر حاجة **ampullary stone** عند دخول القناة في الـ duodenum (الأحمر تحت).
          - الكلام المطبوع في النص: الحصوات اللي ==migrate== للـ cystic أو الـ common duct هي اللي بتعمل **biliary colic** أو **acute cholecystitis**.

          يعني العرض = مكان الحصوة. ودي نفس الخريطة اللي الأدوات الجاية (US و MRCP و ERCP) بتدوّر فيها.
      - kind: explain
        remind: [hb.L19.057]
        page: 391
        quote: "Diagnostic tools Clinical. US. Cholecystography. CT Scan. MRCP. ERCP. PTC."
        title: "سبع أدوات: من الأبسط للأكتر تدخّل"
        text: |
          الـ **diagnostic tools** في الكتاب سبعة. أسهل طريقة تفتكرهم إنك ترتّبهم من الأبسط للأكتر تدخّل، وجنب كل واحدة التفسير المقبول (مش في الكتاب) لإمتى نستخدمها:

          - **Clinical**: القصة والكشف: وجع بعد الأكل الدسم، Murphy's sign، tender mass.
          - **US**: الأول دايمًا، ==accurate in more than 95%== (صفحة 392). رخيص، من غير radiation، وبيشوف الحصوة والجدار والـ duct في نفس الوقت.
          - **Cholecystography** (oral): صبغة بتتاخد بالبُق وتتركّز في المرارة. بقت نادرة، بس الكتاب بيستخدمها في صفحة 385 علشان يتأكد إن المرارة شغالة قبل الـ UDCA.
          - **Computed tomography (CT) scan**: حصوات كتير مش بتبان فيه، بس بيشوف المضاعفات زي الـ pancreatitis والـ perforation.
          - **Magnetic resonance cholangiopancreatography (MRCP)**: صورة للقنوات من غير منظار ولا إبرة، علشان كده هي الاختيار لو شاكّين في حصوة في الـ CBD.
          - **Endoscopic retrograde cholangiopancreatography (ERCP)**: تشخيص وعلاج مع بعض (sphincterotomy وطلّع الحصوة، صفحة 400)، بس ليها مضاعفات.
          - **Percutaneous transhepatic cholangiography (PTC)**: إبرة من الجلد للكبد، لما الـ ERCP مش نافعة.

          القاعدة: ابدأ بالأرخص والأأمن، وسيب الـ ERCP للي هتعالجه بيها.
      - kind: figure
        page: 392
        quote: "Ultrasound Examination Accurate In More Than 95%"
        title: "الحصوة في الـ US"
        image: { file: hb/L19-stone-us.webp, book: true }
        alt: "Gallbladder ultrasound: a dark, fluid-filled gallbladder with a bright echogenic stone at its neck, marked by a blue arrow at the lower edge of the gallbladder."
        caption: |
          السهم على الحصوة: نقطة ==bright== (echogenic) على طرف المرارة السودا. ومن برّه الكتاب: الحصوة في الـ US عادةً بتعمل acoustic shadow غامق وراها.

          الكتاب بيقول الـ US ==accurate in more than 95%==، وعلشان كده هو أول فحص.
      - kind: figure
        page: 392
        title: "Ultrasound تاني من نفس الصفحة"
        image: { file: hb/L19-gb-us-2.webp, book: true }
        marks:
          - { at: [0.43, 0.07], label: "Curved probe" }
          - { at: [0.40, 0.22], label: "Dark fluid-filled cavity" }
          - { at: [0.42, 0.33], label: "Bright curved edge", kind: arrow }
          - { at: [0.45, 0.66], label: "Second bright band" }
        alt: "Second uncaptioned ultrasound on the book page headed ultrasound examination accurate in more than 95 percent: a fan-shaped image from a small curved probe at the top, a dark rounded fluid space just under the probe with a bright curved line along its lower wall, a white mouse cursor in the middle, and a bright band lower down."
        caption: |
          الصورة التانية تحت نفس العنوان (**Ultrasound examination accurate in more than 95%**)، والكتاب مش كاتب عليها حاجة.

          - الـ probe المقوّس (1)، والصورة طالعة منه زي المروحة.
          - تحته على طول **تجويف غامق** (2، سايل)، وحافته اللي تحت ==خط أبيض bright== مقوّس (3).
          - سهم الماوس الأبيض في النص، وتحت حزمة bright تانية (4).

          التفسير المقبول (مش في الكتاب): اللي بتدوّر عليه في الـ US هو أي حاجة bright جوّه أو على حافة تجويف سايل غامق، زي الحصوة في الصورة اللي فوق. وشكل الـ probe هنا (مقوّس صغير بحلقات) أقرب لـ **endoscopic ultrasound (EUS)** منه لسونار البطن العادي.
      - kind: figure
        page: 393
        title: "صورتين US كمان، واحدة بالـ Doppler"
        image: { file: hb/L19-gb-us-doppler.webp, book: true }
        marks:
          - { at: [0.56, 0.23], label: "Large dark area" }
          - { at: [0.55, 0.66], label: "Round dark cavity" }
          - { at: [0.33, 0.65], size: [0.33, 0.25], label: "Colour Doppler box", kind: box }
          - { at: [0.96, 0.62], label: "Colour scale" }
        alt: "Two uncaptioned ultrasound frames from the book stacked, from the same small curved probe at the top. Top: a large dark area under the probe. Bottom: a dark rounded fluid space under the probe with a dotted colour-Doppler box on its left holding a few red and blue flow signals, and a colour scale of plus and minus 7.5 centimetres per second at the top right."
        caption: |
          صفحة 393 صورتين US من غير تعليق، تكملة لصفحة 392:

          - **فوق**: منطقة غامقة كبيرة (1) تحت الـ probe.
          - **تحت**: تجويف غامق مدوّر (2)، وجنبه مربع منقّط (3) فيه نقط ==حمرا وزرقا==: ده **colour Doppler**، ومقياسه الملوّن (4) ±7.5 cm/s.

          التفسير المقبول (مش في الكتاب): الـ Doppler بيلوّن أي حاجة فيها دم بيجري، الأحمر ناحية الـ probe والأزرق بعيد عنه. فبيفرّق بين **vessel** (بيتلوّن) وبين قناة فيها bile أو حصوة (مبتتلوّنش)، وده من أسباب إن الـ US دقته > 95%.
      - kind: figure
