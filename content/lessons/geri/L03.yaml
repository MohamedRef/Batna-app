  - id: geri.L03.lesson4
    title: "اكتب صح: ابدأ قليل وامشي بالراحة"
    hook: "أحسن روشتة للحاج ساعات بتبقى اللي فيها دوا أقل، مش دوا زيادة."
    minutes: 9
    pages: [48, 51]
    topics: [principles, high-risk]
    goals:
      - "تعرف الـ principles والـ rational prescribing بالترتيب"
      - "تحفظ الـ high risk drugs"
      - "تعرف أشهر الـ drug-drug و drug-disease interactions"
    status: unverified
    steps:
      - kind: explain
        remind: [geri.L03.054]
        page: 48
        title: "قبل ما تكتب أي دوا"
        quote: "Principles of Drug Use\n  Ask: Is treatment warranted?\n  Are nonpharmacologic alternatives available?\n  Consider risk vs. benefit of drug therapy\n  Establish goals of therapy\n    Quality of care\n    Quality of life\n    Functional status\n  Consider the whole person, not just one disease or one drug\n  Be aware of assumptions behind clinical practice guidelines\n  Disease management may not be adequate or appropriate if multiple chronic diseases are present"
        text: |
          - هل العلاج **warranted** أصلًا؟
          - في **nonpharmacologic** بديل؟
          - الـ **risk vs benefit**.
          - حدد الـ goals: ==quality of care، quality of life، functional status==.
          - شوف **الإنسان كله**، مش مرض واحد ولا دوا واحد.
          - الـ **guidelines** معمولة لمرض واحد، ومع أمراض كتير ممكن ما تنفعش.

          ليه الـ guidelines ممكن تضر؟ لو حاج عنده 5 أمراض ومشيت ورا الـ guideline بتاع كل مرض، هيطلع على **12–15 دوا**، وده بالظبط اللي الرسمة في أول المحاضرة بتقول إن نص الناس اللي فيه بيجيلهم side effects. علشان كده الهدف مش "ظبط كل رقم"، الهدف **quality of life** و **functional status**.
      - kind: explain
        page: 49
        title: "Appropriate مش زي Polypharmacy"
        quote: "The potential benefit outweighs the potential risk. which is different from Polypharmacy -- the concurrent use of many medications."
        text: |
          - ==Appropriateness==: الفايدة المتوقعة أكبر من الضرر المتوقع.
          - **Polypharmacy**: أدوية كتير في نفس الوقت.

          ليه الفرق مهم؟ لأن ممكن الحاج ياخد 7 أدوية كلهم appropriate، وممكن ياخد 2 منهم واحد inappropriate. يعني العدد لوحده مش الحكم، الحكم هو الفايدة قصاد الضرر لكل دوا.
      - kind: order
        page: 49
        quote: "Rational Prescribing (1)\n  Determine if a drug is needed at all\n  Indeed, review all drugs to see if they are still needed\n  If a drug is needed\n    Assess patient for frailty, co-morbidities\n    Review prior and current medication use\n    Assess the patient's ability to comply with directives"
        prompt: "رتّب خطوات الـ rational prescribing:"
        steps:
          - "Is a drug needed at all? Review all drugs"
          - "Assess frailty and co-morbidities"
          - "Review prior and current drugs"
          - "Assess ability to comply"
          - "Pick a drug and dose"
          - "Check with explicit criteria"
          - "Ask a pharmacist if unsure"
        why: "الأول تسأل محتاج دوا ولا لأ، وبعدين تقيّم الحاج، وبعدين تختار وتراجع اختيارك."
      - kind: explain
        page: 50
        title: "التوصيات"
        quote: "Recommendations for pharmaco-therapy in geriatric patients\n  Is pharmacotherapy necessary?\n    Clear diagnosis, non-pharmacological possibilities\n  Well documented pharmacotherapy\n    Avoid new drugs and drugs with long half-lifes\n  Avoid polypharmacy\n  Start low, go slow\n  Consider unusual side effects\n  Always answer the follwing questions:\n    Can a drug be stopped? unprescribing or „pruning\" of drug regimen\n    Does the patient understand the therapy?\n    Is the patient able to follow the therapy?"
        text: |
          - هل الدوا **ضروري**؟ تشخيص واضح، وجرّب البدائل.
          - **Well documented**: ابعد عن الأدوية الجديدة واللي الـ half-life بتاعها طويل.
          - **Avoid polypharmacy**.
          - ==Start low, go slow==.
          - فكّر في الـ **unusual side effects**.
