  - id: rheum.L18.lesson2
    title: "من البُق للكلى: الصورة الإكلينيكية والـ lymphoma"
    hook: "Sjögren مش بس عين وبُق: نص العيانين عندهم جلد، وفيه 44 ضعف risk لـ lymphoma لازم تشم ريحته بدري."
    minutes: 9
    pages: [303, 305]
    topics: [glandular, extraglandular, lymphoma]
    goals:
      - "تعدّ الـ glandular manifestations"
      - "تمشي على الـ systems: جلد، كلى، أعصاب، مفاصل، رئة، أمعاء"
      - "تحفظ الـ predictors of lymphoma: clinical وserologic"
    status: unverified
    steps:
      - kind: explain
        page: 303
        title: "البُق والعين"
        quote: "Parotits, swellimg of salivary glands. * Cracked, peeling and atrophic appearance of lips. * Dry fissured tongue, oral candidiasis."
        text: |
          **البُق:** ==xerostomia==، **parotitis** وتورم الغدد، شفايف **cracked, peeling, atrophic**، لسان **dry fissured**، **oral candidiasis**، و **dental caries** ووقوع سنان.

          **العين:** **burning** و **itching**، وجفاف = **keratoconjunctivitis sicca**.

          **المهبل:** dryness و burning.
      - kind: reveal
        page: 303
        quote: "Dry fissured tongue, oral candidiasis. * Dental caries and loss of teeth."
        prompt: "ليه عيان Sjögren سنانه بتسوّس وبتجيله candidiasis في البُق؟"
        answer: |
          الريق مش بس مية: فيه **antibacterial** و **antifungal** proteins، وبيغسل الأكل من على السنان ويعادل الـ acid.

          لما الريق يقل، البكتيريا تاكل السنان (**caries**) والـ **Candida** تلاقي فرصتها. (تفسير فسيولوجي، والقائمة من الكتاب.)
      - kind: explain
        page: 303
        title: "الجلد والكلى"
        quote: "Dermatological manifestations: It represents 50% of manifestations. 1- Xeroderma, scaling, pruritus. 2- Annular, popular erythema including SWEET syndrome."
        text: |
          - **Skin** = ==50%== من الـ manifestations: **xeroderma**، scaling، **pruritus**، و **annular papular erythema** ومنها **Sweet syndrome**.
          - **Renal:** **hematuria**، **proteinuria**، **nephrotic syndrome**، **renal vasculitis** مع hypertension واضح، و **renal insufficiency**.
      - kind: table
        page: 304
        quote: "Peripheral neuropathy, primarily sensory, was found in 22% of patients with primary SS."
        title: "الأعصاب والمفاصل بالأرقام"
        columns: [Feature, Book]
        rows:
          - ["Peripheral neuropathy", "Mainly sensory, 22%"]
          - ["CNS disease", "Very rare"]
          - ["Arthritis pattern", "Intermittent, asymmetrical, small joints"]
          - ["Arthralgia", "Up to 53%"]
          - ["Myalgia", "Up to 22%"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: tip
        page: 304
        quote: "Joint disease in primary SS is typically an intermittent asymmetrical poly-articular."
        text: "المفاصل في الـ primary SS: **intermittent** و **asymmetrical** و **small joints**، وممكن **mild erosions** و deformity. افتكر **22 / 53 / 22**: neuropathy، arthralgia، myalgia."
      - kind: explain
        page: 304
        title: "الرئة والأمعاء"
        quote: "Cough is often the main respiratory symptom and is usually a symptom of xero-trachea."
        text: |
          الرئة **common** بس نادرًا **clinically significant**.

          - ==Cough== هو العرض الرئيسي، وسببه غالبًا **xerotrachea** (الـ trachea نفسها ناشفة).
          - مضاعفات تانية: **lymphocytic alveolitis**، **lymphocytic interstitial pneumonitis**، **fibrosis**، **pseudolymphoma**.

          **GIT:** malabsorption، **pancreatitis**، **hepatitis**، sialadenitis.
      - kind: check
        page: 304
        quote: "Cough is often the main respiratory symptom and is usually a symptom of xero-trachea."
        question: "Which is TRUE about Sjögren syndrome in the lecture?"
        options:
          - "Cough is usually from xerotrachea"
          - "CNS disease is the commonest neurological form"
          - "The arthritis is symmetrical large-joint"
          - "Lung disease is usually clinically severe"
        answer: 0
        why:
          - "صح: الـ cough غالبًا من الـ xerotrachea."
          - "الـ CNS نادر جدًا؛ الشائع peripheral sensory neuropathy (22%)."
          - "الـ arthritis asymmetrical وفي الـ small joints."
          - "الرئة common بس seldom clinically significant."
      - kind: explain
        page: 304
        title: "الخطر الكبير: lymphoma"
        quote: "Patients with SS in one study had a 44 times higher relative risk of non Hodgkin lymphoma"
        text: |
          في دراسة، عيان Sjögren كان عنده ==44 times== relative risk لـ **non-Hodgkin lymphoma**.

          علشان كده في كل متابعة دوّر على الـ **predictors**: clinical و serologic.
      - kind: mnemonic
        page: 305
        quote: "2- Splenomegaly. 3- Lymphadenopathy. 4- Palpable purpura. 5- Leg ulcers."
        word: "PSLPL"
        parts:
          - { key: "P", text: "Persistent parotid enlargement" }
          - { key: "S", text: "Splenomegaly" }
          - { key: "L", text: "Lymphadenopathy" }
          - { key: "P", text: "Palpable purpura" }
          - { key: "L", text: "Leg ulcers" }
        hook: "اقراها «**P**arotid **S**pleen **L**ymph, **P**urpura **L**eg»: من الراس للرجل، كل حاجة بتكبر أو بتنزف أو بتتقرّح."
      - kind: figure
        page: 305
        quote: "1- Low levels of C4. 2- Mixed monoclonal cryoglobulinemia."
        title: "Predictors of lymphoma: الجسم والمعمل"
        alt: "Two stacked panels. Top, clinical predictors drawn down a body outline from head to leg: persistent parotid enlargement, lymphadenopathy, splenomegaly, palpable purpura, leg ulcers. Bottom, serologic predictors: low C4, mixed monoclonal cryoglobulinemia, cross-reactive idiotypes of monoclonal rheumatoid factors."
        caption: "خمسة في الكشف وتلاتة في المعمل. أهم واحد في المعمل: ==low C4==."
        svg: |
          <svg viewBox="0 0 330 380" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="20" text-anchor="middle" class="t-b">Clinical</text>
            <circle cx="70" cy="55" r="20" class="fg-box"/>
            <rect x="50" y="78" width="40" height="110" rx="12" class="fg-box"/>
            <rect x="55" y="188" width="12" height="40" rx="5" class="fg-box"/>
            <rect x="73" y="188" width="12" height="40" rx="5" class="fg-box"/>
            <circle cx="86" cy="62" r="6" class="fg-dot-bad"/>
            <text x="120" y="58" class="t-sm">Persistent parotid enlargement</text>
            <circle cx="62" cy="90" r="5" class="fg-dot-bad"/>
            <text x="120" y="92" class="t-sm">Lymphadenopathy</text>
            <circle cx="82" cy="130" r="7" class="fg-dot-bad"/>
            <text x="120" y="134" class="t-sm">Splenomegaly</text>
            <circle cx="61" cy="205" r="4" class="fg-dot-bad"/>
            <circle cx="79" cy="200" r="4" class="fg-dot-bad"/>
            <text x="120" y="204" class="t-sm">Palpable purpura</text>
            <circle cx="79" cy="222" r="5" class="fg-bad"/>
            <text x="120" y="226" class="t-sm">Leg ulcers</text>
            <rect x="15" y="250" width="300" height="120" rx="12" class="fg-acc"/>
            <text x="165" y="275" text-anchor="middle" class="t-b">Serologic</text>
            <text x="30" y="302" class="t-sm t-b t-acc">Low C4</text>
            <text x="30" y="327" class="t-sm">Mixed monoclonal cryoglobulinemia</text>
            <text x="30" y="352" class="t-sm">Cross-reactive idiotypes of monoclonal RF</text>
          </svg>
      - kind: case
        page: 305
        quote: "1- Low levels of C4. 2- Mixed monoclonal cryoglobulinemia."
        stem: "58-year-old woman, primary Sjögren for 12 years. Her parotid has stayed swollen for 6 months."
        steps:
          - question: "What are you worried about?"
            options: ["Non-Hodgkin lymphoma", "Simple dehydration", "Mumps", "Normal disease course"]
            answer: 0
            why: "الـ persistent parotid enlargement أول predictor في الكتاب، والـ risk 44 ضعف."
          - reveal: "She also has palpable purpura on the shins."
            question: "Which lab result adds to the concern?"
            options: ["Low C4", "High C3", "Positive anti-CCP", "Low ESR"]
            answer: 0
            why: "الـ low levels of C4 من الـ serologic predictors، ومعاها mixed monoclonal cryoglobulinemia. الـ high C3 والـ anti-CCP والـ ESR مش في القائمة."
      - kind: try
        items: [rheum.L18.020, rheum.L18.026, rheum.L18.032, rheum.L18.036, rheum.L18.037]
    recap:
      - "البُق: xerostomia، parotitis، fissured tongue، candida، caries. العين: keratoconjunctivitis sicca."
      - "الجلد 50% (Sweet syndrome)، الكلى (nephrotic، vasculitis + HTN)."
      - "Neuropathy sensory 22%، CNS نادر جدًا. Arthralgia 53%، asymmetric small joints."
      - "Cough من الـ xerotrachea. LIP، fibrosis، pseudolymphoma."
      - "NHL risk ×44. Predictors: PSLPL + low C4، cryoglobulins، monoclonal RF."
    practice: [rheum.L18.020, rheum.L18.021, rheum.L18.022, rheum.L18.023, rheum.L18.024, rheum.L18.025, rheum.L18.026, rheum.L18.027, rheum.L18.028, rheum.L18.029, rheum.L18.030, rheum.L18.031, rheum.L18.032, rheum.L18.033, rheum.L18.034, rheum.L18.035, rheum.L18.036, rheum.L18.037, rheum.L18.038, rheum.L18.039, rheum.L18.040, rheum.L18.068, rheum.L18.071]
