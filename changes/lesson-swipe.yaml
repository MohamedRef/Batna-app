- kind: new
  ar_eg: تقدر تقلب صفحات الدرس بإنك تسحب الشاشة يمين وشمال، زي الكتاب العربي. لو فيه سؤال لسه ما جاوبتوش، الصفحة مش هتتقلب
  en: Swipe left or right to move through a lesson, turning like an Arabic book; an unanswered question keeps the page until you answer or skip
- kind: new
  ar_eg: شكل جديد للدرس اسمه «صفحات»، كل خطوة صفحة ليها رقم وبتتقلب زي الكتاب. تختاره من الإعدادات ‹ المراجعة أو من الزرار اللي فوق في الدرس
  en: A new "Pages" view shows each step as a numbered book page that turns; pick it in Settings › Review or from the button at the top of a lesson
- kind: improved
  ar_eg: الدرس بقى واخد الشاشة كلها على الموبايل، من غير الشريط اللي فوق واللي تحت
  en: Lessons fill the whole phone screen, without the app bar and tab bar
