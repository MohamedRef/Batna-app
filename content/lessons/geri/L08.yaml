  - id: geri.L08.lesson5
    title: "العضم الهش والألم اللي في كل حتة"
    hook: "Osteoporosis ساكتة لحد ما حاجة تتكسر، و fibromyalgia بتوجع في كل حتة والتحاليل سليمة."
    minutes: 8
    pages: [148, 152]
    topics: [osteoporosis, fibromyalgia]
    goals:
      - "تعرف risk factors والوقاية والـ T-score"
      - "تعرف أدوية الـ osteoporosis"
      - "تعرف صورة الـ fibromyalgia وعلاجها"
    status: unverified
    steps:
      - kind: explain
        page: 148
        title: "Osteoporosis"
        quote: "Osteoporosis occurs when the creation of new bone doesn't keep up with the loss of old bone."
        text: |
          العضم بيتهد ويتبني طول الوقت. الـ ==osteoporosis== لما البنا ما يلحقش الهدم.

          الصورة: **back pain** من vertebra مكسورة، **loss of height**، **stooped posture**، وعضمة تتكسر أسهل من المتوقع.
      - kind: sort
        page: 148
        quote: "Medications like corticosteroids, anticonvulsants, proton pump inhibitors, drugs used in the treatment of cancer and transplant rejection."
        prompt: "Risk factor للـ osteoporosis حسب الكتاب؟"
        bins: ["Risk factor", "Not listed"]
        cards:
          - { text: "Proton pump inhibitors", bin: 0 }
          - { text: "Anticonvulsants", bin: 0 }
          - { text: "Hyperthyroidism", bin: 0 }
          - { text: "Multiple myeloma", bin: 0 }
          - { text: "White or Asian descent", bin: 0 }
          - { text: "Male sex", bin: 1 }
          - { text: "High calcium intake", bin: 1 }
        why: "الكتاب: female، old age، white/Asian، family history، **low calcium**، low sex hormones، hyperthyroidism، hyperparathyroidism، adrenal، أدوية (steroids، anticonvulsants، **PPIs**، cancer و transplant drugs)، و IBD و MM و chronic liver/kidney disease."
      - kind: explain
        page: 149
        title: "الوقاية"
        quote: "Most people need 600 IU/day, increased to 800IU/day at 70 years."
        text: |
          - **Calcium**: low-fat dairy، الخضار الورقي الغامق، سردين أو سالمون معلّب بعضمه، tofu، cereals و orange juice مدعّمين.
          - **Vitamin D**: cod liver oil و salmon. ==600 IU/day==، وتبقى **800 IU/day عند 70**.
          - **Exercise**: strength training + weight-bearing + **balance**. بينفع في أي سن، والأحسن تبدأ صغير.
      - kind: figure
        page: 150
        quote: "A T-score between -1.0 and -2.5 defines osteopenia."
        title: "الـ T-score على مسطرة"
        alt: "A horizontal T-score ruler: zero and above -1 is normal (green), between -1 and -2.5 is osteopenia (accent), -2.5 and below is osteoporosis (red)."
        caption: "الـ ==T-score== = كام SD بعيد عن peak bone mass لشاب من نفس الجنس والعرق (DXA). بين -1 و -2.5 osteopenia، و **-2.5 أو أقل** osteoporosis."
        svg: |
          <svg viewBox="0 0 330 140" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="40" width="100" height="40" class="fg-good"/>
            <rect x="110" y="40" width="110" height="40" class="fg-acc"/>
            <rect x="220" y="40" width="100" height="40" class="fg-bad"/>
            <text x="60" y="65" text-anchor="middle" class="t-sm t-b">Normal</text>
            <text x="165" y="65" text-anchor="middle" class="t-sm t-b">Osteopenia</text>
            <text x="270" y="65" text-anchor="middle" class="t-sm t-b">Osteoporosis</text>
            <text x="10" y="30" class="t-sm">0</text>
            <text x="110" y="30" text-anchor="middle" class="t-sm t-b">-1.0</text>
            <text x="220" y="30" text-anchor="middle" class="t-sm t-b">-2.5</text>
            <text x="10" y="105" class="t-sm t-mut">T-score (SD from young peak bone mass)</text>
            <text x="10" y="125" class="t-sm t-mut">measured by DXA</text>
          </svg>
      - kind: match
        page: 150
        quote: "Bisphosphonates: These are antiresorptive drugs that slow bone loss and reduce a person‘s fracture risk."
        prompt: "وصّل الدوا بميزته في الكتاب:"
        pairs:
          - ["Bisphosphonates", "Antiresorptive, slow bone loss"]
          - ["Raloxifene", "Fewer spine fractures after menopause"]
          - ["Calcitonin", "Pain relief after a fracture"]
          - ["Teriparatide", "Stimulates bone formation"]
          - ["Romosozumab", "FDA black box warning"]
        why: "الـ **teriparatide** (PTH) الوحيد هنا اللي **بيبني** عضم؛ والـ denosumab و romosozumab monoclonal antibodies بعد الـ menopause."
      - kind: explain
        page: 150
        title: "Fibromyalgia"
        quote: "Fibromyalgia (fi·bro·my·al·gi·a) is a condition that causes pain all over the body, also called widespread pain."
        text: |
          ==Widespread pain== مع **sleep problems**، fatigue، و distress نفسي؛ وحساسية أعلى للألم.

          - جسدي: muscle tenderness، TMJ pain، headache/migraine، إسهال وإمساك، **bladder** issues.
          - نفسي: ==fibro fog== (ذاكرة)، anxiety، depression، insomnia.
      - kind: aside
        tone: joke
        page: 151
        quote: "Memory problems (sometimes called ―fibro fog‖ or ―brain fog‖)."
        text: "الـ **fibro fog** ده لما تدخل المطبخ وتنسى دخلت ليه... بس كل يوم، ومع وجع في كل حتة."
      - kind: explain
        page: 151
        title: "مين ويقلب امتى؟"
        quote: "Women are twice as likely to have fibromyalgia as men."
        text: |
          **Risk:** الستات (**women**) ==ضعف== الرجالة، traumatic events (PTSD، حوادث، طفولة صعبة)، repetitive injuries، viral illness، family history، obesity.

          **Flare:** stress (شغل، فلوس، علاقات)، تغيير الروتين أو الأكل، hormones، **قلة النوم أو تغيير مواعيده**، وتغيّر الجو.
      - kind: check
        page: 151
        quote: "There‘s no test that can diagnose fibromyalgia. Usually, diagnosing it is part of a differential diagnosis."
        question: "How is fibromyalgia diagnosed, per the lecture?"
        options:
          - "No specific test; exclude others such as anemia or thyroid disease"
          - "A positive anti-CCP"
          - "Raised ESR above 50"
          - "Muscle biopsy"
        answer: 0
        why:
          - "صح: مفيش test؛ التشخيص جزء من differential، والدم يستبعد anemia والـ thyroid."
          - "الـ anti-CCP للـ RA."
          - "الـ ESR العالي يخليك تفكر في PMR أو GCA."
          - "مش بيتعمل biopsy."
      - kind: explain
        page: 152
        title: "العلاج 4 محاور"
        quote: "Non-pharmacological treatments: physical therapy to relax and strengthen muscles and joints."
        text: |
          1. **Physical therapy** يرخّي ويقوّي.
          2. **Psychological** treatment.
          3. **Medicines** للأعراض.
          4. ==Occupational therapist== للأنشطة اليومية.
      - kind: try
        items: [geri.L08.095, geri.L08.097, geri.L08.100, geri.L08.101, geri.L08.106]
    recap:
      - "Osteoporosis: البنا ما يلحقش الهدم؛ back pain، قِصر، انحناء، كسر سهل."
      - "Vitamin D 600 IU، و800 عند 70؛ strength + weight-bearing + balance."
      - "T-score: -1 لـ -2.5 osteopenia؛ ≤ -2.5 osteoporosis."
      - "Teriparatide بيبني؛ bisphosphonates antiresorptive؛ romosozumab black box."
      - "Fibromyalgia: widespread pain، fibro fog، الستات ×2، مفيش test."
