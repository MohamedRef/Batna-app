          - "Inhibited osteoblast function"
          - "More PTH secretion"
          - "Stimulated bone resorption"
        answer: 0
        why:
          - "صح: الـ steroids بتقلل امتصاص الكالسيوم، مش بتزوده."
          - "مذكورة في p217."
          - "مذكورة في p217."
          - "مذكورة في p217."
