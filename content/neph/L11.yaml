items:
  # ---------- p352-353: physiology ----------
  - id: neph.L11.001
    kind: cloze
    topic: physiology
    text: "In pregnancy renal volume rises by {{c1::30%}}, the bipolar diameter by {{c2::1.0-1.5 cm}}, and renal blood flow by {{c3::50-80%}} (mostly in the first trimester)."
    src: { page: 352, quote: "During the gestational period, the kidneys undergo changes: there is a 30% increase in renal volume; from 1.0 to 1.5 cm enlargement in renal bipolar diameter; and 50-80% increase in renal blood flow, especially in the first trimester. Proteinuria is normal, due to the increased glomerular filtration rate and the increased permeability of the glomerular basement membrane. In pregnant women, because of this physiological excess of protein excretion, the reference value is different from that of the remaining population; and proteinuria is considered normal up to 300 mg/24 hours." }
    status: unverified
    tags: [numbers]
  - id: neph.L11.002
    kind: card
    topic: physiology
    front: Up to what level is proteinuria considered normal in pregnancy, and why is it higher than outside pregnancy?
    back: Up to 300 mg/24 h, because GFR rises and the glomerular basement membrane becomes more permeable.
    src: { page: 352, quote: "During the gestational period, the kidneys undergo changes: there is a 30% increase in renal volume; from 1.0 to 1.5 cm enlargement in renal bipolar diameter; and 50-80% increase in renal blood flow, especially in the first trimester. Proteinuria is normal, due to the increased glomerular filtration rate and the increased permeability of the glomerular basement membrane. In pregnant women, because of this physiological excess of protein excretion, the reference value is different from that of the remaining population; and proteinuria is considered normal up to 300 mg/24 hours." }
    status: unverified
    tags: [high-yield, numbers]
  - id: neph.L11.003
    kind: card
    topic: physiology
    front: Why does urinary frequency rise early in pregnancy and again at the end?
    back: Early it is mainly hormonal; at the end it is mechanical.
    src: { page: 352, quote: "In the beginning of pregnancy, women experience an increase in urination frequency, mainly due to hormonal factors, and at the end of pregnancy this frequency also increases, but for mechanical reasons. A normal pregnancy generates an average weight increase of 10 to 14 kg, corresponding to about 9" }
    status: unverified
  - id: neph.L11.004
    kind: cloze
    topic: physiology
    text: "A normal pregnancy adds {{c1::10-14 kg}} of weight, about {{c2::9 liters}} of it water, giving hemodilution and a physiological rise in cardiac output."
    src: { page: 352, quote: "In the beginning of pregnancy, women experience an increase in urination frequency, mainly due to hormonal factors, and at the end of pregnancy this frequency also increases, but for mechanical reasons. A normal pregnancy generates an average weight increase of 10 to 14 kg, corresponding to about 9" }
    status: unverified
    tags: [numbers]
  # ---------- p353-354: burden and definition of AKI ----------
  - id: neph.L11.005
    kind: enumerate
    topic: aki-epi
    prompt: Mention the long-term consequences linked to pregnancy-related AKI.
    points:
      - Decline in kidney function to CKD and ESKD
      - Higher risk of adverse cardiovascular events
      - Higher health care utilization
      - Longer hospital stays
    pass: 3
    hook: "AKI الحمل بيسيب «كلية، قلب، ومستشفى مرتين»: الكلية تنزل لـ CKD وESKD، cardiovascular events أكتر، health care utilization أعلى، وhospital stays أطول."
    src: { page: 353, quote: "liters of water in the body. This increase in circulating volume leads to a state ofhemodilution, with a physiological increase in cardiac output. (1) ❖ Pregnancy-Related Acute Kidney Injury Acute kidney injury (AKI) during pregnancy is a public health problem and is a significant cause of maternal and fetal morbidity and mortality. Furthermore, AKI is associated with a decline in kidney function resulting in chronic kidney disease (CKD) and end-stage kidney disease (ESKD), increased risk for adverse cardiovascular events, higher health care utilization, and longer hospital stays.(2,3) Therefore, early recognition and treatment for AKI in pregnancy are of paramount importance and a potentially life-saving measure. Although the incidence in pregnancy-related AKI is low in developed countries due to improved prenatal care, the rates have increased almost three-fold in the recent decade in the United States possibly due to older maternal age with more comorbidities, higher detection rates of AKI, increase in the incidence of hypertensive disorders of pregnancy, and increase in obesity rates.(4,5) A recent study identified 42,190,790 pregnancy-related hospitalizations in the United States in women aged 15–49 years old and showed an increase in the rate of AKI during pregnancy-related hospitalizations from 0.04% in 2006 to 0.12% in 2015.5 Similarly, Mehrabadi et al (6) reported an increase in the incidence of AKI in pregnancy from 2.4 per 10,000 deliveries in 1999–2001 to 6.3 per 10,000 deliveries in 2010–2011. In contrast, although developing countries report an overall reduction in pregnancy-related AKI in the recent years, pregnancy-related AKI rates continue to remain higher than in the developed countries due to lack of antenatal care and higher frequency of septic abortions. For example, in India, there was a decline in pregnancy-related AKI from 15% in the 1980s to 1.5% in the 2010s among hospitalized women.(7) Similarly, a study from China showed a decline in the incidence of pregnancy-related AKI ranging from 0.2% to 1.8%.(8)" }
    status: unverified
