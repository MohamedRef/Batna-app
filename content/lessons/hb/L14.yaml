        alt: "Flow chart for a woman with compensated cirrhosis who wants to get pregnant. Optimize her and control portal hypertension before pregnancy. Screening EGD. If no varices, repeat EGD in the second trimester. If medium or large varices on either endoscopy, band ligation. Propranolol is the preferred beta blocker when one is indicated. Bleeding risk is highest in the second trimester and at delivery."
