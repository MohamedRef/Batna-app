        text: |
          - ==ACTH stimulation test==: لو الـ cortisol **ما وصلش لأكتر من 20 µg/dL** بعد **60 دقيقة**، المريض عنده adrenal insufficiency أو في خطر عالي ليها.
          - الـ ACTH غالبًا **طبيعي أو واطي** حتى والـ cortisol واطي. ليه ده مهم؟ لأن في الـ primary adrenal failure المفروض الـ ACTH يعلى جدًا. لما يفضل واطي، يبقى العيب **فوق**: pituitary أو CNS.
          - العلاج: **نفس** علاج أي حد عنده adrenal insufficiency.
