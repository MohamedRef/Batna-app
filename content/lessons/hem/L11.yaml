            <path d="M10 95 H320" class="fg-ink"/>
            <path d="M15 95 C30 95 35 25 50 25 C65 25 70 95 85 92 C100 88 105 80 115 82 C125 84 130 90 145 86 C160 82 165 78 175 84 C185 90 195 70 230 68 C265 66 280 88 315 94" class="fg-arrow-acc" stroke-width="2"/>
            <text x="50" y="110" text-anchor="middle" class="t-sm t-mut">Alb</text>
            <text x="250" y="110" text-anchor="middle" class="t-sm t-mut">γ broad</text>
