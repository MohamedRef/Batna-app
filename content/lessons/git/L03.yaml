      - kind: explain
        page: 127
        quote: "Loose stools are rarely present without the use of laxatives"
        title: "C2. Functional constipation"
        text: |
          لازم **2 أو أكتر** من دول في أكتر من ==25%== من مرات التبرّز:
          - Straining، أو lumpy/hard stools (**Bristol 1–2**).
          - إحساس بـ incomplete evacuation، أو anorectal obstruction.
          - **Manual maneuvers** (digital evacuation، support of the pelvic floor).
          - أو **fewer than three SBM per week**.

          ومعاهم: loose stools نادرة من غير laxatives، و ==insufficient criteria for IBS==.

          في الأبحاث، مريض الـ **opioid-induced constipation** ما ياخدش تشخيص FC، لأن صعب تفرّق أثر الـ opioid.
      - kind: sort
        page: 128
        quote: "Loose or watery stools, without predominant abdominal pain or bothersome bloating, occurring in more than 25% of stools"
        prompt: "التشخيص إيه؟"
        bins: ["Functional constipation", "Functional diarrhea", "Functional bloating", "Opioid-induced constipation"]
        cards:
          - { text: "Two hard stools a week and straining; mild pain that does not meet IBS", bin: 0 }
          - { text: "Loose stools in 40% of bowel movements, no predominant pain", bin: 1 }
          - { text: "Bloating 2 days a week that outweighs every other symptom", bin: 2 }
          - { text: "Straining and hard stools since the morphine dose went up", bin: 3 }
        why: "الـ FC والـ FDr والـ bloating كلهم بشرط **insufficient criteria for IBS**. الـ functional diarrhea لازم تستبعد IBS-D. والـ OIC بيبدأ أو يزيد لما الـ opioid يبدأ أو يتغيّر أو يزيد."
      - kind: explain
        page: 129
        quote: "Continuous or nearly continuous abdominal pain"
        title: "D: الألم اللي مصدره المخ"
        text: |
          **D1. CAPS** (centrally mediated abdominal pain syndrome):
          - ألم ==continuous or nearly continuous==.
          - مالوش علاقة (أو علاقة نادرة) بالأكل أو التبرّز أو الـ menses.
          - بيحدّ من حياته اليومية، ومش متصنّع، ومفيش مرض تاني يفسّره.
          - غالبًا معاه psychosocial comorbidity، بس مفيش profile معيّن تشخّص بيه.

          **D2. Narcotic bowel syndrome** (opioid-induced GI hyperalgesia): ألم مزمن بيتعالج بـ narcotics، والألم ==بيزيد أو ما بيخفش== مع زيادة الجرعة.
      - kind: aside
        tone: analogy
        page: 129
        quote: "There is marked worsening of pain when the narcotic dose wanes and improvement when narcotics are re-instituted (soar and crash)"
        text: |
          الـ **soar and crash** زي المراجيح: الجرعة تيجي فالألم يهدى (soar)، الجرعة تخلص فالألم يرجع أوحش (crash)، فالمريض ياخد تاني.

          ومع الوقت النوبات بتزيد في الـ frequency والمدة والشدة. يعني الدوا نفسه بقى جزء من المشكلة: ==opioid-induced hyperalgesia==.
      - kind: explain
        page: 130
        quote: "SOD is a benign, noncalculous obstructive disorder that occurs at the level of the SO."
        title: "المرارة والـ sphincter of Oddi"
        text: |
          **Functional gallbladder disorder** (gallbladder dyskinesia): biliary pain نموذجي ومفيش stones. بنعمل **scintigraphy** مع **IV CCK**، ونلاقي ==low ejection fraction==.

          الـ ==SOD==: **benign, noncalculous obstruction** عند مستوى الـ SO. ليه نوعين، وممكن يجتمعوا:
          - **SO stenosis** (ampullary stenosis): passive obstruction من fibrosis أو inflammation.
          - **SO dyskinesia**: obstruction متقطّع من spasm العضلة.

          والـ SO نفسه 3 أجزاء: **sphincter choledochus** (الأكبر)، sphincter pancreaticus، و sphincter ampullae.
      - kind: match
        page: 130
        quote: "SO dyskinesia, which results from intermittent obstruction caused by sphincter muscle spasm"
        prompt: "وصّل كل حاجة بمعناها:"
        pairs:
          - ["SO stenosis", "Passive obstruction from fibrosis or inflammation"]
          - ["SO dyskinesia", "Intermittent obstruction from muscle spasm"]
          - ["Sphincter choledochus", "Largest portion of the SO"]
          - ["Functional gallbladder disorder", "Biliary pain, no stones, low ejection fraction"]
        why: "الـ stenosis ثابتة (fibrosis)، والـ dyskinesia بتيجي وتروح (spasm). والمرارة بنقيسها بالـ CCK scintigraphy."
      - kind: explain
        page: 131
        quote: "SOD is a possible cause of 3 clinical conditions"
        title: "إمتى تفكر في SOD؟"
        text: |
          تلات مواقف:
          - ألم biliary-type ==after cholecystectomy==.
          - **Recurrent idiopathic pancreatitis**.
          - ألم biliary-type والمرارة موجودة ومفيش stones.

          بيزيد مع: liver transplantation، **AIDS**، chronic opium users، و hyperlipidemia.

          والـ **pancreatic SOD** ليه types زي الـ biliary: type I = pancreatic pain + amylase أو lipase ==1.1 times== الطبيعي مرة + pancreatic duct واسع (**>6 mm head، >5 mm body**). والـ SO hypertension موجود في **30–65%** من الـ recurrent pancreatitis و **50–87%** من الـ chronic pancreatitis.
      - kind: figure
        page: 131
        quote: "TABLE 63-1 Modified Milwaukee Classification for Biliary SOD (1999)"
        title: "سلّم Milwaukee"
        alt: "Three stacked boxes. Type I: pain plus liver enzymes at least 1.1 times normal once plus a bile duct over 10 mm; abnormal manometry 65 to 85 percent; relief after sphincterotomy 90 to 95 percent whether manometry is abnormal or normal; so sphincterotomy without manometry. Type II: pain plus one of the other two; abnormal manometry 65 percent; relief 85 percent if abnormal and 35 percent if normal; so manometry decides. Type III: biliary-type pain only; abnormal manometry 59 percent; relief 55 to 60 percent if abnormal and under 10 percent if normal; so least to gain from ERCP."
        caption: "كل ما تنزل type، الدليل الموضوعي يقل، وفايدة الـ sphincterotomy تقل. والـ manometry بتفرق بجد في type II."
