    kind: enumerate
    topic: symptoms
    prompt: Mention the non-specific symptoms of anaemia.
    points:
      - Fatigue
      - Orthostatic light-headedness
      - Faintness
      - Dyspnoea on exertion
      - Angina
      - Intermittent claudication
      - Palpitations
    pass: 5
    src: { page: 9, quote: "Non-specific Symptoms Fatigue Orthostatic light-headedness Faintness Dyspnea on exertion Angina Intermittent claudication" }
    status: unverified
    tags: [high-yield]
