      - kind: explain
        page: 133
        quote: "3. Collect the data.\n  This often can be accomplished via a 15- to 30-minute telephone conversation if the questions of interest are well framed ahead of time."
        title: "خطوة 3: اجمع الـ data"
        text: |
          جمع الـ data من الـ key informant غالبًا ينفع في ==مكالمة تليفون 15 لـ 30 دقيقة==، بشرط إن ==الأسئلة تكون محضّرة كويس== قبلها.

          ليه التحضير؟ وقت الخبير قليل، فلو الأسئلة واضحة من الأول هتاخد كل اللي محتاجه في مكالمة قصيرة. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 134
        quote: "5. Conduct follow-up, as needed.\n  As with literature searching, key informant interviews often result in a snowballing effect in which one expert identifies another who is also knowledgeable.\n  As information becomes repetitious, the data collector can decide when enough information has been collected."
        title: "Snowballing وإمتى تقف"
        text: |
          - تلاقي الخبرا في الـ literature، الـ professional networks، والنت (زي ProfNet).
          - اكتب **short list of open-ended questions** وابعتها بالـ e-mail قبل المكالمة.
          - **Collect** في مكالمة تليفون **15–30 دقيقة**، و**summarize** في bullet points.
          - ==Snowballing effect==: خبير يرشّحلك خبير. ولما المعلومة تبدأ **تتكرر**، كفاية.
