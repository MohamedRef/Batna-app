    src: { page: 158, quote: "INNATE IMMUNE RESPONSE : AGE-ASSOCIATED CHANGES NEUTROPHILS AND MACROPHAGES\n| Cell | Changes |\n|---|---|\n| NEUTROPHILS | DECREASED: Chemotaxis; Intra- & Extra-cellular killing; FCR dependant killing; Tumor cell toxicity; Pathogen elimination; ROS generation; TLR 4 of mice (not humans); Phagocytosis (or no change) |\n| MONOCYTES / MACROPHAGES | DECREASED: Phagocytosis; Surface expression of TLR1 and TLR4; TLR induced up-regulation of CD80; TLR 1 & 2 induced IL6 and TNFα production; CD68+ Macrophages in bone marrow (percentage). Altered immuno-modulatory cytokines |" }
