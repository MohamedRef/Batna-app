            <text x="14" y="346" class="t-sm">• vegetable and dairy protein</text>
            <text x="14" y="364" class="t-sm">• consider BCAA</text>
            <text x="14" y="382" class="t-sm">• oral → NG (airway protected) → parenteral</text>
          </svg>
      - kind: explain
        page: 413
        title: "يعني إيه للأكل في الـ HE؟"
        text: |
          - الـ HE أكتر في الـ **malnourished**.
          - احتياجات الطاقة و النيتروجين في عيان الـ HE زي اللي ماعندوش HE، رغم إن الـ nitrogen metabolism ليه دور أساسي في الـ HE.

          التوصيات (صفحة 413):
          - **Evaluate** nutritional status و sarcopenia.
          - ==Avoid protein restriction==.
          - Protein و energy مش أقل من أي cirrhotic.
          - **Encourage vegetables and dairy protein.**
          - **BCAA** لتحسين الـ **neuropsychiatric performance** وللوصول للـ nitrogen intake.
          - **Oral preferred**. في **grade III–IV** ومش قادر ياكل: ==nasogastric tube== لو الـ airway محمي، وإلا **parenterally**.
      - kind: reveal
        prompt: "سؤال الامتحان (صفحة 418): **What is the role of sarcopenia in hepatic encephalopathy**؟ جرّب تكتب النقط وبعدين افتح."
        answer: |
          - **HE is more common in malnourished cirrhotics.**
          - ==Inverse relationship== بين الـ muscle mass والـ blood ammonia: عضل أقل = ammonia أعلى.
          - **Hyperammonaemia impairs muscle function** وبتزوّد الـ muscle loss → ==vicious circle==.
          - الـ sarcopenia + HE مع infections و ascites → **reduced survival** (صفحة 403–404).
          - **Management:** evaluate sarcopenia؛ **avoid protein restriction**؛ نفس الـ energy والـ protein؛ vegetable و dairy protein؛ **BCAA**؛ late-evening snack؛ exercise؛ و NG أو parenteral في grade III–IV.
      - kind: case
        stem: "A 66-year-old woman with cirrhosis is admitted drowsy with **grade III HE**. She cannot swallow safely, and her airway is protected. Her family says another doctor told her to stop eating meat and eggs."
        page: 413
