  - id: neph.L08.lesson10
    title: "Case 1: الـ LM طبيعي والـ EM بيتكلم"
    hook: "9 glomeruli طبيعية، IF سلبي، والعيانة بتسرّب 13 جرام. الإجابة في الـ foot processes."
    minutes: 8
    pages: [223, 226]
    topics: [mcd]
    goals:
      - "تقرا تقرير الـ biopsy compartment بـ compartment"
      - "تعرف ليه الـ minimal change ما بيبانش غير بالـ EM"
      - "تفرّق الـ primary من الـ secondary MCD وتعرف أكبر مجموعات الـ secondary"
    status: unverified
    steps:
      - kind: explain
        page: 223
        title: "رجعنا للعيانة: التقرير سطر سطر"
        quote: "Back to our case scenario. Renal biopsy was done for examination by LM, IH, & EM."
        text: |
          الـ **renal biopsy** اتعمل بالتلاتة: **light microscopy (LM)**، **immunohistochemistry (IH)**، و **electron microscopy (EM)**. والـ LM ماشي على الـ 4 compartments اللي اتعلمناها:
          - **2 short cores** من الـ cortex، و **9 glomeruli** ولا واحد فيهم **obsolescent**، و ==within normal limits==.
          - **Tubules**: diffuse mild injury.
          - **Interstitium**: scattered **foamy histiocytes**.
          - **Arteries and arterioles**: unremarkable.
          - **IH**: IgA و IgG و IgM و **C4d** كلهم negative.

          ليه كل سطر؟ التفسير المقبول (مش في الكتاب): عدد الـ glomeruli بيقول العينة **كفاية** ولا لأ، والـ **obsolescent** (glomeruli ميتة) بيقول المرض مزمن ولا لأ؛ هنا صفر، يعني كلية لسه سليمة. الـ **foamy histiocytes** macrophages شربت دهون، وده متوقع مع cholesterol 389. والـ tubules متعبة شوية من البروتين الكتير اللي بيعدّي عليها. والـ IF السلبي بيشيل أي مرض immune complex. يعني كل حاجة بتقول: الفلتر بيسرّب، بس مفيش التهاب ولا deposits.

          إيه الدرس من case 1؟ التفسير المقبول (مش في الكتاب): الـ nephrotic بعد الولادة ممكن يخوّفك (lupus، thrombosis، preeclampsia)، بس الـ biopsy قال أبسط إجابة: **minimal change**. والـ MCD من أحسن الأمراض في الرد على الـ steroids، عشان كده الـ biopsy كان يستاهل: لو كانوا عالجوا على الـ empiric من غير ما يعرفوا، ممكن يدوها IS أقوى من اللازم وهي مرضعة. يعني الـ biopsy مش بس بيقول المرض، ده بيوفّر علاج غلط.
      - kind: explain
        remind: [neph.L08.017]
        page: 224
        title: "الـ biopsy"
        quote: "Examination revealed fully inflated and patent capillary loops. The glomerular basement membrane showed short segments of thinning however with no characteristic ultrastructural changes. The overlying podocytes showed injury with cytoplasmic microvillous transformation as well as diffuse effacement of their foot processes. Endothelium and mesangial areas were within normal limits. No electron-dense deposits of the immune-complex type were noted."
        text: |
          - **light microscopy (LM)**: 9 glomeruli ==within normal limits==، tubules فيها mild injury، و foamy histiocytes في الـ interstitium.
          - **immunohistochemistry (IH)**: IgA و IgG و immunoglobulin M (IgM) و C4d كلهم negative.
          - **EM**: ==diffuse effacement== للـ foot processes مع microvillous transformation، و **مفيش deposits**.

          ليه الـ LM الطبيعي هنا هو التشخيص؟ التفسير المقبول (مش في الكتاب): في الـ **minimal change** المشكلة في الـ **foot processes** بس، وده أصغر من إن الـ LM يشوفه. عشان كده الـ glomeruli «within normal limits» والـ IH سلبي، والـ EM لوحده هو اللي بيبيّن الـ **diffuse effacement**.
          - **diffuse** (مش segmental) يعني كل الـ podocytes متأثرة بالتساوي، وده عكس الـ FSGS اللي فيها ندبة في حتة.
          - **microvillous transformation**: الـ podocyte المتضايق بيطلّع زوائد صغيرة.
          - **مفيش deposits**: فده مش immune complex disease.
          والـ **foamy histiocytes** في الـ interstitium جاية من الدهون العالية في الـ nephrotic، مش مرض تاني.

          وإزاي تفرّقه عن الـ FSGS في عينة صغيرة؟ التفسير المقبول (مش في الكتاب): الـ FSGS **focal**، يعني ممكن العينة ما تجيبش الـ glomeruli المتليفة، فتبان MCD. 9 glomeruli بس بيسيب احتمال ده. عشان كده لو العيان ما ردش على الـ steroids، فكّر إن الـ MCD ده ممكن يكون FSGS اتفوّت، واعمل biopsy تاني لو لزم.
