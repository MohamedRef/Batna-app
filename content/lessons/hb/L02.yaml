      - kind: explain
        page: 32
        title: "FIB-4 و APRI: التليف من تحليل دم"
        text: |
          الكتاب بيقول تدخّل إيه في الحاسبة:

          - **FIB-4:** age، AST، ALT، platelet count.
          - **APRI:** AST، الـ upper limit، platelet count.

          المعادلات المعروفة (مش مكتوبة في الكتاب، بس هي دي اللي الحاسبة بتعملها):

          - **FIB-4 = (Age × AST) ÷ (Platelets × √ALT)**
          - **APRI = (AST ÷ AST ULN) × 100 ÷ Platelets** (platelets بالـ 10⁹/L)

          والمنطق: مع التليف الـ **AST بيعلى** أكتر من الـ ALT، والـ **platelets بتقل** (الـ portal hypertension بيحجز الصفايح في الطحال). والسن عامل خطر لوحده. فالكسر بيكبر.

          **Ranges في الكتاب:**
          - FIB-4: **أقل من 1.45** minimal or no fibrosis، **1.45–3.39** significant، **3.4 أو أكتر** advanced fibrosis or cirrhosis.
          - APRI: **أقل من 0.5** minimal or no، **0.5–1.5** moderate or significant، **أكتر من 1.5** severe fibrosis or cirrhosis.
      - kind: aside
        tone: trap
        page: 33
        text: |
          الكتاب فيه **مجموعتين** أرقام للـ FIB-4:

          - في الـ **NAFLD pathways**: **1.3** (صفحة 24 و 25 و 30) و **2.67** (صفحة 30 بس).
          - في صورة **FIB-4 value range** (صفحة 33): **1.45** و **3.4**.

          لو السؤال عن **NAFLD أو primary care** ← **1.3**. لو سألك «ranges of FIB-4» عمومًا ← **1.45 / 3.4**.

          وكمان: صورة الـ APRI في الكتاب مكتوب فيها «ALT upper limit»، بس الاسم نفسه **AST to Platelet Ratio Index**، يعني الـ ULN بتاع الـ **AST**.
