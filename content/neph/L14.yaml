  - id: neph.L14.053
    kind: card
    topic: ln-cyc
    front: What are the other names of standard-dose and low-dose cyclophosphamide in lupus nephritis?
    back: "Standard-dose = modified NIH (high-dose) regimen; low-dose = Euro-Lupus regimen."
    src: { page: 455, quote: "Cyclophosphamide may be given orally or intravenously, and in a standard-dose (also known as the modified National Institutes of Health (NIH) regimen or high-dose regimen) or low-dose (also known as the Euro-Lupus regimen). The dosing and duration for these regimens are given in Figure 7." }
    status: unverified
  - id: neph.L14.054
    kind: enumerate
    topic: ln-cyc
    prompt: Four factors in choosing a cyclophosphamide regimen (p456)?
    points:
      - Efficacy
      - Cost
      - Convenience
      - Toxicity
    pass: 4
    hook: "اختيار نظام الـ cyclophosphamide = «4 أسئلة الزبون»: هيشتغل؟ (efficacy) بكام؟ (cost) مريح؟ (convenience) هيأذيني؟ (toxicity)."
    src: { page: 456, quote: "The choice of which regimen to use depends on several factors and can be individualized:\nEfficacy: Oral and standard-dose i.v. cyclophosphamide regimens have been used in diverse ethnic populations and for all levels of disease severity, and show equivalent efficacy. Reduced-dose cyclophosphamide (Euro-Lupus regimen) shows equivalent efficacy to standard-dose cyclophosphamide but was tested mainly in White patients. Emerging data suggest low-dose cyclophosphamide is effective in Asians, Hispanics, and Black patients, but these studies did not make direct comparisons to standard-dose i.v. cyclophosphamide (Supplementary Table S6).\nCost: Intravenous cyclophosphamide is more expensive than oral and requires the availability of an infusion suite and experienced staff.\nConvenience: Oral cyclophosphamide does not require patients to stop work or family activities.\nToxicity: The toxicities of cyclophosphamide may be considered immediate (e.g., gastrointestinal, susceptibility to infection) or delayed (e.g., loss of fertility, future malignancies)." }
    status: unverified
