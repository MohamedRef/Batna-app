  - id: geri.L04.lesson2
    title: "جوه مخ الزهايمر: amyloid وtau وحريقة"
    hook: "الـ amyloid زي زبالة متكوّمة في الشارع: بتسد البلاعات، بتجيب الحشرات، والكناسين (microglia) بقوا هما نفسهم بيولّعوا فيها."
    minutes: 9
    pages: [56, 60]
    topics: [ad-mechanism]
    goals:
      - "تعرف إن الـ Alzheimer's disease (AD) hypotheses كتير وليه"
      - "تشرح دور الـ amyloid على الـ synapse والـ glutamate والـ astrocytes والـ microglia"
      - "تعدّ الـ 8 signaling pathways من رسمة الكتاب"
    status: unverified
    steps:
      - kind: explain
        remind: [geri.L04.011]
        page: 56
        quote: "Current understanding of AD pathologies involves various hypotheses, such as the cholinergic, amyloid, tau protein, inflammatory, oxidative stress, metal ion, glutamate excitotoxicity, microbiota-gut-brain axis, and abnormal autophagy."
        title: "مفيش سبب واحد"
        text: |
          الكتاب بيقول إن فهمنا للـ AD فيه ==various hypotheses==:
          - **cholinergic**، **amyloid**، **tau protein**.
          - **inflammatory**، **oxidative stress**، **metal ion**.
          - **glutamate excitotoxicity**، **microbiota-gut-brain axis**، **abnormal autophagy**.

          ليه فرضيات كتير بدل سبب واحد؟ لأن كل واحدة بتفسّر حتة من المرض ومفيش واحدة لوحدها بتفسّره كله. التفسير المقبول (مش في الكتاب): علشان كده الأدوية القديمة بتشتغل على فرضية (الـ **cholinergic**: عوّض الـ acetylcholine) والجديدة على تانية (الـ **amyloid**: شيله)، ولا واحدة فيهم بتوقف المرض خالص.
      - kind: figure
        page: 56
        title: "عجلة الـ hypotheses في الكتاب"
        image: { file: geri/L04-ad-hypotheses.webp, book: true }
        alt: "The book's wheel of Alzheimer's disease hypotheses: a head in the centre surrounded by eight segments (cholinergic, glutamate excitotoxicity, amyloid, tau protein, inflammatory, microbiota-gut-brain axis, abnormal autophagy, and metal ion and oxidative stress), each with a small drawing of its mechanism around the rim."
        caption: |
          رسمة الكتاب في ص 56: راس في النص وحواليها **8 خانات**، كل خانة hypothesis ورسمتها برّه. امشي مع عقارب الساعة من فوق:

          - **فوق**: ==cholinergic== (الـ acetylcholine release بيقل في الـ presynaptic terminal)، وجنبها **glutamate excitotoxicity** (glutamate كتير على الـ NMDA receptor والكالسيوم يدخل).
          - **يمين**: ==amyloid== (الـ APP بيتقطع بالـ β و γ-secretase لـ Aβ، يبقى oligomers ثم plaques لما الـ clearance يقل)، وتحتها **tau protein** (hyperphosphorylation ← neurofibrillary tangles).
          - **تحت**: **inflammatory** (الـ microglia بتتنشّط بالـ Aβ)، و **microbiota-gut-brain axis** (dysbiosis في الأمعاء توصل للمخ عبر الـ blood-brain barrier).
          - **شمال**: **abnormal autophagy** (الخلية مش بتنضّف نفسها)، وفوقها **metal ion و oxidative stress** (ميزان معادن مايل، والـ mitochondria بتطلّع H2O2).

          اللي تاخده: مفيش سبب واحد للـ Alzheimer's disease؛ دي 8 طرق بتتقابل في نفس النتيجة: خلايا عصبية بتموت.
      - kind: figure
        page: 56
        quote: "(1) Aβ is capable of interacting with cell membranes and binding to a variety of synaptic receptors such as PrPC, NMDA receptors, P75NTR, and mGluR5, which leads to a cascade of events including calcium dyshomeostasis, inhibition of long-term potentiation (LTP), tau hyperphosphorylation, mitochondrial dysfunction, and oxidative stress, ultimately resulting in neuronal death."
        title: "الـ amyloid بيعمل إيه؟"
        alt: "Amyloid-beta in the centre with four arrows. To the synapse: binds PrPC, NMDA, P75NTR and mGluR5, causing calcium overload, LTP loss, tau hyperphosphorylation and neuronal death. To glutamate: blocks EAAT reuptake causing excitotoxicity. To astrocytes: with TNF-alpha, IL-1alpha and C1q makes A1 astrocytes. To microglia: activates NLRP3 and cytokines that aggregate more amyloid."
        caption: "Aβ بيضرب في أربع جهات: الـ synapse، الـ glutamate، الـ astrocytes، والـ microglia. والـ apolipoprotein E (APOE) في الطبيعي بيشيل الـ Aβ."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="D04a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <circle cx="165" cy="150" r="34" class="fg-bad"/>
