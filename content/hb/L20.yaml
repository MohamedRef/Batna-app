  - id: hb.L20.099
    kind: mcq
    topic: practical-advice
    stem: A patient with cirrhosis asks how to space his meals. What is the best advice?
    options:
      - 3 meals + 3 snacks, including a late-evening snack
      - 3 meals, no snacks
      - 2 meals + 1 snack
      - 3 meals + 3 snacks, none after 6 pm
      - 2 meals + 3 snacks, skipping breakfast
    answer: 0
    why:
      - Correct. Split intake into 3 meals and 3 snacks (mid-morning, mid-afternoon, late evening); the late-evening snack is the most important (p407).
      - Without snacks the gaps are long, which worsens the accelerated starvation of cirrhosis.
      - Too few feeds; long gaps worsen the accelerated starvation.
      - The late-evening snack is the most important one; it shortens the overnight fast.
      - Breakfast is specifically recommended.
    src: { page: 407, quote: "Food intake should be split Three main meals: breakfast, lunch and dinner Three snacks: Mid-morning, mid-afternoon, late evening Late-evening snack is the most important" }
    status: unverified
