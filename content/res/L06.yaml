  - id: res.L06.060
    kind: mcq
    topic: drug-phases
    stem: >-
      Eighty-two patients with recurrent duodenal ulcers received triple therapy to eradicate H. pylori, and the
      ulcer healed in 78 of those available for endoscopy. The authors conclude that triple therapy is the therapy of
      choice. Their inference is:
    options:
      - Correct
      - Incorrect because it is not based on rates
      - Incorrect because there is no comparison group
      - None of the above
    answer: 2
    why:
      - Without a control we can't tell triple therapy from natural healing or another treatment.
      - 78 of 82 is effectively a rate; rates are not the problem.
      - With no comparison group there is nothing to be "of choice" over; this is the lecture's answer.
      - The missing comparison group is the flaw.
    src: { page: 41, quote: "Eighty-two patients, whose duodenal ulcers were recurrent, were entered in a treatment protocol of \"triple therapy\" course to eradicate Helicobacter pylori (HP) infection. Duodenal ulcer healed in 78 patients available for endoscopy. Their inference that in patients with duodenal ulcers, triple therapy is the therapy of choice is:\n  a. Correct\n  b. Incorrect because it is not based on rates\n  c. Incorrect because there is no comparison group\n  d. None of the above\nAnswer: c" }
