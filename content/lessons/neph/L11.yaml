      - kind: table
        page: 359
        quote: "Thrombotic microangiopathies Thrombotic microangiopathies like TTP and atypical HUS (aHUS) are rare causes of AKI in pregnancy and are associated with high morbidity. Most commonly, TTP is associated with ADAMTS13 (von Willebrand factor protease) deficiency. ADAMTS13 levels tend to decline as the pregnancy progresses, and as such, TTP is usually seen in the second and third trimesters. Diagnostic criteria for TTP includes thrombocytopenia, schistocytosis, neurologic manifestations and absence of coagulation abnormalities typically found in disseminated intravascular coagulation. Severe AKI is seen in up to 10% of patients with TTP during pregnancy. Further along the spectrum of pregnancy is aHUS as a cause of pregnancy-related AKI. aHUS is typically diagnosed in the postpartum period and is more common in multiparous women. Thrombotic microangiopathy of aHUS is commonly associated with a complement dysregulation and uncontrolled activation which results in complement induced endothelial damage. aHUS is characterized by microangiopathic hemolytic anemia, thrombocytopenia, and decreased kidney function. The diagnosis of pregnancy-associated aHUS may be challenging and can have overlapping features with TTP and severe preeclampsia with HELLP syndrome. While TTP is seen mostly in the third trimester, aHUS commonly present during the postpartum period. Plasma exchange should be started when TTP or aHUS is suspected while waiting for the ADAMTS13 levels. Additionally, eculizumab for the treatment of aHUS has been beneficial. A kidney biopsy can be considered if the AKI is not resolving despite appropriate treatment. (20)"
