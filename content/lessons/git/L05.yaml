    steps:
      - kind: table
        page: 203
        quote: "INCREASED RISK – People who have a history of polyps on prior colonoscopy\n| Risk category | Suggested surveillance interval |\n|---|---|\n| People with small rectal hyperplastic polyps | 10 years after the polyps are removed |\n| People with 1 or 2 small (<1 cm) tubular adenomas with low-grade dysplasia | 5 - 10 years after the polyps are removed |\n| People with 3 to 10 adenomas, or a large (at least 1 cm) adenoma, or any adenomas with high-grade dysplasia or villous features | 3 years after the polyps are removed |\n| People with >10 adenomas on a single exam | Within 3 years after the polyps are removed |\n| People with sessile adenomas that are removed in pieces | 2 to 6 months after adenoma removal |"
