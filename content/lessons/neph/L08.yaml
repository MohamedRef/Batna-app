      - "تحفظ الـ DD بتاع الـ mesangioproliferative pattern وتعرف ليه كل واحد فيه"
      - "تفهم ليه C3 واطي مع C4 طبيعي بيشاور على الـ C3 glomerulopathy"
    status: unverified
    steps:
      - kind: explain
        page: 250
        title: "Case 7: biopsy من غير IF"
        quote: "‑ Biopsy was examined only by L.M (no IHC or EM) with a diagnosis of Mesangioproliferative GN for which the patient was prescribed 60mg Prednisolone and he reported initial improvement. ‑ The patient then stopped steroids by his own. His physical examination was unremarkable except for high BP."
        text: |
          شاب **23 سنة**: edema و hypertension (HTN) و **C3 واطي** من سنتين. اتعمله biopsy اتقرا ==light microscopy (LM) بس==، واتكتب «mesangioproliferative glomerulonephritis (GN)»، وخد prednisolone 60 mg وبطّله لوحده.

          دلوقتي: creatinine 1.9، **C3 37** (consumed)، **C4 طبيعي**، antinuclear antibodies (ANA) و antineutrophil cytoplasmic antibodies (ANCA) سلبي.

          ليه الـ biopsy الأول ما نفعش؟ التفسير المقبول (مش في الكتاب): «mesangioproliferative» ده **وصف** مش تشخيص؛ IgA و lupus و C3 glomerulopathy و post-infectious ممكن كلهم يبانوا كده في الـ LM. اللي بيفرّق هو الـ **IF**، وده اتعمل LM بس.
          والـ **C3 واطي** و **C4 طبيعي** من سنتين بيقولوا إن الـ **alternative pathway** هي اللي شغالة: لو كان immune complex (زي lupus) كان الـ C4 هيقع كمان لأن الـ classical pathway بتستهلكه. وليه الـ prednisolone ما عملش حاجة؟ لأن الـ steroids مش بتوقّف الـ complement المنفلت. فالـ C3 الواطي المستمر ده جرس للـ **C3 glomerulopathy**.
      - kind: figure
        page: 250
        title: "الـ DD بتاع الـ mesangioproliferative"
        image: { file: neph/L08-mesangioprolif-dd.webp, book: true }
        caption: "الكتاب: **IgA nephropathy**، **resolving PIGN**، ==C3 glomerulopathy==، **Alport's syndrome**، **LN class II**، و **podocytopathies (MCD/unsampled FSGS)**."
        alt: "Book chart of six boxes, the differential diagnosis of mesangioproliferative GN: IgA nephropathy, resolving post-infectious GN, C3 glomerulopathy, Alport's syndrome, lupus nephritis class II, and podocytopathies (minimal change disease or unsampled FSGS)."
      - kind: explain
        page: 250
        title: "ليه الستة دول؟"
        quote: "What is the D.D of Mesangioproliferative GN?"
        text: |
          الكتاب بيسأل: **What is the D.D of mesangioproliferative GN?** والإجابة 6.

          التفسير المقبول (مش في الكتاب)، ليه كل واحد ممكن يبان كـ mesangium زيادة على الـ LM:
          - **IgA nephropathy**: الـ IgA بيترسّب في الـ mesangium، فده شكله الطبيعي.
          - **Resolving PIGN**: الـ post-infectious وهو بيخف، الـ capillaries بتنضف والـ mesangium آخر حاجة بتهدى.
          - ==C3 glomerulopathy==: الـ C3 بيترسّب في الـ mesangium والجدار، وأحيانًا يبان mesangial بس.
          - **Alport** بدري: قبل ما الـ GBM يبان متقطّع على الـ EM، الـ LM ممكن يوري mesangium زيادة.
          - **LN class II**: lupus mesangial بالتعريف.
          - **Podocytopathy** (MCD أو FSGS **unsampled**): العينة ما جابتش الـ glomerulus اللي فيه الندبة.

          يعني نفس الشكل له 6 أسباب، علاجهم مختلف خالص (steroids تنفع في واحد وتأذي في التاني). علشان كده الـ LM لوحده ما يكفيش.

          إزاي تفكّر في الـ DD ده كخريطة؟ التفسير المقبول (مش في الكتاب): كلهم بيبانوا «mesangial proliferation» في الـ LM، والـ IF هو اللي يقسمهم: **IgA** (IgA nephropathy أو HSP)، **full house** (lupus class II)، **C3 بس** (C3 glomerulopathy أو post-infectious بيخف)، **IgM** (IgM nephropathy). فلما تشوف كلمة mesangioproliferative من غير IF، اعرف إن التشخيص لسه ما اتعملش.
      - kind: explain
        page: 250
        title: "الـ biopsy التاني: C3 مستهلك والـ C4 سليم"
        quote: "‑ C4= 19 mg/dl (Normal). ‑ ANA, anti-dsDNA & ANCA: –ve. ‑ C3= 37 mg/dl (consumed)."
        text: |
          الـ **renal biopsy was repeated**. الـ labs: urine فيها albumin ++ و **RBCs 60–70**، uPCR 2.4، virology سلبي، ==C3 37 (consumed)==، **C4 19 (normal)**، و ANA و anti-dsDNA و ANCA سلبي.

          والـ **LM**: 12 glomeruli، 4 obsolescent؛ الـ patent فيها **segmental capillary basement membrane thickening with wrinkling** و **eosinophilic membranous deposits**، و mesangial matrix expansion، و segmental sclerosis. الـ tubules: atrophy بـ wrinkled thickened basement membranes، والـ interstitium: **fibrosis 35%**.

          ليه الـ C4 مهم؟ التفسير المقبول (مش في الكتاب): الـ **classical pathway** (اللي بتشغّله الـ antibodies) بيستهلك **C4 و C3** مع بعض، زي الـ lupus. الـ **alternative pathway** بيستهلك **C3 بس** ويسيب الـ C4. فـ C3 واطي جدًا مع C4 طبيعي و ANA سلبي = الـ complement شغال لوحده من غير antibodies، وده بالظبط الـ C3 glomerulopathy. والـ fibrosis 35% والـ obsolescent بتقول إن السنتين ضاعوا.

          ليه الـ EM مهم هنا كمان؟ التفسير المقبول (مش في الكتاب): الـ C3 glomerulopathy نوعين: **DDD** (deposits ribbon جوّه الـ lamina densa) و **C3GN** (deposits في الـ mesangium وتحت الـ endothelium، مش ribbon). الاتنين C3 بس على الـ IF، والـ EM هو اللي يفصل، وده بيغيّر الـ prognosis: الـ DDD أوحش وبيرجع في الـ transplant أكتر.
      - kind: check
        page: 251
        quote: "IH IgA: Negative, IgG: Negative, IgM: Negative, C3: deposits along GBM (3+) and C4: deposits along GBM (1+)"
        question: "Repeat biopsy IF: C3 3+ along the GBM, no IgG, IgA or IgM. Diagnosis?"
        options:
          - "C3 glomerulopathy"
          - "Lupus nephritis"
          - "IgA nephropathy"
          - "Membranous GN"
        answer: 0
        why:
          - "صح: ==C3 لوحده== من غير Ig مع C3 واطي و C4 طبيعي = complement-mediated. وطلع **dense deposit disease**."
          - "الـ lupus بيبقى full-house و C3 و C4 واطيين و ANA موجب."
          - "الـ IgA nephropathy = mesangial IgA."
          - "الـ membranous = granular IgG."
      - kind: figure
        page: 252
        title: "الـ LM بتاع case 7"
        image: { file: neph/L08-c3g-lm.webp, book: true }
        caption: "glomeruli بـ mesangial expansion و جدران capillary تخينة متكرمشة، وحواليها tubules ضامرة."
        alt: "Three book photomicrographs from case 7's repeat biopsy: glomeruli with mesangial matrix expansion and thick, wrinkled capillary walls, with atrophic tubules around them."
      - kind: figure
        page: 253
        title: "الـ IH والـ EM بتوع case 7"
        image: { file: neph/L08-c3g-ih-em.webp, book: true }
        caption: "فوق: الـ C3 بني على الـ GBM. تحت: الـ EM، deposits **dense** جوّه الغشا نفسه. التشخيص: ==C3 glomerulopathy (dense deposit disease)==."
        alt: "Book images from case 7: two immunohistochemistry panels with brown C3 along the glomerular capillary walls, and an electron micrograph with very dense deposits inside the basement membrane."
      - kind: explain
        page: 253
        title: "التشخيص، والـ creatinine 8.4"
        quote: "C3 glomerulopathy (Dense Deposit Disease) Unfortunately, the patient‘s sCr now is 8.4 mg/dl."
        text: |
          التشخيص: ==C3 glomerulopathy (dense deposit disease)==. والكتاب بيقفل بجملة: **Unfortunately, the patient's sCr now is 8.4 mg/dl.**

          ليه وصل لكده؟ التفسير المقبول (مش في الكتاب): أول biopsy ما اتعملوش **IF** ولا **EM**، فالـ C3 اللي ماشي على الغشا ما اتشافش، واتعالج على إنه «mesangioproliferative» بالـ steroids. الـ steroids مش بتوقف الـ alternative pathway، فالمرض فضل ماشي، والعيان كمان بطّل الدوا لوحده ومحدش تابع. الـ DDD اسمه كده لأن الـ deposits **كثيفة جدًا** على الـ EM وماشية **جوّه** الـ GBM زي شريط، فالجدار بيتخن ويتصلب. يعني الدرس مش عن الـ DDD بس؛ ده عن إن العينة لازم تتقرا بالتلاتة.

          ليه الكلية وصلت لـ 8.4 رغم إنه شاب؟ التفسير المقبول (مش في الكتاب): سنتين من complement منفلت من غير تشخيص صح، والـ steroids اتوقفت لوحدها. الـ alternative pathway بتفضل تضرب الـ glomeruli يوم ورا يوم، والندبة بتتراكم. الدرس: biopsy من غير IF ممكن يكلّف العيان كليته، عشان كده الكتاب حكى القصة.
      - kind: aside
        tone: exam
        page: 254
        quote: "There is no disease entity called Mesangioproliferative GN."
        text: |
          الكتاب كاتبها بالخط العريض: ==There is no disease entity called mesangioproliferative GN==. ده **pattern** لازم يتكمّل بـ immunofluorescence (IF) و electron microscopy (EM).

          الـ DD بتاعه: **IgA**، **resolving post-infectious glomerulonephritis (PIGN)**، **C3 glomerulopathy**، **Alport**، **lupus class II**، و **podocytopathy** (MCD أو focal segmental glomerulosclerosis (FSGS) مش ظاهر في العينة).

          والنتيجة في case 7: الـ creatinine دلوقتي **8.4**.
      - kind: check
        page: 254
        quote: "The pathology of mesangioproliferative GN requires further meticulous studies until a definite diagnosis is reached."
        question: "A biopsy read by LM alone says 'mesangioproliferative GN'. What does the book say comes next?"
        options:
          - "Further studies (IF and EM) until a definite diagnosis is reached"
          - "Start prednisolone, it is the diagnosis"
          - "Repeat LM only in 6 months"
          - "Treat as IgA nephropathy"
        answer: 0
        why:
          - "صح: الكتاب: مفيش مرض اسمه كده، والـ pattern محتاج **further meticulous studies** لحد التشخيص."
          - "ده بالظبط اللي حصل في case 7 وضيّع سنتين."
          - "الـ LM تاني مش هيضيف اللي الـ IF والـ EM بيقولوه."
          - "الـ IgA واحد بس من 6 في الـ DD، ومحتاج IF يثبته."
      - kind: explain
        page: 255
        title: "Case 8: كبير بـ nephrotic وقلب stiff"
        quote: "Moderate ascites. Bilateral pleural effusion. Mild cirrhotic changes. Grade I MN in the kidneys. Normal prostate."
        text: |
          راجل **75 سنة**، ex-smoker، من غير تاريخ مرضي، جاي بـ **bilateral L.L edema و moderate ascites**. الـ labs: creatinine 1.1، **uACR 5517**، ==albumin 1.8==، **HbA1c 5.3**، ESR 35/70، C3 84، **LDH 459**، و ANA و viral markers و dysmorphic RBCs و cryoglobulins و RF و tumour markers كلهم سلبي. الـ U/S: ascites، **bilateral pleural effusion**، mild cirrhotic changes، و grade I MN في الكلى. الـ echo: ==grade II LVDD==، EF 69%.

          والكتاب بيسأل: **What is your differential diagnosis? What should be the next step?**

          فكّر (التفسير المقبول، مش في الكتاب):
          - nephrotic في كبير **من غير سكر** (HbA1c طبيعي): membranous (والكبير يدوّر على tumour)، أو ==amyloid==، أو minimal change من lymphoma.
          - الـ **diastolic dysfunction** مع EF طبيعي في nephrotic = قلب **stiff**، وده بيلمّح لحاجة بتترسّب في القلب والكلية مع بعض.
          - الـ cryoglobulins والـ RF السلبيين بيبعّدوا الـ cryoglobulinemia.
          يعني الخطوة الجاية لازم تدوّر على **monoclonal protein**.

          ليه الكتاب حطه في نفس الدرس مع C3G؟ التفسير المقبول (مش في الكتاب): لأن الاتنين بيعلموا نفس الدرس: الـ LM لوحده ما بيكفيش. في case 7 الـ IF كان ناقص، وفي case 8 الـ Congo red والـ typing هما اللي قالوا. فأي biopsy لازم يتعمل كامل: LM و IF و EM، وفي الكبير Congo red.
