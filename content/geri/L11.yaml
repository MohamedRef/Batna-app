    tags: [numbers, high-yield]
  - id: geri.L11.075
    kind: card
    topic: oxygen
    front: Meaning of the flat upper part and the steep lower part of the dissociation curve?
    back: Flat top, O2 loading in the lung is protected when alveolar PO2 falls. Steep middle, tissues unload large amounts of O2 for a small fall in PO2.
    src: { page: 205, quote: "peripheral tissues can withdraw large amounts of O2 for a small drop in PO2" }
    status: unverified
  - id: geri.L11.076
    kind: card
    topic: oxygen
    front: Effect of a right shift of the dissociation curve, and when does it become dangerous?
    back: More O2 released to tissues but harder loading in the lung; with a critically low arterial PO2, the impaired loading seriously harms tissue oxygenation.
    src: { page: 205, quote: "Arterial PO2 ifcritically low then O2 binding in the lungs isimpaired by a shift to the right" }
    status: unverified
  - id: geri.L11.077
    kind: card
    topic: oxygen
    front: Why can pulse oximetry miss significant hypoxia, especially on supplemental O2?
    back: SaO2 barely falls until PaO2 reaches the steep part (60-70 mmHg); on O2, PaO2 may fall from 140 to 65 mmHg before saturation drops.
    src: { page: 205, quote: "a fall in PaO2 from 140 to 65 mmHg would be required before a fall in O2 saturation is detected." }
    status: unverified
    tags: [high-yield]
  - id: geri.L11.078
    kind: card
    topic: oxygen
    front: Saturation is 90%, inside the 88-92% target, but PaO2 is 60 mmHg. Is the patient safe?
    back: "No. It is still critical: it sits where the steep part of the curve starts."
    src: { page: 205, quote: "yet PaO2 is 60 mmHg or less this is still CRITICALas it lies on the critical point of starting steep part of the curve." }
    status: unverified
