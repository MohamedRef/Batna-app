        title: "مش resectable ومش transplant؟"
        text: |
          - **1st line: RFA** = **standard of care** للـ BCLC 0–A اللي مش candidates للـ resection ولا الـ transplant.
          - **2nd line: TACE أو TARE أو PEI.**

          **TACE:** بنسد شريان الورم بـ **gelatin** عن طريق الـ angiography فيحصل **ischemic necrosis**، ونحقن chemo موضعي (**cisplatin، doxorubicin، mitomycin C**) فيعلى تركيزه في الورم ويقل الـ systemic toxicity. والـ **drug-eluting bead** بتحسّن التوصيل. ممكن يفيد مختارين **asymptomatic** بـ liver function كويسة (**BCLC A لحد early B**) و tumour burden صغير.

          **TARE:** حقن **yttrium-90 microspheres** في الشريان، بتطلّع **beta particles** تموّت الخلايا محليًا. للـ **low-volume disease** بنتايج زي الـ ablation.

          **PEI** (percutaneous ethanol injection): تدمير **كيميائي**. فعّال في **أقل من 2 cm**.
