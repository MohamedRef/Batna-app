  # --- Correlation (slides 28-32) ---
  - id: res.L04.029
    kind: card
    topic: correlation
    front: Define correlation and the correlation coefficient (r).
    back: >-
      Correlation is the strength and direction of the association between two variables; it does not
      mean causation. r is the statistic that measures that direction and strength (Pearson correlation).
    src: { page: 28, quote: "Correlation: The strength and direction of the association between two variables. Correlation DOES NOT mean causation.\nCorrelation coefficient (r): A statistic designed to measure the direction and strength of association between two variables." }
    status: unverified
  - id: res.L04.030
    kind: mcq
    topic: correlation
    stem: In what range does the correlation coefficient lie?
    options: [0 to +1, -1 to 0, -1 to +1, Greater than 1]
    answer: 2
    why:
      - That leaves out negative (inverse) correlations.
      - That leaves out positive (direct) correlations.
      - r runs from -1 (perfect negative) through 0 (none) to +1 (perfect positive).
      - r can never exceed 1 in size.
    src: { page: 29, quote: "Correlation Coefficient: The correlation coefficient (r) measures the strength of the association between two variables (Pearson correlation). The value of r ranges between +1 and -1.\n  +1 = A positive or direct correlation, eg, smoking and lung cancer\n  -1 = A negative or inverse correlation, eg, exercise and the risk of heart disease\n  0 = A zero correlation (no relationship), eg, color of the skin and intelligence\nNOTE: Even with a perfect correlation (r) of +1 or -1, a causal relationship may not necessarily exist between the two variables." }
    status: unverified
    tags: [book-question, high-yield]
  - id: res.L04.031
    kind: mcq
    topic: correlation
    stem: Which correlation coefficient shows the strongest association between exposure and outcome?
    options: ["+0.10", "-0.95", "+0.90", "-1.00"]
    answer: 3
    why:
      - Close to 0, so a very weak association.
      - Strong, but 0.95 is less than 1 in size.
      - Strong, but weaker than 0.95 and 1.
      - Strength is the size of r, ignoring the sign; -1.00 is a perfect (negative) correlation.
    src: { page: 29, quote: "Correlation Coefficient: The correlation coefficient (r) measures the strength of the association between two variables (Pearson correlation). The value of r ranges between +1 and -1.\n  +1 = A positive or direct correlation, eg, smoking and lung cancer\n  -1 = A negative or inverse correlation, eg, exercise and the risk of heart disease\n  0 = A zero correlation (no relationship), eg, color of the skin and intelligence\nNOTE: Even with a perfect correlation (r) of +1 or -1, a causal relationship may not necessarily exist between the two variables." }
