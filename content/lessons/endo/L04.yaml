        prompt: "ليه الـ GH بيعلى لما الجسم يقاومه، بدل ما يفضل طبيعي؟"
        answer: "التفسير المقبول (مش في الكتاب): الـ IGF-I هو اللي بيعمل negative feedback على الـ pituitary عشان يقلل الـ GH. لما المستقبل مقفول، الكبد ما يعملش IGF-I، فالـ feedback يختفي، والـ pituitary يفضل يفرز GH أكتر وأكتر من غير فايدة. ونفس المنطق في الـ coeliac: الأنسجة مش سامعة الـ testosterone، فالـ LH بيعلى، والـ T نفسه بيعلى."
      - kind: explain
        page: 54
        quote: "Patient with IBD have an increased prevelance of osteoporosis 2ry to vit D diffeciency, Ca malabsorption, malnutrions & corticosteroid use."
        title: "العضم في أمراض الأمعاء"
        text: |
          - **Hyperparathyroidism (HPT)** في أمراض الـ GIT: الكتاب بيقول إن فيه mild hypocalcaemia، malabsorption للـ 25(OH)D، hypophosphataemia، ونقص تغذية متنوع. يعني الكالسيوم وفيتامين د مش بيتمصوا، فالـ parathyroid بيشتغل زيادة عشان يعوّض، زي ما شفنا في الـ CRF.
          - **inflammatory bowel disease (IBD)**: ==osteoporosis== أكتر، لأربع أسباب: نقص vit D، malabsorption الكالسيوم، سوء التغذية، و ==الـ corticosteroids== اللي بتتاخد للعلاج نفسه.
      - kind: explain
        remind: [endo.L04.087]
        page: 54
        quote: "The cause of hypocalcemia is unclear. PTH values are reported to be low normal or elevated, and both resistance to PTH & impaired PTH secrteion have been postulated."
        title: "البنكرياس"
        text: |
          - **Acute pancreatitis**: ==hypocalcaemia== مستمرة، ودرجتها على قد شدة الـ pancreatitis. السبب مش واضح؛ الـ parathyroid hormone (PTH) low normal أو عالي، فممكن PTH resistance أو secretion ضعيف. يعني لو الـ PTH طبيعي والكالسيوم واطي، الغدة مش بترد زي المفروض.
          - **Pancreatic endocrine tumours**: insulinoma، glucagonoma، somatostatinoma، **delta cell tumour**، و **carcinoid** (ص 55).
          - الـ cirrhosis الكتاب بيقول «will be mentioned later» (ص 67).
