  # ------------------------------------------------------------------
  - id: hem.L02.lesson1
    title: "الأنيميا مش تشخيص: الرقم والأعراض"
    hook: "Hb واطي ده مش النهاية، ده أول سطر في الحكاية. والعيان اللي ماشي على رجله بـ Hb 5 ممكن يكون أحسن من اللي نزف امبارح."
    minutes: 7
    pages: [9, 10]
    topics: [definition, symptoms, history]
    goals:
      - "تعرّف الأنيميا بالأرقام وتعرف مين ليه reference مختلف"
      - "تفهم ليه الحامل بتبان أنيميك من غير مرض"
      - "تفرّق أعراض الأنيميا العامة من الأعراض اللي بتشاور على السبب"
    status: unverified
    steps:
      - kind: explain
        page: 9
        title: "التعريف"
        quote: "Anaemia can be defined as Hb values <14 g/dL in adult men and <12 g/dL in adult women."
        text: |
          الأنيميا = **Hb أو Ht** أقل من الـ **reference range** المناسب للعيان ده، بعد ما تظبطه على **السن والجنس** وحاجات زي **الارتفاع عن البحر**.

          بالأرقام في الكتاب: ==Hb < 14 g/dL== في الراجل و **Hb < 12 g/dL** في الست.
      - kind: aside
        tone: exam
        page: 9
        quote: "Anaemia is not a diagnosis. It is a laboratory abnormality that requires explanation."
        text: "جملة الكتاب اللي لازم تتكتب في أي إجابة: الأنيميا **not a diagnosis**؛ هي **laboratory abnormality that requires explanation**. يعني دايمًا تكمّل: أنيميا **بسبب إيه**؟"
      - kind: explain
        page: 9
        title: "Special populations"
        quote: "RBC mass and plasma volume are expanded by 25 and 50 %, respectively"
        text: |
          - **African-Americans** (الجنسين وكل الأعمار): الـ Hb أقل بـ **0.5–1.0 g/dL** من الـ Caucasians.
          - الحامل في الـ ==3rd trimester==: الـ **RBC mass** بتزيد **25%** والـ **plasma volume** بتزيد **50%**. البلازما زادت أكتر، فالـ Hb والـ Ht والـ RBC count ينزلوا، وغالبًا لمستوى أنيميا. ده اسمه **physiologic** أو ==dilutional anaemia==.
      - kind: figure
        page: 9
        quote: "resulting in in Hb, Ht and RBC count, often to anemic levels"
        title: "ليه الحامل بتبان أنيميك؟"
        alt: "Two stacked bars. Before pregnancy: red cell mass 100 and plasma 100. Third trimester: red cell mass 125 and plasma 150. The red share of the bar is smaller in pregnancy, so the concentration (Hb, Ht) falls although red cells increased."
        caption: "الكرات الحمرا **زادت** فعلًا (+25%)، بس الميه زادت أكتر (+50%). زي كوباية شاي حطيت عليها ميه: السكر نفسه ما قلّش، بس التركيز قلّ."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="22" class="t-sm t-b">Before pregnancy</text>
            <rect x="10" y="30" width="100" height="34" class="fg-dot-bad"/>
            <rect x="110" y="30" width="100" height="34" class="fg-acc"/>
            <text x="60" y="52" text-anchor="middle" class="t-sm t-b">RBC 100</text>
            <text x="160" y="52" text-anchor="middle" class="t-sm t-b">Plasma 100</text>
            <text x="10" y="102" class="t-sm t-b">3rd trimester</text>
            <rect x="10" y="110" width="125" height="34" class="fg-dot-bad"/>
            <rect x="135" y="110" width="150" height="34" class="fg-acc"/>
            <text x="72" y="132" text-anchor="middle" class="t-sm t-b">RBC 125</text>
            <text x="210" y="132" text-anchor="middle" class="t-sm t-b">Plasma 150</text>
            <text x="10" y="172" class="t-sm">+25% red cells, +50% plasma</text>
            <text x="10" y="190" class="t-sm t-bad t-b">→ Hb, Ht, RBC count fall (dilution)</text>
          </svg>
      - kind: check
        page: 9
        quote: "Anaemia can be defined as Hb values <14 g/dL in adult men and <12 g/dL in adult women."
        question: "A man has Hb 13.2 g/dL. By the book's cut-off, is he anaemic?"
        options:
          - "Yes, below 14 g/dL for men"
          - "No, it is above 12 g/dL"
          - "Only if he is pregnant"
          - "Only if he has symptoms"
        answer: 0
        why:
          - "صح: الكتاب بيقول < 14 g/dL للراجل."
          - "الـ 12 ده للست، مش للراجل."
          - "😄 الراجل مش هيحمل؛ والـ dilution ده للحامل بس."
          - "الأنيميا تعريفها معملي، مش بالأعراض."
      - kind: explain
        page: 9
        title: "الأعراض العامة"
        quote: "Non-specific Symptoms Fatigue Orthostatic light-headedness Faintness Dyspnea on exertion"
        text: |
          الـ ==non-specific symptoms== كلها بسبب إن الأنسجة مش واخدة أكسجين كفاية:
          - **Fatigue**، **faintness**، **orthostatic light-headedness**
          - **Dyspnoea on exertion**، **palpitations**
          - **Angina** و **intermittent claudication** (القلب والرجل محتاجين أكسجين وقت المجهود)

          والمهم: الأنيميا اللي بتيجي **بالراحة** ممكن تبقى ==asymptomatic== حتى بـ **Hb 5–6 g/dL**، لأن الجسم بيلحق يتأقلم.
      - kind: reveal
        page: 10
        quote: "In severe acute haemolysis or blood loss, prominent early symptoms include resting or orthostatic hypotension"
        prompt: "ليه اللي نزف فجأة بيبان أتعب بكتير من اللي Hb بتاعه أوطى بس جاله على شهور؟"
        answer: "في النزيف الحاد المشكلة **حجم دم** مش بس Hb: **hypotension** (resting أو orthostatic)، **syncope**، **tachycardia**، **diaphoresis**، قلق وهياج، وضعف شديد. أما المزمن فالجسم كان عنده وقت يعوّض."
      - kind: explain
        page: 10
        title: "لما الأنيميا تكشف مرض تاني"
        quote: "Previous myocardial dysfunction more pronounced edema, dyspnea, orthopnea, tachycardia, fatigue and loss of energy."
        text: |
          - قلب ضعيف أصلًا: **oedema** و **orthopnoea** و dyspnoea أوضح.
          - **Cerebrovascular disease**: الـ cognition يتأثر، و ==TIA أو strokes== تزيد.
      - kind: match
        page: 10
        quote: "Paresthesias, clumsiness, weakness: B12 deficiency"
        prompt: "العَرَض بيشاور على إيه؟"
        pairs:
          - ["Jaundice", "Haemolysis"]
          - ["Weight loss", "Malignancy"]
          - ["Fevers, night sweats", "Malignancy or chronic infection"]
          - ["Sore tongue, mouth sores", "Megaloblastic anaemia or iron deficiency"]
          - ["Paraesthesias, clumsiness", "B12 deficiency"]
        why: "الـ **jaundice** = كرات بتتكسر. والـ **B12** الوحيد اللي بيلمس الأعصاب. والـ splenomegaly (امتلاء البطن) بيشاور على lymphoma أو liver disease أو myeloproliferative."
      - kind: explain
        page: 10
        title: "اسأل عن البداية والمدة"
        quote: "Onset of symptoms abrupt (haemolysis) or insidious (nutritional)"
        text: |
          - **Abrupt** = ==haemolysis==، **insidious** = **nutritional**.
          - مدة **قصيرة** للـ dyspnoea والـ fatigue = **نزيف قريب أو haemolysis**.
      - kind: try
        items: [hem.L02.002, hem.L02.005, hem.L02.007, hem.L02.008, hem.L02.011]
    recap:
      - "Hb < 14 (رجالة) و < 12 g/dL (ستات)؛ الأنيميا not a diagnosis."
      - "African-Americans أقل بـ 0.5–1 g/dL؛ الحامل: RBC +25% وبلازما +50% = dilutional."
      - "الأنيميا البطيئة ممكن تبقى asymptomatic بـ Hb 5–6؛ النزيف الحاد = hypotension و tachycardia."
      - "Jaundice = haemolysis؛ paraesthesias = B12؛ sore tongue = megaloblastic أو iron."
      - "Abrupt = haemolysis؛ insidious = nutritional."
    practice: [hem.L02.001, hem.L02.002, hem.L02.003, hem.L02.004, hem.L02.005, hem.L02.006, hem.L02.007, hem.L02.008, hem.L02.009, hem.L02.010, hem.L02.011, hem.L02.012, hem.L02.013, hem.L02.014, hem.L02.015]
