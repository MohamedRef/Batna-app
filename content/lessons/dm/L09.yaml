  - id: dm.L09.lesson5
    title: "SGLT2 inhibitors والـ algorithm"
    hook: "دوا بيخلّي الكلى ترمي السكر في البول، وبيحمي القلب والكلى نفسها. وبعدين نرتّب كل الأدوية في جدول واحد."
    minutes: 10
