        quote: "3- Constitutional Symptoms\n  a- Fever in 30% of patients, is continuous or cyclic.\n  b- Weight loss.\n  c- Profuse sweating especially at night.\n  d- Pruritis may be severe, occurs in 25% of cases.\n  e- Fatigue.\n  f- Anorexia and cachexia."
