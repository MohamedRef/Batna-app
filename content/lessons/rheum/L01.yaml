      - kind: reveal
        page: 16
        quote: "The combination of hyperinflammation, coagulopathy, and low platelet counts places patients with cytokine storm at high risk for spontaneous hemorrhage."
        prompt: "ليه المريض ده ممكن ينزف من غير سبب؟"
        answer: "تلاتة مع بعض: **hyperinflammation** + **coagulopathy** + **low platelets**. وممكن الـ DIC يروح ناحية vascular occlusion أو catastrophic hemorrhage."
      - kind: explain
        page: 16
        quote: "The combination of renal dysfunction, endothelial-cell death, and acute-phase hypoalbuminemia can lead to capillary leak syndrome and anasarca."
        title: "ليه بيورم كله (anasarca)؟"
        text: |
          الكتاب بيدّيك تلات أسباب مع بعض، وكل واحد بيزوّد التاني:

          - **Renal dysfunction**: الكلية مش بتطلّع الميه والملح كويس.
          - **Endothelial-cell death**: جدار الشعيرات بيبقى فيه خروم، فالسوايل بتخرج للأنسجة.
          - **Acute-phase hypoalbuminemia**: الكبد مشغول بالـ acute phase proteins، فالـ albumin بيقل، والسوايل مش لاقية حاجة تشدّها جوه الأوعية.

          النتيجة: ==capillary leak syndrome== و **anasarca**. وده كمان سبب من أسباب الـ hypotension والـ shock، عشان السوايل خرجت من الأوعية.
      - kind: explain
        page: 16
        quote: "Many patients have hypertriglyceridemia and various blood-count abnormalities, such as leukocytosis, leukopenia, anemia, thrombocytopenia, and elevated ferritin and d-dimer levels."
        title: "المعمل بيقول إيه؟"
        text: |
          - ==C-reactive protein (CRP)== عالي **في الكل** وماشي مع الـ severity.
          - **Hypertriglyceridemia**.
          - Complete blood count (CBC): leukocytosis أو leukopenia، anemia، thrombocytopenia.
          - **Ferritin** و **D-dimer** عاليين.
          - Cytokines: IFN-γ، IL-6، IL-10، soluble IL-2Rα. الأهم فيها الـ **trend** من الـ baseline.
      - kind: explain
        page: 17
        quote: "Endotoxins (cell wall) bind TLRs on dendritic cells and macrophages leading them to produce."
        title: "Septic shock ضد toxic shock"
        text: |
          الاتنين نهايتهم واحدة: **TNF-α و IL-1β** بكميات مهولة. الفرق في البداية:

          - **Septic shock**: ==endotoxin== من جدار البكتيريا (Staph. aureus، E. coli، Klebsiella) بيمسك **Toll-like receptors (TLRs)** على الـ dendritic cells والـ macrophages.
          - **Toxic shock**: toxin بيشتغل ==superantigen== (Staph. aureus)، بيربط **major histocompatibility complex (MHC) II مع الـ T-cell receptor (TCR)** مع بعض ويشغّل الـ T cell من غير specificity.

          الـ neutralization بالـ monoclonal antibodies ممكن تساعد في الـ septic shock.
      - kind: sort
        page: 17
        quote: "Microorganisms produce toxins that act as Superantigens (Staph. aureus)"
        prompt: "ده septic shock ولا toxic shock؟"
        bins: ["Septic shock", "Toxic shock", "Both"]
        cards:
          - { text: "Endotoxin on TLRs", bin: 0 }
          - { text: "Macrophages and dendritic cells (DCs) respond", bin: 0 }
          - { text: "Superantigen", bin: 1 }
          - { text: "MHC II + TCR bridged", bin: 1 }
          - { text: "T cells activated despite specificity", bin: 1 }
          - { text: "Huge TNF-α and IL-1β", bin: 2 }
        why: "اللي بيفرق هو الـ trigger والخلية: endotoxin على macrophage، ولا superantigen على T cell. الـ cytokines في الآخر نفسها."
      - kind: explain
        page: 17
        quote: "Number of proteins can inhibit cytokine activity:"
        title: "الـ cytokine antagonists: فرامل طبيعية"
        text: |
          في بروتينات بتوقف شغل الـ cytokines بطريقتين:

          1. **تقعد على الـ receptor من غير ما تشغّله**: فالـ cytokine الحقيقي مش لاقي مكان.
          2. **تمسك الـ cytokine نفسه** فيعجز يوصل للـ ==cognate receptor== بتاعه.

          ليه ده مهم؟ عشان دي نفس الفكرة اللي الأدوية اتبنت عليها في الدرس الجاي: الـ **soluble TNF receptor** بيمسك الـ TNF (الطريقة التانية)، والـ antibodies ضد الـ receptor بتقفله (قريبة من الطريقة الأولى). الطبيعة عملتها الأول، والدوا قلّدها.
      - kind: aside
        tone: joke
        page: 17
        quote: "Can bind to receptor but fail to activate the cell, thus blocking the active cytokine from binding, OR Can bind to cytokine, inhibiting its ability to bind to the cognate receptor."
        text: "الـ cytokine antagonist اللي بيقعد على الـ receptor ومايشغلوش زي اللي بيحجز كرسي في المحاضرة بشنطته ومايجيش: الكرسي محجوز والمحاضرة ماحدش حضرها."
      - kind: try
        items: [rheum.L01.093, rheum.L01.096, rheum.L01.104, rheum.L01.109, rheum.L01.112]
    recap:
      - "Storm = too many cytokines too quickly ← shock و MOF. الـ cascade والـ synergism من غير فرامل بيكبّروا الدايرة."
      - "أسباب: infection (flu A، COVID، بكتيريا)، autoimmune، CAR T، high-dose IL-2."
