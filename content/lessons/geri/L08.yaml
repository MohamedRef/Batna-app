        title: "Primary ولا secondary؟"
        quote: "Arthritis is a disease of articular joints that alters the joints biochemically, structurally, and physiologically. There are many classifications for arthritis since it is a heterogeneous, degenerative disorder with multiple etiologies and presentations. Primary or idiopathic arthritis is without a specific or known antecedent and primarily affects the hands, hips, knees, and spine. Secondary arthritis has an underlying cause such as acute trauma or a rheumatologic, metabolic, or infectious disease."
        text: |
          - ==Primary (idiopathic)==: من غير سبب معروف، في **hands، hips، knees، spine**.
          - **Secondary**: وراه سبب: trauma، rheumatologic، metabolic، أو infectious.

          التفسير المقبول (مش في الكتاب) لأماكن الـ primary: الركبة والورك والضهر شايلين **وزن الجسم** كل يوم، ومفاصل الإيد الصغيرة بتشتغل **آلاف المرات** في اليوم. يعني الحِمل المتكرر سنين. والـ secondary لما تلاقي OA في مفصل «غريب» (الكتف أو الكوع مثلًا)، دوّر على سبب: إصابة قديمة أو مرض.
