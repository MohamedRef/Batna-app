  - id: dm.L01.lesson5
    title: "Type 1 ولا 2؟ وبول فيه سكر وبول كتير"
    hook: "جدول من عشر سطور بيفرق بين النوعين، وقايمتين بتحلّ لغز السكر في البول والبول الكتير."
    minutes: 9
    pages: [11, 14]
    topics: [types, glycosuria]
    goals:
      - "تفرّق type 1 من type 2 بالجدول"
      - "تعرّف الـ prediabetes وأهميته"
      - "تعدّ أسباب الـ renal glycosuria والـ polyuria"
    status: unverified
    steps:
      - kind: explain
        page: 12
        title: "Type 1 أنواع"
        quote: "Rapidly progressive young. Slowly progressive LAD A (Late onset Autoimmune Diabetes in the Adulthood). 2- Idiopathic non-immune mediated."
        text: |
          **Type 1:**
          - **Autoimmune:** rapidly progressive (صغيرين)، أو slowly progressive = ==LADA== (Late-onset Autoimmune Diabetes in Adulthood).
          - **Idiopathic** non-immune mediated.

          **Type 2:** obese (**80%**، resistant)، non-obese (**20%**، secretory)، و **MODY** (Maturity Onset Diabetes of the Young).
      - kind: explain
        page: 12
        title: "علامات الـ type 1 السريع"
        quote: "Ketosis-prone (up to 30% of cases presented by DKA)."
        text: |
          **Clinical:** أقل من **30 سنة**، presentation classic حاد، **never obese**، ==ketosis-prone== (لحد **30%** بييجوا بـ **DKA**)، والـ insulin **required for survival**.

          **Lab:** insulin و **C-peptide** absent أو very low، **GAD-Abs، ICA، insulin autoantibodies**، و **HLA-DR3/DR4**.
      - kind: table
        page: 13
        quote: "Comparative clinical features of type 1 and type 2 diabetes"
        title: "Type 1 vs type 2"
        columns: [Feature, T1, T2]
        rows:
          - ["Age", "<30", ">30"]
          - ["Symptoms", "Days–weeks", "Months–years"]
          - ["Weight", "Never obese", "Obese"]
          - ["Ketonuria", "Yes", "No"]
          - ["Family history", "No", "Yes"]
          - ["C-peptide", "Absent/low", "Normal/high"]
          - ["HLA, antibodies", "Yes", "No"]
          - ["Complications", "No", "10–20%"]
        hide: [[0, 1], [3, 1], [4, 2], [5, 1], [5, 2], [7, 2]]
      - kind: aside
        tone: trap
        page: 13
        quote: "Comparative clinical features of type 1 and type 2 diabetes"
        text: "فخ: الـ **family history** في جدول الكتاب **Yes لـ type 2** و **No لـ type 1**. منطقها إن type 2 **multigenic** وبيجري في العيلة بقوة، أما type 1 فأغلبه بييجي في عيلة مفيهاش حد."
      - kind: check
        page: 12
        quote: "Slowly progressive LAD A (Late onset Autoimmune Diabetes in the Adulthood)."
        question: "42-year-old non-obese man on tablets for a year now needs insulin; GAD antibodies positive. Diagnosis?"
        options: ["LADA", "Rapidly progressive type 1", "Obese type 2", "MODY"]
        answer: 0
        why:
          - "صح: autoimmune، **slowly progressive**، و adult."
          - "الـ rapid صغير (<30) وحاد."
          - "مش obese وعنده antibodies."
          - "الـ MODY مفيهوش autoantibodies، والكتاب حاطه تحت type 2."
      - kind: explain
        page: 13
        title: "الـ Prediabetes: مش مرض، بس جرس إنذار"
        quote: "IFG and IGT are not clinical entities but are risk factors for: 1- Cardiovascular /cerebrovascular diseases"
        text: |
          **Prediabetes** = metabolic stage ==بين الطبيعي والـ diabetes==: **IFG (100–125)** و/أو **IGT (140–199)**. اسمه كمان borderline، subclinical، early diabetes.

          الـ IFG والـ IGT **not clinical entities**، لكنهم risk factors لـ:
          1. **Cardiovascular / cerebrovascular disease**
          2. **diabetes** بعد كده (predictor)
          3. سكر في رينج الـ diabetes بيبان مع الـ **stress**
      - kind: explain
        page: 14
        title: "سكر في البول: الدم بيقول إيه؟"
        quote: "Pregnancy: The commonest cause. It is due to a lower renal threshold for glucose excretion."
        text: |
          - **Glycosuria + سكر دم عالي** = **diabetes**.
          - **Glycosuria + سكر دم طبيعي أو واطي** = ==renal glycosuria==.

          أسباب الـ renal glycosuria:
          1. **Pregnancy:** **the commonest cause** (renal threshold أوطى).
          2. **Tubular dysfunction**.
          3. **Benign renal glycosuria:** rare، inherited، asymptomatic، كلى طبيعية.
          4. **False positive:** lactosuria، fructosuria، ascorbic aciduria.
      - kind: figure
        page: 14
        quote: "Pituitary: impaired production of ADH: Cranial diabetes insipidus."
        title: "الـ Polyuria: من الدماغ للكلية"
        alt: "A vertical map. Pituitary: low ADH, cranial diabetes insipidus. Kidney, no response to ADH: nephrogenic DI, Fanconi. Kidney, solute load: diabetes mellitus. Kidney, low concentrating capacity: early CRF, hydronephrosis, hypercalcemia, hypokalemia. Drugs: diuretics. Others: psychogenic drinking."
