      - kind: explain
        page: 108
        quote: "| Drugs | Drug | TFT patterns | Comments |\n|---|---|---|---|\n| Drugs affecting TSH secretion | Dopamine agonists | ↓TSH (often transient), → (or mild ↓) FT4 | Intravenous infusion of dopamine or oral dopamine agonist therapy can suppress TSH secretion via activation of D2 receptors on pituitary thyrotrophs; however, clinically relevant central hypothyroidism does not usually occur, although some studies have suggested that dopamine infusion in a critically ill subject with concomitant NTI may result in genuine hypothyroidism |\n|  | Glucocorticoids | ↓TSH (often transient), → (or mild ↓) FT4 | Glucocorticoid-mediated inhibition of hypothalamic TRH synthesis/release (acting via glucocorticoid receptors in the paraventricular nucleus) results in reduced pituitary TSH secretion; however, chronic hypercortisolism (endogenous or exogenous) is not generally associated with clinically significant central hypothyroidism |\n|  | Somatostatin analogues | ↓TSH (often transient), → (or mild ↓) FT4 | Both octreotide and lanreotide suppress pituitary TSH secretion through a direct inhibitory action on pituitary thyrotrophs; however, this effect is usually transient and not associated with clinically significant central hypothyroidism |\n|  | Rexinoids | ↓TSH, ↓FT4 | Bexarotene (Targretin®) has been linked to the development of biochemical and, in a significant proportion of patients, clinical hypothyroidism when used to treat patients with cutaneous T-cell lymphoma; inhibition of TSHβ transcription leads to decreased TSH production; additional effects on TH metabolism (deiodination, sulphation) have also been reported |\n|  | Metformin | ↓TSH, → FT4 | Several observational studies have reported an apparent TSH lowering effect of metformin therapy in patients with diabetes; however, whether this effect is limited to those with pre-existing disorders of the HPT axis, especially subjects with an elevated TSH (reflecting central activation of the axis) remains unclear, and further studies are required |\nWolff-Chaikoff effect = impairment of T4 and T3 synthesis by high intrathyroidal concentrations of iodine."
        title: "أدوية بتوطّي الـ TSH"
        text: |
          - **Dopamine/agonists**: على الـ D2 في الـ thyrotrophs.
          - **Glucocorticoids**: بتقفل الـ thyrotropin-releasing hormone (TRH) من الـ paraventricular nucleus.
          - **Somatostatin analogues**: octreotide و lanreotide على الـ thyrotrophs مباشرة.
          - **Metformin**: TSH بيقل ظاهريًا، و FT4 طبيعي.

          كلهم عادةً ==transient== ومن غير central hypothyroidism مهم.
