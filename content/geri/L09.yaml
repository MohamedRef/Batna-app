  - id: geri.L09.044
    kind: card
    topic: covid
    front: In the lecture's age figure, what rises and what falls in the immune system with chronological age in COVID-19?
    back: Pro-inflammatory cytokines and terminally differentiated memory T and B cells rise; the naive T-cell amount falls, shifting from an adaptive response towards cytokine storm and organ failure.
    src: { page: 164, quote: "Figure: with chronological age, SARS-CoV-2 drives naive CD4+ and CD8+ T cells to activated cells and B cells to plasma cells (IgG, IgM) in the young; in the old, a cytokine storm (↑ IL-6, IFN-γ, IL-2, IL-8), disruption of the airway epithelium barrier with secondary bacterial infection and acute inflammation, and endothelial damage in the microcirculation with disseminated intravascular coagulation and organ failure. With age, pro-inflammatory cytokines and memory T and B cells terminally differentiated increase, naive T cell amount decreases: from adaptive immune response to cytokine storm and organ failure.\nPhysical activity &Immune System\nFigure a: with aging, immune function and habitual physical activity level fall, while risk of chronic age-related diseases, risk of all-cause mortality, less effective vaccine responses, viral and bacterial infection, cognitive decline and frailty rise.\nFigure b: exercise and physical activity give reduced risk of chronic age-related diseases, reduced risk of all-cause mortality, lower cardiometabolic risk factors, improved muscle mass and function, lower systemic inflammation, anti-inflammatory profile, improved vaccine responses: ameliorated age-related disturbances in the immune system." }
    status: unverified
