    src: { page: 185, quote: "Similar to AS, familial TBMN is an inherited GBM disorder mani-fested by chronic hematuria, but it differs clinically from AS in several important respects:\n(1) Extrarenal abnormalities are rare\n(2) Proteinuria, hypertension, and progression to ESRD are unusual, seen in less than 10% of affected individuals, and extremely unusual before age 40.\n(3) Gender differences in expression of TBMN are not apparent.\n(4) Transmission is autosomal dominant." }
