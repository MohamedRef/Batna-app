        answer: |
          الكتاب بيقول في **stage VI** إن الـ insulin والـ **C-peptide** **absent or very low**.

          التفسير المقبول (مش في الكتاب): البنكرياس بيعمل **proinsulin** وبيقطعه نصين: insulin و C-peptide، بنفس العدد بالظبط. الـ insulin اللي في الحقنة مفيهوش C-peptide. فلو قست insulin هتقيس الحقنة، ولو قست ==C-peptide== هتقيس اللي البنكرياس لسه بيعمله. ده نفس سؤال الكتاب في آخر المحاضرة عن الـ C-peptide.
