  - id: res.L09.lesson12
    title: "اذكر نفسك واكتب الـ references: وحل الأمثلة"
    hook: "حتى شغلك القديم لازم يتوثق. هنا آخر طريقتين، وبعدين تحكم بنفسك: plagiarism ولا لأ؟"
    minutes: 6
    pages: [128, 139]
    topics: [avoid]
    goals:
      - "تطبق الـ citing yourself والـ referencing"
      - "تحكم على أمثلة: plagiarism ولا لأ"
    status: unverified
    steps:
      - kind: explain
        page: 128
        quote: "5) Citing your own material\n  If some of the material you are using for your research paper was used by you in your current class, a previous one, or anywhere else you must cite yourself. Treat the text the same as you would if someone else wrote it.\n  Using material you have used before is called self-plagiarism, and it is not acceptable."
        title: "5 و 6: نفسك والـ references"
        text: |
          - **Citing your own material**: لو استخدمت حاجة كتبتها قبل كده (في كورس، أو بحث قديم، أو أي مكان) لازم **تذكر نفسك**، وتعامل النص كأن حد تاني كتبه. غير كده = **self-plagiarism**.
          - **Referencing** (slide 129): صفحة references في الآخر حسب نظام المؤسسة، فيها **المؤلف، التاريخ، العنوان، والمصدر**.
      - kind: aside
        tone: joke
        page: 128
        quote: "5) Citing your own material\n  If some of the material you are using for your research paper was used by you in your current class, a previous one, or anywhere else you must cite yourself. Treat the text the same as you would if someone else wrote it.\n  Using material you have used before is called self-plagiarism, and it is not acceptable."
        text: |
          «بس ده كلامي أنا!» حجة مش هتنفع. نسخ نفسك من غير citation زي إنك تبيع نفس الشقة لاتنين: الشقة شقتك فعلًا، بس الاتنين اتنصب عليهم.
      - kind: explain
        page: 129
        quote: "6) Referencing\n  It is including a reference page or page of works cited at the end of your research paper.\n  This page must meet the document formatting guidelines used by your educational institution.\n  This information is very specific and includes the author(s), date of publication, title, and source. Follow the directions for this page carefully."
        title: "الـ reference page"
        text: |
          الـ **referencing** إنك تحط ==reference page== (أو works cited) في آخر البحث.

          - لازم تمشي على ==الـ formatting guidelines== بتاعة مؤسستك.
          - بتشمل: ==الكاتب، تاريخ النشر، العنوان، والمصدر==.

          ليه بالتفصيل ده؟ لأن الـ citation في النص مجرد إشارة، والـ reference page هي اللي بتوصّل القارئ للمصدر نفسه. التفسير المقبول (مش في الكتاب).
      - kind: check
        page: 136
        quote: "Q1: Paraphrasing properly is to:\n  Change a few words to make it your own and cite it\n  Put quotation marks around the text and cite it\n  Use only the idea without citing it\n  Summarize the text in your own words and cite it"
        question: "Paraphrasing properly is to:"
        options: ["Summarize the text in your own words and cite it", "Change a few words to make it your own and cite it", "Put quotation marks around the text and cite it", "Use only the idea without citing it"]
        answer: 0
        why:
          - "صح: المعنى بكلامك + citation."
          - "تغيير كام كلمة = patch writing حتى لو عملت citation."
          - "ده quoting مش paraphrasing."
          - "الفكرة نفسها محتاجة citation."
      - kind: explain
        page: 137
        quote: "Q2: You re-use paragraphs from a paper you wrote last semester and put it into a new assignment, and you don't cite it because it's your own work. Is this plagiarism?\n  Yes, it is self-plagiarism.\n  No, because it is my own work."
        title: "شغلك القديم من غير citation"
        text: |
          السؤال: استخدمت فقرات من بحث كتبته ==الترم اللي فات== في assignment جديد، ومعملتش citation لأنه ==شغلك==.

          الإجابة: ==Yes، ده self-plagiarism==.

          ليه؟ شغلك القديم مصدر زي أي مصدر، ولازم يتوثق علشان القارئ يعرف إنه مش جديد.
      - kind: check
        page: 138
        quote: "Q3: You paraphrase an idea you really like from a reading and put it in the essay you are working on. It's in your own words, so you don't bother with a citation. Is this plagiarism?\n  Yes, because plagiarism applies to both words and ideas.\n  No, because I paraphrased."
        question: "You paraphrase an idea you like, in your own words, with no citation. Is it plagiarism?"
        options: ["Yes, plagiarism applies to both words and ideas", "No, because I paraphrased", "Only if I copied more than two words in a row"]
        answer: 0
        why:
          - "صح: الـ plagiarism على الكلام **والأفكار**."
          - "الـ paraphrase بيغير الكلام، مش صاحب الفكرة."
          - "قاعدة الكلمتين بتقولك إمتى تحط علامات تنصيص؛ الفكرة محتاجة citation في كل الأحوال."
      - kind: explain
        page: 139
        quote: "Is this plagiarism?\nNOT plagiarism\n  - The student enclosed the quoted verbatim text within quotation marks.\n  - A citation is provided within the text\n  - the source is provided in the bibliography/ reference."
        title: "إمتى النص المنقول مش plagiarism؟"
        text: |
          مثال السلايد ==NOT plagiarism== لأن فيه التلاتة:

          1. النص المنقول بالحرف ==بين علامات تنصيص==.
          2. فيه ==citation جوه النص==.
          3. المصدر موجود في الـ bibliography/references.

          ليه التلاتة؟ العلامات بتقول «ده مش كلامي»، والـ citation بتقول «ده كلام مين»، والـ reference بتقول «تلاقيه فين». التفسير المقبول (مش في الكتاب).
      - kind: figure
        page: 139
        quote: "NOT plagiarism - The student enclosed the quoted verbatim text within quotation marks. - A citation is provided within the text - the source is provided in the bibliography/ reference."
        title: "التلات علامات اللي بتنقذك"
        alt: "A sample paragraph with exact words in quotation marks, marked 1, followed by an in-text citation, marked 2, and an arrow down to a references list entry, marked 3. Key: 1 quotation marks, not my words; 2 in-text citation, whose words; 3 reference, where to find them."
        caption: |
          مثال slide 139 مفكوك على فقرة صغيرة (الاسم والسنة مثال):

          1. ==علامات التنصيص== حوالين الكلام المنقول بالحرف.
          2. ==الـ citation== جنبه جوه النص.
          3. ==الـ reference== كامل في القايمة اللي في الآخر.

          لو واحدة من التلاتة ناقصة بقى فيه مشكلة: من غير علامات = نسخ، من غير citation = القارئ مايعرفش صاحبه، من غير reference = مايقدرش يوصل له. ولو paraphrase بكلامك بتسيب 1 بس، و2 و3 لازم يفضلوا.
