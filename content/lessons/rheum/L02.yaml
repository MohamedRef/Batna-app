  - id: rheum.L02.lesson7
    title: "الـ pseudogout: النقرس بتاع الركبة الكبيرة"
    hook: "ست عندها 70 سنة، ركبتها ورمت بعد عملية. مش gout: دي البلورة التانية."
    minutes: 8
    pages: [48, 51]
    topics: [pseudogout]
    goals:
      - "تعرف مين بيجيله الـ pseudogout وفين"
      - "تفرّق بلورة CPPD عن MSU"
      - "تعرف الأسباب الـ metabolic والعلاج"
    status: unverified
    steps:
      - kind: explain
        page: 48
        quote: "the knee is most commonly affected followed by wrist, shoulder and ankle"
        title: "يعني إيه pseudogout؟"
        text: |
          ==CPPD== deposition disease. Mono أو oligoarticular: **الركبة أولًا**، بعدها wrist و shoulder و ankle.

          بيقلّد gout و RA و AS و haemarthrosis و neuropathic joint. وفكّر فيه في أي **degenerative arthritis توزيعها غريب**.

          البلورات بتتكون من **calcium + pyrophosphate** زيادة محليًا (الـ pyrophosphate ناتج طبيعي من ATP ← AMP).
      - kind: table
        page: 48
        quote: "Pseudogout may be acute or chronic and is primary (esp. in elderly), familial or secondary (hypothyroidism, hyperparathyroidism, hypomagnesemia)."
        title: "الأنواع والأسباب"
        columns: ["Type", "Details"]
        rows:
          - ["Primary / sporadic", "Elderly, ageing, over 55; common"]
          - ["Familial", "Rare"]
          - ["Secondary", "Hypothyroidism, hyperparathyroidism, hypomagnesaemia"]
          - ["Metabolic", "Haemochromatosis, hyperparathyroidism, Wilson's"]
        hide: [[2, 1], [3, 1]]
      - kind: mnemonic
        page: 48
        quote: "Metabolic disease associated form rare {haemochromatosis, hyperparathyroidism, Wilson's disease}."
        word: "HHHW"
        hook: "«Three H and a W»: الأسباب الـ metabolic والثانوية في الكتاب."
        parts:
          - { key: "H", text: "Haemochromatosis" }
          - { key: "H", text: "Hyperparathyroidism" }
          - { key: "H", text: "Hypothyroidism و hypomagnesaemia" }
          - { key: "W", text: "Wilson's disease" }
      - kind: explain
        page: 49
        quote: "Commonest cause of acute monoarthritis of the elderly."
        title: "الصورة الإكلينيكية"
        text: |
          - ستات **65-75** أكتر؛ الركبة ثم الـ wrist والـ pelvis.
          - ==أشهر سبب acute monoarthritis في كبار السن==.
          - Trigger: **trauma أو illness** (عملية مثلًا).
          - شبه الـ gout: وجع وورم وسخونية و effusion وأحمرار و fever.
          - Self-limiting بس بياخد **1-3 أسابيع** (أطول من الـ gout).
          - **Chronic** في ستات كبار: وجع مزمن و morning/inactivity stiffness وشكل OA.
      - kind: figure
        page: 50
        title: "البلورتين تحت الـ polarized light"
        image: { file: rheum/L02-crystals-polarized.webp, book: true }
        caption: "شمال: بلورة MSU إبرة صفرا جوه neutrophil. في النص: إبر urate صفرا وزرقا حسب اتجاهها. يمين: بلورة CPPD rhomboid زرقا."
        alt: "Book figure from page 50. Left: a needle-shaped monosodium urate crystal inside a neutrophil under compensated polarized light, labelled yellow, with the planes of the polariser, analyser and slow vibration marked. Middle: many yellow and blue needles on a pink background. Right: a single blue rhomboid crystal."
      - kind: table
        page: 49
        quote: "weakly positive birefringent rhomboid shaped crystals."
        title: "Gout ضد pseudogout"
        columns: ["", "Gout", "Pseudogout"]
        rows:
          - ["Crystal", "MSU", "CPPD"]
          - ["Birefringence", "Negative", "Weakly positive"]
          - ["Shape", "Needle", "Rhomboid"]
          - ["Joint", "First MTP", "Knee"]
          - ["Patient", "Man 40-50", "Woman 65-75"]
          - ["Attack", "5-14 days", "1-3 weeks"]
        hide: [[1, 2], [2, 2], [3, 2]]
      - kind: aside
        tone: tip
        page: 49
        quote: "compensated polarized microscopy demonstrates CPPD crystals-weakly positive birefringent rhomboid shaped crystals."
        text: "Pseudogout = «P» لـ Positive و Pyrophosphate و Parallelogram (rhomboid). Gout = Needle و Negative. وفي الـ pseudogout الـ fluid بيكون turbid و blood stained، فماتتلخبطش وتقول haemarthrosis."
      - kind: case
        page: 49
        quote: "Metabolic screening (serim calcium, alkaline phosphatase, liver function-esp in early onset polyarticular disease."
        stem: "A 46-year-old man has recurrent acute arthritis of both knees and a wrist. X-ray: chondrocalcinosis of the menisci and the triangular ligament."
        steps:
          - question: "What does early-onset polyarticular CPPD call for?"
            options: ["A metabolic screen", "Urate-lowering therapy", "HLA-B27"]
            answer: 0
            why: "Metabolic screening (calcium، alkaline phosphatase، liver function) خصوصًا في الـ early-onset polyarticular."
          - reveal: "Ferritin and transferrin saturation are very high."
            question: "Likely cause?"
            options: ["Haemochromatosis", "Wilson's disease", "Hypothyroidism"]
            answer: 0
            why: "الحديد العالي = haemochromatosis، واحد من الأسباب الـ metabolic."
      - kind: explain
        page: 50
        quote: "For acute pseudogout = aspiration reduces pain and alone may be sufficient."
        title: "العلاج"
        text: |
          - ==Aspiration==: بيخفف الوجع، وممكن **لوحده يكفي**.
          - **Intra-articular steroid**.
          - **Oral NSAID**.
          - **Early mobilization**.
          - الـ chronic arthropathy: **زي الـ OA**.

          ومفيش «ULT» للـ CPPD: مفيش دوا بيشيل البلورة دي.
