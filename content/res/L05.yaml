    src: { page: 67, quote: "Prospective versus Retrospective Cohort Studies\n| | Exposure | Outcome |\n|---|---|---|\n| Prospective | Assessed at the beginning of the study (present) | Followed into the future for outcome |\n| Retrospective | Assessed at some point in the past | Outcome has already occurred |" }
