          - { key: "C", text: "Cycler overnight + manual day exchanges (3rd trimester)" }
          - { key: "T", text: "Tidal PD: leave 15% in to cut drain pain and reflux" }
          - { key: "D", text: "Dextrose 4.25%: minimize it" }
          - { key: "L", text: "Lateral decubitus while draining" }
        hook: "**S**mall **C**ycles **T**ake **D**elicate **L**adies: كل حاجة في الـ PD بتصغر وتكتر مع الرحم."
      - kind: explain
        page: 381
        title: "كل تعديل وسببه"
        quote: "Use tidal peritoneal dialysis, which leaves 15% of the dwell volume in situ while draining, to reduce drain pain and gastroesophageal reflux."
        text: |
          التعديلات من Fig 5، والسبب بعضه من الكتاب وبعضه التفسير المقبول (مش في الكتاب):

          - **Dwell أصغر وexchanges أكتر** (cycler من التاني): عشان المساحة قلّت.
          - **Manual بالنهار + cycler بالليل** في التالت: عشان الحجم لازم يقل أكتر، فمحتاج تعويض.
          - ==Tidal PD== (يسيب **15%** جوه): الكتاب بيقول يقلل **drain pain** و **reflux**. التفسير: البطن مش بتفضى خالص، فالرحم والمعدة مش بيتشدّوا.
          - **قلل الـ 4.25% dextrose:** التفسير المقبول (مش في الكتاب): السكر العالي بيتمص ويعلّي سكر الأم والجنين.
          - **Lateral decubitus** وقت الـ drain: عشان الرحم مايقفلش على الـ catheter.

          والـ residual urine **أكتر من 500 mL** = نتيجة أحسن، لأن ==the lesser the uremic milieu, the better the fetal outcomes==.
