            <text x="130" y="38" text-anchor="middle" class="t-sm t-b">Albumin</text>
            <text x="130" y="54" text-anchor="middle" class="t-sm">&gt;30 mg/g</text>
            <path d="M168 42 H182" class="fg-arrow" marker-end="url(#L03k)"/>
            <rect x="184" y="20" width="66" height="44" rx="8" class="fg-acc"/>
            <text x="217" y="38" text-anchor="middle" class="t-sm t-b">GFR</text>
            <text x="217" y="54" text-anchor="middle" class="t-sm">&lt;60</text>
            <path d="M250 42 H262" class="fg-arrow" marker-end="url(#L03k)"/>
            <rect x="264" y="20" width="60" height="44" rx="8" class="fg-ink"/>
            <text x="294" y="47" text-anchor="middle" class="t-sm t-b">ESRD</text>
            <path d="M175 64 C175 110 150 130 150 150" class="fg-arrow-bad" stroke-width="4" marker-end="url(#L03kb)"/>
            <rect x="60" y="152" width="180" height="50" rx="10" class="fg-bad"/>
            <text x="150" y="174" text-anchor="middle" class="t-b">CVD death</text>
            <text x="150" y="192" text-anchor="middle" class="t-sm">most, before dialysis</text>
          </svg>
      - kind: aside
        tone: trap
        page: 27
        quote: "Diabetic Kidney Disease\n  Persistent albuminuria >30 mg/ g creatinine and/or decrease in GFR < 60 ml/min/1.73m2 in the absence of signs or symptoms of other primary causes of kidney damage.\n  DKD occurs in 20–40% of patients with diabetes and is the leading cause of ESRD.\n  The risk of DKD in type 2 diabetes seems to be similar to that in type 1 diabetes.\n  Although ESRD may be the most recognizable consequence of DKD, the majority of patients actually die from CVD before needing kidney replacement therapy."
        text: "فخ: الـ ESRD هو أشهر نهاية للـ diabetic kidney disease (DKD)، بس **أغلب العيانين بيموتوا بالـ cardiovascular disease (CVD)** قبل ما يوصلوا للـ dialysis. يعني علاج الـ DKD هو علاج القلب كمان."
      - kind: check
        page: 27
        quote: "Although ESRD may be the most recognizable consequence of DKD, the majority of patients actually die from CVD before needing kidney replacement therapy."
        question: "What do most patients with diabetic kidney disease actually die of?"
        options: ["Cardiovascular disease, before needing dialysis", "End-stage renal disease on dialysis", "Hyperkalaemia", "Infection of the urinary tract"]
        answer: 0
        why:
          - "صح: الكتاب بيقول **the majority** بيموتوا بالـ **CVD** قبل الـ kidney replacement therapy."
          - "الـ ESRD أشهر نتيجة، بس مش أشهر سبب وفاة."
          - "مش مذكور كسبب وفاة في الكتاب."
          - "مش مذكور في الكتاب."
      - kind: explain
        remind: [dm.L03.008]
        page: 28
        title: "Risk factors"
        quote: "Risk factors for diabetic kidney disease:\n  The level of glycemia and glycosylated hemoglobin seems to be the strongest factor influencing the onset of albuminuria.\n  Several factors besides hyperglycemia influence the development of several stages of diabetic nephropathy, including:\n    3- Hypertension.\n    4- Cigarette smoking.\n    5- Hyperlipidemia.\n    6- Genetic susceptibility."
        text: |
          أقوى عامل لبداية الـ albuminuria: ==مستوى السكر والـ A1C==.

          وبجانبه: **hypertension**، **smoking**، **hyperlipidemia**، **genetic susceptibility**.

          ليه السكر الأقوى؟ لأنه هو اللي بيبدأ الضرر في الـ glomerulus، والباقيين بيسرّعوه. والتفسير المقبول (مش في الكتاب): الـ **hypertension** بتزوّد الضغط جوه الـ glomerulus فيسرّب أكتر، والتدخين والـ hyperlipidemia بيأذوا الأوعية الصغيرة نفسها، والجينات بتفسر ليه مش كل مريض سكر بيجيله DKD حتى مع نفس السكر. يعني كل risk factor هو حاجة تقدر **تعالجها** ما عدا الجينات.
      - kind: try
        items: [dm.L03.001, dm.L03.002, dm.L03.003, dm.L03.006, dm.L03.008]
    recap:
      - "Tight control: A1C ~7، FPG 80–130، peak PPG ~180؛ بيمنع أو يبطّأ الـ microvascular في النوعين."
      - "DKD: albuminuria >30 mg/g (persistent) و/أو GFR <60، من غير سبب كلوي تاني؛ 20–40%؛ أول سبب للـ ESRD؛ type 2 زي type 1."
      - "أغلبهم بيموتوا CVD قبل الـ dialysis."
      - "أقوى risk factor: السكر والـ A1C؛ وبعده hypertension، smoking، hyperlipidemia، genes."
    practice: [dm.L03.001, dm.L03.002, dm.L03.003, dm.L03.004, dm.L03.005, dm.L03.006, dm.L03.007, dm.L03.008, dm.L03.069, dm.L03.080]
