  - id: endo.L02.lesson5
    title: "الغدة الدرقية في الحمل: hyper و hypo"
    hook: "الـ total T4 عالي، والغدة كبيرة، والنبض سريع. وكل ده ممكن يبقى حمل طبيعي."
    minutes: 9
    pages: [25, 28]
    topics: [thyroid-screening, hyperthyroid, hypothyroid]
    goals:
      - "تعرف مين نعمله thyroid screening في الحمل"
      - "تشخّص الـ hyperthyroidism صح وتعرف خطر الـ TSHR antibodies"
      - "تعرف مضاعفات الـ hypothyroidism وعلاجه"
    status: unverified
    steps:
      - kind: explain
        page: 25
        quote: "SCREENING FOR THYROID DYSFUNCTION DURING PREGNANCY"
        title: "مين نعمله screening؟"
        text: |
          ==عشر فئات==:
          1. تاريخ hyper أو hypo، أو PPT، أو lobectomy.
          2. Family history.
          3. Goiter.
          4. Thyroid antibodies معروفة.
          5. أعراض أو علامات، ومنها anemia، cholesterol عالي، hyponatremia.
          6. Type 1 diabetes.
          7. أمراض autoimmune تانية.
          8. Infertility (TSH من ضمن الـ work-up).
          9. Head or neck irradiation.
          10. Miscarriage أو preterm delivery قبل كده.
      - kind: mnemonic
        page: 25
        quote: "Immunological modifications. Relative iodine deficiency. Changes in thyroid hormone metabolism Direct effect of HCG on the thyroid gland."
        word: "IIMH"
        parts:
          - { key: "I", text: "Immunological modifications" }
          - { key: "I", text: "Iodine: relative deficiency" }
          - { key: "M", text: "Metabolism of thyroid hormone changes" }
          - { key: "H", text: "hCG acts directly on the thyroid" }
        hook: "الحمل بيلعب في الغدة بـ 4 طرق: **I-I-M-H**. الـ hCG شبه الـ TSH، فبيقدر ينبّه الغدة نفسها."
      - kind: explain
        page: 26
        quote: "the combination of elevated FT4 and suppressed TSH levels (0.1 mu/L)"
        title: "تشخيص الـ hyperthyroidism"
        text: |
          الحمل والـ hyperthyroidism الاتنين فيهم: thyroid enlargement، hyperdynamic circulation، و ==total T3 و T4 عاليين==.

          ==أدق تحليل==: **FT4 عالي + TSH suppressed (0.1 mU/L)**.

          وأي ست عندها **severe hyperemesis gravidarum** نعملها thyroid function.
      - kind: reveal
        page: 26
        quote: "In both conditions total T3 and T4 are elevated."
        prompt: "ليه الـ total T4 مينفعش في الحمل؟"
        answer: "الـ estrogen بيعلّي الـ thyroid-binding globulin، فالـ total (bound + free) بيعلى حتى لو الست euthyroid. علشان كده نعتمد على الـ free T4 مع الـ TSH. (الربط بالـ TBG فسيولوجيا مقبولة؛ الكتاب ذكر إن الـ total عالي في الاتنين.)"
      - kind: sort
        page: 26
        quote: "the risk of fetal & neonatal hyperthyroidism depends on level of TSHR antibody in mother"
        prompt: "خطر الـ fetal/neonatal hyperthyroidism:"
        bins: ["Negligible", "Measure TSHR antibodies"]
        cards:
          - { text: "Euthyroid, had ATDs in the past, none now", bin: 0 }
          - { text: "Euthyroid after radioiodine", bin: 1 }
          - { text: "Euthyroid after thyroid surgery", bin: 1 }
          - { text: "On ATDs for active Graves' (recheck 3rd trimester)", bin: 1 }
        why: "اللي خدت أدوية بس، الـ antibodies اختفت غالبًا. اللي اتعالجت بـ RAI أو جراحة، الغدة راحت بس الـ antibodies ممكن تكون لسه موجودة وتعدّي للجنين. ولو الـ titres منزلتش في التاني، فكّر في fetal hyperthyroidism."
      - kind: explain
        page: 27
        quote: "RAI is absolutely contraindicated."
        title: "علاج Graves' في الحمل"
        text: |
          - ==Antithyroid drugs بأقل جرعة==.
          - الـ **iodine** مينفعش كعلاج لأي مدة.
          - ==RAI absolutely contraindicated==.
          - الـ propranolol: محل جدل.
          - بعد الولادة: ATDs، ونتابع TSH و thyroxine بتوع البيبي.

          لو مش متحكم فيه: preeclampsia، fetal malformations، premature delivery، low birth weight.
      - kind: table
        page: 28
        quote: "Premature birth. Fetal and perinatal death. Disorders of brain development. Low IQ Scores. Fetal respiratory distress. Low birth weight. Cretinism."
        title: "مضاعفات الـ hypothyroidism"
        columns: ["Mother", "Fetus"]
        rows:
