  # Split from lesson7 on 2026-11-13 (#828): PNH differential diagnosis and treatment (p54–56).
  - id: hem.L03.lesson12
    title: "الـ PNH: تشك فيه إمتى وتعالجه إزاي"
    hook: "Coombs سالب، LDH عالي، وجلطة في مكان غريب؟ فكّر في الـ PNH. والعلاج كله إنك توقف الـ complement في المكان الصح."
    minutes: 8
    pages: [54, 56]
    topics: [pnh]
    goals:
      - "تعرف الحالات اللي لازم تفكّر فيها في الـ PNH"
      - "تفرّق الـ C5 inhibitors عن الـ C3 inhibitor وتعرف خطر الـ Neisseria"
      - "تعرف علاج الأنيميا والكلى والنخاع، والعلاج الشافي"
    status: unverified
    steps:
      - kind: explain
        page: 54
        title: "إمتى تفكّر في الـ PNH؟"
        quote: "Pancytopenia in association with hemolysis, whether or not the marrow is cellular"
        text: |
          الكتاب بيقول فكّر في الـ PNH في أي عيان عنده:
          - **Intravascular haemolysis** (LDH عالي) من غير سبب، و ==Coombs سالب==، بـ haemoglobinuria ظاهرة أو من غيرها، وغالبًا معاه **iron deficiency**.
          - **Pancytopenia مع haemolysis**، سواء النخاع cellular أو لأ.
          - **Venous thrombosis في أماكن غريبة**: intra-abdominal، cerebral، dermal، وغالبًا معاها علامات haemolysis.
          - نوبات متكررة من غير تفسير: **ألم بطن**، **ألم ضهر**، **صداع**، مع haemolysis مزمن.
          - ==Budd-Chiari syndrome==.

          ليه الحاجات دي بالذات؟ لأن كل واحدة فيها ضلع من الـ triad (haemolysis، pancytopenia، thrombosis)، وكل ما الأضلاع تتجمع، الـ PNH يقرب. والألم في البطن والضهر والصداع من **نقص الـ NO**.
      - kind: explain
        page: 54
        title: "العلاج"
        quote: "Patients with PNH who develop acute thrombosis should immediately be started on eculizumab or ravulizumab, if they are not already taking it."
        text: |
          **الجلطة الحادة**: ==eculizumab أو ravulizumab فورًا== + **heparin**، وبعدين **warfarin**. ليه الاتنين؟ الـ anticoagulant بيعالج الجلطة اللي حصلت، والـ complement inhibitor بيقلل **امتداد** الجلطة أو رجوعها لأنه بيوقف السبب.

          **Complement inhibitors**:
          - **Eculizumab** و **ravulizumab**: ضد ==C5==؛ بيقللوا الـ intravascular haemolysis والنقل.
          - **Pegcetacoplan**: ضد ==C3==؛ بيتحكم في الـ intravascular **و** الـ extravascular.
          - بيقللوا الجلطات (أشهر سبب وفاة).
          - الخطر: **Neisseria meningitidis** (زي نقص الـ complement الوراثي)، فلازم التطعيم. التفسير المقبول (مش في الكتاب): الجسم بيقتل الـ Neisseria بالذات بالـ **MAC**، فلما تقفل الـ C5 بتقفل السلاح ده.

          **Steroids**: الـ complement بيتأثر بيها **بشكل ضعيف**، بس بجرعات عالية. Prednisone 20–40 mg/day (0.3–0.6 mg/kg) وقت الـ haemolysis، وتبقى يوم ويوم في الـ remission. حوالي 70% الـ Hb بيتحسن، بس الاستخدام الطويل مليان مضاعفات.
      - kind: figure
        page: 55
        quote: "Pegcetacoplan targets complement protein C3, and can control both intravascular and extravascular hemolysis."
        title: "تقفل الـ complement فين؟"
        alt: "A vertical complement cascade: C3 splits into C3b, which coats red cells for extravascular removal in spleen and liver; C5 forms the membrane attack complex, which bursts red cells intravascularly. Pegcetacoplan blocks at C3 and stops both; eculizumab and ravulizumab block at C5 and stop only the intravascular part."
        caption: "الـ ==pegcetacoplan== بيقفل **C3**، فيمنع الطريقين. الـ **eculizumab** والـ **ravulizumab** بيقفلوا **C5**، فالـ C3b لسه بيعلّم الكرة والطحال ياكلها."
