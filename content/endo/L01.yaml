  # ---------- p11: treatment of MEN 2 ----------
  - id: endo.L01.074
    kind: card
    topic: men2-treatment
    front: Consensus on thyroidectomy for children carrying the MEN 2 mutant gene?
    back: Early thyroidectomy with central lymph node dissection soon after the syndrome is identified.
