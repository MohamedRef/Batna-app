  - id: hem.L06.lesson8
    title: "كيس ملوّث، قلب متحمّل، وحديد متراكم"
    hook: "مش كل مشكلة في النقل مناعة: بكتيريا في كيس دافي، سوايل أكتر من قد القلب، فيروس، أو حديد مالوش مخرج."
    minutes: 9
    pages: [99, 101]
    topics: [non-immune]
    goals:
      - "تعرف ليه الـ platelets أكتر component بيتلوّث"
      - "تفرّق الـ TACO وتعرف تمنعه"
      - "تحفظ العدوى اللي بتتنقل بالدم والـ hemosiderosis وحسبة الحديد"
    status: unverified
    steps:
      - kind: explain
        page: 99
        title: "Bacterial contamination"
        quote: "Mechanism: Commonly implicated bacteria in RBCs: bacteria that survive the cold storage conditions (Yersinia, pseudomonas). PLT are stored at room temp. and thus more susceptible to bacterial growth. Commonly implicated bacteria in PLT: staphylococci & streptococci."
        text: |
          الصورة: rigors، fever، vomiting، bloody diarrhea، hemolysis، hypotension، shock، **disseminated intravascular coagulation (DIC)**.
          - في الـ **RBCs**: بكتيريا بتستحمل البرد، **Yersinia** و **Pseudomonas**.
          - في الـ **platelets**: محفوظة في ==room temperature==، فالبكتيريا بتكبر، غالبًا **staph و strep**.

          العلاج: **broad-spectrum antibiotics** و shock. الوقاية: تلاجات مضبوطة **2–6°C**، وما تطلبش كذا كيس وتسيبهم بره.

          يعني نوع البكتيريا بيتحدد بحرارة التخزين: التلاجة بتقتل أغلب البكتيريا إلا اللي بتحب البرد (Yersinia)، والـ room temperature بتاعة الـ platelets بتسيب بكتيريا الجلد (staph) تكبر براحتها.
      - kind: aside
        tone: joke
        page: 99
        quote: "Management & Prevention:\n  - Broad spectrum antibiotics + treatment of shock.\n  - Keep blood in controlled refrigerators (at 2-6°C) and never obtain multiple units for the same patient and leave unused units at room temp. until needed."
        text: |
          الـ **multiple units** اللي بتستناك على الترابيزة في **room temp** "لحد ما نخلّص اللي قبله" ده بيتحوّل لـ **culture medium** ببلاش. البكتيريا بتحب الدم الدافي زي ما احنا بنحب الشاي.

          اطلب كيس كيس، والباقي يفضل في التلاجة.
      - kind: check
        page: 99
        quote: "PLT are stored at room temp. and thus more susceptible to bacterial growth. Commonly implicated bacteria in PLT: staphylococci & streptococci."
        question: "Shortly after a platelet transfusion a patient has rigors, high fever and hypotension. Which organism is most likely?"
        options: ["Staphylococcus", "Yersinia", "Plasmodium", "Cytomegalovirus"]
        answer: 0
        why:
          - "صح: الـ platelets في room temperature، وأشهر بكتيريا فيها staph و strep."
          - "الـ Yersinia في الـ RBCs لأنها بتستحمل البرد."
          - "الـ malaria عدوى بتتنقل بالدم، مش sepsis بعد دقايق."
          - "الـ CMV فيروس بيتنقل، مش shock فوري."
      - kind: explain
        page: 100
        title: "TACO"
        quote: "There is increase in CVP and cardiac failure.\nPulm. edema is cardiogenic in origin"
        text: |
          في خطر أكتر: **أطفال**، **كبار**، ومرضى **قلب أو رئة**.
          - الصورة: cough، dyspnea، cyanosis، **orthopnea**، rales، **congested neck veins**، tachycardia.
          - ==CVP يعلى== والـ pulmonary edema **cardiogenic**.
          - العلاج: **stop**، O2، diuresis، phlebotomy لو لازم.
          - الوقاية: كميات أقل وأبطأ **1–4 ml/kg/h**، وأي كيس ما يعدّيش **4 hours**.

          ليه دول بالذات؟ لأن الـ TACO مش مناعة، هو **حجم**: القلب الضعيف (أو الصغير في الأطفال) مش بيلحق يضخ اللي داخل، فالضغط يرجع للرئة. عشان كده العلاج diuresis، والوقاية إنك تبطّأ.
      - kind: sort
        page: 100
        quote: "There is increase in CVP and cardiac failure.\nPulm. edema is cardiogenic in origin"
        prompt: "ده يشاور على TACO ولا على anaphylaxis؟"
        bins: ["TACO", "Anaphylaxis"]
        cards:
          - { text: "Raised jugular venous pressure (JVP)", bin: 0 }
          - { text: "Orthopnea", bin: 0 }
          - { text: "Elderly with heart failure", bin: 0 }
          - { text: "Raised CVP", bin: 0 }
          - { text: "Stridor and laryngeal edema", bin: 1 }
          - { text: "IgA deficiency", bin: 1 }
          - { text: "Generalized edema with hypotension", bin: 1 }
        why: "الاتنين ضيق نفس، بس الـ transfusion-associated circulatory overload (TACO) **حمل زيادة على القلب** (CVP و jugular venous pressure (JVP) عاليين، orthopnea، كبار ومرضى قلب)، والـ anaphylaxis **مناعة** (anti-IgA، stridor، hypotension)."
      - kind: table
        page: 100
        quote: "Viruses:\n  Hepatotropic: HAV (very rare), HBV, HCV.\n  Retroviruses: HIV1, and HIV2, HTLV I and HTLV II.\n  Herpesviruses: CMV, EBV.\n  Others: Parvovirus B19, West nile virus (in North America).\nBacteria: T.B, brucellosis, Syphilis."
        title: "Transfusion-transmitted infections"
        columns: [Group, Agents]
        rows:
          - ["Hepatotropic", "HAV (very rare), HBV, HCV"]
          - ["Retroviruses", "HIV-1, HIV-2, HTLV I, II"]
          - ["Herpes", "CMV, EBV"]
          - ["Others", "Parvovirus B19, West Nile"]
          - ["Bacteria", "TB, brucellosis, syphilis"]
          - ["Parasites", "Malaria, trypanosoma, leishmania, toxoplasma"]
          - ["Prions", "CJD"]
        hide: [[1, 1], [4, 1], [5, 1]]
      - kind: explain
        page: 100
        title: "اربط العدوى بالتعديلات"
        quote: "Herpesviruses: CMV, EBV."
        text: |
          الكتاب بيقسّمها: **viruses** (hepatotropic، retroviruses، herpes، parvovirus B19، West Nile)، **bacteria** (TB، brucellosis، syphilis)، **parasites** (malaria، trypanosomiasis، leishmaniasis، toxoplasmosis)، و ==prions== (CJD).

          اربطها بالدرس اللي فات: الـ **CMV** و **EBV** و **HTLV** هي نفسها اللي الـ **leukoreduction** بيمنعها، لأنها فيروسات بتعيش جوه الـ WBCs. يعني الـ filter مش بس للحرارة، ده كمان بيقلّل عدوى. أما الـ **HBV** و **HCV** و **HIV** فبيعيشوا في الـ plasma، والـ filter مش بيشيلهم (التفسير المقبول، مش في الكتاب).
      - kind: explain
        page: 101
        title: "Hemosiderosis"
        quote: "Prevention: consider chelation for > 20 unit RBC burden &/or serum ferritin > 1000 ng/ml"
        text: |
          بيحصل بعد ==أكتر من 20 transfusion==. كل وحدة فيها **200–250 mg iron**، والجسم مالوش طريق يطلّع الحديد.
          - الصورة: **bronze skin**، hepatic fibrosis، **diabetes**، endocrine dysfunction، **cardiac failure**.
          - الوقاية: **chelation** لو أكتر من **20 units** و/أو **ferritin >1000 ng/ml**.
      - kind: figure
        page: 101
        quote: "Mechanism: accumulation of iron in the skin and internal organs. One unit of RBCs contains 200-250 mg of iron."
        title: "حسبة الحديد"
        alt: "Twenty bags of red cells, each 200 to 250 mg of iron, add up to 4 to 5 g. An arrow into the body with no exit arrow. Iron settles in skin, liver, pancreas, endocrine glands and heart."
        caption: "20 كيس × 200–250 mg = ==4–5 g حديد== داخلين، ومفيش باب خروج. بيترسّب في الجلد والكبد والبنكرياس والغدد والقلب."
        svg: |
