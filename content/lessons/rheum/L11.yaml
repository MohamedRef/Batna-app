  - id: rheum.L11.lesson4
    title: "HIV: من الإبرة للـ AIDS"
    hook: "ممرضة اتشكت بإبرة: الخطر 0.3%، والفحص الأول ممكن يطلع سلبي وهي مصابة. ليه؟"
    minutes: 9
    pages: [191, 195]
    topics: [hiv]
    goals:
      - "تعرف طرق العدوى ونسبها"
      - "تختار الـ marker المناسب حسب الوقت"
      - "تحفظ مراحل المرض ودواعي العلاج في الكتاب"
    status: unverified
    steps:
      - kind: explain
        page: 191
        title: "العدوى بتيجي منين؟"
        quote: "Health care workers have a risk of 0.3% following a single needle stick injury with known HIV infected blood."
        text: |
          - **Sexual:** أكفأ من ==men to women== وللـ passive partner في الـ anal intercourse
          - **Blood:** الـ **health care workers** خطرهم ==0.3%== بعد needle stick واحدة
          - **Mother to child:** أشهر طريق في الأطفال. بيزيد مع advanced disease، **prolonged/premature rupture of membranes**، و chorioamnionitis، والـ breastfeeding لحد 20%
          - مفيش عدوى من **household contact** ولا الناموس
      - kind: explain
        page: 192
        title: "ليه الاتنين: intracellular و capsulated؟"
        quote: "Cell mediated immunodeficiency which is the major consequence leaves the host open to infections with intracellular pathogens"
        text: |
          الـ HIV بيدخل عن طريق ==CD4== molecule. النتيجة الأساسية **cell mediated immunodeficiency** ← intracellular pathogens.

          ومعاها antibody abnormalities ← ==capsulated bacteria== كمان. والفيروس سريع: half-life في الدم حوالي **six hours**.
      - kind: figure
        page: 193
        quote: "Viral p24 antigen (p24ag): it appears shortly after infection, but disappear by the 8-10 weeks after exposure."
        title: "مين يبان إمتى؟"
