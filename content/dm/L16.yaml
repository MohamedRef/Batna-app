  - id: dm.L16.047
    kind: mcq
    topic: child-hhs
    stem: "The book gives two HHS definitions: L15 (glucose ≥600, effective osmolality >300, pH ≥7.3, HCO3 ≥15) and the Case 3 discussion. Which values does the Case 3 discussion use?"
    options: ["Glucose >600, osmolality >330, mild acidosis pH >7.2", "Glucose >600, osmolality >300, pH ≥7.3", "Glucose >250, osmolality >320, pH <7.3", "Glucose >800, osmolality >350, no acidosis", "Glucose >600, osmolality >320, pH >7.4"]
    answer: 0
    why:
      - The Case 3 discussion uses >330 mOsm/L and pH >7.2 (the pediatric definition).
