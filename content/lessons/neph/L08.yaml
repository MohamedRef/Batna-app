  - id: neph.L08.lesson8
    title: "الكلية الطبيعية تحت الميكروسكوب"
    hook: "مش هتعرف إيه اللي باظ لو ما شفتش الطبيعي الأول: الـ glomerulus والفلتر والصبغات والـ tubules."
    minutes: 9
    pages: [204, 210]
    topics: [histology]
    goals:
      - "تعرف أجزاء الـ glomerulus الطبيعي وتلاقيها في الصورة"
      - "ترتّب طبقات الـ filtration barrier وتعرف ليه مكان الـ deposit بيفرق"
      - "تعرف كل صبغة بتبيّن إيه، وتفرّق الـ proximal من الـ distal tubule"
    status: unverified
    steps:
      - kind: figure
        page: 204
        title: "الـ glomerulus الطبيعي"
        image: { file: neph/L08-glomerulus-scheme.webp, book: true }
        caption: "رسمة الكتاب: الـ **afferent** والـ **efferent arteriole** تحت (الـ vascular pole)، الـ capillary loops ماسكها الـ **mesangium** في النص، وفوق (الـ urinary pole) الـ ==proximal convoluted tubule (brush border)==."
        alt: "Book scheme of a normal glomerulus: capillary loops held by mesangial cells and matrix inside Bowman's capsule lined by parietal epithelium, podocytes on the loops, the afferent and efferent arterioles with the macula densa and extraglomerular mesangium at the bottom, and the proximal convoluted tubule leaving at the top."
      - kind: explain
        page: 204
        title: "الـ glomerulus من جوّه"
        quote: "Normal histology of the kidney (Glomerulus) Representative scheme of a normal glomerulus"
        text: |
          الـ **normal glomerulus** في رسمة الكتاب فيه:
          - **Capillary lumens** مبطّنة بـ **endothelial cells** فيها **fenestrae**.
          - **Mesangial cells** و **mesangial matrix** في النص، ماسكين الـ loops.
          - **Podocytes** قاعدة برّه على الـ **glomerular basement membrane (GBM)** بـ **foot processes**.
          - **Bowman's capsule** مبطّنة بـ **parietal epithelium**، وبينها وبين الـ tuft الـ **urinary space**.
          - تحت: ==afferent== و **efferent arteriole**، و **macula densa** بتاعة الـ **distal tubule**، و **extraglomerular mesangium**.
          - فوق: الـ **proximal convoluted tubule** بالـ ==brush border==.

          ليه الترتيب ده مهم؟ التفسير المقبول (مش في الكتاب): كل مرض بيبدأ من خلية معينة. الـ IgA بيترسّب في الـ **mesangium** فتلاقي cells زيادة في النص، والـ minimal change بيضرب الـ **podocyte** برّه، والـ crescent بيطلع من الـ **parietal epithelium** في Bowman's space. يعني لما تعرف كل خلية قاعدة فين، تعرف تقرا الـ lesion: هي في النص ولا على الأطراف ولا برّه الـ tuft خالص.

          ليه نتعلم الطبيعي الأول؟ التفسير المقبول (مش في الكتاب): كل كلمة في التقارير بعد كده معناها «الطبيعي اتغيّر هنا». لو مش عارف إن الـ mesangial area فيها خليتين أو تلاتة بس، مش هتفهم ليه 4–5 cells يبقى hypercellularity. ولو مش عارف إن الـ GBM رفيع ومنتظم، مش هتشوف الـ spikes ولا الـ double contour. فاحفظ الصورة الطبيعية كـ «مسطرة»، وكل case قيس عليها.
