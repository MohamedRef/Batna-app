      - kind: aside
        tone: joke
        page: 121
        text: |
          الـ **lamivudine** زي الموبايل الرخيص: أول سنة شغال حلو (24% بس اللي باظ)، وبعد 5 سنين **70%** منه عايز تصليح. 😅

          أما الـ **tenofovir** فده الموبايل اللي جدك لسه شغال بيه: **0%**.
      - kind: explain
        page: 121
        title: "الـ resistance اتعمل: هنعمل إيه؟"
        text: |
          جدول الـ rescue في الكتاب:

          - **LAM**، **TBV**، أو **ETV resistance** → **switch to TDF or TAF**.
          - **ADV resistance**: لو **LAM-naïve** → switch to **ETV** أو TDF أو TAF. لو **LAM-resistant** → **TDF أو TAF**. لو الـ DNA عمل **plateau** → **add ETV** أو switch to ETV.
          - **TDF or TAF resistance**: لو **LAM-naïve** → **switch to ETV**. لو **LAM-R** → **add ETV**.
          - **Multidrug resistance** → **ETV + TDF or TAF**.
      - kind: reveal
        page: 121
        prompt: "ليه كل مرة الـ LAM أو الـ ETV يفشلوا بنروح على الـ TDF/TAF، وليه الكتاب بيسأل دايمًا \"LAM-naïve ولا لأ\"؟"
        answer: |
          التفسير المقبول: **LAM و TBV و ETV** كلهم **nucleosides** وبيشتركوا في جزء من طريق الـ resistance، و **ETV** بيبقى أضعف قدام فيروس عنده **LAM mutations**. أما **TDF/TAF** فهما **nucleotides** بطريق resistance مختلف.

          فالقاعدة: **nucleoside فشل → روح nucleotide**. ولو العيان **LAM-naïve**، الـ ETV لسه سلاح كامل.
      - kind: match
        page: 121
        prompt: "وصّل الـ resistance بالـ rescue:"
        pairs:
          - ["Lamivudine resistance", "Switch to TDF or TAF"]
          - ["TDF resistance, LAM-naïve", "Switch to ETV"]
          - ["Multidrug resistance", "ETV plus TDF or TAF"]
          - ["Adefovir resistance with HBV DNA plateau", "Add ETV or switch to ETV"]
        why: "LAM/TBV/ETV → TDF أو TAF. TDF/TAF وهو LAM-naïve → ETV. Multidrug → الاتنين مع بعض. ADV مع plateau → add أو switch to ETV."
      - kind: try
        items: [hb.L07.036, hb.L07.039, hb.L07.042, hb.L07.044, hb.L07.051]
    recap:
      - "القرار = **DNA + ALT + severity**، ونفس القواعد لـ e+ و e−."
      - "DNA **< 2,000** → no treatment. DNA **> 2,000** + ALT abnormal (ULN **40**) → treat."
      - "DNA > 2,000 + ALT normal + age **> 30** → FibroScan/biopsy؛ **> 9 kPa** = severe fibrosis (الرسمة بتقف هنا؛ العلاج استنتاج من معيار الـ severity، صفحة 118)."
      - "Monitoring: e+ كل **3–6 m**، e− كل **6–12 m**، e− infection مع DNA > 2,000 كل **3 m** أول سنة."
      - "First line = **PET**: Peg-IFN alfa-2a، entecavir، tenofovir."
      - "e+ seroconversion → stop بعد **12 months**. غير كده long-term لحد **HBsAg seroconversion**."
      - "Resistance: LAM **70%** في 5 سنين، ETV **1.2%**، TDF/TAF **0%**."
