            <text x="190" y="252" class="t-sm">distends the stomach</text>
            <text x="178" y="268" class="t-sm t-acc">2 TLESR opens the LES</text>
            <text x="178" y="284" class="t-sm">3 Gas vents upward</text>
            <text x="178" y="300" class="t-sm t-mut">Physiological, ~30 a day</text>
