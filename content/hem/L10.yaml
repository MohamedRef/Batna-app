  - id: hem.L10.123
    kind: mcq
    topic: secondary
    stem: "A healthy 25-year-old man has Hb 19 g/dL; his father has the same. WBC and platelets are normal, no splenomegaly, normal SaO2. Serum EPO is high and P50 is decreased. What is the most likely cause?"
    options:
      - High oxygen-affinity hemoglobin
      - EPO receptor mutation
      - Polycythemia vera
      - Chuvash polycythemia
      - Apparent polycythemia
    answer: 0
    why:
      - "Correct: dominant family pattern, high EPO and a low P50 (left shift) = high-affinity Hb (p171, p175)."
      - EPOR mutation gives a low EPO.
      - PV has a low EPO, often splenomegaly and raised other lines.
      - Chuvash is recessive and the P50 is normal.
      - Apparent polycythemia has a normal red cell mass and no left shift.
    src: { page: 171, quote: "Pathognomonic anomaly is left shift of oxygen dissociation curve." }
    status: unverified
  - id: hem.L10.124
