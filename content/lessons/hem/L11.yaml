  - id: hem.L11.lesson3
    title: "السلّم: MGUS ← smoldering ← myeloma"
    hook: "مش كل M protein يبقى سرطان. ده سلم بثلاث درجات، والفرق بينهم أرقام لازم تتحفظ."
    minutes: 8
    pages: [180, 182]
    topics: [diagnosis, differential]
    goals:
      - "تفرّق MGUS و smoldering و MM بالـ IMWG"
      - "تحفظ الـ myeloma-defining events"
      - "تفرّق الـ myeloma عن الـ amyloidosis والـ metastasis"
    status: unverified
    steps:
      - kind: figure
        page: 181
        quote: "M protein < 3 g/dL Clonal plasma cells in BM < 10% No myeloma defining events"
        title: "السلم"
        alt: "Three stacked steps. Bottom, MGUS: M protein under 3 g/dL, marrow plasma cells under 10 percent, no myeloma-defining events. Middle, smoldering: M protein 3 g/dL or more or urine 500 mg/24 h or more, plasma cells 10 to 60 percent, no events. Top, multiple myeloma: more than 10 percent clonal plasma cells plus at least one myeloma-defining event."
        caption: "اللي بيفصل الـ smoldering عن الـ myeloma مش الرقم، ده وجود myeloma-defining event."
        svg: |
          <svg viewBox="0 0 330 270" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="185" width="320" height="78" rx="8" class="fg-good"/>
            <text x="15" y="205" class="t-b t-good">MGUS</text>
            <text x="15" y="225" class="t-sm">M protein &lt; 3 g/dL</text>
            <text x="15" y="242" class="t-sm">BM plasma cells &lt; 10%</text>
            <text x="15" y="258" class="t-sm t-mut">no myeloma-defining events</text>
            <rect x="35" y="98" width="290" height="80" rx="8" class="fg-acc"/>
            <text x="45" y="118" class="t-b t-acc">Smoldering</text>
            <text x="45" y="138" class="t-sm">M ≥ 3 g/dL or urine ≥ 500 mg/24 h</text>
            <text x="45" y="155" class="t-sm">BM plasma cells 10-60%</text>
            <text x="45" y="171" class="t-sm t-mut">no myeloma-defining events</text>
            <rect x="65" y="8" width="260" height="83" rx="8" class="fg-bad"/>
            <text x="75" y="28" class="t-b t-bad">Multiple myeloma</text>
            <text x="75" y="48" class="t-sm">clonal BM plasma cells &gt; 10%</text>
            <text x="75" y="65" class="t-sm t-b">+ ≥ 1 myeloma-defining event</text>
            <text x="75" y="82" class="t-sm t-mut">CRAB, MRI, FLC ratio, ≥ 60%</text>
          </svg>
      - kind: mnemonic
        page: 181
        quote: "≥ 1 CRAB feature > 1 MRI focal lesion Serum free light chain ratio ≥ 100 Clonal plasma cells in BM ≥ 60%"
        word: "SLIM"
        parts:
          - { key: "S", text: "Sixty: clonal BM plasma cells ≥ 60%" }
          - { key: "L", text: "Light chain ratio (serum free) ≥ 100" }
          - { key: "I", text: "Imaging: > 1 focal lesion on MRI" }
          - { key: "M", text: "Myeloma: any one of these, or any CRAB feature, with > 10% clonal plasma cells" }
        hook: "SLiM CRAB: كابوريا رفيعة. أي واحدة من دول تكفي تسميها myeloma."
      - kind: check
        page: 181
        quote: "Clonal plasma cells in BM ≥ 60%"
        question: "Marrow shows 62% clonal plasma cells; CRAB features are all absent. This is:"
        options: ["Multiple myeloma", "Smoldering myeloma", "MGUS", "Plasma cell leukaemia"]
        answer: 0
        why:
          - "صح: ≥ 60% لوحدها myeloma-defining event، regardless of other features."
          - "الـ smoldering لحد 60% بس."
          - "الـ MGUS أقل من 10%."
          - "الـ PCL بيتعرف بالـ plasma cells في الدم مش النخاع."
      - kind: explain
        page: 181
        quote: "The presence of a stable monoclonal paraprotein in serum or less commonly in urine in the absence of clinicopathological evidence of multiple myeloma"
        title: "MGUS: الجار الهادي"
        text: |
          ==MGUS== (benign monoclonal gammopathy): paraprotein **stable** في السيرم (أقل في البول) من غير أي دليل على MM أو Waldenström أو amyloidosis أو lymphoproliferative disorder.

          - شائع: **1%** فوق 50، **3%** فوق 70، **5%** فوق 80.
          - بيتحول لـ MM أو WM أو AL بمعدل ==1% في السنة==.
          - مفيش أعراض ولا end-organ damage. **No treatment؛ long-term follow-up**.
      - kind: aside
        tone: joke
        page: 181
        quote: "No treatment; long term follow-up"
        text: "الـ MGUS زي الجار اللي ماشي بشنطة غريبة: مش هتبلّغ عنه، بس هتفضل باصص من الشباك كل سنة."
      - kind: explain
        page: 182
        quote: "Chemotherapy is not indicated for these patients until there is evidence of clinical progression."
        title: "Smoldering"
        text: |
          الـ ==smoldering myeloma==: M protein > 3 g/dL و > 10% plasma cells، بس **من غير مضاعفات**.

          الـ natural history بتاعه زي الـ MGUS مش زي الـ MM، علشان كده **chemotherapy is not indicated** إلا لما يبان progression.
      - kind: sort
        page: 181
        quote: "M protein < 3 g/dL Clonal plasma cells in BM < 10% No myeloma defining events"
        prompt: "حط كل مريض في درجته:"
        bins: ["MGUS", "Smoldering", "Myeloma"]
        cards:
          - { text: "M 1.2 g/dL, 5% plasma cells, well", bin: 0 }
          - { text: "M 2 g/dL, 8% plasma cells, normal labs", bin: 0 }
          - { text: "M 3.5 g/dL, 20% plasma cells, well", bin: 1 }
          - { text: "Urine 700 mg/24 h, 15% plasma cells, well", bin: 1 }
          - { text: "15% plasma cells + Hb 8.5", bin: 2 }
          - { text: "20% plasma cells + creatinine 2.8", bin: 2 }
          - { text: "65% plasma cells, nothing else", bin: 2 }
        why: "MGUS < 3 g/dL و < 10%. Smoldering ≥ 3 g/dL (أو ≥ 500 mg بول) و 10-60%. أي myeloma-defining event (CRAB أو ≥ 60%) = myeloma."
      - kind: table
        page: 182
        quote: "Bone marrow plasma cells is usually less than 20% No osteolytic lesions The amount of Bence Jones proteinuria is modest"
        title: "الـ differential"
        columns: ["Mimic", "Clue"]
        rows:
          - ["Amyloidosis", "BM plasma cells < 20%, no lytic lesions, modest Bence Jones"]
          - ["Metastasis", "Lytic lesion, no M component"]
        hide: [[0, 1], [1, 1]]
      - kind: aside
        tone: exam
        page: 182
        quote: "Metastatic carcinoma, such as hypernephroma No M component is found in the serum or urine A lytic lesion is identified"
        text: "Lytic lesion ومفيش M protein؟ فكّر في metastasis، والكتاب بيدي مثال hypernephroma (renal cell carcinoma)."
      - kind: try
        items: [hem.L11.048, hem.L11.049, hem.L11.053, hem.L11.119]
    recap:
      - "MGUS: M < 3، < 10%، مفيش events؛ 1%/سنة يتحول؛ follow-up بس."
      - "Smoldering: M ≥ 3 (أو بول ≥ 500 mg)، 10-60%، مفيش events؛ مفيش chemo."
      - "Myeloma: > 10% + ≥ 1 event: SLiM CRAB (≥ 60%، FLC ≥ 100، > 1 MRI lesion، CRAB)."
      - "Amyloidosis: plasma cells < 20%، مفيش lytic. Metastasis: lytic من غير M."
    practice: [hem.L11.048, hem.L11.049, hem.L11.050, hem.L11.051, hem.L11.052, hem.L11.053, hem.L11.054, hem.L11.055, hem.L11.056, hem.L11.057, hem.L11.058, hem.L11.059, hem.L11.100, hem.L11.104, hem.L11.114, hem.L11.115, hem.L11.118, hem.L11.119]
