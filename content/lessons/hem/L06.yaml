        quote: "Occurs within 1 to 3 weeks post transfusion.\nPresentation: triad of fever, hyperbilirubinemia and anemia. DAT is +ve. There is no Hemoglobinuria because hemolysis is extra-vascular."
        text: |
          - الميعاد: **1–3 weeks** بعد النقل.
          - الـ triad: ==fever، hyperbilirubinemia، anemia==، و **direct antiglobulin test (DAT) +ve**.
          - **No hemoglobinuria** لأن الـ hemolysis **extravascular**.
          - السبب: **anamnestic reaction** في عيان اتعمله alloimmunization قبل كده (transfusion أو pregnancy).
          - الوقاية: أي دم بعد كده **antigen-negative** للـ antibody ده، عشان الـ memory ما تصحاش تاني.
