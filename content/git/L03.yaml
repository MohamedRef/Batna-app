      - Positive secretin-stimulated EUS
      - Raised ALP during attacks
    answer: 0
    why:
      - "Correct: a low ejection fraction on gallbladder scintigraphy is the supportive criterion for E1a."
      - SOM supports the sphincter of Oddi disorders, not the gallbladder one.
