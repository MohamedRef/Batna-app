  - id: neph.L08.lesson4
    title: "FSGS و TMA والسكر"
    hook: "خمس أشكال للـ FSGS، واحد منهم أحسن prognosis وواحد أسوأ. وحاجة اسمها onion-skin."
    minutes: 10
    pages: [239, 249]
    topics: [fsgs, tma, diabetic]
    goals:
      - "تعرف الـ 5 variants للـ FSGS وأسبابه وعلاجه"
      - "تقسّم الـ TMA primary و secondary وتفرّق TTP من HUS"
      - "تتعرف على الـ advanced diabetic nodular sclerosis"
    status: unverified
    steps:
      - kind: explain
        page: 239
        title: "الـ GBM: رفيع ولا تخين؟"
        quote: "Diffuse thinning of the GBM: Type IV collagen Irregularity and multilayering nephropathy or splitting of the GBM"
        text: |
          - **Diffuse thinning** = ==thin basement membrane disease==
          - **Irregularity و multilayering (splitting)** = ==Alport syndrome==
          - الاتنين **type IV collagen nephropathy**.
          - **Diffuse thickening** = diabetes و hypertension.
      - kind: explain
        page: 241
        title: "Case 4"
        quote: "FSGS; Not Otherwise Specified (NOS; Classic Variant)"
        text: |
          ست **52 سنة**، uPCR **1.13**، albumin 3.6، creatinine 0.56. الـ biopsy: 2 من 16 glomeruli فيهم **segmental tuft sclerosis** و capsular adhesions **في أي حتة في الـ tuft**، والـ IF سلبي، والـ Congo red سلبي.

          التشخيص: ==FSGS NOS (classic variant)==، وده **أشهر** نوع.
      - kind: table
        page: 242
        quote: "Focal segmental glomerulosclerosis (Types)"
        title: "Focal segmental glomerulosclerosis: 5 types"
        columns: [Variant, Where / what, Clinical]
        rows:
          - ["NOS", "Anywhere; no other variant", "Most common"]
          - ["Perihilar", "Vascular pole hyalinosis", "Adaptive; subnephrotic, normal albumin"]
          - ["Cellular", "Endocapillary foam cells", "Least common; early stage"]
          - ["Tip", "Tubular pole", "Best prognosis"]
          - ["Collapsing", "Tuft collapse, podocyte hyperplasia", "Worst prognosis"]
        hide: [[0, 2], [2, 2], [3, 2], [4, 2]]
      - kind: mnemonic
        page: 242
        quote: "Best prognosis, with high- est rate of responsivity to glucocorticoids and lowest risk of progres- sion."
        word: "TOP"
        parts:
          - { key: "T", text: "Tip = Top prognosis (أحسن واحد)" }
          - { key: "O", text: "Opposite end (tubular pole)" }
          - { key: "P", text: "Prednisolone-responsive" }
        hook: "الـ **Tip** فوق الكل، والـ **Collapsing** بيـ«ينهار» زي اسمه: worst prognosis."
      - kind: reveal
        page: 242
        quote: "Predisposition for vascular pole is probably due to normally increased filtration pressures at the proximal afferent end"
        prompt: "ليه الـ adaptive FSGS بيختار الـ vascular pole؟"
        answer: "لأن الضغط أعلى طبيعيًا عند **الـ afferent end** للـ capillary bed، وبيزيد أكتر مع الـ **compensatory hyperfiltration** و الـ afferent vasodilatation. والـ tip lesion عند الـ tubular pole علشان الـ protein-rich filtrate بيتجمّع هناك ويعمل **shear stress**."
      - kind: explain
        page: 243
        title: "الأسباب"
        quote: "Primary (idiopathic) form Specific cause unknown; mediated by circulating permeability factors"
        text: |
          - **Primary**: ==circulating permeability factors==
          - **Genetic**: podocyte gene mutations
          - **Viruses**: HIV-1، parvovirus B19، SV40، CMV، EBV
          - **Drugs**: heroin، interferons، lithium، pamidronate، sirolimus، CNI، anabolic steroids
          - **Adaptive**: reduced renal mass (agenesis، reflux، allograft، aging) أو normal mass (HTN، obesity، bodybuilding، sickle cell)
      - kind: check
        page: 242
        quote: "In adaptive FSGS, patients are more likely to pre- sent with subnephrotic proteinuria and normal serum albumin levels."
        question: "A bodybuilder has 2 g/day proteinuria with normal albumin; biopsy shows perihilar sclerosis and glomerulomegaly. Best label?"
        options:
          - "Adaptive FSGS, perihilar variant"
          - "Primary collapsing FSGS"
          - "Minimal change disease"
          - "Tip lesion"
        answer: 0
        why:
          - "صح: lean body mass عالي، subnephrotic proteinuria، albumin طبيعي، perihilar، و glomerulomegaly = ==adaptive==."
          - "الـ collapsing بيعمل nephrotic شديد و tuft collapse."
          - "الـ MCD الـ LM بتاعه طبيعي."
          - "الـ tip عند الـ tubular pole، وبيبدأ بـ nephrotic فجأة."
      - kind: order
        page: 243
        quote: "Prednisone Img/kg/day for 4- 8 (If proteinuria decreasing, up tol6 weeks) Taper progressively over 3 months"
        prompt: "رتّب علاج الـ primary FSGS"
        steps:
          - "RAS blockade ± diuretics ± statin"
          - "Prednisone 1 mg/kg/day for 4–8 weeks (up to 16)"
          - "Taper over 3 months"
          - "Steroid resistant/dependent: CNI, taper steroids"
          - "Keep CNI 1–2 years, accept partial remission"
        why: "كله بياخد RAS blockade الأول، والـ primary بس هو اللي بياخد full-dose steroids. الـ CNI للـ resistance أو الـ dependence."
      - kind: explain
        page: 245
        title: "Case 5: TMA"
        quote: "Arterioles showed focal red cell fragmentation, fibrin thrombi, fibrous thrombi as well as onion- skin appearance."
        text: |
          راجل **42 سنة**، gross hematuria، ==BP 200/100==، creatinine 4، anaemia و **thrombocytopenia** و indirect hyperbilirubinemia. الـ immunology و C3/C4 طبيعيين.

          الـ biopsy: hilar thrombi، **red cell fragmentation**، fibrin thrombi، و ==onion-skin== arterioles. التشخيص: **acute flare of TMA with arterial involvement**.
      - kind: figure
        page: 246
        quote: "Types of TMA Primary TMA Secondary TMA Hereditary TTP. Immune-mediated Idiopathic TTP."
        title: "TTP ولا HUS؟"
        alt: "Algorithm: TMA splits by ADAMTS-13. Below 10 percent with fever and neurologic signs is TTP. Above 10 percent is HUS; with diarrhea from Shiga toxin it is typical HUS, without diarrhea it is atypical HUS from complement dysregulation, pregnancy, systemic sclerosis, antiphospholipid syndrome, strep pneumonia, drugs, radiation or malignant hypertension."
        caption: "الـ ==ADAMTS-13== هو المفتاح: < 10% = **TTP**، > 10% = **HUS**. والـ HUS بالإسهال (Shiga toxin) = typical."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
