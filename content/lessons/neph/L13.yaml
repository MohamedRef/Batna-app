  - id: neph.L13.lesson5
    title: "الحكاية بتبدأ بـ hyperfiltration"
    hook: "الكلية في أول السكر بتشتغل أكتر من اللازم، والشغل الزيادة ده هو أول المرض."
    minutes: 8
    pages: [426, 427]
    topics: [pathogenesis]
    goals:
      - "تعرّف الـ hyperfiltration بالأرقام وتعرف سببه"
      - "تفهم ليه الـ GFR العالي مضر"
      - "تمشي في الأربع طرق من السكر للكلية وتعرف كل واحد بيوصل لإيه"
    status: unverified
    steps:
      - kind: explain
        page: 426
        title: "Hyperfiltration"
        quote: "Glomerular hyper filtration, or supraphysiologic elevation in GFR, is defined as a GFR from 120 to 180 mL/min/173 m2, or an absolute increase in GFR of more than two standard deviations above the mean GFR in age-matched healthy people."
        text: |
          الـ ==hyperfiltration== = glomerular filtration rate (GFR) **120-180** mL/min/1.73 m²، أو أكتر من **2 standard deviation** فوق المتوسط لنفس السن.

          - سببه **increased intraglomerular capillary pressure**.
          - بيحصل خلال **1-5 سنين** من الـ T1DM.
          - موجود في **70%** من الـ T1DM و **50%** من الـ T2DM.
          - بيتقال إنه بيمهّد لـ **irreversible nephron damage**.
      - kind: reveal
        page: 426
        quote: "Hyper filtration is thought to be a manifestation of increased intra glomerular capillary pressure and plays an important role in the development and progression of DKD."
        prompt: "ليه GFR عالي يبقى حاجة وحشة؟ مش الكلية شغالة أحسن؟"
        answer: |
          الـ GFR العالي جاي من **increased intraglomerular capillary pressure** (ضغط عالي جوه الـ glomerulus)، مش من nephrons زيادة. زي ما تشغّل موتور على أقصى سرعة طول الوقت: الشغل كتير بس بيستهلك نفسه.

          الضغط ده بيعمل **shear stress** على الـ glomerulus، فيحصل **mesangial expansion** و **podocyte loss** وفي الآخر **sclerosis**.
      - kind: check
        page: 426
        quote: "Glomerular hyperfiltration, or supraphysiologic elevation in GFR, is defined as a GFR from 120 to 180 mL/min/173 m2, or an absolute increase in GFR of more than two standard deviations above the mean GFR in age-matched healthy people."
        question: "A 22-year-old with type 1 diabetes for 3 years has a measured GFR of 125 mL/min/1.73 m² and a normal ACR. How do you read this GFR?"
        options:
          - "Glomerular hyperfiltration, an early step toward DKD"
          - "Excellent kidney function, no concern"
          - "CKD stage 1 by definition"
          - "A lab error, because GFR cannot exceed 120"
        answer: 0
        why:
          - "صح: 120-180 = hyperfiltration، وبيحصل خلال 1-5 سنين من الـ T1DM."
          - "الـ GFR العالي هنا مش صحة؛ ده ضغط عالي جوه الـ glomerulus."
          - "الـ CKD محتاج ACR ≥30 أو eGFR <60، والـ ACR هنا طبيعي."
          - "الـ GFR ممكن يعدّي 120، والكتاب بيحدد الـ hyperfiltration من 120 لـ 180."
      - kind: figure
        remind: [neph.L13.013]
        page: 427
        quote: "Hyperglycemia\n  Renal hemodynamic changes\n    ↑ IGF-1, TGF-β, VEGF, PG, Glucagon, ET-1, SGLT2\n      Efferent arteriolar constriction, Glomerular hypertension\n      Glomerular hypertrophy, Glomerular sclerosis\n  Activation of RAAS\n    ↑ ROS, TGF-β, Ang II, Aldosterone\n      Podocyte injury, Decreased HIF stability, Proteinuria\n  Ischemia and Inflammation\n    AGEs, TNF-α, NF-κB\n      Podocyte injury, Decreased HIF stability, Proteinuria\n  Oxidative stress\n    ↑ JAK/STAT, VEGF, MCP-1\n      Tubulointerstitial fibrosis, Tubular atrophy, Mesangial cell expansion, ECM accmulation\n  → Diabetic kidney disease"
        title: "أربع طرق من السكر للكلية"
        alt: "Hyperglycemia at the top splits into four pathways: renal hemodynamic changes (IGF-1, TGF-beta, SGLT2) leading to efferent constriction, glomerular hypertension and sclerosis; RAAS activation (Ang II, aldosterone, ROS) leading to podocyte injury and proteinuria; ischemia and inflammation (AGEs, TNF-alpha, NF-kB); and oxidative stress (JAK/STAT, VEGF, MCP-1) leading to tubulointerstitial fibrosis and mesangial expansion. All converge on diabetic kidney disease."
        caption: "التلاتة اللي في النص (==renin–angiotensin–aldosterone system (RAAS)== والـ inflammation والـ oxidative stress) بيوصلوا للـ podocyte والـ fibrosis، والـ hemodynamic بيوصل للـ glomerular hypertension."
        svg: |
          <svg viewBox="0 0 330 380" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L13a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="105" y="8" width="120" height="32" rx="16" class="fg-acc"/>
            <text x="165" y="29" text-anchor="middle" class="t-sm t-b">Hyperglycemia</text>
            <path d="M165 40 V56 M20 56 H310" class="fg-arrow"/>
