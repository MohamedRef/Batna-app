          - **Lithium** و**electroconvulsive therapy (ECT)**: safe and efficacious زي الشباب.

          ليه **6 months** على الأقل؟ لأن الـ relapse ممكن لحد سنتين أو أكتر، فاللي يوقف أول ما يتحسن بيرجع. والكتاب بيقول إن تلت المرضى في أمريكا بيوقفوا الدوا في أول 6 أسابيع، وأقل من النص بيوصلوا للجرعة العلاجية، يعني أغلب الفشل من **التوقف بدري والجرعة القليلة**، مش من الدوا نفسه.
