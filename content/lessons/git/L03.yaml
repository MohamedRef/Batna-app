      - "تعرف الـ red flags اللي بتمنعك تقول IBS على طول"
      - "تختار العلاج لـ IBS-C و IBS-D و IBS-M"
    status: unverified
    steps:
      - kind: explain
        page: 114
        quote: "About 10–15% of the population are affected at some time but only 10% of these consult their doctors"
        title: "مرض كتير، ومرضى قليلين في العيادة"
        text: |
          الـ ==IBS==: abdominal pain مع **altered bowel habits** من غير organic pathology تفسّرها.

          - بيصيب **10–15%** من الناس في وقت ما، بس **10% بس منهم** بيروحوا للدكتور.
          - ومع كده هو ==the most common cause of GI referral==، وبيعمل غياب كتير عن الشغل.
          - **Young women** أكتر من الرجالة **2–3 مرات**.
      - kind: figure
        page: 116
