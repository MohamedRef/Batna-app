    options: [Ascertainment bias, Selection bias, Recall bias, Publication bias, Bias in handling dropout]
    answer: 1
    why:
      - Ascertainment bias is reduced by blinding.
      - Random allocation (with concealment) stops investigators choosing who gets what, which is selection bias.
