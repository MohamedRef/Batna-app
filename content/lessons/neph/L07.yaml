      - kind: explain
        page: 163
        title: "ليه الـ octreotide بالذات؟ وليه الـ mTOR فشل؟"
        quote: "Somatostatin has a half-life of approximately 3 minutes, so more stable synthetic peptides (octreotide, lanreotide, pasireotide) have been developed for clinical use"
        text: |
          - **Somatostatin analogues**: الـ somatostatin نفسه بيقلل الـ cAMP في **الكلية والكبد**، بس عمره **3 دقايق**، فعملوا peptides أثبت. علشان كده ==الكبد بيصغر 4–6%==، وده مفيد للعيان اللي عنده polycystic liver.
          - **mTOR inhibitors**: الـ mTOR شغال في الحيوانات، والـ sirolimus والـ everolimus منعوا الأكياس في الفيران. بس في **تجربتين كبار 18–24 شهر** ما فيش فايدة. التفسير المقبول (مش في الكتاب): الجرعة اللي البني آدم يستحملها أقل بكتير من اللي اتدّت للفيران.
          - **Pravastatin** بطّأ النمو في الأطفال والشباب، و **bosutinib** قلل النمو بس الوظيفة اتجهت للأسوأ، يعني مش كل دوا بيصغّر الكلية بيحميها.
      - kind: explain
        page: 164
        title: "الزرع"
        quote: "Transplantation is the treatment of choice for ESRD in patients with ADPKD. There is no difference in patient or graft survival between patients with ADPKD and other ESRD populations. Living donor trans."
        text: |
          الـ ==transplantation== هو العلاج المفضل للـ end-stage renal disease (ESRD)، ونتايجه زي غيره. المضاعفات مش أكتر.

          الـ **pretransplant nephrectomy** الروتيني خلاص. نشيلها لو: **infected cysts، نزيف متكرر، ضغط شديد، أو كلية ضخمة نازلة للـ pelvis**. بعد الزرع الكلى القديمة **تصغر 38–41%** والكبد **يكبر** 9–21%، ومفيش زيادة في الـ renal cell carcinoma (RCC).

          ليه بطّلنا نشيل الكلى قبل الزرع؟ التفسير المقبول (مش في الكتاب): الكلى القديمة لسه بتطلع شوية بول و erythropoietin، والعملية نفسها ليها مضاعفات. وبعد الزرع هي بتصغر لوحدها لأن الـ uremia والـ vasopressin العالي اللي كانوا بيشجعوا الأكياس راحوا. علشان كده بنشيلها بس لو هي نفسها عاملة مشكلة: عدوى أو نزيف أو مفيش مكان للكلية الجديدة.
      - kind: reveal
        page: 164
        quote: "Indications for nephrectomy include a history of infected cysts, frequent bleeding, severe hyperten-sion, and massive renal enlargement with extension into the pelvis."
        prompt: "ليه بطّلنا الـ nephrectomy الروتيني قبل الزرع، ومين لسه محتاجها؟"
        answer: |
          الكتاب بيقول الـ pretransplant nephrectomy ==fallen out of favor==، والكلى القديمة **بتصغر 37.7% و 40.6%** بعد سنة و 3 سنين، ومفيش زيادة في الـ **RCC**.

          التفسير المقبول (مش في الكتاب): الكلى دي لسه بتعمل **بول وerythropoietin**، والعملية نفسها ليها مخاطر، والمساحة غالبًا بتتعمل لوحدها لما تصغر.

          اللي لسه محتاجها: **infected cysts** متكررة، **نزيف** متكرر، **ضغط شديد**، أو كلية **ضخمة نازلة للـ pelvis** (مفيش مكان للكلية الجديدة).
      - kind: try
        items: [neph.L07.089, neph.L07.091, neph.L07.095, neph.L07.099, neph.L07.102]
