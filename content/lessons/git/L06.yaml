  - id: git.L06.lesson3
    title: "الـ Crohn: التحاليل والأشعة والمضاعفات"
    hook: "من الـ calprotectin للـ creeping fat لحصوة الكلى: كل حاجة الـ Crohn بيسيبها وراه."
    minutes: 10
    pages: [210, 212]
    topics: [cd-labs, cd-imaging, cd-complications]
    goals:
      - "تعرف ليه مفيش test واحد بيشخّص الـ Crohn"
      - "تختار الأشعة الصح لكل سؤال"
      - "تفهم حكاية الـ 100 cm ileum والـ oxalate stones"
    status: unverified
    steps:
      - kind: explain
        page: 210
        title: "التحاليل: مفيش test سحري"
        quote: "No single laboratory test is diagnostic or specific for Crohn disease."
        text: |
          **No single laboratory test** بيشخّص الـ Crohn. اللي هتلاقيه:
          - **anemia**، غالبًا ==iron deficiency==
          - **leukocytosis** و **thrombocytosis** (systemic inflammation)
          - **low albumin**: protein-losing enterocolitis أو malnutrition
          - نقص **calcium، magnesium، B12، D، folate** من الـ malabsorption
          - **CRP** عالي (والـ ESR أقل منه)
      - kind: explain
        page: 210
        title: "البراز والـ serology"
        quote: "Stool inflammatory markers like fecal lactoferrin and calprotectin, are available that can help distinguish IBD from irritable bowel syndrome (IBS)"
        text: |
          **البراز:** ممكن **excess fat** (malabsorption) أو **fecal leukocytes** (inflammation). ولازم يطلع **negative** للـ bacteria والـ C. difficile والـ ova and parasites.

          ==Fecal calprotectin== و **lactoferrin**: بيفرّقوا الـ IBD عن الـ **IBS**، وبيقيسوا الـ activity، ويتوقعوا الـ flare، ويتابعوا العلاج.

          **Serology:** **ASCA**، **Omp-C**، **I2**، **CBir-1** مع الـ Crohn. والـ **P-ANCA** مع الـ UC والـ Crohn colitis. كلهم **limited diagnostic accuracy** لوحدهم.
      - kind: check
        page: 210
        quote: "fecal lactoferrin and calprotectin, are available that can help distinguish IBD from irritable bowel syndrome (IBS)"
        question: "Young woman, loose stools with cramps for months, normal exam. Best test to separate IBD from IBS?"
        options:
          - "Fecal calprotectin"
          - "Serum ASCA"
          - "Fecal fat"
          - "ESR"
        answer: 0
        why:
          - "صح: ده بالظبط استخدام الـ calprotectin في الكتاب."
          - "الـ serology لوحدها limited accuracy."
          - "الـ fecal fat بيقيس malabsorption مش inflammation."
          - "الـ ESR nonspecific."
      - kind: figure
        page: 211
        quote: "Common abnormalities of the gut include thickening and excessive mesenteric fat proliferation (so-called creeping fat)."
        title: "اختار الأشعة المناسبة"
        alt: "Five stacked boxes pairing each imaging test with what it is best for: plain film for obstruction and megacolon; CT for wall thickening, creeping fat, abscess; MR enterography for mild disease without radiation; MRI pelvis for perianal fistula; intestinal ultrasound safe without radiation or contrast."
        caption: "كل أشعة ليها شغلانة: الـ **plain film** للـ obstruction، الـ **CT** للـ creeping fat والـ abscess، الـ **MRE** أحسن في الـ mild disease، والـ **MRI pelvis** للـ perianal fistula."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="5" width="320" height="56" rx="8" class="fg-box"/>
            <text x="15" y="28" class="t-b">Plain abdominal film</text>
            <text x="15" y="48" class="t-sm t-mut">Obstruction, megacolon; otherwise limited</text>
            <rect x="5" y="70" width="320" height="56" rx="8" class="fg-acc"/>
            <text x="15" y="93" class="t-b">CT / CT enterography</text>
            <text x="15" y="113" class="t-sm">Wall thickening, creeping fat, abscess, mass</text>
            <rect x="5" y="135" width="320" height="56" rx="8" class="fg-good"/>
            <text x="15" y="158" class="t-b">MR enterography</text>
            <text x="15" y="178" class="t-sm">Better for mild disease than CTE; no radiation</text>
            <rect x="5" y="200" width="320" height="56" rx="8" class="fg-bad"/>
            <text x="15" y="223" class="t-b">MRI pelvis</text>
            <text x="15" y="243" class="t-sm">Perianal fistulae and abscesses</text>
            <rect x="5" y="265" width="320" height="56" rx="8" class="fg-box"/>
            <text x="15" y="288" class="t-b">Intestinal ultrasound</text>
            <text x="15" y="308" class="t-sm t-mut">Safe: no radiation, no contrast</text>
          </svg>
      - kind: explain
        page: 211
        title: "المنظار"
        quote: "Ileal ulceration and skip lesions help distinguish Crohn disease from ulcerative colitis. The rectum is often spared."
        text: |
          الـ **colonoscopy** هو الأساس: بتشوف وبتاخد biopsy. هتلاقي ulcerations، erythema، granularity، strictures، وممكن **pseudopolyps**.

          اللي بيفرّقه عن الـ UC: ==ileal ulceration== و **skip lesions**، والـ **rectum often spared**.

          - الـ **fistulae** صعب تتشاف بالمنظار: أحسن بالـ **contrast studies** أو **MRI**.
          - الـ **capsule endoscopy** بتشوف الـ small bowel، بس لو فيه **stricture** الكبسولة ممكن تتحبس ومحتاجة جراحة.
      - kind: aside
        tone: trap
        page: 212
        quote: "Capsule endoscopy can visualize the small intestine provided there was no stricture otherwise retention of the capsule can occur"
        text: |
          فخ: عيان Crohn عنده أعراض obstruction (ألم، انتفاخ، ترجيع) وحد اقترح **capsule endoscopy**؟

          لأ. الـ stricture هيحبس الكبسولة والعيان هيروح العمليات علشان يطلّعها. استبعد الـ stricture الأول.
      - kind: explain
        page: 212
        title: "المضاعفات: خرم، تضييق، ونقص"
        quote: "Deficiencies in iron, folate, vitamin B12, and fat-soluble vitamins (A, D, E, and K) are common"
        text: |
          - من الـ **penetrating و stenosing**: perforation، abscess، fistulae، obstruction.
          - نقص **iron، folate، B12** و الـ fat-soluble vitamins **A, D, E, K** ← anemia و osteoporosis.
          - **short gut syndrome** بعد resection كبير ← protein-calorie deficiency واعتماد على ==parenteral nutrition==.
          - **small bowel bacterial overgrowth**، خصوصًا مع stricture أو بعد شيل الـ **ileocecal valve**.
      - kind: figure
        page: 212
        quote: "Resection of 50–100 cm of ileum typically causes bile salts to spill into the colon, resulting in a bile salt– induced diarrhea"
        title: "مسطرة الـ ileum: 50 و 100 سم"
        alt: "A horizontal ruler of resected ileum. Under 50 cm: no label. 50 to 100 cm, amber: bile salts spill into the colon, watery bile salt diarrhea, treat with bile acid sequestrants. Over 100 cm, red: bile salt pool depleted, fat maldigestion, steatorrhea."
        caption: "**50–100 cm**: الـ bile salts بتعدّي للقولون وتعمل إسهال، والـ ==bile acid sequestrants== بتعالجه. **فوق 100 cm**: الـ pool نفسه خلص، فالدهون ما بتتهضمش: **steatorrhea**."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L06r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <text x="165" y="20" text-anchor="middle" class="t-b">Ileum resected or diseased</text>
            <rect x="10" y="35" width="90" height="30" class="fg-box"/>
            <rect x="100" y="35" width="110" height="30" class="fg-acc"/>
            <rect x="210" y="35" width="110" height="30" class="fg-bad"/>
            <text x="100" y="82" text-anchor="middle" class="t-sm t-b">50 cm</text>
            <text x="210" y="82" text-anchor="middle" class="t-sm t-b">100 cm</text>
            <path d="M155 70v40" class="fg-arrow" marker-end="url(#L06r)"/>
            <path d="M265 70v100" class="fg-arrow" marker-end="url(#L06r)"/>
            <rect x="10" y="115" width="200" height="50" rx="6" class="fg-acc"/>
            <text x="20" y="135" class="t-sm t-b">Bile salts spill into colon</text>
            <text x="20" y="155" class="t-sm">Watery diarrhea: sequestrants help</text>
            <rect x="120" y="175" width="200" height="70" rx="6" class="fg-bad"/>
            <text x="130" y="197" class="t-sm t-b">Bile salt pool depleted</text>
            <text x="130" y="216" class="t-sm">Fat maldigestion</text>
            <text x="130" y="234" class="t-sm t-bad t-b">Steatorrhea</text>
          </svg>
      - kind: check
        page: 212
        quote: "If more than 100 cm of ileum is resected or diseased, reabsorption of bile salts may be so impaired that the total pool is depleted"
        question: "After 130 cm of ileal resection, a patient has greasy stools that get worse on cholestyramine. Why?"
        options:
          - "The bile salt pool is depleted, so fat is maldigested"
          - "Bile salts are irritating the colon"
          - "He needs a higher sequestrant dose"
          - "Lactose intolerance"
        answer: 0
        why:
          - "صح: فوق 100 cm الـ pool خلص، والـ sequestrant بيسحب الباقي فيزوّد الـ steatorrhea."
          - "ده سيناريو الـ 50–100 cm."
          - "الـ sequestrant هنا بيضر، مش محتاج جرعة أعلى."
          - "الـ lactose intolerance إسهال مائي مش دهني."
      - kind: order
        page: 212
        quote: "Calcium readily binds unabsorbed fatty acids, allowing oxalate to be taken up by the bowel in greater quantity."
        prompt: "حصوة الكلى في الـ Crohn: رتّب الخطوات"
        steps:
          - "Fatty acids are not absorbed"
          - "Calcium binds the free fatty acids in the lumen"
          - "Oxalate is left free and absorbed more"
          - "Kidneys excrete excess oxalate"
          - "Calcium oxalate stones form"
        why: "الـ calcium عادة بيمسك الـ oxalate في الأمعاء فيخرج في البراز. لما الدهون تمسك الـ calcium، الـ oxalate بيفضل حر ويتمص، ويروح الكلى."
      - kind: aside
        tone: analogy
        page: 212
        quote: "Subsequent renal excretion of this excess oxalate promotes the precipitation of calcium oxalate calculi."
        text: |
          الـ calcium زي **أمين شرطة** واقف في الأمعاء ماسك الـ oxalate من إيده علشان ما يدخلش.

          جات الدهون اللي ما اتمصتش وشغلته (الـ calcium اتلزق فيها)، فالـ oxalate **هرب** واتمص، وراح عمل مشكلة في الكلى.
      - kind: try
        items: [git.L06.047, git.L06.056, git.L06.059, git.L06.066, git.L06.071]
    recap:
      - "مفيش test بيشخّص؛ anemia (iron)، thrombocytosis، low albumin، CRP عالي."
      - "Calprotectin/lactoferrin: IBD ضد IBS، activity، flare، response."
      - "CT: wall thickening + **creeping fat**. MRE أحسن في الـ mild. MRI pelvis للـ perianal."
      - "Colonoscopy: ileal ulcers + skip lesions + rectal sparing. Capsule ممنوعة مع stricture."
      - "50–100 cm ileum: bile salt diarrhea (sequestrants). فوق 100: steatorrhea."
      - "Fat يمسك calcium ← oxalate يتمص ← calcium oxalate stones."
