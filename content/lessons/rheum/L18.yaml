          لو الغدة **severe dysfunction**، مفيش حاجة تتشغّل، فبتعوّض الريق من برّه: **saliva substitution**. (الدوا اللي الكتاب معلّم عليه بنجمة غالبًا muscarinic agonist زي pilocarpine؛ ده من خارج الكتاب.)
