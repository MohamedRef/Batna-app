  - id: hb.L12.lesson2
    title: "الحديد اللي مش لاقي باب يقفله"
    hook: "هرمون صغير اسمه hepcidin هو اللي بيقرر الحديد يدخل ولا لأ. لو غاب، الجسم بيفتح البوابات على الآخر."
    minutes: 9
    pages: [196, 198]
    topics: [hh-path]
    goals:
      - "تعرّف الـ hemochromatosis وتقول بيتورث إزاي ومين أكتر عرضة"
      - "ترسم سلسلة الـ pathogenesis من الجين لحد الـ HCC"
      - "تفرّق بين الـ 4 types بالجين والميزة"
    status: unverified
    steps:
      - kind: explain
        page: 196
        title: "يعني إيه hemochromatosis؟"
        text: |
          - **Hemochromatosis**: inherited disease الجسم فيه بيمتص حديد أكتر من اللازم من الأكل، والحديد الزيادة بيترسب في الأعضاء.

          علشان المرض يظهر لازم المريض يورث ==two defective genes, one from each parent==. يعني الأب والأم ممكن يبقوا سليمين خالص، كل واحد شايل جين واحد بس.

          والرجالة أكتر بكتير من الستات، والـ prevalence بتزيد مع السن.

          ليه ده خطير؟ الجسم عنده طرق كتير يدخّل بيها الحديد، بس مالوش طريق منظّم يطلّعه. فأي زيادة في الامتصاص بتتراكم على طول.
      - kind: reveal
        page: 197
        prompt: "ليه الرجالة أكتر؟ وليه المرض بيزيد مع السن؟"
        answer: |
          - الستات بيخسروا حديد كل شهر مع الدورة، ومع الحمل. ده زي phlebotomy طبيعي بيأخّر التراكم.
          - الحديد بيتراكم سنة ورا سنة، فكل ما السن يزيد المخزون يكبر. والكتاب قال إن الأعراض ممكن تاخد 20-30 سنة تظهر، وده الدرس الجاي.

          التفسير الأول مقبول؛ الكتاب قال الملاحظة بس.
      - kind: explain
        page: 197
        title: "Hepcidin: المتحكم الأول"
        text: |
          الـ central regulator of systemic iron homeostasis هو الـ ==hepcidin==.

          - **Hepcidin**: peptide hormone بيعمله الـ hepatocytes أساسًا. شغلته يقول للجسم «كفاية حديد».
          - **Ferroportin**: الباب اللي الحديد بيخرج منه من خلايا الأمعاء والـ macrophages للدم. الـ hepcidin بيقفله.
          - **Transferrin saturation**: نسبة الـ transferrin، ناقل الحديد في الدم، اللي شايلة حديد فعلًا.

          الـ hemochromatosis سببها deficiency or impairment في الـ hepcidin synthesis or function، بسبب variants في جينات بتنظّم إنتاجه أو شغله.

          النتيجة:

          - ↑ intestinal iron absorption
          - ↑ iron release from macrophages
          - expanded circulating iron pool، وده بيبان في ==↑ transferrin saturation==

          الربط: الـ hepcidin قليل، فالباب مفتوح، فالحديد في الدم يزيد، فالـ transferrin يتملي. علشان كده الـ transferrin saturation هو أول فحص هتقابله في الدرس الجاي.
      - kind: figure
        page: 197
        title: "من الجين للـ HCC"
        alt: "A vertical chain. Pathogenic variants in genes regulating hepcidin lead to low hepcidin. Low hepcidin leaves the ferroportin iron exit door open on gut cells and macrophages, so absorption and macrophage release both rise. That expands the circulating iron pool, seen as raised transferrin saturation. Iron goes to the liver first; when it is full, to the heart, pituitary and pancreas. Untreated, the liver goes to fibrosis, cirrhosis and HCC."
        caption: "الـ hepcidin بيقفل باب خروج الحديد (**ferroportin**) في الأمعاء والـ macrophages. لو قلّ، البابين بيفضلوا مفتوحين. الكبد بيتملي الأول، وبعده القلب والـ pituitary والـ pancreas."
