      - kind: explain
        page: 238
        title: "الـ allopurinol: الـ gold standard"
        quote: "Although doses of 100-800 mg/day were approved, the most common dose of 300 mg/ day failed to achieve a serum urate level of < 6 mg/ dl in 50% of cases"
        text: |
          - ==gold standard uricostatic drug==، مناسب لأغلب الحالات و side effects مقبولة.
          - الجرعات المعتمدة **100–800 mg/day**، بس الجرعة المشهورة **300 mg** بتفشل توصّل لـ < 6 في **50%**.

          الدرس: الـ 300 مش سقف، اللي يحدد هو التحليل.

          ليه الجرعة 300 مش كفاية؟ في الخطوة اللي فاتت: الـ 300 بتفشل في نص الناس، فالتحليل هو اللي بيحدد.
