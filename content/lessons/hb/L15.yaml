      - kind: explain
        page: 274
        title: "شغلانتين في عضو واحد"
        text: |
          البنكرياس مصنعين في مبنى واحد: واحد بيصدّر للأمعاء، والتاني بيصب في الدم.

          **Exocrine portion**: الـ acini بتفرز إنزيمات هضم في الـ duct للـ duodenum. معظمها بيطلع **inactive pro-enzymes (zymogens)**، يعني مقفولة لحد ما توصل:
          - Trypsinogen, chymotrypsinogen
          - Pro-carboxypeptidase, pro-elastase
          - Kallikreinogen, pro-phospholipase A and B
          - وغيرهم: amylases, lipases, DNA-ase, RNA-ase

          **Endocrine portion**: حوالي مليون **islets of Langerhans** متفرّقين في النسيج، وبيفرزوا هرمونات في الدم:
          - **A-cells**: glucagon (بيرفع السكر).
          - **B-cells**: insulin (بينزّل السكر).
          - **D-cells**: somatostatin (بيهدّي الاتنين).

          الربط: لما البنكرياس يتحرق على مدى سنين (الدرس السادس)، الجزء الـ exocrine يقع فيحصل إسهال دهني، والـ islets تقع فيحصل diabetes.
      - kind: reveal
        page: 275
        prompt: "البنكرياس بيصنع إنزيمات بتهضم بروتين ودهون... طب ليه مبيهضمش نفسه؟ فكّر في 5 أسباب قبل ما تفتح."
        answer: |
          الكتاب بيقول 5:

          - الإنزيمات بتطلع **inactive pro-enzymes** (ما عدا **amylase و lipase**).
          - الإنزيمات **membrane-bound**.
          - التفعيل محتاج **trypsinogen → trypsin** بواسطة **duodenal enterokinase**، يعني المفتاح في الـ duodenum مش جوه البنكرياس.
          - فيه **trypsin inhibitors** في عصارة الـ acini والـ ducts.
          - الـ **acinar cells** نفسها مقاومة لإنزيمات كتير.
      - kind: aside
        tone: analogy
        page: 275
        text: |
          تخيّل البنكرياس مصنع صواريخ: كل صاروخ بيخرج من غير فتيل (zymogen)، ومتغلّف (membrane-bound)، والفتيل نفسه (**enterokinase**) محطوط في المخزن التاني بعيد (الـ duodenum). وفيه طفايات حريق في كل ممر (trypsin inhibitors)، والعمال لابسين بدل ضد النار (acinar cells resistant).

          الـ **pancreatitis** ببساطة: الفتيل ولّع جوه المصنع.
      - kind: match
        page: 275
        prompt: "وصّل كل خلية أو إنزيم بشغلته:"
        pairs:
          - ["A-cells", "Glucagon"]
          - ["B-cells", "Insulin"]
          - ["D-cells", "Somatostatin"]
          - ["Duodenal enterokinase", "Turns trypsinogen into trypsin"]
        why: "A = glucagon، B = insulin، D = somatostatin. والـ enterokinase في الـ duodenum هو اللي بيفعّل الـ trypsinogen."
      - kind: check
        page: 275
        question: "Which pancreatic enzyme is secreted in its **active** form?"
        options:
          - "Lipase"
          - "Trypsinogen"
          - "Pro-elastase"
          - "Chymotrypsinogen"
        answer: 0
        why:
          - "صح: الكتاب بيستثني **amylase و lipase** من قاعدة الـ pro-enzymes."
          - "ده الـ zymogen الأشهر، ومحتاج enterokinase علشان يبقى trypsin."
          - "اسمه بيقولك: **pro**-elastase، يعني لسه مش شغال."
          - "الـ -ogen في الآخر معناها zymogen."
      - kind: explain
        page: 275
        title: "لما المصنع يتبني غلط (1): ectopic و divisum"
        text: |
          البنكرياس بيتكوّن من برعمين (dorsal و ventral) بيلفّوا ويتلحموا. أي غلطة في اللف أو اللحام بتطلع anomaly.

          **Ectopic (heterotopic) pancreas**: نسيج بنكرياس سليم بس في مكان غلط.
          - أماكنه: stomach, duodenum, jejunum, ileum, Meckel's diverticulum.
          - غالبًا: asymptomatic، وبيتلقط بالصدفة.
          - لو عمل مشكلة: extrinsic compression، أو peptic ulceration and bleeding (لأنه بيفرز عصارة جوه جدار الأمعاء)، أو **intussusception** (لأنه كتلة بتشد الأمعاء).
          - العلاج: surgical resection لو عامل أعراض بس.

          **Pancreas divisum**: الماسورتين (dorsal و ventral) مبيتلحموش (abnormal fusion of the two duct systems). وهو **most common anomaly** (4–14%).
          - الأعراض: ممكن يبقى ساكت، أو يعمل recurrent pancreatitis و recurrent abdominal pain.
          - الأنواع: 3 subtypes.
          - التشخيص: MRI, MRCP, EUS، والعلامة **loss of stack sign** أو **crossed duct sign**.
          - العلاج: dorsal duct stent و/أو sphincterotomy (السبب في الخطوة الجاية).
      - kind: reveal
        page: 276
        prompt: "ليه الـ divisum بيعمل pancreatitis متكررة، وليه علاجه **stent** في الـ dorsal duct؟"
        answer: |
          الكتاب بيدّيك العلاج بس، والمنطق المقبول (physiology) كده:

          الـ **dorsal duct** بيصرّف معظم البنكرياس، وفي الـ divisum مضطر يخرج من **minor papilla** الصغيرة. باب صغير على عصارة كتير = ضغط عالي في الـ duct = التهاب.

          علشان كده الحل إنك توسّع الباب (sphincterotomy) أو **تحط stent** في الـ dorsal duct.
      - kind: explain
        page: 276
        title: "لما المصنع يتبني غلط (2): annular و common channel"
        text: |
          **Annular pancreas**: حلقة من البنكرياس بتلف حوالين الـ D2 (encircling D2) زي الخاتم، فممكن تخنقه وتعمل obstruction.
          - مرتبط بـ: gut atresias و Down syndrome.
          - الترجيع: **non-bilious** (في الـ duodenal atresia عادة bilious).
          - التشخيص: X-ray abdomen بالـ **double bubble sign** (فقاعة في المعدة وفقاعة في الـ duodenum قبل الخنقة)، و CT و EUS.
          - العلاج: **duodenoduodenostomy**: نوصّل الـ duodenum قبل الحلقة بالـ duodenum بعدها، ومنقطعش البنكرياس.

          **Common pancreatobiliary channel**: الـ pancreatic duct والـ CBD بيتلحموا بدري جدًا (abnormal early fusion)، فبيبقى فيه ماسورة مشتركة طويلة والعصارتين بيختلطوا.
          - عصارة البنكرياس ترجع للمرارة: علشان كده مرتبط بـ biliary atresia و **gallbladder dysplasia and malignancy**.
          - الصفرا ترجع للبنكرياس: فبيقدّم بـ recurrent pancreatitis.
          - التشخيص: ERCP, MRCP, EUS.
          - العلاج: **surgical biliary diversion** ± common channel clearance، يعني نفصل طريق الصفرا عن طريق البنكرياس.
      - kind: aside
        tone: trap
        page: 276
        text: |
          الممتحن بيحب يحط **double bubble** في سؤال ويستناك تقول duodenal atresia وخلاص.

          افتكر كلمة الكتاب: الـ **annular pancreas = non-bilious vomiting**، والـ **duodenal atresia = usually bilious**. ولو الطفل عنده **Down syndrome** فالاتنين واردين، فاقرا لون الترجيع كويس.
      - kind: sort
        page: 277
        prompt: "كل علامة تخص أنهي anomaly؟"
        bins: ["Ectopic pancreas", "Pancreas divisum", "Annular pancreas", "Common channel"]
        cards:
          - { text: "Found in a Meckel's diverticulum", bin: 0 }
          - { text: "May cause intussusception", bin: 0 }
          - { text: "Crossed duct sign on MRCP", bin: 1 }
          - { text: "Dorsal duct stent", bin: 1 }
          - { text: "Double bubble sign", bin: 2 }
          - { text: "Duodenoduodenostomy", bin: 2 }
          - { text: "Gallbladder malignancy", bin: 3 }
          - { text: "Surgical biliary diversion", bin: 3 }
        why: "Ectopic: أماكن غريبة ومضاعفات معوية. Divisum: علامات الـ ducts على الـ MRCP و stent. Annular: double bubble و duodenoduodenostomy. Common channel: خلط العصارتين، فالمرارة بتدفع التمن، والحل biliary diversion."
      - kind: check
        page: 276
        question: "A 30-year-old has a third attack of acute pancreatitis. No alcohol, no gallstones, normal triglycerides and calcium. MRCP shows a **crossed duct sign**. What does the book advise?"
        options:
          - "Dorsal duct stent and/or sphincterotomy"
          - "Duodenoduodenostomy"
          - "Surgical biliary diversion"
          - "Resection of the pancreatic head"
        answer: 0
        why:
          - "صح: crossed duct sign = **pancreas divisum**، وعلاجه dorsal duct stent و/أو sphincterotomy."
          - "دي عملية الـ **annular pancreas**."
          - "دي للـ **common pancreatobiliary channel**."
          - "مفيش حاجة في الكتاب بتقول resection للـ divisum."
      - kind: aside
        tone: joke
        text: |
          البنكرياس ده زي الموظف اللي قاعد **retroperitoneal** في آخر أوضة في المصلحة: محدش شايفه ولا حاسس بيه، لحد ما يولّع فالدور كله يعرف اسمه. 😄
      - kind: try
        items: [hb.L15.005, hb.L15.004, hb.L15.012, hb.L15.015, hb.L15.016]
    recap:
      - "البنكرياس **retroperitoneal**: الرأس في حضن الـ duodenum والديل عند الـ splenic hilum، ~20 cm و ~90 gm."
      - "A = glucagon، B = insulin، D = somatostatin."
