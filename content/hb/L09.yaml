  topic: diagnosis
  text: SAAG = {{c1::serum albumin − ascitic albumin}} (g/dL).
  src:
    page: 150
    quote: "SAAG is calculated as \"serum albumin concentration - ascites albumin concentration (g/dl)\"."
  status: unverified
