      - kind: figure
        page: 195
        quote: "Diagrammatic representation of the different cells seen histologically in Hodgkin's lymphoma."
        title: "صورة الكتاب: الخلايا في Hodgkin"
        image: { file: hem/L12-hodgkin-cells.webp, book: true }
        alt: "Book diagram with two headings. Left heading, host response: plasma cells and lymphocytes as small blue and green round cells, an eosinophil with orange granules and a bilobed nucleus, histiocytes as pink irregular cells, and a mononuclear Hodgkin cell at the lower left. Right heading, the malignant cell (Reed–Sternberg): a very large blue cell with two big purple nuclei, each with a nucleolus."
        caption: |
          رسمة الكتاب نفسها اللي الخطوة اللي فوق مبسطاها. العنوانين فوق بيقسموا الصورة نصين:

          - **يمين، The malignant cell (Reed–Sternberg)**: أكبر خلية في الصورة، **نواتين** بنفسجي كبار وفي كل واحدة nucleolus: ده الـ ==owl eye==.
          - **شمال، Host response**: كل اللي حواليها **مش خبيث**: **plasma cell** (فوق)، **lymphocytes** (الدواير الخضرا الصغيرة)، **eosinophil** (البرتقاني المنقط)، و **histiocytes** (الخلايا البمبي اللي شكلها غير منتظم، شمال وتحت).
          - **تحت على الشمال، Hodgkin cell**: نسخة من الخلية الخبيثة بنواة **واحدة**.

          وده سر الـ Hodgkin: الـ ==RS cells قليلة== وسط زحمة خلايا التهاب، فالـ biopsy لازم تبان فيها الخلية دي عشان التشخيص.
      - kind: explain
        remind: [hem.L12.025]
        page: 194
        quote: "Incidence\n  1- One percent of cancer registration per year. Less common in Japan.\n  2- Bimodal age incidence- major peak between 20 and 29 years and minor peak 60 years.\n  3- Overall higher incidence in males.\n  4- Nodular sclerosing (NS) histology most common subtype in young adults."
        title: "مين بيجيله؟"
        text: |
          - **1%** من الـ cancer registrations في السنة؛ أقل في اليابان.
          - ==Bimodal==: peak كبير **20-29 سنة**، وصغير عند **60**.
          - أكتر في الرجالة. أشهر subtype في الشباب: **nodular sclerosing**.
          - Risk: **high socioeconomic status in childhood**، familial aggregation، و **EBV** خصوصًا بعد infectious mononucleosis.

          يعني لما تشوف شاب في العشرينات بغدة في الرقبة ومعاه mass في الـ mediastinum، أول حاجة تيجي في بالك Hodgkin nodular sclerosing: السن (ص 194) والـ mediastinum (ص 196) بيشاوروا على نفس الـ subtype.
      - kind: aside
        tone: joke
