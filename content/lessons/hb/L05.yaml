      - "تحفظ مين نعمله screening ومرة كل قد إيه"
      - "تعرف هيكل الـ 7 essay questions اللي في آخر المحاضرة"
    status: unverified
    steps:
      - kind: explain
        page: 94
        title: "الوقاية"
        text: |
          مفيش vaccine لـ C، فالوقاية كلها إنك تقفل طريق الدم. الكتاب بيقول 3 حاجات:

          - ==Safe injections and blood screening==: إبرة لكل مريض، وكل كيس دم يتعمله screening قبل ما يتنقل.
          - ==Harm reduction in IV drug users==: لو مش هيبطل دلوقتي، على الأقل مايشاركش السرنجة (needle exchange).
          - ==Safe healthcare practices==: تعقيم الأدوات في العيادات والغسيل الكلوي وعند دكتور الأسنان.

          لاحظ إن التلاتة بيقابلوا طرق العدوى اللي في درس 1 واحدة بواحدة: الإبر، والـ transfusion، والـ unsafe procedures.
      - kind: explain
        page: 94
        title: "مين نعمله screening؟"
        text: |
          الكتاب بيقسم الناس لـ 3 مجموعات:

          - ==All adults==: كل واحد عنده 18 سنة أو أكتر، at least once. مرة واحدة في العمر كفاية لو مفيش risk جديد.
          - **High-risk groups**: IV drug users، و prisoners، و dialysis patients. دول الخطر عندهم مستمر.
          - **Pregnant women**: ==once during each pregnancy==. كل حمل جديد = تحليل جديد.

          الفكرة: الكل يتكشف مرة، واللي الخطر عنده مستمر يتابع.
