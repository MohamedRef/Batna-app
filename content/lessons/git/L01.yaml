        quote: "May lead to both gastric and duodenal ulcers Includes acetylsalicylic acid (ASA) More commonly associated with gastric ulcers Co-administration of corticosteroids and bisphosphonates with NSAIDs; Sirolimus, selective serotonin reuptake inhibitors (SSRIs), 5-fluorouracil (5-FU)"
        title: "Risk factors للـ ulcer"
        columns: ["Risk factor", "الملاحظة"]
        rows:
