  - id: res.L09.lesson10
    title: "الملف في اللجنة: من الـ application للموافقة"
    hook: "قدّمت الورق. هيحصل إيه بعد كده، والموافقة هتفضل لحد إمتى؟"
    minutes: 6
    pages: [77, 84]
    topics: [rec]
    goals:
      - "تعرف الـ essential documents ومسار الملف في اللجنة"
      - "تعرف مدة الموافقة وقرارات اللجنة"
      - "تفرّق الـ non-human subject research"
    status: unverified
    steps:
      - kind: explain
        remind: [res.L09.068]
        page: 77
        quote: "Essential Documents:\n  1. A signed and dated application form\n  2. Full protocol.\n  3. Informed consent\n  4. CV's for the PI and co-investigators.\n  5. Additional tools for the study\n  6. For clinical trials...safety reports, previous studies..\n  7. Signed researcher assurance agreement"
        title: "الـ application والورق"
        text: |
          الـ **application** بيجاوب **7 items** (slide 76): subject selection، procedures، risks/benefits، confidentiality، informed consent، حماية زيادة للـ vulnerable، و conflict of interest.

          والـ **essential documents**:

          1. Application form ممضي ومتأرخ.
          2. **Full protocol**.
          3. **Informed consent**.
          4. **Curriculum vitae (CV)** للـ PI والـ co-investigators.
          5. أدوات الدراسة الإضافية.
          6. للـ clinical trials: safety reports ودراسات سابقة.
          7. **Researcher assurance agreement** ممضي.
      - kind: aside
        tone: exam
        page: 78
        quote: "Composition of Ethics Review Boards\n  At least 5 members\n  Qualifications & experience\n  At least one with the scientific background\n  Include men and women\n  A community representative\nThere are minor variations between guidelines on composition"
        text: |
          سلايد **composition of ethics review boards** (slide 78) طالعة فاضية في ملف الـ slides، بس في فيديو المحاضرة كان فيها رسمة:

          - ==at least 5 members==
          - بـ **qualifications and experience**
          - واحد على الأقل بـ **scientific background**
          - **men and women**
          - و **community representative**

          والدكتورة قالت إن اللجنة فيها خبرات علمية وغير علمية، وإن فيه **minor variations** بين الـ guidelines في التكوين.
        remind: [res.L09.114]
      - kind: explain
        page: 80
        quote: "Approval is for up to one year,\n  May be less depending on level of risk.\n  Required documentation for Continuing Review\n    number of subjects enrolled\n    description of any adverse events or unanticipated problems\n    summary of any recent literature\n    copy of the current informed consent"
        title: "الموافقة لحد إمتى؟"
        text: |
          - الموافقة ==لحد سنة==، وممكن أقل حسب الـ risk.
          - الـ **continuing review** محتاج: عدد اللي دخلوا، أي **adverse events** أو مشاكل مش متوقعة، ملخص الـ literature الجديدة، ونسخة الـ consent الحالية.
          - الـ **non-human subject research** (مافيش intervention/interaction ولا identifiable private information): الـ **chair أو vice-chair** يحدد، **من غير full board ومن غير consent** (slide 81).
          - والـ IRB تقدر: توافق/ترفض/تطلب تعديل، تعمل continuing review، تراقب وتعمل audit، و**توقف أو تنهي** بحث متوافق عليه (slide 83).
      - kind: check
        page: 80
        quote: "Approval is for up to one year,\n  May be less depending on level of risk.\n  Required documentation for Continuing Review\n    number of subjects enrolled\n    description of any adverse events or unanticipated problems\n    summary of any recent literature\n    copy of the current informed consent"
        question: "For how long is REC approval given?"
        options: ["Up to one year", "For the whole study", "Up to five years"]
        answer: 0
        why:
          - "صح: لحد سنة، وممكن أقل لو الـ risk أعلى، وبعدها continuing review."
          - "لأ، فيه مراجعة دورية."
          - "مش على الـ slides؛ الحد سنة."
      - kind: explain
        page: 81
        quote: "Non-Human Subject Research\n  Researches that does not\n    Involve an intervention/interaction\n    Obtain identifiable private information\n  Chair or vice-chair makes the determination.\n  No review by the full board of the REC.\n  No informed consent."
        title: "Non-human subject research"
        text: |
          البحث اللي ==مافيهوش== intervention/interaction ==ولا== بياخد identifiable private information.

          - اللي بيحدد ده: ==chair أو vice-chair==.
          - مفيش full-board review.
          - مفيش informed consent.

          ليه؟ لأن مفيش إنسان حي ممكن يتأذى أو يتعرف، فمراجعة اللجنة كلها هتبقى وقت ضايع. التفسير المقبول (مش في الكتاب).
      - kind: figure
        remind: [res.L09.073]
        page: 82
        quote: "REC Procedures\n  PI submits Study Protocol, Consent Form → REC Chair or GS → Exempt or Expedited, or Full review by the full Board\n  Full review: 2 REC Members assigned as primary and secondary reviewers; protocol and consent form and other documents discussed at meeting → REC Vote → comments sent to PI:\n    Approve\n    Approval with minor changes\n    Deferral\n    Disapprove"
        title: "الملف بيمشي إزاي في اللجنة"
        alt: "Flow: the principal investigator submits the protocol and consent form; the REC chair sends it either to exempt or expedited review, or to full-board review. In full review two members act as primary and secondary reviewers, the protocol is discussed at the meeting and the REC votes: approve, approve with minor changes, defer, or disapprove; comments go back to the investigator."
        caption: "الـ **PI** يقدّم ← الـ **chair** يحدد: exempt/expedited أو **full board** ← اتنين reviewers ← مناقشة ← **vote**: approve، minor changes، deferral، disapprove."
