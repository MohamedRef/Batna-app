  - id: dm.L17.lesson6
    title: "مين يتعالج، بإيه، ولحد امتى"
    hook: "الـ drug holiday مش لكل الناس، والـ denosumab بالذات ممنوع يوقف فجأة."
    minutes: 10
    pages: [225, 230]
    topics: [choice, duration]
    goals:
      - "تعرف عتبات الـ NOF للعلاج وليه الـ T-score مش لوحده"
      - "ترتب اختيار الدوا: bisphosphonate ← raloxifene ← PTH، وليه"
      - "تحفظ مواعيد الـ reassessment والـ holiday"
    status: unverified
    steps:
      - kind: explain
        page: 225
        title: "الإرشادات بتختار المرضى بإيه؟"
        quote: "Most current treatment guidelines rely on the use of BMD T-score plus risk factors for fracture, but differ in the populations addressed, T-score cutoffs used, and risk factors considered."
        text: |
          أغلب الإرشادات بتستخدم حاجتين مع بعض: ==BMD T-score== + **risk factors for fracture**. وبتختلف في: مين المرضى، أنهي cutoff، وأنهي risk factors.

          ليه الاتنين مع بعض؟ عشان الكثافة لوحدها مش كل الحكاية: ست عندها T = -1.8 ووقعت قبل كده وبتاخد steroids أخطر من ست T = -2.1 ومفيش حاجة تانية. وعشان كده الـ NOF والـ WHO بيعملوا models بتجمع الـ BMD مع الـ clinical risk factors (زي الـ FRAX)، والكتاب متوقع إنها ==تحط عتبات العلاج الجديدة==.
      - kind: explain
        page: 225
        title: "مين ياخد دوا؟"
        quote: "Until newer methodologies are available and widely adopted, we recommend using the NOF approach, which suggests pharmacologic therapy for postmenopausal women with T-scores less than -2.0, as measured by central DXA, regardless of risk factors for fracture, and for those with T-scores less than -1.5 if risk factors are present [24]. This strategy differs somewhat from guidelines in Europe, which recommend intervention for individuals with a T- score of -2.5 or less [25]."
        text: |
          الكتاب ماشي بالـ ==National Osteoporosis Foundation (NOF) approach==:
          - **T-score < -2.0** على الـ central dual-energy X-ray absorptiometry (DXA): عالج، أيًا كانت الـ risk factors.
          - **T-score < -1.5** مع risk factors: عالج.
          - أوروبا: **-2.5 or less**.

          يعني الكتاب بيعالج بدري عن أوروبا: الـ risk factors بتخلّي العتبة توطى، لأن نفس الكثافة مع risk factors معناها كسر أقرب.
      - kind: update
        page: 225
        quote: "Until newer methodologies are available and widely adopted, we recommend using the NOF approach, which suggests pharmacologic therapy for postmenopausal women with T-scores less than -2.0, as measured by central DXA, regardless of risk factors for fracture, and for those with T-scores less than -1.5 if risk factors are present [24]. This strategy differs somewhat from guidelines in Europe, which recommend intervention for individuals with a T- score of -2.5 or less [25]."
        text: "الـ Bone Health and Osteoporosis Foundation (الـ NOF سابقًا) دلوقتي: عالج لو فيه **hip أو vertebral fracture**، أو **T ≤ -2.5**، أو T بين -1 و -2.5 مع **Fracture Risk Assessment Tool (FRAX) ≥ 20%** major أو **≥ 3%** hip."
        ref: "BHOF Clinician's Guide 2022"
      - kind: order
        page: 228
        quote: "We recommend bisphosphonates as first-line therapy for postmenopausal osteoporosis. In the absence of randomized trial data showing that ibandronate reduces the risk of hip fractures, we continue to recommend alendronate or risedronate as our preferred choice of bisphosphonate."
        prompt: "رتّب اختيار الدوا زي الكتاب:"
        steps:
          - "Oral alendronate or risedronate"
          - "IV ibandronate if GI intolerance"
          - "Raloxifene if no bisphosphonate is tolerated"
          - "PTH (not first line)"
        why: "Bisphosphonates first line، والمفضل alendronate أو risedronate لأن الـ ibandronate مفيش data إنه بيمنع الـ hip. الـ IV ibandronate للـ gastrointestinal (GI) intolerance. الـ raloxifene أضعف فبيتحجز. الـ parathyroid hormone (PTH) غالي وحقن وفيه قلق osteosarcoma."
      - kind: explain
        page: 229
        title: "الترتيب ده جاي منين؟"
        quote: "Since the antiresorptive effects of raloxifene are less than those of bisphosphonates, we reserve the use of this drug for patients who cannot tolerate any bisphosphonates."
        text: |
          كل خطوة في الترتيب ليها سبب في الكتاب:

          - **Bisphosphonates أول**، وجوّاهم ==alendronate أو risedronate== لأن الـ ibandronate مفيش randomized data إنه بيقلل الـ hip fracture.
          - **IV ibandronate**: للي ==معدته مش مستحملة== الـ oral.
          - **Raloxifene**: تأثيره أقل من الـ bisphosphonates، فبيتحجز للي ==مش مستحمل أي bisphosphonate==.
          - **PTH**: غالي، وحقن تحت الجلد، وقلق على المدى الطويل (osteosarcoma)، وفيه بدايل؛ فمش first line.

          التفسير المقبول (مش في الكتاب) للـ ibandronate الـ IV: الحقنة بتعدّي على المعدة والمريء خالص، فمفيش esophagitis.
      - kind: aside
        tone: trap
        page: 229
        quote: "Given its cost, subcutaneous route of administration, long-term safety concerns (including osteosarcoma), and the availability of other agents, PTH is generally not used as a first-line treatment or preventive agent for osteoporosis."
        text: "الـ PTH أقوى دوا بيبني عضم، بس **مش first line**: ==cost==، حقن subcutaneous، و **osteosarcoma** concern. بيتحجز للـ very high risk."
