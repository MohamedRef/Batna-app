  # ---------- p156: replicative senescence ----------
  - id: geri.L09.007
    kind: card
    topic: replicative
    front: Define replicative senescence.
    back: Age-related shortening of telomere length with impaired cell division; clonal expansion falls, as T cells cannot replicate as avidly after binding antigen.
    src: { page: 156, quote: "Replicative senescence is the age-related shortening of telomere length and impairment of cell division. Clonal expansion is diminished in old, with T cell unable to replicate as avidly upon binding with an antigen." }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.008
    kind: card
    topic: replicative
    front: Why do old people fight old infections but not new ones?
    back: Naive cells fall and memory cells rise, so defence against previously recognized pathogens is intact but response to novel antigens is reduced.
    src: { page: 156, quote: "The decrease in naive cells and the increase in memory cells, make the immune system with an intact capacity to defend against previously recognized pathogen& decrease ability to respond to novel antigen." }
    status: unverified
    tags: [high-yield]
