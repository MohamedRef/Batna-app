schema: batna.lesson/v1
lecture: hb.L02
lessons:
  # ------------------------------------------------------------------
  - id: hb.L02.lesson1
    title: "نستبعد الأول: منطق الـ NITs"
    hook: "ليه FIB-4 رخيص بيطمّنك أكتر ما بيخضّك؟ وإمتى تعيد الـ FibroScan بعد أسبوع من غير خمرة؟"
    minutes: 9
    pages: [23, 25]
    topics: [principles, serum-tests, elastography, pathways]
    goals:
      - "تشرح ليه الـ NITs بتستبعد (rule out) أكتر ما بتشخّص في الناس قليلة الخطورة"
      - "تفرّق بين الـ patented والـ non-patented وبين أنواع الـ elastography"
      - "تمشي في الـ primary-care pathway: FIB-4 ثم TE ثم patented tests"
      - "تحفظ أرقام الـ rule-out في NAFLD: 8 kPa و 0.48 و 1.3"
    status: unverified
    steps:
      - kind: explain
        page: 23
        title: "القاعدة رقم واحد"
        quote: "should be used for ruling out rather than diagnosing advanced fibrosis in low prevalence populations"
        text: |
          الـ **non-invasive tests (NITs)** معمولة علشان نبطّل نعمل **liver biopsy** لكل واحد عنده إنزيمات عالية شوية.

          والكتاب بيبدأ بأهم جملة: في الناس اللي الـ **advanced fibrosis** نادرة فيهم (**low prevalence**)، الـ NITs بتستخدم علشان **تستبعد (rule out)** مش علشان **تشخّص**.

          ليه؟ لما المرض نادر، أغلب الـ positive results بتطلع **false positive**، لكن الـ negative result بيبقى مطمّن جدًا (الـ **negative predictive value** عالية). فالنتيجة الواطية بتقفل الملف، والعالية بتفتح تحقيق مش أكتر.

          وعلشان كده بنستخدمها **في الناس اللي عندهم risk**: **metabolic risk factors** و/أو **harmful use of alcohol**، مش في الـ **unselected general population**.
      - kind: aside
        tone: analogy
        page: 23
        text: |
          الـ NIT زي **كمين المرور**: لو عدّيت والجهاز ما صفّرش، غالبًا انت تمام وروّح.

          لو صفّر؟ مش معناها إنك مجرم، معناها **ركّن على جنب** نتأكد (TE، patented test، أو biopsy). وما ينفعش تعمل كمين في كل شارع في البلد، اعمله في الطريق اللي فيه المشاكل: الـ metabolic والـ alcohol.
      - kind: figure
        page: 23
        title: "صندوق العُدّة: من العيادة العامة لعيادة الكبد"
        alt: "A vertical list of fibrosis tools from top to bottom: non-patented serum scores (AST/ALT ratio, APRI, FIB-4, NFS), patented serum tests (FibroTest, ELF, FibroMeter, Hepascore), transient elastography, ARFI or 2D-SWE, and MR elastography. An arrow on the left runs from primary care at the top, where tests are available and cheap, to liver clinics at the bottom, where they cost more."
        caption: "كل ما تنزل في القايمة: الـ **availability** بتقل والـ **cost** بيزيد. الـ serum scores مكانها الـ **primary care**، والـ **MRE** مكانها عيادات الكبد."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L02a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
