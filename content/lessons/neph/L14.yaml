  - id: neph.L14.lesson4
    title: "بعد الـ induction: maintenance و class V والـ relapse"
    hook: "العلاج ميخلصش في 6 شهور: الإجمالي 36 شهر على الأقل."
    minutes: 8
    pages: [459, 466]
    topics: [ln-maintenance, ln-class5, ln-response, ln-relapse]
    goals:
      - "تختار الـ maintenance drug وتعرف المدة"
      - "تعالج class V حسب الـ proteinuria"
      - "تعرف تعريفات الـ response والـ relapse"
    status: unverified
    steps:
