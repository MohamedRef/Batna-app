  - id: endo.L01.lesson4
    title: "علاج MEN 1: غدة غدة"
    hook: "كل P ليها علاجها. والقاعدة: بنعالج كتير، بس نادرًا بنشفي."
    minutes: 7
    pages: [8, 9]
    topics: [men1-treatment]
    goals:
      - "تعرف إمتى نستكشف الـ parathyroid وإيه الهدف"
      - "تعرف أدوية الـ pituitary في MEN 1"
      - "تعرف علاج الـ islet tumors وحدوده"
    status: unverified
    steps:
      - kind: explain
        page: 8
        quote: "1- Hyperparathyroidism If serum ca is > 12mg/dl, with evidence of ca nephrolithiasis or renal dysfunction, neuropathic or muscular symptoms or bone involvement should undergo parathyroid exploration, all parathyroid tissue should be removed , (the goal is to reduce post operative PTH to < 50% of basal value) and parathyroid tissue implanted in the non-dominant forearm."
        title: "1. الـ hyperparathyroidism"
        text: |
          نعمل ==parathyroid exploration== لو الـ serum Ca أكبر من **12 mg/dl** مع أي من:
          - Ca nephrolithiasis أو renal dysfunction.
          - Neuropathic أو muscular symptoms.
          - Bone involvement.

          نشيل كل الـ parathyroid tissue، والهدف إن الـ parathyroid hormone (PTH) بعد العملية يبقى **أقل من 50% من الـ basal**، ونزرع tissue في الـ ==non-dominant forearm==.

          ليه "كل" الـ tissue؟ لأن في MEN 1 الأربع غدد مريضة، فلو سبنا غدة سليمة الشكل هتكبر بعدين. وليه الـ PTH أقل من نص الأساس؟ يعني ده الدليل إن النسيج الشغال اتشال فعلًا، واللي هيفضل هو الـ graft الصغير بس.
