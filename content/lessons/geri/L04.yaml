  - id: geri.L04.lesson6
    title: "الاكتئاب عند الكبير: موجود ومستخبي"
    hook: "أشهر مرض نفسي عند الكبار، وأغلبه ماحدش بيشوفه. «ده سن بقى» مش تشخيص."
    minutes: 9
    pages: [76, 83]
    topics: [depression, depression-treatment]
    goals:
      - "تعرف نسب الـ depression في الأمراض العضوية وتأثيرها على الوفاة"
      - "تعرف علاج اكتئاب ما بعد الـ MI والـ stroke"
      - "تقيس بالـ GDS وتختار العلاج وتعرف مدته"
    status: unverified
    steps:
      - kind: figure
