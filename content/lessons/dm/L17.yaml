          - { key: "15", text: "1500 mg total calcium a day (500-1000 mg of it as a supplement)" }
          - { key: "30", text: "30 minutes of weight-bearing exercise" }
          - { key: "3", text: "three times a week, and zero cigarettes" }
        hook: "رقم تليفون العضم: **call 8 15 30 3** (vitamin D، calcium، دقايق، مرات في الأسبوع)."
      - kind: try
        items: [dm.L17.062, dm.L17.067, dm.L17.068, dm.L17.076, dm.L17.077]
    recap:
