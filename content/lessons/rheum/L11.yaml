      - kind: explain
        page: 187
        title: "الـ biopsy: إمتى بس"
        quote: "Rectal biopsy may be helpful in CVID and IgA deficiency by showing plasma cell and lymphoid cell infiltrate in rectal tissue.\nThymus biopsy is indicated only in the presence of thymoma.\nSkin biopsy is used to document the presence of GVH."
