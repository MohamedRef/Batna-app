        prompt: "علامة في الكشف ← بتقولك إيه؟"
        pairs:
          - ["Epigastric tenderness", "The most frequent finding"]
          - ["Tachycardia and orthostasis", "Dehydration or active bleeding"]
          - ["Board-like abdomen", "Perforation"]
          - ["Succussion splash", "Gastric outlet obstruction"]
        why: "كلها من ص 28. الكشف **critically important** علشان تلقط الـ complication بدري."
      - kind: explain
        page: 29
        quote: "If the GU biopsies are benign, EGD is repeated 8 weeks later to confirm healing of the GU"
        title: "التشخيص والـ biopsies"
        text: |
          - **Endoscopy = gold standard**.
          - **Test and treat** (UBT أو stool antigen) في الأصغر من **55** من غير alarm، في منطقة الـ cancer فيها قليل والـ H. pylori أكتر من **20%**. الأكبر: منظار.
          - لقيت ulcer؟ biopsies من الـ **antrum والـ body** للـ **rapid urease test**.
          - **GU**: biopsies من ==edges== علشان الـ cancer. ولو benign، كرر المنظار بعد **8 weeks**، لأن لحد **4%** منها بيطلع malignant.
