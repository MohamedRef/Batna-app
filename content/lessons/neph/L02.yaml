        text: |
          الكتاب بيقول إن ==eGFRcr-cys== (الـ creatinine والـ cystatin C مع بعض) ليه علاقة **linear** أكتر بالـ outcomes على المدى الطويل. وفي Figure 8: لو شاكك إن الـ eGFR بالـ creatinine مش دقيق، **قيس cystatin C**. ولو محتاج دقة أكتر من كده، قيس الـ GFR مباشرة.

          التفسير المقبول (مش في الكتاب): الـ ==creatinine== بييجي من **العضلات** واللحمة. فأي حاجة بتغيّر العضل أو الأكل بتغيّر الـ creatinine من غير ما الكلية تتغير. الـ **cystatin C** بتطلّعه تقريبًا كل خلايا الجسم، فمش مربوط بالعضل قوي.

          يعني الاتنين مع بعض بيغطّوا عيوب بعض، وده اللي بيخلّي الرقم أقرب للحقيقة.
