          HE = the most important medical complication after TIPS، وبتظهر كـ acute worsening of mental status خلال 2–3 أسابيع. والمنطق: دم الأمعاء (وفيه الـ ammonia) بيعدّي من الماسورة على المخ من غير ما الكبد ينضّفه، وكل ما الماسورة أوسع (D) والكبد أضعف (L) والمريض أكبر (A)، المخ يتعب أكتر.
      - kind: explain
        page: 56
        quote: "Subsequently, other studies found that the rates of encephalopathy were lower with coated stents compared with bare stents."
        title: "مضاعفات تانية، وبعدين: إزاي ما يرجعش ينزف؟"
        text: |
          **TIPS complications**

          التمن بتاع الطريق المختصر: الدم يوصل المخ من غير ما الكبد ينضّفه.
          - الـ ==bare stents== كان معاها encephalopathy أكتر، والـ **coated stents** أقل.
          - **TIPS-associated hemolysis**: نادر مع الـ coated stents.
          - **Vegetative infections** of the stent: أغلبها مع الـ bare stents، وعلاجها prolonged antibiotics.

          **Preventing variceal rebleeding (secondary prophylaxis)**

          اللي نزف مرة، احتمال كبير ينزف تاني، فالوقاية هنا إجبارية.
          - **Non-selective beta-blocker (NSBBs)**: effective.
          - ==Isosorbide-5-mononitrate (IsMN)==: إضافته بتزوّد نزول الـ HVPG، و randomized controlled trial (RCT) قال إن beta-blocker + IsMN أحسن من الـ beta-blocker لوحده.
          - **Endoscopic band ligation (EBL)** أحسن من الـ sclerotherapy: rebleeding أقل، side effects أقل، و sessions أقل لحد الـ eradication.
