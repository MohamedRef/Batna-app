        answer: 0
        why: "4/58 = 6.9% in 3–6 months, in the 5–10% band = 1 (p123)."
      - question: What is his total MUST and risk?
        options: ["4, high risk", "2, medium risk", "1, medium risk", "0, low risk"]
        answer: 0
