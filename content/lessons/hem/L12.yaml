  - id: hem.L12.lesson3
    title: "Hodgkin: عين البومة"
    hook: "خلية واحدة خبيثة وسط جيش من الخلايا الطيبة. والخلية دي شكلها بيبصلك زي البومة."
    minutes: 8
    pages: [194, 195]
    topics: [hl-basics, hl-subtypes]
    goals:
      - "تعرف أصل الـ RS cell والـ markers بتاعتها"
      - "تحفظ الـ epidemiology والـ risk factors"
      - "تفرّق الأربع classic subtypes"
    status: unverified
    steps:
      - kind: explain
        page: 194
        quote: "neoplastic cells in Hodgkin‘s Lymphoma are clonal B-cells originating in a lymph node germinal centre with a crippled immunoglobulin gene"
        title: "الخلية الخبيثة"
        text: |
          بالـ PCR اكتشفوا إن الخلايا الخبيثة في الـ Hodgkin هي ==clonal B-cells== من الـ **germinal centre**، بس عندها **crippled immunoglobulin gene**: mutations بتمنع إنها تعمل immunoglobulin كامل.

          - أول من وصفه **Thomas Hodgkin سنة 1832**.
          - الـ **EBV genome** موجود في **50% أو أكتر** من الحالات.
      - kind: explain
        page: 194
        quote: "These cells stain with CD 30 and CD 15 but are usually negative for B-cell antigen expression."
        title: "الـ Reed-Sternberg"
        text: |
          التشخيص بـ histology لغدة **excised**. الـ ==RS cell== أساس تشخيص الأربع classic types، وهي جزء من الـ malignant clone.

          - بتاخد صبغة **CD30** و **CD15**.
          - وغالبًا **negative** للـ B-cell antigens (رغم إنها B cell أصلًا، لأن الـ Ig gene بايظ).
          - حواليها: lymphocytes، neutrophils، eosinophils، plasma cells، و fibrosis.
      - kind: figure
        page: 195
        quote: "Lymphocyte predominance 10% Younger patients Rare RS cells Many lymphocytes Usually stage 1 or 2"
        title: "الـ RS cell وسط الزحمة"
        alt: "A large binucleate Reed-Sternberg cell with two big nucleoli like owl eyes in the centre, labelled CD30 and CD15 positive. Around it many small lymphocytes, an eosinophil, a plasma cell and a histiocyte labelled host response."
        caption: "خلية خبيثة واحدة كبيرة بنواتين (owl eye) والباقي كله host response."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="165" cy="110" rx="70" ry="55" class="fg-acc"/>
            <ellipse cx="138" cy="110" rx="24" ry="32" class="fg-box"/>
            <ellipse cx="192" cy="110" rx="24" ry="32" class="fg-box"/>
            <circle cx="138" cy="108" r="9" class="fg-dot-acc"/>
            <circle cx="192" cy="108" r="9" class="fg-dot-acc"/>
            <circle cx="40" cy="40" r="10" class="fg-dot-good"/>
            <circle cx="70" cy="190" r="10" class="fg-dot-good"/>
            <circle cx="290" cy="50" r="10" class="fg-dot-good"/>
            <circle cx="270" cy="190" r="10" class="fg-dot-good"/>
            <circle cx="30" cy="120" r="10" class="fg-dot-good"/>
            <circle cx="300" cy="125" r="13" class="fg-bad"/>
            <text x="10" y="222" class="t-sm t-mut">small dots: lymphocytes, eosinophils, plasma cells</text>
            <text x="105" y="30" class="t-sm t-b t-acc">RS cell: CD30+ CD15+</text>
            <text x="130" y="188" class="t-sm">owl eyes</text>
          </svg>
      - kind: explain
        page: 194
        quote: "Bimodal age incidence- major peak between 20 and 29 years and minor peak 60 years."
        title: "مين بيجيله؟"
        text: |
          - **1%** من الـ cancer registrations في السنة؛ أقل في اليابان.
          - ==Bimodal==: peak كبير **20-29 سنة**، وصغير عند **60**.
          - أكتر في الرجالة. أشهر subtype في الشباب: **nodular sclerosing**.
          - Risk: **high socioeconomic status in childhood**، familial aggregation، و **EBV** خصوصًا بعد infectious mononucleosis.
      - kind: aside
        tone: joke
        page: 194
        quote: "Association with high socioeconomic status in childhood."
        text: "الـ Hodgkin بيحب ولاد الذوات: high socioeconomic status في الطفولة. النظرية إن العدوى بتتأخر (زي الـ EBV) لما الطفولة تبقى نضيفة أوي."
      - kind: table
        page: 195
        quote: "Nodular sclerosis +50% Young adults, only type more common in women, presence of Lacunar RS variants, fibrosis surrounding nodules."
        title: "الأربع classic subtypes"
        columns: ["Subtype", "%", "Clue"]
        rows:
          - ["LP", "10%", "Rare RS, many lymphocytes, stage 1-2"]
          - ["NS", "50%+", "Women, lacunar RS, fibrosis"]
          - ["MC", "30%+", "More RS, rich infiltrate"]
          - ["LD", "Rare", "Many RS, few lymphocytes"]
        hide: [[0, 1], [1, 1], [2, 1], [1, 2], [3, 2]]
      - kind: reveal
        page: 195
        quote: "Lymphocyte depletion Uncommon Numerous RS-cells, decreased lymphocyte percentage, atypical cells"
        prompt: "لاحظ النمط: كل ما الـ lymphocytes تقل، الـ RS تزيد. ليه ده منطقي؟"
        answer: "الـ lymphocytes هي الـ host response اللي بتحارب. lymphocyte predominance = المناعة كسبانة، RS قليلة، stage بدري. lymphocyte depletion = المناعة خسرت، RS كتير. يعني المسطرة من LP لـ LD هي مسطرة شراسة."
      - kind: check
        page: 195
        quote: "Young adults, only type more common in women, presence of Lacunar RS variants, fibrosis surrounding nodules."
        question: "Which classic Hodgkin subtype is the only one more common in women?"
        options: ["Nodular sclerosis", "Mixed cellularity", "Lymphocyte predominance", "Lymphocyte depletion"]
        answer: 0
        why:
          - "صح: young adults، lacunar RS، fibrosis حوالين الـ nodules، وهو الوحيد الأكتر في الستات."
          - "الـ MC فيه RS أكتر و infiltrate غني، ومش أكتر في الستات."
          - "الـ LP: younger، RS نادرة، stage 1-2."
          - "الـ LD نادر وفيه RS كتير."
      - kind: try
        items: [hem.L12.021, hem.L12.023, hem.L12.027, hem.L12.029, hem.L12.030]
    recap:
      - "Hodgkin = clonal germinal-centre B cells بـ crippled Ig gene؛ EBV في ≥ 50%."
      - "RS cell: CD30+ CD15+، B-antigen negative، وسط host response."
      - "Bimodal: 20-29 و 60؛ high socioeconomic status؛ EBV/IM."
      - "NS 50%+ (ستات، lacunar، fibrosis)؛ MC 30%+؛ LP 10%؛ LD نادر."
    practice: [hem.L12.021, hem.L12.022, hem.L12.023, hem.L12.024, hem.L12.025, hem.L12.026, hem.L12.027, hem.L12.028, hem.L12.029, hem.L12.030, hem.L12.031, hem.L12.032, hem.L12.083, hem.L12.084]
