    recap:
      - "Achalasia = loss of inhibitory nerves: LES ما بيرتخيش + aperistalsis ← stasis ← dilatation."
      - "Hallmark: dysphagia للأكل والسوايل. Regurgitation بالليل، chest pain، heartburn في 30%، weight loss خفيف."
      - "Pseudoachalasia حتى 5%: OLD (old، loss of weight، duration أقل من سنة) ← endoscopy، ثم CT أو EUS."
      - "Barium = bird's beak. Manometry = الأكثر sensitive. Endoscopy = تستبعد carcinoma."
