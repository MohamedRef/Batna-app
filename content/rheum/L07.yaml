  # ---------- p107: nomenclature ----------
  - id: rheum.L07.011
    kind: card
    topic: nomenclature
    front: How are the classical pathway proteins named, and which one breaks the numerical order?
    back: Nine proteins named "C" plus a number; they act in numerical order except C4, which acts before C2 and C3. Numbers reflect order of discovery, not order of activation.
    src: { page: 107, quote: "The numbered components act in a numerical order except C4, which acts before C2 &C3. The numbering of the components relates to the order in which they were discovered, not sequence of activation. Components of AP are designed by capital letters e.g. factor B Regulatory proteins are designed by descriptive title e.g. C4 binding protein, or in AP, by a letter e.g. factor H." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.012
    kind: card
    topic: nomenclature
    front: How are alternative pathway components and regulatory proteins named?
    back: AP components by capital letters (e.g. factor B); regulatory proteins by a descriptive title (e.g. C4 binding protein) or, in the AP, by a letter (e.g. factor H).
    src: { page: 107, quote: "The numbered components act in a numerical order except C4, which acts before C2 &C3. The numbering of the components relates to the order in which they were discovered, not sequence of activation. Components of AP are designed by capital letters e.g. factor B Regulatory proteins are designed by descriptive title e.g. C4 binding protein, or in AP, by a letter e.g. factor H." }
    status: unverified
  - id: rheum.L07.013
    kind: card
    topic: nomenclature
    front: Which fragment is "a" and which is "b"? What does each do?
    back: "The smaller fragment is \"a\": soluble and released into the surroundings. The larger \"b\" fragment is usually deposited on the activating surface and continues the cascade; it may be cut further to c, d, e."
    src: { page: 107, quote: "Fragments generated during complement activation are designed by small letters e.g. \"a\", \"b\". The smaller fragment is given \"a\" designation, and being soluble is released into the surrounding. The larger fragment \"b\", is usually deposited on the surface of the activating cells, and continues the cascade. Further fragmentation of the larger b fragment may occur to \"c, d, e\", for example." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.014
    kind: mcq
    topic: nomenclature
    stem: Which statement about complement nomenclature is correct?
    options:
      - "The numbers give the order of activation, without exception"
      - "Small \"a\" fragments are soluble; large \"b\" fragments usually stay on the surface"
      - "Alternative pathway components are named C followed by a number"
      - "C2 acts before C4 in the classical pathway"
    answer: 1
    why:
      - Numbers give order of discovery; C4 acts before C2 and C3.
      - "Correct: a = small, soluble, released; b = large, deposited, continues the cascade (p107)."
      - AP components get capital letters, e.g. factor B.
      - C4 acts before C2.
    src: { page: 107, quote: "Fragments generated during complement activation are designed by small letters e.g. \"a\", \"b\". The smaller fragment is given \"a\" designation, and being soluble is released into the surrounding. The larger fragment \"b\", is usually deposited on the surface of the activating cells, and continues the cascade. Further fragmentation of the larger b fragment may occur to \"c, d, e\", for example." }
    status: unverified
  # ---------- p108-110: classical ----------
  - id: rheum.L07.015
    kind: card
    topic: classical
    front: How is the classical pathway initiated, and why is it a link between innate and adaptive immunity?
    back: Mainly by C1q binding antigen–antibody complexes (adaptive), or by C1q binding the pathogen surface directly (innate).
    src: { page: 109, quote: "The classical pathway is initiated primarily by the binding of C1q to antibody: antigen complexes, during an adaptive immune response, Or by the binding of C1q, directly to the pathogen surface (innate immunity). Thus, a key link between the effect or mechanisms of innate and adaptive immunity exists." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.016
    kind: card
    topic: classical
    front: Describe the C1 complex.
    back: The first classical protein, C1, is C1q + C1r + C1s. C1q has six identical subunits with globular heads and collagen-like tails; the tails bind two molecules each of C1r and C1s.
    src: { page: 108, quote: "C1q is composed of six identical subunits with globular heads and long collagen-like tails." }
    status: unverified
  - id: rheum.L07.017
    kind: card
    topic: classical
    front: What happens when the C1q heads bind antibody or a pathogen?
    back: A conformational change in C1r, which then cleaves and activates the C1s zymogen (C1 esterase).
    src: { page: 108, quote: "Classical Pathway\n  The first protein in the classical pathway of complement activation is C1, which is a complex of C1q, C1r, and C1s.\n  C1q is composed of six identical subunits with globular heads and long collagen-like tails.\n  The tails combine to bind to two molecules each of C1r and C1s, forming the C1 complex.\n  The heads can bind to the constant regions of immunoglobulin molecules or directly to the pathogen surface causing a conformational change in C1r, which then cleaves and activates the C1s zymogen (C1estrase)." }
    status: unverified
  - id: rheum.L07.018
    kind: table
    topic: classical
    title: "Proteins of the classical pathway (p110)"
    columns: [Active form, Function]
    rows:
      - [C1q, "Binds pathogen surfaces directly or antibody bound to pathogens; allows autoactivation of C1r"]
      - [C1r, Cleaves C1s to active protease]
      - [C1s, Cleaves C4 and C2]
      - [C4b, "Covalently binds pathogen and opsonizes it; binds C2 for cleavage by C1s"]
      - [C4a, "Peptide mediator of inflammation (weak)"]
      - [C2b, "Active enzyme of classical C3/C5 convertase; cleaves C3 and C5"]
      - [C2a, Precursor of vasoactive C2 kinin]
      - [C3b, "Binds pathogen and opsonizes; starts alternative-pathway amplification; binds C5 for cleavage by C2b"]
      - [C3a, "Peptide mediator of inflammation (intermediate)"]
    blanks: [[1, 1], [2, 1], [3, 1], [5, 1], [6, 1], [7, 1]]
    src: { page: 110, quote: "Proteins of the classical pathway of complement activation\n| Native component | Active form | Function of the active form |\n|---|---|---|\n| C1 (C1q:C1r2:C1s2) | C1q | Binds directly to pathogen surfaces or indirectly to antibody bound to pathogens, thus allowing autoactivation of C1r |\n| C1 (C1q:C1r2:C1s2) | C1r | Cleaves C1s to active protease |\n| C1 (C1q:C1r2:C1s2) | C1s | Cleaves C4 and C2 |\n| C4 | C4b | Covalently binds to pathogen and opsonizes it. Binds C2 for cleavage by C1s |\n| C4 | C4a | Peptide mediator of inflammation (weak activity) |\n| C2 | C2b | Active enzyme of classical pathway C3/C5 convertase: cleaves C3 and C5 |\n| C2 | C2a | Precursor of vasoactive C2 kinin |\n| C3 | C3b | Many molecules of C3b bind to pathogen surface and act as opsonins. Initiates amplification via the alternative pathway. Binds C5 for cleavage by C2b |\n| C3 | C3a | Peptide mediator of inflammation (intermediate activity) |" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.019
    kind: order
    topic: classical
    prompt: Order the classical pathway from initiation to the C3 convertase.
    steps:
      - C1q binds antigen–antibody complexes
      - C1r is activated and cleaves C1s
      - C1s cleaves C4; C4b binds the surface
      - C2 binds C4b and is cleaved by C1s
      - C4b2b forms the C3 convertase
    src: { page: 110, quote: "Proteins of the classical pathway of complement activation\n| Native component | Active form | Function of the active form |\n|---|---|---|\n| C1 (C1q:C1r2:C1s2) | C1q | Binds directly to pathogen surfaces or indirectly to antibody bound to pathogens, thus allowing autoactivation of C1r |\n| | C1r | Cleaves C1s to active protease |\n| | C1s | Cleaves C4 and C2 |\n| C4 | C4b | Covalently binds to pathogen and opsonizes it. Binds C2 for cleavage by C1s |\n| | C4a | Peptide mediator of inflammation (weak activity) |\n| C2 | C2b | Active enzyme of classical pathway C3/C5 convertase: cleaves C3 and C5 |\n| | C2a | Precursor of vasoactive C2 kinin |\n| C3 | C3b | Many molecules of C3b bind to pathogen surface and act as opsonins. Initiates amplification via the alternative pathway. Binds C5 for cleavage by C2b |\n| | C3a | Peptide mediator of inflammation (intermediate activity) |\nFigure 2-23 Immunobiology, 6/e. (© Garland Science 2005)\nClassical Pathway (figure): Initiation: C1 (C1q, C1r, C1s) binds Ig on the pathogen; C4 is cleaved (C4a released, C4b binds); C2 is cleaved (C2b released); Formation of C3 convertase (C4b with C2a)." }
    status: unverified
  - id: rheum.L07.020
    kind: mcq
    topic: classical
    stem: Which activated C1 subcomponent cleaves C4 and C2?
    options: [C1q, C1r, C1s, C4b]
    answer: 2
    why:
      - C1q binds antibody or pathogen and triggers C1r.
      - C1r cleaves C1s.
      - "Correct: C1s (C1 esterase) cleaves C4 and C2 (p110)."
      - C4b binds C2 so that C1s can cleave it.
    src: { page: 110, quote: "Proteins of the classical pathway of complement activation\n| Native component | Active form | Function of the active form |\n|---|---|---|\n| C1 (C1q:C1r2:C1s2) | C1q | Binds directly to pathogen surfaces or indirectly to antibody bound to pathogens, thus allowing autoactivation of C1r |\n| | C1r | Cleaves C1s to active protease |\n| | C1s | Cleaves C4 and C2 |\n| C4 | C4b | Covalently binds to pathogen and opsonizes it. Binds C2 for cleavage by C1s |\n| | C4a | Peptide mediator of inflammation (weak activity) |\n| C2 | C2b | Active enzyme of classical pathway C3/C5 convertase: cleaves C3 and C5 |\n| | C2a | Precursor of vasoactive C2 kinin |\n| C3 | C3b | Many molecules of C3b bind to pathogen surface and act as opsonins. Initiates amplification via the alternative pathway. Binds C5 for cleavage by C2b |\n| | C3a | Peptide mediator of inflammation (intermediate activity) |\nFigure 2-23 Immunobiology, 6/e. (© Garland Science 2005)\nClassical Pathway (figure): Initiation: C1 (C1q, C1r, C1s) binds Ig on the pathogen; C4 is cleaved (C4a released, C4b binds); C2 is cleaved (C2b released); Formation of C3 convertase (C4b with C2a)." }
    status: unverified
  # ---------- p111-114: alternative ----------
  - id: rheum.L07.021
    kind: card
    topic: alternative
    front: Why is it called the "alternative" pathway, and what triggers it?
    back: It was the second discovered. It starts when C3b binds antigens on a pathogen surface such as lipopolysaccharides and endotoxins.
    src: { page: 111, quote: "It was the second to be discovered, hence the name. AP is triggered when breakdown products of C3;C3b, bind with certain antigens on the surface of a pathogen as lipopolysaccharides and endotoxins. It generates an innate immune response and it does not require an Ab for activation (Ab independent mech). C3b is prevented from binding stably to normal host cells by several regulatory proteins, that are present on host cells but absent from microbes." }
    status: unverified
  - id: rheum.L07.022
    kind: card
    topic: alternative
    front: Does the alternative pathway need antibody?
    back: No. It is antibody independent and generates an innate immune response.
    src: { page: 111, quote: "It was the second to be discovered, hence the name. AP is triggered when breakdown products of C3;C3b, bind with certain antigens on the surface of a pathogen as lipopolysaccharides and endotoxins. It generates an innate immune response and it does not require an Ab for activation (Ab independent mech). C3b is prevented from binding stably to normal host cells by several regulatory proteins, that are present on host cells but absent from microbes." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.023
    kind: card
    topic: alternative
    front: Why doesn't C3b bind stably to normal host cells?
    back: Several regulatory proteins present on host cells, and absent from microbes, prevent it.
    src: { page: 111, quote: "It was the second to be discovered, hence the name. AP is triggered when breakdown products of C3;C3b, bind with certain antigens on the surface of a pathogen as lipopolysaccharides and endotoxins. It generates an innate immune response and it does not require an Ab for activation (Ab independent mech). C3b is prevented from binding stably to normal host cells by several regulatory proteins, that are present on host cells but absent from microbes." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.024
    kind: card
    topic: alternative
    front: What happens without fluid-phase regulators such as factors H and I?
    back: The system fires to exhaustion, as in inherited deficiency of these regulators.
    src: { page: 111, quote: "Inhibitors such as factors H & I, keep the system in check. In absence of these regulators, the system fires to exhaustion, as in inherited deficiency of fluid phase regulators. AP serves as a feedback loop to amplify C3 deposition (regardless of which path deposited C3). Thus, if C3 is deposited on a target by CP or LP, the AP can enhance C3b deposition many folds." }
    status: unverified
  - id: rheum.L07.025
    kind: card
    topic: alternative
    front: Why is the alternative pathway called an amplification loop?
    back: "It amplifies C3 deposition whatever pathway deposited the first C3b: C3b laid down by the classical or lectin pathway is enhanced many-fold by the AP."
    src: { page: 111, quote: "Inhibitors such as factors H & I, keep the system in check. In absence of these regulators, the system fires to exhaustion, as in inherited deficiency of fluid phase regulators. AP serves as a feedback loop to amplify C3 deposition (regardless of which path deposited C3). Thus, if C3 is deposited on a target by CP or LP, the AP can enhance C3b deposition many folds." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.026
    kind: cloze
    topic: alternative
    text: "In the alternative pathway, factor {{c1::B}} (homologous to C2) binds C3b and is cleaved by factor {{c2::D}} into Ba and Bb; {{c3::C3bBb}} is the AP C3 convertase."
    src: { page: 112, quote: "In AP factor B is structurally & functionally homologous to C2. It binds to the deposited C3b,then is cleaved by active factor D, into Ba & Bb. C3bBb is the AP convertase. It is stabilized by properdin (P). C3bBbP (serine protease) then cleaves C3 to C3a and C3b. C3b then set up the feedback loop." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.027
    kind: card
    topic: alternative
    front: What stabilises the alternative C3 convertase?
    back: Properdin (factor P), forming C3bBbP, a serine protease that cleaves C3 into C3a and C3b.
    src: { page: 112, quote: "In AP factor B is structurally & functionally homologous to C2. It binds to the deposited C3b,then is cleaved by active factor D, into Ba & Bb. C3bBb is the AP convertase. It is stabilized by properdin (P). C3bBbP (serine protease) then cleaves C3 to C3a and C3b. C3b then set up the feedback loop." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.028
    kind: card
    topic: alternative
    front: Where does the first C3b of the alternative pathway come from (p113 figure)?
    back: Spontaneous hydrolysis of C3, with deposition of C3b on a cell surface.
    src: { page: 113, quote: "Alternative pathway\nInitiation:\n  C3 → Spontaneous hydrolysis → C3b (+ C3a)\n  C3b: Deposition on cell surface\n  Factor B binds C3b; Factor D cleaves B (releasing Ba)\nFormation of C3 convertase:\n  C3bBb; Properdin binds and stabilizes" }
    status: unverified
  - id: rheum.L07.029
    kind: enumerate
    topic: alternative
    prompt: Which complement-regulatory proteins on host cells bind C3b and stop the alternative pathway (p113–114)?
    points: [CR1, Factor H, MCP, DAF]
    pass: 3
    hook: "الحراس الأربعة على خلايانا «CR1، H، MCP، DAF» قول «Can Her Majesty Defend»: CR1، Factor H، MCP، DAF."
    src: { page: 113, quote: "Factor B binds noncovalently to C3b on a cell surface and is cleaved to Bb by factor D:\n  On host cells, the complement-regulatory proteins CR1, H, MCP, and DAF bind to C3b. CR1, H, and DAF displace Bb.\n  Pathogens lack complement-regulatory proteins. Binding of properdin (factor P) may stabilize the C3bBb complex" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.030
    kind: card
    topic: alternative
    front: How do host cells inactivate C3b, and what happens on a pathogen instead (p113–114)?
    back: On host cells, CR1, H and DAF displace Bb, and C3b bound to H, CR1 or MCP is cleaved by factor I to inactive iC3b, so there is no activation. Pathogens lack these regulators; properdin stabilises C3bBb, which deposits many C3b molecules, giving opsonization and terminal complement activation.
    src: { page: 114, quote: "| Host cell | Pathogen |\n|---|---|\n| C3b bound to H, CR1, and MCP is cleaved by factor I to yield inactive C3b (iC3b) | C3bBb complex is a C3 convertase and deposits many molecules of C3b on the pathogen surface |\n| No activation of complement on host cell surfaces | Opsonization, activation of terminal complement components |" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.031
    kind: mcq
    topic: alternative
    stem: Which factor cleaves C3b that is bound to factor H, CR1 or MCP into inactive iC3b?
    options: [Factor B, Factor D, Factor I, Properdin, C1s]
    answer: 2
    why:
      - Factor B binds C3b and becomes part of the convertase.
      - Factor D cleaves factor B into Ba and Bb.
      - "Correct: factor I yields inactive iC3b on host cells (p114)."
      - Properdin stabilises the convertase on pathogens.
      - C1s belongs to the classical pathway.
    src: { page: 114, quote: "| Host cell | Pathogen |\n|---|---|\n| C3b bound to H, CR1, and MCP is cleaved by factor I to yield inactive C3b (iC3b) | C3bBb complex is a C3 convertase and deposits many molecules of C3b on the pathogen surface |\n| No activation of complement on host cell surfaces | Opsonization, activation of terminal complement components |" }
    status: unverified
  - id: rheum.L07.032
    kind: mcq
    topic: alternative
    stem: >-
      A child has recurrent infections and very low C3. Testing shows inherited absence of factor H. Using the
      lecture, why is C3 low?
    options:
      - "The liver cannot make enough C3 in this deficiency"
      - "Unregulated, the alternative pathway fires to exhaustion and consumes C3"
      - "Antibodies are missing, so complement is never activated"
      - "Factor H is itself the C3 convertase, so none forms"
    answer: 1
    why:
      - Hepatocytes still make C3; the problem is consumption.
      - "Correct: in inherited deficiency of fluid-phase regulators (H, I) the system fires to exhaustion (p111)."
      - The AP needs no antibody, and the problem is uncontrolled activation.
      - The AP convertase is C3bBb; factor H restrains it.
    src: { page: 111, quote: "Inhibitors such as factors H & I, keep the system in check. In absence of these regulators, the system fires to exhaustion, as in inherited deficiency of fluid phase regulators. AP serves as a feedback loop to amplify C3 deposition (regardless of which path deposited C3). Thus, if C3 is deposited on a target by CP or LP, the AP can enhance C3b deposition many folds." }
    status: unverified
  - id: rheum.L07.033
    kind: mcq
    topic: alternative
    stem: Which protein of the alternative pathway is structurally and functionally homologous to C2?
    options: [Factor D, Factor B, Properdin, Factor H]
    answer: 1
    why:
      - Factor D is the protease that cleaves factor B.
      - "Correct: factor B is homologous to C2; like C2 it is cleaved after binding the b fragment (p112)."
      - Properdin stabilises the convertase.
      - Factor H is a regulator.
    src: { page: 112, quote: "In AP factor B is structurally & functionally homologous to C2. It binds to the deposited C3b,then is cleaved by active factor D, into Ba & Bb. C3bBb is the AP convertase. It is stabilized by properdin (P). C3bBbP (serine protease) then cleaves C3 to C3a and C3b. C3b then set up the feedback loop." }
    status: unverified
  # ---------- p114-115: lectin ----------
  - id: rheum.L07.034
    kind: card
    topic: lectin
    front: What are lectins, and what is MBL?
    back: Lectins are carbohydrate-binding proteins, important in innate immunity and rheumatic disease. MBL is a hepatocyte-made serum protein that preferentially binds repeating mannoses on pathogens.
    src: { page: 114, quote: "MBL is a hepatocyte synthesized serum protein that prfrentially binds to repeating mannoses of the pathogen." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.035
    kind: card
    topic: lectin
    front: Which classical pathway protein does MBL resemble, and what does its binding activate?
    back: C1q. Like C1q binding the Fc of Ig, MBL binding a sugar activates serine proteases called MASPs (mannan-associated serine proteases), MASP-1 and MASP-2.
    src: { page: 114, quote: "These are called MASPs (mannan associated serine proteases). These are MASP-1 & MASP-2." }
    status: unverified
  - id: rheum.L07.036
    kind: card
    topic: lectin
    front: What does MASP-2 do, and what convertase results?
    back: It cleaves C4 and C2 into a and b; the C4b2b complex formed is the same C3 convertase as the classical pathway's.
    src: { page: 114, quote: "Each member of MBL-MASP complex is structurally and functionally homologous to the corresponding element of CP. MASP-1-------MASP-2. MASP-2 cleaves C4 into a&b and cleaves also C2 into a&b. C4b2b complex formed is the same C3 convertase as that of CP." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.037
    kind: table
    topic: lectin
    title: "Lectin pathway elements and their classical twins"
    columns: [Lectin pathway, Classical pathway]
    rows:
      - [MBL, C1q]
      - [MASP-1, C1r]
      - [MASP-2, C1s]
      - [C4b2b made by MASP-2, The same C3 convertase]
    blanks: [[0, 1], [2, 1], [3, 1]]
    src: { page: 114, quote: "MBL resembles C1q of CP." }
    status: unverified
  # ---------- p115-116: C3, C5 ----------
  - id: rheum.L07.038
    kind: card
    topic: c3-c5
    front: What do C3 convertases produce, and what does each fragment do?
    back: C3a, the smaller fluid-phase fragment, is an anaphylatoxin; C3b, the larger one, continues the sequential activation of successive components.
    src: { page: 115, quote: "Cleavage of C3 is a critical step in all three pathways. C3 convertases split C3 into two fragments:\n  C3a smaller, fluid-phase, anaphylatoxin.\n  C3b larger, continues the sequential activation of successive components." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.039
    kind: enumerate
    topic: c3-c5
    prompt: What are the activities of activated C3?
    points:
      - C3a promotes inflammation
      - C3b fixation to surfaces leads to opsonization
      - C3b fixation leads to immune complex clearance
      - Generation of C5 convertase activity
    pass: 4
    hook: "الـ C3 «a بيولّع، وb بيلزق وبينضّف وبيكمّل»: C3a inflammation، C3b opsonization، C3b immune complex clearance، وC5 convertase."
    src: { page: 115, quote: "Activities of activated C3\n  C3a promotes inflammation.\n  C3b fixation to surfaces leads to opsonization.\n  C3b fixation leads to immune complex clearance.\n  Generation of the C5 Convertase activity." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L07.040
    kind: table
    topic: c3-c5
    title: "C3 and C5 convertases of each pathway (p116 figure)"
    columns: [Pathway, C3 convertase, C5 convertase]
    rows:
      - [Classical and lectin, C4b2b, C4b2b3b]
      - [Alternative, C3bBb, C3bBb3b]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 116, quote: "C3 and C5 Convertases of Each Pathway\n| Pathway | C3 convertase | C5 convertase |\n|---|---|---|\n| Classical and lectin pathways | C4b with C2a (figure labels) | C4b, C2a with C3b |\n| Alternative pathway | C3b with Bb | C3b, Bb with a second C3b |\nFigure: C3 is cleaved to C3a (released) and C3b; C5 is cleaved to C5a (released) and C5b, which binds the surface." }
    status: unverified
