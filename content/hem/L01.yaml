        options: [Dysfunctional marrow (myelofibrosis), Marrow unable to meet demand (haemolysis), Loss of erythropoietin, Loss of stromal CAMs]
        answer: 0
        why: "Myelofibrosis is the book's example of a dysfunctional marrow (p7); severe haemolysis is the other mechanism."
