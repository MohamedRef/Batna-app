      - kind: explain
        page: 34
        title: "الـ NPDR"
        quote: "Mild non proliferative diabetic retinopathy (Mild NPDR):\n  These changes begin 3 to 5 years after diagnosis in type 1 diabetics.\n  First signs are microaneurysms with subsequent retinal haemorrhages and hard exudates.\n  Infarctions of nerve fiber layer, known as soft exudates.\n  Visual acuity is generally unaffected."
        text: |
          **Mild:** بيبدأ **3–5 سنين** بعد التشخيص في type 1. أول علامة ==microaneurysms==، بعدها hemorrhages و **hard exudates**، و **soft exudates** (= infarcts في الـ nerve fiber layer). النظر **سليم**.

          **Moderate:** **venous beading** وتغير في عرض الأوردة، و capillary dilatation و permeability أكتر.

          **Severe:** **progressive ischemia** و hemorrhages و exudates و microaneurysms منتشرة.

          التفسير المقبول (مش في الكتاب) للترتيب ده: السكر بيضعّف حيطة الـ capillary فتنفخ (**microaneurysm**)، والضعيف بيسرّب دم (hemorrhage) و lipid (hard exudate)، ولما الـ capillaries تتقفل الشبكية تجوع (soft exudate، ischemia). عشان كده النظر سليم في الأول: الضرر لسه في الأطراف مش في الـ macula.
      - kind: reveal
        page: 34
        quote: "Mild non proliferative diabetic retinopathy (Mild NPDR):\n  These changes begin 3 to 5 years after diagnosis in type 1 diabetics.\n  First signs are microaneurysms with subsequent retinal haemorrhages and hard exudates.\n  Infarctions of nerve fiber layer, known as soft exudates.\n  Visual acuity is generally unaffected."
        prompt: "الـ hard exudate والـ soft exudate: إيه الفرق؟"
        answer: |
          - **Hard exudates:** **lipid** وبروتين اترشح من capillaries بتسرّب. صفرا وحدودها حادة.
          - **Soft exudates (cotton wool):** ==infarcts== في الـ **nerve fiber layer**، يعني **ischemia**. بيضا وحدودها مش واضحة.

          الـ soft هو اللي بيقولك إن الشبكية بدأت تجوع أكسجين، ودي الخطوة اللي قبل الأوعية الجديدة. (الوصف من الفسيولوجي؛ التعريف من الكتاب.)
      - kind: explain
        page: 34
        title: "الـ PDR"
        quote: "Occasionally, new vessels can invade the iris and the anterior chamber, leading to sight threatening closed-angle glaucoma."
        text: |
          الشبكية الجعانة بتطلب أوعية جديدة (**vascular endothelial growth factor**)، بس الأوعية دي ضعيفة:
          - **Early proliferative diabetic retinopathy (PDR):** neovascularization في الـ **retina**.
          - "==High-risk PDR==: neovascularization في الـ **vitreous** ← **retinal detachment**، **hemorrhage**، **blindness**."
          - أحيانًا تدخل الـ **iris** والـ anterior chamber ← **closed-angle glaucoma**.

          ليه الأوعية الجديدة خطر مع إنها «تعويض»؟ التفسير المقبول (مش في الكتاب): لأنها هشة، بتنزف في الـ vitreous، ومعاها نسيج ليفي بيشد الشبكية فيعمل **detachment**. ولما تدخل الـ iris بتقفل الزاوية اللي الـ aqueous بيخرج منها، فالضغط يعلى (glaucoma).
