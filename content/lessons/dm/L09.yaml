          - high efficacy، no/low hypoglycemia
          - ==Weight loss== ~**3–4 kg** (كالوريز في البول)
          - systolic BP ↓ ~**5–6 mmHg** (natriuresis)
          - **Compelling**: HF و CVD events في T2DM، HF في non-diabetics، CKD progression في الاتنين.
      - kind: reveal
        page: 122
        quote: "Genital and urinary tract infections. 9. Increased frequency and/or volume of urination."
        prompt: "استنتج الـ side effects من الـ mechanism: سكر كتير في البول + صوديوم ومية بتطلع."
        answer: |
          - سكر في البول = أكل للبكتيريا والـ candida ← ==Genital and urinary tract infections==.
          - glucose بيشد مية ← **urination** أكتر.
          - مية وصوديوم بيطلعوا ← **volume depletion، hypotension، dizziness**.
          - insulin أقل و ketones ← **euglycemic DKA** (extremely rare).
      - kind: explain
