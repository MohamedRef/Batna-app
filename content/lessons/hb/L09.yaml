        alt: "The right pleural space sits above the diaphragm and the peritoneal cavity full of ascites sits below. A small defect in the right side of the diaphragm lets fluid pass upward (pulled by negative chest pressure, an accepted explanation outside the book), and it collects at the base of the right pleural space. Below, three boxes: same fluid as the ascites, transudate with serum-pleural albumin gradient 1.1 or more; infected it is spontaneous bacterial empyema, treated like SBP; treatment goes salt and diuretics, then TIPS, then liver transplant, which is best, with taps and pleurodesis last."
        caption: "خرم صغير في الـ diaphragm، والتفسير المقبول إن الصدر بيشفط مع كل نفس. علشان كده السائل نسخة من الـ ascites بالظبط."
        svg: |
