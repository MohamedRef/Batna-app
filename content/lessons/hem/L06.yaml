lessons:
  # ------------------------------------------------------------------
  - id: hem.L06.lesson1
    title: "ABO: مين يدّي مين؟"
    hook: "كيس دم واحد غلط ممكن يموّت. الفكرة كلها: الـ antibodies اللي في مين، ضد الـ antigens اللي على مين."
    minutes: 8
    pages: [84, 86]
    topics: [antigens, antibodies]
    goals:
      - "تعرف الـ antigens على الكرة الحمرا ومعمولة من إيه"
      - "تفرّق allo عن auto، و naturally occurring عن immune antibodies"
      - "تفرّق IgM عن IgG وتعرف ليه ده بيفرق في المعمل"
    status: unverified
    steps:
      - kind: explain
        remind: [hem.L06.001]
        page: 84
        title: "الـ antigens على كرة الدم"
        quote: "RBC antigens have varying biochemical, phenotypic, and immunological characteristics. Based on this, there are several clinically important blood group system: ABO, Rh, Kell, Kidd, and Duffy."
        text: |
          الـ systems المهمة إكلينيكيًا: ==ABO== و **Rh** و **Kell** و **Kidd** و **Duffy**.

          الـ membrane حوالي **40% lipids** و **10% carbohydrates** والباقي protein. الـ antigen ممكن يبقى protein أو glycoprotein أو glycolipid:
          - في **Rh** و **Kell** الفرق في الـ **amino acid sequence**.
          - في **ABO** الفرق في الـ **oligosaccharide (sugar) sequence**.

          ليه ده يهمك؟ لأن الـ ABO antigen **سكر** متركّب على البروتين أو الدهون، والسكريات دي شبه سكريات كتير على البكتيريا والأكل. وده (التفسير المقبول، مش في الكتاب) اللي هيشرح بعد شوية ليه الـ anti-A والـ anti-B بيطلعوا لوحدهم من غير نقل دم.
      - kind: figure
        page: 85
        title: "صورة الكتاب: الـ antigens قاعدة فين في الـ membrane"
        image: { file: hem/L06-antigen-proteins.webp, book: true }
        alt: "Book diagram of the red cell membrane with blood group proteins: single-pass type 1 and 2 (glycophorins, Kell, Lutheran), multi-pass type 3 (Rh, Kidd, Diego, Duffy) and GPI-anchored type 5 (Yt, Dombrock, Cromer), with sugar chains drawn as red branches."
        caption: "البروتينات اللي بتشيل الـ antigens: بعضها بيعدّي الـ membrane مرة (**Kell**، glycophorins)، وبعضها كذا مرة (==Rh==، Kidd، Duffy)، وبعضها متعلّق بـ GPI anchor. الفروع الحمرا هي السكريات."
      - kind: explain
        page: 84
        title: "Allo ولا auto؟"
        quote: "Development of most other allo-Abs requires prior sensitization."
        text: |
          الكتاب بيسأل السؤال ده ومش بيجاوبه، والإجابة المقبولة (مش في الكتاب):

          - **Alloantibody**: ضد antigen موجود عند **شخص تاني** ومش موجود عندك، زي anti-Kell عند واحدة اتنقلها دم Kell positive.
          - **Autoantibody**: ضد antigens **كراتك انت**، زي اللي في الـ autoimmune haemolytic anaemia.

          والكتاب بيقول إن أغلب الـ ==allo-Abs== محتاجة **prior sensitization**: يعني لازم الجسم يشوف الـ antigen الغريب قبل كده (حمل أو نقل) عشان يعمل الـ antibody. الاستثناء الكبير anti-A و anti-B.
      - kind: explain
        page: 85
        title: "Naturally occurring ولا immune؟"
        quote: "Antibodies are naturally occurring when they are produced without any obvious immunizing stimulus, such as pregnancy or transfusion."
        text: |
          - ==Naturally occurring==: بتطلع من غير pregnancy ولا transfusion، زي **anti-A** و **anti-B**. مش موجودة وقت الولادة، وبتظهر حوالي **3–6 months**، غالبًا ردًا على antigens بكتيريا وفيروسات بنتنفسها أو بناكلها.
          - **Immune (allo-) antibodies**: بس بعد **pregnancy** أو **transfusion**. ده حال أغلب الـ systems غير ABO.

          ليه اسمها "naturally occurring" مع إن الكتاب نفسه بيقول إنها غالبًا ردّ على بكتيريا وأكل؟ لأن مفيش **كرات حمرا** هي اللي حرّضتها، فالاسم اتساب كده: ==non-red-cell-induced==. وعشان كده مش موجودة وقت الولادة: الطفل لسه ما قابلش البكتيريا دي.
      - kind: check
        page: 85
        quote: "These antibodies are not present at birth and, inthe case of anti-A,B, anti-A and anti-B, start to appear in the serum at about 3–6 months of age."
        question: "When do anti-A and anti-B start to appear in the serum?"
        options: ["At about 3–6 months of age", "At birth, from the mother", "Only after the first transfusion", "At puberty"]
        answer: 0
        why:
          - "صح: مش موجودين وقت الولادة، وبيظهروا حوالي 3–6 شهور."
          - "الكتاب بيقول not present at birth."
          - "دي naturally occurring، مش محتاجة نقل."
          - "بيظهروا بدري جدًا، مش في البلوغ."
      - kind: reveal
        page: 86
        quote: "Most adults have antibodies to the A or B antigens, or to both; that is, they have 'naturally occurring' antibodies to those ABO antigens they lack."
        prompt: "ليه أي شخص group A عنده anti-B من غير ما يكون اتنقله دم قبل كده؟"
        answer: |
          لأن الـ ABO antibodies ==naturally occurring==: الجسم بيقابل sugars شبه B على البكتيريا والأكل من وهو صغير، وطالما B مش موجود على كراته، بيعمل **antibody ضد الـ antigen اللي ناقصه**.

          ده سبب إن أول transfusion غلط في الـ ABO ممكن يعمل AHTR فورًا.
      - kind: table
        page: 86
        quote: "As a general rule, IgM antibodies will directly agglutinate antigen-positive red cells in a saline medium, whereas most IgG antibodies require potentiators or anti-human globulin to effect agglutination"
        title: "IgM مقابل IgG"
        columns: [Feature, IgM, IgG]
        rows:
          - ["Saline agglutination", "Yes, directly", "Usually not"]
          - ["Needs to show it", "Nothing", "AHG (Coombs)"]
        hide: [[0, 1], [1, 2]]
      - kind: aside
        tone: analogy
        page: 86
        quote: "IgM antibodies agglutinate red cells suspended in saline. They are often called saline or directly agglutinating antibodies."
        text: |
          الـ **Immunoglobulin M (IgM)** خماسي (pentamer)، دراعاته كتير وطويلة فبيمسك كذا كرة مع بعض لوحده، زي شبكة صيد. الـ **Immunoglobulin G (IgG)** صغير (dimer)، بيلزق على الكرة بس ما يقدرش يلم كرتين، فمحتاج **anti-human globulin** يعمل الكوبري.

          (تفسير الشكل من الـ immunology، والمعلومة من الكتاب.)

          يعني في المعمل: الـ ==IgM== (زي anti-A و anti-B) بيبان على طول في الـ saline، أما الـ **IgG** (أغلب الـ alloantibodies) محتاج **Coombs** عشان يبان. ولو نسيت الخطوة دي هتعدّي كيس فيه مشكلة.
      - kind: check
        page: 86
        quote: "Conversely, IgG antibodies do not usually agglutinate saline suspended red cells."
        question: "Which antibody usually needs anti-human globulin to show agglutination?"
        options: ["IgG", "IgM", "Anti-A of a group B person", "Anti-B of a group A person"]
        answer: 0
        why:
          - "صح: الـ IgG صغير ومش بيلمّ كرتين في الـ saline، فمحتاج AHG."
          - "الـ IgM بيعمل agglutination مباشرة (saline agglutinin)."
          - "الـ anti-A الطبيعي IgM، بيبان في الـ saline."
          - "نفس الكلام: anti-B الطبيعي IgM."
      - kind: try
        items: [hem.L06.001, hem.L06.007, hem.L06.010, hem.L06.013, hem.L06.014]
    recap:
      - "Systems مهمة: ABO، Rh، Kell، Kidd، Duffy. ABO = sugar، Rh و Kell = amino acids."
      - "Allo = ضد antigen عند غيرك؛ auto = ضد كراتك. أغلب الـ allo-Abs محتاجة sensitization قبلها."
      - "Anti-A و anti-B naturally occurring (بكتيريا وأكل، مش كرات حمرا)، بتظهر 3–6 months. الباقي immune بعد transfusion أو pregnancy."
      - "IgM بيعمل agglutination في saline. IgG محتاج AHG (Coombs)."
    practice: [hem.L06.001, hem.L06.002, hem.L06.003, hem.L06.004, hem.L06.005, hem.L06.006, hem.L06.007, hem.L06.008, hem.L06.009, hem.L06.010, hem.L06.011, hem.L06.012, hem.L06.013, hem.L06.014]
