      - kind: figure
        page: 216
        quote: "Stage I: Florid bile duct lesion. The epithelial cell lining of a small duct is infiltrated with lymphocytes."
        title: "Stage I: الـ florid duct lesion"
        image: { file: hb/L13-pbc-florid-duct.webp, book: true }
        marks:
          - { at: [0.48, 0.49], label: "Bile duct under lymphocyte attack" }
        alt: "Liver histology of a small bile duct in the centre, its curved epithelial lining crowded and invaded by many dark lymphocytes."
        caption: "القناة الصغيرة (1) بطانتها مليانة lymphocytes بتهاجمها. ده ==florid duct lesion==، أول stage في الـ PBC."
      - kind: reveal
        page: 216
        quote: "There may be reduced numbers of normal bile duct within portal triads and\n increased numbers of atypical, poorly formed bile ducts with irregularly\n shaped lumina."
        prompt: "في stage II القنوات الطبيعية بتقل، بس بتظهر قنوات «غريبة» كتير. ليه؟"
        answer: |
          الكتاب: **reduced numbers of normal bile duct**، و **increased numbers of atypical, poorly formed bile ducts** (الـ ductular proliferation).

          التفسير المقبول (مش في الكتاب): الكبد بيحاول يعوّض القنوات اللي اتدمرت، فبيطلّع قنوات جديدة بسرعة، بس شكلها مش مظبوط وما بتصرّفش كويس. ومع الالتهاب اللي بيكمّل، الـ fibrosis بتزيد لحد ما تعمل bridges في stage III.
      - kind: figure
        page: 217
        quote: "Stage II: A typical bile duct hyperplasia is seen. There are tortuous bile ducts with inflammatory cell infiltrate consisting of primarily lymphocytes and few neutrophils."
        title: "Stage II في الكتاب: قنوات ملتوية وسط الالتهاب"
        image: { file: hb/L13-pbc-stage2.webp, book: true }
        marks:
          - { at: [0.10, 0.47], label: "Hepatocytes" }
          - { at: [0.88, 0.80], label: "Hepatocytes" }
          - { at: [0.52, 0.45], size: [0.40, 0.75], label: "Tortuous ducts and infiltrate", kind: box }
        alt: "High-power liver histology in red-brown stain, no arrows. Hepatocytes with round dark nuclei at the left and lower right edges; the centre and upper right are filled with small irregular, tortuous duct profiles surrounded by many small dark elongated inflammatory cell nuclei."
        caption: |
          صورة الكتاب لـ stage II، ومن غير أسهم:

          - (1) و (2): **hepatocytes** عادية (خلايا كبيرة وردي ونواتها مدورة غامقة).
          - (3): قنوات صغيرة كتير **ملتوية وشكلها مش منتظم** (tortuous bile ducts، اللي الكتاب سماها bile duct hyperplasia)، وحواليها نوى غامقة صغيرة متطاولة: ده الـ infiltrate، أغلبه **lymphocytes** وشوية **neutrophils**.

          الفرق عن stage I: هناك قناة واحدة واضحة والـ lymphocytes بتهاجمها. هنا القنوات الطبيعية قلّت وطلع مكانها ==ductular proliferation== مشوّه، وده اللي الـ reveal اللي فوق بيشرحه.
      - kind: order
        page: 217
        quote: "Stage III Similar to stage II except that fibrous septa extend beyond triads and form portal-to-portal bridges."
        prompt: "رتّب الـ PBC histology من stage I لـ stage IV:"
        steps:
          - "Florid bile duct lesion: lymphocytes infiltrate a small duct"
          - "Fewer normal ducts, atypical ducts, diffuse portal fibrosis"
          - "Fibrous septa form portal-to-portal bridges"
          - "Frank cirrhosis with regenerative nodules"
        why: "I = florid duct lesion. II = الـ lesion انتشرت، ducts مشوّهة، portal fibrosis. III = زي II بس الـ septa بتعمل **portal-to-portal bridges**. IV = cirrhosis، والـ **paucity of bile ducts** في الـ scars بتلمّح للـ primary biliary cholangitis (PBC)."
      - kind: check
        page: 217
        quote: "Stage III\n Similar to stage II except that fibrous septa extend beyond triads and form\n portal-to-portal bridges."
        question: "In PBC histology, portal-to-portal fibrous bridges first define which stage?"
        options:
          - "Stage III"
          - "Stage I"
          - "Stage II"
          - "Stage IV"
        answer: 0
        why:
          - "صح: stage III = زي II بس الـ **fibrous septa** بتعدّي الـ triads وتعمل **portal-to-portal bridges**."
          - "Stage I = الـ **florid duct lesion**: lymphocytes حوالين وجوه القناة."
          - "Stage II = الإصابة أوسع، ducts أقل وducts غريبة، و **diffuse portal fibrosis** جوه الـ triads لسه."
          - "Stage IV = **frank cirrhosis** و regenerative nodules."
      - kind: figure
        page: 217
        quote: "Stage III : Portal-to-portal fibrous septum is shown (masson trichrome)."
        title: "Stage III في الكتاب: الـ portal-to-portal septum"
        image: { file: hb/L13-pbc-stage3.webp, book: true }
        marks:
          - { at: [0.23, 0.50], label: "Portal tract in a fibrous septum" }
          - { at: [0.63, 0.80], label: "Portal-to-portal bridge", kind: arrow }
          - { at: [0.55, 0.45], label: "Parenchyma, no nodules" }
        alt: "Low-power liver biopsy core in Masson trichrome. Red-brown liver tissue; on the left a dark blue-purple band of fibrous tissue holding a few small white portal spaces runs down and across, and thin pale bands run along the lower edge, dividing the tissue."
        caption: |
          ده تكبير صغير لعينة biopsy بصبغة ==Masson trichrome==: الـ hepatocytes بتطلع أحمر/بني، والـ **collagen** والالتهاب حواليه بيطلعوا غامق مزرق.

          - **(1)**: شريط غامق مزرق فيه فتحات بيضا صغيرة. الفتحات دي الـ portal tract (أوعية وقنوات)، والشريط هو الـ **fibrous septum** طالع من الـ triad.
          - الشريط بيمد ويقسم النسيج، وفيه شرايط أرفع (2): ده الـ ==portal-to-portal bridge== اللي الـ caption بيتكلم عنه.
          - **(3)**: parenchyma حمرا لسه من غير nodules.

          يعني ده بالظبط الفرق عن stage II: الـ fibrosis خرجت بره الـ triad ووصّلت portal tract بالتاني، بس لسه مفيش cirrhosis.
      - kind: aside
        tone: exam
        page: 217
        quote: "Stage III : Portal-to-portal fibrous septum is shown (masson trichrome)."
        text: |
          الـ stages في سطر لكل واحدة، زي ما بتتسأل:

          - **I**: ==florid duct lesion==: lymphocytes جوه بطانة القناة الصغيرة وحواليها.
          - **II**: الإصابة أوسع، القنوات الطبيعية أقل، وقنوات **atypical** ملتوية (ductular)، و **diffuse portal fibrosis** جوه الـ triads.
          - **III**: زي II، بس الـ **fibrous septa** بتعدّي وتعمل **portal-to-portal bridges**.
          - **IV**: **frank cirrhosis** و regenerative nodules. شبه أي cirrhosis، بس **paucity of normal bile ducts** في الندبة بتلمّح للـ PBC، وممكن تلاقي **noncaseating granuloma**.

          يعني السؤال كله في كلمتين: الالتهاب فين، والـ fibrosis وصلت لحد فين.
      - kind: try
        items: [hb.L13.070, hb.L13.071, hb.L13.073, hb.L13.075, hb.L13.077]
    recap:
      - "PBC: 90–95% ستات، 30–70 سنة، AMA 95%، IgM مرتفع (**MAMI**)."
      - "Process 1: T cells تدمر الـ small ducts. Process 2: الصفرا المحبوسة تأذي الـ hepatocytes."
      - "Stages: florid duct lesion → atypical ducts + portal fibrosis → portal-portal bridges → cirrhosis بـ duct paucity."
      - "Fatigue الأشيع، pruritus أول عرض specific، jaundice متأخر، الـ tan = melanin."
      - "UDCA مدى الحياة (مش بيعالج الـ fatigue)؛ OCA (itch) أو elafibranor مع UDCA أو لوحدهم."
      - "UDCA قبل الـ colestyramine بساعة أو بعدها بـ 4–6 ساعات. Transplant بيشفي الهرش، والـ PBC ممكن يرجع."
