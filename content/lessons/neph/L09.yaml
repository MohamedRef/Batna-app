            <text x="72" y="186" text-anchor="middle" class="t-sm">short vein</text>
            <text x="262" y="164" text-anchor="middle" class="t-sm t-b">Left kidney</text>
            <text x="262" y="180" text-anchor="middle" class="t-sm">long vein: easier</text>
