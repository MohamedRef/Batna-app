  # ---------- p62: referral ----------
  - id: neph.L02.132
    kind: enumerate
    topic: referral
    prompt: List the indications for nephrology referral in CKD (Figure 44).
    points:
      - Uncertain cause of CKD, hereditary kidney disease, recurrent extensive nephrolithiasis
      - GFR < 30
      - "Sustained GFR fall > 20% (or > 30% after hemodynamically active therapy)"
      - 5-year KRT risk ≥ 3–5% (validated equation)
      - "ACR ≥ 300 mg/g (PCR ≥ 500) with hematuria"
      - ≥ 2-fold rise in albuminuria in significant albuminuria
      - ACR > 700 mg/g consistently
      - "Urinary RBC casts or RBC > 20/HPF, unexplained"
      - CKD with hypertension refractory to ≥ 4 antihypertensives
      - Persistent abnormal serum potassium
    pass: 7
    hook: "حوّل للـ nephrology في 10: «سبب غامض، 3 أرقام GFR، 3 أرقام albumin، دم، ضغط، وبوتاسيوم» = cause مش معروف أو hereditary أو حصوات متكررة كتير؛ GFR أقل من 30، نزول مستمر أكتر من 20% (أو أكتر من 30% بعد hemodynamically active therapy)، 5-year KRT risk ≥ 3–5%؛ ACR ≥ 300 mg/g (PCR ≥ 500) مع hematuria، albuminuria تزيد ≥ 2-fold، ACR فوق 700 mg/g على طول؛ RBC casts أو RBC فوق 20/HPF من غير تفسير؛ HT refractory على ≥ 4 أدوية؛ وK بايظ مستمر."
    src: { page: 62, quote: "Figure 44: Circumstance for referral to specialist kidney care services and goals of the referral.\n| Diagnosis CKD | Goal | Circumstance |\n| Causes | Further evaluation and special management based on diagnosis | Cause of CKD is uncertain; Hereditary kidney disease; Recurrent extensive nephrolithiasis |\n| eGFR/risk of KRT | Planning and preparation for kidney replacement therapy | eGFR <30 ml/min per 1.73 m2; A sustained fall in GFR of >20% or >30% in those people initiating hemodynamically active therapies; A >3–5% 5-year risk of requiring KRT measured using a validated risk equation |\n| Albuminuria and microscopic hematuria | Further evaluation and management | Consistent finding of significant albuminuria (ACR ≥300 mg/g [≥30 mg/mmol] or AER ≥300 mg/24 hours, approximately equivalent to PCR ≥500 mg/g [≥50 mg/mmol] or PER ≥500 mg/24 hours) in combination with hematuria; ≥2-fold increase in albuminuria in people with significant albuminuria undergoing monitoring; A consistent finding of ACR >700 mg/g [>70 mg/mmol]; Urinary red cell casts, RBC >20 per high power field sustained and not readily explained |\n| Others | Provision management of CKD complications | CKD and hypertension refractory to treatment ≥4 antihypertensive agents; Persistent abnormalities of serum potassium |" }
    status: unverified
    tags: [high-yield]
  - id: neph.L02.133
    kind: mcq
    topic: referral
    stem: Which finding alone is an indication for nephrology referral?
    options:
    - BP controlled on 2 drugs
    - A consistent ACR of 800 mg/g
    - A single eGFR fall of 10%
    - eGFR 52 stable for 2 years
    - ACR 45 mg/g in a diabetic
    answer: 1
    why:
    - Referral is for hypertension refractory to ≥ 4 agents.
    - A consistent ACR > 700 mg/g is a referral criterion.
    - A sustained fall > 20% is needed.
    - Stable G3a without other features is managed in primary care.
    - A2 alone is not a referral criterion.
    src:
      page: 62
      quote: "Figure 44: Circumstance for referral to specialist kidney care services and goals of the referral.\n| Diagnosis CKD | Goal | Circumstance |\n| Causes | Further evaluation and special management based on diagnosis | Cause of CKD is uncertain; Hereditary kidney disease; Recurrent extensive nephrolithiasis |\n| eGFR/risk of KRT | Planning and preparation for kidney replacement therapy | eGFR <30 ml/min per 1.73 m2; A sustained fall in GFR of >20% or >30% in those people initiating hemodynamically active therapies; A >3–5% 5-year risk of requiring KRT measured using a validated risk equation |\n| Albuminuria and microscopic hematuria | Further evaluation and management | Consistent finding of significant albuminuria (ACR ≥300 mg/g [≥30 mg/mmol] or AER ≥300 mg/24 hours, approximately equivalent to PCR ≥500 mg/g [≥50 mg/mmol] or PER ≥500 mg/24 hours) in combination with hematuria; ≥2-fold increase in albuminuria in people with significant albuminuria undergoing monitoring; A consistent finding of ACR >700 mg/g [>70 mg/mmol]; Urinary red cell casts, RBC >20 per high power field sustained and not readily explained |\n| Others | Provision management of CKD complications | CKD and hypertension refractory to treatment ≥4 antihypertensive agents; Persistent abnormalities of serum potassium |"
    status: unverified
