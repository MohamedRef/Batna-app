  - id: neph.L02.lesson14
    title: "الأنيميا والعظم"
    hook: "ليه الهيموجلوبين \"الطبيعي\" مش هدف، وليه الـ PTH الواطي وحش زي العالي."
    minutes: 10
    pages: [64, 67]
    topics: [anemia, mbd]
    goals:
      - "تشخّص وتعالج أنيميا الـ CKD وتعرف ليه الهدف أقل من الطبيعي"
      - "تفهم الـ CKD-MBD من high لـ low turnover"
      - "تعرف خطوات الـ MBD قبل الغسيل"
    status: unverified
    steps:
      - kind: table
        page: 64
        quote: "Treatment of complications Anemia of CKD Screen annually if GFR 30-60, twice annually if GFR < 30 ml/min/1.73m2 Diagnose if Hb < 13 g/dl in males, < 12 g/dl in females Erythropoiesis stimulating agents (ESAs)"
        title: "أنيميا الـ CKD بالأرقام"
        columns: [Point, Number]
        rows:
          - ["Screen if GFR 30–60", "Once a year"]
          - ["Screen if GFR < 30", "Twice a year"]
          - ["Diagnose: men", "Hb < 13 g/dL"]
          - ["Diagnose: women", "Hb < 12 g/dL"]
          - ["Maintain on treatment", "< 11.5 or < 12; 10–11 if high risk"]
        hide: [[1, 1], [2, 1], [4, 1]]
      - kind: explain
        page: 64
        quote: "Maintain Hemoglobin <11.5 or < 12 g/dL, 10-11 g/dL if high risk"
        title: "ليه الأنيميا، وليه الهدف مش الطبيعي؟"
        text: |
          التفسير المقبول (مش في الكتاب) لأنيميا الـ CKD:

          - الـ **erythropoietin** بيتعمل في خلايا حوالين الـ tubules. لما الـ cortex يتليف، المصنع يقفل.
          - الالتهاب المزمن بيحبس الحديد جوه المخازن، فحتى لو فيه حديد، النخاع مش بيوصله. علشان كده الكتاب بيبدأ بالـ **ferritin والـ TSAT** قبل الـ ESA.
          - الـ uremia بتقصّر عمر الـ RBC.

          وليه الكتاب بيقول خلّي الـ Hb ==< 11.5 أو < 12== (و 10–11 في الـ high risk)؟ التفسير المقبول: لما بنعلّي الـ Hb للطبيعي بجرعات ESA عالية، الجلطات والـ stroke والضغط بيزيدوا. يعني الهدف إن المريض **يحس أحسن ويستغنى عن نقل الدم**، مش رقم جميل.
      - kind: aside
        page: 64
        quote: "Maintain Hemoglobin <11.5 or < 12 g/dL, 10-11 g/dL if high risk"
        tone: trap
        text: "الهدف **مش** تطلّع الـ Hb للطبيعي. مع الـ Erythropoiesis-stimulating agent (ESA) خليه **تحت 11.5–12**، والـ high risk **10–11**. الـ Hb العالي بالـ ESA مش أحسن للمريض."
      - kind: explain
        page: 64
        quote: "Treatment of complications Anemia of CKD Screen annually if GFR 30-60, twice annually if GFR < 30 ml/min/1.73m2 Diagnose if Hb < 13 g/dl in males, < 12 g/dl in females Erythropoiesis stimulating agents (ESAs) HIF stabilizers"
        title: "قبل الـ ESA"
        text: |
          استبعد الأول: **inflammation** (CRP، IL-6)، **blood loss** (منظار)، **haemolysis**، مرض **دم**، **folate/B12**، الـ parathyroid hormone (PTH).

          وشوف الـ **iron**: ferritin، transferrin saturation (TSAT)، % hypochromic red blood cells (RBCs)، reticulocyte Hb، وعوّض.

          بعدين ==ESA== أو ==hypoxia-inducible factor (HIF) stabilizer== (oral):

          - **Epoetin**: 2000–3000 U، من 2 لـ 3 مرات في الأسبوع
          - **Darbepoetin**: 30 µg كل أسبوع، أو 60 µg كل أسبوعين
          - **Pegylated epoetin beta**: 60 µg كل أسبوعين أو 120 µg كل 4 أسابيع

          التفسير المقبول (مش في الكتاب): بنستبعد الأسباب دي الأول **لأن** الـ ESA مش هيشتغل كويس لو فيه نقص حديد أو التهاب أو نزيف، والحديد هو الخامة اللي الـ EPO بيحتاجها.
      - kind: figure
        page: 64
        title: "أنيميا الـ CKD خطوة بخطوة: رسمة الكتاب"
        image: { file: neph/L02-anemia-workup.webp, book: true }
        alt: "Book flowchart of three numbered steps. 1, exclude other causes of anaemia: inflammation (CRP/IL-6), blood loss (endoscopy/colonoscopy), haemolysis (Coombs test, bilirubin, LDH, haptoglobin), haematological disorder (bone marrow), other (B12/folate levels, PTH, Hb electrophoresis). 2, iron deficiency?: ferritin, TSAT, %HRC (percentage of hypochromic red cells), CHr (reticulocyte haemoglobin content), leading to iron supplementation. 3, ESA therapy: epoetin IV or SC 2000-3000 units 2-3 times a week; darbepoetin alfa IV or SC 30 micrograms once a week or 60 every 2 weeks; pegylated epoetin beta IV or SC 60 micrograms every 2 weeks or 120 every 4 weeks; HIF-PHIs oral, variable dose."
        caption: |
          3 خطوات بالترتيب (الأرقام في الدواير شمال):

          1. **Exclude other causes of anaemia** (وردي): **Inflammation** (CRP/IL-6)، **Blood loss** (منظار)، **Haemolysis** (Coombs، LDH، haptoglobin)، **Haematological disorder** (bone marrow)، وغيرهم (B12/folate، PTH).
          2. **Iron deficiency?** (برتقاني فاتح): **Ferritin**، **TSAT** (transferrin saturation)، نسبة الـ **hypochromic red cells** والـ **reticulocyte haemoglobin content** (شرحهم مكتوب يمين) ← **Iron supplementation**.
          3. **ESA therapy** (أصفر): **Epoetin** 2000–3000 وحدة 2–3 مرات في الأسبوع، **Darbepoetin** 30 µg أسبوعيًا، **Pegylated epoetin beta** 60 µg كل أسبوعين، و الـ **hypoxia-inducible factor prolyl hydroxylase inhibitors** بالبُق.

          الترتيب نفسه هو الرسالة: ==استبعد الأسباب التانية==، و==صلّح الحديد الأول==، وبعدين الـ ESA.
      - kind: explain
        page: 64
        quote: "HIF stabilizers"
        title: "الـ HIF stabilizers بيشتغلوا إزاي؟"
        text: |
          الكتاب بيحط **HIF stabilizers** (oral) جنب الـ ESAs.

          التفسير المقبول (مش في الكتاب): الجسم بيعرف إنه ناقص أكسجين عن طريق بروتين اسمه **hypoxia-inducible factor (HIF)**. في الأكسجين الطبيعي، إنزيم بيكسّره على طول. الدوا بيوقف الإنزيم ده، فالـ HIF يفضل موجود، والجسم "يفتكر" إنه في hypoxia، فيعمل ==erythropoietin== بنفسه ويحسّن امتصاص الحديد واستخدامه.

          يعني بدل ما تدّيه EPO من بره بالحقنة، بتخلّي جسمه يعمله، وده بالبُق.
