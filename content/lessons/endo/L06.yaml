        why: "L-T4 لازم على empty stomach: الأكل والأدوية والـ coeliac بيقللوا الامتصاص. الـ enzyme inducers بيكسّروا الهرمون، والـ nephrotic بيضيّعه في البول. والـ oestrogen بيعلّي الـ TBG."
      - kind: aside
        tone: joke
        page: 106
        quote: "Patients should be advised to take L-T4 on an empty stomach; certain foodstuffs (e.g. fibre, espresso coffee)"
        text: "المريض بياخد الـ thyroxine مع الفول والعيش البلدي (fibre) وفنجان espresso وحباية الكالسيوم؟ يبقى بياخد الجرعة للمعدة تتفرج عليها بس. **Empty stomach** يا جماعة."
      - kind: reveal
        page: 106
        quote: "Owing to their differing half-lives, intermittent thyroxine ingestion may result in normal or even elevated TH concentrations, but fails to normalize TSH"
        prompt: "ليه المريض اللي بينسى ويرجع ياخد كذا حباية قبل العيادة يطلع FT4 عالي و TSH عالي في نفس الوقت؟"
        answer: "الـ FT4 بيعكس آخر كام يوم (جرعة الصبح)، أما الـ TSH بيحتاج أسابيع ينزل. فالـ **half-lives** المختلفة بتكشف الـ ==poor compliance==."
      - kind: check
        page: 106
        quote: "Heterophilic antibody interference in the TSH assay may yield falsely elevated results; FT3 is normal"
        question: "On levothyroxine: TSH high, FT4 normal, FT3 normal, and the patient feels well on a reasonable dose. Which cause should you suspect?"
        options: ["TSH assay interference", "Resistance to thyroid hormone", "Increased TBG", "Physiological variant"]
        answer: 0
        why:
          - "صح: الـ heterophilic antibodies بتعلّي الـ TSH كذب، والـ FT3 طبيعي."
          - "الـ RTH بيدّي FT4 و FT3 عاليين."
          - "زيادة الـ TBG بتخلّي الـ FT4 يقع."
          - "الـ variant: TSH طبيعي و FT4 عالي شوية."
      - kind: explain
        page: 106
        quote: "usually fall in the range 1.6–2.0 mcg/kg"
        title: "الجرعة"
        text: |
          في الـ athyreotic، الجرعة الكاملة حوالي ==1.6-2.0 mcg/kg== في اليوم.

          - **الكبار في السن** محتاجين أقل.
          - خد بالك مع **ischaemic heart disease** أو arrhythmias.
          - تغيير الـ brand: تجنّبه، ولو حصل كتّر الـ TFTs.
