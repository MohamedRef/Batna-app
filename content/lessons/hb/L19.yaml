          </svg>
      - kind: explain
        page: 386
        quote: "> Mucocele of the GB, Pyocele of the GB. > Rupture GB."
        title: "المضاعفات بالمكان: أسهل شكل للـ essay"
        text: |
          أسهل شكل تكتب بيه المضاعفات في الـ essay: قسّمها بالمكان.

          **In the gallbladder**:
          - silent stones، acute و chronic cholecystitis
          - **gangrene**، **perforation**
          - **mucocele**، **empyema**، **hydrops**
          - **emphysematous cholecystitis**
          - adenomyomatosis، cholesterosis، polyposis، cholecystitis glandularis proliferans، diverticulosis، typhoid GB
          - **carcinoma**

          **In the bile ducts**:
          - **Obstructive jaundice**
          - **Cholangitis**
          - **Acute relapsing pancreatitis**

          **In the intestine**:
          - ==Gallstone ileus==: acute intestinal obstruction
          - **Bouveret's syndrome**

          والقايمة المختصرة في صفحة 386 بتزوّد ==Mirizzi syndrome== و rupture GB (والـ pyocele = empyema).
      - kind: sort
        page: 387
        quote: "Acute relapsing pancreatitis."
        prompt: "المضاعفة دي بتحصل فين؟"
        bins: ["Gallbladder", "Bile ducts", "Intestine"]
        cards:
          - { text: "Empyema", bin: 0 }
          - { text: "Mucocele", bin: 0 }
