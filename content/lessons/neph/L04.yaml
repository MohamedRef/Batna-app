      - kind: explain
        remind: [neph.L04.027]
        page: 83
        title: "أسباب الـ refractory HT"
        quote: "Pseudoresistance:\n  White-coat hypertension\n  Pseudohypertension in older patients\n  Use of small cuff in patients who are obese\nNonadherence to prescribed therapy\nVolume overload\nDrug-related causes:\n  Doses too low\n  Wrong type of diuretic\n  Inappropriate combinations\n  Drug actions and interactions\n  Sympathomimetics\n  Nasal decongestants\n  Appetite suppressants\n  Cocaine\n  ? Caffeine\n  Oral contraceptives\n  Adrenal steroids\n  Licorice (as may be found in chewing tobacco)\n  Cyclosporine, tacrolimus\n  Erythropoietin\n  Antidepressants\n  Nonsteroidal anti-inflammatory drugs\nConcomitant conditions:\n  Obesity\n  Sleep apnea\n  Ethanol intake of more than 1 oz (30 mL) per day\n  Anxiety, hyperventilation\nSecondary causes of hypertension (e.g., renovascular hypertension, adrenal causes, and renal disease, etc.)"
        text: |
          1. ==Pseudoresistance==: white-coat، pseudohypertension في الكبار، **small cuff** في التخان
          2. **Nonadherence**
          3. **Volume overload**
          4. **Drug-related:** جرعات قليلة، diuretic غلط، combinations غلط، interactions، وأدوية بترفع الضغط
          5. **Concomitant:** obesity، **sleep apnea**، ethanol >**30 ml/day**، anxiety
          6. **Secondary causes**

          الخطوة الجاية بتشرح **ليه** كل سبب من دول بيعمل refractory.
      - kind: explain
        page: 83
        quote: "Pseudoresistance:\n  White-coat hypertension\n  Pseudohypertension in older patients\n  Use of small cuff in patients who are obese\nNonadherence to prescribed therapy\nVolume overload\nDrug-related causes:\n  Doses too low\n  Wrong type of diuretic\n  Inappropriate combinations\n  Drug actions and interactions\n  Sympathomimetics\n  Nasal decongestants\n  Appetite suppressants\n  Cocaine\n  ? Caffeine\n  Oral contraceptives\n  Adrenal steroids\n  Licorice (as may be found in chewing tobacco)\n  Cyclosporine, tacrolimus\n  Erythropoietin\n  Antidepressants\n  Nonsteroidal anti-inflammatory drugs\nConcomitant conditions:\n  Obesity\n  Sleep apnea\n  Ethanol intake of more than 1 oz (30 mL) per day\n  Anxiety, hyperventilation\nSecondary causes of hypertension (e.g., renovascular hypertension, adrenal causes, and renal disease, etc.)"
        title: "ليه الأسباب دي بتعمل refractory؟"
        text: |
          الكتاب بيبدأ بالـ **pseudoresistance** وبعدين nonadherence و volume و drugs و concomitant conditions و secondary causes.

          التفسير المقبول (مش في الكتاب):

          - **Pseudohypertension في الكبار:** الشريان مكلّس وناشف، الـ cuff محتاج ضغط عالي علشان يقفله، **فـ** الرقم أعلى من الضغط جوه الشريان.
          - **Volume overload:** لو الصوديوم والمية زيادة، الضغط بيبقى معتمد على الـ volume، **يعني** الأدوية التانية مش هتنفع من غير diuretic مظبوط.
          - **Cyclosporine/tacrolimus و EPO:** بيضيّقوا الأوعية.
          - **Sleep apnea:** كل وقفة نفس بالليل بتشغّل الـ sympathetic.
          - **Alcohol > 30 ml/day:** بيعلّي الضغط مباشرة.
