    update:
      text: "The book calls bromocriptine and cabergoline dopamine antagonists; pharmacologically both are dopamine (D2) agonists. The drugs and their effect are the book's; only the label is a slip."
      ref: "Endocrine Society clinical practice guideline: hyperprolactinemia 2011"
