- id: res.L14.lesson1
  title: 'الـ screening: ندوّر على المرض قبل ما يبان'
  hook: اللي بتشوفه في العيادة هو طرف جبل التلج بس. الـ screening هو اللي بيغطس تحت المية.
  minutes: 9
  pages: [2, 9]
  topics: [screening]
  goals:
  - تفرّق بين الـ primary والـ secondary والـ tertiary prevention
  - تعرّف الـ screening وتفهم إنه مش تشخيص
  - تحفظ معايير Wilson and Jungner مقسّمة على 3
  status: unverified
  steps:
  - kind: figure
    page: 2
    quote: |-
      Intervene before disease develops: primary prevention e.g. immunisation
      Intervene after disease develops to reduce severity or recurrence: secondary prevention e.g. screening
      Intervene after disease develops to reduce consequences: tertiary prevention e.g. screening for diabetic eye disease
    title: 3 مستويات للوقاية على خط الزمن
    alt: A timeline from perfect health to onset of disease, symptoms and contact, then treatment and disability. Primary
      prevention points to before onset (immunisation), secondary to after onset to reduce severity (screening), tertiary
      to after the disease to reduce consequences (screening for diabetic eye disease).
    caption: الـ **primary** قبل ما المرض يحصل، الـ **secondary** بدري عشان تقلل الـ severity، والـ **tertiary** بعد ما المرض
      موجود عشان تقلل الـ consequences.
