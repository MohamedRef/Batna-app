  - id: neph.L14.117
    kind: cloze
    topic: hus
    text: "HUS develops in {{c1::5-15%}} of STEC infections, mostly in children under {{c2::5}}. Bloody diarrhea appears on day 2-3 and HUS {{c3::3-10 days}} after diarrhea starts."
    src: { page: 472, quote: "The incidence of HUS among individuals infected with STEC ranges from 5% to 15%, predominantly affecting children younger than 5." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.118
    kind: card
    topic: hus
    front: How does aHUS usually present?
    back: Nonspecific fatigue, pallor or somnolence, progressing to AKI (oliguria, uremia, fluid overload); extrarenal cardiac and neurological involvement is common.
    src: { page: 472, quote: "The initial clinical manifestation of aHUS typically involves nonspecific symptoms like fatigue, pallor, or somnolence. These symptoms can progress to signs of AKI, including oliguria, uremia, and fluid overload. The risk of progression to stage 3 or 4 CKD and ESRD in aHUS is high." }
    status: unverified
  - id: neph.L14.119
    kind: card
    topic: hus
    front: Which is the only cause of Coombs-positive HUS, and what does it need?
    back: Streptococcus pneumoniae (neuraminidase exposes cell antigens); give antibiotics early.
    src: { page: 473, quote: "S pneumoniae releases neuraminidase, exposing cellular antigens and activating the alternative complement system. This is the only cause of Coombs-positive HUS, and early antibiotic administration is indicated." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.120
    kind: cloze
    topic: hus
    text: "S. pneumoniae causes {{c1::5-15%}} of HUS in children."
    src: { page: 473, quote: "abnormal complement system activation. The most significant component of this category is HUS caused by Streptococcus pneumoniae, accounting for 5% to 15% of all cases of HUS in children." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.121
    kind: enumerate
    topic: hus
    prompt: Causes of secondary aHUS (p473)?
    points:
      - Inherited vitamin B12 (cobalamin) metabolism disorders
      - DGKE mutations
      - HIV and influenza
      - SLE and antiphospholipid syndrome
      - Drugs (quinine, CNIs, chemotherapy)
      - Malignant hypertension
      - COVID-19 and pregnancy as triggers
    pass: 5
    hook: "الـ secondary aHUS «وراثة 2 + عدوى + مناعة + دوا + ضغط + زناد»: inherited vitamin B12 (cobalamin) metabolism disorders وDGKE mutations، HIV وinfluenza، SLE وAPS، أدوية (quinine، CNIs، chemotherapy)، malignant hypertension، وCOVID-19 والحمل كـ triggers."
    src: { page: 473, quote: "Other causes of secondary aHUS are as follows" }
    status: unverified
  - id: neph.L14.122
    kind: order
    topic: hus
    prompt: Order the steps of Shiga toxin injury in typical HUS.
    steps:
      - Undercooked beef or unpasteurized milk is eaten
      - STEC penetrates the intestinal mucus and secretes Shiga toxin
      - Toxin binds the Gb3 receptor
      - Toxin-Gb3 complex binds ribosomes, blocks protein synthesis, causes apoptosis
      - Endothelial damage in the glomerular microvasculature starts TMA
    src: { page: 473, quote: "Once ingested, STEC penetrates the mucous layer of the intestine and secretes Shiga toxin, which binds to the receptor Gb3." }
    status: unverified
  - id: neph.L14.123
    kind: enumerate
    topic: hus
    prompt: Four mechanisms of endothelial damage by Shiga toxin?
    points:
      - Direct cytotoxicity
      - Disturbance of the hemostatic pathway
      - Increased cytokine release
      - Alternative complement pathway activation (factor H inhibition)
    pass: 4
    hook: "Shiga toxin بتضرب البطانة بـ 4: «تقتل، تلخبط التجلط، تولّع سيتوكينات، وتفك فرامل الـ complement»: direct cytotoxicity، disturbance of the hemostatic pathway، increased cytokine release، وalternative complement pathway activation (factor H inhibition)."
    src: { page: 474, quote: "Endothelial damage is caused by 1) direct cytotoxicity of Shiga toxin, 2) disturbance of the hemostatic pathway, 3) increased cytokine release, and 4) alternative pathway activation. This endothelial damage then initiates the pathology associated with TΜΑ." }
    status: unverified
  - id: neph.L14.124
    kind: card
    topic: hus
    front: What is the role of factor H in aHUS?
    back: Factor H regulates the alternative pathway by stabilizing C3 and inactivating C3b; genetic defects plus a trigger (such as infection) cause aHUS.
    src: { page: 474, quote: "In aHUS, the alternative complement pathway is activated as described above, with particular emphasis on regulatory Factor H that stabilizes C3 and inactivates C3b." }
    status: unverified
  - id: neph.L14.125
    kind: enumerate
    topic: hus
    prompt: Lab evidence of hemolytic anemia in HUS?
    points:
      - High LDH
      - High indirect bilirubin
      - Low haptoglobin
      - High plasma hemoglobin
      - Schistocytes on the smear
    pass: 4
    hook: "الدم المكسور في HUS بيسيب 5 بصمات «3 طالعين + 1 نازل + 1 باين»: LDH وindirect bilirubin وplasma hemoglobin عاليين، haptoglobin واطي، وschistocytes على الـ smear."
    src: { page: 474, quote: "Elevated LDH and indirect bilirubin, as well as low haptoglobin and elevated plasma hemoglobin, are diagnostic of hemolytic anemia, as are schistocytes on peripheral smear." }
    status: unverified
  - id: neph.L14.126
    kind: card
    topic: hus
    front: Why are amylase and lipase raised in some HUS patients?
    back: Pancreatic damage, in up to 20%, sometimes with hyperglycemia.
    src: { page: 474, quote: "Up to 20% of patients have ve elevated amylase and lipase due to pancreatic damage,which may be accompanied by hyperglycemia." }
    status: unverified
  - id: neph.L14.127
    kind: card
    topic: hus
    front: Why can the stool Shiga toxin test be negative in typical HUS?
    back: The toxin may have been cleared or be avidly bound to the endothelium.
    src: { page: 475, quote: "A stool sample should be collected to test for Shiga toxin whenever diarrhea is present. The results may not be positive for the Shiga toxin if it has been cleared or is avidly bound to the endothelium. If clinically indicated, testing for the presence of S dysenteriae and S pneumonia should also be performed." }
    status: unverified
  - id: neph.L14.128
    kind: card
    topic: hus
    front: In suspected HUS, what do low complement, ADAMTS13 and abnormal coagulation tests point to?
    back: "Low complement: suggests (not specific for) aHUS. ADAMTS13: sent to rule out TTP. Prolonged PT/aPTT, high D-dimer and FDPs: DIC."
    src: { page: 475, quote: "An ADAMTS13 level should be sent to rule out TTP." }
    status: unverified
  - id: neph.L14.129
    kind: table
    topic: hus
    title: Genetic abnormalities and clinical outcome in atypical hemolytic-uremic syndrome (Table 2, p475)
    columns: [Gene, Frequency, Death or ESRD, Recurrence after transplant]
    rows:
