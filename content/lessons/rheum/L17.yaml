          الـ X-ray ==مش sensitive أوي==.

          الـ sacroiliitis في الـ ankylosing spondylitis (AS): **symmetrical و bilateral**، فيه subchondral erosions و sclerosis و proliferation على ناحية الـ ==iliac==، وفي الآخر المفصل يتقفل خالص.

          ليه الـ iliac side؟ التفسير المقبول (مش في الكتاب): الغضروف على ناحية الـ ilium أرفع، فالالتهاب بيوصل للعضم أسرع ويبان هناك الأول.
      - kind: order
        page: 286
        quote: "0: Normal. I: Some blurring of the joint margins – (suspicious). II: Minimal sclerosis with some erosion (pseudo-widening). III: Severe erosions and definite sclerosis on both sides of joint. IV: Complete ankyloses."
        prompt: "رتّب الـ sacroiliitis من الأخف للأشد:"
