          - { text: "Daily dose > 50 mg", bin: 2 }
          - { text: "High lipophilicity", bin: 2 }
          - { text: "> 50% hepatic metabolism", bin: 2 }
        why: "الـ **host** = العيان نفسه. الـ **environment** = اللي حواليه (alcohol، الشغل). الـ **drug** = خصائص الدوا: dose > 50 mg، lipophilic، > 50% hepatic metabolism."
      - kind: table
