  - id: dm.L04.lesson4
    title: "عيان السكر في أنهي درجة خطر؟"
    hook: "قبل ما تختار الـ statin لازم تعرف العيان فين على السلّم: very high، high، ولا moderate."
    minutes: 8
    pages: [44, 45]
    topics: [risk-categories]
    goals:
      - "تصنّف عيان السكر: very high، high، moderate"
      - "تعرف ليه الـ organ damage ومدة السكر بيطلّعوا الدرجة"
      - "تقرا الـ SCORE وتعرف الكلية بتحطك فين"
    status: unverified
    steps:
      - kind: explain
        page: 44
        title: "الـ ESC: تلات درجات"
        quote: "High CV risk is defined as DM duration ≥ 10 years without target organ damage plus any other additional risk factor."
        text: |
          - **Very high:** established cardiovascular disease (CVD)، أو ==target organ damage== (proteinuria، eGFR <30، left ventricular hypertrophy (LVH)، retinopathy)، أو **≥3** risk factors، أو type 1 بدري ومدته **>20 سنة**.
          - **High:** سكر **≥10 سنين** من غير organ damage + أي risk factor تاني.
          - **Moderate:** صغيّر (type 1 <35، type 2 <50)، مدة **<10 سنين**، من غير risk factors.

          ليه target organ damage بيحطك في very high؟ يعني السكر **بالفعل** ضرب الأوعية: الـ proteinuria والـ retinopathy علامات إن الـ microvessels اتأذت، والـ LVH علامة إن القلب شايل ضغط عالي من زمان. ونفس العملية شغالة في الشرايين الكبيرة اللي مش شايفينها. ومدة السكر مهمة لأن الضرر بيتجمع مع السنين.
      - kind: update
        page: 44
        quote: "ESC/EASD: very high CV risk defined as DM with other target organ damage (proteinuria, eGFR < 30 mL/min/1.73 m2, left ventricular hypertrophy, or retinopathy) or ≥ 3 major risk factors (age, hypertension, dyslipidemia, smoking, obesity);"
        text: "الـ European Society of Cardiology (ESC) 2023 بقى يحسب الخطر في type 2 من غير atherosclerotic cardiovascular disease (ASCVD) أو organ damage شديد بالـ **SCORE2-Diabetes**. في الامتحان: تقسيمة الكتاب."
        ref: "ESC Guidelines for CVD in patients with diabetes 2023"
      - kind: explain
        page: 45
        title: "القايمة الكاملة: very high و high"
        quote: "Very high risk People with any of the following: Documented ASCVD DM with target organ damage, ≥3 major risk factors Early onset of T1DM of long duration (>20 years). Severe CKD (eGFR <30 mL/min/1.73 m )"
        text: |
          **Very high risk** (أي واحدة):
          - **Documented ASCVD**
          - سكر مع **target organ damage** أو **≥3** major risk factors
          - type 1 بدأ بدري ومدته **>20 سنة**
          - ==Severe CKD== (eGFR **<30**)
          - **SCORE ≥10%**
          - **familial hypercholesterolaemia (FH)** مع ASCVD أو risk factor كبير

          **High risk** (أي واحدة):
          - risk factor واحد عالي جدًا: **TC >310**، **LDL-C >190**، أو ضغط **≥180/110**
          - **FH** من غير risk factors تانية
          - سكر من غير organ damage، أو مدته **≥10 سنين**
          - **Moderate CKD** (eGFR **30–59**)
          - **SCORE ≥5% و <10%**

          اقراها كدرجات لنفس الحاجة: الكلية مثلًا: eGFR 30–59 = high، وتحت 30 = very high. يعني كل ما الضرر يكبر، الدرجة تطلع، والـ LDL goal ينزل.
