lessons:
  # ------------------------------------------------------------------
  - id: git.L02.lesson1
    title: "نوصل للأمعاء الدقيقة إزاي؟"
    hook: "ستة متر أمعاء مش بيوصلها لا منظار المعدة ولا منظار القولون. نعمل إيه مع نزيف مش لاقيين مصدره؟"
    minutes: 8
    pages: [40, 48]
    topics: [history, enteroscopy, capsule, utegd]
    goals:
      - "تعدّ أنواع الـ enteroscopy ودواعيها"
      - "تعرف أرقام الـ capsule وموانعها"
      - "تعرف فايدة وعيب الـ ultrathin EGD"
    status: unverified
    steps:
      - kind: explain
        page: 40
        quote: "Interventions mean any interference which may occurs to diagnose and treat the disease or to follow-up its course."
        title: "المنظار بقى بيعالج مش بس بيشوف"
        text: |
          الـ ==intervention== في الـ GIT: أي تدخّل علشان **نشخّص** أو **نعالج** أو **نتابع** المرض.

          والـ gastroenterologist بقى دوره كبير في العلاج، والتطور كان سريع جدًا: من **fiber optic gastroscope** سنة 1958 لحد **endomicroscopy** سنة 2008 اللي بتديك histology وانت جوه.
      - kind: order
        page: 40
        quote: "1958 Development of fiber optic gastroscope"
        prompt: "رتّب المحطات دي من الأقدم للأحدث:"
        steps:
          - "Fiber optic gastroscope"
          - "Colonoscopic polypectomy"
          - "Percutaneous endoscopic gastrostomy"
          - "Endoscopic variceal ligation"
          - "Self-expanding metal stents"
          - "Endomicroscopy"
        why: "الكتاب: 1958 fiber optic، 1969 polypectomy، 1979 PEG، 1990 variceal ligation، 1996 metal stents، 2008 endomicroscopy."
      - kind: explain
        page: 41
        quote: "The major indication is to locate a site of obscure GIT bleeding."
        title: "الـ enteroscopy"
        text: |
          الـ ==enteroscopy== = منظار للـ **small bowel**. دلالته الأولى: نلاقي مكان **obscure GI bleeding**. وفيه **working channels** للـ biopsy والعلاج.

          أنواعه ستة: **colonoscope**، **sonde**، **push**، **double balloon (push and pull)**، **intraoperative**، و **spiral**.

          - **Day-case**، من **45 دقيقة لساعتين**.
          - **Sedation** أو short-acting GA.
          - من **البق أو الشرج** حسب الجزء المطلوب.
          - بينفخوا **CO2** علشان الانتفاخ يقل، وأحيانًا **fluoroscopy**.
      - kind: figure
        page: 43
        quote: "Antegrade (oral) DBE Retrograde (anal) DBE"
        title: "الـ double balloon بيمشي إزاي؟"
        alt: "Sketch of a double balloon enteroscope: an overtube with a balloon and a scope with a balloon at its tip inside a looped small bowel; arrows show the push of the scope, inflation, and the pull that pleats the bowel onto the overtube."
        caption: "**Push and pull**: بالونتين بيتبادلوا يمسكوا الأمعاء، والمنظار يتزق وبعدين يشد الأمعاء ويكرمشها على الـ overtube زي ما بتلبس شراب. 😄 يا من البق (antegrade) يا من الشرج (retrograde)."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="G2a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <path d="M10 60 C80 60 90 140 160 140 C230 140 240 60 320 60" class="fg-thin" fill="none" stroke-width="40"/>
            <path d="M10 60 C80 60 90 140 160 140 C230 140 240 60 300 60" class="fg-ink" fill="none" stroke-width="6"/>
            <ellipse cx="115" cy="118" rx="16" ry="22" class="fg-acc"/>
            <ellipse cx="292" cy="60" rx="14" ry="20" class="fg-good"/>
            <text x="70" y="180" class="t-sm t-b">Overtube balloon</text>
            <text x="196" y="26" class="t-sm t-b">Scope tip balloon</text>
            <text x="10" y="30" class="t-sm t-mut">Small bowel</text>
            <path d="M40 220h110" class="fg-arrow-acc" marker-end="url(#G2a)"/>
            <text x="160" y="224" class="t-sm">push the scope</text>
            <path d="M150 260h-110" class="fg-arrow-acc" marker-end="url(#G2a)"/>
            <text x="160" y="264" class="t-sm">pull: bowel pleats onto it</text>
          </svg>
      - kind: sort
        page: 42
        quote: "Thermo coagulation of bleeding lesions. o Placement of jejonostomy tube. c) Surveillance o Polyposis syndrome."
        prompt: "دلالات الـ enteroscopy: حط كل واحدة في نوعها:"
        bins: ["Diagnostic", "Therapeutic", "Surveillance"]
        cards:
          - { text: "Obscure GI bleeding", bin: 0 }
          - { text: "Malabsorption, unexplained diarrhea", bin: 0 }
          - { text: "Small bowel malignancy", bin: 0 }
          - { text: "Thermocoagulation of bleeding lesions", bin: 1 }
          - { text: "Jejunostomy tube placement", bin: 1 }
          - { text: "Polyposis syndrome", bin: 2 }
        why: "الكتاب (ص 41-42): diagnostic أربعة (bleeding، malabsorption، radiographic abnormality، malignancy)، therapeutic اتنين، و surveillance واحدة: polyposis."
      - kind: explain
        page: 43
        quote: "The capsule which measures 11x25 mm takes 2frames/sec and transmits the images to a recording device."
        title: "الـ capsule: منظار تبلعه"
        text: |
          ==Wireless capsule endoscopy==: **painless**، بتصوّر الـ **small bowel كله**.

          - الحجم **11 x 25 mm**.
          - بتاخد **2 frames/sec** وتبعتهم لـ recording device.
          - الصور **excellent** والمعلومة **accurate**.
      - kind: mnemonic
        page: 44
        quote: "Patients with mental or physical disorders  Swallowing problems  History of major GI surgery  Known fixed stricture or obstruction."
        word: "MSSS"
        parts:
          - { key: "M", text: "Mental or physical disorders" }
          - { key: "S", text: "Swallowing problems" }
          - { key: "S", text: "Surgery: history of major GI surgery" }
          - { key: "S", text: "Stricture or obstruction, known and fixed" }
        hook: "**«مِسّ»**: الـ capsule مش هتمِسّ المريض ده. وأخطرهم الـ **stricture**: الكبسولة ممكن تتزنق."
      - kind: figure
        page: 46
        title: "الـ capsule بتشوف إيه؟"
        image: { file: git/L02-capsule-findings.webp, book: true }
        alt: "Eight capsule endoscopy frames labelled lymphoma, GIST, polypoid mass, polyp, phlebectasia, AVM, lymphangiectasia and bleeding lesion."
        caption: |
          دي إجابة سؤال «indications of capsule» من الكتاب:
          - **Tumors**: lymphoma، GIST، polyp، polypoid mass.
          - **Vascular**: phlebectasia، AVM، bleeding lesion.
          - **Lymphangiectasia**.

          وفي ص 47: NSAID stricture، radiation enteritis، sprue، و villous drop-out.
      - kind: check
        page: 44
        quote: "Known fixed stricture or obstruction."
        question: "Which patient should NOT swallow a capsule?"
        options:
          - "Crohn's disease with a known fixed ileal stricture"
          - "Obscure GI bleeding with normal EGD and colonoscopy"
          - "Suspected small bowel lymphoma"
          - "Celiac disease with suspected villous atrophy"
        answer: 0
        why:
          - "صح: **known fixed stricture or obstruction** من موانع الـ capsule."
          - "ده بالظبط اللي الـ capsule معمولة له."
          - "الـ lymphoma من صور الكتاب على الـ capsule."
          - "الـ sprue والـ villous drop-out من صور الكتاب."
      - kind: explain
        page: 48
        quote: "well tolerated in patients with liver cirrhosis as a rapid screening tool for detecting the presence and size of varices."
        title: "UTEGD: المنظار الرفيع"
        text: |
          **Ultrathin EGD** بقى ممكن مع منظار **5.3 mm**، بديل للـ sedated trans-oral endoscopy.

          - **من غير sedation**، والـ cirrhotic بيستحمله: ==rapid screening== للـ **varices** (موجودة ولا لأ، وحجمها).
          - العيب الرئيسي: **fiber-optic quality** للصورة.
          - هيبقى أحسن لما يبقى فيه **video endoscope** أقل من 6 mm.
      - kind: try
        items: [git.L02.006, git.L02.008, git.L02.017, git.L02.018]
    recap:
      - "Enteroscopy: الـ small bowel؛ أهم دلالة obscure GI bleeding؛ 6 أنواع منها double balloon (push and pull)."
      - "Day-case، 45 دقيقة لساعتين، CO2 للانتفاخ، من البق أو الشرج."
      - "Capsule: 11 x 25 mm، 2 frames/sec؛ موانعها «MSSS» وأخطرها الـ fixed stricture."
      - "UTEGD 5.3 mm: varices screening من غير sedation؛ عيبه الصورة."
    practice: [git.L02.001, git.L02.002, git.L02.003, git.L02.004, git.L02.005, git.L02.006, git.L02.007, git.L02.008, git.L02.009, git.L02.010, git.L02.011, git.L02.012, git.L02.013, git.L02.014, git.L02.015, git.L02.016, git.L02.017, git.L02.018, git.L02.019, git.L02.020, git.L02.021, git.L02.022, git.L02.023, git.L02.024, git.L02.108, git.L02.109, git.L02.110, git.L02.111, git.L02.112, git.L02.132, git.L02.135]
