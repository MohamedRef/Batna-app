  # ------------------------------------------------------------------
  - id: dm.L08.lesson1
    title: "الهرم الغذائي: كام سعر وكام حصة؟"
    hook: "قبل ما تقول لمريض السكر «ما تاكلش»، قوله ياكل إيه وقد إيه."
    minutes: 9
    pages: [89, 94]
    topics: [calories, pyramid]
    goals:
      - "تعرف الـ calorie categories"
      - "تحفظ الـ 6 food groups وحصصهم"
      - "تعرف مغذيات كل مجموعة"
    status: unverified
    steps:
      - kind: explain
        page: 89
        title: "مبادئ ثابتة"
        quote: "Evolutionary, flexible, practical, useful, realistic, overall Health, Up-to- Date Research, total diet."
        text: |
          الـ **USDA food guidance** اتغيرت كتير، بس الـ **guiding principles** ثابتة: evolutionary، ==flexible==، **practical**، useful، ==realistic==، overall health، up-to-date research، و **total diet**.

          يعني الأكل مش قايمة ممنوعات، ده نظام كامل مرن وواقعي.
      - kind: table
        page: 90
        quote: "1,600 calories - Many sedentary women and some older adults."
        title: "كام سعر في اليوم؟"
        columns: [Calories, Who]
        rows:
          - ["1,600", "Sedentary women, older adults"]
          - ["2,200", "Kids, teen girls, active women, sedentary men"]
          - ["2,800", "Teen boys, active men, very active women"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: tip
        page: 90
        quote: "Women who are pregnant may need around 500 calories more per day and an additional 300 calories for breastfeeding."
        text: "الحامل: **+500** سعر في اليوم، والرضاعة **+300** زيادة. والأرقام التلاتة **1600 / 2200 / 2800** بينهم **600** بالظبط."
      - kind: explain
        page: 90
        title: "الهرم"
        quote: "It shows recommended servings for food products."
        text: |
          الـ ==food pyramid== بيوري:
          - **different levels** (تحت = كتير، فوق = قليل)
          - **serving suggestions**
          - **examples of food**

          وبيقسّم الأكل لـ **6 food groups**. الكتاب بيقول اتعمل سنة **1974**.
      - kind: update
        page: 90
        quote: "It shows recommended servings for food products."
        text: "الـ USDA بدّلت الهرم (recommended servings) بـ **MyPlate** سنة 2011، والـ ADA بتستخدم الـ plate method وأنظمة أكل فردية. في الامتحان: الهرم بتاع الكتاب."
        ref: "USDA MyPlate 2011; ADA nutrition therapy consensus report 2019"
      - kind: figure
        page: 92
        quote: "6 – 11 servings per day."
        title: "الهرم بالحصص"
        alt: "A food pyramid in four tiers. Base: cereal and grains 6 to 11 servings. Second tier: vegetables 3 to 5 and fruit 2 to 4. Third tier: milk, yogurt, cheese 2 to 3 and meat, fish, poultry 2 to 3. Top: fats, oils, sweets, use sparingly."
        caption: "كل ما تطلع، الحصص تقل: ==grains 6–11== تحت، والـ **fats و sweets** فوق «sparingly»."
        svg: |
          <svg viewBox="0 0 330 290" xmlns="http://www.w3.org/2000/svg">
            <path d="M165 15 L205 75 L125 75 Z" class="fg-bad"/>
            <text x="165" y="62" text-anchor="middle" class="t-sm t-b">Fats</text>
            <text x="230" y="50" class="t-sm">sparingly</text>
            <path d="M120 82 L210 82 L245 140 L85 140 Z" class="fg-acc"/>
            <text x="125" y="108" class="t-sm t-b">Milk</text>
            <text x="125" y="126" class="t-sm">2–3</text>
            <text x="172" y="108" class="t-sm t-b">Meat</text>
            <text x="172" y="126" class="t-sm">2–3</text>
            <path d="M80 147 L250 147 L285 205 L45 205 Z" class="fg-good"/>
            <text x="90" y="172" class="t-sm t-b">Vegetables</text>
            <text x="90" y="190" class="t-sm">3–5</text>
            <text x="185" y="172" class="t-sm t-b">Fruit</text>
            <text x="185" y="190" class="t-sm">2–4</text>
            <path d="M40 212 L290 212 L320 275 L10 275 Z" class="fg-box"/>
            <text x="165" y="240" text-anchor="middle" class="t-sm t-b">Cereal and grains</text>
            <text x="165" y="260" text-anchor="middle" class="t-sm">6–11 servings</text>
          </svg>
      - kind: match
        page: 92
        quote: "3 -5 servings per day."
        prompt: "وصّل كل مجموعة بعدد حصصها في اليوم:"
        pairs:
          - ["Cereal and grains", "6–11"]
          - ["Vegetables", "3–5"]
          - ["Fruit", "2–4"]
          - ["Meat or milk", "2–3"]
        why: "الـ grains قاعدة الهرم (6–11)، الخضار أكتر من الفاكهة (3–5 قدام 2–4)، والـ milk والـ meat كل واحد 2–3."
      - kind: explain
        page: 92
        title: "Grains و vegetables"
        quote: "are less processed and retain more valuable vitamins, minerals, and fiber than foods made with white flour."
        text: |
          **Grains:** bread، rice، pasta. الـ ==whole-grain== أقل processing وفيه vitamins و minerals و **fiber** أكتر من الدقيق الأبيض.

          **Vegetables:** قليلة **fat و calories** (الطبخ هو اللي بيزوّدهم). كل نوع فيه مغذيات مختلفة، فنوّع. الكتاب بيقول:
          - الخضرا ← **vitamin A**
          - البرتقالي الغامق والأخضر الغامق ← **vitamin C**
          - **Broccoli** وقرايبه ← **iron و calcium**
      - kind: aside
        tone: trap
        page: 92
        quote: "Vegetables like broccoli and related plants contain iron and calcium."
        text: "المعروف إن الخضار (vegetables) **البرتقالي الغامق** (جزر) غني بـ **vitamin A (beta-carotene)**. الكتاب كاتب العكس تقريبًا؛ في الامتحان اكتب جملة الكتاب لو اتسألت عليها نصًا."
      - kind: explain
        page: 93
        title: "فاكهة ولبن"
        quote: "Processing fruits when canning or making them into juices may add sugars and remove nutrients."
        text: |
          **Fruit (2–4):** قليلة سعرات ودهون، فيها natural sugars و **fiber** و vitamins. ==Canning أو juicing== ممكن يزوّد سكر ويشيل مغذيات.

          **Milk, yogurt, cheese (2–3):** **calcium** أساسًا، ومعاه protein و phosphorus و vitamin A و D. بس كتير منها عالي **saturated fat**، فالـ **skimmed** بديل. للكبار: **3 cups** في اليوم.
      - kind: reveal
        page: 93
        quote: "Processing fruits when canning or making them into juices may add sugars and remove nutrients."
        prompt: "ليه البرتقانة أحسن من كوباية عصير برتقان لمريض السكر؟"
        answer: |
          العصير بيشيل الـ **fiber** اللي بيبطّأ امتصاص السكر، وبتشرب سكر 3–4 برتقانات في دقيقة، وأحيانًا بيتزود سكر.

          علشان كده الـ **orange juice** على جدول الـ GI (57) أعلى من الـ **apple** الكاملة (36)، والكتاب بيقول الـ processing بيزوّد سكر ويشيل مغذيات.
      - kind: explain
        page: 94
        title: "اللحمة"
        quote: "The food guide pyramid suggests that adults eat 2–3 servings per day. One serving of meat is 4 oz (110 g)."
        text: |
          **Meat** = **protein** و **iron** و **zinc** و **vitamin B12**.

          - **2–3 servings** في اليوم، و ==الحصة 4 oz (110 g)==
          - **Alternatives:** eggs، dry beans، nuts، tofu، lentils، chick peas
          - بس اللحمة ممكن تبقى عالية **fat و cholesterol و sodium**: شيل الدهن الظاهر.
      - kind: check
        page: 94
        quote: "The food guide pyramid suggests that adults eat 2–3 servings per day. One serving of meat is 4 oz (110 g)."
        question: "A man eats 450 g of meat a day. How many servings?"
        options: ["About 4 (above 2–3)", "About 2 (fine)", "About 9", "About 1"]
        answer: 0
        why:
          - "صح: 450 ÷ 110 ≈ 4، أكتر من 2–3."
          - "ده لو الحصة 225 g."
          - "ده لو الحصة 50 g."
          - "ده لو الحصة 450 g."
      - kind: try
        items: [dm.L08.002, dm.L08.010, dm.L08.011, dm.L08.013, dm.L08.026]
    recap:
      - "1,600 sedentary women، 2,200 active women و sedentary men، 2,800 active men. حامل +500، رضاعة +300."
      - "6 groups: grains 6–11، veg 3–5، fruit 2–4، milk 2–3، meat 2–3، fats sparingly."
      - "Whole grain أحسن من الأبيض. العصير بيزوّد سكر ويشيل fiber."
      - "Meat = protein، iron، zinc، B12؛ الحصة 110 g."
    practice: [dm.L08.001, dm.L08.002, dm.L08.003, dm.L08.004, dm.L08.005, dm.L08.006, dm.L08.007, dm.L08.008, dm.L08.009, dm.L08.010, dm.L08.011, dm.L08.012, dm.L08.013, dm.L08.014, dm.L08.015, dm.L08.016, dm.L08.017, dm.L08.018, dm.L08.019, dm.L08.020, dm.L08.021, dm.L08.022, dm.L08.023, dm.L08.024, dm.L08.025, dm.L08.026, dm.L08.027, dm.L08.028]
