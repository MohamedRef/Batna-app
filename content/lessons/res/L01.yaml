      - kind: explain
        page: 29
        quote: "4 Phases of Clinical trials\n| Phase | Participants | Studies |\n|---|---|---|\n| 0 | | Effect on body |\n| I | weeks; tens; 1 to 2 dozen participants | Safety in humans. Safety and best dosage levels are determined. |\n| II | months; hundreds; fewer than 100 participants | Effectiveness at treating diseases. Preliminary response to new treatment is recorded and analyzed. |\n| III | years; thousands; hundreds to thousands of participants | Larger scale safety and effectiveness. Results are compared between new and standard treatment. |\n| IV | ongoing; thousands of people involved | Long term safety. After treatment is approved, it is studied to evaluate side effects not apparent in Phase III. |\n| Preclinical | | Lab & animal studies |\n| Phase I | 20-80 people | Safety study |\n| Phase II | 100-300 people | Safety study; Identify side effects; Measure effectiveness |\n| Phase III | 1,000-3,000 people | Measure effectiveness; Monitor side effects |\n| Phase IV | | Monitor long-term side effects |"
        title: "الـ clinical trial phases"
        text: |
          - **Preclinical**: lab and animal studies.
          - **Phase I (20-80 people)**: ==safety== وأحسن **dosage**، غالبًا في healthy volunteers.
          - **Phase II (100-300 people)**: safety وside effects، وأول قياس لـ **effectiveness**.
          - **Phase III (1,000-3,000 people)**: ==effectiveness على نطاق أكبر==، والجديد قدام الـ **standard treatment**.
          - **Phase IV (thousands, after approval)**: الـ long-term side effects اللي ماظهرتش في III.

          الأرقام دي من slide 29. في slide 28 مكتوب أرقام تانية:

          - **Phase 1 in slide 28: 20 to 100 people**
          - **Phase 2 in slide 28: 100 to 500 people**
          - **Phase 3 in slide 28: 300 to 3000 people**

          الامتحان بيختبر الفكرة والترتيب أكتر من الرقم بالظبط.
