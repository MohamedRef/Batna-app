      - kind: explain
        page: 77
        quote: "Escalating doses of loop diuretics are the first-line of therapy for volume"
        title: "ليه السلّم ماشي بالترتيب ده؟"
        text: |
          الكتاب (Figure 6): **loop diuretic IV** على حسب الجرعة القديمة (bolus لأغلب العيانين، **continuous infusion** لو فيه hemodynamic instability) ← **زوّد** الـ loop ← ضيف **second diuretic** ← vasoactive therapy ← **extracorporeal** لو العلاج فشل. والهدف **3–5 l/day** بول.

          التفسير المقبول (مش في الكتاب):

          - الـ loop diuretic **threshold drug**: تحت تركيز معيّن في الـ tubule مفيش أي تأثير، **فـ** لو الجرعة مش شغالة بنضاعفها مش بنكرّرها.
          - الـ **second diuretic** (thiazide زي metolazone) بيقفل الـ distal tubule اللي بيمص الصوديوم اللي الـ loop سابه، **يعني** بنقفل الباب التاني.
          - الـ **infusion** بيدّي تركيز ثابت من غير peak يوقّع الضغط، **عشان** كده بنختاره في العيان المش مستقر.
          - **IV** مش oral **لأن** الأمعاء نفسها بتبقى متورّمة في الـ congestion والامتصاص بيقل.
      - kind: try
        items: [neph.L03.058, neph.L03.070, neph.L03.072, neph.L03.059]
    recap:
      - "GDMT الخمسة بيطوّلوا العمر في الـ HFrEF، بس عيانين الـ ESKD اتشالوا من الـ trials."
      - "Digoxin على الـ dialysis: الـ risks أكبر من الفايدة."
      - "ICD و CRT: LVEF ≤35%؛ CRT: LBBB ≥130 ms أو non-LBBB ≥150 ms."
      - "Furosemide stress test 1–1.5 mg/kg: <200 ml/2 h أو <600 ml/6 h = خطر وRRT."
      - "السلّم: loop IV ← أعلى ← second diuretic ← vasoactive ← extracorporeal."
