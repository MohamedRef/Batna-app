    goals:
      - "تحفظ قاعدة الخمسات بتاعة الـ LSM ومعنى كل درجة"
      - "تطبّق Baveno VI: LSM < 20 kPa و platelets > 150 G/L"
      - "تعرف ليه الـ HVPG لسه الأداة الوحيدة الدقيقة"
      - "تعرف دور الـ spleen والـ CT والـ LSM في الـ prognosis"
    status: unverified
    steps:
      - kind: explain
        page: 31
        quote: "Patient with compensated CLD (no previous episodes of decompensation)\nAdvanced chronic liver disease?\n  LSM >10 kPa: probable; >12-15 kPa very probable\n  Imaging signs as additional tools: nodularity of liver surface\n  No → Follow-up and therapy as needed\nCSPH?\n  LSM >20 kPa: CSPH very likely (~90%)\n  Platelet count <150 G/L\n  Imaging signs: porto-systemic collaterals; spleen size → Increased risk of clinical decompensation; HVPG measurement needed in order to exactly quantify the severity of PH\n  Baveno criteria not met if any of the two is present → Perform screening endoscopy (Spleen stiffness as additional tool)\n  If LSM <20 kPa and Plt >150 G/L varices needing treatment are very unlikely (<5%) → Safely avoid endoscopic screening; Repeat LSM + Plt every year"
        title: "من الـ fibrosis للضغط"
        text: |
          الدروس اللي فاتت كانت عن التليف. الدرس ده عن النتيجة الأخطر: **portal hypertension**.

          وبالذات الـ ==clinically significant portal hypertension (CSPH)==، لأنه هو اللي بيعمل varices و decompensation. التليف لوحده ما بيموّتش، الضغط هو اللي بيموّت.

          المريض اللي هنتكلم عنه عنده compensated chronic liver disease، يعني ما حصلّوش decompensation قبل كده. أول سؤال: هل عنده ==compensated advanced chronic liver disease (cACLD)==؟

          - Liver stiffness measurement (LSM) أكتر من 10 kPa: probable
          - LSM أكتر من 12–15 kPa: very probable
          - **Imaging**: علامة بتساعد، وهي nodularity of the liver surface (سطح الكبد محبّب بدل ما يبقى ناعم).
      - kind: figure
        page: 31
        quote: "Patient with compensated CLD (no previous episodes of decompensation)\nAdvanced chronic liver disease?\n  LSM >10 kPa: probable; >12-15 kPa very probable\n  Imaging signs as additional tools: nodularity of liver surface\n  No → Follow-up and therapy as needed\nCSPH?\n  LSM >20 kPa: CSPH very likely (~90%)\n  Platelet count <150 G/L\n  Imaging signs: porto-systemic collaterals; spleen size → Increased risk of clinical decompensation; HVPG measurement needed in order to exactly quantify the severity of PH\n  Baveno criteria not met if any of the two is present → Perform screening endoscopy (Spleen stiffness as additional tool)\n  If LSM <20 kPa and Plt >150 G/L varices needing treatment are very unlikely (<5%) → Safely avoid endoscopic screening; Repeat LSM + Plt every year"
        title: "من الـ cACLD للمنظار في الكتاب"
        image: { file: hb/L02-csph-algorithm.webp, book: true }
        alt: "Book flowchart headed 'Patient with compensated CLD (no previous episodes of decompensation)'. Red box: advanced chronic liver disease? Beside it an orange box (imaging signs as additional tools: nodularity of liver surface) and a blue box (LSM above 10 kPa probable, above 12-15 kPa very probable); 'No' leads right to follow-up and therapy as needed. Red box: CSPH? Below it, left to right: orange box (imaging signs: porto-systemic collaterals, spleen size), blue box (LSM above 20 kPa: CSPH very likely, about 90%), blue box (platelet count below 150 G/L), and a green box (if LSM below 20 kPa and platelets above 150 G/L, varices needing treatment are very unlikely, below 5%) leading to 'safely avoid endoscopic screening, repeat LSM and platelets every year'. The two blue boxes meet in 'Baveno criteria not met if any of the two is present', which leads to 'Perform screening endoscopy', with 'spleen stiffness as additional tool' beside it. The imaging signs lead to 'increased risk of clinical decompensation; HVPG measurement needed in order to exactly quantify the severity of PH'."
        caption: |
          الشكل ماشي على سؤالين في صناديق حمرا، من فوق لتحت:

          - **السؤال الأول: Advanced chronic liver disease?** الصندوق الأزرق تحته: **LSM >10 kPa probable، >12–15 very probable**، والبرتقاني على الشمال: **nodularity of liver surface** كأداة إضافية. لو لأ (**No**) ← السهم يمين: follow-up and therapy as needed.
          - **السؤال التاني: CSPH?** تحته أربع صناديق من الشمال لليمين: البرتقاني (**porto-systemic collaterals، spleen size**)، الأزرق (**LSM >20 kPa: CSPH very likely ~90%**)، الأزرق (**Platelet count <150 G/L**)، والأخضر على اليمين خالص (**LSM <20 و Plt >150: varices needing treatment <5%**).
          - **الأخضر** بينزل لـ **Safely avoid endoscopic screening** و **Repeat LSM + Plt every year**.
          - **الصندوقين الأزرق** بيتقابلوا في ==Baveno criteria not met if any of the two is present== ← **Perform screening endoscopy** (الأحمر تحت)، وجنبه **Spleen stiffness as additional tool**.
          - **البرتقاني** بينزل شمال لـ **increased risk of clinical decompensation**، و **hepatic venous pressure gradient (HVPG) measurement needed** علشان تقيس شدة الضغط بالظبط.

          الشكل ده خريطة الدرس كله: الـ ==LSM والصفايح مع بعض== بيقرروا المنظار، والـ imaging بيديك علامات الـ CSPH، والـ ==HVPG== هو اللي بيقيس.
      - kind: figure
        page: 30
        quote: "| 10 kPa | 15 kPa | 20 kPa | 25 kPa |\n|---|---|---|---|\n| No cACLD ← → cACLD; Very low risk LRE | +Plat >150: No CSPH; Low risk LRE | +Plat >150: No endoscopy | CSPH, LRE |"
        title: "قاعدة الخمسات في الكتاب"
        image: { file: hb/L02-rule-of-fives.webp, book: true }
        alt: "Book chart: a staircase of four coloured boxes rising from lower left to upper right: 10 kPa (green), 15 kPa (yellow), 20 kPa (orange) and 25 kPa (red). Beside the 10 kPa step: 'No cACLD' on the left and 'cACLD' on the right, with 'Very low risk LRE' at the lower left. Lines from the 15 and 20 kPa steps run left, labelled '+Plat >150 No CSPH' and '+Plat >150 No endoscopy'. At the top right, 'CSPH' and a large red arrow labelled LRE pointing up and right; a second arrow labelled LRE on the right; a green arrow pointing down and left labelled 'Low risk LRE'."
        caption: |
          الشكل سلّمة طالعة من تحت شمال لفوق يمين، كل درجة 5 kPa:

          - **10 kPa** (الأخضر، تحت): على شمالها **No cACLD** وعلى يمينها **cACLD**، وتحت شمال **Very low risk LRE**.
          - **15 kPa** (الأصفر): الخط الراجع للشمال مكتوب عليه **+Plat >150 No CSPH**.
          - **20 kPa** (البرتقاني): الخط الراجع للشمال **+Plat >150 No endoscopy**.
          - **25 kPa** (الأحمر، فوق): **CSPH**، والسهم الأحمر الكبير طالع لفوق يمين ومكتوب عليه **LRE**.

          الـ ==LRE== يعني liver-related events (زي الـ decompensation). الأسهم الحمرا الطالعة يمين بتقول إن الخطر بيزيد مع كل درجة، والخطوط الراجعة شمال بتقول «اطمّن» بس لو الصفايح ==أكتر من 150==. الرسمة اللي بعدها بترتّب نفس الكلام من فوق لتحت علشان يبقى أسهل في الحفظ.
