  - id: hem.L11.lesson5
    title: "عيلة الـ myeloma: الأقارب الغريبين"
    hook: "واحد في الدم، واحد مش بيفرز حاجة، واحد بيغمّق الجلد، وواحد قاعد في مناخيرك."
    minutes: 8
    pages: [186, 189]
    topics: [variants]
    goals:
      - "تعرف الـ variants: PCL، non-secretory، POEMS، plasmacytoma"
      - "تفرّق solitary bone من extramedullary"
      - "تعرف IgD و IgM و IgE myeloma"
    status: unverified
    steps:
      - kind: explain
        page: 186
        quote: "Variants of multiple myeloma Multiple myeloma (IgG, IgA, IgD, IgE, and free light chain) Smoldering multiple myeloma Plasma cell leukemia"
        title: "القايمة"
        text: |
          الـ ==variants==:

          - Multiple myeloma (IgG، IgA، IgD، IgE، free light chain)
          - Smoldering
          - **Plasma cell leukemia**
          - **Non-secretory**
          - **Osteosclerotic (POEMS)**
          - **Plasmacytoma**: solitary of bone و extramedullary
      - kind: explain
        page: 187
        quote: "More than 20% plasma cells in the peripheral blood."
        title: "Plasma cell leukemia"
        text: |
          - تعريف الكتاب: ==> 20% plasma cells== في الـ peripheral blood.
          - **Primary** (de novo) أو **secondary** (myeloma اتحول leukemic)، والـ secondary هو الـ terminal event في **1-2%** من الـ MM.
          - Aggressive: BM failure و organomegaly، والـ response للعلاج العادي ضعيف.
      - kind: update
        page: 187
        quote: "More than 20% plasma cells in the peripheral blood."
        text: "الـ IMWG (2021) غيّر التعريف لـ ≥ 5% circulating plasma cells. في الامتحان: > 20% زي الكتاب."
        ref: "IMWG consensus on plasma cell leukemia 2021"
      - kind: explain
        page: 187
        quote: "No M component in either the serum or the urine Identification of an M protein in the plasma cells by immunoperoxidase or immunofluorescence methods."
        title: "Non-secretory: بيعمل بس مش بيطلّع"
        text: |
          - **2%** من الـ myeloma.
          - ==No M component== لا في السيرم ولا في البول.
          - التشخيص: تلاقي الـ M protein **جوّه** الـ plasma cells بـ immunoperoxidase أو immunofluorescence.
          - الكلية أقل تأثرًا (منطقي: مفيش light chains نازلة تسد الـ tubules).
      - kind: mnemonic
        page: 187
        quote: "Polyneuropathy, organomegaly, endocrinopathy, M protein and skin changes (POEMS)."
        word: "POEMS"
        parts:
          - { key: "P", text: "Polyneuropathy" }
          - { key: "O", text: "Organomegaly" }
          - { key: "E", text: "Endocrinopathy (DM, gynaecomastia, impotence, amenorrhoea)" }
          - { key: "M", text: "M protein (low level)" }
          - { key: "S", text: "Skin changes (hyperpigmentation, hypertrichosis)" }
        hook: "الـ S هي Skin مش Skeletal، حتى لو الـ lesions osteosclerotic. ده الفخ اللي في سؤال الكتاب."
      - kind: explain
        page: 187
        quote: "BM contains < 5% plasma cells Low level paraprotein; hypercalcemia and renal insufficiency rarely occur."
        title: "POEMS عكس الـ myeloma"
        text: |
          - BM فيه ==< 5% plasma cells==، والـ paraprotein قليل.
          - علشان كده الـ hypercalcemia والـ renal insufficiency **نادرين**.
          - Features تانية: lymphadenopathy، DM، gynaecomastia و impotence عند الرجالة، amenorrhoea عند الستات.
          - التأكيد: **biopsy من الـ osteosclerotic lesion** يبيّن monoclonal plasma cells.
      - kind: check
        page: 187
        quote: "BM contains < 5% plasma cells Low level paraprotein; hypercalcemia and renal insufficiency rarely occur."
        question: "Which finding argues against POEMS?"
        options: ["Hypercalcaemia with renal failure", "Hyperpigmentation", "New diabetes mellitus", "Marrow plasma cells 3%"]
        answer: 0
        why:
          - "صح: مع paraprotein قليل، الـ hypercalcemia والـ renal insufficiency rarely occur."
          - "Skin changes هي الـ S في POEMS."
          - "Endocrinopathy هي الـ E."
          - "أقل من 5% ده بالظبط POEMS."
      - kind: table
        page: 188
        quote: "Collections of monoclonal plasma cells either in bone (solitary osseous plasmacytoma) or in soft tissue (extramedullary plasmacytoma)"
        title: "الـ plasmacytoma: نوعين"
        columns: ["", "Solitary bone", "Extramedullary"]
        rows:
          - ["Site", "Spine or long bones", "Nose, sinuses, nasopharynx, larynx, GI"]
          - ["M protein", "None", "None"]
          - ["Skeletal survey", "Normal (MRI spine/pelvis)", "Normal"]
          - ["End-organ damage", "Only the one bone lesion", "None, no bone lesions"]
        hide: [[0, 1], [0, 2]]
      - kind: aside
        tone: analogy
        page: 188
        quote: "The tumor is located in the upper respiratory tract especially in the nasal cavity and sinuses, nasopharynx, and larynx"
        text: "الـ extramedullary plasmacytoma زي ضيف ساكن في المناخير: nasal cavity و sinuses هما أشهر عنوان."
      - kind: sort
        page: 188
        quote: "~1% of cases of MM; younger mean age; high rate of Bence Jones proteinuria and associated higher frequency of acute and chronic renal failure"
        prompt: "مين ده؟"
        bins: ["IgD", "IgM", "IgE"]
        cards:
          - { text: "~1% of MM, younger", bin: 0 }
          - { text: "Lots of Bence Jones, renal failure", bin: 0 }
          - { text: "< 0.5% of MM, lytic lesions", bin: 1 }
          - { text: "Survival same as MM", bin: 1 }
          - { text: "Rarest form", bin: 2 }
          - { text: "Often plasma cell leukaemia", bin: 2 }
        why: "IgD: 1%، أصغر سنًا، Bence Jones كتير والكلية تقع. IgM: < 0.5%، lytic lesions، نفس الـ survival. IgE: الأندر، أصغر سنًا، PCL كتير."
      - kind: try
        items: [hem.L11.086, hem.L11.089, hem.L11.090, hem.L11.095, hem.L11.099]
    recap:
