    src: { page: 486, quote: "According to Yamabe et Al. 8.3% of patients with MGN had anti-HCV antibodies or detectable HCV RNA." }
    status: unverified
  - id: neph.L14.160
    kind: card
    topic: hcv
    front: How might HCV cause FSGS?
    back: By directly damaging podocytes, like HIV.
    src: { page: 486, quote: "HCV is suspected to damage podocytes directly. just like HIV-associated kidney injuries." }
    status: unverified
  - id: neph.L14.161
    kind: card
    topic: hcv
    front: Which receptor may let HCV directly infect kidney cells?
    back: CD81, the receptor used for B cells and hepatocytes; infected endothelium undergoes apoptosis, and podocytes and Bowman capsule cells are damaged.
    src: { page: 487, quote: "Kidney tissue may express CD81" }
    status: unverified
  - id: neph.L14.162
    kind: table
    topic: hcv
    title: KDIGO recommendations for HCV glomerular disease (p488)
    columns: [Situation, Recommendation]
    rows:
      - [Clinical glomerular disease, Kidney biopsy]
      - [Stable function and/or non-nephrotic proteinuria, DAA first]
      - ["Cryoglobulinemic flare, nephrotic syndrome or RPGN", "DAA + immunosuppression ± plasma exchange"]
      - [Active disease not responding to antivirals, "Immunosuppression; rituximab first-line"]
    blanks: [[1, 1], [2, 1], [3, 1]]
    src: { page: 488, quote: "We recommend that patients with HCV-associated glomerular disease be treated for HCV (1A)." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.163
    kind: card
    topic: hbv-hiv
    front: What is the most common glomerular lesion in HBV?
    back: Membranous nephropathy. Less often IgAN, MPGN, FSGS and crescentic GN; rarely MCD.
    src: { page: 489, quote: "The most common pattern of glomerular injury seen in HBV infection is MN." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.164
    kind: card
    topic: hbv-hiv
    front: How is replicative HBV infection with GN treated?
    back: "Nucleos(t)ide analogues as for the general HBV population (replicative = HBV DNA ≥2000 IU/mL)."
    src: { page: 489, quote: "receive treatment with nucleos(t)ide analogues as recommended for the general population by standard clinical practice guidelines for HBV infection" }
    status: unverified
  - id: neph.L14.165
    kind: card
    topic: hbv-hiv
    front: Which vasculitis is a classic extrahepatic manifestation of chronic HBV?
    back: Polyarteritis nodosa (Kussmaul-Maier disease); also type II and III cryoglobulinemia.
    src: { page: 489, quote: "systemic vasculitis (especially polyarteritis nodosa/Kussmaul-Maier disease)." }
    status: unverified
  - id: neph.L14.166
    kind: card
    topic: hbv-hiv
    front: When should antiretroviral therapy start in HIV with CKD or HIVAN?
    back: In all patients, regardless of CD4 count, with doses adjusted to kidney function; CKD is not a contraindication (START and TEMPRANO trials).
    src: { page: 491, quote: "The presence of CKD is not a contraindication for antiretroviral therapy (ART) of HIV infection." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.167
    kind: card
    topic: hbv-hiv
    front: Which diagnoses appear on kidney biopsy in HIV (Figure, p490)?
    back: Immune-complex GN, diabetic nephropathy, HIVAN, tenofovir toxicity, FSGS, global sclerosis, acute tubular injury and others; 17% had dual diagnoses.
    src: { page: 490, quote: "Dual diagnoses were present in 17% of cases" }
    status: unverified
  # ---------- p491-494: HRS ----------
  - id: neph.L14.168
    kind: card
    topic: hrs
    front: What is hepatorenal syndrome?
    back: A functional disease with marked renal vasoconstriction from vasoconstrictor systems compensating for splanchnic and systemic vasodilation; always with ascites.
    src: { page: 491, quote: "HRS is a functional disease characterised by marked vasoconstriction of the renal arteries" }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.169
    kind: enumerate
    topic: hrs
    prompt: New diagnostic criteria for HRS-AKI (Box 1, p491)?
    points:
      - "Cirrhosis, acute liver failure or acute-on-chronic liver failure"
      - "Creatinine rise ≥0.3 mg/dL in 48 h or ≥50% from baseline, and/or urine ≤0.5 mL/kg/h for ≥6 h"
      - "No response after 2 days of diuretic withdrawal and albumin 1 g/kg/day (max 100 g)"
      - Absence of shock
      - No current or recent nephrotoxic drugs
      - "No parenchymal disease (proteinuria >500 mg/day, >50 RBC/HPF, abnormal ultrasound)"
    pass: 5
    src: { page: 491, quote: "New diagnostic criteria for HRS-AKI." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.170
    kind: card
    topic: hrs
    front: What FENa suggests renal vasoconstriction in HRS-AKI?
    back: FENa <0.2%, with <0.1% highly predictive.
    src: { page: 491, quote: "Suggestion of renal vasoconstriction with FENa of <0.2% (with levels <0.1% being highly predictive)" }
    status: unverified
    tags: [numbers]
  - id: neph.L14.171
    kind: table
    topic: hrs
    title: Old and new hepatorenal syndrome terms (p492)
    columns: [Old, New, Criteria]
    rows:
      - [HRS-1, HRS-AKI, "Creatinine ↑ ≥0.3 mg/dL in 48 h or ≥50% in 3 months"]
      - [HRS-2, "HRS-NAKI: HRS-AKD", "Creatinine ↑ <50% in 3 months, eGFR <60"]
      - [HRS-2, "HRS-NAKI: HRS-CKD", "eGFR <60 for ≥3 months, no other cause"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 492, quote: "HEPATORENAL SYNDROME" }
    status: unverified
  - id: neph.L14.172
    kind: enumerate
    topic: hrs
    prompt: General measures when AKI appears in cirrhosis?
    points:
      - Stop diuretics and beta-blockers
      - Stop vasodilators, NSAIDs and other nephrotoxic drugs
      - Replace volume according to the cause and severity of losses
    pass: 3
    src: { page: 492, quote: "In patients taking diuretics and/or b-blockers these should be discontinued." }
    status: unverified
  - id: neph.L14.173
    kind: card
    topic: hrs
    front: Give the terlipressin doses in HRS.
    back: "IV boluses 0.5-1 mg every 4-6 h up to 2 mg every 4 h, or continuous infusion 2 mg/day up to 12 mg/day; always with albumin."
    src: { page: 492, quote: "starting from 0.5-1 mg every 4-6 h to a maximum dose of 2 mg every 4 h" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L14.174
    kind: card
    topic: hrs
    front: What albumin dose is used with vasoconstrictors in HRS, and why does albumin help?
    back: 20-40 g/day guided by CVP; it maintains cardiac output and has antioxidant and anti-inflammatory (non-oncotic) actions.
    src: { page: 493, quote: "To date, albumin has been given at a dose of 20-40 g/day" }
    status: unverified
    tags: [numbers]
  - id: neph.L14.175
    kind: card
    topic: hrs
    front: Compare terlipressin with midodrine-octreotide and noradrenaline in HRS.
    back: Terlipressin + albumin beat midodrine + octreotide + albumin, and beat noradrenaline in ACLF. Noradrenaline is cheaper but needs a central line and ICU.
    src: { page: 493, quote: "terlipressin was shown to be more effective than noradrenaline in the treatment of HRS in patients with ACLF" }
    status: unverified
  - id: neph.L14.176
    kind: card
    topic: hrs
    front: When do you stop vasoconstrictors plus albumin in HRS?
    back: Continue until creatinine is within 0.3 mg/dL of baseline; stop by 14 days if there is no or only partial response.
    src: { page: 493, quote: "In patients with no response or partial response, the treatment should be discontinued within 14 days." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.177
    kind: card
    topic: hrs
    front: What is the optimal treatment of HRS-AKI?
    back: Liver transplantation, whatever the response to drugs. SLK versus LT alone depends on AKI duration, dialysis need and CKD.
    src: { page: 494, quote: "LT represents the optimal treatment for patients with HRS-AKI regardless of their response to phar-macological treatment." }
    status: unverified
    tags: [high-yield]
  # ---------- p494-502: dysproteinemia ----------
  - id: neph.L14.178
    kind: card
    topic: dysprot
    front: What are dysproteinemic kidney diseases?
    back: Kidney damage from pathogenic monoclonal immunoglobulins or light chains made by B-cell or plasma-cell clones.
    src: { page: 494, quote: "Dysproteinemic kidney diseases occur when B or plasma cell clones produce pathogenic monoclonal immunoglobulins or light chains that cause kidney damage." }
    status: unverified
  - id: neph.L14.179
    kind: card
    topic: dysprot
    front: MGUS versus MGRS?
    back: "MGUS: monoclonal gammopathy without end-organ damage. MGRS: monoclonal gammopathy causing kidney damage without overt malignancy."
    src: { page: 495, quote: "When monoclonal gammopathy-related kidney damage occurs in the absence of overt malignancy, the hematologic disorder is categorized as monoclonal gammopathy of renal significance" }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.180
    kind: card
    topic: dysprot
    front: What is the treatment goal in dysproteinemic kidney disease?
    back: A hematologic response (fall or loss of the monoclonal protein) by eradicating the clone; organ response depends on it.
    src: { page: 495, quote: "the goal of treatment is to achieve a hematologic response" }
    status: unverified
  - id: neph.L14.181
    kind: cloze
    topic: dysprot
    text: "Myeloma incidence is about {{c1::11}} per 100,000/year; {{c2::20-30%}} present with reduced GFR at diagnosis."
    src: { page: 495, quote: "Multiple myeloma is one of the most common hematologic malignancies with an annual incidence of about 11 per 100,000 patients." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.182
    kind: card
    topic: dysprot
    front: What is the commonest cause of reduced GFR in multiple myeloma, and its mechanism?
    back: Light chain cast nephropathy; free light chains bind Tamm-Horsfall protein (uromodulin) in the distal nephron, obstruct tubules and cause giant-cell reaction and interstitial inflammation.
    src: { page: 496, quote: "The most common cause of decreased GFR in patients with multiple myeloma is light chain cast nephropathy." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.183
    kind: card
    topic: dysprot
    front: How do free light chains injure proximal tubule cells?
    back: Excess endocytosis via cubilin-megalin triggers NF-κB/MAPK, inflammatory and fibrotic cytokines (IL-6, IL-8, CCL2, TGF-β1).
    src: { page: 497, quote: "The excessive endocytosis of FLCs by the cubilin-megalin complex expressed on PTCs can trigger apoptotic, proinflammatory and fibrotic pathways." }
    status: unverified
  - id: neph.L14.184
    kind: table
    topic: dysprot
    title: Where light chains injure the nephron (Figure, p499)
    columns: [Lesion, Site and finding]
    rows:
      - [AL amyloidosis, FLC fibrils within the glomerulus]
      - [Light chain deposition disease, FLC deposits along basement membranes]
      - [Fanconi syndrome, FLC crystals within proximal tubular cells]
      - [Cast nephropathy (myeloma kidney), Waxy FLC casts in the distal tubule lumen]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 499, quote: "Cast Nephropathy (also known as Myeloma Kidney)" }
    status: unverified
  - id: neph.L14.185
    kind: table
    topic: dysprot
    title: Dysproteinemia-associated kidney diseases (Table 2, p498-499)
    columns: [Diagnosis, Presentation, Mechanism]
    rows:
      - [Light chain cast nephropathy, "AKI, nonalbumin proteinuria", "Light chain binds uromodulin, distal obstruction"]
      - [Ig amyloidosis (AL/AH/AHL), "Proteinuria, nephrotic syndrome", "Amyloid fibrils in extracellular tissue"]
      - ["MIDD (LCDD, HCDD)", "Decreased function, proteinuria", "Deposition of pathogenic light or heavy chain"]
      - [Light chain proximal tubulopathy, "Fanconi syndrome", "Vκ1 light chains resist proteolysis"]
      - [Monoclonal gammopathy C3 glomerulopathy, "Proteinuria, decreased function", "Alternative pathway activation"]
    blanks: [[0, 2], [1, 1], [3, 1], [4, 2]]
    src: { page: 498, quote: "Dysproteinemia-Associated Kidney Diseases" }
    status: unverified
  - id: neph.L14.186
    kind: card
    topic: dysprot
    front: Why are diuretics handled differently in AL amyloidosis and cast nephropathy?
    back: Amyloidosis usually causes nephrotic syndrome needing diuretics; in cast nephropathy diuretics are unnecessary and may be contraindicated.
    src: { page: 500, quote: "while diuretic is not necessary and is potentially contraindicated in light chain cast nephropathy." }
    status: unverified
  - id: neph.L14.187
    kind: card
    topic: dysprot
    front: What decides treatment of MGRS-type kidney disease now?
    back: The nature of the clone producing the M protein, not the renal histology; RAS blockade and traditional immunosuppression rarely prevent ESRD.
    src: { page: 501, quote: "Treatment is no longer decided by the renal histology but rather, is decided by the nature of the clone producing the M protein." }
    status: unverified
  - id: neph.L14.188
    kind: card
    topic: dysprot
    front: Which drug is most important in monoclonal gammopathy glomerular disease, and with what results?
    back: Bortezomib; with cyclophosphamide and dexamethasone, response up to 94%, VGPR 66-71%. Also most effective in MIDD.
    src: { page: 501, quote: "In combination with cyclophosphamide and dexamethasone, bortezomib produced response rates as high as 94%" }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.189
    kind: card
    topic: dysprot
    front: How is a very good partial response (VGPR) measured?
    back: "Involved minus uninvolved serum FLC (dFLC) <40 mg/L, or >90% fall in dFLC; it predicts overall and renal survival."
    src: { page: 501, quote: "the involved minus the uninvolved sFLC of <40 mg/L or >90% reduction of difference" }
    status: unverified
    tags: [numbers]
  - id: neph.L14.190
    kind: card
    topic: dysprot
    front: How do immunomodulatory drugs compare, and what improves response?
    back: Thalidomide and lenalidomide are less effective at VGPR; autologous stem cell transplant improves hematologic response.
    src: { page: 502, quote: "the hematologic response can be improved by the addition of autologous stem cell transplant." }
    status: unverified
