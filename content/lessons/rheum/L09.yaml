          وخد بالك من الفخاخ اللي في اختيارات السؤال 10: الـ **anti-SRP** مش بتاع الجلد (ده IMNM)، والـ **anti-HMGCR** مش في الـ DM بس (ده IMNM)، والـ **Mi-2** مش بتاع الـ ILD الشديدة (ده MDA5).
