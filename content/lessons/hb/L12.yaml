      - kind: explain
        page: 201
        title: "الأعراض بالأرقام"
        text: |
          - الـ **lung disease** شبه **COPD**، وبتبدأ عادة بين **30 و 50 سنة**.
          - حوالي **10% of infants** و **15% of adults** عندهم Alpha-1 بيعملوا **liver disease**.
      - kind: reveal
        page: 202
        prompt: "مريض عنده 38 سنة، عمره ما دخّن، وعنده emphysema في الـ **lower lungs**. ليه ده يخلّيك تفكر في AATD بالذات؟"
        answer: |
          الـ emphysema العادي بتاع التدخين بيبدأ متأخر وغالبًا في الـ **upper lobes**. أما الـ AATD فالكتاب بيقول الـ imaging بيدوّر على emphysema **especially in the lower lungs**، والأعراض بتبدأ **30-50**.

          يعني: **صغير + basal emphysema** (ومن غير تدخين كمان) = اطلب **serum AAT**. (المقارنة بالـ upper lobes تفسير مقبول.)
      - kind: match
        page: 201
        prompt: "وصّل كل فحص باللي بيقوله:"
        pairs:
          - ["Serum AAT level", "Low level suggests deficiency"]
          - ["Phenotyping or genotyping", "Specific mutation (ZZ, SZ): severity and inheritance"]
          - ["Pulmonary function tests", "COPD or emphysema present?"]
          - ["Chest X-ray or CT", "Emphysema, especially in the lower lungs"]
          - ["Liver ultrasound or FibroScan", "Liver health"]
        why: "الـ serum level بيقول **فيه نقص**، والـ phenotype/genotype بيقول **قد إيه وإزاي اتورث**."
      - kind: explain
        page: 202
        title: "العلاج"
        text: |
          **Augmentation therapy:** **IV infusions of AAT protein** لمرضى الرئة، بترفع الـ AAT في الدم و**بتبطّأ lung damage**. بس **not effective for liver disease** لأن **AAT cannot be targeted to the liver**.

          **Transplant:**
          - **Lung transplant** للـ advanced lung disease.
          - **Liver transplant can be curative** لأنه بيدي **source of healthy AAT production**.

          **Medications:** **bronchodilators و inhaled corticosteroids** للـ COPD، و **antibiotics** للـ respiratory infections.
      - kind: reveal
        page: 202
        prompt: "طب ليه الـ augmentation مش بيفيد الكبد، والزرع بيشفيه؟"
        answer: |
          **الكتاب:** الـ AAT اللي بنديه في الوريد **cannot be targeted to the liver**، والكبد الجديد **source of healthy AAT production**.

          **تفسير مقبول (مش من الكتاب):** مشكلة الكبد في الأنواع زي **Z** إن البروتين المعيوب **بيتلخبط ويتحبس جوه الـ hepatocyte** فبيأذيه. إنك تدّي AAT من برّه مش بيشيل اللي متحبس جوه. الزرع بيغيّر الخلايا نفسها.
      - kind: aside
        tone: analogy
        page: 202
        text: |
          الـ **augmentation** زي إنك **تشتري مياه معدنية** لأن حنفية البيت مقطوعة: الرئة (اللي بتشرب) مبسوطة، بس الماسورة المسدودة جوه الحيطة (الكبد) زي ما هي.

          **زرع الكبد** = تغيّر **الماسورة والمحطة** مرة واحدة: الكبد يرتاح، والرئة تاخد AAT سليم.
      - kind: check
        page: 202
        question: "An AATD patient has emphysema and cirrhosis. Which therapy slows the lung damage but does NOT help the liver?"
