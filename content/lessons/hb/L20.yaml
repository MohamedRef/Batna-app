  - id: hb.L20.lesson2
    title: "العيان ياكل إيه وإمتى؟"
    hook: "الكبد المتليّف بيجوّع صاحبه بالليل. السر في سندوتش قبل النوم."
    minutes: 9
    pages: [407, 408]
    topics: [requirements, practical-advice]
    goals:
      - "تشرح يعني إيه accelerated starvation"
      - "تحفظ الـ 35 kcal والـ 1.2–1.5 g وتحسبهم"
      - "تكتب نصايح الأكل للعيان (سؤال الامتحان) من غير ما تنسى حاجة"
    status: unverified
    steps:
      - kind: explain
        page: 407
        title: "Accelerated starvation"
        quote: "Cirrhosis is a state of accelerated starvation characterized by a rapid post-absorptive physiology and reduced respiratory quotient"
        text: |
          الكتاب بيوصف الـ cirrhosis بكلمتين:

          - ==Accelerated starvation==: العيان بيدخل في مود الصيام بسرعة بعد الأكل (**rapid post-absorptive physiology**).
          - **Reduced respiratory quotient**: بيحرق دهون بدري بدل السكر.

          وده بيعمل سلسلة:
          - الـ **protein synthesis** بيقل.
          - الـ ==gluconeogenesis from amino acids== بيزيد.
          - الأحماض الأمينية دي جاية منين؟ من **proteolysis** للعضل.
          - والنتيجة: **sarcopenia**.

          يعني كل ساعة صيام زيادة عند الـ cirrhotic بتتدفع من عضله. وده المفتاح لباقي الدرس: الأرقام العالية، وتقسيم الوجبات، وسناك آخر الليل.
      - kind: aside
        tone: analogy
        page: 407
        text: |
          الكبد السليم زي تلاجة مليانة (==glycogen==): لو فاتتك وجبة، تفتحها وتاكل.

          الكبد المتليّف تلاجته صغيرة وفاضية. والكتاب بيقولها صريحة في صفحة 416: liver glycogen is depleted.

          فأول ما يجوع شوية، الجسم يبتدي يكسّر العفش (العضل) علشان يعمل sugar.
      - kind: table
        page: 407
        title: "الأرقام الأساسية"
        columns: ["", "Target"]
        rows:
          - ["Energy", "≥ 35 kcal/kg actual BW/day (non-obese)"]
          - ["Protein", "≥ 1.2–1.5 g/kg actual BW/day"]
          - ["Body weight to use", "Actual BW corrected for ascites"]
          - ["Malnourished + decompensated", "Add late-evening ONS and breakfast"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: check
        page: 407
        question: "A man with decompensated cirrhosis has a dry weight of **70 kg**. What daily protein intake should he get?"
        options:
          - "84–105 g"
          - "42–56 g"
          - "60–80 g, cut down to reduce ammonia"
          - "140–175 g"
        answer: 0
        why:
          - "صح: protein = 70 × 1.2–1.5 = 84–105 g/day."
          - "ده 0.6–0.8 g/kg: أقل من الحد الأدنى، وهيكسّر عضله."
          - "ده **protein restriction**، والمحاضرة دي بتقول **not advisable**."
          - "ده 2–2.5 g/kg: أعلى من التارجت بتاع العيان المستقر. والـ 2.0 g/kg ideal BW بييجي بس في الـ obese بعد الـ LT."
      - kind: figure
        page: 407
        title: "ساعة الأكل: 3 وجبات + 3 سناكس"
        alt: "A 24-hour dial with midnight at the top. Six meals are marked: breakfast in the morning, a mid-morning snack, lunch, a mid-afternoon snack, dinner, and a starred late-evening snack. A thick red arc runs from the late-evening snack through midnight to breakfast, marking the overnight fast, which the late snack keeps short."
