  - id: hb.L01.lesson7
    title: "القلب والرئة في الـ cirrhosis"
    hook: "مريض مرتاح وهو نايم وبيتخنق لما يقعد: الـ hepatopulmonary syndrome وأخواتها."
    minutes: 9
    pages: [19, 22]
    topics: [cardiopulmonary]
    goals:
      - "تشرح الـ hyperdynamic circulation وليه هي أساس مضاعفات كتير"
      - "تفرق بين portopulmonary hypertension و hepatopulmonary syndrome"
      - "تكتب الـ HPS triad و platypnea-orthodeoxia بالأرقام"
    status: unverified
    steps:
      - kind: explain
        page: 19
        title: "Hyperdynamic circulation"
        text: |
          في مريض الـ cirrhosis و PH:
          - **↑ cardiac output**، **hypervolemia** (Na و water retention)، **rapid heart rate**
          - **low arterial blood pressure**، **bounding pulse**، و **systolic murmur**

          السبب الأساسي: **systemic vasodilatation**، لأن الـ **PSS** بتسيب الـ **endogenous vasodilators** تعدّي من غير ما الكبد يكسرها.

          وهي **the pathogenetic basis** لـ **ascites**، **HRS**، و **hepatopulmonary syndrome**.
      - kind: aside
        tone: joke
        page: 19
        text: |
          الأوعية مفتوحة على الآخر، فالقلب شغال **أوفر تايم** علشان يملاها: cardiac output عالي والنبض بيخبط. ومع ذلك الضغط واطي. زي مرتب بيتصرف كله ولسه الشهر ما خلصش. 😅
      - kind: explain
        page: 19
        title: "Cirrhotic cardiomyopathy"
        text: |
          **CCM** = **cardiac dysfunction** في مريض cirrhosis **in the absence of known cardiac disease**.

          - غالبًا **asymptomatic at rest**.
          - في الـ **stress** (hemodynamic changes سريعة) بتطلع صورة **congestive heart failure**.
          - التشخيص: **echocardiography** فيها **diastolic and/or systolic dysfunction**.
      - kind: reveal
        page: 20
        prompt: "القلب ضعيف فعلًا... طب ليه الـ CCM ما بتبانش وهو قاعد مرتاح؟"
        answer: |
          لأن الـ **systemic vasodilation reduces afterload** وده **compensates for abnormal cardiac function**. القلب شايل حمل خفيف فمش باين ضعفه، لحد ما ييجي stress.
      - kind: figure
        page: 20
        title: "اتنين عكس بعض في الرئة"
        alt: "Two lung sketches. Portopulmonary hypertension: narrowed pulmonary arteries with raised pulmonary vascular resistance from splanchnic mediators reaching the lungs through shunts. Hepatopulmonary syndrome: dilated vessels and arteriovenous shunts at the lung bases from raised nitric oxide, worse when upright."
        caption: "الـ **PoPH**: الأوعية **بتضيق** (↑ PVR). الـ **HPS**: الأوعية **بتوسع** تحت في القواعد، فالأكسجين ما يلحقش يدخل الدم."
        svg: |
          <svg viewBox="0 0 330 560" xmlns="http://www.w3.org/2000/svg">
