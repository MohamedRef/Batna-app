  - id: rheum.L02.lesson8
    title: "الـ tophi والكلى: لما البلورة تقعد"
    hook: "النوبة بتروح وبتيجي. الـ tophus والحصوة بيفضلوا، ومنهم اللي ممكن يوقّف الكلى في يومين."
    minutes: 8
    pages: [34, 35]
    topics: [chronic]
    goals:
      - "توصف الـ tophi وتعرف ليه بيتوزعوا كده"
      - "تفرّق الـ stones عن الـ acute uric acid nephropathy عن الـ chronic urate nephropathy"
      - "تعرف مين محتاج allopurinol قبل الكيماوي، وليه"
    status: unverified
    steps:
      - kind: explain
        page: 34
        quote: "Marked asymmetry, both locally and between sides is characteristic."
        title: "الـ tophi"
        text: |
          الـ ==tophi==: ترسبات كبيرة firm nodular على الـ **extensor surfaces** (صوابع، إيد، elbow، forearm)، والـ **Achilles** و **helix of the ear**.

          - **Asymmetry** واضح: ده المميز (عكس الـ rheumatoid arthritis (RA)).
          - تحت الجلد ممكن تبان **chalky**، ولو اتسابت تتفتح وتطلّع **white gritty material**.
          - المفاصل المتضررة: first MTP، midfoot، finger joints، wrists.

          التفسير المقبول (مش في الكتاب): ليه الأماكن دي بالذات؟ الـ urate بيذوب أقل في **البرد**، والأطراف وصوان الودن أبرد حتة في الجسم، وكمان الأماكن اللي عليها ضغط واحتكاك (الكوع، الـ Achilles). والـ asymmetry سببه إن الـ tophi بتتكون في المكان اللي حصل فيه ترسيب، مش بتوزيع مناعي متماثل زي الـ RA. يعني تاخد الـ tophus كدليل إن الـ urate بقاله سنين عالي.
      - kind: explain
        page: 34
        quote: "If left untreated, tophi enlarge into gross knobbly swellings (Nodules)."
        title: "ليه الـ tophi في الأماكن دي؟"
        text: |
          الكتاب بيحط الـ tophi في **أماكن الـ nodules المعتادة**: الـ extensor surfaces للصوابع والإيد والكوع والـ forearm، والـ **Achilles** و ==helix of the ear==.

          التفسير المقبول (مش في الكتاب): دي أماكن **باردة** (بعيدة عن قلب الجسم) وأماكن **احتكاك وضغط**، والـ urate بيترسب أسهل في البرد. ودان الواحد أبرد حتة فيه تقريبًا، عشان كده الـ tophus في الـ helix علامة كلاسيكية.

          ولو اتسابت: بتكبر لـ **knobbly swellings**، وممكن تتقرّح وتطلّع **مادة بيضا gritty** (دي البلورات نفسها) ومعاها التهاب و pus.
      - kind: figure
        page: 34
        quote: "Achilles tendon and helix of the ear."
        title: "خريطة الـ tophi"
        alt: "A simple body outline. Marked spots: helix of the ear, extensor surface of the elbow and forearm, back of the fingers and hand, Achilles tendon, and the first metatarsophalangeal joint. The two sides are marked unevenly to show asymmetry."
