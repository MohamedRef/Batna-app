schema: batna.lesson/v1
lecture: endo.L07
lessons:
  # ------------------------------------------------------------------
  - id: endo.L07.lesson1
    title: "الـ apoplexy: صداع زي الرعد في الغدة النخامية"
    hook: "أول قاعدة في طوارئ الغدد: الـ cortisol قبل أي حاجة تانية."
    minutes: 8
    pages: [111, 113]
    topics: [overview, apoplexy]
    goals:
      - "تعرف السبع طوارئ"
      - "تشخّص الـ pituitary apoplexy وتفرّقه عن الـ SAH"
      - "ترتّب العلاج: hydrocortisone الأول، والـ thyroxine بعده"
    status: unverified
    steps:
      - kind: explain
        page: 111
        quote: "Endocrine Emergencies include"
        title: "السبع طوارئ"
        text: |
          الكتاب بيعدّ سبع ==endocrine emergencies==:

          1. Pituitary apoplexy
          2. Myxedema coma
          3. Thyroid storm
          4. Acute hypocalcemia
          5. Acute hypercalcemia
          6. Acute adrenal insufficiency
          7. Pheochromocytoma crisis
      - kind: explain
        page: 111
        quote: "cortisol deficiency is the most serious amongst all hormone deficiencies because it can cause life-threatening hypotension."
        title: "يعني إيه apoplexy؟"
        text: |
          ==Haemorrhage into a pituitary adenoma==. نادر، بس اتوصف في **0.6% لـ 25%** من الـ treated adenomas.

          النتيجة **hypopituitarism**، وأخطر نقص فيهم هو ==cortisol== لأنه بيعمل **life-threatening hypotension**.

          مرتبط بـ trauma، hypertension، cardiac surgery، dynamic pituitary function tests، وحاجات تانية كتير.
      - kind: mnemonic
        page: 112
        quote: "The usual triad for apoplexy is: – Sudden severe headache. – Diplopia. – Features of hypopituitarism."
        word: "HDH"
        hook: "التلاتية: \"Head, Double, Hormones\"."
        parts:
          - { key: "H", text: "Sudden severe Headache" }
          - { key: "D", text: "Diplopia" }
          - { key: "H", text: "Features of Hypopituitarism" }
      - kind: explain
        page: 112
        quote: "Altered conscious level, confusion and even coma."
        title: "الصورة الكاملة"
        text: |
          ممكن تبقى خفيفة، وممكن **adrenal crisis**، coma، أو sudden death. بتتطور على ساعات أو أيام:

          - Sudden severe headache.
          - **Visual field defects** و visual loss.
          - Nausea و vomiting.
          - Focal neurological deficit.
          - Altered consciousness لحد الـ coma.
          - ==Shock==.
      - kind: check
        page: 112
        quote: "This will require imaging of the brain and should identify a pituitary problem."
        question: "Sudden severe headache with vomiting and confusion. Which two diagnoses must be separated from apoplexy?"
        options: ["Subarachnoid haemorrhage and bacterial meningitis", "Migraine and tension headache", "Hypoglycaemia and stroke", "Sinusitis and glaucoma"]
        answer: 0
        why:
          - "صح: والـ brain imaging هو اللي بيفرّق وبيبيّن الـ pituitary."
          - "مش الـ differential اللي في الكتاب، ومش بالخطورة دي."
          - "مش المذكورين في الكتاب."
          - "مش المذكورين في الكتاب."
      - kind: figure
        page: 113
        quote: "Treatment of cardiovascular collapse by giving hydrocortisone 100 mg iv every six hours in normal saline."
        title: "الخطوات"
        alt: "A vertical flowchart: suspect apoplexy; vital signs and glucose every 1 to 2 hours; hydrocortisone 100 mg IV six-hourly in saline; brain imaging; thyroxine only after steroids; surgery if visual deficit, conservative if none or resolving; full endocrine work-up and lifelong follow-up."
        caption: "الـ steroid الأول دايمًا. الـ thyroxine قبله بيعلّي الـ metabolic rate والقلب مش مستحمل."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="E07a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="40" y="6" width="250" height="32" rx="6" class="fg-box"/>
            <text x="52" y="27" class="t-sm t-b">Vitals + glucose every 1-2 h</text>
            <path d="M165 38v12" class="fg-arrow" marker-end="url(#E07a)"/>
            <rect x="40" y="52" width="250" height="44" rx="6" class="fg-bad"/>
            <text x="52" y="70" class="t-sm t-b">Hydrocortisone 100 mg IV</text>
            <text x="52" y="88" class="t-sm">6-hourly in normal saline</text>
            <path d="M165 96v12" class="fg-arrow" marker-end="url(#E07a)"/>
            <rect x="40" y="110" width="250" height="32" rx="6" class="fg-box"/>
            <text x="52" y="131" class="t-sm">Brain imaging (vs SAH, meningitis)</text>
            <path d="M165 142v12" class="fg-arrow" marker-end="url(#E07a)"/>
            <rect x="40" y="156" width="250" height="32" rx="6" class="fg-acc"/>
            <text x="52" y="177" class="t-sm t-b">Thyroxine only after steroids</text>
            <path d="M165 188v12" class="fg-arrow" marker-end="url(#E07a)"/>
            <rect x="5" y="202" width="155" height="56" rx="6" class="fg-good"/>
            <text x="12" y="222" class="t-sm t-b">Visual deficit</text>
            <text x="12" y="242" class="t-sm">early TSS surgery</text>
            <rect x="170" y="202" width="155" height="56" rx="6" class="fg-thin"/>
            <text x="177" y="222" class="t-sm t-b">No / resolving</text>
            <text x="177" y="242" class="t-sm">conservative</text>
            <rect x="40" y="272" width="250" height="44" rx="6" class="fg-box"/>
            <text x="52" y="290" class="t-sm">Full endocrine work-up</text>
            <text x="52" y="308" class="t-sm">lifelong follow-up</text>
          </svg>
      - kind: reveal
        page: 113
        quote: "it must be given after the administration of glucorticoids, to avoid exacerbation of the cardiovascular collapse"
        prompt: "ليه الـ thyroxine لازم ييجي بعد الـ glucocorticoid؟"
        answer: "الـ thyroxine بيرفع الـ **metabolic rate** فالجسم بيستهلك cortisol أكتر. لو مفيش cortisol أصلًا، الـ **cardiovascular collapse** هيزيد. نفس القاعدة في أي hypopituitarism."
      - kind: aside
        tone: joke
        page: 113
        quote: "it must be given after the administration of glucorticoids, to avoid exacerbation of the cardiovascular collapse"
        text: "الـ thyroxine من غير steroid زي ما تدوس بنزين في عربية مفيهاش زيت: هتتحرك ثانيتين وبعدين المكنة تقف وييجي **cardiovascular collapse**. **Glucocorticoids first**."
      - kind: try
        items: [endo.L07.001, endo.L07.003, endo.L07.005, endo.L07.009, endo.L07.012]
    recap:
      - "سبع طوارئ: apoplexy، myxedema coma، storm، hypo/hypercalcaemia، adrenal crisis، pheo crisis."
      - "Apoplexy = نزيف في adenoma؛ أخطر حاجة نقص الـ cortisol."
      - "Triad: headache، diplopia، hypopituitarism. الـ DD: SAH و meningitis."
      - "Hydrocortisone 100 mg IV كل 6 ساعات؛ thyroxine بعده بس."
      - "TSS بدري لو فيه visual deficit."
    practice: [endo.L07.001, endo.L07.002, endo.L07.003, endo.L07.004, endo.L07.005, endo.L07.006, endo.L07.007, endo.L07.008, endo.L07.009, endo.L07.010, endo.L07.011, endo.L07.012, endo.L07.013, endo.L07.100]
