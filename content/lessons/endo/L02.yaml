          - ["Gestational hypertension", "Fetal and perinatal death"]
          - ["Increased CS, anemia", "Brain development disorders, low IQ"]
          - ["Placental abruption", "Respiratory distress, low birth weight"]
          - ["Preterm labour, PPH", "Cretinism"]
        hide: [[2, 1], [4, 1]]
      - kind: check
        page: 28
        quote: "Clinicians must recognize the need to increase thyroxin replacement therapy in pregnant women."
        question: "A woman on L-T4 becomes pregnant. Her dose usually:"
        options: ["Needs increasing, by an amount that depends on the cause", "Stays the same", "Should be stopped", "Is halved"]
        answer: 0
        why:
