          </svg>
      - kind: order
        page: 139
        quote: "Stabilize myocardial cell membrane"
        prompt: "رتّب العلاج الطارئ لـ K 7.5 مع peaked T waves:"
        steps:
          - "Calcium gluconate IV"
          - "Insulin + dextrose, nebulized albuterol"
          - "Remove K (dialysis, diuretics or bicarbonate)"
          - "Consider K binders"
        why: "القلب الأول (stabilize the myocardial membrane)، بعدين نخبّي الـ K جوّه الخلايا (مؤقت)، بعدين نطلّعه فعلًا."
      - kind: explain
        page: 139
        title: "الحالات اللي مش طارئة"
        quote: "Exclude pseudo-hyperkalemia"
        text: |
          1. **استبعد الـ pseudohyperkalemia** الأول.
          2. Dietary counseling، و **ابعد عن salt substitutes** (فيها KCl).
          3. وقّف الأدوية اللي بتمنع إفراز الـ K، واسأل عن **NSAIDs والأعشاب**.
          4. Diuretics فعّالة (**loop** لو eGFR تحت 30).
          5. **Oral NaHCO3** للـ metabolic acidosis.
          6. فكّر في الـ **K binders** (بتساعد تكمّل جرعات الـ RAASi).
