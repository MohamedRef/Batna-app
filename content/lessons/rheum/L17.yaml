            <text x="180" y="146" class="t-sm t-mut">Enthesitis:</text>
            <text x="180" y="166" class="t-sm t-mut">no injection</text>
            <text x="180" y="186" class="t-sm t-mut">near Achilles</text>
          </svg>
      - kind: explain
        page: 290
        title: "الـ NSAIDs: أول سلاح"
        quote: "Breathing & Swimming and hydrotherapy. b- Drugs NSAIDs NSAIDs are to be given in full anti-inflammatory doses (trial of 2 NSAIDs for 4 weeks)."
        text: |
          - ==Full anti-inflammatory dose==، وجرّب **2 non-steroidal anti-inflammatory drugs (NSAIDs) على 4 أسابيع**.
          - مفيش non-steroidal anti-inflammatory drugs (NSAID) أحسن من التاني.
          - الاستخدام ==المستمر== شكله بيقلّل الـ radiographic progression.
          - الأعراض الجانبية: Gastrointestinal tract (GIT)، الكلى، الـ central nervous system (CNS).

          يعني الـ NSAIDs هنا علاج بجد مش مسكّن، والسبب في الخطوة الجاية.
      - kind: reveal
        page: 290
        quote: "Continuous treatment with NSAIDs appears to reduce radiographic progression."
        prompt: "في الـ RA الـ NSAIDs مسكّن وبس. ليه في الـ AS هي أول سلاح، والكتاب بيقول بتقلّل الـ progression؟"
        answer: |
          الكتاب: ==Continuous treatment with NSAIDs appears to reduce radiographic progression==، و **good response to NSAIDs** نفسها من الـ SpA features في الـ ASAS (ص 288).

          التفسير المقبول (مش في الكتاب): الـ **PGE2** ليه دور في تكوين العضم الجديد عند الـ enthesis. الـ NSAIDs بتوقف الـ prostaglandins، فبتقلّل الالتهاب **والعضم الجديد** اللي بيعمل الـ syndesmophytes. في الـ RA المشكلة pannus بياكل، والـ NSAIDs ما بتوقفوش.

          وعلشان كده الجرعة لازم ==full anti-inflammatory== مش جرعة مسكّن، وتجرّب **2 NSAIDs** قبل ما تحكم إنها فشلت.
