    blanks: [[0, 1], [0, 3], [2, 2], [3, 3]]
    src: { page: 475, quote: "Table 2: Genetic Abnormalities and Clinical Outcome in Patients with Atypical Hemolytic-Uremic Syndrome.\n| Gene | Protein Affected | Main Effect | Frequency (%) | Response to Short-Term Plasma Therapy† | Long-Term Outcome‡ | Outcome of Kidney Transplantation |\n| CFH | Factor H | No binding to endothelium | 20–30 | Rate of remission: 60% (dose and timing dependent) | Rate of death or ESRD: 70–80% | Rate of recurrence: 80–90%§ |\n| CFHR1/3 | Factor HR1, R3 | Anti–factor H antibodies | 6 | Rate of remission: 70–80% (plasma exchange combined with immunosuppression) | Rate of ESRD: 30–40% | Rate of recurrence: 20%¶ |\n| MCP | Membrane cofactor protein | No surface expression | 10–15 | No definitive indication for therapy | Rate of death or ESRD: <20% | Rate of recurrence: 15–20%¶ |\n| CFI | Factor I | Low level or low cofactor activity | 4–10 | Rate of remission: 30–40% | Rate of death or ESRD: 60–70% | Rate of recurrence: 70–80%§ |\n| CFB | Factor B | C3 convertase stabilization | 1–2 | Rate of remission: 30% | Rate of death or ESRD: 70% | Recurrence in one case |\n| C3 | Complement C3 | Resistance to C3b inactivation | 5–10 | Rate of remission: 40–50% | Rate of death or ESRD: 60% | Rate of recurrence: 40–50% |\n| THBD | Thrombomodulin | Reduced C3b inactivation | 5 | Rate of remission: 60% | Rate of death or ESRD: 60% | Recurrence in one case |\nESRD denotes end-stage renal disease.\n† Remission was defined as either complete remission or partial remission (i.e., hematologic remission with renal sequelae).\n‡ The long-term outcome was defined as the outcome 5 to 10 years after onset.\n§ Patients in this category were eligible for combined liver and kidney transplantation.\n¶ Patients in this category were eligible for single kidney transplantation." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.130
    kind: enumerate
    topic: hus
    prompt: Supportive care in typical (STEC) HUS?
    points:
      - Volume resuscitation (under-filling raises the need for dialysis)
      - Dialysis when needed (about half need it)
      - Blood transfusion as needed; platelets sparingly
      - Avoid antimotility drugs and antibiotics
    pass: 3
    hook: "STEC HUS دعم = «مية، غسيل، دم، ولا تكتم ولا تقتل»: volume resuscitation (الناشف يحتاج dialysis أكتر)، dialysis لما يلزم (حوالي النص)، نقل دم حسب الحاجة والصفايح بالقطارة، وابعد عن antimotility drugs والمضادات الحيوية."
    src: { page: 476, quote: "The management of typical HUS caused by STEC is generally supportive." }
    status: unverified
  - id: neph.L14.131
    kind: mcq
    topic: hus
    stem: "A 4-year-old has bloody diarrhea for 5 days, then pallor, oliguria, Hb 7, platelets 40,000 and schistocytes. Stool is positive for Shiga toxin. Which drug should be avoided?"
    options:
      - Antibiotics and antimotility agents
      - Isotonic IV fluids for volume
      - Red cell transfusion for anemia
      - Dialysis for oliguric kidney injury
    answer: 0
    why:
      - "Correct: in STEC-HUS they worsen outcomes, likely by raising Shiga toxin exposure (p476)."
      - Volume resuscitation is part of supportive care.
      - Transfusion is given when clinically needed.
      - About half need renal replacement therapy.
    src: { page: 476, quote: "Antimotility agents and antibiotics are avoided in typical HUS caused by STEC, as they correlate with poorer outcomes, likely due to heightened Shiga toxin exposure. On the other hand, if S dysenteriae or S pneumonia is present, early antibiotics are associated with improved outcomes." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.132
    kind: card
    topic: hus
    front: What are first- and second-line treatments for aHUS?
    back: First-line eculizumab (anti-C5); second-line plasma exchange.
    src: { page: 476, quote: "The cornerstones of treatment for aHUS are first-line treatment with eculizumab and second-line with plasma exchange." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.133
    kind: cloze
    topic: hus
    text: "Eculizumab cut progression to ESRD or death in children from 30-50% to {{c1::9%}}, and in adults from 60% to {{c2::6-15%}}."
    src: { page: 476, quote: "The advent of eculizumab treatment has decreased progression to ESRD or death in children from 30% to 50% down to 9% and in adults from 60% down to 6% to 15%." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.134
    kind: card
    topic: hus
    front: How does ravulizumab compare with eculizumab?
    back: Also a C5 inhibitor with similar efficacy but a half-life 4 times longer (approved USA 2019, EU 2020).
    src: { page: 476, quote: "Ravulizumab also binds to C5, preventing cleavage, and it has similar efficacy to eculizumab but with 4 times as long of a half-life. Prior to eculizumab, plasma exchange was the standard of care for HUS and is still used if eculizumab is not available or in addition if clinically indicated." }
    status: unverified
  - id: neph.L14.135
    kind: card
    topic: hus
    front: What is the main adverse effect of eculizumab, and how is it prevented?
    back: Infection by encapsulated organisms (S. pneumoniae, H. influenzae); vaccinate and monitor.
    src: { page: 477, quote: "Adverse effects of eculizumab are infection by encapsulated organisms such as S pneumoniae and Haemophilus influenzae, and all patients should be given appropriate vaccines and monitored" }
    update:
      text: "The best-known risk of C5 blockade is Neisseria meningitidis (boxed warning): give meningococcal vaccines (conjugate ACWY and serogroup B) at least 2 weeks before the first dose, or antibiotic prophylaxis if eculizumab can't wait. In the exam give the book's answer, and add meningococcus."
      ref: "Eculizumab (Soliris) prescribing information 2024, boxed warning on meningococcal infections"
    status: unverified
  - id: neph.L14.136
    kind: card
    topic: hus
    front: Why give prophylactic eculizumab to some aHUS kidney transplant recipients?
    back: aHUS recurs often in the graft; prophylaxis in high-risk patients prolongs graft survival and may be cost-effective.
    src: { page: 477, quote: "Studies suggest that prophylactic administration of eculizumab in patients with a high risk of aHUS recurrence prolongs graft survival and may also be cost-effective in the high-risk groups despite the drug's high cost." }
    status: unverified
  # ---------- p477-483: TTP ----------
  - id: neph.L14.137
    kind: enumerate
    topic: ttp
    prompt: The classic pentad of TTP?
    points:
      - Fever
      - Thrombocytopenia
      - Hemolytic anemia
      - Renal dysfunction
      - Neurologic dysfunction
    pass: 5
    hook: "خماسي TTP = «FAT RN»: Fever، Anemia (hemolytic)، Thrombocytopenia، Renal dysfunction، Neurologic dysfunction."
    src: { page: 477, quote: "Thrombotic thrombocytopenic purpura (TTP) is a type of microangiopathic hemolytic anemia that classically has been characterized by the pentad of fever, thrombocytopenia, hemolytic anemia, renal dysfunction, and neurologic dysfunction." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.138
    kind: card
    topic: ttp
    front: What is the mechanism of TTP?
    back: Low ADAMTS13 (VWF-cleaving protease) leaves ultra-large VWF multimers that bind platelets and form microthrombi, causing end-organ ischemia.
    src: { page: 478, quote: "This is due to the inability of the ADAMTS13 to inactivate the large multimer von Willebrand factor (VWF) that is necessary to prevent spontaneous coagulation." }
    status: unverified
  - id: neph.L14.139
    kind: cloze
    topic: ttp
    text: "Untreated TTP has a mortality of about {{c1::90%}}; about {{c2::80%}} respond to initial treatment, and post-treatment mortality is {{c3::10-15%}}."
    src: { page: 478, quote: "Unchecked, the large multimers have a tremendous avidity to bind platelets and initiate thrombi formation. The central nervous system (CNS) and kidneys are the two most common organ systems affected by TTP. Timely diagnosis is very important because TTP is a medical emergency which, without treatment, has a mortality of about 90%. About 80% of patients respond to initial treatment, and the post-treatment mortality is 10 to 15%." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L14.140
    kind: card
    topic: ttp
    front: Which form of TTP is more common, and what causes it?
    back: Acquired TTP, from autoantibodies against ADAMTS13. Congenital TTP comes from ADAMTS13 mutations and needs a trigger such as infection or pregnancy.
    src: { page: 478, quote: "Acquired TTP is more common than the congenital type and is caused by autoantibodies targeting ADAMTS13." }
    status: unverified
  - id: neph.L14.141
    kind: enumerate
    topic: ttp
