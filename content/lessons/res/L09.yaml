      - kind: explain
        page: 80
        quote: "Approval is for up to one year,\n  May be less depending on level of risk.\n  Required documentation for Continuing Review\n    number of subjects enrolled\n    description of any adverse events or unanticipated problems\n    summary of any recent literature\n    copy of the current informed consent"
        title: "الموافقة لحد إمتى؟"
        text: |
          - الموافقة ==لحد سنة==، وممكن أقل حسب الـ risk.
          - الـ **continuing review** محتاج: عدد اللي دخلوا، أي **adverse events** أو مشاكل مش متوقعة، ملخص الـ literature الجديدة، ونسخة الـ consent الحالية.
          - الـ **non-human subject research** (مافيش intervention/interaction ولا identifiable private information): الـ **chair أو vice-chair** يحدد، **من غير full board ومن غير consent** (slide 81).
          - والـ IRB تقدر: توافق/ترفض/تطلب تعديل، تعمل continuing review، تراقب وتعمل audit، و**توقف أو تنهي** بحث متوافق عليه (slide 83).
      - kind: check
        page: 80
        quote: "Approval is for up to one year,\n  May be less depending on level of risk.\n  Required documentation for Continuing Review\n    number of subjects enrolled\n    description of any adverse events or unanticipated problems\n    summary of any recent literature\n    copy of the current informed consent"
        question: "For how long is REC approval given?"
        options: ["Up to one year", "For the whole study", "Up to five years"]
        answer: 0
        why:
          - "صح: لحد سنة، وممكن أقل لو الـ risk أعلى، وبعدها continuing review."
          - "لأ، فيه مراجعة دورية."
          - "مش على الـ slides؛ الحد سنة."
      - kind: try
        items: [res.L09.057, res.L09.068, res.L09.074]
    recap:
      - "Consent = ورقة + process: information ← understood ← decision ← monitored."
      - "كل الدراسات محتاجة consent إلا لو الـ REC عملت waive. الورقة: REC approved، ممضية، ونسخة للمشارك."
      - "REC = IRB: تراجع وتوافق وتتابع. الموافقة لحد سنة."
      - "المسؤولية النهائية على الـ principal investigator."
      - "Conclusion: research is a privilege, not a right."
