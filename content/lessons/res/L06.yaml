  - id: res.L06.lesson5
    title: "الـ Blinding: محدش يعرف مين خد إيه"
    hook: "الدكتور اللي عارف إن العيان خد الدوا الجديد... هيشوف تحسّن حتى لو مفيش."
    minutes: 7
    pages: [42, 45]
    topics: [blinding]
    goals:
      - "تشرح ليه الـ blinding بيحمي الـ randomization"
      - "تربط كل خطوة في الـ randomized controlled trial (RCT) بالـ bias اللي بتمنعه"
      - "تفرّق single و double و triple"
    status: unverified
    steps:
      - kind: explain
        page: 42
        quote: "Blinding (or masking):\n  The use of blinding is another cardinal feature of RCT's.\n  Blinding is important because it preserves the benefits of randomization by preventing the biased assessment of outcomes.\n  Blinding therefore prevents measurement bias (as opposed to randomization and concealment which prevent confounding bias and selection bias, respectively)."
        title: "ليه نعمّي حد؟"
        text: |
          الـ ==blinding (masking)== تاني أهم ميزة في الـ RCT بعد الـ randomization.

          الـ randomization عملت مجموعتين متساويتين في الأول. بس لو الدكتور اللي بيقيس **عارف** مين خد الجديد، هيقيس بعين متحيزة، فيبوّظ اللي القرعة عملته.

          علشان كده: الـ blinding **بيحافظ على مكاسب الـ randomization** لأنه بيمنع **biased assessment of outcomes**، يعني ==measurement bias==.
      - kind: table
        page: 42
        quote: "Blinding (or masking):\n  The use of blinding is another cardinal feature of RCT's.\n  Blinding is important because it preserves the benefits of randomization by preventing the biased assessment of outcomes.\n  Blinding therefore prevents measurement bias (as opposed to randomization and concealment which prevent confounding bias and selection bias, respectively)."
        title: "كل أداة بتمنع bias معين"
        columns: ["RCT feature", "Bias it prevents"]
        rows:
          - ["Randomization", "Confounding bias"]
          - ["Allocation concealment", "Selection bias"]
          - ["Blinding", "Measurement bias"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: analogy
        page: 42
        quote: "Blinding (or masking):\n  The use of blinding is another cardinal feature of RCT's.\n  Blinding is important because it preserves the benefits of randomization by preventing the biased assessment of outcomes.\n  Blinding therefore prevents measurement bias (as opposed to randomization and concealment which prevent confounding bias and selection bias, respectively)."
        text: |
          عايز تعرف أنهي عربية فول أحلى: عم سيد ولا عم حسن؟ لو صاحبك عارف إن الطبق من عند عم سيد (اللي بيحبه)، هيقول «ده أحلى» قبل ما يدوق.

          حط الطبقين في أطباق شبه بعض ومتقولش مين مين: ده **blinding**، وبيمنع الـ **biased assessment** للطعم. وكمان لو اللي بيعدّ الأصوات مايعرفش، يبقى **triple**.
      - kind: explain
        remind: [res.L06.063]
        page: 43
        quote: "Blinding (or masking). Ideally, blinding should occur at all of the following levels:\n  Patients\n  Caregivers\n  Collectors of outcome data (e.g., research assistants or study physicians),\n  The data analyst\nBlinding overcomes ascertainment bias"
        title: "نعمّي مين؟"
        text: |
          الأحسن يكون الـ blinding على **كل المستويات** دي:

          - **Patients**
          - **Caregivers**
          - **Collectors of outcome data** (research assistants أو study physicians)
          - **The data analyst**

          والـ blinding بيتغلب على ==ascertainment bias==.
      - kind: aside
        tone: exam
        page: 43
        quote: "Blinding (or masking). Ideally, blinding should occur at all of the following levels:\n  Patients\n  Caregivers\n  Collectors of outcome data (e.g., research assistants or study physicians),\n  The data analyst\nBlinding overcomes ascertainment bias"
        text: |
          الدكتورة قالت في الشرح ليه نعمّي الـ **caregivers**: اللي بيرعى العيانين لو عارف مين في أنهي جروب، ممكن يدّي جروب منهم **رعاية زيادة أو vitamins زيادة**. ساعتها الجروبين يختلفوا في الـ co-interventions، مش في العلاج بس، والمقارنة تبوظ.

          وفي المحاضرة اتقال كمان: الجراحة أو البرنامج السلوكي صعب تخبّيهم عن العيان والجرّاح. بس لسه تقدر تعمّي ==collectors of outcome data== (اللي بيقيس الـ outcome)، وده بيقلل الـ biased assessment.
      - kind: figure
        page: 45
        quote: "Blinding (or masking), Type of blinding\n| | Single | Double | Triple |\n|---|---|---|---|\n| Subject | ✓ | ✓ | ✓ |\n| Observer | | ✓ | ✓ |\n| Data analyst | | | ✓ |\nConfounding: Prerandomization confounding variables are handled by Randomization; Postrandomization confounding variables (cointerventions) by Blinding"
        title: "Single, double, triple"
        alt: "Grid with three rows: single, double and triple blinding. Columns: subject, observer, data analyst. Single blinds the subject only; double blinds subject and observer; triple blinds all three."
        caption: "كل مستوى بيضيف واحد: **subject**، بعدين **observer**، بعدين **data analyst**."
