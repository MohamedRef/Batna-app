      - kind: explain
        page: 334
        title: "الـ AMR بيتعالج بإيه وليه؟"
        quote: "We suggest treating antibody-mediated acute rejection with one or more of the following alternatives, with or without corticosteroids (2C):"
        text: |
          الـ **antibody-mediated acute rejection** (KDIGO 6.4): واحد أو أكتر من: ==plasma exchange==، **IVIG**، **anti-CD20**، و lymphocyte-depleting antibody، مع أو من غير steroids.

          ليه دول؟ التفسير المقبول (مش في الكتاب):
          - الـ **plasma exchange** بيشيل الـ DSA اللي في الدم **دلوقتي** (زي ما شفت في درس الـ TPE).
          - الـ **IVIG** بيعادل الـ antibodies ويهدّي الـ B cells.
          - الـ **anti-CD20** (rituximab) بيقتل الـ B cells اللي ممكن تتحول plasma cells وتعمل antibodies جديدة.
          يعني الأول تشيل الموجود، وبعدين تقفل المصنع. أما الـ steroids لوحدها فبتشتغل على الـ T cells أكتر، عشان كده هي الأساس في الـ cellular rejection مش الـ AMR.

          والكتاب بيلخص الـ IS: **therapeutic** (يمنع الرفض) و **undesired** (immunodeficiency: عدوى وسرطان).
      - kind: explain
        page: 335
        title: "التمن: toxicity وعدوى وسرطان"
        quote: "Nonimmune toxicity to other tissues ex calcineurin inhibitors: nephrotoxicity, diabetes mellitus, hypertension. corticosteroids bone osteoporosis,peptic uulcer, hypertension,diabetes mellitus."
        text: |
          - **CNI**: ==nephrotoxicity==، diabetes، hypertension.
          - **Steroids**: osteoporosis، peptic ulcer، hypertension، diabetes.
          - والـ immunodeficiency نفسه: **infection** و **malignancy**.

          ليه الـ CNI بيعمل nephrotoxicity؟ التفسير المقبول (مش في الكتاب): الـ calcineurin inhibitors بيقبضوا الـ afferent arteriole، فالـ GFR يقل (حاد ويرجع لو قللت الجرعة)، ومع السنين بيعملوا arteriolar hyalinosis و striped fibrosis (مزمن). يعني الدوا اللي بيحمي الكلية من الرفض بيأذيها ببطء، وده سبب إن مستواه بيتقاس (trough) ونحاول نقلله. وليه السكر؟ لأن الـ tacrolimus والـ steroids الاتنين بيضروا الـ beta cells أو يعملوا insulin resistance (new-onset diabetes after transplant).
