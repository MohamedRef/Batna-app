  - id: hb.L02.lesson3
    title: "الـ pathway والـ kPa: والـ FibroScan بيكدب إمتى"
    hook: "FIB-4 ثم LSM على أربع خطوات، عتبة الـ F4 لكل سبب، وليه الـ heart failure بيعلّي الرقم."
    minutes: 9
    pages: [30, 32]
    topics: [pathways, elastography]
    goals:
      - "تمشي في الـ stepwise pathway: FIB-4 (1.3 و 2.67) ثم LSM (8 و 12)"
      - "تعرف ليه عتبة الـ F4 بتختلف حسب السبب"
      - "تفرّق بين الـ false-high reading والـ failed measurement في الـ TE"
    status: unverified
    steps:
      - kind: figure
        page: 30
        quote: "Step 1: identify patients at risk:\n  2 or more metabolic risk factors\n  Type 2 diabetes\n  Steatosis on any imaging modality or elevated aminotransferases\nStep 2: history and laboratory tests:\n  Excessive alcohol intake, CBC, liver function tests\nStep 3: noninvasive testing (NIT) for fibrosis (e.g., FIB-4):\n  FIB-4 < 1.3 → Low risk\n  FIB-4 1.3–2.67 → Indeterminate risk → Step 4\n  FIB-4 > 2.67 → High risk\nStep 4: liver stiffness measurement (LSM):\n  LSM < 8 kPa → Low risk\n  LSM 8–12 kPa → Indeterminate risk\n  LSM > 12 kPa → High risk\n| Low risk | Indeterminate risk | High risk |\n|---|---|---|\n| Repeat NIT in 2–3 years unless clinical circumstances change | Refer to hepatologist for liver biopsy or MR elastography or monitoring with re-evaluation of risk in 2–3 years | Refer to hepatologist |"
        title: "الـ pathway على أربع خطوات في الكتاب"
        image: { file: hb/L02-four-step-pathway.webp, book: true }
        alt: "Book flowchart in teal bars. Step 1 identify patients at risk: two or more metabolic risk factors, type 2 diabetes, steatosis on any imaging modality or elevated aminotransferases. Step 2 history and laboratory tests: excessive alcohol intake, CBC, liver function tests. Step 3 non-invasive testing for fibrosis (e.g. FIB-4): below 1.3, 1.3 to 2.67, above 2.67; side arrows take below 1.3 straight to low risk and above 2.67 straight to high risk; the middle goes through an indeterminate-risk box to step 4 liver stiffness measurement: below 8 kPa, 8 to 12 kPa, above 12 kPa. Bottom boxes: low risk (green), repeat NIT in 2 to 3 years; indeterminate risk (yellow), refer to hepatologist for biopsy or MR elastography or monitoring with re-evaluation in 2 to 3 years; high risk (red), refer to hepatologist."
        caption: |
          الصورة من فوق لتحت، كل خطوة في شريط أخضر غامق:

          - **Step 1**: مين الـ at risk: **2 or more metabolic risk factors**، **Type 2 diabetes**، أو **steatosis on imaging / elevated aminotransferases**.
          - **Step 2**: الـ history والتحاليل: الكحول، **complete blood count (CBC)**، liver function tests.
          - **Step 3**: الـ **FIB-4** وتحته تلات خانات: **< 1.3**، **1.3–2.67**، **> 2.67**. بص على ==السهمين اللي على الجناب==: الـ < 1.3 نازل على طول للصندوق الأخضر الشمال، والـ > 2.67 نازل على طول للأحمر اليمين.
          - الخانة اللي في النص بس بتعدّي على **Indeterminate risk** (الصندوق الأصفر) لـ **Step 4: LSM**: **< 8**، **8–12**، **> 12 kPa**.
          - **تحت**: تلات صناديق: **Low risk** أخضر (Repeat NIT in 2–3 years)، **Indeterminate risk** أصفر (hepatologist: biopsy أو MR elastography أو monitoring)، **High risk** أحمر (Refer to hepatologist).

          الشكل بيثبت إن الـ ==LSM== مش لكل الناس: بيفك المنطقة الرمادية بتاعة الـ FIB-4 بس. والأرقام هنا **1.3 / 2.67** للـ FIB-4 و **8 / 12** للـ kPa.
