items:
  # ---------- p77: definition, neuroendocrine cells ----------
  - id: endo.L05.001
    kind: enumerate
    topic: overview
    prompt: Neuroendocrine tumours are a heterogeneous group of neoplasms. Which three features do they share?
    points: [Originate from neuroendocrine cells, Have secretory characteristics, Frequently present with hypersecretory syndromes]
    pass: 3
    src: { page: 77, quote: "Frequently present with hypersecretory syndromes." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.002
    kind: cloze
    topic: overview
    text: "In {{c1::1969}}, Pearse described {{c2::APUD}} cells: {{c3::Amine Precursor Uptake and Decarboxylation}}."
    src: { page: 77, quote: "In 1969, Pearse described APUD cells (Amine Precursor Uptake and Decarboxylation)." }
    status: unverified
  - id: endo.L05.003
    kind: card
    topic: overview
    front: What do neuroendocrine (APUD) cells produce, and where do they store their hormones?
    back: Polypeptides and biogenic amines, stored in dense core secretory granules that release them in response to external stimuli.
    src: { page: 77, quote: "Contain dense core secretory granules that store and release hormones in response to external stimuli." }
    status: unverified
  - id: endo.L05.004
    kind: card
    topic: overview
    front: How do neuroendocrine cells differ from neurons, and to which system do they belong?
    back: They lack axons and synapses. They are part of the diffuse endocrine system (DES), from which the endocrine tumours of the gut and pancreas arise.
    src: { page: 77, quote: "Lack axons and synapses. Part of the diffuse endocrine system (DES)." }
    status: unverified
  # ---------- p78: the cell, sites, background ----------
  - id: endo.L05.005
    kind: order
    topic: overview
    prompt: Order the serotonin pathway in the neuroendocrine cell.
    steps: [Tryptophan, 5-HTP, 5-HT (serotonin), 5-HIAA]
    src: { page: 78, quote: "Tryptophan → 5-HTP → 5-HT → 5-HIAA." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.006
    kind: enumerate
    topic: overview
    prompt: Name three proteins found in the secretory granules of neuroendocrine cells.
    points: [Pancreastatin, Chromostatin, Chromogranin A (CgA)]
    pass: 3
    src: { page: 78, quote: "Secretory granules contain pancreastatin, chromostatin, and chromogranin A (CgA)." }
    status: unverified
  - id: endo.L05.007
    kind: enumerate
    topic: overview
    prompt: Enumerate the four regulation modes of neuroendocrine cells.
    points: [Endocrine, Autocrine, Paracrine, Neurocrine]
    pass: 4
    src: { page: 78, quote: "Neurocrine." }
    status: unverified
  - id: endo.L05.008
    kind: enumerate
    topic: classification
    prompt: Enumerate the sites of neuroendocrine tumours.
    points: [Pancreatic islet cells, Gastroenteric tissue, Respiratory epithelium, Gastroenteropancreatic NETs (includes carcinoid tumours)]
    pass: 3
    src: { page: 78, quote: "Pancreatic islet cells. Gastroenteric tissue. Respiratory epithelium. Gastroenteropancreatic NETs (includes carcinoid tumors)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.009
    kind: cloze
    topic: classification
    text: "NET incidence is {{c1::1-2 per 100,000}} (likely underestimated because of vague presentations and misdiagnosis); they are {{c2::<2%}} of GI malignancies."
    src: { page: 78, quote: "Incidence: 1–2 per 100,000 (likely underestimated due to vague presentations and misdiagnosis). <2% of GI malignancies." }
    status: unverified
    tags: [numbers]
  - id: endo.L05.010
    kind: card
    topic: classification
    front: Which age group gets most NETs of the lung, GI tract and mediastinum, and which NET is the exception?
    back: Patients over 50. Appendiceal carcinoids are the exception, more common under 30.
    src: { page: 78, quote: "Exception: Appendiceal carcinoids more common in patients <30 years." }
    status: unverified
    tags: [high-yield]
  # ---------- p78-79: WHO classification ----------
  - id: endo.L05.011
    kind: card
    topic: classification
    front: What is the general behaviour of most GEP tumours?
    back: Most are malignant but slow-growing.
    src: { page: 78, quote: "Most GEP tumors are malignant but slow-growing." }
    status: unverified
  - id: endo.L05.012
    kind: table
    topic: classification
    title: WHO classification of GEP neuroendocrine tumours
    columns: [Category, Behaviour]
    rows:
      - [Well-differentiated NET, "Non-invasive; benign-behaving or uncertain malignant potential"]
      - [Well-differentiated NE carcinoma, "Low-grade malignant, with invasion of the muscularis propria or metastasis"]
      - [Poorly differentiated endocrine carcinoma, "High-grade, malignant"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 79, quote: "Well-differentiated NE carcinomas: Low-grade malignant with invasion of muscularis propria or metastasis." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.013
    kind: card
    topic: classification
    front: Besides the WHO category, what helps grade a NET?
    back: The level of tumour differentiation and proliferation indices such as Ki-67.
    src: { page: 79, quote: "Level of tumor differentiation and proliferation indices such as Ki-67 are useful" }
    status: unverified
    update:
      text: "WHO 2019 grades GEP-NETs by Ki-67 and mitoses: G1 <3%, G2 3-20%, G3 >20%; poorly differentiated NECs are a separate group. The book's WHO categories stay the exam answer."
      ref: WHO Classification of Digestive System Tumours, 5th ed., 2019
  - id: endo.L05.014
    kind: table
    topic: classification
    title: Carcinoid tumours by embryonic gut
    columns: [Gut, Share, Sites]
    rows:
      - [Foregut, "25%", "Lung, thymus, gastric mucosa, duodenum"]
      - [Midgut, "40-60%", "Distal ileum and jejunum; includes carcinoid syndrome"]
      - [Hindgut, "-", "Colon, rectum"]
    blanks: [[0, 2], [1, 1], [1, 2], [2, 2]]
    src: { page: 79, quote: "40–60% Midgut (distal ileum and jejunum) — includes carcinoid syndrome." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L05.015
    kind: card
    topic: classification
    front: What share of endocrine pancreatic tumours are functioning, and what is typical of the non-functioning ones?
    back: About 60% are functioning (Zollinger-Ellison, hyperglycaemic, Verner-Morrison, glucagonomas, VIPomas). Non-functioning ones are usually large and metastatic at diagnosis.
    src: { page: 79, quote: "Non-functioning (usually large and metastatic at diagnosis)." }
    status: unverified
  - id: endo.L05.016
    kind: cloze
    topic: classification
    text: "Pancreatic endocrine tumours are {{c1::3-5%}} of all pancreatic neoplasms; most are {{c2::sporadic}}."
    src: { page: 79, quote: "Account for 3–5% of all pancreatic neoplasms. Most are sporadic." }
    status: unverified
    tags: [numbers]
  - id: endo.L05.017
    kind: enumerate
    topic: classification
    prompt: Enumerate the familial syndromes with pancreatic endocrine tumours.
    points: ["MEN-1 (20%, gastrinoma or non-functioning)", Tuberous sclerosis, "Neurofibromatosis (ampulla of Vater)", Von Hippel-Lindau]
    pass: 4
    src: { page: 79, quote: "MEN-1 (20%, gastrinoma or non-functioning)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.018
    kind: enumerate
    topic: classification
    prompt: Enumerate the hormones that pancreatic endocrine tumours may secrete.
    points: [Insulin, Gastrin, Glucagon, VIP, Serotonin, ACTH]
    pass: 5
    src: { page: 80, quote: "Serotonin." }
    status: unverified
  # ---------- p80: presentation and markers ----------
  - id: endo.L05.019
    kind: card
    topic: markers
    front: How do neuroendocrine tumours present?
    back: Asymptomatic or with obstructive symptoms; symptoms are usually due to liver metastases, or to hormone release into the circulation (e.g. serotonin, tachykinin).
    src: { page: 80, quote: "Asymptomatic or present with obstructive symptoms. Symptoms usually due to liver metastases." }
    status: unverified
  - id: endo.L05.020
    kind: cloze
    topic: markers
    text: "General NET markers: chromogranin A is raised in {{c1::90-100%}}; pancreatic polypeptide in {{c2::40-60%}}."
    src: { page: 80, quote: "Chromogranin A: 90–100%. Pancreatic Polypeptide: 40–60%." }
    status: unverified
    tags: [numbers]
  - id: endo.L05.021
    kind: card
    topic: markers
    front: What is the general stimulation test for neuroendocrine pancreatic tumours?
    back: A meal stimulation test, measuring pancreatic polypeptide (PP) every 10 minutes for 1.5 hours.
    src: { page: 80, quote: "Meal stimulation test with measurement of PP every 10 minutes for 1.5 hours." }
    status: unverified
  - id: endo.L05.022
    kind: card
    topic: markers
    front: What is chromogranin A, and how good is it as a NET marker?
    back: A constitutive neuroendocrine secretory protein and the most widely accepted biomarker; against a panel of markers it was the most accurate (specificity 85.7%, sensitivity 67.9%).
    src: { page: 80, quote: "Represents a constitutive neuroendocrine secretory protein. Most widely accepted biomarker." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.023
    kind: cloze
    topic: markers
    text: "Chromogranin A: specificity {{c1::85.7%}}, sensitivity {{c2::67.9%}}; elevated in {{c3::60-80%}} of patients with NETs."
    src: { page: 80, quote: "Elevated in 60–80% of patients with NETs." }
    status: unverified
    tags: [numbers]
  - id: endo.L05.024
    kind: card
    topic: markers
    front: What does the CgA level correlate with, and what does an early fall mean in pancreatic NETs?
    back: It correlates with disease burden and poor outcome. In pancreatic NETs, an early fall during chemotherapy or everolimus is associated with a better prognosis.
    src: { page: 80, quote: "In pancreatic NETs, early declines in CgA during treatment with chemotherapy and everolimus are associated with improved prognosis." }
    status: unverified
  # ---------- p81-83: localization ----------
  - id: endo.L05.025
    kind: enumerate
    topic: localization
    prompt: Enumerate the methods for tumour localization of NETs.
    points: [Transabdominal ultrasound, CT, MRI, Selective arterial angiography, Selective venous sampling, Hepatic venous sampling, Radiolabeled somatostatin scanning, Endoscopic and intraoperative ultrasound]
    pass: 6
    src: { page: 81, quote: "Transabdominal ultrasound. CT. MRI. Selective arterial angiography. Selective venous sampling. Hepatic venous sampling. Radiolabeled somatostatin scanning." }
    status: unverified
  - id: endo.L05.026
    kind: card
    topic: localization
    front: What is the best noninvasive modality to localize GEP tumours, and what else can it do?
    back: Radiolabeled somatostatin scanning. It finds up to 70% of primary tumours and can distinguish GEP tumours from nonendocrine tumours.
    src: { page: 81, quote: "Radiolabeled somatostatin scanning is the best noninvasive modality, identifying up to 70% of primary tumors." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.027
    kind: table
    topic: localization
    title: Sensitivity of NET imaging
    columns: [Modality, Small tumours, Liver metastases]
    rows:
      - ["Octreoscan (111In-DTPA-octreotide, SRI)", "<10 mm 40%; 10 mm 90%", "90%"]
      - ["EUS", "<10 mm about 50%", "-"]
      - ["SRI + EUS", "<10 mm about 90%", "-"]
      - ["Ultrasound", "10-30%", "90%"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 81, quote: "Sensitivity for <10 mm tumors: ~50%. Combined SRI + EUS sensitivity for <10 mm tumors: ~90%." }
    status: unverified
    tags: [numbers, high-yield]
  - id: endo.L05.028
    kind: card
    topic: localization
    front: Which newer technique is used to image NETs, and with which tracers?
    back: Positron emission tomography (PET) with C11-5HTP or C11-L-dopa; traditional techniques (CT with angiography, MRI, ultrasound) are always a complement.
    src: { page: 82, quote: "With C11-5HTP or C11-L-dopa. Traditional Techniques (always a complement)." }
    status: unverified
    update:
      text: "68Ga-DOTA somatostatin-analog PET/CT (DOTATATE/DOTATOC) has replaced Octreoscan as the first-choice functional imaging for well-differentiated NETs."
      ref: ENETS guidance 2023 / SNMMI appropriate use criteria 2018
  - id: endo.L05.029
    kind: mcq
    topic: localization
    stem: A 52-year-old man has a pancreatic NET suspected biochemically. CT is negative. You want the best chance of finding a lesion under 10 mm. Which approach does the lecture support?
    options: [Combined somatostatin receptor imaging and endoscopic ultrasound, Transabdominal ultrasound alone, Octreoscan alone, Repeat CT with thinner cuts]
    answer: 0
    why:
      - "Correct: SRI + EUS together reach about 90% for tumours under 10 mm."
      - "Ultrasound finds only 10-30% of small tumours."
      - "Octreoscan alone finds only 40% of tumours under 10 mm."
      - "The lecture gives CT as a complement, not as the way to find tiny tumours."
    src: { page: 81, quote: "Combined SRI + EUS sensitivity for <10 mm tumors: ~90%." }
    status: unverified
  # ---------- p84: treatment ----------
  - id: endo.L05.030
    kind: card
    topic: treatment
    front: What offers the only chance of cure for a resectable NET?
    back: Complete surgical removal of a solitary tumour.
    src: { page: 84, quote: "Complete surgical removal of a solitary tumor offers a chance of cure." }
    status: unverified
  - id: endo.L05.031
    kind: enumerate
    topic: treatment
    prompt: If surgical cure is not possible, enumerate the measures to control symptoms and tumour growth.
    points: [Surgical debulking, "Antisecretory drugs (e.g. gastrinomas)", "Somatostatin analogs (e.g. VIPomas)", "Tumour embolization (± chemotherapy)", Cryotherapy, Radiofrequency ablation, Cytotoxic chemotherapy, Radiolabeled somatostatin analogs, Interferon, Liver transplantation]
    pass: 7
    src: { page: 84, quote: "Surgical tumor debulking. Antisecretory drugs (e.g., for gastrinomas). Somatostatin analogs (e.g., for VIPomas)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.032
    kind: cloze
    topic: treatment
    text: "Cytotoxic chemotherapy for NETs: {{c1::69%}} response to {{c2::streptozotocin + doxorubicin}}."
    src: { page: 84, quote: "Cytotoxic chemotherapy (69% response to streptozotocin + doxorubicin)." }
    status: unverified
    tags: [numbers]
  - id: endo.L05.033
    kind: card
    topic: treatment
    front: Where do somatostatin analogs fit in NET treatment?
    back: Synthetic hormone-blocking agents (octreotide, lanreotide), used since the 1980s. First-line for GEP NETs; second- or third-line for insulinomas and gastrinomas.
    src: { page: 84, quote: "First-line for neuroendocrine gastroenteropancreatic tumors. Second- or third-line for insulinomas and gastrinomas." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.034
    kind: enumerate
    topic: treatment
    prompt: Enumerate the side effects of somatostatin analogs.
    points: [Gallstones, Pain at injection site, Hypo/hyperglycaemia, Rash, Alopecia, Fluid retention]
    pass: 5
    src: { page: 84, quote: "Gallstones (due to inhibition of cholecystokinin release). Pain at injection site. Hypo/hyperglycemia. Rash. Alopecia. Fluid retention." }
    status: unverified
  - id: endo.L05.035
    kind: card
    topic: treatment
    front: Why do somatostatin analogs cause gallstones?
    back: They inhibit cholecystokinin release (and gallbladder contractility and bile flow), so bile stagnates.
    src: { page: 84, quote: "Gallstones (due to inhibition of cholecystokinin release)." }
    status: unverified
    tags: [high-yield]
  # ---------- p85: physiology, interferon, chemo ----------
  - id: endo.L05.036
    kind: enumerate
    topic: treatment
    prompt: Enumerate the physiological effects of somatostatin (and its analogs).
    points: [Reduces liver blood flow, Inhibits gastric acid and pepsin, Inhibits gallbladder contractility and bile flow, Inhibits pancreatic exocrine secretion, Inhibits GI and pancreatic peptide hormones, Slows GI transit and glucose/amino acid absorption, Reduces splanchnic blood flow, Stimulates water and electrolyte absorption, Inhibits tissue growth and proliferation]
    pass: 6
    src: { page: 85, quote: "Reduces liver blood flow. Inhibits gastric acid and pepsin secretion. Inhibits gallbladder contractility and bile flow." }
    status: unverified
  - id: endo.L05.037
    kind: card
    topic: treatment
    front: Which somatostatin effect explains its use in VIPoma diarrhoea?
    back: It inhibits GI and pancreatic peptide hormone secretion and stimulates water and electrolyte absorption.
    src: { page: 85, quote: "Inhibits GI and pancreatic peptide hormone secretion." }
    status: unverified
  - id: endo.L05.038
    kind: card
    topic: treatment
    front: For which NETs is interferon alpha used, and how does it act?
    back: Midgut carcinoids, with or without somatostatin analogs. Direct effect on tumour cells, blocks the cell cycle at G1/S, inhibits protein/hormone synthesis and inhibits angiogenesis.
    src: { page: 85, quote: "Blocks cell cycle in G1/S phase." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.039
    kind: enumerate
    topic: treatment
    prompt: Enumerate the side effects of interferon alpha listed on p85.
    points: [Flu-like symptoms, Fever, Anaemia, Thrombocytopenia, Leukopenia]
    pass: 4
    src: { page: 85, quote: "Flu-like symptoms. Fever. Anemia. Thrombocytopenia. Leukopenia." }
    status: unverified
  - id: endo.L05.040
    kind: card
    topic: treatment
    front: What is the role of chemotherapy in NETs?
    back: Generally a palliative option for metastasizing neuroendocrine carcinomas.
    src: { page: 85, quote: "Generally a palliative option for metastasizing neuroendocrine carcinomas." }
    status: unverified
  - id: endo.L05.041
    kind: table
    topic: treatment
    title: Chemotherapy regimens for NETs
    columns: [Regimen, Use]
    rows:
      - ["Streptozotocin + 5-FU and doxorubicin", "Response rate >50% in malignant NETs"]
      - ["Cisplatin/Paraplatin + etoposide", "Poorly differentiated foregut NETs"]
      - ["Temozolomide + thalidomide", "Listed regimen"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 86, quote: "For poorly differentiated NETs in foregut" }
    status: unverified
  # ---------- p86-87: targeted ----------
  - id: endo.L05.042
    kind: table
    topic: targeted
    title: Targeted agents in NETs
    columns: [Target, Agents]
    rows:
      - [VEGF inhibitors, "Bevacizumab, sunitinib, sorafenib, pazopanib"]
      - [mTOR inhibitor, Everolimus]
      - [IGF-1 targeting, AMG-479]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 86, quote: "VEGF Inhibitors Bevacizumab. Sunitinib. Sorafenib. Pazopanib. mTOR Inhibitor Everolimus." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.043
    kind: card
    topic: targeted
    front: Why are somatostatin receptors a good target in NETs?
    back: NETs express them highly, so targeting SST receptors gives both symptom and disease control.
    src: { page: 86, quote: "Targeting SST receptors provides symptom and disease control." }
    status: unverified
  - id: endo.L05.044
    kind: enumerate
    topic: targeted
    prompt: Enumerate the emerging targets in NETs.
    points: [mTOR, PI3K, VEGF inhibitors, Other antiangiogenic agents]
    pass: 3
    src: { page: 87, quote: "mTOR. PI3K. VEGF inhibitors. Other antiangiogenic agents. High potential for combination therapies." }
    status: unverified
  - id: endo.L05.045
    kind: order
    topic: targeted
    prompt: Order the signalling pathway from the somatostatin receptor to cell-cycle activation.
    steps: [SST receptor, G protein, PI3K, Akt, mTOR, "Cell-cycle activation, protein synthesis"]
    src: { page: 87, quote: "SST receptor → G protein → PI3K → Akt → mTOR → Cell cycle activation, protein synthesis." }
    status: unverified
  # ---------- p87-88: gastrinoma ----------
  - id: endo.L05.046
    kind: card
    topic: gastrinoma
    front: What causes Zollinger-Ellison syndrome, and where is the tumour?
    back: Over-secretion of gastrin by a gastrinoma; associated with islet-cell pancreatic tumours (usually multiple), occasionally duodenal.
    src: { page: 87, quote: "Associated with islet cell pancreatic tumors (usually multiple), occasionally duodenal." }
    status: unverified
  - id: endo.L05.047
    kind: cloze
    topic: gastrinoma
    text: "Gastrinoma: {{c1::20%}} with MEN-1; age at diagnosis about {{c2::50}}; males about 60%; metastasis in {{c3::60%}}."
    src: { page: 87, quote: "20% associated with MEN-1. Age at diagnosis: ~50 years. More common in males (~60%). Metastasis in 60% of patients." }
    status: unverified
    tags: [numbers, high-yield]
  - id: endo.L05.048
    kind: card
    topic: gastrinoma
    front: What is the outlook after complete resection of a gastrinoma?
    back: 10-year survival of 90%; less likely with a large primary tumour.
    src: { page: 87, quote: "Complete resection results in 10-year survival of 90% (less likely if large primary tumor)." }
    status: unverified
  - id: endo.L05.049
    kind: enumerate
    topic: gastrinoma
    prompt: Clinical picture of Zollinger-Ellison syndrome.
    points: [Reflux oesophagitis, Recurrent ulcers, "Diarrhoea (malabsorption)"]
    pass: 3
    src: { page: 87, quote: "Reflux esophagitis. Recurrent ulcers. Diarrhea (malabsorption)." }
    status: unverified
  - id: endo.L05.050
    kind: cloze
    topic: gastrinoma
    text: "Fasting gastrin must be measured off all antisecretory drugs: stop PPIs for {{c1::14 days}} and H2 blockers for {{c2::3 days}}."
    src: { page: 88, quote: "Stop PPIs for 14 days." }
    status: unverified
    tags: [numbers, high-yield]
  - id: endo.L05.051
    kind: cloze
    topic: gastrinoma
    text: "Gastrin {{c1::>250 pmol/L}} even on PPIs may indicate gastrinoma; gastric acid output is usually {{c2::>15 mEq/hr}}."
    src: { page: 88, quote: "Very high gastrin levels (>250 pmol/L) on PPIs may indicate gastrinoma. Gastric acid output usually >15 mEq/hr." }
    status: unverified
    tags: [numbers]
  - id: endo.L05.052
    kind: card
    topic: gastrinoma
    front: How is the secretin stimulation test done and read (endocrinology lecture)?
    back: 2 U/kg IV secretin; measure gastrin at 2, 5, 10 and 20 minutes. A rise of 50% or more confirms gastrinoma.
    src: { page: 88, quote: "Increase ≥50% confirms gastrinoma." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L05.053
    kind: card
    topic: gastrinoma
    front: Which imaging is most useful to find the primary gastrinoma and its metastases, and how does it look on MRI?
    back: Radiolabeled octreotide scanning. On MRI the primary is low signal on T1, high on T2, and enhances with gadolinium.
    src: { page: 88, quote: "Radiolabeled octreotide scanning: most useful for identifying primary tumor and metastases." }
    status: unverified
  - id: endo.L05.054
    kind: card
    topic: gastrinoma
    front: What does the intra-arterial calcium test show in gastrinoma localization?
    back: A doubling of the serum hormone level within 30 seconds.
    src: { page: 88, quote: "Intraarterial calcium: double serum hormone level in 30 seconds." }
    status: unverified
  - id: endo.L05.055
    kind: table
    topic: gastrinoma
    title: Treatment of Zollinger-Ellison syndrome
    columns: [Situation, Treatment]
    rows:
      - [Symptom control, "Acid antisecretory drugs; rarely somatostatin analogs"]
      - [Solitary tumour, Surgery may cure]
      - [Metastatic disease, "Somatostatin analogs, debulking surgery, interferon, chemotherapy, hepatic tumour embolization"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 88, quote: "Symptomatic control: acid antisecretory medications, rarely somatostatin analogs. Solitary tumors: surgery may cure." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.056
    kind: mcq
    topic: gastrinoma
    stem: A 48-year-old man has recurrent duodenal ulcers, reflux oesophagitis and chronic diarrhoea. He takes omeprazole. What should you do before measuring fasting gastrin?
    options: [Stop the PPI for 14 days, Stop the PPI for 3 days, Measure it now; PPIs do not affect gastrin, Switch to a double-dose PPI]
    answer: 0
    why:
      - "Correct: PPIs must be stopped 14 days before fasting gastrin."
      - "3 days is the washout for H2 blockers."
