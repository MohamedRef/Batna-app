        why: "الكتاب بيقسّمها لـ gastrointestinal (GI)، neuropsychiatric، cardiovascular، skeletal، renal. والصور في صفحات 123-126."
      - kind: reveal
        page: 122
        quote: "Renal:\n‐ Polyuria\n‐ Polydipsia\n‐ Renal calculi and nephrocalcinosis"
        prompt: "ليه الـ hypercalcaemia بتعمل polyuria؟ وده بيأثر على العلاج إزاي؟"
        answer: "التفسير المقبول (مش في الكتاب): الكالسيوم العالي بيقفل تأثير الـ ADH على الـ collecting duct، فالكلية متقدرش تركّز البول (nephrogenic diabetes insipidus). النتيجة **polyuria** و **polydipsia**، والمريض يتجفف، ومع الـ vomiting الجفاف يزيد. الجفاف بيقلل الـ GFR فالكلية تطلّع كالسيوم أقل، فالكالسيوم يعلى أكتر: **vicious circle**. علشان كده أول خطوة في العلاج (ص 127) هي ==0.9% saline== مش أي دوا."
