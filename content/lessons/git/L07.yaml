            <circle cx="150" cy="290" r="13" class="fg-acc"/>
            <text x="172" y="286" class="t-sm t-b">Brown, streaked</text>
            <text x="172" y="302" class="t-sm t-mut">rectosigmoid or anus</text>
          </svg>
      - kind: reveal
        page: 227
        quote: "Maroon stools imply a lesion in the right colon or small intestine."
        prompt: "ليه الـ maroon بالذات بيشاور على الـ right colon أو الـ small intestine؟"
        answer: |
          الكتاب: **maroon** = right colon أو small intestine، و **melena** = فوق الـ Treitz، و **large bright red** = colonic source.

          التفسير المقبول (مش في الكتاب): اللون **بيتدرّج** مع المسافة اللي الدم مشيها جوه الأمعاء. الـ right colon والـ small bowel في النص: الدم بيقعد وقت يكفي يغمّق شوية، بس مش يكفي يسودّ خالص زي اللي نازل من المعدة.
      - kind: explain
        page: 227
        title: "الأعراض بتشاور"
        quote: "Bloody diarrhea associated with cramping abdominal pain, urgency, or tenesmus is characteristic of inflammatory bowel disease, infectious colitis, or ischemic colitis."
        text: |
          - **Painless large-volume bleeding** ← غالبًا ==diverticular==.
          - **Bloody diarrhea** مع cramps أو urgency أو tenesmus ← **inflammatory bowel disease (IBD)** أو **infectious** أو **ischemic colitis**.

          وفي الكشف ما تنساش الـ **perianal area** لو شاكك في hemorrhoids.

          ليه الفرق ده؟ التفسير المقبول (مش في الكتاب): الـ diverticulum بينزف من شريان والجدار حواليه سليم، فمفيش ألم. أما في الـ colitis (IBD، infection، ischemia) فالجدار نفسه ملتهب: الـ cramps والـ urgency والـ tenesmus من الالتهاب، والإسهال الدموي من الغشا المتقرّح.
      - kind: check
        page: 227
        quote: "Painless large-volume bleeding usually suggests diverticular bleeding."
        question: "A 72-year-old passes a large volume of bright red blood per rectum with no pain. Pulse and BP are normal. Most likely cause?"
        options:
          - "Diverticular bleeding"
          - "Anal fissure"
