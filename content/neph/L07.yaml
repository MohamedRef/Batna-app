  - id: neph.L07.186
    kind: card
    topic: fabry
    front: Describe the angiokeratomas of Fabry disease.
    back: Dark-red macules or papules appearing in the second decade (may be the earliest sign), on the lower trunk, buttocks, hips, genitalia and upper thighs (angiokeratoma corporis diffusum).
    src: { page: 191, quote: "Angiokeratomas usually appear during the second decade of life and can be the earliest presentation of Fabry disease, presenting as dark-red macules or papules of variable size (Fig. 46.13), originally known as angiokeratoma corporis diffusum. Typical locations include the lower trunk, buttocks, hips, genitalia, and upper thighs. The number of lesions varies from none up to 40 and increase in size and number.43 On his-tologic examination, angiokeratomas consist of dilated small veins in the upper dermis, covered by hyperkeratotic epidermis. Telangiectasias may be noted, especially behind the ears." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.187
    kind: cloze
    topic: fabry
    text: "Corneal opacities ({{c1::verticillata}}) are seen on slit lamp in about {{c2::75%}} of affected men and women; cataracts in 23% of males and 10% of females."
    src: { page: 191, quote: "Characteristic corneal opacities are common in both men and women with Fabry disease, present in approximately 75% of affected men and women. These lesions, termed verticillata, are identified by slit-lamp examination and are whorls of whitish discoloration that radiate from the center of the cornea. Cataracts (23% of males and 10% of females) and dilated conjunctival or retinal vessels may be observed." }
    status: unverified
