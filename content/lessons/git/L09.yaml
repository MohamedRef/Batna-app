  - id: git.L09.lesson2
    title: "الأسباب والأعراض: من الإسهال لحد العضم"
    hook: "عيان ممكن ييجي بإسهال، أو ييجي بأنيميا وكسور ومفيش إسهال خالص. الاتنين malabsorption."
    minutes: 7
    pages: [249, 256]
    topics: [causes, classification, gi, extra, nutrients]
    goals:
      - "تقسّم أسباب الـ malabsorption حسب المرحلة"
      - "تعرف الأعراض المعوية وليه بتحصل"
      - "تربط كل عَرَض برّه الأمعاء بالـ nutrient الناقص"
    status: unverified
    steps:
      - kind: table
        page: 249
        quote: "soluble Vit. At the Middle part: protein, and at the distal part of terminal ileum absorption of bile salt, Vit. B 12 occurs. All intestine and colon: water and electrolytes absorption occurs. Causes of Malabsorption: table 1 The causes can be classified according to pathogenesis into: A. impaired digestion: due to many diseases: Exocrine pancreatic insufficiency as post pancreatectomy,chronic dvanced pancreatitis, pancreatic hemochro tosis."
        title: "الأسباب حسب الـ pathogenesis"
        columns: [Group, Examples]
        rows:
          - ["Impaired digestion", "Pancreatic insufficiency, low bile salts, gastric surgery, gastrinoma"]
          - ["Impaired absorption, inherited", "Glucose-galactose malabsorption, abetalipoproteinemia, cystinuria, Hartnup, sucrase-isomaltase"]
          - ["Impaired absorption, acquired", "Resection, celiac, tropical sprue, Crohn, lymphoma, amyloidosis, infections"]
          - ["Post-absorptive", "Lymphangiectasia, lymphoma"]
          - ["Other", "Cholestyramine, neomycin, colchicine, laxatives; CHF, carcinoid, diabetes, adrenal, thyroid"]
        hide: [[0, 1], [3, 1], [4, 1]]
      - kind: reveal
        page: 249
        quote: "Gastrinoma: due to the inactivation of the pancreatic enzymes by the hyperacidity stimulated by high gastrin level."
        prompt: "الـ gastrinoma ورم بيطلّع gastrin. إيه دخله بالـ steatorrhea؟"
        answer: "الـ **gastrin** العالي بيعمل **hyperacidity**، والحمض بيوصل الـ duodenum ويقفل الـ **pancreatic enzymes** (الـ lipase بيحب pH 8). فالدهون ما تتهضمش. افتكر الكلام ده من الدرس اللي فات."
      - kind: aside
        tone: trap
        page: 250
        quote: "Immunoglobulin A (IgA) deficiency (the most common immunodeficiency) is due to decreased or absent serum and intestinal IgA, which clinically appears similar to celiac disease and is unresponsive to a gluten-free diet."
        text: |
          عيان شكله **celiac** بالظبط، بس الـ **gluten-free diet** ما عملتش أي حاجة؟ فكّر في ==immunoglobulin A (IgA) deficiency== (أشهر immunodeficiency).

          وفي الأطفال: **autoimmune enteropathy** (antibodies ضد الـ enterocytes والـ goblet cells، وساعات islet و parietal cells) بتعمل **secretory diarrhea** و villous atrophy. و **acrodermatitis enteropathica**: عيب وراثي في امتصاص الـ **zinc**.
      - kind: sort
        page: 255
        quote: "Table 1: Classification of causes of intestinal malabsorption\nDiseases in which impaired intraluminal digestion is dominant\n  Pancreatic diseases (see Chapter 27)\n  Hepatobiliary disease\n  Postgastrectomy malabsorption\nDiseases in which impaired mucosal digestion, uptake, and transport are dominant\n  Celiac disease\n  Refractory sprue\n  Immunoproliferative small intestinal disease (IPSID) and lymphoma\n  Tropical sprue\n  Eosinophilic gastroenteritis\n  Systemic mastocytosis\n  Radiation enteritis\n  Amyloidosis\n  Whipple disease\n  Crohn disease (see Chapter 3)\n  Abetalipoproteinemia\n  Parasitic infestations\n  Carbohydrate intolerance\nDiseases and syndromes in which both impaired intraluminal digestion and mucosal function are often operative\n  Intestinal bacterial overgrowth\n  Short bowel syndrome\n  Gastrinoma (Zollinger-Ellison syndrome)\nDiseases or syndromes in which impaired postmucosal transport is dominant\n  Primary intestinal lymphangiectasia\n  Secondary intestinal lymphangiectasia"
        prompt: "Table 1: العطل الأساسي فين؟"
        bins: ["Intraluminal digestion", "Mucosal", "Postmucosal transport"]
        cards:
          - { text: "Chronic pancreatitis", bin: 0 }
          - { text: "Postgastrectomy", bin: 0 }
          - { text: "Hepatobiliary disease", bin: 0 }
          - { text: "Celiac disease", bin: 1 }
          - { text: "Whipple disease", bin: 1 }
          - { text: "Abetalipoproteinemia", bin: 1 }
          - { text: "Primary lymphangiectasia", bin: 2 }
          - { text: "Secondary lymphangiectasia", bin: 2 }
        why: "وفيه مجموعة رابعة في Table 1 بتعمل الاتنين (luminal و mucosal): **bacterial overgrowth**، **short bowel syndrome**، و **gastrinoma**."
      - kind: explain
        page: 250
        title: "الأعراض المعوية"
        quote: "Gastrointestinal manifestations—Depending on the nature of the disease process causing malabsorption and its extent. Diarrhea, weight loss, flatulence, abdominal bloating, abdominal cramps, and pain may be present."
        text: |
          **إسهال** (diarrhea)، **نزول وزن** (weight loss)، **غازات وانتفاخ** (flatulence، bloating)، و **مغص** (cramps).

          الـ stool mass جاي من: أكل ما اتمصّش، مية وأملاح من الـ mucosa الملتهبة، **fatty acids** البكتيريا بتحولها لـ hydroxy fatty acids، و **bile acids** بتخلي القولون يفرز مية.

          الغازات من **تخمير الكربوهيدرات** (خصوصًا مع الـ disaccharidase deficiency).
      - kind: aside
        tone: trap
        page: 250
        quote: "Diarrhea is a common complaint, the character and frequency of stools may vary considerably, ranging from over 10 watery stools per day to less than one voluminous putty-like stool, the latter causing some patients to complain of constipation. The stool mass is formed by unabsorbed nutrients, water and electrolytes secreted from the inflamed intestinal mucosa, unabsorbed fatty acids, converted to hydroxy- fatty acids by colonic flora, as well as unabsorbed bile acids impair absorption and induce secretion of water and electrolytes by the colon adding to stool mass."
        text: |
          مش كل malabsorption إسهال! ممكن **أكتر من 10 مرات مية** في اليوم، أو **أقل من مرة**: براز كبير زي **المعجون** (putty-like)، والعيان يقولك «عندي **إمساك**».
      - kind: table
        page: 251
        quote: "Abdominal painvary considerably among the various disease processes associated with intestinal malabsorption. For example, pain is common in patients with chronic pancreatitis or pancreatic cancer and Crohn disease, but it is absent in many patients with celiac disease or post gastrectomy malabsorption."
        title: "الألم: موجود ولا لأ؟"
        columns: [Pain, Diseases]
        rows:
          - ["Common", "Chronic pancreatitis, pancreatic cancer, Crohn disease"]
          - ["Often absent", "Celiac disease, postgastrectomy malabsorption"]
        hide: [[1, 1]]
      - kind: explain
        page: 251
        title: "برّه الأمعاء"
        quote: "Some patients with intestinal malabsorption present initially with symptoms or laboratory abnormalities that point to other organ systems in the absence of or overshadowing symptoms referable to the gastrointestinal tract. more patients with celiac disease present with anemia and osteopenic bone disease in the absence of significant gastrointestinal symptoms than present with classic gastrointestinal symptomatology. Microcytic, macrocytic, or dimorphic anemia may reflect impaired iron, folate, or vitamin B12 malabsorption."
        text: |
          عيانين **celiac** كتير بييجوا بـ ==anemia== و **osteopenic bone disease** **من غير** أعراض معوية تُذكر.

          - **Anemia**: microcytic (حديد)، macrocytic (folate أو B12)، أو dimorphic.
          - **نزيف و purpura**: نقص **vitamin K** (hypoprothrombinemia).
          - **العضم**: كالسيوم و vitamin D قليلين، والـ fatty acids بتمسك الكالسيوم في البراز، ولو طوّل: **secondary hyperparathyroidism**.
          - **Amenorrhea، infertility، impotence** من سوء التغذية.
          - **Edema وحتى ascites** من الـ **protein-losing enteropathy**.
      - kind: match
        page: 256
        quote: "Table 2: Clinical findings in intestinal malabsorption\n| Organ System | Clinical Feature | Cause |\n|---|---|---|\n| Gastrointestinal tract | Diarrhea | Nutrient malabsorption; small intestinal secretion of fluid and electrolytes; action of unabsorbed bile acids and hydroxy-fatty acids on colonic mucosa |\n| | Weight loss | Nutrient malabsorption; decreased dietary intake |\n| | Flatus | Bacterial fermentation of unabsorbed dietary carbohydrates |\n| | Abdominal pain | Distention of bowel, muscle spasm, serosal and peritoneal involvement by disease process |\n| | Glossitis, stomatitis, cheilosis | Iron, riboflavin, niacin deficiency |\n| Hematopoietic system | Anemia, microcytic | Iron, pyridoxine deficiency |\n| | Anemia, macrocytic | Folate, vitamin B12 deficiency |\n| | Bleeding | Vitamin K deficiency |\n| Musculoskeletal system | Osteopenic bone disease | Calcium, vitamin D malabsorption |\n| | Osteoarthropathy | Not known |\n| | Tetany | Calcium, magnesium, and vitamin D deficiency |\n| Endocrine system | Amenorrhea, impotence, infertility | Generalized malabsorption and malnutrition |\n| | Secondary hyperparathyroidism | Protracted calcium and vitamin D deficiency |\n| Skin | Purpura | Vitamin K deficiency |\n| | Follicular hyperkeratosis and dermatitis | Vitamin A, zinc, essential fatty acids, niacin deficiency |\n| | Edema | Protein-losing enteropathy, malabsorption of dietary protein |\n| | Hyperpigmentation | Secondary hypopituitarism and adrenal insufficiency |\n| | Vesicular eruption | Dermatitis herpetiformis |\n| Nervous system | Xerophthalmia, night blindness | Vitamin A deficiency |\n| | Peripheral neuropathy | Vitamin B12, thiamine deficiency |"
        prompt: "Table 2: وصّل كل عَرَض بسببه:"
        pairs:
          - ["Night blindness", "Vitamin A deficiency"]
          - ["Tetany", "Calcium, magnesium, vitamin D"]
          - ["Purpura", "Vitamin K deficiency"]
          - ["Glossitis, cheilosis", "Iron, riboflavin, niacin"]
