  # ------------------------------------------------------------------
  - id: hb.L10.lesson1
    title: "الكبد وقع فجأة: يعني إيه ALF؟"
    hook: "مريض كبده كان سليم الشهر اللي فات، والنهارده مش عارف اسمه. الساعة بتحسب من الصفار."
    minutes: 9
    pages: [172, 175]
    topics: [overview, definition, presentation]
    goals:
      - "تعرّف الـ ALF بالتلات features"
      - "تقسم hyperacute و acute و subacute بالأيام وتعرف الفرق في الصورة والـ prognosis"
      - "تعرف الاستثناءات اللي بتتحسب ALF رغم وجود مرض مزمن"
    status: unverified
    steps:
      - kind: explain
        page: 172
        title: "الصورة الكبيرة"
        quote: "The defining features of ALF are hepatic encephalopathy, coagulopathy, and jaundice in patients without underlying liver disease."
        text: |
          الـ **ALF** = syndrome فيه **rapidly progressive hepatic dysfunction** و mortality عالية.

          التلات **defining features**: **hepatic encephalopathy** + **coagulopathy** + **jaundice**، في مريض **مكانش عنده liver disease**.

          - أشهر الأسباب في أمريكا وأوروبا: **DILI** و **acetaminophen**. عندنا في الدول النامية: **acute viral hepatitis**.
          - أكتر حاجتين بيموّتوا: **cerebral edema** و **sepsis**.
          - **السبب** هو **strongest predictor of survival**: الـ acetaminophen والـ viral أحسن، والـ **Wilson** والأدوية التانية **وحشين جدًا**.
          - اللي ممكن يحتاج زرع: **حوّله بسرعة** لمركز زرع.
      - kind: check
        page: 172
        question: "What does the book name as the strongest predictor of survival in ALF?"
        options:
          - "The cause of ALF"
          - "Peak ALT"
          - "Serum ammonia"
          - "Patient age"
        answer: 0
        why:
          - "صح: **the cause of ALF is the strongest predictor of survival**."
          - "الـ ALT مش reliable، وبينزل مع موت الخلايا كمان."
          - "الـ ammonia >150 مرتبط بالـ ICP، بس مش الأقوى."
          - "السن جزء من الـ King's College، بس مش الأقوى."
      - kind: explain
        page: 173
        title: "من ALI لـ ALF"
        text: |
          البداية **acute liver injury (ALI)**: transaminases **2–3 أضعاف** + impaired function (**jaundice و coagulopathy**)، وده بييجي **قبل** الـ encephalopathy.

          **Trey and Davidson (1970)** سموها **fulminant liver failure**: **potentially reversible**، **HE خلال 8 أسابيع** من أول أعراض، و **مفيش liver disease قبلها**.

          في **1993** اتقسمت من **الصفار** لحد الـ **HE**. شوف الرسمة.
      - kind: figure
        page: 173
        title: "الساعة بتبدأ من الصفار"
        alt: "A timeline from jaundice at day 0: up to 7 days hyperacute, 8 to 28 days acute, 5 to 12 weeks subacute. Below, two panels. Hyperacute: very high INR and ALT, only mild bilirubin, organ failure common, recovers more often. Subacute: milder ALT, deep jaundice, ascites, spleen, shrinking liver, very poor once HE appears. Notes: IASL 1999 uses under 10 days, 10 to 30 days and 5 to 24 weeks; more than 28 weeks is chronic liver disease."
        caption: "المفارقة: الأسرع (**hyperacute**) هو اللي **بيخف أكتر**، والأبطأ (**subacute**) أول ما يعمل HE يبقى خطير جدًا."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
          <defs><marker id="L10a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
          <text x="165" y="20" text-anchor="middle" class="t-b">From jaundice to encephalopathy</text>
          <text x="165" y="38" text-anchor="middle" class="t-sm t-mut">O'Grady 1993 (the book's main scale)</text>
          <path d="M20 70H312" class="fg-arrow" marker-end="url(#L10a)"/>
          <circle cx="24" cy="70" r="6" class="fg-dot-acc"/>
          <text x="12" y="104" class="t-sm t-b">day 0: jaundice</text>
          <rect x="30" y="54" width="40" height="32" rx="4" class="fg-bad" opacity="0.9"/>
          <rect x="72" y="54" width="70" height="32" rx="4" class="fg-acc"/>
          <rect x="144" y="54" width="150" height="32" rx="4" class="fg-box"/>
          <text x="50" y="128" text-anchor="middle" class="t-sm t-b">≤ 7 d</text>
          <text x="107" y="128" text-anchor="middle" class="t-sm t-b">8-28 d</text>
          <text x="219" y="128" text-anchor="middle" class="t-sm t-b">5-12 weeks</text>
          <text x="50" y="144" text-anchor="middle" class="t-sm">hyperacute</text>
          <text x="107" y="144" text-anchor="middle" class="t-sm">acute</text>
          <text x="219" y="144" text-anchor="middle" class="t-sm">subacute</text>
          <path d="M12 164h306" class="fg-thin"/>
          <rect x="12" y="178" width="148" height="128" rx="8" class="fg-bad"/>
          <text x="86" y="198" text-anchor="middle" class="t-b">Hyperacute</text>
          <text x="20" y="218" class="t-sm">INR very high</text>
          <text x="20" y="234" class="t-sm">ALT very high</text>
          <text x="20" y="250" class="t-sm">bilirubin only mild</text>
          <text x="20" y="266" class="t-sm">organ failure common</text>
          <text x="20" y="290" class="t-sm t-b t-good">recovers more often</text>
          <rect x="170" y="178" width="148" height="128" rx="8" class="fg-box"/>
          <text x="244" y="198" text-anchor="middle" class="t-b">Subacute</text>
          <text x="178" y="218" class="t-sm">ALT milder</text>
          <text x="178" y="234" class="t-sm">deep jaundice</text>
          <text x="178" y="250" class="t-sm">ascites, spleen,</text>
          <text x="178" y="266" class="t-sm">shrinking liver</text>
          <text x="178" y="290" class="t-sm t-b t-bad">once HE: very poor</text>
          <text x="165" y="330" text-anchor="middle" class="t-sm t-mut">IASL 1999: &lt; 10 d, 10-30 d, 5-24 weeks</text>
          <text x="165" y="348" text-anchor="middle" class="t-sm t-mut">&gt; 28 weeks = chronic liver disease (book)</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 174
        text: |
          الـ **hyperacute** زي **حريقة كبيرة في مطبخ**: النار عالية ومرعبة (INR و ALT في السما، وأعضاء تانية بتتأثر)، بس الشقة لسه سليمة، ولو طفيتها بسرعة البيت يرجع.

          الـ **subacute** زي **نمل أبيض في الخشب**: هادي ومش باين (ALT معتدل)، بس لما الـ HE تظهر، يبقى الخشب كله اتاكل (shrinking liver، ascites).
      - kind: match
        page: 173
        prompt: "وصّل كل تقسيمة بالمدة بتاعتها:"
        pairs:
          - ["Hyperacute (1993)", "HE within 7 days of jaundice"]
          - ["Acute (1993)", "HE 8 to 28 days after jaundice"]
          - ["Subacute (1993)", "HE 5 to 12 weeks after jaundice"]
          - ["Fulminant ALF (IASL 1999)", "10 to 30 days"]
          - ["Chronic liver disease (book)", "More than 28 weeks"]
        why: "تقسيمة **1993** بالـ 7 و 28 يوم و 5–12 أسبوع. الـ **IASL 1999**: hyperacute <10 d، fulminant 10–30 d، subacute 5–24 weeks. وأكتر من **28 أسبوع** = chronic liver disease."
      - kind: update
        page: 173
        ref: "AASLD position paper on ALF 2011"
        text: |
          الـ AASLD بتعرّف الـ ALF بمرض **أقل من 26 أسبوع**، فيه فرق بسيط عن الـ 28 أسبوع اللي في الكتاب. في الامتحان اكتب **28 weeks** زي الكتاب.
      - kind: explain
        page: 174
        title: "الـ coagulopathy والـ HE"
        text: |
          - الـ coagulopathy: **PT** أو **INR** مطوّل، غالبًا **INR >1.5**. وكتير من الدكاترة بيفضّلوا **PT مقارن بالـ normal range بتاع المعمل** لأن الـ INR **not standardized**.
          - الـ jaundice والـ HE لازم يبقوا **clinically manifested**.
          - التغيرات الذهنية الأولى ممكن تبقى **subtle**، فلازم **تدوّر عليها بنفسك**.
          - في الـ subacute، الـ HE بتيجي **متأخر** ونافذة الزرع **قصيرة جدًا**؛ وفيه اقتراحات بـ **super urgent listing** مع **shrinking liver** حتى من غير HE واضحة.
      - kind: reveal
        page: 175
        prompt: "مريض عنده **Wilson** و splenomegaly، يعني عنده مرض مزمن واضح. ليه بنحسبه ALF؟"
        answer: |
          لأنه **بيشارك** الـ ALF في كل حاجة مهمة: **الـ poor prognosis**، الصورة الإكلينيكية لـ acute failure، والـ **significant coagulopathy و encephalopathy**.

          ونفس الفكرة في الـ **de novo autoimmune hepatitis** و **Budd-Chiari**: المرض المزمن مكانش متشخّص ومفيش cirrhosis.
      - kind: mnemonic
        page: 175
        word: "WAB"
        parts:
          - { key: "W", text: "Wilson disease (clear chronic disease with splenomegaly, often undiagnosed)" }
          - { key: "A", text: "Autoimmune hepatitis, acute de novo presentation" }
          - { key: "B", text: "Budd-Chiari syndrome" }
        hook: |
          **WAB** = «وَاب»، الـ VIPs اللي بيعدّوا من **البوّابة** من غير ما حد يسألهم «عندك مرض مزمن؟». الشرط العادي إن مفيش severe fibrosis أو cirrhosis قبل كده، وهما التلاتة الاستثناء.
      - kind: check
        page: 175
        question: "A man with known hepatitis B but no fibrosis or portal hypertension on imaging develops severe acute injury, HE and INR 3. How is he classified?"
        options:
          - "Acute liver failure"
          - "Acute-on-chronic liver failure"
          - "Decompensated cirrhosis"
          - "Not liver failure, because he has prior liver disease"
        answer: 0
        why:
          - "صح: الكتاب بيقول المرضى دول (fatty liver، HBV، HCV) **من غير overt fibrosis أو PH** بيتحسبوا **ALF**."
          - "الـ ACLF محتاجة chronic disease متقدم؛ وهنا مفيش fibrosis."
          - "مفيش cirrhosis أصلًا."
          - "وجود liver pathology من غير fibrosis مش بيمنع الـ ALF."
      - kind: try
        items: [hb.L10.001, hb.L10.011, hb.L10.022]
    recap:
      - "ALF = **HE + coagulopathy + jaundice** من غير liver disease سابق."
      - "1993: ≤7 d hyperacute، 8–28 d acute، 5–12 weeks subacute (من الصفار للـ HE)."
      - "Hyperacute: INR و ALT عاليين، bilirubin خفيف، بيخف أكتر. Subacute: صفار عميق، كبد بيصغر، خطير."
      - "INR غالبًا >1.5؛ دوّر على الـ subtle mental changes."
      - "الاستثناءات: **WAB** (Wilson، AIH، Budd-Chiari)."
    practice: [hb.L10.001, hb.L10.002, hb.L10.003, hb.L10.004, hb.L10.005, hb.L10.006, hb.L10.007, hb.L10.008, hb.L10.009, hb.L10.010, hb.L10.011, hb.L10.012, hb.L10.013, hb.L10.014, hb.L10.015, hb.L10.016, hb.L10.017, hb.L10.018, hb.L10.019, hb.L10.020, hb.L10.021, hb.L10.022, hb.L10.023, hb.L10.024, hb.L10.128, hb.L10.129, hb.L10.135, hb.L10.139]

