      - kind: check
        page: 212
        quote: "Deficiencies in iron, folate, vitamin B12, and fat-soluble vitamins (A, D, E, and K) are common, with resulting complications including anemia and osteoporosis. Because Crohn disease has a predilection for the ileum, bile salt reabsorption is frequently compromised. Resection of 50–100 cm of ileum typically causes bile salts to spill into the colon, resulting in a bile salt– induced diarrhea (responsive to bile acid sequestrants). If more than 100 cm of ileum is resected or diseased, reabsorption of bile salts may be so impaired that the total pool is depleted, causing fat maldigestion and steatorrhea."
        question: "After 130 cm of ileal resection, a patient has greasy stools that get worse on cholestyramine. Why?"
        options:
          - "The bile salt pool is depleted, so fat is maldigested"
          - "Bile salts are irritating the colon"
          - "He needs a higher sequestrant dose"
          - "Lactose intolerance"
        answer: 0
        why:
          - "صح: فوق 100 cm الـ pool خلص، والـ sequestrant بيسحب الباقي فيزوّد الـ steatorrhea."
          - "ده سيناريو الـ 50–100 cm."
          - "الـ sequestrant هنا بيضر، مش محتاج جرعة أعلى."
          - "الـ lactose intolerance إسهال مائي مش دهني."
      - kind: explain
        page: 212
        quote: "Small bowel bacterial overgrowth frequently complicates Crohn disease,"
        title: "الـ short gut والـ bacterial overgrowth"
        text: |
          الكتاب:
          - الـ **extensive small bowel disease أو resection** ممكن تعمل ==short gut syndrome==: نقص protein و calories و micronutrients، واعتماد على الـ **parenteral nutrition**.
          - الـ **small bowel bacterial overgrowth** بيحصل كتير، خصوصًا مع الـ **stricturing disease** أو بعد شيل الـ **ileocecal valve**.
          - ونقص الـ iron، folate، B12، والـ fat-soluble vitamins (A، D، E، K) شائع، ونتيجته anemia و **osteoporosis**.

          التفسير المقبول (مش في الكتاب): الـ ileocecal valve هي «البوابة» اللي بتمنع بكتيريا القولون الكتير ترجع للـ small bowel. لو اتشالت، أو لو فيه stricture بيخلّي الأكل يقعد ويركد، البكتيريا بتكتر فوق، وبتاكل الـ B12 وبتفكك الـ bile salts فيقل امتصاص الدهون. وعلشان كده الجراح في الـ Crohn بيحاول يشيل أقل حتة ممكنة: كل سنتي من الـ ileum ليه تمن.
      - kind: order
        page: 212
        quote: "Malabsorption of fatty acids predisposes patients with Crohn disease to renal calculi. Calcium readily binds unabsorbed fatty acids, allowing oxalate to be taken up by the bowel in greater quantity. Subsequent renal excretion of this excess oxalate promotes the precipitation of calcium oxalate calculi."
        prompt: "حصوة الكلى في الـ Crohn: رتّب الخطوات"
        steps:
          - "Fatty acids are not absorbed"
          - "Calcium binds the free fatty acids in the lumen"
          - "Oxalate is left free and absorbed more"
          - "Kidneys excrete excess oxalate"
          - "Calcium oxalate stones form"
        why: "الـ calcium عادة بيمسك الـ oxalate في الأمعاء فيخرج في البراز. لما الدهون تمسك الـ calcium، الـ oxalate بيفضل حر ويتمص، ويروح الكلى."
      - kind: aside
        tone: analogy
        page: 212
        quote: "Malabsorption of fatty acids predisposes patients with Crohn disease to renal calculi. Calcium readily binds unabsorbed fatty acids, allowing oxalate to be taken up by the bowel in greater quantity. Subsequent renal excretion of this excess oxalate promotes the precipitation of calcium oxalate calculi."
        text: |
          الـ calcium زي **أمين شرطة** واقف في الأمعاء ماسك الـ oxalate من إيده علشان ما يدخلش.

          جات الدهون اللي ما اتمصتش وشغلته (الـ calcium اتلزق فيها)، فالـ oxalate **هرب** واتمص، وراح عمل مشكلة في الكلى.
