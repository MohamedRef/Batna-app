      - kind: aside
        tone: tip
        page: 30
        text: |
          افتكرها زي **الفكّة**: 10، 15، 20، 25. كل خمسة kPa بتقولك حاجة جديدة.

          ولاحظ إن **الـ 15 والـ 20 لازم معاهم platelets أكتر من 150**. الرقم لوحده مش كفاية علشان تطمّن.
      - kind: reveal
        page: 35
        prompt: "ليه الـ **platelet count** بيدخل في قرار الـ CSPH والـ varices؟"
        answer: |
          لأن الـ portal hypertension بيعمل **splenomegaly**، والطحال الكبير بيحجز الصفايح (**hypersplenism**)، والكبد المتليف بيعمل **thrombopoietin** أقل.

          فالصفايح الواطية هي «بصمة» الضغط العالي في الدم. وعلشان كده الكتاب بيقول **platelet count و spleen size و spleen stiffness** كلهم additional NITs للـ CSPH.
      - kind: explain
        page: 35
        title: "Baveno: مين يعمل منظار؟"
        quote: "LSM by TE <20 kPa and platelet count >150 G/L (Baveno VI criteria) is a validated tool to rule-out high-risk varices"
        text: |
          - **LSM by TE > 20–25 kPa** بيشخّص **CSPH** في الـ cACLD. **أكتر من 20 kPa** = CSPH very likely (حوالي **90%**).
          - **Portosystemic collaterals** على الـ US أو CT أو MRI = **sign of CSPH**، ولازم تتكتب في التقرير.
          - **Baveno VI criteria:** لو **LSM < 20 kPa و platelets > 150 G/L**، الـ varices اللي محتاجة علاج **very unlikely (أقل من 5%)**: **ما تعملش screening endoscopy**، وأعد الـ LSM والـ platelets **كل سنة**.
          - لو واحد من الاتنين مش متحقق (LSM 20 أو أكتر أو platelets أقل من 150): **perform screening endoscopy**.
          - الـ criteria دي validated في الـ cACLD بسبب **untreated viral hepatitis، HIV-HCV، alcohol، NAFLD، PBC و PSC**.
          - **Spleen stiffness** ممكن تساعد في تقدير الـ high-risk varices (weak recommendation).
