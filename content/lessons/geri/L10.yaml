  - id: geri.L10.lesson4
    title: "من الـ spirometry للـ nintedanib"
    hook: "مريض عنده definite UIP على الـ HRCT؟ مبروك، مش محتاج biopsy. الدرس ده بيقولك إمتى تقطع وإمتى لأ."
    minutes: 10
    pages: [181, 187]
    topics: [diagnosis, treatment]
    goals:
      - "تقرا الـ spirometry وتعرف تأكد الـ restriction"
      - "تمشي في خطوات guideline 2018 لحد العلاج"
      - "تعرف علاج الـ IPF واللي ممنوع، وعلاج الـ non-idiopathic"
    status: unverified
    steps:
      - kind: table
        page: 181
        quote: "c) Restrictive Pattern ……. < LLN ……. > 70%"
        title: "أنماط الـ PFT"
        columns: ["Pattern", "FVC", "FEV1/FVC"]
        rows:
          - ["Normal", "> LLN", "> 70%"]
          - ["Obstructive", "> LLN", "< 70%"]
          - ["Restrictive", "< LLN", "> 70%"]
          - ["Mixed", "< LLN", "< 70%"]
        hide: [[1, 2], [2, 1], [2, 2], [3, 1]]
      - kind: explain
        page: 181
        quote: "Restrictive Lung Disease is confirmed by presence of: Diminshed CO diffusion capacity And TLC < LLN."
        title: "Restrictive؟ أكّد"
        text: |
          الـ dyspnea اللي بتزيد ليها أسباب: cardiac، anemia، metabolic، و chest (ILD أو COPD). الـ PFT بتفرّق: الـ ILD **restrictive** والـ COPD **obstructive**.

          لو طلع restrictive: اعمل **DLCO** و full PFT للـ **TLC**. الـ ==restrictive lung disease== بيتأكد بـ **DLCO قليل + TLC < LLN**.

          ليه؟ الـ FVC بيقل لأسباب كتير (ضعف عضلات، تخن)، بس الـ TLC الواطي هو اللي بيقول الرئة نفسها صغرت، والـ DLCO الواطي بيقول الـ interstitium تخين.
      - kind: explain
        page: 181
        quote: "Therefore, a normal chest X-ray Does NOT exclude interstitial lung disease."
        title: "X-ray و HRCT"
        text: |
          - الـ X-ray: **reticular و/أو nodular opacities** هي الـ hallmark؛ الـ honeycombing متأخر.
          - الـ X-ray ممكن يبقى **طبيعي في 10%** من الـ ILD المثبتة بالـ histology، فالـ ==normal chest X-ray== **مش بينفي** ILD.
          - الـ **HRCT** أحسّ، وممكن يدّي findings مميزة وساعات تشخيصية.
      - kind: check
        page: 181
        quote: "c) Restrictive Pattern ……. < LLN ……. > 70%"
        question: "FVC below LLN and FEV1/FVC 85%. Which pattern?"
        options: ["Restrictive", "Obstructive", "Mixed", "Normal"]
        answer: 0
        why:
          - "صح: FVC واطي و ratio فوق 70%."
          - "الـ obstructive الـ ratio فيه تحت 70% والـ FVC طبيعي."
          - "الـ mixed الاتنين واطيين."
          - "الـ FVC هنا تحت الـ LLN."
