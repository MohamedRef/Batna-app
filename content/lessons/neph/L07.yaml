        text: "الكتاب بيقول الـ tolvaptan **مش معتمد في أمريكا**. الـ US Food and Drug Administration (FDA) وافقت عليه (Jynarque) في **أبريل 2018** للكبار اللي عندهم ADPKD سريع، مع متابعة الكبد. في امتحان القسم اكتب كلام الكتاب."
