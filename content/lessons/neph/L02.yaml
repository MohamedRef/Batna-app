        quote: "Avoiding any combination of ACEi, ARB, and direct renin inhibitor (DRI)"
        title: "ليه ممنوع الجمع، وليه نكمّل تحت 30؟"
        text: |
          - **ممنوع ACEi + ARB + DRI** (1B). التفسير المقبول (مش في الكتاب): التلاتة بيقفلوا **نفس السكة**، فالجمع مابيزوّدش حماية للكلية، بس بيزوّد الـ ==hyperkalemia== والـ AKI والـ hypotension.
          - **أعلى dose متحمّلة**: الحماية بتزيد مع الجرعة، مش بس الضغط.
          - **كمّل تحت eGFR 30** (الكتاب): التفسير المقبول إن الكلية اللي فاضل منها قليل هي اللي محتاجة الحماية أكتر، والـ dip الأولاني مش ضرر.
          - **وقّف أو قلّل** في الـ hypotension بأعراض، أو hyperkalemia مش متحكم فيها، أو eGFR < 15 علشان الـ uremic symptoms: هنا الضرر بقى أكبر من الفايدة.
