      - kind: explain
        page: 228
        title: "ليه الـ classes مترتبة كده؟"
        quote: "Abbreviated International Society of Nephrology/Renal Pathology Society (ISN/RPS) classification of lupus nephritis (2003)"
        text: |
          الـ **ISN/RPS 2003** classes مش أرقام عشوائية؛ هي ماشية مع **مكان الـ immune deposits**:
          - **Class I و II**: deposits في الـ ==mesangium== بس.
          - **Class III و IV**: **subendothelial** deposits مع endo- أو extracapillary GN؛ III لو أقل من 50% من الـ glomeruli، و IV لو 50% أو أكتر.
          - **Class V**: **subepithelial** deposits (membranous).
          - **Class VI**: ==90% أو أكتر globally sclerosed== من غير activity.

          والكتاب بيقسم III و IV كمان لـ **(A) active**، **(C) chronic**، و **(A/C)**، وبيطلب التقرير **يقول ويدرّج** (mild، moderate، severe) الـ **tubular atrophy**، والـ **interstitial inflammation** والـ **fibrosis**، والـ **arteriosclerosis** أو أي vascular lesion.

          ليه؟ التفسير المقبول (مش في الكتاب): الـ mesangial deposits بعيدة عن الـ capillary lumen فالالتهاب خفيف (I و II نادرًا محتاجين immunosuppression قوي). الـ **subendothelial** قريبة من الدم، فبتجيب leukocytes و necrosis و crescents، وعلشان كده III و IV هما اللي بياخدوا العلاج القوي. الـ **subepithelial** بتعمل proteinuria زي الـ membranous. والـ VI ندبة، والـ immunosuppression ما بيرجّعش ندبة. وده نفس سبب الـ A و C: الـ **active** بيتعالج، والـ **chronic** لأ؛ يعني الـ class والـ A/C هما اللي بيقرروا الدوا.

          ليه الـ class بيغيّر العلاج؟ التفسير المقبول (مش في الكتاب): الـ I و II في الـ mesangium بعيد عن الدم والفلتر، فغالبًا مش محتاجين IS قوي. الـ III و IV الـ deposits تحت الـ endothelium جنب الدم، فبتنده التهاب وتكسر الـ capillaries، فهما اللي محتاجين induction (steroids مع MMF أو cyclophosphamide). الـ V زي الـ membranous، proteinuria من غير التهاب كبير. والـ VI ندبة، فالعلاج هنا لـ dialysis أو transplant، مش IS.
