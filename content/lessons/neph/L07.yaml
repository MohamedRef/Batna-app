      - kind: explain
        page: 190
        title: "القلب والأعصاب والجلد والعين"
        quote: "Nervous system Autonomic dysfunction is a prominent feature of Fabry disease, typi-cally manifested by hypohidrosis, acral paresthesias and pain, and altered intestinal motility. Cerebrovascular symptoms (secondary to narrowing of the vascular lumen from accumulation of glycosphingolipid in vas-cular endothelial cells) tend to appear during the fourth decade and include hemiparesis, vertigo, diplopia, dysarthria, nystagmus, nausea and vomiting, headache, ataxia, and memory loss. The vertebrobasilar circulation is preferentially involved. Symptoms are often recurrent. Life-threatening intra cerebral hemorrhage and infarction are not unusual."
        text: |
          - **القلب**: coronary narrowing (angina، myocardial infarction (MI)، heart failure (HF))، ==left ventricular hypertrophy (LVH) بدري== (وممكن isolated)، arrhythmias، و valves.
          - **Autonomic**: **hypohidrosis**، acral paresthesias، و motility.
          - **المخ**: من العقد الرابع، والـ ==vertebrobasilar== الأكتر: vertigo، diplopia، dysarthria، ataxia، ونزيف أو infarction.
          - **الجلد**: **angiokeratomas** في العقد التاني (ممكن أول علامة)، أحمر غامق، في **lower trunk والأرداف والـ genitalia**.
          - **العين**: **verticillata** (corneal whorls) في **75%** من الرجالة والستات، cataract 23% رجالة.

          ليه كل الأعضاء دي؟ التفسير المقبول (مش في الكتاب): الـ Gb3 بيتراكم في الـ endothelium في كل الجسم، فالأوعية تضيق (angina، stroke)، وفي عضلة القلب (LVH)، وفي الأعصاب الصغيرة (الألم وقلة العرق). وليه الـ vertebrobasilar بالذات؟ لأن الشرايين دي بتتمدد وتلتوي (dolichoectasia) أكتر. يعني مرض واحد في الـ lysosome بيعمل صورة متعددة الأجهزة.
      - kind: explain
        page: 190
        title: "ليه القلب والمخ؟"
        quote: "Glycosphingolipid accumulation in coronary artery endothelial cells and in the myocardium results in coronary artery narrowing, which may lead to angina, myocardial infarction, or congestive heart failure."
        text: |
          الكتاب بيدّي الآلية صريحة: الـ glycosphingolipid بيتجمع في ==الـ endothelial cells== بتاعة الأوعية:

          - **Coronaries** بتضيق ← angina، MI، heart failure.
          - **Myocardium** نفسه ← **LVH** بدري، وممكن الصورة كلها **isolated LVH** في بعض الـ missense mutations.
          - **Conduction system** ← arrhythmias.
          - **أوعية المخ** بتضيق ← أعراض من **العقد الرابع**، والـ ==vertebrobasilar== الأكتر، ونزيف أو infarction. ومع الأوعية الصغيرة: **dementia**.

          **يعني** الـ Fabry في الأساس **مرض أوعية**، وعلشان كده الموت في الآخر من القلب والمخ حتى بعد ما الكلية تتعالج.
      - kind: explain
        page: 191
        title: "الجلد والعين: أول علامة ممكن تبان"
        quote: "On his-tologic examination, angiokeratomas consist of dilated small veins in the upper dermis, covered by hyperkeratotic epidermis."
        text: |
          **الجلد** (من الكتاب):
          - الـ ==angiokeratomas== بتظهر في **العقد التاني** وممكن تبقى **أول** علامة.
          - macules أو papules **أحمر غامق**، من صفر لـ **40** وبتزيد عددًا وحجمًا.
          - أماكنها: **lower trunk، الأرداف، الـ hips، الـ genitalia، وأعلى الفخدين** (الاسم القديم angiokeratoma corporis diffusum).
          - تحت الميكروسكوب: **أوردة صغيرة موسّعة** في الـ upper dermis تحت **epidermis سميك (hyperkeratotic)**. وده **السبب** إنها حمرا وبارزة شوية.
          - **Telangiectasias** خصوصًا ورا الودان.

          **العين**:
          - الـ ==verticillata== في **75%** من الرجالة والستات: **whorls** بيضا طالعة من نص القرنية، بتتشاف بالـ **slit lamp**.
          - **Cataract** في 23% من الرجالة و 10% من الستات، وأوعية موسّعة في الـ conjunctiva أو الـ retina.

          ومعنى إن الـ verticillata موجودة في الستات كمان: الـ slit lamp مفيد جدًا لما الإنزيم مش حاسم.
      - kind: figure
        page: 191
        quote: "On his-tologic examination, angiokeratomas consist of dilated small veins in the upper dermis, covered by hyperkeratotic epidermis."
        title: "Angiokeratoma في الـ Fabry"
        image: { file: neph/L07-angiokeratoma.webp, book: true }
        alt: "Book photograph of skin with a cluster of dark red pinpoint papules and a larger dark red lesion in the centre: angiokeratomas."
        caption: |
          جلد فيه ==نقط حمرا غامقة صغيرة كتير== حوالين بقعة أكبر غامقة في النص.

          دي الـ **angiokeratomas**: أوردة صغيرة موسّعة تحت epidermis سميك، وممكن تبقى ==أول علامة== في الـ Fabry، في الـ lower trunk والأرداف والفخدين.
      - kind: explain
        page: 192
        title: "التشخيص والعلاج"
        quote: "Diagnosis of affected males usually can be made clinically, with the additional information from slit-lamp eye examination to identify corneal opacities. The diagnosis should be confirmed by demonstrating decreased (<15%) or absent a-Gal A activity in serum, leukocytes, cultured skin fibroblasts, or tissue. Atypical variants may have enzyme activity up to carriers. If enzyme levels are equivocal, alternative approaches to diagnosis include careful slit-lamp eye examination, measurement of urinary ceramide digalactoside and trihexoside, and genetic testing."
        text: |
          **التشخيص**: الراجل غالبًا إكلينيكي + **slit lamp**. التأكيد: ==α-Gal A activity أقل من 15% أو مش موجود==. لو مش واضح: slit lamp، urinary ceramide di/trihexoside، و genetic testing.

          **العلاج**: ==agalsidase== (enzyme replacement): Gb3 يقل، الألم يتحسن، الـ deposits تتشال، والكلية تستقر 1–2 سنة. + **renin–angiotensin system (RAS) blockade** للـ proteinuria. بيتدي **أثناء الـ hemodialysis** (الغسيل مش بيشيله). لكل الرجالة والستات اللي عندهم أعراض، بس **غالي جدًا**.

          **الزرع**: بيعالج الكلية بس مش الباقي؛ الموت من القلب والمخ. و ==الـ heterozygotes ما يتبرعوش==.

          ليه الإنزيم بيشتغل في الراجل ومش كفاية في الست؟ التفسير المقبول (مش في الكتاب): الراجل عنده X واحدة فالإنزيم شبه مختفي، فقياسه بيشخّص. الست عندها X سليمة فالإنزيم ممكن يطلع طبيعي رغم المرض، فبنحتاج genetic testing. وليه بيتدي أثناء الـ hemodialysis؟ لأن الجزيء كبير والغسيل مش بيشيله، فالمريض بياخده وهو قاعد أصلًا من غير زيارة زيادة.
      - kind: update
        page: 192
        quote: "Agalsidase therapy has been recommended for all affected males and symptomatic carrier females, but the drug is prohibitively expensive."
        text: "الكتاب بيقدّم الـ agalsidase كأنه العلاج الخاص الوحيد، بس دلوقتي فيه **migalastat** بالبُق (pharmacological chaperone) للكبار اللي عندهم GLA variant ==amenable== (EMA 2016، FDA 2018)، و **pegunigalsidase alfa** كـ enzyme replacement therapy (ERT) اتوافق عليه سنة 2023. الاختيار حسب الـ genotype والـ eGFR. في الامتحان اكتب إجابة الكتاب: **agalsidase**."
