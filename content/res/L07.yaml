    src: { page: 96, quote: "Checklist approach, Users' Guides for an Article About Therapy:\n  Are the results valid?\n    Did experimental and control groups begin the study with a similar prognosis? Were patients randomized? Was randomization concealed (blinded or masked)? Were patients analyzed in the groups to which they were randomized? Were patients in the treatment and control groups similar with respect to known prognostic factors?\n    Did experimental and control groups retain a similar prognosis after the study started? Were patients aware of group allocation? Were clinicians aware of group allocation? Were outcome assessors aware of group allocation? Was follow-up complete?\n  What are the results?\n    How large was the treatment effect?\n    How precise was the estimate of the treatment effect?\n  How can I apply the results to patient care?\n    Were the study patients similar to my patient?\n    Were all clinically important outcomes considered?\n    Are the likely treatment benefits worth the potential harm and costs?" }
