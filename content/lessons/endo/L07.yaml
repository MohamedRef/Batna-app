  - id: endo.L07.lesson4
    title: "الكالسيوم: واطي يشنّج، عالي يكسّر"
    hook: "\"Stones, bones, groans and psychic moans\" على ناحية، وحنجرة مقفولة بـ tetany على الناحية التانية."
    minutes: 10
    pages: [118, 128]
    topics: [hypocalcemia, hypercalcemia]
    goals:
      - "تعالج الـ hypocalcaemia الحادة بالجرعات"
      - "تعرف أسباب ومظاهر الـ hypercalcaemia"
      - "ترتّب علاج الـ hypercalcaemic crisis"
    status: unverified
    steps:
      - kind: explain
        page: 118
        quote: "More commonly due to vitamin d deficiency."
        title: "الـ hypocalcaemia: ليه؟"
        text: |
          - **Low PTH** بعد عمليات الـ thyroid أو parathyroid أو neck.
          - Autoimmune، renal disease.
          - والأشيع: ==vitamin D deficiency==.
          - وأحيانًا **low magnesium**: diuretics، chronic diarrhoea، malabsorption.
      - kind: explain
