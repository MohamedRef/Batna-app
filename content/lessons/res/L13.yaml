        quote: "Discussion\nConclusion\nGood discussion should be structured to include the following six components:\n3. Strengths and weaknesses in relation to other studies:\nAuthors should avoid burying the citation of a previously published paper on the same question, which arrived at the same answer in the discussion. Such a citation is better highlighted in the introduction."
        question: "An earlier paper on the same question reached the same answer as yours. Where should you cite it?"
