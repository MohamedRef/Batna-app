          - **Beta-blockers في الـ asthma/COPD:** بيقفلوا β2 في الشعب، **فـ** bronchospasm. وفي الـ **heart block** بيبطّأوا التوصيل أكتر.
          - **Verapamil مع beta-blocker:** الاتنين بيبطّأوا القلب والـ AV node، **فـ** ممكن bradycardia شديدة أو block.
          - **ACEi/ARB في الحمل:** بيأذوا كلية الجنين.
          - **Spironolactone و hyperkalaemia:** بيقفل الـ aldosterone اللي بيطلّع الـ K.
          - **Alpha-blockers في الـ BPH:** بيرخّوا عضلة البروستاتا، **فـ** البول يمشي أحسن.
          - **Methyldopa في الحمل:** أقدم دوا وأماناته على الجنين معروفة، **عشان** كده مفضّل.
