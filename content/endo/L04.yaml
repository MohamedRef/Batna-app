items:
  # ---------- p43-44: cardiovascular hormones ----------
  - id: endo.L04.001
    kind: card
    topic: cv-hormones
    front: Besides pumping, what role does the heart now have according to the book?
    back: It makes cardiovascular hormones; three families are potent regulators of cardiovascular and renal function.
    src: { page: 43, quote: "three families of cardiovascular hormones have proven to be potent regulators of cardiovascular and renal function" }
    status: unverified
  - id: endo.L04.002
    kind: card
    topic: cv-hormones
    front: In what modes do the cardiovascular hormones act?
    back: As true endocrine hormones or as autocrine/paracrine hormones, with many physiological and pathological actions.
    src: { page: 43, quote: "Acting as either true endocrine or autocrine/paracrine hormones" }
    status: unverified
  - id: endo.L04.003
    kind: enumerate
    topic: cv-hormones
    prompt: The cardiovascular hormones in the book's diagram.
    points:
      - Natriuretic peptides
      - Endothelins
      - Adrenomedullin
      - Nitric oxide (NO), shown with the endothelins
    pass: 3
    src: { page: 43, quote: "Natriuretic peptides Adrenomedullin Endothelins Nitric oxide(NO)" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.004
    kind: table
    topic: cv-hormones
    title: The natriuretic peptides and where they come from
    columns: [Peptide, Secreted by]
    rows:
      - [Atrial natriuretic peptide (ANP), The heart]
      - [Brain natriuretic peptide (BNP), The heart]
      - [C-type natriuretic peptide (CNP), The endothelium]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 43, quote: "atrial natriuretic peptide brain natriuretic C-type Secreted by the heart Secreted by endothelium" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.005
    kind: cloze
    topic: cv-hormones
    text: ANP and BNP are secreted by the {{c1::heart}}, while C-type natriuretic peptide is secreted by the {{c2::endothelium}}.
    src: { page: 43, quote: "Secreted by the heart Secreted by endothelium" }
    status: unverified
  - id: endo.L04.006
    kind: enumerate
    topic: cv-hormones
    prompt: Hormones of the endothelium (book diagram).
    points:
      - Endothelins (ET-1, ET-2, ET-3)
      - C-type natriuretic peptide
      - Nitric oxide (NO)
    pass: 3
    src: { page: 44, quote: "Hormones of the Endothelium ENDOTHELINS C-type natriuretic Nitric oxide (NO) ET-1 ET-2 ET-3" }
    status: unverified
  - id: endo.L04.007
    kind: cloze
    topic: cv-hormones
    text: The endothelin family has {{c1::three}} members, ET-1, ET-2 and ET-3.
    src: { page: 44, quote: "ENDOTHELINS ET-1 ET-2 ET-3" }
    status: unverified
  - id: endo.L04.008
    kind: card
    topic: cv-hormones
    front: What do the endothelins do, and on which cells?
    back: They are potent hypertensive agents acting directly on vascular smooth muscle cells (VSMCs).
    src: { page: 44, quote: "The ETs are potent hypertensive agents that exert their effects directly on the VSMCs" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.009
    kind: card
    topic: cv-hormones
    front: Where is adrenomedullin (AM) produced?
    back: In normal chromaffin cells of the adrenal gland, and also in brain, kidney, endothelial cells and VSMCs.
    src: { page: 44, quote: "produced in normal chromaffin cells of the adrenal gland, as well as a variety of other tissues" }
    status: unverified
  - id: endo.L04.010
    kind: card
    topic: cv-hormones
    front: Which hypotensive states may adrenomedullin be responsible for?
    back: The hypotension of inflammation, septic shock and atherosclerosis.
    src: { page: 44, quote: "AM may be responsible for the hypotension of inflammation, septic shock, and atherosclerosis." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.011
    kind: cloze
    topic: cv-hormones
    text: The actions of adrenomedullin may be predominantly {{c1::autocrine or paracrine}}.
    src: { page: 44, quote: "The actions of AM may be predominantly autocrine or paracrine in nature." }
    status: unverified
  # ---------- p44, p72: oestrogen ----------
  - id: endo.L04.012
    kind: enumerate
    topic: oestrogen
    prompt: Beneficial effects of oestrogen on the cardiovascular system.
    points:
      - Increases HDL cholesterol
      - Decreases LDL cholesterol
      - Relaxes smooth muscle and dilates vessels, so blood flow increases
    pass: 3
    src: { page: 44, quote: "Increases HDL cholesterol. Decreases LDL cholesterol. Relaxes, smooth muscles and dilates blood vessels so blood flow increases." }
    status: unverified
  - id: endo.L04.013
    kind: card
    topic: oestrogen
    front: Which effect of oestrogen works against its cardiovascular benefit?
    back: It promotes blood clot formation (increases coagulability).
    src: { page: 44, quote: "It causes some changes that have the opposite effect: Promotes blood clot formation." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.014
    kind: enumerate
    topic: oestrogen
    prompt: Oestrogen's cardioprotective effects (book list).
    points:
      - Antioxidant
      - Calcium-channel blocker
      - Lowers LDL
      - Raises HDL
    pass: 3
    src: { page: 44, quote: "Estrogen cardioprotective effct Anti-oxidant. Ca – channel blocker." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.015
    kind: cloze
    topic: oestrogen
    text: Oestrogen soaks up {{c1::free radicals}}, particles in the blood that can damage the arteries.
    src: { page: 44, quote: "Soaks up free radicals, naturally occurring particles in the blood that can damage the arteries and other tissues." }
    status: unverified
  - id: endo.L04.016
    kind: card
    topic: oestrogen
    front: Besides lipids, what two other effects of oestrogen does the book list on p72?
    back: It increases triglycerides slightly and increases blood coagulability.
    src: { page: 72, quote: "It increases TG slightly. It increases blood coaguablity." }
    status: unverified
  - id: endo.L04.017
    kind: cloze
    topic: oestrogen
    text: Oestrogen protects against atherogenesis because it {{c1::reduces LDL}} and {{c2::increases HDL}}.
    src: { page: 72, quote: "Estrogen-mediated protection against atherogenesis It reduces LDL It increases HDL." }
    status: unverified
  # ---------- p45: heart failure ----------
  - id: endo.L04.018
    kind: enumerate
    topic: heart-failure
    prompt: Hormones activated in heart failure.
    points:
      - Renin-angiotensin system
      - Aldosterone
      - Sympathetic system (noradrenaline)
      - Neuropeptide Y
    pass: 4
    src: { page: 45, quote: "1- Activation of the renin-angiotensin system" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.019
    kind: card
    topic: heart-failure
    front: What renin finding is described in heart failure?
    back: Abnormally high renin levels in renal venous blood.
    src: { page: 45, quote: "Abnormally high renin levels in renal venous blood in patients with heart failure." }
    status: unverified
  - id: endo.L04.020
    kind: card
    topic: heart-failure
    front: Why is venous plasma noradrenaline useful in heart failure?
    back: It is an index of global sympathetic outflow and predicts prognosis; very high levels mean a worse prognosis.
    src: { page: 45, quote: "Plasma noradrenaline levels, which are often taken as an index of \"global sympathetic outflow\" have been shown to predict prognosis." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.021
    kind: cloze
    topic: heart-failure
    text: Heart failure patients with extremely high venous {{c1::noradrenaline}} levels have a {{c2::worse}} prognosis as a group.
    src: { page: 45, quote: "patients with extremely high venous noradrenaline levels have a worse prognosis as a group than do those with normal levels" }
    status: unverified
  - id: endo.L04.022
    kind: card
    topic: heart-failure
    front: What is neuropeptide Y, and what does its plasma level track in heart failure?
    back: A potent vasoconstrictor in the coronary circulation; its immunoreactivity correlates with plasma noradrenaline.
    src: { page: 45, quote: "a potent vasoconstrictor in the coronary circulation" }
    status: unverified
  # ---------- p45-47 (repeated p71-73): thyroid and heart ----------
  - id: endo.L04.023
    kind: card
    topic: thyroid-heart
    front: How do thyroid disorders affect patients who already have heart disease?
    back: They can worsen old cardiac symptoms, cause new ones and accelerate the underlying heart problem.
    src: { page: 45, quote: "disorders of the thyroid gland can worsen old cardiac symptoms or cause new ones, and can accelerate the underlying heart problem" }
    status: unverified
  - id: endo.L04.024
    kind: card
    topic: thyroid-heart
    front: Which phases of the cardiac cycle are weakened in hypothyroidism?
    back: Both contraction (systolic dysfunction, reduced ejection) and relaxation (diastolic dysfunction).
    src: { page: 46, quote: "In hypothyroidism the heart muscle is weakened in both its contraction phase, and also its relaxation phase." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.025
    kind: cloze
    topic: thyroid-heart
    text: In hypothyroidism the heart muscle does not relax normally between beats, causing {{c1::diastolic dysfunction}}; reduced ejection is {{c2::systolic dysfunction}}.
    src: { page: 46, quote: "because the heart muscle does not relax normally in between heart beats, a potentially serious condition called diastolic dysfunction may result" }
    status: unverified
  - id: endo.L04.026
    kind: cloze
    topic: thyroid-heart
    text: In hypothyroidism the heart rate is typically {{c1::10–20}} beats per minute slower than normal.
    src: { page: 46, quote: "the heart rate is typically 10 - 20 beats per minute slower than normal" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.027
    kind: card
    topic: thyroid-heart
    front: Despite bradycardia, which arrhythmias can hypothyroidism make worse?
    back: Premature beats such as PVCs, and even tachycardias such as atrial fibrillation.
    src: { page: 46, quote: "hypothyroidism may worsen the tendency for premature beats (such as pvcs) and even tachycardias such as atrial fibrillation" }
    status: unverified
  - id: endo.L04.028
    kind: enumerate
    topic: thyroid-heart
    prompt: Mechanisms of diastolic hypertension in hypothyroidism.
    points:
      - Stiffer arteries from less nitric oxide in the vessel lining
      - Increased sympathetic activity in vascular smooth muscle; fewer β-receptors, so α-responses dominate
      - Extracellular volume expansion (SIAD) and increased systemic vascular resistance
    pass: 3
    src: { page: 46, quote: "Because the arteries are stiffer in hypothyroidism, (dt reduction of the amount of nitric oxide in the lining of the blood vessels" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.029
    kind: cloze
    topic: thyroid-heart
    text: Arteries are stiffer in hypothyroidism because of reduced {{c1::nitric oxide}} in the vessel lining, which raises the {{c2::diastolic}} blood pressure.
    src: { page: 46, quote: "causing them to be stiff this leads to increase in the diastolic blood pressure" }
    status: unverified
  - id: endo.L04.030
    kind: cloze
    topic: thyroid-heart
    text: In hypothyroidism the number of {{c1::β-adrenergic}} receptors falls, leading to increased {{c2::α-adrenergic}} responses.
    src: { page: 46, quote: "The number of ß-adrenergic receptors is decreased, leading to increased alpha-adrenergic responses" }
    status: unverified
  - id: endo.L04.031
    kind: cloze
    topic: thyroid-heart
    text: In {{c1::32%}} of hypertensive hypothyroid patients, thyroxine replacement lowers diastolic pressure to {{c2::90 mm Hg}} or less.
    src: { page: 46, quote: "In 32% of hypertensive hypothyroid patients, replacement therapy with thyroxine leads to a fall in diastolic blood pressure to 90 mm Hg or less" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.032
    kind: card
    topic: thyroid-heart
    front: Which volume mechanism contributes to diastolic hypertension in hypothyroidism?
    back: Extracellular volume expansion (SIAD) with increased systemic vascular resistance.
    src: { page: 46, quote: "Diastolic hypertension may result from extracellular volume expansion (SIAD) and increased systemic vascular resistance." }
    status: unverified
  - id: endo.L04.033
    kind: card
    topic: thyroid-heart
    front: How can hypothyroidism affect heart failure?
    back: It can worsen well-controlled heart failure and can cause new heart failure in patients with only mild underlying heart disease.
    src: { page: 47, quote: "Hypothyroidism can make well- controlled heart failure worsen, and can produce heart failure for the first time" }
    status: unverified
  # ---------- p47: kidney ----------
  - id: endo.L04.034
    kind: enumerate
    topic: kidney
    prompt: The three hormones secreted by the human kidney.
    points:
      - Renin
      - Erythropoietin
      - Calcitriol (1,25(OH)2 vitamin D3)
    pass: 3
    src: { page: 47, quote: "The human kidney secretes three hormones 1- Renin. 2- Erythropoietin. 3- Calcitrol" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.035
    kind: enumerate
    topic: kidney
    prompt: Endocrine systems affected by chronic renal failure (book list).
    points:
      - Reproductive system
      - Carbohydrate metabolism
      - Parathyroid gland
    pass: 3
    src: { page: 48, quote: "Chronic Renal Failurte 1- Reproductive system. 2- CHO Metabolism. 3- Parathyroid Gland." }
    status: unverified
  # ---------- p48-50, p68-69: CRF reproductive ----------
  - id: endo.L04.036
    kind: enumerate
    topic: crf-reproductive
    prompt: Hormonal changes of the reproductive system in chronic renal disease.
    points:
      - Changes in androgen synthesis and metabolism
      - Hyperprolactinaemia
    pass: 2
    src: { page: 48, quote: "1- Changes in androgen Synthesis & metabolism. 2- Hyperprolactinaemia." }
    status: unverified
  - id: endo.L04.037
    kind: card
    topic: crf-reproductive
    front: When do the androgen changes of chronic renal insufficiency appear?
    back: Early after the onset of renal insufficiency.
    src: { page: 48, quote: "Changes of androgen synthesis and metabolism develop early after the onset of renal insufficiency." }
    status: unverified
  - id: endo.L04.038
    kind: card
    topic: crf-reproductive
    front: What is thought to cause the endocrine changes of chronic renal insufficiency?
    back: Uraemic toxins and concomitant drugs, though the exact mechanism remains unclear.
    src: { page: 48, quote: "Uremic toxins, and concomitant drug administration are supposed to contribute to the observed changes" }
    status: unverified
  - id: endo.L04.039
    kind: cloze
    topic: crf-reproductive
    text: In male CRF, plasma testosterone is {{c1::decreased or low normal}} in spite of {{c2::increased}} LH and FSH.
    src: { page: 48, quote: "The plasmsa testosterone levels are decreased or low normal ( inspite of an increased LH and FSH)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.040
    kind: card
    topic: crf-reproductive
    front: At what level is the testosterone defect in male CRF?
    back: A combined abnormality, primary hypogonadism and/or disturbance of the hypothalamic–pituitary axis.
    src: { page: 48, quote: "caused by primary hypogonadism and/or Disturbances of the hypothalamic– pituitary axis i.e. the consequence of a combined abnormality" }
    status: unverified
  - id: endo.L04.041
    kind: enumerate
    topic: crf-reproductive
    prompt: Why is testosterone low or low-normal in chronic renal failure? (7 reasons)
    points:
      - Less pulsatile hypothalamic GnRH release
      - Diminished pituitary response to GnRH
      - Impaired feedback; low testosterone fails to drive adequate gonadotrophin synthesis
      - Peripheral Leydig-cell resistance from a circulating LH-receptor inhibitor
      - Decreased metabolic clearance of GnRH, LH and FSH
      - Increased prolactin, which suppresses FSH and LH
      - Age-related rise in SHBG (+1.2%/year), lowering free testosterone further
    pass: 5
    src: { page: 48, quote: "Why testosterone levels are decreased or low normal? 1- Decrease of the pulsatility of hypothalamic GRH" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.042
    kind: cloze
    topic: crf-reproductive
    text: Leydig-cell resistance in CRF is due to a circulating {{c1::LH-receptor inhibitor}}.
    src: { page: 49, quote: "Peripheral leydig-cell resistance (dt circulating LH-receptor inhibitor)." }
    status: unverified
  - id: endo.L04.043
    kind: cloze
    topic: crf-reproductive
    text: SHBG rises with age by about {{c1::1.2%}} per year, further lowering {{c2::free}} testosterone.
    src: { page: 49, quote: "The age-related increase in SHBG (sex hormone binding globulin) levels (+1.2%/year) further induces a more fall in free testosterone." }
    status: unverified
  - id: endo.L04.044
    kind: card
    topic: crf-reproductive
    front: How does raised prolactin lower testosterone in CRF?
    back: Prolactin suppresses FSH and LH secretion.
    src: { page: 49, quote: "Increased prolactin (it suppers FSH& LH secretion)." }
    status: unverified
  - id: endo.L04.045
    kind: enumerate
    topic: crf-reproductive
    prompt: Consequences of androgen deficit in CRF.
    points:
      - Body composition change; BMI up from more fat, lean and muscle mass down
      - Osteoporosis and more fractures
      - Impaired libido and sexual function, possibly depression
    pass: 3
    src: { page: 49, quote: "Consequences of deficit androgen a) Changes in body composition" }
    status: unverified
  - id: endo.L04.046
    kind: cloze
    topic: crf-reproductive
    text: With androgen deficit, BMI {{c1::increases}} through more body fat while lean body mass is {{c2::reduced}}.
    src: { page: 49, quote: "Body mass index (BMI) increases via an increment of body fat" }
    status: unverified
  - id: endo.L04.047
    kind: card
    topic: crf-reproductive
    front: What are the main male reproductive problems in chronic renal failure?
    back: Impotence, and germinal cell dysplasia with oligospermia leading to infertility.
    src: { page: 49, quote: "The main male reproductive problems are Impotence Germinal Cell Dysplasia Oligospermia which leads to infertility." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.048
    kind: enumerate
    topic: crf-reproductive
    prompt: Causes of hyperprolactinaemia in renal insufficiency.
    points:
      - Partly decreased metabolic clearance
      - Autonomous overproduction
    pass: 2
    src: { page: 49, quote: "It is a partially induced by a decreased metabolic clearance. b) Autonomic overproduction." }
    status: unverified
  - id: endo.L04.049
    kind: card
    topic: crf-reproductive
    front: What reproductive problems do women with CRF have?
    back: Amenorrhoea (periods may return after successful dialysis) and failure of pregnancy (pregnancy aggravates CRF).
    src: { page: 49, quote: "Amenorrhea (menstrual periods may start after successful dialysis). Failure of pregnancy (pregnancy aggravates CRF)." }
    status: unverified
  - id: endo.L04.050
    kind: card
    topic: crf-reproductive
    front: Does dialysis reverse the hypothalamic–pituitary–gonadal dysfunction of CRF?
    back: No. Haemodialysis or peritoneal dialysis does not reverse it; renal transplantation was reported to restore it, though results conflict.
    src: { page: 50, quote: "is not reversed by initiation of effective haemodialysis or peritoneal dialysis therapy" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.051
    kind: card
    topic: crf-reproductive
    front: What does CRF do to children's growth and puberty, and what reverses it?
    back: Impaired sexual maturation and stunted growth, which improve or reverse with successful renal transplantation.
    src: { page: 50, quote: "Impaired sexul maturation. Stunted growth. These abnormalities improve or reverse with successful R.T." }
    status: unverified
  - id: endo.L04.052
    kind: card
    topic: crf-reproductive
    front: Why is LH high in CRF, and does it restore testosterone?
    back: Increased production and reduced clearance; it does not restore normal testosterone production.
    src: { page: 68, quote: "The elevated LH level is due to production & reduced clearance but does not restore normal testosterone production." }
    status: unverified
  - id: endo.L04.053
    kind: cloze
    topic: crf-reproductive
    text: In CRF, gynaecomastia occurs in about {{c1::50%}} of men, from low testosterone combined with {{c2::increased oestrogen}}.
    src: { page: 68, quote: "Gynecomastia in about 50% of men due to the combined effect of low testosterone & increased estrogen levels" }
    status: unverified
  - id: endo.L04.054
    kind: cloze
    topic: crf-reproductive
    text: Decreased libido and impotence occur in about {{c1::50%}} of CRF patients; haemodialysis improves testosterone only {{c2::incompletely}}.
    src: { page: 68, quote: "Decreased libido & impotence in about 50% of pts. Improvement in testosterone production production with hemodialysis is incomplete" }
    status: unverified
  - id: endo.L04.055
    kind: card
    topic: crf-reproductive
    front: How does decreased urinary LH excretion in uraemia lower testosterone?
    back: LH and its subtypes accumulate in blood; the less acidic, bioactive LH forms may contribute to lower testosterone production.
    src: { page: 69, quote: "Less acidic an bioactive LH forms might thus contribute to the decrease in testosterone production." }
    status: unverified
  # ---------- p50-52, p70: CRF carbohydrate metabolism ----------
  - id: endo.L04.056
    kind: card
    topic: crf-glucose
    front: How does carbohydrate metabolism change with the stage of CRF?
    back: Mild (initial) CRF shows no significant disturbance; moderate and advanced CRF show impaired carbohydrate metabolism with rising basal insulin.
    src: { page: 50, quote: "No significant disturbances in carbohydrate metabolism were found in patients with mild (initial) CRF." }
    status: unverified
  - id: endo.L04.057
    kind: enumerate
    topic: crf-glucose
    prompt: Glucose patterns that can occur in CRF.
    points:
      - Normoglycaemia
      - Hypoglycaemia
      - Slower decline of glucose after a glucose load
      - Fasting hyperglycaemia
      - Glucose intolerance
    pass: 4
    src: { page: 50, quote: "Normoglycaemia Hypoglycaemia. Slowing of the rate at which glucose. Levels decline after glucose load. Fasting hyperglycaemia. Glucose intolerance." }
    status: unverified
  - id: endo.L04.058
    kind: card
    topic: crf-glucose
    front: How is normoglycaemia maintained in insulin-resistant CRF patients, and when does it fail?
    back: At the expense of hyperinsulinaemia (high C-peptide); if insulin secretion is normal or slightly reduced, impaired fasting glucose or intolerance develops.
    src: { page: 51, quote: "Normoglycaemia is maintained at the expense of hyperinsulinaemia." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.059
    kind: table
    topic: crf-glucose
    title: Insulin handling and the kidney
    columns: [Fact, Figure]
    rows:
      - [Endogenous insulin removed by the liver on first pass, 40–50%]
      - [Insulin reaching the kidney that is filtered (then metabolised in proximal tubules), About 65%]
      - [Filtered insulin appearing in urine, Less than 1%]
      - [Exogenous insulin metabolised (mainly by the kidney), 30–80%]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 51, quote: "Approximately 40–50% of the endogenous insulin produced by the pancreas is metabolized by the liver in its first pass." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.060
    kind: cloze
    topic: crf-glucose
    text: About {{c1::65%}} of insulin reaching the kidney is filtered at the glomerulus and then metabolised in the {{c2::proximal tubular}} cells.
    src: { page: 51, quote: "About 65% of insulin that reaches the kidney is filtered in the glomerulus and is, subsequently, metabolized in the proximal tubular cells." }
    status: unverified
  - id: endo.L04.061
    kind: card
    topic: crf-glucose
    front: Which organ is the main site for metabolising exogenous insulin?
    back: The kidney (it metabolises 30–80% of exogenous insulin), so insulin needs fall as renal function declines.
    src: { page: 51, quote: "The kidney is,therefore, the main organ responsible for metabolizing exogenous insulin" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.062
    kind: enumerate
    topic: crf-glucose
    prompt: Other factors that influence uraemia-associated insulin resistance.
    points:
      - Altered adipocytokines (TNF-α, resistin, leptin, adiponectin)
      - Anaemia
      - Metabolic acidosis
      - Secondary hyperparathyroidism
    pass: 3
