  # ------------------------------------------------------------------
  - id: geri.L04.lesson1
    title: "الـ dementia: مش كل نسيان زهايمر"
    hook: "جدك بينسى فين حط النضارة؟ عادي. نسي إزاي يستخدم القلم؟ ده موضوع تاني خالص."
    minutes: 8
    pages: [54, 55]
    topics: [definitions, ad-risk, ad-types]
    goals:
      - "تفرّق الـ dementia عن الـ age-associated memory impairment"
      - "تحفظ نسب أنواع الـ dementia"
      - "تقرا الـ atypical features وتعرف هي بتشاور على إيه"
    status: unverified
    steps:
      - kind: explain
        page: 54
        quote: "Dementia = a progressive, global decline in cognitive and behavioural functioning that interferes with daily living activities and social relationships"
        title: "التعريف"
        text: |
          الـ ==dementia== هي **progressive, global decline** في الـ cognitive والـ behavioural functioning، لدرجة إنها **interferes with daily living activities** والعلاقات.

          الكلمة المهمة: **interferes**. لو النسيان مش مأثّر على حياته، يبقى مش dementia.
      - kind: explain
        page: 54
        quote: "Age-associated memory impairment = A decline in short-term memory that sometimes accompanies aging"
        title: "النسيان الطبيعي"
        text: |
          الـ ==age-associated memory impairment== هو decline في الـ **short-term memory** بيحصل أحيانًا مع السن، واسمه الحلو: **benign senescent forgetfulness**.

          يعني نسيان benign، مش progressive ومش بيوقف حياته.
      - kind: aside
        tone: analogy
        page: 54
        quote: "Age-associated memory impairment = A decline in short-term memory that sometimes accompanies aging"
        text: "الفرق زي الفرق بين إنك **تنسى فين ركنت العربية** (benign forgetfulness في الـ short-term memory، كلنا بنعملها) وإنك **تنسى إن عندك عربية** أو إزاي تسوقها (dementia)."
      - kind: explain
        page: 54
        quote: "commonest cause of dementia among older people marked by progressive irreversible declines in memory,performance of routine tasks"
        title: "الـ Alzheimer's disease"
        text: |
          الـ ==Alzheimer's disease== هو **primary degenerative brain disease**، وهو **commonest cause of dementia** عند الكبار.

          بيعمل **progressive irreversible** decline في:
          - الـ memory والـ routine tasks.
          - الـ language والـ communication.
          - الـ abstract thinking.
          - القدرة على التعلّم والـ calculations.
      - kind: figure
        page: 55
        quote: "Alzheimer's Type Dementia (50-75 % of cases) Vascular dementia (10 to 20 %)"
        title: "مين بيعمل الـ dementia؟"
        alt: "Four horizontal bars showing ranges: Alzheimer's type 50 to 75 percent, vascular 10 to 20 percent, Lewy bodies 10 to 15 percent, frontotemporal 5 to 15 percent."
        caption: "الزهايمر لوحده نص لتلات أرباع الحالات. الـ vascular والـ Lewy bodies والـ frontotemporal بيتقسموا الباقي."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="20" class="t-sm t-mut">% of dementia cases</text>
            <rect x="10" y="32" width="225" height="30" class="fg-acc"/>
            <text x="18" y="52" class="t-sm t-b">Alzheimer's type</text>
            <text x="245" y="52" class="t-b t-acc">50-75%</text>
            <rect x="10" y="75" width="60" height="30" class="fg-box"/>
            <text x="80" y="95" class="t-sm">Vascular</text>
            <text x="245" y="95" class="t-b">10-20%</text>
            <rect x="10" y="118" width="45" height="30" class="fg-box"/>
            <text x="80" y="138" class="t-sm">Lewy bodies</text>
            <text x="245" y="138" class="t-b">10-15%</text>
            <rect x="10" y="161" width="45" height="30" class="fg-box"/>
            <text x="80" y="181" class="t-sm">Frontotemporal</text>
            <text x="245" y="181" class="t-b">5-15%</text>
          </svg>
      - kind: explain
        page: 55
        quote: "Environmental factors-Aluminum, zinc, viruses and prions"
        title: "الـ risk factors في أول المحاضرة"
        text: |
          - **Old age** و**ApoE4** (family history/genetic).
          - **Female gender**، **rural populations**، **level of education**.
          - **Environmental**: aluminium، zinc، viruses، prions.
          - **Diet**: thiamine، fatty acids.
          - **Head injury** و==Down's syndrome==.
      - kind: table
        page: 55
        quote: "Abrupt onset Vascular dementia"
        title: "إمتى تقول: ده مش زهايمر؟"
        columns: ["Feature", "Think of"]
        rows:
          - ["Abrupt / stepwise", "Vascular dementia"]
          - ["Behaviour, apathy", "Frontotemporal"]
          - ["Gait disorder", "Vascular, hydrocephalus"]
          - ["Fluctuations", "Delirium, Lewy bodies"]
          - ["Hallucinations", "Delirium, Lewy bodies"]
          - ["Extrapyramidal", "Parkinsonian, vascular"]
          - ["Eye movements", "PSP, Wernicke's"]
        hide: [[0, 1], [1, 1], [3, 1], [6, 1]]
      - kind: reveal
        page: 55
        quote: "Abrupt onset Vascular dementia"
        prompt: "ليه الـ vascular dementia بتنزل على درجات (stepwise) مش منحدر ناعم زي الزهايمر؟"
        answer: "لأن كل **stroke** صغيرة بتقطع حتة من المخ مرة واحدة، فالمريض **ينزل درجة** ويفضل ثابت لحد الجلطة اللي بعدها. الزهايمر بقى **degeneration** بطيء ومستمر، فالنزول ناعم."
      - kind: check
        page: 55
        quote: "Prominent behavior changes | Frontotemporal dementia"
        question: "A 66-year-old man became rude, disinhibited and totally apathetic, though his memory is fairly good. Which dementia?"
        options: ["Frontotemporal dementia", "Alzheimer's disease", "Dementia with Lewy bodies", "Vascular dementia"]
        answer: 0
        why:
          - "صح: prominent behaviour changes وprofound apathy = frontotemporal."
          - "الزهايمر بيبدأ بالـ short-term memory."
          - "الـ Lewy bodies: fluctuations وhallucinations."
          - "الـ vascular: abrupt وstepwise."
      - kind: try
        items: [geri.L04.001, geri.L04.007, geri.L04.008, geri.L04.005]
    recap:
      - "Dementia: progressive global decline بيأثّر على الـ ADL."
      - "AAMI = benign senescent forgetfulness."
      - "Alzheimer's 50-75%، vascular 10-20%، Lewy 10-15%، FTD 5-15%."
      - "Stepwise = vascular، behaviour/apathy = FTD، fluctuations + hallucinations = Lewy أو delirium، eye movements = PSP أو Wernicke."
    practice: [geri.L04.001, geri.L04.002, geri.L04.003, geri.L04.004, geri.L04.005, geri.L04.006, geri.L04.007, geri.L04.008, geri.L04.009, geri.L04.010, geri.L04.114, geri.L04.115, geri.L04.135]
