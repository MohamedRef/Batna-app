          - ==Obesity does not rule out malnutrition==. افتكر الـ sarcopenic obesity من أول درس.
          - الـ obesity موجودة في most cases of **NASH**-related cirrhosis.
          - **Estimate and treat malnutrition routinely** في الـ obese cirrhotics: BMI > 30 من غير fluid retention.
          - وانت بتشخّص obesity، خلّي بالك من الـ **fluid retention** واحسب **dry weight**، رغم إن دقته قليلة. المية ممكن تخلي عيان "تخين" على الميزان وهو مش كده.
