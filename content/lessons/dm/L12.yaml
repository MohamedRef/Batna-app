          - ["Vildagliptin (85% renal)", "No dose adjustment", "No recommendation; caution"]
          - ["Saxagliptin (75% renal)", "No dose adjustment", "No recommendation; caution"]
          - ["Alogliptin (>70% renal)", "No dose adjustment", "No recommendation; caution"]
          - ["Linagliptin (mainly biliary)", "No dose adjustment", "Unknown"]
        hide: [[0, 1], [0, 2], [4, 2]]
      - kind: explain
        page: 157
        title: "الجدول ده عكس جدول الكلية"
        quote: "Linagliptin     Mainly billiary"
        text: |
          افتكر جدول الـ CKD: هناك الـ **linagliptin** كان الوحيد اللي ما يتلمسش، لأنه مش بيخرج من الكلية. هنا الصورة بتتقلب:

          - **Sitagliptin، vildagliptin، saxagliptin، alogliptin**: أغلبهم ==renal== (من 70 لـ 87%)، فالكبد الـ mild–moderate مش بيأثر عليهم: **no dose adjustment**. في الـ **severe HI** مفيش توصية، فـ **caution**.
          - **Linagliptin**: ==mainly biliary== (<7% renal). في الـ mild–moderate no adjustment، وفي الـ severe **unknown**.

          التفسير المقبول (مش في الكتاب) للـ "unknown": الدوا اللي بيخرج من الصفرا هو اللي ممكن يتأثر لما الكبد يتعب جدًا، ومفيش دراسات تقول قد إيه. يعني: الكلية ضعيفة ← linagliptin، والكبد ضعيف جدًا ← ولا واحد بثقة، والـ insulin أأمن.
      - kind: explain
        page: 157
        title: "الـ GLP-1 RA والكبد"
        quote: "They decrease the appetite, delay gastric emptying, induce weight loss,\n    improve cardiac function, and have also hepatic effects."
        text: |
          الـ GLP-1 analogues بتنزّل السكر، وكمان ليها **pleiotropic extra-pancreatic effects** في المخ وبره:

          - **↓ appetite** و **delay gastric emptying** ← بياكل أقل
          - **weight loss**
          - **improve cardiac function**
          - **hepatic effects**

          ليه دي تفرق في الكبد؟ التفسير المقبول (مش في الكتاب): الـ NAFLD أصلًا مرض دهون زيادة و insulin resistance، فأي حاجة بتنزّل الوزن وتقلل الأكل بتشيل الدهون من الكبد. عشان كده الدراسات بتقول الـ ==liraglutide== ممكن يحسّن الـ **NASH histology** ويقلل الـ progression of fibrosis. بس الكتاب بيقول لسه **premature** تستخدمه علاج للـ NASH من غير سكر، لأن الـ evidence مش كفاية.
      - kind: update
        page: 158
        quote: "It is still premature to consider these agents as a specific treatment for patients with NASH without diabetes, due to inadequate evidence."
        text: "من بعد الكتاب: الـ US Food and Drug Administration (FDA) وافقت (accelerated) على semaglutide 2.4 mg للـ metabolic dysfunction-associated steatohepatitis (MASH) مع fibrosis F2–F3، بسكر أو من غيره. في الامتحان: كلام الكتاب (premature)."
        ref: "FDA approval of semaglutide (Wegovy) for MASH, 2025"
      - kind: explain
        page: 158
        title: "الـ SGLT2i والكبد"
        quote: "They reduce glucose reabsorption by the kidneys. In this way, this\n    mechanism of blood glucose level control is independent of insulin secretion."
        text: |
          الـ SGLT2i بيقلل الـ glucose reabsorption في الكلية، يعني شغله ==independent of insulin secretion==: مش محتاج بنكرياس ولا كبد عشان يشتغل.

          في الكبد (أغلبها **animal studies**):
          - الـ **canagliflozin** والـ **empagliflozin** حسّنوا الـ **hepatic steatosis**.
          - بيشيلوا الـ **lipid overload**.
          - بيقللوا الـ **oxidative** والـ **inflammatory responses**، فبيحموا الـ hepatocytes من الموت في الـ NAFLD.

          التفسير المقبول (مش في الكتاب) للـ lipid overload: الـ glucose اللي بيخرج في البول ده سعرات بتضيع، فالجسم بيحرق دهون أكتر، ومنها دهون الكبد.
      - kind: figure
        page: 158
        quote: "SGLT2 inhibitors are capable of attenuating the abnormal oxidative response and inflammatory responses, playing a protective role in inhibiting hepatocyte death during the development of NAFLD."
        title: "رسمة الكتاب ص 158: الـ SGLT2i لحد الكبد"
        image: { file: dm/L12-sglt2i-nafld.webp, book: true }
        alt: "Book diagram. SGLT2 inhibitors act on a kidney at the top. Arrows lead to six boxes: lower hyperglycaemia, lower visceral adiposity, lower serum uric acid, lower oxidative stress, lower inflammation and higher adiponectin. Arrows from all six converge on a liver at the bottom, labelled lower NAFLD and lower NASH."
        caption: |
