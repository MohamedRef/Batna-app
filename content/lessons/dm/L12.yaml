  - id: dm.L12.lesson3
    title: "KDIGO 2022 والـ SGLT2i بيحموا الكلية إزاي"
    hook: "خريطة KDIGO كلها في شاشة، وليه الـ SGLT2i والـ ACEi شغالين على طرفين عكس بعض."
    minutes: 7
    pages: [147, 149]
    topics: [kdigo]
    goals:
      - "ترتّب الـ first-line والـ targeted therapy في KDIGO 2022"
      - "تشرح الـ nephroprotection بتاع الـ SGLT2i"
      - "تفرّق الـ GLP-1 RA direct وindirect، والـ DPP-4i renal excretion"
    status: unverified
    steps:
