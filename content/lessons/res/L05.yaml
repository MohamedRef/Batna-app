schema: batna.lesson/v1
lecture: res.L05
lessons:
  # ------------------------------------------------------------------
  - id: res.L05.lesson1
    title: "الـ case-control: نبدأ من العيان ونرجع لورا"
    hook: "عندك 100 عيان cancer larynx في المعهد. إزاي تعرف إن الكحول ليه دعوة من غير ما تستنى 20 سنة؟"
    minutes: 10
    pages: [4, 18]
    topics: [analytic, case-control]
    goals:
      - "تعرف إن الـ analytic مفتاحه الـ comparison group"
      - "تعرّف الـ case-control وتعرف اتجاهه backwards"
      - "ترتب خطواته وتعرف ليه الـ case definition مهم"
    status: unverified
    steps:
      - kind: explain
        page: 9
        quote: "ANALYTICAL STUDIES:\n  To quantify the association between exposures and outcomes, and to test hypotheses about causal relationships.\n  The key feature of analytic epidemiology is a comparison group."
        title: "من الوصف للاختبار"
        text: |
          في المحاضرة اللي فاتت الـ descriptive كان بيوصف و**يقترح** hypotheses. دلوقتي الـ ==analytic== بيعمل حاجتين:

          - **Quantify** العلاقة بين الـ exposure والـ outcome.
          - **Test hypotheses** عن الـ causal relationships.

          والمفتاح اللي بيفرقه عن الـ descriptive: ==comparison group==.

          والنوعين الأشهر: **case-control** و **cohort**.
      - kind: table
        page: 6
        quote: "Types of Epi Studies: Observational\n  Descriptive: Natural history; Allocation of resources; Suggest hypotheses\n  Analytic: Test hypotheses; Assess causation"
        title: "Observational: مين بيعمل إيه؟"
        columns: ["Descriptive", "Analytic"]
        rows:
          - ["Natural history", "Test hypotheses"]
          - ["Allocation of resources", "Assess causation"]
          - ["Suggest hypotheses", "-"]
        hide: [[0, 1], [1, 1]]
      - kind: check
        page: 4
        quote: "Overview of Epidemiologic Study Designs:\n  EXPERIMENTAL: Random allocation of study subjects; Investigator assigns treatment or exposure:\n    Randomized Control Trials\n    Community Trials\n    Laboratory Trials\n  OBSERVATIONAL: Investigators study people and exposures \"in nature\". Comparison Group?\n    NO, DESCRIPTIVE: Correlational; Case Series; Case Reports; Cross-Sectional\n    YES, ANALYTIC: Case-Control; Cohort"
        question: "A comparison (control) group is lacking in:"
        options: ["Cross-sectional studies", "Case-control studies", "Cohort studies", "Randomized controlled trial"]
        answer: 0
        why:
          - "صح: المحاضرة حاطاه تحت **descriptive**، ومفيش comparison group."
          - "الـ **controls** هم الـ comparison group."
          - "الـ unexposed cohort هو الـ comparison group."
          - "الـ randomized controlled trial (RCT) ليه control arm دايمًا."
      - kind: figure
        page: 7
        quote: "Hierarchy of study designs in determining causality (Strength of evidence), from strongest to weakest evidence:\n  Meta-analysis, Systematic review\n  Randomized controlled trial, Non-randomized controlled trial\n  Prospective cohort, Retrospective cohort\n  Cross-sectional\n  Case series, Case report\n  Opinionated review, Expert opinion"
        title: "هرم الأدلة على السببية"
        svg: |
          <svg viewBox="0 0 330 384" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L05p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="20" y="8" width="290" height="32" rx="8" class="fg-acc"/>
            <text x="165" y="29" text-anchor="middle" class="t-sm t-b">Meta-analysis, systematic review</text>
            <path d="M165 42v14" class="fg-arrow" marker-end="url(#L05p)"/>
            <rect x="20" y="60" width="290" height="44" rx="8" class="fg-box"/>
            <text x="165" y="79" text-anchor="middle" class="t-sm t-b">Randomized controlled trial</text>
            <text x="165" y="95" text-anchor="middle" class="t-sm t-mut">then non-randomized trial</text>
            <path d="M165 106v14" class="fg-arrow" marker-end="url(#L05p)"/>
            <rect x="20" y="124" width="290" height="44" rx="8" class="fg-acc"/>
            <text x="165" y="143" text-anchor="middle" class="t-sm t-b">Prospective cohort</text>
            <text x="165" y="159" text-anchor="middle" class="t-sm t-mut">then retrospective cohort</text>
            <path d="M165 170v14" class="fg-arrow" marker-end="url(#L05p)"/>
            <rect x="20" y="188" width="290" height="32" rx="8" class="fg-box"/>
            <text x="165" y="209" text-anchor="middle" class="t-sm t-b">Case-control</text>
            <path d="M165 222v14" class="fg-arrow" marker-end="url(#L05p)"/>
            <rect x="20" y="240" width="290" height="32" rx="8" class="fg-box"/>
            <text x="165" y="261" text-anchor="middle" class="t-sm t-b">Cross-sectional</text>
            <path d="M165 274v14" class="fg-arrow" marker-end="url(#L05p)"/>
            <rect x="20" y="292" width="290" height="32" rx="8" class="fg-box"/>
            <text x="165" y="313" text-anchor="middle" class="t-sm t-b">Case series, case report</text>
            <path d="M165 326v14" class="fg-arrow" marker-end="url(#L05p)"/>
            <rect x="20" y="344" width="290" height="32" rx="8" class="fg-box"/>
            <text x="165" y="365" text-anchor="middle" class="t-sm t-b">Opinionated review, expert opinion</text>
          </svg>
        caption: "من فوق لتحت = من أقوى دليل على السببية لأضعفه (slide 7). الـ cohort فوق الـ case-control لأنه بيبدأ من الـ exposure فبيثبت إن السبب جه قبل النتيجة. التفسير المقبول (مش في الكتاب)."
        alt: "Seven stacked levels from meta-analysis at the top to expert opinion at the bottom."
      - kind: explain
        page: 8
        quote: "Definitions of terms:\n  EXPOSED: Having, or being exposed to, a potential cause or risk factor for disease or other outcome (Independent variable)\n  OUTCOME: Disease or other health-related event under study (Dependent variable)\n  PREVALENCE: A measure of the burden of disease in a population, calculated as the number of individuals with a disease or outcome divided by the total number of individuals in a defined population at a given time. Prevalence is expressed as a proportion (%)\n  INCIDENCE: A measure of the rate at which new cases of a disease occur in a population, calculated as the number of new cases divided by the population at risk over time. Incidence is expressed as a rate per unit time (for example, annual rate)"
        title: "متغيرين بس"
        text: |
          - **Exposure** = ==independent variable== (السبب المحتمل).
          - **Outcome** = ==dependent variable== (المرض).

          الـ outcome «dependent» لأنه بيعتمد على الـ exposure. سهلة.
      - kind: explain
        page: 10
        quote: "Two commonly used types of analytical studies:\n  Case-control\n  Cohort\nFIGURE 2:\n  a: Direction of data collection (forward in time): Sample of healthy subjects, then Exposure (Exposed / Not exposed), then Illness (Yes / No)\n  b: Direction of data collection (backward in time): Population, then Illness (Yes / No), then Exposure (Exposed / Not exposed)\nGraphical depiction of a prospective cohort study (simplest case (2a)) and a retrospective case control study (2b)"
        title: "النوعين: case-control وcohort"
        text: |
          أشهر نوعين analytic: ==case-control== و==cohort==. الفرق في **اتجاه جمع الداتا**:

          - **Cohort**: forward in time. بتبدأ بـ **sample of healthy subjects** (خاليين من الـ outcome اللي بتدرسه)، تقسّمهم exposed وnon-exposed، وتستنى مين يجيله المرض.
          - **Case-control**: backward. بتبدأ بالمرض وترجع تدوّر على الـ exposure.

          خلي بالك: «healthy» معناها **خاليين من الـ outcome المدروس**، مش من كل الأمراض. في مثال الـ HIV والـ cerebral toxoplasmosis، الـ HIV هو الـ exposure، والـ toxoplasmosis هو اللي لازم مايكونش موجود في الأول.
      - kind: figure
        page: 10
        title: "شريحة 10: اتجاه جمع الداتا في النوعين"
        image: { file: res/L05-s10-directions.webp, book: true }
        alt: "Figure 2 in two panels. Panel a, with an arrow labelled direction of data collection pointing right: a sample of healthy subjects splits into exposed and not exposed, and each then has illness yes or no, with time running right. Panel b, with the direction of data collection arrow pointing left: a population box on the right splits into illness yes and no, and each is traced back to exposed or not exposed on the left, while the time arrow still points right."
        caption: |
          دي الـ Figure 2 اللي الخطوة فوق بتشرحها:

          - **فوق (a)، الـ cohort**: **Sample of healthy subjects** ← **Exposed / Not exposed** ← **Illness Yes / No**. سهم **Direction of data collection** رايح يمين، زي سهم الـ **Time** بالظبط.
          - **تحت (b)، الـ case-control**: **Population** على اليمين ← **Illness Yes / No** ← ترجع للـ **Exposed / Not exposed** على الشمال. سهم جمع الداتا رايح ==شمال==، عكس سهم الـ Time.

          اللي تاخده: الزمن في الطبيعة ماشي يمين في الاتنين؛ اللي بيفرق هو ==اتجاه الباحث==: الـ cohort ماشي مع الزمن، والـ case-control راجع ضده.
      - kind: explain
        page: 12
        quote: "Case Control Study, Definition: The selection of individuals on the basis of whether they do (cases) or they do not (control) have a particular disease then compared in respect to the proportion having a history of an exposure or certain characteristic of illness"
        title: "تعريف الـ case-control"
        text: |
          بنختار الناس على أساس ==المرض==:

          - **Cases**: عندهم المرض.
          - **Controls**: ماعندهمش المرض.

          وبعدين نقارن: كام في المية من كل مجموعة ==كان عنده exposure== في الماضي؟
      - kind: figure
        page: 13
        quote: "Case-control studies, Backwards Directionality: start from Outcome/Disease (Yes or No) and look back in time to Exposure (?)"
        title: "Backwards directionality"
        alt: "A time arrow runs left to right from exposure to outcome. Two boxes on the right, disease yes and disease no, each with an arrow pointing backwards to a question mark on the exposure side. Study begins in the present."
        caption: "الزمن ماشي من الـ exposure للمرض، بس الـ case-control **بيمشي عكسه**: يبدأ من المرض النهارده ويدوّر على الـ exposure في الماضي. من **effect to cause**."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R05a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
              <marker id="R05b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <text x="50" y="22" text-anchor="middle" class="t-b">Exposure</text>
            <text x="270" y="22" text-anchor="middle" class="t-b">Outcome</text>
            <path d="M20 40L310 40" class="fg-arrow-acc" marker-end="url(#R05a)"/>
            <text x="165" y="58" text-anchor="middle" class="t-sm t-mut">time →</text>
            <text x="50" y="112" text-anchor="middle" class="t-lg t-b">?</text>
            <rect x="222" y="88" width="96" height="40" rx="8" class="fg-bad"/>
            <text x="270" y="113" text-anchor="middle" class="t-b">Cases (yes)</text>
            <path d="M220 108L72 108" class="fg-arrow-bad" marker-end="url(#R05b)"/>
            <text x="50" y="172" text-anchor="middle" class="t-lg t-b">?</text>
            <rect x="222" y="148" width="96" height="40" rx="8" class="fg-good"/>
            <text x="270" y="173" text-anchor="middle" class="t-b">Controls (no)</text>
            <path d="M220 168L72 168" class="fg-arrow-bad" marker-end="url(#R05b)"/>
            <text x="50" y="222" text-anchor="middle" class="t-sm t-mut">past</text>
            <text x="270" y="222" text-anchor="middle" class="t-sm t-b">study begins here</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 13
        quote: "Case-control studies, Backwards Directionality: start from Outcome/Disease (Yes or No) and look back in time to Exposure (?)"
        text: |
          الـ case-control (**backwards directionality**) زي المحقق في فيلم عربي قديم: الجريمة حصلت خلاص (المرض)، وهو بيرجع **لورا** يسأل «كنت فين ليلة الحادثة؟» (الـ exposure).

          والـ cohort (هنشوفه بعدين) زي الكاميرا اللي بتسجّل من الأول وتستنى تشوف هيحصل إيه.
      - kind: order
        page: 14
        quote: "Case Control Study Steps:\n  Definition of cases\n  Selection of cases\n  Selection of Controls\n  Ascertainment of exposure status\n  Analysis\n  Conclusion and interpretation"
        prompt: "رتّب خطوات الـ case-control study:"
        steps:
          - "Definition of cases"
          - "Selection of cases"
          - "Selection of controls"
          - "Ascertainment of exposure status"
          - "Analysis"
          - "Conclusion and interpretation"
        why: "تعرّف الـ case، تختارهم، تختار الـ controls، تعرف مين اتعرض، تحلل، وبعدين تفسّر."
      - kind: explain
        page: 16
        quote: "Case Definition:\n  A set of standard diagnostic criteria that must be fulfilled in order to identify a person as a case of a particular disease\n  Ensures that all persons who are counted as cases actually have the same disease\n  Typically includes clinical criteria (lab results, symptoms, signs) and sometimes restrictions on time, place, and person"
        title: "الـ case definition"
        text: |
          ==Case definition== = مجموعة **standard diagnostic criteria** لازم تتحقق علشان تعتبر حد case.

          ليه؟ علشان ==كل الـ cases عندهم نفس المرض فعلًا==.

          بتشمل clinical criteria (lab، symptoms، signs)، وأحيانًا قيود على **time, place, person**.

          مثال المحاضرة: hypertension in pregnancy حسب American College of Obstetricians and Gynecologists (ACOG): diastolic ≥ 90 أو systolic ≥ 140 بعد 20 أسبوع، في ست كان ضغطها طبيعي، متسجل مرتين بينهم 4 ساعات.
      - kind: reveal
        page: 17
        quote: "Hypertension In Pregnancy\nDefinition (ACOG): Diastolic BP of 90mm Hg or higher or systolic BP of 140mm Hg or higher after 20wks of gestation in a woman with previously normal BP. It should be documented on atleast 2 occasions measured 4hrs apart.\nProteinuria: It is defined as the urinary excretion of 300mg/L or more of protein in a 24hr urine collection. (correlates with reagent strip >1+ i.e. >30mg/dl)"
        prompt: "عايز تعمل case-control على hypertension in pregnancy. ليه slide 17 بيحط تعريف بالأرقام بالظبط (ACOG)؟"
        answer: |
          لأن الـ ==case definition== لازم تبقى واضحة وثابتة قبل ما تختار أي case. التعريف هنا: diastolic ≥ 90 أو systolic ≥ 140 mm Hg **بعد 20 أسبوع** في ست كان ضغطها طبيعي، ومتسجّل ==مرتين على الأقل بينهم 4 ساعات==.

          ليه مرتين؟ علشان قراية واحدة عالية ممكن تكون توتر أو غلط قياس، وأي case مش حقيقي بيدخل الـ cases بيخفّف الفرق اللي بتدوّر عليه. التفسير المقبول (مش في الكتاب).
      - kind: reveal
        page: 18
        quote: "Selection of Cases:\n  Preferably new cases or incident cases\n  Prevalent cases (cases already present)"
        prompt: "تاخد cases جديدة (incident) ولا قديمة (prevalent)؟ وليه؟"
        answer: |
          المحاضرة: ==preferably new (incident) cases==، والـ prevalent ممكن تتاخد.

          الدكتورة قالت السبب في الشرح: ==المرض بيغيّر السلوك==. عيان الـ angina بعد سنة ممكن يكون بطّل سجاير وغيّر أكله، فلو سألته عن حاله **دلوقتي** هيخبّي الـ exposure اللي كان **قبل** المرض. وزوّد على كده إن ذاكرة العيان القديم عن الـ exposure بتضعف، واللي ماتوا بدري مش هيبقوا موجودين أصلًا.
      - kind: check
        page: 15
        quote: "Cases:\n  Define case: diagnostic and eligibility criteria\n  Source of cases: hospital, general population"
        question: "Which statement about cases in a case-control study is correct?"
        options:
          - "Cases are chosen because they were exposed"
          - "Cases need a clear case definition and can come from hospitals or the general population"
          - "Only prevalent cases may be used"
          - "Cases are followed into the future to see who gets the disease"
        answer: 1
        why:
          - "الاختيار على أساس **المرض** مش الـ exposure. ده cohort."
          - "صح: case definition واضح، والمصدر hospital أو general population."
          - "الأفضل **incident** cases."
          - "ده cohort. الـ case-control بيرجع لورا."
      - kind: try
        items: [res.L05.004, res.L05.006, res.L05.007, res.L05.008, res.L05.009]
    recap:
      - "Analytic = **quantify + test hypotheses**، والمفتاح **comparison group**."
      - "Exposure = independent، outcome = dependent."
      - "Case-control: نختار على أساس **المرض** (cases vs controls) ونقارن الـ exposure في الماضي. **Backwards** (effect → cause)."
      - "الخطوات: define cases ← select cases ← select controls ← exposure ← analysis ← conclusion."
      - "Case definition موحّد، والأفضل **incident cases**."
    practice: [res.L05.001, res.L05.002, res.L05.003, res.L05.004, res.L05.005, res.L05.006, res.L05.007, res.L05.008, res.L05.009, res.L05.010, res.L05.011, res.L05.073]

  # ------------------------------------------------------------------
  - id: res.L05.lesson2
    title: "الـ controls والـ confounding"
    hook: "القهوة بتعمل cancer pancreas؟ ولا السيجارة اللي في الإيد التانية هي اللي بتعملها؟"
    minutes: 9
    pages: [19, 28]
    topics: [controls]
    goals:
      - "تعرف الـ control المثالي"
      - "تشرح الـ confounding بمثالين ودور الـ matching"
      - "تقارن مصادر الـ controls وعدد الـ controls لكل case"
    status: unverified
    steps:
      - kind: explain
        page: 19
        quote: "Control: Control must be Ideally matching with the cases by age, sex and other characteristics except the control must not be suffering from diseases"
        title: "الـ control المثالي"
        text: |
          الـ control لازم يكون ==شبه الـ case في كل حاجة== (السن، النوع، وصفات تانية)، ==ما عدا المرض==.

          الفكرة: لو المجموعتين شبه بعض في كل حاجة، أي فرق في الـ exposure يبقى له معنى.

          الدكتورة قالت في الشرح: الـ controls لازم يمثلوا نفس المجتمع اللي جت منه الـ cases، ويبقوا ناس لو جالهم المرض كانوا هيبقوا cases في الدراسة. سهولة الوصول لهم مش كفاية. مثالها: لو وحدة العلاج الإشعاعي الوحيدة في البلد بتستقبل كل المستويات الاجتماعية، controls من مستشفى مجاني بس مش هيمثلوا الطيف ده. والـ control ممكن يكون عنده مرض **تاني**؛ المهم إنه ما عندوش المرض اللي بندرسه.
      - kind: explain
        page: 20
        quote: "Criteria for control\nMatching by all respect with cases except not having disease\nHospital controls\nNeighborhoods controls\nFriends and relatives\nControls from general population"
        title: "الـ control بيتجاب منين؟"
        text: |
          القاعدة الأولى: ==matching by all respect with cases except not having disease==: الـ control شبه الـ case في كل حاجة، إلا المرض.

          والمصادر: **hospital**، **neighborhood**، **friends and relatives**، و**general population**.

          ليه «في كل حاجة إلا المرض»؟ لأن أي فرق تاني بين المجموعتين ممكن يبان كأنه سبب، وهو مجرد اختلاف في الناس. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 22
        quote: "Confounding factors: These are factors other than the studied exposure that disturb the relation between the studied exposure and the disease"
        title: "الـ confounder: الطرف التالت"
        text: |
          ==Confounding factor== = عامل **غير** الـ exposure اللي بندرسه، بيلخبط العلاقة بين الـ exposure والمرض.

          علشان يبقى confounder لازم يكون:

          - مرتبط بالـ **exposure**،
          - وبيأثر لوحده على **المرض**.

          الدكتورة نبّهت في الشرح: مش أي فرق بين المجموعتين يبقى confounder أوتوماتيك؛ دوّر على العامل البديل اللي مرتبط بالاتنين.
      - kind: figure
        page: 23
        title: "شريحة 23: الـ confounder بين السبب والنتيجة"
        image: { file: res/L05-s23-confounder.webp, book: true }
        alt: "Diagram: a box labelled Cause (independent variable) on the left and a box labelled Effect/outcome (dependent variable) on the right, joined by a curved arrow from cause to effect. Below, a dark red box labelled Other factor (confounding variable) has a curved arrow up to the cause and another curved arrow up to the effect."
        caption: |
          الرسمة دي بتحط التعريف اللي فوق في مثلث:

          - **فوق شمال**: **Cause (independent variable)**.
          - **فوق يمين**: **Effect/outcome (dependent variable)**، وسهم من السبب للنتيجة: العلاقة اللي بندرسها.
          - **تحت**: **Other factor (confounding variable)**، طالع منه سهمين: واحد للـ cause وواحد للـ effect.

          اللي تاخده: الـ confounder ==مربوط بالاتنين==؛ لو شلت السهم اللي فوق خالص، السهمين اللي تحت لوحدهم ممكن يعملوا association كدّابة بين الـ cause والـ effect.
      - kind: figure
        page: 25
        quote: "Coffee (Exposure) → Pancreatic Cancer (Disease), with Smoking (Confounder) linked to both"
        title: "القهوة، السجاير، والـ pancreas"
        alt: "Triangle. Coffee (exposure) with a dashed arrow to pancreatic cancer (disease). Smoking (confounder) at the bottom, linked both ways to coffee and with a solid arrow to pancreatic cancer."
        caption: "شاربين القهوة بيدخنوا أكتر، والتدخين بيعمل pancreatic cancer. فالقهوة **شكلها** متهمة، والـ confounder هو اللي عمل كده."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R05c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="R05d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
