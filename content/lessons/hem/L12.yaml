        tone: exam
        page: 201
        quote: "(a) Large granular lymphocytes in the peripheral blood. (b) Adult T-cell leukaemia /lymphoma, Typical\nconvoluted lymphoid cells in peripheral blood"
        text: "نفس الصفحة فيها صور دم: الـ **adult T-cell leukaemia/lymphoma (ATLL)** خلاياه **convoluted** (نواة ملفوفة زي الوردة)، وده نفس الـ nuclear contour اللي في جدول ص 200. والـ ATLL ده بتاع الـ HTLV-1 (ص 199)، يعني تلات صفحات بيقولوا نفس الحكاية."
      - kind: figure
        page: 201
        quote: "(a) Large granular lymphocytes in the peripheral blood. (b) Adult T-cell leukaemia /lymphoma, Typical\nconvoluted lymphoid cells in peripheral blood"
        title: "صورة الكتاب: large granular lymphocytes والـ ATLL"
        image: { file: hem/L12-lgl-atll-films.webp, book: true }
        alt: "Book photomicrographs of blood. (a) Left, two panels: single large lymphocytes with plenty of pale cytoplasm containing scattered purple granules. (b) Right: several lymphoid cells with deeply folded, flower-shaped nuclei among red cells."
        caption: |
          صورتين دم، والحروف تحت:

          - **(a) الشمال** (لقطتين): lymphocytes **كبيرة**، الـ cytoplasm فاتح وكتير وفيه ==granules== بنفسجي = **large granular lymphocytes**.
          - **(b) اليمين**: خلايا نواتها **ملفوفة ومتقسمة زي الوردة** (convoluted) = ==ATLL==.

