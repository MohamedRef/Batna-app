  - id: hem.L01.lesson3
    title: "الهرمونات اللي بتدير المصنع، ولما المصنع يتعب"
    hook: "الكلية هي اللي بتقرر تعمل كام كرة حمرا، والطحال ممكن يرجع لشغلته القديمة لو النخاع وقع."
    minutes: 8
    pages: [5, 8]
    topics: [growth-factors, erythropoietin, platelets, extramedullary, gene-therapy]
    goals:
      - "تقسّم الـ growth factors حسب الخلية اللي بيشتغلوا عليها"
      - "تشرح الـ erythropoietin: مصدره، اللي بيطلّعه، وبيشتغل فين"
      - "تعرف إمتى يحصل extramedullary haematopoiesis وليه الـ HSCs حلوة للـ gene therapy"
    status: unverified
    steps:
      - kind: explain
        page: 5
        title: "الـ growth factors: مين وإزاي"
        quote: "They act locally at the site where they are produced (paracrine) or circulate in the plasma (endocrine)."
        text: |
          الـ ==haematopoietic growth factors== بتنظّم تكاثر وتمايز الـ progenitors، **وكمان** شغل الخلايا الناضجة.

          بيشتغلوا **paracrine** (مكان ما اتعملوا) أو **endocrine** (في الدم)، على **receptors** مخصوصة.

          بيتعملوا من: **T lymphocytes**، **monocytes/macrophages**، **endothelial cells**، و **fibroblasts** (stromal cells).
      - kind: table
        page: 6
        quote: "B- Acting on pluripotential cells"
        title: "الـ growth factors حسب الهدف"
        columns: [Target, Factors]
        rows:
          - ["Stromal cells", "IL-1, TNF"]
          - ["Pluripotential", "SCF"]
          - ["Early multipotential", "IL-3, IL-6, GM-CSF"]
          - ["1–2 lineages", "G-CSF, M-CSF, IL-5"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: tip
        page: 6
        quote: "They stimulate production of GM-CSF, G-CSF, M-CSF, IL-6"
        text: "اقرا الجدول من **فوق لتحت = من العام للخاص**. الـ **IL-1 و TNF** مش بيكلموا الخلايا مباشرة: بيزقّوا الـ stroma تعمل **GM-CSF و G-CSF و M-CSF و IL-6**. والـ SCF للـ stem cell نفسها، وكل ما تنزل الـ factor يبقى أضيق."
      - kind: sort
        page: 6
        quote: "C- Acting on early multipotential cells"
        prompt: "حط كل factor في مستواه:"
        bins: ["Stroma", "Pluripotential", "Early multipotential", "1–2 lineages"]
        cards:
          - { text: "IL-1", bin: 0 }
          - { text: "TNF", bin: 0 }
          - { text: "SCF", bin: 1 }
          - { text: "IL-3", bin: 2 }
          - { text: "GM-CSF", bin: 2 }
          - { text: "G-CSF", bin: 3 }
          - { text: "IL-5 (Eo-CSF)", bin: 3 }
          - { text: "M-CSF", bin: 3 }
        why: "الـ **GM-CSF** واسع (two lineages بدري، multipotential)، أما **G-CSF** و **M-CSF** كل واحد لـ lineage واحد، و **IL-5** هو الـ Eo-CSF للـ eosinophils."
      - kind: explain
        page: 6
        title: "الـ erythropoietin: الكلية بتطلب كرات حمرا"
        quote: "The rate of erythropoiesis is primarily regulated by the hormone erythropoietin which is secreted by the kidneys."
        text: |
          سرعة الـ erythropoiesis بيتحكم فيها أساسًا ==erythropoietin==، اللي بتفرزه **الكلية**.

          - **المحفّز**: ==renal hypoxia==؛ الكلية حاسة إن الأكسجين قليل.
          - **بيشتغل فين**: بيسرّع تحويل **CFU-E** لـ **pronormoblasts**.
      - kind: figure
        page: 6
        quote: "Its production is stimulated by renal hypoxia."
        title: "الـ feedback loop"
        alt: "A loop: low oxygen reaches the kidney (renal hypoxia), the kidney secretes erythropoietin, erythropoietin speeds CFU-E to pronormoblast in the marrow, more red cells carry more oxygen, which switches the signal off."
        caption: "أكسجين قليل ← الكلية تفرز **EPO** ← النخاع يسرّع **CFU-E → pronormoblast** ← كرات حمرا أكتر ← أكسجين يرجع، والإشارة تهدى."
        svg: |
