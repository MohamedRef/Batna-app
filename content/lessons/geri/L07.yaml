        title: "الـ MoCA بالعربي"
        quote: "MOCA"
        text: |
          الكتاب حاطط نسخة **MoCA** عربي (الجمل والخرتيت والأسد). المجموع من **30**، والطبيعي **26 أو أكتر**، وبنزوّد نقطة لو التعليم **12 سنة أو أقل**.

          ليه النقطة الزيادة؟ التفسير المقبول (مش في الكتاب): أسئلة زي رسم المكعب والحساب وتوصيل الأرقام والحروف بتعتمد على التعليم، فاللي اتعلم أقل هياخد درجة أقل وهو سليم. النقطة بتعدّل الظلم ده عشان ما تشخّصش dementia غلط.
