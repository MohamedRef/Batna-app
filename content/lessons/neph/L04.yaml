      - kind: aside
        tone: analogy
        page: 85
        quote: "Cardiac changes\n1- Resistance vessels \"small arteries and arterioles\" have increased wall thicknees and reduction of vessel lumen diameter which leads to increased vascular resistance which maintains HT\n2- ↑Rarefaction of B.V. \"↓ density\"\n3- Normal Cardiac output\nLarge vessels:\n  Thick media\n  ↑ Collagen\n  Secondary calcium deposition\n4- Loss of compliance → pronounced arterial presure wave.\n5- Pulse wave velocity, it measures arterial stiffness and is inversely related to distensibility\n6- LVH resulting from ↑ PVR and ↑ L.V. Load is a significant prognostic indicator of C.V. events."
        text: |
          الـ **pulse wave velocity** زي الصوت في خرطوم: الخرطوم الطري بيمتص الموجة فتمشي بالراحة، والـ **ناشف** بيوصّلها بسرعة. علشان كده الـ pulse wave velocity بيقيس الـ ==arterial stiffness== وعكس الـ distensibility.

          ومع **↑peripheral vascular resistance (PVR)** القلب يشيل حمل أكتر ← ==left ventricular hypertrophy (LVH)==، وده prognostic indicator مهم للـ cardiovascular (CV) events.
      - kind: explain
        page: 85
        quote: "Normal Cardiac output"
        title: "ليه الـ cardiac output طبيعي والضغط عالي؟"
        text: |
          الكتاب: الـ **resistance vessels** (small arteries و arterioles) جدارها **تخين** والـ lumen **ضيق**، ومعاها **rarefaction** (عدد أوعية أقل)، والـ **cardiac output طبيعي**، والـ **LVH** prognostic.

          التفسير المقبول (مش في الكتاب): الضغط = output × resistance. لو الـ output طبيعي، **يبقى** اللي عالي هو الـ **resistance**. والـ lumen الضيق مع أوعية أقل **بيعني** نفس الدم بيعدّي في مواسير أقل وأضيق. القلب بيضخ ضد مقاومة أعلى، **فـ** عضلته تتخن (LVH)، وده بيزوّد الـ CV events.
      - kind: explain
        remind: [neph.L04.048, neph.L04.045]
        page: 86
        title: "التمن: end-organ damage"
        quote: "HT patients have a sixfold increase in strokes There is a threefold increase in cardiac death. (IHD or HF)."
        text: |
          المخ (hemorrhage، stroke)، القلب (LVH، coronary heart disease (CHD)، congestive heart failure (CHF))، العين (retinopathy)، الـ peripheral vascular disease (PVD)، والكلى (renal failure، proteinuria).

          الأرقام: stroke **×6**، cardiac death **×3**، PVD **×2**.

          ==Malignant (accelerated) HT==: الضغط يطلع بسرعة مع **diastolic blood pressure (DBP) >120** و **fibrinoid necrosis**. من غير علاج: renal failure بـ proteinuria و hematuria، heart failure (HF)، aortic dissection، stroke، cerebral edema، hemorrhage، و HT encephalopathy.

          التفسير المقبول (مش في الكتاب): الأعضاء دي بالذات **لأن** فيها أوعية صغيرة كتير شغالة تحت ضغط عالي على طول (المخ، الكلية، الشبكية)، أو عضلة بتضخ ضد الضغط (القلب).
      - kind: figure
        page: 85
        quote: "Complications of Hypertension: End-Organ Damage"
        title: "الضغط بيضرب فين؟ رسمة الكتاب"
        image: { file: neph/L04-end-organ-damage.webp, book: true }
        alt: "Book diagram 'Complications of hypertension: end-organ damage'. A brown 'Hypertension' bar in the centre with yellow arrows to: brain (hemorrhage, stroke) on the left; heart (LVH, CHD, CHF) on the right; eye (retinopathy) lower left; artery (peripheral vascular disease) in the middle; kidney (renal failure, proteinuria) lower right. A key: CHD coronary heart disease, CHF congestive heart failure, LVH left ventricular hypertrophy."
        caption: |
          في النص الشريط البني **Hypertension**، ومنه 5 أسهم صفرا لـ 5 أعضاء:

          - **فوق شمال: المخ**: **Hemorrhage، Stroke**.
          - **فوق يمين: القلب**: **LVH** (left ventricular hypertrophy)، **CHD** (coronary heart disease)، **CHF** (congestive heart failure).
          - **تحت شمال: العين**: **Retinopathy**.
          - **في النص تحت: الشريان**: **Peripheral Vascular Disease**.
          - **تحت يمين: الكلية**: **Renal Failure، Proteinuria**.

          الرسمة هي خريطة الـ ==target organ damage==: نفس الشرايين المتخنة في كل عضو، وده ليه هدف العلاج مش رقم الضغط وبس، ==حماية الأعضاء دي==.
      - kind: explain
        page: 86
        quote: "It occurs when BP rises rapidly with diastolic BP > 120, with fibrinoid"
        title: "ليه الـ malignant HT بيدمّر بسرعة؟"
        text: |
          الكتاب: الضغط **بيطلع بسرعة** مع **DBP > 120** و **fibrinoid necrosis** في جدار الأوعية، ومن غير علاج: renal failure و proteinuria و hematuria، HF، dissection، stroke، cerebral edema، و encephalopathy.

          التفسير المقبول (مش في الكتاب): السرعة هي المشكلة. الأوعية في الضغط المزمن بتلحق تتخن وتحمي نفسها؛ في الـ malignant مفيش وقت، **فـ** الجدار نفسه بيموت (fibrinoid necrosis). الكلية اللي أوعيتها اتقفلت **بتطلّع renin أكتر**، والضغط يعلى أكتر: دايرة. والـ hematuria والـ proteinuria **لأن** الـ glomeruli نفسها بتتجرح.
      - kind: table
        page: 86
        quote: "GII: GI + arteriovenous nipping. GIII: GII + flame shaped hemorrhages, soft exudates \" Cotton wall \"due to small infarcts"
        title: "Keith–Wagener"
        columns: [Grade, Adds]
        rows:
          - ["I", "Tortuous arteries, silver wiring"]
          - ["II", "AV nipping"]
          - ["III", "Flame hemorrhages, cotton wool exudates"]
          - ["IV", "Papilledema"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 86
        quote: "GIII and IV are diagnostic of malignant HT"
        title: "ليه كل grade شكله كده؟"
        text: |
          الكتاب: grade I silver wiring، grade II AV nipping، grade III flame hemorrhages و soft exudates (cotton wool، **due to small infarcts**)، grade IV papilledema. و**grade III و IV** diagnostic of malignant HT.

          التفسير المقبول (مش في الكتاب):

          - **Silver wiring:** جدار الشريان اتخن فبيعكس النور زي سلك.
          - **AV nipping:** الشريان التخين **بيضغط** الوريد عند التقاطع.
          - **Flame hemorrhages:** أوعية صغيرة بتتقطع في طبقة الألياف العصبية، **فـ** الدم ياخد شكل الألياف.
          - **Papilledema:** ورم في الـ optic disc من الضغط العالي جدًا، **يعني** المخ نفسه في خطر.

          Grade I و II ممكن يحصلوا في ضغط مزمن عادي، **عشان** كده مش diagnostic للـ malignant.
      - kind: figure
        page: 87
        quote: "Figure 14.117: Fundus showing hypertensive changes: Grade 4 retinopathy with papilloedema, haemorrhages and exudates."
        title: "شكل 14.117 في الكتاب: Grade 4 retinopathy"
        image: { file: neph/L04-fundus-grade4.webp, book: true }
        alt: "Book fundus photograph of hypertensive retinopathy grade 4: a swollen, pale, blurred optic disc in the lower centre (papilloedema), two white fluffy patches in the upper left (exudates), small red blot haemorrhages in the left periphery and below the disc, and narrowed tortuous arteries."
        marks:
          - { at: [0.25, 0.25], label: "Exudate" }
          - { at: [0.23, 0.45], label: "Exudate" }
          - { at: [0.33, 0.72], label: "Haemorrhage", kind: arrow }
          - { at: [0.55, 0.64], label: "Papilloedema" }
        caption: |
          صورة قاع عين، والعلامات عليها بالأرقام:

          1. و 2. **البقعتين البيض فوق شمال**: **exudates** (الـ cotton wool spots: infarcts صغيرة في طبقة الألياف العصبية).
          3. **النقط الحمرا الصغيرة** تحت شمال: **haemorrhages**.
          4. **الـ optic disc تحت في النص**: باهت ومنفوخ وحوافه ==مش واضحة==: ده الـ **papilloedema**.

          والشرايين نفسها رفيعة ومتعرّجة. يعني الصورة فيها كل درجات Keith–Wagener مع بعض: GIII (haemorrhages و exudates) + ==papilloedema== = **Grade IV**، وده تشخيصي للـ ==malignant HT==.
      - kind: aside
        tone: trap
        page: 86
        quote: "GIII and IV are diagnostic of malignant HT"
        text: |
          ==GIII و GIV== هما اللي **diagnostic of malignant HT**. يعني مش لازم تستنى الـ papilledema: الـ flame hemorrhages والـ cotton wool لوحدهم كفاية.
