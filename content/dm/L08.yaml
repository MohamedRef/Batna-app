    kind: mcq
    topic: pyramid
    stem: A 50-year-old man with type 2 diabetes eats about 450 g of grilled meat a day. Using the lecture's serving size, how many meat servings is this and how does it compare with the advice?
    options:
      - "About 4 servings: above the 2–3 a day advised"
      - "About 2 servings: within the advice"
      - "About 9 servings: far above the advice"
      - "About 1 serving: below the advice"
      - "Servings do not apply to meat"
    answer: 0
