    src: { page: 137, quote: "If pheochromocytoma is suspected as the underlying cause of the hypertensive crisis, the treatment of choice should be intravenous α- blockers such as:\n  Phentolamine (1–5 mg repeated every 15 min as required).\n  Phenoxybenzamine (1 mg/kg infused over at least 2 hours, with risk of contact sensitivity)." }
