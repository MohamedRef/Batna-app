  - id: hb.L03.095
    kind: mcq
    topic: endoscopy
    stem: A 55-year-old man with HCV cirrhosis had small varices that flattened with insufflation a year ago. Surveillance endoscopy now shows a large column of varices. During banding, a little oozing occurs and stops with more bands. What is the next step?
    options:
