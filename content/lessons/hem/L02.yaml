            <path d="M190 125 L244 130" class="fg-thin"/>
            <text x="244" y="126" class="t-sm t-b">Spleen</text>
            <text x="244" y="140" class="t-sm t-mut">soft or firm</text>
            <path d="M120 176 L80 170" class="fg-thin"/>
            <text x="5" y="160" class="t-sm t-b">Spoon nails</text>
            <text x="5" y="174" class="t-sm t-mut">iron deficiency</text>
            <path d="M120 182 L80 204" class="fg-thin"/>
