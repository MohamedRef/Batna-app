schema: batna.lesson/v1
lecture: dm.L02
lessons:
  # ------------------------------------------------------------------
  - id: dm.L02.lesson1
    title: "إشارة المرور: مين نعمله test ومتى نعيد؟"
    hook: "أحمر، أصفر، أخضر: تلات أرقام لكل test. والأهم: مين يستاهل نكشف عليه أصلًا."
    minutes: 8
    pages: [18, 20]
    topics: [diagnosis, screening]
    goals:
      - "تقرا الـ ADA cut-offs من إشارة المرور"
      - "تعرف امتى الـ A1C ممنوع"
      - "تحفظ مين نعمله screening وكل قد إيه نعيد"
    status: unverified
    steps:
      - kind: figure
        page: 18
        title: "إشارة المرور بتاعة الكتاب"
        image: { file: dm/L02-ada-cutoffs.webp, book: true }
        caption: "الأحمر **diabetes**، الأصفر **prediabetes**، الأخضر **normal**. الجديد هنا عن المحاضرة الأولى: الـ A1C للـ prediabetes ليه سقف ==5.7–6.4%==."
        alt: "Book figure: three traffic lights for A1C, fasting glucose and glucose tolerance test. Red diabetes: 6.5% or above, 126 mg/dL or above, 200 mg/dL or above. Amber prediabetes: 5.7–6.4%, 100–125, 140–199. Green normal: below 5.7%, 99 or below, 140 or below."
      - kind: explain
        page: 18
        title: "الـ A1C: بشرطين"
        quote: "In conditions such as hemoglobinopathies, HIV, hemodialysis, recent blood loss or transfusion, or erythropoietin therapy, only plasma blood glucose criteria should be used"
        text: |
          1. لازم يتعمل بـ method ==NGSP-certified== (National Glycohemoglobin Standardization Program)، علشان ما نشخّصش غلط أو نفوّت حالة.
          2. في الحالات دي **plasma glucose بس**:
          - **hemoglobinopathies**
          - **HIV**
          - **hemodialysis**
          - **recent blood loss أو transfusion**
          - **erythropoietin therapy**
      - kind: reveal
        page: 18
        quote: "In conditions such as hemoglobinopathies, HIV, hemodialysis, recent blood loss or transfusion, or erythropoietin therapy, only plasma blood glucose criteria should be used"
        prompt: "عيانة اتنقل لها دم من 3 أسابيع. الـ A1C هيطلع أعلى ولا أقل من الحقيقة؟"
        answer: |
          غالبًا **أقل**. الدم المنقول والكرات الجديدة ما عاشتش وسط سكرها 120 يوم، فنسبة الـ hemoglobin المسكّر بتقل.

          علشان كده الكتاب بيقول: في **recent blood loss or transfusion** استخدم **plasma glucose** بس. (التفسير فسيولوجي؛ القاعدة من الكتاب.)
      - kind: explain
        page: 18
        title: "مين نعمله screening؟"
        quote: "should be considered in adults of any age with overweight or obesity (BMI ≥25 kg/m2 who have one or more risk factors"
        text: |
          **أي سن** لو ==BMI ≥25== ومعاه **risk factor واحد أو أكتر**:
          - قريب درجة أولى عنده diabetes
          - high-risk race/ethnicity
          - history of **CVD**
          - **hypertension**
          - **HDL <35** و/أو **TG >250 mg/dL**
          - **PCOS**
          - **physical inactivity**
          - علامات insulin resistance زي **acanthosis nigricans**

          ولكل الناس: ابدأ من سن ==35==. وكمان أي حد عنده **HIV**.
      - kind: mnemonic
        page: 19
        quote: "Hypertension Physical inactivity Polycystic ovary syndrome HDL level <35 mg/dL and/or a triglyceride level >250 mg/dL"
        word: "FRESH PIA"
        parts:
          - { key: "F", text: "First-degree relative with diabetes" }
          - { key: "R", text: "Race/ethnicity: high-risk" }
          - { key: "E", text: "Event: history of CVD" }
          - { key: "S", text: "Systolic up: hypertension" }
          - { key: "H", text: "HDL <35 and/or TG >250" }
          - { key: "P", text: "PCOS" }
          - { key: "I", text: "Inactivity" }
          - { key: "A", text: "Acanthosis nigricans (insulin resistance)" }
        hook: "عيان **BMI ≥25** محتاج نفس **FRESH**، ومعاه **PIA**. لو عنده حرف واحد من دول، اعمله test."
      - kind: check
        page: 18
        quote: "should be considered in adults of any age with overweight or obesity (BMI ≥25 kg/m2 who have one or more risk factors"
        question: "28-year-old, BMI 27, PCOS, no symptoms. Screen?"
        options: ["Yes, now", "No, wait until 35", "Only if BMI ≥30", "Only if she has symptoms"]
        answer: 0
        why:
          - "صح: **BMI ≥25** + **PCOS** = test في أي سن."
          - "الـ 35 لكل الناس، بس الـ overweight مع risk factor بيتكشف أي سن."
          - "الحد 25 مش 30."
          - "الـ screening أصلًا للناس اللي من غير أعراض."
      - kind: explain
        page: 19
        title: "الحمل في الـ ADA"
        quote: "Screen individuals with gestational diabetes mellitus for prediabetes or diabetes at 4–12 weeks postpartum"
        text: |
          1. **قبل الحمل:** screen اللي عندها risk factors، وفكّر تعمل test لكل الستات في سن الإنجاب.
          2. **قبل 15 أسبوع:** في أول prenatal visit، test اللي عندها risk factors (وفكّر في الكل) بالمعايير العادية لو ما اتعملهاش قبل الحمل.
          3. **24–28 أسبوع:** screen للـ **GDM**.
          4. **بعد الولادة:** اللي كان عندها GDM تتعمل test في ==4–12 weeks postpartum==.
      - kind: table
        page: 20
        quote: "People with prediabetes should be tested yearly. People who were diagnosed with GDM should have lifelong testing at least every 3 years"
        title: "نعيد امتى؟"
        columns: [Group, Repeat]
        rows:
          - ["Prediabetes", "Yearly"]
          - ["Previous GDM", "Lifelong, ≥ every 3 years"]
          - ["Normal result", "At least every 3 years"]
          - ["Very high risk, weight gain", "Shorter intervals"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: tip
        page: 20
        quote: "If results are normal, testing should be repeated at a minimum of 3-year intervals"
        text: "قاعدة **1 و 3**: الـ **prediabetes** كل **سنة**، والباقي (normal أو GDM قديم) كل **3 سنين** على الأقل. والـ GDM القديم **مدى الحياة**."
      - kind: try
        items: [dm.L02.001, dm.L02.004, dm.L02.006, dm.L02.012, dm.L02.013]
    recap:
      - "A1C: diabetes ≥6.5، prediabetes 5.7–6.4، normal <5.7؛ لازم NGSP-certified."
      - "Glucose بس في hemoglobinopathies، HIV، dialysis، نزيف أو نقل دم، EPO."
      - "Screen أي سن لو BMI ≥25 + risk factor (**FRESH PIA**)؛ الكل من 35؛ وأي حد عنده HIV."
      - "GDM: 24–28 أسبوع؛ بعد الولادة 4–12 أسبوع؛ وبعدها كل 3 سنين مدى الحياة."
      - "Prediabetes كل سنة؛ normal كل 3 سنين على الأقل."
    practice: [dm.L02.001, dm.L02.002, dm.L02.003, dm.L02.004, dm.L02.005, dm.L02.006, dm.L02.007, dm.L02.008, dm.L02.009, dm.L02.010, dm.L02.011, dm.L02.012, dm.L02.013, dm.L02.014, dm.L02.065, dm.L02.066, dm.L02.067]
  # ------------------------------------------------------------------
  - id: dm.L02.lesson2
    title: "امنع، استهدف، وخسّ: 7% و 7% و 5%"
    hook: "رقم 7 بيتكرر: 7% وزن تمنع بيه السكر، و A1C أقل من 7 للعلاج."
    minutes: 10
    pages: [20, 23]
    topics: [prevention, targets, weight]
    goals:
      - "تدير الـ prediabetes (سؤال كتاب)"
      - "تحفظ الـ glycemic targets والـ CGM targets"
      - "تعرف أرقام الوزن والأدوية والـ metabolic surgery"
    status: unverified
    steps:
      - kind: explain
        page: 20
        title: "منع الـ type 2: تلات أدوات"
        quote: "intensive lifestyle behavior change program to achieve and maintain a weight reduction of at least 7% of initial body weight."
        text: |
          - **Monitor:** الـ prediabetes يتعمله test **كل سنة على الأقل**.
          - **Lifestyle:** الـ overweight/obese عالي الخطورة يتحوّل لـ **intensive lifestyle program** هدفه ==≥7%== من وزنه الأصلي ويحافظ عليه.
          - **Metformin:** للـ high risk، خصوصًا:
          - سن **25–59**
          - **BMI ≥35**
          - **FPG ≥110**
          - **A1C ≥6.0%**
          - **prior GDM**
      - kind: explain
        page: 20
        title: "Pioglitazone: علاج للمخ والقلب"
        quote: "pioglitazone may be considered to lower the risk of stroke or myocardial infarction."
        text: |
          لو العيان عنده **history of stroke** + **insulin resistance** + **prediabetes**، الـ ==pioglitazone== ممكن يقلل خطر **stroke أو MI**.

          بس لازم توازن مع: **weight gain**، **edema**، **fracture**.
      - kind: check
        page: 20
        quote: "especially those aged 25–59 years with BMI ≥35 kg/m2, higher FPG (e.g., ≥110 mg/dL), and higher A1C (e.g., ≥6.0%), and in individuals with prior GDM."
        question: "Prediabetes, 40 y, BMI 37, FPG 115, A1C 6.2%. Add to lifestyle?"
        options: ["Metformin", "Pioglitazone", "Insulin", "Nothing"]
        answer: 0
        why:
          - "صح: السن والـ BMI والـ FPG والـ A1C كلهم في رينج الـ metformin."
          - "الـ pioglitazone للي عنده stroke قديم و insulin resistance."
          - "الـ insulin مش علاج وقائي."
          - "دي high risk؛ الوقاية مطلوبة."
      - kind: explain
        page: 20
        title: "الأهداف"
        quote: "An A1C goal for many nonpregnant adults of <7% without significant hypoglycemia is appropriate."
        text: |
          - **A1C <7%** لأغلب الكبار غير الحوامل، من غير hypoglycemia كبيرة.
          - **أقل من 7** مقبول وممكن مفيد، **لو** بأمان.
          - **أقل صرامة (<8%)** لو العمر المتوقع قصير أو ضرر العلاج أكبر من فايدته.

          وبالـ **CGM** (ambulatory glucose profile):
          - ==Time in range >70%==
          - **Time below range <4%**
          - **Time <54 mg/dL <1%**
      - kind: figure
        page: 21
        quote: "time in range of >70% with time below range <4% and time <54 mg/dL <1%."
        title: "شريط الـ CGM"
        alt: "A horizontal bar of a CGM day: green time in range more than 70 percent, amber time below range less than 4 percent, of which red time below 54 less than 1 percent; the rest is above range."
        caption: "ركّز على الأخضر: ==أكتر من 70%==. والأحمر (تحت 54) لازم يبقى أقل من **1%** لأنه الـ hypoglycemia الخطيرة."
        svg: |
          <svg viewBox="0 0 330 150" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="30" width="12" height="40" class="fg-dot-bad"/>
            <rect x="22" y="30" width="24" height="40" class="fg-acc"/>
            <rect x="46" y="30" width="220" height="40" class="fg-good"/>
            <rect x="266" y="30" width="54" height="40" class="fg-box"/>
            <text x="156" y="55" text-anchor="middle" class="t-b t-good">In range &gt;70%</text>
            <text x="293" y="55" text-anchor="middle" class="t-sm">above</text>
            <text x="16" y="20" text-anchor="middle" class="t-sm t-bad t-b">&lt;1%</text>
            <text x="34" y="92" text-anchor="middle" class="t-sm t-b">&lt;4%</text>
            <text x="10" y="112" class="t-sm t-mut">red: below 54 mg/dL</text>
            <text x="10" y="128" class="t-sm t-mut">amber + red: below range</text>
          </svg>
      - kind: explain
        page: 21
        title: "الوزن: كل كيلو بيفرق"
        quote: "Relatively small weight loss (approximately 3–7% of baseline weight) improves glycemia and other intermediate cardiovascular risk factors."
        text: |
          - الهدف لأغلب الـ type 2 الـ overweight: ==≥5%== بالأكل والحركة والـ behavioral therapy.
          - **3–7%** بيحسّن السكر والـ CV risk factors.
          - **>10%** ممكن يعمل ==remission== للـ type 2، ويحسّن الـ CV outcomes والـ mortality.
          - المهم الـ **energy deficit**، مش نوع الـ macronutrients. والأكل **individualized**.
          - الـ **supplements** مفيش دليل إنها بتخسّس.
      - kind: aside
        tone: joke
        page: 22
        quote: "There is no clear evidence that nutrition supplements are effective for weight loss."
        text: "المكمّل اللي بيتعلن عنه «خسّ 10 كيلو وانت نايم» بيخسّس حاجة واحدة بالتأكيد: **محفظتك**. الكتاب صريح: **no clear evidence**."
      - kind: explain
        page: 22
        title: "أدوية التخسيس"
        quote: "effective as an adjunct to nutrition, physical activity, and behavioral counseling for selected people with type 2 diabetes and BMI ≥27 kg/m2."
        text: |
          - اختار دوا السكر وانت حاطط في دماغك ==effect on weight==.
          - **Obesity pharmacotherapy:** adjunct لـ type 2 مع **BMI ≥27**.
          - **فعّال** لو **≥5%** بعد **3 شهور**، ويكمل يخسّس لو كمّل.
          - لو مفيش response بدري أو مشاكل tolerability: فكّر توقفه وتدوّر على بديل.
      - kind: table
        page: 22
        quote: "Metabolic surgery should be a recommended option to treat type 2 diabetes with BMI ≥40 kg/m2 and in adults with BMI 35.0–39.9 kg/m2"
        title: "Metabolic surgery بالـ BMI"
        columns: [BMI, Surgery]
        rows:
          - ["≥40", "Recommended"]
          - ["35–39.9", "Recommended if nonsurgical fails"]
          - ["30–34.9", "May be considered if nonsurgical fails"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 23
        title: "بعد العملية"
        quote: "People who undergo metabolic surgery should receive long-term medical and behavioral support and routine micronutrient, nutritional, and metabolic status monitoring."
        text: |
          - تتعمل في **high-volume centers** مع فريق multidisciplinary فاهم في الـ obesity والسكر وجراحة الجهاز الهضمي.
          - بعدها: **long-term** medical و behavioral support، ومتابعة ==micronutrients== والتغذية والـ metabolic status.
      - kind: case
        page: 22
        quote: "Metabolic surgery may be considered as an option to treat type 2 diabetes in adults with a BMI of 30.0–34.9 kg/m2"
        stem: "Type 2 diabetes, BMI 32. Two years of diet, exercise and drugs; uncontrolled and no durable weight loss."
        steps:
          - question: "Metabolic surgery?"
            options: ["May be considered", "Recommended", "Not an option below 35", "Only if BMI ≥40"]
            answer: 0
            why: "الـ **30–34.9** = **may be considered** لو الطرق غير الجراحية فشلت. الـ recommended من 35."
          - question: "After surgery, which follow-up matters most?"
            options: ["Lifelong micronutrient and metabolic monitoring with support", "None; diabetes is cured", "Only yearly A1C", "Only weight"]
            answer: 0
            why: "الكتاب: **long-term** support و **routine micronutrient, nutritional, and metabolic status monitoring**."
      - kind: try
        items: [dm.L02.016, dm.L02.017, dm.L02.022, dm.L02.027, dm.L02.033]
    recap:
      - "Prediabetes: test كل سنة، lifestyle ≥7%، metformin (25–59، BMI ≥35، FPG ≥110، A1C ≥6، prior GDM)."
      - "Pioglitazone لو stroke قديم + insulin resistance؛ احسب weight gain و edema و fracture."
      - "A1C <7؛ <8 لو العمر قصير أو الضرر أكبر. CGM: TIR >70، TBR <4، <54 أقل من 1%."
      - "≥5% وزن للأغلبية؛ 3–7% بيحسّن؛ >10% ممكن remission. الـ supplements لأ."
      - "أدوية التخسيس من BMI 27، فعّالة ≥5% في 3 شهور. Surgery: ≥40 أو 35–39.9 recommended؛ 30–34.9 may be considered."
    practice: [dm.L02.015, dm.L02.016, dm.L02.017, dm.L02.018, dm.L02.019, dm.L02.020, dm.L02.021, dm.L02.022, dm.L02.023, dm.L02.024, dm.L02.025, dm.L02.026, dm.L02.027, dm.L02.028, dm.L02.029, dm.L02.030, dm.L02.031, dm.L02.032, dm.L02.033, dm.L02.034, dm.L02.035, dm.L02.068, dm.L02.069, dm.L02.070, dm.L02.071, dm.L02.072, dm.L02.073, dm.L02.074, dm.L02.086, dm.L02.090]
