schema: batna.lesson/v1
lecture: res.L03
lessons:
  # ------------------------------------------------------------------
  - id: res.L03.lesson1
    title: "كل بحث بيبدأ بسؤال"
    hook: "قبل الـ sample size والـ SPSS والـ p-value: سؤال واحد واضح هو اللي بيحدد كل حاجة بعده."
    minutes: 8
    pages: [1, 11]
    topics: [process]
    goals:
      - "تعرّف الـ research question وتعرف هو بيعمل إيه في البحث"
      - "ترتّب خطوات الـ research proposal وتعرف السؤال والأهداف مكانهم فين"
      - "تختار الـ study design المناسب من نوع السؤال"
    status: unverified
    steps:
      - kind: explain
        page: 8
        quote: "The first step in any research project is to clearly define the research question"
        title: "أول خطوة، مش أي خطوة"
        text: |
          تخيّل إنك قاعد في عيادة الصدر، وكل يوم يجيلك مريض **COPD** بيشرب شيشة. في دماغك سؤال: "هي الشيشة دي بتعمل إيه في الرئة بالظبط؟"

          الإحساس ده لسه مش بحث. البحث بيبدأ لما تحوّله لـ ==research question== واضح، وده بالنص **the first step in any research project**.

          من غير سؤال واضح هتلم data كتير ومش هتعرف تعمل بيها إيه.
      - kind: explain
        page: 5
        quote: "Curiosity-driven Needs-driven Profit-driven Opportunity-driven"
        title: "الأفكار بتيجي منين؟"
        text: |
          المحاضرة بتقول إن الـ health research بيتحرك بأربع حاجات:

          - **Curiosity-driven:** حاجة شدّت انتباهك وعايز تفهمها.
          - **Needs-driven:** في مشكلة حقيقية محتاجة حل.
          - **Profit-driven:** حد هيكسب من النتيجة، زي شركة دوا.
          - **Opportunity-driven:** جات فرصة: جهاز جديد، grant، أو داتا جاهزة.
      - kind: sort
        page: 5
        quote: "Curiosity-driven Needs-driven Profit-driven Opportunity-driven"
        prompt: "كل فكرة بحث دي جاية منين؟"
        bins: ["Curiosity", "Needs", "Profit", "Opportunity"]
        cards:
          - { text: "You notice odd fatigue after HCV treatment and want to know why", bin: 0 }
          - { text: "The health directorate needs anaemia rates in Alexandria schools to plan", bin: 1 }
          - { text: "A drug company wants to show its PPI beats the rival brand", bin: 2 }
          - { text: "Your department just got a FibroScan, so you build a thesis on it", bin: 3 }
        why: "الفضول = سؤال شدّك. الاحتياج = مشكلة لازم تتحل. الربح = حد هيستفيد ماديًا. الفرصة = الإمكانية ظهرت فجأة. ونفس البحث ممكن يكون وراه أكتر من دافع."
      - kind: explain
        page: 9
        quote: "A research question is a clear and concise question which expresses: what the research project aims to address/answer"
        title: "التعريف اللي هيتسأل فيه"
        text: |
          الـ ==research question== هو **a clear and concise question** بيقول البحث عايز يجاوب على إيه بالظبط.

          - هو اللي بيحدد **the area of interest**.
          - ومنه بيطلع الـ **study justification/rationale**، يعني ليه البحث ده يستاهل يتعمل.
      - kind: figure
        page: 3
        quote: "Selection, analysis and statement of the research problem"
        title: "خريطة الـ research proposal"
        alt: "A vertical flowchart of eight proposal steps: research problem, literature review, formulation of research objectives (highlighted), research methodology, work plan, budget, plan for administration and utilisation of results, proposal summary. A bracket marks the first step as the research question."
        caption: "الـ research question في أول الخريطة، والـ objectives والـ hypotheses في الخطوة التالتة (اللي متعلّمة). كل اللي تحتهم مبني عليهم."
        svg: |
          <svg viewBox="0 0 330 470" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03r1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="230" height="40" rx="6" class="fg-acc"/>
            <text x="20" y="27" class="t-sm t-b">1. Selection, analysis and</text>
            <text x="20" y="42" class="t-sm t-b">statement of the research problem</text>
            <path d="M248 10h8v40h-8" class="fg-ink"/>
            <text x="262" y="27" class="t-sm t-acc t-b">Research</text>
            <text x="262" y="42" class="t-sm t-acc t-b">question</text>
            <path d="M125 50v14" class="fg-arrow" marker-end="url(#L03r1)"/>
            <rect x="10" y="68" width="230" height="30" rx="6" class="fg-box"/>
            <text x="20" y="88" class="t-sm">2. Literature review</text>
            <path d="M125 98v14" class="fg-arrow" marker-end="url(#L03r1)"/>
            <rect x="10" y="116" width="230" height="44" rx="6" class="fg-good"/>
            <text x="20" y="134" class="t-sm t-b">3. Formulation of research objectives</text>
            <text x="20" y="151" class="t-sm t-mut">general, specific, hypotheses</text>
            <path d="M125 160v14" class="fg-arrow" marker-end="url(#L03r1)"/>
            <rect x="10" y="178" width="230" height="44" rx="6" class="fg-box"/>
            <text x="20" y="196" class="t-sm">4. Research methodology</text>
            <text x="20" y="213" class="t-sm t-mut">variables, design, sampling, ethics</text>
            <path d="M125 222v14" class="fg-arrow" marker-end="url(#L03r1)"/>
            <rect x="10" y="240" width="230" height="30" rx="6" class="fg-box"/>
            <text x="20" y="260" class="t-sm">5. Work plan</text>
            <path d="M125 270v14" class="fg-arrow" marker-end="url(#L03r1)"/>
            <rect x="10" y="288" width="230" height="30" rx="6" class="fg-box"/>
            <text x="20" y="308" class="t-sm">6. Budget</text>
            <path d="M125 318v14" class="fg-arrow" marker-end="url(#L03r1)"/>
            <rect x="10" y="336" width="230" height="44" rx="6" class="fg-box"/>
            <text x="20" y="354" class="t-sm">7. Plan for administration and</text>
            <text x="20" y="371" class="t-sm">utilisation of results</text>
            <path d="M125 380v14" class="fg-arrow" marker-end="url(#L03r1)"/>
            <rect x="10" y="398" width="230" height="30" rx="6" class="fg-box"/>
            <text x="20" y="418" class="t-sm">8. Proposal summary</text>
            <text x="10" y="455" class="t-sm t-mut">Each step answers one question you must ask.</text>
          </svg>
      - kind: order
        page: 3
        quote: "Selection, analysis and statement of the research problem"
        prompt: "رتّب خطوات الـ research proposal:"
        steps:
          - "Statement of the research problem"
          - "Literature review"
          - "Formulation of research objectives"
          - "Research methodology"
          - "Work plan"
          - "Budget"
        why: "المشكلة الأول، وبعدين تقرا اللي اتعمل قبلك، وبعدين تكتب أهدافك، وبعدها بس تقرر الـ methodology. الـ work plan والـ budget بييجوا لما تعرف هتعمل إيه."
      - kind: explain
        page: 10
        quote: "It focuses the study, determines the methodology and guides all stages of inquiry, data analysis, and reporting."
        title: "السؤال بيعمل إيه للبحث؟"
        text: |
          تلات حاجات، احفظهم بالترتيب:

          - ==Focuses the study==: بيقفل الباب على أي حاجة برّه السؤال.
          - **Determines the methodology**: الـ variables، نوع الدراسة، الـ sampling، الـ data collection.
          - **Guides all stages** of inquiry، data analysis و reporting.
      - kind: aside
        tone: analogy
        page: 10
        quote: "It focuses the study, determines the methodology and guides all stages of inquiry, data analysis, and reporting."
        text: |
          الـ research question زي العنوان اللي بتقوله لسوّاق الأوبر. لو قلتله "ودّيني إسكندرية" هيلف بيك ساعتين. لو قلتله "مستشفى الميري، باب الطوارئ" هيروح على طول.

          السؤال الواضح هو اللي بيحدد الطريق (**methodology**)، والطريق مش بيحدد السؤال.
      - kind: table
        page: 11
        quote: "Prognosis Cohort > Case Control > Case Series/Reports"
        title: "نوع السؤال بيختار الـ design"
        columns: ["Type of question", "Study design (best first)"]
        rows:
          - ["Therapy", "RCT > Cohort > Case control > Case series"]
          - ["Diagnosis", "Prospective, blind comparison to a gold standard, or cross-sectional"]
          - ["Harm/Etiology", "RCT > Cohort > Case control > Case series"]
          - ["Prognosis", "Cohort > Case control > Case series"]
          - ["Prevention", "RCT > Cohort > Case control > Case series"]
          - ["Clinical exam", "Prospective, blind comparison to a gold standard"]
          - ["Cost analysis", "Economic analysis"]
        hide: [[1, 1], [3, 1], [6, 1]]
      - kind: check
        page: 11
        quote: "Prognosis Cohort > Case Control > Case Series/Reports"
        question: "You want to know how many patients with compensated cirrhosis decompensate within 5 years. Which design tops the list?"
        options:
          - "Cohort study"
          - "Randomised controlled trial"
          - "Economic analysis"
          - "Blind comparison to a gold standard"
        answer: 0
        why:
          - "صح: ده سؤال **prognosis**، والـ prognosis بيبدأ بـ Cohort > Case control > Case series."
          - "مفيش RCT في صف الـ prognosis: مش هتعمل randomization لمرض."
          - "دي لأسئلة الـ cost analysis."
          - "دي لأسئلة الـ diagnosis والـ clinical exam."
      - kind: aside
        tone: exam
        page: 11
        quote: "Questions on therapy, etiology and prevention that can best be answered by an RCT, can also be answered by a systematic review or meta-analysis."
        text: |
          نقطتين تحت الجدول بيحبوا يتسألوا:

          - أسئلة **therapy, etiology and prevention** اللي أحسن إجابة ليها RCT، ينفع كمان يجاوب عليها **systematic review or meta-analysis**.
          - أسئلة **harm/etiology** ينفع تتجاوب بـ RCT **if ethical issues allow it**. يعني مش هتدّي ناس سجاير عشوائيًا علشان تشوف هيجيلهم cancer ولا لأ.
      - kind: try
        items: [res.L03.002, res.L03.003, res.L03.005, res.L03.009]
    recap:
      - "أول خطوة في أي بحث: **define the research question** بوضوح."
      - "الـ research question: clear and concise، بيقول البحث عايز يجاوب على إيه، ومنه بييجي الـ justification."
      - "بيعمل 3 حاجات: focuses the study، determines the methodology، guides all stages."
      - "الـ proposal: problem ← literature ← objectives ← methodology ← work plan ← budget ← administration ← summary."
      - "Prognosis = Cohort أولًا. Therapy/Harm/Prevention = RCT أولًا. Diagnosis = blind comparison to a gold standard."
    practice: [res.L03.001, res.L03.002, res.L03.003, res.L03.004, res.L03.005, res.L03.006, res.L03.007, res.L03.008, res.L03.009, res.L03.010, res.L03.011, res.L03.012, res.L03.013]
  # ------------------------------------------------------------------
  - id: res.L03.lesson2
    title: "كام؟ فيه فرق؟ ولا فيه علاقة؟"
    hook: "تلات أنواع أسئلة، وكل نوع بيكشف نفسه من أول كلمتين."
    minutes: 8
    pages: [12, 76]
    topics: [types]
    goals:
      - "تفرّق بين descriptive و comparative و causal من صياغة السؤال"
      - "تعرف إمتى السؤال qualitative وإمتى quantitative"
    status: unverified
    steps:
      - kind: explain
        page: 13
        quote: "Seek to describe a phenomena and often study “how much”, “how often”, or “what is the change/clinical picture/consequences”."
        title: "1. Descriptive: بيوصف"
        text: |
          السؤال الـ ==descriptive== بيوصف ظاهرة: **how much**، **how often**، أو إيه الـ clinical picture والـ consequences.

          أمثلة المحاضرة:
          - What is the prevalence of depression among medical students
          - How often do medical students use computer-assisted learning
          - What is the pattern of disease X in terms of person, place and time

          جماعة واحدة، وبتعدّ أو بتوصف.
      - kind: explain
        page: 14
        quote: "Aim to examine the difference between two or more groups in relation to one or more variables."
        title: "2. Comparative: بيقارن"
        text: |
          السؤال الـ ==comparative== بيشوف **the difference between two or more groups** في variable أو أكتر، وغالبًا بيبدأ بـ **"What is the difference…"**.

          - What is the difference in growth pattern of breast-fed and bottle-fed infants
          - What is the difference in maternal mortality in an urban compared to a rural community
      - kind: explain
        page: 15
        quote: "Compares two or more phenomena and determines if a relationship exists. Often called relationship research questions."
        title: "3. Causal: بيدوّر على علاقة"
        text: |
          السؤال الـ ==causal== بيقارن ظاهرتين أو أكتر وبيشوف **if a relationship exists**، واسمه التاني **relationship research question**.

          - Does the number of cigarettes smoked per day affect the severity of COPD
          - Does the time of moderate daily exercise affect the improvement in blood pressure

          علامته: **"Does X affect Y"**
      - kind: figure
        page: 12
        quote: "Descriptive Questions 2- Comparative Questions 3- Causal Questions"
        title: "التلاتة في صورة واحدة"
        alt: "Three stacked panels. Descriptive: one group with a single bar labelled how much or how often. Comparative: two groups with two bars and a question about the difference. Causal: X with an arrow to Y labelled does X affect Y."
        caption: "Descriptive = جماعة واحدة وبتعدّ. Comparative = جماعتين وبتقارن. Causal = سهم من X لـ Y."
        svg: |
          <svg viewBox="0 0 330 420" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03t1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <text x="10" y="20" class="t-b">1. Descriptive</text>
            <rect x="10" y="30" width="310" height="100" rx="8" class="fg-box"/>
            <rect x="40" y="70" width="50" height="50" class="fg-acc"/>
            <text x="65" y="62" text-anchor="middle" class="t-sm">One group</text>
            <text x="110" y="85" class="t-sm t-b">How much? How often?</text>
            <text x="110" y="105" class="t-sm t-mut">prevalence, pattern, picture</text>
            <text x="10" y="160" class="t-b">2. Comparative</text>
            <rect x="10" y="170" width="310" height="100" rx="8" class="fg-box"/>
            <rect x="40" y="215" width="40" height="45" class="fg-acc"/>
            <rect x="95" y="195" width="40" height="65" class="fg-good"/>
            <text x="60" y="210" text-anchor="middle" class="t-sm">A</text>
            <text x="115" y="190" text-anchor="middle" class="t-sm">B</text>
            <text x="150" y="225" class="t-sm t-b">What is the difference</text>
            <text x="150" y="243" class="t-sm t-b">between A and B?</text>
            <text x="10" y="300" class="t-b">3. Causal (relationship)</text>
            <rect x="10" y="310" width="310" height="100" rx="8" class="fg-box"/>
            <circle cx="60" cy="355" r="24" class="fg-acc"/>
            <text x="60" y="360" text-anchor="middle" class="t-b">X</text>
            <circle cx="190" cy="355" r="24" class="fg-bad"/>
            <text x="190" y="360" text-anchor="middle" class="t-b">Y</text>
            <path d="M88 355h70" class="fg-arrow-acc" marker-end="url(#L03t1)"/>
            <text x="225" y="350" class="t-sm t-b">Does X</text>
            <text x="225" y="368" class="t-sm t-b">affect Y?</text>
            <text x="20" y="400" class="t-sm t-mut">cigarettes/day → COPD severity</text>
          </svg>
      - kind: aside
        tone: tip
        page: 12
        quote: "Descriptive Questions 2- Comparative Questions 3- Causal Questions"
        text: |
          اسأل نفسك تلات أسئلة مصري:

          - "**كام؟**" ← descriptive
          - "**فيه فرق؟**" ← comparative
          - "**ده بيأثر على ده؟**" ← causal
      - kind: sort
        page: 14
        quote: "What is the difference between prevalence of depression among medical students and tourism students?"
        prompt: "كل سؤال من دول نوعه إيه؟"
        bins: ["Descriptive", "Comparative", "Causal"]
        cards:
          - { text: "How much tobacco smoking is prevalent among different segments of population?", bin: 0 }
          - { text: "What do smokers know about the risks of smoking?", bin: 0 }
          - { text: "What is the difference in depression between medical and tourism students?", bin: 1 }
          - { text: "What is the difference in growth of breast-fed and bottle-fed infants?", bin: 1 }
          - { text: "Does the number of cigarettes per day affect COPD severity?", bin: 2 }
          - { text: "Does daily shisha smoking affect FEV1 in Alexandria café workers?", bin: 2 }
        why: "اللي بيعدّ أو بيوصف جماعة واحدة descriptive. اللي فيه \"What is the difference\" بين جماعتين comparative. اللي فيه \"Does X affect Y\" causal."
      - kind: check
        page: 74
        quote: "What type of research question is the following: How often do college students change majors?"
        question: "(Lecture quiz) What type of research question is: \"How often do college students change majors?\""
        options:
          - "Descriptive"
          - "Causal"
          - "Comparative"
          - "None of these"
        answer: 0
        why:
          - "صح: **how often** = descriptive. ودي إجابة الـ quiz."
          - "مفيش X بيأثر على Y هنا."
          - "مفيش جماعتين بنقارنهم."
          - "هو descriptive صريح."
      - kind: check
        page: 76
        quote: "Causal research questions are used when wanting to compare a variable between two or more groups."
        question: "The quiz says: \"___ research questions are used when wanting to compare a variable between two or more groups.\" Which type fills the blank correctly?"
        options:
          - "Comparative"
          - "Causal"
          - "Descriptive"
        answer: 0
        why:
          - "صح: مقارنة variable بين جماعتين = comparative. الـ quiz كاتبها Causal وإجابتها **False**، وده الفخ."
          - "ده الفخ: الـ causal بيدوّر على علاقة، مش مقارنة جماعات."
          - "الـ descriptive بيوصف جماعة واحدة."
      - kind: explain
        page: 18
        quote: "Qualitative research questions tend to be open and descriptive, unlike Quantitative research questions which should remain fixed."
        title: "Qualitative ولا Quantitative؟"
        text: |
          - **Qualitative** questions بتبقى ==open and descriptive==، وممكن سؤال عام مفتوح يتبعه كذا **sub-question**.
          - **Quantitative** questions لازم ==remain fixed==: بتحددها من الأول وماتغيّرهاش.

          كلمات زي **seek to understand**، **describe**، **explore** بتقولك إن الـ methodology qualitative.

          وليه نحتاج qualitative أصلًا؟ لأنها بتقفل الفجوة بين الاكتشاف والتطبيق، وبتعرّفنا **why research results are often not translated into practice**.
      - kind: figure
        page: 16
        quote: "Knowledge Belief Attitude Value Behavior"
        title: "السلم اللي جنب الـ qualitative"
        alt: "A vertical ladder of five steps from top to bottom: Knowledge, Belief, Attitude, Value, Behavior, with arrows between them, beside a box labelled Qualitative explores why."
        caption: "السلايد بيحط السلم ده جنب الـ qualitative: من المعرفة لحد السلوك. الـ qualitative بيدخل جوه السلم ده ويسأل \"ليه؟\"، والـ quantitative بيعدّ."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03t2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="20" y="10" width="140" height="40" rx="6" class="fg-good"/>
            <text x="90" y="35" text-anchor="middle" class="t-b">Knowledge</text>
            <path d="M90 50v16" class="fg-arrow" marker-end="url(#L03t2)"/>
            <rect x="20" y="70" width="140" height="40" rx="6" class="fg-good"/>
            <text x="90" y="95" text-anchor="middle" class="t-b">Belief</text>
            <path d="M90 110v16" class="fg-arrow" marker-end="url(#L03t2)"/>
            <rect x="20" y="130" width="140" height="40" rx="6" class="fg-good"/>
            <text x="90" y="155" text-anchor="middle" class="t-b">Attitude</text>
            <path d="M90 170v16" class="fg-arrow" marker-end="url(#L03t2)"/>
            <rect x="20" y="190" width="140" height="40" rx="6" class="fg-good"/>
            <text x="90" y="215" text-anchor="middle" class="t-b">Value</text>
            <path d="M90 230v16" class="fg-arrow" marker-end="url(#L03t2)"/>
            <rect x="20" y="250" width="140" height="40" rx="6" class="fg-acc"/>
            <text x="90" y="275" text-anchor="middle" class="t-b">Behavior</text>
            <rect x="180" y="60" width="140" height="80" rx="8" class="fg-box"/>
            <text x="250" y="88" text-anchor="middle" class="t-b">Qualitative</text>
            <text x="250" y="108" text-anchor="middle" class="t-sm">explores why</text>
            <text x="250" y="125" text-anchor="middle" class="t-sm t-mut">open, sub-questions</text>
            <rect x="180" y="170" width="140" height="80" rx="8" class="fg-box"/>
            <text x="250" y="198" text-anchor="middle" class="t-b">Quantitative</text>
            <text x="250" y="218" text-anchor="middle" class="t-sm">counts and measures</text>
            <text x="250" y="235" text-anchor="middle" class="t-sm t-mut">fixed question</text>
            <text x="20" y="318" class="t-sm t-mut">Ql = qualitative, Qt = quantitative</text>
          </svg>
      - kind: reveal
        page: 19
        quote: "job stress and what their consequences are for mental and physical health"
        prompt: "مثال المحاضرة: \"To explore how psychosocial aspects of working with VDUs are related to job stress and their consequences for mental and physical health.\" ليه بعده كذا sub-question؟"
        answer: |
          لأنه سؤال **qualitative** عام ومفتوح (لاحظ كلمة **explore**)، وكل كلمة فيه محتاجة تتعرّف:

          - What are **psychosocial aspects** of work, and how are they detected
          - What is **job stress**, and how is it detected
          - What is meant by **physical and mental health**?

          السؤال العام بيفتح الباب، والـ sub-questions بتقسّم الأوضة.
      - kind: try
        items: [res.L03.014, res.L03.015, res.L03.016, res.L03.025]
    recap:
      - "Descriptive: how much / how often، جماعة واحدة."
      - "Comparative: What is the difference بين جماعتين أو أكتر."
      - "Causal (relationship): Does X affect Y."
      - "فخ الـ quiz: مقارنة variable بين جماعات = comparative مش causal."
      - "Qualitative: open, descriptive، كلمات explore/describe/seek to understand، وفيه sub-questions. Quantitative: fixed."
    practice: [res.L03.014, res.L03.015, res.L03.016, res.L03.017, res.L03.018, res.L03.019, res.L03.020, res.L03.021, res.L03.022, res.L03.023, res.L03.024, res.L03.025, res.L03.026, res.L03.027, res.L03.028]
