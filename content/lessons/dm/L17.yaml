            <text x="205" y="146" text-anchor="middle" class="t-sm t-mut">whole body</text>
            <path d="M255 40 Q285 62 315 40 L315 110 Q285 88 255 110 Z" class="fg-acc"/>
            <text x="285" y="130" text-anchor="middle" class="t-sm t-b t-acc">Codfish</text>
            <text x="285" y="146" text-anchor="middle" class="t-sm t-mut">concave plates</text>
            <rect x="15" y="170" width="300" height="70" rx="8" class="fg-box"/>
            <rect x="40" y="182" width="90" height="46" rx="4" class="fg-ink"/>
            <circle cx="85" cy="194" r="9" class="fg-dot-acc"/>
