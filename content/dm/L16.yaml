  - id: dm.L16.036
    kind: mcq
    topic: hypokalemia
    stem: A 50-year-old in DKA has glucose 520 mg/dL, pH 7.10 and K 2.9 mEq/L. Urine output is adequate. What is the correct order?
    options:
      - Fluids with potassium first; insulin once K is restored
      - Insulin first; potassium later, once the glucose has started to fall
      - Bicarbonate first to correct the pH
      - Insulin and no potassium
      - Wait for K to rise on its own
    answer: 0
    why:
      - Potassium replacement starts with the fluids, and insulin is delayed until K is restored.
      - Insulin would push K lower and risk arrhythmia or paralysis.
      - Bicarbonate also lowers K.
      - Total-body K is depleted; it must be replaced.
      - Treatment lowers K further.
    src: { page: 208, quote: "In such cases, potassium replacement should begin with fluid therapy, & insulin treatment should be delayed until K+ concentration is restored to >3.3 mEq/L." }
    status: unverified
