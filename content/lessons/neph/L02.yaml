        quote: "Hypertension; diabetes; Cardiovascular disease; AKI/hospitalization history; FH kidney disease; obesity; other high-risk comorbidities (e.g., SLE, environmental exposures, nephrotoxic drugs, genetic factors, preeclampsia, low birth weight)."
        title: "مين نعمله screening؟"
        text: |
          الـ screening بيبقى ==cost-effective== في الناس اللي عندهم risk factor بس:

          - **Hypertension**، **diabetes**، **CVD**
          - تاريخ **acute kidney injury (AKI)** أو دخول مستشفى، **family history** لمرض كلى، **obesity**
          - systemic lupus erythematosus (SLE)، nephrotoxic drugs، genetic، **preeclampsia**، **low birth weight**

          اعمل **estimated glomerular filtration rate (eGFR) + ACR**. لو غير طبيعي: استبعد AKI، و**أكّد بعد 3 شهور**، وبعدين stage، cause، risk، treatment.

          التفسير المقبول (مش في الكتاب): الـ screening بيكسب في الناس دول **لأن** نسبة الـ CKD فيهم أعلى، فنفس عدد التحاليل بيلاقي حالات أكتر بدري، قبل ما الكلية تخسر كتير.
      - kind: explain
        page: 26
        quote: "Hypertension; diabetes; Cardiovascular disease; AKI/hospitalization history; FH kidney disease; obesity; other high-risk comorbidities (e.g., SLE, environmental exposures, nephrotoxic drugs, genetic factors, preeclampsia, low birth weight)."
        title: "ليه الناس دول بالذات؟"
        text: |
          الكتاب بيقول الـ screening ==cost-effective== في اللي عندهم risk factor. التفسير المقبول (مش في الكتاب) لكل مجموعة:

          - **Hypertension و diabetes**: أشهر سببين للـ CKD، وكمان بيعملوا hyperfiltration زي ما شفنا.
          - **CVD**: نفس الشرايين اللي اتأذت في القلب موجودة في الكلية.
          - **AKI أو دخول مستشفى**: الكلية ممكن ماترجعش 100% بعد الـ AKI.
          - **Family history** و **genetic factors**: أمراض زي الـ ADPKD بتورث.
          - **Preeclampsia** و **low birth weight**: الطفل اللي اتولد صغير بيبقى عنده nephrons أقل من الأول، فبيبدأ حياته شايل حمل زيادة.
          - **Nephrotoxic drugs** و **environmental exposures** و **SLE**: بيأذوا الكلية مباشرة.

          يعني بندوّر في المكان اللي احتمال نلاقي فيه حاجة عالي، بدل ما نحلل للناس كلها.
      - kind: figure
        page: 26
        quote: "Figure 2: Screening algorithm for diagnosis and staging of chronic kidney disease (CKD)."
        title: "شكل 2 في الكتاب: الـ screening خطوة بخطوة"
        image: { file: neph/L02-screening-algorithm.webp, book: true }
        alt: "Book flowchart: identify adults at risk for CKD; test for GFR and ACR with or without other markers of kidney damage; GFR under 60 or ACR 30 mg/g or more and/or other markers present; test for GFR or ACR if not done and exclude AKI. Three branches: GFR under 60 and/or ACR 30 or more after 3 months or earlier if evidence of chronicity, then measure eGFRcr-cys if not done and available, then stage according to GFR and ACR, establish the cause, estimate risk of progression, initiate treatment; AKI present, follow AKI guidance; GFR 60 or more and ACR under 30, CKD not present, retest based on individual characteristics, with an arrow back to the top (timing of retesting based on individual characteristics)."
        caption: |
          الشجرة بتنزل من فوق:

          1. **Identify adults at risk for CKD** (الناس اللي في الخطوة اللي فاتت).
          2. **Test for GFR and ACR** (albumin-to-creatinine ratio) ± markers تانية.
          3. لو فيه حاجة غلط ← اتأكد واستبعد **AKI** (acute kidney injury).
          4. **3 فروع تحت**:
             - **شمال (أخضر)**: GFR <60 أو ACR ≥30 ==بعد 3 شهور== ← قيس **eGFRcr-cys** لو متاح ← **Stage، دوّر على السبب، قدّر الـ risk، ابدأ علاج**.
             - **النص (بنفسجي)**: **AKI present** ← امشي على الـ AKI guidance.
             - **يمين (برتقاني)**: GFR ≥60 و ACR <30 ← **CKD not present**، والسهم يرجع لفوق: **أعد الفحص** حسب كل مريض.

          الرسمة بتثبت إن التشخيص محتاج ==رقمين (GFR و ACR) ومدة 3 شهور==، وإن الطبيعي النهارده مش نهاية المتابعة.
