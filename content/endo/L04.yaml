  - id: endo.L04.115
    kind: enumerate
    topic: myopathy
    prompt: Musculoskeletal effects of hyperthyroidism.
    points:
      - Proximal muscle weakness and atrophy
      - Respiratory or oesophageal muscles occasionally (dysphagia, dysphonia, aspiration); brisk reflexes
