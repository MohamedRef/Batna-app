      - [Incidence, "New cases", "Population at risk over time", "A rate per unit time (e.g. annual rate)"]
    blanks: [[0, 3], [1, 1], [1, 3]]
    src: { page: 5, quote: "Definitions of terms:\n  OUTCOME: Disease or other health-related event under study\n  EXPOSED: Having, or being exposed to, a potential cause or risk factor for disease or other outcome\n  PREVALENCE: A measure of the burden of disease in a population, calculated as the number of individuals with a disease or outcome divided by the total number of individuals in a defined population at a given time. Prevalence is expressed as a proportion\n  INCIDENCE: A measure of the rate at which new development of a disease in a population, calculated as the number of new cases divided by the population at risk over time. Incidence is expressed as a rate per unit time (for example, annual rate)" }
