  - id: rheum.L06.lesson4
    title: "الـ antibodies والـ helper T cells"
    hook: "خمس antibodies بخمس شخصيات، وأربع أنواع helper كل واحد ليه master switch."
    minutes: 10
    pages: [95, 98]
    topics: [immunoglobulins, t-cells]
    goals:
      - "تحفظ الـ Ig classes بالـ heavy chain والوظيفة، وتعرف ليه كل واحد في مكانه"
