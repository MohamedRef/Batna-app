  # Split from lesson1 on 2026-11-13 (#828): mortality and pathogenesis.
  - id: dm.L07.lesson5
    title: "ليه الـ CAN بيموّت؟ وجه منين؟"
    hook: "خمس أضعاف الـ mortality في خمس سنين. ست أسباب، وأربع فرضيات للي قطع السلك."
    minutes: 7
    pages: [77, 78]
    topics: [risk, pathogenesis]
    goals:
      - "تحفظ أرقام الـ mortality وأسبابها الستة"
      - "تفهم كل سبب بيموّت إزاي"
      - "تعدّ فرضيات الـ pathogenesis الأربعة"
    status: unverified
    steps:
      - kind: explain
        remind: [dm.L07.011]
        page: 77
        title: "ليه خطير؟"
        quote: "The 5-year mortality rate is five times higher"
        text: |
          - الـ ==5-year mortality== **خمس أضعاف**
          - **Mortality 27% في 10 سنين**
          - **asymptomatic ischemia** و myocardial infarction (MI) أكتر، وفرصة النجاة بعد الـ MI أقل

          الأسباب: **silent ischemia**، **arrhythmias**، **sudden cardiac death**، **left ventricle (LV) hypertrophy**، تغيّر في الـ coronary vasomotor dynamics، و **platelet stickiness**.
      - kind: mnemonic
        page: 77
        quote: "e- Causes:\n  a. Silent Cardiac Ischemia\n  b. Arrhythmia's\n  c. Sudden Cardiac Death\n  d. Increased LV Hypertrophy\n  e. Altered Coronary Vasomotor Dynamics"
        word: "SASHAP"
        parts:
          - { key: "S", text: "Silent cardiac ischemia" }
          - { key: "A", text: "Arrhythmias" }
          - { key: "S", text: "Sudden cardiac death" }
          - { key: "H", text: "Hypertrophy of the LV" }
          - { key: "A", text: "Altered coronary vasomotor dynamics" }
          - { key: "P", text: "Platelet stickiness" }
        hook: "**SASHAP** (ساشاب): ست أسباب للـ mortality في الـ CAN."
      - kind: explain
        page: 77
        title: "كل سبب بيموّت إزاي؟"
        quote: "e- Causes:\n  a. Silent Cardiac Ischemia\n  b. Arrhythmia's\n  c. Sudden Cardiac Death\n  d. Increased LV Hypertrophy\n  e. Altered Coronary Vasomotor Dynamics\n  f. Platelet Stickiness"
        text: |
          القايمة من الكتاب، والربط ده التفسير المقبول (مش في الكتاب):

          - **Silent cardiac ischemia**: مفيش وجع يجيبه المستشفى، فالـ MI بيعدّي من غير علاج. عشان كده ==decreased likelihood of survival== بعد الـ MI.
          - **Arrhythmias** و **sudden cardiac death**: الـ vagus كان بيحمي القلب من الكهربا العشوائية؛ لما يقع والـ sympathetic يبقى متلخبط، القلب يبقى أسهل يدخل في arrhythmia قاتلة.
          - **LV hypertrophy**: النبض العالي طول اليوم والضغط اللي مش متظبط بيتعبوا العضلة فتتخن.
          - **Altered coronary vasomotor dynamics**: الشريان التاجي مش بيوسّع وقت المجهود، فالعضلة تجوع بدري.
          - **Platelet stickiness**: صفايح لزجة يعني جلطة أسهل في شريان أصلًا ضيق.
      - kind: check
        page: 77
        quote: "The 5-year mortality rate is five times higher"
        question: "Compared with diabetics without CAN, the 5-year mortality of patients with CAN is:"
        options:
          - "Five times higher"
          - "Twice as high"
          - "Ten times higher"
          - "The same"
        answer: 0
        why:
          - "صح: الكتاب: the 5-year mortality rate is five times higher، و 27% في 10 سنين."
          - "الـ 2–3 أضعاف رقم الـ perioperative morbidity والـ mortality، مش الـ 5 سنين."
          - "مش عشرة؛ الـ 10 في الكتاب هي الـ 10 سنين (27%)."
          - "الـ CAN من أقوى علامات الخطر في السكر."
      - kind: aside
        tone: analogy
        page: 77
        quote: "increased incidence of asymptomatic ischemia, myocardial infarction, and decreased likelihood of survival after myocardial infarction"
        text: "زي عربية لمبة الزيت فيها محروقة: الموتور بيسخن ومفيش حاجة بتنوّر في التابلوه. السواق مش هيقف غير لما العربية تقف لوحدها. الـ **asymptomatic ischemia** هي اللمبة المحروقة."
      - kind: explain
        remind: [dm.L07.012]
        page: 78
        title: "الأعصاب بتموت ليه؟"
        quote: "Hypotheses concerning the multiple etiologies\na. Metabolic insult to nerve fibers,\nb. Neurovascular insufficiency,\nc. Autoimmune damage,\nd. Neurohormonal growth factor deficiency"
        text: |
          الكتاب بيقول **hypotheses** كتير:
          - ==Metabolic insult== للـ nerve fibers
          - **Neurovascular insufficiency** (الأوعية اللي بتغذي العصب)
          - **Autoimmune damage**
          - **Neurohormonal growth factor deficiency**

          والتفسير المقبول (مش في الكتاب) لكل فرضية:
          - **Metabolic**: السكر العالي بيدخل العصب ويتحول لمواد بتأذيه (sorbitol و AGEs).
          - **Neurovascular**: الأوعية الصغيرة اللي بتغذي العصب بتضيق، فالعصب يجوع.
          - **Autoimmune**: أجسام مضادة بتهاجم الـ autonomic ganglia في بعض العيانين.
          - **Growth factor deficiency**: العصب محتاج growth factors عشان يصلّح نفسه، ولما تقل التصليح يقف.
      - kind: figure
        page: 78
        quote: "Hypotheses concerning the multiple etiologies\na. Metabolic insult to nerve fibers,\nb. Neurovascular insufficiency,\nc. Autoimmune damage,\nd. Neurohormonal growth factor deficiency"
        title: "أربع ضربات على نفس العصب"
        alt: "Four boxes, metabolic insult, neurovascular insufficiency, autoimmune damage and growth factor deficiency, each with an arrow to one autonomic nerve fibre in the centre, which leads to CAN."
        caption: "الكتاب بيقول ==hypotheses==: مفيش سبب واحد متأكدين منه، والأربعة ممكن يشتغلوا مع بعض على نفس الـ nerve fiber."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L07h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="fg-head"/></marker></defs>
            <rect x="8" y="10" width="140" height="40" rx="8" class="fg-acc"/>
            <text x="78" y="35" text-anchor="middle" class="t-sm t-b">Metabolic insult</text>
            <rect x="182" y="10" width="140" height="40" rx="8" class="fg-acc"/>
            <text x="252" y="28" text-anchor="middle" class="t-sm t-b">Neurovascular</text>
            <text x="252" y="43" text-anchor="middle" class="t-sm t-b">insufficiency</text>
            <rect x="8" y="190" width="140" height="40" rx="8" class="fg-acc"/>
            <text x="78" y="215" text-anchor="middle" class="t-sm t-b">Autoimmune damage</text>
            <rect x="182" y="190" width="140" height="40" rx="8" class="fg-acc"/>
            <text x="252" y="208" text-anchor="middle" class="t-sm t-b">Growth factor</text>
            <text x="252" y="223" text-anchor="middle" class="t-sm t-b">deficiency</text>
            <rect x="105" y="100" width="120" height="40" rx="20" class="fg-bad"/>
            <text x="165" y="118" text-anchor="middle" class="t-sm t-b">Autonomic</text>
            <text x="165" y="132" text-anchor="middle" class="t-sm t-b">nerve fibre</text>
            <path d="M90 50 L130 98" class="fg-arrow" marker-end="url(#L07h)"/>
            <path d="M240 50 L200 98" class="fg-arrow" marker-end="url(#L07h)"/>
            <path d="M90 190 L130 142" class="fg-arrow" marker-end="url(#L07h)"/>
            <path d="M240 190 L200 142" class="fg-arrow" marker-end="url(#L07h)"/>
          </svg>
      - kind: reveal
        page: 78
        quote: "Hypotheses concerning the multiple etiologies"
        prompt: "لو السبب مش واحد، ده بيأثر على العلاج إزاي؟"
        answer: |
          الكتاب بيقول **multiple etiologies**، يعني مفيش دوا واحد يقفل الحنفية.

          عشان كده هتلاقي في آخر المحاضرة محاولات الـ **reversal** بتضرب من كذا ناحية: ظبط السكر والـ **lifestyle** ونزول الوزن للـ metabolic، و **aldose reductase inhibitor** (التفسير المقبول، مش في الكتاب: ده بيقفل الطريق اللي بيحوّل الـ glucose لـ sorbitol جوه العصب).
      - kind: try
        items: [dm.L07.009, dm.L07.010, dm.L07.011, dm.L07.012]
    recap:
      - "5-year mortality ×5، و27% في 10 سنين؛ survival بعد الـ MI أقل."
      - "SASHAP: silent ischemia، arrhythmias، sudden death، LV hypertrophy، altered vasomotor، platelet stickiness."
      - "الـ silent ischemia بتموّت عشان مفيش وجع يجيب العيان بدري."
      - "Pathogenesis = hypotheses: metabolic، neurovascular، autoimmune، growth factor deficiency."
    practice: [dm.L07.009, dm.L07.010, dm.L07.011, dm.L07.012]
  # ------------------------------------------------------------------
  - id: dm.L07.lesson2
    title: "وشوش الـ CAN: النبض والضغط والمجهود"
    hook: "نبض ثابت، ضغط بيقع، تخدير بيقلب، ودوخة من غير ما الضغط يقع: كله نفس المرض."
    minutes: 10
    pages: [78, 80]
    topics: [clinical]
    goals:
      - "تحفظ الـ clinical manifestations"
      - "تعرف أرقام الـ resting tachycardia والـ orthostatic hypotension وليه بتحصل"
      - "تفرّق الـ orthostatic hypotension عن الـ orthostatic tachycardia"
    status: unverified
    steps:
      - kind: explain
        page: 78
        title: "بيظهر إزاي؟"
        quote: "Rare and relatively late in the course of the diabetes."
        text: |
          الأعراض الصريحة (**tachycardia**، **postural hypotension**، **low cardiac output**) ==rare and late==. علشان كده الـ standard diagnosis هو الـ **noninvasive cardiovascular reflex tests**، مش الأعراض.

          ليه متأخرة؟ لأن الجسم عنده احتياطي: طول ما فيه ألياف كفاية شغالة، العيان مش هيحس. الـ reflex tests بتقيس الاحتياطي ده نفسه، فبتكشف المرض **قبل** ما الأعراض تبان.
      - kind: explain
        remind: [dm.L07.016, dm.L07.013]
        page: 78
        title: "القائمة"
        quote: "Intra and postoperative CV instability"
        text: |
          1. **Resting tachycardia**
          2. **Orthostatic hypotension**
          3. **Exercise intolerance** (low cardiac output)
          4. **Intra- and postoperative cardiovascular (CV) instability**
          5. **Orthostatic tachycardia / bradycardia**
          6. ==Silent myocardial ischemia== / infarction
          7. **Sudden death**
          8. **Autonomic cardiopathy**

          الـ 8 مش حفظ عشوائي: كل واحدة **وظيفة autonomic** وقعت. الفرامل وقعت ← نبض عالي ثابت. البنزين للأوعية وقع ← الضغط يقع وهو واقف. الاتنين مش بيستجيبوا ← المجهود والتخدير. السلك الحسي وقع ← MI ساكت.
      - kind: explain
        page: 79
        title: "1. النبض الثابت"
        quote: "A heart rate of 90-100 bpm unresponsive to variation in breathing, posture, or mild exercise is the characteristic finding in diabetic CAN."
        text: |
          الـ characteristic finding: ==Heart rate (HR) 90–100 bpm== مش بيتغير مع **breathing** ولا **posture** ولا **mild exercise**.

          - **Complete denervation** ← **fixed heart rate**
          - الـ **heart rate variability** هي ==earliest indicator== وأكتر finding.
      - kind: reveal
        page: 79
        quote: "A heart rate of 90-100 bpm unresponsive to variation in breathing, posture, or mild exercise is the characteristic finding in diabetic CAN."
        prompt: "ليه النبض بيعلى (90–100) بدل ما يفضل 70؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ **vagus** (parasympathetic) هو اللي بيهدّي القلب طول الوقت، وأليافه طويلة فبتتأثر **الأول**. لما يقع، القلب يرجع لسرعته الذاتية من الـ SA node (حوالي 90–100).

          ولما الـ sympathetic كمان يقع، القلب يبقى زي **transplanted heart**: ==fixed heart rate==.
      - kind: explain
        page: 79
        title: "2. الضغط بيقع"
        quote: "A fall in systolic blood pressure of greater than 30 mm Hg upon standing."
        text: |
          ==Orthostatic hypotension== في الكتاب: **Systolic blood pressure (SBP) بينزل أكتر من 30 mmHg** لما يقف.

          - الأعراض: **lightheadedness**، presyncope، dizziness، weakness، fatigue، visual blurring، و **neck pain** (coat-hanger pain)
          - بس **كتير asymptomatic** رغم نزول كبير

          ليه بيقع؟ التفسير المقبول (مش في الكتاب): لما تقف، نص لتر دم تقريبًا بينزل في الرجلين والبطن. الطبيعي إن الـ baroreceptors تحس وتبعت **sympathetic** يضيّق الأوعية في ثواني. في الـ CAN السلك ده مقطوع، فالدم يفضل تحت والمخ يجوع: ده الـ lightheadedness. والـ **neck pain** عضلات الرقبة والكتف هي كمان مش واصلها دم كفاية.
