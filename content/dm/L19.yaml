  # ---------- p250: atherosclerosis ----------
  - id: dm.L19.044
    kind: card
    topic: athero
    front: What is the key initiating event in atherogenesis?
    back: Retention of LDL-C and other cholesterol-rich ApoB-containing lipoproteins within the arterial wall.
    src: { page: 250, quote: "The key initiating event in atherogenesis is the retention of LDL-C and other cholesterol-rich Apo B-containing lipoproteins within the arterial wall" }
    status: unverified
    tags: [high-yield]
  - id: dm.L19.045
    kind: order
    topic: athero
    prompt: Order the steps of atherogenesis in the book's figure.
    steps:
      - ApoB lipoprotein is retained on subendothelial proteoglycans
      - It is modified and aggregates
      - Monocyte differentiates into a macrophage, which takes it up
      - Cholesteryl ester accumulates and a foam cell forms
      - The foam cell undergoes apoptosis
    src: { page: 250, quote: "retention of LDL-C and other cholesterol-rich Apo B-containing lipoproteins within the arterial wall" }
    status: unverified
  - id: dm.L19.046
    kind: mcq
    topic: athero
    stem: "In the subendothelium, a macrophage fills with cholesteryl ester from modified ApoB lipoproteins. What does it become?"
    options: [A foam cell, A smooth muscle cell, An endothelial cell, A platelet aggregate]
    answer: 0
    why:
      - "Correct: CE accumulation turns the macrophage into a foam cell, which may then undergo apoptosis."
      - "The book's figure shows no transformation into smooth muscle."
      - "Endothelial cells line the lumen; macrophages do not become them."
      - "Platelets are not part of this step of the figure."
    src: { page: 250, quote: "retention of LDL-C and other cholesterol-rich Apo B-containing lipoproteins within the arterial wall" }
    status: unverified
