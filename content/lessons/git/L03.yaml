        why: "الكتاب بيعدّ الأدوات دي للوصول للـ functional dysphagia. التفسير المقبول (مش في الكتاب): المنظار والـ barium بيشوفوا **الشكل** (stricture، ring، cancer)، الـ manometry والـ video swallow بيشوفوا **الحركة** (المريء والبلعوم)، والـ PPI trial بيختبر **الحمض**. لما الكل يطلع سليم، يبقى functional."
      - kind: try
        items: [git.L03.071, git.L03.091, git.L03.096, git.L03.098, git.L03.101]
    recap:
      - "Functional chest pain: CBT، hypnotherapy، Johrei؛ TCAs (imipramine، trazodone)، SSRIs (citalopram، sertraline)، AZD1386، theophylline، venlafaxine."
      - "Globus: lump في الزور من غير بلع، وبيتحسن مع البلع؛ استبعد dysphagia و head and neck و GERD."
      - "Dysphagia مع reflux = alarm ← endoscopy. Functional dysphagia بالاستبعاد: EGD، barium، PPI، manometry، video swallow."
