  - id: neph.L07.104
    kind: case
    topic: adpkd-renal
    stem: A 28-year-old man has loin pain and BP 158/98. His father started dialysis at 50. Dipstick shows blood; creatinine is normal.
    steps:
      - reveal: Ultrasound shows 4 cysts in the right kidney and 2 in the left.
        question: Does this meet the ultrasound criteria for ADPKD?
        options: ["Yes: ≥3 cysts at age 15–39", "No: he needs 2 in each kidney", "No: he needs 4 in each kidney", "Only genetic testing can tell"]
        answer: 0
        why: "Ages 15–39 need ≥3 cysts, unilateral or bilateral (p154)."
      - question: First-line antihypertensive?
        options: [ACE inhibitor or ARB, Thiazide, Beta-blocker, Calcium channel blocker]
        answer: 0
        why: "HALT PKD supports ACEI or ARB as the antihypertensive of choice (p159)."
      - question: BP target for this young man with normal renal function?
        options: [95–110/60–75 mm Hg, Below 140/90, Below 130/80, Below 150/90]
        answer: 0
        why: "HALT PKD rigorous target for young patients with normal function (p159)."
      - question: Which drink advice fits the book?
        options: [About 3 L of water a day to keep urine osm below 250, Restrict fluids to about 1 L a day to slow cyst growth, Drink plenty of coffee a day to keep urine output high, No set volume; drink only to thirst as any adult would]
        answer: 0
        why: "Water to keep urine osmolality below 250 mOsm/kg if eGFR above 30 (p160); caffeine is a cAMP agonist."
    src: { page: 159, quote: "Control of hypertension is essential because uncontrolled hypertension accelerates the decline in renal function and aggravates extra renal com- plications. Antihypertensive agents of choice and optimal BP targets in ADPKD have not been established. Angiotensin-converting enzyme (ACE) inhibitors or angiotensin receptor blockers (ARBs) increase renal blood flow in ADPKD, have a favorable side effect profile, and may have renoprotective properties that go beyond BP control. The HALT PKD study, a recent double-blind, placebo- controlled randomized clini-cal trial (RCT), examined the role of RAS blockade in both early and advanced ADPKD.31,32 Monotherapy with ACE inhibitors gave good BP min/1.73 m²). The HALT PKD study therefore supports the use of an ACE inhibitor or ARB as the antihypertensive medication of choice in most patients with ADPKD and a rigorous BP target (95 to 110/60 to 75 mm Hg) in young patients with ADPKD with normal renal function and without other significant comorbidities." }
    status: unverified
  - id: neph.L07.105
    kind: case
    topic: adpkd-tx
    stem: A 45-year-old woman with ADPKD has had fever 39 °C and right loin pain for 3 days. Urine shows pyuria; blood cultures grow E. coli.
    steps:
      - question: Best antibiotic choice?
        options: [A fluoroquinolone or TMP-SMX, Gentamicin alone for 2 weeks, Oral amoxicillin for 2 weeks, Nitrofurantoin for 2 weeks]
        answer: 0
        why: "Lipophilic agents reach cyst fluid; TMP-SMX and fluoroquinolones are the agents of choice (p158)."
      - reveal: After 2 weeks of the right antibiotic she is still febrile.
        question: Next step?
        options: [Drain the infected cyst, Switch to oral amoxicillin, Stop antibiotics and observe, Add high-dose steroids]
        answer: 0
        why: "Persistent fever after 1–2 weeks: drain the infected cyst (p158)."
      - reveal: The fever later returns after stopping antibiotics.
        question: What do you look for?
        options: ["Obstruction, perinephric abscess or stone", "Drug fever from the antibiotic only", "A new lupus nephritis flare", "A leaking intracranial aneurysm"]
        answer: 0
        why: "Recurrence after stopping: exclude obstruction, perinephric abscess and stone (p158)."
    src: { page: 158, quote: "Therapeutic agents of choice include trimethoprim-sulfamethoxazole and fluoroquinolones, both of which have favorable intra cystic thera-peutic concentration gradients at physiologic pH in gradient and non-gradient cysts. If fever persists after 1 to 2 weeks of appropriate antimicrobial therapy, infected cysts should be drained percutaneously or surgically. In the case of end- stage polycystic kidneys, nephrectomy should be considered. If fever recurs after stopping antibiotics, complicating features such as obstruction, perinephric abscess, and stone should be excluded." }
    status: unverified
