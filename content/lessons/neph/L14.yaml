          يعني القرار مش على الـ biopsy لوحدها؛ على **الـ trend والمضاعفات**. ولو هتدي steroid، الـ figure بتقول moderate أو reduced dose **preferred**.
      - kind: explain
        page: 463
        title: "Figure 9: كل maintenance وسببه"
        quote: "Figure 9: Maintenance immunosuppressive regimens in patients with lupus nephritis.\n| Maintenance immunosuppressive regimens (Low-dose glucocorticoids AND) | Comments |\n| Mycophenolic acid analogs | Preferred treatment based on high-certainty evidence; lower flare rate than azathioprine maintenance |\n| Azathioprine | Low medication cost; safe in pregnancy |\n| Belimumab and mycophenolic acid analogs or azathioprine | Efficacy and safety of belimumab demonstrated in BLISS-LN (104-wk) and open-label extension trials (28-wk) [Practice Point 10.2.3.2.5] |\n| CNI and mycophenolic acid analogs | Efficacy and safety of voclosporin demonstrated in AURORA 1 (52-wk) and AURORA 2 continuation trials (2-yr); efficacy and safety of tacrolimus demonstrated in 'Multitarget Therapy' trial in Chinese patients in which tacrolimus and reduced-dose MPAA were given for 24 months [Practice Point 10.2.3.2.5] |\n| CNI (such as voclosporin, tacrolimus or cyclosporine) | Tacrolimus and cyclosporine safe in pregnancy; insufficient pregnancy data on voclosporin |\nAURORA, Aurinia Renal Response in Active Lupus with Voclosporin; BLISS-LN, Efficacy and Safety of Belimumab in Patients with Active Lupus Nephritis; CNI, calcineurin inhibitor; MPAA, mycophenolic acid analogs."
        text: |
          كل اختيار في الجدول ده معاه **low-dose glucocorticoids**، وكل واحد ليه سبب في الكتاب:

          - **MPAA:** ==Preferred== بـ high-certainty evidence و ==lower flare rate than azathioprine==.
          - **Azathioprine:** رخيص و ==safe in pregnancy==.
          - **Belimumab + MPAA أو azathioprine:** اتثبت في **BLISS-LN** (104 أسبوع).
          - **CNI + MPAA:** الـ voclosporin في **AURORA 1** و **AURORA 2**، والـ tacrolimus في الـ "Multitarget Therapy" في الصين.
          - **CNI لوحده:** الـ tacrolimus والـ cyclosporine **safe in pregnancy**، والـ voclosporin **insufficient pregnancy data**.

          وقاعدة مهمة: اللي بدأ بـ **triple** (belimumab أو CNI) **can continue with a triple immunosuppressive regimen as maintenance**. ولو الـ MPAA والـ azathioprine الاتنين مينفعوش: **CNI** أو **mizoribine** أو **leflunomide**.
