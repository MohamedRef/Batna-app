  - id: hem.L07.lesson2
    title: "AML ولا ALL؟ اقرا الخلية"
    hook: "الفرق بين AML وALL بيغيّر العلاج كله، والميكروسكوب والـ CD markers بيقولوهولك."
    minutes: 10
    pages: [106, 109]
    topics: [classification, morphology, markers, cytogenetics]
    goals:
      - "تفرّق AML عن ALL بالشكل والـ markers"
      - "تعرف الـ FAB subtypes وأهم translocations"
    status: unverified
    steps:
      - kind: explain
        page: 106
        title: "أهم سؤال: myeloid ولا lymphoid؟"
        quote: "The most important distinction is between AML and ALL, since these two diseases differ considerably in their clinical behavior, prognosis and response to therapy"
        text: |
          ممكن تصنّف الـ acute leukemia بـ **morphology** و **cytochemistry** و **cell surface markers** و **cytogenetics** و **oncogene expression**.

          بس أهم تفرقة هي ==AML vs ALL==، لأنهم مختلفين في **الـ behavior** و **الـ prognosis** و **الاستجابة للعلاج**.
      - kind: figure
        page: 107
        quote: "Leukemic cells in AML typically are 12 to 20 um in diameter with discrete nuclear chromatin"
        title: "اتنين blasts جنب بعض"
        alt: "Two cells stacked. Top: a large AML blast, 12 to 20 micrometres, with granules in the cytoplasm, a slender red Auer rod and several nucleoli. Bottom: a smaller ALL blast with scanty cytoplasm and no granules."
        caption: "الـ AML أكبر وفيها granules وممكن ==Auer rod==. الـ ALL أصغر ومن غير granules."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="18" text-anchor="middle" class="t-sm t-b">AML blast (12–20 µm)</text>
            <circle cx="120" cy="85" r="60" class="fg-acc"/>
            <circle cx="112" cy="82" r="36" class="fg-ink"/>
            <circle cx="100" cy="72" r="5" class="fg-dot-acc"/>
            <circle cx="122" cy="92" r="5" class="fg-dot-acc"/>
            <circle cx="160" cy="55" r="3" class="fg-dot-bad"/>
            <circle cx="168" cy="100" r="3" class="fg-dot-bad"/>
            <circle cx="150" cy="128" r="3" class="fg-dot-bad"/>
            <circle cx="80" cy="130" r="3" class="fg-dot-bad"/>
            <path d="M150 70 L172 112" class="fg-arrow-bad" stroke-width="4"/>
            <text x="200" y="60" class="t-sm">granules</text>
            <text x="200" y="95" class="t-sm t-bad t-b">Auer rod</text>
            <text x="200" y="112" class="t-sm t-mut">pathognomonic</text>
            <text x="200" y="135" class="t-sm">nucleoli</text>
            <text x="165" y="178" text-anchor="middle" class="t-sm t-b">ALL blast (smaller)</text>
            <circle cx="120" cy="235" r="40" class="fg-box"/>
            <circle cx="120" cy="235" r="33" class="fg-ink"/>
            <text x="200" y="225" class="t-sm">scanty cytoplasm</text>
            <text x="200" y="245" class="t-sm">no granules</text>
            <text x="200" y="265" class="t-sm t-mut">TdT +</text>
          </svg>
      - kind: explain
        page: 107
        title: "L1 وL2 وL3"
        quote: "L3 blasts are quite distinct with prominent nucleoli and deeply basophilic cytoplasm with vacuoles"
        text: |
          الـ **ALL blasts** أصغر من الـ AML ومن غير granules:
          - **L1**: حجمها **uniform** و cytoplasm قليلة.
          - **L2**: أكبر و **variable** وممكن فيها nucleoli.
          - ==L3==: مميزة: **prominent nucleoli** و cytoplasm **deeply basophilic** فيها ==vacuoles== (Burkitt-like).
      - kind: check
        page: 107
        quote: "auer rods which are slender, fusiform cytoplasmic inclusions that stain red with Giemsa stain, are pathognomic of AML."
        question: "Slender red fusiform cytoplasmic inclusions on Giemsa stain are pathognomonic of:"
        options:
          - "AML"
          - "L3 ALL"
          - "CLL"
          - "Leukemoid reaction"
        answer: 0
        why:
          - "صح: الـ Auer rods = AML، pathognomonic."
          - "الـ L3 فيها vacuoles وcytoplasm basophilic، مفيش Auer rods."
          - "الـ CLL خلاياها lymphocytes ناضجة صغيرة."
          - "الـ leukemoid reaction خلايا myeloid بتنضج طبيعي."
      - kind: explain
        page: 108
        title: "الـ markers: الكارنيه بتاع الخلية"
        quote: "AML express CD13, CD14, CD33 and CD34"
        text: |
          الـ **CD antigens** زي كارنيه على سطح الخلية بيتقرا بـ monoclonal antibodies:
          - **AML**: ==CD13، CD14، CD33، CD34==
          - **ALL**: حوالي **60%** عندها **CALLA (CD10)** = early B cell
          - حوالي **20%** من الـ ALL **T-cell**: CD4، CD3، CD2

          ومن جوه الخلية: ==TdT== (nuclear enzyme) في **أكتر من 90%** من الـ ALL lymphoblasts، ومش موجود في الخلايا الناضجة.
      - kind: sort
        page: 108
        quote: "in ALL approximately 60% of case express the common ALL antigen or CALLA (CD10)."
        prompt: "الـ marker ده يشاور على إيه؟"
        bins: ["AML", "ALL"]
        cards:
          - { text: "CD13", bin: 0 }
          - { text: "CD33", bin: 0 }
          - { text: "CD14", bin: 0 }
          - { text: "CD10 (CALLA)", bin: 1 }
          - { text: "TdT", bin: 1 }
          - { text: "CD3, CD2", bin: 1 }
        why: "الـ CD13 وCD14 وCD33 (وCD34) بتاعة AML. الـ CALLA (CD10) والـ TdT والـ T-cell antigens (CD4، CD3، CD2) بتاعة ALL."
      - kind: table
        page: 106
        quote: "M3, Acute promyelocytic leukemia Hypergranular promyelocytes predominate T(15;17)"
        title: "الـ FAB بتاع AML (Table 1)"
        columns: [FAB, "Name: clue"]
        rows:
          - [M0, "Undifferentiated: very undifferentiated blasts"]
          - [M1, "Minimal differentiation: few azurophilic granules"]
          - [M2, "With differentiation: granulated blasts, Auer rods"]
          - [M3, "Promyelocytic: hypergranular promyelocytes, t(15;17)"]
          - [M4, "Myelomonocytic: monoblasts + myeloblasts, inv(16)"]
          - [M5, "Monocytic: monoblasts, NSE +++, t(9;11)"]
          - [M6, "Erythroleukemia: erythroblasts, antiglycophorin"]
          - [M7, "Megakaryocytic: antiplatelet GpIIb/IIIa"]
        hide: [[3, 1], [4, 1], [5, 1], [6, 1], [7, 1]]
      - kind: aside
        tone: analogy
        page: 106
        quote: "M3, Acute promyelocytic leukemia Hypergranular promyelocytes predominate T(15;17)"
        text: "افتكر الترتيب بالـ myeloid tree: **M0–M2** myeloblasts بتنضج شوية شوية، **M3** promyelocyte، **M4** نص myelo ونص mono، **M5** mono خالص، **M6** red cells، **M7** platelets. كأنك ماشي في شارع من أوله لآخره."
      - kind: match
        page: 109
        quote: "t (4;11), an abnormality seen mostly in neonatal ALL, t (8: 14) an abnormality associated with the L3 varient"
        prompt: "وصّل كل translocation بمرضه:"
        pairs:
          - ["t(15;17)", "APL (M3), always"]
          - ["inv(16)", "M4 with abnormal eosinophilia"]
          - ["t(8;21)", "M2, relatively favorable"]
          - ["t(4;11)", "Neonatal ALL"]
          - ["t(8;14)", "L3 ALL"]
        why: "الـ APL دايمًا t(15;17). الـ inv(16) مع M4 والـ eosinophils. الـ t(8;21) في M2 وبتستجيب كويس للـ chemo. الـ t(4;11) في الـ neonates، والـ t(8;14) في الـ L3 (Burkitt)."
      - kind: aside
        tone: joke
        page: 109
        quote: "patients with M2 AML with t (8: 21) express CD56 have a relatively favorable outcome with chemotherapy."
        text: "**8 و21**: زي سن الـ 21 كده، شباب ومتفائل. الـ t(8;21) في M2 بتاخد chemo وتطلع **favorable**."
      - kind: try
        items: [hem.L07.020, hem.L07.027, hem.L07.035, hem.L07.040, hem.L07.036]
    recap:
      - "أهم تفرقة: AML vs ALL (behavior، prognosis، therapy)."
      - "AML: 12–20 µm، granules، **Auer rods pathognomonic**. ALL: أصغر من غير granules؛ L3 فيها vacuoles."
      - "AML: CD13/14/33/34. ALL: CALLA (CD10) 60%، T-cell 20%، TdT >90%."
      - "t(15;17) APL، inv(16) M4Eo، t(8;21) M2 favorable، t(4;11) neonatal ALL، t(8;14) L3."
    practice: [hem.L07.018, hem.L07.019, hem.L07.020, hem.L07.021, hem.L07.022, hem.L07.023, hem.L07.024, hem.L07.025, hem.L07.026, hem.L07.027, hem.L07.028, hem.L07.029, hem.L07.030, hem.L07.031, hem.L07.032, hem.L07.033, hem.L07.034, hem.L07.035, hem.L07.036, hem.L07.037, hem.L07.038, hem.L07.039, hem.L07.040, hem.L07.041, hem.L07.042, hem.L07.093, hem.L07.108]
