  # ---------- p107-108: drugs ----------
  - id: endo.L06.048
    kind: card
    topic: drugs
    front: In which two ways do drugs alter thyroid function?
    back: By modulating the HPT axis itself, or through downstream effects on thyroid hormone transport or metabolism.
    src: { page: 107, quote: "5. Drug therapy: A lot of commonly prescribed drugs may result in altered thyroid function/status, either by – modulating the HPT axis itself, – or through downstream effects on thyroid hormone transport or metabolism." }
    status: unverified
  - id: endo.L06.049
    kind: table
    topic: drugs
    title: Iodide and the thyroid
    columns: [Pattern, Mechanism]
    rows:
      - ["↑TSH, ↓FT4", "Transient disturbance; persistent hypothyroidism if thyroid reserve is low (e.g. chronic autoimmune thyroiditis)"]
      - ["↓TSH, ↑FT4", "Jod-Basedow: overt hyperthyroidism in latent autonomy (e.g. MNG), may last months"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 107, quote: "Examples of drugs directly affecting pituitary TSH or thyroidal T4 & T3 secretion in previously euthyroid subjects.\n| Drugs | Drug | TFT patterns | Comments |\n|---|---|---|---|\n| Drugs affecting thyroid hormone secretion | Iodide | 1. ↑TSH, ↓FT4 | Inorganic iodide (dietary/supplements) as well as iodine containing organic compounds (e.g. radiological contrast agents) can cause a transient disturbance of thyroid function; patients with diminished thyroid reserve (e.g. chronic autoimmune thyroiditis) are at risk of developing persistent hypothyroidism. |\n|  |  | 2. ↓TSH, ↑FT4 | Individuals with latent/low-grade thyroid autonomy (e.g. in a pre-existing MNG) may develop overt hyperthyroidism following exposure to iodine-containing compounds (Jod-Basedow effect), which may persist for months |\n|  | Amiodarone | 1. Transient ↑TSH; ↑FT4, normal FT3 | Short-lived rises in TSH are common during the first few months of treatment with amiodarone; inhibition of type 1 DIO leads to persistent elevation of FT4, but normal FT3 |\n|  |  | 2. ↓TSH, ↑FT4 | Two main types of thyrotoxicosis are recognised: type 1 (large iodine load precipitating latent thyroid autonomy); type 2 (destructive thyroiditis); amiodarone inhibits T4 → T3 conversion such that T4 is typically more markedly elevated than T3 |\n|  |  | 3. ↑TSH, ↓FT4 | Hypothyroidism occurs in up to 15% of patients (particularly women and those with positive antithyroid antibodies); it may reflect failure to escape from the Wolff-Chaikoff effect |\n|  | Lithium | 1. ↑TSH, ↓ or normal FT4 | Overt or subclinical hypothyroidism |\n|  |  | 2. ↓TSH, ↑FT4 | Thyroiditis occurs in a small number of patients and is typically self-limiting |\n|  | TKIs | 1. ↑TSH, ↓FT4 | Primary hypothyroidism (possibly due to a direct toxic effect on the thyroid gland) has been observed with some TKIs, e.g. Sunitinib, Sorafenib |\n|  |  | 2. ↓TSH, ↑FT4 | A prodromal thyrotoxic phase is occasionally seen in patients receiving Sunitinib |\n|  | Immune modulators | 1. ↓TSH, ↑FT4 | Graves' disease has been reported in patients receiving: (i) Alemtuzumab (a humanised monoclonal antibody directed against CD52) for multiple sclerosis; (ii) HAART for HIV infection; (iii) INFα for chronic hepatitis C |\n|  |  | 2. ↑TSH, ↓FT4 | Hashimoto's thyroiditis may complicate INFα therapy (± prodromal thyrotoxic phase) |" }
    status: unverified
