  - id: neph.L11.lesson4
    title: "حمل على الغسيل: الخصوبة ومنع الحمل والأدوية"
    hook: "واحدة على dialysis قالتلك: أنا حامل. إيه اللي يتوقف النهارده، وإيه اللي يبدأ؟"
    minutes: 9
    pages: [364, 374]
    topics: [ckd-fertility, dialysis-outcomes, dialysis-contraception, dialysis-care]
    goals:
      - "تفهم ليه الخصوبة بتقل في الـ CKD وبترجع بعد الزرع"
      - "تعرف نتايج الحمل على الغسيل وتختار وسيلة منع الحمل"
      - "تفرز الأدوية: آمن ولا ممنوع في الحمل على الغسيل"
    status: unverified
    steps:
      - kind: explain
        page: 364
        title: "الهرمونات متلخبطة"
        quote: "have high serum prolactin because of impaired kidney clearance, increased luteinizing hormone and follicular stimulating hormone, and decreased estradiol and progesterone concentration"
        text: |
          الـ CKD بيبوّظ الـ **hypothalamic-gonadal axis**:
          - **Prolactin عالي**: الكلية مش بتنضفه.
          - **LH و FSH عاليين**: مفيش negative feedback.
          - **Estradiol و progesterone واطيين**، و ==مفيش LH surge== = **anovulation**.

          بعد الزرع الهرمونات بترجع، يعني العيب من ==الكلية== مش من الـ axis نفسه.
      - kind: explain
        page: 365
        title: "بالأرقام"
        quote: "Women treated with peritoneal dialysis have a 53% lower likelihood of pregnancy than those treated with hemodialysis."
        text: |
          - Irregular menses **47%**، amenorrhea **41%**.
          - الحمل على الغسيل حوالي **18/1000 person-years**، أعلاه في سن 20-24.
          - الـ **PD أقل 53%** من الـ HD: غالبًا الـ hypertonic dextrose والسوايل في البطن بيعطّلوا رحلة البويضة.
          - السكر كسبب للفشل الكلوي = أقل معدل حمل.
      - kind: explain
        page: 366
        title: "النتيجة صعبة"
        quote: "live births occurred in 27% of pregnancies, whereas 3% of pregnancies resulted in stillbirth, 29% resulted in spontaneous abortion"
        text: |
          - **Preterm**: 88% (Piccoli 2016)، 80% (ANZDATA)، **45%** في registry أمريكي حديث. خد بالك من **سنة الداتا**.
          - **Cesarean >60%**، sepsis 6%، إقامة أطول.
          - USRDS: ==live birth 27%== بس، و spontaneous abortion **29%**.
          - Perinatal death **162/1000** مقابل 9/1000.
      - kind: aside
        tone: tip
        page: 367
        quote: "Kidney transplantation should be encouraged, as reproductive function improves after kidney transplantation"
        text: |
          أحسن نصيحة قبل الحمل لواحدة على الغسيل: ==kidney transplant==. الخصوبة بتتحسن والحمل بعد الزرع مضاعفاته أقل.
      - kind: explain
        page: 369
        title: "منع الحمل: الـ IUD هو الملك"
        quote: "Intrauterine devices remain the preferred method of contraception because of low failure rates"
        text: |
          الـ cycles مش منتظمة، فالـ natural planning مينفعش. والـ contraception على الغسيل **5.3%** بس!
          - ==IUD==: الأفضل (failure أقل من 0.1%، مفيش thrombosis ولا ضغط). بس مش مع **PD** أو urinary malformations أو pyelonephritis.
          - **Combined pills**: بحذر مع ضغط مش متظبط أو lupus مع antiphospholipid. **Drospirenone** ممكن يرفع الـ **K**.
          - **Progestin injection**: thrombosis أعلى (RR 2.67) وبيقلل الـ **bone density**.
          - **Barrier**: failure عالي، أبدًا لوحده.
      - kind: figure
        page: 370
        quote: "Figure 2. Contraception options for women receiving maintenance dialysis."
        title: "Failure rate (%) لكل وسيلة (Fig 2)"
        alt: "Horizontal bars of contraceptive failure rate in percent: intrauterine device under 0.1, sterilization 0.15 to 0.5, progesterone injection 0.2, estrogen-progesterone combination 0.3, progesterone-only pill 0.3, male condom 2, female condom 5."
        caption: "كل ما العمود أقصر كل ما الوسيلة أنجح. الـ ==IUD== الأقصر، والـ condom لوحده الأطول بكتير."
        svg: |
