schema: batna.lesson/v1
lecture: res.L16
lessons:
- id: res.L16.lesson1
  title: 'منحنى الجرس: الـ normal distribution'
  hook: 'قيس طول 1,000 طالب في الكلية: هتلاقي أغلبهم حوالين المتوسط، وقليلين جدًا قصيرين أوي أو طوال أوي. الشكل ده اسمه إيه؟'
  minutes: 9
  pages: [2, 28]
  topics: [normal]
  goals:
  - تعرّف الـ normal distribution وتعرف بيوصف أنهي نوع variables
  - تحفظ صفات المنحنى الـ 3
  - 'تقسّم المساحة تحت المنحنى: 34.1 و13.6 و2.2'
  status: unverified
  steps:
  - kind: explain
    page: 2
    quote: |-
      The Gaussian Distribution (Normal Distribution Curve)
      A variable is said to be normally distributed or to have a normal distribution if its distribution has the shape of a normal curve.
    title: يعني إيه variable «normally distributed»؟
    text: |-
      الـ variable يبقى ==normally distributed== لو التوزيع بتاعه **شكله زي الـ normal curve**: منحنى على شكل **جرس** (bell)، واسمه كمان الـ ==Gaussian distribution==.

      مثال من العيادة: الـ **hemoglobin** في ستات أصحاء. أغلبهم حوالين المتوسط، وكل ما تبعد يمين أو شمال، العدد يقل.
  - kind: explain
    page: 3
    quote: |-
      The Gaussian Distribution (Normal Distribution Curve)
      Normal Distribution is used to describe continuous quantitative variables.
      The normal distribution & normal approximations are the bases of analytic statistical tests.
    title: بيوصف إيه، وليه مهم؟
    text: |-
      - بيوصف الـ ==continuous quantitative variables==: حاجة بتتقاس بأرقام متصلة، زي الوزن والضغط ودرجة الامتحان.
      - الـ **normal distribution** والـ **normal approximations** هما ==أساس الـ analytic statistical tests==. يعني أغلب الـ tests اللي جاية (الـ t-test مثلًا) مبنية عليه.
  - kind: check
    page: 3
    quote: Normal Distribution is used to describe continuous quantitative variables.
    question: Which variable is the normal curve meant to describe?
    options:
    - Systolic blood pressure in mmHg
    - Blood group (A, B, AB, O)
    - Cancer stage (I–IV)
    - Smoker or non-smoker
    answer: 0
    why:
    - 'صح: رقم متصل بيتقاس، يعني continuous quantitative.'
    - 'ده nominal: categories ملهاش ترتيب.'
    - 'ده ordinal: categories مترتبة، مش أرقام متصلة.'
    - ده binary (نعم/لأ)، مش continuous.
  - kind: explain
    page: 5
    quote: |-
      Normal distribution curve
      That is: if you measure something, a variable, in a representative sample of sufficient size, the resulting score will assume a distribution that is similar to the normal curve.
      Most of the scores will fall around the mean and there will be relatively few extreme score.
      2.2% | 13.6% | 34.1% | 34.1% | 13.6% | 2.2%
      X-3SD | X-2SD | X-1SD | mean | X+1SD | X+2SD | X+3SD
      68%
      95%
      99%
    title: العينة الكبيرة بتطلع جرس
    text: |-
      السلايد بيقول: لو قست variable في ==representative sample of sufficient size==، الدرجات هتاخد توزيع شبه الـ normal curve:

      - **أغلب الدرجات** حوالين الـ **mean**.
      - **قليل** من الـ ==extreme scores== على الطرفين.

      وزي ما في السلايد 6: الـ sample الكويسة شكلها نسخة صغيرة من الـ population.

      والسلايد 4 بيدي أمثلة: **intelligence** و**attitudes** و**personality** بيتوزعوا تقريبًا normal في الناس.
  - kind: explain
    page: 6
    quote: |-
      POPULATION
      SAMPLE
    title: العيّنة صورة مصغّرة من الـ population
    text: |
      السلايد بترسم ==population== و==sample== جنب بعض بنفس الشكل.

      العيّنة الممثّلة من population ==normally distributed== بتاخد نفس شكل الجرس، بس أصغر.

      ليه ده مهم؟ لأنه بيسمحلنا نستخدم شكل العيّنة علشان نستنتج حاجات عن الـ population كلها. التفسير المقبول (مش في الكتاب).
  - kind: figure
    page: 4
    quote: |-
      Normal distribution curve
      Many human traits (characteristics) such as intelligence, attitudes, and personality, are distributed among the population in a fairly "Normal" way.
      The base line for the normal curve is measured in standard deviation (SD) units.
      2.2% | 13.6% | 34.1% | 34.1% | 13.6% | 2.2%
      μ - 3σ | μ - 2σ | μ - σ | μ | μ + σ | μ + 2σ | μ + 3σ
      68%
      95%
      99%
    title: المساحات تحت المنحنى
    alt: A bell curve with its base marked in standard deviations from −3 to +3. The two bands next to the mean each hold
      34.1%, the next two 13.6% each, and the tails beyond 2 SD 2.2% each. Brackets below show 68% within ±1 SD, 95% within
      ±2 SD and 99.7% within ±3 SD. The peak is labelled mean = median = mode.
    caption: الـ **base line** بيتقاس بـ ==SD units==. من الـ mean لـ 1 SD = **34.1%** في كل ناحية، ومن 1 لـ 2 SD = **13.6%**،
      وبعد 2 SD = **2.2%** بس.
