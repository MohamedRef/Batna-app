  - id: res.L04.055
    kind: mcq
    topic: cross-sectional
    stem: Why is it difficult to derive a causal relationship from a cross-sectional study?
    options:
      - It always uses group-level data
      - Exposure and outcome are measured once, at the same time
      - It needs a very small sample
      - It measures incidence, not prevalence
    answer: 1
    why:
      - That is the ecological study; cross-sectional data are on individuals.
      - With one simultaneous measurement we can't tell which came first, exposure or disease.
      - Cross-sectional surveys are usually large-scale.
      - It is the reverse; cross-sectional studies measure prevalence.
    src: { page: 49, quote: "Advantages and disadvantages of cross-sectional studies\n| Advantages | Disadvantages |\n|---|---|\n| Often use routinely collected readily available data | Usually cannot test the epidemiologic hypotheses |\n| Less expensive and time consuming as compared to analytic studies | Lacks external comparison group |\n| Assess prevalence of outcomes or exposures and pattern of disease occurrence | Since this is a one time measurement of exposure and outcome, it is difficult to derive causal relationships from cross-sectional analysis. |\n| Useful in the formulation of research hypotheses suggestive of risk factors | Not useful for rare events |\n| | May be subjected to selection bias due to refusal, death (survival bias) |" }
