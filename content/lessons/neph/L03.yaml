        text: |
          الكتاب (Table 5) بيعدّ مضاعفات الـ extracorporeal UF. التفسير المقبول (مش في الكتاب):

          - **Hemorrhage:** الدم بيلف برّه الجسم في أنابيب، **فـ** لازم **anticoagulation** علشان ميتجلطش، وده نفسه بيزوّد النزيف. وأي فك في الوصلة = نزيف سريع **لأن** المضخة شغالة.
          - **Hemolysis and hyperkalemia:** المضخة والـ fiber بيكسّروا كرات حمرا، والـ K اللي جوه الخلية بيطلع في الدم.
          - **Air embolus:** أي هوا يدخل الدايرة بيترجع للوريد مباشرة.
          - **Excess UF:** لو شلت أسرع من الـ refill، الـ volume اللي جوه الأوعية يقل **فـ** hypotension و prerenal azotemia.
      - kind: figure
        page: 74
        quote: "Table 5: Potential Complications of Extracorporeal Pumped Ultrafiltration Machines\nAir embolus\nHemorrhage from venous return disconnection\nHemorrhage from hollow fiber blood leak\nHemorrhage complicating systemic anticoagulation\nMembrane bio incompatibility\nHemolysis and hyperkalemia\nCatheter-related complications (ie, infections, stenoses, thromboses)\nExcess ultrafiltration resulting in hypotension, prerenal azotemia, or acute renal failure\nAllergic reactions to the extracorporeal circuit"
        title: "الـ UF أسرع من الـ refill = الضغط يقع"
        alt: "Three boxes left to right: tissues holding the extra fluid, blood vessels, and the machine. An arrow labelled refill runs from the tissues into the vessels, and an arrow labelled UF from the vessels to the machine. Below, a green box: UF rate at or below the refill rate, the volume in the vessels holds and blood pressure stays stable. A red box: UF rate above the refill rate, the vessels empty, giving hypotension, prerenal azotemia and acute renal failure. A note: longer or more frequent sessions remove the same litres at a lower rate per hour."
