        page: 75
        title: "الـ GDMT: الخمسة اللي بيطوّلوا العمر"
        quote: "However, patients with HF and ESKD have been excluded from landmark trials of all these therapies."
        text: |
          في الـ **heart failure with reduced ejection fraction (HFrEF)** الخمسة دول بيقللوا الـ mortality: **beta-blockers**، **angiotensin receptor–neprilysin inhibitors (ARNIs)**، **renin–angiotensin–aldosterone system (RAAS) inhibitors**، **mineralocorticoid receptor antagonists (MRAs)**، **sodium–glucose cotransporter 2 (SGLT2) inhibitors**.

          المشكلة: عيانين الـ ==heart failure (HF) and end-stage kidney disease (ESKD)== **اتشالوا من الـ landmark trials** كلها. علشان كده الـ guideline-directed medical therapy (GDMT) على الـ dialysis غالبًا **بيتساب أو ما بيتعليش** للـ target dose، بسبب safety و tolerability وقلة الـ data.
      - kind: explain
        page: 75
        quote: "However, patients with HF and ESKD have been excluded from landmark"
        title: "ليه الـ GDMT بيتساب على الغسيل؟"
        text: |
          الكتاب: الـ GDMT في الـ HFrEF على الـ dialysis **بيتساب أو مش بيتعلّى** بسبب **safety و tolerability** و**قلة الـ data**، **لأن** عيانين الـ HF و الـ ESKD اتشالوا من الـ landmark trials.

          التفسير المقبول (مش في الكتاب) للـ safety:

          - الـ **ACEI/ARB/ARNI** والـ **MRA** بيعلّوا الـ K، والكلية الواقفة مش بتطلّعه، **فـ** الـ hyperkalemia أخطر.
          - الـ **beta-blockers** والـ ARNI بيوطّوا الضغط، والجلسة نفسها بتوطّيه، **يعني** الضربتين في نفس الوقت.
          - الـ **SGLT2i** بيشتغل على الـ glucose والصوديوم في البول، ولو مفيش بول تقريبًا، تأثيره الكلوي بيقل.
