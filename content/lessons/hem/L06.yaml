      - kind: match
        page: 91
        quote: "Indications:\n  Correction of multiple clotting factor deficiencies in bleeding patients or prior to invasive procedures.\n  DIC, liver disease, massive transfusions.\n  Plasma exchange (as in TTP).\n  Rapid removal of warfarin effect.\n  Congenital factor deficiencies (concentrated or recombinant factor preparations are preferable to decrease viral transmission).\n  Should not be used for volume expansion or protein replacement in nutritional deficiencies"
        prompt: "وصّل كل عيان بالـ component بتاعه:"
        pairs:
          - ["Acute hypovolemia from trauma", "Whole blood"]
          - ["Symptomatic anemia", "Packed RBCs"]
          - ["Fibrinogen 0.8 g/L in DIC", "Cryoprecipitate"]
          - ["TTP needing plasma exchange", "Fresh frozen plasma"]
          - ["ANC 0.2 with Pseudomonas sepsis", "Granulocytes"]
        why: "الـ whole blood للنزيف الحاد، الـ packed red blood cells (PRBCs) للأنيميا، الـ cryo للـ fibrinogen، الـ FFP للـ plasma exchange، والـ granulocytes للـ neutropenia مع infection مثبتة."
      - kind: explain
        page: 92
        title: "Derivatives"
        quote: "Blood products produced commercially by fractionation of plasma and include colloids such as albumin, immune globulins, coagulation factor concentrates."
        text: |
          ==Derivatives== بتتعمل في مصانع من **fractionation of plasma**، ومعالجة بالحرارة أو كيميائيًا ضد الفيروسات.
          - **Rh immune globulin**: للأم **Rh-negative** اللي جنينها **Rh-positive**، علشان ما تعملش **anti-D** و **haemolytic disease of the newborn (HDN)**.
          - **Albumin**: hypovolemia، acute liver failure، cardiopulmonary bypass، burns، وقبل exchange transfusion في HDN (بيمسك الـ bilirubin ويقلّل الـ kernicterus).
          - **Intravenous immunoglobulin (IVIG)**: passive immunity، primary immunodeficiency، **refractory immune thrombocytopenia (ITP)**، Human immunodeficiency virus (HIV) thrombocytopenia، cytomegalovirus (CMV) pneumonitis، Guillain-Barré.

          ليه الـ Rh immune globulin بيمنع الـ anti-D؟ التفسير المقبول (مش في الكتاب): بيمسك كرات الجنين الـ Rh-positive اللي عدّت لدم الأم ويخلّصها **قبل** ما جهاز مناعتها يلحق يتعلّمها ويعمل ==anti-D== بنفسه. والـ albumin في الـ HDN: الكتاب بيقول إنه **بيمسك الـ free bilirubin**، فأقل bilirubin يوصل للمخ (kernicterus).
      - kind: reveal
        page: 92
        quote: "Ther are heat-or chemically treated to kill or inactivate viruses (DD. Components)"
        prompt: "ليه الـ derivatives بتتعالج بالحرارة أو كيميائيًا ضد الفيروسات، والـ components (زي الـ PRBCs) لأ؟"
        answer: |
          الكتاب بيقول إن الـ derivatives ==heat- or chemically treated== وده الفرق بينها وبين الـ components.

          التفسير المقبول (مش في الكتاب): الـ derivative **بروتين** (albumin، immunoglobulin، factor)، يستحمل المعالجة دي. أما الـ component فيه **خلايا عايشة** (كرات، platelets) لو سخّنتها هتموت. وكمان الـ derivative معمول من plasma **آلاف المتبرعين** متجمعة، فلو فيه فيروس هيوصل لناس كتير، فلازم يتعالج.
