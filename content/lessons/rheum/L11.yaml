      - kind: explain
        page: 187
        title: "شكله في العيادة"
        quote: "Since the infant has passive protection from maternal IgG, infections usually do not become apparent until 5-9 months of age.\nThe most common infections are with Hemophilus influenzae and Streptococcus pneumoniae. Among parasites, several cases have been reported with severe infections with Giardia lamblia.\nSince patients have unimpaired T cell function, they have mostly normal resistance to fungi, parasites, enteric bacilli, and viruses with the specific exception of ECHO viruses"
        text: |
          - الـ infections بتبدأ ==5–9 شهور==، والكتاب بيقول السبب: الطفل محمي بالـ **maternal IgG** لحد ما يخلص
          - أشهر الميكروبات **H. influenzae** و **S. pneumoniae** (ليهم capsule: محتاجين antibody)، ومن الطفيليات ==Giardia lamblia==
          - مقاومة الفطريات والفيروسات طبيعية تقريبًا، والكتاب بيقول السبب: الـ **T cell function** سليمة. **الاستثناء: ECHO viruses**

          ليه Giardia والـ ECHO بالذات؟ التفسير المقبول (مش في الكتاب): الاتنين بيعيشوا في الأمعاء، والـ antibodies (خصوصًا IgA في الـ gut) هي خط الدفاع الأول هناك، فمن غيرها الـ Giardia بتعشش، والـ enterovirus ممكن يوصل للمخ ويعمل meningoencephalitis مزمن.
      - kind: reveal
        page: 187
        quote: "Because the largest collection of B cells in the normal infant is in the tonsils, these children have very tiny tonsils, one of the major clinical features of the disease."
        prompt: "طفل عنده pneumonia متكررة ولما بصيت في زوره ما لقيتش لوز تقريبًا. ليه ده بيشاور على XLA؟"
        answer: |
          الكتاب بيقول السبب: أكبر تجمع للـ ==B cells== في الرضيع الطبيعي هو ==اللوز==. فلو مفيش B cells، اللوز بتبقى **very tiny**، ودي من أهم العلامات الإكلينيكية للمرض.
      - kind: explain
        page: 188
        title: "التشخيص والعلاج"
        quote: "Diagnosis is made when a male infant with low immunoglobulin levels is found not to have circulating B cells by immunophenotyping; molecular confirmation of the diagnosis is possible in specialized laboratories, as is carrier detection.\nTreatment is with monthly intravenous infusions of gammaglobulin (IgG); gene therapy has not been attempted."
        text: |
          - **التشخيص:** ==male infant== بـ immunoglobulins واطية، ومفيش **circulating B cells** بالـ immunophenotyping. والتأكيد الجزيئي وكشف الـ carriers في معامل متخصصة
          - **العلاج:** ==monthly IV gammaglobulin (IgG)==، و gene therapy ما اتجربش

          ليه IgG بس ينفع؟ التفسير المقبول (مش في الكتاب): العيان محتاج الـ antibody الجاهز اللي بيمسك البكتيريا اللي ليها capsule، والـ IgG بيعيش في الدم حوالي 3 أسابيع، علشان كده بيتدّي على فترات. وما بيعالجش الأصل: هو بيعوّض اللي الجسم مش بيعمله.
      - kind: check
        page: 188
        quote: "Diagnosis is made when a male infant with low immunoglobulin levels is found not to have circulating B cells by immunophenotyping; molecular confirmation of the diagnosis is possible in specialized laboratories, as is carrier detection.\nTreatment is with monthly intravenous infusions of gammaglobulin (IgG); gene therapy has not been attempted."
        question: "A 7-month-old boy has recurrent pneumococcal otitis and pneumonia. Tonsils are barely visible. IgA and IgM are undetectable, there are no circulating B cells and T cells are normal. Which is true?"
