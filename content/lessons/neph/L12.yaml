        text: |
          - **normal saline (NS):** **200-300 mL/hr** علشان الـ urine output يبقى **>100 mL/hr**؛ بيرجّع الـ volume ويزوّد إخراج الكالسيوم.
          - **Calcitonin:** **4 international units (IU)/kg** مع الـ NS؛ سريع جدًا بس تأثيره **limited**.
          - ==Zoledronic acid==: المفضّل في السرطان (أقوى وأقصر)، للي كليتهم سليمة. عيوبه: **osteonecrosis of the jaw** و **nephrotoxicity**.
      - kind: reveal
