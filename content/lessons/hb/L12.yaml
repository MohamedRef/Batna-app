          - reveal: "A year later his ferritin is normal."
            question: "What about HCC screening?"
            options:
              - "Continue every 6 months (imaging with or without AFP)"
              - "Stop: iron is depleted"
              - "Once a year is now enough"
            answer: 0
            why: "Cirrhosis + HH → كل 6 شهور regardless of iron depletion."
      - kind: aside
        tone: exam
        page: 199
        text: |
          سؤال المحاضرة: **«What is the primary goal of phlebotomy?»**

          الجواب في سطر: ==iron depletion==.

          - نفضّي مخازن الحديد علشان يبطّل يأذي الكبد والقلب والـ pancreas والـ pituitary.
          - وبعدين maintenance مدى الحياة حسب الـ ferritin.
          - وزوّد إن الـ HCC surveillance مستمرة لو فيه cirrhosis.
