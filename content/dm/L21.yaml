    topic: fchl
    front: How is familial combined hyperlipidemia treated?
    back: TLC diet, tight glucose control in diabetics, and lipid drugs; statins work, but many need a second drug (cholesterol absorption inhibitor, niacin, fibrate or fish oil).
    src: { page: 267, quote: "Statins are effective in this condition, but many patients will require a second drug" }
