        question: "Why is FT4 raised with a normal free triiodothyronine (FT3) early on amiodarone?"
        options: ["It inhibits type 1 deiodinase", "It is a heterophilic antibody", "It raises TBG", "It stimulates the TSH receptor"]
        answer: 0
        why:
