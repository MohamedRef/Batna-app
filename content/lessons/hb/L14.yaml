  - id: hb.L14.lesson5
    title: "حامل ومعاها مرض كبد قديم"
    hook: "cirrhosis، HBV، HCV، AIH، أو transplant: إيه يكمل وإيه يتوقف وإمتى تعمل منظار."
    minutes: 9
    pages: [269, 273]
    topics: [preg-coincident, preg-lt]
    goals:
      - "تعرف تعمل إيه في acute hepatitis و Budd-Chiari أثناء الحمل"
      - "تمشي screening الـ varices للـ cirrhotic اللي عايزة تحمل"
      - "تعرف prevention الـ HBV و HCV vertical transmission"
      - "تعرف القواعد بعد الـ liver transplant"
    status: unverified
    steps:
      - kind: explain
        page: 269
        title: "Coincident: viral و Budd-Chiari"
        text: |
          **Acute viral hepatitis في الحمل**:

          - افحص الأسباب الشائعة: HAV، و HBV، و ==HEV==، و **herpes simplex**.
          - لو شاكك في HSV: ابدأ **acyclovir** على طول.

          ==Budd-Chiari syndrome (BCS)==:

          - التعريف: انسداد في الـ hepatic venous outflow.
          - **Risk factors**: trauma، و hypercoagulable states، و myeloproliferative disorders، و OCPs، و pregnancy. الحمل نفسه hypercoagulable state.
          - الصورة: abdominal pain، و hepatomegaly، و ascites.
          - التشخيص: **Doppler ultrasound** كفاية في أغلب الحالات.
      - kind: explain
        page: 270
        title: "Cirrhosis و portal hypertension"
        text: |
          - الحمل مع الـ cirrhosis قليل، بسبب عوامل metabolic و endocrine.
          - التحديات للأم: decompensation، و **hepatic encephalopathy**، و portal hypertension أوحش.
          - التحديات للجنين: spontaneous abortion، و premature birth، و stillbirth.

          ==Variceal bleeding==:

          - بيحصل في 18–32%.
          - أكتر وقت خطر: الـ second trimester والولادة.
          - بيتعالج زي غير الحامل: ==band ligation==، أو **TIPS** لو لازم.
      - kind: reveal
        page: 270
        prompt: "ليه الخطر الأكبر للنزيف في الـ second trimester والولادة؟"
        answer: |
          الكتاب بيدّي التوقيت بس. السبب الفسيولوجي المعروف: الـ **blood volume** بيزيد أسرع حاجة في التاني (وقمته حوالي 32–34 أسبوع)، والرحم الكبير بيضغط على الـ IVC فيزوّد الـ collateral flow، والـ **straining** في الولادة بيرفع الـ portal pressure فجأة.
      - kind: order
        page: 270
        prompt: "رتّب خطوات واحدة عندها compensated cirrhosis وعايزة تحمل:"
        steps:
          - "Optimize her medically and control portal hypertension before pregnancy"
          - "Screening EGD for oesophageal varices"
          - "No varices: repeat EGD in the second trimester"
        why: "الكتاب: optimize قبل الحمل → EGD screening → لو مفيش varices **كرّر في الـ second trimester**. ولو لقيت medium أو large varices في أي منظار منهم: **band ligation** هو الـ treatment of choice. ولو محتاجة beta blocker: **propranolol** هو المفضّل، والـ prophylactic TIPS مالوش data."
      - kind: figure
