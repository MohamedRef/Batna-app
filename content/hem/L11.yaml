items:
  # ---------- p176: WHO 2022 plasma cell neoplasms, CRAB ----------
  - id: hem.L11.001
    kind: enumerate
    topic: classification
    prompt: List the plasma cell neoplasms in the WHO (2022) classification shown in the lecture.
    points:
      - "IgM MGUS and non-IgM MGUS"
      - "Monoclonal gammopathy of renal significance (MGRS)"
      - "Plasma cell myeloma, with variants: smouldering, non-secretory, plasma cell leukaemia"
      - "Plasmacytoma: solitary plasmacytoma of bone, extraosseous (extramedullary)"
      - "Monoclonal immunoglobulin deposition diseases"
      - "Heavy chain diseases (mu, gamma, alpha)"
    pass: 4
    src: { page: 176, quote: "Monoclonal gammopathy of renal significance (MGRS) Plasma cell myeloma" }
    status: unverified
  - id: hem.L11.002
    kind: card
    topic: classification
    front: Which three variants of plasma cell myeloma does the WHO (2022) table list?
    back: Asymptomatic (smouldering) myeloma, non-secretory myeloma and plasma cell leukaemia.
    src: { page: 176, quote: "Asymptomatic (smouldering) myeloma Non-secretory myeloma Plasma cell leukaemia" }
    status: unverified
  - id: hem.L11.003
    kind: card
    topic: classification
    front: Which heavy-chain diseases are listed among the plasma cell neoplasms?
    back: Mu (μ), gamma (γ) and alpha (α) heavy-chain disease.
    src: { page: 176, quote: "Heavy chain deposition diseases (μ heavy-chain disease, γ heavy-chain disease, α heavy-chain disease)" }
    status: unverified
  - id: hem.L11.004
    kind: table
    topic: diagnosis
    title: CRAB features (updated IMWG criteria)
    columns: [Letter, Feature, Threshold]
    rows:
      - [C, Calcium elevation, "> 11 mg/dL or > 1 mg/dL above ULN"]
      - [R, Renal insufficiency, "CrCl < 40 mL/min or serum creatinine > 2 mg/dL"]
      - [A, Anaemia, "Hb < 10 g/dL or 2 g/dL below normal"]
      - [B, Bone disease, "≥ 1 lytic lesion on skeletal radiography, CT or PET/CT"]
    blanks: [[0, 2], [1, 2], [2, 2], [3, 2]]
    src: { page: 176, quote: "C: Calcium elevation (> 11 mg/dL or > 1 mg/dL higher than ULN)" }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L11.005
    kind: cloze
    topic: diagnosis
    text: "CRAB calcium: serum calcium > {{c1::11}} mg/dL or > {{c2::1}} mg/dL higher than the upper limit of normal."
    src: { page: 176, quote: "C: Calcium elevation (> 11 mg/dL or > 1 mg/dL higher than ULN)" }
    status: unverified
    tags: [numbers]
  - id: hem.L11.006
    kind: cloze
    topic: diagnosis
    text: "CRAB renal: creatinine clearance < {{c1::40 mL/min}} or serum creatinine > {{c2::2 mg/dL}}."
    src: { page: 176, quote: "R: Renal insufficiency (creatinine clearance < 40 mL/min or serum creatinine > 2 mg/dL)" }
    status: unverified
    tags: [numbers]
  - id: hem.L11.007
    kind: cloze
    topic: diagnosis
    text: "CRAB anaemia: Hb < {{c1::10 g/dL}} or {{c2::2 g/dL}} below normal. CRAB bone: {{c3::≥ 1 lytic lesion}} on skeletal radiography, CT or PET/CT."
    src: { page: 176, quote: "A: Anemia (Hb < 10 g/dL or 2 g/dL < normal) B: Bone disease (≥ 1 lytic lesions on skeletal radiography, CT, or PET/CT)" }
    status: unverified
    tags: [numbers]
  # ---------- p177: definition, epidemiology, etiology ----------
  - id: hem.L11.008
    kind: card
    topic: definition
    front: Define multiple myeloma.
    back: A clonal B-cell malignancy of plasma cells that accumulate mainly in the bone marrow and usually secrete a paraprotein.
    src: { page: 177, quote: "Clonal B-cell malignancy characterised by proliferation of plasma cells that accumulate mainly within bone marrow and usually secrete paraprotein" }
    status: unverified
    tags: [high-yield]
  - id: hem.L11.009
    kind: cloze
    topic: definition
    text: "The myeloma paraprotein is mainly {{c1::IgG (55%)}} or {{c2::IgA (20%)}}, and rarely {{c3::IgD}}."
    src: { page: 177, quote: "usually secrete paraprotein mainly IgG (55%) or IgA (20%) and rarely IgD" }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L11.010
    kind: card
    topic: definition
    front: What is Bence Jones protein?
    back: Free light chains (kappa or lambda) excreted in the urine.
    src: { page: 177, quote: "excretion of light chains in the urine (Bence Jones protein), either kappa or lambda" }
    status: unverified
  - id: hem.L11.011
    kind: cloze
    topic: definition
    text: "In about {{c1::20%}} of myeloma there is no serum paraprotein, only {{c2::light chains in the urine}}."
    src: { page: 177, quote: "In approximately 20% there is no paraproteinaemia, only light chains in the urine." }
    status: unverified
    tags: [numbers]
  - id: hem.L11.012
    kind: cloze
    topic: definition
    text: "Myeloma: median age at presentation > {{c1::60}} years, rare under {{c2::40}}; annual incidence {{c3::4/100 000}}."
    src: { page: 177, quote: "Median age at presentation > 60 years. Rare under 40 years of age. Annual incidence is 4/100 000." }
    status: unverified
    tags: [numbers]
  - id: hem.L11.013
    kind: card
    topic: definition
    front: In whom is myeloma commoner and in whom less common?
    back: Commoner in males and in black Africans; less common in Asians.
    src: { page: 177, quote: "Commoner in males and in black africans but less common in asians." }
    status: unverified
  - id: hem.L11.014
    kind: cloze
    topic: definition
    text: "Myeloma is about {{c1::1%}} of all malignant diseases and {{c2::10%}} of haematologic malignancies."
    src: { page: 177, quote: "Approximately 1% of all the malignant diseases and 10% of hematologic malignancies." }
    status: unverified
    tags: [numbers]
  - id: hem.L11.015
    kind: card
    topic: etiology
    front: What is the most convincing risk factor for myeloma?
    back: Exposure to ionizing radiation 10 to 15 years before diagnosis.
    src: { page: 177, quote: "Exposure to ionizing radiation 10 - 15 years prior to diagnosis (the most convincing risk factor)" }
    status: unverified
    tags: [high-yield]
  - id: hem.L11.016
    kind: enumerate
    topic: etiology
    prompt: Exposures linked to myeloma (other than radiation).
    points:
      - "Agriculture: grain dusts, dusty occupations, aflatoxins"
      - "Benzene (possible)"
      - "Medications: phenytoin, phenobarbital, diazepam, propranolol, ibuprofen, diet drugs"
      - "Familial occurrence (established)"
    pass: 3
    src: { page: 177, quote: "Exposures to agriculture (grain dusts, dusty occupations, aflatoxins), Benzene (possible)" }
    status: unverified
  - id: hem.L11.017
    kind: enumerate
    topic: etiology
    prompt: Prior diseases associated with multiple myeloma.
    points:
      - Polymyositis/dermatomyositis
      - Systemic sclerosis
      - Autoimmune haemolytic anaemia
      - Pernicious anaemia
      - Ankylosing spondylitis
    pass: 3
    src: { page: 177, quote: "MM is associated with a prior history of, polymyositis/dermatomyositis, systemic sclerosis, autoimmune hemolytic anaemia, pernicious anaemia, and ankylosing spondylitis" }
    status: unverified
  - id: hem.L11.018
    kind: card
    topic: etiology
    front: Is rheumatoid arthritis a risk factor for myeloma?
    back: Uncertain; some studies found increased risk in RA patients and others did not.
    src: { page: 177, quote: "Some studies have found increased risk of MM in RA patients but others have not." }
    status: unverified
  # ---------- p178: pathogenesis, bone pain, anaemia ----------
  - id: hem.L11.019
    kind: card
    topic: pathogenesis
    front: How do premyeloma cells reach the bone marrow?
    back: They home to the marrow by means of adhesion molecules.
    src: { page: 178, quote: "Premyeloma cells, by means of adhesion molecules, home to the bone marrow" }
    status: unverified
  - id: hem.L11.020
    kind: card
    topic: pathogenesis
    front: Which cytokine is the major mediator of myeloma cell growth, survival and drug resistance, and what triggers it?
    back: IL-6, secreted by bone marrow stromal cells when myeloma cells adhere to them.
    src: { page: 178, quote: "Adhesion of MM cells to BMSCs triggers secretion in BMSCs of IL-6, the major cytokine mediating MM cell growth, survival, and resistance to drug" }
    status: unverified
    tags: [high-yield]
  - id: hem.L11.021
    kind: enumerate
    topic: pathogenesis
    prompt: Proposed osteoclast-activating factors in myeloma.
    points:
      - Lymphotoxin
      - TNF-alpha
      - Hepatocyte growth factor
      - IL-6 and IL-1
      - "Metalloproteinases 1, 2, 9"
      - RANKL
      - IGF binding protein 4
      - Macrophage inflammatory protein-1 alpha
    pass: 5
    src: { page: 178, quote: "Proposed osteoclast-activating factors include lymphotoxin, TNF-α, hepatocyte growth factor, IL-6, IL-1, metalloproteinases 1, 2, 9, RANKL" }
    status: unverified
  - id: hem.L11.022
    kind: cloze
    topic: pathogenesis
    text: "The most common cytogenetic abnormality in myeloma involves chromosome {{c1::14q}}, the site of {{c2::IgH}}; most cases involve {{c3::14q32}}."
    src: { page: 178, quote: "Abnormalities of 14 q (the location of IgH) (most common). Specific chromosome changes involve 14q32 in the majority of cases" }
    status: unverified
  - id: hem.L11.023
    kind: card
    topic: clinical
    front: Which three processes produce the clinical picture of myeloma?
    back: Dysproteinaemia, bone marrow failure and destruction of cortical bone.
    src: { page: 178, quote: "The effects of dysproteinemia, bone marrow failure, and destruction of cortical bone" }
    status: unverified
  - id: hem.L11.024
    kind: card
    topic: clinical
    front: Describe bone pain in myeloma (site, frequency, behaviour).
    back: Back or chest; in more than two thirds of patients; usually worsened by movement.
    src: { page: 178, quote: "In the back or chest In more than two thirds of patients. Usually worsened by movement" }
    status: unverified
    tags: [high-yield]
  - id: hem.L11.025
    kind: card
    topic: clinical
    front: Why may a myeloma patient lose height?
    back: Kyphosis and loss of height from vertebral compression fractures.
    src: { page: 178, quote: "Kyphosis and loss of height may occur from vertebral compression fractures." }
    status: unverified
  - id: hem.L11.026
    kind: card
    topic: clinical
    front: What is the most frequent physical finding in myeloma?
    back: Pallor (anaemia), with weakness and fatigue being common.
    src: { page: 178, quote: "Pallor is the most frequent physical finding." }
    status: unverified
    tags: [high-yield]
  # ---------- p179: infection, kidney, hyperviscosity, neuro ----------
  - id: hem.L11.027
    kind: card
    topic: clinical
    front: Which infections are most common in myeloma, and which organisms predominate?
    back: Upper respiratory tract and sinus infections; encapsulated organisms such as Streptococcus pneumoniae.
    src: { page: 179, quote: "Upper respiratory tract and sinus infections are the most common encapsulated organisms such as Streptococcus pneumoniae predominate" }
    status: unverified
  - id: hem.L11.028
    kind: enumerate
    topic: clinical
    prompt: Causes of infection (fever) in myeloma.
    points:
      - Impaired antibody response
      - Reduced normal immunoglobulins (immune paresis)
      - Neutropenia
      - Glucocorticoid treatment
    pass: 3
    src: { page: 179, quote: "results from impairment of antibody response, reduction of normal immunoglobulins (immune paresis), neutropenia, and treatment with glucocorticoids" }
    status: unverified
  - id: hem.L11.029
    kind: enumerate
    topic: clinical
    prompt: Causes of renal failure in myeloma.
    points:
      - Dehydration
      - Hypercalcaemia
      - "Light chains precipitating in the distal and collecting tubules (myeloma kidney)"
      - Hyperuricaemia
      - "Amyloidosis (nephrotic syndrome, renal insufficiency or both)"
      - "Acquired Fanconi syndrome"
    pass: 4
    src: { page: 179, quote: "The major causes of renal failure are dehydration, and hypercalcemia, precipitated monoclonal light chains in the distal and collecting tubules." }
    status: unverified
    tags: [high-yield]
  - id: hem.L11.030
    kind: cloze
    topic: clinical
    text: "In myeloma kidney (light-chain nephropathy), monoclonal light chains precipitate in the {{c1::distal and collecting tubules}}."
    src: { page: 179, quote: "precipitated monoclonal light chains in the distal and collecting tubules." }
    status: unverified
  - id: hem.L11.031
    kind: card
    topic: clinical
    front: How can amyloidosis affect the kidney in myeloma?
    back: Nephrotic syndrome, renal insufficiency, or both.
    src: { page: 179, quote: "Amyloidosis may cause nephrotic syndrome or renal insufficiency, or both." }
    status: unverified
  - id: hem.L11.032
    kind: card
    topic: clinical
    front: Symptoms of hyperviscosity in myeloma, and with which paraproteins does it occur?
    back: Mental slowing, visual upset, purpura and haemorrhage; very rare, seen with IgA and IgG4 (as the book states).
    src: { page: 179, quote: "Symptomatic hyperviscosity (mental slowing, visual upset, purpura, haemorrhage), in (IgA and IgG4)." }
    status: unverified
    update:
      text: "Most haematology texts name IgG3 (not IgG4) as the IgG subclass that causes hyperviscosity, along with IgA and IgM. The book's answer is IgA and IgG4."
      ref: "Hoffbrand's Essential Haematology, 8th ed. (2019)"
  - id: hem.L11.033
    kind: card
    topic: clinical
    front: What is the most frequent neurologic complication of myeloma, and how does it arise?
    back: Radiculopathy, usually thoracic or lumbosacral, from nerve compression by an expanding vertebral lesion or collapsed bone.
    src: { page: 179, quote: "Radiculopathy (the most frequent neurologic complication). It results from compression of the nerve by the expansion of the vertebral lesion" }
    status: unverified
    tags: [high-yield]
  - id: hem.L11.034
    kind: card
    topic: clinical
    front: What causes peripheral neuropathy in myeloma (per the lecture)?
    back: Amyloidosis.
    src: { page: 179, quote: "Peripheral neuropathy due to amyloidosis." }
    status: unverified
  - id: hem.L11.035
    kind: cloze
    topic: diagnosis
    text: "Myeloma blood count: {{c1::normocytic normochromic}} anaemia in {{c2::70%}}; thrombocytopenia in about {{c3::15%}}."
    src: { page: 179, quote: "A normocytic normochromic anemia in 70% of cases Thrombocytopenia in approximately 15% of patients" }
    status: unverified
    tags: [numbers]
  - id: hem.L11.036
    kind: card
    topic: diagnosis
    front: What does finding plasma cells in the peripheral smear suggest?
    back: Plasma cell leukaemia.
    src: { page: 179, quote: "Plasma cells in the peripheral smear (plasma cell leukemia)" }
    status: unverified
  # ---------- p180: labs, imaging, tumour burden ----------
  - id: hem.L11.037
    kind: card
    topic: diagnosis
    front: What do the blood film and ESR show in myeloma?
    back: Rouleaux formation, and an ESR that is almost always high.
    src: { page: 180, quote: "Rouleaux formation ESR almost always high." }
    status: unverified
  - id: hem.L11.038
    kind: cloze
    topic: diagnosis
    text: "In myeloma, hypercalcaemia occurs in {{c1::30%}}, while serum alkaline phosphatase is usually {{c2::normal}}."
    src: { page: 180, quote: "Hypercalcemia in 30% of cases Serum alkaline phosphatase is usually normal." }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L11.039
    kind: card
    topic: diagnosis
    front: Why is alkaline phosphatase usually normal in myeloma despite extensive bone lesions?
    back: "Myeloma bone disease is purely osteolytic (osteoclast activation) with suppressed osteoblasts, and ALP reflects osteoblast activity. The book states the fact; the reason is accepted physiology."
    src: { page: 180, quote: "Serum alkaline phosphatase is usually normal." }
    status: unverified
  - id: hem.L11.040
    kind: cloze
    topic: diagnosis
    text: "Serum protein electrophoresis shows a peak in {{c1::80%}} of myeloma patients; total protein is {{c2::normal or raised}}."
    src: { page: 180, quote: "Protein electrophoresis shows a peak in 80% of patients." }
    status: unverified
    tags: [numbers]
  - id: hem.L11.041
    kind: card
    topic: diagnosis
    front: Which myeloma types have more renal failure, amyloidosis and light-chain excretion?
    back: Light-chain (Bence Jones) myeloma and IgD myeloma.
    src: { page: 180, quote: "Patients with light-chain (Bence Jones) and IgD myeloma have a higher incidence of renal failure, amyloidosis and greater light-chain protein excretion." }
    status: unverified
  - id: hem.L11.042
    kind: cloze
    topic: diagnosis
    text: "Myeloma marrow: plasma cells more than {{c1::10%}} of all nucleated cells."
    src: { page: 180, quote: "Plasma cells in Bone marrow more than 10% of all nucleated cells." }
    status: unverified
    tags: [numbers]
  - id: hem.L11.043
    kind: card
    topic: diagnosis
    front: What do plain radiographs show in myeloma?
    back: Punched-out lytic lesions, osteoporosis or fractures.
    src: { page: 180, quote: "Conventional radiographs- punched-out lytic lesions, osteoporosis or fractures." }
    status: unverified
    tags: [high-yield]
  - id: hem.L11.044
    kind: enumerate
    topic: diagnosis
    prompt: Bones most frequently involved in myeloma.
    points: [Vertebrae, Skull, Thoracic cage, Pelvis, Proximal humeri, Proximal femora]
    pass: 4
    src: { page: 180, quote: "The vertebrae, skull, thoracic cage, pelvis, proximal humeri and femora are most frequently involved." }
    status: unverified
  - id: hem.L11.045
    kind: card
    topic: diagnosis
    front: When is CT or MRI indicated in suspected myeloma?
    back: When the patient has bone pain but the radiographs are normal.
    src: { page: 180, quote: "CT or MRI in patients who have bone pain but no abnormalities on radiograms." }
    status: unverified
  - id: hem.L11.046
    kind: enumerate
    topic: prognosis
    prompt: Tests that establish tumour burden and prognosis in myeloma.
    points: ["Serum β2-microglobulin", "Serum albumin", "Serum C-reactive protein (surrogate of IL-6)"]
    pass: 3
    src: { page: 180, quote: "Serum β2-microglobulin Serum albumin Serum C-reactive protein Surrogate measure of IL-6" }
    status: unverified
  - id: hem.L11.047
    kind: card
    topic: prognosis
    front: Why is CRP measured in myeloma?
    back: It is a surrogate measure of IL-6, the main myeloma growth cytokine.
    src: { page: 180, quote: "Serum C-reactive protein Surrogate measure of IL-6" }
    status: unverified
  # ---------- p181: IMWG table, differential, MGUS ----------
  - id: hem.L11.048
    kind: table
    topic: diagnosis
    title: Updated IMWG criteria (book slide, p181)
    columns: [Entity, M protein, Clonal BM plasma cells, Myeloma-defining events]
    rows:
      - [MGUS, "< 3 g/dL", "< 10%", None]
      - [Smoldering, "≥ 3 g/dL (serum) or ≥ 500 mg/24 h (urine)", "10% to 60%", None]
      - [Multiple myeloma, "Underlying plasma cell disorder", "> 10%", "≥ 1 (CRAB, > 1 MRI focal lesion, FLC ratio ≥ 100, or BM plasma cells ≥ 60%)"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 3]]
    src: { page: 181, quote: "M protein < 3 g/dL Clonal plasma cells in BM < 10% No myeloma defining events" }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L11.049
    kind: enumerate
    topic: diagnosis
    prompt: Myeloma-defining events in the updated IMWG criteria.
    points:
      - "≥ 1 CRAB feature"
      - "> 1 focal lesion on MRI"
      - "Serum free light chain ratio ≥ 100"
      - "Clonal bone marrow plasma cells ≥ 60%"
    pass: 4
    src: { page: 181, quote: "≥ 1 CRAB feature > 1 MRI focal lesion Serum free light chain ratio ≥ 100 Clonal plasma cells in BM ≥ 60%" }
    status: unverified
    tags: [high-yield]
  - id: hem.L11.050
    kind: cloze
    topic: diagnosis
    text: "Clonal marrow plasma cells ≥ {{c1::60%}} or a serum free light chain ratio ≥ {{c2::100}} define myeloma {{c3::regardless of other features}}."
    src: { page: 181, quote: "Serum free light chain ratio ≥ 100 Clonal plasma cells in BM ≥ 60%" }
    status: unverified
    tags: [numbers]
  - id: hem.L11.051
    kind: enumerate
    topic: differential
    prompt: Differential diagnosis of multiple myeloma.
    points: [MGUS, Smoldering myeloma, Primary amyloidosis, Metastatic carcinoma]
    pass: 4
    src: { page: 181, quote: "MGUS, Smoldering myeloma, Primary amyloidosis Metastatic carcinoma." }
    status: unverified
    tags: [high-yield]
  - id: hem.L11.052
    kind: card
    topic: differential
    front: Define MGUS (benign monoclonal gammopathy).
    back: A stable monoclonal paraprotein in serum (less often urine) with no clinicopathological evidence of myeloma, Waldenström's macroglobulinaemia, amyloidosis or another lymphoproliferative disorder.
    src: { page: 181, quote: "The presence of a stable monoclonal paraprotein in serum or less commonly in urine in the absence of clinicopathological evidence of multiple myeloma" }
    status: unverified
    tags: [high-yield]
  - id: hem.L11.053
    kind: cloze
    topic: differential
    text: "MGUS prevalence: {{c1::1%}} over 50 years, {{c2::3%}} over 70, {{c3::5%}} over 80."
    src: { page: 181, quote: "In 1% population >50 years of age, 3% >70 years ,5% >80 years." }
    status: unverified
    tags: [numbers]
  - id: hem.L11.054
    kind: cloze
    topic: differential
    text: "MGUS progresses to MM, WM, AL amyloidosis or another lymphoproliferative disorder at about {{c1::1% per year}}."
    src: { page: 181, quote: "1% progress to MM, WM, AL or other lymphoproliferative disorder per annum." }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L11.055
    kind: card
    topic: differential
    front: How is MGUS managed?
    back: No treatment; long-term follow-up (it is typically asymptomatic with no end-organ damage).
    src: { page: 181, quote: "Typically asymptomatic No abnormal physical findings (end-organ damage) No treatment; long term follow-up" }
    status: unverified
  # ---------- p182: smoldering, amyloidosis, metastasis ----------
  - id: hem.L11.056
    kind: card
    topic: differential
    front: Smoldering myeloma criteria (as listed on p182).
    back: M-protein > 3 g/dL and > 10% marrow plasma cells, with no myeloma complications.
    src: { page: 182, quote: "M-protein value of > 3 g/dL > 10% bone marrow plasma cells" }
    status: unverified
    tags: [high-yield]
  - id: hem.L11.057
    kind: card
    topic: differential
    front: What is the natural history of smoldering myeloma and when is chemotherapy given?
    back: Like MGUS rather than MM (no progression or complications); chemotherapy only when there is evidence of clinical progression.
    src: { page: 182, quote: "Chemotherapy is not indicated for these patients until there is evidence of clinical progression." }
    status: unverified
  - id: hem.L11.058
    kind: table
    topic: differential
    title: Telling myeloma from its mimics (p182)
    columns: [Condition, Distinguishing features]
    rows:
      - [Primary amyloidosis, "Marrow plasma cells usually < 20%; no osteolytic lesions; modest Bence Jones proteinuria"]
      - ["Metastatic carcinoma (e.g. hypernephroma)", "Lytic lesion but no M component in serum or urine"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 182, quote: "Bone marrow plasma cells is usually less than 20% No osteolytic lesions The amount of Bence Jones proteinuria is modest" }
    status: unverified
  - id: hem.L11.059
    kind: card
    topic: differential
    front: Which metastatic carcinoma does the lecture name as a myeloma mimic, and how is it told apart?
    back: Hypernephroma (renal cell carcinoma); it gives a lytic lesion but no M component in serum or urine.
    src: { page: 182, quote: "Metastatic carcinoma, such as hypernephroma No M component is found in the serum or urine A lytic lesion is identified" }
    status: unverified
  # ---------- p183: ISS, R-ISS ----------
  - id: hem.L11.060
    kind: table
    topic: prognosis
    title: International Staging System (book slide, p183)
    columns: [Stage, Criteria, Median survival]
    rows:
      - ["1", "β2-M < 3.5 mg/L and albumin ≥ 35 g/L", 62 months]
      - ["2", "β2-M < 3.5 mg/L with albumin < 35 g/L, or β2-M 3.5-5.5 mg/L", 41 months]
