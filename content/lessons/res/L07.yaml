        pairs:
          - ["Just give each patient a fair coin toss", "Simple randomization"]
          - ["Keep the two arms equal in size as patients arrive", "Block randomization"]
          - ["Balance age and sex between the arms", "Stratified randomization"]
        why: "**Simple** = قرعة لكل واحد. **Block** = بلوكات متوازنة فالعدد يفضل متساوي. **Stratified** = بلوك لكل combination من الـ covariates، وقرعة جوّاه."
