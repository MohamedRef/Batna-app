  - id: res.L11.lesson5
    title: "الـ sample size محتاج إيه؟"
    hook: "5 أرقام لازم تكون في إيدك قبل ما تفتح أي برنامج. ولو واحد فيهم اتغير، العينة كلها تتغير."
    minutes: 8
    pages: [64, 71]
    topics: [requirements]
    goals:
      - "تعدّ الـ 5 requirements للـ sample size"
      - "تعرف الـ minimum power والـ alpha المقبولين"
      - "تعرف إمتى العينة تكبر"
    status: unverified
    steps:
      - kind: mnemonic
        page: 64
        quote: "The main hypothesis of the study\nThe design of your study\nThe expected effect size\nThe desirable statistical power\nThe acceptable margin of error (alpha-α)"
        word: "HDEPA"
        parts:
          - { key: "H", text: "Hypothesis: الـ main hypothesis، يعني الـ primary endpoint." }
          - { key: "D", text: "Design: نوع الدراسة بيحدد طريقة الحساب." }
          - { key: "E", text: "Effect size: الفرق المتوقع." }
          - { key: "P", text: "Power: 80% على الأقل." }
          - { key: "A", text: "Alpha: الـ margin of error المقبول، 5%." }
        hook: "**H**amada **D**ecided **E**very **P**atient **A**ttends: فرض، تصميم، أثر، قوة، alpha."
      - kind: explain
        page: 65
        quote: "Researchers sometimes plan for primary and secondary objectives and therefore, have primary and secondary endpoints for their studies. Sample size calculation procedure should be based on the primary endpoint (the main objective of the study)."
        title: "1. الـ main hypothesis"
        text: |
          البحث ممكن يكون له **primary** و **secondary** objectives.

          الـ sample size بيتحسب على ==primary endpoint== بس، يعني الـ **main objective** للدراسة.
      - kind: table
        page: 66
        quote: "Understanding the design of your study will help you identify the relevant calculation method and determine the different requirements\n1. Cross sectional study: the main outcome is the prevalence ratio\n2. In case control study we deal with mean difference or difference in proportions of exposure.\n3. In cohort study, we deal with the mean difference or the difference in proportions of the outcome.\n4. In screening and diagnostic studies, data about the prevalence of the disease and suspected sensitivity are required\n5. In clinical trial (Equivalence and non inferiority ) the minimum clinically important difference is needed"
        title: "2. الـ design بيحدد بتقارن إيه"
        columns: ["Design", "You need"]
        rows:
          - ["Cross-sectional", "Prevalence ratio"]
          - ["Case-control", "Difference in exposure (or means)"]
          - ["Cohort", "Difference in outcome (or means)"]
          - ["Screening / diagnostic", "Prevalence + expected sensitivity"]
          - ["Equivalence / non-inferiority trial", "Minimum clinically important difference"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 67
        quote: "1. The expected effect size differs according to the type of outcome measure.\nIn case of continuous measures, the required ES will be the expected mean difference between the two arms and the population standard deviation.\nIn the case of binary outcomes (events as death or remission), the required ES will be the rate of each group.\nThis expected estimate can be obtained from\nprevious literature\npilot study,\nexpert opinion\nthe minimum clinically important difference (MCID)."
        title: "3. الـ effect size: الفرق اللي عايز تشوفه"
        text: |
          ==Effect size== بيختلف حسب نوع الـ outcome:

          - **Continuous** (زي الضغط): الفرق المتوقع بين المتوسطات + الـ **standard deviation**.
          - **Binary** (وفاة، remission): **النسبة** في كل مجموعة.

          تجيبه منين؟ من **previous literature**، أو **pilot study**، أو **expert opinion**، أو الـ **minimum clinically important difference**.
      - kind: explain
        page: 68
        quote: "What is the statistical power:\nIs the ability of the sample to represent the expected effect estimate (e.g, To detect a difference between groups-to estimate a prevalence….)\nThe minimum acceptable statistical power to use is 80%. Therefore, we can calculate the sample size based on a power of 80%, 85%, or 90%.\nFactors affecting the power of the study: The sample size-the sample variability (SD)-"
        title: "4 و 5. الـ power والـ alpha"
        text: |
          ==Statistical power== = قدرة العينة إنها **تكشف** الفرق (أو تقدّر الـ prevalence) لو هو موجود فعلًا.

          - أقل power مقبول **80%**؛ وبنحسب على 80% أو 85% أو 90%.
          - بيتأثر بحجم العينة وبالـ **variability**.

          ==Alpha== = احتمال الصدفة: مفيش فرق حقيقي بس النتيجة طلعت فرق بسبب الـ **sampling error**. المقبول في الأبحاث الإكلينيكية **5%**.

          الدكتورة قالت في الشرح إن **Power = 1 − β** (β = احتمال الـ type II error)؛ فلو β = 20% يبقى الـ power = 80%. وزيادة الـ power مع ثبات الباقي = عينة أكبر.

          وخلّي بالك: الـ **alpha** (type I error في الـ test) حاجة، والـ **margin of error** في الـ prevalence survey (الدقة المطلوبة للـ confidence interval) حاجة تانية، حتى لو الاتنين بييجوا 5% في الأمثلة.
      - kind: check
        page: 69
        quote: "The probability of chance (There is no difference however the results are due to sampling error)\nIn clinical research, the acceptable alpha level in sample size calculation is 5%"
        question: "What are the usual minimum power and acceptable alpha in sample size calculation?"
        options: ["Power 80%, alpha 5%", "Power 95%, alpha 5%", "Power 80%, alpha 20%", "Power 50%, alpha 1%"]
        answer: 0
        why:
          - "صح: power ≥ 80% و alpha 5% (الشرائح 68–69)."
          - "الـ 95% دي الـ confidence level، مش الـ power."
          - "الـ 20% دي الـ beta (1 − power)، مش الـ alpha."
          - "50% power يعني نص الفروق الحقيقية هتضيع."
      - kind: figure
        page: 70
        quote: "A higher power is chosen\nA smaller significance level is chosen (Alpha)\nThe data have a high SD.\nA small effect size is expected (Difference between means or proportions)"
        title: "إمتى العينة تكبر؟"
        alt: "A balance. On the left pan four weights push the sample size up: higher power, smaller alpha, high SD and small effect size. An arrow labelled bigger n points up from the scale."
        caption: "4 حاجات بتكبّر العينة: **power أعلى**، **alpha أصغر**، **SD عالي**، و**effect size صغير**."
        svg: |
          <svg viewBox="0 0 330 190" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L11b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="20" y="20" width="135" height="30" rx="6" class="fg-acc"/>
            <text x="87" y="40" text-anchor="middle" class="t-sm">Higher power</text>
            <rect x="20" y="58" width="135" height="30" rx="6" class="fg-acc"/>
            <text x="87" y="78" text-anchor="middle" class="t-sm">Smaller alpha</text>
            <rect x="20" y="96" width="135" height="30" rx="6" class="fg-acc"/>
            <text x="87" y="116" text-anchor="middle" class="t-sm">High SD</text>
            <rect x="20" y="134" width="135" height="30" rx="6" class="fg-acc"/>
            <text x="87" y="154" text-anchor="middle" class="t-sm">Small effect size</text>
            <path d="M160 35L215 90M160 73L215 92M160 111L215 96M160 149L215 98" class="fg-arrow"/>
            <circle cx="255" cy="95" r="38" class="fg-bad"/>
            <text x="255" y="92" text-anchor="middle" class="t-lg t-b">n</text>
            <text x="255" y="110" text-anchor="middle" class="t-sm">bigger</text>
            <path d="M255 52V20" class="fg-arrow-bad" marker-end="url(#L11b)"/>
          </svg>
      - kind: check
        page: 70
        quote: "A higher power is chosen\nA smaller significance level is chosen (Alpha)\nThe data have a high SD.\nA small effect size is expected (Difference between means or proportions)"
        question: "Which change makes the required sample size smaller?"
        options: ["Expecting a larger effect size", "Raising power to 90%", "Lowering alpha to 1%", "Data with a higher SD"]
        answer: 0
        why:
          - "صح: الفرق الكبير سهل تشوفه بعدد أقل."
          - "power أعلى = عينة أكبر."
          - "alpha أصغر = عينة أكبر."
          - "SD أعلى = عينة أكبر."
      - kind: aside
        tone: tip
        page: 71
        quote: "To estimate the minimum required Examples: sample size You need to Determine 1. EpiInfo7 (@CDC.gov) your hypothesis, determine ur 2. R Software requirements then run the 3. Statsdirect calculations on a software 4. MedCalc 5. GPower"
        text: |
          البرامج بتحسب، بس **انت** اللي بتحدد الـ hypothesis والـ requirements الأول.

          أمثلة الشريحة: **Epi Info 7**، **R**، **StatsDirect**، **MedCalc**، **G*Power**. وفي Batna فيه حاسبتين بنفس معادلات Epi Info: «Sample size: prevalence survey» و «Sample size: case-control or cohort».
      - kind: try
        items: [res.L11.061, res.L11.063, res.L11.066, res.L11.068]
    recap:
      - "الـ requirements: hypothesis (primary endpoint)، design، effect size، power، alpha."
      - "Power ≥ 80% (80، 85، أو 90%)؛ alpha 5%."
      - "العينة تكبر مع: power أعلى، alpha أصغر، SD عالي، effect size صغير."
      - "Effect size من الـ literature أو pilot أو experts أو الـ minimum clinically important difference."
    practice: [res.L11.061, res.L11.062, res.L11.063, res.L11.064, res.L11.065, res.L11.066, res.L11.067, res.L11.068, res.L11.069, res.L11.070, res.L11.084]
