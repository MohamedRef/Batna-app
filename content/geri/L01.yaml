items:
  # ---------- p1-2: age-associated changes ----------
  - id: geri.L01.001
    kind: card
    topic: aging
    front: How does amyloid deposition affect the aging heart?
    back: It may be a frequent cause of cardiac conduction disease, and amyloid heart disease leads to restrictive cardiomyopathy and heart failure in the elderly.
    src: { page: 1, quote: "Amyloid deposition may be a frequent cause of cardiac conduction disease and Amyloid heart disease → Restrictive Cardiomyopathy → heart failure in the elderly." }
    status: unverified
    tags: [high-yield]
  - id: geri.L01.002
    kind: cloze
    topic: aging
    text: "The most common arrhythmia in the elderly is {{c1::atrial fibrillation}}, seen in about {{c2::one-third}} of older individuals and often {{c3::\"lone\"}}."
    src: { page: 1, quote: "Most common arrhythmia seen is atrial fibrillation (⅓ in older individuals) and is often ―lone‖ atrial fibrillation" }
    status: unverified
    tags: [high-yield, numbers]
  - id: geri.L01.003
    kind: cloze
    topic: aging
    text: "Left ventricular {{c1::stiffness}} impairs diastolic filling, which declines {{c2::50%}} between ages 20 and 80, leading to {{c3::diastolic heart failure}}."
    src: { page: 2, quote: "Left ventricular stiffness → impaired diastolic filling which declines 50% between ages 20 and 80 → diastolic heart failure." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L01.004
    kind: card
    topic: aging
    front: Why do about 20% of older people get postural hypotension and syncope?
    back: Sensitivity to filling volumes combined with an impaired heart-rate response to stress.
    src: { page: 2, quote: "The combination of sensitivity to filling volumes and impaired heart rate response to stress may explain the syndrome of postural hypotension in 20%" }
    status: unverified
    tags: [numbers]
  - id: geri.L01.005
    kind: card
    topic: aging
    front: Which heart valves thicken and stiffen with age, and what lesion results?
    back: Mainly the mitral and aortic valves; the result is calcific stenosis.
    src: { page: 2, quote: "Heart valves thicken and stiffen, particularly the Mitral and Aortic ( calcific stenosis)." }
    status: unverified
  - id: geri.L01.006
    kind: cloze
    topic: aging
    text: "The aging aorta dilates and its medial walls calcify; loss of elasticity raises {{c1::systolic}} BP, which rises after age {{c2::30}} until the {{c3::mid-70s}}, then falls through the 80s and 90s."
    src: { page: 2, quote: "increase in systolic blood pressure (systolic BP ↑after age 30 years until the mid-70s, then ↓through the 80s and 90s)." }
    status: unverified
    tags: [numbers]
  - id: geri.L01.007
    kind: card
    topic: aging
    front: What causes sick sinus syndrome and AV block in the aging heart?
    back: Loss of pacemaker cells in the sinus node and of conduction fibers in the bundle branches.
    src: { page: 2, quote: "Loss of pacemaker cells in the sinus node and conduction fibers in the bundle branches in the aging heart" }
    status: unverified
  - id: geri.L01.008
    kind: card
    topic: aging
    front: What is the most important principle in approaching cardiovascular disorders in old age?
    back: Recognize the narrowed homeostatic capacity of the elderly.
    src: { page: 2, quote: "The most important principle in the approach to cardio-vascular disorders with advancing age is to recognize the narrowed homeostatic capacity of the elderly." }
    status: unverified
    tags: [high-yield]
  - id: geri.L01.009
    kind: enumerate
    topic: aging
    prompt: List the age-associated cardiovascular disorders (book question Q1).
    points:
      - Amyloid heart disease (conduction disease, restrictive cardiomyopathy, heart failure)
      - Atrial fibrillation, often lone (one-third)
      - Diastolic heart failure from LV stiffness
      - Postural hypotension and syncope (20%)
      - Coronary atherosclerosis and silent MI
      - Calcific mitral and aortic valve disease
      - Aortic stiffening with systolic hypertension
      - Sick sinus syndrome and AV block
    pass: 6
    src: { page: 2, quote: "Coronary Atherosclerosis is common and Silent MI." }
    status: unverified
    tags: [book-question, high-yield]
  - id: geri.L01.010
    kind: mcq
    topic: aging
    stem: "A 72-year-old smoker with obesity and diabetes has exertional dyspnea, a delayed-peak pulse, an LV heave, an S4 and a grade IV/VI mid-systolic murmur at the base radiating to the carotids. Echo: severe isolated aortic stenosis. What most likely contributed to his valve lesion?"
    options:
      - Diabetes mellitus
      - Congenital bicuspid aortic valve
      - Occult rheumatic heart disease
      - Underlying connective tissue disease
    answer: 0
    why:
      - "Correct: at 72 this is calcific degenerative aortic stenosis (p2, p14), and diabetes, smoking and obesity are atherosclerotic risk factors that drive valve calcification. The book prints no key; this is the standard answer."
      - "A bicuspid valve usually becomes stenotic earlier, in the 50s to 60s."
      - "Rheumatic disease almost always involves the mitral valve too; his is isolated aortic."
      - "Connective tissue disease causes aortic regurgitation from root dilatation, not stenosis."
    src: { page: 2, quote: "Heart valves thicken and stiffen, particularly the Mitral and Aortic ( calcific stenosis)." }
    status: unverified
    tags: [book-question]
  - id: geri.L01.011
    kind: mcq
    topic: aging
    stem: "A 70-year-old woman, breathless for several months, is admitted with chest pain. Her ECG shows an irregularly irregular narrow-complex rhythm with no P waves and no ST elevation. What does it show?"
    options:
      - Atrial fibrillation
      - Myocardial infarction
      - Sinus tachycardia
      - Pericarditis
    answer: 0
    why:
      - "Correct: no P waves and irregular RR intervals are AF, the most common arrhythmia in older people (p1). The book prints no key."
      - "There is no ST elevation or Q wave."
      - "Sinus tachycardia has a P wave before every QRS and a regular rhythm."
      - "Pericarditis gives diffuse saddle ST elevation and PR depression."
    src: { page: 1, quote: "Most common arrhythmia seen is atrial fibrillation (⅓ in older individuals)" }
    status: unverified
    tags: [book-question]
  # ---------- p4-5: hypertension key facts and guidelines ----------
  - id: geri.L01.012
    kind: cloze
    topic: htn
    text: "About {{c1::1.28 billion}} adults aged 30–79 years have hypertension worldwide, {{c2::two-thirds}} of them in low- and middle-income countries."
    src: { page: 4, quote: "An estimated 1.28 billion adults aged 30–79 years worldwide have hypertension, most (two-thirds) living in low- and middle-income countries" }
    status: unverified
    tags: [numbers]
  - id: geri.L01.013
    kind: cloze
    topic: htn
    text: "Of adults with hypertension, {{c1::46%}} are unaware of it, {{c2::42%}} are diagnosed and treated, and only {{c3::21%}} (1 in 5) are controlled."
    src: { page: 4, quote: "Less than half of adults (42%) with hypertension are diagnosed and treated. Approximately 1 in 5 adults (21%) with hypertension have it under control." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L01.014
    kind: card
    topic: htn
    front: What is a major source of blood pressure misclassification?
    back: Errors in BP measurement.
    src: { page: 4, quote: "Errors in BP measurement are a major source of BP misclassification." }
    status: unverified
  - id: geri.L01.015
    kind: card
    topic: htn
    front: "A 63-year-old bus driver has clinic BP 176/108 and LVH on ECG but refuses ambulatory BP monitoring (ABPM). What alternative test confirms hypertension?"
    back: Home blood pressure monitoring (HBPM). The book prints no answer; HBPM is the accepted alternative when ABPM is refused or not tolerated.
    src: { page: 4, quote: "You are unable to confirm the diagnosis of hypertension with ambulatory blood pressure monitoring (ABPM)" }
    status: unverified
    tags: [book-question]
    update:
      text: "NICE confirms hypertension with ABPM, and with home BP monitoring (HBPM) if ABPM is unsuitable or not tolerated."
      ref: "NICE NG136 Hypertension in adults, 2019 (updated 2023)"
  - id: geri.L01.016
    kind: table
    topic: htn
    title: "ACC/AHA 2017 vs ESC/ESH 2018 hypertension guidelines"
    columns: [Parameter, ACC/AHA, ESC/ESH]
    rows:
      - [Definition of hypertension, ">130/80", ">140/90"]
      - [Normal, "<120/80", "120–129/80–84 (optimal <120/80)"]
      - [High normal, "120–129/<80", "130–139/85–89"]
      - [Grade 1, "130–139/80–89", "140–159/90–99"]
      - [Grade 2, "≥140/90", "160–179/100–109"]
      - [Grade 3, "None", "≥180/110"]
      - [Target under 65 y, "<130/80", "<130/80"]
      - [Target 65 y and over, "<130/80", "<140/80"]
    blanks: [[0, 1], [0, 2], [3, 1], [3, 2], [5, 2], [7, 1], [7, 2]]
    src: { page: 5, quote: "Definition of hypertension (mm Hg) >130/80 > 140/90" }
    status: unverified
    tags: [high-yield, numbers]
    update:
      text: "ESC 2024 adds an 'elevated BP' category (office 120–139/70–89) and targets a systolic BP of 120–129 mmHg if tolerated, including most older adults; targets are relaxed in those 85 and over or frail."
      ref: "ESC Guidelines for the management of elevated blood pressure and hypertension, 2024"
  - id: geri.L01.017
    kind: cloze
    topic: htn
    text: "Hypertension is defined as BP above {{c1::130/80}} by ACC/AHA and above {{c2::140/90}} by ESC/ESH."
    src: { page: 5, quote: "Definition of hypertension (mm Hg) >130/80 > 140/90" }
    status: unverified
    tags: [high-yield, numbers]
  - id: geri.L01.018
    kind: mcq
    topic: htn
    stem: "A fit 70-year-old man with hypertension asks for his BP target. According to the ESC/ESH table in the lecture, what is it?"
    options:
      - "<140/80 mmHg"
      - "<130/80 mmHg"
      - "<120/80 mmHg"
      - "<150/90 mmHg"
    answer: 0
    why:
      - "Correct: ESC/ESH targets <140/80 at 65 and over (p5)."
      - "<130/80 is the ESC/ESH target under 65, and the ACC/AHA target at every age."
      - "<120/80 is the definition of optimal BP, not a treatment target."
      - "<150/90 is not a target in either guideline in the table."
    src: { page: 5, quote: "Target blood pressure in various subsets ≤65 y, <130/80 ≥65 y, <130/80 <65 y, <130/80 ≥65 y, <140/80" }
    status: unverified
    tags: [numbers]
  - id: geri.L01.019
    kind: mcq
    topic: htn
    stem: "A 58-year-old has repeated office BP readings around 136/86 mmHg. How is this classified by ACC/AHA and by ESC/ESH?"
    options:
      - "ACC/AHA grade 1 hypertension; ESC/ESH high normal"
      - "Hypertension by both guidelines"
      - "ACC/AHA elevated; ESC/ESH grade 1"
      - "Normal by both guidelines"
    answer: 0
    why:
      - "Correct: ACC/AHA grade 1 is 130–139/80–89; ESC/ESH high normal is 130–139/85–89 (p5)."
      - "ESC/ESH only calls it hypertension above 140/90."
      - "ESC/ESH grade 1 starts at 140/90."
      - "Normal is <120/80 (ACC/AHA) or 120–129/80–84 (ESC/ESH)."
    src: { page: 5, quote: "Grade 1, 130–139/80–89 Grade 2, ≥140/90" }
    status: unverified
    tags: [numbers]
  # ---------- p6-7: treatment ----------
  - id: geri.L01.020
    kind: enumerate
    topic: htn-treatment
    prompt: List the steps of non-pharmacological treatment of hypertension.
    points:
      - Avoid harmful habits (smoking, alcohol)
      - Reduce salt and high-fat diets
      - Lose weight if obese
      - Regular exercise
      - DASH diet
    pass: 4
    src: { page: 6, quote: "Avoid harmful habits ,smoking ,alcohol Reduce salt and high fat diets Loose weight , if obese Regular exercise DASH diet" }
    status: unverified
    tags: [high-yield]
  - id: geri.L01.021
    kind: table
    topic: htn-treatment
    title: "Initial drug choice in hypertension (book figure, p6)"
    columns: [Situation, BP, First drugs]
    rows:
      - [Stage 1, "SBP 140–159 or DBP 90–99", "Thiazide-type diuretic for most; may consider ACEI, ARB, BB, CCB or a combination"]
      - [Stage 2, "SBP ≥160 or DBP ≥100", "2-drug combination for most (usually thiazide-type diuretic + ACEI, ARB, BB or CCB)"]
      - [Compelling indication, "Any", "Drug(s) for the compelling indication, plus other antihypertensives as needed"]
      - [Not at goal, "Above goal", "Optimize doses or add drugs; consider a hypertension specialist"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [3, 2]]
    src: { page: 6, quote: "Stage 1 Hypertension (SBP 140–159 or DBP 90–99 mmHg) Thiazide-type diuretics for most." }
    status: unverified
    tags: [high-yield]
  - id: geri.L01.022
    kind: cloze
    topic: htn-treatment
    text: "In the treatment algorithm, the goal BP is below {{c1::140/90}} mmHg, or below {{c2::130/80}} mmHg in {{c3::diabetes or chronic kidney disease}}."
