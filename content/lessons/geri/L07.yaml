      - kind: explain
        page: 108
        title: "مين محتاج CGA؟"
        quote: "1) Elderly with frailty or one of the frailty syndromes as falls, confusion, reduced mobility and increasing incontinence, even if these appear to be due to a reversible cause (such as a new medication or minor infection)."
        text: |
          1. ==Frailty== أو frailty syndrome: **falls، confusion، reduced mobility، increasing incontinence**، حتى لو السبب باين إنه reversible (دوا جديد أو infection بسيطة).
          2. **At risk of frailty**.
          3. بعد الـ **discharge**، خصوصًا لو دخل بـ frailty syndrome أو قعد كتير لسبب تافه.
          4. كل اللي في **care homes**.
          5. الـ **perioperative period**.
          6. أي حد اتحوّل لـ CGA.
      - kind: check
        page: 108
        quote: "1) Elderly with frailty or one of the frailty syndromes as falls, confusion, reduced mobility and increasing incontinence, even if these appear to be due to a reversible cause (such as a new medication or minor infection)."
        question: "82-year-old started a new sleeping pill and fell twice this month. CGA?"
        options:
          - "Yes: falls are a frailty syndrome even with a reversible cause"
          - "No: stop the pill and the problem is solved"
          - "Only if she is in a care home"
          - "Only if she needs surgery"
        answer: 0
        why:
          - "صح: الكتاب قالها صريحة: «even if these appear to be due to a reversible cause»."
          - "إيقاف الدوا مهم، بس الوقعة نفسها indication للـ CGA."
          - "الـ care home indication لوحدها، مش شرط."
          - "الـ perioperative indication تانية، مش شرط."
      - kind: explain
        page: 109
        title: "بيفرق في إيه؟"
        quote: "Benefits from CGA\n  1) Decreases hospital admission rates.\n  2) Decreases length of hospital stay.\n  3) Decreases hospital related complications.\n  4) Increases rates of discharge to home instead of nursing home.\n  5) Decreases hospital mortality.\n  6) Decreases readmission after discharge.\n  7) Discharge in a better health state.\n  8) Improves diagnostic accuracy.\n  9) Improves quality of life.\n  10) Implementing better plan of management and rehabilitation.\n  11) Help to identify the future treatment goals and support the necessary advance care planning\n  12) Improves health status for elderly patients in the perioperative period, decreases postoperative hospital stay, and decreases postoperative complications.\n  13) Comprehensive assessment and individualized care planning can reverse the progression of frailty."
        text: |
          **أقل:** admissions، length of stay، hospital complications، mortality، readmission.

          **أكتر/أحسن:** discharge للبيت بدل nursing home، discharge بحالة أحسن، diagnostic accuracy، quality of life، خطة management و rehabilitation، advance care planning، ونتايج أحسن حوالين العمليات.

          وأهم واحدة للامتحان: ==can reverse the progression of frailty==.
      - kind: mnemonic
        page: 109
        quote: "The Geriatric MDT\n  Core Members:\n    Geriatrician\n    Nurse\n    Social Worker\n    Occupational Therapist\n    Physiotherapist"
        word: "GNSOP"
        parts:
          - { key: "G", text: "Geriatrician" }
          - { key: "N", text: "Nurse" }
          - { key: "S", text: "Social worker" }
          - { key: "O", text: "Occupational therapist" }
          - { key: "P", text: "Physiotherapist" }
        hook: "**G**ood **N**urses **S**upport **O**ld **P**eople: دول الـ ==core members==. الباقي (podiatrist، speech، dietitian، orthotist، psychogeriatrician، psychologist، volunteer) **supporting**."
      - kind: sort
        page: 110
        quote: "Supporting Members\n  Podiatrist\n  Speech Therapist\n  Dietitian\n  Prosthetic & orthotic specialist\n  Psychogeriatrician\n  Clinical psychologist\n  Volunteer\n  Others"
        prompt: "Core ولا supporting member؟"
        bins: ["Core", "Supporting"]
        cards:
          - { text: "Social worker", bin: 0 }
          - { text: "Occupational therapist", bin: 0 }
          - { text: "Nurse", bin: 0 }
          - { text: "Dietitian", bin: 1 }
          - { text: "Psychogeriatrician", bin: 1 }
          - { text: "Speech therapist", bin: 1 }
          - { text: "Podiatrist", bin: 1 }
        why: "الخمسة core: geriatrician، nurse، social worker، occupational therapy (OT)، physiotherapist. سؤال الكتاب جاب الـ social worker هو الإجابة وسط 4 supporting."
      - kind: explain
        page: 110
        title: "الـ 12 component"
        quote: "Components of CGA\n  1) Ordinary clinical examination\n  2) Functional assessment (ADL, IADL)\n  3) Mobility assessment\n  4) Falls & fracture assessment\n  5) Cognitive functions assessment\n  6) Psychological assessment\n  7) Frailty assessment\n  8) Nutritional assessment\n  9) Socioeconomic & Environmental assessment\n  10) Medications review\n  11) Quality of life assessment\n  12) Goals of care, Advance care preferences & Spirituality"
        text: |
          1. Ordinary clinical examination
          2. ==Functional== (ADL، instrumental activities of daily living (IADL))
          3. Mobility
          4. Falls & fracture
          5. Cognitive
          6. Psychological
          7. Frailty
          8. Nutritional
          9. Socioeconomic & environmental
          10. Medications review
          11. Quality of life
          12. Goals of care، advance care preferences و spirituality

          باقي دروس المحاضرة ماشية على الترتيب ده بالظبط.
      - kind: try
        items: [geri.L07.001, geri.L07.008, geri.L07.011, geri.L07.022, geri.L07.025]
    recap:
      - "60–80 young elderly، 80–100 old elderly، 100–110 centenarians، ≥110 supercentenarians."
      - "المرض في الكبير: atypical، non-specific، multiple pathology، unreported."
      - "CGA = assessment ← problem list ← care plan ← intervention ← regular review."
      - "Indications: frailty syndromes حتى لو reversible، at risk، بعد الـ discharge، care homes، perioperative، referral."
      - "Core MDT: **GNSOP**. والـ CGA ممكن يعكس الـ frailty."
    practice: [geri.L07.001, geri.L07.002, geri.L07.003, geri.L07.004, geri.L07.005, geri.L07.006, geri.L07.007, geri.L07.008, geri.L07.009, geri.L07.010, geri.L07.011, geri.L07.012, geri.L07.013, geri.L07.014, geri.L07.015, geri.L07.016, geri.L07.017, geri.L07.018, geri.L07.019, geri.L07.020, geri.L07.021, geri.L07.022, geri.L07.023, geri.L07.024, geri.L07.025, geri.L07.026, geri.L07.110]
  # ------------------------------------------------------------------
  - id: geri.L07.lesson2
    title: "بيعمل إيه لوحده؟ ADL و IADL والوقعة"
    hook: "سؤال «بتستحمى لوحدك؟» بيقول عن العيان أكتر من نص التحاليل."
    minutes: 10
    pages: [111, 114]
    topics: [function, mobility, falls]
    goals:
      - "تفرّق بين Katz activities of daily living (ADL) و Lawton instrumental activities of daily living (IADL) وتعرف scoring كل واحد"
      - "تعرف مين محتاج multifactorial falls assessment وفيه إيه"
      - "تحسب الـ Falls Risk Assessment Tool (FRAT)"
    status: unverified
    steps:
      - kind: explain
        page: 111
        title: "الـ function: بيعمل إيه فعلًا؟"
        quote: "There are two components of a functional assessment:\n  What can and what does the person actually do?\n  How recently has it changed?"
        text: |
          الـ ==functional assessment== سؤالين:
          1. بيقدر يعمل إيه، وبيعمل إيه **فعلًا**؟
          2. اتغيّر **من امتى**؟

          وخد بالك: اللي نظره أو سمعه ضعيف ممكن يبقى functional زي أي حد، بس بـ coping strategies مختلفة.
      - kind: reveal
        page: 111
        quote: "Ordinary clinical examination\n  Functional assessment (ADL, IADL)\n    Functional assessment can encompass multiple factors like mobility, activities of daily living and the ability to interact with technologies used for telecare. Another factor impacting on function, is sensory loss, as someone with poor vision or hearing can still be as functional as anyone else but with very different coping strategies.\n    Sudden loss in function may indicate acute illness and guide towards active investigation and management; a slow-sustained loss of function may steer the patient to a more supportive care environment."
        prompt: "عيانين فقدوا نفس القدرة: واحد في 3 أيام وواحد على سنة. الفرق في الـ plan؟"
        answer: |
          - **Sudden loss** ← فكّر في ==acute illness==: active investigation و management.
          - **Slow-sustained loss** ← غالبًا هيحتاج **more supportive care environment**.

          وده بالظبط سؤال الكتاب رقم 6.
      - kind: table
        page: 111
        quote: "Katz Index of Independence in Activities of Daily Living\n| Activities (Points 1 or 0) | Independence (1 Point): NO supervision, direction or personal assistance. | Dependence (0 Points): WITH supervision, direction, personal assistance or total care. |\n|---|---|---|\n| BATHING | (1 POINT) Bathes self completely or needs help in bathing only a single part of the body such as the back, genital area or disabled extremity. | (0 POINTS) Need help with bathing more than one part of the body, getting in or out of the tub or shower. Requires total bathing |\n| DRESSING | (1 POINT) Get clothes from closets and drawers and puts on clothes and outer garments complete with fasteners. May have help tying shoes. | (0 POINTS) Needs help with dressing self or needs to be completely dressed. |\n| TOILETING | (1 POINT) Goes to toilet, gets on and off, arranges clothes, cleans genital area without help. | (0 POINTS) Needs help transferring to the toilet, cleaning self or uses bedpan or commode. |\n| TRANSFERRING | (1 POINT) Moves in and out of bed or chair unassisted. Mechanical transfer aids are acceptable | (0 POINTS) Needs help in moving from bed to chair or requires a complete transfer. |\n| CONTINENCE | (1 POINT) Exercises complete self control over urination and defecation. | (0 POINTS) Is partially or totally incontinent of bowel or bladder |\n| FEEDING | (1 POINT) Gets food from plate into mouth without help. Preparation of food may be done by another person. | (0 POINTS) Needs partial or total help with feeding or requires parenteral feeding. |\nTOTAL POINTS. SCORING: 6 = High (patient independent) 0 = Low (patient very dependent)"
        title: "Katz ADL: 6 أنشطة، كل واحد 1 أو 0"
        columns: [Activity, "1 point if"]
        rows:
          - [Bathing, "Alone, or help with one part only"]
          - [Dressing, "Gets and puts on clothes; shoe-tying help OK"]
          - [Toileting, "On/off, clothes, cleans self"]
          - [Transferring, "Bed/chair unassisted; aids OK"]
          - [Continence, "Full control of bladder and bowel"]
          - [Feeding, "Plate to mouth; cooking by others OK"]
        hide: [[0, 0], [2, 0], [3, 0], [4, 0]]
      - kind: aside
        tone: tip
        page: 111
        quote: "Katz Index of Independence in Activities of Daily Living\n| Activities (Points 1 or 0) | Independence (1 Point): NO supervision, direction or personal assistance. | Dependence (0 Points): WITH supervision, direction, personal assistance or total care. |\n|---|---|---|\n| BATHING | (1 POINT) Bathes self completely or needs help in bathing only a single part of the body such as the back, genital area or disabled extremity. | (0 POINTS) Need help with bathing more than one part of the body, getting in or out of the tub or shower. Requires total bathing |\n| DRESSING | (1 POINT) Get clothes from closets and drawers and puts on clothes and outer garments complete with fasteners. May have help tying shoes. | (0 POINTS) Needs help with dressing self or needs to be completely dressed. |\n| TOILETING | (1 POINT) Goes to toilet, gets on and off, arranges clothes, cleans genital area without help. | (0 POINTS) Needs help transferring to the toilet, cleaning self or uses bedpan or commode. |\n| TRANSFERRING | (1 POINT) Moves in and out of bed or chair unassisted. Mechanical transfer aids are acceptable | (0 POINTS) Needs help in moving from bed to chair or requires a complete transfer. |\n| CONTINENCE | (1 POINT) Exercises complete self control over urination and defecation. | (0 POINTS) Is partially or totally incontinent of bowel or bladder |\n| FEEDING | (1 POINT) Gets food from plate into mouth without help. Preparation of food may be done by another person. | (0 POINTS) Needs partial or total help with feeding or requires parenteral feeding. |\nTOTAL POINTS. SCORING: 6 = High (patient independent) 0 = Low (patient very dependent)"
        text: "**Katz** = 6 = independent، 0 = very dependent. الـ ADL هي حاجات الجسم (تستحمى، تلبس، تاكل). الـ **IADL** هي حاجات الحياة المستقلة (فلوس، مواصلات، أدوية)."
      - kind: mnemonic
        page: 112
        quote: "LAWTON - BRODY INSTRUMENTAL ACTIVITIES OF DAILY LIVING SCALE (I.A.D.L.)\nScoring: For each category, circle the item description that most closely resembles the client's highest functional level (either 0 or 1).\n| Category | Item | Score |\n|---|---|---|\n| A. Ability to Use Telephone | 1. Operates telephone on own initiative-looks up and dials numbers, etc. | 1 |\n| | 2. Dials a few well-known numbers | 1 |\n| | 3. Answers telephone but does not dial | 1 |\n| | 4. Does not use telephone at all | 0 |\n| B. Shopping | 1. Takes care of all shopping needs independently | 1 |\n| | 2. Shops independently for small purchases | 0 |\n| | 3. Needs to be accompanied on any shopping trip | 0 |\n| | 4. Completely unable to shop | 0 |\n| C. Food Preparation | 1. Plans, prepares and serves adequate meals independently | 1 |\n| | 2. Prepares adequate meals if supplied with ingredients | 0 |\n| | 3. Heats, serves and prepares meals, or prepares meals, or prepares meals but does not maintain adequate diet | 0 |\n| | 4. Needs to have meals prepared and served | 0 |\n| D. Housekeeping | 1. Maintains house alone or with occasional assistance (e.g. \"heavy work domestic help\") | 1 |\n| | 2. Performs light daily tasks such as dish washing, bed making | 1 |\n| | 3. Performs light daily tasks but cannot maintain acceptable level of cleanliness | 1 |\n| | 4. Needs help with all home maintenance tasks | 1 |\n| | 5. Does not participate in any housekeeping tasks | 0 |\n| E. Laundry | 1. Does personal laundry completely | 1 |\n| | 2. Launders small items-rinses stockings, etc. | 1 |\n| | 3. All laundry must be done by others | 0 |\n| F. Mode of Transportation | 1. Travels independently on public transportation or drives own car | 1 |\n| | 2. Arranges own travel via taxi, but does not otherwise use public transportation | 1 |\n| | 3. Travels on public transportation when accompanied by another | 1 |\n| | 4. Travel limited to taxi or automobile with assistance of another | 0 |\n| | 5. Does not travel at all | 0 |\n| G. Responsibility for Own Medications | 1. Is responsible for taking medication in correct dosages at correct time | 1 |\n| | 2. Takes responsibility if medication is prepared in advance in separate dosage | 0 |\n| | 3. Is not capable of dispensing own medication | 0 |\n| H. Ability to Handle Finances | 1. Manages financial matters independently (budgets, writes checks, pays rent, bills, goes to bank), collects and keeps track of income | 1 |\n| | 2. Manages day-to-day purchases, but needs help with banking, major purchases, etc. | 1 |\n| | 3. Incapable of handling money | 0 |\nA summary score ranges from 0 (low function, dependent) to 8 (high function, independent) for women and 0 through 5 for men to avoid potential gender bias."
        word: "SHAFT LM"
        parts:
          - { key: "S", text: "Shopping" }
          - { key: "H", text: "Housekeeping" }
          - { key: "A", text: "Accounting: ability to handle finances" }
          - { key: "F", text: "Food preparation" }
          - { key: "T", text: "Telephone and Transportation" }
          - { key: "L", text: "Laundry" }
          - { key: "M", text: "Medications: responsibility for own medications" }
        hook: "**SHAFT** + **LM**: الـ 8 domains بتوع ==Lawton IADL==. كل domain يا 0 يا 1."
      - kind: check
        page: 112
        quote: "LAWTON - BRODY INSTRUMENTAL ACTIVITIES OF DAILY LIVING SCALE (I.A.D.L.)\nScoring: For each category, circle the item description that most closely resembles the client's highest functional level (either 0 or 1).\n| Category | Item | Score |\n|---|---|---|\n| A. Ability to Use Telephone | 1. Operates telephone on own initiative-looks up and dials numbers, etc. | 1 |\n| | 2. Dials a few well-known numbers | 1 |\n| | 3. Answers telephone but does not dial | 1 |\n| | 4. Does not use telephone at all | 0 |\n| B. Shopping | 1. Takes care of all shopping needs independently | 1 |\n| | 2. Shops independently for small purchases | 0 |\n| | 3. Needs to be accompanied on any shopping trip | 0 |\n| | 4. Completely unable to shop | 0 |\n| C. Food Preparation | 1. Plans, prepares and serves adequate meals independently | 1 |\n| | 2. Prepares adequate meals if supplied with ingredients | 0 |\n| | 3. Heats, serves and prepares meals, or prepares meals, or prepares meals but does not maintain adequate diet | 0 |\n| | 4. Needs to have meals prepared and served | 0 |\n| D. Housekeeping | 1. Maintains house alone or with occasional assistance (e.g. \"heavy work domestic help\") | 1 |\n| | 2. Performs light daily tasks such as dish washing, bed making | 1 |\n| | 3. Performs light daily tasks but cannot maintain acceptable level of cleanliness | 1 |\n| | 4. Needs help with all home maintenance tasks | 1 |\n| | 5. Does not participate in any housekeeping tasks | 0 |\n| E. Laundry | 1. Does personal laundry completely | 1 |\n| | 2. Launders small items-rinses stockings, etc. | 1 |\n| | 3. All laundry must be done by others | 0 |\n| F. Mode of Transportation | 1. Travels independently on public transportation or drives own car | 1 |\n| | 2. Arranges own travel via taxi, but does not otherwise use public transportation | 1 |\n| | 3. Travels on public transportation when accompanied by another | 1 |\n| | 4. Travel limited to taxi or automobile with assistance of another | 0 |\n| | 5. Does not travel at all | 0 |\n| G. Responsibility for Own Medications | 1. Is responsible for taking medication in correct dosages at correct time | 1 |\n| | 2. Takes responsibility if medication is prepared in advance in separate dosage | 0 |\n| | 3. Is not capable of dispensing own medication | 0 |\n| H. Ability to Handle Finances | 1. Manages financial matters independently (budgets, writes checks, pays rent, bills, goes to bank), collects and keeps track of income | 1 |\n| | 2. Manages day-to-day purchases, but needs help with banking, major purchases, etc. | 1 |\n| | 3. Incapable of handling money | 0 |\nA summary score ranges from 0 (low function, dependent) to 8 (high function, independent) for women and 0 through 5 for men to avoid potential gender bias."
        question: "Lawton IADL maximum score for a man?"
        options: ["5", "8", "6", "10"]
        answer: 0
        why:
          - "صح: 0–5 للرجالة و0–8 للستات «to avoid potential gender bias» (الطبخ والغسيل والبيت مش بيتحسبوا للراجل في النسخة دي)."
          - "8 للستات."
          - "6 دي الـ Katz ADL."
          - "مفيش 10 في الـ Lawton."
      - kind: explain
        page: 112
        title: "الحركة: Mobility assessment"
        quote: "Mobility assessment\n  History taking\n  Establishing current and prior function\n  Understanding time periods\n  Goal-setting and prior Intervention\n  What the patient needs to be able to do\n  Gait and balance assessment\n  Simple tests for walking and balance\n    i. Timed up and go test\n    ii. Gait speed\n    iii. Chair stand\n  Onward referral"
        text: |
          History، current و prior function، الـ time periods، goals و prior intervention، هو محتاج يعمل إيه، gait و balance، ثم onward referral.

          والـ ==simple tests for walking and balance== تلاتة:
          1. **Timed up and go test**
          2. **Gait speed**
          3. **Chair stand**
      - kind: explain
        page: 113
        title: "مين ياخد multifactorial falls assessment؟"
        quote: "The following patients should receive a multifactorial risk assessment for falls:\n  Two or more falls in the past 12 months.\n  Presentation for medical attention with a fall.\n  Difficulty with walking or balance."
        text: |
