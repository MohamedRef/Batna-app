      - kind: explain
        page: 249
        title: "الـ impaired digestion: ليه كل سبب؟"
        quote: "Gastric surgery (Bliroth, pyloroplasty, gastroenterostomy, Vagotomy), gastrocolic fistula, the mechanisms are Inadequate gastric mixing, rapid emptying, or both"
        text: |
          الكتاب بيدّي سبب كل واحد:
          - **Exocrine pancreatic insufficiency** (pancreatectomy، advanced chronic pancreatitis، haemochromatosis): الإنزيمات نفسها مش موجودة.
          - **Reduced bile salts** (SIBO، chronic liver disease، ileal disease أو resection): مفيش micelles.
          - **Gastric surgery** و gastrocolic fistula: ==inadequate gastric mixing== و **rapid emptying**: الأكل ينزل قبل ما يتخلط بالإنزيمات والـ bile.
          - **Gastrinoma**: الحمض بيقفل الـ pancreatic enzymes.

          وليه الـ **ileal disease** بيقلل الـ bile salts؟ التفسير المقبول (مش في الكتاب): الـ terminal ileum هو اللي بيرجّع الـ bile salts للكبد (enterohepatic circulation)، فلو باظ بيضيعوا في البراز والكبد ما يلحقش يعوّض.
      - kind: reveal
        page: 249
        quote: "Gastrinoma: due to the inactivation of the pancreatic enzymes by the hyperacidity stimulated by high gastrin level."
        prompt: "الـ gastrinoma ورم بيطلّع gastrin. إيه دخله بالـ steatorrhea؟"
        answer: "الـ **gastrin** العالي بيعمل **hyperacidity**، والحمض بيوصل الـ duodenum ويقفل الـ **pancreatic enzymes** (الـ lipase بيحب pH 8). فالدهون ما تتهضمش. افتكر الكلام ده من الدرس اللي فات."
      - kind: explain
        page: 249
        title: "الـ impaired absorption: المساحة، الجدار، والعدوى"
        quote: "Acquired disorders are far more common and are caused by the following:"
        text: |
          **Inherited** (نادرة): glucose-galactose malabsorption، abetalipoproteinemia، cystinuria، Hartnup، sucrase-isomaltase deficiency. كل واحد transporter أو إنزيم واحد بايظ، يعني **specific** malabsorption.

          **Acquired** ==far more common==، وكلها بتقول نفس الحاجة: السطح اللي بيمتص قلّ أو باظ:
          - **المساحة قلّت**: resection أو bypass.
          - **السطح اتضرر**: celiac، tropical sprue، Crohn، AIDS enteropathy، chemotherapy، radiation.
          - **الجدار اتملى**: lymphoma، amyloidosis (حاجة غريبة قاعدة مكان الـ villi).
          - **عدوى**: bacterial overgrowth، giardiasis، Whipple، cryptosporidiosis، microsporidiosis.
      - kind: aside
        tone: trap
        page: 250
        quote: "Immunoglobulin A (IgA) deficiency (the most common immunodeficiency) is due to decreased or absent serum and intestinal IgA, which clinically appears similar to celiac disease and is unresponsive to a gluten-free diet."
        text: |
          عيان شكله **celiac** بالظبط، بس الـ **gluten-free diet** ما عملتش أي حاجة؟ فكّر في ==immunoglobulin A (IgA) deficiency== (أشهر immunodeficiency).

          وفي الأطفال: **autoimmune enteropathy** (antibodies ضد الـ enterocytes والـ goblet cells، وساعات islet و parietal cells) بتعمل **secretory diarrhea** و villous atrophy. و **acrodermatitis enteropathica**: عيب وراثي في امتصاص الـ **zinc**.

          ليه الـ IgA deficiency شبه الـ celiac؟ التفسير المقبول (مش في الكتاب): الـ IgA هو حارس الأمعاء الأساسي، فمن غيره العدوى (زي الـ giardia) بتعشّش وتعمل atrophy، والـ gluten مالوش دعوة، فطبيعي الـ GFD ما يعملش حاجة.
      - kind: explain
        page: 250
        title: "بعد الامتصاص، والأدوية والأمراض العامة"
        quote: "B. Other causes as Drugs: cholestyramine, neomycin, colchicine, irritant laxative. C.H.F, (congestion of the small intestine), carcinoid tumor, diabetes mellitus, adrenal insufficiency, thyroid disorders."
        text: |
          **Postabsorptive**: ==lymphatic obstruction== زي lymphangiectasia و lymphoma: الـ chylomicrons مش لاقية طريق.

          **أسباب تانية**: drugs (cholestyramine، neomycin، colchicine، irritant laxatives)، **CHF** (الكتاب بيقول: congestion of the small intestine)، carcinoid، diabetes، adrenal insufficiency، thyroid disorders.

          ليه الأدوية دي؟ التفسير المقبول (مش في الكتاب): الـ **cholestyramine** بيمسك الـ bile salts فمفيش micelles، والـ **neomycin** والـ **colchicine** بيأذوا الـ enterocyte، والـ laxatives بتسرّع الأكل قبل ما يتمص. والـ CHF: الأمعاء المحتقنة بتبقى منفوخة مية ودمها بطيء.
      - kind: sort
        page: 255
        quote: "Table 1: Classification of causes of intestinal malabsorption\nDiseases in which impaired intraluminal digestion is dominant\n  Pancreatic diseases (see Chapter 27)\n  Hepatobiliary disease\n  Postgastrectomy malabsorption\nDiseases in which impaired mucosal digestion, uptake, and transport are dominant\n  Celiac disease\n  Refractory sprue\n  Immunoproliferative small intestinal disease (IPSID) and lymphoma\n  Tropical sprue\n  Eosinophilic gastroenteritis\n  Systemic mastocytosis\n  Radiation enteritis\n  Amyloidosis\n  Whipple disease\n  Crohn disease (see Chapter 3)\n  Abetalipoproteinemia\n  Parasitic infestations\n  Carbohydrate intolerance\nDiseases and syndromes in which both impaired intraluminal digestion and mucosal function are often operative\n  Intestinal bacterial overgrowth\n  Short bowel syndrome\n  Gastrinoma (Zollinger-Ellison syndrome)\nDiseases or syndromes in which impaired postmucosal transport is dominant\n  Primary intestinal lymphangiectasia\n  Secondary intestinal lymphangiectasia"
