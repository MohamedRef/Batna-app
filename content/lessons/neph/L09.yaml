      - kind: explain
        page: 333
        title: "كل دوا بيقطع فين؟"
        quote: "Components of immunosuppressive protocol:"
        text: |
          الكتاب: ==three-signal model==، والـ **components of immunosuppressive protocol**: **CNI** (cyclosporine، tacrolimus)، **corticosteroids**، **adjuvant** (azathioprine، MMF، sirolimus)، **antibody induction** (ATG، و anti-CD25: basiliximab، daclizumab)، **CCB**، و **infection prophylaxis** (TMP-SMX و CMV antivirals). والـ **FTY720** بيقفل خروج الـ lymphocytes (lymphopenia).

          ليه كذا دوا مع بعض؟ التفسير المقبول (مش في الكتاب):
          - الـ **CNI** بيقفل **signal 1**: الـ calcineurin ما يشغلش الـ IL-2 gene.
          - الـ **anti-CD25** بيقفل مستقبل الـ IL-2 (**signal 3**)، والـ **mTOR inhibitors** بيقفلوا اللي بعده.
          - الـ **MMF والـ azathioprine** بيمنعوا الـ T cell إنه يتكاثر (nucleotide synthesis).
          - الـ **steroids** بتقلل الـ cytokines عمومًا.
          كل دوا لوحده بجرعة عالية سام. فلما تقفل 3 خطوات مختلفة بجرعات أقل، الحماية أقوى والـ toxicity أقل.

          وليه الـ CCB والـ TMP-SMX في البروتوكول؟ التفسير المقبول (مش في الكتاب): الـ **calcium channel blocker** بيوسّع الـ afferent arteriole اللي الـ CNI بيقبضه، فيحمي الكلية شوية ويظبط الضغط (وبعضها بيرفع مستوى الـ ciclosporin فتقلل الجرعة). والـ **TMP-SMX** بيمنع الـ Pneumocystis pneumonia والـ UTI في الشهور الأولى، والـ CMV antivirals لأن الـ CMV أشهر عدوى خطيرة بعد الزراعة.
