            <rect x="120" y="30" width="90" height="50" rx="10" class="fg-acc"/>
            <text x="128" y="60" class="t-sm">signal 1 + 2</text>
            <rect x="230" y="30" width="90" height="50" rx="10" class="fg-good"/>
            <text x="238" y="60" class="t-sm t-b">Activated</text>
            <rect x="10" y="105" width="80" height="50" rx="10" class="fg-box"/>
            <text x="18" y="135" class="t-sm">antigen only</text>
            <path d="M90 130 H118" class="fg-arrow" marker-end="url(#L05c)"/>
            <rect x="120" y="105" width="90" height="50" rx="10" class="fg-acc"/>
            <text x="128" y="135" class="t-sm">signal 1 only</text>
            <rect x="230" y="105" width="90" height="50" rx="10" class="fg-bad"/>
            <text x="238" y="135" class="t-sm t-b">Anergy</text>
            <rect x="10" y="180" width="80" height="50" rx="10" class="fg-box"/>
            <text x="18" y="200" class="t-sm">antigen</text>
            <text x="18" y="218" class="t-sm">+ costim.</text>
            <path d="M90 205 H118" class="fg-arrow" marker-end="url(#L05c)"/>
            <rect x="120" y="180" width="90" height="50" rx="10" class="fg-acc"/>
            <text x="128" y="200" class="t-sm">inhibitory</text>
            <text x="128" y="218" class="t-sm">receptor</text>
            <rect x="230" y="180" width="90" height="50" rx="10" class="fg-bad"/>
            <text x="238" y="210" class="t-sm t-b">Anergy</text>
          </svg>
      - kind: explain
        page: 80
        title: "Deletion و Tregs"
        quote: "Deletion Repeated activation of mature T lymphocytes by self antigens or recognition of self antigens without second signals, triggers pathways of apoptosis that result in elimination (deletion) of the self reactive lymphocytes, this process is called activation-induced cell death."
        text: |
          - **Deletion:** الـ mature T cell لو اتنشّطت **بشكل متكرر** بالـ self antigen، أو شافته من غير second signal ← apoptosis. ده اسمه ==activation-induced cell death==.
          - **Regulatory T cells:** بعض الـ self-reactive T cells بتتحوّل لـ **Tregs** بتمنع أو تكبت تنشيط الخلايا الـ self-reactive التانية. بتتكوّن في الـ **thymus** أو الـ **peripheral lymphoid organs**.

          التفسير المقبول (مش في الكتاب): ليه التنشيط المتكرر يموّت الخلية؟ عشان الـ antigen الغريب بيروح مع الوقت لما الميكروب يتشال، أما الـ self antigen موجود على طول. يعني الخلية اللي بتتنشّط تاني وتالت من غير ما الـ antigen يخلص، غالبًا بتهاجم حاجة من الجسم، فالجسم بيشيلها.
      - kind: match
        page: 80
        quote: "Regulatory T cells may develop in the thymus or in peripheral lymphoid organ."
        prompt: "وصّل كل mechanism بتعريفه:"
        pairs:
          - ["Negative selection", "Immature cell dies in the thymus"]
          - ["Anergy", "Antigen seen without costimulators"]
          - ["Activation-induced cell death", "Apoptosis after repeated activation"]
          - ["Regulatory T cells", "Suppress other self-reactive cells"]
        why: "الأولى central، والتلاتة التانيين peripheral. الـ anergy بتقفل الخلية وهي عايشة، والـ activation-induced cell death (AICD) بتموّتها، والـ Tregs بتكبتها من بره."
      - kind: explain
        page: 80
        title: "B cell tolerance"
        quote: "When immature B lymphocytes interact strongly with self antigens in the bone marrow, the B cells are either killed (negative selection) or they change receptor specificity."
        text: |
          - **Central:** الـ immature B cell في الـ **bone marrow** لو مسكت self antigen جامد ← يا **تتقتل**، ودي negative selection، يا ==change receptor specificity==.
          - **Peripheral:** الـ mature B cell لو قابلت **تركيز عالي** من الـ self antigen في الـ peripheral lymphoid tissues ← تبقى **anergic** وما تردش عليه تاني.
      - kind: explain
        page: 80
        title: "ليه الـ B cell عندها فرصة تانية؟"
        quote: "When immature B lymphocytes interact strongly with self antigens in the bone marrow, the B cells are either killed (negative selection) or they change receptor specificity."
        text: |
          الفرق الوحيد في الكتاب بين الـ T والـ B في الـ central tolerance: الـ B cell ممكن ==change receptor specificity== بدل ما تموت.

          التفسير المقبول (مش في الكتاب): الـ B cell بتعيد ترتيب جينات الـ receptor بتاعها وتجرّب receptor جديد، ولو الجديد مابقاش بيمسك الـ self antigen تعيش. يعني الجسم مابيرميش خلية كلّفته كتير لو ممكن **يصلّحها**.

          وليه الـ T tolerance أهم؟ عشان أغلب الـ B cells محتاجة **مساعدة من T helper** عشان تعمل antibodies قوية. فلو الـ T cell اتقفلت، الـ B cell الـ self-reactive غالبًا مش هتلاقي حد يشغّلها.
      - kind: check
        page: 80
        quote: "When immature B lymphocytes interact strongly with self antigens in the bone marrow, the B cells are either killed (negative selection) or they change receptor specificity."
        question: "Which tolerance mechanism belongs to B cells and NOT T cells in this lecture?"
        options:
          - "Changing receptor specificity in the bone marrow"
          - "Negative selection"
          - "Anergy"
          - "Activation-induced cell death"
        answer: 0
        why:
          - "صح: الـ B cell بس اللي ممكن تغيّر الـ receptor بتاعها بدل ما تموت."
          - "الـ negative selection موجودة في الاتنين: thymus و bone marrow."
          - "الـ anergy برضه في الاتنين في الـ periphery."
          - "الـ AICD اتشرحت للـ mature T cells."
      - kind: explain
        page: 82
        title: "الخلاصة: طريقين للـ anergy"
        quote: "Anergy result from the recognition of antigens without co stimulators or when T cells use inhibitory receptors to recognize co stimulators. Some self reactive T cells suppress potentially pathogenic T cells."
        text: |
          الـ take-home message بيضيف طريق تاني للـ anergy:

          1. الـ antigen **من غير costimulators** (اللي فات).
          2. الـ T cell تستخدم ==inhibitory receptors== تشوف بيها الـ costimulators.

          التفسير المقبول (مش في الكتاب): الـ inhibitory receptors زي **فرامل** بتمسك نفس الإشارة اللي كانت هتشغّل الخلية، فالإشارة تتحوّل من "اشتغل" لـ "اقف". وده سبب إن أدوية السرطان اللي بتشيل الفرامل دي ممكن تعمل autoimmunity كـ side effect.

          والسطر التاني هو الـ **Tregs**: بعض الـ self-reactive T cells بتكبت الـ pathogenic T cells.

          يعني في الآخر الـ anergy ليها بابين: إشارة ناقصة، أو فرامل شغالة.
      - kind: try
        items: [rheum.L05.012, rheum.L05.015, rheum.L05.016, rheum.L05.021, rheum.L05.038]
    recap:
      - "Central T: negative selection في الـ thymus = الـ principal mechanism."
      - "Peripheral T: anergy (من غير costimulators أو بـ inhibitory receptors)، deletion (AICD)، و Tregs."
      - "Central B: تموت أو تغيّر الـ receptor؛ peripheral B: anergy بعد تركيز عالي."
