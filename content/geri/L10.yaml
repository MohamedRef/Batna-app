schema: batna.content/v1
lecture: geri.L10
title: Diffuse parenchymal lung disease in the elderly
author: Dr. Nahed M.E. Hamad
book: { chapter: 7, pages: [169, 187] }
topics:
  - { id: intro, title: "Lung injury, repair and what DPLD means" }
  - { id: epidemiology, title: "Epidemiology" }
  - { id: classification, title: "Classification of DPLD" }
  - { id: pathology, title: "Pathology of IPF: the UIP pattern" }
  - { id: pathogenesis, title: "Pathogenesis: non-idiopathic fibrosis, IPF and telomeres" }
  - { id: course, title: "Time course of DPLD: chronic, subacute (COP), acute (AIP)" }
  - { id: clinical, title: "IPF symptoms, examination and history" }
  - { id: prognosis, title: "Complications, prognosis and natural history of IPF" }
