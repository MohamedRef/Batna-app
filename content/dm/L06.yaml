  # ---------- p73: glycemic control, insulin neuritis ----------
  - id: dm.L06.031
    kind: card
    topic: causal
    front: What did the DCCT show about intensive treatment and diabetic neuropathy?
    back: Intensive treatment significantly reduced both the incidence and progression of diabetic neuropathy in type 1 diabetes.
    src: { page: 73, quote: "Glycemic Control\n  DCCT: Intensive treatment significantly reduced both the incidence & progression of DN in patients with T1DM." }
    status: unverified
    tags: [high-yield]
  - id: dm.L06.032
    kind: card
    topic: causal
    front: In the DCCT figure, which neuropathy measure was most common at 5 years in the conventional arm, and what did intensive therapy do to it?
    back: Abnormal nerve conduction (about 40% conventional); intensive therapy cut it to under 20%.
    src: { page: 73, quote: "DCCT: Intensive treatment significantly reduced both the incidence & progression of DN in patients with T1DM.\n  Figure (Conventional 5-Yr vs Intensive 5-Yr, percentage of patients): Confirmed, Clinical Neuropathy, Abn. Nerve Cond., Abn. AFT (The DCCT Research Group, Ann Intern Med 122: 561-8, 1995)" }
    status: unverified
  - id: dm.L06.033
    kind: card
    topic: causal
    front: What is insulin neuritis?
    back: Treatment-associated neuropathic pain (neuralgia) in poorly controlled patients shortly after starting aggressive insulin therapy.
    src: { page: 73, quote: "Treatment-associated Neuralgia \"Insulin Neuritis\":\n  a. Treatment-associated neuropathic pain.\n  b. Occur in poorly-controlled patients shortly after starting aggressive insulin therapy.\n  c. DD from DPN: No Sensory loss and No weakness.\n  d. R/: Temporarily relaxing glycemic control." }
    status: unverified
    tags: [high-yield]
