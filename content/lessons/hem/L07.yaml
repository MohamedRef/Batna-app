  - id: hem.L07.lesson6
    title: "خلية واحدة وأحفادها: التصنيف"
    hook: "كل الـ blasts أحفاد خلية واحدة، والمرحلة اللي اتعطلت فيها هي اللي بتدّيك اسم المرض."
    minutes: 8
    pages: [105, 106]
    topics: [incidence, classification]
    goals:
      - "تحفظ أرقام الـ incidence وتعرف ليه الـ ALL مهمة رغم إنها الأقل"
      - "تشرح monoclonal وآليتين للـ pancytopenia"
      - "تعرف طرق التصنيف وليه AML مقابل ALL أهمها"
    status: unverified
    steps:
      - kind: table
        page: 105
        quote: "The annual incidence of all leukemias is 8 to 10 per 100,000, the relative incidence for the four categories of leukemia are as follows ALL 11%, CLL 29%, AML 46%, and CML 14% The impact of leukemia is heightened because of the young age of some patients, for example, ALL is the most common cancer and the second leading cause of death in children under 15 years of age."
        title: "مين الأكتر؟ (من كل الـ leukemias)"
        columns: [Leukemia, Share]
        rows:
          - [AML, "46%"]
          - [CLL, "29%"]
          - [CML, "14%"]
          - [ALL, "11%"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: tip
        page: 105
        quote: "The annual incidence of all leukemias is 8 to 10 per 100,000, the relative incidence for the four categories of leukemia are as follows ALL 11%, CLL 29%, AML 46%, and CML 14% The impact of leukemia is heightened because of the young age of some patients, for example, ALL is the most common cancer and the second leading cause of death in children under 15 years of age."
        text: |
          الـ incidence الكلي **8–10 per 100,000** في السنة.

          الـ ALL أقل واحدة في الكبار (11%)، بس هي ==most common cancer== في الأطفال تحت 15 سنة وتاني سبب وفاة عندهم. علشان كده تأثيرها كبير.
      - kind: check
        page: 105
        quote: "The annual incidence of all leukemias is 8 to 10 per 100,000, the relative incidence for the four categories of leukemia are as follows ALL 11%, CLL 29%, AML 46%, and CML 14%"
        question: "Which is the most common leukemia overall, according to the lecture?"
        options: ["AML", "CLL", "CML", "ALL"]
        answer: 0
        why:
          - "صح: AML حوالي 46% من كل الـ leukemias."
          - "الـ CLL 29%، التاني."
          - "الـ CML 14%."
          - "الـ ALL 11% بس، رغم إنها أشهر cancer في الأطفال."
      - kind: explain
        page: 105
        title: "Monoclonal: خلية واحدة وأحفادها"
        quote: "As the malignant clone expands it does so at the expense of normal hematopoiesis."
        text: |
          الكتاب بيقول المرض ==monoclonal==: آخر حدث خبيث بيحصل في **خلية واحدة**، وكل الـ blasts أحفادها. والمرحلة اللي الخلية كانت فيها لما اتعطلت **بتختلف**، وده اللي بيعمل الأنواع (M0 لحد M7، L1 لحد L3) في نفس الدرس.

          ولما الـ clone يكبر، بيكبر **على حساب** النخاع الطبيعي. في النخاع الـ **hypercellular** السبب غالبًا **physical replacement**: مفيش مكان للخلايا الطبيعية.
      - kind: reveal
        page: 106
        quote: "Some patients with acute leukemia develop pancytopenia with a hypocellular marrow, however, suggesting that marrow failure is not simply due to physical replacement of the marrow but also due to leukemia inhibitory substances released by malignant cells."
        prompt: "لو الـ pancytopenia سببها إن الـ blasts خدت مكان الخلايا بس، يبقى النخاع لازم يبقى hypercellular. طب ليه فيه عيانين نخاعهم hypocellular؟"
        answer: |
          لأن الـ marrow failure مش بس **physical replacement**.

          الخلايا الخبيثة كمان بتفرز ==leukemia inhibitory substances== بتكتم النخاع الطبيعي. فممكن تلاقي pancytopenia ونخاع فاضي نسبيًا.
      - kind: explain
        remind: [hem.L07.018]
        page: 106
        title: "أهم سؤال: myeloid ولا lymphoid؟"
        quote: "The most important distinction is between AML and ALL, since these two diseases differ considerably in their clinical behavior, prognosis and response to therapy (table 1)."
        text: |
          ممكن تصنّف الـ acute leukemia بـ **morphology** و **cytochemistry** و **cell surface markers** و **cytogenetics** و **oncogene expression**.

          بس أهم تفرقة هي ==acute myeloid leukaemia (AML) vs acute lymphoblastic leukaemia (ALL)==، لأنهم مختلفين في **الـ behavior** و **الـ prognosis** و **الاستجابة للعلاج**.

          يعني التصنيف مش رفاهية: الـ AML بتتعالج بـ 3 + 7، والـ ALL بماراثون سنين فيه الـ CNS، والـ APL بـ ATRA. لو غلطت في التفرقة هتدّي علاج غلط من أول يوم.
      - kind: figure
        page: 106
        quote: "The most important distinction is between AML and ALL, since these two diseases differ considerably in their clinical behavior, prognosis and response to therapy (table 1)."
        title: "شارع الـ FAB"
        alt: "A street of myeloid maturation from left to right: M0 to M2 myeloblasts with increasing differentiation, M3 promyelocyte, M4 myeloblasts plus monoblasts, M5 monoblasts. Two side branches: M6 erythroblasts and M7 megakaryoblasts. Below, a separate lymphoid row: L1 small uniform, L2 larger variable, L3 Burkitt-like with vacuoles."
        caption: "الـ **M** على قد الخلية اللي وقفت عندها في الشجرة الـ myeloid، والـ **L** على قد شكل الـ lymphoblast. ==M3== بس هو اللي له translocation ثابتة t(15;17)."
        svg: |
