  # ------------------------------------------------------------------
  - id: git.L02.lesson1
    title: "نوصل للأمعاء الدقيقة إزاي؟"
    hook: "ستة متر أمعاء مش بيوصلها لا منظار المعدة ولا منظار القولون. نعمل إيه مع نزيف مش لاقيين مصدره؟"
    minutes: 8
    pages: [40, 43]
    topics: [history, enteroscopy]
    goals:
      - "تعرف يعني إيه intervention وترتّب محطات تاريخ المنظار"
      - "تعدّ أنواع الـ enteroscopy ودواعيها وتعرف ليه كل دلالة"
      - "تفهم الـ double balloon بيمشي إزاي"
    status: unverified
    steps:
      - kind: explain
        page: 40
        quote: "Interventions mean any interference which may occurs to diagnose and treat the disease or to follow-up its course."
        title: "المنظار بقى بيعالج مش بس بيشوف"
        text: |
          الـ ==intervention== في الـ gastrointestinal tract (GIT): أي تدخّل علشان **نشخّص** أو **نعالج** أو **نتابع** المرض.

          والـ gastroenterologist بقى دوره كبير في العلاج، والتطور كان **rapid and remarkable**.

          ليه المحاضرة دي مهمة لطبيب الباطنة؟ لأن كل جهاز فيها بيحل مشكلة واحدة: يا يوصل لمكان ما كانش بيتوصل له (الـ small bowel، الـ bile duct)، يا يشوف حاجة ما كانتش بتبان (early cancer)، يا يعالج من غير جراحة (EMR، POEM). لو عرفت المشكلة، الجهاز بيتحفظ لوحده.
      - kind: explain
        page: 40
        quote: "1958 Development of fiber optic gastroscope"
        title: "التاريخ في سطور"
        text: |
          الكتاب بيعدّ المحطات:
          - **1958** fiber optic gastroscope
          - **1968** endoscopic retrograde pancreatography، و **1970** cholangiography
          - **1969** colonoscopic polypectomy
          - **1974** sphincterotomy مع استخراج حصوة الـ bile duct
          - **1979** percutaneous endoscopic gastrostomy (PEG)
          - **1980** injection sclerotherapy، و **1985** control of upper GI bleeding
          - **1983** ==electronic (charge coupled device) endoscope==
          - **1990** variceal ligation، و **1996** self-expanding metal stents
          - **2008** ==endomicroscopy== بتدّيك histology وانت جوه

          لاحظ الترتيب المنطقي: الأول **نشوف** (fiber optic)، بعدين **نوصل** للقنوات (ERCP)، بعدين **نعالج** (polypectomy، PEG، ligation)، وفي الآخر **نشخّص بالميكروسكوب** من غير ما نقطع.

          يعني كل محطة جت علشان تحل مشكلة سابتها اللي قبلها، وده نفس ترتيب المحاضرة: نوصل للـ small bowel، نشوف أوضح، نشيل بالمنظار، وفي الآخر نحرق أو نجمّد.
      - kind: order
        page: 40
        quote: "1958 Development of fiber optic gastroscope"
        prompt: "رتّب المحطات دي من الأقدم للأحدث:"
        steps:
          - "Fiber optic gastroscope"
          - "Colonoscopic polypectomy"
          - "Percutaneous endoscopic gastrostomy"
          - "Endoscopic variceal ligation"
          - "Self-expanding metal stents"
          - "Endomicroscopy"
        why: "الكتاب: 1958 fiber optic، 1969 polypectomy، 1979 PEG، 1990 variceal ligation، 1996 metal stents، 2008 endomicroscopy."
      - kind: explain
        page: 41
        quote: "The major indication is to locate a site of obscure GIT bleeding."
        title: "الـ enteroscopy"
        text: |
          الـ ==enteroscopy== = منظار للـ **small bowel**. دلالته الأولى: نلاقي مكان **obscure GI bleeding**. وفيه **working channels** للـ biopsy والعلاج.

          أنواعه ستة: **colonoscope**، **sonde**، **push**، **double balloon (push and pull)**، **intraoperative**، و **spiral**.

          - **Day-case**، من **45 دقيقة لساعتين**.
          - **Sedation** أو short-acting general anesthesia (GA).
          - من **البق أو الشرج** حسب الجزء المطلوب.
          - بينفخوا **CO2** علشان الانتفاخ يقل، وأحيانًا **fluoroscopy**.
      - kind: explain
        page: 41
        quote: "Double balloon (push and pull) enteroscope."
        title: "ستة أنواع، والفرق في قد إيه بيوصل"
        text: |
          الكتاب بيعدّ **Types of Small Bowel Enteroscope**:
          - Enteroscopy using a **colonoscope**
          - **Sonde** enteroscope
          - **Push** enteroscope
          - ==Double balloon (push and pull)== enteroscope
          - **Intraoperative** enteroscope
          - **Spiral** enteroscope

          التفسير المقبول (مش في الكتاب) علشان تفتكرهم بالمنطق: كلهم بيحاولوا يحلّوا مشكلة واحدة، إن الـ small bowel **طويل وبيلفّ** والمنظار بيعمل loop. الـ colonoscope والـ push بيزقّوا بس، فبيوصلوا لأول الـ jejunum. الـ sonde كان بيمشي مع الحركة الدودية ببطء. الـ double balloon بيمسك ويشد (**push and pull**)، والـ spiral بيلفّ الأمعاء على نفسه زي البريمة. والـ intraoperative هو آخر حل، لأن الجراح بيمسك الأمعاء بإيده من جوه البطن وانت بتبص.

          والمهم إن الـ enteroscope فيه **working channels**، يعني يقدر ياخد **tissue sampling** ويعمل **therapeutic interventions** جوه الـ small intestine، ودي اللي بتفرّقه عن الكبسولة.
      - kind: reveal
        page: 41
        quote: "Takes between 45 m-2 h depending on the indication."
        prompt: "ليه الـ enteroscopy ممكن تاخد لحد ساعتين، وبتتعمل تحت sedation أو general anaesthesia قصير؟"
        answer: |
          الكتاب: **day-case**، من **45 دقيقة لساعتين** حسب الـ indication، تحت **sedation** أو **short acting general anaesthesia**، من **البق أو الشرج** حسب الجزء المطلوب، وممكن **fluoroscopy**.

          التفسير المقبول (مش في الكتاب): الوقت بيطول لأن كل سنتيمتر في الـ small bowel بيتكسب بحركة push and pull متكررة، ولو فيه علاج (coagulation لنزيف) بيزيد. وعلشان المدة طويلة ومزعجة، المريض محتاج يكون مرتاح ومش بيتحرك. والـ fluoroscopy بتوريك المنظار وصل لفين لما الصورة من جوه ما تكفيش.
      - kind: explain
        page: 41
        quote: "Obscure GIT bleeding.\n Mal absorption and unexplained diarrhea.\n Exploration of radiographic abnormalities of the small bowel.\n Investigation of small bowel malignancy."
        title: "ليه بندخل الـ small bowel؟"
        text: |
          الدواعي في الكتاب تلات مجموعات:
          - **Diagnostic**: obscure GIT bleeding، **malabsorption** و unexplained diarrhea، استكشاف **radiographic abnormalities**، و **small bowel malignancy**.
          - **Therapeutic**: ==thermo coagulation== لـ bleeding lesions، و تركيب **jejunostomy tube**.
          - **Surveillance**: ==polyposis syndrome==.

          التفسير المقبول (مش في الكتاب) للربط: الـ small bowel هو «المنطقة العمياء» بين منظار المعدة ومنظار القولون. فلما النزيف يتكرر والمنظارين نضاف، أو الأشعة تلمّح لحاجة، أو محتاج **biopsy** تثبت malabsorption، الـ enteroscope هو اللي يوصل ويقدر ياخد عينة ويعالج في نفس القعدة، عكس الـ capsule اللي بتشوف بس.

          يعني لو اتسألت «indications of enteroscopy» افتكر التلات عناوين بالترتيب: نشخّص (diagnostic)، نعالج (therapeutic)، نتابع (surveillance). الـ surveillance للـ polyposis علشان الـ polyps بتتكرر ولازم تتشاف وتتشال قبل ما تكبر.
      - kind: sort
        page: 42
        quote: "b) Therapeutic\n  Thermo coagulation of bleeding lesions.\n  Placement of jejonostomy tube.\nc) Surveillance\n  Polyposis syndrome."
        prompt: "دلالات الـ enteroscopy: حط كل واحدة في نوعها:"
        bins: ["Diagnostic", "Therapeutic", "Surveillance"]
        cards:
          - { text: "Obscure GI bleeding", bin: 0 }
          - { text: "Malabsorption, unexplained diarrhea", bin: 0 }
          - { text: "Small bowel malignancy", bin: 0 }
          - { text: "Thermocoagulation of bleeding lesions", bin: 1 }
          - { text: "Jejunostomy tube placement", bin: 1 }
          - { text: "Polyposis syndrome", bin: 2 }
        why: "الكتاب (ص 41-42): diagnostic أربعة (bleeding، malabsorption، radiographic abnormality، malignancy)، therapeutic اتنين، و surveillance واحدة: polyposis."
      - kind: figure
        page: 42
        title: "الـ double balloon في الكتاب"
        image: { file: git/L02-dbe-device.webp, book: true }
        alt: "Book photos of the double balloon enteroscope: the scope with its overtube, the two balloons at the tips inflated, and a sketch of the stomach and coiled small bowel."
        caption: |
          **Double Balloon Endoscopy (DBE)**: بالونة على طرف المنظار، وبالونة على الـ **overtube**. (Courtesy of Fujinon and Yamamoto.)
      - kind: figure
        page: 43
        quote: "Enteroscope\n  Antegrade (oral) DBE\n  Retrograde (anal) DBE"
        title: "الـ double balloon بيمشي إزاي؟"
        alt: "Sketch of a double balloon enteroscope: an overtube with a balloon and a scope with a balloon at its tip inside a looped small bowel; arrows show the push of the scope, inflation, and the pull that pleats the bowel onto the overtube."
        caption: "**Push and pull**: بالونتين بيتبادلوا يمسكوا الأمعاء، والمنظار يتزق وبعدين يشد الأمعاء ويكرمشها على الـ overtube زي ما بتلبس شراب. 😄 يا من البق (antegrade) يا من الشرج (retrograde)."
        svg: |
