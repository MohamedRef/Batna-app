  - id: endo.L06.lesson4
    title: "الأدوية، الـ binding proteins، والخطوات الخمسة"
    hook: "الـ amiodarone لوحده ممكن يعمل تلات أنماط مختلفة. وبعدين نختم بالـ algorithm اللي بيحل أي لغز."
    minutes: 10
    pages: [107, 110]
    topics: [drugs, binding, rth]
    goals:
      - "تعرف أنماط الـ iodide والـ amiodarone والـ lithium والـ TKIs"
      - "تعرف الأدوية اللي بتغير الـ TBG أو بتزاحم عليه"
      - "تفرّق RTH من TSHoma وتمشي في الخطوات الخمسة"
    status: unverified
    steps:
      - kind: explain
        page: 107
        quote: "may develop overt hyperthyroidism following exposure to iodine-containing compounds (Jod- Basedow effect), which may persist for months"
        title: "اليود: يقفل ولا يفتح؟"
        text: |
          اليود من الأكل أو الـ supplements أو الـ **contrast** ممكن يعمل حاجتين عكس بعض:

          - **↑TSH، ↓FT4**: اضطراب مؤقت، وممكن hypothyroidism دايم لو الغدة احتياطيها قليل (chronic autoimmune thyroiditis).
          - **↓TSH، ↑FT4**: ==Jod-Basedow==، يعني overt hyperthyroidism بعد iodine-containing compounds لو فيه autonomy (زي MNG قديمة)، وممكن يفضل شهور.

          والـ **Wolff-Chaikoff** = اليود العالي جوه الغدة بيوقف تصنيع T4 و T3.
      - kind: table
        page: 107
        quote: "Two main types of thyrotoxicosis are recognised: type 1 (large iodine load precipitating latent thyroid autonomy); type 2 (destructive thyroiditis)"
        title: "الـ amiodarone: تلات وشوش"
        columns: ["Pattern", "Why"]
        rows:
          - ["Transient ↑TSH, ↑FT4, N FT3", "Type 1 DIO blocked (early months)"]
          - ["↓TSH, ↑FT4", "Type 1 iodine / type 2 thyroiditis"]
          - ["↑TSH, ↓FT4", "Up to 15%; no Wolff-Chaikoff escape"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: check
        page: 107
        quote: "inhibition of type 1 DIO leads to persistent elevation of FT4, but normal FT3"
        question: "Why is FT4 raised with a normal FT3 early on amiodarone?"
        options: ["It inhibits type 1 deiodinase", "It is a heterophilic antibody", "It raises TBG", "It stimulates the TSH receptor"]
        answer: 0
        why:
          - "صح: الـ DIO1 بيتقفل فالـ T4 مش بيتحول لـ T3."
          - "ده دوا مش antibody."
          - "الكتاب مش بيقول إنه بيعلّي الـ TBG."
          - "مش بيشتغل على الـ TSH receptor."
      - kind: match
        page: 107
        quote: "Primary hypothyroidism (possibly due to a direct toxic effect on the thyroid gland) has been observed with some TKIs, e.g. Sunitinib, Sorafenib"
        prompt: "وصّل كل دوا بتأثيره:"
        pairs:
          - ["Lithium", "Overt or subclinical hypothyroidism"]
          - ["Sunitinib", "Hypothyroidism ± thyrotoxic prodrome"]
          - ["Alemtuzumab", "Graves' disease"]
          - ["Interferon alpha", "Hashimoto's (or Graves')"]
          - ["Bexarotene", "↓TSH and ↓FT4 (TSHβ blocked)"]
        why: "الـ bexarotene الوحيد من الـ TSH suppressors اللي بيعمل hypothyroidism حقيقي في نسبة كبيرة."
      - kind: explain
        page: 108
        quote: "Both octreotide and lanreotide suppress pituitary TSH secretion through a direct inhibitory action on pituitary thyrotrophs"
        title: "أدوية بتوطّي الـ TSH"
        text: |
          - **Dopamine/agonists**: على الـ D2 في الـ thyrotrophs.
          - **Glucocorticoids**: بتقفل الـ TRH من الـ paraventricular nucleus.
          - **Somatostatin analogues**: octreotide و lanreotide على الـ thyrotrophs مباشرة.
          - **Metformin**: TSH بيقل ظاهريًا، و FT4 طبيعي.

          كلهم عادةً ==transient== ومن غير central hypothyroidism مهم.
      - kind: table
        page: 108
        quote: "Drugs that inhibit TBG synthesis: androgens, chronic glucocorticoid therapy, nicotinic acid."
        title: "الـ TBG"
        columns: ["Effect", "Drugs"]
        rows:
          - ["↑TBG", "Oral oestrogen, raloxifene, tamoxifen, mitotane, 5-FU, methadone, heroin"]
          - ["↓TBG", "Androgens, chronic steroids, nicotinic acid"]
        hide: [[0, 1], [1, 1]]
      - kind: aside
        tone: trap
        page: 108
        quote: "oral (but not transdermal) oestrogen"
        text: "الـ **transdermal** oestrogen مش بيعلّي الـ TBG، بس الـ **oral** بيعلّيه (بيعدّي على الكبد الأول). سؤال امتحان كلاسيكي."
      - kind: explain
        page: 109
        quote: "Furosemide (especially with doses >80 mg/day and when given intravenously)."
        title: "أدوية بتزاحم على الـ binding sites"
        text: |
          بتطرد الـ T4 والـ T3 من الـ TBG والـ albumin والـ transthyretin وبتبوّظ الـ FT4/FT3:

          - **Furosemide** (أكتر من 80 mg/day و IV).
          - **Aspirin**، **NSAIDs**، **phenytoin**.
          - ==Heparin==: متقيسش FT4 أصلًا لو تقدر؛ ولو لازم، خد العينة **بعد 10 ساعات على الأقل** من آخر حقنة وحللها على طول.
      - kind: table
        page: 109
        quote: "Somatostatin receptor ligand therapy →Most TSHomas respond."
        title: "RTH ولا TSHoma؟"
        columns: ["Clue", "TSHoma", "RTH"]
        rows:
          - ["SRL trial", "Most respond", "No change"]
          - ["Relatives", "Normal", "Same TFTs"]
          - ["Gene", "-", "THRB"]
        hide: [[0, 1], [0, 2], [1, 2], [2, 2]]
