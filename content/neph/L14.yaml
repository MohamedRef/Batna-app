      - HELLP syndrome
      - Disseminated intravascular coagulation (DIC)
    pass: 3
    hook: "التلاتة المشهورين اللي لازم تفرّق الـ HUS عنهم = «T وH وD»: TTP، HELLP syndrome، وDIC."
    src: { page: 470, quote: "Some of the more common TMAs from which HUS must be differentiated are thrombotic thrombocytopenic purpura (TTP); syndrome of hemolysis, elevated liver enzymes and low platelets (HELLP); and disseminated intravascular coagulation (DIC)." }
    status: unverified
  # ---------- p471-477: HUS ----------
  - id: neph.L14.115
    kind: card
    topic: hus
    front: Define hemolytic uremic syndrome.
    back: A TMA with thrombocytopenia, microangiopathic hemolytic anemia and AKI.
    src: { page: 471, quote: "Hemolytic uremic syndrome (HUS) is a thrombotic microangiopathy (TMA) characterized by thrombocytopenia, microangiopathic hemolytic anemia, and AKI." }
    status: unverified
  - id: neph.L14.116
    kind: table
    topic: hus
    title: Typical versus atypical HUS (p471-472)
    columns: [Feature, Typical (STEC) HUS, Atypical HUS]
    rows:
      - [Share of HUS, "90-95%", "5-10%"]
      - [Cause, "Shiga toxin-producing E. coli", "Alternative complement pathway mutations"]
      - [Kidney recovery, Usual, "Often fails without treatment; ~50% dialysis, 25% mortality"]
      - [Relapse, Uncommon, Common]
    blanks: [[0, 1], [0, 2], [1, 2], [2, 2]]
