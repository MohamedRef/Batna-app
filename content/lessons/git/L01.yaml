  - id: git.L01.lesson10
    title: "تشخيص الـ ulcer وسلّم Forrest"
    hook: "لقيت قرحة في المنظار. تاخد منها عينة ولا لأ؟ ولو بتنزف، الشكل بيقولك هترجع تنزف ولا هتهدى."
    minutes: 8
    pages: [28, 30]
    topics: [pud, forrest]
    goals:
      - "تعرف مين يعمل test and treat ومين لازم منظار"
      - "تعرف تاخد biopsies منين ولي الـ GU بيتكرر منظارها بعد 8 أسابيع"
      - "تصنّف Forrest وتعرف الـ high-risk"
    status: unverified
    steps:
      - kind: explain
        page: 28
        quote: "Endoscopy is the gold standard for diagnosis of peptic ulcer disease."
        title: "منظار ولا test and treat؟"
        text: |
          - ==Endoscopy== هو الـ **gold standard**.
          - بس لأن الـ H. pylori سبب أغلب الـ ulcers، فيه **test-and-treat** بـ non-invasive test (**urea breath** أو **stool antigen**)، في:
            - أصغر من **55** سنة، dyspepsia، ومفيش alarming symptoms
            - في مناطق الـ gastric cancer فيها **uncommon** والـ H. pylori أكتر من ==20%==
          - الأكبر سنًا: **upper GI endoscopy**.

          ليه السن 55؟ التفسير المقبول (مش في الكتاب): الـ gastric cancer نادر تحت السن ده، فلو مفيش alarm الأمان كويس إنك تعالج من غير منظار. وفوقه الـ risk بيعلى، فلازم تشوف بعينك.
      - kind: explain
        page: 29
        quote: "If the GU biopsies are benign, EGD is repeated 8 weeks later to confirm healing of the GU, because up to 4% of apparently benign GUs at initial endoscopy are subsequently found to be malignant."
        title: "التشخيص والـ biopsies"
        text: |
          - **Endoscopy = gold standard**.
          - **Test and treat** (UBT أو stool antigen) في الأصغر من **55** من غير alarm، في منطقة الـ cancer فيها قليل والـ H. pylori أكتر من **20%**. الأكبر: منظار.
          - لقيت ulcer؟ biopsies من الـ **antrum والـ body** للـ **rapid urease test**.
          - **GU**: biopsies من ==edges== علشان الـ cancer. ولو benign، كرر المنظار بعد **8 weeks**، لأن لحد **4%** منها بيطلع malignant.
      - kind: explain
        page: 29
        quote: "Biopsies should also be taken from the edges of GUs because of risk of gastric cancer."
        title: "ليه الحافة؟ وليه 8 أسابيع؟"
        text: |
          الكتاب: الـ biopsy من ==edges== الـ GU علشان الـ **risk of gastric cancer**. ولو benign، **EGD بعد 8 weeks** علشان تتأكد إنها خفت، لأن لحد **4%** من الـ GU اللي شكلها benign بتطلع malignant.

          والـ «ليه» التفسير المقبول (مش في الكتاب):
          - الحافة لأن قاع القرحة **necrotic**، والخلايا الحية (ولو فيها cancer) على الحرف.
          - الـ 8 أسابيع لأن القرحة الـ benign المفروض تكون التأمت على العلاج. لو لسه موجودة، ده في حد ذاته علامة إنها ممكن تكون cancer.
      - kind: figure
        page: 30
        quote: "High risk ulcers\nActive spurting bleeding (Forrest IA),\nOozing bleeding (Forrest IB),\nPigmented protuberance or nonbleeding visible vessel (NBVV [Forrest IIA]) adherent clot (Forrest IIB)"
        title: "سلّم Forrest"
        alt: "A ladder of six rungs from top (highest risk) to bottom: IA spurting, IB oozing, IIA non-bleeding visible vessel, IIB adherent clot, then a dividing line, IIC flat pigmented spot and III clean base as low risk."
