        why: "الكتاب: الـ **VCE first-line** بعد ما فوق وتحت (والـ second look) يتستبعدوا، والـ VCE **قبل** الـ deep enteroscopy علشان يزوّد الـ yield ويوجّهها."
      - kind: explain
        page: 231
        title: "تفاصيل بيحبّوها في الامتحان"
        quote: "Owing to the lower detection rate of lesions in the duodenum and proximal jejunum with VCE, push enteroscopy should be performed if proximal lesions are suspected."
        text: |
          - الـ VCE بيشوف أقل في الـ **duodenum والـ proximal jejunum** ← لو شاكك في lesion هناك اعمل **push enteroscopy**.
          - **Total deep enteroscopy** لو الـ suspicion قوي.
          - **Deep enteroscopy أولًا** في الـ **massive hemorrhage** أو لو الـ VCE contraindicated.
          - **Intraoperative enteroscopy:** sensitive جدًا بس invasive، بس لما الـ enteroscopy مش ممكن (عمليات قديمة و adhesions).
          - **No barium** في الـ small bowel bleeding.
          - **CT enterography (CTE) بعد capsule negative**: أحسن في الـ **mural masses** وتحديد مكانها وتوجيه الـ enteroscopy.

          ليه ==no barium==؟ التفسير المقبول (مش في الكتاب): الـ barium بيورّي شكل الغشا من بره، وما بيشوفش الـ **vascular lesions** المسطّحة اللي بتنزف، وكمان بيفضل في الأمعاء ويبوّظ أي CT أو angiography بعده.
