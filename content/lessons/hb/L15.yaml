      - kind: aside
        tone: joke
        page: 297
        text: |
          الـ CP زي جار بيخبط 24 ساعة. الحل مش إنك تهدّ العمارة (Whipple) من أول يوم. ابدأ تكلّمه بالذوق (analgesics)، وقفّل عليه الشيشة والكحول، وبعدين ابعتله سبّاك (المنظار)، والهدم آخر حاجة. 😄
