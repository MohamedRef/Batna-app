    status: unverified
    steps:
      - kind: explain
        page: 480
        title: "العلاج الأساسي"
        quote: "The mainstay of treatment in TTP is plasma exchange (PEX) with high-dose corticosteroid therapy."
        text: |
          ==plasma exchange (PEX) + high-dose steroids==، وابدأ فوراً.
          - "**Steroid**: prednisone **1 mg/kg/day**؛ لو حالته وحشة methylprednisolone intravenous (IV)."
          - "**PEX**: plasma volume واحد (~**40 mL/kg**) يومياً، والـ replacement **plasma** لأنه بيعوّض ADAMTS13."
          - وقّف الـ PEX فجأة عند الـ remission (لما الـ platelets تستقر أكتر من 48 ساعة)، والـ steroid يتسحب بالتدريج.
      - kind: explain
        page: 480
        title: "ليه PEX و steroid مع بعض؟"
        quote: "Both the ultra-large VWF multimers and the ADAMTS13 autoantibodies are effectively removed from circulation by plasma exchange therapy."
        text: |
          كل واحد بيضرب حتة مختلفة من المشكلة، والسبب في الكتاب:

          - **الـ PEX بيشيل:** ==Both the ultra-large VWF multimers and the ADAMTS13 autoantibodies== من الدم.
          - **الـ plasma بيعوّض:** الـ replacement fluid هو **plasma** لأنه ==repletes ADAMTS13==. يعني بتشيل الوحش وتحط الإنزيم الناقص في نفس الجلسة.
          - **الـ steroid بيوقف المصنع:** بيقلل ==activity of the reticuloendothelial system== وبيقلل **autoantibody production**.

          ولذلك الكتاب بيقول ابدأ **as soon as possible** في أي hemolytic anemia و thrombocytopenia **مش مفسّرة** مع **coagulation طبيعي**. والـ coagulation الطبيعي هو اللي بيبعدك عن الـ DIC.

          والجرعة: prednisone **1 mg/kg/day** لو المخ سليم؛ لو حالته شديدة **methylprednisolone 1000 mg** يوميًا 3 أيام أو **125 mg** من 2 لـ 4 مرات في اليوم.

          ليه بنبدأ قبل ما نتأكد؟ لأن الـ TTP من غير علاج 90% وفاة، والـ PEX لو طلع التشخيص غلط ضرره أقل بكتير من إنك تستنى.
      - kind: explain
        page: 481
        title: "لما الـ first-line يفشل"
        quote: "Rituximab is an anti-CD20 monoclonal antibody found to help treat TTP refractory to PEX. It targets B-lymphocytes and has a good response rate in refractory and relapsed TTP. It has gained more favour than other nonspecific immunosuppressive agents."
        text: |
          الـ adjuncts في الكتاب (splenectomy، cyclosporine، cyclophosphamide، vincristine، rituximab) بتتدّي ==when first-line therapy (PEX and corticosteroids) fail==. وكل واحد ليه سبب:

          - **Rituximab:** anti-**CD20** بيضرب الـ **B-lymphocytes** اللي بتصنع الـ antibody، وله ==good response rate in refractory and relapsed TTP==، فبقى ==gained more favour== عن الباقيين.
          - **Glucocorticoids + rituximab** مع الـ PEX **decrease the required duration** بتاعة الـ PEX.
          - **Splenectomy:** بتشيل **a major site of antibody production**، بس تدخّل كبير ونتيجته **variable**.
          - **Vincristine و cyclophosphamide و cyclosporine:** **less than exemplary efficacy**، فبتتدّي مع علاجات تانية في الـ refractory.
      - kind: match
        page: 481
        quote: "Rituximab is an anti-CD20 monoclonal antibody found to help treat TTP refractory to PEX. It targets B-lymphocytes and has a good response rate in refractory and relapsed TTP. It has gained more favour than other nonspecific immunosuppressive agents."
        prompt: "وصّل الدوا بدوره في الـ TTP:"
        pairs:
          - ["Rituximab", "Anti-CD20; refractory, relapsing TTP and prophylaxis"]
          - ["Caplacizumab", "Blocks VWF A1 domain; stops microthrombi fast"]
          - ["Plasma infusion", "Temporizing only, until PEX is available"]
          - ["Splenectomy", "Removes antibody site; variable efficacy"]
        why: "الـ caplacizumab بيوقف الـ thrombi بسرعة بس **مش** بيقلل الـ autoantibody، عشان كده بيتدي 30 يوم بعد الـ PEX لحد ما الـ ADAMTS13 يعدّي 20%."
      - kind: explain
        page: 482
        title: "الـ caplacizumab: سريع، بس مش بيعالج السبب"
        quote: "It rapidly halts the formation of microthrombi in TTP. However, it does not reduce the production of the autoantibody against ADAMTS13."
        text: |
          بيمسك الـ **A1** domain في الـ VWF فـ ==prevents platelet adhesion==. النتيجة: ==more rapid onset of action== والوفيات ==significantly decreased==، وبعض الخبراء بيدّوه frontline.

          بس **does not reduce the production of the autoantibody**. عشان كده:
          - بيتدّي IV وبعدين subcutaneous **for 30 days after PEX has been stopped**.
          - والمفروض ده يتزامن مع إن الـ **ADAMTS13 يعدّي 20%**. يعني بيحميك لحد ما الـ immunosuppression تشتغل وترجّع الإنزيم.

          والعيب: **bleeding**، لأنه بيوقف لزق الصفايح كلها. لو نزيف مهم: وقّفه و/أو **VWF concentrate**.
      - kind: reveal
        page: 482
        quote: "Plasma infusion without exchange is not an adequate treatment for TTP."
        prompt: "مستشفى صغير، مفيش جهاز PEX، والمريضة عندها TTP. تدّي plasma infusion وخلاص؟ وتنقل صفايح؟"
        answer: |
          الـ plasma infusion لوحدها ==not an adequate treatment==، بس تنفع ==temporizing measure== لحد ما الـ PEX يبقى متاح. الكتاب بيقول فعاليتها زي الـ PEX **لو** نفس الحجم، بس ده ==not feasible== لأن الحجم ضخم. التفسير المقبول (مش في الكتاب): المريض هيغرق سوايل قبل ما يوصل للحجم المطلوب، والـ infusion مش بتشيل الـ antibody.

          والصفايح: **contraindicated unless major bleeding is present**، لأنها وقود للجلطات. أما الـ **PRBC** فلو فيه indication.

          وإمتى توقف الـ PEX؟ بتتابع الـ **hemolysis markers** كل يوم، وبتقف لما الـ platelets **stabilize** لأكتر من **48 ساعة**، ووقتها تقف **abruptly without any need for tapering**، والـ steroid بس هو اللي بيتسحب تدريجي.
