schema: batna.lesson/v1
lecture: dm.L11
lessons:
  # ------------------------------------------------------------------
  - id: dm.L11.lesson1
    title: "ليه الـ insulin مش آخر الطريق"
    hook: "أغلب عيانين الـ type 2 هيحتاجوه في يوم. نعرف امتى وليه، وليه الاستنى غلط."
    minutes: 8
    pages: [130, 131]
    topics: [indications, facts]
    goals:
      - "تعدّ دواعي الـ insulin بقائمة المحاضرة دي، وتعرف ليه كل واحدة"
      - "تعرف الـ insulin therapy عند الكتاب: بداية، titration، وتعديل"
      - "تحفظ الـ two facts وتفهم ليه الـ stepwise المتأخر مشكلة"
    status: unverified
    steps:
      - kind: explain
        remind: [dm.L11.001, dm.L10.002]
        page: 130
        title: "الدواعي (النسخة دي)"
        quote: "Initial stabilization of patients with severe hyperglycemia"
        text: |
          نفس قائمة محاضرة الـ injectable therapy، وزيادة بند مهم:

          - ==Initial stabilization== لعيان عنده **severe hyperglycemia**
          - **Hyperglycemic crises**
          - **Pregnancy**
          - **Significant liver or kidney disease**
          - **Stress**: Acute coronary syndrome (ACS)، intensive care unit (ICU)، major surgery، severe infection، corticosteroids
          - **Oral therapy failed**

          والـ **insulin therapy** عند الكتاب = تبدأ + تعمل **titration** + **تعدّل** الـ regimen لما يلزم.
      - kind: explain
        page: 130
        title: "ليه الـ insulin بالذات في كل بند؟"
        quote: "1. Initial stabilization of patients with severe hyperglycemia\n      2. Hyperglycemic crises\n      3. Pregnancy\n      4. Significant liver or kidney disease\n      5. Stressful situations, e.g. ACS, ICU, major surgery, severe infection,\n         corticosteroids\n      6. Patients in whom oral glucose-lowering therapy has failed"
        text: |
          الكتاب بيدّيك القايمة من غير أسباب. التفسير المقبول (مش في الكتاب) إن الـ insulin هو الدوا الوحيد اللي **مالوش سقف** ويتظبط بالوحدة، وده بيفسّر الستة:

          - **Severe hyperglycemia**: السكر العالي جدًا نفسه بيسمّم الـ beta cells ويزوّد الـ insulin resistance (==glucotoxicity==). الـ insulin بينزّله بسرعة، وبعدها ممكن ترجع للأقراص.
          - **Hyperglycemic crises**: محتاج حاجة تدخل الوريد وتتظبط بالساعة، والأقراص ما ينفعش فيها كده.
          - **Pregnancy**: الـ insulin ما بيعديش الـ placenta بكمية تأثر، وأغلب الأقراص مالهاش أمان كفاية للجنين.
          - **Liver or kidney disease**: الأقراص بتتكسّر في الكبد أو تخرج من الكلية، فبتتراكم وتعمل hypoglycemia أو أعراض جانبية.
          - **Stress** (ACS، ICU، عملية، عدوى، steroids): الـ cortisol والـ adrenaline بيرفعوا السكر فجأة، والاحتياج بيتغيّر كل يوم، فلازم دوا يتظبط يوم بيوم.
          - **Oral failure**: الـ beta cells ما بقتش بتطلّع كفاية، فلازم نديله الهرمون نفسه.
      - kind: check
        page: 130
        quote: "Initial stabilization of patients with severe hyperglycemia"
        question: "Which type 2 indication for insulin does this lecture add to the injectable therapy list?"
        options:
          - "Initial stabilization of severe hyperglycemia"
          - "Obesity with BMI over 35"
          - "Age over 65 years"
          - "Newly diagnosed type 2 DM with HbA1c 7.2%"
        answer: 0
        why:
          - "صح: ده البند الزيادة، والسبب إن الـ glucotoxicity بتتكسر بالـ insulin وبعدها ممكن ترجع للأقراص."
          - "الوزن مش من الدواعي، والـ insulin نفسه بيزوّد الوزن شوية."
          - "السن لوحده مش سبب، والكبير أكتر عرضة للـ hypoglycemia كمان."
          - "7.2% قريب من الهدف، والأقراص لسه ليها دور."
      - kind: reveal
        page: 130
        quote: "How do we define insulin therapy?\n      1. Starting insulin therapy\n      2. Dose titration to ensure that the patient\n      3. receives the maximum benefit from the prescribed treatment\n      4. Modification of an insulin regimen, e.g., adding or changing the therapy to\n         maintain glycaemic control"
        prompt: "الكتاب بيعرّف الـ insulin therapy بتلات حاجات. إيه هما، وليه البداية لوحدها مش كفاية؟"
        answer: |
          1. **Starting** insulin therapy
          2. **Dose titration** عشان العيان ياخد ==maximum benefit==
          3. **Modification** of the regimen (تضيف أو تغيّر) عشان الـ control يفضل

          البداية لوحدها مش كفاية لأن جرعة البداية (10 units مثلًا) معمولة **آمنة** مش **كافية**. لو ما عملتش titration، العيان هيفضل على جرعة صغيرة وسكره عالي، ويقول «الـ insulin ما نفعش».
      - kind: figure
        page: 131
        quote: "Type 2 diabetes is a progressive disease that often requires stepwise intensification of treatment to maintain good glycemic control."
        title: "الطريقة التقليدية: خطوة متأخرة كل مرة"
        alt: "A zigzag HbA1c line over years. Each step (diet, OAD monotherapy, up-titration, combination, basal insulin, multiple injections) is added only after HbA1c has climbed above the 8 to 9 percent band, then it falls and climbs again."
        caption: "الخط بيطلع فوق الـ goal لفترة طويلة قبل كل خطوة. ده الـ ==stepwise== المتأخر اللي المحاضرة عايزانا نتجنّبه."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 70 H320" class="fg-thin"/>
            <path d="M20 110 H320" class="fg-thin"/>
            <text x="2" y="74" class="t-sm t-mut">9%</text>
            <text x="2" y="114" class="t-sm t-mut">8%</text>
            <path d="M25 55 L50 112 L80 75 L100 115 L135 65 L155 105 L190 58 L210 100 L245 45 L268 112 L300 62 L318 100" class="fg-arrow-bad" fill="none" stroke-width="2.5"/>
            <text x="25" y="150" class="t-sm">Diet</text>
            <text x="68" y="150" class="t-sm">OAD</text>
            <text x="120" y="150" class="t-sm">↑dose</text>
            <text x="175" y="150" class="t-sm">combo</text>
            <text x="228" y="150" class="t-sm">+basal</text>
            <text x="282" y="150" class="t-sm">MDI</text>
            <text x="165" y="185" text-anchor="middle" class="t-sm t-mut">Duration of diabetes →</text>
          </svg>
      - kind: explain
        page: 131
        title: "إيه الغلط في الرسمة دي؟"
        quote: "Type 2 diabetes is a progressive disease that often requires stepwise intensification of treatment to maintain good glycemic control."
        text: |
          ده الـ **conventional stepwise** approach. بص على الخط: كل خطوة (من الـ diet لحد الـ multiple daily injections) **ما بتتاخدش** غير بعد ما الـ HbA1c يطلع فوق الـ goal ويقعد هناك شهور.

          يعني العيان بيقضي جزء كبير من عمر السكر وهو **فوق الهدف**. التفسير المقبول (مش في الكتاب): السنين دي هي اللي بتعمل الـ complications، لأن الـ microvascular damage بيتراكم مع مدة السكر العالي، مش مع الرقم في يوم واحد. عشان كده المحاضرة بتقول: لما الخطوة تبقى لازمة، ==ما تستناش==.
      - kind: explain
        page: 131
        title: "الحقيقتين"
        quote: "Most people with type 2 diabetes will, in time, need insulin therapy."
        text: |
          1. الـ type 2 ==progressive disease== ومحتاج **stepwise intensification**.
          2. ==Most people with type 2 diabetes will, in time, need insulin==.

          في الـ figure (Wright 2002)، اللي احتاجوا insulin زيادة طلعوا من حوالي **17%** في أول سنة لحوالي **53%** في السنة السادسة.

          ليه progressive؟ التفسير المقبول (مش في الكتاب): الـ **beta cell function** بتقل سنة ورا سنة مهما كان العلاج، فالأقراص اللي بتعتمد على إن البنكرياس لسه بيطلّع insulin بتفقد مفعولها مع الوقت. فالـ insulin مش «عقاب»، ده الخطوة الطبيعية لمرض ماشي لقدام.
      - kind: figure
        page: 131
        title: "رسمة الكتاب ص 131: مين احتاج insulin مع السنين؟"
        image: { file: dm/L11-insulin-need-years.webp, book: true }
        alt: "Book bar chart of the percentage of patients requiring additional insulin by years from study start: about 17% at year 1, 22% at year 2, 37% at year 3, 39% at year 4, 44% at year 5 and 53% at year 6."
        caption: "كل **عمود** سنة من بداية الدراسة. من **الشمال** (حوالي 17%) لـ **اليمين** (حوالي 53%) الأعمدة ==بتطول كل سنة==: بعد 6 سنين أكتر من النص محتاجين insulin."
      - kind: check
        page: 131
        quote: "Most people with type 2 diabetes will, in time, need insulin therapy."
        question: "In the book's figure (Wright 2002), roughly what share needed additional insulin by year 6?"
        options:
          - "About half (around 53%)"
          - "About 5%"
          - "About 17%"
          - "Almost all (over 90%)"
        answer: 0
        why:
          - "صح: من حوالي 17% في سنة 1 لحوالي 53% في سنة 6، وده Fact 2 بالأرقام."
          - "قليل جدًا: الرسمة بتطلع لفوق كل سنة."
          - "17% ده رقم أول سنة، مش السادسة."
          - "الرسمة ما وصلتش لكده في 6 سنين."
      - kind: try
        items: [dm.L11.001, dm.L11.003, dm.L11.006, dm.L11.007, dm.L11.008]
    recap:
      - "Insulin indications + **initial stabilization of severe hyperglycemia**؛ السبب المشترك: الـ insulin مالوش سقف ويتظبط بالوحدة."
      - "Insulin therapy = start + titration + modification؛ جرعة البداية آمنة مش كافية."
      - "Fact 1: progressive، stepwise. Fact 2: أغلبهم هيحتاجوا insulin (17% ← 53% في 6 سنين)."
      - "الـ stepwise المتأخر بيسيب العيان فوق الهدف سنين، فما تستناش."
    practice: [dm.L11.001, dm.L11.002, dm.L11.003, dm.L11.004, dm.L11.005, dm.L11.006, dm.L11.007, dm.L11.008]
