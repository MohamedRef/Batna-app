  # ---------- p254-255: primary causes ----------
  - id: dm.L20.013
    kind: enumerate
    topic: primary
    prompt: Mention the primary (genetic) causes of low HDL-C.
    points:
      - Tangier disease (ABCA1 defect)
      - Familial hypoalphalipoproteinemia (ApoA-I defect)
      - Increased CETP activity (CETP polymorphism)
      - Decreased LCAT activity (LCAT mutation)
    pass: 4
    src: { page: 254, quote: "Primary Causes of LOW HDL-c" }
    status: unverified
    tags: [high-yield]
  - id: dm.L20.014
    kind: card
    topic: primary
    front: Which gene is defective in Tangier disease, and what is the result?
    back: The ABCA1 transporter gene; cholesterol efflux falls and HDL-C is markedly reduced.
    src: { page: 254, quote: "ABC A1 Transporter gene defect." }
    status: unverified
    tags: [high-yield]
  - id: dm.L20.015
    kind: card
    topic: primary
    front: What is the inheritance of Tangier disease according to the book?
    back: Autosomal dominant.
    src: { page: 254, quote: "Autosomal dominant disorder." }
    status: unverified
    update:
      text: "Standard genetics references describe Tangier disease as autosomal recessive (both ABCA1 alleles); heterozygotes have about half-normal HDL-C. In the exam write the book's answer."
      ref: "OMIM #205400, Tangier disease"
  - id: dm.L20.016
    kind: enumerate
    topic: primary
    prompt: Mention the clinical features of Tangier disease.
    points:
      - Marked reduction in HDL-C
      - Enlarged orange tonsils
      - Hepatosplenomegaly
      - Peripheral neuropathy
      - Premature atherosclerotic vascular disease
      - Death from premature CAD
    pass: 4
    src: { page: 254, quote: "Cholesterol accumulation: Enlarged orange tonsils, hepatosplenomegaly, Peripheral neuropathy." }
    status: unverified
    tags: [high-yield]
  - id: dm.L20.017
    kind: card
    topic: primary
    front: Why are the tonsils orange and the liver and spleen enlarged in Tangier disease?
    back: Cholesterol accumulates in tissues because ABCA1-mediated efflux is defective.
    src: { page: 254, quote: "Cholesterol accumulation: Enlarged orange tonsils, hepatosplenomegaly, Peripheral neuropathy." }
    status: unverified
  - id: dm.L20.018
    kind: card
    topic: primary
    front: What is the cause of death in Tangier disease, according to the book?
    back: Premature coronary artery disease.
    src: { page: 254, quote: "Cause of Death: Premature CAD." }
    status: unverified
  - id: dm.L20.019
    kind: table
    topic: primary
    title: Primary causes of low HDL-C
    columns: [Disorder, Defect, Inheritance or note]
    rows:
      - [Tangier disease, ABCA1 transporter gene, "Autosomal dominant (book); orange tonsils, HSM, neuropathy"]
      - [Familial hypoalphalipoproteinemia, ApoA-I gene, "Autosomal dominant; premature CAD and strokes"]
      - [Increased CETP activity, CETP gene polymorphism, Premature CAD]
      - [Decreased LCAT activity, LCAT gene mutation, Premature CAD]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [1, 2]]
    src: { page: 254, quote: "Familial Hypoalphalipoproteinemia" }
    status: unverified
    tags: [high-yield]
  - id: dm.L20.020
    kind: card
    topic: primary
    front: What is the defect and inheritance of familial hypoalphalipoproteinemia?
    back: An ApoA-I gene defect, autosomal dominant; it causes premature CAD and strokes.
    src: { page: 254, quote: "Due to Apo AI Gene defect." }
    status: unverified
  - id: dm.L20.021
    kind: card
    topic: primary
    front: Why does increased CETP activity lower HDL-C?
    back: CETP moves cholesteryl ester out of HDL into ApoB lipoproteins; more activity strips HDL. It is due to CETP gene polymorphism and causes premature CAD.
    src: { page: 254, quote: "Due to Polymorphism of CETP Gene." }
    status: unverified
  - id: dm.L20.022
    kind: card
    topic: primary
    front: Which LCAT abnormality lowers HDL-C and what does it cause?
    back: Decreased LCAT activity from LCAT gene mutation; it causes premature CAD.
    src: { page: 255, quote: "Due to Mutation of LCAT Gene." }
    status: unverified
  - id: dm.L20.023
    kind: mcq
    topic: primary
    stem: "A 25-year-old man has enlarged orange tonsils, hepatosplenomegaly and a peripheral neuropathy. His HDL-C is almost undetectable. Which gene is defective?"
    options: [ABCA1, ApoA-I, LCAT, CETP, LDL receptor]
    answer: 0
    why:
      - "Correct: Tangier disease, ABCA1 defect, so cholesterol cannot leave cells and accumulates."
      - "ApoA-I defect (familial hypoalphalipoproteinemia) gives premature CAD and stroke without orange tonsils."
      - "LCAT defect lowers HDL but the book lists only premature CAD."
      - "CETP polymorphism with increased activity lowers HDL; no tissue accumulation."
      - "LDL receptor defects cause familial hypercholesterolemia with high LDL."
    src: { page: 254, quote: "Cholesterol accumulation: Enlarged orange tonsils, hepatosplenomegaly, Peripheral neuropathy." }
    status: unverified
