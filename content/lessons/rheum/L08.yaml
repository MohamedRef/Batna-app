        prompt: "ليه كل توصيات الـ Kawasaki بتلف حوالين الـ echo والـ coronary arteries؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ Kawasaki **medium vessel vasculitis** (الكتاب حاططه في الـ medium vessel)، والشرايين المتوسطة اللي بيحبها هي **الـ coronaries**. الالتهاب بيضعّف الجدار فيعمل ==coronary artery aneurysms==، وده ممكن يعمل **جلطة في القلب** في طفل.

          السخونية والطفح بيروحوا لوحدهم، بس الـ aneurysm ممكن يفضل. عشان كده الكتاب بيقول **echo with coronary measurements without delay** في الـ incomplete KD، وفي الطفل اللي عنده **shock** أو **MAS** مش مفسّر.
