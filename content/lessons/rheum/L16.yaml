          </svg>
      - kind: explain
        page: 259
        title: "ليه الـ osteoporosis جنب المفصل الأول؟"
        quote: "Early: soft tissue swelling.\n - Periarticular osteoporosis."
        text: |
          الـ X-ray بيحكي نفس قصة الـ pathology بالترتيب، يعني لو فاكر المراحل مش محتاج تحفظ:

          - **Soft tissue swelling**: الـ synovium الملتهب والـ effusion (أول مراحل ص 243).
          - ==Periarticular osteoporosis==: الـ **PGE2** اللي بيعمل demineralization (ص 242) شغال في المنطقة اللي حوالين المفصل. التفسير المقبول (مش في الكتاب): الدم الزايد حوالين المفصل الملتهب وقلة الحركة بيسحبوا الكالسيوم من العضم القريب الأول.
          - **Joint space narrowing**: الغضروف (اللي بيبان مسافة فاضية في الصورة) اتاكل بالـ metalloproteinases.
          - ==Marginal erosions==: التفسير المقبول (مش في الكتاب): الـ pannus بيبدأ من **حرف** المفصل، في الحتة اللي العضم فيها مكشوف ومفيش غضروف يحميه، فالعضة الأولى بتبان على الحافة.
          - **Subluxation** و **deformities**: الأربطة ارتخت.
      - kind: sort
        page: 259
        quote: "Early: soft tissue swelling.\n - Periarticular osteoporosis.\n More advanced:\n - Narrowing of joint spaces.\n - Marginal erosions.\n - Subluxations (malalignment).\n - Deformities."
