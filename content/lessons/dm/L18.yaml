        page: 238
        title: "الـ uricosurics والـ alkalinizers: يمشوا مع بعض ليه؟"
        quote: "Urine alkalinizing drugs"
        text: |
          - **Uricosurics** (probenecid، sulfinpyrazone، benzbromarone، lesinurad): بيمنعوا الكلية ترجّع الـ uric acid، فبيخرج أكتر في البول.
          - **Urine alkalinizers** (sodium bicarbonate، sodium citrate، acetazolamide).

          ليه الاتنين في نفس الصفحة؟ الكتاب بيقولك في ص 244 إن الحصوات بتعتمد على ==concentration== الـ uric acid في البول و ==acidity== البول. والـ uricosuric بيعلّي التركيز في البول.

          التفسير المقبول (مش في الكتاب): الـ uric acid بيدوب أحسن بكتير في البول القلوي، فالـ alkalinizer بيحمي الكلية من الحصوات وانت بتزوّد الإخراج. وعشان كده المية الكتير كمان.
