          - { text: "Carvedilol", bin: 2 }
        why: "الـ nitrates بتوسّع جوه الكبد، والـ TIPS بيعمل طريق جانبي حوالين الـ resistance. الـ beta-blockers والـ terlipressin والـ somatostatin بيضيّقوا الـ splanchnic bed فالـ inflow يقل. والـ carvedilol **β + α1** فبيعمل الاتنين."
      - kind: explain
        page: 47
        title: "الـ carvedilol: الدور التاني للي ما استجابش"
        text: |
          لو المريض عنده medium/large varices و **contraindications أو side-effects للـ beta-blockers**، الاختيارات اللي اتدرست: **no treatment، long-acting nitrates، EBL**.

          وعن الـ **carvedilol**:
          - بيعمل **decrease في الـ HVPG أكبر بكتير من الـ propranolol**.
          - **نسبة كبيرة من الـ non-responders للـ propranolol** بيحققوا **haemodynamic response** عليه، وده مرتبط بنتايج أحسن: **أقل variceal bleeding، أقل decompensation، وأقل death**.
          - السبب: **additional α-adrenergic blockade**.

          **Haemodynamic response** = **HVPG ينزل 20% أو أكتر** أو **يوصل أقل من 12 mmHg**.

          والكتاب بيقول: **NSBBs أو EBL** recommended للـ primary prophylaxis في مرضى الـ esophageal varices.
      - kind: aside
        tone: joke
        page: 47
        text: |
          الـ propranolol non-responder؟ ما تزعلش. 😄

          الـ **carvedilol** هو **الدور التاني**: نفس المادة (beta-blocker)، بس بميزة إضافية (α1-blockade) بتنجّح ناس كتير كانت ساقطة في الدور الأول.
      - kind: explain
        page: 48
        title: "طب ولو عنده ascites؟"
        text: |
          - **Long-term carvedilol therapy is not harmful** في الـ decompensated cirrhosis مع ascites.
          - في مرضى الـ ascites والـ varices: الـ carvedilol **safe and may improve survival**، **بشرط** ما يحصلش **impairment في الـ systemic haemodynamics أو renal dysfunction**.
          - والـ **safety surrogate** اللي تراقبه: **maintained arterial blood pressure**.
          - **Target dose = 12.5 mg/day.**
      - kind: aside
        tone: tip
        page: 48
        text: |
          رقم **12** بيظهر في المحاضرة كتير، ما تلخبطش:

          - **12 mmHg:** عتبة الـ rupture، والـ response لو الـ HVPG بقى **أقل من 12**.
          - **12.5 mg/day:** الـ target dose بتاع الـ carvedilol.
          - **12 hours:** الـ EBL في النزيف الحاد (الدرس الجاي).
