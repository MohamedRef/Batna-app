        text: |
          الـ **black** زي حباية فلفل أسود: صغيرة وناشفة.
          - بتيجي من bilirubin زيادة: chronic haemolysis، alcoholic liver disease، والسن.
          - وبتتكوّن جوّه المرارة.

          الـ **brown** زي طبق فول بالزيت: طري ومزيّت.
          - الزيت ده هو الـ fatty acids (Ca palmitate or stearate).
          - بتتعمل "في الطريق"، يعني في الـ ducts مش في المرارة.
          - ومعاها دايمًا infection أو inflammation أو ديدان.
      - kind: reveal
        page: 380
        quote: "Most gallstones form within the gallbladder, but brown pigment stones form in the ducts."
        prompt: "ليه الـ black بتتكوّن في المرارة، والـ brown في الـ ducts؟"
        answer: |
          الكتاب بيدّي المكان والظروف. الربط بينهم ده التفسير المقبول (مش في الكتاب):

          - **Black**: المشكلة مادة خام زيادة، bilirubin من الـ haemolysis. المرارة بتركّز الـ bile (صفحة 375)، فالـ bilirubin المركّز بيترسّب مع الكالسيوم جوّاها.
          - **Brown**: محتاجة **bacteria** أو ديدان. الـ bacteria بتفكّ الـ bilirubin conjugates والـ lecithin بإنزيماتها، فيطلع bilirubin و fatty acids يترسّبوا مع الكالسيوم. وده بالظبط الـ Ca palmitate or stearate اللي في الكتاب.
          - والـ infection دي بتحصل في **duct راكد**: ورا stricture أو مع liver flukes.

          علشان كده الـ brown ممكن تظهر بعد شيل المرارة، والـ black لأ.
