        why: "Low: ibuprofen، etodolac، meloxicam. Moderate: naproxen، diclofenac. High: piroxicam و indomethacin (الـ P و الـ I هما الخطر)."
      - kind: explain
        page: 263
        title: "الأعراض الجانبية للـ NSAIDs"
        quote: "Side effects of NSAIDs\n  Gastro intestinal toxicity\n    Gastric ulcer:\n      Increased risk of bleeding and perforation of gastric and duodenal ulcers.\n      Low - risk: Ibuprofen, Etodolac, Meloxicam.\n      High risk: Piroxicam, Indomethacin.\n      Moderate: Naproxen, Diclofenac.\n  Fluid retention → circulatory overload → compromise heart.\n  May affect renal function by suppressing vasodilator PGE2 or induce interstitial nephritis.\n  CNS: dizziness, headache, confusion.\n  Asthma and anaphylaxis are rare.\n  Prolonged treatment may hasten cartilage and bone damage."
        text: |
          1. **Gastrointestinal (GI)**: نزيف و perforation في الـ ulcers
          2. **Fluid retention** ← circulatory overload ← القلب يتعب
          3. **الكلى**: بيوقف الـ ==vasodilator Prostaglandin E2 (PGE2)== أو interstitial nephritis
          4. **Central nervous system (CNS)**: دوخة، صداع، confusion
          5. Asthma و anaphylaxis نادر
          6. الاستخدام الطويل ممكن يسرّع تلف الغضروف والعضم.

          أغلبها سببه إن الـ prostaglandins اللي بتحمي المعدة والكلى اتوقفت مع اللي بتعمل الالتهاب.
      - kind: reveal
        page: 263
        quote: "3- May affect renal function by suppressing vasodilator PGE2 or induce interstitial nephritis."
        prompt: "ليه الـ NSAIDs ممكن تتعب الكلى والقلب في عيان كبير؟"
        answer: |
          الكتاب بيدّيك السبب: بتوقف الـ ==vasodilator PGE2==. التفسير المقبول (مش في الكتاب): الـ PGE2 بيوسّع الشريان الداخل للـ glomerulus، وده مهم جدًا لما الكلية تكون تعبانة أو العيان ناشف أو عنده heart failure. توقفه، الدم الداخل للكلية يقل.

          ومن نفس الطريق تيجي الـ **fluid retention**: الكلية بتمسك ملح ومية ← **circulatory overload** ← القلب يتعب (البند التاني في الكتاب). وكمان ممكن **interstitial nephritis** (حساسية في الكلية).
