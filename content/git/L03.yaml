  - id: git.L03.127
    kind: mcq
    topic: dyspepsia
    stem: >-
      A 26-year-old woman has bothersome fullness after meals and cannot finish a normal plate on 4 days a week
      for the last 4 months; it started 8 months ago. EGD and H. pylori stool antigen are negative. Which
      first-line drug is most efficacious for her subtype?
    options:
      - A prokinetic such as itopride
      - A PPI
      - A tricyclic antidepressant
      - A fundic relaxor
      - Rifaximin
    answer: 0
    why:
      - "Correct: this is postprandial distress syndrome (PDS) (fullness and early satiation at least 3 days a week); prokinetics are ++ in PDS."
      - Proton pump inhibitors (PPIs) are ++ in epigastric pain syndrome (EPS) but only + in PDS.
      - TCAs are a second-line neuromodulator, ++ in EPS.
      - Fundic relaxors have only limited evidence (+) in PDS.
      - Rifaximin has limited evidence in both subtypes.
    src: { page: 105, quote: "B1a. Postprandial distress syndrome (PDS)\nDiagnostic criteria* - Must include one or both of the following at least 3 days a week:\n  1. Bothersome postprandial fullness (i.e., severe enough to impact on usual activities)\n  2. Bothersome early satiation (i.e., severe enough to prevent finishing a regular size meal)\n  3. No evidence of organic, systemic, or metabolic disease that is likely to explain the symptoms on routine investigations (including at upper endoscopy)\n*Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis\nSupportive criteria\n  1. Postprandial epigastric pain or burning, epigastric bloating, excessive belching, and nausea can also be present\n  2. Vomiting warrants consideration of another disorder\n  3. Heartburn is not a dyspeptic symptom but may often co-exist\n  4. Symptoms that are relieved by evacuation of feces or gas should generally not be considered as part of dyspepsia\n  5. Other individual digestive symptoms or groups of symptoms (e.g., from GERD and IBS) may co-exist with PDS" }
    status: unverified
  - id: git.L03.128
    kind: mcq
    topic: dyspepsia
    stem: >-
      A 35-year-old man has epigastric burning 2 days a week for 7 months, sometimes on fasting. No alarm features,
      H. pylori negative. Which subtype is this and what first-line drug class is most efficacious?
    options:
      - EPS; acid suppression
      - PDS; prokinetic
      - EPS; fundic relaxor
      - PDS; acid suppression
      - Biliary pain; ursodeoxycholic acid
    answer: 0
    why:
      - "Correct: epigastric pain or burning at least 1 day a week is epigastric pain syndrome (EPS), where acid suppression is ++."
      - Postprandial distress syndrome (PDS) is fullness or early satiation at least 3 days a week.
      - Fundic relaxors are not useful (-) in EPS.
      - He has EPS, not PDS.
      - Burning that occurs while fasting, without a steady 30-minute build-up, is not biliary pain.
    src: { page: 105, quote: "B1b. Epigastric pain syndrome (EPS)\nDiagnostic criteria* - Must include one or both of the following symptoms at least 1 day a week:\n  1. Bothersome epigastric pain (i.e., severe enough to impact on usual activities)\n  2. Bothersome epigastric burning (i.e., severe enough to impact on usual activities)\n  3. No evidence of organic, systemic, or metabolic disease that is likely to explain the symptoms on routine investigations (including at upper endoscopy).\n*Criteria fulfilled for the last 3 months with symptom onset at least 6 months prior to diagnosis\nSupportive criteria\n  1. Pain may be induced by ingestion of a meal, relieved by ingestion of a meal, or may occur while fasting\n  2. Postprandial epigastric bloating, belching, and nausea can also be present\n  3. Persistent vomiting likely suggests another disorder\n  4. Heartburn is not a dyspeptic symptom but may often co-exist\n  5. The pain does not fulfill biliary pain criteria\n  6. Symptoms that are relieved by evacuation of feces or gas generally should not be considered as part of dyspepsia\n  7. Other digestive symptoms (such as from GERD and IBS) may co-exist with EPS" }
    status: unverified
  - id: git.L03.129
    kind: mcq
    topic: dyspepsia
    stem: >-
      A 62-year-old man has 3 months of dyspepsia and has lost 5 kg. He has no dysphagia. What does the NICE box
      in the lecture recommend?
    options:
      - Urgent endoscopy
      - Empiric PPI for 4 weeks first
      - Test and treat for H. pylori, then review
      - Non-urgent endoscopy
      - Reassure and diagnose functional dyspepsia
    answer: 0
    why:
      - "Correct: aged 55 or more with weight loss and dyspepsia is a definite criterion for urgent endoscopy."
      - Alarm features come before an empiric trial.
      - Test and treat is for patients without alarm features.
      - Non-urgent endoscopy is for treatment-resistant dyspepsia at 55 or more without weight loss.
      - FD needs no structural disease; cancer must be excluded first.
    src: { page: 102, quote: "Box 1: Upper gastrointestinal alarm symptoms or signs* that are referral criteria for suspected gastro-oesophageal cancer according to NICE.\nDefinite referral criteria for urgent endoscopy to assess for gastro-oesophageal cancer\n  1. People of any age with dysphagia\n  2. People aged ≥55 years with weight loss and any of the following:\n    i. Dyspepsia.\n    ii. Upper abdominal pain.\n    iii. Reflux.\nProbable referral criteria for non-urgent endoscopy to assess for gastro-oesophageal cancer\n  1. People with haematemesis.\n  2. People aged ≥55 years with:\n    i. Treatment-resistant dyspepsia.\n    ii. Dyspepsia with raised platelet count or nausea or vomiting.\n    iii. Upper abdominal pain with low haemoglobin, raised platelet count or nausea or vomiting.\n    iv. Reflux with raised platelet count, or nausea or vomiting.\n    v. Nausea or vomiting with any of the following: weight loss, reflux, dyspepsia, or upper abdominal pain.\n*An upper abdominal mass felt to be consistent with stomach cancer is a probable referral criterion for an outpatient clinic appointment within 2 weeks." }
    status: unverified
  - id: git.L03.130
    kind: mcq
    topic: dyspepsia
    stem: >-
      A 24-year-old with suspected FD reports that her epigastric pain improves every time she opens her bowels and
      worsens with changes in stool form. What is the most likely diagnosis?
    options:
      - Irritable bowel syndrome
      - Epigastric pain syndrome
      - Postprandial distress syndrome
      - Functional heartburn
      - Biliary pain
    answer: 0
    why:
      - "Correct: pain related to bowel habit or relieved by defecation is likely IBS, not functional dyspepsia (FD)."
      - EPS symptoms are not relieved by passing stool.
      - PDS is fullness and early satiation.
      - Functional heartburn is retrosternal burning.
      - Biliary pain is not significantly (<20%) related to bowel movements.
    src: { page: 102, quote: "Symptoms compatible with FD\nFD-focused history taking and physical examination:\n  Assess for presence of alarm symptoms or signs\n  Date of onset and duration of symptoms of dyspepsia\n  Evidence of postinfection onset, or after acute or chronic stress or psychological trauma\n  Assess for presence of other upper gastrointestinal symptoms\n  If epigastric pain is present, confirm this is not related to a change in bowel habit or relieved by defaecation; this is likely to be IBS\n  Assess for presence of gastro-oesophageal reflux symptoms (heartburn or regurgitation); if present in isolation this is not FD\n  Assess for weight loss (amount lost and over what time period)\n  Elicit lower gastrointestinal symptoms for presence of other DGBI\n  Assess for presence of other functional non-gastrointestinal disorders\n  Family history of gastro-oesophageal cancer or coeliac disease\n  Medications (including NSAIDs and opioids)\nBaseline investigations:\n  Full blood count in patients aged ≥55 years and coeliac serology in patients with overlap of IBS-type symptoms\n  Breath or stool testing for H. pylori" }
    status: unverified
