          الدوا ممكن يعمل صورة شبه **chronic active hepatitis** توصل لحد **cirrhosis**، أو شكل من ==chronic autoimmune hepatitis==.

          الـ drug-induced AIH شبه الـ AIH العادي في كل حاجة تقريبًا: female، ANA و ASMA، plasma cells. الفرق الكبير إنه بيروح لما الدوا يقف.

          ملامحه في جدول الكتاب:
