  - id: res.L12.010
    kind: card
    topic: confounding
    front: "Define a confounding variable."
    back: "A factor (a variable) that causes distortion of the relationship between the outcome and the exposure of interest."
    src: { page: 8, quote: "1. Potential Confounding variables\nIs a factor (a variable ) causes distortion of the relationship between the outcome and the exposure of interest :\nMight alter the strength of an apparent relationship between the two variables (e.g. Incorrect odds ratio or relative risk)\nMight lead to incorrect association between E&D or disappearance of a real association between E&D." }
    status: unverified
    tags: [definition, high-yield]
  - id: res.L12.011
    kind: enumerate
    topic: confounding
    prompt: "Enumerate the 4 criteria (characteristics) of a confounding variable."
    points:
      - "It is associated with the outcome variable"
      - "It is related to the exposure variable"
      - "It does not lie in the chain of sequence (causal pathway) between the exposure and the outcome"
      - "It is differentially distributed in the two groups"
    pass: 4
    hook: "الـ confounder «ماسك الطرفين، بس مش في النص، ومتوزع مايل»: مرتبط بالـ outcome، ومرتبط بالـ exposure، مش في الـ chain بينهم، وdifferentially distributed في المجموعتين."
    src: { page: 9, quote: "1. Potential Confounding variables\nIt is associated with the outcome variable.\nIt is related to the exposure variable.\nIt does not lie in the chain of sequence between the exposure and outcome variable.\nIt is \"differentially\" distributed in the two groups." }
    status: unverified
    tags: [high-yield]
  - id: res.L12.012
    kind: mcq
    topic: confounding
    stem: "A variable lies on the causal pathway between the exposure and the outcome (exposure causes it, and it causes the outcome). Is it a confounder?"
    options:
      - "No, a confounder does not lie in the chain of sequence between exposure and outcome"
      - Yes, because it is associated with both the exposure and the outcome under study in the data
      - "Yes, if it is equally distributed in the two groups"
      - "Only in case-control studies"
    answer: 0
    why:
      - "Right: the third criterion says a confounder is not in the chain between exposure and outcome."
      - "Being associated with both is necessary but not enough; a step on the pathway is part of the effect itself."
      - "A confounder must be differentially (unequally) distributed between the groups."
      - "The criteria are the same in every design."
    src: { page: 9, quote: "1. Potential Confounding variables\nIt is associated with the outcome variable.\nIt is related to the exposure variable.\nIt does not lie in the chain of sequence between the exposure and outcome variable.\nIt is \"differentially\" distributed in the two groups." }
    status: unverified
    tags: [high-yield]
  - id: res.L12.013
    kind: enumerate
    topic: confounding
    prompt: "What can a confounding variable do to the exposure-disease (E&D) relationship?"
    points:
      - "Alter the strength of an apparent relationship (e.g. an incorrect odds ratio or relative risk)"
      - "Lead to an incorrect (spurious) association between E&D"
      - "Make a real association between E&D disappear"
    pass: 3
    hook: "الـ confounder يعمل في العلاقة 3 حاجات: «يكبّرها أو يصغّرها، يخترعها، أو يخفيها»."
    src: { page: 8, quote: "1. Potential Confounding variables\nIs a factor (a variable ) causes distortion of the relationship between the outcome and the exposure of interest :\nMight alter the strength of an apparent relationship between the two variables (e.g. Incorrect odds ratio or relative risk)\nMight lead to incorrect association between E&D or disappearance of a real association between E&D." }
    status: unverified
    tags: [high-yield]
  - id: res.L12.014
    kind: case
    topic: confounding
    stem: "A case-control study looks at birth order and Down syndrome. Mothers of high birth-order babies are usually older."
    steps:
      - question: "What is the confounder here?"
        options: ["Maternal age", "Birth order", "Down syndrome", "Gravidity"]
        answer: 0
        why: "Maternal age is related to birth order (high gravidity goes with advanced age) and is a known risk factor for Down syndrome."
      - question: "Why is advanced maternal age a risk factor on its own?"
        options:
          - "It is a known risk factor even if birth order is low"
          - "Only because it raises birth order"
          - "It is not a risk factor"
          - "Because it is on the causal pathway"
        answer: 0
        why: "The slide: advanced maternal age is a known risk factor even if birth order is low."
      - question: "When does maternal age distort the birth order - Down syndrome relation?"
        options:
          - "When the proportion with advanced age is higher among cases (with Down syndrome)"
          - "When age is equal in cases and controls"
          - "Never in a case-control study"
          - "Only if birth order is low"
        answer: 0
        why: "Unequal (differential) distribution of the confounder between cases and controls distorts the relation."
    src: { page: 12, quote: "Confounding factor\nBirth Order\nDown Syndrome\nMaternal Age\nMaternal age is correlated with birth order as usually high gravidity is associated with advanced maternal age\nadvanced maternal age is a known risk factor even if birth order is low\nIf the proportion of those with advanced age is more among cases (with Down syndrome) this leads to distortion of the relation between birth order and Down syndrome" }
    status: unverified
    tags: [high-yield]
  - id: res.L12.015
    kind: card
    topic: confounding
    front: "Why does smoking confound the relation between beta carotene intake and lung cancer?"
    back: "People who are less health conscious are more likely both to smoke and to neglect dietary advice. If a greater percentage smoke in the low beta carotene group than in the high group, smoking (a cause of lung cancer) will confound the association between beta carotene intake and lung cancer."
    src: { page: 13, quote: "Confounding\nBeta carotene intake\nlung cancer\nTobacco smoking\nBecause people who are less health conscious are more likely to smoke as well as to neglect dietary recommendations.\nIf a greater percentage of people smoke in the low beta carotene intake group than in the high beta carotene intake group\nThen smoking will confound the association between beta carotene intake and lung cancer" }
    status: unverified
