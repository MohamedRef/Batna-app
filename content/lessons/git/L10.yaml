          **b**: نفس الـ balloon في المنظار.
      - kind: reveal
        page: 279
        quote: "Laparoscopic Heller myotomy: surgical division of the muscle coat of the lower oesophagus sphincter. Usually performed in conjunction with an antireflux procedure (partial fundoplication); good to excellent results are reported in 62–100% of cases."
        prompt: "ليه الـ Heller myotomy بيتعمل معاه **partial fundoplication**؟ وليه partial مش كاملة؟"
        answer: |
          الكتاب: الـ Heller = قطع عضلة الـ LES، **usually** مع **antireflux procedure (partial fundoplication)**، والنتيجة good to excellent في **62–100%**.

          التفسير المقبول (مش في الكتاب): لما تقطع الـ LES انت شلت حاجز الـ reflux، فالحمض هيطلع والمريء مش بيعرف يرجّعه (مفيش peristalsis). فبتعمل fundoplication تعوّض الحاجز. وليه **partial**؟ لأن الكاملة (360°) هتقفل الباب تاني على مريء ما بيزقّش، فالـ dysphagia ترجع.
      - kind: aside
        tone: tip
        page: 279
        quote: "In patients with type III achalasia, the length of the myotomy can be adjusted to the length of the spastic segment in the distal esophagus as observed on HRM."
