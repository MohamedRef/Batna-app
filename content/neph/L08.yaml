  # ---------- p199: approach ----------
  - id: neph.L08.001
    kind: order
    topic: approach
    prompt: Put the algorithmic approach to renal biopsy interpretation of glomerular disease in order.
    steps:
      - Preliminary review of available clinical data
      - Light microscopic examination
      - Immunohistologic and electron microscopic examination
      - Integration of all pathological and clinical data
    src: { page: 199, quote: "An algorithmic approach to renal biopsy interpretation of glomerular diseases." }
    status: unverified
  - id: neph.L08.002
    kind: card
    topic: approach
    front: What is the book's warning to the pathologist who knows the clinical picture before reading the biopsy?
    back: Don't let what you expect from the clinical findings make you see what is not present in the specimen. It does happen.
    src: { page: 199, quote: "Don‘t let what is expected based on clinical findings to cause you to see what is not present in the specimen." }
    status: unverified
  - id: neph.L08.003
    kind: enumerate
    topic: approach
    prompt: Mention the clinical presentations of glomerular diseases.
    points:
