schema: batna.lesson/v1
lecture: res.L08
lessons:
  # ------------------------------------------------------------------
  - id: res.L08.lesson1
    title: "مسائل الـ rates: البسط مين والمقام مين؟"
    hook: "٤٠ عيانة سكر في يناير، ٢٠ جداد، ٥ ماتوا و٥ سافروا. احسب ٤ rates من غير ما تتلخبط."
    minutes: 8
    pages: [2, 53]
    topics: [rates]
    goals:
      - "تفرّق بين incidence و attack rate و point و period prevalence"
      - "تختار البسط والمقام الصح في كل rate"
      - "تحل مسألة الـ diabetes mellitus (DM) خطوة بخطوة"
    status: unverified
    steps:
      - kind: explain
        page: 4
        quote: "1. Incidence Rate = The no. of persons developing a disease (new cases) in a specific time & locality / Total population at risk * 1000"
        title: "Incidence: الحالات الجديدة بس"
        text: |
          ==Incidence rate== = عدد اللي **جالهم المرض جديد** (new cases) في وقت ومكان معيّنين ÷ **population at risk** × 1000.

          الكلمة المهمة في المقام: **at risk**. اللي عنده المرض أصلًا مش ممكن «يجيله» تاني، فبيطلع من المقام.

          و ==attack rate== نوع من الـ incidence، بنستخدمه لما فترة الخطر **محدودة** (وباء، ولادة) أو الخطر **مقصور على سن معيّن**.
      - kind: table
        page: 8
        quote: "Period Prevalence Rate = The no. of existing cases (old+new) of a specified disease during a given period of time / Population during the same period of time * 1000"
        title: "Point ضد period prevalence"
        columns: ["", "Point", "Period"]
        rows:
          - ["Numerator", "Old + new at one moment", "Old + new during the period"]
          - ["Divide by", "Population at that point", "Population during the period"]
        hide: [[0, 1], [0, 2]]
      - kind: figure
        page: 9
        quote: "Problem: On the first of January 2010, 1000 females above 40 years of age were screened for Diabetes Mellitus (DM) and 40 females were proved to be Diabetic. During the same year, 20 females developed Diabetes, 5 died and 5 migrated out of the country. Calculate the following rates:\n  Point prevalence of DM on the 1st of January 2010\n  Incidence of DM during the year 2010\n  Point prevalence of DM on the 31st of December 2010\n  Period prevalence in the year 2010"
        title: "مسألة الـ DM على خط الزمن"
        alt: "Timeline of 2010. On 1 January, 1000 women are screened and 40 are diabetic, leaving 960 at risk. During the year, 20 new diabetics appear, 5 diabetics die and 5 migrate. On 31 December, 50 diabetics remain out of 990 women."
        caption: "يناير: **40 من 1000**. خلال السنة: **+20 جداد**، و**-5 ماتوا**، و**-5 سافروا**. ديسمبر: **50 من 990**."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R08t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <path d="M20 110H312" class="fg-arrow" marker-end="url(#R08t)"/>
            <text x="20" y="132" class="t-sm t-mut">1 Jan</text>
            <text x="310" y="132" text-anchor="end" class="t-sm t-mut">31 Dec</text>
            <rect x="10" y="20" width="100" height="64" rx="6" class="fg-acc"/>
            <text x="60" y="42" text-anchor="middle" class="t-sm t-b">40 diabetic</text>
            <text x="60" y="60" text-anchor="middle" class="t-sm">of 1000</text>
            <text x="60" y="76" text-anchor="middle" class="t-sm t-mut">960 at risk</text>
            <rect x="120" y="20" width="90" height="64" rx="6" class="fg-thin"/>
            <text x="165" y="42" text-anchor="middle" class="t-sm t-good t-b">+20 new</text>
            <text x="165" y="60" text-anchor="middle" class="t-sm t-bad">-5 died</text>
            <text x="165" y="76" text-anchor="middle" class="t-sm t-bad">-5 migrated</text>
            <rect x="220" y="20" width="100" height="64" rx="6" class="fg-good"/>
            <text x="270" y="42" text-anchor="middle" class="t-sm t-b">50 diabetic</text>
            <text x="270" y="60" text-anchor="middle" class="t-sm">of 990</text>
            <rect x="10" y="150" width="150" height="34" rx="6" class="fg-box"/>
            <text x="85" y="171" text-anchor="middle" class="t-sm">Point prev Jan: 40/1000</text>
            <rect x="170" y="150" width="150" height="34" rx="6" class="fg-box"/>
            <text x="245" y="171" text-anchor="middle" class="t-sm">Incidence: 20/960</text>
            <rect x="10" y="190" width="150" height="34" rx="6" class="fg-box"/>
            <text x="85" y="211" text-anchor="middle" class="t-sm">Point prev Dec: 50/990</text>
            <rect x="170" y="190" width="150" height="34" rx="6" class="fg-box"/>
            <text x="245" y="211" text-anchor="middle" class="t-sm">Period prev: 60/1000</text>
          </svg>
      - kind: case
        page: 9
        quote: "Problem: On the first of January 2010, 1000 females above 40 years of age were screened for Diabetes Mellitus (DM) and 40 females were proved to be Diabetic. During the same year, 20 females developed Diabetes, 5 died and 5 migrated out of the country. Calculate the following rates:\n  Point prevalence of DM on the 1st of January 2010\n  Incidence of DM during the year 2010\n  Point prevalence of DM on the 31st of December 2010\n  Period prevalence in the year 2010"
        stem: "أول يناير 2010: اتعمل screening لـ 1000 ست فوق الأربعين، و 40 طلعوا عندهم السكر. خلال السنة: 20 جالهم السكر جديد، و 5 ماتوا، و 5 سافروا (اعتبرهم من الستات اللي عندهم سكر)."
        steps:
          - question: "Point prevalence on 1 January?"
            options: ["40 per 1000", "20 per 1000", "60 per 1000"]
            answer: 0
            why: "40 حالة موجودة ÷ 1000 × 1000."
          - question: "Incidence during 2010?"
            options: ["20/960 x 1000 = 20.8", "20/1000 x 1000 = 20", "60/1000 x 1000 = 60"]
            answer: 0
            why: "المقام **960** بس، لأن الـ 40 اللي عندهم سكر مش at risk."
          - question: "Point prevalence on 31 December?"
            options: ["50/990 x 1000 = 50.5", "60/1000 x 1000 = 60", "50/1000 x 1000 = 50"]
            answer: 0
            why: "الحالات: 40 + 20 - 5 - 5 = 50. والستات: 1000 - 10 = 990."
          - question: "Period prevalence in 2010?"
            options: ["60/1000 x 1000 = 60", "50/990 x 1000 = 50.5", "20/960 x 1000 = 20.8"]
            answer: 0
            why: "كل حالة كانت موجودة في أي وقت في السنة: القديم + الجديد = 60."
      - kind: aside
        tone: trap
        page: 9
        quote: "Problem: On the first of January 2010, 1000 females above 40 years of age were screened for Diabetes Mellitus (DM) and 40 females were proved to be Diabetic. During the same year, 20 females developed Diabetes, 5 died and 5 migrated out of the country. Calculate the following rates:\n  Point prevalence of DM on the 1st of January 2010\n  Incidence of DM during the year 2010\n  Point prevalence of DM on the 31st of December 2010\n  Period prevalence in the year 2010"
        text: |
          المسألة مش محلولة على الشريحة، فده حلّنا بافتراض إن اللي ماتوا وسافروا كانوا من الستات اللي عندهم سكر.

          لو الامتحان قال إنهم **مش** diabetic، الحالات في ديسمبر = 60 من 990. اقرا المسألة كويس واكتب افتراضك جنب الحل؛ ده بيجيب الدرجة حتى لو المصحح فهمها بشكل تاني.

          وفي الـ **period prevalence** بعض الكتب بتقسم على **mid-period population**. لو المسألة ادّتك الرقم ده، استخدمه.
      - kind: check
        page: 24
        quote: "A city has a population of 250,000. On the first of January 10,000 have disease X, which is incurable. During the year 1,000 new cases developed and 400 died from this disease. There are 2,500 deaths per year from all causes. The prevalence of this disease on the first of January is given by:\n  a. 400/250,000\n  b. 600/250,000\n  c. 1,000/250,000\n  d. 2,500/250,000\n  e. 10,000/250,000"
        question: "City of 250,000; on 1 January 10,000 have incurable disease X; 1,000 new cases and 400 deaths from it during the year. Prevalence on 1 January?"
        options: ["10,000/250,000", "1,000/250,000", "400/250,000", "600/250,000"]
        answer: 0
        why:
          - "صح: الـ point prevalence = كل الحالات الموجودة يوم 1 يناير."
          - "دي الحالات الجديدة، بسط الـ incidence."
          - "دي الوفيات من المرض."
          - "ده الفرق بين الجداد والوفيات؛ ملوش معنى هنا."
      - kind: check
        page: 25
        quote: "During the year 2015 a rural heath center delivered 2000 females. A 100 of the delivered females developed puerperal sepsis during their puerperium. Calculate a suitable morbidity rate.\n  a) Incidence rate\n  b) Point prevalence rate\n  c) Period prevalence rate\n  d) Non of the above"
        question: "2000 deliveries; 100 develop puerperal sepsis. Which morbidity rate suits?"
        options: ["Incidence rate", "Point prevalence rate", "Period prevalence rate", "None of the above"]
        answer: 3
        why:
          - "قريب، بس إجابة الشريحة d، لأن الاسم الأدق attack rate."
          - "دي حالات جديدة، مش موجودة في لحظة."
          - "الـ period prevalence فيها قديم + جديد."
          - "صح: الخطر محدود بالـ puerperium، فده **attack rate** = 100/2000 = 5%، ومش في الاختيارات."
      - kind: check
        page: 53
        quote: "In a survey of 10,000 IV drug users in town A, 1,000 turn out to be infected with hepatitis C. During one year of follow-up, 100 patients with hepatitis C infection died. Also during follow-up, 100 IV drug users acquire hepatitis C. Which of the following is the best estimate of the annual incidence of hepatitis C infection in IV drug users in town A?\n  a. 1,000/10,000\n  b. 1,100/10,000\n  c. 100/10,000\n  d. 100/9,000\n  e. 100/9,800"
        question: "10,000 IV drug users, 1,000 already have hepatitis C virus (HCV). In one year 100 infected die and 100 new users get HCV. Annual incidence?"
        options: ["100/9,000", "100/10,000", "1,100/10,000", "100/9,800"]
        answer: 0
        why:
          - "صح: new cases ÷ at risk = 100 ÷ (10,000 - 1,000)."
          - "الـ 1,000 المصابين مش at risk، يطلعوا من المقام."
          - "ده خلط بين القديم والجديد."
          - "الوفيات كانت من المصابين أصلًا، ملهاش دعوة بالـ at risk."
      - kind: mnemonic
        page: 26
        quote: "There were no new cases of Ebola virus in the United States from January 1, 1997 through January 1, 1998.\nWhich of the following epidemiologic terms does this statement describe?\n  a. Incidence\n  b. Lifetime expectancy\n  c. Lifetime prevalence\n  d. Period prevalence\n  e. Point prevalence"
        word: "NO"
        parts:
          - { key: "N", text: "New cases بس = incidence. «مفيش new cases للـ Ebola» = incidence صفر." }
          - { key: "O", text: "Old + new = prevalence: point لو لحظة، period لو فترة." }
        hook: "لو السؤال قال **new**، يبقى incidence. لو قال **existing** أو **current**، يبقى prevalence."
      - kind: try
        items: [res.L08.003, res.L08.004, res.L08.008]
    recap:
      - "Incidence = new cases ÷ population **at risk** (شيل اللي عندهم المرض من المقام)."
      - "Attack rate = incidence لفترة خطر محدودة، زي الـ puerperium أو وباء."
      - "Point prevalence = old + new في لحظة. Period prevalence = old + new خلال فترة."
      - "مسألة الـ DM: 40/1000، 20/960، 50/990، 60/1000."
    practice: [res.L08.001, res.L08.002, res.L08.003, res.L08.004, res.L08.005, res.L08.006, res.L08.007, res.L08.008]
  # ------------------------------------------------------------------
  - id: res.L08.lesson2
    title: "الـ 2x2 table: prevalence و odds ratio"
    hook: "نفس الجدول بأربع خانات، بس الحسبة بتتغير حسب الدراسة اتعملت إزاي."
    minutes: 8
    pages: [10, 56]
    topics: [measures]
    goals:
      - "تحسب الـ prevalence من cross-sectional"
      - "تحسب الـ exposure rate والـ odds ratio من case-control"
      - "تفسّر الـ odds ratio (OR) أكبر من 1 أو يساوي 1 أو أقل"
    status: unverified
    steps:
      - kind: explain
        page: 10
        quote: "Types of epidemiological Studies:\n  1- Observational studies:\n    A- Descriptive Studies: Case study; Case Series Study; Correlation Study; Cross Section Survey\n    B- Analytic Studies: Cohort Study; Case-control Study\n  2- Intervention Studies:\n    Preventive trials\n    Curative trials"
        title: "خريطة الدراسات"
        text: |
          - **Observational**:
            - **Descriptive**: case study، case series، correlation، و **cross-section survey**.
            - **Analytic**: ==cohort== و ==case-control==.
          - **Intervention**: preventive trials و curative trials.

          وكل دراسة ليها **مقياس**: الـ cross-sectional بيدّي **prevalence**، والـ case-control بيدّي **odds ratio**، والـ cohort بيدّي **relative risk**.
      - kind: figure
        page: 15
        quote: "Tabulation and Analysis\n| Exposure Status | Disease Status: Yes | Disease Status: No |\n|---|---|---|\n| Yes | a | b |\n| No | c | d |\n| Total | a+c | b+d |"
        title: "الجدول اللي هتشوفه في كل مسألة"
        alt: "Two by two table. Rows: exposed and not exposed. Columns: disease yes and disease no. Cells: a is exposed with disease, b is exposed without disease, c is unexposed with disease, d is unexposed without disease. Odds ratio equals a times d over b times c. Relative risk equals a over a plus b, divided by c over c plus d."
        caption: "**a** و **d** على قطر، و **b** و **c** على القطر التاني. الـ **OR = ad/bc**: ضرب القطرين."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <text x="155" y="20" text-anchor="middle" class="t-sm t-b">Disease +</text>
            <text x="255" y="20" text-anchor="middle" class="t-sm t-b">Disease -</text>
            <text x="50" y="62" text-anchor="middle" class="t-sm t-b">Exposed</text>
            <text x="50" y="132" text-anchor="middle" class="t-sm t-b">Not exposed</text>
            <rect x="105" y="30" width="100" height="60" rx="6" class="fg-good"/>
            <text x="155" y="68" text-anchor="middle" class="t-lg t-b">a</text>
            <rect x="205" y="30" width="100" height="60" rx="6" class="fg-thin"/>
            <text x="255" y="68" text-anchor="middle" class="t-lg t-b">b</text>
            <rect x="105" y="100" width="100" height="60" rx="6" class="fg-thin"/>
            <text x="155" y="138" text-anchor="middle" class="t-lg t-b">c</text>
            <rect x="205" y="100" width="100" height="60" rx="6" class="fg-good"/>
            <text x="255" y="138" text-anchor="middle" class="t-lg t-b">d</text>
            <path d="M140 50L270 145" class="fg-arrow-acc"/>
            <text x="165" y="192" text-anchor="middle" class="t-sm t-acc t-b">OR = ad / bc</text>
            <text x="165" y="214" text-anchor="middle" class="t-sm">RR = [a/(a+b)] / [c/(c+d)]</text>
            <text x="165" y="234" text-anchor="middle" class="t-sm t-mut">Prevalence = (a+c) / total</text>
          </svg>
      - kind: case
        page: 12
        quote: "| Smoking | CHD YES + | CHD NO - | Total |\n|---|---|---|---|\n| YES + (Exposed) | ++ a: 60 | -+ b: 20 | a+b: 80 |\n| NO - (Not exposed) | +- c: 40 | -- d: 80 | c+d: 120 |\n| Total | a+c: 100 | b+d: 100 | a+b+c+d: 200 |\nFind out different prevalence rates"
        stem: "Cross-sectional: 200 واحد. 80 smokers منهم 60 عندهم coronary heart disease (CHD). و 120 non-smokers منهم 40 عندهم CHD."
        steps:
          - question: "Prevalence of CHD among smokers?"
            options: ["75%", "60%", "30%"]
            answer: 0
            why: "a/(a+b) = 60/80 = 75%."
          - question: "Among non-smokers, and overall?"
            options: ["33.3% and 50%", "40% and 50%", "33.3% and 40%"]
            answer: 0
            why: "40/120 = 33.3%. والـ overall = 100/200 = 50%. وانتشار التدخين نفسه = 80/200 = 40%."
          - question: "Prevalence ratio, smokers vs non-smokers?"
            options: ["2.25", "6", "1.5"]
            answer: 0
            why: "75 ÷ 33.3 = 2.25. ده **prevalence** ratio مش relative risk (RR)، لأن الـ cross-sectional مفيهوش incidence."
      - kind: explain
        page: 16
        quote: "Interpretation of odds ratio (OR):\n  OR > 1 (x): cases are more exposed to the risk factor than controls by x times\n  OR = 1: the exposure has no relationship with the disease\n  OR < 1: the exposure is protective factor"
        title: "تفسير الـ odds ratio"
        text: |
          - **OR > 1** (مثلًا x): الـ **cases** اتعرضوا للـ risk factor أكتر من الـ **controls** بـ x مرة.
          - **OR = 1**: الـ exposure ==no relationship== بالمرض.
          - **OR < 1**: الـ exposure **protective factor**.

          خلي بالك من الصياغة: في الـ case-control بنقول «الـ cases **more exposed**»، مش «الـ exposed أكتر عرضة»؛ دي جملة الـ RR في الـ cohort.
      - kind: case
        page: 17
        quote: "| Smoking | CHD YES + (Cases) | CHD NO - (Control) |\n|---|---|---|\n| YES + (Exposed) | ++ a: 60 | -+ b: 20 |\n| NO - (Not exposed) | +- c: 40 | -- d: 80 |\n| Total | a+c: 100 | b+d: 100 |\nFind out exposure rate and odds ratio from above data"
        stem: "Case-control للـ CHD: من 100 case، 60 بيدخنوا. ومن 100 control، 20 بيدخنوا."
        steps:
          - question: "Exposure rates?"
            options: ["Cases 60%, controls 20%", "Cases 75%, controls 25%", "Cases 60%, controls 40%"]
            answer: 0
            why: "الـ exposure rate = المعرضين ÷ عدد الجروب. 60/100 و 20/100."
          - question: "Odds ratio?"
            options: ["6", "3", "2.25"]
            answer: 0
            why: "OR = ad/bc = (60 × 80) / (20 × 40) = 4800/800 = 6. والـ 3 ده غلطة شائعة: 60% ÷ 20%."
      - kind: check
        page: 56
        quote: "At a specific hospital, patients diagnosed with pancreatic carcinoma are asked about their current smoking status. At the same hospital, patients without pancreatic carcinoma are also asked about their current smoking status. The following table is constructed.\n| Smoking | Pancreatic cancer | No pancreatic cancer | Total |\n|---|---|---|---|\n| Exposed | 50 | 60 | 110 |\n| Not exposed | 40 | 80 | 120 |\n| Total | 90 | 140 | 230 |\nWhat is the odds ratio that a patient diagnosed with pancreatic cancer is a current smoker compared to a patient without pancreatic cancer?\n  a. (50/90)/(60/140)\n  b. (50/40)/(60/80)\n  c. (50/110)/(40/120)\n  d. (50/60)/(40/80)\n  e. (90/230)/(140/230)"
        question: "Pancreatic cancer cases: 50 smokers, 40 non-smokers. Controls: 60 smokers, 80 non-smokers. Odds ratio?"
        options: ["(50/40)/(60/80)", "(50/90)/(60/140)", "(50/110)/(40/120)", "(50/60)/(40/80)"]
        answer: 0
        why:
          - "صح: odds التدخين في الـ cases (50/40) ÷ odds في الـ controls (60/80) = 1.25/0.75 = 1.67."
          - "دي نسب، مش odds."
          - "دي risk حسب الـ exposure، ومينفعش في case-control."
          - "قسمة خانات غلط."
      - kind: aside
        tone: trap
        page: 56
        quote: "At a specific hospital, patients diagnosed with pancreatic carcinoma are asked about their current smoking status. At the same hospital, patients without pancreatic carcinoma are also asked about their current smoking status. The following table is constructed.\n| Smoking | Pancreatic cancer | No pancreatic cancer | Total |\n|---|---|---|---|\n| Exposed | 50 | 60 | 110 |\n| Not exposed | 40 | 80 | 120 |\n| Total | 90 | 140 | 230 |\nWhat is the odds ratio that a patient diagnosed with pancreatic cancer is a current smoker compared to a patient without pancreatic cancer?\n  a. (50/90)/(60/140)\n  b. (50/40)/(60/80)\n  c. (50/110)/(40/120)\n  d. (50/60)/(40/80)\n  e. (90/230)/(140/230)"
        text: |
          سؤال الـ pancreatic cancer والـ smoking: في الشريحة الأصلية الاختيارات **مطبوعة بالمقلوب**، من اليمين للشمال، فاختيار b شكله غلط.

          اقراه صح: odds التدخين في الـ cases على odds التدخين في الـ controls، والناتج **1.67**، وده اللي عليه الدايرة الحمرا. لو شفت سؤال زيه في الامتحان، احسب بنفسك الأول وبعدين دوّر على الرقم.
      - kind: check
        page: 55
        quote: "A study is performed in which mothers of babies born with neural tube defects are questioned about their acetaminophen consumption during the first trimester of pregnancy. At the same time, mothers of babies born without neural tube defect are also questioned about their consumption of acetaminophen during the first trimester. Which of the following measures of association is most likely to be reported by investigators?\n  a. Prevalence\n  b. Median survival\n  c. Relative risk\n  d. Odds ratio\n  e. Hazard ratio"
        question: "Mothers of babies with and without neural tube defects are asked about first-trimester acetaminophen. Which measure will be reported?"
        options: ["Odds ratio", "Relative risk", "Prevalence", "Hazard ratio"]
        answer: 0
        why:
          - "صح: الاختيار على أساس المرض = case-control = odds ratio."
          - "الـ RR محتاج incidence، والـ case-control مايقدرش يدّيها."
          - "الـ prevalence مش مقياس association."
          - "الـ hazard ratio من survival analysis."
      - kind: try
        items: [res.L08.011, res.L08.013, res.L08.010]
    recap:
      - "Cross-sectional = prevalence و prevalence ratio. Case-control = odds ratio. Cohort = relative risk."
      - "OR = ad/bc. الـ exposure rate = المعرضين ÷ الجروب."
      - "OR > 1: الـ cases أكتر تعرّض بـ x مرة. = 1: مفيش علاقة. < 1: protective."
      - "مسألة CHD: OR = 6. مسألة pancreas: OR = 1.67."
    practice: [res.L08.009, res.L08.010, res.L08.011, res.L08.012, res.L08.013, res.L08.017, res.L08.019, res.L08.020]
