        image: { file: neph/L02-statin-indications.webp, book: true }
        alt: "Book figure 'The KDIGO CKD lipid guidelines for management of hyperlipidemia': three red boxes with arrows to one box 'Treat with a statin'. Left: patient has CKD and DM and is age 18 years or more. Middle: patient has CKD, does not have DM, and is age 50 years or more. Right: patient has CKD, does not have DM, is age 18-49 years, and has known CAD, previous stroke, or a 10-year Framingham risk over 10%."
        caption: |
          3 صناديق حمرا فوق، وكلهم بيشاوروا على صندوق واحد تحت: **Treat with a statin**:

          - **شمال**: CKD **+ DM** وسنه **≥18**.
          - **النص**: CKD **من غير DM** وسنه **≥50**.
          - **يمين**: CKD من غير DM وسنه **18–49** بس عنده **CAD** معروف، أو **stroke** قبل كده، أو **Framingham risk >10%** في 10 سنين.

          يعني في الـ CKD ==السن والسكر هما المفتاح==: أي مريض CKD فوق 50 ياخد statin، وتحت 50 محتاج سبب تاني.
