            <rect x="120" y="162" width="80" height="16" class="fg-dot-bad"/>
            <text x="206" y="174" class="t-sm t-b">2</text>
            <text x="10" y="204" class="t-sm">Female condom</text>
            <rect x="120" y="192" width="170" height="16" class="fg-dot-bad"/>
            <text x="296" y="204" class="t-sm t-b">5</text>
          </svg>
      - kind: check
        page: 370
        quote: "Figure 2. Contraception options for women receiving maintenance dialysis."
        question: "A woman on peritoneal dialysis with lupus and positive antiphospholipid antibodies wants reliable contraception. Which is contraindicated?"
        options:
          - "Estrogen/progesterone combination"
          - "Male condom plus another method"
          - "Sterilization (no more children wanted)"
          - "Counseling about transplantation"
        answer: 0
        why:
          - "صح: الـ estrogen ممنوع مع الـ antiphospholipid syndrome (thrombosis)."
          - "مسموح لو مع وسيلة تانية."
          - "مسموح لو مش عايزة أطفال تاني، بس نزيف وعدوى أكتر."
          - "دي النصيحة الأهم أصلًا."
      - kind: explain
        page: 371
        title: "قبل وأثناء الحمل"
        quote: "Low-dose aspirin should be started by the end of the first trimester for all pregnant women receiving maintenance dialysis to reduce the risk of preeclampsia."
        text: |
          - Lupus **هادي 6 شهور** قبل الحمل.
          - ==Low-dose aspirin== قبل آخر الـ first trimester ضد الـ preeclampsia.
          - **BP <140/90**.
          - **Folic acid 5 mg**: الغسيل بيشيله.
          - **Heparin أو LMWH** (لحد 6 أسابيع بعد الولادة) لو nephrotic proteinuria، albumin واطي، APS، أو thrombosis قبل كده.
          - الأدوية الـ teratogenic تقف **6 أسابيع** قبل الحمل، أو فورًا لو الحمل جه فجأة.
      - kind: sort
        page: 374
        quote: "Figure 3: Safety of medications during pregnancy among patients receiving maintenance dialysis."
        prompt: "Fig 3: آمن ولا ممنوع في الحمل على الغسيل؟"
        bins: ["Safe", "Unsafe"]
        cards:
