        title: "Common regimens (book list)"
        columns: ["Regimen", "Brand", "Duration / genotypes"]
        rows:
          - ["Sofosbuvir + Velpatasvir", "Epclusa", "12 weeks, pangenotypic"]
          - ["Glecaprevir + Pibrentasvir", "Mavyret", "8–12 weeks, pangenotypic"]
          - ["Sofosbuvir + Ledipasvir", "Harvoni", "12 weeks, genotypes 1 and 4"]
          - ["Sofosbuvir + Daclatasvir", "", "Pangenotypic; special considerations for genotype 3"]
        hide: [[0, 2], [1, 2], [2, 2], [3, 2]]
      - kind: aside
        tone: trap
        page: 93
        text: |
          **Harvoni (Sofosbuvir + Ledipasvir)** هو الوحيد في القايمة اللي الكتاب كاتب جنبه **Genotypes 1, 4**، يعني **مش pangenotypic**.

          و **Mavyret** هو اللي مدته **8–12 أسبوع**. Epclusa و Harvoni **12 أسبوع**، و SOF + daclatasvir الكتاب ما حددلوش مدة.
