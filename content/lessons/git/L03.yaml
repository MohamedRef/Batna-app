      - kind: explain
        page: 105
        quote: "Vomiting warrants consideration of another disorder"
        title: "الـ supportive criteria: إيه اللي يبعدك عن الـ FD؟"
        text: |
          الكتاب في الـ supportive criteria:
          - **PDS**: ممكن يكون معاه ألم أو حرقان بعد الأكل، bloating، belching، و nausea. لكن ==vomiting warrants consideration of another disorder==.
          - **EPS**: الألم ممكن **يجي** مع الأكل، أو **يروح** مع الأكل، أو يحصل وهو صايم. و**persistent vomiting** بيقترح مرض تاني، والألم **مش** بيحقق معايير الـ **biliary pain**.
          - في الاتنين: الـ **heartburn مش dyspeptic symptom** بس ممكن يكون موجود، والأعراض اللي بتروح بـ **evacuation of feces or gas** ما تتحسبش dyspepsia، والـ GERD والـ IBS ممكن يكونوا مع الـ FD.

          التفسير المقبول (مش في الكتاب) لكل استبعاد:
          - الـ **vomiting**: في الـ FD الغثيان وارد، بس الترجيع المتكرر بيشاور على obstruction أو gastroparesis أو nausea and vomiting disorder.
          - الـ **biliary pain**: نوبات طويلة تحت الضلع اليمين وبتصحّي من النوم، ده مرارة مش معدة.
          - الـ **defaecation**: الألم اللي بيروح بالحمام مصدره القولون (IBS).

          يعني الـ supportive criteria مش بس بتأكد التشخيص، دي كمان بتقولك إمتى تقف وتدوّر على مرض تاني ليه علاج مختلف.
