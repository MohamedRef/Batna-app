        quote: "The key initiating event in atherogenesis is the retention of LDL-C and other cholesterol-rich Apo B-containing lipoproteins within the arterial wall"
        text: |
          الحدث اللي بيبدأ الـ ==atherogenesis== هو **retention** (احتباس) الـ LDL-C وباقي الـ **ApoB-containing lipoproteins** الغنية بالكوليسترول **جوّه جدار الشريان**.

          يعني مش مجرد إن الكوليسترول عالي في الدم: المشكلة إنه **دخل واتحبس**.
