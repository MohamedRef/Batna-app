  - id: hem.L03.lesson3
    title: "الـ minor والـ alpha والعلاج: من النقل للـ chelation"
    hook: "4 جينات α، وكل جين بيروح بيغيّر المرض. وفي الآخر، علاج الـ major محتاج دم وحديد يطلع وصبر."
    minutes: 9
    pages: [25, 29]
    topics: [beta-minor, alpha-thal, thal-rx]
    goals:
      - "تشخّص الـ β-thalassaemia minor من الـ indices"
      - "ترتّب الـ α-thalassaemias حسب عدد الجينات"
      - "تحفظ علاج الـ major: النقل، الـ chelators وآثارهم، الـ splenectomy، والـ HSCT"
    status: unverified
    steps:
      - kind: explain
        page: 26
        title: "β-thalassaemia minor"
        quote: "Haemoglobin level is either normal or mildly decreased and is generally not less than 9 gms/dl."
        text: |
          الـ ==carrier state== (heterozygous): anaemia قليلة أو مفيش، بس شكل الكرات متغير جدًا.

          - غالبًا **asymptomatic**، بس ممكن تظهر الأنيميا في **العدوى** أو **الحمل**.
          - Hb طبيعي أو قليل شوية، ==مش أقل من 9 g/dL== غالبًا.
          - **MCV و MCH قليلين**، بس ==RBC count عالي==.
          - الـ reticulocytes والـ bilirubin عاليين شوية.
      - kind: aside
        tone: exam
        page: 26
        quote: "Red cell count is increased."
        text: "الفخ المشهور: microcytic hypochromic زي الـ **iron deficiency**. الفرق في الكتاب: الـ thalassaemia minor ==RBC count عالي== والأنيميا خفيفة، أما نقص الحديد فالـ RBC count قليل. وطبعًا الـ ferritin هيفصل."
      - kind: explain
        page: 26
        title: "α-thalassaemia: عدّ الجينات"
        quote: "globin genes, two on each chromosome no. 16"
        text: |
          عندنا ==4 جينات α==: اتنين على كل **chromosome 16**. كل ما جين يروح، المرض يزيد:
          - **3 شغالين** (-α/αα): **silent**؛ indices طبيعية أو MCV/MCH أقل شوية.
          - **2 شغالين** (--/αα أو -α/-α): **α trait**؛ asymptomatic، anaemia خفيفة جدًا، microcytic.
          - **1 شغال** (--/-α): ==HbH disease==.
          - **0** (--/--): ==Hb Bart's hydrops fetalis==، قاتل.
