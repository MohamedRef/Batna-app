  # ------------------------------------------------------------------
  - id: neph.L08.lesson1
    title: "إزاي تقرا renal biopsy"
    hook: "الـ biopsy مش صورة واحدة: دي 4 compartments و3 ميكروسكوبات وكلمات ليها معنى بالمليمتر."
    minutes: 10
    pages: [198, 217]
    topics: [approach, classification, histology]
    goals:
      - "تعرف خطوات قراءة الـ biopsy وتربطها بالـ presentation"
      - "تحفظ التقسيم الـ pathogenetic الخماسي للـ GN والتقسيم الجديد للـ MPGN"
      - "تفهم الكلمات: focal/diffuse، segmental/global، endo/extracapillary، crescent"
    status: unverified
    steps:
      - kind: explain
        page: 199
        title: "المحاضرة دي شكلها مختلف"
        quote: "An algorithmic approach to renal biopsy interpretation of glomerular diseases."
        text: |
          المحاضرة دي كلها **cases** حقيقية من قسم الكلى في إسكندرية: عيان، labs، وبعدين **biopsy** بالـ LM والـ IH والـ EM، وسؤال «What is your diagnosis?».

          علشان تحلها لازم الأول تعرف ==algorithmic approach== للـ biopsy: تبدأ بالـ **clinical data**، بعدين **light microscopy**، بعدين **immunohistology** و **electron microscopy**، وفي الآخر **integration** لكل حاجة مع بعض.

          وتحذير الكتاب: ما تخليش اللي **expected based on clinical findings** يخليك تشوف حاجة مش موجودة في العينة. «It does happen!» زي ما تكون مستني صاحبك، فكل واحد لابس قميص أزرق تفتكره هو.
      - kind: order
        page: 199
        quote: "An algorithmic approach to renal biopsy interpretation of glomerular diseases."
        prompt: "رتّب خطوات قراءة الـ biopsy"
        steps:
          - "Preliminary review of clinical data"
          - "Light microscopy"
          - "Immunohistology and electron microscopy"
          - "Integration of all pathological and clinical data"
        why: "الكلينيك بيوجّه، الـ LM بيشوف الشكل، الـ IF والـ EM بيقولوا الـ deposits فين ونوعها إيه، والـ integration بيقفل التشخيص."
      - kind: explain
        page: 199
        title: "6 presentations"
        quote: "Clinical presentations of different glomerular diseases Asymptomatic. Macroscopic hematuria. Nephritic syndrome. Nephrotic syndrome. RPGN. Chronic GN."
        text: |
          الـ glomerular disease بييجي بواحدة من ستة: **asymptomatic**، **macroscopic hematuria**، **nephritic**، **nephrotic**، **RPGN**، و **chronic GN**.

          الـ ==nephrotic== = protein بيهرب من **podocyte** متعوّر (غالبًا من غير التهاب). الـ ==nephritic== = التهاب و cells بتكسّر الـ capillary، فـ **RBCs** بتنزل.
      - kind: sort
        page: 200
        quote: "Diseases typically causing nephrotic syndrome Focal segmental glomerulosclerosis (all variants). Idiopathic membranous glomerulopathy. Minimal change glomerulopathy."
        prompt: "Nephrotic ولا nephritic؟ (حسب لستة الكتاب)"
        bins: ["Nephrotic syndrome", "Hematuria and nephritis"]
        cards:
          - { text: "Minimal change glomerulopathy", bin: 0 }
          - { text: "Idiopathic membranous", bin: 0 }
          - { text: "Amyloidosis", bin: 0 }
          - { text: "Diabetic glomerulosclerosis", bin: 0 }
          - { text: "IgA nephropathy", bin: 1 }
          - { text: "Postinfectious GN", bin: 1 }
          - { text: "Alport syndrome", bin: 1 }
          - { text: "Thin basement membrane lesion", bin: 1 }
        why: "الأمراض اللي بتضرب الـ **podocyte** أو تملا الـ membrane بـ deposits (MCD، membranous، amyloid، diabetes) = nephrotic. الأمراض اللي فيها التهاب أو GBM ضعيف (IgA، PIGN، Alport، thin BM) = hematuria و nephritis."
      - kind: explain
        page: 201
        title: "أمراض مش GN بس بتعمل failure"
        quote: "Diseases other than GN that typically cause ARF Thrombotic microangiopathy (all types). Acute tubulointerstitial nephritis. Acute tubular necrosis."
        text: |
          **ARF** من غير GN: **TMA** بكل أنواعه، **acute TIN**، **ATN**، **atheroembolization**، ==light chain cast nephropathy==، و **cortical necrosis**.

          **CRF** من غير GN: **arterionephrosclerosis**، **chronic sclerosing GN**، **ESRD NOS**، و **chronic TIN**.
      - kind: mnemonic
        page: 201
        quote: "Pathogenetic classification of GN 1. Immune- complex GN. 2. Pauci-immune GN. 3. Anti-GBM GN. 4. Monoclonal Ig GN. 5. C3 glomerulo-pathy."
        word: "IPAMC"
        parts:
          - { key: "I", text: "Immune-complex GN: IgA, lupus, infection-related" }
          - { key: "P", text: "Pauci-immune GN: MPO-ANCA, PR3-ANCA, ANCA-negative" }
          - { key: "A", text: "Anti-GBM GN" }
          - { key: "M", text: "Monoclonal Ig GN: MIDD, immunotactoid" }
          - { key: "C", text: "C3 glomerulopathy" }
        hook: "«I Pay A Monthly Check»: خمس أنواع للـ GN حسب السبب، مش حسب الشكل."
      - kind: explain
        page: 202
        title: "كل نوع وليه score"
        quote: "Oxford/MEST scores for IgA nephropathy & ISN/RPS class for lupus nephritis"
        text: |
          - **IgA nephropathy** ← ==Oxford/MEST== score
          - **Lupus nephritis** ← ==ISN/RPS== class
          - **Pauci-immune GN** ← **Berden/EUVAS** class: focal، crescentic، mixed، أو sclerosing

          ولاحظ إن الـ **fibrillary GN** ممكن يبقى immune-complex (polyclonal Ig) أو monoclonal Ig GN.
      - kind: figure
        page: 203
        quote: "New classification of membranoproliferative GN MPGN Positive lIgGs+C3 Negative IgGs+ C,"
        title: "التقسيم الجديد للـ MPGN"
        alt: "Tree: MPGN splits by immunofluorescence. IgG plus C3 positive means immunoglobulin-mediated MPGN, from monoclonal gammopathies, autoimmune diseases or infections. IgG negative with C3 means complement-mediated MPGN, the C3 glomerulopathies: dense deposit disease and C3 GN."
        caption: "الـ IF هو اللي بيقسم: ==IgG + C3== = Ig-mediated، و **C3 لوحده** = complement-mediated (C3 glomerulopathy)."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="N8a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="115" y="8" width="100" height="34" rx="8" class="fg-ink"/>
            <text x="165" y="30" text-anchor="middle" class="t-b">MPGN</text>
            <path d="M140 42 L80 72" class="fg-arrow" marker-end="url(#N8a)"/>
            <path d="M190 42 L250 72" class="fg-arrow" marker-end="url(#N8a)"/>
            <rect x="10" y="76" width="145" height="50" rx="8" class="fg-acc"/>
            <text x="82" y="96" text-anchor="middle" class="t-b">IgG + C3</text>
            <text x="82" y="114" text-anchor="middle" class="t-sm">Ig-mediated</text>
            <rect x="175" y="76" width="145" height="50" rx="8" class="fg-bad"/>
            <text x="247" y="96" text-anchor="middle" class="t-b">C3 only</text>
            <text x="247" y="114" text-anchor="middle" class="t-sm">complement-mediated</text>
            <path d="M82 126v20" class="fg-arrow" marker-end="url(#N8a)"/>
            <path d="M247 126v20" class="fg-arrow" marker-end="url(#N8a)"/>
            <rect x="10" y="150" width="145" height="90" rx="8" class="fg-box"/>
            <text x="82" y="174" text-anchor="middle" class="t-sm">Monoclonal gammopathy</text>
            <text x="82" y="196" text-anchor="middle" class="t-sm">Autoimmune disease</text>
            <text x="82" y="218" text-anchor="middle" class="t-sm">Infection</text>
            <rect x="175" y="150" width="145" height="90" rx="8" class="fg-box"/>
            <text x="247" y="174" text-anchor="middle" class="t-sm t-b">C3 glomerulopathy</text>
            <text x="247" y="196" text-anchor="middle" class="t-sm">Dense deposit disease</text>
            <text x="247" y="218" text-anchor="middle" class="t-sm">C3 GN</text>
          </svg>
      - kind: explain
        page: 203
        title: "4 compartments"
        quote: "Glomeruli Evaluated ussue compartments iN Interstitium Q Arteries & arterioles"
        text: |
          أي biopsy بيتقرا على أربع حاجات: ==glomeruli==، **tubules**، **interstitium**، و **arteries & arterioles**.

          علشان كده التقرير دايمًا بيقول «Tubules showed… Interstitium showed… Arteries…». والـ **filtration barrier** نفسه 3 طبقات: **fenestrated endothelium**، **GBM**، و **podocyte foot processes**.
      - kind: table
        page: 212
        quote: "Focal Involving <50% of glomeruli. Diffuse Involving 50% or more of glomeruli."
        title: "قاموس الـ biopsy"
        columns: [Term, Meaning]
        rows:
          - ["Focal", "< 50% of glomeruli"]
          - ["Diffuse", "≥ 50% of glomeruli"]
          - ["Segmental", "Part of one tuft"]
          - ["Global", "All of the tuft"]
          - ["Mesangial hypercellularity", "≥ 4 nuclei in a peripheral mesangial segment"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
      - kind: figure
        page: 213
        quote: "Segmental Involving part of a glomerular tuft. Global Involving all of a glomerular tuft."
        title: "Focal/diffuse = عدد الـ glomeruli، segmental/global = جوّه الـ glomerulus"
        alt: "Two rows of four glomerulus circles. Top row: one of four glomeruli is shaded, labelled focal. Bottom row: three of four are shaded, labelled diffuse. Beside them, one glomerulus half shaded labelled segmental and one fully shaded labelled global."
        caption: "**Focal/diffuse** بتعد الـ glomeruli، و **segmental/global** بتبص جوّه الواحد. الاتنين مع بعض: «==focal segmental==»."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="20" class="t-b t-sm">Focal (&lt;50%)</text>
            <circle cx="30" cy="50" r="18" class="fg-bad"/><circle cx="75" cy="50" r="18" class="fg-box"/><circle cx="120" cy="50" r="18" class="fg-box"/><circle cx="165" cy="50" r="18" class="fg-box"/>
            <text x="10" y="100" class="t-b t-sm">Diffuse (≥50%)</text>
            <circle cx="30" cy="130" r="18" class="fg-bad"/><circle cx="75" cy="130" r="18" class="fg-bad"/><circle cx="120" cy="130" r="18" class="fg-bad"/><circle cx="165" cy="130" r="18" class="fg-box"/>
            <line x1="205" y1="10" x2="205" y2="220" class="fg-thin"/>
            <circle cx="265" cy="55" r="26" class="fg-box"/>
            <path d="M265 29 A26 26 0 0 1 291 55 L265 55 Z" class="fg-dot-bad"/>
            <text x="265" y="100" text-anchor="middle" class="t-sm t-b">Segmental</text>
            <circle cx="265" cy="150" r="26" class="fg-dot-bad"/>
            <text x="265" y="195" text-anchor="middle" class="t-sm t-b">Global</text>
            <text x="100" y="185" text-anchor="middle" class="t-sm t-mut">count glomeruli</text>
            <text x="265" y="215" text-anchor="middle" class="t-sm t-mut">look inside one</text>
          </svg>
      - kind: explain
        page: 215
        title: "جوّه ولا برّه الـ GBM؟"
        quote: "Increased cellularity internal to the GBM composed of leukocytes, endothelial cells and/or mesangial cells."
        text: |
          - ==Endocapillary hypercellularity==: cells زيادة **جوّه** الـ GBM (leukocytes، endothelial، mesangial).
          - **Extracapillary hypercellularity**: أكتر من طبقة cells في **Bowman's space** (parietal أو visceral epithelium، أو macrophages).
          - ==Crescent==: extracapillary hypercellularity، **ما عدا** الـ epithelial hyperplasia بتاعة الـ collapsing FSGS.
          - **Fibrinoid necrosis**: تدمير cells و matrix مع fibrin-rich acidophilic material.
      - kind: figure
        page: 216
        title: "شكل الـ crescent"
        image: { file: neph/L08-crescent.webp, book: true }
        alt: "H&E photomicrograph: a crescent of epithelial and inflammatory cells (outlined in yellow) fills Bowman's space around a collapsed glomerular tuft; arrows mark Bowman's capsule and the internal edge of the crescent."
        caption: "من الكتاب: tuft **collapsed** في النص، و ==crescent== من epithelial و mononuclear cells جوّه Bowman's capsule، وبينهم مسافة فاضية."
      - kind: explain
        page: 217
        title: "باقي القاموس"
        quote: "Combined capillary wall thickening and mesangial or endocapillary hypercellularity."
        text: |
          - **Sclerosis**: collagen matrix زيادة بيوسّع الـ mesangium أو يسد الـ capillaries أو يعمل adhesions لـ Bowman's capsule.
          - **Hyaline**: مادة **glassy acidophilic** برّه الخلايا.
          - ==Membranoproliferative==: **capillary wall thickening** + mesangial أو endocapillary hypercellularity.
          - **Lobular**: segments منتفخة ومفصولة بـ urinary space.
          - **Mesangiolysis**: الـ GBM ينفصل عن الـ mesangial matrix أو الـ matrix يتحلل.
      - kind: check
        page: 212
        quote: "Focal Involving <50% of glomeruli. Diffuse Involving 50% or more of glomeruli."
        question: "Crescents in 6 of 21 glomeruli, each involving part of the tuft. Describe it."
        options:
          - "Focal and segmental"
          - "Diffuse and global"
          - "Focal and global"
          - "Diffuse and segmental"
        answer: 0
        why:
          - "صح: 6 من 21 أقل من 50% (focal)، وجزء من الـ tuft (segmental)."
          - "Diffuse محتاج ≥50%، و global محتاج الـ tuft كله."
          - "Focal صح، بس الـ lesion في جزء من الـ tuft مش كله."
          - "أقل من نص الـ glomeruli، فمش diffuse."
      - kind: try
        items: [neph.L08.001, neph.L08.011, neph.L08.016, neph.L08.022, neph.L08.027]
    recap:
      - "اقرا الكلينيك، بعدين LM، بعدين IH و EM، وبعدين integrate."
      - "خمس أنواع GN: immune-complex، pauci-immune، anti-GBM، monoclonal Ig، C3."
      - "Focal/diffuse = عدد الـ glomeruli (50%)، segmental/global = جوّه الـ tuft."
      - "الـ crescent = extracapillary hypercellularity في Bowman's space."
    practice: [neph.L08.001, neph.L08.002, neph.L08.003, neph.L08.004, neph.L08.005, neph.L08.006, neph.L08.007, neph.L08.008, neph.L08.009, neph.L08.010, neph.L08.011, neph.L08.012, neph.L08.013, neph.L08.014, neph.L08.015, neph.L08.016, neph.L08.017, neph.L08.018, neph.L08.019, neph.L08.020, neph.L08.022, neph.L08.023, neph.L08.024, neph.L08.025, neph.L08.026, neph.L08.027, neph.L08.028, neph.L08.029, neph.L08.030, neph.L08.031, neph.L08.032, neph.L08.033, neph.L08.034, neph.L08.035, neph.L08.036]
