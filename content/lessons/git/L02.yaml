        text: |
          من الجدول: أعلى **sensitivity** هو ==NBI (97.9)==، وأعلى **specificity** هو ==magnification (95)==، وأقل sensitivity بفرق كبير ==I-Scan (28.5)==.

          وخلي بالك: الـ FICE في الكتاب ليه رقم واحد بس (90.9) تحت الـ specificity.
