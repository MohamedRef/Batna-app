        quote: "Interstitial inflammation involving >25% of nonsclerotic cortical parenchyma (i2 or i3) with severe tubulitis (t3) involving | or more tubules,"
        text: |
          الـ TCMR ليها سلّم: **I** = tubules (t2 أو t3)، **II** = **intima** للشريان (v1 أو v2)، **III** = **transmural** (v3).

          كل ما تدخل أعمق في الشريان، الـ grade يعلى. والـ **chronic active grade II** = ==chronic allograft arteriopathy==.
