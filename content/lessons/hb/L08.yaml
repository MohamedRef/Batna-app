  - id: hb.L08.lesson4
    title: "الـ cholestatic DILI والقنوات اللي بتختفي"
    hook: "Augmentin للبرد، وبعد 3 شهور هرش وصفرا. ده مش PBC... ده الدوا."
    minutes: 9
    pages: [134, 137]
    topics: [cholestatic]
    goals:
      - "تعرّف الـ drug cholestasis وتعرف الـ markers بتاعته"
      - "تفرّق الـ 5 أنواع بالـ ALP والـ transaminases والأمثلة"
      - "تعدّ أدوية الـ vanishing bile duct syndrome"
      - "تفرّق الـ DICC عن الـ PBC"
    status: unverified
    steps:
      - kind: explain
        page: 134
        title: "يعني إيه cholestatic injury؟"
        text: |
          - **Definition**: reduction in bile flow، يا بسبب reduced secretion من الخلية، يا بسبب obstruction في القنوات.
          - **Biochemically**: elevated ==ALP==، ==GGT==، و ==5' NT==.
          - **Clinical**: jaundice و pruritus.
          - **Course**: الـ acute illness بيروح لما الدوا يقف.

          الصفرا جاية من إن الـ bilirubin مش لاقي طريق يطلع، والهرش من تراكم مكوّنات الصفرا (التفسير المقبول).
      - kind: reveal
        page: 134
