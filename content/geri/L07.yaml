  # ---------- p111-112: functional assessment ----------
  - id: geri.L07.027
    kind: card
    topic: function
    front: What can functional assessment encompass?
    back: Mobility, activities of daily living, and the ability to use technologies for telecare; sensory loss also affects function.
    src: { page: 111, quote: "Functional assessment can encompass multiple factors like mobility, activities of daily living and the ability to interact with technologies used for telecare." }
    status: unverified
  - id: geri.L07.028
    kind: card
    topic: function
    front: Does poor vision or hearing make an older person non-functional?
    back: Not necessarily. They can be as functional as anyone else, but with very different coping strategies.
    src: { page: 111, quote: "someone with poor vision or hearing can still be as functional as anyone else but with very different coping strategies." }
    status: unverified
  - id: geri.L07.029
    kind: table
    topic: function
    title: What the speed of functional loss tells you
    columns: [Loss of function, Suggests, Leads to]
    rows:
      - [Sudden, Acute illness, Active investigation and management]
      - [Slow and sustained, Progressive decline, A more supportive care environment]
    blanks: [[0, 1], [0, 2], [1, 2]]
    src: { page: 111, quote: "Sudden loss in function may indicate acute illness and guide towards active investigation and management" }
    status: unverified
    tags: [high-yield]
  - id: geri.L07.030
    kind: enumerate
    topic: function
    prompt: What are the two components of a functional assessment?
    points:
      - What can and what does the person actually do?
      - How recently has it changed?
    pass: 2
    src: { page: 111, quote: "There are two components of a functional assessment: What can and what does the person actually do? How recently has it changed?" }
    status: unverified
  - id: geri.L07.031
    kind: mcq
    topic: function
    stem: A slow-sustained loss of function during functional assessment (ADL/IADL) may indicate the need for
    options:
      - Acute medical intervention
      - Supportive care environment
      - Increased medication dosage
      - Surgical referral
      - Genetic testing
    answer: 1
    why:
      - Acute intervention fits a sudden loss of function.
      - "Correct: a slow, sustained loss steers the patient to a more supportive care environment (p111)."
      - More medicine is not the response to a slow functional decline.
      - Surgery is not suggested by gradual loss of function.
      - Genetic testing has no place here.
    src: { page: 111, quote: "a slow-sustained loss of function may steer the patient to a more supportive care environment." }
    status: unverified
    tags: [book-question]
