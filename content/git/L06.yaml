  # ---------- cases ----------
  - id: git.L06.131
    kind: case
    topic: cd-clinical
    stem: A 23-year-old man who smokes has 4 months of right lower quadrant pain, nonbloody diarrhea, fever and 6 kg weight loss.
    steps:
      - reveal: "Tender RLQ mass. Hb 10.2 g/dL with low ferritin, platelets 520,000/µL, CRP high. Stool culture, C. difficile and ova/parasites negative."
        question: Most likely diagnosis?
        options: [Crohn disease of the terminal ileum, Ulcerative colitis, Irritable bowel syndrome, Microscopic colitis]
        answer: 0
        why: "Insidious RLQ pain, nonbloody diarrhea, fever, weight loss and a mass with iron deficiency and thrombocytosis fit terminal ileal Crohn (p208–210). UC gives bloody diarrhea with tenesmus. IBS has no fever, mass or anemia. Microscopic colitis gives watery diarrhea without a mass."
      - reveal: CT shows a thick terminal ileum with creeping fat.
        question: Colonoscopy will most likely show which pattern?
        options: [Ileal ulcers and skip lesions with rectal sparing, "Confluent inflammation from the anal verge", Normal mucosa, Pseudomembranes]
        answer: 0
        why: "Ileal ulceration and skip lesions with a spared rectum distinguish Crohn from UC (p211). Confluent inflammation from the anal verge is UC. Normal mucosa is microscopic colitis. Pseudomembranes are C. difficile."
      - reveal: Colonoscopy confirms ileal Crohn. He asks whether he should stop smoking.
        question: What do you tell him?
        options: ["Yes: smoking increases the risk of Crohn disease", "No: smoking protects against IBD", It makes no difference, "Only if he also has perianal disease"]
        answer: 0
        why: "Smoking increases the risk of Crohn disease and is protective only for UC (p207)."
    src: { page: 209, quote: "Signs of Crohn disease include abdominal tenderness, most classically in the right lower quadrant. An abdominal mass may be palpable." }
    status: unverified
  - id: git.L06.132
    kind: case
    topic: uc-clinical
    stem: A 28-year-old woman with known extensive UC has 9 bloody stools a day for 5 days and crampy pain.
    steps:
      - reveal: "Temperature 38.4 °C, pulse 112 bpm, abdomen tender and distended. Hb 9.1 g/dL, ESR 48 mm/h."
        question: How severe is this attack by the book's Table 4?
        options: [Severe, Moderate, Mild, Cannot grade without endoscopy]
        answer: 0
        why: "Six or more bloody stools plus systemic features (fever >37.8 °C, pulse ≥90, anaemia, ESR >30) is severe (p222). Moderate has no systemic features. Mild is ≤4 stools. The table needs no endoscopy."
      - reveal: A plain abdominal film shows a dilated transverse colon with loss of haustral markings.
        question: What does this show?
        options: [Toxic megacolon, Small bowel obstruction from a stricture, Normal gas pattern, Pneumatosis from early disease]
        answer: 0
        why: "A dilated colon with loss of haustra is toxic megacolon (p214). Obstruction is uncommon in UC and suggests malignancy. This is not normal. Pneumatosis is a late sign of ischemia and infarction, not early disease."
      - question: Which plain film finding would most strongly signal that the bowel is infarcting?
        options: [Intestinal pneumatosis, Thumbprinting, Granular shortened colon, Wall thickness under 3 mm]
        answer: 0
        why: "Pneumatosis is a late finding of ischemia and infarction (p214). Thumbprinting means wall edema in severe colitis. A granular shortened colon is the chronic barium picture. Under 3 mm is a normal colon wall on CT."
      - reveal: She asks about her long-term risks once this settles. Her disease began 9 years ago and she has PSC.
        question: What surveillance does the lecture advise?
        options: [Colonoscopy now and every 1–2 years, Colonoscopy only after 20 years, No surveillance because PSC protects, Yearly CEA only]
        answer: 0
        why: "Extensive colitis for over 8 years with PSC means high CRC risk: screen after 8 years, then every 1–2 years (p216)."
    src: { page: 214, quote: "Severe abdominal pain or fever suggests fulminant colitis or toxic megacolon." }
    status: unverified
  - id: git.L06.133
    kind: case
    topic: cd-complications
    stem: A 40-year-old man had two ileal resections for Crohn disease, about 120 cm in total, including the ileocecal valve.
    steps:
      - reveal: He has bulky, greasy stools and weight loss.
        question: What is the main mechanism of his steatorrhea?
        options: [Depleted bile salt pool causing fat maldigestion, Bile salts irritating the colon, Pancreatic insufficiency, Lactase deficiency]
        answer: 0
        why: "More than 100 cm of ileum lost depletes the bile salt pool, so fat is maldigested (p212). Colonic bile salt irritation is the 50–100 cm picture. The lecture does not link this to the pancreas. Lactase deficiency gives watery stools."
      - reveal: He also has bloating, and the ileocecal valve is gone.
        question: Which added complication is likely?
        options: [Small bowel bacterial overgrowth, Pouchitis, Microscopic colitis, Toxic megacolon]
        answer: 0
        why: "Bacterial overgrowth complicates Crohn disease after ileocecal valve resection or with strictures (p212). Pouchitis needs an IPAA. Microscopic colitis and toxic megacolon do not follow from resection."
      - reveal: He presents with renal colic; the stone is calcium oxalate.
        question: Why did he form this stone?
        options: [Calcium binds unabsorbed fat so more oxalate is absorbed, He drinks too much milk, Vitamin D deficiency, Uric acid overload from cell turnover]
        answer: 0
        why: "Unabsorbed fatty acids bind calcium, leaving oxalate free to be absorbed and excreted, so calcium oxalate stones form (p212)."
    src: { page: 212, quote: "Malabsorption of fatty acids predisposes patients with Crohn disease to renal calculi." }
    status: unverified
