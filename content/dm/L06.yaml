  - id: dm.L06.009
    kind: mcq
    topic: pathway
    stem: A 57-year-old man with long-standing diabetes has dry, cracked skin on both heels, with a fissure that has become an ulcer. His feet barely sweat. Which arm of neuropathy explains this ulcer?
    options: [Autonomic, Motor, Sensory, Ischemic, Proximal motor]
    answer: 0
    why:
      - "Correct: autonomic neuropathy → reduced sweating → dry skin → cracks and fissures → ulcer (p67)."
      - Motor neuropathy acts through muscle imbalance, deformity and high pressure points.
      - Sensory neuropathy acts through loss of protective sensation and unnoticed trauma.
      - Ischemia belongs to the PVD arm, not neuropathy.
      - Proximal motor neuropathy is not on the pathway and does not cause dry skin.
    src: { page: 67, quote: "Reduced Sweating" }
    status: unverified
