  # ------------------------------------------------------------------
  - id: hb.L14.lesson3
    title: "الدم، الـ sepsis، الـ IBD، والـ granulomas"
    hook: "ALT بـ 4000 بعد shock، bilirubin بيطلع ببطء في الـ ICU، و granuloma بتقولك «I'm fine» والـ ALP عالي."
    minutes: 10
    pages: [260, 266]
    topics: [ctd, heme, sepsis, ibd, granuloma]
    goals:
      - "تعرف إزاي أمراض الدم وعلاجها بيأذوا الكبد"
      - "تفرّق hypoxic hepatitis عن cholestatic liver dysfunction في الـ ICU"
      - "تعرف الكبد في الـ IBD"
      - "تعدّ الـ 5 categories بتوع الـ hepatic granulomas"
    status: unverified
    steps:
      - kind: explain
        page: 261
        title: "الكبد في أمراض الدم"
        text: |
          **الـ coagulation في الـ liver failure** متلخبطة في الاتجاهين:

          - ==Bleeding risk==: من الـ hemodynamic changes (portal pressure و venous congestion).
          - ==Thrombotic risk==: من تغيّرات الـ coagulation system نفسه.

          أمراض الدم بتبان في الكبد بـ 3 طرق: LFTs بايظة، أو imaging بايظ، أو أعراض كبدية.

          **Hematologic malignancies**: الخلايا الخبيثة بتدخل الكبد. النتيجة LFTs بايظة مع hepatosplenomegaly أو nodules، وممكن fulminant failure.

          العلاج نفسه بيأذي:

          - **Iron overload**: من نقل الدم المتكرر في الـ anemias.
          - ==HBV reactivation==: مع الـ chemo أو الـ immunosuppression. ممكن يموّت، بس ممكن نمنعه.
          - **VOD (SOS)**: بعد الـ hematopoietic cell transplant.

          التشخيص:

          - الـ **ALP** والـ **LDH** بيعلوا كتير، بس الـ imaging (scintigraphy و US و CT و MRI) ممكن ما يبيّنش حاجة.
          - في الـ lymphoma فيه sinusoidal infiltration و granulomas و nodules، فممكن تحتاج **peritoneoscopy**.
          - **Liver involvement** بيتفترض لو: كبد كبير، مع ALP أو LDH عالي، مع CRP أو ESR عالي.
      - kind: explain
        page: 262
        title: "Extramedullary hemopoiesis"
        text: |
          ==Extramedullary hemopoiesis (EMH)== يعني الكبد بيعمل دم:

          - في الجنين والـ neonate: ده طبيعي.
          - في الكبير: ده pathological.

          الأسباب:

          - **Aplastic anemia**.
          - **Marrow replacement**: myeloproliferative disease، و osteomyelofibrosis، و myelomatosis، و bone marrow carcinomatosis، و osteopetrosis.

          الصورة:

          - Hepatomegaly و massive splenomegaly.
          - **Portal hypertension** مع ascites.
          - الـ **NRH** بعد انسداد فروع الـ portal vein جوه الكبد بتزوّد الـ portal hypertension.
          - في الصور: diffuse infiltration أو focal mass-like lesions.
      - kind: aside
        tone: analogy
        page: 262
        text: |
          الـ EMH زي مصنع اتقفل (النخاع) فالعمّال راحوا يشتغلوا في بيت العيلة القديم (الكبد والطحال، اللي كانوا بيعملوا دم أيام الجنين). البيت يتزحم ويكبر، والدوشة توصل للـ portal vein.
      - kind: explain
        page: 262
        title: "الـ sepsis والـ ICU"
        text: |
          الـ sepsis بيأذي الكبد مباشرة بـ 3 طرق، أو بمزيج منهم:

          - **Infection** نفسها.
          - **Circulating toxins** والـ inflammatory/immune response.
          - **Ischemia** من الـ septic shock.

          والـ infective lesions: abscess، و cholangitis، و **pylephlebitis**، و vasculitis، و granulomas، و tissue necrosis.

          **دور الكبد في الـ critical illness**:

          - **Clearance**: بينضّف الدم من الميكروبات والـ toxins.
          - **Acute phase reaction**: بيطلّع cytokines و mediators و coagulation factors.

          ولو الـ clearance ضعفت، الـ endotoxin بيعدّي (spillover) ويساعد في الـ **multiple organ failure**.

          الـ liver dysfunction الجديد في الـ ICU نوعين: ==hypoxic (ischemic) hepatitis== و ==cholestatic liver dysfunction==.
      - kind: table
        page: 263
        title: "HH ولا CLD؟"
        columns: ["", "Hypoxic hepatitis (HH)", "Cholestatic liver dysfunction (CLD)"]
        rows:
          - ["Setting", "Cardiac, respiratory or circulatory failure", "Critical illness, days after ICU admission"]
          - ["Onset", "Abrupt", "Insidious, progressive"]
          - ["Labs", "Transaminases ≥ 20× ULN, very short-lived", "Bilirubin > 2–3 mg/dL; ALP and GGT 2–3× normal"]
          - ["Then", "Coagulopathy; jaundice in a minority = worse outcome", "Rising bilirubin, ALP, GGT"]
          - ["Key step", "Exclude viral and drug-induced necrosis", "Look for sepsis, parenteral nutrition, hyperglycemia, drugs"]
        hide: [[1, 1], [1, 2], [2, 1], [2, 2]]
      - kind: figure
        page: 263
        title: "شكل الرقمين على مدار أيام الـ ICU"
        alt: "Two stacked graphs against ICU days. Hypoxic hepatitis: transaminases shoot up abruptly to at least 20 times the upper limit of normal on day 1 to 2 and fall within a few days. Cholestatic liver dysfunction: bilirubin, ALP and GGT stay flat for the first days and then rise slowly and progressively from about day 4 onwards."
        caption: "فوق: الـ HH **spike** مفاجئ وقصير. تحت: الـ CLD طلوع بطيء بيبدأ بعد كام يوم. الرسمة توضيحية، مش أرقام مريض."
        svg: |
          <svg viewBox="0 0 330 420" xmlns="http://www.w3.org/2000/svg">
            <text x="14" y="20" class="t-b t-bad">Hypoxic hepatitis</text>
            <path d="M40 180V36M40 180h280" class="fg-ink"/>
            <path d="M44 120h240" class="fg-thin"/>
            <text x="316" y="114" text-anchor="end" class="t-sm t-mut">20× ULN</text>
            <path d="M40 176C60 176 66 40 84 40S110 150 140 166S220 174 300 176" class="fg-arrow-bad"/>
            <text x="96" y="52" class="t-sm t-bad t-b">AST/ALT spike</text>
            <text x="150" y="150" class="t-sm">falls in days</text>
            <text x="40" y="198" class="t-sm t-mut">day 1</text>
            <text x="280" y="198" class="t-sm t-mut">ICU days</text>
            <g transform="translate(0,210)">
              <text x="14" y="20" class="t-b t-acc">Cholestatic liver dysfunction</text>
              <path d="M40 180V36M40 180h280" class="fg-ink"/>
              <path d="M40 174C100 174 120 172 150 160S240 90 300 56" class="fg-arrow-acc"/>
              <text x="52" y="60" class="t-sm t-acc t-b">Bilirubin, ALP, GGT</text>
              <text x="52" y="76" class="t-sm">slow, progressive rise</text>
              <text x="40" y="198" class="t-sm t-mut">day 1</text>
              <text x="280" y="198" class="t-sm t-mut">ICU days</text>
            </g>
          </svg>
      - kind: check
        page: 263
        question: "A 65-year-old in cardiogenic shock after an MI has ALT 4200 U/L on day 2. Viral markers are negative and no new drugs were given. What is the diagnosis?"
        options:
          - "Hypoxic (ischemic) hepatitis"
          - "Cholestatic liver dysfunction of critical illness"
          - "Acute viral hepatitis"
          - "Congestive hepatopathy"
        answer: 0
        why:
          - "صح: الـ triad: **circulatory failure** + ارتفاع مفاجئ ≥ 20× ULN + استبعاد viral و drugs."
          - "الـ CLD **insidious** وأيام بعد الدخول، والـ pattern **cholestatic**."
          - "الـ viral markers سالبة، والاستبعاد جزء من الـ triad."
          - "الـ congestive pattern **cholestatic** والـ transaminases normal أو moderate."
      - kind: explain
        page: 264
        title: "ليه الـ sepsis بيعمل cholestasis؟"
        text: |
          - الـ **CLD** سببه إن الـ critical illness بيلخبط الـ hepatobiliary transport.
          - **Risk factors**:
            - **Sepsis**: عن طريق الـ endotoxemia والـ cytokines.
            - ==Parenteral nutrition==.
            - **Hyperglycemia**.
            - Drug-induced cholestasis فوق كل ده.
          - الـ cholestasis بتحصل مع **gram-negative** (E. coli و Klebsiella) أو **gram-positive** (S. aureus). يعني نوع البكتيريا مش هو الفيصل.
          - **الـ mechanism**: الـ ==TNF-α== والـ IL-6 والـ **nitric oxide** بيمنعوا الـ canalicular excretion للـ conjugated bilirubin.

          مثال: مريض pneumonia في الـ ICU، على TPN، والسكر عالي. يوم 6 الـ bilirubin بيطلع بالراحة. ده CLD، مش hypoxic hepatitis.
      - kind: explain
        page: 264
        title: "الكبد في الـ IBD"
        text: |
          الأمراض الكبدية مع الـ UC والـ Crohn's:

          - ==Fatty liver==.
          - ==Primary sclerosing cholangitis==.
          - **Chronic hepatitis**.
          - **Cirrhosis**.
          - **Hepatobiliary disease**.

          **Steatosis**:

          - أشهر histology، في لحد 50%.
          - الشديدة منها سببها **malnutrition** و **anemia** و **toxemia**.
          - ممكن تفضل حتى بعد الـ colectomy.
          - بتظهر كمان في مرضى الـ ileostomy.
          - بتزيد مع الـ IV high-calorie nutrition.

          علشان كده: تجنّب الـ long-term high-calorie IV infusion، وتجنّب الـ high-fat diet.
      - kind: check
        page: 264
        question: "What is the most common liver histological abnormality in inflammatory bowel disease?"
        options:
          - "Steatosis"
          - "Primary sclerosing cholangitis"
          - "Granulomatous hepatitis"
          - "Cirrhosis"
        answer: 0
        why:
          - "صح: الـ **steatosis** لحد 50%، من الـ malnutrition والـ anemia والـ toxemia."
          - "الـ PSC أشهر **association** مهم، بس مش أشهر histology."
          - "الـ granulomas مش في قايمة أمراض الـ IBD في الكتاب."
          - "الـ cirrhosis في القايمة، بس أقل بكتير."
      - kind: mnemonic
        page: 265
        word: "IMFIN"
        parts:
          - { key: "I", text: "Immunological: sarcoidosis, PBC, giant cell arteritis, Wegener's, chronic granulomatous disease, allergic granulomatosis" }
          - { key: "M", text: "Medications: penicillins, diphenylhydantoin, allopurinol" }
          - { key: "F", text: "Foreign body: beryllium, suture material" }
          - { key: "I", text: "Infectious: viral (HCV, CMV, EBV, Q fever, syphilis), bacterial (TB, MAI in HIV, brucella, typhoid, Whipple's, leprosy, cat-scratch, tularaemia), fungal (histoplasmosis, blastomycosis, coccidioidomycosis, candidiasis), parasitic (toxoplasma, schistosoma)" }
          - { key: "N", text: "Neoplastic: Hodgkin's disease, renal cell carcinoma" }
        hook: |
          الـ granuloma دايمًا بتقول «**I'M FINe**»... بس الـ **ALP** عالي (أكثر test بيبوظ باستمرار) والكبد كبير. الـ 5 حروف = الـ 5 etiological categories.
      - kind: sort
        page: 265
        prompt: "حط كل سبب granuloma في الـ category بتاعته:"
        bins: ["Immunological", "Infectious", "Medication", "Neoplastic / foreign body"]
        cards:
          - { text: "Sarcoidosis", bin: 0 }
          - { text: "Primary biliary cholangitis", bin: 0 }
          - { text: "Brucellosis", bin: 1 }
          - { text: "Schistosomiasis", bin: 1 }
          - { text: "Q fever", bin: 1 }
          - { text: "Allopurinol", bin: 2 }
          - { text: "Diphenylhydantoin", bin: 2 }
          - { text: "Hodgkin's disease", bin: 3 }
          - { text: "Beryllium", bin: 3 }
        why: "Immunological: sarcoid و PBC. Infectious: brucella (bacterial)، schistosoma (parasitic)، Q fever (الكتاب حاططها مع الـ viral). Medications: allopurinol و phenytoin و penicillins. Neoplastic: Hodgkin و RCC. Foreign body: beryllium و suture material."
      - kind: aside
        tone: tip
        page: 265
        text: |
          لينا في مصر: **schistosomiasis** و **brucellosis** و **TB** أسباب granuloma هتشوفها في الـ ward فعلًا، مش بس في الكتاب. ولو المريض عنده HIV، فكّر في **Mycobacterium avium-intracellulare**.
