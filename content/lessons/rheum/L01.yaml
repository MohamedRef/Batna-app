        options: ["Neutrophils, keratinocytes and other nonlymphoid cells", "Only on B cells", "Only on naive T cells", "Only on red cells"]
        answer: 0
        why:
          - "صح: والنتيجة إن الخلايا دي تفرز cytokines تعمل proinflammatory state."
