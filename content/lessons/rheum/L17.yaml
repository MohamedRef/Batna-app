          **Prognosis**: أغلبهم يتحسّنوا في **3-4 شهور**؛ ==25-40%== chronic أو flares؛ وقلّة بس عندهم disability.

          يعني العلاج ضد الالتهاب مش ضد الميكروب، والسبب في الخطوة الجاية.
