  - id: geri.L10.lesson4
    title: "من الـ spirometry للـ MDD: التشخيص"
    hook: "مريض عنده definite UIP على الـ HRCT؟ مبروك، مش محتاج biopsy. الدرس ده بيقولك إمتى تقطع وإمتى لأ."
    minutes: 10
    pages: [181, 184]
    topics: [diagnosis]
    goals:
      - "تقرا الـ spirometry وتعرف تأكد الـ restriction وليه"
      - "تعرف ليه الـ X-ray الطبيعي مش بينفي، وإمتى الـ HRCT يكفي"
      - "تمشي في خطوات guideline 2018 لحد الـ multidisciplinary discussion (MDD)"
    status: unverified
    steps:
      - kind: explain
        page: 181
        quote: "Causes: cardiac, anemia, metabolic, chest (ILD, COPD)."
        title: "نهجان بيزيد: دوّر فين؟"
        text: |
          الكتاب بيبدأ التشخيص من الشكوى: **progressive dyspnoea**، وأسبابها:

          - **Cardiac**
          - **Anemia**
          - **Metabolic**
          - **Chest**: ==ILD== أو **COPD**

          التفسير المقبول (مش في الكتاب) للقايمة: الأكسجين عشان يوصل للعضلة لازم يعدّي الرئة، يتشال على الهيموجلوبين، القلب يضخه، والجسم يستعمله. كل سبب بيكسر حلقة من دول: الرئة (chest)، الشيّال (anemia)، المضخة (cardiac)، أو الاحتياج (metabolic زي الـ acidosis). عشان كده مش كل نهجان في مسن يبقى قلب، وأول أداة تفرّق بين الـ ILD والـ COPD هي الـ **PFT**.
      - kind: table
        page: 181
        quote: "c) Restrictive Pattern ……. < LLN ……. > 70%"
        title: "أنماط الـ PFT"
        columns: ["Pattern", "FVC", "FEV1/FVC"]
        rows:
          - ["Normal", "> LLN", "> 70%"]
          - ["Obstructive", "> LLN", "< 70%"]
          - ["Restrictive", "< LLN", "> 70%"]
          - ["Mixed", "< LLN", "< 70%"]
        hide: [[1, 2], [2, 1], [2, 2], [3, 1]]
      - kind: explain
        page: 181
        quote: "Restrictive Lung Disease is confirmed by presence of: Diminshed CO diffusion capacity And TLC < LLN."
        title: "Restrictive؟ أكّد"
        text: |
          الـ dyspnea اللي بتزيد ليها أسباب: cardiac، anemia، metabolic، و chest (ILD أو chronic obstructive pulmonary disease (COPD)). الـ pulmonary function test (PFT) بتفرّق: الـ ILD **restrictive** والـ COPD **obstructive**.

          لو طلع restrictive: اعمل **diffusing capacity of the lung for carbon monoxide (DLCO)** و full PFT للـ **total lung capacity (TLC)**. الـ ==restrictive lung disease== بيتأكد بـ **DLCO قليل + TLC < lower limit of normal (LLN)**.

          ليه؟ الـ forced vital capacity (FVC) بيقل لأسباب كتير (ضعف عضلات، تخن)، بس الـ TLC الواطي هو اللي بيقول الرئة نفسها صغرت، والـ DLCO الواطي بيقول الـ interstitium تخين.
      - kind: check
        page: 181
        quote: "c) Restrictive Pattern ……. < LLN ……. > 70%"
        question: "FVC below LLN and FEV1/FVC 85%. Which pattern?"
        options: ["Restrictive", "Obstructive", "Mixed", "Normal"]
        answer: 0
        why:
          - "صح: FVC واطي و ratio فوق 70%."
          - "الـ obstructive الـ ratio فيه تحت 70% والـ FVC طبيعي."
          - "الـ mixed الاتنين واطيين."
          - "الـ FVC هنا تحت الـ LLN."
      - kind: reveal
        page: 181
        quote: "c) Restrictive Pattern ……. < LLN ……. > 70%"
        prompt: "في الـ restrictive الـ FVC واطي، طب ليه الـ FEV1/FVC بيفضل فوق 70%؟"
        answer: |
          التفسير المقبول (مش في الكتاب): في الـ restrictive الشُعب نفسها مفتوحة، والمشكلة إن الرئة **صغيرة**. فالـ FEV1 والـ FVC بيقلّوا **مع بعض**، والنسبة بينهم تفضل طبيعية، وساعات تعلى لأن الرئة الناشفة بتطرد الهوا بسرعة زي الأستك المشدود.

          في الـ obstructive العكس: الشُعب ضيقة، فالـ FEV1 بيقل أكتر بكتير من الـ FVC، والنسبة تنزل تحت 70%.
      - kind: explain
        page: 181
        quote: "Chest X-ray\n  Reticular and/or nodular opacities are the hallmark.\n  Honeycombing is a late finding.\n  Chest X-ray may be normal in 10% of patients with histologically proven disease.\n  Therefore, a normal chest X-ray Does NOT exclude interstitial lung disease."
        title: "X-ray و HRCT"
        text: |
          - الـ X-ray: **reticular و/أو nodular opacities** هي الـ hallmark؛ الـ honeycombing متأخر.
          - الـ X-ray ممكن يبقى **طبيعي في 10%** من الـ ILD المثبتة بالـ histology، فالـ ==normal chest X-ray== **مش بينفي** ILD.
          - الـ **high-resolution computed tomography (HRCT)** أحسّ، وممكن يدّي findings مميزة وساعات تشخيصية.

          ليه الـ X-ray ممكن يبقى طبيعي؟ التفسير المقبول (مش في الكتاب): الـ fibrosis في الأول خطوط رفيعة جدًا في الأطراف، والـ X-ray صورة واحدة كل الرئة فوق بعضها، فالتفاصيل الصغيرة بتضيع. الـ HRCT شرايح رفيعة بتشوف كل حتة لوحدها.
      - kind: check
        page: 181
        quote: "Therefore, a normal chest X-ray Does NOT exclude interstitial lung disease."
        question: "A 76-year-old with basal Velcro crackles has a normal chest X-ray. What next?"
        options:
          - "HRCT of the chest"
          - "Reassure: ILD is excluded"
          - "Repeat the chest X-ray in a year"
          - "Start steroids empirically"
        answer: 0
        why:
          - "صح: الـ X-ray طبيعي في 10% من الـ ILD المثبتة، والـ HRCT أحسّ."
          - "الكتاب بيقول normal chest X-ray **does NOT exclude** ILD."
          - "هتضيّع سنة والمرض بيتقدم."
          - "الـ steroids من غير تشخيص محدد ممنوعة (empiric use discouraged)."
      - kind: explain
        page: 182
        quote: "Surgical lung biopsy risk/benefit should be considered because\n  Morbidity of the procedure is significant.\n  A definitive diagnosis may not be possible even with surgical lung biopsy.\n  When a specific diagnosis is made there may be No effective treatment.\n  Empiric therapy or No treatment may be preferable to surgical lung biopsy in some patients."
        title: "الـ surgical biopsy مش ببلاش"
        text: |
          وازن الـ risk والـ benefit، خصوصًا في الكبار:

          - الـ ==morbidity== كبيرة.
          - ممكن حتى بعدها مانوصلش لتشخيص.
          - ولو وصلنا، ممكن مايكونش فيه علاج فعّال.
          - فساعات empiric therapy أو مفيش علاج أحسن من الـ biopsy.

          التفسير المقبول (مش في الكتاب) لليه ده أهم في الكبار: عملية في الصدر تحت تخدير كامل، لمريض رئته أصلًا ناشفة والأكسجين عنده واطي، ممكن تقلب exacerbation أو فشل تنفسي. فالسؤال دايمًا: **النتيجة هتغيّر العلاج؟** لو لأ، يبقى مش لازم.
      - kind: update
        page: 182
        quote: "Note: choice of procedure according to guidelines Update Ats 2022: Transbronchial Cryobiopsy is being considered to replace surgical lung biopsy although not yet fully approved."
        text: "الكتاب نفسه بيقول إن American Thoracic Society (ATS) 2022 بتدرس الـ transbronchial cryobiopsy كبديل للـ surgical biopsy، بس لسه مش approved بالكامل."
        ref: "ATS 2022 (as cited by the book)"
      - kind: explain
        page: 182
        quote: "Obtain a detailed history for possible environmental exposures or medication use to exclude potential causes of interstitial lung disease (ILD)."
        title: "Guideline 2018: ابدأ بالسبب"
        text: |
          الـ **2018 guideline** لتشخيص الـ IPF بتبدأ بخطوتين قبل الأشعة:

          - **Detailed history** للـ environmental exposures والأدوية، عشان تستبعد الأسباب المعروفة.
          - **Serologic testing** عشان تستبعد ==connective-tissue disease==.

          ليه قبل الـ HRCT؟ لأن الـ UIP pattern مش بتاع الـ IPF لوحده (الدرس التاني). لو لقيت سبب، الـ UIP ده **بسببه**، والطريق كله بيتغير. الـ IPF تشخيص **بعد ما تستبعد** كل حاجة تانية.
