items:
  # ---------- p299-300: overview ----------
  - id: git.L11.001
    kind: cloze
    topic: overview
    text: Acute gastrointestinal (GI) bleeding causes {{c1::250,000-300,000}} hospitalizations a year, with a mortality of about {{c2::6-8%}}.
    src: { page: 299, quote: "Acute gastrointestinal bleeding is one of the most common medical emergencies with 250,000 to 300,000 hospitalizations annually. The mortality rate is about 6-8%." }
    status: unverified
    tags: [numbers]
  - id: git.L11.002
    kind: card
    topic: overview
    front: Who has the highest risk of dying from GI bleeding?
    back: Patients of advanced age or with severe comorbidities.
    src: { page: 299, quote: "The risk of mortality is highest in patients of advanced age or those with severe co morbidities." }
    status: unverified
  - id: git.L11.003
    kind: card
    topic: overview
    front: What landmark separates upper from lower GI bleeding?
    back: The ligament of Treitz. Upper gastrointestinal (GI) bleeding comes from a source proximal to it.
    src: { page: 299, quote: "Upper GI bleeding (UGIB) is defined as bleeding derived from a source proximal to the ligament of Treitz. Bleeding from the upper GI tract is approximately 4 times more common than bleeding from the lower GI tract." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.004
    kind: cloze
    topic: overview
    text: Upper gastrointestinal (GI) bleeding is about {{c1::4}} times more common than lower GI bleeding.
    src: { page: 299, quote: "Upper GI bleeding (UGIB) is defined as bleeding derived from a source proximal to the ligament of Treitz. Bleeding from the upper GI tract is approximately 4 times more common than bleeding from the lower GI tract." }
    status: unverified
    tags: [numbers]
  - id: git.L11.005
    kind: card
    topic: overview
    front: How is GI bleeding classified by severity (course)?
    back: Acute, chronic, intermittent, or occult.
    src: { page: 299, quote: "UGI bleeding is more common than LGI bleeding. According to the Severity, it can be divided into:\n  Acute-chronic-intermittent- occult" }
    status: unverified
  - id: git.L11.006
    kind: card
    topic: overview
    front: How is UGIB divided by source?
    back: Non-variceal and variceal.
    src: { page: 300, quote: "UGIB can be divided according to its source into non variceal and variceal. Clinical manifestations." }
    status: unverified
  - id: git.L11.007
    kind: card
    topic: overview
    front: What does hematemesis with blood clots indicate?
    back: The most severe form; a rapid rate of bleeding that does not allow the clots to dissolve.
    src: { page: 300, quote: "The most severe form presents with hematemesis with blood clots represent rapid rate of bleeding which disables the dissolution of blood clots." }
    status: unverified
  - id: git.L11.008
    kind: card
    topic: overview
    front: What does hematochezia mean when the source is in the upper GI tract?
    back: Rapid, huge blood loss, about 1 liter.
    src: { page: 300, quote: "Hematochezia (fresh bleeding per rectum) if associated with upper GI bleeding presents rapid and huge blood loss (about 1 liter)." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.009
    kind: card
    topic: overview
    front: Describe melena and what it usually indicates.
    back: Dark, tarry, offensive black stool from slow upper gastrointestinal (GI) bleeding; it may follow hematemesis or even gum bleeding for a few days. It is rarely from very slow lower GI bleeding.
    src: { page: 300, quote: "Melena is dark tarry blackish stool with offensive odor presents slow upper GIT bleeding, usually occurs after hematemesis or even gum bleeding for few days. It is rarely associated with very slow bleeding from lower GIT." }
    status: unverified
  - id: git.L11.010
    kind: cloze
    topic: overview
    text: Melena can develop after as little as {{c1::50-100 mL}} of upper gastrointestinal (GI) blood loss.
    src: { page: 300, quote: "Melena develops after as little as 50–100 mL of blood loss in the upper gastrointestinal tract." }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L11.011
    kind: mcq
    topic: overview
    stem: A 60-year-old on aspirin passes large volumes of fresh red blood per rectum, and his BP is 85/50 mmHg. Nasogastric aspirate shows red blood. What does the lecture say about hematochezia from an upper source?
    options:
      - It means rapid, huge blood loss of about 1 liter
      - It means slow bleeding of 50-100 mL
      - It rules out an upper source
      - It is the usual picture of a simple Mallory-Weiss tear
      - It means bleeding has stopped
    answer: 0
    why:
      - Hematochezia with an upper source presents rapid and huge loss (about 1 liter).
      - 50-100 mL is the volume that can cause melena.
      - The red aspirate confirms an upper source; hematochezia does not exclude it.
      - The lecture does not tie hematochezia to Mallory-Weiss tears.
      - Fresh blood and hypotension mean active, rapid bleeding.
    src: { page: 300, quote: "Hematochezia (fresh bleeding per rectum) if associated with upper GI bleeding presents rapid and huge blood loss (about 1 liter)." }
    status: unverified
  # ---------- p300-301 + table p308: causes ----------
  - id: git.L11.012
    kind: cloze
    topic: causes
    text: Peptic ulcers cause {{c1::40%}} of major upper gastrointestinal (GI) bleeding, with an overall mortality below {{c2::5%}}.
    src: { page: 300, quote: "Peptic ulcers account for 40% of major upper gastrointestinal bleeding with an overall mortality rate of less than 5%. The incidence of bleeding from ulcers is declining due to eradication of H pylori and prophylaxis with proton pump inhibitors in high-risk patients. Portal hypertension accounts for 10–20% of upper gastrointestinal bleeding. Bleeding usually arises from esophageal varices and less commonly gastric or duodenal varices or portal hypertensive gastropathy." }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L11.013
    kind: card
    topic: causes
    front: Why is bleeding from peptic ulcers declining?
    back: H. pylori eradication and proton pump inhibitor (PPI) prophylaxis in high-risk patients.
    src: { page: 300, quote: "Peptic ulcers account for 40% of major upper gastrointestinal bleeding with an overall mortality rate of less than 5%. The incidence of bleeding from ulcers is declining due to eradication of H pylori and prophylaxis with proton pump inhibitors in high-risk patients. Portal hypertension accounts for 10–20% of upper gastrointestinal bleeding. Bleeding usually arises from esophageal varices and less commonly gastric or duodenal varices or portal hypertensive gastropathy." }
    status: unverified
  - id: git.L11.014
    kind: cloze
    topic: causes
    text: Portal hypertension causes {{c1::10-20%}} of upper gastrointestinal (GI) bleeding, mostly from {{c2::esophageal varices}}.
    src: { page: 300, quote: "Peptic ulcers account for 40% of major upper gastrointestinal bleeding with an overall mortality rate of less than 5%. The incidence of bleeding from ulcers is declining due to eradication of H pylori and prophylaxis with proton pump inhibitors in high-risk patients. Portal hypertension accounts for 10–20% of upper gastrointestinal bleeding. Bleeding usually arises from esophageal varices and less commonly gastric or duodenal varices or portal hypertensive gastropathy." }
    status: unverified
    tags: [numbers]
  - id: git.L11.015
    kind: card
    topic: causes
    front: Apart from esophageal varices, what portal hypertensive lesions bleed?
    back: Gastric or duodenal varices, and portal hypertensive gastropathy (less common).
    src: { page: 300, quote: "Peptic ulcers account for 40% of major upper gastrointestinal bleeding with an overall mortality rate of less than 5%. The incidence of bleeding from ulcers is declining due to eradication of H pylori and prophylaxis with proton pump inhibitors in high-risk patients. Portal hypertension accounts for 10–20% of upper gastrointestinal bleeding. Bleeding usually arises from esophageal varices and less commonly gastric or duodenal varices or portal hypertensive gastropathy." }
    status: unverified
  - id: git.L11.016
    kind: cloze
    topic: causes
    text: Vascular anomalies cause {{c1::7%}} of acute upper gastrointestinal (GI) bleeding; the most common are {{c2::angioectasias (angiodysplasias)}}.
    src: { page: 300, quote: "Vascular anomalies are found throughout the gastrointestinal tract and may be the source of chronic or acute gastrointestinal bleeding. They account for 7% of cases of acute upper tract bleeding. The most common are Angio ectasias (angiodysplasias), which are 1–10 mm distorted, aberrant submucosal vessels caused by chronic, intermittent obstruction of submucosal veins." }
    status: unverified
    tags: [numbers]
  - id: git.L11.017
    kind: card
    topic: causes
    front: What are angioectasias, and where are they most common?
    back: Distorted, aberrant submucosal vessels of 1-10 mm from chronic intermittent obstruction of submucosal veins; bright red and stellate; most common in the right colon.
    src: { page: 301, quote: "They have a bright red stellate appearance and occur throughout the gastrointestinal tract but most commonly in the right colon. Telangiectasias are small, cherry red lesions caused by dilation of venules that may be part of systemic conditions (hereditary hemorrhagic telangiectasia, CREST syndrome) or occur sporadically. The Dieulafoy lesion is an aberrant, large-caliber submucosal artery, most commonly in the proximal stomach that causes recurrent, intermittent bleeding." }
    status: unverified
  - id: git.L11.018
    kind: card
    topic: causes
    front: What are telangiectasias, and with which systemic conditions do they occur?
    back: Small cherry-red lesions from dilated venules; part of hereditary hemorrhagic telangiectasia or CREST syndrome, or sporadic.
    src: { page: 301, quote: "They have a bright red stellate appearance and occur throughout the gastrointestinal tract but most commonly in the right colon. Telangiectasias are small, cherry red lesions caused by dilation of venules that may be part of systemic conditions (hereditary hemorrhagic telangiectasia, CREST syndrome) or occur sporadically. The Dieulafoy lesion is an aberrant, large-caliber submucosal artery, most commonly in the proximal stomach that causes recurrent, intermittent bleeding." }
    status: unverified
  - id: git.L11.019
    kind: card
    topic: causes
    front: What is a Dieulafoy lesion?
    back: An aberrant, large-caliber submucosal artery, most commonly in the proximal stomach, that causes recurrent, intermittent bleeding.
    src: { page: 301, quote: "They have a bright red stellate appearance and occur throughout the gastrointestinal tract but most commonly in the right colon. Telangiectasias are small, cherry red lesions caused by dilation of venules that may be part of systemic conditions (hereditary hemorrhagic telangiectasia, CREST syndrome) or occur sporadically. The Dieulafoy lesion is an aberrant, large-caliber submucosal artery, most commonly in the proximal stomach that causes recurrent, intermittent bleeding." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.020
    kind: cloze
    topic: causes
    text: Gastric neoplasms cause {{c1::1%}} of upper gastrointestinal (GI) hemorrhages; erosive gastritis causes less than {{c2::5%}} of severe bleeds because it is {{c3::superficial}}.
    src: { page: 301, quote: "Gastric neoplasms result in 1% of upper gastrointestinal hemorrhages. Erosive gastritis is superficial, so it is a relatively unusual cause of severe gastrointestinal bleeding (less than 5% of cases) and more commonly results in chronic blood loss. Gastric mucosal erosions are due to NSAIDs, alcohol, or severe medical or surgical illness (stress-related mucosal disease). Severe erosive esophagitis due to chronic gastroesophageal reflux may rarely cause significant upper gastrointestinal bleeding, especially in patients who are bedbound long-term. An aortoenteric fistula complicates 2% of abdominal aortic grafts or, rarely, can occur as the initial presentation of a previously untreated aneurysm. Unusual causes of upper gastrointestinal bleeding include hemobilia (from hepatic tumor, angioma, penetrating trauma), and pancreatic malignancy and pseudoaneurysm (hemosuccus pancreaticus)." }
    status: unverified
    tags: [numbers]
  - id: git.L11.021
    kind: card
    topic: causes
    front: Three causes of gastric mucosal erosions?
    back: Nonsteroidal anti-inflammatory drugs (NSAIDs), alcohol, and severe medical or surgical illness (stress-related mucosal disease).
    src: { page: 301, quote: "Gastric neoplasms result in 1% of upper gastrointestinal hemorrhages. Erosive gastritis is superficial, so it is a relatively unusual cause of severe gastrointestinal bleeding (less than 5% of cases) and more commonly results in chronic blood loss. Gastric mucosal erosions are due to NSAIDs, alcohol, or severe medical or surgical illness (stress-related mucosal disease). Severe erosive esophagitis due to chronic gastroesophageal reflux may rarely cause significant upper gastrointestinal bleeding, especially in patients who are bedbound long-term. An aortoenteric fistula complicates 2% of abdominal aortic grafts or, rarely, can occur as the initial presentation of a previously untreated aneurysm. Unusual causes of upper gastrointestinal bleeding include hemobilia (from hepatic tumor, angioma, penetrating trauma), and pancreatic malignancy and pseudoaneurysm (hemosuccus pancreaticus)." }
    status: unverified
  - id: git.L11.022
    kind: card
    topic: causes
    front: When may erosive esophagitis cause significant upper GI bleeding?
    back: Rarely, when severe from chronic gastroesophageal reflux disease (GERD), especially in long-term bedbound patients.
    src: { page: 301, quote: "Gastric neoplasms result in 1% of upper gastrointestinal hemorrhages. Erosive gastritis is superficial, so it is a relatively unusual cause of severe gastrointestinal bleeding (less than 5% of cases) and more commonly results in chronic blood loss. Gastric mucosal erosions are due to NSAIDs, alcohol, or severe medical or surgical illness (stress-related mucosal disease). Severe erosive esophagitis due to chronic gastroesophageal reflux may rarely cause significant upper gastrointestinal bleeding, especially in patients who are bedbound long-term. An aortoenteric fistula complicates 2% of abdominal aortic grafts or, rarely, can occur as the initial presentation of a previously untreated aneurysm. Unusual causes of upper gastrointestinal bleeding include hemobilia (from hepatic tumor, angioma, penetrating trauma), and pancreatic malignancy and pseudoaneurysm (hemosuccus pancreaticus)." }
    status: unverified
  - id: git.L11.023
    kind: cloze
    topic: causes
    text: An aortoenteric fistula complicates {{c1::2%}} of abdominal aortic grafts, or rarely presents a previously untreated {{c2::aneurysm}}.
    src: { page: 301, quote: "Gastric neoplasms result in 1% of upper gastrointestinal hemorrhages. Erosive gastritis is superficial, so it is a relatively unusual cause of severe gastrointestinal bleeding (less than 5% of cases) and more commonly results in chronic blood loss. Gastric mucosal erosions are due to NSAIDs, alcohol, or severe medical or surgical illness (stress-related mucosal disease). Severe erosive esophagitis due to chronic gastroesophageal reflux may rarely cause significant upper gastrointestinal bleeding, especially in patients who are bedbound long-term. An aortoenteric fistula complicates 2% of abdominal aortic grafts or, rarely, can occur as the initial presentation of a previously untreated aneurysm. Unusual causes of upper gastrointestinal bleeding include hemobilia (from hepatic tumor, angioma, penetrating trauma), and pancreatic malignancy and pseudoaneurysm (hemosuccus pancreaticus)." }
    status: unverified
  - id: git.L11.024
    kind: card
    topic: causes
    front: "Hemobilia and hemosuccus pancreaticus: what are they and their causes?"
    back: "Unusual causes of upper gastrointestinal bleeding (UGIB). Hemobilia: bleeding into the biliary tree from hepatic tumor, angioma or penetrating trauma. Hemosuccus pancreaticus: from pancreatic malignancy or pseudoaneurysm."
    src: { page: 301, quote: "Gastric neoplasms result in 1% of upper gastrointestinal hemorrhages. Erosive gastritis is superficial, so it is a relatively unusual cause of severe gastrointestinal bleeding (less than 5% of cases) and more commonly results in chronic blood loss. Gastric mucosal erosions are due to NSAIDs, alcohol, or severe medical or surgical illness (stress-related mucosal disease). Severe erosive esophagitis due to chronic gastroesophageal reflux may rarely cause significant upper gastrointestinal bleeding, especially in patients who are bedbound long-term. An aortoenteric fistula complicates 2% of abdominal aortic grafts or, rarely, can occur as the initial presentation of a previously untreated aneurysm. Unusual causes of upper gastrointestinal bleeding include hemobilia (from hepatic tumor, angioma, penetrating trauma), and pancreatic malignancy and pseudoaneurysm (hemosuccus pancreaticus)." }
    status: unverified
  - id: git.L11.025
    kind: table
    topic: causes
    title: Etiologies of non-variceal upper GI bleeding (Table 1)
    columns: [Group, Causes]
    rows:
      - [Ulcer / inflammation, "Peptic ulcer; erosive esophagitis, gastritis or duodenitis; anastomotic ulcers (post gastric bypass)"]
      - [Vascular lesions, "GAVE; Dieulafoy lesion; angiodysplasia / AVM; aorto-enteric fistula"]
      - [Congestive gastropathy, Portal hypertensive gastropathy]
      - [Malignant lesions, "GIST; non-GIST (lipoma, schwannoma); gastric and esophageal cancer; metastases"]
      - [Post procedural, "Endoscopic mucosal and submucosal dissection; post sphincterotomy"]
      - [Others, "Mallory-Weiss tear; Cameron ulcers"]
    blanks: [[1, 1], [2, 1], [4, 1], [5, 1]]
    src: { page: 308, quote: "Table 1: The most common causes of upper GIT bleeding:\n| Etiologies of non-variceal upper gastrointestinal bleeding |  |\n|---|---|\n| Ulcer/ inflammation | Peptic ulcer disease; Erosive esophagitis, gastritis or duodenitis; Anastomotic ulcers (post gastric bypass) |\n| Vascular lesions | Gastric antral vascular ectasia; Dieulafoy's lesion; Angiodysplasia/ Arteriovenous malformation; Aorto-enteric fistula |\n| Congestive gastropathy | Portal hypertensive gastropathy |\n| Malignant lesions | Gastrointestinal stromal tumors (GIST); Non-GIST (e.g., Lipoma, schwannoma); Gastric and esophageal cancer; Metastatic lesions in the upper GI tract |\n| Post procedural | Endoscopic mucosal and submucosal dissection; Post sphincterotomy |\n| Others | Mallory Weis tear; Cameron ulcers |" }
    status: unverified
    tags: [high-yield]
  - id: git.L11.026
    kind: mcq
    topic: causes
    stem: A 55-year-old has three episodes of large painless hematemesis over a month; two endoscopies were normal. On the third, a single pulsating vessel is seen in normal mucosa of the proximal stomach. Diagnosis?
    options: [Dieulafoy lesion, Angioectasia, Mallory-Weiss tear, Portal hypertensive gastropathy, Cameron ulcer]
    answer: 0
    why:
      - An aberrant large submucosal artery in the proximal stomach with recurrent intermittent bleeding is a Dieulafoy lesion.
      - Angioectasias are 1-10 mm bright red stellate lesions, most common in the right colon.
      - A Mallory-Weiss tear is a mucosal tear, usually after retching.
      - PHG occurs with portal hypertension and gives mosaic congested mucosa.
      - Cameron ulcers sit in a hiatal hernia.
    src: { page: 301, quote: "They have a bright red stellate appearance and occur throughout the gastrointestinal tract but most commonly in the right colon. Telangiectasias are small, cherry red lesions caused by dilation of venules that may be part of systemic conditions (hereditary hemorrhagic telangiectasia, CREST syndrome) or occur sporadically. The Dieulafoy lesion is an aberrant, large-caliber submucosal artery, most commonly in the proximal stomach that causes recurrent, intermittent bleeding." }
    status: unverified
  - id: git.L11.027
    kind: mcq
    topic: causes
    stem: A 68-year-old with an abdominal aortic graft placed 3 years ago has a small "herald" hematemesis followed by massive bleeding. Which cause should be suspected?
    options:
      - Aortoenteric fistula
      - Erosive gastritis from NSAIDs
      - Gastric cancer
      - Hemobilia
      - Telangiectasia
    answer: 0
    why:
      - An aortoenteric fistula complicates 2% of abdominal aortic grafts.
      - Erosive gastritis is superficial and rarely causes severe bleeding.
      - Gastric neoplasms cause only 1% and are not tied to grafts.
      - Hemobilia follows hepatic tumor, angioma or trauma.
      - Telangiectasias give small cherry-red lesions with chronic loss.
    src: { page: 301, quote: "Gastric neoplasms result in 1% of upper gastrointestinal hemorrhages. Erosive gastritis is superficial, so it is a relatively unusual cause of severe gastrointestinal bleeding (less than 5% of cases) and more commonly results in chronic blood loss. Gastric mucosal erosions are due to NSAIDs, alcohol, or severe medical or surgical illness (stress-related mucosal disease). Severe erosive esophagitis due to chronic gastroesophageal reflux may rarely cause significant upper gastrointestinal bleeding, especially in patients who are bedbound long-term. An aortoenteric fistula complicates 2% of abdominal aortic grafts or, rarely, can occur as the initial presentation of a previously untreated aneurysm. Unusual causes of upper gastrointestinal bleeding include hemobilia (from hepatic tumor, angioma, penetrating trauma), and pancreatic malignancy and pseudoaneurysm (hemosuccus pancreaticus)." }
    status: unverified
  - id: git.L11.028
    kind: mcq
    topic: causes
    stem: Which is the most common cause of major upper GI bleeding according to the lecture?
    options: [Peptic ulcer (40%), Portal hypertension (10-20%), Vascular anomalies (7%), Erosive gastritis (<5%), Gastric neoplasms (1%)]
    answer: 0
    why:
      - Peptic ulcers account for 40% of major upper gastrointestinal bleeding (UGIB).
      - Portal hypertension accounts for 10-20%.
      - Vascular anomalies account for 7%.
      - Erosive gastritis causes under 5% of severe bleeds.
      - Gastric neoplasms cause 1%.
    src: { page: 300, quote: "Peptic ulcers account for 40% of major upper gastrointestinal bleeding with an overall mortality rate of less than 5%. The incidence of bleeding from ulcers is declining due to eradication of H pylori and prophylaxis with proton pump inhibitors in high-risk patients. Portal hypertension accounts for 10–20% of upper gastrointestinal bleeding. Bleeding usually arises from esophageal varices and less commonly gastric or duodenal varices or portal hypertensive gastropathy." }
    status: unverified
  # ---------- p301-302 + table p309: risk stratification ----------
  - id: git.L11.029
    kind: enumerate
    topic: risk
    prompt: Enumerate the questions the lecture asks in every case of GI bleeding.
    points:
      - How to stratify by severity
      - What initial assessment fits the severity and type
      - When the patient can be discharged and followed as an outpatient
      - What the indications for admission are
      - Where to admit (ward or ICU)
    pass: 4
    hook: "أسئلة أي نزيف «قد إيه، أبدأ إزاي، يروّح إمتى، يدخل ليه، ويدخل فين»: stratify by severity، initial assessment، discharge وoutpatient follow-up، indications for admission، وward ولا ICU."
    src: { page: 301, quote: "When the patient with acute bleeding can be discharged and followed up as an outpatient?" }
    status: unverified
  - id: git.L11.030
    kind: card
    topic: risk
    front: Which score is recommended for pre-endoscopy risk stratification in UGIB?
    back: The Glasgow-Blatchford score (GBS).
    src: { page: 302, quote: "Patient assessment & risk stratification: The use of the Glasgow– Blatchford Score (GBS) (Table 2) is highly recommended for preendoscopy risk stratification. Patients with GBS ≤ 1 are at very low risk of rebleeding, mortality within 30 days, or needing hospital-based intervention and can be safely managed as outpatients with outpatient endoscopy." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.031
    kind: cloze
    topic: risk
    text: Patients with a Glasgow-Blatchford score (GBS) of {{c1::≤ 1}} are at very low risk and can be managed as {{c2::outpatients with outpatient endoscopy}}.
    src: { page: 302, quote: "Patient assessment & risk stratification: The use of the Glasgow– Blatchford Score (GBS) (Table 2) is highly recommended for preendoscopy risk stratification. Patients with GBS ≤ 1 are at very low risk of rebleeding, mortality within 30 days, or needing hospital-based intervention and can be safely managed as outpatients with outpatient endoscopy." }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L11.032
    kind: card
    topic: risk
    front: What does the GBS predict best?
    back: The need for hospital-based intervention (RBC transfusion, endoscopic treatment, arterial embolization, surgery) or death; it has the highest accuracy for this.
    src: { page: 302, quote: "The GBS was reported to have the highest accuracy for predicting need for hospital-based intervention (RBC transfusion, endoscopic treatment, arterial embolization, surgery) or death." }
    status: unverified
  - id: git.L11.033
    kind: enumerate
    topic: risk
    prompt: Enumerate the indications for ICU admission in acute upper GI bleeding.
    points:
      - Active bleeding (hematemesis or bright red blood on NG aspirate)
      - Shock
      - Persistent hemodynamic derangement despite fluid resuscitation
      - Serious comorbid medical illness
      - Evidence of advanced liver disease
    pass: 4
    hook: "الـ ICU في upper GI bleeding لـ 5: «نازف، مصدوم، مش بيستجيب، تعبان أصلًا، وكبده متأخر»: active bleeding (hematemesis أو دم أحمر في الـ NG aspirate)، shock، hemodynamic derangement رغم fluid resuscitation، serious comorbid illness، وadvanced liver disease."
    src: { page: 302, quote: "Patients with active bleeding manifested by hematemesis or bright red blood on nasogastric aspirate, shock, persistent hemodynamic derangement despite fluid resuscitation, serious comorbid medical illness, or evidence of advanced liver disease require admission to an ICU." }
    status: unverified
    tags: [high-yield]
