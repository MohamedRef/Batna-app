lessons:
  # ------------------------------------------------------------------
  - id: dm.L07.lesson1
    title: "القلب لما أعصابه تتقطع: CAN"
    hook: "مريض سكر نبضه 95 وثابت، ومش بيتغير لا بالنفس ولا بالوقوف: ده مش «قلق»، ده CAN."
    minutes: 8
    pages: [76, 78]
    topics: [definition, prevalence, risk, pathogenesis]
    goals:
      - "تعرّف الـ CAN وتعرف قاعدة الـ two tests"
      - "تحفظ النوعين والـ prevalence"
      - "تعرف ليه الـ mortality عالية"
    status: unverified
    steps:
      - kind: explain
        page: 76
        title: "يعني إيه CAN؟"
        quote: "Cardiovascular autonomic neuropathy is a common form of autonomic neuropathy, causing abnormalities in heart rate control and central and peripheral vascular dynamics."
        text: |
          الـ ==Cardiovascular autonomic neuropathy== نوع شائع من الـ autonomic neuropathy، بيبوّظ:
          - **heart rate control**
          - **central and peripheral vascular dynamics** (الضغط وتوزيع الدم)

          القلب عنده دواسة بنزين (**sympathetic**) وفرامل (**vagus**). الـ CAN بيقطع السلكين.
      - kind: explain
        page: 76
        title: "التشخيص: اتنين من أربعة"
        quote: "To diagnose CAN, at least two of the four autonomic tests should be abnormal:"
        text: |
          علشان تقول **CAN** لازم ==at least two== من الـ **autonomic tests** يطلعوا abnormal:
          1. **HRV** مع **deep breathing**
          2. **HRV** من **lying to standing**
          3. **HRV** مع **Valsalva**
          4. **Orthostatic hypotension** (نزول الـ SBP مع الوقوف)

          واللي عندهم **two or more** positive tests عندهم dysfunction أشد و co-morbidities أكتر و mortality أعلى.
      - kind: check
        page: 76
        quote: "To diagnose CAN, at least two of the four autonomic tests should be abnormal:"
        question: "How many abnormal autonomic tests are needed to diagnose CAN?"
        options: ["At least two", "One", "All four", "Three"]
        answer: 0
        why:
          - "صح: two of the four."
          - "واحد بس مش كفاية حسب الكتاب."
          - "مش لازم الأربعة."
          - "الكتاب قال اتنين."
      - kind: explain
        page: 77
        title: "نوعين"
        quote: "minor symptoms that recover with the establishment of euglycemia."
        text: |
          - ==Transient==: في **newly diagnosed type 1**، أعراض بسيطة **بتروح** لما السكر يتظبط (**euglycemia**).
          - **Symptomatic**: عادة بيمشي مع الـ **somatic neuropathy** (يعني لو الرجل فيها neuropathy، دوّر على القلب).
      - kind: table
        page: 77
        quote: "Cardiovascular autonomic neuropathy occurs in ~17% of patients with type 1 diabetes and 22% of those with type 2."
        title: "الـ prevalence"
        columns: [Group, CAN, Borderline]
        rows:
          - ["Type 1", "~17%", "+9%"]
          - ["Type 2", "22%", "+12%"]
        hide: [[0, 1], [1, 1]]
      - kind: aside
        tone: tip
        page: 77
        quote: "Cardiovascular autonomic neuropathy occurs in ~17% of patients with type 1 diabetes and 22% of those with type 2."
        text: "افتكرها كده: **type 1 = 17**، و **type 2 = 22** (2 و 2). والـ borderline: **9 و 12**."
      - kind: explain
        page: 77
        title: "ليه خطير؟"
        quote: "The 5-year mortality rate is five times higher"
        text: |
          - الـ ==5-year mortality== **خمس أضعاف**
          - **Mortality 27% في 10 سنين**
          - **asymptomatic ischemia** و MI أكتر، وفرصة النجاة بعد الـ MI أقل

          الأسباب: **silent ischemia**، **arrhythmias**، **sudden cardiac death**، **LV hypertrophy**، تغيّر في الـ coronary vasomotor dynamics، و **platelet stickiness**.
      - kind: mnemonic
        page: 77
        quote: "Silent Cardiac Ischemia"
        word: "SASHAP"
        parts:
          - { key: "S", text: "Silent cardiac ischemia" }
          - { key: "A", text: "Arrhythmias" }
          - { key: "S", text: "Sudden cardiac death" }
          - { key: "H", text: "Hypertrophy of the LV" }
          - { key: "A", text: "Altered coronary vasomotor dynamics" }
          - { key: "P", text: "Platelet stickiness" }
        hook: "**SASHAP** (ساشاب): ست أسباب للـ mortality في الـ CAN."
      - kind: explain
        page: 78
        title: "الأعصاب بتموت ليه؟"
        quote: "Metabolic insult to nerve fibers,"
        text: |
          الكتاب بيقول **hypotheses** كتير:
          - ==Metabolic insult== للـ nerve fibers
          - **Neurovascular insufficiency** (الأوعية اللي بتغذي العصب)
          - **Autoimmune damage**
          - **Neurohormonal growth factor deficiency**
      - kind: explain
        page: 78
        title: "بيظهر إزاي؟"
        quote: "Rare and relatively late in the course of the diabetes."
        text: |
          الأعراض الصريحة (**tachycardia**، **postural hypotension**، **low cardiac output**) ==rare and late==. علشان كده الـ standard diagnosis هو الـ **noninvasive cardiovascular reflex tests**، مش الأعراض.
      - kind: try
        items: [dm.L07.002, dm.L07.007, dm.L07.009, dm.L07.011, dm.L07.012]
    recap:
      - "CAN = خلل في التحكم في الـ HR والـ vascular dynamics."
      - "التشخيص: two of four autonomic tests abnormal."
      - "Transient في T1 الجديد ويروح مع euglycemia؛ symptomatic مع الـ somatic neuropathy."
      - "T1 17%، T2 22%. 5-year mortality ×5، و27% في 10 سنين (SASHAP)."
    practice: [dm.L07.001, dm.L07.002, dm.L07.003, dm.L07.004, dm.L07.005, dm.L07.006, dm.L07.007, dm.L07.008, dm.L07.009, dm.L07.010, dm.L07.011, dm.L07.012, dm.L07.013, dm.L07.014, dm.L07.015]
