          الماكينة بتسحب من **الأوعية** بس، والمية الزيادة قاعدة في **الأنسجة** ولازم ترجع للأوعية الأول (==refill==).

          - لو الـ UF على قد الـ refill: الأوعية مليانة والضغط ثابت.
          - لو أسرع: الأوعية تفضى، فـ **hypotension** و **prerenal azotemia** (من Table 5).

          ده التفسير المقبول (مش في الكتاب) لمضاعفة الـ ==excess UF==، وهو نفسه سبب إن الجلسات **الأطول أو الأكتر** في Table 6 بتريّح القلب: نفس اللترات على ساعات أكتر.
