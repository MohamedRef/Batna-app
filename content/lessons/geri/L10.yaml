      - kind: reveal
        page: 172
        quote: "Inflammation is absent or mild and mostly limited to the areas of honeycombing."
        prompt: "لو الـ UIP مرض التهابي، كنت هتتوقع تلاقي إيه في الـ biopsy؟ وإيه اللي بنلاقيه فعلًا؟"
        answer: "كنا هنتوقع inflammation كتير في كل حتة. الحقيقة إن الـ ==inflammation== **absent or mild**، ومحصور تقريبًا في مناطق الـ honeycombing. ده أول خيط إن الـ IPF مش مرض التهابي."
      - kind: aside
        tone: analogy
        page: 172
        quote: "Temporal Heterogeneity: is the identification of fibrotic lesions at different stages (fibroblastic infiltrates, mature fibrosis and honeycombing) within the same biopsy specimen and architectural distortion."
        text: "الـ temporal heterogeneity زي ركبة عيل شقي: جرح جديد لسه أحمر، جنبه قشرة، جنبه ندبة بيضا قديمة. لو شفت كل المراحل دي مع بعض تعرف إن الوقعات بتتكرر. نفس الكلام في الـ UIP: fibroblastic foci (جديد) و mature fibrosis و honeycombing (قديم) في نفس العينة."
      - kind: explain
        page: 173
        quote: "So if UIP pattern is found in patient who has been previously identified as IIP now we can say it is IPF."
        title: "الـ UIP مش دايمًا IPF"
        text: |
          الـ UIP pattern بيظهر كمان في interstitial lung disease (ILD) تانية، خصوصًا **connective tissue related ILD**. طب نفرّق إزاي؟

          الفرق في **أول خطوة في التشخيص**: هل ده ==idiopathic interstitial pneumonia (IIP)== ولا ILD ليها سبب معروف؟

          - UIP في مريض اتصنّف قبل كده IIP ← نقول **IPF**.
          - UIP في مرض ليه سبب معروف ← الـ UIP ده من السبب، **مش IPF**.
      - kind: check
        page: 173
        quote: "But if the UIP pattern is found in a condition of known cause then that UIP pattern is due to that cause not due to IPF."
        question: "A woman with systemic sclerosis has a UIP pattern on biopsy. The correct label is:"
        options: ["UIP due to connective tissue disease", "IPF", "IPF plus systemic sclerosis", "Acute interstitial pneumonia"]
        answer: 0
        why:
          - "صح: فيه سبب معروف، فالـ UIP بتاعه."
          - "الـ IPF لازم يبقى IIP الأول، يعني من غير سبب معروف."
          - "مش بنحط الاتنين؛ السبب المعروف بيلغي كلمة idiopathic."
          - "الـ AIP acute وشكله acute respiratory distress syndrome (ARDS) مش UIP."
      - kind: explain
        page: 173
        quote: "But if the UIP pattern is found in a condition of known cause then that UIP pattern is due to that cause not due to IPF."
        title: "ليه الاسم يفرق؟"
        text: |
          نفس الشكل تحت الميكروسكوب، بس اسمين مختلفين. ليه ده مهم مش مجرد كلام؟

          - **UIP بسبب معروف** (rheumatoid، systemic sclerosis، دوا): العلاج بيبدأ بالسبب، والكتاب في الآخر بيقول الـ steroids والـ cytotoxics ممكن تتدّي **لتشخيص محدد**.
          - **IPF**: مفيش سبب، والـ steroids لوحدها **ممنوعة**، والعلاج antifibrotics.

          يعني كلمة **idiopathic** دي بتقلب خطة العلاج كلها. عشان كده الـ history والـ serology قبل أي حاجة.
      - kind: try
        items: [geri.L10.010, geri.L10.013, geri.L10.014, geri.L10.016, geri.L10.019]
    recap:
      - "ILD: known cause (CTD، occupation، drugs)، IIP، granulomatous (sarcoid، HP، infection)، other (LAM، histiocytosis X)."
      - "Major IIP: chronic fibrosing (IPF، NSIP)، smoking (DIP، RB-ILD)، acute/subacute (COP، AIP)؛ rare: PPFE و LIP."
      - "UIP = temporal + spatial heterogeneity: الأذى بيتكرر، basal و subpleural، inflammation قليل."
      - "Honeycombing أكتر من 5% = تقريبًا 100% specific."
      - "UIP + IIP = IPF؛ UIP + سبب معروف = من السبب، والعلاج بيتغير."
