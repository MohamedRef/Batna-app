- id: res.L16.023
  kind: card
  topic: zscore
  front: Define the Z-score (standard score).
  back: The number of standard deviations a random variable X falls away from the mean, i.e. how many SDs a particular data
    point is above or below the mean.
  src:
    page: 22
    quote: |-
      The standard score, or Z-score, represents the number of standard deviations a random variable X falls away from the mean.
      i.e. How many standard deviations a particular data point is above or below the mean?
  status: unverified
  tags: [high-yield]
- id: res.L16.024
  kind: cloze
  topic: zscore
  text: 'Z-score = ({{c1::Xi − X̄}}) ÷ {{c2::s}}: the value minus the mean, divided by the standard deviation.'
  src:
    page: 17
    quote: 'Formula for Z-score: Z = (Xi - X̄) / s'
  status: unverified
  tags: [high-yield]
- id: res.L16.025
  kind: mcq
  topic: zscore
  stem: 'A negative Z-score means the value is:'
  options:
  - Below the mean
  - Above the mean
  - 'An error: Z cannot be negative'
  - Equal to the mean
  answer: 0
  why:
  - Z = (X − mean)/SD, so a value under the mean gives a negative Z.
  - Above the mean gives a positive Z.
  - Z is negative for every value below the mean, as Fares's −3.6 on slide 20.
  - A value equal to the mean gives Z = 0.
  src:
    page: 22
    quote: |-
      The standard score, or Z-score, represents the number of standard deviations a random variable X falls away from the mean.
      i.e. How many standard deviations a particular data point is above or below the mean?
      Formula for Z-score: Z = (Xi - X̄) / s
  status: unverified
