  # ---------- p367-370: contraception on dialysis ----------
  - id: neph.L11.095
    kind: card
    topic: dialysis-contraception
    front: What should preconception counseling encourage in a woman on dialysis who wants a pregnancy?
    back: Kidney transplantation, because reproductive function improves and pregnancy after transplant has fewer maternal and fetal complications.
    src: { page: 367, quote: "Preconception Counseling and Contraception Preconception counseling should include a discussion about the risks and benefits of pregnancy for all women of childbearing age who are receiving maintenance dialysis. Kidney transplantation should be encouraged, as reproductive function improves after kidney transplantation, and pregnancy post-kidney transplantation is associated with fewer maternal and fetal complications. (38) All women of childbearing age who are sexually active and do not wish to become pregnant should be advised to be on contraception. Irregular menstrual cycles in this population make it difficult to rely solely on natural family planning methods to avoid conception. Although this discussion should be held" }
    status: unverified
    tags: [high-yield]
