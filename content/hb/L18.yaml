    suitable for surgery or ablation.
  src:
    page: 369
    quote: "TACE may benefit selected asymptomatic patients with maintained liver function (BCLC stage A to early intermediate BCLC stage B) with small tumor burden"
  status: unverified
- id: hb.L18.157
  kind: card
  topic: locoregional
  front: Principle of TACE?
  back: Arterial obstruction of the tumour (e.g. with gelatin via angiography) causes ischaemic necrosis, plus local
    chemotherapy that raises intratumour drug levels with less systemic toxicity.
  src:
    page: 369
    quote: "TACE is based on the principle of causing tumor arterial obstruction by using gelatin through angiography to induce ischemic necrosis"
  status: unverified
- id: hb.L18.158
  kind: cloze
  topic: locoregional
  text: 'Chemotherapy agents injected in TACE: {{c1::cisplatin}}, {{c2::doxorubicin}}, or {{c3::mitomycin C}}.'
  src:
    page: 369
    quote: "The injection of localized chemotherapeutic agents (cisplatin, doxorubicin, or mitomycin C) by TACE"
  status: unverified
- id: hb.L18.159
  kind: card
  topic: locoregional
  front: Why were drug-eluting beads developed for TACE?
  back: To enhance tumour drug delivery and reduce systemic availability.
  src:
    page: 369
    quote: "A drug-eluting bead has been developed to enhance tumor drug delivery and reduce systemic availability."
  status: unverified
- id: hb.L18.160
  kind: card
  topic: locoregional
  front: Principle of TARE?
  back: Transarterial injection of yttrium-90 microspheres that emit beta particles, causing local radiation cell
    death.
  src:
    page: 369
    quote: "TARE involves a transarterial injection of yttrium-90-labeled microspheres that emit damaging beta particles; this causes local radiation-induced cell death"
  status: unverified
- id: hb.L18.161
  kind: card
  topic: locoregional
  front: Principle of PEI, and its indication?
  back: Chemical destruction of the tumour; an alternative for BCLC 0-A patients unsuitable for surgery or thermal
    ablation.
  src:
    page: 369
    quote: "PEI is a reasonable alternative for patients with BCLC stage 0-A HCC who are not candidates for surgery or thermal ablation."
  status: unverified
