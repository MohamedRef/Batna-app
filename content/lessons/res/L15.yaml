- id: res.L15.lesson6
  title: 'المتوسط والوسيط والمنوال: مين يمثّل البيانات؟'
  hook: '6 مرضى transplant: 5 منهم تحت الـ 65، وواحد 623. المتوسط 135.8! مين فيهم بيكذب؟'
  minutes: 10
  pages: [98, 126]
  topics: [central]
  goals:
  - تحسب الـ mean للـ ungrouped والـ grouped
  - تحسب الـ median لـ n فردي وزوجي
  - تحدد الـ mode وتعرف مزايا وعيوب كل مقياس
  status: unverified
  steps:
  - kind: explain
    page: 98
    quote: |-
      Measures of Central Tendency
      I- Measures of central tendency
      These are computed values around which most observations tend to concentrate or allocate.
    title: Central tendency
    text: |-
      قيم محسوبة ==البيانات بتتجمع حواليها==. أشهرهم 3: **mean**، **median**، **mode**.

      الـ **mean** = مجموع القيم ÷ عددها: للـ sample اسمه ==x̄ = Σx ÷ n==، وللـ population ==μ = Σx ÷ N==.
  - kind: check
    page: 103
    quote: |-
      Test yourself
      Mean = sum of values / Sample size = Σ (values) / n
      Suppose data are: 90, 80, 95, 85, 65
      x1 = 90, x2 = 80, x3 = 95, x4 = 85, x5 = 65
      x̄ = Σxi / n = (x1+x2+x3+x4+x5) / 5 = (90+80+95+85+65) / 5 = 83
    question: Mean of 90, 80, 95, 85, 65?
    options:
    - '83'
    - '85'
    - '415'
    answer: 0
    why:
    - 'صح: 415 ÷ 5.'
    - 85 هو الـ median.
    - 415 المجموع.
  - kind: explain
    page: 105
    quote: |-
      Calculate the mean.
      | Age (year) | F | xi | fxi |
      |---|---|---|---|
      | 15- | 10 | 20 | 200 |
      | 25- | 12 | 30 | 360 |
      | 35- | 15 | 40 | 600 |
      | 45- | 8 | 50 | 400 |
      | 55 < 65 | 5 | 60 | 300 |
      | Total | f=50 |  | fxi = 1860 |
      x̄ = ΣfX / Σf = 1860 / 50 = 37.2years
    title: Mean من جدول (grouped)
    text: |-
      1. هات **midpoint (X)** لكل فئة.
      2. اضرب **f × X**.
      3. اجمعهم = **ΣfX**.
      4. اقسم على **Σf**.

      مثال السلايد: ΣfX = 1860، Σf = 50 → ==x̄ = 37.2 years==.
  - kind: explain
    page: 108
    quote: |-
      Example:
      Find the median age of the following values
      5, 8, 7, 12 and 10 years.
      Ordering the observation: 5, 7, 8, 10, 12
      The rank of the median = (n+1)/2 = (5+1)/2 = 6/2 = 3
      The median = 8 years.
    title: 'Median: اللي واقف في النص'
    text: |-
      ==رتّب الأول== (أي غلطة هنا بتضيّع السؤال).

      - **n فردي**: الـ rank = ==(n + 1) ÷ 2==. القيم 5، 8، 7، 12، 10 ← 5، 7، 8، 10، 12 ← الـ rank 3 ← **8 years**.
      - **n زوجي**: الـ ranks = n/2 و n/2 + 1، والـ median ==متوسطهم==. القيم 8، 6، 12، 3، 5، 7 ← 3، 5، 6، 7، 8، 12 ← (6 + 7) ÷ 2 = **6.5 kg**.
  - kind: explain
    page: 113
    quote: |-
      Definitions
      Mode
      the score that occurs most frequently
      Bimodal
      Multimodal
      No Mode
      denoted by M
      the only measure of central tendency that can be used with nominal data
    title: 'Mode: الأكتر تكرار'
    text: |-
      القيمة اللي بتتكرر أكتر، ورمزها **M**. ممكن تلاقي اتنين (**bimodal**)، أكتر (**multimodal**)، أو ==No mode== لو كله متكرر بنفس العدد.

      وهو ==الوحيد اللي ينفع مع الـ nominal data==.
  - kind: check
    page: 119
    quote: |-
      For qualitative data
      Modal interval (opposite the highest frequency)= "married" in the following table
      | Marital Status | Frequency |
      |---|---|
      | Single | 2 |
      | Married | 10 |
      | Divorced | 4 |
      | Widow | 3 |
      | Total | 19 |
    question: 'Single 2, married 10, divorced 4, widow 3. The mode is:'
    options:
    - Married
    - '10'
    - '19'
    answer: 0
    why:
    - 'صح: الـ mode هو الفئة نفسها.'
    - ده التكرار بتاعها، فخ مشهور.
    - ده الـ total.
  - kind: aside
    page: 118
    quote: |-
      Examples:
      Modal interval = 30<35 kg.
      Mid-point of modal interval = 32.5 kg (is better).
      | Weight (kg) | Frequency |
      |---|---|
      | 20- | 2 |
      | 25- | 4 |
      | 30- | 10 |
      | 35- | 5 |
      | 40-45 | 3 |
      | Total | 24 |
    tone: tip
    text: |-
      في الجدول (grouped): الـ **modal interval** = الفئة قصاد أعلى frequency (30<35 kg)، والـ ==midpoint of the modal interval== (32.5 kg) أحسن، بس للـ quantitative بس.
  - kind: figure
    page: 122
