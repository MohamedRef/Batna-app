  - id: neph.L10.023
    kind: mcq
    topic: atin-causes
    stem: Which of these is an infiltrative cause of acute tubulointerstitial nephritis in the book's list?
    options:
      - Sarcoidosis
      - Cimetidine
      - Acute cellular rejection
      - Sjögren's syndrome
      - Legionella
    answer: 0
    why:
      - "Correct: infiltration covers lymphoma, leukaemia and sarcoidosis (p339)."
      - Cimetidine is an allergic cause.
      - Acute cellular rejection is its own category.
      - Sjögren's is a non-infectious inflammatory disorder.
      - Legionella is an infectious cause.
    src: { page: 339, quote: "Infiltration (lymphoma, leukemia, sarcoidosis)" }
    status: unverified
  # ---------- p340: pathology, clinical picture, urine ----------
  - id: neph.L10.024
    kind: card
    topic: atin-picture
    front: What do the kidneys look like grossly in acute tubulointerstitial nephritis?
    back: Normal or enlarged; the cut section shows medullary congestion and necrosis with multiple abscesses.
    src: { page: 340, quote: "The kidneys are normal or enlarged, cut section with medullary congestion and necrosis with multiple abscesses." }
    status: unverified
  - id: neph.L10.025
    kind: card
    topic: atin-picture
    front: What does light microscopy show in acute tubulointerstitial nephritis?
    back: Interstitial oedema with an infiltrate of lymphocytes, plasma cells, eosinophils and macrophages.
    src: { page: 340, quote: "LM showed there is edema associated with an interstitial lymphoplasmocytic, oesinophils and macrophages infiltration" }
    status: unverified
    tags: [high-yield]
  - id: neph.L10.026
    kind: cloze
    topic: atin-picture
    text: "Symptoms of acute TIN can appear {{c1::2 to 14}} days after exposure."
    src: { page: 340, quote: "Symptoms can appear after two to fourteen days." }
    status: unverified
    tags: [numbers]
  - id: neph.L10.027
    kind: enumerate
    topic: atin-picture
    prompt: Mention the clinical picture of acute tubulointerstitial nephritis.
    points:
      - Onset 2–14 days after exposure
      - Haematuria and pyuria
      - Polyuria and nocturia
      - Deterioration of renal function
      - "Systemic manifestations: fever, chills, flank pain, arthralgia, rash, disturbed liver function"
      - Eosinophilia
    pass: 4
    src: { page: 340, quote: "Haematuria and pyuria." }
    status: unverified
  - id: neph.L10.028
    kind: enumerate
    topic: atin-picture
    prompt: Mention the systemic manifestations of acute tubulointerstitial nephritis.
    points:
      - Fever and chills
      - Flank pain
      - Arthralgia
      - Erythematous, pruritic maculopapular skin rash
      - Disturbed liver function (raised enzymes, GI bleeding)
    pass: 4
    src: { page: 340, quote: "Systemic manifestations: Fever, chills, flank pain, arthralgia, erythematous," }
    status: unverified
  - id: neph.L10.029
    kind: mcq
    topic: atin-picture
    stem: A 35-year-old woman took amoxicillin for 10 days. She now has fever, an itchy maculopapular rash, arthralgia and a creatinine rising from 0.8 to 2.6 mg/dL. Urine shows white cells, red cells and eosinophils, and blood shows eosinophilia. Most likely diagnosis?
    options:
      - Allergic acute tubulointerstitial nephritis
      - Acute pyelonephritis
      - Drug-induced minimal change disease
      - Drug-induced thrombotic microangiopathy
      - Analgesic nephropathy
    answer: 0
    why:
      - "Correct: an antibiotic 2–14 days before, fever, rash, arthralgia, eosinophilia and cellular urine is allergic acute TIN (p339–340)."
      - Pyelonephritis gives loin pain and significant bacteriuria, not rash and eosinophilia.
      - Minimal change presents with nephrotic proteinuria, not fever, rash and pyuria.
      - TMA follows mithramycin or ciclosporin, not amoxicillin.
      - Analgesic nephropathy is chronic, after years of analgesic use.
    src: { page: 340, quote: "Systemic manifestations: Fever, chills, flank pain, arthralgia, erythematous," }
    status: unverified
    tags: [high-yield]
  - id: neph.L10.030
    kind: card
    topic: atin-labs
    front: What does the urine sediment usually show in acute TIN?
    back: It may be normal, but usually contains cellular elements; pyuria, red cells and eosinophils.
    src: { page: 340, quote: "May be normal, but usually contain cellular elements (pyuria, red blood cells" }
