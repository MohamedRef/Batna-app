          </svg>
      - kind: check
        page: 323
        quote: "Changes in immunological tests (anti-dsDNA, serum C3) have only limited ability to predict the response to treatment and may be used only as supplemental information."
        question: "Which best predicts the outcome of lupus nephritis therapy, per the lecture?"
        options:
          - "Biopsy, sediment, proteinuria and kidney function together"
          - "Anti-dsDNA titre alone"
          - "Serum C3 alone"
          - "ANA titre"
        answer: 0
        why:
          - "صح: ليهم independent predictive ability، ويتفسّروا مع بعض."
          - "الـ anti-dsDNA دوره محدود، supplemental."
          - "الـ C3 كمان محدود."
          - "الـ ANA مش أداة متابعة."
      - kind: reveal
        page: 323
        quote: "Dialysis and transplantation in SLE have rates for long-term patient and graft-survival comparable with those observed in non-diabetic non-SLE patients, with transplantation being the method of choice."
        prompt: "ليه الكتاب بيقول إن الـ anti-dsDNA والـ C3 «supplemental» بس، وليه الـ transplant مقبول في عيان lupus؟"
        answer: |
          **المتابعة:** الـ biopsy والـ sediment والـ proteinuria والـ kidney function بيقيسوا **الكلية نفسها**، فليهم ==independent predictive ability==. أما الـ anti-dsDNA والـ C3 بيقيسوا **نشاط المناعة** بشكل عام، فتغيّرهم ما بيتنبأش كويس بالـ response. يعني بتبص على العضو مش على الدم بس.

          **الـ ESRD:** نتايج الـ dialysis والـ transplant في الـ SLE **زي** غير الـ diabetic غير الـ SLE، علشان كده مفيش سبب تحرم العيان من الـ transplant، وهو ==method of choice==. وبما إن الـ **flares** بعد الـ remission مش نادرة، المتابعة لازم تفضل مستمرة.
      - kind: try
        items: [rheum.L19.084, rheum.L19.086, rheum.L19.088, rheum.L19.090, rheum.L19.092]
    recap:
      - "4 من 11: SOAP BRAIN MD. الأحدث: ANA ≥ 1:80 ثم ≥ 10 نقط."
      - "LN: biopsy + sediment + proteinuria + function؛ dsDNA و C3 supplemental."
      - "Proliferative: GCs + immunosuppressant؛ MMF زي الـ CYC وأأمن؛ flares ← follow-up؛ transplant للـ ESRD."
