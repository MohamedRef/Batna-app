      - kind: explain
        remind: [geri.L11.042]
        page: 199
        quote: "COPD-based respiratory impairments include\n  (1) Mucus hyper secretion.\n  (2) Chronic airflow obstruction.\n  (3) Air trapping and hyperinflation,\n  (4) Gas exchange abnormalities. (V / Q mismatch)."
        title: "الـ impairments"
        text: |
          الـ COPD بيعمل أربع مشاكل: **mucus hypersecretion**، **chronic airflow obstruction**، **air trapping و hyperinflation**، و **V/Q mismatch**.

          - الـ ==chronic bronchitis==: كحة وبلغم **3 شهور في السنة لمدة سنتين ورا بعض**؛ الـ hallmark هو الـ mucus hypersecretion من airway inflammation مستمر.
          - أهم مكان للـ resistance: airways **أقل من 2 mm**.

          ليه الصغيرة بالذات؟ التفسير المقبول (مش في الكتاب): هي اللي مفيهاش غضروف يسندها، فبتعتمد على شد الـ alveoli اللي حواليها عشان تفضل مفتوحة (الرسمة اللي فاتت). الالتهاب والـ mucus بيضيّقوها من جوّه، والـ emphysema بيشيل الشد من برّه.
      - kind: check
        page: 199
        quote: "Mucus hypersecretion is the hallmark of chronic bronchitis, defined as chronic cough and sputum production for at least 3 months per year for 2 consecutive years."
        question: "Which history meets the book's definition of chronic bronchitis?"
        options:
          - "Productive cough 3 months a year, two years in a row"
          - "Productive cough for 3 weeks after a cold"
          - "Dry cough for 2 months"
          - "Breathlessness on stairs for 2 years"
        answer: 0
        why:
          - "صح: 3 شهور في السنة لمدة سنتين متتاليتين، مع بلغم."
          - "ده عابر بعد عدوى، مش chronic."
          - "التعريف محتاج sputum، والمدة مش كفاية."
          - "الـ dyspnea مش جزء من تعريف الـ chronic bronchitis؛ الـ hallmark هو الـ mucus."
      - kind: explain
        page: 199
        quote: "Clinical picture (some notes)\n  Exercise intolerance, symptom-limiting dyspnea.\n  Increased risk of respiratory failure.\n  GAS exchange abnormalities\n  In advanced COPD hypoxemia and hypercapnia, yieldingacute/chronic respiratory acidosis (resp. failure).\n  Hypoxic pulmonary vasoconstriction, pulmonary hypertension and cor pulmonale.\n  Marked intrathoracic pressure swings can decrease left ventricular preload and increase left ventricular diastolic dysfunction, ultimately reducing the cardiac output.\n  The systemic inflammation, immune response, anorexia, and severe deconditioning of COPD most often seen with the emphysema phenotype, can lead to osteoporosis and sarcopenia."
        title: "الصورة الإكلينيكية"
        text: |
          - Exercise intolerance و dyspnea بيحددوا النشاط، وخطر **respiratory failure**.
          - المتقدم: hypoxemia و hypercapnia → respiratory acidosis.
          - **Hypoxic pulmonary vasoconstriction** → pulmonary hypertension → ==cor pulmonale==.
          - تقلبات الضغط جوه الصدر بتقلل الـ left ventricle (LV) preload وتزود الـ diastolic dysfunction، فالـ cardiac output يقل.
          - الـ emphysema phenotype بالذات (inflammation، anorexia، deconditioning) بيعمل **osteoporosis و sarcopenia**.

          ليه الـ vasoconstriction؟ الـ alveoli اللي مفيهاش أكسجين بتقفّل الأوعية اللي جنبها عشان الدم يروح للحتت اللي فيها هوا. ده شاطر لو حتة صغيرة، بس لو الرئة كلها، الضغط في الـ pulmonary artery بيعلى والقلب اليمين يتعب (التفسير المقبول، مش في الكتاب).
      - kind: sort
        page: 200
        quote: "Clinical Phenotypes\n  (A) Airway Predominant\n  Airflow obstruction:\n    Airflow obstruction, without chronic bronchitis, bronchiectasis, or emphysema.\n  Chronic bronchitis:\n    Airflow obstruction, with chronic cough and sputum production for at least 3 mo/y for 2 consecutive years, and with persistent airway inflammation and colonization/infection.\n  Bronchiectasis:\n    Airflow obstruction (usually severe), with isolation of bacteria from sputum (especially pseudomonas), increased sputum inflammatory markers, and at least one COPD exacerbation in the prior year small airway wall thickness and bronchiectasis on volumetric chest computed tomography.\n  COPD-asthma overlap:\n    Airflow obstruction, with enhanced response to inhaled corticosteroids (but not fully reversible), eosinophilia in respiratory secretions, high IgE History of smoking ( 10 pack-years), asthma, and / or atopy.\n    (B) Emphysema Predominant\n    Emphysema:\n      Airflow obstruction, with alveolar-capillary destruction and airspace enlargement Moderate-to-severe hyperinflation and air trapping,±pulmonary hypertension, emphysema on volumetric chest computed tomography Severe dyspnea and exercise intolerance, low BMI."
        prompt: "حط كل phenotype في مجموعته:"
        bins: ["Airway predominant", "Emphysema predominant / other"]
