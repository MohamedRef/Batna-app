  - id: endo.L04.lesson4
    title: "الكلية والإنسولين والـ parathyroid"
    hook: "مريض سكر على إنسولين، كليته بتضعف، والـ hypo بقت بتجيله بالليل. الإنسولين ما اتغيرش… مين اللي اتغير؟"
    minutes: 9
    pages: [50, 52]
    topics: [crf-glucose, crf-hpt]
    goals:
      - "تعرف أنماط الجلوكوز في الـ CRF وليه الـ normoglycaemia بتبقى على حساب الإنسولين"
      - "تحفظ أرقام الـ insulin handling في الكبد والكلية"
      - "تشرح الـ secondary hyperparathyroidism بأسبابه الأربعة"
    status: unverified
    steps:
      - kind: explain
        remind: [endo.L04.057]
        page: 50
        quote: "1. No significant disturbances in carbohydrate metabolism were found in patients with mild (initial) CRF."
        title: "الجلوكوز مع تقدم الـ CRF"
        text: |
          الـ CHO metabolism في الـ CRF ليه جزئين: **glucose** و **insulin**.
          - **Mild (initial) CRF**: مفيش تغيير مهم.
          - **Moderate/advanced**: الـ carbohydrate metabolism بيبوظ، والـ basal immunoreactive insulin بيميل يعلى.

          الأنماط اللي ممكن تشوفها: normoglycaemia، **hypoglycaemia**، بطء نزول الجلوكوز بعد الـ glucose load، fasting hyperglycaemia، و glucose intolerance. يعني المريض الواحد ممكن يتقلب بين الطرفين، وده بيفسّر ليه السكر في الكلى صعب يتظبط.
      - kind: reveal
        page: 51
        quote: "Normoglycaemia is maintained at the expense of hyperinsulinaemia."
        prompt: "مريض CRF عنده insulin resistance والجلوكوز طبيعي. إزاي؟"
        answer: "البنكرياس بيعوّض: ==hyperinsulinaemia== و C-peptide عالي. يعني الـ normoglycaemia **على حساب** الإنسولين العالي. ولو الـ secretion طبيعي أو قل شوية، يظهر impaired basal glucose أو glucose intolerance."
      - kind: figure
        page: 51
        quote: "b) Insulin and the Kidney\nCRF is associated with several disorders in insulin metabolism.\nApproximately 40–50% of the endogenous insulin produced by the pancreas is metabolized by the liver in its first pass.\nAbout 65% of insulin that reaches the kidney is filtered in the glomerulus and is, subsequently, metabolized in the proximal tubular cells.\nLess than 1% of filtered insulin appeaars in the urine.\nWheras, 30–80% of exogenous insulin is metabolized particularly in the kidney."
        title: "رحلة الإنسولين"
        alt: "Flow from pancreas to liver, where 40 to 50 percent of endogenous insulin is removed on first pass, then to the kidney, where about 65 percent is filtered and broken down in proximal tubules and less than 1 percent reaches urine. A separate box: injected insulin is 30 to 80 percent metabolised, mainly by the kidney."
        caption: "الكبد بياخد نص الإنسولين الطبيعي، بس الكلية هي اللي بتكسّر الإنسولين المحقون."
        svg: |
