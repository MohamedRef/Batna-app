      - kind: explain
        remind: [git.L10.014, git.L10.015]
        page: 271
        quote: "Neuromuscular disorders: as; ALS (amyotrophic Lateral Sclerosis), CNS tumors (benign or malignant), Multiple sclerosis, Muscular dystrophy, Myasthenia gravis, Parkinson disease, Polymyositis or dermatomyositis, Stroke."
        title: "A. Oropharyngeal: الأعصاب أو البنية"
        text: |
          أسباب الـ ==oropharyngeal== dysphagia نوعين:

          - **Neuromuscular**: amyotrophic lateral sclerosis (ALS)، central nervous system (CNS) tumors، multiple sclerosis، muscular dystrophy، myasthenia gravis، Parkinson، polymyositis/dermatomyositis، stroke.
          - **Structural**: carcinoma، osteophytes، prior surgery or radiation، proximal esophageal web، thyromegaly، **Zenker diverticulum**.

          ليه الأمراض العصبية دي بالذات؟ لأن البلعة في البلعوم **reflex معقّد** بيحتاج أعصاب (brainstem، cranial nerves) وعضلات striated و neuromuscular junction. أي حلقة منهم تقع (stroke، ALS، myasthenia، myositis) والأكل يروح للـ airway. والـ structural: حاجة بتسد أو بتشد من برّه، زي الـ **Zenker** اللي بيخزّن أكل ويرجّعه.
      - kind: reveal
        page: 271
        quote: "Structural: as Carcinoma, Osteophytes and other spinal disorders, Prior surgery or radiation therapy, Proximal esophageal web, Thyromegaly, or Zenker diverticulum."
        prompt: "عيان كبير بيقول الأكل بيرجع لبُقه بعد ساعات وريحة نَفَسه وحشة، وبيسمع قرقرة في رقبته. أنهي سبب structural في قايمة الكتاب؟ وليه الأعراض دي؟"
        answer: |
          الـ **Zenker diverticulum**، وهو في قايمة الـ **oropharyngeal structural** في الكتاب.

          التفسير المقبول (مش في الكتاب): ده كيس بيطلع من نقطة ضعيفة في ضهر البلعوم فوق الـ UES مباشرة. الأكل بيدخل الكيس ويقعد فيه، فيتعفّن (ريحة وحشة) ويرجع بعد ساعات من غير ما يتهضم، وممكن يتسحب للرئة (aspiration). علشان كده الـ endoscope لازم يدخل بحذر.
      - kind: explain
        remind: [git.L10.018]
        page: 272
        quote: "Primary: like Achalasia, Diffuse esophageal spasm, Hypercontractile (jackhammer) esophagus, Hypertensive LES, Nutcracker (high-pressure) esophagus"
        title: "B. Esophageal: حركة ولا سدّة؟"
        text: |
          الـ ==esophageal== dysphagia (نص وتحت المريء) نوعين كبار:

          - **Neuromuscular (motility)**: primary زي achalasia، DES، jackhammer، hypertensive LES، nutcracker. و secondary زي **Chagas**، reflux-related dysmotility، **scleroderma**.
          - **Structural (mechanical)**: intrinsic زي carcinoma، diverticula، **eosinophilic esophagitis**، rings and webs، Schatzki ring، foreign body، medication-induced و peptic stricture. و extrinsic: mediastinal mass، spinal osteophytes، vascular compression.

          ليه الـ **scleroderma** و **Chagas** secondary؟ التفسير المقبول (مش في الكتاب): الـ scleroderma بيتلّف الـ smooth muscle فالجزء اللي تحت مايتحركش والـ LES يرتخي (reflux)، والـ Chagas (Trypanosoma cruzi) بيموّت الأعصاب فيعمل صورة achalasia بالظبط. المريء نفسه سليم في الأول، والمرض جاي من برّه.
      - kind: reveal
        page: 272
        quote: "Extrinsic: Mediastinal mass, Spinal osteophytes, Vascular compression."
        prompt: "إزاي حاجة **برّه** المريء تعمل dysphagia؟ وإيه اللي يخليك تشك فيها؟"
        answer: |
          الكتاب بيعدّ الـ **extrinsic**: mediastinal mass، spinal osteophytes، vascular compression.

          التفسير المقبول (مش في الكتاب): المريء ماسورة طرية في الـ mediastinum، محشورة بين العمود الفقري وراه والقلب والأوعية قدامه. أي حاجة تكبر جنبه (غدد، ورم، أورطى واسع، شريان شاذ، عضمة زايدة) بتضغط عليه من برّه. شك فيها لما الـ **mucosa سليمة في المنظار** بس فيه ضغط من برّه، وكمّل بـ CT.
      - kind: sort
