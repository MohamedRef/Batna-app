items:
  # ---------- p99: intro ----------
  - id: endo.L06.001
    kind: card
    topic: intro
    front: In which two ways can TFT results seem confusing?
    back: They can be discordant with the clinical picture, or appear incongruent with each other.
    src: { page: 99, quote: "Thyroid function tests (TFTs) are amongst the most commonly requested laboratory investigations.\nMost TFTs are straight forward to interpret and confirm the clinical impression of euthyroidism, hypothyroidism or hyperthyroidism.\nHowever, in an important subgroup of patients the results of TFTs can seem confusing, either by:\n  Being discordant with the clinical picture.\n  Appear incongruent with each other." }
    status: unverified
  - id: endo.L06.002
    kind: enumerate
    topic: intro
    prompt: Which confounding factors should be considered when TFTs seem confusing?
    points: [Pregnancy, Non-thyroidal illness, Medication usage, Laboratory artifact, "Rare genetic disorder, e.g. resistance to thyroid hormone"]
    pass: 5
    hook: "لما الـTFTs تحيّرك اسأل 5: «حامل؟ عيانة؟ بتاخد دوا؟ المعمل غلطان؟ ولا الجينات؟» = pregnancy، non-thyroidal illness، medication، laboratory artifact، ومرض وراثي نادر زي resistance to thyroid hormone."
    src: { page: 99, quote: "In such cases, certain confounding factors are considered:\n  Pregnancy.\n  Non-thyroidal illness.\n  Medication usage.\n  Laboratory artifact.\n  Rare genetic disorder e.g: resistance to thyroid hormone." }
    status: unverified
    tags: [high-yield]
  # ---------- p100-101: physiology ----------
  - id: endo.L06.003
    kind: card
    topic: physiology
    front: What do an individual's T4 and T3 levels reflect over a lifetime?
    back: They stay relatively constant and reflect that person's own set-point of the HPT axis (tightly regulated by TRH and TSH).
    src: { page: 100, quote: "HPT axis physiology and TH action\n  The production is tightly regulated by TRH and TSH.\n  In any given individual T4 and T3 concentrations remain relatively constant throughout life, and reflect the ‗set-point' of the (HPT) axis in that individual.\n  In the euthyroid state, the thyroid gland secretes:\n    85–90% T4 and 10–15% T3.\n    Both of which are heavily (>99.5%) protein bound to:\n      TBG.\n      Albumin\n      Transthyretin (prealbumin)." }
    status: unverified
  - id: endo.L06.004
    kind: cloze
    topic: physiology
    text: "The euthyroid gland secretes {{c1::85-90%}} T4 and {{c2::10-15%}} T3, both more than {{c3::99.5%}} protein bound."
    src: { page: 100, quote: "HPT axis physiology and TH action\n  The production is tightly regulated by TRH and TSH.\n  In any given individual T4 and T3 concentrations remain relatively constant throughout life, and reflect the ‗set-point' of the (HPT) axis in that individual.\n  In the euthyroid state, the thyroid gland secretes:\n    85–90% T4 and 10–15% T3.\n    Both of which are heavily (>99.5%) protein bound to:\n      TBG.\n      Albumin\n      Transthyretin (prealbumin)." }
    status: unverified
    tags: [numbers, high-yield]
  - id: endo.L06.005
    kind: enumerate
    topic: physiology
    prompt: Which proteins bind thyroid hormones in serum?
    points: [TBG, Albumin, "Transthyretin (prealbumin)"]
    pass: 3
    hook: "الـ T4 بيركب 3 عربيات: TBG، albumin، وtransthyretin (prealbumin)."
    src: { page: 100, quote: "HPT axis physiology and TH action\n  The production is tightly regulated by TRH and TSH.\n  In any given individual T4 and T3 concentrations remain relatively constant throughout life, and reflect the ‗set-point' of the (HPT) axis in that individual.\n  In the euthyroid state, the thyroid gland secretes:\n    85–90% T4 and 10–15% T3.\n    Both of which are heavily (>99.5%) protein bound to:\n      TBG.\n      Albumin\n      Transthyretin (prealbumin)." }
    status: unverified
  - id: endo.L06.006
    kind: card
    topic: physiology
    front: Which transporter carries thyroid hormone into cells such as the brain?
    back: Monocarboxylate transporter 8 (MCT8); it also governs TH efflux from the thyroid gland.
    src: { page: 100, quote: "Cellular entry of TH in many tissues (e.g. the brain) is dependent on specific membrane proteins monocarboxylate transporter 8 (MCT8), these transportersalso govern TH efflux from thyroid gland." }
    status: unverified
  - id: endo.L06.007
    kind: table
    topic: physiology
    title: The deiodinases (pre-receptor regulation)
    columns: [Enzyme, Action]
    rows:
      - [Hepatic type 1 DIO, Peripheral T4 to T3 conversion]
      - [DIO2, T4 to T3 in the hypothalamus and pituitary]
      - [DIO3, "T4 to reverse T3 and T3 to T2 (limits TH action)"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 100, quote: "A further regulation of TH action is provided at a pre-receptor level by a family of intra cellular deiodinases (DIOs)" }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.008
    kind: card
    topic: physiology
    front: Which is the principal bioactive thyroid hormone, and how does it act?
    back: T3; it binds a nuclear thyroid hormone receptor (TR) in target cells.
    src: { page: 101, quote: "T3 is the principal bioactive hormone and its major actions are mediated by binding to a receptor (TR) in the nucleus of target cells." }
    status: unverified
  - id: endo.L06.009
    kind: cloze
    topic: physiology
    text: "The thyroid hormone receptor genes are {{c1::THRA}} on chromosome {{c2::17}} and {{c3::THRB}} on chromosome 3; splicing gives TRα1, TRα2, TRβ1 and TRβ2."
    src: { page: 101, quote: "2 thyroid hormone receptor genes (THRA, THRB) exist on chromosomes 17 and 3 respectively." }
    status: unverified
  # ---------- p102: screening ----------
  - id: endo.L06.010
    kind: card
    topic: screening
    front: Why was TSH recommended as the frontline thyroid screening test?
    back: Modest changes in thyroid hormone concentrations produce marked excursions in TSH.
    src: { page: 102, quote: "TSH has been recommended as a frontline screening test for thyroid dysfunction, as a modest changes in TH concentrations are associated with marked excursions in TSH." }
    status: unverified
  - id: endo.L06.011
    kind: card
    topic: screening
    front: What does the lecture now advise for routine thyroid screening, and why?
    back: Both FT4 and TSH, because screening with TSH alone misdiagnoses some cases.
    src: { page: 102, quote: "Accordingly, it is now routinely thyroid screening should be done with both FT4 and TSH." }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.012
    kind: enumerate
    topic: screening
    prompt: Conditions in which measuring TSH alone may be misleading.
    points: ["Recent treatment for thyrotoxicosis (TSH stays suppressed)", Non-thyroidal illness, TSH assay interference, Central hypothyroidism, TSH-secreting pituitary adenoma, Resistance to thyroid hormone, Disorders of TH transport or metabolism]
    pass: 5
    hook: "الـTSH لوحده يضحك عليك في 7: 3 «حالة ومعمل» (thyrotoxicosis اتعالجت قريب والـTSH لسه suppressed، non-thyroidal illness، TSH assay interference) + 2 «pituitary» (central hypothyroidism، TSH-secreting adenoma) + 2 «الهرمون» (resistance to thyroid hormone، disorders of TH transport أو metabolism). 3 + 2 + 2 = 7."
    src: { page: 102, quote: "Conditions in which measurement of TSH alone may be misleading.\nRecent treatment for thyrotoxicosis (TSH may remain suppressed even when TH concentrations have normalised)\nNon-thyroidal illness\nTSH assay interference\nCentral hypothyroidism (e.g. hypothalamic/pituitary disorders)\nTSH-secreting pituitary adenoma (thyrotropinoma/TSHoma)\nResistance to thyroid hormone (RTH)\nDisorders of thyroid hormone transport or metabolism" }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.013
    kind: card
    topic: screening
    front: Why may TSH mislead after recent treatment of thyrotoxicosis?
    back: TSH may remain suppressed even when thyroid hormone concentrations have normalised.
    src: { page: 102, quote: "Conditions in which measurement of TSH alone may be misleading.\nRecent treatment for thyrotoxicosis (TSH may remain suppressed even when TH concentrations have normalised)\nNon-thyroidal illness\nTSH assay interference\nCentral hypothyroidism (e.g. hypothalamic/pituitary disorders)\nTSH-secreting pituitary adenoma (thyrotropinoma/TSHoma)\nResistance to thyroid hormone (RTH)\nDisorders of thyroid hormone transport or metabolism" }
    status: unverified
  - id: endo.L06.014
    kind: card
    topic: screening
    front: A patient on levothyroxine has optimal TFTs but ongoing symptoms. What does the lecture say?
    back: Restoring euthyroidism in the HPT axis does not equal resolution of hypothyroidism in other tissues; tissue markers of TH action are needed.
    src: { page: 102, quote: "Some patients on thyroid hormone replacement therapy report ongoing symptoms despite optimal thyroid function tests; in these patients restoring euthyroidism in the HPTaxis does not equate with resolution of hypothyroidism in other target tissues & for these patients tissue markers of TH action are required." }
    status: unverified
  # ---------- p103: patterns ----------
  - id: endo.L06.015
    kind: table
    topic: patterns
    title: The seven TFT patterns (book figure, p103)
    columns: [Pattern, Main causes]
    rows:
      - ["FT4/FT3 ↑, TSH ↓", "Graves', toxic MNG, toxic adenoma, thyroiditis, amiodarone/iodine, excess thyroxine, hyperemesis/mole, congenital"]
      - ["FT4/FT3 normal, TSH ↓", "Subclinical hyperthyroidism, recent treatment, steroids/dopamine, assay interference, NTI"]
      - ["FT4/FT3 ↓, TSH normal or ↓", "NTI, central hypothyroidism, isolated TSH deficiency, assay interference"]
      - ["FT4/FT3 normal, TSH ↑", "Subclinical hypothyroidism, poor compliance, malabsorption, amiodarone, assay interference, NTI recovery, TSH resistance"]
      - ["FT4/FT3 ↓, TSH ↑", "Hashimoto's/atrophic, post-RAI or surgery, hypothyroid phase of thyroiditis, drugs, iodine, neck irradiation, Riedel's, infiltration, congenital"]
      - ["FT4/FT3 ↑, TSH normal or ↑", "Assay interference/FDH, thyroxine therapy, amiodarone/heparin, NTI, neonatal, TSHoma, RTH, transport disorders"]
    blanks: [[2, 1], [3, 1], [5, 1]]
    src: { page: 103, quote: "When interpreting TFTs seven major patterns should be considered:" }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.016
    kind: card
    topic: patterns
    front: "Raised FT4/FT3 with a normal or raised TSH: which causes does the lecture list?"
    back: "Assay interference or FDH, thyroxine replacement (including poor compliance), drugs (amiodarone, heparin), NTI including acute psychiatric disorders, the neonatal period, TSH-secreting pituitary adenoma, resistance to thyroid hormone, and TH transport or metabolism disorders."
    src: { page: 103, quote: "When interpreting TFTs seven major patterns should be considered:\n| TFT pattern | Causes |\n|---|---|\n| FT4/FT3 ↑, TSH ↓ | Graves' disease; toxic multinodular goitre; toxic adenoma; thyroiditis (post-viral, post-partum); drugs (amiodarone); excess iodine intake; excess thyroxine ingestion; pregnancy-related (hyperemesis gravidarum; hydatidiform mole); congenital hyperthyroidism |\n| FT4/FT3 ↔, TSH ↓ | subclinical hyperthyroidism; recent treatment for hyperthyroidism; drugs (e.g. steroids, dopamine); assay interference; NTI |\n| FT4/FT3 ↓, TSH ↔ or ↓ | NTI; central hypothyroidism; isolated TSH deficiency; assay interference |\n| FT4/FT3 ↔, TSH ↔ | (normal) |\n| FT4/FT3 ↔, TSH ↑ | subclinical hypothyroidism; poor compliance with thyroxine; malabsorption of thyroxine; drugs (e.g. amiodarone); assay interference; NTI recovery phase; TSH resistance |\n| FT4/FT3 ↑, TSH ↔ or ↑ | assay interference; FDH; thyroxine replacement therapy (including poor compliance); drugs (e.g. amiodarone, heparin); NTI (including acute psychiatric disorders); neonatal period; TSH-secreting pituitary adenoma; Resistance to thyroid hormone; Disorders of thyroid hormone transport or metabolism |\n| FT4/FT3 ↓, TSH ↑ | autoimmune thyroiditis (Hashimoto's; atrophic); post-radioiodine therapy/thyroidectomy; hypothyroid phase of thyroiditis; drugs (amiodarone, lithium, TKIs, ATDs); iodine deficiency or excess; neck irradiation; Riedel's thyroiditis; thyroid infiltration (tumour, amyloid); congenital hypothyroidism |" }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.017
    kind: card
    topic: patterns
    front: "Low FT4/FT3 with a normal or low TSH: causes?"
    back: NTI, central hypothyroidism, isolated TSH deficiency and assay interference.
    src: { page: 103, quote: "When interpreting TFTs seven major patterns should be considered:\n| TFT pattern | Causes |\n|---|---|\n| FT4/FT3 ↑, TSH ↓ | Graves' disease; toxic multinodular goitre; toxic adenoma; thyroiditis (post-viral, post-partum); drugs (amiodarone); excess iodine intake; excess thyroxine ingestion; pregnancy-related (hyperemesis gravidarum; hydatidiform mole); congenital hyperthyroidism |\n| FT4/FT3 ↔, TSH ↓ | subclinical hyperthyroidism; recent treatment for hyperthyroidism; drugs (e.g. steroids, dopamine); assay interference; NTI |\n| FT4/FT3 ↓, TSH ↔ or ↓ | NTI; central hypothyroidism; isolated TSH deficiency; assay interference |\n| FT4/FT3 ↔, TSH ↔ | (normal) |\n| FT4/FT3 ↔, TSH ↑ | subclinical hypothyroidism; poor compliance with thyroxine; malabsorption of thyroxine; drugs (e.g. amiodarone); assay interference; NTI recovery phase; TSH resistance |\n| FT4/FT3 ↑, TSH ↔ or ↑ | assay interference; FDH; thyroxine replacement therapy (including poor compliance); drugs (e.g. amiodarone, heparin); NTI (including acute psychiatric disorders); neonatal period; TSH-secreting pituitary adenoma; Resistance to thyroid hormone; Disorders of thyroid hormone transport or metabolism |\n| FT4/FT3 ↓, TSH ↑ | autoimmune thyroiditis (Hashimoto's; atrophic); post-radioiodine therapy/thyroidectomy; hypothyroid phase of thyroiditis; drugs (amiodarone, lithium, TKIs, ATDs); iodine deficiency or excess; neck irradiation; Riedel's thyroiditis; thyroid infiltration (tumour, amyloid); congenital hypothyroidism |" }
    status: unverified
  - id: endo.L06.018
    kind: card
    topic: patterns
    front: When should thyroid function tests be requested?
    back: Only when there are clinical features of a thyroid problem.
    src: { page: 103, quote: "1. Clinical thyroid status Thyroid function tests should only be requested when there are clinical features of thyroid problem." }
    status: unverified
  # ---------- p103-105: NTI ----------
  - id: endo.L06.019
    kind: card
    topic: nti
    front: Define non-thyroidal illness (sick euthyroid syndrome).
    back: A common finding after any acute or chronic illness, defined by the absence of an intrinsic abnormality of HPT function; a secondary, beneficial adaptive change that reduces metabolic rate.
    src: { page: 103, quote: "2. Non-thyroidal illness (sick euthyroid syndrome) A common pitfall is to overlook the confounding effects of NTI. NTI is a common finding following any acute or chronic illness defined by the absence of an intrinsic abnormality of HPT function." }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.020
    kind: card
    topic: nti
    front: How soon can thyroid hormone changes appear in NTI?
    back: Within 24 hours of the onset of the illness.
    src: { page: 104, quote: "Changes in TH may occur 24 h after the onset of nonthyroidal illness in subjects with:\n  Poor nutrition.\n  Starvation.\n  Sepsis.\n  Burns.\n  Malignancy.\n  Myocardial infarction.\n  Post-surgery.\n  Chronic liver and renal disease." }
    status: unverified
  - id: endo.L06.021
    kind: enumerate
    topic: nti
    prompt: In which conditions does NTI occur?
    points: [Poor nutrition, Starvation, Sepsis, Burns, Malignancy, Myocardial infarction, Post-surgery, Chronic liver and renal disease]
    pass: 6
    hook: "الـ NTI مع أي عيا جامد، 8: «جوع» (poor nutrition، starvation) + «عدوى وحروق» (sepsis، burns) + malignancy + MI + بعد العمليات + كبد وكلى مزمنين."
    src: { page: 104, quote: "Changes in TH may occur 24 h after the onset of nonthyroidal illness in subjects with:\n  Poor nutrition.\n  Starvation.\n  Sepsis.\n  Burns.\n  Malignancy.\n  Myocardial infarction.\n  Post-surgery.\n  Chronic liver and renal disease." }
    status: unverified
  - id: endo.L06.022
    kind: table
    topic: nti
    title: TFT pattern in non-thyroidal illness
    columns: [Test, Change]
    rows:
      - [Total T4, "↓"]
      - [Total T3, "↓"]
      - [Reverse T3, "↑"]
      - [TSH, "↓ or normal"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 104, quote: "nonthyroidal ↓TT4 ↓TT3 ↑ reverse T3 ↓ or N TSH illness" }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.023
    kind: card
    topic: nti
    front: Why do total hormones fall in NTI?
    back: Reduced TH binding capacity, secondary to a fall in TH binding-protein concentrations.
    src: { page: 104, quote: "The reduction in total hormone is due to reduced TH binding capacity secondary to a fall in TH binding protein concentrations." }
    status: unverified
  - id: endo.L06.024
    kind: enumerate
    topic: nti
    prompt: Enumerate the proposed mechanisms of NTI.
    points: [Reduced hypothalamic TRH from the paraventricular nuclei, Impaired pituitary TSH secretion, Decreased serum TH binding capacity, Reduced cellular uptake of T4 and T3, Altered deiodinase activity, Low leptin in malnutrition, "Pro-inflammatory cytokines (IL-1, IL-6, TNF-α)", Excess endogenous glucocorticoids]
    pass: 6
    hook: "الـNTI 8: 5 «على السكة» (TRH أقل من paraventricular nuclei، TSH أقل من الـpituitary، serum binding capacity أقل، cellular uptake لـT4 وT3 أقل، deiodinase متغير) + 3 «من برّه» (leptin واطي في malnutrition، cytokines IL-1 وIL-6 وTNF-α، وglucocorticoids داخلية زيادة). 5 + 3 = 8."
    src: { page: 104, quote: "Precise mechanisms of NTI is still debatable & include:\n  Reduced hypothalamic TRH secretion from paraventricular nuclei\n  Impaired pituitary TSH secretion\n  Decreased TH binding capacity in serum .\n  Reduced tissue/cellular uptake of T4 and T3\n  Altered deiodinase activity\n  ↓leptin in malnutrition.\n  Pro-inflammatory cytokines (IL-1, IL-6, TNF-a) in infectious, inflammatory and neoplastic states.\n  Excess endogenous glucocorticoids." }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.025
    kind: card
    topic: nti
    front: What can happen to TSH during recovery from an intercurrent illness, and why does it matter?
    back: TSH may become overtly elevated for a short time; knowing this transient phenomenon avoids a wrong diagnosis of hypothyroidism and needless treatment.
    src: { page: 105, quote: "During recovery from intercurrent illness, TH and TSH return to normal, although in some patients TSH may become overtly elevated for a short period of time, it is important to be aware of this transient phenomenon in order to avoid inappropriate diagnosis and treatment." }
    status: unverified
    tags: [high-yield]
  - id: endo.L06.026
    kind: mcq
    topic: nti
    stem: A 64-year-old man in ICU with septic shock has low total T4, low total T3, high reverse T3 and a low-normal TSH. He had no thyroid history. What is the best interpretation?
    options: [Non-thyroidal illness, Central hypothyroidism needing levothyroxine, Primary hypothyroidism, Subclinical hyperthyroidism]
    answer: 0
    why:
      - "Correct: ↓TT4, ↓TT3, ↑rT3 and normal or low TSH is the NTI pattern, an adaptive change."
      - "Central hypothyroidism needs pituitary disease; here the illness explains it, and rT3 is high."
      - "Primary hypothyroidism has a high TSH."
      - "Subclinical hyperthyroidism has normal hormones with low TSH."
    src: { page: 104, quote: "nonthyroidal ↓TT4 ↓TT3 ↑ reverse T3 ↓ or N TSH illness" }
    status: unverified
  - id: endo.L06.027
    kind: mcq
    topic: nti
    stem: Two weeks after recovering from pneumonia, a woman's TSH is 9 mU/L with a normal FT4. She feels well. What is the best next step per the lecture?
    options: [Repeat TFTs later; TSH can rise transiently in NTI recovery, Start levothyroxine now, Request a pituitary MRI, Diagnose Hashimoto's thyroiditis]
    answer: 0
    why:
      - "Correct: a short TSH rise during recovery is a known transient phenomenon."
      - "Treating now risks inappropriate treatment."
      - "A high TSH with normal FT4 does not suggest a pituitary tumour here."
      - "Hashimoto's needs more than one transient TSH value."
    src: { page: 105, quote: "During recovery from intercurrent illness, TH and TSH return to normal, although in some patients TSH may become overtly elevated for a short period of time, it is important to be aware of this transient phenomenon in order to avoid inappropriate diagnosis and treatment." }
    status: unverified
  # ---------- p105: pregnancy ----------
  - id: endo.L06.028
    kind: card
    topic: pregnancy
    front: Why does TBG rise in pregnancy?
    back: Oestrogen increases its hepatic synthesis, and its degradation is reduced.
    src: { page: 105, quote: "3. Pregnancy:\n  Pregnancy has a significant impact on hpt physiology.\n  Tbg ↑as a consequence of oestrogen-induced increased hepatic synthesis, together with reduced degradation.\n  Total t4 and t3 ↑ to 150% of non-pregnant values during the first half of pregnancy and maintained until parturition.\n  Transient ↑ in ft4 in first trimester is due to the stimulatory effects of ↑ hcg acting on the tsh receptor.\n  In hyperemesis gravidarum women become overtly thyrotoxic with a fully suppressed tsh.\n  In this setting, it is important to distinguish gestational hyperthyroidism from other causes of thyrotoxicosis (e.g. Graves' disease) & (trab) measurement is helpful." }
    status: unverified
  - id: endo.L06.029
    kind: cloze
    topic: pregnancy
