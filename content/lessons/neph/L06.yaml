  - id: neph.L06.lesson4
    title: "الـ K: ساكن جوّه، وليه بيعلى برّه"
    hook: "98% من الـ K جوّه الخلايا. أي حاجة تكسر الخلية أو تقفل الكلية، والـ 2% اللي برّه يبقوا قنبلة على القلب."
    minutes: 10
    pages: [135, 138]
    topics: [k-physiology, hyperk]
    goals:
      - "تعرف مين بيدخّل الـ K الخلايا وليه ده بيحمي القلب بعد الأكل"
      - "تعرف مين في الـ nephron بيقرر الـ K اللي في البول"
      - "تفرّق الـ pseudohyperkalemia والـ reverse وتعرف ليه بتحصل"
      - "تعرف ليه كل سبب في قايمة الكتاب بيعلّي الـ K"
    status: unverified
    steps:
      - kind: explain
        page: 135
        title: "الـ K ساكن جوّه الخلية"
        quote: "Insulin and B adrenergic catecholamines stimulate membrane Na /K ATPase to pump K into cells (in a 3:2 ratio)."
        text: |
          أول ما الـ K يتمص، بيدخل الخلايا بسرعة. الـ ==insulin== والـ **beta-adrenergic catecholamines** بيشغّلوا الـ **Na/K-ATPase** (3 Na برّه لكل 2 K جوّه).

          **98%** من الـ exchangeable K جوّه الخلية. الفرق ده هو اللي عامل الـ **resting membrane voltage**، علشان كده أي لخبطة في الـ K بتظهر في **القلب والعضلات والأعصاب**.
      - kind: reveal
        page: 135
        quote: "Insulin and B adrenergic catecholamines stimulate membrane Na /K ATPase to pump K into cells (in a 3:2 ratio)."
        prompt: "ليه الجسم محتاج الـ insulin والـ catecholamines يدخّلوا الـ K الخلايا بسرعة؟"
        answer: |
          الكتاب بيقول الـ K أول ما يتمص ==بيتخزّن بسرعة جوّه الخلايا== بالـ Na/K-ATPase (3 Na برّه : 2 K جوّه).

          التفسير المقبول (مش في الكتاب): وجبة فيها K كتير ممكن تدخّل كمية تساوي كل الـ K اللي في الـ ECF. الكلية بطيئة وبتطلّعه على ساعات، فلو فضل برّه كان القلب هيقف. الـ **insulin** اللي بيطلع مع الأكل بيخزّنه مؤقتًا جوّه الخلايا لحد ما الكلية تخلّص.

          وده نفسه اللي هنستغله في الطوارئ: insulin و albuterol (beta-2) يدخّلوا الـ K.
      - kind: figure
