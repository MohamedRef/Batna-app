        title: "الولادة والرضاعة"
        quote: "Labor and delivery Normal vaginal delivery without abdominal compression is the safest and recommended method of delivery in transplant recipients, as the renal allograft is placed in the false pelvis, and there is little risk of obstruction of the birth canal or mechanical injury to the allograft. Spontaneous labor can be allowed up to 38–40 weeks if there are no obstetrical complications. Cesarean section is indicated only for standard obstetric indications.(117)"
        text: |
