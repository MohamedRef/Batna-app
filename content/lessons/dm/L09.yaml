lecture: dm.L09
lessons:
  # ------------------------------------------------------------------
  - id: dm.L09.lesson1
    title: "الصورة الكبيرة والـ sulfonylureas"
    hook: "الـ type 2 مرض بيمشي لقدّام. نعرف امتى نضيف دوا، وأقدم دوا بيعصر الـ beta cell إزاي."
    minutes: 9
    pages: [103, 106]
    topics: [overview, su]
    goals:
      - "تحفظ سلّم الـ HbA1c: monotherapy ولا dual ولا triple"
      - "تعدّ الـ 8 classes"
      - "تفهم الـ SU بيقفل الـ KATP channel ليه بيعمل hypoglycemia وweight gain"
    status: unverified
    steps:
      - kind: explain
        page: 103
        title: "مرض بيمشي لقدّام"
        quote: "Type 2 diabetes is a progressive disease. In all stages diet therapy and exercise are fundamental in order to attain glycemic goals."
        text: |
          الـ **type 2 diabetes** ==progressive disease==: الـ beta cells بتتعب سنة ورا سنة.

          - في **كل** مرحلة: **diet therapy and exercise** هما الأساس.
          - لما الأول ما يكفّيش، نضيف تاني وتالت.
          - ومع ==beta-cell exhaustion== غالبًا هنحتاج **insulin**.

          الهدف: **treat to target** ونمنع أو نأخّر الـ complications.
      - kind: figure
        page: 103
        quote: "Initially oral monotherapy is used when the HBA1c is less than 7.5%"
        title: "سلّم الـ HbA1c وقت التشخيص"
        alt: "A three-step ladder. HbA1c below 7.5% starts with oral monotherapy; 7.5 to 9% can start with dual oral therapy; above 9% can start with dual or triple oral therapy."
        caption: "كل ما الـ HbA1c وقت التشخيص يعلى، تبدأ بأدوية أكتر. ==7.5== و ==9== هما الحدّين."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="160" width="290" height="50" rx="10" class="fg-good"/>
            <text x="35" y="182" class="t-b">HbA1c &lt; 7.5%</text>
            <text x="35" y="200" class="t-sm">Oral monotherapy</text>
            <rect x="20" y="95" width="290" height="50" rx="10" class="fg-acc"/>
            <text x="35" y="117" class="t-b">HbA1c 7.5 – 9%</text>
            <text x="35" y="135" class="t-sm">Can begin with dual oral therapy</text>
            <rect x="20" y="30" width="290" height="50" rx="10" class="fg-bad"/>
            <text x="35" y="52" class="t-b">HbA1c &gt; 9%</text>
            <text x="35" y="70" class="t-sm">Can begin with dual or triple oral therapy</text>
            <text x="165" y="20" text-anchor="middle" class="t-sm t-mut">later: insulin as beta cells fail</text>
          </svg>
      - kind: table
        page: 103
        quote: "Preprandial BG 80-130 mg/dl Postprandial BG <180 mg/dl HbA1c <7%"
        title: "ADA goals"
        columns: [Measure, Goal]
        rows:
          - [Preprandial BG, "80–130 mg/dl"]
          - [Postprandial BG, "<180 mg/dl"]
          - [HbA1c, "<7%"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: check
        page: 103
        quote: "If HBA1c at the time of diagnosis is ranging between 7.5% and 9% we can begin by dual oral therapy"
        question: "New type 2 DM, HbA1c 8.3% at diagnosis. How can you start, per the lecture?"
        options:
          - "Dual oral therapy"
          - "Oral monotherapy only"
          - "Insulin first"
          - "Diet alone for 6 months"
        answer: 0
        why:
          - "صح: 7.5–9% وقت التشخيص = ممكن تبدأ dual."
          - "الـ monotherapy لما يكون أقل من 7.5%."
          - "الكتاب ما قالش insulin في البداية هنا؛ الـ insulin لما الـ beta cells تتعب."
          - "الـ diet والرياضة أساس بس مش لوحدهم بالرقم ده."
      - kind: match
        page: 104
        quote: "8 distinct classes of oral antidiabetic agents are actually available"
        prompt: "الـ 8 classes: وصّل كل class بدوا منها"
        pairs:
          - ["Sulfonylurea", "Gliclazide"]
          - ["Biguanide", "Metformin"]
          - ["Meglitinide", "Repaglinide"]
          - ["Alpha-glucosidase inhibitor", "Acarbose"]
          - ["Thiazolidinedione", "Pioglitazone"]
          - ["SGLT2 inhibitor", "Empagliflozin"]
        why: "والاتنين الباقيين: **DPP-4 inhibitors** (sitagliptin) و **oral GLP-1 RA** (semaglutide). المجموع 8 classes."
      - kind: explain
        page: 104
        title: "الـ SU: بيعصر الـ beta cell"
        quote: "leading to closure of the ATP-sensitive K+ (KATP) channels."
        text: |
          الـ **sulfonylureas** بتنزّل الـ HbA1c حوالي **1.5%** (1–2%).

          الـ main effect **pancreatic**: الدوا يركب على الـ **SUR** على غشاء الـ beta cell، فيقفل ==KATP channels==، الخلية تعمل depolarization، والـ insulin يطلع.

          المهم: ده بيحصل **حتى لو السكر واطي**. افتكر الجملة دي، هي سر الـ side effects.
      - kind: table
        page: 104
        quote: "Glimepiride: 1-8 mg/d ……………………………( Intermediate acting)"
        title: "الأجيال والجرعات"
        columns: [Drug, Dose/day, Acting]
        rows:
          - ["Tolbutamide (1st)", "500–3000 mg", "Short 4–6 h"]
          - ["Chlorpropamide (1st)", "100–500 mg", "Long 24–60 h"]
          - ["Glibenclamide", "0.5–20 mg", Intermediate]
          - ["Gliclazide MR", "30–120 mg", Intermediate]
          - ["Glipizide", "2.5–40 mg", Short]
          - ["Glimepiride (3rd)", "1–8 mg", Intermediate]
        hide: [[1, 2], [4, 2], [5, 1]]
      - kind: aside
        tone: exam
        page: 106
        quote: "SURx (65 Kd) in pancreatic -cells for binding of glimepiride (3rd generation SU)"
        text: |
          سؤال حلو للـ MCQ: معظم الـ SUs بتركب على **SUR1 (140 kDa)**، أما ==glimepiride== فبيركب على **SURx (65 kDa)**.

          والـ glimepiride وبعض الجيل التاني ليهم extrapancreatic effects (GLUT4 translocation، adiponectin ↑، TNF-alpha ↓)، بس الكتاب بيقول الموضوع **controversial**.
      - kind: reveal
        page: 106
        quote: "Hypoglycemia. Weight gain. Skin rashes. Cholestatic jaundice in case of chlorpropamide & acetohexamide"
        prompt: "ليه الـ SU بيعمل hypoglycemia و weight gain مع بعض؟"
        answer: |
          لأنه بيطلّع **insulin** من غير ما يسأل السكر كام. لو العيان ما أكلش، الـ insulin شغال ← **hypoglycemia**.

          والـ insulin هرمون **anabolic** بيخزّن دهون، وكمان العيان بياكل علشان يعالج الهبوط ← **weight gain**.

          باقي الـ side effects: skin rashes، **cholestatic jaundice** (chlorpropamide و acetohexamide)، blood dyscrasia، و primary/secondary failure كتير.
      - kind: aside
        tone: joke
        page: 106
        quote: "Advantages: o High efficacy o Inexpensive"
        text: "الـ SU زي الميكانيكي اللي في أول الشارع: **High efficacy** و **Inexpensive**، بس ساعات يشد العربية زيادة عن اللزوم ويوقعك في hypoglycemia. 😅"
      - kind: check
        page: 106
        quote: "Effect on CVD: neutral. 7. Effect on HF: neutral. 8. Effect on progression of DKD: neutral."
        question: "Sulfonylureas' effect on CVD, heart failure and DKD progression?"
        options:
          - "Neutral, neutral, neutral"
          - "Benefit, neutral, benefit"
          - "Neutral, increased risk, neutral"
          - "Benefit, benefit, benefit"
        answer: 0
        why:
          - "صح: الـ SU **neutral** في التلاتة."
          - "ده أقرب للـ SGLT2i أو metformin (potential CV benefit)."
          - "الـ increased HF risk ده للـ TZDs."
          - "ده SGLT2i تقريبًا، مش SU."
      - kind: try
        items: [dm.L09.002, dm.L09.007, dm.L09.008, dm.L09.013, dm.L09.019]
    recap:
      - "Diet and exercise في كل مرحلة. HbA1c <7.5% mono، 7.5–9% dual، >9% dual أو triple."
      - "ADA: preprandial 80–130، postprandial <180، HbA1c <7%."
      - "8 classes: SU، biguanide، AGI، meglitinide، TZD، DPP-4i، SGLT2i، oral GLP-1 RA."
      - "SU: يقفل KATP ← insulin حتى مع سكر واطي ← hypoglycemia + weight gain. HbA1c ↓ 1.5%."
      - "Glimepiride على SURx (65 kDa). Cholestasis: chlorpropamide و acetohexamide. CVD/HF/DKD: neutral."
    practice: [dm.L09.140, dm.L09.141, dm.L09.001, dm.L09.002, dm.L09.003, dm.L09.004, dm.L09.005, dm.L09.006, dm.L09.007, dm.L09.008, dm.L09.009, dm.L09.010, dm.L09.011, dm.L09.012, dm.L09.013, dm.L09.014, dm.L09.015, dm.L09.016, dm.L09.017, dm.L09.018, dm.L09.019, dm.L09.020, dm.L09.021, dm.L09.022, dm.L09.023]
