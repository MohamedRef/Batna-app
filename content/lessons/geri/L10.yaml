      - kind: explain
        remind: [geri.L10.067]
        page: 183
        quote: "Bronchoalveolar lavage (BAL) and surgical lung biopsy are not recommended (risks outweigh benefits); guidelines strongly recommend AGAINST transbronchial lung biopsy in this situation."
        title: "أربع نتايج للـ HRCT"
        text: |
          الـ HRCT في ILD جديد بيطلّع واحد من أربعة: **definite UIP**، **probable UIP**، **indeterminate for UIP**، أو **alternate diagnosis**.

          - **Definite UIP** (والأسباب التانية اتنفت): لا BAL ولا surgical biopsy، لأن ==risks outweigh benefits==، والـ guideline **ضد** الـ transbronchial biopsy بقوة. على العلاج على طول.
          - **الباقي**: BAL و surgical lung biopsy، وكتير محتاجين open أو thoracoscopic biopsy.

          ليه الـ definite UIP يكفي؟ التفسير المقبول (مش في الكتاب): لما الشكل على الـ HRCT واضح كده، الـ biopsy مش هتضيف معلومة تغيّر العلاج، وهتضيف خطر.

          وماتطلبش **serum matrix metalloproteinase 7** عشان تفرّق IPF من غيره: الـ false-positive والـ false-negative عاليين.
