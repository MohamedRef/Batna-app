lessons:
  # ------------------------------------------------------------------
  - id: dm.L01.lesson1
    title: "السكر: وقود الجسم وإزاي بيبوظ"
    hook: "السكر مش عدو: ده البنزين الوحيد. المشكلة لما يتصرف غلط ويتعمل زيادة في نفس الوقت."
    minutes: 8
    pages: [1, 3]
    topics: [definition, epidemiology, classification]
    goals:
      - "تعرّف الـ DM تعريف الكتاب"
      - "تحفظ أرقام مصر ونسبة type 1 لـ type 2"
      - "تقسّم الـ DM لـ primary و secondary بالأمثلة"
    status: unverified
    steps:
      - kind: explain
        page: 1
        title: "الجلوكوز: البنزين الوحيد"
        quote: "The only source of energy for every organism in the body Essential to fuel both aerobic and anaerobic cellular respiration."
        text: |
          الكتاب بيبدأ من الأساس: ==glucose== هو **the only source of energy** لكل عضو، وبيشغّل الـ **aerobic** والـ **anaerobic respiration**.

          - بيدخل الجسم كـ **galactose / fructose** (mono)، أو **lactose / sucrose** (di)، أو **starch** (poly).
          - الزيادة بتتخزن **glycogen**، وتطلع وقت الصيام.
          - ولو مفيش، الكبد يعمله من الدهون والبروتين بالـ **gluconeogenesis**.
          - المايسترو: **insulin** و **glucagon**.
      - kind: explain
        page: 1
        title: "تعريف الـ DM: مش مستخدم وبيتعمل زيادة"
        quote: "glucose is both underutilized as an energy source and overproduced due to inappropriate gluconeogenesis and glycogenolysis, resulting in hyperglycemia."
        text: |
          الـ **Diabetes mellitus** = group of chronic metabolic disorders of carbohydrate metabolism فيها الجلوكوز:
          - ==underutilized== كمصدر طاقة،
          - و ==overproduced== بسبب **inappropriate gluconeogenesis and glycogenolysis**،
          - والنتيجة **hyperglycemia**.

          السبب: defects of **insulin secretion**، **insulin action**، أو الاتنين.
      - kind: aside
        tone: analogy
        page: 1
        quote: "It results from defects of insulin secretion, insulin action or both."
        text: "تخيّل محطة بنزين: العربيات (الخلايا) مش عارفة تفوّل لأن المفتاح (**insulin**) ضايع أو الخزان مقفول (**resistance**)، وفي نفس الوقت المصنع (الكبد) فاكر إن في أزمة فبيضخ بنزين زيادة. الشارع (الدم) يغرق بنزين والعربيات واقفة."
      - kind: figure
        page: 1
        quote: "specific microvascular (retina, renal, peripheral nerves), and non-specific macrovascular (coronary, cerebral, peripheral blood vessels) complications."
        title: "المضاعفات: صغيرة ومخصوصة، وكبيرة ومش مخصوصة"
        alt: "Two columns. Left: microvascular, specific: retina, kidney, peripheral nerves. Right: macrovascular, non-specific: coronary, cerebral, peripheral vessels."
        caption: "الـ ==microvascular== **specific** للسكر (مش هتلاقي diabetic retinopathy من غير سكر)، والـ **macrovascular** **non-specific** لأن الـ atherosclerosis بيحصل من غير سكر كمان."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="150" height="180" rx="12" class="fg-acc"/>
            <text x="85" y="34" text-anchor="middle" class="t-b t-acc">Microvascular</text>
            <text x="85" y="52" text-anchor="middle" class="t-sm t-mut">specific</text>
            <text x="85" y="88" text-anchor="middle">Retina</text>
            <text x="85" y="118" text-anchor="middle">Kidney</text>
            <text x="85" y="148" text-anchor="middle">Peripheral nerves</text>
            <rect x="170" y="10" width="150" height="180" rx="12" class="fg-bad"/>
            <text x="245" y="34" text-anchor="middle" class="t-b t-bad">Macrovascular</text>
            <text x="245" y="52" text-anchor="middle" class="t-sm t-mut">non-specific</text>
            <text x="245" y="88" text-anchor="middle">Coronary</text>
            <text x="245" y="118" text-anchor="middle">Cerebral</text>
            <text x="245" y="148" text-anchor="middle">Peripheral vessels</text>
          </svg>
      - kind: table
        page: 2
        quote: "Prevalence rate in Egypt: 9.5% in the age group 20-79years."
        title: "أرقام الوبائيات"
        columns: [Fact, Number]
        rows:
          - ["Prevalence in Egypt", "9.5% (age 20–79)"]
          - ["Type 1 : type 2", "1 : 9"]
          - ["Incidence", "Type 1 very low, type 2 very high"]
          - ["Sex (type 2)", "Females > males"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: check
        page: 2
        quote: "The ratio between type 1 to type 2 diabetes is 1:9."
        question: "Out of 100 diabetics, about how many have type 1 by the lecture's ratio?"
        options: ["10", "50", "30", "1"]
        answer: 0
        why:
          - "صح: النسبة **1:9**، يعني 1 من كل 10."
          - "لا، type 2 هو الغالب بفرق كبير."
          - "أكتر من الحقيقة بكتير."
          - "ده قليل أوي؛ النسبة 1 لـ 9 مش 1 لـ 99."
      - kind: explain
        page: 2
        title: "الـ Classification"
        quote: "leading to absolute insulin deficiency, including LAD A"
        text: |
          **1. Primary DM**
          - **Type 1:** autoimmune β-cell destruction ← ==absolute insulin deficiency== (ومعاه **LADA**).
          - **Type 2:** non-autoimmune progressive loss of β-cell secretion: **insulin resistance (80%, obese)** أو **secretory defect (20%, non-obese)**.
          - **GDM.**

          **2. Secondary DM**
          - **Pancreatic:** pancreatitis، pancreatectomy، neoplasia، hemochromatosis.
          - **Endocrinopathies:** acromegaly، Cushing's، pheochromocytoma، hyperthyroidism.
          - **Drugs:** corticosteroids، thiazides، thyroid hormone، β-agonists.
      - kind: mnemonic
        page: 2
        quote: "Endocrinopathies: acromegaly, Cushing's syndrome, pheochromocytoma, and hyperthyroidism."
        word: "ACPH"
        parts:
          - { key: "A", text: "Acromegaly: growth hormone ضد الـ insulin" }
          - { key: "C", text: "Cushing's: cortisol يعلّي الـ gluconeogenesis" }
          - { key: "P", text: "Pheochromocytoma: catecholamines تقفل الـ insulin" }
          - { key: "H", text: "Hyperthyroidism: thyroid hormone يسرّع امتصاص السكر وتكسيره" }
        hook: "كل الأربعة **counter-regulatory hormones** زيادة: هرمونات بتعمل عكس الـ insulin. ونفس المنطق في الأدوية: **steroids**، **thyroid hormone**، **β-agonists**، ومعاهم **thiazides**."
      - kind: sort
        page: 3
        quote: "Drugs or chemicals induced: corticosteroid, thiazide diuretics, thyroid hormone, β-adrenergic agonists."
        prompt: "صنّف أسباب الـ secondary DM:"
        bins: ["Pancreatic", "Endocrine", "Drugs"]
        cards:
          - { text: "Hemochromatosis", bin: 0 }
          - { text: "Pancreatectomy", bin: 0 }
          - { text: "Pheochromocytoma", bin: 1 }
          - { text: "Acromegaly", bin: 1 }
          - { text: "Hyperthyroidism", bin: 1 }
          - { text: "Thiazide diuretics", bin: 2 }
          - { text: "β-adrenergic agonists", bin: 2 }
          - { text: "Corticosteroids", bin: 2 }
        why: "الـ **hemochromatosis** حديد بيترسب في البنكرياس فبيبقى pancreatic. الـ hyperthyroidism مرض endocrine، أما **thyroid hormone** كدوا فهو في الـ drugs."
      - kind: try
        items: [dm.L01.005, dm.L01.010, dm.L01.015, dm.L01.018, dm.L01.020]
    recap:
      - "DM = glucose underutilized + overproduced ← hyperglycemia؛ defect في الـ secretion أو الـ action أو الاتنين."
      - "Microvascular specific (عين، كلية، أعصاب)؛ macrovascular non-specific."
      - "مصر 9.5% (20–79 سنة). Type 1 : type 2 = 1 : 9. الستات أكتر في type 2."
      - "Type 2: 80% obese resistant، 20% non-obese secretory."
      - "Secondary: pancreatic، endocrine (**ACPH**)، drugs (steroids، thiazides، thyroid، β-agonists)."
    practice: [dm.L01.001, dm.L01.002, dm.L01.003, dm.L01.004, dm.L01.005, dm.L01.006, dm.L01.007, dm.L01.008, dm.L01.009, dm.L01.010, dm.L01.011, dm.L01.012, dm.L01.013, dm.L01.014, dm.L01.015, dm.L01.016, dm.L01.017, dm.L01.018, dm.L01.019, dm.L01.020, dm.L01.119]
