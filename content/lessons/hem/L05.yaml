  - id: hem.L05.lesson4
    title: "Antiphospholipid syndrome: جلطة وإجهاض"
    hook: "مريضة شابة عندها DVT وفقدت حمل: لازم تفتكر APS، والتشخيص له قاعدة واحدة واضحة."
    minutes: 8
    pages: [80, 83]
    topics: [aps]
    goals:
      - "تعرف الـ clinical والـ laboratory criteria"
      - "تعرف قاعدة الـ 12 weeks"
      - "تعالج الـ thrombosis والحمل (سؤال كتاب: diagnostic approach)"
    status: unverified
    steps:
      - kind: explain
        page: 80
        title: "ليه APS مهم؟"
        quote: "The essential features are arterial or venous thrombosis or recurrent pregnancy loss or placental dysfunction"
        text: |
          ==acquired thrombophilia== منتشرة وليها morbidity و mortality عالية.

          الأساس: **arterial أو venous thrombosis**، أو **recurrent pregnancy loss** أو **placental dysfunction**، في حد الـ **antiphospholipid antibody** عنده **persistently positive**.
      - kind: explain
        page: 81
        title: "فين بتيجي الجلطة؟"
        quote: "A characteristic of APS in an individual patient is the tendency to recurrent problems in the same vascular bed."
        text: |
          الأشهر: **DVT** و **PE** و **ischemic stroke**، بس أي وعاء ممكن، حتى الـ microvasculature (renal thrombotic microangiopathy).

          والمميز: الجلطات بترجع في ==same vascular bed==. اللي جاتله stroke قبل كده، الجاية غالبًا stroke.
      - kind: table
        page: 81
        quote: "Diagnostic criteria in APS Clinical criteria∗ - Thrombosis: arterial, venous or microvascular thrombosis in any tissue or organ"
        title: "الـ criteria"
        columns: [Domain, Criterion]
        rows:
          - ["Thrombosis", "Arterial, venous or microvascular, any organ"]
          - ["Fetal death", "Normal fetus at ≥10 weeks"]
          - ["Miscarriage", "≥3 consecutive before 10 weeks"]
          - ["Premature birth", "Before 34 weeks from pre-eclampsia or placental insufficiency"]
          - ["Laboratory", "aCL moderate/high, anti-β2-GPI >99th centile, or lupus anticoagulant"]
        hide: [[1, 1], [2, 1], [3, 1], [4, 1]]
      - kind: mnemonic
        page: 81
        quote: "There must be at least one clinical and at least one laboratory criterion present."
        word: "1-1-12"
        parts:
          - { key: "1", text: "At least 1 clinical criterion" }
          - { key: "1", text: "At least 1 laboratory criterion" }
          - { key: "1", text: "Lab test positive twice," }
          - { key: "2", text: "…on 2 occasions 12 weeks apart" }
        hook: "**واحد، واحد، اتناشر**: 1 clinical + 1 lab، والتحليل يتعاد بعد **12 weeks**."
      - kind: reveal
        page: 81
        quote: "as transient antibodies may occur, for example in infection. Such antibodies are not usually associated with clinical events."
        prompt: "ليه ما نشخصش APS من تحليل واحد positive؟"
        answer: |
          لأن الـ antiphospholipid antibodies ممكن تطلع ==transient==، مثلًا مع **infection**، والـ antibodies دي غالبًا مش بتعمل جلطات.

          علشان كده التحليل لازم يبقى **positive مرتين بينهم 12 weeks**.
      - kind: check
        page: 81
        quote: "One or more premature births of a morphologically normal fetus before 34 weeks of gestation due to pre-eclampsia"
        question: "Which counts as an APS pregnancy criterion?"
        options: ["Birth at 31 weeks from severe pre-eclampsia", "Two miscarriages at 6 weeks", "Birth at 36 weeks from pre-eclampsia", "Gestational diabetes"]
        answer: 0
        why:
          - "صح: premature birth قبل **34 weeks** بسبب pre-eclampsia."
          - "لازم **3 أو أكتر** miscarriages متتالية قبل 10 weeks."
          - "36 weeks بعد حد الـ 34."
          - "الـ gestational diabetes مش criterion."
      - kind: explain
        page: 82
        title: "علاج الجلطة"
        quote: "These patients should remain on indefinite oral anticoagulation, maintaining an International Normalized Ratio (INR) of 3–4."
        text: |
          - ==Indefinite oral anticoagulation==.
          - الـ target كان **INR 3–4**، بس دراستين randomized أثبتوا إن **INR 2–3** كفاية لأغلب المرضى.
          - شوية فيهم small-vessel thrombosis (lacunar infarcts على الـ MRI) لسه محتاجين **3–4** علشان الـ cerebral thrombosis ما ترجعش.
          - **Immunosuppression**: مش في الـ primary APS، إلا لو الجلطة رجعت مع anticoagulation قوي.
          - **Catastrophic APS**: antithrombotics + **corticosteroids** + immunomodulators زي **rituximab**، life saving.
      - kind: update
        page: 82
        quote: "a lower target INR of 2–3 is effective in preventing recurrent thrombosis in the majority of patients."
        ref: "EULAR recommendations for APS in adults 2019"
        text: "علشان نمنع الـ **recurrent thrombosis**: الـ **DOACs** (خصوصًا rivaroxaban) نتجنبها في الـ **triple-positive** وفي الـ arterial APS، والـ **warfarin** هو الاختيار الأول."
      - kind: explain
        page: 83
        title: "الحمل"
        quote: "approach increases the chance of a successful outcome of a healthy live birth from 30% to 70–80%."
        text: |
          الأم اللي عندها poor obstetric history من APS: ==LMWH + low-dose aspirin== empirically. نسبة الـ live birth بتطلع من **30%** لـ **70–80%**.

          وفيه رأي: الـ combination كـ first line للي عندها **placental dysfunction** قبل كده، أما الـ **recurrent first-trimester loss** فـ supportive care الأول، و aspirin أو aspirin/heparin لو الحمل فشل تاني.
      - kind: case
        page: 81
        quote: "There must be at least one clinical and at least one laboratory criterion present."
        stem: "A 29-year-old woman had an unprovoked DVT. Last year she had a stillbirth at 22 weeks with a normal fetus. Anticardiolipin IgG is high twice, 12 weeks apart."
        steps:
          - question: "Does she meet the APS criteria?"
            options: ["Yes", "No: she needs 3 miscarriages", "No: she needs lupus anticoagulant too", "No: one DVT is not enough"]
            answer: 0
            why: "عندها clinical (DVT و fetal death ≥10 weeks) و lab criterion positive مرتين بينهم 12 weeks. lab test واحد كفاية."
          - question: "She becomes pregnant again. Treatment?"
            options: ["LMWH plus low-dose aspirin", "Warfarin", "Rituximab", "Nothing"]
            answer: 0
            why: "**LMWH + low-dose aspirin**. الـ rituximab للـ catastrophic APS بس."
      - kind: try
        items: [hem.L05.067, hem.L05.071, hem.L05.073, hem.L05.074, hem.L05.086]
    recap:
      - "APS = thrombosis أو pregnancy morbidity + antiphospholipid antibodies persistently positive."
      - "Lab: anticardiolipin (moderate/high)، anti-β2-GPI >99th، lupus anticoagulant."
      - "Pregnancy: fetal death ≥10 weeks، ≥3 miscarriages <10 weeks، premature <34 weeks."
      - "**1-1-12**: 1 clinical + 1 lab، positive مرتين بينهم 12 weeks."
      - "Thrombosis: anticoagulation مدى الحياة، INR 2–3 لأغلبهم. Pregnancy: LMWH + aspirin (30% ← 70–80%)."
    practice: [hem.L05.066, hem.L05.067, hem.L05.068, hem.L05.069, hem.L05.070, hem.L05.071, hem.L05.072, hem.L05.073, hem.L05.074, hem.L05.075, hem.L05.076, hem.L05.077, hem.L05.078, hem.L05.079, hem.L05.080, hem.L05.081, hem.L05.082, hem.L05.085, hem.L05.086]
