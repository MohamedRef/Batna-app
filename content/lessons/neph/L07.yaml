        title: "النزيف والـ infection"
        quote: "Therapeutic agents of choice include trimethoprim-sulfamethoxazole and fluoroquinolones, both of which have favorable intra cystic thera-peutic concentration gradients at physiologic pH in gradient and non-gradient cysts. If fever persists after 1 to 2 weeks of appropriate antimicrobial therapy, infected cysts should be drained percutaneously or surgically. In the case of end- stage polycystic kidneys, nephrectomy should be considered. If fever recurs after stopping antibiotics, complicating features such as obstruction, perinephric abscess, and stone should be excluded. If no"
        text: |
          **Cyst hemorrhage**: بيخلص لوحده: **bed rest، analgesics، ميه كتير** علشان الـ clots ما تسدّش. الشديد: transfusion، tranexamic acid، **segmental embolization**، وآخر حل جراحة.

          **Cyst infection**: عالج الـ cystitis والـ asymptomatic bacteriuria بسرعة. المضاد لازم يدخل الكيس: ==TMP-SMX أو fluoroquinolones== (lipophilic).

          لسه سخن بعد **1–2 أسبوع**؟ **Drainage**. ولو رجعت الحرارة بعد ما وقفت: دوّر على obstruction أو perinephric abscess أو stone.
      - kind: aside
        tone: analogy
        page: 158
        quote: "Urinary Tract and Cyst Infection Because most renal cyst infections begin as cystitis, prompt treatment of symptomatic cystitis and asymptomatic bacteriuria is indicated to prevent retrograde seeding of the renal parenchyma. Antibiotics that not effective for upper UTI in severe renal impairment. Cyst infection is often difficult to treat despite prolonged therapy with an antibiotic to which the organism is susceptible. Treatment failure occurs if anticoncentrations within the cysts. Lipophilic agents have been shown to penetrate cysts reliably and have an acid dissociation constant (pK₂) that allows favorable electrochemical gradients into acidic cyst fluid."
        text: "الكيس زي أوضة مقفولة بشباك دهني. الـ **gentamicin** (مش lipophilic) بيخبط على الشباك ومش بيدخل، والـ **cipro و TMP-SMX** (lipophilic) بيعدّوا من الشباك ويوصلوا للميكروب."
      - kind: explain
        page: 159
        title: "الـ stones والضغط"
        quote: "Control of hypertension is essential because uncontrolled hypertension accelerates the decline in renal function and aggravates extra renal com- plications. Antihypertensive agents of choice and optimal BP targets in ADPKD have not been established. Angiotensin-converting enzyme (ACE) inhibitors or angiotensin receptor blockers (ARBs) increase renal blood flow in ADPKD, have a favorable side effect profile, and may have renoprotective properties that go beyond BP control. The HALT PKD study, a recent double-blind, placebo- controlled randomized clini-cal trial (RCT), examined the role of RAS blockade in both early and advanced ADPKD.31,32 Monotherapy with ACE inhibitors gave good BP min/1.73 m²). The HALT PKD study therefore supports the use of an ACE inhibitor or ARB as the antihypertensive medication of choice in most patients with ADPKD and a rigorous BP target (95 to 110/60 to 75 mm Hg) in young patients with ADPKD with normal renal function and without other significant comorbidities."
        text: |
          **Stones**: نفس العلاج العادي. الـ ==potassium citrate== هو الأساس في التلات: **uric acid**، **hypocitraturic Ca oxalate**، و **distal acidification defects**. الـ extracorporeal shock wave lithotripsy و percutaneous nephrolithotomy نجاحهم **82% و 80%**.

          **Hypertension**: لازم يتظبط. الـ **ACE inhibitor (ACEI) أو angiotensin II receptor blocker (ARB)** الأول (بيزوّدوا renal blood flow و renoprotective). والـ **HALT polycystic kidney disease (PKD)** بيقول target ==95–110/60–75== للشباب اللي كليتهم كويسة.
      - kind: explain
        page: 160
        title: "ميه، dialysis، وكبد"
        quote: "Hypertension plays an important role in the progression of ADPKD to ESRD. In addition to the HALT PKD clinical trials, long-term follow Preclinical studies, and evidence suggesting increased vasopressin effect on the kidney and cAMP levels are involved in cyst progression, have led to the ingestion of supplemental water sufficient to achieve a urinary osmolality below 250 mOsm/kg H₂O (~3 liters in most patients) being recommended for patients with ADPKD with an eGFR greater than 30 ml/min, although there are no RCTs to support this approach.34 Patients with ADPKD have reduced morbidity and mortality on dialysis compared with patients with ESRD from other causes. Women appear to do better than men. The good outcome in ADPKD may result from higher endogenous erythropoietin production, better maintenance of hemoglobin, or lower comorbidity. Rarely, hemodialysis can be by a medially located renal cyst. Despite renal size, peritoneal dialysis can usually be performed in ADPKD, although there is increased risk for inguinal and umbilical hernias, which require surgical repair."
        text: |
          - **ميه**: لو estimated glomerular filtration rate (eGFR) فوق 30، اشرب لحد ما الـ urine osm تبقى ==أقل من 250== (حوالي **3 لتر**)؛ الميه بتطفي الـ vasopressin. مفيش randomized clinical trial (RCT).
          - **Dialysis**: عيانين autosomal dominant polycystic kidney disease (ADPKD) **أحسن** من غيرهم (EPO أعلى، Hb أحسن). الـ **peritoneal dialysis (PD)** ينفع بس خد بالك من الـ **hernias**.
          - **polycystic liver disease (PLD)**: غالبًا مش محتاج علاج. قلل الكحول والـ hepatotoxins و **الكافيين** (cAMP agonist). H2 blockers و somatostatin. الـ estrogen ممنوع **بس** لو الكبد كبير جدًا. Invasive: aspiration و sclerosis أو fenestration.
