  # ---------- p375-378: hypertension, preeclampsia on dialysis, monitoring ----------
  - id: neph.L11.126
    kind: table
    topic: dialysis-htn
    title: ACOG categories of hypertension in pregnancy
    columns: [Category, Definition]
    rows:
      - [Chronic hypertension, Hypertension before 20 weeks or persisting >12 weeks postpartum]
      - [Gestational hypertension, "New BP ≥140/90 after 20 weeks, no proteinuria or end-organ damage"]
      - [Preeclampsia, "New hypertension after 20 weeks with proteinuria ≥300 mg/d or end-organ dysfunction"]
      - [Superimposed preeclampsia, New proteinuria or end-organ dysfunction with worsening hypertension after 20 weeks in chronic hypertension]
    blanks: [[0, 1], [1, 1], [3, 1]]
    src: { page: 375, quote: "Hypertension Management Hypertension during pregnancy is associated with many adverse maternal and fetal outcomes, such as maternal cardiovascular complications, fetal morbidity, intrauterine growth restriction, and premature delivery. The American College of Obstetricians and Gynecologists Task Force has classified hypertension in pregnancy into 4 categories: chronic hypertension, gestational hypertension, preeclampsia, and preeclampsia superimposed on chronic hypertension.(70) Chronic hypertension is a pre-existing diagnosis of hypertension before 20 weeks of gestation or persistent hypertension>12 weeks postpartum. Gestational hypertension is new- onset hypertension, defined as BP≥140/90mm Hg after 20 weeks of gestation without any proteinuria or end- organ. Preeclampsia is defined as new-onset hypertension after 20 weeks of gestation with proteinuria (≥300mg/d) or end-organ dysfunction in at least 1 organ. End-organ damage can include thrombocytopenia (platelet count<100,000/ μL,), kidney dysfunction (serum creatinine>1.1mg/dL or doubling of the serum creatinine concentration in the absence of other kidney disease), liver enzymes twice the upper limit of normal range, pulmonary edema, or new-onset cerebral or vision changes. Preeclampsia superimposed on chronic hypertension is new-onset proteinuria or end-organ dysfunction coupled with worsening hypertension after 20 weeks of gestation in women with chronic hypertension. In women treated with dialysis, it is challenging to diagnose preeclampsia especially among those with pre-existing hypertension because of limited utility of urine protein creatinine ratio with anuria. New onset of hypertension after 20 weeks or worsening of hypertension in women with pre- existing hypertension along with classical symptoms (headache, nausea, vomiting, epigastric pain, and visual disturbances) and laboratory abnormalities (hemolysis, thrombocytopenia, liver dysfunction, and high uric acid) of end- organ damage can be used to make a diagnosis of preeclampsia.(70)" }
    status: unverified
    tags: [high-yield]
