  - id: geri.L01.lesson3
    title: "الـ angina اللي مش بتوجع"
    hook: "الحاج مش بيقول «صدري واجعني»، بيقول «بنهج لما أطلع السلم». ودي أهم جملة في الدرس."
    minutes: 8
    pages: [8, 10]
    topics: [cad, angina]
    goals:
      - "تعدّ الـ traditional والـ newer risk factors"
      - "تعرف ليه الـ angina بتستخبى عند الكبار"
      - "تشخّص وتعالج الـ angina"
    status: unverified
    steps:
      - kind: explain
        page: 8
        title: "الـ CAD بيكبر مع السن"
        quote: "Acute coronary syndrome\n  The incidence of CAD increases with age,\n  85% of all deaths from coronary artery disease occur after the age of 65.\n  The traditional Risk Factors are:\n    Hypertension,\n    Diabetes,\n    Lack of exercise,\n    Ratio of high total cholesterol to high-density lipoprotein,\n    Smoking,\n    Age.\n  Newer Risk Factors are:\n    C-reactive protein,\n    Lipoprotein a,\n    Homocysteine,\n    Microalbuminuria."
        text: |
          الـ incidence بتزيد مع السن، و ==85%== من وفيات الـ coronary artery disease (CAD) بتحصل **بعد 65**.

          **Traditional risk factors:** hypertension، diabetes، قلة الحركة، **total cholesterol/HDL ratio** عالي، smoking، age.

          **Newer risk factors:** ==C-reactive protein (CRP)==، **lipoprotein(a)**، **homocysteine**، **microalbuminuria**.
      - kind: mnemonic
        page: 8
        quote: "Acute coronary syndrome\n  The incidence of CAD increases with age,\n  85% of all deaths from coronary artery disease occur after the age of 65.\n  The traditional Risk Factors are:\n    Hypertension,\n    Diabetes,\n    Lack of exercise,\n    Ratio of high total cholesterol to high-density lipoprotein,\n    Smoking,\n    Age.\n  Newer Risk Factors are:\n    C-reactive protein,\n    Lipoprotein a,\n    Homocysteine,\n    Microalbuminuria."
        word: "CLHM"
        parts:
          - { key: "C", text: "C-reactive protein" }
          - { key: "L", text: "Lipoprotein(a)" }
          - { key: "H", text: "Homocysteine" }
          - { key: "M", text: "Microalbuminuria" }
        hook: "**CLHM**: «كلّه مُهم». الـ newer risk factors الأربعة. أي حاجة تانية في السؤال (smoking، age، DM) تبقى traditional."
      - kind: explain
        page: 8
        title: "تقيس المرض قبل ما يبان"
        quote: "Several measures have been developed to determine subclinical\n  atherosclerotic disease:\n    1. CT coronary angiography\n    2. Carotid ultrasound can measure the degree of plaque in the carotid arteries to predict risk of stroke\n    3. Ankle-brachial index (ABI) (normal ratio is > 0.9 – 0.95)"
        text: |
          الـ **subclinical atherosclerosis** بيتقاس بـ:
          1. **computed tomography (CT) coronary angiography**
          2. **Carotid ultrasound**: كمية الـ plaque بتتنبأ بالـ stroke
          3. ==Ankle-brachial index==: الطبيعي **>0.9–0.95**
      - kind: reveal
        page: 8
        quote: "Several measures have been developed to determine subclinical\n  atherosclerotic disease:\n    1. CT coronary angiography\n    2. Carotid ultrasound can measure the degree of plaque in the carotid arteries to predict risk of stroke\n    3. Ankle-brachial index (ABI) (normal ratio is > 0.9 – 0.95)"
        prompt: "ليه الـ ABI الطبيعي حوالي 1 أو أكتر، وتحت 0.9 يبقى في مشكلة؟"
        answer: |
          الضغط في الكاحل طبيعي **زي** ضغط الدراع أو أعلى شوية (الموجة بتتضخّم وهي نازلة). لو في **plaque** بيضيّق شرايين الرجل، الضغط تحت يقل، والنسبة تنزل تحت **0.9**.

          وطالما الشرايين في الرجل مسدودة، يبقى غالبًا الـ coronaries كمان. (تفسير فسيولوجي؛ الرقم من الكتاب.)
      - kind: explain
        page: 9
        title: "ليه الـ angina بتستخبى؟"
        quote: "The history of classic exertional angina may be difficult to obtain as the elderly patient who has limited activity and do not develop symptoms until late in the course of disease."
        text: |
          الـ angina أشهر عرض للـ CAD: **80%** من الكبار.

          بس الحاج **مش بيتحرك كتير**، فمش بيوصل للمجهود اللي يطلّع الألم غير متأخر جدًا. وبدل الألم بيجي ==dyspnea on exertion==.

          أعراض تانية: palpitation، weakness، **unexplained diaphoresis**، indigestion، ألم في الرقبة والكتف. والـ **rest (unstable)** والـ rapidly progressive angina بيحصلوا كتير.
      - kind: aside
        tone: joke
        text: "تسأل الحاج: «صدرك بيوجعك لما تمشي؟» يقولك: «أمشي فين يا ابني؟ أنا من الكنبة للحمام». علشان كده اسأله عن **النهجان** مش عن الألم."
      - kind: explain
        page: 9
        title: "الكشف والـ ECG"
        quote: "Angina (cont.)\n  Signs:\n    1- Faint heart sounds.\n    2- S4 → reduced left ventricular compliance.\n    3- Reversed splitting of S2 dt LBBB.\n    4- Transient Mitral regurge murmur."
        text: |
          **Signs:**
          1. Faint heart sounds
          2. ==S4== ← reduced left ventricle (LV) compliance
          3. **Reversed splitting of S2** ← left bundle branch block (LBBB)
          4. Transient **mitral regurgitation** murmur

          **electrocardiogram (ECG):** ST depression **>2 mm** في **أكتر من lead**، و T wave مقلوبة أو flat. والـ **cardiac enzymes normal**.
      - kind: reveal
        page: 9
        quote: "Angina (cont.)\n  Signs:\n    1- Faint heart sounds.\n    2- S4 → reduced left ventricular compliance.\n    3- Reversed splitting of S2 dt LBBB.\n    4- Transient Mitral regurge murmur."
        prompt: "ليه الـ MR murmur في الـ angina بيبقى transient؟"
        answer: |
          الـ **papillary muscle** نفسها بتبقى ischemic أثناء النوبة فما بتشدّش الـ mitral leaflets كويس ← **mitral regurgitation (MR)**. لما الـ ischemia تروح، العضلة ترجع تشتغل والـ murmur يختفي. (تفسير فسيولوجي.)
      - kind: explain
        page: 10
        title: "تشخيص وعلاج"
        quote: "Coronary arteriography\n  Remains the definitive test for the diagnosis of CAD"
        text: |
          **Tests:** ECG، enzymes طبيعية، treadmill، **thallium scintigraphy**، 24-hour ambulatory monitoring، و ==coronary arteriography== اللي هو الـ **definitive test**.

          **صلّح الـ risk factors:** حركة، وزن لحد **body mass index (BMI) ≤24**، سكر، ضغط، وخفض الـ low-density lipoprotein (LDL) بالـ statin أو fibrates أو nicotinic acid.

          **أثناء النوبة:** sublingual nitroglycerin.

          **بين النوبات:**
          - **Nitrates**: آثارها orthostatic hypotension و headache و syncope
          - **Beta-blockers**
          - **calcium channel blocker (CCB)**
          - **Antiplatelets**: clopidogrel و aspirin

          **Interventional:** percutaneous transluminal coronary angioplasty (PTCA) أو coronary artery bypass grafting (CABG).
      - kind: aside
        tone: trap
        page: 10
        quote: "Treatment of Angina\n  a. Correct any factors that may have precipitated coronary artery disease by:\n    Increased physical activity\n    Weight management (optimal mass index ≤ 24)\n    Glycemic control\n    Blood pressure control\n    LDL cholesterol - lowering therapy (statin, fibrates and nicotinic acid)\n  b. Medical treatment\n  During attack:\n    Sublingual NG.\n  Between attacks:\n    Nitrates (Dinitra): SE: orthostatic hypotension, headache, syncope.\n    B blockers (contraindicated in vasospastic angina) SE: Fatigue, depression, bradycardia, heart block, hypotension.\n    CCB.\n    Anti-platelets: (Plavix)-aspirin.\n    c. Interventional Therapy:\n      PTCA (trans-luminal coronary Angioplasty)\n      CABG"
        text: "الـ **beta-blockers** ممنوعة في الـ ==vasospastic angina== (بتسيب الـ alpha وحده يقفّل الشريان). وآثارها الجانبية عند الحاج: **fatigue، depression، bradycardia، heart block، hypotension**؛ وده حاج عنده أصلًا sick sinus."
