      - kind: explain
        page: 376
        quote: "Gallstones are the commonest biliary pathology > Interest in the formation and clinical management of gallstone disease date back to"
        title: "حصوات من أيام الفراعنة"
        text: |
          الكتاب بيبدأ بجملتين:

          - **Gallstones are the commonest biliary pathology.**
          - **Most disorders of the biliary tract result from gallstones.**

          يعني لو فهمت الحصوة كويس، فهمت أغلب أمراض المرارة والقنوات: الـ colic والـ cholecystitis والـ cholangitis والـ biliary pancreatitis كلهم بيبدأوا منها.

          ومعلومة لطيفة: فيه أدلة أثرية إن أفراد من العيلة المالكة المصرية القديمة كان عندهم حصوات. يعني المرض ده مصري أصيل من أيام الفراعنة. 😄

          وفي صفحة 376 رسمة للـ **congenital anomalies**، وهي الصورة الجاية. بص عليها مرة علشان تعرف أشكالها، ومش هنحفظها في الدرس ده؛ هتلاقيها card في المراجعة.
      - kind: figure
        page: 376
        quote: "GB Diverticulum Hourglass Intrahepatic GB with mesentery GB GB"
        title: "أشكال المرارة الخِلقية"
        image: { file: hb/L19-gb-anomalies.webp, book: true }
        alt: "Book chart of congenital gallbladder anomalies drawn as outlines: double gallbladder, Y-shaped cystic duct, bilobed, folded, retroserosal, gallbladder diverticulum, hourglass, intrahepatic, and gallbladder with a mesentery."
        caption: |
          - Double GB و bilobed: مرارتين أو مرارة بفصّين.
          - Folded GB و hourglass: المرارة متنية أو مخنوقة من النص (الـ folded اسمها كمان Phrygian cap، والاسم ده من برّه الكتاب).
          - Intrahepatic، و GB with a mesentery (معلّقة؛ ومن برّه الكتاب: ممكن تلف).

          مش هتتسأل عليهم بالتفصيل، بس اعرف شكلهم لو شفتهم في الـ US.
      - kind: table
        page: 377
        quote: "e About 1-3% of these patients exhibit symptoms in any given year. *The risk"
        title: "أرقام لازم تبقى على طرف لسانك"
