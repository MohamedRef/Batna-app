  # ---------- p477-483: TTP ----------
  - id: neph.L14.137
    kind: enumerate
    topic: ttp
    prompt: The classic pentad of TTP?
    points:
      - Fever
      - Thrombocytopenia
      - Hemolytic anemia
      - Renal dysfunction
      - Neurologic dysfunction
    pass: 5
    src: { page: 477, quote: "classically has been characterized by the pentad of fever, thrombocytopenia, hemolytic anemia, renal dysfunction, and neurologic dysfunction." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.138
    kind: card
    topic: ttp
    front: What is the mechanism of TTP?
    back: Low ADAMTS13 (VWF-cleaving protease) leaves ultra-large VWF multimers that bind platelets and form microthrombi, causing end-organ ischemia.
    src: { page: 478, quote: "This is due to the inability of the ADAMTS13 to inactivate the large multimer von Willebrand factor (VWF)" }
    status: unverified
  - id: neph.L14.139
    kind: cloze
    topic: ttp
    text: "Untreated TTP has a mortality of about {{c1::90%}}; about {{c2::80%}} respond to initial treatment, and post-treatment mortality is {{c3::10-15%}}."
    src: { page: 478, quote: "without treatment, has a mortality of about 90%. About 80% of patients respond to initial treatment, and the post-treatment mortality is 10 to 15%." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L14.140
    kind: card
    topic: ttp
    front: Which form of TTP is more common, and what causes it?
    back: Acquired TTP, from autoantibodies against ADAMTS13. Congenital TTP comes from ADAMTS13 mutations and needs a trigger such as infection or pregnancy.
    src: { page: 478, quote: "Acquired TTP is more common than the congenital type and is caused by autoantibodies targeting ADAMTS13." }
    status: unverified
  - id: neph.L14.141
    kind: enumerate
    topic: ttp
    prompt: Common triggers of ADAMTS13 autoantibodies (acquired TTP)?
