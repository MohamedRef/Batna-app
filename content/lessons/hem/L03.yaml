      - kind: table
        page: 41
        quote: "Congenital TTP\n  Congenital TTP is very rare (1 in 1 million) and represents 5% of all TTP cases.\n  usually occurs immediately after birth or during childhood, although may present later in life\n  Congenital TTP is caused by homozygous or double heterozygous mutations in the ADAMTS13 gene (located on chromosome 9q34) that affect protein secretion or function; it is inherited in autosomal recessive manner"
        title: "Congenital ولا acquired؟ (ص 41)"
        columns: [Type, Key facts]
        rows:
          - ["Congenital", "1/million, 5%; ADAMTS13 gene (9q34); AR"]
          - ["Acquired", ">99% of adults; anti-ADAMTS13 IgG"]
        hide: [[0, 1], [1, 1]]
      - kind: explain
        page: 42
        title: "الـ pentad مات"
        quote: "Today, the historical clinical pentad of fever, thrombocytopenia, microangiopathic hemolytic anemia, neurological symptoms, and renal insufficiency that used to define TTP appears obsolete, as several cohort studies have clearly demonstrated that these 5 symptoms were present in less than 10% of patients with an acute TTP."
        text: |
          الـ **pentad** القديم (fever، thrombocytopenia، MAHA، neuro، renal) بقى ==obsolete==: موجود في **أقل من 10%** بس.

          العلامات الثابتة تقريبًا:
          1. **Thrombocytopenia شديدة** (غالبًا ==< 30 × 10⁹/L==).
          2. **MAHA** مع **schistocytes**.
          3. **Ischaemia**، أغلبها **المخ** (حوالي **60%**): صداع، confusion، stroke، coma، seizures.
          4. **الكلى**: proteinuria أو haematuria بس؛ الـ **acute kidney injury (AKI) مش شائع** (creatinine < 2 mg/dL).

          ليه كل علامة؟ الصفايح قليلة عشان **اتصرفت** في الجلطات، فيظهر نزيف في الجلد والأغشية. الكرات بتتقطع وهي معدية في الـ arterioles المسدودة جزئيًا، فتطلع schistocytes وأعراض أنيميا (ضعف، نهجان). والمخ بياخد أغلب الضربة لأن الجلطات في الـ **arterioles** الصغيرة اللي بتغذيه.
      - kind: reveal
        page: 42
        quote: "these 5 symptoms were present in less than 10% of patients with an acute TTP."
        prompt: "ليه الاعتماد على الـ pentad القديم كان خطر على العيان؟"
        answer: |
          لأن الخمس علامات مع بعض (fever، thrombocytopenia، MAHA، neuro، renal) كانوا موجودين في **أقل من 10%** من العيانين بس.

          يعني لو استنيت الخمسة، هتفوّت أغلب الحالات أو تتأخر. التفسير المقبول (مش في الكتاب): والتأخير هنا قاتل، لأن العلاج (**TPE**) لازم يبدأ أول ما تشك. عشان كده الكتاب بيقول ركّز على العلامات الثابتة: **صفايح تحت 30** و **schistocytes**، ومعاهم أعراض مخ في حوالي 60%.
      - kind: explain
        page: 43
        title: "مين بيجيله TTP؟"
        quote: "The most frequent clinical conditions associated with TTP are bacterial infections and autoimmune diseases"
        text: |
          أشهر حاجات مرتبطة بالـ TTP في الكتاب:
          - **Bacterial infections**.
          - **Autoimmune diseases**، أهمها **systemic lupus erythematosus (SLE)**.
          - **Pregnancy**.
          - **أدوية**: mitomycin C، cyclosporine، quinine، و ==clopidogrel و ticlopidine==.
          - **HIV**، **pancreatitis**، **cancers**، و **organ transplantation**.

          ليه autoimmune بالذات؟ لأن أغلب الـ TTP في الكبار **acquired**: الجسم بيعمل **antibodies ضد الـ ADAMTS13**. التفسير المقبول (مش في الكتاب): أي حاجة بتلخبط المناعة (lupus، عدوى، حمل، دوا) ممكن تكون الشرارة. وده كمان سبب إن العلاج فيه steroids و rituximab.

          فخ مهم: الـ **clopidogrel** دوا ضد الصفايح، ومع ذلك ممكن يعمل TTP.
      - kind: aside
        tone: exam
        page: 43
        quote: "Thrombin time (PT), and the fibrinogen concentration, are characteristically normal."
        text: "الفرق عن الـ **disseminated intravascular coagulation (DIC)**: في الـ TTP الـ **prothrombin time (PT) والـ fibrinogen طبيعيين**، لأن المشكلة صفايح و VWF مش coagulation factors. والفرق عن الـ **HUS**: الـ TTP مخ أكتر وكلى أقل؛ الـ HUS كلى أكتر."
      - kind: explain
        page: 43
        title: "التحاليل والعلاج"
        quote: "TPE with replacement of plasma remains the cornerstone of current management of TTP .\nTPE) should be started as soon as the diagnosis of TTP is established or even suspected."
        text: |
          **التحاليل**: anaemia و thrombocytopenia شديدين، ==schistocytes== (helmet cells)، retics و indirect bilirubin عاليين، haptoglobin **مختفي**، و **lactate dehydrogenase (LDH) عالي جدًا** لأنه طالع من الكرات المكسورة **و** من الأنسجة اللي ماتت من الـ ischaemia. والـ haptoglobin بيختفي عشان الـ haemolysis **intravascular**: الـ haptoglobin بيمسك الـ Hb الحر ويتشال معاه.

          **العلاج**:
          - ==Plasma exchange (TPE)== هو الأساس، ويبدأ **أول ما تشك**. كل يوم لحد ما الأعضاء تتحسن والصفايح تثبت والـ haemolysis يقف.

          ليه الـ TPE؟ التفسير المقبول (مش في الكتاب): بيشيل من الدم الـ **anti-ADAMTS13 antibodies** والـ **ultralarge VWF**، وبيدّي **ADAMTS13 سليم** من بلازما المتبرع. يعني بيعالج السبب من الناحيتين.
      - kind: check
        page: 43
        quote: "TPE with replacement of plasma remains the cornerstone of current management of TTP ."
        question: "TTP is suspected; ADAMTS13 result will take 3 days. What now?"
        options:
          - "Start plasma exchange now"
          - "Wait for ADAMTS13"
          - "Transfuse platelets"
          - "Give eculizumab"
        answer: 0
        why:
          - "صح: الـ TPE يبدأ أول ما تشك. التأخير بيموّت."
          - "الانتظار خطر؛ الـ TTP من غير علاج قاتل."
          - "الصفايح وقود للجلطات (الكتاب قالها في الـ HUS)."
          - "الـ eculizumab للـ atypical HUS والـ PNH."
      - kind: explain
        page: 44
        title: "اللي بيتضاف على الـ plasma exchange"
        quote: "There is a rationale for the use of steroids in the treatment of acquired TTP, given its autoimmune nature."
        text: |
          - **Steroids**: ليها منطق في الـ **acquired TTP** لأنه ==autoimmune==. الـ **high-dose methylprednisolone** (10 mg/kg/day × 3 أيام، بعدين 2.5 mg/kg/day) ممكن يكون أحسن من الـ standard dose (1 mg/kg/day) كـ adjunct مع الـ TPE.
          - **Rituximab** (anti-CD20): بدأ في اللي استجابتهم للعلاج التقليدي **ضعيفة** (exacerbation أو refractory). التفسير المقبول (مش في الكتاب): الـ CD20 على الـ B cells، والـ B cells هي اللي بتعمل الـ anti-ADAMTS13 antibody.
          - **Vincristine**: كان للـ refractory قبل الـ rituximab.
          - **Cyclosporine A**: في الـ refractory، وكمان frontline مع الـ TPE.
          - ==Caplacizumab==: جزء من antibody ضد الـ **VWF**، بيمنع الـ ultralarge VWF يمسك الصفايح. بيتدّي مع الـ TPE والـ immunosuppression للكبار: **11 mg IV** قبل الـ TPE بـ 15 دقيقة، بعدين **11 mg SC** كل يوم بعد الـ TPE، ويكمل **30 يوم** بعد آخر TPE.

          يعني الـ TPE بيشيل المشكلة، والـ steroids والـ rituximab بيوقفوا المصنع اللي بيعمل الـ antibody، والـ caplacizumab بيحمي الصفايح لحد ما ده يحصل.
