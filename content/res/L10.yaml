  # ---------------- techniques (slides 2-8) ----------------
  - id: res.L10.001
    kind: card
    topic: techniques
    front: Why is data collection called a crucial stage of a study?
    back: >-
      If the data collection is superficial, biased or incomplete, data analysis becomes difficult and the research report will
      be of poor quality. So all possible effort goes into developing appropriate tools, tested several times.
    src: { page: 2, quote: "Introduction\n  Data collection is a crucial stage in the planning and implementation of a study. If the data collection has been superficial, biased or incomplete, data analysis becomes difficult, and the research report will be of poor quality.\n  Therefore, we should concentrate all possible efforts on developing appropriate tools, and should test them several times." }
    status: unverified
  - id: res.L10.002
    kind: enumerate
    topic: techniques
    prompt: Enumerate the data collection techniques.
    points:
      - Using available information (record review)
      - Observing
      - Interviewing (face-to-face)
      - Administering written questionnaires
      - Focus group discussions
    pass: 4
    hook: "5 طرق تجيب بيها داتا: «دوّر، بُص، اسأل، ادّيله ورقة، ولمّهم»: record review، observing، interviewing، written questionnaire، وfocus group discussion."
    src: { page: 3, quote: "Various data collection techniques can be used as:\n  Using available information (Record review)\n  Observing\n  Interviewing (face-to-face)\n  Administering written questionnaires\n  Focus group discussions" }
    status: unverified
