        page: 163
        title: "2008 ضد 2016"
        quote: "Revised 2016 WHO diagnostic criteria for PRV\n  Major criteria\n    1. Hemoglobin >16.5 g/dL in men, Hemoglobin >16.0 g/dL in women, or, Hematocrit >49% in men, Hematocrit >48% in women, or, increased red cell mass (RCM)*\n    2. BM biopsy showing hypercellularity for age with trilineage growth (panmyelosis) including prominent erythroid, granulocytic, and megakaryocytic proliferation with pleomorphic, mature megakaryocytes (differences in size)\n    3. Presence of JAK2V617F or JAK2 exon 12 mutation\n  Minor criterion\n    Subnormal serum erythropoietin level\nDiagnosis of PV requires meeting either all 3 major criteria, or the first 2 major criteria and the minor criterion†"
        text: |
          **WHO 2008**: Hb **>18.5** (رجالة) و **>16.5** (ستات)، ومعاهم JAK2، ومينور (marrow، EPO واطي، endogenous erythroid colonies (EEC)).

          **Revised 2016 WHO** (المهم):
          1. Hb ==>16.5 g/dL رجالة / >16.0 ستات==، أو Hct **>49% / >48%**، أو RCM عالي
          2. نخاع **hypercellular** مع **panmyelosis** و megakaryocytes **pleomorphic** mature
          3. **JAK2 V617F أو exon 12**

          **Minor**: EPO **subnormal**. التشخيص = **التلاتة**، أو **أول اتنين + الـ minor**.
