      - kind: explain
        page: 141
        quote: "demonstrated by 2 of the following 3 tests"
        title: "F3. Functional defecation disorders"
        text: |
          الشروط:
          - المريض يحقق criteria الـ ==functional constipation== و/أو **IBS-C**.
          - مع محاولات التبرّز، فيه impaired evacuation في ==2 of 3 tests==: balloon expulsion، manometry أو anal surface EMG، و imaging.

          وتحتها نوعين:
          - **F3a. Inadequate defecatory propulsion:** الـ propulsive force ضعيفة، مع أو من غير انقباض غلط.
          - **F3b. Dyssynergic defecation:** الـ propulsion كويسة بس الـ pelvic floor **بيتقبض** بدل ما يرتخي.
      - kind: reveal
        page: 142
        quote: "What are the criteria for diagnosis of functional dyspepsia"
        prompt: "آخر صفحة في المحاضرة فيها سؤالين: Classify FGIDs، و criteria for diagnosis of functional dyspepsia. جاوب التاني في دماغك الأول."
        answer: |
          - **FD:** واحد أو أكتر من: bothersome postprandial fullness، early satiation، epigastric pain، epigastric burning، و **no structural disease** حتى في الـ endoscopy.
          - لازم يحقق **PDS** و/أو **EPS**.
          - **PDS:** fullness و/أو early satiation، **3 days a week**.
          - **EPS:** pain و/أو burning، **1 day a week**.
          - آخر **3 months**، و onset من **6 months** على الأقل.

          وسؤال التصنيف إجابته الـ domains من A لـ F اللي في الدرس الأول.
