    status: unverified
  - id: res.L09.008
    kind: card
    topic: budget
    front: "When is a budget justification especially useful?"
    back: "It is not enough to present a budget without explanation; a justification is useful for items that seem questionable or particularly costly."
    src: { page: 6, quote: "Budget justification\n  It is not sufficient to present a budget without explanation. A Budget justification is useful for items which seem questionable or particularly costly.\n  Special consideration should be given to the following items:\n    Computers and other capital equipment\n    Salary and consultancy rates\n    Travel\n    Conference attendance\n    Other financial issues" }
    status: unverified
    tags: [high-yield]
