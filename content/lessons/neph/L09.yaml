  - id: neph.L09.lesson3
    title: "امتى نغسل، وإيه اللي ممكن يحصل في الجلسة"
    hook: "عيان أول جلسة، كبير في السن، والـ BUN عالي. لو نضّفته بسرعة، مخه هيورم."
    minutes: 9
    pages: [299, 302]
    topics: [prescription, hd-complications]
    goals:
      - "تعرف دواعي الغسيل الكلوية وغير الكلوية والسموم اللي بتتغسل"
      - "تظبط أول جلسة (BUN ratio) والـ isolated UF مع الـ hyperkalaemia"
      - "تفهم الـ disequilibrium والـ intradialytic hypotension"
    status: unverified
    steps:
      - kind: explain
        page: 299
        title: "الـ prescription بيتفصّل"
        quote: "session length, Blood flow rate, Dialysis solution composition, Dialysate solution flow rate"
        text: |
          كل عيان ليه: مدة الجلسة، blood flow، تركيب المحلول، dialysate flow، كام هنسحب مية، والـ anticoagulation.

          بتفرق: **acute ولا chronic**، **أول جلسة**، الـ residual renal function، الأمراض التانية (hypotension، قلب، كبد)، والـ acid–base والـ electrolytes.

          أول جلسات الـ acute أو لو خطر الـ disequilibrium عالي: الـ ==post/pre BUN ratio 0.65–0.75== (يعني ما تنزّلش الـ urea أكتر من 25–35%).
      - kind: mnemonic
        page: 300
        quote: "Electrolyte abnormalities not responding to medical treatment"
        word: "AEIOU"
        parts:
          - { key: "A", text: "Acidosis not responding (or with oliguria/anuria)" }
          - { key: "E", text: "Electrolytes: hyperkalaemia, hyponatraemia, hyperphosphataemia" }
          - { key: "I", text: "Intoxication: dialysable drugs and toxins" }
          - { key: "O", text: "Overload of volume not responding" }
          - { key: "U", text: "Uraemia: encephalopathy, pericarditis" }
        hook: |
          دواعي الغسيل = **AEIOU**. وزوّد عليهم من الكتاب: ESRD بأعراض أو malnutrition، و AKI مستمر أو بيزيد.
      - kind: check
        page: 299
        quote: "if hyperkalmia present isolated UF should be after not before dialysis"
        question: "First session: pulmonary oedema plus K+ 7.0. When is isolated UF done?"
        options:
          - "After dialysis"
          - "1–2 h before dialysis"
          - "Instead of dialysis"
          - "Never in a first session"
        answer: 0
        why:
          - "صح: مع الـ hyperkalaemia اغسل الأول ونزّل الـ K، والـ isolated UF بعدين."
          - "ده المعتاد لو مفيش hyperkalaemia."
          - "الـ isolated UF بيشيل مية بس، مش K."
          - "الكتاب بيسمح بيه في أول جلسة لو المية كتير."
      - kind: explain
        page: 300
        title: "السموم والـ indications غير الكلوية"
        quote: "Hemodialysis is more efficient for removal of lithium, ethanol, methanol, bromide, ethylene glycol, and salicylates"
        text: |
          - **Intractable HF** و oedema شديدة: UF أو SLED.
          - **التسمم**: الـ ==antidote== الأول. نغسل لو الـ vital signs بتقع رغم الـ supportive care، أو acidosis شديدة، أو renal failure، أو electrolytes مش بتتظبط.

          الـ HD أشطر حاجة مع: ==lithium، ethanol، methanol، bromide، ethylene glycol، salicylates==.
      - kind: mnemonic
        page: 300
        quote: "Hemodialysis is more efficient for removal of lithium, ethanol, methanol, bromide, ethylene glycol, and salicylates"
        word: "SLEMBE"
        parts:
          - { key: "S", text: "Salicylates" }
          - { key: "L", text: "Lithium" }
          - { key: "E", text: "Ethanol" }
          - { key: "M", text: "Methanol" }
          - { key: "B", text: "Bromide" }
          - { key: "E", text: "Ethylene glycol" }
        hook: |
          السموم اللي الفلتر بيحبها: صغيرة، بتدوب في المية، ومش لازقة في البروتين.
      - kind: explain
        page: 301
        title: "الـ disequilibrium syndrome"
        quote: "Cerebral edema from urea removal from the blood more rapidly than from the CSF and brain tissue"
        text: |
          الـ urea بتنزل من **الدم** أسرع من **المخ والـ CSF**. المخ يفضل osmolality أعلى، فالمية تدخله: ==cerebral oedema==. وكمان الـ HD بيعمل CO2 gradient فالـ pH في الـ CSF ينزل.

          **مين؟** أول جلسات، الكبار والأطفال، CNS lesions (stroke أو head trauma)، brain oedema (malignant HTN، hyponatraemia، hepatic encephalopathy)، و ==BUN عالي قبل الغسيل==.
      - kind: figure
        page: 301
        quote: "Cerebral edema from urea removal from the blood more rapidly than from the CSF and brain tissue"
        title: "ليه المخ بيورم؟"
        alt: "Two boxes side by side: blood, where urea falls quickly during dialysis, and brain, where urea stays high. An arrow shows water moving from blood into the brain, giving cerebral oedema."
        caption: "الدم اتنضّف بسرعة والمخ لسه مليان urea، فالمية تمشي ==ناحية المخ==. الحل: أول جلسة هادية."
