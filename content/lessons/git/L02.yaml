        quote: "Differentiation of Cancer and Precancerous Lesions of New Endoscopic Techniques\n| Endoscopic Technique | Sensitivity (%) | Specificity (%) |\n|---|---|---|\n| Chromoendoscopy | 97 | 81 |\n| NBT | 97.9 | 83.8 |\n| FICE | | 90.9 |\n| Magnification Endoscopy | 93 | 95 |\n| I-SCAN | 28.5 | 78.4 |\n| CLE | 80 | 94 |"
