  - id: res.L06.059
    kind: mcq
    topic: drug-phases
    stem: >-
      A painkiller approved after phase III is withdrawn from the market three years later because a rare
      cardiovascular adverse effect appears in thousands of users. Which phase detected it?
    options:
      - Phase I
      - Phase II
      - Phase III
      - Phase IV
    answer: 3
    why:
      - Phase I tests dose safety in up to 100 volunteers; rare effects can't appear.
      - Phase II looks for efficacy in a few hundred patients.
      - Phase III ended before approval; rare effects often hide in a few thousand patients.
      - Long-term post-marketing surveillance catches rare side effects and can lead to withdrawal (e.g. Vioxx).
    src: { page: 39, quote: "Adverse effects detected by Phase IV trials may result in withdrawal or restriction of a drug -recent examples include Vioxx." }
