          </svg>
      - kind: order
        page: 89
        quote: "Absence of response to a properly administered PPI trial typically prompts an endoscopic evaluation."
        prompt: "رتّب الـ work-up لحد ما توصل لـ functional heartburn:"
        steps:
          - "Optimal-dose PPI trial for 4 weeks"
          - "Upper endoscopy"
          - "pH or impedance-pH test off PPI for 7 days"
          - "Esophageal manometry"
          - "Diagnose functional heartburn"
        why: "الـ PPI trial الأول لأنه أرخص وأسهل. لو فشل يبقى EGD. لو نضيف يبقى pH test (والـ PPI متوقف 7 أيام علشان ما يخبيش الحمض). وفي الآخر manometry تستبعد achalasia و DES."
      - kind: table
        page: 89
        quote: "patients with a hypersensitive esophagus have normal acid exposure time and a positive symptom association"
        title: "Functional heartburn ولا reflux hypersensitivity؟"
        columns: ["Finding", "Functional heartburn", "Reflux hypersensitivity"]
        rows:
          - ["Acid exposure time", "Normal", "Normal"]
          - ["Symptom association", "Negative", "Positive"]
          - ["Endoscopy", "Normal", "Normal"]
        hide: [[1, 1], [1, 2]]
      - kind: aside
        tone: trap
        page: 97
        quote: "Response to antisecretory therapy does not exclude the diagnosis"
        text: |
          الفرق كله في **symptom association**: في الـ reflux hypersensitivity الحمض كميته طبيعية، بس كل reflux event عادي بيعمل أعراض (**triggering by reflux events**).

          وخد بالك: في الـ reflux hypersensitivity الـ ==response to antisecretory therapy== **does not exclude the diagnosis**. أما الـ functional heartburn فمن شروطه إن مفيش relief رغم الـ optimal antisecretory therapy.
      - kind: explain
        page: 90
        quote: "Visceral hyperalgesia is the main mechanism underlying functional heartburn"
        title: "مين المريض، وإيه السبب؟"
        text: |
          مريض الـ ==functional heartburn== غالبًا **young**، **nonobese**، و **women** أكتر.

          الجروب ده هو **most of the patients with GERD who are refractory to PPI therapy**: يعني أغلب "الـ GERD اللي مش بيرد على PPI" هو أصلًا مش GERD.

          السبب الأساسي ==visceral hyperalgesia==، علشان كده العلاج بـ **pain modulators** زي TCAs و SSRIs، مش بزيادة الـ PPI.

          والـ Rome IV criteria بتطلب الأعراض **at least twice a week**، وباقي الـ domain A (chest pain، globus، dysphagia) **once a week**.
      - kind: check
        page: 90
        quote: "They need treatment with pain modulators such as Tricyclic antidepressants and selective serotonin reuptake inhibitors."
        question: "A slim 28-year-old woman has heartburn despite twice-daily PPI. EGD is normal, acid exposure off PPI is normal, symptom association is negative, and manometry is normal. Best next step"
        options:
          - "A pain modulator such as a tricyclic antidepressant"
          - "Increase the PPI to four times daily"
          - "Laparoscopic fundoplication"
          - "Heller myotomy"
        answer: 0
        why:
          - "صح: ده functional heartburn، والآلية visceral hyperalgesia، فالعلاج pain modulators (TCAs أو SSRIs)."
          - "مفيش reflux زيادة أصلًا، فزيادة الـ PPI مش هتفرق."
          - "الجراحة للـ reflux الحقيقي، والـ AET هنا طبيعي."
          - "الـ myotomy للـ achalasia، والـ manometry هنا طبيعية."
      - kind: aside
        tone: joke
        page: 91
        quote: "on chronic (5–6 weeks) exposure may desensitize the esophagus and modulate the TRPV1 receptors"
        text: |
          علاج غريب في الكتاب: **red chili** لمدة 5–6 أسابيع حسّن الـ heartburn والـ functional dyspepsia!

          السر في الـ ==capsaicin==: في الأول (**<1 week**) ممكن يزوّد الـ reflux، بس على المدى الطويل (**5–6 weeks**) بيعمل desensitization للمريء عن طريق الـ **TRPV1 receptors**. الشطة بتحرق الأول، وبعدين المريء "بيتعوّد" ويبطّل يشتكي.

          وباقي النصايح: بلاش الأكل الدسم، وخس الوزن لو فيه overweight.
      - kind: explain
        page: 94
        quote: "This overlap is due to the spinal primary sensory afferent that carries cardiac and esophageal nociceptive information"
        title: "Chest pain: القلب الأول دايمًا"
        text: |
          أول خطوة في الـ esophageal chest pain: ==rule out life-threatening conditions== زي ischemic heart disease، وبعدها panic disorder والـ musculoskeletal causes.

          ألم المريء بيشبه القلب: **pressure** في نص الصدر بيروح للضهر والدراعات والفك. السبب إن نفس الـ **spinal primary sensory afferent** شايل إشارات القلب والمريء.

          - **Well-accepted causes:** reflux esophagitis (==the most common==)، achalasia، diffuse esophageal spasm.
          - **Probable causes:** hypertensive motility (nutcracker esophagus)، sustained longitudinal muscle contraction، esophageal hypersensitivity.
      - kind: case
        page: 95
        quote: "Diagnostic Algorithm for Functional Chest Pain of Presumed Esophageal Origin"
        stem: "A 45-year-old man has recurrent chest pain. History, ECG, stress test and coronary angiography are all normal."
        steps:
          - question: "What is the next step in the esophageal work-up?"
            options: ["Upper endoscopy (EGD)", "Heller myotomy", "Start a benzodiazepine", "Repeat coronary angiography"]
            answer: 0
            why: "القلب اتستبعد، فبقى noncardiac chest pain، وأول خطوة في الـ algorithm هي EGD (أو PPI trial empirically زي ما الكتاب بيقول)."
          - question: "EGD shows LA grade A only. What next?"
            options: ["Ambulatory pH study off PPI", "Treat as erosive GERD and stop", "Manometry before anything else", "Video swallow"]
            answer: 0
            why: "**Normal or LA grade A** بيكمّل لـ pH study. أما LA grade B–D فده GERD وبنعدّل الـ PPI."
          - question: "pH study is negative and manometry shows no achalasia or DES. Diagnosis"
            options: ["Functional chest pain of presumed esophageal origin", "Reflux hypersensitivity", "Functional heartburn", "Globus"]
            answer: 0
            why: "GERD اتستبعد بالـ pH، والـ motility بالـ manometry، والألم صدري مش حرقان، فده **functional chest pain**."
      - kind: explain
        page: 96
        quote: "TCAs such as imipramine and trazodone , SSRIs such as citalopram and sertraline, pain receptor (TRPV1) antagonist AZD1386 and theophylline"
        title: "علاج الـ functional chest pain"
        text: |
          - **Psychosomatic and alternative:** ==CBT== فعّال، و **hypnotherapy** بتقلل شدة الألم، واتجرّب **Johrei** (energy healing).
          - **Pharmacotherapy:** TCAs زي imipramine و trazodone، SSRIs زي citalopram و sertraline، **TRPV1 antagonist AZD1386**، و **theophylline**، وكمان **venlafaxine** (SNRI).

          الفكرة واحدة: المريء حساس، فبنهدّي الـ ==pain processing== مش الحمض.
      - kind: sort
        page: 97
        quote: "Globus is described as a ‗lump’ in the throat that is experienced without swallowing and may actually get better with swallowing."
        prompt: "Globus ولا functional dysphagia؟"
        bins: ["Globus", "Functional dysphagia"]
        cards:
          - { text: "Lump in the throat between meals", bin: 0 }
          - { text: "Gets better when he swallows", bin: 0 }
          - { text: "A gastric inlet patch must be absent", bin: 0 }
          - { text: "Solid or liquid food sticks on the way down", bin: 1 }
          - { text: "Video swallow if the problem is proximal", bin: 1 }
          - { text: "Empiric 14–18 mm dilation helped some patients", bin: 1 }
        why: "الـ globus **non-painful lump** بيحس بيه من غير ما يبلع، وبيتحسن مع البلع. الـ dysphagia العكس: الأكل نفسه بيقف وهو نازل. والاتنين لازم تستبعد فيهم الـ structural والـ motility والـ GERD."
      - kind: explain
        page: 99
        quote: "Empiric dilation with 14–18 mm dilators has been described in patients with nonobstructive dysphagia"
        title: "الـ functional dysphagia: تشخيص وعلاج"
        text: |
          الـ dysphagia مع **reflux symptoms** تبقى ==alarm symptom== ولازم endoscopy.

          الـ functional dysphagia **diagnosis of exclusion**: EGD، barium swallow، PPI trial، manometry، و **video swallow** لو المشكلة proximal (cricopharyngeal bar، Zenker's).

          العلاج:
          - **Reassurance**، مضغ كويس، وبلاش الأكل اللي بيعمل الأعراض.
          - **Low-dose trazodone** أو TCAs أو SSRIs، لأن الإحساس جوه المريء نفسه abnormal.
          - ==Empiric dilation== بـ **14–18 mm** dilators، ونتايجها كويسة نسبيًا.
          - **Botulinum toxin** لـ localized motility disorder مش achalasia، والفايدة مؤقتة.
      - kind: try
        items: [git.L03.062, git.L03.066, git.L03.067, git.L03.068, git.L03.102]
    recap:
      - "Functional esophageal = بعد استبعاد GERD والـ primary motility (achalasia، DES)."
      - "Heartburn: PPI 4 weeks ← EGD ← pH off PPI 7 days ← manometry ← functional heartburn."
      - "AET طبيعي + association سلبي = functional heartburn. AET طبيعي + association إيجابي = reflux hypersensitivity."
      - "Functional heartburn = visceral hyperalgesia، علاجه TCAs/SSRIs. Twice a week."
      - "Chest pain: القلب الأول. Reflux esophagitis أشهر سبب للـ noncardiac chest pain."
      - "Globus = lump بيتحسن بالبلع. Functional dysphagia = أكل بيقف، وممكن dilation 14–18 mm."
