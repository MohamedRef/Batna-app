        text: |
          - **Presumptive**: الصورة الكلاسيكية + uric acid عالي.
          - ==Definite==: **MSUM crystals** تحت الـ **polarized light microscopy** من aspirate المفصل أو الـ bursa أو الـ tophus.

          الـ synovial fluid في النوبة: **turbid**، viscosity قليلة، **20,000-100,000** WBC/mm³ أغلبها **neutrophils**.
      - kind: check
