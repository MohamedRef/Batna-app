  - id: hb.L13.lesson4
    title: "الـ PBC: مرض «مامي» من جوّه"
    hook: "ست في الخمسينات بتهرش وتعبانة، والـ AMA موجب. من هنا لحد الـ transplant في درس واحد."
    minutes: 10
    pages: [215, 217]
    topics: [pbc-disease]
    goals:
      - "تعرف مين بيجيله الـ PBC والـ immunology بتاعته"
      - "ترتّب الـ 4 histological stages"
      - "تفرّق أول عرض specific عن أكتر عرض شائع"
      - "تعرف العلاج: UDCA، OCA، elafibranor، colestyramine، و transplant"
    status: unverified
    steps:
      - kind: explain
        remind: [hb.L13.073, rheum.L21.lesson2:CREST]
        page: 215
        quote: "Epidemiology:\n  1. Primary biliary cirrhosis (PBC) is found in all races.\n  2. Approximately 90 – 95% of patients are female.\n  3. Age of onset typically ranges from 30 to 70."
        title: "مين وإيه الـ antibodies؟"
        text: |
          - **Epidemiology**: في كل الأجناس، و 90–95% ستات، والسن غالبًا من 30 لـ 70.
          - ==AMA== (antimitochondrial antibody): موجود في 95%. ده أهم marker في المرض كله.
          - ==IgM==: مرتفع، و immunoreactive، و highly cryoprecipitable.

          **Associated autoimmune diseases**:

          - **Thyroiditis** و hypothyroidism.
          - **Rheumatoid arthritis**.
          - **Calcinosis, Raynaud's, esophageal dysmotility, sclerodactyly, telangiectasia (CREST)**: calcinosis، و Raynaud's، و esophageal dysmotility، و sclerodactyly، و telangiectases.
          - **Sjögren's syndrome**: وده بيفسّر الـ dry eyes والـ dry mouth اللي هتشوف علاجهم بعدين.
          - **Scleroderma**.

          مثال: ست في الخمسينات عندها Sjögren's، وبتشتكي من هرش، والـ alkaline phosphatase (ALP) عالي. أول test تطلبه هو الـ AMA.

          ليه الـ AMA بالذات هو أول test؟ عشان موجود في **95%**، فلو سالب الـ PBC بقت بعيدة. والـ associated diseases بتقولك إن ده مرض مناعي، فلو لقيت واحد منهم عند ست عندها cholestasis، الشك بيزيد.
      - kind: reveal
        page: 215
        quote: "3. Association with other autoimmune diseases\n  Thyroiditis, hypothyroidism.\n  Rheumatoid arthritis.\n  CREST syndrome (calcinosis, Raynaud‘s phenomenon, esophageal\n dysmotility, sclerodactyly, telangiectases).\n  Sjögren‘s syndrome.\n  Scleroderma."
        prompt: "ليه الكتاب بيحط الـ thyroiditis والـ Sjögren's والـ CREST في الـ immunologic abnormalities بتاعة الـ PBC؟ وتستفيد منها إيه في العيادة؟"
        answer: |
          عشان الـ PBC نفسها مرض مناعي: **AMA** في 95%، و **IgM** عالي. والكتاب بيحط الأمراض دي جنبهم كـ **association with other autoimmune diseases**.

          التفسير المقبول (مش في الكتاب): نفس الأرضية المناعية (ست، وجينات بتميل للـ autoimmunity) بتطلّع أكتر من مرض في نفس الشخص.

          والفايدة عمليًا في اتجاهين:
          - ست عندها Sjögren's أو hypothyroidism و ALP عالي: فكّر في PBC واطلب AMA.
          - مريضة PBC بتشتكي من تعب أو جفاف: افتكر الـ **hypothyroidism** والـ **Sjögren's** قبل ما تقول إنه من الكبد. ولاحظ إن الكتاب بيعالج الـ **dry mouth and eyes** في الآخر بـ artificial tears.
      - kind: reveal
        page: 215
        quote: "2. Approximately 90 – 95% of patients are female.\n 3. Age of onset typically ranges from 30 to 70."
        prompt: "الـ PBC في 90–95% ستات، والـ PSC في الدرس الجاي أغلبه رجالة. الفرق ده بيفيدك في إيه؟"
        answer: |
          الكتاب: الـ PBC **90–95% female**، والسن **30–70**. والـ PSC (p225) حوالي **67% رجالة** في الأربعينات.

          التفسير المقبول (مش في الكتاب) لسبب غلبة الستات: أغلب الأمراض المناعية أكتر في الستات، والأسباب المطروحة الهرمونات وتأثيرها على المناعة والجينات اللي على الـ X chromosome، بس السبب الدقيق مش معروف.

          الفايدة عمليًا: نفس الـ cholestatic picture (ALP عالي وهرش) عند ست في الخمسينات = فكّر PBC واطلب **AMA**. عند راجل عنده **UC** = فكّر PSC واطلب **MRCP**.
      - kind: update
        ref: "EASL and AASLD name change, 2015"
        text: |
          الكتاب بيستخدم الاسمين: «primary biliary **cirrhosis**» و «primary biliary **cholangitis**». الاسم الرسمي من 2015 بقى **cholangitis**، لأن أغلب المرضى مش بيوصلوا لـ cirrhosis. نفس المرض ونفس الإجابة.
      - kind: mnemonic
        page: 215
        quote: "Antimitochondrial antibody (AMA). Detected in 95% of patients with PBC."
        word: "MAMI"
        parts:
          - { key: "M", text: "Middle-aged woman: 90–95% female, onset 30–70" }
          - { key: "A", text: "AMA positive in 95%" }
          - { key: "M", text: "IgM raised (immunoreactive, cryoprecipitable)" }
          - { key: "I", text: "Itch: pruritus is the earliest specific complaint" }
        hook: |
          الـ PBC هو مرض «مامي»: ست في منتصف العمر، بتهرش، والتحاليل فيها **M** مرتين (AMA و IgM).
      - kind: reveal
        page: 216
        quote: "The destruction of bile ducts eventually leads to portal inflammation and scarring, and ultimately to cirrhosis and liver failure."
        prompt: "المرض بيهاجم الـ small bile ducts... طب ليه الـ hepatocytes نفسها بتتأذي؟"
        answer: |
          لأن فيه **process تانية**:

          - الأولى: **chronic destruction of small bile ducts**، غالبًا بـ **activated cytotoxic T lymphocytes**.
          - التانية: **chemical damage to hepatocytes** في الأماكن اللي الـ bile مش عارف يصرّف منها، لأن الـ ducts اتدمرت.

          الصفرا المحبوسة نفسها بتسمّم الخلايا. والنهاية: portal inflammation → scarring → **cirrhosis** و liver failure.
      - kind: figure
        page: 216
        quote: "Four histological stages of PBC have been identified. Stage I Damaged bile ducts are usually surrounded by a dense infiltrate of mononuclear cells, most of which are lymphocytes."
        title: "الـ 4 stages على سلّم"
        alt: "Four stacked panels from stage I to stage IV. Stage I: a small bile duct ringed by lymphocytes, the florid duct lesion. Stage II: fewer normal ducts, atypical tortuous ducts, portal fibrosis and inflammation spilling into periportal areas. Stage III: fibrous septa link portal tract to portal tract. Stage IV: cirrhosis with regenerative nodules and paucity of bile ducts in the scars."
        caption: "كل stage بتزوّد حاجة: lymphocytes حوالين الـ duct، بعدين ducts مشوّهة وfibrosis، بعدين **portal-to-portal bridges**، وفي الآخر cirrhosis."
        svg: |
