  - id: endo.L02.lesson4
    title: "Acromegaly، Sheehan، hypophysitis و DI"
    hook: "في الحمل في GH تاني جاي من المشيمة، وإنزيم بياكل الـ vasopressin. الحمل بيلخبط كل الحسابات."
    minutes: 10
    pages: [21, 24]
    topics: [pituitary-physiology, acromegaly, hypophysitis-sheehan, di]
    goals:
      - "تعرف الـ placental GH وليه بيصعّب تشخيص الـ acromegaly"
      - "تفرّق Sheehan's من lymphocytic hypophysitis"
      - "تعرف علاج الـ DI في الحمل"
    status: unverified
    steps:
      - kind: explain
        page: 21
        quote: "Detected at Sth week, and peaks at 35—37th weeks -Affected neither by GHRH nor by ghrelin -Binds GHBP"
        title: "الـ GH بتاع المشيمة (GH-V)"
        text: |
          المشيمة بتفرز ==GH-V== بشكل **continuous**:
          - بيبان من **الأسبوع 5** ويوصل للـ peak في **35-37**.
          - مش بيتأثر بالـ GHRH ولا الـ ghrelin، وبيرتبط بالـ GHBP.
          - بيعلّي الـ **IGF-1** (growth-promoting للجنين والمشيمة)، والـ IGF-1 بيكبت الـ GH بتاع الـ pituitary.
      - kind: explain
        page: 21
        quote: "Glucose intolerance occurs in 50% of patients with Acromegaly, with overt diabetes mellitus in 10-20%."
        title: "Acromegaly والحمل"
        text: |
          - الـ **infertility** شائعة، وكتير محتاجين dopamine agonist علشان يحملوا.
          - في دراسة على 24 حامل، **4 بس (17%)** الورم كبر وعمل visual field defect.
          - تابع الـ macroadenoma بالأعراض والـ visual fields، وكمان glucose و BP والقلب.
          - Glucose intolerance **50%**، DM صريح **10-20%**.
          - ==GH does not cross the placenta==، والـ macrosomia سببها سكر الأم.
      - kind: reveal
        page: 22
        quote: "a pulsatility of 13-19 pulses per 24 hours, vs. the tonic secretion seen with the placental variant"
        prompt: "ليه تشخيص الـ acromegaly في الحمل صعب، وإيه اللي يفرّق؟"
        answer: |
          - التحاليل العادية مش بتفرّق بين GH الـ pituitary و GH المشيمة.
          - الـ **IGF-1** عالي في النص التاني من أي حمل.
          - **الفرق:** GH الـ acromegaly **pulsatile** (13-19 pulse في 24 ساعة)، والمشيمي **tonic**. وبعد الولادة المشيمي بيختفي خلال **24 ساعة**.
      - kind: table
        page: 23
        quote: "somatostatin analogs should be discontinued if pregnancy is considered and that contraception be used"
        title: "أدوية الـ acromegaly في الحمل"
        columns: ["Drug", "Pregnancy"]
        rows:
          - ["Dopamine agonist", "Controls 10%; better if GH + PRL co-secretion"]
          - ["Somatostatin analogue", "Crosses placenta; stop if pregnancy considered"]
          - ["Pegvisomant", "Safety not established"]
          - ["Stopping therapy", "9-12 months off: no real harm long-term"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: aside
        tone: tip
        page: 22
        quote: "Octreotide binds to somatostatin receptors in the placenta and crosses the placenta"
        text: "ليه الـ octreotide مقلق؟ بيعدّي المشيمة، والـ somatostatin receptors منتشرة في أنسجة الجنين وخصوصًا المخ. كمان الـ short-acting قلل الـ uterine artery flow، وجنين عمل IUGR اتحسن لما قلّلوا جرعة الـ LAR."
      - kind: figure
        page: 24
        quote: "Compression of blood supply"
        title: "ليه الـ pituitary بتموت بعد الولادة؟"
        alt: "Flowchart. Placental estrogen causes lactotroph hyperplasia and pituitary enlargement, compressing its own blood supply; a small sella compresses the enlarged pituitary; severe postpartum haemorrhage causes hypotension or shock; DIC also contributes. All make the pituitary susceptible to ischaemia, leading to postpartum necrosis and hypopituitarism, which pituitary autoimmunity may worsen."
        caption: "غدة كبيرة في أوضة ضيقة، وبعدين نزيف يقطع الدم. ده Sheehan."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="E02d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
