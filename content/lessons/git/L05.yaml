  - id: git.L05.lesson3
    title: "بوليبات الالتهاب والـ hamartoma"
    hook: "بوليب ورا التهاب، وبوليب في الـ UC مش بريء خالص، وبوليب أحمر زي الكرز عند طفل."
    minutes: 8
    pages: [192, 194]
    topics: [inflammatory, hamartoma]
    goals:
      - "تعرف الـ inflammatory polyps والـ DALM وليه الـ DALM خطير"
      - "تعرف الـ hamartomatous polyp وشكله"
      - "تعدّ الـ hamartomatous syndromes وتعرف مين acquired، وتعرف FAP"
    status: unverified
    steps:
      - kind: explain
        page: 192
        quote: "a- Inflammatory polyps Typically seen in IBD, are indicative of regenerative and/or healing phases of mucosal ulceration."
        title: "Inflammatory polyps"
        text: |
          - **Typically seen in inflammatory bowel disease (IBD)**، وبتدل على ==regenerative== أو healing phase بعد الـ ulceration.
          - كتير وأحيانًا **filiform**، وممكن تكبر لدرجة **intussusception** أو luminal obstruction.
          - على السطح: erosions، congestion، hemorrhage، crypt abscesses.

          التفسير المقبول (مش في الكتاب): ليه بنهتم بيها رغم إنها مش ورم؟ لأنها في المنظار ممكن تشبه بوليب حقيقي أو DALM، فلازم تفرّق بالـ biopsy في مريض IBD.
      - kind: figure
        page: 192
        title: "الـ inflammatory polyps"
        image: { file: git/L05-inflammatory-polyps.webp, book: true }
        alt: "Book colonoscopy picture of an inflamed colon with many small raised polyps around the lumen."
        caption: |
          بوليبات **كتير** في قولون ملتهب. دي ==healing== بعد الـ ulceration في الـ IBD، مش أورام.
      - kind: reveal
        page: 192
        quote: "Typically seen in IBD, are indicative of regenerative and/or healing"
        prompt: "ليه الـ inflammatory polyp علامة على إن القولون بيخف، مش بيتعب أكتر؟"
        answer: |
          الكتاب: الـ inflammatory polyps بتدل على ==regenerative and/or healing phases== بعد الـ **mucosal ulceration**.

          التفسير المقبول (مش في الكتاب): لما القرح تبقى عميقة، الـ mucosa اللي بين القرح بتفضل «جزر» عالية. ولما القرح تلم وتتصلح، الجزر دي بتفضل بارزة كأنها بوليبات (pseudopolyps). يعني هي أثر نوبة عدّت، مش ورم. بس لو كتير وطوال (filiform) ممكن تقفل الـ lumen أو تعمل intussusception، وممكن تخبّي وراها حاجة تانية في المنظار.
      - kind: explain
        page: 192
        quote: "Dysplasia-associated lesion or mass (DALM): a raised mucosal lesion in a patient with long-standing inflammatory bowel disease (IBD), mainly mucosal"
        title: "DALM: البوليب اللي في الـ UC ومش بريء"
        text: |
          **DALM** = dysplasia-associated lesion or mass: lesion **raised** في مريض **long-standing IBD** (خصوصًا ulcerative colitis (UC))، والـ histology فيها ==dysplasia==.

          والمهم: بيتحول لسرطان **much faster** من الـ classic adenoma-to-carcinoma sequence.

          يعني أي lesion بارز في قولون UC قديم، اعتبره DALM لحد ما الـ biopsy تقول غير كده، لأن الطريق للسرطان هنا قصير.
      - kind: explain
        page: 193
        quote: "The transition of a DALM to colorectal cancer is believed to be much"
        title: "ليه الـ DALM أسرع من الـ adenoma؟"
        text: |
          الكتاب: الـ DALM lesion **raised** في مريض **long-standing IBD**، أساسًا **mucosal ulcerative colitis**، وفيه **dysplasia** في الـ histology. والتحول لسرطان ==much faster== من الـ classic adenoma-to-carcinoma sequence.

          التفسير المقبول (مش في الكتاب): في الـ adenoma العادي الخلية بتمشي الطريق خطوة خطوة (APC الأول). في الـ UC الالتهاب المزمن بيضرب الـ p53 بدري (فاكر طريق الالتهاب في المحاضرة اللي فاتت؟)، فالخلية بتبدأ من خطوة متقدمة. وكمان الـ mucosa حوالين الـ DALM كلها ملتهبة ومعرّضة، فالخطر مش في البوليب بس. وعلشان كده الـ DALM غالبًا محتاج قرار أكبر من مجرد polypectomy.
