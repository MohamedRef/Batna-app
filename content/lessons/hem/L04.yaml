        page: 63
        title: "فريقين"
        quote: "Leukocytes\n  Granulolcytes, which include three types of cells: neutrophils, eosinophils & basophils; together with monocyte comprise the phagocytes. Normally only mature phagocytic cells and lymphocytes are found in the peripheral blood.\n  Lymphocyte, their precursor cells and plasma cells make up the immunocytes."
        text: |
          - ==Phagocytes==: الـ **granulocytes** (neutrophils و eosinophils و basophils) + **monocytes**.
          - ==Immunocytes==: الـ **lymphocytes** وسلايفها والـ **plasma cells**.

          وفي الـ peripheral blood الطبيعي مش بتلاقي غير **mature phagocytes** و **lymphocytes**. أي خلية صغيرة (immature) في الـ film يبقى فيه حاجة. ليه؟ التفسير المقبول (مش في الكتاب): لأن النخاع الطبيعي بيمسك الخلايا جوّاه لحد ما تنضج، فلو طلعت صغيرة يبقى يا إما النخاع اتزحم، يا إما مضغوط بطلب جامد زي عدوى شديدة. ده بالظبط موضوع الدرس الجاي.
      - kind: figure
        page: 63
        title: "شكل الكتاب ص 63: الـ leukocytes جاية منين"
        image: { file: hem/L04-leukocyte-lineage.webp, book: true }
        alt: "Book lineage chart. Top: blood stem cell gives a myeloid stem cell and, to the right, a lymphoid stem cell. The myeloid stem cell feeds an orange band of proerythroblast, three myeloblasts, monoblast and megakaryoblast. Below them: early and late erythroblast, normoblast, reticulocyte, erythrocyte; three columns of promyelocytes, eosinophilic, basophilic and neutrophilic myelocytes and metamyelocytes, a neutrophilic band cell, then eosinophil, basophil and neutrophil (granular leukocytes); promonocyte to monocyte and a tissue macrophage; promegakaryocyte to megakaryocyte to platelets. The lymphoid stem cell gives B and T lymphocytes."
        caption: |
          ده شكل تاني لنفس الشجرة، بس مركّز على الـ **WBCs** وفيه مراحل أكتر:

          - **فوق**: **blood stem cell** ← **myeloid stem cell** (تحتها)، وسهم طويل يمين لـ ==lymphoid stem cell==.
          - **الحزام البرتقاني**: الـ blasts: proerythroblast، **3 myeloblasts**، monoblast، megakaryoblast.
          - **التلات أعمدة اللي في النص**: كل myeloblast ← promyelocyte ← **myelocyte** ← **metamyelocyte** (والـ neutrophil بس ليه **band cell**) ← **eosinophil** و **basophil** و **neutrophil**: دول الـ ==granular leukocytes==.
          - **monoblast** ← promonocyte ← **monocyte**، وتحته الشكل الممدود ده الـ **macrophage** في الأنسجة.
          - **أقصى اليمين**: الـ lymphoid stem cell بتطلّع **B lymphocyte** و **T lymphocyte**.

          ده بيشرح تقسيم الكتاب: الـ granulocytes + الـ monocyte = ==phagocytes== (من الـ myeloid)، والـ lymphocytes = immunocytes (من الـ lymphoid).
      - kind: explain
        remind: [hem.L04.023]
        page: 64
        title: "T و B و NK"
        quote: "B cells\nplus \"natural killer cells\"\nT cells attack foreign cells directly - Killer cells (\"cytotoxic\"), or CD8+ is a main type"
        text: |
          - **T cells** بتهاجم بإيدها: الـ **cytotoxic CD8+** بتلزق في الـ target، تفرز proteins تخرم الـ membrane، وتقولها تموت (apoptosis).
          - **B cells** بتبقى **plasma cells** تفرز **antibodies**، والـ antibodies بتعلّم البكتيريا علشان الـ **macrophages** تاكلها.
          - وفيه كمان **natural killer cells**.

          ليه نوعين؟ التفسير المقبول (مش في الكتاب): الـ T بيتعامل مع العدو اللي **جوّه** خلايانا (فيروس، خلية cancer)، فلازم يقتل الخلية نفسها. والـ B بيتعامل مع اللي **برّه** الخلايا (بكتيريا، toxins)، فيكفي يعلّم عليه والـ macrophage ياكله.

          والـ **monocytes** في الـ connective tissue بتبقى **macrophages** (phagocytes بـ pseudopods).
      - kind: figure
        page: 64
        title: "شكل الكتاب ص 64 (a): الـ T cell بتقتل إزاي"
        image: { file: hem/L04-t-cell-killing.webp, book: true }
        alt: "Book drawing (a), four steps from left to right: 1, a T lymphocyte; 2, it binds to a target cell bearing antigen and secretes proteins that lyse the cell's membrane and signal the cell to die; 3, the T lymphocyte detaches; 4, the target cell dies by apoptosis."
        caption: |
          4 خطوات **من الشمال لليمين** بالأرقام اللي تحت كل خلية:

          1. **T lymphocyte** (الكورة البنفسجي).
          2. بتلزق في **target cell** عليها **antigen** (الخلية البرتقاني)، وتفرز proteins تخرم ==membrane== بتاعتها وتقولها تموت.
          3. الـ T cell **بتسيبها** وتمشي (وتقدر تروح لخلية تانية).
          4. الـ target cell بتموت بـ ==apoptosis== (الشكل المفتت يمين).

          ده معنى "T cells attack foreign cells directly": الـ ==cytotoxic CD8+== بتقتل بنفسها من غير antibodies.
      - kind: figure
        page: 64
        title: "شكل الكتاب ص 64 (b): الـ B cell بتعلّم البكتيريا"
        image: { file: hem/L04-b-cell-antibodies.webp, book: true }
        alt: "Book drawing (b), four steps from left to right: 1, a B lymphocyte; 2, it gives rise to a plasma cell, which secretes Y-shaped antibodies; 3, the antibodies bind to surface antigens on green rod-shaped bacteria, marking them for destruction; 4, a macrophage avidly phagocytoses the antibody-coated bacteria."
        caption: |
          برضه 4 خطوات **من الشمال لليمين**:

          1. **B lymphocyte**.
          2. بتبقى ==plasma cell== (الخلية البيضاوي الكبيرة) وبتفرز **antibodies** (الحاجات الصغيرة اللي على شكل Y).
          3. الـ antibodies بتمسك في الـ **surface antigen** على البكتيريا (العصيان الخضرا) وتعلّم عليها.
          4. الـ ==macrophage== (يمين) بياكل البكتيريا المتغطية بالـ antibodies بسرعة.

          قارنها بـ (a) اللي فوق: الـ T cell بتقتل بإيدها، أما الـ B cell ==ما بتقتلش== بنفسها؛ بتعلّم الهدف والـ macrophage هو اللي بيخلص عليه.
      - kind: order
        page: 64
        quote: "B cells\n  Differentiate into plasma cells\n  Plasma cells secrete antibodies\n  Antibodies flag cells for destruction by macrophages"
        prompt: "رتّب طريق الـ B cell لحد ما البكتيريا تتاكل:"
        steps:
          - "B cell → plasma cell"
          - "Plasma cell secretes antibodies"
          - "Antibodies coat the bacteria"
          - "Macrophage phagocytoses the coated bacteria"
        why: "الـ B cell مش بتقتل بنفسها: بتعلّم الهدف (opsonization) والـ macrophage هي اللي بتاكل."
      - kind: aside
        tone: exam
        page: 64
        quote: "Monocytes\n  4-8% of WBCs\n  In connective tissue they transform into macrophages (phagocytic cells with pseudopods)"
        text: |
          فخ أرقام: الـ complete blood count (CBC) table (ص 62) بتقول **monocytes 1–10%**، وصفحة 64 بتقول **4–8% of WBCs**.

          الاتنين من الكتاب. لو السؤال عن "normal differential" اكتب **1–10%**، ولو عن الـ monocytes لوحدها افتكر **4–8%**.
      - kind: explain
        remind: [hem.L04.024]
        page: 65
        title: "تقسيم الـ leukocyte disorders وأشكال الـ congenital"
        quote: "Barr bodies: Drumstick appendage in females, it represents inactive X chromosome."
        text: |
          بتتقسم: **benign/malignant**، **hereditary/acquired**، **functional/numerical**، و **morphological**.

          الـ congenital morphology:
          - **Barr body**: ==drumstick== في نواة الـ neutrophil عند الستات = الـ **inactive X**.
          - **Pelger-Huët anomaly**: neutrophil **bilobed**.
          - **Hereditary hypersegmentation**: **autosomal dominant**.

          ليه الـ Barr body في الستات بس؟ عشان الكتاب بيقول إنها الـ **inactive X**؛ الست عندها X اتنين واحد منهم بيتقفل ويتكثف، والراجل عنده X واحد شغال. والأشكال دي congenital، يعني التفسير المقبول (مش في الكتاب) **مالهاش لازمة إكلينيكية** غالبًا؛ أهميتها إنك ما تتلخبطش بينها وبين الـ acquired.
      - kind: explain
        remind: [hem.L04.029]
        page: 65
        title: "Chediak-Higashi: الطفل الأشقر اللي بيتعب كتير"
        quote: "Chediak-Higashi syndrome: a rare autosomal recessive disorder characterized by oculocutaneous albinism, recurrent and severe bacterial infections, giant blue-grey granules in the cytoplasm of granulocytes, monocytes & lymphocytes , a mild bleeding diathesis, progressive peripheral neuropathy and cranial nerve abnormalities."
        text: |
          ==Chediak-Higashi== نادر و **autosomal recessive**:
          - **Oculocutaneous albinism**: photophobia و sun sensitivity
          - **Recurrent severe bacterial infections**، خصوصًا **Staph aureus**
          - **Giant blue-grey granules** في الـ granulocytes والـ monocytes والـ lymphocytes
          - **Mild bleeding diathesis**
          - **Progressive peripheral neuropathy** و cranial nerve abnormalities

          العلاج: **Bone marrow transplantation (BMT)**.

          ليه كل الأعراض دي مع بعض؟ التفسير المقبول (مش في الكتاب): العيب في طريقة الخلية بتنقل وتفرّغ **الحبيبات** بتاعتها. الـ granules بتتجمع وتكبر (الـ giant granules) بدل ما تتفرّغ على البكتيريا، فالعدوى تتكرر. ونفس العيب في خلايا الـ pigment (albinism)، والصفايح (النزيف)، والأعصاب. وليه BMT؟ لأنه بيدّي خلايا دم سليمة.
      - kind: mnemonic
        page: 65
        quote: "Chediak-Higashi syndrome: a rare autosomal recessive disorder characterized by oculocutaneous albinism, recurrent and severe bacterial infections, giant blue-grey granules in the cytoplasm of granulocytes, monocytes & lymphocytes , a mild bleeding diathesis, progressive peripheral neuropathy and cranial nerve abnormalities."
        word: "GIANT"
        parts:
          - { key: "G", text: "Giant blue-grey granules" }
          - { key: "I", text: "Infections: recurrent, severe, Staph aureus" }
          - { key: "A", text: "Albinism (oculocutaneous): photophobia, sun sensitivity" }
          - { key: "N", text: "Neuropathy: peripheral and cranial nerves" }
          - { key: "T", text: "Thrombocyte problem: mild bleeding diathesis; treat with BMT" }
        hook: "الحبوب **GIANT** والمشاكل GIANT كمان."
      - kind: table
        page: 65
        quote: "Chediak-Higashi syndrome: a rare autosomal recessive disorder characterized by oculocutaneous albinism, recurrent and severe bacterial infections, giant blue-grey granules in the cytoplasm of granulocytes, monocytes & lymphocytes , a mild bleeding diathesis, progressive peripheral neuropathy and cranial nerve abnormalities.\n  Oculocutaneous albinism\n    Photophobia\n    Sun sensitivity\n  Neuropathy\n  Infections, esp Staph aureus\n  TX: BMT"
        title: "الـ acquired: الشكل ← السبب"
        columns: [Finding, Cause]
        rows:
          - ["Toxic granulation", "Infection"]
          - ["Hypersegmented", "Megaloblastic anemia, cytotoxic drugs"]
          - ["Pseudo-Pelger", "Myelodysplasia"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 65
        title: "الـ acquired: ليه كل شكل بيقول سبب"
        quote: "Toxic Granulation: Infection"
        text: |
          - **Toxic granulation** = **infection**. التفسير المقبول (مش في الكتاب): الـ neutrophil في العدوى بيتطلع بسرعة وحبيباته **أكتر وأغمق**، كأنه خرج مستعد للحرب.
          - **Hypersegmented neutrophils** = **megaloblastic anaemia** أو **cytotoxic drugs**. ليه؟ زي ما شفت في الـ B12 والـ folate: الاتنين بيبوّظوا تصنيع الـ DNA، والنواة ما بتنضجش صح فبتتقسم فصوص زيادة.
          - **Pseudo-Pelger-Huët** (acquired) = ==myelodysplasia==. نفس شكل الـ Pelger (bilobed)، بس جه متأخر، يعني الـ stem cell نفسها بقت بتنتج خلايا معيوبة.

          يعني الشكل لوحده مش كفاية: **السن والتاريخ** هما اللي بيقولولك congenital ولا acquired.
      - kind: aside
        tone: trap
        page: 65
        quote: "Pelger Huet anomaly: bilobed neutrophil"
        text: |
          نفس الشكل (bilobed neutrophil) ومعنيين:
          - من الولادة وطول عمره ← **Pelger-Huët anomaly** (congenital، مالهاش لازمة).
          - راجل كبير فجأة ومعاه cytopenias ← **pseudo-Pelger-Huët** = فكّر في ==myelodysplasia==.
      - kind: check
        page: 65
        quote: "Pseudo-Pelger Huet(acquired): myelodysplasia"
        question: "A 74-year-old man has new pancytopenia and many bilobed neutrophils. What should you suspect?"
        options:
          - "Myelodysplasia (pseudo-Pelger-Huët)"
          - "Congenital Pelger-Huët anomaly"
          - "Chediak-Higashi syndrome"
          - "Bacterial infection"
        answer: 0
        why:
          - "صح: شكل bilobed جديد في راجل كبير مع cytopenias = pseudo-Pelger-Huët = myelodysplasia."
          - "الـ congenital موجود من الولادة ومالوش cytopenias."
          - "ده طفل بـ albinism و giant granules."
          - "العدوى بتعمل toxic granulation."
      - kind: try
        items: [hem.L04.017, hem.L04.020, hem.L04.026, hem.L04.028, hem.L04.031]
    recap:
      - "Phagocytes = granulocytes + monocytes. Immunocytes = lymphocytes + precursors + plasma cells."
      - "في الدم الطبيعي mature phagocytes و lymphocytes بس."
