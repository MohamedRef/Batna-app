schema: batna.content/v1
lecture: geri.L12
title: Elder abuse
author: Prof. Nany Hasan
book: { chapter: 7, pages: [210, 219] }
topics:
  - { id: definition, title: "Definition and cultural dimensions" }
  - { id: prevalence, title: "Prevalence" }
  - { id: easi, title: "Screening: the Elder Abuse Suspicion Index (EASI) and Mini-Cog" }
  - { id: barriers, title: "Barriers to obtaining statistics" }
  - { id: types, title: "Types of elder abuse and common abusers" }
  - { id: risk, title: "Risk factors in the elder and the caregiver" }
  - { id: signs, title: "Where it happens and warning signs" }
  - { id: prevention, title: "Prevention" }
items:
  # ---------- p210: definition ----------
  - id: geri.L12.001
    kind: card
    topic: definition
    front: WHO definition of elder abuse (2008)?
    back: A single or repeated act, or lack of appropriate action, occurring within any relationship where there is an expectation of trust, which causes harm or distress to an older person.
    src: { page: 210, quote: "Elder abuse is a single, or repeated act, or lack of appropriate action, occurring within any relationship where there is an expectation of trust" }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.002
    kind: cloze
    topic: definition
    text: "Elder abuse may be an act or a {{c1::lack of appropriate action}}, within a relationship with an {{c2::expectation of trust}}, causing {{c3::harm or distress}} to an older person."
    src: { page: 210, quote: "occurring within any relationship where there is an expectation of trust which causes harm or distress to an older person." }
    status: unverified
  - id: geri.L12.003
    kind: card
    topic: definition
    front: Give two examples of how culture shapes the definition of elder abuse.
    back: Norway includes "family disharmony"; France includes "moral cruelty". Abuse has cultural, ethnic and religious dimensions.
    src: { page: 210, quote: "in Norway the definitions of elder abuse include \"family disharmony\". In France \"moral cruelty\"" }
    status: unverified
  - id: geri.L12.004
    kind: card
    topic: definition
    front: Why is the WHO definition useful?
    back: It gives common ground to discuss abuse in an international context.
    src: { page: 210, quote: "The World Health Organization's (WHO) definition may provide some common ground to discuss abuse in an international context:" }
    status: unverified
  # ---------- p211: prevalence ----------
  - id: geri.L12.005
    kind: cloze
    topic: prevalence
    text: "Elder abuse is underreported worldwide; prevalence estimates exist only in some developed countries, ranging {{c1::1-10%}}."
    src: { page: 211, quote: "Prevalence rates or estimates exist only in selected developed countries ranging from 1-10%." }
    status: unverified
    tags: [numbers]
  - id: geri.L12.006
    kind: card
    topic: prevalence
    front: Give culture-specific examples of elder abuse risk from traditional societies.
    back: Older widows forced into marriage; isolated older women accused of witchcraft.
    src: { page: 211, quote: "in some traditional societies, older widows are subjected to forced marriages while in others, isolated older women are accused of witchcraft." }
    status: unverified
  - id: geri.L12.007
    kind: card
    topic: prevalence
    front: What must happen for elder abuse to stop being underdiagnosed?
    back: Both primary health care and social service sectors must be equipped to identify and deal with it.
    src: { page: 211, quote: "unless both primary health care and social service sectors are well equipped to identify and deal with the problem" }
    status: unverified
  - id: geri.L12.008
    kind: cloze
    topic: prevalence
    text: "In the USA, {{c1::one in 10}} older adults experiences abuse or neglect by a caregiver each year; APS investigated reports rose {{c2::16.3%}} and substantiated reports {{c3::15.6%}} from 2000 to 2004."
    src: { page: 211, quote: "U.S. estimates indicate that one out of 10 older adults experiences abuse or neglect by a caregiver each year." }
    status: unverified
    tags: [numbers, high-yield]
  # ---------- p211-212: EASI ----------
  - id: geri.L12.009
    kind: card
    topic: easi
    front: What is the EASI and where was it validated?
    back: The Elder Abuse Suspicion Index, validated in primary care; physicians use it to screen cognitively intact patients during routine visits.
    src: { page: 211, quote: "The Elder Abuse Suspicion Index (EASI) was validated in a primary care setting and can be used by physicians to screen cognitively intact patients" }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.010
    kind: cloze
    topic: easi
    text: "EASI: sensitivity {{c1::0.47}}, specificity {{c2::0.75}}."
    src: { page: 212, quote: "It has a sensitivity of 0.47 and a specificity of 0.75." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L12.011
    kind: card
    topic: easi
    front: Structure of the EASI and what counts as positive?
    back: Five patient-answered items plus one physician question; at least one "yes" to questions 2 to 6 means further assessment is needed.
    src: { page: 212, quote: "The EASI includes five patient-answered items, plus one physician question" }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.012
    kind: card
    topic: easi
    front: When is one-step screening for mistreatment used?
    back: "When the physician has known a normally functioning, cognitively intact patient over time: EASI alone."
    src: { page: 212, quote: "When the physician has known a normally functioning, cognitively intact patient over time, one-step screening using the EASI is recommended." }
    status: unverified
  - id: geri.L12.013
    kind: card
    topic: easi
    front: When is two-step screening used, and what is the first step?
    back: When the physician does not know the patient or suspects dementia; first screen cognition with the Mini-Cog.
    src: { page: 212, quote: "When the physician does not know the patient or suspects dementia, the two-step process begins with screening for cognitive impairment with the Mini-Cog." }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.014
    kind: card
    topic: easi
    front: "Mini-Cog: how long does it take, and how does it compare with the MMSE?"
    back: Under five minutes, with sensitivity and specificity comparable to the MMSE.
    src: { page: 212, quote: "It can be administered in less than five minutes and has comparable sensitivity and specificity to the well-known Mini-Mental State Examination." }
    status: unverified
  - id: geri.L12.015
    kind: card
    topic: easi
    front: What do you do after the Mini-Cog result in two-step screening?
    back: Negative for dementia, give the EASI. Positive, clarify the cognitive impairment first (deficits may be domain-limited) before screening for abuse.
    src: { page: 212, quote: "If the Mini-Cog is positive, further assessment should clarify cognitive impairment before screening for abuse." }
    status: unverified
  - id: geri.L12.016
    kind: order
    topic: easi
    prompt: Order the two-step screening for elder mistreatment in a patient you do not know.
    steps:
      - Screen cognition with the Mini-Cog
      - If negative, administer the EASI
      - At least one yes to questions 2-6
      - Further assessment for abuse
    src: { page: 212, quote: "If the Mini-Cog is negative for dementia, the physician may administer the EASI." }
    status: unverified
  # ---------- p213: barriers ----------
  - id: geri.L12.017
    kind: enumerate
    topic: barriers
    prompt: Barriers to obtaining accurate statistics on elder abuse.
    points:
      - A hidden problem, in the home, mostly by family
      - Victims unwilling to report (fears)
      - Victims' cognitive decline and ill health
      - Lack of training of service providers
      - Subjective nature of abuse
      - Debate on including self-neglect
    pass: 5
    src: { page: 213, quote: "Elder abuse is largely a hidden problem and tends to be committed in the privacy of the elderly person's home" }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.018
    kind: enumerate
    topic: barriers
    prompt: Why are elder abuse victims often unwilling to report?
    points: [Fear of disbelief, Fear of loss of independence, Fear of being institutionalized, Fear of losing their only social support, Fear of retaliation]
    pass: 4
    src: { page: 213, quote: "fear of others' disbelief, fear of loss of independence, fear of being institutionalized, fear of losing their only social support" }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.019
    kind: card
    topic: barriers
    front: Why is self-neglect debated as part of elder abuse statistics?
    back: It involves no other person as abuser; opponents call it a different form that should not be counted.
    src: { page: 213, quote: "Many are unsure if it should be included since it does not involve another person as an abuser." }
    status: unverified
  - id: geri.L12.020
    kind: card
    topic: barriers
    front: Who lacks training about elder abuse, so that few cases get reported?
    back: Service providers such as social workers, law enforcement and nurses.
    src: { page: 213, quote: "Lack of proper training of service providers, such as social workers, law enforcement, nurses, etc., about elder abuse" }
    status: unverified
  # ---------- p214: types and abusers ----------
  - id: geri.L12.021
    kind: table
    topic: types
    title: Types of elder abuse
    columns: [Type, Characteristic, Examples]
    rows:
      - [Financial or material, "Illegal or improper use of funds or resources, exploitation", "Theft of cards, coercion, forcible transfer of property or accounts"]
      - [Neglect or abandonment, "Intentional or unintentional failure of the designated caregiver to meet needs", "No adequate food, clothing, shelter, medical care, hygiene, social stimulation"]
      - [Physical, Infliction of pain or injury, "Slapping, hitting, kicking, force-feeding, restraint, striking with objects"]
      - [Psychological or emotional, Infliction of mental anguish, "Verbal aggression, threats of institutionalization, isolation, humiliation"]
      - [Sexual, "Nonconsensual genital contact, unwanted sexual talk", "Suggestive talk, forced activity, touching a nonconsenting person"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 214, quote: "Financial or material Illegal or improper use of funds Theft of debit or credit cards," }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.022
    kind: card
    topic: types
    front: Does neglect need intent?
    back: No. Neglect is the intentional or unintentional refusal or failure of the designated caregiver to meet the older person's needs.
    src: { page: 214, quote: "Neglect or abandonment Intentional or unintentional Failure to provide adequate" }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.023
    kind: card
    topic: types
    front: Name two physical abuse examples from the book that look like "care".
    back: Force-feeding and restraint.
    src: { page: 214, quote: "Slapping, hitting, kicking, force-feeding, restraint, striking with objects" }
    status: unverified
  - id: geri.L12.024
    kind: card
    topic: types
    front: Which threat is a classic form of psychological abuse of the elderly?
    back: Threats of institutionalization (also verbal aggression, social isolation, humiliating statements).
    src: { page: 214, quote: "Verbal aggression or threat, threats of institutionalization, social isolation, humiliating or degrading statements." }
    status: unverified
  - id: geri.L12.025
    kind: card
    topic: types
    front: Who can be an abuser of an older person?
    back: A spouse or partner, children, relatives, friend or neighbour, volunteer or paid worker, practitioner, solicitor, or anyone intending to deprive a vulnerable person of resources.
    src: { page: 214, quote: "An abuser can be a spouse, partner, sons, daughters, relative, a friend or neighbor, a volunteer worker, a paid worker, practitioner, solicitor" }
    status: unverified
  - id: geri.L12.026
    kind: card
    topic: types
    front: Which relatives are of particular concern as abusers?
    back: Children and relatives with a history of substance abuse or other life troubles.
    src: { page: 214, quote: "Children and living relatives who have a history of substance abuse or have had other life troubles are of particular .concern." }
    status: unverified
  # ---------- p215-216: risk factors ----------
  - id: geri.L12.027
    kind: enumerate
    topic: risk
    prompt: Risk factors in the elderly person for becoming a victim of abuse.
    points:
      - Memory problems (dementia)
      - Physical disabilities
      - Depression, loneliness, lack of social support
      - Alcohol or substance abuse
      - Combative with the caregiver
      - Shared living situation
      - "Social isolation: elder and caregiver alone together"
      - Was an abusive parent or spouse
      - History of domestic violence at home
      - Own tendency to verbal or physical aggression
    pass: 7
    src: { page: 215, quote: "Has memory problems (such as dementia). Has physical disabilities. Has depression, loneliness, or lack of social support." }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.028
    kind: enumerate
    topic: risk
    prompt: Risk factors in the caregiver for committing elder abuse.
    points:
      - Overwhelmed or resentful
      - Substance abuse or history of abusing others
      - Dependent on the elder for housing or money
      - Mental health problems
      - Unemployed
      - Criminal history
      - Shared living situation
      - Poor coping with stress
      - Depression
      - No support from other caregivers
      - Sees caregiving as a burden without reward
    pass: 7
    src: { page: 215, quote: "Feels overwhelmed or resentful. Has a history of substance abuse or a history of abusing others." }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.029
    kind: card
    topic: risk
    front: Which risk factor appears on both the elder's and the caregiver's list?
    back: A shared living situation.
    src: { page: 215, quote: "Has a shared living situation." }
    status: unverified
  - id: geri.L12.030
    kind: card
    topic: risk
    front: Which caregiver mental state is common and a risk factor for abuse?
    back: Depression, which is common among caregivers.
    src: { page: 215, quote: "Depression, which is common among caregivers." }
    status: unverified
  - id: geri.L12.031
    kind: card
    topic: risk
    front: Which past role of the elder raises their own risk of being abused?
    back: Having been an abusive parent or spouse earlier in life.
    src: { page: 215, quote: "The elder‘s role, at an earlier time, as an abusive parent or spouse." }
    status: unverified
  - id: geri.L12.032
    kind: card
    topic: risk
    front: Which caregiver dependency is a risk factor?
    back: Dependence on the older person for housing, finances or other needs.
    src: { page: 215, quote: "Is dependent on the older person for housing, finances, or other needs." }
    status: unverified
  - id: geri.L12.033
    kind: card
    topic: risk
    front: Which caregiver perception predicts abuse?
    back: That caring for the elder is burdensome and without psychological reward.
    src: { page: 216, quote: "The caregiver‘s perception that taking care of the elder is burdensome and without psychological reward." }
    status: unverified
  # ---------- p216-218: where and signs ----------
  - id: geri.L12.034
    kind: card
    topic: signs
    front: Where does elder abuse most often take place, and by whom?
    back: In the home where the senior lives, often by adult children, grandchildren or spouses; it also happens in institutions, especially long-term care facilities.
    src: { page: 216, quote: "Most often in the home where abusers are often adult children, other family members such as grandchildren, or spouses/partners of elders." }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.035
    kind: card
    topic: signs
    front: Why are signs of elder abuse easily missed?
    back: They look like dementia or frailty, and caregivers may explain them that way; overlap with mental decline is no reason to dismiss them.
    src: { page: 216, quote: "They may appear to be symptoms of dementia or signs of the elderly person‘s frailty—or caregivers may explain them to you that way." }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.036
    kind: card
    topic: signs
    front: General warning signs of elder abuse? What if you are unsure?
    back: Frequent arguments or tension between caregiver and elder, and changes in the elder's personality or behaviour. If unsure, look for clusters of physical and behavioural signs.
    src: { page: 216, quote: "Frequent arguments or tension between the caregiver and the elderly person. Changes in personality or behavior in the elder." }
    status: unverified
  - id: geri.L12.037
    kind: enumerate
    topic: signs
    prompt: Physical elder abuse warning signs.
    points:
      - "Unexplained bruises, welts, scars, burns (especially symmetrical)"
      - "Broken bones, sprains, dislocations"
      - Drug overdose or missed medication (too many pills left)
      - Broken eyeglasses or frames
      - Signs of restraint (rope marks on wrists)
      - Caregiver refuses to let you see the elder alone
    pass: 5
    src: { page: 216, quote: "Unexplained signs of injury, such as bruises, welts, or scars, burns especially if they appear symmetrically on two sides of the body." }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.038
    kind: card
    topic: signs
    front: Which bruise pattern is especially suspicious of physical abuse?
    back: Injuries appearing symmetrically on both sides of the body.
    src: { page: 216, quote: "burns especially if they appear symmetrically on two sides of the body." }
    status: unverified
  - id: geri.L12.039
    kind: card
    topic: signs
    front: How can a pill count reveal abuse?
    back: A prescription with more remaining than it should suggests the medication is being withheld (or overdose reports).
    src: { page: 216, quote: "Report of drug overdose or apparent failure to take medication regularly (a prescription has more remaining than it should)." }
    status: unverified
  - id: geri.L12.040
    kind: card
    topic: signs
    front: Emotional elder abuse warning signs?
    back: Threatening, belittling or controlling caregiver behaviour you witness; behaviour mimicking dementia such as rocking, sucking or mumbling.
    src: { page: 217, quote: "Behavior from the elder that mimics dementia, such as rocking, sucking, or mumbling to oneself." }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.041
    kind: enumerate
    topic: signs
    prompt: Sexual elder abuse warning signs.
    points: [Bruises around breasts or genitals, Unexplained vaginal or anal bleeding, "Torn, stained or bloody underclothing"]
    pass: 3
    src: { page: 217, quote: "Bruises around breasts or genitals. Unexplained vaginal or anal bleeding. Torn, stained, or bloody underclothing." }
    status: unverified
  - id: geri.L12.042
    kind: enumerate
    topic: signs
    prompt: Warning signs of neglect by caregivers or self-neglect.
    points:
      - "Unusual weight loss, malnutrition, dehydration"
      - Untreated problems such as bed sores
      - "Unsanitary living conditions: dirt, bugs, soiled bedding"
      - Unsuitable clothing for the weather
      - Left dirty or unbathed
      - "Unsafe living conditions: no heat or water, fire hazards"
      - Desertion at a public place
    pass: 5
    src: { page: 217, quote: "Unusual weight loss, malnutrition, dehydration. Untreated physical problems, such as bed sores." }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.043
    kind: enumerate
    topic: signs
    prompt: Financial exploitation warning signs.
    points:
      - Significant withdrawals from accounts
      - Sudden changes in financial condition
      - Items or cash missing from the household
      - "Suspicious changes in wills, power of attorney, titles, policies"
      - Names added to the signature card
      - Unpaid bills or no medical care despite enough money
      - Activity the senior couldn't do (ATM use while bedridden)
      - Unnecessary services or subscriptions
    pass: 5
    src: { page: 217, quote: "Significant withdrawals from the elder's accounts. Sudden changes in the elder's financial condition." }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.044
    kind: card
    topic: signs
    front: A bedridden elder's account shows ATM withdrawals. What does it suggest?
    back: "Financial exploitation: financial activity the senior could not have done."
    src: { page: 218, quote: "Financial activity the senior couldn't have done, such as an ATM withdrawal when the account holder is bedridden" }
    status: unverified
  - id: geri.L12.045
    kind: enumerate
    topic: signs
    prompt: Healthcare fraud and abuse warning signs.
    points:
      - Duplicate billing for the same service or device
      - Over- or under-medication
      - Inadequate care although bills are paid in full
      - "Facility problems: poorly trained, paid or insufficient staff, crowding, poor answers"
    pass: 3
    src: { page: 218, quote: "Duplicate billings for the same medical service or device. Evidence of overmedication or under-medication." }
    status: unverified
  # ---------- p218-219: prevention ----------
  - id: geri.L12.046
    kind: card
    topic: prevention
    front: What is critical to preventing elder abuse?
    back: Educating seniors, professionals, caregivers and the public.
    src: { page: 218, quote: "Educating seniors, professionals, caregivers, and the public on abuse is critical to prevention." }
    status: unverified
  - id: geri.L12.047
    kind: enumerate
    topic: prevention
    prompt: How can an older adult stay safe from abuse?
    points:
      - Take care of your health
      - "Seek help for drug, alcohol and depression problems"
      - Support groups; plan your future (power of attorney, living will)
      - Seek independent advice before signing documents
      - Stay active and connected
      - Post and open your own mail
      - No personal information by phone
      - Direct deposit for all checks
      - Have your own phone
      - Review your will periodically
      - "Know your rights (Long Term Care Ombudsman)"
    pass: 7
    src: { page: 218, quote: "Posting and opening your own mail. Not giving personal information over the phone. Using direct deposit for all checks. Having your own phone." }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.048
    kind: card
    topic: prevention
    front: How does a power of attorney or living will help prevent abuse?
    back: It settles health care decisions now, avoiding confusion and family problems later.
    src: { page: 218, quote: "With a power of attorney or a living will, you can address health care decisions now to avoid confusion and family problems later." }
    status: unverified
  - id: geri.L12.049
    kind: card
    topic: prevention
    front: Why should seniors stay active in the community?
    back: It decreases social isolation, which is connected to elder abuse.
    src: { page: 218, quote: "This will decrease social isolation, which has been connected to elder abuse." }
    status: unverified
  - id: geri.L12.050
    kind: card
    topic: prevention
    front: Who is the nursing home resident's advocate with power to intervene?
    back: The Long Term Care Ombudsman.
    src: { page: 219, quote: "If you live in a nursing home, call your Long Term Care Ombudsman. The ombudsman is your advocate and has the power to intervene." }
    status: unverified
  - id: geri.L12.051
    kind: enumerate
    topic: prevention
    prompt: What can a caregiver do to prevent elder abuse?
    points:
      - Relieve stress and burnout now
      - Ask friends, relatives or respite care for breaks
      - Find an adult day care program
      - Stay healthy and get your own medical care
      - Stress reduction practices
      - Seek help for depression
      - Join a caregiver support group
      - Get help for drug or alcohol problems
    pass: 6
    src: { page: 219, quote: "Take immediate steps to relieve caregiver stress and burnout." }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.052
    kind: enumerate
    topic: prevention
    prompt: The four conclusions for preventing elder abuse.
    points: [Listen to seniors and their caregivers, Intervene when you suspect abuse, Educate others to recognize and report it, Protect seniors and take a stand]
    pass: 4
    src: { page: 219, quote: "Listen to seniors and their caregivers. Intervening when you suspect elder abuse." }
    status: unverified
  # ---------- MCQs ----------
  - id: geri.L12.053
    kind: mcq
    topic: definition
    stem: Which element is part of the WHO definition of elder abuse?
    options: [A relationship with an expectation of trust, Only intentional physical acts, Only acts by strangers, Proven financial loss]
    answer: 0
    why:
      - "Correct: abuse occurs within a relationship where trust is expected."
      - "It includes single or repeated acts and lack of appropriate action."
      - "Abusers are mostly family; trust is the key."
      - "Harm or distress is enough; no proven loss is needed."
    src: { page: 210, quote: "occurring within any relationship where there is an expectation of trust which causes harm or distress to an older person." }
    status: unverified
  - id: geri.L12.054
    kind: mcq
    topic: easi
    stem: Which statement about the Elder Abuse Suspicion Index is correct?
    options: [It is for cognitively intact patients and has specificity 0.75, It is for patients with dementia, It has sensitivity 0.95, It is completed by the caregiver]
    answer: 0
    why:
      - "Correct: validated in primary care for cognitively intact patients; sensitivity 0.47, specificity 0.75."
      - "Suspected dementia needs Mini-Cog first and cognitive clarification."
      - "Sensitivity is only 0.47."
      - "Five items are answered by the patient and one by the physician."
    src: { page: 212, quote: "It has a sensitivity of 0.47 and a specificity of 0.75." }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.055
    kind: mcq
    topic: easi
    stem: A patient answers "yes" only to EASI question 3. What next?
    options: [Further assessment for abuse, Nothing; two yes answers are needed, Repeat the EASI next year, Start with the MMSE]
    answer: 0
    why:
      - "Correct: at least one yes to questions 2-6 needs further assessment."
      - "One yes is enough."
      - "A positive screen needs action now."
      - "Cognition screening comes first only when you don't know the patient or suspect dementia."
    src: { page: 212, quote: "At least one \"yes\" response to questions 2 through 6 indicates a need for further assessment." }
    status: unverified
  - id: geri.L12.056
    kind: mcq
    topic: easi
    stem: You see an 81-year-old for the first time; her daughter answers most questions. How do you screen for mistreatment?
    options: ["Mini-Cog first, then EASI if negative", "EASI directly", "Ask the daughter to complete the EASI", "Skip screening until abuse is obvious"]
    answer: 0
    why:
      - "Correct: unknown patient (or suspected dementia) = two-step process."
      - "One step is only for a cognitively intact patient you have known over time."
      - "The EASI is patient-answered; the possible abuser should not answer it."
      - "Abuse is hidden; screening is how it is found."
    src: { page: 212, quote: "When the physician does not know the patient or suspects dementia, the two-step process begins with screening for cognitive impairment with the Mini-Cog." }
    status: unverified
    tags: [high-yield]
  - id: geri.L12.057
    kind: mcq
    topic: easi
