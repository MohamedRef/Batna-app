      - "ترتّب الكيماوي: gem + platinum، durvalumab، FOLFOX"
      - "تحفظ الـ palliation والـ follow-up وأرقام الـ prognosis"
    status: unverified
    steps:
      - kind: explain
        page: 334
        title: "Unresectable: الأغلبية"
        text: |
          الكتاب صريح: **most cholangiocarcinomas present as unresectable**.

          **Patient factors:** **comorbidity** و **coexistent hepatic cirrhosis**.

          **Tumour factors:**
          - **Tumour extension to secondary biliary radicles**.
          - **Main portal vein** ممسوك (encasement أو occlusion) **قبل الـ bifurcation**.
          - **Atrophy** فص + **contralateral portal vein branch** ممسوك.
          - **Atrophy** فص + **contralateral** امتداد لـ secondary radicles.
          - **Unilateral** امتداد لـ secondary radicles + **contralateral portal vein branch** ممسوك.
          - **Regional lymph nodes** مثبتة histologically.
          - **Lung أو liver أو peritoneal metastasis**.
      - kind: reveal
        page: 335
        prompt: "بص على الـ tumour factors التلاتة اللي في النص: كلهم فيهم كلمة **contralateral**. إيه الفكرة اللي بتجمعهم؟"
        answer: |
          ارجع لتشبيه **الشقة النصين**: علشان تعمل resection لازم يفضل **نص كبد واحد سليم**: قناته سليمة وفيه portal vein شغّال.

          - نص ضامر (**atrophy**) يعني أصلًا هيتشال... والنص التاني الـ portal vein بتاعه ممسوك أو قنواته ممسوكة؟ يبقى **مفيش نص تعيش فيه**.
          - قنوات جنب ممسوكة + وريد الجنب التاني ممسوك: كل جنب فيه مشكلة.
          - والـ **main portal vein** قبل الـ bifurcation؟ ده بيغذّي النصين، فخلاص.

          (ده تفسير للحفظ، والقايمة نفسها من الكتاب.)
      - kind: sort
        page: 335
        prompt: "الورم ده يتشال ولا لأ؟ (حسب معايير الكتاب)"
        bins: ["Still resectable", "Unresectable"]
