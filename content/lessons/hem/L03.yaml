      - kind: table
        page: 41
        quote: "Congenital TTP is very rare (1 in 1 million) and represents 5% of all TTP cases."
        title: "Congenital ولا acquired؟ (ص 41)"
        columns: [Type, Key facts]
        rows:
          - ["Congenital", "1/million, 5%; ADAMTS13 gene (9q34); AR"]
          - ["Acquired", ">99% of adults; anti-ADAMTS13 IgG"]
        hide: [[0, 1], [1, 1]]
      - kind: explain
        page: 42
        title: "الـ pentad مات"
        quote: "these 5 symptoms were present in less than 10% of patients with an acute TTP"
        text: |
          الـ **pentad** القديم (fever، thrombocytopenia، MAHA، neuro، renal) بقى ==obsolete==: موجود في **أقل من 10%** بس.

          العلامات الثابتة تقريبًا:
          1. **Thrombocytopenia شديدة** (غالبًا ==< 30 × 10⁹/L==).
          2. **MAHA** مع **schistocytes**.
          3. **Ischaemia**، أغلبها **المخ** (حوالي **60%**): صداع، confusion، stroke، coma، seizures.
          4. **الكلى**: proteinuria أو haematuria بس؛ الـ **AKI مش شائع** (creatinine < 2 mg/dL).
      - kind: aside
        tone: exam
        page: 43
        quote: "Thrombin time (PT), and the fibrinogen concentration, are characteristically normal."
        text: "الفرق عن الـ **DIC**: في الـ TTP الـ **PT والـ fibrinogen طبيعيين**، لأن المشكلة صفايح و VWF مش coagulation factors. والفرق عن الـ **HUS**: الـ TTP مخ أكتر وكلى أقل؛ الـ HUS كلى أكتر."
      - kind: explain
        page: 43
        title: "التحاليل والعلاج"
        quote: "TPE) should be started as soon as the diagnosis of TTP is established or even suspected."
        text: |
          **التحاليل**: anaemia و thrombocytopenia شديدين، ==schistocytes== (helmet cells)، retics و indirect bilirubin عاليين، haptoglobin **مختفي**، و **LDH عالي جدًا** (haemolysis + ischaemia).

          **العلاج**:
          - ==Plasma exchange (TPE)== هو الأساس، ويبدأ **أول ما تشك**. كل يوم لحد ما الأعضاء تتحسن والصفايح تثبت والـ haemolysis يقف.
          - **Steroids** (high-dose methylprednisolone 10 mg/kg × 3 أيام ثم 2.5 mg/kg).
          - **Rituximab** للـ refractory أو الاستجابة الضعيفة.
          - ==Caplacizumab==: anti-VWF يمنع الـ VWF يمسك الصفايح؛ 11 mg IV قبل الـ TPE ثم 11 mg SC، ويكمل 30 يوم بعد آخر TPE.
      - kind: check
        page: 43
        quote: "TPE with replacement of plasma remains the cornerstone of current management of TTP ."
        question: "TTP is suspected; ADAMTS13 result will take 3 days. What now?"
        options:
          - "Start plasma exchange now"
          - "Wait for ADAMTS13"
          - "Transfuse platelets"
          - "Give eculizumab"
        answer: 0
        why:
          - "صح: الـ TPE يبدأ أول ما تشك. التأخير بيموّت."
          - "الانتظار خطر؛ الـ TTP من غير علاج قاتل."
          - "الصفايح وقود للجلطات (الكتاب قالها في الـ HUS)."
          - "الـ eculizumab للـ atypical HUS والـ PNH."
      - kind: explain
        page: 45
        title: "الـ HUS"
        quote: "The typical variant is caused by Shiga-like toxin (verotoxin) produced by E. coli (O157: H7)"
        text: |
          الـ triad: **thrombocytopenia** + ==acute renal impairment== + **MAHA**، والـ Coombs **سالب** (mechanical).

          من أهم أسباب الـ AKI في **الأطفال**. الحدث الأول ==endothelial damage==.

          **Typical**: **Shiga-like toxin** من **E. coli O157:H7** (لحمة مش مستوية، لبن مش مبستر) أو Shigella.

          أدوية: mitomycin C، cyclosporine، cisplatin، cocaine، quinine.
      - kind: table
        page: 46
        quote: "Stx-HUS is largely a disease of children younger than 2-3 years and often results in diarrhea (denoted D+HUS)."
        title: "Typical ولا atypical HUS؟"
        columns: [Feature, Typical, Atypical]
        rows:
          - ["Who", "Kids < 2–3 y", "Adults"]
          - ["Diarrhoea", "D+ mostly", "D-"]
          - ["Outcome", "70–85% recover", "50% ESRD"]
          - ["Cause", "Shiga toxin", "Complement"]
        hide: [[1, 2], [2, 1], [2, 2], [3, 2]]
      - kind: explain
        page: 48
        title: "العلاج: إيه اللي تعمله وإيه الممنوع"
        quote: "Not recommended to use antibiotics(has no role) and antiperistaltic"
        text: |
          - **Supportive**: سوايل (غالبًا dehydrated) مع مراقبة الكلى؛ بعضهم يحتاج **dialysis**.
          - ==ممنوع antibiotics و antimotility==: الأولى ملهاش دور، والتانية بتخلي الـ toxin يفضل.
          - نقل **packed RBCs** لو Hb ==7–8 g/dL== أو Ht < 18%.
          - **الصفايح**: غالبًا لأ (بتزوّد الجلطات)، إلا لو فيه نزيف أو procedure.
          - **Atypical HUS**: ==eculizumab== أو **ravulizumab** (anti-**C5**)، و plasmapheresis للـ familial.
      - kind: case
        page: 47
        quote: "The Coombs test is negative, consistent with mechanical hemolysis."
