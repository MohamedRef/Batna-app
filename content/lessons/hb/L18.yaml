lecture: hb.L18
lessons:
  # ------------------------------------------------------------------
  - id: hb.L18.lesson1
    title: "HCC: الكبد المتليّف بيولّد cancer إزاي؟"
    hook: "سرطان رقم 2 في الوفيات في العالم، وأغلبه بيطلع من كبد متليّف أصلًا. تعالى نشوف الرحلة من الالتهاب للـ nodule للـ HCC."
    minutes: 8
    pages: [340, 343]
    topics: [epidemiology, pathogenesis]
    goals:
      - "تعرّف الـ HCC وتعرف مين بيجيله من غير cirrhosis"
      - "تحفظ أرقام الـ epidemiology اللي بتتسأل"
      - "تشرح ليه HBV بيعمل HCC من غير تليف و HCV لأ"
      - "ترتّب الطريق: injury → cirrhosis → dysplastic nodule → HCC"
    status: unverified
    steps:
      - kind: explain
        page: 340
        title: "التعريف"
        quote: "a primary cancer arising from hepatocytes in predominantly cirrhotic liver"
        text: |
          الـ **HCC** (واسمها التاني **hepatoma**) هي **primary cancer** طالعة من الـ **hepatocytes**، وغالبًا في كبد **cirrhotic**.

          بس خلي بالك: فيه ناس بيجيلهم HCC **من غير cirrhosis**، وخصوصًا اتنين: **chronic HBV** و **MASLD**.
      - kind: explain
        page: 340
        title: "الأرقام"
        text: |
          - في العالم: **sixth** most common cancer، و **second** leading cause of cancer death.
          - الـ incidence ماشية مع انتشار **HBV و HCV**. و **44%** من الحالات في العالم سببها **chronic HBV**، وأغلبها في **Asia**.
          - الـ HCC هي أشهر نوع liver cancer: **75% إلى 86%**.
          - في الـ US: الـ liver cancer زادت **أكتر من 3 أضعاف** في 40 سنة. ثبتت في الرجالة من **2015**، بس لسه بتزيد في الستات **2% كل سنة**. والسن بقى أصغر (زيادة في **45–60**).
          - **Mean age at diagnosis:** **60** في US و Europe، **50–60** في Asia، و **46** في **Africa**.
          - أكتر في الرجالة، يمكن بسبب risk factors خاصة بكل جنس والـ **trophic effects of androgens**.
      - kind: aside
        tone: tip
        page: 341
        text: |
          ركّز في رقم **Africa = 46 سنة**: أصغر سن في الكتاب. والسبب المنطقي إن العدوى بالـ HBV بتحصل **بدري في الطفولة** هناك، فالالتهاب بيبدأ بدري وبيكمّل لعشرات السنين (ده هتشوفه بعد شوية في الـ pathophysiology).
      - kind: explain
        page: 341
        title: "الأسباب"
        text: |
          الـ etiology **multifactorial**، و **cirrhosis** هي الـ **major predisposing risk factor**.

          - أهم أسباب الـ HCC في العالم (لأنهم أهم أسباب الـ cirrhosis): **HBV، HCV، MASLD، alcohol**.
          - **MASLD** هي **fastest growing cause** في US و UK و France.
          - فيه **synergy** قوية بين **heavy alcohol** و **viral hepatitis** و **diabetes**.
          - في اللي مفيش عندهم viral ولا alcohol: **insulin resistance** → **MASH** (اسمها القديم NASH) مع diabetes و obesity و metabolic syndrome.
          - **Family history** في first-degree relative: risk factor مهم، بس العلاقة لسه مش مفهومة.
          - و **ربع** المرضى تقريبًا **مالهمش أي risk factor معروف**.
      - kind: reveal
        page: 342
        prompt: "الكتاب بيقول إن HCV-related HCC **almost always** بييجي بعد cirrhosis، بس HBV ممكن يعمله من غير cirrhosis. ليه الفرق ده؟"
        answer: |
          لأن الـ **HBV نفسه direct carcinogen**: الكتاب بيقول إنه ممكن يعمل **methylation of the P16 gene**، وكمان **mutation of the X gene** بتاع الفيروس ليها دور. يعني بيلعب في الـ DNA مباشرة (هو DNA virus بيندمج في الـ genome).

          أما الـ HCV فالطريق غير مباشر: **high estrogen** و **lipid peroxidation**، ومحتاج سنين التهاب وتليف. وكمان العدوى بالـ HBV **بدري في العمر** معناها مدة مرض أطول والتهاب و cirrhosis.
      - kind: explain
        page: 342
        title: "الـ DNA بيتضرب إزاي؟"
        text: |
          - **Chronic HBV و HCV مع metabolic disorders** → **oxidative stress** → **reactive oxygen species** → ضرر في الـ DNA و mutation في genes زي **p53**.
          - **Aflatoxin**: **mycotoxin** من الـ **Aspergillus**، بيلوّث **soya beans** (وفي صفحة 345 كمان corn و peanuts). التعرض الطويل بيعمل mutation في **p53 tumour-suppressor gene**.
      - kind: figure
        page: 343
        title: "الرحلة لحد الـ HCC"
        alt: "A vertical pathway. Top: chronic injury from HBV, HCV, MASLD or alcohol. Arrow to chronic inflammation and cirrhosis, present in more than 80 percent of HCC. Arrow to low-grade dysplastic nodule, then high-grade dysplastic nodule, a precancerous lesion. Arrow to HCC labelled: about one third of high-grade nodules within 2 years, and more than 80 percent of dysplastic nodules within 5 years. A side box: HBV is a direct carcinogen (P16 methylation, X gene) and can cause HCC without cirrhosis; aflatoxin and reactive oxygen species mutate p53."
        caption: "الطريق المعتاد بيعدّي على **cirrhosis** و **dysplastic nodules**. الـ **high-grade** هي المحطة اللي قبل الـ HCC على طول."
        svg: |
          <svg viewBox="0 0 330 520" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L18a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="L18b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="20" y="10" width="290" height="50" rx="8" class="fg-box"/>
            <text x="165" y="31" text-anchor="middle" class="t-b">Chronic injury</text>
            <text x="165" y="49" text-anchor="middle" class="t-sm t-mut">HBV, HCV, MASLD, alcohol</text>
            <path d="M165 60V84" class="fg-arrow" marker-end="url(#L18a)"/>
            <rect x="20" y="90" width="290" height="50" rx="8" class="fg-acc"/>
            <text x="165" y="111" text-anchor="middle" class="t-b">Chronic inflammation, cirrhosis</text>
            <text x="165" y="129" text-anchor="middle" class="t-sm">&gt;80% of HCC patients are cirrhotic</text>
            <path d="M165 140V164" class="fg-arrow" marker-end="url(#L18a)"/>
            <circle cx="70" cy="196" r="20" class="fg-acc"/>
            <text x="102" y="192" class="t-b">Low-grade dysplastic</text>
            <text x="102" y="208" class="t-sm t-mut">nodule</text>
            <path d="M165 222V246" class="fg-arrow" marker-end="url(#L18a)"/>
            <circle cx="70" cy="278" r="22" class="fg-bad"/>
            <text x="102" y="274" class="t-b t-bad">High-grade dysplastic</text>
            <text x="102" y="290" class="t-sm">nodule: precancerous</text>
            <path d="M165 306V354" class="fg-arrow-bad" stroke-width="2.5" marker-end="url(#L18b)"/>
            <text x="176" y="326" class="t-sm t-bad">High-grade: ~1/3 in 2 y</text>
            <text x="176" y="344" class="t-sm t-bad">Dysplastic: &gt;80% in 5 y</text>
            <circle cx="165" cy="384" r="26" class="fg-bad"/>
            <text x="165" y="389" text-anchor="middle" class="t-b t-bad">HCC</text>
            <rect x="12" y="426" width="306" height="86" rx="8" class="fg-thin"/>
            <text x="22" y="446" class="t-sm t-b">Shortcuts to DNA damage</text>
            <text x="22" y="464" class="t-sm">HBV: direct carcinogen (P16 methylation, X gene),</text>
            <text x="22" y="480" class="t-sm">can cause HCC without cirrhosis</text>
            <text x="22" y="498" class="t-sm">Aflatoxin, oxidative stress (ROS): p53 mutation</text>
          </svg>
      - kind: check
        page: 343
        question: "According to the book, what fraction of high-grade dysplastic nodules become HCC within 2 years?"
        options:
          - "Almost one third"
          - "About 5%"
          - "More than 80%"
          - "About half"
        answer: 0
        why:
          - "صح: **almost one third** في سنتين."
          - "قليل جدًا، الـ high-grade **precancerous** وبتتحول بنسبة عالية."
          - "الـ **>80%** ده رقم الـ **dysplastic nodules** عمومًا في **5 سنين**، مش الـ high-grade في سنتين. فخ كلاسيكي."
          - "مش في الكتاب. الرقمين: ثلث الـ high-grade في سنتين، وأكتر من 80% من الـ dysplastic nodules في 5 سنين."
      - kind: match
        page: 342
        prompt: "وصّل كل سبب بآلية الـ carcinogenesis بتاعته في الكتاب:"
        pairs:
          - ["HBV", "P16 methylation and X gene mutation"]
          - ["HCV", "High estrogen and lipid peroxidation"]
          - ["Aflatoxin", "p53 mutation from an Aspergillus mycotoxin"]
          - ["Viral hepatitis with metabolic disorders", "Reactive oxygen species from oxidative stress"]
        why: "HBV بيلعب في الـ DNA مباشرة (P16، X gene). HCV: estrogen و lipid peroxidation. Aflatoxin: p53. والـ ROS كمان بتضرب p53 وغيره."
      - kind: aside
        tone: joke
        page: 342
        text: |
          الـ aflatoxin بيحب **الفول السوداني والذرة وفول الصويا** المخزّنين في رطوبة.

          يعني كيس السوداني اللي نسيته في الدرج من السنة اللي فاتت... سيبه مكانه وماتاكلوش. 🥜
      - kind: try
        items: [hb.L18.002, hb.L18.004, hb.L18.010, hb.L18.015, hb.L18.020]
    recap:
      - "HCC = primary cancer من الـ hepatocytes، غالبًا في كبد cirrhotic. من غير cirrhosis: **HBV و MASLD**."
      - "Sixth commonest، second cancer death. 44% سببها HBV. 75–86% من الـ liver cancers. سن التشخيص: 60 / 50–60 / **46 في Africa**."
      - "الأسباب الكبار: HBV، HCV، MASLD، alcohol. MASLD الأسرع نموًا. ربع المرضى مفيش risk factor."
      - "HBV direct carcinogen (P16، X gene). HCV تقريبًا لازم cirrhosis الأول. Aflatoxin → p53."
      - "High-grade dysplastic nodules: **ثلث في سنتين**. والـ dysplastic nodules عمومًا: **>80% في 5 سنين**."
    practice: [hb.L18.001, hb.L18.002, hb.L18.003, hb.L18.004, hb.L18.005, hb.L18.006, hb.L18.007, hb.L18.008, hb.L18.009, hb.L18.010, hb.L18.011, hb.L18.012, hb.L18.013, hb.L18.014, hb.L18.015, hb.L18.016, hb.L18.017, hb.L18.018, hb.L18.019, hb.L18.020, hb.L18.200]

  # ------------------------------------------------------------------
  - id: hb.L18.lesson2
    title: "الـ risk factors: الـ ABCD والـ 11 الضعاف"
    hook: "سبعة أقويا وحداشر ضعاف. هتحفظهم في دقايق لو جمّعتهم صح."
    minutes: 9
    pages: [343, 347]
    topics: [risk-factors]
    goals:
      - "تعدّ الـ 7 strong risk factors بمنيمونيك"
      - "تعرف إيه اللي بيعلّي الخطر في HBV و HCV بالأرقام"
      - "تجمّع الـ 11 weak risk factor في 5 عيلات وتعرف آلية كل واحد"
    status: unverified
    steps:
      - kind: mnemonic
        page: 343
        word: "ABCD OF C"
        parts:
          - { key: "A", text: "Alcohol: chronic heavy use" }
          - { key: "B", text: "Hepatitis B (chronic HBV)" }
          - { key: "C", text: "Hepatitis C (chronic HCV)" }
          - { key: "D", text: "Diabetes" }
          - { key: "O", text: "Obesity" }
          - { key: "F", text: "Family history of liver cancer" }
          - { key: "C", text: "Cirrhosis: the major one, in >80% of HCC" }
        hook: |
          **«الـ ABCD بتاع الـ Cancer»**: أول أربع حروف أبجدية زي ما انت عارفها، وبعدين **OF C**.

          والـ C الأخيرة دي هي الملك: **Cirrhosis**، موجودة في **أكتر من 80%** من مرضى الـ HCC.
      - kind: explain
        page: 343
        title: "HBV: إيه اللي بيعلّي الخطر؟"
        text: |
          من أكتر الأسباب انتشارًا في العالم، **إلا** في الأماكن اللي فيها **virus elimination programs**.

          - العدوى **في سن صغير** و الـ **carrier stage** بيعلّوا الخطر.
          - والخطر بيزيد مع: **HBeAg**، **high HBV DNA**، **pre-core/basal core promoter mutation**، **older age**، **cirrhosis**، **elevated aminotransferases**، **high alcohol**، و **co-infection with HCV**.
      - kind: reveal
        page: 344
        prompt: "بص على قايمة الـ HBV دي: HBeAg، high DNA، ALT عالي... إيه الفكرة اللي بتجمعهم؟"
        answer: |
          كلهم علامات إن **الفيروس شغّال ومتكاثر** وإن فيه **التهاب نشط** في الكبد. فيروس أكتر + التهاب أكتر + مدة أطول = فرص أكتر لضرر الـ DNA وللـ cirrhosis. وفوق ده أي **second hit** (alcohol، HCV) بيزوّد.

          (ده تجميع للحفظ؛ القايمة نفسها من الكتاب.)
      - kind: explain
        page: 344
        title: "HCV، alcohol، diabetes، obesity"
        text: |
          - **HCV:** على عكس HBV، **تقريبًا دايمًا cirrhosis الأول**. **2–20%** من مرضى chronic HCV بيعملوا cirrhosis على مدى **20–25 سنة**. الخطر بيزيد مع **co-infection (HBV أو HIV)**، **مدة العدوى**، و **high alcohol**. وطول مدة الفيروس مرتبط بخطر الـ HCC.
          - **Alcohol:** **independent** risk factor. أكتر من **80 g/day** لمدة أكتر من **10 سنين** ممكن يعلّي الخطر **5 أضعاف**.
          - **Diabetes** و **Obesity:** الاتنين major causes لـ **insulin resistance**، وممكن **يضاعفوا** الخطر. والـ **type 2 diabetes** independent risk factor.
          - **Family history:** علاقة قوية مع first-degree relative، بس طبيعتها لسه مش مفهومة.
      - kind: check
        page: 344
        question: "Which statement about HCV and HCC matches the book?"
        options:
          - "Patients with HCV almost always develop cirrhosis before HCC"
          - "HCV is a direct carcinogen that methylates P16"
          - "Over 50% of chronic HCV patients develop cirrhosis within 5 years"
          - "Alcohol has no effect on HCC risk in HCV"
        answer: 0
        why:
          - "صح: **unlike HBV**، الـ HCV تقريبًا دايمًا cirrhosis قبل HCC."
          - "ده الـ **HBV**، مش HCV."
          - "الكتاب: **2–20%** على **20–25 سنة**."
          - "بالعكس، **high alcohol** بيزوّد خطر الـ cirrhosis والـ HCC في HCV."
      - kind: explain
        page: 345
        title: "الـ 11 الضعاف: جمّعهم في 5 عيلات"
        text: |
          - **Toxins (3):** **aflatoxin** (corn، soya beans، peanuts؛ p53)، **thorotrast** (thorium dioxide contrast من **1920s لـ 1950s**، half-life طويل، بيروح **liver و spleen و bone marrow**، HCC بعد **15–25 سنة**؛ ومابقاش مستخدم)، و **cigarette smoking**.
          - **Hormones (3):** **androgenic steroids**، **oral contraceptives**، و **male sex**. الـ hepatocytes عليها **androgen و estrogen receptors**، والاتنين بيحفّزوا الـ proliferation.
          - **Iron و porphyrins (2):** **haemochromatosis** و **porphyria cutanea tarda**.
          - **Biliary (2):** **PBC** و **PSC**.
          - **Genetic lung-liver (1):** **alpha-1-antitrypsin deficiency**.
      - kind: explain
        page: 346
        title: "تفاصيل بتتسأل"
        text: |
          - **Haemochromatosis:** الـ **iron overload مع HCV** بيعلّي الخطر. والـ **first-degree relatives** لمرضى الـ HH عندهم فرصة يورثوه فخطرهم أعلى.
          - **Smoking:** بيضر الـ hepatocytes direct و indirect و oncogenic و immunological، بيعمل necro-inflammation و fibrosis، وكمان **iron overload** عن طريق **secondary polycythemia**.
          - **A1AT deficiency:** mutation في **SERPINA1** → الـ **neutrophil elastase** بيدمّر خلايا الرئة والكبد → **cirrhosis و emphysema**.
          - **PCT:** blistering skin disease من نقص **hepatic uroporphyrinogen decarboxylase**. الخطر غالبًا من الحاجات اللي معاه: **HCV، alcohol، iron overload**.
          - **PBC:** HCC complication لـ PBC الطويل. الـ predictors: **older age، male sex، portal hypertension**.
          - **PSC:** خطر في الـ **late-stage cirrhosis**. الـ lifetime incidence **0.3% إلى 2.8%**.
          - **Male sex:** غالبًا بسبب **androgens** أعلى.
      - kind: reveal
        page: 346
        prompt: "إزاي السجاير توصّل حديد زيادة للكبد؟"
        answer: |
          الكتاب بيقول عن طريق **secondary polycythemia**. والمنطق: الـ **carbon monoxide** من التدخين بيمسك الـ hemoglobin، فالجسم يحس بـ hypoxia ويعلّي الـ **erythropoietin** و الـ RBCs. كرات دم أكتر يعني turnover حديد أكتر، والكبد هو اللي بيشيل الزيادة.
      - kind: sort
        page: 345
        prompt: "Strong ولا weak في HCC؟"
        bins: ["Strong", "Weak"]
        cards:
          - { text: "Obesity", bin: 0 }
          - { text: "Aflatoxin", bin: 1 }
          - { text: "Family history of liver cancer", bin: 0 }
          - { text: "Haemochromatosis", bin: 1 }
          - { text: "Diabetes", bin: 0 }
          - { text: "Male sex", bin: 1 }
          - { text: "PBC", bin: 1 }
          - { text: "Chronic heavy alcohol", bin: 0 }
          - { text: "Cigarette smoking", bin: 1 }
        why: "الـ strong في الكتاب 7 بس: **ABCD OF C**. أي حاجة تانية (aflatoxin، haemochromatosis، male sex، PBC، smoking...) **weak** في الكتاب ده."
      - kind: aside
        tone: trap
        page: 345
        text: |
          فخ: كتب تانية بتحط **aflatoxin** و **haemochromatosis** في الأقويا. **كتابنا** حاططهم في الـ **weak**، والإجابة في الامتحان هي إجابة الكتاب.

          وكمان افتكر إن الـ **diabetes** هنا **strong** (في الـ cholangiocarcinoma كانت **weak**!).
      - kind: try
        items: [hb.L18.021, hb.L18.024, hb.L18.028, hb.L18.030, hb.L18.036]
    recap:
      - "Strong: **ABCD OF C** = Alcohol، HBV، HCV، Diabetes، Obesity، Family history، **Cirrhosis** (>80%)."
      - "HBV: early infection، carrier، HBeAg، high DNA، precore/BCP mutation، age، cirrhosis، ALT، alcohol، HCV."
      - "HCV: cirrhosis الأول. 2–20% على 20–25 سنة. Alcohol >80 g/day × >10 سنين = **×5**. Diabetes/obesity = **×2**."
      - "Weak (11) في 5 عيلات: toxins، hormones، iron/porphyrin، biliary، A1AT."
      - "Thorotrast: 1920s–1950s، liver/spleen/marrow، latency 15–25 سنة. PSC lifetime 0.3–2.8%."
    practice: [hb.L18.021, hb.L18.022, hb.L18.023, hb.L18.024, hb.L18.025, hb.L18.026, hb.L18.027, hb.L18.028, hb.L18.029, hb.L18.030, hb.L18.031, hb.L18.032, hb.L18.033, hb.L18.034, hb.L18.035, hb.L18.036, hb.L18.037, hb.L18.038, hb.L18.039, hb.L18.040, hb.L18.041, hb.L18.042, hb.L18.199, hb.L18.195]

