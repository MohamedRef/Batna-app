        page: 317
        quote: "How to diagnose live hemangioma by contrast enhanced CT?"
        prompt: "رتّب شكل الـ hemangioma على الـ contrast CT من أول الصبغة لآخرها:"
        steps:
          - "Peripheral, nodular, discontinuous enhancement"
          - "Progressive centripetal fill-in"
          - "Whole lesion like the blood pool, no washout"
        why: "Arterial ثم portal venous ثم delayed: من البرّه للجوّه، والصبغة بتفضل. الـ **washout** ده بتاع الـ HCC، مش الـ hemangioma."
      - kind: explain
        page: 316
        quote: "Blood filled cavities BUT walls do not have well developed structure as in hemangioma History of anabolic steroids is usually positive"
        title: "الاتنين الغريبين"
        text: |
          آخر اتنين في العيلة الـ mesenchymal:

          **Peliosis hepatis**: **blood filled cavities** زي الـ hemangioma بالظبط. الفرق في حاجتين:
          - الجدار: الـ walls مش well developed زي الـ hemangioma. يعني برك دم من غير حيطة كويسة.
          - السبب: history of ==anabolic steroids== غالبًا positive. (نفس الـ steroids اللي في الـ adenoma؛ لو شفت لاعيب جيم بكتلة في الكبد، فكّر في الاتنين.)

          **Angiomyolipoma**: اسمه = مكوّناته.
          - مين: rare، في الستات أكتر من الرجالة (5:1)، mean age في العقد الخامس، غالبًا solitary.
          - ==Mixed histology==: lipomatous، myomatous، angiomatous، trabecular. يعني دهون وعضل وأوعية وخلايا مترتبة في trabeculae.
      - kind: mnemonic
        page: 316
        quote: "Lesions have mixed histological pattern: lipomatous, myomatous, angiomatous and trabecular."
        word: "MALT"
        parts:
          - { key: "M", text: "Myomatous" }
          - { key: "A", text: "Angiomatous" }
          - { key: "L", text: "Lipomatous" }
          - { key: "T", text: "Trabecular" }
        hook: |
          الـ **angiomyolipoma** بيحب مشروب الشعير **MALT** اللي في تلاجة كل كشك. اسمه أصلًا فيه **angio + myo + lipo**، وزوّد عليهم **trabecular**.
