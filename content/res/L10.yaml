    title: "Interviewing vs written questionnaires: advantages and disadvantages"
    columns: [Technique, Advantages, Disadvantages]
    rows:
      - [Interviewing, "Suitable for illiterates; permits clarification of questions; higher response rate than written questionnaires", "The interviewer's presence can influence responses; information on events may be less complete than by observation"]
