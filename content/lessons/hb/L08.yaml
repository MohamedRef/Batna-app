    goals:
      - "تعرّف الـ drug cholestasis وتعرف الـ markers بتاعته"
      - "تفرّق الـ 5 أنواع بالـ ALP والـ transaminases والأمثلة"
      - "تعدّ أدوية الـ vanishing bile duct syndrome"
      - "تفرّق الـ DICC عن الـ PBC"
    status: unverified
    steps:
      - kind: explain
        page: 134
        quote: "Cholestatic Injury\nDefinition: Reduction in bile flow due to:\n  Reduced secretion.\n  Obstruction.\nBiochemically: Elevated Cholestatic Markers:\n  Elevated Alk phosphatase.\n  Elevated GGT.\n  Elevated 5 NT.\nAcute illness that subsides when the offending drug is withdrawn."
        title: "يعني إيه cholestatic injury؟"
        text: |
          - **Definition**: reduction in bile flow، يا بسبب reduced secretion من الخلية، يا بسبب obstruction في القنوات.
          - **Biochemically**: elevated ==alkaline phosphatase (ALP)==، ==gamma-glutamyl transferase (GGT)==، و ==5' N-terminal (NT)==.
          - **Clinical**: jaundice و pruritus.
          - **Course**: الـ acute illness بيروح لما الدوا يقف.

          الصفرا جاية من إن الـ bilirubin مش لاقي طريق يطلع، والهرش من تراكم مكوّنات الصفرا (التفسير المقبول).
      - kind: reveal
        page: 134
        quote: "Cholestatic Injury\nDefinition: Reduction in bile flow due to:\n  Reduced secretion.\n  Obstruction.\nBiochemically: Elevated Cholestatic Markers:\n  Elevated Alk phosphatase.\n  Elevated GGT.\n  Elevated 5 NT.\nAcute illness that subsides when the offending drug is withdrawn."
        prompt: "ليه مش كفاية ALP لوحده، ولازم GGT أو 5' NT معاه؟"
        answer: |
          الـ **ALP** مش **liver-specific**: بييجي كمان من **bone، salivary glands، intestine** (ده مكتوب في جدول الـ biomarkers صفحة 140).

          فلما **GGT** أو **5' NT** يطلعوا معاه، بيأكدوا إن المصدر هو الكبد والقنوات.
      - kind: table
        page: 135
        quote: "Types of cholestasis resulting from drugs\n| | Canaliculer (Bland Jaundice) | Hepato-canaliculer (Cholestatic Jaundice) | Ductuler (Cholangioler) | Cholangio-destructive (Vanishing bile duct syndrome) | Cholagio-sclerotic (Sclerosing cholangitis) |\n|---|---|---|---|---|---|\n| Bile casts | + | + | +++ | + | + |\n| Portal inflammation | - | + | + | + | + |\n| Hepatocelluler necrosis | - | + | +/- | + | + |\n| Ductal lesion | - | +/- | + | +++ | +++ |\n| Cholangitis | - | +/- | + | + | + |\n| Bilirubin | +++ | +++ | +++ | + to +++ | + to +++ |\n| Alk Phos | <3X | >3X | >3X | >3X | >3X |\n| Cholesterol | +/- | ++ | +/- | +++ | +++ |\n| AST/ALT | <5X | 2-10X | <5X | <5X | <5X |\n| Examples | Contraceptive; Anabolic steroides | Chlorpromazine; Augmentin; Erythromycin | Benoxaprofen | Paraquat; Clorpromazine | Fluxuridine; Scoliocides |"
        title: "أنواع الـ drug cholestasis"
        columns: ["Type", "ALP", "AST/ALT", "Example"]
        rows:
          - ["Canalicular (bland)", "< 3×", "< 5×", "Contraceptives, anabolic steroids"]
          - ["Hepatocanalicular", "> 3×", "2–10×", "Chlorpromazine, Augmentin, erythromycin"]
          - ["Ductular (cholangiolar)", "> 3×", "< 5×", "Benoxaprofen"]
          - ["Cholangiodestructive (vanishing ducts)", "> 3×", "< 5×", "Paraquat, chlorpromazine"]
          - ["Cholangiosclerotic", "> 3×", "< 5×", "Floxuridine, scolicides"]
