          <text x="165" y="317" text-anchor="middle" class="t-sm">ribs pushed apart</text>
          <rect x="12" y="330" width="306" height="38" rx="7" class="fg-box"/>
          <text x="165" y="346" text-anchor="middle" class="t-b">Divarication of the recti</text>
          <text x="165" y="361" text-anchor="middle" class="t-sm">muscles pulled apart</text>
          <rect x="12" y="374" width="306" height="38" rx="7" class="fg-box"/>
