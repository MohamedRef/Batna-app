          الـ GBM هنا ==خط غامق رفيع جدًا== بس منتظم وناعم، والـ foot processes عليه من برّه عادي.

          قارن بالصورتين اللي فاتوا: الطبيعي منتظم وتخين كفاية، والـ Alport سميك ومنسوج، والـ **thin basement membrane nephropathy (TBMN)** (الكتاب كاتبها **TBM**) ==رفيع ومنتظم== (أقل من 250 nm في الكبار).
      - kind: explain
        page: 185
        title: "العلاج والزرع"
        quote: "Transplantation and Alport syndrome In <5%, transplanted Alport patients may develop de novo anti-GBM anti-bodies that cause an RPGN; i.e. donor a5 type IV collagen is recognized as non-self. It is not a contraindication to transplantation."
        text: |
          **Alport**: مفيش علاج خاص. **blood pressure (BP) control و ACE inhibitor (ACEI)/angiotensin II receptor blocker (ARB)** وتقليل الـ proteinuria بدري (وكمان الـ carriers)، **screening للعيلة**، و genetic counselling.

          **الزرع**: في ==أقل من 5%== الجسم يعتبر الـ **α5 بتاع المتبرع غريب** ويعمل **anti-GBM** فيحصل **rapidly progressive glomerulonephritis (RPGN)**. بس ده **مش contraindication** للزرع.

          **TBMN**: طمّنه بس ما تسيبوش: خطر الـ chronic kidney disease (CKD) **أقل من 5%** بس موجود. Urinalysis وضغط ووظائف كلى كل **1–2 سنة**.

          ليه الـ anti-GBM بعد الزرع؟ التفسير المقبول (مش في الكتاب): المريض اتولد من غير α5 خالص، فجهازه المناعي عمره ما شافه ومش متعود عليه. لما تيجي كلية فيها α5 سليم، الجسم يعتبره غريب ويعمل antibodies ضده. وليه الـ ACEI؟ لأن الـ proteinuria نفسها بتأذي الـ tubules، فتقليلها بيبطّأ التدهور. وليه نتابع الـ TBMN؟ لأن الخطر قليل بس مش صفر.
      - kind: reveal
