        title: "Case 9"
        quote: "2 months later, the patient presented to us with a sCr of 12 mg/dL and proteinuria 15.7 g/day."
        text: |
          ست **57 سنة** عندها hypertension (HTN). الـ creatinine **3.5** بالصدفة، وبعد شهرين ==12 mg/dL== مع **proteinuria 15.7 g/day**. الكلى طبيعية على الـ U/S، والـ immune markers سلبية.

          جلسة haemodialysis (HD) واحدة، والـ biopsy اتأخر، فـ **pulse steroids** 5 أيام، والـ creatinine نزل لـ 5.5.

          ليه القصة دي مقلقة؟ التفسير المقبول (مش في الكتاب): creatinine من **3.5 لـ 12 في شهرين** = RPGN شكلًا، والكلى طبيعية في الحجم يعني مش مرض مزمن قديم. والـ **proteinuria 15.7** كبيرة جدًا، بس الـ immune markers سلبية.
          فيه احتمالين: GN سريع (يحتاج steroids بسرعة)، أو حاجة **مش glomerular** بتسد الـ tubules. والست **57 سنة**، والسن ده بيخلي الـ myeloma على البال. ونزول الـ creatinine لـ 5.5 بعد الـ steroids ممكن يضللك: الـ steroids بتأثر برضه على الـ plasma cells، فالتحسن مش دليل إنه GN.

          إيه الـ DD قبل الـ biopsy؟ التفسير المقبول (مش في الكتاب): creatinine بيجري بسرعة مع كلى حجمها طبيعي = AKI مش CKD. فكّر في: RPGN (ANCA، anti-GBM، lupus)، و AIN من دوا، و TMA، و **cast nephropathy**. الـ immune markers السلبية شالت أغلب الـ RPGN، والـ proteinuria الكبيرة مع markers سلبية رجّحت حاجة بتتسرب من الدم زي الـ light chains، والـ biopsy أكّد.
      - kind: explain
        page: 265
        title: "الـ biopsy: مفيش deposits، والمشكلة في الـ tubules"
        quote: "Following pulse steroids, the patient was maintained empirically on solupred and MMF."
        text: |
          بعد الـ **pulse steroids**، العيانة كمّلت empirically على **solupred و MMF**. وبعدين الـ biopsy:
          - **IH**: IgA و IgG و IgM و C3 كلهم negative، و **Congo red** سلبي.
          - **LM**: 26 glomeruli، 6 obsolescent؛ الـ patent فيها **ischemic changes** و 3 فيهم segmental sclerosis. الـ **tubules**: moderate injury مع ==hyaline casts، some fractured، lamellated، and surrounded by a cellular reaction==. الـ interstitium: fibrosis 35%. الـ arteries: moderate intimal sclerosis.

          ليه الـ steroids قبل الـ biopsy؟ التفسير المقبول (مش في الكتاب): creatinine بيجري من 3.5 لـ 12 في شهرين ده شكل **RPGN** لحد ما يثبت العكس، والـ biopsy اتأخر، فالخوف من crescents خلّاهم يبدأوا. بس الـ biopsy طلع **من غير** deposits ولا crescents: الـ glomeruli مش هي السبب. الـ casts هي اللي بتتكلم.

          ليه الـ FSGS والـ ischemic changes في نفس التقرير؟ التفسير المقبول (مش في الكتاب): الست عندها HTN، فالأوعية متخنة (moderate intimal sclerosis) والـ glomeruli بتاخد دم أقل فتنكمش (ischemic) وتعمل ندبة (segmental sclerosis). ده مرض **قديم** في الخلفية. أما الجديد اللي رفع الـ creatinine في شهرين فهو الـ casts. فالتقرير بيوصف طبقتين: ضرر مزمن من الضغط، وضرر حاد من الـ light chains.
      - kind: reveal
        page: 265
        quote: "LM 26 glomeruli were seen, in all serial sections examined, out of which 6 were obsolescent. The patent glomeruli showed ischemic changes with slightly shrunken tufts. Three glomeruli showed segmental tuft sclerosis. Tubules showed moderate injury with hyaline casts, some of them were fractured, lamellated and surrounded by a cellular reaction. Interstitium showed diffuse mild lymphocytic infiltrate on a background of diffuse moderate fibrosis (35% of submitted tissue). Arteries showed moderate intimal sclerosis. Arterioles showed focal mild hyalinosis."
        prompt: "Casts في الـ tubules: fractured، lamellated، وحواليها cellular reaction. بتفكّرك بإيه؟"
        answer: "**Light chain cast nephropathy** (myeloma kidney). التقرير كتب «suggestive of a cast nephropathy, for clinical and serological evaluation»؛ يعني دوّر على الـ **monoclonal protein**."
      - kind: explain
        page: 266
        title: "ليه الـ casts دي light chains؟"
        quote: "Acute Tubular Injury, Suggestive of a Cast Nephropathy. For Clinical and Serological Evaluation."
        text: |
          التشخيص: ==acute tubular injury, suggestive of a cast nephropathy==، **for clinical and serological evaluation**؛ ومعاه **FSGS NOS** مع global glomerulosclerosis (20%)، و **IFTA 35%**، و moderate arteriosclerosis.

          ليه الشكل ده؟ التفسير المقبول (مش في الكتاب):
          - الـ **free light chains** بتتفلتر وتوصل الـ distal tubule، وهناك بتمسك في الـ **Tamm–Horsfall protein (uromodulin)** وتعمل casts **صلبة** بتسد الـ tubule.
          - الـ casts دي **fractured** و **lamellated** لأنها متبلورة ومتطبّقة، مش زي الـ hyaline cast الطري.
          - الـ **cellular reaction** (وأحيانًا giant cells) لأن الجسم بيعاملها كجسم غريب.
          - والـ **proteinuria 15.7 g** هنا مش من glomerulus مخروم بس؛ جزء كبير منها light chains (افتكر الـ **overflow** في جدول الـ proteinuria).
          يعني الـ biopsy بيقول «شكلها light chains»، والتأكيد من الدم والبول.

          وإيه اللي بعد كده؟ التفسير المقبول (مش في الكتاب): التأكيد بـ **serum free light chains** (نسبة kappa/lambda) و **SPEP/UPEP مع immunofixation**، وبعدين **bone marrow**. والعلاج السريع للـ clone (chemo) هو اللي ممكن يرجّع الكلية، لأن كل يوم الـ casts بتسد tubules أكتر. وليه نتجنب الـ NSAIDs والـ contrast والجفاف؟ لأنهم بيقللوا البول في الـ tubule فالـ casts تتكون أسهل.

          إزاي تفرّق الـ cast ده عن الـ hyaline cast العادي في الصورة؟ التفسير المقبول (مش في الكتاب): الـ hyaline cast ناعم، متجانس، ومن غير cells حواليه، وبيتشاف في أي tubular injury. الـ light chain cast **متكسر** بزوايا حادة، **متطبق**، ولونه أقوى، ومحاوط بـ macrophages و giant cells. فلما تقرا «fractured» و «cellular reaction» في نفس الجملة، فكّر myeloma على طول.
      - kind: aside
        tone: tip
        page: 266
        quote: "Acute Tubular Injury, Suggestive of a Cast Nephropathy. For Clinical and Serological Evaluation."
        text: |
          التقرير مش بيقفل التشخيص لوحده: «==for clinical and serological evaluation==». يعني الـ pathologist بيقولك: الـ casts دي شكلها **light chains**، روح أكّد بالـ serology.

          وفاكر الـ list بتاعة أول المحاضرة؟ **Light chain cast nephropathy** من الأمراض اللي بتعمل acute renal failure (ARF) من غير glomerulonephritis (GN).
