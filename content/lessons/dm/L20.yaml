        quote: "Effects of Lipid-Modifying Drugs on HDL-C Levels\n|  |  |\n|---|---|\n| Niacin | ↑ 15–35% |\n| Fibrates | ↑ 10–15% |\n| Statins | ↑ 5–10% |"
        text: "الترتيب **N-F-S** زي **\"نفس\"**: Niacin الأول، Fibrates، وآخرهم Statins. والأرقام نازلة: 35، 15، 10."
      - kind: update
        page: 256
        quote: "Effects of Lipid-Modifying Drugs on HDL-C Levels\n|  |  |\n|---|---|\n| Niacin | ↑ 15–35% |\n| Fibrates | ↑ 10–15% |\n| Statins | ↑ 5–10% |"
        text: "رفع الـ high-density lipoprotein cholesterol (HDL-C) بالدوا ما قللش الـ cardiovascular events: الـ niacin فوق الـ statin فشل في **AIM-HIGH (2011)** و **HPS2-THRIVE (2014)**. الـ European Society of Cardiology (ESC)/European Atherosclerosis Society (EAS) 2019 ما حطتش target للـ HDL-C. الامتحان: أرقام الكتاب."
        ref: "ESC/EAS dyslipidaemia guidelines 2019"
      - kind: figure
        remind: [dm.L20.051]
        page: 256
        quote: "Specific Approaches to Increase HDL\n  1. Promoting ApoA1 Production.\n  2. Promoting Cholesterol Efflux and RCT.\n  3. Slowing removal of HDL from Blood."
        title: "3 طرق لتعلية الـ HDL"
        alt: "Three stacked boxes: one, promote ApoA-I production, with ApoA-I Milano, autologous ApoA-I and mimetic peptides including oral D-4F; two, promote cholesterol efflux and RCT, with ABCA1 regulated by LXR and RXR and PPAR agonists; three, slow HDL removal from blood, with CETP inhibitors and a CETP vaccine."
        caption: "يا **تصنّع** ApoA-I أكتر، يا **تسرّع** خروج الكوليسترول (efflux)، يا **تبطّأ** شيل الـ HDL من الدم (CETP)."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="74" rx="8" class="fg-acc"/>
