    front: In ADAMTS13-deficient TMA in pregnancy, what is the goal and what if plasma exchange fails?
    back: Restore ADAMTS13 activity with plasma exchange; if it fails, rituximab is an option (with caution in pregnancy).
    src: { page: 364, quote: "performed prior to 34 weeks of gestation to decrease the risk of neonatal respiratory distress syndrome. Treatment of the thrombotic microangiopathies, including TTP, and atypical HUS, includes plasmapheresis and eculizumab (for aHUS). In ADAMTS13-deficient TMA, the goal is to regain enzymatic activity through plasma exchange, and if plasma exchange is unsuccessful, rituximab is an option for treatment. Rituximab is a B-cell depleting monoclonal antibody and provides short- term benefits with a reduced hospital stay, decreased plasma exchange requirements, and lower rates of relapse. Rituximab in pregnancy- related TMA should be used with caution. While fetal toxicity (thrombocytopenia, neutropenia, and B-cell depletion) was seen in <10% of neonates and short-term outcomes were promising, no long-term assessment of rituximab safety in neonates is available. (14)" }
