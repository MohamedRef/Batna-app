      - kind: explain
        remind: [rheum.L09.028]
        page: 167
        title: "الـ workup"
        quote: "Elevated muscle enzymes (CK, aldolase, AST, ALT, LDH)."
        text: |
          - **Enzymes:** ==Creatine kinase (CK)==، aldolase، aspartate aminotransferase (AST)، alanine aminotransferase (ALT)، LDH (أيوه الـ AST و ALT من العضلة كمان، ما تتلخبطش وتفتكره كبد)
          - **Antibody panels:** Myositis-specific autoantibodies (MSAs) و myositis-associated autoantibodies (MAAs)
          - **Electromyography (EMG):** myopathic: **short-duration, low-amplitude** motor unit potentials (MUPs) + spontaneous activity (fibrillations، positive sharp waves)
          - **Biopsy:** ==تأكيد وتفرقة== بين الأنواع
          - **magnetic resonance imaging (MRI):** oedema و inflammation و ==يحدد مكان الـ biopsy==
      - kind: reveal
        page: 167
        prompt: "ليه الـ AST والـ ALT بيعلوا في الـ myositis، وليه الـ EMG مهم لو الـ enzymes عالية أصلًا؟"
        quote: "Shows myopathic changes: short-duration, low-amplitude motor unit"
        answer: |
          الكتاب: **elevated muscle enzymes (CK، aldolase، AST، ALT، LDH)**، والـ EMG بيوري ==myopathic changes==: **short-duration, low-amplitude** motor unit potentials و **spontaneous activity**.

          التفسير المقبول (مش في الكتاب):
          - الـ **AST والـ ALT** مش بتوع الكبد بس؛ موجودين في **ألياف العضلة**، ولما الليفة تتكسر بيطلعوا في الدم. لو ما خدتش بالك، هتطلب ultrasound للكبد وتنسى العضلة. والـ **CK** هو الأكثر تحديدًا للعضلة.
          - الـ **EMG** بيجاوب سؤال تاني: الضعف ده من **العضلة** ولا من **العصب**؟ الـ motor unit فيها ألياف أقل شغالة، فالـ potential **أقصر وأوطى**. والـ spontaneous activity معناها ألياف ملتهبة **بتنفض لوحدها**. ده بيفرّقها عن الـ neuropathy اللي فيها potentials كبيرة.
          - والـ **biopsy** بتأكد و **تفرّق الأنواع** (necrosis، inflammation، inclusion bodies) لأن العلاج والـ prognosis بيختلفوا.
