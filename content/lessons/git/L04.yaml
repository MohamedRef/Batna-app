  - id: git.L04.lesson3
    title: "بوليبات المعدة، ومين بيحضّر لسرطانها"
    hook: "الفسيخ والرنجة والـ H. pylori والجينات. وبوليب 4 cm فيه سرطان في 40% من المرات."
    minutes: 9
    pages: [152, 155]
    topics: [gastric-polyps, gastric-risk]
    goals:
      - "تعرف أرقام الـ gastric polyps وإمتى البوليب يتشال بالجراحة"
      - "تعرف ليه سرطان المعدة بييجي متأخر رغم إنه curable"
      - "تصنّف عوامل الخطر وتعرف السبب ورا كل مجموعة"
    status: unverified
    steps:
      - kind: explain
        page: 152
        quote: "They are usually an incidental finding on endoscopy detected in 2-4% of gastroscopic evaluation."
        title: "الـ gastric polyps"
        text: |
          الـ gastric tumors: **benign** (epithelial و mesenchymal) و**malignant**: primary (adenocarcinoma، gastrointestinal stromal tumor (GIST)، lymphoma) أو secondary.

          الـ ==gastric polyps== غالبًا **incidental finding** في 2-4% من المناظير، وشكلها **2-3 mm sessile** في الـ body والـ fundus.

          وبتظهر في 53% من مرضى familial adenomatous polyposis (FAP) و Gardner، وممكن تكون معاها colorectal neoplasms في 60%.

          التفسير المقبول (مش في الكتاب): ليه نقسم الأورام كده؟ لأن كل نوع جاي من نسيج مختلف وعلاجه مختلف: الـ adenocarcinoma جراحة، والـ lymphoma غالبًا chemo أو مضاد حيوي، والـ GIST علاجه موجّه. فأول سؤال قدام أي كتلة في المعدة: «من أنهي نسيج؟».
      - kind: reveal
        page: 153
        quote: "Gastric polyps can occur in 53% of the patients with familial adenomatous polyposis or gardners syndrome."
        prompt: "لقيت بوليبات في معدة واحد عنده FAP. ليه لازم تبص على القولون كمان؟"
        answer: |
          الكتاب: الـ gastric polyps بتظهر في ==53%== من مرضى **familial adenomatous polyposis** و **Gardner syndrome**، وممكن تكون معاها **colorectal neoplasms** في ==60%==.

          التفسير المقبول (مش في الكتاب): الـ FAP مرض **جيني** في كل خلايا الـ GI tract، مش في عضو واحد. فالبوليب في المعدة علامة إن نفس الـ mutation شغالة في القولون، والقولون هو اللي فيه الخطر الأكبر. يعني بوليب المعدة هنا «جرس» يخليك تعمل colonoscopy، مش بس تشيل البوليب وتمشي.
      - kind: explain
        page: 153
        quote: "Polyps > 4cms in diameter may harbour carcinoma in 40% of the time."
        title: "الـ adenomatous polyp: الأرقام"
        text: |
          - 10% من الـ gastric polyps، غالبًا **solitary, sessile, antral**.
          - 3 أنواع: tubular، tubulovillous، villous.
          - **Adenocarcinoma** بيتلاقي في ==21%==، والخطر بيزيد مع الحجم والـ villous.
          - البوليب فوق **4 cm**: carcinoma في **40%**.
          - Focal carcinoma: 6% في الـ flat tubular، و33% في الـ villous والـ tubulovillous.

          يعني الـ adenoma هو البوليب اللي «بيتحرك» ناحية السرطان، فأي adenoma لازم يتشال كله ويتفحص كله.
      - kind: explain
        page: 153
        quote: "Gastric adenocarcinomas may be found in 21% of cases with increased risk in larger size and villous variety."
        title: "ليه الكبير والـ villous أخطر؟"
        text: |
          الكتاب: الخطر بيزيد مع **larger size** و **villous variety**: فوق 4 cm فيه carcinoma في 40%، والـ villous والـ tubulovillous فيهم focal carcinoma في 33% مقابل 6% بس في الـ flat tubular.

          التفسير المقبول (مش في الكتاب): البوليب الكبير معناه خلايا اتقسمت مرات أكتر، وكل انقسام فرصة لـ mutation جديدة، فاحتمال إن جزء منه وصل لسرطان أعلى. والـ **villous** شكله أصابع طويلة فيها سطح أكبر وخلايا أكتر بتنقسم. وعلشان كده البوليب الكبير ما ينفعش تاخد منه biopsy صغيرة وتطمّن: الجزء اللي فيه السرطان ممكن يكون في حتة ما خدتش منها. لازم يتشال كله ويتفحص كله.
      - kind: check
        page: 153
        quote: "Operative excision - sessile lesions more than 2 cms. Polyps found to have areas of invasive tumor or -polyps symptomatic to pain or bleeding."
        question: "Which gastric adenoma needs operative excision?"
        options:
          - "A 3 cm sessile adenoma"
          - "A 1 cm polyp fully removed, no invasive cancer"
          - "A 3 mm fundic polyp found by chance"
          - "Any tubular adenoma"
        answer: 0
        why:
          - "صح: sessile lesions more than 2 cm تتشال جراحيًا، زي البوليب اللي فيه invasion أو بيعمل pain أو bleeding."
          - "Endoscopic polypectomy كفاية لو اتشال كله ومفيش invasive cancer."
          - "دي الـ incidental 2-3 mm اللي بنشوفها كتير."
