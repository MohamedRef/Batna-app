        page: 73
        quote: "Lack of RAAS activation"
        title: "ليه الـ slow UF بيتفادى العيوب دي؟"
        text: |
          الكتاب (Table 4): الـ slow ultrafiltration (UF) بيشيل مية أسرع، **higher mass clearance of sodium**، **lack of RAAS** و **SNS activation**، cytokines أقل، و readmissions أقل.

          التفسير المقبول (مش في الكتاب):

          - الـ UF بيشيل سايل **isotonic** زي البلازما، **فـ** كل لتر بيطلّع صوديوم أكتر من لتر بول hypotonic.
          - الماكينة مش بتلمس الـ **macula densa**، **يعني** مفيش إشارة renin مباشرة زي الـ loop diuretic.
          - مفيش دوا بيتفرز في الـ tubule، **فـ** الـ K والـ Mg مش بيضيعوا بنفس الطريقة.
          - كلمة **slow** مهمة: السرعة الهادية بتدّي فرصة للمية ترجع من الأنسجة للدم (refill) **عشان** الضغط ميقعش.
