          - "HFE بينظّم إنتاج الـ hepcidin، وهو Type 1 الـ classic."
          - "HJV (hemojuvelin) بينظّم الـ hepcidin، وده Type 2A."
          - "TFR2 هو Type 3، اللي بيبدأ متأخر."
