      - kind: explain
        page: 178
        quote: "The most common presenting symptom is the insidious onset of exertional dyspnea that slowly progresses over many months and, in some cases, years."
        title: "أعراض الـ IPF"
        text: |
          - الأشهر: ==exertional dyspnea== بتبدأ بالراحة وتزيد على شهور، وأحيانًا سنين، لحد ما تبقى at rest.
          - في الأول بتتقلب على: out of shape، السن، الوزن، أو فيروس. وفيه ناس بتتعالج غلط على إنها **heart failure**.
          - **Nonproductive cough** و **fatigue** مهمين.

          ليه الـ dyspnea على المجهود الأول؟ التفسير المقبول (مش في الكتاب): في الراحة الدم بيقعد في الـ capillary وقت كفاية عشان ياخد الأكسجين حتى من حيطة تخينة. مع المجهود الدم بيجري أسرع، فالوقت ما يكفيش، والـ saturation تنزل. وليه الكحة ناشفة؟ لأن المرض في الـ interstitium مش في الشُعب، فمفيش إفرازات تطلع.
          - Systemic مش شائع: weight loss، low-grade fever، arthralgia، myalgia. **مش arthritis ومش myositis.**
          - ممكن يتكشف صدفة في X-ray أو spirometry لسبب تاني.
