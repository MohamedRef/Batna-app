        text: |
          الـ **desferrioxamine (DF)** فعّال، بس مشاكله في الكتاب تلاتة:
          1. **طريقة الإعطاء** (mode of administration): **SC بـ infusion pump** على 12 ساعة، 5–6 أيام في الأسبوع. يعني طفل متوصّل بـ pump كل ليلة.
