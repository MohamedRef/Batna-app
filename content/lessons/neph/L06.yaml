    status: unverified
    steps:
      - kind: explain
        page: 139
        title: "الـ K بيروح فين؟"
        quote: "Villous adenoma of the colon, which causes massive potassium secretion."
        text: |
          **GI losses**: إسهال مزمن (منهم **laxative abuse**)، و ==villous adenoma== في القولون بيفرز K بكميات.

          **Shift جوّه الخلايا**: TPN أو enteral feeding (بيطلّعوا insulin)، **insulin**، **beta-2 agonists** (albuterol، terbutaline)، **thyrotoxicosis** (thyrotoxic periodic paralysis)، و familial periodic paralysis.
      - kind: sort
        page: 140
        quote: "Primary hyperaldosteronism."
        prompt: "Hypokalemia: حط كل سبب في مكانه:"
        bins: ["GI loss", "Shift into cells", "Renal loss", "Drug"]
        cards:
          - { text: "Villous adenoma", bin: 0 }
          - { text: "Laxative abuse", bin: 0 }
          - { text: "Salbutamol", bin: 1 }
          - { text: "Thyrotoxic periodic paralysis", bin: 1 }
          - { text: "Primary hyperaldosteronism", bin: 2 }
          - { text: "Gitelman syndrome", bin: 2 }
          - { text: "Hypomagnesemia", bin: 2 }
          - { text: "Amphotericin B", bin: 3 }
          - { text: "Theophylline", bin: 3 }
        why: "الـ renal: Cushing، Conn، renin tumor، GRA، ==Bartter و Gitelman و Liddle==، RTA، Fanconi، و hypomagnesemia. الـ drugs: diuretics، laxatives، amphotericin، carbenicillin، penicillin جرعات عالية، theophylline."
      - kind: explain
        page: 141
        title: "الأعراض: عضلات، كلى، سكر"
        quote: "Hypokalemia can present with polyuria and polydipsia due to decreased concentrating ability of the kidney."
        text: |
          - **Weakness و fatigue** (الأشهر)؛ تظهر dyspnea، constipation، distension، exercise intolerance، ونادرًا **paralysis**.
          - الشديدة: cramps و ==rhabdomyolysis==.
          - **Polyuria و polydipsia**: الكلية مش قادرة تركّز البول.
          - نفسي: psychosis، delirium، hallucinations، depression.
          - المزمنة: ==kaliopenic nephropathy==: chronic TIN مع **cysts صغيرة**، tubular atrophy، macrophages و fibrosis.
          - **Glucose intolerance**: السكر يعلى **10 mg/dL لكل 1 mEq/L** نقص في الـ K (الـ K بيظبط إفراز الـ insulin).
      - kind: reveal
        page: 141
        quote: "K+ should be given before HCO3 therapy because correction of metabolic acidosis will cause an intracellular shift of K+"
        prompt: "عيان عنده hypokalemia و metabolic acidosis. تدي bicarbonate ولا K الأول؟"
        answer: "==K الأول==. لو صلّحت الـ acidosis، الـ K هيدخل الخلايا والـ K في الدم هينزل أكتر (ممكن arrhythmia أو شلل). بعد ما يستقر، اديله HCO3 مع الـ K."
      - kind: explain
        page: 141
        title: "إزاي تدي K في الوريد"
        quote: "IV 0.9% saline 1L with 20-40mmol KCl at no more than 10-20mmol KCl/h through peripheral cannula."
        text: |
          **0.9% saline لتر** فيه **20–40 mmol KCl**، بسرعة **ما تعدّيش 10–20 mmol/h** في وريد طرفي.

          ==ابعد عن الـ glucose والـ bicarbonate==: الـ glucose بيطلّع insulin، والاتنين بيدخّلوا الـ K الخلايا.
      - kind: aside
        tone: joke
        page: 141
        quote: "(Avoid glucose-containing solutions or sodium bicarbonate)."
        text: "تحط KCl في محلول glucose؟ ده زي ما تملا الحلة ميه وهي مخرومة من تحت: الـ insulin هيسحب الـ K لجوّه الخلايا أول ما يوصل."
      - kind: explain
        page: 142
        title: "الماغنسيوم"
        quote: "Normal range: 1.5-2.3 mg/dl. 60% stored in bone. 1% in extracellular space."
        text: |
          الطبيعي **1.5–2.3 mg/dL**؛ **60% في العضم** و **1% بس برّه الخلايا**. Cofactor لإنزيمات كتير، والكلية هي اللي بتظبطه.

          **Hypomagnesemia**:
          - **Renal**: loop أو thiazide، recovery من obstruction أو ATN، nephrotoxins (**aminoglycosides، cisplatin، ciclosporin، amphotericin، foscarnet**)، hypercalciuria، Gitelman و Bartter.
          - **Gut**: إسهال، NG suction، جراحة، malabsorption، **pancreatitis**، **alcohol**.
      - kind: aside
        tone: exam
        page: 142
        quote: "Low Mg occurs in conjunction with low K (50% of cases), low Ca and a metabolic alkalosis."
        text: "الـ Mg الواطي بييجي مع ==low K (50%)== و **low Ca** و metabolic alkalosis. أي K أو Ca **مش راضي يتصلح**: قيس الـ Mg."
      - kind: explain
        page: 143
        title: "أعراض الـ Mg الواطي وعلاجه"
        quote: "10mmol MgSO 4 IVI bolus over 5min, then 20mmol MgSO 4 in 100mL 0.9% saline IV over 4 hours."
        text: |
          **أعراض**: weakness، cramps، carpopedal spasm، **Chvostek و Trousseau**، tetany، تشنجات، delirium، nystagmus، و **arrhythmias** (supraventricular أو ventricular).

          **العلاج**:
          - Asymptomatic و Mg **فوق 0.4**: oral slow-release **6–18 mmol/day** على 4 جرعات.
          - Symptomatic أو مع low Ca أو K: ==10 mmol MgSO4 في 5 دقايق==، بعدين **20 mmol في 100 mL saline على 4 ساعات**، وكرر لو محتاج.
          - ارجع للـ oral لما يعدّي **0.5**؛ الإسهال ممكن يحدّ من الـ oral.
      - kind: explain
        page: 143
        title: "Hypermagnesemia: كل حاجة بتهدى"
        quote: "Occurs usually if excess Mg administered IV (as in treating pre-eclampsia) or in patients with impaired renal function given exogenous Mg."
        text: |
          نادرة لأن الكلية بتطلّع الزيادة. بتحصل مع **IV Mg زيادة** (زي الـ **pre-eclampsia**) أو Mg لعيان كليته تعبانة (**antacids**، MgSO4 enemas).

          الـ Mg بيهدّي الـ CNS وبيقلل استجابة الـ neuromuscular junction للـ acetylcholine. الترتيب: ==hyporeflexia== و paresthesia ← weakness ← صعوبة بلع ← **respiratory depression**. فوق **3.5**: bradycardia و BP واطي.
