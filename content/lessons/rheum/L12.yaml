  - id: rheum.L12.lesson4
    title: "التحاليل والـ prognosis والعين"
    hook: "مفيش تحليل بيقولك ده JIA، بس فيه تحاليل بتقولك هيمشي إزاي، وفحص عين ممكن ينقذ النظر."
    minutes: 8
    pages: [203, 204]
    topics: [labs, prognosis]
    goals:
      - "تعرف إن مفيش diagnostic test وتحفظ نسب الـ ANA و RF"
      - "تعرف تحاليل الـ systemic وإمتى تشك في amyloidosis"
      - "تعرف عوامل الـ prognosis الوحش ومواعيد فحص العين"
    status: unverified
    steps:
      - kind: explain
        page: 203
        quote: "Laboratory Findings\n1. There are no diagnostic tests\n2. The acute phase reactants are usually normal or mildly raised.\n3. A persistent elevated ESR with no other evidence of inflammation on other laboratory tests, might suggest the rare condition of hyperfibrinogenaemia. ANA is present in 40 up to 75% of cases with no evidence that its level correlates with disease activity."
        title: "التحاليل: مفيش test بيشخّص"
        text: |
          - ==No diagnostic test==. التشخيص history و exam.
          - الـ acute phase reactants: **normal أو mildly raised**.
          - Erythrocyte sedimentation rate (ESR) عالي لوحده من غير أي دليل التهاب تاني: فكّر في **hyperfibrinogenaemia** (نادر).
          - **Antinuclear antibodies (ANA) في 40–75%**، ومستواه مش بيمشي مع النشاط.
          - **Rheumatoid factor (RF) في 5%** بس.
          - Plain X-ray لتقييم الـ joint damage.

          ليه مفيش test؟ لأن الـ JIA تعريفه أصلًا شروط مدة واستبعاد (ص 197)، وكل تحليل ممكن يطلع طبيعي في طفل عنده المرض أو موجب في طفل سليم.
      - kind: reveal
        page: 203
        quote: "A persistent elevated ESR with no other evidence of inflammation on other laboratory tests, might suggest the rare condition of hyperfibrinogenaemia."
        prompt: "طفل الـ ESR بتاعه عالي على طول، والـ CRP وكل حاجة تانية طبيعية. ليه الكتاب بيقولك فكّر في hyperfibrinogenaemia؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ ESR بيقيس سرعة نزول كرات الدم، والـ ==fibrinogen== هو أكبر بروتين بيخليها تلزق في بعض وتنزل أسرع. فلو الـ fibrinogen عالي لوحده، الـ ESR يعلى من غير التهاب حقيقي، والـ CRP يفضل طبيعي.

          وده نفس المنطق اللي هتشوفه في الـ MAS بالعكس: الـ fibrinogen بيتستهلك فالـ ESR **يقع**.
      - kind: explain
        page: 203
        title: "ليه الـ ANA مفيد مع إنه مش بيشخّص؟"
        quote: "ANA is present in 40 up to 75% of cases with no evidence that its level correlates with disease activity."
        text: |
          الكتاب: ==ANA في 40 لـ 75%== ومستواه مش بيمشي مع النشاط، و **RF في 5%** بس. وفي الـ poly: ESR و CRP وكرات الدم البيضا ممكن تعلى أو تبقى طبيعية.

          طب بنعمله ليه؟ عشان الـ ANA في الـ oligo بيرفع ==خطر الـ iridocyclitis== (ص 199)، وبيحدد كل قد إيه نفحص العين (الصفحة الجاية). يعني هو تحليل **risk** مش تحليل **diagnosis**.

          وليه الـ RF قليل كده؟ التفسير المقبول (مش في الكتاب): لأنه بيطلع في نوع واحد بس من السبعة، الـ RF+ve poly في البنات المراهقات، وده نوع صغير.
      - kind: explain
        remind: [rheum.L12.053]
        page: 204
        quote: "Anaemia, thrombocytosis, leucocytosis.\nRaised acute phase reactants.\nMost childrens are sero negative for RF and ANA."
        title: "تحاليل الـ systemic onset"
        text: |
          - Anaemia، **thrombocytosis**، leucocytosis.
          - Acute phase reactants عالية.
          - أغلبهم **seronegative** للـ RF والـ ANA.
          - Hypoalbuminaemia (multifactorial)، ولو معاها ==heavy proteinuria== فكّر في **amyloidosis**.
      - kind: explain
        page: 204
        quote: "Prognosis is related more to the disease course than to the onset type persistant oligoarticular disease is associated with the best articular outcome whereas, extended disease within the first or second year of onset carries a worse prognosis."
        title: "الـ Prognosis"
        text: |
          الـ prognosis بيمشي مع ==the course== أكتر من الـ onset type. **Persistent oligo** أحسن outcome، و extended بدري (أول سنة أو تانية) أوحش.

          عوامل الخطر:

          - Systemic onset مع infection أو amyloidosis أو macrophage activation syndrome (MAS).
          - Polyarticular disease.
          - **RF و anti-CCP** إيجابي.
          - محتاج systemic corticosteroids.
          - سن أصغر عند البداية.
          - Female gender.
      - kind: reveal
        page: 204
        quote: "Prognosis is related more to the disease course than to the onset type persistant oligoarticular disease is associated with the best articular outcome whereas, extended disease within the first or second year of onset carries a worse prognosis."
        prompt: "ليه كل عوامل الـ prognosis الوحش دي مع بعض (poly، RF و anti-CCP، steroids، سن صغير، بنت)؟"
        answer: |
          الكتاب بيدّي القايمة. التفسير المقبول (مش في الكتاب) للخيط اللي بيجمعها: كلها علامات إن الالتهاب **أوسع** أو **أشرس** أو **أطول**:
          - **Poly** و **extended**: مفاصل أكتر = تلف أكتر
          - **RF و anti-CCP**: نفس الـ antibodies اللي بتتنبأ بالتآكل في الـ RA عند الكبار
          - **محتاج systemic steroids**: يعني المرض ما اتسيطرش عليه بالأخف
          - **سن صغير**: سنين أكتر من المرض قدامه والعضم لسه بيكبر
          - **Systemic** مع infection أو amyloidosis أو MAS: دي نفسها مضاعفات قاتلة
