          - "فيه immunological activity، فالمرض لسه نشط."
          - "الـ azathioprine للـ maintenance، مش للـ refractory."
      - kind: try
        items: [neph.L14.077, neph.L14.081, neph.L14.084, neph.L14.086, neph.L14.089]
