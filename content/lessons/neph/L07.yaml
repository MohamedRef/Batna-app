  - id: neph.L07.lesson7
    title: "Fabry و nail-patella: الـ zebra والرُكبة"
    hook: "ولد إيده بتحرقه من صغره ومش بيعرق، وواحدة من غير صابونة رُكبة. الاتنين ممكن يوصلوا للكلى."
    minutes: 9
    pages: [186, 197]
    topics: [fabry, nps]
    goals:
      - "تعرف الـ enzyme والجين والأعراض في كل جهاز في Fabry"
      - "تشخّص وتعالج Fabry"
      - "تعرف nail-patella syndrome وشكل الـ EM"
    status: unverified
    steps:
      - kind: explain
        page: 186
        title: "Fabry: إنزيم ناقص"
        quote: "Fabry disease is caused by hereditary deficiency of the enzyme a- galactosidase A (a-Gal A)"
        text: |
          نقص ==α-galactosidase A== فيتجمع **glycosphingolipid (Gb3)** جوّه الخلايا.

          الجين **GLA** على ==X chromosome== (أكتر من 500 mutation). الرجالة (hemizygous) حالتهم شديدة، والستات (heterozygous) متغيرة وغالبًا أخف.

          النتيجة: **CKD، pain crises، مشاكل عرق، جلد، قلب، وعين**.
      - kind: mnemonic
        page: 186
        quote: "Clinically, this leads to progressive CKD, pain crises, sweat-ing abnormalities, vascular cutaneous lesions, and cardiac and eye abnormalities."
        word: "FABRY"
        parts:
          - { key: "F", text: "Feet and hands burn: acral pain crises from childhood" }
          - { key: "A", text: "Angiokeratomas (bathing-trunk area) and Anhidrosis" }
          - { key: "B", text: "Bad kidneys: proteinuria, ESRD 3rd–6th decade" }
          - { key: "R", text: "Rhythm and LVH: heart, coronary disease" }
          - { key: "Y", text: "Eye: corneal verticillata (75%)" }
        hook: "**FABRY**: وده كل الأعراض. والموت غالبًا من ==MI أو stroke==."
      - kind: explain
        page: 188
        title: "الكلية"
        quote: "the nephropathy of Fabry disease typically manifests as mild to moderate proteinuria, sometimes with microhematuria"
        text: |
          - **Proteinuria خفيفة لمتوسطة** ± microhematuria من **العقد الثالث**؛ الـ nephrotic نادر.
          - في البول: ==oval fat bodies مع Maltese cross== تحت الـ polarized light.
          - ضغط و ESRD في العقد **4–5**؛ لحد **10%** من الستات يوصلوا ESRD.
          - **LM**: الـ podocytes منفوخة ومليانة **vacuoles صافية**.
          - **EM**: inclusions في الـ lysosomes (myelin figures) طبقات متوازية = ==zebra bodies==.
      - kind: explain
        page: 190
        title: "القلب والأعصاب والجلد والعين"
        quote: "The vertebrobasilar circulation is preferentially involved."
        text: |
          - **القلب**: coronary narrowing (angina، MI، HF)، ==LVH بدري== (وممكن isolated)، arrhythmias، و valves.
          - **Autonomic**: **hypohidrosis**، acral paresthesias، و motility.
          - **المخ**: من العقد الرابع، والـ ==vertebrobasilar== الأكتر: vertigo، diplopia، dysarthria، ataxia، ونزيف أو infarction.
          - **الجلد**: **angiokeratomas** في العقد التاني (ممكن أول علامة)، أحمر غامق، في **lower trunk والأرداف والـ genitalia**.
          - **العين**: **verticillata** (corneal whorls) في **75%** من الرجالة والستات، cataract 23% رجالة.
      - kind: explain
        page: 192
        title: "التشخيص والعلاج"
        quote: "The diagnosis should be confirmed by demonstrating decreased (<15%) or absent a-Gal A activity in serum, leukocytes, cultured skin fibroblasts, or tissue."
        text: |
          **التشخيص**: الراجل غالبًا إكلينيكي + **slit lamp**. التأكيد: ==α-Gal A activity أقل من 15% أو مش موجود==. لو مش واضح: slit lamp، urinary ceramide di/trihexoside، و genetic testing.

          **العلاج**: ==agalsidase== (enzyme replacement): Gb3 يقل، الألم يتحسن، الـ deposits تتشال، والكلية تستقر 1–2 سنة. + **RAS blockade** للـ proteinuria. بيتدي **أثناء الـ hemodialysis** (الغسيل مش بيشيله). لكل الرجالة والستات اللي عندهم أعراض، بس **غالي جدًا**.

          **الزرع**: بيعالج الكلية بس مش الباقي؛ الموت من القلب والمخ. و ==الـ heterozygotes ما يتبرعوش==.
      - kind: check
        page: 189
        quote: "The layers may be arranged in parallel (zebra bodies)."
        question: "Kidney EM shows lamellated lysosomal inclusions in podocytes ('zebra bodies'). Which enzyme is low?"
        options:
          - "α-galactosidase A"
          - "Glucocerebrosidase"
          - "Hexosaminidase A"
          - "Arylsulfatase A"
        answer: 0
        why:
          - "صح: Fabry، و Gb3 بيتجمع في الـ lysosomes."
          - "ده Gaucher."
          - "ده Tay-Sachs."
          - "ده metachromatic leukodystrophy."
      - kind: explain
        page: 194
        title: "Nail-patella syndrome"
        quote: "characterized by hypoplasia or absence of the patellae, dys-trophic nails, dysplasia of the elbows and iliac horns, and renal disease"
        text: |
          **Autosomal dominant**، جين ==LMX1B== (transcription factor مهم للأطراف والكلية).

          - **Patella** غايبة أو صغيرة في **أكتر من 90%**.
          - ==Iliac horns== في **80%**: **pathognomonic**.
          - **Nails** في **98%**: bilateral، الإيد أكتر، dystrophic، koilonychia، و **triangular lunulae**.
          - **Elbows**: aplasia أو hypoplasia.
          - **الكلية** في أقل من النص: microhematuria و proteinuria خفيفة في المراهقة، وخطر ESRD **3–5%** بس.
      - kind: explain
        page: 195
        title: "الـ EM: الـ GBM متآكل"
        quote: "EM shows multiple irregular lucencies of the GBM, giving it a moth-eaten appearance"
        text: |
          الـ LM مش بيقول حاجة (FSGS أو mesangial أو طبيعي)، فلازم ==EM==: GBM فيه فراغات كتير = **moth-eaten**، وجوّاها **cross-banded collagen fibrils** (تبان أحسن بالـ **phosphotungstic acid**).

          **العلاج**: مفيش خاص. **مش بيرجع في الكلية المزروعة**، بس افحص المتبرع القريب كويس لأنه AD.
      - kind: match
        page: 195
        quote: "EM is required to make the diagnosis. EM shows multiple irregular lucencies of the GBM, giving it a moth-eaten appearance"
        prompt: "وصّل كل مرض بشكله في الـ EM:"
        pairs:
          - ["Alport syndrome", "Basket-weave GBM"]
          - ["Thin basement membrane", "Diffusely thin GBM"]
          - ["Fabry disease", "Zebra bodies in podocytes"]
          - ["Nail-patella syndrome", "Moth-eaten GBM with collagen fibrils"]
        why: "الأربعة وراثيين وكلهم بيتشخّصوا بالـ ==EM==. احفظهم كصورة: سبت، رفيع، zebra، متآكل."
      - kind: aside
