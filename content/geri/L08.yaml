  - id: geri.L08.087
    kind: card
    topic: pseudogout
    front: Which alcoholic drinks may increase gout attacks, and which does not seem to?
    back: Beer and distilled liquor may increase attacks; wine does not seem to cause gout.
    src: { page: 146, quote: "Are the same joints affected? Gout is most common in middle-aged men and usually starts in the large toe. This is called podagra. The knee is the most common place for pseudogout to start. Pseudogout tends to occur more evenly in men and women and usually occurs in older people. Gout attacks can sometimes be caused by eating lots of red meat, particularly organ meats that are high in purines. Drinking certain types of alcohol, such as beer and distilled liquor may increase attacks. Wine does not seem to cause gout. Pseudogout is not related to diet. In both conditions, joints in the hand and wrist can be involved." }
