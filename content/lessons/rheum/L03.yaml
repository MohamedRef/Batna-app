            <text x="288" y="192" text-anchor="middle" class="t-sm t-mut">no antibody</text>
          </svg>
      - kind: mnemonic
        page: 53
        quote: "Immune complex diseases are called type III hypersensitivity."
        word: "ACID"
        hook: "الأربع أنواع بالترتيب «ACID»: الحساسية زي الحمض، بتحرق الأنسجة."
        parts:
          - { key: "A", text: "Anaphylactic / Allergic (type I, IgE)" }
          - { key: "C", text: "Cytotoxic (type II, antibody on cells)" }
          - { key: "I", text: "Immune complex (type III)" }
          - { key: "D", text: "Delayed (type IV, T cells)" }
      - kind: table
        page: 53
        quote: "Classification of Immunologic Diseases"
        title: "Classification of immunologic diseases"
        columns: ["Type", "Via", "Injury by"]
        rows:
          - ["I", "IgE", "Mast cell mediators"]
          - ["II", "IgG, IgM on cells/ECM", "Opsonization, complement, Fc receptors"]
          - ["III", "Immune complexes", "Complement, neutrophils"]
          - ["IV", "CD4 / CD8 T cells", "Macrophages, cytokines, cell killing"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: check
        page: 53
        quote: "Tissue injury may be due to T lymphocytes that activate the effector mechanisms of delayed-type hypersensitivity or directly kill target cells"
        question: "Which type is caused by T lymphocytes rather than antibodies?"
        options: ["Type IV", "Type I", "Type II", "Type III"]
        answer: 0
        why:
          - "صح: type IV هو الوحيد الـ cell mediated."
          - "Type I = IgE والـ mast cells."
          - "Type II = IgG/IgM على سطح الخلية."
          - "Type III = immune complexes."
      - kind: aside
        tone: joke
        page: 52
        quote: "Disorders caused by immune responses are called hypersensitivity diseases."
        text: "الجهاز المناعي في الـ hypersensitivity زي الأم المصرية: نيتها خير ١٠٠٪، بس لما تخاف عليك زيادة، اللي بيتأذي هو إنت."
      - kind: try
        items: [rheum.L03.002, rheum.L03.003, rheum.L03.007, rheum.L03.012, rheum.L03.014]
    recap:
      - "Hypersensitivity = immune response زيادة أو غلط بتعمل tissue damage."
      - "Triggers: infection مش بتتشال (TB)، حاجة بريئة (pollen)، autoantigen (DNA في SLE)."
      - "ACID: I anaphylactic، II cytotoxic، III immune complex، IV delayed."
      - "I-III antibody mediated، IV cell mediated."
    practice: [rheum.L03.001, rheum.L03.002, rheum.L03.003, rheum.L03.004, rheum.L03.005, rheum.L03.006, rheum.L03.007, rheum.L03.008, rheum.L03.009, rheum.L03.010, rheum.L03.011, rheum.L03.012, rheum.L03.013, rheum.L03.014, rheum.L03.096]
