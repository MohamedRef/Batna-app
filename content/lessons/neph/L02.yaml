  # ------------------------------------------------------------------
  - id: neph.L02.lesson1
    title: "يعني إيه CKD؟ التعريف والتصنيف"
    hook: "واحد من كل عشرة عنده CKD ومعظمهم مايعرفوش. التعريف رقمين ومدة."
    minutes: 8
    pages: [23, 24]
    topics: [epidemiology, definition]
    goals:
      - "تعرف تعريف KDIGO للـ CKD وليه 3 شهور"
      - "تعرف علامات الـ kidney damage وليه هي بالذات"
      - "تفهم ليه مريض الـ CKD بيموت بالقلب"
    status: unverified
    steps:
      - kind: explain
        page: 23
        quote: "CVD Main cause of death in CKD"
        title: "مرض شائع وبيقتل بالقلب"
        text: |
          في 2017 كان فيه حوالي **843.6 مليون** إنسان عندهم chronic kidney disease (CKD)، يعني تقريبًا **1 من كل 10**. الوفيات زادت **41.5%** من 1990، ومتوقع يبقى **السبب الخامس** للوفاة.

          والمهم للامتحان: مريض الـ CKD غالبًا **مش بيموت من الكلى**. ==cardiovascular disease (CVD)== هو السبب الأول للوفاة.
      - kind: explain
        page: 24
        quote: "CKD is defined as abnormalities of kidney structure or function, present for > 3 months, with implications for health and CKD is classified based on cause, GFR category, and albuminuria category (CGA)."
        title: "تعريف KDIGO 2012"
        text: |
          الـ ==CKD== = abnormality في **structure** أو **function** الكلى، موجودة **أكتر من 3 شهور**، ولها تأثير على الصحة.

          ويتصنّف بالـ ==CGA==: **C**ause، **G**FR category، **A**lbuminuria category.

          المعيار: واحد من دول لمدة > 3 شهور:

          - **glomerular filtration rate (GFR) < 60** (G3a–G5)، **أو**
          - **marker of kidney damage**: albuminuria (ACR ≥ 30 mg/g)، urine sediment، tubular disorder، histology، imaging، أو تاريخ زرع كلى

          التفسير المقبول (مش في الكتاب): شرط الـ **3 شهور** موجود **عشان** نفرّق المرض المزمن عن AKI أو نزول مؤقت بيرجع. والتصنيف بالـ CGA **لأن** السبب والـ GFR والـ albuminuria هم اللي بيحددوا الـ prognosis والعلاج.
      - kind: figure
        page: 24
        quote: "CKD is defined as abnormalities of kidney structure or"
        title: "التعريف في رسمة واحدة"
        alt: "Two boxes joined by OR: GFR under 60, or a marker of kidney damage such as ACR 30 mg/g or more, sediment, tubular disorder, histology, imaging or transplant. Both feed a clock labelled more than 3 months, which leads to CKD, classified by Cause, GFR category and Albuminuria category."
        caption: "**واحد** من الاتنين يكفي، بس لازم يفضل **أكتر من 3 شهور**. وبعدها التصنيف بالـ **CGA**."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="N2d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="140" height="56" rx="8" class="fg-acc"/>
            <text x="80" y="34" text-anchor="middle" class="t-b">GFR &lt; 60</text>
            <text x="80" y="54" text-anchor="middle" class="t-sm">G3a to G5</text>
            <text x="165" y="43" text-anchor="middle" class="t-b">OR</text>
            <rect x="180" y="10" width="140" height="56" rx="8" class="fg-acc"/>
            <text x="250" y="30" text-anchor="middle" class="t-sm t-b">Damage marker</text>
            <text x="250" y="46" text-anchor="middle" class="t-sm">ACR 30 mg/g or more,</text>
            <text x="250" y="60" text-anchor="middle" class="t-sm">sediment, imaging...</text>
            <line x1="80" y1="66" x2="150" y2="100" class="fg-arrow" marker-end="url(#N2d)"/>
            <line x1="250" y1="66" x2="180" y2="100" class="fg-arrow" marker-end="url(#N2d)"/>
            <rect x="95" y="102" width="140" height="36" rx="18" class="fg-bad"/>
            <text x="165" y="125" text-anchor="middle" class="t-b">&gt; 3 months</text>
            <line x1="165" y1="138" x2="165" y2="162" class="fg-arrow" marker-end="url(#N2d)"/>
            <rect x="40" y="164" width="250" height="56" rx="8" class="fg-good"/>
            <text x="165" y="186" text-anchor="middle" class="t-b">CKD</text>
            <text x="165" y="208" text-anchor="middle" class="t-sm">Cause, GFR category, Albuminuria category</text>
          </svg>
      - kind: explain
        page: 24
        quote: "CKD is defined as abnormalities of kidney structure or"
        title: "ليه 3 شهور بالذات؟"
        text: |
          الكتاب بيشترط إن الـ abnormality تفضل **أكتر من 3 شهور**. التفسير المقبول (مش في الكتاب): علشان نفصل الـ CKD عن حاجتين بيعملوا نفس الأرقام لفترة قصيرة:

          - ==AKI==: الـ creatinine بيطلع فجأة وممكن يرجع خالص في أيام أو أسابيع.
          - الـ albuminuria **العابرة**: رياضة، حمى، UTI، أو الدورة (هتشوفهم في جدول ص 30) بيعلّوا الـ ACR يوم ويرجع.

          يعني رقم واحد غير طبيعي **مش تشخيص**. التشخيص هو الرقم اللي **بيفضل**. وعلشان كده خطوة "أكّد بعد 3 شهور" موجودة في الـ screening algorithm.
      - kind: explain
        page: 24
        quote: "and albuminuria category (CGA)."
        title: "ليه التصنيف تلات حروف مش حرف واحد؟"
        text: |
          الكتاب بيصنّف الـ CKD بالـ **CGA**: Cause، GFR category، Albuminuria category. التفسير المقبول (مش في الكتاب) لكل حرف:

          - **C (Cause)**: لأن العلاج الخاص بيمشي ورا السبب. lupus nephritis محتاج immunosuppression، والـ obstruction محتاج تفك الانسداد، ومحدش هيعالجهم صح لو اكتفى بكلمة "CKD".
          - **G (GFR)**: بيقولك فاضل قد إيه من شغل الكلى، وده اللي بيحدد جرعات الأدوية والمضاعفات.
          - **A (Albuminuria)**: بيقولك الـ filter **بيتأذى قد إيه دلوقتي**. واحد GFR بتاعه 50 من غير albumin غير واحد GFR 50 وبيرمي 1 جرام.

          يعني الـ G بتوصف اللي **راح**، والـ ==A== بتتنبأ باللي **جاي**. ولما تجمعهم على الـ heat map هتعرف الخطر.
      - kind: explain
        page: 24
        quote: "Urine sediment abnormalities"
        title: "ليه دول بالذات markers of damage؟"
        text: |
          الكتاب بيعدّ markers of kidney damage. والتفسير المقبول (مش في الكتاب) لكل واحد:

          - **Albuminuria (ACR ≥ 30 mg/g)**: الـ glomerulus السليم مش بيعدّي albumin، فوجوده معناه إن الـ filter نفسه اتأذى، حتى لو الـ GFR لسه طبيعي.
          - **Urine sediment abnormalities**: زي الـ ==RBC casts== أو الـ dysmorphic RBCs، دول بيتعملوا جوه الـ nephron نفسه، يعني المرض جوه الكلية مش في المسالك.
          - **Tubular disorders**: الـ tubule ممكن يفشل في وظيفة واحدة (زي RTA أو فقد K) والـ GFR سليم.
          - **Histology** و **imaging**: بيشوفوا الـ structure مباشرة (fibrosis، cysts، scars).
          - **History of kidney transplantation**: الـ graft كلية واحدة شايلة شغل اتنين، فبيتعامل معاه على إنه CKD.
      - kind: check
        page: 24
        quote: "Criteria for CKD (either of the following present for > 3 months)\n| Markers of kidney damage (one or more) | Albuminuria (AER ≥ 30 mg/24 hours; ACR ≥ 30 mg/g [≥ 3 mg/mmol]) |\n| | Urine sediment abnormalities |\n| | Electrolyte and other abnormalities due to tubular disorders |\n| | Abnormalities detected by histology |\n| | Structural abnormalities detected by imaging |\n| | History of kidney transplantation |\n| Decreased GFR | GFR < 60 ml/min/1.73 m2 (GFR categories G3a-G5) |"
        question: "eGFR 85 and ACR 50 mg/g, persisting for 6 months. CKD?"
        options:
          - "Yes: albuminuria is a marker of damage, so this is CKD G2A2"
          - "No: eGFR is above 60"
          - "No: ACR must be above 300"
          - "Only if the kidneys are small on ultrasound"
        answer: 0
        why:
          - "صح: أي marker of damage لمدة > 3 شهور يكفي حتى لو الـ GFR فوق 60."
          - "الـ GFR < 60 معيار، بس مش المعيار الوحيد."
          - "الحد 30 mg/g، و > 300 ده A3."
          - "الـ imaging marker تاني، مش شرط."
      - kind: check
        page: 24
        quote: "History of kidney transplantation"
        question: "Which finding, persisting for 3 months, does NOT by itself meet the KDIGO criteria for CKD?"
        options:
          - "A single raised serum creatinine with eGFR 72"
          - "ACR 45 mg/g"
          - "History of kidney transplantation"
          - "Structural abnormality on imaging"
        answer: 0
        why:
          - "صح: eGFR 72 فوق 60، ومفيش marker of damage. والـ creatinine لوحده مش marker."
          - "ACR ≥ 30 mg/g = albuminuria = marker of damage."
          - "تاريخ زرع الكلى واحد من الـ markers في الكتاب."
          - "Structural abnormalities detected by imaging marker في الكتاب."
      - kind: explain
        page: 24
        quote: "Increased cardiovascular disease"
        title: "ليه مريض الكلى بيموت بالقلب؟"
        text: |
          رسمة الـ hyperfiltration في ص 24 بتكمّل لحد آخرها: الـ glomerular hyperfiltration بيجيب **oxidative stress** و**inflammation**، ودول بيعملوا ==endothelial dysfunction==، فالـ arteries تبقى **stiff**، والضغط يعلى ويفقد تغيّره الطبيعي بين الليل والنهار، والنهاية **increased cardiovascular disease and mortality**.

          التفسير المقبول (مش في الكتاب) لباقي الحكاية: الـ CKD كمان بيجيب أنيميا (القلب يشتغل أكتر)، و phosphate عالي بيكلّس الشرايين، واحتباس ملح ومية. علشان كده الـ ==CVD== بيسبق الـ dialysis في أغلب المرضى.

          الخلاصة للامتحان: في مريض CKD، علاج الضغط والدهون والسكر مش "إضافي"، ده نص علاج الكلى.
      - kind: try
        items: [neph.L02.004, neph.L02.006, neph.L02.001, neph.L02.002]
    recap:
      - "CKD = abnormality > 3 شهور؛ GFR < 60 أو marker of damage (ACR ≥ 30 mg/g)."
      - "الـ 3 شهور بتفصله عن الـ AKI والـ albuminuria العابرة."
      - "CGA: السبب بيحدد العلاج، الـ G اللي راح، الـ A اللي جاي."
      - "CVD هو السبب الأول لوفاة مريض الـ CKD."
    practice: [neph.L02.001, neph.L02.002, neph.L02.003, neph.L02.004, neph.L02.005, neph.L02.006, neph.L02.007, neph.L02.008, neph.L02.154]
