        text: "فكّر فيها زي سلّم: **aspirin** هو الدرجة الأولى للكل. **خسارة كتير أو متأخرة** ← تطلع درجة (heparin **prophylactic**). **جلطة قبل كده** ← أعلى درجة (heparin **therapeutic**)."
