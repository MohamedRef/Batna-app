  - id: hem.L10.lesson5
    title: "Hb عالي بس مش PV: رئة، جبل، أو Hb ماسك في الأكسجين"
    hook: "لما الأنسجة تجوع أكسجين، الكلية بتطلب كرات أكتر. اعرف مين بيجوّعها."
    minutes: 9
    pages: [169, 171]
    topics: [secondary]
    goals:
      - "تصنّف أسباب الـ polycythemia غير الـ PV وتعرف منطق التقسيم"
      - "تفهم الـ primary familial والـ hypoxic causes والـ high altitude"
      - "تشرح ليه الـ high-affinity Hb بيعمل polycythemia"
    status: unverified
    steps:
      - kind: explain
        page: 169
        title: "الخريطة"
        quote: "Causes of polycythemia other than polycythemia vera"
        text: |
          - **Primary**: ==primary familial and congenital polycythemia== (عيب في الـ progenitors نفسها).
          - **Secondary مع systemic hypoxia**:
          - **Chronic hypoxia**: lung disease، hypopnea، **high altitude**، cyanotic heart disease.
          - **Defective O2 transport**: **high-affinity Hb**، **low 2,3-BPG**، **met-Hb**، **heavy smoking** (CO-Hb).
          - **Secondary من غير hypoxia**: **Chuvash**، **abnormal erythropoietin (EPO) secretion** (كلى، cerebellar hemangioma، hepatocellular carcinoma (HCC))، **endocrine** (androgens، Cushing، Conn، pheo، Bartter).

          المنطق اللي ورا الخريطة: اسأل **مين بيدّي الأمر**. يا الخلية نفسها حساسة (primary)، يا الكلية شايفة أكسجين قليل بجد (hypoxia)، يا الـ EPO بيطلع من غير hypoxia (ورم، طفرة في حساس الأكسجين، هرمونات).
      - kind: figure
        page: 169
        quote: "Causes of polycythemia other than polycythemia vera"
        title: "صورة الكتاب: الخريطة كاملة"
        image: { file: hem/L10-polycythemia-causes.webp, book: true }
        alt: "Book table printed as a picture in two parts with four columns. Primary polycythaemia, intrinsic defect in red cell progenitors: primary familial and congenital polycythaemia. Secondary polycythaemia in the presence of systemic hypoxia: chronic hypoxia (lung disease, hypopnoea, high altitude, congenital cyanotic heart disease) and defective oxygen transport (high-affinity haemoglobins, red cell metabolic defects with low 2,3 BPG, methaemoglobinaemia, heavy smoking with carboxyhaemoglobinaemia). Polycythaemia in the absence of systemic hypoxia: inherited or congenital (Chuvash polycythaemia); abnormal erythropoietin secretion (renal tumours, cystic or polycystic kidney disease, renal transplantation, renal hypoxia such as renal artery stenosis or hydronephrosis, cerebellar haemangioma, hepatocellular carcinoma); endocrine syndromes (androgenic steroids, Cushing's syndrome, Conn's syndrome, phaeochromocytoma, Bartter's syndrome)."
        caption: |
          الجدول اللي فوق اتلخّص منه، مطبوع كصورة على جزئين. اقراه **من الشمال لليمين**، كل عمود بيدخل أعمق:

          - **فوق خالص**: ==Primary== (عيب في الـ progenitors نفسها) ← primary familial and congenital.
          - **Secondary مع systemic hypoxia**: فرعين: **chronic hypoxia** (lung disease، hypopnoea، high altitude، cyanotic heart disease) و **defective oxygen transport** (high-affinity Hb، 2,3-BPG واطي، met-Hb، heavy smoking).
          - **Secondary من غير hypoxia** (آخر صف في الجزء الأول، ويكمل في الجزء التاني تحت): **Chuvash**، و ==abnormal EPO secretion== (أورام وأكياس الكلى، بعد الـ transplant، renal artery stenosis، hydronephrosis، cerebellar haemangioma، hepatocellular carcinoma)، و **endocrine** (androgens، Cushing، Conn، phaeochromocytoma، Bartter).

          العمود الأخير (اليمين) هو الأسماء اللي هتتسأل فيها، والأعمدة اللي قبله هي **السبب**: ده اللي يخليك تفتكرها.
      - kind: sort
        page: 169
        quote: "Causes of polycythemia other than polycythemia vera"
        prompt: "فيه hypoxia ولا لأ؟"
        bins: ["With systemic hypoxia", "Without systemic hypoxia"]
        cards:
          - { text: "COPD", bin: 0 }
          - { text: "High altitude", bin: 0 }
          - { text: "High-affinity hemoglobin", bin: 0 }
          - { text: "Heavy smoking", bin: 0 }
          - { text: "Chuvash polycythemia", bin: 1 }
          - { text: "Renal transplantation", bin: 1 }
          - { text: "Cerebellar hemangioma", bin: 1 }
          - { text: "Cushing syndrome", bin: 1 }
        why: "الـ hypoxia يا إما الأكسجين ما بيدخلش (رئة، جبل، قلب cyanotic) يا إما الـ Hb ماسك فيه وما بيسيبوش للأنسجة (high-affinity، met-Hb، CO). من غير hypoxia: الـ EPO بيعلى من غير سبب (Chuvash، كلى، أورام) أو androgens."
      - kind: explain
        remind: [hem.L10.096]
        page: 170
        title: "Primary familial: الـ receptor هو العيب"
        quote: "Primary polycythemia\n  1ry familial and congenital polycythemia\n  Rare, erythropoiesis is intrinsically overactive\n  Transmitted as autosomal dominant.\n  Isolated erythrocytosis, normal WBC and platelet count, no splenomegaly.\n  No evolution to leukemia.\n  Low or normal Epo level\n  Normal Hb-O2 dissociation curve\n  Mutation or truncation of Epo receptor protein with increased sensitivity to Epo."
        text: |
          - نادر، ==erythropoiesis is intrinsically overactive==، **autosomal dominant**.
          - **Isolated erythrocytosis**: WBC و platelets طبيعيين، **مفيش طحال**، و **مفيش leukemia**.
          - الـ EPO **واطي أو normal**، والـ Hb–O2 curve **طبيعي**.
          - السبب: **mutation أو truncation** في الـ **EPO receptor**، فبقى **أحسّ** للـ EPO.

          التفسير المقبول (مش في الكتاب) للصورة دي كلها: العيب في **receptor الكرات الحمرا بس**، فالخطوط التانية سليمة (isolated). وده مش ورم clonal، فمفيش leukemia ولا طحال. والـ EPO واطي بالـ feedback: الكرات كتير، فالكلية بتسكت. يعني هو الوحيد في الـ secondary list اللي الـ EPO فيه واطي زي الـ PV، بس من غير JAK2.
      - kind: explain
        page: 170
        title: "الـ hypoxic: صفقة لها تمن"
        quote: "Secondary polycythemia with systemic hypoxi\n  COPD.\n  Sleep apnea syndrome\n  Hypoventilation syndrome\n  Polycythemia occurs to increase O2 carrying capacity while increasing blood viscosity.\n  Venesection is suggested if Hct above 0.55"
        text: |
          - الأسباب: **COPD**، **sleep apnea syndrome**، **hypoventilation syndrome**.
          - الكتاب بيقول الـ polycythemia بتحصل ==to increase O2 carrying capacity while increasing blood viscosity==.
          - **Venesection** لو **Hct >0.55**.

          الجملة دي هي السبب كله: الكرات الزيادة **مفيدة** (بتشيل أكسجين أكتر لرئة مش بتدّي كفاية)، بس فوق حد معين الـ **viscosity** بتاكل المكسب. عشان كده ما بنفصدش أي Hct عالي في COPD: بس لما يعدّي **0.55**، لأن المكسب عند الحد ده بيبقى أقل من الضرر.
      - kind: check
        page: 170
        quote: "Polycythemia occurs to increase O2 carrying capacity while increasing blood viscosity.\nVenesection is suggested if Hct above 0.55"
        question: "COPD patient, SaO2 88%, Hct 0.52, no symptoms of hyperviscosity. Venesection?"
        options: ["No: suggested only above 0.55", "Yes: target below 0.45 as in PV", "Yes: any secondary polycythemia", "No: venesection is never used in hypoxia"]
        answer: 0
        why:
          - "صح: الكتاب بيقترح الـ venesection لو Hct فوق 0.55."
          - "الـ 0.45 هدف الـ PV؛ هنا الكرات بتعوّض الـ hypoxia."
          - "الكرات الزيادة مفيدة لحد حد معين."
          - "بيتعمل، بس فوق 0.55."
      - kind: explain
        page: 171
        title: "فوق الجبل وفي القلب"
        quote: "Excessive altitude polycythemia (PCV>0.65) in some cases with hyperuricemia and proteinuria."
        text: |
          - فوق **4000 م** (ص 170): **multisystem adaptation**: mild polycythemia، perfusion و diffusion أحسن، و enzymes و myoglobin.
          - **Excessive altitude polycythemia**: Packed cell volume (PCV) ==>0.65== (ممكن hyperuricemia و proteinuria).
          - **Chronic mountain sickness** (decompensation): PCV **>0.75** مع بطء تفكير، صداع، lethargy، dyspnea، كحة ناشفة، و **right heart failure (HF)**. العلاج **angiotensin-converting enzyme (ACE) inhibitor**.
          - **Cyanotic congenital heart disease** (right to left shunt): PCV ممكن **>0.8**. صلّح الـ defect لو ينفع. في الحالات اللي ما تتعملش، العلاج **مش straightforward**: بعضهم venesection عند **PCV >0.60**، وبعضهم للأعراض بس (hemoptysis، fatigue شديد، exercise intolerance).

          ليه الـ cyanotic مش سهل؟ نفس الصفقة: الكرات هي اللي مخلية الطفل ده عايش بأكسجين قليل، فلو شلتها كتير هتقلل الأكسجين، ولو سبتها الدم يتقل. عشان كده الخبرا مختلفين.
      - kind: explain
        page: 171
        title: "Hb ماسك في الأكسجين"
        quote: "High affinity hemoglobins\n  Release less O2 for given partial pressure resulting in tissue hypoxia  Epo-driven polycythemia.\n  Pathognomonic anomaly is left shift of oxygen dissociation curve."
        text: |
          ==High-affinity Hb==: بيسيب **O2 أقل** عند نفس الـ partial pressure، فالأنسجة تعمل **hypoxia**، والـ **EPO** يعلى (**EPO-driven polycythemia**).
          - **Pathognomonic**: **left shift** في الـ O2 dissociation curve (P50 واطي).
          - الطفرات في المنطقة اللي بتتحكم في التحول بين **T (tense)** و **R (relaxed)**.
          - أكتر من **40 variant**، أغلبها β-globin، وكلها **dominantly inherited**.

          اللفّة الذكية هنا: الـ SaO2 **طبيعي**، لأن الـ Hb متشبّع أكسجين كويس جدًا في الرئة. المشكلة إنه **مش بيسيبه** في الأنسجة. فالجهاز بيقيس «أكسجين كتير»، والكلية حاسة «أكسجين قليل».
      - kind: figure
        page: 171
        quote: "Pathognomonic anomaly is left shift of oxygen dissociation curve."
        title: "الـ left shift"
        alt: "Two oxygen dissociation curves on pO2 versus saturation axes. The normal curve has P50 marked at 50% saturation. A second curve sits to the left, labelled high-affinity Hb, met-Hb, CO-Hb and low 2,3-BPG, with a lower P50: hemoglobin holds oxygen more tightly and releases less to tissue."
        caption: "منحنى على الشمال = الـ Hb **ماسك** في الـ O2. الأنسجة بتجوع، الكلى تطلع EPO، والكرات تزيد. وده يحصل في ==high-affinity Hb== و met-Hb و CO-Hb وقلة الـ 2,3-BPG."
