        page: 207
        quote: "Folic acid (1 mg/day) is given during treatment in addition to a multivitamin.\n  Close monitoring for hepatic and haematological toxicity."
        prompt: "ليه بنحسب الـ MTX في الطفل بالـ m² (مساحة الجسم)، وليه بنديله folic acid؟"
        answer: |
          الكتاب بيدّي **10 mg/m²/week** و **folic acid 1 mg/day** و monitoring للكبد والدم.

          التفسير المقبول (مش في الكتاب):
          - **الـ m²**: الطفل جسمه بيكسّر الدوا بسرعة مختلفة عن الكبير، ومساحة الجسم بتمشي مع حجم الكبد والكلى أحسن من الوزن، فالجرعة بتبقى أدق
          - **الـ folic acid**: الـ MTX بيعطّل استعمال الـ folate في الخلايا اللي بتنقسم بسرعة، فنعوّض الـ folate عشان نقلل الأعراض الجانبية (تقرحات البق، الكبد، الدم) من غير ما نبوّظ مفعوله في الالتهاب
          - **الكبد والدم**: لأن دول أكتر حاجات بتتأذي منه
