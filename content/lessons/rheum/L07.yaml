          - { key: "I", text: "Immune complex clearance: C3b, CR1 on RBCs" }
          - { key: "D", text: "Dead and dying cells removed" }
        hook: "**OALBID**: ستة بالترتيب بتاع الكتاب. جواب سؤال «biological activities of complement»."
      - kind: reveal
        page: 121
        quote: "Deposition of C3b on large antigen-antibody complexes disrupt the bonds"
        prompt: "ليه نقص الـ early complement زي C1q و C4 و C2 بيرتبط بالـ SLE؟ فكّر من اللي اتشرح."
        answer: |
          لأن الـ complement هو اللي بيشيل ==immune complexes== والخلايا الميتة (apoptotic debris). من غيره بيتراكموا، والجسم يعمل antibodies ضد الـ nuclear antigens بتاعتهم، ويترسّب في الكلية والجلد.

          ده ربط من الـ physiology اللي في المحاضرة، وتفاصيل نقص الـ complement في الـ SLE في محاضرة الـ SLE.
