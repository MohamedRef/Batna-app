  # ------------------------------------------------------------------
  - id: geri.L13.lesson5
    title: "الساعات الأخيرة، الـ hospice، وإمتى نبدأ"
    hook: "العيلة مرعوبة من صوت «الخرخرة» في نَفَس أبوهم. كلمتين منك ممكن يغيّروا آخر ساعات ليهم."
    minutes: 7
    pages: [228, 230]
    topics: [last-hours, hospice, markers]
    goals:
      - "تجهّز العيلة للساعات الأخيرة"
      - "تفرّق الـ hospice عن الـ palliative care"
      - "تعرف علامات بدء الـ palliative care في الكبار"
    status: unverified
    steps:
      - kind: explain
        page: 228
        quote: "Family education about expected symptoms such as delirium, excessive secretions, edema, and coma can help prepare families"
        title: "جهّز العيلة"
        text: |
          اشرح للعيلة الأعراض المتوقعة قبل ما تحصل:
          - **Delirium**.
          - ==Excessive secretions==.
          - **Edema**.
          - **Coma**.
      - kind: reveal
        page: 228
        quote: "caused by air moving through uncleared secretions in the trachea and vocal cords of a comatose patient"
        prompt: "البنت بتعيّط: «بابا بيتخنق!» والصوت جاي مع كل نَفَس. تقولها إيه؟"
        answer: "ده ==death rattle==: هوا بيعدّي على secretions في الـ trachea والـ vocal cords مايقدرش يطلّعها لأنه في coma. **مش اختناق**، وهو **مش حاسس بمعاناة** ولا ضيق نفس. ده يمكن أكتر عرض بيوجع العيلة، فالشرح نفسه علاج."
      - kind: explain
        page: 228
        quote: "If edema is present, therapies that can exacerbate edema, such as IV fluids, should be discontinued when at all possible."
        title: "الجلد والـ edema"
        text: |
          - لو فيه edema: وقّف أي حاجة بتزوّده زي ==IV fluids== على قد ما تقدر.
          - الجلد: **lubricants و emollients** بدل التقليب، لأن التقليب بيوجع.
          - الـ pressure ulcers: ركّز على **الألم، الإفرازات، والريحة**، مش على الـ repositioning ولا العلاج اللي هدفه الالتئام.
      - kind: check
        page: 228
        quote: "If edema is present, therapies that can exacerbate edema, such as IV fluids, should be discontinued when at all possible."
        question: "A dying patient has marked edema and is on IV fluids. Best step?"
        options: ["Stop the IV fluids if possible", "Increase the IV fluids", "Start IV albumin", "Turn him every 2 hours"]
        answer: 0
        why:
          - "صح: الـ IV fluids بتزوّد الـ edema."
          - "هتزوّد الـ edema والـ secretions."
          - "مش هدف في الساعات الأخيرة."
          - "التقليب بيوجع؛ استخدم emollients."
      - kind: figure
        page: 229
        quote: "The biggest difference between hospice and palliative care is the patient: where they are in their illness especially related to prognosis"
        title: "Palliative care مقابل hospice"
        alt: "A timeline from diagnosis to death. A long bar labelled palliative care runs the whole way, from diagnosis, alongside curative treatment, with any prognosis. A shorter bar at the end labelled hospice starts when cure is no longer sought and two physicians certify less than six months to live."
        caption: "الـ palliative care على طول الطريق. الـ hospice آخر حتة بس، من غير curative intent."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="GL13b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <path d="M14 30H312" class="fg-arrow" marker-end="url(#GL13b)"/>
            <text x="10" y="20" class="t-sm t-mut">diagnosis</text>
            <text x="270" y="20" class="t-sm t-mut">death</text>
            <rect x="14" y="50" width="296" height="44" rx="8" class="fg-good"/>
            <text x="24" y="70" class="t-sm t-b">Palliative care</text>
            <text x="24" y="87" class="t-sm">any stage, any prognosis</text>
            <rect x="14" y="104" width="180" height="34" rx="8" class="fg-acc"/>
            <text x="24" y="126" class="t-sm">with curative treatment</text>
            <rect x="200" y="148" width="110" height="70" rx="8" class="fg-bad"/>
            <text x="210" y="168" class="t-sm t-b">Hospice</text>
            <text x="210" y="186" class="t-sm">no cure intent</text>
            <text x="210" y="204" class="t-sm">2 MDs: under 6 mo</text>
          </svg>
      - kind: explain
        page: 229
        quote: "Hospice is a type of care involving palliation without curative intent."
        title: "الـ hospice"
        text: |
          - ==Palliation without curative intent==: لما مفيش علاج شافي، أو المريض اختار مايكملش علاج صعب احتماله ضعيف.
          - **Medicare Hospice Benefit**: **اتنين** أطباء يشهدوا إن العمر المتوقع ==أقل من 6 شهور== لو المرض مشي طبيعي. ولو عاش أكتر؟ **مش بيتشال**.
          - الفرق الأكبر: **المريض** (فين في المرض، الـ prognosis، ورغبته في العلاج الشافي). الفلسفة والفريق شبه بعض.
          - **برا أمريكا**: كلمة hospice غالبًا يعني **مبنى** متخصص، مش مرحلة.
      - kind: check
        page: 229
        quote: "requires that two physicians certify that a patient has less than six months to live if the disease follows its usual course."
        question: "Which is true of hospice in the United States?"
        options: ["Two physicians certify under 6 months to live", "It can run alongside curative treatment", "Patients are discharged if they pass 6 months", "Any prognosis qualifies"]
        answer: 0
        why:
          - "صح: Medicare Hospice Benefit."
          - "ده الـ palliative care؛ الـ hospice من غير curative intent."
          - "الكتاب بيقول لأ، مش بيتشال."
          - "ده الـ palliative care، من غير قيود على الـ prognosis."
      - kind: explain
        page: 229
        quote: "physical decline, weight loss, multiple comorbidities, and a serum albumin of <2.5 g/dL."
        title: "إمتى نبدأ في الكبار؟"
        text: |
          **Core end-stage indicators** (Morrison & Meier):
          - Physical decline و **weight loss**.
          - Multiple comorbidities.
          - ==Serum albumin < 2.5 g/dL==.
          - اعتماد على الغير في **أغلب الـ ADLs**.
      - kind: aside
        tone: tip
        page: 230
        quote: "Frailty - extreme vulnerability to morbidity and mortality due to progressive decline in function and physiological reserve."
        text: |
          علامات **مش خاصة بمرض** معين، افتكرها **4F**:
          - ==Frailty== (falls متكررة، disability، يعيا بسهولة ومايرجعش).
          - **Function**: dependence.
          - **Forgetting**: cognitive impairment.
          - **Family** support needs.
      - kind: explain
        page: 230
        quote: "Continuity and coordination of care that responds to episodic and long-term chronic illnesses and transitioning between levels of care."
        title: "المريض ده محتاج إيه؟"
        text: |
          - ==Continuity و coordination== بين مستويات الرعاية.
          - إدارة **أمراض مزمنة كتير**.
          - يحافظ على **استقلاله الوظيفي**.
          - **قرار** في نوع الرعاية، وموازنة الفايدة والخطر.
          - **Pain و symptom control**.
          - دعم العيلة في البيت.
      - kind: case
        page: 229
        quote: "multiple comorbidities, and a serum albumin of <2.5 g/dL."
        stem: "A 91-year-old man with end-stage dementia, albumin 2.1 g/dL and total ADL dependence lives at home with his family."
        steps:
          - question: "Does he meet markers for palliative care?"
            options: ["Yes, albumin under 2.5, ADL dependence, cognitive impairment", "No, dementia is not a palliative illness", "Only if he has cancer", "Only after a hospital admission"]
            answer: 0
            why: "Albumin < 2.5 و dependence من الـ core indicators، و cognitive impairment من الـ 4F."
          - question: "He is now dying, with gurgling breaths. What do you tell the family?"
            options: ["It is the death rattle; he is not suffocating or suffering", "He needs ICU", "Start high-flow oxygen", "Nothing, it will upset them"]
            answer: 0
            why: "شرح الـ death rattle للعيلة جزء أساسي من رعاية الساعات الأخيرة."
      - kind: try
        items: [geri.L13.046, geri.L13.051, geri.L13.055, geri.L13.072, geri.L13.073]
    recap:
      - "الساعات الأخيرة: delirium، secretions، edema، coma؛ جهّز العيلة."
      - "Death rattle: مش اختناق ولا معاناة؛ أكتر عرض بيوجع العيلة."
      - "وقّف الـ IV fluids لو فيه edema؛ emollients بدل التقليب؛ الـ ulcers: ألم وإفرازات وريحة."
      - "Hospice: من غير curative intent، 2 أطباء أقل من 6 شهور. الفرق هو المريض."
      - "البدء: decline، weight loss، comorbidities، albumin < 2.5، ADL dependence + 4F."
