      - kind: explain
        page: 87
        quote: "Proteinuria is strong predictor Factor of Hypertension and poor Control"
        title: "ليه الـ proteinuria و الـ dialysis؟"
        text: |
          الكتاب: **60%** من CKD III و **>80%** من IV–V عندهم HT، **70%** uncontrolled، الـ **proteinuria** strong predictor، و **86%** من الـ HD عندهم HT و **30% بس** controlled.

          التفسير المقبول (مش في الكتاب):

          - الـ **proteinuria** معناها إن الـ glomeruli تحت ضغط عالي وتعبانة، والكلية دي بتحبس صوديوم أكتر، **فـ** الضغط أعلى وأصعب.
          - في الـ **HD** الكلية مش بتطلّع مية بين الجلسات، **فـ** الضغط بيمشي ورا الوزن اللي بيزيد. يعني أهم دوا هو **الـ dry weight** الصح.
      - kind: explain
        page: 87
        title: "إزاي الكلى بترفع الضغط"
        quote: "1- Low- nephron number during fetal life. →↓ Na+ volumes homeostasis. 2- Salt and water volume: one reason to sodium sensitivity could result from renal TIN ischemia which needs a high pressure for natriuresis. 3- Sympathetic Nervous system: SNS stimulation ( ↑renin - ↓ Na excretion - ↓ renal blood flow) which will lead to Renal damage (Salt Sensitive HT)"
        text: |
          ==Proteinuria== أقوى predictor للـ hypertension (HT) وللـ poor control.

          1. **Low nephron number** من الحمل ← Na و volume homeostasis أضعف.
          2. **Salt و water:** الـ **tubulointerstitial (TIN) ischemia** محتاجة ضغط أعلى علشان تطلّع الصوديوم (**pressure natriuresis**).
          3. **sympathetic nervous system (SNS):** ↑renin، ↓Na excretion، ↓renal blood flow (RBF) ← renal damage و salt-sensitive HT. العلاج: renal denervation، nephrectomy، ACE inhibitor (ACEi) و angiotensin II receptor blockers (ARBs). و ==renalase== (من الكلى) بيكسّر الـ catecholamines.
      - kind: figure
        page: 87
        quote: "renal TIN ischemia which needs a high pressure for natriuresis."
        title: "الكلية التعبانة محتاجة ضغط أعلى علشان تطلّع الملح"
        alt: "A graph of sodium excretion on the vertical axis against blood pressure on the horizontal axis. A green curve for the normal kidney rises steeply at normal pressure. A red curve for the damaged kidney is shifted to the right, reaching the same sodium output only at a higher pressure. A dashed line marks daily salt intake crossing both curves at two pressures."
        caption: "عشان تطلّع **نفس الملح** اللي بتاكله، الكلية التعبانة (أحمر) محتاجة **ضغط أعلى** (pressure natriuresis). كده الضغط العالي هو تمن التوازن. **الرسمة شرح مقبول، مش من الكتاب.**"
