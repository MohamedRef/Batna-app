        caption: "سنين طويلة الكلية بتكبر والـ creatinine ==طبيعي==. لما الـ GFR يبدأ يقع، الكلية بتكون اتشوّهت. علشان كده **الحجم** هو اللي بيتنبأ، مش الـ creatinine."
