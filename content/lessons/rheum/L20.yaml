            <text x="60" y="316" text-anchor="middle" class="t-sm t-b">Inflammation</text>
            <text x="60" y="334" text-anchor="middle" class="t-sm t-mut">skin, joint</text>
            <rect x="115" y="292" width="100" height="56" rx="10" class="fg-bad"/>
            <text x="165" y="316" text-anchor="middle" class="t-sm t-b">Erosions</text>
            <text x="165" y="334" text-anchor="middle" class="t-sm t-mut">osteoclasts</text>
            <rect x="220" y="292" width="100" height="56" rx="10" class="fg-good"/>
            <text x="270" y="316" text-anchor="middle" class="t-sm t-b">New bone</text>
            <text x="270" y="334" text-anchor="middle" class="t-sm t-mut">proliferation</text>
            <text x="165" y="378" text-anchor="middle" class="t-sm t-mut">TNF-α also kills osteoblasts: less repair</text>
          </svg>
      - kind: reveal
        page: 328
        quote: "Macrophages and dendritic cells produce IL-23. The GIT may be the source of IL-23 due to disturbed barrier function or changes in the microbiota."
        prompt: "إيه علاقة الأمعاء بمرض جلد ومفاصل؟"
        answer: |
          الكتاب بيقول إن الـ ==GIT ممكن يكون مصدر الـ IL-23== لما:
          - الـ **barrier function** تبقى بايظة، أو
          - الـ **microbiota** تتغيّر (dysbiosis).

          الـ macrophages والـ dendritic cells في جدار الأمعاء بتشوف البكتيريا وتطلّع IL-23، والـ IL-23 ده هو المايسترو اللي بيشغّل كل الحكاية. وده نفس الخيط اللي هتلاقيه في آخر المحاضرة: الـ **enteropathic arthritis** والـ **increased gut permeability**. يعني الـ spondyloarthritis عيلة واحدة، والأمعاء باب مشترك.
      - kind: reveal
        page: 328
        quote: "IL-23, is a central cytokine in the pathogenesis of PsO & PsA. It stimulates resident T cells (CD3+, CD4-, CD8-, IL-23R+) leading to the production of IL-17, IL-22, and TNF-alpha, which promote inflammation, bone loss with erosions, and osteoproliferation."
        prompt: "إزاي نفس المرض يعمل erosions ويعمل new bone في نفس الوقت؟"
        answer: |
          نفس الـ cytokines بتشتغل في اتجاهين: الـ **neutrophils** والـ **osteoclasts** بياكلوا العضم (**erosions**)، وفي نفس الوقت الالتهاب عند الـ **enthesis** بيحفّز **osteoproliferation**.

          ده بالظبط اللي هتشوفه في الأشعة: **destruction + new bone** في نفس الصباع.
      - kind: explain
        page: 328
        title: "ليه العضم مابيتصلحش"
        quote: "TNF-α can also induce apoptosis of osteoblasts, which also subsequently decreases the capacity to repair bone."
        text: |
          - الـ ==neutrophils== اللي جت مع الـ cytokines بتنشّط الـ **synoviocytes**، وبتعمل **angiogenesis**، وبتشغّل الـ **osteoclasts** اللي بتاكل العضم.
          - والـ **TNF-α** كمان بيموّت الـ **osteoblasts** (apoptosis)، فالقدرة على **إصلاح العضم** تقل.

          يعني الهدم بيزيد والبنا الطبيعي بيقل في نفس الوقت، علشان كده الـ erosions بتتقدم بسرعة. وده سبب منطقي إن الـ **TNF inhibitor** يكون أول biologic في الـ erosive disease: بيقفل الحنفيتين مرة واحدة (الربط ده تفسير مقبول، مش في الكتاب).
      - kind: check
        page: 328
        quote: "IL-23, is a central cytokine in the pathogenesis of PsO & PsA. It stimulates resident T cells (CD3+, CD4-, CD8-, IL-23R+) leading to the production of IL-17, IL-22, and TNF-alpha, which promote inflammation, bone loss with erosions, and osteoproliferation."
        question: "Central cytokine in psoriasis and PsA, made by macrophages and dendritic cells?"
        options: ["IL-23", "IL-6", "Interferon-α", "IL-4"]
        answer: 0
        why:
          - "صح: IL-23 بيشغّل الـ resident T cells تطلّع IL-17 و IL-22 و TNF-α."
          - "مش في الـ pathway بتاع الكتاب للـ PsA."
          - "الـ interferon ده بتاع الـ systemic lupus erythematosus (SLE) و Sjögren."
          - "IL-4 Th2، مش هنا."
      - kind: try
