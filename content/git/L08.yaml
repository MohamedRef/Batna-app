  - id: git.L08.050
    kind: card
    topic: celiac-treatment
    front: Why limit dairy at the start of a gluten-free diet?
    back: The book advises limiting dairy until the diarrhea disappears (damaged villi lose lactase).
    src: { page: 239, quote: "Limit intake of dairy products until diarrhea disappears." }
    status: unverified
  - id: git.L08.051
    kind: card
    topic: celiac-treatment
    front: Which vaccination does a celiac patient with hyposplenism need?
    back: Pneumococcal vaccination.
    src: { page: 239, quote: "Pneumococcal vaccination if hyposplenism is present." }
    status: unverified
  - id: git.L08.052
    kind: card
    topic: celiac-treatment
    front: Should patients with latent celiac disease be put on a gluten-free diet?
    back: Not currently; they are monitored and rebiopsied if symptoms develop, with multiple biopsies because changes can be patchy.
    src: { page: 239, quote: "Patients with latent CD are currently not advised to be on a GFD but should continue to be monitored" }
    status: unverified
  - id: git.L08.053
    kind: card
    topic: celiac-treatment
    front: Define refractory celiac disease and its treatment.
    back: No or incomplete response to gluten withdrawal after other causes are excluded. Treat with budesonide or oral steroids, then azathioprine for maintenance.
    src: { page: 239, quote: "The treatment can be started by budesonide, oral steroid, and then immune suppressant as azathioprine for maintenance." }
    status: unverified
    tags: [high-yield]
  - id: git.L08.054
