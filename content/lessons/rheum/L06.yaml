  # ------------------------------------------------------------------
  - id: rheum.L06.lesson1
    title: "جيشين: innate و adaptive"
    hook: "جيش واقف على الحدود من يوم ما اتولدت، وجيش متخصص بياخد 3–5 أيام يجهّز. الاتنين لازم يتكلموا مع بعض."
    minutes: 9
    pages: [83, 86]
    topics: [organs, innate, iis, cytokines]
    goals:
      - "تفرّق بين الـ innate والـ adaptive immunity (سؤال كتاب)"
      - "تعرف الـ PAMPs والـ Toll-like receptors"
      - "تعرّف الـ cytokines وطرق عملها"
    status: unverified
    steps:
      - kind: explain
        page: 84
        title: "منين بييجي الجيش؟"
        quote: "Granulocyte/monocyte (myeloid) lineage"
        text: |
          كله بيبدأ من **pluripotent stem cell** في الـ bone marrow، وبيتفرّع لخطين:

          - ==myeloid lineage==: neutrophils و eosinophils و basophils و mast cells و **monocytes**، والـ monocyte بيبقى **macrophage** في الأنسجة.
          - **lymphoid lineage**: **B cells** وبتبقى **plasma cells**، و **T cells** وبتعدّي على الـ **thymus**، و **NK cells**.

          والـ **lymphoid tissue** متوزّع في الـ lymph nodes والـ **MALT**، زي الـ tonsils والـ bronchial nodes والـ **Peyer's patches** في الـ GALT.
      - kind: table
        page: 85
        quote: "Circulating factors Complement, CRP Antibody"
        title: "الجيشين جنب بعض"
        columns: [Component, Innate, Adaptive]
        rows:
          - ["Barriers", "Skin, mucous membranes", "Mucosal immune system"]
          - ["Circulating", "Complement, CRP", "Antibody"]
          - ["Cells", "Macrophages, neutrophils, NK", "Lymphocytes"]
          - ["Mediators", "Monokines: IL-1, TNF, IL-12, IFN", "Lymphokines"]
        hide: [[1, 1], [1, 2], [2, 1], [2, 2]]
      - kind: sort
        page: 85
        quote: "Does not change in intensity with infection."
        prompt: "innate ولا adaptive؟"
        bins: ["Innate", "Adaptive"]
        cards:
          - { text: "Present at birth", bin: 0 }
          - { text: "Non-specific", bin: 0 }
          - { text: "Same intensity with every infection", bin: 0 }
          - { text: "Protects from fungi and worms", bin: 0 }
          - { text: "Acquired from exposure", bin: 1 }
          - { text: "Increases in intensity with exposure", bin: 1 }
          - { text: "Protects from viruses and protozoa", bin: 1 }
          - { text: "Lymphokines", bin: 1 }
        why: "الـ innate موجود من الولادة، مش specific، ومش بيقوى مع التكرار. الـ adaptive بيتعلّم: specific وبيقوى مع كل exposure. والبكتيريا الاتنين بيحموا منها."
      - kind: aside
        tone: analogy
        page: 85
        quote: "acquired immune system that takes 3-5 days can deal with it."
        text: |
          الـ ==innate== زي **الأمن المركزي** على باب القسم: موجود دايمًا، بيضرب أي حد غريب فورًا، بس مش بيعرف الأسامي.

          الـ **adaptive** زي **المباحث**: بتاخد **3–5 أيام** تعمل التحريات (clonal expansion)، بس لما تمسك المتهم بتمسكه هو بالظبط، وبتفتكره المرة الجاية.
      - kind: explain
        page: 86
        title: "الـ innate بيشوف إيه؟"
        quote: "Binding occurs through Toll-like receptors; mannose receptors (pattern"
        text: |
          الـ macrophage بيتعرّف على ==PAMPs==، يعني pathogen-associated molecular patterns: **lipopolysaccharides** و **peptidoglycans** و **mannans** و **bacterial DNA/RNA**.

          وبيمسكهم بـ **pattern recognition receptors**: **Toll-like receptors** و **mannose receptors**. وبعدها يطلّع cytokines:
          - **IL-1، TNF-α، IL-8** ← تنشّط الـ **neutrophils**
          - **IFN-α** ← ينشّط الـ phagocytes
          - **IL-15** ← ينشّط الـ **NK cells**
          - **IL-12، IL-18** ← ينشّطوا الـ **TH1**
      - kind: match
        page: 86
        quote: "IL-15 stimulate natural killer cells."
        prompt: "وصّل الـ cytokine بالهدف:"
        pairs:
          - ["IL-8", "Neutrophils"]
          - ["IL-15", "NK cells"]
          - ["IL-12", "TH1 cells"]
          - ["IFN-α", "Phagocytes"]
        why: "**IL-8** هو الـ neutrophil chemokine المشهور، و **IL-15** للـ NK، و **IL-12** هو مفتاح الـ Th1."
      - kind: reveal
        page: 86
        quote: "Binding of antigens to Toll receptors upregulates the expression of co-"
        prompt: "الـ innate بيكلّم الـ adaptive إزاي؟"
        answer: |
          بطريقتين:
          1. الخلايا الـ innate بتبلع الـ pathogen وتقدّمه للـ T cells، يعني بتشتغل ==APC==.
          2. لما الـ antigen يمسك في الـ **Toll receptor**، الـ APC تزوّد الـ **costimulatory molecules**، وده **ضروري** لتنشيط الـ T cell.

          افتكر الـ **anergy** من محاضرة الـ autoimmunity: من غير costimulation الـ T cell بتتقفل. فالـ innate هو اللي بيقول للـ adaptive "ده عدو بجد".
      - kind: explain
        page: 86
        title: "الـ cytokines"
        quote: "Cytokines can have an autocrine function, paracrine or endocrine function."
        text: |
          الـ ==cytokines== = **small molecular weight soluble factors** بتطلّعها الخلايا (cyto) علشان تكلّم خلايا تانية وتأثر عليها (kines) عن طريق **specific surface receptors**.

          - بتشتغل **autocrine** على نفسها، أو **paracrine** على اللي جنبها، أو **endocrine** بعيد في الدم.
          - اللي بتطلع من الـ WBCs وتشتغل على WBCs اسمها **interleukins**.
          - وظيفتها: **lymphocyte activation** و **local and systemic inflammation**.
      - kind: check
        page: 85
        quote: "Present at birth."
        question: "Which belongs to innate immunity?"
        options: ["Present at birth, unchanged by repeated infection", "Increases in intensity with exposure", "Mediated by antibodies and lymphokines", "Needs 3–5 days of clonal expansion"]
        answer: 0
        why:
          - "صح: الـ innate من الولادة ومش بيتغيّر مع العدوى."
          - "ده الـ adaptive: بيقوى مع التكرار."
          - "الـ antibodies والـ lymphokines adaptive."
          - "الـ clonal expansion في 3–5 أيام دي بتاعة الـ adaptive."
      - kind: try
        items: [rheum.L06.004, rheum.L06.005, rheum.L06.006, rheum.L06.012, rheum.L06.087]
    recap:
      - "Innate: من الولادة، non-specific، complement و CRP، macrophages و neutrophils و NK، monokines."
      - "Adaptive: specific، بيقوى مع الـ exposure، antibodies و lymphocytes، 3–5 أيام."
      - "PAMPs ← Toll-like و mannose receptors ← cytokines. IL-8 neutrophils، IL-15 NK، IL-12/18 TH1."
      - "الـ innate بيقدّم الـ antigen وبيزوّد الـ costimulators."
    practice: [rheum.L06.001, rheum.L06.002, rheum.L06.003, rheum.L06.004, rheum.L06.005, rheum.L06.006, rheum.L06.007, rheum.L06.008, rheum.L06.009, rheum.L06.010, rheum.L06.011, rheum.L06.012, rheum.L06.013, rheum.L06.014, rheum.L06.015, rheum.L06.016, rheum.L06.087]
