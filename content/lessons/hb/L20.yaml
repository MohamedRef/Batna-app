          - **Decompensated** والـ nitrogen intake مش كفاية بالأكل؟ → ==BCAA and leucine-enriched amino acid supplements==.
          - **Avoid hypomobility** وزوّد النشاط تدريجيًا (صفحة 411).
          - ==Combination of resistance and endurance exercise== غالبًا مناسب ومفيد، رغم الـ potential adverse effects (صفحة 409).
      - kind: reveal
