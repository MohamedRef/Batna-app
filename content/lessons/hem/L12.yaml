  - id: hem.L12.lesson6
    title: "السلحفاة والأرنب: follicular و DLBCL"
    hook: "واحد بيعيش 10 سنين في هدوء، والتاني بيجري في أسابيع بس ممكن يتعالج. ده الفرق بين الـ indolent والـ aggressive."
    minutes: 8
    pages: [204, 206]
    topics: [follicular, dlbcl]
    goals:
      - "تعرف الـ follicular: الـ biology والـ course والعلاج"
      - "تعرف الـ DLBCL: الـ histology والـ prognosis والـ R-CHOP"
    status: unverified
    steps:
      - kind: explain
        page: 204
        quote: "This is the most common form of indolent NHL and is associated with t (14;18) translocation and constitutive BCL-2 expression"
        title: "Follicular: السلحفاة"
        text: |
          ==Follicular lymphoma== أشهر **indolent NHL** (low-grade).

          - **t(14;18)** و **BCL-2** شغّال على طول في معظم الحالات.
          - Middle-aged أو elderly.
          - **Benign course لسنين (حوالي 10)** مع painless lymphadenopathy.
          - Histology: follicular pattern من ==small cleaved B cells==.
      - kind: explain
        page: 204
        quote: "The majority of patients will have stage III or IV disease. However, sudden transformation may occur to aggressive diffuse tumours"
        title: "المفارقة"
        text: |
          معظمهم بييجوا ==stage III أو IV==، ومع ذلك بيعيشوا سنين.

          الخطر الحقيقي: **sudden transformation** لـ **aggressive diffuse tumour**، وأحيانًا مع leukaemic phase.
      - kind: aside
        tone: analogy
        page: 204
        quote: "The disease is characterized by a benign course for many years (around 10 years) presenting with painless lymphadenopathy"
        text: "الـ follicular زي السلحفاة (benign course، painless lymphadenopathy لسنين): منتشرة في كل حتة (stage IV) بس ماشية براحة. الـ BCL-2 بيخلّي الخلايا ماتموتش، مش إنها تجري. والـ transformation هو لما السلحفاة تقلب أرنب."
      - kind: explain
        page: 204
        quote: "Treatment is usually with single oral agents i.e. Chlorambucil or Cyclophosphamide, Vincristine and Predisolone (CVP) combination."
        title: "علاج الـ follicular في الكتاب"
        text: |
          - **Single oral agent**: chlorambucil.
          - أو ==CVP==: cyclophosphamide، vincristine، prednisolone.
          - **Fludarabine** لوحده أو مع cyclophosphamide أو mitoxantrone.
          - ==Rituximab (anti-CD20)== لوحده أو مع الـ chemo.
      - kind: update
        page: 204
        quote: "Rituximab (Anti CD20) is also effective alone or in combination with chemotherapy."
        text: "دلوقتي الـ advanced symptomatic أو الـ high-burden بياخد غالبًا rituximab (anti-CD20) + chemo، زي bendamustine أو CHOP، والـ low-burden ممكن watch and wait. في الامتحان: إجابة الكتاب."
        ref: "ESMO Clinical Practice Guidelines for follicular lymphoma 2021"
      - kind: explain
        page: 205
        quote: "It is aggressive but potentially curable. Histologically, the disorder is characterized by the presence of Large cells of B-cell origin (centroblasts or immunoblasts)."
        title: "DLBCL: الأرنب"
        text: |
          ==Diffuse large B-cell lymphoma==: rapidly progressive، **high-grade**.

          - **Aggressive but potentially curable**.
          - Large B cells: **centroblasts أو immunoblasts**.
          - **3q27 translocation** مع **BCL-6** overexpression = prognosis أحسن نسبيًا.
          - الـ **DNA microarray** بيدي prognostic information.
      - kind: explain
        page: 206
        quote: "Patients may present with night sweats, fever, weight loss and lymphadenopathy or with extranodal involved sites such as GIT, testis, brain or bone."
        title: "مين وإزاي؟"
        text: |
          - كل الأعمار، بس أكتر مع الكبر. ==One-third== من كل الـ lymphomas.
          - B symptoms و lymphadenopathy، أو **extranodal**: GIT، testis، brain، bone.
      - kind: mnemonic
        page: 206
        quote: "Cyclophosphamide, Doxorubicin (Hydroxydaunorubicin) Vincristine (Oncovin) and Predisolone (CHOP)."
        word: "CHOP"
        parts:
          - { key: "C", text: "Cyclophosphamide" }
          - { key: "H", text: "Hydroxydaunorubicin (doxorubicin)" }
          - { key: "O", text: "Oncovin (vincristine)" }
          - { key: "P", text: "Prednisolone" }
        hook: "R-CHOP: الـ R (rituximab) جه يقطّع (chop) الـ CD20. كل 3 أسابيع، 6 أو 8 courses."
      - kind: explain
        page: 206
        quote: "Recently, the addition of CD20 antibody (Rituximab) to CHOP has improved survival rates."
        title: "العلاج"
        text: |
          - ==CHOP== الـ gold standard للـ large B-cell lymphoma.
          - إضافة ==rituximab== حسّنت الـ survival.
          - **كل 3 أسابيع، 6 أو 8 courses**.
          - **Radiotherapy** للـ bulky أو residual masses بعد الـ chemo.
      - kind: update
        page: 206
        quote: "This CHOP combination has been considered the gold standard regimen for Large B-cell Lymphoma."
        text: "بعد تجربة POLARIX، Pola-R-CHP (polatuzumab بدل vincristine) option للـ intermediate-high risk DLBCL. في الامتحان: R-CHOP."
        ref: "NCCN Guidelines B-cell lymphomas 2024"
      - kind: sort
        page: 204
        quote: "Low-grade non-Hodgkin‘s Lymphoma (Indolent Lymphoma). This is the most common form of indolent NHL"
