  - id: res.L03.lesson4
    title: "PICOT: السؤال في خمس حروف"
    hook: "مين، عملت فيهم إيه، قارنت بإيه، قست إيه، وفي قد إيه؟ لو جاوبت دول، سؤالك جاهز."
    minutes: 9
    pages: [21, 44]
    topics: [pico, finer, narrowing]
    goals:
      - "تفكّ أي سؤال لـ P و I و C و O و T"
      - "تعرف إن الـ C هو العنصر الوحيد الاختياري"
      - "تعرف السؤال الوحش من أول قراية"
    status: unverified
    steps:
      - kind: explain
        page: 36
        quote: "A well-built research question should include four elements; referred to as PICO"
        title: "FINER للسؤال كله، و PICO لجسمه"
        text: |
          الـ FINER بتحكم على **the question in general**. أما الـ ==PICO== فهي الـ **elements** اللي لازم تكون جوه أي **well-built** clinical question.

          ولما تضيف الوقت تبقى **PICOT**.
      - kind: mnemonic
        page: 39
        quote: "What is the appropriate follow-up time to assess outcome"
        word: "PICOT"
        parts:
          - { key: "P", text: "Population/patients: what specific patient population? (age, gender, disease status)" }
          - { key: "I", text: "Intervention/exposure: test, treatment, adjunctive therapy, medication" }
          - { key: "C", text: "Comparison: standard of care or placebo (the only optional one)" }
          - { key: "O", text: "Outcome: what you intend to accomplish, measure, improve or affect" }
          - { key: "T", text: "Time: the follow-up time to assess the outcome" }
        hook: |
          اقرأها "**بيكوت**": زي البسكوت اللي بتاكله في النبطشية. خمس حروف، وكل حرف سؤال.
      - kind: explain
        page: 37
        quote: "such as age, gender, disease status, or any other patient-"
        title: "P و I"
        text: |
          - **P** هي أول خطوة: مين المرضى؟ تقدر توصفهم بالـ **age** والـ **gender** والـ **disease status**، أو أي صفة تانية.
          - **I** تاني خطوة: الـ ==exposure== اللي هتدرسه: **diagnostic test, treatment, adjunctive therapy, medication**.

          ملاحظة: في الدراسات اللي مش تجريبية الـ I بتبقى exposure (زي التدخين)، مش علاج إنت بتديه.
      - kind: aside
        tone: exam
        page: 38
        quote: "The comparison component is the only optional one in the PICO question"
        text: |
          ==C is the only optional element==. الباحث ممكن يدرس الـ intervention لوحده لسببين: **no interest in comparison** أو **lack of a comparable group**.

          الـ C لما يكون موجود بيبقى **standard of care** أو **placebo**.
      - kind: explain
        page: 38
        quote: "Outcome to be measured as a result of the intervention"
        title: "O و T"
        text: |
          - **O** هو ==the evaluation of the intervention's effect==: cure، level of control of a disease، efficacy of a medication or a diagnostic test.
          - **T** هو الـ **appropriate follow-up time** اللي تقيس فيه الـ outcome.
      - kind: figure
        page: 40
        quote: "Single-modal treatment {e.g. epidural alone)"
        title: "مثال المحاضرة مفكوك"
        alt: "Five stacked rows labelled P, I, C, O, T with the lecture's analgesia example: adult patients after elective surgery; multimodal analgesia (epidural plus acetaminophen and NSAIDs); single-modal (epidural alone); pain score, nausea or vomiting; over 24 hours after surgery."
        caption: "السؤال الكامل: In adult patients undergoing elective surgery, does multimodal analgesia compared with epidural alone lead to better pain scores and fewer side effects over 24 hours"
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="5" width="44" height="56" rx="6" class="fg-acc"/>
            <text x="27" y="40" text-anchor="middle" class="t-lg t-b">P</text>
            <rect x="55" y="5" width="270" height="56" rx="6" class="fg-box"/>
            <text x="65" y="28" class="t-sm t-b">Adult patients</text>
            <text x="65" y="47" class="t-sm t-mut">undergoing elective surgery</text>
            <rect x="5" y="69" width="44" height="56" rx="6" class="fg-acc"/>
            <text x="27" y="104" text-anchor="middle" class="t-lg t-b">I</text>
            <rect x="55" y="69" width="270" height="56" rx="6" class="fg-box"/>
            <text x="65" y="92" class="t-sm t-b">Multimodal analgesia</text>
            <text x="65" y="111" class="t-sm t-mut">epidural + acetaminophen + NSAIDs</text>
            <rect x="5" y="133" width="44" height="56" rx="6" class="fg-thin"/>
            <text x="27" y="168" text-anchor="middle" class="t-lg t-b">C</text>
            <rect x="55" y="133" width="270" height="56" rx="6" class="fg-box"/>
            <text x="65" y="156" class="t-sm t-b">Single-modal: epidural alone</text>
            <text x="65" y="175" class="t-sm t-mut">optional element</text>
            <rect x="5" y="197" width="44" height="56" rx="6" class="fg-acc"/>
            <text x="27" y="232" text-anchor="middle" class="t-lg t-b">O</text>
            <rect x="55" y="197" width="270" height="56" rx="6" class="fg-box"/>
            <text x="65" y="220" class="t-sm t-b">Pain score</text>
            <text x="65" y="239" class="t-sm t-mut">and nausea or vomiting</text>
            <rect x="5" y="261" width="44" height="56" rx="6" class="fg-acc"/>
            <text x="27" y="296" text-anchor="middle" class="t-lg t-b">T</text>
            <rect x="55" y="261" width="270" height="56" rx="6" class="fg-box"/>
            <text x="65" y="284" class="t-sm t-b">Over 24 hours</text>
            <text x="65" y="303" class="t-sm t-mut">following surgery</text>
          </svg>
      - kind: match
        page: 21
        quote: "I = Cigarette smoking C = No smoking"
        prompt: "مثال تاني من المحاضرة عن التدخين وسرطان الثدي. وصّل كل حرف بقيمته."
        pairs:
          - ["P", "Women older than 35"]
          - ["I", "Cigarette smoking"]
          - ["C", "No smoking"]
          - ["O", "Breast cancer"]
        why: "والسؤال: Does smoking among women older than 35 years affect breast cancer risk compared to non-smokers?"
      - kind: case
        page: 39
        quote: "What is the appropriate follow-up time to assess outcome"
        stem: "في عيادة الكبد في المنصورة: \"In adults with compensated HCV cirrhosis, does daily coffee compared with no coffee lower the rate of decompensation over 3 years?\""
        steps:
          - question: "What is the I?"
            options: ["Daily coffee", "No coffee", "Decompensation", "Adults with compensated HCV cirrhosis"]
            answer: 0
            why: "الـ I هو الـ exposure اللي بتدرسه: القهوة اليومية."
          - question: "What is the C?"
            options: ["No coffee", "Daily coffee", "3 years", "Decompensation"]
            answer: 0
            why: "الـ C هو البديل اللي بتقارن بيه."
          - question: "And the T?"
            options: ["Over 3 years", "Compensated", "Daily", "Adults"]
            answer: 0
            why: "الـ T هو الـ follow-up time: 3 سنين."
      - kind: explain
        page: 41
        quote: "Vagueness of the research question."
        title: "السؤال الوحش شكله إيه؟"
        text: |
          المحاضرة بتعدّ criteria للـ **bad research question**:

          - ==Vagueness==.
          - **Too broad** to reach conclusive results.
          - **Fails to reveal the relevance** of the topic.
          - **Logistic** problems: الوقت، **high cost with limited funding**، نقص الـ expertise أو الأجهزة أو المعلومات.
          - محدود بـ **ethical considerations** أو محتاج **authorities' approval**.

          والخلاصة: السؤال لازم يبقى **specific, concrete, measurable**.
      - kind: check
        page: 43
        quote: "will 30 minutes of moderate activity daily reduce hypertension in office workers"
        question: "(1) \"Will 30 minutes of activity improve blood pressure?\" (2) \"Will 30 minutes of moderate activity daily reduce hypertension in office workers?\" Which one specifies the population?"
        options:
          - "Question 2"
          - "Question 1"
          - "Both"
          - "Neither"
        answer: 0
        why:
          - "صح: **office workers**. والمحاضرة بتقول كمان إن 2 هو الـ specific."
          - "سؤال 1 vague و broad ومفيهوش ناس خالص."
          - "سؤال 1 مالوش population."
          - "سؤال 2 فيه population واضحة."
      - kind: check
        page: 44
        quote: "It is too broad to reach conclusive results"
        question: "\"Will good environment improve health?\" What is its main problem?"
        options:
          - "Too broad to reach conclusive results, and no population"
          - "It is unethical"
          - "It is not interesting"
          - "It needs a placebo"
        answer: 0
        why:
          - "صح: لا specific ولا measurable، **too broad**، ومفيش population."
          - "مفيش فيه حاجة غير أخلاقية."
          - "الموضوع مهم، بس السؤال مش قابل للقياس."
          - "الـ C اختياري أصلًا، ومش هي المشكلة."
      - kind: try
        items: [res.L03.052, res.L03.056, res.L03.058, res.L03.046]
    recap:
      - "FINER للسؤال عمومًا، PICO(T) لعناصره."
      - "P = population، I = intervention/exposure، C = comparison (اختياري)، O = outcome، T = follow-up time."
      - "الـ C هو العنصر الوحيد الـ optional: no interest in comparison أو no comparable group."
      - "السؤال الوحش: vague، too broad، مش relevant، logistic limits، ethical limits."
      - "السؤال الكويس: specific، concrete، measurable."
    practice: [res.L03.033, res.L03.045, res.L03.046, res.L03.047, res.L03.048, res.L03.049, res.L03.052, res.L03.053, res.L03.054, res.L03.055, res.L03.056, res.L03.057, res.L03.058, res.L03.059, res.L03.060]
