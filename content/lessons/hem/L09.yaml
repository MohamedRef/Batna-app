      - kind: explain
        page: 144
        title: "مين بيليّف النخاع؟"
        quote: "Primary myelofibrosis is a clonal MPN of the pluripotent hematopoietic stem cell, in which progressive bone marrow fibrosis is thought to be secondary to the release of pro-inflammatory cytokines from abnormal clonal cells (primarily megakaryocytes), which stimulate fibroblast proliferation and fibrosis.\nHigher levels of TPO were associated with increased megakaryocyte numbers and rapid progression to myelofibrosis.\nIncreased expression of cytokines such as transforming growth factor β-1 (TGFβ-1), platelet derived growth factor (PDGF) vascular endothelial growth factor (VEGF) in the BM lead to development of myelofibrosis."
        text: |
          الـ PMF **clonal MPN of the pluripotent hematopoietic stem cell**. بس التليف نفسه مش من الـ clone مباشرة:
          - الـ **abnormal clonal cells**، وأهمهم ==megakaryocytes==، بيطلّعوا **pro-inflammatory cytokines**.
          - الـ cytokines دي بتنشّط الـ **fibroblasts** (العادية، مش من الـ clone) تتكاثر وتعمل ألياف.
          - الأسماء: **TGFβ-1**، **PDGF**، **VEGF**.

          التفسير المقبول (مش في الكتاب) لكل واحد: الـ **TGFβ-1** بيخلّي الـ fibroblast يعمل **collagen**، والـ **PDGF** بيخلّيه **يتكاثر**، والـ **VEGF** بيعمل **أوعية جديدة** في النخاع. التلاتة مع بعض = نخاع ليفي مليان أوعية.

          ودي حاجة بتشرح ليه الـ ==TPO== العالي خطير: أي حاجة بتكتّر الـ megakaryocytes بتكتّر الـ cytokines.
      - kind: reveal
        page: 144
        quote: "Higher levels of TPO were associated with increased megakaryocyte numbers and rapid progression to myelofibrosis."
        prompt: "ليه الـ TPO العالي بيسرّع التليف؟"
        answer: |
          الـ **TPO** بيكتّر الـ **megakaryocytes**، والـ megakaryocytes هي مصنع الـ **TGFβ-1 و PDGF و VEGF**.

          يعني megakaryocytes أكتر = cytokines أكتر = ==rapid progression to myelofibrosis==.
      - kind: table
        page: 145
        quote: "WHO criteria for PMF in advanced stage\n  Major criteria:\n    1. Presence of megakaryocytic proliferation and atypia, usually accompanied by either reticulin and/or collagen fibrosis grades 2 or 3\n    2. Not meeting WHO criteria for ET, PV, BCR-ABL1+ CML, myelodysplastic syndromes, or other myeloid neoplasms\n    3. Presence of JAK2, CALR or MPL mutation or in the absence of these mutations, presence of an other clonal marker* or absence of reactive myelofibrosis**\n* in the absence of any of the 3 major clonal mutations, the search for the most frequent accompanying mutations (ASXL1, EZH2, TET2, IDH1/IDH2, SRSF2, SF3B1) are of help in determining the clonal nature of the disease.\n** bone marrow fibrosis secondary to infection, autoimmune disorder or other chronic inflammatory condition, hairy cell leukemia or other lymphoid neoplasm, metastatic malignancy, or toxic (chronic) myelopathies."
        title: "WHO major criteria: overt PMF"
        columns: [Major, Content]
        rows:
          - ["1", "Megakaryocytic proliferation and atypia + reticulin/collagen fibrosis grade 2–3"]
          - ["2", "Not ET, PV, BCR-ABL1+ CML, MDS or other myeloid neoplasm"]
          - ["3", "JAK2, CALR or MPL; or another clonal marker (ASXL1, EZH2, TET2, IDH1/2, SRSF2, SF3B1); or no reactive fibrosis"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 145
        title: "التلات major بيستبعدوا إيه؟"
        quote: "Presence of JAK2, CALR or MPL mutation or in the absence of these mutations, presence of an other clonal marker* or absence of reactive myelofibrosis**\n* in the absence of any of the 3 major clonal mutations, the search for the most frequent accompanying mutations (ASXL1, EZH2, TET2, IDH1/IDH2, SRSF2, SF3B1) are of help in determining the clonal nature of the disease.\n** bone marrow fibrosis secondary to infection, autoimmune disorder or other chronic inflammatory condition, hairy cell leukemia or other lymphoid neoplasm, metastatic malignancy, or toxic (chronic) myelopathies."
        text: |
          - **Major 1** (megakaryocytic **proliferation and atypia** + fibrosis grade **2–3**): ده **شكل المرض** في النخاع. الـ atypia هي اللي بتفرّق megakaryocytes الـ PMF عن الـ megakaryocytes الكبار الـ mature بتوع الـ ET.
          - **Major 2** (مش ET ولا PV ولا CML ولا MDS): لأن كلهم ممكن يتليّفوا. والـ **CML** بالذات بتتليّف، وعلاجها مختلف.
          - **Major 3** (طفرة أو clonal marker تاني): يثبت إن التليف **clonal**. لو مفيش ولا JAK2 ولا CALR ولا MPL، دوّر على الطفرات المرافقة: **ASXL1، EZH2، TET2، IDH1/2، SRSF2، SF3B1**.

          وإلا لازم تثبت ==absence of reactive myelofibrosis==: infection، autoimmune، chronic inflammation، **hairy cell leukemia** أو lymphoid neoplasm، **metastatic malignancy**، أو toxic myelopathy. ليه؟ لأن التليف **رد فعل عام** للنخاع على أي أذى، مش علامة خاصة بالـ PMF.
      - kind: mnemonic
        page: 146
        quote: "WHO criteria for PMF in advanced stage\n  Minor criteria:\n    Presence of at least one of the following, confirmed in two consecutive determinations:\n      a. Anemia not attributed to a comorbid condition\n      b. Leukocytosis >11K/uL\n      c. Palpable splenomegaly\n      d. LDH increased to above upper normal limit of institutional reference range\n      e. Leukoerythroblastosis\nDiagnosis of overt PMF requires meeting all three major criteria, and minor criteria."
        word: "PALLL"
        parts:
          - { key: "P", text: "Palpable splenomegaly" }
          - { key: "A", text: "Anemia not due to a comorbid condition" }
          - { key: "L", text: "Leukocytosis >11 × 10⁹/L" }
          - { key: "L", text: "LDH above the upper normal limit" }
          - { key: "L", text: "Leukoerythroblastosis" }
        hook: "**PAL** مع تلات **L**: الـ minor criteria الخمسة. التشخيص = **3 major + واحد منهم على الأقل**، متأكد منه في **two consecutive determinations**."
      - kind: figure
