    src: { page: 130, quote: "E1a. Functional gallbladder disorder\nDiagnostic criteria* Must include both of the following:\n  1. Criteria for biliary pain*\n  2. Absence of gallstones or other structural pathology\nSupportive criteria\n  1. Low ejection fraction on gallbladder scintigraphy\n  2. Normal liver enzymes, conjugated bilirubin, and amylase/lipase\n*Criteria for biliary pain: Pain located in the epigastrium and/or right upper quadrant and all of the following: 1. Builds up to a steady level and lasts 30 minutes or longer 2. Occurring at different intervals (not daily) 3. Severe enough to interrupt daily activities or lead to an emergency department visit 4. Not significantly (<20%) related to bowel movements 5. Not significantly (<20%) relieved by postural change or acid suppression" }
