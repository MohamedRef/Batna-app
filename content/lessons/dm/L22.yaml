  - id: dm.L22.lesson2
    title: "ESC 2023: صنّف، حدد الـ target، واختار الجرعة"
    hook: "3 أسئلة بس: خطره قد إيه؟ الـ LDL لازم يوصل لكام؟ ومحتاج ينزل كام في المية؟"
    minutes: 9
    pages: [274, 276]
    topics: [case, esc, intensity]
    goals:
      - "تصنّف عيان السكر بالـ SCORE2-Diabetes"
      - "تحفظ الـ LDL targets"
      - "تختار العلاج من جدول الـ intensity"
    status: unverified
    steps:
      - kind: explain
        page: 274
        title: "التصنيف (ESC 2023)"
        quote: "Table 7: Cardiovascular risk categories in type 2 diabetes\n| Risk category | Patients with T2DM |\n|---|---|\n| Very high CV risk | Clinically established ASCVD or Severe TOD or 10-year CVD risk ≥20% using SCORE2-Diabetes |\n| High CV risk | Not fulfilling the very high-risk criteria and a 10-year CVD risk 10 to <20% using SCORE2-Diabetes |\n| Moderate CV risk | Not fulfilling the very high-risk criteria and a 10-year CVD risk 5 to <10% using SCORE2-Diabetes |\n| Low CV risk | Not fulfilling the very high-risk criteria and a 10-year CVD risk <5% using SCORE2-Diabetes |\nEuropean Heart Journal (2023) 44, 4043–4140 (2023 ESC Guidelines for the management of cardiovascular disease in patients with diabetes)"
        text: |
          - ==Very high==: **Atherosclerotic cardiovascular disease (ASCVD)** واضح، أو **severe target-organ damage**، أو 10-year risk **≥ 20%** بالـ **SCORE2-Diabetes**.
          - **High**: 10 لـ أقل من 20%.
          - **Moderate**: 5 لـ أقل من 10%.
          - **Low**: أقل من 5%.
      - kind: figure
        page: 275
        quote: "| Risk | LDL-C target |\n|---|---|\n| Very high risk | LDL-C <1.4 mmol/L (<55 mg/dL) (Class I) |\n| High risk | LDL-C <1.8 mmol/L (<70 mg/dL) (Class I) |\n| Moderate risk | LDL-C <2.6 mmol/L (<100 mg/dL) (Class I) |"
        title: "سلم الخطر والـ target"
        alt: "A vertical ladder of four risk bands from top to bottom: very high (ASCVD, severe organ damage or 10-year risk at least 20 percent) with LDL-C target under 55 mg/dL; high (10 to under 20 percent) with target under 70; moderate (5 to under 10 percent) with target under 100; low (under 5 percent)."
        caption: "كل ما الخطر يعلى، الـ ==LDL target== ينزل: **55 ← 70 ← 100**."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="200" height="54" rx="8" class="fg-bad"/>
            <text x="20" y="32" class="t-b">Very high</text>
