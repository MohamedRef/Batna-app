        quote: "Ulcerative (most common) Exophytic (polypoid, fungating) Annular (classic applecore) Submucosal infiltrative(linnitus type)."
        title: "الشكل"
        text: |
          أكتر من 90% **adenocarcinomas**، وليها 4 أشكال:

          - ==Ulcerative== (الأشهر).
          - **Exophytic** (polypoid، fungating).
          - **Annular**: الـ apple-core الكلاسيكي في الأشعة.
          - **Submucosal infiltrative** (linitis type).
      - kind: explain
        page: 175
        quote: "Annular (classic applecore)"
        title: "الأشكال الأربعة: ليه تفرق؟"
        text: |
          الكتاب: أكتر من 90% adenocarcinomas، وأشكالها: ==ulcerative (الأشهر)==، **exophytic** (polypoid، fungating)، **annular** (الـ apple-core الكلاسيكي)، و **submucosal infiltrative** (linitis type).

          التفسير المقبول (مش في الكتاب): الشكل بيقولك على الأعراض: الـ **ulcerative** والـ **exophytic** بينزفوا، فبيعملوا أنيميا. الـ **annular** بيلف حوالين القولون كله فبيضيّقه، والأشعة بتبين «قلب تفاحة متاكلة» (apple-core)، وده اللي بيعمل الانسداد في الشمال. والـ **infiltrative** زي الـ linitis في المعدة: ممكن الـ mucosa تبان سليمة، فخلي بالك من الـ biopsy السطحية.
