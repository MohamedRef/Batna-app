lessons:
  # ------------------------------------------------------------------
  - id: git.L06.lesson1
    title: "الـ IBD: مناعة زعلانة من بكتيريا صاحبتها"
    hook: "بكتيريا عايشة معانا من زمان وفجأة المناعة قررت تتخانق معاها: دي حكاية الـ IBD."
    minutes: 9
    pages: [206, 208]
    topics: [epidemiology, etiology]
    goals:
      - "تعرّف الـ inflammatory bowel disease (IBD) والنوعين بتوعه"
      - "تحفظ أرقام الـ incidence والسن من غير لخبطة"
      - "تفهم ليه السجاير بتأذي الـ Crohn وبتحمي من الـ ulcerative colitis (UC)"
    status: unverified
    steps:
      - kind: explain
        page: 206
        title: "يعني إيه IBD؟"
        quote: "Inflammatory Bowel Disease is a chronic inflammatory condition of the intestines that is marked by remission and relapses and distills clinically into one of two major subtypes of disease: UC and CD."
        text: |
          الـ ==Inflammatory Bowel Disease== هو **chronic inflammatory condition** في الأمعاء، ماشي بنظام **remission and relapses**: يهدى شوية ويرجع يولّع.

          وبيتقسم لنوعين كبار:
          - **Ulcerative colitis (UC)**
          - **Crohn disease (CD)**

          الاتنين أصلهم واحد: **dysregulated mucosal immune response** ضد مكونات الـ **normal commensal microbiota**، يعني البكتيريا الطبيعية اللي الناس السليمة عايشة معاها في سلام.
      - kind: aside
        tone: analogy
        page: 206
        quote: "Both diseases have a general commonality in their pathogenesis and are derived from a dysregulated mucosal immune response to antigenic components of the normal commensal microbiota that reside within the intestine."
        text: |
          تخيّل عمارة فيها بوّاب (المناعة) والسكان الطيبين (الـ **commensal bacteria**). البوّاب الطبيعي بيعدّيهم كل يوم عادي.

          في الـ inflammatory bowel disease (IBD) البوّاب اتلخبط وبقى يمسك كل ساكن على الباب ويعمل له محضر. الساكن ما عملش حاجة، بس الخناقة نفسها هي اللي بتبوّظ مدخل العمارة (الـ mucosa).
      - kind: table
        page: 206
        quote: "The incidence of ulcerative colitis in North America is estimated to be 8– 15 per 100,000 persons, with a prevalence of 170–230 per 100,000. Crohn disease has an estimated incidence of 5–15 per 100,000 and prevalence of 140– 200 per 100,000. An increased incidence and prevalence of both forms of IBD is found in developed nations, northern locale (at least within the northern hemisphere), and urban Environments; among Caucasians; and among persons of Jewish ethnicity."
        title: "الأرقام في North America (لكل 100,000)"
        columns: ["", Incidence, Prevalence]
        rows:
          - [Ulcerative colitis, "8–15", "170–230"]
          - [Crohn disease, "5–15", "140–200"]
        hide: [[0, 1], [0, 2], [1, 2]]
      - kind: explain
        remind: [git.L06.005]
        page: 206
        title: "مين بيجيله أكتر؟"
        quote: "The incidence of ulcerative colitis in North America is estimated to be 8– 15 per 100,000 persons, with a prevalence of 170–230 per 100,000. Crohn disease has an estimated incidence of 5–15 per 100,000 and prevalence of 140– 200 per 100,000. An increased incidence and prevalence of both forms of IBD is found in developed nations, northern locale (at least within the northern hemisphere), and urban Environments; among Caucasians; and among persons of Jewish ethnicity."
        text: |
          الـ IBD أكتر في:
          - **developed nations**
          - **northern locale** (في نص الكرة الشمالي)
          - **urban environments**
          - **Caucasians**
          - **Jewish ethnicity**

          وفي الدول الصناعية الـ **Crohn** زاد جامد في آخر نص قرن، والـ **UC** فضل ثابت تقريبًا. أما في الدول النامية فالاتنين زادوا **dramatically**.

          التفسير المقبول (مش في الكتاب): ليه الشمال والمدن والأغنيا؟ الخيط المشترك هو نمط الحياة اللي بيغيّر بكتيريا الأمعاء (أكل مصنّع، مضادات حيوية، نضافة زيادة)، والـ Jewish ethnicity بتضيف عامل جيني فوق كده.
      - kind: reveal
        page: 207
        quote: "In developing countries, the incidence of both forms of IBD has dramatically risen."
        prompt: "ليه الـ IBD بيزيد في البلاد اللي بتتحضّر، وفي المدن أكتر من الأرياف؟"
        answer: |
          الكتاب: الـ IBD أكتر في الـ **developed nations** والـ **urban environments**، وفي الدول الصناعية الـ Crohn زاد جامد في آخر نص قرن، و ==في الدول النامية الاتنين زادوا dramatically==.

          التفسير المقبول (مش في الكتاب): المرض أصله خناقة بين المناعة والبكتيريا اللي في الأمعاء. نمط حياة المدينة (أكل مصنّع، مضادات حيوية كتير، نضافة زيادة في الطفولة، ولادة قيصرية) بيغيّر البكتيريا دي وبيقلل تدريب المناعة عليها بدري. فلما الجينات تبقى مستعدة، البيئة الجديدة بتشغّل المرض. وده بيفسّر ليه الزيادة بتمشي ورا «التحضّر» بالظبط، وليه بنشوف حالات أكتر في مصر دلوقتي من زمان.
      - kind: check
        page: 207
        quote: "IBD typically presents at a relatively young age, often in adolescence. The median age of diagnosis for Crohn disease and ulcerative colitis is the third and fourth decades of life, respectively. Studies have suggested a second, smaller peak in incidence of IBD in the sixth and seventh decades, although this association is clearer for ulcerative colitis than for Crohn's disease."
        question: "Median age at diagnosis of Crohn disease and UC, per the book?"
        options:
          - "Crohn: third decade; UC: fourth decade"
          - "Crohn: fourth decade; UC: third decade"
          - "Both in the sixth decade"
          - "Both in childhood"
        answer: 0
        why:
          - "صح: الكتاب بيقول **third and fourth decades, respectively**. والـ Crohn أصغر، زي ما هو أشقى."
          - "معكوسة: الـ Crohn هو اللي في العقد التالت."
          - "العقد السادس والسابع ده **second smaller peak**، وأوضح في الـ UC."
          - "بيبدأ بدري (adolescence) بس الـ median مش في الطفولة."
      - kind: explain
        page: 207
        title: "السبب: تلات حاجات مع بعض"
        quote: "The cause of IBD remains elusive, although interplay of genetic, microbial, and immunologic factors clearly exists."
        text: |
          السبب لسه **elusive**، بس فيه تفاعل بين تلاتة:

          - **Genetic:** في الـ Crohn فيه ==nucleotide-binding oligomerization domain 2 (NOD2)/CARD15== على **chromosome 16** و **interleukin-23 receptor gene (IL23R)** على **chromosome 1**. الاتنين ليهم دور في تنظيم المناعة في الأمعاء، بس الـ mutations دي موجودة في **minority** بس من العيانين.
          - **Microbial:** تجارب الحيوانات بيّنت إن وجود الـ commensal bacteria **necessary** علشان الـ IBD يحصل.
          - **Immune:** هنشوفها كمان شوية.
      - kind: figure
        page: 207
        quote: "Microbial and environmental factors: Animal studies have demonstrated that the presence of commensal gut bacteria is necessary for IBD to occur. In theory, the subsequent enteritis or colitis results from a dysregulated or inappropriate immune response to flora tolerated by healthy individuals. Other environmental factors appear important as well. Cigarette smoking increases the risk for Crohn disease but is protective for ulcerative colitis. Both oral contraceptive and nonsteroidal anti-inflammatory medications have been implicated as risk factors for IBD. Appendectomy may protect against the UC."
        title: "الـ environment: مين بيزوّد ومين بيحمي"
        alt: "Two columns. Left, red: factors that raise risk: smoking for Crohn, oral contraceptives and NSAIDs for IBD. Right, green: protective factors for UC: smoking and appendectomy."
        caption: "السجاير هي الحاجة الوحيدة اللي في العمودين: بتزوّد الـ **Crohn** وبتحمي من الـ **UC**. وده مش مبرر تشرب سجاير طبعًا."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="5" width="155" height="240" rx="8" class="fg-bad"/>
            <rect x="170" y="5" width="155" height="240" rx="8" class="fg-good"/>
            <text x="82" y="30" text-anchor="middle" class="t-b t-bad">Raise risk</text>
            <text x="247" y="30" text-anchor="middle" class="t-b t-good">Protect (UC)</text>
            <rect x="15" y="50" width="135" height="50" rx="6" class="fg-box"/>
            <text x="82" y="72" text-anchor="middle" class="t-b">Smoking</text>
            <text x="82" y="90" text-anchor="middle" class="t-sm t-mut">Crohn disease</text>
            <rect x="15" y="112" width="135" height="50" rx="6" class="fg-box"/>
            <text x="82" y="134" text-anchor="middle" class="t-b">Oral contraceptives</text>
            <text x="82" y="152" text-anchor="middle" class="t-sm t-mut">IBD</text>
            <rect x="15" y="174" width="135" height="50" rx="6" class="fg-box"/>
            <text x="82" y="196" text-anchor="middle" class="t-b">NSAIDs</text>
            <text x="82" y="214" text-anchor="middle" class="t-sm t-mut">IBD</text>
            <rect x="180" y="50" width="135" height="50" rx="6" class="fg-box"/>
            <text x="247" y="72" text-anchor="middle" class="t-b">Smoking</text>
            <text x="247" y="90" text-anchor="middle" class="t-sm t-mut">Ulcerative colitis</text>
            <rect x="180" y="112" width="135" height="50" rx="6" class="fg-box"/>
            <text x="247" y="134" text-anchor="middle" class="t-b">Appendectomy</text>
            <text x="247" y="152" text-anchor="middle" class="t-sm t-mut">may protect, UC</text>
          </svg>
      - kind: mnemonic
        page: 207
        quote: "Microbial and environmental factors: Animal studies have demonstrated that the presence of commensal gut bacteria is necessary for IBD to occur. In theory, the subsequent enteritis or colitis results from a dysregulated or inappropriate immune response to flora tolerated by healthy individuals. Other environmental factors appear important as well. Cigarette smoking increases the risk for Crohn disease but is protective for ulcerative colitis. Both oral contraceptive and nonsteroidal anti-inflammatory medications have been implicated as risk factors for IBD. Appendectomy may protect against the UC."
        word: "SCAN"
        parts:
          - { key: "S", text: "Smoking: raises Crohn, protects UC" }
          - { key: "C", text: "Contraceptives (oral): risk factor for IBD" }
          - { key: "A", text: "Appendectomy: may protect against UC" }
          - { key: "N", text: "NSAIDs: risk factor for IBD" }
        hook: "قبل ما تعمل **SCAN** للقولون، اسأل عن الأربع حاجات دول في الـ history."
      - kind: explain
        page: 208
        title: "المناعة: Th1 و Th17 ضد Th2"
        quote: "immune response has two major arms: innate (rapid, hard-wired) and adaptive (delayed in onset with memory). IBD is ultimately caused by overproduction of proinflammatory mediators relative to anti-inflammatory mediators, both of which are derived from cells associated with adaptive immunity (T helper [Th] cells) and innate immunity (macrophages and dendritic cells) that excessively infiltrate the intestinal tissues. Although Crohns disease (CD) may preferentially exhibit overactivity of Th1 and Th17 cells, and ulcerative colitis (UC) may exhibit overactivity of Th2 cells, there is significant overlap in the immunopathogenesis of these disorders. Excess production of cytokines derived from innate immune pathways (tumor necrosis factor [TNF] and interleukin-6 [IL-6]) occurs in both CD and UC."
        text: |
          الـ **gut-associated lymphoid tissue (GALT)** طبيعته غريبة: فيه **physiologic inflammation** دايمًا، وبيميل يكبت المناعة (**oral tolerance**)، وبيطلّع **secretory immunoglobulins**.

          الـ IBD في الآخر سببه إن الـ **proinflammatory mediators** بقت أكتر من الـ anti-inflammatory، جاية من خلايا الـ adaptive (T helper) والـ innate (macrophages و dendritic cells).

          - **Crohn:** ==Th1 و Th17==
          - **UC:** **Th2**
          - الاتنين: زيادة **tumor necrosis factor (TNF)** و **IL-6**، مع overlap كبير.

          التفسير المقبول (مش في الكتاب): ليه ده مهم؟ لأن الأدوية الحديثة بتستهدف السيتوكينات دي بالاسم: anti-TNF شغال في الاتنين لأن الـ TNF مشترك، والأدوية اللي بتضرب الـ IL-23 (اللي بيشغّل Th17) أنجح في الـ Crohn.
      - kind: aside
        tone: tip
        page: 208
        quote: "immune response has two major arms: innate (rapid, hard-wired) and adaptive (delayed in onset with memory). IBD is ultimately caused by overproduction of proinflammatory mediators relative to anti-inflammatory mediators, both of which are derived from cells associated with adaptive immunity (T helper [Th] cells) and innate immunity (macrophages and dendritic cells) that excessively infiltrate the intestinal tissues. Although Crohns disease (CD) may preferentially exhibit overactivity of Th1 and Th17 cells, and ulcerative colitis (UC) may exhibit overactivity of Th2 cells, there is significant overlap in the immunopathogenesis of these disorders. Excess production of cytokines derived from innate immune pathways (tumor necrosis factor [TNF] and interleukin-6 [IL-6]) occurs in both CD and UC."
        text: |
          افتكرها كده: **Crohn** فيه حرف **C** زي **Cell-mediated** (Th1). و الـ **UC** فاضل له **Th2**.

          والـ **TNF** مشترك في الاتنين، وده سبب إن نفس الـ anti-TNF بيشتغل فيهم.
      - kind: try
        items: [git.L06.002, git.L06.007, git.L06.010, git.L06.013, git.L06.017]
    recap:
      - "IBD = chronic relapsing inflammation من **dysregulated immune response** للـ commensal bacteria."
      - "UC: incidence 8–15، prevalence 170–230. Crohn: 5–15 و 140–200 (لكل 100,000)."
      - "Crohn العقد التالت، UC الرابع، وفيه peak تاني في 6–7 أوضح في UC. الجنسين زي بعض."
      - "NOD2/CARD15 (chr 16) و IL23R (chr 1) في الـ Crohn، بس في minority."
      - "**SCAN**: Smoking، Contraceptives، Appendectomy، nonsteroidal anti-inflammatory drugs (NSAIDs)."
    practice: [git.L06.001, git.L06.002, git.L06.003, git.L06.004, git.L06.005, git.L06.006, git.L06.007, git.L06.008, git.L06.009, git.L06.010, git.L06.011, git.L06.012, git.L06.013, git.L06.014, git.L06.015, git.L06.016, git.L06.017, git.L06.018, git.L06.019]
