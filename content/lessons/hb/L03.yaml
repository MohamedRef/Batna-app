      - "بعد الـ TIPS: **HE** خلال 2–3 أسابيع (**LADS**). Coated stents أحسن (HE و hemolysis و infection أقل)."
      - "Secondary prophylaxis: NSBB (± IsMN)، **EBL > sclerotherapy**، والـ TIPS كمان."
      - "أسئلة الكتاب: الرباط يتكرر لحد الـ eradication؛ الـ BRTO بيسد الـ shunt فيعلّي الضغط؛ عدد الأعمدة مش predictor؛ الـ GAVE مالهاش دعوة بالضغط."
