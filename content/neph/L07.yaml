  # ---------- p154-156: diagnosis ----------
  - id: neph.L07.057
    kind: enumerate
    topic: adpkd-dx
    prompt: Mention advantages and disadvantages of presymptomatic ADPKD screening.
    points:
      - "If positive: genetic counseling, early detection and treatment of hypertension"
      - "If negative: reassurance"
      - "Disadvantages: insurability and employability"
    pass: 3
    hook: "الاسكرين قبل الأعراض: موجب ← genetic counseling + نلحق الضغط بدري (early detection and treatment of hypertension)؛ سالب ← طمأنينة (reassurance)؛ والعيب «التأمين والشغل» = insurability وemployability."
    src: { page: 154, quote: "Only individuals who have been properly informed about the advantages and disadvantages of screening should be offered presymptomatic screening. If ADPKD is diagnosed, the patient should receive appropriate genetic counseling, and risk factors such as hypertension can be identified and treated early. If ADPKD is absent, the patient can be reassured. Disadvantages of presymptomatic screening relate to insurability and employability. Presymptomatic screening of children is not recommended until more effective therapy for the disease becomes available." }
    status: unverified
  - id: neph.L07.058
    kind: card
    topic: adpkd-dx
    front: Should children at risk of ADPKD be screened?
    back: Not recommended until more effective therapy becomes available.
    src: { page: 154, quote: "Only individuals who have been properly informed about the advantages and disadvantages of screening should be offered presymptomatic screening. If ADPKD is diagnosed, the patient should receive appropriate genetic counseling, and risk factors such as hypertension can be identified and treated early. If ADPKD is absent, the patient can be reassured. Disadvantages of presymptomatic screening relate to insurability and employability. Presymptomatic screening of children is not recommended until more effective therapy for the disease becomes available." }
    status: unverified
  - id: neph.L07.059
    kind: card
    topic: adpkd-dx
    front: Why is ultrasound used for presymptomatic ADPKD testing?
    back: Cost and safety.
    src: { page: 154, quote: "Renal Ultrasound Renal ultrasound is used for presymptomatic testing because of cost and safety. Revised criteria have been proposed to improve the diagnostic performance of ultrasound in ADPKD (Table 44.1). At least three (uni-lateral or bilateral) renal cysts are sufficient for diagnosis of at-risk individuals 15 to 39 years of age; two cysts in each kidney sufficient for diagnosis for ages 40 to 59 years.19 For at-risk individuals age 60 and older, four or more cysts in each kidney is required." }
    status: unverified
