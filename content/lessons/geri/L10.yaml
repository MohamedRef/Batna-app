        text: "الـ nintedanib اتعمله approval للـ progressive pulmonary fibrosis غير الـ IPF (FDA 2020)، والـ guideline بتاعة 2022 بتنصح بيه في الـ PPF. في الامتحان: إجابة الكتاب (لسه مش approved)."
