  - id: geri.L13.lesson4
    title: "شهية، قلق، إمساك، واكتئاب"
    hook: "مريض على morphine ومش بيدخل الحمام من 5 أيام ومش بيقول. ده مش تفصيلة؛ ده ممكن يبقى perforation."
    minutes: 7
    pages: [225, 227]
    topics: [symptoms]
    goals:
      - "تتعامل مع الـ anorexia والـ anxiety"
      - "تكتب bowel regimen صح لأي مريض على opioid"
      - "تشخّص الاكتئاب في المرض المتقدم وتختار الدوا حسب الـ life expectancy"
    status: unverified
    steps:
      - kind: explain
        remind: [geri.L13.031]
        page: 225
        quote: "Assess whether symptom is owing to disease process or secondary to other symptoms (nausea and constipation). Determine if the patient is troubled by symptoms-often families, more than patients, are bothered by anorexia."
        title: "Anorexia/cachexia"
        text: |
          قبل ما تعالج، اسأل سؤالين:
          1. هي من **المرض** ولا من عرض تاني (nausea، constipation)؟
          2. المريض نفسه **متضايق**؟ ساعات ==العيلة== هي اللي متضايقة أكتر.

          الأدوية اللي حسّنت الشهية والـ quality of life (QoL): **corticosteroids**، **megestrol acetate**، **cannabinoids**.

          ليه السؤال التاني مهم؟ التفسير المقبول (مش في الكتاب): لو المريض نفسه مش متضايق، إجباره على الأكل أو إضافة دوا للشهية بيزوّد عبء من غير فايدة. ساعات العلاج الأهم إنك تشرح للعيلة إن قلة الأكل جزء من المرض، مش «إهمال» منهم ولا سبب إنه بيضعف.
      - kind: explain
        page: 225
        quote: "Dexamethasone is advantageous in that it allows once-a-day dosing, has minimal mineralocorticoid properties, and may improve mood and energy."
        title: "Dexamethasone ولا megestrol؟"
        text: |
          - ==Dexamethasone==: مرة في اليوم، mineralocorticoid effect قليل، وممكن يحسّن المزاج والطاقة.
          - **Megestrol**: الأكثر فعالية وأقل أعراض في randomised controlled trials (RCTs) على ==الأصغر سنًا==، **مش الكبار**.

          يعني إيه للكبير؟ الـ trials اللي أثبتت إن megestrol الأحسن كانت على الأصغر سنًا، فالنتيجة دي **ماتنطبقش تلقائيًا** على الكبير. وميزة الـ dexamethasone إن جرعة واحدة في اليوم أسهل على مريض بياخد أدوية كتير.
      - kind: explain
        page: 226
        quote: "Supportive counseling and cautious use of benzodiazepines because of increased risk of delirium in older adults. Selective serotonin reuptake inhibitor (SSRIs) if life expectancy is greater than 2 months."
        title: "Anxiety"
        text: |
          اسأل عن: قلق زيادة، restlessness، agitation، insomnia، hyperventilation، tachycardia.

          العلاج:
          - **Supportive counseling**.
          - Benzodiazepines ==بحذر==، عشان بتزوّد خطر الـ **delirium** في الكبار.
          - **selective serotonin reuptake inhibitor (SSRI)** لو الـ life expectancy أكتر من **شهرين**.

          ليه شرط الشهرين؟ لأن الـ SSRI بياخد **3-4 أسابيع** عشان يشتغل (الكتاب، ص 227). لو الوقت الفاضل أقل، المريض مش هيلحق ياخد فايدته.
      - kind: explain
        page: 226
        quote: "With few exceptions, all patients on opioid therapy need an individualized bowel regimen. When an effective regimen is found, it must be continued for the duration of the opioid therapy. Most patients respond to a stool softener plus a stimulant. If dose escalation of the stimulant proves ineffective, addition of agents from alternate classes may be required.\nStool softeners (ineffective alone and should be combined with other agents):\n  Docusate sodium and calcium docusate\nStimulant laxatives: prune juice, senna, and bisacodyl.\nOsmotic laxative: propylene glycol, milk of magnesia, and magnesium citrate.\nLarge-volume tap water enemas, high colonic enemas, or disimpaction may be needed in cases of severe constipation."
        title: "الإمساك"
        text: |
          لازم تسأل عليه **روتيني** في أي حد على opioid: المرضى ==underreport==، والـ **fecal impaction** والـ **perforation** ممكن يحصلوا بسرعة.

          - تقريبًا **كل** مريض على opioid محتاج bowel regimen، **طول** مدة العلاج.
          - أغلبهم: ==stool softener + stimulant==.
          - الـ softener **لوحده مش بيشتغل**.

          ليه بيقلّلوا في الكلام عنه؟ التفسير المقبول (مش في الكتاب): كتير منهم بيتكسفوا، أو فاكرينه طبيعي مع قلة الأكل والنوم في السرير. عشان كده أنت اللي تسأل.
          وليه الـ softener لوحده مايكفيش؟ التفسير المقبول (مش في الكتاب): الـ opioid بيبطّأ **حركة** الأمعاء نفسها. الـ softener بيليّن البراز بس من غير ما يحرّكه، فلازم stimulant يحرّك. ولو الـ stimulant ماكفاش بعد زيادة الجرعة، ضيف نوع تاني (osmotic).
      - kind: sort
        page: 226
        quote: "With few exceptions, all patients on opioid therapy need an individualized bowel regimen. When an effective regimen is found, it must be continued for the duration of the opioid therapy. Most patients respond to a stool softener plus a stimulant. If dose escalation of the stimulant proves ineffective, addition of agents from alternate classes may be required.\nStool softeners (ineffective alone and should be combined with other agents):\n  Docusate sodium and calcium docusate\nStimulant laxatives: prune juice, senna, and bisacodyl.\nOsmotic laxative: propylene glycol, milk of magnesia, and magnesium citrate.\nLarge-volume tap water enemas, high colonic enemas, or disimpaction may be needed in cases of severe constipation."
