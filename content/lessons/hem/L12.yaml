          - **4%** من كل السرطانات، وبيزيد من السبعينات.
          - بيزيد مع السن؛ M:F **3:2**.
          - الزيادة بس جزء منها من: كبر السن، تحسن التشخيص، الـ **HIV**، والـ **immunosuppressive therapy**.
