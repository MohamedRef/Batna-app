      - kind: explain
        page: 357
        title: "Preeclampsia ولا CKD بيسوء؟"
        quote: "Among women with preeclampsia, the glomerular filtration rate decreases by only 30% to 40%, which causes a small increase in serum creatinine.(14) A prospective observational multicenter study of 157 women admitted with preeclampsia in South Africa showed AKI was common in women with preeclampsia and was associated with higher maternal and perinatal mortality. Of the study cohort, 15.3% met AKI criteria: 6.9% stage 1, 4.3% stage 2, and 4.1% stage 3, and only two-thirds of women with AKI recovered their kidney recovery. Hypertension in a previous pregnancy had a 2.2 fold higher odds of AKI stage 2 or 3.(15) Preeclampsia can be difficult to distinguish from progression of CKD in patients with preexisting kidney disease due to overlapping clinical features. The rate of decline of kidney function, as well as worsening of proteinuria, may prove to be helpful for the diagnosis of preeclampsia. Additionally, maternal serum levels of soluble angiogenic factors soluble fms-like tyrosine kinase-1 and placental growth factor may be utilized to distinguish between preeclampsia and CKD. Rolfo et al showed that women with preeclampsia had a significant increase in soluble fms-like tyrosine kinase- 1 levels, increase in serum levels of placental growth factor , and an increase in soluble fms-like tyrosine kinase-1 to placental growth factor ratio (median 436) as compared to women with CKD (median 4).(16)"
        text: |
          الـ glomerular filtration rate (GFR) في الـ preeclampsia بيقع **30-40%** بس. لكن عند عيانة عندها chronic kidney disease (CKD) قبل الحمل الصورة بتتلخبط.

          الحل: سرعة نزول الكلى، زيادة البروتين، والـ ==sFlt-1/placental growth factor ratio==: الـ median **436** في الـ preeclampsia مقابل **4** في الـ CKD.
      - kind: explain
        page: 358
        title: "HELLP: الـ ATN مش الـ TMA"
        quote: "often multifactorial and, in addition to the kidney changes characteristic of preeclampsia, there is associated coagulopathy, resulting in bleeding and acute tubular necrosis. HELLP syndrome is considered a thrombotic microangiopathy like syndrome due to occurrence of thrombocytopenia, hemolysis, and AKI. Like TTP and HUS, kidney biopsies of women with HELLP syndrome may occasionally display findings of thrombotic microangiopathy, but commonly (14) show manifestations consistent with acute tubular necrosis."
        text: |
          **H**emolysis، **EL**evated liver enzymes، **L**ow **P**latelets.

          - الـ AKI في **3-15%**، و recovery لحد **80%** حتى لو شديد.
          - السبب multifactorial: تغييرات الـ preeclampsia + **coagulopathy** ونزيف و acute tubular necrosis (ATN).
          - شبه thrombotic microangiopathy (TMA)، لكن الـ biopsy غالبًا بيبيّن ==acute tubular necrosis==.
      - kind: explain
        page: 358
        title: "AFLP: الكبد هو اللي بيوقع الكلية"
        quote: "Acute fatty liver of pregnancy Acute fatty liver of pregnancy (AFLP) as a cause of AKI in pregnancy is on the rise. AFLP is diagnosed later in the pregnancy, mostly after 30 weeks. The pathogenesis in 20% of cases of AFLP is secondary to fetal long-chain 3- hydroxyacyl CoA dehydrogenase deficiency which leads to accumulation of fetal free fatty acids that crosses the placenta and results in hepatotoxicity to the mother. Women usually present in the third trimester with nonspecific symptoms of nausea, vomiting, and abdominal pain. Many laboratory findings of AFLP overlap with HELLP syndrome and preeclampsia such as hepatic derangements, but AKI is more common in AFLP, being present in 20–100% of women. AKI in AFLP usually manifests similarly to hepatorenal syndrome, due to presence of liver failure, ascites and peripheral vasodilation. Elevated creatinine has shown to be an independent predictor of maternal mortality in HELLP syndrome. Swanson Criteria, defined by clinical symptoms and laboratory derangements of encephalopathy, hyperbilirubinemia, abdominal ascites, hypoglycemia, and micro vesicular steatosis on liver biopsy, can differentiate AFLP from HELLP syndrome/preeclampsia. Management is expectant delivery, platelet transfusion prior to delivery if platelet count less than 40,000 per microliter, and evaluation for liver transplant in severe cases. (18,19)"
        text: |
          بعد ==30 weeks==. في **20%** السبب إن الجنين عنده **long-chain 3-hydroxyacyl-CoA dehydrogenase (LCHAD) deficiency**: الـ fatty acids بتعدّي المشيمة وتسمم كبد الأم.

          الـ AKI أشيع من HELLP (**20-100%**)، وشكله ==hepatorenal==: liver failure و ascites و vasodilation.

          العلاج: **ولادة**، صفائح لو **<40,000** قبل الولادة، و liver transplant في الحالات الشديدة.
