  - id: endo.L01.lesson1
    title: "MEN: لما الغدد تتفق على بعض"
    hook: "ورم في غدة واحدة صدفة. ورم في غدتين وتلاتة في نفس العيلة؟ ده مش صدفة، ده MEN."
    minutes: 8
    pages: [1, 3]
    topics: [definition, men1-pth]
    goals:
      - "تعرّف الـ MEN وتعرف نوعينه الكبار"
      - "تعدّ مكونات MEN 1 بالـ 3 P's"
      - "تفهم ليه الـ hyperparathyroidism في MEN 1 بيتشال بـ 3.5 غدة"
    status: unverified
    steps:
      - kind: explain
        page: 1
        quote: "(MEN) comprises various genetically determined disorders with a predisposition to tumor development within two or more components of the endocrine system."
        title: "التعريف"
        text: |
          الـ ==multiple endocrine neoplasia (MEN)== هي مجموعة أمراض **genetically determined** عندها استعداد لأورام في **two or more** من غدد الـ endocrine system.

          - في نوعين كبار: **MEN 1** و **MEN 2**.
          - كل نوع له "قايمة غدد" ثابتة، فلو عرفت القايمة تعرف تدوّر فين.

          ليه كلمة **genetically determined** مهمة؟ عشان الخلل موجود في كل خلية من خلايا المريض من يوم ما اتولد، مش في غدة واحدة بس. التفسير المقبول (مش في الكتاب): الجين بيتورث **autosomal dominant**، فكل غدة من القايمة شايلة "ضربة" جاهزة، وأي ضربة تانية في أي خلية فيها تطلّع ورم. علشان كده الأورام **متعددة** وبتيجي في **أكتر من غدة**، وبتلاقيها في أكتر من فرد في العيلة.
      - kind: explain
        page: 1
        quote: "MEN 1 (Wermer's Syndrome)\nThe most common\n  The syndrome becomes clinically manifest in the 4th decade.\n  However biochemical testing is identified by the age of 14 – 18 years.\n  Contents of MEN 1 (Wermer's Syndrome).\n    1- Parathyroid disease.\n    2- Anterior Pituitary Adenomas.\n    3- Entero-pancreatic tumors:\n      Insulinomas.\n      Gastrinomas.\n      Glucagonomas.\n      VIPomas.\n      Somatostatinomas."
        title: "MEN 1 = Wermer"
        text: |
          الـ ==MEN 1== اسمها **Wermer's syndrome**، وهي **the most common**.

          - بتبان clinically في الـ **4th decade** (الأربعينات).
          - بس الـ biochemical testing يكشفها بدري جدًا، من سن **14–18** سنة.

          يعني الأرقام بتعلى في الدم قبل الأعراض بعشرين سنة. علشان كده بنعمل screening للعيلة.
      - kind: figure
        page: 1
        quote: "The most common\n  The syndrome becomes clinically manifest in the 4th decade.\n  However biochemical testing is identified by the age of 14 – 18 years.\n  Contents of MEN 1 (Wermer's Syndrome).\n    1- Parathyroid disease.\n    2- Anterior Pituitary Adenomas.\n    3- Entero-pancreatic tumors:\n      Insulinomas.\n      Gastrinomas.\n      Glucagonomas.\n      VIPomas.\n      Somatostatinomas."
        title: "MEN 1 = تلات P"
        alt: "A simple body outline with three highlighted organs labelled Pituitary at the head, Parathyroid in the neck and Pancreas in the abdomen, each with its frequency: pituitary 15-60 percent, parathyroid about 100 percent, pancreas 30-75 percent."
        caption: "Pituitary فوق، Parathyroid في الرقبة، Pancreas في البطن. الـ parathyroid تقريبًا عند الكل."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <circle cx="90" cy="45" r="32" class="fg-thin"/>
            <rect x="70" y="77" width="40" height="22" class="fg-thin"/>
            <rect x="45" y="99" width="90" height="150" rx="20" class="fg-thin"/>
            <circle cx="90" cy="48" r="9" class="fg-dot-acc"/>
            <rect x="80" y="84" width="20" height="9" rx="3" class="fg-dot-bad"/>
            <path d="M65 175q25-15 50 0" class="fg-acc" stroke-width="8" fill="none"/>
            <path d="M102 48H175" class="fg-arrow"/>
            <path d="M102 88H175" class="fg-arrow"/>
            <path d="M118 172H175" class="fg-arrow"/>
            <text x="180" y="44" class="t-b">Pituitary</text>
            <text x="180" y="60" class="t-sm t-mut">15–60%</text>
            <text x="180" y="88" class="t-b t-bad">Parathyroid</text>
            <text x="180" y="104" class="t-sm t-mut">~100%, earliest</text>
            <text x="180" y="170" class="t-b">Pancreas / gut</text>
            <text x="180" y="186" class="t-sm t-mut">30–75%, the killer</text>
            <text x="20" y="285" class="t-sm t-mut">+ others: adrenal cortex, carcinoid, lipoma ...</text>
          </svg>
      - kind: check
        page: 2
        quote: "Primary Hyperparathyroidism\n~ 100% penetrance – earliest / most common manifestation."
        question: "The earliest and most common manifestation of MEN 1 is:"
        options: ["Primary hyperparathyroidism", "Gastrinoma", "Prolactinoma", "Insulinoma"]
        answer: 0
        why:
          - "صح: penetrance تقريبًا 100% وهو أول حاجة بتظهر."
          - "الـ gastrinoma أشهر entero-pancreatic tumor، مش أشهر حاجة في المتلازمة كلها."
          - "الـ prolactinoma أشهر pituitary tumor، والـ pituitary أول مظهر في 25% بس."
          - "الـ insulinoma أقل من الـ gastrinoma."
      - kind: explain
        page: 2
        quote: "Multiglandular involvement (unlike sporadic hyper PTH w/single\ngland adenoma)."
        title: "الفرق المهم عن الـ sporadic"
        text: |
          في الـ sporadic primary hyperparathyroidism غالبًا **single gland adenoma**. في MEN 1 أكتر من غدة شغالة: ==multiglandular involvement==.

          **التشخيص:**
          - **Clinically**: stones, bones (حصوات وعضم).
          - **Lab**: hypercalcemia مع **high parathyroid hormone (PTH)**.
          - **Imaging**: sestamibi و bone densitometry.

          ليه stones و bones بالذات؟ التفسير المقبول (مش في الكتاب): الـ PTH بيسحب الكالسيوم من **العضم** فيضعف، والكالسيوم الزيادة بيتفلتر في **الكلية** فيترسّب حصوات. وليه الـ lab لازم الاتنين مع بعض؟ لأن الكالسيوم العالي الطبيعي **يكبس** الـ PTH؛ لو الكالسيوم عالي والـ PTH عالي كمان، يبقى الغدة نفسها هي اللي شغالة لوحدها. والـ **bone densitometry** بتقيس قد إيه العضم اتأذى، وده بيدخل في قرار العملية.
      - kind: aside
        tone: analogy
        page: 2
        quote: "Multiglandular involvement (unlike sporadic hyper PTH w/single\ngland adenoma)."
        text: "الـ sporadic زي حنفية واحدة سايبة: تقفلها وخلاص. MEN 1 زي عمارة كل حنفياتها بايظة لأن المواسير نفسها (الجين) بايظة. تقفل حنفية واحدة، الباقي يفضل يخر."
      - kind: explain
        remind: [endo.L01.009]
        page: 2
        quote: "Indications for surgery\n  Symptomatic or marked hypercalcemia.\n  Nephrolithiasis.\n  Diminished bone density / osteopenia.\n  Presence of severe gastric ulcers 2ry to gastrinoma (hypercalcemia increase release of gastrin & worsens hypergastrinemia and parathyroidectomy reduces gastrin secretion.**"
        title: "إمتى نعمل عملية؟"
        text: |
          ==Indications for surgery==، وكل واحدة ليها سبب:
          1. **Symptomatic أو marked hypercalcemia**: الكالسيوم العالي نفسه هو المرض، فلو عامل أعراض أو عالي قوي يبقى لازم يتشال مصدره.
          2. **Nephrolithiasis**: يعني الكالسيوم بدأ يأذي الكلية فعلًا.
          3. **Diminished bone density (osteopenia)**: يعني العضم بيتسحب منه، والكسر جاي.
          4. **Severe gastric ulcers بسبب gastrinoma**: لأن الـ hypercalcemia بتزوّد الـ gastrin (السبب جاي في السؤال الجاي).

          أول تلاتة نفس منطق أي primary hyperparathyroidism: نعمل عملية لما الضرر يبان. الرابعة خاصة بـ MEN 1 لأن الـ gastrinoma والـ parathyroid عايشين في نفس المريض.
      - kind: reveal
        page: 2
        quote: "Indications for surgery\n  Symptomatic or marked hypercalcemia.\n  Nephrolithiasis.\n  Diminished bone density / osteopenia.\n  Presence of severe gastric ulcers 2ry to gastrinoma (hypercalcemia increase release of gastrin & worsens hypergastrinemia and parathyroidectomy reduces gastrin secretion.**"
        prompt: "ليه قرحة المعدة من الـ gastrinoma تخلينا نشيل الـ parathyroid؟ الورم في البنكرياس مش في الرقبة!"
        answer: "لأن الـ **hypercalcemia بتزوّد إفراز الـ gastrin** وبتسوّء الـ hypergastrinemia. لما تشيل الـ parathyroid الكالسيوم ينزل، والـ gastrin ينزل معاه، والقرحة تهدى."
      - kind: explain
        page: 3
        quote: "Therapy for Primary Hyperparathyroidism\n  Subtotal parathyroidectomy (removal of 3.5).\n  Parathyroid remnants in situ OR autograft implanted into forearm succesful in >90% of cases."
        title: "العملية: 3.5 من 4"
        text: |
          الـ ==subtotal parathyroidectomy==: بنشيل **3.5 غدة**.

          - يا نسيب نص غدة مكانها (**remnant in situ**)،
          - يا نزرعها في الـ **forearm** (autograft)، ونجاحها أكتر من **90%**.

          ليه الدراع؟ لو المرض رجع، نشيل حتة من الدراع بـ local anesthesia بدل ما نفتح الرقبة تاني.
      - kind: table
        page: 2
        quote: "Complications of Parathyroid Surgery\n  Temporary hypocalcemia common.\n  4% risk permanent hypoPTH, 30% risk persistent/recurrent hyperPTH.\n  Graft function successful in >90% of autotransplantations.\n  High rate of recurrence after successful surgical therapy unlike sporadic 67% after 8years."
        title: "مضاعفات عملية الـ parathyroid"
        columns: ["Complication", "Risk"]
        rows:
          - ["Temporary hypocalcemia", "Common"]
          - ["Permanent hypoparathyroidism", "4%"]
          - ["Persistent/recurrent hyperparathyroidism", "30%"]
          - ["Recurrence after successful surgery", "67% after 8 years"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: exam
        page: 2
        quote: "Complications of Parathyroid Surgery\n  Temporary hypocalcemia common.\n  4% risk permanent hypoPTH, 30% risk persistent/recurrent hyperPTH.\n  Graft function successful in >90% of autotransplantations.\n  High rate of recurrence after successful surgical therapy unlike sporadic 67% after 8years."
        text: "الـ recurrence في MEN 1 عالي جدًا (67% بعد 8 سنين) عكس الـ sporadic. السبب نفس الحنفيات: كل خلية parathyroid فاضلة شايلة نفس الجين."
      - kind: try
        items: [endo.L01.001, endo.L01.003, endo.L01.005, endo.L01.009, endo.L01.011]
    recap:
      - "MEN = أورام في غدتين أو أكتر، genetically determined."
      - "MEN 1 (Wermer) الأشهر: Parathyroid + Pituitary + Pancreas."
      - "Primary HPT: ~100%، أول وأشهر مظهر، multiglandular."
      - "العملية: subtotal (3.5 غدة) + remnant أو forearm graft."
      - "Recurrence عالي: 67% بعد 8 سنين."
    practice: [endo.L01.001, endo.L01.002, endo.L01.003, endo.L01.004, endo.L01.005, endo.L01.006, endo.L01.007, endo.L01.008, endo.L01.009, endo.L01.010, endo.L01.011, endo.L01.012, endo.L01.013, endo.L01.082, endo.L01.083, endo.L01.084, endo.L01.099, endo.L01.102]
