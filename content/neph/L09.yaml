    src: { page: 296, quote: "Native fistula created by anastomosis of an artery to vein radial A to cephalic vein :BresciaCimino fistula, (radiocephalic).Upper rm versus forearm fistula the idea that AVFs created with larger vessels have superior maturation rates. Fistula created 6 months before used (stage 4 CKD) to allow for maturation and and arterialysed vein to be dilated, thickened. AV graft chosen in case of: native fistula fail to mature, poor arterial inflow vasculature, inadequate or poor caliber of patient veins. It is of aprothetic material usually polyetrafluorethylene interposed between A,V." }
    status: unverified
    tags: [high-yield]
