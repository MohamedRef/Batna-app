  # ---------- p392-394: other drugs ----------
  - id: neph.L11.193
    kind: card
    topic: tx-drugs
    front: How does BP above 140/90 affect transplant pregnancies?
    back: Preterm birth rises six-fold and preeclampsia five-fold; with normal BP over 90% of pregnancies succeed.
    src: { page: 392, quote: "(1) Hypertension control The blood pressure of renal transplant recipients should be carefully monitored and well-controlled both before and during pregnancy. High and sustained pressures of more than 140/90 can increase the risks of pre- birth by six fold and preeclampsia by fivefold, whereas women with normal blood pressure have more than 90% of getting successful pregnancies.(109)" }
    status: unverified
    tags: [numbers]
  - id: neph.L11.194
    kind: enumerate
    topic: tx-drugs
    prompt: Mention the fetal effects of ACE inhibitors and ARBs.
    points:
      - Oligohydramnios
      - Intrauterine growth retardation
      - Skull hypoplasia
      - Limb deformities
      - Fetal renal dysplasia
      - Pulmonary hypoplasia
      - Patent ductus arteriosus
    pass: 4
    hook: "ACEi وARBs بتضرب البيبي «من الراس للرجل»: جمجمة (skull hypoplasia)، رئة (pulmonary hypoplasia)، قلب (patent ductus arteriosus)، كلية (fetal renal dysplasia) ومية قليلة (oligohydramnios)، أطراف (limb deformities)، والبيبي كله صغير (intrauterine growth retardation)."
    src: { page: 392, quote: "Angiotensin II receptor antagonists and angiotensin-converting enzyme inhibitors during pregnancy are contraindicated because of their fetal teratogenic effects and should be discontinued before conception. Adverse effects might include oligohydramnios, intrauterine growth retardation, skull hypoplasia, limb deformities, fetal renal dysplasia, pulmonary hypoplasia, and patent ductus arteriosus.(111) Methyldopa, hydralazine, and labetalol are safe during pregnancy. Similarly, calcium channel blockers can be used. Atenolol is better avoided because of the possibility of fetal growth retardation.(109, 112)" }
    status: unverified
    tags: [high-yield]
