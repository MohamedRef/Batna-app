        text: |
          عمود الـ F4 بسهولة: **الـ C والـ NAFLD والـ HIV/HCV = 14**. وبعدين الكبار: **cholestatic 17، HBV 18، alcohol 19**.

          وليه الـ alcohol والـ cholestasis أعلى؟ لأن الالتهاب والـ cholestasis نفسهم بيرفعوا الـ stiffness من غير تليف (هتشوفها في الجدول اللي جاي)، فلازم رقم أعلى علشان تقول cirrhosis. والـ F0–F1 ثابتة في الكل: **2–7**.
      - kind: explain
        page: 32
        title: "الـ FibroScan بيكدب إمتى؟"
        text: |
          الـ TE بيبعت موجة ويقيس سرعتها. فيه حاجتين ممكن يبوّظوا النتيجة:

          **1. الموجة مش عارفة توصل، والقياس يبقى failed or unreliable**
          - **Ascites:** الـ elastic waves **ما بتمشيش في السوائل**.
          - **Obesity**: لو الـ BMI أكتر من 30 بتعمل TE failure، والـ **XL probe** قلّل الفشل.
          - **Narrow intercostal spaces:** success أقل، والـ **S probe** قلّل الفشل.

          **2. الكبد ناشف لسبب تاني غير التليف، والرقم يبقى false high**
          - **Acute hepatitis:** التغيرات في النسيج بترفع الـ LSM.
          - **Chronic hepatitis flare:** لو **ALT > 5× ULN** ممكن تعمل **overestimation** للـ stage.
          - **Extrahepatic cholestasis:** بترفع الـ LSM **independently of fibrosis**.
          - **Congestive heart failure:** **increased blood volume in the liver** بيرفع الـ LSM.
      - kind: aside
