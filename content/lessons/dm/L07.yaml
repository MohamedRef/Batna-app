      - kind: match
        page: 85
        quote: "HF peak (parasympathetic dysfunction)"
        prompt: "قمة ضعيفة ← معناها إيه؟"
        pairs:
          - ["VLF peak", "Sympathetic dysfunction (thermoregulation)"]
          - ["LF peak", "Sympathetic dysfunction (baroreflex)"]
          - ["HF peak", "Parasympathetic dysfunction"]
          - ["LF/HF ratio", "Sympathetic imbalance"]
        why: "الـ HF جاي من التنفس اللي بيحركه الـ vagus، والـ VLF و LF مرتبطين بالـ vasomotor tone والـ baroreflex (sympathetic). الـ LF/HF بيقيس التوازن."
      - kind: explain
        page: 86
        title: "طرق تانية"
        quote: "l. Neurovascular flow Using noninvasive laser Doppler measures of peripheral sympathetic responses to nociception."
        text: |
          - **Neurovascular flow**: ==laser Doppler== بيقيس الـ peripheral sympathetic response للـ nociception.
          - **Cardiac radionuclide imaging**: بيقيس الـ **cardiac sympathetic innervation** مباشرة.
      - kind: explain
        page: 86
        title: "العلاج: محورين"
        quote: "2- Trial to reverse the CAN n. Orthostatic Hypotension\n  Nonpharmacological\n    Increasing consumption of water\n    The use of lower-extremity stockings to reduce symptoms"
        text: |
          1. **Symptomatic**: orthostatic hypotension، low cardiac output، operative risk
          2. ==Trial to reverse the cardiovascular autonomic neuropathy (CAN)==

          **Orthostatic hypotension، من غير أدوية:** **مية أكتر**، و **lower-extremity stockings**.

          ليه دول؟ التفسير المقبول (مش في الكتاب): المية بتزوّد حجم الدم، فلما ينزل جزء منه لتحت يفضل كفاية للمخ. والـ **stockings** بتضغط على أوردة الرجل فتمنع الدم يتجمع فيها، وده بالظبط الشغل اللي الـ sympathetic كان بيعمله.
      - kind: explain
        page: 87
        title: "الأدوية"
        quote: "Enhancement of ganglionic transmission via the use of pyridostigmine (inhibitor of acetylcholinesterase) improved symptoms and orthostatic BP, with only modest effects in supine BP"
        text: |
          - ==Pyridostigmine== (acetylcholinesterase inhibitor) بيقوّي الـ **ganglionic transmission**: الأعراض والـ **orthostatic blood pressure (BP)** يتحسنوا، وتأثيره على الـ **supine BP** بسيط.
          - **Adrenergic blockers** للـ **tachycardia**.
          - **Anticholinergics** للـ **orthostatic bradycardia**.

          الـ adrenergic blocker بيهدّي القلب اللي بيسرع، والـ anticholinergic بيشيل أثر الـ vagus اللي بيبطّأه. يعني كل دوا بيعكس الاتجاه الغلط.
      - kind: reveal
        page: 87
        quote: "Enhancement of ganglionic transmission via the use of pyridostigmine (inhibitor of acetylcholinesterase) improved symptoms and orthostatic BP, with only modest effects in supine BP"
        prompt: "ليه pyridostigmine ما بيعليش الضغط وهو نايم زي باقي أدوية الضغط؟"
        answer: |
          التفسير المقبول (مش في الكتاب): هو بيقوّي الإشارة في الـ **sympathetic ganglia** بس لما يكون فيه إشارة أصلًا. الإشارة دي بتطلع **لما يقف** (الـ baroreflex بيشتغل)، فالتقوية بتحصل وقت الوقوف.

          وهو نايم مفيش طلب، فمفيش تقوية، فالـ **supine hypertension** بتبقى بسيطة.
      - kind: explain
        page: 87
        title: "المجهود والعمليات"
        quote: "Hypothermia has been shown to be associated with the presence of CAN."
        text: |
          - **Exercise intolerance** ← **exercise programs**
          - **Perioperative:** BP support، وانتبه إن ==hypothermia== مرتبطة بالـ CAN. الاختبارات قبل العملية بتحدد المعرضين وتجهّز الـ **anesthesiologist**.

          ليه الـ hypothermia؟ التفسير المقبول (مش في الكتاب): الجسم بيحافظ على حرارته بإنه يضيّق أوعية الجلد، وده شغل sympathetic. في الـ CAN الأوعية تفضل مفتوحة في أوضة العمليات الباردة، فالحرارة تهرب.
      - kind: explain
        remind: [dm.L07.076]
        page: 87
        title: "نرجّعها؟"
        quote: "Strict supervision and lifestyle intervention associated with weight loss improve HRV"
        text: |
          - **Lifestyle** و weight loss تحت متابعة ← heart rate variability (HRV) يتحسن
          - **Aldose reductase inhibitor**
          - **Beta blockers** (bisoprolol) ← HRV في الـ heart failure
          - **Spironolactone** ← sympathetic balance
          - ==Angiotensin-converting enzyme (ACE) inhibitors== ← HRV والتوازن، بس في الـ **mild** مش الـ advanced

          ليه الـ ACE inhibitor بيفيد الـ mild بس؟ التفسير المقبول (مش في الكتاب): التحسين محتاج ألياف لسه موجودة تتظبط. في الـ advanced الألياف ماتت، ومفيش دوا بيرجّع عصب ميت. عشان كده الكشف بدري بالـ reflex tests هو اللي بيفرق.
