  - id: dm.L03.lesson3
    title: "الأعصاب: شراب وجوانتي من غير إحساس"
    hook: "نص العيانين ما بيحسوش بحاجة، ودي المشكلة: الرجل اللي مش حاسة بتتعوّر من غير ما صاحبها يعرف."
    minutes: 9
    pages: [31, 33]
    topics: [neuropathy, neuropathy-screening]
    goals:
      - "تعدّ diagnostic clinical criteria (سؤال كتاب)"
      - "تعرف مضاعفات الـ neuropathy وشكل الـ Charcot والـ ulcer"
      - "تختار الـ test المناسب لكل fiber وتعالج الألم"
    status: unverified
    steps:
      - kind: explain
        page: 31
        title: "أربع حقايق قبل أي حاجة"
        quote: "Diabetic neuropathy\n  Diabetic neuropathy is a diagnosis of exclusion. Nondiabetic neuropathies may be present in patients with diabetes and may be treatable.\n  Up to 50% of diabetic peripheral neuropathy may be asymptomatic. If not recognized and if preventive foot care is not implemented, patients are at risk for injuries to their insensate feet.\n  Recognition and treatment of autonomic neuropathy may improve symptoms, reduce sequelae, and improve quality of life.\n  Distal symmetric sensorimotor polyneuropathy: it is the most common neurologic syndrome seen in diabetes with strong predilection for distal sensorimotor nerves of the feet and hands."
        text: |
          1. ==Diagnosis of exclusion==: ممكن يكون عنده neuropathy تانية **treatable**.
          2. لحد **50%** من الـ peripheral neuropathy **asymptomatic**، ومن غير foot care الرجل الـ insensate بتتعوّر.
          3. علاج الـ **autonomic neuropathy** بيحسّن الأعراض وجودة الحياة.
          4. أشهر syndrome: **distal symmetric sensorimotor polyneuropathy**، بتحب أطراف الرجلين والإيدين.

          ليه **diagnosis of exclusion**؟ لأن مريض السكر ممكن يكون عنده B12 deficiency (خصوصًا على metformin) أو hypothyroidism أو alcohol، ودول بيتعالجوا، فلو قلت «ده السكر» وسكتّ هتفوّت حاجة ممكن ترجع (التفسير مقبول، مش في الكتاب). وليه الأطراف؟ لأن أطول الأعصاب هي اللي بتتأذي الأول، فالرجل قبل الإيد.
      - kind: figure
        remind: [dm.L03.033]
        page: 31
        quote: "Loss of deep sensations:\n  Joint sense."
        title: "الـ stocking-glove"
        alt: "A simple body outline with shaded feet and lower legs (stocking) and shaded hands (glove), labelled with the five clinical criteria: stocking-glove paresthesia, loss of joint and vibration sense, lost deep tendon reflexes, distal wasting, sensory ataxia."
        caption: "أطول الأعصاب بتتعب الأول، فالرجلين قبل الإيدين. خمس criteria: ==stocking-glove==، deep sensation، reflexes، wasting، ataxia."
        svg: |
          <svg viewBox="0 0 330 280" xmlns="http://www.w3.org/2000/svg">
            <circle cx="80" cy="30" r="18" class="fg-box"/>
            <rect x="60" y="50" width="40" height="90" rx="10" class="fg-box"/>
            <path d="M60 60 L30 130" class="fg-ink" stroke-width="10" fill="none"/>
            <path d="M100 60 L130 130" class="fg-ink" stroke-width="10" fill="none"/>
            <circle cx="28" cy="138" r="11" class="fg-dot-bad"/>
            <circle cx="132" cy="138" r="11" class="fg-dot-bad"/>
            <path d="M70 140 L62 230" class="fg-ink" stroke-width="12" fill="none"/>
            <path d="M90 140 L98 230" class="fg-ink" stroke-width="12" fill="none"/>
            <rect x="50" y="195" width="24" height="50" rx="6" class="fg-dot-bad"/>
            <rect x="86" y="195" width="24" height="50" rx="6" class="fg-dot-bad"/>
            <text x="160" y="40" class="t-sm t-b">1. Stocking-glove paresthesia</text>
            <text x="160" y="80" class="t-sm t-b">2. Loss of deep sensation</text>
            <text x="172" y="96" class="t-sm">joint + vibration sense</text>
            <text x="160" y="136" class="t-sm t-b">3. Lost deep tendon reflexes</text>
            <text x="160" y="176" class="t-sm t-b">4. Distal muscle wasting</text>
            <text x="160" y="216" class="t-sm t-b">5. Sensory ataxia</text>
            <text x="165" y="270" text-anchor="middle" class="t-sm t-mut">longest nerves fail first: feet before hands</text>
          </svg>
      - kind: mnemonic
        page: 32
        quote: "Loss of deep tendon reflexes in upper & lower limbs. Distal muscle wasting. Loss of coordination (sensory ataxia)."
        word: "SDRWA"
        parts:
          - { key: "S", text: "Stocking-glove paresthesia" }
          - { key: "D", text: "Deep sensation lost (joint, vibration)" }
          - { key: "R", text: "Reflexes lost (upper and lower limbs)" }
          - { key: "W", text: "Wasting of distal muscles" }
          - { key: "A", text: "Ataxia (sensory)" }
        hook: "«**S**ugar **D**amages **R**eflexes, **W**alking **A**nd...»: السكر بيبوّظ الـ reflexes والمشي. خمسة بالترتيب من الجلد للحركة."
      - kind: explain
        remind: [dm.L03.035]
        page: 32
        title: "المضاعفات"
        quote: "3. Charcot joint (neuropathic arthropathy):\n  It occurs in the late stages of sever sensory loss.\n  It's common in knee and ankle joints.\n  Characterized by painless swelling of the joint with abnormal degree of mobility."
        text: |
          1. ==Charcot joint== (neuropathic arthropathy): متأخر مع sensory loss شديد، في الـ **knee** والـ **ankle**، **painless swelling** مع **abnormal mobility**.
          2. **Foot ulcers:** في أي stage بس أكتر مع الـ anesthesia المتقدمة؛ عند **pressure sites** (تحت الكعب، وتحت رأس أول وآخر metatarsal)؛ **painless** وصعب يلم.
          3. **Repeated minor injuries.**

          التلاتة ليهم نفس السبب: الرجل **مش حاسة**. التفسير المقبول (مش في الكتاب): المفصل اللي مش حاسس بيتحمّل ضغط ولفّات غلط كل يوم من غير ما يوجع، فبيتكسر ويتشوّه ببطء (Charcot). والـ ulcer بتطلع في أماكن الضغط (الكعب ورؤوس الـ metatarsals) لأن الجلد هناك بيتهرس مع كل خطوة وصاحبه مش حاسس.
      - kind: aside
        tone: analogy
        page: 32
        quote: "4. Foot ulcers:\n  It can occur at any stage but is more common in advanced stages of anesthesia.\n  It appears at pressure sites; under heel and under head of first ,last metatarsal.\n  It is completely painless and very difficult to heal."
        text: "الألم زي جرس إنذار الحريق. الـ neuropathy بتفصل الجرس: البيت بيولّع (ulcer، مفصل بيتكسّر) والعيان قاعد مرتاح. علشان كده **painless** هنا مش خبر حلو، ده أخطر علامة."
      - kind: explain
        page: 32
        title: "الـ Screening"
        quote: "Screening of diabetic neuropathy:\n  All patients should be assessed for diabetic peripheral neuropathy starting at diagnosis of type 2 diabetes and 5 years after the diagnosis of type 1 diabetes and at least annually thereafter.\n  Assessment for distal symmetric polyneuropathy should include a careful history and assessment of either temperature or pinprick sensation (small fiber function) and vibration sensation using a 128-Hz tuning fork (for large-fiber function). All patients should have annual 10-g monofilament testing to identify feet at risk for ulceration and amputation."
        text: |
          - **Type 2:** من ==التشخيص==. **Type 1:** بعد **5 سنين**. وبعدها **كل سنة**.
          - **History** + **temperature أو pinprick** (small fiber) + **vibration بـ 128-Hz tuning fork** (large fiber).
          - **10-g monofilament** كل سنة، علشان تمسك الرجل المعرّضة لـ ulcer و amputation.
          - علامات الـ **autonomic neuropathy** في اللي عنده microvascular complications.

          ليه الـ tests التلاتة مع بعض؟ لأن كل نوع fiber بيشيل إحساس مختلف: الـ small للألم والحرارة، والـ large للاهتزاز. ممكن واحد يتأذي والتاني سليم، فلو قست واحد بس هتفوّت نص المرض. والـ monofilament بيجاوب على السؤال العملي: الرجل دي هتحس لو اتعوّرت ولا لأ؟
      - kind: match
        page: 33
        quote: "Small-fiber function: pinprick and temperature sensation. Large-fiber function: vibration perception. Protective sensation: 10-g monofilament."
        prompt: "وصّل الـ test بالوظيفة:"
        pairs:
          - ["Pinprick", "Small fiber"]
          - ["128-Hz tuning fork", "Large fiber"]
          - ["10-g monofilament", "Protective sensation"]
        why: "الـ **small fibers** بتشيل الألم والحرارة، فبتسبب الـ burning بدري. الـ **large fibers** بتشيل الاهتزاز والـ position، وتلفها = numbness و **loss of protective sensation (LOPS)**."
      - kind: explain
        page: 33
        title: "الأعراض والعلاج"
        quote: "Diagnosis of diabetic neuropathy:\n  The most common early symptoms are induced by the involvement of small fibers and include pain and dysesthesia (unpleasant sensations of burning and tingling).\n  The involvement of large fibers may cause numbness and loss of protective sensation (LOPS). LOPS indicates the presence of distal sensorimotor polyneuropathy and is a risk factor for diabetic foot ulceration. The following clinical tests may be used to assess small- and large-fiber function and protective sensation:\n    Small-fiber function: pinprick and temperature sensation.\n    Large-fiber function: vibration perception.\n    Protective sensation: 10-g monofilament."
        text: |
          - **أول أعراض:** **pain** و **dysesthesia** (burning و tingling) من الـ ==small fibers==.
          - **Large fibers:** numbness و **LOPS**، ودي معناها distal sensorimotor polyneuropathy و risk لـ ulcer.

          **العلاج:**
          - **Glucose control:** في type 1 يمنع أو يأخّر، وفي type 2 يبطّأ. **ما بيرجّعش** الأعصاب اللي ماتت.
          - **Neuropathic pain:** ==pregabalin== أو **duloxetine** كبداية.

          ليه الـ small fibers أول ما تبان؟ التفسير المقبول (مش في الكتاب): لأنها رفيعة ومن غير myelin تقريبًا، فبتتأذي بسرعة، وأذيتها بتطلّع ألم و burning قبل ما الإحساس يروح. وليه الـ control ما بيرجّعش الأعصاب؟ الكتاب بيقول **does not reverse neuronal loss**، فالسكر الكويس بيحمي اللي فاضل بس. عشان كده الـ screening بدري مهم.
      - kind: update
        page: 33
        quote: "Treatment of diabetic neuropathy:\n  Optimize glucose control to prevent or delay the development of neuropathy in patients with type 1 diabetes A and to slow the progression of neuropathy in patients with type 2 diabetes. B (( does not reverse neuronal loss))\n  Pregabalin, duloxetine, are recommended as initial pharmacologic treatments for neuropathic pain in diabetes."
        text: "الـ American Diabetes Association (ADA) 2025 بيحط كمان الـ gabapentinoids والـ serotonin–noradrenaline reuptake inhibitors (SNRIs) والـ tricyclics والـ sodium-channel blockers كـ initial options. في الامتحان: **pregabalin و duloxetine** زي الكتاب."
        ref: "ADA Standards of Care in Diabetes 2025, section 12"
      - kind: check
        page: 33
        quote: "Small-fiber function: pinprick and temperature sensation.\nLarge-fiber function: vibration perception.\nProtective sensation: 10-g monofilament."
        question: "She cannot feel the 10-g monofilament at several sites. Meaning?"
        options: ["Loss of protective sensation: ulcer risk", "Small-fiber neuropathy only", "Normal ageing", "Autonomic neuropathy"]
        answer: 0
        why:
          - "صح: **LOPS** = distal sensorimotor polyneuropathy و risk factor للـ ulcer."
          - "الـ monofilament بيقيس protective sensation، مش small fibers."
          - "مش طبيعي، وده لازم foot care."
          - "الـ autonomic ليه أعراض تانية."
      - kind: try
        items: [dm.L03.033, dm.L03.037, dm.L03.038, dm.L03.039, dm.L03.086]
    recap:
      - "Diagnosis of exclusion؛ لحد 50% asymptomatic؛ أشهرها distal symmetric sensorimotor polyneuropathy."
      - "Criteria: stocking-glove، deep sensation (joint + vibration)، reflexes، wasting، sensory ataxia."
      - "Charcot: painless swelling + abnormal mobility (knee، ankle). Ulcer: pressure sites، painless، صعب يلم."
      - "Screen: type 2 من التشخيص، type 1 بعد 5 سنين، وبعدها سنويًا؛ pinprick/temperature، 128-Hz، 10-g monofilament."
      - "Control بيمنع (type 1) أو يبطّأ (type 2) ومش بيرجّع. الألم: pregabalin أو duloxetine."
