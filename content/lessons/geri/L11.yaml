  - id: geri.L11.lesson3
    title: "الـ COPD: وشوش كتير لمرض واحد"
    hook: "مريض بيكح بلغم، ومريض نحيف بينهج، ومريض بيشخّر بالليل. التلاتة COPD، بس كل واحد phenotype."
    minutes: 9
    pages: [197, 201]
    topics: [pathogenesis, phenotypes]
    goals:
      - "تعرف بداية الـ chronic obstructive pulmonary disease (COPD) ودور الـ telomeres والـ immunosenescence"
      - "تفرّق chronic bronchitis عن emphysema"
      - "تعرف الـ phenotypes والـ BODE index"
    status: unverified
    steps:
      - kind: explain
        page: 197
        quote: "Earlyinitiating phases of COPD fall into two categories: (1) Antioxidant / oxidant.\n  (2) Antiprotease / protease imbalance."
        title: "البداية"
        text: |
          البداية المبكرة للـ COPD نوعين:

          1. **Antioxidant / oxidant** imbalance.
          2. **Antiprotease / protease** imbalance.

          التفسير المقبول (مش في الكتاب) للاتنين: الدخان مليان **oxidants** بتزيد عن قدرة الرئة على تعادلها، وبتعطّل الـ **antiproteases** (زي alpha-1 antitrypsin). الـ proteases (زي الـ elastase من خلايا الالتهاب) تلاقي الطريق فاضي، فتاكل الـ elastin في حيطان الـ alveoli.

          والمرض بيكمّل على عشرات السنين **حتى بعد وقف التدخين**، والتفسير مراحل ==progression== و **consolidation** في host عنده استعداد وراثي.
      - kind: explain
        page: 198
        quote: "Telomere shortening: leads to increased apoptosis in the lungs of patients with COPD and imbalance between apoptosis and tissue repair may underlie the development of emphysema."
        title: "ليه مرض كبار؟"
        text: |
          - **Telomeres** أقصر في خلايا رئة مرضى الـ COPD من ناس في نفس السن من غير COPD. القِصَر ده بيزوّد الـ ==apoptosis==، وعدم التوازن بين الـ apoptosis والـ repair ممكن يكون أساس الـ emphysema.
          - **Immunosenescence**: بنفقد مع السن جزيئات حماية زي **macrophage migration inhibitory factor (MIF)** (macrophage migration inhibitory factor) و growth factors، فالـ alveoli والـ terminal airways تتدمر.

          يعني الرئة الكبيرة بتموّت خلايا أكتر وبتصلّح أقل، وده اللي بيخلي الـ COPD مرض كبار.

          (نفس فكرة الـ telomeres في الـ idiopathic pulmonary fibrosis (IPF) في المحاضرة اللي فاتت.)
      - kind: "figure"
        page: 198
        quote: "Telomere shortening: leads to increased apoptosis in the lungs of patients with COPD"
        title: "الـ telomere: رسمة الكتاب، ص 198"
        image: { file: geri/L11-telomere.webp, book: true }
        caption: "نفس رسمة محاضرة الـ DPLD: chromosome **Young** وطرفه الوردي (الـ ==telomere==) طويل، و chromosome **Old** وطرفه ==أقصر==، والـ **DNA** في النص.\n\nفي الـ COPD الكتاب بيقول إن القِصَر ده بيزوّد الـ ==apoptosis== في الرئة، ولو الـ apoptosis غلب الـ repair يبقى emphysema، وده اللي الميزان اللي تحت في نفس الصفحة بيرسمه."
        alt: "Book drawing: two chromosomes labelled young and old, with DNA in the middle and pink telomere caps; the old chromosome's telomeres are shorter."
