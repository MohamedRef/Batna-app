    src: { page: 178, quote: "‑ Type IV collagen is a major constituent of basement membranes in GBM, bowman capsule, distal renal tubule, epidermis (skin), eye, ear, testis. ‑ The type IV collagen family of proteins comprises six isomeric chains, designated α1(IV) to a6(IV)." }
