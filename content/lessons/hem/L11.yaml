    title: "عيان الـ myeloma: ضهر بيوجع، عدوى، وكلية بتقع"
    hook: "عجوز جاي بوجع ضهر وأنيميا وكرياتينين عالي؟ ما تكتبش osteoporosis وتروّحه. كل عرض له سبب واحد من تلاتة."
