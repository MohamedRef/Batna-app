            <rect x="60" y="172" width="120" height="36" rx="8" class="fg-thin"/>
            <text x="120" y="195" text-anchor="middle" class="t-sm t-b">Secondary TMA</text>
            <text x="270" y="226" text-anchor="middle" class="t-sm t-mut">Shiga toxin?</text>
            <path d="M270 172 V212 M270 232 V238 H200 V256 M270 238 H290 V256" class="fg-arrow"/>
            <text x="206" y="252" class="t-sm">+</text>
            <text x="296" y="252" class="t-sm">−</text>
