        quote: "TITLE OF THE RESEARCH:\n  Now you can finalize the title of your study.\n  The title should be in line with your general objective.\n  Make sure that it is specific enough to tell the reader: what your study is about, and where it will be conducted."
        title: "إمتى تقفل العنوان؟"
        text: |
          بعد ما الـ objectives اتكتبت: ==now you can finalize the title==.

          - لازم يكون **in line with the general objective**.
          - **specific** كفاية يقول للقارئ الدراسة **عن إيه** و**هتتعمل فين**.

          ليه في الآخر؟ لأن العنوان ملخص للـ general objective، ومينفعش تلخّص حاجة لسه ماكتبتهاش. التفسير المقبول (مش في الكتاب).
