          الـ heat map بتحط الـ **GFR** في الصفوف والـ **albuminuria** في الأعمدة، والخطر بيزيد كل ما تنزل **أو** تروح يمين.

          التفسير المقبول (مش في الكتاب): الـ G والـ A بيقيسوا حاجتين مختلفين. الـ GFR بيقيس الشغل اللي **فاضل**، والـ albuminuria بتقيس الأذى **الشغّال دلوقتي**. واحد G3a بـ A1 ممكن يعيش عمره كله كده، وواحد G3a بـ A3 ماشي بسرعة. علشان كده الخانة هي اللي بتتكلم مش الرقم لوحده.

          وفي نفس الصفحة الـ **ERA statement on CVD in CKD 2023**: الـ ==moderate CKD== = **high** CVD risk، والـ ==severe CKD== = **very high** CVD risk (زي تصنيف الـ ESC 2021). يعني الخانة كمان بتقولك الدهون والضغط هيتعالجوا بقوة قد إيه.
