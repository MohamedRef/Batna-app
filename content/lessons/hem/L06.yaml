      - kind: reveal
        page: 97
        quote: "Mechanism: Anamnestic reaction in a previously alloimmunized patient (by transfusion or pregnancy) upon re-exposure to the offending Ag."
        prompt: "ليه الـ DHTR بيستنى أسبوع ومش بيحصل فورًا زي الـ AHTR؟"
        answer: |
          العيان عنده **memory cells** من حمل أو نقل قديم، بس الـ antibody نفسه نزل لمستوى ما بيبانش في الـ cross-match.

          لما يقابل الـ antigen تاني، الـ memory بتصحى وتعمل ==IgG== كتير في أيام (anamnestic). الـ IgG بيغطي الكرات والطحال يشيلها (**extravascular**)، فمفيش hemoglobinuria.
      - kind: explain
        page: 98
        title: "إمتى تتدخل في الـ DHTR؟"
        quote: "If there is ongoing hemolysis, you may consider giving a glucocorticoid, intravenous immune globulin (IVIG), or rituximab."
        text: |
          الكتاب بيقول: تابع الـ **Hb** لحد ما تتأكد إن الـ hemolysis خلصت. ومفيش تدخل خاص من غير ==brisk hemolysis==، ودي معناها: Hb بينزل، bilirubin بيعلى، haptoglobin مختفي، أو hemoglobinuria. ممكن antipyretics للأعراض.

          لو الـ hemolysis مستمرة: **glucocorticoid** أو **intravenous immunoglobulin (IVIG)** أو **rituximab**. التفسير المقبول (مش في الكتاب) للتلاتة: الـ steroid والـ IVIG بيهدّوا الـ macrophages اللي بتاكل الكرات المتغطية، والـ rituximab بيقتل الـ B cells اللي بتعمل الـ antibody.

          والكلية: الـ brisk hemolysis ممكن يعمل **kidney failure**، فـ ==hydration== (لو مفيش مانع) مع متابعة الـ urine output لحد ما الـ Hb يثبت.
      - kind: explain
        remind: [hem.L06.084]
        page: 98
        title: "Post-transfusion purpura"
        quote: "Rare → sudden profound thrombocytopenia 5-10 days after transfusion of PLT-containing blood components, usually RBCs."
        text: |
          - نادر: **sudden profound thrombocytopenia** بعد ==5–10 days== من component فيه platelets، غالبًا **red blood cells (RBCs)**.
          - السبب: antibody ضد **HPA-1a** (الأشهر) من نقل أو حمل أو transplant قبل كده.
          - الغريب: بيكسّر **platelets العيان نفسه** كمان. نظريات: passive transfer، antibody ضد **Glycoprotein IIb (GPIIb)/IIIa** بتاع العيان، immune complexes، أو الـ alloantigen بيلزق على platelets العيان.
          - العلاج: ممكن self-limited، ولو شديد **IVIG** أو **plasma exchange**. الوقاية: دم **antigen-negative**.
          - التحاليل في reference labs: immunofluorescence، enzyme-linked immunosorbent assay (ELISA)، polymerase chain reaction (PCR) genotyping، **monoclonal antibody-specific immobilisation of platelet antigens (MAIPA)**.

          ليه الـ IVIG أو الـ plasma exchange؟ التفسير المقبول (مش في الكتاب): الـ plasma exchange بيشيل الـ antibody نفسه من الدم، والـ IVIG بيشغل الـ macrophages فما تاكلش الـ platelets المتغطية. وليه platelets عادية مش هتنفع؟ لأن الـ anti-HPA-1a هيكسّرها هي كمان، عشان كده الوقاية بدم **antigen-negative**.
      - kind: check
        page: 98
        quote: "Mechanism:\n  Presence in the recipient of an Ab (anti-HPA-1a) against the PLT specific Ag (HPA-1a). The Ab results from a previous transfusion or pregnancy.\n  Antiplatelet alloantibodies to human platelet antigens (HPA), following the transfusion of any platelet-containing product (whole blood,red blood cells or platelets). usually due to prior transfusion, transplant or pregnancy\n  Anti-HPA-1a is the most common culprit\n  Other HPA antibodies have been implicated\n  Anti-HPA antibody destroys autologous platelets; mechanism is not fully understood\n  Passive transfer of antibody is possible\n  Antibody to autologous GPIIb/IIIa platelet receptor\n  Immune complex binding to platelets\n  Adhesion of transfused alloantigen to autologous platelets\nManagement: may be self limited, but if severe, IVIG or plasma exchange."
        question: "A week after 3 units of red cells, a woman has purpura and platelets 5,000/mm³. Culprit antibody?"
