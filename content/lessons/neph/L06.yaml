      - kind: explain
        page: 144
        title: "ليه الـ calcium، وليه الـ dialysis؟"
        quote: "If respiratory depression, cardiac arrhythmias or Mg >5 mmol/L, give IV calcium gluconate 10% 10mL as slow IVI bolus. May require repeated doses."
        text: |
          الكتاب بيقول الـ Mg العالي بيزوّد **مقاومة الـ neuromuscular junction للـ acetylcholine**. والتفسير المقبول (مش في الكتاب) للعلاج:

          - **Calcium gluconate**: الـ Mg بيقف مكان الـ Ca على الأغشية وبيمنعه يشتغل، والـ Ca الزيادة ==بيزاحمه== ويرجّع الإشارة للعضلات والقلب. بس مفعوله مؤقت، علشان كده "May require repeated doses".
          - **Stop + monitor** لو الكلية سليمة: الكلية بتطلّع الزيادة بسرعة لوحدها.
          - **Furosemide 40–80 mg مع تعويض البول**: بيزوّد خروج الـ Mg، والتعويض علشان العيان ما ينشفش.
          - **Hemodialysis** لو الكلية تعبانة: هي الطريق الوحيد السريع للـ Mg يطلع.
