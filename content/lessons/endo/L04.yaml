          3. **↓ calcitriol receptors** في الـ parathyroid.

          وكمان الـ vitamin D ==antiproliferative== على خلايا الـ parathyroid. لما يقل، الـ parathyroid hormone (PTH) يعلى جدًا والغدة تكبر ==nodular==.
