schema: batna.lesson/v1
lecture: neph.L12
lessons:
  # ------------------------------------------------------------------
  - id: neph.L12.lesson1
    title: "الكلى والسرطان: نقيس الـ GFR صح الأول"
    hook: "قبل أي chemo لازم تعرف الكلية شغالة قد إيه، والـ creatinine لوحده ممكن يضحك عليك."
    minutes: 9
    pages: [410, 412]
    topics: [spectrum, gfr]
    goals:
      - "تعدّ الـ onconephrology spectrum وتعرف ليه محتاج team"
      - "تعرف ليه الـ creatinine لوحده بيغلط، وليه كل عامل بيغلّطه"
      - "تعرف دور الـ cystatin C والـ CKD-EPI وحدود كل واحد في السرطان"
    status: unverified
    steps:
      - kind: explain
        page: 410
        title: "يعني إيه onconephrology؟"
        quote: "The field of onconephrology encompasses the intersection of nephrology with oncology and highlights the important needs of patients who have cancer and also suffer from kidney disease in its many forms."
        text: |
          الـ ==onconephrology== هو المنطقة اللي الـ nephrology بيقابل فيها الـ oncology: عيان عنده سرطان وكمان عنده مشكلة في الكلى بأي شكل.

          علشان كده الكتاب بيقول محتاجين **multidisciplinary, coordinated team**: الـ oncologist يكتب الـ chemo، وأنت تحمي الكلية وتظبط الجرعة.
      - kind: mnemonic
        page: 410
        quote: "The myriad kidney manifestations of multiple myeloma (MM). Various electrolyte and acid-base disorders, Treatment related nephrotoxicity. Urinary tract obstruction."
        word: "ACGK MEDOH"
        parts:
          - { key: "A", text: "Acute kidney injury (AKI)" }
          - { key: "C", text: "Chronic kidney disease (CKD)" }
          - { key: "G", text: "Glomerular diseases" }
          - { key: "K", text: "Kidney cancer" }
          - { key: "M", text: "Multiple myeloma kidney manifestations" }
          - { key: "E", text: "Electrolyte and acid-base disorders" }
          - { key: "D", text: "Drug (treatment-related) nephrotoxicity" }
          - { key: "O", text: "Obstruction of the urinary tract" }
          - { key: "H", text: "HSCT-associated kidney disorders" }
        hook: "تسعة حاجات. اقسمهم نصين: **ACGK** (الأمراض نفسها) و **MEDOH** (المضاعفات والعلاج)."
      - kind: explain
        page: 410
        title: "ليه التسعة دول بالذات؟"
        quote: "Kidney cancer.\nThe myriad kidney manifestations of multiple myeloma (MM).\nVarious electrolyte and acid-base disorders,\nTreatment related nephrotoxicity.\nUrinary tract obstruction.\nVaried kidney disorders associated with HSCT."
        text: |
          القايمة شكلها طويلة، بس هي ماشية بمنطق واحد: الكلية بتتأذي من **تلات حاجات** في عيان السرطان.

          - **الورم نفسه:** **kidney cancer**، والـ **multiple myeloma** (بروتيناته بتسد وتأذي الكلية)، والـ **glomerular diseases** اللي الورم بيحرّكها، والـ **urinary tract obstruction** لما الكتلة تضغط.
          - **العلاج:** **treatment related nephrotoxicity**، والـ **HSCT** وكل اللي بييجي معاه.
          - **الأرضية:** **AKI** و **CKD** (موجودين قبل السرطان أو جايين معاه)، والـ **electrolyte and acid-base disorders** اللي بتلف حوالين الاتنين.

          عشان كده الكتاب بيقول ==multidisciplinary team==: الـ oncologist شايف الورم، وأنت شايف الكلية، ومحدش فيكم لوحده شايف الصورة كلها.
      - kind: explain
        page: 411
        title: "ليه الاتنين بيتقابلوا كتير؟"
        quote: "CKD may preexist in a substantial number of patients with cancer. This is likely because of comorbid conditions, such as diabetes mellitus and hypertension, that are highly prevalent in the population."
        text: |
          الكتاب بيدّيك تلات أسباب، وكل واحد ليه منطقه:

          - **CKD قبل السرطان:** عشان الـ ==diabetes mellitus== والـ hypertension منتشرين في الناس أصلًا، فعيان السرطان غالبًا جاي ومعاه واحد منهم.
          - **CKD بتزوّد خطر سرطان:** خصوصًا سرطانات الـ **urinary tract**. التفسير المقبول (مش في الكتاب): الـ urothelium والكلية نفسها بيتعرضوا سنين لـ toxins مش بتتشال كويس، والكلية الضامرة بيطلع فيها cysts ممكن تتحول.
          - **AKI كتير:** من الـ **sepsis** (المناعة واطية بسبب الـ chemo)، والـ **drugs** (أغلب الـ chemo بيتخرج من الكلية)، والـ **dehydration** (ترجيع وإسهال وقلة أكل).
      - kind: explain
        page: 411
        title: "ليه لازم تعرف الـ GFR قبل الـ chemo؟"
        quote: "Accurate dosing of chemotherapeutic agents is required to ensure optimal outcomes and to avoid toxicity. For those drugs excreted through the kidney, a determination of an individual's kidney function is required."
        text: |
          الـ chemo دوا **هامش الأمان بتاعه ضيق**: الجرعة اللي بتموّت الورم قريبة من الجرعة اللي بتأذي الجسم.

          فلو الدوا ==excreted through the kidney== والكلية بطيئة، الدوا بيتراكم في الدم، والجرعة العادية تبقى عمليًا جرعة زيادة. والعكس: لو قلّلت الجرعة على الفاضي عشان رقم غلط، الورم مش هيتعالج كويس.

          يعني رقم الـ GFR هنا مش رفاهية؛ هو اللي بيحدد **optimal outcome** ولا **toxicity**.
      - kind: reveal
        page: 411
        quote: "Serum creatinine levels only roughly track with the GFR because of factors such as age, muscle mass, meat intake, race and intake of creatine supplements, which can lead to overestimation of the GFR if only the serum creatinine is used."
        prompt: "عيانة عندها cachexia من السرطان والـ creatinine بتاعها 0.6. ينفع تقول الكلية سليمة؟"
        answer: |
          لأ. الـ **creatinine** جاي من العضلات، والعضلات قليلة، فالرقم واطي حتى لو الـ glomerular filtration rate (GFR) واقع. ده بيعمل **overestimation of the GFR**.

          العوامل اللي الكتاب ذكرها: **age، muscle mass، meat intake، race، creatine supplements**. الحل: **GFR estimation equation** أو **measured creatinine clearance**.
      - kind: explain
        page: 411
        title: "كل عامل بيضحك على الـ creatinine إزاي؟"
        quote: "Serum creatinine levels only roughly track with the GFR because of factors such as age, muscle mass, meat intake, race and intake of creatine supplements, which can lead to overestimation of the GFR if only the serum creatinine is used."
        text: |
          الفكرة كلها إن الـ **creatinine** جاي من **العضلات**، فأي حاجة بتغيّر إنتاجه بتغيّر الرقم من غير ما الكلية تتغير. التفسير المقبول (مش في الكتاب) لكل عامل:

          - **Age:** الكبير عضلاته أقل، فبيطلّع creatinine أقل.
          - **Muscle mass:** عيان السرطان الـ cachectic عضلاته دايبة، فالرقم واطي وهو مش سليم.
          - **Meat intake:** اللحمة فيها creatine بيتحول creatinine، فاللي مش بياكل (anorexia من الـ chemo) رقمه أوطى.
          - **Race** و **creatine supplements:** بيغيّروا الإنتاج فوق أو تحت.

          والنتيجة اللي الكتاب بيقولها: ==overestimation of the GFR==. عشان كده لازم **GFR estimation equations** أو **measured creatinine clearance**.
      - kind: figure
        page: 411
        quote: "It is freely filtered at the glomerulus and then undergoes catabolism within the kidney tubules, resulting in insignificant urinary excretion."
        title: "الـ cystatin C بيمشي إزاي في الكلية"
        alt: "Diagram: all nucleated cells make cystatin C at a constant rate; it is freely filtered at the glomerulus, then broken down in the tubules, so almost none appears in urine and the serum level depends on GFR. A warning box notes that the tumor and chemotherapy change cystatin C on their own."
        caption: "إنتاج ثابت + ==freely filtered== + بيتكسر في الـ tubules = مستواه في الدم بيعكس الـ glomerular filtration rate (GFR). بس في السرطان، الورم والـ chemo بيغيروه لوحدهم."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L12a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="20" y="12" width="290" height="44" rx="10" class="fg-box"/>
            <text x="165" y="31" text-anchor="middle" class="t-sm t-b">All nucleated cells</text>
            <text x="165" y="47" text-anchor="middle" class="t-sm">cystatin C at a constant rate (13 kDa)</text>
            <path d="M165 56 V80" class="fg-arrow" marker-end="url(#L12a)"/>
            <rect x="20" y="84" width="290" height="44" rx="10" class="fg-acc"/>
            <text x="165" y="103" text-anchor="middle" class="t-sm t-b">Glomerulus</text>
            <text x="165" y="119" text-anchor="middle" class="t-sm">freely filtered</text>
            <path d="M165 128 V152" class="fg-arrow" marker-end="url(#L12a)"/>
            <rect x="20" y="156" width="290" height="44" rx="10" class="fg-box"/>
            <text x="165" y="175" text-anchor="middle" class="t-sm t-b">Tubules</text>
            <text x="165" y="191" text-anchor="middle" class="t-sm">catabolized, almost none in urine</text>
            <text x="165" y="222" text-anchor="middle" class="t-sm t-good t-b">Serum level depends on GFR</text>
            <rect x="20" y="236" width="290" height="52" rx="10" class="fg-bad"/>
            <text x="165" y="257" text-anchor="middle" class="t-sm t-bad t-b">In cancer: caution</text>
            <text x="165" y="274" text-anchor="middle" class="t-sm">tumor and chemo change it independently</text>
          </svg>
      - kind: check
        page: 412
        quote: "Within oncology, the use of isolated cystatin C measurements for the determination of GFR and detection of nephrotoxicity has been questioned, as there appear to be independent effects of both the malignancy and chemotherapy on cystatin C levels that confound its utility."
        question: "Why is an isolated cystatin C level questioned for GFR in cancer patients?"
        options:
          - "The tumor and chemotherapy change cystatin C independently of GFR"
          - "Cystatin C is excreted unchanged in urine"
          - "It depends on muscle mass like creatinine"
          - "Only some cells make it, at a variable rate"
        answer: 0
        why:
          - "صح: ده بالظبط سبب الكتاب (ص 412)."
          - "غلط: بيتكسر في الـ tubules ومفيش urinary excretion تُذكر."
          - "غلط: ده عيب الـ creatinine، والـ cystatin C بيطلع من كل الخلايا."
          - "غلط: كل الـ nucleated cells بتعمله بمعدل ثابت."
      - kind: explain
        page: 412
        title: "المعادلة اللي بنثق فيها"
        quote: "The Chronic Kidney Disease Epidemiology Collaboration (CKD-EPI) equation is currently recommended by the KDOQI."
        text: |
          الـ ==CKD-EPI== هي اللي الـ **Kidney Disease Outcomes Quality Initiative (KDOQI)** بيوصي بيها. بتستخدم **race، age، sex، serum creatinine**.

          واتعملها validation في عيانين سرطان، وأداؤها فيهم أحسن من الطرق التانية.
      - kind: update
        page: 412
        quote: "This equation uses the variable of race (Black or other), age, sex, and serum creatinine."
        ref: "CKD-EPI 2021; KDIGO 2024 CKD guideline"
        text: "معادلة الـ CKD-EPI 2021 شالت الـ race، والـ Kidney Disease: Improving Global Outcomes (KDIGO) 2024 بيوصي بيها. في الامتحان اكتب اللي في الكتاب (race, age, sex, creatinine)."
      - kind: check
        page: 412
        quote: "These GFR-estimating equations use endogenous filtration markers such as serum creatinine and serum cystatin C."
        question: "Which endogenous filtration markers do GFR-estimating equations use?"
        options:
          - "Serum creatinine and serum cystatin C"
          - "Urea and uric acid"
          - "Inulin and iohexol"
          - "Albumin and beta-2 microglobulin"
        answer: 0
        why:
          - "صح: الكتاب بيقول serum creatinine و serum cystatin C (ص 412)."
          - "غلط: دول مش اللي الكتاب ذكرهم كـ filtration markers في المعادلات."
          - "غلط: دول exogenous markers بيتحقنوا، والسؤال عن endogenous."
          - "غلط: مش مذكورين كـ markers للمعادلات في المحاضرة."
      - kind: aside
        tone: joke
        text: "الـ creatinine عامل زي الموظف اللي بيقول «كله تمام يا فندم» علشان المدير (العضلات) مش موجود. اسأل الـ CKD-EPI."
      - kind: try
        items: [neph.L12.003, neph.L12.008, neph.L12.011, neph.L12.014, neph.L12.016]
    recap:
      - "الـ onconephrology = سرطان + كلى، ومحتاج team متعاون. الـ spectrum: **ACGK MEDOH** (الورم، العلاج، والأرضية)."
      - "الـ chemo هامشه ضيق: لو بيتخرج من الكلية لازم GFR صح."
      - "الـ creatinine لوحده بيعمل overestimation للـ GFR (age، muscle، meat، race، creatine)."
      - "الـ cystatin C: 13 kDa، constant production، freely filtered، بس السرطان والـ chemo بيغيروه."
      - "الـ CKD-EPI (KDOQI) اتعملها validation في السرطان."
    practice: [neph.L12.001, neph.L12.002, neph.L12.003, neph.L12.004, neph.L12.005, neph.L12.006, neph.L12.007, neph.L12.008, neph.L12.009, neph.L12.010, neph.L12.011, neph.L12.012, neph.L12.013, neph.L12.014, neph.L12.015, neph.L12.016]
