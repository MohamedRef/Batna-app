[workspace]
resolver = "3"
members = ["crates/core", "crates/protocol", "crates/anki", "crates/app", "crates/server", "crates/tools"]

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2024"
rust-version = "1.90"
license = "LicenseRef-Private"
publish = false

[workspace.dependencies]
batna-core = { path = "crates/core" }
batna-anki = { path = "crates/anki" }
batna-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Argon2id (password sign-in) is unusably slow unoptimised: a debug build
# would take seconds per sign-in.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The web app (scripts/web/build.sh): smallest code, as Kabar's web build does
# (adapted from kabar-app main: Cargo.toml). `strip` stays off for wasm-bindgen.
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = false

# dx uses these for Android / desktop bundles.
[profile.android-dev]
inherits = "dev"

[profile.server-dev]
inherits = "dev"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
