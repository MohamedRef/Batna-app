  - id: git.L04.lesson14
    title: "Gardner و Lynch و IBD، وشكل الورم"
    hook: "عيلة فيها سرطان قولون في الـ 45 ورحم ومبيض. ده مش حظ، ده Lynch."
    minutes: 8
    pages: [174, 175]
    topics: [crc-hered, crc-clinic]
    goals:
      - "تعرف Gardner و Turcot كـ variants للـ FAP"
      - "تعرف Lynch I و II وأرقامهم"
      - "تعرف خطر الـ IBD والسرطان السابق والقرايب، وأشكال الورم"
    status: unverified
    steps:
      - kind: explain
        page: 174
        quote: "Ocular, cutaneous, skeletal (retinal, mandible, jaw, teeth, sebaceous cysts)."
        title: "Gardner: FAP وحاجات برّه القولون"
        text: |
          الكتاب: **Gardner's syndrome** ==variant of FAP== فيه colonic و **extracolonic** manifestations:
          - **Periampullary** و duodenal lesions و gastric polyps.
          - **Ocular، cutaneous، skeletal**: retinal، mandible، jaw، teeth، sebaceous cysts.
          - **Desmoids**، **hepatoblastoma**، **thyroid cancer**، و **Turcot's syndrome** (brain).

          التفسير المقبول (مش في الكتاب): ليه الـ APC بيعمل حاجات في العضم والجلد والعين؟ لأنه بيتحكم في انقسام خلايا كتير في الجسم مش القولون بس. والعلامات الخارجية دي ليها فايدة عملية: الـ osteoma في الفك أو الـ retinal pigment ممكن تكون أول حاجة تلفت نظرك لعيلة فيها FAP قبل ما حد يعمل منظار. وبعد الـ colectomy، أهم أسباب الوفاة بتبقى الـ **periampullary** cancer والـ desmoids، فالمتابعة ما بتخلصش بالعملية.
      - kind: figure
        page: 174
        title: "القولون في الـ FAP"
        image: { file: git/L04-fap-colon.webp, book: true }
        alt: "Book photograph of an opened colon resection specimen with the whole mucosa carpeted by countless small polyps, with a ruler below."
        caption: |
          قولون متشال ومفتوح: الـ mucosa كلها ==سجادة بوليبات==، مئات لآلاف.

          ده سبب إن الخطر بيقرّب من **100%** بسن 40 من غير جراحة.
      - kind: match
        page: 174
        quote: "Gardner’s Syndrome: Variant of FAP. Colonic and extracolonic manifestations."
        prompt: "وصّل كل syndrome بعلامته:"
        pairs:
          - ["Gardner syndrome", "Mandible osteoma, teeth, sebaceous cysts, desmoids"]
          - ["Turcot syndrome", "Brain tumor"]
          - ["Lynch I", "Colon only"]
          - ["Lynch II", "Also endometrium, ovary, stomach, urinary tract"]
          - ["Attenuated FAP", "Fewer than 100 polyps, later onset"]
        why: "Gardner و Turcot variants للـ FAP. Lynch nonpolyposis: I للقولون بس، II فيه كمان endometrium، ovary، stomach، small bowel، biliary، pancreas، ureter، renal pelvis."
      - kind: explain
        page: 174
        quote: "85% lifetime risk of colon cancer, more right sided cancers (60-70%), earlier (45y), lower stage, better survival, but 20% risk of metachronous, synchronous lesions."
        title: "Lynch: الأرقام"
        text: |
          - **Lynch I و II** أكتر من FAP بخمس مرات، و1-5% من الـ colon cancers.
          - **85% lifetime risk**، ==right sided== (60-70%)، earlier (حوالي 45 سنة).
          - lower stage و better survival، بس 20% risk لـ metachronous أو synchronous lesions.

          التفسير المقبول (مش في الكتاب): ليه الـ survival أحسن رغم إنه بييجي بدري؟ أورام الـ mismatch repair فيها mutations كتير جدًا، فخلاياها شكلها «غريب» على الجهاز المناعي، فالمناعة بتحاربها أكتر وبتبطّأ انتشارها.
      - kind: reveal
        page: 174
        quote: "Lynch I and II. Occurs five times more frequently than familial polyposis. 1-5"
        prompt: "اسمه hereditary **nonpolyposis**. يعني مفيش بوليب خالص؟"
        answer: |
          الكتاب: الـ **Lynch I و II** أكتر من الـ familial polyposis ==بخمس مرات==، و 1-5% من الـ colon cancers. Lynch I القولون بس، و Lynch II كمان **endometrium، ovary، stomach، small bowel، biliary، pancreas، ureter، renal pelvis**.

          التفسير المقبول (مش في الكتاب): «nonpolyposis» معناها **مفيش مئات البوليبات** زي الـ FAP، مش مفيش بوليب خالص. السرطان هنا بيطلع من adenomas قليلة، بس الطريق من adenoma لسرطان **أسرع** لأن الخلية مش بتصلّح أخطاء الـ DNA (mismatch repair). وعلشان كده العيلة شكلها «عادي» في المنظار، والتشخيص بييجي من **قصة العيلة**: سرطانات كتير، في سن صغير، وفي أعضاء مختلفة.
      - kind: reveal
        page: 174
        quote: "85% lifetime risk of colon cancer, more right sided cancers (60-70%), earlier"
        prompt: "مريض Lynch: الورم في الغالب فين، وليه المتابعة ما بتخلصش بعد العملية؟"
        answer: |
          الكتاب: **85% lifetime risk**، أكتر ==right sided (60-70%)==، أبدري (حوالي **45**)، lower stage و better survival، بس **20% risk** لـ metachronous و synchronous lesions.

          التفسير المقبول (مش في الكتاب): الـ right sided معناه إن الـ flexible sigmoidoscopy مش كفاية للعيلة دي، لازم **colonoscopy كاملة**. والـ 20% synchronous و metachronous معناها إن القولون كله في خطر، مش الحتة اللي فيها الورم بس، فبعد الـ resection لازم المتابعة تفضل، وبعض الجراحين بيشيلوا جزء أكبر من القولون.
      - kind: explain
        page: 175
        quote: "People who have chronic inflammatory bowel disease, a condition in which the colon is inflamed over a long period of time, have almost double the risk of developing CRC compared to people in the general population. Cancer risk increases with the extent, duration, and severity of disease, but has decreased over time, likely due to increased use of medications to control inflammation and screening surveillance to detect premalignant lesions"
        title: "IBD، سرطان سابق، وقرايب"
        text: |
          - **IBD**: الخطر تقريبًا الضعف، وبيزيد مع ==extent, duration, and severity==. وبيقل مع الوقت بسبب العلاج والـ surveillance.
          - **Previous colon cancer**: second primary تلات مرات أكتر، و metachronous في 5-8%.
          - **First-degree relatives**: 1.8-8 مرات، وأكتر لو أكتر من قريب أو قريب صغير في السن.

          التفسير المقبول (مش في الكتاب): المنطق المشترك: أي حاجة بتقول إن «القولون ده أو العيلة دي» عندها استعداد. القولون اللي عمل سرطان مرة عنده نفس الظروف اللي ممكن تعمل تاني، والقرايب بيشاركوا جينات وأكل وعادات، وكل ما القريب صغير أو أكتر من واحد، احتمال الجينات أكبر.
      - kind: explain
        page: 175
        quote: "Cancer risk increases with the extent, duration, and severity of disease, but has"
        title: "ليه خطر الـ IBD قلّ مع الزمن؟"
        text: |
          الكتاب: الخطر في الـ IBD ==تقريبًا الضعف== من الناس العادية، وبيزيد مع **extent، duration، severity**، بس **قلّ مع الوقت**، غالبًا بسبب استخدام أكتر للأدوية اللي بتتحكم في الالتهاب، والـ **screening surveillance** اللي بيلاقي الـ premalignant lesions.

          التفسير المقبول (مش في الكتاب): الالتهاب نفسه هو المحرك: كل نوبة = خلايا بتموت وخلايا بتتجدد بسرعة = فرص mutation. فالعلاج اللي بيهدّي الالتهاب بيقلل عدد النوبات دي. والمنطق ده بيفسّر التلات عوامل: extent (مساحة أكبر ملتهبة)، duration (سنين أكتر)، severity (أذى أشد في كل مرة).
      - kind: check
        page: 175
        quote: "People who have chronic inflammatory bowel disease, a condition in which the colon is inflamed over a long period of time, have almost double the risk of developing CRC compared to people in the general population. Cancer risk increases with the extent, duration, and severity of disease, but has decreased over time, likely due to increased use of medications to control inflammation and screening surveillance to detect premalignant lesions"
        question: "Cancer risk in patients with IBD increases with:"
        options: ["The extent of disease", "Duration of disease", "Severity of disease", "All of the above"]
