      - kind: explain
        page: 55
        title: "الـ TIPS في الكتاب"
        text: |
          - **TIPS** = interventional radiology بتحط **intrahepatic metallic stent** بين الـ **intrahepatic portal vein** والـ **hepatic vein** ← **nonselective portocaval shunt**.
          - لو متاح: **good alternative when endoscopic treatment and pharmacotherapy fail**. ولسه بيعتبر **salvage therapy** للنزيف الحاد.
          - **Early TIPS (within 24 hours)** حسّن الـ survival بشكل واضح في الـ **high-risk** (**HVPG > 20 mmHg**)، وممكن ياخد دور أبكر.
          - واستخدم بنجاح كمان في الـ **secondary prophylaxis**.
      - kind: update
        page: 55
        text: "Baveno VII: **pre-emptive covered TIPS خلال 72 ساعة (ويفضّل خلال 24)** في **Child C < 14 points**، أو **Child B أكتر من 7 مع active bleeding وقت المنظار**، أو **HVPG > 20 mmHg**."
        ref: "Baveno VII consensus, 2021"
      - kind: mnemonic
        page: 56
        word: "LADS"
        parts:
          - { key: "L", text: "Liver dysfunction" }
          - { key: "A", text: "Age (increasing)" }
          - { key: "D", text: "Diameter of the shunt" }
          - { key: "S", text: "Stent bare (uncovered): more encephalopathy than coated" }
        hook: |
          الـ TIPS بيلخبط دماغ الـ **LADS**. 😄

          **HE = the most important medical complication after TIPS**، وبتظهر كـ **acute worsening of mental status خلال 2–3 أسابيع**. والمنطق: دم الأمعاء (وفيه الـ ammonia) بيعدّي من الماسورة على المخ من غير ما الكبد ينضّفه، وكل ما الماسورة أوسع (D) والكبد أضعف (L) والمريض أكبر (A)، المخ يتعب أكتر.
      - kind: explain
        page: 56
        title: "مضاعفات تانية، وبعدين: إزاي ما يرجعش ينزف؟"
        text: |
          **TIPS complications:**
          - الـ **bare stents** كان معاها **encephalopathy أكتر**، والـ **coated stents** أقل.
          - **TIPS-associated hemolysis**: نادر مع الـ coated stents.
          - **Vegetative infections** of the stent: أغلبها مع الـ bare stents، وعلاجها **prolonged antibiotics**.

          **Preventing variceal rebleeding (secondary prophylaxis):**
          - **NSBBs** effective.
          - إضافة **isosorbide-5-mononitrate (IsMN)** بيزوّد نزول الـ HVPG، و RCT قال إن **beta-blocker + IsMN** أحسن من الـ beta-blocker لوحده.
          - **EBL أحسن من الـ sclerotherapy**: rebleeding أقل، side effects أقل، و **sessions أقل** لحد الـ eradication.
      - kind: update
        page: 56
        text: "Baveno VI و VII: الـ first-line للـ secondary prophylaxis هو **NSBB (propranolol أو carvedilol) + EBL**، والـ **nitrates مبقتش موصى بيها**. في الامتحان اكتب اللي في الكتاب (BB + IsMN، و EBL أحسن من sclerotherapy)."
        ref: "Baveno VII consensus, 2021"
      - kind: check
        page: 56
        question: "Three weeks after a TIPS for refractory variceal bleeding, a 70-year-old man with Child B cirrhosis becomes confused and drowsy. What is the most likely cause?"
        options:
          - "Hepatic encephalopathy from the shunt"
          - "TIPS-associated hemolysis"
          - "Rebleeding from the varices"
          - "Vegetative infection of the stent"
        answer: 0
        why:
          - "صح: **HE** هي أهم مضاعفة، وبتيجي خلال **2–3 weeks**. وهو كبير في السن وكبده Child B (الـ L و الـ A في LADS)."
          - "الـ hemolysis نادر خصوصًا مع الـ coated stents، وما بيعملش confusion لوحده."
          - "الـ rebleeding بيبان بـ hematemesis أو Hb drop، مش confusion معزول."
          - "الـ vegetative infection نادرة وأغلبها مع الـ bare stents، والصورة هنا HE كلاسيكي."
