        prompt: "ليه قريب درجة أولى قبل 60 أخطر من قريب عنده 60 أو أكتر؟"
        answer: |
          الـ ACS: قريب درجة أولى **قبل 60** أو اتنين درجة أولى: ==age 40 أو 10 سنين قبل أصغر حالة==، كل **5 years**. قريب درجة أولى **60 أو أكتر** أو اتنين **second-degree**: **age 40** وكل **10 years**.

          التفسير المقبول (مش في الكتاب): السرطان في سن كبير شائع، وغالبًا sporadic (سن وعادات). أما السرطان في سن صغير فبيلمّح لجينات في العيلة، فالخطر على القرايب أعلى. و«10 سنين قبل أصغر حالة» معناها إنك عايز تلاقي البوليب قبل السن اللي العيلة بتجيلها فيه السرطان، مش بعده.
