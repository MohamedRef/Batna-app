          - { text: "Acute relapsing pancreatitis", bin: 1 }
          - { text: "Gallstone ileus", bin: 2 }
          - { text: "Bouveret's syndrome", bin: 2 }
        why: "ده تقسيم صفحة 386–387 بالظبط: الكتاب حاطط الـ pancreatitis تحت **bile ducts**، والـ gallstone ileus و Bouveret تحت **intestine**."
      - kind: explain
        page: 391
        quote: "Diagnostic tools > Clinical."
        title: "تشخّص بإيه؟"
        text: |
          الـ **diagnostic tools** في الكتاب سبعة:
          - **Clinical**
          - **US**
          - **Cholecystography**
          - **CT scan**
          - **MRCP**
          - **ERCP**
          - **PTC**

          والـ ==ultrasound== هو الأول: ==accurate in more than 95%== (صفحة 392). ومن برّه الكتاب (معلومة عامة): رخيص، مفيهوش radiation، وبيشوف الحصوة والجدار والـ duct في نفس الوقت.

          الصفحات 393–397 صور، وكل صورة بتوريك حاجة:
          - **Biliary mud** على الـ US: يعني الـ sludge.
          - **MRCP** فيها perforated GB و CBD stricture.
          - CT بعد ERCP.
          - حصوة كبيرة مع **choledochal cyst**.
          - **Shotty stones** مع حصوات impacted عند الـ **papilla of Vater**.
      - kind: figure
        page: 392
        quote: "Ultrasound Examination Accurate In More Than 95%"
        title: "الحصوة في الـ US"
        image: { file: hb/L19-stone-us.webp, book: true }
        alt: "Gallbladder ultrasound: a dark, fluid-filled gallbladder with a bright echogenic stone at its neck, marked by a blue arrow at the lower edge of the gallbladder."
        caption: |
          السهم على الحصوة: نقطة ==bright== (echogenic) على طرف المرارة السودا. ومن برّه الكتاب: الحصوة في الـ US عادةً بتعمل acoustic shadow غامق وراها.

          الكتاب بيقول الـ US ==accurate in more than 95%==، وعلشان كده هو أول فحص.
      - kind: sort
        page: 398
        quote: "> Intestinal obstruction, pleurisy myocardial infarction."
        prompt: "الـ differential diagnosis في الكتاب خمسة. قسّمهم: فوق الحجاب الحاجز ولا تحته؟"
