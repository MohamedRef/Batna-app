  - id: hb.L06.lesson7
    title: "السكر في الـ cirrhosis والأدوية الجديدة"
    hook: "إمتى نقول insulin بس؟ وليه دوا من عيلة الـ thyroid بقى أول دوا معتمد للـ MASH؟"
    minutes: 10
    pages: [110, 112]
    topics: [cirrhosis-dm, new-drugs, drugs]
    goals:
      - "تختار دوا السكر الصح في compensated و decompensated cirrhosis"
      - "تعرف قصة obeticholic acid و resmetirom بالأرقام"
      - "تمشي في الـ ADA treatment algorithm حسب الـ fibrosis stage"
    status: unverified
    steps:
      - kind: explain
        page: 110
        title: "T2DM + cirrhosis: افصل الأول compensated ولا لأ"
        text: |
          **Compensated cirrhosis** (كل دوا وتحذيره):

          - **Metformin**: be cautious of **cirrhotic decompensation**.
          - **Sulfonylurea**: ابدأ **low doses** علشان الـ **hypoglycemia**.
          - **Alpha-glucosidase inhibitor**: may be useful، **limited data**.
          - **Thiazolidinedione**: be cautious of **cardiovascular events**.
          - **DPP-4 inhibitor**: be cautious of **decompensation and hepatic failure**.
          - **GLP-1 RA** و **SGLT2 inhibitor**: **limited data**.

          **Decompensated cirrhosis:** **basal long-acting insulin ± rapid-acting insulin analog**، مع **close titration** و **monitoring of glucose**.
      - kind: figure
        page: 110
        title: "شجرة اختيار دوا السكر"
        alt: "Decision tree. Patients with type 2 diabetes and liver cirrhosis split into compensated and decompensated. Compensated: metformin, caution decompensation; sulfonylurea, start low to avoid hypoglycaemia; alpha-glucosidase inhibitor, useful but limited data; thiazolidinedione, caution cardiovascular events; DPP-4 inhibitor, caution decompensation and hepatic failure; GLP-1 receptor agonist and SGLT2 inhibitor, limited data. Decompensated: basal long-acting insulin with or without rapid-acting analog, close titration and glucose monitoring."
