        quote: "Advantages and disadvantages of correlational (ecological) studies\n| Advantages | Disadvantages |\n|---|---|\n| Can investigate whether differences in exposure between areas are bigger than at the individual level. | Associations cannot be confirmed at the individual level. |\n| Utilise routinely collected health data; therefore, may be relatively cheap and quick to conduct. | There is potential for ecological fallacy when applying grouped results to the individual level. |\n| Generate hypotheses which can be investigated at the individual level using studies higher up in the hierarchy of evidence. | There is lack of available data on confounding factors. |\n| Can investigate the effect of exposures that are measured over groups or areas, e.g. diet, air pollution and temperature. | There is potential for systematic differences between areas in how disease frequency is measured, e.g. differences in disease classification and coding. |\n| Can search for associations in large populations. | There is potential for systematic differences between areas in how exposures are measured. |"
