  - id: res.L04.004
    kind: card
    topic: designs
    front: What largely determines the scientific value and quality of the information a medical study provides?
    back: The study design.
    src: { page: 7, quote: "Introduction:\n  The scientific value and quality of information provided by a medical research are determined to a major extent by the study design.\n  Health researchers use both observational (descriptive and analytic) and experimental study designs to answer research questions.\n  Each type of design represents a different way of collecting the necessary information." }
    status: unverified
  - id: res.L04.005
    kind: enumerate
    topic: designs
    prompt: Enumerate the factors that decide which study design is appropriate.
    points:
      - Knowledge already available about the problem (gaps to fill)
      - Purpose of the research (questions, objectives, hypotheses)
      - Nature of the problem (features of exposure and disease)
      - Time and resources available
      - Skills and creativity of the researcher
      - Ethical considerations
    pass: 5
    hook: "اختيار الـdesign 6 «نعرف إيه، عايزين إيه، المشكلة شكلها إيه، معانا قد إيه، الباحث شاطر قد إيه، والأخلاق»: knowledge already available (gaps)، purpose، nature of the problem (exposure وdisease)، time وresources، skills وcreativity، وethical considerations."
    src: { page: 8, quote: "The selection of an appropriate study design depends on:\n  Knowledge already available about the problem (gaps of knowledge to be filled)\n  Purpose of the research (research questions/objectives/hypotheses)\n  Nature of the problem and its characteristics (specific features of exposure and disease)\n  Time and resources available for the research\n  Skills and creativity of the researcher\n  Ethical considerations" }
    status: unverified
    tags: [high-yield]
  - id: res.L04.006
    kind: table
    topic: designs
    title: State of knowledge decides the design
    columns: [State of knowledge, Type of study]
    rows:
      - ["A problem exists, little known about its characteristics or causes", "Exploratory or descriptive (case studies, cross-sectional surveys)"]
      - ["Certain factors are suspected to contribute", "Analytical: cross-sectional comparative, case-control, cohort"]
      - ["Factors are associated; how far does one cause the problem?", "Cohort studies"]
      - ["Enough known about causes to design and assess an intervention", "Experimental or quasi-experimental"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 10, quote: "Research questions and study types\n| State of knowledge of the problem | Type of research questions | Type of study |\n|---|---|---|\n| Knowing that a problem exists but knowing little about its characteristics or possible causes. | What is the nature/magnitude of the problem? Who is affected? How do the affected people behave? What do they know, believe, think about the problem and its causes? | Exploratory studies, or Descriptive studies: Descriptive case studies; Cross-sectional surveys |\n| Suspecting that certain factors contribute to the problem. | Are certain factors indeed associated with the problem? (e.g., Is lack of pre-school education related to low school performance? Is low fibre diet related to carcinoma of the large intestine?) | Analytical (comparative) studies: Cross-sectional comparative studies; Case-control studies; Cohort studies |\n| Having established that certain factors are associated with the problem: desiring to establish the extent to which a particular factor causes or contributes to the problem. | What is the cause of the problem? Will the removal of a particular factor prevent or reduce the problem? (e.g., stopping smoking, providing safe water) | Cohort studies; Experimental or quasi-experimental studies |\n| Having sufficient knowledge about cause(s) to develop and assess an intervention that would prevent, control or solve the problem. | What is the effect of a particular intervention/strategy? (e.g., treating with a particular drug; being exposed to a certain type of health education) Which of two alternate strategies gives better results? Which strategy is most cost-effective? | Experimental or quasi-experimental studies |" }
    status: unverified
    tags: [high-yield]
  - id: res.L04.007
    kind: mcq
    topic: designs
    stem: >-
      A health directorate knows that stunting is common in a rural district but knows almost nothing
      about who is affected or why. Which type of study fits this state of knowledge?
    options: ["A randomised controlled trial of an intervention", "A case-control study of stunted children", "A descriptive (exploratory) study or cross-sectional survey", "A prospective cohort study of newborns"]
    answer: 2
    why:
      - A trial needs enough knowledge of the causes to design an intervention.
      - Case-control tests factors already suspected; here nothing is suspected yet.
      - When a problem is known to exist but little is known about it, the lecture's table points to exploratory or descriptive studies.
      - A cohort measures how far a suspected factor causes the problem, a later stage.
    src: { page: 10, quote: "Research questions and study types\n| State of knowledge of the problem | Type of research questions | Type of study |\n|---|---|---|\n| Knowing that a problem exists but knowing little about its characteristics or possible causes. | What is the nature/magnitude of the problem? Who is affected? How do the affected people behave? What do they know, believe, think about the problem and its causes? | Exploratory studies, or Descriptive studies: Descriptive case studies; Cross-sectional surveys |\n| Suspecting that certain factors contribute to the problem. | Are certain factors indeed associated with the problem? (e.g., Is lack of pre-school education related to low school performance? Is low fibre diet related to carcinoma of the large intestine?) | Analytical (comparative) studies: Cross-sectional comparative studies; Case-control studies; Cohort studies |\n| Having established that certain factors are associated with the problem: desiring to establish the extent to which a particular factor causes or contributes to the problem. | What is the cause of the problem? Will the removal of a particular factor prevent or reduce the problem? (e.g., stopping smoking, providing safe water) | Cohort studies; Experimental or quasi-experimental studies |\n| Having sufficient knowledge about cause(s) to develop and assess an intervention that would prevent, control or solve the problem. | What is the effect of a particular intervention/strategy? (e.g., treating with a particular drug; being exposed to a certain type of health education) Which of two alternate strategies gives better results? Which strategy is most cost-effective? | Experimental or quasi-experimental studies |" }
    status: unverified
  - id: res.L04.008
    kind: table
    topic: designs
    title: Ideal study design by purpose
    columns: [Purpose, Observational, Intervention]
    rows:
      - [To estimate prevalence, Cross sectional, "-"]
      - [To determine natural history, Cohort, "-"]
      - ["To identify causes, risk factors or people at high risk", "Cohort, case-control or cross sectional", Randomised trial]
      - [To prevent disease, "-", Randomised trial]
      - [To alter the course of disease, "-", Randomised trial]
    blanks: [[0, 1], [1, 1], [3, 2]]
    src: { page: 11, quote: "Ideal study designs according to purpose of study\n| Purpose | Observational design | Intervention design |\n|---|---|---|\n| To estimate prevalence | Cross sectional | |\n| To determine natural history | Cohort | |\n| To identify causes or risk factors or people at high risk | Cohort, case-control, or cross sectional | Randomised trial |\n| To prevent disease | | Randomised trial |\n| To alter course of disease | | Randomised trial |" }
    status: unverified
    tags: [high-yield]
  - id: res.L04.009
    kind: mcq
    topic: designs
    stem: To assist with health resource allocation decisions, a research group wants to determine the burden of a particular disease in the population. Which study should be undertaken?
    options: [Randomized controlled trial, Ecological study, Cohort study, Cross-sectional study, Case-control study]
    answer: 3
    why:
      - A trial tests an intervention; it does not measure burden.
      - An ecological study compares groups' rates to suggest causes; it is not the design for prevalence.
      - A cohort gives incidence and natural history, not the current burden.
      - Burden = prevalence, and the ideal design to estimate prevalence is cross-sectional.
      - Case-control starts from cases and cannot estimate how common the disease is.
    src: { page: 11, quote: "Ideal study designs according to purpose of study\n| Purpose | Observational design | Intervention design |\n|---|---|---|\n| To estimate prevalence | Cross sectional | |\n| To determine natural history | Cohort | |\n| To identify causes or risk factors or people at high risk | Cohort, case-control, or cross sectional | Randomised trial |\n| To prevent disease | | Randomised trial |\n| To alter course of disease | | Randomised trial |" }
    status: unverified
    tags: [book-question]
  # --- Hierarchy and the design tree (slides 12-15) ---
  - id: res.L04.010
    kind: order
    topic: hierarchy
    prompt: Order these from the strongest to the weakest evidence (the lecture's hierarchy).
    steps:
      - Clinical practice guidelines
      - Systematic reviews
      - Randomized controlled trials
      - Cohort studies
      - Case-control studies
      - Case reports or case series
      - Narrative reviews, expert opinions, editorials
    src: { page: 12, quote: "Hierarchy of Scientific Evidence (levels of evidence, top to bottom):\n  Secondary, pre-appraised or filtered studies:\n    Clinical Practice Guidelines\n    Meta-Analysis, Systematic Reviews\n  Primary studies:\n    Level 1, Experimental: Randomized Controlled Trial. Prospective: tests treatment\n    Level 2, Nonexperimental observational: Cohort Studies. Prospective: cohort has been exposed to a risk; observe for outcome of interest\n    Level 3, Nonexperimental observational: Case Control Studies. Retrospective: subjects have the outcome of interest; looking for risk factor\n  Level 4, No design: Case Report or Case Series; Narrative reviews, expert opinions, or editorials\n  Level 5, Not involved with humans: Animal and Laboratory Studies\n(©2016 Forrest & Miller, EBDM in Action; Developing Competence in EB Practice)" }
    status: unverified
    tags: [high-yield]
  - id: res.L04.011
    kind: card
    topic: hierarchy
    front: In the evidence hierarchy, which studies are "secondary" (pre-appraised, filtered) and which are "primary"?
    back: >-
      Secondary: clinical practice guidelines and systematic reviews. Primary: randomized controlled trials (RCTs) (experimental), and the
      observational cohort and case-control studies, with case reports/series below them.
    src: { page: 12, quote: "Hierarchy of Scientific Evidence (levels of evidence, top to bottom):\n  Secondary, pre-appraised or filtered studies:\n    Clinical Practice Guidelines\n    Meta-Analysis, Systematic Reviews\n  Primary studies:\n    Level 1, Experimental: Randomized Controlled Trial. Prospective: tests treatment\n    Level 2, Nonexperimental observational: Cohort Studies. Prospective: cohort has been exposed to a risk; observe for outcome of interest\n    Level 3, Nonexperimental observational: Case Control Studies. Retrospective: subjects have the outcome of interest; looking for risk factor\n  Level 4, No design: Case Report or Case Series; Narrative reviews, expert opinions, or editorials\n  Level 5, Not involved with humans: Animal and Laboratory Studies\n(©2016 Forrest & Miller, EBDM in Action; Developing Competence in EB Practice)" }
    status: unverified
  - id: res.L04.012
    kind: card
    topic: hierarchy
    front: What separates an experimental study from an observational one?
    back: >-
      In an experimental study the investigator assigns the treatment or exposure (random allocation of
      subjects). In an observational study the investigator studies people and exposures "in nature".
    src: { page: 13, quote: "Overview of Epidemiologic Study Designs:\n  EXPERIMENTAL: Random allocation of study subjects; Investigator assigns treatment or exposure:\n    Randomized Control Trials\n    Community Trials\n    Laboratory Trials\n  OBSERVATIONAL: Investigators study people and exposures \"in nature\". Comparison Group?\n    NO, DESCRIPTIVE: Correlational; Case Series; Case Reports; Cross-Sectional\n    YES, ANALYTIC: Case-Control; Cohort" }
    status: unverified
    tags: [high-yield]
  - id: res.L04.013
    kind: card
    topic: hierarchy
    front: Among observational studies, which single question sorts a design into descriptive or analytic?
    back: Is there a comparison group? No = descriptive; yes = analytic.
    src: { page: 13, quote: "Overview of Epidemiologic Study Designs:\n  EXPERIMENTAL: Random allocation of study subjects; Investigator assigns treatment or exposure:\n    Randomized Control Trials\n    Community Trials\n    Laboratory Trials\n  OBSERVATIONAL: Investigators study people and exposures \"in nature\". Comparison Group?\n    NO, DESCRIPTIVE: Correlational; Case Series; Case Reports; Cross-Sectional\n    YES, ANALYTIC: Case-Control; Cohort" }
    status: unverified
