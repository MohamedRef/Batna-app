            <rect x="254" y="110" width="66" height="28" rx="6" class="fg-box"/>
            <text x="287" y="129" text-anchor="middle" class="t-sm">Phagocyte</text>
            <text x="213" y="156" text-anchor="middle" class="t-sm t-mut">HAE</text>
            <text x="287" y="156" text-anchor="middle" class="t-sm t-mut">CGD</text>
            <rect x="95" y="190" width="140" height="30" rx="8" class="fg-thin"/>
            <text x="165" y="210" text-anchor="middle" class="t-sm">Unknown: CVID</text>
            <text x="165" y="243" text-anchor="middle" class="t-sm t-mut">adaptive / innate grouping: not from the book</text>
