        quote: "Current recommendations are to perform abdominal CT (Fig. 45.9) or magnetic resonance imaging (MRI) every 1 to 3 years for life to assess AML progression and renal cystic disease. On occasion, the dis-tinction between an AML and RCC cannot be reliably established by imaging and biopsy is indicated. Gene-based diagnosis is currently available for TSC1- and TSC2-"
        text: |
          الـ ultrasound شاطر في الـ AML الدهني والـ cysts، بس ==بيفوّت الـ fat-poor lesions==.

          علشان كده **CT أو magnetic resonance imaging (MRI) كل 1–3 سنين مدى الحياة**. ولو مش قادرين نفرّق AML من RCC بالـ imaging: **biopsy**.
      - kind: figure
        page: 175
        quote: "Renal AMLs are generally benign and require no treatment. Larger AMLs frequently develop micro- and macro-aneurysms, and the risk for serious hemorrhage correlates with aneurysms over 5-cm in diam-eter.24 Therefore these large AMLs require preemptive treatment with either nephron-sparing surgery or embolization. In addition to size and complications such as pain or hemorrhage, the inability to exclude an associated RCC should prompt intervention. When an associated malignancy cannot be excluded, nephron- sparing surgery, such as enucleation or partial nephrectomy is preferred. Female sex hormones may accelerate AML growth. Therefore it is prudent to caution women with multiple AMLs about the potential risks of pregnancy and estrogen administration."
        title: "الـ AML: نسيبه ولا نتدخل؟"
        alt: "Decision ladder for renal angiomyolipoma in TSC. Small and stable: no treatment, image every 1-3 years. Asymptomatic, growing, over 3 cm: mTOR inhibitor (sirolimus or everolimus) first line. Large with aneurysms over 5 cm, pain or bleeding: embolization or nephron-sparing surgery. RCC cannot be excluded: nephron-sparing surgery such as enucleation or partial nephrectomy."
        caption: "الرقمين المهمين: ==3 cm== (يبدأ الـ **mammalian target of rapamycin (mTOR) inhibitor** لو بيكبر) و **5 cm** (aneurysms ونزيف، يبقى embolization أو جراحة)."
