items:
  # ---------- p68: definition and Table 1 ----------
  - id: neph.L03.001
    kind: card
    topic: definition
    front: Define cardiorenal syndrome (2008 consensus conference).
    back: Disorders of the heart and kidneys in which acute or chronic dysfunction of one organ may induce acute or chronic dysfunction of the other.
    src: { page: 68, quote: "disorders of the heart and kidneys whereby acute or chronic dysfunction in one organ may induce acute or chronic dysfunction of the other" }
    status: unverified
    tags: [high-yield]
  - id: neph.L03.002
    kind: cloze
    topic: definition
    text: "The definition of cardiorenal syndrome comes from a {{c1::2008}} consensus conference, which split it into {{c2::five}} types."
    src: { page: 68, quote: "A 2008 consensus conference defined" }
    status: unverified
    tags: [numbers]
  - id: neph.L03.003
    kind: table
    topic: definition
    title: "Classification of cardiorenal syndrome (Table 1)"
    columns: [Type, Characteristics, Causes of morbidity]
    rows:
      - ["Type 1 (acute cardiorenal)", "Acute cardiac impairment leading to AKI", "Cardiogenic shock and ADHF resulting in AKI"]
      - ["Type 2 (chronic cardiorenal)", "Chronic cardiac impairment leading to renal impairment", "Chronic heart failure"]
      - ["Type 3 (acute renocardiac)", "AKI leading to cardiac impairment", "HF from AKI volume overload, inflammatory surge and metabolic disturbances"]
      - ["Type 4 (chronic renocardiac)", "CKD leading to cardiac impairment", "Myocardial remodeling and HF from CKD-associated cardiomyopathy"]
      - ["Type 5 (secondary cardiorenal)", "Systemic condition leading to both cardiac and renal impairment", "Diabetes, amyloidosis and sepsis"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 2]]
    src: { page: 68, quote: "Type 5 (secondary cardiorenal) Systemic condition leading to both cardiac and renal impairment Diabetes, amyloidosis and sepsis" }
    status: unverified
    tags: [high-yield]
  - id: neph.L03.004
    kind: card
    topic: definition
    front: "CRS type 1: what is it and what causes the morbidity?"
    back: Acute cardiorenal. Acute cardiac impairment leading to AKI, as in cardiogenic shock or acute decompensated heart failure resulting in AKI.
    src: { page: 68, quote: "Acute cardiac impairment leading to acute kidney injury (AKI) Cardiogenic shock and AKI, acute decompensated heart failure (ADHF) resulting in AKI" }
    status: unverified
  - id: neph.L03.005
    kind: card
    topic: definition
    front: "CRS type 2: what is it?"
    back: Chronic cardiorenal. Chronic cardiac impairment (chronic heart failure) leading to renal impairment.
    src: { page: 68, quote: "Type 2 (chronic cardiorenal) Chronic cardiac impairment leading to renal impairment Chronic heart failure" }
    status: unverified
  - id: neph.L03.006
    kind: card
    topic: definition
    front: "CRS type 3: what is it and why does the heart fail?"
    back: Acute renocardiac. AKI leads to cardiac impairment through volume overload, an inflammatory surge and the accompanying metabolic disturbances.
    src: { page: 68, quote: "AKI leading to cardiac impairment Heart failure in the setting of AKI from volume overload, inflammatory surge and accompanying metabolic disturbances" }
    status: unverified
  - id: neph.L03.007
    kind: card
    topic: definition
    front: "CRS type 4: what is it?"
    back: Chronic renocardiac. CKD leads to cardiac impairment through myocardial remodeling and CKD-associated cardiomyopathy.
    src: { page: 68, quote: "Chronic kidney disease (CKD) leading to cardiac impairment Myocardial remodeling and heart failure from CKD-associated cardiomyopathy" }
    status: unverified
  - id: neph.L03.008
    kind: enumerate
    topic: definition
    prompt: Name the systemic conditions the book gives as causes of CRS type 5 (secondary cardiorenal).
    points:
      - Diabetes
      - Amyloidosis
      - Sepsis
    pass: 3
    src: { page: 68, quote: "Systemic condition leading to both cardiac and renal impairment Diabetes, amyloidosis and sepsis" }
    status: unverified
  - id: neph.L03.009
    kind: mcq
    topic: definition
    stem: A 55-year-old man on maintenance hemodialysis for 6 years develops progressive breathlessness. Echo shows left ventricular hypertrophy with an ejection fraction of 35%. No acute illness preceded it. Which cardiorenal type fits best?
    options:
      - Type 1
      - Type 2
      - Type 3
      - Type 4
      - Type 5
    answer: 3
    why:
      - Type 1 is acute heart failure causing AKI; here the kidney disease came first.
      - Type 2 is chronic heart failure causing renal impairment; the order is reversed.
      - Type 3 is AKI causing acute cardiac dysfunction; his kidney disease is chronic.
      - "Correct: CKD causing myocardial remodeling and CKD-associated cardiomyopathy is type 4, chronic renocardiac (p68)."
      - Type 5 needs a systemic disease such as sepsis, diabetes or amyloidosis hitting both organs.
    src: { page: 68, quote: "Type 4 (chronic renocardiac) Chronic kidney disease (CKD) leading to cardiac impairment" }
    status: unverified
  - id: neph.L03.010
    kind: mcq
    topic: definition
    stem: A 30-year-old woman with septic shock from pneumonia develops oliguric AKI and, on the same day, a new reduction of left ventricular function on echo. Which cardiorenal type is this?
    options:
      - Type 1
      - Type 3
      - Type 4
      - Type 5
    answer: 3
    why:
      - Type 1 starts with the heart; here sepsis hit both organs together.
      - Type 3 starts with AKI and then the heart fails; here neither organ is primary.
      - Type 4 needs chronic kidney disease.
      - "Correct: a systemic condition (sepsis) damaging both heart and kidney is type 5, secondary cardiorenal (p68)."
    src: { page: 68, quote: "Systemic condition leading to both cardiac and renal impairment Diabetes, amyloidosis and sepsis" }
    status: unverified
  - id: neph.L03.011
    kind: mcq
    topic: definition
    stem: A 62-year-old man is admitted with an anterior MI and cardiogenic shock. Over 48 hours his creatinine rises from 1.0 to 2.4 mg/dL. Which cardiorenal type is this?
    options:
      - Type 1 (acute cardiorenal)
      - Type 2 (chronic cardiorenal)
      - Type 3 (acute renocardiac)
      - Type 5 (secondary)
    answer: 0
    why:
      - "Correct: acute cardiac impairment (cardiogenic shock) leading to AKI is type 1 (p68)."
      - Type 2 needs chronic heart failure and chronic renal impairment.
      - In type 3 the AKI comes first and the heart follows.
      - Type 5 needs a systemic disease that hits both organs; MI is a primary cardiac event.
    src: { page: 68, quote: "Cardiogenic shock and AKI, acute decompensated heart failure (ADHF) resulting in AKI" }
    status: unverified
  # ---------- p69: Figure 1 and CRS-1 mechanism ----------
  - id: neph.L03.012
    kind: card
    topic: pathogenesis
    front: Main trigger of kidney damage in CRS type 1 (Figure 1)?
    back: Altered renal perfusion, particularly when congestive heart failure is present.
    src: { page: 69, quote: "Alteration of renal perfusion is the main trigger (in particular when congestive heart failure is present)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L03.013
    kind: card
    topic: pathogenesis
    front: Which process is particularly important in CRS type 2 (Figure 1), and what else should be considered?
    back: Renal fibrosis. Drug-induced renal toxicity and VAD-induced renal effects should also be considered.
    src: { page: 69, quote: "Renal fibrosis is particularly important in type 2. Also to be considered drug induced renal toxicity and VAD induced renal effects" }
    status: unverified
  - id: neph.L03.014
    kind: card
    topic: pathogenesis
    front: Most important aspects driving heart damage in CRS type 3 (Figure 1)?
    back: Salt and water, neurohormonal and uremia-induced dysregulations.
    src: { page: 69, quote: "Salt and water, neuro-hormonal and uremia induced dysregulations are the most important aspects" }
    status: unverified
  - id: neph.L03.015
    kind: enumerate
    topic: pathogenesis
    prompt: What may cause the heart damage in CRS type 4 (Figure 1)?
    points:
      - Hypertension
      - CKD-induced myopathy
      - Chronic hemodialysis
      - Fluid shifts
    pass: 3
    src: { page: 69, quote: "Hypertension, CKD induced myopathy, chronic hemodialysis and fluids shifts may be in cause" }
    status: unverified
  - id: neph.L03.016
    kind: enumerate
    topic: pathogenesis
    prompt: Common pathogenetic patterns in CRS type 5 (Figure 1)?
