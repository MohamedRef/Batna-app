          التفسير المقبول (مش في الكتاب): لأن المريض ممكن يموت بالقلب قبل ما الكلية تفشل، فعلاج الكلية لوحدها مش كفاية. الـ care بيكبر مع الـ stage: كل ما الـ GFR ينزل، مضاعفات أكتر محتاجة متابعة، وناس أكتر في الفريق.
