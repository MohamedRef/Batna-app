  - id: res.L10.lesson8
    title: "الأدلة اللي مش في PubMed"
    hook: "أحسن تقييم لبرنامج الـ hepatitis C في قريتك يمكن ماتنشرش خالص. تلاقيه فين؟"
    minutes: 10
    pages: [123, 145]
    topics: [beyond, search]
    goals:
      - "تعرف ليه الـ published literature مش كفاية، والـ publication bias"
      - "تعرّف الـ fugitive (grey) literature"
      - "ترتّب خطوات الـ key informant process"
    status: unverified
    steps:
      - kind: explain
        page: 123
        quote: "SEEKING SOURCES OUTSIDE THE SEARCHABLE LITERATURE\n  Reasons for limitations of searching the published literature:\n  1) many researchers and practitioners fail to write up their research because of competing projects and other time demands.\n  2) journal editors are faced with difficult decisions on what to publish and there is a tendency toward publishing studies showing a significant effect of an intervention (publication bias)\n  3) in some areas of the world, lack of resources precludes systematic empirical research."
        title: "ليه المنشور مش كل الحكاية؟"
        text: |
          3 أسباب:
          - باحثين كتير **ماكتبوش** أبحاثهم (مشاريع تانية، وقت).
          - الـ editors بيميلوا ينشروا الدراسات اللي فيها **significant effect**: ده ==publication bias==.
          - في أماكن في العالم مفيش **resources** أصلًا لبحث منظم.
      - kind: aside
        tone: analogy
        page: 123
        quote: "there is a tendency toward publishing studies showing a significant effect of an intervention (publication bias)"
        text: |
          الـ **publication bias** زي صفحة الجيم على الفيسبوك: بتنشر صور «قبل وبعد» للي خسّوا 30 كيلو بس. اللي ما خسّش ولا كيلو مالوش بوست، فتفتكر إن الجيم بيشتغل مع الكل.
      - kind: explain
        page: 124
        quote: "Useful approaches in finding evidence beyond the searchable literature:\n  The “Fugitive” Literature.\n  Key Informant Interviews.\n  Professional Meetings."
        title: "٣ طرق برّه الـ database"
        text: |
          طرق مفيدة تلاقي بيها evidence ==مش موجودة في الـ searchable literature==:

          1. ==The «fugitive» literature==.
          2. ==Key informant interviews==.
          3. Professional meetings.

          ليه نحتاجهم؟ لأن مش كل حاجة بتتنشر في journal، وأحيانًا أهم معلومة عند حد شغال في الموضوع. التفسير المقبول (مش في الكتاب).
      - kind: explain
        remind: [res.L10.098]
        page: 125
        quote: "The “Fugitive” Literature\n  The “fugitive” or “grey” literature includes government reports, book chapters, conference proceedings, and other materials that are not found in online databases such as MEDLINE.\n  These are particularly important in attempting a summary of the literature involving meta-analysis or cost-effectiveness analysis."
        title: "3 طرق برّه الـ database: أولها الـ fugitive literature"
        text: |
          برّه الـ searchable literature عندك 3: **fugitive literature**، **key informant interviews**، و**professional meetings**.

          الـ ==fugitive (grey) literature== = تقارير حكومية، book chapters، **conference proceedings**، وأي حاجة مش موجودة في online databases زي MEDLINE. مهمة جدًا في الـ **meta-analysis** والـ **cost-effectiveness analysis**.

          صعب تلاقيها؛ أحسن مصدر **الخبرا**: ابعتلهم e-mail واسألهم عن الورق اللي الـ database مش هتجيبه.
      - kind: check
        page: 125
        quote: "The “fugitive” or “grey” literature includes government reports, book chapters, conference proceedings, and other materials that are not found in online databases such as MEDLINE."
        question: "Conference proceedings and other materials not found in online databases are called:"
        options: ["Fugitive literature", "Professional meetings", "Key informant interviews", "Practice guidelines"]
        answer: 0
        why:
          - "صح: الـ fugitive أو grey literature."
