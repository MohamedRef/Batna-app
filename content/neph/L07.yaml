  - id: neph.L07.126
    kind: enumerate
    topic: tsc
    prompt: Mention the most common clinical manifestations of TSC.
    points:
      - Seizures
      - Intellectual disability and/or autism
      - Skin lesions (facial angiofibromas, hypomelanotic macules, ungual fibromas)
      - Interstitial lung disease
      - Tumors of brain, retina, kidney and heart
    pass: 4
    hook: "TSC = «تشنج، تأخر، جلد، رئة، وأورام في 4 أماكن»: seizures، intellectual disability و/أو autism، skin (facial angiofibromas، hypomelanotic macules، ungual fibromas)، interstitial lung disease، وtumors في المخ والشبكية والكلية والقلب."
    src: { page: 170, quote: "The clinical features of TSC1- and TSC2-linked disease are similar, although TSC2-linked disease tends to be more severe. The most common clinical manifestations include seizures, intellectual disability and/or autism, skin lesions, interstitial lung disease, and tumors in the brain, retina, kidney, and heart. In affected individuals over 5 years of age, the most common skin lesions are facial angiofibromas (Fig. 45.7), hypomelanotic macules, and ungual fibromas." }
    status: unverified
  - id: neph.L07.127
    kind: cloze
    topic: tsc
    text: "Renal lesions in TSC: angiomyolipomas {{c1::85%}}, cysts {{c2::30–47%}} and renal cell carcinoma {{c3::2–3%}}."
    src: { page: 171, quote: "Kidney involvement occurs frequently in TSC, with renal lesions that include angiomyolipomas (AMLs; 85%), cysts (30% to 47%), and renal cell carcinoma (RCC) (2% to 3%).24,28 Other renal neoplasms, interstitial fibrosis with focal segmental glomerulosclerosis (FSGS), glomerular microhamartomas, and peripelvic and perirenal lymphangiomatous cysts also have been reported. Renal involvement in TSC often pro-gresses insidiously, but can result in considerable morbidity, including retroperitoneal hemorrhage, renal impairment (~1%), and death. Renal complications are the most frequent cause of death in TSC.24" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.128
    kind: card
    topic: tsc
    front: What is the most frequent cause of death in TSC?
    back: Renal complications (retroperitoneal hemorrhage, renal impairment).
    src: { page: 171, quote: "Kidney involvement occurs frequently in TSC, with renal lesions that include angiomyolipomas (AMLs; 85%), cysts (30% to 47%), and renal cell carcinoma (RCC) (2% to 3%).24,28 Other renal neoplasms, interstitial fibrosis with focal segmental glomerulosclerosis (FSGS), glomerular microhamartomas, and peripelvic and perirenal lymphangiomatous cysts also have been reported. Renal involvement in TSC often pro-gresses insidiously, but can result in considerable morbidity, including retroperitoneal hemorrhage, renal impairment (~1%), and death. Renal complications are the most frequent cause of death in TSC.24" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.129
    kind: card
    topic: tsc
    front: What is a renal angiomyolipoma made of?
    back: Abnormal thick-walled vessels, smooth muscle-like cells and adipose tissue (a benign hamartoma).
    src: { page: 172, quote: "AMLs are benign renal hamartomas composed of abnormal, thick-walled vessels and varying amounts of smooth muscle-like cells and adipose tissue (Fig. 45.8A and B). These are the most common renal lesions in patients with TSC, evident in approximately 80% of TSC patients by age 10 years. 24 Whereas solitary AMLs are found in the general population, particularly among older women, TSC-associated AMLs are multiple and bilateral, rarely occurring before 5 years of age, but increasing in frequency and size with age. 24 They can become locally invasive, extending into the perirenal fat or more rarely, the collecting system, renal vein, and even the inferior vena cava and right atrium. Clinical manifestations occur secondary to hemorrhage (intratumoral or retroperitoneal) or mass effects (abdominal or flank masses and tenderness, hypertension, renal impairment). Women tend to have more numerous and larger AML than men. Pregnancy appears to increase the risk for rupture and hemorrhage." }
    status: unverified
  - id: neph.L07.130
    kind: card
    topic: tsc
    front: How do TSC-associated AMLs differ from sporadic AMLs?
    back: Sporadic AMLs are solitary, mostly in older women. TSC AMLs are multiple and bilateral, rare before age 5, growing in number and size with age (about 80% by age 10).
    src: { page: 172, quote: "AMLs are benign renal hamartomas composed of abnormal, thick-walled vessels and varying amounts of smooth muscle-like cells and adipose tissue (Fig. 45.8A and B). These are the most common renal lesions in patients with TSC, evident in approximately 80% of TSC patients by age 10 years. 24 Whereas solitary AMLs are found in the general population, particularly among older women, TSC-associated AMLs are multiple and bilateral, rarely occurring before 5 years of age, but increasing in frequency and size with age. 24 They can become locally invasive, extending into the perirenal fat or more rarely, the collecting system, renal vein, and even the inferior vena cava and right atrium. Clinical manifestations occur secondary to hemorrhage (intratumoral or retroperitoneal) or mass effects (abdominal or flank masses and tenderness, hypertension, renal impairment). Women tend to have more numerous and larger AML than men. Pregnancy appears to increase the risk for rupture and hemorrhage." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.131
    kind: card
    topic: tsc
    front: How do renal AMLs present, and what raises the rupture risk?
    back: Through hemorrhage (intratumoral or retroperitoneal) or mass effect (flank mass, tenderness, hypertension, renal impairment). Women have more and larger AMLs; pregnancy raises the risk of rupture.
    src: { page: 172, quote: "AMLs are benign renal hamartomas composed of abnormal, thick-walled vessels and varying amounts of smooth muscle-like cells and adipose tissue (Fig. 45.8A and B). These are the most common renal lesions in patients with TSC, evident in approximately 80% of TSC patients by age 10 years. 24 Whereas solitary AMLs are found in the general population, particularly among older women, TSC-associated AMLs are multiple and bilateral, rarely occurring before 5 years of age, but increasing in frequency and size with age. 24 They can become locally invasive, extending into the perirenal fat or more rarely, the collecting system, renal vein, and even the inferior vena cava and right atrium. Clinical manifestations occur secondary to hemorrhage (intratumoral or retroperitoneal) or mass effects (abdominal or flank masses and tenderness, hypertension, renal impairment). Women tend to have more numerous and larger AML than men. Pregnancy appears to increase the risk for rupture and hemorrhage." }
    status: unverified
  - id: neph.L07.132
    kind: card
    topic: tsc
    front: Which renal imaging finding strongly suggests TSC?
    back: Renal cysts together with fat-containing angiomyolipomas (easily seen on CT).
    src: { page: 172, quote: "However, like AML, renal cysts tend to increase in size and number over time. The concurrence of cysts and AMLs, easily detected by CT, is strongly suggestive of TSC." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.133
    kind: card
    topic: tsc
    front: What is unique about the cyst lining in TSC?
    back: Large acidophilic epithelial cells with large hyperchromatic nuclei and occasional mitoses; papillary hyperplasia and adenomas are common.
    src: { page: 172, quote: "The cysts in TSC can develop in any nephron segment. When limited in number and size, TSC-related cysts are predominantly cortical. In some cases, glomerular cysts predominate.17 The cystic lining epithelia appear to be unique to TSC, with large and acidophilic epithelia con-taining large hyperchromatic nuclei with occasional mitotic figures (see Fig. 45.8C). Associated papillary hyperplasia and adenomas are common." }
    status: unverified
  - id: neph.L07.134
    kind: card
    topic: tsc
    front: Which TSC infants have massive cystic kidneys and early ESRD?
    back: Mostly those with a contiguous germline deletion of TSC2 and PKD1 (PKDTS); ESRD in the second or third decade.
    src: { page: 173, quote: "A small subset of affected infants can present with massive renal cystic disease, severe hypertension, and a progressive decline in renal function with the onset of ESRD in the second or third decade of life. The majority of these patients have a contiguous germ-line deletion involving both the TSC2 and PKD1 genes, the PKDTS contiguous gene." }
    status: unverified
  - id: neph.L07.135
    kind: enumerate
    topic: tsc
    prompt: Mention the features of TSC-associated renal cell carcinoma.
    points:
      - Female predominance
      - Younger age at diagnosis
      - Association with AML
      - Multiplicity
      - Slow progression (indolent)
      - Commonest type papillary RCC
    pass: 4
    hook: "RCC في TSC = «ست صغيرة، صاحبة AML، كتيرة، هادية، وpapillary»: female predominance، younger age، association with AML، multiplicity، indolent، والأشهر papillary RCC. 6."
    src: { page: 173, quote: "Renal neoplasms Benign epithelial tumors, such as papillary adenomas and oncocytomas, are common in patients with TSC and can be multifocal. However, malignant transformation is rare, with a 2% to 3% lifetime risk for developing RCC. TSC- associated RCCs have a unique constellation of clinicopathologic features, including female predominance, younger age at diagnosis, association with AML, multiplicity, and slow progres-sion.30 Three distinct histopathologic patterns predominant, with papil-lary RCC being most common, followed by hybrid oncocytic/chromophobe tumor, and RCC with granular eosinophilic morphology. Although TSC-associated RCCs tend to have an indolent clinical course." }
    status: unverified
  - id: neph.L07.136
    kind: table
    topic: tsc
    title: Clinical diagnostic criteria for TSC (Box 45.1)
    columns: [Group, Features]
    rows:
      - [Major, "Facial angiofibromas or forehead plaque, ungual or periungual fibroma, hypomelanotic macules (>3), shagreen patch, retinal hamartomas, cortical tubers, subependymal nodule, subependymal giant cell astrocytoma, cardiac rhabdomyoma, lymphangioleiomyomatosis, renal angiomyolipoma"]
      - [Minor, "Dental pits, hamartomatous GI or rectal polyps, bone cysts, white matter migration lines, gingival fibromas, nonrenal hamartoma, retinal achromic patch, confetti skin lesions, multiple renal cysts"]
      - [Definite TSC, "2 major, or 1 major + 2 minor"]
      - [Probable TSC, "1 major + 1 minor"]
      - [Possible TSC, "1 major, or 2 minor"]
    blanks: [[2, 1], [3, 1], [4, 1]]
    src: { page: 174, quote: "BOX 45.1 Clinical Diagnostic Criteria for Tuberous Sclerosis Complex*\nMajor\n  Facial angiofibromas or forehead plaque\n  Nontraumatic ungual or periungual fibroma\n  Hypomelanotic macules (>3)\n  Shagreen patch (connective tissue nevus)\n  Multiple retinal nodular hamartomas\n  Cortical tuber(s)\n  Subependymal nodule\n  Subependymal giant cell astrocytoma\n  Cardiac rhabdomyoma(s) (≥1)\n  Lymphangioleiomyomatosis\n  Renal angiomyolipoma\nMinor\n  Multiple, random dental pits\n  Hamartomatous gastrointestinal or rectal polyps\n  Bone cysts\n  White matter radial migration lines\n  Gingival fibromas\n  Nonrenal hamartoma\n  Retinal achromic patch\n  \"Confetti\" skin lesions\n  Multiple renal cysts\n*Two major features or one major feature with two minor features indicate definite TSC, one major feature and one minor feature indicate probable TSC, and one major feature or two minor features indicates possible TSC." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.137
    kind: mcq
    topic: tsc
    stem: A 19-year-old has facial angiofibromas and bilateral renal angiomyolipomas. How is the TSC diagnosis classed?
    options:
      - Definite TSC (two major features)
      - Probable TSC
      - Possible TSC
      - Not TSC; AMLs are a minor feature
      - Needs genetic testing before any label
    answer: 0
    why:
      - "Correct: facial angiofibroma and renal AML are both major features; two majors = definite (p174)."
      - Probable is one major plus one minor.
      - Possible is one major or two minors.
      - Renal AML is a major feature; multiple renal cysts are the minor one.
      - The clinical criteria alone are enough here.
    src: { page: 174, quote: "Two major features or one major feature with two minor features indicate definite TSC, one major feature and one minor feature indicate probable TSC, and one major feature or two minor features indicates possible TSC." }
    status: unverified
  - id: neph.L07.138
    kind: card
    topic: tsc
    front: How are TSC renal lesions monitored, and why not ultrasound alone?
    back: Abdominal CT or MRI every 1–3 years for life. Ultrasound finds fat-rich AMLs and cysts but misses fat-poor lesions.
    src: { page: 174, quote: "Current recommendations are to perform abdominal CT (Fig. 45.9) or magnetic resonance imaging (MRI) every 1 to 3 years for life to assess AML progression and renal cystic disease. On occasion, the dis-tinction between an AML and RCC cannot be reliably established by imaging and biopsy is indicated. Gene-based diagnosis is currently available for TSC1- and TSC2-" }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.139
    kind: card
    topic: tsc
    front: When is a biopsy indicated for a TSC renal lesion?
    back: When imaging cannot reliably separate an AML from RCC.
    src: { page: 174, quote: "Current recommendations are to perform abdominal CT (Fig. 45.9) or magnetic resonance imaging (MRI) every 1 to 3 years for life to assess AML progression and renal cystic disease. On occasion, the dis-tinction between an AML and RCC cannot be reliably established by imaging and biopsy is indicated. Gene-based diagnosis is currently available for TSC1- and TSC2-" }
    status: unverified
  - id: neph.L07.140
    kind: card
    topic: tsc
    front: Why do large AMLs need preemptive treatment, and with what?
    back: They develop micro- and macroaneurysms; hemorrhage risk correlates with aneurysms over 5 cm. Treat with nephron-sparing surgery or embolization.
    src: { page: 175, quote: "Renal AMLs are generally benign and require no treatment. Larger AMLs frequently develop micro- and macro-aneurysms, and the risk for serious hemorrhage correlates with aneurysms over 5-cm in diam-eter.24 Therefore these large AMLs require preemptive treatment with either nephron-sparing surgery or embolization. In addition to size and complications such as pain or hemorrhage, the inability to exclude an associated RCC should prompt intervention. When an associated malignancy cannot be excluded, nephron- sparing surgery, such as enucleation or partial nephrectomy is preferred. Female sex hormones may accelerate AML growth. Therefore it is prudent to caution women with multiple AMLs about the potential risks of pregnancy and estrogen administration." }
    update:
      text: "The book prints aneurysms over 5 cm, almost certainly a misprint: the data behind it (Yamakado 2002) link rupture to an intratumoral aneurysm of 5 mm or more, with an AML of 4 cm or more. An aneurysm over 5 cm is not a real clinical marker. In the exam, give the book's answer."
      ref: "Yamakado et al., Radiology 2002 (renal angiomyolipoma: tumor size, aneurysm formation and rupture)"
    status: unverified
    tags: [high-yield]
