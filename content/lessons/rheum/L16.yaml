      - kind: explain
        remind: [rheum.L16.188]
        page: 274
        title: "الـ JAK-STAT في 4 خطوات"
        quote: "JAK inhibitors are small molecules that bind to JAKs preventing ATP binding and subsequent intracellular signalling"
        text: |
          1. الـ cytokine يمسك الـ receptor.
          2. الـ **Janus kinase (JAK)** يتفعّل ويتعمله phosphorylation، ويعمل phosphorylation للـ receptor.
          3. الـ **signal transducer and activator of transcription (STAT)** يتعمله phosphorylation ويبقى dimer.
          4. الـ dimer يدخل النواة ويشغّل genes.

          الـ ==JAK inhibitors== جزيئات صغيرة بتقعد مكان الـ **adenosine triphosphate (ATP)** في الـ JAK، فالسلسلة كلها تقف. 4 janus kinases (JAKs): **JAK1، JAK2، JAK3، tyrosine kinase 2 (TYK2)**.

          ميزتهم: **oral**، مش protein فمفيش neutralizing antibodies ولا allergy، وبيوقفوا cytokines كتير مرّة واحدة.

          يعني دوا واحد بيقفل الطريق اللي cytokines كتير بتمشي فيه، علشان كده تأثيره واسع وأعراضه كمان واسعة.
      - kind: match
        page: 275
        quote: "Xeljanz (tofacitinib) JAK1/JAK2/JAK3 is indicated for the treatment of rheumatoid arthritis, psoriatic arthritis, ankylosing spondylitis, ulcerative colitis and juvenile idiopathic arthritis."
        prompt: "وصّل كل JAK inhibitor بالـ JAKs بتوعه:"
        pairs:
          - ["Tofacitinib (Xeljanz)", "JAK1/JAK2/JAK3"]
          - ["Baricitinib (Olumiant)", "JAK1/JAK2"]
          - ["Upadacitinib (Rinvoq)", "JAK1 (with PsA, AS)"]
          - ["Filgotinib (Jyseleca)", "JAK1 (with UC)"]
        why: "Tofacitinib الأوسع (1/2/3). Baricitinib 1/2 (و atopic dermatitis و alopecia). Upadacitinib و filgotinib JAK1. الـ US Food and Drug Administration (FDA) وافقت لـ RA على tofacitinib و baricitinib و upadacitinib."
      - kind: reveal
        page: 275
        quote: "Key cytokines involved in RA pathophysiology signal through JAKs"
        prompt: "ليه الـ JAK inhibitors ممكن تغيّر الـ haemoglobin والـ neutrophils والـ lymphocytes؟"
        answer: |
          بص على جدول الكتاب في ص 275: كل receptor بيشتغل بـ JAKs معيّنة. الـ **EPO** والـ **TPO** والـ **GM-CSF** والـ IL-3 والـ IL-5 بيشتغلوا على ==JAK2==، وشغلتهم erythropoiesis و myelopoiesis و platelets. والـ γ-chain cytokines (IL-2، IL-7، IL-15…) على **JAK1/JAK3**، وشغلتهم نمو الـ lymphocytes.

          فلما تقفل الـ JAK علشان توقف الـ cytokines بتاعة الالتهاب، بتلمس كمان الإشارات اللي بتعمل الدم. علشان كده الكتاب بيكتب في الأعراض: **potential changes in lymphocytes, neutrophils, hemoglobin**.
      - kind: explain
        remind: [rheum.L16.191]
        page: 276
        title: "ORAL Surveillance: التحذير"
        quote: "Major adverse cardiovascular events (MACE)."
        text: |
          الـ tofacitinib (5 و 10 mg twice daily (BID)) قصاد الـ TNF inhibitors. طلع فيه أكتر:
          - ==Major adverse cardiovascular events (MACE)== (MI، stroke، cardiovascular (CV) death)
          - **Malignancy**
          - ==Venous thromboembolism (VTE)==
          - All-cause mortality
          - Serious infections

          والـ **baricitinib** (دراسة B023 observational): MACE و VTE أكتر.

          غير كده: URTI، صداع، إسهال، **herpes zoster** زيادة، lipids و liver enzymes، تغيّرات في الـ lymphocytes والـ neutrophils والـ Hb، gastrointestinal (GI) perforation، و **ممنوع live vaccines**.

          علشان كده قبل أي JAK inhibitor بتسأل عن السن والتدخين والـ CV risk (الـ EULAR footnote ص 262).
      - kind: reveal
        page: 276
        quote: "Increased incidence of herpes Zooster is reported."
        prompt: "ليه الـ herpes zoster بالذات بيزيد مع الـ JAK inhibitors؟ وليه ممنوع live vaccines؟"
        answer: |
          في جدول ص 275 الـ **type 1 IFNs** والـ IFN-γ بيشتغلوا على JAK1 و TYK2 و JAK2، وشغلتهم **antiviral**.

          التفسير المقبول (مش في الكتاب): الـ varicella zoster virus نايم في العقد العصبية من وانت صغير، والـ interferons هي اللي ماسكاه. اقفلها، يصحى ويطلع ==zoster==. ونفس المنطق مع الـ **live vaccines**: الفيروس المضعّف في اللقاح ممكن يعمل عدوى حقيقية لما الـ antiviral defence يقل.
      - kind: aside
        tone: joke
        page: 276
        quote: "Other adverse reactions\n  The most commonly reported adverse reactions: upper respiratory tract infections, headache, diarrhea and nasopharyngitis.\n  Avoid use during an active serious infection, Gastrointestinal Perforations.\n  Potential changes in lymphocytes, neutrophils, hemoglobin.\n  Elevation of liver enzymes and lipids.\n  Immunizations – Live vaccines: Avoid use with XELJANZ.\n  Increased incidence of herpes Zooster is reported."
        text: "الـ JAK inhibitor زي الموبايل الجديد: سريع ومريح وبتاخده بالبُق. بس اقرا الـ terms and conditions: MACE و VTE و zoster، وممنوع تنزّل live vaccines."
      - kind: explain
        remind: [rheum.L16.199]
        page: 277
        title: "يعني إيه biosimilar؟"
        quote: "The EMA defines a biosimilar as 'a biological medicinal product that contains a version of the active substance of an already authorised' bio-originator, for which 'similarity to the reference product in terms of quality characteristics, biological activity, safety and efficacy' has been demonstrated."
        text: |
          الـ ==biosimilar== (EMA): دوا biological فيه **نسخة** من الـ active substance بتاع bio-originator متوافق عليه، واتثبت إنه شبهه في الـ quality والـ activity والـ safety والـ efficacy.

          - الموافقة **stepwise**: analytical الأول، بعدين PK/PD و immunogenicity و efficacy و safety: "no clinically meaningful differences".
          - **لا أحسن ولا أوحش** في الـ efficacy، ومش أقل في الـ safety.
          - ==مش generic== ولا biomimetic ولا biocopy.
          - موجود لـ infliximab و adalimumab و etanercept و rituximab.
          - تجربة واحدة في indication واحد تكفي للـ **extrapolation** للباقي، وبيرخّص العلاج.
      - kind: reveal
        page: 277
        quote: "A Biosimilar is not a biomimetic a biocopy or a generic."
        prompt: "ليه الـ biosimilar مش generic، مع إنه نسخة؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ **generic** جزيء كيميا صغير، تقدر تصنعه **مطابق** ذرّة بذرّة. الـ biological protein كبير ومعمول جوّه **خلايا حية**، وكل مصنع وكل batch بيطلع فيه فروق صغيرة (السكريات اللي عليه مثلًا)، فمستحيل تعمله "نفس الشيء" بالظبط.

          علشان كده الكتاب بيطلب **stepwise approach** و ==totality of the evidence==: تثبت إن مفيش **clinically meaningful differences**، مش إنه مطابق. ولما يثبت، الكتاب بيقول إنه بيرخّص العلاج ويوسّع الوصول له.
      - kind: check
        page: 277
        quote: "A Biosimilar is not a biomimetic a biocopy or a generic."
        question: "Which statement about a biosimilar is true?"
        options:
          - "Efficacy in one indication can be extrapolated to the originator's other indications"
          - "It is a generic with an identical molecule"
          - "It is expected to be more effective than the originator"
          - "It needs a new trial in every disease"
        answer: 0
        why:
          - "صح: equivalent في الـ physicochemical والـ PK، فإثبات واحد يكفي."
          - "الكتاب: الـ biosimilar مش generic."
          - "لا أحسن ولا أوحش في الـ efficacy."
          - "مش محتاج، الـ extrapolation مسموح."
