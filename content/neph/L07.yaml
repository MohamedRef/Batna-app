  - id: neph.L07.188
    kind: card
    topic: fabry
    front: How is Fabry disease confirmed?
    back: "Decreased (below 15%) or absent α-Gal A activity in serum, leukocytes, fibroblasts or tissue. If equivocal: slit-lamp exam, urinary ceramide digalactoside and trihexoside, and genetic testing."
    src: { page: 192, quote: "Diagnosis of affected males usually can be made clinically, with the additional information from slit-lamp eye examination to identify corneal opacities. The diagnosis should be confirmed by demonstrating decreased (<15%) or absent a-Gal A activity in serum, leukocytes, cultured skin fibroblasts, or tissue. Atypical variants may have enzyme activity up to carriers. If enzyme levels are equivocal, alternative approaches to diagnosis include careful slit-lamp eye examination, measurement of urinary ceramide digalactoside and trihexoside, and genetic testing." }
    status: unverified
    tags: [high-yield, numbers]
  - id: neph.L07.189
    kind: enumerate
    topic: fabry
    prompt: Mention the benefits of agalsidase (enzyme replacement) in trials.
    points:
      - Lower plasma and urine Gb3
      - Less neuropathic pain
      - Better quality of life
      - Clearing of Gb3 from kidney, heart and skin
      - Better cerebral blood flow
      - Stable renal function in mild to moderate impairment over 1–2 years
    pass: 4
    hook: "Agalsidase بيكنس الـ Gb3 ويحسّن 6: Gb3 أقل في الـ plasma والـ urine، neuropathic pain أقل، quality of life أحسن، Gb3 اتشال من الكلية والقلب والجلد، cerebral blood flow أحسن، وrenal function ثابتة في mild to moderate impairment على 1–2 سنة. «أقل، أقل، أحسن، نضيف، أحسن، ثابت»."
    src: { page: 192, quote: "Treatment The introduction of enzyme replacement therapy with recombinant human a-Gal A (agalsidase) has transformed the treatment of Fabry disease. Randomized clinical trials showed that agalsidase administra-tion for 5 to 6 months resulted in reduced plasma and urine Gb3; amelioration of neuropathic pain; enhanced quality of life; clearing of Gb3 deposits from kidney, heart, and skin; and improved cerebral blood flow.46 A multicenter longitudinal study showed that agalsidase stabilized renal function in patients with mild to moderate renal impairment at over 1 to 2 years of treatment. However, the impact of enzyme replace-ment therapy on long-term renal outcome is still unclear. Addition of RAS blockade to enzyme replacement can result in sustained reductions in proteinuria. In patients with ESRD, agalsidase may be infused during hemodialysis because there is little clearance of the enzyme by hemo-dialysis. Agalsidase therapy has been recommended for all affected males and symptomatic carrier females, but the drug is prohibitively expensive." }
    status: unverified
  - id: neph.L07.190
    kind: card
    topic: fabry
    front: In Fabry patients on hemodialysis, when can agalsidase be given, and who should get it?
    back: During hemodialysis, because dialysis barely clears the enzyme. Recommended for all affected males and symptomatic carrier females (very expensive); add RAS blockade for proteinuria.
    src: { page: 192, quote: "Treatment The introduction of enzyme replacement therapy with recombinant human a-Gal A (agalsidase) has transformed the treatment of Fabry disease. Randomized clinical trials showed that agalsidase administra-tion for 5 to 6 months resulted in reduced plasma and urine Gb3; amelioration of neuropathic pain; enhanced quality of life; clearing of Gb3 deposits from kidney, heart, and skin; and improved cerebral blood flow.46 A multicenter longitudinal study showed that agalsidase stabilized renal function in patients with mild to moderate renal impairment at over 1 to 2 years of treatment. However, the impact of enzyme replace-ment therapy on long-term renal outcome is still unclear. Addition of RAS blockade to enzyme replacement can result in sustained reductions in proteinuria. In patients with ESRD, agalsidase may be infused during hemodialysis because there is little clearance of the enzyme by hemo-dialysis. Agalsidase therapy has been recommended for all affected males and symptomatic carrier females, but the drug is prohibitively expensive." }
    status: unverified
  - id: neph.L07.191
    kind: card
    topic: fabry
    front: What are the limits of kidney transplantation in Fabry disease?
    back: It treats advanced nephropathy but not extrarenal disease; coronary and cerebrovascular disease remain the main causes of death. Recipients can receive agalsidase.
    src: { page: 193, quote: "Renal transplantation is an effective treatment for advanced Fabry nephropathy but does not ameliorate the extra renal manifestations. Transplanted kidneys from deceased donors or unaffected living donors may develop glycosphingolipid inclusions, but this usually is not clini-cally significant. Fabry heterozygotes should not become kidney donors. Coronary artery and cerebrovascular disease are the major causes of mortality in patients with Fabry disease who have undergone renal transplantation. Renal allograft recipients with Fabry disease are can-didates for agalsidase treatment." }
    status: unverified
