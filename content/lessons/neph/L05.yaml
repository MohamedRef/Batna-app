          الـ **neutrophil gelatinase-associated lipocalin (NGAL)** هو ==troponin== الكلية: بيطلع بعد ساعتين من الـ bypass، والكرياتينين لسه بيشرب شاي في الكافيتيريا.
      - kind: explain
