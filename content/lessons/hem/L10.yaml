schema: batna.lesson/v1
lecture: hem.L10
lessons:
  # ------------------------------------------------------------------
  - id: hem.L10.lesson1
    title: "دم تقيل: حقيقي ولا وهمي؟ وإيه اللي بيحصل في الـ PV"
    hook: "مش كل Hb عالي polycythemia حقيقية، والـ PV بتصنع كرات حمرا من غير ما حد يطلب."
    minutes: 8
    pages: [156, 157]
    topics: [definitions, pv-biology]
    goals:
      - "تفرّق بين true و secondary و relative polycythemia"
      - "تشرح الـ pathophysiology بتاعة الـ PV"
      - "تحفظ نسب JAK2 V617F و exon 12"
    status: unverified
    steps:
      - kind: explain
        page: 156
        title: "التلات أنواع"
        quote: "True Polycythemia refers to an absolute increase in total blood cell volume or mass manifested as raised HB concentration or packed cell volume (PCV)."
        text: |
          - ==True polycythemia==: زيادة **absolute** في الـ **red cell mass**، بتبان كـ Hb أو **PCV** عالي. ودي نوعين:
          - **Primary**: الـ **polycythemia vera** (clonal).
          - **Secondary**: **erythropoietin** عالي، مع **hypoxia** أو من غيرها.
          - **Relative polycythemia**: Hb عالي بس علشان الـ **plasma volume** قلّ. الكرات الحمرا نفسها مش زايدة.
      - kind: figure
        page: 156
        quote: "Relative polycythemia a raised Hb concentration secondary to reduction in plasma volume."
        title: "كوبايتين: كرات أكتر ولا مية أقل؟"
        alt: "Three tubes of blood. Normal: red cells fill the lower part, plasma above. True polycythemia: a taller red cell column with normal plasma. Relative polycythemia: the same red cell column as normal but less plasma, so the tube is shorter and the red fraction looks higher."
        caption: "في الـ ==relative== الكرات زي ما هي، بس البلازما قلّت، فالنسبة (Hct) تعلى. علشان كده الـ **red cell mass** هو اللي بيفصل."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <rect x="35" y="30" width="60" height="180" rx="8" class="fg-ink"/>
            <rect x="37" y="130" width="56" height="78" class="fg-dot-bad"/>
            <rect x="37" y="32" width="56" height="98" class="fg-acc"/>
            <text x="65" y="232" text-anchor="middle" class="t-sm t-b">Normal</text>
            <rect x="135" y="30" width="60" height="180" rx="8" class="fg-ink"/>
            <rect x="137" y="90" width="56" height="118" class="fg-dot-bad"/>
            <rect x="137" y="32" width="56" height="58" class="fg-acc"/>
            <text x="165" y="232" text-anchor="middle" class="t-sm t-b">True</text>
            <text x="165" y="248" text-anchor="middle" class="t-sm t-mut">more red cells</text>
            <rect x="235" y="90" width="60" height="120" rx="8" class="fg-ink"/>
            <rect x="237" y="130" width="56" height="78" class="fg-dot-bad"/>
            <rect x="237" y="92" width="56" height="38" class="fg-acc"/>
            <text x="265" y="232" text-anchor="middle" class="t-sm t-b">Relative</text>
            <text x="265" y="248" text-anchor="middle" class="t-sm t-mut">less plasma</text>
            <text x="65" y="20" text-anchor="middle" class="t-sm t-mut">plasma</text>
            <text x="165" y="20" text-anchor="middle" class="t-sm t-mut">plasma</text>
          </svg>
      - kind: check
        page: 156
        quote: "Relative polycythemia a raised Hb concentration secondary to reduction in plasma volume."
        question: "Hb is high but the red cell mass is normal and plasma volume is low. Which type?"
        options: ["Relative polycythemia", "Polycythemia vera", "Secondary polycythemia", "Primary familial polycythemia"]
        answer: 0
        why:
          - "صح: الكرات زي ما هي والبلازما قلّت."
          - "الـ PV فيها red cell mass عالي."
          - "الـ secondary كمان red cell mass عالي."
          - "الـ primary familial true polycythemia."
      - kind: explain
        page: 156
        title: "الـ PV: مصنع شغال لوحده"
        quote: "Erythropoiesis is autonomous independent on erythropoietin. Serum erytrpoietin level is normal or reduced."
        text: |
          الـ **PRV** = **neoplastic clonal disorder** في الـ stem cell، بتكتّر **التلات lineages** (erythroid، myeloid، megakaryocytic)، ومعاها خطر **thrombosis**.

          ==Erythropoiesis is autonomous==: مش مستنية **EPO**. وعلشان الجسم شايف كرات كتير، الكلى بتقفل الـ EPO، فيبقى **normal أو reduced**.
      - kind: aside
        tone: analogy
        page: 156
        quote: "Erythropoiesis is autonomous independent on erythropoietin."
        text: "الـ EPO (erythropoietin) زي مدير المصنع. في الـ secondary المدير بيزعّق «اشتغلوا أكتر» (EPO عالي). في الـ PV العمال شغالين لوحدهم والمدير قاعد ساكت (EPO واطي). علشان كده الـ **EPO** أهم تحليل يفرّق بينهم."
      - kind: explain
        page: 157
        title: "الـ molecular زيادة"
        quote: "Hypersensetivity of erythroid pogenitors to growth factors as insulin like growth factor, thrombopoietin, IL-3 and GM-CSF."
        text: |
          - **Hypersensitivity** للـ growth factors: **IGF، TPO، IL-3، GM-CSF**.
          - **Chromosomal abnormalities** في **20–30%**، non-specific؛ أشهرها ==del 20q==، وكمان trisomy 20 و 8 و 9، و 1q dup و 13q del.
          - **PRV1** overexpression في الـ granulocytes (بيفرّق primary من secondary).
          - **Bcl-xL** زيادة (anti-apoptotic)، و **c-mpl** (TPO receptor) أقل.
      - kind: explain
        page: 157
        title: "JAK2: تقريبًا كلهم"
        quote: "approximately 96% and 3% displaying somatic activating mutations in exon 14 (JAK2V617F) and exon 12 of JAK2, respectively."
        text: |
          - **96%**: ==JAK2 V617F== (exon **14**).
          - **3%**: **JAK2 exon 12**: أصغر سنًا، erythroid بس، و EPO **subnormal**، والـ prognosis زي الـ V617F.
          - الطفرة بتشغّل **JAK2–STAT5، PI3K، ERK، Akt** على طول، فالخلايا تكبر من غير cytokines أو مع EPO قليل جدًا.
          - وجود الطفرة أو الـ **allele burden** ما بيغيّرش الـ survival ولا الـ leukemic transformation، بس الـ burden العالي مرتبط بـ **pruritus** و **fibrotic transformation**.
      - kind: mnemonic
        page: 157
        quote: "approximately 96% and 3% displaying somatic activating mutations in exon 14 (JAK2V617F) and exon 12 of JAK2, respectively."
        word: "FT"
        parts:
          - { key: "F", text: "Fourteen: exon 14 = V617F, 96%" }
          - { key: "T", text: "Twelve: exon 12, 3%, younger, pure erythroid, low EPO" }
        hook: "**F** قبل **T** في الأبجدية بس **14** أكبر من **12**: الـ 14 هو الكبير (96%)، والـ 12 هو الصغير (3%) وصاحبه أصغر سنًا."
      - kind: check
        page: 157
        quote: "JAK2 exon 12 mutation-positive patients usually present with predominantly erythroid myelopoiesis, subnormal serum erythropoietin level and younger age at diagnosis"
        question: "34-year-old, isolated high Hb, low EPO, JAK2 V617F negative. Next test?"
        options: ["JAK2 exon 12", "BCR-ABL1", "CALR", "Serum B12"]
        answer: 0
        why:
          - "صح: الصورة دي بالظبط exon 12."
          - "الـ BCR-ABL1 للـ CML."
          - "الـ CALR في ET و PMF."
          - "الـ B12 بيعلى في الـ PV بس مش بيأكدها."
      - kind: try
        items: [hem.L10.001, hem.L10.003, hem.L10.005, hem.L10.011, hem.L10.015]
    recap:
      - "True = red cell mass عالي (primary PV أو secondary بـ EPO). Relative = البلازما قلّت."
      - "الـ PV clonal، التلات lineages، erythropoiesis مستقلة عن EPO، فالـ EPO normal أو واطي."
      - "Chromosomes 20–30% (del 20q الأشهر)، PRV1، Bcl-xL، c-mpl أقل."
      - "JAK2 V617F (exon 14) 96%، exon 12 3% (صغير، erythroid، EPO واطي)."
    practice: [hem.L10.001, hem.L10.002, hem.L10.003, hem.L10.004, hem.L10.005, hem.L10.006, hem.L10.007, hem.L10.008, hem.L10.009, hem.L10.010, hem.L10.011, hem.L10.012, hem.L10.013, hem.L10.014, hem.L10.015, hem.L10.016]
