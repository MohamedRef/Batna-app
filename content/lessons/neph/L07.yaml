      - kind: update
        page: 175
        quote: "Larger AMLs frequently develop micro- and macro-aneurysms, and the risk for serious hemorrhage correlates with aneurysms over 5-cm in diam-eter.24 Therefore these large AMLs require preemptive treatment with either nephron-sparing surgery or embolization."
        text: "الكتاب كاتب aneurysms **فوق 5 cm**، وده غالبًا غلطة مطبعية: الدراسة اللي الرقم جاي منها (Yamakado 2002) ربطت الـ rupture بـ ==intratumoral aneurysm من 5 mm أو أكتر== مع AML من **4 cm أو أكتر**. Aneurysm فوق 5 cm مش حاجة بنشوفها إكلينيكيًا. في الامتحان اكتب رقم الكتاب، وفي الـ viva أو الشغل افتكر الـ 5 mm."
        ref: "Yamakado et al., Radiology 2002 (renal angiomyolipoma: tumor size, aneurysm formation and rupture)"
      - kind: explain
        page: 175
        title: "ليه الـ mTOR inhibitors، وليه nephron-sparing؟"
        quote: "Defective mTORC1 signaling is a central feature of TSC."
        text: |
          الكتاب بيقول: ==defective mTORC1 signaling== هو قلب الـ TSC، وعلشان كده الـ guidelines بتبدأ بالـ **mTOR inhibitors** (sirolimus و everolimus) للـ AML اللي **asymptomatic، بيكبر، وأكبر من 3 cm**. التفسير المقبول (مش في الكتاب): بروتينات الـ TSC1 والـ TSC2 شغلتها **تفرمل** الـ mTOR. لما يبوظوا، الـ mTOR يشتغل على طول والخلايا تكبر. فالدوا بيرجّع الفرامل اللي ضاعت.

          وليه **nephron-sparing surgery** (enucleation أو partial nephrectomy) لما نحتاج جراحة؟ لأن الـ AML والـ RCC في الـ TSC ==multiple و bilateral==: لو شلت الكلية كلها النهارده، الكلية التانية هتطلع فيها نفس الأورام بكرة.

          والكتاب بينصح الستات اللي عندهم AMLs كتير بالحذر من **الحمل والـ estrogen**، لأن الهرمونات الأنثوية ممكن تسرّع النمو.
      - kind: explain
        page: 176
        title: "الـ cysts والـ RCC والـ ESRD"
        quote: "TSC-associated RCC should be suspected in enlarging, fat-poor lesions or when intratumoral calcifications are present and should be confirmed by biopsy. Because TSC-associated RCC are frequently bilateral, renal-sparing surgery should be performed whenever possible."
        text: |
          - **Cysts**: العلاج الأساسي ==strict blood pressure (BP) control==؛ الـ decompression مش مفيد.
          - **RCC**: شك فيه لو lesion **بتكبر وفيها دهون قليلة** أو فيها **calcification**؛ biopsy، وبما إنه غالبًا bilateral: **renal-sparing surgery**.
          - **end-stage renal disease (ESRD)**: 1 من كل 100، ستات 63%، متوسط **29 سنة**. Dialysis أو زرع، ويُفضّل ==bilateral nephrectomy== قبل الـ RRT (نزيف و malignancy).

          ليه الـ nephrectomy قبل الـ RRT؟ التفسير المقبول (مش في الكتاب): لما المريض يوصل dialysis الكلى مبقتش بتشتغل، بس الـ AMLs لسه ممكن تنزف والـ RCC ممكن يطلع، فشيلها بيشيل الخطر. وليه renal-sparing surgery في الـ RCC؟ لأن المرض bilateral ومتكرر، فلو شلنا كلية كاملة كل مرة هيخلّص الكلى بدري. يعني بنحافظ على كل nephron نقدر عليه.

          ليه الـ ESRD في الـ TSC بييجي في سن صغير (29 سنة)؟ التفسير المقبول (مش في الكتاب): الكلية بتخسر nephrons من تلات جهات مع بعض: الأكياس بتضغط، والـ AMLs بتاخد مكان وبتنزف، والعمليات اللي بتشيل أورام بتشيل nephrons سليمة معاها. علشان كده الحفاظ على كل nephron (ضغط مظبوط، embolization بدل nephrectomy) هو اللي بيأخّر الـ dialysis.
      - kind: check
        page: 175
        quote: "Defective mTORC1 signaling is a central feature of TSC. Recent international TSC guidelines recommend mTOR inhibitors (rapalogs) as the first-line therapy for the treatment of asymptomatic, growing AMLs larger than 3 cm in diameter.28 Sirolimus and everolimus are effective in reducing AML volume and/or postembolization response rates, with an acceptable safety profile, although they have a range of"
        question: "TSC patient with an asymptomatic 4 cm AML that grew on serial CT. First-line?"
        options:
          - "mTOR inhibitor (everolimus)"
          - "Radical nephrectomy"
          - "Tolvaptan"
          - "Observation only, forever"
        answer: 0
        why:
          - "صح: asymptomatic، بيكبر، وأكبر من 3 cm."
          - "الـ nephrectomy الكاملة مش أول خطوة، والـ nephron-sparing هو المفضل لو احتجنا جراحة."
          - "ده للـ autosomal dominant polycystic kidney disease (ADPKD)."
          - "بيكبر وفوق 3 cm، يبقى محتاج علاج."
      - kind: reveal
        page: 176
        quote: "Given the risk for renal hemorrhage related to AML and malignant transfor-mation, it may be advisable that patients with TSC and ESRD undergo bilateral nephrectomy before initiation of renal replacement therapy."
        prompt: "ليه في الـ TSC بنفكّر نشيل الكليتين قبل الـ RRT، مع إننا في الـ ADPKD بطّلنا ده؟"
        answer: |
          الكتاب بيدّي السببين: ==risk for renal hemorrhage== من الـ AML، و **malignant transformation**.

          الفرق عن الـ ADPKD (التفسير المقبول للمقارنة، مش في الكتاب): في الـ ADPKD الكلى القديمة **بتصغر** بعد الزرع ومفيش RCC زيادة، فسيبها. في الـ TSC الكلى مليانة **أوعية شاذة بتنزف** وأورام ممكن تتحول، والكلية اللي خلاص مش شغالة ما عادش فيها حاجة نخاف نخسرها.
