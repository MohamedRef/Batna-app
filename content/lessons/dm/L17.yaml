          - "بيقلل الـ LDL."
      - kind: reveal
        page: 227
        quote: "Parathyroid hormone (PTH) may seem an unlikely candidate for treating osteoporosis due to its well-described deleterious effects on bon. However, intermittent administration of recombinant human parathyroid hormone (both full-length 1-84 or fragment 1-34) stimulates bone formation more than resorption and is effective for reducing fractures in women with osteoporosis. PTH 1-34 (teriparatide) 20- 40 microgram/d has been approved by the FDA for use in women and men at high risk for fracture."
        prompt: "الـ hyperparathyroidism بياكل العضم. إزاي الـ PTH نفسه بيعالج الـ osteoporosis؟"
        answer: |
          السر في كلمة ==intermittent==. الـ PTH المستمر (زي الـ adenoma) بيشغّل الـ resorption. لكن حقنة مرة في اليوم بتعمل نبضة بتشغّل الـ **bone formation more than resorption**.

          الـ **teriparatide (PTH 1-34)** في الكتاب **20–40 microgram/d**، للـ **high risk** رجالة وستات.
      - kind: update
        page: 227
        quote: "Parathyroid hormone (PTH) may seem an unlikely candidate for treating osteoporosis due to its well-described deleterious effects on bon. However, intermittent administration of recombinant human parathyroid hormone (both full-length 1-84 or fragment 1-34) stimulates bone formation more than resorption and is effective for reducing fractures in women with osteoporosis. PTH 1-34 (teriparatide) 20- 40 microgram/d has been approved by the FDA for use in women and men at high risk for fracture."
        text: "الجرعة المرخّصة للـ teriparatide هي **20 microgram subcutaneous مرة في اليوم**."
        ref: "Endocrine Society postmenopausal osteoporosis guideline 2019"
      - kind: explain
        remind: [dm.L17.094]
        page: 227
        title: "الـ denosumab"
        quote: "Denosumab (Prolia) is an antibody directed against a factor (RANKL) involved in the formation of cells that break down bone. Denosumab improves bone mineral density and reduces fractures in postmenopausal women with osteoporosis. It is administered as an injection under the skin once every six months. Although denosumab is generally well-tolerated, side effects can include skin infections (such as cellulitis) and eczema."
        text: |
          ==Anti-RANKL antibody==: بيمنع تكوين الـ osteoclasts. حقنة **subcutaneous كل 6 شهور**.
          - Side effects: **skin infections (cellulitis)**، eczema، **mild transient hypocalcemia**.
          - **لا تديه** لمريض عنده **low calcium** قبل ما تصححه.
          - الكتاب بيحجزه للي **intolerant or unresponsive to bisphosphonates** لأن مفيش long-term safety data.
      - kind: case
        page: 227
        quote: "A mild transient lowering of blood calcium levels has also been reported; however, this is typically not a problem in patients with good kidney function who are taking sufficient calcium and vitamin D. Nevertheless, as this is a relatively new drug, it remains unclear whether this issue will persist. There are no long-term safety data, denosumab is usually reserved for patients who are intolerant of or unresponsive to oral and/or intravenous bisphosphonates. Denosumab should not be administered to patients with low blood calcium levels until these levels are corrected."
        stem: "A 71-year-old woman cannot tolerate oral or IV bisphosphonates. You plan denosumab."
        steps:
