  # ---------- p252-253: RCT and HDL metabolism ----------
  - id: dm.L20.001
    kind: order
    topic: metabolism
    prompt: "Order reverse cholesterol transport as drawn on p252."
    steps:
      - Excess cholesterol leaves peripheral tissues
      - It travels in the blood (on HDL)
      - The liver takes it up
      - The liver excretes it in bile
    src: { page: 252, quote: "Reverse Cholesterol Transport (RCT)" }
    status: unverified
    tags: [high-yield]
  - id: dm.L20.002
    kind: order
    topic: metabolism
    prompt: Order the HDL metabolism figure (p253).
    steps:
      - Lipid-poor ApoA-I takes free cholesterol from the cell through ABCA1
      - Nascent HDL forms
      - LCAT esterifies cholesterol, giving mature HDL
      - Mature HDL delivers cholesteryl ester to the liver through SR-B1
      - The liver excretes cholesterol in bile
    src: { page: 253, quote: "HDL Metabolism" }
    status: unverified
    tags: [high-yield]
  - id: dm.L20.003
    kind: card
    topic: metabolism
    front: "In the HDL metabolism figure, what does CETP do?"
    back: It moves cholesteryl ester from HDL to VLDL and LDL in exchange for triglyceride.
    src: { page: 253, quote: "HDL Metabolism" }
    status: unverified
    tags: [high-yield]
  - id: dm.L20.004
    kind: card
    topic: metabolism
    front: "Name the two routes by which HDL cholesterol reaches the liver (p253 figure)."
    back: "Directly through SR-B1 on the hepatocyte, and indirectly via CETP transfer to LDL, which the liver takes up through the LDL receptor."
    src: { page: 253, quote: "HDL Metabolism" }
    status: unverified
  - id: dm.L20.005
    kind: table
    topic: metabolism
    title: Proteins of HDL metabolism
    columns: [Job, Protein]
    rows:
      - [Effluxes free cholesterol from the cell to lipid-poor ApoA-I, ABCA1]
      - ["Esterifies cholesterol: nascent to mature HDL", LCAT]
      - [Swaps HDL cholesteryl ester for VLDL triglyceride, CETP]
      - [Hepatocyte receptor for HDL cholesteryl ester, SR-B1]
      - [Hepatocyte receptor for LDL, LDL receptor]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 253, quote: "HDL Metabolism" }
    status: unverified
  # ---------- p253-254: anti-atherogenic effects ----------
  - id: dm.L20.006
    kind: enumerate
    topic: anti
    prompt: Mention the anti-atherogenic effects of HDL.
    points:
      - Reverse cholesterol transport
      - "Anti-oxidant: prevents LDL oxidation"
      - "Anti-inflammatory: inhibits endothelial adhesion molecules"
      - "Vasodilator: more NO and prostacyclin, less ET-1"
      - "Anti-thrombotic: less PAF, vWF and tissue factor"
      - "Endothelial protection: EC proliferation, less EC apoptosis"
    pass: 5
    src: { page: 254, quote: "Anti-Oxidant Properties: Prevents oxidation of LDL." }
    status: unverified
    tags: [high-yield]
  - id: dm.L20.007
    kind: card
    topic: anti
    front: How is HDL anti-inflammatory?
    back: It inhibits the expression of adhesion molecules on endothelial cells.
