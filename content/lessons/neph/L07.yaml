        quote: "Ruptured or symptomatic intracranial aneurysm requires surgical clip- ping of the neck of the aneurysm. Asymptomatic aneurysms measuring less than 5 mm, diagnosed by presymptomatic screening, can be observed with repeated magnetic resonance angiography at 6 months, then annu-ally and less frequently after stability of the aneurysm has been estab-lished. If the size increases, surgery is indicated. Definitive management of aneurysms between 6 and 9 mm remains controversial. Surgical intervention is usually indicated for all unruptured aneurysms 10 mm in diameter or larger. For patients with high surgical risk or technically difficult lesions, endovascular treatment with detachable platinum coils may be indicated.29"
