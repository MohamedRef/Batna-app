  # Split from lesson2 on 2026-11-13 (#828): Case 3, HHS in a child.
  - id: dm.L16.lesson5
    title: "HHS في طفل عنده 7 سنين"
    hook: "الـ HHS المفروض مرض كبار عندهم T2DM. الطفل ده نحيف، ومفيش سكر في العيلة، وجه بسكر 954."
    minutes: 9
    pages: [202, 205]
    topics: [child-hhs]
    goals:
      - "تقرا Case 3 وتعرف ليه ده HHS مش DKA"
      - "تفهم ليه الـ HHS من غير كيتونات ومع جفاف شديد"
      - "تعالج pediatric HHS وتعرف تراقب إيه"
    status: unverified
    steps:
      - kind: explain
        page: 202
        title: "Case 3: أسبوع من العطش والبول"
        quote: "A 7-year-old male patient presented to the emergency room with polyuria, polydipsia, weight loss, nocturnal enuresis & decreased activity for 7 7-day duration & history of viral infection 4 weeks prior to the presentation."
        text: |
          ولد 7 سنين، أسبوع من **polyuria** و **polydipsia** ووزن نازل و ==nocturnal enuresis== ونشاط قليل، وكان عنده viral infection من 4 أسابيع. ومفيش T1DM ولا T2DM في العيلة.

          اقرا كل عرض بسببه (التفسير المقبول، مش في الكتاب):
          - **Polyuria**: السكر بيعدّي في البول وبيشدّ مية معاه (osmotic diuresis).
          - **Polydipsia**: الجسم بيعوّض المية اللي راحت.
          - **Enuresis** في طفل كان ناشف بالليل: البول بقى كتير لدرجة إن المثانة مش ملحقة، وده من أشهر أول علامات السكر في الأطفال.
          - **Weight loss**: مية وسعرات خارجين في البول.
      - kind: explain
        page: 203
        title: "الفحص: طفل ناشف خالص"
        quote: "Both weight and height were below the 5th percentile. BMI was 10 kg/m2 ."
        text: |
          - **GCS 13/15**: المخ متأثر.
          - **HR 150** و **BP 105/85**: قلب بيجري يعوّض حجم دم ناقص.
          - **Severely dehydrated**.
          - الوزن والطول تحت ==5th percentile== و **BMI 10**: طفل رفيع جدًا.
          - ==No acanthosis nigricans==.

          ليه الكتاب كتب الـ acanthosis؟ عشان في ص 204 هيقولك إن أغلب الأطفال اللي بيجيلهم HHS **تخان** وعندهم acanthosis و T2DM. الطفل ده عكس الصورة دي في كل حاجة، وده اللي مخلّي الحالة تتنشر.
      - kind: explain
        page: 203
        title: "التحاليل: سكر 954 ومفيش كيتونات"
        quote: "Serum osmolality 412 mOsm/kg (N: 282-295)"
        text: |
          - **Glucose 954** mg/dL.
          - **Osmolality 412** (الطبيعي 282–295).
          - **Corrected Na 152**: hypernatraemia. التفسير المقبول (مش في الكتاب): المية اللي خرجت في البول أكتر من الصوديوم.
          - **BUN 62** و **creatinine 2.3**: الكلية متضايقة من الجفاف.
          - **pH 7.21** و **HCO3 19.8**: acidosis ==خفيفة==.
          - البول: **glucose 3+** و ==no ketones==.

          سكر فوق 600 + osmolality عالية + مفيش كيتونات + acidosis خفيفة: ده **HHS** مش DKA.
      - kind: case
        page: 205
        quote: "Management of HHS in pediatrics is the same for DKA; exogenous insulin infusion at a rate of 0.1 U/kg/h is recommended."
        stem: "Case 3: a 7-year-old, a week of polyuria, polydipsia, weight loss and enuresis, 4 weeks after a viral illness."
        steps:
          - reveal: "GCS 13, severely dehydrated. Glucose 954, corrected Na 152, osmolality 412, pH 7.21, HCO3 19.8, no urine ketones."
            question: "Diagnosis?"
            options: ["HHS", "Severe DKA", "Diabetes insipidus", "AKI only"]
            answer: 0
            why: "سكر فوق 600، osmolality 412، ومفيش كيتونات: hyperosmolar hyperglycaemic state (HHS)."
          - question: "Insulin rate?"
            options: ["0.1 units/kg/h", "1 unit/kg/h", "No insulin", "s.c. only"]
            answer: 0
            why: "Pediatric HHS زي الـ DKA: 0.1 U/kg/h."
          - question: "Fluids?"
            options: ["0.9% saline, then 0.45-0.75%", "5% dextrose first", "Hypertonic saline", "Oral only"]
            answer: 0
            why: "Isotonic الأول (وهو hypotonic بالنسبة لهم)، بعدين 0.45-0.75%."
      - kind: explain
        page: 203
        quote: "Discussion\n  1. HHS is characterized by hyperglycemia more than 600 mg/dL, hyper osmolality more than 330 mOsm/L, & a mild metabolic acidosis (pH>7.2).\n  2. HHS classically occurs in patients with T2DM, but there are increased reports in T1DM.\n  3. DKA has a mortality rate below 1% in pediatrics with a good prognosis."
        title: "تعريف الـ HHS في الحالة دي"
        text: |
          - Glucose ==>600== mg/dL
          - Osmolality ==>330== mOsm/L
          - Mild acidosis، pH ==>7.2==

          خلي بالك: **L15** كانت بتقول effective osmolality >300 و pH ≥7.3. الحالة دي بتستخدم أرقام تانية، فلو السؤال عن Case 3 جاوب بأرقامها.
      - kind: update
        ref: "ADA/EASD/JBDS/AACE/DTS hyperglycemic crises consensus 2024"
        text: "الـ consensus الجديد بيعرّف HHS بـ glucose ≥600 و effective osmolality >300 و pH ≥7.3 (زي L15). لو السؤال عن Case 3، جاوب بأرقام الحالة."
      - kind: explain
        page: 204
        title: "ليه مفيش كيتونات، وليه الجفاف بالشكل ده؟"
        quote: "In HHS, insulin action may be inadequate to facilitate glucose utilization by insulin-sensitive tissues but sufficient for the prevention of lipolysis & ketogenesis"
        text: |
          الكتاب بيدّيك السر في جملة: الإنسولين ==مش كفاية يدخّل السكر الخلايا==، بس ==كفاية يوقف الـ lipolysis والـ ketogenesis==. عشان كده HHS من غير كيتونات.

          وليه الجفاف أشد من الـ DKA؟ الكتاب بيقول الـ polyuria والـ polydipsia ==طويلة وبتزيد بالتدريج==، فالـ **osmotic diuresis** بتشتغل أيام، وده بيعمل جفاف شديد و electrolyte loss شديد.

          التفسير المقبول (مش في الكتاب) للفرق في المدة: الـ DKA بتعمل acidosis وترجيع ونَفَس سريع بدري فالمريض بيجي بسرعة، لكن الـ HHS مفيهاش الإنذار ده، فبتفضل ساكتة لحد ما السكر يوصل لـ 954.
      - kind: figure
        page: 204
        quote: "In HHS, insulin action may be inadequate to facilitate glucose utilization by insulin-sensitive tissues but sufficient for the prevention of lipolysis & ketogenesis"
        title: "كمية إنسولين قليلة بتعمل شغلة وتسيب شغلة"
        alt: "A vertical insulin scale. At the low mark the label reads stops lipolysis and ketogenesis, ticked. Higher up the label reads glucose uptake by tissues, crossed. An arrow marks HHS between the two marks; DKA sits below the lower mark."
        caption: "الـ HHS قاعد في النص: الإنسولين عدّى عتبة الكيتونات ولسه ما وصلش عتبة السكر."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L16d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="40" y="20" width="36" height="210" rx="6" class="fg-box"/>
            <text x="58" y="14" text-anchor="middle" class="t-sm t-b">Insulin</text>
            <path d="M30 70H86" class="fg-ink" stroke-width="2"/>
            <path d="M30 170H86" class="fg-ink" stroke-width="2"/>
            <text x="96" y="66" class="t-sm">Enough for glucose uptake</text>
            <text x="96" y="82" class="t-sm t-bad">✗ not reached in HHS</text>
            <text x="96" y="166" class="t-sm">Enough to stop lipolysis</text>
            <text x="96" y="182" class="t-sm t-good">✓ reached in HHS</text>
            <rect x="96" y="104" width="120" height="34" rx="8" class="fg-acc"/>
            <text x="156" y="126" text-anchor="middle" class="t-b t-acc">HHS here</text>
            <path d="M96 121L80 121" class="fg-arrow-acc" marker-end="url(#L16d)"/>
            <rect x="96" y="196" width="120" height="34" rx="8" class="fg-bad"/>
            <text x="156" y="218" text-anchor="middle" class="t-b">DKA here</text>
            <path d="M96 213L80 213" class="fg-arrow-bad" marker-end="url(#L16d)"/>
          </svg>
      - kind: table
        page: 204
        quote: "Recent reports suggest high mortality rates in children with HHS (~10-35%)."
        title: "DKA ضد HHS في الأطفال"
        columns: ["", "DKA", "HHS"]
        rows:
          - ["Mortality", "<1%", "~10-35%"]
          - ["Ketones", "عالية", "قليلة أو مفيش"]
          - ["أخطر مضاعفات", "Cerebral edema، ARDS", "Cerebral edema، ARDS"]
        hide: [[0, 2], [2, 2]]
      - kind: explain
        page: 204
        title: "مين بيجيله HHS من الأطفال، وليه الحالة دي غريبة؟"
        quote: "Children with HHS share common features; the majority of children are obese males of African-American ethnicity."
        text: |
          الصورة المعتادة في الكتاب:
          - أغلبهم ==ولاد تخان== من أصل African-American.
          - عندهم ==family history of T2DM== و **acanthosis nigricans**.
          - وأغلبهم اتشخّصوا بعدين **T2DM**.

          عشان كده الكتاب بيفسّر زيادة الحالات بزيادة الـ **obesity** والـ T2DM في الأطفال. الـ acanthosis علامة الـ insulin resistance، وده اللي بيربطها بالصورة.

          بس Case 3 عكس كل ده: رفيع، ومفيش عيلة، ومفيش acanthosis. والكتاب بيقفل الباب: الـ HHS ==ممكن تحصل في T1DM==، و الـ pathophysiology واحدة في النوعين.
      - kind: explain
        page: 204
        title: "إيه اللي بيفجّر الـ HHS؟"
        quote: "Infections (pneumonia caused by gram-negative bacteria, UTI & sepsis), medications, poor compliance, undiagnosed DM, substance abuse, & coexisting diseases are precipitating factors for HHS"
        text: |
          - **Infections**: ==gram-negative pneumonia==، UTI، sepsis.
          - **Medications**.
          - **Poor compliance**.
          - **Undiagnosed DM** (زي Case 3).
          - **Substance abuse**.
          - **Coexisting diseases**.

          التفسير المقبول (مش في الكتاب) اللي يلم القايمة: أي حاجة بتزوّد الـ stress hormones (العدوى والأمراض)، أو بتقلّل الإنسولين (مش بياخده أو مش متشخّص أصلًا)، أو بتمنع المريض يشرب مية، بتزقّ السكر لفوق.
      - kind: explain
        page: 204
        title: "العلاج بيعمل مشاكل كمان: راقب إيه؟"
        quote: "Massive osmotic diuresis in the early hours of therapy needs aggressive fluid management to prevent shock & avoid the complications of vascular collapse (lactic acidosis, rhabdomyolysis, renal failure, thrombosis)."
        text: |
          أول ساعات العلاج فيها ==massive osmotic diuresis==، فالسوائل لازم تبقى ==aggressive== عشان تمنع الـ shock و الـ **vascular collapse** ومضاعفاته: lactic acidosis، rhabdomyolysis، renal failure، thrombosis.

          وبعدها راقب: **hypernatraemia** مستمرة، **hypokalaemia**، **hypophosphataemia**، rhabdomyolysis، pancreatitis، thrombosis.

          التفسير المقبول (مش في الكتاب): الدم التقيل والناشف بيمشي بالراحة فبيجلّط (thrombosis)، والعضلة اللي مش واخدة دم كفاية بتتكسّر (rhabdomyolysis). والـ K والـ phosphate بينزلوا لأن الإنسولين بيدخّلهم الخلايا.
      - kind: check
        page: 204
        quote: "The most serious complications of both HHS & DKA are cerebral edema & ARDS."
        question: "According to Case 3's discussion, what are the most serious complications of both HHS and DKA?"
        options:
          - "Cerebral edema and ARDS"
          - "Hypoglycaemia and seizures"
          - "Pancreatitis and gallstones"
          - "Diabetes insipidus and SIADH"
        answer: 0
        why:
          - "صح: cerebral edema و ARDS هما الأخطر في الاتنين."
          - "دي ممكن تحصل من العلاج، بس الكتاب مقالهاش كأخطر مضاعفات."
          - "الـ pancreatitis في قايمة المراقبة، مش الأخطر."
          - "مش مذكورين في الحالة."
      - kind: mnemonic
        page: 205
        quote: "Dextrose is added to intravenous fluids when serum glucose drops to 300 mg/dl to avoid overly precipitous drops in glucose levels."
        word: "ISD"
        hook: "علاج pediatric HHS:"
        parts:
          - { key: "I", text: "Insulin 0.1 U/kg/h" }
          - { key: "S", text: "Saline 0.9%، بعدين 0.45-0.75%" }
          - { key: "D", text: "Dextrose لما السكر ينزل 300" }
      - kind: reveal
        page: 205
        quote: "Fluid resuscitation is best accomplished initially with isotonic fluid (0.9% saline), which will be hypotonic for these patients, followed by 0.45% to 0.75% saline."
        prompt: "إزاي الـ 0.9% saline يبقى hypotonic؟ وليه الـ dextrose عند 300 مش لما السكر يبقى طبيعي؟"
        answer: |
          - الـ 0.9% saline حوالي 308 mOsm، والطفل ده osmolality بتاعته ==412==، فبالنسبة له المحلول ==أخف== منه (التفسير المقبول، مش في الكتاب: الحساب نفسه).
          - الـ **dextrose** بيدخل عند ==300== عشان السكر ما ينزلش بسرعة زيادة؛ الكتاب بيقول كده بالنص. التفسير المقبول (مش في الكتاب): النزول السريع بيسحب مية للمخ، وده طريق الـ **cerebral edema**.
      - kind: try
        items: [dm.L16.016, dm.L16.017, dm.L16.018, dm.L16.022, dm.L16.026]
    recap:
      - "Case 3: ولد 7 سنين نحيف، سكر 954، osmolality 412، مفيش كيتونات = HHS."
      - "تعريف الحالة: glucose >600، osmolality >330، pH >7.2 (L15: >300 و ≥7.3)."
      - "إنسولين كفاية يوقف الكيتونات ومش كفاية يدخّل السكر؛ osmotic diuresis طويلة = جفاف شديد."
