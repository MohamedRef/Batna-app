- id: res.L19.lesson10
  title: الـ PICO بالأمثلة
  hook: نفس الـ 4 حروف، بس شكلهم بيتغير لما السؤال يبقى علاج أو prognosis أو diagnosis.
  minutes: 6
  pages: [54, 120]
  topics: [questions]
  goals:
  - تحلل سؤال therapy وprognosis وdiagnosis لـ PICO
  - تعرف نوع السؤال من شكله
  - تصلّح سؤال ناقص
  status: unverified
  steps:
  - kind: explain
    page: 54
    quote: In adult patients undergoing orthopedic surgery, does treatment with oral analgesic tramadol (50 mg, daily) compared
      with morphine (20 mg, daily) lead to lower pain scores and fewer side effects (vomiting, constipation, drowsiness)?
    title: 'مثال therapy: tramadol ولا morphine؟'
    text: |
      «In adult patients undergoing orthopedic surgery, does treatment with oral analgesic tramadol (50 mg, daily) compared with morphine (20 mg, daily) lead to lower pain scores and fewer side effects?»

      - **P**: adults undergoing orthopedic surgery.
      - **I**: ==tramadol 50 mg daily==.
      - **C**: ==morphine 20 mg daily==.
      - **O**: ==outcome 1== lower pain scores، و outcome 2 fewer side effects (vomiting, constipation, drowsiness).

      ليه ده مثال كويس؟ لأن الـ I والـ C محددين بالجرعة، والـ outcomes حاجات تتقاس. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 56
    quote: In children with non-Hodgkin lymphoma, within the five years after diagnosis, what is the relative risk of death
      compared with healthy children?
    title: مثال prognosis
    text: |
      «In children with non-Hodgkin lymphoma, within the five years after diagnosis, what is the relative risk of death compared with healthy children?»

      - **P**: children with non-Hodgkin lymphoma.
      - **I**: ==five years after diagnosis== (مدة المتابعة).
      - **C**: ==healthy children==.
      - **O**: ==relative risk of death==.

      ليه الـ I هنا مدة مش علاج؟ لأن في الـ prognosis انت مش بتدّي حاجة، انت بتتابع اللي هيحصل مع الوقت. التفسير المقبول (مش في الكتاب).
  - kind: explain
    page: 58
    quote: For brain tumor, is magnetic resonance imaging or CT scan more accurate for diagnosis?
    title: مثال diagnosis
    text: |
      «For brain tumor, is magnetic resonance imaging or CT scan more accurate for diagnosis?»

      - **P** (problem): ==brain tumor==.
      - **I**: ==MRI==.
      - **C**: CT scan.
      - **O**: ==more accurate for diagnosis==.

      ليه الـ P هنا problem مش patient؟ لأن في الـ diagnosis السؤال عن المرض والـ test، مش عن مجموعة مرضى بتاخد علاج. التفسير المقبول (مش في الكتاب).
  - kind: case
    page: 60
    quote: |-
      Bad example - corrected
      In HIV-infected children, is a tri-valent influenza vaccine (0.5 mL dose administered twice, 1 month apart) efficient than placebo in decreasing the risk of developing pneumonia?
    stem: «In HIV-infected children, is a tri-valent influenza vaccine efficient in decreasing the risk of developing pneumonia?»
    steps:
    - question: Which PICO element is missing?
      options:
      - Comparison
      - Population
      - Intervention
      - Outcome
      answer: 0
      why: مفيش C. الـ slide بيضيف «than placebo».
    - question: What else does the corrected question add to the intervention?
      options:
      - 'The dose: 0.5 mL twice, 1 month apart'
      - The child's age
      - The cost of the vaccine
      answer: 0
      why: 'الـ intervention لازم يتحدد: الجرعة وعدد المرات.'
  - kind: explain
    page: 63
    quote: Amongst adults with acute anterior cruciate ligament (ACL) injuries, does early reconstructive surgery compared
      with delayed reconstructive surgery lead to favourable return to former activity and/or risk of recurrent knee injury?
    title: مثال الـ ACL
    text: |
      «Amongst adults with acute ACL injuries, does early reconstructive surgery compared with delayed reconstructive surgery lead to favourable return to former activity and/or risk of recurrent knee injury?»

      - **P**: adults with acute ACL injuries.
      - **I**: ==early reconstructive surgery==.
      - **C**: ==delayed reconstructive surgery==.
      - **O**: return to former activity و/أو recurrent knee injury.

      نوعه ==therapy==، لأنه بيقارن علاجين ونتايجهم. التفسير المقبول (مش في الكتاب).
  - kind: check
    page: 64
    quote: |-
      | Patient/ Population | Intervention/ Exposure | Comparison | Outcome | Type of Question |
      | In women with suspected coronary rtery disease (CAD) | what is the accuracy of exercise ECHO | compared to exercise ECG | for diagnosing significant CAD? | ?????? |
    question: «In women with suspected CAD, what is the accuracy of exercise ECHO compared to exercise ECG for diagnosing
      significant CAD?» What type of question is it?
    options:
