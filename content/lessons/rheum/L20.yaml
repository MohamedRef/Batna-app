    status: unverified
    steps:
      - kind: explain
        page: 335
        title: "Severe PsA (ACR/NPF)"
        quote: "Erosive disease. • Elevated markers of inflammation (ESR, CRP) attributable to PsA."
        text: |
          - ==Erosive disease==
          - **ESR/CRP** عالي بسبب الـ PsA
          - **Damage** بيأثر على الوظيفة (deformities)
          - نشاط عالي بيبوّظ الـ **quality of life**
          - نشاط في أماكن كتير، منها dactylitis و enthesitis
          - **Rapidly progressive**
      - kind: explain
        page: 336
        title: "EULAR poor prognosis"
        quote: "Many swollen joints. • Structure damage in the presence of inflammation. • High ESR or CRP."
        text: |
          1. **Many swollen joints**
          2. **Structural damage** مع inflammation
          3. **High ESR أو CRP**
          4. **Extra-articular** manifestations مهمة إكلينيكيًا
      - kind: match
        page: 336
        quote: "Axial disease activity is determined by BASDAI (Bath Ankylosing Spondylitis Disease Activity Index)"
        prompt: "كل domain وأداته:"
        pairs:
          - ["Peripheral joints", "68 tender / 66 swollen"]
          - ["Axial disease", "BASDAI"]
          - ["Quality of life", "PsAQoL"]
          - ["Fatigue", "FACIT"]
          - ["Quick routine visit", "RAPID3"]
        why: "68 مفصل للـ tender و66 للـ swollen (الـ hips مش بتتعد swollen). الـ BASDAI نفسه بتاع الـ AS. الـ RAPID3 الأسهل في العيادة."
      - kind: explain
        page: 337
        title: "DAPSA"
        quote: "Tender joint count (0-68). • Swollen joint count (0-66). • Crp level (mg/dl). • Patient vas for pain (0-10)."
        text: |
          مجموع خمس حاجات:
          - **Tender joints** (0–68)
          - **Swollen joints** (0–66)
          - **CRP** (mg/dl)
          - **Pain VAS** (0–10)
          - **Patient global VAS** (0–10)

          القراءة: ==0–4 remission==، **5–14 low**، **15–28 moderate**، **> 28 high**.
      - kind: check
        page: 337
        quote: "0-4 = remission. - 5-14 =low. - 15-28 =moderate. - >28 = v.high."
        question: "DAPSA = 12. Category?"
        options: ["Low", "Remission", "Moderate", "High"]
        answer: 0
        why:
          - "صح: 5–14 = low."
          - "الـ remission لحد 4."
          - "الـ moderate من 15."
          - "الـ high فوق 28."
      - kind: explain
        page: 337
        title: "MDA: 5 من 7"
        quote: "Patients with PsA are considered to have MDA when they meet 5 out 7 of the following criteria:"
        text: |
          الـ ==MDA== بيشمل الـ remission والـ low activity كهدف مقبول، وبيتستخدم كـ responder index:

          1. Tender joints **≤ 1**
          2. Swollen joints **≤ 1**
          3. **PASI ≤ 1** أو **BSA ≤ 3**
          4. Pain VAS **≤ 15**
          5. Patient global VAS **≤ 20**
          6. **HAQ ≤ 0.5** (الكتاب كاتب ≤5)
          7. Tender entheseal points **≤ 1**
      - kind: aside
        tone: tip
        page: 337
        quote: "Tender joint count ≤1. - Swollen joint count ≤1."
        text: "افتكر الـ MDA كده: **1، 1، 1، 1** (tender، swollen، PASI، entheses) و **15 / 20** (pain، global) و **HAQ 0.5**. محتاج **5** من الـ 7."
      - kind: explain
        page: 338
        title: "الخلاصة"
        quote: "Assessment of patients with PsA requires consideration of all disease domains."
        text: |
          قيّم **كل الـ domains**، وتأثير المرض على الألم والوظيفة والـ QoL والـ damage.

          وخلي بالك من الـ ==comorbidities==: obesity، metabolic syndrome، **CVD**، depression و anxiety، **liver disease**، chronic infections، malignancy، osteoporosis، fibromyalgia، reproductive health.
