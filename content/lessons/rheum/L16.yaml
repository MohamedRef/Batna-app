  - id: rheum.L16.lesson6
    title: "العلاج: بدري، treat to target، والـ NSAIDs"
    hook: "سنتين أول المرض هما اللي بيتهدّ فيهم المفصل. يعني الوقت هنا عضم وغضروف."
    minutes: 10
    pages: [260, 263]
    topics: [strategy, nsaids]
    goals:
      - "تعرف ليه العلاج بدري ومين يستاهل aggressive"
      - "تمشي في الـ EULAR algorithm بمراحله التلاتة"
      - "تعرف الـ NSAIDs بتعمل إيه وما بتعملش إيه وليه"
    status: unverified
    steps:
      - kind: explain
        page: 260
        title: "ليه بدري؟"
        quote: "Early diagnosis and early treatment are needed as joint destruction occurs in the first 2 years of onset."
        text: |
          الـ joint destruction بيحصل في ==أول سنتين==. والـ disease-modifying antirheumatic drugs (DMARDs) لازم تبدأ في أول **12 أسبوع**.

          وفيه ناس محتاجة علاج **aggressive** علشان عندها poor prognostic features.
      - kind: figure
        page: 260
        title: "إيد RA متأخرة في الأشعة"
        image: { file: rheum/L16-hand-xray.webp, book: true }
        alt: "X-ray of a hand: the joints at the bases of the fingers and the wrist are narrowed and ragged, with the fingers drifting off line."
        caption: |
          أشعة إيد RA متأخرة: مفاصل الـ **MCP** والرسغ **ضيقة ومتآكلة**، والصوابع مش على خط واحد.

          ده الـ **joint destruction** اللي الكتاب بيقول إنه بيحصل في ==أول سنتين==. ومش بيرجع، عشان كده العلاج بدري.
      - kind: mnemonic
        page: 260
        quote: "Aggressive treatment for patients with poor prognostic features as:\n  Early onset of severe synovitis (high disease activity) with functional limitation.\n  Joint erosions.\n  Extra — articular manifestations.\n  Rheumatoid factor positivity.\n  Family history of severe RA."
        word: "FEARS"
        parts:
          - { key: "F", text: "Family history of severe RA" }
          - { key: "E", text: "Erosions on X-ray" }
          - { key: "A", text: "Activity high early: severe synovitis with functional limitation" }
          - { key: "R", text: "RF positive" }
          - { key: "S", text: "Systemic (extra-articular) features" }
        hook: "الـ poor prognostic features هي الحاجات اللي بتخلّي الروماتولوجيست عنده **FEARS**، فيضرب بعلاج أقوى."
      - kind: reveal
        page: 260
        quote: "Aggressive treatment for patients with poor prognostic features as:"
        prompt: "ليه كل حاجة في FEARS بتقول إن المرض هيبقى وحش؟"
        answer: |
          التفسير المقبول (مش في الكتاب)، والفكرة كلها إن كل feature دليل إن المناعة **شغالة بقوة**:
          - **Erosions بدري**: الـ pannus وصل للعضم في وقت قصير، يعني سرعة الهدم عالية.
          - **Activity عالية** مع functional limitation: التهاب أكتر = ضرر أكتر.
          - **RF موجب**: مناعة بتعمل antibodies و immune complexes، وده اللي بيعمل الـ nodules والـ vasculitis.
          - **Extra-articular**: المرض خرج من المفصل، يعني systemic وأقوى.
          - **Family history of severe RA**: الـ genetic background الشديد (shared epitope).

          والنتيجة اللي الكتاب عايزها: العيان ده ياخد **aggressive treatment** من الأول.
      - kind: figure
        page: 261
        quote: "Phase I: Clinical diagnosis of Rheumatoid Arthritis\n  No contraindication for methotrexate: Start methotrexate\n  + Combine with short-term glucocorticoids (reduce and stop as rapidly as possible)\n  Contraindication for methotrexate: Start leflunomide or sulfasalazine\n  Improved at 3 months and achieved target at 6 months? Yes: Continue → Dose reduction in sustained remission\nPhase II (No):\n  Poor prognostic factors present (RF/ACPA, esp. at high levels; high disease activity; early joint damage; failure of ≥ 2 csDMARDs): Add a bDMARD; Consider use of a JAK-inhibitor only after risk assessment\n  Poor prognostic factors absent: Change to or add a second conventional synthetic DMARD (Leflunomide, sulfasalazine, alone or csDMARD combination (plus glucocorticoids)), then back to Phase I assessment\n  Improved at 3 months and achieved target at 6 months? Yes: Continue → Dose reduction / interval increase in sustained remission; No: Phase III"
        title: "الـ EULAR algorithm في الكتاب: 3 مراحل"
        alt: "Vertical flowchart. Phase I: methotrexate plus short-term glucocorticoids, or leflunomide or sulfasalazine if methotrexate is contraindicated. Decision: improved at 3 months and target at 6 months? Yes leads to continue and taper in sustained remission. No leads to phase II: with poor prognostic factors add a bDMARD or consider a JAK inhibitor after risk assessment; without them change to or add a second csDMARD. Same decision. No leads to phase III: change the bDMARD or JAK inhibitor."
        caption: "كل مرحلة ليها نفس السؤال: **اتحسّن في 3 شهور ووصل للـ target في 6؟** آه = كمّل وقلّل الجرعة في الـ remission. لأ = المرحلة اللي بعدها."
