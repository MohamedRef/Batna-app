  - id: endo.L05.lesson3
    title: "الـ gastrinoma والـ insulinoma"
    hook: "واحد بيحرق المعدة بالحمض، والتاني بيطفّي المخ من قلة السكر."
    minutes: 9
    pages: [87, 89]
    topics: [gastrinoma, insulinoma]
    goals:
      - "تعرف أرقام الـ gastrinoma وصورة الـ ZES"
      - "تحضّر المريض صح للـ fasting gastrin وتقرا الـ secretin test"
      - "تعرف تشخيص الـ insulinoma"
    status: unverified
    steps:
      - kind: explain
        remind: [endo.L05.049]
        page: 87
        quote: "Gastrinomas\n  Over-secretion of gastrin → Zollinger-Ellison Syndrome (ZES).\n  Associated with islet cell pancreatic tumors (usually multiple), occasionally duodenal.\n  20% associated with MEN-1.\n  Age at diagnosis: ~50 years.\n  More common in males (~60%).\n  Metastasis in 60% of patients.\n  Complete resection results in 10-year survival of 90% (less likely if large primary tumor)."
        title: "الـ gastrinoma"
        text: |
          الـ gastrin الكتير ← ==Zollinger-Ellison syndrome==.

          - مكانه: **islet cell pancreatic tumours (usually multiple)**، وأحيانًا duodenal.
          - **20% مع MEN-1**، السن حوالي **50**، رجالة 60%، **metastasis 60%**.
          - Complete resection ← **90% 10-year survival**.
          - الصورة: **reflux oesophagitis**، **recurrent ulcers**، و **diarrhoea** (malabsorption).

          ليه لازم تفكّر في MEN-1 مع كل gastrinoma؟ لأن خُمس الحالات جزء منه، والكتاب بيقول الأورام «usually multiple»، والـ multiple ده بالذات طابع الـ MEN-1 (درس الـ MEN في المحاضرة 1). والـ metastasis 60% يعني إن نص المرضى وأكتر بيتشخصوا متأخر، فالـ 90% survival دي للي اتشال كله بدري بس.
      - kind: reveal
        page: 87
        quote: "Zollinger-Ellison Syndrome – Clinical Picture\n  Reflux esophagitis.\n  Recurrent ulcers.\n  Diarrhea (malabsorption)."
        prompt: "ليه الـ gastrinoma بيعمل diarrhoea؟"
        answer: "الحمض الكتير بيوصل الـ duodenum فبيعطّل الـ pancreatic enzymes (محتاجة وسط قلوي) وبيأذي الـ mucosa، فيحصل **malabsorption** وإسهال."
      - kind: explain
        page: 88
        quote: "Diagnosis\n  Elevated fasting serum gastrin levels off all acid antisecretory medications.\n    Stop PPIs for 14 days.\n    Stop H₂ blockers for 3 days.\n  Very high gastrin levels (>250 pmol/L) on PPIs may indicate gastrinoma.\n  Gastric acid output usually >15 mEq/hr.\n  Secretin stimulation test:\n    2 U/kg IV secretin.\n    Measure fasting gastrin at 2, 5, 10, and 20 minutes.\n    Increase ≥50% confirms gastrinoma."
        title: "التشخيص: وقّف الـ PPI الأول"
        text: |
          الـ ==fasting gastrin== لازم يتقاس **off all antisecretory drugs**:

          - **proton pump inhibitor (PPI)**: وقّفه **14 يوم**.
          - **H2 blocker**: وقّفه **3 أيام**.
          - لو على PPI والـ gastrin **أكتر من 250 pmol/L** = ممكن gastrinoma.
          - الـ **acid output** عادة أكتر من 15 mEq/hr.

          ليه لازم توقّف الـ PPI؟ التفسير المقبول (مش في الكتاب): الـ PPI بيقلل الحمض، والمعدة بترد بإنها تعلّي الـ gastrin عشان تعوّض، فالـ gastrin يطلع عالي في أي حد على PPI حتى لو مفيش ورم. علشان كده الرقم على PPI لازم يبقى **عالي جدًا** (أكتر من 250) عشان يتاخد بجد، وعلشان كده الـ acid output العالي مهم: لو الحمض عالي والـ gastrin عالي، يبقى الـ gastrin جاي من ورم مش من رد فعل.
      - kind: figure
        page: 88
        quote: "Diagnosis\n  Elevated fasting serum gastrin levels off all acid antisecretory medications.\n    Stop PPIs for 14 days.\n    Stop H₂ blockers for 3 days.\n  Very high gastrin levels (>250 pmol/L) on PPIs may indicate gastrinoma.\n  Gastric acid output usually >15 mEq/hr.\n  Secretin stimulation test:\n    2 U/kg IV secretin.\n    Measure fasting gastrin at 2, 5, 10, and 20 minutes.\n    Increase ≥50% confirms gastrinoma."
        title: "الـ secretin test"
        alt: "A timeline: secretin 2 U/kg IV at time zero, gastrin sampled at 2, 5, 10 and 20 minutes. A rising line crosses a dashed threshold at 50 percent above baseline, labelled confirms gastrinoma."
        caption: "في الـ gastrinoma الـ secretin بيعلّي الـ gastrin بدل ما ينزّله."
        svg: |
