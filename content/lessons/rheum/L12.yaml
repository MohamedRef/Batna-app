    steps:
      - kind: explain
        page: 206
        quote: "Accepted initial dose is 10 mg \\m 2 \\week (0ral /parentral) if not effective:\n  To be increased up to a maximum of 15 mg \\ m2 or 0.5-1 mg/kg (parentral). There is no advantage of further dose increase.\n  It sometimes introduced within 8-12 weeks of initiation of NSAIDS in patients with polyarticular disease."
        title: "الـ Methotrexate: الأساس"
        text: |
          ==Methotrexate== هو **cornerstone** لأغلب الـ juvenile idiopathic arthritis (JIA) مع polyarthritis.

          - البداية **10 mg/m²/week** (oral أو parenteral).
          - لو مش كفاية: لحد **15 mg/m²** أو 0.5–1 mg/kg parenteral. أكتر من كده مفيش فايدة.
          - أحيانًا بيبدأ خلال **8–12 أسبوع** من الـ NSAIDs في الـ poly.
          - **Folic acid 1 mg/day** + multivitamin، ومتابعة الكبد والدم.

          ليه بيبدأ بعد 8 لـ 12 أسبوع من الـ NSAIDs في الـ poly؟ التفسير المقبول (مش في الكتاب): الـ NSAIDs لوحدها بتكفي تلت الأطفال بس (أغلبهم oligo)، والـ poly محتاج دوا بيغيّر المرض قبل ما المفاصل تتآكل.
