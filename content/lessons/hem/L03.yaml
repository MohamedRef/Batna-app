          - "ده للـ HS."
          - "ده الـ gold standard للـ HS."
          - "ده للـ PNH."
      - kind: explain
        page: 37
        title: "Immune haemolysis: التقسيم"
        quote: "Haemolytic disease of newborn-Rh or ABO."
        text: |
          1. **Autoimmune**: ==warm== أو ==cold==.
          2. **Alloimmune**: haemolytic disease of the newborn (Rh أو ABO)، و haemolytic transfusion reactions.
          3. **Drug-induced**.

          الـ **warm AIHA** أشهر نوع: **IgG** أو **C3b** على الكرة، والـ macrophages في **الطحال** بتمسكها وتكسرها.
      - kind: table
        page: 38
        quote: "Cold antibody type (antibody maximally active at 0 to 4C) Cold-reactive antibody is IgM."
        title: "Warm ولا cold؟"
        columns: [Feature, Warm, Cold]
        rows:
          - ["Temp", "37 °C", "0–4 °C"]
          - ["Antibody", "IgG", "IgM"]
          - ["Causes", "SLE, CLL, lymphoma", "Mycoplasma, EBV, CMV"]
          - ["Film", "Spherocytes", "Agglutination"]
          - ["Steroids", "Yes", "No"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2], [3, 2], [4, 2]]
      - kind: mnemonic
        page: 38
        quote: "Cold-reactive antibody is IgM."
        word: "GM"
        parts:
          - { key: "G", text: "IgG: warm (37 °C), spleen, steroids work" }
          - { key: "M", text: "IgM: cold (0–4 °C), Mycoplasma, steroids fail" }
        hook: "**G**ood weather = warm = Ig**G**. **M**ountain snow = cold = Ig**M** (و**M**ycoplasma). سهلة."
      - kind: explain
        page: 38
        title: "التشخيص: Coombs"
        quote: "Direct antiglobulin test (DAT) is used to demonstrate antibodies or the complement attached to red cells in vivo."
        text: |
          - ==DAT== (direct): بيدوّر على antibody أو complement **لازقين على الكرة** في الجسم. ده اللي بيأكد الـ AIHA.
          - **IAT** (indirect): بيدوّر على antibody **في السيرم**.

          الـ warm AIHA: anaemia، **icterus**، **splenomegaly**؛ الفيلم فيه **microspherocytes** و reticulocytosis.
      - kind: order
        page: 39
        quote: "Splenectomy is indicated when improvement does not occur with corticosteroids."
        prompt: "رتّب علاج الـ warm AIHA:"
        steps:
          - "Treat the underlying disease"
          - "Steroids 1 mg/kg/day"
          - "Splenectomy if steroids fail"
          - "Azathioprine or cyclophosphamide"
        why: "الـ **steroids** أغلب العيانين بيستجيبوا. لو لأ، **splenectomy** (الطحال هو المكان اللي بيتكسر فيه). ولو برضه لأ، **immunosuppressants**. والـ **rituximab** (anti-CD20) خيار، والنقل بس لو **ضروري جدًا**."
      - kind: explain
        page: 39
        title: "الـ cold AIHA"
        quote: "Corticosteroids and splenectomy are not helpful."
        text: |
          الـ antibody (**IgM**) شغال أحسن في ==0–4 °C==. الأنيميا خفيفة لمتوسطة، والفيلم فيه **autoagglutination** (الكرات بتتلم مع بعض). الـ **DAT** موجب.

          **العلاج**:
          - عالج السبب (زي الـ **lymphoma**)، و**ابعد عن البرد**.
          - ==Steroids و splenectomy مش بيفيدوا==.
          - **Chlorambucil** يقلل الـ antibodies، **sutimlimab** (anti-**C1s**، يوقف الـ classical pathway)، **plasmapheresis** مؤقت، والنقل لو ضروري بدم **متدفّي**.
      - kind: reveal
        page: 39
        quote: "Sutimlimab is monoclonal antibody designed to target C1s by selectively inhibiting the classical complement pathway at C1s."
        prompt: "ليه الـ steroids والـ splenectomy بيفيدوا الـ warm ومش بيفيدوا الـ cold؟"
        answer: "الـ **warm IgG** بيخلي الكرة **تتمسك في الطحال** بالـ macrophages، فشيل الطحال أو تهدية الـ macrophages بالـ steroids بيفيد. الـ **cold IgM** بيشغّل الـ **complement** والكرة بتتكسر غالبًا في **الكبد** أو جوّه الأوعية، فالطحال مش هو الملعب. عشان كده الحل يوقف الـ complement (**sutimlimab** على C1s) أو يقلل الـ IgM."
