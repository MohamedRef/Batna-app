  # ------------------------------------------------------------------
  - id: git.L11.lesson4
    title: "الدوالي: من الـ screening لحد الـ TIPS"
    hook: "النزيف الـ variceal أخطر، مش علشان الدوالي، علشان الكبد اللي وراها."
    minutes: 10
    pages: [305, 312]
    topics: [variceal]
    goals:
      - "تعرف مين يتعمله EGD screening وكل قد إيه"
      - "تطبّق الـ bundle بتاع النزيف الحاد"
      - "تختار EVL ولا cyanoacrylate، وإمتى TIPS والـ balloon"
    status: unverified
    steps:
      - kind: explain
        page: 305
        quote: "Patients with variceal bleeding have a higher mortality than those with nonvariceal bleeding, and this is largely related to the severity of underlying liver disease."
        title: "ليه أخطر؟"
        text: |
          الـ ==variceal bleeding== الـ mortality بتاعه أعلى من الـ non-variceal، وده بالأساس من **شدة مرض الكبد**.

          - الـ **EGD screening** في الـ cirrhosis **mandatory**: يكتشف الدوالي ويوصفها ويصنّفها.
          - الدوالي سبب **5-11%** من الـ GI bleeding.

          (المحاضرات hb.L03 و hb.L04 فيها الـ portal hypertension بالتفصيل.)
      - kind: explain
        page: 306
        quote: "Variceal size, red wale marks on varices, and advanced liver disease are risk factors for variceal hemorrhage."
        title: "مين هينزف؟"
        text: |
          - ==Variceal size== (الكبيرة أخطر).
          - ==Red wale marks==.
          - **Advanced liver disease**: Child C أكتر من Child A.
          - **Ascites**.
          - **MELD** أعلى و comorbidities.
      - kind: figure
        page: 310
        quote: "EGD can be avoided"
        title: "خريطة الـ screening (p310)"
        alt: "Flowchart for compensated cirrhosis. If liver stiffness is under 20 kPa and platelets over 150,000, EGD can be avoided with ongoing monitoring. Otherwise screening EGD: no varices leads to EGD every 3 years without ongoing injury or every 2 years with it; small varices under 5 mm lead to EGD every 2 years without ongoing injury or every year with it; medium or large varices lead to NSBB with no follow-up EGD, or EVL every 1 to 4 weeks until eradication then every 6 to 12 months."
        caption: "لو الـ LS أقل من 20 kPa والصفايح فوق 150,000 ممكن تستغنى عن المنظار. غير كده: المواعيد على حسب حجم الدوالي واستمرار الـ liver injury."
        svg: |
          <svg viewBox="0 0 330 470" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L11v1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="80" y="8" width="170" height="30" rx="6" class="fg-ink"/>
            <text x="165" y="28" text-anchor="middle" class="t-sm t-b">Compensated cirrhosis</text>
            <path d="M165 38v12" class="fg-arrow" marker-end="url(#L11v1)"/>
            <rect x="10" y="54" width="310" height="44" rx="6" class="fg-good"/>
            <text x="20" y="72" class="t-sm t-b">LS &lt;20 kPa and PLT &gt;150,000/µL</text>
            <text x="20" y="90" class="t-sm">EGD can be avoided; keep monitoring</text>
            <text x="165" y="118" text-anchor="middle" class="t-sm t-mut">otherwise: screening EGD</text>
            <path d="M165 122v12" class="fg-arrow" marker-end="url(#L11v1)"/>
            <rect x="10" y="138" width="310" height="70" rx="6" class="fg-box"/>
            <text x="20" y="158" class="t-sm t-b">No varices</text>
            <text x="20" y="178" class="t-sm">No ongoing injury: EGD every 3 yr</text>
            <text x="20" y="198" class="t-sm">Ongoing injury: EGD every 2 yr</text>
            <rect x="10" y="218" width="310" height="70" rx="6" class="fg-acc"/>
            <text x="20" y="238" class="t-sm t-b">Small varices (&lt;5 mm)</text>
            <text x="20" y="258" class="t-sm">No injury or cofactor: every 2 yr</text>
            <text x="20" y="278" class="t-sm">Ongoing injury/cofactor: every year</text>
            <rect x="10" y="298" width="310" height="110" rx="6" class="fg-bad"/>
            <text x="20" y="318" class="t-sm t-b">Medium or large varices</text>
            <text x="20" y="340" class="t-sm">NSBBs: no follow-up EGD</text>
            <text x="20" y="362" class="t-sm">EVL: EGD every 1-4 wk until</text>
            <text x="20" y="378" class="t-sm">eradication, then every 6-12 mo</text>
            <text x="10" y="440" class="t-sm t-mut">Bigger varices or ongoing injury = shorter intervals.</text>
          </svg>
      - kind: check
        page: 310
        quote: "EGD can be avoided"
        question: "Compensated cirrhosis, still drinking, screening EGD shows small varices (<5 mm). Next EGD?"
        options:
          - "Every year"
          - "Every 2 years"
          - "Every 3 years"
          - "No follow-up"
        answer: 0
        why:
          - "صح: small varices + ongoing injury (الكحول) = كل سنة."
          - "كل سنتين لو small varices من غير ongoing injury."
          - "كل 3 سنين لو مفيش دوالي ولا injury."
          - "No follow-up بس للـ medium/large على NSBB."
      - kind: explain
        page: 306
        quote: "Short-term (maximum 7 days) antibiotic prophylaxis should be instituted in any patient with cirrhosis and GI hemorrhage"
        title: "الـ bundle في النزيف الحاد"
        text: |
          نزيف عند مريض cirrhosis = **emergency**:
          - **Volume support** ونقل دم، مع ==Hb حوالي 8== (ما تزوّدش).
          - ==Antibiotics== **max 7 days** لكل مريض cirrhosis بينزف: **norfloxacin 400 mg BID** أو **IV ciprofloxacin**، و**IV ceftriaxone 1 g/day** أفضل في الـ advanced cirrhosis أو لو الـ quinolone resistance عالية.
          - ==Vasoactive drug== (somatostatin، octreotide، vapreotide، terlipressin) **أول ما تشك**، ويكمل **3-5 days**.
          - الـ **PPI** في الـ cirrhosis بيزوّد الـ infections والـ SBP. البداية قبل المنظار debated بس شائعة.
      - kind: mnemonic
        page: 306
        quote: "should be initiated as soon as variceal hemorrhage is suspected and continued for 3–5 days after diagnosis is confirmed."
        word: "BAVE"
        parts:
          - { key: "B", text: "Blood: restrictive, Hb about 8 g/dL" }
          - { key: "A", text: "Antibiotics: max 7 days (ceftriaxone 1 g/day in advanced cirrhosis)" }
          - { key: "V", text: "Vasoactive drug as soon as suspected, for 3-5 days" }
          - { key: "E", text: "Endoscopy within 12 h: band ligation" }
        hook: |
          **BAVE** زي **Baveno** من غير "no" 😄. أربع حاجات قبل ما تفكر في أي حاجة تانية.
      - kind: update
        page: 306
        quote: "Oral norfloxacin(400 mg BID) or intravenous ciprofloxacin (in patients in whom oral administration is not possible) is the recommended antibiotic."
        text: |
          الـ **Baveno VII** بقى يفضّل **IV ceftriaxone 1 g/24 h** لحد 7 أيام كاختيار أساسي، حسب الـ resistance المحلية، والـ norfloxacin مش متاح في أماكن كتير. في الامتحان اكتب كلام الكتاب (norfloxacin أو cipro، و ceftriaxone في الـ advanced).
        ref: "Baveno VII consensus, 2022"
      - kind: explain
        page: 307
        quote: "The optimal endoscopic therapy for esophageal variceal bleeding is variceal band ligation, which is associated with less rebleeding and fewer side effects than sclerotherapy."
        title: "المنظار: rubber band ولا غِرا؟"
        text: |
          - **Esophageal varices**: ==band ligation== (rebleeding أقل و side effects أقل من الـ sclerotherapy).
          - **GOV1** (دوالي المريء نازلة على الـ lesser curve): ligation برضه.
          - **أي gastric varices تانية**: ==tissue adhesive== (**N-butyl-cyanoacrylate**)، وممكن **thrombin**.
      - kind: explain
        page: 307
        quote: "Balloon tamponade should be used as a temporizing measure (maximum 24 hours) in patients with uncontrollable bleeding"
        title: "لو ما وقفش"
        text: |
          - ==TIPS==: لو النزيف مش بيتحكم، أو رجع رغم الـ drug + endoscopic therapy.
          - ==Balloon tamponade==: **temporizing**، **max 24 hours**، لحد ما الـ TIPS أو المنظار يتعمل.
      - kind: update
        page: 307
        quote: "TIPS is indicated in patients in whom hemorrhage from esophageal varices cannot be controlled"
        text: |
          الـ **Baveno VII** كمان بينصح بـ **pre-emptive TIPS** خلال 72 ساعة (أحسن خلال 24) للـ high risk: Child C أقل من 14 نقطة، أو Child B فوق 7 مع active bleeding في المنظار، أو HVPG فوق 20. الكتاب بيذكر الـ TIPS للفشل أو الرجوع بس، ودي إجابة الامتحان.
        ref: "Baveno VII consensus, 2022"
      - kind: explain
        page: 307
        quote: "Combination of NSBB/EVL is first-line therapy in the prevention of rebleeding."
        title: "بعد ما يعدّي"
        text: |
          - الـ **rebleeding** بعد أول نزيف: ==60% في أول سنة==، والـ mortality لحد **33%**.
          - الوقاية: ==NSBB + EVL== هي الـ first line.
          - لو ينفع transplant: حوّله لـ **transplant center**.
      - kind: table
        page: 310
        quote: "Table 3 The Child–Pugh score."
        title: "Child-Pugh في الجدول ده (SI units)"
        columns: ["Criterion", "1 point", "3 points"]
        rows:
          - ["Bilirubin (µmol/L)", "<34", ">50"]
          - ["Albumin (g/L)", ">35", "<28"]
          - ["INR", "<1.7", ">2.3"]
          - ["Ascites", "None", "Severe (diuretic refractory)"]
          - ["HE", "None", "Grade 3-4"]
        hide: [[0, 2], [1, 2], [2, 1], [2, 2]]
      - kind: aside
        tone: trap
        page: 310
        quote: "Table 3 The Child–Pugh score."
        text: |
          جدول **Table 3** هنا بالـ **SI units** والـ **INR** (bilirubin 34-50 µmol/L، albumin 28-35 g/L، INR 1.7-2.3)، مش زي جدول hb.L01 اللي بالـ mg/dL والـ PT seconds. الـ classes نفسها: **A 5-6، B 7-9، C 10-15**. وجدول **MELD** (Table 4، ص 311): 3.78 ln bilirubin + 11.2 ln INR + 9.57 ln creatinine + 6.43، وأي قيمة أقل من 1 تتحسب 1، والـ dialysis مرتين في أسبوع = creatinine 4.
