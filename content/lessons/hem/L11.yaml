        caption: |-
          التلات عواميد فقرات بيوضحوا الفرق في **المكان والانتشار**:
          - **شمال، solitary bone**: فقرة واحدة حمرا بس. الباقي سليم، ==no M protein==، والنخاع مش myeloma.
          - **النص، extramedullary**: العضم كله سليم، والورم في الـ soft tissue (الدايرة فوق = المناخير والـ sinuses).
          - **يمين، multiple myeloma**: فقرات كتير حمرا، ومعاها M protein ونخاع مليان plasma cells.

          يعني الـ plasmacytoma هو ==myeloma في حتة واحدة==، وعلشان كده الشروط كلها بتدوّر على أي حتة تانية: لو لقيتها، بقى myeloma.
