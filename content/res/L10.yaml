    src: { page: 10, quote: "Overview\n  Questionnaire definition and importance.\n  Questionnaire design process.\n    What Information Is Needed?\n    How Should Individual Questions Be Framed?\n    What Should Be the Structure of the Question?\n      – Unstructured Questions\n      – Structured Questions\n    How Should the Question Be Worded?\n    Formatting the Questionnaire\n    Pretesting\n  Coding, codebook and index." }
    status: unverified
    tags: [high-yield]
  - id: res.L10.016
    kind: card
    topic: questionnaire
    front: What is the first step in questionnaire design, and what keeps the questionnaire focused?
    back: >-
      Specify the information needed. A continual review of the earlier stages of the research (the components of the problem, the
      research questions and the hypotheses) keeps it focused: make sure the questionnaire items match your research objectives.
    src: { page: 15, quote: "What Information Is Needed?\n  The first step in questionnaire design is to specify the information needed.\n  A continual review of the earlier stages of the research project, particularly the specific components of the problem, the research questions, and the hypotheses, will help keep the questionnaire focused.\n  Make sure the questionnaire items match your research objectives." }
    status: unverified
  - id: res.L10.017
    kind: mcq
    topic: questionnaire
    stem: The first step in questionnaire design is
    options: [Development of specific questions, Formulation of a statistical analysis plan, Pretesting, Problem identification]
    answer: 3
    why:
      - Writing the questions comes after you know what information the problem needs.
      - The analysis plan is not a questionnaire design step in this lecture.
      - Pretesting is the last step, before the field study.
      - The slide's key is d, and the lecturer gave d in the video. The questionnaire starts from the problem, its research questions and hypotheses, which tell you what information is needed (slide 15).
    src: { page: 71, quote: "4. The first step in questionnaire design is:\n  (a) Development of specific questions.\n  (b) Formulation of a statistical analysis plan.\n  (c) Pretesting.\n  (d) Problem identification." }
    status: unverified
    tags: [high-yield]
  # ---------------- content (slides 16-34, 64-65, 72-73) ----------------
  - id: res.L10.018
    kind: card
    topic: content
    front: How should individual questions be framed (question content)?
    back: >-
      Decide what goes in each question: whether the question is necessary, and whether more than one question is needed to get
      the information unambiguously. Questions that are nice to know but don't address the research problem are eliminated.
    src: { page: 16, quote: "How Should Individual Questions Be Framed?\n  The researcher must determine what should be included in each question.\n  This involves a determination of whether a question is necessary and whether more than one question is needed to obtain the information in an unambiguous way." }
    status: unverified
  - id: res.L10.019
    kind: enumerate
    topic: content
    prompt: "Unnecessary (nice-to-know) questions should be eliminated. Enumerate the exceptions to this rule."
    points:
      - "Early in the interview: a few easy-to-answer neutral questions to build a relationship with respondents and capture their attention"
      - Questions repeated on purpose to assess reliability or validity
    pass: 2
    hook: "سؤال زيادة مسموح في حالتين: «سلام في الأول، وتكرار للاختبار» = neutral questions تبني relationship، وrepeated questions للـ reliability أو validity."
    src: { page: 18, quote: "Is the Question Necessary?\n  There are exceptions to this rule:\n  Early in the interviewing process when the researcher is attempting to build a relationship with respondents and capture their attention, a few easy-to-answer neutral questions may be helpful.\n  At times, certain questions may also be repeated for the purpose of assessing reliability or validity." }
    status: unverified
  - id: res.L10.020
    kind: card
    topic: content
    front: What is a double-barreled question?
    back: >-
      A question that combines two or more questions into one, often with the words "or" or "and". It gives unsatisfactory
      answers: each question should contain only one concept, so ask them separately.
    src: { page: 20, quote: "Pitfalls to Avoid\n  Questions that use the words “or\" or “and\" can lead to unsatisfactory responses - each question should contain only one concept.\n  Such a question is called a double-barreled question because two or more questions are combined into one." }
    status: unverified
    tags: [high-yield]
  - id: res.L10.021
    kind: mcq
    topic: content
    stem: A double-barreled question is
    options:
      - A question that contains a word with more than one meaning
      - A question that asks about more than one concept
      - A question that doesn't match its answer options
      - All of the above
    answer: 1
    why:
      - That is an ambiguous word, a wording problem.
      - Two or more questions combined into one; each question should hold one concept.
      - That is the question-answer mismatch pitfall (slides 25-26).
      - Only b defines it.
    src: { page: 20, quote: "Questions that use the words “or\" or “and\" can lead to unsatisfactory responses - each question should contain only one concept.\n  Such a question is called a double-barreled question because two or more questions are combined into one." }
    status: unverified
    tags: [high-yield]
  - id: res.L10.022
    kind: case
    topic: content
    stem: >-
      A questionnaire on caffeine and palpitations asks: "How many cups of coffee or tea do you drink during a day?"
    steps:
      - question: What is wrong with this question?
        options: [It is double-barreled, It has a built-in assumption, It needs aided recall, It is too sensitive]
        answer: 0
        why: Coffee and tea are two concepts in one question, so a single number can't be split between them.
      - question: How do you fix it?
        options:
          - "Ask separately: Coffee ___ cups/day; Tea ___ cups/day, on a typical day"
          - Add a "don't know" option
          - Move it to the end of the questionnaire
          - Change it to agree/disagree
        answer: 0
        why: The slide asks each drink separately, on a typical day.
    src: { page: 21, quote: "To avoid confusion, these questions should be asked separately,\n  How many cups of the following do you drink during a typical day?\n  Coffee: ----- cups/day\n  Tea: -----cups/day" }
    status: unverified
  - id: res.L10.023
    kind: enumerate
    topic: content
    prompt: Why may respondents be unable to answer a question?
    points: [They are not informed, They don't remember]
    pass: 2
    hook: "مش قادر يجاوب ليه؟ «مايعرفش أو ناسي» = not informed أو don’t remember."
    src: { page: 22, quote: "Are the Respondents Able to Answer the Question?\n  Respondents may not always be able to answer the questions posed to them.\n  Why ??\n  Not informed.\n  Don’t remember." }
    status: unverified
  - id: res.L10.024
    kind: card
    topic: content
    front: What happens when respondents are not informed about a topic, and what do you do?
    back: >-
      They may still answer, but the answers will be misleading. If many respondents may be uninformed, add "don't know" to the
      response alternatives.
    src: { page: 23, quote: "If not informed:\n  Respondents may provide answers but those answers will be misleading.\n  What to do??\n  If it is suspected that many respondents may be uninformed about the topic, “don't know” should be added to the list of response alternatives." }
    status: unverified
  - id: res.L10.025
    kind: mcq
    topic: content
    stem: >-
      "This antenatal care (ANC) service is an improvement over our last one. [1 = strongly disagree, 5 = strongly agree]".
      Which pitfall does this item show?
    options: [A built-in assumption, A double-barreled question, Order bias, Aided recall]
    answer: 0
    why:
      - It assumes the participant has experience with the last ANC service.
      - It asks about one concept only.
      - Order bias is about the position of alternatives in a list.
      - Aided recall is a good technique, not a pitfall.
    src: { page: 24, quote: "Pitfalls to Avoid\nAvoid Built-in assumptions\n  Questions that assume familiarity with a given topic:\n  Example: This ANC service is an improvement over our last one. [ 1=strongly disagree, 5=strongly agree]\n  This question assumes that the survey participant has experience with the last ANC service." }
    status: unverified
  - id: res.L10.026
    kind: mcq
    topic: content
    stem: >-
      "Have you had pain in the last week? [ ] Never [ ] Seldom [ ] Often [ ] Very often". What is the best fix?
    options:
      - "Ask \"How often have you had pain in the last week?\" or change the options to No/Yes"
      - Add a "don't know" option
      - Split it into two questions
      - Move it to the end of the questionnaire
    answer: 0
    why:
      - The question and answer options don't match (a yes/no question with frequency options); the slide fixes either side.
      - The respondent knows whether they had pain; information is not the problem.
      - It holds one concept only, so it is not double-barreled.
      - Pain is not a sensitive topic.
    src: { page: 25, quote: "Pitfalls to Avoid\n  The question and answer options don't match.\n  Have you had pain in the last week?\n  [ ] Never [ ] Seldom [ ] Often [ ] Very often\n  – Grammatically incorrect and can be confusing.\n  – Question should be changed to: How often have you had pain in the last week?\" or the response options should be changed to No/Yes." }
    status: unverified
  - id: res.L10.027
    kind: card
    topic: content
    front: 'Why is "I am sometimes depressed. [ ] Agree [ ] Disagree" a poor item?'
    back: >-
      The question and answer options don't match: a question about intensity gets agree/disagree options, and disagreeing could
      mean "often depressed" or "never depressed". Better ask how often the person feels depressed, with frequency options (never,
      sometimes, often).
    src: { page: 26, quote: "Pitfalls to Avoid\n  The question and answer options don't match.\n  I am sometimes depressed. [ ] Agree [ ] Disagree\n  Question about intensity is given agree/disagree options.\n  Disagreeing with this statement could mean that the person is often depressed or never depressed.\n  Usually clearer to use a simple question about how often the person feels depressed matched with options about frequency (“never\", “sometimes\", “often\")" }
    status: unverified
  - id: res.L10.028
    kind: mcq
    topic: content
    stem: '"Which of these types of cereals did you eat yesterday?" followed by a list. This question uses'
    options: [Aided recall, Unaided recall, A built-in assumption, Skip logic]
    answer: 0
    why:
      - The list gives cues related to the event, which stimulates the respondent's memory.
      - '"What type of cereals do you remember eating yesterday?" with no list is unaided recall.'
      - It does not assume familiarity with anything.
      - Skip logic sends a respondent to a follow-up question based on an earlier answer.
    src: { page: 28, quote: "If cannot remember:\n  “Which of these types of cereals did you eat yesterday? ……………”\n  Aided Recall\n  A question that employs aided recall attempts to stimulate the respondent's memory by providing cues related to the event of interest." }
    status: unverified
    tags: [high-yield]
  - id: res.L10.029
    kind: enumerate
    topic: content
    prompt: Why may respondents be unwilling to answer a question they are able to answer?
    points: [Too much effort involved, Too sensitive information]
    pass: 2
    hook: "قادر بس مش عايز ليه؟ «تعب وكسوف» = too much effort وtoo sensitive."
    src: { page: 29, quote: "Are the Respondents Willing to Answer the Question?\n  Even if respondents are able to answer a particular question, they may be unwilling to do so.\n  Why ??\n  Too much effort involved,\n  Too sensitive information." }
    status: unverified
  - id: res.L10.030
    kind: card
    topic: content
    front: '"Please list all the investigations you did during the last 3 months." What is the problem and the fix?'
    back: >-
      Too much effort, so respondents may not answer. Give a list to check instead: "In the list that follows, please check all the
      investigations you did during the last 3 months" (CBC, blood glucose, urine analysis, ECG ... ABG, echocardiography).
    src: { page: 31, quote: "In the list that follows, please check all the investigations you did during the last 3 months.\n  1. CBC ____\n  2. Blood glucose level ____\n  3. Urine analysis ____\n  4. ECG ____\n  16. ABG ____\n  17. Echocardiography ____" }
    status: unverified
  - id: res.L10.031
    kind: enumerate
    topic: content
    prompt: Enumerate the examples of sensitive topics given in the lecture.
    points: [Money, Family life, Political and religious beliefs, Involvement in accidents or crimes]
    pass: 3
    hook: "4 حاجات الناس بتتكسف منها: «فلوس، بيت، سياسة ودين، ومشاكل» = money، family life، political وreligious beliefs، وaccidents أو crimes."
    src: { page: 32, quote: "Too sensitive;\n  Information of a personal or highly sensitive nature may be difficult to obtain from respondents.\n  Consider the demographic and cultural characteristics of your potential participants.\n  – Examples of sensitive topics include:\n    Money,\n    Family life,\n    Political and religious beliefs, and\n    Involvement in accidents or crimes." }
    status: unverified
  - id: res.L10.032
    kind: mcq
    topic: content
    stem: To increase the likelihood of obtaining sensitive information, such topics should be placed
    options:
      - At the beginning of the questionnaire
      - Just after the demographic information
      - In the middle part of the questionnaire
      - At the end of the questionnaire
    answer: 3
    why:
      - At the start there is no rapport yet, so respondents may refuse or abandon the survey.
      - Still early; legitimacy of the project is not yet established.
      - Better than the start, but the slide says the end.
      - By then rapport has been created and the project's legitimacy established, so respondents give the information more willingly.
    src: { page: 33, quote: "What to do??\n  To increase the likelihood of obtaining sensitive information, such topics should be placed at the end of the questionnaire.\n  – By then, rapport has been created and legitimacy of the project established, making respondents more willing to give information." }
    status: unverified
    tags: [high-yield]
  - id: res.L10.033
    kind: card
    topic: content
    front: How should a questionnaire ask about household income?
    back: >-
      Not as an open number ("What is your household's annual income?") but as categories: "Which one of the following categories
      best describes your household's annual income?" (under $25,000; $25,001-$50,000; $50,001-$75,000; over $75,000).
    src: { page: 34, quote: "Too sensitive;\n  What is your household's annual income?\n  Which one of the following categories best describes your household’s annual income?\n  __ under $25,000\n  __ $25,001-$50,000\n  __ $50,001-$75,000\n  __ over $75,000" }
    status: unverified
  # ---------------- structure (slides 35-52, 66-67) ----------------
  - id: res.L10.034
    kind: card
    topic: structure
    front: What are unstructured questions?
    back: >-
      Open-ended questions that respondents answer in their own words; also called free-response or free-answer questions.
    src: { page: 36, quote: "Unstructured Questions\n  Unstructured questions are Open-ended Questions that respondents answer in their own words.\n  They are also referred to as free-response or free-answer questions." }
    status: unverified
  - id: res.L10.035
    kind: card
    topic: structure
    front: When are open-ended (unstructured) questions used?
    back: >-
      As first questions on a topic: respondents express general attitudes and opinions without the bias of predefined
      alternatives, which helps the researcher interpret their answers to structured questions. Useful in exploratory research.
