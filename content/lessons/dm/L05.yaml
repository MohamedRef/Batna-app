  - id: dm.L05.lesson3
    title: "الفتلة والشوكة: هل الرجل حاسة؟ والدم واصل؟"
    hook: "خيط نايلون بـ 10 جرام وشوكة رنانة ودبوس: تلات أدوات رخيصة بتمنع بتر رجل."
    minutes: 10
    pages: [56, 60]
    topics: [neuro, vascular]
    goals:
      - "تعمل الـ monofilament test صح وتعرف الـ 4 sites"
      - "تعرف الـ tuning fork والـ VPT والـ pinprick والـ ankle reflex"
      - "تحكم على الـ LOPS"
      - "تحسب الـ ABI وتفسره"
    status: unverified
    steps:
      - kind: explain
        page: 56
        title: "الـ neuropathy أهم حلقة"
        quote: "Peripheral neuropathy is the most common component in the pathway to diabetic foot ulceration."
        text: |
          الـ **peripheral neuropathy** هي ==most common component== في الطريق للـ foot ulcer. علشان كده الفحص هدفه نلاقي **loss of protective sensation (LOPS)**.

          العيان اللي فقد الـ **large fibers** بيقولك: «رجلي كأنها **wrapped in wool**» أو «كأني ماشي بـ **thick socks**».
      - kind: explain
        page: 56
        title: "الـ 10-g monofilament"
        quote: "Nylon monofilaments are constructed to buckle when a 10-g force is applied"
        text: |
          خيط **nylon** معمول إنه ==يتني عند 10 g==. لو العيان مش حاسه في مكان واحد أو أكتر على الـ plantar surface = **loss of large-fiber nerve function**.
      - kind: order
        page: 56
        quote: "should first be demonstrated to the patient on a proximal site (e.g., upper arm, sternum)."
        prompt: "رتّب خطوات الـ monofilament:"
        steps:
          - "Explain the procedure"
          - "Demonstrate on the arm or sternum"
          - "Patient closes the eyes"
          - "Touch perpendicular until it bends"
          - "Hold 2 seconds, release"
          - "Ask: yes or no?"
        why: "بتوريه الإحساس الأول على مكان proximal سليم (upper arm أو sternum) علشان يعرف بيدور على إيه، وبعدين يغمض علشان ما يخمّنش من عينه."
      - kind: figure
        page: 57
        quote: "It is recommended that 4 sites (1st, 3rd, and 5th metatarsal heads and plantar surface of distal hallux) be tested on each foot."
        title: "الـ 4 sites"
        alt: "Outline of the sole of a right foot with four marked dots: the plantar distal big toe, and the first, third and fifth metatarsal heads. A note says to avoid callus, ulcer, corn or scar."
        caption: "4 نقط في كل رجل: ==distal hallux== و الـ **1st و 3rd و 5th metatarsal heads**. لو فيه callus أو ulcer أو scar، حط الخيط **جنبه** مش عليه."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <path d="M120 310 C80 300 75 250 80 200 C85 150 70 110 90 70 C105 40 160 30 200 45 C235 60 245 110 240 160 C235 210 215 250 200 290 C190 310 150 318 120 310 Z" class="fg-box"/>
            <ellipse cx="120" cy="40" rx="20" ry="16" class="fg-box"/>
            <ellipse cx="155" cy="30" rx="10" ry="9" class="fg-box"/>
            <ellipse cx="180" cy="34" rx="9" ry="8" class="fg-box"/>
            <ellipse cx="202" cy="44" rx="8" ry="8" class="fg-box"/>
            <ellipse cx="222" cy="58" rx="8" ry="8" class="fg-box"/>
            <circle cx="120" cy="40" r="8" class="fg-dot-bad"/>
            <circle cx="112" cy="92" r="8" class="fg-dot-bad"/>
            <circle cx="165" cy="85" r="8" class="fg-dot-bad"/>
            <circle cx="215" cy="102" r="8" class="fg-dot-bad"/>
            <text x="10" y="44" class="t-sm">Hallux</text>
            <text x="10" y="96" class="t-sm">1st MT</text>
            <text x="150" y="120" class="t-sm">3rd MT</text>
            <text x="250" y="106" class="t-sm">5th MT</text>
            <text x="250" y="230" class="t-sm t-mut">avoid callus,</text>
            <text x="250" y="246" class="t-sm t-mut">ulcer, scar</text>
          </svg>
      - kind: explain
        page: 57
        title: "الـ 128-Hz tuning fork"
        quote: "when the patient loses vibratory sensation, and the examiner still perceives it while holding the fork on the big toe"
        text: |
          اختبار **vibratory sensation** سهل ورخيص:
          1. اخبط الشوكة وحطها على الـ **sternum**: «حاسس بيها بتزن؟»
          2. العيان يغمض ويقولك امتى حس وامتى وقف.
          3. حطها على الـ **big toe**.

          ==Abnormal== لو العيان بطّل يحس وإنت لسه حاسس بيها في إيدك. وكرر في الناحية التانية.
      - kind: explain
        page: 58
        title: "الـ VPT: الرقم السحري 25"
        quote: "A VPT >25 V is regarded as abnormal and is strongly predictive of subsequent foot ulceration."
        text: |
          الـ **neurothesiometer** جهاز صغير بيدّي **semi-quantitative VPT**: تحط الـ stylus على الـ hallux وتعلّي الـ amplitude لحد ما العيان يحس.

          - ==VPT >25 V== = abnormal وبيتنبأ بقوة بـ **foot ulceration** جاية.
          - الـ VPT الواطي من **earliest indicators** للـ LOPS و **best predictor** للـ long-term LL complications.
      - kind: explain
        page: 58
        title: "الـ pinprick والـ ankle reflex"
        quote: "Absence of ankle reflexes has also been associated with increased risk of foot ulceration."
        text: |
          **Pinprick:** دبوس disposable فوق الضافر على الـ **dorsal hallux**، بضغط يخلّي الجلد ينبعج بس. مش حاسس في أي hallux = abnormal.

          **Ankle reflex:** العيان supine، اعمل **passive dorsiflexion**، وسيب وزن الشاكوش يحدد الخبطة. لو مفيش، اعمل **reinforcement** (يشبك صوابعه ويشد). غايب ==at rest and with reinforcement== = abnormal، وده مرتبط بـ **foot ulceration**.
      - kind: mnemonic
        page: 59
        quote: "10-g monofilament + 1 of the following 4"
        word: "VPAT"
        parts:
          - { key: "V", text: "Vibration with a 128-Hz tuning fork" }
          - { key: "P", text: "Pinprick sensation" }
          - { key: "A", text: "Ankle reflexes" }
          - { key: "T", text: "Threshold: VPT by neurothesiometer" }
        hook: "الـ **monofilament** + واحد من **VPAT** (بات = «بات حاسس ولا لأ؟»)."
      - kind: aside
        tone: exam
        page: 59
        quote: "One or more abnormal tests would suggest LOPS. At least two normal tests (and no abnormal tests) would rule out LOPS."
        text: |
          الحكم على ==LOPS==:
          - **One or more abnormal** test = suggests LOPS
          - **At least two normal, no abnormal** = rules out LOPS
      - kind: check
        page: 59
        quote: "One or more abnormal tests would suggest LOPS."
        question: "Monofilament normal, tuning fork normal, pinprick absent over one hallux. Verdict?"
        options: ["LOPS suggested", "LOPS ruled out", "Test invalid", "Normal: monofilament wins"]
        answer: 0
        why:
          - "صح: abnormal واحد كفاية يقول LOPS."
          - "الـ rule out محتاج اتنين normal ومفيش ولا abnormal."
          - "مفيش سبب يخلّي الاختبار invalid."
          - "الـ monofilament مش بيلغي باقي الاختبارات."
      - kind: explain
        page: 59
        title: "الدم واصل؟"
        quote: "Peripheral arterial disease (PAD) is a component cause in approximately one-third of foot ulcers."
        text: |
          الـ **PAD** سبب مشارك في حوالي **ثلث** الـ foot ulcers.

          - حس **الحرارة** وقارن الرجلين.
          - ==Capillary refill==: اضغط على الـ hallux **5 sec**، اللون يرجع في **أقل من 2 sec**. أبطأ = poor perfusion.
          - **Dorsalis pedis:** عند أول الـ first web space، lateral لوتر الـ **extensor hallucis longus**.
          - **Posterior tibial:** **2 cm** تحت وورا الـ medial malleolus.
      - kind: explain
        page: 60
        title: "الـ ABI"
        quote: "ABI= The higher of the dorsalis pedis and posterior tibial pressures divided by the higher brachial pressure."
        text: |
          **امتى؟** diabetics **فوق 50**، أصغر مع PAD risk factors كتير، أعراض vascular، أو pulses غايبة.

          **إزاي؟** بالـ **Doppler**: ==الأعلى== من الـ dorsalis pedis والـ posterior tibial ÷ ==الأعلى== من الـ brachial pressures.

          **التفسير (الكتاب):**
          - **>0.9** normal
          - **0.8** claudication
          - **<0.4** rest pain و tissue necrosis
      - kind: figure
        page: 60
        quote: "An ABI >0.9 is normal, >0.8 is associated with claudication, and <0.4 is commonly associated with ischemic rest pain and tissue necrosis."
        title: "مسطرة الـ ABI"
        alt: "A horizontal ruler of ABI from 0 to 1.2. Above 0.9 is green (normal). Around 0.8 is amber (claudication). Below 0.4 is red (rest pain and necrosis)."
        caption: "كل ما الـ ABI ينزل، الدم اللي واصل للرجل يقل: **claudication** الأول، وبعدين **rest pain** و necrosis تحت 0.4."
        svg: |
          <svg viewBox="0 0 330 150" xmlns="http://www.w3.org/2000/svg">
            <rect x="15" y="50" width="100" height="30" class="fg-bad"/>
            <rect x="115" y="50" width="125" height="30" class="fg-acc"/>
            <rect x="240" y="50" width="75" height="30" class="fg-good"/>
            <text x="15" y="100" class="t-sm">0</text>
            <text x="105" y="100" class="t-sm t-b">0.4</text>
            <text x="190" y="100" class="t-sm">0.8</text>
            <text x="232" y="100" class="t-sm t-b">0.9</text>
            <text x="300" y="100" class="t-sm">1.2</text>
            <text x="20" y="40" class="t-sm t-bad t-b">Rest pain,</text>
            <text x="20" y="125" class="t-sm t-bad">necrosis</text>
            <text x="135" y="40" class="t-sm t-acc t-b">Claudication</text>
            <text x="245" y="40" class="t-sm t-good t-b">Normal</text>
          </svg>
      - kind: check
        page: 60
        quote: "<0.4 is commonly associated with ischemic rest pain and tissue necrosis."
        question: "DP 40, PT 35 mmHg; brachial 130 (R), 125 (L). ABI?"
        options: ["0.31", "0.27", "0.32", "3.25"]
        answer: 0
        why:
          - "صح: الأعلى في الرجل 40 ÷ الأعلى في الدراع 130 = 0.31: rest pain range."
          - "استخدمت الأوطى في الرجل (35)."
          - "استخدمت الأوطى في الدراع (125)."
          - "قلبت الكسر."
      - kind: aside
        tone: trap
        page: 60
        quote: "An ABI >0.9 is normal, >0.8 is associated with claudication"
        text: "الكتاب كاتب «**>0.8** claudication»، والمنطقي إن الـ claudication بتبدأ لما الـ ABI **ينزل تحت** الطبيعي. في الامتحان اكتب رقم الكتاب: **0.9 normal، 0.8 claudication، 0.4 rest pain**."
      - kind: try
        items: [dm.L05.059, dm.L05.065, dm.L05.071, dm.L05.072, dm.L05.080]
    recap:
