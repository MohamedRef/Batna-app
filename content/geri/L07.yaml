  - id: geri.L07.081
    kind: cloze
    topic: psych
    text: "Geriatric Depression Scale short form: {{c1::15}} yes/no questions about the past week; {{c2::0–5}} is normal and a score {{c3::greater than 5}} suggests depression."
    src: { page: 119, quote: "Geriatric Depression Scale (Short Form)\nInstructions: Choose the best answer for how you felt over the past week. Note: when asking the patient to complete the form, provide the self-rated form (included on the following page).\n| No. | Question | Answer indicating depression |\n|---|---|---|\n| 1 | Are you basically satisfied with your life? | NO |\n| 2 | Have you dropped many of your activities and interests? | YES |\n| 3 | Do you feel that your life is empty? | YES |\n| 4 | Do you often get bored? | YES |\n| 5 | Are you in good spirits most of the time? | NO |\n| 6 | Are you afraid that something bad is going to happen to you? | YES |\n| 7 | Do you feel happy most of the time? | NO |\n| 8 | Do you often feel helpless? | YES |\n| 9 | Do you prefer to stay at home, rather than going out and doing new things? | YES |\n| 10 | Do you feel you have more problems with memory than most people? | YES |\n| 11 | Do you think it is wonderful to be alive? | NO |\n| 12 | Do you feel pretty worthless the way you are now? | YES |\n| 13 | Do you feel full of energy? | NO |\n| 14 | Do you feel that your situation is hopeless? | YES |\n| 15 | Do you think that most people are better off than you are? | YES |\n(Sheikh & Yesavage, 1986)\nScoring: Answers indicating depression are in bold and italicized; score one point for each one selected. A score of 0 to 5 is normal. A score greater than 5 suggests depression." }
    status: unverified
