  - id: git.L06.lesson7
    title: "الـ UC: التحاليل والأشعة والمنظار"
    hook: "Calprotectin، P-ANCA، plain film فيه thumbprinting، ومنظار مليان pseudopolyps. كل واحد بيقولك حاجة."
    minutes: 9
    pages: [214, 224]
    topics: [uc-tests]
    goals:
      - "تعرف التحاليل وليه الـ P-ANCA مش بيفرّق"
      - "تقرأ الـ plain film والـ CT في الـ severe UC"
      - "تعرف شكل الـ UC في المنظار والـ pseudopolyps"
    status: unverified
    steps:
      - kind: explain
        page: 214
        title: "التحاليل"
        quote: "Serologic markers have also been studied for ulcerative colitis. P-ANCA is the most commonly associated marker. However, it is also present in Crohn colitis, which limits its ability to distinguish the two conditions. As with markers in Crohn disease, P-ANCA may be helpful in predicting disease activity. Studies have suggested that P-ANCA-associated ulcerative colitis is more likely to be medically refractory, require early surgery, and result in chronic pouchitis in patients who have undergone ileal pouch anal anastomosis (IPAA) Imaging studies"
        text: |
          - anemia، low iron، leukocytosis، thrombocytosis، **hypoalbuminemia** لو شديد وواسع.
          - البراز: **negative** للـ infection، و **positive** للـ fecal leukocytes و **calprotectin**.
          - ==P-ANCA==: أشهر marker، بس موجود في الـ Crohn colitis كمان.
          - الـ P-ANCA UC: أكتر **refractory**، محتاج **early surgery**، و **chronic pouchitis** بعد الـ ileal pouch–anal anastomosis (IPAA).

          التفسير المقبول (مش في الكتاب): ليه الـ albumin بيقل في الشديد بس؟ لأن الـ mucosa المتقرحة على مساحة كبيرة بتسرّب بروتين، والالتهاب الشديد بيخلّي الكبد يقلل تصنيعه، والاتنين محتاجين مرض واسع وشديد.
      - kind: explain
        page: 214
        quote: "have suggested that P-ANCA-associated ulcerative colitis is more likely to be"
        title: "الـ P-ANCA: مش للتشخيص، بس بيتنبأ"
        text: |
          الكتاب: الـ ==P-ANCA== أشهر marker مع الـ UC، بس موجود كمان في الـ **Crohn colitis**، فما يقدرش يفرّق بينهم. ممكن يساعد يتنبأ بالـ **disease activity**، والـ UC اللي معاه P-ANCA أكتر احتمال يبقى **medically refractory**، ويحتاج **early surgery**، ويعمل **chronic pouchitis** بعد الـ **ileal pouch anal anastomosis (IPAA)**.

          التفسير المقبول (مش في الكتاب): الـ IPAA هي العملية اللي بيشيلوا فيها القولون كله والـ rectum، ويعملوا من آخر الـ ileum «كيس» يتوصل بالشرج علشان المريض يفضل يتبرز من مكانه الطبيعي. والـ pouchitis التهاب في الكيس ده. فالـ P-ANCA هنا مش بيقولك «عنده إيه»، بيقولك «المرض ده هيبقى صعب قد إيه»، وده بيساعد في الكلام مع المريض عن الخطة.
      - kind: figure
        page: 223
        quote: "Figure 7: Abdominal X ray in patient with acute severe UC with dilated colon and thumbprinting sign of severe inflammation:"
        title: "الـ plain film في الـ acute severe UC"
        image: { file: git/L06-asuc-xray-ct.webp, book: true }
        alt: "Left: plain abdominal X-ray with a dilated gas-filled colon and white arrows on thick wall folds (thumbprinting). Right: coronal CT of a dilated, inflamed colon with an arrow and an arrowhead."
        caption: "Figure 7 من الكتاب: قولون **dilated** والأسهم على الـ ==thumbprinting== (edema في الحيطة)."
      - kind: table
        page: 214
        quote: "Plain films of the abdomen are useful predominantly in patients with symptoms of severe or fulminant colitis. So-called thumbprinting or thickening of the colon wall indicates severe colitis with bowel wall edema."
        title: "اقرا الـ plain film"
        columns: [Finding, Meaning]
        rows:
          - ["Thumbprinting / thick wall", "Severe colitis, wall edema"]
          - ["Dilated colon, no haustra", "Toxic megacolon"]
          - ["Pneumatosis", "Late: ischemia and infarction"]
          - ["Obstruction", "Rare in UC: think malignancy"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 215
        title: "المنظار والـ barium والـ CT"
        quote: "Colonoscopy allows assessment of the extent of disease and severity of involvement. Classic findings include confluent inflammation extending proximally from the anal verge, with mucosal erythema, edema, and granularity and loss of normal vasculature. The transition between the involved part and the normal part is abrupt. With more severe disease, the mucosa becomes overtly hemorrhagic, with ulcerations and a purulent exudate. So-called backwash ileitis, characterized by mild terminal ileal erythema, is seen in patients who have pancolitis. Pseudopolyps are commonly encountered in patients with long-standing disease. These are polypoid nondysplastic colonic lesions of hypertrophied tissue, often with surrounding atrophic mucosa. They are thought to represent the sequelae of chronic recurrent inflammation and healing and harbor no malignant potential."
        text: |
          **Colonoscopy:** التهاب **confluent** من الـ **anal verge** ولفوق: erythema، edema، granularity، و ==loss of normal vasculature==. والانتقال من العيان للسليم **abrupt**. في الشديد: hemorrhagic، ulcers، purulent exudate.

          **Pseudopolyps** في المرض القديم: nondysplastic، **no malignant potential**. بس الـ dysplastic lesions فعلًا أكتر في الـ UC.

          **Barium:** قولون **granular and shortened**. **Computed tomography (CT):** wall thickening (الطبيعي **<3 mm**). **Pouchography** بعد الـ IPAA.
      - kind: reveal
        page: 215
        quote: "chronic recurrent inflammation and healing and harbor no malignant potential."
        prompt: "لقيت pseudopolyps كتير في قولون UC قديم. تشيلهم كلهم؟"
        answer: |
          الكتاب: الـ **pseudopolyps** شائعة في الـ **long-standing disease**: ==polypoid nondysplastic== lesions من نسيج متضخم، غالبًا حواليها mucosa ضامرة. هي أثر **chronic recurrent inflammation and healing**، و **no malignant potential**. بس الـ **dysplastic** أو الـ malignant polyps والـ masses بتظهر أكتر في الـ UC.

          التفسير المقبول (مش في الكتاب): يعني الـ pseudopolyp نفسه مش هيقلب سرطان، فمش لازم تشيلهم كلهم. المشكلة إن وسط الغابة دي ممكن يستخبى lesion dysplastic حقيقي (زي الـ DALM اللي شفته في محاضرة البوليبات)، فالمتابعة بتبقى أصعب. وعلشان كده أي حاجة شكلها مختلف عن الباقي (أكبر، لونها غير، مش منتظمة) تاخد منها biopsy.
      - kind: check
        page: 215
        quote: "The transition between the involved part and the normal part is abrupt."
        question: "On colonoscopy, which finding fits ulcerative colitis rather than Crohn disease?"
        options: ["Confluent inflammation from the anal verge with an abrupt transition to normal mucosa", "Skip lesions with deep ileal ulcers", "A spared rectum with patchy colitis", "Cobblestoning with fistula openings"]
