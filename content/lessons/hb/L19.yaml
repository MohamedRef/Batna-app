        caption: |
          لقطتين من فيديو المنظار، والكلام الأبيض على الأسود حوالين الصورة بيانات الجهاز (فاضية).

          - **فوق**: الـ papilla الحمرا، وداخل فيها ==sphincterotome== (1) مخطّط أخضر وأبيض: ده السلك اللي بيقطع الـ sphincter.
          - **تحت**: الفتحة بقت أوسع، و==حصوة بني كبيرة== (2) طالعة منها للـ duodenum.

          الترتيب هو الاسم نفسه: **sphincterotomy** الأول (فوق)، وبعدها **stone extraction** (تحت).
