      - kind: explain
        page: 154
        title: "التعريف بالأرقام"
        quote: "ascites that cannot be mobilized or the early recurrence of ascites after therapeutic paracentesis despite dietary sodium restriction and diuretic therapy"
        text: |
          ==Refractory ascites==: ascites مش بتتحرك (cannot be mobilized)، أو بترجع بدري بعد البزل، رغم الملح والـ diuretics.

          بتحصل في 5–10% من مرضى الـ ascites، والـ prognosis وحش: الـ one-year mortality أكتر من 40%.

          التعريف بالأرقام علشان الممتحن بيسأل عليها:
          - **Lack of response**: weight loss أقل من 0.8 kg في 4 أيام، و urinary Na أقل من الـ Na intake. يعني الملح اللي داخل أكتر من اللي خارج رغم العلاج.
          - **Early recurrence**: grade 2 أو 3 يرجعوا خلال 4 أسابيع من أول ما المية اتسحبت.
      - kind: sort
        page: 155
        quote: "Diuretic-resistant ascites that do not respond to dietary sodium restriction and maximum doses of diuretics."
        prompt: "النوعين: حط كل مريض في النوع بتاعه:"
        bins: ["Diuretic-resistant", "Diuretic-intractable"]
        cards:
          - { text: "Spiro 400 + furo 160 + 2 g Na, ascites stays", bin: 0 }
          - { text: "Weight loss 0.5 kg in 4 days on maximum doses", bin: 0 }
          - { text: "Creatinine rises each time spiro passes 100 mg", bin: 1 }
          - { text: "Na falls to 120 on low-dose diuretics", bin: 1 }
          - { text: "Hepatic encephalopathy stops dose escalation", bin: 1 }
        why: "**Resistant** = المريض أخد الـ **maximum doses** ومفيش استجابة. **Intractable** = المضاعفات (**diuretic-induced complications**) منعتنا نوصل للجرعة الكاملة."
      - kind: explain
        page: 155
        quote: "Patients with refractory ascites who are not undergoing evaluation for LT should be offered a palliative care referral."
        title: "نعمل إيه؟"
        text: |
          خطة العلاج في الكتاب:
          - **Palliative care referral**: للمريض اللي مش داخل تقييم LT. ده مش استسلام، ده اهتمام بالراحة والأعراض.
          - **Sodium restriction**: لسه مهم حتى هنا، لأن كل ملح بيدخل بيرجّع المية أسرع.
          - **وقف الـ diuretics**: لو المريض مش بيطلّع أكتر من 30 mmol/day صوديوم وهو عليها. الـ diuretic هنا مش جايب نتيجة، وبيعمل مضاعفات بس.

          ==Repeated LVP with albumin== هو العلاج الأشهر.
          - **Total volume paracentesis**: سحب المية كلها في تبزيلة واحدة، لناس مختارين، علشان نقلل عدد المرات.

          والبدائل اللي لازم نفكر فيها: ==TIPS==، **Alfapump**، و **LT**.
