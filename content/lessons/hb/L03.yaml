        quote: "Transjugular intrahepatic portosystemic shunt (TIPS) is an interventional radiographic technique that places an intrahepatic metallic stent between the intrahepatic portions of the portal vein and the hepatic vein, thus creating a nonselective portocaval shunt."
        title: "الـ TIPS في الكتاب: قبل وبعد"
        image: { file: hb/L03-tips-diagram.webp, book: true }
        alt: "Book drawing of the liver in two panels. A: a cirrhotic liver with labels 'Cirrhosis', 'Decreased circulation' and 'Portal hypertension'; the blue portal branches are crowded and squiggly. A thick arrow points to B: the same liver with a stent placed inside it from a branch of the portal vein up to the hepatic vein and inferior vena cava, labelled 'Stent placement' and 'Portal decompression'."
        caption: |
          رسمتين للكبد، والسهم الأسود في النص بيقول «قبل ← بعد»:

          - **A (شمال)**: كبد عليه **Cirrhosis**، والفروع الزرقا متلخبطة وفيها تعرّج: **Decreased circulation** جوه الكبد، والنتيجة تحت **Portal hypertension**.
          - **B (يمين)**: نفس الكبد، بس فيه أنبوبة (**Stent placement**) ماشية جوه الكبد من فرع الـ **portal vein** تحت لحد الـ **hepatic vein** والـ inferior vena cava فوق، والنتيجة **Portal decompression**.

          يعني الـ transjugular intrahepatic portosystemic shunt (TIPS) ==قناة جوه الكبد== بين الوريدين، فالدم يعدّي من غير ما يمر على الـ sinusoids. الضغط بينزل، بس دم الأمعاء بيوصل للمخ من غير ما الكبد ينضّفه، وعلشان كده الـ ==hepatic encephalopathy (HE)== هي أهم مضاعفة.
      - kind: explain
        page: 55
        quote: "Transjugular intrahepatic portosystemic shunt (TIPS) is an interventional radiographic technique that places an intrahepatic metallic stent between the intrahepatic portions of the portal vein and the hepatic vein, thus creating a nonselective portocaval shunt."
        title: "الـ TIPS في الكتاب"
        text: |
          ==TIPS==: interventional radiology بتحط intrahepatic metallic stent بين الـ intrahepatic portal vein والـ hepatic vein. النتيجة ==nonselective portocaval shunt==.

          ببساطة: بنعمل طريق مختصر للدم يعدّي جوه الكبد من غير ما يعدّي على الـ sinusoids المسدودة. الـ R بتنزل فجأة، فالضغط على الدوالي ينزل.

          **إمتى؟**
          - لو متاح: good alternative when endoscopic treatment and pharmacotherapy fail.
          - ولسه بيعتبر **salvage therapy** للنزيف الحاد.
          - **Early TIPS** (within 24 hours) حسّن الـ survival بشكل واضح في الـ high-risk (hepatic venous pressure gradient (HVPG) أكتر من 20 mmHg)، وممكن ياخد دور أبكر.
          - واستخدم بنجاح كمان في الـ **secondary prophylaxis**.
      - kind: update
        page: 55
        quote: "Early TIPS placement (within 24 hours of hemorrhage) was associated with significantly improved survival in high-risk patients (ie, those with an HVPG > 20 mm Hg) and may play an earlier role in treatment of acute variceal hemorrhage."
        text: "Baveno VII: pre-emptive covered TIPS خلال 72 ساعة (ويفضّل خلال 24) في Child C < 14 points، أو Child B أكتر من 7 مع active bleeding وقت المنظار، أو **HVPG > 20 mmHg**."
        ref: "Baveno VII consensus, 2021"
      - kind: reveal
        page: 55
        quote: "Transjugular intrahepatic portosystemic shunt (TIPS) is an interventional radiographic technique that places an intrahepatic metallic stent between the intrahepatic portions of the portal vein and the hepatic vein, thus creating a nonselective portocaval shunt."
        prompt: "الـ TIPS ماسورة بين الـ portal vein والـ hepatic vein جوه الكبد. ليه دي بالذات بتوقّف النزيف لما المنظار والدوا يفشلوا؟"
        answer: |
          ارجع لمعادلة ص 46: ==Portal Pressure = Resistance × Blood Flow==.

          الدوا بيقلل الـ flow، والمنظار بيربط الوريد نفسه. لكن الـ TIPS بيعدّي الـ **resistance** كلها مرة واحدة: الدم بيروح من الـ portal vein للـ hepatic vein من غير ما يعدّي على الـ sinusoids المتليفة (**nonselective portocaval shunt**). فالضغط بينزل على طول، والـ varices بتفضى لأن مابقاش ليها لازمة.

          التمن: الدم ده كمان مش بيتنضّف في الكبد، وده اللي هيعمل الـ HE (جاي في **LADS**).
