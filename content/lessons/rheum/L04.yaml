  - id: rheum.L04.lesson3
    title: "العلاج: warfarin، حمل، وحالات خاصة"
    hook: "سؤال الامتحان الكلاسيكي: عيان APS عمل DVT، تديله إيه ولحد امتى؟ وست حامل؟"
    minutes: 10
    pages: [73, 75]
    topics: [thrombotic, obstetric, adjunct]
    goals:
      - "تعرف علاج الـ thrombotic APS والـ INR المطلوب، وليه heparin الأول"
      - "تعرف ليه الـ DOACs ممنوعة في الـ high risk"
      - "تعالج الـ obstetric APS وتعرف الـ primary prevention"
    status: unverified
    steps:
      - kind: explain
        page: 73
        title: "Thrombotic APS"
        quote: "Once a patient is diagnosed with APS following a thrombotic event, lifelong anticoagulation is generally required to prevent recurrence."
        text: |
          بعد أول جلطة: ==lifelong anticoagulation== غالبًا.

          - **في الأول:** **heparin**، يا **unfractionated heparin (UFH)** يا **low-molecular-weight heparin (LMWH)**. الـ **UFH** ميزته إنك تقدر **تعكسه بسرعة**.
          - **على المدى الطويل:** **warfarin** هو الأساس، **international normalised ratio (INR) 2–3** لمعظم العيانين.
          - **INR 3–4** لو الجلطة رجعت رغم الـ standard anticoagulation.

          التفسير المقبول (مش في الكتاب): ليه lifelong؟ عشان الـ antibody فاضل، فخطر الجلطة مابيروحش بعد أول مرة، وأول جلطة بتقولك إن المريض ده من النوع اللي بيتجلط. وليه الـ UFH في الأول؟ عشان لو حصل نزيف أو محتاج عملية تقدر توقفه وتعكسه بسرعة. والـ INR الأعلى (3–4) للي جلطته رجعت يعني الجرعة العادية ماكفتش.
      - kind: explain
        page: 73
        quote: "UFH allows rapid reversal if needed."
        title: "ليه heparin الأول، وليه UFH أحيانًا؟"
        text: |
          الكتاب بيقول ابدأ بـ **heparin (UFH أو LMWH)** في الجلطة الحادة، وبعدين **warfarin** على المدى الطويل.

          التفسير المقبول (مش في الكتاب):
          - الـ **heparin** بيشتغل **فورًا**، أما الـ warfarin بياخد أيام لحد ما الـ INR يوصل للمطلوب. فالـ heparin بيغطي الفترة دي.
          - الكتاب بيدّي ميزة الـ ==UFH==: **rapid reversal**. ده مهم في عيان ممكن ينزف أو محتاج عملية أو procedure، لأنك تقدر توقفه وتعكسه بسرعة.

          وبعدين warfarin **lifelong** في الغالب، لأن الـ antibody لسه موجود والجلطة ممكن ترجع.
      - kind: aside
        tone: trap
        page: 73
        quote: "Long-Term Management\n  Warfarin is the mainstay\n    Target INR 2–3 for most patients.\n    INR 3–4 may be considered in recurrent events despite standard anticoagulation.\n  DOACs (e.g., rivaroxaban, apixaban)\n  NOT recommended in high-risk APS:\n    Especially triple-positive patients.\n    Increased risk of recurrent thrombosis in clinical trials."
        text: |
          الـ ==direct oral anticoagulants (DOACs)== زي rivaroxaban و apixaban **NOT recommended** في الـ **high-risk antiphospholipid syndrome (APS)**، خصوصًا الـ **triple positive**: التجارب ورّت **زيادة في الجلطات المتكررة**.

          يعني الدوا "الحديث المريح" هنا هو الغلط. warfarin القديم يكسب.
      - kind: update
        page: 73
        quote: "Long-Term Management\n  Warfarin is the mainstay\n    Target INR 2–3 for most patients.\n    INR 3–4 may be considered in recurrent events despite standard anticoagulation.\n  DOACs (e.g., rivaroxaban, apixaban)\n  NOT recommended in high-risk APS:\n    Especially triple-positive patients.\n    Increased risk of recurrent thrombosis in clinical trials."
        text: "الـ **European League Against Rheumatism (EULAR) 2019** بتقول: ما تديش rivaroxaban للـ triple positive، وابعد عن الـ DOACs بعد الـ arterial events. والـ EMA سنة 2019 حذّرت من الـ DOACs في APS بتاريخ جلطات."
        ref: "EULAR recommendations for APS in adults, 2019"
      - kind: check
        page: 73
        quote: "Warfarin is the mainstay\n  Target INR 2–3 for most patients.\n  INR 3–4 may be considered in recurrent events despite standard anticoagulation."
        question: "Triple-positive man on warfarin, INRs 2.3–2.8, has a second DVT. Next step?"
        options: ["Raise target INR to 3–4", "Switch to apixaban", "Stop warfarin, start hydroxychloroquine", "Add aspirin and keep INR 2–3 forever, no change"]
        answer: 0
        why:
          - "صح: recurrence رغم standard anticoagulation ← فكّر في **INR 3–4**."
          - "الـ DOACs بتزوّد الـ recurrence في الـ triple positive."
          - "الـ hydroxychloroquine (HCQ) adjunct، مش بديل للـ anticoagulation."
          - "الكتاب ما قالش aspirin هنا؛ قال INR أعلى."
      - kind: explain
        page: 74
        title: "Obstetric APS"
        quote: "Treatment Approach During Pregnancy\n  Low-dose aspirin (LDA) 75–100 mg/day\n  Prophylactic low-molecular-weight heparin (LMWH)\n    Start therapy early in pregnancy and continue throughout gestation.\n    Discontinue LMWH shortly before delivery and resume postpartum to reduce thrombosis risk."
        text: |
          الست اللي عندها APS وتاريخ pregnancy loss: ==LDA + prophylactic LMWH==.

          - **Low-dose aspirin 75–100 mg/day**
          - **Prophylactic LMWH**
          - ابدأ **بدري في الحمل** وكمّل طول الحمل.
          - وقّف الـ LMWH **قبل الولادة بشوية**، ورجّعه **postpartum**.

          **Refractory:** LMWH بجرعة أعلى، **hydroxychloroquine**، أو **intravenous immunoglobulin (IVIG)** في حالات مختارة.

          التفسير المقبول (مش في الكتاب): ليه aspirin مع LMWH؟ عشان المشكلة في الـ placenta جلطات صغيرة، فالـ aspirin بيقلل الـ platelets والـ heparin بيقلل التجلط، والاتنين أمان في الحمل (عكس الـ warfarin اللي بيأذي الجنين). وليه وقف الـ LMWH قبل الولادة؟ عشان تقلل النزيف وقت الولادة وتسمح بالـ epidural، وبعدها ترجّعه لأن خطر الجلطة بيعلى بعد الولادة.
      - kind: reveal
        page: 74
        quote: "Prophylactic low-molecular-weight heparin (LMWH)\n  Start therapy early in pregnancy and continue throughout gestation.\n  Discontinue LMWH shortly before delivery and resume postpartum to reduce thrombosis risk."
        prompt: "ليه بنوقف الـ LMWH قبل الولادة وبعدين نرجّعه على طول؟"
        answer: |
          قبل الولادة: علشان **النزيف** وعلشان الـ **epidural/spinal** تبقى آمنة.

          بعد الولادة: الـ ==postpartum== من أعلى أوقات الـ thrombosis أصلًا، وعيانة APS خطرها مضاعف. فنرجّعه **to reduce thrombosis risk**. شرح الأمان مع الـ neuraxial ده منطق عملي، والقاعدة نفسها من الكتاب.
      - kind: explain
        page: 74
        title: "Primary prevention والحالات الخاصة"
        quote: "Patients with APS undergoing surgery should receive perioperative prophylactic anticoagulation."
        text: |
          - **Asymptomatic persistent aPL**، خصوصًا triple positive أو lupus anticoagulant (LA) positive: **مفيش consensus**، بس كتير بيدّوا **low-dose aspirin** مع control للـ cardiovascular (CV) risk factors زي smoking و hypertension.
          - **Surgery/immobilisation:** ==perioperative prophylactic anticoagulation==، ولو وقفت الـ warfarin ← **bridge with LMWH**.
          - **Malignancy أو infection** كـ trigger: عالج السبب، ده **provoked APS**.
      - kind: update
        page: 74
        quote: "In asymptomatic patients with persistently positive aPL (especially triple positive or LA+), there is no consensus on mandatory treatment. However, many experts consider:\n  Low-dose aspirin for primary prophylaxis.\n  Control of cardiovascular risk factors (e.g., smoking, hypertension)."
        text: "الـ **EULAR 2019** بتوصي بالـ **low-dose aspirin** للـ asymptomatic carriers اللي عندهم **high-risk aPL profile**، وممكن تتعمل في الـ low-risk. الكتاب بيقول no consensus، وده اللي يتكتب في الامتحان."
        ref: "EULAR recommendations for APS in adults, 2019"
      - kind: table
        page: 75
        quote: "Hydroxychloroquine: May reduce aPL binding and improve endothelial function — increasingly used in both SLE-associated and primary APS."
        title: "الـ adjuncts"
        columns: [Drug, Why]
        rows:
          - ["Hydroxychloroquine", "↓ aPL binding, ↑ endothelial function"]
          - ["Statins", "↓ endothelial activation and inflammation"]
          - ["Eculizumab", "Complement inhibitor, refractory CAPS"]
          - ["Rituximab", "Off-label, non-criteria or recurrent"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: figure
        page: 75
        quote: "Venous/arterial thrombosis Lifelong warfarin (INR 2–3 or 3–4 if recurrent) Obstetric APS LDA + prophylactic LMWH during pregnancy Asymptomatic triple positivity Consider LDA; monitor closely CAPS Anticoagulation + steroids + PLEX/IVIG ± biologics"
        title: "الملخص في صورة واحدة"
        alt: "Four boxes, one per scenario. Thrombosis: lifelong warfarin INR 2 to 3, or 3 to 4 if recurrent. Obstetric APS: low-dose aspirin plus prophylactic LMWH during pregnancy. Asymptomatic triple positive: consider low-dose aspirin and monitor. CAPS: anticoagulation plus steroids plus plasma exchange or IVIG, with or without biologics."
        caption: "أربع سيناريوهات = أربع إجابات. ده ==summary== الكتاب في p75، احفظه زي ما هو."
        svg: |
