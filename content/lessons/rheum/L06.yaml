            <text x="180" y="265" class="t-sm">secondary response</text>
          </svg>
      - kind: reveal
        page: 94
        quote: "Full activation requires help from T cells."
        prompt: "ليه الـ B cell ما تقدرش تتنشّط على الآخر لوحدها، ومحتاجة إذن من الـ T cell؟"
        answer: |
          التفسير المقبول (مش في الكتاب): ده **مفتاحين** للأمان. الـ B cell لوحدها ممكن تمسك في أي حاجة شبه الـ antigen، حتى بروتين من الجسم. لو كانت بتتنشّط لوحدها، كانت هتطلّع **autoantibodies** بسهولة.

          لما يبقى لازم T cell تانية **تشوف نفس العدو وتوافق**، الغلط بيقل كتير. وده اللي الكتاب بيقوله في ص 96: الـ **thymus-dependent** activation فيها **protection against autoimmunity**.
      - kind: check
        page: 94
        quote: "Memory cells are responsible for secondary immune response."
        question: "Which cells explain why a second exposure to the same antigen gives a faster, stronger antibody response?"
        options: ["Memory B cells", "Plasma cells", "NK cells", "Monocytes"]
        answer: 0
        why:
          - "صح: الكتاب بيقول الـ memory cells مسؤولة عن الـ secondary immune response."
          - "الـ plasma cells هي اللي بتفرز الـ antibody دلوقتي، مش اللي بتفتكر للمرة الجاية."
          - "الـ NK innate، ما عندهاش memory."
          - "الـ monocytes innate كمان، وبيبقوا macrophages."
      - kind: try
        items: [rheum.L06.045, rheum.L06.047, rheum.L06.048, rheum.L06.049, rheum.L06.051]
    recap:
      - "T cells: thymus، TCR، بنعرفها بالـ CD3 (جزء من الـ TCR)، أغلب lymphocytes الدم."
      - "B cells: bone marrow، surface Ig، بتستقر في الـ spleen والـ lymph nodes."
      - "Humoral ← encapsulated bacteria (opsonization)؛ نقصه = recurrent sinopulmonary infection."
      - "Cellular ← virus و fungi و parasites و TB (جوه الخلايا)؛ AIDS."
      - "B cell + antigen + T help ← plasma cells (clone) أو memory cells (secondary response)."
