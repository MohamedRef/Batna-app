      - Overnight observation for further bleeding
      - Endoscopy in 2 weeks
      - Endoscopy in 3 months
      - Start ceftriaxone for SBP prevention
    answer: 2
    why:
      - Antibiotic prophylaxis is for acute variceal haemorrhage, not minor oozing during elective banding.
      - Oozing that stops during banding does not need admission.
      - Correct. Banding is repeated every few weeks until varices are eradicated. The lecture does not give the interval; this is standard guideline practice (every 2–8 weeks).
      - Three months is too long between banding sessions before eradication.
      - Like norfloxacin, antibiotic prophylaxis is for acute variceal haemorrhage; there is no acute bleed here.
