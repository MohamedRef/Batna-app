lecture: geri.L10
lessons:
  # ------------------------------------------------------------------
  - id: geri.L10.lesson1
    title: "الرئة لما تصلّح نفسها غلط"
    hook: "الرئة بتتعوّر كل يوم وبتلم نفسها. الـ DPLD هي اللحظة اللي الترميم فيها بيبوظ والجرح يبقى ندبة."
    minutes: 7
    pages: [169, 171]
    topics: [intro, epidemiology, classification]
    goals:
      - "تفهم إزاي الـ repair الغلط بيعمل restrictive lung"
      - "تعرف أرقام الـ DPLD والـ IPF في السن الكبير"
      - "ترسم شجرة تصنيف الـ ILD"
    status: unverified
    steps:
      - kind: explain
        page: 169
        quote: "The normal host response to such insults is to eradicate the etiologic agent, to repair the injury caused by the agent"
        title: "الرد الطبيعي"
        text: |
          الرئة بتجيب الهوا لحد جنب الدم عشان الـ gas exchange، فبتبقى معرّضة لكل حاجة في الهوا: عدوى، تراب، دخان.

          الرد الطبيعي تلات خطوات:

          - ==eradicate== السبب.
          - تصلّح الأذى اللي عمله السبب.
          - تصلّح الأذى اللي عمله الالتهاب نفسه.

          والنتيجة: resolution ورئة طبيعية تاني.
      - kind: explain
        page: 170
        quote: "if the inflammatory and/or repair response is dysregulated, a chronic alveolar/interstitial remodeling process with varying degrees of inflammation and fibrosis ensues."
        title: "لما الرد يبوظ"
        text: |
          لو الالتهاب أو الـ repair بقى ==dysregulated==، بيحصل **chronic alveolar/interstitial remodeling** فيه درجات مختلفة من inflammation و fibrosis.

          ده اللي بيدّي الـ **restrictive physiology** ومشاكل الـ gas exchange اللي بتميّز الـ DPLDs. هي مجموعة كبيرة ومختلفة، بس متجمّعة مع بعض لأن الصورة الإكلينيكية والأشعة والوظايف شبه بعض.
      - kind: figure
        page: 170
        quote: "This results in the restrictive physiology and gas-exchange abnormalities characteristic of the diffuse parenchymal lung diseases (DPLDs)."
        title: "طريقين بعد الإصابة"
        alt: "A flow from lung injury to host response, which splits in two. The regulated branch ends in resolution and normal lung. The dysregulated branch goes to chronic remodelling with inflammation and fibrosis, then to restrictive physiology and gas-exchange failure: DPLD."
        caption: "نفس الإصابة، نهايتين: ترميم مظبوط ← رئة طبيعية؛ ترميم بايظ ← fibrosis و restriction."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="GL10a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="85" y="8" width="160" height="34" rx="8" class="fg-ink"/>
            <text x="102" y="30" class="t-b">Injurious agent</text>
            <path d="M165 42v22" class="fg-arrow" marker-end="url(#GL10a)"/>
            <rect x="85" y="68" width="160" height="34" rx="8" class="fg-box"/>
            <text x="110" y="90">Host response</text>
            <path d="M130 102L75 132" class="fg-arrow" marker-end="url(#GL10a)"/>
            <path d="M200 102L255 132" class="fg-arrow" marker-end="url(#GL10a)"/>
            <rect x="8" y="136" width="145" height="70" rx="8" class="fg-good"/>
            <text x="18" y="158" class="t-sm t-b t-good">Regulated</text>
            <text x="18" y="178" class="t-sm">eradicate + repair</text>
            <text x="18" y="196" class="t-sm">resolution</text>
            <rect x="177" y="136" width="145" height="70" rx="8" class="fg-bad"/>
            <text x="187" y="158" class="t-sm t-b t-bad">Dysregulated</text>
            <text x="187" y="178" class="t-sm">chronic remodelling</text>
            <text x="187" y="196" class="t-sm">inflammation + fibrosis</text>
            <path d="M80 206v34" class="fg-arrow" marker-end="url(#GL10a)"/>
            <path d="M250 206v34" class="fg-arrow" marker-end="url(#GL10a)"/>
            <text x="30" y="262" class="t-b t-good">Normal lung</text>
            <text x="200" y="262" class="t-b t-bad">DPLD</text>
            <text x="324" y="284" text-anchor="end" class="t-sm t-mut">restriction, poor gas exchange</text>
          </svg>
      - kind: explain
        page: 170
        quote: "The median age of onset of IPF ranges from 50 to 70 years"
        title: "مرض الكبار"
        text: |
          - الـ DPLD: **20 to 40 per 100000** في أمريكا، وفوق الـ 75 سنة ممكن تعدّي **175 per 100000**.
          - أشهرها في الكبار: ==IPF==، fibrosis مزمن سببه مش معروف.
          - الـ median age of onset من **50 لـ 70**، وتقريبًا عمره ما يتشخّص في حد عنده **40 أو أقل**.

          وليه بيزيد؟ أدوية سامة للرئة بتتاخد أكتر في الكبار (للسرطان والقلب)، والناس نفسها بتكبر.
      - kind: check
        page: 170
        quote: "The median age of onset of IPF ranges from 50 to 70 years"
        question: "A 38-year-old has diffuse lung fibrosis. Per the book, how likely is IPF?"
        options: ["Almost never diagnosed at 40 or younger", "The most likely diagnosis at any age", "Common: median onset is 30-40", "Only in women under 40"]
        answer: 0
        why:
          - "صح: الكتاب بيقول تقريبًا عمره ما يتشخّص في سن 40 أو أقل، فدور على سبب تاني."
          - "الـ IPF أشهر واحد في الكبار مش في الشباب."
          - "الـ median من 50 لـ 70."
          - "الكتاب مقالش حاجة عن الجنس هنا."
      - kind: figure
        page: 171
        quote: "Known cause or association: Connective tissue diseases Occupational causes Drug side-effects"
        title: "شجرة الـ ILD"
        alt: "Interstitial lung disease splits into four boxes: known cause (connective tissue disease, occupational, drugs), idiopathic interstitial pneumonias, granulomatous (sarcoidosis, hypersensitivity pneumonitis, infection) and other forms (LAM, histiocytosis X). The IIP box splits into major, unclassifiable and rare. Major splits into chronic fibrosing (IPF, NSIP), smoking related (DIP, RB-ILD) and acute or subacute (COP, AIP)."
        caption: "الـ IPF ورقة واحدة في الشجرة: IIP → major → chronic fibrosing. وجنبه الـ NSIP."
        svg: |
          <svg viewBox="0 0 330 420" xmlns="http://www.w3.org/2000/svg">
            <rect x="95" y="6" width="140" height="30" rx="6" class="fg-ink"/>
            <text x="108" y="26" class="t-b">Interstitial LD</text>
            <path d="M165 36v14M40 50H290M40 50v12M120 50v12M205 50v12M290 50v12" class="fg-arrow"/>
            <rect x="4" y="62" width="76" height="80" rx="6" class="fg-box"/>
            <text x="10" y="78" class="t-sm t-b">Known</text>
            <text x="10" y="96" class="t-sm">CTD</text>
            <text x="10" y="113" class="t-sm">Occupation</text>
            <text x="10" y="130" class="t-sm">Drugs</text>
            <rect x="86" y="62" width="68" height="40" rx="6" class="fg-acc"/>
            <text x="104" y="87" class="t-b t-acc">IIP</text>
            <rect x="160" y="62" width="90" height="80" rx="6" class="fg-box"/>
            <text x="166" y="78" class="t-sm t-b">Granulomatous</text>
            <text x="166" y="96" class="t-sm">Sarcoidosis</text>
            <text x="166" y="113" class="t-sm">HP</text>
            <text x="166" y="130" class="t-sm">Infections</text>
            <rect x="256" y="62" width="70" height="80" rx="6" class="fg-thin"/>
            <text x="262" y="78" class="t-sm t-b">Other</text>
            <text x="262" y="96" class="t-sm">LAM</text>
            <text x="262" y="113" class="t-sm">Histio-</text>
            <text x="262" y="128" class="t-sm">cytosis X</text>
            <path d="M120 102v54M50 156H280M50 156v12M165 156v12M280 156v12" class="fg-arrow"/>
            <rect x="15" y="168" width="70" height="28" rx="6" class="fg-acc"/>
            <text x="28" y="187" class="t-sm t-b">Major</text>
            <rect x="105" y="168" width="120" height="28" rx="6" class="fg-thin"/>
            <text x="115" y="187" class="t-sm">Unclassifiable</text>
            <rect x="245" y="168" width="80" height="28" rx="6" class="fg-thin"/>
            <text x="265" y="187" class="t-sm">Rare</text>
            <text x="235" y="214" class="t-sm t-mut">PPFE, LIP</text>
            <path d="M50 196v24M50 220H50M50 220v14" class="fg-arrow"/>
            <rect x="8" y="234" width="314" height="56" rx="6" class="fg-good"/>
            <text x="18" y="254" class="t-sm t-b">Chronic fibrosing</text>
            <text x="18" y="276" class="t-sm"><tspan class="t-b t-acc">IPF</tspan>, NSIP</text>
            <rect x="8" y="296" width="314" height="56" rx="6" class="fg-box"/>
            <text x="18" y="316" class="t-sm t-b">Smoking related</text>
            <text x="18" y="338" class="t-sm">DIP, RB-ILD</text>
            <rect x="8" y="358" width="314" height="56" rx="6" class="fg-bad"/>
            <text x="18" y="378" class="t-sm t-b">Acute and subacute</text>
            <text x="18" y="400" class="t-sm">COP, AIP</text>
          </svg>
      - kind: sort
        page: 171
        quote: "Known cause or association: Connective tissue diseases Occupational causes Drug side-effects"
        prompt: "حط كل حاجة في مجموعتها في الـ ILD:"
        bins: ["Known cause", "IIP", "Granulomatous", "Other forms"]
        cards:
          - { text: "Amiodarone lung", bin: 0 }
          - { text: "Rheumatoid ILD", bin: 0 }
          - { text: "Asbestosis", bin: 0 }
          - { text: "IPF", bin: 1 }
          - { text: "Cryptogenic organizing pneumonia", bin: 1 }
          - { text: "Sarcoidosis", bin: 2 }
          - { text: "Hypersensitivity pneumonitis", bin: 2 }
          - { text: "Lymphangioleiomyomatosis", bin: 3 }
          - { text: "Histiocytosis X", bin: 3 }
        why: "الـ known cause = CTD، occupational، drugs. الـ IIP كلها idiopathic (IPF، NSIP، DIP، RB-ILD، COP، AIP). الـ granulomatous = sarcoid، HP، infection. والـ other = LAM و histiocytosis X."
      - kind: match
        page: 171
        quote: "Chronic fibrosing Smoking related Acute and subacute"
        prompt: "وصّل الـ major IIP بمجموعتها:"
        pairs:
          - ["NSIP", "Chronic fibrosing"]
          - ["Respiratory bronchiolitis-ILD", "Smoking related"]
          - ["Acute interstitial pneumonia", "Acute and subacute"]
        why: "Chronic fibrosing: IPF و NSIP. Smoking: DIP و RB-ILD. Acute/subacute: COP و AIP."
      - kind: try
        items: [geri.L10.004, geri.L10.006, geri.L10.008, geri.L10.009]
    recap:
      - "DPLD: الـ repair بيبوظ، فيحصل remodeling و fibrosis، والنتيجة restriction و gas-exchange failure."
      - "IPF أشهر DPLD في الكبار؛ onset من 50 لـ 70، تقريبًا مش بيحصل تحت 40."
      - "ILD: known cause، IIP، granulomatous، other."
      - "Major IIP: chronic fibrosing (IPF، NSIP)، smoking (DIP، RB-ILD)، acute/subacute (COP، AIP)."
    practice: [geri.L10.001, geri.L10.002, geri.L10.003, geri.L10.004, geri.L10.005, geri.L10.006, geri.L10.007, geri.L10.008, geri.L10.009, geri.L10.010, geri.L10.011]
  # ------------------------------------------------------------------
  - id: geri.L10.lesson2
    title: "الـ UIP و IPF: ندبة فوق ندبة"
    hook: "الـ IPF مش التهاب. هو جرح بيتصلّح غلط كل مرة، والخلايا اللي المفروض تموت بعد الشغل رافضة تموت."
    minutes: 9
    pages: [172, 176]
    topics: [pathology, pathogenesis]
    goals:
      - "تعرّف الـ UIP بالـ temporal و spatial heterogeneity"
      - "تعرف إمتى الـ UIP يبقى IPF وإمتى لأ"
      - "تحكي قصة الـ IPF: epithelium → cytokines → myofibroblast اللي مش بيموت"
    status: unverified
    steps:
      - kind: explain
        page: 172
        quote: "The histological diagnosis of UIP is based on temporal and spatial heterogeneity."
        title: "الـ UIP: عدم التجانس في الزمن والمكان"
        text: |
          شكل الـ IPF في الـ biopsy اسمه ==UIP== (usual interstitial pneumonia)، وتشخيصه بحاجتين:

          - **Temporal heterogeneity**: fibrosis في مراحل مختلفة في نفس العينة: fibroblastic infiltrates، mature fibrosis و honeycombing، مع architectural distortion.
          - **Spatial heterogeneity**: حتت رئة طبيعية جنب حتت fibrosis و honeycombing.

          الـ honeycombing لو أكتر من **5%** من حجم الرئة = finding تقريبًا **100% specific**.
      - kind: figure
        page: 172
        quote: "The distribution of UIP characteristically is with an apicobasal gradient with basal and peripheral (subpleural) predominance"
        title: "فين الـ UIP؟"
        alt: "Outline of two lungs. Shading grows denser from apex to base and from the centre to the subpleural rim, with patches of normal lung between shaded areas. Labels: apicobasal gradient, basal and subpleural, patchy."
        caption: "تحت وعلى الأطراف (subpleural)، ومتقطّع: حتة سليمة جنب حتة تعبانة."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <path d="M150 30C110 30 60 90 50 200c-2 25 15 35 40 30l60-10z" class="fg-box"/>
            <path d="M180 30c40 0 90 60 100 170c2 25-15 35-40 30l-60-10z" class="fg-box"/>
            <path d="M58 175c10-10 30 0 40 10M55 200c15-8 35 5 50 8" class="fg-arrow-bad" stroke-width="5"/>
            <path d="M272 175c-10-10-30 0-40 10M275 200c-15-8-35 5-50 8" class="fg-arrow-bad" stroke-width="5"/>
            <path d="M70 120c8 0 10 10 4 18M260 120c-8 0-10 10-4 18" class="fg-arrow-bad" stroke-width="3"/>
            <circle cx="62" cy="215" r="5" class="fg-dot-bad"/>
            <circle cx="268" cy="215" r="5" class="fg-dot-bad"/>
            <circle cx="80" cy="160" r="4" class="fg-dot-bad"/>
            <circle cx="250" cy="160" r="4" class="fg-dot-bad"/>
            <text x="120" y="22" class="t-sm t-mut">apex: spared</text>
            <text x="100" y="252" class="t-sm t-b t-bad">base + subpleural</text>
            <text x="135" y="150" class="t-sm t-good">normal</text>
            <text x="138" y="166" class="t-sm t-good">patches</text>
          </svg>
      - kind: reveal
        page: 172
        quote: "Inflammation is absent or mild and mostly limited to the areas of honeycombing."
        prompt: "لو الـ UIP مرض التهابي، كنت هتتوقع تلاقي إيه في الـ biopsy؟ وإيه اللي بنلاقيه فعلًا؟"
        answer: "كنا هنتوقع inflammation كتير في كل حتة. الحقيقة إن الـ ==inflammation== **absent or mild**، ومحصور تقريبًا في مناطق الـ honeycombing. ده أول خيط إن الـ IPF مش مرض التهابي."
      - kind: explain
        page: 173
        quote: "So if UIP pattern is found in patient who has been previously identified as IIP now we can say it is IPF."
        title: "الـ UIP مش دايمًا IPF"
        text: |
          الـ UIP pattern بيظهر كمان في ILD تانية، خصوصًا **connective tissue related ILD**. طب نفرّق إزاي؟

          الفرق في **أول خطوة في التشخيص**: هل ده ==IIP== ولا ILD ليها سبب معروف؟

          - UIP في مريض اتصنّف قبل كده IIP ← نقول **IPF**.
          - UIP في مرض ليه سبب معروف ← الـ UIP ده من السبب، **مش IPF**.
      - kind: check
        page: 173
        quote: "if the UIP pattern is found in a condition of known cause then that UIP pattern is due to that cause not due to IPF."
        question: "A woman with systemic sclerosis has a UIP pattern on biopsy. The correct label is:"
        options: ["UIP due to connective tissue disease", "IPF", "IPF plus systemic sclerosis", "Acute interstitial pneumonia"]
        answer: 0
        why:
          - "صح: فيه سبب معروف، فالـ UIP بتاعه."
          - "الـ IPF لازم يبقى IIP الأول، يعني من غير سبب معروف."
          - "مش بنحط الاتنين؛ السبب المعروف بيلغي كلمة idiopathic."
          - "الـ AIP acute وشكله ARDS مش UIP."
      - kind: explain
        page: 174
        quote: "inflammation is less important in IPF which appears to be primarily a disorder of fibroblast activation and proliferation"
        title: "نظريتين"
        text: |
          **الـ non-idiopathic fibrosis**: acute injury → chronic interstitial ==inflammation== → fibroblast activation → fibrosis، وبعدها تدمير.

          **الـ IPF**: النظرية القديمة كانت نفس الكلام، بس الـ anti-inflammatory و immune modulators طلعوا **minimally effective**. فالبحث الحالي بيقول الـ IPF أساسًا **disorder of fibroblast activation and proliferation** لـ trigger لسه مش معروف.
      - kind: figure
        page: 175
        quote: "It is currently believed that idiopathic pulmonary fibrosis (IPF) is an epithelial-fibroblastic disease"
        title: "قصة الـ IPF في سطر"
        alt: "Vertical flow: triggers (smoke, pollutants, dust, viruses, GERD, aspiration) hit a susceptible host; alveolar epithelial cells activate and repair aberrantly with excess apoptosis; they release TNF-alpha, TGF-beta, PDGF, IGF-1 and ET-1; fibroblasts migrate, proliferate and become myofibroblasts; TGF-beta makes them resist apoptosis; excess matrix and scar destroy the lung. A side box: telomere shortening with age promotes epithelial loss."
        caption: "الـ epithelium بيموت أكتر من اللازم، والـ myofibroblast مش بيموت خالص. ده قلب المرض."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="GL10b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="6" width="310" height="54" rx="8" class="fg-thin"/>
            <text x="20" y="26" class="t-sm t-b">Triggers + susceptible host</text>
            <text x="20" y="46" class="t-sm">smoke, dust, viruses, GERD, aspiration</text>
            <path d="M165 60v18" class="fg-arrow" marker-end="url(#GL10b)"/>
            <rect x="10" y="80" width="310" height="54" rx="8" class="fg-bad"/>
            <text x="20" y="100" class="t-sm t-b">Alveolar epithelium</text>
            <text x="20" y="120" class="t-sm">aberrant repair, excess apoptosis</text>
            <path d="M165 134v18" class="fg-arrow" marker-end="url(#GL10b)"/>
            <rect x="10" y="154" width="310" height="54" rx="8" class="fg-box"/>
            <text x="20" y="174" class="t-sm t-b">Cytokines</text>
            <text x="20" y="194" class="t-sm">TNF-α, TGF-β, PDGF, IGF-1, ET-1</text>
            <path d="M165 208v18" class="fg-arrow" marker-end="url(#GL10b)"/>
            <rect x="10" y="228" width="310" height="54" rx="8" class="fg-acc"/>
            <text x="20" y="248" class="t-sm t-b">Fibroblast → myofibroblast</text>
            <text x="20" y="268" class="t-sm">TGF-β: resists apoptosis</text>
            <path d="M165 282v18" class="fg-arrow" marker-end="url(#GL10b)"/>
            <rect x="10" y="302" width="310" height="54" rx="8" class="fg-bad"/>
            <text x="20" y="322" class="t-sm t-b">Excess matrix + scar</text>
            <text x="20" y="342" class="t-sm">lung parenchyma destroyed</text>
            <rect x="10" y="368" width="310" height="54" rx="8" class="fg-thin"/>
            <text x="20" y="388" class="t-sm t-b">Telomere shortening (age)</text>
            <text x="20" y="408" class="t-sm">epithelial loss; familial: telomerase</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 175
        quote: "For normal wound healing to occur, wound myofibroblasts must undergo apoptosis."
        text: "الـ myofibroblast زي عمال البناء: لازم يمشوا لما الشغل يخلص (apoptosis). في الـ IPF العمال رافضين يمشوا، وكل يوم بيصبّوا خرسانة (matrix) زيادة لحد ما الشقة كلها تبقى عمود."
      - kind: order
        page: 175
        quote: "Excess loss of epithelial cells leads to release of cytokines."
        prompt: "رتّب قصة الـ IPF:"
        steps:
          - "Unknown stimuli disrupt alveolar epithelium"
          - "Aberrant epithelial repair"
          - "Excess epithelial apoptosis"
          - "Cytokine release"
          - "Apoptosis-resistant myofibroblasts"
          - "Excess fibrous tissue"
        why: "الكتاب بيلخّصها: الـ epithelium يتصلّح غلط ويموت كتير، يطلّع cytokines، الـ fibroblasts تبقى myofibroblasts مقاومة للـ apoptosis، والنتيجة fibrous tissue كتير."
      - kind: explain
        page: 176
        quote: "Telomerase is a polymerase enzyme that adds telomere repeats to the ends of chromosomes."
        title: "الـ telomeres: ليه مرض كبار؟"
        text: |
          - الـ ==telomerase== polymerase بيضيف telomere repeats لأطراف الـ chromosomes، عشان يعوّض القِصَر اللي بيحصل مع كل DNA replication.
          - الـ telomere بيقصر **مع السن**، وممكن يقصر كمان بشكل acquired.
          - القِصَر ده ممكن يموّت الـ alveolar epithelial cells، فيحصل aberrant repair.
          - **Mutation in telomerase** مرتبطة بالـ **familial IPF**.

          وفهم الحاجات دي هو اللي فتح الباب لعلاجات جديدة (nintedanib و pirfenidone في الدرس الرابع).
      - kind: check
        page: 175
        quote: "TGF-ẞ has been shown to promote an antiapoptotic phenotype in fibroblasts."
        question: "Which factor makes fibroblasts resist apoptosis in IPF?"
        options: ["TGF-beta", "Telomerase", "Endothelin-1", "Interleukin-2"]
        answer: 0
        why:
          - "صح: الـ TGF-beta بيعمل antiapoptotic phenotype."
          - "الـ telomerase إنزيم بيطوّل الـ telomeres؛ مشكلته في الـ epithelium مش الـ fibroblast."
