        quote: "Non-pharmacological stimulation for mild dysfunction. 2. Pharmacological stimulation* for moderate dysfunction. 3. Saliva substitution for severe dysfunction."
        prompt: "ليه الغدة المدمَّرة جدًا (severe) ما ينفعش معاها stimulation؟"
        answer: |
