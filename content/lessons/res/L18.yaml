          - { key: "L", text: "Life or death (yes/no: survival، recurrence، cure) ← Logistic." }
        hook: "**رقم ← Linear، نعم/لا ← Logistic.** الـ «L» التانية في Logistic = «Life or death»."
      - kind: explain
        page: 27
        quote: "1-Multiple linear regression\nThe Dependent Variable is numerical & independent either Numerical OR may include Nominal but dichotomous (0 & 1 coding – dummy coding).\nThe choice of which value is 1 & 0 is arbitrary and chosen by researcher to facilitate interpretation."
        title: "الـ multiple linear regression"
        text: |
          - الـ **dependent**: لازم **numerical**.
          - الـ **independent**: numerical، أو nominal بس **dichotomous** متكوّد **0 و1** (==dummy coding==)، زي ذكر/أنثى أو مدخن/مش مدخن.

          مين ياخد 1 ومين ياخد 0؟ **arbitrary**، الباحث بيختار اللي يسهّل التفسير.
      - kind: explain
        page: 28
        quote: "The equation for multiple regression\nThe equation is similar to simple regression (Y=a+ bx), yet, including more than one independent variables\nY= a + b1x1+ b2x2+ b3x3+......"
        title: "نفس المعادلة… بس أطول"
        text: |
          زي الـ simple regression بالظبط، بس فيها أكتر من independent:

          **Y = a + b1x1 + b2x2 + b3x3 + …**

          مثال الدكتورة: **HB%** = α + b1 age + b2 height + b3 sex + b4 weight + b5 income + b6 family size + b7 smoking + … + b13 pregnancy.
      - kind: explain
