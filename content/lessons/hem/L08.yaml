        page: 123
        title: "الـ resistance للـ imatinib"
        quote: "It may be primary or secondary, primary resistance may be due to overexpression of the BCR/ABL oncoprotein and overexpression of P- Glycoprotein which lead to effux of the drug from individual cells, and point mutation in ABL kinase domain, different point mutations have been identified in leukaemia cells, the replacement of threonine by isoleucine at position 315 (referred to as the T3151 mutation), seem to be especially resistant to the inhibitory action of imatinib and all other TKIs."
