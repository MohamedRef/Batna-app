  - id: hb.L07.lesson6
    title: "الـ cirrhosis والحالات اللي ليها قواعد خاصة"
    hook: "في الـ cirrhosis ننسى رقم 2,000 خالص. وفيروس مستخبي من غير HBsAg؟ آه، اسمه occult."
    minutes: 8
    pages: [120, 122]
    topics: [cirrhosis, special]
    goals:
      - "تعرف قواعد علاج الـ HBV في الـ compensated والـ decompensated cirrhosis"
      - "تتعامل مع الـ healthcare worker والـ HBV/HCV coinfection"
      - "تعرّف الـ occult HBV وتعرف بيتلاقي فين"
    status: unverified
    steps:
      - kind: explain
        page: 120
        title: "الـ cirrhosis: أي DNA يتعالج"
        text: |
          - **Compensated or decompensated cirrhosis** → **need treatment** مع **any detectable HBV DNA** و **regardless of ALT**.
          - استخدم **NA with high barrier to resistance**.
          - العيان يتقيّم لـ **liver transplantation**.
      - kind: reveal
        page: 120
        prompt: "ليه في الـ cirrhosis بنعالج أي DNA، حتى لو 100 IU/mL والـ ALT طبيعي؟"
        answer: |
          التفسير المقبول: الكبد الـ cirrhotic **مالوش احتياطي**. أي flare، حتى لو صغير، ممكن يقلبه decompensated.

          وعلشان كده كمان لازم **high barrier to resistance**: لو حصل resistance وطلع flare، التمن هنا غالي جدًا.
      - kind: explain
        page: 120
        title: "الـ decompensated"
        text: |
          - **All NAs must be adjusted to renal function**.
          - حوالي **35%** من اللي اتعالجوا **delisted for liver transplantation**.
          - و **improvement of Child-Pugh Score > 2** في **40–50%** على الأقل.
      - kind: aside
        tone: joke
        page: 120
        text: |
          **35%** اتشالوا من قايمة الزرع بسبب حباية في اليوم. ده أحسن خبر ممكن يسمعه حد واقف في طابور، أحسن من إن الطابور اتلغى. 😄
      - kind: check
        page: 120
        question: "A man with decompensated HBV cirrhosis (Child B, with ascites) has HBV DNA 150 IU/mL and normal ALT. What does the book advise?"
        options:
          - "Start an NA with a high barrier to resistance, adjusted to renal function, and assess for transplant"
          - "No treatment: DNA is below 2,000 IU/mL"
          - "No treatment: ALT is normal"
          - "Start lamivudine because it is cheapest"
        answer: 0
        why:
          - "صح: في الـ cirrhosis **any detectable DNA** و **regardless of ALT**، NA بـ high barrier، dose على الكلى، وتقييم للزرع."
          - "رقم الـ 2,000 للـ non-cirrhotic؛ في الـ cirrhosis أي DNA."
          - "الكتاب بيقول **regardless of ALT levels**."
          - "الـ lamivudine low barrier (70% resistance في 5 سنين)، والكتاب عايز **high barrier**."
      - kind: explain
        page: 121
        title: "الـ healthcare worker"
        text: |
          الـ **healthcare workers** اللي بيعملوا **exposure prone procedures** ومعاهم **HBV DNA > 200 IU/mL** ممكن يتعالجوا بـ **NA** علشان نقلل **transmission risk**.

          لاحظ: الهدف هنا حماية المرضى، مش بس الكبد بتاعه.
      - kind: explain
        page: 121
        title: "HBV + HCV coinfection"
        text: |
          - علاج الـ HCV بالـ **DAAs** ممكن يعمل **reactivation of HBV**.
          - اللي بيستوفي **standard criteria for HBV treatment** → ياخد **NA**.
          - اللي مش بيستوفي → **monitored** ويتعمله **test for HBV reactivation in case of ALT elevation**.
      - kind: reveal
        page: 121
        prompt: "إزاي علاج فيروس C يصحّي فيروس B؟"
        answer: |
          التفسير المقبول: الفيروسين بيتنافسوا جوه الكبد، والـ **HCV** كان بيكتم الـ **HBV**.

          لما الـ DAAs تشيل الـ HCV بسرعة، الـ HBV يلاقي الساحة فاضية فيطلع. علشان كده الكتاب بيقول راقب الـ ALT.
      - kind: explain
        page: 122
        title: "الـ occult HBV"
        text: |
          - **Detection of HBV DNA in the absence of HBsAg**.
          - الـ DNA موجود **in the liver** في أغلب الحالات، وفي الـ **serum** يا مش موجود يا قليل.
          - **Anti-HBc** عادة **positive**.
          - أشهر في **cirrhosis أو HCC**: غالبًا كانوا chronic HBV لعشرات السنين، والكبد اتأذى، بس الـ HBsAg اختفى لما اتشخّصوا.
      - kind: aside
        tone: analogy
        page: 122
        text: |
          الـ occult HBV زي حرامي **رمى الكارنيه** (HBsAg) بس **بصماته** لسه في المكان: **DNA في الكبد** و **anti-HBc** في الدم.

          فلو عيان عنده cirrhosis أو HCC "من غير سبب" والـ HBsAg سالب، بص على الـ anti-HBc.
      - kind: sort
        page: 121
        prompt: "مين ياخد NA ومين نراقبه بس؟"
        bins: ["Give an NA", "Monitor"]
        cards:
          - { text: "Cirrhosis, HBV DNA 80 IU/mL, normal ALT", bin: 0 }
          - { text: "Surgeon doing exposure-prone procedures, DNA 900 IU/mL", bin: 0 }
          - { text: "HBV/HCV on DAAs, meets HBV treatment criteria", bin: 0 }
          - { text: "HBV/HCV on DAAs, does not meet HBV criteria", bin: 1 }
          - { text: "No cirrhosis, HBeAg negative, DNA 1,200 IU/mL, normal ALT", bin: 1 }
        why: "الـ cirrhosis: أي DNA. الـ healthcare worker: > 200 IU/mL. الـ coinfection: اللي يستوفي criteria ياخد NA والباقي يتراقب. والـ inactive carrier (DNA < 2,000) يتابع."
      - kind: try
        items: [hb.L07.052, hb.L07.053, hb.L07.054, hb.L07.055, hb.L07.057]
    recap:
      - "Cirrhosis: treat **any detectable DNA**، **regardless of ALT**، NA بـ **high barrier**، وتقييم للزرع."
      - "Decompensated: الـ NAs على الكلى. **35%** delisted، Child-Pugh يتحسن **> 2** في **40–50%**."
      - "Healthcare worker مع DNA **> 200 IU/mL** ممكن ياخد NA."
      - "DAAs ممكن يصحّوا الـ HBV: criteria → NA، غير كده monitor مع الـ ALT."
      - "Occult = **DNA من غير HBsAg**، anti-HBc عادة +، أشهر في cirrhosis و HCC."
    practice: [hb.L07.052, hb.L07.053, hb.L07.054, hb.L07.055, hb.L07.056, hb.L07.057, hb.L07.058, hb.L07.075, hb.L07.086]

