  - id: geri.L11.lesson3
    title: "الـ COPD: وشوش كتير لمرض واحد"
    hook: "مريض بيكح بلغم، ومريض نحيف بينهج، ومريض بيشخّر بالليل. التلاتة COPD، بس كل واحد phenotype."
    minutes: 9
    pages: [197, 201]
    topics: [pathogenesis, phenotypes]
    goals:
      - "تعرف بداية الـ COPD ودور الـ telomeres والـ immunosenescence"
      - "تفرّق chronic bronchitis عن emphysema"
      - "تعرف الـ phenotypes والـ BODE index"
    status: unverified
    steps:
      - kind: explain
        page: 197
        quote: "Earlyinitiating phases of COPD fall into two categories: (1) Antioxidant / oxidant. (2) Antiprotease / protease imbalance."
        title: "البداية"
        text: |
          البداية المبكرة للـ COPD نوعين:

          1. **Antioxidant / oxidant** imbalance.
          2. **Antiprotease / protease** imbalance.

          والمرض بيكمّل على عشرات السنين **حتى بعد وقف التدخين**، والتفسير مراحل ==progression== و **consolidation** في host عنده استعداد وراثي.
      - kind: explain
        page: 198
        quote: "Telomere shortening: leads to increased apoptosis in the lungs of patients with COPD"
        title: "ليه مرض كبار؟"
        text: |
          - **Telomeres** أقصر في خلايا رئة مرضى الـ COPD من ناس في نفس السن من غير COPD. القِصَر ده بيزوّد الـ ==apoptosis==، وعدم التوازن بين الـ apoptosis والـ repair ممكن يكون أساس الـ emphysema.
          - **Immunosenescence**: بنفقد مع السن جزيئات حماية زي **MIF** (macrophage migration inhibitory factor) و growth factors، فالـ alveoli والـ terminal airways تتدمر.

          (نفس فكرة الـ telomeres في الـ IPF في المحاضرة اللي فاتت.)
      - kind: table
        page: 198
        quote: "Chronic Bronchitis Emphysema Larger airways Terminal airways Airway remodeling Loss of alveoli Mucus secretion Loss of elastin"
        title: "Chronic bronchitis ضد emphysema"
        columns: ["", "Chronic bronchitis", "Emphysema"]
        rows:
          - ["Site", "Larger airways", "Terminal airways"]
          - ["Main change", "Airway remodeling", "Loss of alveoli"]
          - ["Also", "Mucus secretion", "Loss of elastin"]
        hide: [[0, 2], [1, 1], [2, 2]]
      - kind: explain
        page: 199
        quote: "(1) Mucus hypersecretion. (2) Chronic airflow obstruction. (3) Air trapping and hyperinflation, (4) Gas exchange abnormalities."
        title: "الـ impairments"
        text: |
          الـ COPD بيعمل أربع مشاكل: **mucus hypersecretion**، **chronic airflow obstruction**، **air trapping و hyperinflation**، و **V/Q mismatch**.

          - الـ ==chronic bronchitis==: كحة وبلغم **3 شهور في السنة لمدة سنتين ورا بعض**؛ الـ hallmark هو الـ mucus hypersecretion من airway inflammation مستمر.
          - أهم مكان للـ resistance: airways **أقل من 2 mm**.
      - kind: explain
        page: 199
        quote: "Marked intrathoracic pressure swings can decrease left ventricular preload and increase left ventricular diastolic dysfunction, ultimately reducing the cardiac output."
        title: "الصورة الإكلينيكية"
        text: |
          - Exercise intolerance و dyspnea بيحددوا النشاط، وخطر **respiratory failure**.
          - المتقدم: hypoxemia و hypercapnia → respiratory acidosis.
          - **Hypoxic pulmonary vasoconstriction** → pulmonary hypertension → ==cor pulmonale==.
          - تقلبات الضغط جوه الصدر بتقلل الـ LV preload وتزود الـ diastolic dysfunction، فالـ cardiac output يقل.
          - الـ emphysema phenotype بالذات (inflammation، anorexia، deconditioning) بيعمل **osteoporosis و sarcopenia**.
