  - id: neph.L01.lesson5
    title: "Metabolic alkalosis والأسباب التنفسية"
    hook: "تحليل بول واحد (urine Cl) بيقسم أسباب الـ alkalosis نصين. وبعده الضغط والـ renin يكمّلوا."
    minutes: 9
    pages: [16, 19]
    topics: [met-alkalosis, resp-acidosis, resp-alkalosis]
    goals:
      - "تقسم الـ metabolic alkalosis لـ chloride-responsive و resistant"
      - "تمشي على الـ urine Cl algorithm"
      - "تعرف أسباب الـ respiratory acidosis والـ alkalosis"
    status: unverified
    steps:
      - kind: explain
        page: 16
        quote: "Causes of metabolic alkalosis"
        title: "نصين"
        text: |
          الـ ==metabolic alkalosis== في الكتاب نوعين:

          - **Chloride-responsive**: GI و renal (vomiting، NG suction، villous adenoma، congenital chloride diarrhea، posthypercapnia، contraction alkalosis، cystic fibrosis...) وأدوية (loop و thiazide diuretics، NaHCO3، citrate، antacids، transfusions).
          - **Chloride-resistant**: مع **high BP** (primary aldosteronism، Cushing، licorice، Liddle، 11β-HSD2 deficiency...) أو **normal BP** (Bartter و Gitelman) أو غيرهم (hypercalcemia، hypoparathyroidism، post-feeding).
      - kind: figure
        page: 17
        quote: "Urine CI-"
        title: "الـ urine Cl algorithm"
        alt: "Flowchart. Urine chloride below 10 to 20: vomiting, chloruretic diuretics, villous adenoma, cystic fibrosis, exogenous alkali, posthypercapnia. Above 10 to 20: urine potassium; below 20 laxative abuse or severe K depletion; above 20 check blood pressure. Low BP: Bartter or Gitelman, separated by urine calcium (low Gitelman, high Bartter). High BP: plasma renin; low renin primary aldosteronism, licorice, Liddle; high renin renovascular or malignant hypertension, Cushing."
