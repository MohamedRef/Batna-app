        quote: "Recommendations for management of patients with PV\n  1. Venesection to maintain hematocrit < 0.45\n  2. Low-dose aspirin (unless contraindicated) a\n  3. Manage reversible thrombotic risk factors aggressively (e.g., smoking, hypertension, hypercholesterolemia, obesity)\n  4. Consider cytoreduction if\n    (i) Patient intolerant of venesection\n    (ii) Thrombocytosis develops\n    (iii) Symptomatic or progressive splenomegaly\n  5. Choice of cytoreductive therapy:\n    (i) < 40 years – interferon-α b\n    (ii) > 40 years – hydroxyurea ,c\na. Avoid aspirin while platelet count > 1500 x 10⁹/L.\nb. Anagrelide plus venesection may be useful in patients intolerant of or resistant to hydroxyurea and interferon.\nc. Consider 32P or intermittent use of busulfan if patient is elderly and outpatient attendance is impractical."
