          <text x="165" y="42" text-anchor="middle" class="t-sm">SVR falls a lot: severe arterial underfilling</text>
          <path d="M165 52v16" class="fg-arrow" marker-end="url(#L09f)"/>
          <rect x="12" y="72" width="306" height="40" rx="7" class="fg-acc"/>
          <text x="165" y="89" text-anchor="middle" class="t-b">RAAS + SNS + ADH at full blast</text>
          <text x="165" y="104" text-anchor="middle" class="t-sm">cirrhotic cardiomyopathy: low CO makes it worse</text>
          <path d="M165 114v16" class="fg-arrow" marker-end="url(#L09f)"/>
