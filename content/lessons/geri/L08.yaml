        page: 139
        quote: "Osteoarthritis is a leading cause of pain and disability around the world Utilizing the 2010 Global Burden of Disease study, the WHO states that 10% of men and 20% of women over the age of 60 have symptomatic osteoarthritis. Based on the United Nations' population predictions, the WHO suspects that 130 million people will have symptomatic osteoarthritis by 2050."
