        text: "العيان بياكل كتير وبيخس. ده مش ريجيم سحري: الخلايا **جعانة** والسكر واقف برا الباب في الدم، والبول بياخد الباقي. أغلى ريجيم في الدنيا، تمنه الكلى والعين."
      - kind: explain
        remind: [dm.L01.046]
        page: 7
        title: "Acute ولا subacute؟"
        quote: "2- Subacute: older, several months\n  Thirst, weight loss, and polyuria.\n  Lack of energy.\n  Blurring of vision.\n  Balanitis or pruritus vulvae."
        text: |
          - **Acute, classic, severe (type 1):** polyuria، polydipsia، polyphagia، weight loss. ومفيش **signs**، إلا في الحالات الـ ==fulminant==: dehydration و acidosis (**diabetic ketoacidosis (DKA)**).
          - **Subacute (type 2، أكبر سنًا، على شهور):** thirst، weight loss، polyuria، **lack of energy**، **blurred vision**، و **balanitis أو pruritus vulvae**.

          ليه type 1 بييجي فجأة و type 2 على شهور؟ لأن type 1 فيه **absolute** insulin deficiency، فالسكر بيطلع بسرعة والجسم يكسّر دهون (ketones). أما type 2 فالـ insulin موجود بس مش كفاية، فالسكر بيعلى ببطء.

          والتفسير المقبول (مش في الكتاب) لعلامات الـ subacute: الـ **blurred vision** من إن السكر بيغيّر الميه جوه عدسة العين فتتغير قوتها، والـ **balanitis** والـ **pruritus vulvae** لأن السكر في البول أكل حلو للـ Candida.
