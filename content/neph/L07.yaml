  - id: neph.L07.043
    kind: cloze
    topic: adpkd-extrarenal
    text: "Intracranial aneurysms occur in about {{c1::8%}} of ADPKD patients: {{c2::6%}} with a negative and {{c3::16%}} with a positive family history."
    src: { page: 151, quote: "Intracranial aneurysms occur in about 8% of patients with ADPKD. There is some familial clustering; intracranial aneurysms occur in 6% of patients with a negative family history and 16% of those with a positive family history. Most are asymptomatic. Focal findings, such as cranial nerve palsy and seizure, may result from compression of local structures by an enlarging aneurysm (Fig. 44.5). Yearly rupture rates increase with size, ranging from less than 0.5% for aneurysms smaller than 5 mm in diameter to 4% for aneurysms larger than 10 mm. Rupture carries a 35% to 55% risk for combined severe morbidity and mortality." }
    status: unverified
    tags: [numbers, high-yield]
