            <text x="56" y="100" text-anchor="middle" class="t-sm t-b">GLP-1 RA</text>
            <text x="56" y="117" text-anchor="middle" class="t-sm t-mut">either / or</text>
            <text x="56" y="134" text-anchor="middle" class="t-sm t-b t-good">SGLT2i</text>
            <text x="165" y="108" text-anchor="middle" class="t-sm t-b t-good">SGLT2i</text>
            <text x="165" y="126" text-anchor="middle" class="t-sm">HF benefit</text>
            <text x="274" y="100" text-anchor="middle" class="t-sm t-b t-good">SGLT2i</text>
            <text x="274" y="117" text-anchor="middle" class="t-sm">eGFR ≥20</text>
            <text x="274" y="134" text-anchor="middle" class="t-sm t-mut">else GLP-1 RA</text>
            <text x="165" y="175" text-anchor="middle" class="t-sm t-mut">CKD = eGFR &lt;60 or ACR ≥30 mg/g</text>
            <text x="165" y="192" text-anchor="middle" class="t-sm t-mut">(on max ACEi/ARB, repeat to confirm)</text>
          </svg>
      - kind: explain
        page: 39
        title: "التفاصيل اللي بتتسأل"
        quote: "+CKD: eGFR <60 mL/min per 1.73 m2 OR albuminuria (ACR ≥3.0 mg/mmol [30mg/g]). These measurements may vary over time; thus, a repeat measure is required to document CKD.\n+CKD (on maximally tolerated dose of ACEi/ARB):\n  PREFERABLY SGLT2i with primary evidence of reducing CKD progression\n    Use SGLT2i in people with an eGFR ≥20 mL/min per 1.73 m2; once initiated should be continued until initiation of dialysis or transplantation\n  OR GLP-1 RA with proven CVD benefit if SGLT2i not tolerated or contraindicated\n  If HbA1c above target, for patients on SGLT2i, consider incorporating a GLP-1 RA or vice versa"
        text: |
          - **ASCVD:** لو الـ haemoglobin A1c (A1C) فوق الهدف، على glucagon-like peptide-1 receptor agonist (GLP-1 RA) زوّد **SGLT2 inhibitor (SGLT2i)** والعكس، أو **thiazolidinedione (TZD)**.
          - **Heart failure (HF):** أعراض حالية أو قديمة مع **heart failure with reduced ejection fraction (HFrEF) أو heart failure with preserved ejection fraction (HFpEF)** موثّق.
          - **Chronic kidney disease (CKD):** الـ SGLT2i من ==estimated glomerular filtration rate (eGFR) ≥20==، وتكمّله لحد الـ **dialysis أو transplantation**.

          ليه نكمّل الـ SGLT2i لحد الـ dialysis مع إن مفعوله على السكر بيقل؟ لأن هنا إحنا مستخدمينه عشان **يبطّأ الـ CKD progression** مش عشان الـ A1C. والتفسير المقبول (مش في الكتاب): بيرجّع الملح للـ macula densa، فالـ afferent arteriole تضيق والضغط جوه الـ glomerulus يقل، فالكلية تشتغل أقل وتعيش أطول. وفي الـ HF بيطلّع ملح وميه فيخفّف الحِمل على القلب.
      - kind: match
        page: 39
        quote: "+HF: Current or prior symptoms of HF with documented HFrEF or HFpEF\n  SGLT2i with proven HF benefit in this population"
        prompt: "وصّل الـ arm بأول اختيار:"
        pairs:
          - ["+ASCVD", "GLP-1 RA or SGLT2i (CVD benefit)"]
          - ["+HF", "SGLT2i (HF benefit)"]
          - ["+CKD", "SGLT2i if eGFR ≥20"]
          - ["CKD, SGLT2i not tolerated", "GLP-1 RA (CVD benefit)"]
      - kind: aside
        tone: exam
        page: 39
        quote: "+ASCVD/Indicators of High Risk:\n  GLP-1 RA with proven CVD benefit EITHER/ OR SGLT2i with proven CVD benefit\nIf HbA1c above target:\n  For patients on a GLP-1 RA consider adding SGLT2i with proven CVD benefit or vice versa\n  TZD"
        text: "في الامتحان: الـ cardiorenal drug بيتختار علشان **الخطر**، مش علشان الـ A1C. عيان MI والـ A1C بتاعه 7.1%؟ برضه ياخد GLP-1 RA أو SGLT2i."
      - kind: check
        page: 39
        quote: "+HF: Current or prior symptoms of HF with documented HFrEF or HFpEF\n  SGLT2i with proven HF benefit in this population"
        question: "Type 2, HFpEF documented on echo, A1C 7.6% on metformin. Add?"
        options: ["SGLT2i with proven HF benefit", "Pioglitazone for insulin resistance", "Saxagliptin as a weight-neutral add-on", "Sulfonylurea for a quick A1C fall"]
        answer: 0
        why:
          - "صح: الـ +HF arm (p39)."
          - "الـ TZD بيحجز مية، ومش اختيار الـ HF."
          - "DPP-4i ملوش HF benefit."
          - "ملوش cardiorenal benefit."
      - kind: reveal
        page: 38
        quote: "Individuals with established CVD (e.g., MI, stroke, any revascularization procedure)."
        prompt: "عيان عمل stent السنة اللي فاتت، والـ A1C بتاعه 7.1% بس. ليه نزوّد له GLP-1 RA أو SGLT2i مع إن السكر تقريبًا مظبوط؟"
        answer: |
          لأنه **ASCVD** (any revascularization procedure)، والـ algorithm بيقول الـ cardiorenal arm هدفه **Cardiorenal Risk Reduction in High-Risk Patients** بغض النظر عن الـ A1C.

          التفسير المقبول (مش في الكتاب): الأدوية دي اتجرّبت في دراسات كبيرة وقللت الجلطات والوفاة، وده أثر **غير** نزول السكر. فإنت بتديله دوا للقلب صادف إنه بينزّل السكر كمان.
      - kind: check
        page: 38
        quote: "Indicators of high risk 55 years of age with two or more additional risk factors, including:"
        question: "Which patient has 'indicators of high risk' in the ADA algorithm?"
        options:
          - "58 years old, obese and a smoker"
          - "50 years old, obese and hypertensive"
          - "60 years old with obesity only"
          - "45 years old, smoker with dyslipidemia and albuminuria"
        answer: 0
        why:
          - "صح: سن **≥55** ومعاه **اتنين** risk factors (obesity و smoking)."
          - "السن أقل من 55."
          - "risk factor واحد بس؛ لازم اتنين أو أكتر."
          - "عنده risk factors كتير، بس السن أقل من 55."
      - kind: try
        items: [dm.L04.001, dm.L04.003, dm.L04.007, dm.L04.012, dm.L04.016]
    recap:
      - "Type 2: 45% obese، 80% hypertension، 50% high cholesterol؛ السكر والقلب والكلية مترابطين."
      - "أربع أهداف: glycemic، weight، CV risk factors، cardio-renal protection."
      - "High risk = سن ≥55 + اتنين risk factors أو أكتر."
      - "ASCVD: GLP-1 RA أو SGLT2i. HF: SGLT2i. CKD: SGLT2i (eGFR ≥20، لحد الـ dialysis)، وإلا GLP-1 RA."
    practice: [dm.L04.001, dm.L04.002, dm.L04.003, dm.L04.004, dm.L04.005, dm.L04.006, dm.L04.007, dm.L04.008, dm.L04.009, dm.L04.010, dm.L04.011, dm.L04.012, dm.L04.013, dm.L04.014, dm.L04.015, dm.L04.016, dm.L04.075]
