    front: What is the genetic defect in PNH?
    back: A mutation of the X-linked Phosphatidylinositol glycan class A gene (PIGA) gene, so the glycosylphosphatidylinositol (GPI) anchor that binds certain proteins to the cell membrane cannot be made.
    src: { page: 50, quote: "The common denominator in the disease appears to be a genetic mutation leading to the inability to synthesize the glycosyl-phosphatidylinositol (GPI) anchor that binds these proteins to cell membranes." }
