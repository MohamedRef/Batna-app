  - id: hem.L05.lesson7
    title: "الـ DIC: بيجلّط وبينزف في نفس الوقت"
    hook: "عيان sepsis بينزف من مكان الكانيولا، وفي نفس الوقت جسمه مليان جلطات صغيرة. ده مش تناقض، ده DIC."
    minutes: 9
    pages: [78, 80]
    topics: [dic, other-acquired]
    goals:
      - "تعدّ أسباب الـ DIC وتعرف إيه اللي بيجمعهم"
      - "تشرح ليه بينزف ويعمل MAHA مع إن المشكلة جلطات"
      - "تجاوب سؤال الكتاب: causes and diagnosis of DIC"
    status: unverified
    steps:
      - kind: explain
        remind: [hem.L05.053, hem.L05.054]
        page: 78
        title: "DIC: أسبابه"
        quote: "2. Bacterial toxin e.g. gram negative septicemia, miningoccacal septicaemia.\n3. Other infection e.g. falciparm maleria.\n4. Hypovolaemic shock."
        text: |
          - **Bacterial toxins**: ==gram-negative septicemia==، meningococcal septicemia
          - **Other infections**: falciparum malaria
          - **Hypovolemic shock**
          - **Obstetric**: amniotic fluid embolism، abruptio placentae، intrauterine death
          - **Tissue factor release**: trauma، burns، malignancy

          الكتاب بيقول إن الـ DIC بيبدأ بـ ==variety of different mechanism== في حالات مختلفة. الخيط اللي بيجمعهم، التفسير المقبول (مش في الكتاب): كلهم بيدخّلوا **شرارة تجلّط في الدم كله** مرة واحدة. الـ trauma والـ burns والـ cancer والـ placenta بيطلّعوا **tissue factor**، والـ bacterial toxins بتعوّر الـ endothelium، والـ shock بيبطّأ الدورة فالجلطات الصغيرة تتكوّن.
      - kind: check
        page: 78
        quote: "5. Obstetric complications. E.g. amniotic fluid embolism, abruptio placentae, and intrauterine death."
        question: "Which obstetric problem does the lecture list as a cause of DIC?"
        options: ["Abruptio placentae", "Gestational diabetes", "Hyperemesis gravidarum", "Placenta praevia without bleeding"]
        answer: 0
        why:
          - "صح: الكتاب بيعدّ amniotic fluid embolism و abruptio placentae و intrauterine death."
          - "مش في قايمة الكتاب ومش بيطلّع tissue factor."
          - "مش في قايمة الكتاب."
          - "مش في قايمة الكتاب."
      - kind: figure
        page: 79
        quote: "Widespread activation of coagulation"
        title: "الـ DIC: بيجلّط وبينزف في نفس الوقت"
        alt: "A loop. Widespread activation of coagulation and generalized platelet aggregation make microthrombi. Microthrombi consume clotting factors and platelets, which leads to bleeding. Microthrombi also trigger fibrinolysis, raising FDPs, which worsens bleeding. Red cells passing the microthrombi fragment into schistocytes."
        caption: "الـ microthrombi بتاكل الـ ==factors والـ platelets==، فالعيان ينزف، والـ fibrinolysis بتطلّع fibrin degradation products (FDPs)، والـ red blood cells (RBCs) بتتقطّع (schistocytes)."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L05c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="45" y="10" width="240" height="44" rx="10" class="fg-acc"/>
