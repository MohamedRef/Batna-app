          </svg>
      - kind: match
        page: 44
        prompt: "وصّل كل مرحلة بالوقاية بتاعتها:"
        pairs:
          - ["No varices", "Pre-primary: prevent formation"]
          - ["Small varices", "Prevent variceal growth"]
          - ["Large varices, never bled", "Primary prophylaxis"]
          - ["Bleeding now", "Treat acute bleeding"]
          - ["Survived a first bleed", "Secondary prophylaxis"]
        why: "الأسامي بتمشي مع الوقت: **pre-primary** قبل ما الـ varices تبقى موجودة، **primary** قبل أول نزيف، **secondary** بعد أول نزيف."
      - kind: aside
        tone: joke
        page: 44
        text: |
          الدوالي اللي نزفت مرة زي **الحنفية اللي نقّطت مرة**: لو سبتها، هتنقّط تاني. **63% في سنتين** من غير وقاية. 😄

          وعلشان كده الـ **secondary prophylaxis** مش اختيار، دي إلزامي بعد أي نزيف.
      - kind: explain
        page: 44
        title: "المنظار بيوريك إيه؟"
        text: |
          - **«All cirrhotic patients should be screened for varices at diagnosis.»** كل مريض cirrhosis يعمل منظار وقت التشخيص (إلا لو عدّى Baveno من المحاضرة اللي فاتت).
          - صورة الكتاب في الـ EGD: **large oesophageal varices with red colour signs** (علامات حمرا على الدوالي = جدارها رفيع وخطر نزيف) و **mild portal hypertensive gastropathy**.
          - الـ **PHG (portal hypertensive gastropathy)**: **التشخيص بيتعمل endoscopically**. شكلها الكلاسيكي في الـ fundus والجزء القريب من المعدة: **mosaic أو snakeskin pattern**.
      - kind: case
        stem: "Two women with HCV cirrhosis and iron-deficiency anaemia have endoscopy. (The lecture shows PHG on p45 but gives no treatment; book questions 14 and 15 ask about it, so the answers below follow standard guidance.)"
        steps:
          - reveal: "Woman 1: melena for 3 days, Hb 10.8. Small varices without stigmata. The proximal stomach has a mosaic, snakeskin mucosa with diffuse oozing, and no gastric varices."
            question: "What is the first-line treatment?"
            options:
              - "Non-selective beta-blocker (e.g. nadolol) and iron"
              - "Band ligation of the small varices"
              - "Argon plasma coagulation"
              - "Liver transplantation"
            answer: 0
            why: "ده **PHG** (mosaic/snakeskin في الـ proximal stomach). مصدره الضغط نفسه، فالعلاج إنك **تنزّل الـ portal pressure** بـ NSBB ومعاه iron. الـ varices الصغيرة مش هي اللي بتنزف."
          - reveal: "Woman 2: Hb 7.3. Flat red stripes radiate from the pylorus in the antrum, with some oozing."
            question: "Which treatment would be least effective here?"
            options:
              - "TIPS"
              - "Argon plasma coagulation"
              - "Endoscopic radiofrequency ablation"
              - "Antrectomy"
            answer: 0
            why: "ده **GAVE (watermelon stomach)**: خطوط في الـ **antrum**، ومش بيتسبب من الـ portal pressure، فالـ **TIPS ما بيفيدش**. العلاج موضعي (APC، RFA، heater probe) أو جراحة. الفرق: **PHG في الـ fundus وبتتحسن بنزول الضغط، GAVE في الـ antrum ومالهاش دعوة بالضغط**."
      - kind: try
        items: [hb.L03.025, hb.L03.028, hb.L03.030, hb.L03.033, hb.L03.027]
    recap:
      - "CSPH = **HVPG > 10 mmHg**، وبيتنبأ بالـ varices والـ decompensation والـ HCC."
      - "Biopsy predictors للـ CSPH: **thick fibrous septae و small nodule size**."
      - "**أكتر من 10** تتكوّن، **أكتر من 12** تنفجر، **أكتر من 20** high-risk."
      - "Natural history: ~50% من غير varices، **4–5%/سنة** تتكوّن، small → large **12%/سنة**، نزيف **أقل من 10%** (small) و **أكتر من 25%** (large) في سنتين، rebleeding **63%** في سنتين."
      - "كل cirrhotic يتعمله منظار وقت التشخيص. الـ PHG تشخيصها **endoscopic**."
    practice: [hb.L03.025, hb.L03.026, hb.L03.027, hb.L03.028, hb.L03.029, hb.L03.030, hb.L03.031, hb.L03.032, hb.L03.033, hb.L03.034, hb.L03.088, hb.L03.096, hb.L03.101, hb.L03.106, hb.L03.107]
