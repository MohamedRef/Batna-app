  - kind: explain
    page: 24
    quote: |-
      Note
      Sensitivity and specificity are not related to disease prevalence
      PPV is directly related to disease prevalence
      NPV is inversely related to disease prevalence
      Important Notice
    title: القاعدة المهمة (Important notice)
    text: |-
      - الـ **sensitivity** والـ **specificity**: ==مش بيتأثروا بالـ prevalence==.
      - الـ **PPV**: **directly** related للـ prevalence (المرض أكتر ← PPV أعلى).
      - الـ **NPV**: **inversely** related (المرض أكتر ← NPV أقل).

      عشان كده نفس النتيجة الـ positive معناها يختلف بين مجتمع المرض فيه منتشر ومجتمع نادر فيه.
  - kind: reveal
    page: 24
    quote: |-
      Note
      Sensitivity and specificity are not related to disease prevalence
