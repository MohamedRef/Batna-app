      - kind: explain
        page: 188
        title: "Dysgammaglobulinaemia"
        quote: "Is the term for selective deficiencies in one or more classes or subclasses of immunoglobulin.\nThe most common is selective IgA deficiency which occurs in about 1/500 people. These people have an increased incidence of upper respiratory infections and some increase in gastrointestinal problems, but the disease is not usually life threatening."
        text: |
          **Dysgammaglobulinaemia** = نقص ==selective== في class أو subclass واحدة أو أكتر.
          - الأشهر ==selective IgA deficiency==: حوالي **1/500**. upper respiratory infections أكتر، ومشاكل GI أكتر شوية، بس **not usually life threatening**
          - **X-linked hyper-IgM:** **CD40 ligand** غايب أو بايظ على الـ **T cells** ← مفيش class switch من IgM للباقي. وفيه شكل autosomal recessive
          - **تانيين:** hyper-IgE، IgG subclass deficiency، selective IgM deficiency، والكتاب بيقول غالبًا من **defective switch mechanisms**

          ليه الـ IgA بالذات بيدّي صدر وبطن؟ التفسير المقبول (مش في الكتاب): الـ IgA هو antibody الأغشية (الأنف، الشعب، الأمعاء). وليه مش خطير؟ لأن الـ IgG والـ IgM شغالين في الدم وبيغطّوا.
      - kind: match
        page: 188
        quote: "In X-linked immunodeficiency with hyper-IgM, absent or defective CD40 ligand on T cells prevents the class switch from IgM to the other immunoglobulins. An autosomal recessive form is also reported."
        prompt: "وصّل كل مرض بالعيب بتاعه:"
        pairs:
