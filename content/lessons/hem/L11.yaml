          - **أول 4 صفوف**: corticosteroids، alkylating agents، ==proteasome inhibitors== (bortezomib، carfilzomib، ixazomib oral)، و الـ **IMiDs** (lenalidomide، pomalidomide، thalidomide).
          - **الصف الكبير في النص**: الـ **monoclonal** و **bi-specific antibodies** وأهدافها بين قوسين (anti-CD38، anti-SLAMF7، anti-BCMA، anti-CD3).
