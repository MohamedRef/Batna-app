        options: ["Vesanoid (ATRA) daily for one year", "Methotrexate weekly for 2–3 years", "Allogeneic HSCT for everyone", "No maintenance"]
        answer: 0
        why:
          - "صح: ATRA بالجرعة العادية يوميًا سنة."
          - "ده جزء من maintenance الـ ALL."
          - "الكتاب ما بيقولش كده في الـ APL."
          - "فيه maintenance سنة."
