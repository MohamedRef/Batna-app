items:
  # ---------- p1-3: introduction ----------
  - id: rheum.L01.001
    kind: card
    topic: intro
    front: Why does the immune system need cytokines?
    back: To mount and coordinate an effective immune response, lymphocytes, inflammatory cells and haematopoietic cells need a way to communicate with each other; cytokines perform this function.
    src: { page: 1, quote: "a mechanism by which lymphocytes, inflammatory cells and haematopoietic cells can communicate with each other is required." }
    status: unverified
  - id: rheum.L01.002
    kind: card
    topic: intro
    front: Define cytokines.
    back: A large, diverse family of low molecular weight proteins or glycoproteins (usually under 30 kDa), secreted by various cell types, that act by binding cell-surface receptors.
    src: { page: 1, quote: "Cytokines are a large, diverse family of low molecular weight proteins or glycoproteins (usually smaller than 30 kDa)" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L01.003
    kind: cloze
    topic: intro
    text: "Cytokines are usually smaller than {{c1::30 kDa}}."
    src: { page: 1, quote: "glycoproteins (usually smaller than 30 kDa) secreted by varies types of cells" }
    status: unverified
    tags: [numbers]
  - id: rheum.L01.004
    kind: card
    topic: intro
    front: Besides immunomodulation, which other roles of cytokines are documented?
    back: Roles in developmental processes, such as cell differentiation and directed migration.
    src: { page: 1, quote: "additional roles separate from the immune system in developmental processes are also documented, such as cell differentiation and directed migration." }
    status: unverified
  - id: rheum.L01.005
    kind: cloze
    topic: intro
    text: "The two principal producers of cytokines are {{c1::T helper cells}} and {{c2::macrophages}}, although all {{c3::nucleated cells}} can transiently secrete them."
    src: { page: 1, quote: "the two principal producers of cytokines are T helper cells (Th cells) and macrophages" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L01.006
    kind: card
    topic: intro
    front: How does a cytokine produce its downstream effect?
    back: Through high-affinity binding to its receptor expressed on the surface of a target cell.
    src: { page: 2, quote: "The downstream effects of a particular cytokine occurs through its high- affinity binding of its receptor expressed on the surface of a target cell." }
    status: unverified
  - id: rheum.L01.007
    kind: table
    topic: intro
    title: Action modes of cytokines
    columns: [The cytokine binds receptors on, Mode]
    rows:
      - [The same cell that secreted it, Autocrine]
      - [A target cell in close proximity to the producer cell, Paracrine]
      - ["Target cells in distant parts of the body (not the normal manner for cytokines)", Endocrine]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 2, quote: "Autocrine (acts on same cell) manner. Paracrine (acts on nearby cell) manner." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L01.008
    kind: mcq
    topic: intro
    stem: "Activated T cells secrete IL-2, which binds IL-2 receptors on the same T cells and drives their own proliferation. Which action mode is this?"
    options: [Autocrine, Paracrine, Endocrine, Juxtacrine]
    answer: 0
    why:
      - "Correct: the cytokine binds receptors on the membrane of the same cell that secreted it."
      - "Paracrine acts on a nearby, different target cell."
      - "Endocrine acts on distant cells, and is not the normal manner for cytokines."
      - "Juxtacrine (contact signalling) is not one of the three modes in the lecture."
    src: { page: 2, quote: "When cytokine binds to receptors on the membrane of the same cells that secreted it." }
    status: unverified
  - id: rheum.L01.009
    kind: card
    topic: intro
    front: Which cytokine action mode is NOT the normal manner for cytokine responses?
    back: Endocrine (acting on distant cells).
    src: { page: 2, quote: "Endocrine (acts on distant cell; not the normal manner for cytokine responses) manner." }
    status: unverified
    tags: [exam-trap]
  - id: rheum.L01.010
    kind: card
    topic: intro
    front: Two roles of cytokines in immune responses (p2)?
    back: They aid cell-to-cell communication, and they stimulate the movement of cells towards sites of inflammation, infection and trauma.
    src: { page: 2, quote: "Cytokines aid cell to cell communication in immune responses and stimulate the movement of cells towards sites of inflammation, infection and trauma." }
    status: unverified
  - id: rheum.L01.011
    kind: card
    topic: intro
    front: What happens after a cytokine binds its specific receptor on a target cell?
    back: Signal transduction pathways are triggered that ultimately alter enzyme activity and gene expression.
    src: { page: 3, quote: "triggering signal transduction pathways that ultimately alter enzyme activity and gene expression." }
    status: unverified
  - id: rheum.L01.012
    kind: card
    topic: intro
    front: What determines whether a target cell responds to a particular cytokine?
    back: The presence of its specific membrane receptors, which bind the cytokine with very high affinity.
    src: { page: 3, quote: "The susceptibility of a target cell to a particular cytokine is determined by the presence of specific membrane receptors" }
    status: unverified
  - id: rheum.L01.013
    kind: order
    topic: intro
    prompt: Order the steps of cytokine action (book figure, p3).
    steps:
      - Inducing stimulus
      - Stimulated cell produces cytokine
      - Cytokine secreted
      - Specific cytokine receptor on target cell bound and activated
      - Cell activation
      - Biological effect
    src: { page: 3, quote: "Stimulated ceil produces cytokine Cytokine secreted Specific cytokine receptor on target cell bound and activated" }
    status: unverified
  # ---------- p4: naming ----------
  - id: rheum.L01.014
    kind: enumerate
    topic: naming
    prompt: Enumerate the denominations (names) of cytokines.
    points: [Monokine, Lymphokine, Colony stimulating factor (CSF), Interleukin (IL), Interferon (IFN), Tumor necrosis factor (TNF), Growth factor (GF), Chemokine]
    pass: 6
    src: { page: 4, quote: "Denomination of Cytokines 1. Monokine. 2. Lymphokine. 3. Colony stimulating factor (CSF). 4. Interleukin (IL)." }
    status: unverified
  - id: rheum.L01.015
    kind: card
    topic: naming
    front: What is a lymphokine? Give examples.
    back: A cytokine produced by lymphocytes, such as IL-2 and IFN-γ.
    src: { page: 4, quote: "Lymphokines – Cytokines such as interleukin-2 (IL-2) and interferon-γ (IFN- γ), produced by lymphocytes." }
    status: unverified
  - id: rheum.L01.016
    kind: card
    topic: naming
    front: What is a monokine? Give an example.
    back: A cytokine produced by monocytes, such as TNF-α.
    src: { page: 4, quote: "Monokines – Cytokines such as tumor necrosis factor-α (TNF-α) produced by monocytes." }
    status: unverified
  - id: rheum.L01.017
    kind: card
    topic: naming
    front: How did tumor necrosis factor get its name?
    back: It was first discovered by its cytotoxic effects on some cancer cell lines.
    src: { page: 4, quote: "Tumor necrosis factor (TNF) – Cytokines exhibited cytotoxic effects on some cancer cell lines." }
    status: unverified
  - id: rheum.L01.018
    kind: card
    topic: naming
    front: How did colony stimulating factors get their name?
    back: They promoted the in-vitro growth of various leukocytes in clumps or colonies.
    src: { page: 4, quote: "Colony stimulating factors (CSFs) – Cytokines promoted the growth in vitro of various leukocytes in clumps or colonies." }
    status: unverified
  - id: rheum.L01.019
    kind: table
    topic: naming
    title: Main action of cytokine groups (book box, p4)
    columns: [Cytokines, Action]
    rows:
      - [Interferon family, Antiviral proteins]
      - [Chemokine family, "Direct cell migration, adhesion and activation"]
      - [Tumour necrosis factor family, Regulate inflammatory and immune responses]
      - [Interleukin family, Variety of actions depending on the interleukin and cell type]
      - [Haematopoietins, Promote cell proliferation and differentiation]
      - [Transforming growth factor beta family, Regulation of immune cells]
    blanks: [[0, 1], [1, 1], [2, 1], [4, 1], [5, 1]]
    src: { page: 4, quote: "Interferon family Antiviral proteins" }
    status: unverified
  # ---------- p5: attributes ----------
  - id: rheum.L01.020
    kind: table
    topic: attributes
    title: Functional attributes of cytokines
    columns: [Meaning, Attribute]
    rows:
      - [One cytokine has different biological effects on different target cells, Pleiotropy]
      - [Two or more cytokines mediate similar functions, Redundancy]
      - [Combined effect of two cytokines is greater than the sum of their individual effects, Synergism]
      - [The effects of one cytokine inhibit or offset the effects of another, Antagonism]
      - ["A cytokine makes its target cell produce other cytokines, which make other cells produce more", Cascade induction]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 5, quote: "Pleiotropic action: A given cytokine that has different biological effects on different target cells." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L01.021
    kind: card
    topic: attributes
    front: Define pleiotropy of cytokines.
    back: A given cytokine has different biological effects on different target cells.
    src: { page: 5, quote: "Pleiotropic action: A given cytokine that has different biological effects on different target cells." }
    status: unverified
  - id: rheum.L01.022
    kind: card
    topic: attributes
    front: Define cytokine redundancy, and why does it matter?
    back: Two or more cytokines mediate similar functions; it makes it difficult to ascribe a particular activity to a single cytokine.
    src: { page: 5, quote: "Redundancy makes it difficult to ascribe a particular activity to a single cytokine." }
    status: unverified
  - id: rheum.L01.023
    kind: card
    topic: attributes
    front: Define cytokine synergism.
    back: The combined effect of two cytokines on cellular activity is greater than the additive effects of the individual cytokines.
    src: { page: 5, quote: "Synergism: when the combined effects of two cytokines on cellular activity is greater than the additive effects of the individual cytokines." }
    status: unverified
  - id: rheum.L01.024
    kind: card
    topic: attributes
    front: Define cascade induction.
    back: The action of one cytokine on a target cell induces that cell to produce one or more other cytokines, which in turn may induce other target cells to produce other cytokines.
    src: { page: 5, quote: "Cascade induction: Occurs when the action of one cytokine on target cell induces that cell to produce one or more other cytokines" }
    status: unverified
  - id: rheum.L01.025
    kind: mcq
    topic: attributes
    stem: "IL-4 from activated Th cells activates B cells, makes thymocytes proliferate and makes mast cells proliferate. Which cytokine attribute does this show?"
    options: [Pleiotropy, Redundancy, Synergy, Cascade induction]
    answer: 0
    why:
      - "Correct: one cytokine, different effects on different target cells."
      - "Redundancy is several cytokines (IL-2, IL-4, IL-5) doing the same job, such as B-cell proliferation."
      - "Synergy needs two cytokines together, such as IL-4 plus IL-5 inducing the switch to IgE."
      - "Cascade induction is a chain: one cytokine makes its target cell release other cytokines."
    src: { page: 5, quote: "PLEIOTROPY Activated TH cells IL-4 B cell Thymocyte Mast cell" }
    status: unverified
  - id: rheum.L01.026
    kind: mcq
    topic: attributes
    stem: "IFN-γ blocks the class switch to IgE that IL-4 induces in B cells. Which attribute is this?"
    options: [Antagonism, Synergy, Redundancy, Pleiotropy]
    answer: 0
    why:
      - "Correct: one cytokine (IFN-γ) offsets the effect of another (IL-4)."
      - "Synergy is IL-4 plus IL-5 together inducing the IgE switch."
      - "Redundancy is several cytokines with the same effect."
      - "Pleiotropy is one cytokine with many effects on different cells."
    src: { page: 5, quote: "Antagonism: the effects of one cytokine inhibit or offset the effects of another cytokine." }
    status: unverified
  - id: rheum.L01.027
    kind: order
    topic: attributes
    prompt: Order the cascade induction example in the book figure (p5).
    steps:
      - Activated TH cells release IFN-γ
      - IFN-γ acts on the macrophage
      - The macrophage releases IL-12
      - IL-12 acts on activated TH cells
      - TH cells release IFN-γ, TNF, IL-2 and other cytokines
    src: { page: 5, quote: "CASCADE INDUCTION Activated TH cells IFN-γ Macrophage IL-12" }
    status: unverified
  - id: rheum.L01.028
    kind: card
    topic: attributes
    front: How does IFN-γ show all forms of cytokine network interaction (p5)?
    back: It makes certain T cells secrete more IFN-γ and IL-2 (cascade), synergizes with TNF-α to activate macrophages, and antagonizes IL-4 by preventing it from influencing T lymphocytes.
    src: { page: 5, quote: "IFN-γ synergizes with tumor necrosis factor-α (TNF-α) to activate macrophages and antagonizes interleukin-4 (IL-4)" }
    status: unverified
  - id: rheum.L01.029
    kind: card
    topic: attributes
    front: Why do cytokines have pleiotropy, redundancy, synergy, antagonism and cascade induction (p4 box)?
    back: These attributes let them regulate cellular activity in a coordinated, interactive way.
    src: { page: 4, quote: "which permit them to regulate cellular activity in a coordinated interactive way." }
    status: unverified
  # ---------- p6: biological functions ----------
  - id: rheum.L01.030
    kind: table
    topic: functions
    title: Biological functions of cytokines with the book's example
    columns: [Function, Example cytokine]
    rows:
      - [Development of cellular and humoral immune responses, IL-2 and IL-4]
      - [Induction of inflammatory response, "IL-1, IL-6 and TNF-α"]
      - [Regulation of hematopoiesis, GM-CSF]
      - [Regulation of cellular proliferation and differentiation, IL-2]
      - [Wound repair, TGF-β]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 6, quote: "Induction of inflammatory response (IL-1, IL-6 and TNF-a). 3. Regulation of hematopoiesis (GM-CSF)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L01.031
    kind: cloze
    topic: functions
    text: "The three classic inflammatory cytokines are {{c1::IL-1}}, {{c2::IL-6}} and {{c3::TNF-α}}."
    src: { page: 6, quote: "Induction of inflammatory response (IL-1, IL-6 and TNF-a)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L01.032
    kind: cloze
    topic: functions
    text: "Wound repair is the function of {{c1::TGF-β}}; regulation of hematopoiesis is the example of {{c2::GM-CSF}}."
    src: { page: 6, quote: "Regulation of hematopoiesis (GM-CSF). 4. Regulation of cellular proliferation and differentiation (IL-2). 5. Wound repair (TGF-b)." }
    status: unverified
  - id: rheum.L01.033
    kind: card
    topic: functions
    front: How does the cytokine network start, according to p6?
    back: Antigen interacts with a macrophage, which then activates resting TH cells; cytokines from these cells activate an entire network of interacting cells.
    src: { page: 6, quote: "Interaction of antigen with macrophage ----subsequent activation of resting TH cells." }
    status: unverified
  - id: rheum.L01.034
    kind: table
    topic: functions
    title: "Table 12-1: cytokines of innate immunity"
    columns: [Cytokine, Secreted by, Targets and effects]
    rows:
      - [IL-1, "Monocytes, macrophages, endothelial and epithelial cells", "Vasculature (inflammation); hypothalamus (fever); liver (acute phase proteins)"]
      - [TNF-α, Macrophages, "Vasculature (inflammation); liver (acute phase proteins); cachexia; death of many cell types; neutrophil activation"]
      - [IL-12, "Macrophages, dendritic cells", "NK cells; promotes the TH1 subset"]
      - [IL-6, "Macrophages, endothelial cells", "Liver (acute phase proteins); proliferation and antibody secretion of B-cell lineage"]
      - [IFN-α, Macrophages, "Antiviral state; increases MHC class I; activates NK cells"]
      - [IFN-β, Fibroblasts, "Antiviral state; increases MHC class I; activates NK cells"]
    blanks: [[0, 2], [1, 2], [2, 2], [3, 2], [5, 1]]
    src: { page: 6, quote: "Interleukin 1 (IL-1) Monocytes, macrophages, endothelial cells, epithelial cells" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L01.035
    kind: table
    topic: functions
    title: "Table 12-1: cytokines of adaptive immunity"
    columns: [Cytokine, Secreted by, Targets and effects]
    rows:
      - [IL-2, T cells, "T-cell proliferation; can promote AICD; NK-cell activation and proliferation; B-cell proliferation"]
      - [IL-4, "TH2 cells, mast cells", "Promotes TH2 differentiation; isotype switch to IgE"]
      - [IL-5, TH2 cells, Eosinophil activation and generation]
      - [TGF-β, "T cells, macrophages, other cells", "Inhibits T-cell proliferation and effector functions; inhibits B-cell proliferation; switch to IgA; inhibits macrophages"]
      - [IFN-γ, "TH1 cells, CD8+ cells, NK cells", "Activates macrophages; increases MHC class I and II; increases antigen presentation"]
    blanks: [[0, 2], [1, 2], [2, 2], [3, 2], [4, 2]]
    src: { page: 6, quote: "Interleukin 4 (IL-4) TH2 cells, mast cells Promotes TH2 differentiation; isotype switch to IgE" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L01.036
    kind: mcq
    topic: functions
    stem: "Which cytokine in Table 12-1 promotes the isotype switch to IgA?"
    options: [TGF-β, IL-4, IL-5, IFN-γ]
    answer: 0
    why:
      - "Correct: TGF-β promotes the switch to IgA while inhibiting T- and B-cell proliferation and macrophages."
      - "IL-4 drives the switch to IgE."
      - "IL-5 activates and generates eosinophils."
      - "IFN-γ activates macrophages and raises MHC expression."
    src: { page: 6, quote: "Transforming growth factor β (TGF-β) T cells, macrophages, other cell types Inhibits T-cell proliferation" }
    status: unverified
  - id: rheum.L01.037
    kind: mcq
    topic: functions
    stem: "A cytokine secreted by TH2 cells mainly activates and generates eosinophils. Which is it?"
    options: [IL-5, IL-4, IL-2, IL-12]
    answer: 0
    why:
      - "Correct: IL-5 from TH2 cells = eosinophil activation and generation."
      - "IL-4 promotes TH2 differentiation and the IgE switch."
      - "IL-2 is the T-cell growth cytokine."
      - "IL-12 comes from macrophages and dendritic cells and promotes TH1."
    src: { page: 6, quote: "Interleukin 5 (IL-5) TH2 cells Eosinophil activation and generation" }
    status: unverified
  - id: rheum.L01.038
    kind: card
    topic: functions
    front: Which cytokine of innate immunity is secreted by fibroblasts (Table 12-1)?
    back: IFN-β, which induces an antiviral state, increases MHC class I expression and activates NK cells.
    src: { page: 6, quote: "Interferon β (IFN-β) Fibroblasts Induces an antiviral state in most nucleated cells" }
    status: unverified
  - id: rheum.L01.039
    kind: card
    topic: functions
    front: Which cytokine causes cachexia (loss of muscle and body fat) in Table 12-1?
    back: TNF-α.
    src: { page: 6, quote: "loss of muscle, body fat (cachexia); induction of death in many cell types; neutrophil activation" }
    status: unverified
  # ---------- p7-10: families ----------
  - id: rheum.L01.040
    kind: enumerate
    topic: families
    prompt: Enumerate the six families of cytokines.
    points: ["Interleukin 1 (IL-1) family", "Hematopoietin family (class I)", "Interferon family (class II)", Chemokine family, Tumor necrosis factor family, "Interleukin 17 (IL-17) family"]
    pass: 5
    src: { page: 7, quote: "Cytokines belong to 6 families o Interleukin 1 (IL-1). o Hematopoietin family (Class I). o Interferon family (Class II)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L01.041
    kind: table
    topic: families
    title: Six major cytokine families and their members (p7)
    columns: [Family, Members]
    rows:
      - [Interleukin 1 family, "IL-1α, IL-1β, IL-1Ra, IL-18, IL-33"]
      - [Hematopoietin (class I), "IL-2, IL-3, IL-4, IL-5, IL-6, IL-7, IL-12, IL-13, IL-15, IL-21, GM-CSF, G-CSF"]
      - [Interferon (class II), "IFN-α, IFN-β, IFN-γ, IL-10, IL-19, IL-20, IL-22, IL-24"]
      - [Tumor necrosis family, "TNF-α, TNF-β, CD40L, Fas, BAFF"]
      - [Interleukin 17 family, "IL-17 A, B, C, D, E, F"]
      - [Chemokines, "IL-8, CCL19, CCL21, CCL2, CCL3"]
    blanks: [[0, 1], [2, 1], [3, 1], [5, 1]]
    src: { page: 7, quote: "Six major cytokine families Interleukin 1 family" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L01.042
    kind: mcq
    topic: families
    stem: "In the book's table of the six cytokine families, IL-10 belongs to which family?"
    options: [Interferon (class II) family, Hematopoietin (class I) family, IL-1 family, Chemokines]
    answer: 0
    why:
      - "Correct: IFN-α, -β, -γ plus IL-10, IL-19, IL-20, IL-22 and IL-24."
      - "Class I holds IL-2 to IL-7, IL-12, IL-13, IL-15, IL-21, GM-CSF and G-CSF."
      - "The IL-1 family is IL-1α, IL-1β, IL-1Ra, IL-18 and IL-33."
      - "Chemokines are IL-8, CCL19, CCL21, CCL2 and CCL3."
    src: { page: 7, quote: "Interferon family (Class II)." }
    status: unverified
  - id: rheum.L01.043
    kind: mcq
    topic: families
    stem: "IL-8 belongs to which cytokine family?"
    options: [Chemokines, IL-1 family, IL-17 family, Hematopoietin family]
    answer: 0
    why:
      - "Correct: IL-8 (CXCL8) is listed with CCL19, CCL21, CCL2 and CCL3; all are chemoattractants."
      - "The IL-1 family is IL-1α, IL-1β, IL-1Ra, IL-18, IL-33."
      - "The IL-17 family is IL-17A to F."
      - "The class I family does not include IL-8."
    src: { page: 7, quote: "Chemokines IL-8, CCL19, CCL21, CCL2, CCL3" }
    status: unverified
  - id: rheum.L01.044
    kind: card
    topic: families
    front: Three structural facts about all cytokine families (p7)?
    back: All have a molecular mass under 30 kDa, all have similarities, and few rarely act alone.
    src: { page: 7, quote: "All have molecular mass less than 30kDa. All have similarities and few rarely act alone." }
    status: unverified
  - id: rheum.L01.045
    kind: card
    topic: families
    front: Which cytokine was the first non-interferon cytokine to be identified?
    back: IL-1.
    src: { page: 7, quote: "IL-1 was the first noninterferon cytokine to be identified." }
    status: unverified
  - id: rheum.L01.046
    kind: card
    topic: families
    front: When and by whom are IL-1 family cytokines secreted?
    back: Very early in the immune response, by dendritic cells, monocytes and macrophages, after innate receptors recognise viral, parasitic or bacterial antigens.
    src: { page: 8, quote: "Cytokines of the interleukin 1 (IL-1) family are typically secreted very early in the immune response by dendritic cells, monocytes, and macrophages" }
    status: unverified
  - id: rheum.L01.047
    kind: card
    topic: families
    front: Which cytokines does IL-1 signal the liver to produce, and what do they do?
    back: Type I interferons (IFN-α, IFN-β), IL-6 and CXCL8; they destroy viral RNA and generate a systemic fever response.
    src: { page: 8, quote: "signals the liver to produce other cytokines, such as the type I interferons (IFN-α and IFN-β), IL-6, and the chemokine CXCL8." }
    status: unverified
  - id: rheum.L01.048
    kind: card
    topic: families
    front: Why is the fever induced by IL-1 protective?
    back: It helps eliminate many temperature-sensitive bacterial strains.
    src: { page: 8, quote: "generating a systemic fever response (which helps to eliminate many temperature-sensitive bacterial strains)." }
    status: unverified
  - id: rheum.L01.049
    kind: card
    topic: families
    front: How does IL-1 link innate and adaptive immunity?
    back: It helps to activate both T and B cells.
    src: { page: 8, quote: "IL-1 serves as an intermediary between the innate and adaptive immune systems by helping to activate both T and B cells." }
    status: unverified
  - id: rheum.L01.050
    kind: cloze
    topic: families
    text: "The IL-1 family includes IL-1α, IL-1β, {{c1::IL-18}} and {{c2::IL-33}}."
    src: { page: 8, quote: "Members of the IL-1 cytokine family include IL-1α and IL-1β IL-1 family also includes IL-18 and IL-33." }
    status: unverified
  - id: rheum.L01.051
    kind: table
    topic: families
    title: Examples of class 1 (hematopoietin) cytokine actions
    columns: [Action, Example]
    rows:
      - [Signal the onset of T- and B-cell proliferation, IL-2]
      - [Regulate helper T-cell functions, IL-4]
