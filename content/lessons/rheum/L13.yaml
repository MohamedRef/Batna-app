            <circle cx="140" cy="200" r="4" class="fg-dot-bad"/>
            <circle cx="230" cy="186" r="4" class="fg-dot-bad"/>
            <text x="5" y="258" class="t-sm t-b">Late</text>
            <path d="M40 315V285M40 295L28 275M40 290L52 272M40 285L40 270" class="fg-arrow-bad"/>
