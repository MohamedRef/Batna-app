  - id: rheum.L20.lesson6
    title: "لما الأمعاء تتعب المفاصل"
    hook: "Type 1 بيمشي مع القولون، وType 2 ماشي لوحده، والـ Salmonella ممكن تسيب ركبة وارمة."
    minutes: 7
    pages: [343, 344]
    topics: [enteropathic]
    goals:
      - "تعرّف الـ enteropathic arthritis"
      - "تفرّق الـ axial و Type 1 و Type 2"
      - "تعرف الـ post-enteritic reactive arthritis"
    status: unverified
    steps:
      - kind: explain
        page: 343
        title: "التعريف والآلية"
        quote: "It is known that certain allergens can pass the gut in intact form. Increased gut permeability is a possible pathophysiologic significance by allowing penetration of harmful products. The spread of an infective agent from the pelvic organs via the pelvic and paraspinal lymphatics to the spine has been suggested."
        text: |
          الـ **enteropathic arthritis** = arthritis بسبب أو مع مرض في الأمعاء: **Ulcerative colitis (UC)**، **Crohn**، **Whipple**، و **post-enteritic reactive arthritis**.

          الآلية: ==increased gut permeability== بيدخّل حاجات ضارة (وفيه allergens بتعدي سليمة)، وممكن العدوى تنتشر من الـ pelvic organs عن طريق الـ **pelvic and paraspinal lymphatics** للعمود الفقري.

          يعني الأمعاء الـ leaky بتعرّض المناعة لحاجات كان المفروض تفضل جوه، وده نفس خيط الـ IL-23 والـ dysbiosis في الـ PsA.
      - kind: figure
        page: 343
        quote: "Type 1 (pauciarticular [< 5 joints])- Acute, self-limiting attacks, lasting less than 6- 10 weeks; asymmetrical and affecting large joints, such as the knees, hips and shoulders; strong correlation to IBD activity, associated with other extra-intestinal manifestations of IBD."
        title: "الأمعاء والمفاصل: تلات صور"
        alt: "A gut box at the top with three arrows down. Axial: sacroiliitis and spondylitis, independent of gut symptoms, more in Crohn. Type 1 peripheral: under 5 large joints, acute attacks under 6 to 10 weeks, follows bowel activity. Type 2 peripheral: over 5 small hand joints, chronic, independent of bowel activity. Bottom note: all non-erosive and non-deforming."
        caption: "السؤال اللي بيفرّق: ==بيمشي مع الأمعاء ولا لأ؟== الـ **Type 1** بس هو اللي بيولّع مع الـ IBD. الـ **axial** والـ **Type 2** ماشيين لوحدهم."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L20g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="85" y="10" width="160" height="44" rx="10" class="fg-acc"/>
            <text x="165" y="37" text-anchor="middle" class="t-sm t-b">IBD (Crohn, UC)</text>
            <path d="M120 54 L55 80" class="fg-arrow" marker-end="url(#L20g)"/>
            <path d="M165 54 V80" class="fg-arrow" marker-end="url(#L20g)"/>
