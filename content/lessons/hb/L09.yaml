          <path d="M165 202v16" class="fg-arrow" marker-end="url(#L09c)"/>
          <rect x="12" y="222" width="306" height="40" rx="7" class="fg-acc"/>
          <text x="165" y="239" text-anchor="middle" class="t-b">Grade 3 or recurrent: combined</text>
          <text x="165" y="254" text-anchor="middle" class="t-sm">spiro 100 : furo 40 from day 1, titrate after 4-5 days</text>
          <path d="M165 264v16" class="fg-arrow" marker-end="url(#L09c)"/>
          <rect x="12" y="284" width="306" height="40" rx="7" class="fg-bad"/>
          <text x="165" y="301" text-anchor="middle" class="t-b">Grade 3: LVP first</text>
          <text x="165" y="316" text-anchor="middle" class="t-sm">then salt restriction + diuretics again</text>
          </svg>
      - kind: explain
        page: 153
        quote: "A daily weight loss not exceeding 500 g/day in patients without peripheral edema and 1 kg/day in patients with peripheral edema."
        title: "الـ diuresis ماشية صح؟"
        text: |
          إزاي تعرف إن الـ diuretics شغالة صح؟ الكتاب بيدي 3 علامات:
          - ==Daily weight loss==: ميزدش عن 500 g/day لو مفيش peripheral edema، و 1 kg/day لو فيه edema.
          - ==Spot urine Na/K ratio== أكبر من 1.
          - **Urinary Na excretion** أكتر من 78 mmol/day.

          ليه سقف الوزن ده؟ الـ ascites بتتسحب من البطن للدم ببطء. لو الـ diuretic سحب أسرع، هيسحب من الـ intravascular volume نفسه، فتحصل renal impairment.

          أما الـ edema فبيدّي احتياطي أكبر، لأن المية اللي في الرجلين بترجع للدم أسرع، فنقدر نسحب كيلو.

          وليه Na/K > 1؟ لأن الـ spironolactone شغال صح لما الكلية تطلّع صوديوم أكتر من البوتاسيوم. يعني الـ aldosterone اتكسر فعلًا.
      - kind: check
        page: 154
        quote: "Diuretic-induced complications Include renal impairment, hepatic encephalopathy, hyponatremia (serum sodium <125 mmol/L), hypo- or hyperkalemia (serum potassium to <3 mmol/L"
        question: "Which is NOT one of the diuretic-induced complications in the book?"
        options:
          - "Hypercalcemia"
          - "Hepatic encephalopathy"
          - "Hyponatremia below 125 mmol/L"
          - "Incapacitating muscle cramps"
        answer: 0
        why:
          - "صح: مش في القائمة. القائمة: renal impairment، HE، hyponatremia، hypo/hyperkalemia، و muscle cramps."
          - "الـ HE من المضاعفات."
          - "الـ hyponatremia (<125) من المضاعفات."
          - "الـ cramps من المضاعفات."
      - kind: explain
        page: 154
        quote: "For LVP >5 liters, albumin infusion of 6-8 g per liter of fluid removed appears to prevent paracentesis-induced circulatory dysfunction"
        title: "الـ LVP والـ albumin"
        text: |
          **Large volume paracentesis (LVP)**: سحب 5 لتر أو أكتر مرة واحدة. وهو أحسن من الـ diuretics العادية في الـ grade 3.

          **Albumin بعد البزل**:
          - لو سحبت أكتر من 5 لتر، اديله albumin 6–8 g لكل لتر اتسحب.
          - السبب: ==paracentesis-induced circulatory dysfunction==. لما المية تتسحب فجأة، الـ effective arterial blood volume بيقع، والـ plasma renin activity بيعلى. والـ albumin بيمسك الدم جوه الأوعية.

          **حدود الـ LVP**:
          - بعده لازم ترجع للملح والـ diuretics، وإلا المية هترجع.
          - هو symptomatic treatment: مش بيمنع الرجوع، ومش بيطوّل العمر، وبيزوّد الـ malnutrition (كل لتر فيه بروتين بيروح).

          **Liver transplantation**: ظهور grade 2 أو 3 معناه poor prognosis، فالكتاب بيقول فكّر في referral للـ LT evaluation.
      - kind: check
        page: 154
        quote: "For LVP >5 liters, albumin infusion of 6-8 g per liter of fluid removed appears to prevent paracentesis-induced circulatory dysfunction"
        question: "8 L are removed by paracentesis. How much albumin, per the book?"
        options:
          - "48–64 g"
          - "8 g"
          - "100 g"
          - "None: albumin is only for SBP"
        answer: 0
        why:
          - "صح: 6–8 g × 8 لتر = **48–64 g**."
          - "دي جرعة لتر واحد بس."
          - "الكتاب بيحسبها بالتر، مش رقم ثابت."
          - "الـ albumin مطلوب في الـ LVP >5 L كمان، علشان الـ circulatory dysfunction."
      - kind: try
        items: [hb.L09.053, hb.L09.063, hb.L09.066]
    recap:
