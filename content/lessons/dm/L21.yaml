          - ["Tendon xanthoma", "Achilles, hand extensors"]
          - ["Tuberous xanthoma", "Elbow, knee"]
          - ["Corneal arcus", "Corneal margin"]
        why: "Tendon = أوتار، tuberous = أماكن الضغط، xanthelasma = الجفون، arcus = حافة القرنية."
      - kind: explain
        remind: [dm.L21.024]
        page: 264
        title: "التشخيص"
        quote: "Diagnosis of FH\n  1. Elevated plasma levels of LDL-C (usually 200–400 mg/dL)\n  2. Normal levels of triglyceride\n  3. Decreased LDL receptor activity in cultured skin fibroblasts."
        text: |
          **التشخيص** في الكتاب:
          - LDL-C عادة ==200-400 mg/dL==.
          - **TG طبيعي** (ده اللي بيفرّقه عن الـ combined).
          - **Decreased LDL receptor activity** في **cultured skin fibroblasts**.

          ليه skin fibroblasts بالذات؟ التفسير المقبول (مش في الكتاب): خلايا الجلد بتعبّر نفس الـ LDL receptor، وسهل تاخد عينة وتزرعها وتقيس شغل الـ receptor نفسه، من غير ما تلمس الكبد.
      - kind: explain
        remind: [dm.L21.026]
        page: 264
        title: "العلاج، وليه كل خطوة"
        quote: "Treatment of Familial Hypercholesterolemia\n  (a) Diet:\n  4. Low cholesterol\n  5. Low-fat diet mostly polyunsaturated\n  (b) Drugs:\n  6. Statins\n  7. Bile acid-binding drugs: Cholestyramine\n  8. Liver transplantation"
        text: |
          **العلاج** في الكتاب:
          - Diet: **low cholesterol** و **low-fat** (polyunsaturated غالبًا).
          - ==Statins==، و **cholestyramine** (bile acid-binding).
          - **LDL apheresis**: بيشيل الـ LDL particles بالذات من الدم.
          - **Liver transplantation**.

          ليه دول بالذات؟ التفسير المقبول (مش في الكتاب): الـ statin بيقلل تصنيع الكوليسترول جوّه الكبد، فالكبد **يطلّع receptors أكتر** يسحب بيها الـ LDL. والـ cholestyramine بيمسك الـ bile acids في الأمعاء، فالكبد يستهلك كوليسترول يعمل bile acids جديدة ويطلّع receptors برضه. الاتنين بيشتغلوا **عن طريق الـ receptor**.
      - kind: reveal
        page: 264
        quote: "LDL apheresis (a process by which the LDL particles are selectively removed from the circulation)"
        prompt: "ليه الـ homozygous FH كتير بيحتاج LDL apheresis أو liver transplant، مع إن الـ statin شغال كويس في الـ heterozygous؟"
        answer: "التفسير المقبول (مش في الكتاب): الـ statin والـ cholestyramine بيشتغلوا بإنهم **يكتّروا الـ LDL receptors**. الـ heterozygous عنده allele سليم يقدر يزوّده، لكن الـ homozygous الاتنين بايظين، فمفيش حاجة تتزوّد. الحل يبقى إما تشيل الـ LDL **بإيدك** من الدم (**apheresis**)، أو تدّيله **كبد جديد** بـ receptors سليمة (**transplantation**)."
      - kind: update
        page: 264
        quote: "(b) Drugs:\n  6. Statins\n  7. Bile acid-binding drugs: Cholestyramine"
        text: "دلوقتي، جنب الـ statins والـ **cholestyramine**، بيضيفوا **ezetimibe** و **proprotein convertase subtilisin/kexin type 9 (PCSK9) inhibitors** لو الـ statin مش كفاية، وفي الـ homozygous familial hypercholesterolaemia (FH) ممكن **evinacumab** أو **lomitapide**. الامتحان: قائمة الكتاب."
        ref: "ESC/EAS dyslipidaemia guidelines 2019; EAS homozygous FH consensus 2023"
      - kind: check
        page: 262
        quote: "6. FH is an autosomal dominant disorder characterized by:\n  1. Elevated plasma levels of LDL-C with\n  7. Normal triglycerides,"
