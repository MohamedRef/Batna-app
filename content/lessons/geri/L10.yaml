          </svg>
      - kind: explain
        page: 172
        quote: "The main difference is at the beginning of diagnostic approach where we first need to know are we dealing with IIP or with ILD of Known cause."
        title: "ليه الشجرة مهمة؟"
        text: |
          الشجرة مش حفظ وخلاص. أول فرع فيها هو أهم سؤال في المحاضرة كلها: ==فيه سبب معروف؟==

          الكتاب بيقول إن الفرق بين الـ IPF وغيره بيتحدد **في أول التشخيص**: هل ده **IIP** ولا **ILD of known cause**؟

          ليه ده بيفرق؟ لأن العلاج بيختلف: لو فيه سبب (دوا، شغلانة، connective tissue disease) أول خطوة إنك **تشيل السبب أو تعالجه**، وده هتشوفه في درس العلاج. الـ IPF مفيهوش سبب تشيله.
      - kind: sort
        page: 171
        quote: "Interstitial lung disease\n  Known cause or association:\n    Connective tissue diseases\n    Occupational causes\n    Drug side-effects\n  Idiopathic interstitial pneumonias\n    Major\n      Chronic fibrosing: Idiopathic pulmonary fibrosis; Non-specific interstitial pneumonia\n      Smoking related: Desquamative interstitial pneumonia; Respiratory bronchiolitis-ILD\n      Acute and subacute: Cryptogenic organising pneumonia; Acute interstitial pneumonia\n    Unclassifiable\n    Rare: Idiopathic pleuroparenchymal fibroelastosis; Idiopathic lymphocytic interstitial pneumonia\n  Granulomatous:\n    Sarcoidosis\n    Hypersensitivity pneumonitis\n    Infections\n  Other forms, e.g.:\n    Lymphangioleiomyomatosis\n    Histiocytosis X"
        prompt: "حط كل حاجة في مجموعتها في الـ ILD:"
        bins: ["Known cause", "IIP", "Granulomatous", "Other forms"]
        cards:
          - { text: "Amiodarone lung", bin: 0 }
          - { text: "Rheumatoid interstitial lung disease (ILD)", bin: 0 }
          - { text: "Asbestosis", bin: 0 }
          - { text: "IPF", bin: 1 }
          - { text: "Cryptogenic organizing pneumonia", bin: 1 }
          - { text: "Sarcoidosis", bin: 2 }
          - { text: "Hypersensitivity pneumonitis", bin: 2 }
          - { text: "Lymphangioleiomyomatosis", bin: 3 }
          - { text: "Histiocytosis X", bin: 3 }
        why: "الـ known cause = connective tissue disease (CTD)، occupational، drugs. الـ IIP كلها idiopathic (IPF، NSIP، desquamative interstitial pneumonia (DIP)، RB-ILD، cryptogenic organising pneumonia (COP)، acute interstitial pneumonia (AIP)). الـ granulomatous = sarcoid، hypersensitivity pneumonitis (HP)، infection. والـ other = lymphangioleiomyomatosis (LAM) و histiocytosis X."
      - kind: match
        page: 171
        quote: "Interstitial lung disease\n  Known cause or association:\n    Connective tissue diseases\n    Occupational causes\n    Drug side-effects\n  Idiopathic interstitial pneumonias\n    Major\n      Chronic fibrosing: Idiopathic pulmonary fibrosis; Non-specific interstitial pneumonia\n      Smoking related: Desquamative interstitial pneumonia; Respiratory bronchiolitis-ILD\n      Acute and subacute: Cryptogenic organising pneumonia; Acute interstitial pneumonia\n    Unclassifiable\n    Rare: Idiopathic pleuroparenchymal fibroelastosis; Idiopathic lymphocytic interstitial pneumonia\n  Granulomatous:\n    Sarcoidosis\n    Hypersensitivity pneumonitis\n    Infections\n  Other forms, e.g.:\n    Lymphangioleiomyomatosis\n    Histiocytosis X"
        prompt: "وصّل الـ major IIP بمجموعتها:"
        pairs:
          - ["NSIP", "Chronic fibrosing"]
          - ["Respiratory bronchiolitis-ILD", "Smoking related"]
          - ["Acute interstitial pneumonia", "Acute and subacute"]
        why: "Chronic fibrosing: IPF و NSIP. Smoking: DIP و RB-ILD. Acute/subacute: COP و AIP."
      - kind: explain
        page: 171
        quote: "Classification of DPLD Figure: PULMONARY FIBROSIS, a large circle, with IPF as a small circle inside it."
        title: "الـ IPF دايرة صغيرة جوّه دايرة كبيرة"
        text: |
          الكتاب راسم **pulmonary fibrosis** دايرة كبيرة، والـ **IPF** دايرة صغيرة جوّاها. يعني كل IPF هو pulmonary fibrosis، بس مش كل fibrosis يبقى IPF.

          ليه الدايرة الكبيرة كبيرة كده؟ عشان الـ fibrosis هو **النهاية المشتركة** لأذى كتير مختلف: دوا، تراب، روماتيزم. الكتاب هيقولها في الـ pathogenesis: **common end point of pulmonary fibrosis**.

          وفي الشجرة فرع **Rare** فيه اتنين بس: **idiopathic pleuroparenchymal fibroelastosis (PPFE)** و**idiopathic lymphocytic interstitial pneumonia (LIP)**.
      - kind: "figure"
        page: 171
        quote: "Classification of DPLD"
        title: "Classification of DPLD: رسمة الكتاب، ص 171"
        image: { file: geri/L10-dpld-circles.webp, book: true }
        caption: "دايرة بنفسجي كبيرة مكتوب عليها ==Pulmonary fibrosis==، وجوّاها تحت دايرة صفرا صغيرة: ==IPF==.\n\nالرسمة بتقول نفس اللي الخطوة اللي فاتت قالته: الـ IPF **نوع واحد** من أنواع الـ pulmonary fibrosis، فقبل ما تقول IPF لازم تستبعد باقي الدايرة الكبيرة (الأسباب المعروفة، الـ granulomatous، وغيرهم في الشجرة)."
        alt: "Book drawing 'Classification of DPLD': a large purple circle labelled pulmonary fibrosis with a small yellow circle labelled IPF inside it at the bottom."
      - kind: explain
        page: 172
        quote: "The histological diagnosis of UIP is based on temporal and spatial heterogeneity."
        title: "الـ UIP: عدم التجانس في الزمن والمكان"
        text: |
          شكل الـ IPF في الـ biopsy اسمه ==UIP== (usual interstitial pneumonia)، وتشخيصه بحاجتين:

          - **Temporal heterogeneity**: fibrosis في مراحل مختلفة في نفس العينة: fibroblastic infiltrates، mature fibrosis و honeycombing، مع architectural distortion.
          - **Spatial heterogeneity**: حتت رئة طبيعية جنب حتت fibrosis و honeycombing.

          الـ honeycombing لو أكتر من **5%** من حجم الرئة = finding تقريبًا **100% specific**.

          ليه الشكل ده بالذات؟ التفسير المقبول (مش في الكتاب): لو الأذى حصل **مرة واحدة**، كل الندبة هتبقى في نفس السن. وجود fibroblastic foci جديدة جنب fibrosis قديم جنب honeycombing يعني إن الأذى **بيتكرر** على مدى شهور وسنين. والـ honeycombing نفسه آخر مرحلة: الـ alveoli اتهدّت واتحولت لأكياس هوا حيطانها ندبة، فمفيش حاجة تانية بتعمل الشكل ده.
      - kind: figure
        page: 172
        quote: "The distribution of UIP characteristically is with an apicobasal gradient with basal and peripheral (subpleural) predominance although it is often patchy."
        title: "فين الـ UIP؟"
        alt: "Outline of two lungs. Shading grows denser from apex to base and from the centre to the subpleural rim, with patches of normal lung between shaded areas. Labels: apicobasal gradient, basal and subpleural, patchy."
        caption: "تحت وعلى الأطراف (subpleural)، ومتقطّع: حتة سليمة جنب حتة تعبانة."
