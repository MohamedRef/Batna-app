          ليه العلاقة في الاتجاهين؟ الكتاب بيقول cardiac disease بيزوّد الـ depression، والـ depression بيزوّد الـ cardiac disease. التفسير المقبول (مش في الكتاب): المكتئب بيلتزم أقل بالأدوية والحركة، وعنده stress hormones أعلى. وSADHART كان على مرضى من **5 لـ 30 يوم** بعد الـ MI، يعني أخطر فترة، وبرضه الـ sertraline ماأثّرش على الضغط ولا النبض، علشان كده بنقول safe.
