  - id: hb.L13.lesson10
    title: "الـ PBC: هرش وتعب وعضم وصفار متأخر"
    hook: "كل أعراض الـ PBC بتيجي من حاجة واحدة: صفرا محبوسة من سنين. افهم دي وانت تستنتج الباقي."
    minutes: 8
    pages: [218, 220]
    topics: [pbc-disease]
    goals:
      - "تعرف أشهر عرض وأول عرض specific"
      - "تشرح الـ malabsorption والـ bone disease من الـ cholestasis"
      - "تقرا الكشف: الـ pigmentation والـ xanthomas والـ KF rings"
    status: unverified
    steps:
      - kind: figure
        page: 218
        quote: "Stage IV: There is a noncaseating granuloma in the center of and portal triads are linked by bands of connective tissue and inflammatory cells. (Masson trichrome)."
        title: "Stage IV في الكتاب: granuloma وشرايط fibrosis"
        image: { file: hb/L13-pbc-stage4.webp, book: true }
        marks:
          - { at: [0.53, 0.54], label: "Noncaseating granuloma" }
          - { at: [0.55, 0.10], label: "Connective tissue band" }
          - { at: [0.90, 0.59], label: "Connective tissue band" }
          - { at: [0.08, 0.55], label: "Connective tissue band" }
          - { at: [0.16, 0.23], label: "Broad pale collagen" }
        alt: "Masson trichrome liver histology. Orange-red liver tissue crossed by dark bands of connective tissue and inflammatory cells along the top, down the right side and on the left; pale grey-white collagen at the top left; a round compact cluster of cells, a granuloma, in the centre."
        caption: |
          قبل الأعراض، آخر stage في الـ histology (الدرس اللي فات وقف عند stage III). الصبغة برضه **Masson trichrome**:

          - **(1)**: كورة صغيرة مدورة من خلايا متجمعة: دي الـ ==noncaseating granuloma== (مفيش caseation في نصها).
          - الشرايط الغامقة (2، 3، 4): دي الـ **bands of connective tissue and inflammatory cells** اللي بتربط الـ portal triads ببعض. و (5) collagen باهت عريض.
          - الـ parenchyma البرتقاني بقت جزيرة محاوطة بالشرايط من كل ناحية، وده شكل الـ ==regenerative nodule== في الـ cirrhosis.

          ليه الصورة مهمة؟ الـ cirrhosis في stage IV شبه أي cirrhosis، فالكتاب بيقول دوّر على الـ **paucity of bile ducts** في الندبة. والـ granuloma اللي في الصورة علامة تانية تخليك تفكر في الـ PBC (استنتاج مننا، مش جملة في الكتاب).
      - kind: check
        page: 218
        quote: "Stage IV: There is a noncaseating granuloma in the center of and portal triads are linked by bands of connective tissue and inflammatory cells. (Masson trichrome)."
        question: "What lies in the centre of the book's stage IV PBC image?"
        options:
          - "A noncaseating granuloma"
          - "A caseating granuloma"
          - "A florid duct lesion"
          - "A fatty regenerative nodule"
        answer: 0
        why:
          - "صح: **noncaseating granuloma** في النص، والـ portal triads مربوطة بـ bands of connective tissue and inflammatory cells."
          - "الكتاب كاتب **noncaseating** صريح. الـ caseation دي بتاعة الـ TB."
          - "الـ florid duct lesion دي صورة **stage I**."
          - "مفيش fat في الصورة ولا في الـ caption."
      - kind: explain
        remind: [hb.L13.128]
        page: 218
        quote: "About 48 – 60% of patients are asymptomatic at the time of diagnosis. The symptoms and signs of PBC are due to long-standing cholestasis."
        title: "الأعراض والعلامات"
        text: |
          من 48 لـ 60% مالهمش أعراض وقت التشخيص. والأعراض كلها بتيجي من الـ long-standing cholestasis:

          - ==Fatigue==: أشهر عرض (most common).
          - ==Pruritus==: أول عرض specific (earliest specific complaint).
          - **Malabsorption**: للـ vitamins A و D و E و K وللـ calcium. السبب إن الصفرا مش واصلة للمصران، والـ fat-soluble vitamins محتاجاها علشان تتمتص.
          - **Osteopenic bone disease**: في 25% على الأقل، والـ pathogenesis مش واضح.
          - **Osteomalacia**: نادرة، وبس في المريض الـ home-bound المتأخر اللي مش بيشوف شمس.

          **Exam**:

          - Hepatomegaly في 43–70%، و splenomegaly في 16–35%.
          - **Hyperpigmentation** شبه الـ tan في البدري، وسببها melanin مش bilirubin.
          - Excoriations من الهرش.
          - **Jaundice**: متأخر.
          - **Xanthelasma** و **xanthomata**: مع الـ hypercholesterolemia. الـ xanthomata في أقل من 5%، على الـ palms و soles و elbows و knees و tendons و buttocks.
          - **Kayser-Fleischer rings**: نادرة، من الـ copper retention (الـ copper بيخرج في الصفرا).
