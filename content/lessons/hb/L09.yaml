        text: |
          متلخبطش بين رقمين:
          - **<1 g/dL** = **risk factor** للـ SBP (p. 166) ورقم الـ protein في التشخيص (p. 167).
          - **<1.5** = حد الـ **primary prophylaxis** (p. 170).
      - kind: explain
        page: 170
        title: "SFP: لما الفطريات تدخل"
        text: |
          - **Spontaneous fungal peritonitis**: fungal infection في الـ ascites من غير source، وأقل شيوعًا.
          - **Fungal translocation** يسهّلها: **antibiotics**، GI bleeding، immunosuppression، malnutrition.
          - التشخيص: **PMN ≥250 + fungal culture positive** (حتى لو فيه بكتيريا معاها). و **fungal ascites** = culture positive مع PMN <250.
          - الأشهر: **Candida albicans**. الاختبارات الأحدث: **pan-fungal PCR** و **1,3 beta-D-glucan**.
          - العلاج: **echinocandins** للحالات الحرجة، و **fluconazole** للأخف.
