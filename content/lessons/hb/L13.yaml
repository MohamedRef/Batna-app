          - { text: "Obeticholic acid", bin: 0 }
          - { text: "Fenofibrate / bezafibrate", bin: 0 }
          - { text: "Maralixibat", bin: 0 }
          - { text: "Simtuzumab", bin: 1 }
          - { text: "Bexotegrast", bin: 1 }
          - { text: "Vedolizumab", bin: 2 }
          - { text: "Cenicriviroc", bin: 2 }
          - { text: "Vancomycin", bin: 3 }
          - { text: "Fecal microbiome transplantation", bin: 3 }
        why: "norUDCA و OCA (FXR) و fibrates (PPAR) و maralixibat (ASBT) كلهم على الـ bile acids. Simtuzumab (LOXL2) و bexotegrast (integrins → TGF-β) antifibrotic. Vedolizumab (α4β7) و cenicriviroc (CCR2/CCR5) immune. Vancomycin و FMT على الـ microbiome."
