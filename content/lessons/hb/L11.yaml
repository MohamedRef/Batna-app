  - id: hb.L11.lesson3
    title: "مين ممنوع يتزرع؟"
    hook: "8 موانع مطلقة، 8 عوامل خطر بنتناقش فيها، وساعة الـ MELD اللي بتتسرّع كل ما المريض يتعب."
    minutes: 10
    pages: [191, 192]
    topics: [contraindications, evaluation]
    goals:
      - "تعدّ الـ contraindications الـ 8 للـ LDLT"
      - "تفرّق بين contraindication و high risk factor"
      - "تقول الـ MELD بيتحدّث كل قد إيه"
      - "تعدّ الـ recipient criteria للـ living donor transplant"
    status: unverified
    steps:
      - kind: explain
        page: 191
        quote: "Total / extensive occlusion of splanchnic venous inflow (SMV)."
        title: "الموانع: Exclusion criteria"
        text: |
          - Age > 70، والـ ==physiological age== بيتقيّم case by case.
          - Active uncontrolled systemic infection، يعني sepsis.
          - Advanced cardio/pulmonary disease.
          - HIV، متأكد بـ ELISA و PCR مرتين.
          - Active ongoing alcoholism or substance abuse في آخر 6 شهور.
          - HCC beyond acceptable criteria.
          - ==Cholangiocarcinoma==.
          - Total أو extensive occlusion of splanchnic venous inflow، يعني الـ SMV.

          الفكرة الواحدة ورا الكل: هل الكبد الجديد هيعيش، والمريض هيستفيد؟

          - عدوى شغالة، وفوقها immunosuppression بعد الزرع: العدوى هتطير.
          - قلب أو رئة ضعيفين: مش هيستحملوا عملية بالحجم ده.
          - ورم برّه الحدود أو cholangiocarcinoma: هيرجع في الكبد الجديد.
          - إدمان لسه شغال: هيبوّظ الكبد الجديد زي ما بوّظ القديم.
          - الـ SMV مسدود: مفيش وريد نوصّل عليه الكبد الجديد.

          الشرح ده منطق مقبول؛ الكتاب كاتب القايمة بس.
      - kind: mnemonic
        page: 191
        quote: "Total / extensive occlusion of splanchnic venous inflow (SMV)."
        word: "CASH CASH"
        parts:
          - { key: "C", text: "Cardio/pulmonary disease, advanced" }
          - { key: "A", text: "Age > 70 (physiological age case by case)" }
          - { key: "S", text: "Sepsis: active uncontrolled systemic infection" }
          - { key: "H", text: "HIV, confirmed with ELISA and PCR twice" }
          - { key: "C", text: "Cholangiocarcinoma" }
          - { key: "A", text: "Alcoholism or substance abuse, active in the last 6 months" }
          - { key: "S", text: "SMV: total / extensive occlusion of splanchnic venous inflow" }
          - { key: "H", text: "HCC beyond acceptable criteria" }
        hook: |
          **CASH CASH**: ثمانية موانع، كل حرف مرتين. ومتقلقش، الكتاب ما قالش ولا كلمة عن الفلوس. 😄
      - kind: reveal
        page: 191
        quote: "Total / extensive occlusion of splanchnic venous inflow (SMV)."
        prompt: "ليه الـ total SMV occlusion مانع مطلق، بس الـ portal vein thrombosis مجرد high risk؟"
        answer: |
          الكبد الجديد لازم ياخد دم ==portal== داخل عليه. لو الـ splanchnic venous inflow كله مسدود، مفيش وريد نوصّل عليه الكبد أصلًا.

          أما الـ **PVT** لوحده فالجراح غالبًا يقدر يتعامل معاه وقت العملية، يشيل الجلطة أو يوصّل على حتة سليمة. علشان كده الكتاب حاطه في الـ high risk factors اللي بتتقيّم case by case.

          التفسير منطق جراحي مقبول، الكتاب كاتب التقسيم بس.
      - kind: explain
        page: 191
        title: "High risk factors: صعب، مش مستحيل"
        quote: "High Risk Factors: These factors are evaluated on a case by case basis and do not necessarily preclude transplantation."
        text: |
          - Active variceal hemorrhage
          - Renal failure أو HRS
          - Multiple previous hepatobiliary operations
          - Severe malnutrition أو cachexia
          - Diabetes Mellitus
          - Previous organ transplant
          - Need for simultaneous organ transplant، زي liver مع kidney
          - Portal vein thrombosis

          دول بيخلّوا العملية أصعب أو أخطر، بس ==مش بيقفلوا الباب==. أسهل تفتكرهم في مجموعتين:

          - العملية أصعب: عمليات قديمة، زرع سابق، زرع مزدوج، PVT. الجراح هيلاقي التصاقات أو أوعية صعبة.
          - المريض أضعف: نزيف شغال، كلى واقعة، cachexia، سكر. الجسم هيستحمل أقل، والتعافي هيبقى أبطأ.

          التقسيم ده للحفظ بس، الكتاب كاتبهم قايمة واحدة.
