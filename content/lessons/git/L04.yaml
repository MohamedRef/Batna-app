      - kind: explain
        page: 145
        quote: "Esophageal adenocarcinoma usually occurs in the distal third of the esophagus and may invade the adjacent gastric cardia."
        title: "شكل الـ adenocarcinoma"
        text: |
          الكتاب، **morphology**:
          - غالبًا في ==distal third==، وممكن يغزو الـ **gastric cardia** اللي جنبه.
          - في الأول: **flat or raised patches** في mucosa باقيها سليم.
          - بعدين: **large nodular masses** 5 cm أو أكتر.
          - أو: يتسرّب **diffusely**، أو يعمل **ulcer** ويغزو عميق.

          التفسير المقبول (مش في الكتاب): البداية «patch» مسطحة في mucosa سليمة هي سبب إن الـ **Barrett surveillance** بالمنظار والـ biopsies مهمة: الورم في أوله ما بيعملش كتلة ولا أعراض، فلازم تدوّر عليه وانت عارف إن المريض في خطر.
      - kind: mnemonic
        page: 145
        quote: "Risk factors of SCC of Esophagus\nI. Esophageal disorders:\n  Long standing esophagitis\n  Achalasia\n  Plummer-Vinson Syndrome\nII. Life style:\n  Alcohol\n  Tobacco\nIII. Dietary Factors\n  Def. of vit.\n  Def. of trace metals\n  Fungal contamination of food stuffs\n  High content of nitrites/nitrosamines\n  Frequent consumption of very hot beverages.\nIV. Genetic predisposition:\n  Tylosis"
        word: "HOT PATCH"
        parts:
          - { key: "H", text: "Hot beverages (very hot drinks) and human papillomavirus (HPV)" }
          - { key: "O", text: "Old (over 45) and men (4 times)" }
          - { key: "T", text: "Tylosis (genetic), p16/p53/EGFR changes" }
          - { key: "P", text: "Plummer-Vinson syndrome and poverty" }
          - { key: "A", text: "Achalasia, alcohol and long-standing esophagitis" }
          - { key: "T", text: "Tobacco" }
          - { key: "C", text: "Coeliac disease" }
          - { key: "H", text: "History of mediastinal radiation; Blacks 6 times; nitrosamines, fungi, vitamin and trace-metal deficiency" }
        hook: |
          الـ SCC بيحب حاجة **HOT** تلزق على المريء زي **PATCH**: شاي سخن جدًا على سيجارة على كاس.
      - kind: reveal
        page: 145
        quote: "Frequent consumption of very hot beverages."
        prompt: "إيه اللي بيجمع عوامل خطر الـ SCC؟"
        answer: |
          الكتاب بيقسّمها: **esophageal disorders** (long standing esophagitis، ==achalasia==، **Plummer-Vinson**)، **lifestyle** (alcohol، tobacco)، **dietary** (نقص vitamins و trace metals، **fungal contamination**، **nitrites/nitrosamines**، **very hot beverages**)، و **genetic** (==tylosis==).

          التفسير المقبول (مش في الكتاب): الخيط المشترك هو **إصابة متكررة للـ squamous lining**: الأكل اللي بيقعد في المريء (achalasia) أو بيعدّي على غشاء ضعيف (Plummer-Vinson)، والحرارة، والمواد المسرطنة. والنقص الغذائي بيضعّف إصلاح الخلايا. يعني كل عامل يا بيأذي يا بيمنع الإصلاح، والخلية اللي بتتأذي وتتصلح كتير أكتر عرضة للـ mutations.
      - kind: sort
        page: 145
        quote: "Esophageal adenocarcinoma usually occurs in the distal third of the esophagus and may invade the adjacent gastric cardia. Initially appearing as flat or raised patches in otherwise intact mucosa, large nodular masses of 5 cm or more in diameter may develop. Alternatively, tumors may infiltrate diffusely or ulcerate and invade deeply Risk factors of SCC of Esophagus I. Esophageal disorders: Long standing esophagitis Achalasia Plummer-Vinson Syndrome II. Life style:"
        prompt: "كل عامل خطر ده بيروح لأنهي نوع أكتر؟"
        bins: ["Squamous cell carcinoma", "Adenocarcinoma"]
        cards:
          - { text: "Achalasia", bin: 0 }
          - { text: "Barrett esophagus", bin: 1 }
          - { text: "Tylosis", bin: 0 }
          - { text: "Obesity / high BMI", bin: 1 }
          - { text: "Very hot beverages", bin: 0 }
          - { text: "GERD", bin: 1 }
          - { text: "Plummer-Vinson syndrome", bin: 0 }
          - { text: "Black race (6 times)", bin: 0 }
        why: "الـ SCC: مرض في المريء نفسه (achalasia, Plummer-Vinson)، tylosis، أكل وشرب سخن، فقر، Blacks. الـ adenocarcinoma: reflux و Barrett والسمنة. والسجاير في الاتنين."
      - kind: aside
        tone: joke
        page: 145
        quote: "Frequent consumption of very hot beverages."
        text: "الشاي اللي بيتشرب وهو بيغلي في القهوة البلدي مش رجولة. الكتاب كاتبها بالنص: frequent consumption of very hot beverages عامل خطر لـ SCC. استنى دقيقتين."
      - kind: explain
        page: 146
        quote: "The molecular pathogenesis of esophageal squamous cell carcinoma remains incompletely defined, but loss of several tumor suppressor genes, including p53 and p16/INK4a, is involved"
        title: "الجينات، والسن، والعرق"
        text: |
          الكتاب، باقي عوامل الـ SCC:
