  - id: hb.L08.lesson6
    title: "Biomarkers، الـ prognosis، وإزاي تكتب الـ essay"
    hook: "الـ ALT بيوصلك متأخر. فيه markers أذكى منه، وفيه جملة واحدة بتقولك مين في خطر."
