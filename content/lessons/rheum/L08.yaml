        text: |
          الـ **IVIG** هو ==standard of care== للعلاج الأول. والتوصيات حواليه:
          - **High risk** لمقاومة الـ IVIG أو لـ coronary aneurysms: **IVIG + glucocorticoids** (أو + non-glucocorticoid immunomodulators) أحسن من IVIG لوحده.
          - **Incomplete KD**: IVIG **فورًا** عند التشخيص، مش نستنى **لليوم 10** أو بعده.
          - **MAS**: IVIG للـ KD + علاج للـ MAS.
          - سخونية مستمرة بعد أول IVIG: **كورس IVIG تاني** أحسن من الـ steroids.

          ليه قبل اليوم 10؟ التفسير المقبول (مش في الكتاب): الـ aneurysms بتتكوّن في **الأسابيع الأولى**، والـ IVIG بيقلل حدوثها لو اتدّى **قبل** ما الجدار يتأذي. بعد كده بتعالج حاجة حصلت خلاص.
