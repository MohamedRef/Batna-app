  - id: endo.L01.lesson2
    title: "الـ pituitary والبنكرياس في MEN 1"
    hook: "الـ pituitary غالبًا بيعمل prolactin وبيبان بدري، والبنكرياس ساكت بس هو اللي بيموّت دلوقتي. اعرف ليه."
    minutes: 7
    pages: [3, 3]
    topics: [men1-pituitary, men1-gep]
    goals:
      - "تعرف نسب أنواع الـ pituitary tumors في MEN 1 وتربط كل نوع بشكله"
      - "تعرف ليه بنتابع IGF-1 مش GH"
      - "تفهم ليه الـ entero-pancreatic tumors بقت أخطر حاجة"
    status: unverified
    steps:
      - kind: explain
        page: 3
        quote: "Anterior Pituitary tumors\n  Prevalence in MEN-1 ranges 15-60% in different series.\n  First clinical manifestation in up to 25% of cases.\n  Two-thirds are microadenomas (<1cm).\n  Prolactinomas 60%, somatotropinomas 20%, corticotrophinomas and null cell tumors 15%.\n  Female patient may complain from amenorrhea, galactorrhea, infertility, impotence in men; acromegaly or cushing's disease.\n  Monitor PRL, IGF-1.\n  CT/MRI.\n  Trans-sphenoidal resection of pituitary tumor."
        title: "Anterior pituitary tumors"
        text: |
          - موجودة في **15–60%** من مرضى multiple endocrine neoplasia (MEN) 1.
          - أول مظهر clinical في لحد **25%**.
          - ==Two-thirds microadenomas== (أقل من 1 cm).

          ليه الرينج واسع كده (15 لـ 60)؟ لأن الرقم بيختلف **in different series**: كل ما الدراسة تعمل MRI لكل المرضى، بتلاقي microadenomas صغيرة ساكتة أكتر. وليه ممكن يبقى أول مظهر مع إن الـ parathyroid عند الكل؟ التفسير المقبول (مش في الكتاب): الـ hypercalcemia الخفيفة ساكتة، أما الـ prolactinoma عند ست بتعمل **amenorrhea** واضحة تخليها تروح للدكتور بدري.
      - kind: table
        page: 3
        quote: "Anterior Pituitary tumors\n  Prevalence in MEN-1 ranges 15-60% in different series.\n  First clinical manifestation in up to 25% of cases.\n  Two-thirds are microadenomas (<1cm).\n  Prolactinomas 60%, somatotropinomas 20%, corticotrophinomas and null cell tumors 15%.\n  Female patient may complain from amenorrhea, galactorrhea, infertility, impotence in men; acromegaly or cushing's disease.\n  Monitor PRL, IGF-1.\n  CT/MRI.\n  Trans-sphenoidal resection of pituitary tumor."
        title: "مين بيعمل إيه؟"
        columns: ["Tumour", "Share", "Picture"]
        rows:
          - ["Prolactinoma", "60%", "Amenorrhea, galactorrhea, infertility; impotence in men"]
          - ["Somatotropinoma", "20%", "Acromegaly"]
          - ["Corticotrophinoma + null cell", "15%", "Cushing's disease (corticotroph)"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: check
        page: 3
        quote: "Prolactinomas 60%, somatotropinomas 20%, corticotrophinomas and null cell tumors 15%."
        question: "A 28-year-old woman with MEN 1 develops amenorrhoea and galactorrhoea. Which pituitary tumour is most likely?"
        options: ["Prolactinoma", "Somatotropinoma", "Corticotrophinoma", "Null cell tumour"]
        answer: 0
        why:
          - "صح: الـ prolactinoma هو **60%** من الـ pituitary tumors في MEN 1، والـ amenorrhoea مع galactorrhoea شكله بالظبط."
          - "الـ somatotropinoma (20%) بيعمل acromegaly، مش لبن."
          - "الـ corticotrophinoma بيعمل Cushing's disease."
          - "الـ null cell مش بيفرز هرمون، فمش هيعمل galactorrhoea."
      - kind: explain
        page: 3
        quote: "Anterior Pituitary tumors\n  Prevalence in MEN-1 ranges 15-60% in different series.\n  First clinical manifestation in up to 25% of cases.\n  Two-thirds are microadenomas (<1cm).\n  Prolactinomas 60%, somatotropinomas 20%, corticotrophinomas and null cell tumors 15%.\n  Female patient may complain from amenorrhea, galactorrhea, infertility, impotence in men; acromegaly or cushing's disease.\n  Monitor PRL, IGF-1.\n  CT/MRI.\n  Trans-sphenoidal resection of pituitary tumor."
        title: "المتابعة"
        text: |
          - نتابع **prolactin (PRL)** و **IGF-1** (الـ IGF-1 مراية الـ growth hormone (GH)).
          - Imaging: **computed tomography (CT)/magnetic resonance imaging (MRI)**.
          - الجراحة: ==trans-sphenoidal resection==.

          ليه **IGF-1** مش الـ GH نفسه؟ التفسير المقبول (مش في الكتاب): الـ GH بيتفرز **نبضات** طول اليوم، فعينة واحدة ممكن تيجي عالية أو واطية بالصدفة. الـ IGF-1 بيتعمل في الكبد ردًّا على الـ GH وبيفضل ثابت، فهو بيوريك **متوسط** الـ GH على أيام. وليه الـ PRL والـ IGF-1 بالذات؟ لأنهم الاتنين اللي بيغطّوا **80%** من الأورام (prolactinoma 60% + somatotropinoma 20%).
      - kind: explain
        page: 3
        quote: "Entero-pancreatic tumors\n  Prevalence ranges from 30-75%.\n  Multicentric lesions.\n  Micro/macroadenomas -> invasive malignencies-> metastaic carcinoma.\n  As a result of the effective treatment available for parathyroid & pituitary manifestations in MEN-1 the malignant potential of these entero-pancreatic lesions is now the primary life-threatening manifestation of the syndrome."
        title: "ليه البنكرياس بقى هو الخطر؟"
        text: |
          الـ ==entero-pancreatic tumors== موجودة في **30–75%**، و**multicentric**.

          بتمشي كده: micro/macroadenoma ← invasive malignancy ← metastatic carcinoma.

          زمان الناس كانت بتموت من الكالسيوم والـ pituitary. دلوقتي دول ليهم علاج كويس، فبقى الـ **malignant potential** بتاع البنكرياس هو **the primary life-threatening manifestation**.

          وليه **multicentric**؟ نفس فكرة الجين: كل خلية islet شايلة الخلل، فبيطلع ورم هنا وورم هناك. يعني مفيش "ورم واحد" تشيله وتطمن، وده اللي هيخلّي قرار الجراحة صعب في الدرس الجاي.
      - kind: order
        page: 3
        quote: "Entero-pancreatic tumors\n  Prevalence ranges from 30-75%.\n  Multicentric lesions.\n  Micro/macroadenomas -> invasive malignencies-> metastaic carcinoma.\n  As a result of the effective treatment available for parathyroid & pituitary manifestations in MEN-1 the malignant potential of these entero-pancreatic lesions is now the primary life-threatening manifestation of the syndrome."
        prompt: "رتّب مسار الـ entero-pancreatic lesion:"
        steps: ["Micro/macroadenoma", "Invasive malignancy", "Metastatic carcinoma"]
      - kind: figure
        page: 3
        quote: "Prolactinomas 60%, somatotropinomas 20%, corticotrophinomas and null cell tumors 15%."
        title: "مين بيبان الأول ومين بيقتل"
        alt: "Top: a bar splits MEN 1 pituitary tumours into prolactinoma 60 percent, somatotropinoma 20 percent and corticotroph plus null cell 15 percent. Bottom: three boxes show the entero-pancreatic path from adenoma to invasive to metastatic, labelled as now the main life-threatening part of MEN 1."
        caption: "الـ pituitary: الـ prolactinoma الأغلبية، وممكن يبقى أول ما يبان. البنكرياس: 30–75%، وبقى هو اللي بيحدد العمر."
        svg: |
          <svg viewBox="0 0 330 215" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="22" class="t-b">Pituitary tumours in MEN 1</text>
            <rect x="10" y="34" width="186" height="30" class="fg-acc"/>
            <rect x="196" y="34" width="62" height="30" class="fg-box"/>
            <rect x="258" y="34" width="47" height="30" class="fg-thin"/>
            <text x="20" y="54" class="t-sm t-b">PRL 60%</text>
            <text x="202" y="54" class="t-sm">GH 20%</text>
            <text x="262" y="54" class="t-sm">15%</text>
            <text x="10" y="82" class="t-sm t-mut">15% = ACTH + null cell</text>
            <text x="10" y="120" class="t-b">Entero-pancreatic: 30–75%</text>
            <rect x="10" y="132" width="90" height="30" class="fg-box"/>
            <rect x="110" y="132" width="90" height="30" class="fg-box"/>
            <rect x="210" y="132" width="110" height="30" class="fg-bad"/>
            <text x="18" y="152" class="t-sm">adenoma</text>
            <text x="118" y="152" class="t-sm">invasive</text>
            <text x="218" y="152" class="t-sm t-b t-bad">metastatic</text>
            <text x="10" y="198" class="t-sm t-bad">now the main life-threatening part of MEN 1</text>
          </svg>
      - kind: aside
        tone: exam
        page: 3
        quote: "As a result of the effective treatment available for parathyroid & pituitary manifestations in MEN-1 the malignant potential of these entero-pancreatic lesions is now the primary life-threatening manifestation of the syndrome."
        text: "سؤالين شبه بعض وإجابتهم مختلفة: **earliest / most common** manifestation = primary hyperparathyroidism. **Primary life-threatening** manifestation = الـ entero-pancreatic tumours. اقرا السؤال كويس."
      - kind: try
        items: [endo.L01.014, endo.L01.015, endo.L01.019, endo.L01.020, endo.L01.085]
    recap:
      - "Pituitary في MEN 1: 15–60%، أول مظهر في لحد 25%، ثلثين micro."
      - "Prolactinoma 60%، somatotropinoma 20%، ACTH + null cell 15%؛ نتابع PRL و IGF-1."
      - "IGF-1 ثابت والـ GH بينبض، عشان كده بنقيس IGF-1."
      - "Entero-pancreatic: 30–75%، multicentric، وبقت أخطر مظهر (malignant potential)."
    practice: [endo.L01.014, endo.L01.015, endo.L01.016, endo.L01.017, endo.L01.018, endo.L01.019, endo.L01.020, endo.L01.085, endo.L01.086]
