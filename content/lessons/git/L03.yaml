  - id: git.L03.lesson1
    title: "يعني إيه functional؟"
    hook: "أشهر تشخيص في الجهاز الهضمي: أعراض حقيقية جدًا، والمنظار والأشعة نضاف. يبقى بنصنّفه إزاي؟"
    minutes: 8
    pages: [76, 79]
    topics: [concept, psychosocial]
    goals:
      - "تعرّف الـ functional gastrointestinal disorders (FGIDs) كـ disorders of gut–brain interaction"
      - "تعرف Rome IV زوّد إيه على Rome III وليه"
      - "تفرّق بين الـ organic والـ motility والـ functional، وبين symptom و syndrome"
    status: unverified
    steps:
      - kind: explain
        page: 76
        quote: "Functional gastrointestinal disorders (FGIDs) are characterized by recurring gastrointestinal (GI) symptoms that cannot be attributed to organic disease, structural, or biochemical causes."
        title: "أعراض حقيقية، والفحوصات سليمة"
        text: |
          الـ ==functional gastrointestinal disorders (FGIDs)== هي **the most common diagnoses in gastroenterology**: نص عيادة الجهاز الهضمي تقريبًا.

          التعريف: **recurring GI symptoms** ما ينفعش ترجّعها لـ organic disease ولا structural ولا biochemical cause.

          الاسم الأحدث بيقول الفكرة كلها: ==disorders of gut–brain interaction==. المشكلة مش في شكل العضو، المشكلة في الكلام اللي رايح جاي بين المخ والمصران.

          التفسير المقبول (مش في الكتاب): يعني لما تقول للمريض «عندك functional»، انت مش بتقول «مفيش حاجة»، انت بتقول إن الجهاز سليم في شكله بس **الإشارات** بينه وبين المخ متلخبطة. وده بيفسّر ليه الأعراض حقيقية وبتتكرر رغم إن كل الفحوصات نضيفة.
      - kind: mnemonic
        page: 76
        quote: "Motility disturbance Visceral hypersensitivity Altered mucosal and immune function Altered gut microbiota Altered central nervous system (CNS) processing."
        word: "MIMIC"
        parts:
          - { key: "M", text: "Motility disturbance" }
          - { key: "I", text: "Immune and mucosal function altered" }
          - { key: "M", text: "Microbiota altered" }
          - { key: "I", text: "Increased visceral sensitivity (visceral hypersensitivity)" }
          - { key: "C", text: "CNS processing altered" }
        hook: |
          الـ FGID بيعمل **MIMIC** للمرض العضوي: نفس الأعراض، من غير pathology. والحروف الخمسة هي الأسباب الخمسة اللي الكتاب بيعدّها بأي combination.
      - kind: reveal
        page: 76
        quote: "Functional GI disorders are disorders of gut–brain interaction."
        prompt: "ليه غيّروا الاسم لـ disorders of gut–brain interaction؟"
        answer: |
          الكتاب: الـ FGIDs هي ==disorders of gut–brain interaction==، والأسباب الخمسة فيهم اتنين بس في المصران نفسه (motility، mucosa)، والباقي فيه المخ (CNS processing) والإحساس (hypersensitivity) والبكتيريا.

          التفسير المقبول (مش في الكتاب): كلمة **functional** لوحدها كانت بتتفهم عند المريض (وساعات عند الدكتور) إنها «مفيش حاجة» أو «نفسي». الاسم الجديد بيقول إن فيه **خلل حقيقي** في الكلام بين عضوين، وده بيخلّي المريض يصدّق التشخيص ويقبل العلاج، وده نفس اللي Rome IV قاله عن تقليل الـ **stigmatizing terms**.
      - kind: explain
        page: 77
        quote: "Rome IV is a compendium of the knowledge accumulated since Rome III was published 2006."
        title: "Rome IV زوّد إيه؟"
        text: |
          الكتاب: الـ ==Rome Foundation== هي اللي عملت الـ diagnostic criteria. و **Rome IV** خلاصة اللي اتعرف من ساعة **Rome III (2006)**، وبيتحسّن عليه في خمس حاجات:
          1. **تحديث** الـ basic والـ clinical literature.
          2. معلومات جديدة عن الـ **gut microenvironment**، **gut–brain interactions**، **pharmacogenomics**، والـ **biopsychosocial**، و**gender** و**cross-cultural** understanding.
          3. يقلّل الـ terms اللي مش دقيقة وساعات بتعمل ==stigma==.
          4. **diagnostic algorithms** متحدّثة.
          5. يدخّل **patient illness experience** والـ **physiological subgroups** أو **biomarkers** اللي ممكن توصّل لعلاج targeted أكتر.

          التفسير المقبول (مش في الكتاب) علشان تفتكرهم: الخمسة دول بيجاوبوا على سؤال واحد، إزاي نخلّي التشخيص **أدق** (literature، algorithms، biomarkers) و**أرحم بالمريض** (stigma، illness experience، culture).
      - kind: figure
        page: 77
        quote: "Biopsychosocial Conceptual Model"
        title: "الـ biopsychosocial model"
        image: { file: git/L03-biopsychosocial.webp, book: true }
        alt: "Book diagram: early life (genetics, culture, environment) feeds psychosocial factors and physiology, which talk to each other through the brain-gut axis (CNS and ENS); both shape the FGID presentation (symptoms, severity, behaviors), which leads to outcomes such as health care use, daily function and quality of life, with arrows back."
        caption: |
          ده الإطار اللي Rome IV ماشي عليه: **early life** بتأثر في الـ **psychosocial factors** وفي الـ **physiology** (motility، sensation، inflammation، microflora).

          الاتنين بيكلّموا بعض عن طريق ==brain-gut axis==، والنتيجة **FGID presentation** وبعدها الـ **outcome**. والأسهم راجعة كمان: المرض نفسه بيأثر في النفسية.
      - kind: sort
        page: 78
        quote: "The Organic (structural) Disorders (e.g., esophagitis, inflammatory bowel disease) are classified in terms of organ morphology and the criterion for a disease is pathology at a macro- or microlevel."
        prompt: "كل تشخيص من دول بيتصنّف إزاي؟"
        bins: ["Organic", "Motility", "Functional"]
        cards:
          - { text: "Esophagitis", bin: 0 }
          - { text: "Inflammatory bowel disease", bin: 0 }
          - { text: "Gastroparesis", bin: 1 }
          - { text: "Intestinal pseudo-obstruction", bin: 1 }
          - { text: "Irritable bowel syndrome", bin: 2 }
          - { text: "Functional dyspepsia", bin: 2 }
        why: "الـ organic ليه pathology تشوفها. الـ motility ليه وظيفة حركة غلط ممكن تقيسها (وممكن تيجي وتروح مع تكرار الاختبار). الـ functional بيتشخص من الأعراض بـ Rome criteria."
      - kind: explain
        page: 79
        quote: "A functional GI disorder is a syndrome based on symptoms that cluster together and are diagnosed by Rome criteria."
        title: "تلات طرق نصنّف بيها المرض"
        text: |
          الكتاب بيحط تلات أنواع جنب بعض:

          - **Organic (structural):** بيتصنّف بـ ==organ morphology==، والدليل pathology تشوفها بالعين أو الميكروسكوب. مثال: esophagitis، inflammatory bowel disease (IBD).
          - **Motility disorder:** بيتصنّف بـ organ function، يعني altered motility مستمرة أو متكررة. مثال: gastroparesis، intestinal pseudo-obstruction.
          - **Functional GI disorder:** بيتصنّف بـ ==symptoms==، يعني إحساس المريض وحكايته عن المرض. مثال: Irritable bowel syndrome (IBS)، functional dyspepsia.

          والـ FGID هو **syndrome**: أعراض بتيجي مع بعض، وبنشخصها بـ **Rome criteria**.
      - kind: explain
        page: 79
        quote: "Dysmotility may come and go with repeated physiological testing."
        title: "ليه الـ motility disorder مش زي الـ functional؟"
        text: |
          الكتاب: الـ dysmotility هي نشاط غلط في عضلات الأحشاء (زي **slow bowel transit** و **delayed gastric emptying**). بس الـ ==motility disorder== معناه dysmotility **persistent or recurrent** اتعرفت كـ clinical entity، وعلاقتها بالأعراض متغيّرة. والـ dysmotility نفسها **may come and go** مع تكرار الاختبار.

          وعلى الناحية التانية الكتاب بيفرّق:
          - ==Symptom==: تغيير في الجسم المريض **حاسس** بيه إنه مختلف عن الطبيعي، وممكن يتفهم إنه مهم أو لأ.
          - ==Syndrome==: أعراض أو علامات **بتيجي مع بعض** وبتعرّف clinical entity.

          التفسير المقبول (مش في الكتاب): يعني الـ motility disorder ليه **قياس** (ممكن يطلع غير طبيعي)، والـ functional ليه **حكاية** (أعراض متجمعة بشكل ثابت). فلو جالك مريض بأعراض dyspepsia والـ gastric emptying طلع بطيء مرة وطبيعي مرة، ما تتسرعش تقول gastroparesis، لأن الكتاب نفسه بيقول الـ dysmotility بتيجي وتروح.
      - kind: explain
        page: 79
        quote: "Although psychosocial factors are not required for diagnosis, they influence physiological functioning of the GI tract via the brain–gut axis (motility, sensitivity, barrier function), are modulators of the patient's pain experience and symptom behavior, and, ultimately, affect treatment selection and the clinical outcome When evaluating for psychosocial factors, the clinician should consider four general observations: Psychological stress or one's emotional response to stress exacerbates gastrointestinal symptoms and may contribute to FGID development."
        title: "النفسية مش شرط، بس بتلعب في كل حاجة"
        text: |
          الـ ==psychosocial factors== **not required for diagnosis**، بس بتأثر على الـ motility والـ sensitivity والـ barrier عن طريق الـ brain–gut axis، وبتأثر على اختيار العلاج والنتيجة.

          الكتاب بيقول خد بالك من أربع ملاحظات:

          - **Stress** بيزوّد الأعراض وممكن يساعد إن المرض يبدأ، زي **postinfection IBS** أو dyspepsia.
          - فيه association عالي مع psychosocial comorbidities و life stress و abuse، ودول معناهم **poorer outcomes**.
          - العوامل دي بتغيّر تجربة المرض وسلوكه، زي إنه يدوّر على دكاترة كتير.
          - والعكس كمان: المرض المزمن نفسه بيعمل distress بيرجع يزوّد الأعراض.
      - kind: check
        page: 79
        quote: "A functional GI disorder is a syndrome based on symptoms that cluster together and are diagnosed by Rome criteria."
        question: "How is a functional GI disorder diagnosed according to the lecture?"
        options:
          - "By symptoms that cluster together, using Rome criteria"
          - "By pathology at a macro- or microlevel"
          - "By a single abnormal motility test"
          - "Only when a psychosocial factor is present"
        answer: 0
        why:
          - "صح: الـ FGID **syndrome** من أعراض بتتجمع، بيتشخص بـ **Rome criteria**."
          - "ده تصنيف الـ **organic** disorders."
          - "الـ dysmotility بتيجي وتروح، وده تصنيف الـ **motility** disorder."
          - "الكتاب: الـ psychosocial factors **not required for diagnosis**."
      - kind: sort
        page: 78
        quote: "A Motility Disorder (e.g., gastroparesis, intestinal pseudoobstruction), is classified in terms of organ function and specifically altered motility."
        prompt: "التصنيف بيعتمد على إيه؟"
        bins: ["Organic", "Motility", "Functional"]
        cards:
          - { text: "Pathology at a macro- or microlevel", bin: 0 }
          - { text: "Organ morphology", bin: 0 }
          - { text: "Organ function, altered motility", bin: 1 }
          - { text: "Dysmotility that may come and go on testing", bin: 1 }
          - { text: "The patient's report of symptoms", bin: 2 }
          - { text: "Rome criteria", bin: 2 }
        why: "الـ organic بالـ **شكل** (morphology، pathology)، الـ motility بالـ **وظيفة** (حركة غلط ممكن تتقاس، وبتيجي وتروح)، والـ functional بالـ **أعراض** (حكاية المريض و Rome criteria). التفسير المقبول (مش في الكتاب): يعني كل نوع ليه «دليل» مختلف: صورة، قياس، أو حكاية."
      - kind: try
        items: [git.L03.002, git.L03.004, git.L03.007, git.L03.010, git.L03.017]
    recap:
      - "FGIDs = recurring GI symptoms من غير organic أو structural أو biochemical cause؛ اسمها الجديد disorders of gut–brain interaction."
      - "الآليات الخمسة (MIMIC): motility، immune/mucosa، microbiota، visceral hypersensitivity، CNS processing."
      - "Rome IV (بعد Rome III 2006): literature، gut–brain و pharmacogenomics و culture، أقل stigma، algorithms، illness experience و biomarkers."
      - "Organic بالـ morphology، motility بالوظيفة (وبتيجي وتروح)، functional بالأعراض و Rome criteria."
      - "الـ psychosocial factors مش شرط للتشخيص، بس بتأثر على الأعراض والعلاج والنتيجة."
    practice: [git.L03.001, git.L03.002, git.L03.003, git.L03.004, git.L03.005, git.L03.006, git.L03.007, git.L03.008, git.L03.009, git.L03.010, git.L03.011, git.L03.012, git.L03.013, git.L03.014, git.L03.015, git.L03.016, git.L03.017, git.L03.018, git.L03.019, git.L03.020, git.L03.286]
