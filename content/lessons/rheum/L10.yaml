        quote: "A biosimilar is defined by the World Health Organization (WHO) as a \"biotherapeutic product which is similar in terms of quality, safety and efficacy to an already licensed reference biotherapeutic product.\""
        text: |
          الـ World Health Organization (WHO): منتج ==similar in quality, safety and efficacy== لـ reference مرخّص.

          الفرق عن الـ **biomimic/biocopy**: نفس الـ **primary amino acid sequence** + اختبارات analytic و clinical صارمة.

          مراجعة **2016** (19 دراسة) دعمت biosimilars الـ infliximab و etanercept و adalimumab. مثال: ==infliximab-dyyb (CT-P13)==، immunoglobulin G subclass 1 (IgG1) chimeric، في كوريا من **2012**.
