  # ---------- p73: glycemic control, insulin neuritis ----------
  - id: dm.L06.031
    kind: card
    topic: causal
    front: What did the DCCT show about intensive treatment and diabetic neuropathy?
    back: Intensive treatment significantly reduced both the incidence and progression of diabetic neuropathy in type 1 diabetes.
    src: { page: 73, quote: "Intensive treatment significantly reduced both the incidence & progression of DN in patients with T1DM." }
    status: unverified
    tags: [high-yield]
  - id: dm.L06.032
    kind: card
    topic: causal
    front: In the DCCT figure, which neuropathy measure was most common at 5 years in the conventional arm, and what did intensive therapy do to it?
    back: Abnormal nerve conduction (about 40% conventional); intensive therapy cut it to under 20%.
    src: { page: 73, quote: "Abn. Nerve Cond." }
    status: unverified
  - id: dm.L06.033
    kind: card
    topic: causal
    front: What is insulin neuritis?
    back: Treatment-associated neuropathic pain (neuralgia) in poorly controlled patients shortly after starting aggressive insulin therapy.
    src: { page: 73, quote: "Occur in poorly-controlled patients shortly after starting aggressive insulin therapy." }
    status: unverified
    tags: [high-yield]
  - id: dm.L06.034
    kind: card
    topic: causal
    front: How do you tell insulin neuritis from DPN?
    back: Insulin neuritis has no sensory loss and no weakness.
    src: { page: 73, quote: "DD from DPN: No Sensory loss and No weakness." }
    status: unverified
    tags: [high-yield]
  - id: dm.L06.035
    kind: card
    topic: causal
    front: Treatment of insulin neuritis?
    back: Temporarily relaxing glycemic control.
    src: { page: 73, quote: "Temporarily relaxing glycemic control." }
    status: unverified
  - id: dm.L06.036
    kind: mcq
    topic: causal
    stem: A 34-year-old with type 1 diabetes and HbA1c 13% started an intensive basal-bolus regimen 4 weeks ago; HbA1c is falling fast. She now has severe burning pain in both feet. Sensation to monofilament and vibration is normal and there is no weakness. What is the best management?
    options:
      - Temporarily relax glycemic control
      - Intensify insulin further
      - Nerve conduction studies and sural biopsy
      - Stop insulin completely
      - Start high-dose steroids
    answer: 0
    why:
      - "Correct: insulin neuritis (pain soon after aggressive insulin in poor control, no sensory loss, no weakness) is treated by temporarily relaxing glycemic control (p73)."
      - Faster correction is the trigger, not the cure.
      - The picture is typical; NCS are only for suspected non-diabetic causes.
      - A type 1 patient can never stop insulin.
      - Steroids have no role and worsen glucose.
    src: { page: 73, quote: "Temporarily relaxing glycemic control." }
    status: unverified
