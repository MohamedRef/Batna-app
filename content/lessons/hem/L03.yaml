        title: "علاج الـ β major: دم وحديد"
        quote: "Regular red cell transfusions and chelation therapy for iron overload are the cornerstones of therapy for β thalassaemia major."
        text: |
          الأساس: ==regular transfusion + iron chelation==.

          **النقل**: يخلّي الـ Hb **فوق 9.5–10 g/dL** دايمًا، عشان الهدف مش بس إن العيان يعيش. الهدف: يمنع الـ anaemia والـ hypoxia، و==يكتم الـ erythropoiesis بتاعة الجسم== (فالنخاع ما يتمددش والامتصاص يقل).

          **الـ chelation** بيبدأ عادة على ==3 سنين==. الـ **desferrioxamine**: **25–60 mg/kg** subcutaneous (SC) بـ infusion pump على 12 ساعة، **5–6 أيام** في الأسبوع.
      - kind: reveal
        page: 28
        quote: "Iron chelation therapy is usually started at the age of 3 years."
        prompt: "ليه الـ chelation ما بيبدأش من أول كيس دم؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الجسم ما عندوش طريقة يطلّع بيها الحديد الزيادة، فكل كيس بيضيف حديد ويفضل. بس الحديد محتاج **وقت وكمية نقل** عشان يتراكم لدرجة تأذي، والأدوية نفسها ليها أعراض جانبية على طفل صغير بيكبر.

          عشان كده الكتاب بيقول الـ chelation بيبدأ عادة على ==3 سنين==. وطول ما العيان بينقل دم، الـ chelation بيكمل معاه.
