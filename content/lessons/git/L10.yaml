        why: "اللي فوق في البلعوم (أعصاب أو Zenker) oropharyngeal. اللي بيبوّظ الحركة (achalasia، scleroderma، Chagas) motility. واللي بيضيّق الماسورة من جوه أو برّه (Schatzki، eosinophilic esophagitis (EoE)، vascular compression) mechanical."
