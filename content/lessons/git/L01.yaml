  - id: git.L01.lesson3
    title: "الـ gastritis: من الـ Sydney لحد Kyoto"
    hook: "المنظار بيقولك الـ H. pylori موجود ولا لأ، والسرطان قريب ولا بعيد، لو عرفت تقرا الـ score."
    minutes: 10
    pages: [12, 21]
    topics: [gastritis, kyoto]
    goals:
      - "تفرّق بين autoimmune gastritis و multifocal atrophic gastritis"
      - "تحسب Kyoto score وتفسّره"
      - "ترتّب درجات Kimura-Takemoto"
    status: unverified
    steps:
      - kind: explain
        page: 12
        quote: "chronic inflammatory mucosal changes leading eventually to mucosal atrophy and intestinal metaplasia in absence of erosions"
        title: "Chronic gastritis يعني إيه؟"
        text: |
          ==Chronic gastritis==: **chronic inflammatory mucosal changes** بتوصل في الآخر لـ **atrophy** و **intestinal metaplasia**، **من غير erosions**.

          الملمحين تحت الميكروسكوب:
          - **Inflammatory cells** في الـ lamina propria.
          - **Atrophy** في الـ glandular epithelium.
      - kind: explain
        page: 13
        quote: "gastritis staging is done using the OLGA (Operative Link on Gastritis Assessment) staging system"
        title: "Sydney بيصنّف، OLGA بيعمل staging"
        text: |
          - **Updated Sydney System**: بيصنّف ويعمل grading بدمج **topographical** و **morphological** و **etiological** information.
          - **OLGA** (Operative Link on Gastritis Assessment): بيعمل ==staging== بدمج **atrophy score** (من الـ biopsy) و **atrophy topography** (من الـ biopsy mapping).

          علشان كده في حالة الـ dyspepsia أخدوا biopsies من **antrum, incisura, fundus and body**: محتاجين خريطة.
      - kind: sort
        page: 14
        quote: "The inflammation is restricted to the corpus and fundus, sparing the antrum, which distinguishes AIG from other conditions"
        prompt: "Autoimmune (type A) ولا multifocal atrophic (type B)؟"
        bins: ["Type A (autoimmune)", "Type B (multifocal atrophic)"]
        cards:
          - { text: "Corpus and fundus only, antrum spared", bin: 0 }
          - { text: "Anti-parietal cell antibodies", bin: 0 }
          - { text: "B12 deficiency, megaloblastic anemia", bin: 0 }
          - { text: "Hashimoto, type 1 DM, Addison, vitiligo", bin: 0 }
          - { text: "Mostly H. pylori", bin: 1 }
          - { text: "Starts in body and antrum, then spreads", bin: 1 }
          - { text: "Pepsinogen 1/2 ratio predicts extensive atrophy", bin: 1 }
        why: "الـ AIG بيضرب الـ **oxyntic mucosa** بس (corpus و fundus) ويسيب الـ antrum، وده اللي بيفرقه عن الـ H. pylori. الـ MAG من H. pylori بيبدأ في الـ body والـ antrum وينتشر."
      - kind: reveal
        page: 14
        quote: "Parietal cells (oxyntic cells) have two main functions: HCL secretion and intrinsic factor (vitamin B12-binding glycoprotein) production."
        prompt: "ليه الـ autoimmune gastritis بيعمل megaloblastic anemia؟"
        answer: |
          الـ **parietal cells** بتعمل حاجتين: **HCl** و **intrinsic factor**.

          الـ **APCA** بتدمرها، فيقل الـ intrinsic factor (يعني B12 مش هيتمتص) ويقل الحمض (فالـ iron كمان امتصاصه بيقل). النتيجة **megaloblastic anemia**.

          وكمان **hyposplenism** (pitted RBCs أكتر من 4%) في **55%** منهم.
      - kind: explain
        page: 16
        quote: "Diffuse redness with or without RAC, which is related to H. pylori infection status, are accounted for in the Kyoto classification score"
        title: "Kyoto: 19 علامة، بس 5 بيتحسبوا"
        text: |
          الـ **Kyoto classification** (2013) فيها **19** endoscopic finding، وهدفها حاجتين: تشخّص **H. pylori** بالمنظار، وتقدّر **gastric cancer risk**.

          الـ score بيتعمل من 5 بس:
          - **Atrophy**، **intestinal metaplasia**، **enlarged folds**، **nodularity**: مرتبطين بالـ ==cancer risk==.
          - **Diffuse redness** (مع أو من غير RAC): مرتبطة بـ ==H. pylori status==.
      - kind: table
        page: 16
        quote: "≥ 5 mm gastric fold width"
        title: "Kyoto score (0-8)"
        columns: ["Finding", "1 point", "2 points"]
        rows:
          - ["Atrophy", "C2-C3", "O1-O3"]
          - ["Intestinal metaplasia", "Antrum", "Up to corpus"]
          - ["Enlarged folds", "Fold width ≥5 mm", "-"]
          - ["Nodularity", "Small antral nodules", "-"]
          - ["Diffuse redness", "Mild (with RAC)", "Severe"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [4, 2]]
      - kind: aside
        tone: exam
        page: 16
        quote: "A score of 0 indicates no Helicobacter pylori (H. pylori) infection, a score of ≥ 2 indicates current H. pylori infection"
        text: |
          التفسير: **0** = مفيش H. pylori. ==≥2== = **current** H. pylori. ==≥4== = **higher gastric cancer risk**.

          افتكرها بالزوجي: **صفر، اتنين، أربعة**: نضيف، مصاب، خطر.
      - kind: figure
        page: 18
        title: "Kimura-Takemoto في المنظار"
        image: { file: git/L01-kimura-takemoto.webp, book: true }
        alt: "Six endoscopic photos A to F with a dotted atrophic border and a small stomach diagram in each corner showing the atrophic area in blue spreading from the antrum (A) up the lesser curvature (B, C) and over the cardia to the greater curvature (D to F)."
        caption: |
          الخط المنقّط هو حد الـ atrophy. الرسمة الزرقا في الركن بتوريك هو وصل لحد فين.

          - **A-C**: closed type (**C1-C3**)، الـ atrophy لسه على الـ lesser curvature.
          - **D-F**: open type (**O1-O3**)، عدّى الـ cardia ورايح للـ greater curvature.
      - kind: order
        page: 19
        quote: "A: C1 (Atrophy is limited to the antrum);"
        prompt: "رتّب الـ atrophy من الأقل للأوسع:"
        steps:
          - "C1: antrum only"
          - "C2: minor area of lesser curvature"
          - "C3: major area of lesser curvature"
          - "O1: over the cardia to the fundus"
          - "O2: border on the anterior wall"
          - "O3: border toward the greater curvature"
        why: "الـ atrophy بيطلع من الـ antrum على الـ lesser curvature (C)، وبعدين يعدّي الـ cardia ويلف للـ greater curvature (O). وفي Kyoto: C0-C1 = 0، C2-C3 = 1، O1-O3 = 2."
      - kind: check
        page: 16
        quote: "and a score of ≥ 4 indicates higher risk of gastric cancer risk."
        question: "Atrophy C3, intestinal metaplasia up to the corpus, enlarged folds 6 mm, no nodularity, no diffuse redness. Kyoto score and meaning?"
        options:
          - "4: higher gastric cancer risk"
          - "3: current H. pylori"
          - "5: higher gastric cancer risk"
          - "2: current H. pylori only"
        answer: 0
        why:
          - "صح: C3 = 1، IM للـ corpus = 2، folds ≥5 mm = 1، الباقي صفر. المجموع 4 ← higher cancer risk."
          - "نسيت نقطة من الـ IM أو الـ folds."
          - "عدّيت الـ atrophy C3 على إنها 2، بس الـ 2 لـ O1-O3."
          - "ده أقل بكتير من المجموع الصح."
      - kind: explain
        page: 20
        quote: "(light blue crest on the mucosal epithelial rim visualized using magnified NBI)"
        title: "Intestinal metaplasia شكلها إيه؟"
        text: |
          - **Grayish-white**، slightly elevated plaques، وحواليها mucosa pink و pale متلخبطة، فالسطح irregular.
          - علامات مساعدة: **villous appearance**، **whitish mucosa**، **rough surface**.
          - الـ **NBI** حسّن الرؤية والدقة، والعلامة المشهورة: ==light blue crest== على حافة الـ epithelium في الـ magnified NBI.
      - kind: try
        items: [git.L01.051, git.L01.063, git.L01.064, git.L01.070]
    recap:
      - "Chronic gastritis = inflammation ← atrophy و intestinal metaplasia، من غير erosions."
      - "Sydney بيصنّف؛ OLGA بيعمل staging (atrophy score + topography)."
      - "Type A: corpus/fundus، يسيب الـ antrum، APCA، B12. Type B: H. pylori، antrum و body وينتشر."
      - "Kyoto: 0 نضيف، ≥2 H. pylori، ≥4 cancer risk."
      - "Kimura-Takemoto: C1-C3 بعدين O1-O3. الـ IM = light blue crest على NBI."
    practice: [git.L01.042, git.L01.043, git.L01.044, git.L01.045, git.L01.046, git.L01.047, git.L01.048, git.L01.049, git.L01.050, git.L01.051, git.L01.052, git.L01.053, git.L01.054, git.L01.055, git.L01.056, git.L01.057, git.L01.058, git.L01.059, git.L01.060, git.L01.061, git.L01.062, git.L01.063, git.L01.064, git.L01.065, git.L01.066, git.L01.067, git.L01.068, git.L01.069, git.L01.070, git.L01.071, git.L01.072, git.L01.073, git.L01.074, git.L01.171, git.L01.172, git.L01.173, git.L01.174]
