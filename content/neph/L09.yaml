  # ---------- p295-297: vascular access ----------
  - id: neph.L09.024
    kind: enumerate
    topic: access
    prompt: Why do we need an arterialised vein for haemodialysis?
    points:
      - Adequate blood flow for the dialyser (250–400 mL/min)
      - Tolerate large needles (typically 15 gauge)
      - Tolerate repeated puncture (thrice-weekly dialysis)
    pass: 3
    hook: "الوريد لازم «يتشرين» عشان 3: دم كفاية للفلتر (250–400 mL/min)، يستحمل إبر تخينة (15 gauge عادة)، ويستحمل الشكّ المتكرر (thrice-weekly)."
    src: { page: 295, quote: "Why we need an arterialysed vein? ;to give adequate blood flow for the dialyser 250-400ml /min (mean blood flow in the radial artery is only 64" }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.025
    kind: cloze
    topic: access
    text: "Mean radial artery flow is only about {{c1::64 mL/min}} before fistula creation and can rise {{c2::ten-fold}} with maturation; the dialyser needs {{c3::250–400 mL/min}}."
    src: { page: 295, quote: "Why we need an arterialysed vein? ;to give adequate blood flow for the dialyser 250-400ml /min (mean blood flow in the radial artery is only 64" }
