    kind: card
    topic: frailty
    front: "Clinical Frailty Scale: what separates level 7 from level 9?"
    back: Level 7 is completely dependent for personal care but stable and not at high risk of dying within about 6 months. Level 9 (terminally ill) has a life expectancy under 6 months but is not otherwise evidently frail.
