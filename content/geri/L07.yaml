    kind: table
    topic: nutrition
    title: Mini Nutritional Assessment (MNA) bands
    columns: [Part, Score, Meaning]
    rows:
      - ["Screening (max 14)", "12–14", "Normal nutritional status"]
      - ["Screening (max 14)", "8–11", "At risk of malnutrition"]
      - ["Screening (max 14)", "0–7", "Malnourished"]
      - ["Total assessment (max 30)", "24–30", "Normal nutritional status"]
