    front: What is haemofiltration?
    back: A purely convective (ultrafiltration) treatment with high-flux membranes and no dialysis fluid; a sterile replacement fluid restores volume and lowers solute concentration.
    src: { page: 302, quote: "Hemofiltration Hemofiltration is an exclusively ultrafiltration/convection treatment in which high-flux membranes are utilized in the absence of dialysis fluid. Infusion of a sterile solution into the blood circuit reconstitutes the reduced plasma volume and reduces solute concentration. Infusion of a sterile solution (replacement fluid) can replace totally or partially the filtered volume. Replacement fluid can be infused pre-filter (pre-dilution) or post-filter (post- dilution)." }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.064
    kind: card
    topic: hf-hdf
    front: Pre-dilution or post-dilution haemofiltration; which clears more, and what is its drawback?
    back: Post-dilution clears solute more efficiently but fouls the membrane more easily because of haemoconcentration.
    src: { page: 302, quote: "In terms of solute clearance, post-dilution is more efficient than pre- dilution, but can lead more easily to membrane fouling due to hemoconcentration." }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.065
    kind: card
    topic: hf-hdf
    front: What is haemodiafiltration?
    back: Haemodialysis plus haemofiltration on high-flux membranes, removing solute by diffusion and convection; online haemodiafiltration uses dialysate made ultrapure by an endotoxin filter as substitution fluid (3–4 h sessions).
    src: { page: 303, quote: "Hemodiafiltration: (can be used intermittent online or chronic kidney replacement therapy(CKRT).it combines hemodialysis and hemofiltration, The mechanisms involved in solute removal are both diffusive and convective. This modality uses high-flux membranes, online hemodiafiltration with dual blood pumps, HD machine and online endotoxin filter for dialysate that will be used as substitusion fluid(3-4 h per session)or adequate amounts of commercially sterile solution for CKRT (and with special machine for CKRT) must be infused to replace the removed volume (pre-filter or post-filter) ." }
    status: unverified
  - id: neph.L09.066
