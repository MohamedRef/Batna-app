    kind: enumerate
    topic: adpkd-ckd
    prompt: Mention noninvasive measures for symptomatic polycystic liver disease.
    points:
      - Avoid excess alcohol and other hepatotoxins
      - Possibly avoid cAMP agonists such as caffeine
