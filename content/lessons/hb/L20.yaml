              - "Under 0.5 g/kg until she wakes up"
              - "Nothing by mouth or tube for a week"
            answer: 0
            why: "**Avoid protein restriction**، والاحتياجات زي أي cirrhotic (1.2–1.5 g/kg). التقليل هيكسّر عضلها ويزوّد الـ ammonia على المدى الطويل."
          - question: "By which route?"
            options:
              - "Nasogastric tube"
              - "Parenteral nutrition first"
              - "Oral diet despite the unsafe swallow"
            answer: 0
            why: "**Grade III–IV** ومش قادرة تاكل والـ **airway** محمي → **NG tube**. الـ parenteral لو الـ airway مش محمي. والـ NG tube مش ممنوع مع الـ non-bleeding varices (صفحة 418)."
      - kind: try
        items: [hb.L20.057, hb.L20.060, hb.L20.064, hb.L20.100, hb.L20.113]
    recap:
      - "أغلب مرشحين الـ LT عندهم نقص vitamin A و D. Vitamin D < 20 ng/ml → oral لحد 25(OH)D > 30."
      - "Ascites: ≈ 80 mmol Na/day = 2 g Na = 5 g ملح، وخلّي الأكل مستساغ. الـ hyponatraemia أكتر لما الصوديوم يقل والمية لأ."
      - "عضل أقل = ammonia أعلى، والـ ammonia بتضعّف العضل: **vicious circle** والـ HE أكتر في الـ malnourished."
      - "HE: نفس الـ energy والـ protein، **no restriction**، vegetable و dairy protein، BCAA."
