  - id: git.L03.121
    kind: enumerate
    topic: dyspepsia
    prompt: After deciding no further investigation is needed, what five steps follow in FD management?
    points:
      - Make a positive diagnosis of FD
      - Explain the condition in the context of the gut-brain axis
      - Discuss treatment options (drugs and psychological)
      - Consider previous treatments and preferences
      - Manage expectations and agree a follow-up plan (no cure; treatment aims at quality of life, often long term)
