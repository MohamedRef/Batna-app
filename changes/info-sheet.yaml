- kind: improved
  ar_eg: "شيت صفحة الكتاب بقى ليه لون مختلف عن الكروت، وتقدر تسحبه من فوق تكبّره أو تصغّره براحتك، أو تنزّله لتحت يتقفل. وبيفتكر الحجم اللي سبته عليه."
  en: "The book-page sheet has its own colour, and you can drag it to any height or down to close. It remembers the size you left it at."
