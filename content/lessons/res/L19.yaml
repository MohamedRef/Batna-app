  - kind: aside
    page: 17
    quote: |-
      Two Different Approaches to Evidence-Based Practice
      Clinical practice guidelines
      - "Top-down" approach
      - Tell clinicians how to practice
      - Favored by health care systems
      Evidence-based medicine
      - "Bottom-up" approach
      - Teach clinicians how to find answers
      - Favored by medical educators
    tone: analogy
    text: |-
      «لو اديت حد **سمكة** هياكل النهارده… لو علّمته **يصطاد**…»

      الـ **clinical practice guidelines** (top-down) = السمكة الجاهزة: بتقولك تعمل إيه. الـ **evidence-based medicine** (bottom-up) = إنك تتعلم ==find answers== بنفسك لأي سؤال جديد.
  - kind: explain
    page: 20
    quote: |-
      Information Mastery
      Is the search for sources of information that are high in relevance and validity and low in work.
      Usefulness of medical Information = Relevance x validity / Work
      Relevance: refers to extent to which the research paper matches your information need for care of your patient.
    title: Information mastery
    text: |-
      الدكتور المزنوق في الوقت والغرقان في المعلومات (information overload) محتاج ==information mastery==: يدوّر على مصادر **relevance** و**validity** عاليين و**work** قليل.

      **Usefulness = (relevance × validity) ÷ work**

      - **Relevance**: البحث بيجاوب على احتياجك لرعاية مريضك قد إيه.
      - مصدر صحيح بس مش relevant، أو محتاج شغل كتير جدًا، فايدته بتقل.
  - kind: check
    page: 20
    quote: |-
      Information Mastery
      Is the search for sources of information that are high in relevance and validity and low in work.
      Usefulness of medical Information = Relevance x validity / Work
      Relevance: refers to extent to which the research paper matches your information need for care of your patient.
    question: Which source is the most useful by the information mastery equation?
    options:
    - A valid synopsis that answers your exact patient question in 2 minutes
    - A valid 40-page trial unrelated to your patient
    - A quick blog post with no methods
    - A huge textbook chapter that takes hours to find the answer
    answer: 0
    why:
    - relevance عالي × validity عالي ÷ work قليل = أعلى usefulness.
    - valid بس relevance ضعيفة، فالبسط صغير.
    - work قليل بس الـ validity مش معروفة.
    - الـ work كبير جدًا فالكسر يصغر.
