        quote: "A stool sample should be collected to test for Shiga toxin whenever diarrhea is present. The results may not be positive for the Shiga toxin if it has been cleared or is avidly bound to the endothelium. If clinically indicated, testing for the presence of S dysenteriae and S pneumonia should also be performed."
        text: |
          - **Stool Shiga toxin** لو فيه إسهال. بس ممكن يطلع **سلبي** لو التوكسين ==cleared or is avidly bound to the endothelium==، يعني الإسهال خلص أو التوكسين لزق في الأوعية. فالسلبي مش بيستبعد.
          - **S. dysenteriae** و **S. pneumoniae** لو الصورة بتقول كده.
          - **Complement واطي:** ==suggestive of, but not specific to aHUS== لأن الـ typical كمان بيلعب في الـ complement (factor H).
          - **Electrolytes:** hyponatremia و hyperkalemia من الـ AKI.
          - **Genetic testing** للـ aHUS.
          - **ADAMTS13** ==to rule out TTP==.
          - **PT و aPTT و D-dimer و FDP** عاليين = **DIC**. التفسير المقبول (مش في الكتاب): في الـ DIC الـ clotting factors نفسها بتتاكل، في الـ HUS لأ.

          والترتيب العملي: أول ما تشوف schistocytes وصفايح واطية، اطلب ADAMTS13 قبل أي plasma (عشان الـ plasma هيعلّي الرقم ويبوّظ التحليل، وده التفسير المقبول، مش في الكتاب)، وابعت الـ stool، وشوف الـ coagulation عشان الـ DIC.
