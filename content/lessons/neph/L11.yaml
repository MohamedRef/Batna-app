  - id: neph.L11.lesson2
    title: "الرباعي الخطير: preeclampsia و HELLP و AFLP و TMA"
    hook: "4 أمراض بتلبس نفس اللبس: ضغط، صفائح واطية، إنزيمات كبد عالية. إزاي تفرقهم وكل واحد علاجه إيه؟"
    minutes: 9
    pages: [356, 359]
    topics: [preeclampsia, hellp, aflp, tma]
    goals:
      - "تحفظ تعريف الـ preeclampsia والـ severe features بالأرقام"
      - "تفرّق HELLP عن AFLP عن TTP و aHUS"
      - "تعرف مين بيتعالج بالولادة ومين بالـ plasma exchange"
    status: unverified
    steps:
      - kind: explain
        page: 356
        title: "الـ preeclampsia بالأرقام"
        quote: "Preeclampsia affects 5–8% of pregnancies and accounts for 15–20% of pregnancy- related AKI. Diagnosis of preeclampsia is made by the new onset of hypertension after 20 weeks of gestation in a previously normotensive woman. Hypertension is defined by blood pressure ≥ 140/90 mm Hg on two occasions 4 hours apart, or ≥160/110 mm Hg within a shorter interval, and proteinuria ≥ 300-mg/24-hour urine or spot urine protein creatinine ratio 0.3g (dipstick 1+). Of note, preeclampsia can be diagnosed in the absence of proteinuria if any of the following signs of end-organ dysfunction are present: elevated serum creatinine > 1.1 mg/dl or doubling of serum creatinine in the absence of other kidney disease, thrombocytopenia (<100,000/microliter), elevated liver transaminases ≥ two times normal, pulmonary edema or, cerebral/visual symptoms. A subset of patients, about 40–50% will experience preeclampsia with severe features, which is defined as systolic blood ≥160 mmHg or diastolic blood pressure ≥110 mmHg and proteinuria or systolic blood pressure ≥140 mm Hg systolic or diastolic blood pressure of ≥90 mmHg with or without proteinuria but with the presence of end-organ dysfunction."
        text: |
          ضغط **جديد** بعد ==20 weeks== في واحدة كان ضغطها طبيعي:
          - **blood pressure (BP) ≥140/90** مرتين بينهم 4 ساعات، أو **≥160/110** في وقت أقصر.
          - **Proteinuria ≥300 mg/24 h**، أو PCR **0.3**، أو dipstick **1+**.

          بتصيب **5-8%** من الحوامل، وبتعمل ==15-20%== من الـ acute kidney injury (AKI) في الحمل.
      - kind: explain
        page: 356
        title: "من غير بروتين؟ ينفع"
        quote: "Preeclampsia affects 5–8% of pregnancies and accounts for 15–20% of pregnancy- related AKI. Diagnosis of preeclampsia is made by the new onset of hypertension after 20 weeks of gestation in a previously normotensive woman. Hypertension is defined by blood pressure ≥ 140/90 mm Hg on two occasions 4 hours apart, or ≥160/110 mm Hg within a shorter interval, and proteinuria ≥ 300-mg/24-hour urine or spot urine protein creatinine ratio 0.3g (dipstick 1+). Of note, preeclampsia can be diagnosed in the absence of proteinuria if any of the following signs of end-organ dysfunction are present: elevated serum creatinine > 1.1 mg/dl or doubling of serum creatinine in the absence of other kidney disease, thrombocytopenia (<100,000/microliter), elevated liver transaminases ≥ two times normal, pulmonary edema or, cerebral/visual symptoms. A subset of patients, about 40–50% will experience preeclampsia with severe features, which is defined as systolic blood ≥160 mmHg or diastolic blood pressure ≥110 mmHg and proteinuria or systolic blood pressure ≥140 mm Hg systolic or diastolic blood pressure of ≥90 mmHg with or without proteinuria but with the presence of end-organ dysfunction."
        text: |
          لو مفيش proteinuria، الـ ==end-organ dysfunction== يكفي:
          - **Creatinine >1.1 mg/dL** أو اتضاعف.
          - **Platelets <100,000/µL**.
          - **Transaminases ≥2×** الطبيعي.
          - **Pulmonary edema**.
          - أعراض **مخ أو نظر**.

          والـ ==severe features== (حوالي 40-50%): **≥160/110** مع proteinuria، أو ≥140/90 مع end-organ dysfunction.
