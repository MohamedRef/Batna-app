    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.169
    kind: enumerate
    topic: alport
    prompt: Mention the management of Alport syndrome.
    points:
      - No specific treatment
      - Early BP control, ACEI or ARB, and proteinuria reduction (including female carriers)
      - Screen family members for hematuria and raised BP
      - Genetic counselling
    pass: 3
    src: { page: 185, quote: "No specific treatment for Alport syndrome. As with all progressive nephropathies, good control of BP, use of ACE-I/ARB" }
