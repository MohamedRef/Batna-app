        title: "الـ Asymptomatic: الأغلبية الصامتة"
        quote: "Presented by chronic complications (10-20% of cases): Macrosomic baby, PN. and premature atherosclerosis."
        text: |
          ناس كتير بـ **type 2** و **impaired glucose tolerance (IGT)** و **gestational diabetes mellitus (GDM)** مالهمش أعراض. الأسباب: **primary DM (غالبًا type 2)**، **prediabetes**، **GDM**.

          بيتكشف إزاي؟
          - **بالصدفة:** glycosuria أو تحليل روتيني.
          - **بالمضاعفات (==10–20%==):** macrosomic baby، peripheral neuropathy، premature atherosclerosis.

          ليه حد يتشخّص بمضاعفة قبل السكر نفسه؟ لأن السكر لو تحت الـ renal threshold مش بيعمل أعراض، فبيفضل سنين شغال في السر على الأعصاب والشرايين. والـ **macrosomic baby** معناه إن سكر الأم العالي عدّى للجنين فكبر زيادة.
      - kind: explain
        remind: [dm.L01.051]
        page: 8
        title: "علامات تدوّر عليها في الكشف"
        quote: "In type 2 DM, this depends on the mode of presentation:\n  1- Pruritus vulvae or balanitis is common.\n  2- Loss of ankle reflexes.\n  3- Loss of Peripheral sensation.\n  4- Hypertension and signs of atherosclerosis (weak pulsation of dorsalis pedis artery, bruit over the carotid).\n  5- Signs of insulin resistance e.g. Acanthosis Nigricans or Polycystic ovary syndrome."
        text: |
          في الـ **type 2** اللي من غير أعراض:
          1. **Pruritus vulvae** أو **balanitis** (السكر في البول بيأكّل الفطريات).
          2. **Loss of ankle reflexes**.
          3. **Loss of peripheral sensation**.
          4. **Hypertension** وعلامات atherosclerosis: dorsalis pedis ضعيف، **carotid bruit**.
          5. علامات ==insulin resistance==: **acanthosis nigricans**، **polycystic ovary syndrome (PCOS)**.

          اقرا القايمة كمضاعفات صامتة: 2 و 3 neuropathy، و 4 macrovascular disease. والتفسير المقبول (مش في الكتاب): الـ **ankle reflex** أول واحد يروح لأن أطول الأعصاب (من الضهر للرجل) هي أول اللي بتتأذي. والـ acanthosis لأن الـ insulin العالي بيحفّز خلايا الجلد تتكاثر فتبقى غامقة ومخملية في الرقبة والإبط.
      - kind: case
        page: 8
        quote: "In type 2 DM, this depends on the mode of presentation:\n  1- Pruritus vulvae or balanitis is common.\n  2- Loss of ankle reflexes.\n  3- Loss of Peripheral sensation.\n  4- Hypertension and signs of atherosclerosis (weak pulsation of dorsalis pedis artery, bruit over the carotid).\n  5- Signs of insulin resistance e.g. Acanthosis Nigricans or Polycystic ovary syndrome."
        stem: "55-year-old obese woman, recurrent vulval itching. Dark velvety neck skin. Absent ankle jerks."
        steps:
          - question: "Most likely underlying problem?"
            options: ["Type 2 diabetes, found through its signs", "Type 1 diabetes, found through ketosis", "Renal glycosuria with a normal blood glucose", "Diabetes insipidus with dilute urine"]
            answer: 0
            why: "**Pruritus vulvae** + **acanthosis nigricans** + **loss of ankle reflexes** = type 2 جاي asymptomatic. الـ type 1 صغير ونحيف و acute، والـ renal glycosuria سكره طبيعي ومفيش neuropathy."
          - question: "The neck sign tells you about what?"
            options: ["Insulin resistance", "Iron overload", "Hypothyroidism", "Vitamin B12 deficiency"]
            answer: 0
            why: "الكتاب حاطط **acanthosis nigricans** و **PCOS** تحت signs of insulin resistance."
