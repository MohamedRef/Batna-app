              - "Hepatocellular (R > 5)"
              - "Mixed (R 2–5)"
              - "Cholestatic (R < 2)"
            answer: 0
            why: "ALT = 19×، ALP ≈ 1.17×، فـ R ≈ 16: **hepatocellular**."
          - question: "First work-up per the book's workflow?"
            options:
              - "Abdominal ultrasound and hepatitis A, B, C and E"
              - "MRCP first"
              - "Liver biopsy first"
              - "Nothing; just stop the drug"
            answer: 0
            why: "الـ R ≥ 2 بيبدأ بـ **ultrasound + hepatitis A, B, C, E**، وبعدين الأسباب التانية."
          - reveal: "Viral markers are negative and the ultrasound is normal. The drug is stopped. ALT is 360 U/L at 2 weeks and 35 U/L at 4 weeks."
            question: "How do you read this course?"
            options:
              - "Positive dechallenge: supports DILI"
              - "Too slow: argues against DILI"
              - "Typical of cholestatic injury"
              - "Means a second drug is to blame"
            answer: 0
            why: "نزل **أكتر من 50%** في أسبوعين و **طبيعي في 4**: ده تعريف الـ positive dechallenge في الـ hepatocellular."
      - kind: explain
        page: 130
        title: "علامات بره الكبد"
        text: |
          **Extrahepatic manifestations**:

          - **Hypersensitivity reactions**: fever، rash، arthralgias، eosinophilia (نفس الـ **FARE** من الدرس اللي فات).
          - **Unique clinical syndromes**.
