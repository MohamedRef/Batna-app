items:
- id: hb.L10.001
  kind: card
  topic: overview
  front: Three defining features of ALF?
  back: Hepatic encephalopathy, coagulopathy and jaundice, in a patient without underlying liver disease.
  src:
    page: 172
    quote: "The defining features of ALF are hepatic encephalopathy, coagulopathy, and jaundice in patients without underlying liver disease."
  status: unverified
  tags:
  - high-yield
- id: hb.L10.002
  kind: card
  topic: overview
  front: What defines the subtypes of ALF?
  back: The jaundice-to-encephalopathy time interval.
  src:
    page: 172
    quote: "The jaundice-to- encephalopathy time interval defines the subtypes and presentations of ALF."
  status: unverified
- id: hb.L10.003
  kind: cloze
  topic: overview
  text: 'Leading causes of ALF in the US and Europe: {{c1::drug-induced liver injury and acetaminophen}}. In developing
    countries: {{c2::acute viral hepatitis}}.'
  src:
    page: 172
    quote: "Drug-induced liver injury and acetaminophen hepatotoxicity are the leading causes of ALF in the United States and Europe."
  status: unverified
  tags:
  - high-yield
- id: hb.L10.004
  kind: cloze
  topic: overview
  text: The commonest causes of death in ALF are {{c1::cerebral edema}} and {{c2::sepsis}}.
  src:
    page: 172
    quote: "Cerebral edema and sepsis are common causes of death in patients with ALF."
  status: unverified
  tags:
  - high-yield
- id: hb.L10.005
  kind: card
  topic: overview
  front: Strongest predictor of survival in ALF?
  back: The cause (etiology) of ALF.
  src:
    page: 172
    quote: The cause of ALF is the strongest predictor of survival
  status: unverified
- id: hb.L10.006
  kind: enumerate
  topic: overview
  prompt: Three pillars of ALF treatment.
  points:
  - ICU monitoring
  - Specific therapy according to the cause
  - Aggressive treatment of complications
  pass: 3
  src:
    page: 172
    quote: "implementation of specific therapies based on cause, and aggressive treatment of complications."
  status: unverified
- id: hb.L10.007
  kind: card
  topic: overview
  front: What should happen to an ALF patient who could be a transplant candidate?
  back: Prompt referral to a liver transplant center.
  src:
    page: 172
    quote: "Patients with ALF who are potential transplant candidates should be promptly referred to a liver transplant center."
  status: unverified
- id: hb.L10.008
  kind: table
  topic: overview
  title: Prognosis of ALF by cause (pp. 173, 176)
  columns:
  - Cause
  - Prognosis
  rows:
  - - Acetaminophen
    - Better (spontaneous recovery >50%)
  - - Acute viral hepatitis (e.g. HAV)
    - Better (spontaneous recovery >50% for HAV)
  - - Wilson disease
    - Particularly poor (emergency LT)
  - - Drugs other than acetaminophen
    - Particularly poor
  blanks:
  - - 0
    - 1
  - - 2
    - 1
  - - 3
    - 1
  src:
    page: 173
    quote: "whilst the prognosis associated with Wilson disease and drugs other than acetaminophen is particularly poor."
  status: unverified
- id: hb.L10.009
  kind: card
  topic: definition
  front: What is acute liver injury (ALI), the step before ALF?
  back: Acute liver damage (2–3-fold rise of transaminases) with impaired function (jaundice and coagulopathy),
    usually before encephalopathy, in a patient without chronic liver disease.
  src:
    page: 173
    quote: "associated with impaired liver function (i.e., jaundice and coagulopathy) which usually precedes clinical encephalopathy in a patient without a chronic"
  status: unverified
- id: hb.L10.010
  kind: card
  topic: definition
  front: Trey and Davidson (1970) definition of fulminant liver failure?
  back: A potentially reversible condition from severe liver injury with hepatic encephalopathy within 8 weeks of
    the first symptoms, without pre-existing liver disease.
  src:
    page: 173
    quote: onset of hepatic encephalopathy (HE) within 8 weeks of the appearance of the first symptoms
  status: unverified
- id: hb.L10.011
  kind: table
  topic: definition
  title: 1993 classification (time from jaundice to encephalopathy)
  columns:
  - Type
  - Jaundice → HE
  rows:
  - - Hyperacute liver failure
    - Within 7 days
  - - Acute liver failure
    - 8–28 days
  - - Subacute liver failure
    - 5–12 weeks
  - - Chronic liver disease
    - '>28 weeks before encephalopathy'
  blanks:
  - - 0
    - 1
  - - 1
    - 1
  - - 2
    - 1
  - - 3
    - 1
  src:
    page: 173
    quote: "and subacute liver failure describes HE occurring within 5 to 12 weeks of jaundice."
  status: unverified
  tags:
  - numbers
  - high-yield
  update:
    text: AASLD defines ALF as illness of <26 weeks' duration; the book's cut-off is 28 weeks.
    ref: 'AASLD position paper: management of acute liver failure, update 2011'
- id: hb.L10.012
  kind: table
  topic: definition
  title: IASL 1999 classification
  columns:
  - Type
  - Interval
  rows:
  - - Hyperacute ALF
    - <10 days
  - - Fulminant ALF
    - 10–30 days
  - - Subacute ALF
    - 5–24 weeks
  blanks:
  - - 0
    - 1
  - - 1
    - 1
  - - 2
    - 1
  src:
    page: 173
    quote: "fulminant ALF as 10 days to 30 days and subacute ALF as 5 to 24 weeks."
  status: unverified
  tags:
  - numbers
- id: hb.L10.013
  kind: mcq
  topic: definition
  stem: 'A 24-year-old develops jaundice and, 20 days later, confusion. INR 3.1. No prior liver disease. Under the
    1993 classification this is:'
  options:
  - Hyperacute liver failure
  - Acute liver failure
  - Subacute liver failure
  - Chronic liver disease
  - Acute liver injury without failure
  answer: 1
  why:
  - Hyperacute is HE within 7 days of jaundice.
  - 'Correct: HE 8–28 days after jaundice.'
  - Subacute is HE at 5–12 weeks.
  - Chronic disease is >28 weeks before HE.
  - Encephalopathy is present, so this is failure, not injury.
  src:
    page: 173
    quote: "and subacute liver failure describes HE occurring within 5 to 12 weeks of jaundice."
  status: unverified
  tags:
  - high-yield
- id: hb.L10.014
  kind: table
  topic: presentation
  title: Hyperacute vs subacute ALF
  columns:
  - Feature
  - Hyperacute
  - Subacute
  rows:
  - - Transaminases
    - Markedly raised
    - Milder rise
  - - Bilirubin / jaundice
    - Moderate rise at most, initially
    - Deep jaundice
  - - Coagulopathy
    - Severe
    - Mild to moderate
  - - Other findings
    - Significant extra-hepatic organ failure
    - Splenomegaly, ascites, shrinking liver
  - - Spontaneous recovery
    - Much greater chance
    - Very low once HE develops
  blanks:
  - - 0
    - 1
  - - 0
    - 2
  - - 1
    - 2
  - - 2
    - 1
  - - 3
    - 2
  - - 4
    - 1
  - - 4
    - 2
  src:
    page: 173
    quote: "In contrast, subacute presentations often have a milder increase in serum transaminases, deep jaundice and mild to moderate coagulopathy."
  status: unverified
  tags:
  - high-yield
- id: hb.L10.015
  kind: card
  topic: presentation
  front: Are transaminases a fully reliable diagnostic parameter in ALF?
  back: No, the book says they may not be fully reliable for diagnosis.
  src:
    page: 174
    quote: "a fully reliable parameter for diagnosis."
  status: unverified
- id: hb.L10.016
  kind: mcq
  topic: presentation
  stem: A 50-year-old has 8 weeks of deepening jaundice, new ascites, mild splenomegaly and a shrinking liver on
    CT; ALT 450 U/L, INR 1.9, and new grade 1 HE. No known liver disease. Which statement is true?
  options:
  - He has a good chance of spontaneous recovery
  - This is a hyperacute presentation
  - Once HE develops in subacute ALF, spontaneous survival is very unlikely
  - Ascites and splenomegaly exclude ALF
  - Transplant referral can wait for grade 3 HE
  answer: 2
  why:
  - Hyperacute disease recovers more often; subacute does poorly.
  - Mild transaminases, deep jaundice and ascites over 8 weeks are subacute.
  - 'Correct: in subacute ALF, HE comes late and survival without LT is very low.'
  - Subacute ALF often has splenomegaly, ascites and a shrinking liver.
  - In subacute ALF even low-grade HE indicates extremely poor prognosis; act now.
  src:
    page: 174
    quote: "Once HE develops, these patients have a very low chance of spontaneous survival."
  status: unverified
  tags:
  - high-yield
- id: hb.L10.017
  kind: cloze
  topic: presentation
  text: The coagulopathy defining ALF is a prolonged PT or an INR usually {{c1::>1.5}}.
  src:
    page: 174
    quote: "usually >1.5, although it could be argued that a greater prolongation of INR should be required to define ALF."
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L10.018
  kind: card
  topic: presentation
  front: Why do many clinicians prefer the PT (against the local lab range) to the INR in ALF?
  back: The INR is not standardized for liver disease, so PT against the laboratory's normal range is more accurate.
  src:
    page: 174
    quote: "as a more accurate marker many clinicians would now suggest prolongation of PT in the context of the normal range"
  status: unverified
- id: hb.L10.019
  kind: card
  topic: presentation
  front: Why should mental status be actively examined in acute hepatitis?
  back: Early mental changes may be subtle, and encephalopathy is a defining and ominous feature.
  src:
    page: 174
    quote: "Initial mental alterations may be subtle and therefore should be actively sought."
  status: unverified
- id: hb.L10.020
  kind: card
  topic: presentation
  front: 'Subacute liver failure with a shrinking liver: what do recent proposals allow?'
  back: Super-urgent listing in the right clinical context, even without clinically clear encephalopathy.
  src:
    page: 174
    quote: "Recent proposals suggest that in an appropriate clinical context accompanied by a shrinking liver volume"
  status: unverified
- id: hb.L10.021
  kind: card
  topic: presentation
  front: Prerequisite about prior liver disease in defining ALF?
  back: Absence of previous severe fibrotic or cirrhotic chronic liver disease.
  src:
    page: 175
    quote: "Another prerequisite for defining cases of ALF is the absence of previous severe fibrotic or cirrhotic chronic liver disease."
  status: unverified
- id: hb.L10.022
  kind: enumerate
  topic: presentation
  prompt: 'Exceptions: conditions counted as ALF despite possible underlying chronic disease.'
  points:
  - Acute de novo presentation of autoimmune hepatitis
  - Budd-Chiari syndrome
  - Wilson disease (even with clear chronic disease and splenomegaly)
  pass: 3
  src:
    page: 175
    quote: "Specific exceptions are the acute de novo presentation of autoimmune hepatitis and Budd-Chiari syndrome."
  status: unverified
  tags:
  - high-yield
- id: hb.L10.023
  kind: card
  topic: presentation
  front: Why is fulminant Wilson disease counted as ALF despite chronic disease?
  back: It shares the poor prognosis and clinical picture of acute liver failure, with significant coagulopathy
    and encephalopathy.
  src:
    page: 175
    quote: "a common clinical picture of acute failure of the liver, and present with significant coagulopathy and encephalopathy."
  status: unverified
- id: hb.L10.024
  kind: card
  topic: presentation
  front: A patient with fatty liver or HBV/HCV but no overt fibrosis develops severe ALI with HE. ALF or not?
  back: Normally categorized as ALF, if ultrasound and axial imaging show no overt fibrosis or portal hypertension.
  src:
    page: 175
    quote: "supported by ultrasound and axial imaging of no overt fibrosis or portal hypertension, these patients would normally be categorized as"
  status: unverified
- id: hb.L10.025
  kind: table
  topic: etiology
  title: Causes of ALF and their presentation
  columns:
  - Precipitant
  - Examples
  - Presentation
  rows:
  - - Infections
    - HAV, HEV, HBV, CMV, HSV, VZV
    - Acute
  - - Drugs/toxins (acute ALF)
    - Acetaminophen, Amanita phalloides, phosphorus
    - Acute
  - - Drugs (acute and subacute ALF)
    - Anti-TB drugs, chemotherapy, statins, NSAIDs, phenytoin, valproate, carbamazepine, ecstasy, flucloxacillin
    - Acute and subacute
  - - 'Vascular: Budd-Chiari'
    - Budd-Chiari syndrome
    - Acute and subacute
  - - 'Vascular: hypoxic'
    - Hypoxic hepatitis
    - Acute
  - - Pregnancy-related
    - Acute fatty liver of pregnancy, HELLP, pre-eclamptic hepatic rupture
    - Acute
  - - Others
    - Wilson disease, autoimmune liver disease, lymphoma, malignancy, HLH
    - Acute and subacute
  blanks:
  - - 0
    - 1
  - - 1
    - 1
  - - 2
    - 2
  - - 3
    - 2
  - - 5
    - 1
  - - 6
    - 1
  src:
    page: 176
    quote: "Phenytoin, Valproate, Carbamazepine, Ecstasy, Flucloxacillin Vascular Diseases Budd-Chiari syndrome Acute and subacute ALF Hypoxic hepatitis Acute ALF Pregnancy-related Fatty liver"
  status: unverified
- id: hb.L10.026
  kind: enumerate
  topic: etiology
  prompt: Viral causes of ALF listed in the lecture.
  points:
  - Hepatitis A
  - Hepatitis E
  - Hepatitis B
  - Cytomegalovirus
  - Herpes simplex virus
  - Varicella zoster virus
  pass: 4
  src:
    page: 176
    quote: "Hepatitis B virus, Cytomegalovirus, Herpes Simplex virus, Varicella Zoster virus Drugs/Toxins Acetaminophen, Amanita Acute ALF phalloides"
  status: unverified
- id: hb.L10.027
  kind: enumerate
  topic: etiology
  prompt: Drugs causing acute and subacute ALF.
  points:
  - Anti-tuberculous drugs
  - Chemotherapeutic drugs
  - Statins
  - NSAIDs
  - Phenytoin
  - Valproate
  - Carbamazepine
  - Ecstasy
  - Flucloxacillin
  pass: 5
  src:
    page: 176
    quote: "Anti-tuberculous drugs, Chemotherapeutic drugs, Statins, Non-steroidal anti- inflammatory drugs, Phenytoin, Valproate, Carbamazepine, Ecstasy, Flucloxacillin"
  status: unverified
- id: hb.L10.028
  kind: cloze
  topic: etiology
  text: 'Toxins causing ALF besides acetaminophen: {{c1::Amanita phalloides}} (mushroom) and {{c2::phosphorus}}.'
  src:
    page: 176
    quote: "Varicella Zoster virus Drugs/Toxins Acetaminophen, Amanita Acute ALF phalloides, phosphorus"
  status: unverified
- id: hb.L10.029
  kind: card
  topic: etiology
  front: Two reasons to determine the cause of ALF?
  back: 1. Specific therapy may exist (e.g. acetaminophen, herpes hepatitis). 2. Prognosis differs by cause.
  src:
    page: 176
    quote: "specific therapy may be available, as for acetaminophen hepatotoxicity or herpes hepatitis, and the prognosis differs depending on the cause."
  status: unverified
- id: hb.L10.030
  kind: cloze
  topic: etiology
  text: Spontaneous recovery from ALF due to acetaminophen or hepatitis A is {{c1::more than 50%}}, so be {{c2::cautious}}
    before transplant; in Wilson disease recovery is {{c3::unusual}}.
  src:
    page: 176
    quote: "In comparison, spontaneous recovery from ALF due to Wilson disease is unusual and emergency liver transplantation would be recommended."
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L10.031
  kind: enumerate
  topic: etiology
  prompt: Most common identifiable causes of ALF in the US.
  points:
  - Acetaminophen hepatotoxicity
  - Idiosyncratic drug reactions
  - Wilson disease
  - Hepatitis B
  - Ischemia
  pass: 4
  src:
    page: 176
    quote: "In the US, the most common identifiable causes are acetaminophen hepatotoxicity, idiosyncratic drug reactions, Wilson disease, hepatitis B, and ischemia."
  status: unverified
- id: hb.L10.032
  kind: card
  topic: etiology
  front: Why take the history promptly in ALF, and what must it include?
  back: Before mental status declines. It must cover prescription and non-prescription drugs, illicit substances
    and alcohol, which bear on transplant candidacy.
  src:
    page: 177
    quote: "A history of prescription and nonprescription drugs, use of illicit substances, and alcohol use is important in making a decision"
  status: unverified
- id: hb.L10.033
  kind: card
  topic: etiology
  front: 'Cause of ALF unknown after history and blood tests: next step?'
  back: Liver biopsy, preferably transjugular, to exclude malignancy and autoimmune liver disease.
  src:
    page: 177
    quote: "a liver biopsy, preferably through a trans-jugular route, can be considered to exclude malignancy and autoimmune liver diseases."
  status: unverified
- id: hb.L10.034
  kind: card
  topic: clinical
  front: Usual presenting symptoms of ALF?
  back: 'Those of acute hepatitis: malaise, nausea and jaundice.'
  src:
    page: 177
    quote: "The presenting symptoms of patients with ALF are usually those of acute hepatitis, including malaise, nausea, and jaundice."
  status: unverified
- id: hb.L10.035
  kind: card
  topic: clinical
  front: Range of encephalopathy in ALF?
  back: From subtle changes such as poor concentration, to coma. HE is a required feature.
  src:
    page: 177
    quote: "HE is a required feature of the syndrome, and manifestations may range from subtle mental status changes"
  status: unverified
- id: hb.L10.036
  kind: cloze
  topic: clinical
  text: Aminotransferases in ALF are usually {{c1::>1,000 U/L}}; acetaminophen usually gives ALT {{c2::>3,500 U/L}}.
  src:
    page: 177
    quote: "Acetaminophen hepatotoxicity usually causes ALT to be more than 3,500 U/L."
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L10.037
  kind: card
  topic: clinical
  front: Typical labs of fulminant Wilson disease?
  back: Only modest aminotransferase rise and a low or normal ALP, despite prolonged PT and high bilirubin.
  src:
    page: 177
    quote: "Fulminant Wilson disease is characterized by only modest increases in aminotransferase levels and a low or normal ALP level despite"
  status: unverified
  tags:
  - high-yield
- id: hb.L10.038
  kind: card
  topic: clinical
  front: How does the encephalopathy of ALF differ from that of chronic liver disease?
  back: It tends to progress to cerebral edema.
  src:
    page: 177
    quote: "The encephalopathy associated with ALF, unlike that of chronic liver disease, has a propensity to progress to cerebral edema."
  status: unverified
- id: hb.L10.039
  kind: card
  topic: clinical
  front: Proposed mechanisms of cerebral edema in ALF?
  back: Disruption of the blood-brain barrier and interference with cellular osmolality mechanisms.
  src:
    page: 177
    quote: "The mechanisms for the development of cerebral edema have not been clarified but may involve disruption of the blood-brain barrier"
  status: unverified
- id: hb.L10.040
  kind: cloze
  topic: clinical
  text: Ammonia above {{c1::150 µmol/L}} is linked to raised ICP and poor outcome in ALF.
  src:
    page: 177
    quote: "Ammonia levels of more than 150 μmol/L have been associated with increased intracranial pressure (ICP) and a poor outcome."
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L10.041
  kind: card
  topic: clinical
  front: How does cerebral edema kill in ALF?
  back: Through brain ischemia and cerebral herniation.
  src:
    page: 178
    quote: "Cerebral edema leads to death by causing brain ischemia and cerebral herniation."
  status: unverified
- id: hb.L10.042
  kind: card
  topic: clinical
  front: Why is infection easy to miss in ALF, and what follows?
  back: Fever and leukocytosis may be absent. Any deterioration mandates a search for infection, with a low threshold
    for antimicrobials.
  src:
    page: 178
    quote: "Any clinical deterioration should mandate a search for infection, and the threshold for antimicrobial therapy should be low."
  status: unverified
- id: hb.L10.043
  kind: card
  topic: clinical
  front: Why is hypoglycemia common in ALF, and what does it mean?
  back: Poor insulin degradation and reduced hepatic glucose production. It is a poor prognostic sign.
  src:
    page: 178
    quote: "It is likely due to both inadequate degradation of insulin and diminished production of glucose by the diseased liver."
  status: unverified
- id: hb.L10.044
  kind: card
  topic: clinical
  front: Circulatory picture in ALF?
  back: Hyperdynamic circulation with low systemic vascular resistance; it can mimic SIRS and sepsis.
  src:
    page: 178
    quote: "A hyperdynamic circulation and a decrease in systemic vascular resistance are seen in patients with ALF."
  status: unverified
- id: hb.L10.045
  kind: enumerate
  topic: clinical
  prompt: Causes of kidney dysfunction in ALF.
  points:
  - The underlying disease (e.g. Wilson disease)
  - 'Functional: sepsis or hepatorenal syndrome'
  - Acute tubular necrosis
  pass: 3
  src:
    page: 178
    quote: "functional renal impairment due to sepsis or hepatorenal syndrome, or acute tubular necrosis."
  status: unverified
- id: hb.L10.046
  kind: card
  topic: clinical
  front: In which cause of ALF is kidney dysfunction particularly common?
  back: Acetaminophen-induced ALF.
  src:
    page: 178
    quote: "Kidney dysfunction is particularly common in acetaminophen-induced ALF."
  status: unverified
- id: hb.L10.047
  kind: card
  topic: clinical
  front: Significance of acidosis in ALF?
  back: An indicator of poor outcome, used in some prognostic models.
  src:
    page: 178
    quote: "The presence of acidosis is an indicator for poor outcome in ALF and has been incorporated into some prognostic models."
  status: unverified
- id: hb.L10.048
  kind: mcq
  topic: clinical
  stem: A 19-year-old with jaundice, Coombs-negative hemolysis and confusion has ALT 180 U/L, ALP 20 U/L, bilirubin
    22 mg/dL and INR 3.4. Most likely cause?
  options:
  - Acetaminophen overdose
  - Fulminant Wilson disease
  - Acute hepatitis A
  - Ischemic hepatitis
  - Amanita poisoning
  answer: 1
  why:
  - Acetaminophen usually gives ALT >3,500 U/L.
  - 'Correct: modest aminotransferases and low/normal ALP despite liver failure is typical of fulminant Wilson.'
  - Viral ALF usually has transaminases >1,000.
  - Hypoxic hepatitis gives very high transaminases.
  - Toxin ALF gives marked transaminase rises.
  src:
    page: 177
    quote: "Fulminant Wilson disease is characterized by only modest increases in aminotransferase levels and a low or normal ALP level despite"
  status: unverified
  tags:
  - high-yield
- id: hb.L10.049
  kind: mcq
  topic: clinical
  stem: In ALF, which are the leading causes of death?
  options:
  - GI bleeding and renal failure
  - Cerebral edema and sepsis
  - Hypoglycemia and acidosis
  - Variceal bleeding and SBP
  - Hepatopulmonary syndrome
  answer: 1
  why:
  - Not the leading causes named in the lecture (cerebral edema and sepsis are).
  - 'Correct: cerebral edema and sepsis.'
  - Both are poor prognostic signs, not the leading causes of death.
  - These are complications of cirrhosis with portal hypertension.
  - Not discussed in the lecture.
  src:
    page: 178
    quote: "Cerebral edema and sepsis are the leading causes of death in patients having ALF."
  status: unverified
- id: hb.L10.050
  kind: card
  topic: care
  front: Why monitor mental status closely in severe acute hepatitis?
  back: HE precedes cerebral edema.
  src:
    page: 178
    quote: "The appearance of HE precedes development of cerebral edema; therefore, patients with severe acute hepatitis need to be monitored carefully"
  status: unverified
- id: hb.L10.051
  kind: card
  topic: care
  front: Lactulose and rifaximin in ALF encephalopathy?
  back: Lactulose is less effective than in chronic liver disease and may not prevent later cerebral edema, but
    is often given with monitoring. Rifaximin may be used; benefit unproven.
  src:
    page: 178
    quote: "Lactulose is less effective in encephalopathy associated with ALF compared with encephalopathy associated with chronic liver disease and may not"
  status: unverified
- id: hb.L10.052
  kind: cloze
  topic: care
  text: Patients with ALF and stage {{c1::2}} HE are usually admitted to ICU.
  src:
    page: 178
    quote: "Patients with stage 2 HE usually are admitted to an"
  status: unverified
  tags:
  - numbers
- id: hb.L10.053
  kind: card
  topic: care
  front: Why avoid sedatives early in ALF?
  back: To allow close monitoring of mental status.
  src:
    page: 179
    quote: "Sedatives should be avoided initially to allow close monitoring of mental status."
  status: unverified
- id: hb.L10.054
  kind: card
  topic: care
