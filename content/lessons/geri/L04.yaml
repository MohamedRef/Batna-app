            <text x="18" y="258" class="t-sm">+ TNFα, IL-1α, C1q</text>
            <text x="18" y="276" class="t-sm t-bad">A1 phenotype</text>
            <rect x="170" y="220" width="150" height="70" rx="8" class="fg-box"/>
            <text x="178" y="240" class="t-sm t-b">Microglia</text>
            <text x="178" y="258" class="t-sm">NLRP3 → cytokines</text>
            <text x="178" y="276" class="t-sm t-bad">more Aβ aggregation</text>
            <path d="M145 124L110 84" class="fg-arrow-bad" marker-end="url(#D04a)"/>
            <path d="M185 124L220 84" class="fg-arrow-bad" marker-end="url(#D04a)"/>
            <path d="M145 176L110 216" class="fg-arrow-bad" marker-end="url(#D04a)"/>
            <path d="M185 176L220 216" class="fg-arrow-bad" marker-end="url(#D04a)"/>
          </svg>
      - kind: reveal
        page: 56
        quote: "inhibition of long-term potentiation (LTP)"
        prompt: "ليه ضرب الـ LTP بيبان كنسيان للحاجات الجديدة بالذات؟"
        answer: "الـ Aβ لما يمسك في الـ synaptic receptors بيعمل **inhibition of long-term potentiation (LTP)**. التفسير المقبول (مش في الكتاب): الـ LTP هو تقوية الـ synapse لما تستعملها، ودي الطريقة اللي المخ بيثبّت بيها معلومة جديدة. فلو اتمنع، الجديد مايتسجلش، والقديم اللي اتسجل زمان يفضل. علشان كده الحاج فاكر فرحه من 50 سنة وناسي فطر إيه."
      - kind: explain
        page: 57
        quote: "Aβ blocks the reuptake of glutamate by excitatory amino acid transporter"
        title: "الـ glutamate المحبوس"
        text: |
          الـ Aβ بيقفل الـ ==excitatory amino acid transporter (EAAT)== اللي بيرجّع الـ **glutamate** من الـ synapse. النتيجة: glutamate بيتراكم بين الخلايا و**neuronal hyperactivity**.

          ليه ده بيموّت الخلية؟ التفسير المقبول (مش في الكتاب): الـ glutamate الزيادة بيفتح الـ **NMDA receptors** طول الوقت، فالكالسيوم يدخل بزيادة ويشغّل enzymes بتكسّر الخلية من جوه. يعني الخلية بتموت من «كتر الشغل» (excitotoxicity). وده سبب إن الـ **memantine** (NMDA antagonist) ليه مكان في العلاج.
      - kind: explain
        page: 57
        quote: "(3) Aβ and some pro-inflammatory cytokines (such as TNFα, IL-1α, and C1q) may induce the A1 phenotype of astrocytes. This transformation may involve altering astrocyte functions and modulating their interactions with other cells (such as neurons and microglia), thereby participating in processes such as Aβ deposition, neuroinflammation, synaptic loss, and neuronal death. (4) APOE, primarily released from astrocytes, associates with lipoproteins to form APOE-associated lipoprotein particles, which can bind to soluble Aβ and mediate its clearance."
        title: "الـ APOE: عامل النظافة"
        text: |
          الـ ==APOE== بيطلع أساسًا من الـ **astrocytes**، يمسك في lipoproteins ويكوّن particles بتمسك الـ **soluble Aβ** وتشيله (clearance).

          يعني لو الـ APOE نسخته وحشة (زي e4)، النظافة تقل والـ amyloid يتراكم.

          وليه الـ astrocytes بالذات؟ لأنها الخلايا اللي بتخدم الـ neurons وبتنضّف حواليها. ولما تتحوّل لـ **A1 phenotype** (بالـ Aβ مع TNFα وIL-1α وC1q)، بدل ما تحمي بتشارك في الـ Aβ deposition والـ neuroinflammation والـ synaptic loss والـ neuronal death.
      - kind: figure
        page: 57
        title: "الـ Aβ عند الـ synapse والـ astrocyte"
        image: { file: geri/L04-abeta-synapse.webp, book: true }
        alt: "The book's diagram of amyloid-beta effects at a synapse: the pre-synaptic terminal at the top with mitochondria, P-tau, amyloid-beta pores letting calcium in, and glutamate vesicles; the post-synaptic neuron at the bottom with AMPA, NMDA, mGluR5, PrPC and P75NTR receptors and five numbered outcomes ending in cell death; an astrocyte on the right with EAAT2 blocked by amyloid-beta, the glutamate cycle, ApoE particles clearing soluble amyloid-beta, and TLR4 and RAGE driving the NF-kB pathway to inflammation and cell death."
        caption: |
          رسمة الكتاب للأرقام (1) لـ (4) اللي في الكلام، تلات خلايا:

          - **فوق** (pre-synaptic): الـ **Aβ pores** بتدخّل كالسيوم، والـ mitochondria بتطلّع reactive oxygen species، والـ synaptic vesicles بتخلص (exhaustion of synaptic vesicle pools).
          - **تحت** (post-synaptic): الـ Aβ بيلزق في receptors كتير على سطح الخلية (أسماءهم مكتوبة عند الخط)، وبعدها 5 مربعات مترقّمة: P-tau، و ==calcium dyshomeostasis==، و **LTP↓** (الـ long-term potentiation بيقل)، و mitochondrial dysfunction، و oxidative stress، والآخر **cell death**.
          - **يمين** (Astrocyte): الـ Aβ ==بيقفل الـ glutamate transporter== فالـ glutamate يفضل في الـ synapse، و **apolipoprotein E** فوق بيلم الـ soluble Aβ وينضّفه، وتحت receptors الالتهاب ← NF-κB ← inflammation و cell death.

          اللي تاخده: نفس الـ Aβ بيضرب من 3 أماكن في نفس الوقت، وده ليه الـ apolipoprotein E (عامل النظافة) مهم.
      - kind: order
        page: 58
        quote: "This process promotes the assembly and activation of NLRP3, leading to the release of pro-inflammatory cytokines, which further exacerbate the aggregation of Aβ."
        prompt: "رتّب الحلقة المفرغة في الـ microglia:"
        steps:
          - "Aβ binds pattern recognition receptors"
          - "NLRP3 activates"
          - "Cytokines released"
          - "More Aβ aggregation"
        why: "دي vicious cycle: الـ Aβ بيشغّل الـ **NLRP3**، الـ cytokines تطلع، والـ cytokines نفسها تزوّد الـ aggregation فيرجع يشغّل الـ microglia أكتر."
      - kind: aside
        tone: analogy
        page: 58
        quote: "Microglia has numerous pattern recognition receptors that can bind to Aβ,"
        text: "تخيّل الـ microglia عسكري مطافي: شاف دخان (Aβ) فشغّل الإنذار (NLRP3) ورش ميه. بس الميه نفسها (الـ cytokines) بتبوّظ العفش، والدخان مابيخلصش، فيرش أكتر. ده معنى إن الـ cytokines **further exacerbate the aggregation of Aβ**: الحماية نفسها بقت جزء من المشكلة."
      - kind: explain
        page: 58
        quote: "This reduction may consequently impair the activation of microglial cells, thereby compromising their ability to clear amyloid plaques."
        title: "الـ TREM2"
        text: |
          الـ variant ==triggering receptor expressed on myeloid cells 2 (TREM2) R47H== ممكن يقلّل ربط الـ TREM2 بالـ APOE-Aβ والـ phospholipids.

          النتيجة: الـ **microglia** ماتتنشطش كويس، فـ **ability to clear amyloid plaques** تقل.

          ليه ده مهم؟ لأن الـ microglia هي الكنّاسين: لو الـ receptor بتاعها ضعيف، الزبالة (plaques) تفضل مكانها، وفي نفس الوقت الحريقة (NLRP3) شغّالة. يعني ضرر من الناحيتين.
      - kind: figure
        page: 58
        quote: "Potential molecular downstream pathways of Aβ on microglia"
        title: "الـ Aβ والـ microglia: TREM2 والـ inflammasome"
        image: { file: geri/L04-abeta-microglia.webp, book: true }
        alt: "The book's diagram of amyloid-beta pathways in microglia: on the left TLR4 with MyD88 and IRAK leads to NF-kB, which enters the nucleus to transcribe NLRP3, pro-IL-1 beta and pro-IL-18; CD36 binds amyloid-beta oligomers; in the middle TREM2 with DAP12 and SYK signals through LAT2 to RAF/MAPK, calcium signalling and PI3K-AKT with GSK3 beta and mTOR; on the right NLRP3 with ASC and caspase-1 forms the inflammasome, activates caspase-1 to make IL-1 beta and IL-18, and ASC specks are released to seed new amyloid-beta plaques at the top."
        caption: |
          رسمة الكتاب في ص 58، اقراها في دايرة:

          - **شمال**: **toll-like receptor 4** بيمسك الـ Aβ ← ==NF-κB== ينزل للـ nucleus (تحت) ويكتب NLRP3 و pro IL-1β و pro IL-18.
          - **في النص**: **TREM2**، وتحته signaling جوه الخلية لحد الـ mTOR. ده الـ receptor اللي الـ variant R47H بيضعّفه.
          - **يمين**: الـ NLRP3 مع caspase-1 بيعملوا ==inflammasome== ← active caspase-1 ← **IL-1β و IL-18**.
          - **فوق**: الـ inflammasome بيطلّع **specks** برّه، ودي بتعمل seeding لـ Aβ aggregates جديدة ← Aβ plaques.

          اللي تاخده: ده الحلقة المفرغة اللي في الدرس: Aβ ← inflammation ← Aβ أكتر، ولو الـ TREM2 ضعيف الـ microglia ما تعرفش تنضّف.
      - kind: explain
        page: 59
        quote: "c. Aberrant cholesterol metabolism."
        title: "الـ signaling pathways"
        text: |
          الكتاب بيعدّ 8 pathways:
          - **Neuroinflammatory** signaling.
          - **Lysosomal dysfunction** (V-ATPase acidification، lysosomal calcium).
          - ==Aberrant cholesterol metabolism==.
          - **Mitochondrial dysfunction**: طاقة أقل وoxidative stress أكتر.
          - **Calcium signaling**: الكالسيوم العالي يبوّظ الـ protein folding في الـ ER.
          - **Insulin** signaling و**neurotrophic** signaling.
          - **blood–brain barrier (BBB) dysfunction**: حاجات تدخل وتخرج من المخ غلط.

          ليه كلها بتوصل لنفس النهاية؟ التفسير المقبول (مش في الكتاب): الـ neuron خلية طويلة جدًا وبتصرف طاقة كتير، فأي عطل في الطاقة (mitochondria)، أو في التخلص من البروتين التالف (lysosome)، أو في الكالسيوم، بيموّتها أسرع من أي خلية تانية. والـ **BBB** لما تبوظ، حاجات من الدم تدخل المخ (الكتاب: abnormal entry and exit) فتزوّد الالتهاب والتلف.
      - kind: aside
