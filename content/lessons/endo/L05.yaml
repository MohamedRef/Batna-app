      - kind: explain
        page: 87
        quote: "Emerging Targets\n  mTOR.\n  PI3K.\n  VEGF inhibitors.\n  Other antiangiogenic agents.\nHigh potential for combination therapies."
        title: "ليه الـ targeted therapy بتنفع هنا؟"
        text: |
          الكتاب بيقول إن الـ NETs بتعبّر عن **somatostatin receptors** بكثافة، فاستهدافها بيدّي **symptom and disease control**.

          والـ targets التانية ماشية مع طبيعة الورم:
          - **VEGF inhibitors** (bevacizumab، sunitinib، sorafenib، pazopanib) والـ antiangiogenic agents، لأن الـ NETs أورام **vascular** بتعيش على أوعية جديدة.
          - **mTOR** (everolimus) و **PI3K**: نفس الطريق اللي بيوصل من الـ receptor لانقسام الخلية.
          - **IGF-1 targeting**: AMG-479.

          والكتاب بيقول «high potential for **combination** therapies»، يعني تقفل أكتر من طريق مع بعض. وده إجابة سؤال 2 في ص 98.
      - kind: try
        items: [endo.L05.034, endo.L05.037, endo.L05.040, endo.L05.042, endo.L05.045]
