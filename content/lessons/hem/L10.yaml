  - id: hem.L10.lesson3
    title: "تشخيص الـ PV: الـ EPO والـ JAK2 والنخاع"
    hook: "سؤالين بيحلّوا أغلب الحالات: الـ JAK2 إيه؟ والـ EPO قد إيه؟"
    minutes: 10
    pages: [160, 164]
    topics: [pv-tests, pv-criteria]
    goals:
      - "تقرأ الـ CBC والـ red cell mass والـ SaO2"
      - "تكتب الـ A/B criteria و 2016 WHO criteria"
      - "تمشي على algorithm الـ erythrocytosis"
    status: unverified
    steps:
      - kind: explain
        page: 160
        title: "الـ CBC والـ red cell mass"
        quote: "Red cell mass (measured using patient RBC labelled with 51Cr) and plasma volume (using 131 I labelled albumin) ."
        text: |
          - **Complete blood count (CBC)**: Red blood cell (RBC) و Hb عاليين، و **mean corpuscular volume (MCV) واطي أو normal** (من الـ iron deficiency).
          - **Neutrophils و platelets** عاليين في الـ polycythaemia vera (PV)، ونادر ده في الـ secondary.
          - **Neutrophil alkaline phosphatase (NAP) score** عالي.
          - **Red cell mass** بـ ⁵¹Cr، و **plasma volume** بـ ¹³¹I-albumin. لو ==RCM >25%== فوق المتوقع = diagnostic.
          - **Arterial oxygen saturation (SaO2) <92%** = فكّر في **secondary**.
      - kind: table
        page: 160
        quote: "| | PV | SE | RE |\n| Red cell mass | ↑ | ↑ | ↑ Within NR or N |\n| Plasma volume | N or ↑ | N | Reduced |"
        title: "مين عالي ومين واطي؟"
        columns: [Measure, PV, Secondary, Relative]
        rows:
