  - id: git.L02.lesson3
    title: "نقطع من جوه: EMR و ESD"
    hook: "Cancer لسه في الـ mucosa؟ ممكن يتشال بالمنظار من غير جراحة. بس لحد أنهي مقاس، وإمتى نحتاج ESD؟"
    minutes: 8
    pages: [56, 58]
    topics: [resection, poem]
    goals:
      - "تعرف حدود الـ EMR وليه كل حد"
      - "تفرق بين EMR و ESD وتعرف إمتى كل واحد"
      - "تعرف مكان الـ POEM بين علاجات الـ achalasia"
    status: unverified
    steps:
      - kind: explain
        page: 56
        quote: "EMR is a minimally invasive technique for staging/ treatment of early malignant lesions limited to the mucosa."
        title: "الـ EMR"
        text: |
          ==EMR==: minimally invasive لـ **staging** و**treatment** الـ early malignant lesions **limited to the mucosa**.

          - طلع من الـ **snare biopsy**، وبقى **first-choice** للـ early gastrointestinal (GI) carcinoma.
          - بتحقن saline تحت الـ mucosa فتنتفخ، وبعدين تمسكها بـ **cap aspiration** أو **forceps traction**.

          التفسير المقبول (مش في الكتاب): ليه «limited to the mucosa» بالذات؟ لأن الـ mucosa فيها lymphatics قليلة جدًا، فالـ cancer اللي لسه فيها نادرًا ما يكون انتشر للـ nodes، فشيله موضعيًا يكفي.
      - kind: reveal
        page: 56
        quote: "Two major procedures for grasping the swollen mucosa after saline injection are:"
        prompt: "ليه بنحقن saline تحت الـ mucosa قبل ما نقطع؟"
        answer: |
          الكتاب بيقول إن الـ mucosa بتبقى **swollen** بعد الحقن، وبعدين نمسكها بـ ==cap aspiration== أو ==forceps traction==.

          التفسير المقبول (مش في الكتاب): الحقنة بتعمل **وسادة** بين الـ mucosa والـ muscle. فالـ lesion بتعلى ونقدر نمسكها، والـ muscle بيبعد عن الـ snare، فخطر الـ **perforation** يقل. ولو الـ lesion **مش بتعلى** مع الحقن، ده بيلمّح إنها لازقة في اللي تحتها (invasion أو fibrosis).
      - kind: explain
        page: 56
        quote: "EMR has developed from the snare biopsy method, and recently has been the first-choice therapy for early GIT carcinomas."
        title: "ليه EMR بقى first choice؟"
        text: |
          الكتاب: الـ EMR طلع من الـ **snare biopsy**، وبقى ==first-choice therapy== للـ **early GIT carcinomas**، ودوره **staging/treatment** مع بعض.

          التفسير المقبول (مش في الكتاب) للـ «مع بعض»: الحتة اللي اتشالت بتروح للـ pathology **كاملة**. فلو طلعت محصورة في الـ mucosa وحوافها نضيفة، تبقى **اتعالجت**. ولو طلعت أعمق، تبقى عرفت الـ **stage** الحقيقي وتكمل جراحة. يعني إجراء واحد يا يخلّص يا يوضّح الطريق.
      - kind: aside
        tone: exam
        page: 57
        quote: "Maximal indicative diameters for EMR are 20/10 mm in elevated and depressed lesions respectively."
        text: |
          الأرقام: ==20 mm== للـ **elevated**، ==10 mm== للـ **depressed**.

          ومش radical treatment للـ **poorly differentiated adenocarcinoma**. والمتابعة: منظار **كل 6 شهور لمدة 5 سنين**.

          افتكرها كده: الـ lesion «الواقفة» (elevated) مسموحلها الضعف.
      - kind: explain
        page: 57
        quote: "EMR should not be selected as a radical treatment for poorly differentiated adenocarcinoma."
        title: "ليه الحدود دي؟"
        text: |
          التفسير المقبول (مش في الكتاب) لكل حد في الكتاب:
          - **20 mm elevated / 10 mm depressed**: الـ lesion المنخفضة (**depressed**) بتميل تكون **أعمق** وأكثر عدوانية، فبنقلل المقاس المسموح.
          - **Poorly differentiated adenocarcinoma**: بيتسرّب للـ lymphatics بدري حتى لو صغير، فالشيل الموضعي **مش radical**.
          - **Follow-up كل 6 شهور لمدة 5 سنين**: علشان أي **recurrence** عند الحافة تتلقط وهي صغيرة وتتشال تاني.
      - kind: table
        page: 57
        quote: "EMR is a natural extension of polypectomy, applied to a flat lesion after a submucosal injection."
        title: "EMR ولا ESD؟"
        columns: ["", "EMR", "ESD"]
        rows:
          - ["الفكرة", "Polypectomy for a flat lesion after submucosal injection", "Tunnel into the submucosal plane"]
          - ["الصعوبة", "Simpler", "Technically harder"]
          - ["إمتى", "Early cancer limited to mucosa, within size limits", "Likely superficial submucosal invasion, fibrosis, post-EMR recurrence"]
        hide: [[0, 2], [2, 2]]
      - kind: sort
        page: 57
        quote: "ESD is endorsed for lesions that have a high likelihood of cancer invading the superficial submucosa and for lesions that cannot be removed by EMR due to fibrosis in the submucosal space or post-EMR recurrences."
        prompt: "EMR ولا ESD؟"
        bins: ["EMR", "ESD"]
        cards:
          - { text: "Natural extension of polypectomy", bin: 0 }
          - { text: "Flat lesion after submucosal injection", bin: 0 }
          - { text: "Likely invading the superficial submucosa", bin: 1 }
          - { text: "Submucosal fibrosis", bin: 1 }
          - { text: "Post-EMR recurrence", bin: 1 }
          - { text: "Curative en bloc resection", bin: 1 }
        why: "الـ EMR **polypectomy** لـ lesion مسطحة. الـ ESD أصعب لأنه **نفق** في الـ submucosa، فبيشيل حتة واحدة كبيرة (**en bloc**) حتى لو فيه fibrosis أو recurrence أو invasion سطحية."
      - kind: reveal
        page: 57
        quote: "ESD is a technically more difficult technique that involves tunneling the endoscope into the submucosal plane, but may allow curative, en bloc, resections of early stage malignancies."
        prompt: "ليه الـ en bloc مهم؟"
        answer: |
          الكتاب: الـ ESD **may allow curative, en bloc** resection.

          التفسير المقبول (مش في الكتاب): لو الـ lesion اتشالت **حتت** (piecemeal)، الـ pathologist مش هيقدر يقول الحواف نضيفة ولا لأ، ولا عمق الـ invasion الحقيقي. حتة واحدة = تقرير واضح عن الحواف والعمق، فتعرف إذا كانت **curative** فعلًا. وده التمن اللي بندفعه في صعوبة الـ ESD.
      - kind: explain
        remind: [git.L02.058]
        page: 58
        quote: "In 2009, Inoue et al, described a revolutionary technique for the treatment of achalasia, termed per-oral endoscopic myotomy (POEM)"
        title: "الـ POEM: Heller من جوه"
        text: |
          الـ **gold standard** للـ achalasia في الكتاب: ==Heller's myotomy (1914)==. والبدائل: **pneumatic dilation**، **botulinum toxin**، **calcium channel blockers (CCBs)**.

          الـ **POEM** (Inoue، **2009**): myotomy بالـ **natural orifice transluminal endoscopic surgery (NOTES)** approach، يعني من فتحة طبيعية، **minimally invasive** و **scar-less**.

          الطريق ليه: Ortega 1980 (كلاب ثم 17 مريض)، فكرة الـ **submucosal tunnel** 2007، Pasricha على الخنازير، وبعدين Inoue على البني آدمين.
      - kind: explain
        page: 58
        quote: "A 2 cm longitudinal mucosotomy was performed with a cutting current."
        title: "بداية الـ POEM: نفتح وندخل"
        text: |
          الكتاب بيبدأ الخطوات كده:
          - ==2 cm longitudinal mucosotomy== بـ **cutting current**.
          - ندخل الـ **submucosal space** بمساعدة **tapered cap**.
          - نعمل النفق بـ **spray coagulation** بالـ TT knife، مع **hydrodissection** متقطع بـ **indigo carmine** مخففة.
          - الأوعية الكبيرة اللي معدية في الـ submucosa بنعمل لها **coagulation**.

          التفسير المقبول (مش في الكتاب): الـ indigo carmine بتلوّن الـ submucosa **أزرق**، فتفرّق بسهولة بين الطبقة اللي انت ماشي فيها والـ muscle اللي تحتها. والـ coagulation للأوعية قبل ما تقطعها علشان الدم يغطي الرؤية في نفق ضيق.

          وفي الكتاب كمان: من **2014** الـ POEM بقى بديل في **National University Hospital, Singapore**.
      - kind: check
        page: 57
        quote: "Maximal indicative diameters for EMR are 20/10 mm in elevated and depressed lesions respectively."
        question: "A 15 mm depressed early gastric cancer, well differentiated, limited to the mucosa. Is it within the lecture's EMR limits?"
        options:
          - "No: the limit for depressed lesions is 10 mm"
          - "Yes: the limit is 20 mm for all lesions"
          - "Yes: size does not matter if it is in the mucosa"
          - "No: EMR is never used in the stomach"
        answer: 0
        why:
          - "صح: الكتاب: **20 mm elevated** و **10 mm depressed**. التفسير المقبول (مش في الكتاب): الـ depressed أخطر وبتتعمّق أسرع، فحدها أصغر."
          - "الـ 20 mm للـ **elevated** بس."
          - "المقاس جزء من الـ indication في الكتاب."
          - "الـ EMR هو **first-choice** للـ early GIT carcinomas."
      - kind: reveal
        page: 58
        quote: "This started the way for the worldwide adoption of POEM as a minimally invasive and scar-less method of treating achalasia."
        prompt: "ليه الـ POEM انتشر بسرعة رغم إن Heller هو الـ gold standard؟"
        answer: |
          الكتاب: الـ POEM اتبنى على فكرة الـ **NOTES** (من فتحة طبيعية)، واتنشر worldwide كطريقة ==minimally invasive و scar-less==.

          التفسير المقبول (مش في الكتاب): الـ Heller محتاج جراحة في البطن أو بالمنظار الجراحي، يعني جروح وتخدير أطول ونقاهة. الـ POEM بيوصل لنفس العضلة **من جوه** من غير ولا جرح برّه، وكمان يقدر يطوّل الـ myotomy لفوق قد ما تحتاج. والتمن اللي هتشوفه في الدرس الجاي: خطر الـ GERD.
      - kind: check
        page: 58
        quote: "The gold standard treatment for achalasia is Heller‘s myotomy, 1914."
        question: "According to the lecture, what is the gold standard treatment for achalasia?"
        options:
          - "Heller's myotomy"
          - "POEM"
          - "Pneumatic balloon dilation"
          - "Botulinum toxin injection"
        answer: 0
        why:
          - "صح: **Heller's myotomy (1914)** هو الـ gold standard في الكتاب."
          - "الـ POEM (2009) بديل minimally invasive و scar-less، مش الـ gold standard في الكتاب."
          - "من الـ other treatment modalities."
          - "من الـ other treatment modalities."
      - kind: try
        items: [git.L02.050, git.L02.053, git.L02.055, git.L02.057, git.L02.064]
    recap:
      - "EMR: early cancer في الـ mucosa؛ من الـ snare biopsy؛ first choice؛ saline ثم cap aspiration أو forceps traction."
      - "20 mm elevated و 10 mm depressed؛ مش radical للـ poorly differentiated؛ متابعة كل 6 شهور 5 سنين."
      - "ESD: نفق في الـ submucosa، en bloc؛ للـ superficial submucosal invasion والـ fibrosis والـ post-EMR recurrence."
      - "Achalasia: الـ gold standard Heller 1914؛ POEM (Inoue 2009) بيبدأ بـ mucosotomy 2 cm ونفق."
