  - id: git.L03.lesson15
    title: "علاج الـ IBS على حسب النوع"
    hook: "IBS-C بألم، IBS-D من غير ألم، أو بيقلّب. كل واحد له سلّم، والدوا اللي يفيد واحد ممكن يأذي التاني."
    minutes: 9
    pages: [123, 126]
    topics: [ibs]
    goals:
      - "تعرف الخطوات الأولى المشتركة وليه"
      - "تختار الدوا حسب الـ subtype ووجود الألم"
      - "تعرف العلاجات الجديدة وتحدّد الـ subtype بالـ 25%"
    status: unverified
    steps:
      - kind: explain
        page: 123
        quote: "an effective therapeutic relationship, education and reassurance.\nInitial treatments should be conservative, including discussion of lifestyle changes\nPossible precipitating substances such as caffeine, lactose, or fructose may need to be eliminated from the diet.\nThe addition of fibre to the diet is usually the first step in patients with IBS, but this sometimes causes flatulence or bloating.\nProbiotics may also be considered. One strain, Bifidobacterium infantis, has shown efficacy for improvement of IBS symptoms and it is the preferred choice over other probiotics.\nA diet low in fermentable oligosaccharides, disaccharides, monosaccharides, and polyols (FODMAPs) can also be considered (if pain /bloating occcur)"
        title: "الأساس قبل أي دوا"
        text: |
          - **Therapeutic relationship**، education، و reassurance.
          - شيل المحفّزات المحتملة: **caffeine**، **lactose**، **fructose**.
          - ==Fibre== أول خطوة عادةً، بس ممكن يعمل flatulence و bloating.
          - **Probiotics:** ==Bifidobacterium infantis== هو المفضّل.
          - **Low FODMAP diet** لو فيه pain أو bloating.

          يعني قبل ما تكتب أي دوا، اسأل نفسك: المريض فاهم مرضه؟ جرّب يغيّر أكله؟ لأن الخطوات دي لوحدها بتحسّن ناس كتير.
      - kind: reveal
        page: 123
        quote: "The addition of fibre to the diet is usually the first step in patients with IBS, but this sometimes causes flatulence or bloating."
        prompt: "الـ fibre أول خطوة، بس ليه ممكن يزوّد الانتفاخ؟"
        answer: |
          الكتاب: إضافة الـ **fibre** هي عادةً أول خطوة، بس ساعات بتعمل ==flatulence or bloating==. والـ **Bifidobacterium infantis** هو الـ probiotic المفضّل، والـ **low FODMAP** لو فيه ألم أو bloating.

          التفسير المقبول (مش في الكتاب): البكتيريا بتخمّر جزء من الألياف فتطلع غاز. وعند مريض الـ IBS المصران حساس للغاز الطبيعي (فاكر الـ hypersensitivity؟)، فالغاز الزيادة بيتحس انتفاخ. علشان كده بنبدأ بالألياف بالتدريج، وأحيانًا الـ soluble زي **ispaghula** أريح.
      - kind: table
        page: 123
        quote: "Constipation-predominant\n| | 1st | 2nd |\n|---|---|---|\n| Without pain or bloating | lifestyle and dietary modifications + Ispaghula/lactulose/polyethylene glycol/electrolytes | lifestyle and dietary modifications + lubiprostone or linaclotide |\n| With pain or bloating | lifestyle and dietary modifications + Ispaghula/lactulose/polyethylene glycol/electrolytes + antispasmodics Dicycloverine/hyoscyamine/peppermint oil | lifestyle and dietary modifications + selective serotonin-reuptake inhibitor (SSRI) Citalopram/paroxetine + linaclotide; adjunct cognitive behaviour therapy (CBT) or hypnotherapy |"
