        quote: "Annual incidence rate of malignant melanoma = 30 per 1,000,000\nAnnual mortality rate of malignant melanoma = 5 per 1,000,000\nPoint prevalence rate of malignant melanoma = 90 per 1,000,000\n1. With the information given, the average duration of the disease is:\n  (A) 3 years\n  (B) 4 years\n  (C) 5 years\n  (D) 6 years\n  (E) unable to be determined due to insufficient data"
        question: "Melanoma: incidence 30 per 1,000,000/year, mortality 5 per 1,000,000/year, point prevalence 90 per 1,000,000. Average duration?"
        options: ["3 years", "6 years", "18 years", "Insufficient data"]
        answer: 0
        why:
          - "صح: D = P/I = 90/30 = 3 سنين. الـ mortality رقم مُلهي."
          - "30/5: قسمت الـ incidence على الـ mortality، مالهاش معنى هنا."
          - "90/5: الـ mortality مش الـ incidence."
          - "P وI كفاية."
