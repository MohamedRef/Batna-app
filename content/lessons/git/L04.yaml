        title: "كل جهاز ودقّته"
        image: { file: git/L04-staging-accuracy-table.webp, book: true }
        alt: "Book table of staging studies for esophageal cancer with clinical utility and overall accuracy: computed tomography of chest and abdomen for invasion of local structures and for metastatic disease, at least 90 percent each; endoscopy for local tumor T staging, 80 to 90 percent, operator dependent; ultrasonography with or without fine-needle aspiration of nodes for local nodal N staging, 70 to 90 percent, operator dependent; positron emission tomography for metastatic disease, at least 90 percent."
