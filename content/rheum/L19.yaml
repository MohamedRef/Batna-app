    src: { page: 324, quote: "Treatment of non-renal SLE. Top-to bottom sequence does not imply order of preference (eg, MTX, AZA and MMF are equal options for second-line therapy in mild disease or first-line therapy in moderate disease). *Mild disease: constitutional symptoms; mild arthritis; rash ≤9% body surface area; PLT 50– 100 × 109/L; SLEDAI ≤6; BILAG C or ≤1 BILAG B manifestation. *Moderate disease: moderate-severe arthritis 'RA-like'; rash 9%-18% BSA; PLTs 20-50×109/L; serositis; SLEDAI 7–12; ≥2 BILAG B manifestations. *Severe disease: major organ threatening disease (cerebritis, myelitis, pneumonitis, mesenteric vasculitis); thrombocytopenia with PLTs <20 × 109/L;TTP-like disease or acute hemophagocytic syndrome; rash>18% BSA; SLEDAI >12; ≥1 BILAG A manifestations. †Recommendation of belimumab and anifrolumab as first-line therapy in severe disease refers to cases of extra renal SLE with non-major organ involvement, but extensive disease from skin, joints, and so on. The use of anifrolumab as add-on therapy in severe disease refers mainly to severe skin disease. For patients with severe neuropsychiatric disease, anifrolumab and belimumab are not recommended." }
    status: unverified
