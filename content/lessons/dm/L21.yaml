  - id: dm.L21.lesson1
    title: "Fredrickson: 6 أنواع في جدول واحد"
    hook: "الجدول ده بيتسأل كل سنة. ولو عرفت كل lipoprotein شايل إيه، الأسهم بتتكتب لوحدها."
    minutes: 8
    pages: [260, 261]
    topics: [fredrickson, etiologic]
    goals:
      - "تحفظ جدول Fredrickson بالـ lipoprotein والتكرار"
      - "تفهم ليه كل نوع ليه شكل الكوليسترول والـ TG ده"
      - "تعرف التقسيم الـ etiologic وليه محتاجينه جنب Fredrickson"
    status: unverified
    steps:
      - kind: explain
        page: 260
        title: "Fredrickson، الستينات"
        quote: "During the 1960s, based on the composition of serum lipoproteins, Fredrickson suggested five different phenotypes of hyperlipoproteinemia . This classification became commonly used for distinguishing hyperlipidemic conditions."
        text: |
          الـ **dyslipidemia** في الكتاب أوسع من "دهون عالية": أي **علو أو نقص** في الـ lipoproteins، أو عيب في **تركيبها**.

          في الستينات، ==Fredrickson== قسّم الـ hyperlipoproteinemia لـ **5 phenotypes** على حسب **تركيب الـ serum lipoproteins** (أنهي lipoprotein عالي). النوع II اتقسم a و b، فبقوا 6 صفوف في الجدول.

          ليه على حسب التركيب مش الجين؟ التفسير المقبول (مش في الكتاب): وقتها كانوا بيفصلوا الـ lipoproteins في المعمل ويشوفوا أنهي واحد زايد، فالتقسيم اتبنى على اللي يقدروا يشوفوه. عشان كده هو بيوصف **الشكل**، مش **السبب**.
      - kind: figure
        page: 260
        quote: "Fredrickson Classification of Hyperlipidemia"
        title: "الجدول على هيئة سلم"
        alt: "Six rows, one per Fredrickson type, each showing the elevated lipoprotein and its frequency: I chylomicrons under 1 percent; IIa LDL 10 percent; IIb LDL and VLDL 40 percent; III IDL under 1 percent; IV VLDL 45 percent; V VLDL and chylomicrons 6 percent. Bars for IV and IIb are longest."
        caption: "الـ ==IV== (VLDL) أشهر واحد 45%، بعده **IIb** 40%. الـ **I** والـ **III** نادرين (أقل من 1%)."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="18" class="t-sm t-b">Type</text>
            <text x="50" y="18" class="t-sm t-b">Elevated</text>
            <text x="320" y="18" text-anchor="end" class="t-sm t-b">%</text>
            <text x="10" y="48" class="t-b">I</text>
            <text x="50" y="48" class="t-sm">Chylomicrons</text>
            <rect x="170" y="36" width="4" height="16" class="fg-dot-bad"/>
            <text x="320" y="48" text-anchor="end" class="t-sm">&lt;1</text>
            <text x="10" y="84" class="t-b">IIa</text>
            <text x="50" y="84" class="t-sm">LDL</text>
            <rect x="170" y="72" width="27" height="16" class="fg-dot-acc"/>
            <text x="320" y="84" text-anchor="end" class="t-sm">10</text>
            <text x="10" y="120" class="t-b">IIb</text>
            <text x="50" y="120" class="t-sm">LDL + VLDL</text>
            <rect x="170" y="108" width="107" height="16" class="fg-dot-acc"/>
            <text x="320" y="120" text-anchor="end" class="t-sm">40</text>
            <text x="10" y="156" class="t-b">III</text>
            <text x="50" y="156" class="t-sm">IDL</text>
            <rect x="170" y="144" width="4" height="16" class="fg-dot-bad"/>
            <text x="320" y="156" text-anchor="end" class="t-sm">&lt;1</text>
            <text x="10" y="192" class="t-b">IV</text>
            <text x="50" y="192" class="t-sm">VLDL</text>
            <rect x="170" y="180" width="120" height="16" class="fg-dot-good"/>
            <text x="320" y="192" text-anchor="end" class="t-sm">45</text>
            <text x="10" y="228" class="t-b">V</text>
            <text x="50" y="228" class="t-sm">VLDL + chylo</text>
            <rect x="170" y="216" width="16" height="16" class="fg-dot-acc"/>
            <text x="320" y="228" text-anchor="end" class="t-sm">6</text>
          </svg>
      - kind: aside
        tone: tip
        page: 260
        quote: "Fredrickson Classification of Hyperlipidemia"
        text: "احفظ الـ Fredrickson بالترتيب، وامشي مع رحلة الـ lipoproteins: **I** = أول محطة (chylomicrons)، **II** = آخر محطة (LDL، و b معاه very-low-density lipoprotein (VLDL))، **III** = اللي في النص (IDL)، **IV** = اللي الكبد بيطلّعه (VLDL)، **V** = I + IV مع بعض (VLDL + chylomicrons)."
      - kind: explain
        page: 260
        title: "ليه كل نوع ليه الأسهم دي؟"
        quote: "Fredrickson Classification of Hyperlipidemia"
        text: |
          جدول Fredrickson بيتقري لوحده لو عرفت كل lipoprotein شايل إيه. التفسير المقبول (مش في الكتاب):
          - الـ **chylomicrons** والـ **VLDL** شايلين ==TG== أساسًا، فلما يعلوا الـ TG يطير: I (↑↑↑↑)، IV (↑↑)، و V (↑↑↑↑).
          - الـ **LDL** شايل ==cholesterol== أساسًا، فالـ IIa كوليسترول ↑↑ و TG **normal**.
          - الـ **IDL** في النص بين الـ VLDL والـ LDL، شايل الاتنين، فالـ III الاتنين عاليين.
          - الـ **IIb** = LDL + VLDL، فالاتنين ↑↑.

          يعني بدل ما تحفظ 12 سهم، احفظ **مين شايل إيه**، والجدول يتبني في دماغك.
      - kind: table
        page: 260
        quote: "Fredrickson Classification of Hyperlipidemia:\n| Phenotype | Lipoprotein(s) elevated | Serum cholesterol concentration | Serum triglyceride concentration | Relative frequency % |\n|---|---|---|---|---|\n| I | Chylomicrons | Normal to ↑ | ↑↑↑↑ | <1 |\n| IIa | LDL | ↑↑ | Normal | 10 |\n| IIb | LDL and VLDL | ↑↑ | ↑↑ | 40 |\n| III | IDL | ↑↑ | ↑↑↑ | <1 |\n| IV | VLDL | Normal to ↑ | ↑↑ | 45 |\n| V | VLDL and chylomicrons | ↑ to ↑↑ | ↑↑↑↑ | 6 |"
        title: "الكوليسترول والـ TG في كل نوع"
        columns: [Type, Cholesterol, TG]
        rows:
          - ["I", "Normal to ↑", "↑↑↑↑"]
          - ["IIa", "↑↑", "Normal"]
          - ["IIb", "↑↑", "↑↑"]
          - ["III", "↑↑", "↑↑↑"]
          - ["IV", "Normal to ↑", "↑↑"]
          - ["V", "↑ to ↑↑", "↑↑↑↑"]
        hide: [[0, 2], [1, 2], [4, 1], [5, 2]]
      - kind: check
        page: 260
        quote: "Fredrickson Classification of Hyperlipidemia"
        question: "Raised cholesterol (↑↑) with NORMAL triglyceride is which Fredrickson type?"
        options:
          - "IIa"
          - "IIb"
          - "IV"
          - "I"
        answer: 0
        why:
          - "صح: IIa = LDL بس، والـ TG طبيعي."
          - "IIb فيه VLDL كمان فالـ TG بيعلى."
          - "IV = VLDL، الـ TG عالي."
          - "I = chylomicrons، الـ TG ↑↑↑↑."
      - kind: explain
        remind: [dm.L21.007]
        page: 261
        title: "Primary ولا secondary؟"
        quote: "I. Primary hyperlipidemia\n  A) Primary Disorders of ApoB-Containing Lipoproteins\n  B) Primary Disorders of HDL-C Lipoprotein"
        text: |
          التقسيم الـ ==etiologic==:
          1. **Primary hyperlipidemia**: (A) **primary disorders of ApoB-containing lipoproteins**، و (B) **primary disorders of HDL-C lipoprotein**.
          2. **Secondary hyperlipidemia**: مرض أو دوا تاني هو السبب.

          ليه الـ primary اتقسم كده؟ التفسير المقبول (مش في الكتاب): الـ ApoB هو البروتين اللي على الـ chylomicrons والـ VLDL والـ IDL والـ LDL، يعني عيلة الـ particles اللي بتدخل الجدار. والـ HDL عيلة لوحدها بتشتغل عكسهم (المحاضرة اللي فاتت).

          وقبل ما تقول familial، استبعد الـ secondary، لأن علاج السبب نفسه بيصلّح الدهون.
      - kind: reveal
        page: 261
        quote: "Classification of hyperlipidemia\n  Etiologic classification\n  I. Primary hyperlipidemia\n  II. Secondary hyperlipidemia"
        prompt: "تحليل عيان طلع Fredrickson Type IV. كده عرفت السبب؟"
        answer: "لأ. Fredrickson بيوصف **الشكل** (الـ VLDL عالي)، مش **السبب**. نفس الـ IV ممكن يكون **familial hypertriglyceridemia**، أو سكر مش متظبط، أو كحول (secondary). عشان كده الكتاب بيدّي تقسيم تاني جنبه: الـ **etiologic classification** (primary و secondary)."
      - kind: check
        page: 261
        quote: "I. Primary hyperlipidemia\n  A) Primary Disorders of ApoB-Containing Lipoproteins\n  B) Primary Disorders of HDL-C Lipoprotein"
        question: "In the book's etiologic classification, primary hyperlipidemia is divided into disorders of:"
        options:
          - "ApoB-containing lipoproteins and HDL-C"
          - "Chylomicrons and VLDL only"
          - "Fredrickson types I to V"
          - "Dietary and drug-induced causes"
        answer: 0
        why:
          - "صح: (A) ApoB-containing و (B) HDL-C."
          - "دول جزء من الـ ApoB-containing بس."
          - "ده التقسيم التاني (phenotype)، مش الـ etiologic."
          - "دي secondary causes، مش primary."
      - kind: try
        items: [dm.L21.001, dm.L21.002, dm.L21.003, dm.L21.005, dm.L21.007]
    recap:
      - "Fredrickson: I chylo، IIa LDL، IIb LDL+VLDL، III IDL، IV VLDL، V VLDL+chylo."
      - "IV أشهر (45%)، IIb (40%)، IIa (10%)، V (6%)، I و III أقل من 1%."
      - "Chylo و VLDL = TG، LDL = cholesterol، IDL = الاتنين."
      - "Etiologic: primary (ApoB أو HDL-C) و secondary. Fredrickson شكل، مش سبب."
    practice: [dm.L21.001, dm.L21.002, dm.L21.003, dm.L21.004, dm.L21.005, dm.L21.006, dm.L21.007]
