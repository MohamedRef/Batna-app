lecture: res.L10
lessons:
  # ------------------------------------------------------------------
  - id: res.L10.lesson1
    title: "تجيب الداتا إزاي؟ 5 طرق وأدواتها"
    hook: "عايز تعرف كام عيان في العيادة واخد الـ statin صح؟ تفتح الدفاتر، تتفرج، تسأل، ولا تديله ورقة؟"
    minutes: 7
    pages: [2, 8]
    topics: [techniques]
    goals:
      - "تعدّ الـ 5 data collection techniques وأداة كل واحدة"
      - "تختار الطريقة المناسبة من مزاياها وعيوبها"
      - "تعرّف الـ focus group discussion (FGD)"
    status: unverified
    steps:
      - kind: explain
        page: 2
        quote: "Introduction\n  Data collection is a crucial stage in the planning and implementation of a study. If the data collection has been superficial, biased or incomplete, data analysis becomes difficult, and the research report will be of poor quality."
        title: "ليه الـ data collection مرحلة حاسمة؟"
        text: |
          أحسن statistician في الدنيا مش هيصلّح داتا اتجمعت غلط. لو الـ ==data collection== كانت **superficial** أو **biased** أو **incomplete**، الـ analysis بتبقى صعبة والـ report بيطلع ضعيف.

          عشان كده بنحط كل مجهودنا في إننا نعمل **tools** مناسبة، ونجرّبها **أكتر من مرة** قبل ما ننزل الميدان.
      - kind: figure
        remind: [res.L10.002]
        page: 3
        quote: "Various data collection techniques can be used as:\n  Using available information (Record review)\n  Observing\n  Interviewing (face-to-face)\n  Administering written questionnaires\n  Focus group discussions"
        title: "الـ 5 techniques"
        alt: "Five boxes, one per data collection technique: using available information (record review), observing, interviewing face to face, administering written questionnaires, and focus group discussions."
        caption: "خمس طرق: **record review**، **observing**، **interviewing**، **written questionnaire**، و**focus group discussion**."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="150" height="50" rx="8" class="fg-acc"/>
            <text x="85" y="31" text-anchor="middle" class="t-sm t-b">Available information</text>
            <text x="85" y="48" text-anchor="middle" class="t-sm t-mut">record review</text>
            <rect x="170" y="10" width="150" height="50" rx="8" class="fg-box"/>
            <text x="245" y="31" text-anchor="middle" class="t-sm t-b">Observing</text>
            <text x="245" y="48" text-anchor="middle" class="t-sm t-mut">watch and measure</text>
            <rect x="10" y="72" width="150" height="50" rx="8" class="fg-box"/>
            <text x="85" y="93" text-anchor="middle" class="t-sm t-b">Interviewing</text>
            <text x="85" y="110" text-anchor="middle" class="t-sm t-mut">face to face</text>
            <rect x="170" y="72" width="150" height="50" rx="8" class="fg-acc"/>
            <text x="245" y="93" text-anchor="middle" class="t-sm t-b">Written questionnaire</text>
            <text x="245" y="110" text-anchor="middle" class="t-sm t-mut">self-administered</text>
            <rect x="90" y="134" width="150" height="56" rx="8" class="fg-good"/>
            <text x="165" y="156" text-anchor="middle" class="t-sm t-b">Focus group discussion</text>
            <text x="165" y="174" text-anchor="middle" class="t-sm t-mut">6-12 people + facilitator</text>
          </svg>
      - kind: table
        page: 6
        quote: "Data collection techniques and tools\n| Data collection techniques | Data collection tools |\n|---|---|\n| Using available information | Checklist; data compilation forms |\n| Observing | Eyes and other senses, pen/paper, watch, scales, microscope, etc. |\n| Interviewing | Interview guide, checklist, questionnaire, tape recorder |\n| Administering written questionnaires | Questionnaire |"
        title: "كل technique وأداتها (tools)"
        columns: ["Technique", "Tools"]
        rows:
          - ["Using available information", "Checklist; data compilation forms"]
          - ["Observing", "Eyes and other senses, pen/paper, watch, scales, microscope"]
          - ["Interviewing", "Interview guide, checklist, questionnaire, tape recorder"]
          - ["Written questionnaires", "Questionnaire"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: exam
        page: 6
        quote: "Data collection techniques and tools\n| Data collection techniques | Data collection tools |\n|---|---|\n| Using available information | Checklist; data compilation forms |\n| Observing | Eyes and other senses, pen/paper, watch, scales, microscope, etc. |\n| Interviewing | Interview guide, checklist, questionnaire, tape recorder |\n| Administering written questionnaires | Questionnaire |"
        text: |
          الدكتورة فرّقت في الشرح: الـ ==technique== (الطريقة) = **إزاي** بتجمع: interview، observation، record review. الـ ==tool== (الأداة) = **بإيه** بتسجّل أو تقيس: questionnaire، checklist، interview guide، data compilation form.

          متخلطش اسم الأداة بالطريقة، ولا بالـ study design: الـ questionnaire **أداة**، مش design.
      - kind: table
        page: 4
        quote: "Advantages and disadvantages of various data collection techniques\n| Technique | Advantages | disadvantages |\n|---|---|---|\n| Using available information | Inexpensive, because data is already there; Permits examination of trends over the past | Data is not always easily accessible; Ethical issues concerning confidentiality; Information may be imprecise or incomplete |\n| Observing | Gives more detailed and context-related information; Permits tests of reliability of responses to questionnaires | Ethical issues concerning confidentiality or privacy; Observer bias; Presence of data collector can influence the situation observed |"
        title: "الدفاتر ضد الملاحظة: advantages وdisadvantages"
        columns: ["", "Available information", "Observing"]
        rows:
          - ["Plus", "Inexpensive; trends over the past", "Detailed, context-related; tests reliability of questionnaire answers"]
          - ["Minus", "Not always accessible; confidentiality; imprecise or incomplete", "Confidentiality or privacy; observer bias; collector's presence changes the situation"]
        hide: [[0, 1], [1, 2]]
      - kind: aside
        tone: analogy
        page: 4
        quote: "Observing | Gives more detailed and context-related information; Permits tests of reliability of responses to questionnaires | Ethical issues concerning confidentiality or privacy; Observer bias; Presence of data collector can influence the situation observed"
        text: |
          أول ما الـ consultant يدخل الـ ward، فجأة كله بيغسل إيده. ده بالظبط عيب الـ **observing**: ==presence of data collector== بيغيّر الموقف اللي بتتفرج عليه.

          وفي نفس الوقت الملاحظة بتكشف لو اللي الناس **قالوه** في الـ questionnaire مش هو اللي **بيعملوه** (tests of reliability).

          ومثال الدكتورة في الشرح: في الـ **infection control**، إنك **تتفرّج** على الممارسة أحسن من إنك تسأل العامل «بتغسل إيدك؟». والحل للعيوب: عرّف اللي بتلاحظه بوضوح ودرّب الفريق.
      - kind: check
        page: 5
        quote: "Interviewing | Suitable for illiterates; Permits clarification of questions; Higher response rate than written questionnaires | Presence of interviewer can influence responses; Information on events may be less complete than gained by observation"
        question: "A survey in a village where many adults cannot read needs a high response rate. Best technique?"
        options: ["Interviewing (face-to-face)", "Administering written questionnaires", "Using available information", "Observing"]
        answer: 0
        why:
          - "صح: الـ interviewing مناسب للـ illiterates، بيسمح بـ clarification، والـ response rate أعلى من الورق."
          - "الورق مايتعملش مع اللي مابيقراش، والـ response rate واطي."
          - "الدفاتر مش هتوضّحلك سؤال، وممكن تبقى ناقصة."
          - "الملاحظة بتدّي context، بس مش هتسأل حد سؤال."
      - kind: table
        page: 5
        quote: "Advantages and disadvantages of various data collection techniques\n| Technique | Advantages | disadvantages |\n|---|---|---|\n| Interviewing | Suitable for illiterates; Permits clarification of questions; Higher response rate than written questionnaires | Presence of interviewer can influence responses; Information on events may be less complete than gained by observation |\n| Administering written questionnaires | Less expensive; Permits anonymity and may result in more honest responses; Eliminates bias due to phrasing questions differently with different respondents | cannot be used with illiterates; Low response rate; Questions may be misunderstood |"
        title: "المقابلة ضد الورقة: advantages وdisadvantages"
        columns: ["", "Interviewing", "Written questionnaire"]
        rows:
          - ["Plus", "Illiterates OK; clarification; higher response rate", "Less expensive; anonymity, more honest; no bias from phrasing questions differently"]
          - ["Minus", "Interviewer influences responses; events less complete than observation", "Not for illiterates; low response rate; questions may be misunderstood"]
        hide: [[0, 2], [1, 1]]
      - kind: aside
        tone: trap
        page: 5
        quote: "Administering written questionnaires | Less expensive; Permits anonymity and may result in more honest responses; Eliminates bias due to phrasing questions differently with different respondents | cannot be used with illiterates; Low response rate; Questions may be misunderstood"
        text: |
          الامتحان بيقلب الجدول: **higher response rate** للـ ==interviewing==، و**low response rate** للـ written questionnaire.

          و**anonymity** وإجابات أصدق، والـ **phrasing** واحد للكل: دول مزايا الـ ==written questionnaire==. سؤال حساس زي الإدمان؟ الورقة أحسن.
      - kind: explain
        page: 7
        quote: "Focus group discussion (FGD)\n  A group discussion of approximately 6 - 12 persons guided by a facilitator, during which group members talk freely and spontaneously about a certain topic."
        title: "الـ focus group discussion (FGD)"
        text: |
          ==Focus group discussion (FGD)== = مناقشة جماعية لحوالي **6 لـ 12** شخص، بيديرها **facilitator**، والناس بتتكلم **بحرية وتلقائية** في موضوع معيّن.

          تخيّل 8 أمهات في وحدة صحية بيتكلموا عن ليه مش بيكمّلوا تطعيمات ولادهم. الـ facilitator مش بيسأل كل واحدة لوحدها؛ هو بيفتح الموضوع وبيسيبهم يردّوا على بعض.
      - kind: reveal
        page: 8
        quote: "A FGD is a qualitative method. Its purpose is to obtain in-depth information on concepts, perceptions and ideas of a group.\n  A FGD aims to be more than a question-answer interaction. The idea is that group members discuss the topic among themselves, with guidance from facilitator."
        prompt: "الـ FGD بتطلّع أرقام نعمل عليها statistics؟ وإيه اللي بيفرّقها عن interview جماعي؟"
        answer: |
          لأ: الـ FGD ==qualitative method==. هدفها **in-depth information** عن الـ concepts والـ perceptions والـ ideas بتاعة الجروب.

          والفرق إنها **أكتر من سؤال وجواب**: الأعضاء بيناقشوا **بعض**، والـ facilitator بيوجّه بس.
      - kind: check
        page: 7
        quote: "A group discussion of approximately 6 - 12 persons guided by a facilitator, during which group members talk freely and spontaneously about a certain topic."
        question: "A focus group discussion (FGD) is a group of approximately how many persons?"
        options: ["6-12", "2-4", "15-30", "50-100"]
        answer: 0
        why:
          - "صح: حوالي 6 لـ 12 مع facilitator."
          - "عدد صغير قوي؛ مش هيبقى في مناقشة جماعية."
          - "ده عدد الـ pretesting sample للـ questionnaire، مش الـ FGD."
          - "ده survey، مش مناقشة."
      - kind: try
        items: [res.L10.002, res.L10.003, res.L10.009]
    recap:
      - "5 techniques: record review، observing، interviewing، written questionnaire، FGD."
      - "Interviewing: illiterates، clarification، response rate أعلى؛ بس الـ interviewer بيأثر."
      - "Written questionnaire: أرخص، anonymity، إجابات أصدق؛ بس مش للـ illiterates والـ response rate واطي."
      - "FGD: 6–12 شخص + facilitator، qualitative، in-depth."
    practice: [res.L10.001, res.L10.002, res.L10.003, res.L10.004, res.L10.005, res.L10.006, res.L10.007, res.L10.008, res.L10.009, res.L10.010, res.L10.011, res.L10.108, res.L10.112]
  # ------------------------------------------------------------------
  - id: res.L10.lesson2
    title: "الـ questionnaire: تبدأ منين، وكل سؤال فيه فكرة واحدة"
    hook: "«بتشرب قهوة ولا شاي كام فنجان في اليوم؟» سؤال شكله بريء، بس مستحيل يتجاوب صح."
    minutes: 10
    pages: [10, 71]
    topics: [questionnaire, content]
    goals:
      - "تعرّف الـ questionnaire وتقول أهميته"
      - "ترتّب خطوات الـ questionnaire design"
      - "تكتشف الـ double-barreled question وتصلّحه"
    status: unverified
    steps:
      - kind: explain
        page: 11
        quote: "What is a Questionnaire?\n  A questionnaire is a formalized set of questions for obtaining information from respondents.\n  The objective is to translate the researcher’s information needs into a set of specific questions that respondents are able to answer."
        title: "يعني إيه questionnaire؟"
        text: |
          ==Questionnaire== = مجموعة أسئلة **formalized** بنجمع بيها معلومات من الـ respondents.

          شغلته إنه **يترجم** اللي الباحث محتاج يعرفه لأسئلة محددة الـ respondent **يقدر يجاوبها**. انت محتاج تعرف «الـ adherence»، والعيان محتاج سؤال زي «نسيت الحباية كام مرة الأسبوع اللي فات؟».
      - kind: explain
        page: 12
        quote: "Why Is a Questionnaire Important?\n  A questionnaire ensures standardization and comparability of the data across interviewers,\n  increases speed and accuracy of recording, and\n  facilitates data processing."
        title: "ليه مهم؟ 3 أسباب"
        text: |
          - **Standardization وcomparability**: 3 residents بيسألوا نفس الأسئلة بنفس الكلام، فالداتا تتقارن.
          - **Speed وaccuracy of recording**: بتعلّم في خانة بدل ما تكتب موضوع إنشا.
          - **Data processing** أسهل: الداتا جاهزة تدخل الكمبيوتر.
      - kind: aside
        tone: tip
        page: 13
        quote: "Questionnaire Design Process\n  No scientific principles guarantee an optimal or ideal questionnaire.\n  Questionnaire design is as much an art as it is a science.\n  The creativity, skill, and experience of the researcher play a major role in the end design."
        text: |
          مفيش **scientific principles** تضمنلك questionnaire مثالي. الـ design **فن بقدر ما هو علم**: الـ creativity والـ skill والـ experience بتاعتك بتفرق.

          اللي عندنا **guidelines** على شكل خطوات، تحميك من الغلطات الكبيرة.
      - kind: figure
        page: 10
        quote: "Questionnaire design process.\n    What Information Is Needed?\n    How Should Individual Questions Be Framed?\n    What Should Be the Structure of the Question?\n      – Unstructured Questions\n      – Structured Questions\n    How Should the Question Be Worded?\n    Formatting the Questionnaire\n    Pretesting"
        title: "سلّم الـ questionnaire design"
        alt: "A staircase of six steps going up: what information is needed, how should questions be framed, structure of the question, wording, formatting, pretesting. Coding comes after."
        caption: "من تحت لفوق: **information** ← **content** ← **structure** ← **wording** ← **format** ← **pretest**، وبعدها **coding**."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="190" width="150" height="30" rx="5" class="fg-acc"/>
            <text x="85" y="210" text-anchor="middle" class="t-sm t-b">1 Information needed</text>
            <rect x="44" y="155" width="150" height="30" rx="5" class="fg-box"/>
            <text x="119" y="175" text-anchor="middle" class="t-sm">2 Frame each question</text>
            <rect x="78" y="120" width="150" height="30" rx="5" class="fg-box"/>
            <text x="153" y="140" text-anchor="middle" class="t-sm">3 Structure</text>
            <rect x="112" y="85" width="150" height="30" rx="5" class="fg-box"/>
            <text x="187" y="105" text-anchor="middle" class="t-sm">4 Wording</text>
            <rect x="146" y="50" width="150" height="30" rx="5" class="fg-box"/>
            <text x="221" y="70" text-anchor="middle" class="t-sm">5 Format</text>
            <rect x="170" y="15" width="150" height="30" rx="5" class="fg-good"/>
            <text x="245" y="35" text-anchor="middle" class="t-sm t-b">6 Pretesting</text>
            <text x="10" y="30" class="t-sm t-mut">then: coding</text>
          </svg>
      - kind: order
        page: 10
        quote: "Questionnaire design process.\n    What Information Is Needed?\n    How Should Individual Questions Be Framed?\n    What Should Be the Structure of the Question?\n      – Unstructured Questions\n      – Structured Questions\n    How Should the Question Be Worded?\n    Formatting the Questionnaire\n    Pretesting"
        prompt: "رتّب خطوات الـ questionnaire design:"
        steps:
          - "What information is needed?"
          - "How should individual questions be framed?"
          - "Structure of the question"
          - "Wording of the question"
          - "Formatting the questionnaire"
          - "Pretesting"
        why: "بتبدأ بالمعلومة اللي محتاجها، وبعدين محتوى كل سؤال، شكله (open أو closed)، صياغته، شكل الورقة، وآخر حاجة تجرّبه."
      - kind: explain
        page: 15
        quote: "What Information Is Needed?\n  The first step in questionnaire design is to specify the information needed.\n  A continual review of the earlier stages of the research project, particularly the specific components of the problem, the research questions, and the hypotheses, will help keep the questionnaire focused.\n  Make sure the questionnaire items match your research objectives."
        title: "الخطوة الأولى: إيه المعلومة اللي محتاجها؟"
        text: |
          أول خطوة = ==specify the information needed==.

          ارجع كل شوية للـ **problem** ومكوّناته، والـ **research questions**، والـ **hypotheses**. ده اللي بيخلّي الـ questionnaire **focused**.

          القاعدة: كل item في الورقة لازم يقابل **research objective**. سؤال مالوش objective؟ يتشال.
      - kind: check
        page: 71
        quote: "4. The first step in questionnaire design is:\n  (a) Development of specific questions.\n  (b) Formulation of a statistical analysis plan.\n  (c) Pretesting.\n  (d) Problem identification."
        question: "The first step in questionnaire design is:"
        options: ["Problem identification", "Development of specific questions", "Formulation of a statistical analysis plan", "Pretesting"]
        answer: 0
        why:
          - "صح، ده مفتاح الشريحة: الـ questionnaire بيبدأ من الـ problem وأسئلته، اللي بتقولك إيه المعلومة المطلوبة."
          - "كتابة الأسئلة بتيجي بعد ما تعرف المعلومة المطلوبة."
          - "الـ analysis plan مش من خطوات الـ questionnaire design هنا."
          - "الـ pretesting آخر خطوة."
      - kind: aside
        tone: trap
        page: 71
        quote: "4. The first step in questionnaire design is:\n  (a) Development of specific questions.\n  (b) Formulation of a statistical analysis plan.\n  (c) Pretesting.\n  (d) Problem identification."
        text: |
          الشريحة 15 بتقول أول خطوة «**specify the information needed**»، ومفتاح سؤال الشريحة 71 «**problem identification**». الاتنين نفس الفكرة: المعلومة المطلوبة جاية من الـ problem.

          لو الاختيارين جم مع بعض في سؤال، فكّر في صياغة السؤال؛ ولو جه زي الشريحة، اختار ==problem identification==.

          والدكتورة نفسها جاوبت في الفيديو: البداية **تحديد المشكلة والمعلومات المطلوبة**، يعني (d).
      - kind: explain
        page: 16
        quote: "How Should Individual Questions Be Framed?\n  The researcher must determine what should be included in each question.\n  This involves a determination of whether a question is necessary and whether more than one question is needed to obtain the information in an unambiguous way."
        title: "كل سؤال فيه إيه؟"
        text: |
          قبل ما تكتب أي سؤال، الباحث بيحدد ==هيدخل إيه في كل سؤال==. ده معناه سؤالين:

          1. ==السؤال ده لازم؟==
          2. ==محتاج أكتر من سؤال== علشان المعلومة تيجي من غير لبس (unambiguous)؟

          ليه السؤالين دول؟ كل سؤال زيادة بيطوّل الـ questionnaire ويزهّق المشارك، وكل سؤال فيه حاجتين بيجيب إجابة مش عارف تفسرها. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 18
        quote: "Is the Question Necessary?\n  There are exceptions to this rule:\n  Early in the interviewing process when the researcher is attempting to build a relationship with respondents and capture their attention, a few easy-to-answer neutral questions may be helpful.\n  At times, certain questions may also be repeated for the purpose of assessing reliability or validity."
        title: "السؤال ده لازم؟"
        text: |
          سؤال «حلو نعرفه» بس مالوش دعوة بالـ research problem؟ **يتشال**.

          إلا في حالتين:
          - في **أول** المقابلة: كام سؤال **neutral** سهل يبني **relationship** مع الـ respondent ويشد انتباهه.
          - سؤال **بيتكرر** عن قصد عشان تقيس الـ ==reliability== أو الـ **validity**.
      - kind: explain
        page: 20
        quote: "Pitfalls to Avoid\n  Questions that use the words “or\" or “and\" can lead to unsatisfactory responses - each question should contain only one concept.\n  Such a question is called a double-barreled question because two or more questions are combined into one."
        title: "الـ double-barreled question"
        text: |
          سؤال فيه «**or**» أو «**and**» غالبًا جواه سؤالين. ده اسمه ==double-barreled question==: اتنين أو أكتر متجمّعين في سؤال واحد.

          القاعدة: **كل سؤال = concept واحد**.

          «بتدخن وبتشرب كحول؟» لو قال «لأ»، يقصد مش بيعمل الاتنين، ولا مش بيعمل واحد منهم؟ مش هتعرف.
      - kind: case
        page: 21
        quote: "To avoid confusion, these questions should be asked separately,\n  How many cups of the following do you drink during a typical day?\n  Coffee: ----- cups/day\n  Tea: -----cups/day"
        stem: "في بحث عن الـ caffeine والـ palpitations، السؤال: «How many cups of coffee or tea do you drink during a day?»"
        steps:
          - question: "What is wrong with it?"
            options: ["Double-barreled: two concepts in one question", "Built-in assumption", "Too sensitive", "Needs aided recall"]
            answer: 0
            why: "القهوة والشاي اتنين concepts. رقم واحد مش هيتقسم عليهم."
          - question: "Best fix?"
            options: ["Coffee ___ cups/day; Tea ___ cups/day, on a typical day", "Add a \"don't know\" option", "Move it to the end"]
            answer: 0
            why: "زي الشريحة: كل مشروب لوحده، في **typical day**."
      - kind: mnemonic
        page: 20
        quote: "Questions that use the words “or\" or “and\" can lead to unsatisfactory responses - each question should contain only one concept."
        word: "ONE"
        parts:
          - { key: "O", text: "Only one concept per question: or/and = double-barreled" }
          - { key: "N", text: "Neutral easy questions early to build the relationship: the allowed extra" }
          - { key: "E", text: "Eliminate nice-to-know questions that don't serve the research problem" }
        hook: "كل سؤال = **ONE** فكرة."
      - kind: try
        items: [res.L10.015, res.L10.019, res.L10.020]
    recap:
      - "Questionnaire = أسئلة formalized تترجم احتياجك لأسئلة الـ respondent يقدر يجاوبها."
      - "أهميته: standardization، speed وaccuracy، data processing."
      - "الخطوات: information ← framing ← structure ← wording ← format ← pretesting."
      - "Double-barreled = سؤالين في واحد (or/and): اسألهم منفصلين."
    practice: [res.L10.012, res.L10.013, res.L10.014, res.L10.015, res.L10.016, res.L10.017, res.L10.018, res.L10.019, res.L10.020, res.L10.021, res.L10.022, res.L10.110]
