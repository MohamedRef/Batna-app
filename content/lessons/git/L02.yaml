        quote: "Once sub-mucosal tunnneling is completed, selective myotomy was performed by division of the inner circular muscle fibers, 2 cm distal to the mucosotomy site and extended distally 2 cm past the GEJ into the cardia using spray coagulation or cutting current."
        title: "ليه الأرقام دي بالذات؟"
        text: |
