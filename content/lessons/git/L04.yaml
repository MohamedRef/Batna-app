        answer: 0
        why:
          - "صح: الـ adenocarcinoma **15–30%**، والـ SCC **5–13%**."
          - "الأرقام معكوسة: الـ SCC 5–13% بس."
          - "الكتاب بيقول أكتر في الـ adenocarcinoma."
          - "الكتاب: الـ HER2 أعلى في الـ EGJ adenocarcinoma من الـ gastric."
      - kind: explain
        page: 148
        quote: "HER2 testing is recommended for all patients with esophageal or EGJ cancer at the time of diagnosis if metastatic disease is documented or suspected"
        title: "التحاليل الجزيئية"
        text: |
          في الـ advanced أو metastatic disease بنعمل 3 تحاليل: **human epidermal growth factor receptor 2 (HER2)**, **microsatellite instability (MSI)**, و**PD-L1**.

          - **HER2**: positivity معناها invasion و nodes أكتر، يعني prognosis أوحش. أكتر في adenocarcinoma (15-30%) من squamous cell carcinoma (SCC) (5-13%)، وأعلى في الـ esophagogastric junction (EGJ) من المعدة. الـ ==HER2 testing== لكل مريض metastatic أو suspected عند التشخيص.
          - **MSI-H/dMMR**: الـ Food and Drug Administration (FDA) وافقت على **pembrolizumab** ليهم في الـ second line، فبنفحصه في كل esophageal/EGJ adenocarcinoma metastatic.
      - kind: figure
