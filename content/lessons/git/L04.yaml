      - kind: reveal
        page: 162
        quote: "The extent of gastric resection depends on:"
        prompt: "حجم الـ gastric resection بيتحدد بإيه، وليه؟"
        answer: |
          الكتاب: ==tumor size==، **location**، و **depth of invasion**.

          التفسير المقبول (مش في الكتاب): الهدف إنك تشيل الورم بـ **حواف سليمة** وتسيب أكبر جزء من المعدة. ورم صغير في الـ antrum ممكن يكفيه distal gastrectomy، أما ورم كبير في الـ body أو الـ fundus أو ورم بيتسرب (linitis) فمحتاج total gastrectomy علشان الحافة تبقى سليمة. والـ depth بيقولك محتاج تشيل nodes قد إيه.
      - kind: reveal
        page: 162
        quote: "Partial responses in 30-50% of cases are transient."
        prompt: "الـ chemo في سرطان المعدة المتقدم بيعمل إيه بالظبط؟"
        answer: |
          الكتاب: **cisplatin + epirubicin + infusional 5-FU** أو + irinotecan. الـ **complete remissions are uncommon**، والـ ==partial responses في 30-50% transient==، والتأثير على الـ survival **unclear**. بس الـ **perioperative** والـ postoperative chemo + radiation بيقللوا الـ recurrence ويطوّلوا العمر.

          التفسير المقبول (مش في الكتاب): الفرق بين الجملتين مهم: الـ chemo **لوحده** في المرض المنتشر بيصغّر الورم شوية ومؤقتًا. أما **مع الجراحة** فهو بيضرب الخلايا القليلة اللي هربت قبل ما تكبر. يعني الـ chemo أقوى لما يكون العدو صغير.
      - kind: match
        page: 162
        quote: "Bevacizumab A humanized monoclonal antibody that binds the vascular endothelial growth factor ligand."
        prompt: "وصّل كل targeted drug بهدفه:"
        pairs:
          - ["Bevacizumab", "VEGF ligand"]
          - ["Erlotinib, gefitinib", "EGFR tyrosine kinase"]
          - ["Cetuximab", "EGFR antibody"]
        why: "Bevacizumab antibody على الـ VEGF (اتدّى بأمان مع cisplatin + irinotecan). Erlotinib و gefitinib tyrosine kinase inhibitors (TKIs) بنشاط متواضع. Cetuximab antibody للـ epidermal growth factor receptor (EGFR) لسه under study."
      - kind: explain
        page: 162
        quote: "Concluded that Bevacizumab could safely be given with cytotoxic"
        title: "Bevacizumab والورم لسه في مكانه"
        text: |
          الكتاب: **Bevacizumab** humanized monoclonal antibody بيمسك الـ **VEGF ligand**. في phase II study (Shah et al.) اتدّى مع **cisplatin + irinotecan** بجرعة 15 mg/kg كل 3 أسابيع، والنتيجة: ==ممكن يتدّى بأمان مع الـ cytotoxic chemotherapy، حتى والورم الأصلي لسه في مكانه==. والـ **erlotinib** و **gefitinib** (EGFR tyrosine kinase inhibitors) نشاطهم لوحدهم **modest**، والـ **cetuximab** لسه under study.

          التفسير المقبول (مش في الكتاب): ليه «الورم لسه في مكانه» نقطة مهمة؟ لأن الـ anti-VEGF بيأثر على الأوعية الدموية، والخوف كان إن ورم المعدة اللي لسه موجود ينزف أو يخرم. الدراسة قالت إن ده مش مانع. والـ VEGF هو الإشارة اللي الورم بيبعتها علشان يعمل أوعية جديدة تأكّله، فلما تمسكه بتجوّع الورم.
      - kind: explain
        page: 163
        quote: "Treatment of infection from aspiration or spontaneous bacterial peritonitis."
        title: "الـ supportive treatment"
        text: |
          الكتاب:
          - **Nutrition**: jejunal enteral feedings أو total parenteral nutrition.
          - تصحيح الـ **metabolic abnormalities** من الترجيع أو الإسهال.
          - علاج الـ **infection** من الـ ==aspiration== أو الـ **spontaneous bacterial peritonitis**.
          - **Lumen patency**: endoscopic **laser** أو **stenting** للـ palliation.

          التفسير المقبول (مش في الكتاب): كل بند هنا ليه سبب من الورم نفسه: الورم اللي بيسد الـ pylorus بيعمل ترجيع، فالمريض يفقد حمض وبوتاسيوم (metabolic alkalosis)، وممكن يشفط الترجيع لصدره (aspiration). والـ ascites من الـ peritoneal spread ممكن تتلوث (SBP). وليه **jejunal** feeding؟ لأن المعدة نفسها مسدودة أو مش بتفضى، فلازم الأكل ينزل بعدها.
      - kind: check
        page: 163
        quote: "To maintain lumen patency, endoscopic laser treatment or stenting for"
        question: "Inoperable gastric cancer now blocks the outlet; the patient vomits everything. Which option does the lecture list to keep the lumen open?"
        options: ["Endoscopic stenting or laser", "Gastrostomy feeding", "Bevacizumab alone", "Repeat staging CT"]
        answer: 0
        why:
          - "صح: الكتاب: to maintain lumen patency، endoscopic laser treatment أو stenting for palliation."
          - "الـ gastrostomy بتحط الأكل في المعدة المسدودة نفسها. التغذية في الكتاب jejunal أو parenteral."
          - "مفيش دوا هيفتح السدة بسرعة، والمريض محتاج حل النهارده."
          - "الـ CT مش علاج، والمريض محتاج يبلع."
      - kind: explain
        page: 163
        quote: "Primary gastric lymphoma is still relatively uncommon, accounting for less than 15% of gastric malignancies and 2% of lymphomas."
        title: "Gastric lymphoma"
        text: |
          - المعدة أشهر مكان لـ gastrointestinal (GI) lymphoma، بس الـ primary gastric lymphoma أقل من 15% من الـ gastric malignancies.
          - أعراض vague: epigastric pain، early satiety، fatigue. الـ **B symptoms** نادرة جدًا.
          - العقد السادس والسابع، رجالة:ستات 2:1، وأشهر مكان الـ **antrum**.
          - الأنواع: ==Diffuse large B-cell lymphoma (DLBCL) 55%==، **mucosa-associated lymphoid tissue (MALT) 40%**، Burkitt 3%، mantle و follicular أقل من 1%.
          - الـ MALT غالبًا قبله **H. pylori gastritis**.

          التفسير المقبول (مش في الكتاب): ليه الأعراض vague والـ B symptoms نادرة؟ لأن الورم غالبًا محصور في المعدة في الأول، فبيعمل أعراض معدة عادية زي الـ dyspepsia، والأعراض العامة (حرارة، عرق بالليل) بتيجي لما المرض ينتشر في الجسم.
      - kind: reveal
        page: 163
        quote: "In the management of gastric lymphomas, it is important to determine not only"
        prompt: "في الـ gastric lymphoma، ليه الـ subtype مهم زي الـ stage بالظبط؟"
        answer: |
          الكتاب: في علاج الـ gastric lymphoma لازم تعرف ==مش بس الـ stage، لكن كمان الـ subtype==.

          التفسير المقبول (مش في الكتاب): لأن الاتنين الأشهر عكس بعض. الـ **MALT** بطيء ومربوط بالـ H. pylori، وممكن يخف بمضاد حيوي. الـ **DLBCL** سريع وعدواني ومحتاج chemo. فنفس الـ stage IE ممكن علاجه كورس مضاد حيوي أو CHOP، على حسب نوع الخلية بس.
      - kind: try
        items: [git.L04.112, git.L04.113, git.L04.116, git.L04.120, git.L04.245]
    recap:
      - "Stage I-III: potentially curable، multidisciplinary وجراحة حسب الـ size والـ location والـ depth؛ stage IV: palliative، والـ systemic بيطوّل العمر."
      - "Chemo: cisplatin + epirubicin + 5-FU أو irinotecan؛ partial 30-50% مؤقتة؛ perioperative بيقلل الـ recurrence؛ bevacizumab (VEGF) آمن مع الـ chemo."
      - "Supportive: jejunal أو TPN، تصحيح الـ metabolic، aspiration و SBP، laser أو stent؛ lymphoma: المعدة أشهر مكان، DLBCL 55% و MALT 40%."
