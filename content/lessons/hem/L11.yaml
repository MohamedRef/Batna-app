        quote: "Updated IMWG Criteria\n| MGUS | Smoldering Multiple Myeloma | Multiple Myeloma |\n| M protein < 3 g/dL | M protein ≥ 3 g/dL (serum) or ≥ 500 mg/24 hrs (urine) | Underlying plasma cell proliferative disorder |\n| Clonal plasma cells in BM < 10% | Clonal plasma cells in BM 10% to 60% | > 10% clonal plasma cells (for diagnosis) |\n| No myeloma defining events | No other myeloma defining events | AND 1 or more myeloma-defining events: ≥ 1 CRAB* feature; > 1 MRI focal lesion; Serum free light chain ratio ≥ 100; Clonal plasma cells in BM ≥ 60%† |"
        word: "SLIM"
