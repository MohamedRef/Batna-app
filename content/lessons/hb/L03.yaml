  - id: hb.L03.lesson3
    title: "من الضغط للدوالي"
    hook: "عشرة تبني، اتناشر تفرقع. وليه الدوالي اللي نزفت مرة هتنزف تاني في 63% من الحالات؟"
    minutes: 8
    pages: [43, 45]
    topics: [csph, phg]
    goals:
      - "تعرّف الـ CSPH وتقول هو بيتنبأ بإيه"
      - "تحفظ أرقام الـ HVPG: 10 للتكوين و 12 للنزيف"
      - "ترسم الـ natural history للـ varices بالنسب، ومستوى الوقاية في كل مرحلة"
      - "تعرف إن الـ PHG تشخيصها بالمنظار"
    status: unverified
    steps:
      - kind: explain
        page: 43
        quote: "Defined as an HVPG >10 mmHg. This pressure predicts the development of varices, clinical decompensation and HCC"
        title: "الـ CSPH: الرقم اللي بيفرق"
        text: |
          الـ ==clinically significant portal hypertension (CSPH)== هو **hepatic venous pressure gradient (HVPG)** أكتر من 10 mmHg.

          الرقم ده مش اعتباطي. الضغط ده بيتنبأ بتلات حاجات:
          - **Development of varices**
          - **Clinical decompensation**
          - **Hepatocellular carcinoma (HCC)**

          يعني الـ 10 mmHg هي الخط اللي بعده المرض بيبدأ يعمل أعراض ومضاعفات.

          وفي الـ biopsy بتاع مريض الـ cirrhosis، فيه finding**ين** بيتنبأوا بالـ CSPH independently:
          - **Thick fibrous septae**
          - **Small nodule size**

          منطقي: septa تخينة ونودولز صغيرة كتير يعني تليف أكتر بين كل نودول والتاني، فالكبد مقفول أكتر والـ resistance أعلى.
      - kind: figure
        page: 43
        quote: "| Free HVP | Wedged HVP | Free HVP |\n|---|---|---|\n| | HVPG=10 mmHg | |"
        title: "الـ HVPG على الشاشة"
        image: { file: hb/L03-hvpg-catheter.webp, book: true }
        alt: "Book figure: two fluoroscopy images of a catheter in a hepatic vein. A, the balloon is inflated (wedged), and contrast fills the sinusoids in a circled area. B, the free position. Below, a pressure tracing: free HVP, a step up to wedged HVP, then back to free HVP, labelled HVPG = 10 mmHg."
        caption: "الكتاب ما كتبش شرح تحت الصورة دي، فده التفسير المقبول (مش في الكتاب): في A البالونة مقفولة والصبغة مالية الـ sinusoids (الدايرة)، فالقراية هي الـ wedged، و B هو الـ free. في الرسم اللي تحت: الفرق بين الـ wedged والـ free هو الـ HVPG، وهنا 10 mmHg بالظبط، يعني على حافة الـ CSPH اللي لسه قايلينه."
      - kind: figure
        page: 43
        quote: "Natural history of oesophageal varices:\n  Increased portal pressure (HVPG > 10 mmHg)\n  ↓ Formation of varices\n  ↓ Dilatation\n  ↓ Rupture of varices (HVPG > 12 mmHg)"
        title: "التاريخ الطبيعي للدوالي في الكتاب: الأرقام"
        image: { file: hb/L03-varices-hvpg-steps.webp, book: true }
        alt: "Book flowchart of four boxes joined by thick down arrows: increased portal pressure (HVPG > 10 mmHg), formation of varice, dilatatio, rupture of varices (HVPG > 12 mmHg)."
        caption: |
          أربع صناديق من فوق لتحت، بأسهم تخينة:

          1. **Increased portal pressure (HVPG > 10 mmHg)**
          2. **Formation of varice**
          3. **Dilatatio** (يعني dilatation، الدالية بتكبر)
          4. **Rupture of varices (HVPG > 12 mmHg)**

          الرقمين اللي في أول صندوق وآخر صندوق هما اللي يتحفظوا: ==10 للتكوين و 12 للانفجار==. الرسمة اللي بعدها بتحط نفس الأرقام على ترمومتر ومعاها أرقام زيادة من برّه الكتاب.
      - kind: figure
        page: 43
        quote: "Natural history of oesophageal varices:\n  Increased portal pressure (HVPG > 10 mmHg)\n  ↓ Formation of varices\n  ↓ Dilatation\n  ↓ Rupture of varices (HVPG > 12 mmHg)"
        title: "ترمومتر الـ HVPG"
        alt: "A vertical HVPG scale in mmHg from 0 at the bottom to 25 at the top. 1 to 5 is normal. Above 5 is portal hypertension (Baveno VII). Above 10 is CSPH: varices form, and it predicts decompensation and HCC. Above 12 varices can rupture and bleed. Above 20 marks a high-risk bleeder in whom early TIPS improves survival."
        caption: "اطلع على الترمومتر: أكتر من 10 الدوالي تتكوّن، أكتر من 12 ممكن تنفجر، أكتر من 20 نزيف high-risk (هنرجعله مع الـ transjugular intrahepatic portosystemic shunt (TIPS)). الـ 5 من Baveno VII مش من الكتاب."
        svg: |
          <svg viewBox="0 0 330 310" xmlns="http://www.w3.org/2000/svg">
