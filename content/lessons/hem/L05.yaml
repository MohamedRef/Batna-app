        text: "علشان نمنع الـ **recurrent thrombosis**: الـ **direct oral anticoagulant (DOACs)** (خصوصًا rivaroxaban) نتجنبها في الـ **triple-positive** وفي الـ arterial APS، والـ **warfarin** هو الاختيار الأول."
