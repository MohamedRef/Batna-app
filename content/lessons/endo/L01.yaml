        text: |
          **Autosomal dominant**. المريض ممكن يبقى عنده:
          1. ==Medullary thyroid carcinoma== (**>90%**): mild to moderate aggressiveness؛ في الـ 3rd–4th decade في الـ familial، والـ 6th في الـ sporadic.
          2. **Hyperparathyroidism** (20–50%): hyperplasia أو multiple adenomas.
          3. **Pheochromocytoma** (20–50%): غالبًا ==bilateral==.

          ليه الـ familial بيظهر بدري (30–40) والـ sporadic متأخر (60)؟ التفسير المقبول (مش في الكتاب): في العيلة كل **C cell** مولودة بالضربة الأولى، فمحتاجة ضربة واحدة بس. في الـ sporadic خلية واحدة لازم تاخد الضربتين صدفة، وده بياخد عمر. ونفس المنطق بيفسّر ليه الـ pheo هنا **bilateral** وليه الـ parathyroid **hyperplasia أو multiple**: المرض في كل الغدة، مش في عقدة واحدة.
