          - "6 months"
          - "One year, like APL"
          - "Until the first remission only"
        answer: 0
        why:
          - "صح: الـ maintenance سنتين لتلاتة."
          - "6 شهور قليلة جدًا على الـ ALL."
          - "السنة دي maintenance الـ ATRA في الـ APL."
          - "الـ remission هو البداية؛ الـ maintenance بعدها."
      - kind: explain
        page: 115
        title: "الـ maintenance"
        quote: "Methotrexate: 20 mg/m2 orally once weekly."
        text: |
          لمدة ==2–3 years==:
          - **Prednisone 40–60** أو dexamethasone 6 mg/m2/day لمدة **5 أيام كل 28 يوم**
          - **Vincristine** 1.4 mg/m2 (max 2 mg) كل 4 أسابيع
          - **6-MP** 75 mg/m2 يوميًا بالليل
          - ==Methotrexate== 20 mg/m2 بالبق **مرة في الأسبوع**
      - kind: aside
        tone: trap
