  # ------------------------------------------------------------------
  - id: geri.L09.lesson3
    title: "التطعيم في الكبير: ليه أضعف وإزاي نقوّيه"
    hook: "90% من وفيات الإنفلونزا كبار، والتطعيم بيشتغل أضعف عندهم. طب نعمل إيه؟"
    minutes: 9
    pages: [161, 162]
    topics: [vaccination]
    goals:
      - "تعرف أهمية التطعيم وتوصية الـ influenza فوق 65 وليه"
      - "تحفظ استراتيجيات التطعيم الأقوى للكبير وسبب كل واحدة"
      - "تعرف تطعيمَي الـ shingles والفرق بينهم"
    status: unverified
    steps:
      - kind: explain
        page: 161
        title: "ليه التطعيم مهم كده؟"
        quote: "Vaccination represents a cost-effective and efficient way to protect people from morbidity and mortality due to infections. Elderly people account for approximately 90% of all influenza-related deaths."
        text: |
          - التطعيم **cost-effective** وبيقلل الـ morbidity والـ mortality.
          - الكبار ==حوالي 90%== من وفيات الـ influenza.
          - الـ infection بيبوّظ الأمراض اللي موجودة، فالتطعيم = **healthy independent living**.
          - بس الـ ==efficacy بتقل مع السن==.

          ليه الكبار بالذات 90%؟ الكتاب بيدّي السبب: الـ infections ==بتسرّع أو بتبوّظ== المشاكل الصحية اللي موجودة أصلًا. التفسير المقبول (مش في الكتاب): الإنفلونزا عند واحد عنده heart failure أو COPD مش «برد»، دي ممكن تقلب القلب أو الصدر. يعني الوقاية هنا مش رفاهية، دي اللي بتخلّي الكبير **independent**.

          وليه الـ efficacy بتقل؟ ده كل اللي اتعلمناه: naive cells أقل، dendritic cells بتعرض أضعف، و B cells antibody response أضعف.
      - kind: figure
        page: 161
        quote: "Table 1. Some Common Infections in Older Adults"
        title: "جدول الكتاب: العدوى الشايعة في الكبار حسب المكان"
        image: { file: geri/L09-common-infections.webp, book: true }
        alt: "The book's Table 1 of common infections in older adults in three groups: community-acquired (chronic bronchitis, Clostridium difficile and infectious diarrhoea, cellulitis, native-valve endocarditis, infected diabetic foot ulcer, intra-abdominal infection, pneumonia, pyelonephritis, acute sinusitis, catheter-associated urosepsis, symptomatic UTI); hospital-acquired (C. difficile diarrhoea, IV catheter infection, pneumonia, catheter urosepsis, wound infection); and nursing home-acquired (C. difficile colitis, infected pressure ulcer, pneumonia including TB, urosepsis)."
        caption: |
          الجدول بيقسّم العدوى حسب المكان اللي الكبير جاي منه، 3 مجموعات من فوق لتحت:

          - **Community-acquired** (أطولهم): bronchitis، cellulitis، endocarditis، diabetic foot، intra-abdominal (appendicitis، cholecystitis، diverticulitis)، ==pneumonia==، pyelonephritis، و UTI.
          - **Hospital-acquired**: **C difficile** diarrhea، عدوى الكانيولا، pneumonia، urosepsis من القسطرة، و wound infection.
          - **Nursing home-acquired**: C difficile colitis، ==infected pressure ulcer==، pneumonia (فكّر في الـ **TB**)، و urosepsis.

          اللي تاخده: الـ **pneumonia** والـ **urosepsis** موجودين في الـ 3 أماكن، فدوّر عليهم الأول في أي كبير "مش على بعضه".
      - kind: explain
        page: 161
        quote: "It is generally recommended that every one over 65 years, receive the seasonal trivalent inactivated influenza vaccine (TIV) as well as pandemic influenza vaccine, if applicable, in order to maintain serum antibody level."
        title: "التوصية في الكتاب"
        text: |
          كل واحد ==فوق 65== ياخد:
          - الـ **seasonal trivalent inactivated influenza vaccine (TIV)**
          - والـ **pandemic influenza vaccine** لو فيه

          والكتاب بيقول الهدف: **to maintain serum antibody level**.

          ليه كل سنة؟ التفسير المقبول (مش في الكتاب): الـ antibodies اللي التطعيم بيعملها بتقل مع الوقت، والكبير أصلًا بيعمل أقل، وسلالات الإنفلونزا بتتغير كل موسم. فالجرعة السنوية بترجّع المستوى وبتغطي السلالة الجديدة.
      - kind: update
        page: 161
        quote: "It is generally recommended that every one over 65 years, receive the seasonal trivalent inactivated influenza vaccine (TIV) as well as pandemic influenza vaccine, if applicable, in order to maintain serum antibody level."
        text: "الـ **US Centers for Disease Control and Prevention (CDC) US Advisory Committee on Immunization Practices (ACIP)** من 2022 بيفضّل للـ 65+ vaccine **high-dose** أو **adjuvanted** أو **recombinant** influenza. في الامتحان إجابة الكتاب: الـ seasonal TIV."
        ref: "CDC ACIP influenza recommendations 2024–25"
      - kind: check
        page: 161
        quote: "It is generally recommended that every one over 65 years, receive the seasonal trivalent inactivated influenza vaccine (TIV) as well as pandemic influenza vaccine, if applicable, in order to maintain serum antibody level."
        question: "Per the book, who should get the seasonal trivalent inactivated influenza vaccine?"
        options:
          - "Everyone over 65 years"
          - "Only over-65s with COPD"
          - "Only care-home residents"
          - "Only adults under 65"
        answer: 0
        why:
          - "صح: الكتاب بيقول ==every one over 65 years==، ومعاه الـ pandemic vaccine لو فيه."
          - "مش بس اللي عنده COPD: التوصية لكل اللي فوق 65."
          - "مش بس اللي في care home."
          - "العكس: التوصية للي فوق 65."
      - kind: mnemonic
        page: 161
        quote: "Novel Approach to Vaccination\n  Increasing vaccine dosage.\n  Use of adjuvants: TIV MF59, TLR agonists.\n  Introducing viral vector-based vaccine."
        word: "DAV"
        parts:
          - { key: "D", text: "Dose: increasing vaccine dosage" }
          - { key: "A", text: "Adjuvants: an oil-in-water vaccine adjuvant (MF59), Toll-like receptor (TLR) agonists" }
          - { key: "V", text: "Viral vector-based vaccine" }
        hook: "الـ **novel approach to vaccination** تلاتة: ==DAV== (زي «داوي»): Dose، Adjuvant، Vector."
      - kind: explain
        page: 161
        quote: "Novel Approach to Vaccination\n  Increasing vaccine dosage.\n  Use of adjuvants: TIV MF59, TLR agonists.\n  Introducing viral vector-based vaccine."
        title: "ليه الـ DAV بيشتغل؟"
        text: |
          الـ **novel approach** في الكتاب تلاتة، والتفسير المقبول (مش في الكتاب) لكل واحد:
          - **Increasing vaccine dosage**: الـ naive cells قليلة، فلما تدّيها antigen أكتر بتزوّد فرصة إن الخلية الصح تلاقيه. يعني نعوّض القلة بالكمية.
          - **Adjuvants** (MF59، TLR agonists): الـ adjuvant بيصحّي الـ innate immunity. وافتكر إن الـ TLR function في الـ dendritic cells بتقل مع السن (صفحة 158)، فالـ TLR agonist بيزقّ الحسّاس الضعيف ده بالظبط.
          - **Viral vector-based vaccine**: الفيروس الحامل بيدخل الخلية ويخليها تعرض الـ antigen زي الـ infection الطبيعية، فالرد بيبقى أقوى.
      - kind: table
        page: 162
        quote: "Vaccine strategies\n| Infectious diseases | Strategies towards more effective vaccines for the elderly | Potential mechanisms |\n|---|---|---|\n| Influenza | Increased amount of Ags. Quadrivalent instead of trivalent strains. Repeated vaccinations. | Increased Ag availability: increased immunogenicity; avoid vaccine mismatch. Increased immunogenicity. |\n| | Mucosal or subcutaneous microneedle-intradermal administration. | Increased efficiency of vaccine delivery. Increased Ag presentation activities. |\n| | Adjuvants (MF59, AS03). | Enhanced immunogenicity. |\n| Shingles | Increased viral titers for VZV live-attenuated shingles vaccines (>10 times higher titers than chickenpox vaccines). | Increased Ag availability. |\n| | Major Ag with adjuvants (Subunit glycoprotein E vaccine with AS01). | Induction of robust and persistent VZV-specific Ab and CD4+ T cell responses. |"
        title: "نخلّي التطعيم أقوى إزاي؟"
        columns: [Strategy, Why it helps]
        rows:
          - ["More antigen / higher dose", "More Ag available"]
          - ["Quadrivalent not trivalent", "Avoids vaccine mismatch"]
          - ["Repeated doses", "More immunogenic"]
          - ["Intradermal microneedle", "Better delivery and Ag presentation"]
          - ["Adjuvants (MF59، AS03)", "Enhanced immunogenicity"]
        hide: [[1, 1], [3, 1], [4, 1]]
      - kind: explain
        page: 162
        quote: "Vaccine strategies\n| Infectious diseases | Strategies towards more effective vaccines for the elderly | Potential mechanisms |\n|---|---|---|\n| Influenza | Increased amount of Ags. Quadrivalent instead of trivalent strains. Repeated vaccinations. | Increased Ag availability: increased immunogenicity; avoid vaccine mismatch. Increased immunogenicity. |\n| | Mucosal or subcutaneous microneedle-intradermal administration. | Increased efficiency of vaccine delivery. Increased Ag presentation activities. |\n| | Adjuvants (MF59, AS03). | Enhanced immunogenicity. |\n| Shingles | Increased viral titers for VZV live-attenuated shingles vaccines (>10 times higher titers than chickenpox vaccines). | Increased Ag availability. |\n| | Major Ag with adjuvants (Subunit glycoprotein E vaccine with AS01). | Induction of robust and persistent VZV-specific Ab and CD4+ T cell responses. |"
        title: "جدول الكتاب: كل استراتيجية وسببها"
        text: |
          الكتاب نفسه حاطط عمود **potential mechanisms**، يعني السبب مكتوب:
          - **Increased amount of Ags** ← increased Ag availability، يعني ==increased immunogenicity==.
          - **Quadrivalent بدل trivalent** ← ==avoid vaccine mismatch==: سلالة زيادة، فاحتمال إن السلالة اللي جت مش في التطعيم يقل.
          - **Repeated vaccinations** ← increased immunogenicity.
          - **Mucosal أو subcutaneous microneedle-intradermal** ← increased efficiency of delivery و increased Ag presentation.
          - **Adjuvants (MF59، AS03)** ← enhanced immunogenicity.

          التفسير المقبول (مش في الكتاب) للـ intradermal: الجلد مليان dendritic cells، فلو حطيت الـ antigen جنبهم على طول، بتوفّر عليهم المشوار.
      - kind: explain
        page: 162
        quote: "Major Ag with adjuvants\n  (Subunit glycoprotein E\n  vaccine with AS01)."
        title: "الـ Shingles: تطعيمين"
        text: |
          - **Live-attenuated varicella zoster virus (VZV)**: titers ==أعلى من 10 مرات== من تطعيم الجديري ← increased Ag availability.
          - **Subunit glycoprotein E + a liposomal vaccine adjuvant system (AS01)**: major Ag مع adjuvant ← antibody و CD4+ T-cell response ==robust and persistent==.

          ليه الجرعة أعلى بكتير من تطعيم الطفل؟ التفسير المقبول (مش في الكتاب): نفس فكرة الـ dose: الطفل عنده naive cells كتير يكفيها شوية antigen، والكبير محتاج أكتر عشان يوصل لنفس الرد. وليه الـ subunit بيشتغل؟ لأنه بيجمع الاتنين: الـ antigen الأهم، ومعاه adjuvant يصحّي الـ innate.
      - kind: figure
        page: 161
        quote: "Novel Approach to Vaccination\n  Increasing vaccine dosage.\n  Use of adjuvants: TIV MF59, TLR agonists.\n  Introducing viral vector-based vaccine."
        title: "4 طرق نقوّي بيها التطعيم"
        alt: "Four boxes around a weak elderly vaccine response: more antigen dose, adjuvants such as MF59 or TLR agonists, a viral vector, and a better route such as intradermal microneedle. Each arrow points to a stronger response."
        caption: "نقلّل أثر الـ immunosenescence بـ ==antigen أكتر==، و **adjuvant** يصحّي الـ innate، و **vector**، و **route** أقرب للـ dendritic cells."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="G09d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="10" y="10" width="140" height="44" rx="10" class="fg-box"/>
            <text x="20" y="37" class="t-sm">Dose: more antigen</text>
            <rect x="180" y="10" width="140" height="44" rx="10" class="fg-box"/>
            <text x="190" y="37" class="t-sm">Adjuvant: MF59, TLR</text>
            <rect x="10" y="176" width="140" height="44" rx="10" class="fg-box"/>
            <text x="20" y="203" class="t-sm">Viral vector</text>
            <rect x="180" y="176" width="140" height="44" rx="10" class="fg-box"/>
            <text x="190" y="203" class="t-sm">Route: intradermal</text>
            <rect x="95" y="90" width="140" height="50" rx="12" class="fg-good"/>
            <text x="108" y="112" class="t-sm t-b">Stronger response</text>
            <text x="108" y="130" class="t-sm">in older adults</text>
            <path d="M80 56 L120 88" class="fg-arrow" marker-end="url(#G09d)"/>
            <path d="M250 56 L210 88" class="fg-arrow" marker-end="url(#G09d)"/>
            <path d="M80 174 L120 142" class="fg-arrow" marker-end="url(#G09d)"/>
            <path d="M250 174 L210 142" class="fg-arrow" marker-end="url(#G09d)"/>
          </svg>
      - kind: check
        page: 162
        quote: "Major Ag with adjuvants\n  (Subunit glycoprotein E\n  vaccine with AS01)."
        question: "Which shingles vaccine gives robust, persistent VZV-specific antibody and CD4+ T-cell responses, per the book?"
        options:
          - "Subunit glycoprotein E vaccine with AS01"
          - "Trivalent inactivated influenza vaccine"
          - "Live vaccine at chickenpox-vaccine titers"
          - "Quadrivalent influenza vaccine"
        answer: 0
        why:
          - "صح: الـ ==subunit gE + AS01== = robust and persistent antibody و CD4+ response."
          - "ده تطعيم influenza مش shingles."
          - "العكس: الـ live shingles vaccine titers ==أعلى من 10 مرات== من تطعيم الجديري."
          - "ده influenza، والـ quadrivalent سببه إنه يمنع الـ mismatch."
      - kind: try
        items: [geri.L09.029, geri.L09.031, geri.L09.033, geri.L09.034, geri.L09.036]
    recap:
      - "الكبار ≈ 90% من وفيات الـ influenza، لأن الـ infection بتبوّظ الأمراض الموجودة."
      - "فوق 65: seasonal TIV (+ pandemic لو فيه) عشان الـ antibody level يفضل. الأحدث: high-dose أو adjuvanted."
      - "Novel: Dose، Adjuvant، Vector (DAV)؛ quadrivalent يمنع mismatch؛ intradermal = delivery أحسن."
