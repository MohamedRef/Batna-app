        text: |
          الـ R بيتحسب بالـ ==multiples of ULN==، مش بالأرقام الخام. اقسم كل إنزيم على الـ ULN بتاعه الأول، وبعدين اقسم الناتجين على بعض.

          وخلي بالك من الحدود: الكتاب بيقول **mixed (R 2–5)**، فلو طلعت **R 5.0** أو **R 2.0** بالظبط يبقى **mixed**.
      - kind: update
        page: 129
        text: "الـ EASL بتعدّ **R ≥ 5** hepatocellular و **R ≤ 2** cholestatic، يعني الحدود نفسها بتروح للطرفين. في الامتحان: إجابة الكتاب (**2–5 = mixed**)."
        ref: "EASL Clinical Practice Guidelines: Drug-induced liver injury 2019"
      - kind: check
        page: 129
        question: "ALT 600 U/L (ULN 40), ALP 150 U/L (ULN 120). What is R and the pattern?"
        options:
          - "R = 12: hepatocellular"
          - "R = 4: mixed"
          - "R = 1.25: cholestatic"
          - "R = 15: cholestatic"
        answer: 0
        why:
          - "صح: ALT = 600/40 = **15×**، ALP = 150/120 = **1.25×**، و R = 15 ÷ 1.25 = **12** > 5."
          - "دي 600/150 بالأرقام الخام من غير ULN، وده الفخ."
          - "1.25 ده الـ ALP multiple لوحده، مش الـ R."
          - "15 ده الـ ALT multiple، و R > 5 يعني hepatocellular مش cholestatic."
