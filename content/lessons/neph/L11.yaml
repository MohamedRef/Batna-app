          - { text: "Cinacalcet", bin: 1 }
          - { text: "Roxadustat", bin: 1 }
          - { text: "Low-dose aspirin", bin: 0 }
        why: "الآمن: labetalol و nifedipine و methyldopa و hydralazine، steroids و CNI و HCQ و azathioprine، EPO و iron، calcium binders و calcitriol، heparin، vitamins و folic acid و aspirin. الممنوع: RAS inhibitors و atenolol و spironolactone، MMF و mTOR و cyclophosphamide، HIF-PH inhibitors، cinacalcet، warfarin و DOACs، NSAIDs و statins."
      - kind: aside
        tone: exam
        page: 372
        quote: "should be discontinued 6 weeks before conception or at the diagnosis of pregnancy because of their high risk for teratogenicity"
        text: |
          ==ACEi/ARB==: تقف **6 أسابيع** قبل الحمل أو أول ما يتعرف. في الأول: malformations (قلب بالذات) و stillbirth. في التاني والتالت: **oligohydramnios** وموت الجنين. والـ **SGLT2i** كمان تقف 6 أسابيع قبل.
      - kind: update
        page: 373
        quote: "In July 2021, however, the United States Food and Drug Administration requested to remove this recommendation"
        text: "الـ Fig 3 بيحط الـ statins في الممنوع، لكن النص بيقول إن الـ FDA في يوليو 2021 طلبت تشيل الـ contraindication (ومازالت بتنصح أغلب الحوامل يوقفوها). في الامتحان: الـ statins مش بتتدي في الحمل على الغسيل حسب الكتاب."
        ref: "FDA Drug Safety Communication, July 2021"
