          **Diet**: **no nutritional problems or dietary limitations**. العيان ياكل عادي، لأن الكبد لسه بيصنع الـ bile، وهي بس بتنزل على طول من غير مخزن.

          **Diarrhoea**: بعضهم يجيلهم، غالبًا لأن ==bile salt malabsorption in the ileum== كانت موجودة واتكشفت (**unmasked**).
