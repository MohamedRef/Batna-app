lecture: geri.L12
lessons:
  # ------------------------------------------------------------------
  - id: geri.L12.lesson1
    title: "الإساءة اللي محدش بيشوفها"
    hook: "واحد من كل 10 كبار بيتأذي من اللي بيرعاه كل سنة، وأغلبهم مش هيقولولك. إزاي تسأل صح؟"
    minutes: 8
    pages: [210, 213]
    topics: [definition, prevalence, easi, barriers]
    goals:
      - "تعرّف الـ elder abuse بتعريف الـ WHO"
      - "تعرف تعمل screening بالـ EASI وإمتى تبدأ بالـ Mini-Cog"
      - "تعرف ليه الأرقام دايمًا أقل من الحقيقة"
    status: unverified
    steps:
      - kind: explain
        page: 210
        quote: "Elder abuse is a single, or repeated act, or lack of appropriate action, occurring within any relationship where there is an expectation of trust"
        title: "التعريف"
        text: |
          تعريف الـ **WHO (2008)**: الـ ==elder abuse== هو فعل مرة واحدة أو متكرر، **أو غياب الفعل المناسب**، في أي علاقة فيها **توقّع ثقة**، وبيسبب أذى أو ضيق لشخص كبير.

          لاحظ الحاجتين المهمين:
          - **lack of appropriate action**: يعني الإهمال إساءة.
          - **expectation of trust**: الإساءة جاية من حد المفروض نثق فيه.

          والتعريف بيختلف بالثقافة: النرويج بتحط **family disharmony**، وفرنسا **moral cruelty**.
      - kind: explain
        page: 211
        quote: "U.S. estimates indicate that one out of 10 older adults experiences abuse or neglect by a caregiver each year."
        title: "قد إيه منتشر؟"
        text: |
          - موجود في الدول النامية والمتقدمة، و ==underreported== في كل حتة.
          - الأرقام موجودة بس في دول متقدمة قليلة: **1-10%**.
          - في أمريكا: **1 من كل 10** كبار بيتعرض لإساءة أو إهمال من اللي بيرعاه كل سنة.
          - التقارير بتزيد (APS: investigated +16.3%، substantiated +15.6% من 2000 لـ 2004)، بس اللي بيتبلّغ عنه جزء صغير بس.
          - ثقافيًا: أرامل بيتجوّزوا غصب، وستات كبار لوحدهم بيتّهموا بالسحر.
      - kind: explain
        page: 212
        quote: "The EASI includes five patient-answered items, plus one physician question"
        title: "الـ EASI"
        text: |
          الـ **Elder Abuse Suspicion Index**: اتعمله validation في الـ primary care، للمرضى ==cognitively intact== في الزيارات العادية.

          - **5 أسئلة** المريض بيجاوبها + **سؤال واحد** للدكتور.
          - **أي "yes" واحدة** في الأسئلة من 2 لـ 6 = محتاج assessment أكتر.
          - **Sensitivity 0.47**، **specificity 0.75**.
      - kind: figure
        page: 212
        quote: "When the physician does not know the patient or suspects dementia, the two-step process begins with screening for cognitive impairment with the Mini-Cog."
        title: "خطوة ولا خطوتين؟"
        alt: "Flow chart. Top question: do you know this patient over time and are they cognitively intact? Yes leads to one-step screening with EASI. No, or dementia suspected, leads to Mini-Cog. Mini-Cog negative leads to EASI. Mini-Cog positive leads to clarifying cognitive impairment before abuse screening. EASI with at least one yes to questions 2 to 6 leads to further assessment."
        caption: "مريض تعرفه وسليم ذهنيًا: EASI على طول. مريض جديد أو شاكك في dementia: Mini-Cog الأول."
        svg: |
          <svg viewBox="0 0 330 380" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="GL12a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="20" y="6" width="290" height="50" rx="8" class="fg-ink"/>
            <text x="32" y="27" class="t-sm t-b">Known over time and</text>
            <text x="32" y="45" class="t-sm t-b">cognitively intact?</text>
            <path d="M90 56L60 86" class="fg-arrow" marker-end="url(#GL12a)"/>
            <path d="M240 56L270 86" class="fg-arrow" marker-end="url(#GL12a)"/>
            <text x="40" y="76" class="t-sm t-good">yes</text>
            <text x="262" y="72" class="t-sm t-bad">no</text>
            <rect x="6" y="90" width="140" height="44" rx="8" class="fg-good"/>
            <text x="16" y="117" class="t-sm t-b">One step: EASI</text>
            <rect x="184" y="90" width="140" height="44" rx="8" class="fg-acc"/>
            <text x="194" y="117" class="t-sm t-b">Mini-Cog first</text>
            <path d="M220 134L190 170" class="fg-arrow" marker-end="url(#GL12a)"/>
            <path d="M290 134V170" class="fg-arrow" marker-end="url(#GL12a)"/>
            <text x="170" y="160" class="t-sm">neg</text>
            <text x="296" y="160" class="t-sm">pos</text>
            <rect x="120" y="174" width="110" height="40" rx="8" class="fg-good"/>
            <text x="138" y="199" class="t-sm t-b">EASI</text>
            <rect x="238" y="174" width="88" height="60" rx="8" class="fg-bad"/>
            <text x="244" y="194" class="t-sm">Clarify</text>
            <text x="244" y="210" class="t-sm">cognition</text>
            <text x="244" y="226" class="t-sm">first</text>
            <path d="M76 134V260M175 214V260" class="fg-thin"/>
            <rect x="20" y="262" width="290" height="50" rx="8" class="fg-box"/>
            <text x="32" y="284" class="t-sm t-b">1 or more yes to Q2-Q6</text>
            <text x="32" y="302" class="t-sm">= further assessment</text>
            <text x="20" y="346" class="t-sm t-mut">Sensitivity 0.47, specificity 0.75</text>
            <text x="20" y="366" class="t-sm t-mut">Mini-Cog: under 5 min, like MMSE</text>
          </svg>
      - kind: check
        page: 212
        quote: "When the physician does not know the patient or suspects dementia, the two-step process begins with screening for cognitive impairment with the Mini-Cog."
        question: "A new patient, 82, seems forgetful. First step in screening for abuse?"
        options: ["Mini-Cog", "EASI", "Ask the caregiver", "MMSE then EASI the same day"]
        answer: 0
        why:
          - "صح: مريض جديد وشاكك في dementia = two-step، أوله Mini-Cog."
          - "الـ EASI لوحده لمريض تعرفه وسليم ذهنيًا."
          - "الـ caregiver ممكن يكون هو اللي بيأذي."
          - "الكتاب بيقول Mini-Cog (أقل من 5 دقايق وكفاءته زي الـ MMSE)."
      - kind: aside
        tone: trap
        page: 212
        quote: "It has a sensitivity of 0.47 and a specificity of 0.75."
        text: "الـ EASI sensitivity بتاعته **0.47** بس. يعني أكتر من نص المرضى المتأذيين ممكن يطلعوا negative. الـ screen السلبي مش براءة؛ عينك تفضل مفتوحة على العلامات."
      - kind: explain
        page: 213
        quote: "Elder abuse is largely a hidden problem and tends to be committed in the privacy of the elderly person's home"
        title: "ليه الأرقام أقل من الحقيقة؟"
        text: |
          1. مشكلة ==hidden==: في البيت، وغالبًا من العيلة.
          2. الضحية **مش عايز يبلّغ**: خايف محدش يصدقه، يفقد استقلاله، يتحط في دار، يخسر السند الوحيد اللي ليه (لو المؤذي قريب)، أو ينتقم منه.
          3. الضحية **مش قادر يبلّغ**: cognitive decline ومرض.
          4. **قلة تدريب** الـ social workers والشرطة والتمريض.
          5. الإساءة **subjective**، بتعتمد على تفسير كل واحد.
          6. خلاف: نحسب الـ **self-neglect** ولا لأ؟ (مفيهوش مؤذي تاني).
      - kind: mnemonic
        page: 213
        quote: "fear of others' disbelief, fear of loss of independence, fear of being institutionalized, fear of losing their only social support"
        word: "DIIRS"
        parts:
          - { key: "D", text: "Disbelief: nobody will believe me" }
          - { key: "I", text: "Independence: I'll lose it" }
          - { key: "I", text: "Institution: they'll put me in a home" }
          - { key: "R", text: "Retaliation by the abuser" }
          - { key: "S", text: "Support: losing my only social support" }
        hook: |
          خمس مخاوف بتسكّت الضحية. لو المؤذي ابنه، الخوف الأكبر غالبًا الـ **S**: «لو بلّغت، مين هيرعاني؟»
      - kind: try
        items: [geri.L12.001, geri.L12.008, geri.L12.011, geri.L12.013, geri.L12.018]
    recap:
      - "WHO: فعل أو غياب فعل، في علاقة فيها ثقة، بيسبب أذى."
      - "Underreported؛ 1-10% في الدول المتقدمة؛ 1 من 10 في أمريكا."
      - "EASI: 5 + 1 سؤال؛ yes واحدة في 2-6 = assess؛ sens 0.47، spec 0.75."
      - "مريض معروف وسليم: EASI. جديد أو dementia: Mini-Cog الأول."
      - "Barriers: hidden، مخاوف الضحية، cognition، قلة تدريب، subjective، self-neglect."
    practice: [geri.L12.001, geri.L12.002, geri.L12.003, geri.L12.004, geri.L12.005, geri.L12.006, geri.L12.007, geri.L12.008, geri.L12.009, geri.L12.010, geri.L12.011, geri.L12.012, geri.L12.013, geri.L12.014, geri.L12.015, geri.L12.016, geri.L12.017, geri.L12.018, geri.L12.019, geri.L12.020, geri.L12.053, geri.L12.054, geri.L12.055, geri.L12.056, geri.L12.057, geri.L12.058, geri.L12.071, geri.L12.072, geri.L12.073]
