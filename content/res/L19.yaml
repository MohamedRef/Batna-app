- id: res.L19.005
  kind: case
  topic: why
  stem: Ahmed is an overweight 35-year-old with low back pain (LBP) and some pain in the thigh but none below the knee. He
    has no past medical problems, no symptoms of systemic disease, and no neurological deficit on examination.
  steps:
  - question: What should you advise Ahmed about resting or exercising his back?
    options:
    - To get on with ordinary activities as normally as possible
    - Rest it as much as possible
    - Rest it only when absolutely necessary
    - Let pain be his guide
    - Have an x-ray of the spine before exercise
    answer: 0
    why: Three systematic reviews give strong evidence that acute LBP patients should avoid bed rest if possible, stay active
      and get on with ordinary activities as normally as possible.
  - question: What kind of evidence backs that advice on the slide?
    options:
    - Three systematic reviews
    - One expert's opinion
    - A single case report
    - A textbook chapter
    answer: 0
    why: 'The slide is titled «Three systematic reviews»: the top of the evidence pyramid, not personal habit.'
  src:
    page: 10
    quote: |-
      Three systematic reviews
      Strong evidence that pts with acute LBP should be advised
      to avoid bed rest if possible,
      to stay active, and
      to get on with their ordinary activities as normally as possible
  status: unverified
  tags: [high-yield]
