  - id: hem.L02.lesson3
    title: "التحاليل: الـ reticulocyte الأول، وبعدين الـ MCV"
    hook: "سؤالين بس بيقسموا أي أنيميا: النخاع شغال ولا لأ؟ والكرة كبيرة ولا صغيرة؟"
    minutes: 8
    pages: [13, 15]
    topics: [cbc, reticulocytes, mcv, aplastic]
    goals:
      - "تعرف مكونات الـ CBC والتحاليل اللي بعده"
      - "تمشي في الـ algorithm: reticulocyte index الأول، بعدين MCV"
      - "تحفظ جدول الـ MCV وتشخّص الـ aplastic anaemia"
    status: unverified
    steps:
      - kind: explain
        page: 13
        title: "الـ CBC وبعده"
        quote: "Main parameters measured 1. Hb concentration. 2. Red cell count. 3. MCV, MCH, MCHC."
        text: |
          الـ **CBC** بيقيس:
          1. **Hb**
          2. **Red cell count**
          3. **MCV، MCH، MCHC**
          4. **Haematocrit (PCV)**
          5. **RDW**
          6. **WBC** والـ differential
          7. **Platelets**

          وبعده حسب الحالة: ==iron indices== (ferritin، أو iron/transferrin/saturation)، **folate**، **B12**، **Hb electrophoresis**، و **direct Coombs' test**.
      - kind: explain
        page: 14
        title: "أول سؤال: المصنع ولا التسريب؟"
        quote: "The first distinction to be made is whether the primary cause of the anemia is failure of the BM to produce sufficient no. of erythrocytes"
        text: |
          أول تفرقة: النخاع **مش بينتج كفاية** (==underproduction==)، ولا الكرات **بتضيع أو بتتكسر** بسرعة (**destruction or loss**)؟

          وعشان تعرف النخاع بيرد صح ولا لأ فيه طريقتين:
          - **Absolute reticulocyte count** = ==reticulocytes (%) × RBC count/mm³==
          - **Reticulocyte production index (RPI)**
      - kind: aside
        tone: analogy
        page: 14
        quote: "Two methods are employed to determine whether BM‘s response to the anaemia is appropriate"
        text: "الـ reticulocytes زي **العربيات الجديدة اللي طالعة من المصنع النهارده**. لو الشارع فاضي (أنيميا) والمصنع بيطلّع كتير، يبقى العربيات بتتكسر أو بتتسرق برّه. لو المصنع بيطلّع شوية، يبقى المصنع نفسه هو المشكلة."
      - kind: figure
        page: 14
        quote: "INCREASED DESTRUCTION or LOSS"
        title: "الـ algorithm (شكل ص 14)"
        alt: "Anaemia splits by reticulocyte index. RI below 2% is underproduction, divided by MCV into low (microcytic), normal (normocytic) and high (macrocytic) anaemia. RI above 2% is increased destruction or loss: raised LDH and bilirubin with low haptoglobin means haemolysis; signs of bleeding mean recent acute blood loss."
        caption: "**RI < 2%** = underproduction، وتقسمها بالـ **MCV**. **RI > 2%** = destruction أو loss: لو ==↑LDH، ↑bilirubin، ↓haptoglobin== يبقى haemolysis، ولو فيه نزيف يبقى acute blood loss."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="h02a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
