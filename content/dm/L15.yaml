    calculator: corrected_sodium
    stem: "A 26-year-old in DKA has glucose 500 mg/dL and measured sodium 132 mEq/L."
    inputs: { na_meq_l: 132, glucose_mg_dl: 500 }
    expect: "138.4 mEq/L"
    interpret: "Add 1.6 mEq/L for every 100 mg/dL of glucose above 100: 132 + 6.4 = 138.4 (about 138), so the true sodium is normal."
    src: { page: 189, quote: "If glucose level is 500 and sodium is 132" }
