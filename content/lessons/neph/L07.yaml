        caption: |
          X-ray للحوض من قدام: ==السهمين البيض== على الجنبين بيشاوروا على ==بروز عضمي== طالع من الـ iliac wing في كل ناحية.

          دي الـ **iliac horns**: موجودة في حوالي 80% وهي ==pathognomonic== للـ nail-patella syndrome.
      - kind: figure
        page: 197
        title: "الرضفة الغايبة"
        image: { file: neph/L07-absent-patellae.webp, book: true }
        alt: "Book figure in two panels. A: photograph of both knees, which look flat in front with no visible kneecaps. B: anteroposterior and lateral radiographs of the knee showing no patella."
        caption: |
          - **A، فوق**: صورة الركبتين: ==مفلطحين من قدام== ومفيش بروز الصابونة.
          - **B، تحت**: X-ray للركبة من قدام ومن الجنب: ==مفيش patella== خالص.

          ده الـ absent patella في أكتر من 90% من عيانين الـ nail-patella syndrome، ومع الـ iliac horns و==الضوافر== بيكمّلوا الصورة.
      - kind: explain
        page: 197
        title: "الضوافر والعلاج"
        quote: "Nail abnormalities occur in about 98% of patients and are typically bilateral and symmetric. Fingernails are affected more often than toe-nails."
        text: |
          **الضوافر** (الكتاب): في حوالي ==98%==، **bilateral و symmetric**، والإيد أكتر من الرجل. ممكن تبقى **غايبة** أو dystrophic مع discoloration، **koilonychia**، longitudinal ridges، أو ==triangular lunulae== (الهلال اللي تحت الضافر مثلث بدل نص دايرة).

          **العلاج**:
          - **مفيش علاج خاص** للـ nephropathy.
          - ==مفيش recurrence== في الكلية المزروعة. التفسير المقبول (مش في الكتاب): لأن الكلية الجديدة فيها LMX1B سليم، والمرض جاي من جوّه خلايا الكلية مش من الدم.
          - بما إنه **AD**، لازم تقيّم المتبرع القريب كويس: ممكن يكون شايل الجين وعنده المرض في كليته.
