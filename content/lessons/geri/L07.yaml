      - kind: explain
        page: 123
        title: "Malnutrition: خطير بس بيتعالج"
        quote: "Frequently used risk factors for malnutrition are:\n  Involuntary weight loss (more than 5% over the last month or more than 10% over the last six months).\n  BMI less than 20 for elderly (≥ 65y).\n  Decreased appetite or reduced food intake"
        text: |
          مشاكل التغذية في الكبير **poor prognosis** بس **potentially treatable**، وممكن تكون علامة لمرض تاني.

          Risk factors:
          - **Involuntary weight loss** ==>5% في شهر== أو **>10% في 6 شهور**
          - ==body mass index (BMI) <20== لو **≥65 سنة**
          - Decreased appetite أو reduced food intake
      - kind: aside
        tone: trap
        page: 123
        quote: "Frequently used risk factors for malnutrition are:\n  Involuntary weight loss (more than 5% over the last month or more than 10% over the last six months).\n  BMI less than 20 for elderly (≥ 65y).\n  Decreased appetite or reduced food intake"
        text: "في الكبير الـ BMI cut-off هنا **20** مش 18.5. والسؤال 7 في الكتاب: «Increased appetite» هو اللي **مش** risk factor."
      - kind: figure
        page: 123
        quote: "'MUST' (BAPEN)\n| Step | Measure | Score |\n|---|---|---|\n| Step 1: BMI score | BMI kg/m² >20 (>30 Obese) | 0 |\n| | BMI 18.5-20 | 1 |\n| | BMI <18.5 | 2 |\n| Step 2: Weight loss score | Unplanned weight loss in past 3-6 months <5% | 0 |\n| | 5-10% | 1 |\n| | >10% | 2 |\n| Step 3: Acute disease effect score | If patient is acutely ill and there has been or is likely to be no nutritional intake for >5 days | 2 |\nStep 4: Overall risk of malnutrition. Add Scores together to calculate overall risk of malnutrition: Score 0 Low Risk; Score 1 Medium Risk; Score 2 or more High Risk.\nIf unable to obtain height and weight, see reverse for alternative measurements and use of subjective criteria.\nAcute disease effect is unlikely to apply outside hospital. See 'MUST' Explanatory Booklet for further information."
        title: "MUST: 3 خطوات تتجمع"
        alt: "Three boxes add together: Step 1 BMI score (over 20 is 0, 18.5 to 20 is 1, under 18.5 is 2), Step 2 weight loss in 3 to 6 months (under 5 percent 0, 5 to 10 percent 1, over 10 percent 2), Step 3 acute disease effect (acutely ill with no intake over 5 days is 2). They sum to Step 4: 0 low, 1 medium, 2 or more high risk."
        caption: "==MUST== = BMI + weight loss + acute disease. **0** low، **1** medium، **≥2** high."
