      - kind: match
        page: 21
        quote: "Examples for research questions:\n  Topic of interest: Women's health\n  Narrowed topic: Women and cancer\n  Focused topic: Women smokers and breast cancer\n  PICO: P = Women (age more than 35); I = Cigarette smoking; C = No smoking; O = Breast cancer\n  Research question: Does smoking among women older than 35 years affect breast cancer risk compared to non-smokers?\n→ Justification/Rationale"
        prompt: "مثال تاني من المحاضرة عن التدخين وسرطان الثدي. وصّل كل حرف بقيمته."
        pairs:
          - ["P", "Women older than 35"]
          - ["I", "Cigarette smoking"]
          - ["C", "No smoking"]
          - ["O", "Breast cancer"]
        why: "والسؤال: Does smoking among women older than 35 years affect breast cancer risk compared to non-smokers?"
      - kind: case
        page: 39
        quote: "Box 2: PICOT criteria\n| Letter | Element | Question |\n|---|---|---|\n| P | Population (patients) | What specific patient population are you interested in? |\n| I | Intervention (for intervention studies only) | What is your investigational intervention? |\n| C | Comparison group | What is the main alternative to compare with the intervention? |\n| O | Outcome of interest | What do you intend to accomplish, measure, improve or affect? |\n| T | Time | What is the appropriate follow-up time to assess outcome |"
        stem: "في عيادة الكبد في المنصورة: \"In adults with compensated hepatitis C virus (HCV) cirrhosis, does daily coffee compared with no coffee lower the rate of decompensation over 3 years?\""
        steps:
          - question: "What is the I?"
            options: ["Daily coffee", "No coffee", "Decompensation", "Adults with compensated HCV cirrhosis"]
            answer: 0
            why: "الـ I هو الـ exposure اللي بتدرسه: القهوة اليومية."
          - question: "What is the C?"
            options: ["No coffee", "Daily coffee", "3 years", "Decompensation"]
            answer: 0
            why: "الـ C هو البديل اللي بتقارن بيه."
          - question: "And the T?"
            options: ["Over 3 years", "Compensated", "Daily", "Adults"]
            answer: 0
            why: "الـ T هو الـ follow-up time: 3 سنين."
      - kind: explain
        remind: [res.L03.046]
        page: 41
        quote: "Criteria for a bad research question. There are different criteria that define a bad research question summarized below:\n  a. Vagueness of the research question.\n  b. The research question is too broad to reach conclusive results.\n  c. The research question might fail to reveal the relevance of the topic under investigation.\n  d. Other criteria which are related to the logistic aspects of the study, such as the time needed to carry out the study, high cost with limited funding, limited resources such as availability of expertise, special equipment, and/or information.\n  e. Research question might be limited by ethical considerations or requirement of authorities' approval."
        title: "السؤال الوحش شكله إيه؟"
        text: |
          المحاضرة بتعدّ criteria للـ **bad research question**:

          - ==Vagueness==.
          - **Too broad** to reach conclusive results.
          - **Fails to reveal the relevance** of the topic.
          - **Logistic** problems: الوقت، **high cost with limited funding**، نقص الـ expertise أو الأجهزة أو المعلومات.
          - محدود بـ **ethical considerations** أو محتاج **authorities' approval**.

          والخلاصة: السؤال لازم يبقى **specific, concrete, measurable**.
      - kind: check
        page: 42
        quote: "In conclusion: A research question needs to be:\n  specific\n  concrete\n  measurable."
        question: "In conclusion, a research question needs to be:"
        options:
          - "Specific, concrete and measurable"
          - "Broad, flexible and open"
          - "Short, catchy and original"
          - "Qualitative, descriptive and causal"
        answer: 0
        why:
          - "صح: slide 42، specific (محدد)، concrete (ملموس)، measurable (يتقاس). ليه؟ لأن اللي مايتقاسش مايتجاوبش."
          - "ده بالظبط اللي slides 43-44 بتعتبره سؤال وحش: «good environment» واسعة ومش ملموسة."
          - "الطول والجاذبية مش من الشروط."
          - "دول أنواع أسئلة، مش صفات السؤال الكويس."
      - kind: check
        page: 43
        quote: "1- \"will 30 minutes of activity improve blood pressure\"\n2- \"will 30 minutes of moderate activity daily reduce hypertension in office workers\".\n  Which question is specific? 2\n  Which question is vague and broad? 1\n  Which question specifies the population? 2"
        question: "(1) \"Will 30 minutes of activity improve blood pressure?\" (2) \"Will 30 minutes of moderate activity daily reduce hypertension in office workers?\" Which one specifies the population?"
        options:
          - "Question 2"
          - "Question 1"
          - "Both"
          - "Neither"
        answer: 0
        why:
          - "صح: **office workers**. والمحاضرة بتقول كمان إن 2 هو الـ specific."
          - "سؤال 1 vague و broad ومفيهوش ناس خالص."
          - "سؤال 1 مالوش population."
          - "سؤال 2 فيه population واضحة."
      - kind: check
        page: 44
        quote: "\"will good environment improve health\"\n  Is this research question: specific or measurable? It is too broad to reach conclusive results\n  Does it specify a population?\n\"will voluntary induced abortion after 3rd month cause increase incidence of maternal mortality\"\n  Limited by ethical and legal issues"
        question: "\"Will good environment improve health?\" What is its main problem?"
        options:
          - "Too broad to reach conclusive results, and no population"
          - "It is unethical to study the environment"
          - "It is not interesting enough to fund"
          - "It needs a placebo group to be valid"
        answer: 0
        why:
          - "صح: لا specific ولا measurable، **too broad**، ومفيش population."
          - "مفيش فيه حاجة غير أخلاقية."
          - "الموضوع مهم، بس السؤال مش قابل للقياس."
          - "الـ C اختياري أصلًا، ومش هي المشكلة."
      - kind: try
        items: [res.L03.052, res.L03.056, res.L03.058, res.L03.046]
    recap:
      - "FINER للسؤال عمومًا، PICO(T) لعناصره."
      - "P = population، I = intervention/exposure، C = comparison (اختياري)، O = outcome، T = follow-up time."
      - "الـ C هو العنصر الوحيد الـ optional: no interest in comparison أو no comparable group."
      - "السؤال الوحش: vague، too broad، مش relevant، logistic limits، ethical limits."
      - "السؤال الكويس: specific، concrete، measurable."
