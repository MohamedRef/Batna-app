      - kind: explain
        page: 140
        quote: "F1. Fecal incontinence\nDiagnostic criterion*\n  Recurrent uncontrolled passage of fecal material in an individual with a developmental age of at least 4 years.\n*Criterion fulfilled for the last 3 months. For research studies, consider onset of symptoms of at least 6 months previously with 2-4 episodes of FI over 4 weeks."
        title: "Rome IV: F1 و F2"
        text: |
          **F1. Fecal incontinence:** نزول براز متكرر من غير تحكم، في حد ==developmental age== لا يقل عن **4 years**، آخر 3 شهور.

          **F2. Functional anorectal pain** تلات أنواع، والفرق في **مدة النوبة** و **tenderness on puborectalis traction**:
          - **Levator ani syndrome:** ألم مزمن، نوبات ==30 minutes or longer==، و tenderness موجودة.
          - **Unspecified functional anorectal pain:** نفس الأعراض، **من غير** tenderness.
          - **Proctalgia fugax:** ألم مفاجئ ثواني لدقايق (**max 30 minutes**)، ومفيش ألم بين النوبات.

          والكل لازم تستبعد inflammatory bowel disease (IBD)، abscess، fissure، thrombosed hemorrhoids، prostatitis، و coccygodynia.

          التفسير المقبول (مش في الكتاب): ليه سن 4؟ لأن الطفل قبل كده لسه بيتعلم يتحكم، فالـ incontinence عنده طبيعي ومش مرض.
