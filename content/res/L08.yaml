    src: { page: 30, quote: "False or true:\n  An exposure with a relative risk more than one should have an attributable risk greater than zero. (T)\n  Statistical evaluation of the role of chance may or may not be needed before the interpretation of the study finding (F)\n  The relative risk less than one means that the factor under study is a preventive factor (T)" }
