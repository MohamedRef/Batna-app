            <text x="273" y="130" text-anchor="middle" class="t-sm">over 5</text>
            <text x="273" y="150" text-anchor="middle" class="t-sm">small hand</text>
            <text x="273" y="176" text-anchor="middle" class="t-sm">months-years</text>
            <text x="273" y="210" text-anchor="middle" class="t-sm t-b">own course</text>
            <rect x="6" y="274" width="318" height="44" rx="10" class="fg-thin"/>
            <text x="165" y="301" text-anchor="middle" class="t-sm">All non-erosive, non-deforming</text>
          </svg>
      - kind: explain
        page: 343
        title: "الـ axial"
        quote: "*Axial arthritis (sacroiliitis and spondylitis) in IBD has the following characteristics:\n  Insidious onset of low back pain, especially in younger persons.\n  Morning stiffness.\n  Exacerbated by prolonged sitting or standing.\n  Improved by moderate activity.\n  More common in CD than in UC.\n  Independent of GI symptoms."
        text: |
          - **Low back pain** بيبدأ ببطء، خصوصًا في الصغيرين
          - **Morning stiffness**
          - بيزيد مع القعدة أو الوقفة الطويلة، ويتحسن مع الحركة
          - أشيع في ==Crohn== من الـ UC
          - **Independent** عن أعراض الأمعاء

          ليه مستقل عن الأمعاء؟ لأن الـ sacroiliitis والـ spondylitis ماشيين بطريقهم الخاص (زي الـ AS)، فعلاج الـ colitis لوحده مش هيهدّي الضهر (التفسير المقبول، مش في الكتاب).
      - kind: sort
        page: 343
        quote: "Type 2 (polyarticular [>5 joints]) - Chronic, lasting months to years; more likely symmetrical, affecting small joints of the hands; independent of bowel activity."
        prompt: "Type 1 ولا Type 2؟"
        bins: ["Type 1", "Type 2"]
        cards:
          - { text: "Fewer than 5 joints", bin: 0 }
          - { text: "Attacks under 6–10 weeks", bin: 0 }
          - { text: "Knees, hips, shoulders", bin: 0 }
          - { text: "Tracks IBD activity", bin: 0 }
          - { text: "More than 5 joints", bin: 1 }
          - { text: "Months to years", bin: 1 }
          - { text: "Small hand joints, symmetric", bin: 1 }
          - { text: "Independent of bowel activity", bin: 1 }
        why: "Type 1 = **pauci**، acute، large، asymmetric، ماشي مع الـ IBD ومع extra-intestinal manifestations. Type 2 = **poly**، chronic، small، symmetric، مستقل."
      - kind: aside
        tone: analogy
        page: 343
        quote: "Non-deforming and non-erosive."
        text: "Type 1 زي **ضيف ماشي مع صاحبه**: ييجي لما الـ colitis تولّع ويمشي لما تهدى. Type 2 **ساكن لوحده**: ملوش دعوة بالأمعاء. والاتنين **non-erosive** و **non-deforming**."
      - kind: explain
        page: 343
        title: "الـ peripheral: إمتى بيظهر؟"
        quote: "May precede intestinal involvement, but usually concomitant or subsequent to bowel disease, as late as 10 years following the diagnosis."
        text: |
          - ==Non-deforming و non-erosive==: علشان كده مفيش erosions زي الـ RA أو الـ PsA.
          - التوقيت: **ممكن يسبق** الأمعاء، بس غالبًا **مع** أو **بعد** مرض الأمعاء، لحد **10 سنين** بعد التشخيص.

          ليه ده مهم؟ لأن عيان arthritis من غير أعراض أمعاء ممكن يكون عنده IBD لسه ماظهرش. وعيان IBD قديم ممكن يجيله arthritis بعد سنين، فماتستبعدش العلاقة علشان الوقت طويل. ولو الـ arthritis Type 1 ماشي مع نشاط الأمعاء، يبقى علاج الأمعاء نفسه بيهدّي المفصل (التفسير المقبول، مش في الكتاب).
      - kind: explain
        page: 344
        title: "Post-enteritic reactive arthritis"
        quote: "It is triggered by a number of organisms: Shigella, Salmonella, yersinia and campylobacter jejuni. It shows strong predilection for HLA-B27 positive individuals. However, it is not known why some of these patients develop only arthropathy, whereas others have the full spectrum of Reiter's disease. The joints more commonly affected are the knees, and ankles."
        text: |
