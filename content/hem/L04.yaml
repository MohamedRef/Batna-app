  - id: hem.L04.067
    kind: essay
    topic: other-counts
    prompt: Give an account of the hypereosinophilic syndrome.
    outline:
      - "Where the lecture places it": ["A cause of eosinophilia, beside parasites, skin disorders, allergy, neoplasia and MPNs (p68)"]
      - "Exclude the other causes first": ["Parasitic infection, skin and allergic disorders", "Neoplasia and myeloproliferative disorders"]
      - "Related counts": ["Basophils above 0.1 × 10⁹/L usually mean an MPN (CML, PV)"]
    src: { page: 68, quote: "Myeloproliferative disorders 6. Hypereosinophilic syndrome" }
    status: unverified
    tags: [book-question]
    update:
      text: "The lecture only lists HES as a cause. Current definitions: hypereosinophilia is an eosinophil count above 1.5 × 10⁹/L on two tests at least a month apart; HES is hypereosinophilia with eosinophil-mediated organ damage (heart, lung, skin, nerves) after secondary causes are excluded. Myeloid neoplasms with PDGFRA/PDGFRB rearrangement respond to imatinib; idiopathic HES is treated with corticosteroids first."
      ref: "WHO classification of haematolymphoid tumours, 5th ed. 2022; ICOG-EO 2011 consensus"
  - id: hem.L04.068
    kind: essay
    topic: neutrophils
    prompt: Outline the approach to febrile neutropenia.
    outline:
      - "Define the risk": ["Normal lower limit 2.5 × 10⁹/L (1.5 in black people and the Middle East)", "ANC below 0.5 × 10⁹/L: recurrent infections likely"]
      - "Find the cause": ["Congenital (Kostmann), cyclical, marrow aplasia, megaloblastic anemia", "Infections (typhoid, miliary TB, viral hepatitis), drugs, irradiation", "Immune disorders, hypersplenism"]
      - "Support": ["Granulocyte transfusion for ANC below 0.5 with documented infection (lecture 6)", "Myeloid growth factors (G-CSF) raise the neutrophil count (they cause neutrophilia)"]
    src: { page: 67, quote: "When the absolute neutrophil level falls below 0.5 *10 9/L the patient is likely to have recurrent infections" }
    status: unverified
    tags: [book-question]
    update:
      text: "The lecture gives no algorithm. Current guidance: febrile neutropenia is a temperature of 38.3°C once, or 38.0°C sustained for 1 hour, with ANC below 0.5 × 10⁹/L (or expected to fall below it within 48 hours). Take cultures, assess risk (MASCC score), and start empirical broad-spectrum anti-pseudomonal beta-lactam therapy within 1 hour; low-risk patients may get oral therapy as outpatients."
      ref: "ASCO/IDSA outpatient febrile neutropenia guideline 2018"
