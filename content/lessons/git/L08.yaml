  - id: git.L08.lesson3
    title: "العلاج: من غير عيش، ولو ما اتحسنش؟"
    hook: "الـ gluten-free diet سهلة على الورق وصعبة في السوبر ماركت. وعيان مش بيتحسن له 9 أسباب."
    minutes: 8
    pages: [238, 239]
    topics: [celiac-treatment]
    goals:
      - "تعرف إيه الممنوع وإيه المسموح"
      - "ترتّب أسباب الـ nonresponse"
      - "تعرف المضاعفات وعلاج الـ refractory"
    status: unverified
    steps:
      - kind: sort
        page: 239
        quote: "Avoid all wheat, barley, rye, and oat gluten Rice, corn, millet, potato, buckwheat, and soybeans are safe."
        prompt: "ممنوع ولا مسموح؟"
        bins: ["Avoid", "Safe"]
        cards:
