items:
  # ---------- p164-165: overview ----------
  - id: rheum.L09.001
    kind: card
    topic: overview
    front: Define the idiopathic inflammatory myopathies (IIM).
    back: A heterogeneous group of systemic autoimmune diseases primarily affecting skeletal muscle, with chronic inflammation and weakness; lungs, joints, heart and skin may also be involved.
    src: { page: 164, quote: "Idiopathic inflammatory myopathies (IIM) are a heterogeneous group of systemic autoimmune diseases primarily affecting skeletal muscle." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L09.002
    kind: enumerate
    topic: overview
    prompt: The five major subtypes of IIM in the most recent classification?
    points:
      - Dermatomyositis (classic DM and clinically amyopathic DM)
      - Polymyositis
      - Inclusion body myositis
      - Immune-mediated necrotizing myopathy
      - Overlap myositis
    pass: 5
    src: { page: 164, quote: "The spectrum of IIM includes polymyositis (PM), dermatomyositis (DM), inclusion body myositis (IBM), immune-mediated necrotizing myopathy (IMNM)" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L09.003
    kind: card
    topic: overview
    front: What does the newer IIM classification combine to improve accuracy?
    back: Clinical, histological, serological and imaging findings.
    src: { page: 164, quote: "newer criteria incorporating clinical, histological, serological, and imaging findings to enhance diagnostic accuracy" }
    status: unverified
  - id: rheum.L09.004
    kind: card
    topic: overview
    front: What is clinically amyopathic dermatomyositis (CADM)?
    back: A dermatomyositis subtype with the rash but without clinical muscle disease; it is grouped under DM.
    src: { page: 164, quote: "Dermatomyositis (DM) – Includes both classic DM (with rash) and clinically amyopathic DM (CADM)." }
    status: unverified
  - id: rheum.L09.005
    kind: card
    topic: overview
    front: How is polymyositis viewed now?
    back: As rare; it is often reclassified as other subtypes.
    src: { page: 164, quote: "Polymyositis (PM) – Now considered rare and often reclassified as other subtypes." }
    status: unverified
  - id: rheum.L09.006
    kind: card
    topic: overview
    front: Two clinical hallmarks of inclusion body myositis?
    back: Asymmetric weakness and poor response to treatment.
    src: { page: 165, quote: "Inclusion Body Myositis (IBM) – Characterized by asymmetric weakness and poor response to treatment." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L09.007
    kind: card
    topic: overview
    front: Which antibodies define immune-mediated necrotizing myopathy?
    back: Anti-SRP and anti-HMGCR.
    src: { page: 165, quote: "Immune-Mediated Necrotizing Myopathy (IMNM) – Includes anti-SRP and anti-HMGCR antibody-associated myopathies." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L09.008
    kind: card
    topic: overview
    front: Overlap myositis is associated with which diseases?
    back: Other autoimmune diseases such as SLE, systemic sclerosis and mixed connective tissue disease.
    src: { page: 165, quote: "Overlap Myositis – Associated with other autoimmune diseases such as systemic lupus erythematosus, systemic sclerosis, and mixed connective tissue disease." }
    status: unverified
  - id: rheum.L09.009
    kind: cloze
    topic: overview
    text: "IIM incidence is {{c1::1–10 per million}} per year, peaks in {{c2::mid-to-late adulthood}}, with a female predominance of up to {{c3::2:1}}."
    src: { page: 165, quote: "IIMs are rare, with an estimated incidence of 1–10 cases per million annually." }
    status: unverified
    tags: [numbers]
  - id: rheum.L09.010
    kind: card
    topic: overview
    front: Which IIM form is more common in children?
    back: Juvenile dermatomyositis.
    src: { page: 165, quote: "some forms (e.g., juvenile dermatomyositis) are more common in children." }
    status: unverified
  # ---------- p165: pathogenesis ----------
  - id: rheum.L09.011
    kind: table
    topic: pathogenesis
    title: Immunopathology by IIM subtype
    columns: [Subtype, Key lesion]
    rows:
      - [Dermatomyositis, "Complement-mediated capillary damage, perifascicular atrophy"]
      - [Polymyositis, CD8+ T-cell cytotoxicity against muscle fibres]
      - [Inclusion body myositis, "Inflammation plus degeneration: rimmed vacuoles, protein aggregates"]
      - [IMNM, "Fibre necrosis with minimal inflammation, specific autoantibodies"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 165, quote: "Dermatomyositis (DM): Involves complement-mediated damage to capillaries and perifascicular atrophy." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L09.012
    kind: card
    topic: pathogenesis
    front: Which immune arms are involved in IIM pathogenesis?
    back: Both humoral and cell-mediated responses, with distinct features per subtype.
    src: { page: 165, quote: "The pathogenesis of IIM involves complex immune mechanisms, including both humoral and cell-mediated responses." }
    status: unverified
  - id: rheum.L09.013
    kind: card
    topic: pathogenesis
    front: Why does dermatomyositis cause perifascicular atrophy?
    back: Complement damages the capillaries, and the fascicle edges, farthest from the blood supply, suffer first.
    src: { page: 165, quote: "Dermatomyositis (DM): Involves complement-mediated damage to capillaries and perifascicular atrophy." }
    status: unverified
  - id: rheum.L09.014
    kind: card
    topic: pathogenesis
    front: Role of MSAs and MAAs in myositis?
    back: They define subsets and predict prognosis.
    src: { page: 165, quote: "Myositis-specific autoantibodies (MSAs) and myositis-associated autoantibodies (MAAs) play a crucial role in defining subsets and predicting prognosis." }
    status: unverified
  # ---------- p166: muscle ----------
  - id: rheum.L09.015
    kind: card
    topic: muscle
    front: Hallmark of IIM?
    back: Symmetrical proximal muscle weakness.
    src: { page: 166, quote: "The hallmark of IIM is symmetrical proximal muscle weakness" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L09.016
    kind: enumerate
    topic: muscle
    prompt: Muscles typically affected in IIM, and the tasks that become hard?
    points:
      - Deltoids, hip flexors and neck flexors
      - Rising from a chair
      - Lifting objects
      - Combing hair
    pass: 3
    src: { page: 166, quote: "The deltoids, hip flexors, and neck flexors. Tasks such as rising from a chair, lifting objects, and combing hair become difficult." }
    status: unverified
  - id: rheum.L09.017
    kind: card
    topic: muscle
    front: In which subtype may distal muscles be involved?
    back: Inclusion body myositis.
    src: { page: 166, quote: "In some subtypes (e.g., IBM), distal muscles may be involved." }
    status: unverified
  - id: rheum.L09.018
    kind: card
    topic: muscle
    front: Muscle pain, late changes and swallowing in IIM?
    back: Pain is variable and often mild; atrophy and contractures in advanced disease; dysphagia from oropharyngeal and oesophageal involvement.
    src: { page: 166, quote: "Muscle pain is variable and often mild. In advanced disease, muscle atrophy and contractures may develop." }
    status: unverified
  # ---------- p166: extramuscular ----------
  - id: rheum.L09.019
    kind: table
    topic: extramuscular
    title: Skin signs of dermatomyositis
    columns: [Sign, Description]
    rows:
      - [Heliotrope rash, Purple discoloration of eyelids]
      - [Gottron's papules, Scaly erythematous plaques over joints]
      - [Shawl and V-signs, Photosensitive rash over shoulders and chest]
      - [Mechanic's hands, "Hyperkeratotic, fissured skin on palms"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 166, quote: "Heliotrope rash (purple discoloration of eyelids). Gottron's papules (scaly, erythematous plaques over joints)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L09.020
    kind: card
    topic: extramuscular
    front: In which IIM setting is interstitial lung disease particularly common?
    back: Antisynthetase syndrome.
    src: { page: 166, quote: "Interstitial lung disease (ILD) is common, particularly in antisynthetase syndrome." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L09.021
    kind: card
    topic: extramuscular
    front: How does myositis ILD present?
    back: Cough, dyspnoea and a restrictive ventilatory defect.
    src: { page: 166, quote: "Can present with cough, dyspnea, and restrictive ventilatory defect." }
    status: unverified
  - id: rheum.L09.022
    kind: card
    topic: extramuscular
    front: Joint involvement in IIM?
    back: Arthralgia and non-erosive arthritis, often mimicking rheumatoid arthritis.
    src: { page: 166, quote: "Arthralgia and non-erosive arthritis, often mimicking rheumatoid arthritis." }
    status: unverified
  - id: rheum.L09.023
    kind: card
    topic: extramuscular
    front: Cardiac involvement in IIM and how to find it?
    back: Arrhythmias, conduction defects and myocarditis, often subclinical; screen with ECG and echocardiography.
    src: { page: 166, quote: "Arrhythmias, conduction defects, and myocarditis. May be subclinical and require ECG and echocardiographic screening." }
    status: unverified
  # ---------- p167: antibodies ----------
  - id: rheum.L09.024
    kind: table
    topic: antibodies
    title: Myositis-specific antibodies
    columns: [Antibody, Association]
    rows:
      - [Anti-Mi-2, "Classic DM, good prognosis"]
      - [Anti-MDA5, "Clinically amyopathic DM, rapidly progressive ILD"]
      - [Anti-TIF1γ, "Adult-onset DM, malignancy"]
      - [Anti-NXP2, Juvenile DM]
      - [Anti-SAE, "Skin disease, dysphagia"]
      - [Anti-SRP and anti-HMGCR, IMNM]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 167, quote: "Anti-Mi-2: Associated with classic DM and good prognosis. Anti-MDA5: Linked to clinically amyopathic DM and rapidly progressive ILD." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L09.025
    kind: cloze
    topic: antibodies
    text: "Anti-{{c1::TIF1γ}} goes with adult-onset DM and malignancy; anti-{{c2::NXP2}} is more common in juvenile DM."
    src: { page: 167, quote: "Anti-TIF1γ: Seen in adult-onset DM and linked to malignancy. Anti-NXP2: More common in juvenile DM." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L09.026
    kind: card
    topic: antibodies
    front: Myositis-associated antibodies (MAAs) and where they appear?
    back: Anti-Ro/SSA, anti-U1-RNP, anti-PM/Scl and anti-Ku; often in overlap syndromes.
    src: { page: 167, quote: "Anti-Ro/SSA, Anti-U1-RNP, Anti-PM/Scl, Anti-Ku – Often seen in overlap syndromes." }
    status: unverified
  - id: rheum.L09.027
    kind: mcq
    topic: antibodies
    stem: A 48-year-old woman has Gottron's papules and mechanic's hands but normal strength and CK. Over 3 weeks she develops worsening dyspnoea and bilateral ground-glass changes. Which antibody is most likely?
    options:
      - Anti-MDA5
      - Anti-Mi-2
      - Anti-NXP2
      - Anti-HMGCR
      - Anti-SAE
    answer: 0
    why:
      - "Correct: amyopathic DM with rapidly progressive ILD is anti-MDA5 (p167)."
      - Anti-Mi-2 is classic DM with good prognosis.
      - Anti-NXP2 is juvenile DM.
      - Anti-HMGCR is IMNM with necrotic muscle, not amyopathic skin disease.
      - Anti-SAE goes with skin disease and dysphagia.
    src: { page: 167, quote: "Anti-MDA5: Linked to clinically amyopathic DM and rapidly progressive ILD." }
    status: unverified
  # ---------- p167: diagnosis ----------
  - id: rheum.L09.028
    kind: enumerate
    topic: diagnosis
    prompt: Muscle enzymes raised in IIM?
    points:
      - CK
      - Aldolase
      - AST
      - ALT
      - LDH
    pass: 4
    src: { page: 167, quote: "Elevated muscle enzymes (CK, aldolase, AST, ALT, LDH)." }
    status: unverified
  - id: rheum.L09.029
    kind: card
    topic: diagnosis
    front: EMG findings in IIM?
    back: Myopathic changes, short-duration low-amplitude motor unit potentials, with spontaneous activity.
    src: { page: 167, quote: "Shows myopathic changes: short-duration, low-amplitude motor unit potentials and spontaneous activity." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L09.030
    kind: card
    topic: diagnosis
    front: Role of muscle biopsy in IIM?
    back: It confirms the diagnosis and separates subtypes by showing necrosis, inflammation or inclusion bodies.
    src: { page: 167, quote: "Confirms diagnosis and differentiates subtypes. Important for identifying necrosis, inflammation, or inclusion bodies." }
    status: unverified
  - id: rheum.L09.031
    kind: card
    topic: diagnosis
    front: Role of MRI in IIM?
    back: It detects muscle oedema and inflammation and guides the biopsy site.
    src: { page: 167, quote: "Useful for detecting muscle edema, inflammation, and guiding biopsy sites." }
    status: unverified
    tags: [high-yield]
  # ---------- p168: malignancy ----------
  - id: rheum.L09.032
    kind: card
    topic: malignancy
    front: Which IIM carries the clearest malignancy risk?
    back: Adult-onset dermatomyositis.
    src: { page: 168, quote: "Certain IIMs, particularly adult-onset dermatomyositis, are associated with an increased risk of malignancy." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L09.033
    kind: enumerate
    topic: malignancy
    prompt: High-risk features for malignancy in myositis?
    points:
      - Older age
      - Male sex
      - Anti-TIF1γ positivity
      - Severe skin disease
      - Rapid onset of muscle weakness
    pass: 4
    src: { page: 168, quote: "High-risk features include Older age Male sex Anti-TIF1γ positivity Severe skin disease Rapid onset of muscle weakness" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L09.034
    kind: card
    topic: malignancy
    front: How is malignancy screened for in myositis?
    back: Age- and sex-appropriate screening, e.g. mammogram, pelvic exam, CT scans and tumour markers.
    src: { page: 168, quote: "Screening for malignancy should include appropriate age- and sex-specific cancer screenings (e.g., mammogram, pelvic exam, CT scans, tumor markers)." }
    status: unverified
  # ---------- p168: treatment ----------
  - id: rheum.L09.035
    kind: table
    topic: treatment
    title: Treatment of IIM
    columns: [Step, Drugs]
    rows:
      - [First line, Glucocorticoids (prednisone)]
      - [Steroid-sparing, "Methotrexate, azathioprine or mycophenolate mofetil"]
      - [Refractory, IVIG or rituximab]
      - [Rapidly progressive ILD, Cyclophosphamide]
      - [Supportive, Physical therapy to preserve strength and prevent atrophy]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 168, quote: "Glucocorticoids: Prednisone is the initial treatment. Steroid-sparing agents: Methotrexate, azathioprine, or mycophenolate mofetil." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L09.036
    kind: card
    topic: treatment
    front: Drug for myositis with rapidly progressive ILD?
    back: Cyclophosphamide.
    src: { page: 168, quote: "Cyclophosphamide is used in rapidly progressive ILD." }
    status: unverified
  - id: rheum.L09.037
    kind: card
    topic: treatment
    front: What determines prognosis in IIM?
    back: The subtype and the presence of ILD or malignancy; early diagnosis and immunosuppression improve outcomes.
    src: { page: 168, quote: "Varies with subtype and presence of ILD or malignancy. Early diagnosis and immunosuppressive therapy improve outcomes." }
    status: unverified
  - id: rheum.L09.038
    kind: mcq
    topic: treatment
    stem: A 50-year-old woman with dermatomyositis improves only partly on prednisone 1 mg/kg after 3 months, and she has steroid-induced diabetes. What should be added?
    options:
      - A steroid-sparing agent such as methotrexate, azathioprine or MMF
      - Cyclophosphamide
      - Stop prednisone and start NSAIDs
      - Bed rest without physiotherapy
    answer: 0
    why:
      - "Correct: steroid-sparing agents are part of first-line therapy (p168)."
      - Cyclophosphamide is for rapidly progressive ILD, which she does not have.
      - NSAIDs do not treat myositis; stopping steroids abruptly is unsafe.
      - Physical therapy is critical to preserve strength.
    src: { page: 168, quote: "Steroid-sparing agents: Methotrexate, azathioprine, or mycophenolate mofetil." }
    status: unverified
  - id: rheum.L09.039
    kind: mcq
    topic: malignancy
    stem: A 64-year-old man develops severe heliotrope and shawl rashes with proximal weakness over 4 weeks. Anti-TIF1γ is positive. What is the most important next step besides starting prednisone?
    options:
      - Screen for occult malignancy
      - High-resolution CT only, to look for ILD
      - Check anti-HMGCR and stop statins
      - Repeat EMG in 6 months
    answer: 0
    why:
      - "Correct: older age, male, anti-TIF1γ, severe skin and rapid onset are all high-risk features for cancer (p168)."
      - ILD screening is reasonable, but his profile shouts malignancy.
      - Anti-HMGCR is IMNM; he has DM skin signs.
      - Delay misses a cancer.
    src: { page: 168, quote: "High-risk features include Older age Male sex Anti-TIF1γ positivity Severe skin disease Rapid onset of muscle weakness" }
    status: unverified
  - id: rheum.L09.040
    kind: case
    topic: muscle
    stem: "A 45-year-old woman has 2 months of difficulty climbing stairs and combing her hair, mild muscle aches, and purple discoloration of the upper eyelids."
    steps:
      - question: Which pattern of weakness do you expect?
        options: ["Symmetrical proximal", "Asymmetric distal", "Ascending with areflexia", "Fatigable ptosis"]
        answer: 0
        why: "Symmetrical proximal weakness (deltoids, hip and neck flexors) is the hallmark of IIM (p166). Asymmetric distal points to IBM. Ascending areflexic weakness is Guillain–Barré. Fatigable ptosis is myasthenia."
      - reveal: "She also has scaly red plaques over her knuckles. CK is 4,800 U/L."
        question: Most likely diagnosis?
        options: ["Dermatomyositis", "Polymyositis", "Inclusion body myositis", "Lupus myositis"]
        answer: 0
        why: "Heliotrope rash plus Gottron's papules plus proximal weakness is dermatomyositis (p166, book question 5). PM has no rash. IBM is asymmetric in older men. Lupus myositis lacks these signs."
      - question: Which test best chooses the biopsy site?
        options: ["MRI of muscles", "EMG", "Manual muscle testing", "ANA"]
        answer: 0
        why: "MRI shows oedema and inflammation and guides the biopsy site (p167). EMG shows myopathy but is not the book's guide. Strength testing and ANA do not localise active muscle."
      - question: What else should you look for in her?
        options: ["ILD, cardiac involvement and malignancy", "Only thyroid disease", "Nothing; it is a muscle-only disease", "Peripheral neuropathy"]
        answer: 0
        why: "IIM is systemic: lungs, heart (ECG and echo), joints, and adult DM carries a malignancy risk (pp166-168)."
    src: { page: 166, quote: "Heliotrope rash (purple discoloration of eyelids). Gottron's papules (scaly, erythematous plaques over joints)." }
    status: unverified
  - id: rheum.L09.041
    kind: case
    topic: overview
    stem: "A 71-year-old man has 3 years of slowly worsening weakness of the right quadriceps and the left finger flexors. CK is mildly raised. He did not improve on 6 months of prednisone."
    steps:
      - question: Most likely subtype?
        options: ["Inclusion body myositis", "Dermatomyositis", "IMNM", "Polymyositis"]
        answer: 0
        why: "Older man, asymmetric weakness with distal involvement, and poor response to treatment = IBM (p165, book question 8). DM has the rash; IMNM is necrotic with anti-SRP/HMGCR; PM is symmetric and rare now."
      - question: Expected biopsy?
        options: ["Rimmed vacuoles and protein aggregates", "Perifascicular atrophy", "Necrosis with minimal inflammation", "Normal muscle"]
        answer: 0
        why: "IBM combines inflammation with degeneration: rimmed vacuoles and aggregates (p165). Perifascicular atrophy is DM; necrosis with little inflammation is IMNM."
    src: { page: 165, quote: "Inclusion Body Myositis (IBM): Combines autoimmune inflammation with degenerative features such as rimmed vacuoles and protein aggregates." }
    status: unverified
  # ---------- p169-172: book questions (answers printed) ----------
  - id: rheum.L09.042
    kind: mcq
    topic: muscle
    stem: What is the most common presenting symptom of idiopathic inflammatory myopathies?
    options:
      - Distal muscle weakness
      - Symmetrical proximal muscle weakness
      - Muscle atrophy without weakness
      - Paresthesia of extremities
    answer: 1
    why:
      - Distal weakness is a feature of IBM only.
      - "Correct (book key): painless symmetrical weakness of proximal muscles such as shoulders and hips (p169)."
      - Atrophy comes late and follows weakness.
      - Paresthesia is a nerve symptom, not myositis.
    src: { page: 169, quote: "IIM typically presents with painless, symmetrical weakness of proximal muscles such as the shoulders and hips." }
    status: unverified
    tags: [book-question]
  - id: rheum.L09.043
    kind: mcq
    topic: antibodies
    stem: Which autoantibody is most strongly associated with dermatomyositis and a high risk of malignancy?
    options:
      - Anti-MDA5
      - Anti-TIF1γ
      - Anti-SRP
      - Anti-Mi-2
    answer: 1
    why:
      - Anti-MDA5 is amyopathic DM with rapidly progressive ILD.
      - "Correct (book key): anti-TIF1γ is adult-onset DM with paraneoplastic risk (p169)."
      - Anti-SRP is IMNM.
      - Anti-Mi-2 is classic DM with good prognosis.
    src: { page: 169, quote: "Anti-TIF1γ is associated with adult-onset dermatomyositis and paraneoplastic risk." }
    status: unverified
    tags: [book-question, high-yield]
  - id: rheum.L09.044
    kind: mcq
    topic: pathogenesis
    stem: Which best describes the muscle biopsy in inclusion body myositis?
    options:
      - Perifascicular atrophy
      - Necrosis with minimal inflammation
      - CD8+ T-cell infiltration of non-necrotic fibres
      - Rimmed vacuoles and protein aggregates
    answer: 3
    why:
      - Perifascicular atrophy is dermatomyositis.
      - Necrosis with minimal inflammation is IMNM.
      - CD8+ cytotoxicity is the polymyositis lesion.
      - "Correct (book key): degenerative rimmed vacuoles with inflammation (p170)."
    src: { page: 170, quote: "IBM shows degenerative changes, including rimmed vacuoles, along with inflammatory features." }
    status: unverified
    tags: [book-question]
  - id: rheum.L09.045
    kind: mcq
    topic: antibodies
    stem: Which autoantibody is most closely associated with rapidly progressive interstitial lung disease?
    options:
      - Anti-Mi-2
      - Anti-TIF1γ
      - Anti-MDA5
      - Anti-HMGCR
    answer: 2
    why:
      - Anti-Mi-2 is classic DM with good prognosis.
      - Anti-TIF1γ is malignancy.
      - "Correct (book key): anti-MDA5, clinically amyopathic DM and RP-ILD (p170)."
      - Anti-HMGCR is IMNM.
    src: { page: 170, quote: "Anti-MDA5 is linked to clinically amyopathic dermatomyositis and rapidly progressive ILD." }
    status: unverified
    tags: [book-question, high-yield]
  - id: rheum.L09.046
    kind: mcq
    topic: extramuscular
    stem: A patient has heliotrope rash, Gottron's papules and proximal muscle weakness. Most likely diagnosis?
    options:
      - Polymyositis
      - Inclusion body myositis
      - Dermatomyositis
      - Lupus myositis
    answer: 2
    why:
      - Polymyositis has no characteristic rash.
      - IBM is asymmetric, often distal, without these skin signs.
      - "Correct (book key): classic cutaneous signs of DM (p170)."
      - Lupus myositis does not give heliotrope or Gottron's.
    src: { page: 170, quote: "These are classic cutaneous signs of dermatomyositis." }
    status: unverified
    tags: [book-question]
  - id: rheum.L09.047
    kind: mcq
    topic: diagnosis
    stem: Which investigation is most useful for guiding the site of muscle biopsy in IIM?
    options:
      - Electromyography
      - MRI of muscles
      - Muscle strength testing
      - ANA panel
    answer: 1
    why:
      - EMG confirms a myopathy but the needle itself can distort the biopsy site.
      - "Correct (book key): MRI shows inflammation and oedema and targets active muscle (p171)."
      - Strength testing does not show active inflammation.
      - ANA does not localise muscle disease.
    src: { page: 171, quote: "MRI identifies areas of inflammation and edema, helping target active muscle for biopsy." }
    status: unverified
    tags: [book-question]
  - id: rheum.L09.048
    kind: mcq
    topic: diagnosis
    stem: What is the typical electromyographic finding in idiopathic inflammatory myopathies?
    options:
      - Nerve conduction block
      - Fasciculations
      - Myopathic motor unit potentials with spontaneous activity
      - Normal EMG
    answer: 2
    why:
      - Conduction block is a demyelinating neuropathy.
      - Fasciculations are lower motor neurone disease.
      - "Correct (book key): low-amplitude short-duration potentials with fibrillations and positive sharp waves (p171)."
      - EMG is abnormal in active myositis.
