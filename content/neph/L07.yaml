    topic: nps
    text: "In nail-patella syndrome, patellae are absent or hypoplastic in over {{c1::90%}}, iliac horns (pathognomonic) occur in about {{c2::80%}}, and nail changes in about {{c3::98%}}."
    src: { page: 196, quote: "The patellae are absent or hypoplastic in more than 90% of patients with NPS, which may be associated with knee joint effusions and osteo-arthritis (Fig. 46.14).49,50 In about 80% of patients, osseous processes project posteriorly from the iliac wings (iliac horns), which is pathog-nomonic (Fig. 46.15). Anomalies of the elbows include aplasia, hypo-plasia, and posterior processes at the distal end of the humeri." }
    status: unverified
    tags: [numbers, high-yield]
