  - id: neph.L09.lesson6
    title: "الزراعة: مين ينفع يزرع، ومين ينفع يتبرع"
    hook: "الزراعة أحسن علاج، بس مش لأي حد. وأخوه اللي عايز يتبرع محتاج فحص أدق من العيان نفسه."
    minutes: 9
    pages: [318, 325]
    topics: [tx-outcome, tx-recipient, tx-donor]
    goals:
      - "تعرف نتايج الزراعة وأسباب الوفاة مع كلية شغالة"
      - "تحفظ الـ absolute والـ relative contraindications والأمراض اللي بترجع"
      - "تعرف أنواع المتبرعين وفحص المتبرع الحي"
    status: unverified
    steps:
      - kind: explain
        page: 319
        title: "الأرقام"
        quote: "With improvement of immunosuppressive treatment one y graft survival >90% in living or cadaveric transplant. Long term survival is not much impressive half life expectancy for living or deceased donor graft is around 14,10y respectively. Recently with tailoring of IS regimen and desensitization protocols a more liberal selection of potential kidney transplant recipient including ;high- risk category patients example human immunodeficiency virus (HIV)- positive, highly sensitized patients, T-cell positive cross-match, and ABO blood group-incompatible."
        text: |
          الزراعة ==treatment of choice== للـ chronic kidney disease (CKD) المتقدم: حياة أحسن وعمر أطول.

          - **One-year graft survival** أكتر من 90%.
          - **Half-life**: ==14 سنة living==، **10 سنين deceased**.
          - الوفيات أعلى في **أول سنة**، حوالي 7% في سن 50–60.
          - الوفاة مع كلية شغالة: **cardiovascular disease (CVD)، infection، malignancy**.
          - الـ chronic graft dysfunction (fibrosis، tubular atrophy، vasculopathy، glomerulopathy) أساسًا من الـ **chronic rejection**.

          ودلوقتي بنزرع ناس high-risk: human immunodeficiency virus (HIV)، highly sensitised، T-cell positive cross-match، و ABO-incompatible.
      - kind: explain
        page: 320
        title: "الـ absolute contraindications"
        quote: "Severe chronic pulmonary disease. Cardiac failure resistant to treatment severe peripheral vascular disease severe neuropathy with trophic ulcer.Advanced liver disease.Active infection or active GN or vasculitis uncorrectable lower urinary tract problems. Immunologic: Positive CDC at time of transplantation."
        text: |
          الكلية بتتحط **extraperitoneal في الـ inguinal fossa**، والعيان ممكن يخرج بعد أسبوع.

          **Absolute**:
          - ==Malignancy== (إلا لو خالي من رجوع سنين، أو prostate Gleason ≤6، أو renal tumour ≤1 cm بالصدفة).
          - Severe chronic lung disease، heart failure مقاوم، severe peripheral vascular disease (PVD)، neuropathy بـ trophic ulcer.
          - Advanced liver disease.
          - Active infection أو active glomerulonephritis (GN) أو vasculitis.
          - Lower urinary tract مش بيتصلّح.
          - ==Positive complement dependent cytotoxicity (CDC) cross-match== وقت الزراعة.

          **Relative**: morbid obesity، atherosclerosis، قلب، hypertension (HTN) مش منضبط، تدخين، مشاكل نفسية، systemic disease نشط (lupus، sickle cell).
      - kind: sort
        page: 320
        quote: "Relative contraindications: morbid obesity, atherosclerosis, cardiac disease, uncontrolled hypertension, smoking, unresolved psychological issues Active systemic disease (ie, lupus, sickle cell disease, wagn)"
        prompt: "Absolute ولا relative؟"
        bins: ["Absolute", "Relative"]
        cards:
          - { text: "Positive CDC cross-match", bin: 0 }
          - { text: "Active infection", bin: 0 }
          - { text: "Advanced liver disease", bin: 0 }
          - { text: "Smoking", bin: 1 }
          - { text: "Morbid obesity", bin: 1 }
          - { text: "Uncontrolled hypertension", bin: 1 }
        why: "الـ absolute: CDC موجب، عدوى نشطة، كبد متقدم، سرطان نشط، قلب أو رئة متقدمة. الـ relative حاجات ممكن تتظبط: تدخين، وزن، ضغط."
      - kind: explain
        page: 321
        title: "الأمراض اللي بترجع"
        quote: "Focal segmental glomerulosclerosis (FSG), membranous nephropathy (MN), IGA nephropathy and vasculitis, immune complex (IC) mediated membranoglomerulonephritis IC MPGN) and C3 glomerulopathy."
        text: |
          بترجع في الكلية الجديدة: ==focal segmental glomerulosclerosis (FSGS)==، membranous، **immunoglobulin A (IgA)**، vasculitis، IC-MPGN، و C3 glomerulopathy.

          ولازم تكون **هادية قبل الزراعة**: systemic lupus erythematosus (SLE)، antineutrophil cytoplasmic antibodies (ANCA) vasculitis، و antiphospholipid syndrome.

          **Urology (KDIGO 2020)**: اتأكد لو فيه urologic malignancy، urinary tract infection (UTI) متكرر، voiding dysfunction، bladder augmentation، ileal conduit، أو حصوات. و **cystoscopy** للي عنده خطر bladder cancer (cyclophosphamide أو تدخين ≥30 pack-years).
      - kind: mnemonic
        page: 321
        quote: "Focal segmental glomerulosclerosis (FSG), membranous nephropathy (MN), IGA nephropathy and vasculitis, immune complex (IC) mediated membranoglomerulonephritis IC MPGN) and C3 glomerulopathy."
        word: "FIMVC"
        parts:
          - { key: "F", text: "FSGS" }
          - { key: "I", text: "IgA nephropathy" }
          - { key: "M", text: "Membranous and MPGN (immune complex)" }
          - { key: "V", text: "Vasculitis" }
          - { key: "C", text: "C3 glomerulopathy" }
        hook: |
          "**F**ine, **I** **M**ay **V**isit **C**airo": الأمراض دي بتزور الكلية الجديدة تاني.
      - kind: explain
        page: 322
        title: "أنواع المتبرعين"
        quote: "Living donor: A: Blood related- B: unrelated: emotionaly motivated- Commercially motivated (the latter is forbidden)."
        text: |
          **Living**: قريب بالدم، أو غير قريب بدافع عاطفي. أما ==commercially motivated فممنوع==.

          **Cadaveric**: beating heart (brain-stem death) أو non-beating heart.

          الـ living donor مميزاته: **متاح فورًا**، ==cold ischaemia قصير==، ووظيفة الكلية ممتازة. والـ living unrelated بيعيش زي الـ cadaver اللي human leucocyte antigens (HLA) بتاعه متطابق تمامًا.

          المتبرع لازم يكون سليم من أي حاجة تأذيه (سمنة شديدة، prediabetes، تاريخ عائلي لمرض كلى وراثي). على المدى البعيد ممكن hyperfiltration: HTN، proteinuria، FSGS.
      - kind: explain
        page: 323
        title: "فحص المتبرع الحي"
        quote: "Estimate GFR using serum creatinine-based estimating equations and confirm with one or more of the following according to availability: measured GFR using an exogenous filtration marker, (eg.urinary clearance of 99mTc- DTPA) measured creatinine clearance, estimated GFR from the combination of serum creatinine and cystatin C, or repeat estimated GFR using serum creatinine. 5.6: GFRof 90mL/minper1.73m2 or greater should be considered acceptable level of kidney function for donation. KDIGO guidelines 2017. Assess albuminuria using albumin-to-creatinine ratio in an untimed urine specimen, and confirm albuminuria with AER in a timed urine, specimen or by repeating albumin-to-creatinine ratio if AER cannot be obtained."
        text: |
          - **glomerular filtration rate (GFR)**: estimated glomerular filtration rate (eGFR) وتأكيد بـ measured GFR (مثلًا 99mTc-DTPA) أو creatinine clearance (CrCl) أو creatinine + cystatin C. المقبول ==90 mL/min/1.73 m² أو أكتر== (KDIGO 2017).
          - **Albuminuria**: albumin-to-creatinine ratio (ACR) وتأكيد بـ albumin excretion rate (AER).
          - Microscopic haematuria مستمرة؟ دوّر على السبب. حصوات؟ gout؟
          - **blood pressure (BP)** مرتين على الأقل.
          - body mass index (BMI)، سكر (شخصي و gestational وعائلي)، fasting glucose أو glycated haemoglobin (HbA1c)، lipids، تدخين.
          - **Infections**: HIV، hepatitis B virus (HBV)، hepatitis C virus (HCV)، cytomegalovirus (CMV)، Epstein–Barr virus (EBV)، syphilis، UTI.
          - Cancer screening، تاريخ عائلي لمرض كلى، **β-hCG** قبل التبرع على طول، وتقييم نفسي وجهًا لوجه.
      - kind: check
        page: 325
        quote: "Renal imaging (such as a computed tomographic angiography) In general the left kidney should be procured because of the relative technical ease associated with a longer venous pedicle, but procurement of the right kidney may be preferred in some cases because of vascular, urological, or other abnormalities."
        question: "Which donor kidney is usually taken, and why?"
        options:
          - "Left: longer renal vein"
          - "Right: easier to reach"
          - "The smaller one"
          - "Always the one with two arteries"
        answer: 0
        why:
          - "صح: الـ left renal vein أطول، فالعملية أسهل. الـ right لو فيه مشكلة vascular أو urological."
          - "الـ right vein قصير، وده بيصعّب الزراعة."
          - "الكتاب ما قالش كده."
          - "الشرايين الكتير بتصعّب، مش بتسهّل."
      - kind: aside
        tone: tip
        page: 325
        quote: "Select optimal surgical approach by an experienced surgeon Respect donor autonomy during all phases of evaluation and donation. Perform annual postdonation follow-up care including:"
        text: |
          المتبرع ما بيتنساش بعد العملية: ==annual postdonation follow-up== (BP، BMI، creatinine و eGFR، albuminuria، ونمط حياة صحي). والجراحة: mini-open أو laparoscopic أو hand-assisted، بجراح متمرّس.
