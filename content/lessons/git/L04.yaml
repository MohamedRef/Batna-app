  - id: git.L04.lesson1
    title: "سرطان المريء: نوعين ومكانين"
    hook: "واحد فوق بيحب السجاير والشاي السخن، والتاني تحت جاي من الـ reflux والكرش. اعرف مين مين."
    minutes: 9
    pages: [143, 146]
    topics: [eso-epi, eso-risk]
    goals:
      - "تعرف إن الـ esophageal tumors كلها تقريبًا malignant"
      - "تفرّق بين SCC و adenocarcinoma في المكان والخلية وعوامل الخطر"
      - "تحفظ عوامل خطر الـ SCC بالترتيب اللي في الكتاب"
    status: unverified
    steps:
      - kind: explain
        page: 143
        quote: "Most (> 99%) esophageal tumors are MALIGNANT, fewer than 1% are benign."
        title: "المريء مش بيهزّر"
        text: |
          أول معلومة في المحاضرة وأهمها: أكتر من ==99%== من الـ **esophageal tumors** هي **malignant**، وأقل من 1% بس benign.

          يعني لو مريض جالك بـ dysphagia وفي ورم في المريء، افترض إنه سرطان لحد ما تثبت العكس.

          والـ malignant tumors دي تقريبًا كلها **carcinomas**، لأن الـ sarcomas نادرة جدًا.
      - kind: explain
        page: 143
        quote: "In the US where there is no routine screening for esophagus cancer, most patients present with advanced stages"
        title: "ليه بيوصلنا متأخر؟"
        text: |
          الـ **esophageal cancer** هو السابع في الانتشار والسادس في الوفيات في العالم.

          ومفيش **routine screening** له، فأغلب المرضى بييجوا في **advanced stages**:

          - حوالي 50% بييجوا والمرض عدّى الـ locoregional.
          - أقل من 60% من الـ locoregional ينفع يتعملهم curative resection.
          - و70-80% من العينات بعد العملية فيها spread للـ lymph nodes.
      - kind: check
        page: 143
        quote: "Most (> 99%) esophageal tumors are MALIGNANT, fewer than 1% are benign."
        question: "Which statement about esophageal tumors is FALSE?"
        options:
          - "Most esophageal tumors are benign"
          - "Most malignant ones are carcinomas"
          - "Sarcomas of the esophagus are extremely rare"
          - "Leiomyoma is one of the benign tumors"
        answer: 0
        why:
          - "صح إنها غلط: أكتر من 99% malignant. ده بالظبط سؤال الكتاب في آخر المحاضرة."
          - "دي صح: الـ malignant tumors هي carcinomas."
          - "دي صح: عشان كده الـ malignant بتبقى carcinomas."
          - "دي صح: leiomyoma من ضمن الـ benign list."
      - kind: figure
        page: 144
        quote: "Adenocarcinomas usually form in the lower part of the esophagus, near the stomach."
        title: "مين فوق ومين تحت"
        alt: "A vertical esophagus drawn from the throat to the stomach. The upper and middle thirds are labelled squamous cell carcinoma, risk tobacco and alcohol. The lower third near the stomach is labelled adenocarcinoma, risk GERD, Barrett and obesity. Below the junction a box says EGJ and proximal 5 cm of stomach extending into the EGJ are staged as esophageal (Siewert III)."
        caption: "الـ SCC في الـ upper و middle third، والـ adenocarcinoma في الـ lower third جنب المعدة. والـ EGJ tumors بتتعمل staging كأنها esophageal."
        svg: |
          <svg viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
            <rect x="60" y="20" width="50" height="300" rx="20" class="fg-box"/>
            <rect x="60" y="20" width="50" height="200" rx="20" class="fg-acc"/>
            <rect x="60" y="220" width="50" height="100" rx="12" class="fg-good"/>
            <ellipse cx="110" cy="350" rx="70" ry="35" class="fg-thin"/>
            <text x="90" y="375" class="t-sm t-mut">Stomach</text>
            <path d="M118 120h22" class="fg-ink"/>
            <text x="145" y="100" class="t-b t-acc">Squamous cell carcinoma</text>
            <text x="145" y="118" class="t-sm">Upper + middle thirds</text>
            <text x="145" y="136" class="t-sm">Squamous lining cells</text>
            <text x="145" y="154" class="t-sm">Tobacco + alcohol</text>
            <text x="145" y="172" class="t-sm t-mut">Now under 30% in the US</text>
            <path d="M118 270h22" class="fg-ink"/>
            <text x="145" y="240" class="t-b t-good">Adenocarcinoma</text>
            <text x="145" y="258" class="t-sm">Lower third, near stomach</text>
            <text x="145" y="276" class="t-sm">Glandular (mucus) cells</text>
            <text x="145" y="294" class="t-sm">GERD, Barrett, obesity</text>
            <text x="145" y="312" class="t-sm t-mut">Now over 60% in the US</text>
            <path d="M40 320h130" class="fg-arrow"/>
            <text x="190" y="335" class="t-sm t-b">EGJ + proximal 5 cm</text>
            <text x="190" y="351" class="t-sm">into EGJ = esophageal</text>
            <text x="190" y="367" class="t-sm t-mut">(Siewert III)</text>
            <text x="10" y="120" class="t-sm t-mut">Upper</text>
            <text x="10" y="200" class="t-sm t-mut">Middle</text>
            <text x="10" y="275" class="t-sm t-mut">Lower</text>
          </svg>
      - kind: explain
        page: 144
        quote: "over the last two decades adenocarcinoma has dramatically increased and is now over 60% in the US"
        title: "الدنيا اتقلبت"
        text: |
          في الستينات الـ **squamous cancer** كان أكتر من 90% من الحالات. دلوقتي الـ ==adenocarcinoma== بقى أكتر من 60% في أمريكا، والـ squamous أقل من 30%.

          ليه؟ الكتاب بيدّيك عوامل الخطر: **obesity**, high BMI, و**GERD**. وده بالظبط اللي زاد في العالم.
      - kind: explain
        page: 144
        quote: "Estimates of the annual cancer incidence in patients with Barrett's esophagus have ranged from 0.1 to 2.0 percent."
        title: "Barrett: الرقم اللي بيخوّف والرقم اللي بيطمّن"
        text: |
          الـ **Barrett's esophagus** بيرفع الخطر ==30 - 60 مرة==.

          بس الـ annual incidence نفسها **0.1 to 2.0 percent** في السنة. يعني الـ relative risk عالي جدًا، لكن الـ **absolute risk** واطي.
      - kind: aside
        tone: exam
        page: 144
        quote: "the absolute risk of developing cancer is low"
        text: "لو السؤال قال Barrett بيعمل cancer في أغلب المرضى: غلط. الـ relative risk عالي، والـ absolute risk of developing cancer is low."
      - kind: explain
        page: 145
        quote: "Barrett esophagus Age- over 60 (6th -7th decades) Sex- more common in MEN (7times) documented dysplasia tobacco use, obesity, prior radiation therapy."
        title: "عوامل خطر الـ adenocarcinoma"
        text: |
          - **Barrett esophagus**، خصوصًا مع documented **dysplasia**.
          - **Age** فوق 60 (العقد السادس والسابع).
          - الرجالة 7 أضعاف الستات.
          - **Tobacco**, **obesity**, prior radiation، والبيض أكتر.

          والـ morphology: بيبدأ flat أو raised patches في الـ distal third، وممكن يكبر لـ nodular mass 5 cm أو أكتر، أو يعمل ulcer ويغزي للعمق.
      - kind: mnemonic
        page: 145
        quote: "Risk factors of SCC of Esophagus I. Esophageal disorders: Long standing esophagitis Achalasia Plummer-Vinson Syndrome II. Life style: Alcohol Tobacco"
        word: "HOT PATCH"
        parts:
          - { key: "H", text: "Hot beverages (very hot drinks) and HPV" }
          - { key: "O", text: "Old (over 45) and men (4 times)" }
          - { key: "T", text: "Tylosis (genetic), p16/p53/EGFR changes" }
          - { key: "P", text: "Plummer-Vinson syndrome and poverty" }
          - { key: "A", text: "Achalasia, alcohol and long-standing esophagitis" }
          - { key: "T", text: "Tobacco" }
          - { key: "C", text: "Coeliac disease" }
          - { key: "H", text: "History of mediastinal radiation; Blacks 6 times; nitrosamines, fungi, vitamin and trace-metal deficiency" }
        hook: |
          الـ SCC بيحب حاجة **HOT** تلزق على المريء زي **PATCH**: شاي سخن جدًا على سيجارة على كاس.
      - kind: sort
        page: 145
        quote: "Risk factors of SCC of Esophagus I. Esophageal disorders: Long standing esophagitis Achalasia Plummer-Vinson Syndrome"
        prompt: "كل عامل خطر ده بيروح لأنهي نوع أكتر؟"
        bins: ["Squamous cell carcinoma", "Adenocarcinoma"]
        cards:
          - { text: "Achalasia", bin: 0 }
          - { text: "Barrett esophagus", bin: 1 }
          - { text: "Tylosis", bin: 0 }
          - { text: "Obesity / high BMI", bin: 1 }
          - { text: "Very hot beverages", bin: 0 }
          - { text: "GERD", bin: 1 }
          - { text: "Plummer-Vinson syndrome", bin: 0 }
          - { text: "Black race (6 times)", bin: 0 }
        why: "الـ SCC: مرض في المريء نفسه (achalasia, Plummer-Vinson)، tylosis، أكل وشرب سخن، فقر، Blacks. الـ adenocarcinoma: reflux و Barrett والسمنة. والسجاير في الاتنين."
      - kind: aside
        tone: joke
        page: 145
        quote: "Frequent consumption of very hot beverages."
        text: "الشاي اللي بيتشرب وهو بيغلي في القهوة البلدي مش رجولة. الكتاب كاتبها بالنص: frequent consumption of very hot beverages عامل خطر لـ SCC. استنى دقيقتين."
      - kind: check
        page: 146
        quote: "V. Age. Over 45 VI. Sex. Males 4 times more frequently than females."
        question: "Esophageal SCC: which numbers are right?"
        options:
          - "Over 45, males 4 times, Blacks 6 times"
          - "Over 60, males 7 times, Whites more"
          - "Over 30, females 4 times, Blacks 2 times"
          - "Over 45, males 7 times, Whites 6 times"
        answer: 0
        why:
          - "صح: الأرقام دي في صفحة 146."
          - "دي أرقام الـ adenocarcinoma: over 60، men 7 times، whites."
          - "مفيش ولا رقم صح هنا."
          - "خلطت بين النوعين."
      - kind: try
        items: [git.L04.004, git.L04.018, git.L04.025, git.L04.014]
    recap:
      - "أكتر من 99% من الـ esophageal tumors malignant، وتقريبًا كلها carcinomas."
      - "SCC فوق ونص (tobacco + alcohol)، adenocarcinoma تحت (GERD, Barrett, obesity) وبقى الأكتر في أمريكا."
      - "Barrett: relative risk 30-60x، بس absolute risk واطي (0.1-2% في السنة)."
      - "EGJ + أول 5 cm من المعدة لو داخلة في الـ EGJ = staging كـ esophageal (Siewert III)."
      - "عوامل خطر الـ SCC: **HOT PATCH**."
