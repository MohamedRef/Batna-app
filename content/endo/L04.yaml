    topic: cns
    prompt: What is the link between the CNS and the endocrine system?
    outline:
      - The hypothalamus connects the two systems
      - Located at the base of the forebrain
      - Regulates sleep, hunger, thirst, sex, emotion and stress responses
      - Controls the pituitary, which controls the other endocrine glands
