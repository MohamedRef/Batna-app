    src: { page: 128, quote: "C6. Opioid-induced constipation\nDiagnostic criteria\n  1. New, or worsening, symptoms of constipation when initiating, changing, or increasing opioid therapy, that must include two or more of the following:\n    a. Straining during more than 1/4 (25%) of defecations\n    b. Lumpy or hard stools (Bristol Stool Form Scale 1-2) more than 1/4 (25%) of defecations\n    c. Sensation of incomplete evacuation more than 1/4 (25%) of defecations\n    d. Sensation of anorectal obstruction/blockage more than 1/4 (25%) of defecations\n    e. Manual maneuvers to facilitate more than 1/4 (25%) of defecations (e.g., digital evacuation, support of the pelvic floor)\n    f. Fewer than three SBM per week\n  2. Loose stools are rarely present without the use of laxatives." }
