    src: { page: 103, quote: "Consider whether the patient needs further limited investigation (see Box 1).\nNo:\n  1. Make a positive diagnosis of FD\n  2. Explanation of the condition in the context of the gut-brain axis\n  3. Discuss treatment options (drugs and psychological)\n  4. Consider patient's previous treatments and preferences\n  5. Manage expectations and agree follow-up plan (explain there is no cure for FD, that treatments aim to improve quality of life, and are likely to be necessary long-term. Patient education and engagement is key to succesful management.)\nYes: Explain a diagnosis of FD is still likely and the rationale for limited investigations\n  Investigations normal: Make a positive diagnosis of FD\n  Investigations abnormal: Treat organic disease accordingly" }
