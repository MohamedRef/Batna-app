  # ---------- p234-235: pathophysiology ----------
  - id: git.L08.008
    kind: card
    topic: celiac-path
    front: In whom does celiac disease arise?
    back: In a small subset of genetically susceptible people (HLA-DQ2 or DQ8) when dietary gluten stimulates an inappropriate immune response.
    src: { page: 234, quote: "celiac disease arises in a small subset of genetically susceptible (DQ2 or -DQ8) individuals when dietary gluten stimulates an inappropriate immunologic response" }
    status: unverified
  - id: git.L08.009
    kind: card
    topic: celiac-path
    front: What is the autoantigen in celiac disease?
    back: The enzyme tissue transglutaminase (tTG).
    src: { page: 235, quote: "the enzyme tissue transglutaminase (TTG) has been discovered to be the autoantigen against which the abnormal immune response is directed" }
    status: unverified
    tags: [high-yield]
  - id: git.L08.010
    kind: cloze
    topic: celiac-path
    text: "{{c1::Gluten}} is the single major environmental trigger of celiac disease, which is tightly linked to class II HLA {{c2::DQ2}} and, less so, {{c3::DQ8}}."
    src: { page: 235, quote: "Gluten is the single major environmental factor that triggers celiac disease" }
    status: unverified
    tags: [high-yield]
  # ---------- p235-236: clinical presentation ----------
  - id: git.L08.011
    kind: card
    topic: celiac-clinical
    front: Is celiac disease only a small bowel disease?
    back: No. It is a multi-organ autoimmune disease, grossly underdiagnosed, with significant complications.
    src: { page: 235, quote: "Celiac disease is not only dis of S.B but it‘s a multi-organ autoimmune disease." }
    status: unverified
  - id: git.L08.012
    kind: table
    topic: celiac-clinical
    title: Classification of celiac disease
    columns: [Group, Forms]
    rows:
      - [Symptomatic, "Classical or atypical"]
      - [Asymptomatic, "Silent (no symptoms, positive antibodies, abnormal biopsy) or latent (potential, CD in remission)"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 235, quote: "Symptomatic: classical or atypical. 2. Asymptomatic: silent or latent (Potential celiac disease)." }
    status: unverified
  - id: git.L08.013
    kind: card
    topic: celiac-clinical
    front: Two factors that decide the GI symptoms of celiac disease?
    back: The length of small intestine involved and the patient's age at presentation.
    src: { page: 235, quote: "depend on the length of small intestine involved and the patient‘s age when the disease presents" }
    status: unverified
  - id: git.L08.014
    kind: enumerate
    topic: celiac-clinical
    prompt: Mention the classic malabsorption symptoms of celiac disease, and the age group they are most common in.
    points:
      - Diarrhea
      - Steatorrhea
      - Weight loss
      - Abdominal distention
      - Weakness and muscle wasting
      - Growth retardation
      - "Most common in infants under 2 years"
    pass: 5
    src: { page: 235, quote: "including diarrhea, steatorrhea, weight loss, abdominal distention, weakness, muscle wasting, or growth retardation, more commonly present in infants" }
    status: unverified
  - id: git.L08.015
    kind: card
    topic: celiac-clinical
    front: Why do older children and adults with celiac disease have flatulence?
    back: Colonic bacteria digest the malabsorbed nutrients.
    src: { page: 235, quote: "They may report chronic diarrhea, dyspepsia, or flatulence due to colonic bacterial digestion of malabsorbed nutrients" }
    status: unverified
  - id: git.L08.016
    kind: enumerate
    topic: celiac-clinical
    prompt: Enumerate the atypical (extraintestinal) presentations of celiac disease in adults.
    points:
      - Fatigue
      - Depression
      - Iron deficiency anemia
      - Osteoporosis
      - Short stature
      - Delayed puberty
      - Amenorrhea or reduced fertility
    pass: 5
    src: { page: 235, quote: "including fatigue, depression, iron deficiency anemia, osteoporosis, short stature, delayed puberty, amenorrhea, or reduced fertility" }
    status: unverified
    tags: [high-yield]
  - id: git.L08.017
    kind: card
    topic: celiac-clinical
    front: Which skin disease is pathognomonic of celiac disease?
    back: Dermatitis herpetiformis.
    src: { page: 235, quote: "Skin manifestations in the form of dermatitis herpetiformis which is pathognomonic to celiac disease." }
    status: unverified
    tags: [high-yield]
  - id: git.L08.018
    kind: card
    topic: celiac-clinical
    front: Describe the lesions and sites of dermatitis herpetiformis.
    back: Symmetric, intensely pruritic grouped vesicles, crusts and erosions over the extensor elbows, knees, buttocks, shoulders and scalp.
    src: { page: 235, quote: "Symmetric intensely pruritic vesicles, crusts and erosions distributed over the extensor areas of the elbows" }
    status: unverified
  - id: git.L08.019
    kind: card
    topic: celiac-clinical
    front: Neurological manifestations of celiac disease?
    back: Ataxia, fits, or peripheral neuropathy.
    src: { page: 236, quote: "Neurological manifestations like ataxia, fits or peripheral neuropathy." }
    status: unverified
  - id: git.L08.020
    kind: card
    topic: celiac-clinical
    front: How is the presentation of celiac disease changing?
    back: Away from classic disease toward more atypical or asymptomatic presentations.
    src: { page: 236, quote: "there is a shift from patients presenting with classic celiac disease to more patients with atypical symptoms or an asymptomatic presentation" }
    status: unverified
  - id: git.L08.021
    kind: enumerate
    topic: celiac-clinical
    prompt: Mention the three features of the classic definition of celiac disease.
    points:
      - Villous atrophy
      - Symptoms of malabsorption
      - Resolution of the lesion and symptoms on gluten withdrawal (weeks to months)
    pass: 3
    src: { page: 236, quote: "villous atrophy; symptoms of malabsorption and resolution of the mucosal lesions and symptoms upon withdrawal of gluten-containing foods" }
    status: unverified
    tags: [high-yield]
  - id: git.L08.022
    kind: mcq
    topic: celiac-clinical
    stem: A 34-year-old woman has iron deficiency anemia that does not respond to oral iron, low bone density and two years of infertility. She has no diarrhea. Which diagnosis should be tested for first?
    options:
      - Celiac disease
      - Crohn disease
      - Whipple disease
      - Tropical sprue
      - Irritable bowel syndrome
    answer: 0
    why:
      - "Correct: many adults with celiac disease present with atypical features such as iron deficiency anemia, osteoporosis and reduced fertility (p235)."
      - Crohn disease usually causes pain, diarrhea and weight loss.
      - Whipple disease is rare, mostly in men aged 40–60, with arthralgia and weight loss.
      - Tropical sprue causes malabsorption with diarrhea after tropical exposure.
      - IBS does not cause iron deficiency or osteoporosis.
    src: { page: 235, quote: "present with extraintestinal ―atypical‖manifestations, including fatigue, depression, iron deficiency anemia, osteoporosis" }
    status: unverified
  # ---------- p236-237: diagnosis, serology, genetics ----------
  - id: git.L08.023
    kind: card
    topic: celiac-serology
    front: What must the patient be eating when celiac tests are done?
    back: A gluten-rich diet; all testing should be performed on gluten.
    src: { page: 236, quote: "All testing should be performed while patients are on a gluten-rich diet." }
    status: unverified
    tags: [high-yield]
  - id: git.L08.024
    kind: enumerate
    topic: celiac-serology
    prompt: Enumerate the items the diagnosis of celiac disease depends on.
    points:
      - Compatible clinical manifestations
      - Serological markers
      - Small bowel biopsy findings
      - Clinical response to a gluten-free diet
    pass: 4
    src: { page: 236, quote: "Clinical manifest compatible w dis. Serological markers. Small bowel biopsy findings. Clinical response to gluten free diet." }
    status: unverified
  - id: git.L08.025
    kind: card
    topic: celiac-serology
    front: Most common anemia in celiac disease?
    back: Iron deficiency anemia, although anemia of any type can occur.
    src: { page: 236, quote: "anemia of any type can be found, the most common is iron deficiency anemia" }
    status: unverified
  - id: git.L08.026
    kind: cloze
    topic: celiac-serology
    text: "{{c1::tTG IgA}} and {{c2::EMA IgA}} have sensitivities and specificities of {{c3::90–98%}} and are used for initial screening."
    src: { page: 237, quote: "Tissue transglutaminase tTG IgA, Endomysial antibody EMA Ig A are useful and have reported sensitivities of 90–98% and specificities of 90–98%" }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L08.027
    kind: card
    topic: celiac-serology
    front: When are tTG IgA and EMA IgA falsely negative, and what do you order then?
    back: In IgA deficiency (confirm with serum IgA). Then order tTG IgG and EMA IgG.
    src: { page: 237, quote: "They give false negative results if the patient has Ig A deficiency that can be confirmed by serum IgA assay." }
    status: unverified
    tags: [high-yield]
  - id: git.L08.028
    kind: card
    topic: celiac-serology
    front: Serological test of choice in IgA-deficient patients?
    back: IgG anti-deamidated gliadin peptide (DGP), which is more sensitive and specific than IgG anti-tTG.
    src: { page: 237, quote: "IgG anti- DGP has higher sensitivity and specificity than IgG antiTGA and is the serological test of choice in IgA-deficient individuals" }
    status: unverified
    tags: [high-yield]
  - id: git.L08.029
    kind: cloze
    topic: celiac-serology
    text: "HLA-DQ2 is found in {{c1::95%}} of celiac patients and HLA-DQ8 in another {{c2::5%}}; the negative predictive value of the tests is over {{c3::99%}}."
    src: { page: 237, quote: "The HLA-DQ2 test picks up 95%, and the HLA-DQ8 another 5% of patients. The negative predictive value for both tests is higher than 99%." }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L08.030
    kind: card
    topic: celiac-serology
    front: What is the use of HLA-DQ2/DQ8 testing in celiac disease?
    back: A good negative test. Absence of both effectively excludes celiac disease; it is not routine for every suspected patient.
    src: { page: 237, quote: "The absence of both HLA-DQ2 and HLA-DQ8 effectively excludes the diagnosis of celiac disease" }
    status: unverified
  - id: git.L08.031
    kind: mcq
    topic: celiac-serology
    stem: A 28-year-old with chronic diarrhea and suspected celiac disease has a negative tTG IgA. Total serum IgA is very low. What is the best next serological test?
    options:
      - IgG anti-deamidated gliadin peptide
      - Repeat tTG IgA after 3 months
      - EMA IgA
      - HLA-B27
      - Start a gluten-free diet and see
    answer: 0
    why:
      - "Correct: IgG anti-DGP is the serological test of choice in IgA deficiency (p237)."
      - The IgA test is falsely negative in IgA deficiency; repeating it will not help.
      - EMA IgA is also an IgA test and falsely negative.
      - HLA-B27 is not a celiac test; HLA-DQ2/DQ8 is.
      - Testing must be done on a gluten-rich diet; starting GFD first spoils the work-up.
    src: { page: 237, quote: "IgG anti- DGP has higher sensitivity and specificity than IgG antiTGA and is the serological test of choice in IgA-deficient individuals" }
    status: unverified
  - id: git.L08.032
    kind: mcq
    topic: celiac-serology
    stem: A 40-year-old started a gluten-free diet on her own a year ago and feels better. Biopsy is now normal. She wants to know if she ever had celiac disease. HLA-DQ2 and DQ8 are both negative. What does this mean?
    options:
      - Celiac disease is effectively excluded
      - She has latent celiac disease
      - She needs a gluten challenge and repeat biopsy
      - She has refractory celiac disease
      - The test is unreliable on a gluten-free diet
    answer: 0
    why:
      - "Correct: absence of both HLA-DQ2 and DQ8 effectively excludes celiac disease; NPV over 99% (p237)."
      - Latent disease still needs the HLA genotype.
      - A gluten challenge is pointless when the genotype is absent.
      - Refractory disease means no response to GFD; she responded.
      - HLA genotype does not depend on diet, unlike serology.
    src: { page: 237, quote: "The absence of both HLA-DQ2 and HLA-DQ8 effectively excludes the diagnosis of celiac disease" }
    status: unverified
  # ---------- p237-238, 245: biopsy ----------
  - id: git.L08.033
    kind: enumerate
    topic: celiac-biopsy
    prompt: Mention the endoscopic findings of celiac disease (seen in about 30%).
    points:
