          - **تحت كل مرحلة دايرة**:
            - **1-2 (أخضر)**: genetic risk، **Diabetes**، primary nephropathy، **Hypertension**، inflammation.
            - **3-4 (أصفر)**: **Anemia**، **Uremic toxins**، inflammation، electrolytes.
            - **5-6 (برتقاني)**: نفس اللي فات + **Tissue calcification** و **EPO resistance**.
            - **الوردي يمين**: cytokines، endothelial dysfunction، **LDL oxidation**، atherosclerosis، bone remodeling.
          - **تحت**: الكل بيوصل لـ **Chronic Heart Dysfunction**.

          الرسمة بتجاوب "ليه الخطر بيكبر مع الـ stage": كل مرحلة ==بتضيف أسباب جديدة== فوق اللي قبلها، لحد الـ calcification في الآخر.
