  - id: res.L05.051
    kind: case
    topic: risk
    stem: In a community study, lung cancer incidence was 120/100,000 in smokers and 10/100,000 in non-smokers.
    steps:
      - question: What is the relative risk for smokers?
        options: ["5", "12", "50", "100", "120"]
        answer: 1
        why: "RR = Ie/Io = 120/10 = 12."
