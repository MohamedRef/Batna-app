          - { key: "A", text: "Ascites" }
          - { key: "J", text: "Jaundice" }
          - { key: "H", text: "Hepatomegaly (tender)" }
        hook: |
          بعد الـ BMT بُصّ في وِش (وَجه) العيان: **WAJH**. اتنين أو أكتر خلال 20 يوم بعد الـ BMT = فكّر في SOS (**Seattle or Baltimore criteria**).
      - kind: explain
        page: 81
        quote: "Lack of specific clinical signs or serological diagnostic tools makes recognition of SOS challenging. Diagnosis is based on a high index of clinical suspicion."
        title: "صعب ليه؟"
        text: |
          مفيش **specific clinical signs** ولا **serological test**. فالتشخيص على ==high index of suspicion== بعد استبعاد اللي بيقلّده:

          - **Acute liver GvHD**، liver infections، **sepsis with cholestasis**، other DILI، cardiac diseases، other causes of ascites، renal failure.

          لو الـ criteria مش كاملة أو محتاج تستبعد حاجة: ==transjugular liver biopsy==.
      - kind: figure
