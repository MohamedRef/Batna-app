  # ------------------------------------------------------------------
  - id: res.L11.lesson6
    title: "نحسبها بإيدينا: survey و case-control و cohort"
    hook: "نفس أرقام شاشات Epi Info في المحاضرة، بس تفهم كل رقم جه منين."
    minutes: 10
    pages: [72, 89]
    topics: [calculation]
    goals:
      - "تعرف مدخلات الـ population survey"
      - "تفهم ليه الـ margin الأصغر بيكبّر العينة"
      - "تقرا جدول Kelsey و Fleiss في الـ case-control والـ cohort"
    status: unverified
    steps:
      - kind: explain
        page: 72
        quote: "Requirements:\n1. The population size\n2. The expected prevalence from previous studies or pilot study or expert opinion (If no previous data from research use 50% expected prevalence)\n3. Accepted margin of error (Alpha)\n4. Confidence level (always 95%)"
        title: "1. Prevalence study (population survey)"
        text: |
          محتاج 4 حاجات:

          - **Population size**.
          - **Expected prevalence**: من دراسات قبل كده أو pilot أو experts. ولو مفيش أي بيانات، استخدم ==50%==.
          - **Margin of error** المقبول (الدقة اللي عايزها، ±كام %).
          - **Confidence level**: دايمًا **95%**.

          ليه 50%؟ لأن p × (1 − p) بتبقى **أكبر حاجة** عند 50%، فبتطلع أكبر وأأمن عينة.
      - kind: explain
        page: 75
        quote: "Population survey or descriptive study\nFor simple random sampling, leave design effect and clusters equal to 1.\nPopulation size: 100000\nExpected frequency: 30%\nAcceptable Margin of Error: 5%\nDesign effect: 1.0\nClusters: 1\n| Confidence Level | Cluster Size | Total Sample |\n|---|---|---|\n| 80% | 138 | 138 |\n| 95% | 322 | 322 |\n| 99% | 554 | 554 |\n| 99.9% | 901 | 901 |\n| 99.99% | 1256 | 1256 |"
        title: "شاشة Epi Info: Population survey"
        text: |
          المثال: population **100,000**، expected frequency **30%**، margin **5%**، والـ **design effect = 1** (للـ simple random sampling).

          عند **95%** confidence: ==n = 322==.

          المعادلة اللي وراها: n = N·p(1 − p) ÷ [(d²/z²)(N − 1) + p(1 − p)]، و z = 1.96 للـ 95%.

          ولو الـ sampling بالـ **cluster**، الـ design effect بيبقى أكبر من 1 (غالبًا 2)، فالعينة بتتضاعف.
      - kind: check
        page: 76
        quote: "Population survey or descriptive study\nFor simple random sampling, leave design effect and clusters equal to 1.\nPopulation size: 100000\nExpected frequency: 30%\nAcceptable Margin of Error: 3%\nDesign effect: 1.0\nClusters: 1\n| Confidence Level | Cluster Size | Total Sample |\n|---|---|---|\n| 80% | 382 | 382 |\n| 90% | 627 | 627 |\n| 95% | 888 | 888 |\n| 97% | 1087 | 1087 |\n| 99% | 1525 | 1525 |\n| 99.9% | 2464 | 2464 |\n| 99.99% | 3413 | 3413 |"
        question: "Same survey (100,000 people, expected 30%, 95% confidence), but the margin of error drops from 5% to 3%. The sample size becomes"
        options: ["888", "322", "194", "554"]
        answer: 0
        why:
          - "صح: n بيمشي مع 1/d²، فالدقة الأعلى بتكلّف عينة أكبر بكتير."
          - "322 ده مع margin 5%."
          - "الـ margin الأصغر عمره ما يصغّر العينة."
          - "554 ده سطر الـ 99% مع margin 5%."
      - kind: explain
        page: 77
        quote: "Requirements:\nProbability of exposure in cases\nProbability of exposure in controls\nStatistical power (80%)\nConfidence level (the remaining of alpha ……1-α)\nNumber of controls per subject in the cases group"
        title: "2. Unmatched case-control"
        text: |
          محتاج:

          - نسبة الـ **exposure** في الـ **cases**، ونسبته في الـ **controls**.
          - **Power** 80%، و **confidence level** (1 − α).
          - عدد الـ **controls لكل case**.

          في Epi Info: StatCalc ← **Unmatched case-control**.
      - kind: table
        page: 81
        quote: "Unmatched Case-Control Study (Comparison of ILL and NOT ILL)\nTwo-sided confidence level: 95%\nPower: 80%\nRatio of controls to cases: 1\nPercent of controls exposed: 20%\nOdds ratio: 1.71429\nPercent of cases with exposure: 30%\n| | Kelsey | Fleiss | Fleiss w/ CC |\n|---|---|---|---|\n| Cases | 295 | 294 | 313 |\n| Controls | 295 | 294 | 313 |\n| Total | 590 | 588 | 626 |"
        title: "Controls 20% exposed، cases 30%: الـ odds ratio = 1.71"
        columns: ["", "Kelsey", "Fleiss", "Fleiss + CC"]
        rows:
          - ["Cases", "295", "294", "313"]
          - ["Controls", "295", "294", "313"]
          - ["Total", "590", "588", "626"]
        hide: [[0, 1], [2, 1]]
      - kind: aside
        tone: exam
        page: 81
        quote: "Unmatched Case-Control Study (Comparison of ILL and NOT ILL)\nTwo-sided confidence level: 95%\nPower: 80%\nRatio of controls to cases: 1\nPercent of controls exposed: 20%\nOdds ratio: 1.71429\nPercent of cases with exposure: 30%\n| | Kelsey | Fleiss | Fleiss w/ CC |\n|---|---|---|---|\n| Cases | 295 | 294 | 313 |\n| Controls | 295 | 294 | 313 |\n| Total | 590 | 588 | 626 |"
        text: |
          الشريحة معلّمة على عمود **Kelsey**: 295 cases + 295 controls.

          الـ 3 أعمدة 3 معادلات لنفس السؤال. **Fleiss with continuity correction (CC)** دايمًا الأكبر والأحوط. لو السؤال جاب الأرقام دي، دوّر على اللي الشريحة علّمت عليه.
      - kind: case
        page: 85
        quote: "3. Sample size calculation for Independent cohort studies\nUnmatched Cohort and Cross-Sectional Studies (Exposed and Nonexposed)\nTwo-sided confidence level: 95%\nPower: 80%\nRatio (Unexposed : Exposed): 1\n% outcome in unexposed group: 25\nRisk ratio: 1.52\nOdds ratio: 1.83871\n% outcome in exposed group: 38\n| | Kelsey | Fleiss | Fleiss w/ CC |\n|---|---|---|---|\n| Exposed | 201 | 200 | 215 |\n| Unexposed | 201 | 200 | 215 |\n| Total | 402 | 400 | 430 |"
        stem: "Cohort study: outcome in 25% of the unexposed and 38% of the exposed, equal groups, 95% confidence, 80% power."
        steps:
          - question: "Which StatCalc module do you open?"
            options: ["Cohort or cross-sectional", "Population survey", "Unmatched case-control"]
            answer: 0
            why: "الـ cohort بيقارن **outcome** في exposed و unexposed؛ ده module الـ **cohort or cross-sectional**."
          - question: "What is the risk ratio you are trying to detect?"
            options: ["1.52 (38/25)", "1.84", "0.66"]
            answer: 0
            why: "RR = 38% ÷ 25% = **1.52**. الـ 1.84 ده الـ odds ratio."
          - question: "How many per group (Kelsey)?"
            options: ["201 exposed + 201 unexposed", "200 + 200", "215 + 215"]
            answer: 0
            why: "Kelsey = **201** لكل مجموعة (402). Fleiss = 200، و Fleiss + CC = 215."
      - kind: check
        page: 87
        quote: "Unmatched Cohort and Cross-Sectional Studies (Exposed and Nonexposed)\nTwo-sided confidence level: 95%\nPower: 80%\nRatio (Unexposed : Exposed): 1\n% outcome in unexposed group: 4.9%\nRisk ratio: 3.67347\nOdds ratio: 4.26033\n% outcome in exposed group: 18%\n| | Kelsey | Fleiss | Fleiss w/ CC |\n|---|---|---|---|\n| Exposed | 93 | 92 | 107 |\n| Unexposed | 93 | 92 | 107 |\n| Total | 186 | 184 | 214 |"
        question: "The CMV example: 18% versus 4.9% (risk ratio 3.67). Compared with the 38% versus 25% cohort (201 per group), the sample is"
        options: ["Smaller: 93 per group (Kelsey)", "Larger: 402 per group", "The same: 201 per group", "Smaller: 25 per group"]
        answer: 0
        why:
          - "صح: الفرق أكبر بكتير (effect size كبير)، فعينة أصغر بتكفي."
          - "الـ effect size الكبير بيصغّر العينة، مش بيكبّرها."
          - "العينة بتتغير مع الـ effect size."
          - "الرقم ده مش من الجدول؛ Kelsey 93 و Fleiss 92."
      - kind: explain
        page: 89
        quote: "Calculation requirements\n1. Expected effect size (difference between groups regarding the primary outcome)\n2. Type of clinical trial: Cross over or parallel\n3. Allocation ratio between the experimental and control groups\n4. Statistical power\n5. Alpha\n6. In the case of non inferiority or equivalence study we need what is called non inferiority margin or equivalence limit respectively"
        title: "4. Clinical trials، والـ outcome الرقمي"
        text: |
          الـ **clinical trial** محتاج: الـ **effect size** على الـ primary outcome، نوع الـ trial (**cross-over** ولا **parallel**)، الـ **allocation ratio**، الـ **power**، الـ **alpha**، ولو non-inferiority أو equivalence: الـ ==non-inferiority margin== أو الـ **equivalence limit**.

          وكل الأمثلة اللي فاتت كانت **qualitative outcome** (فرق بين نسبتين). لو الـ outcome **quantitative** (فرق متوسطات و standard deviation)، الأحسن ==G*Power==.
      - kind: try
        items: [res.L11.071, res.L11.076, res.L11.081, res.L11.082]
    recap:
      - "Survey: population size، expected prevalence (50% لو مفيش بيانات)، margin، confidence 95%."
      - "100,000، 30%، margin 5% ← 322؛ margin 3% ← 888."
      - "Case-control: exposure في cases و controls، power، confidence، controls per case. مثال 20% ضد 30% ← Kelsey 295 + 295."
      - "Cohort: outcome في exposed و unexposed. 25% ضد 38% ← 201 + 201؛ 4.9% ضد 18% ← 93 + 93."
      - "Quantitative outcome ← G*Power."
    practice: [res.L11.071, res.L11.072, res.L11.073, res.L11.074, res.L11.075, res.L11.076, res.L11.077, res.L11.078, res.L11.079, res.L11.080, res.L11.081, res.L11.082]
