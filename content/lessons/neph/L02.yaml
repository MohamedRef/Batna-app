        items: [neph.L02.025, neph.L02.031, neph.L02.021, neph.L02.022]
    recap:
      - "eGFRcr-cys أدق؛ قيس cystatin C لو شاكك في الـ creatinine."
      - "عضل أقل = eGFR أحسن من الحقيقة؛ عضل أكتر أو creatine = أوحش."
