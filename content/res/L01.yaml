items:
  # ---------- slides 2-9: the course ----------
  - id: res.L01.001
    kind: card
    topic: course
    front: What are the two parts of the Basics of Research course?
    back: Part 1, research methodology, and part 2, biostatistics. The course covers the whole research process, not only study design.
    src: { page: 2, quote: "PART 1: RESEARCH METHODOLOGY PART 2: BIOSTATISTICS" }
    status: unverified
  - id: res.L01.002
    kind: enumerate
    topic: course
    prompt: List the skills the course aims to give participants (slides 3-4).
    points:
      - Prioritize problems for research
      - Formulate a focused research question or hypothesis
      - Select a study design that fits the question
      - Turn the question into a research plan and write a proposal
      - Implement the research project
      - Process, analyze and interpret the data
      - Write a scientific research paper
      - Plan to communicate the findings and implement the recommendations
    pass: 6
    src: { page: 3, quote: "prioritize problems for research formulate a focused research question/hypothesis select an appropriate study design" }
    status: unverified
  - id: res.L01.003
    kind: card
    topic: course
    front: Which skill does the course name as an essential step for practicing evidence-based medicine (EBM)?
    back: Critically appraising published medical articles to judge their quality.
    src: { page: 6, quote: "As an essential step for practicing EBM, Participants will acquire the skill to critically appraise published medical articles to judge their quality." }
    status: unverified
  - id: res.L01.004
    kind: cloze
    topic: course
    text: Data analysis in the course is taught step by step using {{c1::SPSS}} (Statistical Package for the Social Sciences).
    src: { page: 7, quote: "step-by-step guide to data analysis using SPSS (Statistical Package for the Social Sciences) for Windows" }
    status: unverified
  - id: res.L01.005
    kind: mcq
    topic: course
    stem: How is the Basics of Research course assessed?
    options:
      - An online objective written exam at the end of the course, 100% of the grade
      - A research proposal (50%) and a written exam (50%)
      - An essay exam with short-answer questions
      - Continuous assessment of SPSS assignments
    answer: 0
    why:
      - "Slide 9: summative assessment at the end of the course is an online objective written exam, 100%."
      - The grading policy on the slide gives no weight to a proposal.
      - The exam is objective (MCQ, matching, true/false), not essay.
      - SPSS is taught hands-on but the slide grades only the final exam.
    src: { page: 9, quote: "ONLINE Objective written exam 100%" }
    status: unverified
    tags: [high-yield]
  - id: res.L01.006
    kind: enumerate
    topic: course
    prompt: Which question formats does the end-of-course online exam include?
    points: [Multiple choice questions, Matching items, True/False items]
    pass: 3
    src: { page: 9, quote: "-Multiple Choice Questions -Matching items -True/False Items" }
    status: unverified
  # ---------- slides 11-16: definition, the question, the researcher, objectives ----------
  - id: res.L01.007
    kind: card
    topic: definition
    front: Define research.
    back: The systematic and organized methods used to find an answer to a certain question or a solution for a problem.
    src: { page: 12, quote: "Research is the systematic and organized methods to find answer for a certain question, or solution fora problem." }
    status: unverified
    tags: [high-yield]
  - id: res.L01.008
    kind: cloze
    topic: definition
    text: "In the definition of research, {{c1::systematic}} means a definite set of procedures and steps followed to get the most accurate results, and {{c2::organized}} means there is a structure."
    src: { page: 14, quote: "Systematic: Definite set of procedures and steps followed to get most accurate results." }
    status: unverified
  - id: res.L01.009
    kind: enumerate
    topic: definition
    prompt: Why is a clear research question essential?
    points:
      - Creates the path for the research process
      - Guides writing
      - Avoids an overwhelming "all about" research
      - Supports a specific topic
      - Keeps the research manageable
    pass: 4
    src: { page: 13, quote: "Creates path for research process Guides writing Avoids overwhelming “all about” research Supports specific topic/ research Keeps research manageable" }
    status: unverified
  - id: res.L01.010
    kind: mcq
    topic: definition
    stem: According to the lecture, which is NOT one of the benefits of having a clear research question?
    options:
      - It guarantees a statistically significant result
      - It keeps the research manageable
      - It avoids an overwhelming "all about" research
      - It guides writing
    answer: 0
    why:
      - Correct. A good question shapes the study; it cannot promise any result.
      - Listed on slide 13.
      - Listed on slide 13.
      - Listed on slide 13.
    src: { page: 13, quote: "Guides writing Avoids overwhelming “all about” research Supports specific topic/ research Keeps research manageable" }
    status: unverified
  - id: res.L01.011
    kind: card
    topic: definition
    front: What three qualities does the lecture ask of the researcher?
    back: "Be patient, be ambitious, and remember it is re-search: you search again and again."
    src: { page: 15, quote: "Should be Patient Should be Ambitious Remember it is research" }
    status: unverified
  - id: res.L01.012
    kind: enumerate
    topic: objectives
    prompt: List the prime objectives of research (6).
    points:
      - Discover new facts
      - Verify and test important facts
      - Analyze an event, process or phenomenon to identify cause and effect
      - Develop new scientific tools, concepts and theories
      - Find solutions to scientific, nonscientific and social problems
      - Overcome problems occurring in everyday life
    pass: 5
    src: { page: 16, quote: "The prime objectives of research are: 1. To discover new facts 2, To verify and test important facts" }
    status: unverified
  - id: res.L01.013
    kind: mcq
    topic: objectives
    stem: A team studies whether smoking shisha causes bladder cancer. Which prime objective of research does this serve most directly?
    options:
      - To discover new facts
      - To analyze an event or phenomenon to identify the cause and effect relationship
      - To develop new scientific tools
      - To verify and test important facts
    answer: 1
    why:
      - Possible, but the study's aim is a cause and its effect.
      - Correct. Linking an exposure to a disease is a cause-effect question (objective 3 on slide 16).
      - No new tool or theory is built here.
      - Verifying would fit if the link were already established and being retested.
    src: { page: 16, quote: "To analyze an event or process or phenomenon to identify the cause and effect relationship" }
    status: unverified
  - id: res.L01.014
    kind: enumerate
    topic: objectives
    prompt: List the characteristics of research (slide 20).
    points:
      - It demands a clear statement of the problem
      - It requires clear objectives and a plan (not aimless looking)
      - It builds on existing data, using both positive and negative findings
      - New data are systematically collected and analyzed to answer the original questions or objectives
    pass: 4
    src: { page: 20, quote: "It demands a clear statement of the problem. It requires clear objectives and a plan" }
    status: unverified
    tags: [high-yield]
  - id: res.L01.015
    kind: mcq
    topic: objectives
    stem: Which statement about the characteristics of research is correct?
    options:
      - Research builds on existing data, using both positive and negative findings
      - Research builds only on positive findings from earlier studies
      - Research may look aimlessly until it comes across a solution
      - Data can be collected first and the question chosen afterwards
    answer: 0
    why:
      - Correct, slide 20.
      - Negative findings count too; ignoring them repeats old failures.
      - The slide says research "is not aimlessly looking for something".
      - New data are collected to answer the original questions or objectives.
    src: { page: 20, quote: "It builds on existing data, using both positive and negative findings." }
    status: unverified
  # ---------- slides 5, 17-22: process and proposal ----------
  - id: res.L01.016
    kind: order
    topic: process
    prompt: Put the 8 steps of the research process (slide 17) in order.
    steps:
      - Identifying the problem
      - Reviewing literature
      - Setting research questions, objectives and hypotheses
      - Choosing the study design
      - Deciding on the sample design
      - Collecting data
      - Processing and analyzing data
      - Writing the report
    src: { page: 17, quote: "Identifying The Problem 2. Reviewing Literature 3. Setting Research Questions, Objectives, 4. Choosing 6. Collecting Data The Study Design" }
    status: unverified
    tags: [high-yield]
  - id: res.L01.017
    kind: mcq
    topic: process
    stem: In the 8-step research process, which step comes directly after choosing the study design?
    options:
      - Deciding on the sample design
      - Collecting data
      - Reviewing literature
      - Setting research questions, objectives and hypotheses
    answer: 0
    why:
      - Correct. Step 4 is the study design and step 5 the sample design.
      - Data collection is step 6, after the sample is decided.
      - The literature review is step 2.
      - Questions, objectives and hypotheses are step 3, before the design.
    src: { page: 17, quote: "4. Choosing 6. Collecting Data The Study Design 5. Deciding On The Sample Design" }
    status: unverified
  - id: res.L01.018
    kind: order
    topic: process
    prompt: Order the steps of conducting a health research project (slide 21).
    steps:
      - Prioritizing and selecting a research topic
      - Review of literature and other existing information
      - Development of a research proposal
      - Getting formal institutional approval
      - Data collection (field work)
      - Data processing and analysis
      - Final report (manuscript) writing
      - Recommendations for implementing the findings
    src: { page: 21, quote: "Prioritizing and selecting a research topic • Review of literature and other existing information • Development of a research proposal • Getting formal institutional approval" }
    status: unverified
  - id: res.L01.019
    kind: table
    topic: process
    title: "Steps in research (slide 22): the three phases"
    columns: [Phase, Steps]
    rows:
      - [Planning, "1 Define the research problem, 2 Review of literature, 3 Methodology"]
      - [Execution, "4 Data collection for pretest, 5 Data collection"]
      - [Process of concluding, "6 Analysis, 7 Inferences, 8 Reporting"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 22, quote: "Process of Concluding Review of Literature Methodology" }
    status: unverified
  - id: res.L01.020
    kind: cloze
    topic: process
    text: "In the 'steps in research' figure, the pretest comes in the {{c1::execution}} phase, before the main data collection; analysis, inferences and reporting form the {{c2::process of concluding}}."
    src: { page: 22, quote: "Process of Concluding" }
    status: unverified
  - id: res.L01.021
    kind: card
    topic: process
    front: In the hierarchy for addressing a research problem (slide 19), what comes from bottom to top?
    back: Research objectives or hypotheses → research aim → research problem or question(s) → research gap(s). Each level answers the one above it.
    src: { page: 19, quote: "Addressing regearch problem or question(s)" }
    status: unverified
  - id: res.L01.022
    kind: table
    topic: process
    title: "Developing the research proposal: question → step"
    columns: [Question you must ask, Step you take]
    rows:
      - ["What is the problem and why should it be studied?", "Selection, analysis and statement of the research problem"]
      - ["What information is available?", Literature review]
      - ["Why do we want to carry out the research? What do we hope to achieve?", Formulation of research objectives]
      - ["What additional data do we need, and how will we collect them?", Research methodology]
      - ["Who will do what, and when?", Work plan]
      - ["What resources do we need, and what do we have?", Budget]
