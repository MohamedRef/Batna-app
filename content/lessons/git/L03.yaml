        quote: "DIAGNOSTIC CRITERIA\n| Rome III criteria | Rome IV criteria (2016) |\n|---|---|\n| Recurrent abdominal pain or discomfort, on average at least 3 days/month in the last 3 months and associated with ≥2 of the following criteria: | Recurrent abdominal pain, on average at least 1 day per week in the last 3 months and associated with ≥2 of the following criteria: |\n| Improve with defecation. | Related to defecation. |\n| Onset associated with change in stool frequency. | Associated with a change in frequency of stool. |\n| Onset associated with change in stool form (appearance). | Associated with a change in form (appearance) of stool. |\n| Criteria fulfilled for the last 3 months with symptom onset ≥6 months prior to diagnosis | Criteria fulfilled for the last 3 months with symptom onset ≥6 months prior to diagnosis |"
        question: "Which patient meets the Rome IV criteria for IBS"
