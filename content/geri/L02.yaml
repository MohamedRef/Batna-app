items:
  # ---------- p25: agenda ----------
  - id: geri.L02.001
    kind: card
    topic: overview
    front: In which age group has most of the rise in ESRD over the past 20 years occurred?
    back: The aged population.
    src: { page: 25, quote: "ESRD has increased over the past 20 years and most of these changes have occurred in the aged population." }
    status: unverified
  - id: geri.L02.002
    kind: card
    topic: overview
    front: What must symptomatic UTI in the elderly be distinguished from, and why?
    back: From asymptomatic bacteriuria, for which treatment is generally not indicated.
    src: { page: 25, quote: "Symptomatic UTI must be differentiated from asymptomatic bacteriuria for which treatment in generally not indicated." }
    status: unverified
    tags: [high-yield]
  - id: geri.L02.003
    kind: card
    topic: overview
    front: Where does catheter-induced UTI rank among hospital infections?
    back: It is among the most common nosocomial infections.
    src: { page: 25, quote: "Catheter induced UTI is among the most common nosocomial infections." }
    status: unverified
  # ---------- p26-27: anatomy ----------
  - id: geri.L02.004
    kind: cloze
    topic: anatomy
    text: "Kidney weight falls gradually from age {{c1::40–50}} years, more in the {{c2::cortex}} than the medulla."
    src: { page: 26, quote: "Kid wt.: ↓ gradually at age 40-50 yrs, Cortex > medulla." }
    status: unverified
    tags: [numbers]
  - id: geri.L02.005
    kind: cloze
    topic: anatomy
    text: "With age, the number of glomeruli falls by {{c1::30–50%}}, with fewer cells, {{c2::sclerotic}} glomeruli and glomerular ischemia."
    src: { page: 26, quote: "Glomeruli: ↓ in No (30-50%). ↓ Cells Sclerotic glomeruli Glomerular ischaemia" }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L02.006
    kind: table
    topic: anatomy
    title: "Anatomical renal changes in the elderly"
    columns: [Structure, Change]
    rows:
      - [Kidney weight, "Falls from 40–50 years; cortex more than medulla"]
      - [Glomeruli, "Number down 30–50%; fewer cells; sclerosis; ischemia"]
      - [Nephrons, "Fewer; the remaining ones enlarge"]
      - [Basement membrane, "Thicker glomerular and tubular BM; more type IV collagen"]
      - [Tubules, "Shorter; smaller proximal tubular volume"]
      - [Interstitium, "More fibrosis"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 26, quote: "BM: ↑ glomerular & tubular BM ↑ type IV collagen. Tubules: ↓ length ↓ Proximal tubular volume. ↓ Interstitium: ↑ fibrosis" }
    status: unverified
    tags: [high-yield]
  - id: geri.L02.007
    kind: card
    topic: anatomy
    front: What happens to nephrons with age?
    back: Their number falls and the remaining nephrons enlarge.
    src: { page: 26, quote: "Nephrons: ↓ No, ↑ Size of residuals." }
    status: unverified
  - id: geri.L02.008
    kind: card
    topic: anatomy
    front: How does the renal basement membrane change with age?
    back: The glomerular and tubular basement membranes thicken, with more type IV collagen.
    src: { page: 26, quote: "BM: ↑ glomerular & tubular BM ↑ type IV collagen." }
    status: unverified
  # ---------- p28-29: physiology ----------
  - id: geri.L02.009
    kind: card
    topic: physiology
    front: How does the timing of sodium and potassium excretion change in the elderly?
    back: Night-time excretion of Na+, K+ and total solutes increases.
    src: { page: 28, quote: "↑ night excretion of Na+/K+/total solutes." }
    status: unverified
  - id: geri.L02.010
    kind: card
    topic: physiology
    front: Why is intense sodium restriction dangerous in the elderly?
    back: It causes volume contraction, with reduced renal function and orthostatic hypotension, because the old kidney cannot conserve sodium.
    src: { page: 28, quote: "Caution: intense Na+ restriction → volume contraction →↓ Renal functions → Orthostatic hypotension" }
    status: unverified
    tags: [high-yield]
  - id: geri.L02.011
    kind: card
    topic: physiology
    front: What happens to plasma ANP in the elderly?
    back: It rises (ANP, cardiodilatin).
    src: { page: 28, quote: "↑ Plasma ANP (Cardiodilatin )." }
    status: unverified
  - id: geri.L02.012
    kind: card
    topic: physiology
    front: Why are the elderly prone to hyperkalemia, and which drugs need caution?
    back: "Reduced RAAS activity (low renin and aldosterone). Caution with potassium-sparing diuretics, RAAS blockade, NSAIDs and beta-blockers."
    src: { page: 28, quote: "↓ RAAS → hyper kalemia. Caution: K. sparing diuretic, RAAS blockade, NSAIDs, BBs." }
    status: unverified
    tags: [high-yield]
  - id: geri.L02.013
    kind: enumerate
    topic: physiology
    prompt: Which drugs need caution because of hyperkalemia risk in the elderly?
    points:
      - Potassium-sparing diuretics
      - RAAS blockade (ACEI, ARB)
      - NSAIDs
      - Beta-blockers
    pass: 4
    src: { page: 28, quote: "Caution: K. sparing diuretic, RAAS blockade, NSAIDs, BBs." }
    status: unverified
  - id: geri.L02.014
    kind: card
    topic: physiology
    front: Why is free water clearance after a water load low in the elderly?
    back: Nephron loss and high ADH, so urinary dilution is impaired.
    src: { page: 28, quote: "Water load → low hourly free water clearance (Nephron loss, high ADH)" }
    status: unverified
  - id: geri.L02.015
    kind: card
    topic: physiology
    front: Why can't the old kidney concentrate urine maximally?
    back: Defective sodium reabsorption in the ascending loop of Henle; and thirst is also reduced.
    src: { page: 28, quote: "↓ Capacity to maximally concentrate the urine (defective Na re-absorption in ALOH)." }
    status: unverified
    tags: [high-yield]
  - id: geri.L02.016
    kind: card
    topic: physiology
    front: What happens to the thirst mechanism with age?
    back: It is reduced.
    src: { page: 29, quote: "↓ Thirst mechanism." }
    status: unverified
  - id: geri.L02.017
    kind: cloze
    topic: physiology
    text: "Above age 40, GFR falls by about {{c1::10 ml}} per decade and renal plasma flow by about {{c2::10%}} per decade."
    src: { page: 29, quote: "GFR: ↓ ⁓ 10 ml/decade) above 40 years RPF: ↓ ⁓ 10% decade above 40 years" }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L02.018
    kind: enumerate
    topic: physiology
    prompt: List the functional renal changes in the elderly.
    points:
      - Impaired sodium conservation
      - Impaired maximal water excretion
      - Impaired maximal urinary concentration
      - Increased prevalence of hyperkalemia
      - Decreased plasma renin and aldosterone
    pass: 4
    src: { page: 29, quote: "Impaired Na+ conservation Impaired max. Water excretion. Impaired max. urinary concentration Increased prevalence of hyperkalemia" }
    status: unverified
    tags: [high-yield]
  - id: geri.L02.019
    kind: table
    topic: physiology
    title: "Renal hemodynamic changes with aging"
    columns: [Parameter, Change]
    rows:
      - [GFR, Decreased]
      - [Effective renal plasma flow, Decreased]
      - [Response to vasodilators, Markedly decreased]
      - [Response to vasoconstrictors, Increased]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 29, quote: "Effective renal plasma flow (ERPF) ↓ Response to vasodilators ↓↓ Response to vasoconstrictor ↑" }
    status: unverified
  - id: geri.L02.020
    kind: mcq
    topic: physiology
    stem: "An 81-year-old man on lisinopril is started on spironolactone and takes ibuprofen for knee pain. Two weeks later K+ is 6.4 mmol/L. Which age-related change explains his vulnerability?"
    options:
      - Low renin and aldosterone activity
      - Increased tubular potassium secretion
      - Increased thirst
      - Increased response to vasodilators
    answer: 0
    why:
      - "Correct: reduced RAAS with age causes hyperkalemia, and RAAS blockers, K-sparing diuretics and NSAIDs add to it (p28)."
      - "Tubular K secretion is not increased; it falls with aldosterone."
      - "Thirst is reduced with age."
      - "The response to vasodilators is markedly reduced."
    src: { page: 28, quote: "↓ RAAS → hyper kalemia. Caution: K. sparing diuretic, RAAS blockade, NSAIDs, BBs." }
    status: unverified
  - id: geri.L02.021
    kind: mcq
    topic: physiology
    stem: "During a heat wave an 85-year-old woman becomes drowsy with Na+ 156 mmol/L. She says she was never thirsty. Which pair of age-related changes explains this?"
    options:
      - Reduced thirst and reduced maximal urinary concentration
      - Increased thirst and high ADH
      - Increased RAAS and potassium retention
      - Increased GFR and renal plasma flow
    answer: 0
    why:
      - "Correct: the thirst mechanism falls and the kidney cannot maximally concentrate urine (defective Na reabsorption in the ascending loop) (p28–29)."
      - "Thirst is reduced, not increased."
      - "RAAS activity falls with age."
      - "GFR and RPF fall about 10 per decade after 40."
    src: { page: 29, quote: "↓ Thirst mechanism." }
    status: unverified
  # ---------- p29-30, p34: measuring renal function ----------
  - id: geri.L02.022
    kind: card
    topic: gfr
    front: Why may serum creatinine be misleading in the elderly?
    back: Creatinine production falls (lower body mass, debilitation, muscle atrophy), so a normal serum creatinine can hide a low creatinine clearance.
    src: { page: 29, quote: "(↓ Body mass, debilitation, muscle atrophy) Standard measures of GFR or renal functions as s.cr, may be inappropriate" }
    status: unverified
    tags: [high-yield]
  - id: geri.L02.023
    kind: cloze
    topic: gfr
    text: "GFR is estimated by creatinine clearance: measured as {{c1::U × V / P}}, or calculated with the {{c2::Cockcroft-Gault}} equation."
    src: { page: 29, quote: "Glomerular filtration rate =Creatinine clearance - U.V/P - (Cockcroft Gault):" }
    status: unverified
  - id: geri.L02.024
    kind: cloze
    topic: gfr
    text: "Cockcroft-Gault: CrCl = ({{c1::140 − age}}) × body weight (kg) / ({{c2::72}} × serum creatinine mg/dl), × {{c3::0.85}} if female."
    src: { page: 30, quote: "(140-age) x body weight (Kg) CG equation= ------------------------- - (85% if female) 72x s.creatinine (mg/dl)" }
    status: unverified
    tags: [high-yield, numbers]
  - id: geri.L02.025
    kind: table
    topic: gfr
    title: "Same creatinine, different kidneys (book table, p34)"
    columns: [Patient, Serum creatinine, CrCl (Cockcroft-Gault)]
    rows:
      - ["70-year-old, 60 kg woman", "1.2 mg/dL", "41.3 ml/min"]
      - ["25-year-old, 70 kg man", "1.2 mg/dL", "93.2 ml/min"]
    blanks: [[0, 2], [1, 2]]
    src: { page: 34, quote: "S.Cr. Does not accurately reflect kidney function" }
    status: unverified
    tags: [high-yield]
  - id: geri.L02.026
    kind: mcq
    topic: gfr
    stem: "An 80-year-old woman weighs 50 kg; serum creatinine is 1.0 mg/dl. Using the Cockcroft-Gault equation from the lecture, what is her creatinine clearance?"
    options:
      - "About 35 ml/min"
      - "About 42 ml/min"
      - "About 60 ml/min"
      - "About 100 ml/min"
    answer: 0
    why:
      - "Correct: (140 − 80) × 50 / (72 × 1.0) = 41.7, × 0.85 for a woman = 35.4 ml/min (p30)."
      - "42 forgets the 0.85 factor for women."
      - "60 is (140 − age), not the clearance."
      - "A 'normal' creatinine of 1.0 does not mean a normal GFR in a thin old woman."
    src: { page: 30, quote: "(140-age) x body weight (Kg) CG equation= ------------------------- - (85% if female) 72x s.creatinine (mg/dl)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L02.027
    kind: enumerate
    topic: gfr
    prompt: Why is cystatin C a good marker of GFR in the elderly?
    points:
      - Protease inhibitor, single-chain protein of 13 kD
      - Made by all nucleated cells; not affected by inflammation
      - Cleared by glomerular filtration, no tubular secretion
      - Does not re-enter the circulation
      - Constant blood level
      - Rises as GFR falls
      - Independent of gender, age and body mass
    pass: 5
    src: { page: 34, quote: "Synthesized by all nucleated cells, not affected by inflammation. Cleared by glomerular filtration, no tubular secretion." }
    status: unverified
    tags: [high-yield]
  - id: geri.L02.028
    kind: cloze
    topic: gfr
    text: "Cystatin C is a {{c1::13 kD}} protease inhibitor, independent of {{c2::gender, age and body mass}}, and it {{c3::rises}} as GFR falls."
    src: { page: 34, quote: "It increases as GFR decreases. Independent of gender, age or body mass." }
    status: unverified
    tags: [numbers]
  - id: geri.L02.029
    kind: table
    topic: gfr
    title: "Accurate assessment of GFR in the elders (Fliser 2001, p34)"
    columns: [Parameter, Young, Elders]
    rows:
      - [Age, "25 ± 2", "67 ± 6"]
      - [Weight (kg), "71 ± 9", "73 ± 2"]
      - [CrCl (ml/min/1.73 m²), "114 ± 22", "74 ± 18 (lower)"]
      - [Serum cystatin C (mg/L), "0.69 ± 0.08", "0.84 ± 0.1 (higher)"]
    blanks: [[2, 2], [3, 2]]
    src: { page: 34, quote: "Accurate assessment of GFR in the elders" }
    status: unverified
    tags: [numbers]
  - id: geri.L02.030
    kind: mcq
    topic: gfr
    stem: "A frail 88-year-old woman with sarcopenia has serum creatinine 0.9 mg/dl. Which marker in the lecture would best reflect her true GFR?"
    options:
      - Serum cystatin C
      - Serum creatinine alone
      - Blood urea alone
      - Urine volume
    answer: 0
    why:
      - "Correct: cystatin C is made by all nucleated cells at a constant rate, independent of age, gender and body mass (p34)."
      - "Low muscle mass lowers creatinine production, so a 'normal' creatinine hides a low GFR (p29)."
      - "Urea depends on protein intake, bleeding and hydration."
      - "Urine volume does not measure filtration."
    src: { page: 34, quote: "Ideal marker for GFR. It increases as GFR decreases. Independent of gender, age or body mass." }
    status: unverified
