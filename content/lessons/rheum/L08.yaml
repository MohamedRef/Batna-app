      - kind: aside
        tone: exam
        page: 153
        quote: "Meningeal involvement. Retro-orbital disease. Cardiac involvement. Mesenteric involvement. Acute-onset mononeuritis multiplex. Pulmonary haemorrhage of any severity."
        text: |
          ==MTX/MMF ممنوع في الـ induction== مع: **meningeal**، **retro-orbital**، **cardiac**، **mesenteric**، acute **mononeuritis multiplex**، و **pulmonary haemorrhage بأي درجة**.

          الـ MTX مسموح بس في الحاجات البسيطة: أنف من غير erosion، جلد من غير ulcer، myositis، nodules من غير haemoptysis، ومن غير كلية.
      - kind: check
        page: 154
        quote: "Plasma exchange should be considered for patients with AAV and a serum creatine level of >500 μmol/L (5.7 mg/dL)"
        question: "In the book, plasma exchange is considered in AAV with RPGN when creatinine exceeds:"
        options:
          - "500 μmol/L (5.7 mg/dL)"
          - "200 μmol/L (2.3 mg/dL)"
          - "300 μmol/L (3.4 mg/dL)"
          - "Any creatinine rise"
        answer: 0
        why:
          - "صح: >500 μmol/L، وكمان في الـ severe DAH."
          - "200 مش رقم الكتاب."
          - "300 (3.4 mg/dL) ده رقم KDIGO 2024، مش الكتاب."
          - "مش أي ارتفاع؛ الكتاب حط رقم."
      - kind: update
        page: 154
        quote: "Plasma exchange should be considered for patients with AAV and a serum creatine level of >500 μmol/L (5.7 mg/dL)"
        text: "PEXIVAS (2020) لقت إن الـ plasma exchange الروتيني ما قللش الوفاة أو الـ ESKD. KDIGO 2024 بتقول ممكن تفكر فيه لو creatinine >3.4 mg/dL، أو dialysis، أو creatinine بيعلى بسرعة، أو DAH مع hypoxemia. في الامتحان: رقم الكتاب >500 μmol/L."
        ref: "KDIGO 2024 ANCA vasculitis guideline; PEXIVAS 2020"
      - kind: explain
        page: 155
        title: "المتابعة"
        quote: "We recommend that structured clinical assessment rather than ANCA testing should inform decisions on changes in treatment"
        text: |
          - غيّر العلاج حسب ==clinical assessment مش الـ ANCA==؛ والـ ANCA السلبي ما بينفيش AAV
          - **Haematuria** مستمرة بعد **cyclophosphamide** ← افحصها (المثانة)
          - **Immunoglobulins** قبل كل كورس **rituximab**
          - **Cardiovascular risk** دوريًا، وعلّم العيان علامات الـ relapse
          - الـ AAV **controllable but incurable**
      - kind: reveal
        page: 156
        quote: "Cell lysis (i.e., Neisseria control) Reason for black box warning for eculizumab"
        prompt: "ليه الـ avacopan (C5aR) أأمن من الـ eculizumab (anti-C5)؟"
        answer: |
          الـ **eculizumab** بيوقف الـ C5 كله، فمفيش **MAC (C5b-9)**، والـ MAC هو اللي بيقتل **Neisseria**؛ علشان كده عليه black box warning.

          الـ **avacopan** بيقفل الـ **C5a receptor** بس: يوقف جذب وتنشيط الـ neutrophils، ويسيب الـ MAC شغال. "Downstream is best".
