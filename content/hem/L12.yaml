items:
  # ---------- p190: overview, Burkitt ----------
  - id: hem.L12.001
    kind: card
    topic: overview
    front: Define lymphomas and their two main groups.
    back: Malignant disorders derived from lymphoid cells (mature T or B cells), divided into Hodgkin and non-Hodgkin lymphoma.
    src: { page: 190, quote: "Lymphomas are malignant disorders that derive from Lymphoid cells. They may arise from mature T-cells or B-cells." }
    status: unverified
  - id: hem.L12.002
    kind: card
    topic: overview
    front: What makes the histological diagnosis of Hodgkin lymphoma?
    back: The presence of Reed-Sternberg cells.
    src: { page: 190, quote: "Hodgkin‘s Lymphoma is diagnosed histologically by the presence of Reed-Sternberg cells." }
    status: unverified
    tags: [high-yield]
  - id: hem.L12.003
    kind: cloze
    topic: overview
    text: "Lymphoma incidence is {{c1::5-10}}/100,000 per year; there are about {{c2::2}} NHL cases for each Hodgkin case, and a {{c3::3:2}} male predilection."
    src: { page: 190, quote: "The overall incidence of Lymphomas is 5-10 cases per/100,000 population each year. There are approximately 2 cases of non-Hodgkin‘s Lymphoma for each case of Hodgkin‘s." }
    status: unverified
    tags: [numbers]
  - id: hem.L12.004
    kind: card
    topic: overview
    front: How does the lecture distinguish lymphoma from lymphoid leukaemia, and how does WHO handle CLL and ALL?
    back: Lymphomas are solid (lumps), leukaemias are liquid with malignant cells in the blood; the line is artificial, so WHO classifies CLL and ALL with lymphomas as lymphoid malignancies.
    src: { page: 190, quote: "Lymphomas are generally thought of as being solid (lumps), whereas Leukaemias are liquid with malignant cells found into the peripheral blood." }
    status: unverified
  - id: hem.L12.005
    kind: cloze
    topic: cytogenetics
    text: "Burkitt lymphoma: {{c1::t(8;14)}} in {{c2::75%}} of cases up-regulates {{c3::c-MYC}}, causing proliferation and failed apoptosis."
    src: { page: 190, quote: "Burkitt‘s Lymphoma: In 75% of cases t (8;14) leading to up-regulation and expression of the C-MyC protein" }
    status: unverified
    tags: [high-yield]
  # ---------- p191: cytogenetics ----------
  - id: hem.L12.006
    kind: table
    topic: cytogenetics
    title: Recurring cytogenetic lesions in lymphoma (p190-191)
    columns: [Lymphoma, Lesion, Effect]
    rows:
      - [Burkitt, "t(8;14) (75%)", "c-MYC up: proliferation, failed apoptosis"]
      - [Follicular, "t(14;18)", "BCL-2 expression: failed apoptosis"]
      - [Mantle cell, "t(11;14)", "BCL-1 (cyclin D1): proliferation"]
      - [Large cell, "BCL-6 expression", "-"]
    blanks: [[0, 1], [1, 1], [2, 1], [1, 2], [2, 2], [3, 1]]
    src: { page: 191, quote: "Follicular Lymphoma: t (14;18) → BCL-2 expression leading to failure of apoptosis." }
    status: unverified
    tags: [high-yield]
  - id: hem.L12.007
    kind: card
    topic: cytogenetics
    front: Follicular lymphoma translocation and its effect?
    back: t(14;18), giving BCL-2 expression and failure of apoptosis.
    src: { page: 191, quote: "Follicular Lymphoma: t (14;18) → BCL-2 expression leading to failure of apoptosis." }
    status: unverified
    tags: [high-yield]
  - id: hem.L12.008
    kind: card
    topic: cytogenetics
    front: Mantle cell lymphoma translocation and its effect?
    back: t(11;14), giving BCL-1 (cyclin D1) expression and cell proliferation.
    src: { page: 191, quote: "Mantle cell Lymphoma: t (11;14)→ BCL-1 (Cyclin D 1) expression→ cellular proliferation." }
    status: unverified
    tags: [high-yield]
  - id: hem.L12.009
    kind: card
    topic: cytogenetics
    front: Which molecule characterises large cell lymphoma?
    back: BCL-6 expression.
    src: { page: 191, quote: "Large cell Lymphoma: characterized by the expression of BCL-6." }
    status: unverified
  - id: hem.L12.010
    kind: card
    topic: cytogenetics
    front: What does the book's photo of Burkitt lymphoma show?
    back: A characteristic facial swelling from extensive tumour involving the mandible and surrounding soft tissues.
    src: { page: 191, quote: "Burkitt's lymphoma: characteristic facial swelling caused by extensive tumour involvement of the mandible and surrounding soft tissues" }
    status: unverified
  # ---------- p192: immunophenotyping, diagnosis, work-up ----------
  - id: hem.L12.011
    kind: card
    topic: workup
    front: What is immunophenotyping, and what naming scheme does it use?
    back: Identifying antigenic molecules on white cells with labelled antibodies (flow cytometry); molecules are named by the Cluster Differentiation (CD) scheme.
    src: { page: 192, quote: "The identification of antigenic molecules associated with human white cells, using labelled antibodies may be very helpful for diagnosis." }
    status: unverified
  - id: hem.L12.012
    kind: cloze
    topic: workup
    text: "{{c1::CD20}} is expressed exclusively on B cells; {{c2::CD19, CD22 and CD79}} are other B-cell markers detected by flow cytometry."
    src: { page: 192, quote: "The CD 20 is one such molecule exclusively expressed on B-cells. Besides, CD 19, CD 22 and CD 79 are other examples" }
    status: unverified
    tags: [high-yield]
  - id: hem.L12.013
    kind: card
    topic: workup
    front: How is lymphoma diagnosed?
    back: Histology of an enlarged lymph node or other tissue (or cytology of blood, marrow or CSF), backed by immunophenotyping, cytogenetic and molecular techniques.
    src: { page: 192, quote: "The diagnosis is based on the histological appearance of an enlarged lymph node or other affected tissues" }
    status: unverified
  - id: hem.L12.014
    kind: enumerate
    topic: workup
    prompt: Staging investigations once lymphoma is diagnosed.
    points:
      - "CT scanning, ultrasound, chest X-ray"
      - "Bone marrow biopsy (important in NHL: frequent marrow involvement)"
      - "Serum LDH (high confers poor prognosis)"
      - "Immunoglobulins and monoclonal proteins"
    pass: 3
    src: { page: 192, quote: "Bone marrow biopsy is important in non-Hodgkin‘s Lymphoma due to the high frequency of bone marrow involvement in this disorder." }
    status: unverified
  - id: hem.L12.015
    kind: card
    topic: workup
    front: Why is a bone marrow biopsy especially important in NHL staging?
    back: Because bone marrow involvement is frequent in NHL.
    src: { page: 192, quote: "Bone marrow biopsy is important in non-Hodgkin‘s Lymphoma due to the high frequency of bone marrow involvement in this disorder." }
    status: unverified
  - id: hem.L12.016
    kind: card
    topic: workup
    front: What does a high serum LDH mean in lymphoma?
    back: It confers a poor prognosis.
    src: { page: 192, quote: "Serum Lactate dehydrogenase → confers a poor prognosis." }
    status: unverified
  # ---------- p192-193: Ann Arbor, IPI ----------
  - id: hem.L12.017
    kind: table
    topic: staging
    title: Ann Arbor staging (p192-193)
    columns: [Stage, Involvement]
    rows:
      - ["I", "A single lymph node group"]
      - ["II", "Two or more node groups on one side of the diaphragm"]
      - ["III", "Node groups on both sides of the diaphragm"]
      - ["IV", "Extralymphatic sites, e.g. bone marrow or liver"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 193, quote: "Stage IV: Involvement of extralymphatic sites e.g. bone marrow or liver." }
    status: unverified
    tags: [high-yield]
  - id: hem.L12.018
    kind: cloze
    topic: staging
    text: "Ann Arbor stage II = two or more lymph node groups on {{c1::one side}} of the diaphragm; stage III = {{c2::both sides}}."
    src: { page: 192, quote: "Stage II: Involvement of two or more lymph node groups on one side of the diaphragm." }
    status: unverified
  - id: hem.L12.019
    kind: cloze
    topic: staging
    text: "Stage B = any one of {{c1::night sweats}}, {{c2::fever}} or weight loss of {{c3::10% in the past 6 months}}; stage A = none."
    src: { page: 193, quote: "stage (B) in the presence of any one of; night sweats, fever or weight loss (10% in past 6 months)." }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L12.020
    kind: enumerate
    topic: staging
    prompt: Adverse factors in the International Prognostic Index (as listed in the lecture).
    points: ["Extranodal disease", "Advanced stage", "Elevated LDH", "Increasing age"]
    pass: 4
    src: { page: 193, quote: "Extranodal disease: Disease outside lymphatic sites confers a poor prognosis." }
    status: unverified
    tags: [high-yield]
    update:
      text: "The full IPI scores 5 factors: age > 60, ECOG performance status ≥ 2, stage III-IV, raised LDH and > 1 extranodal site. The book lists four (no performance status)."
      ref: "International Non-Hodgkin's Lymphoma Prognostic Factors Project, NEJM 1993"
  # ---------- p194: Hodgkin basics ----------
  - id: hem.L12.021
    kind: card
    topic: hl-basics
    front: What is the cell of origin of Hodgkin lymphoma?
    back: Clonal germinal-centre B cells with a crippled immunoglobulin gene (mutations prevent synthesis of full-length immunoglobulin).
    src: { page: 194, quote: "neoplastic cells in Hodgkin‘s Lymphoma are clonal B-cells originating in a lymph node germinal centre with a crippled immunoglobulin gene" }
    status: unverified
    tags: [high-yield]
  - id: hem.L12.022
    kind: cloze
    topic: hl-basics
    text: "Hodgkin lymphoma was first described by Thomas Hodgkin in {{c1::1832}}; EBV genome is found in {{c2::50% or more}} of cases."
    src: { page: 194, quote: "Epstein-Barr virus (EBV) genome has been detected in 50% or more of cases of Hodgkin‘s Diseases (HD)." }
    status: unverified
    tags: [numbers]
  - id: hem.L12.023
    kind: cloze
    topic: hl-basics
    text: "Hodgkin lymphoma has a bimodal age incidence: major peak at {{c1::20-29}} years and minor peak at {{c2::60}} years."
    src: { page: 194, quote: "Bimodal age incidence- major peak between 20 and 29 years and minor peak 60 years." }
    status: unverified
    tags: [high-yield, numbers]
  - id: hem.L12.024
    kind: card
    topic: hl-basics
    front: Hodgkin incidence facts (registration, geography, sex, commonest subtype in young adults).
    back: 1% of cancer registrations a year; less common in Japan; higher in males; nodular sclerosing is the commonest subtype in young adults.
    src: { page: 194, quote: "One percent of cancer registration per year. Less common in Japan." }
    status: unverified
  - id: hem.L12.025
    kind: enumerate
    topic: hl-basics
    prompt: Risk factors for Hodgkin lymphoma.
    points:
      - High socioeconomic status in childhood
      - Familial aggregation
      - EBV, especially with past infectious mononucleosis
    pass: 3
    src: { page: 194, quote: "Association with high socioeconomic status in childhood." }
    status: unverified
  - id: hem.L12.026
    kind: card
    topic: hl-basics
    front: How is Hodgkin lymphoma diagnosed?
    back: Histology of an excised lymph node; the RS cell is central to the four classic types and is part of the malignant clone.
    src: { page: 194, quote: "It is made by histological examination of an excised lymph- node. RS-cell is central to the diagnosis of the four classic types" }
    status: unverified
  - id: hem.L12.027
    kind: cloze
    topic: hl-basics
    text: "Reed-Sternberg cells stain with {{c1::CD30}} and {{c2::CD15}} but are usually {{c3::negative for B-cell antigens}}."
    src: { page: 194, quote: "These cells stain with CD 30 and CD 15 but are usually negative for B-cell antigen expression." }
    status: unverified
    tags: [high-yield]
  - id: hem.L12.028
    kind: card
    topic: hl-basics
    front: Which background cells accompany RS cells in Hodgkin lymphoma?
    back: Lymphocytes, neutrophils, eosinophils, plasma cells (and histiocytes), with variable fibrosis.
    src: { page: 194, quote: "inflammatory cells consist of lymphocytes, neutrophils, eosinophils, plasma cells and variable fibrosis." }
    status: unverified
  # ---------- p195: subtypes ----------
  - id: hem.L12.029
    kind: table
    topic: hl-subtypes
    title: Classic Hodgkin subtypes (p195)
    columns: [Subtype, Frequency, Features]
    rows:
      - [Lymphocyte predominance, 10%, "Younger patients, rare RS cells, many lymphocytes, usually stage 1-2"]
      - [Nodular sclerosis, "50% +", "Young adults, only type commoner in women, lacunar RS variants, fibrosis around nodules"]
      - [Mixed cellularity, "30% +", "More abundant RS cells, richer inflammatory infiltrate"]
      - [Lymphocyte depletion, Uncommon, "Numerous RS cells, few lymphocytes, atypical cells"]
    blanks: [[0, 1], [1, 1], [2, 1], [1, 2], [3, 2]]
    src: { page: 195, quote: "Nodular sclerosis +50% Young adults, only type more common in women, presence of Lacunar RS variants, fibrosis surrounding nodules." }
    status: unverified
    tags: [high-yield]
  - id: hem.L12.030
    kind: card
    topic: hl-subtypes
    front: Which Hodgkin subtype is the only one commoner in women, and its histology?
    back: "Nodular sclerosis: lacunar RS variants and fibrosis surrounding nodules."
    src: { page: 195, quote: "Young adults, only type more common in women, presence of Lacunar RS variants, fibrosis surrounding nodules." }
    status: unverified
    tags: [high-yield]
  - id: hem.L12.031
    kind: card
    topic: hl-subtypes
    front: Which Hodgkin subtype has rare RS cells and many lymphocytes, usually stage 1-2?
    back: Lymphocyte predominance (10%, younger patients).
    src: { page: 195, quote: "Lymphocyte predominance 10% Younger patients Rare RS cells Many lymphocytes Usually stage 1 or 2" }
    status: unverified
  - id: hem.L12.032
    kind: card
    topic: hl-subtypes
    front: Which Hodgkin subtype has numerous RS cells with depleted lymphocytes?
    back: Lymphocyte depletion (uncommon).
    src: { page: 195, quote: "Lymphocyte depletion Uncommon Numerous RS-cells, decreased lymphocyte percentage, atypical cells" }
    status: unverified
  # ---------- p196: nodes ----------
  - id: hem.L12.033
    kind: card
    topic: hl-clinical
    front: Describe the lymph nodes of Hodgkin lymphoma.
    back: Painless, non-tender, asymmetrical, firm, discrete and rubbery; may become matted.
    src: { page: 196, quote: "Painless, non-tender, asymmetrical, firm, discrete and rubbery. Lymph nodes may become matted." }
    status: unverified
    tags: [high-yield]
  - id: hem.L12.034
    kind: table
    topic: hl-clinical
    title: Node groups involved in Hodgkin lymphoma (p196)
    columns: [Nodes, Frequency]
    rows:
      - [Cervical, 60-70%]
      - [Axillary, 10-15%]
      - [Inguinal, 6-12%]
      - [Mediastinal, 6-11%]
      - [Retroperitoneal, "Often, usually found on CT"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 196, quote: "Cervical nodes; are involved in 60 – 70 % Axillary nodes; in 10 – 15 % Inguinal nodes; in 6 – 12 %" }
    status: unverified
    tags: [numbers]
  - id: hem.L12.035
    kind: card
    topic: hl-clinical
    front: "Mediastinal node enlargement in Hodgkin lymphoma: frequency, subtype and complications?"
    back: 6-11%; a feature of nodular sclerosing type; may cause pleural effusion or superior vena cava obstruction.
    src: { page: 196, quote: "Mediastinal L.N. enlargement; in 6-11% of patients. This is a feature of the nodular sclerosing type." }
    status: unverified
    tags: [high-yield]
  # ---------- p197: organomegaly, constitutional ----------
  - id: hem.L12.036
    kind: cloze
    topic: hl-clinical
    text: "Splenomegaly occurs during the course of Hodgkin lymphoma in {{c1::50%}} of cases but is {{c2::seldom massive}}."
    src: { page: 197, quote: "Splenomegaly occurs during course of disease in 50% of cases, but seldom massive." }
    status: unverified
    tags: [numbers]
  - id: hem.L12.037
    kind: enumerate
    topic: hl-clinical
    prompt: Constitutional symptoms of Hodgkin lymphoma.
    points: ["Fever (30%), continuous or cyclic", Weight loss, "Profuse sweating, especially at night", "Pruritus (25%), may be severe", Fatigue, Anorexia and cachexia]
    pass: 4
    src: { page: 197, quote: "Fever in 30% of patients, is continuous or cyclic. Weight loss. Profuse sweating especially at night." }
    status: unverified
  - id: hem.L12.038
    kind: cloze
    topic: hl-clinical
    text: "In Hodgkin lymphoma fever occurs in {{c1::30%}} (continuous or {{c2::cyclic}}), and pruritus, which may be severe, in {{c3::25%}}."
    src: { page: 197, quote: "Fever in 30% of patients, is continuous or cyclic." }
    status: unverified
    tags: [numbers]
  - id: hem.L12.039
    kind: card
    topic: hl-clinical
    front: Which organs other than spleen and liver may Hodgkin lymphoma involve, and how often?
    back: Bone marrow, GIT, bone, lung and spinal cord; unusual.
    src: { page: 197, quote: "Other organs e.g. BM, GIT, bone, lung and spinal cord may be involved, but this is unusual." }
    status: unverified
  # ---------- p198: investigations, treatment ----------
  - id: hem.L12.040
    kind: card
    topic: hl-management
    front: Best way to confirm Hodgkin lymphoma?
    back: Excision biopsy of a lymph node for histology.
    src: { page: 198, quote: "Confirm diagnosis by biopsy, best histology of lymph node by excision biopsy." }
    status: unverified
  - id: hem.L12.041
    kind: card
    topic: hl-management
    front: Blood picture in Hodgkin lymphoma.
    back: Normochromic normocytic anaemia, reactive leucocytosis, eosinophilia and/or mild reactive thrombocytosis.
    src: { page: 198, quote: "Blood picture: normochromic normocytic anaemia, reactive leucocytosis, eosinophilia and / or reactive mild thrombocytosis." }
    status: unverified
  - id: hem.L12.042
    kind: card
    topic: hl-management
    front: Which simple test reflects activity in Hodgkin lymphoma and helps follow-up?
    back: ESR or plasma viscosity, high in active disease.
    src: { page: 198, quote: "ESR/ plasma viscosity: high in active HD and could be good for follow up." }
    status: unverified
  - id: hem.L12.043
    kind: card
    topic: hl-management
    front: Why may uric acid and kidney function be abnormal in Hodgkin lymphoma?
    back: High uric acid (secondary gout) from lymphoproliferative activity; kidney impairment from HD involvement or secondary gout.
    src: { page: 198, quote: "Blood uric acid: high i.e. secondary gout due to lympho-proliferative activity." }
    status: unverified
  - id: hem.L12.044
    kind: enumerate
    topic: hl-management
    prompt: Imaging and marrow work-up in Hodgkin lymphoma.
    points:
      - "Chest X-ray: nodes or infection from immune suppression"
      - "CT chest, abdomen and pelvis: nodal and extranodal disease"
      - "Bone marrow trephine: exclude marrow involvement"
      - "MRI or PET in difficult cases"
    pass: 3
    src: { page: 198, quote: "CT-chest, abdomen and pelvis: to define nodal and extra-nodal involvement." }
    status: unverified
  - id: hem.L12.045
    kind: card
    topic: hl-management
    front: Treatment of early Hodgkin lymphoma (stage IA/IIA) per the book.
    back: Extended-field radiotherapy, or 3 courses of ABVD plus localized radiotherapy.
    src: { page: 198, quote: "Can be treated with extended field radiotherapy or 3 courses of ABVD+ localized radiotherapy." }
    status: unverified
    tags: [high-yield]
  - id: hem.L12.046
    kind: card
    topic: hl-management
    front: Treatment of advanced Hodgkin lymphoma (stage IIB-IV) per the book.
    back: Six to eight courses of ABVD combination chemotherapy.
    src: { page: 198, quote: "Treated with six to eight courses of combination chemotherapy (ABVD)" }
    status: unverified
    tags: [high-yield]
  - id: hem.L12.047
    kind: cloze
    topic: hl-management
    text: "ABVD = {{c1::Adriamycin}}, {{c2::Bleomycin}}, {{c3::Vinblastine}} and Dacarbazine."
    src: { page: 198, quote: "ABVD = Adriamycin, Bleomycin, Vinblastine, and Decarbazine" }
    status: unverified
    tags: [high-yield]
  # ---------- p199: NHL basics ----------
  - id: hem.L12.048
    kind: card
    topic: nhl-basics
    front: Define non-Hodgkin lymphoma.
    back: A group of histologically and biologically heterogeneous clonal malignant diseases arising from the lymphoid system.
    src: { page: 199, quote: "NHL is a diagnosis applied to a group of histologically and biologically heterogenous clonal malignant diseases arising from the lymphoid system." }
    status: unverified
  - id: hem.L12.049
    kind: cloze
    topic: nhl-basics
    text: "NHL is about {{c1::4%}} of all cancers; incidence rises with age, M:F {{c2::3:2}}."
    src: { page: 199, quote: "NHL constitutes about 4% of all cancers, and its rate per annum has increased since the 1970‘s." }
    status: unverified
    tags: [numbers]
  - id: hem.L12.050
    kind: enumerate
    topic: nhl-basics
    prompt: Why has NHL incidence increased since the 1970s?
    points: [Older population, Better diagnosis, HIV pandemic, Immunosuppressive therapy]
    pass: 3
