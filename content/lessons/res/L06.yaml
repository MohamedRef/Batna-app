      - kind: reveal
        page: 19
        quote: "Why do an equivalence or non inferiority trial?\n  Fewer side effects,\n  Greater convenience,\n  Lower cost,\n  Higher quality of life.\n  Fewer drug interaction\n  A means of flooding the market with identical drugs in order to give patients more choice."
        prompt: "طب ليه حد يعمل trial علشان يثبت إن دواه **مش أوحش** بس؟ ما يثبت إنه أحسن!"
        answer: |
          لأن الجديد ساعات مش محتاج يبقى أقوى؛ كفاية إن عنده ميزة تانية:

          - **Fewer side effects**
          - **Greater convenience** (برشامة مرة في اليوم بدل حقنة)
          - **Lower cost**
          - **Higher quality of life**
          - **Fewer drug interactions**
          - وبصراحة المحاضرة بتقولها: وسيلة لملء السوق بأدوية متشابهة **علشان العيان يبقى عنده اختيارات**.
      - kind: explain
        page: 26
        quote: "Example of equivalence trial: Comparison of oral amoxicillin and intravenous benzyl penicillin for community acquired pneumonia in children (PIVOT trial): a multicentre pragmatic randomised controlled equivalence trial. Thorax 2007;62:1102–1106.\n  Objective: To ascertain whether therapeutic equivalence exists for the treatment of paediatric community acquired pneumonia by the oral and intravenous (IV) routes.\n  Methods: A multicentre pragmatic randomised controlled non-blinded equivalence trial was undertaken in eight paediatric centres in England (district general and tertiary hospitals). Equivalence was defined as no more than a 20% difference between treatments of the proportion meeting the primary outcome measure at any time. 246 children who required admission to hospital and had fever, respiratory symptoms or signs and radiologically confirmed pneumonia were included in the study. The patients were randomised to receive oral amoxicillin for 7 days (n=126) or IV benzyl penicillin (n=120). Children in the IV group were changed to oral amoxicillin after a median of six IV doses and received 7 days of antibiotics in total. The predefined primary outcome measure was time for the temperature to be <38°C for 24 continuous hours and oxygen requirement to cease. Secondary outcomes were time in hospital, complications, duration of oxygen requirement and time to resolution of illness.\n  Results: Oral amoxicillin and IV benzyl penicillin were shown to be equivalent. Median time for temperature to settle was 1.3 days in both groups (p<0.001 for equivalence). Three children in the oral group were changed to IV antibiotics and seven children in the IV group were changed to different IV antibiotics. Median time to complete resolution of symptoms was 9 days in both groups.\n  Conclusion: Oral amoxicillin is effective for most children admitted to hospital with pneumonia (all but those with the most severe disease who were excluded from this study)."
        title: "مثال: PIVOT trial"
        text: |
          أطفال داخلين المستشفى بـ **community-acquired pneumonia**. نص ياخد **oral amoxicillin**، ونص **IV benzyl penicillin**.

          ده **multicentre pragmatic randomised equivalence trial** (Thorax 2007). والنتيجة: **equivalent**؛ الحرارة نزلت في **1.3 days** في المجموعتين.

          المكسب؟ الطفل ميتعذبش بالـ **cannula**، ويقعد في المستشفى أقل. ودي ميزة الـ equivalence: نفس النتيجة بوجع أقل.
      - kind: case
        page: 35
        quote: "Antibiotic A is the established treatment for community-acquired pneumonia, but it is expensive and has many side effects. A new drug, antibiotic B, has just been developed for community-acquired pneumonia and is less expensive and has fewer side effects, but its efficacy, relative to drug A, is not well established. Which of the following would be the best kind of trial for evaluating drug B?\n  A. Superiority\n  B. Cross-over\n  C. Cluster\n  D. Non-inferiority\n  E. Equivalence\nAnswer: D"
        stem: "Antibiotic A is the standard for community-acquired pneumonia but is expensive with many side effects. New antibiotic B is cheaper with fewer side effects; its efficacy relative to A is not established."
        steps:
          - question: "What is the best kind of trial to evaluate B?"
            options: ["Superiority", "Cross-over", "Cluster", "Non-inferiority", "Equivalence"]
            answer: 3
            why: "B مش محتاج يغلب A؛ ميزته السعر والأمان. كفاية نثبت إنه **مش أوحش**: non-inferiority، ودي إجابة المحاضرة. الـ crossover مينفعش في مرض acute زي الـ pneumonia."
          - question: "What should the control group receive?"
            options: ["A placebo (inert tablet)", "No treatment at all", "Antibiotic A (active control)"]
            answer: 2
            why: "مينفعش تسيب pneumonia من غير antibiotic. المقارنة بالعلاج المعتاد، يعني active control."
      - kind: try
        items: [res.L06.021, res.L06.024, res.L06.027]
    recap:
      - "Therapeutic = بنعالج (دوا، عملية). Preventive = بنمنع (vaccine، chemoprophylaxis، exercise)."
      - "Efficacy: في اللي **خدوه**، explanatory، ظروف research. Effectiveness: في اللي **اتعرض عليهم**، pragmatic، ظروف usual."
      - "Superiority = أحسن. Equivalence = زيّه. Non-inferiority = مش أوحش."
      - "ليه non-inferiority؟ side effects أقل، أسهل، أرخص، quality of life أعلى، interactions أقل، اختيارات أكتر."
