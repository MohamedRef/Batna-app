  - id: git.L03.225
    kind: enumerate
    topic: central-pain
    prompt: "State the Rome IV criteria for narcotic bowel syndrome / opioid-induced GI hyperalgesia."
    points:
      - Chronic or frequently recurring abdominal pain (most days) treated with acute high-dose or chronic narcotics
      - Nature and intensity of pain not explained by a current or previous GI diagnosis
      - "Two or more of: pain worsens or incompletely resolves with continued or escalating narcotics"
      - Marked worsening as the dose wanes and improvement when narcotics are re-instituted (soar and crash)
