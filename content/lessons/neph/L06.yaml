        page: 134
        title: "كام لتر؟"
        quote: "The patient may have increased tone with brisk reflexes and myoclonus. Volume of replacement fluid needed to correct the water deficit is determined by using the concentration of sodium in the replacement fluid. The replacement volume can be determined as follows:"
        text: |
          حجم السائل بيعتمد على ==الـ Na اللي في السائل== مقارنة بـ **154** (الـ normal saline). كل ما السائل فيه Na أكتر، كل ما تحتاج حجم أكبر علشان تدي نفس الميه الحرة.

          مثال: الـ **0.45% saline** نصّه بس ميه حرة، فهتحتاج حوالي **ضعف** الـ water deficit. والـ **5% dextrose** كله ميه حرة.

          والحجم ده بيتدي **بالراحة على 48–72 ساعة**.
