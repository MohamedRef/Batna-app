  # ---------- p4: B and T cells, granulopoiesis, microenvironment ----------
  - id: hem.L01.020
    kind: card
    topic: stem-cells
    front: Where do B cells mature, and where do they go next?
    back: In the bone marrow microenvironment; then they travel in the blood to the B-cell zones of peripheral lymphoid tissue.
    src: { page: 4, quote: "undergo maturation into B-cells in the microenvironment of the marrow" }
    status: unverified
    tags: [high-yield]
  - id: hem.L01.021
    kind: card
    topic: stem-cells
    front: Where do T-cell progenitors mature, and where do mature T cells go?
    back: In the thymus; they later migrate to the T-cell zones of peripheral lymphoid organs.
    src: { page: 4, quote: "The T-cell progenitors undergo maturation in the thymus." }
    status: unverified
    tags: [high-yield]
  - id: hem.L01.022
    kind: mcq
    topic: stem-cells
    stem: A child born without a thymus (DiGeorge syndrome) has a normal marrow. Which cell line fails to mature?
    options:
      - T lymphocytes
      - B lymphocytes
      - Plasma cells
      - Neutrophils
      - Platelets
    answer: 0
    why:
      - "Correct: T-cell progenitors mature in the thymus (p4)."
      - B cells mature in the marrow microenvironment, not the thymus.
      - Plasma cells come from B cells, which mature in the marrow.
      - Neutrophils come from the myeloid line in the marrow.
      - Platelets come from marrow megakaryocytes.
    src: { page: 4, quote: "The T-cell progenitors undergo maturation in the thymus." }
    status: unverified
