  - id: hb.L09.lesson5
    title: "لما المية تعاند: Refractory ascites"
    hook: "عملت كل حاجة صح والبطن لسه مليانة؟ ده مش فشلك، ده تعريف."
    minutes: 9
    pages: [154, 158]
    topics: [refractory]
    goals:
      - "تعرّف الـ refractory ascites بأرقامها ونوعيها"
      - "ترتّب خيارات العلاج من LVP لـ LT"
      - "تعرف دواعي ومضاعفات الـ TIPS والـ Alfapump والـ PVS"
    status: unverified
    steps:
      - kind: explain
        page: 154
        title: "التعريف بالأرقام"
        quote: "ascites that cannot be mobilized or the early recurrence of ascites after therapeutic paracentesis despite dietary sodium restriction and diuretic therapy"
        text: |
          بيحصل في **5–10%** من مرضى الـ ascites، و الـ **one-year mortality > 40%**.

          التعريف: ascites **cannot be mobilized** أو بترجع **بدري** بعد البزل، **رغم** الملح والـ diuretics.

          - **Lack of response:** weight loss **<0.8 kg في 4 أيام** و urinary Na **أقل من** الـ intake.
          - **Early recurrence:** grade 2 أو 3 يرجعوا خلال **4 أسابيع**.
      - kind: sort
        page: 155
        prompt: "النوعين: حط كل مريض في النوع بتاعه:"
        bins: ["Diuretic-resistant", "Diuretic-intractable"]
        cards:
          - { text: "Spiro 400 + furo 160 + 2 g Na, ascites stays", bin: 0 }
          - { text: "Weight loss 0.5 kg in 4 days on maximum doses", bin: 0 }
          - { text: "Creatinine rises each time spiro passes 100 mg", bin: 1 }
          - { text: "Na falls to 120 on low-dose diuretics", bin: 1 }
          - { text: "Hepatic encephalopathy stops dose escalation", bin: 1 }
        why: "**Resistant** = المريض أخد الـ **maximum doses** ومفيش استجابة. **Intractable** = المضاعفات (**diuretic-induced complications**) منعتنا نوصل للجرعة الكاملة."
      - kind: explain
        page: 155
        title: "نعمل إيه؟"
        text: |
          - المريض اللي **مش** داخل تقييم LT: **palliative care referral**.
          - الـ **sodium restriction** لسه مهم.
          - **أوقف الـ diuretics** لو الـ urinary Na **مش أكتر من 30 mmol/day** وهو عليها (مش جايبة نتيجة، بس بتعمل مضاعفات).
          - الأساس: **repeated LVP + albumin** (الأشهر). والـ **total volume paracentesis** (سحب كله مرة واحدة) لناس مختارين علشان نقلل عدد المرات.
          - البدائل: **TIPS**، **Alfapump**، و **LT**.
