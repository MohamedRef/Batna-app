      - kind: explain
        page: 189
        quote: "HCC Hepatopulmonary syndrome Portopulmonary hypertension Recuurent cholangitis Budd-chiari syndrome Intractable pruritis Cystic fibrosis Familial amyloidosis Polycystic liver disease"
        title: "MELD exception points: ليه الرقم ساعات بيكدب؟"
        text: |
          الـ MELD بيبص على bilirubin و INR و creatinine بس. فيه أمراض بتموّت المريض من طريق تاني خالص والتلاتة دول لسه كويسين.

          - ==MELD exception points==: نقط زيادة بتتضاف للمريض علشان رقمه يعبّر عن خطره الحقيقي، فمايتظلمش في الطابور.

          الكتاب بيعدّ 10، وأسهل تحفظهم في مجموعات:

          - الورم: **HCC**. الورم بيكبر وهو مستني، والـ bilirubin ممكن يبقى طبيعي خالص.
          - الرئة: **Hepatopulmonary syndrome** و **Portopulmonary hypertension**. الكبد بيأذي الرئة، والتحاليل التلاتة مش شايفة ده.
          - القنوات المرارية: **Recurrent cholangitis** و **Intractable pruritus**. عدوى بتتكرر، أو حكّة مبتخلّيش المريض ينام.
          - الأوعية: **Budd-Chiari syndrome**.
          - أمراض وراثية أو تخزين: **Cystic fibrosis** و **Familial amyloidosis** و **Polycystic liver disease**.
          - بعد الزرع: **Small for size syndrome**، لما الـ graft يطلع صغير على جسم المريض.

          الشرح اللي جنب كل مجموعة منطق مقبول؛ الكتاب كاتب القايمة بس.
      - kind: sort
        page: 189
        quote: "Conditions for which MELD exception points may be allocated: HCC Hepatopulmonary syndrome Portopulmonary hypertension Recuurent cholangitis Budd-chiari syndrome Intractable pruritis"
        prompt: "مين في قائمة الـ MELD exception points بتاعة L11 (صفحة 189)، ومين لأ؟"
        bins: ["L11 p189 list", "Not on the L11 list"]
        cards:
