        caption: |
          أربع صور تانية:

          - **(1)** العينين **حمرا**: الـ eye lesions، وهي اللي ممكن تعمي.
          - **(2)** حبوب صغيرة وبثور: **papulopustular lesions**.
          - **(3)** بقعة حمرا منفوخة على الرجل: ==erythema nodosum-like== lesion.
          - **(4)** ورم أحمر حوالين العين.

          الجلد والعين من الـ minor criteria، وكل واحدة منهم بتكمّل التشخيص مع قرح البق.
      - kind: explain
        page: 158
        title: "العين والمفاصل والعلاج"
        quote: "Eye disease is usually present from the outset but also may develop within the first few years. Decreased visual acuity is a result of secondary glaucoma, cataracts, or vitreous hemorrhage. Blindness has been reported to occur within 4-5 years from the onset of ocular symptoms. Retinal vein thrombosis leading to sudden blindness is not rare."
        text: |
          - العين غالبًا من البداية. النظر يقل من **secondary glaucoma**، cataract أو vitreous haemorrhage
          - ==Blindness خلال 4–5 سنين==، و **retinal vein thrombosis** مش نادرة
          - المفاصل: **أكتر من النص**، multiple joints. في الأطفال الـ arthritis أشهر minor feature (11 من 40)
          - العلاج: aphthous ← ==colchicine، thalidomide==؛ العين ← **azathioprine**؛ وكمان cyclosporine
      - kind: reveal
        page: 158
        quote: "Retinal vein thrombosis leading to"
        prompt: "ليه الـ Behçet بيعمل retinal vein thrombosis، وده ليه علاقة بتقسيمه في Chapel Hill؟"
        answer: |
          الـ Behçet في Chapel Hill هو **variable vessel vasculitis** (ص 126): بيمسك أي حجم، **شرايين وأوردة**.

          التفسير المقبول (مش في الكتاب): التهاب جدار **الوريد** بيخلّي الدم يتجلط جواه، فالـ Behçet من الأمراض القليلة اللي بتعمل **جلطات وريدية** بسبب الالتهاب. في العين، جلطة وريد الشبكية = ==sudden blindness== (زي ما الكتاب بيقول not rare). وعشان كده الـ **azathioprine** للعين بدري، والكتاب بيقول blindness ممكن تحصل خلال **4–5 سنين**.
      - kind: check
        page: 157
        quote: "Positive pathergy test - An erythematous papule larger than 2 mm at the prick site 48 hours after the application of a 20- to 22-gauge sterile needle, which obliquely penetrated avascular skin to a depth of 5 mm as read by a physician at 48 hours."
        question: "Oral ulcers 5 times this year + genital scarring + positive pathergy. 1990 criteria met?"
        options:
          - "Yes: oral ulcers + 2 minor"
          - "No: eye disease is required"
          - "No: 3 minor criteria are needed"
          - "No: pathergy does not count"
        answer: 0
        why:
          - "صح: الـ oral ulcers + اتنين (genital + pathergy)."
          - "العين واحدة من الـ minor مش شرط."
          - "اتنين بس كفاية."
          - "الـ pathergy من الـ criteria."
      - kind: explain
        page: 159
        title: "PACNS: 7 heuristics"
        quote: "No diagnosis of PACNS should be made in the absence of a lumbar puncture to rule out infection and malignancy."
        text: |
          Neuro deficit مكتسب مش مفسّر + angiography أو histology فيها angiitis في الـ central nervous system (CNS) + مفيش systemic vasculitis.
          1. مفيش صورة مميزة؛ اشتبه مع **strokes متعددة في territories مختلفة** أو cerebrospinal fluid (CSF) فيه **chronic meningitis**
          2. ==No lumbar puncture (LP) = no diagnosis==
          3. **magnetic resonance imaging (MRI)** حساس بس مش specific
          4. مفيش angiography **100% specific**
          5. ==Brain biopsy== بتأكد وتستبعد الـ mimics
          6. الـ must-rule-outs: **infection و malignancy**
          7. مفيش استجابة لـ **cyclophosphamide** ← فكّر في تشخيص تاني
      - kind: reveal
        page: 159
        quote: "No diagnosis of PACNS should be made in the absence of a lumbar puncture"
        prompt: "ليه مفيش تشخيص PACNS من غير lumbar puncture، وليه الـ brain biopsy مهمة كده؟"
        answer: |
          لأن الـ **must-rule-outs** هما **infection** و **malignancy** (الكتاب ص 160)، والاتنين بيعملوا نفس الصورة: strokes متعددة، و CSF شكله chronic meningitis، و MRI غير طبيعي.

          التفسير المقبول (مش في الكتاب): علاج الـ PACNS **cyclophosphamide** و steroids. لو المشكلة **TB meningitis** أو **lymphoma** في المخ وإدّيت العلاج ده، هتموّت العيان. فالـ LP بيدوّر على الميكروب والخلايا الخبيثة، والـ biopsy بتأكد الـ angiitis وتستبعد الـ mimics. ولو العيان **ما استجابش** للـ cyclophosphamide، الكتاب بيقولك: ارجع فكّر في تشخيص تاني.
      - kind: check
        page: 159
        quote: "Neuroimaging is highly sensitive but nonspecific. MRI is the test of choice."
