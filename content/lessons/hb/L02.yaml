        title: "من الـ fibrosis للضغط"
        text: |
          الدروس اللي فاتت كانت عن **التليف**. الدرس ده عن النتيجة الأخطر: **portal hypertension**، وبالذات الـ **clinically significant portal hypertension (CSPH)** اللي بيعمل varices و decompensation.

          المريض اللي هنتكلم عنه عنده **compensated chronic liver disease** (ما حصلّوش decompensation قبل كده). أول سؤال: هل عنده **advanced chronic liver disease (cACLD)**؟

          - **LSM > 10 kPa:** probable
          - **LSM > 12–15 kPa:** very probable
          - وعلامة imaging بتساعد: **nodularity of the liver surface**
      - kind: figure
        page: 30
