        caption: |
          4 مجموعات تحت، وكل مجموعة 3 أعمدة: الفاتح **CRRT initiation** (continuous renal replacement therapy)، الأزرق **In-ICU mortality**، والكحلي **Composite**. الـ **NC** هنا = نتيجة الـ [TIMP-2]×[IGFBP7]:

          - **الأولى، NC−/AKI− (249)**: الـ CRRT تقريبًا صفر، والـ mortality حوالي 14%.
          - **التانية، NC+/AKI− (231)** في دايرة حمرا: **Subclinical AKI?**: الـ marker موجب والـ creatinine طبيعي.
          - **التالتة، NC−/AKI+ (81)** في دايرة حمرا: **Hemodynamic Prerenal AKI?**: الـ creatinine علي والـ marker سالب، والـ composite حوالي 21%.
