          - **Green tea extract**: قلّل زيادة الوزن، الدهون الكلية والـ visceral، الـ IR، الـ steatosis والـ cholesterol.
          - **Coffee**: بيقلل خطر **T2DM** ومرتبط بـ **less fibrosis in NASH**.
          - **Garlic**: الـ **S-allylmercaptocysteine (SAMC)** ليه دور في DM و NASH.
          - **Ginger**.
