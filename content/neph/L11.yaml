  - id: neph.L11.066
    kind: mcq
    topic: aki-dx
    stem: "At 32 weeks with a viable fetus, a woman has unexplained AKI and nephrotic proteinuria after a non-diagnostic work-up. What does the book advise?"
    options:
      - Biopsy now, because the third trimester is the safest time
      - Consider delivery first, then biopsy
      - Never biopsy during or after pregnancy
      - Start mycophenolate empirically
      - Biopsy only after 40 weeks
    answer: 1
    why:
      - Late-pregnancy biopsy has more complications, notably after 25 weeks.
      - "Correct: in late-term pregnancy with a viable fetus, delivery before biopsy may be the more prudent option."
      - Biopsy is reasonable when it changes treatment, ideally in the first two trimesters.
      - Mycophenolate is teratogenic and contraindicated in pregnancy.
      - Waiting to 40 weeks delays care and is not advised.
