      - kind: explain
        page: 18
        quote: "Causes of acute respiratory acidosis"
        title: "Respiratory acidosis: 4 أماكن ممكن الهوا يتزنق فيها"
        text: |
          الـ ==respiratory acidosis== = الـ CO2 مش بيطلع. فكّر في الطريق من المخ للرئة:

          1. **المركز في الـ medulla**: anesthetics، sedatives، opiates، cerebral trauma أو infarct، central sleep apnea، cardiac arrest.
          2. **العضلات والـ chest wall**: succinylcholine، curare، aminoglycosides، myasthenia crisis، Guillain–Barré، tetanus، botulism، severe hypophosphatemia.
          3. **الـ airway**: aspiration، laryngospasm، severe bronchospasm، obstructive sleep apnea.
          4. **الـ ventilation**: flail chest، pneumothorax، ARDS، acute PE، pulmonary edema، severe asthma و pneumonia.

          وعلى الـ ventilator: **أكل carbohydrate كتير** مع minute ventilation ثابتة = CO2 أكتر.
      - kind: explain
        page: 19
        quote: "Chronic obstructive pulmonary disease (COPD) (most common cause)"
        title: "الـ chronic"
        text: |
          نفس الأربع أماكن، بس أمراض مزمنة:

          - **المركز**: chronic sedative/opiate addiction، brain tumors، obesity-hypoventilation
          - **العضلات**: spinal cord injury، MS، muscular dystrophy، ALS، myxedema، diaphragmatic paralysis
          - **الـ airway**: ==COPD==، وده **أشهر سبب**
          - **الـ ventilation**: kyphoscoliosis، fibrothorax، interstitial fibrosis، extreme obesity
      - kind: explain
        page: 19
        quote: "Direct stimulation of medullary respiratory center Voluntary or psychogenic hyperventilation Stroke"
        title: "Respiratory alkalosis: حد بيزق المركز"
        text: |
          هنا العكس: النفس **زيادة**.

          - **Direct stimulation** للمركز: anxiety (psychogenic)، stroke، CNS infection أو tumor، ==Gram-negative sepsis==، **liver failure**، **pregnancy** (progesterone)، fever، thyrotoxicosis، وأدوية (salicylates، progesterone، nicotine، xanthines، catecholamines).
          - **Pulmonary**: pneumonia، asthma، pulmonary edema، PE، ILD، high altitude (و hypotension و severe anemia).
          - **Mechanical ventilation** بـ high minute ventilation.
      - kind: sort
        page: 19
        quote: "Liver failure"
        prompt: "Acidosis ولا alkalosis تنفسي؟"
        bins: ["Respiratory acidosis", "Respiratory alkalosis"]
        cards:
