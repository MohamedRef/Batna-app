  - id: neph.L02.lesson2
    title: "الـ heat map والمتابعة: CKD ولا AKI؟"
    hook: "خانة واحدة في جدول 6 × 3 بتقولك المريض خطره قد إيه، وتشوفه كام مرة في السنة."
    minutes: 9
    pages: [31, 33]
    topics: [staging, chronicity]
    goals:
      - "تحط أي مريض في خانته على الـ heat map وتعرف ليه الاتجاهين"
      - "تعرف كام مرة تتابعه وإمتى التغيير يقلق وليه"
      - "تفرق CKD عن AKI"
    status: unverified
    steps:
      - kind: figure
        page: 31
        quote: "CKD heat map"
        title: "الـ heat map: صورة الكتاب"
        image: { file: neph/L02-heat-map.webp, book: true }
        alt: "Book heat map 'Prognosis of CKD by GFR and albuminuria categories'. Rows G1 to G5 (normal or high 90 or more; mildly decreased 60-89; mildly to moderately decreased 45-59; moderately to severely decreased 30-44; severely decreased 15-29; kidney failure under 15). Columns A1 (under 30 mg/g), A2 (30-300), A3 (over 300). Cells go from green (top left) through yellow and orange to red (bottom right). A green-to-red arrow along the bottom and right side reads increasing risk."
        caption: |
          - **الصفوف (شمال)**: الـ **GFR categories** من **G1** (≥90) لـ **G5** (<15، Kidney failure)، وفي النص **G3a** (45–59) و **G3b** (30–44).
          - **الأعمدة (فوق)**: الـ **Albuminuria categories**: **A1** (<30 mg/g)، **A2** (30–300)، **A3** (>300).
          - **الألوان**: أخضر فوق شمال (G1–G2 مع A1) ← أصفر ← برتقاني ← أحمر تحت يمين.
          - **السهمين** (تحت ويمين): **Increasing risk**.

          الخطر بيزيد ==لما تنزل وكمان لما تروح يمين==: يعني G2 مع A3 (برتقاني) أخطر من G3a مع A1 (أصفر). علشان كده الـ CKD بيتصنّف بـ ==G و A مع بعض== مش بالـ GFR لوحده.
      - kind: explain
        page: 31
        quote: "ERA statement on CVD in CKD 2023"
        title: "ليه الـ heat map فيها اتجاهين؟"
        text: |
          الـ heat map بتحط الـ **GFR** في الصفوف والـ **albuminuria** في الأعمدة، والخطر بيزيد كل ما تنزل **أو** تروح يمين.

          التفسير المقبول (مش في الكتاب): الـ G والـ A بيقيسوا حاجتين مختلفين. الـ GFR بيقيس الشغل اللي **فاضل**، والـ albuminuria بتقيس الأذى **الشغّال دلوقتي**. واحد G3a بـ A1 ممكن يعيش عمره كله كده، وواحد G3a بـ A3 ماشي بسرعة. علشان كده الخانة هي اللي بتتكلم مش الرقم لوحده.

          وفي نفس الصفحة الـ **ERA statement on CVD in CKD 2023**: الـ ==moderate CKD== = **high** CVD risk، والـ ==severe CKD== = **very high** CVD risk (زي تصنيف الـ ESC 2021). يعني الخانة كمان بتقولك الدهون والضغط هيتعالجوا بقوة قد إيه.
      - kind: figure
        page: 31
        quote: "ERA statement on CVD in CKD 2023"
        title: "الـ heat map ومخاطر القلب (ERA 2023)"
        image: { file: neph/L02-era-cvd-prevalence.webp, book: true }
        alt: "Book figure: a heat-map grid of GFR categories G1-G5 against albuminuria A1-A3, each cell holding the prevalence in the general population (for example G1 A1 55.6%, G2 A1 32.9%, G3a A1 3.6%, G5 under 0.1%). A box on the right: what is known, CKD severity (mild, moderate, severe CKD); what is new, ESC 2021 CVD risk class (high CVD risk, very high CVD risk)."
        caption: |
          - **الشبكة شمال**: نفس الـ G في الصفوف والـ A في الأعمدة، بس كل خانة فيها **النسبة في عموم الناس**: G1 A1 **55.6%**، G2 A1 **32.9%**، G3a A1 **3.6%**، وتحت خالص <0.1%.
          - **الصندوق يمين**: **What is known?** الألوان = **Mild / Moderate / Severe CKD**. **What is new?** نفس الألوان = **ESC 2021 CVD risk class**: البرتقاني = **High CVD risk**، والأحمر = **Very high CVD risk**.

          يعني الخانة اللي المريض فيها بتقولك حاجتين: ==شدة الـ CKD== وكمان ==درجة خطر القلب== اللي على أساسها بتعالج الدهون والضغط. والنسب بتفكّرك إن أغلب الناس في الأخضر، والخانات الحمرا قليلة بس خطيرة.
