      - kind: match
        page: 174
        quote: "IFNg and IL-2 can inhibit Th2 cell proliferation."
        prompt: "وصّل الـ cytokine بالخلية اللي بتعمله:"
        pairs:
          - ["IFN-γ", "Th1"]
          - ["IL-4", "Th2"]
          - ["IL-17", "Th17"]
          - ["IL-10 + TGF-β (protective)", "T reg"]
        why: "الـ Th1 = IFN-γ و tumor necrosis factor (TNF) و IL-2. الـ Th2 = IL-4، 5، 10، 13. الـ Th17 = IL-17. والـ T reg بيحمي بـ IL-10 و TGF-β."
      - kind: reveal
        page: 174
        quote: "The activation of Th2 cells contributes to the development of chronic graft- versus-host disease, systemic lupus erythematosus, and systemic sclerosis."
        prompt: "ليه الـ SLE بيتحسب على Th2 مش Th1؟"
        answer: |
          لأن الـ **Th2** بيحفّز الـ **B cells تعمل antibodies**، والـ SLE مرض ==autoantibodies== في الأساس. أما الـ RA والـ psoriasis فـ **cell-mediated** فبيتحسبوا على Th1.
      - kind: explain
        page: 174
        title: "Th17 و T reg"
        quote: "Th17 cells differentiate from naïve T cells in response to antigen, transforming growth factor (TGF) beta, IL-6, and IL-23."
        text: |
          - **Th17:** antigen + ==TGF-β + IL-6 + IL-23==. بيعمل **IL-17** اللي بيكبّر الالتهاب ويحفّز keratinocytes و synoviocytes و macrophages و fibroblasts و neutrophils.
          - **T reg:** antigen + **TGF-β**. بيحمي بـ **IL-10** و TGF-β. ليه دور في giant cell arteritis (GCA) و granulomatosis with polyangiitis (GPA) و RA و systemic lupus erythematosus (SLE) و spondyloarthritis (SpA) و Sjögren. لسه **مش متجرب** كـ cell therapy.
      - kind: aside
        tone: analogy
        page: 174
        quote: "T reg cells function largely to regulate other T cells. They may have critical functions in multiple rheumatic diseases, including giant cell arteritis, granulomatosis with polyangiitis, rheumatoid arthritis, systemic lupus erythematosus, spondyloarthritis, Sjögren's syndrome, and other conditions."
        text: |
          الـ **TGF-β** زي "مدرسة" بتخرّج نوعين: لو معاه **IL-6** يطلع ==Th17== مشاغب، ولو لوحده يطلع ==T reg== ناظر المدرسة اللي بيهدّي الكل.
      - kind: reveal
        page: 174
        prompt: "لو الـ T reg بتطفي الالتهاب، ليه لسه ما بقتش علاج؟"
        quote: "While not yet clinically tested as cell-based therapy, their capacity to reduce"
        answer: |
          الكتاب بيقول الـ **T reg** شغلتها ==regulate other T cells==، وليها دور في أمراض كتير (GCA، GPA، RA، SLE، spondyloarthritis، Sjögren's)، وبتحمي عن طريق **IL-10 و TGF beta**. وبيقول إنها **not yet clinically tested as cell-based therapy**، بس قدرتها تقلل الالتهاب والـ autoimmunity **subject of interest**.

          التفسير المقبول (مش في الكتاب): الفكرة إنك تكتّر الخلايا اللي **بتفرمل** المناعة بدل ما تقفل جزء منها، فتطفي المرض من غير ما تفتح باب للعدوى. بس العلاج بالخلايا صعب: لازم تطلّعها من العيان، وتكبّرها برّه، وترجعها من غير ما تتحول لخلية مشاغبة (افتكر إن الـ TGF-β مع الـ IL-6 بيطلّع Th17 بدلها). عشان كده لسه **تحت البحث**.
      - kind: try
        items: [rheum.L10.001, rheum.L10.003, rheum.L10.005, rheum.L10.007, rheum.L10.009]
    recap:
      - "الـ biologics: تقفل cytokines، أو تمنع الـ second signal للـ T cell، أو تشيل الـ B cells."
      - "Th1 (IFNg، TNF، IL-2): RA، psoriasis، rejection. Th2 (IL-4، 5، 10، 13): antibodies، SLE، SSc. وكل واحد بيكبح التاني."
      - "Th17: TGF-β + IL-6 + IL-23 ← IL-17. T reg: TGF-β ← IL-10 و TGF-β، حماية، ولسه مش علاج."
    practice: [rheum.L10.001, rheum.L10.002, rheum.L10.003, rheum.L10.004, rheum.L10.005, rheum.L10.006, rheum.L10.007, rheum.L10.008, rheum.L10.009, rheum.L10.010]
