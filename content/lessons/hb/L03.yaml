    pages: [48, 52]
    topics: [acute-bleeding, endoscopy]
    goals:
      - "ترتّب أول خطوات النزيف الحاد: airway، دم بحساب، antibiotics، أدوية، منظار"
      - "تشرح ليه الـ Hb target 7–9 وليه الـ FFP ضار"
      - "تحفظ أرقام الأدوية والمنظار: 80%، 90%، 3–5 أيام، 12 ساعة"
      - "تقارن الـ band ligation بالـ sclerotherapy"
    status: unverified
    steps:
      - kind: mnemonic
        page: 48
        word: "ABCDE"
        parts:
          - { key: "A", text: "Airway and circulation first: general resuscitation" }
          - { key: "B", text: "Blood carefully: Hb between 7 and 9 g/dL; no FFP" }
          - { key: "C", text: "Cover with antibiotics: short-term prophylaxis for all (IV ceftriaxone if advanced disease and unstable)" }
          - { key: "D", text: "Drugs, vasoactive: terlipressin, somatostatin or octreotide, for 3–5 days" }
          - { key: "E", text: "Endoscopy: band ligation within 12 hours (preferably 6)" }
        hook: |
          زي الـ **ABCDE** بتاع الطوارئ، بس **نسخة الدوالي**. كل حرف خطوة من الكتاب، والترتيب ده هو اللي هتكتبه في سؤال الـ essay.
      - kind: explain
        page: 48
        title: "A و B: الإنعاش من غير ما تغرّق المريض"
        text: |
          - **Initial measures:** **general resuscitation**: **securing the airway** و **stabilization of the circulation**.
          - **Careful replacement of volemia: Hb between 7 and 9 g/dL.**
          - في **rat model** للـ portal hypertensive bleeding: **portal pressure و blood loss و mortality بيزيدوا مع الـ blood transfusion**.
      - kind: reveal
        page: 48
        prompt: "المريض بينزف... ليه ما نرفعش الـ Hb لـ 10 أو 12 ونرتاح؟"
        answer: |
          ارجع للمعادلة **P = R × F**.

          كل ما تزوّد الـ volume، الـ **flow** في الـ portal بيزيد، فالـ **portal pressure يعلى**، والـ clot اللي على الدوالي ممكن يتشال. يعني إنت بتطفي الحريقة بالبنزين. وده بالظبط اللي الـ rat model وريه: transfusion أكتر = ضغط أعلى ونزيف أكتر ووفيات أكتر.
      - kind: update
        page: 48
        text: "Baveno VII بيستخدم **restrictive strategy**: transfusion لما الـ Hb يوصل حوالي **7 g/dL**، والـ target **7–8 g/dL**. رقم الكتاب **7–9 g/dL** هو اللي يتكتب في الامتحان."
        ref: "Baveno VII consensus, 2021"
      - kind: explain
        page: 49
        title: "الـ INR عالي... بس دي مش مشكلة تجلّط"
        text: |
          - الأدلة بتقول إن الـ variceal bleeding **unrelated to haemostatic failure**، وسببه **portal hypertension و local vascular abnormalities** بالكامل.
          - ومع ذلك المرضى بياخدوا **blood products أو prohaemostatic therapy** كتير «زي أي نزيف كبير».
          - الـ **FFP أو platelet concentrate** غالبًا **ineffective** ومرتبطين بـ **infection، TRALI، و TACO**.
          - **Transfusion of FFP during acute variceal bleeding is ineffective and does harm**: مرتبط بـ **failure to control bleeding at 5 days** و **mortality at 42 days**.
      - kind: aside
        tone: trap
        page: 49
        text: |
          الـ INR في الـ cirrhosis **ما بيعبّرش** عن خطر النزيف زي ما بيعبّر في مريض الـ warfarin. الكبد بيقلل الـ pro-coagulants والـ anti-coagulants مع بعض.

          فلو السؤال قال «INR 2.1، platelets 60، variceal bleeding: give FFP?» ← **لأ**. الـ FFP كمان volume، يعني ضغط أعلى.
      - kind: explain
        page: 49
        title: "C: الـ infection هو العدو الخفي"
        text: |
          - من أهم مضاعفات الـ variceal hemorrhage: **bacterial infection**.
          - **Short-term antibiotic prophylaxis** بيقلل الـ infections **وبيزوّد الـ survival**، و **standard of care**.
          - و RCT حديثة: **IV ceftriaxone** ممكن يكون **superior** في مرضى **advanced liver disease و haemodynamic instability**.
      - kind: explain
        page: 48
        title: "D و E: الأدوية والمنظار"
        text: |
          **Vasoactive drugs:**
          - **Octreotide** (synthetic **somatostatin analogue**) أو **terlipressin** (synthetic **vasopressin analogue**) بيوقفوا النزيف، على الأقل مؤقتًا، في **up to 80%**.
          - **Somatostatin may be superior to octreotide.** بيمنع إفراز الـ **vasodilator hormones** ← **splanchnic vasoconstriction** و **decreased portal inflow** (الـ F تاني!). والاتنين safe وأعراضهم الجانبية قليلة جدًا.

          **Endoscopy:**
          - **Sclerotherapy و variceal ligation** بيوقفوا النزيف في **up to 90%**.
          - **Octreotide (أو terlipressin) لمدة 3–5 أيام + endoscopic therapy** أحسن من أي واحد لوحده: **rebleeding أقل** و **transfusion أقل** في الأيام الأولى.
