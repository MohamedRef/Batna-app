  - id: geri.L13.lesson5
    title: "الساعات الأخيرة والـ hospice"
    hook: "العيلة مرعوبة من صوت «الخرخرة» في نَفَس أبوهم. كلمتين منك ممكن يغيّروا آخر ساعات ليهم."
    minutes: 7
    pages: [228, 229]
    topics: [last-hours, hospice]
    goals:
      - "تجهّز العيلة للساعات الأخيرة"
      - "تفرّق الـ hospice عن الـ palliative care"
    status: unverified
    steps:
      - kind: explain
        remind: [geri.L13.045]
        page: 228
        quote: "The last hours of life often are marked by a constellation of symptoms that can be especially distressing for family members. Family education about expected symptoms such as delirium, excessive secretions, edema, and coma can help prepare families for the impending death, alleviate anxiety if these symptoms develop, and improve families' abilities to care for their loved ones in the last hours of life. Death rattle\"-agurgling sound caused by air moving through uncleared secretions in the trachea and vocal cords of a comatose patient-is perhaps the most distressing symptom experienced by families of dying patients. Education of family members as to the cause of the noise is critical. It is crucial to emphasize that the noise does not represent gasping or suffocation, and the patient is not experiencing suffering or breathlessness."
        title: "جهّز العيلة"
        text: |
          اشرح للعيلة الأعراض المتوقعة قبل ما تحصل:
          - **Delirium**.
          - ==Excessive secretions==.
          - **Edema**.
          - **Coma**.

          ليه تشرح **قبل** ما تحصل؟ الكتاب بيدي تلات أسباب: بيجهّزهم للموت اللي جاي، بيقلل قلقهم لو الأعراض ظهرت، وبيخليهم يقدروا يرعوه في الساعات دي.
          التفسير المقبول (مش في الكتاب): الحاجة اللي بتفاجئك بترعبك؛ نفس العرض لما تكون مستنيه ومفهوم سببه بيبقى أخف بكتير.
      - kind: reveal
        page: 228
        quote: "The last hours of life often are marked by a constellation of symptoms that can be especially distressing for family members. Family education about expected symptoms such as delirium, excessive secretions, edema, and coma can help prepare families for the impending death, alleviate anxiety if these symptoms develop, and improve families' abilities to care for their loved ones in the last hours of life. Death rattle\"-agurgling sound caused by air moving through uncleared secretions in the trachea and vocal cords of a comatose patient-is perhaps the most distressing symptom experienced by families of dying patients. Education of family members as to the cause of the noise is critical. It is crucial to emphasize that the noise does not represent gasping or suffocation, and the patient is not experiencing suffering or breathlessness."
        prompt: "البنت بتعيّط: «بابا بيتخنق!» والصوت جاي مع كل نَفَس. تقولها إيه؟"
        answer: "ده ==death rattle==: هوا بيعدّي على secretions في الـ trachea والـ vocal cords مايقدرش يطلّعها لأنه في coma. **مش اختناق**، وهو **مش حاسس بمعاناة** ولا ضيق نفس. ده يمكن أكتر عرض بيوجع العيلة، فالشرح نفسه علاج."
      - kind: explain
        page: 228
        quote: "If edema is present, therapies that can exacerbate edema, such as IV fluids, should be discontinued when at all possible. Skin care should continue with a focus on prevention of skin breakdown using lubricants and emollients rather than turning or repositioning, which can cause increased discomfort and pain. If pressure ulcers are present, efforts should be focused on pain management and minimizing discharge and odors rather than turning, repositioning, or active wound care directed at ulcer heal."
        title: "الجلد والـ edema"
        text: |
          - لو فيه edema: وقّف أي حاجة بتزوّده زي ==intravenous (IV) fluids== على قد ما تقدر.
          - الجلد: **lubricants و emollients** بدل التقليب، لأن التقليب بيوجع.
          - الـ pressure ulcers: ركّز على **الألم، الإفرازات، والريحة**، مش على الـ repositioning ولا العلاج اللي هدفه الالتئام.

          ليه نسيب العلاج اللي هدفه الالتئام؟ التفسير المقبول (مش في الكتاب): في الساعات الأخيرة الجرح مش هيلحق يلتئم. التقليب والغيار التقيل وجع من غير مكسب، والهدف بقى راحة المريض مش شكل الجرح.
      - kind: check
        page: 228
        quote: "If edema is present, therapies that can exacerbate edema, such as IV fluids, should be discontinued when at all possible. Skin care should continue with a focus on prevention of skin breakdown using lubricants and emollients rather than turning or repositioning, which can cause increased discomfort and pain. If pressure ulcers are present, efforts should be focused on pain management and minimizing discharge and odors rather than turning, repositioning, or active wound care directed at ulcer heal."
        question: "A dying patient has marked edema and is on IV fluids. Best step?"
        options: ["Stop the IV fluids if possible", "Increase the IV fluids", "Start IV albumin", "Turn him every 2 hours"]
        answer: 0
        why:
          - "صح: الـ IV fluids بتزوّد الـ edema."
          - "هتزوّد الـ edema والـ secretions."
          - "مش هدف في الساعات الأخيرة."
          - "التقليب بيوجع؛ استخدم emollients."
      - kind: explain
        page: 228
        quote: "Palliative care services can be offered to any patient without restriction to disease or prognosis, and can be appropriate for anyone with a serious, complex illness, whether they are expected to recover fully, to live with chronic illness for an extended time, or to experience disease progression."
        title: "الـ palliative care لمين؟"
        text: |
          في أمريكا لازم تفرّق بين الاتنين، مع إن الاتنين هدفهم تخفيف الأعراض والألم.

          الـ palliative care: لأي مريض ==من غير قيود على المرض أو الـ prognosis==، طالما عنده serious, complex illness، سواء:
          - متوقع **يخف خالص**.
          - هيعيش مع **مرض مزمن** فترة طويلة.
          - المرض **هيتقدم**.

          يعني الـ prognosis مش شرط دخول. ده بالظبط اللي بيفرّقها عن الـ hospice.
      - kind: figure
        page: 229
        quote: "The philosophy and multi-disciplinary team approach are similar with hospice and palliative care, and indeed the training programs and many organizations provide both. The biggest difference between hospice and palliative care is the patient: where they are in their illness especially related to prognosis and their goals/wishes regarding curative treatment."
        title: "Palliative care مقابل hospice"
        alt: "A timeline from diagnosis to death. A long bar labelled palliative care runs the whole way, from diagnosis, alongside curative treatment, with any prognosis. A shorter bar at the end labelled hospice starts when cure is no longer sought and two physicians certify less than six months to live."
        caption: "الـ palliative care على طول الطريق. الـ hospice آخر حتة بس، من غير curative intent."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="GL13b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <path d="M14 30H312" class="fg-arrow" marker-end="url(#GL13b)"/>
            <text x="10" y="20" class="t-sm t-mut">diagnosis</text>
            <text x="270" y="20" class="t-sm t-mut">death</text>
            <rect x="14" y="50" width="296" height="44" rx="8" class="fg-good"/>
            <text x="24" y="70" class="t-sm t-b">Palliative care</text>
            <text x="24" y="87" class="t-sm">any stage, any prognosis</text>
            <rect x="14" y="104" width="180" height="34" rx="8" class="fg-acc"/>
            <text x="24" y="126" class="t-sm">with curative treatment</text>
            <rect x="200" y="148" width="110" height="70" rx="8" class="fg-bad"/>
            <text x="210" y="168" class="t-sm t-b">Hospice</text>
            <text x="210" y="186" class="t-sm">no cure intent</text>
            <text x="210" y="204" class="t-sm">2 MDs: under 6 mo</text>
          </svg>
      - kind: explain
        page: 229
        quote: "Hospice is a type of care involving palliation without curative intent."
        title: "الـ hospice"
        text: |
          - ==Palliation without curative intent==: لما مفيش علاج شافي، أو المريض اختار مايكملش علاج صعب احتماله ضعيف.
          - **Medicare Hospice Benefit**: **اتنين** أطباء يشهدوا إن العمر المتوقع ==أقل من 6 شهور== لو المرض مشي طبيعي. ولو عاش أكتر؟ **مش بيتشال**.
          - الفرق الأكبر: **المريض** (فين في المرض، الـ prognosis، ورغبته في العلاج الشافي). الفلسفة والفريق شبه بعض.
          - **برا أمريكا**: كلمة hospice غالبًا يعني **مبنى** متخصص، مش مرحلة.

          ليه مابيتشالش بعد الـ 6 شهور؟ التفسير المقبول (مش في الكتاب): الـ 6 شهور **تقدير** لو المرض مشي طبيعي، مش موعد. الـ prognosis في الأمراض المزمنة صعب يتحدد بالظبط، وطرد المريض لأنه عاش أكتر من المتوقع هيعاقبه على حاجة مش بإيده.
      - kind: reveal
        page: 229
        quote: "Outside the United States the term hospice usually refers to a building or institution which specializes in palliative care, rather than to a particular stage of care progression."
        prompt: "دكتور في مستشفى برا أمريكا قال «هنحوّله الـ hospice». يقصد إيه غالبًا؟"
        answer: "غالبًا ==مكان==: **building or institution** متخصص في الـ palliative care، مش مرحلة من مراحل المرض. وبرا أمريكا مفيش التقسيم ده في المسميات أو التمويل؛ كل الرعاية اللي تركيزها palliative بتتسمى palliative care، سواء المرض terminal أو لأ. والأماكن دي ممكن تكون متخصصة في نهاية الحياة، بس كمان بتستقبل مرضى ليهم احتياجات palliative تانية."
      - kind: check
        page: 229
        quote: "Usually, it is used for people with no further options for curing their disease or in people who have decided not to pursue further options that are arduous, likely to cause more symptoms, and not likely to succeed. Hospice care under the Medicare Hospice Benefit requires that two physicians certify that a patient has less than six months to live if the disease follows its usual course. This does not mean, though, that if a patient is still living after six months in hospice he or she will be discharged from the service."
