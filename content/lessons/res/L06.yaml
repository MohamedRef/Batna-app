  - id: res.L06.lesson4
    title: "من المعمل للصيدلية: الـ phases"
    hook: "من 10,000 مادة بتتجرّب، واحدة بس بتوصل الصيدلية. الـ 9,999 التانيين وقعوا فين؟"
    minutes: 9
    pages: [5, 41]
    topics: [drug-phases]
    goals:
      - "ترتّب مراحل تطوير الدوا"
      - "تعرف كل phase بيسأل إيه، على مين، وكام واحد"
      - "تعرف ليه phase IV موجودة"
    status: unverified
    steps:
      - kind: explain
        page: 5
        quote: "New Product Development – A Risky and Expensive Proposition"
        title: "مشوار طويل وغالي"
        text: |
          الدوا الجديد ==A Risky and Expensive Proposition==:

          - **Discovery** (2–10 سنين)، بعدها **preclinical testing** في المعمل وعلى الحيوانات.
          - بعدها **Phase I، II، III**، وبعدين **FDA review approval**، وبعدها **post-marketing testing**.
          - من **5,000–10,000** مادة بيتعملهم screening: **250** يدخلوا preclinical، **5** يدخلوا clinical testing، وواحدة بس **approved**.
          - التكلفة على الشريحة: حوالي **$802 million** على مدى **15 سنة**.
      - kind: figure
        page: 5
        quote: "New Product Development – A Risky and Expensive Proposition"
        title: "القمع"
        alt: "New drug development as a funnel narrowing from 5,000 to 10,000 compounds screened, to 250 entering preclinical testing, to 5 entering clinical testing, to 1 approved by the FDA."
        caption: "كل مرحلة بتصفّي. لما تقرا «Phase III failed» في الأخبار، افتكر إن ده الطبيعي مش الاستثناء."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 10h300l-50 56h-200z" class="fg-thin"/>
            <text x="165" y="34" text-anchor="middle" class="t-b">5,000-10,000</text>
            <text x="165" y="54" text-anchor="middle" class="t-sm t-mut">screened</text>
            <path d="M65 72h200l-40 56h-120z" class="fg-box"/>
            <text x="165" y="96" text-anchor="middle" class="t-b">250</text>
            <text x="165" y="116" text-anchor="middle" class="t-sm t-mut">enter preclinical</text>
            <path d="M105 134h120l-30 56h-60z" class="fg-acc"/>
            <text x="165" y="158" text-anchor="middle" class="t-b">5</text>
            <text x="165" y="178" text-anchor="middle" class="t-sm t-mut">enter clinical</text>
            <rect x="135" y="196" width="60" height="40" rx="8" class="fg-good"/>
            <text x="165" y="214" text-anchor="middle" class="t-b">1</text>
            <text x="165" y="230" text-anchor="middle" class="t-sm">approved</text>
          </svg>
      - kind: order
        page: 5
        quote: "New Product Development – A Risky and Expensive Proposition"
        prompt: "رتّب مشوار الـ drug development من الفكرة للسوق:"
        steps:
          - "Discovery"
          - "Preclinical: laboratory and animal testing"
          - "Safety and dosage in 20-80 healthy volunteers"
          - "Efficacy and side effects in 100-300 patients"
          - "Long-term adverse reactions in 1,000-5,000 patients"
          - "FDA review approval"
          - "Additional post-marketing testing"
      - kind: explain
        page: 37
        quote: "To find safe range of dose"
        title: "Phase I: هل هو آمن؟ وبأنهي جرعة؟"
        text: |
          - الهدف: ==To find safe range of dose==، ونختبر **pharmacokinetics** و **dose-response**.
          - على **healthy volunteers**، **إلا في الـ cancer والـ HIV**.
          - **Open label**، **non randomized**، **uncontrolled**.
          - لحد **100** متطوع.
      - kind: reveal
        page: 37
        quote: "On healthy volunteers ( Except cancer and HIV)"
        prompt: "ليه phase I في الـ cancer والـ HIV بيتعمل على **عيانين** مش متطوعين أصحاء؟"
        answer: |
          لأن أدوية الـ cancer (chemotherapy) والـ HIV ليها toxicity عالية. مينفعش أخلاقيًا تدّي سم لواحد سليم مش هيستفيد حاجة.

          العيان على الأقل عنده فرصة يستفيد، فالـ risk بيبقى ليه مقابل.
      - kind: explain
        page: 38
        quote: "clinical trials to evaluate efficacy ( and safety) in selected patients"
        title: "Phase II و Phase III"
        text: |
          **Phase II (therapeutic exploratory)**: على **selected patients** علشان نشوف الـ **efficacy** (والـ safety). الأسئلة: الـ dose-response، أنهي نوع عيانين، كام مرة في اليوم.

          **Phase III**: التجربة «الكبيرة»:
          - ==Large sample (1000-3000)==
          - **Randomized**، **active-controlled**، **double blind**، **parallel**، **multicentre**.
          - بنقارن بالـ **current gold standard**.
      - kind: table
        page: 36
        quote: "20-100 volunteers 100-500 patients 1,000-5,000 patients"
        title: "الـ 4 phases في جدول"
        columns: ["Phase", "Question", "Who and how many"]
        rows:
          - ["Phase 1", "Safety (first in humans)", "20-100 volunteers"]
          - ["Phase 2", "Efficacy: how well does it work?", "100-500 patients"]
          - ["Phase 3", "Confirm; compare with the gold standard", "1,000-5,000 patients"]
          - ["Phase 4", "Safety surveillance", "Real-life patients"]
        hide: [[0, 1], [1, 1], [2, 2], [3, 1]]
      - kind: aside
        tone: trap
        page: 38
        quote: "Large sample ( 1000-3000) Randomized Active- controlled Double blind Parallel Multicentre"
        text: |
          الأرقام مختلفة شوية بين الشرايح: شريحة بتقول phase I **20–80** وشريحة **20–100** (وشريحة تانية «up to 100»)، و phase III **1,000–5,000** في مكان و **1000–3000** في مكان.

          في الامتحان الـ MCQ غالبًا بيسأل عن **الترتيب**: phase I أقل من 100، phase II بالمئات، phase III بالآلاف. لو الاختيارات فيها رقم من الشرايح، اختار اللي في نفس الـ range.
      - kind: explain
        page: 39
        quote: "Involve long term safety surveillance to detect rare side effects"
        title: "Phase IV: بعد ما الدوا نزل"
        text: |
          ==Postmarketing surveillance==: **long-term safety surveillance** علشان نلقط الـ **rare side effects**.

          - ساعات الـ FDA بتطلبها: interactions مع أدوية تانية، أو فئات معينة.
          - لو ظهرت adverse effects ممكن الدوا **يتسحب أو يتقيّد**. المثال: **Vioxx**.
          - وهي **uncontrolled, observational**.

          ليه الـ rare side effects مبتظهرش قبل كده؟ side effect بيحصل لواحد من 10,000 مش هيظهر في phase III فيها 3,000 عيان.
      - kind: check
        page: 40
        quote: "It usually involves a comparison between different treatments."
        question: "Which of the following characterizes phase III drug testing?"
        options:
          - "It usually requires small patient numbers."
          - "It can be done without approval."
          - "It usually involves a comparison between different treatments."
          - "It always demonstrates superiority of the new approach."
        answer: 2
        why:
          - "Phase III بالآلاف."
          - "كل phase محتاج approval."
          - "صح: active-controlled، بيقارن بالـ gold standard."
          - "مفيش «always»؛ ممكن يطلع non-inferior أو يفشل."
      - kind: case
        page: 41
        quote: "Incorrect because there is no comparison group"
        stem: "82 patients with recurrent duodenal ulcers got triple therapy to eradicate H. pylori. The ulcer healed in 78 of those available for endoscopy. The authors say triple therapy is the therapy of choice."
        steps:
          - question: "Their inference is:"
            options: ["Correct", "Incorrect because it is not based on rates", "Incorrect because there is no comparison group", "None of the above"]
            answer: 2
            why: "مفيش **comparison group**. يمكن القرحة كانت هتخف لوحدها، أو بعلاج تاني أحسن. «of choice» يعني أحسن من حاجة، وإحنا مقارناش بحاجة."
          - question: "Which design would answer the question properly?"
            options: ["A larger case series", "A randomised controlled trial against the current standard treatment", "A cross-sectional survey"]
            answer: 1
            why: "علشان تقول «therapy of choice» لازم تقارن بالعلاج المعتاد في RCT؛ ده بالظبط شغل phase III."
      - kind: try
        items: [res.L06.051, res.L06.052, res.L06.049]
    recap:
      - "5,000–10,000 مادة ← 250 preclinical ← 5 clinical ← 1 approved؛ حوالي $802 million على 15 سنة."
      - "Phase I: safe dose، healthy volunteers (إلا cancer و HIV)، open label، non-randomized، uncontrolled، لحد 100."
      - "Phase II: efficacy في selected patients (100–500)."
      - "Phase III: large، randomized، active-controlled، double blind، parallel، multicentre."
      - "Phase IV: post-marketing، rare side effects، ممكن سحب الدوا (Vioxx)."
    practice: [res.L06.049, res.L06.050, res.L06.051, res.L06.052, res.L06.053, res.L06.054, res.L06.055, res.L06.056, res.L06.057, res.L06.058, res.L06.059, res.L06.060]
  # ------------------------------------------------------------------
  - id: res.L06.lesson5
    title: "الـ Blinding: محدش يعرف مين خد إيه"
    hook: "الدكتور اللي عارف إن العيان خد الدوا الجديد... هيشوف تحسّن حتى لو مفيش."
    minutes: 7
    pages: [42, 45]
    topics: [blinding]
    goals:
      - "تشرح ليه الـ blinding بيحمي الـ randomization"
      - "تربط كل خطوة في الـ RCT بالـ bias اللي بتمنعه"
      - "تفرّق single و double و triple"
    status: unverified
    steps:
      - kind: explain
        page: 42
        quote: "Blinding is important because it preserves the benefits of randomization by preventing the biased assessment of outcomes."
        title: "ليه نعمّي حد؟"
        text: |
          الـ ==blinding (masking)== تاني أهم ميزة في الـ RCT بعد الـ randomization.

          الـ randomization عملت مجموعتين متساويتين في الأول. بس لو الدكتور اللي بيقيس **عارف** مين خد الجديد، هيقيس بعين متحيزة، فيبوّظ اللي القرعة عملته.

          علشان كده: الـ blinding **بيحافظ على مكاسب الـ randomization** لأنه بيمنع **biased assessment of outcomes**، يعني ==measurement bias==.
      - kind: table
        page: 42
        quote: "Blinding therefore prevents measurement bias (as opposed to randomization and concealment which prevent confounding bias and selection bias, respectively)."
        title: "كل أداة بتمنع bias معين"
        columns: ["RCT feature", "Bias it prevents"]
        rows:
          - ["Randomization", "Confounding bias"]
          - ["Allocation concealment", "Selection bias"]
          - ["Blinding", "Measurement bias"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: analogy
        page: 42
        quote: "preventing the biased assessment of outcomes."
        text: |
          عايز تعرف أنهي عربية فول أحلى: عم سيد ولا عم حسن؟ لو صاحبك عارف إن الطبق من عند عم سيد (اللي بيحبه)، هيقول «ده أحلى» قبل ما يدوق.

          حط الطبقين في أطباق شبه بعض ومتقولش مين مين: ده **blinding**، وبيمنع الـ **biased assessment** للطعم. وكمان لو اللي بيعدّ الأصوات مايعرفش، يبقى **triple**.
      - kind: explain
        page: 43
        quote: "Ideally, blinding should occur at all of the following levels: Patients Caregivers"
        title: "نعمّي مين؟"
        text: |
          الأحسن يكون الـ blinding على **كل المستويات** دي:

          - **Patients**
          - **Caregivers**
          - **Collectors of outcome data** (research assistants أو study physicians)
          - **The data analyst**

          والـ blinding بيتغلب على ==ascertainment bias==.
      - kind: figure
        page: 45
        quote: "Type of blinding Single Double Triple Subject"
        title: "Single, double, triple"
        alt: "Grid with three rows: single, double and triple blinding. Columns: subject, observer, data analyst. Single blinds the subject only; double blinds subject and observer; triple blinds all three."
        caption: "كل مستوى بيضيف واحد: **subject**، بعدين **observer**، بعدين **data analyst**."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <text x="140" y="22" text-anchor="middle" class="t-sm t-b">Subject</text>
            <text x="210" y="22" text-anchor="middle" class="t-sm t-b">Observer</text>
            <text x="285" y="22" text-anchor="middle" class="t-sm t-b">Analyst</text>
            <text x="8" y="66" class="t-b">Single</text>
            <text x="8" y="116" class="t-b">Double</text>
            <text x="8" y="166" class="t-b">Triple</text>
            <circle cx="140" cy="60" r="16" class="fg-dot-acc"/>
            <circle cx="210" cy="60" r="16" class="fg-thin"/>
            <circle cx="285" cy="60" r="16" class="fg-thin"/>
            <circle cx="140" cy="110" r="16" class="fg-dot-acc"/>
            <circle cx="210" cy="110" r="16" class="fg-dot-acc"/>
            <circle cx="285" cy="110" r="16" class="fg-thin"/>
            <circle cx="140" cy="160" r="16" class="fg-dot-acc"/>
            <circle cx="210" cy="160" r="16" class="fg-dot-acc"/>
            <circle cx="285" cy="160" r="16" class="fg-dot-acc"/>
            <text x="165" y="196" text-anchor="middle" class="t-sm t-mut">filled = blinded</text>
          </svg>
      - kind: check
        page: 44
        quote: "Triple blinding –neither subject, observer or person analysing the data have any information about allocation of the subject"
        question: "In an antiemetic trial, the patients, the nurses counting vomiting episodes and the statistician only see packs coded X and Y. What type of blinding is this?"
        options: ["Single blind", "Double blind", "Triple blind", "Open label"]
        answer: 2
        why:
          - "الـ single بيعمّي الـ subject بس."
          - "الـ double: subject و observer، بس الـ analyst عارف."
          - "صح: الـ subject والـ observer واللي بيحلل الداتا، التلاتة."
          - "الـ open label يعني مفيش أي محاولة blinding."
      - kind: reveal
        page: 43
        quote: "Blinding overcomes ascertainment bias"
        prompt: "يعني إيه **ascertainment bias** بكلامنا؟"
        answer: |
          إن طريقة **التأكد من الـ outcome** تختلف بين المجموعتين لأن اللي بيقيس عارف مين خد إيه.

          مثال: الطبيب اللي عارف إن العيان على الدوا الجديد يسأله «الصداع بقى أحسن صح؟»، والتاني يسأله «لسه عندك صداع؟». نفس العيان، إجابتين مختلفتين. الـ blinding بيقفل الباب ده.
      - kind: aside
        tone: joke
        page: 44
        quote: "Unblinded or open label studies – no attempt at blinding"
        text: |
          ==Open label== = **no attempt at blinding**: الكل عارف كل حاجة. زي فرح في حارة مصرية: مفيش سر، والعروسة لسه في الكوافير والجيران عارفين الشبكة بكام. 😄

          ده مقبول في phase I، بس في phase III لازم **double blind**.
      - kind: try
        items: [res.L06.062, res.L06.065, res.L06.063]
    recap:
      - "الـ blinding بيحافظ على مكاسب الـ randomization: بيمنع biased assessment of outcomes (measurement bias)."
      - "Randomization ← confounding bias. Concealment ← selection bias. Blinding ← measurement bias."
      - "المستويات: patients، caregivers، outcome collectors، data analyst. وبيتغلب على ascertainment bias."
      - "Single: subject. Double: + observer. Triple: + data analyst. Open label: مفيش blinding."
    practice: [res.L06.061, res.L06.062, res.L06.063, res.L06.064, res.L06.065, res.L06.066, res.L06.067]
  # ------------------------------------------------------------------
  - id: res.L06.lesson6
    title: "خطوات الـ RCT: من الفكرة للتحليل"
    hook: "12 خطوة. أول واحدة فيهم: «هو أنا محتاج أعمل التجربة دي أصلًا؟»"
    minutes: 10
    pages: [46, 56]
    topics: [planning]
    goals:
      - "ترتّب الـ 12 خطوة"
      - "تعرف أنواع الـ outcomes وصفات أحسنها"
      - "تفرّق inclusion و exclusion criteria والـ target population"
    status: unverified
    steps:
      - kind: explain
        page: 46
        quote: "Steps in Planning, Designing and Conduct of a Randomized Controlled Clinical trial"
        title: "الخريطة: 12 خطوة"
        text: |
          ==Steps in planning, designing and conduct of an RCT==:

          - **1** Deciding: محتاجين trial؟ ينفع؟ نقدر؟
          - **2** Hypothesis
          - **3** Inclusion and exclusion criteria
          - **4** Defining the populations
          - **5** Sample size
          - **6** Measurement protocols
          - **7** Enrolling the participants
          - **8** Randomization
          - **9** Intervention and placebo control
          - **10** Blinding
          - **11** Follow up and assessment
          - **12** Statistical analysis
      - kind: figure
        page: 47
        quote: "Step 8 – Randomization Step 9 - Introduce the Intervention and Placebo Control Modalities"
        title: "سلّم الـ RCT"
        alt: "A staircase of three landings. Plan: steps 1 to 6, from deciding whether a trial is needed to measurement protocols. Run: steps 7 to 10, enrolling, randomization, intervention and placebo, blinding. Finish: steps 11 and 12, follow-up and statistical analysis."
        caption: "قسّمها 3 حتت: **تخطيط** (1–6)، **تنفيذ** (7–10)، **نهاية** (11–12). الـ randomization بييجي **بعد** الـ enrolment، مش قبله."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="170" width="140" height="70" rx="6" class="fg-thin"/>
            <text x="80" y="192" text-anchor="middle" class="t-b">Plan 1-6</text>
            <text x="80" y="210" text-anchor="middle" class="t-sm">need, hypothesis, criteria,</text>
            <text x="80" y="226" text-anchor="middle" class="t-sm">population, size, protocols</text>
            <rect x="95" y="95" width="140" height="70" rx="6" class="fg-acc"/>
            <text x="165" y="117" text-anchor="middle" class="t-b">Run 7-10</text>
            <text x="165" y="135" text-anchor="middle" class="t-sm">enrol, randomize,</text>
            <text x="165" y="151" text-anchor="middle" class="t-sm">intervention, blinding</text>
            <rect x="180" y="20" width="140" height="70" rx="6" class="fg-good"/>
            <text x="250" y="42" text-anchor="middle" class="t-b">Finish 11-12</text>
            <text x="250" y="60" text-anchor="middle" class="t-sm">follow up,</text>
            <text x="250" y="76" text-anchor="middle" class="t-sm">statistical analysis</text>
          </svg>
      - kind: order
        page: 46
        quote: "Step 1 - Deciding - Is clinical trial really required? Should it be done? Can it be done?"
        prompt: "رتّب أول 7 خطوات:"
        steps:
          - "Is a trial really required?"
          - "State the research hypothesis"
          - "Inclusion and exclusion criteria"
          - "Define the populations"
          - "Sample size calculation"
          - "Measurement protocols"
          - "Enrol the participants"
      - kind: explain
        page: 48
        quote: "Firstly, a detailed review of literature should be undertaken"
        title: "Step 1: هو احنا محتاجين؟"
        text: |
          قبل ما تصرف فلوس وتعرّض ناس لدوا: ==detailed review of literature==.

          ويُفضّل كمان **meta-analysis** للـ published وحتى الـ **unpublished** papers، لأن ممكن تلاقي السؤال **اتجاوب خلاص**. مفيش داعي تعيد اختراع العجلة على حساب العيانين.
      - kind: explain
        page: 49
        quote: "We hypothesize that the 2-year mortality risk in patients receiving treatment A is 30% lower"
        title: "Step 2: الـ hypothesis والـ variables"
        text: |
          الـ hypothesis لازم تبقى **محددة**. مثال المحاضرة:

          «We hypothesize that the **2-year mortality risk** in patients receiving **treatment A** is **30% lower** than among those receiving **standard treatment**.»

          شايف؟ فيها الـ outcome، والمدة، والمقارنة، وحجم الفرق.

          وحدد كمان الـ variables: ==exposure variable==، **co-interventions**، **outcome variable**، و **confounding variables**.
      - kind: reveal
        page: 50
        quote: "In people who take long-haul flights does wearing graduated compression stockings prevent DVT?"
        prompt: "السؤال ده: «In people who take long-haul flights does wearing graduated compression stockings prevent DVT?» فكّكه: مين، إيه، قصاد إيه، والنتيجة؟"
        answer: |
          - **Population**: ناس راكبين **long-haul flights**.
          - **Intervention**: **graduated compression stockings**.
          - **Comparison**: من غير stockings.
          - **Outcome**: **DVT**.

          ده نفس الـ PICO اللي خدتها في محاضرة الـ research question. السؤال الواضح بيطلّع trial واضح.
      - kind: explain
        page: 51
        quote: "Disease aspect: Mortality or survival rate, lab tests, complications, major events, side effects"
        title: "الـ outcomes: 3 زوايا"
        text: |
          - ==Disease aspect==: mortality أو survival rate، lab tests، complications، major events، side effects.
          - ==Patient aspect==: health-related **quality of life**، symptoms، activities of daily life.
          - ==Economic aspect==: service utilization زي **length of hospital stay**.
      - kind: sort
        page: 51
        quote: "Health-related quality of life, symptoms, activities of daily life"
        prompt: "كل outcome تبع أنهي زاوية؟"
        bins: ["Disease", "Patient", "Economic"]
        cards:
          - { text: "28-day mortality", bin: 0 }
          - { text: "Serum creatinine", bin: 0 }
          - { text: "Variceal bleeding complication", bin: 0 }
          - { text: "Quality-of-life score", bin: 1 }
          - { text: "Can dress and bathe alone", bin: 1 }
          - { text: "Length of hospital stay", bin: 2 }
        why: "Disease: الموت، التحاليل، المضاعفات. Patient: إحساسه وحياته اليومية. Economic: استخدام الخدمة، زي عدد أيام المستشفى."
      - kind: explain
        page: 52
        quote: "The best outcome measures are: 1. Objective 2. Clinically relevant end points"
        title: "أحسن outcome يبقى إزاي؟"
        text: |
          - **Objective**
          - **Clinically relevant end points**: disease rates، death، recovery، complications
          - أو **hospital/ER use**
          - متقاس بـ **accuracy and precision**
          - و ==measured in the same manner in both groups==

          آخر نقطة دي أهم واحدة: لو مجموعة بتتقاس بجهاز والتانية بالعين، الفرق ممكن يبقى من القياس مش من الدوا.
      - kind: explain
        page: 53
        quote: "balance between picking the people who are most likely to benefit without sacrificing the generalizability of the study."
        title: "Step 3: الـ inclusion criteria"
        text: |
          الهدف: نلاقي الـ **sub-population** اللي الـ intervention **feasible** فيهم وهيعمل التأثير المطلوب.

          والاختيار ده ==balance==: تختار اللي **أغلب ظنك هيستفيدوا** من غير ما تضيّع الـ **generalizability**.

          الـ inclusion criteria بتحسّن 4 حاجات: **rate of the primary outcome**، الـ **expected efficacy**، الـ **generalizability**، والـ **recruitment, follow-up and compliance**.
      - kind: explain
        page: 54
        quote: "When the patient is unlikely to complete follow-up or adhere to the protocol."
        title: "الـ exclusion criteria"
        text: |
          بنستبعد لما:

          - العلاج **مش متوقع يشتغل**: المرض **too severe** أو **too mild**، أو العيان **جرّب العلاج وفشل** قبل كده.
          - فيه ==co-morbidities== هتبوّظ الـ intervention، أو قياس الـ outcome، أو مدة الـ follow-up (زي **terminal cancer**).
          - العيان **مش هيكمّل الـ follow-up** أو مش هيلتزم بالـ protocol.
          - أسباب عملية: **language/cognitive barriers**، أو **no phone at home**.
      - kind: check
        page: 54
        quote: "interfere with the intervention, or the measurement of the outcome, or the expected length of follow-up e.g., terminal cancer."
        question: "A 5-year statin trial excludes a man with terminal pancreatic cancer. Which exclusion reason fits best?"
        options:
          - "The disease studied is too mild"
          - "A co-morbidity would cut short the expected follow-up"
          - "He already failed the treatment"
          - "A language barrier"
        answer: 1
        why:
          - "الـ mild/severe عن المرض اللي بندرسه (الـ lipids)، مش الـ cancer."
          - "صح: الـ terminal cancer هو مثال المحاضرة نفسه لـ co-morbidity بتأثر على الـ follow-up."
          - "مفيش حاجة بتقول إنه خد statin قبل كده."
          - "مفيش مشكلة تواصل."
      - kind: aside
        tone: trap
        page: 55
        quote: "Pregnant women Children Individuals with co-morbidities The elderly Individuals with mental illness, including dementia"
        text: |
          نتيجة الـ exclusion دي إن فيه ناس **under-represented** في الـ trials: **pregnant women**، **children**، أصحاب الـ **co-morbidities**، **the elderly**، و **mental illness including dementia**.

          يعني بالظبط عيانين الباطنة اللي بتشوفهم في العنبر: الحاجّة اللي عندها 80 سنة وسكر وضغط وفشل كلوي. علشان كده لما تقرا trial اسأل: «هل العيان اللي قدامي شبه اللي في التجربة؟»
      - kind: explain
        page: 56
        quote: "The group of people to whom the study results may be applied or generalized"
        title: "Step 4: الـ populations"
        text: |
          الـ ==reference population== (اسمها كمان **universe** أو **target population**): الناس اللي ممكن **نطبّق أو نعمّم** عليهم نتايج الدراسة.

          والـ **study population** بتعتمد على **purpose of the trial**.
      - kind: try
        items: [res.L06.068, res.L06.069, res.L06.081]
    recap:
      - "12 خطوة: need، hypothesis، criteria، populations، sample size، protocols، enrol، randomize، intervention/placebo، blinding، follow-up، analysis."
      - "Step 1: literature review و meta-analysis (حتى الـ unpublished) يمكن السؤال اتجاوب."
      - "Hypothesis محددة: outcome، مدة، مقارنة، حجم فرق. والـ variables: exposure، co-interventions، outcome، confounders."
      - "Outcomes: disease، patient، economic. أحسنها objective، clinically relevant، ومتقاس بنفس الطريقة في المجموعتين."
