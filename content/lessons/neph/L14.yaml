        title: "سُمّية الـ cyclophosphamide بالأرقام"
        quote: "Standard-dose i.v. cyclophosphamide was shown to be less toxic than oral cyclophosphamide, but the dose and duration of oral treatment in these reports were substantially higher and longer than those currently recommended (Supplementary Table S1313. 148). The incidence of bladder toxicity is also felt to be lower with i.v. cyclophosphamide. Reduced-dose i.v. cyclophosphamide has the most favorable immediate toxicity profile among the 3 cyclophosphamide regimens.\nThe risk of future hematologic malignancy is related to total lifetime exposure (>36 g), as is myelofibrosis (>80 g). Total lifetime exposure plus age constitutes a significant risk factor for premature ovarian failure (>7.5-15 g/m² for young to older pediatric patients, respectively; 300 mg/kg for adults). Point 10.2.3.1.3: An MPAA-based regimen is the preferred initial therapy of e LN for patients at high risk of infertility, patients who have a moderate to h namide exposure."
