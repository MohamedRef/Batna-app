  - id: dm.L10.031
    kind: mcq
    topic: biphasic
    stem: A 70 kg man with type 2 DM, not controlled on once-daily insulin, is moved to premixed biphasic insulin twice daily. What is the starting plan?
    options:
      - 21 units a day; 14 before breakfast and 7 before dinner
      - 21 units a day; 7 before breakfast and 14 before dinner
      - 10 units at bedtime
      - 35 units a day split equally
      - 0.15 U/kg before each meal
    answer: 0
    why:
      - "Correct: 0.3 U/kg × 70 = 21 U; two-thirds (14) before breakfast, one-third (7) before dinner (p128)."
      - "The split is reversed."
      - "10 units at bedtime is the basal-only start (p127)."
      - "0.5 U/kg and an equal split are not the book's numbers."
      - "That is not a regimen in this lecture."
    src: { page: 128, quote: "Starting daily dose = 0.3 U/Kg body weight." }
    status: unverified
  - id: dm.L10.032
    kind: mcq
    topic: biphasic
    stem: A nurse who works rotating night shifts and often misses meals needs insulin intensification. Which regimen does the lecture favour?
    options:
      - Basal-bolus
      - Biphasic twice daily
      - Regular insulin before breakfast only
      - NPH twice daily with fixed meals
      - Basal only with no titration
    answer: 0
    why:
      - "Correct: basal-bolus may be needed for erratic mealtimes or variable shifts (p128)."
      - "Biphasic needs 3 meals a day and you cannot skip one (p128)."
      - "One breakfast dose does not cover variable meals."
      - "Fixed meals are what she cannot keep."
      - "Basal only without titration is not intensification."
    src: { page: 128, quote: "May be needed for those who have erratic mealtimes or work variable shifts." }
    status: unverified
