  # ---------- p6-7: erythropoietin and haemoglobin ----------
  - id: hem.L01.043
    kind: card
    topic: erythropoietin
    front: What primarily regulates the rate of erythropoiesis, and where is it made?
    back: The hormone erythropoietin, secreted by the kidneys.
    src: { page: 6, quote: "The rate of erythropoiesis is primarily regulated by the hormone erythropoietin which is secreted by the kidneys." }
    status: unverified
    tags: [high-yield]
  - id: hem.L01.044
    kind: cloze
    topic: erythropoietin
    text: "Erythropoietin production is stimulated by {{c1::renal hypoxia}}; it raises red cell production mainly by speeding the conversion of {{c2::CFU-E}} to {{c3::pronormoblasts}}."
    src: { page: 6, quote: "It increases red-cell production mainly by stimulating the rate of conversion of CFU-E to pronormoblasts." }
    status: unverified
    tags: [high-yield]
  - id: hem.L01.045
    kind: mcq
    topic: erythropoietin
    stem: A man on haemodialysis for end-stage renal disease has a normocytic anaemia with normal iron stores. Which lack best explains it, from this lecture?
    options:
      - Erythropoietin from the kidney
      - Thrombopoietin
      - G-CSF from stromal cells
      - Stem cell factor
      - IL-5
    answer: 0
    why:
      - "Correct: erythropoietin is secreted by the kidneys and is the main regulator of erythropoiesis (p6)."
      - TPO drives platelets, not red cells.
      - G-CSF drives neutrophils.
      - SCF acts on pluripotential cells and is not a kidney hormone.
      - IL-5 drives eosinophils.
    src: { page: 6, quote: "regulated by the hormone erythropoietin which is secreted by the kidneys" }
    status: unverified
  - id: hem.L01.046
    kind: card
    topic: erythropoietin
    front: What is the structure of a haemoglobin molecule (book figure, p7)?
    back: Four globin chains, each around a heme group; most adult haemoglobin has two alpha and two beta chains. Each heme is a porphyrin ring with an iron atom in the centre.
    src: { page: 7, quote: "A hemoglobin molecule is composed of four protein globin chains, each centered around a heme group." }
    status: unverified
  - id: hem.L01.047
    kind: cloze
    topic: erythropoietin
    text: "Each heme group is a {{c1::porphyrin}} ring with an {{c2::iron}} atom in the centre; most adult haemoglobin has two {{c3::alpha}} and two beta chains."
    src: { page: 7, quote: "Each heme group consists of a porphyrin ring with an iron atom in the center." }
    status: unverified
  # ---------- p7: megakaryocytopoiesis, extramedullary ----------
  - id: hem.L01.048
    kind: card
    topic: platelets
    front: Where are platelets released, and what happens to the megakaryocyte nucleus left behind?
    back: They form from the megakaryocyte cytoplasm and are discharged straight into the marrow sinusoids; the bare nucleus is phagocytosed by macrophages.
    src: { page: 7, quote: "The residual \"bare\" megakaryocyte nucleus is phagocytosed by macrophages." }
    status: unverified
  - id: hem.L01.049
    kind: card
    topic: extramedullary
    front: What is extramedullary haematopoiesis?
    back: In abnormal circumstances the spleen, liver and lymph nodes revert to producing immature blood cells.
    src: { page: 7, quote: "the spleen, liver and lymph nodes revert back to producing immature blood cells" }
    status: unverified
    tags: [high-yield]
  - id: hem.L01.050
    kind: card
    topic: extramedullary
    front: What physical sign often accompanies extramedullary haematopoiesis, and what does it suggest?
    back: Enlargement of the spleen and liver. It suggests that undifferentiated primitive blood cells sit there and can proliferate with the right stimulus.
    src: { page: 7, quote: "enlargement of the spleen and liver is frequently noted on physical examination" }
    status: unverified
  - id: hem.L01.051
    kind: enumerate
    topic: extramedullary
    prompt: Mention the conditions in which extramedullary haematopoiesis occurs.
    points:
      - "Dysfunctional marrow: myelofibrosis"
      - "Dysfunctional marrow: infiltration by malignant cells"
      - "Marrow unable to meet demand: severe haemolytic anaemias"
    pass: 3
    src: { page: 7, quote: "When the bone marrow becomes dysfunctional in cases such as: myelofibrosis, infiltration by malignant cells." }
    status: unverified
    tags: [high-yield]
  - id: hem.L01.052
    kind: mcq
    topic: extramedullary
    stem: A 9-year-old with severe haemolytic anaemia has a big liver and spleen. Which mechanism of extramedullary haematopoiesis does he show?
    options:
      - Marrow unable to meet the demand placed on it
      - Marrow replaced by fibrosis
      - Marrow infiltrated by malignant cells
      - Failure of B-cell maturation
      - Excess thrombopoietin
    answer: 0
    why:
      - "Correct: severe haemolytic anaemia is the book's example of a marrow that cannot meet demand (p7)."
      - Myelofibrosis is the dysfunctional-marrow mechanism, not this one.
      - Malignant infiltration is also a dysfunctional-marrow cause.
      - B-cell maturation has nothing to do with extramedullary red cell production.
      - The book does not list TPO excess as a cause.
    src: { page: 7, quote: "When the bone marrow is unable to meet the demands placed on it, as in severe hemolytic anemias." }
    status: unverified
  # ---------- p8: gene therapy ----------
  - id: hem.L01.053
    kind: enumerate
    topic: gene-therapy
    prompt: Mention the advantages of haematopoietic stem cells for gene therapy.
    points:
      - Self-renewal and multilineage differentiation, so one engineered cell gives long-term, widely distributed transgene production
      - Many inherited and acquired disorders disrupt HSCs and their descendants
      - Extensive clinical experience with bone marrow transplantation
      - Possible production of non-haematopoietic cells that home to the right sites
    pass: 3
    src: { page: 8, quote: "Extensive clinical experience with bone marrow transplantation" }
    status: unverified
    tags: [high-yield]
  - id: hem.L01.054
    kind: card
