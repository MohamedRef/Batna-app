  - id: dm.L05.lesson2
    title: "اقلع الشراب: الجزمة والجلد والشكل"
    hook: "نص التشخيص بيتعمل بعينك قبل ما تمسك أي أداة: الجزمة، الـ callus، شكل الصوابع، والرجل الحمرا السخنة."
    minutes: 9
    pages: [54, 56]
    topics: [inspection, deformity, ulcer-types]
    goals:
      - "تعرف مواصفات الجزمة المناسبة"
      - "تعرف ليه الـ callus خطر"
      - "تفرّق claw toe عن hammer toe، وتعرف الـ Charcot"
      - "تفرّق الـ neuropathic عن الـ ischemic ulcer"
    status: unverified
    steps:
      - kind: explain
        page: 54
        title: "ابدأ بالجزمة"
        quote: "Careful inspection of the feet in a well-lit room should always be performed after the patient has removed their shoes and socks."
        text: |
          الـ **inspection** في أوضة منورة، وبعد ما العيان **يقلع الجزمة والشراب**. وبص على الجزمة نفسها: مناسبة للرجل دي؟

          الجزمة الكويسة:
          - **Well-fitting** وليها **protective outsole**
          - بتاخد شكل الرجل
          - **Insole** يوزّع الـ ==plantar pressure== بالتساوي
          - **Shock-absorbing** وطرية، بس مش بتتزحلق
          - ==Wide toe box== (مقدمة واسعة)

          أما **tight forefoot** فبيضغط على الصوابع.
      - kind: explain
        page: 54
        title: "الجلد بيحكي"
        quote: "Skin discoloration or loss of hair growth may be the first signs of vascular insufficiency"
        text: |
          - **Skin status:** اللون، السُمك، الجفاف، الشقوق.
          - ممكن تكون ==أول علامة للـ vascular insufficiency==: **discoloration** أو **loss of hair**.
          - **Nails:** dystrophy، onychomycosis، paronychia، onycholysis.
          - **بين الصوابع:** fungal infection = جلد أبيض **macerated**.
          - **Gangrene** أو amputation قديمة.
      - kind: reveal
        page: 54
        quote: "Calluses: precursors to ulcers; increase the local pressure and, when combined with undetected repetitive injury, lead to local tissue injury"
        prompt: "الـ callus جلد ناشف سميك. إيه المشكلة فيه؟"
        answer: |
          الـ ==callus== **precursor to ulcers**: بيعلّي الضغط في المكان، ومع **repetitive injury** محدش حاسس بيها، بيحصل injury ثم inflammation ثم necrosis ثم **ulceration**.

          زي الحجر الصغير في الجزمة: إنت مش حاسس بيه، فبتفضل ماشي عليه لحد ما يعمل جرح.
      - kind: aside
        tone: exam
        page: 54
        quote: "Diabetic foot ulcers: precede >80% of diabetic amputations"
        text: "رقم مهم: الـ **foot ulcers** بتسبق **أكتر من 80%** من الـ diabetic amputations. يعني لو منعت القرحة، منعت أغلب البتر."
      - kind: explain
        page: 55
        title: "الصوابع بتتلوي ليه؟"
        quote: "upsetting the delicate balance between flexors and extensors of the toes."
        text: |
          الـ **motor neuropathy** بتضعف عضلات الرجل الصغيرة، فبيختل التوازن بين الـ ==flexors and extensors== بتاعة الصوابع. تشوف **muscle wasting** و **guttering between metatarsals**.

          النتيجة deformities بتعلّي الـ **plantar pressure**:
          - **Claw toe:** MTP hyperextension + PIP و DIP flexion
          - **Hammer toe:** MTP extension + PIP flexion بس
          - **Hallux valgus:** lateral angulation للـ 1st MTP
      - kind: figure
        page: 55
        quote: "Claw toe: MTP hyperextension with PIP & DIP flexion"
        title: "Claw toe قدام hammer toe"
        alt: "Two side-view stick drawings of a toe. Claw toe: the first joint (MTP) bends up and both the PIP and DIP joints bend down. Hammer toe: MTP bends up, PIP bends down, DIP stays straight. Red dots mark pressure points on the top of the bent joint and the tip."
        caption: "الفرق في **DIP**: الـ claw بيثني الاتنين (PIP و DIP)، والـ hammer بيثني الـ PIP بس. النقط الحمرا = أماكن الضغط والـ callus."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="22" class="t-b">Claw toe</text>
            <path d="M20 100 H90" class="fg-ink" stroke-width="6"/>
            <path d="M90 100 L130 65" class="fg-ink" stroke-width="6"/>
            <path d="M130 65 L160 100" class="fg-ink" stroke-width="6"/>
            <path d="M160 100 L165 125" class="fg-ink" stroke-width="6"/>
            <circle cx="90" cy="100" r="5" class="fg-dot-acc"/>
            <circle cx="130" cy="65" r="5" class="fg-dot-acc"/>
            <circle cx="160" cy="100" r="5" class="fg-dot-acc"/>
            <circle cx="130" cy="56" r="6" class="fg-dot-bad"/>
            <circle cx="168" cy="132" r="6" class="fg-dot-bad"/>
            <text x="70" y="122" class="t-sm">MTP ext</text>
            <text x="135" y="50" class="t-sm">PIP flex</text>
            <text x="180" y="110" class="t-sm">DIP flex</text>
            <text x="10" y="160" class="t-b">Hammer toe</text>
            <path d="M20 240 H90" class="fg-ink" stroke-width="6"/>
            <path d="M90 240 L130 205" class="fg-ink" stroke-width="6"/>
            <path d="M130 205 L160 240" class="fg-ink" stroke-width="6"/>
            <path d="M160 240 L195 240" class="fg-ink" stroke-width="6"/>
            <circle cx="90" cy="240" r="5" class="fg-dot-acc"/>
            <circle cx="130" cy="205" r="5" class="fg-dot-acc"/>
            <circle cx="160" cy="240" r="5" class="fg-dot-acc"/>
            <circle cx="130" cy="196" r="6" class="fg-dot-bad"/>
            <text x="135" y="190" class="t-sm">PIP flex</text>
            <text x="200" y="236" class="t-sm">DIP straight</text>
            <text x="230" y="70" class="t-sm t-bad">● pressure</text>
            <text x="230" y="88" class="t-sm t-bad">  → callus</text>
          </svg>
      - kind: order
        page: 55
        quote: "continued activity can cause the calluses to thicken, hemorrhage underneath, and eventually ulcerate."
        prompt: "رتّب إزاي الـ deformity بتعمل ulcer في رجل مش حاسة:"
        steps:
          - "Deformity: site of abnormally high pressure"
          - "Repetitive pressure: callus"
          - "No protective sensation: walking continues, callus thickens"
          - "Hemorrhage underneath"
          - "Ulcer"
        why: "الكتاب بيوصفها كده بالظبط: الضغط المتكرر بيعمل callus، والـ LOPS بيخلّي العيان يكمّل مشي، فالـ callus يتخن وينزف تحته وفي الآخر ==ulcerate==."
      - kind: explain
        page: 56
        title: "Charcot: رجل حمرا سخنة"
        quote: "In the acute phase of Charcot foot, it may present as Unilateral redness, swelling, deformity, and increased foot temperature."
        text: |
          الـ ==Charcot arthropathy== بتحصل في الرجل الـ **neuropathic**، وغالبًا في الـ **midfoot**. السبب: **repetitive trauma** لعضم ومفاصل مش حاسة.

          - **Acute phase:** **unilateral** redness, swelling, deformity, **increased temperature**
          - **Chronic phase:** الـ deformity هي الغالبة، وممكن تبقى **rocker bottom foot**
      - kind: aside
        tone: trap
        page: 56
        quote: "In the acute phase of Charcot foot, it may present as Unilateral redness, swelling, deformity, and increased foot temperature."
        text: "رجل واحدة **حمرا ومنفوخة وسخنة** في مريض neuropathy من غير جرح: فكّر في **acute Charcot** قبل ما تقول cellulitis أو DVT."
      - kind: table
        page: 55
        quote: "Punched out, black eschar"
        title: "Neuropathic قدام ischemic ulcer"
        columns: [Feature, Neuropathic, Ischemic]
        rows:
          - ["Site", "Plantar", "Plantar/dorsal toes, foot"]
          - ["Looks", "Callus around", "Punched out, eschar"]
          - ["Pain", "Mild, burning", "Severe, claudication"]
          - ["Callus", "+++", "–"]
          - ["Deformity", "+++", "–"]
          - ["Pulses", "Present", "Weak/absent"]
          - ["Temp", "Warm", "Cool"]
          - ["Skin", "No sensation", "Pallor, shiny"]
        hide: [[0, 1], [1, 2], [5, 1], [5, 2], [6, 1], [6, 2]]
      - kind: aside
        tone: tip
        page: 55
        quote: "Surrounding callus"
        text: "الـ **neuroischemic** = الاتنين: necrosis + callus، والـ pulses ضعيفة والرجل باردة، والألم dull. احفظ الاتنين التانيين والتالت هو مزيجهم."
      - kind: check
        page: 55
        quote: "Punched out, black eschar"
        question: "Painful punched-out black eschar on a toe tip, cool shiny foot, absent pulses, no callus. Type?"
        options: ["Ischemic", "Neuropathic", "Charcot", "Fungal"]
        answer: 0
        why:
          - "صح: punched out، eschar، ألم شديد، بارد، pulses غايبة."
          - "الـ neuropathic plantar ومعاه callus والرجل سخنة والـ pulses موجودة."
          - "الـ Charcot مفصل الـ midfoot، مش eschar في طرف الصباع."
          - "الـ fungal جلد أبيض macerated بين الصوابع."
      - kind: try
        items: [dm.L05.030, dm.L05.039, dm.L05.043, dm.L05.050, dm.L05.026]
    recap:
      - "افحص في نور، من غير جزمة ولا شراب، وبص على الجزمة نفسها."
      - "Discoloration أو hair loss = أول علامات الـ vascular insufficiency. الـ callus = precursor للـ ulcer."
      - "Ulcers بتسبق أكتر من 80% من الـ amputations."
      - "Claw = PIP + DIP flexion، hammer = PIP بس. Charcot = midfoot، acute: رجل واحدة حمرا سخنة."
      - "Neuropathic: plantar، callus، warm، pulses موجودة. Ischemic: punched out، eschar، cool، pulses غايبة."
    practice: [dm.L05.025, dm.L05.026, dm.L05.027, dm.L05.028, dm.L05.029, dm.L05.030, dm.L05.031, dm.L05.032, dm.L05.033, dm.L05.034, dm.L05.035, dm.L05.036, dm.L05.037, dm.L05.038, dm.L05.039, dm.L05.040, dm.L05.041, dm.L05.042, dm.L05.043, dm.L05.044, dm.L05.045, dm.L05.046, dm.L05.047, dm.L05.048, dm.L05.049, dm.L05.050, dm.L05.051, dm.L05.052, dm.L05.109]
