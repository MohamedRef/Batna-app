  # Split from lesson3 on 2026-11-13 (#828): drugs, nephrectomy and glomerular disease.
  - id: neph.L12.lesson7
    title: "العلاج بيأذي، والورم بيحرّك الـ glomerulus"
    hook: "الـ chemo بيعالج الورم ويضرب الـ tubules، والورم نفسه ممكن يعمل nephrotic syndrome من بعيد."
    minutes: 9
    pages: [418, 420]
    topics: [drugs, glomerular]
    goals:
      - "تعرف آليات الـ AKI من الـ chemo وليه بتعتمد على الجرعة"
      - "تفرّق بين الـ interferon والـ IL-2 في التوقيت والآلية"
      - "تعرف الـ paraneoplastic glomerular diseases وليه العلاج هو علاج الورم"
    status: unverified
    steps:
      - kind: explain
        page: 418
        title: "الـ chemo التقليدي: ليه dose and duration؟"
        quote: "Anticancer drugs are an important cause of AKI and other adverse kidney events AKI associated with conventional chemotherapeutic agents is caused primarily by acute tubular toxicity, acute tubulointerstitial nephritis (ATIN), and various glomerular injuries and is commonly dose and duration related."
        text: |
          الـ conventional chemo بيعمل AKI بتلات طرق: **acute tubular toxicity**، **acute tubulointerstitial nephritis (ATIN)**، و **glomerular injury**، وغالبًا ==dose and duration related==.

          ليه الجرعة والمدة؟ التفسير المقبول (مش في الكتاب): الـ tubule هو اللي بيشيل الدوا ويطلّعه، فخلاياه بتاخد أعلى تركيز في الجسم. كل ما الجرعة أكبر والمدة أطول، الأذى بيتراكم.

          - **Cisplatin:** الكتاب بيوصفه إنه **dose-limiting**: يعني الكلية هي اللي بتحدد إنت تقدر تدّي قد إيه، مش الورم.
          - **Ifosfamide:** **direct tubular epithelial cell damage**.

          والـ **immunotherapies** والـ **targeted therapies** الجديدة زوّدت الـ drug-induced AKI.
      - kind: explain
        page: 418
        title: "Interferon و IL-2: نفس العيلة، توقيت مختلف"
        quote: "Interferon therapy is used for some cancers but may be complicated by AKI and high-grade proteinuria from focal segmental glomerulosclerosis (FSGS) or minimal change disease (MCD), which develop after many weeks to months of drug exposure."
        text: |
          الأدوية اللي بتلعب في المناعة: **interferon**، **IL-2**، وأحدث منهم **immune checkpoint inhibitors (ICPIs)** و **CAR-T**.

          - **Interferon:** AKI + **high-grade proteinuria** من **FSGS** أو **MCD**، بعد ==weeks to months==.
          - **High-dose IL-2** (RCC، melanoma): **cytokine release syndrome** و **capillary leak**، فـ ==prerenal AKI== خلال **24-48 ساعة**.

          ليه الفرق في التوقيت؟ التفسير المقبول (مش في الكتاب): الـ IL-2 بيأثر على **الأوعية** على طول (السوايل بتهرب والضغط يقع)، فالكلية بتتأثر في ساعات. الـ interferon بيأذي الـ **podocytes** بالتدريج، والـ podocyte بياخد وقت لحد ما يبوّظ الفلتر ويسيب البروتين يعدي.
      - kind: match
        page: 418
        quote: "It is associated with a cytokine release syndrome (CRS) and capillary leak, causing a prerenal form of AKI that develops within 24 to 48 hours after starting treatment."
        prompt: "وصّل كل دوا بطريقة أذيته للكلية:"
        pairs:
          - ["Ifosfamide", "Direct tubular epithelial damage"]
          - ["Interferon", "FSGS or MCD after weeks to months"]
          - ["High-dose IL-2", "Capillary leak, prerenal AKI in 24-48 h"]
          - ["High-dose methotrexate", "Intratubular obstruction"]
        why: "الـ IL-2 بيعمل AKI بسرعة (أيام) لأنه hemodynamic، والـ interferon ببطء (أسابيع) لأنه glomerular. والـ methotrexate بيترسب جوه الـ tubules."
      - kind: check
        page: 418
        quote: "It is associated with a cytokine release syndrome (CRS) and capillary leak, causing a prerenal form of AKI that develops within 24 to 48 hours after starting treatment."
        question: "A man with metastatic melanoma gets high-dose IL-2. Thirty hours later he is hypotensive and oedematous with rising creatinine. Mechanism of his AKI?"
        options:
          - "Cytokine release and capillary leak causing prerenal AKI"
          - "FSGS from podocyte injury"
          - "Intratubular crystal obstruction"
          - "Direct tubular epithelial damage like ifosfamide"
        answer: 0
        why:
          - "صح: IL-2 + 24-48 ساعة + ضغط واطي = capillary leak، prerenal."
          - "ده الـ interferon، وبعد أسابيع لشهور."
          - "ده الـ methotrexate أو الـ acyclovir أو الـ uric acid."
          - "ده الـ ifosfamide، والصورة هنا hemodynamic."
      - kind: explain
        page: 418
        title: "قبل الـ nephrectomy"
        quote: "Preoperative screening using KDIGO CKD criteria (eGFR and albuminuria) is recommended for patients at risk for AKI"
        text: |
          قبل الـ **nephrectomy for RCC**: اعمل screening بالـ ==KDIGO CKD criteria== (**eGFR** و **albuminuria**) للي عندهم risk.

          وعشان تقلّل الـ post-nephrectomy AKI: وقّف الأدوية الـ nephrotoxic، واضمن **intraoperative kidney perfusion** كويس.

          ليه الاهتمام ده؟ التفسير المقبول (مش في الكتاب): لما تشيل كلية، الكلية التانية لازم تشيل الحمل كله لوحدها. لو كانت تعبانة من الأول (eGFR واطي أو albuminuria)، مش هتستحمل، وأي ضربة زيادة (دوا أو ضغط واطي في العملية) هتوقعها.
      - kind: explain
        page: 419
        title: "Paraneoplastic glomerular disease"
        quote: "Membranous nephropathy MN is the most common glomerular pathology described in patients with solid tumors The solid tumors most commonly associated with MN are lung and gastric cancers, followed by RCC, prostate cancer, and thymoma."
        text: |
          العلاج الأساسي = ==treat the underlying malignancy==.

          - الأشهر مع الـ **solid tumors**: **membranous nephropathy**.
          - أشهر أورام: **lung** و **gastric**، بعدهم RCC و prostate و thymoma. (ومعاهم colorectal، pancreatic، esophageal، hepatic.)
          - الـ **anti-PLA2R** بيبقى positive في **80%** من الـ primary membranous nephropathy (MN)، بس **مش موجود** في الـ MN بتاعة السرطان.
      - kind: explain
        page: 419
        title: "ليه نعالج الورم مش الكلية؟"
        quote: "Glomerular diseases are associated with many solid and hematologic malignancies. These glomerular lesions are thought to be paraneoplastic; however, in most cases, the exact pathogenesis is unclear."
        text: |
          الكتاب بيقول الـ lesions دي ==paraneoplastic==، والـ **exact pathogenesis is unclear**.

          التفسير المقبول (مش في الكتاب): الورم بيطلّع antigens أو مواد بتحرّك المناعة، وده بيوصل للـ glomerulus من بعيد. فطالما الورم موجود، المصدر شغال. شيل الورم أو عالجه، والمصدر يقف.

          وده بيوضح ليه الـ **anti-PLA2R** مهم: هو بيقولك إن الـ MN «primary» (المناعة ضد الـ podocyte نفسه). لما يطلع **negative** في عيان عنده MN، فكّر في سبب secondary، والسرطان على رأس القايمة.
      - kind: reveal
        page: 419
        quote: "Circulating autoantibodies to podocyte transmembrane glycoprotein M-type phospholipase A2 receptor (a marker for primary MN in up to 80% or more of cases) were not found in patients with cancer who had secondary MN."
        prompt: "راجل مدخن 65 سنة، nephrotic، الـ biopsy فيها MN، والـ anti-PLA2R negative. بتفكر في إيه؟"
        answer: "الـ anti-PLA2R negative بيبعدك عن الـ **primary MN**. في سنه وتدخينه دوّر على **lung cancer** الأول (وبعده gastric). وعلاج الـ MN هنا = علاج الورم."
      - kind: figure
