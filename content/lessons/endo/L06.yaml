  - id: endo.L06.lesson5
    title: "الـ TSH مش دايمًا بيقول الحقيقة: السكريننج والأنماط"
    hook: "مريضة اتعالجت من Graves'، الـ FT4 بقى طبيعي والـ TSH لسه صفر. نزوّد الجرعة؟"
    minutes: 8
    pages: [102, 103]
    topics: [screening, patterns]
    goals:
      - "تعرف ليه الـ TSH حساس وإمتى لوحده يضللك"
      - "تعرف ليه الـ screening بقى FT4 + TSH"
      - "تقرا الـ TFTs بالأنماط السبعة"
    status: unverified
    steps:
      - kind: reveal
        page: 102
        quote: "TSH has been recommended as a frontline screening test for thyroid dysfunction, as a modest changes in TH concentrations are associated with marked excursions in TSH."
        prompt: "ليه الـ thyroid-stimulating hormone (TSH) بقى الـ frontline screening test؟"
        answer: "عشان العلاقة log-linear: تغيير صغير في الـ TH بيعمل تغيير **كبير** في الـ TSH، فهو حساس جدًا. بس الحساسية دي هي نفسها اللي بتخلّيه يضحك عليك لو الـ axis نفسه مش سليم."
      - kind: explain
        remind: [endo.L06.012]
        page: 102
        quote: "Conditions in which measurement of TSH alone may be misleading.\nRecent treatment for thyrotoxicosis (TSH may remain suppressed even when TH concentrations have normalised)\nNon-thyroidal illness\nTSH assay interference\nCentral hypothyroidism (e.g. hypothalamic/pituitary disorders)\nTSH-secreting pituitary adenoma (thyrotropinoma/TSHoma)\nResistance to thyroid hormone (RTH)\nDisorders of thyroid hormone transport or metabolism"
        title: "إمتى الـ TSH لوحده يضللك"
        text: |
          - ==Recent treatment for thyrotoxicosis==: الـ thyroid-stimulating hormone (TSH) بيفضل suppressed أسابيع حتى بعد ما الهرمونات تتظبط.
          - **NTI**.
          - **TSH assay interference**.
          - **Central hypothyroidism** (hypothalamic/pituitary).
          - **TSH-secreting pituitary adenoma (TSHoma)**.
          - **Resistance to thyroid hormone**.
          - اضطرابات الـ TH transport أو metabolism.

          عشان كده الكتاب بيقول: الـ screening دلوقتي بـ ==free thyroxine (FT4) + TSH== مع بعض.
      - kind: check
        page: 102
        quote: "Conditions in which measurement of TSH alone may be misleading.\nRecent treatment for thyrotoxicosis (TSH may remain suppressed even when TH concentrations have normalised)\nNon-thyroidal illness\nTSH assay interference\nCentral hypothyroidism (e.g. hypothalamic/pituitary disorders)\nTSH-secreting pituitary adenoma (thyrotropinoma/TSHoma)\nResistance to thyroid hormone (RTH)\nDisorders of thyroid hormone transport or metabolism"
        question: "Six weeks after starting carbimazole for Graves', FT4 is normal but TSH is still <0.01. What does this mean?"
        options: ["TSH can stay suppressed after recent treatment; follow FT4", "She is still thyrotoxic; increase the dose", "She has central hypothyroidism", "Assay interference is certain"]
        answer: 0
        why:
          - "صح: الـ TSH بيتأخر بعد العلاج، فالـ FT4 هو اللي يمشّيك دلوقتي."
          - "الـ FT4 طبيعي، فزيادة الجرعة ممكن تعمل hypothyroidism."
          - "مفيش سبب للـ pituitary disease؛ ده تأخر متوقع."
          - "الـ interference مش أول تفسير، القصة كفاية."
      - kind: aside
        tone: analogy
        page: 102
        quote: "Some patients on thyroid hormone replacement therapy report ongoing symptoms despite optimal thyroid function tests; in these patients restoring euthyroidism in the HPTaxis does not equate with resolution of hypothyroidism in other target tissues & for these patients tissue markers of TH action are required."
        text: "الـ TSH زي ترموستات في الصالة: ممكن الصالة تبقى مظبوطة والأوضة التانية لسه ساقعة. عشان كده مريض على thyroxine بـ TFTs ممتازة وبرضه تعبان محتاج **tissue markers** of TH action."
      - kind: explain
        page: 103
        quote: "1. Clinical thyroid status\nThyroid function tests should only be requested when there are clinical features of thyroid problem."
        title: "أول اعتبار: اسأل ليه بتطلب التحليل"
        text: |
          الكتاب بيقول: اطلب الـ TFTs **بس لو فيه clinical features** لمشكلة في الغدة.

          ليه؟ لأن كل النتيجة بتتقرا على الصورة الإكلينيكية. لو طلبته لأي حد (مريض ICU، ست حامل، حد على أدوية)، هتلاقي أرقام غريبة كتير من غير مرض في الغدة، وهتعالج أرقام مش مرضى. يعني الـ «discordant with the clinical picture» محتاجة clinical picture من الأول.

          وبعدين اقرا النتيجة على **سبع أنماط** (الرسمة تحت)، وكل نمط ليه قايمة أسباب.
      - kind: figure
        page: 103
        quote: "When interpreting TFTs seven major patterns should be considered:"
        title: "خريطة الأنماط"
        alt: "A three by three grid with FT4/FT3 low, normal or high across, and TSH low, normal or high down. Each filled cell names the main causes: high hormones with low TSH is Graves and toxic nodules; normal hormones with low TSH is subclinical hyperthyroidism; low hormones with low or normal TSH is NTI or central; normal hormones with high TSH is subclinical hypothyroidism; low hormones with high TSH is primary hypothyroidism; high hormones with normal or high TSH is interference, TSHoma or RTH; all normal is euthyroid."
        caption: "السبع thyroid function test (TFT) patterns. الخانة اللي فيها free thyroxine (FT4) عالي + thyroid-stimulating hormone (TSH) مش واطي هي أكتر خانة فيها مطبات."
