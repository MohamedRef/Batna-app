      - kind: explain
        page: 209
        quote: "The ophylline is a nonselective phosphodiesterase inhibitor. Third-line bronchodilator in the management of stable COPD,( after inhaled β -agonists and anticholinergics.) Goal serum level in older adults of 8 to 12 mcg/mL."
        title: "الـ add-ons"
        text: |
          - **Theophylline**: nonselective phosphodiesterase (PDE) inhibitor، **third-line** بعد الـ β-agonists والـ anticholinergics. الـ level في الكبار ==8-12 mcg/mL==. ليه بنقيس الـ level؟ التفسير المقبول (مش في الكتاب): المسافة بين الجرعة اللي بتفيد والجرعة السامة صغيرة (arrhythmias، تشنجات)، والكبد في الكبير بيكسّره أبطأ، وأدوية كتير بتتداخل معاه.
          - **Roflumilast**: oral PDE-4 inhibitor مرة في اليوم.
          - **Azithromycin 250 mg** يوميًا: بيقلل الـ exacerbations. لمين؟ frequent exacerbators على triple therapy، من غير ضعف سمع أو resting tachycardia أو خطر corrected QT interval (QTc). المخاطر: resistance و hearing decrements.
          - **Mucolytics** (NAC): مش routine؛ بس لبلغم لزج مقاوم للعلاج.
      - kind: explain
        page: 209
        quote: "Macrolides Azithromycin(250 mg once daily) decrease the frequency of COPD exacerbations macrolide-resistant organisms and hearing decrements"
        title: "ليه شروط الـ azithromycin كتير كده؟"
        text: |
          الـ azithromycin **250 mg يوميًا** بيقلل الـ exacerbations، بس الكتاب بيحط له شروط، وكل شرط ليه سبب:

          - **Frequent exacerbators** و **maximized on triple therapy**: لأنه آخر درجة، والمخاطر ما تستاهلش في مريض لسه ما خدش البخاخات صح.
          - **مفيش hearing impairment**: عشان من مخاطره **hearing decrements**، والمسن اللي سمعه ضعيف أصلًا هيخسر الباقي.
          - **مفيش resting tachycardia ولا خطر QTc prolongation**: التفسير المقبول (مش في الكتاب): الـ macrolides بتطوّل الـ QT، وده ممكن يعمل arrhythmia خطيرة، خصوصًا مع أدوية تانية بتطوّله.
          - وكمان **macrolide-resistant organisms**: الاستعمال الطويل بيربّي بكتيريا مقاومة.
      - kind: check
        page: 209
        quote: "Macrolides Azithromycin(250 mg once daily) decrease the frequency of COPD exacerbations macrolide-resistant organisms and hearing decrements Considered maintenance therapy for frequent exacerbators who are maximized on triple-inhaler therapy and do not have a hearing impairment, resting tachycardia, or apparent risk of QTc prolongation."
        question: "Which patient should NOT get azithromycin maintenance?"
        options: ["A frequent exacerbator with prolonged QTc", "A frequent exacerbator on triple therapy with normal ECG and hearing", "One with 3 exacerbations a year on LABA + LAMA + ICS", "One whose hearing test is normal"]
        answer: 0
        why:
          - "صح: خطر الـ QTc prolongation بيمنعه."
          - "ده المرشح المثالي."
          - "ده بالظبط اللي الكتاب بيقصده."
          - "السمع الطبيعي شرط مش مانع."
      - kind: explain
        remind: [geri.L11.096]
        page: 209
        quote: "B} Nonpharmacologic Therapies\n  VaccinationInfluenzavaccination, Pneumococcal vaccination.\n  Smoking cessation.\n  Long-term oxygen therapy (LTOT).\n  Noninvasive positive pressure ventilation (NPPV) Continuous positive airway pressure (CPAP) Obstructive sleep apnea (OSA) comorbidity with COPD.\n  Pulmonary rehabilitation.\n  Surgical therapies lung volume reduction surgery (LVRS).\n  Palliativecare and hospice."
        title: "من غير أدوية"
        text: |
          - Vaccines: **influenza** و **pneumococcal**.
          - **Smoking cessation**.
          - **long-term oxygen therapy (LTOT)**.
          - **non-invasive positive pressure ventilation (NPPV)** أو **continuous positive airway pressure (CPAP)** (لو معاه obstructive sleep apnoea (OSA)).
          - ==Pulmonary rehabilitation==.
          - **lung volume reduction surgery (LVRS)** (lung volume reduction surgery).
          - **Palliative care** و hospice: وده بيوصلنا لآخر محاضرة في الـ course.

          ليه دول؟ كل واحدة بترجع لحاجة شفناها: الـ **vaccines** لأن 70% من الـ exacerbations infection، والـ **CPAP** للـ COPD-OSA overlap، والـ **rehabilitation** للـ deconditioning والـ sarcopenia. والتفسير المقبول (مش في الكتاب) للـ **LVRS**: بيشيل الحتة المتنفخة اللي مش بتشتغل، فالباقي ياخد مكانه والـ diaphragm يرجع لشكله.
      - kind: reveal
        page: 209
        quote: "Pulmonary rehabilitation."
        prompt: "الرئة ما اتغيرتش بعد الـ pulmonary rehabilitation، والـ FEV1 زي ما هو. ليه المريض بيمشي أكتر وبينهج أقل؟"
        answer: |
          التفسير المقبول (مش في الكتاب): المشكلة في الـ COPD مش في الرئة بس. الكتاب نفسه بيقول إن الـ **severe deconditioning** بيعمل **sarcopenia**.

          الـ rehabilitation بتدرّب العضلات تشتغل بأكسجين أقل وتطلّع lactate أقل، فالتنفس المطلوب لنفس المجهود بيقل. وبتعلّمه يتنفس ببطء فالهوا المحبوس يطلع. يعني بتصلّح كل حاجة حوالين الرئة.
