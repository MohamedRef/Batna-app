      - kind: explain
        page: 288
        title: "الـ inflammatory back pain والـ peripheral SpA"
        quote: "Age at onset < 45 yr, insidious onset, duration more than 3mths, pain at night, alternating buttock pains, morning stiffness more than 1/2hr, improves with exercise, no improvement with rest, improvement with NSAIDs."
        text: |
          **Inflammatory back pain (IBP)**: بداية ==قبل 45==، insidious، أكتر من 3 شهور، **وجع بالليل**، ==alternating buttock pain==، stiffness أكتر من نص ساعة، يتحسّن بالرياضة مش بالراحة، ويتحسّن بالـ non-steroidal anti-inflammatory drugs (NSAIDs).

          **Assessment of Spondyloarthritis International Society (ASAS) peripheral**: arthritis أو enthesitis أو dactylitis، و:
          - **1 أو أكتر** من: psoriasis، inflammatory bowel disease (IBD)، infection قبلها، HLA-B27، uveitis، sacroiliitis في الصورة
          - **أو 2 أو أكتر** من: arthritis، enthesitis، dactylitis، IBP زمان، family history.

          يعني كل بند في الـ IBP بيقول التهاب مش ميكانيك: بالليل، الصبح، يتحسّن بالحركة والـ NSAIDs ومش بالراحة. والتفسير المقبول (مش في الكتاب) للـ alternating buttock pain: الـ sacroiliac الاتنين ملتهبين، فالوجع بينقل من ناحية للتانية.
      - kind: check
        page: 288
        quote: "The sacroiliitis on imaging should show definite radiographic disease at grade 2 bilateral or grade 3 to 4 unilateral (according to modified NY criteria 1984); or there should be active (acute) inflammation of sacroiliac joints on MRI."
        question: "A 28-year-old with 6 months of inflammatory back pain: X-ray normal, MRI shows active sacroiliitis, and he has uveitis. ASAS axial?"
        options: ["Yes: imaging arm (MRI sacroiliitis + 1 feature)", "No: the X-ray is normal", "Only if HLA-B27 is positive", "No: needs 2 features with imaging"]
        answer: 0
        why:
          - "صح: active inflammation في الـ MRI تكفي للـ imaging arm، ومعاها feature واحد (uveitis، وكمان الـ IBP)."
          - "الـ ASAS بيقبل الـ MRI مكان الـ X-ray."
          - "الـ HLA-B27 للـ clinical arm بس."
          - "الـ imaging arm محتاج feature واحد بس."
      - kind: explain
        page: 289
        title: "نقيس الـ activity إزاي؟"
        quote: "The cutoffs selected for 'clinically important improvement' is a change of at least 1.1 units, and a change of at least 2.0 units for major improvement."
        text: |
          **Bath Ankylosing Spondylitis Disease Activity Index (BASDAI)**: الـ gold standard، سهل. عيوبه: expert-driven، فيه أسئلة مكررة، و**الـ fibromyalgia بتبوّظ نتيجته**.

          **Ankylosing Spondylitis Disease Activity Score (ASDAS)**: composite (back pain، patient global، peripheral pain، morning stiffness، و **C-reactive protein (CRP)**).
          - أقل من **1.3** inactive، لحد **2.1** moderate، لحد **3.5** high، أكتر = very high
          - تحسّن ==1.1== = clinically important، و ==2.0== = major

          عيوب الـ ASDAS: مش بيحسب الـ enthesitis والـ uveitis، ولا الـ function، ولا الـ MRI.

          ليه محتاجين رقم؟ علشان قرار الـ biologic (يكمّل ولا يتغيّر) بيتاخد على التغيّر في الـ ASDAS (1.1)، زي ما هتشوف في الـ algorithm.
      - kind: reveal
        page: 289
        quote: "Patients with isolated or concomitant fibromyalgia will have false results."
        prompt: "ليه الـ BASDAI بيكدب مع الـ fibromyalgia، والـ ASDAS أقل؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ **BASDAI** كله أسئلة العيان بيجاوبها عن نفسه (تعب، وجع، تيبّس). الـ **fibromyalgia** بتعمل وجع وتعب في كل حتة من غير التهاب، فالأرقام تعلى والمرض نفسه هادي.

          الـ **ASDAS** composite وفيه ==CRP==، وده رقم معمل مايتأثرش بالـ fibromyalgia، علشان كده بيتأثر أقل. بس الكتاب بيقولك عيوبه: مش بيحسب الـ **enthesitis** والـ **uveitis**، ولا الـ **function**، ولا الالتهاب اللي في الـ **MRI**.
      - kind: update
        page: 289
        quote: "Parameters Used for Calculation of the ASDAS:\n  1. Total back pain (BASDAI question 2)\n  2. Patient global assessment\n  3. Peripheral pain/swelling (BASDAI question 3)\n  4. Duration of morning stiffness (BASDAI question 6)\n  5. CRP in mg/L (or ESR)\nNeed for a Treat-to-Target Approach\n| ASDAS | Disease activity |\n|---|---|\n| <1.3 | Inactive disease |\n| 1.3 to <2.1 | Moderate disease activity |\n| 2.1 to 3.5 | High disease activity |\n| >3.5 | Very high disease activity |"
        text: "الـ ASAS سنة 2018 غيّرت اسم الخانة بين 1.3 و 2.1 لـ \"low disease activity\" بدل \"moderate\"، والأرقام زي ما هي. في الامتحان اكتب زي الكتاب."
        ref: "ASAS ASDAS cut-off update, Machado et al., Ann Rheum Dis 2018"
      - kind: case
