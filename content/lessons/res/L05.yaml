schema: batna.lesson/v1
lecture: res.L05
lessons:
  # ------------------------------------------------------------------
  - id: res.L05.lesson1
    title: "الـ case-control: نبدأ من العيان ونرجع لورا"
    hook: "عندك 100 عيان cancer larynx في المعهد. إزاي تعرف إن الكحول ليه دعوة من غير ما تستنى 20 سنة؟"
    minutes: 8
    pages: [4, 18]
    topics: [analytic, case-control]
    goals:
      - "تعرف إن الـ analytic مفتاحه الـ comparison group"
      - "تعرّف الـ case-control وتعرف اتجاهه backwards"
      - "ترتب خطواته وتعرف ليه الـ case definition مهم"
    status: unverified
    steps:
      - kind: explain
        page: 9
        quote: "The key feature of analytic epidemiology is a comparison group."
        title: "من الوصف للاختبار"
        text: |
          في المحاضرة اللي فاتت الـ descriptive كان بيوصف و**يقترح** hypotheses. دلوقتي الـ ==analytic== بيعمل حاجتين:

          - **Quantify** العلاقة بين الـ exposure والـ outcome.
          - **Test hypotheses** عن الـ causal relationships.

          والمفتاح اللي بيفرقه عن الـ descriptive: ==comparison group==.

          والنوعين الأشهر: **case-control** و **cohort**.
      - kind: table
        page: 6
        quote: "Test hypotheses"
        title: "Observational: مين بيعمل إيه؟"
        columns: ["Descriptive", "Analytic"]
        rows:
          - ["Natural history", "Test hypotheses"]
          - ["Allocation of resources", "Assess causation"]
          - ["Suggest hypotheses", "-"]
        hide: [[0, 1], [1, 1]]
      - kind: check
        page: 4
        quote: "Comparison Group?"
        question: "A comparison (control) group is lacking in:"
        options: ["Cross-sectional studies", "Case-control studies", "Cohort studies", "Randomized controlled trial"]
        answer: 0
        why:
          - "صح: المحاضرة حاطاه تحت **descriptive**، ومفيش comparison group."
          - "الـ **controls** هم الـ comparison group."
          - "الـ unexposed cohort هو الـ comparison group."
          - "الـ RCT ليه control arm دايمًا."
      - kind: explain
        page: 8
        quote: "Disease or other health-related event under study (Dependent variable)"
        title: "متغيرين بس"
        text: |
          - **Exposure** = ==independent variable== (السبب المحتمل).
          - **Outcome** = ==dependent variable== (المرض).

          الـ outcome «dependent» لأنه بيعتمد على الـ exposure. سهلة.
      - kind: explain
        page: 12
        quote: "The selection of individuals on the basis of whether they do (cases) or they do not (control) have a particular disease"
        title: "تعريف الـ case-control"
        text: |
          بنختار الناس على أساس ==المرض==:

          - **Cases**: عندهم المرض.
          - **Controls**: ماعندهمش المرض.

          وبعدين نقارن: كام في المية من كل مجموعة ==كان عنده exposure== في الماضي؟
      - kind: figure
        page: 13
        quote: "Backwards Directionality"
        title: "Backwards directionality"
        alt: "A time arrow runs left to right from exposure to outcome. Two boxes on the right, disease yes and disease no, each with an arrow pointing backwards to a question mark on the exposure side. Study begins in the present."
        caption: "الزمن ماشي من الـ exposure للمرض، بس الـ case-control **بيمشي عكسه**: يبدأ من المرض النهارده ويدوّر على الـ exposure في الماضي. من **effect to cause**."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R05a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
              <marker id="R05b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <text x="50" y="22" text-anchor="middle" class="t-b">Exposure</text>
            <text x="270" y="22" text-anchor="middle" class="t-b">Outcome</text>
            <path d="M20 40L310 40" class="fg-arrow-acc" marker-end="url(#R05a)"/>
            <text x="165" y="58" text-anchor="middle" class="t-sm t-mut">time →</text>
            <text x="50" y="112" text-anchor="middle" class="t-lg t-b">?</text>
            <rect x="222" y="88" width="96" height="40" rx="8" class="fg-bad"/>
            <text x="270" y="113" text-anchor="middle" class="t-b">Cases (yes)</text>
            <path d="M220 108L72 108" class="fg-arrow-bad" marker-end="url(#R05b)"/>
            <text x="50" y="172" text-anchor="middle" class="t-lg t-b">?</text>
            <rect x="222" y="148" width="96" height="40" rx="8" class="fg-good"/>
            <text x="270" y="173" text-anchor="middle" class="t-b">Controls (no)</text>
            <path d="M220 168L72 168" class="fg-arrow-bad" marker-end="url(#R05b)"/>
            <text x="50" y="222" text-anchor="middle" class="t-sm t-mut">past</text>
            <text x="270" y="222" text-anchor="middle" class="t-sm t-b">study begins here</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 13
        quote: "Backwards Directionality"
        text: |
          الـ case-control (**backwards directionality**) زي المحقق في فيلم عربي قديم: الجريمة حصلت خلاص (المرض)، وهو بيرجع **لورا** يسأل «كنت فين ليلة الحادثة؟» (الـ exposure).

          والـ cohort (هنشوفه بعدين) زي الكاميرا اللي بتسجّل من الأول وتستنى تشوف هيحصل إيه.
      - kind: order
        page: 14
        quote: "Case Control Study Steps"
        prompt: "رتّب خطوات الـ case-control study:"
        steps:
          - "Definition of cases"
          - "Selection of cases"
          - "Selection of controls"
          - "Ascertainment of exposure status"
          - "Analysis"
          - "Conclusion and interpretation"
        why: "تعرّف الـ case، تختارهم، تختار الـ controls، تعرف مين اتعرض، تحلل، وبعدين تفسّر."
      - kind: explain
        page: 16
        quote: "Ensures that all persons who are counted as cases actually have the same disease"
        title: "الـ case definition"
        text: |
          ==Case definition== = مجموعة **standard diagnostic criteria** لازم تتحقق علشان تعتبر حد case.

          ليه؟ علشان ==كل الـ cases عندهم نفس المرض فعلًا==.

          بتشمل clinical criteria (lab، symptoms، signs)، وأحيانًا قيود على **time, place, person**.

          مثال المحاضرة: hypertension in pregnancy حسب ACOG: diastolic ≥ 90 أو systolic ≥ 140 بعد 20 أسبوع، في ست كان ضغطها طبيعي، متسجل مرتين بينهم 4 ساعات.
      - kind: reveal
        page: 18
        quote: "Preferably new cases or incident cases"
        prompt: "تاخد cases جديدة (incident) ولا قديمة (prevalent)؟ وليه؟"
        answer: |
          المحاضرة: ==preferably new (incident) cases==، والـ prevalent ممكن تتاخد.

          السبب المنطقي (مش من نص المحاضرة): العيان القديم ممكن يكون غيّر عاداته بسبب المرض، أو ذاكرته عن الـ exposure بقت أضعف، والعيانين اللي ماتوا بدري مش هيبقوا موجودين أصلًا.
      - kind: check
        page: 15
        quote: "source of cases - hospital, general population"
        question: "Which statement about cases in a case-control study is correct?"
        options:
          - "Cases are chosen because they were exposed"
          - "Cases need a clear case definition and can come from hospitals or the general population"
          - "Only prevalent cases may be used"
          - "Cases are followed into the future to see who gets the disease"
        answer: 1
        why:
          - "الاختيار على أساس **المرض** مش الـ exposure. ده cohort."
          - "صح: case definition واضح، والمصدر hospital أو general population."
          - "الأفضل **incident** cases."
          - "ده cohort. الـ case-control بيرجع لورا."
      - kind: try
        items: [res.L05.004, res.L05.006, res.L05.007, res.L05.008, res.L05.009]
    recap:
      - "Analytic = **quantify + test hypotheses**، والمفتاح **comparison group**."
      - "Exposure = independent، outcome = dependent."
      - "Case-control: نختار على أساس **المرض** (cases vs controls) ونقارن الـ exposure في الماضي. **Backwards** (effect → cause)."
      - "الخطوات: define cases ← select cases ← select controls ← exposure ← analysis ← conclusion."
      - "Case definition موحّد، والأفضل **incident cases**."
    practice: [res.L05.001, res.L05.002, res.L05.003, res.L05.004, res.L05.005, res.L05.006, res.L05.007, res.L05.008, res.L05.009, res.L05.010, res.L05.011]

  # ------------------------------------------------------------------
  - id: res.L05.lesson2
    title: "الـ controls والـ confounding"
    hook: "القهوة بتعمل cancer pancreas؟ ولا السيجارة اللي في الإيد التانية هي اللي بتعملها؟"
    minutes: 8
    pages: [19, 28]
    topics: [controls]
    goals:
      - "تعرف الـ control المثالي"
      - "تشرح الـ confounding بمثالين ودور الـ matching"
      - "تقارن مصادر الـ controls وعدد الـ controls لكل case"
    status: unverified
    steps:
      - kind: explain
        page: 19
        quote: "Control must be Ideally matching with the cases by age, sex and other characteristics"
        title: "الـ control المثالي"
        text: |
          الـ control لازم يكون ==شبه الـ case في كل حاجة== (السن، النوع، وصفات تانية)، ==ما عدا المرض==.

          الفكرة: لو المجموعتين شبه بعض في كل حاجة، أي فرق في الـ exposure يبقى له معنى.
      - kind: explain
        page: 22
        quote: "factors other than the studied exposure that disturb the relation between the studied exposure and the disease"
        title: "الـ confounder: الطرف التالت"
        text: |
          ==Confounding factor== = عامل **غير** الـ exposure اللي بندرسه، بيلخبط العلاقة بين الـ exposure والمرض.

          علشان يبقى confounder لازم يكون:

          - مرتبط بالـ **exposure**،
          - وبيأثر لوحده على **المرض**.
      - kind: figure
        page: 25
        quote: "(Confounder}"
        title: "القهوة، السجاير، والـ pancreas"
        alt: "Triangle. Coffee (exposure) with a dashed arrow to pancreatic cancer (disease). Smoking (confounder) at the bottom, linked both ways to coffee and with a solid arrow to pancreatic cancer."
        caption: "شاربين القهوة بيدخنوا أكتر، والتدخين بيعمل pancreatic cancer. فالقهوة **شكلها** متهمة، والـ confounder هو اللي عمل كده."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R05c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
              <marker id="R05d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="8" y="14" width="110" height="48" rx="8" class="fg-acc"/>
            <text x="63" y="36" text-anchor="middle" class="t-b">Coffee</text>
            <text x="63" y="54" text-anchor="middle" class="t-sm t-mut">exposure</text>
            <rect x="200" y="14" width="122" height="48" rx="8" class="fg-ink"/>
            <text x="261" y="36" text-anchor="middle" class="t-b">Pancreatic ca</text>
            <text x="261" y="54" text-anchor="middle" class="t-sm t-mut">disease</text>
            <path d="M120 38L196 38" class="fg-thin" marker-end="url(#R05c)"/>
            <text x="158" y="30" text-anchor="middle" class="t-sm t-mut">?</text>
            <rect x="105" y="176" width="120" height="48" rx="8" class="fg-bad"/>
            <text x="165" y="198" text-anchor="middle" class="t-b t-bad">Smoking</text>
            <text x="165" y="216" text-anchor="middle" class="t-sm t-mut">confounder</text>
            <path d="M120 174L72 66" class="fg-arrow" marker-end="url(#R05c)"/>
            <path d="M72 66L120 174" class="fg-arrow" marker-end="url(#R05c)"/>
            <path d="M212 174L258 66" class="fg-arrow-bad" stroke-width="3" marker-end="url(#R05d)"/>
            <text x="60" y="130" class="t-sm">linked</text>
            <text x="250" y="130" class="t-sm t-bad">causes</text>
          </svg>
      - kind: explain
        page: 24
        quote: "If the average ages of the smoking and non-smoking groups are very different"
        title: "مثال تاني: السن"
        text: |
          في دراسة **smoking و lung cancer**: الـ lung cancer بيزيد مع السن.

          لو متوسط سن المدخنين أكبر بكتير من غير المدخنين، جزء من الفرق ممكن يكون من ==السن== مش من التدخين بس. هنا ==age is a confounder==.
      - kind: explain
        page: 21
        quote: "match upon a potential confounding variable in order to remove the confounding effect"
        title: "الحل: matching"
        text: |
          في الـ ==matched case-control== بنختار الـ controls على أساس صفات الـ case.

          ونعمل match على الـ ==potential confounding variable== علشان نشيل تأثيره. لو كل case عنده 60 سنة جاله control عنده 60 سنة، السن مايقدرش يعمل الفرق.
      - kind: check
        page: 21
        quote: "match upon a potential confounding variable in order to remove the confounding effect"
        question: "Why do we match controls to cases on age in a smoking-lung cancer study?"
        options:
          - "To increase the number of cases"
          - "To remove the confounding effect of age"
          - "To make the study prospective"
          - "To measure incidence directly"
        answer: 1
        why:
          - "الـ matching مش بيزود الـ cases."
          - "صح: السن مرتبط بالتدخين وبالمرض، فبنعمل match عليه علشان نشيل الـ confounding."
          - "الاتجاه لسه backwards؛ matching مش بيغيره."
          - "الـ case-control مايقدرش يحسب incidence مباشرة."
      - kind: table
        page: 26
        quote: "Selection of controls: Sources"
        title: "Sources of controls"
        columns: ["Source", "Plus", "Minus"]
        rows:
          - ["Hospital", "Easy, cooperative, accurate (less recall bias)", "Not typical; more risk factors"]
          - ["Population (registry)", "Most representative; healthy", "Time, money, energy"]
          - ["Neighbourhood / phone", "Similar residence", "Non-cooperation, security"]
          - ["Best friend / sibling", "Accessible, similar", "Overmatching"]
        hide: [[1, 1], [3, 2], [0, 2]]
      - kind: aside
        tone: joke
        page: 26
        quote: "Overmatching"
        text: |
          تجيب صاحبك الأنتيم control؟ هو بيقعد معاك على نفس القهوة، بيشرب نفس الشيشة، وبياكل من نفس عربية الفول 😅

          شبهك **أوي** لدرجة إنه بيشيل الفرق اللي إنت بتدوّر عليه. ده اسمه **overmatching**.
      - kind: check
        page: 26
        quote: "Most representative of the general population"
        question: "Which source gives the most representative controls?"
        options: ["Hospital controls", "Population-based (registry) controls", "Best-friend controls", "Sibling controls"]
        answer: 1
        why:
          - "عيانين المستشفى not typical وعندهم risk factors أكتر."
          - "صح: الـ population-based أكتر representative، بس مكلفين في الوقت والفلوس."
          - "الأصحاب = خطر **overmatching**."
          - "الإخوات = overmatching برضه."
      - kind: explain
        page: 27
        quote: "But if cases < 50 therefore 2,3 or 4 times the number of cases"
        title: "كام control؟ ونعرف الـ exposure إزاي؟"
        text: |
          - عادة عدد الـ controls ==equal== لعدد الـ cases.
          - بس لو الـ cases ==أقل من 50==، خد **2 أو 3 أو 4** controls لكل case.

          والـ **exposure** بنعرفه بـ: observation، interviews، questionnaire، أو examination of records.
      - kind: try
        items: [res.L05.012, res.L05.013, res.L05.014, res.L05.017, res.L05.019]
    recap:
      - "الـ control المثالي شبه الـ case في كل حاجة **ما عدا المرض**."
      - "**Confounder** = عامل مرتبط بالـ exposure وبيأثر على المرض لوحده (smoking في coffee/pancreas، age في smoking/lung cancer)."
      - "**Matching** على الـ confounder بيشيل تأثيره."
      - "Hospital controls سهلة بس not typical؛ population الأكتر representative؛ friends/siblings = **overmatching**."
      - "Controls = cases عادة، ولو cases < 50 خد **2–4** لكل case."
    practice: [res.L05.012, res.L05.013, res.L05.014, res.L05.015, res.L05.016, res.L05.017, res.L05.018, res.L05.019, res.L05.020]

  # ------------------------------------------------------------------
  - id: res.L05.lesson3
    title: "الـ odds ratio: ad على bc"
    hook: "رقم واحد بيقولك الكحول ليه علاقة بـ cancer larynx قد إيه. وهتحسبه في 10 ثواني."
    minutes: 9
    pages: [29, 37]
    topics: [odds-ratio, cc-merits]
    goals:
      - "تحسب الـ OR من أي 2×2 table"
      - "تفسّر OR = 1 و > 1 و < 1"
      - "تعرف مزايا وعيوب الـ case-control"
    status: unverified
    steps:
      - kind: explain
        page: 32
        quote: "ODDS: the probability of an event (exposure) occurring to the probability of the event not occurring"
        title: "يعني إيه odds؟"
        text: |
          ==Odds== = احتمال إن الحدث يحصل ÷ احتمال إنه **مايحصلش**.

          في الـ case-control الحدث هو ==الـ exposure==:

          - Odds في الـ **cases** = a/c
          - Odds في الـ **controls** = b/d
      - kind: table
        page: 31
        quote: "Tabulation and Analysis"
        title: "Tabulation and analysis: the case-control 2×2"
        columns: ["Exposure", "Disease: yes (cases)", "Disease: no (controls)"]
        rows:
          - ["Yes", "a", "b"]
          - ["No", "c", "d"]
          - ["Total", "a+c", "b+d"]
        hide: [[1, 1], [0, 2]]
      - kind: explain
        page: 32
        quote: "ODDS RATIO: ratio of the odds of exposure among the cases to the odds of exposure among the controls = ad/bc"
        title: "الـ odds ratio"
        text: |
          ==OR== = odds of exposure في الـ cases ÷ odds of exposure في الـ controls

          = (a/c) ÷ (b/d) = ==ad/bc==

          يعني اضرب **القطر** (a × d) وقسّم على **القطر التاني** (b × c).
      - kind: mnemonic
        page: 32
        quote: "ODDS RATIO: ratio of the odds of exposure among the cases to the odds of exposure among the controls = ad/bc"
        word: "CROSS"
        parts:
          - { key: "C", text: "Cases column first: a over c" }
          - { key: "R", text: "Ratio of the two odds" }
          - { key: "O", text: "One diagonal on top: a × d" }
          - { key: "S", text: "Second diagonal below: b × c" }
          - { key: "S", text: "So OR = ad/bc (cross-product ratio)" }
        hook: "الـ OR اسمه كمان **cross-product ratio**: اعمل **X** على الجدول."
      - kind: case
        page: 34
        quote: "Odds ratio = 160 x 110 = 4.89 90 x 40"
        stem: "Alcohol and laryngeal cancer. Cases: 160 drank, 40 did not. Controls: 90 drank, 110 did not."
        steps:
          - question: "What is the odds of alcohol among the cases?"
            options: ["160/200 = 0.8", "160/40 = 4", "160/90 = 1.78", "40/160 = 0.25"]
            answer: 1
            why: "Odds = a/c = 160/40 = **4**. الـ 0.8 دي proportion مش odds."
          - question: "What is the odds ratio?"
            options: ["1.78", "4.00", "4.89", "0.20"]
            answer: 2
            why: "OR = ad/bc = (160 × 110)/(90 × 40) = 17 600/3 600 = **4.89**."
          - question: "How do you read it?"
            options:
              - "The odds of alcohol consumption are 4.89 times greater among those with laryngeal cancer than among those without"
              - "The risk of laryngeal cancer is 4.89 times higher in drinkers"
            answer: 0
            why: "الـ case-control بيقارن **odds of exposure** بين العيانين والسليمين، ده تفسير المحاضرة. الـ «risk» بتاعة الـ cohort."
      - kind: table
        page: 33
        quote: "Interpretation of Odds Ratio"
        title: "Interpretation of the odds ratio"
        columns: ["OR", "Meaning"]
        rows:
          - ["= 1", "No association"]
          - ["> 1 (e.g. 3)", "Exposure 3× more likely in cases: risk factor"]
          - ["< 1", "Exposure less in cases: protective"]
        hide: [[0, 1], [2, 1]]
      - kind: check
        page: 35
        quote: "The table below summarizes the findings of a case-control study."
        question: "In a case-control study, risk factor present: 30 diseased, 20 non-diseased. Absent: 20 diseased, 30 non-diseased. OR = ?"
        options: ["0.44", "0.80", "1.50", "2.25"]
        answer: 3
        why:
          - "دي bc/ad، مقلوبة."
          - "مش نسبة من الجدول ده."
          - "دي 30/20، odds في الـ cases بس."
          - "صح: (30 × 30)/(20 × 20) = 900/400 = **2.25**."
      - kind: sort
        page: 36
        quote: "Advantages and disadvantages of case- control studies"
        prompt: "ميزة ولا عيب للـ case-control؟"
        bins: ["Advantage", "Disadvantage"]
        cards:
          - { text: "Cheap, easy and quick", bin: 0 }
          - { text: "Multiple exposures can be examined", bin: 0 }
          - { text: "Rare diseases, long latency", bin: 0 }
          - { text: "Suitable when randomization is unethical", bin: 0 }
          - { text: "Bias: selection, recall, misclassification", bin: 1 }
          - { text: "No direct incidence", bin: 1 }
          - { text: "Temporal relationship not clear", bin: 1 }
          - { text: "Multiple outcomes cannot be studied", bin: 1 }
          - { text: "RR and AR cannot be estimated", bin: 1 }
        why: "الـ case-control سريع ورخيص وممتاز للنادر وطويل الـ latency، وبيدرس exposures كتير. بس مايدّيش incidence ولا RR/AR، والتسلسل الزمني مش واضح، ومرض واحد بس، وفيه bias."
      - kind: aside
        tone: trap
        page: 36
        quote: "Multiple outcomes cannot be studied"
        text: |
          الفخ الكلاسيكي: **multiple exposures ✓** لكن **multiple outcomes ✗**.

          منطقي: إنت اخترت الـ cases على أساس **مرض واحد**، فمش هتقدر تدرس أمراض تانية. بس تقدر تسألهم عن كل الـ exposures اللي تخطر على بالك.
      - kind: check
        page: 36
        quote: "Multiple outcomes cannot be studied"
        question: "Which is INCORRECT about a case-control study?"
        options:
          - "Many risk factors can be studied at the same time"
          - "It proceeds from outcome to exposure"
          - "The temporal relationship is not known"
          - "Several possible outcomes can be studied"
        answer: 3
        why:
          - "صحيحة: multiple exposures."
          - "صحيحة: backwards."
          - "صحيحة: temporal relationship not clear."
          - "دي الغلط: **multiple outcomes cannot be studied**."
