  - id: hem.L07.lesson1
    title: "النخاع اتحتل: يعني إيه acute leukemia؟"
    hook: "خلية واحدة صغيرة نسيت تكبر، وقررت تتكاثر لحد ما تطرد الكل من البيت."
    minutes: 8
    pages: [104, 105]
    topics: [definition, etiology]
    goals:
      - "تعرّف الـ acute leukemia وتفهم ليه الـ counts بتقع"
      - "تعدّ الـ etiology الأربعة بأمثلتها"
      - "تعرف إيه اللي بيجمع الأسباب وليه بتعمل leukemia"
    status: unverified
    steps:
      - kind: explain
        page: 104
        title: "الخلية اللي رفضت تكبر"
        quote: "Acute leukemia is the result of a malignant events, occurring in an early hematpoietic precursor, instead of differentiating normally, the affected cell continue to proliferate in an uncontrolled fashion."
        text: |
          الـ **acute leukemia** بتبدأ بـ ==malignant event== في **early hematopoietic precursor**.

          الخلية دي المفروض تـ differentiate وتبقى red blood cell (RBC) أو neutrophil أو platelet. بدل كده بتفضل **تتكاثر من غير كنترول** وهي لسه صغيرة.

          النتيجة: خلايا immature اسمها ==blasts== بتتراكم بسرعة وتحتل النخاع، فإنتاج الـ red blood cells (RBCs) والـ white blood cells (WBCs) والـ platelets الطبيعي يقع.

          ليه ده بيعمل مرض بسرعة؟ لأن الـ blast **ما بتشتغلش**: مش بتشيل oxygen ولا بتحارب بكتيريا ولا بتسد جرح. فالنخاع مليان خلايا، والدم فاضي من الخلايا اللي بتشتغل. وعشان كده اسمها **acute**: من غير علاج بتموّت في أسابيع لشهور (التفسير المقبول، مش في الكتاب).
      - kind: figure
        page: 104
        quote: "As a result, immature cells often called blasts, rapidly accuumalate and replace the bone marrow leading to diminished production of normal red cells, white cells and platelets."
        title: "النخاع قبل وبعد"
        alt: "Two marrow panels stacked. The top panel shows a normal marrow with mixed red cells, neutrophils and platelets coming out. The bottom panel shows a marrow packed with blasts and only a few normal cells, with arrows to anemia, infection and bleeding."
        caption: "الـ blasts بتملا النخاع، فالمصنع الطبيعي يقفل: ==anemia== وinfection وbleeding."
        svg: |
          <svg viewBox="0 0 330 320" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L07a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
