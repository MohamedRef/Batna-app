      - kind: mnemonic
        page: 10
        quote: "Random plasma glucose: > 200 mg/dl. Or 2- Fasting plasma glucose: > 126 mg/dl. Or 3- 2h-PPPG: > 200 mg/dl"
        word: "126"
        parts:
          - { key: "1", text: "100 أول الـ IFG (صايم)" }
          - { key: "2", text: "200 للـ random وللـ 2-h (diabetes)" }
          - { key: "6", text: "6.5% للـ A1C (diabetes)، و 126 للـ fasting" }
        hook: "رقم **126** نفسه فيه كل حاجة: **1**00 بداية الخطر، **2**00 للـ random والـ 2-h، **6**.5 للـ A1C. والـ 140 = نص الطريق بين 100 و 200 تقريبًا، سهل تفتكره."
      - kind: explain
        page: 10
        title: "test واحد ولا اتنين؟"
        quote: "In the absence of unequivocal hyperglycemia, diagnosis requires two abnormal test results obtained at the same time or at two different time points."
        text: |
          - **Classical symptoms + test واحد positive** = diabetes.
          - **من غير unequivocal hyperglycemia:** لازم ==two abnormal results==، من نفس العينة أو في وقتين مختلفين، بنفس الـ test أو test تاني، ويتعمل **promptly**.
      - kind: check
        page: 10
        quote: "In the absence of unequivocal hyperglycemia, diagnosis requires two abnormal test results obtained at the same time or at two different time points."
        question: "Asymptomatic man, FPG 131 mg/dl once. Next?"
        options:
          - "Repeat FPG or another test promptly"
          - "Diagnose diabetes now"
          - "Label as IFG"
          - "Check urine glucose"
        answer: 0
        why:
          - "صح: من غير أعراض لازم **two abnormal results**."
          - "test واحد يكفي بس مع classic symptoms."
          - "131 أعلى من الـ IFG range (100–125)."
          - "الـ glycosuria **not a diagnostic tool**."
      - kind: explain
        page: 11
        title: "الـ A1C: مريح بس مش مثالي"
        quote: "A1C may not be a suitable diagnostic test in people with anemia, people treated with erythropoietin, or people undergoing hemodialysis or HIV treatment"
        text: |
          الـ **A1C** = جلوكوز لازق في الـ hemoglobin على عمر كرة الدم (**120 يوم**).

          **مميزاته:** مفيش صيام، وتغيير يومي أقل مع الـ stress والأكل والمرض.

          **عيوبه:** لازم method **standardized**، **sensitivity** أقل، أغلى، محدود في **GDM** و type 1 المفاجئ، و ==not suitable== في **anemia، erythropoietin، hemodialysis، HIV treatment**، و **Hb variants** (sickle cell trait).
      - kind: reveal
        page: 11
        quote: "A1C may not be a suitable diagnostic test in people with anemia, people treated with erythropoietin, or people undergoing hemodialysis or HIV treatment"
        prompt: "إيه اللي بيجمع الـ anemia والـ erythropoietin والـ hemodialysis؟"
        answer: |
          كلهم بيغيّروا **عمر كرات الدم الحمرا**. الـ A1C بيفترض إن الكرة عاشت حوالي **120 يوم** وهي بتشرب سكر.

          لو الكرات **جديدة** (EPO، نزيف، hemolysis) ← وقت أقل ← A1C **falsely low**. ولو الـ Hb نفسه شكله مختلف (sickle trait) ← الجهاز يقرأ غلط. (تفسير فسيولوجي؛ القائمة من الكتاب.)
      - kind: explain
        page: 11
        title: "قواعد الـ A1C"
        quote: "In cases of discrepancies between A1C and glycemia, plasma glucose criteria should be used to diagnose diabetes"
        text: |
          - **≥6.5%** = diabetes، **≥5.7%** = prediabetes.
          - الـ A1C ==لوحده== مش دقيق للتشخيص.
          - لو الـ A1C والسكر **مختلفين** ← ==plasma glucose criteria== هي اللي بتحكم.
          - استخدامه الأشهر: يعرّفك الـ hyperglycemia **من إمتى** (chronicity)، و **متابعة** الـ control على المدى الطويل.
      - kind: update
        page: 11
        quote: "A1C > 6.5%: Diabetes diagnosis, A1C > 5.7%: prediabetes diagnosis."
        text: "الـ ADA بيكتب الحدود **≥6.5%** و prediabetes **5.7–6.4%**. الكتاب كاتب «>»، والرقمين نفسهم. في الامتحان اكتب الأرقام زي الكتاب."
        ref: "ADA Standards of Care in Diabetes 2025, section 2"
