  - id: neph.L07.lesson3
    title: "علاج الـ ADPKD: من الـ cipro لحد الـ tolvaptan"
    hook: "تلات لترات ميه في اليوم، ACE inhibitor، وأحيانًا دوا بيخليك تجري على الحمام. ده علاج ADPKD."
    minutes: 10
    pages: [157, 164]
    topics: [adpkd-tx, adpkd-ckd, adpkd-novel, adpkd-tx-ttx]
    goals:
      - "تعالج الألم والنزيف والـ cyst infection والـ stones صح"
      - "تعرف الـ BP target والميه والـ dialysis والـ PLD والـ aneurysm"
      - "تعرف الـ tolvaptan والـ somatostatin analogues والـ mTOR والـ transplant"
    status: unverified
    steps:
      - kind: order
        page: 157
        quote: "Causes of flank pain that may require intervention, such as infection, stone, and tumor, should be excluded."
        prompt: "رتّب علاج الـ flank pain المزمن:"
        steps:
          - "Exclude infection, stone, tumor"
          - "Simple analgesia, reassurance, tricyclics"
          - "Splanchnic nerve block"
          - "Cyst aspiration + sclerosant"
          - "Laparoscopic or surgical fenestration"
        why: "استبعد الأسباب اللي محتاجة تدخّل الأول، وبعدين اطلع درجة درجة. وابعد عن الـ **NSAIDs** والـ combination analgesics على المدى الطويل (nephrotoxic)."
      - kind: explain
        page: 158
        title: "النزيف والـ infection"
        quote: "Therapeutic agents of choice include trimethoprim-sulfamethoxazole and fluoroquinolones"
        text: |
          **Cyst hemorrhage**: بيخلص لوحده: **bed rest، analgesics، ميه كتير** علشان الـ clots ما تسدّش. الشديد: transfusion، tranexamic acid، **segmental embolization**، وآخر حل جراحة.

          **Cyst infection**: عالج الـ cystitis والـ asymptomatic bacteriuria بسرعة. المضاد لازم يدخل الكيس: ==TMP-SMX أو fluoroquinolones== (lipophilic).

          لسه سخن بعد **1–2 أسبوع**؟ **Drainage**. ولو رجعت الحرارة بعد ما وقفت: دوّر على obstruction أو perinephric abscess أو stone.
      - kind: aside
        tone: analogy
        page: 158
        quote: "Lipophilic agents have been shown to penetrate cysts reliably"
        text: "الكيس زي أوضة مقفولة بشباك دهني. الـ **gentamicin** (مش lipophilic) بيخبط على الشباك ومش بيدخل، والـ **cipro و TMP-SMX** (lipophilic) بيعدّوا من الشباك ويوصلوا للميكروب."
      - kind: explain
        page: 159
        title: "الـ stones والضغط"
        quote: "a rigorous BP target (95 to 110/60 to 75 mm Hg) in young patients with ADPKD with normal renal function"
        text: |
          **Stones**: نفس العلاج العادي. الـ ==potassium citrate== هو الأساس في التلات: **uric acid**، **hypocitraturic Ca oxalate**، و **distal acidification defects**. الـ ESWL و PCNL نجاحهم **82% و 80%**.

          **Hypertension**: لازم يتظبط. الـ **ACEI أو ARB** الأول (بيزوّدوا renal blood flow و renoprotective). والـ **HALT PKD** بيقول target ==95–110/60–75== للشباب اللي كليتهم كويسة.
      - kind: explain
        page: 160
        title: "ميه، dialysis، وكبد"
        quote: "supplemental water sufficient to achieve a urinary osmolality below 250 mOsm/kg H₂O (~3 liters in most patients)"
        text: |
          - **ميه**: لو eGFR فوق 30، اشرب لحد ما الـ urine osm تبقى ==أقل من 250== (حوالي **3 لتر**)؛ الميه بتطفي الـ vasopressin. مفيش RCT.
          - **Dialysis**: عيانين ADPKD **أحسن** من غيرهم (EPO أعلى، Hb أحسن). الـ **PD** ينفع بس خد بالك من الـ **hernias**.
          - **PLD**: غالبًا مش محتاج علاج. قلل الكحول والـ hepatotoxins و **الكافيين** (cAMP agonist). H2 blockers و somatostatin. الـ estrogen ممنوع **بس** لو الكبد كبير جدًا. Invasive: aspiration و sclerosis أو fenestration.
      - kind: table
        page: 161
        quote: "Ruptured or symptomatic intracranial aneurysm requires surgical clip- ping of the neck of the aneurysm."
        title: "الـ aneurysm: نعمل إيه؟"
        columns: [Aneurysm, Plan]
        rows:
          - ["Ruptured or symptomatic", "Surgical clipping"]
          - ["<5 mm, asymptomatic", "MRA at 6 months, then yearly"]
          - ["6–9 mm", "Controversial"]
          - ["≥10 mm", "Surgery usually"]
          - ["High surgical risk", "Endovascular coils"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: explain
        page: 162
        title: "الـ tolvaptan: اقفل الـ V2"
        quote: "tolvaptan administered over 3 years slowed the increase in kidney volume and decline in kidney function"
        text: |
          الـ vasopressin على **V2** بيرفع الـ cAMP في الـ collecting duct (مكان الأكياس). الـ ==tolvaptan== بيقفل الـ V2.

          - **TEMPO** (CrCl فوق 60، 3 سنين): بطّأ نمو الكلية والتدهور، وقلل الألم والـ hematuria والـ UTI.
          - **REPRISE** (eGFR 25–65): eGFR نزل أبطأ في سنة.
          - العيوب: **aquaresis** (polyuria، عطش، nocturia) خلّت **8.3%** يوقفوا، و ==liver enzymes فوق 2.5× في 4.9%==، والـ Na والـ uric acid يعلوا شوية.
      - kind: update
        page: 162
        quote: "tolvaptan is approved for the treatment of rapidly progressive ADPKD in Japan, Canada, the European Union"
        text: "الكتاب بيقول الـ tolvaptan **مش معتمد في أمريكا**. الـ FDA وافقت عليه (Jynarque) في **أبريل 2018** للكبار اللي عندهم ADPKD سريع، مع متابعة الكبد. في امتحان القسم اكتب كلام الكتاب."
        ref: "FDA approval of Jynarque (tolvaptan), 2018"
      - kind: explain
        page: 163
        title: "باقي الأدوية"
        quote: "two large randomized trials using everolimus and sirolimus for 18 to 24 months have shown no benefit"
        text: |
          - **Somatostatin analogues** (octreotide، lanreotide، pasireotide): الـ somatostatin نفسه عمره **3 دقايق**. نمو الكلية يقف **أول سنة** وبعدين يرجع، والكبد يصغر **4–6%**.
          - ==mTOR inhibitors== (everolimus، sirolimus): نفعت في الفيران، و **فشلت** في تجربتين كبار على البني آدمين.
          - **Pravastatin**: بطّأ النمو في الأطفال والشباب. **Bosutinib**: قلل النمو بس الوظيفة اتجهت للأسوأ.
      - kind: explain
        page: 164
        title: "الزرع"
        quote: "Transplantation is the treatment of choice for ESRD in patients with ADPKD."
        text: |
          الـ ==transplantation== هو العلاج المفضل للـ ESRD، ونتايجه زي غيره. المضاعفات مش أكتر.

          الـ **pretransplant nephrectomy** الروتيني خلاص. نشيلها لو: **infected cysts، نزيف متكرر، ضغط شديد، أو كلية ضخمة نازلة للـ pelvis**. بعد الزرع الكلى القديمة **تصغر 38–41%** والكبد **يكبر** 9–21%، ومفيش زيادة في الـ RCC.
      - kind: case
        page: 158
        quote: "If fever persists after 1 to 2 weeks of appropriate antimicrobial therapy, infected cysts should be drained percutaneously or surgically."
        stem: "ADPKD, 45-year-old woman: fever 39 °C and right loin pain; CT shows a complicated cyst."
        steps:
          - question: "Antibiotic?"
            options: ["Ciprofloxacin or TMP-SMX", "Gentamicin", "Nitrofurantoin", "Amoxicillin"]
            answer: 0
            why: "**Lipophilic** بيدخل الكيس."
          - reveal: "Still febrile after 2 weeks of the right drug."
            question: "Next?"
            options: ["Drain the infected cyst", "Add steroids", "Stop antibiotics", "Tolvaptan"]
            answer: 0
            why: "حرارة مستمرة بعد 1–2 أسبوع: **drainage** (ولو كلية end-stage فكر في nephrectomy)."
      - kind: check
        page: 162
        quote: "clinically significant increases in liver enzymes (>2.5 times the upper limit of normal) were seen in 4.9% of tolvaptan-treated"
        question: "Your patient on tolvaptan complains of thirst and nocturia. Which test must you also follow?"
        options:
          - "Liver enzymes"
          - "Serum potassium"
          - "Thyroid function"
          - "Creatine kinase"
        answer: 0
