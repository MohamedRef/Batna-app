- id: hb.L18.092
  kind: mcq
  topic: labs
  stem: A 50-year-old woman with HCV cirrhosis has a 3 cm arterial-enhancing liver lesion with portal venous washout
    on triphasic CT. Her AFP is 6 ng/mL (normal). What is the best interpretation?
  options:
  - Normal AFP excludes HCC
  - The imaging is diagnostic of HCC
