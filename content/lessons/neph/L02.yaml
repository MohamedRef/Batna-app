            <text x="65" y="108" text-anchor="middle" class="t-sm t-mut">↓ resistance</text>
            <text x="267" y="62" text-anchor="middle" class="t-sm t-mut">↑ resistance</text>
            <rect x="40" y="140" width="250" height="28" rx="8" class="fg-box"/>
            <text x="165" y="159" text-anchor="middle" class="t-sm">↑ single-nephron GFR</text>
            <line x1="165" y1="168" x2="165" y2="186" class="fg-arrow-bad" marker-end="url(#N2b)"/>
            <rect x="40" y="188" width="250" height="28" rx="8" class="fg-box"/>
            <text x="165" y="207" text-anchor="middle" class="t-sm">Proteinuria + RAAS + angiotensin II</text>
            <line x1="165" y1="216" x2="165" y2="234" class="fg-arrow-bad" marker-end="url(#N2b)"/>
            <rect x="40" y="236" width="250" height="28" rx="8" class="fg-bad"/>
            <text x="165" y="255" text-anchor="middle" class="t-sm">Fibrosis → fewer nephrons</text>
            <path d="M290 250 Q320 200 290 154" class="fg-arrow-acc" fill="none" marker-end="url(#N2a)"/>
            <text x="165" y="290" text-anchor="middle" class="t-sm t-mut">once half are lost, CKD progresses whatever the cause</text>
          </svg>
      - kind: explain
        page: 24
        quote: "Causes of Renal Hyperfiltration"
        title: "ليه الـ nephron الباقي بيشتغل زيادة؟"
        text: |
          الكتاب بيقول إن الـ **single-nephron hyperfiltration** هو رد فعل adaptive لما عدد الـ nephrons يقل. وبيعدّ الأسباب: sympathetic activity، **RAAS**، hyperglycaemia و insulin resistance، obesity، autoimmune activation، impaired glomerular haemodynamics، و**inhibition of tubuloglomerular feedback**.

          التفسير المقبول (مش في الكتاب) لأهمهم:

          - **Angiotensin II** بيضيّق الـ ==efferent arteriole== أكتر من الـ afferent، فالضغط جوه الـ glomerulus يعلى.
          - في الـ **hyperglycaemia** الـ proximal tubule بيمص glucose كتير ومعاه Na، فالـ Na اللي بيوصل للـ **macula densa** يقل. الـ macula densa تفهم إن الفلترة قليلة، فتوسّع الـ ==afferent==.
          - الـ **obesity**: جسم أكبر محتاج فلترة أكتر من نفس عدد النفرونات.

          يعني الـ afferent مفتوح والـ efferent مقفول، والـ glomerulus بين الاتنين تحت ضغط.
      - kind: explain
        page: 25
        quote: "Once half of the total nephrons are lost, CKD progresses similarly regardless of etiology. Initial hyperfiltration activates RAAS and causes proteinuria. Angiotensin II and protein uptake at the tubules causes inflammation and fibrosis of the glomerulus and tubules. Progressive decline in GFR and systemic complications occurs."
        title: "الدايرة المقفولة"
        text: |
          الكتاب في ص 25 بيكمّل الحكاية: الـ hyperfiltration الأولاني بيشغّل الـ **RAAS** ويعمل ==proteinuria==. والـ **angiotensin II** والبروتين اللي الـ tubules بتمصه بيعملوا **inflammation** و**fibrosis** في الـ glomerulus والـ tubules، فالـ GFR ينزل والمضاعفات تظهر.

          التفسير المقبول (مش في الكتاب) لليه البروتين مؤذي: خلايا الـ tubule مش متعودة تمص كميات بروتين كبيرة، فبتتعب وتطلّع مواد التهابية بتشد الـ fibroblasts.

          والنتيجة: كل nephron يموت بيزوّد الحمل على الباقي، فيموتوا أسرع. علشان كده الكتاب بيقول إن بعد ما ==نص النفرونات== يروح، المرض بيكمّل بنفس الطريقة أيًا كان السبب.
      - kind: aside
        page: 25
        quote: "Once half of the total nephrons are lost, CKD progresses similarly regardless of etiology. Initial hyperfiltration activates RAAS and causes proteinuria. Angiotensin II and protein uptake at the tubules causes inflammation and fibrosis of the glomerulus and tubules. Progressive decline in GFR and systemic complications occurs."
        tone: exam
        text: "جملة امتحان: لما **نص النفرونات** يروح، الـ CKD بيكمّل **بنفس الطريقة أيًا كان السبب**. علشان كده علاج الـ hyperfiltration (RAASi و sodium–glucose cotransporter 2 (SGLT2) inhibitor (SGLT2i)) بينفع مع معظم الأسباب."
      - kind: check
        page: 25
        quote: "Once half of the total nephrons are lost, CKD progresses similarly regardless of etiology. Initial hyperfiltration activates RAAS and causes proteinuria. Angiotensin II and protein uptake at the tubules causes inflammation and fibrosis of the glomerulus and tubules. Progressive decline in GFR and systemic complications occurs."
        question: "Once half of the nephrons are lost, CKD:"
        options:
          - "Progresses similarly regardless of the cause"
          - "Stops if the original cause is treated"
          - "Progresses only in diabetic kidney disease"
          - "Always needs dialysis within a year"
        answer: 0
        why:
          - "صح: جملة الكتاب في ص 25، والسبب الـ hyperfiltration في الباقيين."
          - "علاج السبب مهم، بس الدايرة بتكمّل لوحدها؛ علشان كده بنضيف RAASi و SGLT2i."
          - "الكتاب قال regardless of etiology."
          - "مفيش رقم زي ده في الكتاب، والسرعة بتختلف."
      - kind: table
        page: 25
        quote: "Prevalence of CKD\n  12-14% General pop\n  40% Diabetes\n  40% Cardio-vascular diseases\n  33% Age ≥ 65 years\n  22% HTN"
        title: "الـ CKD منتشر قد إيه؟"
        columns: [Group, CKD]
        rows:
          - ["General population", "12–14%"]
          - ["Diabetes", "40%"]
          - ["CVD", "40%"]
          - ["Age ≥ 65", "33%"]
          - ["Hypertension", "22%"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: explain
        remind: [neph.L02.017]
        page: 26
        quote: "Hypertension; diabetes; Cardiovascular disease; AKI/hospitalization history; FH kidney disease; obesity; other high-risk comorbidities (e.g., SLE, environmental exposures, nephrotoxic drugs, genetic factors, preeclampsia, low birth weight)."
        title: "مين نعمله screening؟"
        text: |
          الـ screening بيبقى ==cost-effective== في الناس اللي عندهم risk factor بس:

          - **Hypertension**، **diabetes**، **CVD**
          - تاريخ **acute kidney injury (AKI)** أو دخول مستشفى، **family history** لمرض كلى، **obesity**
          - systemic lupus erythematosus (SLE)، nephrotoxic drugs، genetic، **preeclampsia**، **low birth weight**

          اعمل **estimated glomerular filtration rate (eGFR) + ACR**. لو غير طبيعي: استبعد AKI، و**أكّد بعد 3 شهور**، وبعدين stage، cause، risk، treatment.

          التفسير المقبول (مش في الكتاب): الـ screening بيكسب في الناس دول **لأن** نسبة الـ CKD فيهم أعلى، فنفس عدد التحاليل بيلاقي حالات أكتر بدري، قبل ما الكلية تخسر كتير.
      - kind: explain
        page: 26
        quote: "Hypertension; diabetes; Cardiovascular disease; AKI/hospitalization history; FH kidney disease; obesity; other high-risk comorbidities (e.g., SLE, environmental exposures, nephrotoxic drugs, genetic factors, preeclampsia, low birth weight)."
        title: "ليه الناس دول بالذات؟"
        text: |
          الكتاب بيقول الـ screening ==cost-effective== في اللي عندهم risk factor. التفسير المقبول (مش في الكتاب) لكل مجموعة:

          - **Hypertension و diabetes**: أشهر سببين للـ CKD، وكمان بيعملوا hyperfiltration زي ما شفنا.
          - **CVD**: نفس الشرايين اللي اتأذت في القلب موجودة في الكلية.
          - **AKI أو دخول مستشفى**: الكلية ممكن ماترجعش 100% بعد الـ AKI.
          - **Family history** و **genetic factors**: أمراض زي الـ ADPKD بتورث.
          - **Preeclampsia** و **low birth weight**: الطفل اللي اتولد صغير بيبقى عنده nephrons أقل من الأول، فبيبدأ حياته شايل حمل زيادة.
          - **Nephrotoxic drugs** و **environmental exposures** و **SLE**: بيأذوا الكلية مباشرة.

          يعني بندوّر في المكان اللي احتمال نلاقي فيه حاجة عالي، بدل ما نحلل للناس كلها.
