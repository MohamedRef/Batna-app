  - id: dm.L17.lesson2
    title: "الرصيد الأول، والأسباب التانوية"
    hook: "الـ peak bone mass هو رصيدك قبل ما السحب يبدأ. وفيه أمراض وأدوية بتسحب من الرصيد بدري: أولهم الـ steroids."
    minutes: 9
    pages: [216, 217]
    topics: [peak-mass, secondary]
    goals:
      - "تعد العوامل اللي بتحدد الـ peak bone mass وتعرف ليه كل واحد"
      - "تعدّ أسباب الـ secondary osteoporosis بالمجموعات وتعرف بتاكل العضم إزاي"
      - "تشرح إزاي الـ steroids بتاكل العضم"
    status: unverified
    steps:
      - kind: explain
        remind: [dm.L17.013]
        page: 216
        title: "الـ peak bone mass: رصيدك قبل ما السحب يبدأ"
        quote: "Factors that may affect peak bone mass: 1. Gender 2. Race 3. Genetic factors 4. Gonadal steroids 5. Growth hormone"
        text: |
          كل ما رصيدك في الشباب أعلى، كل ما الـ osteoporosis تتأخر. العوامل اللي بتحدد ==peak bone mass==:
          1. Gender
          2. Race
          3. Genetic factors
          4. Gonadal steroids
          5. Growth hormone
          6. Timing of puberty
          7. Calcium intake
          8. Exercise
      - kind: explain
        page: 216
        title: "ليه العوامل التمانية دي بالذات؟"
        quote: "Factors that may affect peak bone mass:"
        text: |
          الكتاب بيعدّها من غير شرح. التفسير المقبول (مش في الكتاب) إنها تلات مجموعات:

          - **حاجات اتولدت بيها**: gender و race و genetic factors. الرجالة والسود بيبنوا رصيد أكبر (الكتاب نفسه بيقول كده في ص 218).
          - **هرمونات البناء**: ==gonadal steroids== و **growth hormone** و timing of puberty. البلوغ هو موسم البناء الكبير، فلو اتأخر أو الهرمونات قلّت، الموسم بيقصر.
          - **مواد البناء والحمل عليها**: ==calcium intake== و ==exercise==. العضم بيتبني من الكالسيوم، وبيتقوّى في الاتجاه اللي بيتحمّل عليه.

          ليه ده مهم؟ عشان كل الـ osteoporosis بعدين = رصيد البداية ناقص اللي اتسحب. اللي بدأ برصيد أكبر بيوصل لعتبة الكسر متأخر.
      - kind: aside
        tone: joke
        page: 216
        quote: "Factors that may affect peak bone mass: 1. Gender 2. Race 3. Genetic factors 4. Gonadal steroids 5. Growth hormone"
        text: "الـ **peak bone mass** زي تحويشة العمر: اللي حوّش لبن وكالسيوم ورياضة وهو صغير، يصرف براحته وهو كبير. واللي صرف على الشيبسي... ربنا يستر 😅"
      - kind: explain
        page: 216
        title: "مش كل osteoporosis سببها السن"
        quote: "These secondary causes account for < 5% of all cases of osteoporosis in postmenopausal women."
        text: |
          الـ **secondary causes** أقل من ==5%== في الستات بعد سن اليأس.

          بس في **young women and men of all ages** النسبة أعلى بكتير. وفي كبار السن لازم تفكر في **multiple causes** مع بعض.

          يعني: راجل عنده osteoporosis أو بنت شابة؟ دوّر على سبب.
      - kind: explain
        page: 216
        title: "ليه الأسباب دي بتاكل العضم؟"
        quote: "Secondary osteoporosis may result from many causes, including glucocorticoid excess, male hypogonadism, hyperparathyroidism, hyperthyroidism, malignancy, immobilization, hepatic insufficiency, gastrectomy, rheumatoid arthritis, acromegaly, chronic obstructive pulmonary disease, chronic renal failure, and heparin therapy."
        text: |
          القايمة طويلة، بس التفسير المقبول (مش في الكتاب) بيلمّها في أربع طرق:

          - **السحب بيزيد**: hyperparathyroidism و hyperthyroidism بيسرّعوا الـ turnover، والـ ==male hypogonadism== بيشيل الهرمون اللي بيحمي العضم زي الـ estrogen عند الست.
          - **الإيداع بيقل**: الـ glucocorticoids والـ heparin.
          - **المادة الخام مش داخلة**: ==gastrectomy== والـ hepatic insufficiency بيقللوا امتصاص الكالسيوم والـ vitamin D، والـ chronic renal failure بيبوّظ تفعيل الـ vitamin D.
          - **العضم مش محتاج يبقى قوي**: الـ ==immobilization==؛ العضم اللي مش بيتحمّل عليه بيتسحب منه.

          والـ malignancy والـ rheumatoid arthritis والـ COPD التهاب أو خلايا بتاكل العضم من جوه.
      - kind: explain
        remind: [dm.L17.018]
        page: 217
        title: "الـ glucocorticoids: الحرامي رقم واحد"
        quote: "Endogenous or exogenous glucocorticoid excess is a leading cause of premature osteoporosis. Corticosteroids inhibit osteoblastic function, stimulate bone resorption, increase parathyroid hormone secretion, inhibit intestinal calcium absorption, and cause decreased end-organ response to vitamin D."
        text: |
          ==Glucocorticoid excess== (من بره أو من جوه) هو **leading cause of premature osteoporosis**، وبيهاجم من خمس جهات:
          - **Inhibit osteoblastic function**: الإيداع وقف
          - **Stimulate bone resorption**: السحب زاد
          - **Increase parathyroid hormone (PTH) secretion**
          - **Inhibit intestinal calcium absorption**
          - **Decreased end-organ response to vitamin D**

          يعني مش لازم يبقى عنده Cushing's: أي حد واخد steroid مدة طويلة (asthma، rheumatoid arthritis) في خطر.
      - kind: reveal
        page: 217
        quote: "Corticosteroids inhibit osteoblastic function, stimulate bone resorption, increase parathyroid hormone secretion, inhibit intestinal calcium absorption, and cause decreased end-organ response to vitamin D."
        prompt: "الخمس آليات دول بيخلّوا العضم يقع ليه؟ اربط كل واحدة بالحساب البنكي."
        answer: |
          الكتاب بيدّيك الخمسة، والربط (التفسير المقبول، مش في الكتاب):
          - **Osteoblast ↓**: الإيداع وقف.
          - **Resorption ↑**: السحب زاد.
          - **PTH ↑**: الـ PTH المستمر بيشغّل السحب أكتر (وده عكس الـ PTH المتقطع اللي هيعالج في آخر المحاضرة).
          - **امتصاص الكالسيوم ↓** و **استجابة الـ vitamin D ↓**: المادة الخام اللي بيتبني منها العضم مش داخلة.

          يعني الـ steroid بيقفل الإيداع ويفتح السحب في نفس الوقت، وعشان كده ==leading cause of premature osteoporosis==.
      - kind: check
        page: 217
        quote: "Endogenous or exogenous glucocorticoid excess is a leading cause of premature osteoporosis. Corticosteroids inhibit osteoblastic function, stimulate bone resorption, increase parathyroid hormone secretion, inhibit intestinal calcium absorption, and cause decreased end-organ response to vitamin D."
