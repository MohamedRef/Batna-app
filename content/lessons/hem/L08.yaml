        text: |
          الـ **chronic phase** بيتعالج بـ ==TKI== (tyrosine kinase inhibitor): بيقعد في جيب الـ BCR/ABL kinase ويقفله.

          لو فيه **donor** مناسب، ممكن **stem cell transplantation (SCT)** كأول علاج لو تمن الـ TKI لسنين **مستحيل**.

          ليه الـ TKI غيّر كل حاجة؟ التفسير المقبول (مش في الكتاب): الـ busulfan والـ hydroxyurea بيضربوا كل خلية بتتقسم، فبيظبطوا العدد بس الـ clone فاضل. الـ TKI بيضرب ==السبب نفسه== (الـ kinase اللي اتلزق)، فالخلايا اللي فيها Ph1 بتقل والطبيعية بترجع.
