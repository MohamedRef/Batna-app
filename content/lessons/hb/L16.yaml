            <text x="170" y="90" class="t-sm">OCP (up to 90%)</text>
            <text x="170" y="106" class="t-sm">May bleed or rupture</text>
            <text x="14" y="176" class="t-sm t-bad">Malignant: up to 8% (40–50% in men)</text>
            <text x="14" y="194" class="t-sm">Stop hormones; excise if SLaP M; bleeding: TAE</text>
            <g transform="translate(0,214)">
              <text x="165" y="18" text-anchor="middle" class="t-b t-lg t-good">FNH</text>
