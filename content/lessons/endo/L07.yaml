        remind: [endo.L07.085]
        page: 132
        quote: "The term pheochromocytoma crisis is used when patients present with potentially life- threatening hemodynamic disturbances either in the form of hypertensive crisis or cardiogenic (or adrenergic) shock."
        title: "الـ crisis"
        text: |
          ==Pheochromocytoma crisis==: اضطراب hemodynamic يهدد الحياة، يا **hypertensive crisis** يا **cardiogenic adrenergic shock**. الكتاب كاتب mortality حوالي 85%.

          مفيش رقم ثابت، بس الحدود المقبولة: **220/120 mmHg**.

          **Precipitants**: straining، exercise، **pressure on the abdomen**، وأدوية زي الـ **anaesthesia**.

          التفسير المقبول (مش في الكتاب): الـ precipitants كلها يا بتعصر الورم فيطلّع الـ catecholamines المتخزّنة فيه (straining، الضغط على البطن، حتى الكشف بإيدك)، يا بتهيّج الـ sympathetic system (exercise، anaesthesia). والـ shock بيحصل لأن الـ catecholamines العالية جدًا بتتعب عضلة القلب، والأوعية المقفولة طول الوقت بتقلل حجم الدم.
