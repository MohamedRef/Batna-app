  # ---------- p267-269: digestion ----------
  - id: dm.L21.044
    kind: card
    topic: digestion
    front: Where is the primary site of fat digestion, and how much dietary fat is absorbed?
    back: The small intestine (little in the stomach); 95% of fat consumed is absorbed.
    src: { page: 268, quote: "95% of fat consumed is absorbed." }
    status: unverified
  - id: dm.L21.045
    kind: order
    topic: digestion
    prompt: Order lipid digestion and absorption.
    steps:
      - Bile salts emulsify large fat globules
      - Lipases break TG into glycerol and fatty acids
      - Micelles pick up the products of fat digestion
      - Intestinal cells absorb lipids and re-synthesize TG
      - TG, cholesterol and phospholipid are packed into chylomicrons
      - Chylomicrons enter lacteals and lymph, then the veins
    src: { page: 268, quote: "I- Emulsification:\n  1. Breaking down large fats into smaller fats.\n  2. Coating small fat globules with bile salts.\n  3. After emulsification, fats are smaller and more exposed to the action of lipases." }
    status: unverified
  - id: dm.L21.046
    kind: card
    topic: digestion
    front: Why does emulsification help fat digestion?
    back: It breaks fat into small globules coated with bile salts, so they are more exposed to lipases.
    src: { page: 268, quote: "I- Emulsification:\n  1. Breaking down large fats into smaller fats.\n  2. Coating small fat globules with bile salts.\n  3. After emulsification, fats are smaller and more exposed to the action of lipases." }
    status: unverified
  - id: dm.L21.047
