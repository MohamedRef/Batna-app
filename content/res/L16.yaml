  stem: With mean 75 and SD 10, where does Mohamed's score of 87 lie?
  options:
  - More than one SD above the mean
  - Within one SD of the mean
  - More than two SD above the mean
  - Below the mean
  answer: 0
  why:
  - 87 is above 85 (mean + 1 SD) but below 95 (mean + 2 SD).
  - Within 1 SD would be 65 to 85; 87 is past 85.
  - Mean + 2 SD is 95; 87 has not reached it.
