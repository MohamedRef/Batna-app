- id: res.L20.lesson6
  title: 'الـ checklists: 10 أسئلة وقايمة لكل تصميم'
  hook: قدامك abstract في الامتحان. أول سؤال تسأله إيه؟ وإيه اللي تدوّر عليه في RCT غير الـ cohort؟
  minutes: 10
  pages:
  - 55
  - 69
  topics:
  - checklists
  goals:
  - تعرف الـ 10 أسئلة وأهمهم
  - تستخدم checklist كل تصميم
  - تفرّق بين PRISMA وCONSORT وSTARD
  status: unverified
  steps:
  - kind: explain
    page: 55
    quote: |-
      Ten Questions to Ask When Critically Appraising a Research Article
      1. What is the relevance of the research question to one's own practice?
      2. Does the study add anything new?
      3. What type of research question is being asked?
      4. Was the study design appropriate for the research question?
      5. Did the study methods address the most important potential sources of bias?
      6. Was the study performed according to the original protocol?
      7. Does the study test a stated hypothesis?
      8. Were the statistical analyses performed correctly?
      9. Do the data justify the conclusions?
      10. Are there any potential conflicts of interest?
    title: الـ 10 أسئلة (Young & Solomon 2009)
    text: |-
      من مقال **Young and Solomon**:

      1. relevance السؤال لـ practice بتاعتك؟
      2. بتضيف جديد؟
      3. نوع السؤال إيه؟
      4. التصميم مناسب؟
      5. الـ methods عالجت أهم مصادر الـ bias؟
      6. اتنفذت حسب الـ protocol؟
      7. بتختبر hypothesis محددة؟
      8. التحليل الإحصائي صح؟
      9. البيانات تبرر الـ conclusions؟
      10. فيه ==conflicts of interest==؟
    remind:
    - res.L20.081
  - kind: check
    page: 56
    quote: |-
      Which one of the following questions is MOST important when critically appraising a research article?
      A. What type of research question is being asked?
      B. What is the relevance of the research question to one's own practice?
      C. Was the study performed according to the original protocol?
      D. Does the study test a stated hypothesis?
      E. Do the data justify the conclusions?
      B
    question: Which question is MOST important when critically appraising a research article?
    options:
    - What is the relevance of the research question to one's own practice?
    - What type of research question is being asked?
    - Was the study performed according to the original protocol?
    - Do the data justify the conclusions?
    answer: 0
    why:
    - 'صح: لو مش relevant لشغلك، وقّف قراية.'
    - مهم بس رقم 3.
    - رقم 6.
    - رقم 9.
  - kind: explain
    page: 58
    quote: |-
      1. Were all relevant studies included (i.e., was the search comprehensive, did it exclude articles on the basis of publication status or language, and was the potential for publication bias assessed)?
      2. Were selected articles appraised and data extracted by two independent reviewers?
      3. Was sufficient detail provided about the primary studies, including descriptions of the patients, interventions, and outcomes?
      4. Was the quality of the primary studies assessed?
      5. Did the researchers assess the appropriateness of combining results to calculate a summary measure?
    title: Systematic reviews وmeta-analyses
    text: |-
      - كل الدراسات المهمة دخلت؟ (search شامل، مفيش استبعاد باللغة أو الـ publication status، واتقيّم الـ **publication bias**)
      - اتقيّمت واتسحبت بياناتها بـ ==two independent reviewers==؟
      - تفاصيل كافية عن المرضى والـ interventions والـ outcomes؟
      - اتقيّمت جودة الدراسات الأصلية؟
      - يصح نجمع النتايج في summary measure؟

      والـ **PRISMA** flow diagram بيوضح الـ search واختيار المقالات.
    remind:
    - res.L20.083
  - kind: check
    page: 60
    quote: |-
      In critical appraisal of the systematic reviews and meta analysis, all of the following items should be addressed EXCEPT:
      A. All relevant studies should be included
      B. The selected articles should be appraised and data extracted by one reviewer
      C. Detailed description should be provided about the primary studies
      D. The quality of the primary studies should be assessed
      E. The appropriateness of combining results to calculate a summary measure should be assessed
    question: 'In appraisal of systematic reviews and meta-analysis, all should be addressed EXCEPT:'
    options:
    - Articles appraised and data extracted by one reviewer
    - All relevant studies included
    - Quality of the primary studies assessed
    - Appropriateness of combining results assessed
    answer: 0
    why:
    - 'صح (الاستثناء): لازم **اتنين** مستقلين.'
    - بند 1.
    - بند 4.
    - بند 5.
  - kind: mnemonic
    page: 61
    quote: |-
      Randomized Controlled Trials
      1. Was the process of treatment allocation truly random (Randomization)?
      2. Would participants have been able to know or guess their treatment allocation (allocation concealment)?
      3. Were participants and researchers "blinded" to participants' treatment group?
      4. Were outcomes assessed objectively?
      5. Were participants followed up for a sufficient length of time?
      6. Were all participants who were randomly allocated a treatment accounted for in the final analysis (% drop-outs)?
      7. Were all participants' data analyzed in the group to which they were randomly allocated (Intention to treat analysis)?
    word: RABOFDI
    parts:
    - key: R
      text: 'Randomization: truly random allocation?'
    - key: A
      text: 'Allocation concealment: could they guess?'
    - key: B
      text: Blinding of participants and researchers
    - key: O
      text: Outcomes assessed objectively
    - key: F
      text: Follow-up long enough
    - key: D
      text: 'Drop-outs: all randomized accounted for'
    - key: I
      text: Intention to treat analysis
    hook: '«ربّ أوفدي»: 7 أسئلة الـ RCT بالترتيب.'
  - kind: case
    page: 61
    quote: |-
      Randomized Controlled Trials
      1. Was the process of treatment allocation truly random (Randomization)?
      2. Would participants have been able to know or guess their treatment allocation (allocation concealment)?
      3. Were participants and researchers "blinded" to participants' treatment group?
      4. Were outcomes assessed objectively?
      5. Were participants followed up for a sufficient length of time?
      6. Were all participants who were randomly allocated a treatment accounted for in the final analysis (% drop-outs)?
      7. Were all participants' data analyzed in the group to which they were randomly allocated (Intention to treat analysis)?
    stem: An RCT allocated patients by the day of the week they came. The outcome nurse knew each group. Drop-outs were analysed with the control group.
    steps:
    - question: Which point fails first?
      options:
      - Randomization (and allocation concealment)
      - Gold standard
      - Response rate
      - Case definition
      answer: 0
      why: التوزيع بيوم الأسبوع مش random، والمريض يقدر يخمّن جروبه، فالـ randomization والـ allocation concealment الاتنين باظوا.
    - question: Analysing drop-outs with the control group breaks which principle?
      options:
      - Intention to treat
      - Recall bias
      - Publication bias
      - Spectrum
      answer: 0
      why: 'الـ intention to treat analysis: كل واحد يتحلل في الجروب اللي اتوزّع عليه عشوائيًا، حتى لو وقف العلاج.'
  - kind: table
    page: 63
    quote: |-
      Cohort Study
      1. Is the study prospective or retrospective?
      2. Is the cohort representative of a defined group or population?
      3. Were all important confounding factors identified?
      4. Were all important exposures and/or treatments, potential confounding factors and outcomes measured accurately and objectively in all members of the cohort?
      5. Were there important losses to follow-up?
      6. Were participants followed up for a sufficient length of time?
    title: Cohort checklist
    columns:
    - '#'
    - Question
    rows:
    - - '1'
      - Prospective or retrospective?
    - - '2'
      - Cohort representative of a defined population?
    - - '3'
      - All important confounding factors identified?
    - - '4'
      - Exposures, confounders and outcomes measured accurately and objectively?
    - - '5'
      - Important losses to follow-up?
    - - '6'
      - Followed up long enough?
    hide:
