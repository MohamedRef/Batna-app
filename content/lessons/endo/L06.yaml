        prompt: "ليه الـ hypothyroidism من الـ amiodarone أكتر في اللي عندهم antithyroid antibodies؟"
        answer: "الـ amiodarone فيه يود كتير. الغدة الطبيعية بتقفل التصنيع مؤقتًا (**Wolff-Chaikoff**) وبعدين «بتهرب» من القفلة وترجع تشتغل. الكتاب بيقول إن الـ hypothyroidism ممكن يكون **failure to escape**. التفسير المقبول (مش في الكتاب): الغدة اللي فيها autoimmune thyroiditis احتياطيها قليل أصلًا، فما بتقدرش تهرب، وتفضل مقفولة. ونفس الفكرة في الـ iodide: الـ chronic autoimmune thyroiditis = خطر hypothyroidism دايم."
