    status: unverified
    steps:
      - kind: explain
        page: 357
        title: "HELLP: الـ ATN مش الـ TMA"
        quote: "HELLP syndrome HELLP syndrome is defined by the acronym: hemolysis, elevated liver enzymes, and low platelets. Hypertension and proteinuria are frequently, although not exclusively, associated with HELLP syndrome. AKI occurs in 3– 15% of patients with HELLP syndrome. Typically, even severe AKI in HELLP (17) syndrome has a high likelihood of kidney recovery of up to 80%. AKI is often multifactorial and, in addition to the kidney changes characteristic of preeclampsia, there is associated coagulopathy, resulting in bleeding and acute tubular necrosis."
        text: |
          **H**emolysis، **EL**evated liver enzymes، **L**ow **P**latelets.

          - الـ AKI في **3-15%**، و recovery لحد **80%** حتى لو شديد.
          - السبب multifactorial: تغييرات الـ preeclampsia + **coagulopathy** ونزيف و acute tubular necrosis (ATN).
          - شبه thrombotic microangiopathy (TMA)، لكن الـ biopsy غالبًا بيبيّن ==acute tubular necrosis==.
      - kind: explain
        page: 358
        title: "ليه الـ AKI في الـ HELLP بيرجع غالبًا؟"
        quote: "Like TTP and HUS, kidney biopsies of women with HELLP syndrome may occasionally display findings of thrombotic microangiopathy, but commonly show manifestations consistent with acute tubular necrosis."
        text: |
          الكتاب بيقول الـ AKI في الـ HELLP ==often multifactorial==: تغييرات الـ preeclampsia + **coagulopathy** بتعمل **نزيف**، والنزيف بيعمل **acute tubular necrosis**.

          وده يفسّر الـ recovery لحد **80%**: التفسير المقبول (مش في الكتاب): الـ **ATN** خلايا الـ tubule بتتجدد لو السبب اتشال (الولادة ووقف النزيف). أما لو الـ biopsy طلع **TMA** (ساعات)، الأوعية نفسها مسدودة والرجوع أصعب.

          وليه اسمه **TMA-like**؟ عشان فيه نفس التلاتة: **thrombocytopenia** و **hemolysis** و **AKI**.
      - kind: explain
        page: 358
        title: "AFLP: الكبد هو اللي بيوقع الكلية"
        quote: "Acute fatty liver of pregnancy Acute fatty liver of pregnancy (AFLP) as a cause of AKI in pregnancy is on the rise. AFLP is diagnosed later in the pregnancy, mostly after 30 weeks. The pathogenesis in 20% of cases of AFLP is secondary to fetal long-chain 3- hydroxyacyl CoA dehydrogenase deficiency which leads to accumulation of fetal free fatty acids that crosses the placenta and results in hepatotoxicity to the mother. Women usually present in the third trimester with nonspecific symptoms of nausea, vomiting, and abdominal pain. Many laboratory findings of AFLP overlap with HELLP syndrome and preeclampsia such as hepatic derangements, but AKI is more common in AFLP, being present in 20–100% of women. AKI in AFLP usually manifests similarly to hepatorenal syndrome, due to presence of liver failure, ascites and peripheral vasodilation. Elevated creatinine has shown to be an independent predictor of maternal mortality in HELLP syndrome. Swanson Criteria, defined by clinical symptoms and laboratory derangements of encephalopathy, hyperbilirubinemia, abdominal ascites, hypoglycemia, and micro vesicular steatosis on liver biopsy, can differentiate AFLP from HELLP syndrome/preeclampsia. Management is expectant delivery, platelet transfusion prior to delivery if platelet count less than 40,000 per microliter, and evaluation for liver transplant in severe cases. (18,19)"
        text: |
          بعد ==30 weeks==. في **20%** السبب إن الجنين عنده **long-chain 3-hydroxyacyl-CoA dehydrogenase (LCHAD) deficiency**: الـ fatty acids بتعدّي المشيمة وتسمم كبد الأم.

          الـ AKI أشيع من HELLP (**20-100%**)، وشكله ==hepatorenal==: liver failure و ascites و vasodilation.

          العلاج: **ولادة**، صفائح لو **<40,000** قبل الولادة، و liver transplant في الحالات الشديدة.
      - kind: explain
        page: 358
        title: "الـ AFLP: ليه الكبد بيوقع الكلية؟"
        quote: "AKI in AFLP usually manifests similarly to hepatorenal syndrome, due to presence of liver failure, ascites and peripheral vasodilation."
        text: |
          الكتاب بيقول الـ AKI في الـ AFLP شبه ==hepatorenal syndrome==، والسبب: **liver failure** و **ascites** و **peripheral vasodilation**.

          التفسير المقبول (مش في الكتاب): نفس اللي بيحصل في الـ cirrhosis. الأوعية برا الكلية بتتوسع، فالضغط يقع، والكلية تفتكر إن الدم قليل فتقفل أوعيتها. الكلية نفسها سليمة، بس مش واصلها دم.

          وليه الـ AKI أشيع في الـ AFLP (**20-100%**) من الـ HELLP؟ لأن هنا الكبد **فاشل**، مش مجرد إنزيمات عالية. وده كمان سبب الـ **hypoglycemia** والـ **encephalopathy**: الكبد مش قادر يعمل glucose ولا ينضّف الدم.
