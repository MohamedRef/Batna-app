        title: "العضل: أكبر مخزن بروتين"
        text: |
          - **Skeletal muscle**: the largest protein store in the body.
          - حجمه بيعتمد على السن، الجنس، الـ ethnicity، وشدة وسبب مرض الكبد.

          المشكلة في الـ cirrhosis في كلمتين:
          - ==Anabolic resistance==: العضل مش بيستجيب لإشارة "ابني".
          - ==Dysregulated proteostasis==: الميزان بين بناء البروتين وهدمه مايل ناحية الهدم.

          والنتيجة: **sarcopenia** و failure to respond to standard supplementation. يعني تأكّله كويس، والعضل برضه مش بيبني.

          والخبر الحلو: كل mechanism منهم potential therapeutic target. والرسمة الجاية بتوريك المشاكل فوق والعلاجات تحت.
