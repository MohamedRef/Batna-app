        quote: "Erythropoiesis stimulating agents (ESAs) HIF stabilizers"
        title: "قبل الـ ESA"
        text: |
          استبعد الأول: **inflammation** (CRP، IL-6)، **blood loss** (منظار)، **haemolysis**، مرض **دم**، **folate/B12**، الـ PTH.

          وشوف الـ **iron**: ferritin، TSAT، % hypochromic RBCs، reticulocyte Hb، وعوّض.

          بعدين ==ESA== أو ==HIF stabilizer== (oral):

          - **Epoetin**: 2000–3000 U، من 2 لـ 3 مرات في الأسبوع
          - **Darbepoetin**: 30 µg كل أسبوع، أو 60 µg كل أسبوعين
          - **Pegylated epoetin beta**: 60 µg كل أسبوعين أو 120 µg كل 4 أسابيع
