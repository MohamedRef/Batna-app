      A study shows neural tube defects in 50% of newborns whose mothers did not receive folic acid in pregnancy, against 10% when
      mothers had a folic-acid-rich diet. The design is
    options: [Cross sectional, Case control, Correlation study, Prospective cohort, Retrospective cohort]
    answer: 3
    why:
      - Exposure (folic acid) comes before the outcome (the newborn), so it is not one moment.
      - The results are given as rates by exposure group, not as exposure among cases.
      - Data are individual.
