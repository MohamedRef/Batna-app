      - "تحفظ الـ LDL targets وتفهم ليه بتنزل مع الخطر"
      - "تختار العلاج من جدول الـ intensity وتعرف كل دوا بيشتغل إزاي"
    status: unverified
    steps:
      - kind: explain
        page: 274
        title: "التصنيف (ESC 2023)"
        quote: "Table 7: Cardiovascular risk categories in type 2 diabetes\n| Risk category | Patients with T2DM |\n|---|---|\n| Very high CV risk | Clinically established ASCVD or Severe TOD or 10-year CVD risk ≥20% using SCORE2-Diabetes |\n| High CV risk | Not fulfilling the very high-risk criteria and a 10-year CVD risk 10 to <20% using SCORE2-Diabetes |\n| Moderate CV risk | Not fulfilling the very high-risk criteria and a 10-year CVD risk 5 to <10% using SCORE2-Diabetes |\n| Low CV risk | Not fulfilling the very high-risk criteria and a 10-year CVD risk <5% using SCORE2-Diabetes |\nEuropean Heart Journal (2023) 44, 4043–4140 (2023 ESC Guidelines for the management of cardiovascular disease in patients with diabetes)"
        text: |
          - ==Very high==: **atherosclerotic cardiovascular disease (ASCVD)** واضح، أو **severe target-organ damage**، أو 10-year risk **≥ 20%** بالـ **SCORE2-Diabetes**.
          - **High**: 10 لـ أقل من 20%.
          - **Moderate**: 5 لـ أقل من 10%.
          - **Low**: أقل من 5%.

          ليه الـ ASCVD لوحده يكفّي very high من غير score؟ التفسير المقبول (مش في الكتاب): اللي جاله event قبل كده الـ plaque عنده **مثبتة**، والـ score معمول يتنبأ بأول event، مش بالتاني. وده سبب إن كل فئة تحت بتبدأ بـ "not fulfilling the very high-risk criteria".
      - kind: explain
        remind: [dm.L22.003]
        page: 275
        title: "SCORE2-Diabetes على عيان الكتاب"
        quote: "ESC CVD Risk Calculator example:\n| Input | Value |\n|---|---|\n| Gender | male |\n| Age | 55 ys |\n| Age at Diabetes Diagnosis | 48ys |\n| Current smoking | yes |\n| Systolic blood pressure | 130 |\n| Total cholesterol | 209 mg/dl |\n| HDL cholesterol | 35 mg/dl |\n| HbA1c | 6.9 % |\n| eGFR | 88 ml/min |\nResult: 27.6% 10-year CV Risk"
        text: |
          الكتاب بيحط عيانه في الـ ESC CVD risk calculator:
          - gender **male**، age **55**، age at diabetes diagnosis **48**، current smoking **yes**.
          - systolic BP **130**، total cholesterol **209**، HDL cholesterol **35**.
          - **HbA1c 6.9%** و **eGFR 88**.
          - النتيجة: ==27.6%== 10-year CV risk، يعني **very high**.

          ليه الـ inputs دي؟ التفسير المقبول (مش في الكتاب): الأولانيين هم الـ risk factors العادية، والتلاتة الزيادة خاصة بالسكر: **سن التشخيص** (كل ما بدأ بدري، سنين تعرّض أطول)، **HbA1c** (شدة السكر)، و **eGFR** (الكلية أوعية كمان، وتعبها بيعكس تعب الشرايين).
      - kind: figure
