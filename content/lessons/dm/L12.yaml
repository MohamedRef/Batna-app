  - id: dm.L12.lesson5
    title: "الكبد والسكر: Child-Pugh والـ A1C اللي بيكدب"
    hook: "في الـ cirrhosis الـ A1C ممكن يطمّنك وهو غلط. نعرف إمتى، ونتابع بإيه بداله، ونظبط الأكل والرياضة."
    minutes: 8
    pages: [152, 154]
    topics: [cld-severity, cld-lifestyle]
    goals:
      - "تصنّف الـ hepatic impairment بالـ Child-Pugh"
      - "تعرف ليه الـ A1C بيبقى falsely low أو high"
      - "تحفظ أرقام الأكل والرياضة والوزن"
    status: unverified
    steps:
      - kind: explain
        page: 152
        title: "ليه صعب؟"
        quote: "Managing diabetes in patients with CLD can be challenging because many Anti-hyperglycemic therapies are contraindicated or must be used with caution for safety reasons."
        text: |
          كتير من أدوية السكر ==contraindicated أو بحذر== في الـ chronic liver disease (CLD). فلازم نقيس الكبد الأول بالـ **Child-Pugh**.

          ليه الكبد بالذات؟ التفسير المقبول (مش في الكتاب): الكبد هو اللي بيكسّر أغلب الأقراص، وهو كمان مخزن الـ glucose ومصنعه وقت الصيام. فلما يتعب، الأدوية بتتراكم، والجسم مش قادر يرفع السكر لو وطي، والـ hypoglycemia بتبقى أخطر. والـ **Child-Pugh** بيدّيك رقم يقولك الكبد فاضل فيه قد إيه، وعلى الرقم ده بتختار الدوا.
      - kind: figure
        page: 152
        quote: "Decompensation indicates cirrhosis with a Child-Pugh score of 7 or more (Class B & C)."
        title: "Child-Pugh على مسطرة"
        alt: "A ruler from 5 to 15. 5 to 6 is class A, mild. 7 to 9 is class B, moderate. 10 to 15 is class C, severe. A line at 7 is marked decompensation."
        caption: "الـ class A من 5 لـ 6، والـ B من 7 لـ 9، والـ C من 10 لـ 15. ==من 7 وطالع يبقى decompensated==."
        svg: |
          <svg viewBox="0 0 330 140" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="50" width="60" height="30" class="fg-good"/>
            <rect x="80" y="50" width="90" height="30" class="fg-acc"/>
            <rect x="170" y="50" width="140" height="30" class="fg-bad"/>
            <text x="50" y="70" text-anchor="middle" class="t-sm t-b">A 5–6</text>
            <text x="125" y="70" text-anchor="middle" class="t-sm t-b">B 7–9</text>
            <text x="240" y="70" text-anchor="middle" class="t-sm t-b">C 10–15</text>
            <text x="50" y="100" text-anchor="middle" class="t-sm">Mild</text>
            <text x="125" y="100" text-anchor="middle" class="t-sm">Moderate</text>
            <text x="240" y="100" text-anchor="middle" class="t-sm">Severe</text>
            <path d="M80 30 V90" class="fg-arrow-bad" stroke-width="2.5"/>
            <text x="86" y="26" class="t-sm t-bad">≥7 decompensated</text>
            <text x="20" y="130" class="t-sm t-mut">compensated</text>
          </svg>
      - kind: figure
        page: 153
        quote: "Child-Turcotte-Pugh Classification for Severity of Cirrhosis\n| Clinical and Lab Criteria | 1 point | 2 points | 3 points |\n|---|---|---|---|\n| Encephalopathy | None | Mild to moderate (grade 1 or 2) | Severe (grade 3 or 4) |\n| Ascites | None | Mild to moderate (diuretic responsive) | Severe (diuretic refractory) |\n| Bilirubin (mg/dL) | < 2 | 2-3 | >3 |\n| Albumin (g/dL) | > 3.5 | 2.8-3.5 | <2.8 |\n| Prothrombin time: Seconds prolonged | <4 | 4-6 | >6 |\n| Prothrombin time: International normalized ratio | <1.7 | 1.7-2.3 | >2.3 |\n*Child-Turcotte-Pugh Class obtained by adding score for each parameter (total points)\nClass A = 5 to 6 points (least severe liver disease)\nClass B = 7 to 9 points (moderately severe liver disease)\nClass C = 10 to 15 points (most severe liver disease)"
        title: "جدول الكتاب ص 153: الـ Child-Pugh بالنقط"
        image: { file: dm/L12-child-pugh.webp, book: true }
        alt: "Book table of the Child-Turcotte-Pugh classification. Five criteria score 1, 2 or 3 points: encephalopathy none, grade 1 to 2, grade 3 to 4; ascites none, diuretic responsive, diuretic refractory; bilirubin under 2, 2 to 3, over 3 mg/dL; albumin over 3.5, 2.8 to 3.5, under 2.8 g/dL; prothrombin time prolonged under 4, 4 to 6, over 6 seconds, or INR under 1.7, 1.7 to 2.3, over 2.3. Below, the total gives class A 5 to 6, class B 7 to 9, class C 10 to 15."
        caption: |
          - **العمود الشمال**: الـ 5 criteria: encephalopathy، ascites، bilirubin، albumin، prothrombin time.
          - **الأعمدة التلاتة** جنبه = ==1 و2 و3 نقط==، كل ما تروح يمين أسوأ.
          - **تحت** في الشريط البني: اجمع النقط، وتحته الـ classes: ==A 5–6، B 7–9، C 10–15==.
      - kind: check
        page: 152
        quote: "Decompensation indicates cirrhosis with a Child-Pugh score of 7 or more\n    (Class B & C)."
        question: "A cirrhotic diabetic has a Child-Pugh score of 8. How is his hepatic impairment classified?"
        options:
          - "Moderate (class B), decompensated"
          - "Mild (class A), compensated"
          - "Severe (class C)"
          - "Moderate, but still compensated"
        answer: 0
        why:
          - "صح: 7–9 = class B moderate، و≥7 يعني decompensation، فأدوية كتير هتتمنع."
          - "الـ class A من 5 لـ 6 بس."
          - "الـ class C من 10 لـ 15."
          - "الكتاب بيقول score 7 أو أكتر = decompensated."
      - kind: figure
        page: 153
        quote: "False low results commonly present in such pts. Variceal bleeding, hemolytic anemia by hypersplenism → increase in the Hb turnover and decreased RBC survival ."
        title: "الـ A1C على ميزان"
        alt: "A see-saw. The raised left side: iron, B12 or folate deficiency lengthen red cell life and push A1C falsely high. The lowered right side: variceal bleeding and hypersplenic hemolysis shorten red cell life and push A1C falsely low."
        caption: "عمر الـ red blood cell (RBC) ==أقصر== (bleeding، hypersplenism) ← A1C **واطي غلط**. عمره ==أطول== (iron، B12، folate deficiency) ← A1C **عالي غلط**."
        svg: |
          <svg viewBox="0 0 330 170" xmlns="http://www.w3.org/2000/svg">
            <path d="M165 120 L150 150 H180 Z" class="fg-box"/>
            <path d="M30 95 L300 125" class="fg-arrow" stroke-width="4"/>
            <rect x="20" y="40" width="120" height="44" rx="6" class="fg-bad"/>
            <text x="80" y="58" text-anchor="middle" class="t-sm t-b">Long RBC life</text>
            <text x="80" y="74" text-anchor="middle" class="t-sm">iron · B12 · folate ↓</text>
            <text x="80" y="30" text-anchor="middle" class="t-sm t-acc">A1C falsely HIGH ↑</text>
            <rect x="190" y="70" width="130" height="44" rx="6" class="fg-good"/>
            <text x="255" y="88" text-anchor="middle" class="t-sm t-b">Short RBC life</text>
            <text x="255" y="104" text-anchor="middle" class="t-sm">bleeding · spleen</text>
            <text x="255" y="60" text-anchor="middle" class="t-sm t-acc">A1C falsely LOW ↓</text>
          </svg>
      - kind: explain
        page: 153
        title: "ليه عمر الـ RBC بيغيّر الـ A1C؟"
        quote: "A1C testing is unreliable in diabetic patients with cirrhosis and many patients\n       with chronic hepatitis."
        text: |
          الكتاب بيقول الـ A1C ==unreliable== في الـ cirrhosis وفي كتير من الـ chronic hepatitis، وبيدّيك السبب: الـ **Hb turnover** وعمر الـ **RBC**.

          التفسير المقبول (مش في الكتاب) للفكرة: الـ A1C هو نسبة الـ haemoglobin اللي **اتسكّر** طول عمر الكرة الحمرا. يعني هو ساعة بتعدّ من يوم ما الكرة اتولدت:

          - كرة **عمرها قصير** (نزيف من الـ varices، أو hemolysis من الـ hypersplenism) ما لحقتش تتسكّر كتير ← A1C ==falsely low==، وده الأخطر لأنه بيطمّنك على الفاضي.
          - كرة **عمرها طويل** (iron، B12، folate deficiency، فالنخاع مش بيجدّد) قعدت في السكر مدة أطول ← A1C **falsely high**.

          عشان كده الكتاب بيقول الـ **SMBG** المتكرر في أوقات مختلفة أدق، والـ **CGM** لو العيان على insulin وبيجيله hypo متكرر.
      - kind: check
        page: 153
        quote: "Self-monitoring of blood glucose (Gluco-check) frequently at different times of the day is more accurate for BG control in diabetic pts with CLD than A1c testing."
        question: "Best way to follow glucose control in a diabetic with cirrhosis?"
        options:
          - "Frequent SMBG at different times of day (CGM if on insulin with hypos)"
          - "A1C every 3 months as in any diabetic"
          - "A fasting glucose once a month at the clinic"
          - "Urine glucose dipsticks at home each day"
        answer: 0
        why:
          - "صح: الـ self-monitoring of blood glucose (SMBG) أدق من الـ A1C في الـ CLD، والـ continuous glucose monitoring (CGM) لو على insulin وعنده hypos متكررة."
          - "الـ A1C unreliable في الـ cirrhosis."
          - "قليل جدًا ومش بيبيّن الـ postprandial."
          - "مش في المحاضرة ومش دقيق."
      - kind: table
        page: 154
        quote: "1. Dietary modifications (fat< 30 %, protein < 20% CHO 50-60 % of total calories) should be encouraged\n  1. Low in saturated fat, salt, and refined sugar\n  2. High in complex carbohydrates, vegetables, fruits, and lean meat."
        title: "الـ lifestyle في الـ compensated CLD"
        columns: [Item, Target]
        rows:
          - [Fat, "<30% of calories"]
          - [Protein, "<20%"]
          - [Carbohydrate, "50–60%"]
          - [Exercise, "≥30 min, 3 times/week"]
          - [Weight loss, "7%, 0.5–1 kg/week"]
        hide: [[0, 1], [2, 1], [3, 1], [4, 1]]
      - kind: explain
        page: 154
        title: "ليه الأرقام دي في الـ compensated؟"
        quote: "Modest weight loss (7%) (0.5-1 K/week) can lead to improvements in\n            liver indices & decreases hepatic steatosis in patients with NASH."
        text: |
          الكتاب بيقول الـ **diet and lifestyle** هما ==cornerstones== لأي عيان سكر، وفي الـ **compensated CLD** نفس كلام عيان السكر العادي. السبب ورا كل رقم:

          - **Modest weight loss (7%) بـ 0.5–1 kg/week**: الكتاب بنفسه بيقول إنه بيحسّن الـ liver indices ويقلل الـ **hepatic steatosis** في الـ NASH. والتفسير المقبول (مش في الكتاب) للبطء: الخسّة السريعة جدًا ممكن تزوّد الدهون اللي رايحة للكبد.
          - **Low saturated fat و refined sugar**: لأنهم بالظبط اللي بيتحوّلوا لدهون في الكبد.
          - **Alcohol و smoking ممنوعين إجباري**: الكحول بيضرب الكبد مباشرة.

          أما الـ **decompensated** فأكتر من 50% عندهم malnutrition، فتقليل الأكل ممكن يأذيهم، والـ TLC بتبقى محدودة.
      - kind: aside
        tone: tip
        page: 154
        quote: "5. In patients with decompensated CLD:\n  1. More than 50% of these patients are malnourished .\n  2. So, TLC in such patients may be compromised by poor nutritional status and general health."
        text: "الـ **decompensated** حاجة تانية: ==أكتر من 50% malnourished==، فالـ TLC بتاعة الـ compensated ممكن ما تنفعش. وفي الكل: ==smoking وalcohol ممنوعين== إجباري."
      - kind: try
        items: [dm.L12.065, dm.L12.068, dm.L12.072, dm.L12.074]
    recap:
