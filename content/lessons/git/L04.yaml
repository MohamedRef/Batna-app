      - kind: explain
        page: 149
        quote: "AJCC TNM classification"
        title: "الـ T بالطبقة، والـ N بالعدد"
        text: |
          جدول الـ **AJCC TNM** في الكتاب:
          - **Tis**: high-grade dysplasia و carcinoma in situ.
          - **T1**: lamina propria و muscularis mucosae، أو الـ submucosa.
          - **T2**: muscularis propria. **T3**: adventitia.
          - **T4**: pleura أو pericardium أو diaphragm، أو أعضاء تانية (aorta، vertebral body، trachea).
          - **N1**: 1–2 nodes، **N2**: 3–6، **N3**: 7 أو أكتر.
          - **M1**: distant (retroperitoneal و para-aortic nodes، lung، liver، bone).

          التفسير المقبول (مش في الكتاب): لاحظ إن T3 = **adventitia** مش serosa، لأن المريء ماعندوش serosa. وده سبب إن الورم بيوصل للأعضاء اللي جنبه (T4) بسهولة: مفيش غلاف يوقفه. والـ T4 فيه مستويين: اللي ممكن يتشال معاه (pleura، pericardium، diaphragm) واللي غالبًا لأ (aorta، trachea، vertebra).
      - kind: figure
        page: 149
        title: "الـ EUS في سرطان المريء"
        image: { file: git/L04-eus-esophagus.webp, book: true }
        alt: "Two book endoscopic ultrasound images of the esophagus: the round probe sits in the lumen with the wall drawn as rings around it, and red arrows point to the finding beside the wall."
        caption: |
          ده شكل الـ **EUS**: الـ probe في النص، وحيطة المريء حواليه **حلقات** طبقة جوه طبقة.

          علشان كده هو اللي بيقيس ==عمق الورم== (الـ T)، وبيشوف الـ **nodes** اللي جنب الحيطة (الأسهم الحمرا).
      - kind: explain
        page: 150
        quote: "EGD Endoscopy: allow direct visualization and biopsy, measure proximal & distal distance of tumor from incisor, presence of Barrett‘s esophagus."
        title: "كل فحص بيجاوب على سؤال"
        text: |
          الكتاب:
          - **EGD**: يشوف ويعمل **biopsy**، ويقيس مسافة الورم من الـ **incisors** فوق وتحت، ويشوف فيه **Barrett's** ولا لأ.
          - **CT chest و abdomen**: ==essential for staging==: امتداد برّه الحيطة، nodes كبيرة، و visceral metastases.
          - **EUS**: عمق الورم والـ nodes، بس محدود بدرجة الـ **obstruction**.
          - **PET**: بيلاقي **15–20%** metastases ما بانتش في الـ CT والـ EUS، ومفيد في متابعة الاستجابة للعلاج، بس دقّته **واطية** في الـ local nodes.
          - **Barium swallow**: الحدود فوق وتحت.
          - **Bronchoscopy**: يستبعد **fistula** في أورام نص المريء.
          - وروتين: CBC، chemistries، LFTs.

          التفسير المقبول (مش في الكتاب): ليه الـ bronchoscopy في **نص** المريء بالذات؟ لأن الـ trachea والـ bronchus الشمال لازقين في المريء في المنطقة دي، فالورم ممكن يخرقهم ويعمل fistula، وده بيغيّر الخطة تمامًا (مش هينفع radiation بسهولة، والمريض هيكحّ مع الأكل).
      - kind: figure
        page: 150
        title: "سرطان المريء في المنظار وفي الـ barium"
        image: { file: git/L04-esophageal-cancer-egd-barium.webp, book: true }
        alt: "Book pictures of esophageal cancer. Top, endoscopy: early superficial lesion, circumferential ulcerating cancer, and malignant stricture. Bottom, barium swallow: rat tail appearance, a lower third cancer with an ulcerative filling defect, and an apple core appearance."
        caption: |
          فوق، في المنظار: **early superficial**، بعدين **circumferential ulceration**، بعدين **malignant stricture**.

          تحت، في الـ barium: ==rat tail==، و**filling defect** في التلت اللي تحت، و**apple core**. الـ barium بيحدّد حدود الورم فوق وتحت.
      - kind: match
