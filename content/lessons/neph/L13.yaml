      - kind: explain
        page: 444
        title: "الـ metformin على الـ eGFR (Figure 27)"
        quote: "Figure 27: Suggested approach in dosing metformin based on the level of kidney function.\neGFR < 30\n  Yes → Stop metformin; do not initiate metformin\n  No:\n    Dose initiation:\n      eGFR ≥ 60 or eGFR 45–59: Immediate release: Initial 500 mg or 850 mg once daily; Titrate upwards by 500 mg/d or 850 mg/d every 7 days until maximum dose. OR Extended release: If GI side effects from immediate release; Initial 500 mg daily; Titrate upwards by 500 mg/d every 7 days until maximum dose\n      eGFR 30–44: Initiate at half the dose and titrate upwards to half of maximum recommended dose\n    Monitor vitamin B12: Annually if on metformin for more than 4 years or at risk of vitamin B12 deficiency\n    Monitor kidney function:\n      eGFR ≥ 60: At least annually\n      eGFR 45–59 and eGFR 30–44: At least every 3–6 months\n    Subsequent dose adjustment:\n      eGFR ≥ 60: Continue same dose\n      eGFR 45–59: Continue same dose. Consider dose reduction in certain conditions (see text)\n      eGFR 30–44: Halve the dose\neGFR, estimated glomerular filtration rate (in ml/min per 1.73 m2); GI, gastrointestinal."
        text: |
          الأرقام من Figure 27 (ص 444):

          - **eGFR أقل من 30:** ==stop metformin==؛ وما تبدأهوش.
          - **30-44:** ابدأ بـ **نص الجرعة** ولو كان واخده **نصّها**.
          - **45-59 و 60+:** نفس الجرعة؛ تابع الكلى كل **3-6 شهور** (تحت 60) أو **سنويًا** (60+).
          - **Vitamin B12:** سنويًا لو بقاله أكتر من **4 سنين** على الـ metformin.

          ليه الحد ده؟ التفسير المقبول (مش في الكتاب): الـ metformin بيخرج من الكلية زي ما هو، فلما الكلية تبطّأ بيتراكم، والخوف من الـ **lactic acidosis**.

          وFigure 1 (ص 444) بتوريك إن **insulin** و **repaglinide** ماشيين لحد الـ hemodialysis، والـ gliptins بـ dose reduction، والـ **glibenclamide** و **glimepiride** و **acarbose** في stage 1-2 بس.
