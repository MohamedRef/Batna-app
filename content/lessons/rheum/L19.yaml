          - "الكتاب ما ذكرش الـ tubules في الـ EM."
          - "الـ interstitium مش في جملة الكتاب."
          - "الترسيب في الـ glomerulus نفسه."
      - kind: explain
        page: 319
        title: "Lupus nephritis"
        quote: "Lupus nephritis:\n  Ranging from mild proteinuria to glomerulonephritis.\n  Primary goal in treatment is slowing the progression.\n  Hypertension – new onset.\n  Peripheral edema, weight gain.\n  Haematuria.\n  Proteinure (>0.5g protein/d or 3+).\n  Casts in urine."
        text: |
          من **mild proteinuria** لحد **glomerulonephritis**. الهدف الأساسي: ==slowing the progression==.

          - **New-onset hypertension**
          - Edema و زيادة وزن
          - **Hematuria**
          - **Proteinuria > 0.5 g/day** أو **3+**
          - **Casts**

          ليه الهدف «slowing the progression» مش الشفا؟ لأن الـ LN مزمن وبيرجع، والخطر الحقيقي إنه يوصل ESRD (درس العلاج).
      - kind: reveal
        page: 319
        quote: "Proteinure (>0.5g protein/d or 3+)."
        prompt: "ليه كل علامة من علامات الـ lupus nephritis بتحصل؟ (new HTN، edema، hematuria، proteinuria، casts)"
        answer: |
          كله من الـ ==glomerulus الملتهب==:
          - **Proteinuria > 0.5 g/day أو 3+**: الـ filter باظ فالبروتين بيعدّي. لو كتير يوصل nephrotic.
          - **Edema و weight gain**: البروتين بيضيع والملح والمية بيتحجزوا.
          - **Hematuria** و **casts**: كرات دم بتعدّي من glomerulus ملتهب وتتقولب في الـ tubules (الـ cast دليل إن المصدر الكلية نفسها).
          - **New-onset hypertension**: الكلية الملتهبة بتحجز ملح ومية.

          التفسير المقبول (مش في الكتاب) في الـ edema والـ HTN. والرقم **0.5 g** هو نفسه اللي في الـ **renal criterion** في الـ 11 criteria، فاحفظه مرة واحدة.
