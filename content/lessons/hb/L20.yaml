        title: "نفس الرسمة في الكتاب"
        image: { file: hb/L20-sarcopenia-mechanisms.webp, book: true }
        alt: "Book figure: a liver with portosystemic shunting and hepatocellular dysfunction has arrows to low testosterone and growth hormone, raised ammonia, and accelerated starvation (low amino acids and intermediates). Ammonia has an arrow to myostatin. Endotoxin and mitochondrial dysfunction (low ATP, raised ROS) stand on their own, with no arrow from the liver. Hormones, ammonia, myostatin, endotoxin, mitochondrial dysfunction and the low amino acids all point to proteostasis. Proteostasis points to muscle mass, and muscle contractile function points back into proteostasis."
        caption: |
          دي الرسمة الأصلية اللي الرسمة اللي فاتت مبسّطاها. اقرا الأسهم كده:

          - الكبد (shunting و dysfunction) بيبعت لـ 3: هرمونات قليلة، ==ammonia== عالية، و accelerated starvation.
          - الـ ammonia بتطلّع ==myostatin==.
          - الـ endotoxin والـ mitochondrial dysfunction واقفين لوحدهم، من غير سهم من الكبد.
