        caption: |
          **شمال: Acute Kidney Injury**، و**يمين: Acute Heart Dysfunction**، وبينهم 5 طرق:

          - **فوق**: **Electrolyte & coagulation imbalances** (زي الـ hyperkalemia اللي بتعمل arrhythmia).
          - **البرتقاني**: **Hypertension**: GFR أقل ← **Na + H2O retention** ← ==pre-load أعلى== (القلب بيغرق).
          - **الأخضر**: **Sympathetic activation**.
          - **الأزرق**: **RAAS activation، vasoconstriction** (afterload أعلى).
          - **تحت (السلسلة)**: **Humoral signaling** ← **Endothelial activation** ← **Cytokine secretion** ← القلب.

          الرسمة هي عكس الـ CRS-1: الكلية هي اللي بدأت، و==المية والملح والبوتاسيوم والـ cytokines== هما اللي بيوقّعوا القلب.
