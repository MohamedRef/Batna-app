        page: 52
        title: "الملخص في عشر قواعد"
        quote: "In Summary for Elderly Patients:\n  Obtain a complete medication history\n  Review medications regularly and before prescribing a new medication\n  Know the actions, adverse events, and toxicity profiles of prescribed medications\n  Start long-term medications at a low dose and titrate dose on the basis of tolerability and response\n  Attempt to reach a therapeutic dose before switching to or adding another medication\n  Educate patient/ and/or caregiver about each medication\n  Avoid using one medication to treat the adverse events caused by another\n  Attempt to use one medication to treat 2 or more conditions\n  Avoid using drugs from the same class or with similar actions\n  Communicate with other prescribers."
        text: |
          - **Medication history** كاملة.
          - راجع الأدوية **بانتظام** وقبل أي دوا جديد.
          - اعرف الـ actions والـ adverse events والـ toxicity.
          - ابدأ الـ long-term **low** وظبّط على الـ response.
          - وصّل لـ **therapeutic dose** قبل ما تغيّر أو تزوّد.
          - علّم الحاج أو اللي بيرعاه.
          - ==ما تعالجش side effect بدوا تاني==.
          - حاول **دوا واحد لمرضين**.
          - ابعد عن أدوية **نفس الـ class**.
          - كلّم **الدكاترة التانيين**.

          ليه العشرة دول بالذات؟ لأنهم علاج كل المشاكل اللي اتكلمنا عنها: الـ history والمراجعة ضد الـ polypharmacy، والجرعة الصغيرة ضد تغيّر الـ PK، و"ما تعالجش side effect بدوا" ضد الـ prescribing cascade، والكلام مع الدكاترة ضد مشكلة الدكاترة الكتير اللي شفناها في رسمة ص 41.
