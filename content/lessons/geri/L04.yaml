          - "Physical examination"
          - "Cognitive assessment"
          - "Labs and biomarkers"
          - "Imaging"
          - "Gold standard tests"
        why: "الكتاب بيبدأ بالـ **history** من العيلة (التغيير في الـ activities of daily living (ADL))، وده بالظبط إجابة سؤال آخر المحاضرة: comprehensive clinical assessment قبل الـ magnetic resonance imaging (MRI) أو الدوا."
