  - id: git.L02.lesson4
    title: "سونار جوه المعدة، ومنظار جوه المنظار"
    hook: "EUS بيشوف اللي ورا الحيطة، والـ mother-baby scope بيدخل جوه الـ bile duct نفسه."
    minutes: 7
    pages: [63, 68]
    topics: [eus, cholangioscopy]
    goals:
      - "تعدّ دواعي الـ EUS التشخيصية والعلاجية"
      - "تشرح الـ mother-baby-scope"
    status: unverified
    steps:
      - kind: explain
        page: 63
        quote: "EUS allows examination of both the lining of GIT, but also of the wall of the tract and its surrounding structures"
        title: "الـ EUS بيشوف إيه؟"
        text: |
          ==EUS== = منظار في طرفه **ultrasound processor** (echoendoscope).

          بيشوف مش بس الـ **lining**، لكن كمان **جدار** الأمعاء وحواليها: **liver**، **pancreas**، **bile ducts**، و **lymph nodes**. وأحيانًا بيلاقي حاجات الـ imaging التاني مش بيلاقيها.

          الجديد: channel كبيرة **3.2 mm** لتدخلات أجرأ، و **3D EUS** بيعرض في أي plane.
      - kind: figure
        page: 65
        quote: "A tumour is shown to have infiltrated all wall layers."
        title: "الـ EUS قريب من العضو"
        alt: "Sketch: an endoscope in the stomach lumen with a small ultrasound transducer at its tip sending a fan of sound through the layered gastric wall to the pancreas, a lymph node and a bile duct behind it."
        caption: "الـ transducer صغير وعلى طرف المنظار، فبيقرب جدًا من العضو. علشان كده بيعمل **staging** للـ tumor في كل طبقات الحيطة، ويوصل للـ pancreas والـ nodes."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="20" width="310" height="60" rx="8" class="fg-box"/>
            <text x="20" y="44" class="t-sm t-mut">Stomach lumen</text>
            <path d="M20 60h200" class="fg-ink" stroke-width="10" stroke-linecap="round"/>
            <circle cx="228" cy="60" r="10" class="fg-acc"/>
            <text x="150" y="44" class="t-sm t-b">Echoendoscope tip</text>
            <rect x="10" y="84" width="310" height="10" class="fg-acc"/>
            <rect x="10" y="94" width="310" height="10" class="fg-thin"/>
            <rect x="10" y="104" width="310" height="10" class="fg-bad"/>
            <rect x="10" y="114" width="310" height="10" class="fg-thin"/>
            <text x="10" y="142" class="t-sm t-mut">Wall layers</text>
            <path d="M228 70L150 300M228 70L310 300" class="fg-thin" stroke-width="2"/>
            <ellipse cx="230" cy="200" rx="60" ry="26" class="fg-good"/>
            <text x="230" y="205" text-anchor="middle" class="t-sm t-b">Pancreas</text>
            <circle cx="175" cy="265" r="14" class="fg-bad"/>
            <text x="90" y="270" class="t-sm">Lymph node</text>
            <path d="M285 250c10 20 10 40 0 60" class="fg-ink" stroke-width="6" fill="none"/>
            <text x="250" y="320" class="t-sm">Bile duct</text>
          </svg>
      - kind: explain
        page: 64
        quote: "EUS is primarily used to detect and stage suspected cancer of the esophagus, stomach, pancreas and rectum"
        title: "دواعي الـ EUS (سؤال امتحان)"
        text: |
          **أساسًا**: يكتشف ويعمل ==staging== لـ cancer الـ **esophagus**، **stomach**، **pancreas**، **rectum** بالـ imaging والـ **FNA**.

          وكمان:
          - **Cytoimplant immunotherapy**: الإبرة بتوصل للـ tumor بدقة عالية.
          - **Fecal incontinence**، **staging lung cancer**، والأوعية بالـ **Doppler**.

          ويُنصح بيه في:
          - **Biopsy** من الـ LN المشكوك فيها، pancreatic masses، extra-intestinal masses.
          - علاج **achalasia**، و**hemostasis** لـ bleeding ulcers.
          - **Drainage** للـ cysts والـ **pseudocysts**.
          - **Celiac plexus neurolysis**.
          - **RF tumorectomy**.
      - kind: mnemonic
        page: 64
        quote: "Drainage of cysts and pancreatic pseudocyst. o Celiac plexus neurolysis. o EUS-guided R. frequency tumorectomy."
        word: "SONAR"
        parts:
          - { key: "S", text: "Stage cancer (esophagus, stomach, pancreas, rectum) with FNA" }
          - { key: "O", text: "Other evaluations: fecal incontinence, lung cancer, Doppler vessels" }
          - { key: "N", text: "Needle: biopsy of nodes and masses; cytoimplant immunotherapy" }
          - { key: "A", text: "Achalasia treatment and Arrest of ulcer bleeding" }
          - { key: "R", text: "Release: cyst/pseudocyst drainage, celiac plexus neurolysis, RF tumorectomy" }
        hook: "الـ EUS هو **SONAR** جوه البطن: بيشوف، بيغرز إبرة، وبيصرّف."
      - kind: check
        page: 64
        quote: "Drainage of cysts and pancreatic pseudocyst. o Celiac plexus neurolysis."
        question: "Which of these is NOT an EUS indication in the lecture?"
        options:
          - "Variceal band ligation"
          - "Celiac plexus neurolysis"
          - "Pancreatic pseudocyst drainage"
          - "Staging rectal cancer"
        answer: 0
        why:
          - "صح: الـ band ligation مش في قايمة الـ EUS."
          - "موجودة في القايمة."
          - "موجودة في القايمة."
          - "الـ rectum من الأربعة اللي بيعمل لهم staging."
      - kind: explain
        page: 66
        quote: "A thin fiberscope (2-3.5 mm) is inserted into a therapeutic channels of a large duodenoscope, into the duct after endoscopic sphincterotomy."
        title: "الـ mother-baby scope"
        text: |
          في الـ **peroral cholangioscopy والـ pancreatoscopy**: منظار رفيع (**baby**، **2-3.5 mm**) بيدخل من الـ channel بتاعة **duodenoscope** كبير (**mother**) جوه الـ duct، **بعد sphincterotomy**.

          الـ biopsy channel بتاعه بيسمح بـ:
          - **Tissue sampling**
          - **Dye** catheters
          - **Laser lithotripsy** probes

          والأجهزة الجديدة بتتجرّب **من غير sphincterotomy**.
      - kind: aside
        tone: joke
        text: |
          الـ mother-baby scope ده أصدق تمثيل للأم المصرية: شايلة ابنها جوّاها لحد آخر لحظة، ولما يطلع يروح على طول للحتة الضيقة اللي محدش عارف يوصلها. 😄
      - kind: try
        items: [git.L02.074, git.L02.077, git.L02.078, git.L02.081]
    recap:
      - "EUS: الجدار وما حوله؛ staging لـ esophagus، stomach، pancreas، rectum مع FNA."
      - "تدخلات EUS: biopsy، achalasia، hemostasis، pseudocyst drainage، celiac neurolysis، RF tumorectomy (SONAR)."
      - "Mother-baby: baby 2-3.5 mm من الـ duodenoscope بعد sphincterotomy؛ sampling، dye، laser lithotripsy."
