  - id: hem.L12.lesson4
    title: "Hodgkin في العيادة: من الرقبة لـ ABVD"
    hook: "غدة في الرقبة مطاطية ومش بتوجع، وهرش، وعرق بالليل. ومعاها ESR عالي. يلا نكمّل."
    minutes: 10
    pages: [196, 198]
    topics: [hl-clinical, hl-management]
    goals:
      - "توصف الغدة وتعرف أماكنها بالنسب"
      - "تعرف الـ constitutional symptoms والـ organomegaly"
      - "تعرف الـ investigations والعلاج حسب الـ stage، وسبب كل واحد"
    status: unverified
    steps:
      - kind: explain
        page: 196
        quote: "Painless, non-tender, asymmetrical, firm, discrete and rubbery. Lymph nodes may become matted."
        title: "الغدة"
        text: |
          ==Painless, non-tender==، asymmetrical، firm، discrete و ==rubbery==. وممكن تلزق في بعض (**matted**).

          ليه مش بتوجع؟ التفسير المقبول (مش في الكتاب): الغدة اللي بتوجع عادةً بتكبر **بسرعة** (infection) فبتشد الـ capsule. الـ lymphoma بيكبر **على مهل**، فالـ capsule بتلحق تتمط. وعشان كده «غدة مش بتوجع ومكملة أسابيع» أخطر من غدة بتوجع: دي اللي محتاجة biopsy.
      - kind: figure
        page: 196
        quote: "Hodgkin's disease: (a) high power view of a lymph node biopsy showing two typical multinucleate Reed–Sternberg cells, one with a characteristic owl eye appearance, surrounded by lymphocytes, histiocytes and an eosinophil; (b) mixed cellularity; and (c) nodular sclerosing Hodgkin's lymphoma."
        title: "صورة الكتاب: الـ biopsy في Hodgkin"
        image: { file: hem/L12-hodgkin-histology.webp, book: true }
        alt: "Three book photomicrographs of lymph node biopsies in Hodgkin disease. (a) Top left, high power: a large pale Reed–Sternberg cell in the centre with two nuclei and large nucleoli, surrounded by small dark lymphocytes and other cells. (b) Top right: a dense mixed population of small cells with scattered larger cells. (c) Bottom left, low power: rounded blue nodules of cells separated by pink bands of fibrous tissue."
        caption: |
          تلات صور من غدة متشالة، والحروف تحت كل صورة:

          - **(a) فوق شمال** (تكبير كبير): في النص خلية **كبيرة فاتحة** بنواتين وnucleoli كبار = ==Reed–Sternberg== بشكل الـ **owl eye**، وحواليها lymphocytes غامقة صغيرة وhistiocytes وeosinophil.
          - **(b) فوق يمين**: خلايا كتير مختلطة صغيرة وكبيرة = **mixed cellularity**.
          - **(c) تحت شمال** (تكبير صغير): **nodules** زرقا مفصولة بـ **حزم بمبي من الألياف** = ==nodular sclerosis==.

          ده نفس كلام الكتاب: التشخيص بالـ **excision biopsy** للغدة، والـ RS cell هي المفتاح، والـ subtype بيبان من شكل الغدة كلها.
      - kind: figure
        page: 196
        quote: "- Cervical nodes; are involved in 60 – 70 %\n- Axillary nodes; in 10 – 15 %\n- Inguinal nodes; in 6 – 12 %"
        title: "فين الغدد؟"
        alt: "A simple body outline with node sites and percentages: cervical 60 to 70 percent, mediastinal 6 to 11 percent, axillary 10 to 15 percent, retroperitoneal often (seen on CT), inguinal 6 to 12 percent."
        caption: "الرقبة بعيد في الأول. الـ mediastinal علامة الـ nodular sclerosing."
        svg: |
          <svg viewBox="0 0 330 290" xmlns="http://www.w3.org/2000/svg">
            <circle cx="165" cy="35" r="25" class="fg-box"/>
            <rect x="120" y="65" width="90" height="150" rx="25" class="fg-box"/>
            <rect x="140" y="215" width="20" height="65" class="fg-box"/>
            <rect x="170" y="215" width="20" height="65" class="fg-box"/>
            <circle cx="150" cy="65" r="7" class="fg-dot-bad"/>
            <text x="10" y="62" class="t-sm t-b">Cervical 60-70%</text>
            <circle cx="165" cy="100" r="7" class="fg-dot-acc"/>
            <text x="220" y="100" class="t-sm">Mediastinal 6-11%</text>
            <circle cx="125" cy="90" r="6" class="fg-dot-bad"/>
            <text x="10" y="112" class="t-sm">Axillary 10-15%</text>
            <circle cx="165" cy="165" r="6" class="fg-dot-acc"/>
            <text x="220" y="165" class="t-sm">Retroperitoneal</text>
            <text x="220" y="181" class="t-sm t-mut">(on CT)</text>
            <circle cx="148" cy="210" r="6" class="fg-dot-bad"/>
            <text x="10" y="212" class="t-sm">Inguinal 6-12%</text>
          </svg>
      - kind: explain
        page: 196
        quote: "- Mediastinal L.N. enlargement; in 6-11% of patients. This is a feature of the nodular sclerosing type."
        title: "الـ mediastinum"
        text: |
          - ==Mediastinal== nodes في **6-11%**، وده feature للـ **nodular sclerosing**.
          - ممكن يعمل **pleural effusion** أو ==superior vena cava obstruction==.
          - الـ **retroperitoneal** بيتصاب كتير بس بيبان على الـ computed tomography (CT).

          ليه الـ SVC بالذات؟ لأنه **وريد** جداره رفيع وضغطه واطي، قاعد جنب الغدد دي في الـ mediastinum، فأول ما الكتلة تكبر بتضغطه قبل الشرايين. والـ retroperitoneal ما بيبانش بالكشف لأنه **ورا** البطن، فمحتاج CT (ص 198).
      - kind: figure
        page: 197
        quote: "Chest X-ray in Hodgkin's lymphoma showing widespread enlargement of hilar and mediastinal lymph nodes with associated collapse of the right upper lobe and infiltration or possibly pneumonic changes in the mid zone of the left lung."
        title: "صورة الكتاب: الـ chest X-ray في Hodgkin"
        image: { file: hem/L12-hodgkin-cxr.webp, book: true }
        alt: "Book chest X-ray: a widened, lobulated mediastinal and hilar shadow, the right upper zone white from lobar collapse, and hazy shadowing in the mid zone of the left lung."
        caption: |
          صورة صدر عادية، والكتاب بيقرأها كده:

          - **في النص**: ظل الـ mediastinum والـ hilum **عريض ومنفوخ** = غدد ==hilar و mediastinal== كبيرة.
          - **فوق على شمال الصورة** (يمين العيان): بياض في الحتة العليا = **collapse** في الـ right upper lobe، من الغدد اللي بتضغط على الشعب.
          - **نص الرئة الشمال** (يمين الصورة): تعتيم = infiltration أو pneumonia.

          يعني الغدد الـ mediastinal مش بس «لقطة في الـ CT»: ممكن تكبر لحد ما تقفل شعبة أو تضغط الـ ==SVC==.
      - kind: figure
        page: 197
        quote: "Hodgkin's lymphoma (nodular sclerosing type)"
        title: "صورة الكتاب: الـ CT في الـ nodular sclerosing"
        image: { file: hem/L12-hodgkin-ct.webp, book: true }
        alt: "Book axial CT scan of the chest: a lobulated soft-tissue mass in the anterior mediastinum in front of the great vessels, with a white arrow pointing to its right edge; both lungs are dark around it."
        caption: |
          قطاع CT في الصدر، والكتاب كاتب إنه **Hodgkin's lymphoma من النوع الـ nodular sclerosing**:

          - **السهم الأبيض** (فوق على الشمال) بيشاور على كتلة رمادي في ==الـ anterior mediastinum==، قدام القلب والأوعية الكبيرة.
          - الكتلة دي **غدد كبيرة** ملزوقة في بعض، والرئتين سود حواليها.

          ودي العلامة اللي الخطوة اللي فوق قالتها: الـ mediastinal nodes بتاعة الـ ==nodular sclerosing==، اللي هو أشهر نوع في الشباب.
      - kind: explain
        remind: [hem.L12.037]
        page: 197
        quote: "Splenomegaly occurs during course of disease in 50% of cases, but seldom massive."
        title: "الأعضاء والأعراض"
        text: |
          - **Splenomegaly** في ==50%== أثناء المرض، بس **seldom massive**. والكبد ممكن.
          - النخاع، الـ gastrointestinal tract (GIT)، العضم، الرئة والـ spinal cord: **unusual**.

          الـ **constitutional symptoms**:

          - **Fever 30%**، continuous أو **cyclic**.
          - Weight loss، و profuse sweating بالليل.
          - ==Pruritus 25%==، وممكن يبقى severe.
          - Fatigue، anorexia و cachexia.

          ليه أعراض كتير كده من ورم خلاياه الخبيثة قليلة؟ التفسير المقبول (مش في الكتاب): الـ RS cell بتطلع **cytokines** كتير، وهي اللي بتلم الزحمة اللي حواليها (eosinophils، lymphocytes). نفس الـ cytokines دي بتعمل السخونية والعرق والهرش، وبتفسر الـ **eosinophilia** اللي هتشوفها في الـ blood picture (ص 198).
      - kind: aside
        tone: exam
