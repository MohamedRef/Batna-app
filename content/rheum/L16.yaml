    src: { page: 258, quote: "Anticitrulline antibody.\n  Antikeratin antibodies were described in 1970.\n  Their primary target antigen is the filament aggregating protein filaggrin.\n  Done on cryosection of rat oesaphagus by indirect immunofluorescence.\n  These antibodies actually bind to epitopes on filaggrin that contain citrulline derived by post-translational deamination of arginine.\n  Elisa determination of antibodies to citrullinated antigens is now used (Anticyclic citrullinated peptides or anti-CCP)." }
