  - id: hb.L03.lesson3
    title: "من الضغط للدوالي"
    hook: "عشرة تبني، اتناشر تفرقع. وليه الدوالي اللي نزفت مرة هتنزف تاني في 63% من الحالات؟"
    minutes: 8
    pages: [43, 45]
    topics: [csph, phg]
    goals:
      - "تعرّف الـ CSPH وتقول هو بيتنبأ بإيه"
      - "تحفظ أرقام الـ HVPG: 10 للتكوين و 12 للنزيف"
      - "ترسم الـ natural history للـ varices بالنسب، ومستوى الوقاية في كل مرحلة"
      - "تعرف إن الـ PHG تشخيصها بالمنظار"
    status: unverified
    steps:
      - kind: explain
        page: 43
        title: "الـ CSPH: الرقم اللي بيفرق"
        text: |
          الـ **clinically significant portal hypertension (CSPH)** هو **HVPG > 10 mmHg**.

          الضغط ده **بيتنبأ** بتلات حاجات:
          - **Development of varices**
          - **Clinical decompensation**
          - **HCC**

          وفي الـ biopsy بتاع مريض الـ cirrhosis، فيه finding**ين** بيتنبأوا بالـ CSPH **independently**: **thick fibrous septae** و **small nodule size**. (منطقي: septa تخينة ونودولز صغيرة كتير = كبد مقفول أكتر.)
      - kind: figure
        page: 43
        title: "ترمومتر الـ HVPG"
        alt: "A vertical HVPG scale in mmHg from 0 at the bottom to 25 at the top. 1 to 5 is normal. Above 5 is portal hypertension (Baveno VII). Above 10 is CSPH: varices form, and it predicts decompensation and HCC. Above 12 varices can rupture and bleed. Above 20 marks a high-risk bleeder in whom early TIPS improves survival."
        caption: "اطلع على الترمومتر: **أكتر من 10** الدوالي تتكوّن، **أكتر من 12** ممكن تنفجر، **أكتر من 20** نزيف high-risk (هنرجعله مع الـ TIPS). الـ 5 من Baveno VII مش من الكتاب."
        svg: |
          <svg viewBox="0 0 330 310" xmlns="http://www.w3.org/2000/svg">
            <text x="8" y="18" class="t-b">HVPG (mmHg)</text>
            <rect x="40" y="250" width="36" height="40" class="fg-good"/>
            <rect x="40" y="190" width="36" height="60" class="fg-acc"/>
            <rect x="40" y="140" width="36" height="50" class="fg-bad"/>
            <rect x="40" y="80" width="36" height="60" class="fg-dot-bad"/>
            <rect x="40" y="34" width="36" height="46" class="fg-dot-bad"/>
            <text x="34" y="294" text-anchor="end" class="t-sm">0</text>
            <text x="34" y="254" text-anchor="end" class="t-sm t-b">5</text>
            <text x="34" y="194" text-anchor="end" class="t-sm t-b">10</text>
            <text x="34" y="144" text-anchor="end" class="t-sm t-b">12</text>
            <text x="34" y="84" text-anchor="end" class="t-sm t-b">20</text>
            <path d="M76 250H92M76 190H92M76 140H92M76 80H92" class="fg-ink"/>
            <text x="98" y="274" class="t-sm">1–5: normal</text>
            <text x="98" y="244" class="t-sm t-mut">&gt; 5: portal hypertension (Baveno VII)</text>
            <text x="98" y="186" class="t-sm t-b">&gt; 10: CSPH, varices form</text>
            <text x="98" y="202" class="t-sm t-mut">predicts decompensation, HCC</text>
            <text x="98" y="136" class="t-sm t-b t-bad">&gt; 12: varices can rupture</text>
            <text x="98" y="76" class="t-sm t-b t-bad">&gt; 20: high-risk bleeder</text>
            <text x="98" y="92" class="t-sm t-mut">early TIPS improves survival</text>
          </svg>
      - kind: aside
        tone: tip
        page: 43
        text: |
          احفظها كده: **عشرة تبني، اتناشر تفرقع، عشرين نجري على TIPS.**

          - فوق **10 mmHg**: الـ varices بتتكوّن، يعني formation.
          - فوق **12 mmHg**: الـ varices ممكن تنفجر، يعني rupture.
          - فوق **20 mmHg**: high risk، وده مريض الـ early TIPS (صفحة 55).
      - kind: check
        page: 43
        question: "A patient with cirrhosis has an HVPG of 14 mmHg. What does this mean according to the lecture?"
        options:
          - "CSPH, and above the level at which varices can rupture"
          - "Normal portal pressure"
          - "Portal hypertension, but below the level at which varices form"
          - "Varices can form but cannot yet bleed"
        answer: 0
        why:
          - "صح: 14 **أكتر من 10** يعني CSPH، و **أكتر من 12** يعني الـ varices ممكن تنفجر."
          - "طبيعي تحت 5 (Baveno VII)، و 14 بعيد خالص."
          - "الـ varices بتتكوّن من **أكتر من 10**، و 14 فوقها."
          - "ده يصح بين 10 و 12. الـ 14 عدّت عتبة الـ **rupture (أكتر من 12)**."
      - kind: figure
        page: 44
        title: "التاريخ الطبيعي للـ varices"
        alt: "A ladder of stages down the page with prevention levels beside them. No varices, about half of cirrhotics: varices form at 4 to 5 percent per year; prevention is preventing variceal formation. Small varices, under 10 percent bleed at 2 years: grow to large at 12 percent per year; prevention is preventing variceal growth. Large varices, over 25 percent bleed at 2 years: prevention is preventing first bleeding. Variceal bleeding: treating acute bleeding. Rebleeding, 63 percent at 2 years: prevention is preventing rebleeding."
        caption: "كل درجة في السلم ليها وقاية: **pre-primary** (قبل ما تتكوّن)، منع النمو، **primary** (قبل أول نزيف)، علاج النزيف، و **secondary** (منع الـ rebleeding)."
        svg: |
