        page: 108
        quote: "Livedo reticularis and other signs of emboli to the legs"
        prompt: "وصّل العلامة بالسبب:"
        pairs:
          - ["Palpable purpura + pulmonary hemorrhage", "Systemic vasculitis with GN"]
          - ["Livedo reticularis", "Atheroembolic disease"]
          - ["Limb ischemia", "Rhabdomyolysis"]
          - ["Diarrhea, then AKI", "HUS D+"]
          - ["TMA + fever + neurological signs", "TTP"]
        why: "الـ purpura مع lung hemorrhage و sinusitis = vasculitis. الـ livedo = atheroemboli. الـ limb ischemia = rhabdo. والـ thrombotic microangiopathy (TMA) بعد إسهال = hemolytic uremic syndrome (HUS)، ولو معاها حرارة وأعراض عصبية = thrombotic thrombocytopenic purpura (TTP)."
      - kind: explain
        page: 108
        quote: "Urinary Indices: FENA and Urinary Sodium"
        title: "ليه التحاليل دي؟"
        text: |
          الكتاب: الدم: **CBC، BUN/creatinine، electrolytes، uric acid، PT/PTT**. البول: **volume، proteinuria، urinary indices (FENa و urine Na)، sediment**.

          التفسير المقبول (مش في الكتاب):

          - **CBC:** schistocytes وصفايح قليلة = TMA، أنيميا = نزيف أو مرض مزمن.
          - **Uric acid:** عالي جدًا في الـ tumor lysis.
          - **PT/PTT:** DIC في الـ sepsis، وقبل أي biopsy.
          - **Urinary indices:** **عشان** نعرف الـ tubule لسه بيحوّش صوديوم (prerenal) ولا لأ (ATN).
          - **Sediment:** هو "biopsy سايلة" بيقول المكان: glomerulus ولا tubule ولا interstitium.
