items:
- id: res.L16.001
  kind: card
  topic: normal
  front: When is a variable said to be normally distributed?
  back: When its distribution has the shape of a normal curve (the Gaussian distribution, a bell-shaped curve).
  src:
    page: 2
    quote: A variable is said to be normally distributed or to have a normal distribution if its distribution has the shape
      of a normal curve.
  status: unverified
  tags: [high-yield]
- id: res.L16.002
  kind: mcq
  topic: normal
  stem: The normal distribution is used to describe which type of variable?
  options:
  - Continuous quantitative variables
  - Nominal qualitative variables
  - Ordinal qualitative variables
  - Any variable that can be counted as a number
  answer: 0
  why:
  - The slide says the normal distribution describes continuous quantitative variables, like weight or a test score.
  - Nominal data (blood group, sex) have categories, not a curve of values.
  - Ordinal data (stage I–IV) are ranked categories, not continuous values.
  - A count can be quantitative, but the slide ties the normal curve to continuous quantitative variables.
  src:
    page: 3
    quote: Normal Distribution is used to describe continuous quantitative variables.
  status: unverified
  tags: [high-yield]
- id: res.L16.003
  kind: card
  topic: normal
  front: Why does the normal distribution matter for statistical testing?
  back: The normal distribution and normal approximations are the bases of analytic statistical tests.
  src:
    page: 3
    quote: The normal distribution & normal approximations are the bases of analytic statistical tests.
  status: unverified
- id: res.L16.004
