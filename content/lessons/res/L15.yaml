  - kind: check
    page: 21
    quote: |-
      2- All of the following are examples of quantitative variable EXCEPT:
      a- blood pressure b- blood group
      c- Hb percent d- length of hospital stay
    question: 'All of the following are quantitative EXCEPT:'
    options:
    - Blood group
    - Blood pressure
    - Hb percent
    - Length of hospital stay
    answer: 0
