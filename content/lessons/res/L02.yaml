    title: "الوفيات: crude، specific، fatality، ولا proportionate؟"
    hook: "6000 وفاة في مقاطعة، 1200 منهم leukemia. ده 20%؟ ولا 0.48 per 1000؟ الإجابتين صح، بس لسؤالين مختلفين."
    minutes: 10
    pages: [51, 71]
    topics: [mortality]
    goals:
      - "تفرق بين crude وcause-specific وproportionate وcase fatality بالمقام"
