  - id: res.L11.lesson6
    title: "نحسبها بإيدينا: survey و case-control و cohort"
    hook: "نفس أرقام شاشات Epi Info في المحاضرة، بس تفهم كل رقم جه منين."
    minutes: 8
    pages: [72, 89]
    topics: [calculation]
    goals:
