- id: hb.L09.047
  kind: mcq
  topic: diagnosis
  stem: A 50-year-old woman has ascites. Serum albumin 3.2 g/dL, ascitic albumin 2.5 g/dL, ascitic amylase very
    high. She had acute pancreatitis 6 weeks ago. What is the best interpretation?
  options:
  - High-SAAG ascites from portal vein thrombosis
  - Low-SAAG pancreatic ascites
  - High-SAAG cirrhotic ascites with SBP
  - Low-SAAG chylous ascites
  - SAAG cannot be used when amylase is high
  answer: 1
  why:
  - SAAG here is 0.7 g/dL (low), so not portal hypertension.
  - 'Correct: SAAG 3.2 − 2.5 = 0.7 g/dL (low); high amylase points to pancreatic disease.'
  - SAAG is low, and nothing suggests SBP.
  - Chylous ascites is confirmed by triglycerides, not amylase.
  - SAAG is valid regardless of amylase; amylase is a special test added to it.
  src:
    page: 150
    quote: "SAAG is < 1.1 g/dl (Low SAAG) suggests non- portal hypertension ascites."
  status: unverified
- id: hb.L09.048
  kind: mcq
  topic: diagnosis
  stem: Which ascitic fluid result best suggests ascites from heart failure rather than from cirrhosis?
  options:
  - SAAG 1.6 g/dL, total protein 3.0 g/dL
  - SAAG 1.6 g/dL, total protein 1.0 g/dL
  - SAAG 0.8 g/dL, total protein 3.5 g/dL
  - SAAG 0.8 g/dL, total protein 1.0 g/dL
  - PMN 400/mm³ with Gram-negative bacilli
  answer: 0
  why:
  - 'Correct: both have high SAAG, but heart failure gives high protein (>2.5 g/dL).'
  - High SAAG with low protein (<1.5 g/dL) is typical of cirrhosis.
  - Low SAAG is not portal-hypertensive; high protein fits malignancy or TB.
  - Low SAAG with low protein fits hypoproteinemia (e.g. nephrotic syndrome).
