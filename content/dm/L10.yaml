      - Add NPH, detemir, glargine or degludec at bedtime
      - Start with 10 units (or 0.15 U/kg)
    pass: 3
    src: { page: 127, quote: "Continue the Maximal dose of OADs. 2. Add NPH, Detemir, Glargine, or Degludec at bedtime. 3. Start by 10 units (or: 0.15 U/Kg)." }
