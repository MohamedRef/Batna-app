      - kind: figure
        page: 139
        quote: "Approach to thrombocytosis"
        title: "صورة الكتاب: الـ algorithm زي ما هو"
        image: { file: hem/L09-thrombocytosis-algorithm.webp, book: true }
        alt: "Book flowchart. Top: platelet count above 450,000 per microlitre. Is there a life-long history and/or family history of thrombocytosis? Yes, left: inherited thrombocytosis likely, consider testing for THPO/MPL mutations. No, right: history, physical exam, blood smear, ESR/CRP. Purple box: is an underlying reactive disorder present? Yes, left: reactive thrombocytosis, platelet count should normalize with resolution of the underlying disorder, if not continue with the algorithm. No, right: evaluate for clonal thrombocytosis with BCR-ABL, JAK2 testing, bone marrow evaluation and cytogenetics. Three branches at the bottom: BCR-ABL positive to CML; JAK2 positive to MPN (PV, ET, MF); BCR-ABL and JAK2 negative to evaluate for MPN or MDS."
        caption: |
          ده الـ algorithm بنفس صناديق الكتاب، اللي الرسمة اللي فوق منقولة منه:

          - **فوق** (البمبي): الصفائح **فوق 450,000/µL**.
          - **السؤال الأصفر**: فيه **life-long أو family history**؟ **Yes** ← شمال: inherited، اعمل **THPO/MPL mutations**. **No** ← يمين: history، exam، **blood smear**، و **ESR/CRP**.
          - **الصندوق البنفسجي في النص**: فيه ==reactive disorder==؟ **Yes** ← شمال (البرتقاني): reactive، والصفائح لازم ترجع طبيعي لما السبب يتعالج، ولو مارجعتش كمّل الـ algorithm. **No** ← يمين: دوّر على **clonal** بالـ BCR-ABL والـ JAK2 والنخاع والـ cytogenetics.
          - **تحت** تلات فروع: **BCR-ABL+** ← ==CML==، **JAK2+** ← MPN (PV، ET، MF)، و **الاتنين سلبي** ← evaluate for MPN أو MDS (زي الـ CALR والـ MPL).

          يعني الـ ET تشخيص بييجي في **آخر** الطريق، بعد ما تستبعد الوراثي والـ reactive والـ CML.
      - kind: explain
        page: 139
        title: "الـ algorithm بيسأل الأسئلة دي بالترتيب ده ليه؟"
        quote: "Approach to thrombocytosis\n  Platelet count >450,000/μl: Is there a life-long history and/or family history of thrombocytosis?\n    Yes: Inherited thrombocytosis likely. Consider testing for THPO/MPL mutations\n    No: History/physical exam, Blood smear evaluation, ESR/CRP testing. Is an underlying reactive disorder present?\n      Yes: Reactive thrombocytosis. Platelet count should normalize with resolution of underlying disorder. If not, continue with algorithm.\n      No: Evaluate for clonal thrombocytosis. BCR–ABL, JAK2 testing, bone marrow evaluation, cytogenetics.\n        BCR–ABL+: CML\n        JAK-2+: MPN (PV, ET, MF)\n        BCR–ABL–, JAK-2–: Evaluate for MPN or MDS"
        text: |
          1. **Life-long أو family history؟** لو أيوه، غالبًا ==inherited thrombocytosis== (اختبر **THPO/MPL**). ده بيوفّر عليك نخاع وقلق: الحالة دي موجودة من زمان ومش ورم جديد.
          2. **History، exam، smear، ESR/CRP**: دوّر على **reactive cause**. لو لقيته، عالجه والعد **should normalize**. لو ما رجعش، كمّل الـ algorithm.
          3. مفيش سبب؟ ادخل على الـ **clonal work-up**: **BCR-ABL**، **JAK2**، النخاع، cytogenetics.

          ليه الـ BCR-ABL في الأول؟ التفسير المقبول (مش في الكتاب): الـ **CML** ممكن تبدأ بصفائح عالية لوحدها، وعلاجها (tyrosine kinase inhibitors) مختلف تمامًا عن الـ ET. لو فاتتك، المريض خسر علاج ممتاز.
      - kind: check
        page: 138
        quote: "Reactive thrombocytosis can sometimes be marked and, occasionally, the platelet count can be greater than 1000 X10⁹/L. There is usually evidence of on-going inflammation in the form of ↑ESR or CRP but this is not always the case."
        question: "Recovering from pneumonia: platelets 1,080, CRP 140. Which is true?"
        options: ["Reactive thrombocytosis can exceed 1000", "Above 1000 proves an MPN", "Reactive always has a normal CRP", "Start hydroxycarbamide now"]
        answer: 0
        why:
          - "صح: الـ reactive ممكن يعدّي 1000 أحيانًا، والـ CRP العالي بيأكد."
          - "الرقم لوحده ما بيثبتش myeloproliferative neoplasm (MPN)."
          - "بالعكس: غالبًا الـ ESR أو CRP عالي."
          - "عالج السبب وأعد العد؛ مفيش cytoreduction."
      - kind: check
        page: 138
        quote: "Inflammatory, vasculitic and allergic disorders, acute and chronic infections, malignancies, hemolysis, iron deficiency and blood loss can all lead to an increased platelet count."
        question: "Woman, 34, heavy periods, ferritin 6, platelets 640 × 10⁹/L, no history of high platelets. Best next step?"
        options: ["Treat the iron deficiency and repeat the count", "JAK2 V617F and bone marrow now", "Start low-dose aspirin for ET", "Start hydroxycarbamide"]
        answer: 0
        why:
