schema: batna.content/v1
lecture: rheum.L15
title: Osteoarthritis update
author: Prof. Dr. Manal Tayel
book: { chapter: 3, pages: [233, 240] }
topics:
  - { id: concept, title: "OA as a whole-joint disease" }
  - { id: pathogenesis, title: "Pathogenesis: beyond mechanics, crosstalk and synovitis" }
  - { id: diagnosis, title: "Essentials of diagnosis and X-ray" }
  - { id: imaging, title: "What's new in ultrasound and MRI" }
  - { id: risk-types, title: "Risk factors and types" }
  - { id: treatment, title: "Treatment goals and measures" }
  - { id: ia-cell, title: "Intra-articular, cellular and gene therapy" }
  - { id: dmoad, title: "DMOADs, implants and joint replacement" }
items:
  # ---------- p233: concept, pathogenesis ----------
  - id: rheum.L15.001
    kind: card
    topic: concept
    front: How is osteoarthritis viewed now, compared with the old view?
    back: No longer simple wear and tear; a progressive, complex, multifactorial disorder of the whole joint.
    src: { page: 233, quote: "Now OA is considered as a progressive complex multifactorial disorder of the whole joint" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L15.002
    kind: enumerate
    topic: concept
    prompt: Tissues of the whole joint involved in OA.
    points:
      - Articular cartilage
      - Subchondral bone
      - Synovium
      - Ligaments
      - Capsule
    pass: 4
    src: { page: 233, quote: "articular cartilage, subchondral bone, synovium, ligaments and capsule." }
    status: unverified
  - id: rheum.L15.003
    kind: enumerate
    topic: pathogenesis
    prompt: Why OA cannot be explained by mechanical factors alone.
    points:
      - Obesity is not linked to more hip OA, though the hip bears weight
      - Obese people have more hand OA, though hands bear no extra load
      - Running stresses hips and knees but does not raise OA incidence
      - Synovitis appears before visible cartilage degeneration
    pass: 3
    src: { page: 233, quote: "Obese individuals have higher rates of hand OA, whereas they do not experience greater stresses in those joints." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L15.004
    kind: card
    topic: pathogenesis
    front: What does more hand OA in obese people suggest about pathogenesis?
    back: A non-mechanical (systemic, metabolic or inflammatory) factor, since the hands carry no extra load.
    src: { page: 233, quote: "Obese individuals have higher rates of hand OA, whereas they do not experience greater stresses in those joints." }
    status: unverified
  - id: rheum.L15.005
    kind: card
    topic: pathogenesis
    front: How was synovitis shown to precede visible cartilage degeneration in OA?
    back: By arthroscopy, MRI or ultrasound, and histologically by synovial hyperplasia and inflammatory infiltrates.
    src: { page: 233, quote: "Synovitis even before visible cartilage degeneration was detected by arthroscopy, MRI or ultrasonography" }
    status: unverified
  - id: rheum.L15.006
    kind: card
    topic: pathogenesis
    front: Name the tissue crosstalks implicated in OA.
    back: Infrapatellar fat pad with neighbouring articular tissues; and bone, cartilage and synovium with each other.
    src: { page: 234, quote: "Infra patellar fat pad & neighboring articular tissues cross talk. Bone, cartilage, synovium Cross talks." }
    status: unverified
  # ---------- p234 ----------
  - id: rheum.L15.007
    kind: enumerate
    topic: pathogenesis
    prompt: Results of unhealthy crosstalk in the OA joint.
    points:
      - Failure of repair mechanisms
      - Chondrocyte apoptosis
      - Osteophyte production
      - Dysregulated bone remodeling
      - Bone attrition and sclerosis
    pass: 4
    src: { page: 234, quote: "exacerbates the failure of repair mechanisms, chondrocyte apoptosis, osteophyte production, dysregulated bone remodeling , bone attrition and sclerosis." }
    status: unverified
  - id: rheum.L15.008
    kind: card
    topic: pathogenesis
    front: What do synovial macrophages respond to in OA?
    back: Danger-associated molecular patterns, including cartilage fragments and intracellular proteins from necrotic cells.
    src: { page: 234, quote: "synovial macrophages respond to danger-associated molecular associated patterns, including cartilage fragments and intracellular proteins from necrotic cells" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L15.009
    kind: cloze
    topic: pathogenesis
    text: Activated synovial macrophages damage cartilage and bone in OA by releasing {{c1::IL-1β}}, {{c2::TNF-α}} and {{c3::TGF-β}}.
    src: { page: 234, quote: "through the release of cytokines such as IL-1b,TNF-a and TGF-b." }
    status: unverified
  - id: rheum.L15.010
    kind: enumerate
    topic: diagnosis
    prompt: Essentials of diagnosis of OA (history).
    points:
      - Pain brought on and worsened by activity, relieved by rest
      - Self-limited stiffness on waking or after prolonged sitting
      - No prominent constitutional symptoms
    pass: 3
    src: { page: 234, quote: "Joint pain brought on and exacerbated by activity and relieved with rest." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L15.011
    kind: enumerate
    topic: diagnosis
    prompt: Clinical examination findings in OA.
    points:
      - Bony prominence at the joint margins
      - Crepitus on joint movement
      - Joint-line tenderness
      - Swelling with inflammation in inflammatory OA
    pass: 3
    src: { page: 234, quote: "Increased bony prominence at the joint margins. 2- Crepitus or a grating sensation upon joint manipulation." }
    status: unverified
  - id: rheum.L15.012
    kind: card
    topic: diagnosis
    front: Which hand joints are typical of OA?
    back: DIP, PIP and the first carpometacarpal (CMC) joints.
    src: { page: 234, quote: "Osteoarthritis of distal interphalangeal (DIP), proximal interphalangeal (PIP) & 1scarpometacarpal (CMC) joints." }
    status: unverified
    tags: [high-yield]
  # ---------- p235: X-ray, US, MRI ----------
  - id: rheum.L15.013
    kind: card
    topic: diagnosis
    front: X-ray features of hand OA?
    back: Joint space narrowing of DIP and PIP joints and bony sclerosis (eburnation) of all affected joints.
    src: { page: 235, quote: "Joint space narrowing of the DIP and PIP joints and bony sclerosis (eburnation) of all joints involved by the osteoarthritis process." }
    status: unverified
  - id: rheum.L15.014
    kind: card
    topic: diagnosis
    front: Typical X-ray of knee OA?
    back: Medial joint space narrowing with osteophytes.
    src: { page: 235, quote: "Knee osteoarthritis with medial joint space narrowing and osteophytes." }
    status: unverified
  - id: rheum.L15.015
    kind: card
    topic: imaging
    front: What does shear wave elastography measure, and what does a low shear wave velocity mean?
    back: Tissue elasticity from shear wave velocities; a lower SWV means softer cartilage, which may help diagnose early OA.
    src: { page: 235, quote: "Lower shear wave velocity (SWV) values indicate a softening in cartilage this may help in the diagnosis of early-stage OA." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L15.016
    kind: table
    topic: imaging
    title: New ultrasound techniques in OA (p235)
    columns: [Technique, Adds]
    rows:
      - [Shear wave elastography, Cartilage softening (low SWV) in early OA]
      - [3D ultrasound, "Early osteophytes, knee cartilage volume, synovial thickness"]
      - [Superb microvascular Doppler, Low-velocity flow; low-grade inflammation in knee OA]
      - [Contrast-enhanced ultrasound, Perfusion via microbubbles; mild synovitis]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 235, quote: "Superb microvascular Doppler could detect low-velocity blood flow. It is superior detect low-grade inflammation in knee OA." }
    status: unverified
  - id: rheum.L15.017
    kind: card
    topic: imaging
    front: Which ultrasound technique uses a gas-filled microbubble agent in OA, and what does it detect?
    back: Contrast-enhanced ultrasound; it shows dynamic perfusion and helps detect mild synovitis.
    src: { page: 235, quote: "signals from a gas-filled micro bubble contrast agent it helps for detection of mild synovitis." }
    status: unverified
  - id: rheum.L15.018
    kind: enumerate
    topic: imaging
    prompt: What novel quantitative (biochemical) MRI can measure in OA.
    points:
      - Key constituents of articular cartilage
      - Amount and network integrity of collagen
      - Amount of proteoglycans
      - "Perfusion of synovium and other tissues, e.g. infrapatellar fat pad, bone marrow lesions"
    pass: 3
    src: { page: 235, quote: "Determine the amount and network integrity of collagen, the amount of proteoglycans." }
    status: unverified
  # ---------- p236: risk, types, treatment ----------
  - id: rheum.L15.019
    kind: table
    topic: risk-types
    title: Risk factors for OA and the sites they affect (p236)
    columns: [Risk factor, Sites]
    rows:
      - [Increasing age, All sites]
      - [Female sex, "Some sites, particularly knee and hand"]
      - [Race or ethnicity, Variable by site]
      - [Genetic predisposition, All sites]
      - [Obesity, "Most sites, most marked for the knee"]
      - ["Trauma, repetitive occupations", Not specified]
    blanks: [[0, 1], [1, 1], [3, 1], [4, 1]]
    src: { page: 236, quote: "Obesity (most sites, but more marked for the knee than other joints)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L15.020
    kind: card
    topic: risk-types
    front: For which joint is obesity the most marked risk factor of OA?
    back: The knee.
    src: { page: 236, quote: "Obesity (most sites, but more marked for the knee than other joints)." }
    status: unverified
  - id: rheum.L15.021
    kind: table
    topic: risk-types
    title: Types of osteoarthritis (p236)
    columns: [Type, Forms or causes]
    rows:
      - [Primary, "Nodular, erosive, inflammatory"]
      - [Secondary, "Any MSK disease, trauma, metabolic and congenital conditions"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 236, quote: "Primary: Nodular type. Erosive. Inflammatory. 2- Secondary to any MSK disease, diseases, trauma, metabolic and congenital conditions." }
    status: unverified
  - id: rheum.L15.022
    kind: enumerate
    topic: treatment
    prompt: Goals of medical therapy in OA.
    points:
      - Control pain
      - Improve function
      - Minimize disability
      - Enhance health-related quality of life
    pass: 3
    src: { page: 236, quote: "Control pain. 2- Improve function. 3- Minimize disability. 4- Enhance health-related quality of life (hqo)." }
    status: unverified
  - id: rheum.L15.023
    kind: enumerate
    topic: treatment
    prompt: Treatment measures in osteoarthritis.
    points:
      - Education
      - Moderate exercise
      - Weight loss programmes
      - Physiotherapy
      - Mechanical aids or appliances
      - Medications
      - Surgery
    pass: 5
    src: { page: 236, quote: "Education. Moderate exercises. Weight loss programs. Physiotherapy for the joints. Mechanical aids or appliances." }
    status: unverified
  # ---------- p237: IA, MSCs ----------
  - id: rheum.L15.024
    kind: card
    topic: ia-cell
    front: Which guideline gives a stepwise treatment algorithm for knee OA in the book?
    back: The updated ESCEO stepwise algorithm (ESCEO = European Society for Clinical and Economic Aspects of Osteoporosis).
    src: { page: 237, quote: "Updated ESCEO stepwise treatment algorithm for knee osteoarthritis." }
    status: unverified
  - id: rheum.L15.025
    kind: card
    topic: ia-cell
    front: Why are oral drugs unlikely to modify cells in the OA joint?
    back: Local immune and paracrine dysregulation plus avascular cartilage keep oral drugs from reaching effective levels; the systemic route may also cause toxicity.
    src: { page: 237, quote: "due to the local immune and paracrine dysregulation in the joint, paired with the avascular nature of articular cartilage." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L15.026
    kind: card
    topic: ia-cell
    front: Advantage of the intra-articular route in OA?
    back: Higher local bioavailability, maximal local effect and a better safety profile than systemic exposure.
    src: { page: 237, quote: "Intra-articular route for drugs can potentially enhance the local bioavailability, thereby maximizing therapeutic effects locally in the joint with a higher safety profile" }
    status: unverified
  - id: rheum.L15.027
    kind: enumerate
    topic: ia-cell
    prompt: Mesenchymal stem cells in OA - sources and properties.
    points:
      - "Sources: bone marrow, adipose tissue, synovium"
      - Self-renewal and immunomodulation
      - Differentiate into mesenchymal cells including chondrocytes
      - Promote endogenous repair
    pass: 3
    src: { page: 237, quote: "Multiple sources (bone marrow, adipose, synovium). Their ability to self-renew, immunomodulatory properties." }
    status: unverified
  - id: rheum.L15.028
    kind: cloze
    topic: ia-cell
    text: Intra-articular autologous MSCs derived from {{c1::adipose tissue}} finished the phase {{c2::4}} clinical trial in July 2021.
    src: { page: 237, quote: "IA autologous MSCs, derived from adipose tissue, finished the phase 4 clinical trial in Jul 2021." }
    status: unverified
  # ---------- p238: gene therapy, ACI, PRP ----------
  - id: rheum.L15.029
    kind: card
    topic: ia-cell
    front: Components of the OA gene therapy described in the book?
    back: Allogeneic chondrocytes and irradiated GP2-293 cells overexpressing TGF-β.
    src: { page: 238, quote: "Its components include allogeneic chondrocytes and irradiated GP2-293 cells overexpressing TGF-β." }
    status: unverified
  - id: rheum.L15.030
    kind: card
    topic: ia-cell
    front: Why is TGF-β used in OA gene therapy?
    back: It is an anti-inflammatory cytokine that controls chondrocyte proliferation and differentiation and ECM accumulation.
    src: { page: 238, quote: "TGF-β is an anti-inflammatory cytokine that controls chondrocyte proliferation and differentiation, as well as ECM accumulation." }
    status: unverified
  - id: rheum.L15.031
    kind: table
    topic: ia-cell
    title: Autologous chondrocyte implantation (p238)
    columns: [Side, Points]
    rows:
      - [For, "Large cartilage injuries; long-term success; durable, good mechanical strength"]
      - [Against, "Invasive; needs lab cultivation of chondrocytes; implantation complications"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 238, quote: "Can be applied for large cartilage injuries. Provides long-term success rates. Durable and provides good mechanical strength." }
    status: unverified
  - id: rheum.L15.032
    kind: card
    topic: ia-cell
    front: What does the book conclude about PRP and hyaluronic acid in OA?
    back: PRP combined with HA beats either alone at inhibiting synovial inflammation, improves pain and function and reduces adverse reactions.
    src: { page: 238, quote: "PRP combined with HA is more effective than PRP or HA alone at inhibiting synovial inflammation" }
    status: unverified
    tags: [high-yield]
  - id: rheum.L15.033
    kind: table
    topic: ia-cell
    title: Guideline bodies cited for OA (p238–239)
    columns: [Abbreviation, Meaning]
    rows:
      - [AAOS, American Academy of Orthopaedic Surgeons]
      - [ACR, American College of Rheumatology]
      - [ESCEO, European Society for Clinical and Economic Aspects of Osteoporosis]
      - [NICE, National Institute for Health and Care Excellence]
      - [OARSI, Osteoarthritis Research Society International]
      - [PANLAR, Pan-American League of Rheumatology Associations]
    blanks: [[0, 1], [2, 1], [4, 1], [5, 1]]
    src: { page: 239, quote: "OARSI: Osteoarthritis Research Society International." }
    status: unverified
  - id: rheum.L15.034
    kind: card
    topic: ia-cell
    front: In ACR OA guidance, what do CR and CRA mean?
    back: Conditionally recommended, and conditionally recommended against.
    src: { page: 238, quote: "CR conditionally recommended, CRA conditionally recommended against." }
    status: unverified
  # ---------- p239: DMOADs, MISHA, replacement ----------
  - id: rheum.L15.035
    kind: card
    topic: dmoad
    front: What is lorecivivint, and what does it do?
    back: An intra-articular Wnt pathway inhibitor (a DMOAD) that improves chondrocyte health and function and inhibits inflammation.
    src: { page: 239, quote: "Lorecivivint, intra-articular Wnt pathway inhibitor. Improve chondrocyte health and function & inhibiting inflammation." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L15.036
    kind: card
    topic: dmoad
    front: Trial status of lorecivivint in the book?
    back: A 24-week phase 2b trial showed efficacy in knee OA; a phase III trial was started.
    src: { page: 239, quote: "24-week Phase 2b trial demonstrated its efficacy in knee OA." }
    status: unverified
  - id: rheum.L15.037
    kind: card
    topic: dmoad
    front: What is the MISHA Knee System?
    back: An FDA-cleared (2023) shock-absorbing implant for refractory knee OA, placed subcutaneously in the medial extra-capsular space and screwed to the tibia and femur, as an outpatient procedure.
    src: { page: 239, quote: "Implanted subcutaneously in the medial extra-capsular space, the device is affixed to the tibia and femur with screws" }
    status: unverified
  - id: rheum.L15.038
    kind: enumerate
    topic: dmoad
    prompt: Consider referral for joint replacement in hip, knee or shoulder OA when...
    points:
      - Symptoms (pain, stiffness, reduced function, progressive deformity) substantially affect quality of life
      - Non-surgical management is ineffective or unsuitable
    pass: 2
    src: { page: 239, quote: "Non-surgical management (for example, therapeutic exercise, weight loss, pain relief) is ineffective or unsuitable." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L15.039
    kind: card
    topic: dmoad
    front: Which factors must NOT exclude a person with OA from joint replacement referral?
    back: Age, sex or gender, smoking, comorbidities, overweight or obesity.
    src: { page: 239, quote: "Do not exclude people with osteoarthritis from referral for joint replacement because of their age, sex or gender, smoking, comorbidities, overweight or obesity." }
    status: unverified
    tags: [high-yield]
  # ---------- own MCQs ----------
  - id: rheum.L15.040
    kind: mcq
    topic: concept
    stem: "Which statement best reflects the current concept of osteoarthritis?"
    options: ["A progressive multifactorial disease of the whole joint", "Pure cartilage wear and tear", "A disease of cartilage only", "An autoimmune disease with autoantibodies", "A disease of synovium only"]
    answer: 0
    why:
      - "Correct: cartilage, subchondral bone, synovium, ligaments and capsule."
      - "The book says OA is no longer seen as wear and tear."
      - "The whole joint is involved."
      - "Not described as autoantibody-driven."
      - "Synovitis matters but the whole joint is involved."
