  - id: rheum.L03.lesson3
    title: "من العطسة للـ shock: أمثلة type I"
    hook: "نفس الـ mast cell اللي بتعمل حكة في المناخير ممكن تقفل النفس وتوقّع الضغط في دقايق."
    minutes: 8
    pages: [58, 59]
    topics: [mediators, anaphylaxis]
    goals:
      - "تعدّ أمثلة الـ localized atopy وتعرف ليه بتبقى محلية"
      - "تفسّر كل علامة في الـ anaphylaxis"
      - "تتصرف صح في الـ anaphylaxis"
    status: unverified
    steps:
      - kind: table
        page: 58
        quote: "Figure: mediators of the activated mast cell (or basophil) and the eosinophil\n| Cell | Mediator | Effect |\n|---|---|---|\n| Activated mast cell (or basophil) | Biogenic amines (e.g., histamines); Lipid mediators (e.g., PAF, PGD2, LTC4) | Vascular leak; Broncho-constriction; Intestinal hypermotility |\n| | Cytokines (e.g., TNF); Lipid mediators (e.g., PAF, PGD2, LTC4) | Inflammation |\n| | Enzymes (e.g., tryptase) | Tissue damage |\n| Eosinophil | Cationic granule proteins (e.g., major basic protein, eosinophil cationic protein) | Killing of parasites and host cells |\n| | Enzymes (e.g., eosinophil peroxidase) | Tissue damage |"
        title: "مين بيعمل إيه؟"
        columns: ["Product", "Effect"]
        rows:
          - ["Histamine, PAF, PGD2, LTC4", "Vascular leak, bronchoconstriction, gut hypermotility"]
          - ["Cytokines (TNF)", "Inflammation"]
          - ["Tryptase", "Tissue damage"]
          - ["Eosinophil MBP, ECP", "Killing of parasites and host cells"]
        hide: [[0, 1], [3, 1]]
      - kind: explain
        remind: [rheum.L03.040]
        page: 58
        quote: "Examples of type I HS\n  Localized Atopy: specific target tissue such as the skin or bronchial passages:\n    Hay fever (allergic rhinitis).\n    Asthma.\n    Urticaria.\n    Atopic dermatitis (eczema).\n    Food allergies.\n  Systemic Atopy Anaphylaxis."
        title: "Localized ولا systemic؟"
        text: |
          ==Localized atopy== (نسيج معيّن زي الجلد أو الشُّعب):

          - Hay fever (allergic rhinitis)
          - Asthma
          - Urticaria
          - Atopic dermatitis (eczema)
          - Food allergies

          ==Systemic atopy== = **anaphylaxis**.

          التفسير المقبول (مش في الكتاب): ليه localized في ناس و systemic في ناس؟ عشان الـ allergen بيوصل لحد فين: حبوب اللقاح بتلمس الأنف والشُّعب بس، فالرد بيبقى هناك. أما الدوا في الوريد أو لسعة النحلة بيوصلوا للدم، فالـ mast cells في الجسم كله بتتفرّغ مع بعض، والنتيجة anaphylaxis.
      - kind: explain
        page: 58
        quote: "Localized Atopy: specific target tissue such as the skin or bronchial passages:"
        title: "ليه بتبقى محلية؟"
        text: |
          الكتاب بيقول الـ localized atopy بتصيب **target tissue معين**، زي الجلد أو الشُّعب.

          التفسير المقبول (مش في الكتاب): الـ mast cells بتقعد تحت الأسطح اللي بتقابل العالم برّه (الجلد، بطانة الأنف والشُّعب، الأمعاء). فالمرض بيظهر **مكان ما الـ allergen دخل**:
          - Pollen في الأنف ← ==hay fever==.
          - في الشُّعب ← **asthma**.
          - على الجلد ← **urticaria** و **eczema**.
          - في الأمعاء ← **food allergy**.

          ولما الـ allergen يوصل **للدم** (حقنة penicillin، لدغة)، بيقابل mast cells و basophils في كل حتة، فبيبقى **systemic** = anaphylaxis.
      - kind: explain
        page: 59
        quote: "Inflammatory response in asthmatic bronchi\nMast cell (IgE, FcεRI) → mediator release:\n  chemotactic factors (IL-5, TNFα) → blood vessel cells release histamine, cytokines, lysosomal enzymes, prostaglandins, MBP, ECP → inflammation, bronchial hyperreactivity\n  spasmogens (histamine, leukotrienes, prostaglandins) → normal → bronchoconstriction\nResult: cell infiltrate, increased mucus, increased muscle, chronic bronchospasm"
        title: "شُعب الـ asthma"
        text: |
          رسمة صفحة 59:

          - **Spasmogens** (histamine، leukotrienes، prostaglandins) ← ==bronchoconstriction==.
          - **Chemotactic factors** (IL-5، TNF-α) ← خلايا بتطلّع major basic protein (MBP) و eosinophil cationic protein (ECP) و lysosomal enzymes ← inflammation و **bronchial hyperreactivity**.
          - في الآخر: cell infiltrate، mucus زيادة، عضلات أتخن، و chronic bronchospasm.

          التفسير المقبول (مش في الكتاب): ليه الـ asthma بيبقى مزمن؟ عشان الموجة المتأخرة (الـ eosinophils ومواد زي MBP) بتجرح بطانة الشُّعب كل مرة، والجرح بيلتئم بعضلات أتخن ومخاط أكتر. يعني كل نوبة بتسيب أثر، وده سبب إن الـ inhaled steroid (اللي بيطفي الالتهاب) أهم من الـ bronchodilator لوحده في العلاج الطويل.
      - kind: figure
        page: 59
        title: "الـ asthma في رسمة الكتاب"
        image: { file: rheum/L03-asthmatic-bronchi.webp, book: true }
        alt: "Diagram titled Inflammatory response in asthmatic bronchi. A mast cell with IgE on Fc epsilon RI on the left releases mediators along two paths. Upper path: chemotactic factors (IL-5, TNF-alpha) act on cells in a blood vessel, which release histamine, cytokines, lysosomal enzymes, prostaglandins, MBP and ECP, leading to inflammation and bronchial hyperreactivity. Lower path: spasmogens (histamine, leukotrienes, prostaglandins) turn a normal bronchus into bronchoconstriction and finally a bronchus with cell infiltrate, increased mucus, increased muscle and chronic bronchospasm."
        caption: |
          الرسمة اللي الخطوة اللي فوق بتشرحها (صفحة 59):

          - **شمال**: mast cell عليها IgE بتطلّع mediators (mediator release).
          - **الطريق اللي فوق**: **chemotactic factors** (IL-5 و TNF-α) بتنادي خلايا من الوعاء الدموي (الدايرة فوق يمين)، تطلّع histamine و lysosomal enzymes و prostaglandins و MBP و ECP ← ==bronchial hyperreactivity==.
          - **الطريق اللي تحت**: **spasmogens** (histamine و leukotrienes و prostaglandins) ← الشُّعبة من **normal** ← **bronchoconstriction**.
          - **تحت يمين**: الشُّعبة في الآخر: cell infiltrate، mucus زيادة، عضلة أتخن، و ==chronic bronchospasm==.
      - kind: explain
        page: 59
        quote: "During anaphylaxis large amounts of inflammatory mediators and VDs are released into the circulation by activated mast cells and basophils causing rapid dilatation of blood vessels throughout the body."
        title: "الـ anaphylaxis: فسّر كل علامة"
        text: |
          الكتاب بيقول الـ mast cells والـ basophils بيرموا mediators و **vasodilators** في الدم كله. كل علامة بعدها ليها سبب:

          - **Dramatic drop في الضغط**: الأوعية كلها اتوسعت مرة واحدة، والدم مابقاش ماليها.
          - **Lungs filled with fluid**: الـ ==capillary permeability== زادت، فالسوايل خرجت.
          - **التنفس بيصعب فورًا**: الـ bronchioles بتنقبض من الـ histamine والـ leukotrienes، والكتاب بيقول ده **lethal**.
          - **Arrhythmia**: القلب بيشتغل في ضغط واطي وأكسجين قليل.

          وعشان كده الكتاب بيقول **give adrenaline immediately**: التفسير المقبول (مش في الكتاب): الـ adrenaline بيقبض الأوعية فالضغط يرجع، وبيفتح الشُّعب، في نفس الوقت.
      - kind: mnemonic
        page: 59
        quote: "Anaphylactic shock is most frequently observed in individuals sensitized to insect stings, peanuts, seafood or penicillin."
        word: "PIPS"
        hook: "أشهر أسباب الـ anaphylactic shock «PIPS»: زي صفارة الإسعاف."
        parts:
          - { key: "P", text: "Penicillin" }
          - { key: "I", text: "Insect stings" }
          - { key: "P", text: "Peanuts" }
          - { key: "S", text: "Seafood" }
      - kind: case
        page: 59
        quote: "Constriction of the bronchioles- lethal--Give adrenaline immediately."
        stem: "A 22-year-old is stung by a bee at a picnic. Within 5 minutes: hoarse voice, wheeze, BP 70/40, cold sweaty skin."
