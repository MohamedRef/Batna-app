  - id: geri.L07.lesson2
    title: "بيعمل إيه لوحده؟ ADL و IADL والوقعة"
    hook: "سؤال «بتستحمى لوحدك؟» بيقول عن العيان أكتر من نص التحاليل."
    minutes: 10
    pages: [111, 114]
    topics: [function, mobility, falls]
    goals:
      - "تفرّق بين Katz ADL و Lawton IADL وتعرف scoring كل واحد"
      - "تعرف مين محتاج multifactorial falls assessment وفيه إيه"
      - "تحسب الـ FRAT"
    status: unverified
    steps:
      - kind: explain
        page: 111
        title: "الـ function: بيعمل إيه فعلًا؟"
        quote: "There are two components of a functional assessment: What can and what does the person actually do? How recently has it changed?"
        text: |
          الـ ==functional assessment== سؤالين:
          1. بيقدر يعمل إيه، وبيعمل إيه **فعلًا**؟
          2. اتغيّر **من امتى**؟

          وخد بالك: اللي نظره أو سمعه ضعيف ممكن يبقى functional زي أي حد، بس بـ coping strategies مختلفة.
      - kind: reveal
        page: 111
        quote: "Sudden loss in function may indicate acute illness and guide towards active investigation and management"
        prompt: "عيانين فقدوا نفس القدرة: واحد في 3 أيام وواحد على سنة. الفرق في الـ plan؟"
        answer: |
          - **Sudden loss** ← فكّر في ==acute illness==: active investigation و management.
          - **Slow-sustained loss** ← غالبًا هيحتاج **more supportive care environment**.

          وده بالظبط سؤال الكتاب رقم 6.
      - kind: table
        page: 111
        quote: "Katz Index of Independence in Activities of Daily Living"
        title: "Katz ADL: 6 أنشطة، كل واحد 1 أو 0"
        columns: [Activity, "1 point if"]
        rows:
          - [Bathing, "Alone, or help with one part only"]
          - [Dressing, "Gets and puts on clothes; shoe-tying help OK"]
          - [Toileting, "On/off, clothes, cleans self"]
          - [Transferring, "Bed/chair unassisted; aids OK"]
          - [Continence, "Full control of bladder and bowel"]
          - [Feeding, "Plate to mouth; cooking by others OK"]
        hide: [[0, 0], [2, 0], [3, 0], [4, 0]]
      - kind: aside
        tone: tip
        page: 111
        quote: "Katz Index of Independence in Activities of Daily Living"
        text: "**Katz** = 6 = independent، 0 = very dependent. الـ ADL هي حاجات الجسم (تستحمى، تلبس، تاكل). الـ **IADL** هي حاجات الحياة المستقلة (فلوس، مواصلات، أدوية)."
      - kind: mnemonic
        page: 112
        quote: "LAWTON - BRODY INSTRUMENTAL ACTIVITIES OF DAILY LIVING SCALE (I.A.D.L.)"
        word: "SHAFT LM"
        parts:
          - { key: "S", text: "Shopping" }
          - { key: "H", text: "Housekeeping" }
          - { key: "A", text: "Accounting: ability to handle finances" }
          - { key: "F", text: "Food preparation" }
          - { key: "T", text: "Telephone and Transportation" }
          - { key: "L", text: "Laundry" }
          - { key: "M", text: "Medications: responsibility for own medications" }
        hook: "**SHAFT** + **LM**: الـ 8 domains بتوع ==Lawton IADL==. كل domain يا 0 يا 1."
      - kind: check
        page: 112
        quote: "A summary score ranges from 0 (low function, dependent) to 8 (high function, independent) for women and 0 through 5 for men"
        question: "Lawton IADL maximum score for a man?"
        options: ["5", "8", "6", "10"]
        answer: 0
        why:
          - "صح: 0–5 للرجالة و0–8 للستات «to avoid potential gender bias» (الطبخ والغسيل والبيت مش بيتحسبوا للراجل في النسخة دي)."
          - "8 للستات."
          - "6 دي الـ Katz ADL."
          - "مفيش 10 في الـ Lawton."
      - kind: explain
        page: 112
        title: "الحركة: Mobility assessment"
        quote: "Simple tests for walking and balance i. Timed up and go test ii. Gait speed iii. Chair stand"
        text: |
          History، current و prior function، الـ time periods، goals و prior intervention، هو محتاج يعمل إيه، gait و balance، ثم onward referral.

          والـ ==simple tests for walking and balance== تلاتة:
          1. **Timed up and go test**
          2. **Gait speed**
          3. **Chair stand**
      - kind: explain
        page: 113
        title: "مين ياخد multifactorial falls assessment؟"
        quote: "Two or more falls in the past 12 months. Presentation for medical attention with a fall. Difficulty with walking or balance."
        text: |
          - ==Two or more falls== في آخر **12 month**
          - جه للدكتور **بسبب وقعة**
          - **Difficulty with walking or balance**

          والتقييم فيه: history مفصّل للوقعة، comorbidities، **medication review**، فحص، ==lying and standing BP==، **Get up and Go** و **FRAT**، وتقييم مخاطر البيت (عادة الـ **occupational therapist**).
      - kind: match
        page: 113
        quote: "Vision ii. Heart rhythm and rate iii. Muscle strength iv. Other neurological impairment"
        prompt: "الفحص في الـ falls: وصّل كل جزء باللي بيدوّر عليه"
        pairs:
          - ["Vision", "Can't see the step"]
          - ["Heart rhythm and rate", "Arrhythmia causing syncope"]
          - ["Feet and footwear", "Loose slippers, painful feet"]
          - ["Lying and standing BP", "Postural hypotension"]
          - ["Baseline cognitive assessment", "Confusion, poor judgement"]
        why: "الفحص المركّز في الكتاب: vision، heart rhythm، muscle strength، neuro، knee، peripheral sensation، feet/footwear، baseline cognition، وبعدين lying and standing BP."
      - kind: table
        page: 114
        quote: "Falls Risk Assessment Tool"
        title: "FRAT part 1 (من 20)"
        columns: [Factor, "Scores"]
        rows:
          - ["Recent falls", "None 12 m = 2; 3–12 m = 4; last 3 m = 6; last 3 m as inpatient = 8"]
          - ["Medications", "None = 1; one = 2; two = 3; more than two = 4"]
          - ["Psychological", "None = 1; mild 2; moderate 3; severe 4"]
          - ["Cognition (AMTS)", "9–10 = 1; 7–8 = 2; 5–6 = 3; ≤4 = 4"]
          - ["Total", "Low 5–11; medium 12–15; high 16–20"]
        hide: [[0, 1], [4, 1]]
      - kind: aside
        tone: exam
        page: 114
        quote: "Falls Risk Assessment Tool"
        text: |
          ==Automatic high risk== في الـ FRAT من غير حساب:
          - تغيير قريب في الـ functional status أو أدوية بتأثر على الحركة
          - **Dizziness / postural hypotension**

          ولو high: **commence fall alert** واكتبها في الـ care plan.
      - kind: case
        page: 114
        quote: "Falls Risk Assessment Tool"
        stem: "Inpatient, 84 y. Fell on the ward last week. Takes furosemide and amlodipine. Mildly anxious. AMTS 8/10."
        steps:
          - question: "FRAT total?"
            options: ["15", "13", "17", "11"]
            answer: 0
            why: "Falls in last 3 months as inpatient = **8**، two drugs = **3**، mildly affected = **2**، AMTS 8 = **2**. المجموع **15**."
          - question: "Risk band?"
            options: ["Medium (12–15)", "High (16–20)", "Low (5–11)", "Automatic high"]
            answer: 0
            why: "15 آخر الـ medium. بس لو عنده postural hypotension يبقى **automatic high**، فقيس الـ lying and standing BP."
      - kind: try
        items: [geri.L07.032, geri.L07.037, geri.L07.038, geri.L07.044, geri.L07.052]
    recap:
      - "Functional: بيعمل إيه فعلًا، واتغيّر من امتى. مفاجئ = acute illness؛ بطيء = supportive environment."
      - "Katz ADL: 6 أنشطة، 6 = independent. Lawton IADL: **SHAFT LM**، 0–8 ستات و0–5 رجالة."
      - "Walking tests: TUG، gait speed، chair stand."
      - "Falls assessment لو ≥2 falls/12 m، جه بوقعة، أو مشيه مش مظبوط."
      - "FRAT من 20: low 5–11، medium 12–15، high 16–20؛ dizziness = automatic high."
    practice: [geri.L07.027, geri.L07.028, geri.L07.029, geri.L07.030, geri.L07.031, geri.L07.032, geri.L07.033, geri.L07.034, geri.L07.035, geri.L07.036, geri.L07.037, geri.L07.038, geri.L07.039, geri.L07.040, geri.L07.041, geri.L07.042, geri.L07.043, geri.L07.044, geri.L07.045, geri.L07.046, geri.L07.047, geri.L07.048, geri.L07.049, geri.L07.050, geri.L07.051, geri.L07.052, geri.L07.053, geri.L07.054, geri.L07.055, geri.L07.056, geri.L07.057, geri.L07.109]
