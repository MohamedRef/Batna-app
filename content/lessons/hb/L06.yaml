  - id: hb.L06.lesson5
    title: "العلاج الأول: الوزن، والقهوة، والمكمّلات"
    hook: "أقوى دوا للكبد الدهني مش في الصيدلية. وبعدين نفتح صينية المكمّلات: مين recommended ومين مجرد مذكور."
    minutes: 8
    pages: [105, 106]
    topics: [lifestyle]
    goals:
      - "تعرف إن نزول الوزن بأي طريقة حسّن الـ ALT في كل الدراسات تقريبًا، والـ histology في أغلب الدراسات اللي قاستها"
      - "تحفظ مين ياخد vitamin E بالظبط"
      - "تقسّم المكمّلات على مجموعاتها الثلاثة"
    status: unverified
    steps:
      - kind: explain
        page: 105
        title: "Treatment: weight loss"
        text: |
          جدول الكتاب جمع دراسات بـ **diet**، و **diet + exercise**، و **orlistat** (و sibutramine/orlistat)، و **surgery**.

          النتيجة: الـ **ALT اتحسّن في كل الدراسات تقريبًا**، والـ **histology اتحسّنت** في أغلب الدراسات اللي قاستها.

          يعني الطريق مش مهم قد ما **نزول الوزن نفسه** هو المهم.
      - kind: reveal
        page: 105
        prompt: "ليه نزول الوزن بيشتغل على كل مراحل الـ MASLD؟"
        answer: |
          ارجع لمسار الدرس التاني: الـ **drivers** هم **obesity، insulin resistance و free fatty acids**.

          نزول الوزن بيقلل الدهون، فيقل الـ **FFA flux** للكبد ويتحسّن الـ **IR**، فتقل الـ steatosis، والـ inflammation تهدى، والـ stellate cells تهدى. يعني بتقفل الحنفية من أولها بدل ما تمسح الأرض. (ربط physiology من الدروس، والكتاب بيسميه **main option** في الـ conclusions.)
