      - kind: explain
        page: 23
        title: "نصايح الأدوية عند الكبار"
        quote: "Older people may show an exaggerated drop in blood pressure after the first dose of an ACE inhibitor."
        text: |
          - أول جرعة **ACEI** ممكن تعمل ==exaggerated blood pressure (BP) drop==.
          - قيس **postural BP** كتير، و **BUN/creatinine** كل فترة علشان الـ volume depletion.
          - شوف الـ **electrolytes** والـ **magnesium** وعوّض.
          - **Digoxin** مفيد في الـ systolic CHF، بس الجرعة على أساس ==creatinine clearance== ولمدة قصيرة.
          - **Digoxin toxicity** عند الكبار ممكن تيجي atypical: **headache** و neurological manifestations.
