items:
  # ---------- p51: definition, epidemiology, pathogenesis ----------
  - id: dm.L05.001
    kind: card
    topic: definition
    front: Define diabetic foot.
    back: A spectrum of pathological entities affecting the foot of a diabetic patient as a result of diabetic complications, with high morbidity, mortality and economic burden.
    src: { page: 51, quote: "Diabetic foot is a spectrum of pathological entities that affect the foot of a diabetic patient as a result of its complications" }
    status: unverified
    tags: [high-yield]
  - id: dm.L05.002
    kind: card
    topic: definition
    front: What is the range of the diabetic foot spectrum?
    back: From the foot at risk to frank gangrene.
    src: { page: 51, quote: "Diabetic foot ranges from foot at risk to frank gangrene." }
    status: unverified
  - id: dm.L05.003
    kind: card
    topic: definition
    front: What kind of management does diabetic foot need?
    back: Multidisciplinary management.
    src: { page: 51, quote: "Management of diabetic foot is multi-disciplinary." }
    status: unverified
  - id: dm.L05.004
    kind: cloze
    topic: definition
    text: "In Egypt (Assad-Khalil), diabetic foot disorders were more prevalent in males ({{c1::14.1%}}) than in females ({{c2::9.7%}})."
    src: { page: 51, quote: "significantly higher among the male population (14.1%) compared to the female population (9.7%)." }
    status: unverified
    tags: [numbers]
  - id: dm.L05.005
    kind: cloze
    topic: definition
    text: "Diabetic foot affects {{c1::15%}} of all diabetics globally, and {{c2::15–20%}} of them may require amputation."
    src: { page: 51, quote: "Diabetic foot affects 15% of all diabetics globally, 15– 20% may require amputation." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L05.006
    kind: cloze
    topic: definition
    text: "Diabetic foot ulcer accounts for up to {{c1::24%}} mortality in patients with diabetes."
    src: { page: 51, quote: "DFU accounts for up to 24% mortality in patients with DM." }
    status: unverified
    tags: [numbers]
  - id: dm.L05.007
    kind: enumerate
    topic: pathogenesis
    prompt: Diabetic foot results from which three mechanisms?
    points: [Peripheral neuropathy (80–90%), Peripheral vascular disease (30–40%), Neuroischaemic disease]
    pass: 3
    src: { page: 51, quote: "Diabetic foot results from either; a. Peripheral Neuropathy 80 – 90% b. Peripheral vascular disease 30-40% c. Neuroischaemic disease" }
    status: unverified
    tags: [high-yield]
  - id: dm.L05.008
    kind: cloze
    topic: pathogenesis
    text: "Peripheral neuropathy contributes to {{c1::80–90%}} of diabetic foot and peripheral vascular disease to {{c2::30–40%}}."
    src: { page: 51, quote: "a. Peripheral Neuropathy 80 – 90% b. Peripheral vascular disease 30-40%" }
    status: unverified
    tags: [numbers, high-yield]
  # ---------- p52: risk factors, Wagner ----------
  - id: dm.L05.009
    kind: enumerate
    topic: pathogenesis
    prompt: Enumerate the risk factors that increase the risk of foot ulcers or amputation.
    points:
      - Poor glycemic control
      - Peripheral neuropathy
      - Loss of protective sensation
      - Cigarette smoking
      - Foot deformities
      - Preulcerative callus or corn
      - PAD
      - History of foot ulcer
      - Amputation
      - Visual impairment
      - DKD (especially on dialysis)
    pass: 8
    src: { page: 52, quote: "The risk of ulcers or amputations is increased in people with the following risk factors" }
    status: unverified
    tags: [high-yield]
  - id: dm.L05.010
    kind: card
    topic: pathogenesis
    front: Which kidney patients carry the highest foot-ulcer risk among people with diabetic kidney disease?
    back: Patients on dialysis.
    src: { page: 52, quote: "DKD (especially patients on dialysis)" }
    status: unverified
  - id: dm.L05.011
    kind: card
    topic: pathogenesis
    front: Why is visual impairment a risk factor for diabetic foot ulcers?
    back: It is on the book's risk-factor list for ulcers and amputation (the patient cannot inspect his own feet daily).
    src: { page: 52, quote: "Visual impairment" }
    status: unverified
  - id: dm.L05.012
    kind: table
    topic: wagner
    title: Wagner classification of diabetic foot
    columns: [Stage, Description]
    rows:
      - ["0", Foot at risk]
      - ["1", Superficial ulcer or blister]
      - ["2", Deep ulcer]
      - ["3", "Deep ulcer with abscess or osteomyelitis"]
      - ["4", Forefoot gangrene]
      - ["5", Hindfoot gangrene]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 52, quote: "Stage 0 = Foot at risk" }
    status: unverified
    tags: [high-yield]
  - id: dm.L05.013
    kind: cloze
    topic: wagner
    text: "Wagner stage {{c1::3}} is a deep ulcer with abscess or osteomyelitis; stage {{c2::4}} is forefoot gangrene and stage {{c3::5}} hindfoot gangrene."
    src: { page: 52, quote: "Stage 3 =Deep ulcer with abscess, osteomyelitis" }
    status: unverified
    tags: [high-yield]
  - id: dm.L05.014
    kind: order
    topic: wagner
    prompt: Put the Wagner stages in order from mildest to worst.
    steps: [Foot at risk, Superficial ulcer or blister, Deep ulcer, Deep ulcer with abscess or osteomyelitis, Forefoot gangrene, Hindfoot gangrene]
    src: { page: 52, quote: "Stage 5 = Hind-foot gangrene" }
    status: unverified
  - id: dm.L05.015
    kind: mcq
    topic: wagner
    stem: A 58-year-old diabetic man has a deep plantar ulcer under the first metatarsal head; the probe reaches bone and X-ray shows osteomyelitis. There is no gangrene. What is his Wagner stage?
    options: ["Stage 3", "Stage 2", "Stage 1", "Stage 4", "Stage 0"]
    answer: 0
    why:
      - "Correct: a deep ulcer with abscess or osteomyelitis is Wagner 3 (p52)."
      - Stage 2 is a deep ulcer without abscess or osteomyelitis.
      - Stage 1 is a superficial ulcer or blister.
      - Stage 4 needs forefoot gangrene.
      - Stage 0 is a foot at risk with no ulcer.
    src: { page: 52, quote: "Stage 3 =Deep ulcer with abscess, osteomyelitis" }
    status: unverified
  - id: dm.L05.016
    kind: enumerate
    topic: screening
    prompt: Why are early recognition and management of diabetic neuropathy important?
    points:
      - Diabetic neuropathy is a diagnosis of exclusion
      - Numerous treatment options exist
      - Up to 50% of DPN may be asymptomatic
      - Recognition and treatment may improve symptoms, reduce sequelae and improve quality of life
    pass: 3
    src: { page: 52, quote: "Up to 50% of diabetic peripheral neuropathy (DPN) may be asymptomatic ." }
    status: unverified
  - id: dm.L05.017
    kind: cloze
    topic: screening
    text: "Up to {{c1::50%}} of diabetic peripheral neuropathy may be {{c2::asymptomatic}}."
    src: { page: 52, quote: "Up to 50% of diabetic peripheral neuropathy (DPN) may be asymptomatic ." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L05.018
    kind: card
    topic: screening
    front: Diabetic neuropathy is a diagnosis of what kind?
    back: A diagnosis of exclusion.
    src: { page: 52, quote: "Diabetic neuropathy (DN) is a diagnosis of exclusion ." }
    status: unverified
  # ---------- p53: screening, history ----------
  - id: dm.L05.019
    kind: cloze
    topic: screening
    text: "Assess for DPN starting at {{c1::diagnosis}} of type 2 diabetes and {{c2::5 years}} after diagnosis of type 1, then at least {{c3::annually}}."
    src: { page: 53, quote: "All patients should be assessed for DPN starting at diagnosis for T2DM and 5 years after diagnosis of T1DM and at least annually thereafter." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L05.020
    kind: mcq
    topic: screening
    stem: A 19-year-old was diagnosed with type 1 diabetes 2 years ago. A 55-year-old was diagnosed with type 2 diabetes this week. When should each start screening for diabetic peripheral neuropathy?
    options:
      - "Type 2 now; type 1 at 5 years after diagnosis"
      - Both now
      - "Both at 5 years after diagnosis"
      - "Type 1 now; type 2 at 5 years after diagnosis"
      - "Only when symptoms appear"
    answer: 0
    why:
      - "Correct: T2DM at diagnosis, T1DM 5 years after diagnosis, then at least yearly (p53)."
      - Type 1 waits 5 years after diagnosis.
      - Type 2 is screened at diagnosis because it is often present for years before diagnosis.
      - This is the reverse of the rule.
      - Up to 50% of DPN is asymptomatic, so screening cannot wait for symptoms.
    src: { page: 53, quote: "All patients should be assessed for DPN starting at diagnosis for T2DM and 5 years after diagnosis of T1DM" }
    status: unverified
  - id: dm.L05.021
    kind: card
    topic: screening
    front: In which diabetic patients should symptoms and signs of autonomic neuropathy be assessed?
    back: Patients with microvascular complications.
    src: { page: 53, quote: "Symptoms and signs of autonomic neuropathy should be assessed in patients with microvascular complications." }
    status: unverified
  - id: dm.L05.022
    kind: enumerate
    topic: screening
    prompt: Key items of the past history in diabetic foot assessment?
    points: [Ulceration, Amputation, Charcot joint, Vascular surgery, Angioplasty, Cigarette smoking]
    pass: 5
    src: { page: 53, quote: "Past history" }
    status: unverified
  - id: dm.L05.023
    kind: table
    topic: screening
    title: Neuropathic and vascular symptoms in the foot history
    columns: [Group, Examples]
    rows:
      - [Positive neuropathic, "Burning or shooting pain, electrical or sharp sensations"]
      - [Negative neuropathic, "Numbness, feet feel dead"]
      - [Vascular, "Claudication, rest pain, non-healing ulcer"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 53, quote: "Negative (e.g., numbness, feet feel dead)" }
    status: unverified
  - id: dm.L05.024
    kind: card
    topic: screening
    front: Give two negative neuropathic symptoms.
    back: Numbness, and feet that feel dead.
    src: { page: 53, quote: "Negative (e.g., numbness, feet feel dead)" }
    status: unverified
  # ---------- p54: inspection ----------
  - id: dm.L05.025
    kind: card
    topic: inspection
    front: How should the diabetic feet be inspected?
    back: Carefully, in a well-lit room, after the patient removes shoes and socks.
    src: { page: 54, quote: "Careful inspection of the feet in a well-lit room should always be performed after the patient has removed their shoes and socks." }
    status: unverified
  - id: dm.L05.026
    kind: enumerate
    topic: inspection
    prompt: What makes a shoe appropriate for a diabetic foot?
    points:
      - Well-fitting with a protective outsole
      - Accommodates the shape of the foot
      - Insole that distributes plantar pressure equally
      - Shock-absorbing and soft, but resilient and non-slippery
      - Wide enough toe box
    pass: 4
    src: { page: 54, quote: "Well-fitting, with a protective outsole" }
    status: unverified
  - id: dm.L05.027
    kind: card
    topic: inspection
    front: What is the problem with a tight forefoot in a shoe?
    back: It puts undue pressure on the toes.
    src: { page: 54, quote: "Tight forefoot; there is undue pressure on the toes" }
    status: unverified
  - id: dm.L05.028
    kind: card
    topic: inspection
    front: What is the job of the shoe insole in a diabetic foot?
    back: To distribute plantar pressure equally.
    src: { page: 54, quote: "Insole, which can distribute the plantar pressure equally." }
    status: unverified
  - id: dm.L05.029
    kind: card
    topic: inspection
    front: Which skin findings may be the first signs of vascular insufficiency?
    back: Skin discoloration or loss of hair growth.
    src: { page: 54, quote: "Skin discoloration or loss of hair growth may be the first signs of vascular insufficiency" }
    status: unverified
    tags: [high-yield]
  - id: dm.L05.030
    kind: card
    topic: inspection
    front: Why are calluses dangerous in the diabetic foot?
    back: They are precursors to ulcers; they increase local pressure and, with undetected repetitive injury, lead to tissue injury, inflammation, necrosis and ulceration.
    src: { page: 54, quote: "Calluses: precursors to ulcers; increase the local pressure and, when combined with undetected repetitive injury, lead to local tissue injury" }
    status: unverified
    tags: [high-yield]
  - id: dm.L05.031
    kind: card
    topic: inspection
    front: What do you look for between the toes, and how does it look?
    back: Fungal infection (tinea), seen as whitish macerated skin.
    src: { page: 54, quote: "check between toes for fungal infection (whitish macerated skin)" }
    status: unverified
  - id: dm.L05.032
    kind: enumerate
    topic: inspection
    prompt: Enumerate the items of the dermatological assessment of the diabetic foot.
    points:
      - "Skin status: color, thickness, dryness, cracking"
      - Discoloration or hair loss
      - Calluses
      - "Nail dystrophy, onychomycosis, paronychia, onycholysis"
      - Fungal infection between the toes
      - Gangrene and amputation
      - Ulcers
    pass: 5
    src: { page: 54, quote: "Skin status: color, thickness, dryness, cracking" }
    status: unverified
  - id: dm.L05.033
    kind: cloze
    topic: inspection
    text: "Diabetic foot ulcers precede more than {{c1::80%}} of diabetic amputations."
    src: { page: 54, quote: "Diabetic foot ulcers: precede >80% of diabetic amputations" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L05.034
    kind: card
    topic: inspection
    front: What should socks for a diabetic foot not be, according to the inspection checklist?
    back: Thin and made of synthetic materials.
    src: { page: 54, quote: "Socks are thin and made of synthetic materials." }
    status: unverified
  # ---------- p55: deformity and ulcer table ----------
  - id: dm.L05.035
    kind: card
    topic: deformity
    front: Two musculoskeletal signs of motor neuropathy on inspecting the foot?
    back: Muscle wasting and guttering between the metatarsals.
    src: { page: 55, quote: "Muscle wasting, guttering between metatarsals" }
    status: unverified
  - id: dm.L05.036
    kind: card
    topic: deformity
    front: How does motor neuropathy deform the foot?
    back: It upsets the delicate balance between the flexors and extensors of the toes.
    src: { page: 55, quote: "upsetting the delicate balance between flexors and extensors of the toes." }
    status: unverified
  - id: dm.L05.037
    kind: enumerate
    topic: deformity
    prompt: Common forefoot deformities that increase plantar pressure and skin breakdown?
    points: [Claw toe, Hammer toe, Hallux valgus]
    pass: 3
    src: { page: 55, quote: "Common forefoot deformities that are known to increase plantar pressures and are associated with skin breakdown include claw toe, hammer toe & Hallux valgus." }
    status: unverified
  - id: dm.L05.038
    kind: order
    topic: deformity
    prompt: How does a structural deformity in an insensate foot turn into an ulcer?
    steps:
      - Deformity creates a site of abnormally high pressure
      - Repetitive pressure causes tissue breakdown and callus
      - Without protective sensation, activity continues and the callus thickens
      - Hemorrhage under the callus
      - Ulceration
    src: { page: 55, quote: "continued activity can cause the calluses to thicken, hemorrhage underneath, and eventually ulcerate." }
    status: unverified
  - id: dm.L05.039
    kind: table
    topic: deformity
    title: Forefoot deformities
    columns: [Deformity, Joint positions]
    rows:
      - [Claw toe, "MTP hyperextension with PIP and DIP flexion"]
      - [Hammer toe, "MTP extension with PIP flexion"]
      - [Hallux valgus, "Lateral angulation of the 1st MTP joint of the great toe"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 55, quote: "Claw toe: MTP hyperextension with PIP & DIP flexion" }
    status: unverified
  - id: dm.L05.040
    kind: card
    topic: deformity
    front: What distinguishes a claw toe from a hammer toe?
    back: Claw toe flexes both the PIP and DIP joints (with MTP hyperextension); hammer toe flexes the PIP only (with MTP extension).
    src: { page: 55, quote: "Hammer toe: Extension at the MTP joint with flexion at the PIP" }
    status: unverified
  - id: dm.L05.041
    kind: card
    topic: deformity
    front: Charcot arthropathy occurs in which foot, and which part does it most often affect?
    back: The neuropathic foot; most often the midfoot.
    src: { page: 55, quote: "This occurs in the neuropathic foot and most often affects the midfoot." }
    status: unverified
    tags: [high-yield]
  - id: dm.L05.042
    kind: card
    topic: deformity
    front: What causes Charcot foot?
    back: Repetitive trauma to insensitive bones and joints of the foot.
    src: { page: 55, quote: "Charcot foot results from repetitive trauma to insensitive bones and joints of the foot." }
    status: unverified
  - id: dm.L05.043
    kind: table
    topic: ulcer-types
    title: Neuropathic, ischemic and neuroischemic ulcers
    columns: [Feature, Neuropathic, Ischemic, Neuroischemic]
    rows:
      - [Common location, Plantar, Plantar and/or dorsal toes and foot, Plantar and/or dorsal toes and foot]
      - [Morphology, Surrounding callus, "Punched out, black eschar", Necrosis and callus]
      - [Pain, Mild, Severe, Dull pain]
      - [Type of pain, "Neuropathic: sharp, stabbing or burning", "Nociceptive and claudication", Both]
      - [Callus, "+++", "–", "++(+)"]
      - [Bone deformity, "+++", "–", "++(+)"]
      - [Pulses, Present, Weak or absent, Weak or absent]
      - [Skin temperature, Warm, Cool, Cool]
      - [Surrounding skin, "Loss of sensation, callus", "Pallor, shiny, rubor or pale; cool", Both]
    blanks: [[0, 1], [1, 2], [2, 2], [6, 1], [6, 2], [7, 1], [7, 2]]
    src: { page: 55, quote: "Punched out, black eschar" }
    status: unverified
    tags: [high-yield]
  - id: dm.L05.044
    kind: cloze
    topic: ulcer-types
    text: "A neuropathic ulcer is {{c1::plantar}} with surrounding {{c2::callus}}, and the foot is {{c3::warm}} with present pulses."
    src: { page: 55, quote: "Surrounding callus" }
    status: unverified
    tags: [high-yield]
  - id: dm.L05.045
    kind: card
    topic: ulcer-types
    front: Describe the morphology of an ischemic ulcer.
    back: Punched out with a black eschar.
    src: { page: 55, quote: "Punched out, black eschar" }
    status: unverified
  - id: dm.L05.046
    kind: card
    topic: ulcer-types
    front: Pain in a neuropathic versus an ischemic ulcer?
    back: "Neuropathic: mild, sharp, stabbing or burning. Ischemic: severe, nociceptive and claudication pain."
    src: { page: 55, quote: "Nociceptive and claudication" }
    status: unverified
  - id: dm.L05.047
    kind: card
    topic: ulcer-types
    front: Surrounding skin of an ischemic ulcer?
    back: Pallor, shiny, rubor or pale, and cool.
    src: { page: 55, quote: "Pallor, shiny, rubor, or pale; cool" }
    status: unverified
  - id: dm.L05.048
    kind: mcq
    topic: ulcer-types
    stem: A 62-year-old diabetic smoker has a painful punched-out ulcer with a black eschar on the tip of the second toe. The foot is cool and shiny, with no callus, and the dorsalis pedis pulse is absent. What type of ulcer is this?
    options: [Ischemic, Neuropathic, Neuroischemic, Charcot ulcer, Fungal intertrigo]
    answer: 0
    why:
      - "Correct: punched out, black eschar, severe pain, cool, no callus, weak or absent pulses (p55)."
      - Neuropathic ulcers are plantar, callused, warm, mildly painful, with present pulses.
      - Neuroischemic ulcers combine necrosis with callus and deformity (++(+)).
      - Charcot arthropathy is a midfoot joint destruction, not a toe-tip eschar.
      - Fungal infection gives whitish macerated skin between the toes.
    src: { page: 55, quote: "Punched out, black eschar" }
    status: unverified
  - id: dm.L05.049
    kind: mcq
    topic: ulcer-types
    stem: A 55-year-old man with long-standing diabetes has a painless ulcer under the first metatarsal head, rimmed by thick callus. The foot is warm with bounding pulses and claw toes. What is the main cause?
    options: [Peripheral neuropathy, Peripheral arterial disease, Fungal infection, Venous insufficiency, Gout]
    answer: 0
    why:
      - "Correct: plantar site, surrounding callus, mild pain, warm foot, present pulses and deformity = neuropathic ulcer (p55)."
      - Ischemic ulcers have weak or absent pulses and a cool foot.
      - Fungal infection gives whitish macerated skin between the toes, not a plantar callused ulcer.
      - Venous ulcers are not part of this lecture's diabetic foot spectrum and sit above the ankle.
      - Nothing here suggests gout.
    src: { page: 55, quote: "Common forefoot deformities that are known to increase plantar pressures and are associated with skin breakdown" }
    status: unverified
  # ---------- p56: Charcot phases, monofilament ----------
  - id: dm.L05.050
    kind: card
    topic: deformity
    front: How does acute Charcot foot present?
    back: Unilateral redness, swelling, deformity and increased foot temperature.
    src: { page: 56, quote: "In the acute phase of Charcot foot, it may present as Unilateral redness, swelling, deformity, and increased foot temperature." }
    status: unverified
    tags: [high-yield]
  - id: dm.L05.051
    kind: card
    topic: deformity
    front: What predominates in chronic Charcot foot, and what is the classic fixed deformity?
    back: Deformity predominates; the fixed deformity may be a rocker-bottom foot.
    src: { page: 56, quote: "The resultant fixed deformity may include a rocker bottom foot" }
    status: unverified
  - id: dm.L05.052
    kind: mcq
    topic: deformity
    stem: A 60-year-old woman with diabetes and neuropathy has a red, swollen, warm right midfoot with mild deformity. No ulcer. The left foot is normal. What is the most likely diagnosis?
    options: [Acute Charcot foot, Chronic Charcot foot, Ischemic ulcer, Hallux valgus, Wagner stage 4]
    answer: 0
    why:
      - "Correct: acute Charcot = unilateral redness, swelling, deformity and raised temperature in a neuropathic foot, usually midfoot (p55–56)."
      - The chronic phase is dominated by fixed deformity such as rocker-bottom foot.
      - An ischemic foot is cool, not warm.
      - Hallux valgus is lateral angulation at the 1st MTP joint.
      - Wagner 4 is forefoot gangrene.
    src: { page: 56, quote: "In the acute phase of Charcot foot, it may present as Unilateral redness, swelling, deformity, and increased foot temperature." }
    status: unverified
  - id: dm.L05.053
    kind: card
    topic: neuro
    front: What is the most common component in the pathway to diabetic foot ulceration?
    back: Peripheral neuropathy.
    src: { page: 56, quote: "Peripheral neuropathy is the most common component in the pathway to diabetic foot ulceration." }
    status: unverified
    tags: [high-yield]
  - id: dm.L05.054
    kind: card
    topic: neuro
    front: What does the 10-g monofilament examination identify?
    back: Loss of protective sensation (LOPS).
    src: { page: 56, quote: "Clinical exam designed to identify loss of protective sensation (LOPS)." }
    status: unverified
  - id: dm.L05.055
    kind: card
    topic: neuro
    front: How do patients describe the numb foot of large-fibre loss?
    back: As if their feet are wrapped in wool, or as walking on thick socks.
    src: { page: 56, quote: "Patients frequently state that their feet feel like they are wrapped in wool or that they are walking on thick socks." }
    status: unverified
  - id: dm.L05.056
    kind: cloze
    topic: neuro
    text: "Nylon monofilaments are built to buckle at a force of {{c1::10 g}}; failing to feel it at one or more plantar sites means loss of {{c2::large-fiber}} nerve function."
    src: { page: 56, quote: "Nylon monofilaments are constructed to buckle when a 10-g force is applied" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L05.057
    kind: order
    topic: neuro
    prompt: Put the 10-g monofilament test in order.
    steps:
      - Explain the procedure to the patient
      - Demonstrate the sensation on a proximal site (upper arm or sternum)
      - Ask the patient to close their eyes
      - Hold the monofilament perpendicular and touch the skin until it bends
      - Hold about 2 seconds, then release
      - Ask "yes" or "no" at each site
    src: { page: 56, quote: "should first be demonstrated to the patient on a proximal site (e.g., upper arm, sternum)." }
    status: unverified
  # ---------- p57: monofilament sites, tuning fork, VPT ----------
  - id: dm.L05.058
    kind: cloze
