  - id: dm.L07.lesson4
    title: "الطيف والعلاج: نرجّع الأعصاب؟"
    hook: "LF و HF مش موجات راديو، دي بصمة الـ sympathetic والـ vagus. وبعدها: مية وشراب وpyridostigmine."
