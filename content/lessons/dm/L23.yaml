        quote: "Approved for the treatment of homozygous familial hypercholesterolemia by the FDA."
        text: "الـ **mipomersen (Kynamro)** اتوقف تسويقه (2018-2019). وللـ HoFH بقى فيه **evinacumab** (antibody ضد ANGPTL3)، FDA 2021. الامتحان: جاوب زي الكتاب."
