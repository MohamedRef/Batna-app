  - id: geri.L12.lesson4
    title: "تسأل إزاي؟ الـ EASI والحواجز"
    hook: "ست أسئلة في دقيقتين ممكن تكشف اللي المريض مش هيقوله لوحده. وخمس مخاوف بتسكّته."
    minutes: 9
    pages: [211, 213]
    topics: [easi, barriers]
    goals:
      - "تعرف تعمل screening بالـ Elder Abuse Suspicion Index (EASI) وإمتى تبدأ بالـ Mini-Cog"
      - "تعرف كل سؤال في الـ EASI بيدوّر على إيه"
      - "تعرف ليه الأرقام دايمًا أقل من الحقيقة"
    status: unverified
    steps:
      - kind: aside
        tone: tip
        page: 211
        quote: "The Elder Abuse Suspicion Index (EASI) was validated in a primary care setting and can be used by physicians to screen cognitively intact patients during routine visits."
        text: "أدوات كشف الإساءة اللي اتعملها validation في الـ **primary care** قليلة. الـ **EASI** واحدة منهم، ومتعملة عشان دكتور العيلة يسألها في **الزيارة العادية**. يعني مش محتاج تشك الأول عشان تسأل؛ السؤال الروتيني هو اللي بيكشف المخفي."
      - kind: explain
        page: 212
        quote: "It has a sensitivity of 0.47 and a specificity of 0.75. The EASI includes five patient-answered items, plus one physician question that can identify patients who are at risk. At least one \"yes\" response to questions 2 through 6 indicates a need for further assessment."
        title: "الـ EASI"
        text: |
          الـ **Elder Abuse Suspicion Index**: اتعمله validation في الـ primary care، للمرضى ==cognitively intact== في الزيارات العادية.

          - **5 أسئلة** المريض بيجاوبها + **سؤال واحد** للدكتور.
          - **أي "yes" واحدة** في الأسئلة من 2 لـ 6 = محتاج assessment أكتر.
          - **Sensitivity 0.47**، **specificity 0.75**.

          ليه للـ cognitively intact بس؟ التفسير المقبول (مش في الكتاب): 5 من الـ 6 أسئلة المريض بيجاوبها عن نفسه، وده محتاج ذاكرة وفهم للسؤال. لو الـ cognition بايظة، الإجابة مش هتبقى موثوقة.
      - kind: explain
        page: 212
        quote: "The EASI includes five patient-answered items, plus one physician question that can identify patients who are at risk."
        title: "الست أسئلة"
        text: |
          الأسئلة كلها عن **آخر 12 شهر**:

          1. محتاج حد يساعدك في الحمّام أو اللبس أو المشتريات أو البنك أو الأكل؟
          2. حد منعك من أكل أو لبس أو دوا أو نضارة أو سماعة أو علاج، أو من ناس عايز تشوفهم؟
          3. حد كلمك بطريقة خلتك تحس بالإهانة أو التهديد؟
          4. حد حاول يجبرك تمضي ورق أو يستعمل فلوسك غصب عنك؟
          5. حد خوّفك، أو لمسك بطريقة مش عايزها، أو أذاك جسديًا؟
          6. **للدكتور**: لاحظت poor eye contact، انطواء، malnourishment، hygiene، جروح أو كدمات، لبس مش مناسب، أو مشاكل في الأدوية؟

          ليه السؤال الأول مش بيتحسب في الـ score (الـ yes من 2 لـ 6 بس)؟ التفسير المقبول (مش في الكتاب): الاعتماد على حد مش إساءة؛ هو **risk factor** بيقولك إن فيه caregiver ممكن يأذي. الـ EASI متعمل عشان يرفع **الشك** لدرجة إنك تحوّل للـ social services، مش عشان يثبت.
      - kind: match
        page: 212
        quote: "At least one \"yes\" response to questions 2 through 6 indicates a need for further assessment."
        prompt: "وصّل سؤال الـ EASI بنوع الإساءة اللي بيدوّر عليه:"
        pairs:
          - ["Prevented from food, glasses or care", "Neglect"]
          - ["Talked to in a shaming or threatening way", "Psychological"]
          - ["Forced to sign papers or give money", "Financial"]
          - ["Made afraid, touched unwanted, or hurt", "Physical or sexual"]
        why: "الأسئلة من 2 لـ 5 بتلف على الأنواع الخمسة اللي في جدول الكتاب، والسؤال 6 عين الدكتور على العلامات."
      - kind: figure
        page: 212
        quote: "Screening older patients for mistreatment may follow a one- or two-step process, depending on the patient's level of cognitive function. When the physician has known a normally functioning, cognitively intact patient over time, one-step screening using the EASI is recommended. When the physician does not know the patient or suspects dementia, the two-step process begins with screening for cognitive impairment with the Mini-Cog."
        title: "خطوة ولا خطوتين؟"
        alt: "Flow chart. Top question: do you know this patient over time and are they cognitively intact? Yes leads to one-step screening with EASI. No, or dementia suspected, leads to Mini-Cog. Mini-Cog negative leads to EASI. Mini-Cog positive leads to clarifying cognitive impairment before abuse screening. EASI with at least one yes to questions 2 to 6 leads to further assessment."
        caption: "مريض تعرفه وسليم ذهنيًا: Elder Abuse Suspicion Index (EASI) على طول. مريض جديد أو شاكك في dementia: Mini-Cog الأول."
        svg: |
          <svg viewBox="0 0 330 380" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="GL12a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="20" y="6" width="290" height="50" rx="8" class="fg-ink"/>
