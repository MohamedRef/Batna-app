        caption: "الكتاب طابعها صغيرة ومقطوعة من تحت، فدي نفس الصناديق بنفس الترتيب. 3 أعمدة حسب العيان، وكل صف خطوة:\n\n- **العمود الأول: No proteinuria، No family history of ESRD**: audiogram بس لو فيه شك في الطرش، ومفيش عين. الـ skin biopsy لو ==Normal يبقى supports TBMN==، ولو abnormal يبقى XLAS. والـ kidney biopsy والـ genetics **Often unnecessary**.\n- **العمودين التانيين** (family history of ESRD، أو proteinuria مع family history): audiogram **Yes** والعين **May be helpful**. الـ skin biopsy لو ==Abnormal يبقى diagnostic of XLAS==، بس لو **Normal ما بيستبعدش** XLAS ولا ARAS ولا ADAS.\n- ساعتها الـ **kidney biopsy** (EM و IHC للـ α3 و α4 و α5) هو اللي ==Often diagnostic==، إلا لو قريب مصاب عنده biopsy، أو العيان صغير فالـ biopsy من القريب الأكبر أفيد.\n- آخر صف: الـ **molecular genetics** لما الكلينيكال والأنسجة مايحسموش.\n\nده نفس الكلام اللي الـ reveal اللي فات شرحه: الجلد فيه α5 بس، فبيشخّص الـ X-linked ومايستبعدش الباقي."
