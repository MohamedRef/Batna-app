          - "بالعكس: بيقلل الـ TF."
      - kind: reveal
        page: 254
        quote: "Anti-Inflammatory Properties: Inhibits the expression of adhesion molecules on endothelial cells."
        prompt: "Monocyte لازق في الـ endothelium وداخل الـ intima. أنهي سلاح من الـ 6 كان المفروض يمنعه، وإزاي؟"
        answer: "**Anti-inflammatory**: الـ HDL بيمنع ظهور الـ **adhesion molecules** على الـ endothelial cells. من غيرها الـ monocyte مالوش حاجة يمسك فيها، فيعدّي مع الدم وما يدخلش الـ intima، ومن غير macrophage مفيش foam cell."
      - kind: try
        items: [dm.L20.002, dm.L20.005, dm.L20.006, dm.L20.008, dm.L20.009]
