      - kind: explain
        page: 202
        title: "العلاج"
        text: |
          - **Augmentation therapy**: IV infusions of AAT protein لمرضى الرئة. بترفع الـ AAT في الدم وبتبطّأ lung damage.

          بس الـ augmentation not effective for liver disease، لأن ==AAT cannot be targeted to the liver==.

          Transplant:

          - Lung transplant للـ advanced lung disease.
          - ==Liver transplant can be curative==، لأنه بيدي source of healthy AAT production.

          Medications:

          - bronchodilators و inhaled corticosteroids للـ COPD
          - antibiotics للـ respiratory infections
      - kind: reveal
        page: 202
        prompt: "طب ليه الـ augmentation مش بيفيد الكبد، والزرع بيشفيه؟"
        answer: |
          الكتاب: الـ AAT اللي بنديه في الوريد cannot be targeted to the liver، والكبد الجديد source of healthy AAT production.

          وده تفسير مقبول مش من الكتاب:

          - مشكلة الكبد في الأنواع زي ==Z== إن البروتين المعيوب بيتلخبط ويتحبس جوه الـ hepatocyte، فبيأذيه من جوه.
          - إنك تدّي AAT من برّه مش بيشيل اللي متحبس جوه.
          - الزرع بيغيّر الخلايا نفسها، فلا فيه بروتين متحبس، ولا فيه نقص في الدم.
      - kind: aside
        tone: analogy
        page: 202
        text: |
          الـ augmentation زي إنك تشتري مياه معدنية لأن حنفية البيت مقطوعة. الرئة، اللي بتشرب، مبسوطة. بس الماسورة المسدودة جوه الحيطة، يعني الكبد، زي ما هي.

          أما الـ ==liver transplant== فهو إنك تغيّر الماسورة والمحطة مرة واحدة، وعلشان كده هو curative: الكبد يرتاح والرئة تاخد AAT سليم.
