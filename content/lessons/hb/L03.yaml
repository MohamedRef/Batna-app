        items: [hb.L03.015, hb.L03.016, hb.L03.020, hb.L03.023, hb.L03.109]
    recap:
      - "**P = R × F**. الـ PH = ↑ resistance + ↑ portal inflow. الكبد الطبيعي بيستوعب الـ flow من غير ما الضغط يعلى."
