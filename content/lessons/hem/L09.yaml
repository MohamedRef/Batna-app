      - "Major: atypia + fibrosis 2–3، استبعد الباقي، clonal marker. Minor: PALLL. التشخيص 3 + 1."
      - "Splenomegaly في الكل تقريبًا (10% massive، portal HTN). Hypermetabolic = poor prognosis."
