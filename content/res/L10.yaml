    blanks: [[0, 1], [1, 2]]
    src: { page: 4, quote: "Advantages and disadvantages of various data collection techniques\n| Technique | Advantages | disadvantages |\n|---|---|---|\n| Using available information | Inexpensive, because data is already there; Permits examination of trends over the past | Data is not always easily accessible; Ethical issues concerning confidentiality; Information may be imprecise or incomplete |\n| Observing | Gives more detailed and context-related information; Permits tests of reliability of responses to questionnaires | Ethical issues concerning confidentiality or privacy; Observer bias; Presence of data collector can influence the situation observed |" }
