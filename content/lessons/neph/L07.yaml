      - "تعرف المتابعة بالـ imaging وليه السونار لوحده مش كفاية"
      - "تعالج الـ AML والأكياس والـ RCC وتعرف ليه الـ mTOR inhibitors"
    status: unverified
    steps:
      - kind: table
        page: 174
