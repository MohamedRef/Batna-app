        caption: |
          الرجلين من ورا، مليانين **نقط حمرا صغيرة** من الركبة للكعب: ==palpable purpura== (criterion رقم 3).

          ليه الرجلين؟ التفسير المقبول (مش في الكتاب): الجاذبية بتزوّد الضغط في أوعية الرجل، فالـ immune complexes بتترسّب هناك أكتر.
      - kind: explain
        page: 161
        title: "HSP: الـ IgA في طفل"
        quote: "Purpura, arthritis, abdominal pain and GN."
        text: |
          الـ **Henoch–Schönlein purpura** (الـ IgA vasculitis في Chapel Hill):
          - التتراد: **purpura**، **arthritis**، **abdominal pain**، و **GN**.
          - ==IgA deposition==.
          - **90% تحت 10 سنين**، وفي الأطفال **أخف**.
          - الكبار اللي عندهم GN: **13% renal failure**.

          التفسير المقبول (مش في الكتاب): الـ **IgA** هو antibody الـ **mucosa** (افتكر المحاضرة 6). غالبًا HSP بييجي بعد **عدوى في الزور أو البطن**، فالـ IgA immune complexes بتترسب في **أوعية الجلد والأمعاء والـ glomerulus** في نفس الوقت، وده يفسّر التتراد كله. وليه الكبار أوحش؟ لأن الكلية عندهم بتتأثر أكتر وبتتعافى أقل.
      - kind: figure
        page: 161
        title: "معايير الـ HSP"
        image: { file: rheum/L08-hsp.webp, book: true }
        alt: "A criteria table. Mandatory: purpura or petechiae with lower limb predominance. At least 1 out of 4: acute diffuse colicky abdominal pain (may include intussusception and gastrointestinal bleeding); histology showing leukocytoclastic vasculitis or proliferative glomerulonephritis with predominant IgA deposition; acute arthralgia or arthritis; proteinuria or haematuria."
        caption: |
          الجدول تحت الـ HSP:

          - **Mandatory**: ==purpura أو petechiae== وأغلبها في **الرجلين**.
          - **+ واحد على الأقل من 4**: وجع بطن مغص مفاجئ (ممكن intussusception أو نزيف)، biopsy فيها ==IgA deposition==، arthralgia أو arthritis، proteinuria أو haematuria.

          يعني نفس التتراد (purpura، arthritis، abdominal pain، GN)، بس الـ purpura **شرط** والباقي يكفي منه واحد.
