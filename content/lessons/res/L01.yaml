      - kind: explain
        remind: [res.L01.047]
        page: 37
        quote: "The topic you choose should be a priority problem. Questions to be asked include:\n  How large or widespread is the problem?\n  Who is affected?\n  How serious/severe is the problem?\nTry to think of serious health problems that affect a great number of people, or of the most serious problems that are faced by stakeholders in the area of your work."
        title: "هل المشكلة أولوية؟"
        text: |
          الموضوع لازم يبقى ==priority problem==. اسأل 3 أسئلة:

          - **How large or widespread?** المشكلة منتشرة قد إيه؟
          - **Who is affected?** مين المتأثر؟
          - **How serious/severe?** خطيرة قد إيه؟

          فكّر في مشاكل خطيرة بتصيب عدد كبير، أو أخطر مشاكل بيواجهها الـ stakeholders في مكان شغلك.

          ليه الـ 3 دول بالذات؟ لأن حجم المشكلة × خطورتها = العبء اللي البحث ممكن يقلله، و«مين المتأثر» بيقولك مين هيستفيد ومين لازم يشترك. التفسير المقبول (مش في الكتاب).
      - kind: aside
        tone: trap
        page: 38
        quote: "Also, consider the question of who perceives the problem as important. Opinions may differ on how important a problem is. Health policy-makers, health managers, health care providers, community leaders, and community members may each look at the same problem from different perspectives.\nNote: If you do not consider a topic relevant, it is not worthwhile to continue rating it. In that case you should drop it from your list."
        text: |
          لو الموضوع **not relevant**: ماتكمّلش تقييم الباقي، ==drop it==. مش «هياخد 1 في الـ relevance ويعوّض في الباقي».
      - kind: explain
        remind: [res.L01.049, res.L03.044]
        page: 39
        quote: "1. Relevance: A strong research topic/idea should pass the \"so what\" test.\nFor the research topic/idea to be considered relevant, it must:\n  have the potential to advance scientific knowledge\n  influence clinical management\n  influence health policy\n  guide further research"
        title: "1. Relevance: اختبار «So what?»"
        text: |
          أول وأهم معيار. الموضوع الـ relevant لازم يعدّي ==the "so what" test==: يقدر **advance scientific knowledge** أو **influence clinical management** أو **influence health policy** أو **guide further research**.

          ليه «so what»؟ لأن بحث مايغيّرش معرفة ولا علاج ولا سياسة ولا بحث جاي، مهما كان متعوب فيه، مالوش حد يستخدمه. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 40
        quote: "Before you decide to carry out a study, it is important that you find out whether the suggested topic has been investigated before, either within the proposed study area or in another area with similar conditions.\nIf the topic has been researched, the results should be reviewed to explore whether major questions that deserve further investigation remain unanswered.\nIf not, another topic should be chosen.\nNote: Also, consider carefully whether you can find answers to the problem in already available, unpublished information or just by using your common sense. If so, you should drop the topic from your list."
        title: "2. Avoidance of duplication"
        text: |
          قبل ما تبدأ، دوّر: الموضوع اتدرس قبل كده في نفس المكان أو مكان شبهه؟

          - لو اتدرس: راجع النتايج. فيه ==major questions لسه ماتجاوبتش==؟ كمّل عليها.
          - لو مفيش: اختار موضوع تاني.

          وكمان: لو الإجابة موجودة في معلومات **unpublished** متاحة، أو تتعرف بالـ **common sense**، شيل الموضوع من القائمة.
      - kind: sort
        page: 36
        quote: "Criteria for prioritizing & selecting a research topic:\n  Relevance: The importance of the problem, and its priority in the country and in the local area\n  Avoidance of duplication: No sound information available\n  Urgency of data needed (timeliness): Data urgently needed for decision-making or developing interventions at various levels\n  Political acceptability of study: Topic is acceptable to high level policymakers, or has the interest and support of the local/national authorities.\n  Feasibility of study: Study is feasible, considering available resources.\n  Applicability of results: Good chance of recommendations being implemented.\n  Ethical acceptability: No ethical problems."
        prompt: "كل مشكلة دي بتخسّر الموضوع في أنهي criterion؟"
        bins: ["Feasibility", "Avoidance of duplication", "Ethical acceptability", "Applicability"]
        cards:
          - { text: "No polymerase chain reaction (PCR) machine and no budget for one", bin: 0 }
          - { text: "Two Egyptian studies already answered it", bin: 1 }
          - { text: "Patients can't give informed consent", bin: 2 }
          - { text: "Ministry has no money to act on the results", bin: 3 }
          - { text: "Only you and 3 months available", bin: 0 }
          - { text: "Positive cases won't be offered treatment", bin: 2 }
        why: "Feasibility = الموارد (ناس، وقت، أجهزة، فلوس). Duplication = المعلومة موجودة. Ethics = consent والعلاج. Applicability = فرصة إن التوصيات تتنفذ."
      - kind: try
        items: [res.L01.045, res.L01.047, res.L01.049, res.L01.042]
