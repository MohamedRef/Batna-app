  - id: hb.L06.lesson3
    title: "نقيس الدهون والتليف: FIB-4 والـ FibroScan"
    hook: "أربع أرقام في معادلة واحدة بتقولك مين يحتاج FibroScan، وورقة FibroScan فيها رقم لو عدّى 30% ارميها."
    minutes: 10
    pages: [101, 102]
    topics: [steatosis, fibrosis]
    goals:
      - "تعرف أدوات تقييم الـ steatosis الأربعة"
      - "تعدّ الـ predictors of fibrosis وتفهم ليه الستات قبل الـ menopause أحسن"
      - "تحسب FIB-4 وتقرا ورقة FibroScan صح"
    status: unverified
    steps:
      - kind: explain
        page: 101
        title: "بنفحص إيه؟ الدهون والتليف"
        text: |
          **Steatosis assessment:**

          - **US**: الـ **preferred 1st line** imaging.
          - **MRS** (Magnetic Resonance Spectroscopy): **quantitative** estimation of liver fat.
          - **FLI** (Fatty Liver Index): من **TG، BMI، waist circumference و GGT**.
          - **NLS** (NAFLD Liver Score): من **MS، T2DM، fasting serum insulin و aminotransferases**.
      - kind: match
        page: 101
        prompt: "وصّل كل أداة بوصفها:"
        pairs:
          - ["Ultrasound", "Preferred first-line imaging"]
          - ["MRS", "Quantitative liver fat"]
          - ["FLI", "TG, BMI, waist, GGT"]
          - ["NLS", "MS, T2DM, fasting insulin, aminotransferases"]
        why: "الـ US أول خطوة، والـ MRS بيدّي رقم، والـ FLI والـ NLS scores من labs وقياسات."
      - kind: table
        page: 101
        title: "Predictors of progression to fibrosis in MASH"
        columns: ["Factor", "Detail"]
        rows:
