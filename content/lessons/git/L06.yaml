        quote: "Cecal patch can be found especially in children with peri appendiceal involvement. Backwash ileitis can occur in UC especially in extensive colitis."
        text: |
          تلات حاجات في الـ UC ممكن تخليك تفتكره Crohn:
          - **cecal patch** (حوالين الـ appendix)، خصوصًا في الأطفال
          - **backwash ileitis** في الـ extensive colitis
          - **skip lesions** عند عيان **under treatment** (العلاج بيخف حتت قبل حتت)
      - kind: explain
        page: 213
        title: "الأعراض"
        quote: "Symptoms and signs—As with Crohn disease, the symptoms of ulcerative colitis depend on the extent and severity of inflammation. Overt rectal bleeding and tenesmus are virtually universally present and may be the only symptoms in patients with proctitis alone. When the proximal colon is involved,"
        text: |
          - ==rectal bleeding== و **tenesmus**: موجودين في كله تقريبًا، وفي الـ proctitis ممكن يبقوا هما بس.
          - لما يطلع لفوق: **diarrhea** و **abdominal pain** أكتر.
          - **nausea و weight loss**: مرض أشد.
          - **severe pain أو fever**: fulminant colitis أو **toxic megacolon**.

          الكشف: tenderness خفيف في الـ **hypogastrium / left lower quadrant (LLQ)**، والـ digital rectal examination (DRE) ممكن يطلّع **red blood**. و **severe tenderness، fever، tachycardia** = fulminant.

          التفسير المقبول (مش في الكتاب): ليه الـ tenesmus؟ لأن الـ rectum الملتهب بيتحس كأنه مليان طول الوقت، فالمريض بيحس إنه عايز يدخل الحمام حتى لو مفيش حاجة.
      - kind: reveal
        page: 214
        quote: "Severe tenderness, fever, or tachycardia heralds fulminant disease."
        prompt: "مريض UC بيشتكي من نزيف. إيه العلامات في الكشف اللي تخليك تقلق إنها fulminant؟"
        answer: |
          الكتاب: الـ **nausea** والـ **weight loss** بيلمّحوا لمرض أشد، و **severe abdominal pain أو fever** بيلمّحوا لـ **fulminant colitis أو toxic megacolon**. في الكشف: tenderness خفيف غالبًا في الـ **hypogastrium أو الـ LLQ**، والـ **DRE** ممكن يورّي دم أحمر، و ==severe tenderness، fever، أو tachycardia== بيعلنوا إن المرض fulminant.

          التفسير المقبول (مش في الكتاب): الـ UC العادي التهاب في الـ mucosa بس، فالبطن بيبقى طري شوية. لما الـ tenderness يبقى شديد والحرارة تعلى والنبض يسرع، ده معناه إن الالتهاب عدّى لطبقات أعمق والجسم كله بقى متأثر، ودي أول خطوة ناحية الـ toxic megacolon أو الخرم. وده نفس منطق جدول الشدة: الأعراض الـ systemic هي اللي بتنقل النوبة لـ severe.
