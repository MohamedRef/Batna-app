      - kind: explain
        page: 71
        title: "ضغط باطن الرجل"
        quote: "Lavery LA, et al. Predictive value of foot pressure assessment when part of a population based diabetes disease management programme. Diabetes Care 2003;26:1069- 73."
        text: |
          الـ **plantar pressure** بيتقاس بـ pressure plate: العيان يقف أو يمشي عليها والجهاز يرسم خريطة ألوان، والأحمر والبنفسجي = ==high pressure points==.

          دي نفس النقط اللي الـ motor neuropathy والـ deformity بيعملوها، وهي أماكن القرح الجاية.

          المرجع اللي الكتاب حاطه (Lavery، Diabetes Care 2003) عنوانه **predictive value of foot pressure assessment**: يعني القياس ده بيتعمل عشان **يتنبأ** بالقرحة قبل ما تحصل، فتحمي النقطة دي بالـ insole قبل ما تتفتح.
      - kind: figure
        page: 71
        title: "صور الكتاب ص 71: الـ pressure plate"
        image: { file: dm/L06-plantar-pressure.webp, book: true }
        alt: "Book images. Left: a bare foot stepping on a flat black pressure plate wired to a computer. Right: the software screen with colour maps of four footprints; red and orange spots sit under the forefoot and heel, blue elsewhere, with a colour scale on the right."
        caption: |
          - **الشمال**: العيان بيدوس **حافي** على الـ **pressure plate**.
          - **اليمين**: الشاشة بترسم بصمة الرجل ألوان. **الأحمر والبرتقاني** تحت **الـ forefoot والكعب** = ==high pressure points==، والأزرق ضغط واطي.
      - kind: explain
        page: 72
        title: "النعل والجزمة"
        quote: "Pressure-relieving Insoles: Cushion the plantar surface & redistribute pressure over a wider surface area."
        text: |
          - ==Pressure-relieving insoles==: بتعمل **cushion** لباطن الرجل وتوزّع الضغط على مساحة أوسع.
          - العيان اللي عنده **gross foot deformities** مش هتنفعه الجزمة العادية: محتاج **therapeutic footwear**.

          ليه الجزمة العادية مش كفاية؟ لأنها معمولة على شكل رجل طبيعية: الصابع الملوي أو البروز هيحتك فيها مع كل خطوة، والعيان مش حاسس فمش هيشتكي. الـ **therapeutic footwear** أوسع وأعمق ومعمولة على شكل رجله هو.
      - kind: reveal
        page: 72
        quote: "Pressure-relieving Insoles: Cushion the plantar surface & redistribute pressure over a wider surface area."
        prompt: "إزاي توزيع الضغط على مساحة أوسع بيمنع القرحة؟"
        answer: |
          الـ **pressure = force ÷ area**. وزن العيان ثابت، فلو كبّرت المساحة اللي شايلاه، الضغط على كل نقطة يقل.

          زي ما الجمل ما بيغرزش في الرمل علشان خفه واسع: الـ **insole** بيعمل للرجل خف جمل. 🐪
      - kind: check
        page: 72
        quote: "Patients with gross foot deformities cannot be accommodated by standard shoes!"
        question: "Diabetic patient with severe claw toes and a Charcot-shaped midfoot asks which shoes to buy. Best advice?"
        options:
          - "Therapeutic footwear"
          - "Any comfortable standard trainers"
          - "Walk barefoot at home"
          - "Standard shoes one size larger"
        answer: 0
        why:
          - "صح: الـ gross foot deformities ما تنفعهاش الجزمة العادية، محتاجة therapeutic footwear."
          - "الجزمة العادية معمولة لرجل طبيعية والبروز هيحتك فيها."
          - "الحفا مع loss of sensation باب للـ trauma والقرحة."
          - "المقاس الأكبر بيخلي الرجل تتزحلق جوه وتحتك، ومش معمول على شكل الـ deformity."
      - kind: try
        items: [dm.L06.021, dm.L06.023, dm.L06.024, dm.L06.028, dm.L06.056]
    recap:
      - "Absent pulses = severe PAD؛ palpable ما بتستبعدش PAD لأن الضيق المتوسط ما بيخفيش النبض."
      - "ABI: 0.9–1.3 normal، 0.7–0.9 mild، 0.4–0.7 moderate، <0.4 severe (974)."
