        hook: "الـ secondary MCD «DNAIS»، زي الـ DNA بس فيه S زيادة. والـ miscellaneous (15) مستخبّي في الآخر."
      - kind: explain
        page: 226
        title: "ليه الأدوية والأورام أكبر مجموعتين؟"
        quote: "The number in parentheses indicates the number of specific diseases or clinico-pathologic entities reported to be associated with MCD."
        text: |
          الأرقام في الـ **categorization of secondary MCD** مش نسب عيانين؛ دي **عدد الأمراض أو الحالات** اللي اتسجّل إنها مرتبطة بالـ MCD: **drugs 24**، **neoplasia 19**، **miscellaneous 15**، **infections 7**، **atopy 6**، و **superimposed on another renal disease 5**.

          التفسير المقبول (مش في الكتاب) للرابط بينهم: الـ MCD غالبًا مرض **T cells** و **podocyte**. أي حاجة بتنشّط الـ T cells أو بتأذي الـ podocyte ممكن تعمله: الأورام (خصوصًا الـ lymphomas) بتطلع **cytokines**، والـ atopy والعدوى بيشغّلوا الجهاز المناعي، وبعض الأدوية بتأذي الـ podocyte مباشرة. علشان كده الأدوية أكبر مجموعة: كتير منها بيلمس الـ podocyte أو المناعة. يعني اللستة الطويلة دي في الآخر طريقين: مناعة متنشّطة أو podocyte متأذي.

          إزاي ده بيغيّر الـ workup؟ التفسير المقبول (مش في الكتاب): في الطفل الـ MCD غالبًا primary، فالـ steroid trial بيكفي من غير biopsy. في الكبير الصورة بتتقلب: لازم **تاريخ دوائي** كامل (NSAIDs بالذات، زي بنت case 2)، و **فحص** للـ lymph nodes والطحال، وأحيانًا CT. يعني نفس المرض، بس السن بيغيّر أول خطوة.
