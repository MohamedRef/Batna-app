        answer: |
          الكتاب بيقول السبب: الـ NS بيعمل ==restoring intravascular volume== و **increasing urinary calcium excretion**.

          التفسير المقبول (مش في الكتاب) للحلقة المفرغة: الكالسيوم العالي بيخلي الكلية تفقد مية (polyuria)، فالعيان بينشف، والـ GFR يقل، فالكالسيوم مش بيتطلّع، فيعلى أكتر. الـ saline بيكسر الحلقة دي على طول، وبعدين الـ calcitonin والـ bisphosphonate يقفلوا الحنفية من العضم.
