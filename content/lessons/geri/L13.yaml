          - "الـ long-acting بعد ما الألم يتظبط بس."
          - "الـ parenteral بسرعة دي للـ severe."
          - "السقف 3 g/day."
      - kind: table
        page: 225
        quote: "Severe pain (7-10/10): Begin a standing short-acting opioid (morphine sulfate, oxycodone, and hydromorphone) and titrate rapidly until pain relief is obtained or intolerable side effects develop. Strongly consider a parenteral opioid and titrate by 50%-100% of the dose every 30-60 min until pain is controlled. Long-acting opioids (sustained release morphine/oxycodone and transdermal fentanyl) should typically be started only after pain is well controlled and steady state is achieved."
