  # ---------- p35: PTHrP ----------
  - id: endo.L03.019
    kind: cloze
    topic: pthrp
    text: "Causes of hypercalcaemia with malignancy (book, p35): T-cell lymphoma {{c1::50%}}, multiple myeloma {{c2::40%}}, bronchogenic carcinoma {{c3::12%}}; others include bladder, GIT, ovary, head and neck."
    src: { page: 35, quote: "Etiology:\n  1. T cell lymphoma 50%.\n  2. Multiple myeloma 40%.\n  3. Bronchogenic Ca.12%.\n  4. Others, Ca. bladder, GIT, ovary, head and neck." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L03.020
    kind: card
    topic: pthrp
    front: What causes humoral hypercalcaemia of malignancy (HHM)?
    back: Over-expression of the gene encoding PTHrP, or rarely PTH.
    src: { page: 35, quote: "Pathogenesis:\n  1) Humoral hypercalcemia of Malignancy \"HHM\" Caused by over expression of gene encoding for PTHrP or rarely PTH.\n  2) Local osteolytic hypercalcemia \"LOH\"\n    Caused by increased cytokines secreted by malignant cells of lymphoma.\n    Leukemia or myleoma.\n    Osteoclast activating factor represents the biological.\n    Effectors of these cytokines ( TNF, Interleukine 1 and lymphotoxin)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.021
    kind: card
    topic: pthrp
    front: What causes local osteolytic hypercalcaemia (LOH), and which cytokines act as osteoclast activating factor?
    back: Cytokines from lymphoma, leukaemia or myeloma cells; TNF, interleukin-1 and lymphotoxin.
    src: { page: 35, quote: "Pathogenesis:\n  1) Humoral hypercalcemia of Malignancy \"HHM\" Caused by over expression of gene encoding for PTHrP or rarely PTH.\n  2) Local osteolytic hypercalcemia \"LOH\"\n    Caused by increased cytokines secreted by malignant cells of lymphoma.\n    Leukemia or myleoma.\n    Osteoclast activating factor represents the biological.\n    Effectors of these cytokines ( TNF, Interleukine 1 and lymphotoxin)." }
    status: unverified
  - id: endo.L03.022
    kind: card
    topic: pthrp
    front: Which tumour raises 1,25-dihydroxyvitamin D to cause hypercalcaemia?
    back: Especially B-cell lymphoma.
    src: { page: 35, quote: "3) Hypervitaminosis D 1,25 Dihydroxy vit. D is increased especially in B cell lymphoma." }
    status: unverified
  - id: endo.L03.023
    kind: enumerate
    topic: pthrp
    prompt: Three mechanisms of hypercalcaemia in malignancy.
    points:
      - Humoral hypercalcaemia of malignancy (PTHrP, rarely PTH)
      - Local osteolytic hypercalcaemia (cytokines from lymphoma, leukaemia, myeloma)
      - Hypervitaminosis D (1,25-dihydroxyvitamin D, B-cell lymphoma)
    pass: 3
    hook: "كالسيوم الأورام 3 سكك «هرمون، عضم، فيتامين»: humoral (PTHrP، ونادراً PTH)، local osteolytic (cytokines من lymphoma وleukaemia وmyeloma)، وhypervitaminosis D (1,25-dihydroxyvitamin D، B-cell lymphoma)."
    src: { page: 35, quote: "Pathogenesis:\n  1) Humoral hypercalcemia of Malignancy \"HHM\" Caused by over expression of gene encoding for PTHrP or rarely PTH.\n  2) Local osteolytic hypercalcemia \"LOH\"\n    Caused by increased cytokines secreted by malignant cells of lymphoma.\n    Leukemia or myleoma.\n    Osteoclast activating factor represents the biological.\n    Effectors of these cytokines ( TNF, Interleukine 1 and lymphotoxin)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.024
    kind: enumerate
    topic: pthrp
    prompt: Clinical picture of ectopic PTHrP hypercalcaemia.
    points:
      - Asymptomatic
      - "Renal: stones, polyuria, polydipsia, renal failure"
      - "GI: nausea, vomiting, constipation, peptic ulcer, pancreatitis"
      - "Bone and eye: bone pain, proximal myopathy, keratitis"
      - "CNS: lethargy, fatigue, confusion, stupor"
    pass: 4
    hook: "الـ PTHrP على 5 خانات: ممكن ولا حاجة (asymptomatic) + كلى (stones، polyuria، polydipsia، renal failure) + بطن (nausea، vomiting، constipation، peptic ulcer، pancreatitis) + عضم وعين (bone pain، proximal myopathy، keratitis) + مخ (lethargy، fatigue، confusion، stupor)."
    src: { page: 35, quote: "Clinical picture of ectopic PTHrP hypercalcemia\n  Asymptomatic.\n  Renal stone, polyuria, polydipsia, renal failure.\n  Nausea, vomiting, constipation, peptic ulcer and pancreatitis.\n  Bone pain, Proximal myopathy, keratitis.\n  Lethargy, fatigue, confusion, stupor." }
    status: unverified
  - id: endo.L03.025
    kind: card
    topic: pthrp
    front: When was the first case of hypercalcaemia with a malignant tumour reported?
    back: "1924."
    src: { page: 35, quote: "1) Ectopic PTHrP Hypercalcemia The first case of hypercalcemia with malignant tumor was reported at 1924." }
    status: unverified
  # ---------- p36 ----------
  - id: endo.L03.026
    kind: table
    topic: pthrp
    title: PTHrP hypercalcaemia vs primary hyperparathyroidism (book, p36)
    columns: [Test, PTHrP hypercalcaemia]
    rows:
      - [PTH, Low or normal]
      - [PTHrP, High]
      - [Urinary cyclic AMP, High]
      - [Renal calcium clearance, High]
      - ["1,25-dihydroxyvitamin D", Low to normal]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 36, quote: "Can be differentiated from 1ry hyperparathyroidism by\n  Hypercalcemia with low or normal PTH.\n  High PTHrP plasma level.\n  High urinary cyclic AMP.\n  High renal calcium clearance.\n  Low to normal 1,25 Dihydroxy vit. D." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.027
    kind: table
    topic: pthrp
    title: Treatment of hypercalcaemia of malignancy by severity
    columns: [Calcium, Treatment]
    rows:
      - [Mild (12 mg/dL), Hydration with saline]
      - [Moderate (13–15 mg/dL), Bisphosphonate plus diuretics]
      - [Severe (more than 15 mg/dL), "The above plus calcitonin and mithramycin"]
      - [Special measures, "Phosphate, glucocorticoid or dialysis"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 36, quote: "Treatment\n  Mild hypercalcemia (12 mg/dl) Hydration with saline.\n  Moderate hypercalcemia (13-15 mg/dl) Biphosphonate plus diuretics.\n  Severe hypercalcemia more than (15 mg/dl) above plus calcitonin and mithramycin.\n  Special measures: phosphate, glucocorticoid or dialysis." }
    status: unverified
    update:
      text: "Current practice: IV saline first, then an IV bisphosphonate (zoledronic acid) or denosumab, with calcitonin added for a rapid effect when hypercalcaemia is severe. Mithramycin (plicamycin) is no longer used, and a loop diuretic is given only after volume repletion or for fluid overload. In the exam give the book's answer."
      ref: "Endocrine Society clinical practice guideline: treatment of hypercalcemia of malignancy in adults 2022"
    tags: [high-yield, numbers]
  # ---------- p36-38: ACTH ----------
  - id: endo.L03.028
    kind: table
    topic: acth
    title: Causes of ectopic ACTH Cushing's syndrome
    columns: [Tumour, Share]
    rows:
      - [Small cell (oat cell) lung carcinoma, 50%]
      - [Carcinoma of thymus, 10%]
      - ["Pancreas (carcinoid, islet cell tumour)", 10%]
      - [Phaeochromocytoma, 5%]
      - [Medullary carcinoma of thyroid, 5%]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 36, quote: "Etiology\n  1. Small cell or oat cell pulmonary carcinoma 50%.\n  2. Carcinoma of thymus 10%.\n  3. Ca. pancreas (carcinoid and islet cell tumor) 10%.\n  4. Pheochromocytoma 5%.\n  5. Medullary Ca of thyroid 5%." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L03.029
    kind: card
    topic: acth
    front: Pathogenesis of ectopic ACTH secretion?
    back: Increased expression of the pro-opiomelanocortin gene, which encodes ACTH, lipotropin, MSH and endorphin; rarely tumours make CRH.
    src: { page: 36, quote: "Pathogenesis\n  Increased expression of proopiomelanocortin gene which encodes ACTH and other poly-peptide hormones like lipotropin, melanocyte stimulating hormone and endorphin.\n  Rarely, CRH is produced by many tumors." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.030
    kind: card
    topic: acth
    front: When was the first ectopic ACTH Cushing's described?
    back: "1928."
    src: { page: 36, quote: "2) Ectopic ACTH Cushing Syndrome The first case of ectopic ACTH Cushing was described at 1928." }
    status: unverified
  - id: endo.L03.031
    kind: card
    topic: acth
    front: How can ectopic adrenal receptors cause cortisol excess without ACTH?
    back: "GIP receptors make cortisol rise with food intake; adrenal LH receptors with macronodular hyperplasia give cushingoid features in pregnancy or the full picture at menopause."
    src: { page: 37, quote: "In rare cases there may be expression of ectopic receptors on the adrenal gland that are stimulated by hormones other than ACTH.\n  Gastric inhibitory peptide (GIP) receptors stimulated by food intake leading to increased cortisol secretion.\n    Now, known as Glucose dependant insulinotropic peptide.\n  LH receptor on adrenal gland associated with macro- nodular adrenal hyperplasia leading to Cushnoid features with pregnancy or full blown picture with menopause." }
    status: unverified
  - id: endo.L03.032
    kind: card
    topic: acth
    front: Why do tumours rarely produce steroid hormones?
    back: Because of the steroids' complex structure (many enzymatic steps).
    src: { page: 37, quote: "Steroid hormones are rarely produced by neoplastic cells due to its complex structure." }
    status: unverified
  - id: endo.L03.033
    kind: enumerate
    topic: acth
    prompt: Features that distinguish ectopic ACTH Cushing's from Cushing's disease.
    points:
      - Marked hypokalaemia
      - Marked rise in ACTH
      - Marked rise in serum and urine cortisol
      - No suppression on high-dose dexamethasone
      - Metabolic alkalosis
      - Fluid retention and hypertension
      - Diabetes
      - Steroid psychosis
    pass: 5
    hook: "الـectopic ACTH «كله Marked ومبيسمعش الكلام»: hypokalaemia شديدة، ACTH عالي جداً، cortisol في الدم والبول عالي جداً، ومفيش suppression بالـhigh-dose dexamethasone (4)… وبعدها: metabolic alkalosis، fluid retention وhypertension، diabetes، وsteroid psychosis (4). 4 + 4 = 8."
    src: { page: 37, quote: "Ectopic ACTH Cushing can be differentiated from Cushing disease:\n  1) Presence of marked hypokalemia.\n  2) Marked increase of ACTH.\n  3) Marked increase of serum and urine cortisol.\n  4) No suppression of ACTH or cortisol by high Dexamethasone dose suppression test.\n  5) Metabolic alkalosis.\n  6) Fluid retention and hypertension.\n  7) D.M.\n  8) Steroid psychosis." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.034
    kind: card
    topic: acth
    front: Why does ectopic ACTH cause marked hypokalaemia and alkalosis?
    back: Very high ACTH drives both glucocorticoid and mineralocorticoid secretion, and very high cortisol overwhelms renal 11-beta HSD2, so cortisol binds mineralocorticoid receptors.
    src: { page: 37, quote: "2) Marked elevation of cortisol overwhelm 11 B- hydroxysteroid dehydrogenase enzyme type2 which normally inhibits binding of cortisol to renal mineralocorticoid receptors." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.035
    kind: cloze
    topic: acth
    text: "Diagnosis of ectopic ACTH: urinary free cortisol {{c1::2 to 4 times}} normal, ACTH usually above {{c2::100 pg/mL}}, and a negative high-dose dexamethasone test (no {{c3::50%}} fall from baseline)."
    src: { page: 38, quote: "Diagnosis\n  Urinary free cortisol is 2 to 4 times normal level.\n  ACTH is usually more than 100 pg/ml.\n  Negative high Dexamethsone dose suppression test ( 50% reduction from baseline)." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L03.036
    kind: table
    topic: acth
    title: Lowering cortisol in ectopic ACTH syndrome
    columns: [Option, Dose]
    rows:
      - [Ketoconazole, 200–400 mg twice daily]
      - [Metyrapone, 250–500 mg every 6 hours]
      - [Mitotane, 1 g every 6 hours]
      - [Surgery, Bilateral adrenalectomy]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 38, quote: "Reduction of cortisol level by\n  Medical: Ketoconazol 200-400 mg twice daily.\n    Metyrapone 250-500 mg/6 hours.\n    Mitotane 1 gm/6 hours.\n  Surgical: Bilateral adrenalectomy." }
    status: unverified
    tags: [numbers]
  - id: endo.L03.037
    kind: card
    topic: acth
