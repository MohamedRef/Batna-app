        page: 68
        title: "Basophils و monocytes"
        quote: "Basophilia\n  An increase in blood basophils above 0.1 *10 9 /L is uncommon.\n  The usual cause is a myeloproliferative disorder such as chronic myeloid leukemia or polycythaemia vera. Reactive basophil increases are sometimes seen in myxoedema, during smallpox or chickenpox infection and in ulcerative colitis."
        text: |
          - ==Basophilia== (فوق **0.1 × 10⁹/L**) نادرة، وسببها المعتاد **myeloproliferative neoplasm (MPN)**: **Chronic myeloid leukaemia (CML)** أو **polycythemia vera**. الـ reactive: myxedema، smallpox/chickenpox، ulcerative colitis.
          ليه الـ CML بالذات؟ لأن الـ basophil خلية myeloid، والـ MPN بيطلّع كل الخط الـ myeloid زيادة، فالـ basophils بتزيد معاه.

          - **Monocytosis** (فوق **0.8 × 10⁹/L**) قليلة. أسبابها: chronic bacterial infections (**TB، brucellosis، endocarditis، typhoid**)، connective tissue (SLE، temporal arteritis، rheumatoid arthritis (RA))، protozoa، chronic neutropenia، و malignancies (Hodgkin، acute myeloid leukaemia (AML)، **chronic myelomonocytic leukaemia (CMML)**).

          لاحظ إن أسباب الـ monocytosis كلها **مزمنة**. التفسير المقبول (مش في الكتاب): الـ monocyte بيبقى macrophage، والـ macrophage هو اللي بيشتغل في الالتهاب الطويل والـ granulomas (زي الـ TB والـ brucellosis).
