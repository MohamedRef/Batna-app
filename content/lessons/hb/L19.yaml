  - id: hb.L19.lesson3
    title: "المغص اللي بييجي بعد العزومة"
    hook: "ليه الـ biliary colic مش colic أصلًا، وإمتى الـ 12 ساعة تقلب الموضوع cholecystitis."
    minutes: 9
    pages: [381, 390]
    topics: [biliary-pain, natural-history]
    goals:
      - "توصف الـ biliary pain بالساعة: بداية، ثبات، نهاية"
      - "تفرّق الـ simple colic عن الـ cholecystitis من 3 علامات"
      - "تحفظ أرقام الـ natural history اللي بيحبها الممتحن"
    status: unverified
    steps:
      - kind: explain
        page: 381
        quote: "Gallstone migration, into cystic duct which, even if transient, causes biliary colic."
        title: "أغلب الناس ولا حاسّين"
        text: |
          حوالي 80% من اللي عندهم حصوات **asymptomatic**. الباقيين عندهم طيف بيتقل خطوة خطوة:

          - ==Biliary colic==: وجع ويروح.
          - **Cholecystitis**: التهاب في المرارة.
          - **Cholangitis**: infection في القنوات، وممكن تموّت.

          والـ biliary colic هي ==the most common symptom==.

          سببها؟ الحصوة بتدخل الـ **cystic duct**، حتى لو لفترة قصيرة (**even if transient**). المرارة بتنقبض على باب مقفول، فالضغط جوّاها يعلى ويوجع.

          ولما الحصوة ترجع لورا أو تعدّي، الوجع يروح. علشان كده العيان بيبقى كويس خالص بين النوبات.
      - kind: figure
        page: 381
        quote: "and then gradually disappear over 30 to 90 min, leaving a dull ache."
        title: "شكل النوبة على الساعة"
        alt: "A graph of pain intensity against time. Pain rises over 15 minutes to 1 hour, stays at a steady plateau for up to 12 hours (usually under 6), then fades over 30 to 90 minutes, leaving a dull ache. A red mark at 12 hours says that pain beyond it suggests cholecystitis or pancreatitis."
        caption: "مش **colic** بمعنى إنه بيروح وييجي: الكتاب بيقول ==steady intensity==. لو عدّى 12 ساعة فكّر في **acute cholecystitis** أو **pancreatitis**."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L19c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
