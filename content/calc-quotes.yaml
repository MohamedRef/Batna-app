  - calculator: corrected_sodium
    lecture: dm.L15
    page: 189
    quote: |-
      Serum sodium:
        1. Usually low due to osmotic flux of water from the intracellular to the extracellular space by hyperglycemia.
        2. High or normal serum sodium indicates a profound degree of free water loss.
      Corrected Sodium = Measured Sodium + 0.016 x (Serum glucose - 100)
      The sodium should be increased 1.6 mEq/L for every 100 mg/dL increase in serum glucose from a starting level of 100 mg/dL
      If glucose level is 500 and sodium is 132
        Adjusted sodium = 1.6 x ((500-100)/100) = 1.6 x 4 = 6.4
        Thus, adjusted sodium = 132 + 6.4 = 138.4 or 138
