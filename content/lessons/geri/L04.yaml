          - "الـ history of stroke أرضية (predisposing)."
          - "الـ male sex predisposing."
          - "الـ impaired hearing predisposing."
      - kind: reveal
        page: 69
        quote: "Underlying dementia is observed in 25-50% of patients."
        prompt: "ليه الـ dementia أقوى risk factor للـ delirium؟"
        answer: "الكتاب بيقول الـ dementia **one of the strongest most consistent risk factors**، وموجودة في 25-50% من مرضى الـ delirium. التفسير المقبول (مش في الكتاب): المخ اللي فيه dementia احتياطيه قليل، فشرارة صغيرة (UTI، دوا جديد، مكان غريب) تكفي توقعه. علشان كده مريض الـ dementia في المستشفى محتاج الـ prevention من أول يوم، والعيلة لازم تعرف إن التلخبط الجديد مش «الزهايمر زاد»."
