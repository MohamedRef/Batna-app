  - id: neph.L14.113
    kind: card
    topic: tma
    front: What is the basic pathology of thrombotic microangiopathy?
    back: Endothelial damage causes microvascular thrombosis with platelet consumption, mechanical RBC shearing, Coombs-negative hemolysis and end-organ damage.
    src: { page: 470, quote: "This leads to mechanical shearing of the red blood cells (RBCs), Coombs- negative hemolytic anemia, and end-organ damage." }
    status: unverified
  - id: neph.L14.114
    kind: enumerate
    topic: tma
    prompt: Common TMAs from which HUS must be differentiated?
    points:
