  - id: endo.L04.lesson3
    title: "الكلية والخصوبة: الـ CRF والـ testosterone"
    hook: "مريض غسيل كلوي، الـ LH عالي والـ testosterone واطي. يعني العيب في الخصية؟ ولا فوق؟ الإجابة: الاتنين."
    minutes: 9
    pages: [47, 50]
    topics: [kidney, crf-reproductive]
    goals:
      - "تعدّ هرمونات الكلية التلاتة والأجهزة اللي الـ CRF بيأثر عليها"
      - "تشرح ليه الـ testosterone واطي في الـ CRF بسبع أسباب"
      - "تعرف إيه اللي بيتحسن بالغسيل وإيه بالزرع"
    status: unverified
    steps:
      - kind: explain
        remind: [endo.L04.034]
        page: 47
        quote: "The human kidney secretes three hormones\n  1- Renin.\n  2- Erythropoietin.\n  3- Calcitrol (1,25[OH]2 Vitamin D3)."
        title: "الكلية غدة كمان"
        text: |
          الكلية بتفرز **تلات هرمونات**:
          1. ==Renin==: أول خطوة في الـ renin–angiotensin system اللي شفناه في الـ heart failure.
          2. ==Erythropoietin==: بيشغّل الـ bone marrow يعمل كرات حمرا.
          3. ==Calcitriol== (1,25(OH)2 vitamin D3): الشكل الفعّال من فيتامين د.

          والـ chronic renal failure (CRF) بيأثر على تلات أجهزة: الـ **reproductive**، الـ **carbohydrate (CHO) metabolism**، والـ **parathyroid**. ليه التلاتة دول؟ لأن الكلية بتكسّر هرمونات زي الـ LH والإنسولين، فلما تفشل بيتراكموا (ص 49 و 51)، ولأنها هي اللي بتعمل الـ calcitriol، فلما تفشل الـ parathyroid بيشتغل زيادة (ص 52).
      - kind: explain
        page: 48
        quote: "The plasmsa testosterone levels are decreased or low normal ( inspite of an increased LH and FSH). The changes in testosterone levels are likely to be caused by primary hypogonadism and/or"
        title: "الـ testosterone في الـ CRF"
        text: |
          الكتاب بيقسم التغيرات الهرمونية في الـ reproductive system لاتنين: **androgen synthesis & metabolism** و **hyperprolactinaemia**.

          التغيرات بتبدأ ==بدري== بعد ما الكلى تضعف، والكتاب بيتهم الـ **uremic toxins** والأدوية اللي المريض بياخدها، بس الميكانيزم الدقيق مش واضح.

          الـ testosterone ==واطي أو low normal== **رغم إن الـ luteinising hormone (LH) والـ follicle-stimulating hormone (FSH) عاليين**. لو العيب في الخصية بس، كان الـ LH هيعلى ويعوّض. ولو العيب فوق بس، كان الـ LH هيبقى واطي. علشان كده الكتاب بيقول **combined abnormality**: primary hypogonadism + عيب في الـ hypothalamic–pituitary axis.
      - kind: figure
        page: 48
        quote: "Why testosterone levels are decreased or low normal?\n  1- Decrease of the pulsatility of hypothalamic GRH (gonadotrophin releasing hormone) release.\n  2- Diminished answer of the pituitary gland to GRH."
        title: "سبع ضربات على المحور"
        alt: "Vertical axis: hypothalamus, pituitary, testis, blood. Hits marked: 1 less pulsatile GnRH at the hypothalamus; 2 weak pituitary response; 3 broken feedback; 4 Leydig resistance from an LH-receptor inhibitor at the testis; 5 reduced clearance of GnRH, LH and FSH; 6 high prolactin suppressing LH and FSH; 7 rising SHBG lowering free testosterone in blood."
        caption: "العيب في كل دور: فوق (1، 2، 3، 6)، في الخصية (4)، وفي الدم (5، 7)."
        svg: |
          <svg viewBox="0 0 330 270" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="E04c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="8" y="8" width="110" height="34" rx="8" class="fg-acc"/>
            <text x="63" y="30" text-anchor="middle" class="t-sm t-b">Hypothalamus</text>
            <rect x="8" y="78" width="110" height="34" rx="8" class="fg-acc"/>
            <text x="63" y="100" text-anchor="middle" class="t-sm t-b">Pituitary</text>
            <rect x="8" y="148" width="110" height="34" rx="8" class="fg-acc"/>
            <text x="63" y="170" text-anchor="middle" class="t-sm t-b">Testis (Leydig)</text>
            <rect x="8" y="218" width="110" height="34" rx="8" class="fg-acc"/>
            <text x="63" y="240" text-anchor="middle" class="t-sm t-b">Blood</text>
            <path d="M63 42V76" class="fg-arrow" marker-end="url(#E04c)"/>
            <path d="M63 112V146" class="fg-arrow" marker-end="url(#E04c)"/>
            <path d="M63 182V216" class="fg-arrow" marker-end="url(#E04c)"/>
            <text x="74" y="64" class="t-sm t-mut">GnRH</text>
            <text x="74" y="134" class="t-sm t-mut">LH, FSH</text>
            <text x="74" y="204" class="t-sm t-mut">T</text>
            <rect x="134" y="8" width="190" height="34" rx="6" class="fg-bad"/>
            <text x="142" y="22" class="t-sm">1 ↓ GnRH pulses</text>
            <text x="142" y="37" class="t-sm">3 weak feedback</text>
            <rect x="134" y="78" width="190" height="34" rx="6" class="fg-bad"/>
            <text x="142" y="92" class="t-sm">2 ↓ response to GnRH</text>
            <text x="142" y="107" class="t-sm">6 ↑ prolactin ⊣ LH, FSH</text>
            <rect x="134" y="148" width="190" height="34" rx="6" class="fg-bad"/>
            <text x="142" y="170" class="t-sm">4 LH-receptor inhibitor</text>
            <rect x="134" y="218" width="190" height="34" rx="6" class="fg-bad"/>
            <text x="142" y="232" class="t-sm">5 ↓ clearance GnRH, LH, FSH</text>
            <text x="142" y="247" class="t-sm">7 ↑ SHBG → ↓ free T</text>
          </svg>
      - kind: order
        page: 48
        quote: "Why testosterone levels are decreased or low normal?\n  1- Decrease of the pulsatility of hypothalamic GRH (gonadotrophin releasing hormone) release.\n  2- Diminished answer of the pituitary gland to GRH."
        prompt: "رتّب أول أربع أسباب زي الكتاب:"
        steps:
          - "↓ GnRH pulsatility"
          - "↓ Pituitary response to GnRH"
          - "Impaired feedback (low T can't drive gonadotrophins)"
          - "Leydig resistance (LH-receptor inhibitor)"
        why: "الكتاب بيمشي من فوق لتحت: hypothalamus، pituitary، feedback، وبعدين الخصية. وبعدها clearance، prolactin، sex hormone-binding globulin (SHBG)."
      - kind: explain
        page: 49
        quote: "3- Low testosterone levels are not able to induce adequate gonadotrophin synthesis(impaired feed the hypothalamic– pituitary level back mechanism).\n4- Peripheral leydig-cell resistance (dt circulating LH-receptor inhibitor).\n5- Decreased metabolic clearance of at least GRH, LH, FSH.\n6- Increased prolactin (it suppers FSH& LH secretion).\n7- The age-related increase in SHBG (sex hormone binding globulin) levels (+1.2%/year) further induces a more fall in free testosterone."
        title: "ليه كل سبب بيوقّع الـ testosterone؟"
        text: |
          1-2. الـ GnRH لازم ييجي **نبضات** عشان الـ pituitary يستجيب. لما النبضات تقل والـ pituitary نفسه يرد أضعف، الـ LH اللي بيوصل للخصية أقل من المطلوب.
          3. الـ **feedback** بايظ: المفروض الـ T الواطي يشغّل الـ gonadotrophins بقوة، بس هنا ما بيقدرش «induce adequate gonadotrophin synthesis».
          4. الـ Leydig cells **مش سامعة** الـ LH، لأن فيه ==circulating LH-receptor inhibitor== في الدم.
          5. الـ GnRH والـ LH والـ FSH **clearance بتاعهم قليل**، يعني الكلية مش بتشيلهم. ده بيفسّر ليه الـ LH عالي في الدم رغم إن المحور ضعيف.
          6. الـ ==prolactin== العالي بيكبت الـ FSH والـ LH.
          7. الـ ==SHBG== بيزيد مع السن **+1.2%/سنة**، فبيمسك testosterone أكتر، والـ **free** T (اللي شغال فعلًا) يقل أكتر.
      - kind: check
        page: 49
        quote: "7- The age-related increase in SHBG (sex hormone binding globulin) levels (+1.2%/year) further induces a more fall in free testosterone."
        question: "How much does SHBG rise per year with age?"
        options: ["+1.2%", "+12%", "+0.1%", "It falls"]
        answer: 0
        why:
          - "صح: +1.2% في السنة، فالـ free T يقل أكتر."
          - "كتير قوي."
          - "قليل قوي."
          - "الـ SHBG بيزيد."
      - kind: explain
        page: 49
        quote: "The main male reproductive problems are\nImpotence\nGerminal Cell Dysplasia Oligospermia which leads to infertility."
        title: "النتيجة: نقص الـ androgen"
        text: |
          نقص الـ androgen بيعمل تلات حاجات، وكل واحدة ليها سبب:
          - **Body composition**: الـ body mass index (BMI) يعلى بالدهون، والـ lean/muscle mass يقل. التفسير المقبول (مش في الكتاب): الـ testosterone هرمون **anabolic** بيبني عضل، فلما يقل، العضل يقل والدهن ياخد مكانه.
          - **Osteoporosis** وكسور أكتر.
          - **Libido** وأداء جنسي أضعف، وممكن **depression**.

          وأهم المشاكل عند الراجل: ==impotence== و ==germinal cell dysplasia مع oligospermia==، وده اللي بيوصّل للـ infertility.
      - kind: reveal
        page: 49
        quote: "Hyperprolactinaemia in renal insufficiency\na) It is a partially induced by a decreased metabolic clearance.\nb) Autonomic overproduction."
        prompt: "ليه الـ prolactin عالي في الـ CRF؟ وليه ده مهم للـ testosterone؟"
        answer: "سببين في الكتاب: (a) **decreased metabolic clearance**، يعني الكلية مش بتشيله فبيتراكم، و (b) **autonomous overproduction**، يعني الـ pituitary نفسه بيعمل أكتر. وده مهم لأن السبب رقم 6 في السبعة: الـ prolactin **بيكبت الـ FSH والـ LH**، فبيضيف ضربة كمان فوق المحور."
      - kind: explain
        page: 49
        quote: "In females\n  Amenorrhea (menstrual periods may start after successful dialysis).\n  Failure of pregnancy (pregnancy aggravates CRF)."
        title: "الستات والأطفال"
        text: |
          - **الستات**: ==amenorrhoea== (والدورة ممكن ترجع بعد dialysis ناجح)، و ==failure of pregnancy==. ليه الحمل صعب؟ الكتاب بيقول إن الحمل نفسه **بيزوّد الـ CRF**، يعني الحمل والكلية بيأذوا بعض.
          - **الأطفال**: sexual maturation متأخرة و **stunted growth**، وبيتحسنوا أو بيرجعوا طبيعي مع الـ **renal transplant (R.T.)** الناجح.
      - kind: aside
        tone: trap
        page: 50
        quote: "Impaired function of the hypothalamic–pituitary–gonadal axis is not reversed by initiation of effective haemodialysis or peritoneal dialysis therapy. In contrast, renal transplantation was reported to restore endocrine function, but study results are conflicting."
        text: "الـ dialysis **مش** بيرجّع الـ hypothalamic–pituitary–gonadal axis. اللي ممكن يرجّعه الـ **transplantation** (والنتايج متضاربة). بس الدورة عند الستات ممكن ترجع بعد dialysis ناجح. ما تخلطش بينهم."
      - kind: check
        page: 50
        quote: "In children\n  Impaired sexul maturation.\n  Stunted growth.\n  These abnormalities improve or reverse with successful R.T."
        question: "A child on dialysis has delayed puberty and short stature. What reverses them?"
        options: ["Successful renal transplantation", "Increasing dialysis sessions", "Testosterone alone", "Nothing; they are permanent"]
        answer: 0
