    goals:
      - "ترتب جرعات الـ prednisone لوحده ومع الـ azathioprine"
      - "تعرف آثار الـ prednisone والـ azathioprine وليه الـ combination أحسن"
      - "تعرف الـ end points وإمتى نفكر في الزرع"
    status: unverified
    steps:
      - kind: order
        page: 213
        quote: "Single drug therapy (mg/day) prednisone 60 mg ×1week 40 mg ×1week 30 mg ×2weeks 20 mg unit end point OR COMBINATION THERAPY Prednisone (mg/day) + Azathioprine (mg/day) 30mg × 1week 20mg × 1week 50 mg until end point 15mg × 2weeks Azathioprine (mg/day) 10mg until end point"
        prompt: "رتّب الـ prednisone monotherapy (mg/day) من أول أسبوع:"
        steps:
          - "60 mg × 1 week"
          - "40 mg × 1 week"
          - "30 mg × 2 weeks"
          - "20 mg until end point"
        why: "Table 6: 60 → 40 → 30 (أسبوعين) → 20 لحد الـ end point. الـ combination بتبدأ من نص الرقم: 30 → 20 → 15 (أسبوعين) → 10، ومعاه azathioprine 50 mg/day لحد الـ end point."
      - kind: reveal
        page: 213
        quote: "Single drug therapy (mg/day) prednisone\n 60 mg ×1week\n 40 mg ×1week\n 30 mg ×2weeks\n 20 mg unit end point"
        prompt: "ليه الـ prednisone بيبدأ 60 mg وبعدين بينزل كل أسبوع لحد 20 mg، بدل جرعة واحدة ثابتة؟"
        answer: |
          الجدول: **60 ← 40 ← 30** (أسبوعين) **← 20 mg** لحد الـ end point. والـ combination بيبدأ من **30** ونازل لـ **10 mg** مع azathioprine **50 mg**.

          التفسير المقبول (مش في الكتاب): الجرعة العالية في الأول بتطفي الالتهاب بسرعة وتحمي الكبد من الـ necrosis. بعد ما الالتهاب يهدى، الكبد محتاج جرعة أقل تمسكه، والجرعة العالية لو استمرت هتجيب الآثار اللي في الصفحة دي (moon face، diabetes، osteopenia). يعني الـ taper بيوازن بين الكبد وباقي الجسم، والـ azathioprine بيخلّي الجرعة اللي بنقف عندها أقل كمان.
      - kind: explain
        remind: [hb.L13.058]
        page: 213
        quote: "Severe side effects, including osteopenia with vertebral compression, diabetes, cataracts, emotional lability, and hypertension, usually develop only after protracted therapy (more than 18 months) and on the higher dose prednisone schedule (20 mg/day)."
        title: "ليه الـ combination أحسن؟"
        text: |
          ==Prednisone side effects==:

          - **Cosmetic**: moon face، و dorsal hump، و obesity، و acne، و hirsutism. بتحصل في 80% بعد سنتين، أيًا كان الـ regimen.
          - **Severe**: osteopenia مع vertebral compression، و diabetes، و cataracts، و emotional lability، و hypertension. غالبًا بعد أكتر من 18 شهر، وعلى الجرعة الأعلى (20 mg/day).
          - 13% بيوقفوا العلاج بدري، أغلبهم بسبب الـ obesity أو الشكل أو الـ osteoporosis.

          ==Azathioprine side effects==: cholestatic hepatotoxicity، و nausea، و emesis، و rash، و cytopenia. بتحصل في أقل من 10% على 50 mg/day، وبترجع لما تقلّل الجرعة أو توقفها.

          الخلاصة: الـ **azathioprine** بيسمح إنك تدّي نص جرعة الـ prednisone. ونسبة الـ steroid side effects بتنزل من 44% لـ 10% في نفس المدة. علشان كده الـ combination هي المفضّلة.
      - kind: check
        page: 213
