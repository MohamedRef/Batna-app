  - id: dm.L10.023
    kind: table
    topic: basal
    title: "Titration of basal insulin: the 3–0–3 rule"
    columns: [Fasting plasma glucose, Change]
    rows:
      - [">130 mg/dl", "Add 3 units"]
      - ["70–130 mg/dl", "Add 0 units"]
      - ["<70 mg/dl", "Minus 3 units"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 127, quote: "If FPG > 130 mg/dl → Add 3 units. 2. If FPG = 70 – 130 mg/dl → Add 0 units." }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L10.024
    kind: mcq
    topic: basal
    stem: A 57-year-old woman on maximal metformin and gliclazide started glargine 10 units at bedtime. Her fasting glucose over 3 days averages 168 mg/dl, with no hypoglycemia. What next?
    options:
      - Add 3 units
      - Keep the same dose
      - Reduce by 3 units
      - Stop the oral drugs
      - Switch to a biphasic twice-daily regimen
    answer: 0
    why:
      - "Correct: FPG >130 mg/dl → add 3 units (the 3–0–3 rule, p127)."
      - "No change is for FPG 70–130."
      - "Minus 3 is for FPG <70."
      - "Basal only means continuing the maximal oral doses."
      - "Titrate the basal dose first."
    src: { page: 127, quote: "If FPG > 130 mg/dl → Add 3 units." }
    status: unverified
  - id: dm.L10.025
    kind: mcq
    topic: basal
    stem: A man on degludec 24 units has fasting glucose 62 and 66 mg/dl on two mornings. What does the 3–0–3 rule advise?
    options:
      - Reduce by 3 units
      - Add 3 units
      - No change
      - Stop insulin
      - Add prandial insulin
    answer: 0
    why:
      - "Correct: FPG <70 mg/dl → minus 3 units (p127)."
      - "Adding is for FPG >130."
      - "No change is for 70–130."
      - "Stopping is not part of the rule."
      - "Prandial insulin is added when HbA1c stays high with FBG at target."
    src: { page: 127, quote: "If FPG < 70 mg/dl → Minus 3 units." }
    status: unverified
  # ---------- p128: basal-bolus and biphasic ----------
  - id: dm.L10.026
    kind: enumerate
    topic: basal
    prompt: Advantages of the basal-bolus regimen?
    points:
      - Closest to natural insulin production
      - More flexibility over type and timing of food
      - Suits erratic mealtimes or variable shifts
    pass: 3
    src: { page: 128, quote: "Gives more flexibility over type of food and when it can be eaten." }
    status: unverified
    tags: [book-question, high-yield]
  - id: dm.L10.027
    kind: card
    topic: biphasic
    front: Indication of the biphasic twice-daily regimen?
    back: Type 2 diabetics not controlled on a once-daily regimen.
    src: { page: 128, quote: "Type 2 diabetics not controlled on a once-daily regimen." }
    status: unverified
  - id: dm.L10.028
    kind: cloze
    topic: biphasic
    text: "Biphasic twice daily: start {{c1::0.3 U/kg}} a day; give {{c2::2/3}} before breakfast and {{c3::1/3}} before dinner."
    src: { page: 128, quote: "Starting daily dose = 0.3 U/Kg body weight. 2. Give 2/3 of the total daily dose before breakfast and 1/3 before dinner." }
    status: unverified
    tags: [numbers, high-yield]
