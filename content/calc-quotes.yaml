  - calculator: page_b
    lecture: hb.L18
    page: 352
    quote: |-
      To help determine if patients meet this threshold, the PAGE-B (Platelet, Age, GEnder-hepatitis B) classification is used to stratify them into the following categories:
        Low risk of HCC (PAGE-B score ≤9, almost 0% incidence of HCC at 5 years)
        Intermediate risk of HCC (PAGE-B score 10-17, 3% incidence of HCC at 5 years)
        High risk of HCC (PAGE-B score ≥18, 17% incidence of HCC at 5 years).
      PAGE-B (Platelet, Age, GEnder-hepatitis B) score is based on:
        Decade of age (16-29 years = 0 points, 30-39 years = 2 points, 40-49 years = 4 points, 50-59 years = 6 points, 60-69 years = 8 points, ≥70 years = 10 points),
        Gender (male = 6 points, female = 0 points), and
        Platelet count (≥200 x 10⁹/L = 0 points, 100-199 x 10⁹/L = 1 point, <100 x 10⁹/L = 2 points).
      The PAGE-B score has yet to be validated in Asia.
