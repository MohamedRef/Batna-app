      - kind: explain
        page: 12
        title: "الـ cardinal signs والـ atypical"
        quote: "The presenting symptoms of (MI) can be quite atypical, specially in patients over age 80 or Silent MI"
        text: |
          **Cardinal signs:** pain >30 min، ECG، enzymes عالية.

          بس عند الكبار، خصوصًا ==فوق 80==، الـ MI ممكن يبقى **atypical** أو ==silent==:
          - **Dyspnea**: شائع جدًا وبدري
          - **Mental confusion** و **syncope**
          - **GI complaints**
          - **Conduction defects** كتير
      - kind: mnemonic
        page: 12
        quote: "Dyspnea is very common early manifestation, Mental confusion, syncope Gastrointestinal complaints Many patients have conduction defects."
        word: "SDCSGC"
        parts:
