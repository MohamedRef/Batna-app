items:
  # ---------- p84-85: antigens ----------
  - id: hem.L06.001
    kind: enumerate
    topic: antigens
    prompt: Name the clinically important blood group systems listed in the lecture.
    points: [ABO, Rh, Kell, Kidd, Duffy]
    pass: 4
    src: { page: 84, quote: "there are several clinically important blood group system: ABO, Rh, Kell, Kidd, and Duffy." }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.002
    kind: cloze
    topic: antigens
    text: "The red cell membrane is about {{c1::40%}} lipid and up to {{c2::10%}} carbohydrate; the rest is protein."
    src: { page: 84, quote: "The red cell membrane is composed of about 40% lipids and up to 10% carbohydrates, the remainder being protein." }
    status: unverified
    tags: [numbers]
  - id: hem.L06.003
    kind: card
    topic: antigens
    front: What chemical forms can blood group antigens take?
    back: Integral proteins or glycoproteins of the red cell membrane, or membrane glycolipids.
    src: { page: 84, quote: "Blood group antigens may be integral proteins or glycoproteins of the red cell membrane, or they may be membrane glycolipids." }
    status: unverified
  - id: hem.L06.004
    kind: table
    topic: antigens
    title: Where blood group polymorphism lies
    columns: [Antigen type, Polymorphism, Example]
    rows:
      - [Proteins and glycoproteins, Amino acid sequence, "Rh, Kell"]
      - [Glycoproteins and glycolipids, Oligosaccharide (carbohydrate) sequence, ABO]
    blanks: [[0, 2], [1, 1], [1, 2]]
    src: { page: 84, quote: "polymorphism is associated with differences in the oligosaccharide sequence (e.g. ABO)." }
    status: unverified
  - id: hem.L06.005
    kind: card
    topic: antigens
    front: How are the blood group proteins drawn on p85 grouped?
    back: By how they sit in the membrane; single-pass type 1 (glycophorins A–D, Lutheran) and type 2 (Kell), polytopic multi-pass type 3 (RhD, RhCcEe, Kidd, Duffy) and GPI-anchored type 5 (Cromer, JMH); type 4 proteins are cytoplasmic and absent in red cells.
    src: { page: 85, quote: "(Type 4 proteins are cytoplasmic and not present in red cells.)" }
    status: unverified
  # ---------- p84-86: antibodies ----------
  - id: hem.L06.006
    kind: card
    topic: antibodies
    front: What is a naturally occurring antibody?
    back: One produced without any obvious immunizing stimulus such as pregnancy or transfusion (e.g. anti-A and anti-B).
    src: { page: 85, quote: "Antibodies are naturally occurring when they are produced without any obvious immunizing stimulus, such as pregnancy or transfusion." }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.007
    kind: cloze
    topic: antibodies
    text: "Anti-A and anti-B are not present at birth; they appear at about {{c1::3–6 months}} of age."
    src: { page: 85, quote: "anti-A and anti-B, start to appear in the serum at about 3–6 months of age." }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L06.008
    kind: card
    topic: antibodies
    front: What probably triggers the "naturally occurring" ABO antibodies?
    back: Antigens of bacteria, viruses and other substances that are inhaled or ingested.
    src: { page: 85, quote: "ABO antibodies are probably produced in response to antigens of bacteria, viruses and other substances that are inhaled or ingested." }
    status: unverified
  - id: hem.L06.009
    kind: card
    topic: antibodies
    front: When are immune (allo-) red cell antibodies produced?
    back: Only after pregnancy, transfusion, or injection of blood or blood group substances.
    src: { page: 85, quote: "‗Immune‘ red cell or alloantibodies are only produced after pregnancy or followingtransfusion or injection of blood or blood group substances" }
    status: unverified
  - id: hem.L06.010
    kind: card
    topic: antibodies
    front: Alloantibody versus autoantibody?
    back: An alloantibody is made against antigens from another person (transfused or fetal cells) and needs prior sensitization; an autoantibody is made against the person's own antigens. Most antibodies other than anti-A and anti-B are allo-antibodies.
    src: { page: 84, quote: "Development of most other allo-Abs requires prior sensitization. What is ALLO Vs AUTO antibodies." }
    status: unverified
  - id: hem.L06.011
    kind: card
    topic: antibodies
    front: How do most adults' ABO antibodies relate to their own antigens?
    back: They have naturally occurring antibodies to the ABO antigens they lack.
    src: { page: 86, quote: "they have ‗naturally occurring‘ antibodies to those ABO antigens they lack." }
    status: unverified
  - id: hem.L06.012
    kind: card
    topic: antibodies
    front: How are antibodies to most non-ABO blood groups formed?
    back: Only by immunization, by transfused red cells or by fetal red cells leaking into the mother during pregnancy or childbirth.
    src: { page: 86, quote: "are only formed as a result of immunization by transfused red cells or by fetal red cells leaking into the maternal circulation" }
    status: unverified
  - id: hem.L06.013
    kind: table
    topic: antibodies
    title: IgM versus IgG blood group antibodies
    columns: [Feature, IgM, IgG]
    rows:
      - [Agglutinates saline-suspended red cells, "Yes (saline or directly agglutinating)", Usually not]
      - [To show agglutination, Nothing extra, "Potentiators or anti-human globulin"]
    blanks: [[0, 1], [0, 2], [1, 2]]
    src: { page: 86, quote: "IgM antibodies will directly agglutinate antigen-positive red cells in a saline medium, whereas most IgG antibodies require potentiators or anti-human globulin" }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.014
    kind: card
    topic: antibodies
    front: Which immunoglobulin classes are blood group antibodies?
    back: Usually IgM or IgG, though some may be IgA.
    src: { page: 86, quote: "Blood group antibodies are usually IgM or IgG, although some may be IgA." }
    status: unverified
  # ---------- p86-87: systems and compatibility ----------
  - id: hem.L06.015
    kind: cloze
    topic: compatibility
    text: "The ISBT recognizes {{c1::339}} blood group antigens; {{c2::297}} of them fall into {{c3::33}} blood group systems."
    src: { page: 86, quote: "The International Society of Blood Transfusion (ISBT) recognizes 339 blood group antigens; 297 of these are classified into 1 of 33 blood group systems" }
    status: unverified
    tags: [numbers]
    update:
      text: "The ISBT list keeps growing; it counted 47 blood group systems by 2024."
      ref: "ISBT Red Cell Immunogenetics and Blood Group Terminology working party, 2024"
  - id: hem.L06.016
    kind: card
    topic: compatibility
    front: What does each blood group system represent genetically?
    back: A single gene or a cluster of two or three closely linked related genes with little or no recombination, so each system is a genetically discrete entity.
    src: { page: 86, quote: "Each blood group system represents either a single gene or a cluster of two or three closely linked genes of related sequence" }
    status: unverified
  - id: hem.L06.017
    kind: cloze
    topic: compatibility
    text: "Blood components containing more than {{c1::2 ml}} of red cells must be compatible with the patient's {{c2::plasma}}."
    src: { page: 87, quote: "Blood components that contain > 2 ml of RBC must be compatible with patient‘s plasma." }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L06.018
    kind: table
    topic: compatibility
    title: ABO groups (p87 figure)
    columns: [Group, Red cell antigens, Plasma antibodies]
    rows:
      - [A, A antigen, Anti-B]
      - [B, B antigen, Anti-A]
      - [AB, A and B antigens, None]
      - [O, None, Anti-A and anti-B]
    blanks: [[0, 2], [1, 2], [2, 2], [3, 2]]
    src: { page: 87, quote: "Group AB Group O Red blood cell type Antibodies in Plasma None Anti-A and Anti-B" }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.019
    kind: card
    topic: compatibility
    front: Define major ABO incompatibility, with examples.
    back: The recipient's antibodies destroy the transfused red cells, e.g. A to O, B to O, A to B, B to A.
    src: { page: 87, quote: "Major incompatibility, where antibodies in the recipient will destroy transfused red cells (e.g. A to O, B to O, A to B, B to A)." }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.020
    kind: card
    topic: compatibility
    front: Define minor ABO incompatibility, with examples.
    back: Antibodies in the donated blood destroy the recipient's red cells, e.g. O to A, O to B.
    src: { page: 87, quote: "Minor incompatibility, where antibodies in the donated blood will destroy the recipient‘s red cells (e.g. O to A, O to B)." }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.021
    kind: mcq
    topic: compatibility
    stem: A group A patient is given a unit of group O whole blood in an emergency. Which incompatibility could this cause?
    options:
      - Minor incompatibility (donor anti-A against the recipient's cells)
      - Major incompatibility (recipient anti-O against donor cells)
      - No incompatibility is possible
      - Major incompatibility (recipient anti-B against donor cells)
      - Rh incompatibility only
    answer: 0
    why:
      - "Correct: O to A is minor; the donor's anti-A acts on the recipient's red cells (p87)."
      - "There is no anti-O antibody; O cells carry no A or B antigen."
      - "Group O plasma carries anti-A and anti-B, so minor incompatibility is possible."
      - "Recipient anti-B does not react with O cells."
      - "Rh is not part of the stem."
    src: { page: 87, quote: "Minor incompatibility, where antibodies in the donated blood will destroy the recipient‘s red cells (e.g. O to A, O to B)." }
    status: unverified
  - id: hem.L06.022
    kind: mcq
    topic: compatibility
    stem: Which transfusion is an example of major ABO incompatibility?
    options:
      - Group A red cells to a group O patient
      - Group O red cells to a group A patient
      - Group O red cells to a group B patient
      - Group A red cells to a group AB patient
      - Group B red cells to a group AB patient
    answer: 0
    why:
      - "Correct: the O recipient's anti-A destroys the A cells: major (p87)."
      - "O to A is minor incompatibility."
      - "O to B is minor incompatibility."
      - "AB recipients have no anti-A or anti-B."
      - "AB recipients have no anti-B."
    src: { page: 87, quote: "Major incompatibility, where antibodies in the recipient will destroy transfused red cells (e.g. A to O, B to O, A to B, B to A)." }
    status: unverified
  # ---------- p88-92: components ----------
  - id: hem.L06.023
    kind: table
    topic: components
    title: Blood components (p88)
    columns: [Group, Products]
    rows:
      - [Cellular, "Packed RBCs; random platelets (from whole blood); apheresis platelets"]
      - [Modifications, "CMV-negative; leukoreduced; irradiated; washed (only PRBCs)"]
      - [Non-cellular, "Plasma (FFP, FP24, thawed plasma); cryoprecipitate"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 88, quote: "Possible modifications (specifications) = CMV-negative = Leukoreduced = Irradiated = Washed (only PRBCs)" }
    status: unverified
  - id: hem.L06.024
    kind: card
    topic: components
    front: Do the modifications (CMV-negative, leukoreduced, irradiated, washed) apply to plasma and cryoprecipitate?
    back: No; they apply to cellular products only (washing to PRBCs only).
    src: { page: 88, quote: "Cryoprecipitate = Above specifications do not apply" }
    status: unverified
  - id: hem.L06.025
    kind: card
    topic: components
    front: Indication for whole blood, and why it is not a source of platelets or granulocytes?
    back: Acute hypovolemia with red cell loss; platelets and granulocytes deteriorate in under 24 hours at refrigerator temperature.
    src: { page: 88, quote: "It is not a source of functional PLT or granulocytes, which deteriorate in < 24 hours at refrigerator temp." }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.026
    kind: cloze
    topic: components
    text: "One unit of packed RBCs raises Hb by about {{c1::1 g/dl}} in an average-sized adult; its indication is {{c2::symptomatic anemia}}."
    src: { page: 89, quote: "1 Unit of packed RBC increases Hb by 1 g/dl in an average-sized adult. Indications: treatment of symptomatic anemia." }
    status: unverified
    tags: [numbers, high-yield]
  - id: hem.L06.027
    kind: card
    topic: components
    front: What is leukoreduction and what does it remove?
    back: Filtration through special filters that bind 99.9% of donor white cells.
    src: { page: 89, quote: "Filtration with specialized filters that bind 99.9% of WBC from donor unit" }
    status: unverified
  - id: hem.L06.028
    kind: enumerate
    topic: components
    prompt: Which risks does leukoreduction essentially eliminate or reduce?
    points:
      - Febrile non-hemolytic transfusion reaction
      - CMV and HTLV I–II
      - Herpesviruses, EBV
      - Trypanosoma cruzi
      - TRALI (decreased risk)
    pass: 4
    src: { page: 89, quote: "LR essentially eliminates risk of: Febrile non-hemolytic transfusion reaction" }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.029
    kind: enumerate
    topic: components
    prompt: Indications for washed PRBCs?
    points:
      - Severe IgA deficiency (to prevent anaphylaxis)
      - Significant hyperkalemia
      - Ongoing hemolysis from anti-A or anti-B
      - History of repeated allergic reactions
    pass: 3
    src: { page: 89, quote: "Severe IgA deficiency to prevent anaphylaxis" }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.030
    kind: card
    topic: components
    front: What does washing PRBCs remove, and what is its drawback?
    back: The supernatant (plasma proteins, potassium, additive solution); the bag is opened and saline added many times, so contamination risk rises and shelf life is only 24 hours.
    src: { page: 89, quote: "To remove supernatant (plasma proteins, K, additive solution, etc)" }
    status: unverified
  - id: hem.L06.031
    kind: card
    topic: components
    front: Purpose of irradiating blood products?
    back: To prevent donor lymphocyte proliferation in the recipient and transfusion-associated graft-versus-host disease (TA-GVHD).
    src: { page: 90, quote: "To prevent lymphocyte proliferation in recipient and transfusion-associated graft-versus-host disease (TA-GVHD)" }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.032
    kind: enumerate
    topic: components
    prompt: Enumerate the indications for irradiated blood products.
    points:
      - Stem cell transplant patients (from at least 30 days before, indefinitely after)
      - Products from first-degree relatives
      - Intrauterine transfusions and babies up to 4 months
      - Congenital immunodeficiency syndromes
      - Recipients of fludarabine, nelarabine or clofarabine
    pass: 4
    src: { page: 90, quote: "Recipients of blood products from 1st degree relatives" }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.033
    kind: card
    topic: components
    front: Why must blood from a first-degree relative be irradiated?
    back: The donor's lymphocytes share HLA with the recipient, escape rejection, proliferate and cause TA-GVHD; irradiation prevents their proliferation.
    src: { page: 90, quote: "Recipients of blood products from 1st degree relatives" }
    status: unverified
  - id: hem.L06.034
    kind: card
    topic: components
    front: Two ways platelets are collected?
    back: Separated from whole blood by centrifugation shortly after collection (random donor platelet concentrates), or by apheresis (single donor).
    src: { page: 90, quote: "May be separated from whole blood shortly after collection by centrifugation (random donor or PLT concentrates) or collected by apheresis" }
    status: unverified
  - id: hem.L06.035
    kind: enumerate
    topic: components
    prompt: Indications for platelet transfusion?
    points: [Bleeding with thrombocytopenia, Qualitative platelet defects]
    pass: 2
    src: { page: 90, quote: "Indications: - Bleeding associated with thrombocytopenia. - Qualitative PLT defects." }
    status: unverified
  - id: hem.L06.036
    kind: table
    topic: components
    title: Platelet refractoriness (p90)
    columns: [Type, Causes]
    rows:
      - [Non-immune, "Fever, infection, splenomegaly, DIC, massive bleeding, drugs that destroy platelets"]
      - [Immune, "Repeated transfusions (esp. non-leukoreduced platelets), multiparity: HLA and HPA alloimmunization"]
      - [Management, "HLA-compatible or cross-match compatible platelets"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 90, quote: "Immune-mediated: repeated transfusions especially with non-leukocyte reduced PLT and multiparity (alloimmunization to HLA and human PLT antigens)." }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.037
    kind: card
    topic: components
    front: How are granulocytes collected for transfusion?
    back: By apheresis from donors mobilized beforehand with G-CSF.
    src: { page: 91, quote: "Collected by apheresis, form donors who are mobilized prior to collection with G-CSF." }
    status: unverified
  - id: hem.L06.038
    kind: enumerate
    topic: components
    prompt: Indications for granulocyte transfusion?
    points: ["Neutropenia (ANC <0.5 × 10⁹/L) with documented infection", Defective granulocyte function (chronic granulomatous disease)]
    pass: 2
    src: { page: 91, quote: "Neutropenia (ANC < 0.5 109/L) and documented infection. - Defective granulocyte function (in chronic granulomatous disease)." }
    status: unverified
  - id: hem.L06.039
    kind: enumerate
    topic: components
    prompt: Enumerate the indications for fresh frozen plasma.
    points:
      - Multiple clotting factor deficiencies in bleeding patients or before invasive procedures
      - DIC, liver disease, massive transfusion
      - Plasma exchange (TTP)
      - Rapid reversal of warfarin
      - Congenital factor deficiencies (concentrates preferred)
    pass: 4
    src: { page: 91, quote: "Correction of multiple clotting factor deficiencies in bleeding patients or prior to invasive procedures. DIC, liver disease, massive transfusions." }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.040
    kind: card
    topic: components
    front: What should FFP NOT be used for?
    back: Volume expansion, or protein replacement in nutritional deficiency.
    src: { page: 91, quote: "Should not be used for volume expansion or protein replacement in nutritional deficiencies" }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.041
    kind: card
    topic: components
    front: Why are factor concentrates preferred to FFP for congenital factor deficiencies?
    back: Concentrated or recombinant preparations decrease viral transmission.
    src: { page: 91, quote: "Congenital factor deficiencies (concentrated or recombinant factor preparations are preferable to decrease viral transmission)." }
    status: unverified
  - id: hem.L06.042
    kind: enumerate
    topic: components
    prompt: What does a unit of cryoprecipitate contain?
    points: [Factor VIII, Fibrinogen, Factor XIII, VWF activity]
    pass: 4
    src: { page: 91, quote: "A unit of cryoprecipitate is a fraction of plasma and contains factor VIII, fibrinogen, factor XIII and vWF activity." }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.043
    kind: enumerate
    topic: components
    prompt: Indications for cryoprecipitate?
    points:
      - Fibrinogen deficiency
      - Dysfibrinogenemia
      - Factor XIII deficiency
      - DIC
      - Urgent hemophilia A or VWD when FVIII concentrate is unavailable
    pass: 4
    src: { page: 92, quote: "Urgent treatment of hemophilia A and von Willebrand disease in the absence of F VIII concentrate or recombinant F VIII." }
    status: unverified
  - id: hem.L06.044
    kind: mcq
    topic: components
    stem: A 30-year-old man with no family history of bleeding has a hip replacement planned. He had an anaphylactic reaction to a previous transfusion and his IgA is undetectable. Which red cell product is indicated?
    options:
      - Washed PRBCs
      - Irradiated PRBCs
      - CMV-negative PRBCs
      - Whole blood
      - Leukoreduced platelets
    answer: 0
    why:
      - "Correct: washing removes plasma proteins (including IgA); severe IgA deficiency is an indication to prevent anaphylaxis (p89)."
      - "Irradiation prevents TA-GVHD; it does not remove IgA."
      - "CMV-negative units still contain plasma IgA."
      - "Whole blood carries the most plasma."
      - "He needs red cells, not platelets."
    src: { page: 89, quote: "Severe IgA deficiency to prevent anaphylaxis" }
    status: unverified
  - id: hem.L06.045
    kind: mcq
    topic: components
    stem: A 55-year-old man is being treated with fludarabine for CLL and needs red cell transfusion. Which modification is required?
    options:
      - Irradiation
      - Washing
      - Nothing; standard units are fine
      - Cryoprecipitate added
      - Whole blood instead
    answer: 0
    why:
      - "Correct: recipients of fludarabine, nelarabine or clofarabine need irradiated products to prevent TA-GVHD (p90)."
      - "Washing is for IgA deficiency, hyperkalemia, allergic reactions, anti-A/B hemolysis."
      - "Purine analogues impair T cells, so TA-GVHD risk is high."
      - "Cryoprecipitate is a plasma product, not a modification."
      - "Whole blood is for acute hypovolemia."
    src: { page: 90, quote: "Recipients of Fludarabine/Nelarabine/Clofarabine" }
    status: unverified
  - id: hem.L06.046
    kind: mcq
    topic: components
    stem: A woman with five previous pregnancies and acute leukemia gets platelet transfusions. Her 1-hour post-transfusion count barely rises. She has no fever, no splenomegaly and no DIC. Best next step?
    options:
      - HLA-compatible or cross-match compatible platelets
      - Double the dose of random platelets
      - Fresh frozen plasma
      - Stop all platelet transfusions forever
      - Granulocyte transfusion
    answer: 0
    why:
      - "Correct: multiparity points to immune refractoriness (HLA/HPA); give HLA- or cross-match compatible platelets (p90)."
      - "More random platelets will be destroyed by the same antibodies."
      - "FFP does not supply platelets."
      - "Platelets are still needed for bleeding; choose compatible units."
      - "Granulocytes are for neutropenic infection."
    src: { page: 90, quote: "Management: HLA-compatible PLT or cross-match compatible PLT." }
    status: unverified
  - id: hem.L06.047
    kind: mcq
    topic: components
    stem: A 70-year-old man on warfarin (INR 6) has an acute subdural hematoma and needs surgery now. Which blood component does the lecture give for rapid warfarin reversal?
    options:
      - Fresh frozen plasma
      - Cryoprecipitate alone
      - Platelet concentrate
      - Albumin
      - Packed RBCs
    answer: 0
    why:
      - "Correct: rapid removal of warfarin effect is an FFP indication (p91)."
      - "Cryo lacks factors II, VII, IX and X."
      - "Platelet function is not the problem."
      - "Albumin is a volume expander, not a factor source."
      - "Packed cells carry no useful factors."
    src: { page: 91, quote: "Plasma exchange (as in TTP). Rapid removal of warfarin effect." }
    status: unverified
    update:
      text: "Four-factor prothrombin complex concentrate plus IV vitamin K is now preferred over FFP for urgent warfarin reversal."
      ref: "ACC Expert Consensus on anticoagulant-associated bleeding 2020"
  - id: hem.L06.048
    kind: mcq
    topic: components
    stem: A woman with postpartum hemorrhage has fibrinogen 0.8 g/L after FFP. Which component best raises fibrinogen?
    options:
      - Cryoprecipitate
      - Albumin
      - Platelet concentrate
      - Washed PRBCs
      - IVIG
    answer: 0
    why:
      - "Correct: cryoprecipitate contains fibrinogen and treats fibrinogen deficiency and DIC (p91–92)."
      - "Albumin has no fibrinogen."
      - "Platelets do not replace fibrinogen."
      - "Washed red cells have the plasma removed."
      - "IVIG is an immunoglobulin."
    src: { page: 91, quote: "A unit of cryoprecipitate is a fraction of plasma and contains factor VIII, fibrinogen, factor XIII and vWF activity." }
    status: unverified
  # ---------- p92-93: derivatives ----------
  - id: hem.L06.049
    kind: card
    topic: derivatives
    front: What are blood derivatives?
    back: Products made commercially by fractionating plasma (albumin, immune globulins, factor concentrates), heat- or chemically treated to inactivate viruses.
    src: { page: 92, quote: "Blood products produced commercially by fractionation of plasma and include colloids such as albumin, immune globulins, coagulation factor concentrates." }
    status: unverified
  - id: hem.L06.050
    kind: card
    topic: derivatives
    front: Indication for Rh immune globulin?
    back: Preventing anti-D formation in Rh-negative pregnant women with Rh-positive fetuses, and so hemolytic disease of the newborn.
    src: { page: 92, quote: "Prevention of development of anti-D by pregnant Rh –ve women with Rh +ve fetuses and subsequent hemolytic dis. Of newborn (HDN)." }
    status: unverified
    tags: [high-yield]
  - id: hem.L06.051
    kind: enumerate
    topic: derivatives
    prompt: Enumerate the indications for albumin.
    points:
      - Hypovolemia (volume expansion)
      - Acute liver failure (oncotic pressure, binds bilirubin)
      - Cardiopulmonary bypass (hemodilution)
      - After extensive burns
      - Before exchange transfusion for HDN (binds free bilirubin, lowers kernicterus risk)
    pass: 4
    src: { page: 92, quote: "Hypovolemia: volume expansion. - Acute liver failure: osmotic pressure, binds excess bilirubin. - Cardiopulmonary bypass surgery: hemodilution." }
    status: unverified
  - id: hem.L06.052
    kind: enumerate
    topic: derivatives
    prompt: Enumerate the indications for IVIG.
    points:
      - Passive immunity and passive antibody prophylaxis
