lessons:
  # ------------------------------------------------------------------
  - id: neph.L13.lesson1
    title: "السكر والكلية: قد إيه المشكلة، ونسمّيها إيه"
    hook: "نص مرضى السكر من النوع التاني هيقابلوا الكلية في يوم. يبقى لازم تعرف تسمّيها صح."
    minutes: 7
    pages: [425, 426]
    topics: [epidemiology, definition]
    goals:
      - "تعرف حجم الـ DKD وليه بقى أول سبب للـ ESKD"
      - "تفرّق بين الـ DKD والـ DN"
      - "تحفظ التعريف بالأرقام وتفهم ليه 3 شهور وليه and/or"
    status: unverified
    steps:
      - kind: explain
        page: 425
        title: "قد إيه المشكلة كبيرة؟"
        quote: "DKD is the leading cause of chronic kidney disease and end-stage kidney disease, accounting for 50% of cases."
        text: |
          - في 2021 كان فيه **537 million** مريض سكر (**11%** من العالم)، ومتوقع **783 million** سنة 2045.
          - **20-50%** من الـ type 2 diabetes mellitus (T2DM) هيعملوا diabetic kidney disease (DKD).
          - الـ ==DKD== هو **أول سبب** للـ chronic kidney disease (CKD) والـ end-stage kidney disease (ESKD)، **50%** من الحالات.
          - وبيعلّي الـ **cardiovascular morbidity and mortality**.

          على مدى العمر: **نص** الـ T2DM و **تلت** الـ type 1 diabetes mellitus (T1DM).
      - kind: explain
        page: 425
        title: "ليه السكر بقى أول سبب للـ ESKD؟"
        quote: "Globally, the incidence and prevalence of diabetes mellitus has risen dramatically, owing mainly to the increase in type 2 diabetes mellitus."
        text: |
          الكتاب بيدّيك السبب الأساسي: الزيادة ==owing mainly to== الـ **type 2 diabetes mellitus**. يعني المشكلة جاية من عدد العيانين نفسه.

          التفسير المقبول (مش في الكتاب) للباقي:
          - **عدد أكبر × عمر أطول:** العيان بيعيش مع السكر سنين أكتر بفضل العلاج، فالكلية عندها وقت تتأذي.
          - **الكلية والقلب في نفس المركب:** الأوعية الصغيرة اللي بتبوظ في الكلية بتبوظ في القلب كمان، وعشان كده الكتاب بيقول الـ DKD بيعلّي الـ **cardiovascular morbidity and mortality** ويقلل الـ **quality of life**.

          ولذلك الـ DKD لوحده **50%** من الـ CKD والـ ESKD.
      - kind: check
        page: 425
        quote: "DKD is the leading cause of chronic kidney disease and end-stage kidney disease, accounting for 50% of cases."
        question: "What share of CKD and end-stage kidney disease does DKD account for, per the lecture?"
        options:
          - "50%"
          - "10%"
          - "25%"
          - "80%"
        answer: 0
        why:
          - "صح: الكتاب بيقول accounting for 50% of cases."
          - "أقل بكتير من رقم الكتاب."
          - "ده قريب من نسبة الـ T2DM اللي بيعملوا DKD (20-50%)، مش نسبة الـ DKD من الـ ESKD."
          - "أكتر من رقم الكتاب."
      - kind: explain
        page: 426
        title: "DKD ولا DN؟"
        quote: "Whereas the term DN is exclusively reserved for the histologic diagnosis of glomerular changes observed on biopsy."
        text: |
          - **DKD** (KDIGO): **clinical diagnosis**، يعني CKD في واحد عنده سكر.
          - **DN** (diabetic nephropathy): **histologic diagnosis** من الـ biopsy بس.

          التعريف بالأرقام: ==albumin-to-creatinine ratio (ACR) ≥30 mg/g== و/أو **estimated glomerular filtration rate (eGFR) <60** لمدة **3 شهور على الأقل** في مريض سكر.
      - kind: explain
        page: 426
        title: "ليه 3 شهور، وليه and/or؟"
        quote: "Typically, DKD is defined by the presence of chronic kidney disease (CKD) characterized by persistently (at least 3 months) elevated urinary albumin excretion (albumin-to-creatine ratio ≥ 30 mg/g) and/or low estimated glomerular filtration rate (eGFR < 60 mL/min/1.73 m2) in a person with diabetes."
        text: |
          كل كلمة في التعريف ليها شغلانة:

          - ==at least 3 months==: التفسير المقبول (مش في الكتاب): ده نفس شرط أي CKD. الـ albumin في البول بيعلى ويوطى مع المجهود والسخونية، فرقم واحد مش كفاية. (الكتاب نفسه هيقولك في الـ screening إن فيه **variability**.)
          - **ACR ≥30 mg/g:** ده باب **الفلتر بيسرّب**.
          - **eGFR <60:** ده باب **عدد الـ nephrons قلّ**.
          - ==and/or==: لأن الاتنين ممكن يحصلوا منفصلين. الكتاب بيقول بعد كده إن كتير من العيانين بيجوا بـ **CKD من غير albuminuria**، فلو اشترطنا الاتنين هنفوّت ناس كتير.
      - kind: check
        page: 426
        quote: "Typically, DKD is defined by the presence of chronic kidney disease (CKD) characterized by persistently (at least 3 months) elevated urinary albumin excretion (albumin-to-creatine ratio ≥ 30 mg/g) and/or low estimated glomerular filtration rate (eGFR < 60 mL/min/1.73 m2) in a person with diabetes."
        question: "A diabetic has eGFR 75 and ACR 45 mg/g on samples 4 months apart. Biopsy not done. What do you call it?"
        options:
          - "Diabetic kidney disease"
          - "Diabetic nephropathy"
          - "Not DKD, because eGFR is above 60"
          - "Not DKD until a biopsy is done"
        answer: 0
        why:
          - "صح: ACR ≥30 لمدة أكتر من 3 شهور كفاية، والـ eGFR مش لازم يكون واطي (and/or)."
          - "الـ DN محتاجة biopsy."
          - "الشرط and/or، فالـ albuminuria لوحدها كفاية."
          - "الـ DKD تشخيص clinical."
      - kind: aside
        tone: exam
        page: 426
        quote: "Whereas the term DN is exclusively reserved for the histologic diagnosis of glomerular changes observed on biopsy."
        text: "فخ في الكتابة: لو العيان ماعملش **biopsy**، اكتب **DKD** مش DN. الكتاب بيقول الـ DN ==exclusively reserved== للتشخيص الـ histologic. يعني DN = ميكروسكوب، DKD = عيادة."
      - kind: reveal
        page: 425
        quote: "Diabetic kidney disease develops in nearly half of patients with T2DM and one-third of those with T1DM during their lifetime."
        prompt: "الكتاب بيقول نص الـ T2DM وتلت الـ T1DM بيعملوا DKD. ليه النوع التاني أكتر، مع إن الـ T1DM بيبدأ بدري وبيعيش معاه أطول؟"
        answer: |
          التفسير المقبول (مش في الكتاب): عيان الـ T2DM مش جاي بالسكر لوحده. غالبًا معاه **hypertension** و **obesity** و **dyslipidemia**، ودول كلهم بيضربوا الكلية (هتلاقيهم في الـ **modifiable risk factors** في درس جاي).

          وكمان الـ T2DM بيبقى موجود سنين **قبل** ما يتشخّص، فالكلية بتتأذي في السكوت. وده نفس السبب اللي هيخلي الـ screening يبدأ **من يوم التشخيص** في الـ T2DM.
      - kind: try
        items: [neph.L13.004, neph.L13.006, neph.L13.009, neph.L13.010, neph.L13.106]
    recap:
      - "537 million سنة 2021 (11%)، و783 million متوقع 2045؛ الزيادة من الـ T2DM."
      - "الـ DKD = 50% من الـ CKD والـ ESKD، وبيعلّي الـ cardiovascular risk."
      - "على مدى العمر: نص الـ T2DM وتلت الـ T1DM."
      - "DKD = clinical (KDIGO)؛ DN = biopsy بس."
      - "التعريف: ACR ≥30 و/أو eGFR <60 لمدة 3 شهور على الأقل في مريض سكر."
    practice: [neph.L13.001, neph.L13.002, neph.L13.003, neph.L13.004, neph.L13.005, neph.L13.006, neph.L13.007, neph.L13.008, neph.L13.009, neph.L13.010, neph.L13.106]
