        title: "الوحدة: 15 جرام"
        quote: "One serving of carbohydrate is measured as 15 grams. A food that contains 15 grams of carbohydrate is called \"one carb serving\".\nFor example, one slice of bread, a small piece of fruit, or a ear of corn each have around 15 grams of carb. Each of these equals one carb serving."
        text: |
          ==One carb serving = 15 g== carbohydrate.

          يعني **slice of bread** = **small fruit** = **ear of corn**: كل واحد حوالي 15 g.

