        text: |
          **مفاصل** (الكتاب):
          - **Pseudogout**: نفس الصورة بالظبط. التفسير المقبول (مش في الكتاب): الكريستال هنا calcium pyrophosphate، والـ aspiration هو اللي بيفرّق.
          - **Traumatic osteoarthritis**: الـ trauma نفسها من الـ triggers، فلازم تفرّق.
          - ==Pyogenic arthritis==: الأخطر. مفصل سخن وأحمر وسخونية وleukocytosis، زي الـ gout بالظبط (ص 235)، بس لو فاتك هيبوّظ المفصل. عشان كده المفصل الواحد السخن يتسحب منه.

          **أنسجة رخوة** (الكتاب، ص 245): **bursitis**، **tendinitis**، **thrombophlebitis**، ==cellulitis==. التفسير المقبول (مش في الكتاب): الجلد اللي فوق الهجمة dusky red ومتورم، فبيتلخبط مع الـ cellulitis، وبتلاقي المريض واخد antibiotics على الفاضي.
