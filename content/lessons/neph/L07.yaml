            <rect x="15" y="200" width="137" height="70" rx="8" class="fg-box"/>
            <text x="25" y="220" class="t-sm t-b">Simple cysts</text>
            <text x="25" y="238" class="t-sm">Age &gt;65 · no FH</text>
            <text x="25" y="256" class="t-sm">no CKD</text>
            <rect x="168" y="5" width="157" height="280" rx="10" class="fg-good"/>
            <text x="246" y="28" text-anchor="middle" class="t-b">Medulla</text>
            <rect x="178" y="40" width="137" height="70" rx="8" class="fg-box"/>
