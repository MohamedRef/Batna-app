  - id: hb.L15.lesson1
    title: "البنكرياس: مصنع متفجرات بيحمي نفسه"
    hook: "عضو بيصنع إنزيمات تهضم اللحمة، ومع ذلك مبياكلش نفسه. إزاي؟ ولما الأنابيب تتركّب غلط بيحصل إيه؟"
    minutes: 8
    pages: [274, 277]
    topics: [basics, congenital]
    goals:
      - "ترسم البنكرياس وجيرانه وتعرف أجزاءه الخمسة"
      - "تعدّ الـ 5 حاجات اللي بتمنع الـ self-digestion"
      - "تفرّق بين الـ 4 congenital anomalies من علامة واحدة"
    status: unverified
    steps:
      - kind: explain
        page: 274
        title: "قابل البنكرياس"
        text: |
          البنكرياس نايم بالعرض ورا المعدة (**transversely oriented**). أجزاؤه من اليمين للشمال:
          - **Head**: قاعدة جوه حضن الـ **C-shaped duodenum**.
          - **Uncinate process**: لسان صغير طالع من تحت الرأس.
          - **Neck** ثم **body** ثم **tail**: الديل بيخلص عند الـ **splenic hilum**.

          وهو **retroperitoneal**، يعني ورا الـ peritoneum ولازق في الضهر. ده بيفسّر حاجتين هتقابلهم بعدين:
          - وجعه بيروح للضهر في الـ pancreatitis والسرطان.
          - ممكن يمرض في صمت لحد ما يكبر، لأن مفيش حاجة حواليه بتشتكي بدري.

          أرقامه اللي ممكن تتسأل: طوله حوالي 20 cm ووزنه حوالي 90 gm.
