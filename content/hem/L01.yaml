        question: The spleen and liver are making blood cells. What is this called?
        options: [Extramedullary haematopoiesis, Lymphopoiesis, Thymic maturation, Megakaryocytopoiesis]
        answer: 0
        why: "When the marrow fails or is overwhelmed, the spleen, liver and lymph nodes revert to producing immature blood cells, and they enlarge (p7)."
