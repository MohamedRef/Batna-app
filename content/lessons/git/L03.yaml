  - id: git.L03.lesson8
    title: "النفسية والإحساس والبكتيريا"
    hook: "ليه مريض الـ IBS بيتوجع من غاز طبيعي؟ وليه بيبدأ ساعات بعد نزلة معوية؟"
    minutes: 9
    pages: [80, 83]
    topics: [psychosocial, physiology]
    goals:
      - "تشرح إزاي الـ psychosocial factors بتغيّر تجربة المرض، وإزاي المرض بيرجع يزوّدها"
      - "تفرّق بين الـ visceral hyperalgesia والـ allodynia"
      - "ترتّب سلسلة الـ postinfection hypersensitivity وتعرف دور البكتيريا والأكل"
    status: unverified
    steps:
      - kind: reveal
        page: 80
        quote: "This explains why psychosocial trauma (e.g., sexual or physical abuse history) is more common in referral centers than in primary care, may decrease the pain threshold and symptom reporting, and is associated with a poorer clinical outcome."
        prompt: "ليه تاريخ الـ sexual أو physical abuse أكتر في الـ referral centers منه في الـ primary care؟"
        answer: |
          لأن الـ psychosocial factors **modify the experience of illness** وسلوك المريض:

          - بتقلّل الـ **pain threshold** وبتزوّد الـ symptom reporting.
          - فالمريض بيدوّر أكتر على health care، وبيتحوّل أكتر، ونتيجته أسوأ.

          يعني الـ referral center بيتجمّع فيه المرضى الأصعب. والحاجة اللي بتخفف ده: **adaptive coping skills** و **social support**.
      - kind: explain
        page: 80
        quote: "Psychosocial Effects of Illness, namely emotional distress and maladaptive cognitions, may feed back to perpetuate and amplify symptoms."
        title: "دايرة بتلف على نفسها"
        text: |
          الكتاب بيقول الاتجاه التاني كمان: الـ FGID نفسه ممكن يعمل ==psychosocial consequences==. أي مرض مزمن بيأثر على الـ **well-being**، والشغل اليومي، والإحساس بالسيطرة على الأعراض، والخوف من المستقبل في الشغل والبيت، وده بيتقاس بالـ **health-related QOL**.

          والـ **emotional distress** والـ **maladaptive cognitions** ممكن **feed back** فيطوّلوا الأعراض ويكبّروها.

          ص 81: المريض الشديد ممكن يبقى عنده **morbid pessimism** و **helplessness** (==catastrophize==)، ويركّز في أعراضه ويبقى **hypervigilant** ليها، فيعمل **visceral anxiety**. وكل ده بيقلّل الـ sensation thresholds ويضعف الـ self-efficacy والـ self-esteem. وهنا محتاج **behavioral intervention**.

          التفسير المقبول (مش في الكتاب): تخيّل حد مستني صوت الموبايل: أي اهتزاز بسيط يحسّه. المريض اللي خايف من الألم بيراقب بطنه طول الوقت، فأي حركة طبيعية تتسجّل كألم، والألم يزوّد الخوف. علشان كده العلاج النفسي هنا مش «انت بتتخيّل»، هو كسر الدايرة دي.
      - kind: explain
        page: 81
        quote: "These patients have a lower pain threshold with balloon distension of the bowel (visceral hyperalgesia), or they have increased sensitivity even to normal intestinal function (allodynia)."
        title: "المصران حساس زيادة عن اللزوم"
        text: |
          الـ **abnormal motility** بتعمل nausea و vomiting و diarrhea و pain، بس بترتبط بالأعراض جزئيًا بس، وما تكفيش تفسر الألم المزمن.

          اللي بيفسّر الألم هو ==visceral hypersensitivity==، وليها شكلين:

          - **Visceral hyperalgesia:** الـ pain threshold واطي، فالبالونة في المصران بتوجع بدري.
          - ==Allodynia==: حساسية لـ **normal intestinal function** نفسها، يعني الحركة الطبيعية بتوجع.

          ولما تنفخ البالونة كذا مرة، الألم بيزيد مؤقتًا عند الأصحاء، وبيطوّل أكتر عند مرضى الـ FGIDs.
      - kind: explain
        page: 81
        quote: "These motor responses only partially are correlated with symptoms, and are not sufficient to explain reports of chronic or recurrent abdominal pain."
        title: "الحركة لوحدها ما بتفسرش الألم"
        text: |
          الكتاب:
          - الـ **disturbed motility** بتعمل nausea و vomiting و diarrhea و acute abdominal pain و incontinence.
          - الـ **strong emotion** أو الـ **environmental stress** بيعملوا dysmotility في الجهاز كله عن طريق الـ **brain–gut axis**.
          - مرضى الـ FGIDs عندهم ==greater motility response to stressors== من الأصحاء.
          - بس الاستجابات دي **partially** مرتبطة بالأعراض، و**not sufficient** تفسر الألم المزمن أو المتكرر.

          علشان كده الكتاب بيدخل على الـ **visceral hypersensitivity**: لو الحركة مش كفاية تفسر الألم، يبقى المشكلة في **الإحساس** بالحركة.
      - kind: check
        page: 81
        quote: "These patients have a lower pain threshold with balloon distension of the bowel (visceral hyperalgesia), or they have increased sensitivity even to normal intestinal function (allodynia)."
        question: "A patient with IBS feels pain with a normal amount of gas and normal bowel contractions. What is this called?"
        options:
          - "Allodynia"
          - "Visceral hyperalgesia"
          - "Dysmotility"
          - "Catastrophizing"
        answer: 0
        why:
          - "صح: ألم من **normal intestinal function** = allodynia."
          - "الـ hyperalgesia = threshold واطي لمنبّه مؤلم أصلًا زي البالونة، مش للحركة الطبيعية."
          - "الحركة هنا طبيعية، فمفيش dysmotility."
          - "ده سلوك نفسي (morbid pessimism و hypervigilance)، مش اسم للإحساس نفسه."
      - kind: order
        page: 82
        quote: "These actions alter receptor sensitivity at the gut mucosa and myenteric plexus, producing visceral hypersensitivity."
        prompt: "بعد infection، رتّب إزاي المصران بيبقى حساس:"
        steps:
          - "Increased mucosal permeability (tight junctions)"
          - "Luminal antigens reach the submucosa"
          - "Low-grade mast cell activation and cytokine release"
          - "Altered receptor sensitivity at mucosa and myenteric plexus"
          - "Visceral hypersensitivity"
        why: "دي حكاية الـ **postinfection IBS**: الحاجز بيسرّب، الـ antigens بتدخل، الـ mast cells بتولّع التهاب خفيف، والـ receptors بتتظبط على حساسية أعلى. والـ stress بيزوّدها عن طريق الـ mast cells برضه."
      - kind: reveal
        page: 82
        quote: "Factors contributing to this occurrence include genetics, psychological stress via mast cell activation, and altered receptor sensitivity at the gut mucosa and myenteric plexus."
        prompt: "إيه اللي بيخلّي واحد يطلع من النزلة المعوية بـ IBS وواحد تاني لأ؟"
        answer: |
          الكتاب: العوامل اللي بتساهم هي **genetics**، والـ **psychological stress** عن طريق ==mast cell activation==، والـ **altered receptor sensitivity**. وبيزيد لما البيئة البكتيرية تتغيّر أو يحصل **infection** صريح.

          التفسير المقبول (مش في الكتاب): يعني الـ infection هي الشرارة، بس الأرض لازم تكون جاهزة. اتنين اتعرّضوا لنفس الأكل الملوث: اللي عنده stress وقتها، أو استعداد وراثي، الـ mast cells عنده بتفضل شغالة بعد ما الميكروب يمشي، فالـ hypersensitivity تفضل. ده بيفسّر ليه الـ stress بيظهر في الآليتين: الدماغ **و** الـ mast cells في المصران.
      - kind: explain
        page: 82
        quote: "The microbiome represents the collection of microorganisms, which is shaped by host factors such as genetics and nutrients, but in turn is able to influence host biology in health and disease."
        title: "الـ microbiome: طريق في الاتجاهين"
        text: |
          الكتاب: الـ ==microbiome== هو مجموعة الكائنات الدقيقة، **بيتشكّل** بالـ host (genetics و nutrients)، وفي نفس الوقت **بيأثر** على الـ host biology في الصحة والمرض. وبقى مجال بحث كبير، ومعاه مفهوم ==microbiome–gut–brain axis==.

          التفسير المقبول (مش في الكتاب): يعني بقى فيه ضلع تالت في المثلث: المخ بيكلم المصران، والمصران بيكلم المخ، والبكتيريا بتكلم الاتنين. علشان كده الأكل والمضاد الحيوي والـ probiotic كلهم ممكن يغيّروا أعراض مريض الـ IBS.
      - kind: explain
        page: 83
        quote: "Differences among IBS patients in the bacterial composition of the gut (e.g., increased firmicutes and reduced Bacteroidetes and Bifdobacteria), and also reduced fecal microbial diversity relative to healthy individuals, have implied a causative role in the onset and maintenance of IBS.This is supported by the modest effect of probiotics and more substantive benefit of periodic antibiotic treatment in improving IBS symptoms."
        title: "البكتيريا والأكل"
        text: |
          في مرضى الـ IBS الـ microbiome متغيّر:

          - **Firmicutes** أكتر، و **Bacteroidetes** و **Bifidobacteria** أقل.
          - والـ fecal microbial ==diversity== أقل من الأصحاء.

          الدليل إنها ليها دور: الـ probiotics ليها **modest effect**، والـ periodic antibiotic treatment فايدته أوضح.

          والأكل هو اللي بيأكّل البكتيريا (**substrates for fermentation**). علشان كده الـ low fermentable oligo-, di-, monosaccharides and polyols (FODMAP) أو تقليل الـ gluten بيفيد بعض المرضى، بس **no one diet** ينفع للكل، والعلاج لازم يكون individualized.
      - kind: reveal
        page: 83
        quote: "Certain specific alterations in diet such as low fermentable oligo-, di-, and monosaccharides and polyols, or gluten restriction in some patients, may provide benefit as a result of reduced osmotic effects or alterations in gut mucosa."
        prompt: "ليه الـ low FODMAP diet بيريّح بعض المرضى؟"
        answer: |
          الكتاب بيدّي سببين: ==reduced osmotic effects== أو **alterations in gut mucosa**. وكمان الأكل هو **substrate** للـ **fermentation**، ولأن البكتيريا متغيّرة في الـ IBS، الرابط بين الأكل والبكتيريا ونواتج التخمير ممكن يكون مهم في المرض.

          التفسير المقبول (مش في الكتاب): السكريات دي بتتمص قليل، فبتسحب مية جوه المصران (osmotic) وبتوصل للقولون تتخمّر وتعمل غاز. المصران العادي ما يحسّش بالزيادة دي، لكن المصران الـ **hypersensitive** بيحسّها ألم وانتفاخ. فتقليلها بيقلّل المنبّه نفسه.

          والكتاب واضح: **no one diet** ليه قيمة للكل، والعلاج **individualized**.
      - kind: check
