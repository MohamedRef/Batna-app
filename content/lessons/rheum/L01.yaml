            <path d="M165 126V150" class="fg-arrow-bad" marker-end="url(#R01d)"/>
            <rect x="85" y="154" width="160" height="34" rx="17" class="fg-box"/>
            <text x="100" y="176" class="t-sm">osteoclast precursor</text>
            <path d="M165 190V250" class="fg-arrow-bad" marker-end="url(#R01d)"/>
