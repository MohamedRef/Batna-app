      - kind: case
        page: 24
        stem: "Three patients in a primary-care clinic. Use the primary-care pathway on p24 (the step-wise pathway on p30 comes in lesson 3)."
        steps:
          - reveal: "Patient 1: 50-year-old woman, type 2 diabetes and obesity, no alcohol, no viral markers. FIB-4 is 1.1."
            question: "What next?"
            options:
              - "Low risk: no referral, lifestyle changes, re-test in 1–3 years"
              - "Transient elastography now"
              - "Refer to a liver specialist"
              - "Liver biopsy"
            answer: 0
            why: "FIB-4 **أقل من 1.30** = low risk. مفيش referral، lifestyle، ونعيد بعد **1–3 years**. الـ NIT هنا عمل شغلته: استبعد."
          - reveal: "Patient 2: same profile, but FIB-4 is 1.9. TE shows 14 kPa. A FibroTest is available and agrees."
            question: "How is this read?"
            options:
              - "F3–F4 highly likely"
              - "Low risk, re-test in 1–3 years"
              - "Consider liver biopsy"
              - "No conclusion without MRE"
            answer: 0
            why: "FIB-4 1.30 أو أكتر ودّاه للـ TE، و **8 kPa أو أكتر** يبقى intermediate-high، والـ patented test **concordant** يبقى **F3–F4 highly likely**. لو كان discordant أو مش متاح: consider biopsy. (وفي pathway صفحة 30 كمان: أكتر من 12 kPa يبقى high risk، فالاتنين متفقين هنا.)"
          - reveal: "Patient 3: 40-year-old man, HBsAg positive, normal FIB-4."
            question: "Where does he go?"
            options:
              - "Straight to a liver specialist"
              - "Lifestyle advice and re-test in 1–3 years"
              - "TE first, then decide"
            answer: 0
            why: "الشجرة دي للـ **metabolic و/أو alcohol only**. الـ viral hepatitis أو أي سبب تاني، أو علامات advanced disease، يروحوا **liver clinic** على طول مهما كان الـ FIB-4."
      - kind: explain
        page: 25
        title: "ALD و HCV: الرقم ممكن يكدب"
        text: |
          **Alcohol (ALD):** لما المريض يتحوّل، **LSM by TE > 12–15 kPa** بيعمل **rule-in** للـ advanced fibrosis، بس **بعد ما تستبعد أسباب الـ false positive**.

          ولو الـ stiffness عالية ومعاها التهاب واضح (**AST أو GGT > 2× ULN**): **أعد الـ TE بعد أسبوع على الأقل** من الامتناع عن الخمرة أو تقليلها. الالتهاب نفسه بيخلّي الكبد منفوخ وناشف، فالرقم بيطلع أعلى من التليف الحقيقي.

          **HCV بعد الـ SVR:** الـ NITs والـ TE **مش موصى بيها روتينيًا** علشان نكشف الـ **fibrosis regression**، و الـ cut-offs بتاعة الـ untreated HCV **ما تتستخدمش** للـ staging بعد الـ SVR. الالتهاب راح فالـ stiffness نزلت، بس ده مش معناه إن التليف اتشال بنفس السرعة.
      - kind: aside
        tone: joke
        page: 25
        text: |
          المريض: «يا دكتور أنا بطّلت شرب من امبارح، اعملّي FibroScan تاني.» 😄

          الكتاب بيقول: **أسبوع على الأقل**. الكبد محتاج يفوق من السهرة قبل ما نصدّق رقمه.
      - kind: explain
        page: 25
        title: "NAFLD: تلات أرقام تقفل الملف"
        text: |
          في **NAFLD**، أي واحد من دول بيعمل **rule out** للـ advanced fibrosis:

          - **LSM by TE < 8 kPa**
          - **FibroTest أقل من 0.48** (patented)
          - **FIB-4 أقل من 1.3** (non-patented)

          ولو FIB-4 **فوق 1.3**: استخدم **TE و/أو patented serum tests** علشان تعمل rule out أو rule in.

          وخلي بالك: الـ **liver biopsy لسه هي الـ reference standard لتشخيص NASH**، لأن مفيش NIT دقته مقبولة في الـ NASH نفسه. وأدق NIT للـ staging هو **MRE**، بس هو بالكاد أحسن من الباقيين في F3–F4، وغالي ومش متاح، فـ **مش first-line**.
      - kind: aside
        tone: tip
        page: 25
        text: |
          افتكر الأرقام كده: **8 بتتكرر مرتين**. 8 kPa للـ TE، و 0.4**8** للـ FibroTest. والتالت هو رقم الـ FIB-4 اللي هتشوفه في كل الـ pathways: **1.3**.
      - kind: update
        page: 25
        text: "من 2023 الـ NAFLD اسمها **MASLD** والـ NASH اسمها **MASH**. الكتاب بيستخدم الأسامي القديمة، وفي الامتحان اكتب اللي في الكتاب (ولو حبيت حط الجديد بين قوسين)."
        ref: "AASLD/EASL/ALEH multi-society nomenclature consensus, 2023"
      - kind: check
        page: 25
        question: "A patient with NAFLD has these results. Which one does **NOT** rule out advanced fibrosis?"
        options:
          - "FIB-4 of 1.6"
          - "LSM by TE of 7 kPa"
          - "FibroTest of 0.40"
          - "FIB-4 of 1.1"
        answer: 0
        why:
          - "صح: 1.6 **فوق 1.3**، يبقى محتاج TE و/أو patented test."
          - "أقل من **8 kPa**، يبقى rule out."
          - "أقل من **0.48**، يبقى rule out."
          - "أقل من **1.3**، يبقى rule out."
      - kind: try
        items: [hb.L02.003, hb.L02.012, hb.L02.018, hb.L02.015]
    recap:
      - "الـ NITs في الناس قليلة الخطورة **بتستبعد** أكتر ما بتشخّص، واستخدمها في الـ at-risk (metabolic و/أو alcohol)."
      - "ALT و AST و platelets روتين في الـ primary care، والـ FIB-4 يتحسب ويتطبع أوتوماتيك."
      - "SWE (TE، pSWE، 2D/3D-SWE) بتقيس **shear wave speed**، والـ ARFI بتعرض **displacement**."
      - "FIB-4 أقل من 1.30: low risk. لو 1.30 أو أكتر: اعمل TE، وأقل من 8 kPa يبقى low، و 8 kPa أو أكتر يروح patented tests (لو concordance يبقى F3–F4)."
      - "ALD: > 12–15 kPa rule-in، وأعد بعد أسبوع امتناع لو AST/GGT > 2× ULN. بعد SVR: ما تستخدمش cut-offs الـ untreated."
      - "NAFLD rule-out: **8 kPa، 0.48، 1.3**. الـ biopsy هي الـ reference للـ NASH، والـ MRE الأدق بس مش first-line."
    practice: [hb.L02.001, hb.L02.002, hb.L02.003, hb.L02.004, hb.L02.005, hb.L02.006, hb.L02.007, hb.L02.008, hb.L02.009, hb.L02.010, hb.L02.011, hb.L02.012, hb.L02.013, hb.L02.014, hb.L02.015, hb.L02.016, hb.L02.017, hb.L02.018, hb.L02.019, hb.L02.020, hb.L02.067, hb.L02.068, hb.L02.070]
  # ------------------------------------------------------------------
  - id: hb.L02.lesson2
    title: "الـ biopsy: الحَكَم اللي بيغلط"
    hook: "الـ gold standard بيختلف مع نفسه في ربع الحالات. يبقى نعمله لمين، وإزاي نقرأ Metavir A3F3؟"
    minutes: 9
    pages: [26, 29]
    topics: [biopsy, principles, elastography]
    goals:
      - "تحفظ مواصفات الـ biopsy الكويسة وموانعها السبعة"
      - "تقارن الـ biopsy بالـ blood tests والـ elastography في جدول واحد"
      - "تقرأ Metavir (A و F) وأرقام الـ kPa اللي بتقابلها"
      - "تعرف إمتى الـ LSM يغنيك عن الـ biopsy، وتقرأ الـ CAP"
    status: unverified
    steps:
      - kind: explain
        page: 26
        title: "عيّنة صغيرة من عضو كبير"
        text: |
          الـ **AASLD** بتقول الـ biopsy الكويسة:

          - طولها **2–3 cm على الأقل**
          - بإبرة **16-gauge**
          - فيها **11 complete portal tracts** على الأقل. أقل من كده ممكن الـ **grading والـ staging** يطلعوا غلط.

          ومع ذلك: حتى biopsy طولها **25 mm** عندها **25% discordance** في الـ fibrosis staging. السبب إن التليف مش متوزع بالتساوي، وإنت بتاخد خيط صغير جدًا من كبد وزنه كيلو ونص. ده اللي اسمه **sampling error**.
