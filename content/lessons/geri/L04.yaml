        text: "الفخ الكبير: الـ **hypoactive delirium**. المريض الهادي النعسان اللي «مش عامل مشاكل» ممكن يكون delirious (**lethargy**، **flat affect**، **withdrawal**)، والتمريض يقولك «تعبان بس». الهدوء مش دايمًا خبر حلو."
