  - id: neph.L06.lesson3
    title: "Hypernatremia: المخ اللي نشف"
    hook: "الـ Na العالي غالبًا مش ملح زيادة، ده ميه ناقصة. والعلاج: ميه، بس بالراحة."
    minutes: 10
    pages: [133, 135]
    topics: [hyperna, hyperna-treat]
    goals:
      - "تعرف أسباب الـ hypernatremia من Table 2 وتقرا الـ urine osm"
      - "تفرّق الـ central من الـ nephrogenic DI"
      - "تعالج حسب الـ volume status وتحسب حجم السائل"
      - "تحفظ سرعة التصحيح في الـ acute والـ chronic وتعرف ليه"
    status: unverified
    steps:
      - kind: explain
        page: 133
        title: "Na فوق 146 = ميه ناقصة"
        quote: "Serum Na >146mmol/L is usually due to a water deficit and is associated with severe underlying disease and significant mortality."
        text: |
          الـ ==hypernatremia== (Na **فوق 146**) غالبًا سببها **water deficit**، ومعاها مرض شديد و mortality عالية.

          الـ extracellular fluid (ECF) بقى مركّز فبيشد ميه من الخلايا. المخ **بينكمش**، والانكماش ده بيعمل ==vascular shear stress== فيحصل **نزيف و thrombosis**.
      - kind: explain
        page: 133
        title: "مين اللي بيوصل لـ Na عالي؟"
        quote: "Serum Na >146mmol/L is usually due to a water deficit and is associated with severe underlying disease and significant mortality."
        text: |
          الكتاب بيربط الـ hypernatremia بـ **مرض شديد** و **mortality عالية**. ليه؟ التفسير المقبول (مش في الكتاب): الـ ==عطش== حماية قوية جدًا. أي حد صاحي وقادر يوصل للميه هيشرب قبل ما الـ Na يعلى.

          علشان كده بص على أول صف في Table 2: الناس اللي بتوصل للـ hypernatremia هما اللي **مش قادرين يشربوا أو يطلبوا**:
          - **Altered sensorium** أو **immobility**.
          - **Endotracheal intubation**.
          - مقيم في **chronic care facility**.
          - رضيع بيعتمد على غيره.
          - محاليل متكتبة من غير ما تحسب الـ **insensible losses** (العرق والنفس).

          يعني الـ Na العالي غالبًا علامة إن العيان **ضعيف ومعتمد على غيره**، وده سبب الـ mortality.
      - kind: table
        page: 133
        quote: "Table 2: Causes of Hypernatremia\n| Cause | Proximate Cause | Findings Supporting Diagnosis |\n| Inadequate water intake | Lack of access to water | Altered sensorium, immobility, endotracheal intubation; Chronic care facility residence; Fluid prescription that does not take into account insensible losses; UOsm > 600 mOsm/kg H2O |\n| Extrarenal hypotonic fluid loss | GI losses or perspiration | History of diarrhea, febrile illness, gastric suction, or enteric fistula; UOsm > 600 mOsm/kg H2O |\n| Renal concentrating defect | Diuretics | History of loop diuretic use; Isosthenuric urine |\n| | Osmotic diuresis | Hyperglycemia with glucosuria; Urea-induced osmotic diuresis; Isosthenuric urine (eg, recovery from ATN) |\n| | Central diabetes insipidus | Presence of brain trauma, surgery, tumor, infiltrative disease, or infection including tuberculosis; Maximally or submaximally dilute urine; Persistently dilute urine during water deprivation test; Low copeptin levels; UOsm increases in response to desmopressin |\n| | Nephrogenic diabetes insipidus | Treatment with lithium or demeclocycline, hypercalcemia, hypokalemia, renal tubulointerstitial disease, especially sickle cell nephropathy and obstructive uropathy; UOsm < 300 mOsm/kg H2O; Persistently dilute urine during water deprivation test; High copeptin levels; UOsm fails to increase in response to desmopressin |\n| Excessive salt intake | Hypertonic fluid administration | Receipt of hypertonic sodium bicarbonate solution during cardiac arrest or hypertonic saline solution; History of dilution error for powdered feeding formulas in infants; Administration of TPN or concentrated enteral tube feeds; UOsm > 600 mOsm/kg H2O; UNa > 100 mEq/L |"
        title: "Table 2: أسباب الـ hypernatremia"
        columns: [Cause, Urine clue]
        rows:
          - ["No access to water", "Urine osm >600"]
          - ["GI losses, sweating", "Urine osm >600"]
          - ["Loop diuretics, osmotic diuresis", "Isosthenuric"]
          - ["Central DI", "Dilute; rises with desmopressin"]
          - ["Nephrogenic DI", "<300; no desmopressin response"]
          - ["Hypertonic fluids, TPN", ">600, urine Na >100"]
        hide: [[0, 1], [3, 1], [4, 1], [5, 1]]
      - kind: reveal
        page: 133
        quote: "Table 2: Causes of Hypernatremia\n| Cause | Proximate Cause | Findings Supporting Diagnosis |\n| Inadequate water intake | Lack of access to water | Altered sensorium, immobility, endotracheal intubation; Chronic care facility residence; Fluid prescription that does not take into account insensible losses; UOsm > 600 mOsm/kg H2O |\n| Extrarenal hypotonic fluid loss | GI losses or perspiration | History of diarrhea, febrile illness, gastric suction, or enteric fistula; UOsm > 600 mOsm/kg H2O |\n| Renal concentrating defect | Diuretics | History of loop diuretic use; Isosthenuric urine |\n| | Osmotic diuresis | Hyperglycemia with glucosuria; Urea-induced osmotic diuresis; Isosthenuric urine (eg, recovery from ATN) |\n| | Central diabetes insipidus | Presence of brain trauma, surgery, tumor, infiltrative disease, or infection including tuberculosis; Maximally or submaximally dilute urine; Persistently dilute urine during water deprivation test; Low copeptin levels; UOsm increases in response to desmopressin |\n| | Nephrogenic diabetes insipidus | Treatment with lithium or demeclocycline, hypercalcemia, hypokalemia, renal tubulointerstitial disease, especially sickle cell nephropathy and obstructive uropathy; UOsm < 300 mOsm/kg H2O; Persistently dilute urine during water deprivation test; High copeptin levels; UOsm fails to increase in response to desmopressin |\n| Excessive salt intake | Hypertonic fluid administration | Receipt of hypertonic sodium bicarbonate solution during cardiac arrest or hypertonic saline solution; History of dilution error for powdered feeding formulas in infants; Administration of TPN or concentrated enteral tube feeds; UOsm > 600 mOsm/kg H2O; UNa > 100 mEq/L |"
        prompt: "إزاي تفرّق الـ central DI من الـ nephrogenic DI بتحليلين؟"
        answer: "**Copeptin**: واطي في الـ central (مفيش antidiuretic hormone (ADH))، عالي في الـ nephrogenic (الـ ADH موجود والكلية مطنّشة).\n\n**Desmopressin**: الـ urine osm **تعلى** في الـ central و **ما تتحركش** في الـ nephrogenic. أسباب الـ nephrogenic: ==lithium==، demeclocycline، hypercalcemia، hypokalemia، tubulointerstitial disease."
      - kind: explain
        page: 133
        title: "اقرا الـ urine osm: الكلية بتقولك مين الغلطان"
        quote: "Persistently dilute urine during water deprivation test"
        text: |
          في Table 2، الـ **urine osm** هو المفتاح. التفسير المقبول (مش في الكتاب) لليه كل رقم بيقول حاجة:

          - **أكتر من 600**: الكلية والـ ADH شغالين تمام وبيحوّشوا ميه. يبقى المشكلة **برّه الكلية**: مفيش ميه داخلة، أو خسارة من الأمعاء والعرق، أو ملح زيادة اتدّى.
          - **Isosthenuric** (قريب من الدم): الكلية مش قادرة تركّز ولا تخفف، زي الـ **loop diuretics** (بتبوّظ الـ countercurrent) والـ **osmotic diuresis** (السكر أو الـ urea بيشدّوا ميه معاهم).
          - **مخفف** (أقل من 300): الـ ADH يا إما **مش موجود** (central DI) يا إما الكلية **مش سامعاه** (nephrogenic DI). ده اللي بيفضل مخفف حتى في الـ ==water deprivation test==.

          وأسباب الـ nephrogenic زي الـ ==lithium== والـ hypercalcemia والـ hypokalemia بتبوّظ استجابة الـ collecting duct للـ ADH.
      - kind: explain
        page: 134
        title: "الأعراض"
        quote: "The patient may have increased tone with brisk reflexes and myoclonus. Volume of replacement fluid needed to correct the water deficit is determined by using the concentration of sodium in the replacement fluid. The replacement volume can be determined as follows:"
        text: |
          - أغلبهم: علامات **dehydration** وفقد سوائل.
          - أعراض الـ central nervous system (CNS) تظهر لو الـ Na طلع **بسرعة** أو عدّى ==160==.
          - الأطفال: irritability و agitation لحد coma، و **صرخة عالية**.
          - عطش، و polyuria و polydipsia في الـ diabetes insipidus (DI).
          - Orthostatic hypotension و tachycardia في الـ hypovolemic.
          - **Tone عالي، brisk reflexes، myoclonus** (عكس الـ hypermagnesemia اللي هتشوفها بعدين).

          الأطفال والعيانين المتعلقين بغيرهم بيوصلوا لها أكتر **لأن** مش بيقدروا يطلبوا ميه لوحدهم (التفسير المقبول، مش في الكتاب).
      - kind: reveal
        page: 134
        quote: "The patient may have increased tone with brisk reflexes and myoclonus."
        prompt: "ليه أعراض الـ hypernatremia عصبية بالذات، وليه بتظهر لما الـ Na يعلى بسرعة؟"
        answer: |
          الكتاب بيقول الأعراض من ==central nervous system dysfunction== وبتظهر لو الـ Na علي **بسرعة** أو عدّى **160**، وإن العيان ممكن يبقى عنده tone عالي و brisk reflexes و myoclonus.

          التفسير المقبول (مش في الكتاب): خلايا المخ **بتنكمش** لما الميه تتسحب منها، والخلية المنكمشة **متهيّجة**. لو الارتفاع بطيء، المخ بيلحق يعمل osmolytes جوّه الخلايا ويرجّع حجمها، فالأعراض أقل. نفس فكرة الـ hyponatremia بالظبط، بس بالعكس.
      - kind: figure
        page: 134
        quote: "Hypernatremia\n  Assess volume status\n    Hypovolemia\n      Correction of volume deficit\n        Administer isotonic saline until hypovolemia improves\n        Treatment of the etiology of losses (insulin, relief of obstruction, removal of osmotic diuretics, etc.)\n      Correction of water deficit\n        Calculate water deficit\n        Administer 0.45% saline, 5% dextrose, or oral water to replace the deficit and ongoing losses\n    Euvolemia\n      Correction of water deficit\n        Calculate water deficit\n        Administer 0.45% saline, 5% dextrose, or oral water to replace the deficit and ongoing losses\n        In central diabetes insipidus (DI) with severe losses, aqueous vasopressin (Pitressin) 5 U subcutaneously q 6 h\n        Follow serum (Na+) carefully to avoid water intoxication\n      Long-term therapy\n        Central DI (see Table 8-7)\n        Nephrogenic DI: Remove offending drugs, low Na+ diet, thiazide diuretics, amiloride for lithium-induced DI, correction of K+ and Ca2+\n    Hypervolemia\n      Removal of Na+\n        Discontinue offending agents\n        Furosemide\n        Hemodialysis as needed for renal failure"
