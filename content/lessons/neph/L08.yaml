  - id: neph.L08.lesson2
    title: "النور الأخضر و case 1: الـ minimal change"
    hook: "أم لتوأم، edema لحد البطن، والـ LM طبيعي تمامًا. الـ EM بس هو اللي هيتكلم."
    minutes: 10
    pages: [218, 226]
    topics: [if-em, mcd]
    goals:
      - "تقرا أشكال الـ IF الأساسية"
      - "تعرف أماكن الـ deposits في الـ EM"
      - "تحل case 1 وتعرف الـ DD والـ proteinuria"
    status: unverified
    steps:
      - kind: figure
        page: 218
        title: "أشكال الـ immunofluorescence"
        image: { file: neph/L08-if-patterns.webp, book: true }
        alt: "Eight immunofluorescence panels: mesangial IgA, mesangial and capillary wall IgG, peripheral granular C3 in type I MPGN, band-like C3 in type II MPGN, coarse granular C3 in post-infectious GN, fine granular IgG in membranous, linear IgG in anti-GBM and chunky IgG in fibrillary GN."
        caption: "من الكتاب: 8 أشكال للـ IF. أهمها: ==linear== = anti-GBM، **fine granular** على الـ capillary wall = membranous، **mesangial IgA** = IgA nephropathy."
      - kind: match
        page: 220
        quote: "Subepithelial hump-like electron dense deposits (postinfectious GN)"
        prompt: "وصّل الـ pattern بالمرض"
        pairs:
          - ["Linear GBM IgG", "Anti-GBM GN"]
          - ["Finely granular capillary wall IgG", "Membranous"]
          - ["Mesangial IgA", "IgA nephropathy"]
          - ["Subepithelial humps on EM", "Postinfectious GN"]
          - ["Subendothelial deposits + mesangial interposition", "Type I MPGN"]
        why: "الـ IF بيقولك **إيه** الـ antibody وشكلها، والـ EM بيقولك **فين** بالظبط: mesangial، subendothelial، ولا subepithelial."
      - kind: aside
        tone: analogy
        page: 220
        quote: "Subendothelial dense deposits with mesangial interposition (type I MPGN)"
        text: |
          تخيّل الـ GBM حيطة بين أوضتين: الـ **endothelium** من جوّه (ناحية الدم) والـ **podocyte** من برّه (ناحية البول).

          - **Subendothelial** = تحت الدهان من جوّه، قريب من الدم، فبيجيب ==inflammation== (nephritic): lupus III/IV، MPGN.
          - **Subepithelial** = على الحيطة من برّه، بعيد عن الدم، فبيضرب الـ podocyte ويعمل ==proteinuria==: membranous، والـ humps بتاعة PIGN.
      - kind: explain
        page: 221
        title: "Case 1"
        quote: "Presenting with bilateral L.L edema (3+), with severe abdominal distension (Hard edema) 40 days after giving birth to her baby twins."
        text: |
          ست عندها **28 سنة**، ولدت **توأم** من 40 يوم، وجاية بـ **bilateral LL edema 3+** وبطن منفوخة جامد.

          - **Creatinine 0.6**، ==uPCR 13.4== mg/mg، **albumin 2.4**
          - Cholesterol 389، TGs 457
          - **C3 179** (طبيعي)، **ANA** و virology سلبي
      - kind: check
        page: 223
        quote: "2.0 to 4.0 g Usually glomerular > 4.0 g Always glomerular"
        question: "Her proteinuria is about 13 g/day. What does the amount alone tell you?"
        options:
          - "It is always glomerular"
          - "It may be tubular"
          - "It may be overflow"
          - "It is usually glomerular, not always"
        answer: 0
        why:
          - "صح: أكتر من 4 g/day = ==always glomerular==."
          - "الـ tubular proteinuria في مدى 0.15–2 g بس."
          - "الـ overflow برضه في مدى 0.15–2 g."
          - "«Usually glomerular» ده مدى 2–4 g."
      - kind: table
        page: 222
        quote: "Overflow Increased production of low- molecular-weight proteins. Monoclonal gammopathy, leukaemia."
        title: "الـ proteinuria جاية منين؟"
        columns: [Type, Mechanism, Cause]
        rows:
          - ["Glomerular", "↑ capillary permeability", "Primary or secondary glomerulopathy"]
          - ["Tubular", "↓ tubular reabsorption", "Tubular or interstitial disease"]
          - ["Overflow", "↑ low-MW proteins made", "Monoclonal gammopathy, leukaemia"]
        hide: [[0, 1], [1, 1], [2, 2]]
      - kind: explain
        page: 222
        title: "الـ DD في جدول واحد: بُص على الـ C3"
        quote: "Differential diagnosis of nephrotic syndrome"
        text: |
          في جدول الـ **differential diagnosis of nephrotic syndrome**، الـ ==C3 الواطي== بيطلع في 3 بس: **MPGN**، **PSGN**، و **lupus nephritis**. الباقي (MCNS، FSGS، membranous، HSP، IgA) C3 طبيعي.

          وعيانتنا الـ C3 بتاعها 179، يعني نشيل التلاتة دول.
      - kind: explain
        page: 222
        title: "ولو جالها AKI كمان؟"
        quote: "Acute allergic interstitial nephritis secondary to use of various drugs, including diuretics Acute tubular necrosis caused by volume depletion or sepsis."
        text: |
          الـ DD لـ **AKI فوق nephrotic syndrome**:
          - **Acute allergic interstitial nephritis** من أدوية، حتى الـ ==diuretics==
          - **ATN** من volume depletion أو sepsis
          - Adverse drug effects، و **intrarenal edema**
          - **Prerenal** من volume depletion
          - ==Renal vein thrombosis==
          - **Transformation** للمرض نفسه (crescentic GN فوق membranous)
      - kind: explain
        page: 224
        title: "الـ biopsy"
        quote: "podocytes showed injury with cytoplasmic microvillous transformation as well as diffuse effacement of their foot processes."
        text: |
          - **LM**: 9 glomeruli ==within normal limits==، tubules فيها mild injury، و foamy histiocytes في الـ interstitium.
          - **IH**: IgA و IgG و IgM و C4d كلهم negative.
          - **EM**: ==diffuse effacement== للـ foot processes مع microvillous transformation، و **مفيش deposits**.
      - kind: reveal
        page: 225
        quote: "What is your diagnosis? Minimal change disease"
        prompt: "LM طبيعي، IF سلبي، و EM فيه diffuse foot-process effacement. التشخيص؟"
        answer: "**Minimal change disease**. الـ LM «minimal» لأنه شبه طبيعي، والمرض كله في الـ podocyte اللي ما بيبانش غير بالـ EM."
      - kind: mnemonic
        page: 226
        quote: "Categorization of secondary MCD Neoplasia (19) Drugs (24) Infections (7) Atopy (6)"
        word: "DNAIS"
        parts:
          - { key: "D", text: "Drugs (24): أكبر مجموعة" }
          - { key: "N", text: "Neoplasia (19)" }
          - { key: "A", text: "Atopy (6)" }
          - { key: "I", text: "Infections (7)" }
          - { key: "S", text: "Superimposed on another renal disease (5)" }
        hook: "الـ secondary MCD «DNAIS»، زي الـ DNA بس فيه S زيادة. والـ miscellaneous (15) مستخبّي في الآخر."
      - kind: try
        items: [neph.L08.037, neph.L08.050, neph.L08.046, neph.L08.209]
    recap:
      - "Linear = anti-GBM، fine granular IgG = membranous، mesangial IgA = IgA nephropathy."
      - "Subendothelial = inflammation، subepithelial = proteinuria."
      - "> 4 g/day = always glomerular."
      - "MCD = normal LM + negative IF + diffuse effacement على الـ EM."
    practice: [neph.L08.021, neph.L08.037, neph.L08.038, neph.L08.039, neph.L08.040, neph.L08.041, neph.L08.042, neph.L08.043, neph.L08.044, neph.L08.045, neph.L08.046, neph.L08.047, neph.L08.048, neph.L08.049, neph.L08.050, neph.L08.051, neph.L08.052, neph.L08.053, neph.L08.054, neph.L08.055, neph.L08.056, neph.L08.057, neph.L08.058, neph.L08.059, neph.L08.209]
