      - kind: explain
        page: 54
        quote: "Mechanisms of acid-mediated tubulointerstitial fibrosis in chronic kidney"
        title: "الحمض بيليّف الكلية إزاي؟"
        text: |
          Figure 4 في ص 54: **Mechanisms of acid-mediated tubulointerstitial fibrosis**. فيها muscle catabolism و amino acids و acidemia، وبعدين **renal NH4+** و **endothelin** و **RAS**، والنهاية ==interstitial fibrosis==.

          التفسير المقبول (مش في الكتاب) للحكاية: الحمض لازم يطلع. ومع nephrons أقل، كل nephron باقي بيعمل **ammonia أكتر** علشان يشيل الحمض. والـ ammonia الكتير بتشغّل الـ complement والالتهاب في الـ interstitium. وفي نفس الوقت الـ ==endothelin== والـ angiotensin بيعلوا علشان يزوّدوا إفراز الحمض، ودول الاتنين بيليّفوا.

          يعني الكلية وهي بتحاول تنضّف الحمض بتأذي نفسها. وعلشان كده الـ bicarbonate بيحميها.
