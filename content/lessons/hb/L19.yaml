        text: |
          الصورة التانية في صفحة 394 **MRCP** لراجل 62 سنة، والكتاب كاتب عليها: ==perforated GB== و **CBD stricture**.

          ليه MRCP هنا بالذات؟ التفسير المقبول (مش في الكتاب): الـ MRCP بيخلّي الـ bile والسوايل بيضا من غير صبغة، فبيبيّن القنوات، والـ bile اللي خرجت برّه المرارة المثقوبة، في صورة واحدة. ومن غير منظار ولا إبرة، وده مهم في عيان عنده مضاعفات ومش هيستحمل procedure.

          واربطها باللي فات:
          - الـ **perforation** من مضاعفات المرارة نفسها (صفحة 386).
          - الـ **stricture** بيعمل ركود ورا منه، وده بالظبط المكان اللي الـ brown stones بتتكوّن فيه (صفحة 380).
