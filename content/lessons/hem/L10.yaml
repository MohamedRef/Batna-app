      - kind: figure
        page: 164
        quote: "ERYTROCYTOSIS (ie, evidence of increased red cell mass by WHO criteria)"
        title: "صورة الكتاب: الـ algorithm زي ما هو"
        image: { file: hem/L10-pv-algorithm.webp, book: true }
        alt: "Book flowchart. Top box: erythrocytosis, evidence of increased red cell mass by WHO criteria, arrow to an octagon JAK2V617F and sEPO, which splits into three options. Option 1, left: JAK2V617F positive and sEPO level subnormal, arrow to a red PV box. Option 2, middle: JAK2V617F negative and sEPO subnormal, arrow to an octagon JAK2 exon12 and BM biopsy; exon 12 positive and/or consistent biopsy leads to PV; exon 12 negative and inconsistent biopsy leads to consider testing for EPOR mutations. Option 3, right: JAK2V617F negative and sEPO normal or increased, arrow to secondary erythrocytosis, if no cause can be ascertained; a side arrow labelled sEPO levels N points back to the exon 12 octagon."
        caption: |
          ده الأصل اللي الرسمة اللي فوق منقولة منه. اقراه من فوق:

          - **فوق**: erythrocytosis ثابتة بالـ WHO criteria ← اعمل اتنين مع بعض: ==JAK2 V617F و sEPO== (serum EPO).
          - **Option 1** (شمال): JAK2 **pos** و sEPO **subnormal** ← **PV** على طول.
          - **Option 2** (النص): JAK2 **neg** و sEPO subnormal ← ==JAK2 exon 12 و BM biopsy==. موجب أو النخاع consistent ← PV (تحت شمال). سالب ومش consistent ← فكّر في **EPOR mutations** (الصندوق المنقط).
          - **Option 3** (يمين): JAK2 neg و sEPO **N/I** (normal أو increased) ← **secondary erythrocytosis** (الصندوق الأحمر)، ولو مالقيتش سبب، السهم المايل «sEPO levels N» بيرجعك على الـ exon 12 والنخاع.

          يعني تحليلين بس (JAK2 والـ EPO) بيوزّعوا أغلب العيانين من أول خطوة.
      - kind: explain
        page: 164
        title: "الـ algorithm ماشي إزاي؟"
        quote: "The rationale for changing the WHO threshold of Hb for PV diagnosis was based on recent observations regarding ―masked PV‖ for JAK2-mutated patients who display PV-characteristic BM morphology, despite lower Hb levels ranging between 16 g/dL and 18.5 g/dL for men and 15 g/dL and 16.5 g/dL for women."
        text: |
          ابدأ بتحليلين: **JAK2 V617F** و **serum EPO**.
          1. **JAK2+ و EPO subnormal**: ==PV==. الاتنين بيقولوا نفس الحكاية.
          2. **JAK2− و EPO subnormal**: المصنع شغال لوحده بس من غير V617F، فدوّر على **exon 12** واعمل **نخاع**. لو إيجابي أو النخاع consistent = PV. لو لأ، فكّر في **EPOR mutations** (الـ primary familial).
          3. **JAK2− و EPO normal/high**: غالبًا **secondary**، دوّر على السبب. ولو مفيش سبب، ارجع للـ exon 12 والنخاع.

          وده بيكمّل مع **masked PV**: JAK2 ونخاع PV بـ Hb بين 16 و 18.5 (رجالة). الـ algorithm بيبدأ بالـ JAK2 والـ EPO، مش بالـ Hb لوحده، عشان ما يفوّتهمش.
