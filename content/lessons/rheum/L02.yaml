          - **24-h urine** على أكل عادي: أكتر من ==800 mg== = **overproducer**.
          - Synovial fluid للبلورات: ==sensitivity 90%، specificity 100%==. لو فيه بلورات يبقى gout.

          التفسير المقبول (مش في الكتاب): ليه مرتين صايم؟ عشان مستوى الـ urate بيتغير مع الأكل والكحول والـ diuretic، فقياس واحد ممكن يخدعك. والـ 24-h urine بيقسم المرضى لـ overproducer و under-excretor، وده بيفرق في اختيار العلاج: الـ uricosuric مايتديش لواحد بيطلّع urate كتير أصلًا، لأنه هيزوّد الحصوات. والـ specificity 100% يعني البلورة مش بتكدب.
