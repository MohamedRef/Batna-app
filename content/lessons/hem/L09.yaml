  - id: hem.L09.lesson4
    title: "الـ PMF: لما النخاع يتحول ليفي والطحال يشتغل مكانه"
    hook: "أسوأ prognosis في العيلة: megakaryocytes بتطلق cytokines، النخاع يتليّف، والدم يدوّر على مصنع تاني."
    minutes: 10
    pages: [144, 149]
    topics: [pmf-biology, pmf-criteria, pmf-clinical]
    goals:
      - "تشرح ليه النخاع بيتليّف في الـ PMF"
      - "تكتب WHO criteria (major و minor) والـ differential of marrow fibrosis"
      - "تعرف الصورة الإكلينيكية والـ EMH"
    status: unverified
    steps:
      - kind: explain
        page: 144
        title: "الأخ الأخطر"
        quote: "PMF has the poorest prognosis of the MPNs."
        text: |
          - ==PMF has the poorest prognosis of the MPNs==.
          - الـ PV والـ ET ممكن يوصلوا لصورة شبهه بعد **latency of many years**.
          - JAK2 V617F في حوالي النص، والباقي CALR وشوية MPL.
          - عنده **طفرات أكتر**، و **cytogenetic abnormalities** أكتر، وخطر **leukemic transformation** أعلى من PV و ET.
      - kind: figure
        page: 144
        quote: "release of pro-inflammatory cytokines from abnormal clonal cells (primarily megakaryocytes), which stimulate fibroblast proliferation and fibrosis."
        title: "التليف بيحصل إزاي؟"
        alt: "Vertical chain. Clonal megakaryocytes, boosted by high TPO, release TGF-beta1, PDGF and VEGF. These stimulate fibroblasts, giving marrow fibrosis. The failing marrow leads to extramedullary hemopoiesis in spleen and liver, causing splenomegaly and a leukoerythroblastic blood film with teardrop cells."
        caption: "الـ fibroblasts **مش** من الـ clone: هم ضحايا. الـ ==megakaryocytes== هي اللي بتطلق الـ cytokines."
