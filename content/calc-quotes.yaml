  # Nephrology (neph)
  - calculator: delta_ratio
    lecture: neph.L01
    page: 12
    quote: |-
      Used to assess elevated anion gap metabolic acidosis and to evaluate whether a mixed acid base disorder is present
      1. Anion gap = Na+ - [Cl- + HCO3-]
      2. Delta ratio = Δ Anion gap / Δ HCO3-
        Δ Anion gap = measured anion gap - Normal anion gap
        Δ HCO3- = Normal [HCO3-] - Measured [HCO3-]
        Normal anion gap = 12
        Normal [HCO3-] = 24
      3. Delta ratio = (Measured anion gap - 12) / (24 - Measured [HCO3-])
      | Delta ratio | Assessment |
      |---|---|
      | < 0.4 | Normal anion gap metabolic acidosis |
      | 0.4 - 0.8 | Mixed normal anion gap metabolic acidosis + high anion gap metabolic acidosis |
      | 0.8 - 2.0 | Pure high anion gap metabolic acidosis |
      | > 2.0 | Mixed high anion gap metabolic acidosis + metabolic alkalosis (or pre-existing compensated respiratory acidosis) |
