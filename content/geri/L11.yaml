    front: "Bronchodilators in COPD exacerbations: who needs escalation, which drug, and how delivered?"
    back: All exacerbations need escalation (it may suffice in mild ones). Preferred is a short-acting beta-2 agonist (SABA) with or without a short-acting muscarinic antagonist (SAMA); nebulized delivery may be more effective and comfortable than an metered dose inhaler (MDI).
