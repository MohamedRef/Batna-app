  # ------------------------------------------------------------------
  - id: hb.L11.lesson1
    title: "إمتى نزرع كبد؟"
    hook: "الـ decompensation بتقص العمر من 12 سنة لسنتين. السؤال مش «نزرع ولا لأ»، السؤال «إمتى بالظبط»."
    minutes: 10
    pages: [188, 189]
    topics: [timing, indications, meld-exceptions]
    goals:
      - "تقول إمتى المريض يتحوّل لتقييم الزرع حسب AASLD"
      - "تعرف الـ MELD معمول من إيه، واتعمل ليه أصلًا"
      - "تعدّ indications الـ LDLT في Child C وقواعد الـ listing بالأرقام"
      - "تعرف ليه فيه أمراض بتاخد MELD exception points"
    status: unverified
    steps:
      - kind: explain
        page: 188
        title: "الرقم اللي يخضّ"
        quote: "the development of decompansation is associated with a decreased median survival from greater than 12 years to 2 years"
        text: |
          - **Compensated cirrhosis**: الكبد متليّف بس لسه قادر يشيل الشغل، والمريض غالبًا مش حاسس بحاجة.
          - **Decompensation**: الكبد بدأ يقع، وبيبان في واحدة من أربعة: ascites، variceal bleeding، HE، أو jaundice.

          الـ median survival مع الـ compensated cirrhosis أكتر من 12 سنة. أول ما يحصل decompensation الرقم بينزل لـ ==2 سنين== بس.

          يعني نفس المريض، ونفس الكبد تقريبًا، بس عمره المتوقع اتقسم على ستة. علشان كده الـ decompensation هي جرس الإنذار الأول اللي بيقول: «ابدأ فكّر في الزرع».

          والكتاب بيقول إن كل transplant program ليه **program specific guidelines**. اللي جاي في الدرس ده هو بروتوكول البرنامج اللي في الكتاب، وده اللي هيتسأل فيه.
      - kind: figure
        page: 188
        quote: "Ideally, the timing of liver transplantation occurs when the risk of dying from the liver disease is greater than the"
        title: "التوقيت المثالي"
        alt: "A graph of risk against time. The risk of dying from liver disease starts low and rises steeply after decompensation. The risk of dying from the operation rises slowly. Where the two lines cross is marked as the ideal timing of transplantation."
        caption: "الخط الأحمر: خطر الموت من المرض. الخط التاني: خطر الموت من العملية. الزرع المثالي لما الأحمر يعدّي التاني."
        svg: |
