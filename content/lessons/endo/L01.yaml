          - Peak أكبر من **190 pg/ml في الرجالة** أو **80 pg/ml في الستات** = occult MTC.
          - البديل: **omeprazole 20 mg twice daily لـ 3 أيام**، والـ calcitonin يعلى لنفس مستوى الـ pentagastrin لو في MTC.

