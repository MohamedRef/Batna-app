          ليه adjuvants؟ الكتاب بيقول «حسب الـ pain syndrome والاستجابة للـ opioid». التفسير المقبول (مش في الكتاب): فيه ألم الـ opioid لوحده مش بيكفيه، زي ألم الأعصاب (anticonvulsants و tricyclics) وألم العضم من الـ metastases (bisphosphonates و corticosteroids).
