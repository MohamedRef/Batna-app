      - kind: explain
        page: 77
        quote: "Depression is the most common mental disorder of old age."
        title: "مستخبي وبيموّت"
        text: |
          - الـ ==depression== هو **most common mental disorder of old age**، وغالبًا **underdetected and untreated**.
          - الـ **screening questionnaires** بتزوّد التشخيص.

          وبيزوّد الخطر:
          - موت من الـ **cardiovascular** (RR **1.8**)، بس **مش** من الـ cancer.
          - **Coronary heart disease** (RR **2.1**).
          - موت لحد 10 سنين بعد **stroke** (RR **أكتر من 3**).
      - kind: aside
        tone: exam
        page: 77
        quote: "End-stage renal disease (especially with uremia)"
        text: "جدول أسباب الاكتئاب في الكتاب ليه نصّين: **physical illnesses** (end-stage renal disease، post-MI، thyroid، Cushing وAddison، hypercalcaemia، B12 وfolate، Parkinson، stroke، **pancreatic cancer**، oat cell) و**medications** (benzodiazepines، levodopa، **beta-blockers**، **reserpine**، **methyldopa**، clonidine، steroids، interferon، tamoxifen). قبل ما تكتب antidepressant، شوف الدوا والهرمونات."
      - kind: explain
        page: 78
        quote: "In general TCAs should be avoided within 3 months of an MI but SSRIs are safe to use."
        title: "القلب والمزاج"
        text: |
          - Depression بعد الـ **MI** في حوالي **25-30%**، والعلاقة في الاتجاهين.
          - **SADHART**: الـ ==sertraline== بعد MI **safe** بس الفايدة modest، ومأثّرش على الـ BP ولا الـ heart rate.
          - **TCAs**: ابعد عنها أول **3 months** بعد الـ MI. الـ **SSRIs safe**.
      - kind: reveal
        page: 78
        quote: "In general TCAs should be avoided within 3 months of an MI but SSRIs are safe to use."
        prompt: "ليه الـ TCAs خطر بعد MI؟"
        answer: "الـ **TCAs** ليها تأثير زي الـ class I antiarrhythmics (sodium channel block) وanticholinergic، فممكن تطوّل الـ QRS وتعمل **arrhythmias** و**tachycardia** و**hypotension**، وده آخر حاجة عضلة قلب لسه متعورة محتاجاها."
      - kind: explain
        page: 78
        quote: "Nortriptyline or citalopram constitute the first line treatment for poststroke depression"
        title: "بعد الـ stroke"
        text: |
          - Depression في **30-35%** بعد الـ stroke.
          - أكتر لو الـ **left basal ganglia** و**frontal pole** متأثرين (لحد 6 شهور).
          - بتأخّر الـ **ADL recovery** على سنتين، وindependent factor للوفاة (RR أكتر من 3).
          - العلاج: ==nortriptyline or citalopram==، وبيحسّن الـ ADL.
          - 2 من 3 دراسات: ممكن نمنعها.
