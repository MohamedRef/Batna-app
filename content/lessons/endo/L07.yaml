        prompt: "ليه الـ calcium gluconate بـ 2 ml/min بالراحة؟ وليه نحافظ على الكالسيوم عند الـ lower limit (8-9 mg/dl)؟"
        answer: "الكتاب: **20 ml 10% Ca gluconate** بمعدل ==2 ml/min==، وتتكرر كل 4 ساعات، والـ maintenance عند **8-9 mg/dl** مع متابعة الـ **urinary Ca**. التفسير المقبول (مش في الكتاب): الحقن السريع بيرفع الكالسيوم فجأة حوالين القلب فيعمل **arrhythmia**، خصوصًا لو المريض على digoxin. والـ lower limit لأن من غير PTH الكلية بتفقد الكالسيوم في البول، فلو رفعته للطبيعي العالي، البول هيتملي كالسيوم ويعمل **stones** و **nephrocalcinosis**. يعني الهدف إن المريض يبقى من غير أعراض، مش إن الرقم يبقى مثالي."
      - kind: check
