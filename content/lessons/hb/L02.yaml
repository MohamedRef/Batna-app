  - id: hb.L02.lesson4
    title: "الـ CSPH من غير قسطرة"
    hook: "قاعدة الخمسات (10، 15، 20، 25) والصفايح: تعرف منهم مين محتاج منظار ومين يروّح."
    minutes: 9
