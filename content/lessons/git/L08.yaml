    title: "Whipple، البكتيريا الزيادة، والأمعاء القصيرة"
    hook: "مفاصل بتوجع سنين قبل الإسهال، بكتيريا ساكنة في المكان الغلط، وأمعاء اتشال نصها: باقي أسباب الـ malabsorption."
    minutes: 10
    pages: [240, 244]
    topics: [whipple, sibo, sprue-sbs]
    goals:
      - "تشخّص وتعالج الـ Whipple"
      - "تعرف أسباب وتشخيص وعلاج الـ SIBO"
      - "تفهم ليه الـ ileum أهم من الـ jejunum"
    status: unverified
    steps:
      - kind: explain
        page: 240
        title: "Whipple: المفاصل الأول"
        quote: "Arthralgias or a migratory, nondeforming arthritis occurs in 80% and is typically the first symptom experienced."
        text: |
          ==Whipple disease==: multisystem infection بالـ **Tropheryma whipplei**، أكتر في **White men** في العقد **4–6**. مفيش عدوى من إنسان لإنسان.

          - **Arthralgia / migratory nondeforming arthritis**: **80%**، وغالبًا **أول عَرَض**.
          - **GI symptoms**: حوالي **75%** (ألم، إسهال، malabsorption، steatorrhea).
          - **Weight loss**: أشهر presenting symptom، تقريبًا كلهم.
          - **Protein-losing enteropathy** ← hypoalbuminemia و edema.
          - **Neuro** في حوالي **10%**: fits، dementia، nystagmus، ophthalmoplegia.
          - الكشف: low-grade fever، **lymphadenopathy 50%**، murmurs، hypotension متأخر.
      - kind: explain
        page: 240
        title: "التشخيص والعلاج"
        quote: "infiltration of the lamina propria with PAS-positive macrophages that contain gram-positive bacilli (which are not acid-fast) and dilation of the lacteals"
        text: |
          **Duodenal biopsy** بيشخّص **90%**: الـ lamina propria مليانة ==PAS-positive macrophages== فيها **gram-positive bacilli** (**not acid-fast**)، و **dilated lacteals**.

          الباقي: **PCR** أو **immunohistochemistry** على biopsy أو CSF أو synovial fluid أو lymph node أو endocardium. و **CSF** يتعمل routine.

          **العلاج:** **ceftriaxone 1 g IV twice daily** أو **meropenem 1 g IV TDS** لمدة **أسبوعين**، وبعدين **TMP-SMX 160/800 twice daily لمدة 12 شهر** (سنة على الأقل لأن الـ recurrence عالي). وتابع بـ biopsy و CSF PCR كل **6 شهور** لمدة سنة على الأقل.
      - kind: aside
        tone: tip
        page: 240
        quote: "Whipple disease is a rare multisystem illness, caused by infection with the bacillus Tropheryma whipplei."
        text: |
          افتكر **Whipple** بـ «**W**hite **W**eight-losing man **W**ith **W**obbly joints»: راجل أبيض في الأربعينات أو الخمسينات، مفاصله بتوجع من سنين، وبعدين خس وجاله إسهال.
      - kind: check
        page: 241
        quote: "Prolonged treatment for at least 1 year is required due to high rate of recurrence."
        question: "Why is Whipple disease treated for a full year after IV induction?"
        options:
          - "High rate of recurrence"
          - "The bacteria are acid-fast"
          - "TMP-SMX works only after a year"
          - "To prevent human-to-human spread"
        answer: 0
        why:
          - "صح: الكتاب بيقول كده صريح."
          - "الـ bacilli **not acid-fast**."
          - "مش ده السبب؛ التحسن بيحصل dramatically في أسابيع."
          - "مفيش human-to-human spread متسجل أصلًا."
      - kind: explain
        page: 241
        title: "SIBO: البكتيريا في المكان الغلط"
        quote: "Deconjugation of bile salt by bacteria. Bacteria produce toxic products, leading to mucosal damage."
        text: |
          الـ small bowel طبيعي فيه بكتيريا قليلة. لما تكتر، بتعمل ==malabsorption== بـ:
          - **deconjugation of bile salts**
          - **toxic products** تبوّظ الـ mucosa
          - الـ CHO والـ bile acids يوصلوا القولون ← **diarrhea**
          - البكتيريا **تاكل** المغذيات زي **vitamin B12**
          - gram-negative aerobes تبوّظ الـ CHO metabolism
      - kind: figure
        page: 242
        quote: "Small intestine motility disorders (vagotomy, systemic sclerosis, diabetic enteropathy, chronic intestinal pseudo- obstruction)"
        title: "أسباب الـ SIBO: 4 بوابات"
        alt: "A small bowel tube with four labelled problems: low stomach acid from achlorhydria or PPIs at the entrance; stagnant loops such as a Billroth II afferent limb, diverticula, obstruction or blind loop; slow motility from vagotomy, systemic sclerosis, diabetes or pseudo-obstruction; and a fistula letting colonic bacteria in, from Crohn, cancer or surgery."
        caption: "البكتيريا بتكتر لو: **الحمض قل** (PPI)، أو **الأمعاء ركدت** (loop أو diverticula)، أو **الحركة بطّأت** (diabetes، scleroderma)، أو **فيه fistula** من القولون. وكمان أشهر في ==older patients==."
