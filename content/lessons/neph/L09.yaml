  - id: neph.L09.lesson8
    title: "الـ plasma exchange: تشيل اللي الفلتر ما يقدرش عليه"
    hook: "الـ antibody وزنه 150,000 dalton، والفلتر بيقف عند 20,000. يبقى نشيل البلازما كلها."
    minutes: 8
    pages: [308, 310]
    topics: [tpe]
    goals:
      - "تعرف امتى الـ plasma exchange يبقى منطقي، وليه الشروط دي"
      - "تفرّق الـ centrifuge من الـ membrane"
      - "تعرف دواعي ASFA category I الكلوية والمضاعفات"
    status: unverified
    steps:
      - kind: explain
        page: 308
        title: "الـ plasma exchange: امتى يبقى منطقي؟"
        quote: "Sufficiently large (≥15,000D)."
        text: |
          ==Apheresis== = "تشيل". بنشيل البلازما ونرجّع albumin أو fresh frozen plasma، علشان نشيل حاجات كبيرة: **autoantibodies**، **immune complexes**، lipoproteins.

          يبقى منطقي لو الحاجة اللي عايز تشيلها:
          - **كبيرة**: ==15,000 D أو أكتر== (الـ dialysis ما يشيلهاش).
          - **Half-life طويل**.
          - **سامة حادة** ومش بتستجيب للعلاج العادي.
          - **Volume of distribution قليل** (موجودة في الدم مش في الأنسجة).

          طريقتين: **centrifuge** (citrate، extraction 80%) أو **membrane** (heparin، extraction 30%).

          ليه كل شرط؟ التفسير المقبول (مش في الكتاب):
          - **كبير**: لو صغير، الـ HD أسهل وأرخص.
          - **half-life طويل**: لو الجسم بيكسّره بسرعة لوحده، مش محتاج تشيله.
          - **سام حاد**: الـ TPE إجراء ليه مخاطر، فبنعمله لما الوقت مهم.
          - **volume of distribution قليل**: لو أغلبه في الأنسجة، اللي في الدم هيتشال ويرجع من الأنسجة تاني (rebound)، والـ IgG مثلًا نصه بره الأوعية، عشان كده بنعمل جلسات متكررة.
          وليه citrate مع الـ centrifuge؟ لأن الـ citrate بيمسك الـ Ca فالدم ما يتجلطش في الدايرة، بس ممكن يعمل hypocalcaemia (تنميل) فنراقب الـ Ca.

          وليه الـ membrane بيطلّع 30% بس؟ التفسير المقبول (مش في الكتاب): الفلتر بيسحب البلازما بالضغط عبر مسام، ولو سحبت أكتر الدم يتركز في الفلتر ويسده (زي الـ post-dilution في الـ haemofiltration). الـ centrifuge بيفصل بالوزن، فيقدر يطلّع نسبة أكبر بـ blood flow أقل، فمناسب للأوردة الطرفية. والـ membrane مناسب لو عندك ماكينة غسيل و catheter، وده المتاح في وحدات الكلى.
      - kind: figure
        page: 308
        quote: "Sufficiently large (≥15,000D)."
        title: "الحجم بيقرر: dialysis ولا plasma exchange؟"
        alt: "A size scale in daltons on a log axis from 10 to 1 million. A dashed line near 20,000 daltons marks the dialysis filter. Left of it, in green, dialysis removes small molecules such as urea, 60 daltons. Right of it, in blue, only plasma exchange removes the big ones: the target is 15,000 daltons or more, IgG antibody at 150,000, and immune complexes and lipoproteins larger still."
        caption: |
          الخط المتقطع = **فلتر الـ dialysis**: اللي **شماله** صغير بيعدّي (زي الـ urea)، واللي **يمينه** كبير ما بيعدّيش.

          - الـ TPE منطقي للحاجة ==15,000 D أو أكتر== (من الكتاب).
          - الـ **IgG** حوالي **150,000 D**، والـ immune complexes والـ lipoproteins أكبر.

          يعني الـ autoantibody مستحيل يتشال بالـ dialysis، فـ ==نشيل البلازما كلها==. حجم الـ urea ومكان الفلتر التقريبي التفسير المقبول (مش في الكتاب).
        svg: |
