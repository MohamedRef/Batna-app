          الـ multiple regression بيسمح لنا:

          - **نستخدم متغيرات كتير مرة واحدة** نفسّر بيها تغير الـ dependent المتصل (continuous).
          - **نعزل الأثر الخاص** (==unique effect==) لكل متغير، واحنا عاملين حساب إن الباقيين بيأثروا برضه.

          يعني b للتدخين = أثر التدخين على الـ HB% **بعد** ما شلنا أثر السن والوزن والدخل…
