  - id: dm.L21.003
    kind: table
    topic: fredrickson
    title: Fredrickson phenotypes by frequency
    columns: [Phenotype, "Relative frequency %"]
    rows:
      - [IV, "45"]
      - [IIb, "40"]
      - [IIa, "10"]
      - [V, "6"]
      - [I and III, "<1 each"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 260, quote: "Fredrickson Classification of Hyperlipidemia" }
