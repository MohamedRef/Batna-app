- id: res.L20.029
  kind: card
  topic: designs
  front: Define a cohort study (observational analytic).
  back: A group of participants with a similar characteristic followed through time (either retrospectively or prospectively) to determine which risk factors are associated with a particular outcome.
  src:
    page: 20
    quote: '| Cohort | Cohorts are a group of participants with a similar characteristic that are followed through time (either retrospectively or prospectively) to determine which risk factors are associated
      with that particular outcome. |'
  status: unverified
- id: res.L20.030
  kind: card
  topic: designs
  front: Define a case-control study (observational analytic).
  back: Compares patients who have a disease or outcome of interest (cases) with patients who don't (controls), and looks back retrospectively to compare how frequently the exposure to a risk factor is
    present in each group, to determine the relationship between the risk factor and the disease.
  src:
    page: 21
    quote: '| Case control | A study that compares patients who have a disease or outcome of interest (cases) with patients who do not have the disease or outcome (control participants) and looks back retrospectively
      to compare how frequently the exposure to a risk factor is present in each group to determine the relationship between the risk factor and the disease. |'
  status: unverified
- id: res.L20.031
  kind: card
  topic: designs
  front: Define a cross-sectional study (as the lecture classes it, observational descriptive).
  back: 'Observation of all of a population, or a representative sample, at one specific point in time: subjects are sampled without respect to disease status and studied at a particular point in time,
    as in a random-sample health survey.'
  src:
    page: 22
    quote: '| Cross sectional | Observation of all of a population, or a representative sample, at one specific point in time. A cross-sectional study is one in which subjects are sampled without respect
      to disease status and are studied at a particular point in time, as in a random-sample health survey. |'
  status: unverified
- id: res.L20.032
  kind: card
  topic: designs
  front: What is a case series, and what is it good for?
  back: A report about a small group of similar cases (observational descriptive). Typically the clinical route to case definition, recognition of disease entities and formulation of hypotheses.
  src:
    page: 23
    quote: '| Case series | A report about a small group of similar cases. Typically, they are the clinical route to case definition and recognition of disease entities and to the formulation of hypotheses.
      |'
  status: unverified
- id: res.L20.033
  kind: card
  topic: designs
  front: What is an RCT, and why is it the strongest design for cause and effect?
  back: It measures an intervention's effect by randomly assigning individuals (or groups of individuals) to an intervention group or a control group. It is the strongest study to determine a cause–effect
    relation between treatment and outcome.
  src:
    page: 24
    quote: '| Randomized controlled trials (RCTs) | RCTs are studies that measure an intervention''s effect by randomly assigning individuals (or groups of individuals) to an intervention group or a control
      group. This is the strongest study to determine a cause–effect relation that would potentially exist between treatment and outcome. |'
  status: unverified
