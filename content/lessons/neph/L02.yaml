        title: "ليه الحد بيقل مع السن؟"
        text: |
          جدول ص 29 بيدّي حد للـ GFR بيتغير مع السن: **< 75** تحت 40 سنة، **< 60** من 40 لـ 65، و **< 45** فوق 65.

          التفسير المقبول (مش في الكتاب): الـ GFR بينزل بالراحة مع السن حتى في الكلية السليمة. فـ GFR 55 عند واحد عنده 80 سنة ممكن يبقى شيخوخة طبيعية، وفي واحد عنده 30 سنة نفس الرقم يبقى ==مرض==. الحد اللي بيتحرك مع السن بيمنع إننا نسمّي كل كبار السن مرضى، ويمنع إننا نفوّت الشباب.

          ونفس المنطق في أمثلة الـ ==CKD-EPI 2021== في نفس الصفحة: نفس الـ creatinine 1.3 بيدّي eGFR مختلف جدًا حسب السن والنوع.
