        title: "الحركة: Mobility assessment"
        quote: "Mobility assessment\n  History taking\n  Establishing current and prior function\n  Understanding time periods\n  Goal-setting and prior Intervention\n  What the patient needs to be able to do\n  Gait and balance assessment\n  Simple tests for walking and balance\n    i. Timed up and go test\n    ii. Gait speed\n    iii. Chair stand\n  Onward referral"
        text: |
          History، current و prior function، الـ time periods، goals و prior intervention، هو محتاج يعمل إيه، gait و balance، ثم onward referral.

          والـ ==simple tests for walking and balance== تلاتة:
          1. **Timed up and go test**
          2. **Gait speed**
          3. **Chair stand**

          ليه كل خطوة؟ التفسير المقبول (مش في الكتاب):
          - **Current و prior function** و **time periods**: عشان تعرف هو كان ماشي إزاي قبل كده وفقد قد إيه وفي قد إيه، زي ما شفنا في الـ function.
          - **Goal-setting** و **what the patient needs to be able to do**: الهدف مش «يمشي كويس»، الهدف «يوصل الحمام» أو «ينزل يصلّي». الهدف ده بيحدد الـ rehabilitation.
          - الـ **simple tests** بتحوّل المشي لرقم تقدر تتابعه:
            - **Timed up and go**: يقوم من الكرسي، يمشي، يلف، ويرجع يقعد. يعني بيختبر الـ transfer والمشي واللفة في اختبار واحد، وده بالظبط اللي بيوقّع الكبار.
            - **Gait speed**: السرعة البطيئة علامة إن الاحتياطي قليل.
            - **Chair stand**: قوة عضل الرجل، اللي هي اللي بتقوّمه من الأرض والكرسي.
          - **Onward referral**: غالبًا للـ physiotherapist.
