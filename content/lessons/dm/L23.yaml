      - kind: explain
        page: 291
        title: "Evolocumab و alirocumab: لمين؟"
        quote: "Individuals with high CV risk who have persistently elevated LDL-C despite optimum lipid-modifying therapy."
        text: |
          الاتنين **monoclonal antibodies** ضد الـ PCSK9 (FDA **2015**: alirocumab يوليو، evolocumab أغسطس). الـ indications:
          1. **High CV risk** والـ LDL-C لسه عالي رغم أحسن علاج.
          2. ==FH==: الـ heterozygous أساسًا، والـ homozygous أقل.
          3. **Very high / high risk** عندهم **true statin intolerance** والـ LDL عالي.

          مفيش **moderate risk** في القايمة.
      - kind: check
        page: 291
        quote: "Very High Risk and High Risk patients with true statin intolerance and persistently high levels of LDL-C."
        question: "Which patient is NOT an indication for a PCSK9 inhibitor?"
        options:
          - "Moderate CV risk, LDL-C 130 on a moderate statin"
          - "Heterozygous FH, LDL-C 160 on maximal statin and ezetimibe"
          - "Very high risk with true statin intolerance, LDL-C 140"
          - "Post-MI, LDL-C 90 on maximal statin and ezetimibe"
        answer: 0
        why:
          - "صح: الـ moderate risk مش indication (سؤال الكتاب)."
          - "HeFH = indication 2."
          - "Statin intolerance + very high = indication 3."
          - "High risk رغم أحسن علاج = indication 1."
      - kind: table
        page: 292
        quote: "Intensity of lipid lowering treatment"
        title: "كل علاج بينزل قد إيه؟"
        columns: [Treatment, LDL-C fall]
        rows:
          - ["Moderate statin", "≈ 30%"]
          - ["High statin", "≈ 50%"]
          - ["High statin + ezetimibe", "≈ 65%"]
          - ["PCSK9i alone", "≈ 60%"]
          - ["PCSK9i + high statin", "≈ 75%"]
          - ["PCSK9i + high statin + ezetimibe", "≈ 85%"]
        hide: [[2, 1], [4, 1], [5, 1]]
      - kind: explain
        page: 294
        title: "Inclisiran: نوقف المصنع مش البضاعة"
        quote: "SiRNAs have been developed to interfere with PCSK9 production in the liver by neutralizing the messenger RNA of PCSK9."
        text: |
          ==Inclisiran== **siRNA**: بيبطّل الـ **mRNA** بتاع الـ PCSK9 في الكبد، فالـ PCSK9 ما يتعملش أصلًا.
          - الـ LDL-C نزل **40-50%** على سنة ونص، في الـ FH وغيره.
          - المفعول بيفضل **180 يوم** على الأقل ← حقنة كل **3 أو 6 شهور**، مقابل كل **2 أو 4 أسابيع** للـ antibodies.
          - التأثير على الـ LDL **متشابه**.
      - kind: update
        page: 294
        quote: "which enables inclisiran to be administered every 3 or 6 months"
        text: "الـ FDA label (2021): جرعة أولى، بعدها **3 شهور**، وبعدين **كل 6 شهور**. ومن 2023 ممكن يتدّي مع الـ statin بدري، مش بس بعد أقصى علاج. الـ outcome trials (ORION-4، VICTORION-2 PREVENT) كانت لسه شغالة في 2025."
        ref: "Leqvio (inclisiran) FDA label 2021, updated 2023"
      - kind: explain
        page: 295
        title: "Bempedoic acid"
        quote: "An inhibitor of ATP citrate lyase, a key enzyme involved In the cholesterol biosynthesis pathway."
        text: |
          - بيمنع ==ATP citrate lyase==، إنزيم في طريق تصنيع الكوليسترول **قبل** الـ HMG-CoA reductase.
          - **Oral**، مرة يوميًا، **non-statin** (Nexletol).
          - الـ indication في الكتاب: مع الـ diet وأقصى statin، في **HeFH** أو **ASCVD** محتاجين LDL أوطى.
          - بينزل الـ LDL-C حوالي **23%**، والـ TC والـ apo B والـ non-HDL-C والـ **CRP**.
      - kind: update
        page: 295
        quote: "Bempedoic acid is indicated as an adjunct to diet and maximally tolerated statin therapy"
        text: "**CLEAR Outcomes** (NEJM 2023): bempedoic acid قلل الـ major CV events **13%** في الناس اللي مش بتستحمل الـ statin. الـ FDA وسّع الـ label في 2024 للي مش بياخدوا statin، والـ **ESC/EAS 2025** بتوصي بيه في الـ statin intolerance."
        ref: "CLEAR Outcomes, NEJM 2023; FDA label 2024; ESC/EAS focused update 2025"
      - kind: match
        page: 291
        quote: "NPC1L1 = Niemann-Pick C1-like 1; HMG-CoA = 3-hydroxy-3-methylglutaryl acetyl coenzyme A"
        prompt: "وصّل الدوا بهدفه:"
