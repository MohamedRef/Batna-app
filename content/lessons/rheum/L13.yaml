lecture: rheum.L13
lessons:
  # ------------------------------------------------------------------
  - id: rheum.L13.lesson1
    title: "السونار في إيد الروماتولوجيست"
    hook: "الأشعة العادية بتشوف الخراب بعد ما يحصل. السونار بيشوف النار وهي لسه بتولّع."
    minutes: 8
    pages: [211, 212]
    topics: [why-msus, equipment]
    goals:
      - "تعرف ليه الـ MSUS أحسن من الـ X-ray بدري، ومميزاته"
      - "تختار الـ probe الصح وتعرف ليه"
      - "تعرف الجهاز والـ setup وليه بنمسح في اتجاهين"
    status: unverified
    steps:
      - kind: explain
        page: 211
        quote: "Introduction to Imaging in Rheumatology Musculoskeletal (MSK) imaging has become an essential extension of the physical exam in rheumatology. Traditional methods like X-ray are limited in detecting early inflammatory changes, whereas newer modalities such as musculoskeletal ultrasound (MSUS) and nailfold capillaroscopy offer significant advantages in early diagnosis and monitoring.\n  These tools allow for real-time visualization of joints, tendons, soft tissue, and microvascular abnormalities, which improves diagnostic accuracy, treatment decisions, and patient outcomes."
        title: "ليه نحتاج imaging جديد؟"
        text: |
          الـ ==X-ray== محدود في التغيرات الالتهابية البدرية. الـ **musculoskeletal ultrasound (MSUS)** والـ **nailfold capillaroscopy** بيدّوا early diagnosis و monitoring.

          الـ MSUS **non-invasive**، **bedside**، و **radiation-free**، وبيعمل:

          - يكشف ==early synovitis== قبل الـ structural damage.
          - يتابع النشاط والاستجابة للعلاج.
          - يقيّم tendons، bursae، entheses، و peripheral nerves.
          - يوجّه الحقن أو الـ aspiration.
      - kind: reveal
        page: 211
        quote: "Traditional methods like X-ray are limited in detecting early inflammatory changes, whereas newer modalities such as musculoskeletal ultrasound (MSUS) and nailfold capillaroscopy offer significant advantages in early diagnosis and monitoring."
        prompt: "ليه الـ X-ray ما بيشوفش الالتهاب البدري، والسونار بيشوفه؟"
        answer: |
          الكتاب بيقول الـ X-ray ==limited in detecting early inflammatory changes==. السبب مش مكتوب.

          التفسير المقبول (مش في الكتاب): الـ X-ray بيشوف العضم والكالسيوم كويس، لكن الـ synovium الملتهب والسوايل والأوتار كلها soft tissue بتبان رمادي واحد. فلازم الالتهاب ياكل في العضم (erosion) عشان يبان، وده بعد شهور. أما الصوت فبيرتد بشكل مختلف من كل نسيج، فبيفرّق الـ synovium المتضخم والسايل والوتر، والـ Doppler بيشوف الدم الزيادة في الالتهاب.
      - kind: aside
        tone: analogy
        page: 211
        quote: "Its advantages include high patient acceptability, reproducibility, cost- effectiveness, and portability. Compared to X-ray or MRI, ultrasound is especially valuable in identifying early, subtle inflammatory lesions that are not visible on conventional imaging."
        text: "الـ X-ray زي صورة البيت بعد الحريقة: بتشوف الحيطان المتفحمة (erosions). الـ MSUS زي كاميرا مراقبة: بتشوف الدخان وهو لسه طالع (synovitis و Doppler)."
      - kind: explain
        remind: [rheum.L13.004]
        page: 211
        quote: "Its advantages include high patient acceptability, reproducibility, cost- effectiveness, and portability. Compared to X-ray or MRI, ultrasound is especially valuable in identifying early, subtle inflammatory lesions that are not visible on conventional imaging."
        title: "مميزاته وليه"
        text: |
          الكتاب بيعدّ أربع مميزات، والسبب ورا كل واحدة (التفسير المقبول، مش في الكتاب):
          - **High patient acceptability**: مفيش إبر ولا إشعاع ولا جهاز مقفول زي الـ MRI
          - **Reproducibility**: لو اتعمل بنفس الطريقة (الـ planes والـ positioning، ص 212) يطلع نفس النتيجة، فتقدر تقارن زيارة بزيارة
          - **Cost-effectiveness**: أرخص بكتير من الـ MRI وبيتعمل في نفس الزيارة
          - **Portability**: الجهاز بيروح للعيان في العيادة أو جنب السرير

          والكتاب بيقول إنه مقارنة بالـ X-ray أو الـ ==MRI== بيلقط ==early, subtle inflammatory lesions== اللي ما بتبانش في الـ conventional imaging.
      - kind: check
        page: 211
        quote: "MSUS is a non-invasive, bedside, radiation-free imaging modality that can:\n  Detect early synovitis before structural damage occurs.\n  Monitor disease activity and treatment response.\n  Evaluate tendons, bursae, entheses, and peripheral nerves.\n  Assist with image-guided joint injections or aspirations."
        question: "Which of the following is a key advantage of MSUS in rheumatology?"
        options:
          - "Detects early synovitis and guides injections"
          - "Detects only structural joint damage"
          - "Requires radiation exposure"
          - "Cannot visualize tendons"
        answer: 0
        why:
          - "صح: الكتاب: يكشف early synovitis قبل الـ structural damage ويساعد في الـ image-guided injections."
          - "بالعكس، بيشوف الالتهاب قبل الـ damage."
          - "الكتاب: radiation-free."
          - "الكتاب: بيقيّم tendons و bursae و entheses."
      - kind: figure
        page: 212
        quote: "Linear probe: 6–15 MHz – used for joints, tendons, and superficial tissues. Curvilinear probe: 2–5 MHz – for deeper structures (e.g., hips)."
        title: "أنهي probe؟"
        alt: "Two probes. Left: a flat linear probe labelled 6 to 15 MHz with a shallow beam reaching joints and tendons. Right: a curved probe labelled 2 to 5 MHz with a deep fan-shaped beam reaching the hip."
        caption: "Frequency عالية = صورة حادة بس قريبة. Frequency واطية = توصل لتحت، زي الحوض."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <rect x="30" y="20" width="100" height="22" rx="4" class="fg-acc"/>
            <path d="M30 42L30 110L130 110L130 42" class="fg-thin"/>
            <text x="40" y="36" class="t-sm t-b">Linear</text>
            <text x="30" y="130" class="t-sm t-b">6–15 MHz</text>
            <text x="30" y="150" class="t-sm">joints, tendons</text>
            <text x="30" y="168" class="t-sm">superficial tissue</text>
            <path d="M200 42Q245 15 290 42" class="fg-acc"/>
            <path d="M200 42L175 200M290 42L315 200M175 200Q245 215 315 200" class="fg-thin"/>
            <text x="222" y="36" class="t-sm t-b">Curved</text>
            <text x="205" y="120" class="t-sm t-b">2–5 MHz</text>
            <text x="205" y="140" class="t-sm">deeper: hips</text>
          </svg>
      - kind: reveal
        page: 212
        quote: "Linear probe: 6–15 MHz – used for joints, tendons, and superficial tissues.\n  Curvilinear probe: 2–5 MHz – for deeper structures (e.g., hips)."
        prompt: "ليه الـ probe اللي frequency بتاعه عالي للسطحي، والواطي للحوض؟"
        answer: |
          الكتاب: **linear 6–15 MHz** للمفاصل والأوتار والسطحي، و **curvilinear 2–5 MHz** للعميق زي الـ ==hips==.

          التفسير المقبول (مش في الكتاب): الموجة اللي frequency بتاعها عالي بتدّي صورة ==أدق== بس بتتمتص بسرعة فما بتوصلش لتحت. الواطية بتخترق أعمق بس الصورة أقل تفاصيل. فالمفصل الصغير القريب من الجلد محتاج الدقة، والحوض المدفون تحت عضلات كتير محتاج العمق.
      - kind: explain
        remind: [rheum.L13.005]
        page: 212
        quote: "Positioning the patient and the probe correctly is essential for standardized and reproducible imaging. The EULAR guidelines stress the importance of scanning in both longitudinal and transverse planes."
        title: "الجهاز والـ setup"
        text: |
          - Transducer (high-frequency linear)، monitor، software فيه **colour و power Doppler**، و **gel** للـ acoustic coupling.
          - Positioning صح للمريض والـ probe عشان الصورة تبقى standardized و reproducible.
          - ==European League Against Rheumatism (EULAR)==: اعمل scan في الـ **longitudinal و transverse** planes الاتنين.
      - kind: reveal
        page: 212
        quote: "Positioning the patient and the probe correctly is essential for standardized and reproducible imaging. The EULAR guidelines stress the importance of scanning in both longitudinal and transverse planes."
        prompt: "ليه الـ gel، وليه EULAR بتصر على اتجاهين (longitudinal و transverse)؟"
        answer: |
          الكتاب بيقول الـ gel ==for acoustic coupling==، والـ positioning الصح عشان الصورة تبقى **standardized and reproducible**.

          التفسير المقبول (مش في الكتاب):
          - **الـ gel**: الهوا بين الـ probe والجلد بيرجّع الصوت كله، فالـ gel بيشيل الهوا ويخلي الموجة تدخل
          - **اتجاهين**: حاجة شكلها غريب في مقطع واحد ممكن تكون artefact. لو شفتها في الطول والعرض الاتنين تبقى حقيقية، وبتعرف شكلها الكامل
      - kind: check
        page: 212
        quote: "Probe Types\n  Linear probe: 6–15 MHz – used for joints, tendons, and superficial tissues.\n  Curvilinear probe: 2–5 MHz – for deeper structures (e.g., hips)."
        question: "Which probe frequency is typically used for superficial joints in MSUS?"
        options:
          - "6–15 MHz"
          - "2–3 MHz"
          - "5–7 MHz"
          - "20–30 MHz"
        answer: 0
        why:
          - "صح: linear probe 6–15 MHz للمفاصل والأوتار والسطحي."
          - "دي frequency واطية للعميق (curvilinear 2–5 MHz)."
          - "مش رقم الكتاب."
          - "مش رقم الكتاب."
      - kind: try
        items: [rheum.L13.003, rheum.L13.004, rheum.L13.005, rheum.L13.006, rheum.L13.038]
    recap:
      - "X-ray محدود في الالتهاب البدري. MSUS: non-invasive، bedside، بدون إشعاع، يشوف synovitis بدري، يتابع، يقيّم tendons و bursae و entheses و nerves، ويوجّه الحقن."
      - "مميزاته: acceptability، reproducibility، cost-effectiveness، portability."
      - "Linear 6–15 MHz للسطحي، curvilinear 2–5 MHz للعميق (hip). Gel للـ coupling، و EULAR: longitudinal و transverse."
    practice: [rheum.L13.001, rheum.L13.002, rheum.L13.003, rheum.L13.004, rheum.L13.005, rheum.L13.006, rheum.L13.007, rheum.L13.038, rheum.L13.046, rheum.L13.047]
