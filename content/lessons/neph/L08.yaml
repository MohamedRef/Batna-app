        page: 217
        title: "باقي القاموس"
        quote: "Membrano-proliferative: ‑ Combined capillary wall thickening and mesangial or endocapillary hypercellularity."
        text: |
          - **Sclerosis**: collagen matrix زيادة بيوسّع الـ mesangium أو يسد الـ capillaries أو يعمل adhesions لـ Bowman's capsule.
          - **Hyaline**: مادة **glassy acidophilic** برّه الخلايا.
          - ==Membranoproliferative==: **capillary wall thickening** + mesangial أو endocapillary hypercellularity.
          - **Lobular**: segments منتفخة ومفصولة بـ urinary space.
          - **Mesangiolysis**: الـ GBM ينفصل عن الـ mesangial matrix أو الـ matrix يتحلل.

          ليه نحفظ الكلمات دي؟ التفسير المقبول (مش في الكتاب): كل كلمة بتقول **عمر** الضرر:
          - **fibrinoid necrosis** و **crescent** خلوي = حاجة بتحصل **دلوقتي** (active)، وممكن تتعالج.
          - **sclerosis** و **hyaline** = ندبة **قديمة** (chronic)، مش هترجع.
          - **lobular** و **membranoproliferative** = الـ glomerulus بيعيد بناء نفسه حوالين deposits، يعني مرض ماشي بقاله وقت.
          - **mesangiolysis** = الـ mesangium نفسه اتهد، وبيتشاف مع إصابة endothelium زي الـ TMA.
          فلما تقرا تقرير، قسّم الكلمات لعمودين: active و chronic. العمود الأول هو اللي بيحدد هتعالج ولا لأ.

          إزاي القاموس ده بيظهر في الـ cases؟ التفسير المقبول (مش في الكتاب): case 2 (lupus) فيها fibrinoid necrosis و crescents = active. case 6 (السكر) فيها nodules و sclerosis = chronic. case 10 (LCAT) فيها hyaline deposits و duplication. case 13 (transplant) فيها fibrin thrombi و fragmentation = TMA. فكل كلمة هنا هتقابلها في case حقيقية، وارجع للصفحة دي لما تقرا أي تقرير وتلاقي كلمة مش فاكرها.
