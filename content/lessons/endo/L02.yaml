        page: 22
        quote: "IGF-1 levels are not useful in the diagnosis of acromegaly in pregnancy, as they are elevated in the second half of both normal and acromegalic pregnancies."
        question: "Why is serum IGF-1 unhelpful for diagnosing acromegaly in pregnancy?"
        options: ["It rises in the second half of every pregnancy", "IGF-1 does not cross the placenta", "IGF-1 falls in acromegaly during pregnancy", "IGF-1 assays fail in pregnancy serum"]
        answer: 0
        why:
          - "صح: الـ IGF-1 عالي في النص التاني من **أي** حمل، طبيعي أو acromegalic، لأن الـ GH-V بيرفعه."
          - "مش ده السبب اللي في الكتاب."
          - "بالعكس، بيعلى."
