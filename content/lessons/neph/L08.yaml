        quote: "Causes of membranous GN:\n  Infections.\n  Malignancy (20% in patients >57, 4%<57).\n  Autoimmune diseases.\n  Alloimmune diseases.\n  Drugs/toxins."
        text: |
          الأسباب: **infections**، **malignancy**، **autoimmune**، **alloimmune**، و **drugs/toxins**.

          والرقم المهم: الـ malignancy بتعمل ==20%== من الـ MN فوق **57 سنة**، و **4%** تحتها. علشان كده الكبير بـ MN لازم تدوّر على tumour.

          ليه الأسباب دي بالذات؟ التفسير المقبول (مش في الكتاب): الـ membranous = antibody قاعد **تحت الـ podocyte**. أي حاجة بتطلّع antigen جديد يوصل للمكان ده تعمل نفس الصورة:
          - الـ **tumour** بيفرز antigens بتترسب في الـ GBM، والـ antibodies بتلاقيها هناك.
          - الـ **infections** (زي hepatitis B) نفس الفكرة: antigen من بره.
          - الـ **autoimmune** (زي lupus class V) و الـ **alloimmune** (transplant) جسم بيهاجم نفسه أو كلية غريبة.
          - الـ **drugs** (زي الـ NSAIDs والدهب زمان) بتغيّر الـ antigens.
          وليه الـ 57 سنة؟ لأن الأورام بتزيد مع السن، فعند الكبير لازم تدوّر قبل ما تدي IS ممكن يسرّع الورم.
      - kind: explain
        page: 235
        title: "الـ anti-PLA2R: تشخيص ومتابعة"
        quote: "70%–80% of patients with PMN have anti-PLA2R/THSD7A antibody.\nAnti-PLA2R antibody is about 80% sensitive and 100% specific for PMN (although rare patients with sarcoid, HBV, HCV, HIV, and cancer have been reported).\nAnti-PLA2R antibody can be present for many months before proteinuria appears.\nIn non-nephrotic patients, low, or declining, anti-PLA2R levels predict spontaneous remission and high levels predict progression to nephrotic syndrome.\nAnti-PLA2R–negative patients can become positive later.\nHigh antibody levels (before and after treatment) correlate with proteinuria, response to therapy, and (after therapy) long-term outcomes.\nPatients with higher antibody levels require more prolonged immunosuppression to achieve remission rates comparable to those with lower levels."
        text: |
          - **70–80%** من الـ primary membranous nephropathy (MN) عندهم anti-PLA2R/THSD7A.
          - ==80% sensitive و 100% specific==.
          - ممكن يطلع **قبل الـ proteinuria بشهور**.
          - العالي = محتاج **immunosuppression أطول**، والعالي بعد العلاج = ==relapse==.
          - العالي وقت الـ transplant = **recurrence**.
          - **Immunologic remission** قبل **renal remission** بأسابيع لشهور.

          ليه الـ antibody ده مفيد بالشكل ده؟ التفسير المقبول (مش في الكتاب): لأنه **السبب** نفسه مش علامة جانبية. فهو بيطلع قبل الضرر، وبيقل لما العلاج يشتغل، وبيرجع لما المرض يرجع.
          - **100% specific** يعني لو موجب في عيان nephrotic، غالبًا مش محتاج biopsy عشان تقول primary MN.
          - **80% sensitive** يعني السلبي ما بيستبعدش، زي case 3 بالظبط.
          - الـ **transplant**: الـ antibody لسه في الدم وهيلاقي PLA2R في الكلية الجديدة، عشان كده العالي وقت الـ transplant بيقول recurrence.
      - kind: aside
