  - id: rheum.L01.lesson4
    title: "لما الرسايل تبقى spam: الـ cytokine storm"
    hook: "رسالة واحدة مفيدة. مليون رسالة في ثانية؟ الجروب كله يهنج، والمريض كمان."
    minutes: 9
    pages: [15, 17]
    topics: [storm, diseases]
    goals:
      - "تعرّف الـ cytokine storm وتعدّ أسبابه"
      - "تعرف الصورة الإكلينيكية والمعملية"
      - "تفرّق septic shock عن toxic shock"
    status: unverified
    steps:
      - kind: explain
        page: 15
        quote: "A severe immune reaction in which the body releases too many cytokines into the blood too quickly."
        title: "يعني إيه storm؟"
        text: |
          الـ ==cytokine storm== (hypercytokinemia) = **too many cytokines, too quickly**.

          بدل ما المناعة تنظّم هجوم على الميكروب، بتعمل **shock** و **multiorgan failure** وممكن موت.
      - kind: reveal
        page: 15
        quote: "A cytokine storm can occur as a result of an infection, autoimmune condition, or some drugs (CAR T-cell therapy–induced cytokine storm) ."
        prompt: "إيه أسباب الـ storm في الكتاب؟"
        answer: |
          - **Infection**: influenza A، COVID، وبعض البكتيريا.
          - **Autoimmune condition**.
          - **Drugs**: CAR T-cell therapy.
          - **Immunotherapy**: high-dose IL-2 لمرضى السرطان.
      - kind: figure
        page: 16
        quote: "The combination of renal dysfunction, endothelial-cell death, and acute-phase hypoalbuminemia can lead to capillary leak syndrome and anasarca."
        title: "العاصفة بتضرب فين؟"
        alt: "A central box labelled cytokine storm with fever in nearly all. Arrows to organ boxes: lungs ARDS, blood DIC and bleeding, circulation vasodilatory shock, kidney failure, liver injury or cholestasis, heart stress cardiomyopathy, vessels capillary leak and anasarca."
        caption: "Fever في الكل تقريبًا، وبعدها كل عضو ممكن يتأثر."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
