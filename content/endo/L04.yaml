  - id: endo.L04.050
    kind: card
    topic: crf-reproductive
    front: Does dialysis reverse the hypothalamic–pituitary–gonadal dysfunction of CRF?
    back: No. Haemodialysis or peritoneal dialysis does not reverse it; renal transplantation was reported to restore it, though results conflict.
    src: { page: 50, quote: "Impaired function of the hypothalamic–pituitary–gonadal axis is not reversed by initiation of effective haemodialysis or peritoneal dialysis therapy. In contrast, renal transplantation was reported to restore endocrine function, but study results are conflicting." }
    status: unverified
    tags: [high-yield]
