  - id: res.L08.046
    kind: mcq
    topic: designs
    stem: >-
      People exposed to an environmental toxin are not treated but are observed over time with a standard set of measures
      to find the toxin's effects. This design is called
    options: [Clinical trial, Double-blind, Longitudinal, Prospective cohort, Retrospective cohort]
    answer: 2
