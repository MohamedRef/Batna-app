  # ---------- p52: summary ----------
  - id: geri.L03.074
    kind: enumerate
    topic: principles
    prompt: Summarise the prescribing rules for elderly patients (book summary).
    points:
      - Obtain a complete medication history
      - Review medications regularly and before adding a new one
      - Know the drugs' actions, adverse events and toxicity
      - Start long-term drugs low and titrate to tolerability and response
      - Reach a therapeutic dose before switching or adding
      - Educate the patient or caregiver about each drug
      - Avoid treating one drug's adverse event with another drug
      - Try to treat two or more conditions with one drug
      - Avoid drugs of the same class or similar action
      - Communicate with other prescribers
    pass: 7
