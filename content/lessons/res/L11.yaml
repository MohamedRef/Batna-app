  - id: res.L11.lesson3
    title: "Stratified sampling: كل مجموعة ليها نصيب"
    hook: "لو عايز الريف والحضر الاتنين يظهروا في العينة، القرعة العادية مش هتكفي."
    minutes: 6
    pages: [29, 93]
    topics: [probability]
    goals:
      - "تعرف إمتى تستخدم stratified sampling"
      - "تحسب الـ proportional allocation"
      - "تعرف مشكلة الـ equal allocation وحلها"
    status: unverified
    steps:
      - kind: explain
        page: 29
        quote: "The simple random sampling method has a disadvantage that small groups in which the researcher is interested may hardly appear in the sample.\nIf it is important that the sample includes representative study units of small groups with specific characteristics (for example, residents from urban and rural areas, or different religious or ethnic groups),"
        title: "عيب الـ simple random اللي الـ stratified بيصلحه"
        text: |
          في الـ simple random، ==المجموعات الصغيرة== اللي تهمك ممكن ==بالكاد تظهر== في الـ sample.

          فلو مهم إن الـ sample فيه units تمثّل مجموعات صغيرة بصفات معينة (==ريف وحضر==، أو ديانات أو أعراق مختلفة)، بنعمل stratification.

          ليه؟ القرعة العادية بتمشي بالنسب، فمجموعة 2% ممكن ماتطلعش خالص في عيّنة صغيرة. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 30
        quote: "Dividing up the population into smaller groups (Strata) , and randomly sampling from each group.\nStratified sampling is only possible when we know what proportion of the study population belongs to each group we are interested in."
        title: "3. Stratified sampling"
        text: |
          مشكلة الـ simple random: **المجموعات الصغيرة** اللي تهمك (ريف وحضر، أقليات) ممكن متظهرش في الـ sample أصلًا.

          الحل: ==stratified sampling== = تقسّم الـ population لمجموعات (**strata**) وتسحب **random** من كل واحدة.

          الشرط: لازم تكون **عارف نسبة** كل مجموعة في الـ population.
      - kind: check
        page: 91
        quote: "In a study, people are separated into certain sub-groups and then some are selected randomly from each of these sub-groups. What type of sampling is being done?\n  (a) Simple random sampling\n  (b) Cluster random sampling\n  (c) Systematic random sampling\n  (d) Stratified random sampling"
        question: "People are separated into sub-groups and some are selected randomly from each sub-group. Which sampling is this?"
        options: ["Stratified random sampling", "Cluster random sampling", "Systematic random sampling", "Simple random sampling"]
        answer: 0
        why:
          - "صح: sub-groups + random من **كل** واحدة = stratified."
          - "الـ cluster بياخد **بعض** المجموعات كاملة، مش من كلها."
          - "الـ systematic كل K واحد من list."
          - "الـ simple random مفيهوش sub-groups."
      - kind: explain
        page: 34
        quote: "This approach creates an adequate sample size, but it presents problems for data analysis because the characteristics of one group (in this case, the females) will be overrepresented in the sample.\nFortunately, this effect can be controlled by weighting the data so the males receive a proportionally larger mathematical representation in the analysis of scores than the females."
        title: "Equal allocation: الحجم كويس بس التحليل محتاج weighting"
        text: |
          لما تاخد ==100 ست و 100 راجل== من 300 ست و 700 راجل (disproportional، equal allocation):

          - كل category ==حجمها كافي==.
          - بس الستات ==overrepresented== في الـ sample، وده مشكلة في التحليل.
          - الحل: weighting the data، فالرجالة ياخدوا وزن أكبر في التحليل على قد نسبتهم.

          ليه؟ لو حسبت متوسط الـ sample زي ما هو، رأي الستات هيطلع أكبر من حجمه الحقيقي في الكلية. التفسير المقبول (مش في الكتاب).
      - kind: case
        page: 35
        quote: "Calculating proportional weights involves determining the probability that any one male or female will be selected.\nFor example, In a population of 1000, sample of 200 is to be drawn based on the proportion of each category in the study population(30% females and 70% mares). Means that I will select randomly 60 females and 140 males."
        stem: "Survey of Faculty of Medicine staff: the grant covers 200 subjects; the population is 1000 (700 males, 300 females)."
        steps:
          - question: "With proportional allocation, how many females?"
            options: ["60", "100", "30"]
            answer: 0
            why: "30% من 200 = **60** ستات، و 140 راجل."
          - question: "With disproportional (equal) allocation, how many females?"
            options: ["100", "60", "150"]
            answer: 0
            why: "**Equal allocation** = عدد متساوي من كل stratum: 100 + 100."
          - question: "In the equal-allocation sample, what does the analysis need?"
            options: ["Weighting, so the males count proportionally more", "Nothing, randomization fixes it", "Dropping 40 females"]
            answer: 0
            why: "كل ست فرصتها أعلى، فالستات **overrepresented**؛ الـ **weighting** بيرجّع النسب الحقيقية."
      - kind: table
        page: 36
        quote: "Table 1 Proportional allocation of 1,600 students to four strata defined by college year\n| Year | Population Size: Total Enrollment | Sample Size: nh = nNh/N | Sample Size: Rounded Values |\n|---|---|---|---|\n| First | 5,000 | 399.4 | 399 |\n| Second | 4,058 | 324.1 | 324 |\n| Third | 4,677 | 373.6 | 374 |\n| Fourth | 6,296 | 502.9 | 503 |\n| Total | 20,031 | 1,600.0 | 1,600 |"
        title: "Proportional allocation: n(h) = n × N(h) / N"
        columns: ["Year", "Enrollment", "Sample"]
        rows:
          - ["First", "5,000", "399"]
          - ["Second", "4,058", "324"]
          - ["Third", "4,677", "374"]
          - ["Fourth", "6,296", "503"]
          - ["Total", "20,031", "1,600"]
        hide: [[0, 2], [3, 2]]
      - kind: mnemonic
        page: 37
        quote: "Non-homogenous population is converted to homogenous groups/classes (strata); sample is drawn from each strata at random, in proportion to its size\nApplicable for large non-homogenous population\nGives more representative sample than simple random sampling\nNone of the categories is under or over-represented"
        word: "LHR"
        parts:
          - { key: "L", text: "Large non-homogeneous population: ده مكانه." }
          - { key: "H", text: "Homogeneous strata: بنحوّل الخليط لمجموعات متجانسة، ونسحب من كل واحدة بنسبة حجمها." }
          - { key: "R", text: "Representative أكتر من الـ simple random، ومفيش category under- أو over-represented." }
        hook: "الـ stratified للـ **heterogeneous**: بتخلي كل طبقة جواها **homogeneous**."
      - kind: check
        page: 93
        quote: "Stratified sampling is ideal for: [Recent Question 2012]\n  (a) Heterogenous data\n  (b) Homogenous data\n  (c) Both\n  (d) None"
        question: "Stratified sampling is ideal for (Recent Question 2012):"
        options:
          - "Heterogeneous data"
          - "Homogeneous data"
          - "Both"
          - "None"
        answer: 0
        why:
          - "صح (a في السلايد): population مش متجانسة، بتقسّمها لـ strata متجانسة من جوه."
          - "الـ homogeneous يكفيها simple random."
          - "مفيش مكسب من تقسيم population متجانسة."
          - "ليه استخدام واضح."
      - kind: try
        items: [res.L11.025, res.L11.029, res.L11.043]
    recap:
      - "Stratified: قسّم لـ strata وخد random من كل واحدة؛ لازم تعرف نسبة كل مجموعة."
      - "Proportional: n(h) = n × N(h) ÷ N."
      - "Equal allocation: حجم كافي، بس محتاج weighting في التحليل."
      - "Stratified ideal for heterogeneous data."
    practice: [res.L11.025, res.L11.026, res.L11.027, res.L11.028, res.L11.029, res.L11.030, res.L11.031, res.L11.043, res.L11.045]
