items:
  # ---------- p292-293: introduction ----------
  - id: neph.L09.001
    kind: enumerate
    topic: intro
    prompt: Mention what an optimal renal replacement therapy should fulfil.
    points:
      - Purification of uraemic toxins
      - Electrolyte and acid–base homeostasis
      - Prevent further deterioration; preserve residual renal function
      - Accelerate recovery of acute kidney failure
      - Tolerance and flexibility of technique
      - No significant nutrient loss
    pass: 4
    hook: "الغسيل المثالي = كلية بديلة محترمة بـ 6: «ينضّف (uraemic toxins)، يظبط (electrolytes وacid–base)، يحافظ (يمنع التدهور ويحمي الـ residual renal function)، يسرّع شفا الـ AKI، يتحمّله المريض ويتشكّل معاه (tolerance وflexibility)، وما يسرقش أكل (no significant nutrient loss)»."
    src: { page: 293, quote: "Prevent further deterioration of renal function. Preserve residual renal function." }
    status: unverified
  - id: neph.L09.002
    kind: card
    topic: intro
    front: What are the main renal replacement therapies for ESRD, and which gives the best overall outcome?
    back: Haemodialysis, peritoneal dialysis and renal transplantation; transplantation is the better overall treatment.
    src: { page: 293, quote: "Important renal replacement therapies (RRT) for end-stage renal disease (ESRD) patients are hemodialysis (HD), peritoneal dialysis (PD) and renal transplantation (RT). The outcome comparison suggest that RT is a better overall treatment forESRD patients. On the other hand, the studies that compared patient outcome for HD and PD have yielded conflicting results. Neither treatment modality is best suited for all patients. The choice should be discussed and analyzed for each particular patient considering his demographic, comorbidity, availability of suitable living-related or cadaveric donor, economic factors and social circumstances, morbidity and quality of life on RRT. In practice, most patients in the world are treated with hemodialysis (80%). Councelling for RRT should be in stage 4CKD, to allow time for hepatitis B vaccination, and sufficient time for creation and maturation of arteriovenous fistula in case of hemodialysis." }
    status: unverified
    tags: [high-yield]
  - id: neph.L09.003
    kind: card
    topic: intro
    front: Is haemodialysis or peritoneal dialysis better for ESRD patients?
    back: Studies conflict; neither suits all patients, so the choice is made per patient (demographics, comorbidity, donor availability, economics, social circumstances, quality of life).
    src: { page: 293, quote: "Important renal replacement therapies (RRT) for end-stage renal disease (ESRD) patients are hemodialysis (HD), peritoneal dialysis (PD) and renal transplantation (RT). The outcome comparison suggest that RT is a better overall treatment forESRD patients. On the other hand, the studies that compared patient outcome for HD and PD have yielded conflicting results. Neither treatment modality is best suited for all patients. The choice should be discussed and analyzed for each particular patient considering his demographic, comorbidity, availability of suitable living-related or cadaveric donor, economic factors and social circumstances, morbidity and quality of life on RRT. In practice, most patients in the world are treated with hemodialysis (80%). Councelling for RRT should be in stage 4CKD, to allow time for hepatitis B vaccination, and sufficient time for creation and maturation of arteriovenous fistula in case of hemodialysis." }
    status: unverified
