  - id: neph.L13.095
    kind: mcq
    topic: sglt2
    stem: Why does an SGLT2 inhibitor cause a small early eGFR dip in DKD?
    options:
      - More distal sodium reaches the macula densa, so tubuloglomerular feedback constricts the afferent arteriole
      - It is directly nephrotoxic to the proximal tubule, causing mild acute tubular injury
      - It dilates the efferent arteriole like an ACE inhibitor, lowering glomerular pressure
      - It causes sodium and water retention, raising venous pressure and lowering filtration
      - It blocks SGLT1 in the glomerular capillaries, reducing the filtration surface
    answer: 0
    why:
      - "Correct: enhanced distal Na delivery diminishes GFR via tubuloglomerular feedback (p441)."
      - The figure shows a hemodynamic, protective effect, not tubular injury.
      - Efferent dilation is the ACEi/ARB mechanism, not shown here.
      - SGLT2i cause natriuresis, not sodium and water retention.
      - SGLT2 is in the proximal tubule, not the glomerulus; SGLT1 remains active.
    src: { page: 441, quote: "Normal:\n  100%\nDiabetes:\n  120%; TGF ↓\n  Diminshed distal Na delivery and hyperfiltration\nDiabetes + SGLT2i:\n  90%; TGF ↑\n  Enhanced distal Na delivery and diminished GFR" }
    status: unverified
  - id: neph.L13.096
    kind: enumerate
    topic: sglt2
    prompt: Renoprotective effects of GLP-1 (incretin-based therapy) in the p443 figure?
    points:
      - Less NADPH oxidase-induced free radicals (via cAMP/PKA)
      - Vasodilation (more NO, less ROS)
      - Less inflammation (lower CRP, IL-6, TNF-α)
      - Less apoptosis via PI3K/AKT, so less renal fibrosis
    pass: 3
    hook: "GLP-1 بيطفي 4 «صدا، ضيق، ولعة، موت»: free radicals أقل من NADPH oxidase (عن طريق cAMP/PKA)، vasodilation (NO أكتر وROS أقل)، inflammation أقل (CRP وIL-6 وTNF-α)، وapoptosis أقل عن طريق PI3K/AKT فـ renal fibrosis أقل."
    src: { page: 443, quote: "Reno- protective effect of GLP-1\nIncertin-Based Therapy → GLP-1R → kidney\n  ↑ cAMP/PKA → ↓ NADPH osidase-induced free radical species → Vascular protection\n  ↑ NO, ↓ ROS → ↑ Vasolidation → Vascular protection\n  ↓ CRP, IL-6, IL-10, TNF-α → ↓ Inflammation → Vascular protection\n  ↑ PI3K → AKT → ↓ Apoptosis → ↓ Renal fibrosis" }
    status: unverified
