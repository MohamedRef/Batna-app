  - id: neph.L14.lesson14
    title: "Hepatorenal: كلية سليمة بس مقفولة"
    hook: "الكلية دي لو اتزرعت في جسم تاني هتشتغل. المشكلة مش فيها، المشكلة في الدورة الدموية."
    minutes: 10
    pages: [491, 494]
    topics: [hrs, hbv-hiv]
    goals:
      - "تعرف ليه الـ ART بدري حتى مع CKD"
      - "تشرح الـ HRS كـ functional disease وليه دايمًا مع ascites"
      - "تطبّق معايير HRS-AKI وتفهم كل شرط بيستبعد إيه"
      - "تعالج بالـ terlipressin + albumin وتعرف ليه ولحد إمتى"
      - "تعرف إن الـ liver transplant هو الحل"
    status: unverified
    steps:
      - kind: explain
        page: 491
        title: "HIV و CKD: ابدأ بدري"
        quote: "The presence of CKD is not a contraindication for antiretroviral therapy (ART) of HIV infection. Current consensus data based on large RCTs on the time to initiate ART ،namely Strategic Timing of AntiRetroviral Treatment (START) and Early Anti- retroviral Treatment and/or Early Isoniazid Prophylaxis Against Tuberculosis in HIV-infected Adults (TEMPRANO) demonstrate benefit of early initiation of ART at the time of diagnosis regardless of CD & count."
        text: |
          الكتاب بيقول ==The presence of CKD is not a contraindication== للـ ART. وتجربتين كبار (**START** و **TEMPRANO**) بيقولوا ابدأ ==at the time of diagnosis regardless of CD4 count==.

          والسبب في الكتاب: الـ Work Group شايفة إن ==the benefit outweighs the risk==، والمرضى نفسهم **place a high value on early treatment**.

          التفسير المقبول (مش في الكتاب): الـ HIV بيأذي الـ podocyte مباشرة في الـ HIVAN، فكل ما الفيروس يقل بدري، الكلية تتحمي. والجرعات بس هي اللي بتتظبط على الـ GFR.
      - kind: explain
        page: 491
        title: "HRS: كلية سليمة بس مقفولة"
        quote: "HRS is a functional disease characterised by marked vasoconstriction of the renal arteries secondary to the effect of hyper activation of different vasoconstrictor systems aimed at compensating the systemic vasodilation caused by the initial splanchnic vasodilation."
        text: |
          الـ splanchnic vasodilation ← الجسم يشغّل vasoconstrictors ← ==renal vasoconstriction== جامد. الكلية نفسها **سليمة** (functional).

          دايماً مع **ascites** و advanced circulatory dysfunction.

          ليه بنقول functional؟ لأن الكلية دي لو اتزرعت في حد تاني بتشتغل، والكتاب بيقولك الـ liver transplant بيصلّحها. المشكلة في الدورة الدموية مش في نسيج الكلية.
      - kind: explain
        page: 491
        title: "ليه دايمًا ascites؟"
        quote: "HRS always develops in the setting of advance circulatory dysfunction and it is always accompanied by ascites"
        text: |
          الكتاب بيقول الـ HRS ==always develops in the setting of advance circulatory dysfunction== و ==always accompanied by ascites==.

          التفسير المقبول (مش في الكتاب) للسلسلة:
          1. الـ portal hypertension بتعمل **splanchnic vasodilation** (nitric oxide).
          2. الدم بيتجمع في البطن، فالـ **effective arterial volume** يقل.
          3. الجسم يشغّل الـ **RAAS** والـ **sympathetic** والـ **ADH**.
          4. نفس الحاجات دي بتحبس ملح ومية (فالـ ascites تزيد) **وبتقفل** شرايين الكلية.

          يعني الـ ascites والـ HRS **نتيجتين لنفس المرحلة**. ولو مفيش ascites، الدورة الدموية لسه موصلتش للدرجة دي، فدوّر على سبب تاني.
      - kind: table
        page: 491
        quote: "Box 1: New diagnostic criteria for HRS-AKI.\nDiagnostic criteria:\n  Cirrhosis; acute liver failure; acute-on-chronic liver failure\n  Increase in serum creatinine ≥0.3 mg/dl within 48 h or ≥50% from baseline value according to ICA consensus document and/or Urinary output ≤0.5 ml/kg B.W. ≥6 h*\n  No full or partial response, according to the ICA consensus document, after at least 2 days of diuretic withdrawal and volume expansion with albumin. The recommended dose of albumin is 1 g/kg of body weight per day to a maximum of 100 g/day\n  Absence of shock\n  No current or recent treatment with nephrotoxic drugs\n  Absence of parenchymal disease as indicated by proteinuria >500 mg/day, microhaematuria (>50 red blood cells per high power field), urinary injury biomarkers (if available) and/or abnormal renal ultrasonography**.\n  Suggestion of renal vasoconstriction with FENa of <0.2% (with levels <0.1% being highly predictive)\n*The evaluation of this parameter requires a urinary catheter. **This criterion would not be included in cases of known pre-existing structural chronic kidney disease (e.g. diabetic or hypertensive nephropathy). AKI, acute kidney injury; FENa, fractional excretion of sodium; HRS, hepatorenal syndrome; ICA, International Club of Ascites."
        title: "معايير HRS-AKI"
        columns: [Criterion, Detail]
        rows:
          - [Liver, "Cirrhosis, ALF or ACLF"]
          - [Creatinine, "↑ ≥0.3 mg/dL in 48 h or ≥50%"]
          - [Albumin challenge, "No response after 2 days, 1 g/kg/day (max 100 g)"]
          - [Exclude, "Shock, nephrotoxins"]
          - [No parenchymal disease, "Protein <500 mg/d, RBC <50/HPF, normal US"]
          - [FENa, "<0.2% (<0.1% highly predictive)"]
        hide: [[1, 1], [2, 1], [4, 1], [5, 1]]
      - kind: reveal
        page: 491
        quote: "Box 1: New diagnostic criteria for HRS-AKI.\nDiagnostic criteria:\n  Cirrhosis; acute liver failure; acute-on-chronic liver failure\n  Increase in serum creatinine ≥0.3 mg/dl within 48 h or ≥50% from baseline value according to ICA consensus document and/or Urinary output ≤0.5 ml/kg B.W. ≥6 h*\n  No full or partial response, according to the ICA consensus document, after at least 2 days of diuretic withdrawal and volume expansion with albumin. The recommended dose of albumin is 1 g/kg of body weight per day to a maximum of 100 g/day\n  Absence of shock\n  No current or recent treatment with nephrotoxic drugs\n  Absence of parenchymal disease as indicated by proteinuria >500 mg/day, microhaematuria (>50 red blood cells per high power field), urinary injury biomarkers (if available) and/or abnormal renal ultrasonography**.\n  Suggestion of renal vasoconstriction with FENa of <0.2% (with levels <0.1% being highly predictive)\n*The evaluation of this parameter requires a urinary catheter. **This criterion would not be included in cases of known pre-existing structural chronic kidney disease (e.g. diabetic or hypertensive nephropathy). AKI, acute kidney injury; FENa, fractional excretion of sodium; HRS, hepatorenal syndrome; ICA, International Club of Ascites."
        prompt: "ليه معايير HRS-AKI بتشترط إنك توقف الـ diuretics وتدي albumin يومين الأول؟ وليه مفيش proteinuria ولا hematuria؟"
        answer: |
          كل شرط بيستبعد حاجة (التفسير المقبول، مش في الكتاب، والأرقام من Box 1):

          - **Albumin 1 g/kg/day (max 100 g) يومين** مع وقف الـ diuretics: عشان تستبعد **prerenal** عادي. لو الكلية رجعت، ده كان نقص سوايل مش HRS.
          - **Absence of shock**: الـ shock بيعمل **ATN**.
          - **مفيش nephrotoxins** حديثًا: برضه ATN.
          - **Proteinuria <500 mg/day، RBC <50/HPF، ultrasound طبيعي**: عشان تستبعد **parenchymal** disease. الـ HRS **functional**، فالبول المفروض نضيف.
          - **FENa <0.2%** (و <0.1% highly predictive): الكلية **قافلة على الصوديوم** لأنها فاكرة إن الجسم ناشف.
      - kind: explain
        page: 492
        title: "القديم والجديد: HRS-1 بقى HRS-AKI"
        quote: "Hepatorenal syndrome\n| Old | New | Criteria |\n| HRS-1 | HRS-AKI | ↑ in sCr ≥0.3 mg/dl (≥26.5µmol/L) in 48h; or ↑ ≥50% in 3 months; No response after volume expansion with albumin 1g/kg/d x48H; Cirrhosis with ascites; Absence of shock; No current or recent use of nephrotoxic drugs (diuretics, NSAIDs); Absence of parenchymal kidney disease: No Proteinuria (>500 mg/d), No Hematuria (>50 RBC/HPF), Normal kidney ultrasonography |\n| HRS-2 | HRS-NAKI: HRS-AKD | ↑ in sCr < 50% in 3 months; eGFR < 60 ml/min/1.73 m2; No other cause of kidney disease; Cirrhosis with ascites |\n| HRS-2 | HRS-NAKI: HRS-CKD | eGFR < 60 ml/min/1.73 m2; No other cause of kidney disease; Cirrhosis with ascites |"
        text: |
          الكتاب بيدّيك الأسماء الجديدة:

          - **HRS-1 → HRS-AKI:** creatinine ↑ **≥0.3** في 48 ساعة أو **≥50%** في 3 شهور، ومفيش response للـ albumin.
          - **HRS-2 → HRS-NAKI**، واتقسم:
            - **HRS-AKD:** creatinine ↑ **<50%** في 3 شهور و eGFR <60.
            - **HRS-CKD:** eGFR <60 من غير سبب تاني.

          ليه اتغيّرت؟ التفسير المقبول (مش في الكتاب): الاسم القديم كان مستني الـ creatinine يوصل رقم ثابت (2.5)، فالعلاج كان بيتأخر. الجديد ماشي على تعريف الـ AKI العادي، فتبدأ بدري.
      - kind: explain
        page: 492
        title: "العلاج"
        quote: "Terlipressin is the most investigated vasoconstrictor in this field."
        text: |
          1. وقّف **diuretics** و **β-blockers** و non-steroidal anti-inflammatory drugs (NSAIDs) و nephrotoxins.
          2. ==Terlipressin + albumin== بأسرع وقت:
             - Boluses **0.5-1 mg/4-6 h** لحد **2 mg/4 h**، أو infusion **2→12 mg/day**.
             - Albumin **20-40 g/day**.
          3. كمّل لحد ما الـ creatinine يرجع **في حدود 0.3** من الـ baseline؛ لو مفيش response وقّف خلال **14 يوم**.
          4. **Liver transplant** هو الأمثل.

          ليه 14 يوم؟ التفسير المقبول (مش في الكتاب): لو الدوا ماشتغلش في أسبوعين، مش هيشتغل، والـ terlipressin له أعراض (ischemia و respiratory) فمفيش داعي تكمّل.
      - kind: explain
        page: 492
        title: "ليه كل خطوة في العلاج؟"
        quote: "In patients taking diuretics and/or b-blockers these should be discontinued."
        text: |
          - **وقّف diuretics و β-blockers:** الـ diuretics بتسحب سوايل من دورة دموية فاضية أصلًا. التفسير المقبول (مش في الكتاب): والـ β-blockers بتقلل الـ cardiac output اللي الكلية محتاجاه.
          - **وقّف vasodilators و NSAIDs و nephrotoxins:** التفسير المقبول (مش في الكتاب): الـ NSAIDs بتشيل الـ prostaglandins اللي كانت فاتحة الـ afferent، والـ vasodilators بتزوّد المشكلة الأصلية.
          - **Volume** على قد السبب.
          - **Terlipressin + albumin** ==as soon as possible==. الـ terlipressin بيقفل الـ **splanchnic** vessels فالدم يرجع للدورة، والـ albumin بيملا الأوعية.

          الكتاب بيقول التوليفة دي ==more effective than albumin alone== في 2 pilot و 3 RCTs.
      - kind: explain
        page: 493
        title: "الـ albumin مش بس بروتين بيشد مية"
        quote: "Now, there is increasing experimental and clinical evidence that the increase in systemic vascular resistance and CO due to albumin are mainly related to the non-oncotic properties of the molecule and particularly to its capacity to exert anti-oxidant and anti-inflammatory actions."
        text: |
          الـ albumin ==crucial for the effectiveness== وبيحافظ على الـ **cardiac output** حتى في المراحل المتأخرة. الجرعة **20-40 g/day** على حسب الـ **CVP** عشان ==avoid circulatory overload==.

          والجديد: الفايدة جاية أساسًا من ==non-oncotic properties== (anti-oxidant و anti-inflammatory).

          والمقارنات:
          - **Terlipressin + albumin** أحسن من **midodrine + octreotide + albumin**.
          - **Terlipressin** أحسن من **noradrenaline** في الـ **ACLF**، لأن الـ noradrenaline **has no effect on portal pressure** ولا على الـ inducible NOS.
          - الـ noradrenaline أرخص، بس محتاج **central line** ومتابعة مستمرة، فمينفعش برا الـ ICU.

          والمدة: لحد ما الـ creatinine يوصل **في حدود 0.3** من الـ baseline. ولو مفيش response أو partial: وقّف خلال **14 يوم**.

          إزاي تختار عمليًا (التفسير المقبول، مش في الكتاب)؟ في عنبر عادي من غير central line: terlipressin + albumin. في الـ ICU ومعاك central line والـ terlipressin مش متاح: noradrenaline بديل أرخص. وفي الحالتين راقب الرئة والسوايل كل يوم، لأن الـ albumin والـ vasoconstrictor مع بعض ممكن يغرّقوا مريض قلبه تعبان.
      - kind: check
        page: 493
        quote: "In a recent randomised trial, terlipressin was shown to be more effective than noradrenaline in the treatment of HRS in patients with ACLF;this is probably related to the fact that noradrenaline, unlike terlipressin, has no effect on portal pressure or on the expression of inducible NOS."
        question: "Why is noradrenaline less practical than terlipressin for HRS on a general ward?"
        options:
          - "It needs a central line and continuous ICU monitoring"
          - "It is more expensive"
          - "It cannot be given with albumin"
          - "It raises portal pressure"
        answer: 0
        why:
          - "صح: أرخص بس محتاج central line و intensive care unit (ICU)."
          - "بالعكس، أرخص."
          - "بيتدي مع albumin."
          - "مالوش تأثير على الـ portal pressure، وده من أسباب إنه أضعف في acute-on-chronic liver failure (ACLF)."
      - kind: update
        page: 492
        quote: "Terlipressin can be administered both as intravenous boluses (starting from 0.5-1 mg every 4-6 h to a maximum dose of 2 mg every 4 h) and as continuous intravenous infusions (starting from 2 mg/day to maximum dose of 12 mg/day)."
        text: "الكتاب إدّى الجرعات من غير تحذير، بس الـ terlipressin عليه **boxed warning** من الـ CONFIRM trial: ==respiratory failure== ممكن تبقى fatal. قِيس الـ oxygen saturation by pulse oximetry (SpO2) قبل ما تبدأ وتابعه، ومتبدأش لو أقل من **90%**. الـ volume overload والـ acute-on-chronic liver failure (ACLF) grade 3 بيزوّدوا الخطر، فلو ظهر fluid overload قلّل أو وقّف الـ albumin. واللي الـ creatinine عنده **≥5 mg/dL** غالبًا مش هيستفيد. في الامتحان اكتب جرعات الكتاب."
        ref: "Terlivaz (terlipressin) prescribing information 2022, boxed warning; CONFIRM trial, NEJM 2021"
      - kind: explain
        page: 494
        title: "الحل الحقيقي: كبد جديد"
        quote: "LT represents the optimal treatment for patients with HRS-AKI regardless of their response to phar-macological treatment."
        text: |
          الـ **liver transplant (LT)** هو ==the optimal treatment== ==regardless of their response== للأدوية. ليه؟ لأن الـ HRS **functional**: المشكلة في الكبد والدورة الدموية، فلما الكبد يتصلّح الكلية ترجع.

          طب ليه أحيانًا **simultaneous liver-kidney (SLK)**؟ الكتاب بيقول القرار مش بس عشان الوفيات بعد الزرع، لكن كمان عشان ==the lack of renal recovery== اللي بيزوّد الوفيات. يعني لو الكلية قعدت مقفولة كتير، ممكن متتصلحش.

          وفي أمريكا فيه **listing policy** للـ SLK على أساس: **مدة الـ AKI**، **محتاج dialysis**، و **دليل على CKD**.
      - kind: try
