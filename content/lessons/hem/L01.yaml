      - kind: explain
        page: 1
        title: "ليه المصنع بيعزّل كذا مرة؟"
        quote: "The production of blood cells (hematopoiesis) begins in the yolk sac of the 14-19 day human embryo. The fetal liver becomes the main site of hematopoiesis in the second trimester of pregnancy and the fetal bone marrow starts blood cell production in the third trimester. After birth, the marrow is the sole site of hematopoiesis in healthy individuals."
        text: |
          الكتاب بيدّيك الترتيب: **yolk sac**، بعدين **fetal liver**، بعدين **bone marrow**. الـ "ليه" مش مكتوبة فيه، والتفسير المقبول (مش في الكتاب) بسيط: الدم بيتعمل في **أول مكان جاهز** يستضيفه.

          - **Yolk sac** (يوم 14–19): الجنين لسه ما عندوش أعضاء، ومحتاج خلايا تشيل oxygen من بدري، فالـ yolk sac هو اللي موجود.
          - **Fetal liver** (==second trimester==): الكبد من أول الأعضاء الكبيرة اللي بتتكوّن، وغني بالأوعية، فبيشيل الشغلانة لحد ما العضم يجهز.
          - **Bone marrow** (third trimester): تجاويف النخاع مش بتتفتح غير لما العضم يتكلّس، فهو آخر واحد يستلم، وبعد الولادة بيبقى ==the sole site==.

          خلّي بالك من النقطة دي: الكبد والطحال اشتغلوا مصنع قبل كده، وده اللي هيخليهم يرجعوا يشتغلوا في الـ **extramedullary haematopoiesis** آخر المحاضرة.
      - kind: check
        page: 1
        quote: "The fetal liver becomes the main site of hematopoiesis in the second trimester of pregnancy and the fetal bone marrow starts blood cell production in the third trimester."
        question: "What is the main site of haematopoiesis in the second trimester?"
        options:
          - "Fetal liver"
          - "Yolk sac"
          - "Fetal bone marrow"
          - "Thymus"
        answer: 0
        why:
          - "صح: الـ fetal liver هو المصنع الرئيسي في الـ second trimester."
          - "الـ yolk sac بيبدأ بدري خالص، يوم 14–19 من عمر الجنين."
          - "الـ fetal marrow بيبدأ في الـ third trimester."
          - "الـ thymus بيدرّب الـ T cells، مش المصنع الرئيسي للدم."
      - kind: explain
        page: 1
        title: "الـ red marrow بتنكمش وانت بتكبر"
        quote: "After birth, the marrow is the sole site of hematopoiesis in healthy individuals. During the first 4 years of life, nearly all the marrow cavities contain red hemopoietic marrow with very few fat cells."
        text: |
          في أول ==4 سنين== تقريبًا كل تجاويف النخاع **red marrow** (شغالة)، والدهن قليل جدًا.

          بالتدريج الدهن بياخد مكانها. وعلى ==18 سنة== يفضل الشغل في:
          - الـ **axial skeleton** (الحوض، الفقرات، الضلوع، القص، الجمجمة)
          - **الطرف القريب** من الـ femur والـ humerus

          وباقي التجاويف **yellow fatty marrow**. يعني لما تيجي تبزل نخاع واحد كبير، لازم تروح للأماكن اللي لسه حمرا.
      - kind: reveal
        page: 1
        quote: "By the age of 18 years, the only sites of active hematopoiesis are the axial skeleton and the proximal ends of the shafts of the femur and humerus. All the remaining marrow cavities contain yellow fatty marrow."
        prompt: "ليه في الكبار بنعمل الـ bone marrow aspirate من الـ iliac crest أو الـ sternum، مش من عضمة الرجل؟"
        answer: "لأن بعد 18 سنة الـ **active marrow** في الـ **axial skeleton** بس (والطرف القريب للفخد والعضد). عضمة الرجل في الكبير مليانة **yellow fat**، هتسحب دهن مش خلايا."
      - kind: reveal
        page: 1
        quote: "By the age of 18 years, the only sites of active hematopoiesis are the axial skeleton and the proximal ends of the shafts of the femur and humerus. All the remaining marrow cavities contain yellow fatty marrow."
        prompt: "طب ليه الـ red marrow بتنكمش مع السن، والـ yellow marrow بتعمل إيه؟"
        answer: |
          التفسير المقبول (مش في الكتاب): العضم بيكبر أسرع بكتير من احتياج الجسم للدم، فمش محتاجين كل التجاويف شغالة، والدهن بيملى الفاضي. عشان كده على 18 سنة يفضل الـ **axial skeleton** وأول الـ **femur** والـ **humerus** بس.

          بس الـ **yellow fatty marrow** مش ميتة: هي **احتياطي**. لو الجسم احتاج دم أكتر (haemolysis شديد مثلًا) ممكن تحمرّ تاني وترجع تشتغل.
      - kind: aside
        tone: joke
        page: 1
        quote: "By the age of 18 years, the only sites of active hematopoiesis are the axial skeleton and the proximal ends of the shafts of the femur and humerus. All the remaining marrow cavities contain yellow fatty marrow."
        text: "الـ marrow زي أي مصري بعد الأربعين: الدهون بتزحف على الأطراف الأول. 😄 بس النخاع على الأقل بيسيب الحوض والضهر شغالين."
      - kind: try
        items: [hem.L01.002, hem.L01.004, hem.L01.006, hem.L01.008, hem.L01.009]
    recap:
      - "Haematopoiesis = تصنيع وتمايز ونمو خلايا الدم؛ النظام = marrow, liver, spleen, lymph nodes, thymus."
      - "Yolk sac (يوم 14–19) ← fetal liver (2nd trimester) ← fetal marrow (3rd trimester): الدم بيتعمل في أول مكان جاهز."
      - "بعد الولادة النخاع لوحده؛ أول 4 سنين كله red."
      - "على 18 سنة: axial skeleton + proximal femur و humerus بس؛ الباقي yellow marrow احتياطي."
    practice: [hem.L01.001, hem.L01.002, hem.L01.003, hem.L01.004, hem.L01.005, hem.L01.006, hem.L01.007, hem.L01.008, hem.L01.009]
