    src: { page: 450, quote: "Suspicion of disease flare\n  Testing panel: Serum creatinine and eGFR; Urinalysis (dipstick and sediment); Spot protein–creatinine ratio (PCR); Serology (anti-dsDNA and complement)\n    Is there evidence of abnormal proteinuria or urine sediment: Abnormal proteinuria assessed by dipstick protein ≥2+ (any level of specific gravity), dipstick protein 1+ (low specific gravity), or spot PCR >500 mg/g (50 mg/mmol); Urine sediment positive for acanthocytes (≥5%), red blood cell casts or white blood cell casts\n      No → No further urine testing at this time\n      Yes → Quantify proteinuria → Is 24-hour proteinuria ≥500 mg/d?\n    Is there evidence of decreased or decreasing GFR: For example, abnormal eGFR that is below the expected level based on age and clinical history, or decreasing eGFR, with no attributable cause other than systemic lupus erythematosus\n      No → No further kidney function testing at this time\n      Yes → Repeat testing" }
    status: unverified
