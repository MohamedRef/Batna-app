      - "Resistance: **~70% fixed** (fibrosis، nodules، thrombosis) + **~30% dynamic** (HSCs، smooth muscle، myofibroblasts)، والـ dynamic بس هو اللي الدوا يقدر عليه."
      - "جوه الكبد: constrictors ↑ (endothelin، angiotensin، norepinephrine، vasopressin، leukotrienes، thromboxane) و NO/CO مش كفاية."
      - "برّه: glucagon، endocannabinoids، NO، prostacyclin، CO + angiogenesis (VEGF) → splanchnic vasodilation → ↑ inflow."
      - "Vasodilation → ↓ effective volume → RAAS → Na/water retention → hyperdynamic → inflow أكتر. النتيجة: varices، ascites، encephalopathy."
