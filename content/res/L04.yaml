  # --- Descriptive studies (slides 16-17) ---
  - id: res.L04.016
    kind: card
    topic: descriptive
    front: Three features of a descriptive study?
    back: No testing of a causal hypothesis, no comparison group, and it can generate a hypothesis.
    src: { page: 16, quote: "Descriptive studies:\n  No testing of a causal hypothesis\n  No Comparison Group\n  Can generate a hypothesis" }
    status: unverified
