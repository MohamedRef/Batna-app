lessons:
  # ------------------------------------------------------------------
  - id: neph.L01.lesson1
    title: "الـ ABG: العينة، الأرقام، وROME"
    hook: "ورقة الـ ABG فيها 6 أرقام. لو عرفت تقرا اتنين صح، نص الشغل خلص."
    minutes: 8
    pages: [1, 5]
    topics: [sampling, normals, henderson]
    goals:
      - "تعرف أشهر أخطاء العينة وإمتى الـ venous ينفع"
      - "تحفظ الأرقام الطبيعية وتستخدم ROME"
      - "تتأكد إن الـ pH حقيقي بالـ Henderson equation"
    status: unverified
    steps:
      - kind: explain
        page: 1
        quote: "ABG measurements are particularly vulnerable to preanalytic errors."
        title: "الغلط بيحصل قبل الجهاز"
        text: |
          الـ ==ABG== أساسي في أي مريض high-risk أو في الـ ICU: بيقولك الـ **oxygenation** والـ **acid–base balance** مع بعض، وبيقولك العلاج ماشي ولا لأ.

          بس النتيجة بتتبوظ غالبًا **قبل** ما العينة توصل الجهاز (==preanalytic errors==):

          - عينة **مش arterial**
          - **air bubbles** في السرنجة
          - **anticoagulant** قليل أو كتير
          - **تأخير** في التحليل
      - kind: aside
        page: 1
        quote: "Correct method of mixing of the arterial sample with the anticoagulant in two dimensions to prevent stacking of red blood cells."
        tone: tip
        text: "قلّب السرنجة مع الـ anticoagulant في **اتجاهين** (two dimensions) علشان الـ RBCs متترصّش فوق بعض. زي ما بتقلّب كوباية العصير، مش بترجّها لفوق وتحت بس."
      - kind: check
        page: 1
        quote: "The most common problems that are encountered include nonarterial samples, air bubbles in the sample"
        question: "Which of these is NOT one of the common ABG sampling problems in the lecture?"
        options:
          - "Measuring the sample within minutes"
          - "Air bubbles in the syringe"
          - "Excessive anticoagulant"
          - "A venous instead of arterial sample"
        answer: 0
        why:
          - "صح: التحليل **السريع** هو الصح؛ المشكلة هي الـ **delayed analysis**."
          - "دي من المشاكل الأربعة."
          - "الـ anticoagulant الكتير أو القليل غلط."
          - "الـ nonarterial sample أول مشكلة في القايمة."
      - kind: explain
        page: 2
        quote: "an arterial ABG is useful in assessing pulmonary gas exchange, and central venous ABG is useful in assessing pH and tissue oxygenation."
        title: "Arterial ولا venous؟"
        text: |
          في الشخص الطبيعي الفرق صغير، فالـ venous ينفع. الفرق الطبيعي تقريبًا:

          - **pH**: 7.40 arterial مقابل 7.36 venous
          - **pCO2**: 40 مقابل 48
          - **HCO3**: 24 مقابل 26

          لكن في ==low cardiac output== على ventilator: الـ arterial pCO2 طبيعي والـ central venous pCO2 ممكن يبقى عالي جدًا، لأن الدم ماشي بالراحة في الأنسجة وبيلم CO2 أكتر.

          - الـ **arterial**: بيقيس الـ pulmonary gas exchange
          - الـ **central venous**: بيقيس الـ pH والـ tissue oxygenation
      - kind: table
        page: 3
        quote: "Normal Acid Base values"
        title: "الأرقام الطبيعية (احفظها زي رقم تليفونك)"
        columns: [Parameter, Normal]
        rows:
          - ["pH", "7.35–7.45"]
          - ["paCO2", "35–45 mmHg"]
          - ["paO2", "80–100 mmHg"]
          - ["HCO3", "22–26 mEq/L"]
          - ["BE/BD", "−2 to +2"]
          - ["SpO2", "> 95%"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: mnemonic
        page: 3
        quote: "Acid-Base Mnemonic—ROME"
        word: "ROME"
        parts:
          - { key: "R", text: "Respiratory" }
          - { key: "O", text: "Opposite: pH and PaCO2 move in opposite directions" }
          - { key: "M", text: "Metabolic" }
          - { key: "E", text: "Equal: pH and HCO3 move in the same direction" }
        hook: "**كل الطرق تؤدي إلى روما**، وكل الـ ABG بيبدأ بـ ROME. 😄"
      - kind: figure
        page: 3
        quote: "Respiratory Opposite – pH ↑ PaCO2 ↓ Alkalosis – pH ↓ PaCO2 ↑ Acidosis"
        title: "ROME بالأسهم"
        alt: "Two panels. Respiratory: pH arrow up with PaCO2 arrow down means alkalosis; pH down with PaCO2 up means acidosis. Metabolic: pH and HCO3 both up means alkalosis; both down means acidosis."
        caption: "**Respiratory = Opposite**: الـ pH عكس الـ PaCO2. **Metabolic = Equal**: الـ pH مع الـ HCO3 في نفس الاتجاه."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="N1a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
              <marker id="N1b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
            </defs>
            <rect x="10" y="10" width="310" height="110" rx="10" class="fg-acc"/>
            <text x="165" y="32" text-anchor="middle" class="t-b">Respiratory = Opposite</text>
            <text x="40" y="62" class="t-sm">pH</text>
            <line x1="70" y1="70" x2="70" y2="46" class="fg-arrow-acc" marker-end="url(#N1a)"/>
            <text x="90" y="62" class="t-sm">PaCO2</text>
            <line x1="140" y1="46" x2="140" y2="70" class="fg-arrow-acc" marker-end="url(#N1a)"/>
            <text x="170" y="62" class="t-sm t-good">Alkalosis</text>
            <text x="40" y="102" class="t-sm">pH</text>
            <line x1="70" y1="86" x2="70" y2="110" class="fg-arrow-bad" marker-end="url(#N1b)"/>
            <text x="90" y="102" class="t-sm">PaCO2</text>
            <line x1="140" y1="110" x2="140" y2="86" class="fg-arrow-bad" marker-end="url(#N1b)"/>
            <text x="170" y="102" class="t-sm t-bad">Acidosis</text>
            <rect x="10" y="130" width="310" height="110" rx="10" class="fg-good"/>
            <text x="165" y="152" text-anchor="middle" class="t-b">Metabolic = Equal</text>
            <text x="40" y="182" class="t-sm">pH</text>
            <line x1="70" y1="190" x2="70" y2="166" class="fg-arrow-acc" marker-end="url(#N1a)"/>
            <text x="90" y="182" class="t-sm">HCO3</text>
            <line x1="140" y1="190" x2="140" y2="166" class="fg-arrow-acc" marker-end="url(#N1a)"/>
            <text x="170" y="182" class="t-sm t-good">Alkalosis</text>
            <text x="40" y="222" class="t-sm">pH</text>
            <line x1="70" y1="206" x2="70" y2="230" class="fg-arrow-bad" marker-end="url(#N1b)"/>
            <text x="90" y="222" class="t-sm">HCO3</text>
            <line x1="140" y1="206" x2="140" y2="230" class="fg-arrow-bad" marker-end="url(#N1b)"/>
            <text x="170" y="222" class="t-sm t-bad">Acidosis</text>
          </svg>
      - kind: check
        page: 3
        quote: "Metabolic Equal – pH ↑ HCO3 ↑ Alkalosis – pH ↓ HCO3 ↓ Acidosis"
        question: "pH 7.30, PaCO2 30 mmHg, HCO3 14 mEq/L. Primary disorder?"
        options:
          - "Metabolic acidosis"
          - "Respiratory acidosis"
          - "Respiratory alkalosis"
          - "Metabolic alkalosis"
        answer: 0
        why:
          - "صح: الـ pH والـ HCO3 الاتنين نازلين = **Equal** = metabolic. والـ PaCO2 النازل ده الـ compensation."
          - "الـ respiratory acidosis محتاج PaCO2 **عالي**."
          - "الـ pH واطي، يبقى acidosis."
          - "الـ pH واطي، مش alkalosis."
      - kind: explain
        page: 3
        quote: "Three concepts that help you evaluate the acid–base disorders are: Henderson equation The anion gap The secondary physiologic response (compensation)"
        title: "تلات أدوات بس"
        text: |
          المحاضرة كلها مبنية على تلات أدوات:

          1. ==Henderson equation==: النتيجة دي حقيقية؟
          2. **Anion gap**: الـ metabolic acidosis دي نوعها إيه؟
          3. **Secondary physiologic response** (compensation): فيه مشكلة تانية مستخبية؟
      - kind: explain
        page: 4
        quote: "The Henderson equation is thus used clinically to check the validity of pH obtained from the clinical laboratory."
        title: "Henderson: كشف الكذب على الـ pH"
        text: |
          الـ Henderson–Hasselbalch فيها log وتعب. الـ ==Henderson equation== بتديك نفس المعلومة من غير log:

          - **[H+] (nmol/L) = 24 × pCO2 / HCO3**

          مثال الكتاب: pCO2 40 و HCO3 24 يدّوا H+ = 24 × 40/24 = **40**، وده بالظبط pH **7.40**.

          استخدامها في الواقع: تتأكد إن الـ **pH اللي طالع من المعمل valid**. لو الحسبة مش ماشية مع الـ pH، العينة أو الجهاز فيهم حاجة.
      - kind: table
        page: 4
        quote: "pH 7.50 = 30 pH 7.40 = 40 pH 7.30 = 50 pH 7.20 = 60 pH 7.10 = 80 pH 7.00 = 100"
        title: "الـ pH وما يقابله من H+"
        columns: ["pH", "[H+] nmol/L"]
        rows:
          - ["7.50", "30"]
          - ["7.40", "40"]
          - ["7.30", "50"]
          - ["7.20", "60"]
          - ["7.10", "80"]
          - ["7.00", "100"]
        hide: [[2, 1], [3, 1], [5, 1]]
      - kind: aside
        page: 4
        quote: "Last 2 digits of pH= 80 - H+"
        tone: exam
        text: "**Shortcut**: آخر رقمين في الـ pH ≈ **80 − H+**. يعني H+ = 40 يدّي 80 − 40 = 40، أي pH 7.40. شغّالة كويس في النص (7.20 لـ 7.50)."
      - kind: reveal
        page: 4
        quote: "The Henderson equation is thus used clinically to check the validity of pH obtained from the clinical laboratory."
        prompt: "المعمل كاتب pH 7.40، و pCO2 60، و HCO3 24. تصدّق؟"
        answer: "لأ. H+ = 24 × 60 / 24 = **60 nmol/L**، وده يقابل pH حوالي **7.20** مش 7.40. النتيجة مش valid: كرر العينة."
      - kind: try
        items: [neph.L01.004, neph.L01.011, neph.L01.014, neph.L01.018, neph.L01.020]
    recap:
      - "أخطاء الـ ABG غالبًا preanalytic: nonarterial، air bubbles، anticoagulant، تأخير."
      - "الـ venous قريب من الـ arterial في الطبيعي، ويبعد في الـ low cardiac output."
      - "pH 7.35–7.45، pCO2 35–45، HCO3 22–26."
      - "ROME: Respiratory Opposite، Metabolic Equal."
      - "H+ = 24 × pCO2/HCO3؛ 40 = 7.40؛ آخر رقمين ≈ 80 − H+."
    practice: [neph.L01.001, neph.L01.002, neph.L01.003, neph.L01.004, neph.L01.005, neph.L01.006, neph.L01.007, neph.L01.008, neph.L01.009, neph.L01.010, neph.L01.011, neph.L01.012, neph.L01.013, neph.L01.014, neph.L01.015, neph.L01.016, neph.L01.017, neph.L01.018, neph.L01.019, neph.L01.020, neph.L01.021, neph.L01.022, neph.L01.123, neph.L01.124, neph.L01.125, neph.L01.126]
  # ------------------------------------------------------------------
  - id: neph.L01.lesson2
    title: "الـ anion gap: الأنيونات اللي محدش بيقيسها"
    hook: "المعمل بيقيس 4 أملاح بس. الباقي بنعرفه بالطرح، وده اللي بيفرق DKA عن الإسهال."
    minutes: 10
    pages: [5, 15]
    topics: [anion-gap]
    goals:
      - "تحسب الـ AG وتعرف الطبيعي"
      - "تعرف تستخدم الـ measured Na في الـ hyperglycemia"
      - "تفرق high و normal و low AG بأسبابهم"
    status: unverified
    steps:
      - kind: explain
        page: 5
        quote: "plasma [Na+] exceeds the sum of plasma [Cl−] and [HCO3−], and the difference is called the anion gap (AG)."
        title: "فكرة الـ gap"
        text: |
          الدم لازم يبقى **electroneutral**: الموجب = السالب. بس المعمل بيقيس **Na+ و K+ و Cl− و HCO3−** بس.

          الـ Na+ دايمًا أكبر من Cl− + HCO3−، والفرق ده هو ==anion gap==:

          - **AG = Na+ − (Cl− + HCO3−)**

          والـ K+ مش بندخله لأن تغيّره في الصحة والمرض صغير.
      - kind: figure
        page: 6
        quote: "Unmeasured cations (mEq/L); Unmeasured anions (mEq/L)"
        title: "الـ gap شكله إيه"
        alt: "Two stacked columns. Cations: Na+ with a small block of unmeasured cations (K, Ca, Mg, total 11). Anions: Cl-, HCO3-, and unmeasured anions (albumin 12, other proteins 3, phosphate 2, sulfate 1, organic acids 5, total 23). The gap equals 23 minus 11, about 12."
        caption: "العمودين لازم يبقوا نفس الطول. الـ **gap** = unmeasured anions (23) − unmeasured cations (11) ≈ **12 ± 4**. وأكبر حتة فيه: **albumin 12**."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <text x="90" y="20" text-anchor="middle" class="t-b">Cations</text>
            <text x="240" y="20" text-anchor="middle" class="t-b">Anions</text>
            <rect x="40" y="30" width="100" height="215" class="fg-acc"/>
            <text x="90" y="140" text-anchor="middle" class="t-b">Na+</text>
            <rect x="40" y="245" width="100" height="30" class="fg-thin"/>
            <text x="90" y="265" text-anchor="middle" class="t-sm">K Ca Mg 11</text>
            <rect x="190" y="30" width="100" height="145" class="fg-good"/>
            <text x="240" y="105" text-anchor="middle" class="t-b">Cl-</text>
            <rect x="190" y="175" width="100" height="45" class="fg-good"/>
            <text x="240" y="202" text-anchor="middle" class="t-b">HCO3-</text>
            <rect x="190" y="220" width="100" height="55" class="fg-bad"/>
            <text x="240" y="240" text-anchor="middle" class="t-sm">Unmeasured 23</text>
            <text x="240" y="258" text-anchor="middle" class="t-sm">albumin 12</text>
            <line x1="150" y1="220" x2="180" y2="220" class="fg-thin"/>
            <line x1="150" y1="245" x2="180" y2="245" class="fg-thin"/>
            <text x="165" y="292" text-anchor="middle" class="t-sm t-bad">AG = 23 - 11 = 12</text>
          </svg>
      - kind: explain
        page: 6
        quote: "Lactic acid ->H* + Lactate’"
        title: "ليه الـ lactic acid بيرفع الـ gap؟"
        text: |
          الـ lactic acid بيتفكك لـ **H+** و ==lactate== (anion مش بيتقاس).

          الـ H+ بيتعادل بالـ bicarbonate: **NaHCO3 + H+ → Na+ + CO2 + H2O**، فالـ HCO3 يقل. والـ lactate ياخد مكانه في عمود الأنيونات من غير ما حد يقيسه، فالـ **gap يكبر**.
      - kind: explain
        page: 7
        quote: "With the introduction of ion-selective electrode methodology, the normal AG levels are much lower, ranging from 3 to11."
        title: "الطبيعي كام؟"
        text: |
          - الرقم الكلاسيكي ==12 ± 4== جاي من طرق قديمة (colorimetry و flame photometry).
          - بالـ **ion-selective electrodes** الطبيعي أقل: **3 to 11**، لأن الـ Cl بيطلع أعلى.
          - كل معمل وأرقامه، فامشي على أرقام معملك. وللتبسيط المحاضرة بتعتبر **10 mEq/L** طبيعي.
      - kind: explain
        page: 8
        quote: "It is, thus, emphasized that only measured Na+ should be used to calculate the serum AG."
        title: "Hyperglycemia: الفخ المشهور"
        text: |
          في السكر العالي الميه بتخرج من الخلايا وتخفف الـ Na والـ Cl والـ HCO3 **كلهم بنفس النسبة**.

          لو صححت الـ Na لوحده (Na بيقل **1.6** لكل **100 mg/dL** جلوكوز فوق الطبيعي) وسبت الـ Cl والـ HCO3، الـ AG هيطلع أكبر من الحقيقة، وهتشخص high AG acidosis مش موجودة.

          الخلاصة: احسب الـ AG بالـ ==measured Na== بس.
      - kind: aside
        page: 14
        quote: "Corrected Na+ for AG in hyperglycemia"
        tone: trap
        text: "جدول الـ ABG في ص 14 فيه معادلة **corrected Na+ = Na + (glucose − 5)/3** (glucose بالـ mmol/L). الكلام في ص 8 واضح: الـ AG بالـ **measured Na**. لو السؤال قال \"calculate the AG\" استخدم الـ measured."
      - kind: check
        page: 8
        quote: "High AG is due to accumulation of unmeasured anions, whereas normal AG is usually related to high Cl− level."
        question: "A normal AG metabolic acidosis is usually explained by:"
        options:
          - "A high chloride level"
          - "Accumulation of unmeasured anions"
          - "Hypoalbuminemia"
          - "A spurious rise in sodium"
        answer: 0
        why:
          - "صح: لما الـ HCO3 يقل، الـ **Cl يطلع مكانه** فالـ gap ثابت (hyperchloremic)."
          - "ده سبب الـ **high** AG."
          - "دي أشهر سبب للـ **low** AG."
          - "الـ low AG فيه spurious **decrease** في الـ Na، مش زيادة."
      - kind: mnemonic
        page: 9
        quote: "Mnemonic: MUDPILES Methanol Uraemia (renal failure) Diabetic, alcoholic, or starvation ketoacidosis"
        word: "MUDPILES"
        parts:
          - { key: "M", text: "Methanol" }
          - { key: "U", text: "Uraemia (renal failure)" }
          - { key: "D", text: "Diabetic, alcoholic or starvation ketoacidosis" }
          - { key: "P", text: "Paracetamol, propylene glycol, paregoric" }
          - { key: "I", text: "Inborn errors, iron, ibuprofen, isoniazid" }
          - { key: "L", text: "Lactic acid" }
          - { key: "E", text: "Ethylene glycol" }
          - { key: "S", text: "Salicylates (aspirin)" }
        hook: "**MUD PILES**: كومة طين من الأنيونات اللي محدش قاسها. كل واحد فيهم بيرمي anion في الدم."
      - kind: table
        page: 8
        quote: "Most common causes of high AG metabolic acidosis"
        title: "مين الأنيون في كل سبب؟"
        columns: [Cause, Unmeasured anion]
        rows:
          - ["Uremia", "Sulfate, phosphate, urate"]
          - ["Ketoacidosis", "Acetoacetate, β-hydroxybutyrate"]
          - ["Small bowel resection", "D-lactate"]
          - ["Methanol", "Formate"]
          - ["Ethylene glycol", "Glycolate, oxalate"]
          - ["Acetaminophen", "Pyroglutamate"]
        hide: [[2, 1], [3, 1], [5, 1]]
      - kind: mnemonic
        page: 15
        quote: "HARD-ASS Hyperalimentation Addison disease Renal tubular acidosis Diarrhea Acetazolamide Spironolactone"
        word: "HARD-ASS"
        parts:
          - { key: "H", text: "Hyperalimentation" }
          - { key: "A", text: "Addison disease" }
          - { key: "R", text: "Renal tubular acidosis" }
          - { key: "D", text: "Diarrhea" }
          - { key: "A", text: "Acetazolamide" }
          - { key: "S", text: "Spironolactone" }
          - { key: "S", text: "Saline infusion" }
        hook: "الـ normal AG \"دماغه ناشفة\": الـ gap مش بيتحرك، والـ Cl هو اللي بيعلى. 😄"
      - kind: sort
        page: 9
        quote: "Most common causes of normal AG metabolic acidosis"
        prompt: "حط كل سبب في نوع الـ AG بتاعه:"
        bins: ["High AG", "Normal AG", "Low AG"]
        cards:
          - { text: "Ethylene glycol", bin: 0 }
          - { text: "Uremic acidosis", bin: 0 }
          - { text: "Diarrhea", bin: 1 }
          - { text: "Carbonic anhydrase inhibitors", bin: 1 }
          - { text: "Normal saline (dilutional)", bin: 1 }
          - { text: "Cholestyramine", bin: 1 }
          - { text: "Hypoalbuminemia", bin: 2 }
          - { text: "IgG myeloma", bin: 2 }
          - { text: "Lithium toxicity", bin: 2 }
        why: "High AG = أنيون جديد (oxalate، sulfate). Normal AG = HCO3 بيضيع أو Cl بيزيد. Low AG = أنيونات أقل (albumin) أو كاتيونات زيادة (IgG، Li، Ca، Mg)."
      - kind: explain
        page: 9
        quote: "Other than laboratory error, the most common cause of low AG acidosis in hospitalized patients is hypoalbuminemia."
        title: "الـ low AG والـ albumin"
        text: |
          أشهر سبب للـ low AG في المستشفى (غير غلط المعمل): ==hypoalbuminemia==، لأن الـ albumin أكبر unmeasured anion.

          - كل **1 g/dL** albumin تحت الطبيعي = الـ AG يقل **2.5**.
          - من 4.0 لـ 2.0 g/dL = الـ AG يقل **5**.

          وباقي أسباب الـ low AG:

          - **كاتيونات زيادة**: IgG myeloma، hypercalcemia، hypermagnesemia، lithium
          - **بيتقاسوا كأنهم Cl**: bromide و salicylate overdose
          - **Hypertriglyceridemia**: تحليل معملي مختلف
      - kind: case
        page: 9
        quote: "for each gram decrease in albumin from normal value, the AG decreases by 2.5"
        stem: "A septic cirrhotic patient: Na 135, Cl 104, HCO3 22 mEq/L, albumin 2.0 g/dL, lactate high."
        steps:
          - question: "Measured AG?"
            options: ["9", "13", "4", "19"]
            answer: 0
            why: "135 − (104 + 22) = **9**: شكله طبيعي."
          - question: "Albumin-corrected AG?"
            options: ["14", "9", "11.5", "4"]
            answer: 0
            why: "الـ albumin واطي 2 g/dL × 2.5 = 5، فالـ AG المصحح = 9 + 5 = **14**: high AG مستخبي (lactic acidosis)."
      - kind: try
