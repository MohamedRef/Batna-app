  - id: neph.L04.lesson5
    title: "الدرجات، الأسباب الثانوية، والـ refractory"
    hook: "قبل ما تضيف دوا رابع، اسأل: هو فعلًا resistant ولا حد بيضحك عليك؟"
    minutes: 8
    pages: [82, 83]
    topics: [classification, refractory]
    goals:
      - "تصنّف الضغط بالـ BHS وتاخد الفئة الأعلى"
      - "تعد الأسباب الثانوية وتعرف ليه الأدوية دي بترفع الضغط"
      - "تفرّق الـ refractory الحقيقي من الـ pseudoresistance"
    status: unverified
    steps:
      - kind: figure
        page: 82
        quote: "| Category | Systolic blood pressure (mmHg) | Diastolic blood pressure (mmHg) |\n| Blood pressure: Optimal | <120 and | <80 |\n| Normal | 120-129 and/or | <80-84 |\n| High normal | 130-139 and/or | 85-89 |\n| Hypertension: Grade 1 (mild) | 140-159 and/or | 90-99 |\n| Grade 2 (moderate) | 160-179 and/or | 100-109 |\n| Grade 3 (severe) | ≥180 | ≥110 |\n| Isolated systolic hypertension: Grade 1 | 140-149 | <90 |\n| Grade 2 | >160 | <90 |\nThe European Societies of Hypertension and Cardiology Guidelines 2007 are based on clinical blood pressure and not values for ambulatory blood pressure measurement. Threshold blood pressure levels for the diagnosis of hypertension using self/home monitoring are >135/85 mmHg. For ambulatory monitoring, 24-hour values are >125/80 mmHg. If systolic blood pressure and diastolic blood pressure fall into different categories, the higher value should be taken for classification. \"Equivalent to prehypertension."
        title: "سلّم الـ BHS"
        alt: "A vertical BP ladder. Optimal below 120 over 80, normal 120 to 129 over 80 to 84, high normal 130 to 139 over 85 to 89, grade 1 140 to 159 over 90 to 99, grade 2 160 to 179 over 100 to 109, grade 3 at least 180 over at least 110."
