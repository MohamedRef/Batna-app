  - id: dm.L22.lesson4
    title: "الـ statin أكتر من LDL: pleiotropic و JUPITER"
    hook: "ناس الـ LDL بتاعهم طبيعي، أخدوا statin، والـ MI قل للنص. إزاي؟"
    minutes: 8
    pages: [272, 273]
    topics: [pleiotropic, jupiter]
    goals:
      - "تعرف الـ pleiotropic effects وليه الـ statin بيعملها"
      - "تحفظ تصميم JUPITER ونتايجه وتعرف تقرا الـ HR"
    status: unverified
    steps:
      - kind: explain
        remind: [dm.L22.008]
        page: 272
        title: "الـ statin أكتر من مجرد LDL"
        quote: "Pleiotropic effects of statins on the vessel wall\n  ↓ Coagulation\n  ↓ Platelet activation\n  ↑ Endothelial progenitor cells\n  ↑ Endothelial function, ↑ NO bioactivity, ↓ Free radicals\n  ↓ Collagen, ↓ MMPs\n  ↓ Endothelin\n  ↓ AT1 receptor, ↓ Proliferation\n  ↓ Macrophages, ↓ Inflammation, ↓ Immunomodulation\n  ↓ LDL cholesterol, ↑ HDL cholesterol, ↓ Triglycerides\nMMPs = matrix metalloproteinases"
        text: |
          الـ ==pleiotropic effects== هي فوايد الـ statin على جدار الشريان غير نزول الـ low-density lipoprotein (LDL):
          - ↑ **endothelial function** و ↑ **nitric oxide (NO) bioactivity**، ↓ free radicals، ↓ **endothelin**.
          - ↓ macrophages و ↓ **inflammation**.
          - ↓ **platelet activation** و ↓ coagulation.
          - ↑ endothelial progenitor cells.
          - ↓ collagen و ↓ **matrix metalloproteinases (MMPs)**، ↓ Angiotensin II type 1 receptor (AT1) receptor و ↓ proliferation.
          - والدهون: ↓ LDL، ↑ high-density lipoprotein (HDL)، ↓ TG.

          لاحظ: الـ statin بيعكس **تقريبًا كل سهم** في رسمة السكر. ليه؟ التفسير المقبول (مش في الكتاب): الـ statin بيقفل أول خطوة في طريق الـ mevalonate، والطريق ده مش بيعمل كوليسترول بس؛ بيعمل كمان جزيئات صغيرة بتشغّل بروتينات إشارة جوّه خلايا الجدار. قفلها بيرفع الـ NO ويهدّي الالتهاب، فالفوايد الإضافية جاية من **نفس القفلة**.
      - kind: figure
        page: 272
        quote: "Statins: Pleiotropic Effects"
        title: "رسمة الكتاب ص 272: الـ statin على جدار الشريان"
        image: { file: dm/L22-statin-pleiotropic.webp, book: true }
        alt: "A section of the vessel wall labelled Statins in the middle, with yellow arrows radiating to effects. Top: decreased coagulation, decreased platelet activation, increased endothelial progenitor cells. Left: increased endothelial function and NO bioactivity, decreased free radicals; decreased endothelin; decreased macrophages, inflammation and immunomodulation. Right: decreased collagen and MMPs; decreased AT1 receptor and proliferation; decreased LDL cholesterol and triglycerides, increased HDL cholesterol."
        caption: |
          دي الرسمة اللي الـ explain فوق نقل منها. الـ **statin في النص**، وكل سهم أصفر فايدة:

          - **فوق**: ↓ coagulation و ↓ platelet activation، و ↑ endothelial progenitor cells.
          - **الشمال**: البطانة أحسن (↑ endothelial function و ↑ NO، ↓ free radicals و ↓ endothelin)، وتحتها ==↓ inflammation==.
          - **اليمين**: ↓ collagen و ↓ MMPs، ↓ AT1 receptor و ↓ proliferation، وتحت خالص الدهون (↓ LDL، ↑ HDL، ↓ TG).

          اللي تاخده: الدهون **سهم واحد بس** من تسعة؛ الباقي ==pleiotropic effects== على الجدار نفسه.
      - kind: aside
        tone: analogy
        page: 272
        quote: "Pleiotropic effects of statins on the vessel wall\n  ↓ Coagulation\n  ↓ Platelet activation\n  ↑ Endothelial progenitor cells\n  ↑ Endothelial function, ↑ NO bioactivity, ↓ Free radicals\n  ↓ Collagen, ↓ MMPs\n  ↓ Endothelin\n  ↓ AT1 receptor, ↓ Proliferation\n  ↓ Macrophages, ↓ Inflammation, ↓ Immunomodulation\n  ↓ LDL cholesterol, ↑ HDL cholesterol, ↓ Triglycerides\nMMPs = matrix metalloproteinases"
        text: "السكر بيعمل في الشريان زي **مية مالحة على حديد**: صدا من كل حتة. الـ statin مش بس بيمسح الصدا (LDL)، ده **بيدهن** الحديد كمان (endothelium، inflammation، platelets)."
      - kind: check
        page: 272
        quote: "Pleiotropic effects of statins on the vessel wall\n  ↓ Coagulation\n  ↓ Platelet activation\n  ↑ Endothelial progenitor cells\n  ↑ Endothelial function, ↑ NO bioactivity, ↓ Free radicals\n  ↓ Collagen, ↓ MMPs\n  ↓ Endothelin\n  ↓ AT1 receptor, ↓ Proliferation\n  ↓ Macrophages, ↓ Inflammation, ↓ Immunomodulation\n  ↓ LDL cholesterol, ↑ HDL cholesterol, ↓ Triglycerides\nMMPs = matrix metalloproteinases"
        question: "Which of these is a pleiotropic effect of statins in the book's figure?"
        options:
          - "Increased endothelial progenitor cells"
          - "Increased endothelin"
          - "Increased matrix metalloproteinases"
          - "Increased platelet activation"
        answer: 0
        why:
          - "صح: ↑ endothelial progenitor cells، يعني تصليح أسرع للبطانة."
          - "بالعكس: الـ statin بيقلل الـ endothelin (مضيّق)."
          - "بالعكس: بيقلل الـ MMPs، فالـ plaque تفضل متماسكة."
          - "بالعكس: بيقلل الـ platelet activation."
      - kind: explain
        remind: [dm.L22.011]
        page: 273
        title: "JUPITER: مين دخل وليه"
        quote: "JUPITER Study: Study design\n  Inclusion: No history of CAD; men ≥50 yrs; women ≥60 yrs; LDL-C <130 mg/dl; CRP ≥2.0 mg/L\n  Placebo run-in, then randomisation to Rosuvastatin 20 mg (n=8901) or Placebo (n=8901)\n  Median follow-up 1.9 years\nJUPITER Study: Myocardial Infarction\n| | Rosuvastatin | Placebo |\n|---|---|---|\n| Number of events | 31 | 68 |\nFatal or Nonfatal Myocardial Infarction: HR 0.46 (95% CI 0.30-0.70), P<0.0002, - 54 %"
        text: |
          ناس **مفيش عندهم coronary artery disease (CAD)**، رجالة **≥ 50** وستات **≥ 60**، الـ LDL-C **أقل من 130** (طبيعي!) بس ==C-reactive protein (CRP) ≥ 2.0 mg/L==.

          **Rosuvastatin 20 mg** ضد placebo (8901 في كل جروب)، بعد placebo run-in، و median follow-up **1.9 سنة**.

          ليه الـ CRP بالذات؟ لأن الـ CRP علامة **inflammation**، وفاكر دراع الالتهاب في رسمة السكر وفي الـ pleiotropic effects؟ الفكرة اللي التجربة اختبرتها: لو الالتهاب بيولّع الـ plaque، يبقى ناس الـ LDL بتاعهم طبيعي بس الـ CRP عالي يستفيدوا من statin.
