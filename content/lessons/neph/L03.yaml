          3. **Electrolyte abnormalities:** hypokalemia و hypomagnesemia
          4. ==Suboptimal natriuresis==: بيطلّع **hypotonic urine**
          5. **Diuretic resistance**
          6. **Unpredictable response**
          7. مش واضح الـ **optimal dosing**
