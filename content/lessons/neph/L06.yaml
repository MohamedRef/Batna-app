          5. **Oral sodium bicarbonate (NaHCO3)** للـ metabolic acidosis.
          6. فكّر في الـ **K binders** (بتساعد تكمّل جرعات الـ renin–angiotensin–aldosterone system (RAAS) inhibitor (RAASi)).

          وده كله **علشان** تقلل الـ K اللي داخل وتزوّد اللي خارج، من غير ما توقف أدوية بتحمي القلب والكلى.
