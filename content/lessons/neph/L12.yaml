  - id: neph.L12.lesson3
    title: "الورم والعلاج بيضربوا الكلية من كل ناحية"
    hook: "Infiltration، انسداد، TMA، أدوية، و glomeruli: خمس طرق، ولكل واحدة علامة."
    minutes: 10
    pages: [416, 420]
    topics: [infiltration, tma, drugs, glomerular]
    goals:
      - "تفرّق بين الـ infiltration والـ obstruction والـ TMA"
      - "تعرف الأدوية وطريقة أذيتها (cisplatin، ifosfamide، interferon، IL-2)"
      - "تربط كل glomerular lesion بسرطاناته (Figure 9)"
    status: unverified
    steps:
      - kind: explain
        page: 417
        title: "Tumor infiltration"
        quote: "Renal imaging with ultrasonography or computed tomography shows bilaterally enlarged kidney with a heterogeneous texture"
        text: |
          الـ **leukemia** والـ **lymphoma** بيحبوا يدخلوا الكلية. في حوالي **1%** الدخول بيبقى massive ويعمل **AKI** عن طريق الضغط على الـ parenchyma وتكسير الـ microvasculature والـ tubules.

          - **US أو CT:** ==bilaterally enlarged kidneys== بـ **heterogeneous texture**.
          - **Kidney biopsy** هو اللي بيشخّص.
      - kind: explain
        page: 417
        title: "Urinary tract obstruction"
        quote: "More commonly, urinary tract obstruction is extrarenal and is caused by compression of the ureters by tumor mass (such as with cervical carcinoma)"
        text: |
          - **Intratubular:** uric acid (زي الـ TLS)، **high-dose methotrexate**، **high-dose IV acyclovir**.
          - ==Extrarenal== (الأشهر): ورم بيضغط على الـ ureters (زي **cervical carcinoma**)، أو البروستاتا بتضغط على الـ urethra.
      - kind: explain
        page: 417
        title: "Thrombotic microangiopathy"
        quote: "Thrombotic microangiopathy (TMA) is characterized by microangiopathic hemolytic anemia from red blood cell fragmentation"
        text: |
          الـ ==TMA== = تلاتة:
          1. **MAHA:** schistocytes، LDH عالي، haptoglobin واطي
          2. **Thrombocytopenia**
          3. **End-organ damage** زي الـ AKI (غالبًا severe وممكن يحتاج dialysis)

          السرطانات اللي بتعمله أكتر (خصوصًا metastatic): **mucinous gastric**، **ovarian**، **lymphomas**، **AML**.
      - kind: aside
        tone: analogy
        page: 417
        quote: "Certain cancers, especially when metastatic, more frequently cause TMA compared with others-these include mucinous gastric cancers, ovarian cancers, lymphomas, and acute myeloid leukemias."
        text: "الـ TMA زي مصفاة سلك اتسدّت بجلطات صغيرة: كرات الدم الحمرا بتعدي تتقطّع (schistocytes)، والصفائح بتخلص في الجلطات، والكلية (أكتر عضو فيه capillaries) هي أول واحدة تتضرّ."
      - kind: check
        page: 417
        quote: "(schistocytes, increased lactate dehydrogenase, depressed haptoglobin)"
        question: "Which lab set fits TMA?"
        options:
          - "Schistocytes, high LDH, low haptoglobin, low platelets"
          - "High uric acid, high K, high phosphate, low Ca"
          - "Heavy proteinuria with negative anti-PLA2R"
          - "Bilaterally enlarged heterogeneous kidneys"
        answer: 0
        why:
          - "صح: MAHA + thrombocytopenia."
          - "دي الـ TLS."
          - "دي الـ cancer-associated membranous nephropathy."
          - "دي الـ tumor infiltration."
      - kind: explain
        page: 418
        title: "الأدوية"
        quote: "is caused primarily by acute tubular toxicity, acute tubulointerstitial nephritis (ATIN), and various glomerular injuries"
        text: |
          الـ conventional chemo بيعمل AKI بـ **acute tubular toxicity** و **ATIN** و **glomerular injury**، وغالبًا ==dose and duration related==.

          - **Cisplatin:** الـ nephrotoxicity بتاعته **dose-limiting**.
          - **Ifosfamide:** **direct tubular epithelial damage**.
          - **Interferon:** AKI + proteinuria عالية من **FSGS** أو **MCD** بعد **أسابيع لشهور**.
          - **High-dose IL-2** (RCC، melanoma): **cytokine release syndrome** و **capillary leak** ← **prerenal AKI** خلال **24-48 ساعة**.

          والـ immunotherapies الجديدة (ICPIs، CAR-T) زوّدت الـ drug-induced AKI.
      - kind: match
        page: 418
        quote: "causing a prerenal form of AKI that develops within 24 to 48 hours after starting treatment."
        prompt: "وصّل كل دوا بطريقة أذيته للكلية:"
        pairs:
          - ["Ifosfamide", "Direct tubular epithelial damage"]
          - ["Interferon", "FSGS or MCD after weeks to months"]
          - ["High-dose IL-2", "Capillary leak, prerenal AKI in 24-48 h"]
          - ["High-dose methotrexate", "Intratubular obstruction"]
        why: "الـ IL-2 بيعمل AKI بسرعة (أيام) لأنه hemodynamic، والـ interferon ببطء (أسابيع) لأنه glomerular. والـ methotrexate بيترسب جوه الـ tubules."
      - kind: explain
        page: 418
        title: "قبل الـ nephrectomy"
        quote: "Preoperative screening using KDIGO CKD criteria (eGFR and albuminuria) is recommended for patients at risk for AKI"
        text: |
          قبل الـ **nephrectomy for RCC**: اعمل screening بالـ ==KDIGO CKD criteria== (**eGFR** و **albuminuria**) للي عندهم risk.

          وعلشان تقلّل الـ post-nephrectomy AKI: وقّف الأدوية الـ nephrotoxic، واضمن **intraoperative kidney perfusion** كويس.
      - kind: explain
        page: 419
        title: "Paraneoplastic glomerular disease"
        quote: "Membranous nephropathy MN is the most common glomerular pathology described in patients with solid tumors"
        text: |
          العلاج الأساسي = ==treat the underlying malignancy==.

          - الأشهر مع الـ **solid tumors**: **membranous nephropathy**.
          - أشهر أورام: **lung** و **gastric**، بعدهم RCC و prostate و thymoma. (ومعاهم colorectal، pancreatic، esophageal، hepatic.)
          - الـ **anti-PLA2R** بيبقى positive في **80%** من الـ primary MN، بس **مش موجود** في الـ MN بتاعة السرطان.
      - kind: reveal
        page: 419
        quote: "(a marker for primary MN in up to 80% or more of cases) were not found in patients with cancer who had secondary MN."
        prompt: "راجل مدخن 65 سنة، nephrotic، الـ biopsy فيها MN، والـ anti-PLA2R negative. بتفكر في إيه؟"
        answer: "الـ anti-PLA2R negative بيبعدك عن الـ **primary MN**. في سنه وتدخينه دوّر على **lung cancer** الأول (وبعده gastric). وعلاج الـ MN هنا = علاج الورم."
      - kind: figure
        page: 420
        quote: "Glomerular Diseases Associated With Solid Tumors and Hematologic Malignancies."
        title: "Figure 9 مرسومة"
        alt: "Map from 'Glomerular pathology in cancer' to six lesions with their cancers: IgA nephropathy with respiratory, buccal and nasopharynx tumors; membranous with lung, gastric, RCC, thymoma, prostate and CLL; minimal change with Hodgkin and non-Hodgkin lymphoma, leukemias, thymoma, lung, colorectal, RCC; FSGS with RCC, breast, thymoma, Hodgkin; MPGN with paraproteinemias, CLL, lung, RCC; crescentic GN with lung and gastric cancer."
        caption: "قاعدة سريعة: ==MN== = solid tumors (lung، gastric)، **MCD** = lymphoma (Hodgkin)، **MPGN** = CLL والـ paraproteins. وفي الـ CLL: MPGN **36%** و MN **19%**."
        svg: |
          <svg viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
            <rect x="60" y="8" width="210" height="32" rx="16" class="fg-ink"/>
            <text x="165" y="29" text-anchor="middle" class="t-sm t-b">Glomerular pathology in cancer</text>
            <rect x="10" y="52" width="310" height="52" rx="8" class="fg-acc"/>
            <text x="20" y="72" class="t-sm t-b t-acc">Membranous (most common, solid)</text>
            <text x="20" y="90" class="t-sm">lung, gastric, RCC, thymoma, prostate, CLL</text>
            <rect x="10" y="112" width="310" height="52" rx="8" class="fg-box"/>
            <text x="20" y="132" class="t-sm t-b">Minimal change disease</text>
            <text x="20" y="150" class="t-sm">Hodgkin, NHL, leukemias, thymoma, lung, CRC, RCC</text>
            <rect x="10" y="172" width="310" height="52" rx="8" class="fg-box"/>
            <text x="20" y="192" class="t-sm t-b">FSGS</text>
            <text x="20" y="210" class="t-sm">RCC, breast, thymoma, Hodgkin</text>
            <rect x="10" y="232" width="310" height="52" rx="8" class="fg-box"/>
            <text x="20" y="252" class="t-sm t-b">MPGN</text>
            <text x="20" y="270" class="t-sm">paraproteinemias, CLL, lung, RCC</text>
            <rect x="10" y="292" width="310" height="52" rx="8" class="fg-box"/>
            <text x="20" y="312" class="t-sm t-b">IgA nephropathy</text>
            <text x="20" y="330" class="t-sm">respiratory tract, buccal mucosa, nasopharynx</text>
            <rect x="10" y="352" width="310" height="40" rx="8" class="fg-bad"/>
            <text x="20" y="377" class="t-sm"><tspan class="t-b">Crescentic GN:</tspan> lung, gastric</text>
          </svg>
      - kind: match
        page: 420
        quote: "membranoproliferative glomerulonephritis (36%) and MN (19%)."
        prompt: "وصّل الـ lesion بالسرطان اللي بيتذكر معاها (Figure 9):"
        pairs:
          - ["IgA nephropathy", "Nasopharynx tumors"]
          - ["Minimal change disease", "Hodgkin lymphoma"]
          - ["MPGN", "Paraproteinemias and CLL (36%)"]
          - ["Crescentic GN", "Lung and gastric cancer"]
        why: "الـ IgA مع أورام الـ mucosa اللي فيها IgA (تنفسي، فم، nasopharynx). الـ MCD مع الـ lymphoma (cytokines من الـ T-cells). الـ MPGN مع الـ paraproteins والـ CLL."
      - kind: try
        items: [neph.L12.062, neph.L12.073, neph.L12.075, neph.L12.083, neph.L12.084]
    recap:
      - "Infiltration (leukemia/lymphoma): كليتين كبار heterogeneous، والـ biopsy بتشخّص."
      - "Obstruction: intratubular (urate، methotrexate، acyclovir) أو الأشهر extrarenal (cervical cancer، prostate)."
