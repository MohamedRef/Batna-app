          - و **serious complications can develop**.
          - فالـ cholecystectomy بقت indicated.
      - kind: explain
        page: 384
        quote: "Open cholecystectomy, which involves a large abdominal incision and direct exploration, is safe and effective. Its overall mortality rate is about 0.1% when done electively during a period free of complications. Laparoscopic cholecystectomy is the treatment of choice. Using video endoscopy and instrumentation through small abdominal incisions, the procedure is less invasive than open cholecystectomy. The result is a much shorter convalescence, decreased postoperative discomfort, improved cosmetic results, yet no increase in morbidity or mortality. Laparoscopic cholecystectomy is converted to an open procedure in 2 to 5% of patients, usually because biliaryanatomy cannot be identified or a complication cannot be managed. Older age typically increases the risks of any type of surgery."
        title: "Open ولا laparoscopic؟"
        text: |
          **Open cholecystectomy**: آمنة وفعّالة، و overall mortality حوالي 0.1% لما تتعمل elective في فترة مفيهاش مضاعفات.

          ==Laparoscopic cholecystectomy==: هي الـ ==treatment of choice==. بتتعمل بـ video endoscopy من فتحات صغيرة، فمكسبها:
          - convalescence أقصر بكتير
          - وجع أقل بعد العملية
          - شكل أحسن
          - و **no increase in morbidity or mortality**

          **Conversion to open**: في 2–5%. غالبًا لأن الـ **biliary anatomy cannot be identified**، أو فيه complication مش عارفين يتعاملوا معاها بالمنظار.

          **Age**: الـ older age بيزوّد خطر أي عملية، open أو laparoscopic.
