lecture: dm.L20
lessons:
  # ------------------------------------------------------------------
  - id: dm.L20.lesson1
    title: "الـ HDL بيحمي الشريان إزاي؟"
    hook: "الـ HDL مش بس \"الكوليسترول الحلو\". عنده 6 أسلحة ضد الـ atherosclerosis، وأولهم عربية الزبالة."
    minutes: 8
    pages: [252, 254]
    topics: [metabolism, anti]
    goals:
      - "تمشي مع الـ HDL من الـ ABCA1 لحد الـ bile"
      - "تعرف دور الـ CETP والـ LCAT والـ SR-B1"
      - "تعد الـ 6 anti-atherogenic effects"
    status: unverified
    steps:
      - kind: explain
        page: 252
        title: "Reverse cholesterol transport"
        quote: "Reverse Cholesterol Transport (RCT)"
        text: |
          الـ ==reverse cholesterol transport== (RCT) هو إن الكوليسترول الزيادة يطلع من **الأنسجة** ← يمشي في **الدم** ← يوصل **الكبد** ← يخرج في الـ **bile**.

          "Reverse" لأن الطريق العادي (LDL) بيودّي الكوليسترول **للأنسجة**؛ الـ high-density lipoprotein (HDL) بيرجّعه.
      - kind: figure
        page: 253
        quote: "HDL Metabolism"
        title: "دورة حياة الـ HDL"
        alt: "Flow from right to left drawn top to bottom: lipid-poor ApoA-I takes free cholesterol from a cell through ABCA1 and becomes nascent HDL; LCAT turns it into mature HDL with a cholesteryl ester core; mature HDL gives cholesteryl ester to the liver through SR-B1, and the liver sends it to bile; a side branch shows CETP swapping cholesteryl ester from HDL for triglyceride from VLDL, and LDL returning to the liver through the LDL receptor."
        caption: "**ABCA1** يملا ← **lecithin–cholesterol acyltransferase (LCAT)** ينضّج ← **SR-B1** يفضّي في الكبد ← **bile**. والـ ==cholesteryl ester transfer protein (CETP)== طريق جانبي: ياخد الـ CE من الـ HDL ويديه للـ very-low-density lipoprotein (VLDL)/LDL مقابل TG."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L20a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="200" height="36" rx="8" class="fg-bad"/>
            <text x="110" y="33" text-anchor="middle" class="t-sm t-b">Cell: free cholesterol</text>
            <path d="M110 46 L110 66" class="fg-arrow" marker-end="url(#L20a)"/>
            <text x="118" y="61" class="t-sm t-acc">ABCA1</text>
            <rect x="10" y="68" width="200" height="36" rx="8" class="fg-box"/>
            <text x="110" y="91" text-anchor="middle" class="t-sm">Lipid-poor ApoA-I → nascent HDL</text>
            <path d="M110 104 L110 124" class="fg-arrow" marker-end="url(#L20a)"/>
            <text x="118" y="119" class="t-sm t-acc">LCAT</text>
            <rect x="10" y="126" width="200" height="36" rx="8" class="fg-acc"/>
            <text x="110" y="149" text-anchor="middle" class="t-sm t-b">Mature HDL (CE core)</text>
            <path d="M210 144 L240 144 L240 196" class="fg-arrow" marker-end="url(#L20a)"/>
            <text x="246" y="166" class="t-sm t-acc">CETP</text>
            <text x="246" y="182" class="t-sm">CE ⇄ TG</text>
            <rect x="215" y="198" width="105" height="36" rx="8" class="fg-bad"/>
            <text x="267" y="221" text-anchor="middle" class="t-sm t-b">VLDL, LDL</text>
            <path d="M110 162 L110 196" class="fg-arrow" marker-end="url(#L20a)"/>
            <text x="118" y="184" class="t-sm t-acc">SR-B1</text>
            <rect x="10" y="198" width="200" height="50" rx="8" class="fg-good"/>
            <text x="110" y="220" text-anchor="middle" class="t-b">Liver</text>
            <text x="110" y="238" text-anchor="middle" class="t-sm">FC ← CE</text>
            <path d="M267 234 L267 262 L212 262 L212 240" class="fg-arrow" marker-end="url(#L20a)"/>
            <text x="230" y="278" class="t-sm">LDL receptor</text>
            <path d="M110 248 L110 290" class="fg-arrow" marker-end="url(#L20a)"/>
            <rect x="60" y="292" width="100" height="30" rx="8" class="fg-box"/>
            <text x="110" y="312" text-anchor="middle" class="t-sm t-b">Bile</text>
          </svg>
      - kind: reveal
        page: 253
        quote: "HDL Metabolism"
        prompt: "لو الـ CETP بقى نشيط زيادة، الـ HDL-C هيعلى ولا يوطى؟ وليه؟"
        answer: "**يوطى**. الـ CETP بيسحب الـ cholesteryl ester من الـ HDL ويديه للـ VLDL و LDL. نشاط زيادة = HDL مصفّى. وده بالظبط فكرة الـ CETP inhibitors: اقفله، الـ HDL يعلى."
      - kind: explain
        remind: [dm.L20.006]
        page: 254
        title: "الـ 6 أسلحة"
        quote: "Anti-atherogenic Effects of HDL\n  1. Reverse Cholesterol Transport (RCT).\n  2. Anti-Oxidant Properties: Prevents oxidation of LDL.\n  3. Anti-Inflammatory Properties: Inhibits the expression of adhesion molecules on endothelial cells.\n  4. Vasodilator: Increases NO, increases Prostacyclin (PG I2), and Decreases ET-1.\n  5. Anti-Thrombotic: Decrease PAF, Decrease vWF, and Decrease TF.\n  6. Endothelial Protection: Stimulate EC Proliferation and Inhibit EC Apoptosis."
        text: |
          1. **RCT**: يشيل الكوليسترول من الـ macrophage.
          2. ==Anti-oxidant==: يمنع **oxidation** الـ LDL.
          3. **Anti-inflammatory**: يمنع ظهور الـ **adhesion molecules** على الـ endothelium، فالـ monocyte مايلزقش.
          4. **Vasodilator**: ↑ **nitric oxide (NO)**، ↑ **prostacyclin (PGI2)**، ↓ **endothelin-1 (ET-1)**.
          5. **Anti-thrombotic**: ↓ **platelet-activating factor (PAF)**، ↓ **vWF**، ↓ **tissue factor**.
          6. **Endothelial protection**: يزوّد تكاثر الـ endothelial cells ويقلل الـ apoptosis.
      - kind: mnemonic
        page: 254
        quote: "Anti-atherogenic Effects of HDL\n  1. Reverse Cholesterol Transport (RCT).\n  2. Anti-Oxidant Properties: Prevents oxidation of LDL.\n  3. Anti-Inflammatory Properties: Inhibits the expression of adhesion molecules on endothelial cells.\n  4. Vasodilator: Increases NO, increases Prostacyclin (PG I2), and Decreases ET-1.\n  5. Anti-Thrombotic: Decrease PAF, Decrease vWF, and Decrease TF.\n  6. Endothelial Protection: Stimulate EC Proliferation and Inhibit EC Apoptosis."
        word: "RAIVTE"
        parts:
          - { key: "R", text: "Reverse cholesterol transport" }
          - { key: "A", text: "Anti-oxidant: no LDL oxidation" }
          - { key: "I", text: "Inflammation down: fewer adhesion molecules" }
          - { key: "V", text: "Vasodilator: NO and PGI2 up, ET-1 down" }
          - { key: "T", text: "Thrombosis down: PAF, vWF, tissue factor (TF)" }
          - { key: "E", text: "Endothelium protected: proliferation up, apoptosis down" }
        hook: "**RAIVTE** ≈ \"رايفته\": الـ HDL بيعمل للشريان **رايفة** (ريفريش) من 6 جهات."
      - kind: figure
        page: 253
        quote: "Anti-atherogenic Effects of HDL"
        title: "الـ HDL بيضرب فين في الـ plaque؟"
        alt: "Three stacked steps of atherogenesis each with an HDL block: monocyte adhesion to endothelium, blocked by HDL inhibiting adhesion molecule expression; LDL oxidation in the intima, blocked by HDL inhibiting LDL oxidation; macrophage turning into a foam cell, opposed by HDL promoting cholesterol efflux."
        caption: "3 نقط تفتيش في الكتاب: **يمنع اللزق** (adhesion)، **يمنع الأكسدة**، و **يسحب الكوليسترول** من الـ macrophage قبل ما يبقى foam cell."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="180" height="56" rx="8" class="fg-bad"/>
            <text x="100" y="34" text-anchor="middle" class="t-sm t-b">Monocyte adhesion</text>
            <text x="100" y="52" text-anchor="middle" class="t-sm">to endothelium</text>
            <rect x="200" y="10" width="120" height="56" rx="8" class="fg-good"/>
            <text x="260" y="34" text-anchor="middle" class="t-sm t-b">HDL: blocks</text>
            <text x="260" y="52" text-anchor="middle" class="t-sm">adhesion molecules</text>
            <rect x="10" y="86" width="180" height="56" rx="8" class="fg-bad"/>
            <text x="100" y="110" text-anchor="middle" class="t-sm t-b">LDL → oxidized LDL</text>
            <text x="100" y="128" text-anchor="middle" class="t-sm">in the intima</text>
            <rect x="200" y="86" width="120" height="56" rx="8" class="fg-good"/>
            <text x="260" y="110" text-anchor="middle" class="t-sm t-b">HDL: blocks</text>
            <text x="260" y="128" text-anchor="middle" class="t-sm">LDL oxidation</text>
            <rect x="10" y="162" width="180" height="56" rx="8" class="fg-bad"/>
            <text x="100" y="186" text-anchor="middle" class="t-sm t-b">Macrophage → foam cell</text>
            <text x="100" y="204" text-anchor="middle" class="t-sm">cytokines, MMPs</text>
            <rect x="200" y="162" width="120" height="56" rx="8" class="fg-good"/>
            <text x="260" y="186" text-anchor="middle" class="t-sm t-b">HDL: promotes</text>
            <text x="260" y="204" text-anchor="middle" class="t-sm">cholesterol efflux</text>
          </svg>
      - kind: check
        page: 254
        quote: "Anti-atherogenic Effects of HDL\n  1. Reverse Cholesterol Transport (RCT).\n  2. Anti-Oxidant Properties: Prevents oxidation of LDL.\n  3. Anti-Inflammatory Properties: Inhibits the expression of adhesion molecules on endothelial cells.\n  4. Vasodilator: Increases NO, increases Prostacyclin (PG I2), and Decreases ET-1.\n  5. Anti-Thrombotic: Decrease PAF, Decrease vWF, and Decrease TF.\n  6. Endothelial Protection: Stimulate EC Proliferation and Inhibit EC Apoptosis."
        question: "HDL's vasodilator effect includes which of the following?"
        options:
          - "Decreased endothelin-1"
          - "Increased thromboxane"
          - "Decreased nitric oxide"
          - "Increased tissue factor"
        answer: 0
        why:
          - "صح: ↓ ET-1 مع ↑ NO و ↑ PGI2."
          - "الكتاب ما ذكرش thromboxane، والـ HDL anti-thrombotic أصلًا."
          - "بالعكس: الـ HDL بيزوّد الـ NO."
          - "بالعكس: بيقلل الـ TF."
      - kind: try
        items: [dm.L20.002, dm.L20.005, dm.L20.006, dm.L20.008, dm.L20.009]
    recap:
      - "RCT: أنسجة ← دم ← كبد ← bile."
      - "ABCA1 يملا الـ ApoA-I، LCAT ينضّج، SR-B1 يفضّي في الكبد؛ CETP يبدّل CE بـ TG مع الـ VLDL/LDL."
      - "6 أسلحة (RAIVTE): RCT، anti-oxidant، anti-inflammatory، vasodilator، anti-thrombotic، endothelial protection."
      - "Vasodilator: ↑NO ↑PGI2 ↓ET-1. Anti-thrombotic: ↓PAF ↓vWF ↓TF."
    practice: [dm.L20.001, dm.L20.002, dm.L20.003, dm.L20.004, dm.L20.005, dm.L20.006, dm.L20.007, dm.L20.008, dm.L20.009, dm.L20.010, dm.L20.011, dm.L20.012, dm.L20.057]
