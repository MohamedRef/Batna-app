          **الـ crisis**: مسكنات، **تدفئة**، **سوايل**، **أكسجين**، وعلاج العدوى (عكس الـ CHOCA بالظبط).

          **قبل العمليات**: ==exchange transfusion== تقلل نسبة الـ HbS.

          **Hydroxyurea**: يرفع الـ ==HbF==، والـ HbF مش بيدخل مع الـ HbS في الـ polymer، فالـ crises تقل.
