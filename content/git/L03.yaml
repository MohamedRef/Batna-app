    blanks: [[0, 2], [2, 2], [4, 2]]
    src: { page: 138, quote: "TABLE 18-2: Diagnostic Tests for Fecal Incontinence\n| Test | Advantages | Disadvantages | Quality of Evidence | Comments |\n|---|---|---|---|---|\n| Physiologic | | | | |\n| Anorectal manometry | Quantifies EAS and IAS pressures; identifies rectal hyposensitivity, rectal hypersensitivity, impaired rectal compliance, dyssynergic defecation | Lack of standardization | Good | Useful for detecting anal sphincter weakness, altered rectal sensation and accommodation, and dyssynergia |\n| Needle EMG | Quantifies spike potentials and re-innervation pattern indicating neuropathy or myopathy | Invasive, painful; not widely available | Fair | Useful but used largely in research laboratories |\n| Surface EMG | Displays EMG activity; can provide information on normal or weak muscle tone | Inaccurate, frequent artifacts | Fair | Used largely for neuromuscular training |\n| Pudendal nerve terminal motor latency (PNTML) | Measures latency of the terminal portion of the pudendal nerve, simple to perform | Minimally invasive, low sensitivity, interobserver differences | Fair | Conflicting data; correlation with other tests and surgical outcome unclear |\n| Translumbar and transsacral motor evoked potentials | Quantifies the nerve conduction time of the entire spinoanal and spinorectal pathways; minimally invasive | Lack of standardization, training, controlled studies, and availability | Fair | Promising noninvasive test; more objective and higher yield than PNTML |\n| Colonic transit study with radiopaque markers | Evaluates the presence of fecal retention; inexpensive and widely available | Inconsistent methodology, validity has been questioned | Good | Useful for identifying patients with fecal seepage and older persons with impaction |\n| Balloon expulsion test (BET) | Simple, inexpensive, bedside assessment of ability to expel a simulated stool; identifies dyssynergic defecation | Lack of standardization | Good | Normal BET does not exclude dyssynergia; should be interpreted in the context of other anorectal test results |\n| Imaging | | | | |\n| Anorectal US | Visualizes IAS and EAS defects, thickness, and atrophy and puborectalis muscles | Interobserver bias; scars difficult to identify | Good | Most widely available |\n| Defecography | Detects prolapse, intussusception, obtuse anorectal angle, and pelvic floor weakness, as well as rectoceles and megarectum | Radiation exposure, embarrassment, availability, interobserver bias, inconsistent methodology | Fair | Useful and complementary with other tests |\n| MRI | Simultaneously evaluates global pelvic floor anatomy and dynamic motion; reveals sphincter morphology and pathology outside the anorectum | Expensive, lack of standardization and availability | Fair | Used as an adjunct to other tests |\n| Plain abdominal film | Identifies excessive amount of stool in the colon; simple, inexpensive, widely available | Lack of standardization of interpretation, lack of controlled studies | Poor | Not recommended for routine evaluation but useful in older adults and children with incontinence and fecal impaction |\n| Barium enema | Identifies megacolon, megarectum, stenosis, diverticulosis, extrinsic compression, and intraluminal masses | Lack of standardization, embarrassment, radiation exposure, lack of controlled studies | Poor | Not recommended as part of routine evaluation |\n| Endoscopy | | | | |\n| Flexible sigmoidoscopy and colonoscopy | Directly visualizes the colon to exclude mucosal lesions (e.g., solitary rectal ulcer syndrome, inflammation, malignancy) | Invasive, risks related to procedure (perforation, bleeding) and sedation | Poor | Indicated in patients with unexplained diarrhea and seepage and patients > age 50 |" }
