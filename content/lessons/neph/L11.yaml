  - id: neph.L11.lesson5
    title: "الضغط والغسيل المكثّف: الروشتة أسبوع بأسبوع"
    hook: "من 12 ساعة غسيل في الأسبوع لـ 36 ساعة. ليه الحامل محتاجة غسيل أكتر، و bicarbonate أقل؟"
