        quote: "c) 2ry Hyperparathyriodism (HPT) A) HPT is the result of hypocalcaemia which develops due to the following causes:\n  a) Reduced synthesis of 1,25(OH) D3 in CRD (The key role in pathogenesis of HPT as it is formed in the proximal renal tubules).\n  b) Hyperphosphatemia (it has a suppressive effect on the renal 1 a – hydroxylase).\n  c) A decrease in the number of calcitriol receptors in parathyroid in CRF. B) Since vit D also has an antiproliferative effect on parathyroid cells, this may provide an explanation for marked PTH secretion as well as the abnormal growth pattern characteristic of the nodular hypeparathyroidism."
