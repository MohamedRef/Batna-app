  - id: hb.L10.lesson2
    title: "مين كسر الكبد؟ الأسباب والصورة"
    hook: "عيش غراب من الغيط، علبة بنادول، أو حمل في الشهر التاسع: السبب بيحدد هتزرع ولا تستنى."
    minutes: 9
    pages: [176, 178]
    topics: [etiology, clinical]
    goals:
      - "تعدّ أسباب الـ ALF ومين acute ومين subacute"
      - "تعرف ليه السبب مهم، وإيه اللي تسأل عنه في الـ history"
      - "تشرح الـ labs والمضاعفات: cerebral edema، infection، hypoglycemia، kidney"
    status: unverified
    steps:
      - kind: sort
        page: 176
        prompt: "حط كل سبب في الـ presentation بتاعته (حسب جدول الكتاب):"
        bins: ["Acute ALF only", "Acute and subacute ALF"]
        cards:
          - { text: "Hepatitis A virus", bin: 0 }
          - { text: "Acetaminophen", bin: 0 }
          - { text: "Amanita phalloides", bin: 0 }
          - { text: "Hypoxic hepatitis", bin: 0 }
          - { text: "HELLP syndrome", bin: 0 }
          - { text: "Anti-tuberculous drugs", bin: 1 }
          - { text: "Budd-Chiari syndrome", bin: 1 }
          - { text: "Wilson disease", bin: 1 }
        why: "الـ **infections**، الـ **acetaminophen / Amanita / phosphorus**، الـ **hypoxic hepatitis**، والـ **pregnancy-related** = acute. الـ **idiosyncratic drugs** (anti-TB، statins، NSAIDs، antiepileptics…)، الـ **Budd-Chiari**، و «others» (Wilson، autoimmune، lymphoma، HLH) = acute **و** subacute."
      - kind: aside
        tone: joke
        page: 176
        text: |
          الـ **Amanita phalloides** اسمها الشعبي **«death cap»**. يعني لو حد قالك «أنا لقيت عيش غراب حلو في الجنينة وعملته شوربة»، متقولوش «بالهنا والشفا»، قوله «تعالى نعمل LFTs». 🍄
      - kind: explain
        page: 176
        title: "ليه السبب مهم؟"
        text: |
          سببين في الكتاب:
          - فيه **specific therapy** لبعض الأسباب (زي الـ **acetaminophen** والـ **herpes**).
          - الـ **prognosis بيختلف**: الـ spontaneous recovery في الـ **acetaminophen** والـ **hepatitis A** **أكتر من 50%**، فنستنى شوية قبل الزرع. أما الـ **Wilson** فالـ recovery نادر، والزرع العاجل هو الحل.

          أشهر الأسباب المعروفة في أمريكا: acetaminophen، idiosyncratic drugs، Wilson، hepatitis B، و ischemia.
      - kind: reveal
        page: 176
        prompt: "ليه الكتاب بيقولك خد الـ history **فورًا** أول ما المريض يوصل؟"
        answer: |
          لأن الـ **mental status هتقع** وبعدها مش هتعرف تاخد history يُعتمد عليه.

          ولازم يشمل: الأدوية (**prescription و nonprescription**)، **illicit substances**، و **alcohol**، لأن ده بيأثر على قرار إنه **candidate للزرع** ولا لأ.

          ولو السبب لسه مش واضح بعد الـ history والتحاليل: **liver biopsy**، ويُفضّل **transjugular**، علشان تستبعد malignancy و autoimmune.
      - kind: explain
        page: 177
        title: "الصورة والـ labs"
        text: |
          - الأعراض أول: زي **acute hepatitis** (malaise، nausea، jaundice).
          - الـ **HE** شرط أساسي، من صعوبة تركيز لحد coma. وبما إن الـ encephalopathy في ALI **ominous sign**، **افحص الـ mental status كتير**.
          - الـ aminotransferases غالبًا **>1,000 U/L**. الـ **acetaminophen** غالبًا **ALT >3,500 U/L**.
          - **Fulminant Wilson:** الـ aminotransferases **ارتفاع بسيط** والـ **ALP واطي أو طبيعي**، رغم PT طويل و bilirubin عالي.
      - kind: check
        page: 177
        question: "A 19-year-old with jaundice, confusion and INR 3.4 has ALT 280 U/L and a LOW alkaline phosphatase. Most likely cause?"
        options:
          - "Fulminant Wilson disease"
          - "Acetaminophen hepatotoxicity"
          - "Acute hepatitis A"
          - "Ischemic hepatitis"
        answer: 0
        why:
          - "صح: **modest ALT + low/normal ALP** رغم liver failure واضح = **Wilson**."
          - "الـ acetaminophen بيدي ALT **>3,500**."
          - "الـ viral hepatitis في ALF غالبًا ALT >1,000."
          - "الـ ischemic hepatitis بتدي aminotransferases عالية جدًا، مش ALP واطي بالشكل ده."
      - kind: explain
        page: 177
        title: "الـ cerebral edema: أخطر حاجة"
        text: |
          الـ HE في الـ ALF، **عكس الـ chronic liver disease**، عندها **ميل تعمل cerebral edema**.

          - الـ mechanism مش واضح: يمكن **blood-brain barrier disruption** و اضطراب **cellular osmolality**.
          - غالبًا فيه **ammonia عالي جدًا**؛ و **>150 μmol/L** مرتبط بـ **ICP عالي و poor outcome**.
          - الـ cerebral edema بتموّت بالـ **brain ischemia** والـ **herniation**.
      - kind: aside
        tone: analogy
        page: 177
        text: |
          الـ cirrhotic زي واحد عايش في شقة دوشة من سنين: المخ اتعوّد واتأقلم. الـ ALF زي واحد نايم والجيران قلبوا الشقة فرح فجأة: المخ **مالحقش يتأقلم**، فالـ ammonia تعمل swelling جوه **صندوق مقفول** (الجمجمة). وده سبب إن الـ edema بتاعة الـ ALF بتقتل.
      - kind: match
        page: 178
        prompt: "وصّل كل مشكلة بالسبب أو المعلومة اللي في الكتاب:"
        pairs:
          - ["Infection", "Fever and leukocytosis may be absent"]
          - ["Hypoglycemia", "Poor insulin degradation and low glucose output"]
          - ["Circulation", "Hyperdynamic with low SVR, mimics sepsis"]
          - ["Kidney dysfunction", "Particularly common in acetaminophen ALF"]
          - ["Acidosis", "Poor outcome, used in prognostic models"]
        why: "**Infection**: الـ threshold للـ antibiotics واطي وأي تدهور = دوّر على عدوى. **Hypoglycemia**: شائعة و poor prognostic. **Kidney**: من Wilson، sepsis، HRS، أو ATN. **Cerebral edema و sepsis** هما الـ leading causes of death."
      - kind: try
        items: [hb.L10.025, hb.L10.036, hb.L10.038]
    recap:
      - "Acute بس: viruses، acetaminophen، Amanita، hypoxic، pregnancy. Acute + subacute: idiosyncratic drugs، Budd-Chiari، Wilson، AIH."
      - "السبب مهم: specific therapy + prognosis (acetaminophen و HAV >50% بيخفوا؛ Wilson نادر)."
      - "خد الـ history فورًا؛ ولو السبب مجهول: transjugular biopsy."
      - "ALT >1,000؛ acetaminophen >3,500؛ Wilson: ALT بسيط و ALP واطي."
      - "Cerebral edema (ammonia >150) و sepsis بيموّتوا؛ hypoglycemia و acidosis علامات وحشة."
    practice: [hb.L10.025, hb.L10.026, hb.L10.027, hb.L10.028, hb.L10.029, hb.L10.030, hb.L10.031, hb.L10.032, hb.L10.033, hb.L10.034, hb.L10.035, hb.L10.036, hb.L10.037, hb.L10.038, hb.L10.039, hb.L10.040, hb.L10.041, hb.L10.042, hb.L10.043, hb.L10.044, hb.L10.045, hb.L10.046, hb.L10.047, hb.L10.048, hb.L10.049, hb.L10.130, hb.L10.137]

