      - kind: explain
        page: 8
        quote: "Differential Diagnosis of MEN 1\n  Sporadic or familial tumors of the pituitary, parathyroid or pancreatic islets.\n  Hypercalcemia from any cause may cause.\n  GIT symptoms and increased gastrin levels, simulating a gastrinoma.\n  Treatment of GIT symptoms with H2 blockers or metoclopramide may cause hyper- prolactinemia, simulating a pituitary prolactinoma."
        title: "ليه كل mimic بيقلّد"
        text: |
          - **Sporadic أو familial tumour** في غدة واحدة: نفس الورم بالظبط، بس مفيش غدة تانية. يعني لازم تدوّر على **التانية** قبل ما تقول MEN.
          - **Hypercalcemia من أي سبب**: الكتاب قالها في ص 2، الكالسيوم العالي ==بيزوّد الـ gastrin==، فممكن تشوف gastrin عالي من غير gastrinoma.
          - **Metoclopramide**: التفسير المقبول (مش في الكتاب): هو **dopamine antagonist**، والـ dopamine هو اللي بيكبس الـ prolactin، فلما يتشال الكبس الـ prolactin يعلى.

          الخلاصة: قبل ما تحكم إن الهرمون العالي ورم، اسأل على **الأدوية** و**الكالسيوم**.
      - kind: aside
        tone: trap
        page: 8
        quote: "Differential Diagnosis of MEN 1\n  Sporadic or familial tumors of the pituitary, parathyroid or pancreatic islets.\n  Hypercalcemia from any cause may cause.\n  GIT symptoms and increased gastrin levels, simulating a gastrinoma.\n  Treatment of GIT symptoms with H2 blockers or metoclopramide may cause hyper- prolactinemia, simulating a pituitary prolactinoma."
        text: "الـ differential diagnosis بتاع multiple endocrine neoplasia (MEN) 1 كله فخاخ: أورام sporadic أو familial في نفس الغدد، hypercalcemia من أي سبب، أعراض GIT مع gastrin عالي تقلّد gastrinoma، وأدوية المعدة اللي ترفع الـ prolactin."
