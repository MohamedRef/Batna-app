  - id: endo.L04.lesson7
    title: "الـ HIV والخصية وأمراض متفرقة"
    hook: "مريض AIDS تعبان وضغطه بيقع لما يقف والصوديوم واطي. هل ده الـ HIV؟ ولا الـ adrenal؟ ولا الـ rifampin؟"
    minutes: 8
    pages: [65, 76]
    topics: [cfs, hiv, testicular, misc, crf-reproductive, crf-glucose]
    goals:
      - "تعرف صورة الـ CFS الهرمونية"
      - "تعرف أكتر غدة بتتأثر في الـ HIV وأكتر abnormality"
      - "تعدّ أمراض الخصية في الأمراض العامة، والـ cirrhosis بالذات"
    status: unverified
    steps:
      - kind: explain
        page: 65
        quote: "1- Reduced production of CRH. 2- Lower serum cortisol. 3- Increases ACTH."
        title: "الـ chronic fatigue syndrome"
        text: |
          فيه رأي إن الـ CFS أصلًا ==psychiatric== والتغيرات الهرمونية ثانوية. الكتاب بيقول:
          - **↓ CRH**، **↓ cortisol**، و **↑ ACTH**.
          - Depression خفيف لمتوسط في **1/2 لـ 2/3**.
      - kind: aside
        tone: trap
        page: 65
        quote: "1- Reduced production of CRH. 2- Lower serum cortisol. 3- Increases ACTH."
        text: "فسيولوجيًا، الـ CRH الواطي المفروض يقلل الـ ACTH، فالمجموعة دي غريبة. بس دي إجابة الكتاب، احفظها زي ما هي."
      - kind: explain
        page: 66
        quote: "Basal 8 A.M. plasma cortisol levels are usually higher in patients with advanced HIV disease"
        title: "الـ HIV والـ adrenal"
        text: |
          أعراض كتير في الـ HIV شبه الـ adrenal insufficiency: fatigue، anorexia، vomiting، orthostatic hypotension، **hyponatraemia**.

          الـ basal cortisol الصبح ==أعلى== من الطبيعي، بس الـ DOC و compound B و 18-OH-DOC **مش عاليين** وردّهم على الـ ACTH ضعيف. يعني الـ **adrenal reserve قليل**.
      - kind: figure
        page: 73
        quote: "The adrenal gland is the endocrine gland most commonly affected in AIDS adrenal insufficiency is observed in <8% of AIDS patients."
        title: "الـ adrenal في الـ AIDS"
        alt: "The adrenal is the gland most often affected in AIDS, though adrenal insufficiency is under 8 percent. Three causes: infection, with CMV in up to 50 percent of adrenal pathology and MAC, Kaposi, Cryptococcus or Histoplasma in 5 to 12 percent; drugs, with ketoconazole blocking synthesis and rifampin increasing cortisol clearance; and central, with normal or low ACTH. Test: cortisol under 20 micrograms per decilitre 60 minutes after ACTH."
        caption: "أكتر غدة بتتأثر، بس الـ insufficiency أقل من 8%. والاختبار: cortisol أقل من 20 بعد ساعة من الـ ACTH."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <rect x="65" y="8" width="200" height="46" rx="10" class="fg-acc"/>
            <text x="165" y="28" text-anchor="middle" class="t-sm t-b">Adrenal: most affected gland</text>
            <text x="165" y="46" text-anchor="middle" class="t-sm">insufficiency &lt; 8%</text>
            <rect x="6" y="70" width="102" height="110" rx="8" class="fg-bad"/>
            <text x="57" y="90" text-anchor="middle" class="t-sm t-b">Infection</text>
            <text x="57" y="112" text-anchor="middle" class="t-sm">CMV ≤ 50%</text>
            <text x="57" y="134" text-anchor="middle" class="t-sm">MAC, Kaposi,</text>
            <text x="57" y="150" text-anchor="middle" class="t-sm">Crypto, Histo</text>
            <text x="57" y="168" text-anchor="middle" class="t-sm">5–12%</text>
            <rect x="114" y="70" width="102" height="110" rx="8" class="fg-bad"/>
            <text x="165" y="90" text-anchor="middle" class="t-sm t-b">Drugs</text>
            <text x="165" y="112" text-anchor="middle" class="t-sm">Ketoconazole</text>
            <text x="165" y="128" text-anchor="middle" class="t-sm t-mut">blocks synthesis</text>
            <text x="165" y="150" text-anchor="middle" class="t-sm">Rifampin</text>
            <text x="165" y="166" text-anchor="middle" class="t-sm t-mut">↑ clearance</text>
            <rect x="222" y="70" width="102" height="110" rx="8" class="fg-box"/>
            <text x="273" y="90" text-anchor="middle" class="t-sm t-b">Central</text>
            <text x="273" y="112" text-anchor="middle" class="t-sm">ACTH normal</text>
            <text x="273" y="128" text-anchor="middle" class="t-sm">or low</text>
            <text x="273" y="150" text-anchor="middle" class="t-sm">pituitary</text>
            <text x="273" y="166" text-anchor="middle" class="t-sm">or CNS</text>
            <rect x="6" y="196" width="318" height="54" rx="8" class="fg-good"/>
            <text x="165" y="218" text-anchor="middle" class="t-sm t-b">ACTH test: cortisol &lt; 20 µg/dL at 60 min</text>
            <text x="165" y="238" text-anchor="middle" class="t-sm">= adrenal insufficiency (treat as usual)</text>
          </svg>
      - kind: check
        page: 73
        quote: "rifampin (increased clearance of cortisol)"
        question: "How does rifampin cause adrenal insufficiency in HIV?"
        options: ["Increases cortisol clearance", "Blocks steroid synthesis", "Destroys the gland", "Suppresses CRH"]
        answer: 0
        why:
          - "صح: بيزوّد الـ clearance."
          - "ده الـ ketoconazole."
          - "ده الـ CMV مثلًا."
          - "مش مذكور."
      - kind: explain
        page: 74
        quote: "B- Hypogonadism The most common abnormality of endocrine function."
        title: "أكتر abnormality: الـ hypogonadism"
        text: |
          - ==Hypogonadism== = **أكتر abnormality** في الـ HIV (والـ adrenal = **أكتر غدة** بتتأثر؛ ما تخلطش).
          - Libido قليل في **أكتر من النص**، و impotence مع T واطي لحد **30%**.
          - الـ gonadotrophins واطية أو طبيعية = central، والـ pituitary بيرد طبيعي على الـ GnRH = **hypothalamic**. وفي دراسات LH و FSH عاليين = primary testicular.
          - أدوية: ketoconazole، ganciclovir، megestrol، acyclovir.
          - الستات: menstrual irregularities.
      - kind: explain
        page: 74
        quote: "Thyroid function remains remarkably normal throughout the course of HIV disease."
        title: "الغدة الدرقية والأملاح"
        text: |
          - الـ thyroid ==طبيعية بشكل ملفت==، مع **TBG عالي**. حتى لو اتغزت بـ CMV أو PCP أو Kaposi أو lymphoma، غالبًا euthyroid.
          - بس الـ hypothyroidism سبب **قابل للعلاج** للتعب والـ failure to thrive، فاكشف عليه. والـ rifampin بيزوّد الـ T4 clearance.
          - **Hyponatraemia** = أشيع electrolyte disturbance.
          - Hypercalcaemia مع الـ lymphoma؛ hypocalcaemia من **amphotericin** (Mg wasting) و **foscarnet** (↓ ionised Ca).
          - البنكرياس متأثر في **35%** في التشريح، بس الـ type 1 DM نادر.
      - kind: explain
        page: 67
        quote: "Testicular atrophy & gynecomastia are present in about 50% of men with cirrhosis"
        title: "الخصية والـ cirrhosis"
        text: |
          الأمراض اللي بتأثر على الخصية: CRF، cirrhosis، sickle، non-specific illness (عمليات، MI، حروق)، HIV (T واطي في 35-50%، والـ SHBG بيداري)، **febrile illness** (sperm يقل مؤقتًا والـ T سليم)، و coeliac.

          في الـ ==cirrhosis==: عيب في الخصية والـ pituitary، مستقل عن الكحول. الـ LH عالي بس **أقل من المتوقع** لأن الـ ==oestrogen بيكبته==. الـ oestrogen عالي لأن الكبد مش بيسحب الـ androstenedione، فبيتحول برا لـ oestrone و oestradiol. Atrophy و gynaecomastia في **50%**، والـ **liver transplant** بيرجّع كل ده.
      - kind: match
        page: 69
        quote: "Impaired sexual development & testicular atrophy are present in about 1/3 of pts."
        prompt: "وصّل الرقم بالمرض:"
        pairs:
          - ["Sickle cell: testicular atrophy", "About 1/3"]
          - ["Cirrhosis: atrophy and gynaecomastia", "About 50%"]
          - ["HIV: low testosterone", "35–50%"]
          - ["Lepromatous leprosy: atrophy", "10–20%"]
          - ["Haemochromatosis: diabetes", "About 65%"]
        why: "وفي الـ CRF: gynaecomastia حوالي 50%، و impotence حوالي 50% (ص 68)."
      - kind: explain
        page: 67
        quote: "It occurs in about 65% of pts due to direct damage of the pancreatic islets by iorn deposition."
        title: "متفرقات"
        text: |
          - ==Haemochromatosis==: DM في **65%** (الحديد في الـ islets)، **hypogonadism** في الجنسين وبيسبق باقي الأعراض، و Addison's.
          - **Cystinosis**: hypothyroidism، IDDM، delayed puberty.
          - **Amyloidosis**: بيتسلل للغدد بس **نادرًا** يعمل dysfunction. والـ islet amyloid في الـ type 2 DM من الـ **islet amyloid polypeptide**.
      - kind: explain
        page: 68
        quote: "The elevated LH level is due to production & reduced clearance but does not restore normal testosterone production."
        title: "ص 68-72: مراجعة الكتاب"
        text: |
          الكتاب بيعيد كلام قبل كده، بس فيه إضافات:
          - **CRF** (ص 68): الـ LH عالي من production + clearance قليل؛ gynaecomastia و impotence في ~50%؛ الـ dialysis تحسينه ناقص والزرع ممكن يرجّع الخصية.
          - **Uraemia** (ص 69): LH قليل في البول، و LH subtypes أقل حمضية و bioactive.
          - **Glucose** (ص 70): أكتر من 50% من الـ azotaemic عندهم fasting hyperglycaemia، و spontaneous hypoglycaemia، والـ transplant بيعمل **post-transplant DM**.
          - **Oestrogen** (ص 72): بيرفع الـ TG شوية وبيزوّد الـ coagulability.
          - والـ thyroid والقلب (ص 71-73) نفس الدرس التاني بالظبط.
      - kind: aside
        tone: exam
        page: 76
        quote: "Patient with Celiec disease have elevated serum testosterone, LH levels as well as androgen resistance."
        text: "الكتاب بيختم بالـ coeliac تاني (T و LH عاليين = androgen resistance)، وبعدين 13 سؤال. كل سؤال منهم موجود كـ essay في الـ practice، بالـ outline اللي هتكتبه في الامتحان."
      - kind: try
        items: [endo.L04.148, endo.L04.153, endo.L04.159, endo.L04.164, endo.L04.174]
    recap:
