  - id: hb.L15.lesson6
    title: "Chronic pancreatitis: الحريقة اللي مبتطفيش"
    hook: "وجع، إسهال دهني، وسكر: تلات مشاكل من عضو واحد اتحرق. وليه الجين اللي بيزوّد والجين اللي بيقلّل بيعملوا نفس المرض."
    minutes: 9
    pages: [292, 298]
    topics: [chronic]
    goals:
      - "تعدّ أسباب الـ CP وتفهم جينات الـ hereditary"
      - "تختار التحليل والأشعة المناسبة للتشخيص"
      - "تعالج المشاكل التلاتة: pain و steatorrhea و diabetes"
    status: unverified
    steps:
      - kind: explain
        page: 292
        title: "التعريف والأسباب"
        text: |
          الـ **chronic pancreatitis**: recurrent parenchymal inflammation and **fibrosis**.

          الفرق عن الـ acute: الـ acute حريقة وبتطفي والغدة ترجع زي ما كانت. الـ chronic حرايق ورا بعض، وكل مرة بتسيب ندبة (fibrosis) مكان النسيج الشغال، لحد ما الغدة تضمر وتتكلّس.

          **Main causes** (لاحظ إن كتير منها هي هي أسباب الـ acute، بس بتتكرر):
          - **Alcohol abuse**: 70%، و **idiopathic**: 20%.
          - **Metabolic**: hypercalcemia، hyperlipoproteinemia.
          - تشريحي: pancreas divisum، annular pancreas (من الدرس الأول).
          - **Autoimmune**.
          - **Hereditary pancreatitis**: gain-of-function في **PRSS1** (cationic trypsinogen)، و loss-of-function في **CTRC** (chymotrypsin C) و **SPINK1** (pancreatic secretory trypsin inhibitor).
      - kind: reveal
        page: 293
        prompt: "إزاي **gain** of function في جين و **loss** of function في جين تاني يعملوا نفس المرض؟"
        answer: |
          افتكر الدرس الأول: البنكرياس عايش على توازن بين trypsin نشط وفرامل بتوقفه.

          - **PRSS1 gain**: trypsinogen زيادة أو أصعب في الإيقاف، يعني بنزين أكتر.
          - **SPINK1 loss**: **الـ inhibitor** قلّ، يعني فرامل أقل.
          - **CTRC loss**: الـ chymotrypsin C بيساعد يكسّر الـ trypsin الزيادة، فلما يقل الـ trypsin يفضل.

          التلاتة بيميلوا الكفة ناحية **trypsin نشط جوه البنكرياس** = self-digestion متكررة. (الشرح ده physiology مقبولة، والكتاب بيدّي الجينات ونوع الطفرة.)
      - kind: match
        page: 293
        prompt: "وصّل كل جين بالبروتين ونوع الطفرة:"
        pairs:
          - ["PRSS1", "Cationic trypsinogen, gain of function"]
          - ["CTRC", "Chymotrypsin C, loss of function"]
          - ["SPINK1", "Trypsin inhibitor, loss of function"]
        why: "الـ PRSS1 هو الوحيد الـ **gain**. الاتنين التانيين حماية بتضيع (**loss**)."
      - kind: explain
        page: 293
        title: "شكله"
        text: |
          الكتاب بيعرض الصورة الإكلينيكية في جدول، وهي 3 حاجات:
          - **Abdominal pain**: في حوالي 95%. **Steady, epigastric**، وغالبًا بيروح للضهر. ده مختلف عن وجع الـ acute المفاجئ الحاد.
          - **Maldigestion**: إسهال دهني ونزول وزن.
          - **Diabetes**.

          الوجع ممكن يغيب في نوعين، وبيظهروا أول حاجة بـ **diabetes mellitus**:
          - **Senile chronic pancreatitis**: في الكبار.
          - **Tropical pancreatitis**.

          **CP ولا cancer؟** الأعراض متداخلة (jaundice، pain، weight loss). اللي يرجّح **cancer**:
          - مفيش alcohol.
          - سن أكبر (60–70).
          - **Constitutional symptoms** واضحة.

          وخلي بالك إن الـ CP نفسه بيزوّد خطر الـ adenocarcinoma، فالاتنين ممكن يبقوا مع بعض.
      - kind: figure
        page: 296
        title: "عضو واحد، 3 مشاكل"
