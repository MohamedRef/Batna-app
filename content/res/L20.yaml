    - Risk factor frequency
  - - Retrospective cohort
    - Risk factor + / − in the past
    - Disease incidence
  - - Prospective cohort
    - Risk factor + / − now, followed forward
    - Disease incidence
  - - Clinical trial
    - Treated / not treated
    - Disease incidence
  blanks:
  - - 0
    - 2
  - - 1
    - 2
  - - 2
    - 2
  - - 3
    - 2
