  # ------------------------------------------------------------------
  - id: geri.L13.lesson1
    title: "الـ palliative care مش آخر محطة"
    hook: "ناس كتير فاكرة إن الـ palliative care يعني «خلاص مفيش أمل». الكتاب بيقول العكس: ممكن تبدأ يوم التشخيص."
    minutes: 7
    pages: [220, 222]
    topics: [definition, team]
    goals:
      - "تعرّف الـ palliative care وتعرف إنها مش مربوطة بمرحلة"
      - "تعرف أعضاء الفريق والأمراض غير السرطان اللي بتحتاجها"
      - "تفهم ليه الشغل محتاج فريق كامل"
    status: unverified
    steps:
      - kind: explain
        page: 220
        quote: "Recognize the markers for initiation of palliative care in the elderly. Palliative care is a multidisciplinary approach to specialized medical care for people with serious illnesses. It focuses on providing patients with relief from the symptoms, pain, physical stress, and mental stress of a serious illness-whatever the diagnosis."
        title: "التعريف"
        text: |
          الـ ==palliative care== هي رعاية طبية متخصصة و **multidisciplinary** لأي حد عنده مرض خطير، بتخفف الأعراض والألم والضغط الجسدي والنفسي، **أيًا كان التشخيص**.

          الهدف: ==quality of life== أحسن للمريض **وللعيلة**.

          ليه «أيًا كان التشخيص»؟ التفسير المقبول (مش في الكتاب): المعاناة مش حكر على السرطان. الألم وضيق النفس والقلق والتعب بيحصلوا في القلب والرئة والكلى والأعصاب كمان، والـ palliative care بتعالج **المعاناة نفسها**، مش اسم المرض.
          والعيلة جوه الهدف عشان هي اللي شايلة الرعاية في البيت، ولو انهارت المريض هو اللي هيدفع التمن.
      - kind: reveal
        page: 221
        quote: "\"More generally, however, the term \"palliative care\" may refer to any care that alleviates symptoms, whether there is hope of a cure by other means; thus, palliative treatments may be used to alleviate the side effects of curative treatments, such as relieving the nausea associated with chemotherapy."
        prompt: "مريض لسه متشخّص بـ lymphoma وهيبدأ chemo بهدف الشفا. ينفع ياخد palliative care؟"
        answer: "أيوه. الـ palliative care تنفع **في أي سن وأي مرحلة**، كهدف أساسي أو ==جنب العلاج الشافي==. مثال الكتاب: علاج الـ nausea بتاعة الـ chemo نفسه palliative."
      - kind: explain
        page: 220
        quote: "It is appropriate at any age and at any stage in a serious illness and can be provided as the main goal of care or along with curative treatment. Therefore, although it is an important part of end-of-life care, it is not limited to that stage. Palliative care can be provided across multiple settings including in hospitals, in the patient's home, as part of community palliative care programs, and in skilled nursing facilities."
        title: "فين وإمتى؟"
        text: |
          بتتقدّم في:
          - المستشفى.
          - **بيت المريض**.
          - برامج الـ community palliative care.
          - الـ skilled nursing facilities.

          ومؤشرها: أي ==serious illness== معاه **distress** جسدي أو نفسي أو اجتماعي أو روحي، من المرض أو من العلاج.

          ليه البيت والـ community؟ التفسير المقبول (مش في الكتاب): أغلب المرضى دول عايشين مع المرض **شهور وسنين** برا المستشفى. لو الرعاية دي موجودة جوه المستشفى بس، هيتحرموا منها في أطول فترة من مرضهم.
          والمؤشر هو الـ **distress**، مش المرحلة. يعني مريض في أول التشخيص بس متعذب من أعراض العلاج يستاهلها، ومريض متقدم بس مرتاح ممكن مايحتاجش أكتر من متابعة.
      - kind: explain
        page: 221
        quote: "A World Health Organization (WHO) statement describes palliative care as \"an approach that improves the quality of life of patients and their families facing the problems associated with life-threatening illness, through the prevention and relief of suffering by means of early identification and impeccable assessment and treatment of pain and other problems, physical, psychosocial and spiritual."
        title: "تعريف الـ WHO"
        text: |
          الـ World Health Organization (WHO): بتحسّن حياة المرضى **وعيلاتهم** اللي بيواجهوا ==life-threatening illness==، بالوقاية من المعاناة وتخفيفها عن طريق:
          - **early identification**.
          - **impeccable assessment** وعلاج الألم والمشاكل التانية: جسدية، نفسية، وروحية.

          ليه **early identification**؟ التفسير المقبول (مش في الكتاب): المشكلة اللي بتتلقط بدري بتتعالج أسهل: ألم بسيط النهارده أسهل بكتير من ألم شديد بعد أسبوع، وقلق صغير أسهل من اكتئاب كامل.
          ولاحظ إن الـ WHO حطّت الجسدي والنفسي والروحي جنب بعض. يعني الألم مش «عرض جسدي» وخلاص؛ الخوف والوحدة بيزوّدوه.
      - kind: explain
        remind: [geri.L13.007]
        page: 221
        quote: "Palliative care team:\n  Physicians.\n  Nurses.\n  Physiotherapists.\n  Occupational therapists.\n  Pharmacists.\n  Chaplains.\n  Social workers.\n  Psychologists.\n  Nutritionists and other health professionals who work together with the primary care physician and referred specialists"
        title: "الفريق"
        text: |
          فريق كامل، مش دكتور لوحده:
          - **Physicians** و **nurses**.
          - Physiotherapists و occupational therapists.
          - Pharmacists.
          - ==Chaplains== (رجل الدين، للـ spiritual care).
          - Social workers و psychologists.
          - Nutritionists.

          ليه فريق كامل مش دكتور لوحده؟ التفسير المقبول (مش في الكتاب): المشاكل اللي بيعالجوها نفسها أنواع (جسدية، نفسية، اجتماعية، روحية زي ما قالت الـ WHO). الدكتور يظبط الـ morphine، بس مش هيعرف يرجّع للمريض حركته زي الـ physiotherapist، ولا يحل مشكلة مصاريف العيلة زي الـ social worker، ولا يرد على سؤال «ليه أنا؟» زي الـ chaplain.
          والفريق بيشتغل **مع** طبيب الـ primary care والأخصائيين اللي محوّلين المريض، مش بداله.
      - kind: explain
        remind: [geri.L13.008]
        page: 222
        quote: "Renal disease.\nChronic heart failure.\nHIV/AIDS.\nProgressive neurological conditions."
        title: "مش للسرطان بس"
        text: |
          زمان كانت مرتبطة بالسرطان، دلوقتي بتتعمل أكتر في:
          - Chronic progressive **pulmonary** disorders.
          - **Renal** disease.
          - Chronic ==heart failure==.
          - HIV/AIDS.
          - Progressive **neurological** conditions (ALS، multiple sclerosis (MS)).

          وفيه مجال بيكبر بسرعة: ==pediatric palliative care== للأطفال.

          ليه الأمراض دي بالذات؟ التفسير المقبول (مش في الكتاب): كلها مزمنة وبتتقدم ببطء، والمريض بيعيش معاها سنين بأعراض صعبة: ضيق نفس في الرئة والقلب، تعب وحكة في الكلى، ضعف وعجز في الأعصاب. النتيجة: نفس احتياج مريض السرطان للرعاية دي، وأحيانًا لمدة أطول.
      - kind: check
        page: 221
        quote: "Palliative care team:\n  Physicians.\n  Nurses.\n  Physiotherapists.\n  Occupational therapists.\n  Pharmacists.\n  Chaplains.\n  Social workers.\n  Psychologists.\n\n  Nutritionists and other health professionals who work together with the primary care physician and referred specialists"
        question: "A dying patient keeps asking why God let this happen to him. Which team member is listed for this need?"
        options: ["Chaplain", "Pharmacist", "Occupational therapist", "Nutritionist"]
        answer: 0
        why:
          - "صح: الـ chaplain من الفريق، وده الـ spiritual care."
          - "الصيدلي للأدوية، مش للسؤال الروحي."
          - "الـ occupational therapist للأنشطة اليومية."
          - "الـ nutritionist للأكل."
      - kind: check
        page: 221
        quote: "\"More generally, however, the term \"palliative care\" may refer to any care that alleviates symptoms, whether there is hope of a cure by other means; thus, palliative treatments may be used to alleviate the side effects of curative treatments, such as relieving the nausea associated with chemotherapy."
        question: "Which is a palliative treatment by the book's definition?"
        options: ["Antiemetic for chemotherapy nausea", "The chemotherapy itself", "Surgery to remove the tumour", "Radiotherapy to cure the lymphoma"]
        answer: 0
        why:
          - "صح: أي حاجة بتخفف الأعراض، حتى أعراض العلاج الشافي، palliative."
          - "الـ chemo هنا شافي (curative)."
          - "الجراحة الاستئصالية curative."
          - "الـ radiotherapy بهدف الشفا curative."
      - kind: aside
        tone: analogy
        page: 220
        quote: "It is appropriate at any age and at any stage in a serious illness and can be provided as the main goal of care or along with curative treatment. Therefore, although it is an important part of end-of-life care, it is not limited to that stage. Palliative care can be provided across multiple settings including in hospitals, in the patient's home, as part of community palliative care programs, and in skilled nursing facilities."
        text: "فكّر فيها زي **مكيف العربية**: مش هو اللي بيوصّلك، بس بيخلّي الرحلة تتحمل. ينفع يشتغل من أول الطريق، مش لما تقرّب على النهاية."
      - kind: try
        items: [geri.L13.001, geri.L13.003, geri.L13.007, geri.L13.009, geri.L13.060]
    recap:
      - "Multidisciplinary، لأي serious illness، أيًا كان التشخيص؛ الهدف quality of life للمريض والعيلة."
      - "أي سن وأي مرحلة، لوحدها أو جنب الـ curative؛ المؤشر هو الـ distress."
      - "المستشفى، البيت، community programs، skilled nursing."
      - "الفريق: أطباء، تمريض، PT/OT، صيدلي، chaplain، social worker، psychologist، nutritionist، مع الـ primary care."
      - "مش سرطان بس: رئة، كلى، HF، HIV، أعصاب، والأطفال."
    practice: [geri.L13.001, geri.L13.002, geri.L13.003, geri.L13.004, geri.L13.005, geri.L13.006, geri.L13.007, geri.L13.008, geri.L13.009, geri.L13.060]
