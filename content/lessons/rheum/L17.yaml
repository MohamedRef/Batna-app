  # Split from lesson1 on 2026-11-13 (#828): aetiology and pathology.
  - id: rheum.L17.lesson6
    title: "الـ AS جاي منين؟ HLA-B27 والأمعاء والـ enthesis"
    hook: "90% من العيانين عندهم HLA-B27، بس هو لوحده بيفسّر خُمس الحكاية بس. الباقي في genes تانية والأمعاء."
    minutes: 8
    pages: [280, 282]
    topics: [etiology, pathology]
    goals:
      - "تفهم دور HLA-B27 و ERAP-1 ومحور IL-23/IL-17"
      - "تشرح الـ gut–joint axis"
      - "تعرف ليه الـ AS بيلحم بدل ما يتآكل"
    status: unverified
    steps:
      - kind: explain
        page: 280
        title: "مرض مناعي، والسبب لسه مش مفهوم كله"
        quote: "Genetic factors influencing antigen presentation (HLA –B27) and the IL- 23/17 A pathway confer predisposition to AS."
        text: |
          الكتاب صريح: الـ AS ==complex immune-mediated== والـ pathogenesis **مش مفهوم كله**. السبب مجهول، بس فيه **genetic** و **environmental** factors مع بعض.

          والـ genes اللي بتدّي الاستعداد ليها شغلانتين:
          - **Antigen presentation**: الـ HLA-B27 (وجنبه الـ ERAP-1 اللي بيجهّز الـ peptides).
          - محور ==IL-23/IL-17A==.

          يعني الحكاية زي الـ RA: **gene** بيجهّز الأرض، و **شرارة** من برّه (هنا الأمعاء أو الـ urethra)، ومناعة بتكمّل. الفرق إن المكان enthesis مش synovium.
      - kind: explain
        page: 281
        title: "الـ HLA-B27 بالأرقام"
        quote: "It is present in1% in the general population & in 20% of relatives of AS patients. HLA‐B27 positive persons carry a 20 fold-increased risk of developing SpA."
        text: |
          - موجود في ==90-95%== من عيانين الـ AS
          - في **1%** من الناس العاديين، و **20%** من قرايب العيانين
          - اللي عنده HLA-B27 عنده risk **20 ضعف**
          - بس مسؤول عن **حوالي 20%** بس من الـ heritability

          الفكرة: الـ HLA-B27 (class I major histocompatibility complex (MHC)) بيقدّم antigen للـ ==CD8+ T cells==، فالمناعة تهاجم الـ fibrocartilage أو الـ cartilage.

          يعني الـ HLA-B27 موجود عند كل عيان تقريبًا، بس أغلب اللي عندهم HLA-B27 (1% من الناس) مش هيجيلهم AS. علشان كده التحليل بيساعد بس مش بيشخّص لوحده.
      - kind: aside
        tone: trap
        page: 281
        quote: "However, the overall contribution of HLA-B27 to AS heritability is only ~20%, indicating that other genetic influences contribute to AS."
        text: "متلخبطش الرقمين: **90-95%** من عيانين الـ AS عندهم HLA-B27، بس الـ HLA-B27 بيفسّر **20%** بس من الـ **heritability**. يعني فيه genes تانية."
      - kind: reveal
        page: 281
        quote: "ERAP-1 is involved in trimming peptides to optimal length for binding to HLA class 1 molecules (including HLA-B27)."
        prompt: "ليه الـ ERAP-1 والـ HLA-B27 الاتنين في نفس المرض؟"
        answer: |
          الكتاب بيقول الـ ==ERAP-1== بيقص الـ peptides على **الطول المظبوط** علشان تقعد على الـ HLA class I، ومنها الـ HLA-B27.

          يعني الاتنين في **نفس الخط**: الـ ERAP-1 بيحضّر الأكل، والـ HLA-B27 بيقدّمه للـ **CD8+ T cells**. التفسير المقبول (مش في الكتاب): لو الاتنين متغيّرين، الـ peptides اللي بتتعرض بتبقى غلط، والـ T cell يشوفها غريبة ويهاجم الـ fibrocartilage. وده بيشرح ليه الـ HLA-B27 لوحده بيفسّر **20%** بس من الـ heritability: genes زي ERAP-1 والـ IL-23/IL-17 بتكمّل الباقي.
      - kind: figure
        page: 281
        quote: "Genetic variations in endoplasmic reticulum (ER) aminopeptidase 1(ERAP-1) are also associated with AS. ERAP-1 is involved in trimming peptides to optimal length for binding to HLA class 1 molecules (including HLA-B27)."
        title: "من الـ gene للالتهاب"
        alt: "Vertical chain: ERAP-1 trims peptides; HLA-B27 presents them to CD8+ T cells; IL-23 activates Th17 cells; IL-17A drives inflammation at the enthesis. A side box shows the gut: Klebsiella, dysbiosis and subclinical gut inflammation in 60% feed the same process."
        caption: "الـ ==ERAP-1== بيقص الـ peptides على مقاس الـ **HLA-B27**. والمحور التاني **IL-23 → Th17 → IL-17A**. والأمعاء (dysbiosis) بتصب في نفس النار."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R17a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="10" y="10" width="200" height="44" rx="8" class="fg-box"/>
            <text x="20" y="30" class="t-b">ERAP-1</text>
            <text x="20" y="46" class="t-sm">trims peptides</text>
            <path d="M110 54 L110 74" class="fg-arrow" marker-end="url(#R17a)"/>
            <rect x="10" y="76" width="200" height="44" rx="8" class="fg-acc"/>
            <text x="20" y="96" class="t-b">HLA-B27 (class I)</text>
            <text x="20" y="112" class="t-sm">presents to CD8+ T cells</text>
            <path d="M110 120 L110 140" class="fg-arrow" marker-end="url(#R17a)"/>
            <rect x="10" y="142" width="200" height="44" rx="8" class="fg-acc"/>
            <text x="20" y="162" class="t-b">IL-23 → Th17</text>
            <text x="20" y="178" class="t-sm">IL-17A-producing CD4+ cells</text>
            <path d="M110 186 L110 206" class="fg-arrow" marker-end="url(#R17a)"/>
            <rect x="10" y="208" width="310" height="50" rx="8" class="fg-bad"/>
            <text x="20" y="229" class="t-b">Enthesitis, osteitis, synovitis</text>
            <text x="20" y="247" class="t-sm">heals with fibrosis and ankylosis</text>
            <rect x="222" y="10" width="98" height="176" rx="8" class="fg-thin"/>
            <text x="232" y="32" class="t-b">Gut</text>
            <text x="232" y="54" class="t-sm">Klebsiella</text>
            <text x="232" y="74" class="t-sm">Chlamydia</text>
            <text x="232" y="94" class="t-sm">prostatitis</text>
            <text x="232" y="122" class="t-sm">dysbiosis</text>
            <text x="232" y="142" class="t-sm">gut inflamed</text>
            <text x="232" y="162" class="t-sm t-b">in 60%</text>
            <path d="M270 186 L270 206" class="fg-arrow" marker-end="url(#R17a)"/>
            <rect x="10" y="270" width="310" height="50" rx="8" class="fg-box"/>
            <text x="20" y="291" class="t-sm">HLA-B27: 90-95% of AS, 1% of public,</text>
            <text x="20" y="308" class="t-sm">20-fold risk, ~20% of heritability</text>
          </svg>
      - kind: explain
        page: 282
        title: "البيئة: الأمعاء"
        quote: "Moreover, subclinical gut inflammation is observed in 60% of patients with AS, implicating a potential gut–joint axis in AS pathogenesis."
        text: |
          الـ infection ممكن تكون الشرارة: **Klebsiella** في البراز، chronic prostatitis، و **chlamydia** في الـ urethra.

          و ==60%== من عيانين الـ AS عندهم subclinical gut inflammation: محور ==gut-joint==. الـ **dysbiosis** بيبوّظ الحاجز المخاطي ويطلّع cytokines.

          علشان كده الـ reactive arthritis بييجي بعد dysentery، والـ SpA مرتبط بالـ IBD: نفس الباب.
      - kind: reveal
        page: 282
        quote: "Dysbiosis impairs the gut mucosal barrier &leads to disorder of intestinal mucosal immunity, resulting in increased pro-inflammatory cytokines."
        prompt: "إيه علاقة الأمعاء بضهر الـ AS؟"
        answer: |
          الكتاب بيرسم السلسلة:
          - **Dysbiosis** (البكتيريا الطبيعية في الأمعاء متلخبطة)
          - ← الـ ==gut mucosal barrier== يضعف
          - ← مناعة الغشاء المخاطي تتلخبط
          - ← **pro-inflammatory cytokines** تزيد.

          و **60%** من العيانين عندهم subclinical gut inflammation، فده ==gut–joint axis==. التفسير المقبول (مش في الكتاب): الـ cytokines والخلايا المتنشّطة في الأمعاء بتلف في الدم وتوصل للـ enthesis. علشان كده الـ SpA مرتبط بالـ IBD، وعلشان كده الـ calprotectin (ص 285) بيتعمل.
      - kind: explain
        page: 282
        title: "الـ pathology: الـ enthesis الأول"
        quote: "The enthesis is thought to be the primary site of pathology (annulus fibrosis of intervertebral discs, the tendon Achilles)."
        text: |
          المكان الأساسي ==enthesis==: الـ **annulus fibrosus** بتاع الـ discs، والـ **Achilles**.

          وكمان: subchondral bone (**osteitis**)، الـ periosteum (**periostitis**)، والـ synovium (synovitis).

          الالتهاب بيخف بـ ==fibrosis و ankylosis==: المفصل يلحم.

          يعني المرض بيبدأ عند الأربطة مش جوّه المفصل، وده السبب إن الـ Achilles والكعب بيوجعوا في الـ SpA.
      - kind: reveal
        page: 282
        quote: "Inflammation usually heals with fibrosis and ankylosis of the affected joint."
        prompt: "ليه الـ AS بيخلّص بـ ankylosis، والـ RA بـ erosions و deformity؟"
        answer: |
          الكتاب: الالتهاب في الـ AS ==usually heals with fibrosis and ankylosis==، والمكان الأساسي الـ **enthesis**: الـ annulus fibrosus والـ Achilles.

          التفسير المقبول (مش في الكتاب): الـ enthesis مكان ما الرباط داخل في العضم، فلما يلتهب ويخف، الجسم بيصلّحه بنسيج ليفي وبعدين **عضم جديد** ممتد في اتجاه الرباط. ده بالظبط الـ **syndesmophyte**: عضم بيطلع **رأسي** من الـ annulus fibrosus ويربط الفقرة باللي بعدها. وده سؤال الكتاب نفسه في ص 300: الـ syndesmophytes سببها ==inflammation of the entheses leading to new bone formation==.
      - kind: check
        page: 282
        quote: "The enthesis is thought to be the primary site of pathology (annulus fibrosis of intervertebral discs, the tendon Achilles)."
        question: "What is the primary site of pathology in ankylosing spondylitis?"
