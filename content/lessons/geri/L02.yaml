        answer: 0
        why:
          - "صح: 60 × 50 ÷ 72 = 41.7، × 0.85 = 35.4."
          - "نسيت الـ 0.85 بتاع الستات."
          - "60 ده (140 − age) بس."
          - "الكرياتينين 1.0 مش معناه كلية طبيعية."
      - kind: explain
        page: 34
        title: "Cystatin C: الـ marker اللي ما بيتأثرش"
        quote: "Cystatin-C\n  It is a protease inhibitor, single chain Pr. 13 KD.\n  Synthesized by all nucleated cells, not affected by inflammation.\n  Cleared by glomerular filtration, no tubular secretion.\n  Does not reenter the circulation.\n  Constant level in blood.\n  Ideal marker for GFR.\n  It increases as GFR decreases.\n  Independent of gender, age or body mass."
        text: |
          **Cystatin C** = protease inhibitor، single-chain protein حجمه **13 kD**:
          - بيتعمل من ==كل الـ nucleated cells== بمعدل ثابت، ومش بيتأثر بالـ inflammation.
          - بيتفلتر بالـ glomerulus، **من غير tubular secretion**، ومش بيرجع للدم.
          - مستواه ثابت، و**بيعلى لما الـ GFR يقل**.
          - ==Independent of gender, age, body mass==: ده بالظبط اللي الكرياتينين بيفشل فيه.

          وفي دراسة Fliser: الكبار CrCl حوالي **74** مقابل **114** للشباب، والـ cystatin **0.84** مقابل **0.69** mg/L.

          ليه كل صفة من دول مهمة؟ الـ marker المثالي لازم يتعمل **بمعدل ثابت** ويخرج **بالفلترة بس**. لو اتعمل بمعدل ثابت، أي زيادة في الدم معناها إن الفلترة قلّت. والكرياتينين بيفشل في الشرط الأول لأنه مربوط بالعضلات، وبيفشل شوية في التاني لأن الـ tubules بتفرز منه.
      - kind: sort
        page: 34
        quote: "Cystatin-C\n  It is a protease inhibitor, single chain Pr. 13 KD.\n  Synthesized by all nucleated cells, not affected by inflammation.\n  Cleared by glomerular filtration, no tubular secretion.\n  Does not reenter the circulation.\n  Constant level in blood.\n  Ideal marker for GFR.\n  It increases as GFR decreases.\n  Independent of gender, age or body mass."
        prompt: "مين بيتأثر بإيه؟"
        bins: ["Creatinine", "Cystatin C"]
        cards:
