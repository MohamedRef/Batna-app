        title: "الـ somatostatinoma"
        text: |
          ورم الـ **δ-cells**، نادر وغالبًا malignant، في البنكرياس أو الـ duodenum. Mets حوالي 50%.

          - Resection ← 95% 5-year، ومع mets ← 60%.
