  - id: neph.L04.lesson1
    title: "قيس الضغط صح الأول"
    hook: "نص الـ hypertension اللي بتشوفها في العيادة ممكن تكون غلطة cuff أو قعدة. ابدأ من هنا."
    minutes: 8
    pages: [80, 81]
    topics: [measurement]
    goals:
      - "تقيس الضغط صح وتعرف ليه كل قاعدة"
      - "تفكّر في الـ coarctation لو الضغط عالي جدًا أول مرة"
      - "تعرف الـ dipper والـ salt-sensitive والـ thresholds وليه"
    status: unverified
    steps:
      - kind: explain
        page: 80
        title: "Brain chips في القياس"
        quote: "Sitting 5 minuts Legs on the ground Arm at level of the heart Cuff = 80% of The arm = be careful for ascultatory gap Hypertension must be diagnosed on two measurements one week apart"
        text: |
          - **قاعد 5 دقايق**، رجليه على الأرض، ودراعه في ==مستوى القلب==.
          - الـ **cuff = 80%** من الدراع.
          - خلي بالك من الـ **auscultatory gap**، والـ inflation ما يوجعش، والزئبق ينزل بمعدل مظبوط.
          - قارن الدراعين، وفكّر في الـ **atrial fibrillation (AF)**، واعرف تعيد النفخ من أنهي مستوى.

          والتشخيص لازم يكون على ==two measurements one week apart==.
      - kind: explain
        page: 80
        quote: "Hypertension must be diagnosed on two measurements one week apart"
        title: "ليه كل قاعدة من دول؟"
        text: |
          الكتاب: قاعد **5 دقايق**، رجليه على الأرض، الدراع في **مستوى القلب**، cuff = **80%** من الدراع، خلي بالك من الـ **auscultatory gap**، والتشخيص على **قراءتين بينهم أسبوع** (two measurements one week apart).

          التفسير المقبول (مش في الكتاب):

          - **5 دقايق قعدة:** الحركة والكلام بيشغّلوا الـ sympathetic، **فـ** الرقم الأول بيطلع أعلى من الحقيقة.
          - **الدراع في مستوى القلب:** لو الدراع واطي، عمود الدم فوقه **بيزوّد** الرقم؛ لو عالي، الرقم يقل.
          - **الـ auscultatory gap:** في بعض العيانين الأصوات بتختفي فترة وترجع. لو نفخت لحد جوه الفجوة بس، هتاخد الـ systolic **أقل** من الحقيقة. عشان كده انفخ لحد ما النبض يختفي بالجس الأول.
          - **قراءتين بينهم أسبوع:** الضغط بيتهز من يوم ليوم، **فـ** قراءة واحدة ممكن تلزق تشخيص وعلاج مدى الحياة غلط.
      - kind: reveal
        page: 80
        quote: "Cuff = 80% of The arm = be careful for ascultatory gap Hypertension must be diagnosed on two measurements one week apart"
        prompt: "ليه الـ cuff الصغير على دراع تخين بيدي رقم عالي؟"
        answer: |
          الـ **cuff** الضيق محتاج ضغط أعلى علشان يقفل الشريان تحت نسيج كتير، فالقراءة تطلع **أعلى من الحقيقة**.

          وده بالظبط سبب من أسباب الـ **pseudoresistance** اللي هنشوفها: **small cuff in obese patients**. (الشرح فسيولوجي؛ الـ 80% من الكتاب.)
      - kind: explain
        page: 80
        title: "أول زيارة والضغط عالي جدًا"
        quote: "Femoral pulse delay Coarctation Leriche syndrome Aortitis → tachayassu syndrome"
        text: |
          قيس في **مكان تاني**، وجسّ الـ **femoral pulse**. لو فيه ==femoral pulse delay== فكّر في:
          - **Coarctation**
          - **Leriche syndrome**
          - **Aortitis**: Takayasu

          الخطوة الجاية بتشرح **ليه** الـ femoral delay بيشاور على المشاكل دي.
      - kind: explain
        page: 80
        quote: "Femoral pulse delay"
        title: "ليه الـ femoral delay بيقولك coarctation؟"
        text: |
          الكتاب: لو أول زيارة الضغط **عالي جدًا**، قيس في **مكان تاني** ودوّر على **femoral pulse delay**: coarctation، Leriche، أو aortitis (Takayasu).

          التفسير المقبول (مش في الكتاب): الأمراض التلاتة دول بيضيّقوا الـ **aorta** أو فروعها. الدم بيعدّي الضيق ببطء، **فـ** النبض في الفخذ يوصل **متأخر وأضعف** من الرسغ. والدراع اللي **قبل** الضيق ضغطه عالي، والرجل اللي **بعده** ضغطها واطي. يعني القياس في مكان تاني بيكشف إن المشكلة في الأنبوبة مش في الجسم كله.
      - kind: explain
        page: 81
        title: "Dipper و salt sensitive"
        quote: "Dipper – non dipper : MAB ↓10-20 mmHg at Mid night till→ 6 am"
        text: |
          - **Dipper:** الـ mean blood pressure (BP) بينزل **10–20 mmHg** من نص الليل لحد **6 الصبح**. اللي ما بينزلش = **non-dipper**.
          - ==Salt-sensitive hypertension (HT)==: الـ systolic blood pressure (SBP) يعلى **≥10 mmHg** مع الـ salt loading؛ أغلبه في **الكبار** و **African Americans**.
          - **Postural:** normal، orthostatic، و **supine** (في الـ pregnancy والـ tumour).

          التفسير المقبول (مش في الكتاب): الـ **supine** hypertension في الحمل والـ tumour **لأن** الرحم أو الكتلة بيضغطوا على الأوعية الكبيرة وهو نايم على ضهره. والخطوة الجاية بتشرح ليه الـ dipper والـ salt-sensitive يهمّوا.
      - kind: explain
        page: 81
        quote: "Salt sensitive HT"
        title: "ليه الـ non-dipper والـ salt-sensitive يهمّوا؟"
        text: |
          الكتاب: الـ **dipper** بينزل **10–20 mmHg** بالليل، والـ **salt sensitive HT** بيعلى **≥ 10 mmHg** مع الملح، وأغلبه في **الكبار** و**African Americans**.

          التفسير المقبول (مش في الكتاب):

          - الأوعية والقلب **بيرتاحوا** بالليل. الـ non-dipper ضغطه عالي 24 ساعة، **فـ** الضرر على القلب والكلى والمخ أكتر. وغالبًا بيبقى عنده CKD أو sleep apnea.
          - الكبار عندهم nephrons أقل، والكلية بتطلّع الصوديوم بصعوبة، **عشان** كده الملح بيعلّي ضغطهم أكتر. ونفس الكلام في الناس اللي الـ renin عندهم واطي.
      - kind: aside
        tone: exam
        page: 81
        quote: "More than two thirds of hypertensive adults in the United States fail to reach the blood pressure (BP) goal of <140/90 mm Hg, and over 80% of patients in Canada and Europe show suboptimal BP control."
        text: |
          ==hypertension (HTN) paradox==: عدد العيانين **uncontrolled** بيزيد **رغم** تقدم العلاج. أكتر من **تلتين** في أمريكا مش واصلين لـ <140/90، وأكتر من **80%** في كندا وأوروبا control مش كويس.
      - kind: table
        page: 81
        quote: "| | SBP | DBP |\n| Office or Clinic | 140 | 90 |\n| 24-hour | 125-130 | 80 |\n| Day | 130-135 | 85 |\n| Night | 120 | 70 |\n| Home | 130-135 | 85 |"
        title: "الـ threshold بيختلف حسب طريقة القياس"
        columns: [Measurement, SBP, DBP]
        rows:
          - ["Office", "140", "90"]
          - ["24-hour", "125–130", "80"]
          - ["Day", "130–135", "85"]
          - ["Night", "120", "70"]
          - ["Home", "130–135", "85"]
        hide: [[0, 1], [1, 1], [3, 1], [3, 2], [4, 1]]
      - kind: explain
        page: 81
        quote: "Blood Pressure Thresholds (mmHg) for Definition of Hypertension with"
        title: "ليه الـ home والـ 24-hour أرقامهم أقل؟"
        text: |
          الكتاب (الـ **thresholds** حسب طريقة القياس): office **140/90**، 24-hour **125–130/80**، day و home **130–135/85**، night **120/70**.

          التفسير المقبول (مش في الكتاب): العيادة فيها توتر (**white-coat**)، **فـ** نفس العيان بيطلع رقمه أعلى هناك. القراءات في البيت والـ ambulatory بتتعمل وهو مرتاح وبتتجمّع من قراءات كتير، **يعني** رقمها الطبيعي أقل، والحد لازم يبقى أقل كمان. والليل أقل من النهار **لأن** الجسم نايم والـ sympathetic هادي.
      - kind: check
        page: 81
        quote: "| | SBP | DBP |\n| Office or Clinic | 140 | 90 |\n| 24-hour | 125-130 | 80 |\n| Day | 130-135 | 85 |\n| Night | 120 | 70 |\n| Home | 130-135 | 85 |"
        question: "Which ambulatory reading is hypertensive?"
        options:
          - "Night average 124/72"
          - "Day average 128/82"
          - "24-hour average 122/76"
          - "Home average 128/80"
        answer: 0
        why:
          - "صح: الـ night threshold = 120/70، و 124/72 فوقه."
          - "الـ day threshold 130–135/85؛ 128/82 تحته."
          - "الـ 24-hour threshold 125–130/80؛ 122/76 تحته."
          - "الـ home threshold 130–135/85؛ 128/80 تحته."
      - kind: try
        items: [neph.L04.001, neph.L04.009, neph.L04.012, neph.L04.002]
    recap:
      - "قاعد 5 دقايق، الدراع في مستوى القلب، cuff = 80% من الدراع، وقراءتين بينهم أسبوع."
      - "ضغط عالي جدًا أول مرة: قيس مكان تاني ودوّر على femoral delay (coarctation، Leriche، Takayasu)."
      - "Dipper ينزل 10–20 بالليل. Salt-sensitive = SBP ↑≥10 مع الملح."
      - "Thresholds: office 140/90، 24h 125–130/80، day و home 130–135/85، night 120/70."
    practice: [neph.L04.001, neph.L04.002, neph.L04.003, neph.L04.004, neph.L04.005, neph.L04.006, neph.L04.007, neph.L04.008, neph.L04.009, neph.L04.010, neph.L04.011, neph.L04.012, neph.L04.013]
