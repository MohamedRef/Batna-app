  - id: geri.L06.lesson5
    title: "علاج الـ hyperthyroidism والـ storm"
    hook: "اليود المشع أحسن من المشرط عند الكبير، بس لو ماحضّرتش الغدة قبله ممكن تولّع storm."
    minutes: 9
    pages: [103, 105]
    topics: [hyper-treatment, subclinical-hyper, storm]
    goals:
      - "تختار العلاج حسب السبب"
      - "ترتّب خطة الـ radioiodine وتعرف side effects الـ antithyroid drugs"
      - "تعرف إمتى تعالج الـ subclinical hyperthyroidism والـ storm"
    status: unverified
    steps:
      - kind: explain
        page: 103
        quote: "50-70% of hyperthyroidism is due to Graves' disease, and 30-40% due to toxic nodular goitre, and <5% due to thyroiditis"
        title: "على حسب السبب"
        text: |
          - **Graves'** 50-70%، **toxic nodular goitre** 30-40%، **thyroiditis** أقل من 5%.
          - ==Thyroiditis==: subacute (goitre بيوجع مع constitutional symptoms) أو silent lymphocytic (nodules صغيرة مابتوجعش). الـ uptake **decreased**، وهي **self-limiting**: supportive و**beta-blockers** بس.
      - kind: explain
        page: 103
        quote: "Radioiodine is preferred over surgery due to the increased morbidity and mortality associated with surgery."
        title: "دوا ولا ablation؟"
        text: |
          - الاختيارات: **antithyroid drugs** أو **ablation** (surgery أو radioiodine).
          - ==Radioiodine preferred== لأن الـ surgery فيها morbidity وmortality أعلى.
          - الـ **surgery**: toxic MNG كبيرة بـ **pressure symptoms**.
          - الأدوية: methimazole، carbimazole، propylthiouracil.
      - kind: order
        page: 103
        quote: "discontinuing 3-5 days prior to radioiodine ablation and restarting 3-5 days after radioablation is preferred in most centres."
        prompt: "رتّب خطة الـ radioiodine:"
        steps:
          - "Control with antithyroid drug"
          - "Stop it 3-5 days before"
          - "Radioiodine ablation"
          - "Restart it 3-5 days after"
          - "Monthly thyroid tests"
          - "TSH above normal: switch to thyroxine"
        why: "الـ antithyroid قبل الـ ablation بيمنع الـ **thyroid crisis**، وبتوقفه كام يوم حوالين اليود علشان مايقللش فعاليته. وبعدين أول ما الـ TSH يطلع، الغدة خلاص اتقفلت فتبدأ replacement."
      - kind: table
        page: 104
        quote: "Agranulocytosis: dose-limiting side-effect, more common in elderly patients, more with propylthiouracil, usually seen within 3 months"
        title: "Side effects الـ antithyroid drugs"
        columns: ["Effect", "Detail"]
        rows:
          - ["Fever, rash, arthralgia", "1-5%"]
          - ["Agranulocytosis", "Elderly, PTU, first 3 months"]
          - ["Liver changes", "Dose-limiting"]
        hide: [[0, 1], [1, 1]]
      - kind: explain
        page: 104
        quote: "In AF; will usually revert spontaneously with control of hyperthyroidism or B-blockers can be used. Routine anticoagulation is recommended."
        title: "الـ AF والعين"
        text: |
          - ==AF==: غالبًا بيرجع لوحده لما تتحكم في الغدة، أو **β-blockers**، و**routine anticoagulation**.
          - **Graves' ophthalmopathy** النشطة صعبة: **parenteral steroids** مع antithyroid drugs؛ refractory = total thyroidectomy + radioiodine؛ و**selenium** اتجرب بنتايج كويسة.
      - kind: explain
        page: 104
        quote: "Subnormal TSH in the presence of normal FT4 and F T3. It is seen in1-5% of the elderly population."
        title: "الـ subclinical hyperthyroidism"
        text: |
          - **TSH subnormal** مع **FT4 وFT3 normal**، في **1-5%** من الكبار.
          - مرتبط في بعض الدراسات بـ **CAD** و**cardiovascular mortality**؛ الـ fractures والـ dementia controversial.
          - **ATA/AACE**: ==treat لو TSH أقل من 0.1==، وconsider لو **0.1-0.5**، خصوصًا لو مستمر 3-6 شهور مع **cardiac disease** أو أعراض.
      - kind: figure
        page: 105
        quote: "The guidelines recommend to treat subclinical hyperthyroidism in the elderly when the TSH is <0.1 mIU/ml"
        title: "مسطرة الـ TSH الواطي"
        alt: "A TSH ruler: below 0.1 labelled treat in red, 0.1 to 0.5 labelled consider treatment in amber, above 0.5 normal range."
        caption: "تحت 0.1 = عالج. من 0.1 لـ 0.5 = فكّر، وخصوصًا لو فيه قلب أو أعراض."
        svg: |
          <svg viewBox="0 0 330 130" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="40" width="90" height="40" class="fg-bad"/>
            <text x="30" y="65" class="t-b t-bad">Treat</text>
            <rect x="100" y="40" width="120" height="40" class="fg-acc"/>
            <text x="112" y="65" class="t-sm t-b">Consider treating</text>
            <rect x="220" y="40" width="100" height="40" class="fg-good"/>
            <text x="235" y="65" class="t-sm">Normal range</text>
            <text x="90" y="100" class="t-sm">0.1</text>
            <text x="210" y="100" class="t-sm">0.5</text>
            <text x="10" y="26" class="t-sm t-mut">Serum TSH (mIU/L), elderly, normal FT4/FT3</text>
          </svg>
      - kind: explain
        page: 105
        quote: "Thyroid storm is a state of decompensated thyrotoxicosis defined by severe hypermetabolism, fever, neuropsychiatric changes"
        title: "الـ thyroid storm"
        text: |
          الـ ==thyroid storm==: decompensated thyrotoxicosis: **severe hypermetabolism**، **fever**، neuropsychiatric changes، وأحيانًا **CHF**.

          - أقل عند الكبار.
          - أشهر precipitant (غير surgery أو radioiodine من غير تحضير): ==infection==.
      - kind: case
        page: 105
        quote: "Potassium iodide or lugol's iodine can be started after antithyroid medications."
        stem: "A 79-year-old with untreated Graves' develops pneumonia, fever 40°C, AF 150/min and agitation."
        steps:
          - question: "Diagnosis and trigger?"
            options: ["Thyroid storm triggered by infection", "Apathetic thyrotoxicosis", "Euthyroid sick syndrome", "Myxoedema madness"]
            answer: 0
            why: "**Fever**، hypermetabolism، neuropsychiatric changes = storm؛ والـ **infection** أشهر سبب."
          - question: "Antithyroid dose?"
            options: ["PTU 200 mg every 6 h or methimazole 40-80 mg/day", "Methimazole 5 mg/day", "Levothyroxine", "Radioiodine now"]
            answer: 0
            why: "**Large doses**: PTU 200 mg Q6H أو methimazole 40-80 mg/day، مع fluids وelectrolytes وعلاج الـ pneumonia."
          - question: "When does Lugol's iodine go in?"
            options: ["After the antithyroid drug", "First, before anything", "Never", "Instead of steroids"]
            answer: 0
            why: "اليود **بعد** الـ antithyroid، علشان مايبقاش مادة خام للغدة تصنع بيها هرمون أكتر. ومعاهم IV β-blockers و**stress-dose glucocorticoids**."
      - kind: try
        items: [geri.L06.065, geri.L06.068, geri.L06.071, geri.L06.076, geri.L06.079]
    recap:
      - "Graves' 50-70%، toxic nodular 30-40%، thyroiditis أقل من 5% (self-limiting، β-blockers)."
      - "Radioiodine أحسن من الـ surgery؛ antithyroid قبله، وقف 3-5 أيام حواليه."
