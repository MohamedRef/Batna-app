    kind: card
    topic: men2-treatment
    front: Why do most clinicians remove only the affected adrenal for phaeochromocytoma in MEN 2?
    back: Malignancy is rare (fewer than 15 reported cases); although the other gland often develops phaeochromocytoma within 8–10 years, removing both carries the risk of adrenal insufficiency.
