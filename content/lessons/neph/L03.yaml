            <path d="M80 125H105" class="fg-arrow-bad" marker-end="url(#L03e)"/>
            <circle cx="125" cy="125" r="18" class="fg-bad"/>
            <text x="125" y="160" text-anchor="middle" class="t-sm">Blood pump</text>
            <path d="M143 125H175" class="fg-arrow-bad" marker-end="url(#L03e)"/>
            <rect x="180" y="70" width="30" height="110" rx="8" class="fg-ink"/>
            <text x="216" y="84" class="t-sm t-b">Filter</text>
            <path d="M195 70 V30 H45 V86" class="fg-arrow-bad" fill="none" marker-end="url(#L03e)"/>
            <text x="120" y="24" text-anchor="middle" class="t-sm t-mut">blood return</text>
            <path d="M210 125H240" class="fg-arrow-acc" marker-end="url(#L03f)"/>
            <circle cx="260" cy="125" r="18" class="fg-acc"/>
            <text x="282" y="110" class="t-sm">UF pump</text>
            <path d="M260 143V180" class="fg-arrow-acc" marker-end="url(#L03f)"/>
            <rect x="225" y="184" width="70" height="38" rx="8" class="fg-acc"/>
            <text x="260" y="208" text-anchor="middle" class="t-sm">Bag</text>
          </svg>
      - kind: case
        page: 78
        quote: "A vasodilator or inotrope can be added for patients who have urine output <3 l/day despite Step 4 diuretic dosing."
        stem: "68-year-old man, ADHF, home furosemide 100 mg/day, creatinine up from 1.3 to 2.1 mg/dL."
        steps:
          - question: "Starting stepped regimen?"
            options: ["80 mg + 10 mg/h, metolazone 5 mg QD", "40 mg + 5 mg/h, no metolazone", "80 mg + 30 mg/h, metolazone 5 mg BID"]
            answer: 0
            why: "81–160 mg/day = step 2. الـ step 1 لـ ≤80، والـ step 4 لـ >240."
          - reveal: "On step 4 his urine output is 2.1 l/day. BP 86/54, cold extremities."
            question: "Next?"
            options: ["Add an inotrope after hemodynamic assessment", "Start dopamine for renal protection", "Add digoxin"]
            answer: 0
            why: "أقل من 3 l/day بعد step 4 + hypotension و low output = inotrope. الـ dopamine ما حسّنش outcomes الـ AKI، والـ digoxin مش علاج volume."
          - reveal: "Still congested, creatinine 4.6 mg/dL, oliguric."
            question: "Which RRT?"
            options: ["CRRT", "SCUF", "No RRT"]
            answer: 0
            why: "Severe AKI = CRRT؛ الـ SCUF لو no أو mild AKI."
      - kind: try
        items: [neph.L03.058, neph.L03.070, neph.L03.072, neph.L03.078, neph.L03.083]
    recap:
      - "GDMT الخمسة بيطوّلوا العمر في الـ HFrEF، بس عيانين الـ ESKD اتشالوا من الـ trials."
      - "Digoxin على الـ dialysis: الـ risks أكبر من الفايدة."
      - "ICD و CRT: LVEF ≤35%؛ CRT: LBBB ≥130 ms أو non-LBBB ≥150 ms."
      - "Furosemide stress test 1–1.5 mg/kg: <200 ml/2 h أو <600 ml/6 h = خطر وRRT."
      - "السلّم: loop ← أعلى ← thiazide ← hemodynamics/vasoactive ← hypertonic saline/RRT (SCUF أو CRRT)."
      - "Resistance = **BEST R**. الـ dopamine ما حسّنش outcomes؛ الـ inotropes بس مع low output."
