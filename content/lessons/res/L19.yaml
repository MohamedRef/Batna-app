    page: 35
    quote: |-
      Sources for Background Questions
      Textbooks
      Handbooks
      Manuals
      Encyclopedias
      Easy to use
      Relatively inexpensive
      But
      Not all topics are covered
      Can be opinion-based rather than evidence-based, written by experts in their fields.
    title: مصادر الـ background
    text: |-
      **Textbooks، handbooks، manuals، encyclopedias**:

      - سهلة ورخيصة نسبيًا.
      - **بس**: مش كل المواضيع موجودة، وممكن تكون ==opinion-based== مش evidence-based، مكتوبة بـ experts.
  - kind: explain
    page: 42
    quote: |-
      About the disorder, test, treatment, etc.
      a. Root* + Verb: "What causes ..."
      b. Condition: "HIV?"
      * Who, What, Where, When, Why
      'Background' Questions
    title: الـ background question مكوّن من إيه؟
    text: |
      الـ background question بيسأل عن ==المرض أو الـ test أو العلاج نفسه==، وليه جزئين:

      - ==root + verb==: الـ root واحدة من who, what, where, when, why، زي «What causes …».
      - ==condition==: زي «HIV?».

      ليه ده بيفيد؟ لأنك أول ما تشوف السؤال بيبدأ بـ «What causes» من غير مريض معيّن، تعرف إنه background وإجابته في الكتاب. التفسير المقبول (مش في الكتاب).
  - kind: figure
    page: 40
    quote: |-
      The nature of the question asked is critically experience dependent.
      TYPE OF QUESTION: FOREGROUND, BACKGROUND
      CLINICAL EXPERIENCE
