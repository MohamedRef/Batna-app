  ar_eg: "أي قيمة تحليل في الدروس والكروت (زي Na 128 أو Hb 9) بقى جنبها المعدل الطبيعي، والقيمة بتبقى زرقا لو واطية وحمرا لو عالية؛ دوس على المعدل تشوف الوحدة والمصدر."
  en: "Lab values in lessons and cards (Na 128, Hb 9) now show their normal range, blue when low and red when high; tap it for the unit and source."
