- id: res.L20.006
  kind: mcq
  topic: appraisal
  stem: What is the best epidemiological design to study the efficacy of an intervention?
  options:
  - Cross-sectional study
  - Case-control study
  - Prospective cohort study (long follow-up)
  - Randomized controlled trial
  answer: 3
  why:
  - Cross-sectional measures prevalence at one point in time; it can't test an intervention.
  - Case-control starts from the outcome and looks back at exposures; the investigator assigns nothing.
  - A cohort observes exposures it doesn't assign, so it can't prove an intervention works.
  - 'Right: the RCT assigns the intervention at random, the design for intervention questions.'
  src:
    page: 4
    quote: "What is the best epidemiological design to study the efficacy of an intervention?\nA. Cross-sectional study\nB. Case-control study\nC. Prospective cohort study\nD. Randomized controlled trial\n\
      D"
  status: unverified
- id: res.L20.007
  kind: mcq
  topic: appraisal
  stem: Which is the best epidemiological design to study the accuracy of a diagnostic test?
  options:
  - Cross-sectional study
  - Case-control study
  - Cohort study
  - Cross-sectional comparison with gold standard test
  answer: 3
  why:
  - Cross-sectional alone has no reference to judge the new test against.
  - Case-control is for etiology, not test accuracy.
  - Cohort is for incidence, prognosis and etiology.
  - 'Right: a diagnosis question needs a comparison with the gold standard.'
  src:
    page: 4
    quote: "Which is the best epidemiological design to study the accuracy of a diagnostic test?\nA. Cross-sectional study\nB. Case-control study\nC. Cohort study\nD. Cross sectional comparison with gold\
      \ standard test"
  status: unverified
