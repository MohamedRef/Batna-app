  - id: git.L10.lesson1
    title: "البلعة رحلة من فوق لتحت"
    hook: "اللقمة بتعدّي على بوابتين وماسورة عضلات. أي حتة تبوظ، المريض يقولك: الأكل واقف هنا."
    minutes: 8
    pages: [269, 271]
    topics: [physiology, dysphagia]
    goals:
      - "تعرف الـ upper esophageal sphincter (UES) والـ lower esophageal sphincter (LES) والـ body معمولين من إيه وليه"
      - "تفرّق بين dysphagia و odynophagia، و oropharyngeal و esophageal"
      - "تعرف إزاي الـ history لوحده يقرّبك من التشخيص"
    status: unverified
    steps:
      - kind: explain
        page: 269
        quote: "Efficient transport by the esophagus requires a\n  Coordinated, sequential motility pattern that propels food (from above)\n  Antireflux (clears acid and bile reflux from below)"
        title: "المريء عنده شغلانتين"
        text: |
          المريء مش ماسورة ساكتة. علشان ينقل الأكل كويس لازم يعمل حاجتين مع بعض:

          - ==Propulsion== من فوق: **coordinated, sequential motility** بتزق اللقمة لتحت.
          - ==Antireflux== من تحت: يمنع ويـ clear الـ acid والـ bile اللي راجعين من المعدة.

          لو الحركة دي اتلخبطت، الأكل والسوايل مش بيوصلوا كويس، والمريض يحس بـ **dysphagia** و **chest pain**.

          ليه الشغلانتين مع بعض؟ لأن المريء ماسورة بين **حجرتين ضغطهم مختلف**: الصدر ضغطه سالب والبطن ضغطها موجب. يعني من غير بوابة تحت، الحمض هيتسحب لفوق مع كل نَفَس، ومن غير حركة منظمة، الأكل مش هيقدر يعدّي البوابة دي.
      - kind: figure
        page: 270
        quote: "The transition from skeletal to smooth muscles occurs in the mid-esophagus."
        title: "خريطة المريء، زي اللي في الكتاب"
        alt: "A vertical sketch of the esophagus: UES at the top (striated, stops air), the body with striated muscle above and smooth muscle below meeting at the mid-esophagus, and the LES at the bottom (smooth, tonic, stops reflux) above the stomach."
        caption: "الـ upper esophageal sphincter (UES) عضلة striated بتمنع الهوا، والـ lower esophageal sphincter (LES) عضلة smooth مقفولة على طول بتمنع الـ reflux. والتحويل من striated لـ smooth في نص المريء."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <rect x="90" y="14" width="60" height="34" rx="8" class="fg-acc"/>
            <text x="120" y="36" text-anchor="middle" class="t-sm t-b">UES</text>
            <text x="160" y="28" class="t-sm">Striated muscle</text>
            <text x="160" y="43" class="t-sm t-mut">keeps air out</text>
            <rect x="100" y="48" width="40" height="110" class="fg-box"/>
            <text x="160" y="90" class="t-sm">Body: striated above</text>
            <path d="M88 160h64" class="fg-thin"/>
            <text x="160" y="164" class="t-sm t-acc t-b">Mid-esophagus</text>
            <text x="160" y="179" class="t-sm t-mut">skeletal → smooth</text>
            <rect x="100" y="162" width="40" height="110" class="fg-box"/>
            <text x="160" y="215" class="t-sm">Body: smooth below</text>
            <text x="160" y="232" class="t-sm t-mut">outer longitudinal +</text>
            <text x="160" y="247" class="t-sm t-mut">inner circular layers</text>
            <rect x="90" y="272" width="60" height="34" rx="8" class="fg-good"/>
            <text x="120" y="294" text-anchor="middle" class="t-sm t-b">LES</text>
            <text x="160" y="286" class="t-sm">Smooth, baseline tone</text>
            <text x="160" y="301" class="t-sm t-mut">keeps reflux out</text>
            <path d="M120 306c-40 10-60 40-30 50h80c30-10 10-40-20-50" class="fg-ink"/>
            <text x="120" y="342" text-anchor="middle" class="t-sm t-mut">Stomach</text>
          </svg>
      - kind: explain
        page: 270
        quote: "Peristalsis is the coordinated contraction of these two layers that propels the intraluminal esophageal content into the stomach."
        title: "الـ peristalsis"
        text: |
          جسم المريء فيه طبقتين: **outer longitudinal** و **inner circular**. لما الاتنين ينقبضوا بالتنسيق، ده اسمه ==peristalsis==، وهو اللي بيزق اللقمة للمعدة.

          افتكر الشكل ده كويس: الـ **achalasia** هتبوّظ الـ LES والـ peristalsis مع بعض، والـ **gastroesophageal reflux disease (GERD)** هيبوّظ الـ LES من الناحية التانية.

          ليه طبقتين؟ التفسير المقبول (مش في الكتاب): الـ **circular** بتعصر اللقمة من ورا زي ما تعصر معجون أسنان، والـ **longitudinal** بتقصّر الحتة اللي قدامها فتقرّب المريء من اللقمة وتفتحه. الاتنين لازم بالدور، ومن هنا جه اسم الـ **peristalsis**.
      - kind: reveal
        page: 270
        quote: "The upper esophageal sphincter (UES) is a striated muscle that prevents air from entering the stomach."
        prompt: "ليه الـ UES عضلة striated والـ LES عضلة smooth؟ وليه الـ UES بالذات بيمنع الهوا؟"
        answer: |
          الكتاب: الـ **UES** striated وبيمنع الهوا يدخل المعدة، والـ **LES** smooth ليه **baseline tonicity** بتمنع الـ reflux، والتحويل في الـ **mid-esophagus**.

          التفسير المقبول (مش في الكتاب):
          - الـ **striated** سريع ومتحكَّم فيه من الـ swallowing reflex: البلعة في البلعوم لازم تخلص في ثانية علشان الـ airway يتقفل ويتفتح تاني.
          - الـ **smooth** يقدر يفضل مقفول **ساعات** من غير ما يتعب، وده بالظبط اللي الـ LES محتاجه.
          - والهوا؟ الصدر ضغطه سالب، فلو الـ UES مفتوح كل شهيق هيشفط هوا للمريء والمعدة.
      - kind: explain
        page: 270
        quote: "Is defined as difficulty swallowing food or liquid due to the sensation of it sticking in the throat or chest, with a discomfort, or a choking sensation."
        title: "Dysphagia: الأكل واقف"
        text: |
          الـ ==dysphagia== = صعوبة بلع أكل أو سوايل، مع إحساس إنه **sticking in the throat or chest**، وممكن discomfort أو choking.

          ونوعين حسب المكان:
          - **Oropharyngeal**: المشكلة في نقل اللقمة من الـ oropharynx لأول المريء.
          - **Esophageal**: المشكلة في نقلها جوه **body of the esophagus**.

          والمحاضرة بتقول: **history usually suggests the correct diagnosis**.

          إزاي الـ history لوحده يوصلك؟ التفسير المقبول (مش في الكتاب): اسأل تلات أسئلة.
          - **فين؟** في الزور مع كحة أو أكل طالع من المناخير ← oropharyngeal. ورا القص ← esophageal.
          - **أكل ناشف بس ولا سوايل كمان؟** الناشف بس ← سدّة (mechanical)، الاتنين من الأول ← حركة (motility، زي الـ achalasia).
          - **ثابت ولا بيزيد؟** بيزيد بسرعة مع خسارة وزن ← cancer. متقطع ← ring أو spasm.
      - kind: check
        page: 270
        quote: "The esophageal body is made up of two types of muscles: striated muscles in the proximal portion and smooth muscles in the distal portion."
        question: "Which statement about esophageal muscle fits the book?"
        options:
          - "Striated proximally, smooth distally, with the transition in the mid-esophagus"
          - "Smooth throughout, including the upper sphincter"
          - "Striated throughout, including the lower sphincter"
          - "Peristalsis is the contraction of the circular layer alone"
        answer: 0
        why:
          - "صح: الـ body striated فوق و smooth تحت، والتحويل في النص."
          - "الـ UES striated."
          - "الـ LES smooth بـ baseline tonicity."
          - "الـ peristalsis = انقباضة **الطبقتين** (longitudinal و circular) بالتنسيق."
      - kind: reveal
        page: 271
        quote: "Odynophagia is sharp substernal pain on swallowing that may limit oral intake. It usually reflects severe erosive disease."
        prompt: "إيه الفرق بين dysphagia و odynophagia؟ وإيه أشهر سبب للتانية؟"
        answer: |
          الـ ==odynophagia== = **sharp substernal pain on swallowing**، يعني البلع **بيوجع** مش بس صعب. وبتعكس غالبًا **severe erosive disease**.

          أشهر سبب: **infectious esophagitis** (Candida، herpes، CMV) خصوصًا في الـ immunocompromised. وكمان **caustic ingestion** و **pill-induced ulcers**.
      - kind: reveal
        page: 271
        quote: "It is most commonly associated with infectious esophagitis due to Candida, herpesviruses, or CMV, especially in immunocompromised patients."
        prompt: "ليه الـ odynophagia بتعكس severe erosive disease، وليه الـ immunocompromised بالذات؟"
        answer: |
          الكتاب: الـ odynophagia **usually reflects severe erosive disease**، وأشهر سبب **infectious esophagitis** (Candida، herpes، CMV) **especially in immunocompromised patients**.

          التفسير المقبول (مش في الكتاب): الـ dysphagia ممكن تحصل والـ mucosa سليمة (حركة أو ضيق)، لكن الـ **وجع** مع البلع معناه إن اللقمة بتحك في **جرح مفتوح** فيه نهايات أعصاب مكشوفة. والمناعة الضعيفة (chemotherapy، AIDS، steroids) بتسيب الفطريات والفيروسات تعشّش في الـ mucosa وتقرّحها.
      - kind: aside
        tone: joke
        page: 271
        quote: "It may also be caused by corrosive injury due to caustic ingestions and by pillinduced ulcers"
        text: |
          الـ **pill-induced ulcers** دي بتحصل لما حد ياخد الـ doxycycline على الريق بشفطة مية صغيرة وينام على طول. الحباية بتقف في المريء وتعمل قرحة. علشان كده "اشرب كوباية مية كاملة واقعد ربع ساعة" مش رخامة من الصيدلي.
      - kind: check
        page: 271
        quote: "It is most commonly associated with infectious esophagitis due to Candida, herpesviruses, or CMV, especially in immunocompromised patients."
        question: "A patient on chemotherapy has sharp retrosternal pain with every swallow. Most common cause per the lecture?"
        options:
          - "Infectious esophagitis (Candida, herpes, CMV)"
          - "Achalasia with a tight LES"
          - "A peptic stricture from reflux"
          - "A Zenker diverticulum in the neck"
        answer: 0
        why:
          - "صح: الـ odynophagia أشهر سبب ليها infectious esophagitis، خصوصًا مع ضعف المناعة."
          - "الـ achalasia بتعمل dysphagia للأكل والسوايل و regurgitation، مش وجع حاد مع كل بلعة."
          - "الـ peptic stricture بتعمل dysphagia للأكل الناشف بتزيد على شهور."
          - "الـ Zenker سبب structural لـ oropharyngeal dysphagia."
      - kind: try
        items: [git.L10.001, git.L10.003, git.L10.005, git.L10.007, git.L10.010]
    recap:
      - "المريء: propulsion من فوق و antireflux من تحت، بين صدر ضغطه سالب وبطن ضغطها موجب."
      - "UES = striated، بتمنع الهوا. LES = smooth بـ baseline tone، بتمنع الـ reflux. التحويل في الـ mid-esophagus."
      - "Dysphagia = صعوبة. Odynophagia = وجع، وأشهر سبب infectious esophagitis."
      - "الـ history: فين؟ ناشف بس ولا سوايل؟ ثابت ولا بيزيد؟"
    practice: [git.L10.001, git.L10.002, git.L10.003, git.L10.004, git.L10.005, git.L10.006, git.L10.007, git.L10.008, git.L10.009, git.L10.010, git.L10.011, git.L10.012]
