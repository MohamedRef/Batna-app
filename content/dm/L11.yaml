    prompt: Common fears about starting insulin?
    points:
      - Needles
      - Hypoglycemia
      - Weight gain
    pass: 3
    src: { page: 131, quote: "Common Fears: 1. Needles 2. Hypoglycemia 3. Weight gain" }
    status: unverified
  - id: dm.L11.010
    kind: enumerate
    topic: barriers
    prompt: Common beliefs about insulin?
    points:
      - Insulin is the last option
      - Insulin causes complications
      - Insulin is a personal failure
      - Adverse impact on relationships and lifestyle
    pass: 3
    src: { page: 132, quote: "Insulin causes complications 3. Insulin is a personal failure 4. Adverse impact on relationships/lifestyle" }
    status: unverified
  - id: dm.L11.011
    kind: mcq
    topic: barriers
    stem: "A 55-year-old man on three oral drugs with HbA1c 9.6% refuses insulin: \"My father went blind after he started insulin, it means I have failed.\" Which beliefs from the lecture is he voicing?"
    options:
      - Insulin causes complications, and insulin is a personal failure
      - Fear of needles and fear of weight gain
      - Insulin is the last option only
      - Fear of hypoglycemia only
      - Adverse impact on relationships only
    answer: 0
    why:
      - "Correct: blaming blindness on insulin = 'insulin causes complications'; 'I have failed' = 'personal failure' (p132)."
      - "Needles and weight are fears he did not mention (p131)."
      - "He says more than 'last option'."
      - "He did not mention hypoglycemia."
      - "He did not mention relationships."
    src: { page: 132, quote: "Insulin causes complications 3. Insulin is a personal failure" }
    status: unverified
  # ---------- p132: targets and physiology ----------
  - id: dm.L11.012
    kind: table
    topic: targets
    title: "ADA Table 6.3: glycemic targets for many nonpregnant adults"
    columns: [Measure, Target]
    rows:
      - [A1C, "<7.0% (53 mmol/mol)"]
      - [Preprandial capillary plasma glucose, "80–130 mg/dl (4.4–7.2 mmol/L)"]
      - [Peak postprandial capillary plasma glucose, "<180 mg/dl (10.0 mmol/L)"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 132, quote: "Preprandial capillary plasma glucose 80-130 mg/dL* (4.4-7.2 mmol/L}" }
    status: unverified
    tags: [numbers]
  - id: dm.L11.013
    kind: card
    topic: targets
    front: Describe the physiological insulin secretion profile.
    back: A steady low basal level all day and night, with sharp prandial peaks after breakfast, lunch and dinner.
    src: { page: 132, quote: "Physiological insulin secretion profile:" }
    status: unverified
  - id: dm.L11.014
    kind: card
    topic: basal-oral
    front: Which insulins have a flat profile on the action-curve figure, and which peak?
    back: Glargine is flat for 24 hours; aspart, lispro and glulisine peak first, then regular, NPH and detemir peak later and lower.
    src: { page: 133, quote: "Aspart, lispro, glulisine" }
    status: unverified
  # ---------- p133-135: basal-oral ----------
  - id: dm.L11.015
    kind: card
    topic: basal-oral
    front: What is the motto of the basal-oral regimen?
    back: Fix fasting first. Basal insulin brings fasting glucose to normal; postprandial peaks sit on top of it.
    src: { page: 133, quote: "Basal-oral regimen: Fix Fasting First" }
    status: unverified
    tags: [high-yield]
  - id: dm.L11.016
    kind: card
    topic: basal-oral
    front: Why fix fasting glucose first?
    back: Postprandial peaks ride on top of the fasting level, so bringing fasting glucose to normal with basal insulin lowers the whole day's curve.
    src: { page: 134, quote: "Hence need to fix fasting first" }
    status: unverified
  - id: dm.L11.017
    kind: enumerate
    topic: basal-oral
    prompt: Advantages of starting with basal insulin in type 2 DM?
    points:
      - One injection, no mixing
      - Insulin pens increase acceptance
      - Slow, safe, simple titration
      - Low dosage
      - Effective improvement in control
      - Limited weight gain
    pass: 5
    src: { page: 134, quote: "1 injection with no mixing 2. Insulin pens for increased acceptance 3. Slow, safe, simple titration" }
    status: unverified
    tags: [high-yield]
  - id: dm.L11.018
    kind: enumerate
    topic: basal-oral
    prompt: Criteria of the ideal basal insulin?
    points:
      - Closely mimics normal basal secretion
      - No distinct peak
      - Effect continues over 24 hours
      - Less nocturnal hypoglycemia
      - Once daily for compliance
      - Predictable absorption
    pass: 5
    src: { page: 134, quote: "Closely mimic normal pancreatic basal insulin secretion 2. No distinct peak effect 3. Continued effect over 24 hours" }
    status: unverified
    tags: [book-question, high-yield]
  - id: dm.L11.019
    kind: card
    topic: basal-oral
    front: What is a "qualified A1c"?
    back: An A1c judged together with the hypoglycemia it cost. For the same hypoglycemia risk, a long-acting analogue reaches an A1c about 0.4–0.6% lower than NPH.
    src: { page: 135, quote: "A ―qualified A1c‖ by hypoglycemia The impact of hypoglycemia on A1c" }
    status: unverified
  - id: dm.L11.020
    kind: cloze
    topic: basal-oral
    text: "At the same hypoglycemia level, the figure shows long-acting analogues lower A1c by about {{c1::0.4–0.6%}} more than {{c2::NPH}}."
    src: { page: 135, quote: "~ 0.4–0.6% ?" }
    status: unverified
    tags: [numbers]
  # ---------- p135: initiate and titrate ----------
  - id: dm.L11.021
    kind: card
    topic: titration
    front: How is insulin initiated in the basal-oral regimen?
    back: With a single injection of basal insulin (glargine), keeping the oral drugs.
    src: { page: 135, quote: "Initiate insulin with a single injection of a basal insulin (Glargine)" }
    status: unverified
  - id: dm.L11.022
    kind: cloze
    topic: titration
    text: "Initiate: bedtime or morning {{c1::long-acting}} insulin, or bedtime {{c2::intermediate-acting}} insulin; daily dose {{c3::10 units or 0.2 units/kg}}."
    src: { page: 135, quote: "Daily dose: 10 units or 0.2 units/kg" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L11.023
    kind: table
    topic: titration
    title: "Initiate, titrate, monitor basal insulin (Nathan 2009, in the lecture)"
    columns: [Step, What to do]
    rows:
      - [Initiate, "10 units or 0.2 U/kg, bedtime or morning long-acting, or bedtime intermediate"]
      - [Check, FPG daily]
      - [Titrate, "+2 units every 3 days until FPG 80–130 mg/dl"]
      - [If FPG >180, "+4 units every 3 days"]
      - [Hypoglycemia or FPG <70, "Reduce bedtime dose by ≥4 units, or 10% if >60 units"]
      - [Monitor, Continue and check HbA1c every 3 months]
    blanks: [[0, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 135, quote: "Increase dose by 2 units every 3 days until FPG (80–130 mg/dL)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: dm.L11.024
    kind: mcq
    topic: titration
    stem: A woman on glargine 14 units at bedtime has fasting glucose 196, 205 and 188 mg/dl over 3 days. Using the lecture's titration chart, what next?
    options:
      - Increase by 4 units, then reassess in 3 days
      - Increase by 2 units
      - No change
      - Reduce by 4 units
      - Add prandial insulin now
    answer: 0
    why:
      - "Correct: FPG >180 mg/dl → +4 units every 3 days (p135)."
      - "+2 units is for FPG above 130 but not above 180."
      - "She is far above the 80–130 target."
      - "Reduction is for hypoglycemia or FPG <70."
      - "Fix fasting first; prandial comes after basal is titrated."
    src: { page: 135, quote: "If FPG is >180 mg/dL, increase dose by 4 units every 3 days" }
    status: unverified
  - id: dm.L11.025
    kind: mcq
    topic: titration
    stem: A man on NPH 70 units at bedtime has a night hypoglycemia and fasting glucose 64 mg/dl. How should the dose change?
    options:
      - Reduce by 10% (7 units)
      - Reduce by 2 units
      - Increase by 2 units
      - Stop insulin
      - No change
    answer: 0
    why:
      - "Correct: with hypoglycemia or FPG <70, reduce by ≥4 units, or by 10% if the dose is >60 units (p135)."
      - "2 units is less than the ≥4 unit minimum."
      - "Increasing would worsen hypoglycemia."
      - "Stopping is not the chart's advice."
      - "A hypo must lead to a reduction."
    src: { page: 135, quote: "Reduce bedtime insulin dose by ≥4 units, or by 10% if >60 units" }
    status: unverified
  # ---------- p136: after basal ----------
  - id: dm.L11.026
    kind: enumerate
    topic: prandial
    prompt: When to intensify beyond basal insulin (HbA1c above target and...)?
    points:
      - Despite adequately titrated basal insulin
      - Or once basal dose exceeds 0.7–1.0 IU/kg
      - Or with FPG already at target
    pass: 2
    src: { page: 136, quote: "Despite adequately titrated basal insulin OR once basal dose >0.7–1.0 IU/kg OR FPG at target" }
    status: unverified
    tags: [high-yield]
  - id: dm.L11.027
    kind: cloze
    topic: prandial
    text: "Stop pushing basal insulin and intensify once the basal dose exceeds {{c1::0.7–1.0 IU/kg}}."
    src: { page: 136, quote: "once basal dose >0.7–1.0 IU/kg" }
    status: unverified
    tags: [numbers]
  - id: dm.L11.028
    kind: card
    topic: prandial
    front: What are the two options after basal insulin?
    back: Either add prandial insulin (usually one dose with the largest meal or the meal with the greatest PPG excursion), or consider twice- or three-times-daily premix (higher risk of hypoglycemia and/or weight gain).
    src: { page: 136, quote: "Usually one dose with the largest meal or meal with greatest PPG excursion" }
    status: unverified
    tags: [high-yield]
  - id: dm.L11.029
    kind: card
    topic: prandial
    front: Which option after basal carries a caution, and why?
    back: Twice- or three-times-daily premix, because of a higher risk of hypoglycemia and/or weight gain.
    src: { page: 136, quote: "Caution higher risk of hypoglycemia and/or weight gain" }
    status: unverified
  # ---------- p137: prandial ----------
  - id: dm.L11.030
    kind: cloze
    topic: prandial
    text: "Initiate prandial insulin with {{c1::4 IU a day or 10% of the basal dose}}."
