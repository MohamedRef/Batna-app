        page: 361
        title: "مفيش criteria خاصة: تابع الـ trend"
        quote: "Diagnosis of AKI in pregnancy The diagnosis of AKI in pregnancy is not standardized in clinical practice due to inconsistency in the definition of pregnancy-related AKI and non-validation of the KDIGO (Kidney Disease Improving Outcomes) guidelines, RIFLE (Risk, Injury, Failure, Loss and End-stage) and the AKIN (Acute Kidney Injury Network) criteria for the non-pregnant population in pregnant women.(9) Furthermore, detection AKI is confounded by the physiological lowering of serum creatinine due to glomerular hyper filtration in pregnancy. For instance, an increase in serum creatinine concentration by 0.4 mg/dl, consistent with stage 1 in the AKIN criteria, may point towards significant kidney injury. Currently, there are no distinct criteria for the diagnosis of AKI in pregnancy. Attention should be paid to trends in serum creatinine levels in pregnancy, and even small changes in creatinine are sensitive in picking up early kidney injury in specific clinical settings. For example, in a woman with new onset hypertension, concomitant increase in serum creatinine by 0.3 mg/dl with increases in liver enzymes and thrombocytopenia, represents AKI and requires close follow of kidney function.(23) Initial evaluation for AKI should start with a comprehensive review of the patient's history of CKD, chronic hypertension, diabetes, preeclampsia in prior pregnancies, systemic lupus erythematous, and preexisting glomerular diseases. The onset of AKI during pregnancy by trimester can point towards the underlying etiology. While hyperemesis gravidarum and septic abortions are common causes of AKI in the first trimester, majority of AKI occurring in the second and trimester are specific to a pregnancy complication of preeclampsia, HELLP syndrome, AFLP, thrombotic microangiopathies like TTP, and placental abruptio. Atypical HUS and NSAID's induced kidney injury are common causes of AKI in the postpartum period. Diagnostic evaluation should include urinalysis, urine microscopy, comprehensive metabolic panel, coagulation panel, and appropriate serological workup along with a thorough review of medications. Serum complement levels can be elevated in pregnancy due to increased synthesis by the"
        text: |
          طلعة **0.4 mg/dL** (يعني Acute Kidney Injury Network (AKIN) stage 1 بس) ممكن تبقى إصابة كبيرة في الحمل.

