  - id: res.L07.lesson2
    title: "القرعة: simple و block و stratified"
    hook: "إزاي توزّع ١٠٠٠ عيان على علاجين وتضمن إن الستات والكبار متقسّمين بالعدل؟"
    minutes: 8
    pages: [22, 34]
    topics: [conduct, randomization]
    goals:
      - "تعرف المطلوب في step 6 و step 7"
      - "تعدّ فوايد الـ randomization"
      - "تفرّق بين simple و block و stratified randomization وتحسب مثال"
    status: unverified
    steps:
      - kind: explain
        page: 22
        quote: "Step 6 - Detailed Descriptions of Measurement Protocols:\n  Ensure that the measurement process is accurate.\n  Detailed protocols of clinical procedures, laboratory investigations as well as the details of questionnaire and interview protocols.\n  For each and every variable (intervention, co-intervention, confounders and major and minor outcome variables), write down very clearly and explicitly, as regards:"
        title: "Step 6: كل variable ليه بروتوكول"
        text: |
          قبل ما تبدأ، اكتب **detailed protocols** للـ clinical procedures والـ lab والـ questionnaire. ولكل variable (intervention، co-intervention، confounders، outcomes) جاوب:

          - **مين** هيقيس؟ و**إمتى**؟
          - بأنهي **equipment** وأنهي **technique**؟
          - إزاي الأجهزة والطرق والناس هيكونوا ==standardized and validated==؟
      - kind: explain
        page: 24
        quote: "Step 7 - Enrolling the Participants: It is important to present the \"Recruitment and Participation Flow Chart\" giving the numbers ('n') at each step"
        title: "Step 7: الـ flow chart"
        text: |
          في الـ enrolment لازم تعرض ==Recruitment and Participation Flow Chart== فيه **n عند كل خطوة**: اتعرض عليهم كام، اتقيّموا كام، اتوزّعوا كام، خدوا العلاج كام، ضاعوا كام، واتحلّلوا كام.

          مثال المحاضرة: برنامج **web** ضد **print**. حوالي 247 في الـ web، و 233 في الـ print، ومن كل جروب ناس ماخدوش العلاج وناس ضاعت في الـ follow-up. وده بالظبط شكل الـ **Consolidated Standards of Reporting Trials (CONSORT) flow diagram** اللي هنشوفه في آخر المحاضرة.
      - kind: explain
        page: 26
        quote: "Step 8 - Randomization. Randomization avoids bias by:\n  Ensuring unpredictability of next assignment\n  Reduces baseline differences in risk between treatment and control groups.\n  Only way to control for unknown factors\n  should make both groups similar in terms of the distribution of confounding variables\n  larger the randomized groups, the greater the probability of equal baseline risks."
        title: "Step 8: الـ randomization بتمنع الـ bias إزاي؟"
        text: |
          - بتخلي **الـ assignment الجاي مش متوقع**.
          - بتقلّل **الفروق في الـ baseline risk** بين الجروبين.
          - هي ==the only way to control for unknown factors==: حتى الحاجات اللي إنت مش عارف إنها confounders.

          وكل ما الجروبات **أكبر**، فرصة إن الـ baseline risks تتساوى بتزيد.
      - kind: reveal
        page: 27
        quote: "Randomization:\n  \"It eliminates bias in treatment assignment,\" specifically selection bias and confounding.\n  \"It facilitates blinding (masking) of the identity of treatments from investigators, participants, and assessors.\"\n  \"It permits the use of probability theory to express the likelihood that any difference in outcome between treatment groups merely indicates chance.\""
        prompt: "المحاضرة بتقول للـ randomization **3 فوايد**. افتكرهم قبل ما تفتح."
        answer: |
          1. بتلغي الـ **bias in treatment assignment**: الـ selection bias والـ confounding.
          2. بتسهّل الـ **blinding**: الدوا والـ placebo بيتوزّعوا بأرقام، محدش عارف مين خد إيه.
          3. بتسمح نستخدم **probability theory**: نقدر نحسب احتمال إن الفرق ده مجرد صدفة (الـ p value).
      - kind: explain
        page: 29
        quote: "Block Randomization. The basic idea of block randomization:\n  1. Divide potential patients into blocks\n  2. Randomize each block.\n  3. given a block size of 4, there are 6 possible ways to equally assign participants to a block.\n  4. Then choose the blocks randomly\nExample: Two treatments of A, B.\n  a. Possible treatment allocations within each block are (1) AABB, (2) BBAA, (3) ABAB, (4) BABA, (5) ABBA, (6) BAAB\n  b. Block size depends on the number of treatment, it should be short enough to prevent imbalance, and long enough to prevent guessing allocation in trials"
        title: "Block randomization: علشان الجروبات تبقى بنفس الحجم"
        text: |
          الـ simple randomization زي رمي العملة: ممكن تطلع 12 ضد 8 في 20 عيان. الـ ==block randomization== بتضمن **equal sample sizes**.

          مع علاجين A و B و **block size = 4**، فيه **6 طرق** يتقسّم فيها البلوك بالتساوي:
          AABB، BBAA، ABAB، BABA، ABBA، BAAB.

          تختار البلوكات **عشوائيًا**: 20 عيان = **5 blocks** كل واحد فيه 4. وفي آخر كل بلوك، الجروبين متساويين.
      - kind: aside
        tone: trap
        page: 29
        quote: "Block Randomization. The basic idea of block randomization:\n  1. Divide potential patients into blocks\n  2. Randomize each block.\n  3. given a block size of 4, there are 6 possible ways to equally assign participants to a block.\n  4. Then choose the blocks randomly\nExample: Two treatments of A, B.\n  a. Possible treatment allocations within each block are (1) AABB, (2) BBAA, (3) ABAB, (4) BABA, (5) ABBA, (6) BAAB\n  b. Block size depends on the number of treatment, it should be short enough to prevent imbalance, and long enough to prevent guessing allocation in trials"
        text: |
          حجم البلوك: **قصير كفاية** يمنع الـ imbalance، و**طويل كفاية** يمنع إن حد **يخمّن** الـ allocation.

          لو البلوك 2 والدكتور عارف، أول عيان خد A يبقى التاني أكيد B: الـ concealment باظ.
      - kind: explain
        remind: [res.L07.033]
        page: 31
        quote: "Stratified randomization:\n  Addresses the need to control and balance the influence of covariates (prognostic variables).\n  This method can be used to achieve balance among groups in terms of subjects' baseline characteristics (covariates).\n  Stratified randomization is achieved by generating a separate block for each combination of covariates.\n  After all subjects have been identified and assigned into blocks, simple randomization is performed within each block to assign subjects to one of the groups."
        title: "Stratified randomization: وازن الـ covariates المهمة"
        text: |
          لما فيه **prognostic variable** مهمة (السن، النوع، شدة المرض) وعايز تضمن إنها متوزعة بالعدل:

          - اعمل ==separate block for each combination of covariates==.
          - جوه كل block اعمل **simple randomization** للجروبين.

          مثال المحاضرة: تجربة **zidovudine** في الحوامل اتقسّمت حسب **gestational age**: 14 لـ 26 أسبوع وأكتر من 26، وبعدين قرعة جوه كل واحدة.
