  - id: res.L04.lesson5
    title: "شجرة الـ designs وهرم الأدلة"
    hook: "سؤال واحد بيفرز أي دراسة: الباحث هو اللي اختار مين يتعرض؟ وبعدها: فيه comparison group؟"
    minutes: 6
    pages: [12, 15]
    topics: [designs, hierarchy]
    goals:
      - "تفرز أي دراسة: experimental ولا observational، descriptive ولا analytic"
      - "ترتّب الأدلة من الأقوى للأضعف"
    status: unverified
    steps:
