items:
  # ---------- p83-84: organs and cells ----------
  - id: rheum.L06.001
    kind: enumerate
    topic: organs
    prompt: Name the mucosa-associated lymphoid tissues shown in the lecture's opening figure.
    points: [Naso-pharyngeal and tonsillar lymph nodes, Bronchial lymph nodes, "Gut-associated lymphoid tissue (Peyer's patches, GALT)"]
    pass: 2
    src: { page: 83, quote: "Gut-associated Peyer's patches lymphoid tissue (GALT)" }
    status: unverified
  - id: rheum.L06.002
    kind: card
    topic: organs
    front: From which two lineages of the pluripotent stem cell do immune cells arise (p84 figure)?
    back: The granulocyte/monocyte (myeloid) lineage, giving neutrophils, eosinophils, basophils, monocytes/macrophages and mast cells; and the lymphocyte (lymphoid) lineage, giving B cells, T cells (via the thymus) and NK cells.
    src: { page: 84, quote: "Granulocyte/monocyte (myeloid) lineage" }
    status: unverified
  - id: rheum.L06.003
    kind: card
    topic: organs
    front: What do B lymphocytes and monocytes mature into in the tissues (p84 figure)?
    back: B lymphocytes become plasma cells; monocytes become macrophages (alveolar macrophage, mesangial cell, Kupffer cell, osteoclast).
    src: { page: 84, quote: "Macrophage Alveolar macrophage Mesangial cell Kupffer cell Osteoclast" }
    status: unverified
