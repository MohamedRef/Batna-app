  # ---------- p302-303: resuscitation ----------
  - id: git.L11.039
    kind: card
    topic: resuscitation
    front: What does early intensive hemodynamic resuscitation achieve in acute UGIH?
    back: It significantly decreases mortality, corrects hypovolemia, restores tissue perfusion and prevents multiorgan failure.
    src: { page: 302, quote: "Hemodynamic stabilization and resuscitation: Early intensive hemodynamic resuscitation of patients with acute UGIH has been shown to significantly decrease mortality, correct intravascular hypovolemia, restore adequate tissue perfusion, and prevent multiorgan failure." }
    status: unverified
  - id: git.L11.040
    kind: card
    topic: resuscitation
    front: Which fluids does the lecture recommend for resuscitation in UGIH?
    back: Crystalloids, either 0.9% saline or balanced crystalloids such as Ringer's lactate (which reduced mortality and major adverse renal events in critically ill patients).
    src: { page: 302, quote: "The ideal crystalloid fluid type to be used in hemodynamic resuscitation either saline 0.9% sodium chloride or balanced crystalloids (e.g ringer's lactate which showed reduce both mortality and major adverse renal events in critically ill patients." }
    status: unverified
  - id: git.L11.041
    kind: card
    topic: resuscitation
    front: Is a nasogastric tube routine in UGIB, and what does its aspirate tell you?
    back: Not routine; it may help triage selected patients with suspected active upper bleeding. Red blood or coffee grounds confirm an upper gastrointestinal (GI) source.
    src: { page: 302, quote: "Placement of a nasogastric tube is not routinely recommended. It might help for initial assessment and triage of selected patients with suspected active upper tract bleeding." }
    status: unverified
    tags: [high-yield]
  - id: git.L11.042
    kind: card
    topic: resuscitation
    front: Which transfusion strategy is standard of care in non-massive acute UGIH?
    back: A restrictive red blood cell (RBC) transfusion strategy, in both variceal and non-variceal bleeding; it is associated with lower in-hospital mortality.
    src: { page: 303, quote: "A restrictive red blood cell (RBC) transfusion strategy is considered standard of care in non- massive, acute UGIH both in variceal or nonvariceal." }
    status: unverified
    tags: [high-yield]
