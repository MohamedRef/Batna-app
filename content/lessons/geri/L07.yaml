        title: "ليه الـ frailty بتتقاس بالـ function؟"
        text: |
          الـ **Clinical Frailty Scale** مش بتسأل عن تحاليل. هي بتسأل الكبير **بيعمل إيه**: بيتمرّن؟ الأعراض بتحدّ من نشاطه؟ محتاج مساعدة بره البيت؟ في البيت؟ في جسمه؟

          التفسير المقبول (مش في الكتاب): الـ frailty معناها **احتياطي قليل**، وأوضح علامة للاحتياطي القليل إن الحياة اليومية بقت صعبة. عشان كده كل درجة مربوطة بمستوى اعتماد:
          - **4 vulnerable**: مش محتاج حد، بس الأعراض بتحدّ من نشاطه ("slowed up").
          - **5 mildly frail**: محتاج مساعدة في الـ **IADL** (مواصلات، شغل البيت التقيل، الفلوس).
          - **6 moderately frail**: محتاج مساعدة **بره** البيت و **جوه** (سلالم، استحمام).
          - **7 severely frail**: معتمد تمامًا في الـ personal care.

          يعني نفس سلّم الـ IADL ثم الـ ADL اللي شفناه في الـ function.
