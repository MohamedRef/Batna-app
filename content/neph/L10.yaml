  - id: neph.L10.007
    kind: mcq
    topic: drug-vessels
    stem: A woman with rheumatoid arthritis on gold injections develops heavy proteinuria and oedema. Which glomerular lesion does the book link to her drug?
    options:
      - Membranous glomerulonephritis
      - Minimal change disease
      - Thrombotic microangiopathy
      - Acute tubular necrosis
    answer: 0
    why:
      - "Correct: gold, penicillamine and captopril cause membranous GN (p338)."
      - Minimal change follows NSAIDs, lithium and antibiotics.
      - Thrombotic microangiopathy follows mithramycin and ciclosporin.
      - Tubular necrosis is a tubular, not glomerular, lesion and does not cause nephrotic oedema.
    src: { page: 338, quote: "Membranous glomerulonephritis" }
    status: unverified
