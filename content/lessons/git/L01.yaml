  - id: git.L01.lesson9
    title: "الـ MALT lymphoma: الـ lymphoma اللي الـ H. pylori بيعمله"
    hook: "ورم في المعدة ممكن يبان في المنظار مجرد احمرار خفيف. إزاي تلقطه، وإزاي تتأكد منه؟"
    minutes: 7
    pages: [23, 25]
    topics: [malt]
    goals:
      - "تعدّ الـ clinical outcomes بتاعة H. pylori"
      - "تعرف شكل الـ gastric MALT lymphoma في الـ white light والـ BLI"
      - "تعدّ الـ 5 challenges للـ endoscopist"
    status: unverified
    steps:
      - kind: explain
        page: 23
        quote: "Clinical outcome\n• Gastritis\n• Peptic ulcer\n• MALT lymphoma\n• Gastric adenocarcinoma"
        title: "الـ H. pylori بيوصّل لفين؟"
        text: |
          الـ **clinical outcome** في الكتاب أربعة:
          - **Gastritis**
          - **Peptic ulcer**
          - ==MALT lymphoma==
          - **Gastric adenocarcinoma**

          ليه lymphoma بالذات؟ التفسير المقبول (مش في الكتاب): المعدة الطبيعية مفيهاش lymphoid tissue تقريبًا. الـ H. pylori بيعمل التهاب مزمن، فالجسم يجيب **B cells** تعمل lymphoid follicles (MALT). الـ stimulation المستمر ده ممكن يطلّع clone من الـ B cells يكبر لوحده، فيبقى **lymphoma**.
      - kind: explain
        page: 23
        quote: "MALT-lymphomas (marginal zone B-cell lymphoma)"
        title: "شكله في المنظار: خفيف في الأبيض، واضح في الأزرق"
        text: |
          الـ ==MALT lymphoma== = **marginal zone B-cell lymphoma**.

          - **(a) White light endoscopy**: lesions **very slight** بالعافية تشوفها.
          - **(b) Blue light imaging (BLI) مع magnification**: الـ lesions أوضح بكتير، و ==vascular pattern== مش طبيعي شكله **«tree-like»**: أوعية زي جذع شجرة وفروعه، ومعاها **linear erosions**.
          - **(c, d)**: نفس الصور في الـ BLI، مركّزة على الـ linear erosions.

          ليه الأزرق بيفرق؟ التفسير المقبول (مش في الكتاب): الضوء الأزرق بيتمص في الـ haemoglobin، فالأوعية السطحية تبان سودا على خلفية فاتحة، والشكل الغريب يطلع قدامك.
      - kind: reveal
        page: 23
        quote: "MALT-lymphomas (marginal zone B-cell lymphoma)"
        prompt: "الـ MALT lymphoma طالع من أنهي خلية؟ وده يفرق في إيه؟"
        answer: |
          من الـ ==marginal zone B cell==، زي ما الكتاب كاتب: **marginal zone B-cell lymphoma**.

          وده بيفرق في الفهم: التفسير المقبول (مش في الكتاب) إن الورم ده لسه «متعلّق» بالالتهاب اللي عمله، فطالما الـ H. pylori موجود هو بياخد إشارة يكبر. عشان كده الـ biopsy والـ staging بالـ EUS مهمين قبل ما تقرر.
      - kind: figure
        page: 24
        title: "أشكال الـ MALT lymphoma"
        image: { file: git/L01-malt-aspects.webp, book: true }
        alt: "Four book endoscopic photos of gastric MALT lymphoma: (a) ulcer with a yellow-white base, (b) enlarged gastric folds with erythema, (c) erosive nodules, (d) erythematous scar."
        caption: |
          **(a)** ulcer، **(b)** enlarged gastric folds مع erythema، **(c)** erosive nodules، **(d)** erythematous scar.

          نفس المرض بأربع وشوش، وعشان كده الـ biopsy هي اللي بتحسم.
      - kind: aside
        tone: tip
        page: 24
        quote: "(c) (c,d) the same images in BLI and magnification, focused on linear erosions."
        text: |
          لو المنظار عندك فيه **BLI** أو NBI مع magnification، شغّله على أي احمرار أو erosion في مريض H. pylori. الـ **linear erosions** والأوعية الـ **tree-like** ممكن ما تبانش غير كده، والـ white light لوحده ممكن يعدّيها على إنها gastritis عادية.
      - kind: match
        page: 24
        quote: "Different\nendoscopic\naspects of gastric MALT\nlymphoma.\n(a) Ulcer.\n(b) Enlarged gastric folds with\nerythema.\n(c) Erosive nodules.\n(d) Erythematous scar."
        prompt: "وصّل كل صورة بوصفها في الكتاب:"
        pairs:
          - ["(a)", "Ulcer"]
          - ["(b)", "Enlarged gastric folds with erythema"]
          - ["(c)", "Erosive nodules"]
          - ["(d)", "Erythematous scar"]
        why: "الكتاب بيعرض الـ MALT lymphoma بأربع أشكال؛ مفيش شكل واحد يميّزه، فأي واحد منهم في مريض H. pylori يستاهل biopsies."
      - kind: explain
        remind: [git.L01.094]
        page: 25
        quote: "It may be combined with an endoscopic ultrasound examination, which is a routine procedure in lymphoma staging."
        title: "خمس تحديات للـ endoscopist"
        text: |
          الـ gastric MALT lymphoma (GML) صعب ليه؟ الكتاب بيعدّ خمسة، والـ «ليه» جنب كل واحد هو التفسير المقبول (مش في الكتاب):

          - **Initial detection** محتاج تبص على ==المعدة كلها== بدقة، لأن الـ lesions خفيفة ومتفرقة.
          - **Correct diagnosis** محتاج **biopsies كتير** وأحيانًا عينات أكبر، لأن الورم في الـ submucosa والعينة السطحية ممكن تفوته.
          - **Control endoscopy** بعد العلاج، علشان تتابع الـ lesions بتخف ولا لأ.
          - **Confirmatory endoscopy** بعد ما الشك يطلع في العينات الأولى، بعدد biopsies كافي و **gastric mapping**.
          - ممكن يتعمل معاه ==endoscopic ultrasound (EUS)==، وده **routine** في الـ staging، لأنه بيشوف عمق الورم في الجدار والـ lymph nodes.
