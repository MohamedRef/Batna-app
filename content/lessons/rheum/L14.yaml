  - id: rheum.L14.lesson2
    title: "الـ DEXA بيقول إيه؟"
    hook: "رقم واحد سالب على ورقة الـ DEXA بيفرق بين طمّن المريضة وابدأ علاج. تعالى نقرا الـ T-score صح."
    minutes: 8
    pages: [223, 224]
    topics: [dexa, screening, indications]
    goals:
      - "تقرا الـ T-score وتصنّف"
      - "تعرف الـ FRAX ومين يعمل BMD"
      - "تعرف التحاليل وإمتى نبدأ دوا"
    status: unverified
    steps:
      - kind: explain
        page: 223
        quote: "Dual-energy X-ray absorptiometry (DEXA) is the gold standard."
        title: "الـ DEXA"
        text: |
          الـ ==DEXA== هو الـ **gold standard** لقياس الـ BMD. والنتيجة بتطلع **T-score**: بُعدك عن الشاب الطبيعي بالـ standard deviation.
      - kind: figure
        page: 223
        quote: "Normal: T ≥ –1. o Osteopenia: –1 > T > –2.5. o Osteoporosis: T ≤ –2.5."
        title: "مسطرة الـ T-score"
        alt: "A horizontal ruler from 0 on the right to minus 3.5 on the left. From 0 to minus 1 is normal in green. From minus 1 to minus 2.5 is osteopenia in accent colour. Minus 2.5 and below is osteoporosis in red. A note says a fragility fracture with minus 2.5 or below means severe."
        caption: "الحدّين: سالب 1 وسالب 2.5. وأي fragility fracture مع osteoporosis يبقى severe."
        svg: |
          <svg viewBox="0 0 330 170" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="40" width="100" height="40" class="fg-bad"/>
            <rect x="110" y="40" width="130" height="40" class="fg-acc"/>
            <rect x="240" y="40" width="80" height="40" class="fg-good"/>
            <text x="16" y="65" class="t-sm t-b">Osteoporosis</text>
            <text x="135" y="65" class="t-sm t-b">Osteopenia</text>
            <text x="255" y="65" class="t-sm t-b">Normal</text>
            <text x="98" y="100" class="t-sm">−2.5</text>
            <text x="230" y="100" class="t-sm">−1</text>
            <text x="310" y="100" class="t-sm">0</text>
            <text x="10" y="130" class="t-sm t-bad">≤ −2.5 + fragility fracture</text>
            <text x="10" y="150" class="t-sm t-bad t-b">= severe osteoporosis</text>
          </svg>
      - kind: check
        page: 223
        quote: "Osteoporosis: T ≤ –2.5."
        question: "A T-score of –2.5 with no fracture is:"
        options: ["Osteoporosis", "Osteopenia", "Severe osteoporosis", "Normal"]
        answer: 0
        why:
          - "صح: سالب 2.5 نفسها داخلة في الـ osteoporosis."
          - "الـ osteopenia بين سالب 1 وسالب 2.5، من غير ما توصل لسالب 2.5."
          - "الـ severe محتاج fragility fracture."
          - "الطبيعي سالب 1 أو أعلى."
      - kind: explain
        page: 223
        quote: "Estimates 10-year probability of: o Hip fracture. o Major osteoporotic fracture. Can be used with or without BMD"
        title: "الـ FRAX"
        text: |
          الـ ==FRAX== بيقدّر احتمال الكسر في **10 سنين**:

          - **Hip fracture**.
          - **Major osteoporotic fracture**.

          وينفع **بالـ BMD أو من غيره**. أهميته: مريضة osteopenia بس الـ FRAX عالي، تتعالج.
      - kind: table
        page: 223
        quote: "Women ≥ 65 years. Men ≥ 70 years. Postmenopausal women < 65 with risk factors. Adults with fragility fractures."
        title: "مين يعمل BMD؟"
        columns: ["Group", "Threshold"]
        rows:
          - ["Women", "≥ 65 years"]
          - ["Men", "≥ 70 years"]
          - ["Postmenopausal < 65", "With risk factors"]
          - ["Any adult", "Fragility fracture"]
          - ["Glucocorticoids", "≥ 5 mg prednisone for ≥ 3 months"]
        hide: [[0, 1], [1, 1], [4, 1]]
      - kind: aside
        tone: trap
        page: 223
        quote: "Long-term glucocorticoid therapy (≥5 mg prednisone for ≥3 months)."
        text: "خد بالك: هنا الكتاب كاتب **≥ 5 mg** prednisone لمدة 3 شهور عشان الـ BMD testing. بعدين في جزء الـ GIOP (ص 228) هيقول **≥ 2.5 mg/day** لأي حد يتقيّم. لو السؤال عن الـ BMD indications قول 5، ولو عن الـ GIOP assessment قول 2.5."
      - kind: explain
        page: 224
        quote: "CBC, ESR. Calcium, phosphate. ALP, creatinine, TSH. 25-hydroxyvitamin D. PTH."
        title: "التحاليل: دوّر على السبب"
        text: |
          قبل ما تقول primary، استبعد الـ secondary:

          - **CBC، ESR**.
          - **Calcium، phosphate**.
          - **ALP، creatinine، TSH**.
          - **25-hydroxyvitamin D**.
          - **PTH**.
          - **Serum protein electrophoresis** لو شاكك في ==multiple myeloma==.
      - kind: mnemonic
        page: 224
        quote: "Serum protein electrophoresis (if multiple myeloma is suspected)."
        word: "BONES"
        parts:
          - { key: "B", text: "Blood count and ESR (CBC, ESR)" }
          - { key: "O", text: "Overactive glands: TSH and PTH" }
          - { key: "N", text: "Nephro and bone enzymes: creatinine, ALP" }
          - { key: "E", text: "Electrophoresis if myeloma is suspected" }
          - { key: "S", text: "Serum calcium, phosphate and 25(OH) vitamin D" }
        hook: |
          تحاليل الـ secondary osteoporosis بتتلم في **BONES**.
      - kind: explain
        page: 224
        quote: "Hip or vertebral fracture. o T-score ≤ –2.5 at spine, femoral neck, or total hip."
        title: "إمتى نبدأ دوا؟"
        text: |
          **Postmenopausal women أو رجالة ≥ 50** عندهم واحد من:

          - **Hip أو vertebral fracture**.
          - **T ≤ –2.5** في الـ spine أو femoral neck أو total hip.
          - ==Osteopenia + high FRAX==.
      - kind: case
        page: 224
        quote: "Osteopenia (T-score between –1 and –2.5) + high FRAX score."
        stem: "A 60-year-old woman, smoker, BMI 18, had a DEXA."
        steps:
          - reveal: "Femoral neck T –1.9. No fractures."
            question: "Category?"
            options: ["Osteopenia", "Osteoporosis", "Normal", "Severe osteoporosis"]
            answer: 0
            why: "Between −1 and −2.5."
          - reveal: "Her FRAX 10-year hip fracture probability is high."
            question: "Treat with a drug?"
            options: ["Yes: osteopenia plus high FRAX", "No: only T ≤ −2.5 qualifies", "Only after a fracture", "Only if she is over 65"]
            answer: 0
            why: "Osteopenia with a high FRAX score is a drug indication."
          - question: "Which lifestyle changes go with the drug?"
            options: ["Stop smoking, weight-bearing exercise, calcium and vitamin D", "Bed rest", "High-dose vitamin A", "Nothing extra"]
            answer: 0
            why: "Smoking and low weight are modifiable risk factors; calcium 1000–1200 mg and vitamin D 800–1000 IU."
      - kind: try
        items: [rheum.L14.015, rheum.L14.017, rheum.L14.018, rheum.L14.021, rheum.L14.025]
    recap:
      - "DEXA = gold standard."
      - "T-score: normal ≥ −1; osteopenia −1 to −2.5; osteoporosis ≤ −2.5; severe = plus a fragility fracture."
      - "FRAX: احتمال الكسر في 10 سنين، بالـ BMD أو من غيره."
      - "BMD: ستات ≥ 65، رجالة ≥ 70، كسور، steroids."
      - "Treat: hip or vertebral fracture, or T ≤ −2.5, or osteopenia with a high FRAX."
    practice: [rheum.L14.014, rheum.L14.015, rheum.L14.016, rheum.L14.017, rheum.L14.018, rheum.L14.019, rheum.L14.020, rheum.L14.021, rheum.L14.022, rheum.L14.025, rheum.L14.051, rheum.L14.052, rheum.L14.064, rheum.L14.065, rheum.L14.072]
