            <text x="165" y="50" text-anchor="middle" class="t-sm t-mut">each step keeps the ones before</text>
          </svg>
      - kind: explain
        page: 129
        title: "الـ Binet: عدّ المناطق"
        quote: "Table 1: Rai and Binet staging systems in chronic lymphocytic leukemia (CLL)\n| Stage | Lymphocytosis | Lymphadenopathy | Hepatomegaly or splenomegaly | Hemoglobin (gram/dl) | Platelets X 10³/μl |\n| Rai 0 | + | - | - | ≥ 11 | ≥ 100 |\n| Rai I | + | + | - | ≥ 11 | ≥ 100 |\n| Rai II | + | ± | + | ≥ 11 | ≥ 100 |\n| Rai III | + | ± | ± | < 11 | ≥ 100 |\n| Rai IV | + | ± | ± | Any | < 100 |\n| Binet A | + | ± | ± (<3 Lymphatic groups* positive) | ≥ 10 | ≥ 100 |\n| Binet B | + | ± | ± (<3 Lymphatic groups* positive) | ≥ 10 | ≥ 100 |\n| Binet C | + | ± | ± | < 10 | ≤ 100 |"
        text: |
          الـ **Binet (1981, United Kingdom (UK))** بيعدّ مناطق الغدد (lymphoid areas) ويبص على الـ Hb والـ platelets:
          - **A**: أقل من 3 مناطق، **Hb ≥10** و platelets ≥100
          - **B**: ==3 مناطق أو أكتر==، Hb ≥10 و platelets ≥100
          - **C**: ==Hb <10 أو platelets <100== مهما كانت الغدد

          ليه الأنيميا والـ platelets بيعملوا أعلى stage في الاتنين؟ التفسير المقبول (مش في الكتاب): الغدد والطحال معناهم حجم مرض كبير، لكن الـ cytopenias معناها إن ==النخاع نفسه بيقع==، وده اللي بيموّت العيان. وعشان كده الكتاب بيقول نعالج Rai III و IV.
      - kind: aside
