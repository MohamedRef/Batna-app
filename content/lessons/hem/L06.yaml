  - id: hem.L06.lesson6
    title: "ABO: مين يدّي مين؟"
    hook: "كيس دم واحد غلط ممكن يموّت. الفكرة كلها: الـ antibodies اللي في مين، ضد الـ antigens اللي على مين."
    minutes: 7
    pages: [86, 87]
    topics: [compatibility]
    goals:
      - "تعرف الـ antigens والـ antibodies في كل ABO group"
      - "تفرّق major عن minor incompatibility وتعرف ليه الـ major أخطر"
    status: unverified
    steps:
      - kind: explain
        page: 86
        title: "قد إيه blood group؟"
        quote: "The International Society of Blood Transfusion (ISBT) recognizes 339 blood group antigens; 297 of these are classified into 1 of 33 blood group systems"
        text: |
          الـ **International Society of Blood Transfusion (ISBT)** بتعرف **339 antigens**، منهم **297** في **33 systems**. كل system = **gene واحد** أو cluster من 2–3 genes قريبين، فكل system ==genetically discrete==.

          يعني إيه؟ الـ genes جوه الـ system قريبين من بعض ومفيش recombination بينهم تقريبًا، فبيتورثوا **حتة واحدة**. عشان كده كل system بيتعامل لوحده: الـ ABO بتاعك مالوش دعوة بالـ Kell بتاعك.
      - kind: figure
        page: 87
        quote: "| | Group A | Group B | Group AB | Group O |\n| Red blood cell type | A | B | AB | O |\n| Antibodies in Plasma | Anti-B | Anti-A | None | Anti-A and Anti-B |\n| Antigens in Red Blood Cell | A antigen | B antigen | A and B antigens | None |"
        title: "الـ ABO في لوحة واحدة"
        alt: "Four columns for groups A, B, AB and O. A has A antigen and anti-B; B has B antigen and anti-A; AB has both antigens and no antibodies; O has no antigens and both anti-A and anti-B."
        caption: "الـ antibodies دايمًا ضد اللي **مش موجود**. **O** معاه anti-A و anti-B، و ==AB== مفيش antibodies خالص."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="70" class="t-sm t-mut">Antigen</text>
            <text x="10" y="150" class="t-sm t-mut">Plasma</text>
            <text x="10" y="166" class="t-sm t-mut">antibody</text>
            <text x="105" y="25" text-anchor="middle" class="t-b">A</text>
            <text x="165" y="25" text-anchor="middle" class="t-b">B</text>
            <text x="225" y="25" text-anchor="middle" class="t-b">AB</text>
            <text x="290" y="25" text-anchor="middle" class="t-b">O</text>
            <circle cx="105" cy="70" r="22" class="fg-acc"/><text x="105" y="75" text-anchor="middle" class="t-sm t-b">A</text>
            <circle cx="165" cy="70" r="22" class="fg-good"/><text x="165" y="75" text-anchor="middle" class="t-sm t-b">B</text>
            <circle cx="225" cy="70" r="22" class="fg-bad"/><text x="225" y="75" text-anchor="middle" class="t-sm t-b">A+B</text>
            <circle cx="290" cy="70" r="22" class="fg-box"/><text x="290" y="75" text-anchor="middle" class="t-sm t-b">none</text>
            <rect x="75" y="130" width="60" height="40" rx="8" class="fg-box"/><text x="105" y="155" text-anchor="middle" class="t-sm">anti-B</text>
            <rect x="135" y="130" width="60" height="40" rx="8" class="fg-box"/><text x="165" y="155" text-anchor="middle" class="t-sm">anti-A</text>
            <rect x="195" y="130" width="60" height="40" rx="8" class="fg-thin"/><text x="225" y="155" text-anchor="middle" class="t-sm">none</text>
            <rect x="260" y="130" width="62" height="40" rx="8" class="fg-box"/><text x="291" y="148" text-anchor="middle" class="t-sm">anti-A</text><text x="291" y="163" text-anchor="middle" class="t-sm">anti-B</text>
            <text x="165" y="210" text-anchor="middle" class="t-sm t-mut">Components with &gt;2 ml RBC must match the plasma</text>
          </svg>
      - kind: explain
        page: 87
        title: "Major ولا minor؟"
        quote: "Two types of ABO incompatibility can be distinguished:\n  Major incompatibility, where antibodies in the recipient will destroy transfused red cells (e.g. A to O, B to O, A to B, B to A).\n  Minor incompatibility, where antibodies in the donated blood will destroy the recipient's red cells (e.g. O to A, O to B)."
        text: |
          أي component فيه **أكتر من 2 ml red blood cells (RBCs)** لازم يبقى compatible مع **plasma العيان**.

          - ==Major==: antibodies **العيان** بتكسّر كرات **المتبرع** (A ← O يعني A لعيان O، B لـ O، A لـ B، B لـ A). ده الخطر الكبير.
          - **Minor**: antibodies **في كيس المتبرع** بتكسّر كرات **العيان** (O لـ A، O لـ B).

          ليه الـ major أخطر؟ التفسير المقبول (مش في الكتاب): في الـ major، **كل plasma العيان** (لترات) فيها antibodies جاهزة بتهجم على كرات الكيس كلها مرة واحدة. في الـ minor، الـ antibodies اللي في plasma الكيس الصغيرة **بتتخفّف** في دم العيان كله، فأثرها أقل.
      - kind: reveal
        page: 87
        quote: "Blood components that contain > 2 ml of RBC must be compatible with patient‘s plasma."
        prompt: "من اللوحة: ليه كرات O تنفع لأي حد تقريبًا، وعيان AB بياخد كرات من أي group؟"
        answer: |
          بص على **الـ antigens والـ antibodies** بس:

          - كرات **O** مفيش عليها A ولا B، فمفيش antibody عند أي عيان يلاقي حاجة يمسكها.
          - عيان **AB** مفيش في الـ plasma بتاعته anti-A ولا anti-B، فمفيش حاجة تكسّر أي كرات.

          القاعدة اللي في الكتاب: أي component فيه **أكتر من 2 ml RBCs** لازم يبقى compatible مع ==plasma العيان==.
      - kind: aside
        tone: trap
        page: 87
        quote: "Two types of ABO incompatibility can be distinguished:\n  Major incompatibility, where antibodies in the recipient will destroy transfused red cells (e.g. A to O, B to O, A to B, B to A).\n  Minor incompatibility, where antibodies in the donated blood will destroy the recipient's red cells (e.g. O to A, O to B)."
        text: |
          الـ **O** مش "universal donor" بريء 100%: الـ plasma بتاعته فيها **anti-A و anti-B**، فلو اديت **whole blood O** لعيان A ممكن تعمل ==minor incompatibility==. علشان كده بنفضّل **packed RBCs** (plasma قليلة).
      - kind: check
        page: 87
        quote: "Two types of ABO incompatibility can be distinguished:\n  Major incompatibility, where antibodies in the recipient will destroy transfused red cells (e.g. A to O, B to O, A to B, B to A).\n  Minor incompatibility, where antibodies in the donated blood will destroy the recipient's red cells (e.g. O to A, O to B)."
        question: "Group A red cells given to a group O patient. What happens?"
        options: ["Major incompatibility", "Minor incompatibility", "No reaction", "Only Rh reaction"]
        answer: 0
        why:
          - "صح: الـ anti-A بتاع العيان O بيكسّر كرات A اللي اتنقلتله."
          - "الـ minor لما antibodies المتبرع هي اللي بتهاجم (O لـ A)."
          - "فيه reaction أكيد: anti-A ضد A cells."
          - "الـ Rh مش في السؤال؛ الـ ABO لوحده كفاية يعمل hemolysis."
      - kind: sort
        page: 87
        quote: "Two types of ABO incompatibility can be distinguished:\n  Major incompatibility, where antibodies in the recipient will destroy transfused red cells (e.g. A to O, B to O, A to B, B to A).\n  Minor incompatibility, where antibodies in the donated blood will destroy the recipient's red cells (e.g. O to A, O to B)."
        prompt: "Major ولا minor؟ (الأول المتبرع، بعده العيان)"
        bins: ["Major", "Minor"]
        cards:
          - { text: "A to O", bin: 0 }
          - { text: "B to O", bin: 0 }
          - { text: "A to B", bin: 0 }
          - { text: "B to A", bin: 0 }
          - { text: "O to A", bin: 1 }
          - { text: "O to B", bin: 1 }
        why: "اسأل: الـ antibody اللي هيهجم في مين؟ لو في العيان (عنده anti- ضد كرات الكيس) يبقى major. لو في plasma الكيس (O معاه anti-A و anti-B) ضد كرات العيان يبقى minor."
      - kind: try
        items: [hem.L06.015, hem.L06.017, hem.L06.018, hem.L06.019, hem.L06.020]
    recap:
      - "ISBT: 339 antigens، 297 في 33 systems؛ كل system gene واحد أو cluster، genetically discrete."
      - "الـ antibodies دايمًا ضد اللي مش موجود: A معاه anti-B، B معاه anti-A، O الاتنين، AB ولا حاجة."
      - "أي component فيه >2 ml RBCs لازم compatible مع plasma العيان."
      - "Major: antibodies العيان ضد كرات المتبرع (الأخطر). Minor: antibodies المتبرع ضد كرات العيان."
    practice: [hem.L06.015, hem.L06.016, hem.L06.017, hem.L06.018, hem.L06.019, hem.L06.020, hem.L06.021, hem.L06.022]
