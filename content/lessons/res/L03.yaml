        caption: "كل ما تنزل في القمع السؤال يضيق، لحد ما يبقى حاجة تقدر تقيسها."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03f1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <path d="M5 10h320l-20 55H25z" class="fg-box"/>
            <text x="165" y="32" text-anchor="middle" class="t-sm t-mut">Topic of interest</text>
            <text x="165" y="52" text-anchor="middle" class="t-b">Women's health</text>
            <path d="M28 70h274l-20 55H48z" class="fg-box"/>
            <text x="165" y="92" text-anchor="middle" class="t-sm t-mut">Narrowed topic</text>
            <text x="165" y="112" text-anchor="middle" class="t-b">Women and cancer</text>
            <path d="M51 130h228l-20 55H71z" class="fg-good"/>
            <text x="165" y="152" text-anchor="middle" class="t-sm t-mut">Focused topic</text>
