  # ------------------------------------------------------------------
  - id: res.L09.lesson4
    title: "الـ informed consent ولجنة الأخلاقيات"
    hook: "إمضاء على ورقة مش consent. الـ consent عملية بتبدأ من أول كلمة وبتفضل لآخر يوم في الدراسة."
    minutes: 9
    pages: [55, 84]
    topics: [consent, rec]
    goals:
      - "ترتّب خطوات الـ consent process وتعرف شروط الورقة"
      - "تعرف الـ REC بتعمل إيه وليه محتاجينها"
      - "تعدّ الـ 7 items في الـ application والـ essential documents"
      - "تعرف مدة الموافقة وقرارات اللجنة"
    status: unverified
    steps:
      - kind: reveal
        page: 55
        quote: "Informed consent is a Document or a Process ??\n  A Document...\n  A process...\n  Both..."
        prompt: "الـ informed consent ورقة ولا process؟"
        answer: |
          **الاتنين.** ورقة مكتوبة بتوثّق، و**process** بتبدأ من أول تواصل مع المشارك وبتكمل طول الدراسة.

          وهو **مش اختياري**: essential حسب الـ guidelines والـ regulations الحالية (slide 56).
      - kind: order
        page: 57
        quote: "The Consent process:\n  Information provided → Information understood → Decision made → Comprehension is monitored and maintained"
        prompt: "رتّب الـ consent process:"
        steps:
          - "Information provided"
          - "Information understood"
          - "Decision made"
          - "Comprehension monitored and maintained"
        why: "تدّي المعلومة ← تتأكد إنه فهمها ← هو يقرر ← وتفضل متابع فهمه طول الدراسة، مش خلاص بعد الإمضاء."
      - kind: explain
        page: 64
        quote: "Informed consent must be documented using a written consent form.\n  Approved by the REC.\n  Signed by the research subject.\n  A copy must be given to the person signing the form."
        title: "مين محتاج consent؟ والورقة شكلها إيه؟"
        text: |
          ==كل الدراسات== لازم consent ياخدوه **قبل** (prospectively) من كل مشارك: كل الأنواع وكل مستويات الـ risk، **إلا لو الـ REC عملت waive** (slide 61).

          والـ consent يتوثّق في **written consent form**:

          - **Approved by the REC**.
          - **Signed** by the research subject.
          - **نسخة** للي مضى.
      - kind: explain
        page: 63
        quote: "Additional elements:\n  Statement that there may be risks which are unforeseeable.\n  Withdrawal criteria.\n  Additional costs to research subject.\n  Consequences of subject's withdrawal from research.\n  Statement that will be told of new findings.\n  Approximate number of subjects in study."
        title: "Additional elements في الورقة"
        text: |
          - إن فيه **risks مش متوقعة**.
          - **Withdrawal criteria**.
          - **تكاليف إضافية** على المشارك.
          - **عواقب الانسحاب**.
          - إنه **هيتقال له أي نتايج جديدة**.
          - **عدد المشاركين التقريبي**.
      - kind: explain
        page: 65
        quote: "CIOMS (2002)\n\"Obtaining informed consent is a process that is begun when initial contact is made with a prospective subject and continues throughout the course of the study. By informing the prospective subjects, by repetition and explanation, by answering their questions as they arise, and by ensuring that each individual understands each procedure, investigators elicit their informed consent and in so doing manifest respect for their dignity and autonomy....\""
        title: "CIOMS والمسؤولية"
        text: |
          الـ ==CIOMS (2002)==: الـ consent **process** بتبدأ من **initial contact** وبتكمل **throughout the course of the study**: بالشرح والتكرار والإجابة على الأسئلة، والتأكد إن كل واحد فاهم كل procedure. وده احترام لكرامته واستقلاله.

          والخلاصة (slide 66): المسؤولية النهائية عن حماية المشاركين على الـ **principal investigator (PI)**، والـ valid consent جزء مهم منها.
      - kind: check
        page: 61
        quote: "All studies must have informed consent prospectively obtained from each research subject.\n  All types.\n  Level of risk.\n  Unless Research Ethics committee (REC) waives."
        question: "A low-risk survey wants to skip consent. Who can waive it?"
        options: ["The research ethics committee (REC)", "The principal investigator", "No one, ever"]
        answer: 0
        why:
          - "صح: consent لكل الدراسات إلا لو الـ REC عملت waive."
          - "الـ PI مسؤول عن الحماية، بس مايقررش لوحده يشيل الـ consent."
          - "الـ slide فيها استثناء واحد: الـ REC."
      - kind: explain
        page: 68
        quote: "What is a Research Ethics Committee (REC)?\n  A committee formed by an institution to review, approve the initiation of, and to conduct periodic review of research involving human subjects\n  The primary purpose of a REC is to assure the protection of the rights and welfare of human subjects"
        title: "الـ REC = IRB"
        text: |
          ==Research Ethics Committee (REC)== هي نفسها الـ **Institutional Review Board (IRB)** (slide 67).

          لجنة بتعملها المؤسسة عشان **تراجع وتوافق على بداية** البحث على البشر، و**تراجعه بشكل دوري**. هدفها الأساسي: **حماية حقوق وسلامة المشاركين**.
      - kind: explain
        remind: [res.L09.064]
        page: 71
        quote: "Why Do We Need Someone Watching Over Us?\n  Objectivity:\n    We underestimate the risks of what we're comfortable doing\n    We overestimate the benefits of what we believe in\n  Social context\n  Inherent conflicts of interest\n  Maintain public trust"
        title: "ليه محتاجين حد يراقبنا؟"
        text: |
          - **Objectivity**: بنصغّر خطر الحاجة اللي متعودين عليها، وبنكبّر فايدة الحاجة اللي مصدقينها.
          - **Social context**.
          - **Conflicts of interest**.
          - **Public trust**.

          وكمان بتفيدك (slide 72): بحث أحسن، سمعة أحسن، موافقات بتطلبها الجهات العلمية، **نشر في مجلات كويسة**، و**funding**.
      - kind: aside
        tone: joke
        page: 71
        quote: "Why Do We Need Someone Watching Over Us?\n  Objectivity:\n    We underestimate the risks of what we're comfortable doing\n    We overestimate the benefits of what we believe in\n  Social context\n  Inherent conflicts of interest\n  Maintain public trust"
        text: |
          زي الأم اللي بتشوف ابنها أحلى عيل في الدنيا: إنت كمان شايف بحثك آمن جدًا ومفيد جدًا. اللجنة هي «الخالة» اللي هتقولك بهدوء: «طب والعيل ده نايم كام ساعة؟».
      - kind: explain
        remind: [res.L09.068]
        page: 77
        quote: "Essential Documents:\n  1. A signed and dated application form\n  2. Full protocol.\n  3. Informed consent\n  4. CV's for the PI and co-investigators.\n  5. Additional tools for the study\n  6. For clinical trials...safety reports, previous studies..\n  7. Signed researcher assurance agreement"
        title: "الـ application والورق"
        text: |
          الـ **application** بيجاوب **7 items** (slide 76): subject selection، procedures، risks/benefits، confidentiality، informed consent، حماية زيادة للـ vulnerable، و conflict of interest.

          والـ **essential documents**:

          1. Application form ممضي ومتأرخ.
          2. **Full protocol**.
          3. **Informed consent**.
          4. **Curriculum vitae (CV)** للـ PI والـ co-investigators.
          5. أدوات الدراسة الإضافية.
          6. للـ clinical trials: safety reports ودراسات سابقة.
          7. **Researcher assurance agreement** ممضي.
      - kind: figure
        remind: [res.L09.073]
        page: 82
        quote: "REC Procedures\n  PI submits Study Protocol, Consent Form → REC Chair or GS → Exempt or Expedited, or Full review by the full Board\n  Full review: 2 REC Members assigned as primary and secondary reviewers; protocol and consent form and other documents discussed at meeting → REC Vote → comments sent to PI:\n    Approve\n    Approval with minor changes\n    Deferral\n    Disapprove"
        title: "الملف بيمشي إزاي في اللجنة"
        alt: "Flow: the principal investigator submits the protocol and consent form; the REC chair sends it either to exempt or expedited review, or to full-board review. In full review two members act as primary and secondary reviewers, the protocol is discussed at the meeting and the REC votes: approve, approve with minor changes, defer, or disapprove; comments go back to the investigator."
        caption: "الـ **PI** يقدّم ← الـ **chair** يحدد: exempt/expedited أو **full board** ← اتنين reviewers ← مناقشة ← **vote**: approve، minor changes، deferral، disapprove."
