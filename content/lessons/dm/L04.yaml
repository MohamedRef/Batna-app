        page: 42
        title: "رقم واحد تحفظه"
        quote: "Blood pressure control\n  Each 2 mmHg Decrease in SBP reduces CV Risk by 7–10%\n  What is the BP target\n  People with diabetes and hypertension qualify for antihypertensive drug therapy when the blood pressure is persistently elevated ≥130/80 mmHg.\n  The on-treatment target blood pressure goal is <130/80 mmHg, if it can be safely attained."
        text: |
          - كل ==2 mmHg== أقل في الـ systolic blood pressure (SBP) = **7–10%** أقل cardiovascular (CV) risk.
          - ابدأ دوا لما الضغط **persistently ≥130/80**.
          - الهدف **<130/80** لو ينفع بأمان.

          يعني لو العيان نزل من 150 لـ 140، ده تقريبًا تلت خطر الـ CV راح، حتى لو لسه ما وصلش للهدف. عشان كده كل ملّي بيفرق، وما تستناش «الضغط المثالي» قبل ما تعالج. و «لو ينفع بأمان» لأن الضغط الواطي زيادة عند الكبير بيعمل دوخة ووقوع.
      - kind: explain
        page: 42
        title: "الـ ADA: أول خطوة"
        quote: "Lifestyle management\n| Initial BP | Start | Albuminuria or CAD: No | Albuminuria or CAD: Yes |\n|---|---|---|---|\n| Initial BP >140/90 and <160/100 mmHg | Start one agent | Start one drug: ACEi or ARB, CCB, Diuretic | Start: ACEi or ARB |\n| Initial BP ≥160/100 mmHg | Start two agents | Start drug from 2 of 3 options: ACEi or ARB, CCB, Diuretic | Start: ACEi or ARB and CCB or Diuretic |\nAssess BP Control and Adverse Effects"
        text: |
          - **>140/90 و <160/100** ← **دوا واحد** + lifestyle
          - **≥160/100** ← ==دوايين== + lifestyle

          ولو فيه **albuminuria أو coronary artery disease (CAD)** ← لازم **ACE inhibitor (ACEi) أو angiotensin II receptor blocker (ARB)** يبقى منهم.

          ليه دوايين من الأول لو الضغط عالي جدًا؟ لأن دوا واحد بينزّل حوالي 10 mmHg، فلو العيان بعيد عن الهدف بـ 30 مش هيوصل بدوا واحد، ومع كل زيارة تأجيل الخطر شغال. وليه الـ ACEi/ARB مع الـ albuminuria؟ لأنه بيقلل الضغط جوه الـ glomerulus نفسه (المحاضرة 3)، فبيحمي الكلية فوق ما بينزّل الضغط.
