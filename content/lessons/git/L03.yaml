  - id: git.L03.lesson9
    title: "المخ والمصران، وخريطة Rome IV"
    hook: "الخوف بيبطّأ المعدة ويسرّع القولون، والمخ عنده بوابة للألم. ولما تفهم ده، الـ 33 مرض بيتنظموا في 6 حروف."
    minutes: 8
    pages: [83, 87]
    topics: [physiology, classification]
    goals:
      - "تشرح الـ brain–gut axis في الاتجاهين"
      - "تشرح بوابة الألم وإيه اللي بيفتحها ويقفلها"
      - "تحفظ الـ domains بتوع Rome IV بالحروف"
    status: unverified
    steps:
      - kind: explain
        page: 83
        quote: "The brain-gut axis is the neuroanatomic substrate in which the psychosocial factors influence the GI tract and vice versa."
        title: "hardware و software"
        text: |
          الكتاب: الـ ==brain–gut axis== هو الـ **neuroanatomic substrate** اللي بيه العوامل النفسية بتأثر على الجهاز الهضمي **والعكس**.

          - الـ **hard wiring**: دايرة متكاملة بتنقل المعلومات من مراكز المشاعر والتفكير (thoughts، feelings، memories، pain regulation) للجهاز الهضمي.
          - الـ **software**: الـ ==neurotransmitters==.
          - **Structurally**: فيه وصلات مباشرة بين الـ CNS والـ **myenteric plexus** والعضلات وباقي الأعضاء، بتأثر على sensory و motor و endocrine و autonomic و immune و inflammatory function.

          التفسير المقبول (مش في الكتاب): تشبيه الكتاب بالكمبيوتر مفيد: الأسلاك (الأعصاب) ممكن تكون سليمة 100%، والمشكلة في البرنامج (الـ neurotransmitters والإشارات). علشان كده الأدوية اللي بتشتغل على الـ neurotransmitters (زي الـ antidepressants) بتفيد في الـ FGIDs.
      - kind: figure
        page: 84
        quote: "Thus, emotions such as fear, anger, anxiety, painful stimuli, and physical stress can delay gastric emptying and intestinal transit."
        title: "الـ brain–gut axis: طريق في الاتجاهين"
        alt: "Brain box at the top and gut box at the bottom. A red arrow down the left side lists top-down effects: stress, fear and anger slow gastric emptying, speed colonic transit and weaken the mucosal barrier. A dark arrow up the right side lists bottom-up effects: inflammation and dysmotility amplify visceral signals, giving more pain, anxiety and depression. The brain box notes that the anterior cingulate cortex works as the pain gate."
        caption: "من فوق لتحت: المشاعر بتغيّر الحركة والحاجز. ومن تحت لفوق: الالتهاب والحركة بيعلّوا الإشارة للمخ. والبوابة في النص هي الـ ACC."
        svg: |
          <svg viewBox="0 0 330 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L03ga" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
