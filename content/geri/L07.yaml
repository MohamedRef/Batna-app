  # ---------- p121-122: frailty ----------
  - id: geri.L07.084
    kind: table
    topic: frailty
    title: Clinical Frailty Scale (Rockwood)
    columns: [Level, Name, Key feature]
    rows:
      - ["1", Very fit, "Robust, active, energetic, motivated; exercise regularly"]
      - ["2", Well, "No active disease symptoms, but less fit than 1; active occasionally"]
      - ["3", Managing well, "Medical problems well controlled; not regularly active beyond walking"]
      - ["4", Vulnerable, "Not dependent, but symptoms limit activities; 'slowed up', tired"]
      - ["5", Mildly frail, "Evident slowing; need help with high-order IADLs"]
      - ["6", Moderately frail, "Need help with all outside activities, housekeeping, stairs, bathing"]
      - ["7", Severely frail, "Completely dependent for personal care, but stable; not at high risk of dying within ~6 months"]
      - ["8", Very severely frail, "Completely dependent, approaching end of life; could not recover even from a minor illness"]
      - ["9", Terminally ill, "Life expectancy <6 months, not otherwise evidently frail"]
    blanks: [[3, 1], [4, 2], [5, 2], [6, 2], [8, 2]]
    src: { page: 121, quote: "Clinical Frailty Scale\n| Score | Category | Description |\n|---|---|---|\n| 1 | Very Fit | People who are robust, active, energetic and motivated. These people commonly exercise regularly. They are among the fittest for their age. |\n| 2 | Well | People who have no active disease symptoms but are less fit than category 1. Often, they exercise or are very active occasionally, e.g. seasonally. |\n| 3 | Managing Well | People whose medical problems are well controlled, but are not regularly active beyond routine walking. |\n| 4 | Vulnerable | While not dependent on others for daily help, often symptoms limit activities. A common complaint is being \"slowed up\", and/or being tired during the day. |\n| 5 | Mildly Frail | These people often have more evident slowing, and need help in high order IADLs (finances, transportation, heavy housework, medications). Typically, mild frailty progressively impairs shopping and walking outside alone, meal preparation and housework. |\n| 6 | Moderately Frail | People need help with all outside activities and with keeping house. Inside, they often have problems with stairs and need help with bathing and might need minimal assistance (cuing, standby) with dressing. |\n| 7 | Severely Frail | Completely dependent for personal care, from whatever cause (physical or cognitive). Even so, they seem stable and not at high risk of dying (within ~ 6 months). |\n| 8 | Very Severely Frail | Completely dependent, approaching the end of life. Typically, they could not recover even from a minor illness. |\n| 9 | Terminally Ill | Approaching the end of life. This category applies to people with a life expectancy <6 months, who are not otherwise evidently frail. |\nScoring frailty in people with dementia\nThe degree of frailty corresponds to the degree of dementia. Common symptoms in mild dementia include forgetting the details of a recent event, though still remembering the event itself, repeating the same question/story and social withdrawal.\nIn moderate dementia, recent memory is very impaired, even though they seemingly can remember their past life events well. They can do personal care with prompting.\nIn severe dementia, they cannot do personal care without help.\n1. Canadian Study on Health & Aging, Revised 2008. 2. K. Rockwood et al. A global clinical measure of fitness and frailty in elderly people. CMAJ 2005;173:489-495." }
    status: unverified
    tags: [high-yield, numbers]
    update:
      text: "Clinical Frailty Scale (CFS) version 2.0 renames levels 2 and 4–8: 2 Fit, 4 Living with very mild frailty, 5 Living with mild frailty, 6 Living with moderate frailty, 7 Living with severe frailty, 8 Living with very severe frailty. The levels and their meaning are unchanged."
      ref: "Rockwood K, Clinical Frailty Scale version 2.0, 2020"
