            <path d="M101 110v220" class="fg-ink" stroke-width="5" stroke-dasharray="4 4"/>
            <text x="196" y="230" class="t-sm t-b t-bad">3. Circular myotomy</text>
            <path d="M80 270h160" class="fg-thin" stroke-width="2"/>
            <text x="196" y="266" class="t-sm t-mut">GE junction</text>
            <text x="196" y="330" class="t-sm">myotomy: GEJ + 2 cm</text>
