        text: |
          **European Liver Fibrosis panel (ELF)** = score من تلات حاجات:
          - **Hyaluronic acid (HA)**
          - **Tissue inhibitor of metalloproteinase-1 (TIMP-1)**
          - **Amino-terminal propeptide of type III collagen (PIIINP)**

          الكتاب: اتجرّب في cohorts كتير، ومفيد في أمراض كبد مزمنة كتير، ==especially in ALD and NAFLD==.

          الفرق بينه وبين FIB-4 و APRI؟ التفسير المقبول (مش في الكتاب): FIB-4 و APRI بيقيسوا **آثار** التليف (AST عالي، platelets واطية). أما مكوّنات الـ ELF فهي جزء من ==matrix turnover== نفسه: collagen بيتبني (PIIINP)، matrix مش بتتكسّر (TIMP-1)، و HA مش بيتصفّى من الـ sinusoids. يعني بيقيس الـ scar وهي بتتعمل.
