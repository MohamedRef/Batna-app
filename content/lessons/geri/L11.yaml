  - id: geri.L11.lesson2
    title: "0.70 ولا Z-score؟"
    hook: "لو مشيت بالـ 0.70، تلت الكبار الأصحاء هيبقوا COPD. الدرس ده بيعلّمك ليه الـ Z-score أعدل."
    minutes: 9
    pages: [192, 197]
    topics: [obstruction, staging]
    goals:
      - "تعرف عيبين الـ GOLD في الكبار"
      - "تعرف الـ LLN بتاع الـ GLI وتستاج بالـ Z-score"
      - "تحسب وتقرا الـ Z-score"
    status: unverified
    steps:
      - kind: explain
        page: 192
        quote: "The ATS/ERS currently defines the LLN as the fifth percentile distribution of reference values"
        title: "التلات تعريفات"
        text: |
          الـ obstruction = **FEV1/FVC قليل**. بس كام هو القليل في واحد عنده 80 سنة؟

          1. **ATS/ERS**: الـ ==LLN== = الـ **5th percentile** في never-smokers أصحاء بنفس السن والطول والجنس والعرق (معادلات NHANES III).
          2. **GOLD**: ratio ثابت **أقل من 0.70**.
          3. **GLI**: **Z-score أقل من -1.64**.
      - kind: explain
        page: 193
        quote: "Second, GOLD expresses the FEV1 as%Pred, thus failing to account for age-related variability in spirometricperformance."
        title: "عيبين الـ GOLD"
        text: |
          - **الأول**: الـ ratio الثابت 0.70 مش بيفرّق بين التغيير الطبيعي بالسن والـ COPD. ratio أقل من 0.70 بيتشاف كتير في **never-smokers أصحاء فوق 65**.
          - **التاني**: بيعبّر عن الـ FEV1 كـ **%Pred**، فبيتجاهل إن الـ variability بتزيد مع السن.

          النتيجة: الـ prevalence بالـ GOLD ==37.7%== مقابل **15.4%** بالـ Z-score. والـ overdiagnosis ده **مش مرتبط** بأعراض ولا دخول مستشفى ولا وفيات.
      - kind: aside
        tone: joke
        page: 193
        quote: "Overdiagnosis of airflow obstruction by GOLD is not associated with respiratory symptoms"
        text: "جدّك اللي عمره ما شرب سيجارة وبيمشي 5 كيلو كل يوم؟ بالـ GOLD ممكن يطلع COPD. هو مش مريض، هو بس عيد ميلاده كتير."
      - kind: explain
        page: 193
        quote: "GLI calculated Z-scores account for the age-related decline in lung function and increased variability in spirometric performance"
        title: "الـ GLI"
        text: |
          - معادلات NHANES III لحد سن **80** بس، ومش بتحسب الـ variability.
          - الـ **GLI** بيعرّف الـ LLN = ==Z-score -1.64== (الـ 5th percentile).
          - بيحسب حساب نزول الوظايف بالسن والـ variability، ومعادلاته لأعراق كتير ولحد سن **95**.
          - الـ obstruction بالتعريف ده **مرتبط فعلًا** بالأعراض، الـ mobility، الـ frailty، دخول المستشفى والوفيات.
      - kind: figure
        page: 195
        quote: "Global Lung Initiative (GLI) FEV1/FVC Z-score < -1.64"
        title: "التعريف والـ staging"
        alt: "Two rulers. GLI: FEV1/FVC Z-score below -1.64 defines obstruction; FEV1 Z-score of -1.64 or more is mild, between -1.64 and -2.55 moderate, below -2.55 severe. GOLD: FEV1/FVC below 0.70; FEV1 80 percent predicted or more mild, 50 to 79 moderate, below 50 severe."
        caption: "GLI بالـ Z: -1.64 و -2.55. GOLD بالنسبة: 80 و 50 %Pred."
        svg: |
          <svg viewBox="0 0 330 270" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="22" class="t-b t-acc">GLI</text>
            <text x="60" y="22" class="t-sm">obstruction: FEV1/FVC Z &lt; -1.64</text>
            <rect x="10" y="34" width="105" height="40" class="fg-good"/>
            <rect x="115" y="34" width="105" height="40" class="fg-acc"/>
            <rect x="220" y="34" width="105" height="40" class="fg-bad"/>
            <text x="20" y="59" class="t-sm t-b">Mild</text>
            <text x="125" y="59" class="t-sm t-b">Moderate</text>
            <text x="230" y="59" class="t-sm t-b">Severe</text>
            <text x="12" y="94" class="t-sm">Z ≥ -1.64</text>
            <text x="117" y="94" class="t-sm">-1.64 to -2.55</text>
            <text x="222" y="94" class="t-sm">Z &lt; -2.55</text>
            <text x="10" y="150" class="t-b">GOLD</text>
            <text x="70" y="150" class="t-sm">obstruction: FEV1/FVC &lt; 0.70</text>
            <rect x="10" y="162" width="105" height="40" class="fg-good"/>
            <rect x="115" y="162" width="105" height="40" class="fg-acc"/>
            <rect x="220" y="162" width="105" height="40" class="fg-bad"/>
            <text x="20" y="187" class="t-sm t-b">Mild</text>
            <text x="125" y="187" class="t-sm t-b">Moderate</text>
            <text x="230" y="187" class="t-sm t-b">Severe</text>
            <text x="12" y="222" class="t-sm">≥ 80 %Pred</text>
            <text x="117" y="222" class="t-sm">50-79 %Pred</text>
            <text x="222" y="222" class="t-sm">&lt; 50 %Pred</text>
            <text x="10" y="258" class="t-sm t-mut">FEV1 grades the severity in both</text>
          </svg>
      - kind: check
        page: 195
        quote: "Global Lung Initiative (GLI) FEV1/FVC Z-score < -1.64"
        question: "GLI: FEV1/FVC Z = -2.1, FEV1 Z = -2.8. Severity?"
        options: ["Severe", "Moderate", "Mild", "No obstruction"]
        answer: 0
        why:
          - "صح: FEV1 Z أقل من -2.55."
          - "الـ moderate بين -1.64 و -2.55."
          - "الـ mild من -1.64 وطالع."
          - "الـ ratio Z أقل من -1.64، يعني فيه obstruction."
      - kind: explain
        page: 194
        quote: "Older persons have limited capacity to perform multiple FVC maneuvers, and may have an adverse response to an inhaledBD."
        title: "الـ reversibility"
        text: |
          الـ COPD = chronic airflow obstruction **مش fully reversible**. فالـ guidelines بتعمل spirometry قبل وبعد bronchodilator:

          - عشان الـ ==reversibility== (pre مقابل post).
          - والتشخيص بالـ **post-BD values**.

          بس في الكبار: صعب يعملوا FVC maneuvers كتير، وممكن يحصل adverse response للـ BD.
      - kind: explain
        page: 196
        quote: "The Z-score represents how many SD the measuredvalue is away from the mean predicted value."
        title: "يعني إيه Z-score؟"
        text: |
          الـ ==Z-score== = المريض بعيد عن المتوسط المتوقع بكام **SD**.

          **z = (x - mean) / SD**

          - 0 = زي المتوسط بالظبط.
          - موجب = فوق المتوسط، سالب = تحت.
          - -1 = SD واحد تحت المتوسط.

          وفي الـ normal curve: **68%** جوه 1 SD، **95%** جوه 2، و **99.7%** جوه 3.
      - kind: figure
        page: 197
        quote: "The location of the arrow or dot also allows to assess how severe any deficit is, with a more negative Z-score indicating more severe abnormality."
        title: "الـ Z-score على المسطرة"
        alt: "A horizontal Z-score scale from -4 to +2. The area right of -1.64 is white (normal), a lightly shaded band near -1.64 marks the edge, and the area left of it is heavily shaded (abnormal). A dot sits at -2.2 in the heavily shaded area."
        caption: "الأبيض طبيعي، الفاتح على الحدود، الغامق بره. وكل ما النقطة تروح شمال أكتر، المشكلة أشد."
        svg: |
          <svg viewBox="0 0 330 150" xmlns="http://www.w3.org/2000/svg">
            <rect x="15" y="40" width="110" height="40" class="fg-bad"/>
            <rect x="125" y="40" width="30" height="40" class="fg-acc"/>
            <rect x="155" y="40" width="160" height="40" class="fg-box"/>
            <circle cx="98" cy="60" r="8" class="fg-dot-bad"/>
            <text x="12" y="100" class="t-sm">-4</text>
            <text x="120" y="100" class="t-sm t-b">-1.64</text>
            <text x="210" y="100" class="t-sm">0</text>
            <text x="300" y="100" class="t-sm">+2</text>
            <text x="20" y="30" class="t-sm t-bad">abnormal</text>
            <text x="200" y="30" class="t-sm t-good">normal</text>
            <text x="15" y="130" class="t-sm t-mut">dot = this patient (Z -2.2)</text>
          </svg>
      - kind: aside
        tone: exam
        page: 197
        quote: "5% of healthy individuals (one in 20 PFTs) will have results below the lower limit of normal."
        text: "مع LLN = -1.64، **5% من الأصحاء** (واحد في كل 20 PFT) هيطلعوا تحت الطبيعي. عشان كده جملة الكتاب: treat the patient, not the numbers. ومفيش test لوحده يحدد الـ severity أو الـ prognosis."
      - kind: try
        items: [geri.L11.019, geri.L11.024, geri.L11.028, geri.L11.033, geri.L11.035]
    recap:
      - "ATS/ERS: LLN = 5th percentile (NHANES III لحد 80)."
      - "GOLD: 0.70 ثابت و %Pred؛ بيبالغ (37.7% مقابل 15.4%) ومن غير علاقة بالـ outcomes."
      - "GLI: Z < -1.64 للتشخيص؛ staging بالـ FEV1 Z: -1.64 و -2.55."
      - "COPD = مش fully reversible؛ التشخيص بالـ post-BD."
      - "Z = (x - mean)/SD؛ 5% من الأصحاء تحت الـ LLN: عالج المريض مش الرقم."
    practice: [geri.L11.017, geri.L11.018, geri.L11.019, geri.L11.020, geri.L11.021, geri.L11.022, geri.L11.023, geri.L11.024, geri.L11.025, geri.L11.026, geri.L11.027, geri.L11.028, geri.L11.029, geri.L11.030, geri.L11.031, geri.L11.032, geri.L11.033, geri.L11.034, geri.L11.035, geri.L11.036, geri.L11.100, geri.L11.101, geri.L11.102, geri.L11.103, geri.L11.120, geri.L11.123]
