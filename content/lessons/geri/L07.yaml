        alt: "Two bars of reserve. A fit older person has a tall bar; a minor insult like a new drug lowers it but it stays above the line of independence. A frail person has a short bar; the same minor insult drops it below the line into falls, confusion and immobility."
        caption: "التفسير المقبول (مش في الكتاب) لكلام الكتاب: «حاجة بسيطة» بتوقّع اللي احتياطيه قليل تحت خط الاستقلال. عشان كده الوقعة من دوا جديد indication للـ CGA."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="G07b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker></defs>
