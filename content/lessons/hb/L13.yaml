    steps:
      - kind: explain
        remind: [hb.L13.196]
        page: 244
        quote: "Type 1 AIP is the prototype of IgG4-RD. It is estimated to represent 2 % of cases of chronic pancreatitis. It is characterised by a periductal infiltrate of IgG4 plasma cells that leads to periductal fibrosis. Over time, parenchymal acini also atrophy, there is loss of lobular architecture and evolution to sclerosis. Clinically, there are no specific symptoms compared to other cases of acute, recurrent or chronic pancreatitis, so patients may present with obstructive jaundice, onset diabetes, steatorrhoea, weight loss, etc."
        title: "Autoimmune pancreatitis type 1"
        text: |
          الـ type 1 AIP هو الـ prototype بتاع الـ IgG4-RD، وحوالي 2% من الـ chronic pancreatitis.

          **Pathology** خطوة بخطوة:

          - IgG4 plasma cells حوالين الـ ducts.
          - بعدها **periductal fibrosis**.
          - بعدها الـ acini بتضمر، والـ lobular architecture بتضيع.
          - وفي الآخر **sclerosis**.

          الأعراض: مفيش حاجة specific عن أي pancreatitis تانية. ممكن obstructive jaundice، أو new-onset diabetes، أو steatorrhoea، أو weight loss.

          أشكال الظهور:

          - ==Obstructive jaundice==: من mass في الـ head أو thickening في جدار الـ bile duct (لحد 55%). شبه الـ tumour بالظبط.
          - ==Enlarged pancreas==: في الصور، diffuse أو focal، مع irregular narrowing في الـ pancreatic duct، وأحيانًا في الـ common bile duct (CBD).
          - **Pancreatitis-like**: شبه acute pancreatitis (مرة أو متكررة)، وبيتطور لـ chronic pancreatitis بـ calcifications و exocrine/endocrine insufficiency.

          ووجود fibro-inflammatory حاجة تانية بيساعد في التشخيص. مثلًا low back pain من **retroperitoneal fibrosis**، أو **hydronephrosis**.

          ليه بيعمل obstructive jaundice؟ عشان الـ head بتاع البنكرياس بيكبر أو جدار الـ bile duct بيتخن بالالتهاب، فالقناة اللي معدّية جوه البنكرياس بتتزنق. ويعني كمان إنه شبه الـ tumour جدًا، ومن هنا خطورة إنه يتعمل له عملية مش لازمة.
      - kind: explain
        page: 245
        quote: "Bile duct involvement is the second most frequent common AIP. It can appear in as many as 70 % of patients. Some 60–80 % of patients with type 1 AIP have involvement of the hepatobiliary system (bile ducts and gallbladder)."
        title: "القنوات والمرارة"
        text: |
          ==Bile duct== (IgG4-related sclerosing cholangitis):

          - تاني أشهر مكان مع الـ AIP: لحد 70%.
          - 60–80% من الـ type 1 AIP عندهم hepatobiliary involvement (قنوات ومرارة).
          - أشهر جزء هو الـ **intrapancreatic portion** من الـ bile duct، لأن المرض غالبًا موجود في البنكرياس نفسه.
          - الجدار بيتخن، فالجزء اللي فوقه بيوسع، والنتيجة **obstructive jaundice**.
          - الـ presentation أحد، والأعراض مدتها أقصر.

          **Gallbladder**:

          - Thickening diffuse في الجدار كله (transmural infiltrate).
          - على الـ magnetic resonance imaging (MRI): **hypointense** على T2، وبياخد contrast، والـ enhancement بيفضل لحد الـ late phase.
      - kind: figure
        page: 247
        quote: "B) MRI cholangiography image: dilation of the left and right intrahepatic and extrahepatic bile ducts is observed, with stenosis in the middle third of the bile duct (dashed arrow)."
        title: "الـ IgG4-related sclerosing cholangitis"
        image: { file: hb/L13-igg4-sc-ct-mrcp.webp, book: true }
        alt: "Two images labelled A and B. A is an axial CT of the liver with a yellow arrow on a dilated left intrahepatic bile duct. B is an MRI cholangiography showing dilated intrahepatic and extrahepatic bile ducts with a narrowing in the middle third of the bile duct marked by a dashed arrow."
        caption: |
          - **A**: (CT) الـ left intrahepatic duct واسع، والسهم عليه.
          - **B**: (MRCP) القنوات جوه وبره الكبد واسعة، وفيه ==stenosis== في التلت الأوسطاني من الـ bile duct.
      - kind: explain
        remind: [hb.L13.201]
        page: 246
        quote: "Involvement of the retroperitoneum and mesentery can be in the form of: retroperitoneal fibrosis (most common), periaortitis or sclerosing mesenteritis."
        title: "Retroperitoneum، أوعية، و gastrointestinal (GI)"
        text: |
          **Retroperitoneum and mesentery**:

          - ==Retroperitoneal fibrosis== (الأشهر): نسيج التهابي حوالين الأورطى وفروعه. بيلف على الـ ureters ويعمل **hydronephrosis**، وممكن يبان mass شبه السرطان. كتير من الحالات اللي كانت بتتسمى «primary» بقت تتحسب IgG4-RD، ودي اللي بتستجيب كويس للـ steroids.
          - ==Periaortitis==: جدار الأورطى بيتخن وبيـ enhance. لو اتساب من غير علاج ممكن يعمل **dissection** أو **aneurysm**.
          - **Sclerosing mesenteritis**: mass بتلف على الـ mesenteric vessels وتضيّقها، وممكن تعمل **intestinal obstruction**.

          **gastrointestinal (GI) tract**: نادر.

          - **Stomach**: diffuse infiltration بيروح بالـ steroids، أو polypoid lesions لحد 3 cm، أو ulcer، أو thickening، أو lymph nodes.
          - **Oesophagus**: **esophagitis** بـ dysphagia و weight loss.
          - **Major papilla**.
          - **Colon**: polyps بتقل بالـ steroids، أو nodular lesions في الـ caecum والـ sigmoid.

          ليه الـ retroperitoneal fibrosis بتعمل hydronephrosis؟ عشان النسيج الالتهابي بيلف حوالين الأورطى وفروعه وبيمسك الـ **ureters** في طريقه فبيضغط عليهم. والكويس إن الحالات دي بترد على الـ **steroids**، عكس الـ fibrosis القديمة.
      - kind: figure
        page: 248
        quote: "Retroperitoneal fibrosis. CT scan images. A) Dense soft tissues (within the dotted line) surrounding the retroperitoneal structures, such as both ureters and the common iliac arteries, corresponding to retroperitoneal fibrosis. B) Same patient as in A in whom said fibrosis has caused bilateral proximal hydronephrosis (asterisks)."
        title: "الـ retroperitoneal fibrosis على الـ CT"
        image: { file: hb/L13-igg4-rpf-ct.webp, book: true }
        alt: "Two axial abdominal CT images, A and B. In A a dotted yellow line outlines a dense soft-tissue mass in front of the spine, around both ureters and the common iliac arteries. In B, the same patient, both kidneys have dilated central collecting systems marked with yellow asterisks."
        caption: |
          - **A** (شمال): قدّام العمود الفقري (الأبيض تحت في النص)، الخط الأصفر المنقّط محاوط ==dense soft tissue==. ده النسيج الـ fibro-inflammatory، لافف على الـ **ureters** والـ **common iliac arteries**.
          - **B** (يمين): نفس المريض. الكليتين على الجنبين، وفي نص كل واحدة منطقة غامقة واسعة عليها نجمة صفرا: ده ==bilateral proximal hydronephrosis==.

          يعني الصورة بتورّي السلسلة اللي فوق خطوة بخطوة: النسيج بيلف على الـ ureters، بيضغطهم، فالكليتين بيوسعوا من فوق. ولأن شكله **mass**، سهل يتلخبط مع الـ malignancy.
      - kind: check
        page: 246
        quote: "Involvement of the retroperitoneum and mesentery can be in the form of:\n retroperitoneal fibrosis (most common), periaortitis or sclerosing mesenteritis."
        question: "The commonest retroperitoneal/mesenteric form of IgG4-RD is:"
        options:
          - "Retroperitoneal fibrosis"
          - "Periaortitis"
          - "Sclerosing mesenteritis"
          - "Gastric polyposis"
        answer: 0
        why:
          - "صح: **retroperitoneal fibrosis (most common)**، بتلف حوالين الأورطى والـ ureters وتعمل hydronephrosis."
          - "الـ periaortitis هي الشكل المعتاد للـ **vascular** involvement، ولو اتسابت ممكن تعمل dissection أو aneurysm."
          - "الـ sclerosing mesenteritis موجودة بس أقل."
          - "دي في المعدة، مش الـ retroperitoneum."
      - kind: match
        page: 246
        quote: "Involvement of the retroperitoneum and mesentery can be in the form of: retroperitoneal fibrosis (most common), periaortitis or sclerosing mesenteritis."
        prompt: "وصّل العضو بالصورة المميزة بتاعته:"
        pairs:
          - ["Type 1 AIP", "Painless jaundice, pancreatic head mass, new diabetes"]
          - ["IgG4 sclerosing cholangitis", "Intrapancreatic bile duct wall thickening"]
          - ["Retroperitoneal fibrosis", "Tissue around the aorta encasing the ureters"]
          - ["Periaortitis", "May progress to dissection or aneurysm"]
          - ["Sclerosing mesenteritis", "Mass narrowing mesenteric vessels, bowel obstruction"]
          - ["Gallbladder", "Diffuse wall thickening, hypointense on T2"]
        why: "كل عضو ليه بصمة: البنكرياس شبه cancer الـ head، القناة جوه البنكرياس، الـ retroperitoneum بيخنق الـ ureters، الأورطى ممكن يعمل aneurysm، الـ mesentery بيسد المصران، والمرارة جدارها سميك."
      - kind: explain
        page: 248
        quote: "Diffuse infiltration in the gastric mucosa by IgG4+ plasma cells,\n without the other histological criteria of the dis- ease; related to some\n cases of AIP and that disappears after corticosteroid treatment ."
        title: "المعدة والمريء والقولون"
        text: |
          الـ GI tract نادر، بس الكتاب بيعدّ أشكاله:

          **Stomach**:
          - ==Diffuse infiltration== بالـ IgG4+ plasma cells من غير باقي الـ histological criteria، مع بعض حالات الـ AIP، وبتختفي بعد الـ **corticosteroids**.
          - **Focal polypoid lesions** أو masses لحد 3 cm، ودي بتستوفي كل الـ criteria.
          - **Gastric ulcer**، و **diffuse thickening of the wall**، و local adenopathies.

          **Oesophagus**: IgG4-related esophagitis، الجدار بيتخن فيعمل **dysphagia** و weight loss.

          **Colon**: **colonic polyposis** مع الـ AIP، والـ polyps بتقل جدًا بعد الـ steroids. وفي p249 كمان nodular lesions في الـ caecum والـ sigmoid من غير أعضاء تانية.

          ليه الـ steroids بتمسح الحاجات دي؟ عشان هي **infiltration** التهابية لسه، مش **fibrosis** قديمة. يعني نفس الدرس اللي في العلاج: ابدأ بدري قبل ما الالتهاب يبقى ندبة.
      - kind: figure
        page: 245
        quote: "Gastric IgG4-RD. A and B) CT scan images, coronal and sagittal reconstruction respectively: an increase in gastric size with large, thick folds (arrows) is observed. C) MRI image, coronal enhanced sequence in T2: thickening of gastric folds with marked decrease in the gastric lumen is observed. D) Gastroscopy image: mucosal hypertrophy with prominent vascularisation is observed."
        title: "الـ IgG4-RD في المعدة"
        image: { file: hb/L13-igg4-gastric.webp, book: true }
        alt: "Four panels. A and B, top row: coronal and sagittal CT of an enlarged stomach with large thick folds, yellow arrows on the folds. C, bottom left: coronal T2 MRI with thick gastric folds and a narrow lumen, a yellow arrow on the wall. D, bottom right: gastroscopy view of reddish-orange thickened mucosa with visible vessels."
        caption: |
          الكتاب حاطط الصورة دي في ص 245 جنب كلام القنوات، بس هي بتاعة المعدة. 4 صور لنفس الفكرة: جدار المعدة اتخن.

          - **A** (فوق شمال، CT coronal) و **B** (فوق يمين، CT sagittal): المعدة كبيرة وجدارها عامل ==large, thick folds== زي الصوابع، والأسهم الصفرا عليها.
          - **C** (تحت شمال، MRI T2 coronal): الـ folds سميكة لدرجة إن الـ ==lumen== ضاق جدًا، والسهم على الجدار.
          - **D** (تحت يمين، gastroscopy): الـ mucosa نفسها **hypertrophied** والأوعية الدموية فيها باينة.

          ده شكل الـ **diffuse thickening of the wall** اللي في القايمة فوق. يعني حتى في المعدة الـ IgG4-RD بيعمل نفسه ==tumour==: معدة كبيرة وجدار سميك، والتشخيص في الآخر بالـ biopsy زي أي عضو.
      - kind: reveal
        page: 245
        quote: "The most frequently affected segment is the intrapancreatic portion of\n the bile duct, because most often this entity coexists with AIP, with\n thickening of the bile duct wall due to lymphoplasmocytic infiltration\n occurring along- side inflammation or oedema of the pancreas."
        prompt: "ليه الجزء اللي جوه البنكرياس من الـ bile duct هو أكتر حتة بتتصاب في الـ IgG4 cholangitis؟"
        answer: |
          الكتاب بيدّي السبب: المرض ده **most often coexists with AIP**، فجدار القناة بيتخن بالـ **lymphoplasmacytic infiltration** في نفس الوقت اللي البنكرياس حواليها ملتهب أو وارم.

          النتيجة: القناة بتضيق، واللي فوقها بيوسع (**dilation of the anterograde bile duct**)، فييجي **obstructive jaundice**، وغالبًا بصورة **أكثر حدة** ومدة أعراض أقصر.

          والرقم: الـ bile duct involvement ممكن يوصل لـ **70%**، و **60–80%** من الـ type 1 AIP عندهم hepatobiliary involvement (قنوات ومرارة).
      - kind: try
        items: [hb.L13.196, hb.L13.198, hb.L13.201, hb.L13.203, hb.L13.204]
    recap:
      - "Type 1 AIP = prototype، 2% من الـ chronic pancreatitis، jaundice + mass أو بنكرياس كبير أو pancreatitis متكررة."
      - "Bile duct لحد 70%، أشهر جزء الـ intrapancreatic. Retroperitoneal fibrosis → hydronephrosis. Periaortitis → aneurysm."
      - "PSC و RA و lymphoma و cancer ممكن يبقى فيهم IgG4 cells؛ في الـ cancer بتبقى patchy."
