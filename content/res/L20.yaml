    - To simply describe a population
    - Descriptive
  - - Aim of the study
    - To quantify the relationship between factors (PICO applicable)
    - Analytic
  - - If intervention analytic
    - Randomized
    - Randomized controlled trial (RCT)
  - - If intervention analytic
    - Non-randomized
    - Quasi-experimental
  - - 'If observational analytic: when were outcomes determined?'
    - Some time after the exposure
    - Prospective cohort
  - - 'If observational analytic: when were outcomes determined?'
    - At the same time as the exposure
    - Cross-sectional
  - - 'If observational analytic: when were outcomes determined?'
    - Before the exposure was determined
    - Case-control
  blanks:
  - - 0
    - 2
  - - 1
