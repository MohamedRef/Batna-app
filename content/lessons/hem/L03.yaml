  - id: hem.L03.lesson7
    title: "الـ PNH: الكرة اللي فقدت درعها"
    hook: "طفرة واحدة في جين على الـ X بتشيل الدرع اللي بيحمي الكرة من الـ complement. والنتيجة: haemolysis و pancytopenia وجلطات في أماكن غريبة."
    minutes: 9
    pages: [50, 53]
    topics: [pnh]
    goals:
      - "تشرح الـ PIGA والـ GPI anchor وليه الـ complement بيكسّر الكرة"
      - "تربط نقص الـ NO بالأعراض، وتعرف أماكن الجلطات"
      - "تعرف مين تعمله screening والتحاليل (CD59، CD55) وليه الحديد قليل"
    status: unverified
    steps:
      - kind: explain
        page: 50
        title: "الـ triad والسبب"
        quote: "The triad of hemolytic anemia, pancytopenia, and thrombosis makes PNH a unique clinical syndrome."
        text: |
          الـ ==paroxysmal nocturnal haemoglobinuria (PNH)== مرض نادر ومزمن، بيبدأ غالبًا في **أول الشباب**، وحوالي **50%** بيموتوا من **الجلطات**.

          الـ triad: ==haemolytic anaemia + pancytopenia + thrombosis==.

          السبب: طفرة في جين **Phosphatidylinositol glycan class A gene (PIGA)** على الـ **X chromosome**، فالخلية مش قادرة تعمل الـ **glycosylphosphatidylinositol (GPI) anchor** اللي بيثبّت بروتينات معينة على الغشا. ومن البروتينات دي اللي بيحموا الكرة من الـ complement: **Decay-accelerating factor (CD55)** و **membrane inhibitor of reactive lysis (CD59)**.
      - kind: aside
        tone: analogy
        page: 50
        quote: "The common denominator in the disease appears to be a genetic mutation leading to the inability to synthesize the glycosyl-phosphatidylinositol (GPI) anchor that binds these proteins to cell membranes."
        text: "الـ GPI anchor زي **مسمار التعليق**. الـ CD55 والـ CD59 هما **الدروع** المعلقة عليه. من غير مسمار، الدروع بتقع، والـ **complement** (اللي شغال طول الوقت بشويش) بيخرم الكرة."
      - kind: figure
        page: 50
        quote: "The common denominator in the disease appears to be a genetic mutation leading to the inability to synthesize the glycosyl-phosphatidylinositol (GPI) anchor that binds these proteins to cell membranes."
        title: "الدرع والمسمار"
        alt: "Two red cell membranes. Normal: GPI anchors hold CD55 and CD59 on the surface, and complement attacks are blocked. PNH: PIGA mutation, no GPI anchor, CD55 and CD59 are missing, complement forms a membrane attack complex pore and the cell bursts, releasing haemoglobin."
        caption: "من غير الـ ==GPI anchor== الـ CD55 والـ CD59 ما بيتثبتوش، فالـ complement بيعمل خرم في الكرة (**MAC**)، والـ Hb يطلع في الدم."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="8" width="155" height="185" rx="10" class="fg-good"/>
            <text x="82" y="30" text-anchor="middle" class="t-b">Normal</text>
