  - id: neph.L07.170
    kind: card
    topic: alport
    front: What special risk follows kidney transplantation in Alport syndrome? Does it forbid transplant?
    back: In under 5%, de novo anti-GBM antibodies against the donor α5(IV) chain cause RPGN. It is not a contraindication to transplantation.
    src: { page: 185, quote: "In <5%, transplanted Alport patients may develop de novo anti-GBM anti-bodies that cause an RPGN" }
    status: unverified
    tags: [high-yield]
