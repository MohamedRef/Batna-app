            question: "And this one?"
            options: ["Type 1, hyperplastic", "Type 2, adenoma", "Type 3, deep submucosal cancer", "Inflammatory polyp"]
            answer: 0
            why: "Same or lighter colour, no or isolated vessels, uniform spots: type 1, most likely hyperplastic."
      - kind: try
        items: [git.L05.042, git.L05.043, git.L05.045, git.L05.047, git.L05.088]
    recap:
      - "NICE = NBI International Colorectal Endoscopic؛ بيعتمد على color و vessels و surface، بـ zoom أو من غيره."
