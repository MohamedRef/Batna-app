          </svg>
      - kind: mnemonic
        page: 10
        quote: "a- Classical symptoms of hyperglycemia + any one of three positive tests:\n  1- Random plasma glucose: > 200 mg/dl. Or 2- Fasting plasma glucose: > 126 mg/dl. Or 3- 2h-PPPG: > 200 mg/dl"
        word: "126"
        parts:
          - { key: "1", text: "100 أول الـ IFG (صايم)" }
          - { key: "2", text: "200 للـ random وللـ 2-h (diabetes)" }
          - { key: "6", text: "6.5% للـ A1C (diabetes)، و 126 للـ fasting" }
        hook: "رقم **126** نفسه فيه كل حاجة: **1**00 بداية الخطر، **2**00 للـ random والـ 2-h، **6**.5 للـ A1C. والـ 140 = نص الطريق بين 100 و 200 تقريبًا، سهل تفتكره."
      - kind: explain
        page: 10
        title: "test واحد ولا اتنين؟"
        quote: "In the absence of unequivocal hyperglycemia, diagnosis requires two abnormal test results obtained at the same time or at two different time points. This may be either to repeat the initial test or a different test, which should be performed promptly."
        text: |
          - **Classical symptoms + test واحد positive** = diabetes.
          - **من غير unequivocal hyperglycemia:** لازم ==two abnormal results==، من نفس العينة أو في وقتين مختلفين، بنفس الـ test أو test تاني، ويتعمل **promptly**.

          ليه من غير أعراض لازم اتنين؟ لأن الجلوكوز بيتأثر بحاجات كتير (stress، مرض، عينة اتأخرت) زي ما شفنا في ص 9، فرقم واحد ممكن يطلع غلط. والتشخيص ده لعمر كامل، فلازم نتأكد قبل ما نلزّق للعيان اسم مرض مزمن.
