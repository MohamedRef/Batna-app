  # ---------- p382-385: transplant fertility, graft and pregnancy risks ----------
  - id: neph.L11.161
    kind: card
    topic: tx-risk
    front: How does a successful kidney transplant restore fertility?
    back: The hypothalamic-pituitary-ovarian dysfunction remits; LH, FSH and prolactin fall and estrogen rises by the end of the first year, with return of menses and ovulation.
    src: { page: 382, quote: "A successful renal transplant restores ovulation due to remission of hypothalamus- pituitary-ovarian axis dysfunction" }
