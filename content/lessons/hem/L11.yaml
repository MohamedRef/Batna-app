  - id: hem.L11.lesson8
    title: "علاج الـ myeloma: VRd ولا KRd، وكل دوا بيضرب فين"
    hook: "الـ fitness والـ cytogenetics بيختاروا الروشتة، والـ myeloma بيتخنق من البروتين اللي بيعمله."
    minutes: 9
    pages: [185, 186]
    topics: [treatment, supportive]
    goals:
      - "تختار الـ regimen حسب الـ risk والـ fitness"
      - "تعرف مجموعات الأدوية والـ targets"
      - "تعرف دور الـ radiotherapy والـ plasmapheresis والـ supportive في جدول العلاج"
    status: unverified
    steps:
      - kind: explain
        page: 185
        quote: "In standard-risk and intermediate-risk patients eligible for ASCT, VRd as initial therapy for 3–4 cycles, followed by ASCT and lenalidomide maintenance therapy. In high-risk patients, KRd as initial therapy for 3–4 cycles followed by ASCT and then maintenance with a proteasome inhibitor based regimen."
        title: "مين ياخد إيه؟"
        text: |
          - **Fit للـ ASCT، standard أو intermediate risk**: ==VRd== **3–4 cycles** ← **ASCT** ← **lenalidomide maintenance**.
          - **Fit، high risk**: **KRd** 3–4 cycles ← ASCT ← maintenance بـ **proteasome inhibitor**.
          - **Unfit**: reduced-dose **MPT** أو **VMP**، أو two-drug: **Vd** أو **Rd**.

          التفسير المقبول (مش في الكتاب) للمنطق: الـ **ASCT** معناها جرعة chemo عالية جدًا تمسح النخاع، وبعدين ترجّع للمريض stem cells بتاعته اللي اتجمعت قبلها. فده محتاج مريض **fit** يستحمل. والـ **K** (carfilzomib) proteasome inhibitor أقوى من الـ V، فبنحطه للـ clone الأشرس. والـ maintenance عشان الـ myeloma نادرًا ما بيتمسح كله، فبنفضل نكتمه.
