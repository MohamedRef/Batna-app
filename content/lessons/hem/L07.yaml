            <path d="M120 197 L120 222" class="fg-arrow" marker-end="url(#L07d)"/>
            <text x="165" y="238" text-anchor="middle" class="t-sm t-b">Under 60: prevent recurrence</text>
            <rect x="5" y="250" width="100" height="70" rx="10" class="fg-box"/>
