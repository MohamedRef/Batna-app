      - kind: explain
        page: 225
        title: "Primary ولا secondary؟"
        quote: "What is your diagnosis? Minimal change disease Types of minimal change disease"
        text: |
          التشخيص: ==minimal change disease (MCD)==. والكتاب بيقسمه نوعين: **primary (idiopathic)** و ==secondary==.

          ليه نفرّق؟ التفسير المقبول (مش في الكتاب): الـ primary بنعالجه بالـ **steroids** مباشرة. الـ secondary فيه سبب برّه الكلية (دوا، ورم، عدوى، allergy)، ولو ما شلتش السبب العيان ممكن يرجع حتى لو رد على العلاج. يعني قبل ما تكتب «idiopathic» لازم تسأل: بياخد أدوية إيه؟ فيه lymph nodes أو weight loss؟ عنده allergy أو عدوى قريبة؟

          وفي عيانتنا: ANA و virology سلبي، ومفيش دوا متسجّل غير إنها لسه والدة. علشان كده الـ DD بيروح للـ primary، بس الأسئلة دي لازم تتسأل.

          ليه السؤال ده بييجي قبل العلاج؟ التفسير المقبول (مش في الكتاب): الـ secondary MCD بيروح لما السبب يروح (توقف الـ NSAID، تعالج الـ lymphoma)، والـ steroids مش هي الحل. والـ primary هو اللي بيرد على الـ steroids. فلو ما سألتش، ممكن تدّي steroids لعيان عنده Hodgkin lymphoma من غير ما تعرف، والمرض الأصلي يستخبى. عشان كده عند أي MCD في كبير، اسأل عن الأدوية، والـ lymph nodes، والـ allergy.

          وإيه اللي في الـ case بتاعتنا؟ التفسير المقبول (مش في الكتاب): ست شابة بعد ولادة، مفيش أدوية مذكورة ولا lymph nodes ولا allergy، فالأقرب **primary**. والـ primary MCD في الكبار بياخد وقت أطول شوية من الأطفال عشان يرد على الـ steroids، فما تحكمش إنه steroid-resistant بدري.
      - kind: mnemonic
        page: 226
        quote: "Categorization of secondary MCD Neoplasia (19) Drugs (24) Infections (7) Atopy (6) Superimposed on another renal disease (5) Miscellaneous (15) The number in parentheses indicates the number of specific diseases or clinico-pathologic entities reported to be associated with MCD. Can you pick out The Pathological findings?"
        word: "DNAIS"
        parts:
