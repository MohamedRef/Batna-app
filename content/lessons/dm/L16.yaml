          الكتاب بيعدّ الـ negatives، والتفسير المقبول (مش في الكتاب) لكل واحدة:
          - ==مفيش تنميل== ولا زغللة ولا صعوبة بلع: يبعدنا عن الأعصاب والـ neuromuscular junction (Guillain-Barré، botulism، myasthenia).
          - ==مفيش وجبة تقيلة== ولا trauma ولا alcohol ولا جوع: دي حاجات معروفة بتفجّر شلل الـ hypokalaemia من غير سكر.
          - مش واخدة أدوية: يعني الـ K ما نزلش من diuretic مثلًا.
