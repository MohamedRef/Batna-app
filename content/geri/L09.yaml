items:
  # ---------- p155-156: overview ----------
  - id: geri.L09.001
    kind: card
    topic: overview
    front: Why are elderly people more susceptible to infections and cancer?
    back: Ageing brings a decline in immune function, so the immune system responds less well to antigenic stimulation.
    src: { page: 155, quote: "This situation implies increased susceptibility to infections and cancer due to decreased capacity in the immune system to respond to antigenic stimulation." }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.002
    kind: table
    topic: overview
    title: Immunosenescence at a glance, the decline in immune function (book figure)
    columns: [Compartment, Changes with age]
    rows:
      - [Thymic involution, "↓ thymic output, ↑ adiposity in thymus, ↓ thymic epithelial cells, ↓ IL-7"]
      - [T lymphocytes, "↓ naive T cells, ↑ memory T cells, ↓ TCR diversity, ↑ CD8 ↓ CD4"]
      - [B lymphocytes, "↓ naive B cells, ↑ memory B cells, ↓ IgM and IgD, ↑ IgG and IgA"]
      - [Inflamm-aging, "↑ inflammatory mediators, ↑ IL-6 and CRP, ↑ tissue dysfunction"]
      - [Overall, "↓ telomerase, ↑ tumours, ↑ infection, ↑ autoimmune and inflammatory reactions, ↓ vaccine response"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 155, quote: "Aging is associated with a decline in immune function." }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.003
    kind: cloze
    topic: overview
    text: "As immune function declines with age, serum {{c1::IgM and IgD}} fall while {{c2::IgG and IgA}} rise; the CD4 count falls and CD8 rises."
    src: { page: 155, quote: "Aging is associated with a decline in immune function." }
    status: unverified
  - id: geri.L09.004
    kind: enumerate
    topic: overview
    prompt: Name the four hallmarks of immunosenescence drawn in the lecture (Medscape figure).
    points:
      - Changes in lymphocyte subpopulations (↓ naive, ↑ memory)
      - Inflammaging (↑ IL-6, TNF-α, CRP; ↓ IL-10)
      - Accumulation of senescent T cells (CD28 lost; KLRG1, CD57)
      - Telomere shortening and resistance to apoptosis
    pass: 3
    src: { page: 156, quote: "Immunosenescence" }
    status: unverified
  - id: geri.L09.005
    kind: card
    topic: overview
    front: Which factors accelerate immunosenescence, per the lecture's figure?
    back: CMV infection, obesity and stress.
    src: { page: 156, quote: "Immunosenescence" }
    status: unverified
  - id: geri.L09.006
    kind: enumerate
    topic: overview
    prompt: What are the clinical results of immunosenescence?
    points:
      - More autoimmune diseases, cardiovascular diseases and cancer
      - More severe infections
      - Poorer response to vaccines
      - Chronic inflammatory diseases and frailty
    pass: 3
    src: { page: 156, quote: "Immunosenescence" }
    status: unverified
  # ---------- p156: replicative senescence ----------
  - id: geri.L09.007
    kind: card
    topic: replicative
    front: Define replicative senescence.
    back: Age-related shortening of telomere length with impaired cell division; clonal expansion falls, as T cells cannot replicate as avidly after binding antigen.
    src: { page: 156, quote: "Replicative senescence is the age-related shortening of telomere length and impairment of cell division." }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.008
    kind: card
    topic: replicative
    front: Why do old people fight old infections but not new ones?
    back: Naive cells fall and memory cells rise, so defence against previously recognized pathogens is intact but response to novel antigens is reduced.
    src: { page: 156, quote: "The decrease in naive cells and the increase in memory cells" }
    status: unverified
    tags: [high-yield]
  - id: geri.L09.009
    kind: enumerate
    topic: replicative
    prompt: List the components of the immune risk phenotype (immunosenescence figure).
    points:
      - CD8+ CD28− CD57+ cells
      - CD4:CD8 ratio below 1
      - CMV seropositivity
      - Poor T-cell proliferation
    pass: 3
    src: { page: 156, quote: "Immunosenescence" }
    status: unverified
  - id: geri.L09.010
    kind: cloze
    topic: replicative
    text: "In the immunosenescence figure, the immune risk phenotype includes a CD4:CD8 ratio {{c1::below 1}} and {{c2::CMV}} seropositivity."
    src: { page: 156, quote: "Immunosenescence" }
    status: unverified
  - id: geri.L09.011
    kind: card
    topic: replicative
    front: Which other systems does ageing affect alongside immunosenescence (two-way)?
    back: Endocrine and neural function, cardiovascular health, muscle homeostasis, glucose metabolism and oxidative stress.
    src: { page: 156, quote: "Immunosenescence" }
    status: unverified
  # ---------- p157-158: innate ----------
  - id: geri.L09.012
    kind: table
    topic: innate
    title: Innate immunity with age
    columns: [Cell, Change]
    rows:
      - [Monocytes and macrophages, "Reduced phagocytic capacity; enhanced oxidative stress"]
      - [Neutrophils, "Reduced phagocytic activity; impaired free radical production"]
      - [Dendritic cells, "Reduced antigen presentation; impaired clearing of apoptotic cells"]
      - [NK cells, "Increased number; reduced cytotoxicity"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
