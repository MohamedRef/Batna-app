  - id: hem.L12.lesson2
    title: "شخّص وادّي stage"
    hook: "الـ biopsy بيقولك إيه هو، والـ Ann Arbor بيقولك وصل لفين. والـ B؟ دي اللي بتقلب الخطة."
    minutes: 8
    pages: [192, 193]
    topics: [workup, staging]
    goals:
      - "تعرف الـ B-cell markers"
      - "تعرف الـ staging investigations"
      - "تعمل Ann Arbor مع A/B، وتعرف الـ IPI"
    status: unverified
    steps:
      - kind: explain
        page: 192
        quote: "The CD 20 is one such molecule exclusively expressed on B-cells. Besides, CD 19, CD 22 and CD 79 are other examples"
        title: "Immunophenotyping"
        text: |
          بنلزق **labelled antibodies** على الخلايا ونقراها بالـ **flow cytometry**. الأسامي بنظام الـ **CD (Cluster Differentiation)**.

          - ==CD20==: على الـ B-cells **بس**.
          - كمان **CD19, CD22, CD79**: B-cell markers.
      - kind: explain
        page: 192
        quote: "The diagnosis is based on the histological appearance of an enlarged lymph node or other affected tissues"
        title: "التشخيص"
        text: |
          الأساس ==histology== لغدة كبيرة أو نسيج متأثر، أو cytology من الدم أو النخاع أو الـ CSF.

          وبعدين بندعمه بالـ immunophenotyping والـ cytogenetics والـ molecular techniques.
      - kind: explain
        page: 192
        quote: "Bone marrow biopsy is important in non-Hodgkin‘s Lymphoma due to the high frequency of bone marrow involvement in this disorder."
        title: "الـ staging work-up"
        text: |
          1. **CT، ultrasound، chest X-ray**.
          2. ==Bone marrow biopsy==: مهم في الـ NHL لأن النخاع بيتصاب كتير.
          3. **LDH**: عالي = poor prognosis.
          4. **Immunoglobulins** و monoclonal proteins.
      - kind: figure
        page: 193
        quote: "Stage IV: Involvement of extralymphatic sites e.g. bone marrow or liver."
        title: "Ann Arbor على الجسم"
        alt: "Four small body outlines with a dashed horizontal line for the diaphragm. Stage I: one node group in the neck. Stage II: neck and mediastinal nodes, both above the diaphragm. Stage III: nodes above and below the diaphragm. Stage IV: liver and bone marrow involved."
        caption: "الحجاب الحاجز هو الخط الفاصل: جانب واحد = II، الجانبين = III، عضو برّه الغدد = IV."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="20" width="75" height="190" rx="30" class="fg-box"/>
            <rect x="88" y="20" width="75" height="190" rx="30" class="fg-box"/>
            <rect x="171" y="20" width="75" height="190" rx="30" class="fg-box"/>
            <rect x="254" y="20" width="71" height="190" rx="30" class="fg-box"/>
            <path d="M5 110H325" class="fg-thin"/>
            <circle cx="42" cy="45" r="7" class="fg-dot-bad"/>
            <circle cx="125" cy="45" r="7" class="fg-dot-bad"/>
            <circle cx="125" cy="80" r="7" class="fg-dot-bad"/>
            <circle cx="208" cy="45" r="7" class="fg-dot-bad"/>
            <circle cx="208" cy="150" r="7" class="fg-dot-bad"/>
            <circle cx="290" cy="45" r="7" class="fg-dot-bad"/>
            <circle cx="290" cy="150" r="7" class="fg-dot-bad"/>
            <rect x="265" y="118" width="30" height="16" rx="6" class="fg-bad"/>
            <text x="263" y="185" class="t-sm t-bad">liver, BM</text>
            <text x="30" y="232" class="t-b">I</text>
            <text x="115" y="232" class="t-b">II</text>
            <text x="195" y="232" class="t-b">III</text>
            <text x="280" y="232" class="t-b">IV</text>
          </svg>
      - kind: explain
        page: 193
        quote: "stage (B) in the presence of any one of; night sweats, fever or weight loss (10% in past 6 months)."
        title: "A ولا B؟"
        text: |
          - **A**: مفيش systemic symptoms.
          - ==B==: واحدة بس تكفي من: **night sweats**، **fever**، أو **weight loss 10% في آخر 6 شهور**.
      - kind: aside
        tone: trap
        page: 193
        quote: "stage (B) in the presence of any one of; night sweats, fever or weight loss (10% in past 6 months)."
        text: "الـ pruritus والـ fatigue أعراض موجودة في الـ Hodgkin، بس مش B symptoms. الـ B تلاتة بس: سخونية، عرق بالليل، ووزن 10% في 6 شهور."
      - kind: check
        page: 193
        quote: "Stage III: Involvement of lymph node groups on both sides of the diaphragm."
        question: "Axillary and inguinal nodes, no symptoms. Stage?"
        options: ["IIIA", "IIA", "IIIB", "IA"]
        answer: 0
        why:
          - "صح: الإبط فوق الحجاب والـ inguinal تحته = III، ومفيش أعراض = A."
          - "الـ II لازم الاتنين على جانب واحد."
          - "مفيش أعراض، يبقى A."
          - "دول مجموعتين مش واحدة."
      - kind: explain
        page: 193
        quote: "Extranodal disease: Disease outside lymphatic sites confers a poor prognosis."
        title: "International Prognostic Index"
        text: |
          الكتاب بيعد أربع حاجات بتخلّي الـ prognosis أوحش:

          - ==Extranodal disease==
          - **Advanced stage**
          - **Elevated LDH**
          - **Increasing age**
      - kind: update
        page: 193
        quote: "Extranodal disease: Disease outside lymphatic sites confers a poor prognosis."
        text: "الـ IPI الأصلي خمس نقط: age > 60، ECOG performance status ≥ 2، stage III-IV، LDH عالي، و > 1 extranodal site. الكتاب ذكر أربعة من غير الـ performance status."
        ref: "International Non-Hodgkin's Lymphoma Prognostic Factors Project, NEJM 1993"
      - kind: try
        items: [hem.L12.012, hem.L12.014, hem.L12.017, hem.L12.019, hem.L12.020]
    recap:
      - "CD20 على الـ B cells بس؛ CD19/22/79 كمان."
      - "التشخيص histology + immunophenotyping + cytogenetics."
      - "Staging: CT/US/CXR، marrow (مهم في NHL)، LDH، immunoglobulins."
      - "Ann Arbor: I غدة، II جانب واحد، III الجانبين، IV extralymphatic."
      - "B = fever، night sweats، weight loss 10%/6 شهور."
    practice: [hem.L12.011, hem.L12.012, hem.L12.013, hem.L12.014, hem.L12.015, hem.L12.016, hem.L12.017, hem.L12.018, hem.L12.019, hem.L12.020, hem.L12.081, hem.L12.082, hem.L12.094]
