  - id: endo.L07.lesson3
    title: "الـ thyroid storm: الغدة ولّعت"
    hook: "حرارة، قلب بيجري أسرع من الحرارة، ومريضة مش قادرة تقعد. والأسبرين هنا ممنوع."
    minutes: 10
    pages: [115, 118]
    topics: [storm]
    goals:
      - "تعرف الـ precipitants والصورة"
      - "ترتّب العلاج بالتلات مبادئ وبالجرعات"
      - "تعرف ليه الـ salicylates ممنوعة"
    status: unverified
    steps:
      - kind: explain
        page: 115
        quote: "Thyroid Storm\nPrecipitating Events\n• Surgery.\n• Sepsis.\n• Burns."
        title: "الـ storm مش thyrotoxicosis عادي"
        text: |
          الـ ==thyroid storm== هو thyrotoxicosis وصل لدرجة بتهدد الحياة. الكتاب بيبدأ بالـ **precipitating events**، وأولهم: **surgery**، **sepsis**، و **burns**.

          ليه الكتاب بيبدأ بالـ precipitants؟ لأن المريض غالبًا عنده hyperthyroidism مش متعالج أو متعالج نص نص، وبعدين ييجي stress حاد يقلب الدنيا. التفسير المقبول (مش في الكتاب): الـ stress بيزوّد الـ catecholamines واحتياج الجسم للأكسجين، والجسم المحمّل بالهرمون أصلًا مش قادر يستحمل الزيادة دي. يعني لو لقيت مريض Graves' عمل عملية أو جاله sepsis وبقى حرارته عالية وقلبه بيجري، متقولش ده بس sepsis.
      - kind: explain
        remind: [endo.L07.027]
        page: 116
        quote: "Diabetic ketoacidosis.\nCardiovascular accident.\nParturition.\nStatus epilepticus.\nI131 treatment.\nIodinated contrast dyes."
        title: "إيه اللي بيولّعها؟"
        text: |
          ==Precipitants==: surgery، sepsis، burns، **diabetic ketoacidosis (DKA)**، cardiovascular accident، **parturition**، status epilepticus، **I-131**، و iodinated contrast.

          **Thyroxine overdose لا يعمل thyroid storm**. السبب مش واضح، بس فيه:

          - Acute discharge لـ T4 و T3 من الغدة.
          - Inhibition لارتباطهم بالـ binding globulin.

          التفسير المقبول (مش في الكتاب): الـ precipitants كلها يا stress حاد (surgery، sepsis، DKA، الولادة، status epilepticus) بيزوّد الـ catecholamines واحتياج الجسم، يا حاجة بتطلّع الهرمون المتخزّن من الغدة فجأة: الـ I-131 بيكسّر الـ follicles، والـ contrast فيه iodine كتير. يعني الـ storm محتاج غدة مليانة هرمون + حاجة تفجّرها، وده بيفسّر ليه الـ overdose لوحده مش كفاية.
      - kind: explain
        remind: [endo.L07.029]
        page: 116
        quote: "Clinical Features\n  The clinical features are usually those of thyrotoxicosis but are more severe, and include:\n    Fever (38.5°C).\n    Tachycardia out of proportion to the fever.\n    Confusion.\n    Agitation.\n    Nausea and vomiting.\n    Hypertension.\n    Congestive cardiac failure."
        title: "الصورة"
        text: |
          Thyrotoxicosis بس أشد:

          - **Fever** 38.5°C.
          - ==Tachycardia out of proportion to the fever==.
          - Confusion، agitation.
          - Nausea و vomiting.
          - Hypertension، **congestive cardiac failure**.

          التحاليل: thyroid-stimulating hormone (TSH) واطي، T3 و T4 عاليين، ومعاهم alanine aminotransferase (ALT) و alkaline phosphatase (ALP) و bilirubin عاليين.

          التفسير المقبول (مش في الكتاب): الـ tachycardia أكبر من الحرارة لأن الهرمون نفسه بيزوّد حساسية القلب للـ catecholamines، مش الحرارة بس. والكبد بيتأثر لأن الـ metabolic rate العالي والـ heart failure بيقللوا الدم والأكسجين الواصلين له، فالـ ALT والـ bilirubin يعلوا. الأرقام دي مش هتفرق في التشخيص، لكن العلاج ميستناش التحاليل.
      - kind: check
        page: 116
        quote: "Pathogenesis\n  Thyroxine overdose does not cause thyroid storm.\n  The pathogenesis remains unclear.\n  The following factors are implied:\n    Acute discharge of T4 and T3 from the thyroid gland and\n    Inhibition of T4/T3 to binding globulin."
        question: "Which of these does NOT cause thyroid storm, per the lecture?"
        options: ["Thyroxine overdose", "Parturition", "Iodinated contrast", "Diabetic ketoacidosis"]
        answer: 0
        why:
          - "صح: الكتاب بيقولها صريحة."
          - "الولادة precipitant."
          - "الـ contrast precipitant."
          - "الـ DKA precipitant."
      - kind: reveal
        page: 117
        quote: "The treatment principles are to:\n– Decrease the production and release of thyroid hormones,\n– Block the effects of circulating t4 and t3.\n– Deal with the underlying precipitants."
        prompt: "ليه العلاج تلات مبادئ؟ مش كفاية نقفل إنتاج الهرمون؟"
        answer: "الكتاب بيقول: ==decrease production and release==، ==block the effects== of circulating T4 و T3، و ==deal with the precipitants==. التفسير المقبول (مش في الكتاب): قفل الإنتاج لوحده مش هيوطّي الهرمون اللي في الدم بسرعة، لأن الـ T4 بيقعد في الدم حوالي أسبوع والغدة مليانة هرمون متخزّن. فلازم نقفل التأثير على القلب والأنسجة (propranolol، steroids) لحد ما المستوى ينزل، ولو الـ precipitant (زي الـ sepsis) فضل شغال هيفضل يولّع الـ storm من تاني."
      - kind: figure
        page: 117
        quote: "The treatment principles are to:\n  Decrease the production and release of thyroid hormones,\n  Block the effects of circulating t4 and t3.\n  Deal with the underlying precipitants.\n  To block the thyroid hormone synthesis:\n  Intravenous methimazole 20 mg every 4–6 hours until the patient is able to take oral carbimazole 30 mg twice daily, or\n  Propylthiouracil 200 mg every 4 hours (orally or via nasogastric tube) as it will also block T4 to T3 conversion."
        title: "اقفل المصنع، اقفل التحويل، اقفل التأثير"
        alt: "A pipeline from thyroid gland to tissues. Block 1 at the gland: methimazole or PTU stop synthesis. Block 2 at release and conversion: Lugol's iodine (lithium if allergic), steroids and PTU stop T4 to T3. Block 3 at the tissues: propranolol. Below: treat the precipitant, fluids, cooling, paracetamol, no aspirin."
        caption: "الـ propylthiouracil (PTU) بيقفل خطوتين: الـ synthesis والـ T4 → T3."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="70" rx="8" class="fg-bad"/>
            <text x="20" y="32" class="t-b">1. Gland: synthesis</text>
            <text x="20" y="52" class="t-sm">methimazole 20 mg IV 4-6 h</text>
            <text x="20" y="70" class="t-sm">or PTU 200 mg 4-hourly</text>
            <rect x="10" y="90" width="310" height="90" rx="8" class="fg-acc"/>
            <text x="20" y="112" class="t-b">2. Release and T4 to T3</text>
            <text x="20" y="132" class="t-sm">Lugol's 0.3 ml in 50 ml 8-hourly, 5 days</text>
            <text x="20" y="150" class="t-sm">iodine allergy: lithium 300 mg 6-hourly</text>
            <text x="20" y="168" class="t-sm">dexamethasone 4 mg or HC 100 mg qds</text>
            <rect x="10" y="190" width="310" height="52" rx="8" class="fg-good"/>
            <text x="20" y="212" class="t-b">3. Tissues: propranolol</text>
            <text x="20" y="230" class="t-sm">80 mg tds or 1 mg/min IV to HR 100</text>
            <rect x="10" y="250" width="310" height="42" rx="8" class="fg-thin"/>
            <text x="20" y="268" class="t-sm">fluids, cooling, paracetamol</text>
            <text x="20" y="284" class="t-sm t-bad t-b">no salicylates; treat precipitant</text>
          </svg>
      - kind: table
        page: 117
        quote: "Both drugs can also be given per rectum.\n  To block the conversion of T4 to T3:\n  Lugol's iodine: 0.3 ml diluted to 50 ml every 8 hours given orally or via nasogastric tube for 5 days.\n  Sodium iodide was used previously intravenously, but sterile forms are no longer available.\n  If patients are allergic to iodine, use instead lithium carbonate 300 mg every 6 hours, with twice daily lithium levels checked until a therapeutic dose of 1 mmol/l is attained.\n  Intravenous steroids: dexamethasone 4 mg four times daily or hydrocortisone 100 mg four times daily."
        title: "الجرعات"
        columns: ["Drug", "Dose"]
        rows:
          - ["Methimazole", "20 mg IV 4-6-hourly"]
          - ["Carbimazole", "30 mg twice daily (oral)"]
          - ["PTU", "200 mg 4-hourly"]
          - ["Lugol's", "0.3 ml in 50 ml 8-hourly x5 d"]
          - ["Lithium", "300 mg 6-hourly, level 1 mmol/l"]
          - ["Propranolol", "80 mg tds or 1 mg/min IV"]
        hide: [[0, 1], [2, 1], [3, 1], [5, 1]]
      - kind: update
        page: 117
        quote: "Both drugs can also be given per rectum.\n  To block the conversion of T4 to T3:\n  Lugol's iodine: 0.3 ml diluted to 50 ml every 8 hours given orally or via nasogastric tube for 5 days.\n  Sodium iodide was used previously intravenously, but sterile forms are no longer available.\n  If patients are allergic to iodine, use instead lithium carbonate 300 mg every 6 hours, with twice daily lithium levels checked until a therapeutic dose of 1 mmol/l is attained.\n  Intravenous steroids: dexamethasone 4 mg four times daily or hydrocortisone 100 mg four times daily."
        text: "الكتاب حط الـ Lugol's جنب الـ thionamide من غير ترتيب، بس الـ American Thyroid Association (ATA) 2016 بتقول: الـ ==iodine== (Lugol's أو potassium iodide) يتدّى **بعد ساعة على الأقل** من أول جرعة methimazole أو PTU. لو اتدّى قبلها، الغدة بتستخدمه **مادة خام** لهرمون جديد فالـ storm يزيد. في الامتحان اكتب أدوية وجرعات الكتاب، ورتّبهم: thionamide الأول."
        ref: "Ross et al., American Thyroid Association guidelines for hyperthyroidism and other causes of thyrotoxicosis, Thyroid 2016"
      - kind: aside
        tone: tip
        page: 117
        quote: "Both drugs can also be given per rectum.\n  To block the conversion of T4 to T3:\n  Lugol's iodine: 0.3 ml diluted to 50 ml every 8 hours given orally or via nasogastric tube for 5 days.\n  Sodium iodide was used previously intravenously, but sterile forms are no longer available.\n  If patients are allergic to iodine, use instead lithium carbonate 300 mg every 6 hours, with twice daily lithium levels checked until a therapeutic dose of 1 mmol/l is attained.\n  Intravenous steroids: dexamethasone 4 mg four times daily or hydrocortisone 100 mg four times daily."
        text: "المريض بيرجّع ومفيش intravenous (IV)؟ الكتاب بيقول الاتنين، methimazole و PTU، ممكن **per rectum**، والـ PTU والـ Lugol's ممكن بالـ nasogastric (NG) tube."
      - kind: explain
        page: 117
        quote: "If there are no contraindications to β-blockers, then the choice is propranolol 80 mg three times daily (orally or via nasogastric tube), or 1 mg/min intravenously until the pulse rate is 100 beats/min."
        title: "الـ β-blocker: ليه وإزاي"
        text: |
          لو مفيش contraindication، الاختيار ==propranolol==: **80 mg tds** بالبق أو الـ nasogastric tube، أو **1 mg/min IV** لحد ما النبض يوصل **100**. لو الـ β-blocker ممنوع (زي الـ asthma)، البديل **calcium channel blockers** أو **digoxin** (ص 118).

          ليه الهدف 100 مش 60؟ التفسير المقبول (مش في الكتاب): القلب في الـ storm محتاج يجري شوية علشان يعوّض الحرارة والـ vasodilatation؛ الهدف إنك تبطّل الـ tachycardia الخطيرة اللي بتعمل heart failure، مش إنك تعمل bradycardia. وليه propranolol بالذات؟ لأنه بيقفل تأثير الهرمون على القلب والأعصاب (الرعشة والقلق)، وبجرعات عالية بيقلل شوية تحويل T4 لـ T3.
      - kind: case
        page: 118
        quote: "If β-blockers are contraindicated, the possible alternatives would include calcium channel blockers or digoxin.\nSupportive treatment may include:\n  Vigorous fluid resuscitation if appropriate.\n  External cooling.\n  Paracetamol for pyrexia.\n  Salicylates should be avoided as they inhibit thyroid hormone binding and can worsen the thyroid storm.\n  Patients should ideally be managed in a medical high- dependency unit and intensive care unit should be considered."
        stem: "A 40-year-old man with Graves' and asthma develops storm after pneumonia. Pulse 150, temperature 39.5°C."
        steps:
