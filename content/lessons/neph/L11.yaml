        text: |
          - Irregular menses **47%**، amenorrhea **41%**.
          - الحمل على الغسيل حوالي **18/1000 person-years**، أعلاه في سن 20-24.
          - الـ **peritoneal dialysis (PD) أقل 53%** من الـ haemodialysis (HD): والسبب غالبًا إن الـ hypertonic dextrose والسوايل في البطن بيعطّلوا رحلة البويضة.
          - السكر كسبب للفشل الكلوي = أقل معدل حمل.
      - kind: explain
        page: 365
        title: "ليه الـ sexual dysfunction، وليه الحمل أقل على الـ PD؟"
