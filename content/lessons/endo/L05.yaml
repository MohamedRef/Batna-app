  - id: endo.L05.lesson2
    title: "العلاج: من الجراحة لحد الـ mTOR"
    hook: "الورم انتشر في الكبد ومش هيتشال. نعمل إيه؟ عشر طرق في الكتاب، وكل واحدة ليها منطق."
    minutes: 10
    pages: [84, 87]
    topics: [treatment, targeted]
    goals:
      - "تعرف إمتى الجراحة بتشفي وإيه البدايل لو مش ممكنة"
      - "تشرح ليه الـ somatostatin analogs بتشتغل وليه بتعمل gallstones"
      - "تعدّ الـ chemo والـ targeted therapy على حسب الـ target"
    status: unverified
    steps:
      - kind: explain
        remind: [endo.L05.031]
        page: 84
        quote: "Complete surgical removal of a solitary tumor offers a chance of cure."
        title: "العلاج: جراحة لو ينفع"
        text: |
          - **Solitary resectable**: ==complete surgical removal== = فرصة شفا.
          - **مش قابل للشفا**: نتحكم في الأعراض والنمو، لأن الـ NET بطيء والمريض ممكن يعيش سنين، فالهدف إنه يعيش كويس: debulking، antisecretory (الـ gastrinoma)، **somatostatin analogs** (الـ vasoactive intestinal peptide-secreting tumour (VIPoma))، embolization ± chemo، cryotherapy، radiofrequency ablation (RFA)، chemo (streptozotocin + doxorubicin: 69% response)، radiolabeled somatostatin analogue (SSA)، interferon، وحتى **liver transplantation**.
      - kind: explain
        page: 84
        quote: "Somatostatin Analogs\n  Used since the 1980s.\n  Synthetic hormone-blocking agents (e.g., octreotide, lanreotide).\n  First-line for neuroendocrine gastroenteropancreatic tumors.\n  Second- or third-line for insulinomas and gastrinomas."
        title: "الـ somatostatin analogs"
        text: |
          **Octreotide** و **lanreotide**، من الثمانينات.

          - ==First-line== للـ GEP NETs.
          - **Second- or third-line** للـ insulinoma والـ gastrinoma (ليهم علاج أنسب: الـ proton pump inhibitor (PPI) للـ gastrinoma مثلًا).
      - kind: reveal
        page: 84
        quote: "Side Effects\n  Gallstones (due to inhibition of cholecystokinin release).\n  Pain at injection site.\n  Hypo/hyperglycemia.\n  Rash.\n  Alopecia.\n  Fluid retention."
        prompt: "مريض على octreotide سنين وجاله biliary colic. ليه؟"
        answer: "الـ somatostatin بيمنع الـ **cholecystokinin** وبيقلل انقباض المرارة والـ bile flow، فالصفرا بتركد وتعمل **gallstones**. باقي الأعراض: ألم مكان الحقنة، hypo/hyperglycaemia، rash، alopecia، fluid retention."
      - kind: aside
        tone: joke
        page: 85
        quote: "Physiological Effects\n  Reduces liver blood flow.\n  Inhibits gastric acid and pepsin secretion.\n  Inhibits gallbladder contractility and bile flow.\n  Inhibits pancreatic exocrine secretion.\n  Inhibits GI and pancreatic peptide hormone secretion.\n  Slows GI transit time and inhibits absorption of glucose and amino acids.\n  Reduces splanchnic blood flow.\n  Stimulates water and electrolyte absorption.\n  Inhibits tissue growth and proliferation."
        text: "الـ somatostatin ده \"الحماة\" بتاعة الجهاز الهضمي: يقفل الحمض، يقفل المرارة، يقفل البنكرياس، يبطّأ الأمعاء، ويقلل الدم الواصل للكبد. بس عشان كده هو بالظبط اللي محتاجينه مع ورم بيفرز كتير."
      - kind: explain
        page: 85
        quote: "Physiological Effects\n  Reduces liver blood flow.\n  Inhibits gastric acid and pepsin secretion.\n  Inhibits gallbladder contractility and bile flow.\n  Inhibits pancreatic exocrine secretion.\n  Inhibits GI and pancreatic peptide hormone secretion.\n  Slows GI transit time and inhibits absorption of glucose and amino acids.\n  Reduces splanchnic blood flow.\n  Stimulates water and electrolyte absorption.\n  Inhibits tissue growth and proliferation."
        title: "ليه الـ somatostatin بيعالج الـ NET؟"
        text: |
          اقرا الـ physiological effects على إنها **أسباب** للعلاج:
          - **Inhibits GI and pancreatic peptide hormone secretion**: ده الأساس؛ الورم بيفرز هرمون، والـ somatostatin بيقفل الإفراز، فالأعراض تقل.
          - **Stimulates water and electrolyte absorption** و **slows GI transit**: فالإسهال بتاع الـ VIPoma والـ carcinoid يقل.
          - **Inhibits gastric acid**: بيساعد في الـ gastrinoma (بس الـ PPI أقوى، علشان كده الـ SSA second-line هناك).
          - **Inhibits tissue growth and proliferation**: فبيبطّأ نمو الورم نفسه، مش بس الأعراض.
          - **Reduces liver and splanchnic blood flow**.

          والجانب التاني من نفس الكلام: **inhibits gallbladder contractility and bile flow** = gallstones، و **inhibits pancreatic exocrine secretion** و absorption of glucose = ممكن hypo أو hyperglycaemia. يعني الأعراض الجانبية هي هي الفوايد في مكان غلط.
      - kind: explain
        page: 85
        quote: "Interferon Alpha\n  Used for midgut carcinoids.\n  Mechanism:\n    Direct effect on tumor cells.\n    Blocks cell cycle in G1/S phase.\n    Inhibits protein/hormone synthesis.\n    Inhibits angiogenic function.\n  Can be used with or without somatostatin analogs."
        title: "الـ interferon alpha"
        text: |
          بيتستخدم في الـ ==midgut carcinoids==، لوحده أو مع الـ SSA. بيشتغل بأربع طرق:
          1. **Direct effect** على خلايا الورم.
          2. بيوقف الـ cell cycle في **G1/S**، يعني الخلية ما تقسمش.
          3. بيمنع **protein/hormone synthesis**، فالأعراض تقل.
          4. بيمنع الـ **angiogenesis**، والـ NETs أورام فيها أوعية كتير.

          الأعراض الجانبية: **flu-like**، fever، anaemia، thrombocytopenia، leukopenia. يعني بيضرب الـ bone marrow، فلازم CBC.
      - kind: explain
        page: 86
        quote: "Regimens\n  Streptozotocin + 5-FU and doxorubicin\n    Response rate >50% in malignant NETs\n  Cisplatin/Paraplatin + Etoposide\n    For poorly differentiated NETs in foregut\n  Temozolomide + Thalidomide"
        title: "الـ chemotherapy"
        text: |
          الكتاب بيقول إن الـ chemo غالبًا **palliative** للـ metastasizing neuroendocrine carcinomas. ليه مش علاج شافي؟ لأن أغلب الـ NETs **slow-growing**، والـ chemo بيضرب الخلايا اللي بتنقسم بسرعة، فبيشتغل أحسن في الـ poorly differentiated.

          - **Streptozotocin + 5-FU + doxorubicin**: response **أكتر من 50%** في الـ malignant NETs (وص 84 كاتبة 69% لـ streptozotocin + doxorubicin).
          - **Cisplatin/carboplatin + etoposide**: للـ **poorly differentiated** في الـ foregut، نفس علاج الـ small cell لأنها شبهها.
          - **Temozolomide + thalidomide**.

          وفي ص 86 كمان صورة hepatic arteriogram قبل وبعد الـ **embolization**: الـ liver mets بتاخد دمها من الـ hepatic artery، فلما تقفله، الـ mets بتموت والكبد بيعيش على الـ portal vein (التفسير المقبول، مش في الكتاب).
      - kind: sort
        page: 86
        quote: "VEGF Inhibitors\n  Bevacizumab.\n  Sunitinib.\n  Sorafenib.\n  Pazopanib.\nmTOR Inhibitor\nEverolimus."
        prompt: "حط كل دوا في الـ target بتاعه:"
        bins: ["VEGF", "mTOR", "IGF-1"]
        cards:
          - { text: "Bevacizumab", bin: 0 }
          - { text: "Sunitinib", bin: 0 }
          - { text: "Sorafenib", bin: 0 }
          - { text: "Pazopanib", bin: 0 }
          - { text: "Everolimus", bin: 1 }
          - { text: "AMG-479", bin: 2 }
        why: "الأربعة الأوائل vascular endothelial growth factor (VEGF) inhibitors، الـ everolimus هو الـ mechanistic target of rapamycin (mTOR) inhibitor الوحيد، والـ AMG-479 للـ IGF-1."
      - kind: figure
        page: 87
        quote: "Pathway Overview\n  SST receptor → G protein → PI3K → Akt → mTOR → Cell cycle activation, protein synthesis.\n  Other pathways: P38/cGMP, IGFR complex, TGFBR complex.\n  Secretory products: 5-HT, 5-HIAA, tryptophan.\n  Cellular effects: metabolism, angiogenesis, proliferation."
        title: "ليه mTOR؟"
        alt: "A vertical pathway: SST receptor, G protein, PI3K, Akt, mTOR, then cell cycle activation and protein synthesis. Everolimus blocks at mTOR."
        caption: "نفس الطريق اللي بيبدأ من الـ somatostatin receptor بيوصل لـ mTOR، فالـ everolimus بيقفل آخره."
