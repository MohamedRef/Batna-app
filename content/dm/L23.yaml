  # ---------- p294: inclisiran ----------
  - id: dm.L23.041
    kind: card
    topic: pcsk9
    front: How does inclisiran differ from the PCSK9 antibodies?
    back: "It is a small interfering RNA that neutralizes PCSK9 messenger RNA in the liver, so less PCSK9 is made. Its effect lasts ≥ 180 days, so it is given every 3 or 6 months instead of every 2 or 4 weeks; LDL-C lowering is similar."
    src: { page: 294, quote: "SiRNAs have been developed to interfere with PCSK9 production in the liver by neutralizing the messenger RNA of PCSK9." }
    status: unverified
    tags: [high-yield]
    update:
      text: "The FDA label (December 2021) doses inclisiran at day 0, 3 months, then every 6 months; since 2023 it can be used with a statin earlier, not only after maximal therapy. Cardiovascular outcome trials (ORION-4, VICTORION-2 PREVENT) were still running in 2025."
      ref: "Leqvio (inclisiran) FDA label 2021, updated 2023"
  - id: dm.L23.042
    kind: cloze
