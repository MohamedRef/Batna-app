      - kind: check
        page: 78
        quote: "Background\n  Incidence: 1–2 per 100,000 (likely underestimated due to vague presentations and misdiagnosis).\n  <2% of GI malignancies.\n  Neuroendocrine tumors of the lung, GI tract and mediastinum have higher incidence in patients >50 years.\n  Exception: Appendiceal carcinoids more common in patients <30 years."
        question: "Most neuroendocrine tumours (NETs) of the lung and gastrointestinal (GI) tract occur over 50. Which is the exception?"
        options: ["Appendiceal carcinoid (under 30)", "Gastrinoma (under 30)", "Lung carcinoid (under 20)", "Insulinoma (children)"]
        answer: 0
        why:
          - "صح: الـ appendiceal carcinoid أشيع تحت 30، عشان كده بيتلاقى صدفة في appendicectomy عند شباب."
          - "الـ gastrinoma متوسط سن التشخيص حوالي 50."
          - "الـ lung carcinoid بييجي في الخمسينات."
          - "الـ insulinoma بين 40 و 50."
      - kind: explain
        page: 78
        quote: "Sites of Neuroendocrine Tumours\n  Pancreatic islet cells.\n  Gastroenteric tissue.\n  Respiratory epithelium.\n  Gastroenteropancreatic NETs (includes carcinoid tumors)."
        title: "بتطلع فين؟ وليه بتتأخر في التشخيص؟"
        text: |
          الخلية بتشتغل بأربع طرق: **endocrine** و **autocrine** و **paracrine** و **neurocrine**، يعني ممكن تأثر على عضو بعيد أو على نفسها أو جيرانها.

          الأماكن: الـ **pancreatic islet cells**، الـ **gastroenteric tissue**، والـ **respiratory epithelium**. والـ gastroenteropancreatic (GEP) NETs بتشمل الـ carcinoid.

          - الـ incidence **1-2 لكل 100,000**، والكتاب بيقول إنها **underestimated** عشان الأعراض مبهمة والتشخيص بيتأخر أو يغلط. يعني إسهال أو flushing بيتعالج سنين قبل ما حد يفكر في ورم.
          - أقل من **2%** من الـ GI malignancies.
          - الـ lung والـ GI والـ mediastinum أكتر **فوق 50**، **إلا** الـ appendiceal carcinoid أكتر **تحت 30**.

          وأغلب الـ GEP tumours **malignant بس بطيئة النمو**، وده تاني سبب للتأخير: الورم بيعيش سنين من غير ما يبان.
      - kind: table
        page: 79
        quote: "Carcinoid Tumors\n  25% Foregut (lung, thymus, gastric mucosa, duodenum).\n  40–60% Midgut (distal ileum and jejunum) — includes carcinoid syndrome.\n  Hindgut (colon, rectum)."
        title: "الـ carcinoid على حسب الـ gut"
        columns: ["Gut", "%", "Sites"]
        rows:
          - ["Foregut", "25%", "Lung, thymus, stomach, duodenum"]
          - ["Midgut", "40-60%", "Distal ileum, jejunum + syndrome"]
          - ["Hindgut", "-", "Colon, rectum"]
        hide: [[0, 2], [1, 1], [2, 2]]
      - kind: aside
        tone: exam
        page: 79
        quote: "Carcinoid Tumors\n  25% Foregut (lung, thymus, gastric mucosa, duodenum).\n  40–60% Midgut (distal ileum and jejunum) — includes carcinoid syndrome.\n  Hindgut (colon, rectum)."
        text: "الـ **carcinoid syndrome** مكتوب جنب الـ **midgut** في الكتاب. لو السؤال فيه flushing + diarrhoea، فكّر في ileum الأول."
      - kind: table
        page: 79
        quote: "  Well-differentiated NE carcinomas: Low-grade malignant with invasion of muscularis propria or metastasis.\n  Poorly differentiated endocrine carcinomas: High-grade, malignant.\nLevel of tumor differentiation and proliferation indices such as Ki-67 are useful"
        title: "WHO: تلات درجات"
        columns: ["Category", "Behaviour"]
        rows:
          - ["Well-diff. NET", "Benign or uncertain"]
          - ["Well-diff. NE carcinoma", "Low-grade, invades m. propria or mets"]
          - ["Poorly diff. carcinoma", "High-grade malignant"]
        hide: [[1, 1], [2, 1]]
      - kind: update
        page: 79
        quote: "  Well-differentiated NE carcinomas: Low-grade malignant with invasion of muscularis propria or metastasis.\n  Poorly differentiated endocrine carcinomas: High-grade, malignant.\nLevel of tumor differentiation and proliferation indices such as Ki-67 are useful"
        text: "الـ World Health Organization (WHO) 2019 بيقسّم الـ GEP-NET بالـ Ki-67: G1 أقل من 3%، G2 من 3 لـ 20%، G3 فوق 20%، والـ neuroendocrine carcinoma (NEC) لوحده. في الامتحان اكتب تقسيم الكتاب."
        ref: "WHO Classification of Digestive System Tumours, 5th ed., 2019"
      - kind: mnemonic
        page: 79
        quote: "Familial Syndromes\n  MEN-1 (20%, gastrinoma or non-functioning).\n  Tuberous sclerosis.\n  Neurofibromatosis (ampulla of Vater).\n  Von Hippel-Lindau."
        word: "MTNV"
        hook: "الـ familial syndromes مع أورام البنكرياس: \"My Tumour Needs Vigilance\"."
        parts:
          - { key: "M", text: "MEN-1 (20%, gastrinoma or non-functioning)" }
          - { key: "T", text: "Tuberous sclerosis" }
          - { key: "N", text: "Neurofibromatosis (ampulla of Vater)" }
          - { key: "V", text: "Von Hippel-Lindau" }
      - kind: explain
        page: 79
        quote: "Endocrine Pancreatic Tumors\n  60% Functioning (Zollinger-Ellison, hyperglycemic, Verner-Morrison, glucagonomas, VIPomas, etc.).\n  Non-functioning (usually large and metastatic at diagnosis).\nPancreatic Endocrine Tumors\n  Account for 3–5% of all pancreatic neoplasms.\n  Most are sporadic."
        title: "أورام البنكرياس: شغّالة ولا ساكتة"
        text: |
          الـ endocrine pancreatic tumours **3-5%** من أورام البنكرياس، وأغلبها **sporadic**.

          - **60% functioning**: Zollinger–Ellison، hyperglycaemic (insulinoma)، Verner–Morrison، glucagonoma، VIPoma. دول الهرمون بيفضحهم بدري.
          - **Non-functioning**: الكتاب بيقول «usually **large and metastatic** at diagnosis». ليه؟ لأن مفيش هرمون يعمل أعراض، فالورم بيكبر لحد ما يضغط على حاجة أو يوصل الكبد.

          والهرمونات اللي ممكن تطلع: insulin، gastrin، glucagon، VIP، serotonin، و ACTH. ده إجابة «anatomical locations» في سؤال 1 في ص 98 لو جمعته مع جدول الـ carcinoid.
      - kind: try
        items: [endo.L05.001, endo.L05.005, endo.L05.014, endo.L05.016, endo.L05.017]
    recap:
      - "NET: من neuroendocrine cells، secretory، وكتير hypersecretory syndrome."
      - "APUD (Pearse 1969): granules من غير axons، جزء من الـ DES."
      - "Tryptophan → 5-HTP → 5-HT → 5-HIAA؛ granules: pancreastatin، chromostatin، CgA."
