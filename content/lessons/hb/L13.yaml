  - id: hb.L13.lesson7
    title: "الـ IgG4-RD: المرض اللي بيعمل نفسه tumour"
    hook: "عضو منفوخ زي الورم، وبيخف بالـ steroids. السر في الـ biopsy: حصيرة collagen و plasma cells."
    minutes: 8
    pages: [241, 244]
    topics: [igg4-diagnosis]
    goals:
      - "تعدّ الـ organs والـ shared features"
      - "تمشي في الـ diagnostic algorithm"
      - "تحفظ الـ cut-offs: 135، 50/100، 40%"
      - "تعرف الـ 3 pathological characteristics"
    status: unverified
    steps:
      - kind: explain
        remind: [hb.L13.174]
        page: 241
        quote: "The most commonly affected organs are Pancreas, bile duct, major salivary glands, lacrimal glands, retroperitoneum and lymphatic ducts."
        title: "إيه هو الـ IgG4-RD؟"
        text: |
          الـ IgG4-RD هو ==fibro-inflammatory process== مرتبط بالـ immunomodulation.

          **أشهر organs**: pancreas، و bile duct، و major salivary glands، و lacrimal glands، و retroperitoneum، و lymphatic ducts.

          الحاجات المشتركة بين كل أشكاله:

          - العضو بيتورّم، وشكله بيبقى زي الـ **neoplasm** (pseudotumour).
          - **Lymphoplasmacytic infiltrate** غني بـ immunoglobulin G subclass 4 (IgG4)+ plasma cells.
          - **Fibrosis** بدرجات، بشكل ==storiform==.
          - Serum IgG4 عالي في 60–70%.
          - أغلب المرضى بيستجيبوا للـ **glucocorticoids**.

          **Epidemiology**: أكتر في الرجالة (M:F 2.8:1)، ومفيش familial cases معروفة.

          ليه صعب تشخيصه؟ لأن الأعراض بتعتمد على العضو المصاب، وممكن تشبه أمراض أشهر بكتير، زي cancer البنكرياس.
      - kind: figure
        page: 243
        quote: "Different forms of presentation and evolution of type 1 AIP. A) CT scan image, diffuse increase in pancreatic size (continuous arrow) without associated peripancreatic inflammatory changes. B) CT scan image, diffuse increase in pancreatic size (continuous arrow) with inflammatory changes in the peripancreatic fat (dashed arrow), indistinguishable from acute pancreatitis. C) MRI image, enhanced sequence in T1 with contrast, fibrotic tissue in pancreatic topography (asterisk). D) MRI image, enhanced in T2, severe pancreatic atrophy (continuous arrow) in a patient with endocrine and exocrine pancreatic insufficiency."
        title: "الـ autoimmune pancreatitis (AIP) type 1 على الـ CT والـ MRI"
        image: { file: hb/L13-aip-ct-mri.webp, book: true }
        alt: "Four abdominal scans labelled A to D with yellow arrows. A and B are CT images of a diffusely enlarged pancreas, B with stranding in the surrounding fat. C is a T1 MRI with fibrotic tissue in the pancreatic area marked by an asterisk. D is a T2 MRI of a severely atrophic pancreas."
        caption: |
          - **A**: البنكرياس كله كبير (==diffuse enlargement==) من غير التهاب حواليه.
          - **B**: كبير ومعاه التهاب في الدهن اللي حواليه، فشبه الـ acute pancreatitis بالظبط.
          - **C**: (MRI T1) fibrotic tissue مكان البنكرياس، عليها النجمة.
          - **D**: (MRI T2) البنكرياس ضمر خالص، والمريض جاله endocrine و exocrine insufficiency.
      - kind: aside
        tone: analogy
        page: 244
        quote: "Storiform fibrosis: fibrosis is a prerequisite for diagnosis. It is characterised by radially arranged collagen fibres."
        text: |
          كلمة **storiform** جاية من اللاتيني **storea** يعني حصيرة. الـ collagen fibres بتبقى **radially arranged** ومتشابكة زي الحصيرة المجدولة، أو زي عجلة عربية الكارو. أول ما تشوف «حصيرة» تحت الميكروسكوب، افتكر IgG4.
      - kind: figure
        page: 242
        quote: "Fig(3): Diagnostic algorithm."
        title: "شكل 3 في الكتاب: الـ diagnostic algorithm للـ IgG4-RD"
        image: { file: hb/L13-igg4-algorithm.webp, book: true }
        alt: "Book flow chart in blue boxes. Top: clinical suspicion of IgG4-RD; No leads right to alternative diagnoses (neoplasms, other inflammatory diseases, infection). Yes leads to two boxes side by side: imaging tests (CT swelling of the affected organ or pseudotumour, MRI hypointensity on T2) and laboratory tests (serum IgG4 over 135 mg/dl, hypergammaglobulinaemia, eosinophilia, elevated IgE). A box on the left: 18F-FDG-PET/CT for staging and locating a biopsy target. No leads right to a box saying 30 to 50 percent of patients may have normal IgG4 values, with arrows up to alternative diagnoses and down to the biopsy. Yes leads to the biopsy box: fibrosis with a storiform pattern, obliterative phlebitis, lymphocytic and plasma cell infiltrate, eosinophilic infiltrate, and immunostaining IgG4+/IgG+ over 0.4. No leads right to repeat biopsies or review of previous material; Yes leads down to diagnosis of IgG4-RD."
        caption: |
          اقرا الشكل من فوق لتحت. الأسهم اللي رايحة يمين هي فروع **No**:

          - **فوق في النص**: clinical suspicion (أعراض وتاريخ مناسب). لو **No** ← يمين للـ **alternative diagnoses** (neoplasms، inflammatory diseases تانية، infection).
          - لو **Yes** ← صندوقين جنب بعض: **Imaging tests** شمال (computed tomography (CT): العضو وارم أو pseudotumour، و MRI: hypointense على T2)، و **Laboratory tests** يمين (serum IgG4 > ==135 mg/dl==، hypergammaglobulinaemia، eosinophilia، IgE عالي).
          - على الشمال لوحده: **18F-FDG-PET/CT** (positron emission tomography) للـ staging ولتحديد الـ lesion اللي هناخد منها biopsy.
          - لو الـ labs قالت **No** ← الصندوق اليمين: ==30–50%== ممكن الـ IgG4 عندهم طبيعي. منه سهم لفوق للـ alternative diagnoses وسهم لتحت للـ biopsy: يعني IgG4 طبيعي ما بيقفلش التشخيص.
          - **الـ biopsy** (الصندوق العريض تحت): storiform fibrosis، obliterative phlebitis، lymphocytic و plasma cell infiltrate، eosinophilic infiltrate، ومعاها **immunostaining**: ==IgG4+/IgG+ > 0.4==.
          - لو الـ biopsy **No** ← repeat biopsies (نفس العضو أو عضو تاني) أو review للعينات القديمة. لو **Yes** ← **Diagnosis of IgG4-RD** تحت خالص.

          يعني الـ serum بيساعد، بس الـ tissue هو اللي بيحكم، وده اللي الـ step اللي جاي بيشرحه بالأرقام.
      - kind: explain
        page: 242
        quote: "The absolute number of these IgG4+ plasma cells must be interpreted according to the specific tissue. For example, in the AIP the cut-off value is 50 cells per high field; however, in sialadenitis the cut-off value is 100."
        title: "الأرقام: serum و tissue"
        text: |
          **Serum**: 84% عندهم IgG4 أعلى من 135 mg/dl.

          **Tissue**: كتر الـ IgG4+ plasma cells هو العلامة المميزة، حتى لو الـ serum IgG4 طبيعي.

          ودقّق في 4 حاجات:

          - **Distribution**: في الـ IgG4-RD الخلايا بتبقى diffuse في الـ lesion كلها.
          - ==Cut-off by organ==: 50 لكل high-power field في الـ **autoimmune pancreatitis (AIP)**، و 100 في الـ **sialadenitis**.
          - IgG4+/IgG+ ratio: أدق من العدد لوحده.
          - ==Ratio cut-off==: أكتر من 40% مقترح في أي عضو، والقيمة الـ typical 70% أو أكتر.

          ليه الـ serum IgG4 مش كفاية لوحده؟ عشان **16%** تقريبًا الـ IgG4 عندهم طبيعي رغم المرض، وكمان فيه أمراض تانية بتعلّيه (هتشوفها في آخر درس). يعني التشخيص في الآخر بالـ **tissue**.
      - kind: reveal
        page: 243
        quote: "The IgG4+/IgG + ratio in plasma cells is a more specific tool to diagnose the disease, since many inflammatory entities also raise IgG4 plasma cells, by generally raising the pool of plasma cells."
        prompt: "ليه الـ IgG4+/IgG+ ratio أدق من عدد الـ IgG4+ cells لوحده؟"
        answer: |
          لأن أمراض التهابية كتير بتزوّد الـ IgG4+ cells عن طريق إنها بتزوّد **كل الـ plasma cells** عمومًا.

          العدد لوحده ممكن يعلى في أي التهاب. لكن الـ نسبة بتقولك: هل الـ IgG4 هو اللي غالب فعلًا، ولا هو مجرد جزء من زحمة plasma cells؟
      - kind: check
        page: 243
        quote: "An IgG4+/IgG + ratio in plasma cells > of 40 % has been proposed as an adequate cut-off value in any organ, although the typical value is 70 % or even higher."
        question: "Which IgG4+/IgG+ plasma cell ratio is proposed as an adequate cut-off in any organ?"
        options:
          - "> 40%"
          - "> 10%"
          - "> 70%"
          - "> 90%"
        answer: 0
        why:
          - "صح: > 40% cut-off مقترح في أي عضو."
          - "10% أقل بكتير من أي رقم في الكتاب."
          - "70% أو أكتر هو الـ **typical value**، مش الـ cut-off."
          - "90% مش موجود؛ ده رقم الـ remission بالـ steroids في الـ AIP."
      - kind: explain
        page: 244
        quote: "The 3 pathological characteristics of IgG4-RD are:\n  1. Lymphoplasmocytic infiltration.\n  2. Storiform fibrosis: fibrosis is a prerequisite for diagnosis. It is characterised by radially arranged collagen fibres.\n  3. Obliterative phlebitis: secondary to lymphoplasmocytic infiltration."
        title: "الـ 3 pathological characteristics"
        text: |
          - ==Lymphoplasmacytic infiltration==: ده الالتهاب نفسه.
          - ==Storiform fibrosis==: الـ fibrosis شرط للتشخيص (prerequisite). والـ collagen fibres بتبقى radially arranged.
          - ==Obliterative phlebitis==: الـ veins بتتسد، كنتيجة للـ lymphoplasmacytic infiltration حواليها.

          ترتيب يسهّل الحفظ: التهاب، بعده تليف، والتليف والالتهاب مع بعض بيقفلوا الـ veins.
      - kind: check
        page: 244
        quote: "Storiform fibrosis: fibrosis is a prerequisite for diagnosis. It is characterised by radially arranged collagen fibres."
        question: "Which histologic feature is a prerequisite for the diagnosis of IgG4-RD?"
        options:
          - "Fibrosis (storiform)"
          - "Noncaseating granuloma"
          - "Interface hepatitis"
          - "Onion-skin fibrosis"
        answer: 0
        why:
          - "صح: الكتاب بيقول **fibrosis is a prerequisite for diagnosis**، وشكلها storiform."
          - "الـ granuloma مش من الـ 3 characteristics؛ ظهرت في صورة stage IV primary biliary cholangitis (PBC)."
          - "دي hallmark الـ **autoimmune hepatitis (AIH)**."
          - "دي علامة الـ **primary sclerosing cholangitis (PSC)**؛ والـ PSC نفسها ممكن يبقى فيها IgG4 cells من غير ما تبقى IgG4-RD."
      - kind: table
        page: 242
        quote: "The absolute number of these IgG4+ plasma cells must be interpreted according to the specific tissue. For example, in the AIP the cut-off value is 50 cells per high field; however, in sialadenitis the cut-off value is 100."
        title: "أرقام لازم تتحفظ"
        columns: ["What", "Number"]
        rows:
          - ["Male : female", "2.8 : 1"]
          - ["Serum IgG4 high", "60–70% of patients"]
          - ["IgG4 > 135 mg/dl", "84%"]
          - ["Normal serum IgG4 (algorithm)", "30–50%"]
          - ["IgG4+ cells/HPF in AIP", "50"]
          - ["IgG4+ cells/HPF in sialadenitis", "100"]
          - ["IgG4+/IgG+ ratio cut-off", "> 40% (typical ≥ 70%)"]
        hide: [[0, 1], [2, 1], [4, 1], [5, 1], [6, 1]]
      - kind: reveal
        page: 244
        quote: "2. Storiform fibrosis: fibrosis is a prerequisite for diagnosis. It is\n characterised by radially arranged collagen fibres."
        prompt: "ليه الكتاب بيقول إن الـ fibrosis **prerequisite** للتشخيص، مش كفاية IgG4 plasma cells كتير؟"
        answer: |
          الكتاب: الـ 3 pathological characteristics هي **lymphoplasmacytic infiltration**، و **storiform fibrosis** (و **fibrosis is a prerequisite**)، و **obliterative phlebitis** (secondary للـ infiltration).

          والسبب في آخر المحاضرة (p249): فيه حاجات كتير بتزوّد الـ IgG4+ cells من غير ما تكون IgG4-RD: oral inflammatory diseases، PSC، RA، lymphoma، والأورام. وفي الأورام الـ IgG4 infiltration **patchy** ومن غير **storiform pattern** ولا phlebitis.

          يعني العدد لوحده بيلخبط مع الـ mimics، والـ storiform fibrosis هي اللي بتقول إن ده المرض نفسه.
      - kind: reveal
        page: 241
        quote: "The common characteristics shared by the different entities that make up\n the IgG4-related disease are:\n  Swelling of the neoplastic aspect of the affected organs.\n  Lymphoplasmocytic infiltrate rich in IgG4-positive plasma cells.\n  Variable degree of fibrosis with a storiform pattern.\n  In addition, high levels of serum IgG4 are found in 60–70 % of patients.\n  The vast majority of patients respond to glucocorticoids."
        prompt: "IgG4-RD بيصيب بنكرياس وقنوات وغدد لعابية وأورطى. إيه اللي بيخلّينا نسميهم كلهم مرض واحد؟"
        answer: |
          الكتاب بيعدّ الحاجات المشتركة:

          - **Swelling** في العضو شكله زي الورم (neoplastic aspect).
          - **Lymphoplasmacytic infiltrate** غني بالـ **IgG4+ plasma cells**.
          - **Fibrosis** بدرجات، بشكل **storiform**.
          - **Serum IgG4** عالي في **60–70%**.
          - الأغلبية الساحقة بترد على الـ **glucocorticoids**.

          يعني العضو بيختلف بس الـ histology واحدة. والمرض أكتر في الرجالة (**2.8:1**)، ومفيش حالات عائلية معروفة. وأكتر الأعضاء: البنكرياس، الـ bile duct، الغدد اللعابية والدمعية، الـ retroperitoneum، والـ lymphatic ducts.

          وعشان العضو بيتورّم ويبان زي ورم، الكتاب بيختم بإنك لازم **تشك** فيه، عشان تتجنب عمليات مش لازمة.
