      - kind: explain
        page: 38
        quote: "A case series (or clinical study):\n  Case series studies are commonly used to report on a group of patients with a defined disease who have been treated in a similar manner (without a control group).\n  A type of descriptive observational study useful for identifying similar or differing characteristics between selected cases.\n  Can be prospective or retrospective and usually involves only a small number of individuals.\n  Can include either non-consecutive (includes some, but not all, of the eligible patients) or consecutive individuals (include all cases) with the same condition or disease.\n  The information gained from a case series can be used to generate clinical hypotheses which can be tested by stronger study designs such as case control study."
        title: "Case series بالتفصيل"
        text: |
          - **Descriptive observational** study، بتطلع الصفات المتشابهة أو المختلفة بين حالات مختارة.
          - ممكن تكون ==prospective or retrospective== وعادة عدد صغير.
          - **Consecutive** = كل الحالات المؤهلة، **non-consecutive** = بعضها بس.
          - فايدتها: ==generate clinical hypotheses== تتختبر بعدين بـ design أقوى زي **case-control**.

          مثال: كل حالات **bone marrow depression** في مستشفى، والأدوية والـ risk factors عندهم. ده وصف مجموعة، مفيش مقارنة.
      - kind: sort
        page: 40
        quote: "Merits and limitations of case report\n| Merits | Limitations |\n|---|---|\n| Detecting novelties (emerging/new disease) | Lack of ability to generalize |\n| Generating hypotheses | No possibility to establish cause-effect relationship |\n| Unexplained outcome of treatment | Difficult to replicate |\n| High applicability: allows detailed investigation into situations which would be unethical or impractical to perform using another study design | Publication bias: tendency of investigators (to submit) or reviewers or editors (to accept) manuscripts for publication based on the direction or strengths of study findings |\n| Provide very detailed information | Retrospective design |\n| Educational value (present a scenario to help clinician to improve clinical skills). | distraction of reader when focusing on the unusual. |"
        prompt: "Merit ولا limitation للـ case report؟"
        bins: ["Merit", "Limitation"]
        cards:
          - { text: "Detecting novelties (new disease)", bin: 0 }
          - { text: "Generating hypotheses", bin: 0 }
          - { text: "Very detailed information", bin: 0 }
          - { text: "Educational value", bin: 0 }
          - { text: "Cannot establish cause-effect", bin: 1 }
          - { text: "Difficult to replicate", bin: 1 }
          - { text: "Publication bias", bin: 1 }
          - { text: "Cannot generalize", bin: 1 }
        why: "الـ case report بيكتشف الجديد ويدي تفاصيل ويعلّم، بس مايقدرش يعمم ولا يثبت سبب، وصعب يتكرر، وبيتأثر بالـ **publication bias** (اللي بيتبعت ويتقبل حسب اتجاه وقوة النتيجة)."
      - kind: check
        page: 40
        quote: "Merits and limitations of case report\n| Merits | Limitations |\n|---|---|\n| Detecting novelties (emerging/new disease) | Lack of ability to generalize |\n| Generating hypotheses | No possibility to establish cause-effect relationship |\n| Unexplained outcome of treatment | Difficult to replicate |\n| High applicability: allows detailed investigation into situations which would be unethical or impractical to perform using another study design | Publication bias: tendency of investigators (to submit) or reviewers or editors (to accept) manuscripts for publication based on the direction or strengths of study findings |\n| Provide very detailed information | Retrospective design |\n| Educational value (present a scenario to help clinician to improve clinical skills). | distraction of reader when focusing on the unusual. |"
        question: "Case reports are most useful when:"
        options:
          - "The sample size is large"
          - "Determining cause and effect between an intervention and outcome"
          - "Developing new practice guidelines"
          - "Unknown manifestations of a known disease are identified"
        answer: 3
        why:
          - "الـ case report حالة واحدة عادة."
          - "مايقدرش يثبت **cause-effect**."
          - "الـ guidelines فوق الهرم ومحتاجة أدلة أقوى."
          - "صح: **detecting novelties** هو أكبر ميزة."
      - kind: explain
        page: 41
        quote: "An EXPLORATORY STUDY is a small-scale study of relatively short duration, which is carried out when little is known about a situation or a problem. It may include description as well as comparison.\nFor example: A national Acquired Immunodeficiency Syndrome (AIDS) Control Program wishes to establish counseling services for Human Immunodeficiency Virus (HIV) positive and AIDS patients, but lacks information on specific needs, patients have for support. To explore these needs, a number of in-depth interviews (qualitative research) are held with various categories of patients (males, females, married, single) and with some counselors working on a program that is already under way."
        title: "الـ exploratory study"
        text: |
          ==Small-scale== ومدته قصيرة، بنعمله لما نعرف ==قليل جدًا== عن المشكلة. ممكن فيه وصف ومقارنة كمان.

          مثال المحاضرة: برنامج الإيدز عايز يعمل counselling لمرضى human immunodeficiency virus (HIV)/AIDS ومش عارف احتياجاتهم. فبيعمل **in-depth interviews** (qualitative research) مع فئات مختلفة (رجالة، ستات، متجوزين، سناجل) ومع counsellors.

          ولو عايز تفسر الفروق (ليه احتياجات الستات غير الرجالة؟) أو تلاقي أسباب، لازم ==تقارن مجموعات==.
      - kind: try
        items: [res.L04.030, res.L04.033, res.L04.039, res.L04.043, res.L04.046]
    recap:
