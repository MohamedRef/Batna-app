items:
  # ---------- p1: definition and MEN 1 contents ----------
  - id: endo.L01.001
    kind: card
    topic: definition
    front: Define multiple endocrine neoplasia (MEN).
    back: A group of genetically determined disorders with a predisposition to tumours in two or more components of the endocrine system.
    src: { page: 1, quote: "genetically determined disorders with a predisposition to tumor development within two or more components of the endocrine system" }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.002
    kind: card
    topic: definition
    front: What are the two major forms of MEN, and what characterises each?
    back: MEN 1 and MEN 2; each type develops tumours within specific endocrine organs.
    src: { page: 1, quote: "There are two major forms of MEN Type 1 (MEN 1). Type 2 (MEN 2)." }
    status: unverified
  - id: endo.L01.003
    kind: cloze
    topic: definition
    text: MEN 1 is also called {{c1::Wermer's}} syndrome and is the {{c2::most common}} form of MEN.
    src: { page: 1, quote: "MEN 1 (Wermer’s Syndrome) The most common" }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.004
    kind: cloze
    topic: definition
    text: MEN 1 becomes clinically manifest in the {{c1::4th}} decade, but biochemical testing identifies it by age {{c2::14–18}} years.
    src: { page: 1, quote: "The syndrome becomes clinically manifest in the 4th decade. However biochemical testing is identified by the age of 14 – 18 years." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.005
    kind: enumerate
    topic: definition
    prompt: Enumerate the components of MEN 1 (Wermer's syndrome).
    points:
      - Parathyroid disease (primary hyperparathyroidism)
      - Anterior pituitary adenomas
      - "Entero-pancreatic tumours: insulinoma, gastrinoma, glucagonoma, VIPoma, somatostatinoma, PP-producing and rare islet cell tumours"
      - "Other tumours: adrenocortical lesions, carcinoid, benign thyroid tumours, lipomas, CNS ependymomas, collagenomas, angiofibromas"
    pass: 3
    src: { page: 1, quote: "Contents of MEN 1 (Wermer‘s Syndrome). 1- Parathyroid disease. 2- Anterior Pituitary Adenomas. 3- Entero-pancreatic tumors" }
    status: unverified
    tags: [high-yield]
  # ---------- p2-3: primary hyperparathyroidism ----------
  - id: endo.L01.006
    kind: card
    topic: men1-pth
    front: What is the earliest and most common manifestation of MEN 1, and what is its penetrance?
    back: Primary hyperparathyroidism, with about 100% penetrance.
    src: { page: 2, quote: "Primary Hyperparathyroidism ~ 100% penetrance – earliest / most common manifestation." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.007
    kind: card
    topic: men1-pth
    front: How does hyperparathyroidism in MEN 1 differ anatomically from sporadic primary hyperparathyroidism?
    back: MEN 1 involves multiple glands; sporadic disease is usually a single-gland adenoma.
    src: { page: 2, quote: "Multiglandular involvement (unlike sporadic hyper PTH w/single gland adenoma)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.008
    kind: card
    topic: men1-pth
    front: How is primary hyperparathyroidism in MEN 1 diagnosed (clinical, lab, imaging)?
    back: "Clinically: stones and bones. Lab: hypercalcaemia with high serum PTH. Imaging: sestamibi scan and bone densitometry."
    src: { page: 2, quote: "Clinically - Stones, bones. Lab diagnosis :hypercalcemia w/ high serum PTH. Imaging – sestamibi & bone densitometry." }
    status: unverified
  - id: endo.L01.009
    kind: enumerate
    topic: men1-pth
    prompt: Indications for parathyroid surgery in MEN 1.
    points:
      - Symptomatic or marked hypercalcaemia
      - Nephrolithiasis
      - Diminished bone density (osteopenia)
      - Severe gastric ulcers secondary to gastrinoma
    pass: 3
    src: { page: 2, quote: "Symptomatic or marked hypercalcemia. Nephrolithiasis. Diminished bone density / osteopenia. Presence of severe gastric ulcers 2ry to gastrinoma" }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.010
    kind: card
    topic: men1-pth
    front: Why do severe gastrinoma ulcers count as an indication for parathyroidectomy in MEN 1?
    back: Hypercalcaemia increases gastrin release and worsens hypergastrinaemia; parathyroidectomy reduces gastrin secretion.
    src: { page: 2, quote: "hypercalcemia increase release of gastrin & worsens hypergastrinemia and parathyroidectomy reduces gastrin secretion" }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.011
    kind: cloze
    topic: men1-pth
    text: "After parathyroid surgery in MEN 1: temporary hypocalcaemia is {{c1::common}}; risk of permanent hypoparathyroidism is {{c2::4%}} and of persistent or recurrent hyperparathyroidism {{c3::30%}}."
    src: { page: 2, quote: "Temporary hypocalcemia common. 4% risk permanent hypoPTH, 30% risk persistent/recurrent hyperPTH." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.012
    kind: cloze
    topic: men1-pth
    text: Parathyroid autotransplant grafts function successfully in {{c1::more than 90%}} of cases; recurrence after successful surgery in MEN 1 is high, about {{c2::67% after 8 years}}, unlike sporadic disease.
    src: { page: 2, quote: "Graft function successful in >90% of autotransplantations. High rate of recurrence after successful surgical therapy unlike sporadic 67% after 8years." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.013
    kind: card
    topic: men1-pth
    front: Surgical therapy for primary hyperparathyroidism in MEN 1?
    back: Subtotal parathyroidectomy (removal of 3.5 glands), leaving a remnant in situ or implanting an autograft in the forearm (successful in more than 90%).
    src: { page: 3, quote: "Subtotal parathyroidectomy (removal of 3.5). Parathyroid remnants in situ OR autograft implanted into forearm succesful in >90% of cases." }
    status: unverified
    tags: [high-yield]
  # ---------- p3: pituitary ----------
  - id: endo.L01.014
    kind: cloze
    topic: men1-pituitary
    text: Anterior pituitary tumours occur in {{c1::15–60%}} of MEN 1 patients and are the first clinical manifestation in up to {{c2::25%}}; {{c3::two-thirds}} are microadenomas (under 1 cm).
    src: { page: 3, quote: "Prevalence in MEN-1 ranges 15-60% in different series. First clinical manifestation in up to 25% of cases. Two-thirds are microadenomas (<1cm)." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.015
    kind: table
    topic: men1-pituitary
    title: Types of pituitary tumour in MEN 1
    columns: [Tumour, Share]
    rows:
      - [Prolactinoma, 60%]
      - [Somatotropinoma, 20%]
      - [Corticotrophinoma and null cell tumours, 15%]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 3, quote: "Prolactinomas 60%, somatotropinomas 20%, corticotrophinomas and null cell tumors 15%." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L01.016
    kind: card
    topic: men1-pituitary
    front: Clinical features of pituitary tumours in MEN 1?
    back: Amenorrhoea, galactorrhoea and infertility in women; impotence in men; acromegaly or Cushing's disease.
    src: { page: 3, quote: "Female patient may complain from amenorrhea, galactorrhea, infertility, impotence in men; acromegaly or cushing‘s disease." }
    status: unverified
  - id: endo.L01.017
    kind: card
    topic: men1-pituitary
    front: How are pituitary tumours in MEN 1 monitored and imaged, and what is the surgery?
    back: Monitor prolactin and IGF-1; CT or MRI; trans-sphenoidal resection.
    src: { page: 3, quote: "Monitor PRL, IGF-1. CT/MRI. Trans-sphenoidal resection of pituitary tumor." }
    status: unverified
  # ---------- p3-4: entero-pancreatic overview ----------
  - id: endo.L01.018
    kind: cloze
    topic: men1-gep
    text: Entero-pancreatic tumours occur in {{c1::30–75%}} of MEN 1 patients and are {{c2::multicentric}}.
    src: { page: 3, quote: "Prevalence ranges from 30-75%. Multicentric lesions." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.019
    kind: card
    topic: men1-gep
    front: What is now the primary life-threatening manifestation of MEN 1, and why?
    back: The malignant potential of the entero-pancreatic tumours, because parathyroid and pituitary disease are now treated effectively.
    src: { page: 3, quote: "the malignant potential of these entero-pancreatic lesions is now the primary life-threatening manifestation of the syndrome" }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.020
    kind: order
    topic: men1-gep
    prompt: Natural progression of MEN 1 entero-pancreatic lesions.
    steps:
      - Micro- or macroadenomas
      - Invasive malignancy
      - Metastatic carcinoma
    src: { page: 3, quote: "Micro/macroadenomas -> invasive malignencies-> metastaic carcinoma." }
    status: unverified
  # ---------- p4-5: gastrinoma ----------
  - id: endo.L01.021
    kind: cloze
    topic: gastrinoma
    text: Gastrinoma is the most common entero-pancreatic tumour in MEN 1, about {{c1::50%}} of them; MEN 1 gastrinomas are mostly in the {{c2::duodenum}}, small and multiple, and {{c3::50%}} have metastasised at diagnosis.
    src: { page: 4, quote: "tend to be small & multiple lesions. MEN1 gastrinomas mostly in duodenum, 50% metastasized at Diagnosis." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L01.022
    kind: card
    topic: gastrinoma
    front: Poor prognostic factors in MEN 1 gastrinoma?
    back: Pancreatic (rather than duodenal) site, metastases and a higher gastrin level.
    src: { page: 4, quote: "Poor prognosis with pancreatic (not duodenal); metastases & higher gastrin level." }
    status: unverified
  - id: endo.L01.023
    kind: card
    topic: gastrinoma
    front: Diagnosis of gastrinoma (biochemical, clinical and imaging)?
    back: Hypergastrinaemia, multiple peptic ulcers and high gastric acid output; imaging with US, CT/MRI and portal venous sampling.
    src: { page: 4, quote: "Diagnosis including: hypergastrinemia, multiple peptic ulcers & high gastric acid output. Imaging & Biochemical:– U/S, CT/MRI & portal venous sampling." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.024
    kind: card
    topic: gastrinoma
    front: Medical treatment of gastrinoma?
    back: Proton pump inhibitors, e.g. omeprazole.
    src: { page: 4, quote: "Medical Treatment PPI‘s – Omeprazole." }
    status: unverified
  - id: endo.L01.025
    kind: card
    topic: gastrinoma
    front: Why is surgery for MEN 1 gastrinoma controversial when a solitary sporadic gastrinoma is simply resected?
    back: MEN 1 gastrinomas are frequently multiple and metastatic.
    src: { page: 4, quote: "For solitary sporadic gastrinoma - complete resection. MEN1 gastrinomas freq mult/mets – controversial role of surgery." }
    status: unverified
  - id: endo.L01.026
    kind: card
    topic: gastrinoma
    front: What are the boundaries of the gastrinoma triangle?
    back: The pancreas, the duodenum and the common bile duct.
    src: { page: 4, quote: "Gastrinoma triangle‖ – pancreas/duodenum/CBD." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.027
    kind: table
    topic: gastrinoma
    title: Surgery for gastrinoma by site
    columns: [Site, Operation]
    rows:
      - [Duodenum, Duodenotomy (with intraoperative US)]
      - [Head of pancreas, Enucleation]
      - [Body or tail of pancreas, Distal pancreatectomy with or without splenectomy]
      - [Liver metastases, Wedge resection]
    blanks: [[1, 1], [2, 1], [3, 1]]
    src: { page: 4, quote: "Tumors head pancreas-enucleated. Tumors body/tail pancreas – distal pancreatectomy +- splenectomy. Liver mets- wedge resection." }
    status: unverified
  - id: endo.L01.028
    kind: cloze
    topic: gastrinoma
    text: Metastatic gastrinoma occurs in {{c1::25–90%}} of Zollinger-Ellison patients; chemotherapy is {{c2::streptozocin and 5-FU}}.
    src: { page: 5, quote: "Metastatic Gastrinoma 25-90% of ZE patients. ChemoRx – streptozocin & 5 FU." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.029
    kind: enumerate
    topic: gastrinoma
    prompt: Treatment options for metastatic gastrinoma.
    points:
      - Chemotherapy (streptozocin and 5-FU)
      - Hepatic arterial chemoembolisation
      - Octreotide
      - Interferon
      - Aggressive debulking surgery
    pass: 4
    src: { page: 5, quote: "ChemoRx – streptozocin & 5 FU. Hepatic arterial chemoembolization. Octreotide. Interferon. Aggressive debulking surgery." }
    status: unverified
  # ---------- p5-6: insulinoma ----------
  - id: endo.L01.030
    kind: card
    topic: insulinoma
    front: Clinical picture of insulinoma?
    back: Hypoglycaemia after fasting or exertion that improves with glucose intake, with inappropriately elevated insulin.
    src: { page: 5, quote: "Patient develop hypoglycemia after fasting or exertion; improve with glucose intake & inappropriately elevated insulin." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.031
    kind: cloze
    topic: insulinoma
    text: "Insulinomas are {{c1::90%}} solitary and benign, found in the head, body and tail of the pancreas; malignancy is suggested by size {{c2::more than 6 cm}} or {{c3::liver or nodal metastases}}."
    src: { page: 5, quote: "90% solitary and benign. Head, body and tail pancreas. Malignancy - size > 6cm or liver/nodal mets." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L01.032
    kind: card
    topic: insulinoma
    front: Medical treatment of insulinoma before surgery?
    back: Control symptoms before surgery with frequent small carbohydrate meals until operated, and octreotide.
    src: { page: 5, quote: "Control Symptoms prior to surgery. Frequent small CHO meals until operated. Octreotide therapy." }
    status: unverified
  - id: endo.L01.033
    kind: card
    topic: insulinoma
    front: Curative surgery for malignant insulinoma?
    back: Whipple's operation or subtotal pancreatectomy with splenectomy, and excision of liver metastases.
    src: { page: 5, quote: "Whipple‘s or subtotal pancreatectomy - splenectomy, excision of liver metastases." }
    status: unverified
  - id: endo.L01.034
    kind: enumerate
    topic: insulinoma
    prompt: Palliation for metastatic insulinoma.
    points:
      - Chemotherapy
      - Chemoembolisation
      - Alcohol injection
      - Cryotherapy
      - Radiofrequency ablation
    pass: 3
    src: { page: 5, quote: "Palliation for metastatic disease. ChemoRx. Chemoembolization. Alcohol injections, cryotherapy, radiofrequency ablation." }
    status: unverified
  - id: endo.L01.035
    kind: enumerate
    topic: insulinoma
    prompt: Complications of pancreatic surgery for islet tumours.
    points: [Abscess, Fistula, Pseudocyst, Wound infection]
    pass: 3
    src: { page: 6, quote: "Complications of Surgical Treatment Abscess. Fistula. Pseudocyst. Wound infection." }
    status: unverified
  # ---------- p6-7: other islet tumours ----------
  - id: endo.L01.036
    kind: card
    topic: other-islet
    front: Characteristic skin rash of glucagonoma?
    back: Necrolytic migratory erythema.
    src: { page: 6, quote: "Glucagonoma Necrolytic migratory erythema." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.037
    kind: card
    topic: other-islet
    front: Features of glucagonoma besides the rash?
    back: Hypoaminoacidaemia, type 2 diabetes, muscle wasting, cachexia and DVT.
    src: { page: 6, quote: "Hypoaminoacidaemia, Type 2 DM, muscle wasting, cachexia, DVT." }
    status: unverified
  - id: endo.L01.038
    kind: cloze
    topic: other-islet
    text: Glucagonoma is most common in the {{c1::tail}} of the pancreas; surgery is the treatment of choice, but {{c2::50–80%}} have metastases at diagnosis.
    src: { page: 6, quote: "Tail of Pancreas most common site. Surgical removal is treatment of choice. However, 50-80% with metastases at time of diagnosis." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.039
    kind: card
    topic: other-islet
    front: Management of glucagonoma besides resection?
    back: Optimise the medical condition, total pancreatectomy, octreotide; chemotherapy with 5-FU, streptozotocin and dacarbazine.
    src: { page: 6, quote: "Optimize medical conditions, Total pancreatectomy, octreotide. Chemotherapy: - 5FU, streptozotocin, dacarbazine." }
    status: unverified
  - id: endo.L01.040
    kind: card
    topic: other-islet
    front: What does WDHA stand for in VIPoma, and how much stool is passed?
    back: Watery diarrhoea, hypokalaemia, achlorhydria; with hypovolaemia and dehydration, 5–10 litres of stool a day.
    src: { page: 6, quote: "Watery diarrhoea, hypokalaemia, achlorhydria, (=WDHA), hypovolaemia, dehydration, 5-10 litres stool/day." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.041
    kind: card
    topic: other-islet
    front: Treatment of VIPoma?
    back: Correct the dehydration, then surgery with distal pancreatectomy.
    src: { page: 6, quote: "Treatment: -correct dehydration. Surgical management with distal pancreatectomy." }
    status: unverified
  - id: endo.L01.042
    kind: card
    topic: other-islet
    front: Site and features of somatostatinoma?
    back: Duodenum or pancreas; steatorrhoea, cholelithiasis, type 2 diabetes and hypochlorhydria.
    src: { page: 7, quote: "Duodenum/pancreas. Steatorrhoea, cholelithiasis, type 2 DM, hypochlorhydria." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.043
    kind: card
    topic: other-islet
    front: Treatment of somatostatinoma?
    back: Resect the primary, debulk hepatic metastases, and cholecystectomy; manage hyperglycaemia and malnutrition.
    src: { page: 7, quote: "Treatment: Resect the primary and debulk hepatic metastases. Cholecystectomy." }
    status: unverified
  - id: endo.L01.044
    kind: card
    topic: other-islet
    front: Features of pancreatic polypeptide-producing tumours?
    back: Non-functioning, malignant and large at diagnosis; present with extrahepatic bile duct obstruction, GI bleeding or GI obstruction. Treated by resection, with chemotherapy for residual disease.
    src: { page: 7, quote: "Non-functioning. Malignant and large at time of Dx. Extrahepatic bile duct obstruction, GI. Bleeding, GI obstruction." }
    status: unverified
  # ---------- p7-8: other MEN 1 tumours ----------
  - id: endo.L01.045
    kind: cloze
    topic: men1-other
    text: Adrenocortical lesions occur in {{c1::20–40%}} of MEN 1; they are usually {{c2::bilateral, hyperplastic and non-functional}}, with no consensus on management.
    src: { page: 7, quote: "Adrenocortical lesions 20-40% MEN1. Usually bilateral, hyperplastic, non-functional. No consensus on management of these lesions." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.046
    kind: card
    topic: men1-other
    front: How common are carcinoids in MEN 1, where are they, and do they cause carcinoid syndrome?
    back: About 3%; in the bronchi, GI tract, pancreas or thymus; mostly asymptomatic without carcinoid syndrome.
    src: { page: 7, quote: "3% of MEN1 – bronchi, gi tract, pancreas, or thymus. Mostly asymptomatic no signs of carcinoid syndrome." }
    status: unverified
  - id: endo.L01.047
    kind: card
    topic: men1-other
    front: Lipomas in MEN 1?
    back: Cutaneous and visceral, in up to one-third of patients; they tend not to recur once excised.
    src: { page: 8, quote: "LIPOMAS Cutaneous and visceral. Up to 1/3 of MEN1 patients. Tend not to recur once excised." }
    status: unverified
  - id: endo.L01.048
    kind: enumerate
    topic: men1-other
    prompt: Other (non-endocrine-triad) tumours listed in MEN 1.
    points:
      - Adrenocortical lesions
      - Carcinoid
      - Benign thyroid tumours
      - Lipomas
      - CNS ependymomas
      - Collagenomas and angiofibromas
    pass: 4
    src: { page: 8, quote: "BENIGN THYROID tumors LIPOMAS" }
    status: unverified
  # ---------- p8: differential diagnosis ----------
  - id: endo.L01.049
    kind: enumerate
    topic: men1-ddx
    prompt: Differential diagnosis of MEN 1.
    points:
      - Sporadic or familial tumours of the pituitary, parathyroid or pancreatic islets
      - Hypercalcaemia from any cause
      - GI symptoms with raised gastrin simulating gastrinoma
      - H2 blockers or metoclopramide causing hyperprolactinaemia that simulates a prolactinoma
    pass: 3
    src: { page: 8, quote: "Sporadic or familial tumors of the pituitary, parathyroid or pancreatic islets. Hypercalcemia from any cause may cause." }
    status: unverified
  - id: endo.L01.050
    kind: card
    topic: men1-ddx
    front: Which treatments for GI symptoms can simulate a prolactinoma in a suspected MEN 1 patient?
    back: H2 blockers or metoclopramide, which can cause hyperprolactinaemia.
    src: { page: 8, quote: "Treatment of GIT symptoms with H2 blockers or metoclopramide may cause hyper- prolactinemia, simulating a pituitary prolactinoma." }
    status: unverified
    tags: [high-yield]
  # ---------- p8-9: treatment of MEN 1 ----------
  - id: endo.L01.051
    kind: card
    topic: men1-treatment
    front: Which MEN 1 patients with hyperparathyroidism should undergo parathyroid exploration (book, p8)?
    back: Serum calcium above 12 mg/dL with calcium nephrolithiasis or renal dysfunction, neuropathic or muscular symptoms, or bone involvement.
    src: { page: 8, quote: "If serum ca is > 12mg/dl, with evidence of ca nephrolithiasis or renal dysfunction, neuropathic or muscular symptoms or bone involvement" }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L01.052
    kind: cloze
    topic: men1-treatment
    text: At parathyroid exploration in MEN 1 all parathyroid tissue is removed, aiming to cut postoperative PTH to {{c1::under 50% of the basal value}}, and tissue is implanted in the {{c2::non-dominant forearm}}.
    src: { page: 8, quote: "the goal is to reduce post operative PTH to < 50% of basal value) and parathyroid tissue implanted in the non-dominant forearm" }
    status: unverified
  - id: endo.L01.053
    kind: card
    topic: men1-treatment
    front: Medical treatment of prolactinoma in MEN 1 and its effect?
    back: Bromocriptine or cabergoline; normalises serum prolactin and prevents further tumour growth.
    src: { page: 9, quote: "Prolactinomas with dopamine antagonists (bromocreptine or cabergolin) normalizes serum prolactin and prevents further tumor growth." }
    status: unverified
    update:
      text: "The book calls bromocriptine and cabergoline dopamine antagonists; pharmacologically both are dopamine (D2) agonists. The drugs and their effect are the book's; only the label is a slip."
      ref: "Endocrine Society clinical practice guideline: hyperprolactinemia 2011"
  - id: endo.L01.054
    kind: card
    topic: men1-treatment
    front: Treatment of ACTH- or GH-secreting pituitary tumours in MEN 1?
    back: Trans-sphenoidal resection.
    src: { page: 9, quote: "Transsphenoidal resection for neoplasms that secrete ACTH or GH." }
    status: unverified
  - id: endo.L01.055
    kind: cloze
    topic: men1-treatment
    text: Octreotide reduces tumour mass in {{c1::one-third}} of GH-secreting tumours and lowers GH and IGF-1 in {{c2::more than 75%}} of patients.
    src: { page: 9, quote: "Octeriotide reduces tumor mass in 1/3 of GH –secreting tumors and reduces GH and IGF-1 levels in > 75% of patients." }
    status: unverified
    tags: [numbers]
  - id: endo.L01.056
    kind: card
    topic: men1-treatment
    front: What is pegvisomant and its effect?
    back: A GH receptor antagonist that rapidly reduces IGF-1.
    src: { page: 9, quote: "Pegvisomont, a GH receptor antagonist, rapidly reduces IGF-1" }
    status: unverified
  - id: endo.L01.057
    kind: card
    topic: men1-treatment
    front: Role of radiotherapy for pituitary tumours in MEN 1?
    back: Useful for large or recurrent tumours.
    src: { page: 9, quote: "Radiation therapy may be useful for large or recurrent tumors." }
    status: unverified
  - id: endo.L01.058
    kind: cloze
