items:
  # --- Analytic studies (slides 4-10) ---
  - id: res.L05.001
    kind: mcq
    topic: analytic
    stem: A comparison (control) group is lacking in which study?
    options: [Cross-sectional studies, Case-control studies, Cohort studies, Randomized controlled clinical trial, Both cross-sectional studies and RCTs]
    answer: 0
    why:
      - The lecture lists cross-sectional studies under descriptive designs, which have no comparison group.
      - Controls are the comparison group of a case-control study.
      - The unexposed cohort is the comparison group.
      - An RCT always has a control arm.
      - The RCT has a control group, so "both" is wrong.
    src: { page: 4, quote: "Overview of Epidemiologic Study Designs:\n  EXPERIMENTAL: Random allocation of study subjects; Investigator assigns treatment or exposure:\n    Randomized Control Trials\n    Community Trials\n    Laboratory Trials\n  OBSERVATIONAL: Investigators study people and exposures \"in nature\". Comparison Group?\n    NO, DESCRIPTIVE: Correlational; Case Series; Case Reports; Cross-Sectional\n    YES, ANALYTIC: Case-Control; Cohort" }
    status: unverified
    tags: [book-question, high-yield]
  - id: res.L05.002
    kind: table
    topic: analytic
    title: What each branch of observational study is for
    columns: [Branch, Use 1, Use 2, Use 3]
    rows:
      - [Descriptive, Natural history, Allocation of resources, Suggest hypotheses]
      - [Analytic, Test hypotheses, Assess causation, "-"]
    blanks: [[0, 3], [1, 1], [1, 2]]
    src: { page: 6, quote: "Types of Epi Studies: Observational\n  Descriptive: Natural history; Allocation of resources; Suggest hypotheses\n  Analytic: Test hypotheses; Assess causation" }
    status: unverified
    tags: [high-yield]
  - id: res.L05.003
    kind: order
    topic: analytic
    prompt: Order these designs from the strongest to the weakest evidence for causality (the lecture's pyramid).
    steps:
      - Meta-analysis and systematic review
      - Randomized controlled trial
      - Prospective cohort
      - Retrospective cohort
      - Cross-sectional
      - Case series and case report
      - Opinionated review and expert opinion
    src: { page: 7, quote: "Hierarchy of study designs in determining causality (Strength of evidence), from strongest to weakest evidence:\n  Meta-analysis, Systematic review\n  Randomized controlled trial, Non-randomized controlled trial\n  Prospective cohort, Retrospective cohort\n  Cross-sectional\n  Case series, Case report\n  Opinionated review, Expert opinion" }
    status: unverified
  - id: res.L05.004
    kind: card
    topic: analytic
    front: What are analytical studies for, and what is their key feature?
    back: >-
      To quantify the association between exposures and outcomes and to test hypotheses about causal
      relationships. Their key feature is a comparison group.
    src: { page: 9, quote: "ANALYTICAL STUDIES:\n  To quantify the association between exposures and outcomes, and to test hypotheses about causal relationships.\n  The key feature of analytic epidemiology is a comparison group." }
    status: unverified
    tags: [high-yield]
  - id: res.L05.005
    kind: card
    topic: analytic
    front: In variable terms, what are the exposure and the outcome?
    back: The exposure is the independent variable; the outcome is the dependent variable.
    src: { page: 8, quote: "Definitions of terms:\n  EXPOSED: Having, or being exposed to, a potential cause or risk factor for disease or other outcome (Independent variable)\n  OUTCOME: Disease or other health-related event under study (Dependent variable)\n  PREVALENCE: A measure of the burden of disease in a population, calculated as the number of individuals with a disease or outcome divided by the total number of individuals in a defined population at a given time. Prevalence is expressed as a proportion (%)\n  INCIDENCE: A measure of the rate at which new cases of a disease occur in a population, calculated as the number of new cases divided by the population at risk over time. Incidence is expressed as a rate per unit time (for example, annual rate)" }
    status: unverified
  # --- Case-control design (slides 11-21) ---
  - id: res.L05.006
    kind: card
    topic: case-control
    front: Define a case-control study.
    back: >-
      Individuals are selected because they have (cases) or do not have (controls) a particular disease, then
      compared for the proportion with a history of an exposure or characteristic.
    src: { page: 12, quote: "Case Control Study, Definition: The selection of individuals on the basis of whether they do (cases) or they do not (control) have a particular disease then compared in respect to the proportion having a history of an exposure or certain characteristic of illness" }
    status: unverified
    tags: [high-yield]
  - id: res.L05.007
    kind: card
    topic: case-control
    front: What is the "directionality" of a case-control study?
    back: >-
      Backwards: it starts from the outcome (disease yes or no) in the present and looks back in time for
      the exposure. It proceeds from effect to cause.
    src: { page: 13, quote: "Case-control studies, Backwards Directionality: start from Outcome/Disease (Yes or No) and look back in time to Exposure (?)" }
    status: unverified
    tags: [high-yield]
  - id: res.L05.008
    kind: order
    topic: case-control
    prompt: Put the steps of a case-control study in order.
    steps:
      - Definition of cases
      - Selection of cases
      - Selection of controls
      - Ascertainment of exposure status
      - Analysis
      - Conclusion and interpretation
    src: { page: 14, quote: "Case Control Study Steps:\n  Definition of cases\n  Selection of cases\n  Selection of Controls\n  Ascertainment of exposure status\n  Analysis\n  Conclusion and interpretation" }
    status: unverified
  - id: res.L05.009
    kind: card
    topic: case-control
    front: What is a case definition, and what does it usually include?
    back: >-
      A set of standard diagnostic criteria a person must meet to count as a case, so all cases have the same
      disease. It includes clinical criteria (lab results, symptoms, signs) and sometimes limits of time, place and person.
    src: { page: 16, quote: "Case Definition:\n  A set of standard diagnostic criteria that must be fulfilled in order to identify a person as a case of a particular disease\n  Ensures that all persons who are counted as cases actually have the same disease\n  Typically includes clinical criteria (lab results, symptoms, signs) and sometimes restrictions on time, place, and person" }
    status: unverified
  - id: res.L05.010
    kind: card
    topic: case-control
    front: Which cases are preferred in a case-control study, incident or prevalent?
    back: New (incident) cases are preferred; prevalent cases (already present) may also be used.
    src: { page: 18, quote: "Selection of Cases:\n  Preferably new cases or incident cases\n  Prevalent cases (cases already present)" }
    status: unverified
  - id: res.L05.011
    kind: card
    topic: case-control
    front: Where can cases come from?
    back: From hospitals or from the general population, after defining diagnostic and eligibility criteria.
    src: { page: 15, quote: "Cases:\n  Define case: diagnostic and eligibility criteria\n  Source of cases: hospital, general population" }
    status: unverified
  # --- Controls, matching, confounding (slides 19-28) ---
  - id: res.L05.012
    kind: card
    topic: controls
    front: What is the ideal control in a case-control study?
    back: Someone matching the cases by age, sex and other characteristics, except that the control must not have the disease.
    src: { page: 19, quote: "Control: Control must be Ideally matching with the cases by age, sex and other characteristics except the control must not be suffering from diseases" }
    status: unverified
    tags: [high-yield]
  - id: res.L05.013
    kind: card
    topic: controls
    front: In a matched case-control study, what do you match on and why?
    back: >-
      Controls are enrolled based on characteristics of the case; you match on a potential confounding
      variable to remove its confounding effect.
    src: { page: 21, quote: "Matched case-control study: we enroll controls based upon some characteristic(s) of the case.\nThe idea in matching is to match upon a potential confounding variable in order to remove the confounding effect." }
    status: unverified
    tags: [high-yield]
  - id: res.L05.014
    kind: card
    topic: controls
    front: Define a confounding factor.
    back: A factor other than the studied exposure that disturbs the relation between the studied exposure and the disease.
    src: { page: 22, quote: "Confounding factors: These are factors other than the studied exposure that disturb the relation between the studied exposure and the disease" }
    status: unverified
    tags: [high-yield]
  - id: res.L05.015
    kind: mcq
    topic: controls
    stem: >-
      A study finds coffee drinkers have more pancreatic cancer. Coffee drinkers also smoke more, and smoking
      causes pancreatic cancer. What role does smoking play?
    options: [Effect modifier, Confounder, Outcome, Intermediate step caused by coffee]
    answer: 1
    why:
      - The lecture does not use this term; the question is about a third factor linked to both.
      - Smoking is linked to the exposure (coffee) and independently causes the disease, so it distorts the coffee-cancer relation.
      - The outcome is pancreatic cancer.
      - Coffee does not cause smoking; the two simply go together.
    src: { page: 25, quote: "Coffee (Exposure) → Pancreatic Cancer (Disease), with Smoking (Confounder) linked to both" }
    status: unverified
  - id: res.L05.016
    kind: card
    topic: controls
    front: Why can age confound a smoking and lung cancer study?
    back: >-
      Lung cancer risk rises with age, so if the smoking and non-smoking groups have very different average
      ages, age, not smoking alone, may explain the difference.
    src: { page: 24, quote: "Examples … confounding: SMOKING → LUNG CANCER, with AGE linked to both\n  AGE (As age advances chances of lung cancer increase)\n  (If the average ages of the smoking and non-smoking groups are very different)" }
    status: unverified
  - id: res.L05.017
    kind: table
    topic: controls
    title: Sources of controls
    columns: [Source, Advantage, Disadvantage]
    rows:
      - [Hospital based, "Easily identified, available, cooperative, accurate information (less recall bias)", "Not typical of the general population; more risk factors; some diseases share risk factors"]
      - ["Population based (registry)", "Most representative of the general population; generally healthy", "Time, money, energy; exposure opportunity may differ from cases"]
      - ["Neighbourhood / random telephone dialling", "Similar residence to cases; easier than population sampling", "Non-cooperation, security issues, not representative"]
      - ["Best friend / sibling", "Accessible, cooperative, similar to cases in most respects", Overmatching]
    blanks: [[0, 2], [1, 1], [3, 2]]
    src: { page: 26, quote: "Selection of controls: Sources\n| Source | Advantage | Disadvantage |\n|---|---|---|\n| Hospital based | Easily identified. Available for interview. More willing to cooperate. Tend to give complete and accurate information (↓recall bias). | Not typical of general population. Possess more risk factors for disease. Some diseases may share risk factors with disease under study (whom to exclude???) |\n| Population based (registry cases) | Most representative of the general population. Generally healthy. | Time, money, energy. Opportunity of exposure may not be same as that of cases (locⁿ, occu.) |\n| Neighbourhood controls/ Telephone exchange random dialing | Controls and cases similar in residence. Easier than sampling the population. | Non cooperation. Security issues. Not representative of general population. |\n| Best friend control/ Sibling control | Accessible, Cooperative. Similar to cases in most | Overmatching. |" }
    status: unverified
  - id: res.L05.018
    kind: mcq
    topic: controls
    stem: Which control source is most representative of the general population?
    options: [Hospital controls, Population-based (registry) controls, Best-friend controls, Sibling controls]
    answer: 1
    why:
      - Hospital controls are not typical of the general population and carry more risk factors.
      - Population-based controls are the most representative, though they cost time, money and energy.
      - Friends are similar to cases, which risks overmatching.
      - Siblings share genes and environment with cases, so overmatching again.
    src: { page: 26, quote: "Selection of controls: Sources\n| Source | Advantage | Disadvantage |\n|---|---|---|\n| Hospital based | Easily identified. Available for interview. More willing to cooperate. Tend to give complete and accurate information (↓recall bias). | Not typical of general population. Possess more risk factors for disease. Some diseases may share risk factors with disease under study (whom to exclude???) |\n| Population based (registry cases) | Most representative of the general population. Generally healthy. | Time, money, energy. Opportunity of exposure may not be same as that of cases (locⁿ, occu.) |\n| Neighbourhood controls/ Telephone exchange random dialing | Controls and cases similar in residence. Easier than sampling the population. | Non cooperation. Security issues. Not representative of general population. |\n| Best friend control/ Sibling control | Accessible, Cooperative. Similar to cases in most | Overmatching. |" }
    status: unverified
  - id: res.L05.019
    kind: cloze
    topic: controls
    text: "Controls are usually {{c1::equal}} in number to cases, but if cases are fewer than {{c2::50}}, take {{c3::2, 3 or 4}} controls per case."
    src: { page: 27, quote: "Size of Controls:\n  Equal to the number of cases\n  But if cases < 50 therefore 2, 3 or 4 times the number of cases" }
    status: unverified
    tags: [numbers]
  - id: res.L05.020
    kind: enumerate
    topic: controls
    prompt: How is exposure status ascertained in a case-control study?
    points: [Observation, Interviews, Questionnaire, Examination of records]
    pass: 3
    hook: "الـ exposure في الـ case-control بيتعرف بـ 4: «شوف، اسأل، استبيان، وورق» = observation، interviews، questionnaire، records."
    src: { page: 28, quote: "Ascertainment of Exposure:\n  1. Setting the criteria for exposure\n  2. Methods of exposures: Observation; Interviews; Questionnaire; Examination of records" }
    status: unverified
  # --- Odds ratio (slides 29-35) ---
  - id: res.L05.021
    kind: card
    topic: odds-ratio
    front: Define odds, and the odds of exposure in cases and in controls.
    back: >-
      Odds: the probability of an event occurring over the probability of it not occurring. Cases: a/c.
      Controls: b/d.
    src: { page: 32, quote: "ODDS: the probability of an event (exposure) occurring to the probability of the event not occurring\n  CASES: a/a+c divided by c/a+c = a/c\n  CONTROLS: b/b+d divided by d/b+d = b/d\nODDS RATIO: ratio of the odds of exposure among the cases to the odds of exposure among the controls = ad/bc" }
    status: unverified
  - id: res.L05.022
    kind: cloze
    topic: odds-ratio
    text: "Odds ratio = odds of exposure among {{c1::cases}} ÷ odds of exposure among {{c2::controls}} = {{c3::ad/bc}}."
    src: { page: 32, quote: "ODDS: the probability of an event (exposure) occurring to the probability of the event not occurring\n  CASES: a/a+c divided by c/a+c = a/c\n  CONTROLS: b/b+d divided by d/b+d = b/d\nODDS RATIO: ratio of the odds of exposure among the cases to the odds of exposure among the controls = ad/bc" }
    status: unverified
    tags: [numbers, high-yield]
  - id: res.L05.023
    kind: table
    topic: odds-ratio
    title: Reading an odds ratio
    columns: [OR, Meaning]
    rows:
      - ["= 1", "No association between exposure and disease"]
      - ["= 3", "Odds of exposure are 3 times greater in cases than in controls (risk factor)"]
      - ["< 1", "Exposure is less common in cases: a protective factor"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 33, quote: "Interpretation of Odds Ratio:\n  What do you understand by OR = 1 ?\n  What do you understand by OR = 3 ?\n  What is your opinion if OR is less than 1" }
    status: unverified
  - id: res.L05.024
    kind: mcq
    topic: odds-ratio
    stem: >-
      A case-control study of laryngeal cancer: cases 160 drank alcohol, 40 did not; controls 90 drank, 110
      did not. What is the odds ratio?
    options: ["1.78", "4.00", "4.89", "0.20"]
    answer: 2
    why:
      - "160/90 compares exposed cases with exposed controls, not odds."
      - "160/40 = 4 is the odds of exposure in cases only; it still has to be divided by the controls' odds (90/110)."
      - "OR = ad/bc = (160 × 110)/(90 × 40) = 17 600/3 600 = 4.89."
      - "This inverts the ratio (bc/ad)."
    src: { page: 34, quote: "Example: Alcohol Consumption and Laryngeal Cancer\n| | Cases | Controls |\n|---|---|---|\n| Alcohol | 160 | 90 |\n| No Alcohol | 40 | 110 |\n| Total | 200 | 200 |\nOdds ratio = 160 x 110 / 90 x 40 = 4.89\nInterpretation: The odds of alcohol consumption are 4.89 times greater among those with laryngeal cancer than the odds of alcohol consumption among those without laryngeal cancer." }
    status: unverified
    tags: [numbers]
  - id: res.L05.025
    kind: card
    topic: odds-ratio
    front: How does the lecture interpret OR = 4.89 for alcohol and laryngeal cancer?
    back: >-
      The odds of alcohol consumption are 4.89 times greater among those with laryngeal cancer than among
      those without it.
    src: { page: 34, quote: "Example: Alcohol Consumption and Laryngeal Cancer\n| | Cases | Controls |\n|---|---|---|\n| Alcohol | 160 | 90 |\n| No Alcohol | 40 | 110 |\n| Total | 200 | 200 |\nOdds ratio = 160 x 110 / 90 x 40 = 4.89\nInterpretation: The odds of alcohol consumption are 4.89 times greater among those with laryngeal cancer than the odds of alcohol consumption among those without laryngeal cancer." }
    status: unverified
  - id: res.L05.026
    kind: mcq
    topic: odds-ratio
    stem: >-
      A case-control study: risk factor present in 30 diseased and 20 non-diseased; absent in 20 diseased and
      30 non-diseased. The odds ratio equals:
    options: ["0.44", "0.80", "1.50", "2.25"]
    answer: 3
    why:
      - "0.44 is bc/ad, the inverse."
      - "0.80 is not any ratio of these cells."
      - "1.50 is 30/20, the odds in cases only."
      - "OR = ad/bc = (30 × 30)/(20 × 20) = 900/400 = 2.25."
    src: { page: 35, quote: "The table below summarizes the findings of a case-control study.\n| Risk factor | Diseased | Non-diseased |\n|---|---|---|\n| Present | 30 | 20 |\n| Absent | 20 | 30 |\nThe Odd's ratio equals:\n  A. 0.44\n  B. 0.80\n  C. 1.50\n  D. 2.25" }
    status: unverified
    tags: [book-question, numbers]
  # --- Case-control merits (slides 36-37) ---
  - id: res.L05.027
    kind: table
    topic: cc-merits
    title: Case-control studies, advantages and disadvantages
    columns: [Advantages, Disadvantages]
    rows:
      - ["Cheap, easy and quick", "Subject to bias (selection, recall, misclassification)"]
      - [Multiple exposures can be examined, Direct incidence estimation is not possible]
      - [Rare diseases and diseases with long latency can be studied, Temporal relationship is not clear]
      - [Suitable when randomization is unethical, Multiple outcomes cannot be studied]
      - ["-", "If exposure is common, hard to show a difference between cases and controls"]
      - ["-", Relative and attributable risk cannot be estimated]
    blanks: [[1, 1], [3, 1], [5, 1]]
    src: { page: 36, quote: "Advantages and disadvantages of case-control studies\n| Advantages | Disadvantages |\n|---|---|\n| Cheap, easy and quick studies | Subject to bias (selection, recall, misclassification) |\n| Multiple exposures can be examined | Direct incidence estimation is not possible |\n| Rare diseases and diseases with long latency can be studied | Temporal relationship is not clear |\n| Suitable when randomization is unethical (e.g., alcohol and pregnancy outcome) | Multiple outcomes cannot be studied |\n| | If the incidence of exposure is high, it is difficult to show the difference between cases and controls |\n| | Relative and attributable risk cannot be estimated |" }
    status: unverified
    tags: [high-yield]
  - id: res.L05.028
    kind: mcq
    topic: cc-merits
    stem: Which is INCORRECT about a case-control study?
    options:
      - Many etiological or risk factors can be studied at the same time
      - It proceeds from outcome (disease) to exposure (cause)
      - The temporal relationship between exposure and outcome is not known
      - Several possible outcomes can be studied
    answer: 3
    why:
      - "Correct statement: multiple exposures can be examined."
      - "Correct statement: it starts from the disease and looks back."
      - "Correct statement: the sequence is not clear."
      - Incorrect, so this is the answer. Cases are chosen for one disease, so multiple outcomes cannot be studied.
    src: { page: 36, quote: "Advantages and disadvantages of case-control studies\n| Advantages | Disadvantages |\n|---|---|\n| Cheap, easy and quick studies | Subject to bias (selection, recall, misclassification) |\n| Multiple exposures can be examined | Direct incidence estimation is not possible |\n| Rare diseases and diseases with long latency can be studied | Temporal relationship is not clear |\n| Suitable when randomization is unethical (e.g., alcohol and pregnancy outcome) | Multiple outcomes cannot be studied |\n| | If the incidence of exposure is high, it is difficult to show the difference between cases and controls |\n| | Relative and attributable risk cannot be estimated |" }
    status: unverified
    tags: [book-question, high-yield]
  - id: res.L05.029
    kind: mcq
    topic: cc-merits
    stem: All of the following are advantages of case-control studies EXCEPT
    options:
      - Cheap, easy and quick
      - Multiple exposures can be examined
      - Rare diseases and diseases with long latency can be studied
      - Accurate relative risk (risk ratio) estimation
      - Suitable when randomization is unethical
    answer: 3
    why:
      - An advantage.
      - An advantage.
      - An advantage, and the classic reason to choose case-control.
      - Case-control cannot estimate relative risk; the odds ratio is only an approximation of it.
      - An advantage (e.g. alcohol and pregnancy outcome).
    src: { page: 36, quote: "Advantages and disadvantages of case-control studies\n| Advantages | Disadvantages |\n|---|---|\n| Cheap, easy and quick studies | Subject to bias (selection, recall, misclassification) |\n| Multiple exposures can be examined | Direct incidence estimation is not possible |\n| Rare diseases and diseases with long latency can be studied | Temporal relationship is not clear |\n| Suitable when randomization is unethical (e.g., alcohol and pregnancy outcome) | Multiple outcomes cannot be studied |\n| | If the incidence of exposure is high, it is difficult to show the difference between cases and controls |\n| | Relative and attributable risk cannot be estimated |" }
    status: unverified
    tags: [book-question]
  - id: res.L05.030
    kind: card
    topic: cc-merits
    front: Give the lecture's example of when a case-control study suits because randomization is unethical.
    back: Alcohol and pregnancy outcome.
    src: { page: 36, quote: "Advantages and disadvantages of case-control studies\n| Advantages | Disadvantages |\n|---|---|\n| Cheap, easy and quick studies | Subject to bias (selection, recall, misclassification) |\n| Multiple exposures can be examined | Direct incidence estimation is not possible |\n| Rare diseases and diseases with long latency can be studied | Temporal relationship is not clear |\n| Suitable when randomization is unethical (e.g., alcohol and pregnancy outcome) | Multiple outcomes cannot be studied |\n| | If the incidence of exposure is high, it is difficult to show the difference between cases and controls |\n| | Relative and attributable risk cannot be estimated |" }
    status: unverified
  # --- Cohort design (slides 38-47) ---
  - id: res.L05.031
    kind: card
    topic: cohort
    front: Define a cohort study.
    back: >-
      A group exposed to a risk factor (study group) and a group not exposed (control group) are followed over
      time, and the occurrence of the problem is compared between them.
    src: { page: 38, quote: "Cohort studies:\n  In a COHORT STUDY, a group of individuals that is exposed to a risk factor (study group) is compared to a group of individuals not exposed to the risk factor (control group).\n  The researcher follows both groups over time and compares the occurrence of the problem that he expects to be related to the risk factor in the two groups to determine whether a greater proportion of those with the risk factor are indeed affected." }
    status: unverified
    tags: [high-yield]
  - id: res.L05.032
    kind: card
    topic: cohort
    front: What does "prospective" mean in timing?
    back: The study begins now and looks forward, following a condition or disease into the future.
    src: { page: 39, quote: "Timeframe of Studies: Prospective Study - looks forward, looks to the future, examines future events, follows a condition, concern or disease into the future (Study begins here, then time runs forward)" }
    status: unverified
  - id: res.L05.033
    kind: order
    topic: cohort
    prompt: Put the steps of a cohort study in order.
    steps:
      - Selection of study subjects
      - Obtaining data on exposure
      - Selection of a comparison group
      - Follow up
      - Analysis
    src: { page: 41, quote: "Steps of a cohort study:\n  1. Selection of study subjects\n  2. Obtaining data on exposure\n  3. Selection of a comparison group\n  4. Follow up\n  5. Analysis" }
    status: unverified
  - id: res.L05.034
    kind: card
    topic: cohort
    front: Heterogeneous versus homogeneous cohort, with the lecture's examples?
    back: >-
      Heterogeneous cohort: one group holds both exposed and unexposed, so comparison is internal (e.g. smoking).
      Homogeneous cohort: everyone is exposed, so comparison is with an external group (e.g. X-ray).
    src: { page: 42, quote: "Prospective Cohort, Selection of cohort:\n  Heterogeneous (internal comparison) e.g smoking\n  Homogeneous (external comparison) e.g X-ray" }
    status: unverified
  - id: res.L05.035
    kind: enumerate
    topic: cohort
    prompt: How is exposure data obtained in a cohort study?
    points: [Directly from cohort members, Review of records, Medical examination or special tests, Environmental surveys]
    pass: 3
    hook: "داتا الـ exposure في الـ cohort 4: «منهم، من الورق، من الكشف، ومن البيئة» = directly from members، records، medical examination أو special tests، environmental surveys."
    src: { page: 43, quote: "Obtaining data on exposure: To know whether they are exposed or not, and also the degree of exposure. Various methods used are:\n  Directly from cohort members\n  Review of records\n  Medical examination or special tests\n  Environmental surveys" }
    status: unverified
  - id: res.L05.036
    kind: enumerate
    topic: cohort
    prompt: Enumerate the methods of follow-up in a cohort study.
    points: [Periodic medical examination, Review of records, Routine surveillance of death records, "Mailed questionnaires, telephone calls, home visits"]
