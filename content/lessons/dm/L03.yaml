        quote: "Screening of diabetic retinopathy:\n  Initial fundus examination is recommended within 3 to 5 years of diagnosis of type 1 diabetes, and at the time of diagnosis in type 2 patients.\n  Subsequent examinations for both type 1 and type 2 diabetes should be repeated annually.\n  Eye examinations should occur before pregnancy or in the first trimester in patients with preexisting type 1 or type 2 diabetes, and then patients should be monitored every trimester and for 1 year postpartum as indicated by the degree of retinopathy."
        prompt: "ليه type 2 بنكشف عينه من يوم التشخيص، و type 1 نستنى 3–5 سنين؟"
        answer: |
          الـ **type 1** بيتشخّص بسرعة (acute)، فيوم التشخيص هو تقريبًا يوم بداية السكر، والـ retinopathy بتبدأ بعد **3–5 سنين**.

          الـ **type 2** بيكون موجود سنين من غير ما حد يعرف، فممكن العين تكون اتأذت قبل التشخيص (افتكر: **10–20%** عندهم complications وقت التشخيص في L01).
      - kind: explain
        page: 35
        title: "العلاج"
        quote: "Intravitreous injections of anti–vascular endothelial growth factor are indicated as first-line treatment for most eyes with diabetic macular edema"
        text: |
          - ظبّط **السكر** و**الضغط** و**الدهون** علشان تقلل الخطر وتبطّأ التدهور.
          - ==Panretinal laser== للـ **high-risk PDR** وأحيانًا الـ **severe non-proliferative diabetic retinopathy (NPDR)**.
          - "**Anti-VEGF** حقن في الـ vitreous: **بديل** معقول للـ laser في بعض الـ PDR، و ==first-line== لأغلب الـ **diabetic macular edema**."
          - الـ retinopathy **مش** contraindication للـ **aspirin**؛ ما بيزوّدش الـ retinal hemorrhage.

          ليه الـ laser بيشتغل؟ التفسير المقبول (مش في الكتاب): بيحرق أجزاء من الشبكية الطرفية الجعانة، فطلبها للأكسجين يقل، فالـ **VEGF** يقل والأوعية الجديدة تنكمش. والـ anti-VEGF بيوصل لنفس النتيجة بإنه يمسك الـ VEGF نفسه، وعشان كده بديل.
