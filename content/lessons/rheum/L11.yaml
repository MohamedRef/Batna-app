      - kind: explain
        page: 180
        title: "ليه كل مرض في بابه؟"
        quote: "T cell deficiencies\n  DiGeorge's syndrome (Thymic aplasia).\n  Chronic mucocutaneous candidiasis.\n  Hyper-IgM syndrome.\n  Interleukin-12 receptor deficiency."
        text: |
          الكتاب بيدّي الأسماء بس. التفسير المقبول (مش في الكتاب) لكل واحد:
          - **DiGeorge (thymic aplasia):** الـ ==thymus== هو مدرسة الـ T cells، فلو مش موجود مفيش T cells ناضجة
          - **Chronic mucocutaneous candidiasis:** الـ T cells هي اللي بتمسك الـ Candida على الجلد والأغشية، فلما تقع الفطر بيعشش هناك
          - **Hyper-IgM:** العيب في بروتين على الـ **T cell** (هتشوفه في ص 188)، علشان كده الكتاب حاطه تحت T مع إن النتيجة antibodies
          - **Interleukin-12 receptor deficiency:** الـ IL-12 بيشغّل الـ T cells تطلّع interferon-γ ضد البكتيريا اللي جوه الخلايا زي الـ mycobacteria
          - **Combined:** في ==SCID== الاتنين واقعين، وفي Wiskott-Aldrich و ataxia-telangiectasia الخلل بيمس الذراعين
      - kind: sort
        page: 180
        quote: "Combined T cell & B cell abnormalities\n  Severe Combined Immunodeficiency Disease (SCID).\n  Wiskott-Aldrich syndrome.\n  Ataxia-telangiectasia."
        prompt: "حط كل مرض في الباب بتاعه زي ما الكتاب قسمه:"
        bins: ["B cell", "T cell", "Combined", "Phagocyte"]
        cards:
          - { text: "X-linked agammaglobulinemia", bin: 0 }
          - { text: "Selective immunoglobulin A (IgA) deficiency", bin: 0 }
          - { text: "DiGeorge syndrome", bin: 1 }
          - { text: "Chronic mucocutaneous candidiasis", bin: 1 }
          - { text: "SCID", bin: 2 }
          - { text: "Wiskott-Aldrich syndrome", bin: 2 }
          - { text: "Ataxia-telangiectasia", bin: 2 }
          - { text: "Chronic granulomatous disease", bin: 3 }
          - { text: "Chédiak-Higashi syndrome", bin: 3 }
        why: "الـ XLA والـ IgA = B. الـ DiGeorge (thymic aplasia) والـ candidiasis = T. الـ SCID و Wiskott-Aldrich و ataxia-telangiectasia = combined. الـ CGD و Chédiak-Higashi = phagocytes."
      - kind: explain
        remind: [rheum.L11.003]
        page: 181
        title: "الـ complement والـ phagocytes"
        quote: "Complement Deficiencies\n  Hereditary angioneurotic edema.\n  Recurrent Infections.\n  Autoimmune-like diseases.\n  Paroxysmal nocturnal hemoglobinuria.\n5- Phagocyte deficiencies\n  Leukocyte adhesion deficiency.\n  Chronic Granulomatous Disease (CGD).\n  Chédiak-Higashi syndrome.\n  Job's syndrome (Hyper-IgE syndrome).\n  Cyclic neutropenia.\n  Myeloperoxidase deficiency.\n  Glucose-6-phosphate dehydrogenase deficiency.\n  Interferon-γ deficiency.\n6- Various / Unknown\n  Common Variable Immunodeficiency (CVID)."
        text: |
          **Complement deficiencies** بتطلع بأربع صور، والسبب (التفسير المقبول، مش في الكتاب):
          - ==Hereditary angioneurotic oedema==: الفرامل (C1 inhibitor) ناقصة
          - **Recurrent infections**: الـ complement بيغلّف البكتيريا عشان تتاكل، وآخره بيخرم جدارها
          - **Autoimmune-like disease**: أوله بينضّف الـ immune complexes، فلو ناقص بتتراكم زي الـ lupus
          - **Paroxysmal nocturnal haemoglobinuria**: كرات الدم الحمرا فاقدة البروتين اللي بيحميها من الـ complement

          **Phagocyte deficiencies** تمانية: LAD (الـ neutrophil مش قادر يلزق في جدار الوعاء ويخرج)، ==CGD== (مفيش respiratory burst يقتل)، Chédiak-Higashi، Job's (hyper-IgE)، cyclic neutropenia، myeloperoxidase، G6PD، و interferon-γ deficiency.

          والباب السادس **various/unknown** فيه **common variable immunodeficiency (CVID)**.
      - kind: check
        page: 180
        quote: "T cell deficiencies\n  DiGeorge's syndrome (Thymic aplasia).\n  Chronic mucocutaneous candidiasis.\n  Hyper-IgM syndrome.\n  Interleukin-12 receptor deficiency."
        question: "All are examples of T-cell primary immune deficiency in the book except:"
        options:
          - "X-linked agammaglobulinaemia"
          - "DiGeorge syndrome (thymic aplasia)"
          - "Chronic mucocutaneous candidiasis"
          - "Hyper-IgM syndrome"
        answer: 0
        why:
          - "صح: الـ XLA أول اسم تحت **B cell deficiencies**: مفيش B cells خالص، والـ T طبيعية."
          - "الـ DiGeorge = thymic aplasia، يعني مفيش مدرسة للـ T cells: T بالظبط."
          - "الـ Candida على الجلد والأغشية محتاجة T cells، والكتاب حاطها تحت T."
          - "فخ: النتيجة antibodies، بس الكتاب حاطه تحت T لأن العيب في بروتين على الـ T cell."
      - kind: explain
        remind: [rheum.L11.005]
        page: 181
        title: "الـ history: كل سؤال وراه سبب"
        quote: "Evaluation of Patients with Suspected Immuno-deficiencies\n  History.\n  Types of infections - location, frequency, and response to therapy.\n  Immunizations, especially live virus vaccines.\n  Family history.\n  Social and sexual history."
        text: |
          **History** في الكتاب أربع حاجات، وكل واحدة ليها سبب (التفسير المقبول، مش في الكتاب):
          - **Types of infections**: مكانها وتكرارها و ==response to therapy==. المكان والميكروب بيدلّوا على الذراع، والفشل مع المضاد الحيوي المناسب علامة إن الدفاع نفسه واقع
          - **Immunizations**، خصوصًا ==live virus vaccines==: عشان تعرف هل خد فيروس حي ممكن ينتشر فيه، وهل كوّن antibodies بعد التطعيم
          - **Family history**: أمراض كتير هنا وراثية، وبعضها X-linked، فولد خاله أو أخوه ممكن يكون مات صغير بنفس الصورة
          - **Social and sexual history**: عشان الـ HIV، أشهر سبب لنقص مناعة مكتسب، واللي باقي المحاضرة بتتكلم عنه
      - kind: explain
        remind: [rheum.L11.006]
        page: 181
        title: "الـ examination"
        quote: "Physical Examination.\n  Evaluation of lymphoid tissue.\n  Growth abnormalities.\n  Other congenital abnormalities.\n  Infections."
        text: |
          **Examination** أربع حاجات برضه:
          - **Lymphoid tissue** (لوز، غدد، thymus): عشان في نقص الـ T أو الـ B ممكن تبقى ==غايبة أو صغيرة== رغم الالتهاب
          - **Growth**: الطفل اللي عنده infection مزمنة بيفضل صغير على سنه (هتشوف "failure to thrive" في ص 182)
          - **Other congenital abnormalities**: لأن بعض المتلازمات بتمس أعضاء تانية مع المناعة. مثال مقبول (مش في الكتاب): الـ DiGeorge بييجي مع عيوب في القلب والـ parathyroid
          - **Infections**: مكانها وشكلها بيرجّعوك للذراع
      - kind: check
        page: 181
        quote: "Evaluation of Patients with Suspected Immuno-deficiencies\n  History.\n  Types of infections - location, frequency, and response to therapy.\n  Immunizations, especially live virus vaccines.\n  Family history.\n  Social and sexual history.\n  Physical Examination.\n  Evaluation of lymphoid tissue."
        question: "Evaluation of a patient with suspected immunodeficiency includes all of the following except:"
        options:
          - "Bone marrow aspiration"
          - "Types of infections: location, frequency and response to therapy"
          - "Immunizations, especially live virus vaccines"
          - "Examination of the lymphoid tissue"
        answer: 0
        why:
          - "صح: الـ bone marrow aspiration مش في قايمة الكتاب خالص. الـ evaluation history وكشف وتحاليل دم."
          - "أول بند في الـ history في الكتاب."
          - "الكتاب: immunizations، especially live virus vaccines."
          - "الكتاب: evaluation of lymphoid tissue جزء من الكشف."
      - kind: try
        items: [rheum.L11.001, rheum.L11.003, rheum.L11.005, rheum.L11.006, rheum.L11.086]
    recap:
      - "ستة أبواب: B، T، combined، complement، phagocyte، unknown (CVID). الكتاب حاطط hyper-IgM تحت T."
      - "Complement بيطلع بأربع صور: HAE، infections، autoimmune-like، PNH. والـ phagocytes تمانية."
      - "History: نوع الـ infection، التطعيمات الحية، العيلة، الـ social/sexual. Exam: lymphoid tissue، النمو، عيوب خلقية، الـ infections."
    practice: [rheum.L11.001, rheum.L11.002, rheum.L11.003, rheum.L11.004, rheum.L11.005, rheum.L11.006, rheum.L11.086, rheum.L11.087]
