    src: { page: 59, quote: "Hyperthyroidism\n  a) Proximal muscle weakness & atrophy.\n  b) Respiratory & even esophageal muscles may be occasionally affected causing dysphagia, dysphonia & aspiration Muscle stretch reflex are often brisk, bulbar.\n  c) Periodic paralysis.\n  d) Myasthenia Graves.\n  e) Progressive ocular myopathy & proptosis (Graves ophthalmopathy).\n  f) Serum CK is normal.\n  g) The muscle histology usually shows atrophy." }
