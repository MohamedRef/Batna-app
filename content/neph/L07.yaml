    topic: cystic-other
    front: Which genes cause most autosomal dominant tubulointerstitial kidney disease (ADTKD), and which is linked to hyperuricemia?
    back: MUC1, UMOD, REN and HNF1B. Hyperuricemia is a key feature of UMOD-related disease.
    src: { page: 166, quote: "Autosomal dominant tubulointerstitial kidney diseases (ADTKD) The term autosomal dominant tubulointerstitial kidney diseases (ADTKD) has been proposed for the set of disorders previously described as med-ullary cystic kidney disease, UMOD-related kidney disease, familial Disease-causing mutations in four genes: MUC1, UMOD, REN, and HNF1B, are responsible for most cases.19 Hyperuricemia is a key feature of UMOD-related disease." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.113
    kind: enumerate
    topic: cystic-other
    prompt: Mention the features of ADTKD (medullary cystic kidney disease).
    points:
      - Autosomal dominant, early adulthood, positive family history
      - Small cysts (1–10 mm) at the corticomedullary junction with interstitial scarring; glomeruli spared
      - Nocturia, polydipsia, polyuria (concentrating defect)
      - Bland dipstick, BP often normal (salt loss)
      - Small to normal kidneys on ultrasound
      - Hyperuricemia with or without gout
      - ESRD by about age 60; no specific therapy
    pass: 5
    hook: "ADTKD في 7: «AD وبدري في العيلة، أكياس صغيرة في النص والكبب سليمة، بول كتير، بول هادي وضغط عادي، كلى صغيرة، نقرس، وستين بلا علاج» = autosomal dominant في early adulthood مع family history؛ cysts 1–10 mm عند الـ corticomedullary junction مع interstitial scarring والـ glomeruli spared؛ nocturia وpolydipsia وpolyuria؛ bland dipstick والـ BP غالبًا طبيعي (salt loss)؛ كلى small to normal بالـ ultrasound؛ hyperuricemia ± gout؛ وESRD حوالي سن 60 ومفيش specific therapy."
    src: { page: 166, quote: "Autosomal dominant inheritance, presenting in early adulthood with pro- gressive renal impairment. The affected genes MCKD-1 and -2 encode key signalling proteins in the renal cilia. Small cysts (1-10mm) form at the corticomedullary junction, with associated tubulointerstitial inflammation and scarring (glomeruli are unaffected). Affected individuals have a positive family history and present with nocturia, polydipsia, and polyuria (impaired concentrating ability). Urine dipstick is usually bland and BP often normal (there may be relative salt loss) (see Table 7.7). Investigation shows small to normal-sized kidneys on USS. CT may demonstrate the cystic change. Impaired urate excretion and hyperuricaemia (± gout) may occur. Renal function usually declines to ESRD by age 60. No specific therapy available. Correction of salt and water depletion may be necessary." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.114
    kind: cloze
    topic: cystic-other
    text: "Uremia usually occurs after age {{c1::60}} in ADTKD-MUC1, while ADTKD-UMOD reaches ESRD between the {{c2::fourth and seventh}} decades."
    src: { page: 166, quote: "Uremia typically occurs after 60 years of age in ADTKD-MUC1 (MCKD1, MIM 174000), but disease progression is highly variable. In ADTKD-UMOD (MCKD2, MIM 603860), progression to ESRD occurs between the fourth and seventh decades of life." }
    status: unverified
    tags: [numbers]
  - id: neph.L07.115
    kind: card
    topic: cystic-other
    front: Is medullary sponge kidney genetic, and how is it usually found?
    back: No, it is a developmental anomaly with no family history. It is found incidentally or while investigating UTI or stones.
    src: { page: 167, quote: "A common, benign condition characterized by diffuse medullary cyst for- mation. It is a develop mental, rather than a genetic, anomaly. Clinically, there is no family history, and patients are usually identified either inci-dentally or when investigated for UTI or stones (see Table 7.7). Impaired calcium handling in the collecting ducts predisposes to formation of calcium-containing stones (often in cysts). Consider the diagnosis in young calcium-containing stones (often in cysts). Consider the diagnosis in young patients presenting with calcium stones. Haematuria (microscopic or gross) and recurrent UTIs may also complicate the disorder. Diagnosis is made on imaging; traditionally IVU (typical 'calyceal brush'), now CT. Renal impairment is very rare, and management should be directed at infection and prevention of stone formation." }
    status: unverified
