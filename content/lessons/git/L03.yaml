      - kind: explain
        page: 84
        quote: "Psychological stress can disrupt the gut-pain threshold and impair mucosal secretory and barrier functions, and this is associated with transmigration of bacterial cell products leading to GI pain and diarrhea, as with IBS."
        title: "الخوف بيعمل إيه في المصران؟"
        text: |
          الكتاب، من فوق لتحت:
          - المشاعر زي **fear**، **anger**، **anxiety**، والألم، والـ physical stress ممكن ==delay gastric emptying== و intestinal transit.
          - وكمان **stimulate colonic motor function**: transit أسرع، contractions أكتر، **defecation**، و diarrhea.
          - الـ psychological stress بيبوّظ الـ **gut-pain threshold** والـ **barrier**، فنواتج البكتيريا بتعدّي، فيحصل ألم و diarrhea زي الـ IBS.

          ومن تحت لفوق: الـ motility الزايدة والالتهاب والإصابة بيعلّوا الـ **ascending visceral pathways** وبيأثروا على المخ، فيزيد الألم ويساهم في **anxiety** و**depression**.

          التفسير المقبول (مش في الكتاب): ده بيفسر حاجة كلنا شفناها: الطالب اللي بيدخل الحمام قبل الامتحان. المعدة بتبطّأ (مفيش جوع، غثيان)، والقولون بيسرّع (عايز يدخل الحمام). نفس الآلية بالظبط، بس في مريض الـ FGID بتبقى أقوى وبتستمر.

          يعني نفس المريض ممكن يجيلك بإسهال قبل الامتحان وبإمساك في أسبوع هادي، لأن الاتجاه اللي فوق لتحت بيتغيّر مع حالته.
      - kind: explain
        page: 84
        quote: "In effect, the brain‘s pain control system can act as a filter to enhance or block pain by up-regulating or down-regulating the incoming neural signals affecting symptom perception through this gate control mechanism."
        title: "المخ فلتر للألم"
        text: |
          الكتاب: العلاقة بين الـ psychosocial distress والألم بتعدّي من ضعف قدرة شبكات المخ، زي الـ ==cingulate cortex==، إنها تعالج ألم الجسم.

          ونظام التحكم في الألم بيشتغل كـ **filter**: يا **up-regulate** فيعلّي الإشارة، يا **down-regulate** فيوطّيها، وده الـ ==gate control mechanism==.

          ص 85: الـ **down-regulation** (اللي بيعلّي الـ threshold) **مش بتحصل كويس** في الـ functional GI pain. والـ **anterior cingulate cortex** dysfunctional في الـ IBS، والـ fibromyalgia، وباقي الـ functional somatic symptoms.

          يعني ليه مريض الـ IBS ساعات عنده fibromyalgia أو صداع مزمن كمان؟ لأن نفس البوابة في المخ مفتوحة لكل إشارات الجسم، مش للمصران بس.
      - kind: aside
        remind: [git.L03.044]
        tone: analogy
        page: 85
        quote: "Conversely, improvement in pain control can be enabled by cognitive or emotional factors such as focused attention, hypnosis, psychological treatment, and certain antidepressants."
        text: |
          الـ **pain gate** زي زرار الصوت في الراديو. المخ الطبيعي بيوطّي صوت الإشارات اللي جاية من المصران (**down-regulation**)، فالـ threshold بيعلى.

          في الـ functional GI pain الزرار ده مش شغال كويس، والـ **anterior cingulate cortex** نفسه dysfunctional. ولما يبقى فيه psychosocial distress، البوابة بتتفتح والـ threshold بيقل.

          اللي بيرجّع الزرار: focused attention، hypnosis، psychological treatment، وبعض الـ antidepressants. ويمكن كمان بيعملوا **neurogenesis**، فأثرهم بيدوم.
      - kind: explain
        page: 85
        quote: "In sum, the clinical phenotype that we understand as FGIDs emerges from the interactions of multiple systems in the periphery (microbiome, altered mucosal inflammation, visceral hypersensitivity) and in the brain (brain network systems of emotional arousal, sensorimotor function, central autonomic function) interacting with each other in bidirectional ways that lead to the FGID phenotype."
        title: "الخلاصة: مفيش سبب واحد"
        text: |
          الكتاب بيلم الصورة: الـ FGID phenotype بيطلع من تفاعل أنظمة كتير:
          - في **الأطراف**: microbiome، **altered mucosal inflammation**، visceral hypersensitivity.
          - في **المخ**: شبكات الـ **emotional arousal**، والـ **sensorimotor function**، والـ **central autonomic function**.
          - وكلهم بيتفاعلوا ==bidirectional==.

          وكمان الكتاب: أثر العلاجات النفسية وبعض الـ antidepressants ممكن يكون أكتر من physiological، لأن فيه أدلة إنهم بيعملوا **neurogenesis**، فأثرهم يدوم أكتر.

          التفسير المقبول (مش في الكتاب): علشان كده مريضين بنفس التشخيص (IBS مثلًا) ممكن يحتاجوا علاج مختلف: واحد مشكلته الأكبر في الـ microbiome، والتاني في البوابة اللي في المخ. والسؤال في الـ history هو اللي يحدد أنهي ناحية تبدأ بيها.
