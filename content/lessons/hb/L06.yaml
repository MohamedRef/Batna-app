            <text x="180" y="356" class="t-sm t-mut">↕ two-headed = can</text>
            <text x="180" y="372" class="t-sm t-mut">go back with treatment</text>
            <text x="180" y="404" class="t-sm t-mut">→ one-way after</text>
            <text x="180" y="420" class="t-sm t-mut">cirrhosis</text>
            <text x="165" y="520" text-anchor="middle" class="t-sm t-b">Strongest risk factors for fibrosis,</text>
            <text x="165" y="538" text-anchor="middle" class="t-sm t-b">cirrhosis, HCC and death: T2DM + obesity</text>
          </svg>
      - kind: order
        page: 100
        prompt: "رتّب مسار الـ MASLD زي صورة الكتاب:"
        steps:
          - "Normal liver"
          - "Steatosis"
          - "MASH"
          - "Fibrosis"
          - "Cirrhosis"
          - "HCC"
        why: "الكتاب: steatosis → **MASH** → (activation of **hepatic stellate cells**) → fibrosis → cirrhosis → HCC."
      - kind: reveal
        page: 100
        prompt: "مين الخلية اللي بتنقل MASH لـ fibrosis؟ وفاكرها منين؟"
        answer: |
          **Hepatic stellate cells**: صاحبنا **أمين المخزن** من L01 اللي قاعد في Disse وبيخزّن vitamin A. لما يتنشط يبقى **مقاول** (myofibroblast) ويصب collagen.

          يعني نفس الآلية بتاعة أي cirrhosis، والـ MASH هو اللي بيدّيله أمر الشغل.
      - kind: explain
        page: 103
        title: "الفرخة ولا البيضة؟"
        text: |
          - العلاقة بين **MASLD و T2DM** **bidirectional** بقوة: epidemiology، clinical picture، diagnosis و pathomechanisms.
          - **أغلب الباحثين** شايفين إن **MASLD هي اللي بتظهر الأول** وتبدأ سلسلة الأحداث اللي توصل لـ T2DM.
          - **IR (insulin resistance) is the common root** للاتنين.
          - والأهم من مين جه الأول: **the right diagnosis and management at the right time**.
      - kind: aside
        tone: joke
        page: 103
        text: |
          الكتاب سأل «الفرخة ولا البيضة؟» وبعدين جاوب جواب مصري أصيل: **سيبك من مين جه الأول، اعمل الـ omelette** 🍳

          يعني شخّص الاتنين وعالجهم في الوقت الصح، وده اللي يفرق مع المريض.
      - kind: check
        page: 103
        question: "Which statement about MASLD and type 2 diabetes matches the lecture?"
        options:
          - "Insulin resistance is the common root of both"
          - "T2DM always comes first and MASLD follows"
          - "The relationship runs only from liver to pancreas"
          - "Treating one has no effect on the other"
        answer: 0
        why:
          - "صح: **IR is the common root of both MASLD and T2DM**."
          - "بالعكس: أغلب الباحثين شايفين إن **MASLD** هي اللي بتظهر الأول."
          - "العلاقة **bidirectional**، في الاتجاهين."
          - "الكتاب بيقول المهم التشخيص والعلاج الصح في الوقت الصح، لأنهم مرتبطين."
      - kind: try
        items: [hb.L06.014, hb.L06.015, hb.L06.017, hb.L06.019, hb.L06.021]
    recap:
      - "في T2DM: **do not trust liver enzymes**: NASH في حوالي **58%** رغم ALT واطي."
      - "Predictors للـ F3–F4: **GGT، waist، low HDL، FIB-4**."
      - "MASLD = **hepatic manifestation of metabolic syndrome**؛ أقوى risk factors: **T2DM + obesity**."
      - "Steatosis ⇄ MASH ⇄ fibrosis (بتتنشّط فيها **HSCs**) → cirrhosis → HCC، والـ MASH بيطلّع T2DM و CVD."
      - "MASLD و T2DM **bidirectional**، و **IR** هو الجذر المشترك."
    practice: [hb.L06.014, hb.L06.015, hb.L06.016, hb.L06.017, hb.L06.018, hb.L06.019, hb.L06.020, hb.L06.021, hb.L06.022, hb.L06.023, hb.L06.024, hb.L06.084, hb.L06.087]

