      - kind: update
        page: 57
        quote: "Alternative first-line treatment (Could include HLA-B58–positive subjects): Febuxostat\n  Initiate at 20 to 40 mg daily; Slowly escalate to 120 mg/d to reach target"
        text: "الكتاب حط الـ **febuxostat** بديل first-line، بس عليه **boxed warning** من الـ US Food and Drug Administration (FDA) سنة 2019: في عيان النقرس اللي عنده CVD معروف، الـ ==cardiovascular death== كان أعلى منه مع الـ allopurinol (الـ CARES trial). عشان كده بيتساب للي مايقدرش ياخد الـ allopurinol أو فشل معاه، وإرشادات النقرس بتاعة الـ American College of Rheumatology سنة 2020 بتقول لو فيه CVD حوّل لدوا تاني يخفّض الـ urate. في الامتحان اكتب جرعات الكتاب."
