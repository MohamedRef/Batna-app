    tags: [numbers]
  - id: git.L02.055
    kind: card
    topic: resection
    front: When is ESD endorsed rather than EMR?
    back: For lesions likely to have cancer invading the superficial submucosa, and lesions EMR cannot remove because of submucosal fibrosis or post-EMR recurrence.
    src: { page: 57, quote: "ESD is endorsed for lesions that have a high likelihood of cancer invading the superficial submucosa" }
    status: unverified
    tags: [high-yield]
  - id: git.L02.056
    kind: table
    topic: resection
    title: EMR versus ESD (book p57)
