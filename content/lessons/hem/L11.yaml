        hook: "SLiM CRAB: كابوريا رفيعة. أي واحدة من دول تكفي تسميها myeloma."
      - kind: explain
        page: 181
        quote: "Updated IMWG Criteria\n| MGUS | Smoldering Multiple Myeloma | Multiple Myeloma |\n| M protein < 3 g/dL | M protein ≥ 3 g/dL (serum) or ≥ 500 mg/24 hrs (urine) | Underlying plasma cell proliferative disorder |\n| Clonal plasma cells in BM < 10% | Clonal plasma cells in BM 10% to 60% | > 10% clonal plasma cells (for diagnosis) |\n| No myeloma defining events | No other myeloma defining events | AND 1 or more myeloma-defining events: ≥ 1 CRAB* feature; > 1 MRI focal lesion; Serum free light chain ratio ≥ 100; Clonal plasma cells in BM ≥ 60%† |"
        title: "ليه SLiM جنب الـ CRAB؟"
        text: |
          الـ **CRAB** بيقول إن الـ myeloma **أذى** عضو خلاص. أما الـ **SLiM** (plasma cells ≥ 60%، free light chain ratio ≥ 100، أكتر من lesion على الـ MRI) فبتتحسب myeloma ==regardless of other features==، حتى من غير أي أذى.

          ليه؟ التفسير المقبول (مش في الكتاب): دي علامات إن الـ clone **كبير لدرجة** إن الأذى جاي جاي وقريب. فبدل ما تستنى الكلية تقع أو العضم يتكسر عشان تبدأ علاج، بتعتبره myeloma من دلوقتي. يعني الـ CRAB بيقيس **الضرر**، والـ SLiM بيقيس **الخطر**.
      - kind: check
        page: 181
        quote: "Updated IMWG Criteria\n| MGUS | Smoldering Multiple Myeloma | Multiple Myeloma |\n| M protein < 3 g/dL | M protein ≥ 3 g/dL (serum) or ≥ 500 mg/24 hrs (urine) | Underlying plasma cell proliferative disorder |\n| Clonal plasma cells in BM < 10% | Clonal plasma cells in BM 10% to 60% | > 10% clonal plasma cells (for diagnosis) |\n| No myeloma defining events | No other myeloma defining events | AND 1 or more myeloma-defining events: ≥ 1 CRAB* feature; > 1 MRI focal lesion; Serum free light chain ratio ≥ 100; Clonal plasma cells in BM ≥ 60%† |"
        question: "Marrow shows 62% clonal plasma cells; CRAB features are all absent. This is:"
        options: ["Multiple myeloma", "Smoldering myeloma", "MGUS", "Plasma cell leukaemia"]
        answer: 0
        why:
          - "صح: ≥ 60% لوحدها myeloma-defining event، regardless of other features."
          - "الـ smoldering لحد 60% بس."
          - "الـ MGUS أقل من 10%."
          - "الـ plasma cell leukaemia (PCL) بيتعرف بالـ plasma cells في الدم مش النخاع."
      - kind: explain
        page: 181
        quote: "The presence of a stable monoclonal paraprotein in serum or less commonly in urine in the absence of clinicopathological evidence of multiple myeloma, Waldenstrom's macroglobulinaemia, amyloidosis or other lymphoproliferative disorder."
        title: "MGUS: الجار الهادي"
        text: |
          ==Monoclonal gammopathy of undetermined significance (MGUS)== (benign monoclonal gammopathy): paraprotein **stable** في السيرم (أقل في البول) من غير أي دليل على multiple myeloma (MM) أو Waldenström أو amyloidosis أو lymphoproliferative disorder.

          - شائع ومع السن بيزيد: **1%** فوق 50، **3%** فوق 70، **5%** فوق 80.
          - بيتحول لـ MM أو Waldenström macroglobulinaemia (WM) أو light-chain amyloidosis (AL) بمعدل **1% في السنة**.
          - مفيش أعراض ولا end-organ damage. **No treatment؛ long-term follow-up**.

          ليه follow-up طول العمر ومش علاج؟ لأن 1% في السنة **قليل** على علاج له أعراض، بس **تراكمي**: على 20 سنة ده رقم كبير. فبتراقبه عشان تمسك التحول بدري، من غير ما تأذي الـ 99% اللي مش هيتحولوا السنة دي.
      - kind: aside
        tone: joke
        page: 181
        quote: "Typically asymptomatic\n  No abnormal physical findings (end-organ damage)\n  No treatment; long term follow-up"
        text: "الـ MGUS زي الجار اللي ماشي بشنطة غريبة: مش هتبلّغ عنه، بس هتفضل باصص من الشباك كل سنة."
      - kind: explain
        page: 182
        quote: "Asymptomatic (Smoldering) myeloma\n  M-protein value of > 3 g/dL\n  > 10% bone marrow plasma cells\n  The natural history is that of MGUS rather than MM, i.e. no clinical evidence of progression or of complications associated with MM.\n  Chemotherapy is not indicated for these patients until there is evidence of clinical progression."
        title: "Smoldering"
        text: |
          الـ ==smoldering myeloma==: M protein **> 3 g/dL** و **> 10%** plasma cells، بس **من غير مضاعفات**.

          الـ natural history بتاعه ==زي الـ MGUS مش زي الـ MM==، علشان كده **chemotherapy is not indicated** إلا لما يبان **clinical progression**.

          المنطق: الأرقام أكبر من الـ MGUS، بس المهم هو **السلوك**. طالما ماشي هادي، الـ chemo هتديله أعراض جانبية من غير مكسب.
      - kind: sort
        page: 181
