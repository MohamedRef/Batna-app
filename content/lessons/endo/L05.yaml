        text: |
          الـ ==carcinoid== هو **most common NET** (1.5 لكل 100,000). أغلبه في الـ **appendix**، وبعدين small bowel، stomach، duodenum.

          - الاسم: شكله غير الـ adenocarcinoma وأقل عدوانية.
          - بيطلع من **enterochromaffin cells**: بتتصبغ بالـ potassium chromate، علامة إن فيها **serotonin**.
          - **Lung carcinoid**: في الخمسينات، recurrent pneumonia، cough، haemoptysis، وممكن Cushing's أو acromegaly، والـ syndrome أقل من 5%.
