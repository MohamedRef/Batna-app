        title: "Diuretics و Aliskiren و Vasodilators"
        text: |
          تكملة الجدول في ص 93:

          - **Bendroflumethiazide، chlortalidone:** **> 55**، black patients، heart failure، stroke secondary prevention. **احذر:** gout، diabetes، hypokalaemia.
          - **Furosemide:** heart failure، **renal dysfunction**. **احذر:** hypokalaemia.
          - **Aliskiren** (renin inhibitor): **resistant hypertension**. **احذر:** renal failure، pregnancy.
          - **Hydralazine، minoxidil، sodium nitroprusside:** black patients، heart failure (**مع nitrates**)، severe hypertension (**مع diuretic و beta-blocker**)، **hypertensive crisis**. **احذر:** SLE، pregnancy، والـ nitroprusside **محتاج intra-arterial BP monitoring** و**ما يطولش**.

          التفسير المقبول (مش في الكتاب):

          - الـ **thiazide** بيحبس uric acid (**فـ** gout) وبيعلّي السكر شوية، **عشان** كده الحذر.
          - الـ **furosemide** بيشتغل حتى لما الـ GFR يقل، والـ thiazide بيضعف، **يعني** هو اللي ينفع في الـ renal dysfunction.
          - الـ **hydralazine** ممكن يعمل **drug-induced lupus**، فالـ SLE حذر.
          - الـ **minoxidil** بيوسّع جامد فالقلب يدق أسرع والجسم يحبس مية، **فـ** لازم beta-blocker و diuretic معاه.
          - الـ **nitroprusside** قوي وسريع جدًا، فلازم قياس لحظي، وطول الاستخدام بيراكم **cyanide**.
