  - id: res.L06.011
    kind: enumerate
    topic: interventions
    prompt: In a randomized controlled trial (RCT) we control the exposure (intervention). Enumerate the three aspects we control.
    points: [Type, Amount, Duration]
    pass: 3
    hook: "في الـ RCT بتتحكم في 3: «نوع، كمية، ومدة» = Type، Amount، Duration."
    src: { page: 11, quote: "Randomized controlled trials: We are controlling the exposure (intervention) regarding:\n  Type\n  Amount\n  Duration" }
    status: unverified
  - id: res.L06.012
    kind: card
    topic: interventions
    front: Define a randomized controlled trial (RCT).
    back: >-
      An experiment in which subjects are randomly allocated into an experimental (intervention) group that receives a
      preventive or therapeutic intervention and a control group that receives placebo, no treatment or usual care;
      the outcomes of the groups are then compared.
    src: { page: 12, quote: "RCT is an experiment in which subjects in a population are randomly allocated into groups:\n  An experimental to receive preventative or therapeutic procedure or intervention (intervention group) and\n  A control to receive: placebo; no treatment; usual care (active control)\nand the outcomes are compared." }
    status: unverified
    tags: [high-yield]
  - id: res.L06.013
    kind: enumerate
    topic: interventions
    prompt: Enumerate what the control group of a randomized controlled trial (RCT) may receive.
    points: [Placebo, No treatment, Usual care (active control)]
    pass: 3
    hook: "الـcontrol في الـRCT بياخد واحدة من 3 «وهم، صفر، أو المعتاد»: placebo، no treatment، أو usual care (active control)."
    src: { page: 12, quote: "RCT is an experiment in which subjects in a population are randomly allocated into groups:\n  An experimental to receive preventative or therapeutic procedure or intervention (intervention group) and\n  A control to receive: placebo; no treatment; usual care (active control)\nand the outcomes are compared." }
    status: unverified
  - id: res.L06.014
    kind: mcq
    topic: interventions
    stem: >-
      In a trial of a new antihypertensive, the control group keeps taking amlodipine, the drug they would get in
      clinic anyway. What kind of control is this?
    options:
      - Placebo control
      - No-treatment control
      - Active control (usual care)
      - Historical control
    answer: 2
    why:
      - A placebo is an inactive look-alike; here the control gets a real drug.
      - The control group is treated, so it is not a no-treatment control.
      - Usual care given to the control group is an active control.
      - A historical control is a past group, not a concurrent randomised arm.
    src: { page: 12, quote: "RCT is an experiment in which subjects in a population are randomly allocated into groups:\n  An experimental to receive preventative or therapeutic procedure or intervention (intervention group) and\n  A control to receive: placebo; no treatment; usual care (active control)\nand the outcomes are compared." }
    status: unverified
  # ---------------- trial-types (slides 13-17) ----------------
  - id: res.L06.015
    kind: enumerate
    topic: trial-types
    prompt: Enumerate the four schemes used to classify randomized controlled trials (RCTs).
    points:
      - The aspects of the interventions being evaluated (therapeutic vs preventive)
      - How participants are exposed to the interventions (parallel, crossover, factorial, split-body, cluster)
      - Whether the goal is superiority or equivalence
      - Whether investigators and/or participants know which intervention is being studied (blinding)
    pass: 3
    hook: "الـ RCT بيتقسم بـ 4 أسئلة: «بنقيّم إيه؟ بيتعرضوا إزاي؟ عايزين أحسن ولا زي؟ وعارفين ولا لأ؟» = therapeutic vs preventive، parallel/crossover/factorial/split-body/cluster، superiority vs equivalence، blinding."
    src: { page: 13, quote: "Types of RCT's, classification schemes:\n  Based on the aspects of interventions being evaluated\n  Based on how participants are exposed to interventions\n  Based on whether goal is evaluation of superiority vs. equivalence\n  Based on whether investigators and/or participants know which intervention is being studied" }
    status: unverified
  - id: res.L06.016
    kind: card
    topic: trial-types
    front: Therapeutic (clinical) trial vs preventive trial?
    back: >-
      A therapeutic trial tests the efficacy of a therapeutic procedure (drug, surgical procedure). A preventive trial
      tests the efficacy of a preventive procedure (vaccine, sera, chemoprophylaxis, personal protective measure,
      exercise programme).
    src: { page: 14, quote: "Based on the aspects of interventions being evaluated: Type\n  Clinical (Therapeutic) Trial: Testing the efficacy of a therapeutic procedure (Drug, Surgical procedure etc.)\n  Preventive Trial: Testing the efficacy of a preventive procedure (Vaccine, Sera, Chemoprophylaxis, personal protective measure, exercise programme etc.)" }
    status: unverified
  - id: res.L06.017
    kind: mcq
    topic: trial-types
    stem: >-
      Schoolchildren in Alexandria are randomised to receive a new typhoid vaccine or a placebo injection, and typhoid
      cases are counted over two years. Which type of trial is this, by the aspect of the intervention?
    options:
      - Therapeutic (clinical) trial
      - Preventive trial
      - Crossover trial
      - Phase IV trial
    answer: 1
    why:
      - A therapeutic trial treats people who already have the disease.
      - A vaccine prevents disease in healthy people, so this is a preventive trial.
      - Crossover describes how groups switch treatments, not the aspect of the intervention; vaccines are generally unsuitable for crossover.
      - Phase IV is post-marketing surveillance of an approved drug.
    src: { page: 14, quote: "Based on the aspects of interventions being evaluated: Type\n  Clinical (Therapeutic) Trial: Testing the efficacy of a therapeutic procedure (Drug, Surgical procedure etc.)\n  Preventive Trial: Testing the efficacy of a preventive procedure (Vaccine, Sera, Chemoprophylaxis, personal protective measure, exercise programme etc.)" }
    status: unverified
  - id: res.L06.018
    kind: card
    topic: trial-types
    front: The lecture's examples of a therapeutic and a prevention trial?
    back: Therapeutic, the β-Blocker Heart Attack Trial (B-HAT, JAMA 1981). Prevention, the trial of perinatal transmission of human immunodeficiency virus (HIV) (NEJM 1994).
    src: { page: 15, quote: "Types of intervention studies. Example of a therapeutic trial: The β-Blocker Heart Attack Trial (B-HAT), life-table cumulative mortality curves for propranolol and placebo groups. The β-Blocker Heart Attack trial. JAMA, Nov. 6, 1981;246(18):2073" }
    status: unverified
  - id: res.L06.019
    kind: card
    topic: trial-types
    front: Define efficacy, as asked by a trial.
    back: Does the intervention work in the people who actually receive it? Efficacy trials tend to be explanatory, in highly selected participants, under "research" conditions.
    src: { page: 17, quote: "Efficacy versus effectiveness:\n  Efficacy: does the intervention work in the people who actually receive it? These trials tend to be explanatory in highly selected participants\n  Effectiveness: how does the intervention work in those offered. It tend to be pragmatic\n  Provide treatment under \"research\" vs. \"usual\" conditions" }
    status: unverified
    tags: [high-yield]
  - id: res.L06.020
    kind: card
    topic: trial-types
    front: Define effectiveness, as asked by a trial.
    back: How does the intervention work in those offered it? Effectiveness trials tend to be pragmatic, under "usual" conditions.
    src: { page: 17, quote: "Efficacy versus effectiveness:\n  Efficacy: does the intervention work in the people who actually receive it? These trials tend to be explanatory in highly selected participants\n  Effectiveness: how does the intervention work in those offered. It tend to be pragmatic\n  Provide treatment under \"research\" vs. \"usual\" conditions" }
    status: unverified
    tags: [high-yield]
  - id: res.L06.021
    kind: table
    topic: trial-types
    title: Efficacy vs effectiveness
    columns: [Feature, Efficacy, Effectiveness]
    rows:
      - [Question, "Does it work in those who actually receive it?", "How does it work in those offered it?"]
      - [Trial style, Explanatory, Pragmatic]
      - [Participants, Highly selected, Those offered it in practice]
      - [Conditions, '"Research" conditions', '"Usual" conditions']
    blanks: [[1, 1], [1, 2], [3, 2]]
    src: { page: 17, quote: "Efficacy versus effectiveness:\n  Efficacy: does the intervention work in the people who actually receive it? These trials tend to be explanatory in highly selected participants\n  Effectiveness: how does the intervention work in those offered. It tend to be pragmatic\n  Provide treatment under \"research\" vs. \"usual\" conditions" }
    status: unverified
  - id: res.L06.022
    kind: mcq
    topic: trial-types
    stem: >-
      A health-insurance hospital offers a new once-weekly diabetes injection to every eligible patient in its
      outpatient clinics, with no extra visits, and compares HbA1c with clinics that keep usual care. Which question
      does this trial answer?
    options:
      - Efficacy, because it is randomised
      - Effectiveness, because it tests the drug in those offered it under usual conditions
      - Efficacy, because HbA1c is an objective outcome
      - Equivalence, because both groups are treated
    answer: 1
    why:
      - Both efficacy and effectiveness trials can be randomised; randomisation does not decide which question is asked.
      - Offered to everyone under usual clinic conditions = a pragmatic effectiveness trial.
      - An objective outcome is good in any trial; it does not make the trial explanatory.
      - Equivalence is about the hypothesis (no difference), not about usual vs research conditions.
    src: { page: 17, quote: "Efficacy versus effectiveness:\n  Efficacy: does the intervention work in the people who actually receive it? These trials tend to be explanatory in highly selected participants\n  Effectiveness: how does the intervention work in those offered. It tend to be pragmatic\n  Provide treatment under \"research\" vs. \"usual\" conditions" }
    status: unverified
  # ---------------- superiority (slides 18-19, 26, 35) ----------------
  - id: res.L06.023
    kind: enumerate
    topic: superiority
    prompt: Enumerate the types of randomized controlled trial (RCT) according to what we want to test.
    points: [Superiority trials, Equivalence trials, Non-inferiority trials]
    pass: 3
    hook: "حسب اللي عايز تثبته 3: «أحسن، زيّه، ومش أوحش» = Superiority، Equivalence، Non-inferiority."
    src: { page: 18, quote: "Types of RCTs according to what do we want to test?\n  Superiority trials\n  Equivalence trials\n  Non inferiority trials" }
    status: unverified
  - id: res.L06.024
    kind: enumerate
    topic: superiority
    prompt: Why do an equivalence or non-inferiority trial? Enumerate the reasons.
    points:
      - Fewer side effects
      - Greater convenience
      - Lower cost
      - Higher quality of life
      - Fewer drug interactions
      - More choice for patients (flooding the market with identical drugs)
    pass: 4
    hook: "ليه دوا «مش أوحش من التاني»؟ 6: «أقل 2» (side effects، drug interactions) + «أحسن 4» (convenience، cost أقل، quality of life، واختيار أكتر للمرضى لما السوق يتملي أدوية شبه بعض). 2 + 4 = 6."
    src: { page: 19, quote: "Why do an equivalence or non inferiority trial?\n  Fewer side effects,\n  Greater convenience,\n  Lower cost,\n  Higher quality of life.\n  Fewer drug interaction\n  A means of flooding the market with identical drugs in order to give patients more choice." }
    status: unverified
  - id: res.L06.025
    kind: mcq
    topic: superiority
    stem: >-
      Antibiotic A is the established treatment for community-acquired pneumonia but is expensive with many side
      effects. New antibiotic B is cheaper with fewer side effects, but its efficacy relative to A is not established.
      What is the best kind of trial to evaluate B?
    options:
      - Superiority
      - Cross-over
      - Cluster
      - Non-inferiority
      - Equivalence
    answer: 3
    why:
      - B does not need to beat A; its advantages are cost and safety.
      - Pneumonia is acute, and crossover needs a chronic stable disease.
      - Cluster describes randomising groups, and it does not answer the question asked.
      - We only need to show B is not worse than A, given its lower cost and fewer side effects; this is the lecture's answer.
      - Equivalence asks whether B is neither better nor worse; the question here is one-sided (not worse).
    src: { page: 19, quote: "Why do an equivalence or non inferiority trial?\n  Fewer side effects,\n  Greater convenience,\n  Lower cost,\n  Higher quality of life.\n  Fewer drug interaction\n  A means of flooding the market with identical drugs in order to give patients more choice." }
    status: unverified
    tags: [high-yield, book-question]
  - id: res.L06.026
    kind: card
    topic: superiority
    front: What did the PIVOT trial (Thorax 2007), the lecture's example of an equivalence trial, compare and find?
    back: >-
      A multicentre pragmatic randomised equivalence trial in children admitted with community-acquired pneumonia:
      oral amoxicillin vs IV benzyl penicillin. They were equivalent (median time for temperature to settle 1.3 days in
      both groups).
    src: { page: 26, quote: "Example of equivalence trial: Comparison of oral amoxicillin and intravenous benzyl penicillin for community acquired pneumonia in children (PIVOT trial): a multicentre pragmatic randomised controlled equivalence trial. Thorax 2007;62:1102–1106.\n  Objective: To ascertain whether therapeutic equivalence exists for the treatment of paediatric community acquired pneumonia by the oral and intravenous (IV) routes.\n  Methods: A multicentre pragmatic randomised controlled non-blinded equivalence trial was undertaken in eight paediatric centres in England (district general and tertiary hospitals). Equivalence was defined as no more than a 20% difference between treatments of the proportion meeting the primary outcome measure at any time. 246 children who required admission to hospital and had fever, respiratory symptoms or signs and radiologically confirmed pneumonia were included in the study. The patients were randomised to receive oral amoxicillin for 7 days (n=126) or IV benzyl penicillin (n=120). Children in the IV group were changed to oral amoxicillin after a median of six IV doses and received 7 days of antibiotics in total. The predefined primary outcome measure was time for the temperature to be <38°C for 24 continuous hours and oxygen requirement to cease. Secondary outcomes were time in hospital, complications, duration of oxygen requirement and time to resolution of illness.\n  Results: Oral amoxicillin and IV benzyl penicillin were shown to be equivalent. Median time for temperature to settle was 1.3 days in both groups (p<0.001 for equivalence). Three children in the oral group were changed to IV antibiotics and seven children in the IV group were changed to different IV antibiotics. Median time to complete resolution of symptoms was 9 days in both groups.\n  Conclusion: Oral amoxicillin is effective for most children admitted to hospital with pneumonia (all but those with the most severe disease who were excluded from this study)." }
    status: unverified
  - id: res.L06.027
    kind: cloze
    topic: superiority
    text: >-
      A trial asking whether a new drug is better than the old one is a {{c1::superiority}} trial; one asking whether
      it is no worse is a {{c2::non-inferiority}} trial; one asking whether they are the same is an
      {{c3::equivalence}} trial.
    src: { page: 18, quote: "Types of RCTs according to what do we want to test?\n  Superiority trials\n  Equivalence trials\n  Non inferiority trials" }
    status: unverified
  # ---------------- allocation (slides 20-34) ----------------
  - id: res.L06.028
    kind: card
    topic: allocation
    front: Define the parallel-group design.
    back: Each participant is randomly assigned to a group, and all participants in that group receive (or do not receive) the intervention for the whole trial.
    src: { page: 20, quote: "Based on how participants are exposed to interventions: Parallel-group. Each participant is randomly assigned to a group, and all the participants in the group receives (or does not receive) an intervention" }
    status: unverified
  - id: res.L06.029
    kind: card
    topic: allocation
    front: Define a planned crossover trial.
    back: Subjects are randomised to therapy 1 or 2 and, after being observed for a period, they switch therapy. Subjects become their own controls.
    src: { page: 22, quote: "Crossover trials. There are 2 types:\nPlanned crossover trials:\n  subjects are randomised to therapy 1 or 2 and after being observed for a period they switch therapy.\n  Subject become their own controls\n  Useful as it allows 'constant' characteristics between the treatments\nRandomised: Group 1 starts on New Treatment and Group 2 on Current Treatment, then Group 1 switches to Current Treatment and Group 2 to New Treatment" }
    status: unverified
    tags: [high-yield]
  - id: res.L06.030
    kind: mcq
    topic: allocation
    stem: Subjects serve as their own controls in which of the following research designs?
    options:
      - Factorial design
      - Parallel design
      - Cross-over design
      - Randomized controlled trial
      - Case-control study
    answer: 2
    why:
      - Factorial tests two interventions at once in separate groups; nobody switches.
      - In a parallel design each person stays in one arm.
      - In crossover each subject gets both treatments in turn, so they are their own controls.
      - A randomized controlled trial (RCT) is the broad family; crossover is one RCT design, so this is not the best answer.
      - Cases and controls are different people.
    src: { page: 22, quote: "Crossover trials. There are 2 types:\nPlanned crossover trials:\n  subjects are randomised to therapy 1 or 2 and after being observed for a period they switch therapy.\n  Subject become their own controls\n  Useful as it allows 'constant' characteristics between the treatments\nRandomised: Group 1 starts on New Treatment and Group 2 on Current Treatment, then Group 1 switches to Current Treatment and Group 2 to New Treatment" }
    status: unverified
    tags: [book-question]
  - id: res.L06.031
    kind: card
    topic: allocation
    front: Give the lecture's example of an unplanned crossover.
    back: >-
      A trial of bypass surgery: some patients randomised to surgery refuse surgery and end up on medical treatment,
      and some randomised to medical treatment come to require surgery.
    src: { page: 23, quote: "Unplanned crossover in study of bypass surgery: Randomised to Surgery or Medical; some of the surgery group Refuse Surgery and end up Medical, some of the medical group Require surgery and end up Surgery" }
    status: unverified
  - id: res.L06.032
    kind: table
    topic: allocation
    title: Parallel vs crossover design, step by step
    columns: [Group, Parallel design, Crossover design]
    rows:
      - [Group 1, "Treatment A, then follow-up and outcome assessment", "Treatment A, washout, Treatment B, then follow-up"]
