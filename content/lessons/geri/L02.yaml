        text: "الحاج اللي معاه catheter وفجأة رفض الأكل وبقى عصبي: مش زعلان من الأكل، ومش زعلان منك. ده الـ **E. coli** اللي بيكلّمك من جوه."
      - kind: explain
        page: 37
        title: "الراجل الكبير والـ prostatitis"
        quote: "Prostatitis Infection of prostate Clinically: Frequency. Urgency. Urethral pain. Suprapubic and perineal pain. General malaise"
        text: |
          **التغييرات مع السن:** testosterone أقل، الخصيتين بيضمروا ويطروا، sperm أقل، seminal fluid أقل وأتقل، الـ erection محتاجة وقت أطول، والـ refractory period ممكن توصل ==أيام==.

