  - id: git.L11.lesson2
    title: "أول ساعة: GBS ومحاليل ودم"
    hook: "رقم واحد بيقولك المريض يروّح ولا يدخل، وحدّ واحد بيقولك تنقل دم ولا لأ."
    minutes: 9
    pages: [301, 309]
    topics: [risk, resuscitation]
    goals:
      - "تحسب الـ Glasgow-Blatchford score وتعرف معنى GBS ≤1"
      - "تعرف مين يدخل ICU"
      - "تختار المحلول وحدود نقل الدم"
    status: unverified
    steps:
      - kind: explain
        page: 301
        quote: "When the patient with acute bleeding can be discharged and followed up as an outpatient?"
        title: "خمس أسئلة لأي نزيف"
        text: |
          المحاضرة بتقولك اسأل نفسك في كل حالة:
          - أصنّف الـ ==severity== إزاي؟
          - الـ initial assessment على حسب الـ severity والنوع؟
          - إمتى يروّح ويتابع **outpatient**؟
          - إيه الـ **indications for admission**؟
          - يدخل فين: **ward** ولا **ICU**؟
      - kind: explain
        page: 302
        quote: "Patients with GBS ≤ 1 are at very low risk of rebleeding, mortality within 30 days, or needing hospital-based intervention"
        title: "Glasgow-Blatchford قبل المنظار"
        text: |
          الـ ==GBS== هو الـ score المنصوح بيه **pre-endoscopy**، وهو الأدق في التنبؤ بالحاجة لـ **hospital-based intervention** (نقل دم، endoscopic treatment، embolization، surgery) أو الوفاة.

          الرقم السحري: ==GBS ≤ 1== = **very low risk**، يروّح ويعمل المنظار **outpatient**.
      - kind: table
        page: 309
        quote: "Table 2: Glasgow-Blatchford score"
        title: "نقط الـ GBS (Table 2)"
        columns: ["Factor", "Range", "Points"]
        rows:
          - ["BUN (mg/dL)", "18.2-<22.4 / 22.4-<28 / 28-<70 / ≥70", "2 / 3 / 4 / 6"]
          - ["Hb men (g/dL)", "12-<13 / 10-<12 / <10", "1 / 3 / 6"]
          - ["Hb women (g/dL)", "10-<12 / <10", "1 / 6"]
          - ["Systolic BP", "100-109 / 90-99 / <90", "1 / 2 / 3"]
          - ["Heart rate", "≥100", "1"]
          - ["Melena", "present", "1"]
          - ["Syncope, hepatic disease, cardiac failure", "each present", "2 each"]
        hide: [[0, 2], [1, 2], [3, 2], [5, 2], [6, 2]]
      - kind: aside
        tone: tip
        page: 309
        quote: "Table 2: Glasgow-Blatchford score"
        text: |
          حيلة للحفظ: **4 أرقام + 4 أسئلة آه/لأ**.
          - الأرقام: **BUN**، **Hb**، **BP**، **pulse**. أعلى نقطة 6 بتاعة BUN ≥70 و Hb <10.
          - الآه/لأ: **melena = 1**، والتلاتة التانيين (**syncope**، **liver**، **heart failure**) = **2 لكل واحد**.

          الـ endoscopy مش جوه الـ score: علشان كده اسمه **pre-endoscopy**.
      - kind: case
        page: 309
        quote: "Table 2: Glasgow-Blatchford score"
        stem: "A 64-year-old man with known heart failure has melena. HR 108/min, SBP 96 mmHg, Hb 11 g/dL, BUN 30 mg/dL, no syncope."
        steps:
          - question: "Points for BUN 30 mg/dL?"
            options: ["4", "3", "6", "2"]
            answer: 0
            why: "28 لحد أقل من 70 = 4 نقط. الـ 6 محتاجة 70 أو أكتر."
          - question: "Points for Hb 11 g/dL in a man?"
            options: ["3", "1", "6", "0"]
            answer: 0
            why: "في الراجل 10 لأقل من 12 = 3. (في الست نفس الرقم = 1.)"
          - question: "Total GBS?"
            options: ["13", "11", "15", "9"]
            answer: 0
            why: "BUN 4 + Hb 3 + SBP 96 = 2 + HR 108 = 1 + melena 1 + cardiac failure 2 = 13."
          - question: "What does it mean?"
            options: ["Admit: well above the GBS ≤1 cut-off", "Discharge with outpatient endoscopy", "No endoscopy needed", "Only a repeat Hb tomorrow"]
            answer: 0
            why: "GBS ≤1 بس هو اللي يروّح. 13 = محتاج hospital-based care."
      - kind: explain
        page: 302
        quote: "shock, persistent hemodynamic derangement despite fluid resuscitation, serious comorbid medical illness, or evidence of advanced liver disease require admission to an ICU."
        title: "مين يدخل ICU؟"
        text: |
          - **Active bleeding**: hematemesis أو دم أحمر في الـ NG aspirate.
          - ==Shock==.
          - **Persistent hemodynamic derangement** رغم المحاليل.
          - **Serious comorbid illness**.
          - **Advanced liver disease**.
      - kind: explain
        page: 302
        quote: "either saline 0.9% sodium chloride or balanced crystalloids"
        title: "المحاليل والـ NG tube"
        text: |
          الـ ==early intensive resuscitation== بتقلل الـ mortality، تصلّح الـ hypovolemia، وتمنع الـ multiorgan failure.

          - المحلول: **crystalloids**، يا **0.9% saline** يا **balanced** زي **Ringer's lactate** (قلل الـ mortality والـ renal events في الـ critically ill).
          - الـ **NG tube** مش روتين. ممكن يفيد في triage حالات مختارة، ولو طلع دم أحمر أو **coffee grounds** يبقى المصدر upper.
      - kind: explain
        page: 303
        quote: "A restrictive red blood cell (RBC) transfusion strategy is considered standard of care in non- massive, acute UGIH both in variceal or nonvariceal."
        title: "نقل الدم: restrictive"
        text: |
          الـ ==restrictive strategy== هي الـ standard of care في النزيف الـ non-massive، variceal أو non-variceal، ومعاها **in-hospital mortality** أقل.

          - من غير قلب: انقل لو **Hb <7**، والهدف **7-9**.
          - مع **cardiovascular disease**: انقل لو **Hb <8**، والهدف **>10**.
          - في الدوالي (الدرس 4): خليه حوالي **8**.
      - kind: check
        page: 303
        quote: "in patients with cardiovascular diseases transfusion should start if Hg <8 gm targeting > 10 gm."
        question: "A 72-year-old with ischaemic heart disease, no longer bleeding, Hb 7.7 g/dL. Transfuse?"
        options:
          - "Yes: with cardiovascular disease the threshold is Hb <8"
          - "No: wait until Hb <7"
          - "No: transfuse only below 6"
          - "Yes, to a target of 14"
        answer: 0
        why:
          - "صح: مريض القلب بيتنقله لو أقل من 8، والهدف أكتر من 10."
          - "الـ 7 للي مالوش مرض قلب."
          - "الـ 6 مش موجود في المحاضرة."
          - "الهدف أكتر من 10، مش 14."
      - kind: try
        items: [git.L11.031, git.L11.033, git.L11.034, git.L11.043]
    recap:
      - "GBS قبل المنظار: 4 أرقام (BUN، Hb، BP، pulse) + melena 1 + syncope/liver/heart 2 لكل واحد."
      - "GBS ≤1 = very low risk، يروّح والمنظار outpatient."
      - "ICU: active bleeding، shock، hemodynamics مش بتتظبط، comorbidity خطيرة، advanced liver disease."
      - "Crystalloids (saline أو Ringer's). NG مش روتين. Restrictive: Hb <7 (هدف 7-9)، مع القلب <8 (هدف >10)."
    practice: [git.L11.029, git.L11.030, git.L11.031, git.L11.032, git.L11.033, git.L11.034, git.L11.035, git.L11.036, git.L11.037, git.L11.038, git.L11.039, git.L11.040, git.L11.041, git.L11.042, git.L11.043, git.L11.044, git.L11.102, git.L11.103, git.L11.104]
