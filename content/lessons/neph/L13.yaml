        why:
          - "صح: الكتاب بيقول الـ regression معناه إن الـ albuminuria مش لازم تبقى progressive."
          - "مش لازم غلط؛ الـ regression حاجة معروفة."
          - "الـ overt يعني proteinuria أكتر من 0.5 g/day، مش نزول."
          - "عكس كلام الكتاب."
