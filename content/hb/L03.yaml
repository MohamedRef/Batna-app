    stem: A 67-year-old woman with end-stage HCV liver disease, listed for transplant, bleeds from large fundal varices extending to the GE junction. MRI shows large ascites, a patent portal system, and a large splenorenal shunt with gastroesophageal varices. Which treatment has the highest potential to worsen her ascites and oesophageal varices?
