- id: hb.L09.033
  kind: cloze
  topic: diagnosis
  text: Ascitic total protein is low ({{c1::<1.5 g/dL}}) in cirrhosis and high ({{c2::>2.5 g/dL}}) in heart failure
    and malignant ascites.
