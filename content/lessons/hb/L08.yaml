      - kind: explain
        page: 135
        title: "أدوية الـ chronic cholestasis و الـ VBDS"
        text: |
          الـ ==VBDS== (vanishing bile duct syndrome) هو آخر مرحلة من الـ cholangiodestructive: القنوات الصغيرة بتختفي، فالـ cholestasis بيبقى chronic.

          الكتاب بيقسّم الأدوية 3 مجموعات:

          - **Antibiotics**: ampicillin، Augmentin، clindamycin، erythromycin، organic arsenicals، Septrin، tetracycline، thiabendazole، troleandomycin.
          - **Psychotropic**: amitriptyline، barbiturates، carbamazepine، chlorpromazine، haloperidol، imipramine، phenothiazines.
          - **Miscellaneous**: منهم azathioprine، terbinafine، cimetidine، ibuprofen، tolbutamide، chlorothiazide، ethinyl estradiol، وغيرهم.

          لو هتحفظ واحد من كل مجموعة: Augmentin، chlorpromazine، azathioprine.
