  - id: hb.L19.lesson2
    title: "حصوة كوليسترول ولا pigment؟"
    hook: "فلفل أسود ولا فول بالزيت؟ شكل الحصوة بيقولك جت منين."
    minutes: 7
    pages: [379, 380]
    topics: [stone-types, pathogenesis]
    goals:
      - "تفرّق بين الـ cholesterol والـ black والـ brown stones في التركيب والمكان والسبب"
      - "تشرح الـ supersaturation بالـ micelles"
    status: unverified
    steps:
      - kind: explain
        page: 379
        quote: "(ii) Pigment stones (brown/black)."
        title: "تلات أنواع وبس"
        text: |
          الكتاب بيقول فيه 3 أنواع:

          - ==Cholesterol stones==: الأغلبية، أكتر من 85%، خصوصًا في الـ Western world.
          - ==Pigment stones==: يا black يا brown.
          - ==Mixed stones==

          وكل نوع ليه قصة مختلفة: الـ cholesterol مشكلته في التوازن الكيميائي للـ bile، والـ black مشكلته bilirubin زيادة، والـ brown مشكلته infection وركود في الـ ducts.

          لو فهمت القصة، هتعرف تخمّن نوع الحصوة من العيان قبل ما تشوفها.
      - kind: figure
        page: 380
        quote: "Normally, water-insoluble cholesterol is made water-soluble by combining with bile salts and lecithin to form mixed micelles."
        title: "ميزان الـ cholesterol"
        alt: "A seesaw. On the left pan, cholesterol, which is water-insoluble. On the right pan, bile salts plus lecithin, which hold it in mixed micelles. When the left side gets heavier, from more cholesterol (obesity, diabetes) or fewer bile salts (cystic fibrosis) or less lecithin (a rare familial cholestasis), bile becomes supersaturated and crystals form."
        caption: "الـ cholesterol مش بيدوب في المية، والـ **bile salts + lecithin** بيشيلوه جوّه **mixed micelles**. أي حاجة تتقّل كفة الـ cholesterol = ==supersaturation==."
