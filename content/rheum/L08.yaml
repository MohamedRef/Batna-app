  - id: rheum.L08.114
    kind: card
    topic: pan
    front: Remission induction for non-severe active PAN?
    back: A non-GC immunosuppressive (e.g., methotrexate or azathioprine) with glucocorticoids, over GCs alone.
    src: { page: 144, quote: "Key recommendations for the treatment of polyarteritis nodosa (PAN)\nActive PAN, non-severe disease:\n  Recommended remission induction therapy: non-GC immunosuppressive agent (e.g., MTX or AZA) with GC over GC alone.\n  Clinical remission, yes: Remission maintenance: Non-GC immunosuppressive agent for 18 months; GC taper guided by patient clinical condition, values, and preferences.\n  Clinical remission, no: Consider other non-GC immunosuppressive agent* or CYC in patients with transition to severe PAN.\nActive PAN, severe disease:\n  Recommended remission induction therapy: High-dose oral or pulse IV GC with CYC over GC alone.\n  Clinical remission, yes: Remission maintenance: Non-GC, non-CYC immunosuppressive agent for 18 months; GC taper guided by patient clinical condition, values, and preferences.\n  Clinical remission, no: Consider other non-GC, immunosuppressive agent with GC*.\nAZA = azathioprine, CYC = cyclophosphamide, GC = glucocorticoids, IV = intravenous, MTX = methotrexate; * Not directly addressed in recommendations." }
    status: unverified
    tags: [high-yield]
