  - id: endo.L01.lesson2
    title: "الـ pituitary والـ gastrinoma في MEN 1"
    hook: "الـ pituitary غالبًا بيعمل prolactin، والـ gastrinoma مستخبي في الـ duodenum. والاتنين بيخدعوا."
    minutes: 8
    pages: [3, 5]
    topics: [men1-pituitary, men1-gep, gastrinoma]
    goals:
      - "تعرف نسب أنواع الـ pituitary tumors في MEN 1"
      - "تفهم ليه الـ entero-pancreatic tumors بقت أخطر حاجة"
      - "تعرف مكان وتشخيص وعلاج الـ gastrinoma"
    status: unverified
    steps:
      - kind: explain
        page: 3
        quote: "Anterior Pituitary tumors\n  Prevalence in MEN-1 ranges 15-60% in different series.\n  First clinical manifestation in up to 25% of cases.\n  Two-thirds are microadenomas (<1cm).\n  Prolactinomas 60%, somatotropinomas 20%, corticotrophinomas and null cell tumors 15%.\n  Female patient may complain from amenorrhea, galactorrhea, infertility, impotence in men; acromegaly or cushing's disease.\n  Monitor PRL, IGF-1.\n  CT/MRI.\n  Trans-sphenoidal resection of pituitary tumor."
        title: "Anterior pituitary tumors"
        text: |
          - موجودة في **15–60%** من مرضى multiple endocrine neoplasia (MEN) 1.
          - أول مظهر clinical في لحد **25%**.
          - ==Two-thirds microadenomas== (أقل من 1 cm).
      - kind: table
        page: 3
        quote: "Anterior Pituitary tumors\n  Prevalence in MEN-1 ranges 15-60% in different series.\n  First clinical manifestation in up to 25% of cases.\n  Two-thirds are microadenomas (<1cm).\n  Prolactinomas 60%, somatotropinomas 20%, corticotrophinomas and null cell tumors 15%.\n  Female patient may complain from amenorrhea, galactorrhea, infertility, impotence in men; acromegaly or cushing's disease.\n  Monitor PRL, IGF-1.\n  CT/MRI.\n  Trans-sphenoidal resection of pituitary tumor."
        title: "مين بيعمل إيه؟"
        columns: ["Tumour", "Share", "Picture"]
        rows:
          - ["Prolactinoma", "60%", "Amenorrhea, galactorrhea, infertility; impotence in men"]
          - ["Somatotropinoma", "20%", "Acromegaly"]
          - ["Corticotrophinoma + null cell", "15%", "Cushing's disease (corticotroph)"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 3
        quote: "Anterior Pituitary tumors\n  Prevalence in MEN-1 ranges 15-60% in different series.\n  First clinical manifestation in up to 25% of cases.\n  Two-thirds are microadenomas (<1cm).\n  Prolactinomas 60%, somatotropinomas 20%, corticotrophinomas and null cell tumors 15%.\n  Female patient may complain from amenorrhea, galactorrhea, infertility, impotence in men; acromegaly or cushing's disease.\n  Monitor PRL, IGF-1.\n  CT/MRI.\n  Trans-sphenoidal resection of pituitary tumor."
        title: "المتابعة"
        text: |
          - نتابع **prolactin (PRL)** و **IGF-1** (الـ IGF-1 مراية الـ growth hormone (GH)).
          - Imaging: **computed tomography (CT)/magnetic resonance imaging (MRI)**.
          - الجراحة: ==trans-sphenoidal resection==.
      - kind: explain
        page: 3
        quote: "Entero-pancreatic tumors\n  Prevalence ranges from 30-75%.\n  Multicentric lesions.\n  Micro/macroadenomas -> invasive malignencies-> metastaic carcinoma.\n  As a result of the effective treatment available for parathyroid & pituitary manifestations in MEN-1 the malignant potential of these entero-pancreatic lesions is now the primary life-threatening manifestation of the syndrome."
        title: "ليه البنكرياس بقى هو الخطر؟"
        text: |
          الـ ==entero-pancreatic tumors== موجودة في **30–75%**، و**multicentric**.

          بتمشي كده: micro/macroadenoma ← invasive malignancy ← metastatic carcinoma.

          زمان الناس كانت بتموت من الكالسيوم والـ pituitary. دلوقتي دول ليهم علاج كويس، فبقى الـ **malignant potential** بتاع البنكرياس هو **the primary life-threatening manifestation**.
      - kind: order
        page: 3
        quote: "Entero-pancreatic tumors\n  Prevalence ranges from 30-75%.\n  Multicentric lesions.\n  Micro/macroadenomas -> invasive malignencies-> metastaic carcinoma.\n  As a result of the effective treatment available for parathyroid & pituitary manifestations in MEN-1 the malignant potential of these entero-pancreatic lesions is now the primary life-threatening manifestation of the syndrome."
        prompt: "رتّب مسار الـ entero-pancreatic lesion:"
        steps: ["Micro/macroadenoma", "Invasive malignancy", "Metastatic carcinoma"]
      - kind: explain
        page: 4
        quote: "Gastrinoma\n  Most common – represent 50% of all entero-pancreatic tumors in MEN1 tend to be small & multiple lesions.\n  MEN1 gastrinomas mostly in duodenum, 50% metastasized at Diagnosis.\n  Poor prognosis with pancreatic (not duodenal); metastases & higher gastrin level.\n  Diagnosis including: hypergastrinemia, multiple peptic ulcers & high gastric acid output.\n  Imaging & Biochemical:– U/S, CT/MRI & portal venous sampling."
        title: "الـ gastrinoma"
        text: |
          - ==Most common==: نص الـ entero-pancreatic tumors في MEN 1 (**50%**).
          - **Small & multiple**، وأغلبها في الـ ==duodenum==.
          - **50%** عاملين metastasis وقت التشخيص.
          - **Poor prognosis** لو: pancreatic (مش duodenal)، metastases، gastrin أعلى.

          **التشخيص:** hypergastrinemia + multiple peptic ulcers + high gastric acid output. Imaging: ultrasound (US)، CT/MRI، و portal venous sampling.
      - kind: figure
        page: 4
        quote: "Surgical Treatment\n  For solitary sporadic gastrinoma - complete resection.\n  MEN1 gastrinomas freq mult/mets – controversial role of surgery.\n  Intraop US.\n  \"Gastrinoma triangle\" – pancreas/duodenum/CBD.\n  Duodenotomy.\n  Tumors head pancreas-enucleated.\n  Tumors body/tail pancreas – distal pancreatectomy +- splenectomy.\n  Liver mets- wedge resection."
        title: "الـ gastrinoma triangle"
        alt: "A triangle drawn over a sketch of the duodenal C-loop and pancreatic head. Its three corners are labelled common bile duct, duodenum and pancreas. Small dots inside the triangle mark multiple small gastrinomas in the duodenal wall."
        caption: "التلات زوايا: Pancreas، Duodenum، common bile duct (CBD). معظم الـ MEN 1 gastrinomas جوه المثلث ده، صغيرين ومتعددين في جدار الـ duodenum."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <path d="M60 40c-30 40-30 130 20 160c40 22 90 10 110-20" class="fg-box" stroke-width="18" fill="none"/>
            <path d="M120 130c40-10 120-20 180-5" class="fg-acc" stroke-width="22" fill="none"/>
            <path d="M120 30V110" class="fg-ink" stroke-width="6"/>
            <path d="M120 40L70 175L190 150Z" class="fg-thin"/>
            <circle cx="90" cy="132" r="5" class="fg-dot-bad"/>
            <circle cx="92" cy="158" r="4" class="fg-dot-bad"/>
            <circle cx="112" cy="160" r="4" class="fg-dot-bad"/>
            <text x="128" y="36" class="t-sm t-b">CBD</text>
            <text x="8" y="228" class="t-sm t-b">Duodenum</text>
            <text x="240" y="160" class="t-sm t-b">Pancreas</text>
            <text x="140" y="215" class="t-sm t-bad">small, multiple gastrinomas</text>
          </svg>
      - kind: check
        page: 4
        quote: "Gastrinoma\n  Most common – represent 50% of all entero-pancreatic tumors in MEN1 tend to be small & multiple lesions.\n  MEN1 gastrinomas mostly in duodenum, 50% metastasized at Diagnosis.\n  Poor prognosis with pancreatic (not duodenal); metastases & higher gastrin level.\n  Diagnosis including: hypergastrinemia, multiple peptic ulcers & high gastric acid output.\n  Imaging & Biochemical:– U/S, CT/MRI & portal venous sampling."
        question: "Which points to a POORER prognosis in MEN 1 gastrinoma?"
        options: ["Pancreatic site", "Duodenal site", "Small size", "Good response to PPI"]
        answer: 0
        why:
          - "صح: الـ pancreatic أوحش من الـ duodenal."
          - "الـ duodenal هو الأحسن."
          - "صغرهم طبيعي في MEN 1، مش عامل prognostic في الكتاب."
          - "الـ proton pump inhibitor (PPI) بيعالج الحمض، مش prognostic factor."
      - kind: table
        page: 4
        quote: "Surgical Treatment\n  For solitary sporadic gastrinoma - complete resection.\n  MEN1 gastrinomas freq mult/mets – controversial role of surgery.\n  Intraop US.\n  \"Gastrinoma triangle\" – pancreas/duodenum/CBD.\n  Duodenotomy.\n  Tumors head pancreas-enucleated.\n  Tumors body/tail pancreas – distal pancreatectomy +- splenectomy.\n  Liver mets- wedge resection."
        title: "علاج الـ gastrinoma"
        columns: ["Situation", "Treatment"]
        rows:
          - ["Medical", "PPI (omeprazole)"]
          - ["Solitary sporadic", "Complete resection"]
          - ["MEN 1 (multiple/mets)", "Surgery controversial"]
          - ["Duodenum", "Duodenotomy + intraop US"]
          - ["Head of pancreas", "Enucleation"]
          - ["Body/tail", "Distal pancreatectomy ± splenectomy"]
          - ["Liver mets", "Wedge resection"]
        hide: [[0, 1], [4, 1], [5, 1]]
      - kind: explain
        page: 5
        quote: "Metastatic Gastrinoma\n  25-90% of ZE patients.\n  ChemoRx – streptozocin & 5 FU.\n  Hepatic arterial chemoembolization.\n  Octreotide.\n  Interferon.\n  Aggressive debulking surgery."
        title: "الـ metastatic gastrinoma"
        text: |
          بيحصل في **25–90%** من مرضى الـ Zollinger–Ellison (ZE). العلاج:
          - Chemo: ==streptozocin & 5-FU==.
          - Hepatic arterial chemoembolization.
          - Octreotide و Interferon.
          - Aggressive debulking surgery.
      - kind: aside
        tone: joke
        page: 4
        quote: "Gastrinoma\n  Most common – represent 50% of all entero-pancreatic tumors in MEN1 tend to be small & multiple lesions.\n  MEN1 gastrinomas mostly in duodenum, 50% metastasized at Diagnosis.\n  Poor prognosis with pancreatic (not duodenal); metastases & higher gastrin level.\n  Diagnosis including: hypergastrinemia, multiple peptic ulcers & high gastric acid output.\n  Imaging & Biochemical:– U/S, CT/MRI & portal venous sampling."
        text: "الـ gastrinoma في MEN 1 زي العيال في الفرح: صغيرين، كتير، ومستخبيين في الـ duodenum. وتلاقي نصهم خرجوا برا القاعة (metastasized) قبل ما تاخد بالك."
      - kind: try
        items: [endo.L01.015, endo.L01.019, endo.L01.021, endo.L01.026, endo.L01.027]
    recap:
      - "Pituitary في MEN 1: 15–60%، ثلثين micro؛ prolactinoma 60%."
      - "Entero-pancreatic بقت أخطر مظهر (malignant potential)."
      - "Gastrinoma: 50%، duodenum، صغير ومتعدد، نصه metastatic."
      - "Gastrinoma triangle: pancreas, duodenum, CBD."
      - "Metastatic: streptozocin + 5-FU، chemoembolization، octreotide، interferon، debulking."
    practice: [endo.L01.014, endo.L01.015, endo.L01.016, endo.L01.017, endo.L01.018, endo.L01.019, endo.L01.020, endo.L01.021, endo.L01.022, endo.L01.023, endo.L01.024, endo.L01.025, endo.L01.026, endo.L01.027, endo.L01.028, endo.L01.029, endo.L01.085, endo.L01.086, endo.L01.087, endo.L01.088, endo.L01.099]
