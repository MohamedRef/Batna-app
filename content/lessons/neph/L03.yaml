        text: |
          خلي بالك: في Table 7 خانة **on dialysis** لـ ACE inhibitor (ACEI)/angiotensin II receptor blocker (ARB) و mineralocorticoid receptor antagonist (MRA) و SGLT2 inhibitor (SGLT2i) و angiotensin receptor–neprilysin inhibitor مكتوب فيها **أسماء trials** بس (CONSENSUS، RALES، DAPA-HF، PARADIGM-HF…)، ودي trials على عيانين **مش على dialysis**. احفظ الأسامي كـ evidence للدوا، مش كإثبات فايدة على الغسيل.
      - kind: explain
