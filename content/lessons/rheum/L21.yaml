  - id: rheum.L21.lesson4
    title: "الـ renal crisis والأمعاء والقلب"
    hook: "ضغط طالع فجأة + علامة كلى واحدة = طوارئ. وكل الأمعاء والقلب: عضلة اتحجّرت."
    minutes: 9
    pages: [348, 349]
    topics: [renal, gi-cardiac]
    goals:
      - "تعرّف الـ scleroderma renal crisis وتعرف ليه هو طوارئ"
      - "تحفظ الـ risk factors (SPAP)"
      - "تفسّر مشاكل الأمعاء والقلب بالـ fibrosis"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L21.023]
        page: 348
        title: "Scleroderma renal crisis: التعريف"
        quote: "Abruptly developing severe hypertension: – Rise in SBP by > 30 mmHg, DBP by > 20 mm Hg."
        text: |
          **Hypertension** مفاجئ وشديد:

          ==**Systolic blood pressure (SBP) rise > 30 mmHg**== و ==**diastolic blood pressure (DBP) rise > 20 mmHg**==

          **+ واحدة من دول:**
          - **Creatinine** زاد 50% عن الـ baseline، أو أكتر من 120% من الـ upper limit
          - **Proteinuria > 2+ on dipstick**
          - **Hematuria > 2+ on dipstick** أو **red blood cell (RBC) > 10/high-power field (HPF)**
          - **Thrombocytopenia < 100**
          - **Hemolysis**: schistocytes، low platelets، reticulocytes عالية

          ليه كل العلامات دي؟ لأن الأوعية الصغيرة في الكلى بتضيق فجأة: الضغط يعلى، الكلى تتأذي (creatinine، protein، دم)، والصفايح وكرات الدم تتكسّر في الأوعية المتأذية. الصورة في الخطوة الجاية.
      - kind: figure
        page: 348
        quote: "Can cause headache, encephalopathy, seizures, LV failure."
        title: "الـ renal crisis في صورة واحدة"
        alt: "Top box: abrupt severe hypertension, systolic rise over 30 and diastolic rise over 20 mmHg. Plus one of: creatinine up 50% or over 120% of upper limit, proteinuria over 2+, haematuria over 2+ or over 10 red cells per high-power field, platelets under 100, haemolysis. Bottom: effects headache, encephalopathy, seizures, left ventricular failure; and a warning that a crisis below 140/90 has a worse prognosis."
        caption: "**ضغط** طالع فجأة + **علامة كلى أو دم** واحدة. والـ ==normotensive crisis== أوحش، علشان كده الكرياتينين والـ dipstick أهم من رقم الضغط لوحده."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L21r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="10" y="10" width="310" height="56" rx="10" class="fg-bad"/>
