            <text x="320" y="170" text-anchor="end" class="t-sm t-good t-b">significant, risk down</text>
          </svg>
      - kind: explain
        page: 68
        quote: "Relative Risk (95% CI):\n  Vegetable Fiber: Insignificant, less precised (0.9-1.4)\n  Fruit Fiber: Insignificant, less precised (0.8-1.2)\n  Cereal Fiber: Significant and precise (0.6-0.7)"
        title: "عرض الـ CI = الدقة"
        text: |
          مثال الألياف:
          - **Vegetable fibre** 0.9-1.4، و **fruit fibre** 0.8-1.2: بيعدّوا الـ 1 وعريضين، يعني **insignificant and less precise**.
          - **Cereal fibre** 0.6-0.7: ضيّق وتحت الـ 1، يعني ==significant and precise==.

          وكل ما الـ sample size يكبر، الـ CI **يضيق** (precision أعلى).
      - kind: check
        page: 66
        quote: "P-values (Hypothesis Testing) in DVT study:\n  Confidence interval of Relative risk = 0.12 - 0.18 (P=0.001)\n  Confidence interval does not include 1: statistically significant\n  If the confidence interval is 0.12 - 1.5 (includes 1) this is not statistically significant (P=0.6)"
        question: "In the deep vein thrombosis (DVT) study, the relative risk has a 95% confidence interval of 0.12-1.5. What do you conclude?"
        options:
          - "Not statistically significant, because the interval includes 1"
          - "Significant, because the point estimate is below 1"
          - "Significant, because 0.12 is far from 1"
          - "The drug doubles the risk of DVT"
        answer: 0
        why:
          - "صح: الـ CI فيه الـ 1، يعني ممكن مفيش أثر خالص (p = 0.6 في المحاضرة)."
          - "الـ point estimate لوحده مش كفاية؛ المهم الـ CI عدّى الـ 1 ولا لأ."
          - "طرف واحد بعيد مش كفاية؛ الطرف التاني عدّى الـ 1."
          - "الـ CI بيروح من حماية لزيادة بسيطة، مفيش حاجة بتقول ضعف."
      - kind: explain
        page: 69
        quote: "Intention-to-treat analysis: all study participants are included in the analyses as part of the groups to which they were randomized regardless of whether they completed the study or not\nPer protocol analysis: excludes patients who deviate from protocol"
        title: "Intention to treat ضد per protocol"
        text: |
          - ==Intention-to-treat (ITT)==: **كل** اللي اتقرعوا بيتحلّلوا في **الجروب اللي اتقرعوا فيه**، سواء كمّلوا أو التزموا أو لأ.
          - ==Per protocol==: بيشيل اللي **خالفوا الـ protocol**.

          يعني في الـ ITT: all participants are analysed as **randomized**.

          الـ ITT هو **optimal estimate of the true benefit**، بس ==not optimal for measuring harm== (لأن اللي ماخدش الدوا مش هيبان عليه الـ side effect).
      - kind: case
        page: 71
        quote: "Per protocol analysis of the treatment group (surgery + acetylsalicylic acid [ASA]) includes only those patients who adhered to the protocol (in this case, those who received surgery); \"nonadherent\" patients (those who died before having the opportunity to undergo surgery) are excluded.\nWith this analysis, the event rate is 0.11 in the surgery + ASA arm and 0.20 in the control arm, which represents a relative risk reduction (RRR) of 0.45.\nThe intention-to-treat analysis, which counts all events in all randomized patients, shows equal event rates (0.20) in both arms and no risk reduction. This analysis suggests the underlying truth, a treatment effect of zero."
        stem: "100 عيان cerebrovascular disease اتقرعوا على surgery + aspirin، و 100 على aspirin بس. في جروب العملية، 10 جالهم stroke قبل ما يلحقوا يعملوا العملية، ومن الـ 90 اللي اتعملّهم 10 جالهم stroke. في جروب الـ aspirin، 20 جالهم stroke."
        steps:
          - question: "Per-protocol stroke rate in the surgery arm?"
            options: ["10/90 = 0.11", "20/100 = 0.20", "10/100 = 0.10", "20/90 = 0.22"]
            answer: 0
            why: "الـ per protocol بيشيل اللي ماتعملّهمش العملية، فالـ 10 اللي جالهم stroke بدري اختفوا من البسط والمقام."
          - question: "What does each analysis show, as relative risk reduction (RRR)?"
            options: ["Per protocol RRR 0.45; ITT RRR 0", "Both RRR 0.45", "Per protocol 0; ITT 0.45", "Both no effect"]
            answer: 0
            why: "Per protocol: 0.11 ضد 0.20، RRR 0.45. ITT: 20/100 ضد 20/100، RRR صفر."
          - question: "Which one shows the underlying truth?"
            options: ["Intention to treat", "Per protocol"]
            answer: 0
            why: "الـ ITT بيقول الأثر الحقيقي صفر. الـ per protocol خلّى العملية تبان كويسة لأنه شال أسوأ العيانين (Montori, Canadian Medical Association Journal (CMAJ) 2001)."
      - kind: aside
        tone: analogy
        page: 75
        quote: "Noncompliance, Example: Trial of cancer-prevention diet vs placebo diet.\n  Treatment Group: some subjects had GI symptoms (these were actually precursors of the cancer), they did not comply with the diet\n  If these non compliant people were excluded from the analysis → Greater effect of the cancer-prevention diet"
        text: |
          مثال الـ diet: تجربة **cancer-prevention diet** ضد placebo diet. ناس في جروب الـ diet جالهم أعراض gastrointestinal (GI) ووقفوا الـ diet، والأعراض دي كانت **أول علامات الـ cancer**.

          لو عملتلهم exclude من الـ analysis لأنهم مش compliant، شلت الـ cancers من جروب الـ diet، فالـ diet هيبان **أقوى من الحقيقة**. زي مدرس يقول «فصلي كله نجح» بعد ما طرد الضعاف قبل الامتحان.
      - kind: check
        page: 78
        quote: "Which of the followings is CORRECT about Intention to treat?\n  a. Analysis is according to whether they comply with treatment or not\n  b. Optimal estimate of the true harm of the intervention\n  c. Performing the analysis of RCTs according to original randomised assignment\n  d. Not optimal for measuring benefit of the intervention"
        question: "Which is CORRECT about intention to treat?"
        options:
          - "Analysis depends on whether patients complied"
          - "It is the optimal estimate of the true harm"
          - "Analysis follows the original randomised assignment"
          - "It is not optimal for measuring benefit"
        answer: 2
        why:
          - "الـ ITT بيتجاهل الـ compliance."
          - "هو أحسن تقدير للـ benefit، مش للـ harm."
          - "صح: حلّل زي ما قرعت."
          - "بالعكس، هو الـ optimal للـ benefit."
      - kind: aside
        tone: trap
        page: 77
        quote: "Excessive exclusion criteria may result in which of the following:\n  a. Decreased external validity\n  b. Increased internal validity\n  c. Problems with recruitment\n  d. Increased costs\n  e. All of the above\nAnswer: a"
        text: |
          شريحة 77: «excessive exclusion criteria بتعمل إيه؟» والاختيارات فيها recruitment problems وزيادة costs و all of the above. **إجابة الشريحة: a، decreased external validity.**

          منطقيًا «all» قابلة للنقاش، بس الامتحان بياخد إجابة الشريحة. افتكر: exclusion كتير = عيّنة مش شبه عيانينك = **external validity** أقل.
