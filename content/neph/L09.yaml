    front: What is a semipermeable membrane?
    back: A membrane that lets small molecules pass but stops large ones.
    src: { page: 297, quote: "Important definitions Semipermeable membrane: allows the passage of small molecules while preventing that of large molecules. Diffusion solute transfer across the membrane down a concentration gradient from blood to dialysate. Diffusion provides efficient clearance of low-molecular-weight solutes (< 500-1,500 Daltons)." }
