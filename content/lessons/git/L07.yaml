          </svg>
      - kind: table
        page: 225
        quote: "It accounts for 22-30% of GIT bleeding. Lower tract bleeding is one-third as common as upper gastrointestinal hemorrhage and tends to have a more benign course.80% to 85% of lower GI bleeds originate distal to the ileocaecal valve, with only 0.7% to 9% originating from the small intestine."
        title: "أرقام الـ LGIB"
        columns: [Fact, Number]
        rows:
          - ["Share of all GI bleeding", "22–30%"]
          - ["Compared with UGIB", "One-third as common, more benign"]
          - ["Distal to the ileocecal valve", "80–85%"]
          - ["From the small intestine", "0.7–9%"]
          - ["Stop by themselves", "80%"]
          - ["Recur", "25%"]
        hide: [[0, 1], [2, 1], [4, 1], [5, 1]]
      - kind: check
        page: 225
        quote: "It is bleeding below the ligament of Treitz. Normal fecal blood loss 1.2 ml/day. It is significant if the loss >10 ml/day."
        question: "Which statement about lower GI bleeding fits the book?"
        options:
          - "It is bleeding below the ligament of Treitz; a loss above 10 ml/day is significant"
          - "It is bleeding below the ileocecal valve only"
          - "Any fecal blood loss above 1.2 ml/day is significant"
          - "Most lower GI bleeds come from the small intestine"
        answer: 0
        why:
          - "صح: الحد هو الـ ligament of Treitz، والـ significant فوق 10 ml/day."
          - "الـ ileocecal valve ده المكان اللي 80–85% من النزيف بيبقى بعده، مش الحد نفسه."
          - "الـ 1.2 ml/day ده الطبيعي اللي بيضيع كل يوم من غير ما تاخد بالك."
          - "الـ small intestine بتطلّع 0.7–9% بس."
      - kind: aside
        tone: tip
        page: 225
        quote: "80% resolve spontaneously and 25% will recur. The incidence rises steeply with increasing the age."
        text: |
          افتكر **80 / 80 / 25**: الـ **80%** تحت الـ ileocecal valve، و **80%** بيقفوا لوحدهم، و **25%** بيرجعوا.

          والـ incidence بتزيد **جامد مع السن**، علشان كده أغلب حالاتك هتبقى كبار.

          وليه بتزيد مع السن؟ التفسير المقبول (مش في الكتاب): أشهر سببين في الكتاب، الـ **diverticulosis** والـ **angiodysplasia**، الاتنين بيكتروا كل ما الواحد يكبر، والكبار كمان أكتر ناس بياخدوا **antiplatelets** و **anticoagulants**.
      - kind: explain
        page: 225
        title: "الفخ الكبير: دم من تحت بس جاي من فوق"
        quote: "These patients usually present with brisk bleeding, melena, or bright red blood per rectum. Hematochezia associated with hemodynamic instability should lead to consideration of a brisk UGIB source, especially in at-risk patients such as those with a history of peptic ulcer disease or liver disease with portal hypertension and those using antiplatelet or anticoagulant medications."
        text: |
          لو العيان عنده **hematochezia** ومعاها ==hemodynamic instability==، فكّر في **brisk upper gastrointestinal bleeding (UGIB)**، خصوصًا مع:
          - **peptic ulcer disease**
          - **liver disease with portal hypertension**
          - **antiplatelets أو anticoagulants**

          وكمان **blood urea nitrogen (BUN)/creatinine >30** بيشاور على فوق. أما **red blood and clots** فبعيد إنها تكون من فوق.

          ليه الـ instability بالذات تخليك تبص فوق؟ التفسير المقبول (مش في الكتاب): النزيف العلوي لازم يبقى **غزير وسريع جدًا** علشان الدم يعدّي الأمعاء كلها ويطلع لسه أحمر، والغزارة دي نفسها هي اللي بتوقّع الضغط. والتلات فئات اللي في القايمة هم أكتر ناس عندهم مصدر علوي بينزف جامد: قرحة، varices، أو دم مش بيتجلط.
      - kind: reveal
        page: 225
        quote: "An elevated blood urea nitrogen to creatinine ratio (> 30) also suggests an UGIB"
        prompt: "ليه الـ BUN بيعلى لوحده في نزيف المعدة ومش في نزيف القولون؟"
        answer: |
          الدم اللي بينزل في الـ upper GI بيتهضم ويتمص كـ **protein** في الـ small bowel، فالكبد يحوّله **urea** والـ BUN يعلى، والـ creatinine ثابت.

          دم القولون مش بيعدّي على الـ small bowel، فمش بيتمص. علشان كده الكتاب بيقول **BUN/Cr >30** يشاور على **UGIB**. (ده تفسير فسيولوجي، الرقم من الكتاب.)
      - kind: check
        page: 225
        quote: "These patients usually present with brisk bleeding, melena, or bright red blood per rectum. Hematochezia associated with hemodynamic instability should lead to consideration of a brisk UGIB source, especially in at-risk patients such as those with a history of peptic ulcer disease or liver disease with portal hypertension and those using antiplatelet or anticoagulant medications."
        question: "Cirrhotic man, maroon clots per rectum, BP 85/50, BUN/Cr 42. First endoscopy?"
        options:
          - "Upper endoscopy"
          - "Colonoscopy"
          - "Capsule endoscopy"
          - "Sigmoidoscopy only"
        answer: 0
        why:
          - "صح: instability + portal hypertension + BUN/Cr >30 = استبعد المصدر العلوي الأول."
          - "الـ colonoscopy بعد ما تستبعد فوق."
          - "الـ capsule للـ small bowel بعد ما فوق وتحت يبقوا negative."
          - "الـ sigmoidoscopy مش هتشوف مصدر علوي."
      - kind: explain
        page: 226
        title: "ليه الـ clots الحمرا بتبعدك عن فوق؟"
        quote: "source whereas red blood and clots are unlikely to be from an upper gastrointestinal source."
        text: |
          الكتاب بيكمّل في أول ص 226: ==red blood and clots== بعيد إنهم يكونوا من **upper gastrointestinal source**.

          التفسير المقبول (مش في الكتاب): الدم اللي بينزل في المعدة بيقابل الـ **acid** فيسودّ، وبيتهضم وهو ماشي مسافة طويلة، فنادرًا ما يوصل لتحت لسه clots حمرا. عشان كده:
          - **clots حمرا والعيان stable** ← دوّر تحت.
          - **دم أحمر مع instability** ← لسه لازم تستبعد فوق (الفخ اللي فات).

          يعني اللون لوحده مش كفاية: اقراه مع النبض والضغط والـ BUN.
      - kind: try
        items: [git.L07.002, git.L07.005, git.L07.006, git.L07.009, git.L07.010]
    recap:
      - "LGIB = تحت الـ ligament of Treitz. الطبيعي 1.2 ml/day، significant فوق 10."
