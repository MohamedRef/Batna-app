      - kind: explain
        page: 66
        quote: "Correction of underlying causes:"
        title: "قبل الغسيل: ابدأ بالأسباب"
        text: |
          رسمة ص 66 (in pre-dialysis CKD): ابدأ المتابعة في **CKD G3a** في الكبار (و G2 في الأطفال). الـ PTH المثالي **مش معروف**، فلو عالي أو بيزيد دوّر على **modifiable factors**. **Correction of underlying causes**: ==hyperphosphatemia==، **hypocalcemia**، و ==vitamin D deficiency==. **Avoid hypercalcemia**. والـ phosphate العالي: restriction و binders. وتجنّب الـ calcitriol والـ VDRAs **إلا في G4–5** مع PTH بيزيد باستمرار.

          التفسير المقبول (مش في الكتاب): الـ PTH بيعلى **كرد فعل** على phosphate عالي وكالسيوم واطي و vitamin D قليل. لو صلّحت الأسباب، الـ PTH بينزل لوحده. أما الـ calcitriol بدري فبيعلّي الكالسيوم والـ phosphate ويكلّس الشرايين، وده نفس السبب اللي خلّى الكتاب يقول avoid hypercalcemia.
      - kind: figure
        page: 66
        quote: "In pre-dialysis CKD"
        title: "الـ CKD-MBD قبل الغسيل: رسمة الكتاب"
        image: { file: neph/L02-predialysis-mbd.webp, book: true }
        alt: "Book tree 'In pre-dialysis CKD' with four columns: start monitoring for CKD-MBD (CKD G3a in adults, CKD G2 in children, treatment based on trends); PTH (optimal level unknown; if high or rising look for modifiable factors including vitamin D deficiency; avoid calcitriol and VDRAs except in CKD G4-5 with progressive rise); calcium (avoid hypercalcemia, evaluate with phosphate); phosphate (lower elevated levels, phosphate restriction, phosphate binders). Below, 'High PTH' splits into: low calcium and low to normal phosphorus, calcitriol or VDRAs; normal calcium and high phosphorus, calcimimetics; no response to treatment, parathyroidectomy; with a note: discontinue if PTH falls below 100-150 pg/mL."
        caption: |
          **فوق: In pre-dialysis CKD**، و4 أعمدة:

          - **Start monitoring**: من **G3a** في الكبار (G2 في الأطفال)، والعلاج حسب ==الـ trends مش رقم واحد==.
          - **PTH**: الرقم المثالي **مش معروف**؛ لو عالي أو بيزيد دوّر على أسباب تتصلّح (زي **vitamin D deficiency**)، و==ماتديش calcitriol== إلا في G4–G5 مع ارتفاع مستمر.
          - **Calcium**: **Avoid hypercalcemia**.
          - **Phosphate**: نزّل العالي: **restriction** وبعدين **phosphate binders**.

          **تحت: High PTH** و3 فروع:
          - Ca واطي و phosphate طبيعي/واطي ← **Calcitriol or VDRAs** (vitamin D receptor activators)، ووقّف لو الـ PTH نزل تحت **100–150 pg/mL**.
          - Ca طبيعي و phosphate عالي ← **Calcimimetics**.
          - **No response** ← **Parathyroidectomy**.

          الشجرة بتختصر قاعدة الدرس: صلّح الأسباب الأول، وبعدين اختار الدوا حسب ==الـ Ca والـ phosphate== مع الـ PTH.
