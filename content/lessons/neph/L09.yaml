      - kind: explain
        page: 336
        title: "ليه السرطانات دي بالذات؟"
        quote: "Kaposi s sarcoma (KS)"
        text: |
          الجدول: ==Kaposi's sarcoma 400–500 ضعف==، vulva و anus 100، hepatobiliary 30، non-Hodgkin lymphoma 29–49، lip 29، cervix in situ 14–16، skin 4–21، و renal و sarcomas 2–3.

          ليه؟ التفسير المقبول (مش في الكتاب): أكتر السرطانات زيادة هي اللي **ورا فيروس**:
          - **Kaposi** ← HHV-8.
          - **lymphoma** (PTLD) ← EBV.
          - **vulva و anus و cervix** ← HPV.
          - **hepatobiliary** ← HBV و HCV.
          - **skin و lip** ← الشمس مع ضعف المراقبة المناعية للخلايا اللي اتأذت.
          المناعة الطبيعية بتقتل الخلايا المصابة بالفيروس قبل ما تبقى سرطان. لما نكتمها، الفيروس يكسب. عشان كده المتابعة: فحص جلد سنوي، Pap smear، ومتابعة الـ EBV في اللي ما عندوش مناعة قبل الزراعة.

          وليه الـ renal carcinoma 2–3 بس؟ التفسير المقبول (مش في الكتاب): السرطانات اللي مش ورا فيروس (كلى، sarcomas غير Kaposi) بتزيد بسيط، لأن المناعة مش هي الحارس الأساسي ليها. وده بيأكد القاعدة: كل ما السرطان مرتبط بفيروس أكتر، كل ما الـ immunosuppression بيزوده أكتر. ولو حصل Kaposi أو PTLD، أول خطوة غالبًا **تقليل الـ immunosuppression**، وأحيانًا التحويل لـ mTOR inhibitor لأنه ليه تأثير ضد الأورام.
