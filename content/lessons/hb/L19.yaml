          - { text: "Ca palmitate or stearate", bin: 2 }
        why: "الـ cholesterol هو الغالب ومرتبط بالـ metabolic syndrome. الـ black مع الـ haemolysis والـ alcoholic liver disease. الـ brown مع الـ infection والـ parasites، وفيه fatty acids، وبيتكوّن في الـ ducts."
      - kind: check
        page: 380
        quote: "Black pigment stonesare small, hard gallstones composed of Ca bilirubinateand inorganic Ca salts (eg, Ca carbonate, Ca phosphate)."
        question: "Years after cholecystectomy, soft greasy stones are found in the CBD above a stricture. What is TRUE about them?"
        options:
          - "They form during infection, inflammation and parasitic infestation"
