    recap:
      - "Pepsin pH 1–3 ويطلّع CCK؛ enterokinase ← trypsin ← باقي الإنزيمات."
      - "Fructose diffusion؛ glucose و galactose بالـ SGLT-1 مع الـ sodium."
      - "اللي ما اتمصش يتخمّر في القولون: غازات (انتفاخ) و short-chain fatty acids (إسهال)."
      - "Lactase deficiency أشهر disaccharidase deficiency؛ الـ secondary بعد rotavirus، giardia، celiac، radiation، Crohn، AIDS."
      - "حديد وكالسيوم ودهون فوق، B12 و bile salts في الـ terminal ileum، مية وأملاح في كل الأمعاء والقولون."
