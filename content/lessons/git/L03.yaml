  - id: git.L03.lesson7
    title: "الشرج: incontinence، وألم، وزقة غلط"
    hook: "أصعب شكوى المريض يقولها. ابدأ بالثقة، واسأل الأسئلة الصح، وكل نوع ليه فحصه وعلاجه."
    minutes: 10
    pages: [136, 142]
    topics: [anorectal]
    goals:
      - "تفرّق بين الـ passive والـ urge والـ seepage وتعرف السبب"
      - "تختار الفحص المناسب من جدول الفحوصات"
      - "تطبّق معايير Rome IV للـ anorectal disorders"
    status: unverified
    steps:
      - kind: explain
        page: 136
        quote: "Fecal incontinence is defined as involuntary passage of fecal matter through the anus or inability to control the discharge of bowel contents."
        title: "Fecal incontinence: ابدأ بالثقة"
        text: |
          الـ ==fecal incontinence==: نزول براز من غير إرادة، أو عدم القدرة على التحكم. وشدّتها من flatus بيفلت أحيانًا لحد تفريغ كامل.

          أول خطوة: ==trusting relationship==، وبعدها تسأل عن:
          - الـ leakage: **flatus** ولا **liquid** ولا **solid** stool.
          - أثرها على الـ quality of life.
          - بتحصل إمتى وفي أنهي ظروف.

          ومن الـ history المهم: الولادة (forceps، tears، repairs)، جراحة أو إصابة في الضهر، diabetes، والأدوية والكافيين.

          التفسير المقبول (مش في الكتاب): ليه الثقة أول خطوة؟ لأن المريض غالبًا مكسوف ومش هيقول التفاصيل (سائل ولا صلب، بيحس ولا لأ) إلا لو مرتاح، والتفاصيل دي هي اللي بتحدد النوع والسبب.
      - kind: figure
        page: 139
        quote: "BOX 18-1 Features of History That Should Be Elicited from a Patient with Fecal Incontinence"
        title: "الـ history بتاع الـ fecal incontinence"
        image: { file: git/L03-fi-history-box.webp, book: true }
        alt: "Book box of history features to elicit in fecal incontinence: onset and precipitating events, duration and timing, severity, stool consistency and urgency, fecal impaction, coexisting problems, drugs, caffeine and diet, past spine surgery, urinary incontinence, back injury, diabetes or neurologic disorders, the clinical subtype, and the obstetric history."
        caption: |
          قايمة الأسئلة كاملة من الكتاب. ركّز على اللي بيوجّهك للسبب: **obstetric history** (forceps، tears)، **spine surgery** أو **diabetes**، و**الأدوية والكافيين**.

          وآخر سؤال مهم: النوع ==passive== ولا **urge** ولا **fecal seepage**؟
      - kind: table
        page: 136
        quote: "TABLE 18-1: Mechanisms, Causes, and Pathophysiology of Fecal Incontinence\n| Mechanism | Causes | Pathophysiology |\n|---|---|---|\n| Abnormal Anorectal or Pelvic Floor Structures | | |\n| Anal sphincter muscles | Hemorrhoidectomy, neuropathy, obstetric injury | Sphincter weakness, loss of sampling reflex |\n| Puborectalis muscle | Aging, excessive perineal descent, trauma | Obtuse anorectal angle, sphincter weakness |\n| Pudendal nerve | Excessive straining, obstetric or surgical injury, perineal descent | Sphincter weakness, sensory loss, impaired reflexes |\n| Nervous system, spinal cord, autonomic nervous system | Avulsion injury, spine surgery, diabetes mellitus, head injury, multiple sclerosis, spinal cord injury, stroke | Loss of sensation, impaired reflexes, secondary myopathy, loss of accommodation |\n| Rectum | Aging, IBD, IBS, prolapse, radiation | Loss of accommodation, loss of sensation, hypersensitivity |\n| Abnormal Anorectal or Pelvic Floor Function | | |\n| Impaired anorectal sensation | Autonomic nervous system disorders, central nervous system disorders, obstetric injury | Loss of stool awareness, rectoanal agnosia |\n| Fecal impaction | Dyssynergic defecation | Fecal retention with overflow, impaired sensation |\n| Altered Stool Characteristics | | |\n| Increased volume and loose consistency | Drugs, bile salt malabsorption, infection, IBD, IBS, laxatives, metabolic disorders | Diarrhea and urgency, rapid stool transport, impaired accommodation |\n| Hard stools, retention | Drugs, dyssynergia | Fecal retention with overflow |\n| Miscellaneous | | |\n| Physical mobility, cognitive function | Aging, dementia, disability | Multifactorial changes |\n| Psychosis | Willful soiling | Multifactorial changes |\n| Drugs | Anticholinergics; Antidepressants; Caffeine; Laxatives; Muscle relaxants | Constipation; Altered sensation, constipation; Relaxation of sphincter tone; Diarrhea; Relaxation of sphincter tone |\n| Food intolerance | Fructose, lactose, or sorbitol malabsorption | Diarrhea, flatus |"
        title: "ليه بيحصل؟"
        columns: ["Mechanism", "Causes", "Result"]
        rows:
          - ["Anal sphincter muscles", "Hemorrhoidectomy, neuropathy, obstetric injury", "Weak sphincter, lost sampling reflex"]
          - ["Pudendal nerve", "Excessive straining, obstetric or surgical injury", "Weak sphincter, sensory loss"]
          - ["Fecal impaction", "Dyssynergic defecation", "Retention with overflow"]
          - ["Loose stool", "Drugs, bile salt malabsorption, infection, IBD, IBS", "Urgency, impaired accommodation"]
        hide: [[0, 2], [2, 2], [3, 2]]
      - kind: sort
        page: 137
        quote: "Such a detailed inquiry may facilitate recognition of the following types of fecal incontinence:\n  Passive incontinence, the involuntary discharge of fecal matter or flatus without any awareness. This pattern suggests a loss of perception or impaired rectoanal reflexes, with or without sphincter dysfunction."
        prompt: "أنهي نوع؟"
        bins: ["Passive", "Urge", "Seepage"]
        cards:
          - { text: "Leaks without noticing it", bin: 0 }
          - { text: "Loss of perception or rectoanal reflexes", bin: 0 }
          - { text: "Rushes to the toilet but cannot hold it", bin: 1 }
          - { text: "Disrupted sphincter, small rectal capacity", bin: 1 }
          - { text: "Stains after a bowel movement, otherwise continent", bin: 2 }
          - { text: "Incomplete evacuation; sphincters mostly intact", bin: 2 }
        why: "**Passive** = من غير ما يحس (perception أو reflexes). **Urge** = حاسس بس مش قادر يمسك (sphincter أو capacity). **Seepage** = تسريب بعد التبرّز، والسبب incomplete evacuation أو rectal sensation ضعيف."
      - kind: explain
        page: 137
        quote: "Anorectal manometry is a useful method for assessing IAS and EAS pressures as well as rectal sensation, rectoanal reflexes', and rectal compliance."
        title: "الفحوصات"
        text: |
          - ==Anorectal manometry==: ضغط الـ **internal anal sphincter (IAS)** والـ **external anal sphincter (EAS)**، الـ rectal sensation، الـ rectoanal reflexes، والـ compliance.
          - **Balloon expulsion test**: بسيط وبيكشف الـ dyssynergic defecation.
          - **Anal endosonography** أو magnetic resonance imaging (MRI): defects وسُمك الـ sphincters. والـ US هو الأكتر توافرًا.
          - **Defecography**، **neurophysiology** (EMG، pudendal nerve terminal motor latency (PNTML))، و saline infusion test.
          - **Sigmoidoscopy/colonoscopy** تستبعد mucosal lesions زي solitary rectal ulcer أو inflammation أو malignancy.

          يعني الـ manometry بتقيس **العضلة والإحساس** مع بعض، وعلشان كده هي أكتر فحص مفيد في الجدول.
      - kind: explain
        page: 138
        quote: "Detects prolapse, intussusception, obtuse anorectal angle, and pelvic floor weakness, as well as rectoceles and megarectum"
        title: "جدول الفحوصات: كل واحد بيجاوب على إيه"
        text: |
          جدول الكتاب (Table 18-2) بيقسّم الفحوصات لتلاتة:

          **Physiologic**:
          - **Anorectal manometry** (evidence good): ضغط الـ **EAS** والـ **IAS**، الإحساس، الـ compliance، والـ **dyssynergia**.
          - **Needle EMG**: neuropathy أو myopathy، بس **invasive** ومؤلم. **Surface EMG**: للـ **neuromuscular training**.
          - **PNTML**: latency الـ pudendal nerve، بيانات متضاربة.
          - **Colonic transit markers** و **balloon expulsion test**: بسيط ورخيص بجنب السرير، وبيكشف الـ **dyssynergic defecation**، بس لو طلع طبيعي **ما يستبعدش** الـ dyssynergia.

          **Imaging**:
          - **Anorectal US** (الأكتر انتشارًا): عيوب الـ IAS والـ EAS.
          - **Defecography**: prolapse، intussusception، rectocele.
          - **MRI**: الـ pelvic floor كله وحركته.
          - الـ **plain film** والـ **barium enema** مش روتين.

          **Endoscopy**: **flexible sigmoidoscopy** و **colonoscopy** يستبعدوا الـ mucosal lesions، ومحتاجينها في الإسهال المش مفسّر والـ seepage والسن فوق 50.

          التفسير المقبول (مش في الكتاب): السؤال الأول دايمًا: المشكلة في **العضلة** (manometry و US)، ولا **العصب** (EMG و PNTML)، ولا **الشكل** (defecography و MRI)، ولا **المحتوى** (إسهال: منظار)؟

          يعني مش كل مريض محتاج كل الجدول. الـ history بيحدد النوع، والنوع بيحدد الفحص: urge غالبًا عضلة (manometry و US)، passive غالبًا إحساس أو عصب، seepage غالبًا تفريغ ناقص (defecography أو balloon).
