  # ---------- p262-264: FH ----------
  - id: dm.L21.016
    kind: enumerate
    topic: fh
    prompt: Mention the three groups of primary disorders of elevated ApoB-containing lipoproteins.
    points:
      - "Elevated LDL-C, normal TG: familial hypercholesterolemia"
      - "Elevated TG: familial hypertriglyceridemia"
      - "Combined hyperlipidemia: familial combined dyslipidemia"
    pass: 3
    hook: "الـ ApoB 3: «LDL بس (FH)، TG بس (familial hypertriglyceridemia)، والاتنين (familial combined)»."
    src: { page: 262, quote: "Lipid Disorders Associated with Elevated LDL-C and Normal Triglycerides (Familial hypercholesterolemia)" }
    status: unverified
    tags: [high-yield]
  - id: dm.L21.017
    kind: card
    topic: fh
    front: Which Fredrickson type is familial hypercholesterolemia, and how is it inherited?
    back: Type II (a and b); autosomal dominant, relatively common.
    src: { page: 262, quote: "1. Familial hypercholesterolemia\nType II (a & b) Fredrickson Hyperlipoproteinaemia\n4. Frequency: Relatively common\n5. Genetics: Autosomal dominant\n6. FH is an autosomal dominant disorder characterized by:\n  1. Elevated plasma levels of LDL-C with\n  7. Normal triglycerides,\n  8. Tendon xanthomas, and" }
    status: unverified
    tags: [high-yield]
  - id: dm.L21.018
    kind: enumerate
    topic: fh
    prompt: Mention the features that characterize familial hypercholesterolemia.
    points:
      - Elevated plasma LDL-C
      - Normal triglycerides
      - Tendon xanthomas
      - Premature coronary atherosclerosis
    pass: 4
    hook: "الـ FH: «LDL عالي، TG طبيعي، xanthoma في الأوتار، وشرايين القلب بدري»."
    src: { page: 262, quote: "6. FH is an autosomal dominant disorder characterized by:\n  1. Elevated plasma levels of LDL-C with\n  7. Normal triglycerides," }
    status: unverified
  - id: dm.L21.019
    kind: card
    topic: fh
    front: What is the basic defect in familial hypercholesterolemia?
    back: Defective low-density lipoprotein (LDL) receptors.
    src: { page: 263, quote: "Pathogenesis: defective LDL receptors." }
    status: unverified
    tags: [high-yield]
  - id: dm.L21.020
    kind: enumerate
    topic: fh
    prompt: Why is LDL-C high in familial hypercholesterolemia?
    points:
      - More LDL is made from IDL (less IDL is cleared by LDL receptors)
      - LDL removal from the blood is delayed
    pass: 2
    hook: "الـ LDL عالي لأن «بيتعمل أكتر من IDL، وبيتشال أبطأ»."
    src: { page: 263, quote: "Pathogenesis: defective LDL receptors.\n  The elevated levels of LDL-C are due to:\na) An increase in the production of LDL from IDL (since a portion of IDL is normally cleared by LDL receptor–mediated endocytosis.\nb) A delayed removal of LDL from the blood" }
    status: unverified
  - id: dm.L21.021
    kind: table
    topic: fh
    title: Homozygous versus heterozygous FH
    columns: [Type, Mutant LDL receptor alleles, Course]
    rows:
      - [Homozygous FH, Two, "Much higher LDL-C; symptomatic coronary atherosclerosis often before puberty"]
      - [Heterozygous FH, One, "More common; premature CAD in adulthood"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 263, quote: "Types:\n  1. Homozygous FH: Children with homozygous FH often develop symptomatic coronary atherosclerosis before puberty" }
    status: unverified
    tags: [high-yield]
  - id: dm.L21.022
    kind: enumerate
    topic: fh
    prompt: Mention the clinical presentation of familial hypercholesterolemia.
    points:
      - Family history of xanthomata and premature death from CHD
      - Xanthelasma
      - Tendon xanthoma (hand extensors, Achilles)
      - Tuberous xanthoma at pressure sites (elbow, knee)
      - Juvenile corneal arcus
      - Accelerated coronary and peripheral atherosclerosis
    pass: 4
    hook: "الـ FH «بيظهر في العيلة والجلد والعين والشرايين»: family history (xanthomata وموت بدري من CHD)؛ xanthelasma، tendon xanthoma (extensors الإيد وAchilles)، tuberous xanthoma (الكوع والركبة)؛ juvenile corneal arcus؛ وaccelerated atherosclerosis. 1 + 3 + 1 + 1 = 6."
    src: { page: 263, quote: "Clinical presentation of FH\n  1. Family history of xanthomata and premature death from CHD\n  2. Xanthelasma (Cholest deposition in the epidermal layer of the orbit)\n  3. Tendon xanthoma: Cholesterol deposits in tendons of extensor muscles (hand or Achilles tendon).\n  4. Tuberous xanthoma at pressure sites (elbow or Knee)\n  5. Juvenile corneal arcus (cholest. deposition in the cornea as a white or gray opaque ring at the corneal margin)\n  6. Accelerated atherosclerotic coronary and peripheral artery disease." }
    status: unverified
    tags: [high-yield]
