  - id: neph.L01.lesson6
    title: "السموم: الـ osmolal gap والكحوليات"
    hook: "مريض شرب \"سبيرتو\" ومش شايف. رقمين بس (الـ AG والـ osmolal gap) هيقولولك شرب إيه."
    minutes: 8
    pages: [20, 22]
    topics: [toxins]
    goals:
      - "تحسب الـ osmolal gap"
      - "تفرق الكحوليات الأربعة"
      - "تعرف مراحل الـ salicylate toxicity"
    status: unverified
    steps:
      - kind: explain
        page: 20
        quote: "it is important to measure and calculate serum osmolality to identify osmolal gap."
        title: "ليه الـ osmolal gap؟"
        text: |
          الكحوليات (ethanol، methanol، ethylene glycol، propylene glycol) بتعمل حاجتين: **hyperosmolality** و **high AG metabolic acidosis**.

          الجهاز بيقيس كل الـ osmoles، لكن المعادلة بتحسب Na و glucose و urea بس. الفرق هو ==osmolal gap==، ولو كبير يبقى فيه حاجة متقاسة ومش محسوبة، زي الكحول.
      - kind: explain
        page: 20
        quote: "Calculated Serum Osmolality = (2 x [Na]) + [glucose, in mg/dL]/18 + [blood urea nitrogen in mg/dL]/2.8"
        title: "الحسبة"
        text: |
          - **Calculated Osm = 2 × Na + glucose/18 + BUN/2.8** (mg/dL)
          - **SI: 2 × Na + glucose + urea** (mmol/L)
          - **Osmolal gap = measured − calculated**

          الطبيعي: الـ measured أعلى بحوالي **10 mOsm**. أكتر من **10** = فيه ==osmolal gap==.
      - kind: reveal
        page: 20
        quote: "Values >10 mOsm represent the presence of an osmolal gap."
        prompt: "Na 140، glucose 90 mg/dL، BUN 28 mg/dL، measured osmolality 325. فيه gap؟"
        answer: "Calculated = 280 + 5 + 10 = **295**. الـ gap = 325 − 295 = **30**، أكبر من 10: **فيه osmolal gap**. دوّر على toxic alcohol."
      - kind: explain
        page: 21
        quote: "Causes of significantly high osmolal gap Ethylene glycol ingestion Methanol ingestion"
        title: "مين تاني بيعمل gap؟"
        text: |
          مش الكحول بس:

          - **Alcohols**: ethylene glycol، methanol، ethanol، isopropyl alcohol
          - **ESRD** من غير dialysis منتظم
          - **Ketoacidosis** و **lactic acidosis**
          - formaldehyde، paraldehyde، diethyl ether
          - محاليل **glycine، sorbitol، mannitol** (زي غسيل الـ TURP)
          - **severe hyperproteinemia** أو **hyperlipidemia**، و **lab error**
      - kind: table
        page: 22
        quote: "Common Beer, Wine, hand washer fluid, Rubbing Antifreeze"
        title: "الكحوليات الأربعة"
        columns: [Alcohol, Metabolite, Clue]
        rows:
          - ["Ethanol", "Acetoacetic, β-hydroxybutyric acid", "Confusion"]
          - ["Methanol", "Formic acid", "Visual disturbance, blindness"]
          - ["Isopropanol", "Acetone", "Fruity breath, GI irritation, coma; NO high AG"]
          - ["Ethylene glycol", "Glycolic, oxalic acid", "AKI, heart failure, oxalate crystals"]
        hide: [[1, 1], [1, 2], [2, 2], [3, 1], [3, 2]]
      - kind: aside
        page: 22
        quote: "Isopropanol Rubbing alcohol Acetone Osmolal gap Present High anion gap metabolic acidosis Absent"
        tone: exam
        text: "الكل عامل **osmolal gap**، بس **isopropanol** هو الوحيد اللي **من غير high AG acidosis**: بيتحول لـ **acetone** (ketone مش acid). سؤال امتحان كلاسيكي."
      - kind: aside
        page: 22
        quote: "Methanol Formic acid Visual disturbance Blindness"
        tone: joke
        text: "الـ **Methanol** في الـ windshield washer fluid: بيغسل زجاج العربية، ولو اتشرب بيقفل زجاج العين. 👀 والـ **ethylene glycol** في الـ **antifreeze**: بيحمي الموتور من التلج ويرمي **oxalate crystals** في الكلية."
      - kind: check
        page: 22
        quote: "Treatment Fomepizole Or ethanol ± Dialysis"
        question: "Antifreeze ingestion with high AG acidosis, osmolal gap and oxalate crystals. Treatment per the book?"
        options:
          - "Fomepizole or ethanol, ± dialysis"
          - "Supportive only"
          - "Urinary alkalinization"
          - "Fomepizole is contraindicated"
        answer: 0
        why:
          - "صح: methanol و ethylene glycol = **fomepizole أو ethanol ± dialysis**؛ الاتنين بيوقفوا الـ alcohol dehydrogenase قبل ما يعمل السم."
          - "ده للـ ethanol والـ isopropanol."
          - "ده للـ salicylate."
          - "بالعكس، ده العلاج."
      - kind: explain
        page: 22
        quote: "Initially respiratory alkalosis due to stimulation of medullary respiratory center by salicylate and hyperventilation."
        title: "Salicylate: disorder على مرحلتين"
        text: |
          1. **الأول**: ==respiratory alkalosis==، الـ salicylate بيزق مركز التنفس في الـ medulla مباشرة.
          2. **بعدين**: **high AG metabolic acidosis** من الـ lactic acid والـ ketoacids.

          الأعراض أساسًا **GIT و CNS**. والعلاج: **urinary alkalinization** و **hemodialysis**.
