        title: "واللي مش هيتعالج؟ نتابعه كل قد إيه"
        text: |
          - **HBeAg-positive**: كل **3–6 months**.
          - **HBeAg-negative**: كل **6–12 months**.
          - **HBeAg-negative chronic infection** مع **DNA > 2,000 IU/mL**: كل **3 months** في أول سنة، وبعدها كل **6 months**.

          المنطق: الـ e+ لسه ممكن يقلب خناقة في أي وقت، فبنقرّب المتابعة.
