  - id: dm.L10.018
    kind: mcq
    topic: types
    stem: A man on NPH at bedtime wakes at 3 am sweating with glucose 55 mg/dl. Which property of NPH best explains this?
    options:
      - Its peak at 5–7 hours after injection
      - Its duration of more than 42 hours
      - Its onset within 10 minutes
      - Its lack of any peak
      - Its 4-hour duration
    answer: 0
