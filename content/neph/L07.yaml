  - id: neph.L07.157
    kind: enumerate
    topic: alport
    prompt: Mention the clinical course of X-linked Alport syndrome in males.
    points:
      - Persistent microscopic hematuria from early childhood
      - Proteinuria (often nephrotic) and raised BP by adolescence
      - Progressive CKD to ESRD by the 3rd–4th decade
      - High-tone sensorineural deafness (majority)
      - Anterior lenticonus (~20%)
    pass: 4
