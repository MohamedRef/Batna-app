  - id: hb.L12.lesson3
    title: "Hemochromatosis في العيادة"
    hook: "الحديد بيتخزن من يوم الولادة، والأعراض بتستنى 20-30 سنة. هنا: إزاي تشخّص، مين تعمله screening، وإزاي تفضّي الحديد."
    minutes: 9
    pages: [198, 199]
    topics: [hh-clinical]
    goals:
      - "تقسّم الأعراض لـ typical و severe/early و late cirrhosis"
      - "تختار الفحص الأول وتعرف مكان الـ liver biopsy"
