  - id: neph.L03.092
    kind: case
    topic: dialysis-hf
    stem: A 64-year-old woman on thrice-weekly hemodialysis has HFrEF (EF 30%). She gains 4 kg between sessions and her BP drops to 80/50 during most runs.
    steps:
      - question: Which strategy lowers her interdialytic weight gain and allows slower ultrafiltration?
        options:
          - Longer or more frequent dialysis
          - Higher dialysate sodium
          - Midodrine
          - Lower dialysate calcium
        answer: 0
        why: "Longer or more frequent dialysis lowers interdialytic weight gain so each session removes less, more slowly (Table 6, p74). Higher sodium increases weight gain."
      - question: Which strategy may reduce myocardial stunning, but has no defined optimal temperature?
        options:
          - Dialysate cooling
          - Dietary sodium restriction
          - Midodrine
          - Higher dialysate sodium
        answer: 0
        why: "Dialysate cooling may mean less myocardial stunning, hypotension and remodeling; the optimal temperature is not defined (p74)."
      - question: The team considers midodrine. Which caution does Table 6 give?
        options:
          - It may be associated with increased mortality
          - It promotes vascular calcification
          - It increases interdialytic weight gain
          - It costs more than dialysis
        answer: 0
        why: "Midodrine may be associated with increased mortality (p74). Calcification goes with dialysate calcium ≥2.5; weight gain with higher sodium."
    src: { page: 74, quote: "Table 6: Dialysis strategies to improve symptoms and dialysis tolerability in patients with heart failure\n| Strategy | Benefits | Limitations |\n| Longer or more frequent dialysis | Lower interdialytic weight gain allows for slower ultrafiltration with smaller amounts of volume removal at each session | Patient preference, cost |\n| Dialysate cooling | May lead to less myocardial stunning, less intradialytic hypotension, and less cardiac remodeling | Optimal temperature has not been defined. Occasional patient discomfort. |\n| Maintain dialysate calcium ≥2.5 mEq/L | May lead to less myocardial stunning, less intradialytic hypotension, and fewer HF hospitalizations | Possible promotion of vascular calcification. |\n| Higher dialysate sodium | Less intradialytic hypotension, resulting in better single session tolerance | Increased interdialytic weight gain, thereby worsening heart failure |\n| Dietary sodium restriction | May decrease fluid retention and congestive symptoms | May be associated with higher hospitalization rates and increased neurohormonal activation |\n| Midodrine | Less intradialytic hypotension. May decrease dyspnea presumably through better volume removal during dialysis | May be associated with increased mortality |" }
    status: unverified
  - id: neph.L03.093
    kind: case
    topic: volume
    stem: A 59-year-old man with ADHF has stage III AKI after 3 days. The team is unsure whether he will need RRT.
    steps:
      - question: Which bedside test can help?
        options:
          - Furosemide stress test, 1.0–1.5 mg/kg IV
          - Dopamine infusion trial
          - Tagged red cell scan
          - Saline challenge of 2 litres
        answer: 0
        why: "A loop diuretic challenge (furosemide stress test) with 1.0–1.5 mg/kg IV, then measure urine output (p76)."
      - reveal: "He passes 140 ml in 2 hours and 380 ml in 6 hours."
        question: How do you read this?
        options:
          - Higher risk of progressive AKI and likely need for RRT
          - Normal response; no added risk of progression
          - Diuretic toxicity from the high furosemide dose
          - Prerenal state that will respond to fluids
        answer: 0
        why: "<200 ml in 2 h means increased risk of progressive AKI; a 6-h output <600 ml predicts RRT in stage III AKI (p76)."
    src: { page: 76, quote: "A loop diuretic challenge or furosemide stress test can be performed in patients with AKI by measuring the urine output after a dose of 1.0 to 1.5 mg/kg of intravenous furosemide.\nPatients who have a urine output <200 ml over the first 2 h are at increased risk of progressive AKI and potential need for renal replacement therapy (RRT); a 6-h urine output <600 ml is predictive of the need for RRT in patients with stage III AKI." }
    status: unverified
  # ---------- essays ----------
  - id: neph.L03.094
    kind: essay
    topic: definition
    prompt: Define cardiorenal syndrome and discuss its classification and pathogenesis.
    outline:
      - "Definition: 2008 consensus, dysfunction of one organ inducing dysfunction of the other"
      - "Type 1 acute cardiorenal: altered renal perfusion (congestion); humoral, drug, hemodynamic pathways"
      - "Type 2 chronic cardiorenal: renal fibrosis, drugs, ventricular assist device; hypoperfusion and venous pressure"
      - "Type 3 acute renocardiac: salt and water, neurohormonal, uremic dysregulation"
      - "Type 4 chronic renocardiac: hypertension, CKD myopathy, dialysis, fluid shifts; anemia, toxins, calcification"
      - "Type 5 secondary: sepsis, diabetes, amyloidosis, vasculitis; cytokines, hypoxia, hypoperfusion, SNS"
    src: { page: 68, quote: "A 2008 consensus conference defined \"disorders of the heart and kidneys where by acute or chronic dysfunction in one organ may induce acute or chronic dysfunction of the other\" as cardiorenal syndrome (CRS)." }
