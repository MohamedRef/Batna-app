      - kind: aside
        tone: exam
        page: 174
        quote: "3. Abnormal EPO secretion, non renal tumours\n  Hepatocellular carcinoma\n  Cerebellar tumor, hemangioma\n  Large uterine fibroma.\nPolycythemia responds to removal of the tumor."
        text: "سؤال جاهز: «non-renal EPO-secreting tumours» = **HCC، cerebellar hemangioma، uterine fibroma**. ولو لقيت Hb عالي في مريض cirrhosis، فكّر في **HCC**."
      - kind: explain
        page: 174
        title: "Idiopathic و Apparent"
        quote: "Raised PCV (>0.51 in male and >0.48 in female) with normal red cell volume."
        text: |
          - **Idiopathic**: مش بيقابل criteria الـ polycythaemia vera (PV) ومفيش سبب. **heterogeneous**، فيه طفرات، وبعضهم بيطلع **overt PV** بعدين.
          - ==Apparent polycythemia==: PCV **>0.51 رجالة / >0.48 ستات** مع **red cell volume طبيعي**، لأن البلازما قليلة: **smoking، hypertension (HTN)، obesity، excess alcohol، diuretics**.
          - مش واضح إنه بيزوّد التجلط. **شيل الأسباب**، و **venesection لو PCV >0.55** والعيان عنده خطر vascular.

          ليه الحاجات دي بتقلّل البلازما؟ التفسير المقبول (مش في الكتاب): الـ diuretics والكحول بيطلّعوا ميّة، والـ hypertension بيزقّ سوايل برا الأوعية. فالكرات زي ما هي بس في ميّة أقل. وده نفس الـ **Gaisbock** اللي شفته في عيان الـ PV. يعني العلاج الحقيقي إنك تشيل السبب، مش الفصد.
      - kind: reveal
        page: 174
        quote: "Raised PCV (>0.51 in male and >0.48 in female) with normal red cell volume.\nRaised Hct due to reduced plasma volume (smoking, hypertension, obesity, excess alcohol, and duiretic therapy.)"
        prompt: "راجل مدخن، تخين، على thiazide، PCV 0.53. إزاي تعرف إنه apparent مش true؟ وتعمل إيه؟"
        answer: |
          بالـ **red cell volume**: في الـ apparent بيبقى ==normal== والـ plasma volume قليل.

          والعلاج: **encourage avoidance of predisposing factors**: يبطّل تدخين، يخس، تراجع الـ diuretic. والـ venesection بس لو **PCV >0.55** وعنده خطر vascular (وهو هنا 0.53).
      - kind: table
        page: 175
        quote: "Secondary polycythemia algorithm\n  Acquired\n    Hypoxia-driven: Cardiac or pulmonary disease; High altitude habitat; Smoking/CO poisoning; Sleep apnea/hypoventilation; Renal artery stenosis\n    Oxygen-independent: Drugs (androgens, Erythropoietin); Post renal transplant; Malignant tumors; Other tumors (hyperparathyroidism)\n  Congenital: Check serum erythropoietin (Epo)\n    Epo decreased → EPOR mutation\n    Epo normal or increased → Check p50\n      p50 decreased: 1. High oxygen-affinity hemoglobinopathy; 2. 2,3-BPG deficiency\n      p50 normal: 1. VHL mutation (Epo usually high); 2. PHD2/HIF2α mutations (Epo normal or elevated)"
        title: "Algorithm الـ congenital: EPO وبعدين P50"
        columns: [Finding, Think of]
        rows:
          - ["EPO decreased", "EPOR mutation"]
          - ["EPO N/high, P50 low", "High-affinity Hb; 2,3-BPG deficiency"]
          - ["EPO N/high, P50 normal", "VHL (EPO high); PHD2/HIF2α"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: figure
        page: 175
        title: "صورة الكتاب: الـ secondary polycythemia algorithm"
        image: { file: hem/L10-secondary-algorithm.webp, book: true }
        alt: "Book flowchart titled secondary polycythemia algorithm, splitting into congenital on the left and acquired on the right. Acquired points to a box: hypoxia-driven (cardiac or pulmonary disease, high altitude habitat, smoking or CO poisoning, sleep apnoea or hypoventilation, renal artery stenosis) and oxygen-independent (drugs such as androgens and erythropoietin, post renal transplant, malignant tumours, other tumours). Congenital: check serum erythropoietin. EPO decreased leads to EPOR mutation. EPO normal or increased leads to check p50: p50 decreased means high oxygen-affinity haemoglobinopathy or 2,3-BPG deficiency; p50 normal means VHL mutation (EPO usually high) or PHD2/HIF2 alpha mutations (EPO normal or elevated)."
        caption: |
          الـ algorithm كامل زي ما الكتاب طابعه (الجدول اللي فوق فيه فرع الـ congenital بس):

          - **فوق**: الـ secondary بيتقسم **congenital** (شمال) و **acquired** (يمين).
          - **الصندوق اللي فوق على اليمين** (acquired): ==hypoxia-driven== (قلب أو رئة، الجبل، smoking/CO، sleep apnoea، renal artery stenosis) و **oxygen-independent** (androgens وEPO، بعد زرع الكلى، أورام).
          - **الشمال** (congenital): اعمل **serum EPO**. لو **decreased** ← السهم المايل يمين ← **EPOR mutation**.
