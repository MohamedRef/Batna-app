  - id: geri.L10.lesson6
    title: "الـ IPF رايح على فين؟"
    hook: "مريضين بنفس التشخيص: واحد بينزل سلمة سلمة على سنين، والتاني بيقع فجأة في exacerbation. تعرف تتوقع مين؟"
    minutes: 7
    pages: [179, 180]
    topics: [prognosis]
    goals:
      - "تعدّ الـ complications السبعة وتعرف ليه كل واحدة"
      - "تعرف الـ baseline والـ dynamic predictors للـ poor prognosis"
      - "تفهم الـ natural history: نزول بطيء أو exacerbation"
    status: unverified
    steps:
      - kind: explain
        remind: [geri.L10.053]
        page: 179
        quote: "The following are complications that can be seen in patients with idiopathic pulmonary fibrosis (IPF):"
        title: "سبع complications"
        text: |
          الكتاب بيعدّ سبعة:

          1. **Pulmonary hypertension**
          2. **Acute exacerbation** of pulmonary fibrosis
          3. **Respiratory infection**
          4. **Acute coronary syndrome**
          5. **Thromboembolic disease**
          6. **Adverse medication effects**
          7. ==Lung cancer==

          التفسير المقبول (مش في الكتاب) لأول تلاتة: الـ alveoli اللي فيها أكسجين قليل بتقفّل الأوعية اللي جنبها (hypoxic vasoconstriction)، والندبة بتاكل الـ capillaries نفسها، فالضغط في الـ pulmonary artery بيعلى. والرئة المتشوّهة مش بتنضّف نفسها كويس، فالعدوى أسهل.
      - kind: explain
        remind: [geri.L10.054, geri.L10.053]
        page: 180
        quote: "Characteristics that predict a poor prognosis include\n  1) The finding of UIP on lung biopsy predicts a median survival of less than 5 years.\n  2) A low DLCO\n  3) Increased A-a gradient\n  4) Des at urat ion during a 6-minute walk test (SaO2 < 88%)\n  5) Pulmonary arterial hypertension (mPAP >25 mmHg)\n  6) The finding of honeycombing on high-resolution computed tomography (HRCT)."
        title: "Complications و prognosis"
        text: |
          **Complications**: pulmonary hypertension، acute exacerbation، respiratory infection، acute coronary syndrome (ACS)، thromboembolism، adverse drug effects، و ==lung cancer==.

          **Poor prognosis (baseline)**:
          - usual interstitial pneumonia (UIP) على الـ biopsy: median survival **أقل من 5 سنين**.
          - Low diffusing capacity of the lung for carbon monoxide (DLCO)، و A-a gradient عالي.
          - Desaturation في الـ 6-minute walk لـ **arterial oxygen saturation (SaO2) < 88%**.
          - pulmonary arterial hypertension (PAH) بـ **mean pulmonary artery pressure (mPAP) > 25 mmHg**.
          - Honeycombing على الـ high-resolution computed tomography (HRCT).

          ليه دول بالذات؟ كلهم بيقيسوا **قد إيه الرئة اتدمّرت**: الـ DLCO الواطي يعني سطح gas exchange أقل، والـ A-a gradient العالي يعني الأكسجين مش عارف يعدّي، والـ desaturation في المشي يعني الاحتياطي خلص، والـ honeycombing آخر مرحلة من الندبة.
