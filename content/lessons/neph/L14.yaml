      - kind: explain
        page: 480
        title: "الـ PLASMIC بيستبعد أكتر ما بيأكّد"
        quote: "This score has been validated with a reported sensitivity of 99% and a specificity of 57%. Due to its high negative predictive value, it is recommended as a screening tool for patients who are unlikely to have TTP."
        text: |
          شرط الـ score: ==presence of peripheral schistocytes is required==. وبعدين: **>5** = احتمال TTP عالي، **<5** = احتمال واطي.

          ليه screening؟ الـ **sensitivity 99%** يعني تقريبًا مفيش TTP بيطلع score واطي، فالـ score الواطي بيطمّنك. بس الـ **specificity 57%** يعني score عالي ممكن يطلع في حاجات تانية.

          وليه البنود دي؟ التفسير المقبول (مش في الكتاب): كل بند بيستبعد TMA تانية:
          - **INR <1.5:** الـ coagulation سليمة، فده مش **DIC**.
          - **Creatinine <2:** الكلية في الـ TTP غالبًا أقل وقوعًا من الـ **HUS**.
          - **مفيش cancer ولا transplant:** أسباب secondary TMA.
          - **Platelets <30,000:** الـ TTP بيستهلك الصفايح أكتر من غيره.
          - **MCV <90:** التفسير المقبول (مش في الكتاب): بيستبعد إن الأنيميا جاية من سبب تاني زي نقص B12 (اللي بيعمل pseudo-TMA وكُرات كبيرة).
