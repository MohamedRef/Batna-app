  - id: hb.L09.lesson4
    title: "نصرّف المية: ملح، spironolactone، وبزل"
    hook: "100 و 40، و 500 جرام في اليوم: الأرقام اللي هتحفظها مرة وتعيش بيها."
    minutes: 10
    pages: [151, 154]
    topics: [treatment]
    goals:
      - "تعالج حسب الـ grade"
      - "تكتب الـ diuretic regimen (sequential و combined) بالجرعات"
      - "تحكم على الـ diuresis وتعرف المضاعفات وإمتى تعمل LVP بـ albumin"
    status: unverified
    steps:
      - kind: explain
        page: 151
        title: "قبل ما تبدأ"
        text: |
          قبل أي علاج: **عالج سبب الكبد**، **اعمل rule out للـ SBP**، **تابع الـ renal function والـ electrolytes**، و **استبعد أسباب تانية** للـ ascites.

          والهدف كله في جملة: **negative sodium and water balance**.
      - kind: table
        page: 152
        title: "العلاج حسب الـ grade"
        columns: ["Grade", "Treatment"]
        rows:
          - ["1", "No treatment"]
          - ["2", "Na restriction + diuretics"]
          - ["3", "LVP, then Na restriction + diuretics"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: mnemonic
        page: 152
        word: "AAAAA"
        parts:
          - { key: "A", text: "Alcohol: stop it" }
          - { key: "A", text: "ACE inhibitors: avoid" }
          - { key: "A", text: "ARBs: avoid" }
          - { key: "A", text: "Anti-inflammatories (NSAIDs): avoid" }
          - { key: "A", text: "Aminoglycosides: avoid whenever possible" }
        hook: |
          الـ general measures هي **صرخة المريض: «AAAAA!»** خمس حاجات كلها بتبدأ بـ A وكلها ممنوعة. وزوّد عليهم: **protein 1.2–1.5 g/kg**، والـ **beta blockers** بتتوقف **بس** لو فيه low BP و renal dysfunction.
      - kind: explain
        page: 152
        title: "الملح: معتدل مش متطرّف"
        text: |
          - **Na 2 g (90 mmol)/day**: «no added salt» و «avoid preprepared foodstuffs».
          - **Strict** restriction لأ، لأنها بتبوّظ الـ **nutrition** (الأكل بيبقى ملوش طعم فالمريض مش بياكل).
          - الـ restriction بتقلل احتياج الـ diuretics.
          - وخلي بالك من الـ **saline** اللي بيتعلّق.

          **Dilutional hyponatremia:**
          - لو **Na <125**: fluid restriction **1–1.5 L/day**.
          - الـ **vaptans** (V2 antagonists) بتعمل **aquaresis**: مية من غير electrolytes.
          - الـ **3% saline** بس للحالات النادرة الخطيرة، و **ببطء ≤8 mmol/L/day** علشان الـ **osmotic demyelination**.
      - kind: aside
        tone: joke
        text: |
          الكتاب بيقول «no added salt»، مش «no salt». يعني الفول ينفع، بس من غير ما تنزل عليه بالملاحة كأنك بتملّح فسيخ. 🧂
      - kind: explain
        page: 153
        title: "الـ diuretics"
        text: |
          **Spironolactone** هو الـ **first-line**. الـ furosemide لوحده **أضعف ومش recommended**.

          **Sequential (grade 2):** spironolactone **100 mg/day**، تزوّد **كل 72 ساعة على الأقل** لحد **400 mg/day**. لو مفيش استجابة كفاية في **أول أسبوعين**، ضيف **furosemide 40 mg/day** وزوّد **كل 2–3 أيام** لحد **160 mg/day**.

          **Combined (grade 3 أو recurrent):** spiro + furo من الأول بنسبة **100 : 40**، والـ titration بعد **4–5 أيام**.
      - kind: reveal
        page: 153
        prompt: "ليه الـ spironolactone يكسب الـ furosemide في الـ cirrhosis؟"
        answer: |
          لأن المشكلة الأساسية **secondary hyperaldosteronism** (الـ RAAS متنشط من الـ underfilling). الـ aldosterone بيحبس Na في الـ distal tubule، فالـ loop diuretic بيطلّع Na فوق وبيرجع يتمسك تحت. الـ **aldosterone antagonist** بيضرب المشكلة في مكانها.

          (ده الشرح الفسيولوجي؛ الكتاب بيكتفي بإن الـ furosemide monotherapy less effective.)
      - kind: figure
        page: 153
        title: "سلم الـ diuretics"
        alt: "A ladder: grade 1 no treatment; grade 2 sodium 2 g per day plus spironolactone 100 mg rising every 72 hours to 400; no response in 2 weeks add furosemide 40 rising every 2 to 3 days to 160; grade 3 or recurrent use combined spironolactone 100 to furosemide 40 from day one, titrated after 4 to 5 days; grade 3 starts with large volume paracentesis then salt restriction and diuretics."
        caption: "Sequential = spiro لوحده الأول. Combined = الاتنين من أول يوم بنسبة 100:40."
        svg: |
          <svg viewBox="0 0 330 334" xmlns="http://www.w3.org/2000/svg">
          <defs><marker id="L09c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
          <text x="165" y="22" text-anchor="middle" class="t-b t-lg">Sequential vs combined</text>
          <rect x="12" y="36" width="306" height="40" rx="7" class="fg-good"/>
          <text x="165" y="53" text-anchor="middle" class="t-b">Grade 1: no treatment</text>
          <text x="165" y="68" text-anchor="middle" class="t-sm">seen only on ultrasound</text>
          <path d="M165 78v16" class="fg-arrow" marker-end="url(#L09c)"/>
          <rect x="12" y="98" width="306" height="40" rx="7" class="fg-box"/>
          <text x="165" y="115" text-anchor="middle" class="t-b">Grade 2: Na 2 g/day + spironolactone</text>
          <text x="165" y="130" text-anchor="middle" class="t-sm">start 100 mg/day, step up every 72 h to 400</text>
          <path d="M165 140v16" class="fg-arrow" marker-end="url(#L09c)"/>
          <rect x="12" y="160" width="306" height="40" rx="7" class="fg-box"/>
          <text x="165" y="177" text-anchor="middle" class="t-b">No response in 2 weeks?</text>
          <text x="165" y="192" text-anchor="middle" class="t-sm">add furosemide 40 mg/day, up every 2-3 days to 160</text>
          <path d="M165 202v16" class="fg-arrow" marker-end="url(#L09c)"/>
          <rect x="12" y="222" width="306" height="40" rx="7" class="fg-acc"/>
          <text x="165" y="239" text-anchor="middle" class="t-b">Grade 3 or recurrent: combined</text>
          <text x="165" y="254" text-anchor="middle" class="t-sm">spiro 100 : furo 40 from day 1, titrate after 4-5 days</text>
          <path d="M165 264v16" class="fg-arrow" marker-end="url(#L09c)"/>
          <rect x="12" y="284" width="306" height="40" rx="7" class="fg-bad"/>
          <text x="165" y="301" text-anchor="middle" class="t-b">Grade 3: LVP first</text>
          <text x="165" y="316" text-anchor="middle" class="t-sm">then salt restriction + diuretics again</text>
          </svg>
      - kind: explain
        page: 153
        title: "الـ diuresis ماشية صح؟"
        text: |
          - **Weight loss** ميزدش عن **500 g/day** لو **مفيش** edema، و **1 kg/day** لو **فيه** edema.
          - **Spot urine Na/K > 1**.
          - **Urinary Na > 78 mmol/day**.

          ليه السقف ده؟ المية بتتسحب من البطن للدم ببطء، أما الـ edema فبيدّي احتياطي أكبر. لو سحبت أسرع، هتسحب من الـ intravascular volume وتعمل renal impairment.
      - kind: check
        page: 154
        question: "Which is NOT one of the diuretic-induced complications in the book?"
        options:
          - "Hypercalcemia"
          - "Hepatic encephalopathy"
          - "Hyponatremia below 125 mmol/L"
          - "Incapacitating muscle cramps"
        answer: 0
        why:
          - "صح: مش في القائمة. القائمة: renal impairment، HE، hyponatremia، hypo/hyperkalemia، و muscle cramps."
          - "الـ HE من المضاعفات."
          - "الـ hyponatremia (<125) من المضاعفات."
          - "الـ cramps من المضاعفات."
      - kind: explain
        page: 154
        title: "الـ LVP والـ albumin"
        text: |
          - **LVP** = سحب **5 لتر أو أكتر**، وهو **أحسن** من الـ diuretics في الـ grade 3.
          - لو **>5 لتر**: **albumin 6–8 g لكل لتر** علشان تمنع الـ **paracentesis-induced circulatory dysfunction** (الـ effective arterial volume بيقع فجأة والـ renin بيعلى).
          - بعده **ارجع** للملح والـ diuretics.
          - الـ LVP **symptomatic**: مش بيمنع الرجوع، مش بيطوّل العمر، وبيزوّد الـ malnutrition.
          - و grade 2 أو 3 = فكّر في **referral للـ LT evaluation**.
      - kind: check
        page: 154
        question: "8 L are removed by paracentesis. How much albumin, per the book?"
        options:
          - "48–64 g"
          - "8 g"
          - "100 g"
          - "None: albumin is only for SBP"
        answer: 0
        why:
          - "صح: 6–8 g × 8 لتر = **48–64 g**."
          - "دي جرعة لتر واحد بس."
          - "الكتاب بيحسبها بالتر، مش رقم ثابت."
          - "الـ albumin مطلوب في الـ LVP >5 L كمان، علشان الـ circulatory dysfunction."
      - kind: try
        items: [hb.L09.053, hb.L09.063, hb.L09.066]
    recap:
      - "الهدف: negative Na and water balance. Grade 1 لا علاج، 2 ملح + diuretics، 3 LVP الأول."
      - "**AAAAA**: alcohol، ACEi، ARBs، NSAIDs، aminoglycosides."
      - "Na 2 g/day؛ Na <125 → fluid 1–1.5 L؛ 3% saline ≤8 mmol/L/day."
      - "Spiro 100 → 400 (كل 72 h)؛ furo 40 → 160 (كل 2–3 أيام)؛ combined 100:40."
      - "Weight loss ≤500 g (بدون edema) أو ≤1 kg (مع edema)؛ LVP >5 L → albumin 6–8 g/L."
    practice: [hb.L09.051, hb.L09.052, hb.L09.053, hb.L09.054, hb.L09.055, hb.L09.056, hb.L09.057, hb.L09.058, hb.L09.059, hb.L09.060, hb.L09.061, hb.L09.062, hb.L09.063, hb.L09.064, hb.L09.065, hb.L09.066, hb.L09.067, hb.L09.068, hb.L09.069, hb.L09.070, hb.L09.071, hb.L09.072, hb.L09.073, hb.L09.074, hb.L09.075, hb.L09.076, hb.L09.077, hb.L09.187]

