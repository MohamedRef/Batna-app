        why: "IFN-γ (Th1) و IL-10 (Th2) بيكبتوا بعض: كل subset بيحاول يسكت التاني. ده سر الـ balance."
      - kind: explain
        page: 11
        quote: "the common γ chain receptor by IL-2, IL-4, IL-7, IL-9, IL-15, IL-21, and glycoprotein 130 (gp130) by members of the IL-6 family."
        title: "الـ receptors بتتشارك سلاسل"
        text: |
          الـ receptor complex غالبًا heterodimer أو heterotrimer: **سلسلة خاصة** بالـ cytokine + **سلسلة مشتركة** للعيلة كلها.

          - ==common γ chain==: IL-2، IL-4، IL-7، IL-9، IL-15، IL-21.
          - **gp130**: عيلة IL-6.
          - **Death domains**: في كتير من الـ TNF receptors.
          - **IL-1 signalling domain**: مشترك بين IL-1R و IL-18R و IL-33R والـ Toll-like receptors.
