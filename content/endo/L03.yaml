  # ---------- p35: PTHrP ----------
  - id: endo.L03.019
    kind: cloze
    topic: pthrp
    text: "Causes of hypercalcaemia with malignancy (book, p35): T-cell lymphoma {{c1::50%}}, multiple myeloma {{c2::40%}}, bronchogenic carcinoma {{c3::12%}}; others include bladder, GIT, ovary, head and neck."
    src: { page: 35, quote: "1. T cell lymphoma 50%. 2. Multiple myeloma 40%. 3. Bronchogenic Ca.12%." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L03.020
    kind: card
    topic: pthrp
    front: What causes humoral hypercalcaemia of malignancy (HHM)?
    back: Over-expression of the gene encoding PTHrP, or rarely PTH.
    src: { page: 35, quote: "Caused by over expression of gene encoding for PTHrP or rarely PTH." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.021
    kind: card
    topic: pthrp
    front: What causes local osteolytic hypercalcaemia (LOH), and which cytokines act as osteoclast activating factor?
    back: Cytokines from lymphoma, leukaemia or myeloma cells; TNF, interleukin-1 and lymphotoxin.
    src: { page: 35, quote: "Effectors of these cytokines ( TNF, Interleukine 1 and lymphotoxin)." }
    status: unverified
  - id: endo.L03.022
    kind: card
    topic: pthrp
    front: Which tumour raises 1,25-dihydroxyvitamin D to cause hypercalcaemia?
    back: Especially B-cell lymphoma.
    src: { page: 35, quote: "1,25 Dihydroxy vit. D is increased especially in B cell lymphoma." }
    status: unverified
  - id: endo.L03.023
    kind: enumerate
    topic: pthrp
    prompt: Three mechanisms of hypercalcaemia in malignancy.
    points:
      - Humoral hypercalcaemia of malignancy (PTHrP, rarely PTH)
      - Local osteolytic hypercalcaemia (cytokines from lymphoma, leukaemia, myeloma)
      - Hypervitaminosis D (1,25-dihydroxyvitamin D, B-cell lymphoma)
    pass: 3
    src: { page: 35, quote: "1) Humoral hypercalcemia of Malignancy “HHM”" }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.024
    kind: enumerate
    topic: pthrp
    prompt: Clinical picture of ectopic PTHrP hypercalcaemia.
    points:
      - Asymptomatic
      - "Renal: stones, polyuria, polydipsia, renal failure"
      - "GI: nausea, vomiting, constipation, peptic ulcer, pancreatitis"
      - "Bone and eye: bone pain, proximal myopathy, keratitis"
      - "CNS: lethargy, fatigue, confusion, stupor"
    pass: 4
    src: { page: 35, quote: "Renal stone, polyuria, polydipsia, renal failure. Nausea, vomiting, constipation, peptic ulcer and pancreatitis." }
    status: unverified
  - id: endo.L03.025
    kind: card
    topic: pthrp
    front: When was the first case of hypercalcaemia with a malignant tumour reported?
    back: "1924."
    src: { page: 35, quote: "The first case of hypercalcemia with malignant tumor was reported at 1924." }
    status: unverified
