  - id: neph.L05.lesson4
    title: "الكرياتينين بيوصل متأخر"
    hook: "ساعة الكرياتينين دايمًا متأخرة. ليه، وإيه البديل؟"
    minutes: 9
    pages: [116, 120]
    topics: [biomarkers]
    goals:
      - "تعرف أدوات الـ risk assessment الجديدة"
      - "تفهم ليه الـ creatinine متأخر وليه ممكن يكدب في الناحيتين"
      - "تعرف أدوار الـ biomarkers وليه الـ cystatin C أحسن"
    status: unverified
    steps:
      - kind: explain
        remind: [neph.L05.101]
        page: 116
        title: "أدوات جديدة من 2012"
        quote: "RISK ASSESSMENT TOOLS SINCE 2012"
        text: |
          الحالات زادت (156 ← 925 بين السبعينات والتمانينات) والـ mortality فضلت **فوق 50%**. علشان كده ظهرت أدوات جديدة:
          - **Renal angina index**
          - ==Renal functional reserve== assessment
          - **New biomarkers:** [TIMP-2]×[insulin-like growth factor-binding protein 7 (IGFBP7)]
      - kind: figure
        page: 116
        quote: "AKI: Changing Pattern"
        title: "الـ AKI بقى في الـ ICU: رسمة الكتاب"
        image: { file: neph/L05-changing-pattern.webp, book: true }
        alt: "Book slide 'AKI: changing pattern' with two pie charts. 1970-1980: 156 incident cases, ward 85% and ICU 15%, mortality 58%. 1980-1990: 925 incident cases, ICU 92% and ward 8%, mortality 54%."
        caption: |
          دايرتين جنب بعض:

          - **شمال، 1970–1980**: **156** حالة. الأزرق **Ward 85%**، والبرتقاني intensive care unit (**ICU**) **15%**. **Mortality 58%**.
          - **يمين، 1980–1990**: **925** حالة. البرتقاني بقى **ICU 92%**، والـ **Ward 8%** بس. **Mortality 54%**.

          يعني الحالات زادت حوالي 6 مرات، والمكان ==اتقلب من الـ ward للـ ICU==، والـ mortality ==فضلت فوق 50%==. وده اللي خلّى الأدوات الجديدة لازمة.
      - kind: explain
        page: 116
        quote: "RENAL ANGINA INDEX"
        title: "ليه اسمها renal angina؟"
        text: |
          الكتاب: من **2012** فيه أدوات جديدة: **renal angina index**، **renal functional reserve**، و **biomarkers** زي [TIMP-2]×[IGFBP7]. والـ creatinine = **functional marker**.

          التفسير المقبول (مش في الكتاب): الكلمة جاية من الـ **angina** في القلب: في القلب بنتصرف على الألم والـ troponin **قبل** ما الـ infarct يكمل. الفكرة هنا إننا نجمع **مين في خطر** (عيان ICU، على جهاز تنفس أو pressors) مع **علامة بدرية** (creatinine بيبدأ يعلى أو مية زيادة)، **عشان** نتصرف قبل ما الـ AKI يبان كامل.
      - kind: explain
        page: 117
        title: "Function ولا damage؟"
        quote: "Biomarkers are Foot Prints of Actual Organ Damage Biomarkers, New Hotness"
        text: |
          - الـ **creatinine** = functional marker، بيتأثر متأخر وممكن ما يتأثرش خالص بسبب الـ ==renal reserve==.
          - الـ **biomarkers** = ==footprints== للضرر نفسه.
          - وفيه ارتفاع **creatinine** من غير ضرر: prerenal، hepatorenal syndrome (HRS)، cardiorenal syndrome (CRS)، renin–angiotensin–aldosterone system (RAAS) inhibition.
      - kind: figure
        page: 117
        quote: "Biomarkers are Foot Prints of Actual Organ Damage"
        title: "الـ biomarkers بتطلع إمتى: رسمة الكتاب"
        image: { file: neph/L05-biomarker-footprints.webp, book: true }
        alt: "Book diagram. Top row: normal tubular epithelium, then ischemia-reperfusion or toxicity leads to damaged cells, then necrosis and apoptosis lead to cell death. Under damage, a purple box 'Potential urinary biomarkers for early diagnosis of AKI' lists fifteen markers such as cystatin C, KIM-1, NGAL, IL-18 and microalbumin; on the left a drawing of a tubule cell is labelled TIMP-2 - IGFBP7. Under cell death, arrows lead to a fall in GFR and then to a brown box 'Delayed biomarkers for kidney injury': rising serum creatinine and blood urea nitrogen."
        caption: |
          صف فوق من الشمال لليمين: **Normal epithelium** ← (ischemia/reperfusion أو toxicity) ← **Damage** ← **Cell death** (necrosis و apoptosis).

          - **تحت الـ Damage**: الصندوق البنفسجي **Potential urinary biomarkers for early diagnosis of AKI**، زي cystatin C، kidney injury molecule-1 (KIM-1)، neutrophil gelatinase-associated lipocalin (NGAL)، interleukin-18 (IL-18)، microalbumin. وشمال رسمة خلية tubule مكتوب تحتها **TIMP-2 - IGFBP7**.
          - **تحت الـ Cell death**: سهم لـ **↓GFR**، وبعدين الصندوق البني **Delayed biomarkers for kidney injury**: serum creatinine و blood urea nitrogen.

          يعني الـ biomarkers ==بتطلع مع الضرر نفسه==، والـ creatinine ==بيستنى لحد ما الخلايا تموت== والـ glomerular filtration rate (GFR) يقع.
      - kind: order
        page: 118
        quote: "Multiple Timezones of AKI and Organ Damage Clock\nDamage: 10:00 am - Sun\nGFR: 11:00 pm - Sun\nOliguria: 12:00 pm - Sun\nCreatinine: 01:00 am - Mon\nThe sCreatinine clock is always late"
        prompt: "رتّب ساعة الضرر بعد الـ insult، من الأبدر للأخر:"
        steps:
          - "Damage"
          - "GFR falls"
          - "Oliguria"
          - "Creatinine rises"
        why: "الضرر بيبدأ الساعة 10 الصبح، وبعدين الـ glomerular filtration rate (GFR) بينزل، وبعدين الـ oliguria، والـ ==creatinine== آخر واحد بيعلى (1 بالليل). الكرياتينين ساعته دايمًا متأخرة."
      - kind: explain
        page: 118
        quote: "Multiple Timezones of AKI and Organ Damage Clock\nDamage: 10:00 am - Sun\nGFR: 11:00 pm - Sun\nOliguria: 12:00 pm - Sun\nCreatinine: 01:00 am - Mon\nThe sCreatinine clock is always late"
        title: "ساعة الضرر: ليه الـ creatinine آخر واحد؟"
        text: |
          الرسمة في ص 118 (Organ Damage Clock): بعد الـ **insult** (ischemia/reperfusion أو toxicity) الخلية بتتأذى الأول، وبعدين الـ biomarkers تطلع، والـ **creatinine** **late**.

          التفسير المقبول (مش في الكتاب): الـ creatinine **مش جاي** من الخلية المجروحة؛ هو بيتراكم في الدم **لأن** الفلترة قلت. الكلية فيها reserve، **فـ** لازم ضرر كبير قبل ما الفلترة الكلية تقل، وبعدها لازم ساعات لحد ما يتراكم. الـ biomarkers بقى بتطلع **من الخلية نفسها** وهي بتتجرح، **يعني** بتسبق بيوم أو اتنين.
      - kind: explain
        page: 119
        quote: "Limitations of SCr-based AKI definition"
        title: "Function ولا structure: أربع خانات"
        text: |
          الكتاب (ص 119، **Limitations of SCr-based AKI definition**): فيه **structural kidney injury** من غير ما الـ SCr يتحرك (**renal reserve**، **SCr kinetics**، **decreased production**)، وفيه SCr عالي من غير damage (**pre-renal azotemia**، **hepatorenal**، **cardiorenal**، **RAAS inhibition**). وكمان الـ SCr مالوش معلومات عن الـ **phenotype**: etiology، molecular pathways، therapy، prognosis.

          التفسير المقبول (مش في الكتاب):

          - **Decreased production:** الـ creatinine جاي من العضل. العيان الهزيل أو اللي في الـ ICU من أسابيع بيعمل creatinine أقل، **فـ** الرقم يبان طبيعي وهو مش طبيعي.
          - **Renal reserve:** nephrons تانية بتشيل الشغل، **فـ** الرقم ما بيتحركش رغم الضرر.

          **عشان** كده محتاجين حاجة تقيس **الضرر** نفسه.
      - kind: figure
        page: 119
        quote: "Limitations of SCr-based AKI definition"
        title: "Biomarker و creatinine: أربع خانات"
        image: { file: neph/L05-function-damage-grid.webp, book: true }
        alt: "Book 2 by 2 grid. Columns: no damage, damage. Rows: no functional change, functional change. Top left, green: no AKI, biomarker negative and creatinine negative. Top right: subclinical AKI, biomarker positive and creatinine negative. Bottom left: functional AKI, biomarker negative and creatinine positive. Bottom right, red: established AKI, both positive. Blue arrows show progression from subclinical and from functional AKI to established AKI; black arrows show resolution back."
        caption: |
          عمودين (**No damage** و **Damage**) وصفين (**No functional change** و **Functional change**). **Bm** = biomarker و **sCr** = serum creatinine:

          - **فوق شمال، أخضر: No AKI**: Bm− sCr−.
          - **فوق يمين: Subclinical AKI**: Bm+ sCr−: ==فيه ضرر والـ creatinine ساكت==.
          - **تحت شمال: Functional AKI**: Bm− sCr+: الـ creatinine علي من غير ضرر (زي الـ prerenal).
          - **تحت يمين، أحمر: Established AKI**: Bm+ sCr+.
          - **الأسهم**: الزرقا = **Progression** من الـ subclinical (لتحت) ومن الـ functional (لليمين) للـ established، والسودا = **Resolution** بالعكس.

          يعني الـ creatinine لوحده بيشوف صف واحد بس، والـ biomarker هو اللي ==بيكشف الخانة اللي فوق يمين==.
      - kind: check
        page: 119
        quote: "Limitations of SCr-based AKI definition"
        question: "On the limitations figure, which raises serum creatinine without structural kidney damage?"
        options:
          - "RAAS inhibition"
          - "Ischemic acute tubular necrosis"
          - "Aminoglycoside toxicity"
          - "Rhabdomyolysis"
        answer: 0
        why:
          - "صح: الـ **RAAS inhibition** (ومعاها pre-renal azotemia و HRS و CRS) بتعلّي الـ SCr من غير damage، لأنها بتغيّر الضغط جوه الـ glomerulus بس (التفسير مش في الكتاب)."
          - "الـ ATN damage حقيقي."
          - "الـ aminoglycosides بتموّت خلايا الـ tubule."
          - "الـ myoglobin بيأذي الـ tubule مباشرة."
      - kind: explain
        page: 120
        quote: "Roles of novel biomarkers"
        title: "الـ biomarker بيجاوب على إيه؟"
        text: |
          الكتاب (ص 120، **roles of novel biomarkers**): في الأول **diagnosis** (detection of early injury، location و etiology، determination of therapy)، وبعدين **prognosis** (extent of injury، ongoing injury، initiation of recovery، risk of worsening)، وفي الآخر **later course** (risk of CKD/ESRD، mortality، renal reserve).

          التفسير المقبول (مش في الكتاب): الـ creatinine رقم واحد بيجاوب سؤال واحد بس (الفلترة قلت ولا لأ). كل سؤال من دول محتاج معلومة **مختلفة**، **عشان** كده فيه biomarkers كتير: كل واحد بيطلع من مكان مختلف في الـ nephron وفي وقت مختلف.
      - kind: figure
        page: 120
        quote: "Roles of novel biomarkers"
        title: "الـ biomarker في كل مرحلة: رسمة الكتاب"
        image: { file: neph/L05-biomarker-roles.webp, book: true }
        alt: "Book diagram 'Roles of novel biomarkers'. A black bar labelled serum creatinine rises under an orange 'AKI insult' label; a curve climbs through three numbered heptagons. 1 (blue): diagnosis, detection of early injury, location and etiology, determination of therapy. 2 (green): early prognosis, extent of injury, ongoing injury, initiation of recovery, risk of worsening. 3 (yellow): later course, risk of future CKD or ESRD, risk of mortality, renal reserve. Arrows from 3 lead to ESRD results, CKD results and full recovery."
        caption: |
          - **شمال**: العمود الأسود **Serum Creatinine** تحت **AKI Insult**.
          - **المنحنى** بيطلع على 3 أشكال سباعية مترقمة: **1 تحت، أزرق: Diagnosis** (early injury، location و etiology، determination of therapy)، و **2 في النص، أخضر: Early Prognosis** (extent، ongoing injury، initiation of recovery، risk of worsening)، و **3 فوق، أصفر: Later Course** (risk of CKD/end-stage renal disease (ESRD)، mortality، renal reserve).
          - **يمين**: 3 أسهم من رقم 3 لـ **ESRD Results** و **CKD Results** و **Full Recovery**.

          يعني الـ biomarker ==مش للتشخيص بس==: بيرافق العيان من ==أول ساعة== لحد ما نعرف الكلية ==رجعت ولا لأ==.
      - kind: explain
        page: 120
        quote: "Superior to serum creatinine, as a surrogate marker of early and subtle"
        title: "ليه الـ cystatin C أحسن من الـ creatinine؟"
        text: |
          الكتاب: الـ **cystatin C** **superior** للـ creatinine كـ surrogate للتغييرات **البدرية والخفيفة**، بيلاقي الـ injury والـ creatinine لسه طبيعي، وبيكشف الـ AKI **24–48 ساعة** بدري.

          التفسير المقبول (مش في الكتاب): الـ cystatin C بتعمله **كل الخلايا** بمعدل ثابت تقريبًا، مش العضل بس، **فـ** مش بيتأثر بالهزال ولا بالأكل زي الـ creatinine. والجسم فيه كمية أقل منه، **يعني** لما الفلترة تقل مستواه بيعلى أسرع. لاحظ إنه لسه **functional** marker زي الـ creatinine، بس أسرع وأدق.
      - kind: check
        page: 120
        quote: "Allows detection of AKI, 24-48 hours earlier than serum creatinine"
        question: "Which marker is a better functional surrogate than creatinine for early, subtle GFR change?"
        options:
          - "Cystatin C"
          - "KIM-1"
          - "Urine sodium"
        answer: 0
        why:
          - "صح: الـ cystatin C بيكشف الـ acute kidney injury (AKI) قبل الكرياتينين بـ 24–48 ساعة، حتى والكرياتينين normal."
          - "الـ KIM-1 marker للـ severity والـ outcomes."
          - "الـ urine sodium بيفرّق prerenal عن acute tubular necrosis (ATN)."
