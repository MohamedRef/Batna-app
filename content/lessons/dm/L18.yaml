        text: |
          الكتاب بيرتّب سبع خطوات. المنطق ورا كل خطوة:

          1. **Non-pharmacological** للكل.
          2. ==Losartan، fenofibrate، amlodipine==: أدوية ليها uricosuric action. التفسير المقبول (مش في الكتاب): مريض الـ gout غالبًا عنده ضغط ودهون، فلو هتعالجهم، اختار اللي بينزّل الـ uric acid كمان بدل الـ thiazide.
