            <text x="55" y="288" text-anchor="middle" class="t-sm t-b">Cohort</text>
            <text x="55" y="304" text-anchor="middle" class="t-sm t-mut">exposure → outcome</text>
            <rect x="115" y="270" width="100" height="44" rx="6" class="fg-box"/>
            <text x="165" y="288" text-anchor="middle" class="t-sm t-b">Case-control</text>
            <text x="165" y="304" text-anchor="middle" class="t-sm t-mut">outcome → exposure</text>
            <rect x="225" y="270" width="100" height="44" rx="6" class="fg-box"/>
            <text x="275" y="288" text-anchor="middle" class="t-sm t-b">Cross-sectional</text>
            <text x="275" y="304" text-anchor="middle" class="t-sm t-mut">same time</text>
            <path d="M190 258L60 266M200 258L165 266M210 258L270 266" class="fg-thin"/>
            <text x="165" y="345" text-anchor="middle" class="t-sm t-acc t-b">Today: the left branch only</text>
          </svg>
      - kind: check
        page: 8
        quote: "Non randomized interventional studies (Quazi experimental trials)"
        question: "A surgeon gives a new wound dressing to all patients on his own ward and compares infection rates with the ward next door. Which design is this?"
        options:
          - "Non-randomised (quasi-experimental) trial"
          - "Randomised controlled trial"
          - "Cohort study"
          - "Case-control study"
        answer: 0
        why:
          - "صح: هو اللي اختار مين ياخد الـ dressing (assigned)، بس من غير random allocation."
          - "مفيش randomization؛ العنبر هو اللي حدّد، مش القرعة."
          - "في الـ cohort الباحث بيتفرّج على exposure موجود، هنا هو اللي ادّاه."
          - "الـ case-control بيبدأ من الـ outcome ويرجع يدوّر على الـ exposure."
      - kind: explain
        page: 4
        quote: "Based on ability to control for bias and to demonstrate cause and effect in humans"
        title: "هرم الـ evidence: ليه الـ RCT فوق؟"
        text: |
          الهرم مترتّب على حاجة واحدة: ==ability to control for bias== وإن التصميم يقدر **يثبت cause and effect في البني آدمين**.

          - فوق خالص: **clinical practice guidelines** و **meta-analysis / systematic reviews**. دول **secondary (filtered, pre-appraised)**: بيلمّوا دراسات تانية.
          - بعدهم الـ **primary studies**: الـ **RCT** (prospective, tests treatment)، تحته **cohort**، تحته **case-control**.
          - تحتهم **case report / case series** و expert opinion و editorials: الهرم بيسميهم **no design**.
          - وفي القاع **animal and laboratory studies**: مفيهاش بني آدمين أصلًا.
      - kind: figure
        page: 4
        quote: "Hierarchy of Research Designs & Levels of Scientific Evidence"
        title: "الهرم"
        alt: "Evidence pyramid from top to bottom: clinical practice guidelines, meta-analysis and systematic reviews (secondary, filtered), randomized controlled trial, cohort studies, case-control studies (primary), case reports and series and expert opinion (no design), animal and laboratory studies (not in humans)."
        caption: "كل ما تطلع لفوق، الـ bias بيقل والقدرة على إثبات السببية بتزيد. الـ RCT أعلى **primary** design."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <path d="M140 10h50l14 34h-78z" class="fg-thin"/>
            <text x="165" y="32" text-anchor="middle" class="t-sm">Guidelines</text>
            <path d="M126 44h78l14 34h-106z" class="fg-thin"/>
            <text x="165" y="66" text-anchor="middle" class="t-sm">Meta-analysis / SR</text>
            <path d="M112 78h106l14 34h-134z" class="fg-good"/>
            <text x="165" y="100" text-anchor="middle" class="t-sm t-b">RCT</text>
            <path d="M98 112h134l14 34h-162z" class="fg-box"/>
            <text x="165" y="134" text-anchor="middle" class="t-sm">Cohort</text>
            <path d="M84 146h162l14 34h-190z" class="fg-box"/>
            <text x="165" y="168" text-anchor="middle" class="t-sm">Case-control</text>
            <path d="M70 180h190l14 34h-218z" class="fg-bad"/>
            <text x="165" y="202" text-anchor="middle" class="t-sm">Case report / series, opinion</text>
            <path d="M56 214h218l14 34h-246z" class="fg-thin"/>
            <text x="165" y="236" text-anchor="middle" class="t-sm">Animal and lab studies</text>
            <text x="8" y="50" class="t-sm t-mut">Secondary</text>
            <text x="8" y="134" class="t-sm t-acc t-b">Primary</text>
            <text x="8" y="202" class="t-sm t-bad">No design</text>
            <text x="276" y="236" class="t-sm t-mut">No humans</text>
            <text x="165" y="276" text-anchor="middle" class="t-sm t-mut">Up = less bias, stronger cause and effect</text>
          </svg>
      - kind: order
        page: 4
        quote: "Hierarchy of Research Designs & Levels of Scientific Evidence"
        prompt: "رتّب هرم الـ evidence من فوق لتحت:"
        steps:
          - "Clinical practice guidelines"
          - "Meta-analysis and systematic reviews"
          - "Randomized controlled trial"
          - "Cohort studies"
          - "Case-control studies"
          - "Case reports and expert opinion"
          - "Animal and laboratory studies"
        why: "الترتيب على قد ما التصميم يقدر **يتحكم في الـ bias ويثبت cause and effect في الإنسان**. الـ RCT أعلى primary study لأن الباحث هو اللي بيوزّع الـ exposure بالقرعة."
      - kind: explain
        page: 6
        quote: "New methods of primary prevention New programs of screening"
        title: "بنجرّب إيه بالـ RCT؟ مش أدوية بس"
        text: |
          ناس كتير فاكرة الـ trial يعني دوا. المحاضرة بتعدّ **7 حاجات** ممكن نقيّمها:

          - **New drugs** و new treatment of diseases
          - **New medical and health care technology** (جهاز، عملية)
          - **New methods of primary prevention** (vaccine مثلًا)
          - **New programs of screening**
          - **New ways of organizing and delivering health services** (زي نظام حجز جديد في العيادات)
          - **New community health programs**
          - **New behavioral intervention programs** (برنامج للإقلاع عن التدخين)
      - kind: aside
        tone: joke
        page: 7
        quote: "published in the British Medical Journal in 1948, tested whether streptomycin is effective in treating tuberculosis"
        text: |
          أول RCT في الطب: **Sir Austin Bradford Hill**، الـ Medical Research Council في إنجلترا، اتنشر في الـ **BMJ سنة 1948**، وجرّب **streptomycin** في الـ **tuberculosis**.

          قبلها كان الـ evidence عبارة عن: «يا دكتور أنا جرّبته على تلات عيانين وبقوا زي الفل». 😄 ومن ساعتها الجملة دي بقت **case series**، تحت في الهرم.
      - kind: explain
        page: 12
        quote: "RCT is an experiment in which subjects in a population are randomly allocated into groups"
        title: "يعني إيه RCT بالظبط؟"
        text: |
          ==RCT== = experiment الناس فيه بيتوزّعوا **randomly** على مجموعتين:

          - **Intervention group**: بياخد الـ preventive أو therapeutic intervention.
          - **Control group**: بياخد واحد من 3: **placebo**، أو **no treatment**، أو **usual care** (اسمها **active control**).

          وبعدين **نقارن الـ outcomes**.

          وفي الـ RCT إحنا اللي **بنتحكم في الـ exposure**: نوعه، كميته، ومدته.
      - kind: mnemonic
        page: 11
        quote: "We are controlling the exposure (intervention ) regarding: Type Amount Duration"
        word: "TAD"
        parts:
          - { key: "T", text: "Type: نوع الـ intervention (أنهي دوا، أنهي برنامج)" }
          - { key: "A", text: "Amount: الجرعة أو الكمية" }
          - { key: "D", text: "Duration: المدة" }
        hook: "في الـ cohort الناس بتختار الـ exposure بمزاجها. في الـ RCT إنت اللي ماسك **TAD**: النوع والكمية والمدة."
      - kind: match
        page: 12
        quote: "A control to receive : placebo no treatment usual care (active control)"
        prompt: "وصّل كل control group بنوعه:"
        pairs:
          - ["Sugar pills that look like the new drug", "Placebo"]
          - ["The drug they would get in clinic anyway", "Usual care (active control)"]
          - ["Nothing at all, just follow-up visits", "No treatment"]
        why: "الـ **placebo** شكله زي الدوا ومفيهوش مادة فعالة. الـ **usual care** هو العلاج المعتاد، فاسمه **active control**. والـ **no treatment** متابعة بس."
      - kind: reveal
        page: 8
        quote: "Randomization is a key feature"
        prompt: "المحاضرة بتقول ==Randomization is a key feature==. ليه القرعة مهمة أوي كده؟"
        answer: |
          لأن القرعة بتوزّع كل حاجة **بالتساوي** بين المجموعتين: السن، الشدة، التدخين، وحتى الحاجات اللي إنت متعرفهاش ومش بتقيسها.

          فلو لقيت فرق في الـ outcome، يبقى غالبًا من الـ intervention نفسه، مش من إن الدكتور ادّى الدوا الجديد للعيانين الأحسن. (الـ randomization بتمنع **confounding bias**، وهنرجعلها في درس الـ blinding.)
      - kind: try
        items: [res.L06.001, res.L06.012, res.L06.013]
    recap:
      - "Experimental = الباحث هو اللي **assigned** الـ exposure. لو بالقرعة: RCT. من غير قرعة: quasi-experimental."
      - "الهرم مترتّب على التحكم في الـ bias وإثبات السببية؛ الـ RCT أعلى primary design."
      - "أول RCT: Bradford Hill، BMJ 1948، streptomycin للـ TB."
      - "الـ control: placebo، no treatment، أو usual care (active control)."
      - "في الـ RCT بنتحكم في الـ exposure: Type, Amount, Duration."
    practice: [res.L06.001, res.L06.002, res.L06.003, res.L06.004, res.L06.005, res.L06.006, res.L06.007, res.L06.008, res.L06.009, res.L06.010, res.L06.011, res.L06.012, res.L06.013, res.L06.014]
  # ------------------------------------------------------------------
  - id: res.L06.lesson2
    title: "علاج ولا وقاية؟ أحسن ولا مش أوحش؟"
    hook: "دوا أرخص وأقل أعراض جانبية... محتاج يثبت إنه أحسن؟ ولا كفاية إنه مش أوحش؟"
    minutes: 9
    pages: [13, 35]
    topics: [trial-types, superiority]
    goals:
      - "تفرّق بين therapeutic و preventive trial"
      - "تفرّق بين efficacy و effectiveness"
      - "تختار بين superiority و equivalence و non-inferiority"
    status: unverified
    steps:
      - kind: explain
        page: 13
        quote: "Based on the aspects of interventions being evaluated Based on how participants are exposed to interventions"
        title: "4 طرق نصنّف بيها الـ RCT"
        text: |
          نفس التجربة ممكن توصفها بـ 4 طرق مختلفة، وكل طريقة بتجاوب سؤال:

          - **Aspect of the intervention**: علاج ولا وقاية؟ (الدرس ده)
          - **How participants are exposed**: parallel، crossover، factorial... (الدرس الجاي)
          - **Superiority vs equivalence**: عايز تثبت إيه؟ (الدرس ده)
          - **Who knows what**: الـ blinding (درس لوحده)

          يعني تجربة واحدة ممكن تبقى «therapeutic, parallel, non-inferiority, double-blind» في نفس الوقت.
      - kind: explain
        page: 14
        quote: "Testing the efficacy of a therapeutic procedure (Drug, Surgical procedure etc.)"
        title: "Therapeutic ولا preventive؟"
        text: |
          - ==Clinical (therapeutic) trial==: بيختبر efficacy لـ **therapeutic procedure**: دوا، عملية جراحية.
          - ==Preventive trial==: بيختبر efficacy لـ **preventive procedure**: vaccine، sera، chemoprophylaxis، personal protective measure، exercise programme.

          أمثلة المحاضرة:
          - Therapeutic: **β-Blocker Heart Attack Trial (B-HAT)**، JAMA 1981.
          - Prevention: تجربة **perinatal transmission of HIV**، NEJM 1994.
      - kind: sort
        page: 14
        quote: "Testing the efficacy of a preventive procedure (Vaccine, Sera, Chemoprophylaxis, personal protective measure, exercise programme etc.)"
        prompt: "حط كل trial في نوعه:"
        bins: ["Therapeutic", "Preventive"]
        cards:
          - { text: "Beta-blocker after a heart attack", bin: 0 }
          - { text: "New laparoscopic surgical procedure", bin: 0 }
          - { text: "Hepatitis B vaccine for healthcare workers", bin: 1 }
          - { text: "Chemoprophylaxis for travellers", bin: 1 }
          - { text: "Exercise programme to prevent diabetes", bin: 1 }
          - { text: "Antiretroviral drug to stop mother-to-baby HIV", bin: 1 }
        why: "اسأل نفسك: الناس دي **عيانة** وبنعالجها؟ ولا **سليمة** وبنمنع عنها المرض؟ الـ B-HAT علاج بعد الـ MI. الـ HIV trial وقاية للطفل من العدوى، حتى لو الدوا اتدّى للأم."
      - kind: explain
        page: 17
        quote: "Efficacy—does the intervention work in the people who actually receive it ?"
        title: "Efficacy ولا effectiveness؟"
        text: |
          - ==Efficacy==: الـ intervention **بيشتغل في اللي فعلًا خدوه**؟ تجارب **explanatory**، على ناس **highly selected**، تحت ظروف **research**.
          - ==Effectiveness==: بيشتغل إزاي **في اللي اتعرض عليهم**؟ تجارب **pragmatic**، تحت ظروف **usual**.

          الفرق في كلمة: **received** ولا **offered**.
      - kind: aside
        tone: analogy
        page: 17
        quote: "Efficacy—does the intervention work in the people who actually receive it ?"
        text: |
          **Efficacy** زي وصفة الكشري في مطبخ الشيف: المكونات متقاسة بالجرام، والشيف واقف بنفسه. هل الوصفة **ممكن** تطلع حلوة؟

          **Effectiveness** نفس الوصفة في بيتك، بالحلّة اللي عندك، ومراتك نسيت الدقة. هل هتطلع حلوة **في الحقيقة**؟

          الدوا ممكن يبقى efficacious جدًا في التجربة، ومع العيانين اللي بينسوا الجرعات في العيادة الـ effectiveness بتاعته تقل.
      - kind: check
        page: 17
        quote: "Effectiveness—how does the intervention work in those offered. it tend to be pragmatic"
        question: "A trial gives a new asthma inhaler to every patient who attends the outpatient clinics of a health-insurance hospital, with no extra visits or reminders. What does it measure?"
        options:
          - "Effectiveness (pragmatic trial)"
          - "Efficacy (explanatory trial)"
          - "Safety only (phase I)"
          - "Equivalence"
        answer: 0
        why:
          - "صح: اتعرض على كل اللي جايين، تحت ظروف **usual**؛ ده pragmatic."
          - "الـ efficacy محتاج ناس highly selected وظروف research."
          - "الـ phase I على healthy volunteers علشان الـ dose، مش في العيادة."
          - "الـ equivalence عن الـ hypothesis (مفيش فرق)، مش عن الظروف."
      - kind: explain
        page: 18
        quote: "Superiority trials Equivalence trials Non inferiority trials"
        title: "عايز تثبت إيه؟"
        text: |
          3 أنواع على حسب **السؤال**:

          - ==Superiority==: الجديد **أحسن** من القديم.
          - ==Equivalence==: الجديد **زي** القديم (لا أحسن ولا أوحش).
          - ==Non-inferiority==: الجديد **مش أوحش** من القديم.
      - kind: figure
        page: 18
        quote: "Superiority trials Equivalence trials Non inferiority trials"
        title: "3 أسئلة على نفس الخط"
        alt: "A horizontal line from new drug worse on the left to new drug better on the right, with the old drug at the centre. Superiority claims the right side only; equivalence claims a narrow band around the centre; non-inferiority claims everything from just left of centre to the right."
        caption: "Superiority: عايز توقع يمين. Equivalence: في الحتة اللي في النص. Non-inferiority: أي حاجة **مش** شمال الخط المتقطع."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R06b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <path d="M10 40h306" class="fg-arrow" marker-end="url(#R06b)"/>
            <path d="M165 28v24" class="fg-ink"/>
            <text x="10" y="24" class="t-sm t-bad">New worse</text>
            <text x="320" y="24" text-anchor="end" class="t-sm t-good">New better</text>
            <text x="165" y="70" text-anchor="middle" class="t-sm t-mut">= old drug</text>
            <path d="M135 30v190" class="fg-thin"/>
            <path d="M195 30v190" class="fg-thin"/>
            <text x="8" y="104" class="t-sm t-b">Superiority</text>
            <rect x="195" y="90" width="125" height="22" rx="4" class="fg-good"/>
            <text x="8" y="154" class="t-sm t-b">Equivalence</text>
            <rect x="135" y="140" width="60" height="22" rx="4" class="fg-acc"/>
            <text x="8" y="204" class="t-sm t-b">Non-inferiority</text>
            <rect x="135" y="190" width="185" height="22" rx="4" class="fg-acc"/>
          </svg>
      - kind: reveal
        page: 19
        quote: "Fewer side effects, Greater convenience, Lower cost, Higher quality of life . Fewer drug interaction"
        prompt: "طب ليه حد يعمل trial علشان يثبت إن دواه **مش أوحش** بس؟ ما يثبت إنه أحسن!"
        answer: |
          لأن الجديد ساعات مش محتاج يبقى أقوى؛ كفاية إن عنده ميزة تانية:

          - **Fewer side effects**
          - **Greater convenience** (برشامة مرة في اليوم بدل حقنة)
          - **Lower cost**
          - **Higher quality of life**
          - **Fewer drug interactions**
          - وبصراحة المحاضرة بتقولها: وسيلة لملء السوق بأدوية متشابهة **علشان العيان يبقى عنده اختيارات**.
      - kind: explain
        page: 26
        quote: "Comparison of oral amoxicillin and intravenous benzyl penicillin for community acquired pneumonia in children"
        title: "مثال: PIVOT trial"
        text: |
          أطفال داخلين المستشفى بـ **community-acquired pneumonia**. نص ياخد **oral amoxicillin**، ونص **IV benzyl penicillin**.

          ده **multicentre pragmatic randomised equivalence trial** (Thorax 2007). والنتيجة: **equivalent**؛ الحرارة نزلت في **1.3 days** في المجموعتين.

          المكسب؟ الطفل ميتعذبش بالـ **cannula**، ويقعد في المستشفى أقل. ودي ميزة الـ equivalence: نفس النتيجة بوجع أقل.
      - kind: case
        page: 35
        quote: "less expensive and has fewer side effects, but its efficacy, relative to drug A, is not well established."
        stem: "Antibiotic A is the standard for community-acquired pneumonia but is expensive with many side effects. New antibiotic B is cheaper with fewer side effects; its efficacy relative to A is not established."
        steps:
          - question: "What is the best kind of trial to evaluate B?"
            options: ["Superiority", "Cross-over", "Cluster", "Non-inferiority", "Equivalence"]
            answer: 3
            why: "B مش محتاج يغلب A؛ ميزته السعر والأمان. كفاية نثبت إنه **مش أوحش**: non-inferiority، ودي إجابة المحاضرة. الـ crossover مينفعش في مرض acute زي الـ pneumonia."
          - question: "What should the control group receive?"
            options: ["Placebo", "No treatment", "Antibiotic A (active control)"]
            answer: 2
            why: "مينفعش تسيب pneumonia من غير antibiotic. المقارنة بالعلاج المعتاد، يعني active control."
      - kind: try
        items: [res.L06.021, res.L06.024, res.L06.027]
    recap:
      - "Therapeutic = بنعالج (دوا، عملية). Preventive = بنمنع (vaccine، chemoprophylaxis، exercise)."
      - "Efficacy: في اللي **خدوه**، explanatory، ظروف research. Effectiveness: في اللي **اتعرض عليهم**، pragmatic، ظروف usual."
      - "Superiority = أحسن. Equivalence = زيّه. Non-inferiority = مش أوحش."
      - "ليه non-inferiority؟ side effects أقل، أسهل، أرخص، quality of life أعلى، interactions أقل، اختيارات أكتر."
    practice: [res.L06.015, res.L06.016, res.L06.017, res.L06.018, res.L06.019, res.L06.020, res.L06.021, res.L06.022, res.L06.023, res.L06.024, res.L06.025, res.L06.026, res.L06.027, res.L06.083]
  # ------------------------------------------------------------------
  - id: res.L06.lesson3
    title: "اتوزّعوا إزاي؟ من parallel لـ cluster"
    hook: "العيان ياخد علاج واحد؟ ولا الاتنين بالدور؟ ولا نوزّع قرى بحالها؟"
    minutes: 10
    pages: [20, 34]
    topics: [allocation]
    goals:
      - "تعرّف parallel و crossover و factorial و split-body و cluster"
      - "تعدّ مميزات وعيوب وشروط الـ crossover"
      - "تحسب الـ washout period"
    status: unverified
    steps:
      - kind: explain
        page: 20
        quote: "Each participant is randomly assigned to a group, and all the participants in the group receives (or does not receive) an intervention"
        title: "Parallel: كل واحد في حارته"
        text: |
          ==Parallel-group==: كل مشارك بيتوزّع **randomly** على مجموعة، وكل المجموعة دي بتاخد (أو مبتاخدش) الـ intervention **طول التجربة**.

          زي حارتين في طريق سريع: كل عربية في حارتها لحد الآخر، وفي الآخر بنقارن مين وصل الأول. ده الأشهر: **78%** من الـ RCTs.
      - kind: figure
        page: 24
        quote: "Follow-up and outcome assessment"
        title: "Parallel قصاد crossover"
        alt: "Parallel design: group 1 gets treatment A then follow-up, group 2 gets treatment B then follow-up. Crossover design: group 1 gets A, washout, then B, then follow-up; group 2 gets B, washout, then A, then follow-up."
        caption: "في الـ parallel كل مجموعة بعلاج واحد. في الـ crossover المجموعتين بياخدوا الاتنين بالعكس، وفي النص **washout**."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <text x="165" y="18" text-anchor="middle" class="t-b">Parallel</text>
            <text x="8" y="50" class="t-sm">Group 1</text>
            <rect x="64" y="34" width="110" height="26" rx="5" class="fg-acc"/>
            <text x="119" y="52" text-anchor="middle" class="t-sm">Treatment A</text>
            <rect x="180" y="34" width="142" height="26" rx="5" class="fg-thin"/>
            <text x="251" y="52" text-anchor="middle" class="t-sm">Follow-up, outcome</text>
            <text x="8" y="90" class="t-sm">Group 2</text>
            <rect x="64" y="74" width="110" height="26" rx="5" class="fg-good"/>
            <text x="119" y="92" text-anchor="middle" class="t-sm">Treatment B</text>
            <rect x="180" y="74" width="142" height="26" rx="5" class="fg-thin"/>
            <text x="251" y="92" text-anchor="middle" class="t-sm">Follow-up, outcome</text>
            <text x="165" y="146" text-anchor="middle" class="t-b">Crossover</text>
            <text x="8" y="178" class="t-sm">Group 1</text>
            <rect x="64" y="162" width="70" height="26" rx="5" class="fg-acc"/>
            <text x="99" y="180" text-anchor="middle" class="t-sm">A</text>
            <rect x="138" y="162" width="74" height="26" rx="5" class="fg-thin"/>
            <text x="175" y="180" text-anchor="middle" class="t-sm t-mut">Washout</text>
            <rect x="216" y="162" width="70" height="26" rx="5" class="fg-good"/>
            <text x="251" y="180" text-anchor="middle" class="t-sm">B</text>
            <text x="8" y="218" class="t-sm">Group 2</text>
            <rect x="64" y="202" width="70" height="26" rx="5" class="fg-good"/>
            <text x="99" y="220" text-anchor="middle" class="t-sm">B</text>
            <rect x="138" y="202" width="74" height="26" rx="5" class="fg-thin"/>
            <text x="175" y="220" text-anchor="middle" class="t-sm t-mut">Washout</text>
            <rect x="216" y="202" width="70" height="26" rx="5" class="fg-acc"/>
            <text x="251" y="220" text-anchor="middle" class="t-sm">A</text>
            <text x="165" y="262" text-anchor="middle" class="t-sm t-acc t-b">Each subject is their own control</text>
          </svg>
      - kind: explain
        page: 22
        quote: "subjects are randomised to therapy 1 or 2 and after being observed for a period they switch therapy."
        title: "Crossover: كل واحد بياخد الاتنين"
        text: |
          في الـ ==planned crossover==: المشاركين بيتوزّعوا randomly على therapy 1 أو 2، وبعد فترة متابعة **بيبدّلوا**.

          فكل مشارك بقى ==his own control==. ده بيخلّي الخصائص الثابتة (السن، الوزن، الجينات، شدة المرض) **constant** بين العلاجين.

          وفيه كمان ==unplanned crossover==: مثال المحاضرة **bypass surgery**: ناس اتقرعوا على surgery ورفضوا العملية، وناس اتقرعوا على medical واحتاجوا عملية. دي مش تصميم، دي مشكلة بتحصل.
      - kind: reveal
        page: 25
        quote: "Comparisons within individuals Subjective outcomes can be used (with blinding) Reduces sample size needed"
        prompt: "ليه الـ crossover بيحتاج **sample size أصغر**؟"
        answer: |
          لأن المقارنة **within individuals**: بتقارن الحاج محمد بنفسه، مش بحد تاني.

          في الـ parallel الفرق بين الناس (واحد ضغطه 140 وواحد 180) بيعمل «دوشة» محتاج ناس كتير علشان تغطيها. لما الشخص هو control نفسه الدوشة دي بتختفي، فعدد أقل يكفي.
      - kind: sort
        page: 25
        quote: "Carryover Washout period Need to consider effect of the order of interventions (psychological response) Dropouts from 2nd treatment"
        prompt: "مميزات ولا عيوب الـ crossover؟"
        bins: ["Advantage", "Disadvantage"]
        cards:
          - { text: "Comparisons within individuals", bin: 0 }
          - { text: "Subjective outcomes can be used (with blinding)", bin: 0 }
          - { text: "Smaller sample size", bin: 0 }
          - { text: "Carryover", bin: 1 }
          - { text: "Washout period needed", bin: 1 }
          - { text: "Order effect (psychological response)", bin: 1 }
          - { text: "Dropouts from the 2nd treatment", bin: 1 }
        why: "العيوب كلها من فكرة «بالدور»: الدوا الأول ممكن يفضل شغّال (**carryover**)، فلازم **washout** يطوّل التجربة، والترتيب نفسه ممكن يأثر نفسيًا، والناس بتزهق وتمشي قبل العلاج التاني."
      - kind: explain
        page: 27
        quote: "The disease should be chronic ( Asthma , osteoarthritis ) and stable"
        title: "امتى ينفع crossover؟"
        text: |
          6 شروط في المحاضرة:

          - المرض **chronic and stable** (asthma، osteoarthritis). لو acute هيخف قبل الفترة التانية.
          - تأثير الدوا **يظهر جوه فترة العلاج**.
          - ==Washout = five times the half-life== للدوا.
          - **مينفعش غالبًا في vaccine trials** لأن الـ **immune system** اتأثر خلاص.
          - **ينفع في phase I**.
          - بيحتاج **sample size أصغر**.
      - kind: check
        page: 27
        quote: "Wash out period five times half life of the drug"
        question: "In a crossover trial of a drug with a half-life of 8 hours, what is the minimum washout period?"
        options: ["8 hours", "16 hours", "40 hours", "80 hours"]
        answer: 2
        why:
          - "ده half-life واحد بس؛ لسه نص الدوا موجود."
          - "اتنين half-lives لسه ربع الدوا موجود."
          - "صح: **5 × 8 = 40 hours**؛ بعد 5 half-lives الدوا تقريبًا خلص (أقل من 4%)."
          - "ده 10 half-lives؛ أطول من اللي المحاضرة طالباه."
      - kind: aside
        tone: trap
        page: 27
        quote: "Generally can not be used in vaccine trials because the immune system is affected"
        text: |
          فخ متكرر: «crossover vaccine trial». الـ vaccine بيسيب **memory** في الـ immune system، يعني الـ carryover **دايم**. مفيش washout ينفع. نفس المنطق لأي علاج بيشفي خالص (زي eradication الـ H. pylori).
      - kind: explain
        page: 28
        quote: "In which the two or more modalities are tested (both given, either one given, none given)."
        title: "Factorial: سؤالين بتجربة واحدة"
        text: |
          ==Factorial design==: بنختبر **two or more modalities** (interventions) في نفس التجربة: الاتنين (both given)، أو واحد بس، أو ولا حاجة (none given).

          مثال المحاضرة: **aspirin** للـ primary prevention من الـ cardiovascular disease، و **beta-carotene** للـ primary prevention من الـ cancer. بنقرع مرتين، فيطلع **4 مجموعات**.

          - الميزة: **informative, efficient and less expensive**.
          - العيوب: ممكن يبقى فيه **interaction** بين الاتنين (وده بيأثر على الـ sample size)، **complexity**، تأثير على الـ compliance والـ recruitment، و adverse effects من الـ **polypharmacy**.
      - kind: figure
        page: 29
        quote: "Two-by-two factorial study design"
        title: "الـ 2×2"
        alt: "Two-by-two factorial table. Rows: aspirin or aspirin placebo. Columns: beta-carotene or beta-carotene placebo. Four cells: both active, aspirin only, beta-carotene only, both placebos."
        caption: "قرعة أولى للـ aspirin، وقرعة تانية للـ beta-carotene. نص التجربة بيجاوب سؤال الـ aspirin، ونفس الناس بيجاوبوا سؤال الـ beta-carotene: **efficiency**."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <text x="210" y="18" text-anchor="middle" class="t-sm t-b">Beta-carotene</text>
            <text x="160" y="40" text-anchor="middle" class="t-sm">Active</text>
            <text x="260" y="40" text-anchor="middle" class="t-sm">Placebo</text>
            <text x="8" y="90" class="t-sm t-b">Aspirin</text>
            <text x="8" y="106" class="t-sm">active</text>
            <text x="8" y="170" class="t-sm t-b">Aspirin</text>
            <text x="8" y="186" class="t-sm">placebo</text>
            <rect x="110" y="50" width="100" height="70" rx="6" class="fg-good"/>
            <text x="160" y="82" text-anchor="middle" class="t-sm t-b">Both</text>
            <text x="160" y="100" text-anchor="middle" class="t-sm">active</text>
            <rect x="215" y="50" width="100" height="70" rx="6" class="fg-acc"/>
            <text x="265" y="82" text-anchor="middle" class="t-sm t-b">Aspirin</text>
            <text x="265" y="100" text-anchor="middle" class="t-sm">only</text>
            <rect x="110" y="128" width="100" height="70" rx="6" class="fg-acc"/>
            <text x="160" y="160" text-anchor="middle" class="t-sm t-b">Beta-carotene</text>
            <text x="160" y="178" text-anchor="middle" class="t-sm">only</text>
            <rect x="215" y="128" width="100" height="70" rx="6" class="fg-thin"/>
            <text x="265" y="160" text-anchor="middle" class="t-sm t-b">Both</text>
            <text x="265" y="178" text-anchor="middle" class="t-sm">placebo</text>
          </svg>
      - kind: check
        page: 30
        quote: "Possibility of the existence of interaction and its impact on the sample size"
        question: "The factorial study design increases which of the following?"
        options: ["Power of the study", "Generalizability", "Internal validity", "Study efficiency"]
        answer: 3
        why:
          - "بالعكس، الـ interaction ممكن تكبّر الـ sample size المطلوب."
          - "الـ generalizability من مين اشترك، مش من شكل التصميم."
          - "الـ internal validity من الـ randomization والـ blinding، موجودين في أي RCT."
          - "صح، وده سؤال المحاضرة: سؤالين بتجربة واحدة = **efficient, less expensive**."
      - kind: explain
        page: 32
        quote: "pre-existing groups of participants (e.g., villages, schools) are randomly selected to receive (or not receive) an intervention"
        title: "Split-body و cluster"
        text: |
          - ==Split-body==: **أجزاء من جسم نفس الشخص** بتتقرع: الناحية اليمين من الوش تاخد الكريم الجديد والشمال القديم. (طب الجلد والأسنان بيحبوه.)
          - ==Cluster==: بنقرع **مجموعات موجودة أصلًا**: قرى، مدارس. مثلًا 40 قرية في سوهاج، 20 ياخدوا برنامج مياه نضيفة و20 لأ.

          ليه cluster؟ لأن فيه interventions مينفعش تدّيها لفرد: مينفعش تعمل حملة توعية لنص التلاميذ في نفس الفصل، الكلام هيتنقل في الفسحة.
      - kind: match
        page: 32
        quote: "separate parts of the body of each participant (e.g., the left and right sides of the face) are randomized"
        prompt: "وصّل كل سيناريو بالتصميم:"
        pairs:
          - ["New acne cream on one random side of each face", "Split-body"]
          - ["Schools randomised to a hand-washing campaign", "Cluster"]
          - ["Asthma patients take inhaler A then B after a washout", "Crossover"]
          - ["Aspirin or placebo, then beta-carotene or placebo", "Factorial"]
          - ["Each patient stays on drug A or drug B throughout", "Parallel"]
      - kind: aside
        tone: exam
        page: 33
        quote: "78% were parallel-group trials, 16% were crossover, 2% were split-body, 2% were cluster."
        text: |
          رقم ممكن يجي: من **616 RCT** في PubMed (ديسمبر 2006): **parallel 78%**، **crossover 16%**، **split-body 2%**، **cluster 2%**.

          افتكرها كده: الـ parallel هو «الفول» بتاع الـ RCTs، كل يوم على السفرة. والـ split-body والـ cluster «فسيخ شم النسيم»، مرة في السنة. 😄
      - kind: try
        items: [res.L06.029, res.L06.035, res.L06.036]
    recap:
      - "Parallel: كل واحد بعلاج واحد طول التجربة (78%)."
      - "Crossover: كل واحد بياخد الاتنين بالدور، فهو control نفسه؛ sample أصغر، بس carryover و washout و order effect و dropouts."
      - "شروط الـ crossover: مرض chronic stable، washout = 5 half-lives، مش للـ vaccines، ينفع في phase I."
      - "Factorial: intervention اتنين في تجربة واحدة (aspirin + beta-carotene)؛ بيزوّد الـ efficiency."
      - "Split-body: أجزاء من نفس الجسم. Cluster: قرى أو مدارس."
    practice: [res.L06.028, res.L06.029, res.L06.030, res.L06.031, res.L06.032, res.L06.033, res.L06.034, res.L06.035, res.L06.036, res.L06.037, res.L06.038, res.L06.039, res.L06.040, res.L06.041, res.L06.042, res.L06.043, res.L06.044, res.L06.045, res.L06.046, res.L06.047, res.L06.048, res.L06.082]
