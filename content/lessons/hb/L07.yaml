          - "الـ HBeAg− hepatitis محتاج **DNA > 2,000** و **ALT elevated**."
          - "الـ immune tolerant يعني **HBeAg موجب** و DNA > 10⁷."
          - "الـ occult يعني **HBsAg سالب**، وهنا الـ HBsAg موجب."
      - kind: case
