schema: batna.lesson/v1
lecture: hb.L06
lessons:
  # ------------------------------------------------------------------
  - id: hb.L06.lesson1
    title: "من NAFLD لـ MASLD: الأسامي الجديدة"
    hook: "الكبد الدهني غيّر اسمه. اعرف الشجرة الجديدة، وحسبة الـ alcohol اللي بتفرّق MASLD عن MetALD عن ALD."
    minutes: 9
    pages: [97, 98]
    topics: [nomenclature]
    goals:
      - "تعدّ الـ 3 pathological aspects والـ 5 فروع تحت steatotic liver disease (SLD)"
      - "تفرّق MASLD و MetALD و ALD بأرقام الـ alcohol"
      - "تعرف إن معيار واحد من 5 cardiometabolic criteria كفاية"
    status: unverified
    steps:
      - kind: explain
        remind: [hb.L06.001]
        page: 97
        quote: "Pathological aspects of steatotic liver disease Statosis. Inflammation. Fibrosis."
        title: "3 حاجات بتحصل في الكبد"
        text: |
          الكتاب بيبدأ بالـ pathological aspects التلاتة، وكل واحدة خطوة أوحش من اللي قبلها:

          - ==Steatosis==: دهون متخزنة جوه الـ hepatocytes. لوحدها غالبًا هادية.
          - ==Inflammation==: الخلايا المليانة دهون بتتأذي وبتلتهب. ده اللي بيحوّل steatosis لـ non-alcoholic steatohepatitis (NASH).
          - ==Fibrosis==: الالتهاب المستمر بيسيب ندبات (collagen). ودي اللي بتحدد المريض رايح فين.

          والـ spectrum في صورة الكتاب: normal liver، بعدين simple steatosis، بعدين NASH.

          والـ fibrosis نفسها ليها خريطة: بتبدأ حوالين الـ central veins والـ portal tracts، وبعدين الندبات تتوصل ببعض وتعمل **bridges**، وفي الآخر الكبد يتقسم **nodules**، ودي F4 = cirrhosis.
      - kind: figure
        page: 97
        quote: "Prolonged liver injury leads to scarring (fibrosis)\n| F1 | F2 | F3 | F4 |\n|---|---|---|---|\nProgressive laying down of scar tissue around the central vein and portal tracts"
        title: "التليف من F1 لـ F4، وتحت الميكروسكوب"
        image: { file: hb/L06-fibrosis-stages.webp, book: true }
        alt: "Book figure. Top: four panels F1 to F4 showing scar tissue laid down around central veins and portal tracts, spreading as strands in F2, bridging in F3 and surrounding nodules in F4. Bottom: three histology slides labelled normal, simple steatosis with many fat vacuoles, and NASH with fat, inflammation and fibrous strands, above an arrow labelled NAFLD spectrum."
        caption: "فوق: الندبات بتبدأ حوالين الـ central vein والـ portal tract (F1–F2)، وبعدين **bridges** (F3)، وبعدين **nodules** (F4). تحت: البقع البيضا في الـ simple steatosis دي دهون، وفي الـ NASH بيزيد عليها التهاب وألياف."
      - kind: figure
        page: 98
        quote: "A new nomenclature"
        title: "الـ nomenclature الجديدة: شجرة الـ SLD في الكتاب"
        image: { file: hb/L06-sld-nomenclature.webp, book: true }
        alt: "Book diagram. A green bar at the top, Steatotic Liver Disease (SLD), branches into five boxes. Green boxes: Metabolic Dysfunction-Associated Steatotic Liver Disease (MASLD), with a dashed line down to a dashed oval Metabolic Dysfunction-Associated Steatohepatitis (MASH); MASLD and increased alcohol intake (MetALD), holding two coloured bars from MASLD predominant to ALD predominant: weekly alcohol 140/210, 210, 280, 350/420 g and daily alcohol 20/30, 30, 40, 50/60 g; Alcohol-Associated (Alcohol-related) Liver Disease (ALD). Grey boxes: Specific aetiology SLD, with Drug-Induced Liver Injury (DILI), Monogenic diseases and Miscellaneous under it; Cryptogenic SLD."
        caption: |
          الشريط الأخضر فوق هو المظلة: **Steatotic Liver Disease (SLD)**، يعني أي كبد فيه دهون. تحته 5 صناديق من الشمال لليمين:

          - **الأول (أخضر)**: **Metabolic Dysfunction-Associated Steatotic Liver Disease (MASLD)**، وتحته خط متقطع لبيضاوي متقطع: **Metabolic Dysfunction-Associated Steatohepatitis (MASH)**، يعني الـ MASH مش مرض تاني، دي مرحلة جوه الـ MASLD.
          - **التاني (أخضر، الكبير)**: **MASLD and increased alcohol intake (MetALD)**. جواه شريطين ملوّنين من البرتقاني (**MASLD predominant**) للأحمر (**ALD predominant**): الأسبوعي 140/210 ← 210 ← 280 ← 350/420 جرام، واليومي 20/30 ← 30 ← 40 ← 50/60 جرام. الرقم اللي فيه شَرطة = ستات/رجالة.
          - **التالت (أخضر)**: **Alcohol-related Liver Disease (ALD)**: الكحول لوحده.
          - **الرابع (رمادي)**: **Specific aetiology SLD**، ومنه 3 فروع: **Drug-Induced Liver Injury (DILI)**، **Monogenic diseases**، و **Miscellaneous**.
          - **الخامس (رمادي)**: **Cryptogenic SLD**: دهون من غير سبب معروف.

          الأخضر = اللي ليهم علاقة بالـ metabolic أو الكحول، والرمادي = أسباب تانية. والرسمة بتثبت إن ==MetALD== مش اسم ثالث جديد للمرض، ده ==طيف بين MASLD و ALD== بيتحدد بكمية الكحول.
      - kind: match
        page: 98
        quote: "A new nomenclature: Steatotic Liver Disease (SLD)\n  Metabolic Dysfunction-Associated Steatotic Liver Disease (MASLD) → Metabolic Dysfunction-Associated Steatohepatitis (MASH)\n  MASLD and increased alcohol intake* (MetALD)\n  Alcohol-Associated (Alcohol-related) Liver Disease (ALD)\n  Specific aetiology SLD: Drug-Induced Liver Injury (DILI); Monogenic diseases**; Miscellaneous***\n  Cryptogenic SLD\n| MetALD | MASLD predominant | | | ALD predominant |\n|---|---|---|---|---|\n| Weekly alcohol intake (g) | 140/210 | 210 | 280 | 350/420 |\n| Average daily alcohol intake (g) | 20/30 | 30 | 40 | 50/60 |"
        prompt: "وصّل كل وصف بالاسم الجديد:"
        pairs:
          - ["Old name NAFLD", "MASLD"]
          - ["Old name NASH", "MASH"]
          - ["Metabolic criteria plus moderate-heavy alcohol", "MetALD"]
          - ["Steatosis, no criteria, no cause", "Cryptogenic SLD"]
        why: "Non-alcoholic fatty liver disease (NAFLD) بقت **metabolic dysfunction-associated steatotic liver disease (MASLD)** و NASH بقت **metabolic dysfunction-associated steatohepatitis (MASH)**. لو فيه metabolic criteria + alcohol في الـ range المتوسط يبقى **MetALD**. ومن غير criteria ولا سبب: **cryptogenic**."
      - kind: explain
        page: 98
        quote: "A new nomenclature: Steatotic Liver Disease (SLD)\n  Metabolic Dysfunction-Associated Steatotic Liver Disease (MASLD) → Metabolic Dysfunction-Associated Steatohepatitis (MASH)\n  MASLD and increased alcohol intake* (MetALD)\n  Alcohol-Associated (Alcohol-related) Liver Disease (ALD)\n  Specific aetiology SLD: Drug-Induced Liver Injury (DILI); Monogenic diseases**; Miscellaneous***\n  Cryptogenic SLD\n| MetALD | MASLD predominant | | | ALD predominant |\n|---|---|---|---|---|\n| Weekly alcohol intake (g) | 140/210 | 210 | 280 | 350/420 |\n| Average daily alcohol intake (g) | 20/30 | 30 | 40 | 50/60 |"
        title: "الـ alcohol: فين الحدود؟"
        text: |
          تخيّل مسطرة الـ alcohol، والـ ==MetALD== في نصها:

          - **تحت الحد التحتاني**: المريض عنده criteria وبيشرب قليل، يبقى **MASLD**.
          - **جوه الـ range**: يبقى MetALD. أوله «MASLD predominant» وآخره «alcohol-related liver disease (ALD) predominant»، يعني كل ما يشرب أكتر الكفة بتميل ناحية الـ alcohol.
          - **فوق الحد الفوقاني**: الـ alcohol هو السبب الأساسي، يبقى **ALD**.

          الفكرة إن الاسم بيقولك السببين موجودين مع بعض، بدل ما تختار واحد وتتجاهل التاني.
      - kind: table
        page: 98
        quote: "A new nomenclature: Steatotic Liver Disease (SLD)\n  Metabolic Dysfunction-Associated Steatotic Liver Disease (MASLD) → Metabolic Dysfunction-Associated Steatohepatitis (MASH)\n  MASLD and increased alcohol intake* (MetALD)\n  Alcohol-Associated (Alcohol-related) Liver Disease (ALD)\n  Specific aetiology SLD: Drug-Induced Liver Injury (DILI); Monogenic diseases**; Miscellaneous***\n  Cryptogenic SLD\n| MetALD | MASLD predominant | | | ALD predominant |\n|---|---|---|---|---|\n| Weekly alcohol intake (g) | 140/210 | 210 | 280 | 350/420 |\n| Average daily alcohol intake (g) | 20/30 | 30 | 40 | 50/60 |"
        title: "MetALD alcohol range"
        columns: ["Alcohol intake", "Women", "Men"]
        rows:
          - ["Average daily", "20–50 g", "30–60 g"]
          - ["Weekly", "140–350 g", "210–420 g"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2]]
      - kind: aside
        tone: exam
        page: 98
        quote: "A new nomenclature: Steatotic Liver Disease (SLD)\n  Metabolic Dysfunction-Associated Steatotic Liver Disease (MASLD) → Metabolic Dysfunction-Associated Steatohepatitis (MASH)\n  MASLD and increased alcohol intake* (MetALD)\n  Alcohol-Associated (Alcohol-related) Liver Disease (ALD)\n  Specific aetiology SLD: Drug-Induced Liver Injury (DILI); Monogenic diseases**; Miscellaneous***\n  Cryptogenic SLD\n| MetALD | MASLD predominant | | | ALD predominant |\n|---|---|---|---|---|\n| Weekly alcohol intake (g) | 140/210 | 210 | 280 | 350/420 |\n| Average daily alcohol intake (g) | 20/30 | 30 | 40 | 50/60 |"
        text: |
          ماتحفظش 8 أرقام. احفظ الـ **daily** بس واضرب في **7**:

          - Women: 20 × 7 = **140**، و 50 × 7 = **350**.
          - Men: 30 × 7 = **210**، و 60 × 7 = **420**.

          والستات دايمًا الحد أقل (20/50 مقابل 30/60).
      - kind: check
        page: 98
        quote: "A new nomenclature: Steatotic Liver Disease (SLD)\n  Metabolic Dysfunction-Associated Steatotic Liver Disease (MASLD) → Metabolic Dysfunction-Associated Steatohepatitis (MASH)\n  MASLD and increased alcohol intake* (MetALD)\n  Alcohol-Associated (Alcohol-related) Liver Disease (ALD)\n  Specific aetiology SLD: Drug-Induced Liver Injury (DILI); Monogenic diseases**; Miscellaneous***\n  Cryptogenic SLD\n| MetALD | MASLD predominant | | | ALD predominant |\n|---|---|---|---|---|\n| Weekly alcohol intake (g) | 140/210 | 210 | 280 | 350/420 |\n| Average daily alcohol intake (g) | 20/30 | 30 | 40 | 50/60 |"
        question: "A 46-year-old man with steatosis, BMI 31 and triglycerides (TG) 2.1 mmol/L drinks about 280 g of alcohol a week. Classification?"
        options:
          - "MetALD"
          - "MASLD"
          - "ALD"
          - "Cryptogenic SLD"
        answer: 0
        why:
          - "صح: عنده cardiometabolic criteria، و 280 g/week بين **210 و 420** للرجالة = MetALD (280 ÷ 7 = 40 g/day)."
          - "الـ MASLD الصرف للرجالة تحت **210 g/week**."
          - "الـ ALD فوق **420 g/week** للرجالة."
          - "عنده criteria (body mass index (BMI) و TG)، فمش cryptogenic."
      - kind: explain
        page: 98
        quote: "*Cardiometabolic criteria\n| Adult criteria: At least 1 out of 5 | Paediatric criteria: At least 1 out of 5 |\n|---|---|\n| BMI ≥25 kg/m² [23 Asia] OR WC >94 cm (M) 80 cm (F) OR ethnicity adjusted equivalent | BMI ≥85th percentile for age/sex [BMI z score ≥ +1] OR WC >95th percentile OR ethnicity adjusted equivalent |\n| Fasting serum glucose ≥5.6 mmol/L [100 mg/dl] OR 2-hour post-load glucose levels ≥7.8 mmol/L [≥140 mg/dl] OR HbA1c ≥5.7% [39 mmol/L] OR type 2 diabetes OR treatment for type 2 diabetes | Fasting serum glucose ≥5.6 mmol/L [≥100 mg/dl] OR serum glucose ≥11.1 mmol/L [≥200 mg/dl] OR 2-hour post-load glucose levels ≥7.8 mmol [140 mg/dl] OR HbA1c ≥5.7% [39 mmol/L] OR already diagnosed/treated type 2 diabetes OR treatment for type 2 diabetes |\n| Blood pressure ≥130/85 mmHg OR specific antihypertensive drug treatment | Blood pressure age <13 yr, BP ≥95th percentile OR ≥130/80 mmHg (whichever is lower); age ≥13 yr, 130/85 mmHg OR specific antihypertensive drug treatment |\n| Plasma triglycerides ≥1.70 mmol/L [150 mg/dl] OR lipid lowering treatment | Plasma triglycerides <10 yr, ≥1.15 mmol/L [≥100 mg/dl]; age ≥10 yr, ≥1.70 mmol/L [≥150 mg/dl] OR lipid lowering treatment |\n| Plasma HDL-cholesterol ≤1.0 mmol/L [40 mg/dl] (M) and ≤1.3 mmol/L [50 mg/dl] (F) OR lipid lowering treatment | Plasma HDL-cholesterol ≤1.0 mmol/L [≤40 mg/dl] OR lipid lowering treatment |"
        title: "الـ cardiometabolic criteria: واحد من 5 يكفي"
        text: |
          علشان steatosis تتسمّى **MASLD** لازم ==at least 1 out of 5== من الـ adult criteria.

          الخمسة هم مكونات الـ metabolic syndrome المعروفة:

          - الوزن أو الوسط
          - السكر
          - الضغط
          - الـ triglycerides (TG)
          - الـ high-density lipoprotein (HDL)

          وأي واحد منهم يتحسب كمان لو المريض بياخد علاجه (antihypertensive أو lipid-lowering أو علاج سكر). منطقي: الضغط المظبوط بالدوا لسه ضغط.

          الجدول الجاي فيه الأرقام. حاول تفتكرها قبل ما تكشف.
      - kind: table
        page: 98
        quote: "*Cardiometabolic criteria\n| Adult criteria: At least 1 out of 5 | Paediatric criteria: At least 1 out of 5 |\n|---|---|\n| BMI ≥25 kg/m² [23 Asia] OR WC >94 cm (M) 80 cm (F) OR ethnicity adjusted equivalent | BMI ≥85th percentile for age/sex [BMI z score ≥ +1] OR WC >95th percentile OR ethnicity adjusted equivalent |\n| Fasting serum glucose ≥5.6 mmol/L [100 mg/dl] OR 2-hour post-load glucose levels ≥7.8 mmol/L [≥140 mg/dl] OR HbA1c ≥5.7% [39 mmol/L] OR type 2 diabetes OR treatment for type 2 diabetes | Fasting serum glucose ≥5.6 mmol/L [≥100 mg/dl] OR serum glucose ≥11.1 mmol/L [≥200 mg/dl] OR 2-hour post-load glucose levels ≥7.8 mmol [140 mg/dl] OR HbA1c ≥5.7% [39 mmol/L] OR already diagnosed/treated type 2 diabetes OR treatment for type 2 diabetes |\n| Blood pressure ≥130/85 mmHg OR specific antihypertensive drug treatment | Blood pressure age <13 yr, BP ≥95th percentile OR ≥130/80 mmHg (whichever is lower); age ≥13 yr, 130/85 mmHg OR specific antihypertensive drug treatment |\n| Plasma triglycerides ≥1.70 mmol/L [150 mg/dl] OR lipid lowering treatment | Plasma triglycerides <10 yr, ≥1.15 mmol/L [≥100 mg/dl]; age ≥10 yr, ≥1.70 mmol/L [≥150 mg/dl] OR lipid lowering treatment |\n| Plasma HDL-cholesterol ≤1.0 mmol/L [40 mg/dl] (M) and ≤1.3 mmol/L [50 mg/dl] (F) OR lipid lowering treatment | Plasma HDL-cholesterol ≤1.0 mmol/L [≤40 mg/dl] OR lipid lowering treatment |"
        title: "Adult cardiometabolic criteria (any 1 of 5)"
        columns: ["Criterion", "Cut-off"]
        rows:
          - ["BMI", "≥ 25 kg/m² (≥ 23 in Asians)"]
          - ["Waist", "> 94 cm men, > 80 cm women"]
          - ["Fasting glucose", "≥ 5.6 mmol/L (100 mg/dL)"]
          - ["Glycated haemoglobin (HbA1c)", "≥ 5.7%"]
          - ["Blood pressure", "≥ 130/85 mmHg or treatment"]
          - ["Triglycerides", "≥ 1.70 mmol/L (150 mg/dL)"]
          - ["HDL", "≤ 1.0 mmol/L men, ≤ 1.3 mmol/L women"]
        hide: [[0, 1], [1, 1], [3, 1], [5, 1], [6, 1]]
      - kind: figure
        page: 98
        title: "الـ cardiometabolic criteria: الكبار والأطفال"
        image: { file: hb/L06-cardiometabolic-criteria.webp, book: true }
        alt: "Book table printed as a picture, titled *Cardiometabolic criteria, with two columns, each saying 'At least 1 out of 5' and five check boxes. Adult criteria: BMI 25 or more (23 in Asia) or waist over 94 cm (men) / 80 cm (women); fasting glucose 5.6 mmol/L (100 mg/dl) or more, 2-hour glucose 7.8 mmol/L (140 mg/dl) or more, HbA1c 5.7% or more, type 2 diabetes or its treatment; blood pressure 130/85 or more or drug treatment; triglycerides 1.70 mmol/L (150 mg/dl) or more or treatment; HDL 1.0 mmol/L (40 mg/dl) or less in men and 1.3 mmol/L (50 mg/dl) or less in women, or treatment. Paediatric criteria: BMI 85th percentile or more or waist over 95th percentile; the same glucose cut-offs plus random glucose 11.1 mmol/L or more; blood pressure 95th percentile or 130/80 under 13 years and 130/85 from 13; triglycerides 1.15 mmol/L under 10 years and 1.70 from 10; HDL 1.0 mmol/L or less."
        caption: |
          ده الجدول الأصلي اللي الـ "*" في صندوق الـ MASLD بيشاور عليه. عمودين، وفوق كل واحد **At least 1 out of 5**، و5 مربعات تعلّم عليهم:

          - **الشمال: Adult criteria**:
            1. **Body mass index (BMI)** ≥25 (23 في آسيا) **أو** waist circumference >94 سم راجل / 80 ست.
            2. سكر صايم ≥5.6 mmol/L (100 mg/dl)، أو بعد ساعتين ≥7.8 (140)، أو **HbA1c (glycated haemoglobin)** ≥5.7%، أو T2DM أو علاجه.
            3. ضغط ≥130/85 أو علاج ضغط. (الكتاب مطبوع فيه "30/85"، والمقصود 130/85.)
            4. Triglycerides ≥1.70 mmol/L (150 mg/dl) أو علاج.
            5. **HDL** ≤1.0 mmol/L (40) راجل، ≤1.3 (50) ست، أو علاج.
          - **اليمين: Paediatric criteria**: نفس الخمسة بس بالـ percentile: BMI ≥85th percentile، والضغط ≥95th percentile (أو 130/80 تحت 13 سنة)، والـ triglycerides ≥1.15 تحت 10 سنين، والـ HDL ≤1.0 للولد والبنت.

          الكلمة الحمرا **OR** مكررة في كل مربع: أي حاجة منهم تكفي. ودي الفكرة: ==واحد من 5== + دهون في الكبد = MASLD، ومش محتاج متلازمة metabolic كاملة. الأطفال بالـ ==percentile== مش بالرقم الثابت.
      - kind: aside
        tone: analogy
        text: |
          فكّر في الـ criteria زي **كارنيه النادي**: معاك أي كارنيه من الخمسة (وزن، سكر، ضغط، TG، HDL) تدخل نادي **MASLD**. مش محتاج الخمسة، ومش محتاج تبقى metabolic syndrome كاملة.

          ومعاكش ولا كارنيه، ومفيش سبب تاني؟ يبقى **cryptogenic steatotic liver disease (SLD)**.
      - kind: check
        page: 98
        quote: "*Cardiometabolic criteria\n| Adult criteria: At least 1 out of 5 | Paediatric criteria: At least 1 out of 5 |\n|---|---|\n| BMI ≥25 kg/m² [23 Asia] OR WC >94 cm (M) 80 cm (F) OR ethnicity adjusted equivalent | BMI ≥85th percentile for age/sex [BMI z score ≥ +1] OR WC >95th percentile OR ethnicity adjusted equivalent |\n| Fasting serum glucose ≥5.6 mmol/L [100 mg/dl] OR 2-hour post-load glucose levels ≥7.8 mmol/L [≥140 mg/dl] OR HbA1c ≥5.7% [39 mmol/L] OR type 2 diabetes OR treatment for type 2 diabetes | Fasting serum glucose ≥5.6 mmol/L [≥100 mg/dl] OR serum glucose ≥11.1 mmol/L [≥200 mg/dl] OR 2-hour post-load glucose levels ≥7.8 mmol [140 mg/dl] OR HbA1c ≥5.7% [39 mmol/L] OR already diagnosed/treated type 2 diabetes OR treatment for type 2 diabetes |\n| Blood pressure ≥130/85 mmHg OR specific antihypertensive drug treatment | Blood pressure age <13 yr, BP ≥95th percentile OR ≥130/80 mmHg (whichever is lower); age ≥13 yr, 130/85 mmHg OR specific antihypertensive drug treatment |\n| Plasma triglycerides ≥1.70 mmol/L [150 mg/dl] OR lipid lowering treatment | Plasma triglycerides <10 yr, ≥1.15 mmol/L [≥100 mg/dl]; age ≥10 yr, ≥1.70 mmol/L [≥150 mg/dl] OR lipid lowering treatment |\n| Plasma HDL-cholesterol ≤1.0 mmol/L [40 mg/dl] (M) and ≤1.3 mmol/L [50 mg/dl] (F) OR lipid lowering treatment | Plasma HDL-cholesterol ≤1.0 mmol/L [≤40 mg/dl] OR lipid lowering treatment |"
        question: "Which of these is NOT an adult cardiometabolic criterion for MASLD?"
        options:
          - "Serum ferritin 600 ng/mL"
          - "glycated haemoglobin (HbA1c) 5.8%"
          - "Waist 96 cm in a man"
          - "HDL 1.2 mmol/L in a woman"
        answer: 0
        why:
          - "صح: الـ ferritin مش من الخمسة."
          - "HbA1c ≥ **5.7%** معيار سكر."
          - "Waist > **94 cm** في الرجالة معيار."
          - "HDL ≤ **1.3 mmol/L** في الستات معيار."
      - kind: try
        items: [hb.L06.004, hb.L06.005, hb.L06.006, hb.L06.009, hb.L06.013]
    recap:
      - "Pathology: **steatosis، inflammation، fibrosis**."
      - "SLD = مظلة لـ **MASLD (MASH)، MetALD، ALD، specific aetiology (DILI، monogenic، misc)، cryptogenic**."
      - "الاسم الجديد: سبب أدق (أو مختلط) ومن غير **stigmatization**."
      - "MetALD daily: **20–50 g** ستات، **30–60 g** رجالة؛ اضرب × 7 تطلع الأسبوعي (140–350، 210–420)."
      - "MASLD = steatosis + **1 من 5** cardiometabolic criteria."
    practice: [hb.L06.001, hb.L06.002, hb.L06.003, hb.L06.004, hb.L06.005, hb.L06.006, hb.L06.007, hb.L06.008, hb.L06.009, hb.L06.010, hb.L06.011, hb.L06.012, hb.L06.071, hb.L06.072, hb.L06.082, hb.L06.084]

  # ------------------------------------------------------------------
  - id: hb.L06.lesson2
    title: "السكر والكبد: الفرخة ولا البيضة؟"
    hook: "مريض سكر الـ ALT بتاعه نضيف... يبقى كبده كويس؟ الكتاب بيقولك: ماتثقش في الإنزيمات."
    minutes: 8
    pages: [99, 103]
    topics: [t2dm, progression]
    goals:
      - "تعرف ليه الـ normal ALT مابيستبعدش NASH في السكر"
      - "ترتّب مسار MASLD من steatosis لـ HCC وتعرف إيه اللي بيرجع"
      - "تشرح العلاقة الـ bidirectional بين MASLD و T2DM"
    status: unverified
    steps:
      - kind: explain
        page: 99
        title: "ماتثقش في الإنزيمات"
        quote: "Hunting for Progressive NAFLD in Type 2 Diabetes: Do Not Trust Liver Enzymes! (Diabetes Care 2023;46(7):1332–1334). High prevalence of NASH and advanced fibrosis in individuals with type 2 diabetes\n| Population | Prevalence of fibrosis | Prevalence of NASH |\n|---|---|---|\n| Patients were selected for liver biopsy at low cutoffs of liver enzymes: 37% ALT >20 IU/L; 63% ALT <30 IU/L | F0 22%, F1 23%, F2 17%, F3 28%, F4 10% | no NASH 42%, NASH 58% |\n| Characteristics: Age = 52-66 years; BMI = 28-36 kg/m²; HbA1c = 6.8-8.4%; ALT = 34-70 IU/L | Clinical predictors of advanced fibrosis (F3 -F4) (AUROC 0.77): GGT (IU/L), OR=1.008; Waist (M>102, F>88 cm), OR=2.24; HDL (M<1.03, F<1.29 mmol/L) OR=2.57; FIB-4, OR=3.01 | Clinical predictors of NASH (AUROC 0.81): Serum albumin (g/L), OR=0.905; Serum creatinine (µmol/L), OR=0.987; AST (IU/L), OR=1.072; Hypertension (Y/N), OR=1.77; Triglycerides >1.7 (mmol/L), OR=2.24; Waist (M>102, F>88 cm), OR=2.84 |"
        text: |
          السؤال اللي الكتاب بيسأله: هل الـ normal transaminases بتستبعد مرض في كبد مريض ==type 2 diabetes mellitus (T2DM)==؟

          الإجابة من دراسة Diabetes Care 2023: مرضى سكر اتعملهم biopsy رغم إن إنزيماتهم واطية (63% منهم alanine aminotransferase (ALT) أقل من 30 IU/L). والنتيجة: ==Non-alcoholic steatohepatitis (NASH)== في حوالي 58%، والـ advanced fibrosis كانت موجودة برضه.

          يعني الـ ALT ممكن يبقى «نضيف» والكبد بيتليف في صمت. علشان كده ماتطمّنش مريض السكر من الإنزيمات لوحدها.

          طب نعتمد على إيه؟ الدراسة طلّعت clinical predictors of advanced fibrosis (F3–F4):

          - **Gamma-glutamyl transferase (GGT)** عالي
          - **Waist** كبير: رجالة > 102، ستات > 88 cm
          - **Low HDL**: رجالة < 1.03، ستات < 1.29 mmol/L
          - **Fibrosis-4 index (FIB-4)**، وده هنفصّله في الدرس الجاي
