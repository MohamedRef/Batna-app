        text: |
          سؤالين من أسئلة المحاضرة نفسها: **«Enumerate the contraindications»** و **«Mention the recipient criteria»**.

          الأول: اكتب ==CASH CASH== كاملة، وبعدها سطر إن فيه **high risk factors** بتتقيّم case by case.
          التاني: التلات criteria (malignancy، stents، shunts مع استثناء mesocaval) + الـ initial assessment (etiology + CP + MELD).
