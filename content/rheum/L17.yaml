items:
  # ---------- p279-280: SpA ----------
  - id: rheum.L17.001
    kind: card
    topic: spa
    front: What is spondyloarthropathy (SpA), and how is it classified by site?
    back: A heterogeneous, interrelated group of rheumatic diseases with common clinical and genetic features, classified as peripheral or axial (axSpA) by the parts mainly affected.
    src: { page: 279, quote: "which are classified as peripheral or axial (axSpA) based on what parts of the body are predominantly affected." }
    status: unverified
  - id: rheum.L17.002
    kind: enumerate
    topic: spa
    prompt: Mention the shared characteristics of the spondyloarthropathies.
    points:
      - Absence of rheumatoid factor
      - Axial arthritis (spondylitis and sacroiliitis)
      - Peripheral inflammatory oligoarthritis
      - Enthesitis rather than synovitis
      - Extra-articular changes (eye, aortic valve, lung parenchyma, skin)
      - Overlap among the diseases
      - Familial aggregation
      - Presence of HLA-B27
    pass: 6
    src: { page: 279, quote: "Absence of rheumatoid factor. Axial arthritis including spondylitis and sacroiliitis. Peripheral inflammatory oligoarthritis." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L17.003
    kind: cloze
    topic: spa
    text: "In SpA the primary lesion is {{c1::enthesitis}} rather than {{c2::synovitis}}."
    src: { page: 279, quote: "Enthesitis rather than synovitis." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L17.004
    kind: enumerate
    topic: spa
    prompt: Mention the classification of spondyloarthritis.
    points:
      - Ankylosing spondylitis (AS)
      - Non-radiographic axial SpA (nr-axSpA)
      - Undifferentiated SpA (uSpA)
      - Reactive arthritis (Reiter syndrome)
      - SpA associated with psoriasis
      - SpA associated with IBD (Crohn disease, ulcerative colitis)
      - Juvenile-onset AS
    pass: 5
    src: { page: 279, quote: "Ankylosing spondylitis (AS). Non-radiographic axial SpA (nr-axSpA). Undifferentiated spondyloarthritis (UspA)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L17.005
    kind: mcq
    topic: spa
    stem: Which feature is shared by the spondyloarthropathies?
    options: [Enthesitis rather than synovitis, Positive rheumatoid factor, Symmetrical small-joint polyarthritis, Anti-CCP antibodies]
    answer: 0
    why:
      - "Correct: enthesitis rather than synovitis is a defining SpA feature (p279)."
      - SpA is seronegative; RF is absent.
      - The peripheral arthritis is an oligoarthritis, unlike RA.
      - Anti-CCP is an RA marker.
    src: { page: 279, quote: "Enthesitis rather than synovitis." }
    status: unverified
  # ---------- p280: AS history and prevalence ----------
  - id: rheum.L17.006
    kind: enumerate
    topic: as-history
    prompt: Mention the key points in the history that suggest ankylosing spondylitis.
    points:
      - Insidious onset of low back pain
      - Onset before age 40 (usually 20-30)
      - Symptoms for more than 3 months
      - Worse in the morning or with inactivity
      - Improves with exercise
    pass: 4
    src: { page: 280, quote: "Insidious onset of low back pain. Onset of symptoms before age 40 years(20-30years). Presence of symptoms for more than 3 months." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L17.007
    kind: cloze
    topic: as-history
    text: "AS has a prevalence comparable to RA, with a male to female ratio of {{c1::4:1}}."
    src: { page: 280, quote: "Prevalence comparable to that of RA with an increased male: female ratio (4:1)." }
    status: unverified
    tags: [numbers]
  - id: rheum.L17.008
    kind: enumerate
    topic: as-history
    prompt: Why may AS be under-recognized in women?
    points:
      - Non-specific symptoms and under-diagnosis of women's pain
      - More peripheral joint disease, so misdiagnosed as RA
      - Less new bone formation, so radiography is less helpful
    pass: 3
    src: { page: 280, quote: "Women tend to have more peripheral joint manifestations thus leading to an inappropriate diagnosis of RA." }
    status: unverified
  - id: rheum.L17.009
    kind: mcq
    topic: as-history
    stem: A 26-year-old man has 6 months of low back pain that started gradually, is worst on waking and eases after exercise. What is the most likely diagnosis?
    options: [Ankylosing spondylitis, Mechanical low back pain, Lumbar disc prolapse, Osteoarthritis of the spine]
    answer: 0
    why:
      - "Correct: insidious onset under 40, over 3 months, worse in the morning or with rest and better with exercise suggests AS (p280)."
      - Mechanical pain worsens with activity and eases with rest.
      - Disc prolapse is usually sudden with radicular pain.
      - Spinal OA belongs to older patients.
    src: { page: 280, quote: "Symptoms worse in the morning or with inactivity. Improvement of symptoms with exercise." }
    status: unverified
  - id: rheum.L17.010
    kind: mcq
    topic: as-history
    stem: A 32-year-old woman with buttock pain and knee and ankle arthritis was labelled RA. Why is AS easily missed in women?
    options:
      - They have more peripheral joint disease and less new bone formation on X-ray
      - AS never affects women
      - Women always have a positive RF
      - Women lack HLA-B27
    answer: 0
    why:
      - "Correct: more peripheral arthritis leads to an RA label, and less new bone formation makes X-ray diagnosis harder (p280)."
      - Women are affected; the ratio is 4:1.
      - SpA is RF-negative.
      - HLA-B27 is not sex-linked.
    src: { page: 280, quote: "women also tend to have less new bone formation, making diagnosis of AS more difficult by radiography." }
    status: unverified
  # ---------- p280-282: etiology ----------
  - id: rheum.L17.011
    kind: card
    topic: etiology
    front: Which genetic factors predispose to AS?
    back: Genes influencing antigen presentation (HLA-B27) and the IL-23/IL-17A pathway.
    src: { page: 280, quote: "Genetic factors influencing antigen presentation (HLA –B27) and the IL- 23/17 A pathway confer predisposition to AS." }
    status: unverified
  - id: rheum.L17.012
    kind: cloze
    topic: etiology
    text: "HLA-B27 is found in {{c1::90-95%}} of AS patients, {{c2::1%}} of the general population and {{c3::20%}} of relatives of AS patients."
    src: { page: 281, quote: "It is present in1% in the general population & in 20% of relatives of AS patients." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L17.013
    kind: cloze
    topic: etiology
    text: "HLA-B27-positive persons carry a {{c1::20-fold}} increased risk of SpA, yet HLA-B27 explains only about {{c2::20%}} of AS heritability."
    src: { page: 281, quote: "HLA‐B27 positive persons carry a 20 fold-increased risk of developing SpA." }
    status: unverified
    tags: [numbers]
  - id: rheum.L17.014
    kind: card
    topic: etiology
    front: What is the proposed mechanism linking HLA-B27 to AS?
    back: HLA-B27 (class I MHC) presents an antigen to CD8+ T cells, which activate the immune system to attack fibrocartilage or cartilage.
    src: { page: 281, quote: "The HLAB27 presents an antigen to the CD8+ T cells and this in turn activates the immune system to attack the ﬁbrocartilage or cartilage." }
    status: unverified
  - id: rheum.L17.015
    kind: card
    topic: etiology
    front: Which HLA-B27 subtype does the book link with Mediterranean populations?
    back: HLA-B2702 (HLA-B27 is highly polymorphic).
    src: { page: 281, quote: "has a high degree of polymorphism (HLA-B2702 Mediterranean populations)." }
    status: unverified
  - id: rheum.L17.016
    kind: card
    topic: etiology
    front: What is ERAP-1 and why does it matter in AS?
    back: Endoplasmic reticulum aminopeptidase 1 trims peptides to the optimal length for binding HLA class I molecules (including HLA-B27); its variants are associated with AS.
    src: { page: 281, quote: "ERAP-1 is involved in trimming peptides to optimal length for binding to HLA class 1 molecules (including HLA-B27)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L17.017
    kind: card
    topic: etiology
    front: How are IL-23 and IL-17A linked in AS?
    back: IL-23 activates proinflammatory Th17 cells, and IL-17-producing CD4+ T cells play a crucial role in AS pathogenesis.
    src: { page: 281, quote: "Release of the inflammatory cytokine IL-23 can activate pro- inflammatory T helper 17 cells." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L17.018
    kind: enumerate
    topic: etiology
    prompt: Mention the infections associated with active synovitis in AS.
    points: [Klebsiella species in faeces, Chronic prostatitis, Urethral chlamydial organisms]
    pass: 3
    src: { page: 282, quote: "presence of Klebsiella species in faeces, chronic prostatitis, and urethral chlamydial organisms have been reported." }
    status: unverified
  - id: rheum.L17.019
    kind: cloze
    topic: etiology
    text: "Subclinical gut inflammation is found in {{c1::60%}} of AS patients, implicating a {{c2::gut-joint axis}}."
    src: { page: 282, quote: "subclinical gut inflammation is observed in 60% of patients with AS, implicating a potential gut–joint axis in AS pathogenesis." }
    status: unverified
    tags: [numbers]
  - id: rheum.L17.020
    kind: card
    topic: etiology
    front: How does intestinal dysbiosis promote AS?
    back: It impairs the gut mucosal barrier and disturbs mucosal immunity, raising pro-inflammatory cytokines; the gut microbiome of AS patients differs from controls.
    src: { page: 282, quote: "Dysbiosis impairs the gut mucosal barrier &leads to disorder of intestinal mucosal immunity, resulting in increased pro-inflammatory cytokines." }
    status: unverified
  - id: rheum.L17.021
    kind: mcq
    topic: etiology
    stem: A medical student asks how much of the heritability of AS is explained by HLA-B27. What does the book say?
    options: [About 20%, About 95%, About 1%, 100%]
    answer: 0
    why:
      - "Correct: HLA-B27 contributes only about 20% of AS heritability, so other genes matter (p281)."
      - 90-95% is the proportion of AS patients who carry HLA-B27, not heritability.
      - 1% is the HLA-B27 frequency in the general population.
      - Non-HLA genes such as ERAP-1 and IL-23/IL-17 genes also contribute.
    src: { page: 281, quote: "the overall contribution of HLA-B27 to AS heritability is only ~20%, indicating that other genetic influences contribute to AS." }
    status: unverified
  - id: rheum.L17.022
    kind: mcq
    topic: etiology
    stem: Which cytokine axis is most implicated in AS pathogenesis in the book?
    options: [IL-23/IL-17A, IL-6/hepcidin, IL-4/IL-13, IFN-alpha]
    answer: 0
    why:
      - "Correct: genes of the IL-17A/IL-23 axis are associated with AS; IL-17-producing CD4+ T cells play a crucial role (p281-282)."
      - IL-6 and hepcidin relate to anaemia of inflammation (RA lecture).
      - IL-4 and IL-13 are Th2 cytokines.
      - Type I interferon is an SLE theme.
    src: { page: 282, quote: "Research over the past 10 years has demonstrated a crucial role for IL-17- producing CD4+ T cells in the pathogenesis of AS." }
    status: unverified
  # ---------- p282: pathology ----------
  - id: rheum.L17.023
    kind: card
    topic: pathology
    front: What is the primary site of pathology in AS?
    back: The enthesis (for example the annulus fibrosus of intervertebral discs and the Achilles tendon).
    src: { page: 282, quote: "The enthesis is thought to be the primary site of pathology (annulus fibrosis of intervertebral discs, the tendon Achilles)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L17.024
    kind: enumerate
    topic: pathology
    prompt: Other than the enthesis, which tissues are involved in AS?
    points: [Subchondral bone (osteitis), Periosteum (periostitis), Synovial membranes (synovitis)]
    pass: 3
    src: { page: 282, quote: "Other areas involved are the subchondral bone (osteitis), periostium (periosteitis), and synovial membranes (synovitis)." }
    status: unverified
  - id: rheum.L17.025
    kind: card
    topic: pathology
    front: How does AS inflammation heal?
    back: With fibrosis and ankylosis of the affected joint.
    src: { page: 282, quote: "Inflammation usually heals with fibrosis and ankylosis of the affected joint." }
    status: unverified
  # ---------- p282-283: clinical ----------
  - id: rheum.L17.026
    kind: card
    topic: clinical
    front: Describe the back pain of AS.
    back: Insidious, intermittent bouts that may radiate down the thighs, with stiffness worst in the early morning and after prolonged rest.
    src: { page: 283, quote: "Intermittent bouts of back pain that may radiate down the thighs, stiffness that is often worse in early morning hours and after prolonged rest." }
    status: unverified
  - id: rheum.L17.027
    kind: card
    topic: clinical
    front: What happens to spinal posture as AS advances?
    back: Back motion becomes limited, the lumbar curve flattens and the thoracic curvature (kyphosis) is exaggerated.
    src: { page: 283, quote: "back motion becomes limited, with flattening of the lumbar curve and exaggeration of the thoracic curvature." }
    status: unverified
  - id: rheum.L17.028
    kind: card
    topic: clinical
    front: Why is chest expansion limited in AS, and what can it mimic?
    back: Costovertebral and costosternal joint involvement; the anterior chest pain can mimic angina pectoris.
    src: { page: 283, quote: "This can lead to anterior chest pain that mimics angina pectoris." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L17.029
    kind: enumerate
    topic: clinical
    prompt: Mention the joints involved in AS.
    points:
      - Axial skeleton (SIJs, disc spaces, apophyseal and costovertebral joints)
      - Shoulder girdle (glenohumeral, acromioclavicular, sternoclavicular)
      - Costosternal junctions
      - Manubriosternal joint
      - Symphysis pubis
      - Temporomandibular joint
      - Large proximal joints (hips, knees, shoulders)
    pass: 5
    src: { page: 283, quote: "Costosternal junctions. Manubriosternal joint. Symphysis pubis. Temporomandibular joint." }
    status: unverified
  - id: rheum.L17.030
    kind: cloze
    topic: clinical
    text: "In AS, {{c1::large proximal}} joints (hips, knees, shoulders) are involved, while {{c2::small peripheral}} joints are infrequently involved."
    src: { page: 283, quote: "Large proximal synovial joints, (hips, knees, shoulders). Small peripheral joints are infrequently involved." }
    status: unverified
  - id: rheum.L17.031
    kind: mcq
    topic: clinical
    stem: A 30-year-old man with AS presents with central chest pain on deep breathing. ECG and troponin are normal. What is the likely cause?
    options:
      - Costovertebral and costosternal joint involvement
      - Aortic dissection
      - Pulmonary embolism
      - Pericarditis is the usual cause
    answer: 0
    why:
      - "Correct: costovertebral and costosternal involvement limits chest expansion and causes anterior chest pain mimicking angina (p283)."
      - Nothing here points to dissection.
      - PE is not the AS explanation given.
      - Pericarditis is rare in AS (p284).
    src: { page: 283, quote: "Chest expansion is often limited as consequence of costovertebral and costosternal joint involvement." }
    status: unverified
  # ---------- p283-285: extra-articular ----------
  - id: rheum.L17.032
    kind: cloze
    topic: extra
    text: "Uveitis occurs in up to {{c1::25%}} of AS patients."
    src: { page: 283, quote: "Eye: uveitis occurs in up to 25% of AS patients." }
    status: unverified
    tags: [numbers, high-yield]
  - id: rheum.L17.033
    kind: card
    topic: extra
    front: What is the lung disease of severe AS?
    back: Apical fibrobullous disease, chronic infiltrative and fibrotic upper-zone changes with cavitation and fungal infection mimicking TB; plus restricted chest movement.
    src: { page: 283, quote: "fibrotic changes in the upper lung field with cavitation and fungal infection that mimic TB (Apical fibrobullous disease)." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L17.034
    kind: enumerate
    topic: extra
    prompt: Mention the cardiovascular manifestations of AS.
    points:
      - Aortitis of the ascending aorta with aortic ring dilatation and aortic regurgitation (5%)
      - Conduction defects (fibrosis of the bundle of His or AV node)
      - Pericarditis and cardiomyopathy (rare)
    pass: 3
    src: { page: 284, quote: "Aortitis of the ascending aorta and the resulting fibrosis can cause dilatation of the aortic ring and aortic valve incompetence (AR) in 5% of patients." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L17.035
    kind: cloze
    topic: extra
    text: "Aortitis in AS causes aortic regurgitation in about {{c1::5%}} of patients; fibrosis of the {{c2::bundle of His or AV node}} causes conduction defects."
    src: { page: 284, quote: "Cardiac conduction abnormalities from involvement of the bundle of Hiss or the AV node by fibrosis." }
    status: unverified
    tags: [numbers]
  - id: rheum.L17.036
    kind: enumerate
    topic: extra
    prompt: Mention the causes of renal disease in AS.
    points: [NSAID side effects, IgA nephropathy, Amyloidosis]
    pass: 3
    src: { page: 284, quote: "Side effects of NSAIDs. An IgA nephropathy. Amyloidosis." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L17.037
    kind: card
    topic: extra
    front: Why is osteoporosis seen in AS, and what is the typical bone feature?
    back: Restricted spinal mobility causes osteoporosis with fractures after trivial trauma; AS typically combines new bone formation (syndesmophytes) with bone resorption.
    src: { page: 284, quote: "A typical feature of AS is bone formation (eg.syndesmophytes) with bone resorption." }
    status: unverified
  - id: rheum.L17.038
    kind: enumerate
    topic: extra
    prompt: Mention the neurological complications of AS.
    points:
      - Vertebral fracture
      - Spinal instability or compression
      - Nerve root inflammation (radicular symptoms, cauda equina syndrome)
      - Spontaneous anterior atlantoaxial subluxation (about 2%)
    pass: 3
    src: { page: 284, quote: "Neurologic complications of AS can be caused by vertebral fracture, instability, compression, or inflammation of nerve roots" }
    status: unverified
  - id: rheum.L17.039
    kind: cloze
    topic: extra
    text: "Spontaneous anterior atlantoaxial subluxation complicates about {{c1::2%}} of AS patients, with or without cord compression."
    src: { page: 285, quote: "well-recognized complication in approximately 2% of patients and manifests with or without signs of spinal cord compression." }
    status: unverified
    tags: [numbers]
  - id: rheum.L17.040
    kind: mcq
    topic: extra
    stem: A 45-year-old man with long-standing AS has a diastolic murmur at the left sternal edge. What is the likely lesion?
    options: [Aortic regurgitation from aortitis, Mitral stenosis, Pulmonary stenosis, Tricuspid regurgitation]
    answer: 0
    why:
      - "Correct: ascending aortitis dilates the aortic ring and causes AR in 5% (p284)."
      - Mitral stenosis is rheumatic, not AS.
      - Pulmonary stenosis is not an AS feature.
      - Tricuspid regurgitation is not described in AS.
    src: { page: 284, quote: "dilatation of the aortic ring and aortic valve incompetence (AR) in 5% of patients." }
    status: unverified
  - id: rheum.L17.041
    kind: mcq
    topic: extra
    stem: An AS patient on NSAIDs for 15 years develops proteinuria and nephrotic syndrome. Which cause should you look for besides NSAID toxicity?
    options: [Amyloidosis, Lupus nephritis, Diabetic nephropathy only, Minimal change from HLA-B27]
    answer: 0
    why:
      - "Correct: renal disease in AS comes from NSAIDs, IgA nephropathy or amyloidosis (p284)."
      - Glomerular function is usually spared in AS, unlike SLE.
      - Diabetes is not part of the AS list.
      - HLA-B27 does not cause minimal change disease.
    src: { page: 284, quote: "Unlike other CT diseases as SLE, glomerular function is usually unimpaired in AS." }
    status: unverified
  - id: rheum.L17.042
    kind: mcq
    topic: extra
    stem: A man with advanced AS has upper-zone cavitating lung shadows. Sputum AFB is negative but Aspergillus grows. What is this?
    options: [Apical fibrobullous disease, Caplan syndrome, Pulmonary TB, Interstitial fibrosis of the lower lobes]
    answer: 0
    why:
      - "Correct: AS causes upper-zone fibrosis with cavitation and fungal infection that mimics TB (p283)."
      - Caplan syndrome is RA nodules with pneumoconiosis.
      - The picture mimics TB, but AFB is negative.
      - Lower-lobe fibrosis is the RA pattern.
    src: { page: 283, quote: "Patient with severe disease may exhibit chronic infiltrative and fibrotic changes in the upper lung field" }
    status: unverified
  # ---------- p285: prognosis, DDx, labs ----------
  - id: rheum.L17.043
    kind: card
    topic: course
    front: What is the prognosis of AS?
    back: Variable, with common remissions and relapses; occasionally the whole spine ankyloses; under 10% become crippled; function is generally good unless the hips are seriously involved.
    src: { page: 285, quote: "In general the functional prognosis is good unless the hips are seriously involved." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L17.044
    kind: cloze
    topic: course
    text: "Less than {{c1::10%}} of AS patients develop crippling disease; the functional prognosis is good unless the {{c2::hips}} are seriously involved."
    src: { page: 285, quote: "Less than 10% develop crippling disease." }
    status: unverified
    tags: [numbers]
  - id: rheum.L17.045
    kind: enumerate
    topic: course
    prompt: Mention the differential diagnosis of AS.
    points:
      - Other causes of low back pain
      - Other seronegative spondyloarthropathies
      - Degenerative disease of lumbosacral and intervertebral joints
      - DISH (Forestier disease)
      - Other causes of polyarthritis and sacroiliitis
    pass: 4
    src: { page: 285, quote: "Other causes of low back pain Other seronegative sponydloarthropathies." }
    status: unverified
  - id: rheum.L17.046
    kind: card
    topic: course
    front: How is DISH (Forestier disease) distinguished from AS?
    back: DISH is a proliferative form of osteoarthritis that can mimic AS but lacks apophyseal and sacroiliac involvement.
    src: { page: 285, quote: "is a proliferative form of osteoarthritis can mimic AS but lacks apophyseal and sacroiliac involvement." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L17.047
    kind: enumerate
    topic: course
    prompt: Mention the laboratory findings in AS.
    points:
      - HLA-B27 in 90-95%
      - Raised ESR and CRP in most cases
      - Mild normochromic normocytic anaemia in severe cases
      - Calprotectin to find patients at high risk of IBD
    pass: 3
    src: { page: 285, quote: "HLA-B27 is present in 90-95% of patients. ESR& CRP are elevated in most cases." }
    status: unverified
  - id: rheum.L17.048
    kind: card
    topic: course
    front: What is calprotectin used for in AS?
    back: To identify AS patients at high risk of developing IBD.
    src: { page: 285, quote: "Calprotectin: could be used to identify patients with AS at high risk of developing IBD." }
    status: unverified
  - id: rheum.L17.049
    kind: mcq
    topic: course
    stem: A 65-year-old man has thoracic spine stiffness and flowing anterior osteophytes on X-ray. Sacroiliac and apophyseal joints are normal. What is the likely diagnosis?
    options: [DISH (Forestier disease), Ankylosing spondylitis, Reactive arthritis, Psoriatic spondylitis]
    answer: 0
    why:
      - "Correct: DISH mimics AS but spares the apophyseal and sacroiliac joints (p285)."
      - AS involves the sacroiliac joints.
      - Reactive arthritis gives asymmetric sacroiliitis after infection.
      - Psoriatic spondylitis also involves the sacroiliac joints.
    src: { page: 285, quote: "Diffuse idiopathic skeletal hyperostosis (DISH syndrome /Forestier‘s disease)" }
    status: unverified
  # ---------- p286: imaging ----------
  - id: rheum.L17.050
    kind: card
    topic: imaging
    front: Describe sacroiliitis of AS on plain X-ray.
    back: Usually symmetrical and bilateral, with subchondral erosions, sclerosis and proliferation on the iliac side; total SI occlusion at end stage. X-ray is not very sensitive.
    src: { page: 286, quote: "There are subchondral erosions, sclerosis, and proliferation on the iliac side." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L17.051
    kind: table
    topic: imaging
    title: Radiographic grading of sacroiliitis
    columns: [Grade, Finding]
    rows:
      - ["0", Normal]
      - [I, Some blurring of joint margins (suspicious)]
      - [II, "Minimal sclerosis with some erosion (pseudo-widening)"]
