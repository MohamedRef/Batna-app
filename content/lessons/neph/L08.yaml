            <text x="165" y="116" text-anchor="middle" class="t-b">2. Antibody on endothelium</text>
            <text x="165" y="134" text-anchor="middle" class="t-sm">linear C4d in PTC, or g + ptc ≥ 2,</text>
            <text x="165" y="150" text-anchor="middle" class="t-sm">or validated ABMR transcripts</text>
            <text x="165" y="176" text-anchor="middle" class="t-lg t-b">+</text>
            <rect x="10" y="184" width="310" height="44" rx="8" class="fg-acc"/>
            <text x="165" y="204" text-anchor="middle" class="t-b">3. Donor-specific antibodies</text>
            <text x="165" y="220" text-anchor="middle" class="t-sm">HLA or non-HLA</text>
            <rect x="70" y="240" width="190" height="34" rx="8" class="fg-ink"/>
            <text x="165" y="262" text-anchor="middle" class="t-b">= Active ABMR</text>
          </svg>
      - kind: update
        page: 282
        quote: "Active ABMR; all 3 criteria must be met for diagnosis"
        text: "Banff 2022 زوّد category اسمها **probable ABMR**: DSA موجب و C4d سلبي و MVI قليل. وزوّد كمان **MVI, DSA-negative and C4d-negative**. في الامتحان: Banff 2017 بتاع الكتاب."
        ref: "Banff 2022 Kidney Meeting Report, Am J Transplant 2024"
      - kind: explain
        page: 287
        title: "Case 13: C4d سلبي بس ABMR"
        quote: "Thrombotic Microangiopathy with Microvascular Inflammation Compatible with Acute/Active Antibody Mediated Rejection, C4d Negative For DSA Levels."
        text: |
          ولد **16 سنة**، ESRD من **lupus nephritis**، كلية من أبوه. خد CMV واتعالج، وبعدين vomiting و diarrhea و creatinine من 1.9 لـ ==4.3==. الـ cross-match و CMV و BK سلبيين.

          الـ biopsy كفاية (**39 glomeruli، 2 arteries**): glomerulitis، fibrin thrombi، capillaritis، و **C4d 0**. Acute score 5، chronic 0.

          التشخيص: ==TMA with MVI compatible with active ABMR, C4d negative== (اعمل DSA)، و TCMR **borderline**.
      - kind: explain
        page: 290
        title: "Case 14: راجل 78 سنة بـ RPGN"
        quote: "ANCA-associated CGN superimposed on type 3 membrano-proliferative glomerulonephritis (MPGN)."
        text: |
          عنده HTN، و proteinuria و hematuria من سنين، وفجأة creatinine من 1.4 لـ ==8.1== في شهرين. **MPO-ANCA 536**، C3 و C4 طبيعيين، و mild interstitial pneumonia.

          الـ biopsy: **crescents** في 6 من 9، capillary walls تخينة، IgG و IgM و C3 granular، و EM فيه **intra- و trans-membranous** deposits، مش في الـ lamina densa زي الـ DDD.

          التشخيص: ==ANCA-associated crescentic GN on top of type 3 MPGN==.
      - kind: case
        page: 291
        quote: "Algorithm for integrating IM and EM findings when diagnosing some of the pathologic expressions of glomerular disease."
        stem: "Use the book's IF/EM algorithm."
        steps:
          - question: "Linear GBM IgG with lung hemorrhage?"
            options: ["Goodpasture syndrome", "Anti-GBM GN without lung", "Lupus nephritis", "Membranous GN"]
            answer: 0
            why: "Linear staining = anti-GBM؛ مع **lung hemorrhage** = Goodpasture."
          - question: "Paucity of staining, ANCA, eosinophilia, asthma and granulomas?"
            options: ["Churg-Strauss syndrome", "Wegener's granulomatosis", "Microscopic polyangiitis", "Pauci-immune GN"]
            answer: 0
            why: "Eosinophilia + asthma + granulomas = **Churg-Strauss** (EGPA). Granulomas من غير asthma = Wegener's."
          - question: "Granular IgG with numerous subepithelial dense deposits?"
            options: ["Membranous GN", "Type I MPGN", "Acute post-infectious GN", "IgA nephropathy"]
            answer: 0
            why: "Granular capillary wall IgG + كتير subepithelial deposits = **membranous**. الـ PIGN فيه humps و C3 coarse."
