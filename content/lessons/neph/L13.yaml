  # ------------------------------------------------------------------
  - id: neph.L13.lesson3
    title: "Screening: امتى، إزاي، وامتى تشك في حاجة تانية"
    hook: "تحليل بول بسيط كل سنة بيلحق الكلية قبل ما تتعب. بس لازم تعرف تقراه."
    minutes: 10
    pages: [431, 437]
    topics: [screening, alternative]
    goals:
      - "تعرف امتى تبدأ الـ screening والتلات طرق وليه الـ dipstick مش كفاية"
      - "تفهم ليه 2 من 3 عينات، وليه لازم eGFR كمان"
      - "تفرّق بين ACR غلط مؤقت وعلامة لتشخيص تاني (Table 2 والـ box ص 437)"
    status: unverified
    steps:
      - kind: explain
        page: 431
        title: "امتى نبدأ؟"
        quote: "Annually screening for DKD is recommended from the time of diagnosis of T2DM and 5 years after the onset of T1DM."
        text: |
          ==Annually==:
          - **type 2 diabetes mellitus (T2DM):** من يوم التشخيص.
          - **type 1 diabetes mellitus (T1DM):** بعد **5 سنين** من البداية.

          ليه الفرق؟ الـ T2DM غالبًا بيبقى موجود سنين قبل ما يتشخّص، فممكن الكلية تكون اتأثرت. أما الـ T1DM بدايته معروفة بالظبط. (ده تفسير، والمواعيد من الكتاب.)
      - kind: explain
        remind: [neph.L13.037]
        page: 431
        title: "إزاي؟"
        quote: "Timed (four-hour or overnight) collection; or measurement of the albumin/creatinine ratio in a random spot collection."
        text: |
          تلات طرق للـ microalbuminuria:
          1. **24-hour collection** مع creatinine (وتاخد creatinine clearance مع بعض)
          2. **Timed** (4 ساعات أو overnight)
          3. ==albumin-to-creatinine ratio (ACR) on a random spot sample==

          والـ dipstick **مش بيشوف** الـ microalbuminuria.
      - kind: reveal
        page: 431
        quote: "Microalbuminuria (5-15years) persisten microalbuminuria ( 30-300 mg/24 hour below limit of detection by dipsticks) increased. High risk stage may develop overt nephropathy"
        prompt: "ليه الـ dipstick العادي مش بيشوف الـ microalbuminuria؟"
        answer: |
          الكتاب بيقول الـ 30-300 mg/24 hour ==below limit of detection by dipsticks==.

          التفسير المقبول (مش في الكتاب): الـ dipstick معمول يلقط البروتين لما يبقى **كتير**، وبيقرا **تركيز** مش كمية. البول المخفف ممكن يخبّي البروتين. عشان كده الـ **ACR**: بيقسم الـ albumin على الـ creatinine في نفس العينة، فالتخفيف بيلغي نفسه.
      - kind: table
        page: 432
        quote: "must be abnormal (30 mg albumin per g creatinine to 300 mg albumin per g creatinine) before diagnosis of microalbuminuria can be made."
        title: "الأرقام"
        columns: [Test, Micro, Macro]
        rows:
          - ["24-hour urine", "30-300 mg/24 h", ">300 mg/24 h"]
          - ["Spot ACR", "30-300 mg/g", ">300 mg/g"]
          - ["Timed urine", "20-200 mcg/min", ">200 mcg/min"]
        hide: [[1, 1], [1, 2], [2, 1]]
      - kind: aside
        tone: exam
        page: 432
        quote: "Macroalbuminuria (more than 300 mg per g) on a single sample can confirm diagnosis in the absence of complicating factors."
        text: |
          - **Micro:** لازم ==2 من 3== عينات في **3-6 شهور** (لأن الـ albumin excretion بيتغير).
          - **Macro (>300):** عينة **واحدة** كفاية لو مفيش complicating factors.

          ومعاهم **creatinine** و **estimated glomerular filtration rate (eGFR) بالـ CKD-EPI** (κ = 0.7 ستات، 0.9 رجالة). والـ **cystatin C** أدق من الـ creatinine.
      - kind: explain
        page: 432
        title: "ليه 2 من 3، وليه الـ macro عينة واحدة؟"
        quote: "must be abnormal (30 mg albumin per g creatinine to 300 mg albumin per g creatinine) before diagnosis of microalbuminuria can be made."
        text: |
          الكتاب بيقول السبب: ==variability in urinary albumin excretion==. الـ albumin بيعلى مع حاجات مؤقتة كتير (هتشوفها في الـ box بعد شوية)، فعينة واحدة بين 30 و300 ممكن تكون صدفة.

          طب ليه الـ **macroalbuminuria** (أكتر من 300) عينة واحدة كفاية ==in the absence of complicating factors==؟ التفسير المقبول (مش في الكتاب): الحاجات المؤقتة بتعلّي الـ albumin حبة، لكن نادرًا ما توصّله لأكتر من 300. فلو مفيش سخونية أو مجهود أو infection، الرقم الكبير ده حقيقي.

          ومعاهم دايمًا **creatinine و eGFR**، لأن زي ما شفت: فيه DKD **من غير albuminuria**.
      - kind: check
        page: 432
        quote: "Macroalbuminuria (more than 300 mg per g) on a single sample can confirm diagnosis in the absence of complicating factors."
        question: "A 52-year-old with T2DM for 3 years has a spot ACR of 85 mg/g at a routine visit. He is well, with no fever or recent exercise. Next step?"
        options:
          - "Repeat the ACR: two of three samples over 3-6 months must be abnormal"
          - "Diagnose DKD now"
          - "Arrange a renal biopsy"
          - "Reassure: 85 mg/g is normal"
        answer: 0
        why:
          - "صح: ده microalbuminuria range، ومحتاج 2 من 3 عينات في 3-6 شهور."
          - "عينة واحدة بتكفي للـ macro بس (أكتر من 300)."
          - "الـ biopsy لما الـ etiology مش واضحة (Table 2)."
          - "الطبيعي أقل من 30 mg/g."
      - kind: explain
        page: 437
        title: "Table 2: كل تحليل بيقول إيه"
        quote: "Table 2: Laboratory Evaluation of Diabetic Kidney Disease\n| Test | Measurement used | Diagnostic result | Other considerations |\n| 24-hour urine collection (mg per 24 hours) | Urinary protein and creatinine levels | Microalbuminuria: 30 to 300 mg per 24 hours; Macroalbuminuria: more than 300 mg per 24 hours | Calculation of creatinine clearance done simultaneously |\n| Creatinine measurement and eGFR calculation | Blood creatinine level; uses the Chronic Kidney Disease Epidemiology Collaboration equation to determine eGFR | Hyperfiltration occurs early in disease with eGFR, then continues to decrease as disease progresses | None |\n| Renal biopsy | Electron microscopy | Glomerular basement membrane thickening | Performed if unclear etiology of kidney disease; Procedure has risks of complication, especially bleeding |\n| | Light microscopy | Mesangial expansion; Nodular glomerulosclerosis with classic Kimmelstiel-Wilson nodules | |\n| Spot-check urine collection (mg of albumin per g of creatinine) | Urine protein level | Microalbuminuria: 30 to 300 mg per g; Macroalbuminuria: more than 300 mg per g | Completed in office; requires repeat measurements for confirmation |\n| Timed (4-hour or overnight) urine collection (mcg of albumin per minute) | Urine protein level | Microalbuminuria: 20 to 200 mcg; Macroalbuminuria: more than 200 mcg | None |\neGFR = estimated glomerular filtration rate."
        text: |
          الـ Table 2 بتلم الأدوات كلها في مكان واحد. أهم سطرين:

          - **eGFR:** ==hyperfiltration occurs early==، وبعدين بيفضل ينزل مع تقدم المرض. يعني eGFR عالي في الأول **مش** علامة سلامة.
          - **Renal biopsy:** بيتعمل بس ==if unclear etiology==، والسبب في الجدول نفسه: الـ procedure ليه **risks of complication, especially bleeding**. فمش كل عيان سكر عنده albumin محتاج biopsy؛ محتاجها اللي صورته مش ماشية مع السكر.

          ولو اتعملت: الـ EM هيوري **GBM thickening**، والـ LM **mesangial expansion** و **Kimmelstiel-Wilson nodules**، زي الدرس اللي فات.
      - kind: sort
        page: 437
        quote: "When to Consider an Alternative Diagnosis to Diabetic Kidney Disease\nConsider other causes of abnormal albumin/creatinine ratio if the patient has any of the following conditions:\n  Congestive heart failure\n  Exercise within 24 hours of testing\n  Fever\n  Infection\n  Marked hyperglycemia\n  Menstruation\nConsider other causes of albuminuria if the patient has any of the following conditions:\n  Absence of diabetic retinopathy\n  Low or rapidly decreasing GFR\n  More than 30% reduction in GFR within two to three months of initiation of ACE inhibitor or ARB\n  Presence of active urinary sediment\n  Rapidly increasing proteinuria or nephrotic syndrome\n  Refractory hypertension\n  Signs or symptoms of other systemic disease\nACE = angiotensin-converting enzyme; ARB = angiotensin receptor blocker; GFR = glomerular filtration rate."
        prompt: "صنّف: ده بيعمل ACR غلط (false positive) مؤقت، ولا red flag لتشخيص تاني غير DKD؟"
        bins: ["Falsely abnormal ACR", "Think of another diagnosis"]
        cards:
          - { text: "Exercise within 24 hours", bin: 0 }
          - { text: "Fever or infection", bin: 0 }
          - { text: "Menstruation", bin: 0 }
          - { text: "Heart failure", bin: 0 }
          - { text: "No diabetic retinopathy", bin: 1 }
          - { text: "Active urinary sediment", bin: 1 }
          - { text: "GFR falls >30% within 2-3 months of ACE inhibitor (ACEi)", bin: 1 }
          - { text: "Rapidly rising proteinuria", bin: 1 }
        why: "الأولى حاجات مؤقتة بتعلّي الـ albumin (كرّر التحليل بعدها). التانية بتقول إن المرض نفسه ممكن ميكونش diabetic kidney disease (DKD): الـ DKD بيمشي ببطء ومعاه retinopathy، فالـ sediment النشط أو الوقوع السريع يستاهلوا biopsy."
      - kind: explain
        page: 437
        title: "ليه دول بيغلّطوا الـ ACR، ودول بيقولوا مرض تاني؟"
        quote: "When to Consider an Alternative Diagnosis to Diabetic Kidney Disease\nConsider other causes of abnormal albumin/creatinine ratio if the patient has any of the following conditions:\n  Congestive heart failure\n  Exercise within 24 hours of testing\n  Fever\n  Infection\n  Marked hyperglycemia\n  Menstruation\nConsider other causes of albuminuria if the patient has any of the following conditions:\n  Absence of diabetic retinopathy\n  Low or rapidly decreasing GFR\n  More than 30% reduction in GFR within two to three months of initiation of ACE inhibitor or ARB\n  Presence of active urinary sediment\n  Rapidly increasing proteinuria or nephrotic syndrome\n  Refractory hypertension\n  Signs or symptoms of other systemic disease\nACE = angiotensin-converting enzyme; ARB = angiotensin receptor blocker; GFR = glomerular filtration rate."
        text: |
          القوايم من الـ box (ص 437)، والمنطق التفسير المقبول (مش في الكتاب):

          **بيغلّطوا الـ ACR مؤقتًا:** الـ **exercise** والـ **fever** والـ **infection** والـ **CHF** بيعلّوا الضغط أو الـ permeability في الـ glomerulus لفترة، والـ **marked hyperglycemia** بتعمل hyperfiltration، والـ **menstruation** بتلوّث العينة بدم. الحل: ==repeat after it settles==.

          **بيقولوا تشخيص تاني:** الـ DKD بيمشي **ببطء** ومعاه **retinopathy**. فالـ **active sediment** (دم وcasts)، أو الـ **nephrotic** السريع، أو الـ **GFR** اللي بيقع بسرعة، أو أعراض **systemic disease**، كلها مش شكله. والـ GFR اللي بيقع **أكتر من 30%** في 2-3 شهور بعد ACEi أو ARB بيلمّح إن الكلية كانت معتمدة على angiotensin عشان تفلتر، زي في الـ **renal artery stenosis**.
      - kind: reveal
