  - id: git.L02.048
    kind: card
    topic: image-enhancement
    front: In the book's table, which technique has the highest specificity, and which the lowest sensitivity, for cancer and precancerous lesions?
    back: Highest specificity is magnification endoscopy (95%); lowest sensitivity is I-Scan (28.5%).
    src: { page: 55, quote: "I-SCAN 28.5 78.4" }
    status: unverified
