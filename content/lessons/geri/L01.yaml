        prompt: "ليه جرعة الـ spironolactone أقل لو العيان على ACEI أو ARB؟"
        answer: |
          الاتنين بيرفعوا الـ **potassium**: الـ ACEI و angiotensin II receptor blocker (ARB) بيقللوا الـ aldosterone، والـ MRA بيمنع شغله. مع بعض الـ **hyperkalemia** قريبة، فالجدول بيبدأ الـ spironolactone **12.5–25** مع ACEI أو ARB بدل **50** من غيرهم. ونفس الفكرة: amiloride أو triamterene + MRA = تلات أدوية بترفع الـ K.
