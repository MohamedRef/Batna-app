            <text x="85" y="118" text-anchor="middle" class="t-sm t-mut">PLEX if RPGN / DAH</text>
            <rect x="170" y="65" width="150" height="60" rx="8" class="fg-good"/>
            <text x="245" y="85" text-anchor="middle" class="t-sm t-b">Non-organ-threatening</text>
            <text x="245" y="103" text-anchor="middle" class="t-sm">GC + MTX or MMF</text>
            <path d="M85 125 L150 160" class="fg-arrow" marker-end="url(#L08a)"/>
            <path d="M245 125 L180 160" class="fg-arrow" marker-end="url(#L08a)"/>
            <rect x="115" y="162" width="100" height="30" rx="15" class="fg-acc"/>
            <text x="165" y="182" text-anchor="middle" class="t-sm t-b">Remission</text>
            <path d="M165 192 V215" class="fg-arrow" marker-end="url(#L08a)"/>
            <rect x="30" y="218" width="270" height="50" rx="8" class="fg-box"/>
            <text x="165" y="238" text-anchor="middle" class="t-sm">Low-dose GC + AZA, RTX, MTX or MMF</text>
            <text x="165" y="256" text-anchor="middle" class="t-sm t-b">≥ 24 months</text>
            <rect x="30" y="285" width="270" height="62" rx="8" class="fg-thin"/>
            <text x="165" y="305" text-anchor="middle" class="t-sm t-b">Refractory: switch CYC ↔ RTX</text>
            <text x="165" y="323" text-anchor="middle" class="t-sm t-mut">re-check diagnosis, doses,</text>
            <text x="165" y="339" text-anchor="middle" class="t-sm t-mut">damage vs activity, infection</text>
          </svg>
      - kind: explain
        page: 152
        title: "Statements 1–3: فين، إزاي تتأكد، وبإيه تبدأ"
        quote: "We recommend that patients with AAV are managed in close collaboration"
        text: |
          - **Statement 1**: العيان يتعالج في **centre of expertise** أو بالتعاون معاه. ليه؟ مرض نادر وعلاجه سام، والخبرة بتفرق.
          - **Statement 2**: ==positive biopsy== بيدعم التشخيص جامد، ونعملها في التشخيص الجديد و**في الـ relapse المشكوك فيه**. ليه في الـ relapse؟ لأن العدوى والضرر القديم بيقلّدوا الـ relapse، والـ biopsy بتفرّق.
          - **Statement 3**: الـ **new-onset organ- or life-threatening** AAV ← **glucocorticoids + cyclophosphamide أو rituximab**.

          التفسير المقبول (مش في الكتاب) للـ CYC أو RTX: الاتنين بيضربوا مصدر الـ ANCA. الـ **rituximab** بيشيل الـ **B cells** اللي بتعمل الـ ANCA، والـ cyclophosphamide بيقتل الخلايا اللي بتتكاثر بسرعة ومنها الـ lymphocytes.
      - kind: aside
        tone: exam
        page: 153
        quote: "The task force was keen to stress that the use of methotrexate or mycophenolate mofetil should not be used for remission induction in the following scenarios:\n  Meningeal involvement.\n  Retro-orbital disease.\n  Cardiac involvement.\n  Mesenteric involvement.\n  Acute-onset mononeuritis multiplex.\n  Pulmonary haemorrhage of any severity.\n  Methotrexate should therefore be considered only for non-organ-threatening disease. Examples include the following in the absence of renal involvement.\n  Nasal and paranasal disease without bony involvement (erosion) or cartilage collapse or olfactory dysfunction or deafness.\n  Skin involvement without ulceration.\n  Myositis (skeletal muscle only).\n  Non-cavitating pulmonary nodules/infiltrate without haemoptysis.\n  When cyclophosphamide or rituximab are not available or contraindicated or patient choice."
        text: |
          ==Methotrexate (MTX)/mycophenolate mofetil (MMF) ممنوع في الـ induction== مع: **meningeal**، **retro-orbital**، **cardiac**، **mesenteric**، acute **mononeuritis multiplex**، و **pulmonary haemorrhage بأي درجة**.

          الـ MTX مسموح بس في الحاجات البسيطة: أنف من غير erosion، جلد من غير ulcer، myositis، nodules من غير haemoptysis، ومن غير كلية.
      - kind: reveal
        page: 153
        quote: "For a major relapse of organ-threatening or life-threatening disease in AAV"
        prompt: "ليه الـ MTX ممنوع في الـ induction مع الـ pulmonary haemorrhage أو الـ mononeuritis multiplex الحاد، حتى لو بسيط؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ **MTX** أبطأ وأضعف من الـ CYC والـ RTX. ده كويس في الأنف والجلد والـ nodules، لأن مفيش حاجة هتضيع لو استنيت أسابيع.

          لكن في الحاجات اللي في القايمة (meningeal، retro-orbital، cardiac، mesenteric، **acute mononeuritis**، **pulmonary haemorrhage**) العضو ممكن **يضيع في أيام**: نزيف رئة يموّت، عين تروح، أمعاء تموت. فمحتاج أقوى علاج من أول يوم. وكمان الـ MTX بيطلع من الكلية، فلو فيه renal involvement مش أمان.

          وعشان كده **Statement 5**: الـ major relapse يتعالج **زي المرض الجديد**: GC + CYC أو RTX.
      - kind: check
        page: 154
        quote: "Plasma exchange should be considered for patients with AAV and a serum creatine level of >500 μmol/L (5.7 mg/dL) due to rapidly progressive glomerulonephritis in the setting of new or relapsing disease"
        question: "In the book, plasma exchange is considered in AAV with RPGN when creatinine exceeds:"
        options:
          - "500 μmol/L (5.7 mg/dL)"
          - "200 μmol/L (2.3 mg/dL)"
          - "300 μmol/L (3.4 mg/dL)"
          - "Any creatinine rise"
        answer: 0
        why:
          - "صح: >500 μmol/L، وكمان في الـ severe diffuse alveolar hemorrhage (DAH)."
          - "200 مش رقم الكتاب."
          - "300 (3.4 mg/dL) ده رقم Kidney Disease: Improving Global Outcomes (KDIGO) 2024، مش الكتاب."
          - "مش أي ارتفاع؛ الكتاب حط رقم."
      - kind: update
        page: 154
        quote: "Plasma exchange should be considered for patients with AAV and a serum creatine level of >500 μmol/L (5.7 mg/dL) due to rapidly progressive glomerulonephritis in the setting of new or relapsing disease"
        text: "PEXIVAS (2020) لقت إن الـ plasma exchange الروتيني ما قللش الوفاة أو الـ end-stage kidney disease (ESKD). Kidney Disease: Improving Global Outcomes (KDIGO) 2024 بتقول ممكن تفكر فيه لو creatinine >3.4 mg/dL، أو dialysis، أو creatinine بيعلى بسرعة، أو diffuse alveolar haemorrhage (DAH) مع hypoxemia. في الامتحان: رقم الكتاب >500 μmol/L."
        ref: "KDIGO 2024 ANCA vasculitis guideline; PEXIVAS 2020"
      - kind: explain
        page: 154
        title: "الـ maintenance والـ refractory"
        quote: "We recommend that remission-maintenance therapy for AAV be continued for"
        text: |
          - **Statement 7**: الـ maintenance = **low-dose GC** + **azathioprine** أو **rituximab** أو **MTX** أو **MMF**.
          - **Statement 8**: كمّل ==24 months على الأقل== بعد الـ sustained remission. ليه؟ لأن الكتاب بيقول **AAV is characteristically a relapsing disease** (ص 156)، والوقف بدري بيرجّعه.
          - **Statement 9**: الـ **refractory** ← **بدّل**: من CYC لـ RTX أو العكس، وحوّل لمركز متخصص.

          تعريف الـ refractory عند EULAR:
          - نشاط **زي ما هو أو أكتر** بعد **4 أسابيع** من العلاج.
          - أقل من **50% reduction** في الـ **Birmingham Vasculitis Activity Score (BVAS)** بعد **6 أسابيع**.
          - مرض **مستمر** (1 major أو 3 minor) بعد **أكتر من 12 أسبوع**.
      - kind: reveal
        page: 155
        quote: "Re-evaluate the primary diagnosis; are they truly refractory—do they have AAV?"
        prompt: "عيانك مش بيتحسن على العلاج. الكتاب بيقولك تسأل أربع أسئلة قبل ما تقول refractory. إيه هما وليه؟"
        answer: |
          1. **التشخيص صح؟** يمكن مش AAV أصلًا (افتكر الـ mimics: endocarditis، lymphoma).
          2. **العلاج اتدّى صح؟** الجرعات وصلت للـ target ولا لأ.
          3. **ده active disease ولا damage؟** ندبة قديمة في الكلية أو الأعصاب مش هتتحسن مهما زوّدت العلاج.
          4. **ده AAV ولا infection أو comorbidity أو malignancy؟** المريض مقفول المناعة، فالعدوى بتلبس وش الـ relapse.

          ليه كل ده؟ التفسير المقبول (مش في الكتاب): لأن الخطوة اللي بعد "refractory" هي **تزويد** الـ immunosuppression، ولو المشكلة عدوى أو damage، الزيادة دي بتأذي من غير فايدة.
      - kind: explain
        page: 155
        title: "المتابعة"
        quote: "We recommend that structured clinical assessment rather than ANCA testing should inform decisions on changes in treatment for"
        text: |
          - غيّر العلاج حسب ==clinical assessment مش الـ antineutrophil cytoplasmic antibodies (ANCA)==؛ والـ ANCA السلبي ما بينفيش ANCA-associated vasculitis (AAV)
          - **Haematuria** مستمرة بعد **cyclophosphamide** ← افحصها (المثانة)
          - **Immunoglobulins** قبل كل كورس **rituximab**
          - **Cardiovascular risk** دوريًا، وعلّم العيان علامات الـ relapse
          - الـ AAV **controllable but incurable**
      - kind: explain
        page: 156
        title: "Statements 14–15: العيان شريك"
        quote: "AAV is characteristically a relapsing disease."
        text: |
          - **Statement 14**: اشرح للعيان بالكلام **طبيعة المرض**، العلاج، الأعراض الجانبية، والـ prognosis. ليه؟ الكتاب: AAV ==characteristically a relapsing disease==، وكل relapse بيزوّد الضرر، والعيان اللي فاهم بيلاحظ **علامات الـ relapse بدري**.
          - **Statement 15**: بعد الـ induction قيّم الـ **comorbidities** ووجّهه للعلاج والدعم: الـ AAV ممكن يسيب ضرر دايم في الكلية والرئة والقلب والأعصاب، والنظر أو السمع.

          والجملة اللي تلخّص: AAV ==controllable but currently incurable lifelong illness==، فمحتاج **holistic approach**.
      - kind: figure
        page: 156
        quote: "Targeting Complement"
        title: "فين كل دوا بيضرب الـ complement"
        image: { file: rheum/L08-complement.webp, book: true }
        alt: "Diagram titled Targeting Complement. Left: the alternative, lectin and classical pathways feed C3 into an amplification loop, giving C3a (to C3aR: leukocyte migration and signalling) and C3b (to CR1, CR1g, CR3, CR4: phagocytosis and clearance; and to CR2: adaptive signalling). Right: C5 is split by C5 convertase; eculizumab blocks C5, cutting off C5b and the MAC (C5b-9, cell lysis, Neisseria control; reason for the black box warning). Vilobelimab and C5a antibodies block C5a. Avacopan blocks C5aR at the far right, where C5a drives leukocyte trafficking, migration and activation, labelled Downstream is best."
        caption: |
          الرسمة من الشمال لليمين:

          - **شمال**: التلات pathways بيصبّوا في **C3** وحلقة التكبير، وطالع منها C3a و C3b ووظايفهم.
          - **في النص (المربع الأحمر)**: ==eculizumab== بيقفل **C5** كله، فيقطع الـ **MAC** (C5b-9) اللي بيقتل الـ Neisseria، وده سبب الـ black box warning.
          - **يمين**: vilobelimab بيمسك C5a نفسه، و ==avacopan== بيقفل الـ **C5aR** بس في الآخر خالص.

          يعني كل ما الدوا ييجي **تحت** في السلسلة، كل ما بيسيب دفاعات أكتر شغالة: "Downstream is best".
      - kind: reveal
        page: 156
        quote: "Targeting Complement\n| Target | Effect | Drug |\n|---|---|---|\n| C3a → C3aR | Leukocyte migration and signaling | |\n| C3b → CR1, CR1g, CR3, CR4 | Phagocytosis and clearance | |\n| C3b → CR2 | Adaptive signaling | |\n| C5 convertase → C5b → C6-C9 → MAC (C5b-9) | Cell lysis (i.e., Neisseria control); Reason for black box warning for eculizumab | Eculizumab |\n| C5a → C5a (desArg) → C5L2 | C5a internalization and destruction | Vilobelimab, C5a antibodies |\n| C5a → C5aR | Leukocyte trafficking, migration and activation; Downstream is best | Avacopan |"
        prompt: "ليه الـ avacopan (C5aR) أأمن من الـ eculizumab (anti-C5)؟"
        answer: |
          الـ **eculizumab** بيوقف الـ C5 كله، فمفيش **MAC (C5b-9)**، والـ MAC هو اللي بيقتل **Neisseria**؛ علشان كده عليه black box warning.

          الـ **avacopan** بيقفل الـ **C5a receptor** بس: يوقف جذب وتنشيط الـ neutrophils، ويسيب الـ MAC شغال. "Downstream is best".
