  - id: neph.L12.lesson3
    title: "الورم بيدخل الكلية، يسدّها، أو يجلّط أوعيتها"
    hook: "تلات طرق تانية للـ AKI: infiltration، obstruction، و TMA. وكل واحدة ليها علامة."
    minutes: 8
    pages: [416, 417]
    topics: [infiltration, tma]
    goals:
      - "تعرف مين بيعمل tumor infiltration وبتتشخص إزاي"
      - "تفرّق الـ obstruction الـ intratubular من الـ extrarenal"
      - "تعرف التلات features بتاعة الـ TMA وليه كل lab بيطلع كده"
    status: unverified
    steps:
      - kind: explain
        page: 416
        title: "Tumor infiltration: مين بيدخل الكلية؟"
        quote: "Leukemia and lymphoma cells have a predilection for infiltrating the kidney."
        text: |
          خلايا الـ ==leukemia== والـ ==lymphoma== عندها **predilection** إنها تدخل الكلية (تعمل infiltration). فلو عيان leukemia أو lymphoma الـ creatinine بتاعه بيعلى، حط الـ infiltration في دماغك.
      - kind: explain
        page: 417
        title: "Tumor infiltration: إمتى بتعمل AKI وبنشخصها إزاي؟"
        quote: "In approximately 1% of cases, they may be so massive infiltration that results in AKI, in these cases likely results from compression of the surrounding renal parenchyma by tumor cells with disruption of the microvasculature and tubular structures, which impairs GFR."
        text: |
          في حوالي **1%** الدخول بيبقى massive ويعمل **acute kidney injury (AKI)**. الكتاب بيشرح الآلية: الخلايا ==compression of the surrounding renal parenchyma==، وبتكسّر الـ **microvasculature** والـ **tubules**، فالـ GFR بيقع.

          - **ultrasound (US) أو computed tomography (CT):** **bilaterally enlarged kidneys** بـ **heterogeneous texture**.
          - **Kidney biopsy** هو اللي بيشخّص.

          ليه الكلية كبيرة ومش متجانسة؟ لأن الخلايا الغريبة **مالية** النسيج ومتوزعة فيه بشكل مش منتظم، والكتاب بيقول الـ texture دي ==representing the infiltrating cancer cells==.
      - kind: check
        page: 417
        quote: "Renal imaging with ultrasonography or computed tomography shows bilaterally enlarged kidney with a heterogeneous texture, representing the infiltrating cancer cells."
        question: "A 55-year-old man with acute lymphoblastic leukemia has rising creatinine, normal urine flow and no TLS labs. Ultrasound shows both kidneys enlarged with a heterogeneous texture. Most likely cause, and the diagnostic test?"
        options:
          - "Tumor infiltration; kidney biopsy"
          - "Ureteric obstruction; CT urography"
          - "Uric acid nephropathy; urine microscopy"
          - "Prerenal AKI; fluid challenge"
        answer: 0
        why:
          - "صح: leukemia + كلى كبيرة heterogeneous = infiltration، والـ biopsy بيشخّص."
          - "الـ obstruction بيعمل hydronephrosis، مش كلية heterogeneous."
          - "مفيش TLS labs، والكلية مش بتكبر كده من الـ crystals."
          - "الـ prerenal مش بيكبّر الكلية."
      - kind: explain
        page: 417
        title: "Urinary tract obstruction"
        quote: "Obstruction of the urinary tract is a common etiology of AKI in the patient with cancer. Obstruction can be intratubular because of precipitation of uric acid (as in TLS) or from medications such as high-dose methotrexate or high- dose intravenous acyclovir.\nMore commonly, urinary tract obstruction is extrarenal and is caused by compression of the ureters by tumor mass (such as with cervical carcinoma) or by prostatic disease compressing the urethra."
        text: |
          - **Intratubular:** uric acid (زي الـ tumor lysis syndrome (TLS))، **high-dose methotrexate**، **high-dose intravenous (IV) acyclovir**.
          - ==Extrarenal== (الأشهر): ورم بيضغط على الـ ureters (زي **cervical carcinoma**)، أو البروستاتا بتضغط على الـ urethra.

          ليه مهم تدوّر عليه؟ التفسير المقبول (مش في الكتاب): لأنه سبب بيتصلح: لو فكّيت السدة بدري (stent أو nephrostomy) الكلية بترجع تشتغل.
      - kind: reveal
        page: 417
        quote: "Obstruction of the urinary tract is a common etiology of AKI in the patient with cancer. Obstruction can be intratubular because of precipitation of uric acid (as in TLS) or from medications such as high-dose methotrexate or high-dose intravenous acyclovir."
        prompt: "ليه الـ methotrexate والـ acyclovir بالذات بيسدّوا من جوه، وبس في الـ high-dose؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الاتنين بيتخرجوا من الكلية **زي ما هم**، ومش بيدوبوا كويس في البول. في الجرعة العادية التركيز في الـ tubule أقل من حد الذوبان. في الـ **high-dose** التركيز بيعدّي الحد، فبيعملوا **crystals** جوه الأنبوبة، زي الـ uric acid في الـ TLS بالظبط.

          وعشان كده نفس فكرة الوقاية: مية كفاية والبول يجري.
      - kind: explain
        page: 417
        title: "Thrombotic microangiopathy"
        quote: "Thrombotic microangiopathy (TMA) is characterized by microangiopathic hemolytic anemia from red blood cell fragmentation (schistocytes, increased lactate dehydrogenase, depressed haptoglobin), thrombocytopenia (platelet count 30% reduction) and end-organ damage, including AΚΙ."
        text: |
          الـ ==thrombotic microangiopathy (TMA)== = تلاتة:
          1. **microangiopathic haemolytic anaemia (MAHA):** schistocytes، lactate dehydrogenase (LDH) عالي، haptoglobin واطي
          2. **Thrombocytopenia**
          3. **End-organ damage** زي الـ AKI (غالبًا severe وممكن يحتاج dialysis)

          السرطانات اللي بتعمله أكتر (خصوصًا metastatic): **mucinous gastric**، **ovarian**، **lymphomas**، **acute myeloid leukaemia (AML)**.
      - kind: figure
        page: 417
        quote: "Thrombotic microangiopathy (TMA) is characterized by microangiopathic hemolytic anemia from red blood cell fragmentation (schistocytes, increased lactate dehydrogenase, depressed haptoglobin), thrombocytopenia (platelet count 30% reduction) and end-organ damage, including AΚΙ."
        title: "تلات طرق تانية الورم بيوقع بيها الكلية"
