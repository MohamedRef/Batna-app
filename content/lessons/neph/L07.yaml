      - kind: reveal
        page: 179
        quote: "Defective basement membrane formation in the glomerulus, cochlea, and eye accounts for these findings."
        prompt: "ليه الـ Alport بيضرب الكلية والودن والعين بالذات؟"
        answer: |
          الكتاب بيقول: ==defective basement membrane formation in the glomerulus, cochlea, and eye==.

          التفسير المقبول (مش في الكتاب): التلات أماكن دول فيهم basement membranes **بتعتمد على نفس الشبكة** من الـ α3، α4، α5 type IV collagen. ولو الشبكة دي باظت:
          - **الكلية**: الـ GBM يضعف ← hematuria ثم proteinuria ثم CKD.
          - **الـ cochlea**: الـ basement membrane اللي بتشد الخلايا الحسّاسة تبوظ ← ==high-tone sensorineural deafness==.
          - **العين**: كبسولة العدسة تضعف وتتزق لقدّام ← **anterior lenticonus**، و **flecks** في الـ macula.
      - kind: explain
        page: 179
        title: "الولد الـ Alport"
        quote: "Both present with persistent microscopic haematuria. This occurs earlier in Alport's no haematuria by age 10 in a ' makes the diagnosis unlikely. Alport's: proteinuria (often nephrotic range) and ↑ BP usually present by adolescence. Progressive CKD → ESRD by the 3rd to 4th decade (~2% of an ESRD programme). Severity is often consistent within a family. High-tone sensorineural deafness (in the majority) and anterior lentico-nus (conical, rather than spherical, lens, leading to distorted vision: ~20%)."
        text: |
          - **Hematuria بدري**: لو مفيش hematuria لحد ==10 سنين== في ولد معرّض، الـ Alport مستبعد غالبًا.
          - **Proteinuria** (غالبًا nephrotic) و **ضغط** في المراهقة.
          - **ESRD في العقد 3–4**، والشدة متقاربة جوّه العيلة.
          - ==High-tone sensorineural deafness== (الأغلبية)، و **anterior lenticonus** (عدسة مخروطية، ~20%) و **flecks** في الـ macula.
          - **البنات الـ carriers**: غالبًا hematuria بس، بس **10–15%** يوصلوا ESRD في العقد الخامس.
          - نادرًا: **leiomyomatosis** في المريء والـ trachea.

          ليه الولد أشد من البنت؟ التفسير المقبول (مش في الكتاب): الجين (COL4A5) على الـ X chromosome، والولد عنده X واحدة بس، فكل خلاياه بايظة. البنت عندها X تانية سليمة، وفي كل خلية واحدة من الاتنين بتتقفل بالصدفة (lyonisation)، فجزء من الغشاء سليم. علشان كده أغلبهم hematuria بس، والقليل اللي الـ X السليمة اتقفلت عندهم أكتر هم اللي بيوصلوا ESRD.
