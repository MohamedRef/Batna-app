      - kind: explain
        page: 136
        title: "Gluteal tendinopathy"
        quote: "Like shoulder tendinopathy, low-grade pain (with or without movement restriction) is characteristic of gluteal tendinopathy. This pain presents in the lateral hip and is aggravated with activities (such as walking and other weight-bearing activities) and side-lying on the affected side. Further core clinical characteristics of gluteal tendinopathy include old age, female gender, comorbidities such as pain generated from the back and hip joint, overweight/obesity, poor abductor hip function, altered gait parameters, and psychological distress."
        text: |
          ألم **low-grade** في ==lateral hip==، بيزيد بالمشي والـ weight bearing و **النوم على الجنب المصاب**.

          الصورة: ست كبيرة، overweight، عندها ألم ضهر أو ورك، hip abductors ضعيفة، مشيها متغير، و psychological distress.

          ليه **side-lying** بيوجع؟ التفسير المقبول (مش في الكتاب): الوتر بيلف على عضمة الـ greater trochanter، فلما تنام عليه بيتضغط بين العضمة والسرير، وده نفس الـ **compressive stress** اللي الكتاب قال إنه بيبوّظ الوتر. والمشي والـ weight bearing بيحمّلوه أكتر.

          وليه الست الكبيرة الـ overweight؟ الوزن حِمل زيادة، والـ **poor abductor function** معناها إن العضلة ضعيفة فالوتر شايل أكتر من نصيبه، والـ **altered gait** بيزوّد الشد على نفس الحتة.
      - kind: explain
        page: 137
        title: "العلاج"
        quote: "Current advances and research in tendinopathy shows that even though there is still a lot we do not know, conservative treatment through exercise and load management should be the first source of treatment, aided by other conservative treatments like ESWT (extracorporeal shockwave therapy). Surgical approach should only be used as a last resource once the conservative options have failed after six to twelve months of treatment. Future research lines are necessary in order to achieve a consensus of exercises dosage, intensity and type."
        text: |
          1. ==Exercise و load management== أول حاجة، ومعاهم **extracorporeal shock-wave therapy (ESWT)** (shockwave).
          2. **Corticosteroid** حوالين الوتر: moderate relief بس **أقل من 4 أسابيع**.
          3. **PRP**: preliminary evidence في الـ gluteal tendinopathy.
          4. **Surgery** آخر حل، بعد فشل الـ conservative **6–12 شهر**.

          المنطق ورا الترتيب: الكتاب بيقول أحسن علاج **لسه مش متحدد**، بس الـ ==exercise و load management== أول حاجة. التفسير المقبول (مش في الكتاب): المشكلة من الأول حِمل غلط (زيادة أو قليل)، فالعلاج إنك تظبط الحِمل وتقوّي العضلة اللي حواليه، مش إنك تريّحه خالص (افتكر الـ stress-shielding).

          - الـ **steroid** بيهدّي الألم **أقل من 4 أسابيع**، يعني بيشتري وقت للتمرين، مش بيصلّح الوتر.
          - الـ **surgery** آخر حاجة بعد **6–12 شهر** فشل، عشان أغلب الناس بتتحسن من غيرها، والجراحة على كبير ليها مخاطرها.
          - والكتاب كمان بيعدّ: radial pressure wave و focused shock wave، و **topical glyceryl nitrate**، وإن الـ positioning والـ exercise شغالين في الـ rotator cuff والـ greater trochanteric pain syndrome.
      - kind: explain
        remind: [geri.L08.049]
        page: 138
        title: "الـ PRP بيتعمل إزاي؟"
        quote: "PRP injections are prepared by taking anywhere from one to a few tubes of your own blood. It is then run (\"spun down\") in a centrifuge to separates the blood into its various components: red and white blood cells, plasma, platelets, etc. The platelets are collected and concentrated from 2 to 8 times their normal number. The platelets are then mixed into a blood plasma liquid base and injected directly into the area of injury. Ultrasound imaging is sometimes used to guide the injection. The images below show a PRP injection into a patient's torn tendon. The ultrasound guidance is shown at left and the injection is shown at right."
        text: |
          تسحب أنبوبة أو كام من **دمه**، تلفّها في **centrifuge**، تركّز الـ platelets ==2 لـ 8 مرات==، تخلطها في plasma، وتحقنها مكان الإصابة (أحيانًا بالـ ultrasound).

          الـ platelets بتطلّع **growth factors** تزوّد الـ reparative cells. بيتستخدم في minor rotator cuff و Achilles tears و tennis/golfer's elbow. والـ risk: **infection** بعيد.

          ليه بيشتغل؟ الكتاب بيقول الـ platelets لما تتفعّل بتطلّع **growth factors** بتزوّد الـ **reparative cells**، فبتقوّي الـ **natural healing**. التفسير المقبول (مش في الكتاب): ده بالظبط اللي الوتر الـ tendinopathic فاشل فيه، الإصلاح. يعني الـ PRP بيدّي الإصلاح دفعة.

          وليه من دمه هو؟ عشان مفيش رفض ولا عدوى من حد تاني.
      - kind: reveal
        page: 139
        quote: "As with any injection, there is a remote risk of infection. Otherwise, there are no significant risks apart from the variability and unpredictability of how effective the treatment will be for a particular patient."
        prompt: "عيان بيسألك: «الحقنة دي ليها أضرار؟» تقوله إيه؟"
        answer: |
          الكتاب بيقول:
          - زي أي حقنة، فيه **remote risk of infection**.
