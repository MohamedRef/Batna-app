      - kind: table
        page: 96
        quote: "1- Duplex us 2- CTA 98% Sensitive and 94% Specific. 3- MRA is"
        title: "تشخيص الـ RAS"
        columns: [Test, Note]
        rows:
          - ["Duplex US", "First listed"]
          - ["CTA", "98% sensitive, 94% specific"]
          - ["MRA", "100% sensitive, 97% specific; NSF risk"]
          - ["Conventional DSA", "Gold standard"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: figure
        page: 96
        quote: "Figure 14.118: Digital subtraction angiography, showing typical unilateral atheromatous renal artery stenosis with post-stenotic dilatation (arrow)."
        title: "شكل 14.118 في الكتاب: DSA للـ RAS"
        image: { file: neph/L04-dsa-ras.webp, book: true }
        alt: "Book digital subtraction angiogram: the abdominal aorta as a white vertical column with the renal arteries branching on each side. A white arrow points at a narrowing at the origin of one renal artery with dilatation of the artery beyond it (post-stenotic dilatation), typical of unilateral atheromatous renal artery stenosis."
        caption: |
          الصورة **digital subtraction angiography**: الصبغة بيضا والعضم اتشال من الصورة.

          - **العمود الأبيض في النص**: الـ **aorta**.
          - **الفروع على الجنبين**: الـ **renal arteries** وفروعها جوه الكليتين.
          - **السهم الأبيض**: على أول الـ renal artery يمين الصورة: ==تضيّق عند الـ origin==، وبعده الشريان ==واسع== (**post-stenotic dilatation**).

          ده الشكل النموذجي للـ ==atheromatous RAS==: عند أول الشريان (الـ ostium) وفي جنب واحد. والـ DSA هي الـ **gold standard** اللي الكتاب كاتبها رقم 4 في التشخيص.
      - kind: explain
        page: 96
        quote: "Induce Nephrogenic systemic fibrosis(NSF)"
        title: "ليه كل test ليه تمن؟"
        text: |
          الكتاب: **Duplex US**، **CTA** (98% sensitive، 94% specific)، **MRA** (100% sensitive، 97% specific، بس ممكن **NSF**)، والـ gold standard **conventional digital subtraction angiography (DSA)**.

          التفسير المقبول (مش في الكتاب):

          - الـ **duplex** من غير صبغة ولا إشعاع، **فـ** بنبدأ بيه، بس بيعتمد على اللي بيعمله وعلى جسم العيان.
          - الـ **CTA** فيه contrast يودي، والكلية أصلًا ضعيفة.
          - الـ **MRA** فيه **gadolinium**، ولو الـ GFR واطي ممكن يعمل **NSF**.
          - الـ **DSA** بيشوف الشريان مباشرة، **عشان** كده gold standard، بس invasive.
      - kind: check
        page: 96
        quote: "Induce Nephrogenic systemic fibrosis(NSF)"
        question: "Which imaging test for RAS carries the risk of nephrogenic systemic fibrosis?"
        options:
          - "MRA"
          - "CTA"
          - "Duplex ultrasound"
          - "Digital subtraction angiography"
        answer: 0
        why:
          - "صح: الـ **MRA** (100% sensitive، 97% specific) ممكن يعمل **NSF**."
          - "الـ CTA: 98% sensitive و 94% specific؛ مشكلته contrast تاني."
          - "الـ duplex من غير صبغة."
          - "الـ DSA هو الـ gold standard."
