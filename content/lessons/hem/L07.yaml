        quote: "Administer a small (2 Unites) intradermal test dose to check for hypersensitivity."
        text: |
          ==L-asparaginase== ممكن تعمل **anaphylaxis**:
          - **Intradermal test dose** صغيرة (2 units) قبلها.
          - **Epinephrine** و **hydrocortisone 100 mg** و **diphenhydramine 50 mg** جاهزين **كل مرة**.
      - kind: explain
        page: 115
        title: "الـ CNS"
        quote: "Single agent intrathecal chemotherapy (methotrexate) is standard therapy."
