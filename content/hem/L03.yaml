    kind: card
    topic: pnh
    front: How is marrow hypoplasia in PNH treated, and what is the only cure?
    back: Best by bone marrow transplantation, or antithymocyte globulin if there is no donor. Allogeneic HSCT is the only curative therapy for PNH.
    src: { page: 56, quote: "Hematopoietic stem cell transplantation (HSCT) using allogeneic donors is the only curative therapy for PNH." }
