        tone: exam
        page: 154
        quote: "H. pylori infection (not a/w tumors of cardia)"
        text: "فخ امتحان: الـ H. pylori risk factor لسرطان المعدة، بس not associated with tumors of the cardia."
      - kind: reveal
        page: 154
        quote: "Lack of refrigeration"
        prompt: "ليه الثلاجة موجودة في قايمة عوامل خطر سرطان المعدة؟"
        answer: |
          الكتاب، الـ **environmental** factors: **poor food preparation** (smoked، salted)، ==lack of refrigeration==، **poor drinking water** (زي contaminated well water)، و **smoking**.

          التفسير المقبول (مش في الكتاب): من غير ثلاجة الناس بتحفظ الأكل بالملح والتدخين، وده بيجيب الـ **nitrate** اللي بيتحول لـ **N-nitroso compounds**. وكمان الأكل اللي بيقعد بيتلوث ببكتيريا بتحوّل الـ nitrate لـ nitrite. والمية الملوثة فيها nitrates وممكن H. pylori. وده بيفسّر ليه سرطان المعدة **قلّ** في البلاد اللي دخلتها الثلاجة: الناس بطّلت تملّح وبقت تاكل خضار وفاكهة طازة (والـ ascorbic acid بيمنع تكوين الـ nitrosamines).
      - kind: table
        page: 155
        quote: "Hereditary diffuse gastric cancer (E-catherin – CDH1 gene)"
        title: "Hereditary gastric cancer"
        columns: ["Syndrome", "Gene"]
        rows:
          - ["Hereditary diffuse gastric cancer", "E-cadherin (CDH1)"]
          - ["FAP (10-20% risk)", "APC, MUTYH"]
          - ["Li-Fraumeni / SBLA", "p53"]
          - ["Lynch / HNPCC", "MLH1 or MSH2"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 155
        quote: "Pernicious anaemia (achlorhydria)"
        title: "Others: الجنس، الـ achlorhydria، والجينات"
        text: |
          الكتاب، عوامل تانية:
          - **Male gender**.
          - ==Pernicious anaemia (achlorhydria)==.
          - **Proto-oncogene overexpression**: c-met، k-sam، c-erbB2.
          - **Inactivation of tumor suppressor genes**: p53 و p16.

          التفسير المقبول (مش في الكتاب): ليه الـ achlorhydria؟ الحمض بيقتل البكتيريا. لما يختفي، البكتيريا بتكتر في المعدة وبتحوّل الـ nitrates لـ nitrosamines. وكمان الـ atrophy نفسه بيخلّي الـ mucosa تتغير (intestinal metaplasia) وتبقى أقرب للسرطان. ولاحظ إن الجينات نوعين: **oncogene** بيشتغل زيادة (دوّاسة بنزين ماسكة)، و **tumor suppressor** بيبطّل (فرامل بايظة). الاتنين بيوصلوا لنفس النتيجة: خلية بتنقسم من غير ما حد يوقفها.
      - kind: figure
        page: 155
        title: "من H. pylori لحد السرطان"
        image: { file: git/L04-gastric-cancer-cascade.webp, book: true }
        alt: "Book diagram of six stacked steps: H. pylori infection, superficial gastritis, atrophic gastritis, intestinal metaplasia, dysplasia, cancer."
        caption: |
          السلّم ده بيربط عوامل الخطر ببعض: **H. pylori** ← superficial gastritis ← **atrophic gastritis** ← ==intestinal metaplasia== ← **dysplasia** ← cancer.

          كل درجة فيه خطوة أقرب للسرطان، وده سبب إن الـ atrophic gastritis من الـ **precursors**.
      - kind: mnemonic
        page: 155
        quote: "Precursors of Gastric Cancer Adenomatous polyps Chronic atrophic gastritis Pernicious gastritis"
        word: "MAPS"
        parts:
          - { key: "M", text: "Menetrier's disease" }
          - { key: "A", text: "Adenomatous polyps and chronic Atrophic gastritis" }
          - { key: "P", text: "Pernicious gastritis (pernicious anaemia, achlorhydria)" }
          - { key: "S", text: "Surgery before: previous gastric surgery for non-cancerous conditions" }
        hook: |
          الـ precursors هي **MAPS**: الخرايط اللي بتوصّل للسرطان.
      - kind: try
        items: [git.L04.064, git.L04.067, git.L04.074, git.L04.076, git.L04.233]
    recap:
      - "Gastric polyps: incidental في 2-4%، 2-3 mm في الـ body والـ fundus؛ 53% في FAP و Gardner، ومعاها colorectal neoplasms في 60%."
      - "Adenoma: 10%، solitary sessile antral؛ carcinoma 21%، فوق 4 cm 40%؛ polypectomy كفاية لو اتشال كله، وجراحة لـ sessile فوق 2 cm أو invasion أو أعراض؛ ومتابعة بالمنظار."
      - "عوامل الخطر: nutritional (ملح، nitrates، قلة خضار)، environmental (مفيش ثلاجة، مية وحشة، تدخين)، medical (H. pylori مش للـ cardia، surgery، atrophy)، hereditary (CDH1، APC، p53، Lynch)."
