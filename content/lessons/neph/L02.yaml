        text: |
          الكتاب: low-dose aspirin لمنع **تكرار** الـ ischemic events في مريض CKD عنده CVD معروف (secondary prevention، 1C)، وقدّر الـ 10-year risk بأداة validated، وأكل **Mediterranean-style** مع علاج الدهون.

