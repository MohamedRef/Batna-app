    front: What is the most common valvular abnormality in ADPKD, and how often?
    back: Mitral valve prolapse, in up to 25% on echocardiography.
    src: { page: 153, quote: "Mitral valve prolapse is the most common valvular abnormality and has been demonstrated in up to 25% of patients with ADPKD by echo-cardiography. Mitral regurgitation, tricuspid regurgitation, and tricuspid prolapse also occur more frequently in ADPKD than in unaffected kindred. Aortic regurgitation may be associated with dilation of the rarely require valve replacement. Screening echocardiography is not indicated unless a murmur is detected on physical examination. Small, hemodynamically insignificant pericardial effusion can be detected by CT scanning in up to 35% of patients with ADPKD." }
