        caption: "الـ **HG** بس في البداية. بعد 20 أسبوع يبدأ الـ **pre-eclampsia**، و **ICP** آخر التاني والتالت، و **HELLP** و **AFLP** في التالت (والـ HELLP ممكن بعد الولادة بأسبوع)."
