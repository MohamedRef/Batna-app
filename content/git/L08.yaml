      - Mosaic pattern of duodenal folds
      - Scalloping of duodenal folds
      - Total villous atrophy
    pass: 3
    src: { page: 237, quote: "Changes can be visualized in about 30% of cases as decrease mucosal folds, mosaic pattern of duodenal folds, scalloping of duodenal folds" }
    status: unverified
  - id: git.L08.034
    kind: cloze
    topic: celiac-biopsy
    text: "The criterion standard for diagnosing celiac disease is upper endoscopy with at least {{c1::6}} duodenal biopsies."
    src: { page: 237, quote: "Upper endoscopy with at least 6 duodenal biopsies is considered the criterion standard" }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L08.035
    kind: card
    topic: celiac-biopsy
    front: Is villous atrophy specific to celiac disease?
    back: No. It appears in advanced celiac disease but also in many other diseases.
    src: { page: 237, quote: "Although the villous atrophy occurs in advanced stage of celiac disease yet it is not specific and can occur in many other diseases." }
    status: unverified
  - id: git.L08.036
    kind: enumerate
    topic: celiac-biopsy
    prompt: Mention the four histological features of the established celiac lesion.
    points:
