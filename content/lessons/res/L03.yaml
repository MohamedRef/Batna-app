        caption: "الترتيب: الهدف العام الأول، وبعدين العنوان. والعنوان لازم يجاوب سؤالين للقارئ: عن إيه؟ وفين وعلى مين؟"
        alt: "Chain from general objective to title, then what the study is about and where and on whom."
      - kind: explain
        page: 80
        quote: "Title of the Research:\n  A good title should adequately describe the contents of the paper/thesis in the fewest possible words. If it is possible without undue length, the title can give a preview of the protocol.\n  A good title should be short, accurate, and concise.\n  It should not be too long or too short; generally, it should consist of 10–12 words."
        title: "وأخيرًا: العنوان"
        text: |
          دلوقتي تقدر تكتب العنوان. لازم يكون **in line with your general objective** ويقول للقارئ الدراسة عن إيه وهتتعمل فين.

          - ==short, accurate, and concise==، وعمومًا ==10–12 words==.
          - يوضّح الـ **central objectives and variables** والـ **population**.
          - من غير كلام زيادة زي **"Observations on"** أو **"A study of"**.
          - ==No abbreviations==.
      - kind: explain
        remind: [res.L03.100]
        page: 81
        quote: "Title of the Research (Cont.):\n  It should make the central objectives and variables of the study clear to the reader (reviewer).\n  It is important to specify what population or universe will be investigated.\n  The title should not include any unnecessary words, nor waste space with phrases such as \"Observations on\" or \"A study of\".\n  It should not contain abbreviations."
        title: "قواعد العنوان"
        text: |
          - يوضّح ==central objectives and variables== للقارئ (الـ reviewer).
          - يحدد الـ **population** أو الـ universe اللي هتتدرس.
          - ==مفيش كلام ملوش لازمة== زي «Observations on» أو «A study of».

          ليه الـ reviewer بالذات؟ لأنه أول واحد بيحكم على البحث، وغالبًا بيقرا العنوان قبل أي حاجة. التفسير المقبول (مش في الكتاب).
