      - kind: explain
        page: 25
        quote: "Multivariate analysis\nMany health problems in medicine have many observations / subject.\nSo\nMultivariate analysis is to examine simultaneous effect of multiple variables (independent variables) on a certain outcome (dependent variable)."
        title: "الـ multivariate analysis"
        text: |
          مشاكل الطب الحقيقية فيها **ملاحظات كتير لكل مريض**.

          الـ ==multivariate analysis== بيدرس ==simultaneous effect== لـ **متغيرات مستقلة كتير** على **outcome واحد** (dependent).

          يعني بدل ما تعمل 8 correlations لوحدهم، بتحطهم كلهم في معادلة واحدة.
      - kind: table
        page: 26
        quote: "If dependent variable is numerical (quantitative) – use Multiple linear regression.\nIf nominal -Qualitative (dichotomy) --- use Multiple logistic regression."
        title: "الـ dependent بيحدد النوع"
        columns: ["Dependent variable", "Use"]
