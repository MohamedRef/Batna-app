    src: { page: 194, quote: "NPS is caused by mutations in the LIM homeodomain transcription factor LMX1B, including missense, splicing, insertion or deletion, and Although LMXIB appears to be important for normal limb and kidney development, the precise mechanisms for the renal effects of LMX1B mutations remain under investigation." }
