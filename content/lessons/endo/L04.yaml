          </svg>
      - kind: check
        page: 73
        quote: "Drug therapy, with agents such as ketoconazole (adrenal dysfunction) or rifampin (increased clearance of cortisol) may also result in adrenal insufficiency."
        question: "How does rifampin cause adrenal insufficiency in HIV?"
        options: ["Increases cortisol clearance", "Blocks steroid synthesis", "Destroys the gland", "Suppresses CRH"]
        answer: 0
        why:
          - "صح: بيزوّد الـ clearance."
          - "ده الـ ketoconazole."
          - "ده الـ cytomegalovirus (CMV) مثلًا."
          - "مش مذكور."
      - kind: explain
        remind: [endo.L04.163]
        page: 74
        quote: "B- Hypogonadism\nThe most common abnormality of endocrine function."
        title: "أكتر abnormality: الـ hypogonadism"
        text: |
          - ==Hypogonadism== = **أكتر abnormality** في الـ HIV (والـ adrenal = **أكتر غدة** بتتأثر؛ ما تخلطش).
          - Libido قليل في **أكتر من النص**، و impotence مع T واطي لحد **30%**.
          - الـ gonadotrophins واطية أو طبيعية = central، والـ pituitary بيرد طبيعي على الـ gonadotropin-releasing hormone (GnRH) = **hypothalamic**. وفي دراسات luteinising hormone (LH) و follicle-stimulating hormone (FSH) عاليين = primary testicular.
          - أدوية: ketoconazole، ganciclovir، megestrol، acyclovir.
          - الستات: menstrual irregularities.
      - kind: explain
        page: 74
        quote: "1- Thyroid function remains remarkably normal throughout the course of HIV disease."
        title: "الغدة الدرقية والأملاح"
        text: |
          - الـ thyroid ==طبيعية بشكل ملفت==، مع **thyroxine-binding globulin (TBG) عالي**. حتى لو اتغزت بـ CMV أو Pneumocystis (P. carinii/jirovecii) أو Cryptococcus أو Kaposi أو lymphoma، غالبًا euthyroid.
          - بس الـ hypothyroidism سبب **قابل للعلاج** للتعب والـ failure to thrive، فاكشف عليه. والـ rifampin بيزوّد الـ T4 clearance.
          - **Hyponatraemia** = أشيع electrolyte disturbance.
          - Hypercalcaemia مع الـ lymphoma؛ hypocalcaemia من **amphotericin** (Mg wasting) و **foscarnet** (↓ ionised Ca).
          - البنكرياس متأثر في **35%** في التشريح، بس الـ type 1 diabetes mellitus (DM) نادر.
      - kind: explain
        page: 67
        quote: "Although the LH plasma level is elevated, the level may be below the expected range given the degree of androgen deficiency. This is due to inhibition of LH secretion by estrogen in pts with chronic liver disease (CLD). Increased estrogen production results from impaired hepatic extraction of adrenal androstendione & subsequent increase extraglandular conversion of estrone & estradiol. Testicular atrophy & gynecomastia are present in about 50% of men with cirrhosis & men are impotent. Successful liver transplantation reverses the effects of cirrhosis on pituitary-testicular axis."
        title: "الخصية والـ cirrhosis"
        text: |
          الأمراض اللي بتأثر على الخصية: chronic renal failure (CRF)، cirrhosis، sickle، non-specific illness (عمليات، myocardial infarction (MI)، حروق)، HIV (T واطي في 35-50%، والـ sex hormone-binding globulin (SHBG) بيداري)، **febrile illness** (sperm يقل مؤقتًا والـ T سليم)، و coeliac.

          في الـ ==cirrhosis==: عيب في الخصية والـ pituitary، مستقل عن الكحول. الـ LH عالي بس **أقل من المتوقع** لأن الـ ==oestrogen بيكبته==. الـ oestrogen عالي لأن الكبد مش بيسحب الـ androstenedione، فبيتحول برا لـ oestrone و oestradiol. Atrophy و gynaecomastia في **50%**، والـ **liver transplant** بيرجّع كل ده.
