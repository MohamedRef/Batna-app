  - id: hb.L13.lesson8
    title: "الـ IgG4-RD من البنكرياس للأورطى، وعلاجه"
    hook: "AIP، sclerosing cholangitis، retroperitoneal fibrosis... وكلهم بيخفّوا بالـ steroids. الفخ إنك تفتح بطن على الفاضي."
    minutes: 9
    pages: [244, 251]
    topics: [igg4-organs, igg4-treatment, igg4-diagnosis]
    goals:
      - "تعرف الـ AIP type 1 وأشكال ظهوره"
      - "توصّل كل عضو بشكله"
      - "تفرّق الـ IgG4-RD عن الحاجات اللي بتشبهه"
      - "تعرف الـ induction والـ relapse والـ maintenance"
    status: unverified
    steps:
      - kind: explain
        page: 244
        title: "Autoimmune pancreatitis type 1"
        text: |
          الـ **type 1 AIP** هو **prototype** الـ IgG4-RD، وحوالي **2%** من الـ chronic pancreatitis.

          - **Pathology:** periductal IgG4 plasma cells → **periductal fibrosis** → الـ acini بتضمر، الـ lobular architecture بتضيع، وفي الآخر **sclerosis**.
          - **مفيش أعراض specific** عن أي pancreatitis تانية: obstructive jaundice، **new-onset diabetes**، steatorrhoea، weight loss.

          **أشكال الظهور:**

          - **Obstructive jaundice** من mass في الـ head أو thickening في جدار الـ bile duct (لحد **55%**)، شبه الـ tumour.
          - بنكرياس **كبير** في الصور (diffuse أو focal) مع **irregular narrowing** للـ pancreatic duct وأحيانًا الـ CBD.
          - شبه **acute pancreatitis** (مرة أو متكررة)، وبيتطور لـ chronic pancreatitis بـ calcifications و exocrine/endocrine insufficiency.

          ووجود fibro-inflammatory حاجة تانية (زي **low back pain** من retroperitoneal fibrosis أو **hydronephrosis**) بيساعد في التشخيص.
      - kind: explain
        page: 245
        title: "القنوات والمرارة"
        text: |
          - الـ **bile duct** هو تاني أشهر مكان مع الـ AIP: لحد **70%**. و **60–80%** من الـ type 1 AIP عندهم hepatobiliary involvement.
          - أشهر جزء: **intrapancreatic portion** من الـ bile duct (علشان غالبًا مع الـ AIP): الجدار بيتخن → dilatation للي فوقه → **obstructive jaundice**. Presentation **أكثر حدة** وأعراض **أقصر مدة**.
          - **Gallbladder:** thickening **diffuse** للجدار (transmural infiltrate)، **hypointense على T2**، وبياخد contrast ويفضل لحد الـ late phase.
      - kind: explain
        page: 246
        title: "Retroperitoneum، أوعية، و GI"
        text: |
          - **Retroperitoneal fibrosis** (الأشهر): نسيج التهابي حوالين الأورطى وفروعه، بيلف على الـ **ureters** ويعمل **hydronephrosis**، وممكن يبقى mass شبه السرطان. كتير من الحالات اللي كانت «primary» بقت تتحسب IgG4-RD، وبتستجيب كويس للـ steroids.
          - **Periaortitis:** جدار سميك بيـ enhance، ولو اتساب ممكن يعمل **dissection** أو **aneurysm**.
          - **Sclerosing mesenteritis:** mass بتلف على الـ mesenteric vessels، وممكن تعمل **intestinal obstruction**.
          - **GI tract: نادر.** المعدة (diffuse infiltration بيروح بالـ steroids، polypoid lesions لحد 3 cm، ulcer، thickening، lymph nodes)، esophagitis (dysphagia و weight loss)، الـ major papilla، و colonic polyps بتقل بالـ steroids.
      - kind: match
        page: 246
        prompt: "وصّل العضو بالصورة المميزة بتاعته:"
        pairs:
          - ["Type 1 AIP", "Painless jaundice, pancreatic head mass, new diabetes"]
          - ["IgG4 sclerosing cholangitis", "Intrapancreatic bile duct wall thickening"]
          - ["Retroperitoneal fibrosis", "Tissue around the aorta encasing the ureters"]
          - ["Periaortitis", "May progress to dissection or aneurysm"]
          - ["Sclerosing mesenteritis", "Mass narrowing mesenteric vessels, bowel obstruction"]
          - ["Gallbladder", "Diffuse wall thickening, hypointense on T2"]
