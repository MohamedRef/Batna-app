lessons:
  # ------------------------------------------------------------------
  - id: git.L09.lesson1
    title: "رحلة الأكل: المراحل التلاتة والدهون"
    hook: "عشان تفهم الـ malabsorption لازم تعرف الأكل بيتهضم ويتمص إزاي. والدهون أصعب أكلة وأول واحدة تقع."
    minutes: 8
    pages: [246, 247]
    topics: [defs, fat]
    goals:
      - "تعرّف الـ malabsorption وتفرّق الـ pan من الـ specific"
      - "تعرف المراحل التلاتة وعيلة الأمراض بتاعة كل مرحلة"
      - "تمشي مع الدهون من الـ lipase لحد الـ lymph، وتعرف ليه الـ MCT استثناء"
    status: unverified
    steps:
      - kind: explain
        page: 246
        title: "يعني إيه malabsorption؟"
        quote: "This term defines as disorders in which there is a disruption of digestion and nutrient absorption. Types of malabsorption: It can be divided into: A. Pan malabsorption: Here malabsorption to all nutrient intakes. GLOBAL B. Specific Malabsorption: Either malabsorption to an individual nutrient or class of nutrients. PARTIAL."
        text: |
          الـ ==malabsorption== هو أي مرض بيبوّظ **الهضم** أو **امتصاص** الأكل.

          نوعين:
          - **Pan malabsorption** (GLOBAL): كل الأكل مش بيتمص.
          - **Specific malabsorption** (PARTIAL): nutrient واحد أو نوع واحد، زي اللاكتوز.

          ليه التقسيم ده مهم؟ لأن الـ **pan** معناها إن حاجة عامة بايظة (البنكرياس، أو مساحة الـ mucosa كلها)، فكل حاجة بتقع مع بعض. أما الـ **specific** فإنزيم أو transporter واحد ناقص، زي الـ lactase، فاللاكتوز بس هو اللي بيعمل مشكلة.
      - kind: figure
        page: 246
        quote: "In general, the digestion and absorption of food materials can be divided into three major phases: luminal, mucosal, and postabsorptive."
        title: "3 مراحل، 3 أنواع أمراض"
        alt: "Three boxes left to right joined by arrows: luminal phase in the gut lumen (pancreatic enzymes and bile; diseases are pancreatic insufficiency, low bile salts and gastric surgery), mucosal phase in the enterocyte (brush border enzymes and surface area; diseases are celiac disease, lactase deficiency and resection), postabsorptive phase in the lymphatics and portal blood (diseases are lymphangiectasia and lymphoma)."
        caption: "الأكل بيعدّي على **3 محطات**: الـ lumen، بعدين الـ mucosa، بعدين الـ lymphatics والدم. اسأل نفسك دايمًا: العطل في أنهي محطة؟"
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L09a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="5" y="10" width="320" height="80" rx="8" class="fg-acc"/>
            <text x="15" y="32" class="t-b">1 Luminal (intraluminal)</text>
            <text x="15" y="52" class="t-sm">Pancreatic enzymes + bile salts</text>
            <text x="15" y="72" class="t-sm t-mut">Pancreatic insufficiency, low bile salts, gastric surgery</text>
            <path d="M165 90 L165 108" class="fg-arrow" marker-end="url(#L09a)"/>
            <rect x="5" y="110" width="320" height="80" rx="8" class="fg-box"/>
            <text x="15" y="132" class="t-b">2 Mucosal</text>
            <text x="15" y="152" class="t-sm">Intact surface + brush border enzymes</text>
            <text x="15" y="172" class="t-sm t-mut">Celiac, lactase deficiency, resection</text>
            <path d="M165 190 L165 208" class="fg-arrow" marker-end="url(#L09a)"/>
            <rect x="5" y="210" width="320" height="80" rx="8" class="fg-bad"/>
            <text x="15" y="232" class="t-b">3 Postabsorptive</text>
            <text x="15" y="252" class="t-sm">Lymphatics (chylomicrons) + portal blood</text>
            <text x="15" y="272" class="t-sm t-mut">Lymphangiectasia, lymphoma</text>
          </svg>
      - kind: explain
        page: 246
        title: "تلات عائلات أمراض، على قد المراحل"
        quote: "We can also classify diseases associated with malabsorption into three major categories: (1) those associated with impaired intraluminal digestion; (2) those associated with impaired mucosal digestion and absorption; and (3) those associated with impaired postmucosal nutrient transport."
        text: |
          الكتاب بيقسّم أمراض الـ malabsorption تلات عائلات، كل عيلة على مرحلة:
          - **Impaired intraluminal digestion**: الأكل ما اتكسرش جوه الـ lumen (البنكرياس، الـ bile).
          - **Impaired mucosal digestion and absorption**: الـ enterocyte نفسه مش قادر (celiac، lactase).
          - **Impaired postmucosal nutrient transport**: اتمص بس مش عارف يطلع (==lymphatics==).

          ليه تفكّر كده؟ لأن كل محطة ليها تحاليلها وعلاجها: الـ luminal تعالجه بإنزيمات أو bile، والـ mucosal تعالج المرض نفسه، والـ postmucosal بتلف حوالين الـ lymph بالـ MCT. يعني السؤال الأول دايمًا: **العطل في أنهي محطة؟**
      - kind: explain
        page: 246
        title: "الدهون: أصعب أكلة"
        quote: "Intraluminal phase: Fat: the fat digestion starts by the action of pancreatic lipase at the duodenum on the food bolus which splits the long chain triglycerides into monoglycerides and free fatty acids. which combine with bile acids and phospholipids to form micelles that pass through jejunal enterocytes. Absorbed fatty acids are resynthesized and combined with protein, cholesterol, and phospholipid to form chylomicrons, which are transported by the lymphatic system. Medium-chain triglycerides are absorbed directly."
        text: |
          الـ ==pancreatic lipase== بيبدأ في الـ **duodenum**: يكسّر الـ long-chain triglycerides لـ **monoglycerides** و **free fatty acids**.

          دول يتجمعوا مع الـ **bile acids** والـ phospholipids ويعملوا ==micelles== تدخل الـ jejunal enterocytes. جوّه الخلية يتعاد تركيبهم لـ **chylomicrons** تمشي في الـ **lymphatics**.

          ليه محتاجين micelles أصلًا؟ التفسير المقبول (مش في الكتاب): الدهون ما بتدوبش في المية، والـ enterocyte مغطّي بطبقة مية. الـ **bile acids** ليها وش بيحب المية ووش بيحب الدهون، فبتلف الدهون في كُرة صغيرة تعدّي الطبقة دي لحد سطح الخلية.
      - kind: order
        page: 246
        quote: "Intraluminal phase: Fat: the fat digestion starts by the action of pancreatic lipase at the duodenum on the food bolus which splits the long chain triglycerides into monoglycerides and free fatty acids. which combine with bile acids and phospholipids to form micelles that pass through jejunal enterocytes. Absorbed fatty acids are resynthesized and combined with protein, cholesterol, and phospholipid to form chylomicrons, which are transported by the lymphatic system. Medium-chain triglycerides are absorbed directly."
        prompt: "رتّب رحلة الدهون (long-chain):"
        steps:
          - "Lipase splits triglycerides"
          - "Micelles form with bile acids"
          - "Micelles enter jejunal enterocytes"
          - "Chylomicrons are built"
          - "Lymphatics carry them away"
        why: "Lipase الأول، بعدين bile salts تعمل micelles، تدخل الخلية، تتحول chylomicrons، وتمشي في الـ lymph. أي خطوة تقع = steatorrhea."
      - kind: aside
        tone: exam
        page: 247
        quote: "Medium chain triglycerides MCT absorbed directly into portal blood without the need of miceller formation."
        text: |
          الـ **medium-chain triglycerides (MCT)** بيتمص **مباشرة في الـ portal blood** من غير micelles ولا chylomicrons.

          علشان كده الـ MCT oil بينفع عيان عنده نقص bile أو **lymphatic obstruction**.
      - kind: explain
        page: 247
        title: "أرقام وفخاخ الدهون"
        quote: "Although pancreatic function is required for fat digestion, a person may lose nearly 90% of lipase output from the pancreas before the efficiency of fat digestion and absorption is affected."
        text: |
          - الـ lipase شغال أحسن على **pH 8** (alkaline)، والـ **hyperacidity** بتقفله.
          - البنكرياس لازم يخسر حوالي ==90%== من الـ lipase قبل ما الدهون تتأثر.
          - نقص الـ bile salts (biliary obstruction أو liver disease) = **mild steatorrhea** بس.
          - الـ **bacterial overgrowth** بيعمل deconjugation للـ bile salts، فمفيش micelles. والـ bile salts اللي ما اتمصّتش بتعمل **إسهال** في القولون.
          - الدهون اللي ما اتمصّتش بتاخد معاها الـ **A, D, E, K**.

          ليه نقص الـ bile يعمل steatorrhea **خفيفة** بس، ونقص الـ lipase لازم يوصل 90%؟ التفسير المقبول (مش في الكتاب): البنكرياس بيطلّع lipase أكتر بكتير من الاحتياج، فعنده احتياطي ضخم. ومن غير bile، الـ lipase لسه بيكسّر، وجزء من الـ fatty acids بيتمص حتى من غير micelles، فالخسارة نص نص مش كاملة.
      - kind: check
        page: 247
        quote: "Medium chain triglycerides MCT absorbed directly into portal blood without the need of miceller formation."
        question: "A patient has intestinal lymphatic obstruction. Which fat is still absorbed well, and why?"
        options:
          - "Medium-chain triglycerides, absorbed directly into portal blood without micelles"
          - "Long-chain triglycerides, because they form chylomicrons"
          - "Fat-soluble vitamins, carried in chylomicrons"
          - "None; all fat needs the lymphatics"
        answer: 0
        why:
          - "صح: الكتاب: الـ MCT **absorbed directly into portal blood** من غير micelles، فمش محتاج الـ lymph."
          - "الـ chylomicrons بالذات هي اللي بتمشي في الـ lymphatics المسدودة."
          - "الـ A D E K بتمشي مع الدهون في الـ chylomicrons، فهتقع."
          - "الـ MCT هو الاستثناء."
      - kind: try
        items: [git.L09.003, git.L09.005, git.L09.007, git.L09.010, git.L09.012]
    recap:
      - "Malabsorption = عطل في الهضم أو الامتصاص؛ pan (global) أو specific (partial)."
      - "3 مراحل وتلات عائلات: intraluminal digestion، mucosal، postmucosal transport."
      - "الدهون: lipase ← micelles (bile) ← chylomicrons ← lymph. الـ MCT على الـ portal blood مباشرة."
      - "Lipase pH 8، لازم يضيع 90% قبل الـ steatorrhea (احتياطي ضخم)؛ نقص الـ bile = mild steatorrhea."
      - "الـ SIBO بيعمل deconjugation للـ bile salts، والدهون اللي ما اتمصتش بتاخد A D E K."
    practice: [git.L09.001, git.L09.002, git.L09.003, git.L09.004, git.L09.005, git.L09.006, git.L09.007, git.L09.008, git.L09.009, git.L09.010, git.L09.011, git.L09.012, git.L09.013]
