  - id: hb.L09.lesson4
    title: "نصرّف المية: ملح، spironolactone، وبزل"
    hook: "100 و 40، و 500 جرام في اليوم: الأرقام اللي هتحفظها مرة وتعيش بيها."
    minutes: 10
    pages: [151, 154]
    topics: [treatment]
    goals:
      - "تعالج حسب الـ grade"
      - "تكتب الـ diuretic regimen (sequential و combined) بالجرعات"
      - "تحكم على الـ diuresis وتعرف المضاعفات وإمتى تعمل LVP بـ albumin"
    status: unverified
    steps:
      - kind: explain
        page: 151
        quote: "it is mandatory to treat underlying cause of liver disease, rule out SBP, monitor renal function and electrolytes"
        title: "قبل ما تبدأ"
        text: |
          قبل ما تكتب أي diuretic، الكتاب بيقول فيه 4 حاجات mandatory:
          - **عالج سبب الكبد**: مثلًا antiviral للـ HBV، أو وقف الكحول. لو السبب اتعالج، الـ ascites نفسها ممكن تتحسن.
          - **Rule out SBP**: علشان عدوى مستخبية ممكن تقلب الـ diuretics لـ HRS.
          - **تابع الـ renal function والـ electrolytes**: الـ diuretics هتلعب فيهم.
          - **استبعد أسباب تانية للـ ascites**: زي TB أو ورم مع الـ cirrhosis.

          والهدف كله في جملة: ==negative sodium and water balance==. يعني الصوديوم اللي بيطلع من الجسم يبقى أكتر من اللي بيدخل. ومن هنا ييجي الملح والـ diuretics.
      - kind: table
        page: 152
        quote: "Grade 3: ascites, a large volume paracentesis (LVP) followed by a restriction of sodium intake and diuretics."
        title: "العلاج حسب الـ grade"
        columns: ["Grade", "Treatment"]
        rows:
          - ["1", "No treatment"]
          - ["2", "Na restriction + diuretics"]
          - ["3", "LVP, then Na restriction + diuretics"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: mnemonic
        page: 152
        quote: "Avoid angiotensin converting enzyme inhibitors, angiotensin receptor blockers and non-steroidal anti-inflammatory drugs."
        word: "AAAAA"
        parts:
          - { key: "A", text: "Alcohol: stop it" }
          - { key: "A", text: "ACE inhibitors: avoid" }
          - { key: "A", text: "ARBs: avoid" }
          - { key: "A", text: "Anti-inflammatories (NSAIDs): avoid" }
          - { key: "A", text: "Aminoglycosides: avoid whenever possible" }
        hook: |
          الـ general measures هي صرخة المريض: «AAAAA!» خمس حاجات كلها بتبدأ بـ A وكلها ممنوعة. وزوّد عليهم: **protein 1.2–1.5 g/kg**، والـ **beta blockers** بتتوقف بس لو فيه low BP و renal dysfunction.
      - kind: explain
        page: 152
        quote: "Daily sodium intake is moderately restricted (2 g or 90 mmol/day);\"no added salt to diet\" and \"avoidance of preprepared foodstuffs\"."
        title: "الملح: معتدل مش متطرّف"
        text: |
          **Sodium restriction**، معتدل مش متطرّف:
          - Na 2 g (90 mmol)/day. عمليًا: «no added salt» و «avoidance of preprepared foodstuffs»، يعني من غير معلبات ووجبات جاهزة.
          - الـ strict restriction لأ، لأنها بتبوّظ الـ nutrition. الأكل بيبقى ملوش طعم فالمريض مش بياكل، وهو أصلًا عنده malnutrition.
          - الـ restriction بتقلل احتياج الـ diuretics. كل ما الملح الداخل يقل، الجرعة اللي محتاجها تقل.
          - خلي بالك من الـ saline في الـ IV fluids. ده ملح داخل من الوريد ومحدش واخد باله.

          ==Dilutional hyponatremia==:
          - لو Na <125 mmol/L: **fluid restriction** 1–1.5 L/day. المشكلة هنا مية زيادة، فنقلل المية مش الملح.
          - **Vaptans**: V2-receptor antagonists. بيمنعوا الـ ADH يرجّع المية في الـ collecting tubules، فيعملوا **aquaresis**، يعني مية تطلع من غير electrolytes، والصوديوم يتحسن.
          - **Hypertonic saline (3%)**: بس للحالات النادرة اللي فيها severe hyponatremia و life-threatening complications. ولازم يبقى ببطء، 8 mmol/L في اليوم أو أقل، علشان الـ ==osmotic demyelination==.
      - kind: aside
        tone: joke
        text: |
          الكتاب بيقول «no added salt»، مش «no salt». يعني الفول ينفع، بس من غير ما تنزل عليه بالملاحة كأنك بتملّح فسيخ. 🧂
      - kind: explain
        page: 153
        quote: "Aldosterone antagonists, such as spironolactone, are used as first-line diuretics to treat ascites."
        title: "الـ diuretics"
        text: |
          ==Spironolactone== هو الـ first-line diuretic. الـ furosemide لوحده أضعف ومش recommended.

          وأثناء العلاج، تابع الـ electrolytes والـ renal function علشان تمنع الـ over-diuresis والـ azotemia.

          ==Sequential method== (للـ grade 2):
          - ابدأ spironolactone بـ 100 mg/day.
          - زوّد كل 72 ساعة على الأقل، لحد 400 mg/day كحد أقصى.
          - لو الاستجابة مش كفاية في أول أسبوعين، ضيف furosemide بـ 40 mg/day، وزوّده كل 2–3 أيام لحد 160 mg/day.

          **Combined method** (للـ grade 3 أو الـ recurrent ascites):
          - الاتنين من أول يوم بنسبة 100 : 40.
          - الـ titration بعد 4–5 أيام، لحد الجرعات القصوى.

          مثال: مريض grade 3 بيبدأ spiro 100 + furo 40، ولو محتاج يزيد يبقى 200 + 80، وبعدها 300 + 120، وآخرها 400 + 160. النسبة ثابتة، وده بيساعد يحافظ على الـ potassium متوازن.
      - kind: reveal
        page: 153
        quote: "Monotherapy with furosemide is less effective than the use of spironolactone and is not recommended."
        prompt: "ليه الـ spironolactone يكسب الـ furosemide في الـ cirrhosis؟"
        answer: |
          لأن المشكلة الأساسية **secondary hyperaldosteronism** (الـ RAAS متنشط من الـ underfilling). الـ aldosterone بيحبس Na في الـ distal tubule، فالـ loop diuretic بيطلّع Na فوق وبيرجع يتمسك تحت. الـ **aldosterone antagonist** بيضرب المشكلة في مكانها.

          (ده الشرح الفسيولوجي؛ الكتاب بيكتفي بإن الـ furosemide monotherapy less effective.)
      - kind: figure
        page: 153
        quote: "In patients with grade 3 or recurrent ascites, combination of spironolactone and furosemide is the preferred regimen."
        title: "سلم الـ diuretics"
        alt: "A ladder: grade 1 no treatment; grade 2 sodium 2 g per day plus spironolactone 100 mg rising every 72 hours to 400; no response in 2 weeks add furosemide 40 rising every 2 to 3 days to 160; grade 3 or recurrent use combined spironolactone 100 to furosemide 40 from day one, titrated after 4 to 5 days; grade 3 starts with large volume paracentesis then salt restriction and diuretics."
        caption: "Sequential = spiro لوحده الأول. Combined = الاتنين من أول يوم بنسبة 100:40."
        svg: |
          <svg viewBox="0 0 330 334" xmlns="http://www.w3.org/2000/svg">
          <defs><marker id="L09c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
          <text x="165" y="22" text-anchor="middle" class="t-b t-lg">Sequential vs combined</text>
