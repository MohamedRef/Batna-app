  - id: res.L03.lesson4
    title: "PICOT: السؤال في خمس حروف"
    hook: "مين، عملت فيهم إيه، قارنت بإيه، قست إيه، وفي قد إيه؟ لو جاوبت دول، سؤالك جاهز."
    minutes: 9
    pages: [21, 44]
    topics: [pico, finer, narrowing]
    goals:
      - "تفكّ أي سؤال لـ P و I و C و O و T"
      - "تعرف إن الـ C هو العنصر الوحيد الاختياري"
      - "تعرف السؤال الوحش من أول قراية"
    status: unverified
    steps:
      - kind: explain
        page: 36
        quote: "Elements of a clinical research question: A \"well-built\" research question should include four elements; referred to as PICO"
        title: "FINER للسؤال كله، و PICO لجسمه"
        text: |
          الـ FINER بتحكم على **the question in general**. أما الـ ==population, intervention, comparison, outcome (PICO)== فهي الـ **elements** اللي لازم تكون جوه أي **well-built** clinical question.

          ولما تضيف الوقت تبقى **population, intervention, comparison, outcome, time (PICOT)**.
      - kind: mnemonic
        page: 39
        quote: "Box 2: PICOT criteria\n| Letter | Element | Question |\n|---|---|---|\n| P | Population (patients) | What specific patient population are you interested in? |\n| I | Intervention (for intervention studies only) | What is your investigational intervention? |\n| C | Comparison group | What is the main alternative to compare with the intervention? |\n| O | Outcome of interest | What do you intend to accomplish, measure, improve or affect? |\n| T | Time | What is the appropriate follow-up time to assess outcome |"
        word: "PICOT"
        parts:
          - { key: "P", text: "Population/patients: what specific patient population? (age, gender, disease status)" }
          - { key: "I", text: "Intervention/exposure: test, treatment, adjunctive therapy, medication" }
          - { key: "C", text: "Comparison: standard of care or placebo (the only optional one)" }
          - { key: "O", text: "Outcome: what you intend to accomplish, measure, improve or affect" }
          - { key: "T", text: "Time: the follow-up time to assess the outcome" }
        hook: |
          اقرأها "**بيكوت**": زي البسكوت اللي بتاكله في النبطشية. خمس حروف، وكل حرف سؤال.
      - kind: explain
        page: 37
        quote: "PICO letters stand for:\n  P: Patient or population. The first step in the PICO process is to identify the patients or population to be studied. More specifically, it describes patients' characteristics, such as age, gender, disease status, or any other patient-related characteristic.\n  I: Intervention to be tested. Identifying the intervention is the second step in the PICO process. It is important to identify the exposure intended to be studied in the research project. This may include the use of a specific diagnostic test, treatment, adjunctive therapy, medication, etc."
        title: "P و I"
        text: |
          - **P** هي أول خطوة: مين المرضى؟ تقدر توصفهم بالـ **age** والـ **gender** والـ **disease status**، أو أي صفة تانية.
          - **I** تاني خطوة: الـ ==exposure== اللي هتدرسه: **diagnostic test, treatment, adjunctive therapy, medication**.

          ملاحظة: في الدراسات اللي مش تجريبية الـ I بتبقى exposure (زي التدخين)، مش علاج إنت بتديه.
      - kind: aside
        tone: exam
        page: 38
        quote: "C: Comparison used in the research project. It is the alternative exposure to which the intervention will be compared, which might be the standard of care or a placebo. The comparison component is the only optional one in the PICO question, since the researcher might study the intervention alone because either due to no interest in comparison or the lack of a comparable group.\nO: Outcome to be measured as a result of the intervention. It is the evaluation of the intervention's effect. This may include cure or level of control of a disease, efficacy of a medication or a diagnostic test, etc."
        text: |
          ==C is the only optional element==. الباحث ممكن يدرس الـ intervention لوحده لسببين: **no interest in comparison** أو **lack of a comparable group**.

          الـ C لما يكون موجود بيبقى **standard of care** أو **placebo**.
      - kind: explain
        page: 38
        quote: "C: Comparison used in the research project. It is the alternative exposure to which the intervention will be compared, which might be the standard of care or a placebo. The comparison component is the only optional one in the PICO question, since the researcher might study the intervention alone because either due to no interest in comparison or the lack of a comparable group.\nO: Outcome to be measured as a result of the intervention. It is the evaluation of the intervention's effect. This may include cure or level of control of a disease, efficacy of a medication or a diagnostic test, etc."
        title: "O و T"
        text: |
          - **O** هو ==the evaluation of the intervention's effect==: cure، level of control of a disease، efficacy of a medication or a diagnostic test.
          - **T** هو الـ **appropriate follow-up time** اللي تقيس فيه الـ outcome.
      - kind: figure
        page: 40
        quote: "Finding the right research question is the first step to successful publication. Using PICOT to build the research question:\n  P: Age (adult patients)\n  I: Multimodal treatment (epidural analgesia in combination with acetaminophen and NSAIDs)\n  C: Single-modal treatment (e.g. epidural alone)\n  O: Pain score (and nausea or vomiting)\n  T: Over 24 hours following surgery\nResearch Question: In adult patients undergoing elective surgery, does treatment with epidural analgesia in combination with acetaminophen and NSAIDs (multi-modal analgesia) compared with epidural alone (single-modal) lead to better pain scores and less side-effects (i.e. nausea or moving) over 24 hours following surgery?"
        title: "مثال المحاضرة مفكوك"
        alt: "Five stacked rows labelled P, I, C, O, T with the lecture's analgesia example: adult patients after elective surgery; multimodal analgesia (epidural plus acetaminophen and non-steroidal anti-inflammatory drugs (NSAIDs)); single-modal (epidural alone); pain score, nausea or vomiting; over 24 hours after surgery."
        caption: "السؤال الكامل: In adult patients undergoing elective surgery, does multimodal analgesia compared with epidural alone lead to better pain scores and fewer side effects over 24 hours"
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
