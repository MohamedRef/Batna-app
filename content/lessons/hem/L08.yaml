        quote: "Polycythemia rubra vera with associate iron deficiency."
        text: |
          الكتاب بيقول الـ CML لازم تتفرق عن:
          - الـ **neutrophilic leukemoid reaction** (الجدول)
          - **Prolonged corticosteroid therapy**
          - **Agnogenic myeloid metaplasia**
          - **Polycythemia rubra vera** مع ==iron deficiency==

          ليه دول بالذات؟ التفسير المقبول (مش في الكتاب):
          - الـ **steroids** بتفك الـ neutrophils اللي لازقة في جدار الأوعية، فالعدد في التحليل بيعلى من غير أي leukemia.
          - الـ **agnogenic myeloid metaplasia** (myelofibrosis) فيها طحال كبير وخلايا immature في الدم، فشكلها قريب.
          - الـ **polycythemia vera** مرض myeloproliferative زي الـ CML، والـ iron deficiency بتنزّل الـ Hb فتخبي كترة الكرات الحمرا، فيفضل قدامك WBC عالي وطحال.

