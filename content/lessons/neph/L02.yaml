        answer: 0
        why:
          - "صح: الستات والوزن القليل = creatinine في البول أقل، والـ creatinine هو المقام، فالـ ACR يطلع أعلى."
          - "الكتاب بيتكلم عن الـ creatinine excretion، مش فلترة الـ albumin."
          - "مفيش كده في الجدول."
          - "مالهاش علاقة."
