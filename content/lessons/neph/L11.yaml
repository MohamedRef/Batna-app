        quote: "Among women with preeclampsia, the glomerular filtration rate decreases by only 30% to 40%, which causes a small increase in serum creatinine."
        text: |
          في الـ preeclampsia الـ GFR بيقع ==only 30% to 40%==، فالكرياتينين بيعلى **حبة صغيرة**. وده بيرجّعك لدرس الكرياتينين: طلعة صغيرة في الحمل معناها كتير.

          ومع ذلك، في دراسة جنوب أفريقيا (157 ست):
          - **15.3%** عملوا AKI (6.9% stage 1، 4.3% stage 2، 4.1% stage 3).
          - بس **تلتين** منهم الكلية رجعت.
          - الـ AKI ارتبط بـ **maternal و perinatal mortality** أعلى.
          - **Hypertension في حمل قبل كده** = odds أعلى **2.2 مرة** لـ AKI stage 2 أو 3.

          يعني متطمّنش للرقم الصغير؛ التلت مش بيرجع.
      - kind: explain
        page: 357
        title: "Preeclampsia ولا CKD بيسوء؟"
        quote: "Among women with preeclampsia, the glomerular filtration rate decreases by only 30% to 40%, which causes a small increase in serum creatinine.(14) A prospective observational multicenter study of 157 women admitted with preeclampsia in South Africa showed AKI was common in women with preeclampsia and was associated with higher maternal and perinatal mortality. Of the study cohort, 15.3% met AKI criteria: 6.9% stage 1, 4.3% stage 2, and 4.1% stage 3, and only two-thirds of women with AKI recovered their kidney recovery. Hypertension in a previous pregnancy had a 2.2 fold higher odds of AKI stage 2 or 3.(15) Preeclampsia can be difficult to distinguish from progression of CKD in patients with preexisting kidney disease due to overlapping clinical features. The rate of decline of kidney function, as well as worsening of proteinuria, may prove to be helpful for the diagnosis of preeclampsia. Additionally, maternal serum levels of soluble angiogenic factors soluble fms-like tyrosine kinase-1 and placental growth factor may be utilized to distinguish between preeclampsia and CKD. Rolfo et al showed that women with preeclampsia had a significant increase in soluble fms-like tyrosine kinase- 1 levels, increase in serum levels of placental growth factor , and an increase in soluble fms-like tyrosine kinase-1 to placental growth factor ratio (median 436) as compared to women with CKD (median 4).(16)"
        text: |
          الـ glomerular filtration rate (GFR) في الـ preeclampsia بيقع **30-40%** بس. لكن عند عيانة عندها chronic kidney disease (CKD) قبل الحمل الصورة بتتلخبط.

