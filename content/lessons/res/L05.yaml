        quote: "Example\nIn a cohort study investigating the\nrelationship between 10-Minute Apgar Scores\n(as an indictor for asphyxia) and Risk of\nDeath in the First Year of Life among Infants\nwith Birth Weights of at Least 2500 G.\nIexp:\nDeath rate among those with very low Apgar score (0-3) = 34.4%\nI unexp:\nDeath rate among those with higher Apgar score(4-6) = 12.5%"
