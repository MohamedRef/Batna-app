      - kind: explain
        page: 73
        quote: "Direct activation of the renin-angiotensin-aldosterone system"
        title: "ليه الـ diuretic بيعمل العيوب دي؟"
        text: |
          الكتاب (Table 3) بيعدّ العيوب. التفسير المقبول (مش في الكتاب) لأهمهم:

          - **Direct RAAS activation:** الـ loop diuretic بيقفل الـ NKCC2 في الـ **macula densa** كمان، **فـ** الخلية دي بتحس إن الكلوريد قليل وتطلب **renin**. يعني الدوا نفسه بيشغّل الهرمون اللي بيحبس الصوديوم.
          - **Hypokalemia:** صوديوم أكتر بيوصل للـ distal nephron، ومعاه aldosterone عالي، **فـ** الـ K يتبادل ويطلع في البول.
          - **Hypomagnesemia:** الـ Mg بيتمص في الـ loop بين الخلايا بفضل شحنة الـ lumen. الـ loop diuretic بيلغي الشحنة دي **فـ** الـ Mg يضيع.
          - **Deterioration in renal function:** لو شلت مية من الدم أسرع ما الأنسجة ترجّعها، الـ perfusion يقل.
          - **Resistance:** الـ nephron بيتأقلم، وده ليه درس لوحده في آخر المحاضرة.
      - kind: reveal
        page: 73
        quote: "Table 3: Potential shortcomings of diuretic use in treatment of heart failure\nDirect activation of the renin-angiotensin-aldosterone system\nDeterioration in renal function\nElectrolyte abnormalities (e.g., hypokalemia and hypomagnesemia)\nSuboptimal natriuresis (production of hypotonic urine)\nDevelopment of diuretic resistance\nUnpredictability of the therapeutic response\nLack of clarity on the practical aspects of use (e.g., optimal dosing strategy)\nNonrenal adverse effects (e.g., ototoxicity and hypersensitivity)"
        prompt: "ليه الـ hypotonic urine مشكلة في عيان الـ HF؟"
        answer: |
          المشكلة في الـ heart failure (HF) هي **الصوديوم** الزيادة، والمية بتمشي وراه. لو البول **hypotonic**، يبقى انت بتشيل مية أكتر من الصوديوم، فالـ total body sodium يفضل عالي والـ congestion يرجع.

          الـ ultrafiltrate بقى **isotonic** زي البلازما، علشان كده الكتاب بيقول **higher mass clearance of sodium**. (الشرح فسيولوجي.)
      - kind: table
        page: 73
        quote: "Table 4: Proposed Advantages of Slow Ultrafiltration Compared with Diuretics\nMore rapid removal of fluid and improvement in symptoms\nHigher mass clearance of sodium\nDecreased risk of electrolyte abnormality (eg, hypokalemia)\nLack of RAAS activation\nLack of neurohormonal (SNS) activation\nRemoval of pro-inflammatory cytokines (with potential restoration of responsiveness to diuretics)\nShortened length of stay for HF-related hospitalizations\nDecreased rate of readmissions for HF-related hospitalizations\nDecreased risk of worsening renal function"
        title: "Table 4: ليه الـ slow UF؟"
        columns: [Advantage, Detail]
        rows:
          - ["Speed", "More rapid fluid removal and symptom relief"]
          - ["Sodium", "Higher mass clearance of sodium"]
          - ["Electrolytes", "Less hypokalemia"]
          - ["Hormones", "No RAAS and no SNS activation"]
          - ["Cytokines", "Removed; may restore diuretic response"]
