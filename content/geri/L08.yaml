    front: Define arthritis as used in the lecture.
    back: A disease of articular joints that alters them biochemically, structurally and physiologically; a heterogeneous degenerative disorder with many causes and presentations.
    src: { page: 139, quote: "Arthritis is a disease of articular joints that alters the joints biochemically, structurally, and physiologically. There are many classifications for arthritis since it is a heterogeneous, degenerative disorder with multiple etiologies and presentations. Primary or idiopathic arthritis is without a specific or known antecedent and primarily affects the hands, hips, knees, and spine. Secondary arthritis has an underlying cause such as acute trauma or a rheumatologic, metabolic, or infectious disease." }
