  - id: rheum.L19.lesson8
    title: "الحمل وعلاج الـ non-renal SLE"
    hook: "الخصوبة زي الطبيعي، بس الـ M والـ C بره الحمل. والشدة بالأرقام: 9/18، 100/50/20."
    minutes: 8
    pages: [323, 324]
    topics: [pregnancy, nonrenal]
    goals:
      - "تعرف مخاطر الحمل على الأم والجنين ومين أكتر عرضة"
      - "تفرّق الأدوية المسموحة والممنوعة في الحمل"
      - "تدرّج الـ non-renal SLE وتختار العلاج"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L19.095]
        page: 323
        title: "الحمل"
        quote: "There is no significant difference in fertility in lupus patients.\nPregnancy may increase lupus disease activity, but these flares are usually mild."
        text: |
          - **الخصوبة:** مفيش فرق كبير.
          - الحمل ممكن يزوّد النشاط، بس الـ flares غالبًا ==mild==.
          - **LN + aPL** ← risk أعلى لـ **pre-eclampsia** ← متابعة أقرب.
          - **الجنين** (لو LN أو aPL أو anti-Ro/La): miscarriage، stillbirth، preterm، **intrauterine growth restriction (IUGR)**، و **congenital heart block**.

          ليه الـ LN والـ aPL بالذات؟ لأن الاتنين بيأذوا الأوعية: الكلية المريضة بتعلّي الضغط، والـ aPL بيعمل جلطات في الـ placenta، فالـ pre-eclampsia والـ fetal loss يزيدوا.
      - kind: figure
        page: 324
        quote: "SLE may affect the fetus in several ways, especially if the mother has a history of lupus nephritis, antiphospholipid, anti-Ro and/or anti-La antibodies."
        title: "مين الأم اللي في خطر، وإيه اللي يحصل للجنين؟"
        alt: "Left column: maternal risk markers, lupus nephritis, antiphospholipid antibodies, anti-Ro or anti-La. Arrow to the right column: fetal risks, miscarriage, stillbirth, premature delivery, intrauterine growth restriction, congenital heart block. A bottom bar notes that lupus nephritis plus antiphospholipid antibodies also raise the mother's pre-eclampsia risk."
        caption: "تلات علامات عند الأم (==LN، aPL، anti-Ro/La==) بتزوّد خمس مخاطر للجنين. والـ **LN + aPL** كمان بيزوّدوا الـ pre-eclampsia عند الأم نفسها."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L19p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="8" y="10" width="128" height="200" rx="10" class="fg-acc"/>
            <text x="72" y="34" text-anchor="middle" class="t-sm t-b">Mother</text>
            <text x="72" y="72" text-anchor="middle" class="t-sm">Lupus nephritis</text>
