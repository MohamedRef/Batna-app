        title: "CRS-4 و CRS-5"
        quote: "Figure 4: Mechanism of damage in CRS-4. CKD, chronic kidney disease; CRS, cardiorenal syndrome; EPO, erythropoietin; LDL, low-density lipoprotein.\nCKD Stage 1-2 → (Glomerular/Interstitial damage) → CKD Stage 3-4 → (Sclerosis-fibrosis) → CKD Stage 5-6\nCKD Stage 1-2: Genetic risk factors, Diabetes Mellitus, Primary nephropathy, Hypertension, Chronic inflammation → Chronic Heart Dysfunction\nCKD Stage 3-4: Anemia, Uremic toxins, Chronic inflammation, Electrolyte imbalance → Chronic Heart Dysfunction\nCKD Stage 5-6:\n  Anemia, Uremic toxins, Tissue calcification, EPO resistance, Electrolyte imbalance → Chronic Heart Dysfunction\n  Cytokine production: Endothelial dysfunction, LDL oxidation, Oxidative stress, Atherosclerosis, Bone remodeling, Adipocyte production → Chronic Heart Dysfunction"
        text: |
          **CRS-4** بيكبر مع الـ CKD stage:
          - **Stage 1–2:** genetic risk، **diabetes**، primary nephropathy، **hypertension**، chronic inflammation.
          - **Stage 3–4:** **anemia**، **uremic toxins**، chronic inflammation، electrolyte imbalance.
          - **Stage 5:** فوق كده ==tissue calcification== و **erythropoietin (EPO) resistance**، و cytokines: endothelial dysfunction، low-density lipoprotein (LDL) oxidation، oxidative stress، atherosclerosis، bone remodeling.

          **CRS-5:** **sepsis، diabetes، amyloidosis، vasculitis** بيعملوا monocyte activation و cytokines، hypoxia و oxidative stress، hypoperfusion و ischemia، و sympathetic activation، فالاتنين يتأذوا مع بعض.

          التفسير المقبول (مش في الكتاب): في الـ CRS-5 الاتنين بيتأذوا مع بعض **لأن** الـ cytokines والـ hypoperfusion بيوصلوا لكل الأعضاء في نفس الوقت، مش عضو بيستنى التاني.
