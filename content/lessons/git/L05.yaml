  - id: git.L05.lesson7
    title: "NICE: النور الأزرق بيقولك النوع"
    hook: "قبل ما تاخد biopsy: لون البوليب، الأوعية، وشكل السطح. التلاتة دول بيقولولك hyperplastic ولا adenoma ولا cancer."
    minutes: 7
    pages: [195, 196]
    topics: [nice]
    goals:
      - "تعرف الـ NICE classification بتعتمد على إيه"
      - "تفرّق type 1 و 2 و 3 بالـ color والـ vessels والـ surface"
      - "تعرف القرار اللي بيطلع من كل type"
    status: unverified
    steps:
      - kind: explain
        page: 195
        quote: "The NICE (NBI International Colorectal Endoscopic) Classification is based on narrow-band images of colon polyps. The classification uses staining, vascular patterns, and surface patterns to distinguish between hyperplastic and adenomatous colon polyps"
        title: "NICE: النور الأزرق"
        text: |
          **NICE** = narrow-band imaging (NBI) International Colorectal Endoscopic classification. بنبص على البوليب بالـ **narrow-band imaging** وبنقيّم 3 حاجات:

          - ==Color== (staining)
          - **Vessels**
          - **Surface pattern**

          وبينفع مع أو من غير zoom.

          التفسير المقبول (مش في الكتاب): ليه نتعب نفسنا بالتصنيف ده؟ لأنه بيخليك تاخد القرار وانت في المنظار: تشيل، ولا تسيب، ولا تعلّم المكان وتحوّل للجراحة، من غير ما تستنى نتيجة biopsy.
      - kind: reveal
        page: 195
        quote: "vascular patterns, and surface patterns to distinguish between hyperplastic and"
        prompt: "ليه الضوء الأزرق (NBI) بيبيّن الأوعية أحسن من الضوء العادي؟"
        answer: |
          الكتاب: الـ NICE مبني على **narrow-band images**، وبيستخدم ==staining، vascular patterns، surface patterns== علشان يفرّق الـ hyperplastic من الـ adenomatous.

          التفسير المقبول (مش في الكتاب): الـ NBI بيستخدم موجات ضوء ضيقة (أزرق وأخضر) الـ hemoglobin بيمتصها جامد. فالأوعية تبان بني غامق على خلفية فاتحة. والـ adenoma بيحتاج دم أكتر علشان خلاياه بتنقسم، فبيعمل أوعية أكتر وأتخن، فيبان «أبني» من اللي حواليه. يعني الـ NBI بيحوّل نشاط الخلية لـ لون تشوفه بعينك.
      - kind: figure
        page: 195
        quote: "NBI International Colorectal Endoscopic (NICE) Classification*\n|  | Type 1 | Type 2 | Type 3 |\n|---|---|---|---|\n| Color | Same or lighter than background | Browner relative to background (verify color arises from vessels) | Brown to dark brown relative to background; sometimes patchy whiter areas |\n| Vessels | None, or isolated lacy vessels coursing across the lesion | Brown vessels surrounding white structures** | Has area(s) of disrupted or missing vessels |\n| Surface Pattern | Dark or white spots of uniform size, or homogeneous absence of pattern | Oval, tubular or branched white structure surrounded by brown vessels** | Amorphous or absent surface pattern |\n| Most likely pathology | Hyperplastic | Adenoma*** | Deep submucosal invasive cancer |\n* Can be applied using colonoscopes with or without optical (zoom) magnification\n** These structures (regular or irregular) may represent the pits and the epithelium of the crypt opening.\n*** Type 2 consists of Vienna classification types 3, 4 and superficial 5 (all adenomas with either low or high grade dysplasia, or with superficial submucosal carcinoma). The presence of high grade dysplasia or superficial submucosal carcinoma may be suggested by an irregular vessel or surface pattern, and is often associated with atypical morphology (e.g., depressed area)."
        title: "NICE في صورة"
        alt: "Three stacked panels drawn as polyp sketches. Type 1: pale polyp the same colour as the background, no vessels, uniform dots; hyperplastic. Type 2: brown polyp with brown vessels surrounding oval and branched white structures; adenoma. Type 3: dark brown polyp with broken missing vessels and an amorphous surface; deep submucosal invasive cancer."
        caption: "Type 1 فاتح ومن غير vessels = hyperplastic. Type 2 بني وفيه vessels حوالين white structures = adenoma. Type 3 غامق والـ vessels مقطعة = deep submucosal cancer."
        svg: |
          <svg viewBox="0 0 330 420" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="5" width="320" height="130" rx="8" class="fg-box"/>
            <circle cx="65" cy="70" r="45" class="fg-thin"/>
