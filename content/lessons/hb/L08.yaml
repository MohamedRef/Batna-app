  - id: hb.L08.lesson2
    title: "إزاي تمسك الدوا متلبّس"
    hook: "رقم واحد اسمه R بيقولك تدوّر فين. وأسبوعين بعد وقف الدوا بيقولولك إذا كنت صح."
    minutes: 9
    pages: [129, 130]
    topics: [diagnosis]
    goals:
      - "تحسب الـ R value وتعرف كل band بيودّي على أنهي workup"
      - "تعرف عناصر الـ drug history والأمراض اللي لازم تستبعدها"
      - "تحكم على الـ dechallenge بالأرقام"
    status: unverified
    steps:
      - kind: explain
        page: 129
        quote: "High index of suspicion. Abnormalities in hepatic associated enzymes. Hepatitis like symptoms. Jaundice."
        title: "التشخيص = شك + استبعاد"
        text: |
          التشخيص في الكتاب بيتبني على 3 حاجات:

          - **High index of suspicion**: enzymes متلخبطة، hepatitis-like symptoms، أو jaundice في عيان بياخد أدوية.
          - **Drug history**: الـ dose، الـ duration of therapy، والـ ==latency== (الوقت من بداية الدوا لحد الإصابة). والـ workflow بيسأل عن الأدوية والـ supplements في آخر 6 months.
          - ==Exclusion of other causes==: hepatitis B، hepatitis C، alcoholic liver disease، non-alcoholic fatty liver disease (NAFLD)، و hemochromatosis.

          الـ latency مهمة: دوا بدأ امبارح صعب يكون السبب، ودوا بقاله سنين من غير مشاكل أقل احتمالًا من دوا جديد.
      - kind: reveal
        page: 129
        quote: "Diagnosis of (DILD):\n  High index of suspicion.\n  Abnormalities in hepatic associated enzymes.\n  Hepatitis like symptoms.\n  Jaundice.\n  Drug history:\n    Dose.\n    Duration of therapy.\n    Time between initiating therapy and the development of hepatic injury (latency).\n  Exclusion of other causes of liver diseases (2%-5% of general population):\n    Hepatitis B.\n    Hepatitis C.\n    Alcoholic liver diseases.\n    Non alcoholic fatty liver diseases.\n    Hemochromatosis."
