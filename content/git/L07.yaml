items:
  # ---------- p225: definition and incidence ----------
  - id: git.L07.001
    kind: card
    topic: definition
    front: Define lower GI bleeding.
    back: Bleeding from below the ligament of Treitz.
    src: { page: 225, quote: "It is bleeding below the ligament of Treitz." }
    status: unverified
    tags: [high-yield]
  - id: git.L07.002
    kind: cloze
    topic: definition
    text: "Normal fecal blood loss is {{c1::1.2 ml/day}}; it is significant if the loss is more than {{c2::10 ml/day}}."
    src: { page: 225, quote: "Normal fecal blood loss 1.2 ml/day. It is significant if the loss >10 ml/day." }
    status: unverified
    tags: [numbers]
  - id: git.L07.003
    kind: card
    topic: definition
    front: How can lower GI bleeding present?
    back: As hematochezia (bright red blood to old clots), or as melena if the source is proximal and the bleeding slow.
    src: { page: 225, quote: "Hematochezia ranges from bright red blood to old clots or Melena if the bleeding from proximal source with slow rate of bleeding." }
    status: unverified
  - id: git.L07.004
    kind: cloze
    topic: definition
    text: "Lower GI bleeding is {{c1::22–30%}} of GI bleeding, about {{c2::one-third}} as common as upper GI hemorrhage, with a more benign course."
    src: { page: 225, quote: "It accounts for 22-30% of GIT bleeding. Lower tract bleeding is one-third as common as upper gastrointestinal hemorrhage" }
    status: unverified
    tags: [numbers]
  - id: git.L07.005
    kind: cloze
    topic: definition
    text: "{{c1::80–85%}} of lower GI bleeds come from distal to the ileocecal valve; only {{c2::0.7–9%}} come from the small intestine."
    src: { page: 225, quote: "80% to 85% of lower GI bleeds originate distal to the ileocaecal valve, with only 0.7% to 9% originating from the small intestine." }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L07.006
    kind: cloze
    topic: definition
    text: "{{c1::80%}} of lower GI bleeds resolve spontaneously and {{c2::25%}} recur; incidence rises steeply with {{c3::age}}."
    src: { page: 225, quote: "80% resolve spontaneously and 25% will recur. The incidence rises steeply with increasing the age." }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L07.007
    kind: card
    topic: definition
    front: Three grades of lower GI bleeding by amount?
    back: Massive, moderate, or occult.
    src: { page: 225, quote: "It can be categorized into massive, moderate or occult bleeding." }
    status: unverified
  # ---------- p225-226, 229: upper source ----------
  - id: git.L07.008
    kind: card
    topic: upper-source
    front: Hematochezia with hemodynamic instability should make you think of what?
    back: A brisk upper GI bleed.
    src: { page: 225, quote: "Hematochezia associated with hemodynamic instability should lead to consideration of a brisk UGIB source" }
    status: unverified
    tags: [high-yield]
  - id: git.L07.009
    kind: enumerate
    topic: upper-source
    prompt: Which patients with hematochezia are at risk of a brisk upper GI source?
    points:
      - History of peptic ulcer disease
      - Liver disease with portal hypertension
      - Antiplatelet or anticoagulant use
    pass: 3
    src: { page: 225, quote: "history of peptic ulcer disease or liver disease with portal hypertension and those using antiplatelet or anticoagulant medications" }
    status: unverified
  - id: git.L07.010
    kind: cloze
    topic: upper-source
    text: "A blood urea nitrogen to creatinine ratio above {{c1::30}} suggests an {{c2::upper GI}} source."
    src: { page: 225, quote: "An elevated blood urea nitrogen to creatinine ratio (> 30) also suggests an UGIB" }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L07.011
    kind: card
    topic: upper-source
    front: Red blood and clots per rectum point away from which source?
    back: An upper GI source; they are unlikely to come from the upper tract.
    src: { page: 226, quote: "red blood and clots are unlikely to be from an upper gastrointestinal source" }
    status: unverified
  - id: git.L07.012
    kind: card
    topic: upper-source
    front: When should upper endoscopy be done in a patient with hematochezia?
    back: When hematochezia comes with hemodynamic instability and suspicion of an upper source is high, to exclude a proximal bleed.
    src: { page: 229, quote: "an upper endoscopy should be performed if the suspicion is high to exclude a proximal source of bleeding" }
    status: unverified
  - id: git.L07.013
    kind: mcq
    topic: upper-source
    stem: A 64-year-old man with cirrhosis and portal hypertension passes large maroon clots per rectum. BP 85/50, pulse 122. BUN/creatinine ratio 42. What should come first after resuscitation?
    options:
      - Upper endoscopy
      - Colonoscopy after bowel preparation
      - Tagged red cell scan
      - Capsule endoscopy
      - Discharge with outpatient colonoscopy
    answer: 0
    why:
      - "Correct: hematochezia with instability, portal hypertension and BUN/Cr >30 point to a brisk upper source (p225, p229)."
      - Colonoscopy comes after an upper source is excluded.
      - A tagged red cell scan is for slower bleeding and does not exclude an upper source.
      - Capsule endoscopy is for small bowel bleeding after upper and lower tests.
      - He is unstable; discharge is unsafe.
    src: { page: 225, quote: "An elevated blood urea nitrogen to creatinine ratio (> 30) also suggests an UGIB" }
    status: unverified
  # ---------- p226-227: causes ----------
