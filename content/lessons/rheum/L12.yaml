  # ------------------------------------------------------------------
  - id: rheum.L12.lesson1
    title: "JIA: مفاصل صغيرة ومشكلة كبيرة"
    hook: "طفل ركبته وارمة من شهرين ومش بيعيط. ده مش دلع، ده أشهر روماتيزم مزمن في الأطفال."
    minutes: 8
    pages: [197, 199]
    topics: [definition, epidemiology, pathophysiology, classification]
    goals:
      - "تعرف تعريف الـ JIA والتلات شروط"
      - "تحفظ نسب الأنواع والسن والجنس"
      - "ترتب الـ ILAR categories السبعة"
    status: unverified
    steps:
      - kind: explain
        page: 197
        quote: "heterogeneous group of disorders characterized by childhood-onset chronic arthritis of unknown cause."
        title: "التعريف"
        text: |
          الـ ==JIA== مش مرض واحد. هو **heterogeneous group of disorders**: chronic arthritis بيبدأ في الطفولة، وسببه unknown (عشان كده idiopathic).

          - **أشهر chronic inflammatory rheumatic disease** في الأطفال.
          - الـ prevalence: **50–200 لكل 100,000 طفل**.
          - اتوصف من **1890** ولسه السبب مش واضح.
      - kind: mnemonic
        page: 197
        quote: "All three conditions must be met Arthritis persisting for longer than 6 weeks. Arthritis beginning before 16 years of age."
        word: "SIX"
        parts:
          - { key: "S", text: "Sixteen: arthritis begins before 16 years" }
          - { key: "I", text: "In place for more than 6 weeks" }
          - { key: "X", text: "eXclude other causes that mimic arthritis" }
        hook: |
          التلات شروط لازم **كلهم** يتحققوا. افتكر **SIX**: الـ 6 أسابيع هي قلب التعريف، و 16 سنة بتبدأ بـ six-teen.
      - kind: check
        page: 197
        quote: "Arthritis persisting for longer than 6 weeks."
        question: "A 5-year-old has had a swollen knee for 3 weeks; infection excluded. JIA?"
        options: ["Not yet: needs more than 6 weeks", "Yes, if ANA is positive", "Yes, any arthritis under 16", "No, too young"]
        answer: 0
        why:
          - "صح: لازم الـ arthritis يكمل أكتر من 6 أسابيع."
          - "الـ ANA مش من الشروط، ومفيش diagnostic test."
          - "ناقص شرط المدة."
          - "الـ peak أصلًا من سنة لـ 3 سنين."
      - kind: figure
        page: 197
        quote: "Systemic Onset: 10% to 15% of cases 2. Polyarticular: 15% to 20% of new cases. 3. Pauciarticular: 65% to 75% of new cases."
        title: "مين أشهر نوع؟"
        alt: "Three horizontal bars of JIA onset types. Pauciarticular is the longest bar, 65 to 75 percent. Polyarticular 15 to 20 percent. Systemic onset 10 to 15 percent."
        caption: "الـ pauciarticular (oligo) لوحده تقريبًا تلت أرباع الحالات."
        svg: |
          <svg viewBox="0 0 330 170" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="22" class="t-sm t-mut">share of new JIA cases</text>
            <rect x="10" y="35" width="230" height="30" class="fg-acc"/>
            <text x="18" y="55" class="t-sm t-b">Pauciarticular</text>
            <text x="248" y="55" class="t-sm t-b">65-75%</text>
            <rect x="10" y="80" width="60" height="30" class="fg-good"/>
            <text x="78" y="100" class="t-sm">Polyarticular 15-20%</text>
            <rect x="10" y="125" width="45" height="30" class="fg-bad"/>
            <text x="63" y="145" class="t-sm">Systemic onset 10-15%</text>
          </svg>
      - kind: explain
        page: 198
        quote: "the peak incidence of JRA occurred at one to three years of age, with a preponderance of girls in this age group."
        title: "السن والجنس"
        text: |
          - **Peak أول**: من **1 لـ 3 سنين**، أغلبهم **بنات**.
          - **Peak تاني** أصغر: **8–10 سنين**، فيه ولاد أكتر بـ oligoarticular JIA.
          - الـ ==female-to-male== عمومًا **2:1 لـ 3:1**.
          - الـ oligo تحت 8 سنين ممكن يوصل **8:1**، خصوصًا لو فيه iridocyclitis.
          - الـ **HLA-B27** late-onset: ولاد أكتر.
          - الـ **Systemic JIA**: مفيش فرق بين الجنسين.
      - kind: aside
        tone: joke
        page: 198
        quote: "Systemic JIA shows little or no discrimination between sexes."
        text: "الـ systemic JIA هو الوحيد اللي عنده مساواة كاملة بين الولاد والبنات. أعدل نوع في المحاضرة، بس للأسف أخطرهم."
      - kind: explain
        page: 198
        quote: "recruitment to the joint by up-regulation of adhesion molecules on synovial endothelium, and retention in the joint of activated cells."
        title: "إيه اللي بيحصل جوه المفصل؟"
        text: |
          الـ ==T-cells== هي البطل: الـ synovial endothelium بيرفع **adhesion molecules** فيشد الـ T cells للمفصل، وبعدين الخلايا المتنشطة بتفضل محبوسة جواه.

          - **من الـ T-cells**: TNF، IFN، IL-2.
          - **من الـ monocytes**: TNF، IL-1، IL-6، IL-8، IL-12.
          - الفرامل ضعيفة: **Regulatory T-cells** و IL-4، IL-10، TGF-β **قليلين**.
          - **HLA-A2** مرتبط بـ early-onset oligoarthritis في البنات.
      - kind: reveal
        page: 198
        quote: "Regulatory T-cells and anti-inflammatory cytokines (IL4, IL10 and TGF β) appear reduced"
        prompt: "ليه الالتهاب بيفضل مستمر (chronic) بدل ما يهدى لوحده؟"
        answer: "عشان البنزين كتير (TNF و IL-1 و IL-6 عالية) والفرامل بايظة: الـ Regulatory T-cells والـ anti-inflammatory cytokines (IL-4 و IL-10 و TGF-β) قليلة. والخلايا المتنشطة محبوسة جوه المفصل، فالنار مش بتطفي."
      - kind: table
        page: 199
        quote: "Oligoarticular JIA (PO or EO) < 4 joints in the first 6 months"
        title: "الـ categories السبعة"
        columns: ["Category", "Definition"]
        rows:
          - ["Systemic (SO)", "Arthritis + fever + 1 of rash, LN, liver/spleen, serositis"]
          - ["Oligo (PO/EO)", "≤ 4 joints in first 6 months; persistent or extended"]
          - ["RF-ve poly", "≥ 5 joints in first 6 months, RF-ve"]
          - ["RF+ve poly", "≥ 5 joints in first 6 months, RF+ve"]
          - ["ERA", "Arthritis + enthesitis"]
          - ["Psoriatic", "Arthritis + psoriasis"]
          - ["Undiff.", "No category, or > 1 category"]
        hide: [[0, 1], [1, 1], [2, 1], [4, 1], [6, 1]]
      - kind: match
        page: 199
        quote: "Enthesitis related JIA (ERA) Arthritis and enthesitis"
        prompt: "وصّل كل category بالي بيعرّفها:"
        pairs:
          - ["Oligoarticular", "≤ 4 joints in the first 6 months"]
          - ["Polyarthritis", "≥ 5 joints in the first 6 months"]
          - ["ERA", "Arthritis and enthesitis"]
          - ["Systemic onset", "Arthritis, fever and rash, nodes, organomegaly or serositis"]
          - ["Undifferentiated", "Fits no category or more than one"]
        why: "الرقم الفاصل بين oligo و poly هو 4 و 5 مفاصل في أول 6 شهور. الـ PO و EO يعني persistent و extended oligo."
      - kind: try
        items: [rheum.L12.003, rheum.L12.006, rheum.L12.009, rheum.L12.013, rheum.L12.015]
    recap:
      - "JIA = chronic arthritis قبل 16 سنة، أكتر من 6 أسابيع، بعد استبعاد غيره."
      - "Pauci 65–75%، poly 15–20%، systemic 10–15%."
      - "Peak 1–3 سنين بنات، وpeak تاني 8–10 ولاد."
      - "T cells + TNF/IL-1/IL-6 عالية و Tregs قليلة."
      - "Oligo ≤ 4 مفاصل، poly ≥ 5 في أول 6 شهور."
    practice: [rheum.L12.001, rheum.L12.002, rheum.L12.003, rheum.L12.004, rheum.L12.005, rheum.L12.006, rheum.L12.007, rheum.L12.008, rheum.L12.009, rheum.L12.010, rheum.L12.011, rheum.L12.012, rheum.L12.013, rheum.L12.014, rheum.L12.015, rheum.L12.016, rheum.L12.017, rheum.L12.091, rheum.L12.092]
