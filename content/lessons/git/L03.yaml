      - "الـ ACC بوابة الألم؛ الـ down-regulation ضعيفة في الـ FGIDs؛ الـ attention و hypnosis والعلاج النفسي وبعض الـ antidepressants بيقفلوها."
      - "Rome IV: A esophageal، B gastroduodenal، C bowel، D centrally mediated pain، E gallbladder و SO، F anorectal."
