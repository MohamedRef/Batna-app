    tags: [numbers, high-yield]
  - id: neph.L10.040
    kind: mcq
    topic: atin-mx
    stem: A man develops acute TIN 9 days after starting a new antibiotic. What is the key first step in management?
    options:
      - Identify the responsible drug and stop it
      - Start dialysis at once
      - Add a second antibiotic to cover infection
      - Restrict fluids to protect the lungs
    answer: 0
    why:
      - "Correct: after early diagnosis, the book's first step is to find and discontinue the culprit drug (p341)."
      - Dialysis is for those who need it, not the first step for everyone.
      - Adding antibiotics may add another allergen; allergic TIN is not an infection.
      - Fluid restriction is not part of the book's management; AKI care is supportive.
    src: { page: 341, quote: "Identification of the responsible drug and Discontinue." }
    status: unverified
