    src: { page: 358, quote: "Acute fatty liver of pregnancy Acute fatty liver of pregnancy (AFLP) as a cause of AKI in pregnancy is on the rise. AFLP is diagnosed later in the pregnancy, mostly after 30 weeks. The pathogenesis in 20% of cases of AFLP is secondary to fetal long-chain 3- hydroxyacyl CoA dehydrogenase deficiency which leads to accumulation of fetal free fatty acids that crosses the placenta and results in hepatotoxicity to the mother. Women usually present in the third trimester with nonspecific symptoms of nausea, vomiting, and abdominal pain. Many laboratory findings of AFLP overlap with HELLP syndrome and preeclampsia such as hepatic derangements, but AKI is more common in AFLP, being present in 20–100% of women. AKI in AFLP usually manifests similarly to hepatorenal syndrome, due to presence of liver failure, ascites and peripheral vasodilation. Elevated creatinine has shown to be an independent predictor of maternal mortality in HELLP syndrome. Swanson Criteria, defined by clinical symptoms and laboratory derangements of encephalopathy, hyperbilirubinemia, abdominal ascites, hypoglycemia, and micro vesicular steatosis on liver biopsy, can differentiate AFLP from HELLP syndrome/preeclampsia. Management is expectant delivery, platelet transfusion prior to delivery if platelet count less than 40,000 per microliter, and evaluation for liver transplant in severe cases. (18,19)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L11.041
    kind: mcq
    topic: aflp
    stem: "At 34 weeks a woman has vomiting, jaundice, confusion, ascites and a glucose of 45 mg/dL. Creatinine is 2.4 mg/dL. Which diagnosis fits best?"
    options:
      - HELLP syndrome
      - Acute fatty liver of pregnancy
      - Hyperemesis gravidarum
      - Atypical HUS
      - Septic abortion
    answer: 1
    why:
      - HELLP overlaps, but encephalopathy, ascites and hypoglycemia are Swanson features of AFLP.
      - "Correct: third trimester, liver failure picture with hypoglycemia; AKI is common and hepatorenal-like."
      - Hyperemesis is a first-trimester cause of prerenal AKI.
      - aHUS is usually postpartum with hemolysis and thrombocytopenia.
      - Septic abortion is a first-trimester cause.
