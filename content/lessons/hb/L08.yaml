      - kind: explain
        page: 128
        title: "خريطة المحاضرة: 10 أنواع reactions"
        text: |
          الكتاب بيقسّم حسب **type of reaction** لعشرة، وهي خريطة باقي الدروس:

          - **Direct toxic**، **idiosyncratic**، **combined toxic/allergic**، **allergic hepatitis**.
          - **Cholestatic**، **granulomatous**، **chronic hepatitis and cirrhosis**، **fatty liver / NASH**.
          - **Veno-occlusive disease**، **neoplastic**.
      - kind: try
        items: [hb.L08.004, hb.L08.008, hb.L08.010, hb.L08.014, hb.L08.016]
    recap:
      - "أهم خطوة: **identify and stop** الدوا بسرعة. العلاج = withdrawal + supportive."
      - "WHO: **< 2.5×** و **2.5–5×** mild، **5–10×** moderate، **> 10×** (ALT > 500) severe."
      - "DILI = **25–40%** من الـ fulminant hepatic failure."
      - "Predictable: dose related، hours، necrosis (acetaminophen). Idiosyncratic: rare **0.01–1%**، weeks–months."
