          - "مش hypothyroid."
      - kind: table
        page: 60
        quote: "It is the commonest diagnosed endocrine myopathy."
        title: "Myopathy كل غدة"
        columns: ["Disorder", "Key muscle feature"]
        rows:
          - ["Hyperthyroidism", "Proximal weakness + atrophy; periodic paralysis; MG; CK normal"]
          - ["Hyperparathyroidism", "Proximal weakness, wasting, brisk reflexes"]
          - ["Hypoparathyroidism", "Tetany cramps; CK may rise; overt myopathy rare"]
          - ["Cushing's", "Commonest diagnosed; striking proximal wasting"]
          - ["Adrenal insufficiency", "Fatigue; mild weakness less common"]
          - ["Conn's", "Weakness and wasting from K depletion"]
          - ["Acromegaly", "Big but weak muscles; duration, not GH, matters"]
        hide: [[0, 1], [3, 1], [5, 1], [6, 1]]
      - kind: aside
        tone: exam
        page: 60
        quote: "The duration of acromegaly rather than the serum GH levels, correlates with the degree of myopathy."
        text: "سؤال محبوب: في الـ acromegaly، درجة الـ myopathy ماشية مع **مدة المرض** مش مستوى الـ GH. وأشيع endocrine myopathy متشخصة = **Cushing's**."
      - kind: explain
        page: 61
        quote: "It is known to be neuropathic, affecting the proximal major nerve trunks & lumbosacral plexus."
        title: "الـ DM والعضلات"
        text: |
          - ==Diabetic amyotrophy==: اسمها خادع، هي **neuropathic** (lumbosacral radiculoplexopathy).
          - ==Thigh muscle infarction==: في السكر المش متظبط. ألم مفاجئ وورم و tenderness في فخذ واحد مع mass. أكتر عضلات: **adductors** و **biceps femoris**. والـ MRI بيبيّنها.
      - kind: explain
        page: 62
        quote: "anemia may be masked by hypovolemia. Once pts are given volume replacement, Hb level may drop rapidly"
        title: "الغدد والدم"
        text: |
          الـ androgens بتزوّد الـ erythropoiesis، والـ oestrogen والإخصاء بيقللوه. علشان كده الراجل الـ Hb بتاعه أعلى.

          - **Hypoproliferative anaemia**: hypothyroid، pituitary deficiency، **Addison's** (الأنيميا مستخبية ورا الـ hypovolaemia، وبعد المحاليل الـ Hb يقع بسرعة)، و HPT (أثر الكالسيوم على الكلية).
          - **Haemolytic**: sickle (impotence، infertility)، thalassaemia (haemochromatosis).
          - **Plasma cell dyscrasias** (Waldenström): الـ paraprotein بيمسك الـ thyroid hormones، وبيبوّظ الـ immunoassay.
          - **POEMS**: Polyneuropathy، Organomegaly، Endocrinopathy، M-protein، Skin.
      - kind: explain
        page: 63
        quote: "The hypothalamic pituitary axis is the part of endocrine system most commonly involved."
        title: "الـ granulomas"
        text: |
          - ==Sarcoidosis==: أكتر حاجة بتتأثر الـ **hypothalamic–pituitary axis**: **DI**، نقص هرمون أو أكتر (complete hypopituitarism نادر)، Addison's، والـ infertility نادرة. بتتحسن في الحمل وممكن تـ flare بعد الولادة.
          - ==Lepromatous leprosy==: testicular atrophy في **10-20%** بالـ invasion المباشر. الـ tubules الأول، بعدين الـ Leydig.
          - Schistosomiasis، و **Wegener's** مع hyperthyroidism.
      - kind: explain
        page: 64
        quote: "Werner syndrome : - Premature aging, cataract. - DM. - Papillary carcinoma of thyroid. - Gonadal atrophy."
        title: "الوراثة والمناعة"
        text: |
          - **Monogenic**: MODY، DI، thyroid hormone resistance، male-limited precocious puberty، CAH، androgen insensitivity، ataxia telangiectasia.
          - **Noonan**: قصر و thyroiditis. **Fanconi**: قصر و bone marrow hypoplasia. ==Werner==: شيخوخة مبكرة، cataract، DM، **papillary thyroid cancer**، gonadal atrophy.
          - **Immune**: PGA I و II، insulin receptor antibodies، autoimmune insulin syndrome (hypoglycaemia)، antithyroid antibodies، و ataxia telangiectasia (DM، gonadoblastoma في البنات).
      - kind: try
        items: [endo.L04.107, endo.L04.112, endo.L04.119, endo.L04.132, endo.L04.137]
    recap:
      - "CK طبيعي إلا في HHC: hypothyroid، hypopara، Conn's. والعلاج بيحسّن تقريبًا الكل."
      - "Hypothyroid: Kocher–Debré–Semelaigne (أطفال)، Hoffman's (كبار)."
      - "Cushing's أشيع متشخصة؛ acromegaly: المدة مش الـ GH."
      - "Diabetic amyotrophy = neuropathic؛ thigh infarction في adductors و biceps femoris."
      - "Addison's: الأنيميا تبان بعد المحاليل؛ POEMS؛ Waldenström بيبوّظ تحاليل الغدة."
      - "Sarcoid: HP axis و DI؛ leprosy: atrophy 10-20%."
