    src: { page: 440, quote: "Does finerenone slow progression of CKD and reduce cardiovascular mortality in patients with type 2 diabetes?\nPhase 3, double-blind, multicenter, randomized, controlled trial; 5674 patients with type 2 diabetes and CKD; 2.6 year median follow up\n| Outcome | Finerenone (10 mg or 20mg daily), n = 2833 | Hazard ratio | Placebo, n = 2841 |\n| Primary Composite Outcome: Kidney Failure with >40% decrease in eGFR over 4-week period or death from renal causes | 17.8% (504/2833) | HR 0.82 (0.73 − 0.93), p = 0.001 | 21.1% (600/2841) |\n| Secondary Composite Outcome: Death from cardiovascular causes or hospitalization for any cause | 13.0% (367/2833) | HR 0.86 (0.75 − 0.99), p = 0.03 | 14.8% (420/2841) |\nIn patients with CKD and type 2 diabetes, treatment with finerenone resulted in lower risk of CKD progression and cardiovascular events than placebo." }
