    src: { page: 393, quote: "the overall pooled prevalence did not exceed the reported rates in the general population, suggesting its safe use during conception" }
    status: unverified
  - id: neph.L11.199
    kind: mcq
    topic: tx-drugs
    stem: "A transplant recipient planning pregnancy takes sirolimus, prednisolone, ramipril, atenolol and cotrimoxazole. Which drug may be continued according to the book?"
