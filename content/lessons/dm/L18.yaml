      - kind: explain
        page: 237
        title: "ليه كل إجراء من الـ general measures؟"
        quote: "High fluid intake to maintain urine >2000 ml/day"
        text: |
          الكتاب بيدّيك الخمسة، والسبب (التفسير المقبول، مش في الكتاب إلا اللي متعلّم):
          - **Weight reduction**: الوزن والـ insulin resistance بيقللوا إخراج الـ urate (الـ metabolic syndrome في أسباب ص 234).
          - **Moderate protein, low fat**: اللحوم والأحشاء غنية بالـ purines، والـ purines بتتكسر لـ uric acid.
          - **Avoid alcohol**: الكتاب حاطه في أسباب الـ impaired excretion (ص 234) وفي الـ triggers (ص 235)؛ الـ lactate بيحجز الـ urate.
          - **Revise drugs**: الـ thiazides والـ salicylates (ص 234).
          - ==Urine >2000 ml/day==: البول المخفّف بيقلل تركيز الـ uric acid، وده واحد من عاملين الحصوات (ص 244).
      - kind: reveal
        page: 237
        quote: "Managing Intercritical and Chronic Gout: Aim to keep plasma uric acid < 6 mg/dl"
        prompt: "ليه الهدف 6 وإحنا بنعرّف الـ hyperuricemia في الراجل بـ 7؟"
        answer: |
          لأن الـ urate بيتشبّع ويترسب حوالي **6.8 mg/dl**. لو نزلته ==below 6== بيبقى unsaturated، فالكريستال اللي في الأنسجة والـ tophi تبدأ تدوب. 7 بيعرّف المرض، و 6 بيعالجه. (التفسير المقبول، مش في الكتاب؛ الأرقام من الكتاب.)
