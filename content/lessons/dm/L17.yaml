lecture: dm.L17
lessons:
  # ------------------------------------------------------------------
  - id: dm.L17.lesson1
    title: "العضم بيتسرق بالراحة"
    hook: "الـ osteoporosis مرض صامت لحد ما حاجة تنكسر. نفهم ليه بتنكسر، ومين بيتكسر إيه."
    minutes: 8
    pages: [214, 216]
    topics: [definition, types, peak-mass]
    goals:
      - "تعرّف الـ osteoporosis بالـ imbalance"
      - "تفرّق type 1 من type 2: مين، أي عضم، أي كسر"
      - "تعد العوامل اللي بتحدد الـ peak bone mass"
    status: unverified
    steps:
      - kind: explain
        page: 214
        title: "حساب بنك فيه سحب أكتر من الإيداع"
        quote: "The bone disease osteoporosis is caused by more bone cells being resorbed than being deposited."
        text: |
          العضم مش حجر، ده حساب بنك شغال طول الوقت: الـ **osteoclasts** بتسحب (resorption) والـ **osteoblasts** بتودع (deposition).

          الـ ==osteoporosis== = السحب أكتر من الإيداع. النتيجة: **progressive loss of bone density** و **thinning of bone tissue**.

          العضم بيبقى **more porous**، فبيبقى ==more vulnerable to fracture==.
      - kind: figure
        page: 214
        title: "عضم طبيعي وعضم مخرّم"
        image: { file: dm/L17-trabecular-bone.webp, book: true }
        alt: "Two proximal femurs side by side with magnified trabecular bone: normal bone has thick, dense struts; osteoporotic bone has thin struts with large holes."
        caption: "شوف الـ trabeculae: في الطبيعي سميكة ومتشابكة، وفي الـ **osteoporosis** رفيعة وبينها فراغات كبيرة. نفس الشكل من بره، بس من جوه **porous**."
      - kind: explain
        page: 215
        title: "بيتكسر فين؟"
        quote: "Bones liable to fracture in osteoporosis Vertebral bodies, distal radius, proximal femur."
        text: |
          الكتاب بيرسم الهيكل ويعلّم على تلات أماكن:
          - **Vertebral bodies**
          - **Distal radius** (الـ Colles' fracture)
          - **Proximal femur** (كسر الحوض/الـ hip)

          كلهم أماكن غنية بالـ **trabecular bone**، وده العضم الإسفنجي اللي بيتسرق الأول.
      - kind: table
        page: 215
        quote: "Affects six times as many women as men, and is mainly responsible for the increased risk of osteoporotic fractures."
        title: "Type 1 ضد type 2"
        columns: [Feature, Type 1, Type 2]
        rows:
          - ["Women : men", "6 : 1", "2 : 1"]
          - ["Bone", "Trabecular", "Trabecular + cortical"]
          - ["Fractures", "Vertebral crush, Colles'", "Femoral + vertebral"]
          - ["Age", "Postmenopausal", "Mainly > 70 y"]
          - ["Cause", "Postmenopausal endocrine", "Age-related vitamin D"]
        hide: [[0, 1], [0, 2], [2, 1], [2, 2]]
      - kind: mnemonic
        page: 215
        quote: "Also known as involutional or senile osteoporosis, it occurs mainly in persons > 70 years and affects twice as many women as men."
        word: "6T 2C"
        parts:
          - { key: "6", text: "Type 1: six women for every man" }
          - { key: "T", text: "Type 1: Trabecular bone, so vertebral crush and Colles'" }
          - { key: "2", text: "Type 2 (senile, mainly over 70): two women for every man" }
          - { key: "C", text: "Type 2: Cortical bone too, so femoral fractures join in" }
        hook: "**6T** للست اللي لسه داخلة سن اليأس، و **2C** للجدّة اللي فوق السبعين."
      - kind: reveal
        page: 216
        quote: "Because density decreases in both trabecular and cortical bone, type 2 osteoporosis results in femoral and vertebral fractures."
        prompt: "ليه type 2 بس اللي بيكسر الـ femur بسهولة؟"
        answer: |
          لأن عنق الـ femur محتاج **cortical bone** قوي يشيله. في type 1 الخسارة في الـ **trabecular** أساسًا.

          في type 2 الكثافة بتقل في ==trabecular and cortical bone== مع بعض، فالكسور تبقى **femoral and vertebral**.
      - kind: explain
        page: 216
        title: "السبب والـ biphasic pattern"
        quote: "age-related changes in vitamin D synthesis are thought to lead to type 2 osteoporosis."
        text: |
          - **Type 1**: غالبًا من ==postmenopausal endocrinologic changes== (الـ estrogen وقع).
          - **Type 2**: من **age-related changes in vitamin D synthesis**.

          والست ممكن تاخد الاتنين مع بعض، فيبقى عندها **biphasic pattern of bone loss**.
      - kind: check
        page: 215
        quote: "Because it primarily affects trabecular bone, type 1 osteoporosis is mainly responsible for vertebral crush fractures and Colles' fractures."
        question: "A 55-year-old woman, 4 years after menopause, falls on her hand. Most likely fracture?"
        options:
          - "Colles' fracture"
          - "Femoral neck fracture"
          - "Skull fracture"
          - "Clavicle fracture"
        answer: 0
        why:
          - "صح: type 1 = trabecular = vertebral crush و Colles'."
          - "الـ femoral أكتر في type 2 فوق السبعين."
          - "مش من أماكن الـ osteoporosis في الكتاب."
          - "مش من الأماكن التلاتة في الشكل."
      - kind: explain
        page: 216
        title: "الـ peak bone mass: رصيدك قبل ما السحب يبدأ"
        quote: "Factors that may affect peak bone mass: 1. Gender 2. Race 3. Genetic factors 4. Gonadal steroids 5. Growth hormone"
        text: |
          كل ما رصيدك في الشباب أعلى، كل ما الـ osteoporosis تتأخر. العوامل اللي بتحدد ==peak bone mass==:
          1. Gender
          2. Race
          3. Genetic factors
          4. Gonadal steroids
          5. Growth hormone
          6. Timing of puberty
          7. Calcium intake
          8. Exercise
      - kind: aside
        tone: joke
        page: 216
        quote: "Factors that may affect peak bone mass: 1. Gender 2. Race 3. Genetic factors 4. Gonadal steroids 5. Growth hormone"
        text: "الـ **peak bone mass** زي تحويشة العمر: اللي حوّش لبن وكالسيوم ورياضة وهو صغير، يصرف براحته وهو كبير. واللي صرف على الشيبسي... ربنا يستر 😅"
      - kind: try
        items: [dm.L17.001, dm.L17.003, dm.L17.004, dm.L17.009, dm.L17.013]
    recap:
      - "Osteoporosis = resorption أكتر من deposition ← عضم porous بيتكسر."
      - "أماكن الكسر: vertebral bodies، distal radius، proximal femur."
      - "Type 1: 6:1، trabecular، crush + Colles'. Type 2: فوق 70، 2:1، cortical كمان ← femur."
      - "الـ peak bone mass: 8 عوامل، من الـ gender لحد الـ exercise."
    practice: [dm.L17.001, dm.L17.002, dm.L17.003, dm.L17.004, dm.L17.005, dm.L17.006, dm.L17.007, dm.L17.008, dm.L17.009, dm.L17.010, dm.L17.011, dm.L17.012, dm.L17.013]
  # ------------------------------------------------------------------
  - id: dm.L17.lesson2
    title: "مين في خطر؟ الأسباب التانوية والـ risk factors"
    hook: "الست الرفيعة المدخّنة اللي بتاخد cortisone: كل حاجة فيها بتقول osteoporosis. نعرف ليه."
    minutes: 9
    pages: [216, 218]
    topics: [secondary, risk]
    goals:
      - "تعدّ أسباب الـ secondary osteoporosis بالمجموعات"
      - "تشرح إزاي الـ steroids بتاكل العضم"
      - "تحفظ الـ risk factors وتعرف الـ FRAX"
    status: unverified
    steps:
      - kind: explain
        page: 216
        title: "مش كل osteoporosis سببها السن"
        quote: "These secondary causes account for < 5% of all cases of osteoporosis in postmenopausal women."
        text: |
          الـ **secondary causes** أقل من ==5%== في الستات بعد سن اليأس.

          بس في **young women and men of all ages** النسبة أعلى بكتير. وفي كبار السن لازم تفكر في **multiple causes** مع بعض.

          يعني: راجل عنده osteoporosis أو بنت شابة؟ دوّر على سبب.
      - kind: explain
        page: 217
        title: "الـ glucocorticoids: الحرامي رقم واحد"
        quote: "Endogenous or exogenous glucocorticoid excess is a leading cause of premature osteoporosis."
        text: |
          ==Glucocorticoid excess== (من بره أو من جوه) هو **leading cause of premature osteoporosis**، وبيهاجم من خمس جهات:
          - **Inhibit osteoblastic function**: الإيداع وقف
          - **Stimulate bone resorption**: السحب زاد
          - **Increase PTH secretion**
          - **Inhibit intestinal calcium absorption**
          - **Decreased end-organ response to vitamin D**
      - kind: check
        page: 217
        quote: "Corticosteroids inhibit osteoblastic function, stimulate bone resorption, increase parathyroid hormone secretion, inhibit intestinal calcium absorption"
        question: "Which is NOT an effect of corticosteroids on bone in the lecture?"
        options:
          - "Increased intestinal calcium absorption"
          - "Inhibited osteoblast function"
          - "More PTH secretion"
          - "Stimulated bone resorption"
        answer: 0
        why:
          - "صح: الـ steroids بتقلل امتصاص الكالسيوم، مش بتزوده."
          - "مذكورة في p217."
          - "مذكورة في p217."
          - "مذكورة في p217."
      - kind: figure
        page: 217
        quote: "SECONDARY CAUSES OF OSTEOPOROSIS"
        title: "Table 258-2 في صورة واحدة"
        alt: "Six boxes grouping secondary causes of osteoporosis: endocrine, gastrointestinal, bone marrow, connective tissue, drugs and miscellaneous, with key examples in each."
        caption: "ست مجموعات. الـ **Endocrine** أكبرهم، والـ **Drugs** أكتر واحدة بتيجي في الامتحان."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="8" width="314" height="96" rx="10" class="fg-acc"/>
            <text x="165" y="28" text-anchor="middle" class="t-b t-acc">Endocrine</text>
            <text x="165" y="48" text-anchor="middle" class="t-sm">Hypogonadism (F and M), hyperthyroidism</text>
            <text x="165" y="66" text-anchor="middle" class="t-sm">Hyperparathyroidism, hypercortisolism</text>
            <text x="165" y="84" text-anchor="middle" class="t-sm">GH and vitamin D deficiency, DM, hypercalciuria</text>
            <rect x="8" y="112" width="152" height="78" rx="10" class="fg-box"/>
            <text x="84" y="130" text-anchor="middle" class="t-b">GI</text>
            <text x="84" y="148" text-anchor="middle" class="t-sm">Gastrectomy</text>
            <text x="84" y="164" text-anchor="middle" class="t-sm">Malabsorption, alactasia</text>
            <text x="84" y="180" text-anchor="middle" class="t-sm">Cholestasis, PBC</text>
            <rect x="170" y="112" width="152" height="78" rx="10" class="fg-box"/>
            <text x="246" y="130" text-anchor="middle" class="t-b">Bone marrow</text>
            <text x="246" y="148" text-anchor="middle" class="t-sm">Myeloma, lymphoma</text>
            <text x="246" y="164" text-anchor="middle" class="t-sm">Leukemia, hemolysis</text>
            <text x="246" y="180" text-anchor="middle" class="t-sm">Mastocytosis, carcinoma</text>
            <rect x="8" y="196" width="152" height="72" rx="10" class="fg-box"/>
            <text x="84" y="216" text-anchor="middle" class="t-b">Connective tissue</text>
            <text x="84" y="234" text-anchor="middle" class="t-sm">Osteogenesis imperfecta</text>
            <text x="84" y="252" text-anchor="middle" class="t-sm">Ehlers-Danlos, Marfan, HCU</text>
            <rect x="170" y="196" width="152" height="72" rx="10" class="fg-bad"/>
            <text x="246" y="216" text-anchor="middle" class="t-b t-bad">Drugs</text>
            <text x="246" y="234" text-anchor="middle" class="t-sm">Steroids, heparin, alcohol</text>
            <text x="246" y="252" text-anchor="middle" class="t-sm">Thyroxine, anticonvulsants</text>
            <rect x="8" y="278" width="314" height="74" rx="10" class="fg-thin"/>
            <text x="165" y="298" text-anchor="middle" class="t-b">More drugs + miscellaneous</text>
            <text x="165" y="318" text-anchor="middle" class="t-sm">GnRH agonists, cyclosporine, tacrolimus, chemo</text>
            <text x="165" y="338" text-anchor="middle" class="t-sm">Immobilization, RA, renal tubular acidosis</text>
          </svg>
      - kind: sort
        page: 217
        quote: "Bone marrow disorders Multiple myeloma Lymphoma Leukemia Hemolytic anemias Systemic mastocytosis"
        prompt: "حط كل سبب في مجموعته في Table 258-2:"
        bins: ["Endocrine", "Bone marrow", "Drugs", "Connective tissue"]
        cards:
          - { text: "Hyperprolactinemia", bin: 0 }
          - { text: "Klinefelter syndrome", bin: 0 }
          - { text: "Systemic mastocytosis", bin: 1 }
          - { text: "Multiple myeloma", bin: 1 }
          - { text: "Heparin", bin: 2 }
          - { text: "Tacrolimus", bin: 2 }
          - { text: "Homocystinuria", bin: 3 }
          - { text: "Marfan syndrome", bin: 3 }
        why: "الـ hyperprolactinemia والـ Klinefelter كلهم **hypogonadism** (endocrine). الـ mastocytosis والـ myeloma أمراض **bone marrow**. الـ heparin والـ tacrolimus **drugs**. الـ homocystinuria والـ Marfan **connective tissue**."
      - kind: explain
        page: 217
        title: "الـ major risk factors"
        quote: "The major risk factors for osteoporosis are age, female sex, white or Oriental race, family history of osteoporosis, thin habitus, early menopause"
        text: |
          الكتاب بيعدهم كده:
          - **Age**، **female sex**، **white or Oriental race**
          - **Family history**، ==thin habitus==
          - **Early menopause (before 45)**، oophorectomy، secondary amenorrhea
          - **Lifelong low calcium intake** (حتى الـ lactose intolerance)
          - **Sedentary lifestyle** و **immobilization**
      - kind: explain
        page: 218
        title: "وعوامل تانية"
        quote: "Other risk factors include nulliparity, protein-calorie malnutrition, gastrectomy, alcohol abuse, cigarette smoking"
        text: |
          **Other risk factors**: nulliparity، protein-calorie malnutrition، gastrectomy، alcohol، **smoking**، وأي دوا أو مرض بيزوّد الـ bone loss (corticosteroids، thyrotoxicosis).

          و ==Age== هو **the chief single predictor**.
      - kind: reveal
        page: 218
        quote: "Obesity may protect because higher estrogen levels in obese men and women and increased skeletal weight bearing may stimulate bone formation."
        prompt: "ليه الست الرفيعة في خطر والتخينة محمية؟"
        answer: |
          - الرفيعة: **less biologically active estrogen** بعد سن اليأس، و **lower peak bone mass** وهي صغيرة.
          - التخينة: ==higher estrogen levels== (الدهون بتعمل estrogen)، و **weight bearing** أكتر بيحفّز الـ bone formation.

          وبالمرة: الـ blacks عندهم **greater peak bone mass**، علشان كده أقل.
      - kind: explain
        page: 218
        title: "الـ FRAX"
        quote: "Fracture risk assessment tool [FRAX] developed by WHO to predict your 10-year likelihood of having a minimal trauma fracture"
        text: |
          ==FRAX== أداة من الـ **WHO** بتحسب احتمال **minimal trauma fracture** في **10 سنين**.

          **Minimal trauma** = كسر من وقعة من طولك أو أقل. والنتيجة بتبقى أدق لو حطيت **DEXA results**.
      - kind: check
        page: 218
        quote: "(before age 45), oophorectomy, secondary amenorrhea, lifelong low calcium intake (including lactose intolerance), sedentary lifestyle, and immobilization."
        question: "Woman at high risk of osteoporosis is the following except:"
        options:
          - "Active"
          - "Caucasian"
          - "Smoker"
          - "Thin habitus"
        answer: 0
        why:
          - "صح (سؤال الكتاب): الـ risk factor هو **sedentary lifestyle**، النشاط بيحمي."
          - "White race = major risk factor."
          - "Smoking = risk factor."
          - "Thin habitus = major risk factor."
      - kind: try
        items: [dm.L17.017, dm.L17.018, dm.L17.019, dm.L17.026, dm.L17.035]
    recap:
      - "Secondary causes <5% بعد سن اليأس، بس أكتر في الشباب والرجالة."
      - "Steroids: osteoblasts ↓، resorption ↑، PTH ↑، امتصاص الكالسيوم ↓، استجابة الـ vitamin D ↓."
      - "Table 258-2: endocrine، GI، bone marrow، connective tissue، drugs، misc."
      - "Age = أقوى predictor. Thin + white + early menopause + smoker = خطر. Obesity ممكن تحمي."
      - "FRAX (WHO) = احتمال كسر في 10 سنين، أدق مع DEXA."
    practice: [dm.L17.014, dm.L17.015, dm.L17.016, dm.L17.017, dm.L17.018, dm.L17.019, dm.L17.020, dm.L17.021, dm.L17.022, dm.L17.023, dm.L17.024, dm.L17.025, dm.L17.026, dm.L17.027, dm.L17.028, dm.L17.029, dm.L17.030, dm.L17.031, dm.L17.032, dm.L17.033, dm.L17.034, dm.L17.035, dm.L17.036, dm.L17.037, dm.L17.136]
  # ------------------------------------------------------------------
  - id: dm.L17.lesson3
    title: "التشخيص بالاستبعاد: المعمل والأشعة"
    hook: "الـ primary osteoporosis ملهاش علامة مميزة. التشخيص إنك تشيل كل حاجة تانية."
    minutes: 9
    pages: [219, 221]
    topics: [clinical, labs, radiology]
    goals:
      - "تفرّق الـ osteoporosis عن الـ osteomalacia إكلينيكيًا"
      - "تعرف التحاليل اللي بتستبعد الأسباب التانوية"
      - "تقرا X-ray العمود الفقري: wedge، crush، codfish، Schmorl"
    status: unverified
    steps:
      - kind: explain
        page: 219
        title: "صامت لحد الكسر"
        quote: "Individuals with osteoporosis often remain asymptomatic until a fracture occurs."
        text: |
          المريض ==asymptomatic until a fracture occurs==. والسبب ممكن يبقى تافه زي إنه **اتقلب في السرير**، وإن كان الـ falling والـ lifting أشهر.

          على العكس، الـ **osteomalacia** بتعمل **diffuse bony tenderness and pain** حتى من غير كسر في الأشعة.
      - kind: aside
        tone: exam
        page: 219
        quote: "osteomalacia often causes diffuse bony tenderness and pain, even in the absence of radiographically evident fractures."
        text: "سؤال المقارنة المحبوب: **عضم بيوجع من غير كسر = osteomalacia**. **ساكت لحد ما يتكسر = osteoporosis**."
      - kind: explain
        page: 219
        title: "الـ history والكشف"
        quote: "hallmarks of metabolic bone disease (eg, fractures, loss of height, bone pain, and muscle weakness)"
        text: |
          التشخيص ==requires excluding== الـ osteomalacia والـ malignancy والـ secondary osteoporosis.

          اسأل عن الـ hallmarks: **fractures، loss of height، bone pain، muscle weakness**، وعن أدوية وأمراض الـ **vitamin D deficiency**.

          ودوّر على: alcohol، malabsorption، **hypercortisolism**، endocrinopathy، malignancy.
      - kind: explain
        page: 220
        title: "التحاليل الأساسية"
        quote: "A CBC count with differential, routine serum chemistry studies, thyroid function tests, serum protein electrophoresis"
        text: |
          لو الـ history مفيهوش سبب تانوي، التحاليل دي عادةً بتستبعد الباقي:
          - **CBC with differential**
          - **Routine chemistry**
          - **Thyroid function tests**
          - ==Serum protein electrophoresis==
          - **Serum 25-hydroxycholecalciferol**
          - **24-h urine calcium**
      - kind: reveal
        page: 220
        quote: "any abnormality in blood count or protein electrophoresis raises the possibility of a malignancy involving the bone marrow."
        prompt: "ليه الـ protein electrophoresis بالذات في مريض osteopenia؟"
        answer: |
          علشان الـ **multiple myeloma** بيعمل osteopenia ويقلّد الـ osteoporosis. أي abnormality في الـ CBC أو الـ electrophoresis = فكّر في ==malignancy involving the bone marrow==.
      - kind: table
        page: 220
        quote: "In primary osteoporosis, serum phosphate and alkaline phosphatase values are also normal."
        title: "المعمل في الـ primary osteoporosis"
        columns: [Test, Result]
        rows:
          - ["Electrolytes, BUN, creatinine", "Normal"]
          - ["Serum and urine calcium", "Usually normal"]
          - ["Phosphate, ALP", "Normal"]
          - ["Vitamin D levels", "Normal; may be low with age"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: tip
        page: 220
        quote: "The use of metabolic markers, such as serum osteocalcin, urinary excretion of pyridinium and deoxypyridinium, and urinary hydroxyproline"
        text: "الـ **bone turnover markers** (osteocalcin، pyridinium، deoxypyridinium، hydroxyproline) الكتاب بيقول إنها **under investigation** هنا، بس هترجع في المتابعة (CTX و P1NP) في آخر المحاضرة."
      - kind: figure
        page: 221
        quote: "A predominantly anterior compression of the vertebrae results in a wedge fracture; a collapse of the entire vertebral body results in a crush fracture."
        title: "الفقرات في الأشعة"
        alt: "Four vertebrae drawn side by side: normal rectangle; wedge fracture with a short front; crush fracture with the whole body flattened; codfish vertebra with concave end-plates and a Schmorl's node pushing into the bone."
        caption: "**Wedge** = الجزء الأمامي اتضغط. **Crush** = الفقرة كلها نزلت. **Codfish** = الـ end-plates بقت concave. **Schmorl's node** = الـ nucleus pulposus دخل في الفقرة."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <rect x="15" y="40" width="60" height="70" rx="4" class="fg-box"/>
            <text x="45" y="130" text-anchor="middle" class="t-sm t-b">Normal</text>
            <path d="M95 40 L155 40 L155 110 L95 110 Z" class="fg-thin"/>
            <path d="M95 62 L155 40 L155 110 L95 110 Z" class="fg-bad"/>
