      - kind: table
        page: 31
        quote: "T1: Translation to Humans Testing basic science discoveries for clinical effect and/or applicability"
        title: "Phase of translation"
        columns: ["What it tests", "Phase"]
        rows:
          - ["Basic science discoveries tested for clinical effect or applicability", "T1: to humans"]
          - ["New interventions in humans under controlled conditions; basis for guidelines", "T2: to patients"]
          - ["New interventions applied in general practice; best ways to implement them", "T3: to practice"]
          - ["Factors and interventions that influence the health of populations", "T4: to population"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: mnemonic
        page: 31
        quote: "Translational research continuum"
        word: "HPPP"
        parts:
          - { key: "H", text: "T1 → Humans" }
          - { key: "P", text: "T2 → Patients" }
          - { key: "P", text: "T3 → Practice" }
          - { key: "P", text: "T4 → Population" }
        hook: |
          الـ **translational research continuum** = **H** وبعدها 3 **P**: من الإنسان (Humans) للعيان (Patients) للعيادة (Practice) للبلد كلها (Population). ==كل خطوة الدايرة بتوسع==: شخص، مريض، ممارسة، شعب.
      - kind: check
        page: 31
        quote: "T3: Translation to Practice Research on the application of new interventions or therapies in general practice;"
        question: "After a new DAA is approved, a study asks how to make primary care clinics in Egypt prescribe it correctly. Which phase of translation is this?"
        options: ["T3", "T1", "T2", "T4"]
        answer: 0
        why:
          - "صح: T3 = translation to practice، ومعاه الـ dissemination and implementation research."
          - "T1 أول تجربة لاكتشاف معملي على بني آدم."
          - "T2 تجربة الدوا في ظروف controlled قبل ما يتعمم."
          - "T4 بيقيس أثر على صحة الـ population كلها."
      - kind: explain
        page: 29
        quote: "Safety study * 20-80 people * Identify side effects effectiveness side effects"
        title: "الـ clinical trial phases"
        text: |
          - **Preclinical**: lab and animal studies.
          - **Phase I (20-80 people)**: ==safety== وأحسن **dosage**، غالبًا في healthy volunteers.
          - **Phase II (100-300 people)**: safety وside effects، وأول قياس لـ **effectiveness**.
          - **Phase III (1,000-3,000 people)**: ==effectiveness على نطاق أكبر==، والجديد قدام الـ **standard treatment**.
          - **Phase IV (thousands, after approval)**: الـ long-term side effects اللي ماظهرتش في III.

          الأرقام دي من slide 29. في slide 28 مكتوب أرقام تانية:

          - **Phase 1 in slide 28: 20 to 100 people**
          - **Phase 2 in slide 28: 100 to 500 people**
          - **Phase 3 in slide 28: 300 to 3000 people**

          الامتحان بيختبر الفكرة والترتيب أكتر من الرقم بالظبط.
      - kind: aside
        tone: analogy
        page: 29
        quote: "Long term safety"
        text: |
          فكّر فيها زي عربية جديدة: **Phase I** بتشوف هل بتولّع من غير ما تنفجر (safety، dose). **Phase II** بتمشي بيها مشوار قصير (هل بتشتغل؟). **Phase III** بتسابقها قدام العربية القديمة (new vs standard). **Phase IV** بتشوف حالها بعد ما الناس اشترتها بسنين (==long term safety==).
      - kind: sort
        page: 30
        quote: "Phase II clinical trials Phase IV clinical trials T3 studies in the Phase III clinical trials Dissemination and community"
        prompt: "حط كل نوع دراسة تحت الـ T بتاعه (slide 30):"
        bins: ["T1", "T2", "T3", "T4"]
