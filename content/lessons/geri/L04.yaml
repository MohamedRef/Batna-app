  - id: geri.L04.lesson5
    title: "شخّص الـ delirium وعالجه: CAM والتلات Ds والـ haloperidol"
    hook: "الـ CAM أربع حاجات، محتاج تلاتة بس منهم. والـ haloperidol بنص مللي مش بالحقنة الكبيرة."
    minutes: 10
    pages: [70, 76]
    topics: [delirium-diagnosis, three-ds, delirium-treatment]
    goals:
      - "تطبّق الـ CAM algorithm"
      - "تختار الـ investigations وإمتى CT وإمتى LP"
      - "تفرّق delirium وdementia وdepression"
      - "تكتب جرعة الـ haloperidol صح"
    status: unverified
    steps:
      - kind: explain
        page: 70
        quote: "Disturbance of consciousness. • Change in cognition. • The disturbance develops over a short period."
        title: "الـ DSM-5"
        text: |
          الكتاب ملخّص الـ ==DSM-5== في أربعة:
          - **Disturbance of consciousness** (attention وawareness).
          - **Change in cognition**.
          - بيحصل في **short period** (ساعات لأيام) و**fluctuates** في اليوم.
          - **Evidence** من الـ history والـ exam والـ labs إن فيه سبب.

          وشرط: مايتفسّرش بـ neurocognitive disorder تاني، ومايبقاش في **coma**.
      - kind: figure
        page: 71
        quote: "In which the first 2 and either of the latter 2 are required for diagnosis."
        title: "الـ CAM algorithm"
        alt: "Flow: box 1 acute onset and fluctuating course, plus box 2 inattention, both required; then an OR between box 3 disorganised thinking and box 4 altered level of consciousness; arrow to delirium."
        caption: "1 + 2 لازم، وبعدين 3 أو 4. أربع ميزات، تلاتة كفاية."
        svg: |
          <svg viewBox="0 0 330 270" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="D04c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <rect x="40" y="10" width="250" height="40" rx="8" class="fg-acc"/>
            <text x="52" y="35" class="t-sm t-b">1. Acute onset + fluctuating</text>
            <text x="158" y="68" class="t-b">AND</text>
            <rect x="40" y="78" width="250" height="40" rx="8" class="fg-acc"/>
            <text x="52" y="103" class="t-sm t-b">2. Inattention</text>
            <path d="M165 120V140" class="fg-arrow-acc" marker-end="url(#D04c)"/>
            <rect x="10" y="145" width="140" height="44" rx="8" class="fg-box"/>
            <text x="18" y="165" class="t-sm t-b">3. Disorganised</text>
            <text x="18" y="181" class="t-sm">thinking</text>
            <text x="153" y="172" class="t-b t-acc">OR</text>
            <rect x="180" y="145" width="140" height="44" rx="8" class="fg-box"/>
            <text x="188" y="165" class="t-sm t-b">4. Altered level</text>
            <text x="188" y="181" class="t-sm">of consciousness</text>
            <path d="M165 192V215" class="fg-arrow-acc" marker-end="url(#D04c)"/>
            <rect x="105" y="220" width="120" height="40" rx="8" class="fg-ink"/>
            <text x="133" y="245" class="t-b">Delirium</text>
          </svg>
      - kind: check
        page: 71
        quote: "In which the first 2 and either of the latter 2 are required for diagnosis."
        question: "CAM: acute and fluctuating, disorganised thinking, altered consciousness, but attention is intact. Delirium by CAM?"
        options: ["No: inattention is essential", "Yes: three features present", "Yes: features 3 and 4 are enough", "Only if MMSE is low"]
        answer: 0
        why:
          - "صح: الـ 1 و2 essential؛ من غير inattention مفيش CAM delirium."
          - "مش أي تلاتة: لازم 1 و2."
          - "الـ 3 و4 لوحدهم مش كفاية."
          - "الـ MMSE مش جزء من الـ CAM."
      - kind: explain
        page: 71
        quote: "It has 16- items 13 of which assess the severity. 3 items are of diagnostic significance."
        title: "الـ rating scales"
        text: |
          - ==Delirium Rating Scale==: **16 items** (13 severity + 3 diagnostic)، كل واحد 0-3. Severity أكتر من **15** أو total أكتر من **18** = delirium.
          - **MDAS**: **10 items**، 0-3، على arousal وconsciousness وmemory وattention وorientation وthinking وpsychomotor.
      - kind: explain
        page: 73
        quote: "Perform CT scan of the head (indications are focal neurological deficits, TIA, and history of a previous stroke)"
        title: "الـ work-up"
        text: |
          دوّر على السبب: infection، dehydration، electrolytes، **polypharmacy**، مرض حاد، تغيير علاج، constipation، **urinary retention**.

          - **Labs**: urinalysis وculture، CXR، ECG وtroponin، CBC، electrolytes، glucose، liver/renal، thyroid.
          - ==CT head==: لو **focal deficit**، TIA، أو stroke قبل كده.
          - **MRI**: stroke، hemorrhage، structural lesions.
          - ==Lumbar puncture==: لو شاكك في **CNS infection** أو الـ systemic source مش لاقيه.
      - kind: table
        page: 74
        quote: "Delirium vs. Dementia vs. Depression"
        title: "التلات Ds"
        columns: ["", "Delirium", "Dementia"]
        rows:
          - ["Onset", "Hours-days", "Months-years"]
          - ["Course", "Fluctuating", "Progressive"]
          - ["Conscious", "Altered", "Usually clear"]
          - ["Attention", "Impaired", "Normal till severe"]
          - ["Reverse", "Usually", "Irreversible"]
        hide: [[0, 1], [1, 2], [2, 1], [3, 1]]
      - kind: explain
        page: 74
        quote: "Delirium vs. Dementia vs. Depression"
        title: "والـ depression فين؟"
        text: |
          الـ ==depression== في نفس الجدول:
          - **Onset** acute أو insidious (أسابيع لشهور)، وممكن تبقى **chronic**.
          - **Consciousness clear**، الـ attention ممكن تقل.
          - **Psychomotor** ممكن يبطأ في الحالات الشديدة.
          - **Usually reversible**.
      - kind: aside
        tone: tip
        page: 74
        quote: "Can attend to MMSE or clock draw, but cannot perform well"
        text: "أسرع فرق على السرير: اديله **clock draw**. الـ delirious **cannot attend** أصلًا (سرحان، مش مركز). الـ dementia **can attend but cannot perform well** (مركز معاك بس الساعة طالعة غلط). والـ **Lewy bodies** هي الـ dementia الوحيدة اللي بتـ fluctuate."
      - kind: explain
        page: 75
        quote: "Should be used in all delirious Patients and usually are successful for symptom management"
        title: "العلاج: من غير دوا الأول"
        text: |
          ==Non-pharmacologic== لكل delirious patient، وغالبًا بينجح:
          - **Cognitive impairment**: reality orientation، therapeutic activities.
          - **Sleep**: noise reduction، ونظّم أدوية وإجراءات الليل.
          - **Immobilisation**: early mobilisation، وشيل الـ **bladder catheter**.
          - **Psychoactive drugs**: قلّل الـ as-needed.
          - **Vision/hearing**: النضارة والسماعة.
          - **Dehydration**: volume repletion بدري.

          والدوا بس لو الأعراض هتوقف علاج ضروري.
      - kind: explain
        page: 76
        quote: "The recommended starting dose 0.5 to 1 mg of haloperidol orally or parenterally, repeated every 30 min."
        title: "الـ haloperidol"
        text: |
          **Lowest dose, shortest time**. الـ ==haloperidol== هو drug of choice (أقل side effects).
          - ابدأ **0.5-1 mg** oral أو parenteral.
          - كرّر كل **30 min** بعد ما تراجع الـ vital signs، لحد sedation.
          - Total loading **3-5 mg** بالكتير.
          - الهدف: **awake but manageable**.
          - Maintenance: **نص الـ loading** مقسوم على 24 ساعة، وبعدين taper.
      - kind: case
        page: 76
        quote: "A total loading dose of no more than 3 to 5mg of haloperidol."
        stem: "An 84-year-old delirious man keeps pulling out his IV line; he needs IV antibiotics for pneumonia. Non-drug measures are in place."
        steps:
          - question: "First dose?"
            options: ["Haloperidol 0.5-1 mg", "Haloperidol 5 mg IV", "Lorazepam 1 mg", "Restraints"]
            answer: 0
            why: "ابدأ **0.5-1 mg**. الـ benzodiazepines والـ restraints نفسهم بيعملوا delirium."
          - reveal: "Rechecked after 30 min: still agitated. Two more doses; total 3 mg; now awake but calm."
            question: "Maintenance over the next 24 h?"
            options: ["1.5 mg in divided doses", "3 mg every 30 min", "6 mg daily", "Stop all drugs"]
            answer: 0
            why: "**نص الـ loading dose** (3 ÷ 2 = 1.5 mg) مقسوم على 24 ساعة، وبعدين taper مع ما الـ agitation يخف."
      - kind: try
        items: [geri.L04.067, geri.L04.068, geri.L04.076, geri.L04.084]
    recap:
      - "DSM-5: consciousness، cognition، short period وfluctuates، سبب واضح، مش coma."
      - "CAM: 1 (acute + fluctuating) و2 (inattention) لازم، + 3 أو 4."
      - "CT: focal، TIA، stroke قديمة. LP: CNS infection أو مصدر مجهول."
      - "Delirium: attention؛ dementia: short-term memory؛ depression: consciousness clear."
      - "Non-drug للكل؛ haloperidol 0.5-1 mg كل 30 min، loading 3-5 mg، maintenance نصّه."
    practice: [geri.L04.064, geri.L04.065, geri.L04.066, geri.L04.067, geri.L04.068, geri.L04.069, geri.L04.070, geri.L04.071, geri.L04.072, geri.L04.073, geri.L04.074, geri.L04.075, geri.L04.076, geri.L04.077, geri.L04.078, geri.L04.079, geri.L04.080, geri.L04.081, geri.L04.082, geri.L04.083, geri.L04.084, geri.L04.085, geri.L04.086, geri.L04.123, geri.L04.124, geri.L04.125, geri.L04.126, geri.L04.131, geri.L04.136]
