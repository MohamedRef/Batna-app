      - kind: explain
        page: 83
        quote: "Actions of the IRB\n  Approve, disapprove, or request modifications to research proposals\n  Conduct continuing reviews of on-going research projects\n  Observe, monitor, and audit on-going research projects, if necessary\n  Suspend or terminate previously approved, on-going research projects"
        title: "اللجنة تقدر تعمل إيه؟"
        text: |
          الـ **actions of the IRB**:

          - ==Approve أو disapprove أو request modifications==.
          - Continuing reviews للأبحاث الشغالة.
          - Observe و monitor و audit لو لازم.
          - ==Suspend أو terminate== بحث كان متوافق عليه.

          ليه آخر واحدة مهمة؟ لأن الموافقة مش شيك على بياض: لو حصل ضرر في النص، اللجنة توقف البحث. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 84
        quote: "CONCLUSIONS\n  All ethical codes and principals advocate three fundamental principals;\n    Respect for persons\n    Beneficence\n    Justice\n  Research is a privilege, not a right\n  The well-being of participant is a priority"
        title: "الخلاصة"
        text: |
          - كل الـ ethical codes بتنادي بـ ٣ مبادئ: ==respect for persons== و ==beneficence== و ==justice==.
          - Research is a privilege, not a right.
          - The well-being of participant is a priority.

          ليه «privilege»؟ لأن المجتمع بيسمحلك تبحث على ناس بشرط إنك تحترم القواعد، ولو كسرتها الإذن ده بيتسحب. التفسير المقبول (مش في الكتاب).
      - kind: try
        items: [res.L09.072, res.L09.074, res.L09.075]
    recap:
      - "الموافقة لحد سنة، وبعدها continuing review."
      - "Non-human subject research: الـ chair يحدد، من غير full board ولا consent."
      - "IRB: approve/disapprove/modify، review، monitor، suspend/terminate."
      - "Research is a privilege, not a right."
    practice: [res.L09.069, res.L09.070, res.L09.071, res.L09.072, res.L09.073, res.L09.074, res.L09.075, res.L09.076, res.L09.114]
  # ------------------------------------------------------------------
  - id: res.L09.lesson5
    title: "الـ plagiarism: خطف الأفكار"
    hook: "الكلمة أصلها لاتيني ومعناها «خطف إنسان». الـ copy-paste في البحث اسمه خطف."
    minutes: 7
    pages: [88, 97]
    topics: [plagiarism, forms]
    goals:
      - "تعرّف الـ plagiarism وتفرّقه عن الـ fabrication والـ falsification"
      - "تعرف حجم المشكلة وأسبابها"
    status: unverified
    steps:
      - kind: check
        page: 88
        quote: "Pre-assessment\n1. You have committed plagiarism if you:\n  a) Make use of the works of others to gather information.\n  b) Use the work of another and misrepresent it as your own.\n  c) Make use of the works of others to support your own arguments.\n  d) Examine the ideas and arguments of others to help you shape your own thoughts or views on a particular issue.\n2. You have a brilliant idea for a critical interpretation of an article you are writing about. But when reading another source, you see that the same idea is mentioned. It is your own idea too, so do you need to reference it?\n  Yes. Great minds think alike, but even if you did think of the idea on your own you still need to reference the published source. Otherwise, readers will accuse you of plagiarism. You can use this source to support your argument, and you can try to show how your idea differs from the other author's, but you still have to cite the other source.\n  No. If you come up with an idea on your own, you don't have to cite the other source."
        question: "Pre-assessment: you have committed plagiarism if you:"
        options: ["Use the work of another and misrepresent it as your own", "Use others' work to gather information", "Use others' work to support your arguments", "Examine others' ideas to shape your own views"]
        answer: 0
        why:
          - "صح: إنك تقدّم شغل غيرك كأنه بتاعك."
          - "جمع المعلومات من شغل غيرك ده البحث نفسه."
          - "تدعم رأيك بشغل غيرك عادي، بشرط تعمل citation."
          - "إنك تتعلم من أفكار غيرك مش plagiarism."
      - kind: explain
        page: 90
        quote: "Definition of Plagiarism\nPlagiarism: the act of presenting another's work or ideas as your own."
        title: "التعريف البسيط"
        text: |
          ==Plagiarism==: «the act of presenting another's work or ideas ==as your own==».

          يعني تقدّم شغل حد تاني أو أفكاره كأنها بتاعتك.

          ليه «ideas» مهمة في التعريف؟ لأن الـ plagiarism مش نسخ كلام بس: لو أخدت فكرة حد وكتبتها بكلامك من غير ما تقول إنها بتاعته، برضه plagiarism.
      - kind: explain
        page: 92
        quote: "Introduction\n  The term plagiarism stems from the Latin word plagium, meaning kidnapping a man. It literary means theft, taking material authored by others and presenting as someone else'"
        title: "الكلمة أصلها خطف"
        text: |
          **Plagiarism** جاية من الكلمة اللاتيني ==«plagium»== ومعناها ==kidnapping a man== (خطف إنسان).

          ومعناها الحرفي ==theft==: تاخد حاجة كتبها غيرك وتقدمها كأنها بتاعة حد تاني.

          ليه الأصل ده مفيد؟ لأنه بيوضح إن الفكرة أو النص ليه صاحب، وأخده من غير اسمه سرقة مش «استلهام». التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 93
        quote: "Definition of plagiarism\n\"... the use of others' published and unpublished ideas or words (or other intellectual property) without attribution or permission, and presenting them as new and original rather than derived from an existing source.\"\nThe World Association of Medical Editors (WAME)"
        title: "التعريف"
        text: |
          ببساطة: ==تقدّم شغل أو أفكار غيرك كأنها بتاعتك== (slide 90).

          والكلمة من اللاتيني **plagium** = خطف إنسان، يعني **سرقة** (slide 92).

          وتعريف الـ **World Association of Medical Editors (WAME)**: استخدام أفكار أو كلام غيرك، **منشور أو مش منشور**، **من غير attribution أو permission**، وتقديمه كأنه **جديد وأصلي**.
      - kind: table
        page: 94
        quote: "Other forms of scientific misconduct\n  Fabrication: is the intentional act of making up data or results and recording or reporting them.\n  Falsification: is manipulating research materials, equipment, or processes, or changing or omitting/suppressing data or results without scientific or statistical justification, such that the research is not accurately represented in the research record"
        title: "أشكال تانية من الـ scientific misconduct"
        columns: ["", "يعني إيه"]
        rows:
          - ["Fabrication", "تألّف data أو نتايج وتسجّلها أو تنشرها"]
          - ["Falsification", "تلعب في المواد أو الأجهزة أو الخطوات، أو تغيّر أو تحذف data من غير مبرر علمي أو إحصائي"]
        hide: [[0, 1], [1, 1]]
      - kind: aside
        tone: tip
        page: 94
        quote: "Other forms of scientific misconduct\n  Fabrication: is the intentional act of making up data or results and recording or reporting them.\n  Falsification: is manipulating research materials, equipment, or processes, or changing or omitting/suppressing data or results without scientific or statistical justification, such that the research is not accurately represented in the research record"
        text: |
          فرّق بسرعة: **Fabrication** = الرقم **مش موجود أصلًا** (اخترعته). **Falsification** = الرقم **موجود** بس إنت **غيرته أو شيلته**.
      - kind: explain
        page: 95
        quote: "The size of the problem\nMore than 7.1 million researchers in the world to have their research published in over 25,000 journals.\nResearchers are under pressure to get their work published in good journals.\nWhen this pressure is coupled with a lack of time, lack of research skills and ease of obtaining information and articles from the internet, the rate of plagiarism increases."
        title: "ليه الـ plagiarism بيزيد؟"
        text: |
          - أكتر من ==7.1 million== باحث بينشروا في أكتر من ==25,000 journal==.
          - الباحثين تحت ==pressure== ينشروا في journals كويسة.
          - ولما الضغط ده يتجمع مع:
            - lack of time
            - lack of research skills
            - سهولة الوصول للـ articles على الإنترنت

          نسبة الـ plagiarism بتزيد.

          ليه التلاتة مع بعض؟ الضغط بيدفع، وقلة الوقت والمهارة بتخلي النسخ أسهل طريق، والإنترنت بيخليه متاح بضغطة. التفسير المقبول (مش في الكتاب).
      - kind: aside
        tone: exam
        page: 96
        quote: "RISE IN RETRACTIONS FOR MISCONDUCT\nNumber of retracted articles for specific causes by year of retraction: Fraud/Suspected Fraud; Error; Plagiarism; Duplicate Publication.\n(Fang, Steen and Casadevall, \"Misconduct Accounts for the Majority of Retracted Scientific Publications,\" PNAS 109.42, 16 October 2012: 17028-33)"
        text: |
          في فيديو المحاضرة ظهرت ٤ سلايدز **مش موجودين في ملف الـ slides**، فخدهم من هنا:

          - **Causes of plagiarism**: misbelief، و writing under stress، و immature writing skills، و intentional، و قاعدة ==publish or perish==.
          - الـ **Committee on Publication Ethics (COPE)**: أكبر لجنة بتعمل guidelines لأخلاقيات النشر، وعاملة **flowcharts** بتساعد الـ editors يفرّقوا بين الـ minor والـ major plagiarism.
          - لو الـ **major plagiarism** اتكشف بعد النشر، الضرر بيطول سمعة الـ plagiarist، والـ co-authors، والمجلة، والـ reviewers، والـ editors، والمؤسسة.
          - ==Retraction== = سحب المقالة **بعد النشر** لما يتكشف فيها research misconduct. وده بيوضح الشارت (slide 96): الـ misconduct هو سبب أغلب المقالات المسحوبة.

          والدكتورة قالت كمان: قبل النشر الـ editor ممكن يطلب تعديل أو يرفض، وحجم النص المنقول مش المعيار الوحيد؛ سرقة **فكرة أساسية** خطيرة حتى لو نسبة التشابه صغيرة.
      - kind: figure
        page: 96
        title: "شريحة 96: المقالات المسحوبة بتزيد"
        image: { file: res/L09-s96-retractions.webp, book: true }
        alt: "Bar chart titled Rise in retractions for misconduct: number of retracted articles by year of retraction, in five-year groups from 1977-1981 to 2007-2011, with four bars per group: fraud or suspected fraud (red), error (dark blue), plagiarism (yellow) and duplicate publication (light blue). All bars grow over time; in 2007-2011 fraud reaches about 400, error and duplicate publication about 170 to 200, and plagiarism about 150. An orange arrow points right across the chart, and a red oval with the word Lowest circles the last group's smaller bars. Source: Fang, Steen and Casadevall, 2012."
        caption: |
          دي الشارت اللي الـ aside فوق بيقول عليه:

          - **المحور الأفقي**: سنة السحب، كل 5 سنين من 1977 لـ 2011.
          - **المحور الرأسي**: عدد المقالات المسحوبة.
          - **4 ألوان**: أحمر **Fraud/Suspected Fraud**، كحلي **Error**، أصفر **Plagiarism**، لبني **Duplicate Publication**.
          - **آخر مجموعة (2007-2011)**: الأحمر طالع لحوالي **400**، والباقيين أقل بكتير.

          اللي تاخده: الأعمدة كلها ==بتكبر مع السنين==، والـ ==fraud هو أكبر سبب== للسحب؛ والـ plagiarism والـ duplicate publication (يعني self-plagiarism) ظهروا وكبروا في آخر 15 سنة.
      - kind: explain
        page: 97
        quote: "The size of the problem\n  Twenty-three percent (23%) of submitted articles are rejected because of plagiarism.\n  The prevalence of plagiarism varies from one community to another with reported rates from 11 to 19% in medical institutions"
        title: "حجم المشكلة"
        text: |
          أكتر من **7.1 مليون باحث** بينشروا في أكتر من **25,000 مجلة**، وتحت ضغط النشر (slide 95). الضغط ده + **قلة الوقت** + **قلة المهارة** + **سهولة الوصول للمقالات على الإنترنت** = plagiarism أكتر.

          - ==23%== من المقالات المقدَّمة بتترفض بسبب الـ plagiarism.
          - الـ prevalence في المؤسسات الطبية من **11 لـ 19%**.
      - kind: try
        items: [res.L09.077, res.L09.078, res.L09.082]
    recap:
      - "Plagiarism = تقدّم شغل أو أفكار غيرك كأنها بتاعتك (WAME: منشور أو مش منشور، من غير attribution)."
      - "أصلها plagium = خطف إنسان."
      - "Fabrication = تخترع data. Falsification = تغيّر أو تحذف data."
      - "ضغط النشر + قلة الوقت والمهارة + سهولة الإنترنت = plagiarism أكتر."
    practice: [res.L09.077, res.L09.078, res.L09.079, res.L09.080, res.L09.081, res.L09.082, res.L09.083, res.L09.084, res.L09.085, res.L09.086, res.L09.120, res.L09.122]
  # ------------------------------------------------------------------
  - id: res.L09.lesson11
    title: "أشكال الـ plagiarism: الفكرة والنص ونفسك"
    hook: "سمعت فكرة في مؤتمر وعملت عليها بحث؟ نشرت نفس النتايج مرتين؟ الاتنين plagiarism."
    minutes: 8
    pages: [99, 109]
    topics: [forms]
    goals:
      - "تفرّق بين الـ accidental والـ deliberate"
      - "تفرّق بين الـ ٥ أشكال"
      - "تفرّق بين الـ minor والـ major"
    status: unverified
    steps:
      - kind: explain
        page: 99
        quote: "Accidental (unintentional) plagiarism\n  usually seen among students and junior researchers.\n  caused by a lack of awareness of the limits of taking data and pieces of writing from other sources.\n  a lack of skills for appropriately acknowledging data sources and citing others' work"
        title: "Accidental plagiarism"
        text: |
          الـ **accidental (unintentional) plagiarism**:

          - غالبًا عند ==الطلبة والـ junior researchers==.
          - سببه ==قلة الوعي== بحدود أخد الـ data والكلام من مصادر تانية.
          - و==قلة المهارة== في الـ acknowledging والـ citing.

          ليه بنفرّقه عن الـ deliberate؟ لأن العلاج هنا تعليم الـ citing، مش عقاب على نية خداع. بس النتيجة على الورق واحدة: لسه plagiarism. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 100
        quote: "Deliberate (intentional) plagiarism\n  intentionally copying others' work and presenting it as if it is one's own.\n  Copying large pieces of an article with the deliberate intent of deceiving the reader into thinking they are original is deliberate plagiarism."
        title: "حسب النية"
        text: |
          - **Accidental (unintentional)**: غالبًا **طلبة وباحثين صغيرين**، من **قلة الوعي** بحدود النقل، و**قلة المهارة** في الـ citation (slide 99).
          - **Deliberate (intentional)**: نسخ مقصود، زي إنك تنسخ أجزاء كبيرة من مقالة بنية إن القارئ يفتكرها أصلية.

          وحسب **درجة الجُرم** (slide 107): **minor** = أجزاء صغيرة مش متوثقة من قلة الخبرة، و**major** = أجزاء كبيرة من مصدر تاني متقدمة كأنها بتاعتك.
      - kind: figure
        remind: [res.L09.088]
        page: 101
        quote: "Forms of Plagiarism (slides 101-106)\n  1. Plagiarism of ideas\n  2. Plagiarism of text\n  3. Self-plagiarism\n  4. Collusion\n  5. Patch writing (mosaic plagiarism)"
        title: "الـ ٥ أشكال"
        alt: "Five boxes: plagiarism of ideas, plagiarism of text (the most common, copy-cut-paste), self-plagiarism (redundant data), collusion (someone else writes it), and patch writing or mosaic plagiarism (a few words changed)."
        caption: "**Ideas**، **text** (الأشهر)، **self**، **collusion**، و**patch writing**."
        svg: |
          <svg viewBox="0 0 330 210" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="10" width="155" height="54" rx="6" class="fg-box"/>
            <text x="82" y="32" text-anchor="middle" class="t-sm t-b">1. Ideas</text>
            <text x="82" y="50" text-anchor="middle" class="t-sm t-mut">heard it, published it</text>
            <rect x="170" y="10" width="155" height="54" rx="6" class="fg-bad"/>
            <text x="247" y="32" text-anchor="middle" class="t-sm t-b">2. Text (most common)</text>
            <text x="247" y="50" text-anchor="middle" class="t-sm t-mut">copy-cut-paste</text>
            <rect x="5" y="74" width="155" height="54" rx="6" class="fg-box"/>
            <text x="82" y="96" text-anchor="middle" class="t-sm t-b">3. Self-plagiarism</text>
            <text x="82" y="114" text-anchor="middle" class="t-sm t-mut">redundant data</text>
            <rect x="170" y="74" width="155" height="54" rx="6" class="fg-box"/>
            <text x="247" y="96" text-anchor="middle" class="t-sm t-b">4. Collusion</text>
            <text x="247" y="114" text-anchor="middle" class="t-sm t-mut">someone else wrote it</text>
            <rect x="80" y="138" width="170" height="64" rx="6" class="fg-acc"/>
            <text x="165" y="160" text-anchor="middle" class="t-sm t-b">5. Patch writing</text>
            <text x="165" y="176" text-anchor="middle" class="t-sm">(mosaic plagiarism)</text>
            <text x="165" y="193" text-anchor="middle" class="t-sm t-mut">a few words swapped</text>
          </svg>
      - kind: explain
        page: 102
        quote: "1. Plagiarism of ideas\n  An example, when a researcher attended a presentation where he/she heard an interesting new research idea from the presenter. He/she then conducts research based on this idea and writes or presents the results as if it is entirely his/her own.\n  Another example is when someone submits an article to a journal and his/her article is rejected for some reason, and one of the reviewers may choose the idea of the rejected article and write an article on the subject as if it was his own idea"
        title: "Plagiarism of ideas: مثالين"
        text: |
          1. باحث ==حضر presentation== وسمع فكرة جديدة، راح عمل بحث عليها وقدّمه كأنه ==فكرته هو==.
          2. حد بعت article لـ journal واترفض، ==وواحد من الـ reviewers== أخد الفكرة وكتب عليها كأنها بتاعته.

          ليه المثال التاني أسوأ؟ لأن الـ reviewer اتأمن على الفكرة علشان يقيّمها، فاستغل الثقة دي. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 103
        quote: "2. Plagiarism of text\nis the most common form of plagiarism in medical research writing. This form is also known as \"copy-cut-paste\" or \"word-to-word\" writing.\nwhat is allowed to be taken from other's research work?\nScientific findings are allowed to be taken from others' articles, but not their language or the exact paragraph that they wrote.\nIn a new article, the previous findings from others should be presented in the writer's own language"
        title: "تاخد إيه من بحث غيرك؟"
        text: |
          الـ **plagiarism of text** هو ==الأشهر== في الكتابة الطبية: «copy-cut-paste» أو «word-to-word».

          المسموح: تاخد **الـ scientific findings** بتاعتهم. الممنوع: تاخد **كلامهم** أو **الفقرة بنصها**. النتايج تتكتب **بلغتك إنت**.
      - kind: explain
        page: 104
        quote: "3. Self-plagiarism\nIt occurs when a researcher uses substantial parts of his research in two different publications that use the same findings or illustrations without referring to both publications. This form of plagiarism is also known as \"redundant data\"."
        title: "Self-plagiarism = redundant data"
        text: |
          لما الباحث يستخدم ==أجزاء كبيرة من بحثه== في ==publication تانية== بنفس النتايج أو الصور، ==من غير ما يشير للاتنين==.

          اسمه كمان «redundant data».

          ليه غلط وهو شغله؟ لأن القارئ هيفتكر إنهم دراستين، فالنتيجة هتتحسب مرتين في أي review. التفسير المقبول (مش في الكتاب).
      - kind: check
        page: 104
        quote: "3. Self-plagiarism\nIt occurs when a researcher uses substantial parts of his research in two different publications that use the same findings or illustrations without referring to both publications. This form of plagiarism is also known as \"redundant data\"."
        question: "A researcher publishes the same findings and figures in two journals without referring to the first paper. What is this called?"
        options:
          - "Self-plagiarism (redundant data)"
          - "Collusion"
          - "Fabrication"
          - "Accidental plagiarism"
        answer: 0
        why:
          - "صح: نفس النتايج في publication تانية من غير إشارة للأولى = self-plagiarism."
          - "الـ collusion إنك تخلي حد تاني يكتبلك."
          - "الـ fabrication إنك تخترع data."
          - "الـ accidental تقسيم حسب النية، مش شكل من الأشكال."
      - kind: explain
        page: 105
        quote: "4. Collusion\nis allowing someone else, such as professionals or agencies, with or without paying money, to write a piece of work and then the plagiarist presents it as if it's his/her own.\nThis is a form of illegal unauthorized cooperation with the intent to deceive"
        title: "Collusion"
        text: |
          إنك ==تسيب حد تاني== (professionals أو agencies، بفلوس أو من غير) ==يكتبلك الشغل==، وبعدين تقدمه كأنه بتاعك.

          ده ==illegal unauthorized cooperation with the intent to deceive==.

          ليه «intent to deceive»؟ لأنك عارف إن مش إنت اللي كتبت، فده مش غلطة ده خداع مقصود. التفسير المقبول (مش في الكتاب).
      - kind: match
        page: 106
        quote: "5. Patch writing (mosaic plagiarism)\n  is copying parts of another work and changing a few words or the order of words to make it appear as if it is original.\n  This should not be mixed with paraphrasing, which is taking a fact from a source then writing it in one's own language and style.\n  Paraphrasing is appropriate, while patch writing is not"
        prompt: "وصّل الموقف بالشكل:"
        pairs:
          - ["A reviewer steals the idea of a rejected paper", "Plagiarism of ideas"]
          - ["Same findings in two journals, no cross-reference", "Self-plagiarism"]
          - ["An agency writes your thesis for money", "Collusion"]
          - ["Copied text with a few words swapped", "Patch writing"]
        why: "Ideas = الفكرة نفسها (slide 102). Self = redundant data (slide 104). Collusion = حد تاني كتبه (slide 105). Patch writing = تغيير كام كلمة أو ترتيبها (slide 106)."
      - kind: aside
        tone: trap
        page: 106
        quote: "5. Patch writing (mosaic plagiarism)\n  is copying parts of another work and changing a few words or the order of words to make it appear as if it is original.\n  This should not be mixed with paraphrasing, which is taking a fact from a source then writing it in one's own language and style.\n  Paraphrasing is appropriate, while patch writing is not"
        text: |
          **Patch writing ≠ paraphrasing.** الـ paraphrasing إنك تاخد **الحقيقة** وتكتبها **بأسلوبك ولغتك** (مسموح). الـ patch writing إنك تاخد **نفس الجملة** وتغيّر كلمتين (ممنوع).
      - kind: explain
        page: 107
        quote: "according to the degree of the offence\n| Minor | MAJOR |\n|---|---|\n| insignificant parts of the text are not properly cited d.t academic immaturity | use of large portions from another source and presenting it as if they are one's own |"
        title: "Minor ولا major؟"
        text: |
          حسب ==degree of the offence==:

          | Minor | Major |
          |---|---|
          | أجزاء ==مش مهمة== من النص مش متوثقة صح، بسبب ==academic immaturity== | أجزاء كبيرة من مصدر تاني متقدمة كأنها بتاعتك |

          ليه التقسيم؟ لأن العقاب بيختلف: الـ minor بيتعالج بتصحيح، والـ major ممكن يوصل لسحب البحث. التفسير المقبول (مش في الكتاب).
      - kind: figure
        page: 109
        title: "شريحة 109: Did I plagiarize؟"
        image: { file: res/L09-s109-did-i-plagiarize.webp, book: true }
        alt: "Flowchart titled Did I Plagiarize? Seven red boxes in a column, each with a Yes exit to the right and a No exit to the left: Are you confident that your ideas are your own or so obviously common knowledge that you did not need to cite any sources? Did you give credit to all original authors for any text you directly quoted? For any ideas you summarized or paraphrased, even if you completely changed the wording? To all original artists for any images or graphics? Are you confident you did not distort or misinterpret an author's or artist's original meaning? That the organization and style of your work is your own and you did not mimic someone else? Did you use a proper and recognized citation method so a reader could locate the original work? A box on the right says No! if you are confident that what you have written is entirely original, or you cited the original author, you have not plagiarized."
        caption: |
          ده الـ flowchart اللي المحاضرة بتعرضه (slides 108-113)، مقرّب على عمود الأسئلة:

          - **7 أسئلة** فوق بعض: الفكرة بتاعتك أو common knowledge؟ ذكرت مصدر كل **quote**؟ وكل **paraphrase** حتى لو غيّرت الكلام كله؟ وكل صورة أو graphic؟ مابوّظتش المعنى الأصلي؟ الـ **organization والـ style** بتوعك؟ والـ **citation method** يخلّي القارئ يلاقي الأصل؟
          - **يمين (Yes)**: لو جاوبت أيوه على الكل → مربع **No!**: مفيش plagiarism.
          - **شمال (No)**: أي «لأ» بتوديك للنص التاني من الرسمة: **How Serious Is It?**

          اللي تاخده: ==«لأ» واحدة كفاية== تبقى plagiarism؛ والـ paraphrase من غير citation لسه plagiarism.
      - kind: try
        items: [res.L09.087, res.L09.092, res.L09.093]
    recap:
      - "Accidental (طلبة، قلة وعي) ضد deliberate (نية خداع)."
      - "٥ أشكال: ideas، text (الأشهر)، self (redundant data)، collusion، patch writing."
      - "Minor = أجزاء صغيرة من immaturity. Major = أجزاء كبيرة كأنها بتاعتك."
    practice: [res.L09.087, res.L09.088, res.L09.089, res.L09.090, res.L09.091, res.L09.092, res.L09.093, res.L09.094, res.L09.095, res.L09.096, res.L09.097, res.L09.121]
