  - id: git.L04.lesson1
    title: "سرطان المريء: نوعين ومكانين"
    hook: "أكتر من 99% من أورام المريء خبيثة. نوع فوق بسبب السجاير والشاي السخن، ونوع تحت بسبب الـ reflux. والدنيا اتقلبت في 50 سنة."
    minutes: 8
    pages: [143, 144]
    topics: [eso-epi, eso-risk]
    goals:
      - "تعرف أرقام الـ esophageal cancer وليه بييجي متأخر"
      - "تفرّق بين الـ SCC والـ adenocarcinoma في المكان والخلية"
      - "تعرف قاعدة الـ 5 cm للـ EGJ وتفهم خطر الـ Barrett صح"
    status: unverified
    steps:
      - kind: explain
        page: 143
        quote: "Most (> 99%) esophageal tumors are MALIGNANT, fewer than 1% are benign."
        title: "المريء مش بيهزّر"
        text: |
          أول معلومة في المحاضرة وأهمها: أكتر من ==99%== من الـ **esophageal tumors** هي **malignant**، وأقل من 1% بس benign.

          يعني لو مريض جالك بـ dysphagia وفي ورم في المريء، افترض إنه سرطان لحد ما تثبت العكس.

          والـ malignant tumors دي تقريبًا كلها **carcinomas**، لأن الـ sarcomas نادرة جدًا.
      - kind: explain
        page: 143
        quote: "Benign tumors: Squamous cell papilloma, Adenoma, leiomyoma, lipoma, fibroma, neurofibroma, rhabdomyoma, lymphangioma & hemangioma."
        title: "الـ benign نادر، والـ sarcoma أندر"
        text: |
          الكتاب:
          - الـ **benign** (أقل من 1%): squamous cell papilloma، adenoma، ==leiomyoma==، lipoma، fibroma، neurofibroma، rhabdomyoma، lymphangioma، hemangioma.
          - الـ **malignant** هي **carcinomas**، لأن الـ **sarcomas extremely rare**.
          - والنوعين الأساسيين متسميين على **نوع الخلية** اللي بقت malignant: **squamous** و **glandular**.

          التفسير المقبول (مش في الكتاب) علشان تفتكر القايمة: الأورام الحميدة كل واحدة على اسم نسيج في جدار المريء: الـ papilloma من الـ squamous، والـ adenoma من الغدد، والـ leiomyoma من العضلة، والـ lipoma من الدهون، والـ fibroma من الـ fibrous tissue، والـ neurofibroma من الأعصاب، والـ hemangioma والـ lymphangioma من الأوعية. يعني لو فاكر طبقات الحيطة، القايمة بتتكتب لوحدها.
      - kind: explain
        page: 143
        quote: "In the US where there is no routine screening for esophagus cancer, most patients present with advanced stages"
        title: "ليه بيوصلنا متأخر؟"
        text: |
          الـ **esophageal cancer** هو السابع في الانتشار والسادس في الوفيات في العالم.

          ومفيش **routine screening** له، فأغلب المرضى بييجوا في **advanced stages**:

          - حوالي 50% بييجوا والمرض عدّى الـ locoregional.
          - أقل من 60% من الـ locoregional ينفع يتعملهم curative resection.
          - و70-80% من العينات بعد العملية فيها spread للـ lymph nodes.

          يعني لما مريض كبير يقولك «الأكل بيقف» حتى لو بقاله شهر بس، اعتبره متأخر أصلًا واطلب المنظار بسرعة.
      - kind: reveal
        page: 143
        quote: "70-80%of resected specimens show spread to the lymph nodes"
        prompt: "ليه حتى اللي بيتعمله resection، أغلبه طالع منتشر للـ nodes؟"
        answer: |
          الكتاب: حوالي **50%** advanced برّه الـ locoregional، وأقل من **60%** من الـ locoregional ينفع يتعمله curative resection، و ==70-80%== من الـ resected specimens فيها **spread to the lymph nodes**.

          التفسير المقبول (مش في الكتاب): المريء أنبوبة **مطاطة**، فالورم بيكبر من غير ما يعمل أعراض لحد ما يقفل نص الـ lumen تقريبًا، وده بيحصل متأخر. وكمان المريء **مفيهوش serosa** (غلاف) وغني بالـ **lymphatics** في الـ submucosa، فالورم بيوصل للـ nodes بدري. يعني لما المريض يحس بالـ dysphagia، الورم غالبًا بقاله فترة وانتشر.
      - kind: check
        page: 143
        quote: "Most (> 99%) esophageal tumors are MALIGNANT, fewer than 1% are benign."
        question: "Which statement about esophageal tumors is FALSE?"
        options:
          - "Most esophageal tumors are benign"
          - "Most malignant ones are carcinomas"
          - "Sarcomas of the esophagus are extremely rare"
          - "Leiomyoma is one of the benign tumors"
        answer: 0
        why:
          - "صح إنها غلط: أكتر من 99% malignant. ده بالظبط سؤال الكتاب في آخر المحاضرة."
          - "دي صح: الـ malignant tumors هي carcinomas."
          - "دي صح: عشان كده الـ malignant بتبقى carcinomas."
          - "دي صح: leiomyoma من ضمن الـ benign list."
      - kind: figure
        page: 144
        quote: "Adenocarcinomas usually form in the lower part of the esophagus, near the stomach."
        title: "مين فوق ومين تحت"
        alt: "A vertical esophagus drawn from the throat to the stomach. The upper and middle thirds are labelled squamous cell carcinoma, risk tobacco and alcohol. The lower third near the stomach is labelled adenocarcinoma, risk GERD, Barrett and obesity. Below the junction a box says EGJ and proximal 5 cm of stomach extending into the EGJ are staged as esophageal (Siewert III)."
        caption: "الـ squamous cell carcinoma (SCC) في الـ upper و middle third، والـ adenocarcinoma في الـ lower third جنب المعدة. والـ esophagogastric junction (EGJ) tumors بتتعمل staging كأنها esophageal."
        svg: |
          <svg viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
            <rect x="60" y="20" width="50" height="300" rx="20" class="fg-box"/>
            <rect x="60" y="20" width="50" height="200" rx="20" class="fg-acc"/>
            <rect x="60" y="220" width="50" height="100" rx="12" class="fg-good"/>
            <ellipse cx="110" cy="350" rx="70" ry="35" class="fg-thin"/>
            <text x="90" y="375" class="t-sm t-mut">Stomach</text>
            <path d="M118 120h22" class="fg-ink"/>
            <text x="145" y="100" class="t-b t-acc">Squamous cell carcinoma</text>
            <text x="145" y="118" class="t-sm">Upper + middle thirds</text>
            <text x="145" y="136" class="t-sm">Squamous lining cells</text>
            <text x="145" y="154" class="t-sm">Tobacco + alcohol</text>
            <text x="145" y="172" class="t-sm t-mut">Now under 30% in the US</text>
            <path d="M118 270h22" class="fg-ink"/>
            <text x="145" y="240" class="t-b t-good">Adenocarcinoma</text>
            <text x="145" y="258" class="t-sm">Lower third, near stomach</text>
            <text x="145" y="276" class="t-sm">Glandular (mucus) cells</text>
            <text x="145" y="294" class="t-sm">GERD, Barrett, obesity</text>
            <text x="145" y="312" class="t-sm t-mut">Now over 60% in the US</text>
            <path d="M40 320h130" class="fg-arrow"/>
            <text x="190" y="335" class="t-sm t-b">EGJ + proximal 5 cm</text>
            <text x="190" y="351" class="t-sm">into EGJ = esophageal</text>
            <text x="190" y="367" class="t-sm t-mut">(Siewert III)</text>
            <text x="10" y="120" class="t-sm t-mut">Upper</text>
            <text x="10" y="200" class="t-sm t-mut">Middle</text>
            <text x="10" y="275" class="t-sm t-mut">Lower</text>
          </svg>
      - kind: explain
        page: 144
        quote: "In the 1960's squamous cancer accounted for more than 90% of cases but over the last two decades adenocarcinoma has dramatically increased and is now over 60% in the US"
        title: "الدنيا اتقلبت"
        text: |
          في الستينات الـ **squamous cancer** كان أكتر من 90% من الحالات. دلوقتي الـ ==adenocarcinoma== بقى أكتر من 60% في أمريكا، والـ squamous أقل من 30%.

          ليه؟ الكتاب بيدّيك عوامل الخطر: **obesity**, high body mass index (BMI), و**gastroesophageal reflux disease (GERD)**. وده بالظبط اللي زاد في العالم.
      - kind: explain
        page: 144
        quote: "Tumors at the esophagogastric junction and proximal 5 cm of the stomach that extend into the EGJ or esophagus are classified and staged as esophageal cancers (the so-called Siewert III EGJ tumors)."
        title: "ورم على الحدود: مريء ولا معدة؟"
        text: |
          الكتاب:
          - الأورام في الـ **EGJ** وفي أول **5 cm** من المعدة اللي **بتمتد** للـ EGJ أو المريء ← بتتصنّف وتتعمل staging كـ ==esophageal cancer== (اللي اسمها **Siewert III**).
          - أي ورم مركزه في المعدة **أبعد من 5 cm** من الـ EGJ، أو جوه الـ 5 cm بس **ما امتدّش** للمريء ← ==gastric cancer==.

          التفسير المقبول (مش في الكتاب): ليه الفرق ده مهم؟ لأن الـ staging (والعلاج بعده) مختلف بين المريء والمعدة: الـ N stage بيتعدّ بشكل مختلف، ونوع الجراحة مختلف. فالقاعدة بتحسم الورم اللي على الحدود يتعامل معاه بأنهي نظام. يعني السؤال: **وصل للمريء ولا لأ؟** لو وصل، مريء.
      - kind: explain
        page: 144
        quote: "Obesity and a high Body Mass Index (BMI) are high risk factors"
        title: "كل نوع وأسبابه الكبيرة"
        text: |
          الكتاب:
          - **Squamous**: بقى أقل من **30%** في أمريكا، وأكبر عاملين ==tobacco و alcohol==.
          - **Adenocarcinoma**: بقى الأشهر، خصوصًا في **white men**، وعوامله **obesity** و **high BMI**، و **GERD**، و **Barrett's** اللي بيعلّي الخطر **30–60 مرة**.

          التفسير المقبول (مش في الكتاب) للربط: السجاير والكحول بيلمسوا **الـ squamous lining** مباشرة وهم نازلين، فبيأذوا الجزء العلوي والأوسط. أما السمنة فبتزوّد ضغط البطن، فالـ **reflux** يزيد، والحمض يأذي **الجزء السفلي**، فيتحوّل لـ Barrett، وبعدين adenocarcinoma. يعني السبب بيحدد **المكان** والمكان بيحدد **النوع**.
      - kind: explain
        page: 144
        quote: "Estimates of the annual cancer incidence in patients with Barrett's esophagus have ranged from 0.1 to 2.0 percent."
        title: "Barrett: الرقم اللي بيخوّف والرقم اللي بيطمّن"
        text: |
          الـ **Barrett's esophagus** بيرفع الخطر ==30 - 60 مرة==.

          بس الـ annual incidence نفسها **0.1 to 2.0 percent** في السنة. يعني الـ relative risk عالي جدًا، لكن الـ **absolute risk** واطي.
      - kind: aside
        tone: exam
        page: 144
        quote: "Although the risk of developing esophageal cancer is increased at least 30fold above that of the general population, the absolute risk of developing cancer is low"
        text: "لو السؤال قال Barrett بيعمل cancer في أغلب المرضى: غلط. الـ relative risk عالي، والـ absolute risk of developing cancer is low."
      - kind: try
        items: [git.L04.002, git.L04.005, git.L04.009, git.L04.012, git.L04.015]
    recap:
      - "أكتر من 99% malignant، وهي carcinomas لأن الـ sarcoma نادر جدًا؛ الـ benign على اسم كل طبقة."
      - "السابع في الانتشار والسادس في الوفيات؛ نص المرضى advanced، و 70-80% من الـ resected فيهم nodes."
      - "SCC فوق ونص (tobacco و alcohol)؛ adenocarcinoma تحت (obesity، GERD، Barrett)؛ الـ adenocarcinoma بقى أكتر من 60%."
      - "EGJ وأول 5 cm من المعدة اللي بتمتد للمريء = esophageal (Siewert III)؛ غير كده = gastric."
      - "Barrett: relative risk 30–60، بس الـ annual incidence 0.1–2%."
    practice: [git.L04.001, git.L04.002, git.L04.003, git.L04.004, git.L04.005, git.L04.006, git.L04.007, git.L04.008, git.L04.009, git.L04.010, git.L04.011, git.L04.012, git.L04.013, git.L04.014, git.L04.015, git.L04.025, git.L04.222, git.L04.260]
