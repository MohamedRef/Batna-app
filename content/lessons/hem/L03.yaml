        prompt: "ليه الكلية في الـ sickle بتتأذي في الـ medulla بالذات؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الـ **renal medulla** بيئتها أصلًا **أكسجين قليل** وتركيز ملح عالي (يعني الكرة بتفقد ميه)، وده بالظبط اللي بيعمل sickling. فالكرات بتتمنجل هناك وتسد الأوعية الصغيرة، والـ papilla تموت: ==papillary necrosis==، وتظهر **haematuria مفاجئة**.

          ونفس المنطق في باقي الأعضاء: أي حتة الدم فيها بطيء أو الأكسجين قليل بتتسد: المخ (**ischaemic stroke**)، العضم (**dactylitis**)، الـ corpora cavernosa (**priapism** من انسداد الـ venous return)، والرجلين (**leg ulcers**).
      - kind: case
        page: 33
        quote: "Aplastic crisis appears to be caused by infection by parvovirus that selectively infects erythroblasts."
        stem: "A 7-year-old with HbSS had fever and a red 'slapped' face a week ago. Now he is very pale and tired, with no pain."
