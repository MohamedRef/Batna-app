  - id: geri.L08.054
    kind: card
    topic: oa
    front: How is OA now defined, given new pathophysiology?
    back: A complex multifactorial joint pathology caused by inflammatory and metabolic factors underlying joint damage, with low-grade chronic synovial inflammation central.
    src: { page: 139, quote: "Low-grade, chronic inflammation of the synovial lining has gained a central role in the definition of OA physiopathology, and central immunological mechanisms, innate but also adaptive, are now considered crucial in driving inflammation and tissue destruction. In addition, the role of neuroinflammation and central sensitization mechanisms as underlying causes of pain chronicity has been characterized. This has led to a renewed definition of OA, which is now intended as a complex multifactorial joint pathology caused by inflammatory and metabolic factors underlying joint damage." }
