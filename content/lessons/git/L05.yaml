          - "ده للـ head أقل من 20 mm والـ stalk أقل من 10 mm بس. هنا الراس 25."
          - "الـ cold snare للـ sessile الصغير تحت 10 mm."
          - "التاتو والجراحة للـ suspected deep submucosal invasion، ومفيش هنا علامة invasion."
      - kind: try
