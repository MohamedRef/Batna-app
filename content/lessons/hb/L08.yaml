        quote: "Diagnostic workflow for DILI and R value determination\nDILI is suspected on the basis of increased levels of enzyme → Patient history (6 month) include: drug and supplement intake → R value = (ALT value÷ALT ULN) / (ALP value÷ALP ULN):\n  R value<2 (cholestatic type of liver injury) → Ultrasound (abdominal part) → MRI or MRCP, liver biopsy\n  R value 2-5 (mixed type of liver injury) → Abdominal part ultrasound, Hepatitis A, B, C, E → Additional investigation: other viral causes (CMV, EBV, HSV) autoimmune hepatitis, budd-chiari syndrome, ischemic hepatitis, Wilson disease\n  R value>5 (hepatocellular type of liver injury) → Abdominal part ultrasound, Hepatitis A, B, C, E → Additional investigation: other viral causes (CMV, EBV, HSV) autoimmune hepatitis, budd-chiari syndrome, ischemic hepatitis, Wilson disease"
