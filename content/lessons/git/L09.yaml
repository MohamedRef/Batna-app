  - id: git.L09.lesson2
    title: "الأسباب والأعراض: من الإسهال لحد العضم"
    hook: "عيان ممكن ييجي بإسهال، أو ييجي بأنيميا وكسور ومفيش إسهال خالص. الاتنين malabsorption."
    minutes: 7
    pages: [249, 256]
    topics: [causes, classification, gi, extra, nutrients]
    goals:
      - "تقسّم أسباب الـ malabsorption حسب المرحلة"
      - "تعرف الأعراض المعوية وليه بتحصل"
      - "تربط كل عَرَض برّه الأمعاء بالـ nutrient الناقص"
    status: unverified
    steps:
      - kind: table
        page: 249
        quote: "The causes can be classified according to pathogenesis into"
        title: "الأسباب حسب الـ pathogenesis"
        columns: [Group, Examples]
        rows:
          - ["Impaired digestion", "Pancreatic insufficiency, low bile salts, gastric surgery, gastrinoma"]
          - ["Impaired absorption, inherited", "Glucose-galactose malabsorption, abetalipoproteinemia, cystinuria, Hartnup, sucrase-isomaltase"]
          - ["Impaired absorption, acquired", "Resection, celiac, tropical sprue, Crohn, lymphoma, amyloidosis, infections"]
          - ["Post-absorptive", "Lymphangiectasia, lymphoma"]
          - ["Other", "Cholestyramine, neomycin, colchicine, laxatives; CHF, carcinoid, diabetes, adrenal, thyroid"]
        hide: [[0, 1], [3, 1], [4, 1]]
      - kind: reveal
        page: 249
        quote: "Gastrinoma: due to the inactivation of the pancreatic enzymes by the hyperacidity stimulated by high gastrin level."
        prompt: "الـ gastrinoma ورم بيطلّع gastrin. إيه دخله بالـ steatorrhea؟"
        answer: "الـ **gastrin** العالي بيعمل **hyperacidity**، والحمض بيوصل الـ duodenum ويقفل الـ **pancreatic enzymes** (الـ lipase بيحب pH 8). فالدهون ما تتهضمش. افتكر الكلام ده من الدرس اللي فات."
      - kind: aside
        tone: trap
        page: 250
        quote: "which clinically appears similar to celiac disease and is unresponsive to a gluten-free diet"
        text: |
          عيان شكله **celiac** بالظبط، بس الـ **gluten-free diet** ما عملتش أي حاجة؟ فكّر في ==IgA deficiency== (أشهر immunodeficiency).

          وفي الأطفال: **autoimmune enteropathy** (antibodies ضد الـ enterocytes والـ goblet cells، وساعات islet و parietal cells) بتعمل **secretory diarrhea** و villous atrophy. و **acrodermatitis enteropathica**: عيب وراثي في امتصاص الـ **zinc**.
      - kind: sort
        page: 255
        quote: "Diseases in which impaired intraluminal digestion is dominant"
        prompt: "Table 1: العطل الأساسي فين؟"
        bins: ["Intraluminal digestion", "Mucosal", "Postmucosal transport"]
        cards:
          - { text: "Chronic pancreatitis", bin: 0 }
          - { text: "Postgastrectomy", bin: 0 }
          - { text: "Hepatobiliary disease", bin: 0 }
          - { text: "Celiac disease", bin: 1 }
          - { text: "Whipple disease", bin: 1 }
          - { text: "Abetalipoproteinemia", bin: 1 }
          - { text: "Primary lymphangiectasia", bin: 2 }
          - { text: "Secondary lymphangiectasia", bin: 2 }
        why: "وفيه مجموعة رابعة في Table 1 بتعمل الاتنين (luminal و mucosal): **bacterial overgrowth**، **short bowel syndrome**، و **gastrinoma**."
      - kind: explain
        page: 250
        title: "الأعراض المعوية"
        quote: "Diarrhea, weight loss, flatulence, abdominal bloating, abdominal cramps, and pain may be present."
        text: |
          **إسهال** (diarrhea)، **نزول وزن** (weight loss)، **غازات وانتفاخ** (flatulence، bloating)، و **مغص** (cramps).

          الـ stool mass جاي من: أكل ما اتمصّش، مية وأملاح من الـ mucosa الملتهبة، **fatty acids** البكتيريا بتحولها لـ hydroxy fatty acids، و **bile acids** بتخلي القولون يفرز مية.

          الغازات من **تخمير الكربوهيدرات** (خصوصًا مع الـ disaccharidase deficiency).
      - kind: aside
        tone: trap
        page: 250
        quote: "less than one voluminous putty-like stool, the latter causing some patients to complain of constipation"
        text: |
          مش كل malabsorption إسهال! ممكن **أكتر من 10 مرات مية** في اليوم، أو **أقل من مرة**: براز كبير زي **المعجون** (putty-like)، والعيان يقولك «عندي **إمساك**».
      - kind: table
        page: 251
        quote: "pain is common in patients with chronic pancreatitis or pancreatic cancer and Crohn disease"
        title: "الألم: موجود ولا لأ؟"
        columns: [Pain, Diseases]
        rows:
          - ["Common", "Chronic pancreatitis, pancreatic cancer, Crohn disease"]
          - ["Often absent", "Celiac disease, postgastrectomy malabsorption"]
        hide: [[1, 1]]
      - kind: explain
        page: 251
        title: "برّه الأمعاء"
        quote: "more patients with celiac disease present with anemia and osteopenic bone disease in the absence of significant gastrointestinal symptoms"
        text: |
          عيانين **celiac** كتير بييجوا بـ ==anemia== و **osteopenic bone disease** **من غير** أعراض معوية تُذكر.

          - **Anemia**: microcytic (حديد)، macrocytic (folate أو B12)، أو dimorphic.
          - **نزيف و purpura**: نقص **vitamin K** (hypoprothrombinemia).
          - **العضم**: كالسيوم و vitamin D قليلين، والـ fatty acids بتمسك الكالسيوم في البراز، ولو طوّل: **secondary hyperparathyroidism**.
          - **Amenorrhea، infertility، impotence** من سوء التغذية.
          - **Edema وحتى ascites** من الـ **protein-losing enteropathy**.
      - kind: match
        page: 256
        quote: "Table 2: Clinical findings in intestinal malabsorption"
        prompt: "Table 2: وصّل كل عَرَض بسببه:"
        pairs:
          - ["Night blindness", "Vitamin A deficiency"]
          - ["Tetany", "Calcium, magnesium, vitamin D"]
          - ["Purpura", "Vitamin K deficiency"]
          - ["Glossitis, cheilosis", "Iron, riboflavin, niacin"]
          - ["Peripheral neuropathy", "Vitamin B12, thiamine"]
          - ["Hyperpigmentation", "Secondary hypopituitarism, adrenal insufficiency"]
        why: "كل عَرَض برّه الأمعاء بيشاور على nutrient ناقص. الغريب فيهم الـ **hyperpigmentation**: سببها في الجدول **secondary hypopituitarism و adrenal insufficiency**، مش فيتامين."
      - kind: table
        page: 256
        quote: "Clinical manifestations and laboratory findings in malabsorption of various nutrients"
        title: "Table 3: العَرَض، التحليل، والناقص"
        columns: [Manifestation, Lab, Nutrient]
        rows:
          - ["Steatorrhea", "High fecal fat, low carotene", "Fat, A D E K"]
          - ["Weight loss", "Low D-xylose absorption", "Fat, protein, CHO"]
          - ["Bleeding", "Prolonged PT/INR", "Vitamin K"]
          - ["Edema", "High fecal alpha-1-antitrypsin", "Protein"]
          - ["Milk intolerance", "Abnormal lactose tolerance", "Lactose"]
        hide: [[0, 2], [2, 2], [3, 1], [4, 2]]
      - kind: check
        page: 256
        quote: "Clinical manifestations and laboratory findings in malabsorption of various nutrients"
        question: "Edema in malabsorption with high fecal alpha-1-antitrypsin points to loss of which nutrient?"
        options:
          - "Protein"
          - "Lactose"
          - "Vitamin K"
          - "Iron"
        answer: 0
        why:
          - "صح: protein-losing enteropathy، والـ alpha-1-antitrypsin في البراز دليله."
          - "اللاكتوز = milk intolerance."
          - "Vitamin K = نزيف و INR طويل."
          - "الحديد = microcytic anemia."
      - kind: try
        items: [git.L09.028, git.L09.034, git.L09.041, git.L09.052, git.L09.055]
    recap:
      - "الأسباب: digestion (بنكرياس، bile، جراحة معدة، gastrinoma)، absorption (وراثي أو مكتسب)، postabsorptive (lymphatics)، وأدوية وأمراض عامة."
      - "Gastrinoma: الحمض بيقفل الـ pancreatic enzymes."
      - "شكل celiac ومش بيستجيب للـ GFD: فكّر في IgA deficiency."
      - "الإسهال ممكن يبقى براز معجون مرة في اليوم، والعيان يقول إمساك."
      - "الألم شائع في البنكرياس و Crohn، وغالبًا مش موجود في الـ celiac."
      - "Anemia وعضم من غير أعراض معوية = celiac لحد ما يثبت العكس."
    practice: [git.L09.028, git.L09.029, git.L09.030, git.L09.031, git.L09.032, git.L09.033, git.L09.034, git.L09.035, git.L09.036, git.L09.037, git.L09.038, git.L09.039, git.L09.040, git.L09.041, git.L09.042, git.L09.043, git.L09.044, git.L09.045, git.L09.046, git.L09.047, git.L09.048, git.L09.049, git.L09.050, git.L09.051, git.L09.052, git.L09.053, git.L09.054, git.L09.055, git.L09.056, git.L09.057, git.L09.058, git.L09.078, git.L09.079]
