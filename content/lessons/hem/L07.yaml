      - kind: mnemonic
        page: 104
        quote: "Ionizing radiation is leukemogenic, acute lymphocytic leukemia (ALL), acute melogenous leukemia (AML), and chronic myelogenous leukemia (CML) are all increased in patients given radiation therapy for ankylosina spondilitis and in survivors of the atomic bomb."
        word: "RVGC"
        parts:
          - { key: "R", text: "Radiation: ionizing (ankylosing spondylitis radiotherapy, atomic bomb)" }
          - { key: "V", text: "Viruses: HTLV-1 → adult T-cell leukemia" }
          - { key: "G", text: "Genetic and congenital: Fanconi, ataxia telangiectasia, Down, X-linked agammaglobulinemia" }
          - { key: "C", text: "Chemicals: benzene, alkylating agents" }
        hook: "**R**ed **V**ery **G**ood **C**ells... بس للأسف مش good خالص."
      - kind: explain
        page: 104
        title: "الإشعاع: مين يتأذي أكتر؟"
        quote: "Greater risk results from higher dose radiation delivered over shorter periods to younger patients. Recently concern has been raised about possible leukemio genic effects of low frequency non ionizing electromagnetic field."
        text: |
          الـ **ionizing radiation** بتزوّد **acute lymphoblastic leukaemia (ALL)** و **acute myeloid leukaemia (AML)** و **chronic myeloid leukaemia (CML)**، واتشاف ده في:
          - عيانين اتعالجوا بـ radiotherapy للـ **ankylosing spondylitis**
          - الناجين من **القنبلة الذرية**

          والخطر بيزيد مع ==higher dose== على **مدة أقصر** في **عيان أصغر**. وفيه قلق كمان من الـ low-frequency **non-ionizing electromagnetic fields**.

          ليه الصغير والجرعة العالية أخطر؟ التفسير المقبول (مش في الكتاب): الإشعاع بيكسر الـ DNA، والنخاع في الصغير بيتقسم أسرع، فأي كسر بيتنسخ بسرعة قبل ما يتصلّح. والجرعة الكبيرة في وقت قصير ما بتديش الخلايا فرصة تصلّح نفسها بين الجرعات.
      - kind: check
        page: 104
        quote: "Human T cell lymphotropic virus type 1 (HTLV-1) is considered the causative agent of adult T-cell leukemia. This form of leukemia is found in Caribean bacin and Africa."
        question: "Adult T-cell leukemia in a patient from the Caribbean is caused by:"
        options:
          - "HTLV-1"
          - "Benzene"
          - "EBV"
          - "Ionizing radiation"
        answer: 0
        why:
          - "صح: الـ HTLV-1 هو السبب، وموجود في الـ Caribbean basin وأفريقيا."
          - "الـ benzene بيعمل marrow hypoplasia ممكن تتحول acute leukemia، مش T-cell leukemia بالذات."
          - "الـ Epstein–Barr virus (EBV) بيعمل infectious mononucleosis اللي ممكن تتلخبط مع ALL."
          - "الإشعاع بيزوّد ALL وAML وCML."
      - kind: explain
        remind: [hem.L07.008]
        page: 105
        title: "الجينات والكيماويات"
        quote: "Several autosomal recessive disorders associated with chromosomal instability are prone to terminate in acute leukemia including fanconi anemia and ataxia telangiectasia. Other congential disorders associated with an increased incidence of leukemia as dawn syndrome and infantile x- linked agamma globulinemia"
        text: |
          - **Fanconi anemia** و **ataxia telangiectasia**: autosomal recessive وفيهم ==chromosomal instability==، فالـ deoxyribonucleic acid (DNA) بيتكسر بسهولة وتطلع leukemia.
          - **Down syndrome** و **infantile X-linked agammaglobulinemia**: incidence أعلى.
          - **Benzene** (شغل المصانع) ← marrow hypoplasia ← أحيانًا acute leukemia.
          - ==Alkylating agents== (chlorambucil، melphalan، nitrogen mustard) ← **AML**.

          الخيط اللي بيجمع الأربع أسباب: كلهم بيأذوا الـ **DNA** بتاع الـ stem cell، يا من بره (إشعاع، كيماويات، فيروس) يا من جوه (جينات بتخلي الـ DNA ضعيف). وكل ما الـ DNA اتأذى أكتر، الاحتمال يزيد إن خلية واحدة تاخد الـ malignant event.
      - kind: aside
        tone: exam
        page: 105
        quote: "Prior exposure to alkylating agents such as cholramboucil, melphalan and nitrogen mustard is associated with an increased risk of AML."
        text: "سؤال كلاسيكي: عيان myeloma خد **melphalan** من سنين وجاله leukemia. الإجابة **AML**، مش chronic lymphocytic leukaemia (CLL) ومش ALL."
      - kind: check
        page: 105
        quote: "Occupational exposure to benzene frequently results in morrow hypoplasia which sometimes ivolves into acute leukemia."
        question: "A factory worker exposed to benzene for years. What does the lecture say usually happens first?"
        options: ["Marrow hypoplasia, which sometimes evolves into acute leukemia", "Immediate acute promyelocytic leukemia", "Chronic lymphocytic leukemia", "Adult T-cell leukemia"]
        answer: 0
        why:
          - "صح: الـ benzene بيعمل marrow hypoplasia الأول، وأحيانًا تتطور لـ acute leukemia."
          - "مفيش رابط في الكتاب بين الـ benzene والـ APL بالذات."
          - "الـ CLL مش في أسباب الكتاب هنا."
          - "الـ adult T-cell leukemia سببها HTLV-1."
      - kind: try
        items: [hem.L07.001, hem.L07.003, hem.L07.005, hem.L07.007, hem.L07.011]
    recap:
      - "Acute leukemia = early precursor بيتكاثر من غير ما يكبر، والـ blasts بتحتل النخاع وما بتشتغلش."
      - "الأسباب **RVGC**: Radiation، Virus (HTLV-1)، Genetic، Chemicals؛ كلهم بيأذوا الـ DNA."
      - "الإشعاع: جرعة أعلى، مدة أقصر، عيان أصغر = خطر أكبر."
      - "Alkylating agents ← AML. Benzene ← hypoplasia ثم leukemia."
    practice: [hem.L07.001, hem.L07.002, hem.L07.003, hem.L07.004, hem.L07.005, hem.L07.006, hem.L07.007, hem.L07.008, hem.L07.009, hem.L07.010, hem.L07.011, hem.L07.094, hem.L07.095]
