            <text x="200" y="160" text-anchor="middle" class="t-sm t-b">Y = a + bX</text>
          </svg>
      - kind: explain
        page: 22
        quote: "Y = a + b (x)\nwhere (a) is the intercept (constant)\nwhile b ( slope of line ) is value changing each time when X increases by one unit.\n(b) is the regression coefficient\nThe amount of change in the value of y when X increase by one unit"
        title: "Y = a + bX"
        text: |
          - **a** = الـ ==intercept (constant)==: قيمة Y لما X = صفر.
          - **b** = الـ **slope** (ميل الخط) = ==regression coefficient==: **مقدار التغير في y لما X تزيد unit واحدة**.

          مثال: الضغط = 20 + 0.5 × الكوليسترول. كل 1 mg/dL زيادة في الكوليسترول ← الضغط يزيد **0.5 mmHg**.
      - kind: reveal
        page: 22
        quote: "Y = a + b (x)\nwhere (a) is the intercept (constant)\nwhile b ( slope of line ) is value changing each time when X increases by one unit."
        prompt: "Y = 20 + 0.5X. لو الكوليسترول (X) = 180، الضغط المتوقع كام؟"
        answer: |
          Y = 20 + 0.5 × 180 = 20 + 90 = **110 mmHg**.

          الـ **intercept** (a = 20) هو قيمة Y لما X = صفر، والـ **slope** (b = 0.5) هو اللي بيتغير لكل unit زيادة في X. متنساش تضيف الـ a؛ الـ 90 لوحدها نص الإجابة بس.
      - kind: aside
        tone: trap
        page: 36
        quote: "All the followings are TRUE for regression line EXCEPT:\n1. It give an idea about the strength of correlation between two quantitative parameters\n2. It represent the best fit of dots in the scatter plot\n3. It can be used to predict the value of the dependent variable when the independent variable is known\n4. In positive correlation it runs upward and forward."
        text: |
          الـ **b مش هو الـ r**!

          - الـ **b** = ميل الخط (بوحدات: mmHg لكل mg/dL).
          - الـ **r** = القوة (من غير وحدات، بين -1 و+1).

          خط مايل جدًا ممكن تكون النقط حواليه متبعترة (r ضعيف). عشان كده **الخط لوحده مبيديكش القوة**؛ القوة بتبان من قد إيه النقط لازقة في الخط.
      - kind: check
