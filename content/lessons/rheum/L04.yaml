lecture: rheum.L04
lessons:
  # ------------------------------------------------------------------
  # Book order. Ids are never reused: lesson4 (pp 72-73, CAPS and work-up)
  # was split out of lesson2; the Sapporo criteria (p70) moved from lesson1
  # into lesson2 beside the antibodies they test (#828, 2026-11-13).
  # lesson3 keeps three topics on purpose: "adjunct" is one page (p75) that
  # closes the management section.
  - id: rheum.L04.lesson1
    title: "الـ APS: دم بيتجلط من غير سبب"
    hook: "ست شابة عندها DVT وإجهاض متكرر وصفايح واطية: ده مش حظ وحش، ده antibody واحد."
    minutes: 8
    pages: [68, 69]
    topics: [definition, clinical]
    goals:
      - "تعرّف الـ APS بالتلات أركان"
      - "تعدّ الـ clinical features: venous و arterial و pregnancy و other"
      - "تفسّر ليه الـ APS ممكن يمسك أي organ، وليه الحمل بيتأثر"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L04.001]
        page: 68
        title: "التلات أركان"
        quote: "Antiphospholipid Syndrome (APS) is a systemic autoimmune disorder characterised by:\n  Arterial and/or venous thrombosis.\n  Pregnancy-related morbidity (e.g., recurrent miscarriage, still birth, premature birth due to placental insufficiency).\n  The persistent presence of antiphospholipid antibodies (aPL) in the blood.\n    APS can occur on its own (primary APS) or in association with other autoimmune diseases, particularly systemic lupus erythematosus (SLE) — referred to as secondary APS."
        text: |
          الـ **Antiphospholipid Syndrome**، أو **antiphospholipid syndrome (APS)**، هو ==systemic autoimmune disorder== بيتعرّف بتلات حاجات مع بعض:

          1. **Thrombosis**: arterial و/أو venous.
          2. **Pregnancy morbidity**: recurrent miscarriage، stillbirth، premature birth من الـ placental insufficiency.
          3. **Persistent antiphospholipid antibodies**، أو **aPL**، في الدم.

          جلطة + حمل + antibody ثابت = APS.

          التفسير المقبول (مش في الكتاب): ليه التلاتة مع بعض؟ عشان الجلطة لوحدها أسبابها كتير، والإجهاض المتكرر لوحده أسبابه كتير، والـ antibody ممكن يطلع مؤقت بعد عدوى من غير أي مرض. يعني التشخيص محتاج **حدث إكلينيكي** + **antibody ثابت** مع بعض، والجلطات الصغيرة في الـ placenta هي اللي بتربط الركنين الأولانيين.
      - kind: explain
        page: 68
        title: "Primary ولا secondary؟"
        quote: "Epidemiology and Clinical Context\n  APS is the most common acquired cause of thrombophilia.\n  It may present as a primary condition or overlap with other autoimmune disorders (especially SLE).\n  APS can affect virtually any organ system through thrombotic or ischemic complications.\n  It can occur at any age but is more common in women of childbearing age."
        text: |
          - **Primary APS**: لوحده، من غير مرض autoimmune تاني.
          - **Secondary APS**: مع مرض autoimmune، وأشهرهم ==systemic lupus erythematosus (SLE)==.

          وهو ==the most common acquired cause of thrombophilia==. ممكن يمسك أي organ، لأن أي وعا ممكن يتجلط، وأي سن، بس أكتر في **women of childbearing age**.
      - kind: explain
        page: 68
        quote: "APS can affect virtually any organ system through thrombotic or ischemic complications."
        title: "ليه أي organ؟"
        text: |
          الكتاب بيقول الـ APS ممكن يمسك **virtually any organ system**، والسبب في نفس الجملة: **thrombotic or ischemic complications**.

          يعني المرض مش في عضو معين، المرض في **الدم نفسه** اللي بقى سهل يتجلط. وأي وعا في الجسم ممكن يتسد:
          - وريد الرجل ← **DVT**، ولو الجلطة طلعت ← **PE**.
          - شريان المخ ← **stroke** و TIA.
          - شريان القلب ← **MI**.
          - أوعية المشيمة ← ==placental insufficiency==.

          وليه أكتر في الستات في سن الإنجاب؟ التفسير المقبول (مش في الكتاب): ده نفس سن وجنس الـ **SLE**، أشهر مرض بيصاحب الـ secondary APS، والحمل نفسه بيزوّد قابلية التجلط فبيكشف المرض.
      - kind: figure
        page: 69
        quote: "Thrombotic Events\n  Venous Thrombosis\n    Deep vein thrombosis (DVT).\n    Pulmonary embolism (PE).\n  Arterial Thrombosis\n    Stroke.\n    Transient ischemic attacks.\n    Myocardial infarction.\n    Retinal artery or vein thrombosis."
        title: "خريطة الـ clinical features"
        alt: "A body outline with labels. Venous: DVT in the leg and pulmonary embolism in the lungs. Arterial: stroke and TIA in the brain, retinal artery or vein thrombosis in the eye, myocardial infarction in the heart. Pregnancy: early miscarriage before 10 weeks, fetal death beyond 10 weeks, premature birth before 34 weeks. Other: thrombocytopenia, livedo reticularis on the skin, Libman–Sacks valves, migraine seizures chorea, CAPS."
        caption: "أربع عيلات: **venous** و **arterial** و **pregnancy** و **other**. الـ ==CAPS== هو الشكل النادر اللي بيقتل."
        svg: |
          <svg viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L04a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fg-head"/></marker></defs>
            <circle cx="165" cy="45" r="25" class="fg-box"/>
            <rect x="135" y="75" width="60" height="120" rx="20" class="fg-box"/>
            <rect x="140" y="195" width="20" height="120" rx="8" class="fg-box"/>
            <rect x="170" y="195" width="20" height="120" rx="8" class="fg-box"/>
            <text x="10" y="30" class="t-sm t-b t-bad">Arterial</text>
            <text x="10" y="46" class="t-sm">Stroke, TIA</text>
            <text x="10" y="62" class="t-sm">Retinal thrombosis</text>
            <path d="M110 45 H138" class="fg-arrow" marker-end="url(#L04a)"/>
            <text x="10" y="110" class="t-sm">Myocardial infarction</text>
            <path d="M125 106 H150" class="fg-arrow" marker-end="url(#L04a)"/>
            <text x="225" y="30" class="t-sm t-b t-acc">Other</text>
            <text x="225" y="46" class="t-sm">Migraine, seizures,</text>
            <text x="225" y="62" class="t-sm">chorea</text>
            <text x="225" y="92" class="t-sm">Libman–Sacks</text>
            <text x="225" y="108" class="t-sm">valves</text>
            <text x="225" y="138" class="t-sm">Thrombocytopenia</text>
            <text x="225" y="168" class="t-sm">Livedo reticularis</text>
            <text x="10" y="150" class="t-sm t-b t-acc">Venous</text>
            <text x="10" y="166" class="t-sm">Pulmonary embolism</text>
            <path d="M120 162 H148" class="fg-arrow" marker-end="url(#L04a)"/>
            <text x="10" y="270" class="t-sm">DVT</text>
            <path d="M40 266 H138" class="fg-arrow" marker-end="url(#L04a)"/>
            <rect x="10" y="335" width="310" height="58" rx="10" class="fg-acc"/>
            <text x="20" y="355" class="t-sm t-b">Pregnancy</text>
            <text x="20" y="372" class="t-sm">Miscarriage &lt;10 wk · fetal death &gt;10 wk</text>
            <text x="20" y="388" class="t-sm">Premature birth &lt;34 wk (preeclampsia, placenta)</text>
          </svg>
      - kind: explain
        page: 69
        quote: "Premature birth (<34 weeks) due to severe preeclampsia, eclampsia, or placental insufficiency."
        title: "ليه الحمل بيتأثر؟"
        text: |
          الكتاب بيعدّ تلات صور للـ pregnancy morbidity: إجهاض بدري متكرر قبل **10 أسابيع**، موت جنين من غير سبب بعد **10 أسابيع**، وولادة مبكرة قبل **34 أسبوع** من preeclampsia أو eclampsia أو **placental insufficiency**.

          التفسير المقبول (مش في الكتاب) اللي بيربطهم: المشيمة شبكة أوعية صغيرة، والجنين بياخد منها كل أكله وأكسجينه. لو الأوعية دي اتجلطت:
          - الجنين ممكن يموت.
          - أو المشيمة تشتغل نص شغل ← الجنين صغير والأم تعمل ==preeclampsia==، فالدكاترة يولّدوها بدري.

          عشان كده علاج الحمل (صفحة 74) هو نفس الفكرة: نمنع التجلط بالـ aspirin والـ heparin.
      - kind: sort
        page: 69
        quote: "Other Clinical Manifestations\n  Thrombocytopenia.\n  Livedo reticularis.\n  Valvular heart disease (Libman–Sacks endocarditis).\n  Neurological symptoms (e.g., migraine, seizures, chorea).\n  Catastrophic APS (CAPS) – a rare but life-threatening form with multiorgan thrombosis."
        prompt: "صنّف الـ manifestations دي:"
        bins: ["Venous", "Arterial", "Other"]
        cards:
          - { text: "Pulmonary embolism", bin: 0 }
          - { text: "DVT", bin: 0 }
          - { text: "Stroke", bin: 1 }
          - { text: "Retinal artery thrombosis", bin: 1 }
          - { text: "Myocardial infarction", bin: 1 }
          - { text: "Livedo reticularis", bin: 2 }
          - { text: "Thrombocytopenia", bin: 2 }
          - { text: "Chorea", bin: 2 }
        why: "الـ venous هما الـ DVT والـ PE بس. الـ arterial: stroke و transient ischemic attack (TIA) و myocardial infarction (MI) و retinal thrombosis. والباقي تحت **other**: thrombocytopenia و livedo و Libman–Sacks و migraine/seizures/chorea و CAPS."
      - kind: check
        page: 69
        quote: "Valvular heart disease (Libman–Sacks endocarditis)."
        question: "A 29-year-old woman with APS has a new murmur. Echo shows sterile vegetations on the mitral valve. What is this called?"
        options: ["Libman–Sacks endocarditis", "Infective endocarditis", "Rheumatic heart disease", "Mitral valve prolapse"]
        answer: 0
        why:
          - "صح: الكتاب بيعدّها في الـ other clinical manifestations: valvular heart disease (Libman–Sacks)."
          - "دي محتاجة ميكروب و fever و blood cultures موجبة."
          - "ده بعد rheumatic fever، مش APS."
          - "ده مش vegetations أصلًا."
      - kind: try
        items: [rheum.L04.001, rheum.L04.004, rheum.L04.008, rheum.L04.010, rheum.L04.011]
    recap:
      - "APS = thrombosis و/أو pregnancy morbidity + aPL ثابت. أشهر acquired thrombophilia."
      - "Primary لوحده، secondary مع SLE غالبًا. أكتر في الستات في سن الإنجاب."
      - "أي organ عشان المرض في الدم: venous (DVT، PE)، arterial (stroke، TIA، MI، retina)."
      - "الحمل: جلطات المشيمة ← إجهاض، موت جنين، أو ولادة قبل 34 أسبوع."
      - "Other: thrombocytopenia، livedo، Libman–Sacks، migraine/seizures/chorea، CAPS."
    practice: [rheum.L04.001, rheum.L04.002, rheum.L04.003, rheum.L04.004, rheum.L04.005, rheum.L04.006, rheum.L04.007, rheum.L04.008, rheum.L04.009, rheum.L04.010, rheum.L04.011, rheum.L04.012, rheum.L04.013]
  # ------------------------------------------------------------------
  - id: rheum.L04.lesson2
    title: "Sapporo والتلات antibodies"
    hook: "مش كل aPL positive زي بعض: نوعه وعدده وثباته بيحددوا التشخيص وخطر الجلطة الجاية."
    minutes: 10
    pages: [70, 71]
    topics: [criteria, antibodies]
    goals:
      - "تحفظ الـ 2006 revised Sapporo criteria بالأرقام"
      - "تفرّق بين LA و aCL و anti-β2GPI"
      - "ترتّب العيان high ولا low risk، وتعرف ليه"
    status: unverified
    steps:
      - kind: explain
        page: 70
        title: "Sapporo 2006: واحد من كل ناحية"
        quote: "Classification Criteria for APS (2006 Revised Sapporo Criteria)"
        text: |
          علشان تصنّف العيان **APS** بالـ ==2006 revised Sapporo criteria== لازم:

          - **At least one clinical criterion**: thrombosis أو pregnancy morbidity
          - **+ at least one laboratory criterion**

          الـ **vascular thrombosis**: episode واحدة أو أكتر **objectively confirmed**، arterial أو venous أو **small vessel**، في أي organ.
      - kind: table
        page: 70
        quote: "Three or more consecutive spontaneous abortions before 10 weeks, with maternal and anatomical causes excluded."
        title: "الـ pregnancy morbidity في Sapporo"
        columns: [Event, Rule]
        rows:
          - ["Fetal death", "≥1, normal fetus, ≥10 weeks"]
          - ["Premature birth", "≥1, <34 weeks, from eclampsia, preeclampsia or placental insufficiency"]
          - ["Early abortions", "≥3 consecutive, <10 weeks, other causes excluded"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: tip
        page: 70
        quote: "One or more premature births before 34 weeks due to eclampsia, preeclampsia, or placental insufficiency."
        text: |
          احفظها **واحد، واحد، تلاتة**:
          - **موت جنين طبيعي** بعد 10 أسابيع: مرة واحدة كفاية.
          - **ولادة مبكرة** قبل 34 أسبوع: مرة واحدة كفاية.
          - **إجهاض بدري** قبل 10 أسابيع: لازم ==3 consecutive==، لأن الإجهاض البدري شائع أصلًا من غير APS.
      - kind: explain
        page: 70
        title: "الـ laboratory criteria"
        quote: "Lupus anticoagulant (LA) detected according to international guidelines."
        text: |
          واحد على الأقل من التلاتة، ==positive مرتين بينهم 12 weeks على الأقل==:

          1. **Lupus anticoagulant (LA)**
          2. **Anticardiolipin (aCL)** Immunoglobulin G (IgG) أو Immunoglobulin M (IgM) بـ **medium to high titer**
          3. **Anti-β2 glycoprotein I** IgG أو IgM

          التفسير المقبول (مش في الكتاب): ليه مرتين بينهم 12 أسبوع؟ عشان الـ aPL ممكن يطلع **مؤقت** بعد عدوى أو دوا ويختفي. والعلاج بعدها ممكن يبقى warfarin مدى الحياة، فمش هتبني قرار زي ده على نتيجة ممكن تختفي. ويعني الـ medium to high titer إن الرقم الواطي أقل ارتباط بالجلطات.
      - kind: reveal
        page: 70
        quote: "At least one laboratory criterion (Repeated on two or more occasions, at least 12 weeks apart)."
        prompt: "ليه لازم نعيد التحليل بعد 12 أسبوع؟ ما هو positive خلاص!"
        answer: |
          لأن الـ **aPL** ممكن يطلع **transient** مع أي infection أو في الحمل ويختفي، والكتاب نفسه بيعدّه **lower risk**.

          اللي بيعمل المرض هو الـ antibody الثابت، **persistent**. علشان كده: مرتين، ==≥12 weeks apart==، وإلا هتحط عيان على warfarin طول عمره علشان دور برد.
      - kind: check
        page: 70
        quote: "One or more unexplained deaths of a morphologically normal fetus at or beyond the 10th week of gestation."
        question: "Which is a Sapporo (2006) clinical criterion for APS?"
        options:
          - "Unexplained fetal loss after 10 weeks of gestation"
          - "Two consecutive miscarriages before 10 weeks"
          - "Positive ANA"
          - "Elevated ESR"
        answer: 0
        why:
          - "صح: موت جنين طبيعي بعد 10 أسابيع، مرة واحدة كفاية."
          - "الإجهاض البدري لازم **3** ورا بعض، مش 2."
          - "الـ antinuclear antibodies (ANA) للـ SLE مش للـ APS criteria."
          - "الـ erythrocyte sedimentation rate (ESR) مش specific ومش في الـ criteria خالص."
      - kind: update
        page: 70
        quote: "To classify a patient as having APS, they must have:\n  At least one clinical criterion"
        text: "الـ **2023 American College of Rheumatology (ACR)/European League Against Rheumatism (EULAR) APS criteria** بقت بنقط. الأول **entry criterion**: aPL positive في خلال 3 سنين من الـ clinical event. وبعدين clinical و laboratory domains، ولازم **3 points على الأقل** من كل ناحية. في الامتحان: Sapporo بتاع الكتاب."
        ref: "ACR/EULAR APS classification criteria, 2023"
      - kind: aside
        tone: analogy
        page: 70
        quote: "Lupus Anticoagulant (LA)\n  Functional assay based on clotting time.\n  Associated with the highest risk of thrombosis.\n  Not a true \"anticoagulant\" in vivo — rather, it increases thrombosis risk."
        text: |
          تخيّل الـ antibodies دي زي واحد بيلزق **صمغ** على جدار الوعا من جوه: الصفايح والـ clotting factors بتلزق، والجلطة تطلع في أي حتة، شريان أو وريد أو المشيمة.

          والطريف إن أخطرهم اسمه **lupus anticoagulant** وهو في الحقيقة **بيجلّط**. الاسم جاي من الأنبوبة في المعمل مش من جسم العيان.
      - kind: table
        page: 71
        quote: "Anticardiolipin Antibodies (aCL)\n  Detected via ELISA.\n  IgG and IgM isotypes.\n  Moderate to high titers (≥40 GPL or MPL units) are clinically significant."
        title: "التلات antibodies"
        columns: [Test, How, Key]
        rows:
          - ["Lupus anticoagulant", "Clotting time (aPTT, dRVVT)", "Highest thrombosis risk"]
          - ["Anticardiolipin", "ELISA, IgG and IgM", "≥40 GPL/MPL significant"]
          - ["Anti-β2GPI", "ELISA, IgG and IgM", "Cofactor for aCL binding"]
        hide: [[0, 2], [1, 2], [2, 2]]
      - kind: reveal
        page: 71
        quote: "Anti-β2 Glycoprotein I Antibodies (anti-β2GPI)\n  Also detected via ELISA.\n  IgG and IgM isotypes.\n  Targeted against β2-glycoprotein I, a cofactor for aCL binding to phospholipids."
        prompt: "ليه بنعمل anti-β2GPI لو عندنا aCL؟"
        answer: |
          الـ **β2-glycoprotein I** هو ==cofactor== بيخلي الـ aCL يمسك في الـ phospholipid. الـ antibodies اللي بتعمل جلطات فعلًا غالبًا متوجهة له هو.

          فالـ **anti-β2GPI** بيأكد إن الـ aCL ده من النوع اللي بيأذي، مش aCL عابر من infection.
      - kind: figure
        remind: [rheum.L04.027, rheum.L04.028]
        page: 71
        quote: "The risk of thrombosis correlates with the type and number of positive aPL tests."
        title: "سلّم الخطر"
        alt: "A vertical risk ladder. At the top, high risk: triple positivity (LA, aCL and anti-β2GPI), isolated persistent LA, high titers especially IgG above 40 units. At the bottom, low risk: low-titer aCL or anti-β2GPI only, IgM without LA, transient or single positive tests during infection or pregnancy."
        caption: "الخطر بيزيد مع ==type and number== الـ tests الموجبة. الـ triple positive فوق خالص."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L04b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fg-head-bad"/></marker></defs>
            <path d="M25 285 V20" class="fg-arrow-bad" stroke-width="3" marker-end="url(#L04b)"/>
            <text x="12" y="155" class="t-sm t-bad t-b" transform="rotate(-90 12 155)">Thrombosis risk</text>
            <rect x="45" y="10" width="275" height="130" rx="12" class="fg-bad"/>
            <text x="60" y="34" class="t-b t-bad">Higher risk</text>
            <text x="60" y="60" class="t-sm">Triple positive: LA + aCL + anti-β2GPI</text>
            <text x="60" y="86" class="t-sm">Isolated LA, especially persistent</text>
            <text x="60" y="112" class="t-sm">High titers, especially IgG &gt;40 units</text>
            <rect x="45" y="160" width="275" height="130" rx="12" class="fg-good"/>
            <text x="60" y="184" class="t-b t-good">Lower risk</text>
            <text x="60" y="210" class="t-sm">Low-titer aCL or anti-β2GPI only</text>
            <text x="60" y="236" class="t-sm">IgM antibodies without LA</text>
            <text x="60" y="262" class="t-sm">Transient or single positive test</text>
            <text x="60" y="278" class="t-sm t-mut">(infection, pregnancy)</text>
          </svg>
      - kind: explain
        page: 71
        quote: "Transient or single-time positive tests (e.g., during infection or pregnancy)."
        title: "ليه السلّم مترتب كده؟"
        text: |
          الكتاب بيقول الخطر بيمشي مع **نوع** و **عدد** الـ tests الموجبة. التفسير المقبول (مش في الكتاب) لكل درجة:

          - **Triple positivity** فوق خالص: تلات اختبارات مختلفة بتشوف نفس الـ antibody المؤذي من تلات زوايا، فالاحتمال إنه حقيقي ومؤذي أعلى حاجة.
          - **Isolated LA**: لأن الـ LA **functional assay**، يعني بيقيس إن الـ antibody فعلًا **بيأثر على التجلط**، مش بس موجود.
          - **IgG عالي فوق 40**: كل ما الكمية أكتر والنوع IgG، كل ما الـ antibody أقوى.
          - **تحت**: low titer، **IgM من غير LA**، و **transient** مع infection أو حمل: ده غالبًا antibody عابر، وعشان كده الـ criteria بتطلب ==12 weeks==.
      - kind: check
        page: 70
        quote: "Lupus Anticoagulant (LA)\n  Functional assay based on clotting time.\n  Associated with the highest risk of thrombosis.\n  Not a true \"anticoagulant\" in vivo — rather, it increases thrombosis risk."
        question: "Which antiphospholipid antibody carries the highest risk of thrombosis?"
        options: ["Lupus anticoagulant", "Anticardiolipin IgM", "Anti-β2 glycoprotein I IgM", "Anti-dsDNA"]
        answer: 0
        why:
          - "صح: الـ LA أقوى predictor للجلطات، حتى لوحده: isolated LA = high risk."
          - "الـ IgM aCL من غير LA = lower risk."
          - "الـ IgM anti-β2GPI لوحده = lower risk."
          - "الـ anti-dsDNA ده antibody الـ SLE، مش aPL أصلًا."
      - kind: try
        items: [rheum.L04.016, rheum.L04.018, rheum.L04.021, rheum.L04.025, rheum.L04.027]
    recap:
      - "Sapporo: clinical واحد + lab واحد. الحمل: **1-1-3** (موت ≥10 أسابيع، ولادة <34، تلات إجهاضات <10)."
      - "الـ lab: LA أو aCL أو anti-β2GPI، مرتين بينهم ≥12 أسبوع."
      - "LA = clotting assay، أعلى خطر، وبيجلّط مش بيسيّل. aCL و anti-β2GPI = ELISA، IgG و IgM. aCL significant ≥40."
      - "High risk: triple positive، isolated LA، IgG عالي. Low: low titer، IgM من غير LA، transient."
