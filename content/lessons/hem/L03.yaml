      - kind: explain
        page: 27
        title: "HbH disease"
        quote: "These patients have anaemia (haemoglobin 7-10 gms/dl), icterus, and hepatosplenomegaly. Transfusions are usually not needed."
        text: |
          **3 جينات واقعة** (--/-α، يعني α0 + α+). الـ α قليلة جدًا، فالـ **β تعمل tetramers (β4) = HbH**.

          الـ HbH بيترسب في الكرات **العجوزة** ويعمل inclusions، والطحال يكسّرها.

          الصورة: Hb ==7–10 g/dL==، **icterus**، **hepatosplenomegaly**، و**النقل غالبًا مش محتاج**. الفيلم: anisopoikilocytosis، hypochromia، microcytes، target cells.
      - kind: explain
        page: 26
        title: "Hb Bart's: الجنين من غير α"
        quote: "They are severely anaemic, and have massive anasarca and hepatosplenomegaly."
        text: |
          الـ ==Hb Bart's hydrops fetalis== أشد نوع: **homozygous α0** (--/--)، يعني مفيش ولا جين α.

          الجنين ما عندوش α خالص، فالـ **γ chains** الزيادة بتتجمع أربعة أربعة: **γ4 = Hb Bart's**.

          النتيجة: anaemia شديدة، **anasarca** ضخمة (الـ hydrops)، و hepatosplenomegaly. الطفل بيتولد ميت أو بيموت بعد الولادة بشوية.

          ليه الـ hydrops؟ التفسير المقبول (مش في الكتاب): الـ Hb Bart's بيمسك الأكسجين ومش بيسيبه للأنسجة، فالجنين في hypoxia شديدة، والقلب بيفشل، والسوايل بتتجمع في كل حتة.
      - kind: check
        page: 26
        quote: "Infants with this disease are either stillborn or die soon after birth. They are severely anaemic, and have massive anasarca and hepatosplenomegaly."
        question: "A fetus has hydrops with massive anasarca and hepatosplenomegaly. Genotype?"
        options:
          - "--/-- (no α genes)"
          - "--/-α"
          - "-α/αα"
          - "Heterozygous β-thalassaemia"
        answer: 0
        why:
          - "صح: Hb Bart's hydrops = homozygous α0، الطفل بيتولد ميت أو يموت بعد الولادة."
          - "ده HbH disease، Hb 7–10 ومن غير نقل."
          - "ده silent، indices شبه طبيعية."
          - "الـ β minor carrier asymptomatic."
      - kind: explain
        page: 28
        title: "الـ trait والـ silent والـ intermedia"
        quote: "Persons with this condition have very mild anaemia, microcytic and hypochromic red cells, and decreased MCV and MCH."
        text: |
          - **α0 trait** (--/αα): asymptomatic، فبيتلاقى صدفة في تحليل روتيني. anaemia خفيفة جدًا، **microcytic hypochromic**، و MCV و MCH قليلين.
          - **Silent α+** (-α/αα): الـ indices طبيعية، أو الـ MCV والـ MCH أقل **شوية**. ليه silent؟ عشان 3 جينات بيعملوا α كفاية تقريبًا.
          - ==Thalassaemia intermedia==: في النص بين الـ major والـ minor، **مش محتاجة نقل** أو محتاجاه من وقت للتاني بس.

          يعني لو شفت microcytosis خفيفة في واحد سليم والـ ferritin طبيعي، فكّر في trait قبل ما تدّيه حديد.
      - kind: check
        page: 28
        quote: "Red cell morphology and indices are normal or there may be a slight decrease in MCV or MCH."
        question: "A healthy man has normal Hb and an MCV just below normal; ferritin is normal. Which genotype fits best?"
        options:
          - "-α/αα (silent α+)"
          - "--/-α (HbH disease)"
          - "--/-- (Bart's)"
          - "β-thalassaemia major"
        answer: 0
        why:
          - "صح: الـ silent carrier الـ indices فيه طبيعية أو الـ MCV أقل شوية."
          - "الـ HbH فيه Hb 7–10 و hepatosplenomegaly."
          - "ده قاتل قبل الولادة أو بعدها بشوية."
          - "الـ major بيبان في الطفولة بأنيميا شديدة ومحتاج نقل."
      - kind: try
        items: [hem.L03.036, hem.L03.039, hem.L03.042, hem.L03.045, hem.L03.048]
