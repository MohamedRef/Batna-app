        quote: "FIB-4 index (for liver fibrosis assessment): FIB4 index = (age × AST) / (platelet count × √ALT)\n| < 1.3 | 1.3-3.25 | > 3.25 |\n|---|---|---|\n| low risk | intermediate risk | high risk |"
        title: "FIB-4: أربع أرقام موجودة في أي ملف"
        text: |
          **Fibrosis-4 index (FIB-4)** معادلة من 4 حاجات موجودة في أي ملف: السن والـ aspartate aminotransferase (AST) والـ alanine aminotransferase (ALT) والـ platelets. مش محتاج جهاز ولا تحليل خاص.

          ==FIB-4 = (age × AST) ÷ (platelet count × √ALT)==

          والـ bands في الكتاب (ص 102):

          - **Low risk**: أقل من 1.3
          - **Intermediate**: من 1.3 لـ 3.25
          - **High risk**: أكتر من 3.25

          ميزته الكبيرة إنه بيفرز: اللي تحت 1.3 غالبًا مش محتاج FibroScan دلوقتي.
      - kind: figure
        page: 102
        title: "معادلة الـ FIB-4 زي ما الكتاب كاتبها"
        image: { file: hb/L06-fib4-formula.webp, book: true }
        alt: "Book image of the formula: FIB4 index equals (age times AST) divided by (platelet count times the square root of ALT)."
        caption: |
          المعادلة سطر واحد:

          - **فوق الخط (البسط)**: **age × AST**: السن في الـ aspartate aminotransferase (AST).
          - **تحت الخط (المقام)**: **platelet count × √ALT**: الصفايح في جذر الـ ALT.

          اللي بيعلّي الرقم: سن كبير و AST عالي. اللي بيوطّيه: صفايح كتير و ALT عالي. وده منطقي: في التليف المتقدم ==الـ AST بيعلى على الـ ALT== و==الصفايح بتقل== من الـ portal hypertension. أربع أرقام في أي ملف، ومن غير جهاز.
