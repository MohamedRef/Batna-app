            <text x="245" y="116" text-anchor="middle" class="t-sm">TSC2 + PKD1</text>
            <text x="245" y="130" text-anchor="middle" class="t-sm">= PKDTS</text>
            <path d="M120 64 L210 64" class="fg-arrow-bad"/>
            <text x="10" y="170" class="t-sm t-b">Chromosome 9q</text>
            <rect x="10" y="180" width="310" height="30" rx="15" class="fg-box"/>
            <rect x="200" y="180" width="45" height="30" class="fg-acc"/>
            <text x="222" y="200" text-anchor="middle" class="t-sm t-b">TSC1</text>
          </svg>
      - kind: explain
        page: 170
        title: "ليه الـ TSC1 أخف، وليه 70% sporadic؟"
        quote: "TSC1-related disease is milder, apparently because of a reduced rate of \"second hits.\""
        text: |
          الكتاب بيقول الـ TSC1 أخف بسبب ==reduced rate of "second hits"==، وإن **70%** sporadic من **new mutations**.

          التفسير المقبول (مش في الكتاب) لفكرة الـ second hit: الـ TSC1 والـ TSC2 **tumor suppressor genes**. كل خلية فيها نسختين. العيان مولود بنسخة بايظة في كل خلاياه، بس الـ hamartoma ما بيطلعش غير في الخلية اللي **النسخة التانية** كمان باظت فيها (second hit). لو الـ second hit أقل حصولًا في الـ TSC1، يبقى hamartomas أقل ومرض أخف.

          و 70% sporadic **يعني** إن عدم وجود family history ما بيستبعدش الـ TSC أبدًا.
      - kind: explain
        remind: [neph.L07.126]
        page: 170
        title: "الصورة الإكلينيكية"
        quote: "The clinical features of TSC1- and TSC2-linked disease are similar, although TSC2-linked disease tends to be more severe. The most common clinical manifestations include seizures, intellectual disability and/or autism, skin lesions, interstitial lung disease, and tumors in the brain, retina, kidney, and heart. In affected individuals over 5 years of age, the most common skin lesions are facial angiofibromas (Fig. 45.7), hypomelanotic macules, and ungual fibromas."
        text: |
          الأشهر: **seizures**، intellectual disability أو autism، جلد، **interstitial lung disease**، و tumors في المخ والشبكية والكلية والقلب.

          الجلد بعد 5 سنين: ==facial angiofibromas==، **hypomelanotic macules** (ash leaf)، **ungual fibromas**، و **shagreen patch**.

          ليه المخ والجلد مع بعض؟ التفسير المقبول (مش في الكتاب): المخ والجلد جايين من نفس طبقة الجنين (ectoderm)، فالـ hamartomas بتطلع في الاتنين. الـ tubers في المخ هي اللي بتعمل seizures والـ autism. وليه الـ ash leaf بيضا؟ لأن الـ melanocytes في المكان ده ما بتطلعش pigment كفاية، وعلشان كده بتبان أوضح تحت الـ Wood's lamp. يعني بقعة بيضا في طفل عنده تشنجات = فكّر TSC.
      - kind: figure
        page: 170
        quote: "Facial Angiofibroma"
        title: "Facial angiofibroma"
        image: { file: neph/L07-facial-angiofibroma.webp, book: true }
        alt: "Book photograph of the nose and cheeks with many small red papules spread over both nasolabial folds and cheeks: facial angiofibromas."
        caption: |
          صورة للمناخير والخدّين: ==حبوب حمرا صغيرة كتير== على الخدّين وجنب المناخير، على الجنبين بشكل متماثل.

          دي الـ **facial angiofibromas**، أشهر علامة جلد في الـ ==tuberous sclerosis complex (TSC)== بعد سن 5، وهي major criterion.
      - kind: figure
        page: 170
        quote: "Periungual Fibroma"
        title: "Periungual fibroma"
        image: { file: neph/L07-periungual-fibroma.webp, book: true }
        alt: "Book photograph of a toenail with a small pink fleshy growth emerging from under the proximal nail fold, with a groove in the nail plate below it."
        caption: |
          صورة ضافر صباع رجل: ==ورم لحمي صغير وردي== طالع من تحت الجلد اللي عند أول الضافر، وتحته خط محفور في الضافر نفسه.

          ده الـ **periungual (ungual) fibroma**، major criterion في الـ ==TSC==.
      - kind: figure
        page: 171
        quote: "Shagreen patch"
        title: "Shagreen patch"
        image: { file: neph/L07-shagreen-patch.webp, book: true }
        alt: "Book photograph of the skin of the lower back with a raised, slightly orange-red, rough patch made of clustered papules: a shagreen patch."
        caption: |
          جلد الضهر من تحت: ==رقعة بارزة خشنة== لونها أحمر مايل للبرتقاني، مكونة من حبوب متجمعة، وملمسها زي قشر البرتقان.

          دي الـ **shagreen patch** (connective tissue nevus)، major criterion في الـ ==TSC==.
      - kind: figure
        page: 171
        quote: "Ash leaf marks"
        title: "Ash leaf marks"
        image: { file: neph/L07-ash-leaf.webp, book: true }
        alt: "Book photograph of the skin of both legs, separated by a dark blue cloth, with pale oval hypopigmented macules: ash leaf marks."
        caption: |
          رجلين جنب بعض وبينهم قماشة زرقا: على الجلد ==بقع فاتحة بيضاوي== أفتح من الجلد اللي حواليها.

          دي الـ **ash leaf marks** (hypomelanotic macules)، وأكتر من 3 = major criterion في الـ ==TSC==، وبتبان أوضح تحت الـ Wood's lamp.
      - kind: explain
        page: 171
        title: "الكلية: AML ثم cysts ثم RCC"
        quote: "Kidney involvement occurs frequently in TSC, with renal lesions that include angiomyolipomas (AMLs; 85%), cysts (30% to 47%), and renal cell carcinoma (RCC) (2% to 3%).24,28 Other renal neoplasms, interstitial fibrosis with focal segmental glomerulosclerosis (FSGS), glomerular microhamartomas, and peripelvic and perirenal lymphangiomatous cysts also have been reported. Renal involvement in TSC often pro-gresses insidiously, but can result in considerable morbidity, including retroperitoneal hemorrhage, renal impairment (~1%), and death. Renal complications are the most frequent cause of death in TSC.24"
        text: |
          - ==angiomyolipoma (AML) 85%==، **cysts 30–47%**، **renal cell carcinoma (RCC) 2–3%**.
          - ==Renal complications أشهر سبب وفاة في الـ TSC==: retroperitoneal hemorrhage و renal impairment.
          - الـ AML = **vessels سميكة + smooth muscle + دهون** (hamartoma). في الـ TSC: **multiple و bilateral**، نادرة قبل 5 سنين، و **80% عند 10 سنين**. الستات أكتر وأكبر، والـ **حمل** بيزوّد الـ rupture.
          - **Cysts + angiomyolipomas (AMLs) مع بعض على الـ computed tomography (CT)** = فكّر TSC.

          ليه الـ AML بينزف؟ التفسير المقبول (مش في الكتاب): الأوعية اللي فيه سميكة بس جدارها مش منظم ومفيهوش elastic كفاية، فبتعمل aneurysms صغيرة تفرقع، وكل ما الورم يكبر الخطر يزيد. وليه الحمل؟ لأن الحمل بيزوّد حجم الدم والـ hormones اللي بتكبّر الـ AML. وليه الدهون مهمة على الـ CT؟ لأن الدهون هي اللي بتفرّق الـ AML عن الـ RCC.
      - kind: mnemonic
        page: 171
        quote: "Kidney involvement occurs frequently in TSC, with renal lesions that include angiomyolipomas (AMLs; 85%), cysts (30% to 47%), and renal cell carcinoma (RCC) (2% to 3%).24,28 Other renal neoplasms, interstitial fibrosis with focal segmental glomerulosclerosis (FSGS), glomerular microhamartomas, and peripelvic and perirenal lymphangiomatous cysts also have been reported. Renal involvement in TSC often pro-gresses insidiously, but can result in considerable morbidity, including retroperitoneal hemorrhage, renal impairment (~1%), and death. Renal complications are the most frequent cause of death in TSC.24"
        word: "ACR"
        parts:
          - { key: "A", text: "AML 85% (bleeds)" }
          - { key: "C", text: "Cysts 30–47%" }
          - { key: "R", text: "RCC 2–3%" }
        hook: "**ACR** بالترتيب من الأشهر للأندر. والـ RCC في الـ TSC: ستات، أصغر سنًا، مع AML، multiple، و **بطيء** (papillary أشهر)."
      - kind: explain
        page: 172
        title: "ليه الـ AML بينزف؟"
        quote: "AMLs are benign renal hamartomas composed of abnormal, thick-walled vessels and varying amounts of smooth muscle-like cells and adipose tissue"
        text: |
          الـ AML بالتعريف من الكتاب: ==abnormal, thick-walled vessels== + smooth muscle + دهون. الأوعية الشاذة دي هي **السبب** في النزيف: جدارها مش طبيعي، ومع الكبر بتعمل micro و macro-aneurysms (هتشوفها في العلاج).

          والكتاب بيفرّق الـ TSC AML عن العادي:
          - **العادي**: solitary، غالبًا في ستات أكبر سنًا.
          - **الـ TSC**: ==multiple و bilateral==، نادر قبل 5 سنين، بيزيد عددًا وحجمًا مع السن، وممكن يبقى **locally invasive** للـ perirenal fat أو الـ renal vein وحتى الـ IVC والـ right atrium.

          والأعراض من **نزيف** (جوّه الورم أو retroperitoneal) أو **mass effect**: كتلة، ألم، ضغط، وتدهور الكلية. والستات أكتر وأكبر، و ==الحمل== بيزوّد الـ rupture (افتكر إن الهرمونات الأنثوية بتكبّره).
      - kind: reveal
        page: 172
        quote: "The concurrence of cysts and AMLs, easily detected by CT, is strongly suggestive of TSC."
        prompt: "إيه اللي يخليك تقول TSC على CT بطن، وإيه المميز في الأكياس بتاعته؟"
        answer: |
          الكتاب: ==cysts + AMLs مع بعض== على الـ CT بيشاور بقوة على الـ TSC.

          والأكياس في الـ TSC:
          - ممكن تطلع من **أي segment** في الـ nephron، ولما تبقى قليلة بتبقى **cortical**، وأحيانًا **glomerular cysts**.
          - بطانتها **unique**: خلايا كبيرة **acidophilic** بنوى كبيرة hyperchromatic وأحيانًا **mitoses**، ومعاها papillary hyperplasia و adenomas.

          التفسير المقبول (مش في الكتاب): البطانة دي شكلها "نشيط" لأن الخلايا فقدت الـ tumor suppressor، وده نفس السبب اللي بيخلي الـ adenomas شائعة.
      - kind: explain
        page: 173
        title: "الرضّع الشديدين والـ RCC"
        quote: "TSC-associated RCCs have a unique constellation of clinicopathologic features, including female predominance, younger age at diagnosis, association with AML, multiplicity, and slow progres-sion."
        text: |
          **الرضّع**: فيه subset صغير بييجي بـ **massive renal cysts** وضغط شديد و ESRD في العقد 2–3. أغلبهم ==PKDTS== (الـ deletion اللي شالت TSC2 و PKD1 في الرسمة). **يعني** الأكياس هنا من الـ PKD1 مش من الـ TSC بس.

          **الأورام**: الـ benign epithelial (papillary adenomas، oncocytomas) شائعة وممكن multifocal، بس الـ malignant نادر: **RCC 2–3%** على مدى العمر.

          الـ RCC في الـ TSC ليه شخصية خاصة: **ستات أكتر**، **سن أصغر**، **مع AML**، **multiple**، و ==slow progression==. أشهر شكل **papillary RCC**، بعده hybrid oncocytic/chromophobe، بعده granular eosinophilic.

          ليه الـ RCC في الـ TSC "شخصيته مختلفة"؟ التفسير المقبول (مش في الكتاب): الخلية فيها الـ second hit بتاع الـ TSC من الأول، فالـ mTOR شغال ومحضّر للورم بدري، علشان كده بيطلع في سن أصغر وفي أكتر من مكان. وبما إن الأورام دي بطيئة، المتابعة المنتظمة بتمسكها وهي صغيرة، وده اللي بيخلّي renal-sparing surgery ممكنة.
      - kind: check
        page: 171
        quote: "Renal complications are the most frequent cause of death in TSC."
        question: "What is the most frequent cause of death in tuberous sclerosis complex?"
        options:
          - "Renal complications"
          - "Seizures"
          - "Cardiac rhabdomyoma"
          - "Lung disease"
        answer: 0
        why:
          - "صح: الكتاب صريح: renal complications، زي الـ retroperitoneal hemorrhage والـ renal impairment."
          - "الـ seizures أشهر عرض، بس مش أشهر سبب وفاة."
          - "الـ rhabdomyoma major criterion، مش أشهر سبب وفاة."
          - "الـ interstitial lung disease من الصورة، بس الكلية هي الأولى."
      - kind: try
        items: [neph.L07.122, neph.L07.127, neph.L07.130, neph.L07.132, neph.L07.135]
    recap:
      - "TSC: AD tumor suppressor، hamartomas في الكلى والمخ والقلب والرئة والجلد. TSC1 (9q) و TSC2 (16p13 جنب PKD1)؛ deletion للاتنين = PKDTS."
