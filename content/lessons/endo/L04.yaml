        text: |
          - **Mild chronic renal failure (CRF)**: مفيش تغيير مهم.
          - **Moderate/advanced**: الـ carbohydrate (CHO) metabolism بيبوظ، والـ basal insulin بيعلى.

          الأنماط: normoglycaemia، **hypoglycaemia**، بطء نزول الجلوكوز بعد الـ load، fasting hyperglycaemia، و glucose intolerance.
