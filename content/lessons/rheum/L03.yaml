  - id: rheum.L03.lesson6
    title: "Type I: التشخيص والعلاج"
    hook: "RIST بيقولك فيه حساسية قد إيه، و RAST بيقولك من إيه. والعلاج بيقطع السلسلة في أي حلقة."
    minutes: 8
    pages: [59, 60]
    topics: [type1-tx]
    goals:
      - "تفرّق بين RIST و RAST والـ skin prick test، وتعرف DD الـ IgE العالي"
      - "تعرف كل علاج بيقطع السلسلة فين"
      - "تعرف الـ hyposensitization والـ omalizumab"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L03.055]
        page: 60
        quote: "The RAST(radioallergosorbent test) uses these purified allergens in a panel to screen serum samples from the pt and identify the allergen by binding to circulating IgE."
        title: "التشخيص: RIST ولا RAST؟"
        text: |
          - ==Radioimmunosorbent test (RIST)== (radioimmunosorbent): **total** Immunoglobulin E (IgE) في الدم. لو عالي من غير حساسية: فكّر في **helminths** و **Hodgkin's**.
          - ==Radioallergosorbent test (RAST)== (radioallergosorbent): panel من allergens متنقّية ← **يحدد الـ allergen نفسه**.
          - **Skin prick test**.

          الـ allergens بتتنقّى، واللي صعب يتنقّى بيتصنع بـ recombinant DNA.

          التفسير المقبول (مش في الكتاب): ليه الاتنين؟ الـ RIST بيقولك "فيه IgE كتير" بس مايقولكش ضد إيه، والـ helminths والـ Hodgkin بيرفعوه من غير حساسية. أما الـ RAST والـ skin prick بيحددوا الـ allergen، وده المهم عشان المريض يتجنبه أو ياخد immunotherapy ليه بالذات.
      - kind: aside
        tone: tip
        page: 59
        quote: "Allergy testing= identify allergen.\n  Blood sample for RIST (radioimmunosorbent test).\n  The serum of patient is analyzed for the presence of total circulating IgE antibodies.\n  DD: helminth worm infections, Hodgkins lymphoma."
        text: "افتكرها كده: في RAST حرف A = Allergen، يعني بيقولك الـ allergen مين. الـ RIST بيقولك الـ IgE كام بس."
      - kind: explain
        page: 59
        quote: "DD: helminth worm infections, Hodgkins lymphoma."
        title: "ليه الديدان والـ Hodgkin بيرفعوا الـ IgE؟"
        text: |
          الكتاب بيقول لو الـ total IgE عالي، الـ DD: **helminth worm infections** و **Hodgkin's lymphoma**.

          التفسير المقبول (مش في الكتاب):
          - **الديدان**: كبيرة جدًا على إن خلية تبلعها، فالجسم بيرد عليها بنفس سلاح الحساسية: ==Th2== ← IL-4 ← IgE، و IL-5 ← eosinophils (افتكر جدول صفحة 58: الـ eosinophil بيقتل الـ parasites).
          - **Hodgkin's**: الورم بيعمل بيئة Th2، فبيرفع الـ IgE.

          يعني الـ RIST بيقولك فيه **Th2 شغال** قد إيه، مش بيقولك السبب. لو عايز تعرف الـ allergen نفسه، محتاج RAST أو skin prick.
      - kind: sort
        page: 60
        quote: "Basic approaches: Minimizing contact with allergen.\n  Emollients."
        prompt: "حط كل علاج في مكانه:"
        bins: ["Block mediators / symptoms", "Change the immune response"]
        cards:
          - { text: "Antihistamines", bin: 0 }
          - { text: "Zileuton, montelukast", bin: 0 }
          - { text: "Bronchodilators, steroids, cromones", bin: 0 }
          - { text: "Hyposensitization", bin: 1 }
          - { text: "Omalizumab (anti-IgE)", bin: 1 }
          - { text: "Th2 to Th1 deviation (IL-12)", bin: 1 }
          - { text: "Anti-allergy vaccines, gene therapy", bin: 1 }
        why: "أساس العلاج: ابعد عن الـ allergen (و emollients للجلد). الـ hyposensitization = subcutaneous (SC) حقن allergen بجرعات بتزيد كل أسبوع أو شهر لسنين، والـ omalizumab بيمسك الـ IgE اللي في الدم."
      - kind: figure
        page: 60
        quote: "Interference with IgE/Fc-8 R1 signalling:omalizumab that selectively binds to circulating IgE."
        title: "كل علاج بيقطع السلسلة فين؟"
        alt: "A chain of five boxes left to right: allergen, Th2 and IgE, IgE on mast cell, mediators, symptoms. Under each box, the therapy that acts there: avoidance under allergen; hyposensitization and Th2 to Th1 deviation under Th2 and IgE; omalizumab under IgE on mast cell; antihistamines and leukotriene inhibitors under mediators; bronchodilators, steroids and cromones under symptoms."
