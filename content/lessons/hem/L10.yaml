  - id: hem.L10.lesson2
    title: "عيان الـ PV: دماغ تقيلة، هرش في الدُش، ووش أحمر"
    hook: "عشر علامات بتحكي قصة دم تقيل، وتلات مراحل بتحكي عمر المرض."
    minutes: 9
    pages: [158, 160]
    topics: [pv-clinical, pv-course]
    goals:
      - "تعدّ أعراض الـ hyperviscosity والتجلط"
      - "تشرح الـ pruritus والـ plethora والـ Gaisbock"
      - "ترتب الـ natural history وتعرف نسب الـ AML"
    status: unverified
    steps:
      - kind: explain
        page: 158
        title: "مين وإزاي؟"
        quote: "Clinical features\n  Incidence 2-3 per 100,000\n  Male to female ratio 0.8:1.2\n  Median age at onset 55-60y\n  Symptoms are often insidious in onset."
        text: |
          - Incidence **2–3 لكل 100,000**، و median age **55–60**.
          - الأعراض ==insidious==: بتيجي بالراحة.
      - kind: figure
        page: 158
        quote: "1. Symptoms due to blood hyperviscosity secondary to a marked increase in the cellular elements of blood, which impairs microcirculation, sludgging of blood flow, and thrombosis, poor oxygen delivery include\n  Headache,\n  Dizziness,\n  Vertigo,\n  Tinnitus,\n  Visual disturbances, angina pectoris, or\n  Intermittent claudication."
        title: "Hyperviscosity: الدم عامل زي العسل"
        alt: "Two capillaries side by side. Normal: red cells flowing in single file with plasma around them. PV: red cells packed and sludging, a thrombus forming, and an arrow showing reduced oxygen delivery to tissue. Labels list headache, dizziness, vertigo, tinnitus, visual disturbance, angina and claudication."
        caption: "كرات أكتر = لزوجة أكتر = **sludging** في الـ microcirculation و ==poor oxygen delivery==. علشان كده الأعراض في المخ والودن والعين والقلب والرجل."
        svg: |
          <svg viewBox="0 0 330 260" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="20" width="310" height="40" rx="20" class="fg-box"/>
            <circle cx="60" cy="40" r="9" class="fg-dot-bad"/>
            <circle cx="130" cy="40" r="9" class="fg-dot-bad"/>
            <circle cx="200" cy="40" r="9" class="fg-dot-bad"/>
            <circle cx="270" cy="40" r="9" class="fg-dot-bad"/>
            <text x="165" y="78" text-anchor="middle" class="t-sm t-mut">Normal: cells flow freely</text>
            <rect x="10" y="95" width="310" height="40" rx="20" class="fg-box"/>
            <circle cx="35" cy="115" r="9" class="fg-dot-bad"/>
            <circle cx="55" cy="112" r="9" class="fg-dot-bad"/>
            <circle cx="75" cy="118" r="9" class="fg-dot-bad"/>
            <circle cx="95" cy="112" r="9" class="fg-dot-bad"/>
            <circle cx="115" cy="118" r="9" class="fg-dot-bad"/>
            <circle cx="135" cy="112" r="9" class="fg-dot-bad"/>
            <circle cx="155" cy="118" r="9" class="fg-dot-bad"/>
            <circle cx="175" cy="112" r="9" class="fg-dot-bad"/>
            <rect x="195" y="99" width="40" height="32" rx="10" class="fg-ink"/>
            <text x="215" y="119" text-anchor="middle" class="t-sm t-b">clot</text>
            <text x="165" y="153" text-anchor="middle" class="t-sm t-mut">PV: sludging, thrombosis, less O2</text>
            <text x="20" y="185" class="t-sm">Headache · Dizziness · Vertigo</text>
            <text x="20" y="205" class="t-sm">Tinnitus · Visual disturbance</text>
            <text x="20" y="225" class="t-sm">Angina · Intermittent claudication</text>
          </svg>
      - kind: explain
        page: 158
        title: "تجلط أكتر من نزيف"
        quote: "3. Thrombotic complications\n  Serious esp in untreated patient\n  Arterial (MI, strokes, TIA, scotomata, mesentric artery occlusion, limb ischemia)\n  Venous thrombosis, splanchnic vessels, mesentreic, splenic, hepatoportal. Superficial thrombophlebitis, DVT, pulmonary embolism.\n  Microvascular occlusions affecting extremities (erythromelalgia) burning sensation of fingers and toes."
        text: |
          - **Bleeding** نادر (**1%**): epistaxis، gum bleeding، ecchymosis، gastrointestinal (GI).
          - **Thrombosis** خطير، خصوصًا من غير علاج:
          - **Arterial**: Myocardial infarction (MI)، stroke، transient ischaemic attack (TIA)، scotomata، mesenteric، limb ischemia.
          - **Venous**: splanchnic (mesenteric، splenic، hepatoportal)، thrombophlebitis، deep vein thrombosis (DVT)، PE.
          - **Microvascular**: ==erythromelalgia== = حرقان في صوابع الإيد والرجل.
      - kind: mnemonic
        page: 159
        quote: "Causes (of thrombosis in PV):\n  1. Increased PCV → increase viscosity, rheological abnormality of RBCs\n  2. Abnormal platelet-endothelial contact\n  3. Thrombocytosis\n  4. Pro-coagulant changes of the platelet\n  5. Pre-existing vascular disease"
        word: "VEPTP"
        parts:
          - { key: "V", text: "Viscosity: raised PCV and abnormal red blood cell (RBC) rheology" }
          - { key: "E", text: "Endothelium: abnormal platelet–endothelial contact" }
          - { key: "P", text: "Platelets too many: thrombocytosis" }
          - { key: "T", text: "Turned pro-coagulant platelets" }
          - { key: "P", text: "Pre-existing vascular disease" }
        hook: "خمس أسباب للتجلط في الـ PV: الدم **تقيل**، الصفائح **كتير** و**شرسة**، والوعاء **أصلًا تعبان**."
      - kind: explain
        page: 159
        title: "باقي العلامات"
        quote: "7. Pruritus is due to increased histamine levels released from increased basophils and mast cells and usually is exacerbated by a warm bath or shower and iron deficiency anemia. This occurs in up to 40% of patients."
        text: |
          - **Abdominal pain**: peptic ulcer من الـ histamine والـ acid العاليين، أو **Budd–Chiari**، أو portal/mesenteric thrombosis.
          - **Splenomegaly** (**75%**): early satiety، ونادرًا infarction. **Hepatomegaly** حوالي **30%**.
          - **Weight loss**: early satiety أو الـ clone الشغال.
          - ==Pruritus== (لحد **40%**): histamine من basophils و mast cells، بيزيد بعد **دُش دافي** ومع iron deficiency.
          - **Plethora**: وش و palms و nail beds و conjunctiva حمرا.
          - **Hypertension** شائع.
      - kind: reveal
        page: 159
        quote: "10. Hypertension commonly is found in patients with PV. The red cell mass should differentiate PV from Gaisbock syndrome, which is hypertension and pseudo-polycythemia (high hemoglobin levels due to low plasma volume)."
        prompt: "راجل عنده hypertension و Hb عالي. إزاي تفرق بين PV و Gaisbock syndrome؟"
        answer: |
          الـ ==Gaisbock syndrome== = **hypertension + pseudo-polycythemia**: الـ Hb عالي علشان **البلازما قليلة**.

          الفيصل: **red cell mass**. في الـ PV عالي، وفي الـ Gaisbock طبيعي.
      - kind: aside
        tone: joke
        page: 159
        quote: "7. Pruritus is due to increased histamine levels released from increased basophils and mast cells and usually is exacerbated by a warm bath or shower and iron deficiency anemia. This occurs in up to 40% of patients."
        text: "عيان الـ polycythaemia vera (PV) هو الوحيد اللي بيطلع من الدُش أوحش ما دخل: سخن، أحمر، وبيهرش (pruritus). لو حد قالك «بهرش بعد الحمّام» ووشه طماطم، اطلب **complete blood count (CBC)**."
      - kind: check
        page: 159
        quote: "7. Pruritus is due to increased histamine levels released from increased basophils and mast cells and usually is exacerbated by a warm bath or shower and iron deficiency anemia. This occurs in up to 40% of patients."
        question: "Plethoric man with splenomegaly and itching after hot showers. Cause of the itch?"
        options: ["Histamine from basophils and mast cells", "Cholestasis with bile salt retention", "Uremia from kidney involvement", "Iron overload from repeated venesection"]
        answer: 0
        why:
          - "صح: الـ basophils والـ mast cells الزيادة بتطلع histamine."
          - "مفيش jaundice أو Budd–Chiari."
          - "مفيش kidney failure."
          - "بالعكس، الـ iron deficiency هي اللي بتزوّد الهرش."
      - kind: figure
        page: 160
        quote: "Natural history of PV\n  PV present with proliferative phase when control of erythrocytosis and prevention of thrombosis is urgent priority.\n  Followed by stable phase of variable short duration, normal count maintained without treatment (decrease proliferative potential and early myelofibrosis).\n  Followed by an advanced or spent phase (extensive myelofibrosis, progressive hepato-slenomegaly and pancytopenia)10-15% after 10 years and >30% after 20 years , median survival <18 months"
        title: "عمر الـ PV في تلات مراحل"
        alt: "A timeline with three blocks. Proliferative phase: control erythrocytosis and prevent thrombosis. Stable phase: normal counts without treatment, early fibrosis. Spent phase: extensive myelofibrosis, hepatosplenomegaly, pancytopenia, in 10-15% at 10 years and over 30% at 20 years, median survival under 18 months."
        caption: "الـ ==spent phase== = post-PV myelofibrosis: **10–15%** بعد 10 سنين و **>30%** بعد 20، والـ survival بعدها **<18 شهر**."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L10a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fg-head"/></marker></defs>
            <rect x="10" y="10" width="310" height="56" rx="10" class="fg-bad"/>
            <text x="165" y="32" text-anchor="middle" class="t-b">1. Proliferative</text>
            <text x="165" y="52" text-anchor="middle" class="t-sm">control red cells, prevent thrombosis</text>
            <path d="M165 66 V84" class="fg-arrow" marker-end="url(#L10a)"/>
            <rect x="10" y="88" width="310" height="56" rx="10" class="fg-good"/>
            <text x="165" y="110" text-anchor="middle" class="t-b">2. Stable</text>
            <text x="165" y="130" text-anchor="middle" class="t-sm">normal counts without treatment</text>
            <path d="M165 144 V162" class="fg-arrow" marker-end="url(#L10a)"/>
            <rect x="10" y="166" width="310" height="76" rx="10" class="fg-acc"/>
            <text x="165" y="188" text-anchor="middle" class="t-b">3. Spent (myelofibrosis)</text>
            <text x="165" y="208" text-anchor="middle" class="t-sm">big liver and spleen, pancytopenia</text>
            <text x="165" y="228" text-anchor="middle" class="t-sm">10–15% at 10 y · &gt;30% at 20 y</text>
          </svg>
      - kind: explain
        page: 160
        title: "والـ AML؟ العلاج هو اللي بيفرق"
        quote: "Incidence of transformation to AML\n  Is estimated 1-3% in patients treated with venesection.\n  Increased to more than 10 folds when radioactive phosphorus (32P), chlorambucil or irradiation are used, median time 5-8 years."
        text: |
          - مع **venesection** بس: **1–3%**.
          - مع ==32P أو chlorambucil أو irradiation==: أكتر من **10 أضعاف**، بعد **5–8 سنين** في المتوسط.

          الدرس: العلاج نفسه ممكن يبقى leukemogenic، وده هيحكم اختيار الدوا بعدين.
      - kind: try
        items: [hem.L10.019, hem.L10.023, hem.L10.026, hem.L10.034, hem.L10.035]
    recap:
      - "Hyperviscosity: صداع، دوخة، vertigo، tinnitus، زغللة، angina، claudication."
      - "Thrombosis (arterial، venous، erythromelalgia) أخطر من الـ bleeding (1%). أسبابه: VEPTP."
      - "Pruritus بعد الدُش (histamine) 40%، splenomegaly 75%، hepatomegaly 30%، plethora، HTN."
      - "Gaisbock = HTN + pseudo-polycythemia؛ الـ red cell mass بيفرّق."
      - "Proliferative ← stable ← spent (10–15%/10 سنين). AML 1–3% مع venesection، ×10 مع 32P/chlorambucil/irradiation."
