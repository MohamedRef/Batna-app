          - "صح: ==clopidogrel و ticlopidine== = immune-mediated."
          - "Cyclosporine تحت non-immune mediated."
          - "Mitomycin C تحت non-immune mediated."
          - "Tacrolimus تحت non-immune mediated."
      - kind: explain
        page: 247
        title: "Case 6: قبل الـ biopsy"
        quote: "Tumour markers were done and were negative. 3 sessions of ultrafiltration were done after which sCr decreased to 5 mg/dL. Will you proceed for a biopsy?"
        text: |
          العيان جه بـ **nephrotic syndrome** و creatinine 5، **uACR 6000**. خد **I.V diuresis**، الـ edema راح بس الـ creatinine طلع 6.5. غاب شهر ورجع: creatinine 8، urea 300، **uACR 12000**، ==Hb 6==، **ESR 140/150**، و **SPEP**: albumin واطي و alpha-2 عالي شوية. اتعمل **tumour markers** (سلبي) و **3 sessions ultrafiltration**، والـ creatinine نزل لـ 5. والكتاب بيسأل: **will you proceed for a biopsy?**

          ليه الخطوات دي؟ التفسير المقبول (مش في الكتاب):
          - **Hb 6 و ESR 140 و البروتين الكتير** في عيان كبير بيخلّوك تفكّر في **myeloma** أو **amyloid** أو **malignancy**، علشان كده الـ SPEP والـ tumour markers قبل أي حاجة.
          - الـ **ultrafiltration** لأن الـ diuretics ما شالتش الميه وزوّدت الـ creatinine.
          - وليه biopsy لعيان سكر معروف؟ لأن البروتين **اتضاعف بسرعة** والـ creatinine بيجري، وده مش شكل الـ diabetic nephropathy العادي البطيء، فلازم تدوّر على مرض تاني فوقه.
      - kind: explain
        page: 248
        title: "Nodules: سكر ولا حاجة تانية؟"
        quote: "Examination revealed IgA: Negative, IgG: segmental GBM deposits in partially patent glomeruli, IgM: Negative, C3: segmental GBM deposits in partially patent glomeruli, Kappa: Negative Lambda: Negative."
        text: |
          الـ **LM**: 20 glomeruli، ==18 globally sclerosed==. الاتنين الـ patent فيهم diffuse moderate GBM thickening و **marked mesangial matrix increase with frequent hypocellular nodules**. الـ tubules: marked atrophy بـ thickened basement membranes. الـ interstitium: **fibrosis 90%**. الـ arterioles: **marked hyalinosis**. الـ **Congo red** سلبي. الـ **IH**: IgG و C3 **segmental GBM deposits**، و **kappa و lambda negative**.

          ليه الـ Congo red والـ kappa/lambda؟ التفسير المقبول (مش في الكتاب): الـ ==nodules== في الـ mesangium ليها 3 أسباب كبار: **diabetes**، **amyloid**، و **light chain deposition disease**. الـ Congo red السلبي بيشيل الـ amyloid، والـ kappa و lambda السلبيين بيشيلوا الـ light chain، فيفضل السكر. والـ nodules **hypocellular** مع **arteriolar hyalinosis** و GBM تخين ده شكل السكر الكلاسيكي. أما الـ IgG والـ C3 على الـ GBM فبيفتحوا سؤال: فيه **membranous** تحت السكر؟

          إزاي تختار الـ test اللي يفرّق؟ التفسير المقبول (مش في الكتاب): الـ nodule بالـ PAS: في السكر **PAS قوي** و منتظم، في الـ amyloid **PAS ضعيف** و Congo red موجب. الـ IF: في الـ light chain deposition تلاقي **kappa أو lambda لوحدها** linear على الغشا، في السكر IgG و albumin linear خفيف من غير monoclonal. فالـ Congo red والـ kappa/lambda هما اللي بيقفلوا الـ DD.
      - kind: explain
        page: 249
        title: "Case 6: السكر لما يوصل للآخر"
        quote: "‑ Advanced Diabetic Nodular Glomerulosclerosis with a Possible Underlying Membranous Glomerulonephritis. Confirmation of an underlying MGN is difficult due to the advanced glomerulosclerosis. ‑ Global Glomerulosclerosis (90%). ‑ Marked Interstitial Fibrosis and Tubular Atrophy (90%). ‑ Moderate Arteriosclerosis and Marked Arteriolar Hyalinosis."
        text: |
          راجل **42 سنة**، diabetes mellitus (DM) و HTN مش متظبطين 7 سنين، و **severe proliferative retinopathy**. جه بـ nephrotic، creatinine وصل 8، و urine albumin-to-creatinine ratio (uACR) 12000.

          قبل الـ biopsy: **serum protein electrophoresis (SPEP)** و **tumour markers** سلبيين، و 3 sessions ultrafiltration.

          الـ biopsy: 18 من 20 glomeruli sclerosed، ==hypocellular mesangial nodules==، و IgG و C3 segmental على الـ glomerular basement membrane (GBM). التشخيص: **advanced diabetic nodular glomerulosclerosis** مع **possible membranous** تحتيه، صعب يتأكد علشان الـ sclerosis 90%.

          ليه عملوا SPEP و tumour markers قبل الـ biopsy؟ التفسير المقبول (مش في الكتاب): الـ nodules ممكن تكون سكر، أو **light chain deposition**، أو amyloid، فلازم تستبعد الـ monoclonal protein. والـ retinopathy الشديدة مع سكر قديم بترجّح السكر، **لأن** الأوعية الصغيرة في العين والكلية بتتضرب سوا.
          وليه الكتاب قال «possible» membranous؟ لأن الـ IgG و C3 segmental ممكن يكونوا **trapping** في glomerulus مليان ندبة، مش deposits حقيقية. ومع **90% sclerosis**، مفيش glomeruli كفاية تثبت. النتيجة العملية: الكلية دي وصلت لآخرها، ومهما كان التشخيص التاني، الـ IS مش هيرجّعها.
      - kind: check
        page: 248
        quote: "Congo red: Examination of congo red stained sections viewed under polarized light revealed no amyloid deposits."
        question: "Case 6 has mesangial nodules. Congo red is negative and kappa and lambda are negative. What is left as the cause of the nodules?"
        options:
          - "Diabetic nodular glomerulosclerosis"
          - "Amyloidosis"
          - "Light chain deposition disease"
          - "Fibrillary GN"
        answer: 0
        why:
          - "صح: بعد ما الـ Congo red والـ light chains طلعوا سلبي، والـ nodules hypocellular مع hyalinosis في عيان سكر: ده diabetic."
          - "الـ Congo red السلبي بيشيل الـ amyloid."
          - "الـ kappa و lambda السلبيين بيشيلوا الـ light chain deposition (التفسير المقبول)."
          - "الـ fibrillary مش هو الصورة هنا، والتشخيص النهائي diabetic."
      - kind: try
        items: [neph.L08.121, neph.L08.124, neph.L08.126, neph.L08.129, neph.L08.131]
