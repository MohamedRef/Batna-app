        quote: "Figure 5: Peritoneal dialysis during pregnancy"
        title: "شكل 5 في الكتاب: الـ PD أثناء الحمل"
        image: { file: neph/L11-pd-pregnancy.webp, book: true }
        caption: "**Peritoneal Dialysis Prescription During Pregnancy**: ست حامل جنب كيس **1.5% dextrose**، وجنبها 5 صفوف، كل صف أيقونة وتعديل:\n\n1. **Intensify manual PD** بـ ==reduced dwell volume== و multiple exchanges.\n2. **Automated PD** بـ small volumes والـ cycler يزوّد الـ exchanges.\n3. ==Tidal PD==: الأيقونة بتوري **15%** من الحجم بيفضل جوه وقت الـ drain.\n4. **Caution with very high tonicity** dialysate (الكيس المكتوب عليه **4.25% Dextrose** وعلامة استفهام).\n5. **Lateral decubitus posture** وقت الـ draining.\n\nكلهم بيقولوا نفس الحاجة: الرحم الكبير مش مستحمل بطن مليانة مية، فـ ==حجم أقل ومرات أكتر==، وده اللي الـ mnemonic والشرح اللي فاتوا فصّلوه."
        alt: "Book infographic, Figure 5, 'Peritoneal Dialysis Prescription During Pregnancy': a pregnant woman beside a 1.5% dextrose bag, and five rows: intensify manual peritoneal dialysis with reduced dwell volume and multiple exchanges; automated peritoneal dialysis with small volumes and augmented exchanges with a cycler; tidal peritoneal dialysis with 15% of the infused volume retained during drain; caution with very high tonicity dialysate (4.25% dextrose); lateral decubitus posture during draining."
