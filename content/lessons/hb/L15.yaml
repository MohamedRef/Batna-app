      - kind: explain
        page: 279
        title: "Amylase: مفيدة بس كدّابة أحيانًا"
        text: |
          **Serum amylase**: أول تحليل بييجي في بالك، بس ليه عيبين: بتختفي بسرعة، ومش خاصة بالبنكرياس.
          - التوقيت: بتطلع خلال ~4 h وترجع normal في 3–5 days. يعني المريض اللي استحمل الوجع 4 أيام في البيت ممكن ييجي بـ amylase نضيفة.
          - **On admission**: ممكن تبقى normal في 20% من المرضى.
          - **Cut-off**: أكتر من 3 × ULN.

          **Normal مع إن فيه AP** في 3 حالات:
          - Alcohol-induced.
          - Hypertriglyceridemia.
          - Acute on chronic pancreatitis.

          عالية من غير AP (non-specific)، لأن الـ amylase مش من البنكرياس بس:
          - مصدر تاني أو إخراج قليل: macro-amylasaemia, low eGFR, salivary gland disease.
          - بطن حادة تانية: appendicitis, cholecystitis, intestinal obstruction or ischemia, peptic ulcer, gynecological diseases.
      - kind: reveal
        page: 279
        prompt: "ليه الـ amylase ممكن تطلع **normal** في الـ hypertriglyceridemia وفي الـ acute on chronic؟"
        answer: |
          الكتاب بيعدّهم بس، والتفسير المقبول:

          - **Hypertriglyceridemia:** الدم **lipemic** (لبني)، والدهون بتشوّش على الـ assay، فالرقم يطلع أقل من الحقيقة.
          - **Acute on chronic** (وكتير من الـ alcoholic): الغدة محروقة من زمان ومفيهاش إنزيمات كتير تطلّعها.

          الدرس: الـ amylase الـ normal مش بتنفي AP.
      - kind: explain
        page: 280
        title: "Lipase، والتحاليل اللي بتتنبأ فعلًا"
        text: |
          **Serum lipase**: بتحل العيبين بتوع الـ amylase.
          - **More specific**: مصدرها البنكرياس أساسًا.
          - **Remains elevated longer**: فبتلقط المريض اللي جه متأخر.
          - بس ممكن تعلى غلط في: macro-lipasemia، renal disease، appendicitis، cholecystitis، والـ diabetics (الـ median عندهم أعلى).

          قاعدة مهمة: neither amylase nor lipase ليهم أي دور في الـ **prognosis, severity or follow up**. الإنزيم بيقولك "فيه حريقة"، مش "الحريقة قد إيه".

          **لو مفيش gall stones ولا alcohol**، دوّر على السبب:
          - **Triglycerides و calcium**: دول أول حاجة.
          - **Genetic testing** (PRSS1, SPINK1, CTRC, CASR, CFTR): ممكن في المريض الأصغر من 30 سنة، لو مفيش سبب **وفيه family history** (توصية weak). الجينات دي هتشوفها تاني في الـ chronic pancreatitis.
      - kind: aside
        tone: trap
        page: 280
        text: |
          الـ lipase 10 أضعاف مش معناها pancreatitis أخطر من lipase 4 أضعاف. الرقم بيقولك **"فيه pancreatitis"** وبس. لو حد سألك تتابع الحالة بإيه، **متقولش amylase**.
