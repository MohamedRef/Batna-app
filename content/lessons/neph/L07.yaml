      - kind: check
        page: 146
        quote: "body. Pkd-1 mutations are seven times more com-mon than pkd-2 and associated with more aggressive disease (onset of esrd, on average, 15 years earlier). Mutations in a third gene, ganab, have been identified in families with mild polycystic kidney and more variable polycystic liver disease."
        question: "Compared with PKD2 mutations, PKD1 mutations are:"
        options:
          - "Commoner and reaches ESRD about 15 years earlier"
          - "Rarer and milder"
          - "Commoner but milder"
          - "Linked to chromosome 4"
        answer: 0
        why:
          - "صح: 7 أضعاف و end-stage renal disease (ESRD) بدري بـ 15 سنة."
          - "العكس بالظبط."
          - "أشهر، بس أوحش مش أخف."
          - "الـ PKD2 هو اللي على chromosome 4."
      - kind: explain
        page: 147
        title: "الكلية بتشتكي إزاي؟"
        quote: "Flank or loin pain arising from large cysts. Acute pain may suggest cyst rupture or bleeding."
        text: |
          - **Flank/loin pain** من الأكياس الكبيرة؛ الألم المفاجئ = **rupture أو bleeding**.
          - **Hematuria** (dipstick ± frank).
          - ==Hypertension==: **أشهر manifestation** وأهم سبب للـ progression.
          - **Nocturia و polyuria**: الكلية فقدت قدرة التركيز.
          - **Proteinuria خفيفة** (أقل من 1 g/day).

          حجم الكلية بيكبر مع السن في **100%**، و CRISP لقى إنه بيكبر **5.3% في السنة**، والـ **total kidney volume** أقوى predictor للتدهور.
      - kind: explain
        page: 148
        title: "الـ ESRD: مش قدر"
        quote: "End-Stage Renal Disease In most patients, renal function is maintained within the normal range, despite relentless growth of cysts, until the fourth to sixth decade of life. By the time renal function starts declining, the kidneys usually are greatly enlarged and distorted with little recognizable parenchyma on imaging studies. At this stage, the average rate of GFR decline is 4.4 to 5.9 ml/min per year. Nevertheless, ESRD is not inevitable in ADPKD."
        text: |
          الكلية بتفضل شغالة لحد **العقد الرابع–السادس**، وبعدين الـ glomerular filtration rate (GFR) ينزل **4.4–5.9 mL/min في السنة**. بس ==ESRD مش حتمي==: **77%** كويسين عند 50 سنة و **52%** عند 73.

          **Risk factors** للـ renal failure: **ذكر**، Black race، تشخيص أو أول hematuria **قبل 30**، hypertension **قبل 35**، hyperlipidemia و high-density lipoprotein (HDL) واطي، sickle cell trait، و **polycystin-1 gene (PKD1) truncating**.
      - kind: explain
        page: 149
        title: "الـ hematuria والـ cyst hemorrhage"
        quote: "Hematuria and Cyst Hemorrhage Visible hematuria may be the initial presenting symptom and occurs in up to 40% of patients with ADPKD over the course of the disease. Many have recurrent episodes. Differential diagnosis includes cyst hem-orrhage, stone, infection, and tumor. Cyst hemorrhage is a frequent complication and produces gross hematuria when the cyst communicates with the collecting system. Frequently, the cyst does not communicate with the collecting system, and flank pain without hematuria occurs. It can manifest with fever, raising the possibility of cyst infection. On occasion, a hemorrhagic cyst will rupture, resulting in a retroperitoneal bleed that can be significant, potentially requiring transfusion. In most patients, cyst hemorrhage is self-limited, resolving within 2 to 7 days. If symptoms of hematuria or flank pain last longer than 1 week or if the initial episode of hematuria occurs after age 50 years, neoplasm should be excluded."
        text: |
          الـ **visible hematuria** بتحصل في لحد **40%**. الـ differential diagnosis (DD): ==cyst hemorrhage، stone، infection، tumor==.

          الـ cyst hemorrhage يعمل hematuria **بس لو الكيس متصل بالـ collecting system**؛ غير كده يبقى **flank pain بس** (وأحيانًا حرارة، فتلتبس بالـ infection). أغلبه بيخلص في **2–7 أيام**.

          ⚠ لو استمر **أكتر من أسبوع** أو أول hematuria **بعد 50**: استبعد **neoplasm**.
      - kind: explain
        page: 150
        title: "الـ UTI والـ stones"
        quote: "Nephrolithiasis Renal stone disease occurs in about 20% of patients with ADPKD. Most stones are composed of uric acid, calcium oxalate, or both. Uric acid stones are more common in ADPKD than in stone formers without tubular ectasia, found in 15% of patients with ADPKD. CT urography has replaced IV urography in many centers; it is more sensitive in detect-ing small or radiolucent stones and for differentiating stones from tumor, clot, and cyst wall or parenchymal calcification. Dual-energy CT is increasingly used to distinguish between calcium and uric acid stones."
        text: |
          **urinary tract infection (UTI)**: شائعة بس ممكن تتقدّر بزيادة لأن الـ **sterile pyuria** شائع. الميكروبات: **E. coli، Klebsiella، Proteus**. الطريق **retrograde من المثانة**، علشان كده عالج الـ cystitis بسرعة.

          **Stones** في حوالي ==20%==: أغلبها **uric acid** أو calcium oxalate. الأحسن **computed tomography (CT) urography** (أحسن للـ radiolucent)، والـ **dual-energy CT** يفرّق الـ calcium من الـ uric acid.
      - kind: check
        page: 149
        quote: "Hematuria and Cyst Hemorrhage Visible hematuria may be the initial presenting symptom and occurs in up to 40% of patients with ADPKD over the course of the disease. Many have recurrent episodes. Differential diagnosis includes cyst hem-orrhage, stone, infection, and tumor. Cyst hemorrhage is a frequent complication and produces gross hematuria when the cyst communicates with the collecting system. Frequently, the cyst does not communicate with the collecting system, and flank pain without hematuria occurs. It can manifest with fever, raising the possibility of cyst infection. On occasion, a hemorrhagic cyst will rupture, resulting in a retroperitoneal bleed that can be significant, potentially requiring transfusion. In most patients, cyst hemorrhage is self-limited, resolving within 2 to 7 days. If symptoms of hematuria or flank pain last longer than 1 week or if the initial episode of hematuria occurs after age 50 years, neoplasm should be excluded."
        question: "ADPKD patient, 35 years, flank pain with fever and no hematuria. Which is NOT on the list to consider?"
        options:
          - "Medullary sponge kidney"
          - "Cyst hemorrhage"
          - "Cyst infection"
          - "Stone"
        answer: 0
        why:
          - "صح: ده مرض تاني خالص، مش مضاعفة من مضاعفات الـ ADPKD."
          - "الكيس اللي مش متصل بالـ collecting system بيعمل ألم من غير hematuria، وممكن حرارة."
          - "الحرارة تخليك تفكر في الـ infection."
          - "الـ stones في 20%."
