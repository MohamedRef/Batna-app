  - id: endo.L04.lesson1
    title: "القلب كغدة: هرمونات القلب والأوعية والـ oestrogen"
    hook: "القلب مش بس طرمبة. ده بيفرز هرمونات بتتحكم في الضغط والكلية، والـ oestrogen بيحميه من ناحية ويأذيه من ناحية."
    minutes: 8
    pages: [43, 44]
    topics: [cv-hormones, oestrogen]
    goals:
      - "تعدّ عائلات الـ cardiovascular hormones التلاتة ومصدر كل واحد"
      - "تعرف مين بيرفع الضغط ومين بيوقّعه، وليه"
      - "تفرّق بين تأثير الـ oestrogen الحامي والتأثير العكسي على الـ CVS"
    status: unverified
    steps:
      - kind: explain
        page: 43
        quote: "Although the heart had long been considered merely a muscular pump that performed the physical labor of the circulation, it has been recognized three families of cardiovascular hormones have proven to be potent regulators of cardiovascular and renal function."
        title: "القلب بيفرز هرمونات"
        text: |
          زمان كانوا فاكرين القلب مجرد ==muscular pump== بيعمل الشغل البدني بتاع الدورة الدموية. دلوقتي معروف إن فيه **three families of cardiovascular hormones** بتنظّم الـ cardiovascular و الـ renal function بقوة.

          وبتشتغل يا إما **endocrine** حقيقي (بتمشي في الدم لعضو بعيد)، يا إما **autocrine/paracrine** (بتأثر على نفس الخلية أو اللي جنبها). يعني الهرمون ممكن يتعمل في القلب ويشتغل في الكلية، أو يتعمل في الـ endothelium ويشتغل على العضلة اللي تحته على طول.

          ليه ده مهم في الامتحان؟ لأن أول سؤال في آخر المحاضرة (ص 76) هو «short notes about the types of cardiovascular hormones & its functions». فاحفظ العائلات التلاتة ومصدر كل واحدة ووظيفتها.
      - kind: figure
        remind: [endo.L04.006, endo.L04.003]
        page: 43
        quote: "Cardiovascular Hormones\n  Natriuretic peptides\n  Adrenomedullin\n  Endothelins + Nitric oxide (NO)"
        title: "شجرة الهرمونات"
        alt: "Tree diagram. Cardiovascular hormones branch into natriuretic peptides, endothelins with nitric oxide, and adrenomedullin. Natriuretic peptides split into ANP and BNP, secreted by the heart, and C-type natriuretic peptide, secreted by the endothelium. Endothelins split into ET-1, ET-2 and ET-3."
        caption: "الـ atrial natriuretic peptide (ANP) والـ brain natriuretic peptide (BNP) من القلب، والـ C-type natriuretic peptide (CNP) والـ endothelins والـ nitric oxide (NO) من الـ endothelium."
