        caption: |
          التفسير المقبول (مش في الكتاب): الصورة منظار في نزيف حاد، المريء كله ==أحمر من الدم==، والسهم الأبيض في النص تحت بيشاور على نقطة صغيرة فاتحة على الدالية: المكان اللي الدم طالع منه واللي هيتربط.

          الكتاب ما كتبش شرح تحتها، بس هي جنب الجملة دي بالظبط: الرباط في أول 12 ساعة بعد ما المريض يستقر، وبيوقف النزيف في 90%. يعني حتى في الدم ده المنظار بيدوّر على النقطة وبيربطها.
