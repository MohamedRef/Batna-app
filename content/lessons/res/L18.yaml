        question: "All are TRUE for the regression line EXCEPT:"
        options: ["It gives an idea about the strength of correlation", "It represents the best fit of dots in the scatter plot", "It predicts the dependent variable when the independent is known", "In positive correlation it runs upward and forward"]
        answer: 0
        why:
