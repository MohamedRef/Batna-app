            <rect x="172" y="168" width="150" height="40" rx="6" class="fg-bad"/>
            <text x="247" y="185" text-anchor="middle" class="t-sm t-b">INCPH</text>
            <text x="247" y="201" text-anchor="middle" class="t-sm">no cirrhosis</text>
            <rect x="172" y="234" width="150" height="40" rx="6" class="fg-bad"/>
            <text x="247" y="251" text-anchor="middle" class="t-sm t-b">SOS</text>
            <text x="247" y="267" text-anchor="middle" class="t-sm">(ex-VOD)</text>
            <path d="M178 304h-6v98h6" class="fg-ink"/>
            <rect x="182" y="330" width="140" height="44" rx="6" class="fg-bad"/>
            <text x="252" y="349" text-anchor="middle" class="t-sm t-b">Budd-Chiari</text>
            <text x="252" y="365" text-anchor="middle" class="t-sm">venules → IVC entry</text>
            <text x="165" y="498" text-anchor="middle" class="t-sm t-mut">+ hepatic vascular malformations (5th topic)</text>
          </svg>
      - kind: check
        page: 67
        quote: "Budd–Chiari syndrome. Acute portal vein thrombosis. Extrahepatic portal vien obstruction. Idiopathic non-cirrhotic portal hypertension. Hepatic vascular malformations. Sinusoidal obstruction syndrome."
        question: "Which of these is **not** one of the six vascular liver disorders in the lecture?"
        options:
          - "Portal hypertensive gastropathy"
          - "Sinusoidal obstruction syndrome"
          - "Hepatic vascular malformations"
          - "Idiopathic non-cirrhotic portal hypertension"
        answer: 0
        why:
          - "صح: دي نتيجة للـ portal hypertension في المعدة، مش vascular liver disorder."
          - "موجود: رقم 6 في الـ topics (الاسم القديم VOD)."
          - "موجود: رقم 5 في الـ topics."
          - "موجود: رقم 4 في الـ topics."
      - kind: explain
        page: 67
        quote: "Uncommon pro-thrombotic disorders: Myeloproliferative neoplasms are the leading cause. Thrombophilia. Other local and systemic factors."
        title: "طب ليه الدم بيتجلط هنا؟"
        text: |
          الـ BCS والـ PVT وراهم غالبًا **prothrombotic disorder** مش شائع. الكتاب بيرتبهم كده:

          - ==Myeloproliferative neoplasms (MPNs)==: الـ leading cause، وبتدوّر عليه بـ ==JAK2 V617F==.
          - **Thrombophilia**: inherited أو acquired.
          - **Other local and systemic factors**: زي التهاب أو ورم في البطن، أو OCPs وpregnancy.

          يعني لو عندك شاب جاي بـ Budd-Chiari، أول سؤال في دماغك: فين الـ MPN؟
      - kind: figure
        page: 67
        quote: "Thrombophilia: Inherited, Acquired. Myeloproliferative neoplasm: JAK2V617F positive. Hormonal factors: Oral contraceptives, Pregnancy. PNH. Other systemic factors. Local factors."
        title: "Virchow: كل risk factor في ضلع"
        alt: "A triangle with three corners. Top: hypercoagulability, with MPN (JAK2), thrombophilia, APS, PNH, OCPs and pregnancy. Bottom left: stasis, with cirrhosis and other intrahepatic block. Bottom right: vessel wall injury, with surgery or trauma to splanchnic veins and abdominal inflammation or cancer."
        caption: "الكتاب مابيذكرش الـ ==Virchow triad== بالاسم، بس كل risk factor في جدوله بيقع في ضلع من التلاتة. لو نسيت عنصر في الامتحان، لفّ على الأضلاع."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <path d="M165 126L80 210L250 210Z" class="fg-thin"/>
            <text x="165" y="190" text-anchor="middle" class="t-sm t-b t-mut">Virchow</text>
            <rect x="55" y="8" width="220" height="114" rx="7" class="fg-bad"/>
            <text x="165" y="30" text-anchor="middle" class="t-b">Hypercoagulability</text>
            <text x="165" y="50" text-anchor="middle" class="t-sm">MPN (JAK2 V617F): leading cause</text>
            <text x="165" y="68" text-anchor="middle" class="t-sm">Thrombophilia, APS, PNH</text>
            <text x="165" y="86" text-anchor="middle" class="t-sm">OCPs, pregnancy</text>
            <text x="165" y="106" text-anchor="middle" class="t-sm t-mut">Behcet, IBD, celiac</text>
            <rect x="5" y="215" width="155" height="100" rx="7" class="fg-acc"/>
            <text x="82" y="238" text-anchor="middle" class="t-b">Stasis</text>
            <text x="82" y="260" text-anchor="middle" class="t-sm">Cirrhosis</text>
            <text x="82" y="278" text-anchor="middle" class="t-sm">Other intrahepatic</text>
            <text x="82" y="296" text-anchor="middle" class="t-sm">block</text>
            <rect x="170" y="215" width="155" height="100" rx="7" class="fg-acc"/>
            <text x="247" y="238" text-anchor="middle" class="t-b">Vessel wall</text>
            <text x="247" y="260" text-anchor="middle" class="t-sm">Surgery, trauma</text>
            <text x="247" y="278" text-anchor="middle" class="t-sm">Abdominal</text>
            <text x="247" y="296" text-anchor="middle" class="t-sm">inflammation, cancer</text>
          </svg>
      - kind: reveal
        page: 68
        quote: "Myeloproliferative disease, generally V617F-JAK2 mutation-positive Usual peripheral blood features can be masked by portal hypertension."
        prompt: "الـ MPN بيرفع الـ counts (RBCs وplatelets). طب ليه ممكن تلاقي الـ CBC طبيعي في عيان PVT عنده MPN؟"
        answer: |
          الكتاب: الـ **usual peripheral blood features can be masked by portal hypertension**.

          المنطق: الـ portal hypertension بيعمل ==hypersplenism==، والطحال الكبير بيحجز ويكسّر الخلايا، فالـ counts العالية بتنزل وتبان «طبيعية». علشان كده ماتعتمدش على الـ **CBC**: اطلب **JAK2 V617F**.
      - kind: mnemonic
        page: 67
        quote: "Thrombophilia: Inherited, Acquired. Myeloproliferative neoplasm: JAK2V617F positive. Hormonal factors: Oral contraceptives, Pregnancy. PNH. Other systemic factors. Local factors."
        word: "HTML PS"
        parts:
          - { key: "H", text: "Hormonal: oral contraceptives, pregnancy" }
          - { key: "T", text: "Thrombophilia: inherited or acquired" }
          - { key: "M", text: "Myeloproliferative neoplasm (JAK2 V617F): the leading cause" }
          - { key: "L", text: "Local factors: abdominal inflammation or cancer, splanchnic vein injury, stasis" }
          - { key: "P", text: "PNH (paroxysmal nocturnal hemoglobinuria)" }
          - { key: "S", text: "Other Systemic factors (Behcet, IBD, celiac, sarcoidosis...)" }
        hook: |
          الجلطة دي مكتوبة بـ **HTML**، وفي آخر الإيميل **PS**: «ماتنساش الـ PNH والـ systemic». دي الـ 6 مجموعات بتوع **risk factors table** في صفحة 67.
      - kind: explain
        page: 68
        quote: "Acquired diseases: Myeloproliferative disease, Antiphospholipid syndrome, Paroxysmal nocturnal hemoglobinuria, Behcet's disease, Inflammatory bowel disease, Celiac disease, Sarcoidosis"
        title: "مين مع مين؟"
        text: |
          **Acquired diseases (p68):**

          - **MPN**: غالبًا JAK2 V617F positive.
          - **Antiphospholipid syndrome (APS)**.
          - **PNH** و**Behcet** و**celiac disease**: الكتاب كاتب جنبهم «for Budd-Chiari».
          - **IBD** و**sarcoidosis**.

          **Inherited disorders (p68):**

          - **Protein C** و**protein S** و**antithrombin deficiency**.
          - **Factor V Leiden**.
          - **Prothrombin (factor II) G20210A mutation**.

          **Other risk factors (p69):**

          - **Local**: inflammatory أو malignant foci في البطن (للـ PVT)، و**injury to splanchnic veins** من surgery أو trauma.
          - **Stasis**: من الـ cirrhosis أو أي intrahepatic block.
          - **Hyperhomocysteinemia** و**OCPs** و**pregnancy** (للـ BCS)، وكمان **extreme poverty**.
      - kind: sort
        page: 69
        quote: "Inflammatory or malignant foci in the abdomen (for portal vein thrombosis) … Pregnancy (for Budd-Chiari syndrome)"
        prompt: "الكتاب بيقول إن فيه أمراض مرتبطة بالـ **BCS** بالذات. حط كل واحد في مكانه:"
        bins: ["Marked for BCS", "Not marked for BCS"]
        cards:
          - { text: "PNH", bin: 0 }
          - { text: "Behcet's disease", bin: 0 }
          - { text: "Celiac disease", bin: 0 }
          - { text: "Pregnancy", bin: 0 }
          - { text: "Inflammatory or malignant abdominal foci", bin: 1 }
          - { text: "Antiphospholipid syndrome", bin: 1 }
        why: "الكتاب كاتب جنب PNH وBehcet وceliac (p68) وpregnancy (p69) «(for Budd-Chiari syndrome)». الـ abdominal foci مكتوب جنبها «for portal vein thrombosis»، والـ APS عام للاتنين."
      - kind: aside
        tone: trap
        page: 68
        quote: "Non specific anticardiolipin antibodies frequent in liver disease."
        text: |
          فخ الكبد العيّان: الـ **protein C** و**protein S** و**antithrombin** بيتعملوا في الكبد. لو الكبد تعبان هيطلعوا واطيين حتى لو مفيش inherited deficiency. الكتاب بيقول إن الـ ==secondary deficiency== ممكن تبقى صعب تستبعدها. ونفس الكلام للـ **hyperhomocysteinemia**.

          وكمان الـ **anticardiolipin antibodies** غير الـ specific شائعة في أمراض الكبد، فإيجابيتها لوحدها مش دليل.
      - kind: explain
        page: 69
        quote: "Thrombophilia screening should include protein S, protein C and antithrombin levels, FVL mutation, prothrombin gene variant and antiphospholipid antibodies (APAs)."
        title: "الـ work-up بالترتيب"
        text: |
          - دوّر على **local** و **systemic** prothrombotic factors في كل BCS وPVT.
          - لقيت سبب؟ كمّل دوّر. وجود risk factor واحد مايمنعش إنك تدوّر على تاني.
          - الـ MPN: **JAK2 V617F**.
          - الـ local: intra-abdominal inflammation وmalignancy.
          - الـ ==thrombophilia screen==: protein S، protein C، antithrombin levels، **FVL mutation**، **prothrombin gene variant**، و**antiphospholipid antibodies (APAs)**.
          - لو الـ APA طلعت positive: كررها بعد 12 أسبوع.
      - kind: aside
        tone: joke
        page: 69
        quote: "Identification of one risk factor should not defer from looking for additional risk factors."
        text: |
          البنت اللي جاية بـ Budd-Chiari وبتاخد OCPs... الـ resident الكسلان يقول «خلاص لقيناها، الحبوب!» ويقفل الملف. 😄

          الكتاب بيقولك لأ: **one risk factor should not defer from looking for additional risk factors**. ممكن يكون ورا الحبوب MPN مستخبي.
      - kind: check
        page: 69
        quote: "In case of APA positivity, this should be repeated after 12 weeks"
        question: "A patient with PVT has a positive antiphospholipid antibody test. What does the lecture recommend?"
        options:
          - "Repeat the test after 12 weeks"
          - "Diagnose antiphospholipid syndrome now"
          - "Ignore it, it is always false in liver disease"
          - "Stop looking for other risk factors"
        answer: 0
        why:
          - "صح: الكتاب: **in case of APA positivity, this should be repeated after 12 weeks**."
          - "إيجابية واحدة مش كفاية، لازم تتأكد بالتكرار."
          - "الكتاب بيقول الـ anticardiolipin غير الـ specific **frequent**، مش دايمًا غلط. علشان كده بنكرر، مش بنتجاهل."
          - "عكس الكتاب: risk factor واحد مايوقفش البحث."
      - kind: try
        items: [hb.L04.007, hb.L04.017, hb.L04.013, hb.L04.004]
    recap:
      - "الـ VLDs نادرة (< 5/10,000)، بتعمل **non-cirrhotic portal hypertension**، وعيانينها شباب."
      - "كل مرض = سدّة في حتة: portal vein (PVT/EHPVO)، venules (INCPH)، sinusoids (SOS)، hepatic veins → IVC (BCS)."
      - "Risk factors = **HTML PS**، والـ **MPN** هو الـ leading cause: اطلب **JAK2 V617F** لأن الـ CBC ممكن يتغطى بالـ hypersplenism."
      - "Protein C/S/AT وhomocysteine ممكن يتغيروا من الكبد نفسه. الـ APA الإيجابية تتكرر بعد 12 أسبوع."
      - "لقيت سبب؟ كمّل دوّر."
    practice: [hb.L04.001, hb.L04.002, hb.L04.003, hb.L04.004, hb.L04.005, hb.L04.006, hb.L04.007, hb.L04.008, hb.L04.009, hb.L04.010, hb.L04.011, hb.L04.012, hb.L04.013, hb.L04.014, hb.L04.015, hb.L04.016, hb.L04.017, hb.L04.018, hb.L04.129, hb.L04.134, hb.L04.135]

  # ------------------------------------------------------------------
  - id: hb.L04.lesson2
    title: "Budd-Chiari: الكبد اللي مش عارف يفضّي"
    hook: "دم داخل ومش لاقي يخرج: هتفهم الـ triad، ليه الـ hepatojugular reflux سالب، وسلّم العلاج درجة درجة."
    minutes: 9
    pages: [69, 74]
    topics: [budd-chiari]
    goals:
      - "تعرّف الـ BCS بحدوده من الـ venules للـ right atrium"
      - "تشرح الـ triad والـ negative hepatojugular reflux من الـ physiology"
      - "تكتب الـ stepwise management بالترتيب وبالأرقام"
    status: unverified
    steps:
      - kind: explain
        page: 69
        title: "التعريف"
        quote: "obstruction of hepatic venous outflow that can be located from the small hepatic venules up to the entrance of the IVC into the right atrium"
        text: |
          الـ **Budd-Chiari syndrome** هو أي ==obstruction of hepatic venous outflow==، في أي حتة من **small hepatic venules** لحد دخول الـ **IVC** على الـ **right atrium**.

          - **Primary BCS:** سببه **thrombosis**.
          - **Secondary BCS:** أسباب تانية، زي **malignant invasion**.
      - kind: figure
        page: 70
        quote: "Budd-Chiari syndrome: From hepatic veins to right atrium. Hepatic vein thrombosis. Inferior vena caval webs"
        title: "السدّة ممكن تبقى فين؟"
        image: { file: hb/L04-outflow-block-sites.webp, book: true }
        alt: "Book drawing of the liver, hepatic veins, IVC and heart. Labels: veno-occlusive disease, obstruction in sinusoids and central veins; Budd-Chiari syndrome, from hepatic veins to right atrium, hepatic vein thrombosis, inferior vena caval webs; and cardiac causes such as congestive hepatopathy, congestive heart failure, cor pulmonale and pericardial disease."
        caption: "تلات مستويات لنفس المشكلة (الدم مش عارف يخرج): في الـ sinusoids (==veno-occlusive disease==)، من الـ hepatic veins للـ right atrium (==Budd-Chiari==)، أو في القلب نفسه (congestive hepatopathy). المستوى التالت هو اللي بيدي **positive** hepatojugular reflux."
      - kind: reveal
        page: 70
        quote: "Pathophysiological consequences of obstruction include: Sinusoidal congestion. Liver ischaemia. Hepatocellular necrosis."
        prompt: "الكبد بيستقبل دم ومش عارف يطلّعه. إيه اللي هيحصل جوه؟"
        answer: |
          الكتاب بيقول 3 حاجات ورا بعض:

          - **Sinusoidal congestion:** الدم بيتحشر في الـ sinusoids.
          - **Liver ischaemia:** الدم الواقف مش بيجيب أكسجين جديد.
          - **Hepatocellular necrosis.**

          زي حمّام البلاعة بتاعته مسدودة: الحنفية مفتوحة والمية بتعلى لحد ما الأرضية كلها تبوظ.
      - kind: explain
        page: 70
        quote: "Chronic form: the patient may present with triad of abdominal pain, hepatomegaly, ascites. Negative hepatojugular reflux."
        title: "الصورة الإكلينيكية"
        text: |
          الصورة بتتراوح من **asymptomatic** لحد **fulminant liver failure**:

          - **Acute form**: صورة **acute liver failure**.
          - **Chronic form**: الـ triad هو ==abdominal pain== و**hepatomegaly** و**ascites**.
          - ومعاه ==negative hepatojugular reflux==. ومع الوقت بيحصل liver failure وportal hypertension.

          التشخيص:

          - ==Doppler ultrasound==: الـ first line.
          - **MRI** و CT: للـ confirmation.
      - kind: reveal
        page: 70
        quote: "Chronic form: the patient may present with triad of abdominal pain, hepatomegaly, ascites. Negative hepatojugular reflux."
        prompt: "عيان بطنه منفوخة وكبده كبير. ليه الـ **negative hepatojugular reflux** بيخليك تفكر في BCS مش في القلب؟"
        answer: |
          لما تضغط على الكبد، الدم المحجوز فيه بيتزق ناحية القلب، فلو المشكلة في القلب (right heart failure أو constrictive pericarditis) الـ JVP هيعلى: **positive**.

          في الـ BCS السدّة بين الكبد والقلب. تضغط زي ما تضغط، الدم مش هيوصل للرقبة: **negative**. الكبد محتقن والرقبة هادية.
