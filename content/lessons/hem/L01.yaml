        stem: "A 58-year-old woman has a huge spleen and a palpable liver. Her marrow aspirate is a dry tap."
        steps:
          - question: "Why are her spleen and liver big?"
            options: ["Extramedullary haematopoiesis", "Portal hypertension only", "Thymic hyperplasia", "Excess EPO"]
