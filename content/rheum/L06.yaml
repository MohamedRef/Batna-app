    kind: table
    topic: hla-disease
    title: "Common HLA disease associations (lecture list)"
    columns: [HLA, Diseases]
    rows:
      - [A29, Birdshot choroidoretinitis]
      - [B5, "Behçet disease, ulcerative colitis, polycystic kidney disease"]
