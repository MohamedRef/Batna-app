  # ---------- cases and essays ----------
  - id: neph.L14.194
    kind: case
    topic: hrs
    stem: "A 55-year-old man with HCV cirrhosis and tense ascites, on furosemide, spironolactone and propranolol, has creatinine 1.0 rising to 1.6 mg/dL in 48 h. BP 100/60, no shock."
    steps:
      - question: First step?
        options:
          - Stop diuretics and beta-blocker; albumin 1 g/kg/day for 2 days
          - Start terlipressin and albumin now, before volume expansion
          - Give a furosemide infusion to clear the tense ascites
          - Kidney biopsy to exclude glomerular disease first
        answer: 0
        why: "Stop diuretics and beta-blockers; volume expansion with albumin 1 g/kg/day (max 100 g) for 2 days (p491-492)."
      - reveal: "After 48 h creatinine is 2.0. Urine protein 120 mg/day, no hematuria, normal ultrasound, FENa 0.1%."
        question: Diagnosis?
        options:
          - HRS-AKI
          - Acute tubular necrosis
          - HCV cryoglobulinemic GN
          - Prerenal AKI responding to fluid
        answer: 0
        why: "No response to albumin, no shock, no parenchymal disease, FENa <0.2% (levels <0.1% highly predictive) = HRS-AKI (Box 1)."
      - question: Drug treatment?
        options:
          - Terlipressin plus albumin
          - Albumin alone
          - Dopamine
          - Norepinephrine on the ward without a central line
        answer: 0
        why: "Terlipressin + albumin beats albumin alone; noradrenaline needs ICU (p492-493). Terlipressin has a boxed warning for respiratory failure: check SpO2 first and watch for fluid overload."
      - question: Definitive treatment?
        options:
          - Liver transplantation
          - Lifelong dialysis
          - TIPS for everyone
          - Kidney transplant alone
        answer: 0
        why: "LT is optimal regardless of drug response (p494)."
    src: { page: 492, quote: "When HRS-AKI is diagnosed, a specific pharmacological treatment should start as soon as possible. There is no doubt about this approach since several randomised studies have shown that vasoconstrictors particularly terlipressin plus albumin have significantly improved renal function in patients with HRS-1." }
    status: unverified
  - id: neph.L14.195
    kind: case
    topic: hus
    stem: "A 28-year-old woman 2 weeks postpartum has Hb 7.5, platelets 60,000, schistocytes, LDH 1400, creatinine 4.2 mg/dL. No diarrhea. Coombs negative."
    steps:
      - question: Which test separates TTP from the rest?
        options:
          - ADAMTS13 activity
          - Stool Shiga toxin
          - Anti-dsDNA
          - Serum C3
        answer: 0
        why: "ADAMTS13 <10% = TTP; >10% = non-TTP TMA (p468)."
      - reveal: "ADAMTS13 is 55%. Stool STEC negative. No other disease found."
        question: Most likely diagnosis?
        options:
          - Atypical HUS
          - TTP
          - STEC-HUS
          - DIC
        answer: 0
        why: "ADAMTS13 >10%, no co-existing disease, STEC negative = aHUS; pregnancy can trigger it (p468, p473)."
      - question: First-line treatment?
        options:
          - Eculizumab
          - Antibiotics
          - Platelet transfusion
          - Rituximab
        answer: 0
        why: "aHUS: eculizumab first-line, plasma exchange second-line (p476)."
      - question: Before eculizumab, what must she receive?
        options:
          - Vaccines against encapsulated organisms
          - An iron infusion to correct her anemia
          - Hepatitis A vaccine only, before the first dose
          - "Nothing: start the drug right away"
        answer: 0
        why: "Eculizumab raises the risk of infection by encapsulated organisms: the book names S. pneumoniae and H. influenzae (p477), and the boxed warning is Neisseria meningitidis, so meningococcal vaccination comes first."
    src: { page: 476, quote: "The cornerstones of treatment for aHUS are first-line treatment with eculizumab and second-line with plasma exchange." }
    status: unverified
  - id: neph.L14.196
    kind: essay
    topic: tma
    prompt: Compare typical HUS, atypical HUS and TTP in cause, diagnosis and treatment.
    outline:
      - "TMA: MAHA + thrombocytopenia (<150,000 or >25% fall) + end-organ damage"
      - "Typical HUS: STEC 90-95%, children <5, bloody diarrhea; supportive, no antibiotics or antimotility"
      - "aHUS: complement mutations (CFH, CFI, MCP), 5-10%; eculizumab first, PEX second; graft recurrence"
      - "TTP: ADAMTS13 <10%, acquired autoantibody; PLASMIC; PEX + steroids, rituximab, caplacizumab; no platelets"
    src: { page: 470, quote: "The triad of thrombocytopenia, hemolytic anemia, and ischemic end-organ damage defines thrombotic microangiopathy." }
    status: unverified
