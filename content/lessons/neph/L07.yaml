  - id: neph.L07.lesson6
    title: "Alport و thin membrane: نفس الـ collagen، مصير مختلف"
    hook: "الاتنين بيبدأوا بـ hematuria. واحد بيوصل dialysis وطرش، والتاني غالبًا بيعيش عادي. الفرق في الـ GBM."
    minutes: 9
    pages: [177, 185]
    topics: [alport, tbm]
    goals:
      - "تعرف الـ type IV collagen ووراثة الـ Alport"
      - "تفرّق Alport من TBMN إكلينيكيًا وبالـ EM"
      - "تعرف مشكلة الـ anti-GBM بعد الزرع"
    status: unverified
    steps:
      - kind: explain
        page: 178
        title: "الـ type IV collagen"
        quote: "The major features of AS are hematuria, progressive nephritis with proteinuria and declining renal function, sensorineural deafness, and ocular abnormalities."
        text: |
          الاتنين **basement membrane defect**، والعَرَض الرئيسي **persistent hematuria**.

          الـ **type IV collagen** موجود في الـ GBM و Bowman capsule و distal tubule و الجلد و ==العين والودن== والـ testis، وفيه 6 chains (α1–α6).

          الـ ==Alport== = **hematuria + progressive nephritis + sensorineural deafness + eye**. نادر (1 في 50,000)، و **1.7%** من الأطفال على ESRD.
      - kind: table
        page: 179
        quote: "an X-linked inherited mutation in the COL4A5 gene (>200 described) that encodes a5 type IV collagen accounts for 80% of cases"
        title: "وراثة الـ Alport"
        columns: [Form, Gene, Share]
        rows:
          - ["X-linked", "COL4A5 (α5)", "80%"]
          - ["AR", "COL4A3/4 (chr 2)", "~15%"]
          - ["AD", "COL4A3/4 (chr 2)", "~5%"]
        hide: [[0, 1], [0, 2], [1, 2]]
      - kind: explain
        page: 179
        title: "الولد الـ Alport"
        quote: "Alport's: proteinuria (often nephrotic range) and ↑ BP usually present by adolescence."
        text: |
          - **Hematuria بدري**: لو مفيش hematuria لحد ==10 سنين== في ولد معرّض، الـ Alport مستبعد غالبًا.
          - **Proteinuria** (غالبًا nephrotic) و **ضغط** في المراهقة.
          - **ESRD في العقد 3–4**، والشدة متقاربة جوّه العيلة.
          - ==High-tone sensorineural deafness== (الأغلبية)، و **anterior lenticonus** (عدسة مخروطية، ~20%) و **flecks** في الـ macula.
          - **البنات الـ carriers**: غالبًا hematuria بس، بس **10–15%** يوصلوا ESRD في العقد الخامس.
          - نادرًا: **leiomyomatosis** في المريء والـ trachea.
      - kind: explain
        page: 179
        title: "Thin basement membrane: الـ benign familial hematuria"
        quote: "The normal GBM is ± 350nm thick-but, in TMD, it is often less than 200nm"
        text: |
          الـ ==TBMN== اسمه القديم **benign familial hematuria**: **AD** شائع، microscopic hematuria والكلى **شغالة تقريبًا دايمًا**. موجود في ~5% من الـ post-mortems وبنلاقيه في المتبرعين.

          - الـ GBM الطبيعي حوالي **350 nm**؛ في الـ TBMN غالبًا **أقل من 200**. الـ cut-off ==250 nm في الكبار== (200–250 في الأطفال).
          - **40%** من العائلات عندهم COL4A3/COL4A4.
          - ~**25%** من الـ microscopic hematuria في عيادة الكلى. Macroscopic في 20%.
          - Proteinuria وضغط و renal impairment **نادرين**، و **مفيش extrarenal**.
      - kind: table
        page: 181
        quote: "TABLE 46.2 Immunostaining for Type IV Collagen in Alport Syndrome"
        title: "Type IV collagen immunostaining: الـ α5 بيقول إيه؟"
        columns: [Group, GBM α5, Skin α5]
        rows:
          - ["Normal", "Present", "Present"]
          - ["X-linked male", "Absent", "Absent"]
          - ["X-linked female", "Mosaic", "Mosaic"]
          - ["AR (both sexes)", "Absent", "Present"]
        hide: [[1, 2], [2, 2], [3, 2]]
      - kind: reveal
        page: 181
        quote: "Evaluation of Patient with Hematuria and a Positive Family History"
        prompt: "عيان عنده hematuria و family history: ليه الـ skin biopsy بيشخّص الـ X-linked Alport بس مش الـ AR؟"
        answer: "جلد الإنسان فيه **α5(IV)** بس، مفيهوش α3 ولا α4. الـ X-linked بيبوّظ الـ **α5**، فيختفي من الجلد عند الرجالة ويبقى **mosaic** عند الستات. الـ AR بيبوّظ **α3/α4**، والـ α5 في الجلد بيفضل **موجود**، فالـ skin biopsy يطلع طبيعي. ساعتها محتاج ==kidney biopsy== بالـ EM وصبغة α3 و α4 و α5."
      - kind: explain
        page: 183
        title: "تحت الميكروسكوب"
        quote: "there is variable thickening, thinning, basket weaving, and lamellation of the GBM"
        text: |
          **Alport**:
          - LM و IF **مفيهمش حاجة pathognomonic**. قبل 5 سنين طبيعي، بعدين mesangial expansion، وبعدين **FSGS** و interstitial fibrosis بعد 10 سنين.
          - الـ ==EM هو المفتاح==: GBM **سميك (لحد 1200 nm) ورفيع**، ==basket weaving==، و lamellation.

          **TBMN**: LM و IF طبيعيين، والـ EM يوري **GBM رفيع كله** (diffuse thinning).
      - kind: figure
        page: 183
        quote: "there is variable thickening, thinning, basket weaving, and lamellation of the GBM"
        title: "شكل الـ GBM"
        alt: "Three horizontal strips representing the glomerular basement membrane. Normal: an even band about 350 nm. Thin basement membrane nephropathy: an even but thin band under 250 nm. Alport syndrome: an irregular band alternating thick and thin segments with split, basket-weave layers."
        caption: "**Normal** منتظم، **TBMN** منتظم بس ==رفيع==، و **Alport** متقطع: سميك ورفيع ومنسوج زي السبت."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="22" class="t-b">Normal GBM (~350 nm)</text>
            <rect x="10" y="32" width="310" height="24" rx="4" class="fg-acc"/>
            <text x="10" y="96" class="t-b">Thin basement membrane</text>
            <text x="320" y="96" text-anchor="end" class="t-sm t-mut">&lt;250 nm (adult)</text>
            <rect x="10" y="106" width="310" height="8" rx="3" class="fg-good"/>
            <text x="10" y="162" class="t-b">Alport syndrome</text>
            <text x="320" y="162" text-anchor="end" class="t-sm t-mut">up to 1200 nm</text>
            <path d="M10 186 C40 166, 60 166, 80 186 S120 196, 140 184 C160 160, 200 160, 220 186 S270 196, 320 180" class="fg-arrow-bad" fill="none" stroke-width="3"/>
            <path d="M10 196 C40 210, 60 214, 80 196 S120 190, 140 198 C160 222, 200 222, 220 198 S270 190, 320 202" class="fg-arrow-bad" fill="none" stroke-width="3"/>
            <path d="M30 180 L60 204 M90 186 L120 196 M170 172 L200 212 M240 186 L280 198" class="fg-thin"/>
            <text x="165" y="240" text-anchor="middle" class="t-sm">thick + thin + basket weaving</text>
          </svg>
      - kind: explain
        page: 185
        title: "العلاج والزرع"
        quote: "In <5%, transplanted Alport patients may develop de novo anti-GBM anti-bodies that cause an RPGN"
        text: |
          **Alport**: مفيش علاج خاص. **BP control و ACEI/ARB** وتقليل الـ proteinuria بدري (وكمان الـ carriers)، **screening للعيلة**، و genetic counselling.

          **الزرع**: في ==أقل من 5%== الجسم يعتبر الـ **α5 بتاع المتبرع غريب** ويعمل **anti-GBM** فيحصل **RPGN**. بس ده **مش contraindication** للزرع.

          **TBMN**: طمّنه بس ما تسيبوش: خطر الـ CKD **أقل من 5%** بس موجود. Urinalysis وضغط ووظائف كلى كل **1–2 سنة**.
      - kind: check
        page: 185
        quote: "Proteinuria, hypertension, and progression to ESRD are unusual, seen in less than 10% of affected individuals, and extremely unusual before age 40."
        question: "Which feature favors TBMN over Alport?"
        options:
          - "Autosomal dominant hematuria, normal hearing, no proteinuria at 35"
          - "High-tone hearing loss"
          - "Anterior lenticonus"
          - "Nephrotic proteinuria by 16"
        answer: 0
        why:
          - "صح: الـ TBMN AD، مفيش extrarenal، والـ proteinuria نادرة قبل 40."
          - "الطرش ده Alport."
          - "عين Alport."
          - "Alport في المراهقة."
      - kind: try
        items: [neph.L07.150, neph.L07.153, neph.L07.157, neph.L07.163, neph.L07.172]
    recap:
