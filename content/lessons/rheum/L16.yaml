        alt: "A menu grouped by target. TNF: infliximab (chimeric), adalimumab (human), golimumab (human), certolizumab pegol (humanized pegylated Fab'), etanercept (TNF receptor 2 fusion protein). IL-1 receptor: anakinra. T-cell costimulation CD80/86-CD28: abatacept. B cell CD20: rituximab. IL-6 receptor: tocilizumab. Inside the cell, JAK: tofacitinib, baricitinib, upadacitinib, filgotinib."
        caption: "خمسة على الـ **TNF**، وواحد على كل هدف تاني. والـ **JAK inhibitors** بيدخلوا جوّه الخلية ويقفلوا كذا cytokine مرّة واحدة."
