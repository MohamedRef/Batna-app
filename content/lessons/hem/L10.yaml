      - kind: explain
        page: 172
        title: "Met-Hb و السجاير"
        quote: "Acquired methemoglobinemia due to exposure to strong oxidant (dapsone, inorganic nitrate, benzocaine, sulpha), life threatening when severe."
        text: |
          - **Met-Hb**: الحديد اتأكسد من **Fe²⁺ لـ Fe³⁺**، والرجوع محتاج **NADH** من الـ glycolysis. affinity أعلى و left shift.
          - **Acquired**: oxidants: ==dapsone، inorganic nitrate، benzocaine، sulpha==؛ خطير لو شديد.
          - **Hereditary**: **Hb M** (حوالين الـ heme pocket) أو عيوب **NADH reductase / cytochrome b5 reductase**.
          - **Heavy smoking**: **CO-Hb 3–20%**: الـ CO بيزق الـ O2 وبيعمل left shift، فـ mild polycythemia حتى من غير مرض رئة.
      - kind: explain
        page: 173
        title: "من غير hypoxia: Chuvash والكلى والأورام"
        quote: "VHL mutant leads to reduced rate of degradation of HIF-1 and up regulation of down stream target Epo."
        text: |
          - ==Chuvash polycythemia==: **autosomal recessive**، endemic في Chuvashia (Volga)، EPO **عالي** ومفيش EPOR mutation. السبب **VHL** mutation، فالـ **HIF-1** ما بيتكسرش، والـ EPO يعلى.
          - **Renal**: tumours، polycystic، cysts (local hypoxia)، transplant. بعضهم يستجيب لـ **ACE inhibitors و theophylline**، وبعضهم venesection، وبعضهم يخف لوحده.
          - **Non-renal tumours**: **HCC**، **cerebellar hemangioma**، **large uterine fibroma**. شيل الورم = الـ polycythemia تخف.
          - **Endocrine**: **androgens** زيادة (EPO أعلى + تأثير مباشر على النخاع).
      - kind: aside
        tone: exam
        page: 174
        quote: "Hepatocellular carcinoma Cerebellar tumor, hemangioma Large uterine fibroma."
        text: "سؤال جاهز: «non-renal EPO-secreting tumours» = **HCC، cerebellar hemangioma، uterine fibroma**. ولو لقيت Hb عالي في مريض cirrhosis، فكّر في **HCC**."
      - kind: explain
        page: 174
        title: "Idiopathic و Apparent"
        quote: "Raised PCV (>0.51 in male and >0.48 in female) with normal red cell volume."
        text: |
          - **Idiopathic**: مش PV ومفيش سبب. بعضهم بيطلع **PV** بعدين.
          - ==Apparent polycythemia==: PCV **>0.51 رجالة / >0.48 ستات** مع **red cell volume طبيعي**، علشان البلازما قليلة: **smoking، HTN، obesity، alcohol، diuretics**.
          - مش واضح إنه بيزوّد التجلط. شيل الأسباب، و **venesection لو PCV >0.55** والعيان عنده خطر vascular.
