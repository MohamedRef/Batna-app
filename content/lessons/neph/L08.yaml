        page: 205
        title: "الفلتر 3 طبقات، والـ deposit مكانه بيفرق"
        quote: "Schematic approximation of a glomerular capillary"
        text: |
          الـ **schematic approximation of a glomerular capillary** بيوريك الـ ==filtration barrier==:
          1. **Fenestrated endothelial cell** (ناحية الدم).
          2. **Glomerular basement membrane** (في النص).
          3. **Podocyte foot processes** (ناحية الـ urinary space).

          وتحت، الـ **mesangial cell** والـ **mesangial matrix** على اتصال بالدم مباشرة، من غير GBM بينهم.

          ليه ده بيفسّر الأمراض؟ التفسير المقبول (مش في الكتاب): الـ deposit اللي **ناحية الدم** (subendothelial أو mesangial) قريب من الـ complement والـ leukocytes، فبيعمل **التهاب** وhematuria. الـ deposit اللي **برّه الـ GBM** (subepithelial، زي الـ membranous) بعيد عن الدم، فالالتهاب قليل، بس الـ podocyte بيتعب ويسرّب **protein**. وعلشان الـ mesangium مفتوح على الدم من غير غشا، هو أول مكان الـ complexes الكبيرة بتتحجز فيه، زي الـ IgA. يعني مكان الـ deposit بيقولك العيان جاي nephritic ولا nephrotic.

          إزاي ده يربط بالأعراض؟ التفسير المقبول (مش في الكتاب): الـ deposit **subendothelial** قريب من الدم، فبيشوفه الـ complement والـ leukocytes، فيحصل التهاب = **nephritic** (RBCs، creatinine طالع). الـ deposit **subepithelial** ورا الغشا، بعيد عن الدم، فالالتهاب قليل بس الـ podocyte بيتعوّر = **nephrotic** (بروتين من غير RBCs كتير). والـ **mesangial** في النص، فبيعمل hematuria خفيفة. يعني مكان الـ deposit بيتنبأ بالـ presentation.
