  # ---------------- design-tree (slides 2-4, 8) ----------------
  - id: res.L06.001
    kind: card
    topic: design-tree
    front: In the epidemiologic study-design tree, which question separates experimental from observational studies?
    back: Did the investigator assign the exposure? Yes = experimental study; no = observational study.
    src: { page: 3, quote: "EPIDEMIOLOGIC STUDY DESIGNS. Did investigator assign exposures?\n  Yes, Experimental study. Random allocation?\n    Yes: Randomised controlled trial\n    No: Non-randomised controlled trial\n  No, Observational study. Comparison group?\n    No: Descriptive study\n    Yes: Analytical study. Direction?\n      Exposure → Outcome: Cohort study\n      Exposure ← Outcome: Case-control study\n      Exposure and outcome at the same time: Cross-sectional study" }
    status: unverified
    tags: [high-yield]
  - id: res.L06.002
    kind: mcq
    topic: design-tree
    stem: >-
      Investigators give a new oral hygiene programme to the patients of two clinics they choose themselves,
      and compare gingivitis rates with two other clinics that do not get it. No randomisation is done.
      What is this design?
    options:
      - Randomised controlled trial
      - Non-randomised (quasi-experimental) trial
      - Cohort study
      - Case-control study
      - Cross-sectional study
    answer: 1
    why:
      - A randomized controlled trial (RCT) needs random allocation, and here the investigators chose the clinics.
      - The investigator assigned the exposure without randomisation, so it is a non-randomised (quasi-experimental) trial.
      - In a cohort study the investigator only observes an exposure; here they assigned it.
      - A case-control study starts from the outcome and looks back for the exposure.
      - A cross-sectional study measures exposure and outcome at the same time, with no assigned exposure.
    src: { page: 8, quote: "Types of intervention studies:\n  Randomized interventional studies\n  Non randomized interventional studies (Quasi experimental trials)\nRandomization is a key feature" }
    status: unverified
    tags: [high-yield]
  - id: res.L06.003
    kind: card
    topic: design-tree
    front: What are the two types of intervention studies, and what is their key distinguishing feature?
    back: Randomized interventional studies and non-randomized interventional (quasi-experimental) trials. Randomization is the key feature.
    src: { page: 8, quote: "Types of intervention studies:\n  Randomized interventional studies\n  Non randomized interventional studies (Quasi experimental trials)\nRandomization is a key feature" }
    status: unverified
  - id: res.L06.004
    kind: order
    topic: design-tree
    prompt: Order the hierarchy of research designs and evidence, from the top of the pyramid down.
    steps:
      - Clinical practice guidelines
      - Meta-analysis and systematic reviews
      - Randomized controlled trial
      - Cohort studies
      - Case-control studies
      - Case reports, case series, narrative reviews, expert opinions, editorials
      - Animal and laboratory studies
    src: { page: 4, quote: "Hierarchy of Research Designs & Levels of Scientific Evidence (based on ability to control for bias and to demonstrate cause and effect in humans), top to bottom:\n  Secondary, pre-appraised, or filtered Studies:\n    Clinical Practice Guidelines\n    Meta-Analysis, Systematic Reviews\n  Primary Studies:\n    Randomized Controlled Trial. Prospective, tests treatment\n    Observational Studies: Cohort Studies. Prospective: cohort has been exposed to a risk. Observe for outcome of interest\n    Observational Studies: Case Control Studies. Retrospective: subjects have the outcome of interest; looking for risk factor\n  No design: Case Report or Case Series; Narrative Reviews, Expert Opinions, Editorials\n  Not involved w/ humans: Animal and Laboratory Studies" }
    status: unverified
    tags: [high-yield]
  - id: res.L06.005
    kind: card
    topic: design-tree
    front: On what basis is the hierarchy of research designs (evidence pyramid) ranked?
    back: On the design's ability to control for bias and to demonstrate cause and effect in humans.
    src: { page: 4, quote: "Hierarchy of Research Designs & Levels of Scientific Evidence (based on ability to control for bias and to demonstrate cause and effect in humans), top to bottom:\n  Secondary, pre-appraised, or filtered Studies:\n    Clinical Practice Guidelines\n    Meta-Analysis, Systematic Reviews\n  Primary Studies:\n    Randomized Controlled Trial. Prospective, tests treatment\n    Observational Studies: Cohort Studies. Prospective: cohort has been exposed to a risk. Observe for outcome of interest\n    Observational Studies: Case Control Studies. Retrospective: subjects have the outcome of interest; looking for risk factor\n  No design: Case Report or Case Series; Narrative Reviews, Expert Opinions, Editorials\n  Not involved w/ humans: Animal and Laboratory Studies" }
    status: unverified
  - id: res.L06.006
    kind: cloze
    topic: design-tree
    text: >-
      In the evidence pyramid, meta-analyses, systematic reviews and guidelines are {{c1::secondary (pre-appraised, filtered)}}
      studies; randomized controlled trial (RCT), cohort and case-control are {{c2::primary}} studies; case reports, expert opinions and editorials
      count as {{c3::no design}}.
    src: { page: 4, quote: "Hierarchy of Research Designs & Levels of Scientific Evidence (based on ability to control for bias and to demonstrate cause and effect in humans), top to bottom:\n  Secondary, pre-appraised, or filtered Studies:\n    Clinical Practice Guidelines\n    Meta-Analysis, Systematic Reviews\n  Primary Studies:\n    Randomized Controlled Trial. Prospective, tests treatment\n    Observational Studies: Cohort Studies. Prospective: cohort has been exposed to a risk. Observe for outcome of interest\n    Observational Studies: Case Control Studies. Retrospective: subjects have the outcome of interest; looking for risk factor\n  No design: Case Report or Case Series; Narrative Reviews, Expert Opinions, Editorials\n  Not involved w/ humans: Animal and Laboratory Studies" }
    status: unverified
  - id: res.L06.007
    kind: mcq
    topic: design-tree
    stem: Which primary study design sits highest in the hierarchy of evidence?
    options:
      - Cohort study
      - Case-control study
      - Randomized controlled trial
      - Case series
      - Systematic review
    answer: 2
    why:
      - Cohort studies are observational and sit just below the randomized controlled trial (RCT).
      - Case-control studies are retrospective and sit below cohorts.
      - The RCT is prospective, tests a treatment and is the top primary design.
      - Case series are labelled "no design" near the base.
      - A systematic review is higher, but it is a secondary (filtered) study, not a primary one.
    src: { page: 4, quote: "Hierarchy of Research Designs & Levels of Scientific Evidence (based on ability to control for bias and to demonstrate cause and effect in humans), top to bottom:\n  Secondary, pre-appraised, or filtered Studies:\n    Clinical Practice Guidelines\n    Meta-Analysis, Systematic Reviews\n  Primary Studies:\n    Randomized Controlled Trial. Prospective, tests treatment\n    Observational Studies: Cohort Studies. Prospective: cohort has been exposed to a risk. Observe for outcome of interest\n    Observational Studies: Case Control Studies. Retrospective: subjects have the outcome of interest; looking for risk factor\n  No design: Case Report or Case Series; Narrative Reviews, Expert Opinions, Editorials\n  Not involved w/ humans: Animal and Laboratory Studies" }
    status: unverified
  # ---------------- interventions (slides 6-7, 9, 11-12) ----------------
  - id: res.L06.008
    kind: enumerate
    topic: interventions
    prompt: Enumerate the interventions that can be evaluated by experimental studies.
    points:
      - New drugs and new treatment of diseases
      - New medical and health care technology
      - New methods of primary prevention
      - New programs of screening
      - New ways of organizing and delivering health services
      - New community health programs
      - New behavioral intervention programs
    pass: 5
    hook: "التجارب بتقيّم 7 حاجات «جديدة»: دوا وعلاج، تكنولوجيا، primary prevention، screening، تنظيم الخدمة، community programs، وbehavioral programs."
    src: { page: 6, quote: "Interventions that Can be Evaluated:\n  New drugs and new treatment of diseases\n  New medical and health care technology\n  New methods of primary prevention\n  New programs of screening\n  New ways of organizing and delivering health services\n  New community health programs\n  New behavioral intervention programs" }
    status: unverified
  - id: res.L06.009
    kind: card
    topic: interventions
    front: Who is credited with the first randomized controlled trial (RCT) in medicine, and what did it test?
    back: Sir A. Bradford Hill (England's Medical Research Council); published in the BMJ in 1948, it tested whether streptomycin is effective in treating tuberculosis.
    src: { page: 7, quote: "The first RCT in medicine:\n  Credited to Sir A. Bradford Hill, an epidemiologist for England's Medical Research Council.\n  The trial, published in the British Medical Journal in 1948, tested whether streptomycin is effective in treating tuberculosis" }
    status: unverified
  - id: res.L06.010
    kind: cloze
    topic: interventions
