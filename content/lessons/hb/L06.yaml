        text: |
          - **F0–F1:** primary care، dietitian، obesity و diabetes teams. المتابعة: **FIB-4 every 1–2 years**، و LSM (elastography أو ELF) لو FIB-4 **> 1.3**.
          - **F2–F3 (at-risk MASH):** نفس الفريق + **hepatologist/GI** و **endocrinologist**. المتابعة: **annual imaging** (LSM أو MRE) و blood fibrosis biomarkers.
          - **Cirrhosis:** نفس الفريق + **transplant team** (decompensated) و **social support team**. المتابعة **tailored**، و **screen for HCC**.
