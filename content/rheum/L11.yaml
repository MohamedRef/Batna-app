      - question: "Before a definitive plan, which vaccine must be avoided in him and his family?"
        options: ["Live vaccines such as BCG and oral polio", "Tetanus toxoid", "Inactivated influenza", "None"]
        answer: 0
        why: "Live vaccines can be disastrous in T-cell defects (pp183, 190)."
      - question: "Definitive treatment and outcome?"
        options: ["Bone marrow transplant; ~93% survival if within 3 months", "Monthly IVIG alone for life", "Danazol", "Oral immunoglobulin"]
        answer: 0
        why: "BMT is the treatment of choice; without it SCID kills within a year (p190). IVIG alone does not fix T cells. Danazol is for HAE."
    src: { page: 190, quote: "Bone marrow transplantation is the treatment of choice for patients with SCID." }
