  # Split from lesson4 on 2026-11-13 (#828): choosing a statin, aspirin, the book questions.
  - id: dm.L04.lesson6
    title: "تختار أنهي statin؟ والـ aspirin لمين؟"
    hook: "عضلاته وجعته من simvastatin؟ بياخد clarithromycin؟ وهل كل مريض سكر ياخد aspirin؟"
    minutes: 9
    pages: [48, 50]
    topics: [statin-choice, antiplatelet]
    goals:
      - "تحفظ الـ high و moderate intensity doses وتختار الـ statin حسب المشكلة"
      - "تعرف امتى aspirin وامتى لأ، وليه فوق 70 لأ"
      - "ترتّب إجابة أسئلة الكتاب"
    status: unverified
    steps:
      - kind: figure
        page: 48
        title: "تختار أنهي statin؟"
        image: { file: dm/L04-statin-choice.webp, book: true }
        caption: "الـ **myalgias** ← hydrophilic (rosuva، prava). الـ **adherence** ← long half-life (atorva، rosuva). ==cytochrome P450 3A4 (CYP3A4)== ← ابعد عن simva و lova و atorva."
        alt: "Book figure: four rows of arrows. Indication for high-intensity statin leads to atorvastatin 40 to 80 mg or rosuvastatin 20 to 40 mg. Previous myalgias leads to a hydrophilic statin, rosuvastatin or pravastatin. Adherence issues lead to a long half-life statin, atorvastatin or rosuvastatin. CYP3A4 interactions: avoid simvastatin, lovastatin and atorvastatin; use pravastatin or rosuvastatin."
      - kind: match
        page: 48
        quote: "| High-Intensity Statin Therapy | Moderate-Intensity Statin Therapy |\n|---|---|\n| Daily dose lowers LDL on average by ≥50% | Daily dose lowers LDL on average by approximately 30-49% |\n| Atorvastatin 40-80 mg, Rosuvastatin 20-40 mg | Atorvastatin 10-20 mg, Rosuvastatin 5-10 mg, Simvastatin 20-40 mg, Pravastatin 40-80 mg, Lovastatin 40 mg, Fluvastatin XL 80 mg, Fluvastatin 40 mg BID, Pitavastatin 2-4 mg |"
        prompt: "وصّل:"
        pairs:
          - ["Rosuvastatin 20–40 mg", "High intensity (LDL ↓ ≥50%)"]
          - ["Pravastatin 40–80 mg", "Moderate intensity (LDL ↓ 30–49%)"]
          - ["Previous myalgias", "Hydrophilic statin"]
          - ["CYP3A4 interactions", "Avoid simvastatin"]
      - kind: reveal
        page: 48
        quote: "Almost half of the high & very-high risk patients were prescribed moderate-intensity statin monotherapy which results in poor LDL-C goal attainment"
        prompt: "الكتاب بيقول إن نص الـ high و very-high risk بياخدوا moderate statin لوحده. إيه المشكلة؟"
        answer: |
          النتيجة زي ما الكتاب بيقول: **poor LDL-C goal attainment**. الـ moderate بينزّل الـ LDL **30–49%** بس، والـ high risk محتاج **≥50%** وهدف <70 أو <55.

          يعني الدكتور «كاتب statin» ومرتاح، بس العيان لسه بعيد عن الهدف. الدرس: اكتب **الجرعة** الصح (atorva 40–80 أو rosuva 20–40)، وقيس الـ LDL، وزوّد لو ما وصلش.
      - kind: case
        page: 48
        quote: "| Situation | Choice | Statins |\n|---|---|---|\n| Indication for High-Intensity Statin | Choose atorvastatin or rosuvastatin. | Atorvastatin 40-80 mg, Rosuvastatin 20-40 mg |\n| Previous Myalgias with Statin Therapy | Choose hydrophilic statin. | Rosuvastatin, Pravastatin |\n| Issues with Adherence | Choose long half-life statin. | Atorvastatin, Rosuvastatin |\n| CYP3A4 Drug Interactions | AVOID simvastatin, lovastatin, atorvastatin. | Pravastatin, Rosuvastatin |"
        stem: "48-year-old smoker, type 2, LDL 150 mg/dL. Simvastatin gave him muscle aches."
        steps:
          - question: "Statin intensity?"
            options: ["High: LDL ↓ ≥50% and <70", "Moderate", "None before 50", "PCSK9i first"]
            answer: 0
            why: "40–75 + risk factor (smoking) ← high-intensity (p46)."
          - question: "Which statin?"
            options: ["Rosuvastatin 20–40 mg", "Simvastatin 40 mg", "Pravastatin 40 mg", "Lovastatin 40 mg"]
            answer: 0
            why: "Myalgias ← hydrophilic (rosuva أو prava)، والـ rosuva بس فيهم high-intensity (p48)."
          - reveal: "Three months later: LDL 88 on maximum tolerated dose."
            question: "Next?"
            options: ["Add ezetimibe", "Aspirin only", "Stop statin", "Switch to simvastatin"]
            answer: 0
            why: "مش وصل للهدف ← ezetimibe (p46)."
      - kind: explain
        page: 49
        title: "الـ aspirin"
        quote: "Antiplatelet Agents\n  6) Use aspirin therapy (75–162 mg/day) as a secondary prevention strategy in those with diabetes and a history of atherosclerotic cardiovascular disease."
        text: |
          - **Secondary prevention:** aspirin ==75–162 mg/day== لكل اللي عندهم ASCVD.
          - **Stable coronary artery disease (CAD)/peripheral artery disease (PAD) + bleeding risk قليل:** aspirin + **low-dose rivaroxaban**.
          - **Primary prevention:** ممكن لو **≥50 سنة** + risk factor كبير ومفيش bleeding risk، بـ **shared decision**. فوق **70** الضرر أكتر من الفايدة.

          ليه الـ secondary واضح والـ primary محيّر؟ في الـ secondary العيان عمل جلطة قبل كده، فخطر الجلطة الجاية كبير جدًا والـ aspirin بيمنع أكتر بكتير ما بيعمل نزيف. في الـ primary الخطر أقل، فالفايدة **fairly comparable** مع النزيف زي ما الكتاب بيقول. وفوق 70 المعدة والمخ أهشّ والنزيف أخطر، فالكفة بتميل للضرر.
      - kind: aside
        tone: analogy
