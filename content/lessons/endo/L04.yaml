  - id: endo.L04.lesson7
    title: "الـ HIV والخصية والكبد"
    hook: "مريض cirrhosis عنده ثدي كبير وخصية صغيرة، والـ LH عالي بس مش عالي كفاية. مين اللي كابته؟"
    minutes: 9
    pages: [65, 67]
    topics: [hiv, testicular]
    goals:
      - "تعرف إزاي الـ HIV بيأثر على الغدد وليه الـ adrenal reserve قليل رغم الـ cortisol العالي"
      - "تعدّ الأمراض العامة اللي بتأثر على الخصية وصورة كل واحد"
      - "تشرح الـ hypogonadism في الـ cirrhosis ودور الـ oestrogen"
    status: unverified
    steps:
      - kind: explain
        page: 65
        quote: "Endocrine dysfunction has not been prominent in HIV infection. Nonetheless, all glands of the endocrine system may be infiltrated with opportunistic infections or malignancies or may be affected by drugs used to treat HIV-related disorders."
        title: "الـ HIV والغدد: تلات طرق"
        text: |
          الكتاب بيبدأ بجملة مهمة: الـ endocrine dysfunction **مش بارز** في الـ human immunodeficiency virus (HIV). بس **أي غدة** ممكن تتأذي بتلات طرق:
          1. **Opportunistic infections** بتغزوها.
          2. **Malignancies** (زي Kaposi والـ lymphoma) بتتسلل لها.
          3. **الأدوية** اللي بتتاخد لعلاج مضاعفات الـ HIV.

          يعني لما تلاقي مشكلة هرمونية في مريض HIV، اسأل: عدوى؟ ورم؟ ولا دوا؟ ده هيبقى المفتاح لكل اللي جاي في ص 73-75.
      - kind: explain
        page: 66
        quote: "Fatigue, anorexia, nausea, vomiting, orthostatic hypotension, and hyponatremia are symptoms frequently noted in many HIV-infected patients Basal 8 A.M. plasma cortisol levels are usually higher in patients with advanced HIV disease than in asymptomatic patients and uninfected healthy controls. However, other ACTH-dependent steroids, such as desoxycorticosterone (DOC), compound B, and 18- hydroxy-DOC, are not elevated and show a blunted response to corticotropin (ACTH) stimulation, implying subnormal adrenal reserves."
        title: "الـ HIV والـ adrenal"
        text: |
          الكتاب بيقول إن أعراض زي fatigue، anorexia، nausea، vomiting، orthostatic hypotension، و **hyponatraemia** بتتشاف كتير في مرضى الـ HIV. (إنها شبه الـ adrenal insufficiency دي ملاحظة مننا، مش كلام الكتاب.)

          الـ basal cortisol الساعة 8 الصبح ==أعلى== في الـ advanced HIV من اللي ما عندهمش أعراض ومن الأصحاء. بس الـ ACTH-dependent steroids التانية، الـ deoxycorticosterone (DOC) و compound B و 18-OH-DOC، **مش عاليين** وردّهم على الـ ACTH stimulation **ضعيف (blunted)**. يعني الـ **adrenal reserve قليل**.
      - kind: reveal
        page: 66
        quote: "However, other ACTH-dependent steroids, such as desoxycorticosterone (DOC), compound B, and 18- hydroxy-DOC, are not elevated and show a blunted response to corticotropin (ACTH) stimulation, implying subnormal adrenal reserves."
        prompt: "الـ cortisol عالي. إزاي يبقى الـ adrenal reserve قليل؟"
        answer: "التفسير المقبول (مش في الكتاب): المرض المزمن stress، فالغدة شغالة على آخرها عشان تطلّع cortisol، وده اللي باين في التحليل الصبح. بس لما تدّيها ACTH زيادة، مفيش احتياطي تطلّع منه، فالـ steroids التانية مش بتعلى. يعني الغدة **مش فاضية** مش **سليمة**، وأي stress زيادة (عدوى، عملية) ممكن يوقّعها في insufficiency."
      - kind: explain
        page: 66
        quote: "Testicular Abnormalities in Systemic Diseases\n1- CRF.\n2- Liver cirrhosis.\n3- Some hematologic disordes (Sickle Cell Disease).\n4- Non specific illness; after surgery, myocardial infarction, severe burn are associated with the same hormonal changes."
        title: "الخصية في الأمراض العامة"
        text: |
          الكتاب بيعدّ 7:
          1. **CRF** (درسها في ص 48-50، وتاني ص 68).
          2. **Liver cirrhosis** (ص 67، تحت).
          3. **Sickle cell disease** (ص 69).
          4. **Non-specific illness**: بعد عملية، أو myocardial infarction (MI)، أو حرق شديد، بنفس التغيرات الهرمونية. يعني أي stress جامد بيطفي المحور مؤقتًا.
          5. ==HIV==: الـ gonadotrophins عالية (**compensated hypogonadism**)، والـ testosterone واطي في **35-50%**. والـ **SHBG العالي بيداري** جزء من الوقعة، لأنه بيرفع الـ total T في التحليل رغم إن الـ free قليل.
          6. ==Acute febrile illness==: الـ sperm density يقل **مؤقتًا** والـ testosterone **ما بيتغيرش**. التفسير المقبول (مش في الكتاب): الخصية برا الجسم عشان تفضل أبرد، والحرارة العالية بتأذي الـ spermatogenesis قبل أي حاجة.
          7. **Coeliac**: infertility، و LH و testosterone عاليين (androgen resistance).
      - kind: check
        page: 66
        quote: "6- Acute febtile illness:\nIt decreases sperm density temporarily in the absence of setum testosterone level changes."
        question: "A man has a high fever for a week. What happens?"
        options: ["Sperm density falls temporarily; testosterone unchanged", "Testosterone falls permanently", "LH falls and testosterone falls", "Nothing at all"]
        answer: 0
        why:
          - "صح: الكتاب بيقول temporarily، و absence of serum testosterone changes."
          - "الـ T مش بيتغير."
          - "مش مذكور."
          - "الـ sperm بيقل."
      - kind: explain
        page: 67
        quote: "Although the LH plasma level is elevated, the level may be below the expected range given the degree of androgen deficiency. This is due to inhibition of LH secretion by estrogen in pts with chronic liver disease (CLD). Increased estrogen production results from impaired hepatic extraction of adrenal androstendione & subsequent increase extraglandular conversion of estrone & estradiol. Testicular atrophy & gynecomastia are present in about 50% of men with cirrhosis & men are impotent. Successful liver transplantation reverses the effects of cirrhosis on pituitary-testicular axis."
        title: "الخصية والـ cirrhosis"
        text: |
          في الـ ==cirrhosis== فيه عيب **combined** في الخصية والـ pituitary، فالـ testosterone بيقل، و**مستقل عن تأثير الكحول المباشر**.

          الـ LH عالي، بس **أقل من المتوقع** بالنسبة لدرجة نقص الـ androgen. ليه؟ لأن الـ ==oestrogen بيكبت الـ LH==.

          وليه الـ oestrogen عالي؟ الكبد العيّان مش بيسحب الـ **adrenal androstenedione**، فبيفضل في الدم ويتحول **برا الغدد** (extraglandular) لـ oestrone و oestradiol.

          النتيجة: testicular atrophy و gynaecomastia في **حوالي 50%**، والرجالة impotent. والـ ==liver transplant== الناجح بيرجّع الـ pituitary–testicular axis.
