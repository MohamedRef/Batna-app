            <text x="270" y="102" text-anchor="middle" class="t-sm">~90</text>
            <text x="75" y="218" text-anchor="middle" class="t-sm">40 y</text>
            <text x="140" y="218" text-anchor="middle" class="t-sm">50 y</text>
            <text x="205" y="218" text-anchor="middle" class="t-sm">60 y</text>
            <text x="270" y="218" text-anchor="middle" class="t-sm">70 y</text>
            <text x="165" y="242" text-anchor="middle" class="t-sm t-acc t-b">−10 ml per decade after 40</text>
          </svg>
      - kind: table
        page: 29
        quote: "Changes in renal hemodynamic with aging\n| Parameter | Change |\n|---|---|\n| GFR | ↓ |\n| Effective renal plasma flow (ERPF) | ↓ |\n| Response to vasodilators | ↓↓ |\n| Response to vasoconstrictor | ↑ |"
        title: "الـ hemodynamics"
        columns: [Parameter, Change]
        rows:
          - [GFR, Down]
          - [ERPF, Down]
          - [Vasodilator response, Markedly down]
          - [Vasoconstrictor response, Up]
        hide: [[2, 1], [3, 1]]
      - kind: explain
        page: 29
        title: "ليه الـ vasodilators ضعيفة والـ vasoconstrictors قوية؟"
        quote: "Response to vasodilators"
        text: |
          الجدول بيقول إن الكلية العجوزة **ردها على الـ vasodilators قليل جدًا (↓↓)**، و**ردها على الـ vasoconstrictors زايد (↑)**.

          التفسير المقبول (مش في الكتاب): الأوعية اللي جوه الكلية **اتصلّبت**، فما بتعرفش توسع لما تحتاج، بس لسه بتضيق. والنتيجة العملية:
          - في الـ dehydration أو الـ hypotension الكلية **مش بتحمي نفسها** بإنها توسّع، فالـ GFR يقع بسرعة.
          - وأي حاجة بتقلل الـ vasodilator prostaglandins، زي الـ **NSAIDs**، بتضرب الكلية العجوزة أكتر من الشابة.

          وده نفس سبب إن الـ RPF بيقل **10% كل عشر سنين** بعد الـ 40.
