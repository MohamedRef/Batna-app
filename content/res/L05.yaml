  - id: res.L05.044
    kind: mcq
    topic: risk
    stem: >-
      Smokers: 20 of 200 develop lung cancer. Non-smokers: 2 of 200. What are the relative risk and the
      attributable risk?
    options: ["RR 10; AR 0.09 (90 per 1000)", "RR 10; AR 0.9", "RR 0.1; AR 0.09", "RR 11; AR 18 cases"]
    answer: 0
    why:
      - "Ie = 20/200 = 0.10, Io = 2/200 = 0.01. RR = 0.10/0.01 = 10. AR = 0.10 − 0.01 = 0.09."
      - "AR is a difference of incidences (0.09), not 0.9, which would be the attributable risk percent as a fraction."
      - "0.1 is Io/Ie, the inverse."
      - "These use raw counts, not incidences."
    src: { page: 54, quote: "| Smoking | Lung cancer YES + | Lung cancer NO - | Total |\n|---|---|---|---|\n| YES + (Exposed) | 20 (a) | 180 (b) | 200 (a+b) |\n| NO - (Not exposed) | 2 (c) | 198 (d) | 200 (c+d) |\nFind out RR and AR for above data" }
