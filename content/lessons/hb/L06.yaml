      - kind: explain
        page: 104
        title: "ADA 2025: نفس الفكرة بأرقام مختلفة شوية"
        text: |
          **مين يدخل الـ pathway؟** واحد من 3: T2DM، أو obesity مع cardiometabolic risk factor واحد على الأقل، أو persistently elevated liver enzymes.

          وبعدين FIB-4 بيقسمهم 3 طرق:

          - **أقل من 1.3**: re-assess FIB-4 every 1–3 years.
          - ==من 1.3 لـ 2.67==: VCTE (أو alternative test). لو 8.0 kPa وطالع: hepatology referral. لو أقل: intensified management of comorbidities، وأعد FIB-4 في خلال سنة أو أقل.
          - ==أكتر من 2.67==: hepatology referral على طول.

          الفرق عن EASL: الـ ADA عنده باب تالت فوق 2.67 بيحوّل مباشرة من غير FibroScan.
      - kind: aside
        tone: trap
        page: 104
        text: |
          الحد التحتاني **1.3** في كل حتة. الفرق في **الحد الفوقاني**:

          - **Book p102 bands:** high risk **> 3.25**.
          - **ADA 2025:** referral مباشر لو **> 2.67**.
          - **EASL 2021:** رقم واحد بس **1.30**، وبعده elastography.

          اقرا السؤال كويس: بيسأل على أنهي pathway؟
      - kind: table
        page: 104
        title: "EASL 2021 vs ADA 2025"
        columns: ["Step", "EASL 2021", "ADA 2025"]
        rows:
          - ["FIB-4 low", "< 1.30: re-test in 1–3 years", "< 1.3: re-assess every 1–3 years"]
          - ["Next test", "Transient elastography if ≥ 1.30", "VCTE if 1.3–2.67"]
          - ["Direct referral", "Viral/other CLD or signs of cirrhosis", "FIB-4 > 2.67"]
          - ["Stiffness cut-off", "≥ 8 kPa", "≥ 8.0 kPa: hepatology"]
        hide: [[0, 1], [1, 2], [2, 2], [3, 1]]
      - kind: case
        page: 104
        stem: "A 55-year-old man with T2DM (HbA1c 7.9%), BMI 33 and hypertension is seen in diabetes clinic. ALT 28 IU/L. Ultrasound shows a bright liver."
        steps:
          - reveal: "AST 34, ALT 28, platelets 190. FIB-4 is about 1.9."
            question: "Under ADA 2025, what is next?"
            options: ["VCTE (transient elastography)", "Re-assess FIB-4 in 3 years", "Hepatology referral now", "Liver biopsy"]
            answer: 0
            why: "FIB-4 بين **1.3 و 2.67** → VCTE أو alternative test."
          - reveal: "Liver stiffness 10.5 kPa; IQR/median 12%."
            question: "What now?"
            options: ["Hepatology referral", "Reassure and re-test in 1–3 years", "Repeat FibroScan in 1 week", "Stop his diabetes drugs"]
            answer: 0
            why: "**≥ 8.0 kPa** → hepatology referral. والقراءة reliable لأن الـ IQR/median **أقل من 30%**."
      - kind: explain
        page: 105
        title: "مين في الفريق، وبنتابع إزاي؟ (ADA)"
        text: |
          الفريق بيكبر مع الـ stage، زي ما المشكلة بتكبر:

          - **F0–F1**: primary care، و dietitian، و obesity و diabetes teams. المتابعة: FIB-4 every 1–2 years، و LSM (elastography أو ELF) لو FIB-4 أكتر من 1.3.
          - ==F2–F3 (at-risk MASH)==: نفس الفريق، ويدخل hepatologist/GI و endocrinologist. المتابعة: annual imaging (LSM أو MRE) و blood fibrosis biomarkers.
          - **Cirrhosis**: نفس الفريق، ويدخل transplant team (في الـ decompensated) و social support team. المتابعة tailored، و ==screen for HCC==.
      - kind: try
        items: [hb.L06.037, hb.L06.038, hb.L06.039, hb.L06.041, hb.L06.043]
    recap:
      - "**No population screening**؛ بس **screen all prediabetics and T2DM**، حدد الـ high risk، و stage الـ fibrosis."
      - "EASL 2021: FIB-4 **< 1.30** → lifestyle و re-test 1–3 سنين؛ **≥ 1.30** → elastography؛ **≥ 8 kPa** → serum test؛ agree = F3–F4 → refer."
      - "ADA 2025: **< 1.3** كل 1–3 سنين، **1.3–2.67** → VCTE (≥ 8.0 kPa → hepatology)، **> 2.67** → hepatology."
      - "الحد الفوقاني: ص 102 **3.25**، ADA **2.67**، EASL رقم واحد **1.30**."
