  - id: neph.L08.lesson17
    title: "Case 13 و 14: ABMR من غير C4d، و ANCA فوق MPGN"
    hook: "C4d صفر بس الـ graft بيترفض. وراجل 78 سنة عنده proteinuria من سنين، فجأة creatinine نط لـ 8."
    minutes: 10
    pages: [285, 291]
    topics: [transplant, anca-mpgn]
    goals:
      - "تحكم على الـ sample بـ Banff وتحسب الـ scores"
      - "تفهم إزاي ABMR يتشخّص والـ C4d سلبي"
      - "تفرّق MPGN type 3 عن الـ DDD بالـ EM، وتستعمل خريطة الـ IF والـ EM"
    status: unverified
    steps:
      - kind: explain
        page: 285
        title: "Case 13: الـ prograf واطي، والـ biopsy"
        quote: "Prograf trough level was done and was found to be sub-therapeutic."
        text: |
          بعد الـ pulse، الـ creatinine نزل لـ **3.7** وبعدين رجع **4.1**. الـ ==prograf trough طلع sub-therapeutic==، ولما ظبطوا الجرعة الـ creatinine فضل **4**.

          الـ LM: 45 glomeruli، 6 obsolescent:
          - ==moderate glomerulitis== (mononuclear و neutrophils)، endothelial swelling، **red cell fragmentation** و **fibrin thrombi**
          - tubules: moderate injury مع reparative atypia، و patchy moderate **tubulitis**
          - interstitium: mild infiltrate، fibrosis 10%
          - **peritubular capillaries**: diffuse moderate ==capillaritis==
          - arterioles: endothelial swelling و red cell fragmentation و fibrin

          ليه الـ prograf الواطي مهم؟ التفسير المقبول (مش في الكتاب): مستوى IS واطي = الجسم شايف الكلية من غير فرامل، وده أشهر سبب للـ rejection. بس لما المستوى اتظبط والـ creatinine ما نزلش، يعني الضرر **اتعمل خلاص** ومحتاج تشخيص بالـ biopsy.

          ليه الـ certican اتبدّل بـ prograf؟ التفسير المقبول (مش في الكتاب): الـ everolimus (certican) ومعاه MMF مسحوب بيدّي IS أخف، فاحتمال الرفض أعلى، والإسهال ممكن يكون منه برضه. الـ tacrolimus (prograf) مع رجوع الـ MMF بيقفل الباب ده. بس الـ prograf **واطي** بيعمل نفس المشكلة، عشان كده قاسوا الـ trough.
      - kind: figure
        page: 286
        title: "Case 13 بالـ LM"
        image: { file: neph/L08-tx-case13.webp, book: true }
        caption: "Glomerulitis و **fibrin thrombi** و ==peritubular capillaritis==: شكل TMA مع microvascular inflammation."
        alt: "Book panel of four light-microscopy images from case 13 showing inflamed glomeruli with thrombi, tubular injury and inflamed peritubular capillaries."
      - kind: explain
        page: 287
        title: "الـ sample كفاية؟ والـ scores"
        quote: "Adequate sample for scoring ( 39 glomeruli, 2 arteries)."
        text: |
          الـ IH: ==C4d 0== على الـ peritubular capillaries، و **SV40** سلبي.

          الكتاب بيسأل: **Is this sample adequate for Banff scoring?** الإجابة: ==adequate (39 glomeruli، 2 arteries)==.
          - **Acute**: t 2، i 1، v 0، **g 2**، **ptc 2**، aah 0، فالـ acute score **5**
          - **Chronic**: ct 0، ci 0، cv 0، cg 0، ti 0، mm 0، فالـ chronic score **0**

          ليه الـ SV40؟ التفسير المقبول (مش في الكتاب): الـ SV40 stain بيمسك الـ **BK virus** في الـ tubules، والـ BK nephropathy بيعمل tubulitis و reparative atypia زي الـ rejection بالظبط. فلو ما استبعدتوش ممكن تدّي steroids لعدوى. والـ chronic score صفر يعني الضرر **جديد**، فلسه فيه أمل يتعالج.

          إزاي تقرا الحروف دي؟ التفسير المقبول (مش في الكتاب): **t** = tubulitis، **i** = interstitial inflammation، **v** = intimal arteritis، **g** = glomerulitis، **ptc** = peritubular capillaritis، و **aah** = arteriolar hyalinosis. والـ chronic: **ct** tubular atrophy، **ci** interstitial fibrosis، **cv** arterial intimal thickening، **cg** transplant glomerulopathy. كل حرف من 0 لـ 3. ليه 10 glomeruli و 2 arteries كفاية؟ لأن الـ rejection بيبقى **patchy**، فلو العينة صغيرة ممكن تفوّت الـ arteritis اللي بتغيّر الـ grade كله.
      - kind: check
        page: 287
        quote: "Thrombotic Microangiopathy with Microvascular Inflammation Compatible with Acute/Active Antibody Mediated Rejection, C4d Negative For DSA Levels."
        question: "Case 13 has C4d 0, but g 2 and ptc 2 with no glomerulonephritis. Which ABMR criterion does g + ptc = 4 satisfy?"
        options:
          - "Criterion 2: antibody interaction with endothelium (g + ptc ≥ 2)"
          - "Criterion 3: donor-specific antibodies"
          - "None; C4d 0 rules out ABMR"
          - "Criterion 1 only, so it is TCMR"
        answer: 0
        why:
          - "صح: ==[g + ptc] ≥ 2== بيعوّض الـ C4d في المعيار 2. والـ TMA + microvascular inflammation = المعيار 1. فاضل الـ DSA، عشان كده التشخيص بيقول «For DSA Levels»."
          - "الـ DSA لسه مطلوبة، ومش هي اللي الـ g + ptc بيحققها."
          - "الـ C4d مش شرط من Banff 2017."
          - "الـ TCMR هنا borderline بس؛ الـ ABMR هو الأساسي."
      - kind: explain
        page: 287
        title: "Case 13: C4d سلبي بس ABMR"
        quote: "Thrombotic Microangiopathy with Microvascular Inflammation Compatible with Acute/Active Antibody Mediated Rejection, C4d Negative For DSA Levels."
        text: |
          ولد **16 سنة**، end-stage renal disease (ESRD) من **lupus nephritis**، كلية من أبوه. خد CMV واتعالج، وبعدين vomiting و diarrhea و creatinine من 1.9 لـ ==4.3==. الـ cross-match و CMV و BK سلبيين.

          الـ biopsy كفاية (**39 glomeruli، 2 arteries**): glomerulitis، fibrin thrombi، capillaritis، و **C4d 0**. Acute score 5، chronic 0.

          التشخيص: ==thrombotic microangiopathy (TMA) with microvascular inflammation compatible with active ABMR, C4d negative== (اعمل DSA)، و TCMR **borderline**.

          ليه «For DSA Levels»؟ التفسير المقبول (مش في الكتاب): التشخيص اتحقق فيه معيارين من التلاتة (injury + g + ptc ≥ 2)، وفاضل التالت. فالـ pathologist بيقول للـ clinician: «اطلب الـ DSA عشان تقفل التشخيص». والـ **lupus** كسبب أصلي للـ ESRD مهم كمان، لأن الـ lupus ممكن يرجع في الكلية الجديدة، وبرضه ممكن يعمل TMA مع antiphospholipid antibodies، فلازم تتحط في الـ DD.
      - kind: explain
        page: 288
        title: "Case 14: 15 سنة proteinuria وبعدين creatinine 8"
        quote: "Over the next 2 months, sCr level rose rapidly from 1.4 mg/dL to 8.1 mg/dL and he was admitted to hospital."
        text: |
          الحكاية على مراحل:
          - ==proteinuria بتزيد لحد 2 g/day== مع microscopic hematuria. الـ workup للـ CTD والـ malignancy والـ dysproteinemia والـ hepatitis ما طلعش حاجة، **ANA weakly positive**، و CT فيه **mild interstitial pneumonia**. ورفض الـ biopsy.
          - **7 سنين** proteinuria و hematuria ثابتين، والـ creatinine **1.2–1.4**.
          - في **شهرين**: creatinine من 1.4 لـ ==8.1==، و marked L.L edema.
          - الـ labs: Hb 8.7، albumin **1.5**، HCO3 15.4، Ca 7.6، phosphorus 7.3، **C3 و C4 طبيعيين**، ==MPO-ANCA 536== (الطبيعي < 20)، PR3 سلبي، anti-GBM و anti-DNA سلبيين.

          ليه القصة دي محيّرة؟ التفسير المقبول (مش في الكتاب): فيه **مرضين** بسرعتين: مرض بطيء (proteinuria سنين، يعني glomerulus مريض من زمان) ومرض سريع فوقه (RPGN في شهرين). والـ MPO-ANCA العالي مع الـ interstitial pneumonia بيشاور على **ANCA vasculitis** (الـ MPO بيروح مع الرئة الليفية)، بس هو مش هيشرح الـ 15 سنة اللي فاتوا.

          وليه الـ labs التانية؟ التفسير المقبول (مش في الكتاب): الـ **Ca واطي** والـ **phosphorus عالي** والـ **HCO3 واطي** والـ **Hb 8.7**: ده شكل kidney failure متقدم بيتراكم فيه الـ phosphate وتقل فيه الـ bicarbonate. والـ lung markers (الـ surfactant proteins وغيرها) بتقيس نشاط الـ interstitial lung disease، وكانوا قريبين من الطبيعي، يعني الرئة مش نشيطة قوي.
      - kind: explain
        page: 290
        title: "Case 14: راجل 78 سنة بـ RPGN"
        quote: "ANCA-associated CGN superimposed on type 3 membrano-proliferative glomerulonephritis (MPGN)."
        text: |
          عنده hypertension (HTN)، و proteinuria و hematuria من سنين، وفجأة creatinine من 1.4 لـ ==8.1== في شهرين. **MPO-ANCA 536**، C3 و C4 طبيعيين، و mild interstitial pneumonia.

          الـ biopsy: **crescents** في 6 من 9، capillary walls تخينة، IgG و IgM و C3 granular، و electron microscopy (EM) فيه **intra- و trans-membranous** deposits، مش في الـ lamina densa زي الـ dense deposit disease.

          التشخيص: ==ANCA-associated crescentic glomerulonephritis (GN) on top of type 3 membranoproliferative glomerulonephritis (MPGN)==.

          ليه الـ C3 و C4 الطبيعيين مهمين هنا؟ التفسير المقبول (مش في الكتاب): الـ MPGN بيستهلك الـ complement غالبًا، فالطبيعي هنا بيقول إن المرض البطيء **مش نشيط** قوي، وإن اللي قلب الترابيزة هو الـ ANCA. وليه الـ «8 years» في القصة؟ لأن الـ proteinuria القديمة دي هي الـ MPGN، والـ ANCA جه فوقها. فالعلاج بيبدأ بالـ ANCA (اللي بيكسر الكلية دلوقتي)، والسؤال عن الـ MPGN ييجي بعدين.

          وإيه اللي نتعلمه من رفضه للـ biopsy زمان؟ التفسير المقبول (مش في الكتاب): لو الـ biopsy اتعمل وقت الـ proteinuria الأولى، كان ممكن يتعرف الـ MPGN ويتدوّر على سببه بدري. بعد 7 سنين، الـ ANCA جه على كلية تعبانة أصلًا، فالـ reserve كانت أقل والـ creatinine نط لـ 8. يعني الـ biopsy المتأخر بيدّي تشخيص بس بيدّي فرصة أقل. وده نفس الدرس من case 7: التشخيص الكامل بدري بيوفّر كلية.
      - kind: figure
        page: 289
        title: "Case 14 بالـ LM"
        image: { file: neph/L08-case14-lm.webp, book: true }
        caption: "(a) **crescents** مع endocapillary hypercellularity بالـ PAS، (b) جدران تخينة، (c) الـ silver: ==spikes و reticulation== في الـ GBM."
        alt: "Book panel of case 14 light microscopy: a) PAS image with several crescents, b) endocapillary and extracapillary hypercellularity with thick capillary walls, c) methenamine silver showing a thickened GBM with spikes and reticulation."
      - kind: figure
        page: 290
        title: "Case 14 بالـ IF والـ EM"
        image: { file: neph/L08-case14-if-em.webp, book: true }
        caption: "الـ IF: IgG و IgM و C3 **granular** على الجدران. الـ EM: deposits كبيرة ==intra- و trans-membranous==، والـ GBM **reticulated و woven**."
        alt: "Book panel of case 14: immunofluorescence images for IgG, IgM and C3 with heavy granular capillary wall staining, and three electron micrographs with large deposits inside and across the GBM and a disrupted, woven GBM."
      - kind: explain
        page: 289
        title: "ليه مش DDD؟"
        quote: "The deposits were not concentrated in the lamina densa, as was observed in dense-deposit disease."
        text: |
          الـ EM: GBM تخين و **reticulated** فيه deposits كبيرة ==intra- و trans-membranous==، و ==مش متركّزة في الـ lamina densa== زي الـ dense-deposit disease. والـ LM: **6 من 9** فيهم crescents، جدران تخينة، و **epimembranous** deposits متصلة بـ deposits كبيرة **mesangial و subendothelial**، والشرايين **من غير vasculitis**.

          ليه ده **type 3** MPGN؟ التفسير المقبول (مش في الكتاب):
          - الـ type 1 الـ deposits **subendothelial** بس.
          - الـ DDD الـ deposits **جوّه** الـ lamina densa على شكل شريط واحد.
          - الـ type 3 الـ deposits في **كل** الأماكن: فوق (subepithelial)، تحت (subendothelial)، و **عابرة** للغشا. والغشا بيتقطّع ويتبني تاني حواليها، عشان كده شكله «woven».
          والـ IgG و IgM و C3 granular يعني **immune complexes**، فده مش C3 glomerulopathy.

          وإيه اللي يفرق type 3 عن الـ membranous؟ التفسير المقبول (مش في الكتاب): الاتنين فيهم subepithelial deposits و spikes، بس الـ membranous **مفيهوش** proliferation ولا deposits subendothelial كبيرة. هنا فيه deposits في كل مكان، ومعاها mesangial و endocapillary hypercellularity. يعني لو شفت spikes ومعاها cells كتير و subendothelial deposits، ما تقولش membranous؛ فكّر في type 3 MPGN أو lupus.
