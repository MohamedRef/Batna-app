        prompt: "ليه الـ NCS مش لازمة في الـ DPN العادية، مع إنها أدق من الـ monofilament؟"
        answer: |
          التفسير المقبول (مش في الكتاب): التشخيص هنا **clinical**. العيان عنده سكر، والأعراض **symmetric** وبتبدأ من الرجلين، والفحص على السرير أكدها. نتيجة الـ NCS مش هتغيّر العلاج: هتفضل تظبط السكر وتحمي الرجل وتعالج الوجع.

          الـ NCS تفيدك لما الصورة **مش شبه السكر** (ضعف في ناحية واحدة، أو حركي أكتر من حسي، أو بيتقدم بسرعة)، وده بالظبط اللي الكتاب بيقوله: بس لو شاكك في **non-diabetic cause**.
