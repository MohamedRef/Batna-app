items:
  # ---------------- sample-size (slides 1-21) ----------------
  - id: res.L07.001
    kind: card
    topic: sample-size
    front: Why must the sample size of a clinical trial be calculated, rather than guessed?
    back: >-
      Too small a sample gives insignificant results and wastes the effort; too large a sample wastes money,
      because every subject in a trial costs a lot, so even one extra subject is poor financial management.
    src: { page: 1, quote: "Too small a sample would produce insignificant results and would be a waste of efforts" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.002
    kind: card
    topic: sample-size
    front: What is a type I (alpha) error?
    back: >-
      A false-positive conclusion: rejecting a true null hypothesis, that is, detecting a difference that is not really present.
      In plain words: putting a useless medicine onto the market.
    src: { page: 3, quote: "describes the phenomenon of detecting a difference that is not really present" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.003
    kind: card
    topic: sample-size
    front: What is a type II (beta) error?
    back: >-
      A false-negative conclusion: failing to reject a false null hypothesis, so a real difference is missed.
      In plain words: keeping a good medicine away from patients.
    src: { page: 4, quote: "keep a good medicine away from patients" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.004
    kind: table
    topic: sample-size
    title: Possible trial outcomes
    columns: [Trial result, "Truth: no real difference", "Truth: real difference"]
    rows:
      - [Treatments differ, Type I error (alpha), Correct (power)]
      - [Treatments do not differ, Correct, Type II error (beta)]
    blanks: [[0, 1], [1, 2], [0, 2]]
    src: { page: 5, quote: "Possible trial outcomes" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.005
    kind: card
    topic: sample-size
    front: What is power, and how is it calculated?
    back: >-
      Power = 1 - beta: the ability of the study to find true differences of a given size (delta),
      that is, the chance of correctly identifying a better medicine.
    src: { page: 6, quote: "Power quantifies the ability of the study to find true differences" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.006
    kind: card
    topic: sample-size
    front: What is the minimal clinically relevant difference (MCRD, delta)? Give the lecture's two examples.
    back: >-
      The smallest difference between the groups that the investigator considers clinically relevant.
      Continuous outcome: 5 kg of body weight. Binary outcome (myocardial infarction yes/no): a 10% difference between treatment and control groups.
    src: { page: 7, quote: "an investigator could choose a difference of 10% between the treatment group and the control group as MCRD" }
    status: unverified
  - id: res.L07.007
    kind: enumerate
    topic: sample-size
    prompt: Enumerate the five factors that affect the sample size of an RCT.
    points:
      - Alpha (type I error)
      - Beta (type II error)
      - Power (1 - beta)
      - Minimal clinically relevant difference (MCRD, delta)
      - Variance of the outcome (SD for a continuous outcome)
    pass: 4
    src: { page: 8, quote: "Factors affecting sample size of RCT" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.008
    kind: table
    topic: sample-size
    title: "Increase the factor: what happens to the sample size?"
    columns: [Factor increased, Sample size needed, Why]
    rows:
      - [Alpha (accept more type I error), Smaller, Z for alpha falls]
      - [Power, Larger, Z for beta rises]
      - [MCRD (delta), Smaller, A big difference is easy to see]
      - [Variance (SD of the outcome), Larger, More variability hides the difference]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 8, quote: "The variability of the outcome measure as the SD in case of continuous outcome" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.009
    kind: card
    topic: sample-size
    front: What goes wrong if the margin delta is set too large, or too small?
    back: >-
      Too large: several inefficacious drugs reach the market, because they can be judged non-inferior or equivalent.
      Too small: some potentially useful drugs are neglected.
    src: { page: 9, quote: "several inefficacious drugs will appear in the market" }
    status: unverified
  - id: res.L07.010
    kind: card
    topic: sample-size
    front: Write the simple sample-size formula for a difference in proportions, and name each part.
    back: >-
      n per group = 2 x p(1 - p) x (Z-beta + Z-alpha/2)^2 / (p1 - p2)^2. p(1 - p) is the variability, Z-beta the desired power
      (0.84 for 80%), Z-alpha/2 the significance level (1.96 for 0.05), and p1 - p2 the effect size. It assumes equal-sized groups.
    src: { page: 10, quote: "Simple formula for difference in proportions" }
    status: unverified
  - id: res.L07.011
    kind: cloze
    topic: sample-size
    text: >-
      For a difference in means, n per group = 2 x {{c1::sigma squared (SD of the outcome)}} x (Z-beta + Z-alpha/2)^2 / difference squared (the effect size).
      Z-beta is typically {{c2::0.84}} for 80% power and Z-alpha/2 is typically {{c3::1.96}}.
    src: { page: 11, quote: "typically .84 for 80% power" }
    status: unverified
  - id: res.L07.012
    kind: card
    topic: sample-size
    front: What is the most feasible way to improve the estimate of random error in a trial?
    back: Recruit a sufficient number of subjects according to a sample-size calculation (power analysis).
    src: { page: 2, quote: "recruit a sufficient number of subjects according to a sample size calculation or power analysis" }
    status: unverified
  - id: res.L07.013
    kind: mcq
    topic: sample-size
    stem: >-
      An RCT comparing two drugs shows a difference between them (p < 0.05), but in reality the two groups do not differ.
      This is an example of:
    options:
      - Type 1 error (alpha error)
      - Type 2 error (beta error)
      - 1 - alpha
      - 1 - beta
    answer: 0
    why:
      - The trial found a difference that is not really there, a false positive.
      - A type 2 error misses a real difference; here there was none to miss.
      - 1 - alpha is the chance of correctly finding no difference.
      - 1 - beta is power, the chance of correctly finding a real difference.
    src: { page: 13, quote: "Assume in reality, however, the 2 groups do not differ" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.014
    kind: mcq
    topic: sample-size
    stem: Which of the following best describes a type I error?
    options:
      - The null is true, but we mistakenly reject it.
      - The null is false and we reject it.
      - The null is false, but we fail to reject it.
      - The null is true and we fail to reject it.
    answer: 0
    why:
      - Rejecting a true null is a false positive, which is a type I error.
      - Rejecting a false null is the correct decision; its probability is the power.
      - Failing to reject a false null is a type II error.
      - Keeping a true null is the correct decision (1 - alpha).
    src: { page: 14, quote: "The null is true, but we mistakenly reject it" }
    status: unverified
  - id: res.L07.015
    kind: mcq
    topic: sample-size
    stem: In a statistical test of hypotheses, a type II error is committed if
    options:
      - We reject the null hypothesis when it is in fact valid.
      - We fail to reject the null hypothesis when it is in fact invalid.
      - We reject the null hypothesis when it is in fact invalid.
      - We fail to reject the null hypothesis when it is in fact valid.
    answer: 1
    why:
      - That is a type I error.
      - A false null that survives is a missed difference, a false negative.
      - That is the correct decision (power).
      - That is also a correct decision.
    src: { page: 15, quote: "We fail to reject the null hypothesis when, in fact, the null hypothesis is invalid" }
    status: unverified
  - id: res.L07.016
    kind: mcq
    topic: sample-size
    stem: Which alpha level gives the smallest chance of committing a type I error?
    options: ["0.025", "0.10", "0.01", "0.05"]
    answer: 2
    why:
      - 0.025 allows a 2.5% chance, more than 0.01.
      - 0.10 is the largest chance of the four.
      - Alpha is the type I error rate itself, so the smallest alpha, 0.01, is the smallest chance.
      - 0.05 allows a 5% chance.
    src: { page: 16, quote: "Which alpha level provides the smallest chance of committing a Type I error" }
    status: unverified
  - id: res.L07.017
    kind: mcq
    topic: sample-size
    stem: >-
      In a well-designed trial of ovarian cancer treatment, remission at one year is similar for a new drug and usual care, p = 0.4.
      This means that
    options:
      - Both treatments are effective
      - Neither treatment is effective
      - The statistical power of this study is 60%
      - The best estimate of the treatment effect is 0.4
      - It is not possible to decide which treatment is better from this information
    answer: 4
    why:
      - A non-significant comparison says nothing about whether either works against no treatment.
      - There was no placebo arm, so we cannot say neither works.
      - Power is planned from alpha, beta, delta and variance; it is not 1 - p.
      - The p value is a probability, not the size of the effect.
      - p = 0.4 is not significant, and without the effect size and its CI we cannot pick a winner.
    src: { page: 17, quote: "It is not possible to decide which treatment is better based on these information" }
    status: unverified
  - id: res.L07.018
    kind: mcq
    topic: sample-size
    stem: All of the following can be increased to get a smaller sample size in an RCT EXCEPT
    options: [Alpha error, Power, MCRD (delta), Beta error]
    answer: 1
    why:
      - Accepting a larger alpha lowers Z-alpha, so fewer subjects are needed.
      - Higher power raises Z-beta, so more subjects are needed.
      - A larger difference is easier to detect, so fewer subjects are needed.
      - Accepting a larger beta means lower power, so fewer subjects are needed.
    src: { page: 18, quote: "All of the followings can be increased to get smaller sample size in RCT EXCEPT" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.019
    kind: mcq
    topic: sample-size
    stem: >-
      For your RCT, you want 80% power to detect a reduction of 10 points or more in the treatment group relative to placebo.
      What is the 10 in your sample-size formula?
    options: [Standard deviation, Mean change, Effect size, Standard error, Significance level]
    answer: 2
    why:
      - The SD is the variability of the outcome, a separate input.
      - It is a planned difference between groups, not the mean change in one group.
      - The smallest difference worth detecting is the effect size (MCRD, delta).
      - The standard error comes out of the data, not the plan.
      - The significance level is alpha, typically 0.05.
    src: { page: 20, quote: "you want 80% power to detect a reduction of 10 points or more in the treatment group relative to placebo" }
    status: unverified
  - id: res.L07.020
    kind: mcq
    topic: sample-size
    stem: >-
      A significance test based on a small sample may not give a statistically significant result even if the true value
      differs substantially from the null value. This type of result is known as
    options:
      - The significance level of the test
      - The power of the study
      - A type 1 error
      - A type 2 error
    answer: 3
    why:
      - The significance level is alpha, fixed before the test.
      - Power is the chance of avoiding exactly this miss.
      - A type 1 error is a false positive; this is a false negative.
      - A real difference was missed, a false negative, which small samples make likely.
    src: { page: 21, quote: "may not produce a statistically significant result even if the true value differs substantially from the null value" }
    status: unverified
  # ---------------- conduct (slides 22-25, 45-50) ----------------
  - id: res.L07.021
    kind: card
    topic: conduct
    front: What does step 6 (detailed descriptions of protocols) require?
    back: >-
      Detailed protocols of clinical procedures, laboratory investigations, and questionnaire and interview protocols,
      written explicitly for every variable: intervention, co-intervention, confounders, and major and minor outcomes.
    src: { page: 22, quote: "Detailed protocols of clinical procedures, laboratory investigations as well as the details of questionnaire and interview protocols" }
    status: unverified
  - id: res.L07.022
    kind: enumerate
    topic: conduct
    prompt: For each variable in the trial protocol, which questions must be written down clearly?
    points:
      - Who will make the measurement?
      - When will it be made?
      - What equipment or instrument will be used?
      - What technique will be used?
      - How will the equipment, techniques and personnel be standardized and validated?
    pass: 4
    src: { page: 23, quote: "How the equipment, techniques and personnel be standardized and validated" }
    status: unverified
  - id: res.L07.023
    kind: card
    topic: conduct
    front: What should be presented in step 7, enrolling the participants?
    back: A "Recruitment and Participation Flow Chart" giving the numbers (n) at each step.
    src: { page: 24, quote: "Recruitment and Participation Flow Chart" }
    status: unverified
  - id: res.L07.024
    kind: card
    topic: conduct
    front: In step 9, how should the placebo be prepared, and what else must be planned?
    back: >-
      The placebo must have the same shape, colour, size and taste and be given by similar procedures.
      Procedures for checking compliance must also be developed.
    src: { page: 45, quote: "same shape, colour, size and taste" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.025
    kind: card
    topic: conduct
    front: What rule applies to data collection in the two study groups, and what happens if it is broken?
    back: >-
      Data for each group must be of the same quality: treatment (assigned and received) recorded, and outcome criteria
      explicitly stated and measured comparably in all groups. Otherwise there is observer bias.
    src: { page: 46, quote: "It is essential that data collected for each of the study groups be of the same quality" }
    status: unverified
  - id: res.L07.026
    kind: card
    topic: conduct
    front: Why is blinding step 10 of an RCT, and who can be blinded?
    back: >-
      Knowing whether a participant is in the treatment or control group can influence behaviour.
      It is overcome by blinding the participants, the observer and/or the data reviewer.
    src: { page: 47, quote: "Knowledge of whether the participant is in a treatment or control group can influence behaviour" }
    status: unverified
  - id: res.L07.027
    kind: card
    topic: conduct
    front: In step 11, how long are subjects followed, and what must be avoided?
    back: >-
      Until the end point or the end of the trial period, whichever is earlier.
      Losses to follow-up must be avoided, because they can seriously bias the results.
    src: { page: 48, quote: "Follow up the subjects till the end point, or the period of trial, whichever is earlier" }
    status: unverified
  - id: res.L07.028
    kind: enumerate
    topic: conduct
    prompt: "Stopping rules: when may an RCT be stopped early?"
    points:
      - Larger than expected benefit
      - Larger than expected harm
      - No important difference between the groups
      - Clearly high mortality or complications in the intervention group
    pass: 3
    src: { page: 49, quote: "Evidence of clearly high mortality or complication in the intervention group" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.029
    kind: mcq
    topic: conduct
    stem: A randomized, single-masked experimental study is conducted. Which of the following problems is surely avoided?
    options:
      - Noncompliance
      - Confounding
      - Biased assessment of the disease outcome
      - Loss to follow-up
    answer: 2
    why:
      - Masking does not make people take their treatment.
      - Randomization balances confounders on average but cannot guarantee it, so it is not surely avoided.
      - "This is the slide's answer: masking is the tool against biased outcome assessment. Strictly, single masking hides the group from one party only."
      - People can still drop out of a masked trial.
    src: { page: 50, quote: "Suppose that a randomized single masked experimental study is conducted" }
    status: unverified
  # ---------------- randomization (slides 26-34) ----------------
  - id: res.L07.030
    kind: enumerate
    topic: randomization
    prompt: How does randomization avoid bias? (slide 26)
    points:
      - Ensures the next assignment is unpredictable
      - Reduces baseline differences in risk between treatment and control groups
      - It is the only way to control for unknown factors
      - Makes both groups similar in the distribution of confounding variables
    pass: 3
    src: { page: 26, quote: "Only way to control for unknown factors" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.031
    kind: enumerate
    topic: randomization
    prompt: Enumerate the three benefits of randomization quoted on slide 27.
    points:
      - Eliminates bias in treatment assignment (selection bias and confounding)
      - Facilitates blinding (masking) of treatments from investigators, participants and assessors
      - Permits probability theory to express how likely a difference is due to chance
    pass: 3
    src: { page: 27, quote: "It permits the use of probability theory to express the likelihood that any difference in outcome between treatment groups merely indicates chance" }
    status: unverified
  - id: res.L07.032
    kind: card
    topic: randomization
    front: How does the size of the randomized groups affect baseline balance?
    back: The larger the randomized groups, the greater the probability of equal baseline risks.
    src: { page: 26, quote: "larger the randomized groups, the greater the probability of equal baseline risks" }
    status: unverified
  - id: res.L07.033
    kind: enumerate
    topic: randomization
    prompt: Enumerate the three methods of random allocation of subjects.
    points:
      - Simple randomization
      - Block randomization
      - Stratified randomization
    pass: 3
    src: { page: 28, quote: "How to Do Random Allocation of subjects" }
    status: unverified
  - id: res.L07.034
    kind: card
    topic: randomization
    front: What is the purpose of block randomization, and what are its steps?
    back: >-
      To give groups of equal sample size. Divide patients into blocks, list the ways a block can be balanced, choose the blocks randomly,
      and randomize within each block.
    src: { page: 29, quote: "Divide potential patients into blocks" }
    status: unverified
  - id: res.L07.035
    kind: cloze
    topic: randomization
    text: >-
      With two treatments A and B and a block size of 4, there are {{c1::6}} ways to assign participants equally:
      AABB, BBAA, ABAB, BABA, ABBA and BAAB. A study of 20 participants would use {{c2::5}} such blocks.
    src: { page: 29, quote: "given a block size of 4, there are 6 possible ways to equally assign participants to a block" }
    status: unverified
  - id: res.L07.036
    kind: card
    topic: randomization
    front: How large should a randomization block be?
    back: >-
      It depends on the number of treatments. Short enough to prevent imbalance, and long enough to prevent guessing the allocation.
    src: { page: 29, quote: "it should be short enough to prevent imbalance, and long enough to prevent guessing allocation" }
    status: unverified
  - id: res.L07.037
    kind: card
    topic: randomization
    front: What is stratified randomization, and how is it done?
    back: >-
      It balances covariates (prognostic variables) between groups. A separate block is made for each combination of covariates,
      then simple randomization is done within each block.
    src: { page: 31, quote: "Stratified randomization is achieved by generating a separate block for each combination of covariates" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.038
    kind: case
    topic: randomization
    stem: >-
      A trial enrols 1,000 patients: 600 males (360 young, 240 old) and 400 females (300 young, 100 old).
      They are stratified by sex, then by age, and each subgroup is randomized to new or current treatment.
    steps:
      - question: How many strata (sub-groups) are randomized?
        options: ["2", "4", "6", "1,000"]
        answer: 1
        why: Sex (2) x age (2) = 4 sub-groups, each randomized separately.
      - question: How many young males end up on the new treatment?
        options: ["360", "180", "120", "150"]
        answer: 1
        why: Half of each stratum goes to each arm, so 360 / 2 = 180.
      - question: How many patients does each arm get in total?
        options: ["500 (180 + 120 + 150 + 50)", "600", "400", "It cannot be predicted"]
        answer: 0
        why: Each arm gets half of every stratum, so 180 + 120 + 150 + 50 = 500, balanced for sex and age.
    src: { page: 32, quote: "Stratify By Sex" }
    status: unverified
  - id: res.L07.039
    kind: card
    topic: randomization
    front: How was stratification used in the lecture's zidovudine trial in pregnant women?
    back: >-
      Eligible women were stratified by gestational age at entry (14-26 weeks vs more than 26 weeks),
      then randomized within each stratum to zidovudine or placebo.
    src: { page: 33, quote: "Eligible women" }
    status: unverified
  - id: res.L07.040
    kind: mcq
    topic: randomization
    stem: Which of the following statements about the advantages of randomized design is INCORRECT?
    options:
      - Randomization removes selection bias in the allocation of participants to the intervention or control group
      - Randomization guarantees that all participants will receive the intervention
      - Randomization tends to produce comparable groups on measured as well as unknown or unmeasured confounders
      - Randomization permits probability theory to judge whether a difference is due to chance
    answer: 1
    why:
      - This is a true advantage.
      - Randomization decides who gets what, and the control group by design does not get the intervention; it guarantees nothing about receiving it.
      - This is a true advantage.
      - This is a true advantage (slide 27).
    src: { page: 34, quote: "Randomization guarantee that all participants will receive the intervention" }
    status: unverified
  # ---------------- concealment (slides 35-44) ----------------
  - id: res.L07.041
    kind: enumerate
    topic: concealment
    prompt: Enumerate the standard methods of allocation concealment.
    points:
      - Sequentially numbered, opaque, sealed envelopes (SNOSE)
      - Pharmacy-controlled allocation
      - Off-site centralized randomization centre
    pass: 3
    src: { page: 35, quote: "Sequentially numbered, opaque, sealed envelopes" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.042
    kind: table
    topic: concealment
    title: Allocation concealment vs blinding
    columns: [Feature, Allocation concealment, Blinding]
    rows:
      - [When, Before and until the intervention is given, After allocation (once the trial begins)]
      - [Bias prevented, Selection bias, "Ascertainment (performance, assessment) bias"]
      - [Feasible?, Always, Not always]
    blanks: [[0, 1], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 37, quote: "Prevents selection bias Prevents ascertainment bias" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.043
    kind: card
    topic: concealment
    front: What happens if allocation is not concealed?
    back: Selection bias. The benefits of randomization are lost, and treatment assignment is no longer truly random.
    src: { page: 36, quote: "treatment assignment is no longer truly random" }
    status: unverified
  - id: res.L07.044
    kind: card
    topic: concealment
    front: What happens if blinding is not done?
    back: >-
      Patients may bias their responses because they know their treatment, and investigators who know the treatment may assess outcomes in a biased way.
    src: { page: 36, quote: "If not done, can result in patients biasing their responses because of their knowledge of treatment" }
    status: unverified
  - id: res.L07.045
    kind: card
    topic: concealment
    front: Who should hold the randomization list?
    back: >-
      Someone separate and distant from the clinicians conducting the trial. The clinician learns only the pack number (for example X32)
      and is told what it contained after the trial.
    src: { page: 39, quote: "Randomization should be separate & distant from clinicians conducting the trial" }
    status: unverified
  - id: res.L07.046
    kind: mcq
    topic: concealment
    stem: Allocation concealment reduces bias because
    options:
      - It prevents researchers from influencing which participants are assigned to the intervention or control group.
      - It prevents the participants from knowing which arm of the trial they are on.
      - It makes the placebo look identical to the active drug.
      - It increases the power of the trial.
    answer: 0
    why:
      - Concealment protects the sequence before assignment, so recruiters cannot steer patients, which prevents selection bias.
      - Hiding the arm from participants after allocation is blinding.
      - An identical placebo is part of blinding (step 9).
      - Power depends on sample size, alpha and effect size, not on concealment.
    src: { page: 40, quote: "It prevents researchers from influencing which participants are assigned to the intervention/ control group" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.047
    kind: mcq
    topic: concealment
    stem: Which is NOT an issue with RCTs?
    options: [Contamination, Losses to follow-up, Recall bias, Bias in assessment of outcome]
    answer: 2
    why:
      - Controls can pick up the intervention, which is a real RCT problem.
      - Losses to follow-up can seriously bias the results.
      - Recall bias comes from asking about past exposure, as in case-control studies; in an RCT the exposure is assigned and recorded.
      - Without blinding, outcome assessment can be biased.
    src: { page: 41, quote: "Which is not an issue with RCTs" }
    status: unverified
  - id: res.L07.048
    kind: mcq
    topic: concealment
    stem: A difference between the groups at the start, for example more severe illness in one group, is
    options: [Bias, Chance, Random error, Measurement error]
    answer: 0
    why:
