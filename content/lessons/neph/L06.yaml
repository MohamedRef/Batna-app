  # ------------------------------------------------------------------
  - id: neph.L06.lesson2
    title: "SIADH: الـ ADH شغال من غير سبب"
    hook: "كلية سليمة، عيان مش وارم ومش ناشف، والـ Na بينزل. ولو اديته saline هينزل أكتر. ليه؟"
    minutes: 9
    pages: [130, 130]
    topics: [siadh]
    goals:
      - "تحفظ الـ Bartter and Schwartz criteria وتفهم ليه كل واحد فيهم موجود"
      - "تعرف ليه الـ uric acid واطي وليه الـ normal saline بيبوّظ"
      - "تعرف أسباب الـ SIADH وليه المجموعات دي بالذات"
    status: unverified
    steps:
      - kind: explain
        page: 130
        title: "SIADH: ADH شغال من غير سبب"
        quote: "Box 3: Diagnostic Criteria and Clinical Data Consistent With SIADH\nBartter & Schwartz Criteria for SIADH:\n  Hypotonic hyponatremia (effective SOsm < 275 mOsm/kg H2O)\n  Euvolemia\n  Less than maximally dilute urine (UOsm > 100 mOsm/kg H2O)\n  Elevated urine sodium excretion commensurate with lack of avid sodium retention during normal intake of sodium and water (UNa > 30 mEq/L)\n  Absence of advanced kidney disease, cirrhosis, or heart failure\n  Absence of alternative causes of euvolemic hypotonic hyponatremia with less than maximally dilute urine including but not limited to hypothyroidism, glucocorticoid insufficiency, or diuretic use\nAdditional Data Supporting Diagnosis of SIADH:\n  Serum uric acid < 4 mg/dL\n  Fractional excretion of uric acid > 10%\n  Worsening of hyponatremia with IV normal saline solution infusion\n  Plasma vasopressin or copeptin level inappropriately elevated relative to serum osmolality\n  Abnormal response to water load (excretion of < 80% of 20 mL/kg load in 4 h with failure to dilute urine to <100 mOsm/kg H2O)"
        text: |
          الـ ==syndrome of inappropriate antidiuretic hormone secretion (SIADH)== = ADH بيتفرز رغم إن الـ osmolality واطية، فالكلية تحبس ميه.

          **Bartter & Schwartz criteria**:
          - **Hypotonic**: serum osm **أقل من 275**.
          - **Euvolemia**.
          - بول **مش مخفف للآخر**: urine osm **أكتر من 100**.
          - **Urine Na أكتر من 30** مع أكل وشرب عادي.
          - مفيش kidney disease متقدم ولا cirrhosis ولا heart failure.
          - مفيش hypothyroidism ولا نقص glucocorticoid ولا diuretics.

          واسمها **inappropriate** **لأن** مفيش سبب يخلي الجسم يحبس ميه وهو أصلًا مخفف.
      - kind: explain
        page: 130
        title: "ليه كل criterion موجود؟"
        quote: "Elevated urine sodium excretion commensurate with lack of avid sodium retention during normal intake of sodium and water"
        text: |
          الـ criteria مش قايمة للحفظ وبس، كل واحد بيقفل باب. التفسير المقبول (مش في الكتاب):

          - **Serum osm أقل من 275**: علشان تتأكد إن الـ Na واطي **بجد**، مش pseudo ولا سكر (اللي شفناهم في الدرس اللي فات).
          - **Euvolemia**: الميه اللي بتتحبس بتتوزع على كل الجسم، جوّه الخلايا وبرّه، فالعيان ما بيورمش.
          - **Urine osm أكتر من 100**: ده قلب الحكاية. الـ osm في الدم واطية، فالمفروض الكلية تطلّع بول مخفف على الآخر. لو لسه مركّز، يبقى في ADH شغال ==inappropriately==.
          - **Urine Na أكتر من 30**: الكتاب بيقول "commensurate with lack of avid sodium retention": الجسم مش ناشف، فالكلية مش بتحوّش ملح وبتطلّع اللي بياكله.
          - **استبعاد الـ heart failure والـ cirrhosis والكلى والـ hypothyroidism ونقص الـ glucocorticoid والـ diuretics**: لأنهم بيعملوا صورة شبهه بس الـ ADH فيهم ليه سبب.
      - kind: mnemonic
        page: 130
        quote: "Box 3: Diagnostic Criteria and Clinical Data Consistent With SIADH\nBartter & Schwartz Criteria for SIADH:\n  Hypotonic hyponatremia (effective SOsm < 275 mOsm/kg H2O)\n  Euvolemia\n  Less than maximally dilute urine (UOsm > 100 mOsm/kg H2O)\n  Elevated urine sodium excretion commensurate with lack of avid sodium retention during normal intake of sodium and water (UNa > 30 mEq/L)\n  Absence of advanced kidney disease, cirrhosis, or heart failure\n  Absence of alternative causes of euvolemic hypotonic hyponatremia with less than maximally dilute urine including but not limited to hypothyroidism, glucocorticoid insufficiency, or diuretic use\nAdditional Data Supporting Diagnosis of SIADH:\n  Serum uric acid < 4 mg/dL\n  Fractional excretion of uric acid > 10%\n  Worsening of hyponatremia with IV normal saline solution infusion\n  Plasma vasopressin or copeptin level inappropriately elevated relative to serum osmolality\n  Abnormal response to water load (excretion of < 80% of 20 mL/kg load in 4 h with failure to dilute urine to <100 mOsm/kg H2O)"
        word: "SIADH-X"
        parts:
          - { key: "S", text: "Serum osm < 275 (hypotonic)" }
          - { key: "I", text: "Isovolemic: euvolemia" }
          - { key: "A", text: "Above 100: urine osm not maximally dilute" }
          - { key: "D", text: "Discharging Na: urine Na > 30" }
          - { key: "H", text: "Heart, liver, kidney: no advanced failure" }
          - { key: "X", text: "eXclude other causes: hypothyroidism, glucocorticoid insufficiency, diuretics" }
        hook: "**SIADH-X**: الاسم نفسه + X. ستة criteria لستة حروف، والأرقام بالترتيب: **275، 100، 30**."
      - kind: explain
        page: 130
        title: "أدلة زيادة"
        quote: "Box 3: Diagnostic Criteria and Clinical Data Consistent With SIADH\nBartter & Schwartz Criteria for SIADH:\n  Hypotonic hyponatremia (effective SOsm < 275 mOsm/kg H2O)\n  Euvolemia\n  Less than maximally dilute urine (UOsm > 100 mOsm/kg H2O)\n  Elevated urine sodium excretion commensurate with lack of avid sodium retention during normal intake of sodium and water (UNa > 30 mEq/L)\n  Absence of advanced kidney disease, cirrhosis, or heart failure\n  Absence of alternative causes of euvolemic hypotonic hyponatremia with less than maximally dilute urine including but not limited to hypothyroidism, glucocorticoid insufficiency, or diuretic use\nAdditional Data Supporting Diagnosis of SIADH:\n  Serum uric acid < 4 mg/dL\n  Fractional excretion of uric acid > 10%\n  Worsening of hyponatremia with IV normal saline solution infusion\n  Plasma vasopressin or copeptin level inappropriately elevated relative to serum osmolality\n  Abnormal response to water load (excretion of < 80% of 20 mL/kg load in 4 h with failure to dilute urine to <100 mOsm/kg H2O)"
        text: |
          أدلة تانية تدعّم الـ **SIADH**:

          - **Serum uric acid أقل من 4 mg/dL** و fractional excretion (FE) uric acid **أكتر من 10%**.
          - الـ Na ==بيسوء مع normal saline== (الكلية بتطلّع الملح وتحبس الميه).
          - **Vasopressin أو copeptin** عالي بالنسبة للـ osmolality.
          - **Water load test** غلط: يطلّع أقل من 80% من 20 mL/kg في 4 ساعات، والبول ما يتخففش تحت 100.

          والـ **copeptin** بيتقاس بدل الـ vasopressin **لأن** الاتنين بيطلعوا من نفس الجزيء، والـ copeptin أثبت وأسهل في القياس (التفسير المقبول، مش في الكتاب).
      - kind: reveal
        page: 130
        quote: "Serum uric acid < 4 mg/dL"
        prompt: "ليه الـ uric acid بيبقى واطي في الـ SIADH، وإزاي ده بيفرّقه عن الـ hyponatremia بتاعة الجفاف؟"
        answer: |
          الكتاب بيدّي الأرقام: **uric acid أقل من 4 mg/dL** و **FE uric acid أكتر من 10%**.

          التفسير المقبول (مش في الكتاب): في الـ SIADH الـ ECF زايد شوية، فالـ **proximal tubule** بيرجّع حاجات أقل، والـ urate بيتغسل في البول. أما العيان الناشف، فالـ proximal tubule بيمسك كل حاجة، والـ ==uric acid بيعلى==.

          يعني عيانين الاتنين Na 125 وurine Na عالي: الـ uric acid الواطي بيشاور على الـ SIADH.
      - kind: aside
        tone: trap
        page: 130
        quote: "Box 3: Diagnostic Criteria and Clinical Data Consistent With SIADH\nBartter & Schwartz Criteria for SIADH:\n  Hypotonic hyponatremia (effective SOsm < 275 mOsm/kg H2O)\n  Euvolemia\n  Less than maximally dilute urine (UOsm > 100 mOsm/kg H2O)\n  Elevated urine sodium excretion commensurate with lack of avid sodium retention during normal intake of sodium and water (UNa > 30 mEq/L)\n  Absence of advanced kidney disease, cirrhosis, or heart failure\n  Absence of alternative causes of euvolemic hypotonic hyponatremia with less than maximally dilute urine including but not limited to hypothyroidism, glucocorticoid insufficiency, or diuretic use\nAdditional Data Supporting Diagnosis of SIADH:\n  Serum uric acid < 4 mg/dL\n  Fractional excretion of uric acid > 10%\n  Worsening of hyponatremia with IV normal saline solution infusion\n  Plasma vasopressin or copeptin level inappropriately elevated relative to serum osmolality\n  Abnormal response to water load (excretion of < 80% of 20 mL/kg load in 4 h with failure to dilute urine to <100 mOsm/kg H2O)"
        text: "فخ كلاسيكي: تدي عيان SIADH **normal saline** والـ Na **ينزل أكتر**. الملح بيخرج في البول المركّز والميه بتفضل. علشان كده الـ SIADH بيتعالج بـ **water restriction** مش saline."
      - kind: explain
        page: 130
        title: "الـ saline بالأرقام"
        quote: "Worsening of hyponatremia with IV normal saline solution infusion"
        text: |
          الكتاب بيقول الـ hyponatremia ==بتسوء مع الـ normal saline==. خلّينا نشوف ليه بحسبة بسيطة (التفسير المقبول، مش في الكتاب):

          - لتر **0.9% saline** فيه حوالي **308 mOsm**.
          - عيان SIADH بوله ثابت تقريبًا عند **600 mOsm/kg** لأن الـ ADH شغال.
          - الكلية هتطلّع الـ 308 mOsm دول في حوالي **نص لتر** بول.
          - النص لتر التاني **ميه حرة** فضلت في الجسم.

          النتيجة: اديته ملح، طلّع الملح واحتفظ بالميه، والـ Na **نزل**. وكل ما البول أركز، كل ما الـ saline يبقى أسوأ.
      - kind: match
        page: 130
        quote: "Box 4: Common Causes of SIADH\nCNS disease:\n  Brain abscess, encephalitis, head trauma, intracranial hemorrhage, meningitis, tumor\nDrugs:\n  Amiodarone, carbamazepine, oxcarbazepine, 3,4-methylenedioxy-methamphetamine (MDMA, \"Ecstasy\"), nicotine, phenothiazines, opioids, selective serotonin re-uptake inhibitors, tricyclic antidepressants, cyclophosphamide, chlorpropamide, vincristine\nMalignancy:\n  Most commonly small cell carcinoma of the lung followed by head and neck cancer and non−small cell lung cancer\nPulmonary disease:\n  Acute respiratory failure, COPD, pneumonia, tuberculosis\nOther:\n  HIV infection, idiopathic, postoperative state, reset osmostat"
        prompt: "وصّل كل مثال بمجموعته في أسباب الـ SIADH:"
        pairs:
          - ["Meningitis, head trauma", "CNS disease"]
          - ["Carbamazepine, SSRIs, vincristine", "Drugs"]
          - ["Small cell lung carcinoma", "Malignancy"]
          - ["Pneumonia, tuberculosis, COPD", "Pulmonary disease"]
          - ["HIV, postoperative state", "Other"]
        why: "أشهر malignancy هو ==small cell carcinoma of the lung==، بعده head and neck و non-small cell."
      - kind: explain
        page: 130
        title: "ليه المجموعات دي بالذات؟"
        quote: "CNS disease: Brain abscess, encephalitis, head trauma, intracranial hemorrhage, meningitis, tumor"
        text: |
          الكتاب بيدّي **Box 4**، والتفسير المقبول (مش في الكتاب) لكل مجموعة:

          - **CNS disease**: الـ ADH بيتعمل في الـ hypothalamus ويطلع من الـ pituitary. أي التهاب أو نزيف أو ورم جنبهم ممكن يخليه يفرز من غير حساب.
          - **Malignancy**: الـ ==small cell carcinoma of the lung== بيصنّع ADH بنفسه (ectopic)، فمحدش يقدر يوقفه.
          - **Pulmonary disease**: الـ pneumonia والـ TB والـ respiratory failure بيبعتوا إشارات من الصدر بتنبّه إفراز الـ ADH.
          - **Drugs**: منهم اللي بيزوّد الإفراز (carbamazepine، SSRIs، opioids) ومنهم اللي بيقوّي تأثيره على الكلية (cyclophosphamide، chlorpropamide).
          - **Postoperative state**: الألم والترجيع والـ opioids من أقوى منبّهات الـ ADH، علشان كده العيان بعد العملية مع محاليل مخففة معرّض جدًا.
          - **Reset osmostat**: الترموستات نفسه متظبط على رقم أوطى، فالـ Na بيثبت عند مستوى واطي ثابت.
