          - { text: "Cut total protein intake", bin: 1 }
          - { text: "Alcohol", bin: 1 }
          - { text: "Skipping breakfast", bin: 1 }
        why: "الكتاب: 3 main meals + 3 snacks، والـ late evening أهمهم، والـ breakfast مذكور بالاسم في توصية الـ decompensated. الملح يتقلل. البروتين ما يتقللش. والممنوع الوحيد فعلًا هو الـ alcohol."
      - kind: aside
        tone: trap
        page: 408
        text: |
          الكتاب نفسه بيقول حاجتين مختلفتين عن البروتين في الـ HE:

          - محاضرة **L20**، وهي EASL 2018، في صفحة 408 و 413: ==avoid protein restriction==.
          - محاضرة **L01** في صفحة 15: تقليل البروتين في الـ **acute episode of HE** بس، ومش أقل من ==minimum 60–80 g/day==.

          لو السؤال عن **nutrition in CLD** أو الـ EASL، جاوب بالـ L20. ولو جه صريح عن الـ acute HE من محاضرة الـ cirrhosis، اذكر الاتنين. والمشكلة دي متسجّلة في book-issues.
      - kind: reveal
        prompt: "سؤال الامتحان (صفحة 418): **What would you advise your hepatic patient regarding eating**؟ اكتب الهيكل في دماغك وبعدين افتح."
        answer: |
          - **Energy** ≥ 35 kcal/kg و **protein** 1.2–1.5 g/kg (actual BW corrected for ascites).
          - **Split meals:** 3 main meals + 3 snacks: mid-morning، mid-afternoon، و ==late evening = most important==.
          - **Late-evening ONS + breakfast** للـ malnourished decompensated.
          - **No food is forbidden except alcohol.**
          - **Fruit and vegetables**؛ **restrict salt**، ≈ 80 mmol Na/day = 5 g salt لو فيه ascites، وخلّي الأكل مستساغ.
          - ==No protein restriction==؛ في الـ HE: vegetable and dairy protein.
          - يبلّغ عن قلة الأكل، أي مرض تاني، وما يغيّرش البروتين من نفسه.
      - kind: try
        items: [hb.L20.030, hb.L20.034, hb.L20.038, hb.L20.098, hb.L20.112]
