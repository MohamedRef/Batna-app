        text: "الـ APOE e4 زي إنك ساكن في شارع واطي: احتمال إن بيتك يغرق في الشتا أعلى (من 9% لـ 29%)، بس مش كل بيت في الشارع بيغرق، وفيه بيوت بتغرق في شوارع عالية. الشارع بيقولك **الخطر**، مش بيقولك **البيت ده غرق**. وده بالظبط ليه الـ e4 مش diagnostic test."
      - kind: explain
        page: 61
        quote: "Elevated plasma and total homocysteine levels"
        title: "الـ risk factors التانية"
        text: |
          الكتاب بيكمّل الـ ==other risk factors==:
          - **Head injury**.
          - **Low folate و vitamin B12**، و**elevated homocysteine**.
          - **Family history** of AD أو dementia.
          - تعليم أقل، دخل أقل، **lower occupational status**.

          والـ **lower risk of AD**: education أعلى و**fish** أكتر في الأكل.

          ليه؟ التفسير المقبول (مش في الكتاب): الـ folate والـ B12 هما اللي بيكسّروا الـ **homocysteine**، فلما يقلّوا هو يعلى، والـ homocysteine العالي بيأذي الأوعية والـ neurons. والسمك فيه omega-3 fatty acids اللي بتدخل في غشا الـ neuron. والتعليم والشغل اللي فيه تفكير بيبنوا احتياطي (cognitive reserve).

          والكتاب بيقول إن اختلاف نسب الـ AD بين الشعوب معناه عوامل genetic أو environmental لسه مااتعرفتش.
