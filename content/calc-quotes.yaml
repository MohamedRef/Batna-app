      Acidosis due to toxins
        Ingestion of alcohols, such as ethanol, methanol, and ethylene glycol, or administration of propylene glycol generates not only hyperosmolality but also metabolic acidosis with high AG. Whenever ingestion of these alcohols is suspected, it is important to measure and calculate serum osmolality to identify osmolal gap.
        Osmolal gap is defined as the difference between the measured and calculated serum osmolality. Generally, the measured osmolality is 10 mOsm higher than the calculated osmolality. Values >10 mOsm represent the presence of an osmolal gap.
        Elevated osmolal gap suggests the presence of osmotically active substances that are measured, but not included in the calculation of osmolality.
        Calculated Serum Osmolality = (2 x [Na]) + [glucose, in mg/dL]/18 + [blood urea nitrogen in mg/dL]/2.8
        Calculated Serum Osmolality = (2 x [Na]) + [glucose] + [urea] with SI units (in mmol/L):
