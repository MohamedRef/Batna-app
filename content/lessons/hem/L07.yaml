        text: "طفل عنده **ألم عضم ومفاصل** واتشخص ==juvenile rheumatoid arthritis==؟ اعمل complete blood count (CBC) وبص على الـ film. كتير من أطفال الـ ALL اتشخصوا JRA الأول."
      - kind: reveal
        page: 110
        quote: "Certain clinical manifestations are unique to specific subtypes of leukemia, patients with acute promyelocytic leukemia (M3) commonly have subclincial or clinical DIC, coaused by tissue thromboplastins present in the leukemic cells."
        prompt: "ليه الـ APL (M3) بالذات بتجيب DIC؟"
        answer: |
          لأن الـ promyelocytes بتاعتها مليانة granules فيها ==tissue thromboplastins==.

          لما تتكسر بتطلّق الـ thromboplastin في الدم، فتشغّل الـ coagulation في كل حتة وتستهلك الـ platelets والـ factors: ==DIC== (subclinical أو clinical).
      - kind: check
        page: 110
        quote: "particularly in children with ALL, in many of whom the original diagnosis was juvenile rheumatoid arthritis"
