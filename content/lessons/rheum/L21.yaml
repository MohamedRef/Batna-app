  - id: rheum.L21.lesson2
    title: "Limited ولا diffuse؟ والمفاصل والرئة"
    hook: "الخط عند الكوع والركبة بيحدد الشكل، والرئة بقت أول سبب وفاة."
    minutes: 8
    pages: [346, 348]
    topics: [forms, msk-lung]
    goals:
      - "تفرّق الـ limited من الـ diffuse وتعرف ليه الـ diffuse أخطر"
      - "تحفظ الـ CREST"
      - "تعرف نوعين الرئة وليه الرئة بقت أول سبب وفاة"
    status: unverified
    steps:
      - kind: explain
        page: 346
        title: "الصورة العامة"
        quote: "It has insidious onset with world wide distribution.\nMainly Female to Male (4 : 1).\nMore common on 4th and 5th decades."
        text: |
          - **Onset:** insidious، وموجود في العالم كله
          - **Female : male** = ==4 : 1==
          - **السن:** الـ 4th و 5th decades
          - **نادراً** الـ **visceral scleroderma** بييجي من غير skin changes

          يعني الجلد هو الباب للتشخيص في الأغلبية، علشان كده لما الـ visceral ييجي من غير جلد بيبقى صعب ويتأخر.
      - kind: figure
        page: 346
        quote: "Forms of Systemic Sclerosis:\n  Limited Scleroderma.\n  Skin thickening is distal to elbows and knees, not involving trunk.\n  Can involve perioral skin thickening (pursing of lips).\n  Less organ involvement.\n  Seen in CREST syndrome.\n  Isolated pulmonary hypertension can occur.\n  Diffuse Scleroderma.\n  Skin thickening proximal to elbows and knees, involving the trunk.\n  More likely to have organ involvement.\n  Pulmonary fibrosis and Renal Crisis are more common."
        title: "الخط عند الكوع والركبة"
        alt: "Two body outlines side by side. Limited SSc: skin thickening shaded only below the elbows and knees and on the face, trunk spared; labels say CREST, less organ involvement, isolated pulmonary hypertension. Diffuse SSc: shading also above the elbows and knees and over the trunk; labels say more organ involvement, pulmonary fibrosis and renal crisis more common."
        caption: "تحت ==الكوع والركبة== بس = **limited**. فوقهم والـ **trunk** = **diffuse**."
        svg: |
