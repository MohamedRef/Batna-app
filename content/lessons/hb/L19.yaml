          - **(1)**: الحصوة من ناحية فيها ==وش مقعّر ناعم==، مكان حصوة تانية كانت لازقة فيها.
          - **(2)**: نفس الحصوة من الناحية التانية، سطحها مشقّق ومنقّط بالأبيض.

          اللي تاخده منها للدرس: الحصوات بتكبر ببطء (1–2 mm في السنة، صفحة 380) لحد ما توصل للحجم ده، والحصوة ==أكبر من 3 cm== من الحالات القليلة اللي الكتاب بيقول فيها نشيل المرارة حتى لو ساكتة (صفحة 385).
