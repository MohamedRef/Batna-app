    page: 25
    quote: "Case-Control: Compare risk factor frequency. (cases, controls)\nRetrospective Cohort: Risk factor +, Risk factor -; Compare disease incidence.\nProspective Cohort: Risk factor +, Risk factor\
      \ -; Compare disease incidence.\nClinical Trial: Treated, Not Treated; Compare disease incidence.\nPast | Start of Study | Future"
  status: unverified
- id: res.L20.035
  kind: card
  topic: designs
  front: Define meta-analysis.
  back: 'A subset of systematic reviews: a method for systematically combining pertinent qualitative and quantitative study data from several selected studies to develop a single conclusion that has greater
    statistical power.'
  src:
    page: 26
    quote: '| Meta-analysis | A subset of systematic reviews; a method for systematically combining pertinent qualitative and quantitative study data from several selected studies to develop a single conclusion
      that has greater statistical power. This conclusion is statistically stronger than the analysis of any single study because of: Increased numbers of subjects; Greater diversity among subjects; Accumulated
      effects and results |'
  status: unverified
- id: res.L20.036
  kind: enumerate
  topic: designs
  prompt: Why is the conclusion of a meta-analysis statistically stronger than the analysis of any single study?
  points:
  - Increased numbers of subjects
