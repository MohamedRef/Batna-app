  # ---------------- ethics-basics ----------------
  - id: res.L09.016
    kind: card
    topic: ethics-basics
    front: "What is the origin and meaning of the word ethics?"
    back: "From the Greek word \"ethos\", meaning the set of moral principles."
    src: { page: 18, quote: "WHAT IS: ETHICS?\n  The word is derived form the Greek word \"ethos\" meaning; \"the set of moral principles\"" }
    status: unverified
    tags: [definition]
  - id: res.L09.017
    kind: card
    topic: ethics-basics
    front: "What does morality or ethics represent?"
    back: "A code of conduct that governs how people treat each other; in essence it is concerned with the way people act or behave. The term usually refers to the moral principles guiding conduct held by a group or a profession (Wellington, 2000)."
    src: { page: 19, quote: "What do we mean by ethics?\n  Morality or ethics represents a code of conduct that governs how people treat each other.\n  In essence, it is concerned with the way people act or behave.\n  The term 'ethics' usually refers to the moral principles, guiding conduct, which are held by a group or even a profession\" (Wellington, 2000: 54)" }
    status: unverified
    tags: [definition]
  - id: res.L09.018
    kind: cloze
    topic: ethics-basics
    text: "Ethics are ways of understanding and examining the {{c1::moral life}}, or right and wrong human conduct; {{c2::bioethics}} examines the moral aspects of biomedical research and practice."
    src: { page: 20, quote: "WHAT IS: ETHICS?\n  Ethics are ways of understanding and examining the moral life, or of right and wrong human conduct.\n  Bioethics is a way of understanding and examining the moral aspects of biomedical research and practice" }
    status: unverified
    tags: [definition]
