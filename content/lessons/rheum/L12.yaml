  - id: rheum.L12.lesson3
    title: "الـ Systemic JIA: حمى وطفح بيلعبوا استغماية"
    hook: "حمى كل يوم الساعة 6 وطفح يختفي قبل ما توريه للدكتور: ده الـ systemic JIA بيلعب استغماية."
    minutes: 9
    pages: [201, 202]
    topics: [systemic]
    goals:
      - "تعرف ILAR criteria للـ systemic JIA وشكل الحمى والطفح"
      - "تعرف الـ hallmark وليه الـ uveitis نادر"
      - "تعرف المضاعفات وسبب الوفاة"
    status: unverified
    steps:
      - kind: explain
        page: 201
        quote: "Systemic onst JIA Characteristics\n  Equal sex Age of onset 2-3 years.\n  Viral etiology HLA studies demonstrates genetic heterogenity.\n  Arthritis of ankles, elbows, wrists, hip involvement almost bilaterally and if present it is associated with polyarticular disease.\n  Hand joints are more affected than the feet."
        title: "الـ Systemic onset JIA"
        text: |
          - **Equal sex**، سن **2–3 سنين**، و viral etiology متوقعة.
          - Ankles، elbows، wrists؛ الـ ==hip== غالبًا bilateral ولو موجود يبقى معاه polyarticular disease.
          - الإيد أكتر من الرجل، و tenosynovitis في الـ carpus و tarsus.

          ليه الـ hip مهم هنا؟ لأن الكتاب بيقول لو موجود يبقى associated with polyarticular disease، يعني علامة إن المرض هيبقى أوسع.
      - kind: figure
        page: 202
        quote: "Table 1: Systemic JIA ILAR Classification Criteria\n1. Fever ≥2 weeks, quotidien in pattern (≥39°C at least once a day and returns to ≤37°C), documented daily for ≥3 days\n2. Arthritis in ≥1 joint (for ≥6 weeks)\n3. At least one of the following:\n  Evanescent erythematous rash;\n  Generalized lymph node enlargement;\n  Hepatomegaly and/or splenomegaly; or\n  Serositis"
        title: "الحمى الـ quotidian"
        alt: "A temperature chart over three days. Each day the line spikes once above 39 degrees then falls back to 37 or below. A pink rash icon appears at each spike."
        caption: "كل يوم الحرارة بتطلع 39 درجة أو أكتر مرة على الأقل، وبعدين ترجع 37 درجة أو أقل. والطفح بيظهر مع الحمى ويختفي."
        svg: |
          <svg viewBox="0 0 330 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 20V170H320" class="fg-ink"/>
