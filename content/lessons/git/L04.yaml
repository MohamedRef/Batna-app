      - kind: explain
        page: 160
        quote: "The depth of tumor invasion is not accurately assessed with CT, and the"
        title: "CT الأول، وبعدين EUS: ليه بالترتيب ده؟"
        text: |
          الكتاب:
          - **CT** الأول: لو مفيش metastases ولا invasion للأعضاء، يبقى **EUS** يدقق الـ local stage.
          - الـ CT مش دقيق للعمق: **T staging accuracy 64%**، و **N sensitivity 24-43%**، بس بيلاقي ==حوالي 85%== من الـ intra-abdominal metastases، ومفيد خصوصًا في الكبد.
          - الـ **EUS** بيشوف طبقات الحيطة بـ **rotating high-frequency probe**، فهو investigation of choice للعمق.
          - الـ CT والـ MRI **مش بيفرّقوا** بين node كبيرة من التهاب و node كبيرة من ورم.

          التفسير المقبول (مش في الكتاب): ليه الترتيب ده؟ لأنه بيوفّر: لو الـ CT لقى الكبد مليان، العمق مش هيفرق، والمريض palliative. الـ EUS بيستاهل بس لما القرار هيتغير على العمق (endoscopic resection ولا جراحة، ولا علاج قبل الجراحة).
      - kind: explain
        page: 161
        quote: "Only 50% gastric cancers are PET-avid"
        title: "الـ PET: مش primary، بس مفيد في المتابعة"
        text: |
          الكتاب:
          - **Not currently a primary staging modality**، و ==only 50%== من سرطانات المعدة **PET-avid**.
          - الـ PET response للـ neoadjuvant بعد **14 يوم** مرتبط قوي بالـ survival، فبيساعد نوقف العلاج السام عن اللي مش بيستجيب.
          - بيلاقي node metastases قبل ما تكبر في الـ CT، والـ nodal sensitivity 23-73%.
          - **Limitations**: false positive من الـ infection والـ inflammation، و sensitivity أقل للحاجات الصغيرة.

          التفسير المقبول (مش في الكتاب): ليه نص الأورام بس PET-avid؟ الأنواع اللي فيها mucin كتير (زي الـ signet ring) خلاياها قليلة وبطيئة الأكل للـ glucose. فالـ PET الـ negative في سرطان معدة **ما يطمّنش**. بس لو الورم avid من الأول، الـ PET أحسن أداة تعرف بيها بسرعة إذا الـ chemo شغال ولا لأ.
      - kind: figure
        page: 161
        title: "TNM لسرطان المعدة"
        image: { file: git/L04-gastric-tnm-table.webp, book: true }
        alt: "Book table of TNM staging for gastric cancer: T from TX, T0 and Tis through T1a lamina propria or muscularis mucosae, T1b submucosa, T2 muscularis propria, T3 subserosal tissue, T4a serosa and T4b adjacent structures; N0, N1 1-2 nodes, N2 3-6, N3a 7-15 and N3b 16 or more; M0 and M1."
        caption: |
          الـ **T** بالطبقة: T1a (lamina propria أو muscularis mucosae)، T1b (submucosa)، T2 (muscularis propria)، T3 (subserosa)، **T4a** (serosa)، **T4b** (أعضاء جنبها).

          والـ **N** بالعدد: N1 = 1–2، N2 = 3–6، ==N3a = 7–15، N3b = 16 أو أكتر==.
