            <text x="284" y="200" class="t-sm" text-anchor="end">Inflammation, dysmotility</text>
            <text x="284" y="215" class="t-sm" text-anchor="end">amplify visceral signals</text>
            <text x="284" y="230" class="t-sm" text-anchor="end">More pain, anxiety, depression</text>
            <rect x="10" y="250" width="310" height="62" rx="8" class="fg-good"/>
            <text x="22" y="272" class="t-b">Gut (ENS)</text>
            <text x="22" y="288" class="t-sm t-mut">motility, sensation, secretion, barrier</text>
            <text x="22" y="303" class="t-sm t-mut">immune cells, microbiota</text>
          </svg>
      - kind: aside
        tone: analogy
        page: 85
        quote: "improvement in pain control can be enabled by cognitive or emotional factors such as focused attention, hypnosis, psychological treatment, and certain"
        text: |
          الـ **pain gate** زي زرار الصوت في الراديو. المخ الطبيعي بيوطّي صوت الإشارات اللي جاية من المصران (**down-regulation**)، فالـ threshold بيعلى.

          في الـ functional GI pain الزرار ده مش شغال كويس، والـ **anterior cingulate cortex** نفسه dysfunctional. ولما يبقى فيه psychosocial distress، البوابة بتتفتح والـ threshold بيقل.

          اللي بيرجّع الزرار: focused attention، hypnosis، psychological treatment، وبعض الـ antidepressants. ويمكن كمان بيعملوا **neurogenesis**، فأثرهم بيدوم.
      - kind: figure
        page: 87
        quote: "Table 2.Functional Gastrointestinal Disorders: Disorders of Gut-Brain Interaction"
        title: "خريطة Rome IV للكبار"
        alt: "Six stacked boxes for the Rome IV adult domains: A esophageal (functional chest pain, functional heartburn, reflux hypersensitivity, globus, functional dysphagia); B gastroduodenal (functional dyspepsia, belching, nausea and vomiting, rumination); C bowel (IBS, functional constipation, functional diarrhea, bloating, unspecified, opioid-induced constipation); D centrally mediated GI pain (CAPS, narcotic bowel); E gallbladder and sphincter of Oddi (biliary pain, pancreatic SO disorder); F anorectal (fecal incontinence, anorectal pain, defecation disorders)."
        caption: "ست domains من فوق لتحت، ماشية مع الجهاز الهضمي من المريء للشرج، وفي النص الـ D اللي مصدره المخ. والأطفال ليهم G لوحدهم."
