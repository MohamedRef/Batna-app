      - kind: explain
        page: 270
        title: "Anakinra و abatacept"
        quote: "Blocks activation of T lymphocytes by competing with binding of costimulatroy molecule CD28 on surface of T cells to CD80/CD86"
        text: |
          **Anakinra** (IL-1Ra): بينافس الـ IL-1 على الـ receptor. **أضعف من الـ anti-TNF** وحقنة **كل يوم**. infections بكتيرية (مش opportunistic)، injection site، neutropenia و thrombocytopenia قابلين للرجوع، ومع الـ anti-TNF infections شديدة.

          **Abatacept** (CTLA4-Ig): بيمسك ==CD80/CD86== على الـ APC قبل الـ **CD28** ما يمسكها، فالـ T cell ما بيشتغلش (costimulation blockade). **10 mg/kg** IV: 3 مرات كل أسبوعين وبعدين كل شهر. آمن لوحده أو مع MTX، بس **مع الـ anti-TNF infections كتير**.
      - kind: explain
        page: 271
        title: "Rituximab: امسح الـ B cells"
        quote: "Pro B cells and plasma cells do not express CD20-They are spared, Immunoglobulin level (esp IgM) is lowered but remains within normal."
        text: |
          الـ B cells في الـ RA بتقدّم antigen، وتشغّل T cells، وتعمل antibodies و cytokines (TNF، lymphotoxin، IL-17).

          الـ ==rituximab==: chimeric anti-**CD20**. بيمسح الـ B cells **أكتر من 6 شهور** (ADCC، complement، apoptosis). فعّال مع MTX في الـ refractory RA.

          الـ **pro-B** والـ **plasma cells** ما عليهمش CD20، فالـ Ig بيقل (خصوصًا IgM) بس ==يفضل طبيعي==.

          الكورس: **2 infusions × 1 g**، بينهم أسبوعين؛ وتعيد بعد 7-23 شهر. infusion reactions (premedicate بـ steroids)، ومفيش TB ولا opportunistic.
      - kind: explain
        page: 272
        title: "Tocilizumab: اقفل الـ IL-6"
        quote: "Improve anaemia through inhibition of IL6 induced hepcidin production."
        text: |
          **Humanized** anti-**IL-6 receptor**. بيوقف: B و T activation، الـ acute phase proteins، الـ neutrophils والـ pannus، والـ VEGF.

          وفوايد إضافية:
          - ==الأنيميا تتحسّن==: الـ IL-6 بيعمل **hepcidin**، والـ hepcidin بيقفل الـ ferroportin فالحديد يتحبس.
          - الـ fatigue والمود (HPA axis).
          - الـ osteoporosis (يوقف الـ osteoclasts).

          **8 mg/kg** IV كل شهر، والاستجابة في **أسبوعين**.
