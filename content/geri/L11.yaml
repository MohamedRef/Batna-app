    status: unverified
  - id: geri.L11.059
    kind: card
    topic: exacerbation
    front: Is a COPD exacerbation a lab or a clinical diagnosis? What are sputum culture and procalcitonin good for?
    back: Clinical. Culture often cannot separate colonizers from true pathogens; procalcitonin rises with bacterial toxins and may guide antibiotics.
    src: { page: 202, quote: "Exacerbation of COPD is a clinical diagnosis. In many cases, sputum culture does not differentiate between colonizing flora and true infectious pathogen." }
    status: unverified
