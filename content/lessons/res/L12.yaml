  - id: res.L12.lesson6
    title: "نمنع الـ bias إزاي؟ ومراجعة الكويز"
    hook: "الـ confounder تقدر تصلّحه في الـ analysis. الـ bias لأ: لازم تمنعه من الأول. ده آخر درس، والكويز في آخره."
    minutes: 10
    pages: [47, 61]
    topics: [prevention, information, control, selection]
    goals:
      - "تفهم ليه الـ bias لازم يتمنع في التصميم"
      - "تربط كل نوع bias بالحل بتاعه"
      - "تحل أسئلة الكويز السبعة بمنطق الدكتورة"
    status: unverified
    steps:
      - kind: explain
        page: 47
        quote: "How to avoid bias\n1. Bias are far more difficult to evaluate than confounders.\n2. It is impossible to overcome in analysis.\n3. It is important to know its sources in order to\nPrevent bias .\nMinimize bias\nConsider them in the interpretation of results."
        title: "الـ bias مبيتصلّحش بعدين"
        text: "- الـ bias ==أصعب بكتير في التقييم== من الـ confounders.\n- **مستحيل تتغلب عليه في الـ analysis**.\n- عشان كده لازم تعرف **مصادره** عشان:\n  - **تمنعه** (prevent)\n  - **تقلّله** (minimize)\n  - **تحطه في اعتبارك** وانت بتفسّر النتايج."
        remind: [res.L12.073]
      - kind: figure
        page: 47
        quote: "How to avoid bias\n1. Bias are far more difficult to evaluate than confounders.\n2. It is impossible to overcome in analysis.\n3. It is important to know its sources in order to\nPrevent bias .\nMinimize bias\nConsider them in the interpretation of results."
        title: "فين بنحارب كل مشكلة؟"
        alt: "A horizontal timeline of four stages: design, data collection, analysis, interpretation. A red band labelled bias: prevent or minimize spans design and data collection, with a cross over analysis marked cannot fix in analysis, and a note at interpretation: consider it. A blue band labelled confounding spans design (randomization, restriction, matching) and analysis (stratification, multivariate)."
        caption: "الـ **bias** بنمنعه في التصميم وجمع الداتا، ومبيتصلّحش في الـ analysis، وناخده في اعتبارنا في التفسير. الـ **confounding** نقدر عليه في التصميم **أو** الـ analysis."
        svg: "<svg viewBox=\"0 0 330 190\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"4\" y=\"8\" width=\"76\" height=\"30\" rx=\"5\" class=\"fg-box\"/><text x=\"42\" y=\"28\" text-anchor=\"middle\" class=\"t-sm t-b\">Design</text>\n  <rect x=\"86\" y=\"8\" width=\"76\" height=\"30\" rx=\"5\" class=\"fg-box\"/><text x=\"124\" y=\"28\" text-anchor=\"middle\" class=\"t-sm t-b\">Collection</text>\n  <rect x=\"168\" y=\"8\" width=\"76\" height=\"30\" rx=\"5\" class=\"fg-box\"/><text x=\"206\" y=\"28\" text-anchor=\"middle\" class=\"t-sm t-b\">Analysis</text>\n  <rect x=\"250\" y=\"8\" width=\"76\" height=\"30\" rx=\"5\" class=\"fg-box\"/><text x=\"288\" y=\"28\" text-anchor=\"middle\" class=\"t-sm t-b\">Interpret</text>\n  <text x=\"4\" y=\"62\" class=\"t-sm t-bad t-b\">Bias</text>\n  <rect x=\"4\" y=\"70\" width=\"158\" height=\"34\" rx=\"5\" class=\"fg-bad\"/>\n  <text x=\"83\" y=\"91\" text-anchor=\"middle\" class=\"t-sm\">prevent / minimize</text>\n  <rect x=\"168\" y=\"70\" width=\"76\" height=\"34\" rx=\"5\" class=\"fg-thin\"/>\n  <text x=\"206\" y=\"91\" text-anchor=\"middle\" class=\"t-sm t-bad\">can't fix</text>\n  <rect x=\"250\" y=\"70\" width=\"76\" height=\"34\" rx=\"5\" class=\"fg-thin\"/>\n  <text x=\"288\" y=\"91\" text-anchor=\"middle\" class=\"t-sm\">consider it</text>\n  <text x=\"4\" y=\"126\" class=\"t-sm t-acc t-b\">Confounding</text>\n  <rect x=\"4\" y=\"134\" width=\"76\" height=\"48\" rx=\"5\" class=\"fg-acc\"/>\n  <text x=\"42\" y=\"150\" text-anchor=\"middle\" class=\"t-sm\">randomize</text>\n  <text x=\"42\" y=\"163\" text-anchor=\"middle\" class=\"t-sm\">restrict</text>\n  <text x=\"42\" y=\"176\" text-anchor=\"middle\" class=\"t-sm\">match</text>\n  <rect x=\"168\" y=\"134\" width=\"76\" height=\"48\" rx=\"5\" class=\"fg-acc\"/>\n  <text x=\"206\" y=\"155\" text-anchor=\"middle\" class=\"t-sm\">stratify</text>\n  <text x=\"206\" y=\"170\" text-anchor=\"middle\" class=\"t-sm\">multivariate</text>\n</svg>"
      - kind: explain
        page: 48
        quote: "How to avoid bias\nIf possible, do not tell your research hypothesis to the subjects (helps preventing recall bias). In addition, if possible, try and take information about exposure from other sources, in addition to the subjects."
        title: "حلول حسب المشكلة"
        text: "- **Recall bias**: متقولش الـ **hypothesis** للمشاركين لو ينفع، وخد معلومة الـ exposure من **مصادر تانية** (records مثلًا).\n- **Follow-up** (cohort أو trial): population **well defined**، وطرق **ترجّع** اللي بيضيعوا.\n- **Case control**: **مجموعتين controls أو أكتر** (واحدة من المستشفى وواحدة أصحاء)، ولو hospital controls خد **تشخيصات مختلفة**.\n- في أي دراسة: شوف ==entire spectrum== للمرض. في الـ **IHD** مش الـ **MI** بس: **angina**، **sudden death**، و**asymptomatic ECG changes**."
      - kind: explain
        page: 51
        quote: "How to avoid bias\n- It is always advisable to take the incident cases since the prevalent cases might have changed their exposure status due to medical advice.\n- examine all subjects of both groups at the pre - decided dates using \"similar\" methods of history taking, physical examination and investigations, and make arrangements that losses to follow up are minimized."
        title: "Incident cases وتوحيد القياس"
        text: "- خد **incident cases**: الـ **prevalent cases** ممكن تكون **غيّرت الـ exposure** بعد نصيحة الدكتور (اللي جاله angina بطّل سجاير).\n- افحص المجموعتين في **مواعيد محددة** بطرق **similar** للـ history والفحص والتحاليل.\n- **Questionnaire validation**، أجهزة **accurate وreliable** ومتصانة، **operational definition** لكل variable، و**training** للي بيجمعوا الداتا مع supervisory checks.\n- في الـ **trial**: **random allocation**، **blinding**، و**placebo control**. والـ **blinding** ينفع كمان للـ observer في الـ case control والـ cohort."
        remind: [res.L12.080, res.L12.081]
      - kind: sort
        page: 52
        quote: "How to avoid bias\nQuestionnaire validation\nUse accurate and reliable instruments (proper maintainance)\nDefine and put operational definition for variable\nTraining of data collectors or one (supervisory checks)"
