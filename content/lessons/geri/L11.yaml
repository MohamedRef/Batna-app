  - id: geri.L11.lesson1
    title: "رئة عندها 80 سنة"
    hook: "الرئة الكبيرة مش مريضة، بس اتغيرت: أوسع، أرخى، وحابسة هوا أكتر. لازم تعرف الطبيعي قبل ما تقول COPD."
    minutes: 9
    pages: [188, 192]
    topics: [volumes, aging]
    goals:
      - "تفتكر الـ lung volumes والـ capacities بأرقامها"
      - "تفهم الـ senile emphysema وليه الـ total lung capacity (TLC) مش بيتغير"
      - "تعرف ليه الـ FEV1/FVC بيضلّلنا في الكبار، وليه الـ closing capacity بتعلى"
    status: unverified
    steps:
      - kind: figure
        page: 188
        quote: "TLC … = TV+ IRV+ ERV+ RV = 4‐6 L\n  VC …. = TV+IRV+ERV = 4800mL\nFRC … = RV+ERV = 1800 –2200 mL"
        title: "الأحجام في عمود واحد"
        alt: "A vertical bar for total lung capacity of 4 to 6 litres, split from bottom to top into residual volume 1200 ml, expiratory reserve volume 700 to 1200 ml, tidal volume 300 to 500 ml and inspiratory reserve volume 1900 to 3300 ml. Brackets on the right: FRC is RV plus ERV, IC is TV plus IRV, VC is everything except RV."
        caption: "الـ capacity = مجموع volumes. الـ vital capacity (VC) هي كل حاجة ما عدا الـ residual volume (RV)، والـ functional residual capacity (FRC) هي اللي فاضل بعد زفير عادي."
        svg: |
          <svg viewBox="0 0 330 360" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="10" width="120" height="120" class="fg-acc"/>
            <rect x="20" y="130" width="120" height="50" class="fg-good"/>
            <rect x="20" y="180" width="120" height="70" class="fg-box"/>
            <rect x="20" y="250" width="120" height="100" class="fg-bad"/>
            <text x="30" y="60" class="t-sm t-b">IRV</text>
            <text x="30" y="80" class="t-sm">1900-3300 ml</text>
            <text x="30" y="152" class="t-sm t-b">TV</text>
            <text x="30" y="170" class="t-sm">300-500 ml</text>
            <text x="30" y="210" class="t-sm t-b">ERV</text>
            <text x="30" y="230" class="t-sm">700-1200 ml</text>
            <text x="30" y="290" class="t-sm t-b">RV</text>
            <text x="30" y="310" class="t-sm">1200 ml</text>
            <path d="M150 10v170" class="fg-arrow-acc" stroke-width="3"/>
            <text x="158" y="100" class="t-sm t-b t-acc">IC</text>
            <path d="M150 180v170" class="fg-arrow" stroke-width="3"/>
            <text x="158" y="270" class="t-sm t-b">FRC 1.8-2.2 L</text>
            <path d="M240 10v240" class="fg-arrow-acc" stroke-width="3"/>
            <text x="248" y="130" class="t-sm t-b t-acc">VC</text>
            <text x="248" y="148" class="t-sm">4.8 L</text>
            <path d="M300 10v340" class="fg-arrow" stroke-width="3"/>
            <text x="190" y="345" class="t-sm t-b">TLC 4-6 L</text>
          </svg>
      - kind: figure
        page: 188
        quote: "Lung Volumes and Capacities"
        title: "رسمة الكتاب: الـ spirogram"
        image: { file: geri/L11-lung-volumes.webp, book: true }
        alt: "The book's spirogram of lung volumes: a volume trace with quiet tidal breaths, one maximal inspiration and one maximal expiration, labelled on the left with inspiratory reserve volume, tidal volume, expiratory reserve volume and residual volume, and on the right with inspiratory capacity, vital capacity, functional residual capacity and total lung capacity."
        caption: |
          نفس الأحجام اللي فوق، بس على منحنى النفَس نفسه. الخط بيطلع وينزل مع كل نفَس:

          - **الموجات الصغيرة في النص**: النفَس العادي = ==tidal volume (TV)==.
          - **على الشمال** من فوق لتحت: inspiratory reserve volume (IRV) فوق الـ TV، و expiratory reserve volume (ERV) تحته، وفي القاع **residual volume (RV)** اللي عمر الخط ما بيوصله.
          - **على اليمين** الـ capacities: الـ IC (من نهاية الزفير العادي لفوق)، والـ ==vital capacity (VC)== (من أعلى شهيق لأعمق زفير)، والـ **FRC** (من نهاية الزفير العادي للقاع)، والـ TLC (كله).

          اللي تاخده: الـ RV والـ FRC بس هم اللي الـ spirometer ما يقدرش يقيسهم، لأن الهوا ده عمره ما بيطلع (التفسير المقبول، مش في الكتاب).
      - kind: match
        page: 188
        quote: "TLC … = TV+ IRV+ ERV+ RV = 4‐6 L\n  VC …. = TV+IRV+ERV = 4800mL\nFRC … = RV+ERV = 1800 –2200 mL"
        prompt: "وصّل الـ capacity باللي بتتكون منه:"
        pairs:
          - ["IC", "IRV + TV"]
          - ["FRC", "RV + ERV"]
          - ["VC", "TV + IRV + ERV"]
          - ["TLC", "TV + IRV + ERV + RV"]
        why: "افتكر: الـ RV عمره ما بيطلع، فهو جوه الـ FRC والـ TLC بس. الـ VC هي اللي تقدر تنفخها كلها."
      - kind: explain
        page: 189
        quote: "LLN = Lower Limit of Normal."
        title: "أربع أشكال للـ PFT"
        text: |
          الكتاب بيقرا الـ spirometry برقمين: الـ **FVC** والـ **FEV1/FVC**.

          - **Normal**: FVC > LLN و ratio > 70%.
          - **Obstructive**: FVC > LLN بس ==ratio < 70%==.
          - **Restrictive**: FVC < LLN و ratio > 70%.
          - **Mixed**: الاتنين واطيين.

          ليه الـ ratio هو اللي بيكشف الـ obstruction؟ التفسير المقبول (مش في الكتاب): في الـ obstruction الشُعب ضيقة، فالهوا بيطلع ببطء. الـ FEV1 (اللي طلع في أول ثانية) بيقل جامد، بينما الـ FVC (كل اللي طلع في الآخر) ممكن يفضل قريب من الطبيعي لو سبته وقت. فالنسبة تنزل. في الـ restrictive الرئة صغيرة بس الشُعب مفتوحة، فالاتنين بيقلّوا مع بعض.
      - kind: explain
        page: 190
        quote: "―Senile Emphysema‖ results in alveolar dilatation without any destructive changes to the alveolar walls but due to degeneration of elastic fibers around the alveolar duct."
        title: "الـ senile emphysema"
        text: |
          التغيير في السن بيحصل في الـ **alveoli** مش في الـ large airways.

          الـ alveoli بتفقد الـ ==elastic recoil== وتوسع، وده اسمه **senile emphysema**: dilatation **من غير destruction** في الحيطان، بسبب degeneration للـ elastic fibers حوالين الـ alveolar duct.

          وده الفرق الجوهري عن الـ emphysema بتاع الـ chronic obstructive pulmonary disease (COPD)، اللي فيه destruction.

          ليه ده مهم؟ عشان الـ senile emphysema حيطانه سليمة والـ capillaries بتاعته موجودة، فالـ gas exchange بيفضل كويس. يعني الكبير الصحيح رئته أوسع وأرخى، بس مش مريضة.
      - kind: explain
        page: 190
        quote: "Healthy older persons have approximately 25% lower diaphragmatic strength."
        title: "الصدر والعضلات"
        text: |
          - الـ chest wall بيبقى **أنشف**، والعضلات أضعف.
          - الشهيق بيعتمد أساسًا على الـ **diaphragm**، وده أضعف بحوالي ==25%== في الكبار الأصحاء.
          - الـ diaphragm الضعيف = **VC أقل**، عشان الـ VC هي أكبر نَفَس تقدر تاخده وتطلّعه، وده محتاج عضلة.

          التفسير المقبول (مش في الكتاب) لنشفان الصدر: الغضاريف اللي بين الضلوع بتتكلّس، والضهر ممكن يتقوّس (kyphosis)، فالقفص بيتحرك أقل.
      - kind: reveal
        page: 190
        quote: "Thus, the two together result in an almost unchanged TLC with age."
        prompt: "الـ recoil قلّ (الرئة بتتمد أسهل) والـ chest wall نشف. يحصل إيه للـ TLC؟"
        answer: "الأولى بتزوّد الـ TLC والتانية بتقلّله، فبيلغوا بعض، والـ ==TLC== يفضل **تقريبًا ثابت** مع السن."
      - kind: explain
        page: 190
        quote: "Collapse of the alveoli with aging, results in air trapping, contributes to the increase in RV. Abnormally high RV/TLC is called hyperinflation, which can often be seen on a chest x-ray Hyperinflation occurs in asthma ,COPD and advanced age."
        title: "Air trapping"
        text: |
          الـ recoil القليل بيخلي الـ alveoli تقفل بدري في الزفير، فالهوا يتحبس ← الـ **RV يزيد**، والـ VC يقل. يعني الـ TLC ثابت، بس جزء أكبر منه بقى هوا محبوس مش بيتغير.

          لو الـ RV/TLC عالي بشكل غير طبيعي = ==hyperinflation==، وبيبان في الـ X-ray. بيحصل في **asthma** و **COPD** و **السن المتقدم**.
      - kind: check
        page: 190
        quote: "Abnormally high RV/TLC is called hyperinflation, which can often be seen on a chest x-ray Hyperinflation occurs in asthma ,COPD and advanced age."
        question: "Per the book, in which conditions does hyperinflation (abnormally high RV/TLC) occur?"
        options:
          - "Asthma, COPD and advanced age"
          - "Only COPD"
          - "Idiopathic pulmonary fibrosis"
          - "Only in smokers"
        answer: 0
        why:
          - "صح: التلاتة فيهم هوا بيتحبس، والسن واحد منهم."
          - "الكتاب بيضيف asthma والسن المتقدم."
          - "الـ IPF restrictive: الرئة صغيرة، مش متنفخة."
          - "السن لوحده بيعمل air trapping من غير سجاير."
      - kind: aside
        tone: analogy
        page: 190
        quote: "Elastic recoil of lung tissue decreases with aging, which makes it easier for the lungs to expand with less effort, increasing TLC."
        text: "الرئة الكبيرة زي بلونة اتنفخت كتير: بتتمد بسهولة، بس لما تسيبها مش بترجع لحجمها، وبيفضل فيها هوا."
      - kind: explain
        page: 191
        quote: "Adults normally experience declinein FEV1 with age (about one-third liter per decade)."
        title: "الـ FEV1 والـ ratio"
        text: |
          - الـ ==forced expiratory volume in 1 second (FEV1)== بينزل حوالي **تلت لتر كل 10 سنين**.
          - بينزل **أكتر** من الـ forced vital capacity (FVC)، فالـ **FEV1/FVC كمان بينزل** مع السن. ليه؟ التفسير المقبول (مش في الكتاب): الـ elastic recoil هو اللي بيزق الهوا بسرعة في أول الزفير. لما يقل، أول ثانية بتطلّع هوا أقل.
          - الرئة عندها reserve كبير، فده مش بيبان إلا لو فيه مرض.
          - الـ ratio تحت **0.65** عادة معناه obstruction، فالـ parameter ده ممكن **يبالغ** في تشخيص الـ obstruction في الكبار.
      - kind: aside
        tone: tip
        page: 191
        quote: "The lungs have a large physiologic reserve and therefore these airflow limitations are not evident in older adults unless they are affected by a pathologic process."
        text: "الرئة عندها **physiologic reserve** كبير، فالتغييرات دي ما بتبانش في الكبير الصحيح. يعني لو مسن جالك بينهج، ما تقولش «ده من السن»: السن لوحده مش بيعمل أعراض، دوّر على **pathologic process**."
      - kind: check
        page: 191
        quote: "To Sum Up\n  Age-related changes within alveoli \"senile emphysema\".\n  Reduced lung recoil.\n  TLC does not change with age.\n  Decreased VC with a corresponding increase in RV.\n  Aging results in a decline in FEV1.\n  Decline in FEV1 with aging is greater than the decline in (FVC).\n  Since FEV1/FVC values below 0.65 are typically indicative of airway obstruction, this parameter may overestimate obstructive disease in old age."
        question: "Which pair of changes is expected in a healthy 80-year-old lung?"
        options: ["TLC unchanged, RV up, VC down", "TLC up, RV down, VC up", "TLC down, RV down, VC down", "TLC unchanged, FEV1/FVC up"]
        answer: 0
        why:
          - "صح: ده ملخّص الكتاب بالظبط."
          - "الـ RV بيزيد مش بيقل، والـ VC بيقل."
          - "الـ TLC تقريبًا ثابت والـ RV بيزيد."
          - "الـ ratio بينزل لأن الـ FEV1 بينزل أكتر من الـ FVC."
      - kind: explain
        page: 191
        quote: "This volume combined with RV form closing capacity (CC),which increases linearly with age from approximately 10% of TLC in young adults to approximately 30% of TLC by the age of 70."
        title: "الـ closing volume"
        text: |
          الـ **closing volume (CV)**: الحجم اللي عنده الـ basal airways بتقفل في الزفير العادي. الـ CV + RV = **closing capacity (CC)**.

          الـ CC بتزيد خطيًا من حوالي ==10%== من الـ TLC في الشباب لـ **30%** عند سن 70، لأن الـ recoil القليل بيخلي الـ small airways تقع.
      - kind: reveal
        page: 192
        quote: "Increased CV is likely a result of reduced elastic recoil in the lung, which results in the collapse of the small airways."
        prompt: "الـ closing capacity بتوصل 30% من الـ TLC عند 70 سنة. ليه ده بيهمّك عند سرير المريض؟"
        answer: |
          الكتاب بيقول السبب: الـ **reduced elastic recoil** بيخلي الـ **small airways** تقع.

          التفسير المقبول (مش في الكتاب) للنتيجة: لما الـ closing capacity تقرّب من حجم الرئة في التنفس العادي، الشُعب الصغيرة اللي تحت (basal) بتقفل **في كل نَفَس**. الـ alveoli دي لسه الدم رايح لها بس الهوا مش واصل، فالدم يرجع من غير أكسجين كفاية. عشان كده الـ PaO2 الطبيعي بينزل شوية مع السن، وبيبان أكتر وهو نايم على ضهره.
      - kind: try
        items: [geri.L11.003, geri.L11.005, geri.L11.008, geri.L11.011, geri.L11.016]
    recap:
      - "TLC = TV + IRV + ERV + RV (4-6 L)؛ VC 4.8 L؛ FRC = RV + ERV."
      - "Senile emphysema: dilatation من غير destruction."
      - "Diaphragm أضعف 25%، chest wall أنشف."
      - "TLC ثابت، RV يزيد، VC يقل."
      - "FEV1 ينزل ثلث لتر كل 10 سنين؛ الـ ratio ممكن يبالغ في الـ obstruction."
      - "Closing capacity: من 10% لـ 30% من الـ TLC عند 70، بسبب small airways بتقع (recoil قليل)."
      - "Obstructive: ratio < 70% و FVC > LLN؛ restrictive: FVC < LLN و ratio > 70%."
    practice: [geri.L11.001, geri.L11.002, geri.L11.003, geri.L11.004, geri.L11.005, geri.L11.006, geri.L11.007, geri.L11.008, geri.L11.009, geri.L11.010, geri.L11.011, geri.L11.012, geri.L11.013, geri.L11.014, geri.L11.015, geri.L11.016, geri.L11.097, geri.L11.098, geri.L11.099, geri.L11.122]
  # ------------------------------------------------------------------
  - id: geri.L11.lesson2
    title: "0.70 ولا Z-score؟"
    hook: "لو مشيت بالـ 0.70، تلت الكبار الأصحاء هيبقوا COPD. الدرس ده بيعلّمك ليه الـ Z-score أعدل."
    minutes: 9
    pages: [192, 197]
    topics: [obstruction, staging]
    goals:
      - "تعرف عيبين الـ Global Initiative for Chronic Obstructive Lung Disease (GOLD) في الكبار"
      - "تعرف الـ lower limit of normal (LLN) بتاع الـ Global Lung Function Initiative (GLI) وتستاج بالـ Z-score"
      - "تحسب وتقرا الـ Z-score"
    status: unverified
    steps:
      - kind: explain
        page: 192
        quote: "1) The ATS/ERS recommend that airflow obstruction be established by a lower limit of normal (LLN) threshold for FEV1/FVC. The ATS/ERS currently defines the LLN as the fifth percentile distribution of reference values, calculated in a population of healthy never-smokers matched for age, height, sex, and ethnicity."
        title: "التلات تعريفات"
        text: |
          الـ obstruction = **FEV1/FVC قليل**. بس كام هو القليل في واحد عنده 80 سنة؟ لأن الـ ratio بينزل طبيعي مع السن (الدرس اللي فات)، لازم الحد يحسب حساب السن والـ variability، وإلا هنسمّي الشيخوخة مرض.

          1. **American Thoracic Society (ATS)/ERS**: الـ ==lower limit of normal (LLN)== = الـ **5th percentile** في never-smokers أصحاء بنفس السن والطول والجنس والعرق (معادلات US National Health and Nutrition Examination Survey (NHANES) III).
          2. **Global Initiative for Chronic Obstructive Lung Disease (GOLD)**: ratio ثابت **أقل من 0.70**.
          3. **Global Lung Function Initiative (GLI)**: **Z-score أقل من -1.64**.
      - kind: explain
        page: 193
        quote: "Second, GOLD expresses the FEV1 as%Pred, thus failing to account for age-related variability in spirometricperformance. It is therefore not surprising that the prevalence of airflow obstruction in older persons is more than twofold higher when defined by GOLD versus a Zscoreapproach (37.7% vs 15.4%, respectively)."
        title: "عيبين الـ GOLD"
        text: |
          - **الأول**: الـ ratio الثابت 0.70 مش بيفرّق بين التغيير الطبيعي بالسن والـ chronic obstructive pulmonary disease (COPD). ratio أقل من 0.70 بيتشاف كتير في **never-smokers أصحاء فوق 65**.
          - **التاني**: بيعبّر عن الـ forced expiratory volume in 1 second (FEV1) كـ **%Pred**، فبيتجاهل إن الـ variability بتزيد مع السن.

          يعني الـ 0.70 مسطرة واحدة لابن 30 وابن 85، مع إن الطبيعي عند الاتنين مختلف.

          النتيجة: الـ prevalence بالـ GOLD ==37.7%== مقابل **15.4%** بالـ Z-score. والـ overdiagnosis ده **مش مرتبط** بأعراض ولا دخول مستشفى ولا وفيات.
      - kind: aside
        tone: joke
        page: 193
        quote: "Overdiagnosis of airflow obstruction by GOLD is not associated with respiratory symptoms, exercise intolerance, impaired mobility, COPD hospitalization, or mortality."
        text: "جدّك اللي عمره ما شرب سيجارة وبيمشي 5 كيلو كل يوم؟ بالـ GOLD ممكن يطلع COPD. هو مش مريض، هو بس عيد ميلاده كتير."
      - kind: reveal
        page: 193
        quote: "Overdiagnosis of airflow obstruction by GOLD is not associated with respiratory symptoms, exercise intolerance, impaired mobility, COPD hospitalization, or mortality."
        prompt: "طب لو الـ GOLD شخّص زيادة، فين المشكلة؟ ما هو أحسن من إننا نفوّت حالة."
        answer: |
          الكتاب بيقول إن الـ overdiagnosis ده **مش مرتبط** بأعراض ولا exercise intolerance ولا mobility ولا دخول مستشفى ولا وفيات. يعني الناس دي مش مريضة فعلًا.

          التفسير المقبول (مش في الكتاب) للضرر: المسن هياخد بخاخات مش محتاجها (أعراض جانبية، فلوس، أدوية أكتر)، والأخطر إن لو هو بينهج بجد، كلمة COPD هتخليك تبطّل تدوّر على السبب الحقيقي، زي القلب أو الأنيميا.
      - kind: explain
        page: 193
        quote: "GLI calculated Z-scores account for the age-related decline in lung function and increased variability in spirometric performance and use reference equations that include many ethnicities (worldwide), as well as age range of up to 95."
        title: "الـ GLI"
        text: |
          - معادلات NHANES III لحد سن **80** بس، ومش بتحسب الـ variability.
          - الـ **GLI** بيعرّف الـ LLN = ==Z-score -1.64== (الـ 5th percentile)، عشان -1.64 SD تحت المتوسط هي بالظبط النقطة اللي تحتها 5% من الأصحاء.
          - بيحسب حساب نزول الوظايف بالسن والـ variability، ومعادلاته لأعراق كتير ولحد سن **95**.
          - الـ obstruction بالتعريف ده **مرتبط فعلًا** بالأعراض، الـ mobility، الـ frailty، دخول المستشفى والوفيات.
      - kind: explain
        page: 194
        quote: "This approach has age-related limitations, however, since % Pred assumes incorrectly the equivalence of spirometric variability across the adult lifespan."
        title: "ليه الـ %Pred مش كفاية في الـ staging؟"
        text: |
          الـ GOLD بيستاج بالـ **FEV1 %Pred** = (measured / predicted) × 100، بحدود **80** و**50**.

          المشكلة إن الـ %Pred بيفترض إن الـ **variability** واحدة في كل الأعمار، وده **غلط**. فالكتاب بيقول استعمل الـ ==GLI FEV1 Z-scores== في الـ staging.

          تخيّل الفرق: في الشباب الأرقام الطبيعية قريبة من بعض، فـ 70% predicted بعيدة عن الطبيعي. في سن 85 الأرقام الطبيعية متفرقة أكتر (التفسير المقبول، مش في الكتاب)، فنفس الـ 70% ممكن تبقى جوه الطبيعي. الـ Z-score بيحسب المسافة بوحدة الـ SD بتاعة سنه هو، فبيفرّق.
      - kind: figure
        page: 195
        quote: "Defining and staging COPD\nGlobal Lung Initiative (GLI)\n| Measure | Criterion | | |\n|---|---|---|---|\n| FEV1/FVC | Z-score < -1.64 | | |\n| FEV1 (Z-score) | ≥ -1.64 | < -1.64 but ≥ -2.55 | < -2.55 |\nGlobal Initiative for Obstructive Lung Disease (GOLD)\n| Measure | Criterion | | |\n|---|---|---|---|\n| FEV1/FVC | < 0.70 | | |\n| FEV1 | ≥ 80 %Pred | 50-79 %Pred | < 50 %Pred |"
        title: "التعريف والـ staging"
