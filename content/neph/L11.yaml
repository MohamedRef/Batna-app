  - id: neph.L11.128
    kind: cloze
    topic: dialysis-htn
    text: "Preeclampsia on dialysis carries a {{c1::1.7-3.6}}-fold rise in cardiovascular mortality."
    src: { page: 376, quote: "The risk of preeclampsia among women undergoing dialysis is high and is associated with a 1.7 to 3.6-fold increase in risk for cardiovascular mortality.(71) Many pathophysiological mechanisms are proposed to cause preeclampsia. An imbalance of angiogenic factors, increased renin-angiotensin-aldosterone system activity, oxidative stress, immunologic dysfunction, and impaired amino acid metabolism results in abnormal placental perfusion, failure to remodel spiral arteries, and endothelial dysfunction. In the non-dialysis population, kidney findings include glomerular endotheliosis and podocyturia leading to kidney dysfunction and reduced nephron mass.(72)" }
