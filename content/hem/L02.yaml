  - id: hem.L02.024
    kind: mcq
    topic: history
    stem: A woman on long-term phenytoin develops a macrocytic anaemia. Which mechanism from the drug history fits?
    options:
      - Interference with folate metabolism
      - Oxidant haemolysis in enzyme deficiency
      - Blood loss from gastritis
      - Marrow toxicity like organic solvents
      - Iron malabsorption
    answer: 0
    why:
      - "Correct: antiepileptics, sulfa drugs and trimethoprim interfere with folate metabolism (p11)."
      - Oxidant drugs cause haemolysis in enzyme deficiency, not macrocytosis from folate.
      - NSAIDs cause blood loss, which gives iron deficiency.
      - The book lists solvents and hydrocarbons as marrow toxins, not antiepileptics.
      - Iron malabsorption gives microcytosis, not macrocytosis.
    src: { page: 11, quote: "Interference with folate metabolism (sulfa drugs, trimethoprim, antiepileptic medications)" }
    status: unverified
  # ---------- p12-13: examination ----------
  - id: hem.L02.025
    kind: card
    topic: examination
    front: Where do you look for pallor, and at what Hb does palmar crease pallor appear?
    back: Skin (especially under the nails), mucous membranes and conjunctivae. Pallor of the palmar creases appears at Hb < 75 g/L.
