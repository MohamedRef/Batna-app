  - id: dm.L01.lesson6
    title: "سكر الحمل: الـ placenta بتلعب ضد الـ insulin"
    hook: "92، 180، 153: تلات أرقام، وواحد منهم بس يكفي."
    minutes: 8
    pages: [15, 17]
    topics: [gdm]
    goals:
      - "تعرّف الـ GDM وتشرح ليه الحمل diabetogenic"
      - "تحفظ أرقام الـ one-step OGTT"
      - "تعرف مين ما يحتاجش screening ومين يتعمله بدري"
    status: unverified
    steps:
      - kind: explain
        remind: [dm.L01.016]
        page: 15
        title: "يعني إيه GDM؟"
        quote: "It is a type of Diabetes with onset or first recognition during the second and third trimesters of pregnancy. It may or may not disappear after delivery and is liable to recur with the following pregnancies."
        text: |
          الـ **gestational diabetes mellitus (GDM)** = diabetes بيبدأ أو ==first recognized== في الـ **second و third trimesters**.

          - ممكن يختفي بعد الولادة أو لا.
          - **liable to recur** في الحمل اللي بعده.
          - بيحصل في حوالي **2–5%** من الحمل.

          ليه الـ second و third trimesters بالذات؟ لأن الهرمونات اللي بتعاكس الـ insulin (الخطوة الجاية) بتطلع مع كبر الـ placenta، فبتوصل لقمتها في النص التاني من الحمل. وعشان كده الـ screening الروتيني بيبقى في أسبوع 24–28. والـ recurrence منطقية: نفس الأم، ونفس الـ β-cells، ونفس الهرمونات في الحمل الجاي.
      - kind: explain
        page: 15
        title: "ليه الحمل diabetogenic؟"
        quote: "Human placental lactogen has anti-insulin and lipolytic effects. It increases blood glucose levels, thereby making more glucose available to the fetus."
        text: |
          1. ==Human placental lactogen==: **anti-insulin** و **lipolytic**، بيعلّي سكر الأم علشان الجنين ياخد أكتر.
          2. **Steroid hormones** (corticosteroids و progesterone): anti-insulin.
          3. الـ **placenta** بتكسّر شوية insulin.

          يعني الحمل بيعمل insulin resistance **مقصودة**: الجنين بياخد السكر من دم أمه، فالـ placenta بتخلّي الأم تسيب سكر أكتر في الدم. والـ lipolytic effect بيخلّي الأم تحرق دهون لنفسها وتوفّر الجلوكوز للجنين. الأم السليمة بتعوّض بإنها تفرز insulin أكتر؛ اللي الـ β-cells بتاعتها مش قادرة تعوّض هي اللي بيجيلها GDM.
      - kind: aside
        tone: analogy
        page: 15
        quote: "Human placental lactogen has anti-insulin and lipolytic effects. It increases blood glucose levels, thereby making more glucose available to the fetus."
        text: "الـ **placenta** زي ابن بيحوّل من حساب أمه من غير ما يستأذن: بتخلّي الـ insulin بتاع الأم يشتغل أقل علشان السكر يفضل في الدم ويعدّي للجنين. لو بنكرياس الأم قدّر يزوّد الـ insulin، تمام. لو ما قدرش: **GDM**."
      - kind: explain
        page: 15
        title: "مين في خطر؟"
        quote: "Risk factors for gestational diabetes include:\n  Being overweight or obese\n  Physically inactive\n  Having prediabetes\n  Having had gestational diabetes during a previous pregnancy\n  Having polycystic ovary syndrome\n  Having an immediate family member with diabetes\n  Having previously delivered a baby weighing more than 4 kilograms."
        text: |
          - **Overweight/obese**، و **physically inactive**
          - **Prediabetes**
          - ==GDM in a previous pregnancy==
          - **Polycystic ovary syndrome (PCOS)**
          - قريب درجة أولى عنده **diabetes**
          - بيبي قبل كده أكتر من **4 kg**

          اقراهم كمجموعتين: علامات **insulin resistance** موجودة أصلًا (obesity، inactivity، PCOS، prediabetes)، وعلامات إن **الـ β-cells ضعيفة** (GDM قبل كده، بيبي كبير يعني سكر عالي ما اتشافش، family history). أي واحدة منهم معناها إن الأم مش هتستحمل الـ resistance الزيادة بتاعة الحمل.
      - kind: figure
        page: 16
        quote: "The diagnosis of GDM is made when any of the following plasma glucose values are met or exceeded"
        title: "الـ one-step OGTT"
        alt: "A curve of maternal glucose after a 75 gram load at 24 to 28 weeks, with three thresholds: fasting 92, one hour 180, two hours 153 milligrams per decilitre. Any one value met or exceeded diagnoses GDM."
        caption: "**75 g** في أسبوع **24–28**. فيه تلات نقط، و ==any one== value تكفي."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
