  # ---------- p12-13: compensation ----------
  - id: neph.L01.064
    kind: card
    topic: compensation
    front: Define the secondary physiologic (compensatory) response.
    back: A physiologic process that minimizes the change in [H+] brought about by a primary change.
    src: { page: 12, quote: "It is a physiologic process that minimizes changes in [H+] brought about by a primary change." }
    status: unverified
  - id: neph.L01.065
    kind: cloze
    topic: compensation
    text: A metabolic disorder is compensated by the {{c1::respiratory}} system; a respiratory disorder is compensated by the {{c2::kidney (renal)}}.
    src: { page: 12, quote: "In a metabolic acid–base disorder, the compensatory response is respiratory." }
    status: unverified
    tags: [high-yield]
  - id: neph.L01.066
    kind: card
    topic: compensation
    front: How is metabolic acidosis compensated?
    back: Hyperventilation lowers pCO2, which limits the rise in [H+]; this hyperventilation is the normal physiologic response to increased [H+].
    src: { page: 12, quote: "The compensatory response is a decrease in pCO2 due to hyperventilation." }
    status: unverified
  - id: neph.L01.067
