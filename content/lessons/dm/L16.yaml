          بنت 20 سنة، 32 أسبوع، داخلة بـ ==preterm labour== وحركة الجنين قلّت من 24 ساعة.

          - مفيش سكر قبل كده، ولا في العيلة، ولا أي risk factor لـ GDM.
          - **50 g glucose challenge** في أسبوع 28 كان طبيعي، والبول من 30 يوم مفيهوش سكر.
          - دلوقتي: ==hyperventilating== و ketotic، نبض 100، BP 100/60، سكر ==618== و glycosuria و ketonuria تقيلة.
          - وبالسؤال: عطش و polyuria من أسابيع ما خدتش بالها منهم.

          ليه الـ screening الطبيعي ما ينفيش؟ لأن الاختبار والبول اتعملوا قبل ما المرض يبدأ؛ التفسير المقبول (مش في الكتاب): الـ T1DM ممكن يطلع في أسابيع قليلة.
