        quote: "Professional Meetings\n  Annually, there are dozens of relevant and helpful professional meetings in public health.\n  Important intervention research is often presented at these meetings.\n  Practitioners should seek out meetings that use a peer-review process for abstract review, helping to ensure that high quality research is presented.\n  The main limitation for many practitioners is the inability to attend a variety of professional meetings because of limited travel funds."
