      - kind: explain
        page: 199
        title: "الكبد والمخ والمزاج"
        text: |
          **Liver**: الكبد أول مكان النحاس بيتكوّم فيه، فبيبان بتلات صور:

          - أعراض hepatitis.
          - abrupt decrease in liver function، يعني ==acute liver failure==.
          - أو مفيش أعراض خالص لحد ما يعمل chronic liver disease و complications الـ cirrhosis.

          **CNS**: النحاس بيترسب في مراكز الحركة في المخ، فالأعراض كلها حركة وكلام:

          - مشاكل في speech و swallowing و physical coordination
          - Stiff muscles
          - Tremors or uncontrolled movements

          **Mental health**: anxiety، changes in mood, personality or behavior، depression، psychosis.

          ربط الأعراض العصبية بمراكز الحركة تفسير مقبول. والدرس العملي: مراهق عنده رعشة أو تغيّر في الشخصية مع مشكلة كبد، فكّر في Wilson.
      - kind: mnemonic
        page: 200
        word: "HEART"
        parts:
          - { key: "H", text: "Hemolytic anemia" }
          - { key: "E", text: "Eyes: Kayser-Fleischer rings" }
          - { key: "A", text: "Arthritis or osteoporosis (bone and joint)" }
          - { key: "R", text: "Renal: renal tubular acidosis or kidney stones" }
          - { key: "T", text: "Ticker: cardiomyopathy" }
        hook: |
          النحاس بيوجع الـ **HEART**: دي «Other symptoms of Wilson disease» اللي في الكتاب، برّه الكبد والمخ.
      - kind: sort
        page: 200
        prompt: "حط كل عرض في مجموعته:"
        bins: ["CNS", "Mental health", "Other"]
        cards:
          - { text: "Tremors", bin: 0 }
          - { text: "Stiff muscles", bin: 0 }
          - { text: "Problems with swallowing", bin: 0 }
          - { text: "Depression", bin: 1 }
          - { text: "Psychosis", bin: 1 }
          - { text: "Personality change", bin: 1 }
          - { text: "Hemolytic anemia", bin: 2 }
          - { text: "Renal tubular acidosis", bin: 2 }
          - { text: "Cardiomyopathy", bin: 2 }
        why: "الـ CNS = حركة وكلام وبلع. الـ mental = مزاج وشخصية و psychosis. والباقي = **HEART**."
      - kind: aside
        tone: analogy
        page: 200
        text: |
          الـ ==Kayser-Fleischer ring== زي الصدا الأخضر اللي بيطلع على حرف حنفية نحاس قديمة.

          النحاس بيترسب على حرف القرنية، يعني الـ edge of the cornea، فيعمل حلقة green, gold or brown.

          الكتاب: A buildup of copper in the eyes causes the Kayser-Fleischer rings.
      - kind: explain
        page: 200
        title: "التشخيص"
        text: |
          Blood tests:

          - ==Ceruloplasmin==: البروتين اللي بيشيل النحاس في الدم، وغالبًا low.
          - **Copper**: ممكن يبقى higher- or lower-than-normal.
          - ALT و AST: عالية لو فيه liver damage.
          - Red blood cells: ممكن تبقى low، بسبب الـ hemolysis.

          وكمان liver biopsy.

          الـ ceruloplasmin الواطي هو أهم رقم هنا. والـ copper اللي «ممكن يعلى أو يوطى» محيّر، فالـ reveal الجاي بيشرحه.
      - kind: reveal
        page: 200
        prompt: "الجسم مليان نحاس... إزاي الـ ceruloplasmin يطلع واطي؟ وإزاي الـ copper في الدم يطلع واطي أحيانًا؟"
        answer: |
          ده تفسير مقبول، الكتاب كاتب النتايج بس:

          - الـ ATP7B هو كمان اللي بيحمّل النحاس على الـ ceruloplasmin جوه الكبد. من غيره الـ ceruloplasmin بيطلع فاضي ويتكسّر بسرعة، فمستواه بيقل.
          - معظم النحاس اللي بنقيسه في الدم راكب على الـ ceruloplasmin. لما الـ ceruloplasmin يقل، الـ total copper ممكن يقل.
          - بس ==النحاس الحر==، اللي مش راكب على حاجة، هو اللي بيأذي، وده عالي.

          علشان كده الكتاب قال higher- or lower-than-normal: الرقم بيعتمد على إنت بتقيس أنهي نحاس.
      - kind: check
        page: 200
        question: "A 17-year-old has acute liver failure with Coombs-negative hemolytic anemia. Which blood result best fits the likely diagnosis?"
        options:
          - "Low serum ceruloplasmin"
          - "High transferrin saturation and ferritin"
          - "Low serum alpha-1 antitrypsin"
          - "High serum ceruloplasmin"
        answer: 0
        why:
          - "صح: ALF + **hemolytic anemia** في سن صغير = فكّر Wilson، والـ **ceruloplasmin often low**."
          - "دي صورة الـ hemochromatosis، وده بيظهر متأخر (20-30 سنة)."
          - "ده AATD، وأعراضه رئة (30-50 سنة) أو liver disease، مش hemolysis."
          - "العكس: في Wilson الـ ceruloplasmin **low**."
      - kind: explain
        page: 201
        title: "العلاج"
        text: |
          - ==Chelating agents==: Penicillamine و Trientine. بيمسكوا النحاس اللي اتراكم وبيطلّعوه في البول.
          - ==Zinc==: Zinc prevents the intestines from absorbing copper.

          يعني الـ chelators بيفضّوا المخزن، والـ zinc بيقفل الباب علشان مايتمليش تاني.

          العلاج ده مدى الحياة، لأن الجين لسه بايظ. الزرع بس هو اللي بيغيّر الكبد اللي فيه العيب، وده ليه Wilson في قايمة الـ metabolic indications في L11.
      - kind: reveal
        page: 201
        prompt: "سؤال المحاضرة: **What is the mechanism of action of zinc in Wilson's disease?**"
        answer: |
          إجابة الكتاب: الـ zinc ==prevents the intestines from absorbing copper==.

          ولو عايز تزوّد سطر، وده تفسير مقبول مش من الكتاب:

          - **Metallothionein**: بروتين الـ zinc بيخلّي خلايا الأمعاء تعمله، بيمسك النحاس جوه الخلية.
          - الخلية لما تتقشّر بتنزل بالنحاس في البراز، فالنحاس مايوصلش الدم.
      - kind: aside
        tone: joke
        page: 201
        text: |
          مريض Wilson عنده نحاس متراكم يكفي يفتح ورشة في خان الخليلي. 😄

          الـ penicillamine والـ trientine هما عربية النقل اللي بتفضّي الورشة. والـ zinc هو البواب اللي واقف على باب الأمعاء: «ممنوع دخول نحاس جديد».
