      - kind: reveal
        page: 16
        quote: "The combination of hyperinflammation, coagulopathy, and low platelet counts places patients with cytokine storm at high risk for spontaneous hemorrhage."
        prompt: "ليه المريض ده ممكن ينزف من غير سبب؟"
        answer: "تلاتة مع بعض: **hyperinflammation** + **coagulopathy** + **low platelets**. وممكن الـ DIC يروح ناحية vascular occlusion أو catastrophic hemorrhage."
      - kind: explain
        page: 16
        quote: "Many patients have hypertriglyceridemia and various blood-count abnormalities, such as leukocytosis, leukopenia, anemia, thrombocytopenia, and elevated ferritin and d-dimer levels."
        title: "المعمل بيقول إيه؟"
        text: |
          - ==CRP== عالي **في الكل** وماشي مع الـ severity.
          - **Hypertriglyceridemia**.
          - CBC: leukocytosis أو leukopenia، anemia، thrombocytopenia.
          - **Ferritin** و **D-dimer** عاليين.
          - Cytokines: IFN-γ، IL-6، IL-10، soluble IL-2Rα. الأهم فيها الـ **trend** من الـ baseline.
      - kind: case
        page: 15
        quote: "A cytokine storm can occur as a result of an infection, autoimmune condition, or some drugs (CAR T-cell therapy–induced cytokine storm) ."
        stem: "A 24-year-old man with lymphoma gets CAR T-cell therapy. On day 3: fever 40 °C, BP 80/50, SpO2 88%."
        steps:
          - question: "What is the most likely diagnosis?"
            options: ["Cytokine storm", "Toxic shock syndrome", "Anaphylaxis"]
            answer: 0
            why: "CAR T-cell therapy مذكور بالاسم كسبب. Toxic shock محتاج superantigen toxin، والـ anaphylaxis فورية مش بعد 3 أيام."
          - reveal: "CRP 300 mg/L, ferritin very high, platelets 50 × 10^9/L."
            question: "Which finding tracks severity best, per the book?"
            options: ["CRP", "IgE", "Eosinophil count"]
            answer: 0
            why: "الكتاب: CRP universally elevated and correlates with severity."
      - kind: explain
        page: 17
        quote: "Endotoxins (cell wall) bind TLRs on dendritic cells and macrophages leading them to produce."
        title: "Septic shock ضد toxic shock"
        text: |
          الاتنين نهايتهم واحدة: **TNF-α و IL-1β** بكميات مهولة. الفرق في البداية:

          - **Septic shock**: ==endotoxin== من جدار البكتيريا (Staph. aureus، E. coli، Klebsiella) بيمسك **TLRs** على الـ dendritic cells والـ macrophages.
          - **Toxic shock**: toxin بيشتغل ==superantigen== (Staph. aureus)، بيربط **MHC II مع الـ TCR** مع بعض ويشغّل الـ T cell من غير specificity.

          الـ neutralization بالـ monoclonal antibodies ممكن تساعد في الـ septic shock.
      - kind: sort
        page: 17
        quote: "Microorganisms produce toxins that act as Superantigens (Staph. aureus)"
        prompt: "ده septic shock ولا toxic shock؟"
        bins: ["Septic shock", "Toxic shock", "Both"]
        cards:
          - { text: "Endotoxin on TLRs", bin: 0 }
          - { text: "Macrophages and DCs respond", bin: 0 }
          - { text: "Superantigen", bin: 1 }
          - { text: "MHC II + TCR bridged", bin: 1 }
          - { text: "T cells activated despite specificity", bin: 1 }
          - { text: "Huge TNF-α and IL-1β", bin: 2 }
        why: "اللي بيفرق هو الـ trigger والخلية: endotoxin على macrophage، ولا superantigen على T cell. الـ cytokines في الآخر نفسها."
      - kind: aside
        tone: joke
        page: 17
        quote: "Can bind to receptor but fail to activate the cell, thus blocking the active cytokine from binding"
        text: "الـ cytokine antagonist اللي بيقعد على الـ receptor ومايشغلوش زي اللي بيحجز كرسي في المحاضرة بشنطته ومايجيش: الكرسي محجوز والمحاضرة ماحدش حضرها."
      - kind: try
        items: [rheum.L01.093, rheum.L01.096, rheum.L01.104, rheum.L01.109, rheum.L01.112]
    recap:
      - "Storm = too many cytokines too quickly ← shock و MOF."
      - "أسباب: infection (flu A، COVID)، autoimmune، CAR T، high-dose IL-2."
      - "Fever تقريبًا في الكل؛ CRP عالي دايمًا ومع الـ severity."
      - "Septic = endotoxin + TLR. Toxic = superantigen + MHC II/TCR. الاتنين TNF-α و IL-1β."
