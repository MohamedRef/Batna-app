            <text x="165" y="52" text-anchor="middle" class="t-sm">control red cells, prevent thrombosis</text>
            <path d="M165 66 V84" class="fg-arrow" marker-end="url(#L10a)"/>
            <rect x="10" y="88" width="310" height="56" rx="10" class="fg-good"/>
            <text x="165" y="110" text-anchor="middle" class="t-b">2. Stable</text>
            <text x="165" y="130" text-anchor="middle" class="t-sm">normal counts without treatment</text>
            <path d="M165 144 V162" class="fg-arrow" marker-end="url(#L10a)"/>
            <rect x="10" y="166" width="310" height="76" rx="10" class="fg-acc"/>
            <text x="165" y="188" text-anchor="middle" class="t-b">3. Spent (myelofibrosis)</text>
            <text x="165" y="208" text-anchor="middle" class="t-sm">big liver and spleen, pancytopenia</text>
            <text x="165" y="228" text-anchor="middle" class="t-sm">10–15% at 10 y · &gt;30% at 20 y</text>
          </svg>
      - kind: explain
        page: 160
        title: "التلات مراحل، وليه الأخيرة بتموّت"
        quote: "Followed by an advanced or spent phase (extensive myelofibrosis, progressive hepato-slenomegaly and pancytopenia)10-15% after 10 years and >30% after 20 years , median survival <18 months"
        text: |
          1. **Proliferative**: الأولوية ==control of erythrocytosis and prevention of thrombosis== (urgent).
          2. **Stable**: مدة متغيرة وقصيرة؛ العد بيفضل طبيعي من غير علاج، لأن الـ proliferative potential قلّت وفيه **early myelofibrosis**.
          3. **Spent phase**: **extensive myelofibrosis**، hepatosplenomegaly بتزيد، و **pancytopenia**: **10–15%** بعد 10 سنين، و **>30%** بعد 20، والـ median survival **<18 شهر**.

          خد بالك من المرحلة التانية: لو مريض PV قديم الـ Hct بقى طبيعي من غير فصد، ده مش شفا. التفسير المقبول (مش في الكتاب): ده غالبًا النخاع بدأ يتليّف، فالمصنع بيطلّع أقل، وده إنذار بالـ spent phase، زي ما الطحال اللي بيكبر كان إنذار في الـ ET.
      - kind: explain
        page: 160
        title: "والـ AML؟ العلاج هو اللي بيفرق"
        quote: "Incidence of transformation to AML\n  Is estimated 1-3% in patients treated with venesection.\n  Increased to more than 10 folds when radioactive phosphorus (32P), chlorambucil or irradiation are used, median time 5-8 years."
        text: |
          - مع **venesection** بس: **1–3%**.
          - مع ==32P أو chlorambucil أو irradiation==: أكتر من **10 أضعاف**، بعد **5–8 سنين** في المتوسط.

          ليه؟ التفسير المقبول (مش في الكتاب): الـ 32P والـ irradiation إشعاع، والـ chlorambucil alkylating agent، والتلاتة بيكسّروا الـ DNA في clone عنده ميل أصلًا يتحول. أما الـ venesection فبيشيل دم بس ومش بيلمس الـ DNA.

          الدرس: العلاج نفسه ممكن يبقى **leukemogenic**، والـ 5–8 سنين دول هيشرحوا ليه الـ 32P مسموح للكبار بس.
      - kind: check
        page: 160
        quote: "Followed by stable phase of variable short duration, normal count maintained without treatment (decrease proliferative potential and early myelofibrosis)."
        question: "PV for 9 years needed venesection monthly; now the Hct stays normal with none. What does the book's natural history suggest?"
        options: ["Stable phase: less proliferation, early myelofibrosis", "The PV is cured", "Transformation to ET", "The JAK2 mutation was lost"]
        answer: 0
        why:
          - "صح: الـ stable phase = عد طبيعي من غير علاج، من proliferative potential أقل و early myelofibrosis."
          - "الـ PV مش بتخف لوحدها؛ ده ممكن إنذار بالـ spent phase."
          - "مفيش حاجة في القصة بتقول صفائح لوحدها."
          - "الكتاب ما ذكرش ده؛ الصورة صورة stable phase."
