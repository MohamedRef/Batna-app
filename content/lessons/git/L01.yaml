            <text x="32" y="240" class="t-sm">peptic stricture, Barrett esophagus</text>
            <text x="20" y="266" class="t-sm t-b">2. pH-impedance ON PPI</text>
            <text x="32" y="284" class="t-sm">raised acid exposure time</text>
            <text x="32" y="300" class="t-sm">and/or reflux burden</text>
            <path d="M165 308v30" class="fg-arrow" marker-end="url(#G1a)"/>
            <rect x="70" y="342" width="190" height="40" rx="8" class="fg-bad"/>
            <text x="165" y="367" text-anchor="middle" class="t-b t-bad">PPI-refractory GERD</text>
            <text x="165" y="412" text-anchor="middle" class="t-sm t-mut">AET above 6% on PPI = refractory</text>
          </svg>
      - kind: figure
        page: 4
        title: "LA grade C في المنظار"
        image: { file: git/L01-la-grade-c.webp, book: true }
        alt: "Book slide: Los Angeles classification grade C, mucosal breaks extending between the tops of two or more folds but under 75% of the circumference, with four endoscopic photos."
        caption: |
          **LA grade C**: mucosal breaks بتعدّي بين قمم **فولدتين أو أكتر**، بس أقل من **75%** من محيط الـ esophagus.

          الـ grade C أو D بتتحسب **objective GERD**.
      - kind: check
        page: 4
        quote: "Stopping PPIs for 2–4 weeks also will facilitate a diagnosis of EoE, which is a diagnostic consideration when endoscopy is performed for patients with symptoms that are believed to be due to GERD but are not eliminated by PPIs"
        question: "Why is the PPI stopped for 2-4 weeks before endoscopy in suspected PPI-refractory GERD?"
        options:
          - "To unmask erosive esophagitis and to help diagnose EoE"
          - "Because PPIs make endoscopy unsafe"
          - "To raise gastrin before the biopsy"
          - "Because PPIs cause Barrett esophagus"
        answer: 0
        why:
          - "صح: الـ PPI بيعالج الـ EE فممكن تفوتها، ووقفه **2-4 weeks** بيسهّل تشخيص الـ EoE."
          - "المنظار آمن على الـ PPI؛ المشكلة إنه بيخبّي التشخيص."
          - "الـ gastrin ده موضوع الـ Zollinger-Ellison، مش هنا."
          - "الكتاب ما قالش كده؛ السبب هو الـ yield بتاع التشخيص."
      - kind: try
        items: [git.L01.001, git.L01.005, git.L01.011, git.L01.013]
    recap:
      - "الـ acid-related disorders خمسة، وكلهم حوالين الحمض."
      - "GERD = reflux بيعمل symptoms أو complications، والتشخيص الأكيد objective: منظار أو pH monitoring."
      - "الأعراض مش specific: rumination، achalasia، EoE، hypersensitivity، functional، والقلب والصدر."
      - "PPI مرة قبل الفطار ← double dose ← لو مفيش استجابة: دوّر على objective GERD."
      - "المنظار off PPI علشان الـ PPI بيخبّي الـ EE، وعلشان تلحق الـ EoE."
    practice: [git.L01.001, git.L01.002, git.L01.003, git.L01.004, git.L01.005, git.L01.006, git.L01.007, git.L01.008, git.L01.009, git.L01.010, git.L01.011, git.L01.012, git.L01.013, git.L01.014, git.L01.015, git.L01.163, git.L01.165, git.L01.199, git.L01.200]
