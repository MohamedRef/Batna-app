      - kind: check
        page: 175
        quote: "The combination of a TNF blocker and methotrexate was superior to either methotrexate or a TNF blocker alone, and the TNF blockers were relatively safe compared with methotrexate."
        question: "RA on methotrexate, still active. Best evidence in the lecture?"
        options:
          - "Add a TNF blocker to methotrexate"
          - "Swap methotrexate for a TNF blocker alone"
          - "Double the methotrexate"
          - "Add a T reg cell infusion"
        answer: 0
        why:
          - "صح: TNF blocker + methotrexate (MTX) أحسن من كل واحد لوحده."
          - "الـ TNF blocker لوحده أقل من الكومبو."
          - "الكتاب ما قارنش زيادة الجرعة."
          - "الـ T reg لسه مش متجرب إكلينيكيًا."
      - kind: table
        page: 176
        quote: "Ustekinumab is a human IgG1 kappa monoclonal antibody that binds to the shared p40 subunit of IL-12 and IL- 23. It is available for use in the treatment of psoriasis and psoriatic arthritis."
        title: "IL-17 ضد IL-12/23"
        columns: [Feature, Secukinumab, Ustekinumab]
        rows:
          - ["Target", "IL-17", "p40 of IL-12 and IL-23"]
          - ["Dosing", "Monthly SC", "Every 12 weeks SC"]
          - ["Uses", "Psoriasis, PsA, AS (uveitis)", "Psoriasis, PsA"]
        hide: [[0, 1], [0, 2], [1, 2]]
      - kind: aside
        tone: tip
        page: 176
        quote: "Its efficacy in rheumatoid arthritis appears to be modest"
        text: |
          الـ **secukinumab** ممتاز في الجلد والـ spine، بس في الـ ==rheumatoid arthritis (RA) efficacy modest==: مش هو اختيارك الأول للـ RA.
      - kind: reveal
        page: 176
        prompt: "إزاي antibody واحد (ustekinumab) بيقفل cytokine-ين مختلفين: IL-12 و IL-23؟"
        quote: "Ustekinumab is a human IgG1 kappa monoclonal antibody that binds to the"
        answer: |
          الكتاب: الـ **ustekinumab** بيمسك ==shared p40 subunit== اللي في الـ **IL-12** والـ **IL-23**، فبيمنعهم يركبوا على الـ receptors. والـ IL-12 والـ IL-23 بيعملوا **NK cell activation** و **CD4+ T-cell differentiation and activation**، وكمان الـ ustekinumab بيقلل **MCP-1**، **TNF-alpha**، **IP-10** و **IL-8**. بيتدّي **كل 12 أسبوع** تحت الجلد بعد loading doses، للـ psoriasis والـ psoriatic arthritis.

