  - id: geri.L04.lesson5
    title: "شخّص الـ delirium: DSM-5 والـ CAM والـ work-up"
    hook: "الـ CAM أربع حاجات، محتاج تلاتة بس منهم. وبعد ما تقول delirium، السؤال الحقيقي: إيه اللي عمله؟"
    minutes: 9
    pages: [70, 73]
    topics: [delirium-diagnosis]
    goals:
      - "تطبّق الـ Confusion Assessment Method (CAM) algorithm وتعرف ليه الـ inattention لازم"
      - "تعرف الـ rating scales: Delirium Rating Scale والـ Memorial Delirium Assessment Scale (MDAS)"
      - "تختار الـ investigations وإمتى computed tomography (CT) وإمتى lumbar puncture (LP)"
    status: unverified
    steps:
      - kind: explain
        remind: [geri.L04.065]
        page: 70
        quote: "DSM-5\n  Disturbance of consciousness.\n  Change in cognition.\n  The disturbance develops over a short period.\n  Evidence from the history, physical examination."
        title: "الـ DSM-5"
        text: |
          الكتاب ملخّص الـ ==DSM-5== في أربعة:
          - **Disturbance of consciousness** (attention وawareness).
          - **Change in cognition**.
          - بيحصل في **short period** (ساعات لأيام) و**fluctuates** في اليوم.
          - **Evidence** من الـ history والـ exam والـ labs إن فيه سبب.

          وشرط: مايتفسّرش بـ neurocognitive disorder تاني، ومايبقاش في **coma**.

          ليه الـ **consciousness** والـ attention أول شرط؟ لأن ده اللي بيفرق الـ delirium عن الـ dementia: في الـ dementia المريض صاحي ومركز بس الذاكرة واقعة، في الـ delirium الانتباه نفسه هو اللي واقع. وشرط الـ **evidence** موجود علشان الـ delirium دايمًا وراه سبب، فالتشخيص مش كامل من غير ما تدوّر عليه.
      - kind: figure
        page: 70
        quote: "Table 1. DSM-5 Diagnostic Criteria for Delirium"
        title: "الـ DSM-5 كامل: A لـ E"
        image: { file: geri/L04-dsm5-delirium.webp, book: true }
        alt: "The book's Table 1 of DSM-5 diagnostic criteria for delirium, criteria A to E: a disturbance in attention and awareness; developing over a short period and fluctuating; an additional disturbance in cognition; not explained by another neurocognitive disorder or severely reduced arousal such as coma; and evidence that it is a direct physiological consequence of a medical condition, substance intoxication or withdrawal, toxin or multiple causes."
        caption: |
          الصندوق اللي في ص 70 فيه المعايير بالتفصيل، 5 حروف من فوق لتحت:

          - **A**: disturbance في الـ ==attention== والـ awareness.
          - **B**: بييجي في وقت قصير (ساعات لأيام) و ==fluctuates== خلال اليوم.
          - **C**: disturbance زيادة في الـ cognition (memory، disorientation، language، perception).
          - **D**: A و C مش متفسّرين بـ neurocognitive disorder قديم، ولا بـ coma.
          - **E**: في دليل إنه نتيجة مرض أو دوا أو سحب دوا أو toxin.

          اللي تاخده: الـ attention هي أول معيار، وده اللي بيفرّق الـ delirium عن الـ dementia.
      - kind: explain
        remind: [geri.L04.067]
        page: 70
        quote: "It assesses the presence, severity, and fluctuation of 9 delirium features:"
        title: "الـ CAM بيبص على 9 حاجات"
        text: |
          الـ ==Confusion Assessment Method (CAM)== بيقيّم الـ presence والـ severity والـ fluctuation لـ **9 delirium features**:
          - Acute onset، **inattention**، disorganized thinking، altered level of consciousness.
          - Disorientation، memory impairment، perceptual disturbances.
          - Psychomotor agitation or retardation، altered **sleep-wake cycle**.

          بس التشخيص نفسه مبني على **4 cardinal elements** (الرسمة الجاية). ليه أربعة بس؟ التفسير المقبول (مش في الكتاب): لأنهم الأكتر specific للـ delirium. الـ disorientation والـ memory impairment موجودين في الـ dementia كمان، فمش بيفرّقوا.
      - kind: figure
        page: 71
        quote: "In which the first 2 and either of the latter 2 are required for diagnosis."
        title: "الـ CAM algorithm"
        alt: "Flow: box 1 acute onset and fluctuating course, plus box 2 inattention, both required; then an OR between box 3 disorganised thinking and box 4 altered level of consciousness; arrow to delirium."
        caption: "1 + 2 لازم، وبعدين 3 أو 4. أربع ميزات، تلاتة كفاية."
        svg: |
          <svg viewBox="0 0 330 270" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="D04c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <rect x="40" y="10" width="250" height="40" rx="8" class="fg-acc"/>
            <text x="52" y="35" class="t-sm t-b">1. Acute onset + fluctuating</text>
            <text x="158" y="68" class="t-b">AND</text>
            <rect x="40" y="78" width="250" height="40" rx="8" class="fg-acc"/>
            <text x="52" y="103" class="t-sm t-b">2. Inattention</text>
