        quote: "Use CT (portal phase ) for diagnostic confirmation and the assessment of extension."
        title: "التشخيص"
        text: |
          - **Doppler US:** الـ **first line**.
          - بس الـ Doppler والـ MR أقل **sensitivity** من الـ **CT**.
          - ==CT (portal phase)==: للـ **confirmation** وتقييم الـ **extension**.
      - kind: aside
