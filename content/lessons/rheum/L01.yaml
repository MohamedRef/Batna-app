  - id: rheum.L01.lesson4
    title: "لما الرسايل تبقى spam: الـ cytokine storm"
    hook: "رسالة واحدة مفيدة. مليون رسالة في ثانية؟ الجروب كله يهنج، والمريض كمان."
    minutes: 10
    pages: [15, 17]
    topics: [storm, diseases]
    goals:
      - "تعرّف الـ cytokine storm وتعدّ أسبابه، وتفهم ليه بيحصل"
      - "تعرف الصورة الإكلينيكية والمعملية، وتفسّر كل علامة"
      - "تفرّق septic shock عن toxic shock، وتعرف الـ cytokine antagonists بتشتغل إزاي"
    status: unverified
    steps:
      - kind: explain
        page: 15
        quote: "A severe immune reaction in which the body releases too many cytokines into the blood too quickly."
        title: "يعني إيه storm؟"
        text: |
          الـ ==cytokine storm== (hypercytokinemia) = **too many cytokines, too quickly**.

          بدل ما المناعة تنظّم هجوم على الميكروب، بتعمل **shock** و **multiorgan failure** وممكن موت.
      - kind: explain
        page: 15
        quote: "Cytokine interactions are powerful determinants of immunity, and the pattern of cytokines produced in response to a particular infection can spell the difference between an effective or inappropriate immune response."
        title: "ليه نفس الرسايل تنفع مرة وتضر مرة؟"
        text: |
          الكتاب بيقول إن **نمط** الـ cytokines اللي بتطلع مع العدوى هو اللي بيفرق بين response **effective** و response **inappropriate**.

          في الحالات المتطرفة: ==overproduction== و **dysregulation** ← hyperstimulation للمناعة ← ده الـ storm.

          ليه بيخرج عن السيطرة؟ التفسير المقبول (مش في الكتاب)، مبني على اللي اتعلمته في صفحة 5: الـ **cascade induction** بيخلّي كل cytokine يطلّع cytokines تانية، والـ **synergism** بيخلّي الاتنين مع بعض أقوى. لو الفرامل (زي TGF-β و IL-10) ماشتغلتش، الدايرة بتكبر لوحدها بدل ما تقف.
      - kind: reveal
        page: 15
        quote: "A cytokine storm can occur as a result of an infection, autoimmune condition, or some drugs (CAR T-cell therapy–induced cytokine storm) ."
        prompt: "إيه أسباب الـ storm في الكتاب؟"
        answer: |
          - **Infection**: influenza A، COVID، وبعض البكتيريا.
          - **Autoimmune condition**.
          - **Drugs**: CAR T-cell therapy.
          - **Immunotherapy**: high-dose IL-2 لمرضى السرطان.
      - kind: case
        page: 15
        quote: "A cytokine storm can occur as a result of an infection, autoimmune condition, or some drugs (CAR T-cell therapy–induced cytokine storm) ."
        stem: "A 24-year-old man with lymphoma gets CAR T-cell therapy. On day 3: fever 40 °C, BP 80/50, SpO2 88%."
        steps:
          - question: "What is the most likely diagnosis?"
            options: ["Cytokine storm", "Toxic shock syndrome", "Anaphylaxis"]
            answer: 0
            why: "CAR T-cell therapy مذكور بالاسم كسبب. Toxic shock محتاج superantigen toxin، والـ anaphylaxis فورية مش بعد 3 أيام."
          - reveal: "CRP 300 mg/L, ferritin very high, platelets 50 × 10^9/L."
            question: "Which finding tracks severity best, per the book?"
            options: ["CRP", "IgE", "Eosinophil count"]
            answer: 0
            why: "الكتاب: CRP universally elevated and correlates with severity."
      - kind: explain
        page: 16
        quote: "In addition, patients may have fatigue, anorexia, headache, rash, diarrhea, arthralgia, myalgia, and neuropsychiatric findings."
        title: "ليه المريض تعبان في كل حتة؟"
        text: |
          الكتاب: تقريبًا **كل** المرضى عندهم fever، وممكن تكون عالية في الحالات الشديدة. وكمان: fatigue و anorexia و headache و rash و diarrhea و arthralgia و myalgia وأعراض neuropsychiatric.

          ليه الأعراض منتشرة كده؟ ارجع لـ Table 12-1 في صفحة 6:
          - **IL-1** بيكلم الـ ==hypothalamus== ← fever.
          - **TNF-α** بيعمل loss of muscle و body fat ← الإرهاق وفقدان الشهية.
          - **IL-1 و IL-6 و TNF-α** بيكلموا الكبد ← acute phase proteins، وده اللي هتشوفه في الـ CRP.

          يعني الـ cytokines اللي المفروض تشتغل **جنب** المصدر (paracrine)، بقت في الدم كله (endocrine)، فكل عضو بيستقبلها.
      - kind: figure
        page: 16
        quote: "The combination of renal dysfunction, endothelial-cell death, and acute-phase hypoalbuminemia can lead to capillary leak syndrome and anasarca."
        title: "العاصفة بتضرب فين؟"
        alt: "A central box labelled cytokine storm with fever in nearly all. Arrows to organ boxes: lungs ARDS, blood DIC and bleeding, circulation vasodilatory shock, kidney failure, liver injury or cholestasis, heart stress cardiomyopathy, vessels capillary leak and anasarca."
        caption: "Fever في الكل تقريبًا، وبعدها كل عضو ممكن يتأثر."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R01c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
