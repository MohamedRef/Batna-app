      - kind: explain
        page: 242
        title: "ليه كل variant في مكانه؟"
        quote: "What will be your management plan? Focal segmental glomerulosclerosis (Types)"
        text: |
          جدول **focal segmental glomerulosclerosis (types)** في الكتاب:
          - **NOS**: الـ generic form، ==الأشهر==، والـ variants التانية ممكن تتحول له مع الوقت.
          - **Perihilar**: hyalinosis و sclerosis عند الـ **vascular pole**، شائع في الـ **adaptive** FSGS مع **glomerulomegaly**، و subnephrotic proteinuria مع albumin طبيعي.
          - **Cellular**: **الأقل** شيوعًا، وغالبًا **early stage** قبل الـ sclerosis.
          - **Tip**: عند الـ **tubular pole**، و ==أحسن== prognosis.
          - **Collapsing**: tuft بيقع مع podocytes متضخمة، و ==أسوأ== prognosis.

          التفسير المقبول (مش في الكتاب) للـ prognosis:
          - الـ **tip** غالبًا podocyte injury حاد بيرد على الـ steroids زي الـ minimal change، فبيخف.
          - الـ **collapsing** فيه الـ podocytes نفسها **بتتكاثر وبتفقد شكلها** (dysregulated)، غالبًا من virus زي HIV، فالفلتر بيتهد بسرعة والـ steroids مش بتلحق.
          - الـ **perihilar adaptive** مش مرض مناعي أصلًا؛ ده glomerulus شغال فوق طاقته، علشان كده الـ albumin طبيعي والبروتين أقل.
          يعني الـ variant مش اسم تشريحي بس؛ ده بيلمّح للسبب وللعلاج.

          ليه الـ variant مهم للعيان؟ التفسير المقبول (مش في الكتاب): الـ **tip** بيرد على الـ steroids أحسن، و prognosis كويس. الـ **collapsing** أوحش variant، وبيروح للـ ESKD بسرعة، وبيرتبط بفيروسات زي HIV و parvovirus. الـ **perihilar** غالبًا adaptive (ضغط زيادة عند الـ vascular pole)، فالعلاج ACEi مش IS. يعني الـ variant بيقول للـ clinician: تدي steroids ولا لأ، وتتوقع إيه.
