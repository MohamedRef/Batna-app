        quote: "Relative risk of developing Ankylosing B27 90 autoimmune disease in spondylitis individuals who inherit Rheumatoid particular HLA allele(s) arthritis DR2 4 compared to individuals IDDM DR3/DR4 25 lacking these alleles DR4 14 Pemphigus vulgaris"
        text: "جدول الكتاب كاتب **DR2** للـ rheumatoid arthritis، بس المرجع الأصلي والكتب كلها بتقول ==HLA-DR4==، وده الـ shared epitope. والـ DR2 ده بتاع الـ multiple sclerosis. لو السؤال من جدول الكتاب اكتب اللي فيه، وخلّي بالك من الفرق."
        ref: "Abbas, Lichtman and Pillai, Basic Immunology, 6th ed., 2020 (MHC–disease table)"
      - kind: aside
        tone: tip
        page: 81
        quote: "Animal models: breeding studies establish"
        text: |
          الـ **relative risk** = الـ incidence في اللي ورثوا الـ allele مقسومة على اللي ما ورثوهوش.

          احفظ الترتيب من الأعلى: **B27 = 90**، **DR3/DR4 = 25**، **DR4 pemphigus = 14**، **rheumatoid arthritis (RA) = 4**. وفي الـ animal breeding studies والـ genome scanning، المثال هو **insulin-dependent diabetes mellitus (IDDM)** في الحالتين.
