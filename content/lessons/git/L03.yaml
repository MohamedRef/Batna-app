        hide: [[0, 1], [1, 1], [1, 2]]
      - kind: reveal
        page: 124
        quote: "Diarrhoea-predominant\n| | 1st | 2nd |\n|---|---|---|\n| Without pain or bloating | lifestyle and dietary modifications + antidiarrheals; 1st options: loperamide/colestyramine; 2nd options: alosetron/eluxadoline | |\n| With pain or bloating | lifestyle and dietary modifications; antidiarrheals 1st options: loperamide/colestyramine; 2nd options: alosetron/eluxadoline/rifaximin; antispasmodics Dicycloverine/hyoscyamine/peppermint oil | lifestyle and dietary modifications; tricyclic antidepressants Desipramine/amitriptyline/doxepin; adjunct cognitive behaviour therapy (CBT) or hypnotherapy |"
        prompt: "ليه في IBS-D الـ second line هو TCA، وفي IBS-C هو SSRI؟"
        answer: |
          الاتنين بيهدّوا الـ visceral pain، بس ليهم أثر جانبي مختلف على المصران:

          - الـ **TCAs** (desipramine، amitriptyline، doxepin) ليها anticholinergic effect، فبتبطّأ الـ transit وبتمسك. ده عيب في IBS-C وميزة في ==IBS-D==.
          - الـ **SSRIs** بتسرّع الـ transit شوية، فبتنفع أكتر في ==IBS-C==.

          ودايمًا **CBT** أو **hypnotherapy** كـ adjunct. وجديد: **ramosetron** و **ondansetron** في IBS-D (الـ ramosetron بيعمل constipation في حوالي 10%).

          (الـ pharmacology دي عامة، والكتاب بيدّي الـ ladder من غير ما يشرح السبب.)
      - kind: explain
        page: 124
        quote: "alternating constipation and diarrhoea"
        title: "لما بيقلّب: alternating"
        text: |
          الكتاب، الـ **alternating constipation and diarrhoea**:
          - **من غير ألم أو bloating**: lifestyle و diet، ومعاهم **laxatives** أو **loperamide** كـ adjunct حسب العرض.
          - **مع ألم أو bloating**: lifestyle و diet، وبعدين ==TCA أو SSRI== (desipramine، amitriptyline، doxepin، paroxetine، citalopram)، ومعاهم antispasmodics أو loperamide أو **CBT** أو **hypnotherapy**.

          التفسير المقبول (مش في الكتاب): ليه هنا TCA **أو** SSRI؟ لأن الـ TCA بيمسك (anticholinergic) فينفع أيام الإسهال، والـ SSRI بيسرّع فينفع أيام الإمساك. في الـ alternating تختار حسب أي ناحية بتغلب، وتعالج الناحية التانية بالـ adjunct في وقتها.
      - kind: explain
        page: 125
        quote: "Reducing diarrhoea and abdominal pain in diarrhoea-predominant IBS."
        title: "علاجات جديدة للـ IBS-D"
        text: |
          الكتاب، **emerging treatment**:
          - ==Ramosetron==: بيقلّل الـ **diarrhoea** والـ **abdominal pain** في الـ IBS-D. الـ **constipation** side effect في حوالي **10%**.
          - ==Ondansetron==: دراسة prospective كبيرة: فعّال قدام الـ placebo في الـ **diarrhoea** والـ **well-being** في الـ IBS-D.

          التفسير المقبول (مش في الكتاب): الاتنين **serotonin type 3 antagonists**، يعني بيقفلوا مستقبلات الـ serotonin اللي بتسرّع الأمعاء وبتوصّل الألم. علشان كده بينفعوا في الـ diarrhoea، والـ side effect المتوقع منطقيًا هو العكس: إمساك.
