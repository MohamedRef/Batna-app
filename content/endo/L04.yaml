  # ---------- p65-66, p73-75: HIV ----------
  - id: endo.L04.150
    kind: card
    topic: hiv
    front: How can HIV affect the endocrine glands?
    back: Endocrine dysfunction is not prominent, but any gland can be infiltrated by opportunistic infections or tumours, or affected by HIV drugs.
    src: { page: 65, quote: "Endocrine dysfunction has not been prominent in HIV infection. Nonetheless, all glands of the endocrine system may be infiltrated with opportunistic infections or malignancies or may be affected by drugs used to treat HIV-related disorders." }
    status: unverified
  - id: endo.L04.151
    kind: card
    topic: hiv
    front: Which symptoms does the book say are frequently noted in many HIV-infected patients?
    back: Fatigue, anorexia, nausea, vomiting, orthostatic hypotension and hyponatraemia.
    src: { page: 66, quote: "Fatigue, anorexia, nausea, vomiting, orthostatic hypotension, and\nhyponatremia are symptoms frequently noted in many HIV-infected patients Basal 8 A.M. plasma cortisol levels are usually higher in patients with advanced HIV disease than in asymptomatic patients and uninfected healthy controls." }
    status: unverified
  - id: endo.L04.152
    kind: card
    topic: hiv
    front: What is the adrenal steroid pattern in advanced HIV?
    back: Basal 8 a.m. cortisol is higher than in controls, but DOC, compound B and 18-OH-DOC are not raised and respond poorly to ACTH, implying low adrenal reserve.
    src: { page: 66, quote: "Fatigue, anorexia, nausea, vomiting, orthostatic hypotension, and hyponatremia are symptoms frequently noted in many HIV-infected patients Basal 8 A.M. plasma cortisol levels are usually higher in patients with advanced HIV disease than in asymptomatic patients and uninfected healthy controls. However, other ACTH-dependent steroids, such as desoxycorticosterone (DOC), compound B, and 18- hydroxy-DOC, are not elevated and show a blunted response to corticotropin (ACTH) stimulation, implying subnormal adrenal reserves." }
    status: unverified
    tags: [high-yield]
