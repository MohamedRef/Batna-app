- id: res.L19.096
  kind: card
  topic: appraise
  front: A drug increases the risk of an adverse effect from 10% to 40%. Work out the ARI and NNH as the slide does.
  back: 'ARI = 0.4 − 0.1 = 0.3 (30%). NNH = 1/0.3 = 3 (3.3, which the slide writes as 3): 3 people need to be treated for
