  # Split from lesson1 on 2026-11-13 (#828): gout, CPPD, PMR and vasculitis.
  - id: rheum.L13.lesson5
    title: "السونار في الـ gout والـ PMR والـ GCA"
    hook: "خط فوق الغضروف، وخط جوه الغضروف، وهالة حوالين شريان: تلات علامات بتفرق أمراض بالكامل."
    minutes: 7
    pages: [213, 213]
    topics: [other]
    goals:
      - "تفرّق الـ double contour من الـ chondrocalcinosis وتعرف ليه"
      - "تعرف علامات الـ PMR والـ halo sign"
    status: unverified
    steps:
      - kind: explain
        page: 213
        title: "الـ Gout والـ CPPD"
        quote: "Double contour sign in gout.\nChondrocalcinosis in CPPD.\nVisualization of tophi, erosions, and joint inflammation."
        text: |
          الكتاب:
          - ==Double contour sign== في الـ **gout**
          - ==Chondrocalcinosis== في الـ **CPPD**
          - ونشوف **tophi** و **erosions** والـ joint inflammation

          ليه "double"؟ التفسير المقبول (مش في الكتاب، والكتاب بيقول نفس الفكرة في شرح السؤال ص 219): بلورات الـ urate بتترسب **على سطح** الغضروف، فبيبان خط أبيض فوق الغضروف موازي لخط العضم تحته، فيبقوا خطين. أما الـ calcium pyrophosphate فبيترسب **جوه** الغضروف نفسه، فبيبان نقط بيضا في نص الطبقة السودا.
      - kind: figure
        page: 213
        quote: "Double contour sign in gout.\nChondrocalcinosis in CPPD."
        title: "فوق الغضروف ولا جواه؟"
        alt: "Two panels of cartilage over bone. Left, gout: a bright white line runs on top of the dark cartilage band, parallel to the bright bone line underneath, making two contours. Right, CPPD: bright dots sit inside the dark cartilage band."
