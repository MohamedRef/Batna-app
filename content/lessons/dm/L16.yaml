      - kind: explain
        page: 211
        title: "Case 6: ممرضة خايفة، وكان عندها حق"
        quote: "She was worried about her glycemic status & to allay her fears, a 75 g OGTT was performed."
        text: |
          ممرضة 29 سنة، أول حمل، أسبوع 6، BMI 23. أبوها وأمها **T2DM** وأختها كان عندها **GDM** وبعدين T2DM.

          - عشان تطمن عملوا **75 g OGTT** في أسبوع 6: fasting ==113== و 2-hour 146، فاتشخّصت **GDM** وأخدت نصايح أكل.
          - الحمل ==أجهض== في أسبوع 10، والـ OGTT بعد 8 أسابيع ==طبيعي==.
          - النصيحة: OGTT أول ما الحمل الجاي يتعرف.

          ليه الـ family history تخلّيك تعمل OGTT بدري كده؟ لأن العيلة كلها T2DM و GDM، يعني الاستعداد للـ insulin resistance موجود، والحمل هيكشفه بدري.
      - kind: explain
        page: 211
        title: "الحمل التاني: إنسولين بيزيد مع الحمل"
        quote: "The insulin doses needed increase with advancing pregnancy. At the end of the pregnancy, the daily insulin dose was 30 units."
        text: |
          - حملت تاني بعد 6 شهور. OGTT في أسبوع 6: fasting 102 و 2-hour ==180==، و HbA1c ==6.6%==.
          - اتشخّصت GDM وبدأت **basal-bolus insulin**، ومتابعة كل 2–4 أسابيع حسب السيطرة.
          - المتوسط: fasting 77 و 2-hour 122، و HbA1c أقل من 6.5%.
          - الجرعة ==بتزيد مع الحمل==، ووصلت 30 unit في اليوم في الآخر. ووزنها زاد 13 kg.
          - في 37 أسبوع: premature rupture of the membranes، والـ induction عمل fetal bradycardia، فـ emergency CS، وبنت 2850 g كويسة.
          - السكر رجع طبيعي تاني يوم، فوقفوا الإنسولين.

          التفسير المقبول (مش في الكتاب) للنقطتين: الـ **placenta** بتطلّع هرمونات بتعمل insulin resistance وبتكبر مع الحمل، فالجرعة بتزيد. وأول ما الـ placenta تخرج، المقاومة بتروح، فالسكر بينزل في يوم.
