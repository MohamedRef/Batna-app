          - "Combined folate and B12 deficiency"
          - "Iron deficiency"
        answer: 0
        why:
          - "صح: الـ folate deficiency بيرفع الـ homocysteine والـ MMA بيفضل طبيعي."
          - "الـ B12 deficiency بيرفع الـ MMA."
          - "لو الاتنين ناقصين الـ MMA هيعلى والـ B12 هيقل."
          - "الحديد مش في الجدول ده خالص."
      - kind: explain
        page: 16
        title: "الـ transfusion: restrictive"
        quote: "Packed red blood cells: restrictive indication."
        text: |
          الكتاب: الـ **packed RBCs** ليها ==restrictive indication==، والقرار **لكل عيان لوحده**، على حسب **الأعراض**.

          - **Acute blood loss**: فكّر لو ==Hb < 8.0 g/dL==.
          - **Chronic anaemia**: Hb **6–8 g/dL** غالبًا مستحمَل.
          - **Coronary heart disease** أو خطر **cerebral ischaemia**: ==Hb < 10 g/dL==.
          - حالات خاصة (perioperative، **thalassaemia major**) ممكن تحتاج دعم.
          - **نزيف من غير أعراض** مش indication.
