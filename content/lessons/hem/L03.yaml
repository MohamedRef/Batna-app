            answer: 0
            why: "الـ retics قربت من الصفر بعد عدوى = الـ parvovirus وقّف الـ erythroblasts. في الـ haemolytic الـ retics بتعلى، وفي الـ sequestration الطحال بيكبر."
          - question: "What does he need now?"
            options: ["Red cell transfusion", "Hydroxyurea dose increase", "Splenectomy", "Iron tablets"]
            answer: 0
            why: "الكتاب: الـ **transfusion support** ضروري في الـ aplastic phase، لحد ما النخاع يرجع بعد **7–10 أيام**."
          - question: "Why is his spleen not felt at age 7?"
            options: ["Repeated infarcts made it small and fibrotic", "It was never enlarged", "Parvovirus destroyed it", "Hydroxyurea shrank it"]
            answer: 0
            why: "الطحال بيكون كبير في الرضيع، وبعدين بيصغر ويتليّف من الـ infarctions المتكررة، وده سبب العدوى الـ fulminant."
