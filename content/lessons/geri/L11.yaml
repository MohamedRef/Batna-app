      - kind: explain
        page: 194
        quote: "Older persons have limited capacity to perform multiple FVC maneuvers, and may have an adverse response to an inhaledBD."
        title: "الـ reversibility"
        text: |
          الـ COPD = chronic airflow obstruction **مش fully reversible**. فالـ guidelines بتعمل spirometry قبل وبعد bronchodilator:

          - عشان الـ ==reversibility== (pre مقابل post).
          - والتشخيص بالـ **post-BD values**.

          بس في الكبار: صعب يعملوا forced vital capacity (FVC) maneuvers كتير، وممكن يحصل adverse response للـ bronchodilator (BD).

          التفسير المقبول (مش في الكتاب) لليه: كل maneuver نفخة قوية لآخر نَفَس، والمسن عضلاته أضعف وبيتعب أو يدوخ بعد كام مرة. والـ BD (زي الـ salbutamol) ممكن يعمل رعشة وسرعة في القلب عنده.
      - kind: explain
        page: 196
        quote: "Z -score\n  The Z-score represents how many SD the measured value is away from the mean predicted value.\n  If a Z score is 0 it indicates that the data point score is identical to the mean score.\n  Z scores may be positive or negative.\n  Positive value indicates the score is above the mean.\n  Negative value indicates the score is below the mean.\n  Z-score of −1 would be one SD below the mean predicted value."
        title: "يعني إيه Z-score؟"
        text: |
          الـ ==Z-score== = المريض بعيد عن المتوسط المتوقع بكام **standard deviation (SD)**.

          **z = (x - mean) / SD**

          - 0 = زي المتوسط بالظبط.
          - موجب = فوق المتوسط، سالب = تحت.
          - -1 = SD واحد تحت المتوسط.

          وفي الـ normal curve: **68%** جوه 1 SD، **95%** جوه 2، و **99.7%** جوه 3.
      - kind: figure
        page: 196
        title: "الـ Z-score زي ما الـ GLI بترسمه"
        image: { file: geri/L11-gli-zscore.webp, book: true }
        alt: "The Global Lung Function Initiative figure from the book: a bell-shaped normal distribution with Z-scores from -6 to +4 on the x-axis and percentiles marked (0.1, 2, 5, 50, 95, 98, 99.9), lines at Z -1.64 and +1.64; below it three horizontal bars for FEV1, FVC and FEV1/FVC, white in the normal range and dark outside it, each with an arrow showing one patient's result, and marks at -1.96 and +1.96."
        caption: |
          الرسمة اللي الكتاب جايبها من الـ Global Lung Function Initiative:

          - **فوق**: الـ bell curve. النص = **Z 0** = الـ 50th percentile = 100% predicted. الخطين عند ==−1.64 و +1.64== هم الـ 5th و 95th percentile.
          - **تحت**: 3 بارات للـ **FEV1** والـ **FVC** والـ **FEV1/FVC**. الأبيض في النص = طبيعي، والغامق على الجنبين = برّه الطبيعي، والفاتح الرفيع بينهم = منطقة الحدود لحد ±1.96.
          - **الأسهم الزرقا**: نتيجة عيان واحد. الـ FVC في النص (طبيعي)، والـ FEV1 والـ ratio على الشمال في الغامق: ==obstruction==.

          اللي تاخده: بدل "أقل من 80% predicted"، بتشوف النقطة واقعة فين بالنسبة لناس في نفس سنه.
