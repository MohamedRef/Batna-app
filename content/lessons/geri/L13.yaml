        quote: "Severe pain (7-10/10): Begin a standing short-acting opioid (morphine sulfate, oxycodone, and hydromorphone) and titrate rapidly until pain relief is obtained or intolerable side effects develop. Strongly consider a parenteral opioid and titrate by 50%-100% of the dose every 30-60 min until pain is controlled. Long-acting opioids (sustained release morphine/oxycodone and transdermal fentanyl) should typically be started only after pain is well controlled and steady state is achieved."
        title: "الـ long-acting إمتى؟"
        text: |
          الـ ==sustained-release== morphine أو oxycodone والـ **transdermal fentanyl**: **بعد** ما الألم يتظبط ويوصل لـ steady state، مش في الأول.

          ليه؟ التفسير المقبول (مش في الكتاب): الدوا الـ long-acting بياخد وقت عشان يوصل لـ steady state، فلو زوّدته كل ساعة مش هتشوف أثر كل زيادة قبل اللي بعدها، وممكن تتراكم الجرعات وتعمل toxicity. الـ short-acting بيوريك النتيجة بسرعة، فتعرف الجرعة اللي بتكفي، وبعدين تحوّلها long-acting.
      - kind: mnemonic
        page: 225
        quote: "Adjuvant agents (corticosteroids, anticonvulsants, tricyclic antidepressants, and bisphosphonates) can be used depending on the pain syndrome and response to opioids."
