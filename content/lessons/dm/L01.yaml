  - id: dm.L01.lesson4
    title: "سلّم الأرقام: تشخّص السكر إزاي"
    hook: "100، 126، 140، 200، 5.7، 6.5: ستة أرقام بتفرق بين واحد سليم وواحد diabetic."
    minutes: 10
    pages: [8, 11]
    topics: [lab]
    goals:
      - "تحفظ الـ cut-offs للـ FPG والـ 2h-PPPG والـ A1C"
      - "تعرف امتى test واحد يكفي وامتى لازم اتنين"
      - "تعرف عيوب الـ A1C وإمتى ما تستخدمهوش"
    status: unverified
    steps:
      - kind: explain
        page: 8
        title: "ليه نهتم بالتشخيص؟"
        quote: "One third of cases are undiagnosed 10-20% of cases of type 2 diabetes have serious vascular disease at presentation."
        text: |
          - ==تلت== الحالات **undiagnosed**.
          - **10–20%** من type 2 عندهم **serious vascular disease** وقت التشخيص.

          التشخيص بيبقى بـ **glucose in venous plasma** أو **A1C**. أما الـ **glycosuria**؟ لازم **urgent blood glucose**، بس ==not a diagnostic tool==: الـ renal threshold (حوالي **180**) بيختلف من حد للتاني.
      - kind: explain
        page: 9
        title: "سكر البلازما: رخيص بس متقلّب"
        quote: "The high diurnal variation in glucose and fasting requirement."
        text: |
          **مميزاته:** رخيص، ومتاح في كل حتة.

          **عيوبه:**
          - **diurnal variation** عالية، ومحتاج صيام.
          - العيان ممكن ما يقدرش يصوم **8 ساعات** أو يكدب في الصيام.
          - بيتأثر بـ **المجهود، المرض، الـ stress**.
          - ==Glycolysis==: لو العينة اتأخرت، السكر يطلع **falsely low**.
      - kind: reveal
        page: 9
        quote: "Glucose concentrations will be falsely low if samples are not processed promptly or appropriately stored prior to analysis."
        prompt: "العينة قعدت 4 ساعات على الرف. السكر هيطلع أعلى ولا أقل؟ وليه؟"
        answer: |
          **أقل.** كرات الدم في الأنبوبة لسه عايشة وبتاكل جلوكوز (**glycolysis**)، فكل ساعة السكر بينقص.

          علشان كده الكتاب بيقول falsely low لو العينة **not processed promptly**. (الـ mechanism فسيولوجي، والنتيجة من الكتاب.)
      - kind: explain
        page: 10
        title: "التلات tests"
        quote: "blood sample taken 2 hours after a person has consumed a 75 g oral glucose powder dissolved in 250 ml water"
        text: |
          1. **Random plasma glucose:** أي وقت.
          2. **Fasting plasma glucose:** صيام **8 لحد 12 ساعة** (overnight).
          3. **2h-PPPG:** بعد ساعتين من ==75 g glucose== في **250 ml** ميه.
