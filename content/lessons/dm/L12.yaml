      - kind: explain
        page: 147
        title: "ليه الترتيب ده؟"
        quote: "KIDIGO 2022: Holistic approach for improving outcomes in patients with\n    diabetes and CKD"
        text: |
          الـ KDIGO 2022 بيسمّيها **holistic approach**: الأدوار مبنية فوق بعض، يعني ما ينفعش تطلع دور من غير اللي تحته. التفسير المقبول (مش في الكتاب) لكل دور:

          - **Lifestyle تحت الكل**: لأن الأكل والحركة والسجاير والوزن بيأثروا على السكر والضغط والدهون مع بعض، ومن غيرهم أي دوا هيشتغل نص شغل.
          - **First-line لكل العيانين**: دول الأدوية اللي بتحمي القلب والكلية **لأي عيان** سكر مع CKD، مش بس اللي سكره عالي. الـ **SGLT2i** بيكمّل لحد الـ dialysis لأن فايدته على الكلية مش على السكر، والـ **metformin** بيقف تحت 30 عشان خطر الـ lactic acidosis.
          - **Targeted**: كل دوا ليه **رقم** بيوجّهه (HbA1c، ACR، BP، ASCVD)، فبتضيفه لما الرقم ده ما يوصلش للهدف.
          - **Reassess كل 3–6 شهور**: لأن الـ eGFR والـ ACR بيتغيروا، والجرعات معاهم.
