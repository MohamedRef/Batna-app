      - kind: order
        page: 461
        quote: "Figure 12: Management of patients who show unsatisfactory response to initial therapy for active lupus nephritis.\n1. Verify adherence to treatment\n2. Ensure adequate dosing of immunosuppressive medications by measuring plasma drug levels if applicable or available (check mycophenolic acid level if on mycophenolic acid analogs/check infusion records if on cyclophosphamide)\n3. Repeat biopsy if concern for chronicity or other diagnosis (e.g., thrombotic microangiopathy)\n4. Consider switching to an alternative first-line regimen when there is persistent disease activity\n5. Consider the following in patients refractory to first-line treatment regimens:\n  Addition of rituximab or other biologic therapies\n  Extended course of i.v. pulse cyclophosphamide\n  Enrollment in clinical trials if eligible\ni.v., intravenous."
        prompt: "مريض عنده unsatisfactory response للـ initial therapy. رتّب الخطوات:"
        steps:
