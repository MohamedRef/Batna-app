      - kind: check
        page: 8
        quote: "Types of intervention studies:\n  Randomized interventional studies\n  Non randomized interventional studies (Quasi experimental trials)\nRandomization is a key feature"
        question: "A surgeon gives a new wound dressing to all patients on his own ward and compares infection rates with the ward next door. Which design is this?"
        options:
          - "Non-randomised (quasi-experimental) trial"
          - "Randomised controlled trial"
          - "Cohort study"
          - "Case-control study"
        answer: 0
        why:
          - "صح: هو اللي اختار مين ياخد الـ dressing (assigned)، بس من غير random allocation."
          - "مفيش randomization؛ العنبر هو اللي حدّد، مش القرعة."
          - "في الـ cohort الباحث بيتفرّج على exposure موجود، هنا هو اللي ادّاه."
          - "الـ case-control بيبدأ من الـ outcome ويرجع يدوّر على الـ exposure."
      - kind: explain
        page: 4
        quote: "Hierarchy of Research Designs & Levels of Scientific Evidence (based on ability to control for bias and to demonstrate cause and effect in humans), top to bottom:\n  Secondary, pre-appraised, or filtered Studies:\n    Clinical Practice Guidelines\n    Meta-Analysis, Systematic Reviews\n  Primary Studies:\n    Randomized Controlled Trial. Prospective, tests treatment\n    Observational Studies: Cohort Studies. Prospective: cohort has been exposed to a risk. Observe for outcome of interest\n    Observational Studies: Case Control Studies. Retrospective: subjects have the outcome of interest; looking for risk factor\n  No design: Case Report or Case Series; Narrative Reviews, Expert Opinions, Editorials\n  Not involved w/ humans: Animal and Laboratory Studies"
        title: "هرم الـ evidence: ليه الـ RCT فوق؟"
        text: |
          الهرم مترتّب على حاجة واحدة: ==ability to control for bias== وإن التصميم يقدر **يثبت cause and effect في البني آدمين**.

          - فوق خالص: **clinical practice guidelines** و **meta-analysis / systematic reviews**. دول **secondary (filtered, pre-appraised)**: بيلمّوا دراسات تانية.
          - بعدهم الـ **primary studies**: الـ **RCT** (prospective, tests treatment)، تحته **cohort**، تحته **case-control**.
          - تحتهم **case report / case series** و expert opinion و editorials: الهرم بيسميهم **no design**.
          - وفي القاع **animal and laboratory studies**: مفيهاش بني آدمين أصلًا.
      - kind: figure
        page: 4
        quote: "Hierarchy of Research Designs & Levels of Scientific Evidence (based on ability to control for bias and to demonstrate cause and effect in humans), top to bottom:\n  Secondary, pre-appraised, or filtered Studies:\n    Clinical Practice Guidelines\n    Meta-Analysis, Systematic Reviews\n  Primary Studies:\n    Randomized Controlled Trial. Prospective, tests treatment\n    Observational Studies: Cohort Studies. Prospective: cohort has been exposed to a risk. Observe for outcome of interest\n    Observational Studies: Case Control Studies. Retrospective: subjects have the outcome of interest; looking for risk factor\n  No design: Case Report or Case Series; Narrative Reviews, Expert Opinions, Editorials\n  Not involved w/ humans: Animal and Laboratory Studies"
        title: "الهرم"
        alt: "Evidence pyramid from top to bottom: clinical practice guidelines, meta-analysis and systematic reviews (secondary, filtered), randomized controlled trial, cohort studies, case-control studies (primary), case reports and series and expert opinion (no design), animal and laboratory studies (not in humans)."
        caption: "كل ما تطلع لفوق، الـ bias بيقل والقدرة على إثبات السببية بتزيد. الـ RCT أعلى **primary** design."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <path d="M145 10h40l11 34h-62z" class="fg-thin"/>
            <text x="165" y="32" text-anchor="middle" class="t-sm">Guidelines</text>
            <path d="M134 44h62l11 34h-85z" class="fg-thin"/>
