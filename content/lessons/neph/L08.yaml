          التفسير المقبول (مش في الكتاب)، المنطق واحد: **بروتين كتير + بيتطبّق غلط = amyloid**:
          - **AL**: clone من الـ plasma cells (أو B cells) بيطلّع **light chains** بكميات، وبعض الـ light chains بتتطبّق fibrils.
          - **AA**: الـ **serum amyloid A** بروتين acute-phase بيعلى مع أي **التهاب مزمن** (RA، TB، FMF)، ولو فضل عالي سنين بيترسّب.
          - **AF**: **mutation** في بروتين (زي الـ transthyretin) بتخلّيه أسهل يتطبّق غلط، فبيجري في العيلة.
          - **ATTRwt**: الـ transthyretin **العادي** بيبدأ يتطبّق غلط مع **السن**، والقلب أكتر مكان.
          - **Dialysis-related**: الـ **β2-microglobulin** بروتين صغير الكلية السليمة بتطلّعه، والـ dialysis ما بيشيلوش كويس فبيتجمّع.
          يعني لو عرفت البروتين، تعرف تدوّر على السبب: clone، التهاب، عيلة، سن، أو dialysis.

          إزاي تفتكر الـ EM لكل مرض ترسيب؟ التفسير المقبول (مش في الكتاب): بالمقاس: الـ amyloid ألياف **8–12 nm** عشوائية، الـ fibrillary **~20 nm**، الـ immunotactoid **> 30 nm** أنابيب منظمة. والـ light chain deposition **مش ألياف**، ده powdery deposits على الغشا. فالـ EM هنا بيبقى مسطرة: بتقيس قطر الليفة وتعرف المرض.
