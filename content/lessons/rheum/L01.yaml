      - kind: explain
        page: 11
        quote: "Cytokine receptors exist in structurally related superfamilies and comprise high-affinity molecular signaling complexes that assist cytokine-mediated communication (see Figure 26-1). Such complexes often include heterodimeric or heterotrimeric structures that use unique, cytokine-specific recognition receptors together with common receptor chains shared across a cytokine superfamily. Examples include the use of the common γ chain receptor by IL-2, IL-4, IL-7, IL-9, IL-15, IL-21, and glycoprotein 130 (gp130) by members of the IL-6 family.5,6 Alternatively, distinct receptors may use shared signaling domains. Homologous death domains are found in many TNF-receptor family members. Similarly, the IL-1 signaling domain is common to not only IL-1R but also other IL-1R superfamily members including IL-18R, IL-33R, and the Toll-like receptors."
        title: "الـ receptors بتتشارك سلاسل"
        text: |
          الـ receptor complex غالبًا heterodimer أو heterotrimer: **سلسلة خاصة** بالـ cytokine + **سلسلة مشتركة** للعيلة كلها.

          - ==common γ chain==: IL-2، IL-4، IL-7، IL-9، IL-15، IL-21.
          - **gp130**: عيلة IL-6.
          - **Death domains**: في كتير من الـ tumour necrosis factor (TNF) receptors.
          - **IL-1 signalling domain**: مشترك بين IL-1R و IL-18R و IL-33R والـ Toll-like receptors.
      - kind: mnemonic
        page: 11
        quote: "Cytokine receptors exist in structurally related superfamilies and comprise high-affinity molecular signaling complexes that assist cytokine-mediated communication (see Figure 26-1). Such complexes often include heterodimeric or heterotrimeric structures that use unique, cytokine-specific recognition receptors together with common receptor chains shared across a cytokine superfamily. Examples include the use of the common γ chain receptor by IL-2, IL-4, IL-7, IL-9, IL-15, IL-21, and glycoprotein 130 (gp130) by members of the IL-6 family.5,6 Alternatively, distinct receptors may use shared signaling domains. Homologous death domains are found in many TNF-receptor family members. Similarly, the IL-1 signaling domain is common to not only IL-1R but also other IL-1R superfamily members including IL-18R, IL-33R, and the Toll-like receptors."
        word: "2479"
        hook: "افتكر 2 و 4 و 7 و 9 زي رقم تليفون، وبعدين ضيف 15 و 21: دول أصحاب الـ common γ chain."
        parts:
          - { key: "2", text: "IL-2" }
          - { key: "4", text: "IL-4" }
          - { key: "7", text: "IL-7" }
          - { key: "9", text: "IL-9، وبعدها IL-15 و IL-21" }
      - kind: explain
        page: 11
        quote: "It has been recognized more recently that unrelated cytokine receptor systems exhibit close cross-communication on the cell membrane, allowing a cell to integrate a variety of external stimuli to optimize signaling pathways and the cellular response in real time in a changing environment."
        title: "الـ receptors بتكلم بعض كمان"
        text: |
          الكتاب بيضيف فكرة أحدث: receptors من أنظمة **مالهاش علاقة ببعض** بتعمل ==cross-communication== على غشاء الخلية.

          ليه ده مفيد؟ عشان الخلية تقدر **تجمع** إشارات كتير من برّه وتطلّع رد واحد مظبوط **في الوقت الحقيقي** في بيئة بتتغير.

          - أوضح مثال: الـ **epidermal growth factor receptor** system.
          - واتلاقى كمان في عيلة الـ **common γ chain**.
      - kind: explain
        page: 12
        quote: "Cytokine receptors can operate via several mechanisms. Membrane receptors, with intra cellular signaling domains intact, can transmit signals to the target cell nucleus after soluble cytokine binding and promote effect or function (Figure 26-2). Membrane receptors may bind cell membrane cytokines assisting cross-talk between adjacent cells. Membrane-bound and soluble cytokines may promote distinct receptor function. Useful exemplars exist relevant to the rheumatic diseases. Thus TNF binds TNF-RI and TNF-RII with similar affinity, but it has a slower rate of dissociation from TNF-RI. Soluble TNF may dissociate rapidly from TNF-RII to bind TNF-RI, promoting preferential signaling by the latter (ligand passing).1 In contrast, during cell- cell contact, stable TNF/TNF-RI and TNF/TNF-RII complexes form, allowing for differential signaling contribution by TNF-RI and TNF-RII."
        title: "TNF و الـ ligand passing"
        text: |
          TNF بيمسك TNF-RI و TNF-RII بنفس الـ affinity، بس بيسيب **TNF-RI أبطأ**.

          فالـ soluble TNF بيقع بسرعة من RII ويروح يمسك RI ← signalling أكتر من RI. ده اسمه ==ligand passing==.

          أما في الـ cell-cell contact، الاتنين بيعملوا complexes ثابتة ويشاركوا في الـ signal.
      - kind: reveal
        page: 12
        quote: "Receptors for various cytokines belong to five families\n  1. Immunoglobulin superfamily receptors.\n  2. Class I cytokine receptor family (hematopoietin receptor family)\n  3. Class II cytokine receptor family (Interferon receptor family).\n  4. TNF receptor family.\n  5. Chemokine receptor family"
        prompt: "عدّ الخمس receptor families قبل ما تفتح."
        answer: "1. Immunoglobulin superfamily. 2. Class I (hematopoietin). 3. Class II (interferon). 4. TNF receptor. 5. Chemokine receptor."
      - kind: order
        page: 13
        quote: "Cytokine signaling and regulation. After ligand binding, cytokine receptors activate a series of signaling molecules that are associated with the cytoplasmic portion of the receptor or the plasma membrane. In this figure Janus kinases (JAK) or spleen tyrosine kinase (SYK) are activated, which in turn phosphorylate additional cytoplasmic molecules (signal transducer and activator of transcription [STAT]; mitogen-activated protein kinase [MAPK]) then can migrate to the nucleus and either directly or through additional intermediaries activate gene transcription. mRNA levels can also be regulated after transcription by microRNAs. Ultimately, the translated proteins can be processed and released by the cell into the microenvironment or presented on the plasma membrane to other cells."
        prompt: "رتّب مسار الـ signalling:"
        steps:
