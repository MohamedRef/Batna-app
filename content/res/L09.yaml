  - id: res.L09.118
    kind: mcq
    topic: consent
    stem: "Which of the following is NOT an ethical guideline for conducting research with humans?"
    options:
      - "Getting informed consent of the participant"
      - "Keeping participants' identity anonymous"
      - Telling participants they are free to withdraw from the study at any time, without giving a reason
      - "Telling participants they must continue until the study has been completed"
    answer: 3
    why:
      - "Voluntary, informed consent is the first principle of the Nuremberg Code."
      - "Protecting privacy and confidentiality is part of respect for persons."
      - "Article 9 of the Nuremberg Code: subjects have the right to withdraw at any time."
      - "Correct (Dr Eman's revision key): obliging people to stay breaks voluntariness and the right to withdraw at any time."
    src: { page: 29, quote: "Nuremberg Code (1947)\nFirst Codification of Research Guidelines\nHuman Rights + Welfare of Subjects\n  The first and longest principle: \"The voluntary consent of the human subject is absolutely essential.\"\n  Articles (2-8, 10):\n    1. Scientific value\n    2. Favorable risk/benefit ratio\n    3. Suffering by subjects should be avoided\n  Article (9): Subjects have the right to withdraw at any time" }
