      - kind: explain
        page: 141
        quote: "Mechanistic Biomarkers:\n| Markers and scales | Mechanism | Advantages | Limitations |\n|---|---|---|---|\n| Glutamate deshidrogenase GLDH | Mitochondrial dysfunction | Specific to the liver. Early detection is critical. It is useful in distinguishing between muscle and hepatic injuries. | |\n| Malate deshidrogenase MDH | MDH is a periportal enzyme whose presence in the blood suggests that the liver has been damaged. | Excellent association with ALT | It is not particular to the liver. |\n| High-morbility group box 1-HMGB1 (Hyperacetilated form) | DAMP (Damage-Associated Molecular Pattern) molecule. Immune activation marker | Greater sensitivity predicts outcome | APAP DILI |\n| Glutathione S transferases (GSTs) and alfa-GST | Reactive compounds are metabolised by phase II detoxification enzymes. | DILI susceptibility is conferred by GST gene polymorphisms. More specific and sensitive than alpha-GST. Increased earlier than ALT | APAP DILI |\n| Macrophage colony-stimulating factor receptor 1 (MCSFR1) | Marker of immune activation | Prognostic indicator. Death and transplant risk factors | |\n| Osteopontin (OPN) | Because of the activation of hepatic stem cells, it is linked to liver regeneration. | Prognostic indicator. Death and transplant risk factors | |\n| Alfa-fetoprotein | Because of the activation of hepatic stem cells, it is linked to liver regeneration. | Prognostic indicator. Death and transplant predictors | Worse than Osteopontin in terms of performance |"
        title: "الـ mechanistic biomarkers"
        text: |
          الـ markers دي بتقولك مش بس "الكبد اتأذى"، لكن اتأذى إزاي:

          - ==Glutamate dehydrogenase (GLDH)==: mitochondrial dysfunction. Specific to the liver، early detection، وبيفرّق بين muscle and hepatic injuries.
          - **Malate dehydrogenase (MDH)**: periportal enzyme، excellent association with ALT، بس مش liver-specific.
          - ==High-mobility group box 1 (HMGB1) (hyperacetylated)==: Damage-associated molecular pattern (DAMP) و immune activation marker، greater sensitivity، predicts outcome. عيبه في الجدول: acetaminophen (APAP) drug-induced liver injury (DILI)، يعني الداتا أغلبها من الـ acetaminophen.
          - **Glutathione S-transferases (GSTs) and alpha-GST**: phase II detoxification، increased earlier than ALT. ونفس العيب: الداتا أغلبها من APAP DILI.
          - **M-CSFR1, osteopontin, alpha-fetoprotein (AFP)**: prognostic indicators للـ death and transplant، والـ AFP أضعف من الـ osteopontin.

          اربطها بالـ mechanisms من الدرس التالت: الـ GLDH للـ mitochondria، والـ HMGB1 للـ necrosis والمناعة.
