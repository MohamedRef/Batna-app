  - id: endo.L04.119
    kind: card
    topic: myopathy
    front: Which is the commonest diagnosed endocrine myopathy?
    back: Cushing's syndrome.
    src: { page: 60, quote: "Adrenal Disorders\n  1- Cushing syndrome:\n    It is the commonest diagnosed endocrine myopathy.\n    Striking proximal muscular wasting.\n    Cushingoid appearance precedes or accompanied myopathy.\n    Histological section demonstrates muscle fiber atrophy.\n  2- Adrenal insufficiency:\n    Commonly, it causes muscle fatigue.\n    Mild objective weakness is less common.\n  3- Primary aldosteronism \"Conn s syndrome\":\n    Persistent proximal muscular weakness & wasting in long standing hyperaldosteronism due to K depletion." }
    status: unverified
    tags: [high-yield]
