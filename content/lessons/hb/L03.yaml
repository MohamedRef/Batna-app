        text: |
          احفظها كده: **عشرة تبني، اتناشر تفرقع، عشرين نجري على transjugular intrahepatic portosystemic shunt (TIPS).**

          - فوق 10 mmHg: الـ varices بتتكوّن، يعني formation.
          - فوق 12 mmHg: الـ varices ممكن تنفجر، يعني rupture.
          - فوق 20 mmHg: high risk، وده مريض الـ early TIPS (صفحة 55).
