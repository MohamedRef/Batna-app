  - id: geri.L07.037
    kind: enumerate
    topic: function
    prompt: List the eight domains of the Lawton–Brody IADL scale.
    points:
      - Ability to use the telephone
      - Shopping
      - Food preparation
      - Housekeeping
      - Laundry
      - Mode of transportation
      - Responsibility for own medications
      - Ability to handle finances
    pass: 6
    hook: "الـLawton IADL «8 مهام بيت»: التليفون، الشوبنج، الطبخ، تنضيف البيت، الغسيل، المواصلات، أدويتك بنفسك، وفلوسك. 8."
    src: { page: 112, quote: "LAWTON - BRODY INSTRUMENTAL ACTIVITIES OF DAILY LIVING SCALE (I.A.D.L.)\nScoring: For each category, circle the item description that most closely resembles the client's highest functional level (either 0 or 1).\n| Category | Item | Score |\n|---|---|---|\n| A. Ability to Use Telephone | 1. Operates telephone on own initiative-looks up and dials numbers, etc. | 1 |\n| | 2. Dials a few well-known numbers | 1 |\n| | 3. Answers telephone but does not dial | 1 |\n| | 4. Does not use telephone at all | 0 |\n| B. Shopping | 1. Takes care of all shopping needs independently | 1 |\n| | 2. Shops independently for small purchases | 0 |\n| | 3. Needs to be accompanied on any shopping trip | 0 |\n| | 4. Completely unable to shop | 0 |\n| C. Food Preparation | 1. Plans, prepares and serves adequate meals independently | 1 |\n| | 2. Prepares adequate meals if supplied with ingredients | 0 |\n| | 3. Heats, serves and prepares meals, or prepares meals, or prepares meals but does not maintain adequate diet | 0 |\n| | 4. Needs to have meals prepared and served | 0 |\n| D. Housekeeping | 1. Maintains house alone or with occasional assistance (e.g. \"heavy work domestic help\") | 1 |\n| | 2. Performs light daily tasks such as dish washing, bed making | 1 |\n| | 3. Performs light daily tasks but cannot maintain acceptable level of cleanliness | 1 |\n| | 4. Needs help with all home maintenance tasks | 1 |\n| | 5. Does not participate in any housekeeping tasks | 0 |\n| E. Laundry | 1. Does personal laundry completely | 1 |\n| | 2. Launders small items-rinses stockings, etc. | 1 |\n| | 3. All laundry must be done by others | 0 |\n| F. Mode of Transportation | 1. Travels independently on public transportation or drives own car | 1 |\n| | 2. Arranges own travel via taxi, but does not otherwise use public transportation | 1 |\n| | 3. Travels on public transportation when accompanied by another | 1 |\n| | 4. Travel limited to taxi or automobile with assistance of another | 0 |\n| | 5. Does not travel at all | 0 |\n| G. Responsibility for Own Medications | 1. Is responsible for taking medication in correct dosages at correct time | 1 |\n| | 2. Takes responsibility if medication is prepared in advance in separate dosage | 0 |\n| | 3. Is not capable of dispensing own medication | 0 |\n| H. Ability to Handle Finances | 1. Manages financial matters independently (budgets, writes checks, pays rent, bills, goes to bank), collects and keeps track of income | 1 |\n| | 2. Manages day-to-day purchases, but needs help with banking, major purchases, etc. | 1 |\n| | 3. Incapable of handling money | 0 |\nA summary score ranges from 0 (low function, dependent) to 8 (high function, independent) for women and 0 through 5 for men to avoid potential gender bias." }
