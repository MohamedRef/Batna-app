        why: "أخطرهم الـ **azathioprine/6-MP**: الـ xanthine oxidase (XO) هو اللي بيكسّرهم، فلو قفلته بيتراكموا ويعملوا bone marrow suppression."
      - kind: explain
        remind: [dm.L18.052, dm.L18.046, hb.L08.lesson1:FARE]
        page: 240
        title: "مشاكل تانية للـ allopurinol"
        quote: "Allopurinol hypersensitivity syndrome: fever, rash, reduced renal function, hepatic injury, leukocytosis, eosinophilia, vasculitis (20% fatality)"
        text: |
          - **Considerations:** ممكن **يعمل acute attack** في الأول، gastrointestinal tract (GIT) side effects، bone marrow suppression، renal impairment.
          - **Renal impairment:** الجرعة تقل مع الـ glomerular filtration rate (GFR)، فصعب توصل للهدف.
          - **Hematological malignancy / tumor lysis:** الـ uricosuria صعب تتحكم فيها، و **xanthinuria** شديدة.
          - **Skin reactions 2–5%** لحد **Stevens-Johnson**.
          - ==Allopurinol hypersensitivity syndrome==: fever، rash، renal ↓، hepatic injury، leukocytosis، **eosinophilia**، vasculitis، **20% fatality**.

          يعني الـ allopurinol جوه الإرشادات، بس لو فيه كلية تعبانة أو ورم دم أو حساسية، فيه بدايل.
