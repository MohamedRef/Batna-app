lecture: geri.L03
lessons:
  # ------------------------------------------------------------------
  - id: geri.L03.lesson1
    title: "الدوا جوه جسم عجوز: فين بيروح؟"
    hook: "نفس الجرعة اللي بتريّح شاب ممكن توقّع الحاج من على السلم. السر مش في الدوا، في الجسم اللي استقبله."
    minutes: 8
    pages: [40, 43]
    topics: [challenges, pk, renal]
    goals:
      - "تعرف التحديات الخمسة في علاج الكبار"
      - "تفهم إزاي الـ distribution بيتغير: دهون أكتر، ميه أقل، albumin أقل"
      - "تحسب الـ CrCl بـ Cockcroft-Gault"
    status: unverified
    steps:
      - kind: explain
        page: 40
        title: "ليه علاج الكبار صعب؟"
        quote: "Impaired physiological reserve in older patients- \"homeostenosis\"."
        text: |
          خمس تحديات:
          - ==homeostenosis==: الـ physiological reserve قليل، أي حمل يوقّعه.
          - **أمراض كتير وأدوية كتير** مع بعض.
          - العرض **non-specific أو cryptic**.
          - لو ما اتعالجش، بيتدهور بسرعة: loss of adaptability.
          - **المضاعفات** كتير، من المرض ومن العلاج كمان.
      - kind: mnemonic
        page: 40
        quote: "Multiple disease and multiple drug use. Non-specific or cryptic presentation."
        word: "HMNRC"
        parts:
          - { key: "H", text: "Homeostenosis" }
          - { key: "M", text: "Multiple disease, multiple drugs" }
          - { key: "N", text: "Non-specific presentation" }
          - { key: "R", text: "Rapid deterioration" }
          - { key: "C", text: "Complications high" }
        hook: "**«حَمْنَرْك»**: الحاج بيقولك «حمّنّرك يا دكتور»، يعني «هتعبك معايا». وفعلًا هيتعبك في الخمسة دول."
      - kind: figure
        page: 40
        title: "كل ما الأدوية تزيد، الـ side effects تطير"
        image: { file: geri/L03-drugs-side-effects.webp, book: true }
        quote: "Relationship between number of drugs and side effects"
        caption: "رسمة الكتاب: من **0–5** أدوية حوالي 5% عندهم side effects، ومن **16–20** دوا أكتر من ==50%==. الزيادة مش خطية، دي بتقفز."
        alt: "The book's bar chart: percent of patients with side effects by number of drugs, about 5% for 0–5, 10% for 6–10, about 28% for 11–15 and about 55% for 16–20."
      - kind: figure
        page: 41
        title: "وكل ما الدكاترة يزيدوا كمان"
        image: { file: geri/L03-prescribers.webp, book: true }
        quote: "Number of prescribing physicians and risk of side effects"
        caption: "Number of prescribing physicians: الـ **psychotropic** بالذات بيطلع من حوالي 17% مع دكتور واحد لحوالي ==34%== مع خمسة. كل دكتور بيكتب لوحده ومحدش شايف الروشتة كلها."
        alt: "The book's bar chart: prevalence of drug combinations by number of prescribing physicians 1 to 5 for NSAIDs, cardiovascular and psychotropic drugs; psychotropic rises from about 17% to about 34%."
      - kind: explain
        page: 41
        title: "الامتصاص: مش مشكلة غالبًا"
        quote: "From a practical standpoint this is not usually a problem in the elderly Caveat: Tube feedings may reduce absorption if continuous"
        text: |
          الـ **absorption** عمليًا مش مشكلة عند الكبار.

          الاستثناء: ==tube feeding== لو continuous، ممكن يقلل الامتصاص.
      - kind: explain
        page: 42
        title: "الـ distribution: دهون أكتر، ميه أقل"
        quote: "Decreased body water -- the most important change, lower Vd. in polar drugs"
        text: |
          - **Albumin قليل** ← نسبة الدوا الـ free تزيد.
          - **دهون أكتر** ← الـ half-life بتاع الـ lipophilic drugs يطول، زي **diazepam** والـ anesthetics.
          - **ميه أقل**، وده ==the most important change== ← الـ Vd بتاع الـ polar drugs يقل ← التركيز يعلى.
          - **عضلات أقل**.
      - kind: aside
        tone: analogy
        page: 42
        quote: "Increased fat -- increases the half life of lipophylic drugs (e.g. diazepam, anesthetics)"
        text: "تخيّل الدهون زي **إسفنجة**: الـ diazepam بيتشرّب فيها ويفضل يرشح منها بالراحة أيام. والميه زي **كوباية صغيرة**: نفس كمية السكر فيها تبقى أحلى، يعني الدوا الـ polar تركيزه أعلى."
      - kind: sort
        page: 42
        quote: "Increased fat -- increases the half life of lipophylic drugs (e.g. diazepam, anesthetics)"
        prompt: "الـ Vd بتاع الدوا ده بيعمل إيه مع السن؟"
        bins: ["Vd up", "Vd down"]
        cards:
          - { text: "Diazepam", bin: 0 }
          - { text: "Lipophilic drug", bin: 0 }
          - { text: "Hydrophilic drug", bin: 1 }
          - { text: "Polar drug", bin: 1 }
        why: "الدهون بتزيد فالـ lipophilic Vd up، والميه بتقل فالـ hydrophilic أو polar Vd down."
      - kind: explain
        page: 43
        title: "الـ half-life = Vd ÷ clearance"
        quote: "Half-life(t1/2) ≈ vol. of distribution(Vd) over clearance(CI)"
        text: |
          ==t½ ≈ Vd ÷ clearance==

          يعني عند الكبار الـ half-life بيطول من ناحيتين:
          - الـ **Vd** بتاع الـ lipophilic بيزيد.
          - الـ **clearance** بيقل من الكلية والكبد.
      - kind: explain
        page: 43
        title: "الكلية: ثلث الشغل راح"
        quote: "Renal function declines by about 1/3 with normal ageing- NB- digoxin, gentamicin."
        text: |
          - الـ renal function بيقل حوالي ==الثلث== مع السن الطبيعي. خلي بالك من **digoxin** و **gentamicin**.
          - السبب: الكلية أصغر، والـ tubular secretion والـ renal blood flow أقل.
          - **normal renal function tests do not mean normal renal function**. الكرياتينين مش مقياس كويس، احسب الـ CrCl.
      - kind: explain
        page: 42
        title: "معادلة Cockcroft-Gault"
        quote: "(140-age) x body wt. (kg.) Cr cl. = 72 x Serum Cr. (x 0.85 for Women)"
        text: |
          **CrCl = (140 − age) × weight ÷ (72 × s.Cr)**

          وللستات: ==× 0.85==.

          الكتاب بيقول إنها **estimate**، والـ renal function بيختلف جدًا من حاج للتاني.
      - kind: check
        page: 42
        quote: "(140-age) x body wt. (kg.) Cr cl. = 72 x Serum Cr. (x 0.85 for Women)"
        question: "85-year-old woman, 50 kg, creatinine 1.0 mg/dl. CrCl by Cockcroft-Gault?"
        options:
          - "About 32 ml/min"
          - "About 38 ml/min"
          - "About 55 ml/min"
          - "About 100 ml/min"
        answer: 0
        why:
          - "صح: 55 × 50 ÷ 72 = 38.2، × 0.85 = 32.5."
          - "نسيت الـ 0.85 بتاع الستات."
          - "55 ده (140 − age) بس."
          - "الكرياتينين 1.0 مش معناه كلية طبيعية."
      - kind: try
        items: [geri.L03.002, geri.L03.011, geri.L03.014, geri.L03.019, geri.L03.021]
    recap:
      - "HMNRC: homeostenosis، أمراض وأدوية كتير، عرض مش واضح، تدهور سريع، مضاعفات."
      - "الـ side effects بتقفز مع عدد الأدوية وعدد الدكاترة."
      - "Absorption مش مشكلة، إلا الـ continuous tube feeding."
      - "دهون أكتر ← lipophilic t½ أطول. ميه أقل ← polar Vd أقل، وده الأهم."
      - "الكلية −⅓. CG = (140 − age) × wt ÷ (72 × Cr)، والست × 0.85."
    practice: [geri.L03.001, geri.L03.002, geri.L03.003, geri.L03.004, geri.L03.005, geri.L03.006, geri.L03.007, geri.L03.008, geri.L03.009, geri.L03.010, geri.L03.011, geri.L03.012, geri.L03.013, geri.L03.014, geri.L03.015, geri.L03.016, geri.L03.017, geri.L03.018, geri.L03.019, geri.L03.020, geri.L03.021]
