        page: 390
        quote: "Treatment management during pregnancy and following delivery Management of immunosuppression If a transplant recipient expresses her wish to get pregnant, then MMF/MPA and sirolimus should be withdrawn before attempting conception and replaced with other immunosuppressant regimens. Contraception should continue for at least 3 months following withdrawal. The manufacturer and the FDA (US Food and Drug Administration) have added a 'black box' warning against MMF and MPA preparations regarding their teratogenicity risks. (104) The teratogenic effects of MMF on animals have been documented; however, there have been several reports suggesting the same in humans, with early pregnancy loss and a 27% incidence of congenital fetal malformation. The most commonly reported deformities were craniofacial malformations such as cleft lip and palate, microtia or anotia, with external auditory canal atresia, hypertelorism,"
        text: |
          الـ MMF عليه **black box warning**. التشوهات: ==craniofacial== (cleft lip و palate، microtia أو anotia، hypertelorism، coloboma، micrognathia) و **cardiac** (conotruncal و aortic arch).
      - kind: explain
        page: 391
        title: "ليه الـ prednisolone آمن، والـ mTOR لأ؟"
        quote: "Despite its ability to cross the human placenta, prednisolone does not suppress fetal corticotropin, and no consistent anomalies have been detected in the offspring of transplant women receiving corticosteroids during pregnancy, making it safe during pregnancy."
        text: |
          - **Prednisolone:** بيعدّي المشيمة، بس ==does not suppress fetal corticotropin==، ومفيش تشوهات ثابتة. التفسير المقبول (مش في الكتاب): المشيمة فيها إنزيم بيكسّر معظم الـ prednisolone قبل ما يوصل للجنين.
          - **mTOR inhibitors:** في الحيوانات **fetal mortality** أعلى، وفي البشر **مفيش خبرة كفاية**. فالـ guidelines بتقول **لأ**، وحوّل لـ **CNI + prednisolone**.
          - **CNI:** مفيش teratogenicity، بس الـ **cyclosporine** ممكن يعمل IUGR و prematurity، غالبًا من ==chronic vasoconstriction==. والـ metabolism بيزيد في الحمل، فراقب الـ level.
          - **MMF:** يتشال، وكمّل contraception **3 شهور** بعده، والبديل **azathioprine ≤2 mg/kg**.
      - kind: explain
        page: 392
        title: "باقي الأدوية"
        quote: "(2) Other medications Folic acid is started 3 months before a planned pregnancy, as well as aspirin in small doses to reduce preeclampsia. Prophylactic dose low-molecular weight heparin is recommended if proteinuria more than 2 g as proteinuria is a risk factor for venous thromboembolism.(109)"
        text: |
          - **ضغط >140/90**: preterm ×6 و preeclampsia ×5.
          - **ACE inhibitor (ACEi)/angiotensin II receptor blocker (ARB)** ممنوع (oligohydramnios، skull hypoplasia، renal dysplasia، patent ductus arteriosus). **Atenolol** يتجنب عشان growth retardation. الآمن: methyldopa و hydralazine و labetalol و calcium channel blocker (CCB).
          - ==Folic acid== 3 شهور قبل، **aspirin** low dose، و **low-molecular-weight heparin** لو proteinuria **>2 g**.
          - **Valganciclovir**: لأ إلا لو الفايدة أكبر. **Cotrimoxazole**: meta-analysis بتقول آمن. **Statins**: الـ US Food and Drug Administration (FDA) شالت الـ contraindication المطلقة في 2021، مع إن الـ Fig 3 (صفحة 374) لسه حاططها في الممنوع، والـ FDA لسه بتنصح أغلب الحوامل يوقفوها.
      - kind: explain
        page: 393
        title: "الأدوية المختلف عليها: valganciclovir، cotrimoxazole، statins"
        quote: "Some studies suggest that cotrimoxazole exposure during pregnancy is associated with congenital anomalies, such as neural tube defects, cardiovascular defects, urinary tract defects, and oral clefts, due to the inhibition of folate synthesis."
        text: |
          - **Valganciclovir:** في الحيوانات toxicity و teratogenicity، وفي البشر مفيش داتا. فـ ==not used in pregnancy== إلا لو الفايدة للأم أكبر. والـ valaciclovir اتستخدم off-label من غير teratogenicity مسجلة.
          - **Cotrimoxazole:** بعض الدراسات ربطته بتشوهات (neural tube، قلب، urinary، oral clefts) والسبب ==inhibition of folate synthesis==. بس meta-analysis (Ford) لقت الـ prevalence مش أعلى من الناس العادية، فبيقول آمن. التفسير المقبول (مش في الكتاب): وده سبب تاني إن الـ **folic acid** يبدأ 3 شهور قبل الحمل.
          - **Statins:** الـ FDA طلبت تشيل الـ contraindication المطلقة بعد ما راجعت الداتا.

          والقاعدة العامة في الكتاب: أي دوا في الحمل = **risk مقابل benefit**.
      - kind: explain
