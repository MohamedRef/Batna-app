      - Fish is listed as a healthy fat source.
      - Avocado is listed as a healthy fat source.
      - Nuts are a healthy fat source; trans fats come from industrial hydrogenation.
    src: { page: 95, quote: "But unlike saturated fats, trans fats lower HDL cholesterol and may do more damage," }
    status: unverified
