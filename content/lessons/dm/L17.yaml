  - id: dm.L17.lesson3
    title: "التشخيص بالاستبعاد: المعمل والأشعة"
    hook: "الـ primary osteoporosis ملهاش علامة مميزة. التشخيص إنك تشيل كل حاجة تانية."
    minutes: 9
    pages: [219, 221]
    topics: [labs, radiology]
    goals:
      - "تعرف ليه التشخيص بالاستبعاد"
      - "تعرف كل تحليل بيستبعد إيه"
      - "تقرا X-ray العمود الفقري: wedge، crush، codfish، Schmorl"
    status: unverified
    steps:
      - kind: explain
        page: 219
        title: "ليه التشخيص بالاستبعاد؟"
        quote: "Because no characteristic symptoms, signs, or laboratory abnormalities are associated with primary osteoporosis, diagnosis requires excluding other causes of metabolic bone disease, ie, osteomalacia, malignancy, and secondary osteoporosis."
        text: |
          الـ **primary osteoporosis** ==ملهاش== عرض ولا علامة ولا تحليل مميز. يعني مفيش حاجة "إيجابية" تشاور عليها.

          فالطريقة الوحيدة: تشيل اللي يشبهها:
          - **Osteomalacia**: عضم طري من نقص الـ vitamin D.
          - **Malignancy**: زي الـ myeloma.
          - **Secondary osteoporosis**: الأسباب اللي في Table 258-2.

          وده بيتعمل بـ ==history كويس وكشف وكام تحليل==. ليه الموضوع مهم؟ عشان كل واحد من التلاتة علاجه مختلف: الـ osteomalacia بتتعالج بالـ vitamin D، والـ myeloma محتاجة oncology، والـ secondary بتتعالج من سببها.
      - kind: explain
        remind: [dm.L17.044]
        page: 220
        title: "التحاليل الأساسية"
        quote: "A CBC count with differential, routine serum chemistry studies, thyroid function tests, serum protein electrophoresis, serum 25- hydroxycholecalciferol measurement, and 24-h urine calcium measurement."
        text: |
          لو الـ history مفيهوش سبب تانوي، التحاليل دي عادةً بتستبعد الباقي:
          - **Complete blood count (CBC) with differential**
          - **Routine chemistry**
          - **Thyroid function tests**
          - ==Serum protein electrophoresis==
          - **Serum 25-hydroxycholecalciferol**
          - **24-h urine calcium**
      - kind: explain
        page: 220
        title: "كل تحليل بيدوّر على إيه؟"
        quote: "If the history suggests metabolic bone disease, appropriate laboratory tests must be performed."
        text: |
          الكتاب بيدّيك القايمة ونص السبب (الـ CBC والـ electrophoresis للـ malignancy). التفسير المقبول (مش في الكتاب) للباقي:

          - **CBC with differential** و ==serum protein electrophoresis==: الـ myeloma وأمراض النخاع (الكتاب بيقولها).
          - **Routine chemistry**: كالسيوم وفوسفات و ALP وكلى؛ لو فيه حاجة مش طبيعية يبقى مش primary (الـ primary كله طبيعي).
          - **Thyroid function tests**: الـ hyperthyroidism (أو جرعة thyroxine زيادة) بيسرّع السحب.
          - ==Serum 25-hydroxycholecalciferol==: نقص الـ vitamin D والـ osteomalacia.
          - **24-h urine calcium**: الـ idiopathic hypercalciuria (في Table 258-2)، أو كالسيوم قليل جدًا من سوء امتصاص.
      - kind: reveal
        page: 220
        quote: "In an osteopenic patient, any abnormality in blood count or protein electrophoresis raises the possibility of a malignancy involving the bone marrow."
        prompt: "ليه الـ protein electrophoresis بالذات في مريض osteopenia؟"
        answer: |
          علشان الـ **multiple myeloma** بيعمل osteopenia ويقلّد الـ osteoporosis. أي abnormality في الـ CBC أو الـ electrophoresis = فكّر في ==malignancy involving the bone marrow==.
      - kind: table
        page: 220
        quote: "In primary osteoporosis, serum phosphate and alkaline phosphatase values are also normal. Serum levels of vitamin D, 25-hydroxycholecalciferol, and 1,25- dihydroxycholecalciferol are normal in primary osteoporosis but may be low because of age-related changes in vitamin D metabolism."
        title: "المعمل في الـ primary osteoporosis"
        columns: [Test, Result]
        rows:
          - ["Electrolytes, BUN, creatinine", "Normal"]
          - ["Serum and urine calcium", "Usually normal"]
          - ["Phosphate, ALP", "Normal"]
          - ["Vitamin D levels", "Normal; may be low with age"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: tip
        page: 220
        quote: "The use of metabolic markers, such as serum osteocalcin, urinary excretion of pyridinium and deoxypyridinium, and urinary hydroxyproline, to assess bone turnover is under investigation."
        text: "الـ **bone turnover markers** (osteocalcin، pyridinium، deoxypyridinium، hydroxyproline) الكتاب بيقول إنها **under investigation** هنا، بس هترجع في المتابعة (CTX و procollagen type 1 N-terminal propeptide (P1NP)) في آخر المحاضرة."
      - kind: explain
        page: 220
        title: "الـ X-ray: متأخر بس ليه علامات"
        quote: "Radiologic findings:\n  1. They are insufficient for making a differential diagnosis of metabolic bone disease. Radiolucency is the hallmark of osteopenia on conventional X-rays; however, it cannot be reliably detected until at least 30% of the bone mass is lost. However, incidental skeletal osteopenia on a chest x-ray is the most common clue to osteoporosis in asymptomatic postmenopausal women.\n  2. Generally, the vertical trabeculae of vertebrae and vertebral end-plates appear more prominent because of the loss of horizontal trabeculae."
        text: |
          - الـ **radiolucency** مش بتبان غير بعد ما ==30%== من الـ bone mass يروح.
          - أشهر clue في ست ملهاش أعراض: **incidental osteopenia on chest X-ray**.
          - الـ **vertical trabeculae** بتبان أوضح لأن الـ horizontal راحت.
          - في الـ long bones: **cortical thinning** و **expansion of the medullary space**.
      - kind: check
        page: 220
        quote: "Radiolucency is the hallmark of osteopenia on conventional X-rays; however, it cannot be reliably detected until at least 30% of the bone mass is lost."
        question: "Why is a plain X-ray a poor way to detect early osteoporosis?"
        options:
          - "Radiolucency is not reliably seen until at least 30% of bone mass is lost"
          - "X-rays cannot show the spine"
          - "Osteoporosis makes bone look denser on X-ray"
          - "Radiolucency appears only in osteomalacia"
        answer: 0
        why:
          - "صح: لازم 30% على الأقل يروح قبل ما الأشعة تبان. وعشان كده بنقيس الكثافة بأجهزة خاصة."
          - "الأشعة بتبيّن الفقرات كويس، والكتاب بيوصف علاماتها."
          - "بالعكس: الـ hallmark هو الـ radiolucency."
          - "الـ radiolucency هي hallmark الـ osteopenia عمومًا."
      - kind: figure
        page: 221
        quote: "A predominantly anterior compression of the vertebrae results in a wedge fracture; a collapse of the entire vertebral body results in a crush fracture. These compression fractures typically occur in the lower thoracic and upper lumbar vertebrae, although all vertebrae may be affected in severe cases of the disease."
        title: "الفقرات في الأشعة"
        alt: "Four vertebrae drawn side by side: normal rectangle; wedge fracture with a short front; crush fracture with the whole body flattened; codfish vertebra with concave end-plates and a Schmorl's node pushing into the bone."
        caption: "**Wedge** = الجزء الأمامي اتضغط. **Crush** = الفقرة كلها نزلت. **Codfish** = الـ end-plates بقت concave. **Schmorl's node** = الـ nucleus pulposus دخل في الفقرة."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <rect x="15" y="40" width="60" height="70" rx="4" class="fg-box"/>
            <text x="45" y="130" text-anchor="middle" class="t-sm t-b">Normal</text>
            <path d="M95 40 L155 40 L155 110 L95 110 Z" class="fg-thin"/>
            <path d="M95 62 L155 40 L155 110 L95 110 Z" class="fg-bad"/>
            <text x="125" y="130" text-anchor="middle" class="t-sm t-b t-bad">Wedge</text>
