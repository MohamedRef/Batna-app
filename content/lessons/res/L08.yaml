  - id: res.L08.lesson5
    title: "Bias ولا confounding؟"
    hook: "الكحول بيعمل lung cancer؟ OR = 2.5... لحد ما قسّمنا الناس smokers و non-smokers والعلاقة اختفت."
    minutes: 7
    pages: [57, 62]
    topics: [bias]
    goals:
      - "تعرّف الـ bias كـ systematic error"
      - "تعرف الـ confounding لما العلاقة تختفي بعد الـ stratification"
      - "تفرّق بين observer bias و recall bias"
    status: unverified
    steps:
      - kind: explain
        page: 57
        quote: "Any systematic error in the design, conduct, or analysis of a study that results in a mistaken estimate of an exposure’s effect on the risk of disease is called:\n  a. Confounding\n  b. Bias\n  c. Interaction\n  d. Stratification"
        title: "Bias: غلطة systematic"
        text: |
          ==Bias== = أي **systematic error** في الـ design أو الـ conduct أو الـ analysis، بيطلّع تقدير **غلط** لأثر الـ exposure.

          الفرق عن الصدفة (random error): الـ bias **بيزق النتيجة في اتجاه واحد**، وكبر العيّنة **مش** بيعالجه.
      - kind: figure
        page: 60
        quote: "A case-control study is conducted to assess the association between alcohol consumption and lung cancer. 100 patients with lung cancer and 100 controls are asked about their past alcohol consumption. According to the study results, alcohol consumption is strongly associated with lung cancer (OR = 2.5). The researchers then divide the study subjects into two groups: smokers and non-smokers. Subsequent statistical analysis does not reveal any association between alcohol consumption and lung cancer within either group. The scenario described is an example of which of the following?\n  a. Observer bias\n  b. Confounding\n  c. Placebo effect\n  d. Non-response bias\n  e. Recall bias"
        title: "مثلث الـ confounding"
        alt: "Triangle. Alcohol at the left, lung cancer at the right, smoking at the top. Smoking is linked to alcohol (drinkers smoke more) and causes lung cancer. The apparent arrow from alcohol to lung cancer is dashed: it disappears within smokers and within non-smokers."
        caption: "التدخين مرتبط بالكحول **و** بيعمل lung cancer. لما بنقسم الناس حسب التدخين (**stratification**)، السهم المتقطع بيختفي."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R08c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
