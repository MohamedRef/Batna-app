        page: 61
        quote: "Consider planned discontinuation of medications (such as metformin, ACEi, ARBs, diuretics and SGLT2i) in the 48–72 hours prior to elective surgery"
        title: "الـ sick-day rules والعمليات"
        text: |
          المريض **يعرف** إنه عنده dehydrating illness ← **يفتكر** قايمة الأدوية ← **يوقفها** ← لما يخف **يرجّعها**.

          قبل عملية elective بـ ==48–72 ساعة==: وقّف **metformin، ACEi، ARB، diuretics، SGLT2i**. ودايمًا اكتب ==إمتى يرجّعها==.


          - ACEi/ARB ← hypotension، AKI
          - Diuretics ← volume depletion، AKI
          - SGLT2i ← ketoacidosis
          - NSAIDs ← AKI، AIN
      - kind: reveal
