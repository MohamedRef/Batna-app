  - id: neph.L12.lesson4
    title: "الأملاح في السرطان والكالسيوم العالي"
    hook: "صوديوم واطي، بوتاسيوم ضايع، وكالسيوم عالي بيلخبط الوعي: كل واحد ليه قصة."
    minutes: 10
    pages: [420, 424]
    topics: [electrolytes, hypercalcemia, lactic]
    goals:
      - "تشخّص الـ SIAD بالـ Table 8"
      - "تعدّ أسباب الـ hypokalemia في السرطان"
      - "تعالج الـ hypercalcemia of malignancy وتعرف كل دوا امتى يشتغل"
    status: unverified
    steps:
      - kind: explain
        page: 420
        title: "Hyponatremia"
        quote: "SIADH is the most common etiology in patients with cancer, accounting for one-third of all cases of hyponatremia."
        text: |
          - موجودة في لحد **47%** من عيانين السرطان في المستشفى (أغلب الدراسات **24-44%**)، وأغلبها **mild**.
          - ممكن تبقى **marker** لسرطان مستخبي.
          - أشهر سبب: ==SIADH==، حوالي **ثلث** الحالات.
      - kind: table
        page: 421
        quote: "Plasma serum osmolality <275 mOsmol/kg H2O"
        title: "Table 8: تشخيص الـ SIAD"
        columns: [Criterion, Value]
        rows:
          - ["Plasma osmolality", "<275 mOsm/kg"]
          - ["Volume", "Euvolemic"]
          - ["Urine sodium", ">20-30 mEq/L"]
          - ["Urine osmolality", ">100 mOsm/kg"]
          - ["Exclude", "Diuretics, hypothyroidism, adrenal insufficiency"]
        hide: [[0, 1], [2, 1], [3, 1], [4, 1]]
      - kind: reveal
        page: 421
        quote: "Inappropriate urinary concentration (Uosm >100 mOsmol/kg H2O)"
        prompt: "ليه الـ urine osmolality أكتر من 100 بتقول «inappropriate»؟"
        answer: "الدم مخفف (osmolality <275)، فالمفروض الـ ADH يقف والكلية تطلّع بول مخفف جدًا (<100). لو البول مركّز رغم كده، يبقى فيه **ADH شغال من غير داعي** = **inappropriate antidiuresis**. (تفسير فسيولوجي، والأرقام من Table 8.)"
      - kind: explain
        page: 421
        title: "Hypernatremia و hypokalemia"
        quote: "Increased renal losses (diuretic use, Fanconi syndrome from chemotherapy use [cisplatin, ifosfamide], hypomagnesemia [cetuximab use or platinum compounds]"
        text: |
          **Hypernatremia:** من **free water loss** أو قلة تعويض المية. بدري: confusion، lethargy، irritability، polyuria، weakness. متأخر: hyperthermia، seizure، delirium، coma، death.

          **Hypokalemia** في السرطان، تلات أبواب:
          1. **قلة الأكل:** anorexia، nausea، mucositis، surgery
          2. **extrarenal loss:** vomiting، diarrhea
          3. ==renal loss==: diuretics، **Fanconi** (cisplatin، ifosfamide)، **hypomagnesemia** (cetuximab، platinum)، **ectopic ACTH** (squamous، medullary thyroid، neuroendocrine)
      - kind: sort
        page: 421
        quote: "or from excess ACTH production by tumor cells [squamous cell cancers, thyroid medullary cancer, neuroendocrine tumors),"
        prompt: "صنّف سبب الـ hypokalemia:"
        bins: ["Low intake", "Extrarenal loss", "Renal loss"]
        cards:
          - { text: "Mucositis", bin: 0 }
          - { text: "Anorexia after surgery", bin: 0 }
          - { text: "Diarrhea", bin: 1 }
          - { text: "Vomiting", bin: 1 }
          - { text: "Cisplatin Fanconi syndrome", bin: 2 }
          - { text: "Cetuximab hypomagnesemia", bin: 2 }
          - { text: "Ectopic ACTH from neuroendocrine tumor", bin: 2 }
        why: "الـ Mg الواطي بيخلي الكلية تفقد K، والـ ACTH بيعمل mineralocorticoid effect، والـ Fanconi بيفقد كل حاجة من الـ proximal tubule. كلهم renal."
      - kind: explain
        page: 422
        title: "Mg و phosphate"
        quote: "Hypomagnesemia is commonly seen in patients with cancer and may be caused by diminished dietary intake or renal magnesium wasting."
        text: |
          - ==Hypomagnesemia==: قلة أكل أو **renal magnesium wasting**.
          - **Hypophosphatemia:** في الـ **high cell-turnover** (leukemia، lymphoma)، بتزيد مع قلة الأكل، وبتسوّء الـ outcome.
      - kind: table
        page: 422
        quote: "categorized either as mild when levels are between 10 to 12 mg/dL, moderate when levels are between 12 to 14 mg/dL"
        title: "درجات الـ hypercalcemia"
        columns: [Grade, Calcium]
        rows:
          - ["Mild", "10-12 mg/dL"]
          - ["Moderate", "12-14 mg/dL"]
          - ["Severe", ">14 mg/dL"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 422
        title: "ليه الكالسيوم بيعلى؟"
        quote: "Excessive secretion of parathyroid hormone-related protein (PTHrP). (most common) Bony metastases with the release of osteoclast activating factors."
        text: |
          بيحصل في حوالي **20%** من عيانين السرطان، والأعلى prevalence: **multiple myeloma**.

          تلات mechanisms:
          1. ==PTHrP== (الأشهر، **80%**، اسمها **humoral hypercalcemia of malignancy**): solid tumors زي **squamous** (head، neck، lung)، breast، ovarian، renal، وشوية NHL.
          2. **Bone metastases** بتطلّع osteoclast activating factors.
          3. **1,25-dihydroxy vitamin D** (calcitriol)، زي الـ lymphoma.
      - kind: figure
        page: 423
        quote: "The calcitonin acts within 4 to 6 hours and lasts for about two days, whereas the bisphosphonates exhibit their action in 2 to 3 days"
        title: "مين بيشتغل امتى"
        alt: "Timeline bars from hour 0 to 4 weeks: normal saline acts immediately and lasts while infused; calcitonin starts at 4-6 hours and lasts about 2 days; bisphosphonates start at 2-3 days and last 2-4 weeks."
        caption: "التلاتة مع بعض علشان يغطوا بعض: ==saline== فورًا، **calcitonin** بعد ساعات لحد يومين، **bisphosphonate** يستلم من اليوم 2-3 لأسابيع."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 210 H320" class="fg-arrow"/>
            <text x="20" y="228" class="t-sm t-mut">0 h</text>
