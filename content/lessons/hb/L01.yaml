  - id: hb.L01.lesson3
    title: "الكبد لما يتعب: من راسك لرجلك"
    hook: "عنكبوت على الصدر، إيد حمرا، ورعشة بتصفّق: اقرا الـ liver failure على جسم المريض."
    minutes: 10
    pages: [6, 9]
    topics: [presentation, aclf]
    goals:
      - "تمسك أي علامة في الكشف وتقول سببها (hyperestrogenemia ولا clotting factors ولا translocation)"
      - "تفرق بين first decompensation و further decompensation"
      - "تعرّف الـ ACLF بالأرقام"
    status: unverified
    steps:
      - kind: explain
        page: 6
        title: "Decompensated يعني فيه complication"
        text: |
          المريض الـ decompensated عنده **complication واحدة على الأقل**. الأشهر: **ascites**، **HE**، و **coagulopathy with or without jaundice**.

          - **Ascites** هي **the most frequent first decompensating event**: abdominal distension، full flanks، umbilical hernia، scrotal edema ± peripheral edema، وممكن **pleural effusion (hepatic hydrothorax)**.
          - **HE**: fetor hepaticus، **asterixis (flapping tremors)**، disturbed sleep rhythm و consciousness، وتغيرات psychiatric و behavior و motor.
          - **Coagulopathy**: easy bruising و ecchymosis و bleeding tendency، بسبب **deficient synthesis of clotting factors**.
      - kind: figure
        page: 6
        title: "الـ cirrhosis على جسم المريض"
        alt: "A body outline with labels: fetor hepaticus, parotid enlargement, spider angiomas on the upper body, gynecomastia, loss of body hair, ascites with umbilical hernia, caput medusae, palmar erythema, white nails, clubbing, Dupuytren contracture, asterixis, small soft testes, bruising, edema."
        caption: "كل علامة جنبها سببها: **E** = hyperestrogenemia، **PH** = portal hypertension، **↓synth** = الكبد مش بيصنّع."
        svg: |
          <svg viewBox="0 0 330 560" xmlns="http://www.w3.org/2000/svg">
