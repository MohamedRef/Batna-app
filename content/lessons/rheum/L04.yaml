  - id: rheum.L04.lesson2
    title: "التلات antibodies والـ CAPS"
    hook: "مش كل aPL positive زي بعض: نوعه وعدده بيحددوا خطر الجلطة الجاية."
    minutes: 8
    pages: [70, 73]
    topics: [antibodies, caps, workup]
    goals:
      - "تفرّق بين LA و aCL و anti-β2GPI"
      - "ترتّب العيان high ولا low risk"
      - "تعرف الـ CAPS: تعريفه، triggers، و triple therapy"
    status: unverified
    steps:
      - kind: table
        page: 71
        quote: "Moderate to high titers (≥40 GPL or MPL units) are clinically significant."
        title: "التلات antibodies"
        columns: [Test, How, Key]
        rows:
          - ["Lupus anticoagulant", "Clotting time (aPTT, dRVVT)", "Highest thrombosis risk"]
          - ["Anticardiolipin", "ELISA, IgG and IgM", "≥40 GPL/MPL significant"]
          - ["Anti-β2GPI", "ELISA, IgG and IgM", "Cofactor for aCL binding"]
        hide: [[0, 2], [1, 2], [2, 2]]
      - kind: reveal
        page: 71
        quote: "Targeted against β2-glycoprotein I, a cofactor for aCL binding to phospholipids."
        prompt: "ليه بنعمل anti-β2GPI لو عندنا aCL؟"
        answer: |
          الـ **β2-glycoprotein I** هو ==cofactor== بيخلي الـ aCL يمسك في الـ phospholipid. الـ antibodies اللي بتعمل جلطات فعلًا غالبًا متوجهة له هو.

          فالـ **anti-β2GPI** بيأكد إن الـ aCL ده من النوع اللي بيأذي، مش aCL عابر من infection.
      - kind: figure
        page: 71
        quote: "The risk of thrombosis correlates with the type and number of positive aPL tests."
        title: "سلّم الخطر"
        alt: "A vertical risk ladder. At the top, high risk: triple positivity (LA, aCL and anti-β2GPI), isolated persistent LA, high titers especially IgG above 40 units. At the bottom, low risk: low-titer aCL or anti-β2GPI only, IgM without LA, transient or single positive tests during infection or pregnancy."
        caption: "الخطر بيزيد مع ==type and number== الـ tests الموجبة. الـ triple positive فوق خالص."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L04b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fg-head-bad"/></marker></defs>
            <path d="M25 285 V20" class="fg-arrow-bad" stroke-width="3" marker-end="url(#L04b)"/>
            <text x="12" y="155" class="t-sm t-bad t-b" transform="rotate(-90 12 155)">Thrombosis risk</text>
            <rect x="45" y="10" width="275" height="130" rx="12" class="fg-bad"/>
            <text x="60" y="34" class="t-b t-bad">Higher risk</text>
            <text x="60" y="60" class="t-sm">Triple positive: LA + aCL + anti-β2GPI</text>
            <text x="60" y="86" class="t-sm">Isolated LA, especially persistent</text>
            <text x="60" y="112" class="t-sm">High titers, especially IgG &gt;40 units</text>
            <rect x="45" y="160" width="275" height="130" rx="12" class="fg-good"/>
            <text x="60" y="184" class="t-b t-good">Lower risk</text>
            <text x="60" y="210" class="t-sm">Low-titer aCL or anti-β2GPI only</text>
            <text x="60" y="236" class="t-sm">IgM antibodies without LA</text>
            <text x="60" y="262" class="t-sm">Transient or single positive test</text>
            <text x="60" y="278" class="t-sm t-mut">(infection, pregnancy)</text>
          </svg>
      - kind: check
        page: 70
        quote: "Associated with the highest risk of thrombosis."
        question: "Which antiphospholipid antibody carries the highest risk of thrombosis?"
        options: ["Lupus anticoagulant", "Anticardiolipin IgM", "Anti-β2 glycoprotein I IgM", "Anti-dsDNA"]
        answer: 0
        why:
          - "صح: الـ LA أقوى predictor للجلطات، حتى لوحده: isolated LA = high risk."
          - "الـ IgM aCL من غير LA = lower risk."
          - "الـ IgM anti-β2GPI لوحده = lower risk."
          - "الـ anti-dsDNA ده antibody الـ SLE، مش aPL أصلًا."
      - kind: explain
        page: 72
        title: "الـ CAPS: العاصفة"
        quote: "CAPS is a rare, rapidly progressive form of APS involving simultaneous thrombosis in multiple organs."
        text: |
          الـ ==Catastrophic APS== شكل **نادر** و **rapidly progressive**:

          - **≥3 organ systems** في وقت قصير (غالبًا **أيام**)
          - دليل على **small-vessel thrombosis**
          - **High mortality** لو ما اتعالجش
      - kind: mnemonic
        page: 72
        quote: "Infection. Surgery. Withdrawal of anticoagulation. Obstetric complications."
        word: "SWIP"
        parts:
          - { key: "S", text: "Surgery" }
          - { key: "W", text: "Withdrawal of anticoagulation" }
          - { key: "I", text: "Infection" }
          - { key: "P", text: "Pregnancy (obstetric complications)" }
        hook: "الـ CAPS بييجي بـ **SWIP**: زي ما تعمل swipe غلط وتلاقي التلات organs اتقفلوا مرة واحدة."
      - kind: explain
        page: 72
        title: "علاج الـ CAPS: triple therapy"
        quote: "Rituximab or eculizumab may be used in refractory cases."
        text: |
          الـ ==triple therapy==:
          1. **Full anticoagulation**
          2. **High-dose corticosteroids**
          3. **Plasmapheresis و/أو IVIG**

          ولو **refractory**: **rituximab** أو **eculizumab**.
      - kind: case
        page: 72
        quote: "Involves ≥3 organ systems within a short time (usually days). Evidence of small-vessel thrombosis."
        stem: "34-year-old woman with APS stopped warfarin 10 days ago for a tooth extraction. In 3 days: confusion, rising creatinine, bilateral lung infiltrates. Platelets 52."
        steps:
          - question: "Most likely diagnosis?"
            options: ["Catastrophic APS", "Septic shock", "Lupus nephritis flare", "Simple recurrent DVT"]
            answer: 0
            why: "تلات organs في أيام، مخ وكلية ورئة، مع trigger كلاسيكي هو **withdrawal of anticoagulation** = **CAPS**."
          - question: "Treatment?"
            options: ["Anticoagulation + high-dose steroids + PLEX/IVIG", "Restart warfarin alone", "Rituximab alone", "Low-dose aspirin"]
            answer: 0
            why: "الـ CAPS عايز **triple therapy** سريع. الـ rituximab للـ refractory بس، والـ warfarin لوحده أو الـ aspirin مش كفاية."
      - kind: explain
        page: 73
        title: "الـ work-up"
        quote: "Coagulation tests (e.g., aPTT, dRVVT for LA)."
        text: |
          - **History**: جلطات أو pregnancy loss، و **family history** لـ autoimmune أو clotting disorders.
          - **Exam**: ==livedo reticularis==، cardiac murmurs، neurological deficits.
          - **Labs**: **aPTT, dRVVT** للـ LA؛ **ELISA** للـ aCL و anti-β2GPI، الاتنين IgG و IgM؛ **re-test بعد 12 weeks**.
          - **SLE screen** بالـ ANA و anti-dsDNA، خصوصًا الصغيرين أو اللي عندهم systemic symptoms.
      - kind: try
        items: [rheum.L04.025, rheum.L04.027, rheum.L04.032, rheum.L04.034, rheum.L04.038]
    recap:
      - "LA = clotting assay وأعلى خطر. aCL و anti-β2GPI = ELISA، IgG و IgM. aCL significant ≥40."
      - "High risk: triple positive، isolated LA، IgG عالي. Low: low titer، IgM من غير LA، transient."
      - "CAPS: ≥3 organs في أيام + small vessels. Triggers **SWIP**. علاج: anticoagulation + steroids + PLEX/IVIG."
    practice: [rheum.L04.021, rheum.L04.022, rheum.L04.023, rheum.L04.024, rheum.L04.025, rheum.L04.026, rheum.L04.027, rheum.L04.028, rheum.L04.029, rheum.L04.030, rheum.L04.031, rheum.L04.032, rheum.L04.033, rheum.L04.034, rheum.L04.035, rheum.L04.036, rheum.L04.037, rheum.L04.038, rheum.L04.039]
