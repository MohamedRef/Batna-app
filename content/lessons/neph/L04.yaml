        title: "الطوارئ: drug of choice"
        quote: "| Type of Emergency | Drug of Choice | Blood Pressure Target |\n| Aortic dissection | Beta blocker+ nitroprusside | 120 mm Hg systolic in 20 minutes (if possible) |\n| CARDIAC | | |\n| Ischemia/infarction | Nitroglycerin, nitroprusside, nicardipine, or clevidipine | Cessation of ischemia |\n| Heart failure (or pulmonary edema) | Nitroprusside and/or nitroglycerin | Improvement in failure (typically only a 10% to 15% decrease is required |\n| HEMORRHAGIC | | |\n| Epistaxis, gross hematuria, or threatened suture lines | Any (perhaps with anxiolytic agent | To decrease bleeding rate (typically only 10% to 15% reduction over 1-2 hours is required) |\n| OBSTETRIC | | |\n| Eclampsia or pre-eclampsia | MgSO4, hydralazine, methyldopa | Typically <90 mm Hg diastolic but often lower |\n| CATECHOLAMINE EXCESS STATES | | |\n| Pheochromocytoma | Phentolamine | To control paroxysms |\n| Drug withdrawal | Drug withdrawn | Typically only one dose necessary |\n| Cocaine (and similar drugs) | Phentolamine | Typically only 10% to 15% reduction over 1-2 hours |\n| RENAL | | |\n| Major hematuria or acute renal impairment | Fenoldopam | 0% to 25% reduction in mean arterial pressure over 1-12 hours |\n| NEUROLOGIC | | |\n| Hypertensive encephalopathy | Nitroprusside | 25% reduction over 2-3 hours |\n| Acute head injury/ trauma | Nitroprusside | 0% to 25% reduction over 2-3 hours (controversial) |"
        text: |
          - ==Aortic dissection==: **beta-blocker + nitroprusside**، systolic blood pressure (SBP) **120 في 20 دقيقة** لو ينفع.
          - **Ischemia/myocardial infarction (MI):** nitroglycerin، nitroprusside، nicardipine أو clevidipine حتى يقف الـ ischemia.
          - **HF/pulmonary edema:** nitroprusside و/أو nitroglycerin؛ غالبًا **10–15%** كفاية.
          - **Bleeding** (epistaxis، hematuria، suture lines): أي دوا ± anxiolytic، 10–15% في 1–2 ساعة.
          - **Eclampsia:** magnesium sulfate (MgSO4)، hydralazine، methyldopa؛ diastolic blood pressure (DBP) <90.
          - **Pheo، cocaine:** ==phentolamine==.
          - **Renal** (hematuria أو acute renal impairment): **fenoldopam**، 0–25% mean arterial pressure في 1–12 ساعة.
          - **Encephalopathy:** nitroprusside، **25% في 2–3 ساعات**. **Head injury:** nitroprusside، 0–25% (controversial).

          الخطوة الجاية بتشرح **ليه** كل طارئة ليها دواها.
