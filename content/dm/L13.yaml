    options: [DKA in pregnancy occurs only with glucose >350 mg/dL, Pregnancy is ketogenic; DKA can occur at lower glucose, Ketone testing is unnecessary with CGM, DKA risk is lower in pregnancy]
    answer: 1
    why:
      - There is no such threshold; DKA occurs at lower glucose in pregnancy.
      - Pregnancy is a ketogenic state, so DKA can be euglycemic; ketone strips at home are advised.
      - CGM measures glucose, not ketones, and euglycemic DKA can be missed.
      - The risk is higher in pregnancy.
    src: { page: 165, quote: "Women with preexisting diabetes, especially T1DM, need ketone strips at home & education on DKA prevention (sick day rules) & detection." }
    status: unverified
    tags: [book-question]
