  - id: rheum.L11.lesson3
    title: "Bruton والـ IgA والـ HAE والعلاج"
    hook: "ولد عنده 7 شهور ولوزه شبه مش موجودة، وست شفايفها بتتنفخ من غير هرش: اتنين مختلفين خالص."
    minutes: 9
    pages: [187, 190]
    topics: [bcell, tcell, hae, care]
    goals:
      - "تعرف XLA و selective IgA و hyper-IgM"
      - "تشخص HAE بالـ C4 وتعالجه"
      - "تعرف مين ياخد IVIG ومين ما ياخدش live vaccines"
    status: unverified
    steps:
      - kind: explain
        page: 187
        title: "Bruton (XLA)"
        quote: "Absence or deficiency of a specific enzyme needed for B cell maturation (Bruton‘s tyrosine kinase) results in no mature B lymphocytes or plasma cells"
        text: |
          نقص ==Bruton's tyrosine kinase== ← مفيش **mature B cells** ولا plasma cells.
          - IgM و IgA و IgD و IgE مش موجودين، و **IgG <10%**
          - الـ infections بتبدأ ==5–9 شهور== (بعد ما IgG الأم يخلص): **H. influenzae** و **S. pneumoniae**
          - مقاومة الفيروسات طبيعية تقريبًا **إلا ECHO viruses**
          - **Tiny tonsils** لأن أكبر تجمع B cells في الرضيع هو اللوز
          - التشخيص: ولد بـ Ig واطية ومفيش B cells بالـ immunophenotyping. العلاج: **IVIG** شهري
      - kind: explain
        page: 188
        title: "Dysgammaglobulinaemia و DiGeorge"
        quote: "The most common is selective IgA deficiency which occurs in about 1/500 people."
        text: |
          - **Dysgammaglobulinaemia:** نقص selective في class أو subclass
          - الأشهر ==selective IgA deficiency==: حوالي **1/500**
          - **X-linked hyper-IgM:** ==CD40 ligand== غايب على الـ T cells ← مفيش class switch من IgM
          - **DiGeorge:** الـ thymus ما اتكونش ← T cell dysfunction، وخطر من الـ **live attenuated vaccines** (زي measles)
      - kind: case
        page: 189
        quote: "One can screen for the disease by ordering a C4 level which will be low even between attacks."
        stem: "A 24-year-old woman has recurrent swelling of the lips and hands for 2–5 days, no itch, no urticaria, no response to antihistamines. Her mother has the same."
        steps:
          - question: "Best screening test?"
            options: ["C4 level", "Serum tryptase", "IgE level", "ANA"]
            answer: 0
            why: "ده HAE (autosomal dominant، C1INH ناقص أو بايظ). الـ C4 بيبقى واطي حتى بين النوبات. الـ tryptase للـ anaphylaxis والـ IgE للحساسية."
          - question: "Severe laryngeal attack: treatment of choice in the book?"
            options: ["C1INH plasma concentrate", "Antihistamine", "Danazol", "IVIG"]
            answer: 0
            why: "الكتاب: C1INH plasma concentrates للـ laryngeal oedema والـ abdominal attacks الشديدة. الـ danazol أو stanozolol للـ maintenance مش للنوبة."
      - kind: update
        page: 189
        quote: "the pathogenesis results from continued production C3a and C5a which then induce mast cells and basophils to release histamine"
        text: "الكتاب بيقول الـ HAE من C3a و C5a و histamine. الصح النهاردة إنه bradykinin-mediated، علشان كده الـ antihistamines والـ steroids ما بتنفعش. والعلاج الحديث للنوبة: C1-INH concentrate أو icatibant أو ecallantide، والوقاية: lanadelumab أو C1-INH أو berotralstat، والـ danazol بقى خط تاني."
        ref: "WAO/EAACI hereditary angioedema guideline 2021"
      - kind: explain
        page: 189
        title: "العلاج"
        quote: "IVIG replacement therapy is the treatment of choice for all primary immunodeficiency syndromes (except IgA deficiency"
        text: |
          - ==IVIG== هو العلاج لكل الـ primary immunodeficiency **ما عدا IgA deficiency**
          - IgA deficiency: لو فيه **chronic diarrhoea** جرّب **oral Ig**، ولو محتاج دم: **washed** أو low-IgA products
          - **IgG subclass deficiency:** IVIG بس لو فشل يعمل antibodies للـ protein و polysaccharide
          - الجرعة: **200–400 mg/kg** كل **3–4 أسابيع** لـ IgG **>400 mg/dL**
          - **SCID:** ==bone marrow transplant==، ولو اتعمل في أول 3 شهور النجاة حوالي **93%**
      - kind: check
        page: 190
        quote: "Live vaccines (eg, bacille Calmette-Guérin, polio, measles, rubella, mumps) should not be given to patients (or their family members) with T-cell disorders, XLA"
        question: "Which statement about live vaccines in primary immunodeficiency is true?"
        options:
          - "They are avoided in the patient and their family members"
          - "They are safe once IVIG has started"
          - "Only BCG is a problem"
          - "They are fine in XLA because T cells are normal"
        answer: 0
        why:
          - "صح: الكتاب: ما تديش live vaccines للعيان ولا لأهله في T-cell disorders و XLA."
          - "الـ IVIG ما بيخليهاش آمنة."
          - "مش BCG بس: polio، measles، rubella، mumps كمان."
          - "الكتاب ذكر XLA بالاسم في المنع."
      - kind: aside
        tone: exam
        page: 190
        quote: "autoimmune diseases and cancers become a serious threat because the incidence of these diseases is several-fold higher"
        text: |
          في الـ essay: لما الـ infections تتسيطر عليها، ==autoimmune diseases و cancers== بيبقوا الخطر الأكبر على المدى الطويل، لأن نسبتهم **several-fold higher**.
      - kind: try
        items: [rheum.L11.036, rheum.L11.043, rheum.L11.052, rheum.L11.055, rheum.L11.066]
    recap:
      - "XLA: BTK ناقص، مفيش B cells، infections 5–9 شهور، لوز صغيرة، IVIG شهري."
      - "Selective IgA (1/500): لا IVIG، oral Ig للإسهال، washed blood. Hyper-IgM: CD40 ligand."
      - "HAE: C1INH، autosomal dominant، C4 واطي حتى بين النوبات، C1INH concentrate للنوبة الشديدة. SCID: BMT بدري."
    practice: [rheum.L11.035, rheum.L11.036, rheum.L11.037, rheum.L11.038, rheum.L11.039, rheum.L11.040, rheum.L11.041, rheum.L11.042, rheum.L11.043, rheum.L11.044, rheum.L11.045, rheum.L11.046, rheum.L11.047, rheum.L11.048, rheum.L11.049, rheum.L11.050, rheum.L11.051, rheum.L11.052, rheum.L11.053, rheum.L11.054, rheum.L11.055, rheum.L11.056, rheum.L11.057, rheum.L11.058, rheum.L11.059, rheum.L11.060, rheum.L11.061, rheum.L11.062, rheum.L11.063, rheum.L11.064, rheum.L11.065, rheum.L11.066, rheum.L11.084]
