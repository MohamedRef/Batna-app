  - id: hem.L10.lesson4
    title: "علاج الـ PV: فصد، أسبرين، وحبة لو كبير"
    hook: "الهدف واحد: تمنع الجلطة من غير ما تعمل نزيف. والسن بيقرر الدوا."
    minutes: 10
    pages: [164, 168]
    topics: [pv-treatment]
    goals:
      - "تعرف هدف العلاج والـ risk groups"
      - "تكتب الـ venesection protocol"
      - "تختار الـ cytoreductive agent الصح"
    status: unverified
    steps:
      - kind: explain
        page: 164
        title: "الهدف"
        quote: "Primarily to reduce the risk of thrombosis without increasing the bleeding tendency"
        text: |
          1. أولًا: ==reduce the risk of thrombosis without increasing the bleeding tendency==.
          2. تانيًا: تخفيف الأعراض، خصوصًا **vasomotor**.
      - kind: table
        page: 168
        quote: "Phlebotomy and correction of CV risk factors, and aspirin"
        title: "الـ risk groups في الـ PV"
        columns: [Risk, Who, Therapy]
        rows:
          - [Low, "<60 and no thrombosis", "Phlebotomy + CV risk control + aspirin"]
          - [High, "≥60 and/or thrombosis", "Cytoreduction + CV risk control + aspirin ± phlebotomy"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2]]
      - kind: explain
        page: 165
        title: "Venesection"
        quote: "450 ml of blood removed ( isovolaemic replacement with normal saline) in adult every 2-3 days, twice weekly in old patients. Target Hct <0.45."
        text: |
          - ==أسرع طريقة== تنزّل الـ red cell mass.
          - **450 mL** كل **2–3 أيام** في البالغين (مع normal saline isovolemic)، و**مرتين في الأسبوع** في الكبار.
          - **Target Hct <0.45**.
          - الـ maintenance بتختلف: من مرتين في السنة لمرة كل شهر.
          - أول **3 سنين** خطر التجلط أعلى: زوّد **aspirin** و **cytoreduction**.
      - kind: aside
        tone: analogy
        page: 165
        quote: "Is the quickest way of reducing RCM."
        text: "الـ venesection زي ما تفتح حنفية الخزان لما يطفح: أسرع حل يقلل الـ RCM، بس المصنع (النخاع) لسه شغال، فهتحتاج تفتحها تاني. علشان كده الـ high risk محتاج **cytoreduction** يهدّي المصنع نفسه."
      - kind: check
        page: 168
        quote: "1. Venesection to maintain hematocrit < 0.45 2. Low-dose aspirin (unless contraindicated)"
        question: "45-year-old, JAK2+ PV, Hct 0.58, no thrombosis or risk factors. Plan?"
        options: ["Venesection to Hct <0.45 + aspirin", "Hydroxyurea + aspirin", "32P", "Observation"]
        answer: 0
        why:
          - "صح: low risk = phlebotomy + aspirin + CV risk control."
          - "الـ cytoreduction للـ high risk أو الـ indications."
          - "الـ 32P leukemogenic ومش تحت 65."
          - "لازم تنزّل الـ Hct علشان التجلط."
      - kind: explain
        page: 166
        title: "الأدوية"
        quote: "Antimetabolite, ribonucleotide reductase inhibitor. Onset of myelosuppression is rapid"
        text: |
          - ==Hydroxyurea==: antimetabolite، **ribonucleotide reductase inhibitor**، مفعوله سريع. **30 mg/kg** وبعدين **10–20 mg/kg**. الكتاب: **not increased risk of malignancy**. أعراضه: myelosuppression، photosensitivity، leg ulcers، GI.
          - **IFN-α**: بيظبط الصفائح والـ PCV؛ للصغيرين، والحمل، والـ intractable pruritus، واللي ما استحملوش غيره. **3–5 mU** تلات مرات/أسبوع؛ غالي و flu-like و depression.
          - **32P**: بينزّل الـ RCM بعد **12 أسبوع**، **2.3 mCi/m²** IV. تجلط أقل بس **AML** أكتر بكتير، فـ **مش تحت 65**.
          - **Anagrelide**: imidazoquinazoline (anti-cAMP phosphodiesterase)، بيوقف نضج الـ megakaryocytes بس. صداع، arrhythmia، fluid retention، دوخة؛ **ممنوع في القلب والحمل**.
      - kind: match
        page: 167
        quote: "Side effect, headache, arrythmia, fluid retention, dizziness. Contraindicated in cardiac patient and in pregnancy."
        prompt: "وصّل الدوا بأهم معلومة عنه في الـ PV:"
        pairs:
          - ["Hydroxyurea", "Ribonucleotide reductase inhibitor, 30 then 10–20 mg/kg"]
          - ["Interferon-alpha", "Young, pregnancy, intractable pruritus"]
          - ["Radioactive phosphorus", "Not under 65: leukemogenic"]
          - ["Anagrelide", "Contraindicated in cardiac patients and pregnancy"]
          - ["Aspirin", "75 mg/day; avoid with past GI bleeding"]
        why: "كل دوا له مكان: الـ hydroxyurea للكبار، الـ IFN للصغيرين والحوامل، الـ 32P للمسنين بس، الـ anagrelide بعيد عن القلب والحمل، والـ aspirin بجرعة صغيرة."
      - kind: explain
        page: 167
        title: "Aspirin والـ supportive"
        quote: "Low dose 75 mg/day In patient with risk of thrombosis (obesity, hypertension, DM, history of MI)."
        text: |
          - **Aspirin 75 mg/day** للي عندهم خطر تجلط (obesity، HTN، DM، MI قبل كده). ابعد عنه لو فيه **نزيف قديم**، خصوصًا GI.
          - **Supportive**: سوايل كفاية، **allopurinol**، و antihistamine أو **H2 blocker** أو IFN للـ pruritus.
          - ==BMT is not advocated== في الـ stable PV (سن المرضى والـ natural history الهادية نسبيًا).
      - kind: explain
        page: 168
        title: "التوصيات بالترتيب"
        quote: "< 40 years – interferon- b (ii) > 40 years – hydroxyurea ,c a. Avoid aspirin while platelet count > 1500 x 109/L."
        text: |
          1. Venesection لـ **Hct <0.45**
          2. **Low-dose aspirin** (ابعد عنه لو الصفائح ==>1500 × 10⁹/L==)
          3. تحكّم جامد في الـ risk factors (تدخين، HTN، كوليسترول، سمنة)
          4. **Cytoreduction** لو: مش مستحمل الفصد، أو **thrombocytosis**، أو طحال **symptomatic أو بيكبر**
          5. الاختيار: **IFN تحت 40**، **hydroxyurea فوق 40**
          - **Anagrelide + venesection** لو فشل أو ما استحملش الـ hydroxyurea والـ IFN.
          - **32P أو busulfan** متقطع للكبير اللي مش قادر ييجي العيادة.
      - kind: update
        page: 168
        quote: "< 40 years – interferon- b (ii) > 40 years – hydroxyurea ,c"
        text: "الـ **ropeginterferon alfa-2b** بقى approved للـ PV (FDA 2021)، والـ **ruxolitinib** second line للي فشل أو ما استحملش الـ hydroxyurea. في الامتحان اكتب اختيار الكتاب: interferon تحت 40 و hydroxyurea فوق 40."
        ref: "NCCN Myeloproliferative Neoplasms guideline 2024"
      - kind: check
        page: 168
        quote: "Avoid aspirin while platelet count > 1500 x 109/L."
        question: "PV patient on aspirin; platelets now 1,700 × 10⁹/L. What about aspirin?"
        options: ["Hold it while platelets >1500", "Double it", "Continue unchanged", "Add clopidogrel"]
        answer: 0
        why:
          - "صح: الكتاب بيقول ابعد عن الـ aspirin فوق 1500."
          - "هيزوّد النزيف."
          - "الكتاب صريح إنك توقفه."
          - "dual antiplatelet أخطر."
      - kind: try
        items: [hem.L10.067, hem.L10.069, hem.L10.077, hem.L10.085, hem.L10.086]
    recap:
      - "الهدف: امنع الجلطة من غير نزيف، وبعدين الأعراض."
      - "Low (<60، مفيش جلطة): phlebotomy + aspirin + CV risk. High (≥60 أو جلطة): cytoreduction + aspirin ± phlebotomy."
      - "Venesection 450 mL كل 2–3 أيام لـ Hct <0.45."
      - "IFN تحت 40 (وفي الحمل والهرش)، hydroxyurea فوق 40، 32P بس فوق 65، anagrelide مش للقلب والحمل."
      - "Aspirin 75 mg؛ ابعد عنه فوق 1500 صفيحة أو مع نزيف GI قديم."
    practice: [hem.L10.066, hem.L10.067, hem.L10.068, hem.L10.069, hem.L10.070, hem.L10.071, hem.L10.072, hem.L10.073, hem.L10.074, hem.L10.075, hem.L10.076, hem.L10.077, hem.L10.078, hem.L10.079, hem.L10.080, hem.L10.081, hem.L10.082, hem.L10.083, hem.L10.084, hem.L10.085, hem.L10.086, hem.L10.087, hem.L10.088, hem.L10.089, hem.L10.090, hem.L10.091, hem.L10.092, hem.L10.131]
