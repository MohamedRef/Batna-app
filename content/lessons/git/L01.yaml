          - جينات **tumour necrosis factor (TNF)** و **lymphotoxin-α**: مرتبطة بالـ **duodenal ulcers**، **gastric ulcers**، و **antral inflammation**.
          - **Toll-like receptor 1 (TLR1)** locus: مرتبط بالـ H. pylori **seroprevalence** في البيض من أصل أوروبي (genome-wide association study).

          ليه الـ IL-1β خطير؟ التفسير المقبول (مش في الكتاب): بيمنع إفراز الحمض، فالمعدة تبقى أقل حموضة، والبكتيريا تقدر تنتشر للـ corpus، فالالتهاب يعم ويوصل لـ atrophy. يعني نفس العدوى ممكن تعمل ulcer عند واحد و atrophy عند التاني حسب جيناته.
