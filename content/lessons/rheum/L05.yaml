  - id: rheum.L05.lesson2
    title: "جينات وعدوى: ليه الـ tolerance بتقع؟"
    hook: "التوأم المتطابق، الـ B27 بـ relative risk 90، وعين اتعورت فالتانية ولّعت."
    minutes: 9
    pages: [80, 82]
    topics: [genetics, infections]
    goals:
      - "تشرح دليل التوائم وليه الـ MHC أهم الجينات"
      - "تحفظ جدول الـ HLA والـ relative risk وتفهم ليه الـ risk مش يقين"
      - "تشرح إزاي العدوى بتعمل autoimmunity"
    status: unverified
    steps:
      - kind: explain
        page: 80
        title: "الجينات"
        quote: "Increased incidence among monozygotic twins than among dizygotic twins."
        text: |
          - جينات كتير بتهيّئ للمرض، و ==major histocompatibility complex (MHC) genes== أهمهم.
          - لو توأم متطابق جاله autoimmune disease، أخوه أقرب يجيله من أي حد غريب.
          - الـ incidence أعلى في الـ **monozygotic** عن الـ **dizygotic** twins.

          التفسير المقبول (مش في الكتاب): ليه التوائم دليل قوي؟ عشان الـ monozygotic شايلين نفس الجينات بالظبط، فلو المرض بيمشي معاهم أكتر من الـ dizygotic اللي اتربّوا في نفس البيت، يبقى الفرق من الجينات. وبرضه إن التوأم المتطابق مش دايمًا بيجيله المرض بيقولك إن الجينات لوحدها مش كفاية.
      - kind: reveal
        page: 80
        quote: "Increased incidence among monozygotic twins than among dizygotic twins."
        prompt: "ليه المقارنة بين monozygotic و dizygotic twins بتثبت إن السبب وراثي؟"
        answer: |
          الاتنين اتربّوا في نفس البيت ونفس البيئة تقريبًا. الفرق الوحيد إن الـ **monozygotic** شايلين **نفس الجينات 100%** والـ dizygotic زي أي أخوات.

          فلو المرض أكتر في الـ monozygotic، يبقى الفرق ده جاي من ==الجينات== مش من البيئة. ده منطق الـ twin studies، والملاحظة نفسها من الكتاب.
      - kind: explain
        page: 80
        title: "ليه الـ MHC بالذات؟"
        quote: "Multiple genes predispose to autoimmune diseases, the most important of these being MHC genes."
        text: |
          الكتاب بيقول جينات كتير بتهيّئ للـ autoimmunity، و ==أهمهم الـ MHC genes==.

          التفسير المقبول (مش في الكتاب): الـ MHC هو الطبق اللي الخلية بتقدّم عليه الـ peptides للـ T cell. كل allele شكل الطبق بتاعه مختلف، فبيمسك peptides معينة أحسن من غيرها. فلو allele معيّن بيعرض self peptide بطريقة تنشّط الـ T cells، الشخص اللي ورثه يبقى أقرب للمرض.

          وده يربط بالـ take-home message في صفحة 82: أقوى ارتباط بين الـ HLA والأمراض **T cell–mediated**، عشان الـ MHC أصلًا شغلته مع الـ T cells.
      - kind: table
        page: 81
        quote: "The incidence of a particular autoimmune disease is often greater in individuals who inherit a particular HLA allele(s) than in the general population. This increased incidence is called relative risk of HLA disease association."
        title: "الـ HLA والـ relative risk"
        columns: [Disease, HLA, RR]
        rows:
