          ليه بالاستبعاد؟ التفسير المقبول (مش في الكتاب): لأن الـ TBMN benign، فمش هنعمل biopsy لكل واحد عنده دم في البول. لو عنده hematuria بس، **من غير** proteinuria ولا ضغط ولا renal impairment، ومن غير طرش أو عين (**no extrarenal manifestations**)، ومعاه family history لنفس الصورة، بنسمّيه TBMN ونتابعه.

          والـ **macroscopic hematuria** ممكن تحصل في حوالي **20%**، فما تخوّفكش لوحدها.
