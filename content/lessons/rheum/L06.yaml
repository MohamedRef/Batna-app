  - id: rheum.L06.lesson6
    title: "الـ innate بيشوف إزاي، والـ cytokines بتتكلم إزاي"
    hook: "الـ macrophage مش محتاج يعرف اسم الميكروب: بيعرف شكل «الزي الرسمي» بتاع الميكروبات كلها، وبيبعت رسايل لكل الجيش."
    minutes: 8
    pages: [86, 86]
    topics: [iis, cytokines]
    goals:
      - "تعرف الـ PAMPs والـ Toll-like receptors وليه الـ innate بيعتمد عليهم"
      - "تربط كل cytokine من الـ macrophage بالخلية اللي بينشّطها"
      - "تعرّف الـ cytokines وطرق عملها الثلاثة"
    status: unverified
    steps:
      - kind: explain
        page: 86
        title: "الـ innate بيشوف إيه؟"
        quote: "Binding occurs through Toll-like receptors; mannose receptors (pattern recognition receptors)."
        text: |
          الـ macrophage بيتعرّف على ==pathogen-associated molecular patterns (PAMPs)==، يعني pathogen-associated molecular patterns: **lipopolysaccharides** و **peptidoglycans** و **mannans** و **bacterial DNA/RNA**.

          وبيمسكهم بـ **pattern recognition receptors**: **Toll-like receptors** و **mannose receptors**. وبعدها يطلّع cytokines:
          - **IL-1، TNF-α، IL-8** ← تنشّط الـ **neutrophils**
          - **IFN-α** ← ينشّط الـ phagocytes
          - **IL-15** ← ينشّط الـ **NK cells**
          - **IL-12، IL-18** ← ينشّطوا الـ **T helper 1 (TH1)**
      - kind: reveal
        page: 86
        quote: "Macrophages can recognize: bacterial lipopolyaccharides, peptidoglycans, mannans, and bacterial DNA/RNA"
        prompt: "ليه الـ macrophage بيدوّر على lipopolysaccharides و peptidoglycans بالذات، مش على أي بروتين غريب؟"
        answer: |
          التفسير المقبول (مش في الكتاب): الحاجات دي موجودة في **الميكروبات** ومش موجودة في **خلايا الإنسان**: الـ peptidoglycan جدار البكتيريا، والـ lipopolysaccharide في الـ gram-negative، والـ mannans على الفطريات.

          وكمان الميكروب **ما يقدرش يغيّرها بسهولة** لأنها جزء أساسي من تركيبه. فالـ innate بيعرف "الزي الرسمي" بتاع العدو كله، من غير ما يحتاج يتعلم كل ميكروب لوحده، وده اللي بيخليه جاهز من **الولادة**.
      - kind: match
        page: 86
        quote: "IL-15 stimulate natural killer cells."
        prompt: "وصّل الـ cytokine بالهدف:"
        pairs:
          - ["IL-8", "Neutrophils"]
          - ["IL-15", "NK cells"]
          - ["IL-12", "TH1 cells"]
          - ["IFN-α", "Phagocytes"]
        why: "**IL-8** هو الـ neutrophil chemokine المشهور، و **IL-15** للـ NK، و **IL-12** هو مفتاح الـ Th1."
      - kind: figure
        page: 86
        quote: "Binding occurs through Toll-like receptors; mannose receptors (pattern recognition receptors)."
        title: "من الـ PAMP للجيش كله"
        alt: "Flow drawing. A microbe's PAMPs bind Toll-like and mannose receptors on a macrophage. The macrophage sends four arrows: IL-1, TNF-alpha and IL-8 to neutrophils; IFN-alpha to phagocytes; IL-15 to NK cells; IL-12 and IL-18 to TH1 cells. A fifth arrow: the macrophage acts as APC and raises costimulatory molecules for the T cell."
        caption: "الـ ==PAMP== يمسك في الـ receptor، والـ macrophage يبعت cytokine لكل فرقة، ويقدّم الـ antigen للـ T cell مع الـ **costimulation**."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L06f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fg-head"/></marker></defs>
            <circle cx="50" cy="60" r="32" class="fg-bad"/>
            <text x="50" y="56" text-anchor="middle" class="t-sm t-b">Microbe</text>
            <text x="50" y="72" text-anchor="middle" class="t-sm">PAMPs</text>
            <path d="M82 60 H130" class="fg-arrow" marker-end="url(#L06f)"/>
            <text x="106" y="50" text-anchor="middle" class="t-sm t-mut">TLR</text>
            <circle cx="180" cy="60" r="45" class="fg-acc"/>
            <text x="180" y="57" text-anchor="middle" class="t-b">Macrophage</text>
            <text x="180" y="75" text-anchor="middle" class="t-sm t-mut">cytokines</text>
            <path d="M160 105 L40 160" class="fg-arrow" marker-end="url(#L06f)"/>
            <path d="M172 105 L120 210" class="fg-arrow" marker-end="url(#L06f)"/>
            <path d="M188 105 L210 160" class="fg-arrow" marker-end="url(#L06f)"/>
            <path d="M200 105 L290 210" class="fg-arrow" marker-end="url(#L06f)"/>
            <text x="10" y="178" class="t-sm t-b">Neutrophils</text>
            <text x="10" y="194" class="t-sm">IL-1, TNF, IL-8</text>
            <text x="80" y="228" class="t-sm t-b">Phagocytes</text>
            <text x="80" y="244" class="t-sm">IFN-α</text>
            <text x="190" y="178" class="t-sm t-b">NK cells</text>
            <text x="190" y="194" class="t-sm">IL-15</text>
            <text x="250" y="228" class="t-sm t-b">TH1</text>
            <text x="250" y="244" class="t-sm">IL-12, IL-18</text>
            <rect x="40" y="272" width="250" height="44" rx="10" class="fg-good"/>
            <text x="165" y="291" text-anchor="middle" class="t-sm t-b">Acts as APC</text>
            <text x="165" y="308" text-anchor="middle" class="t-sm">+ costimulatory molecules → T cell</text>
          </svg>
      - kind: reveal
        page: 86
        quote: "Binding of antigens to Toll receptors upregulates the expression of co- stimulatory molecules on APC. This is necessary for T cell activation."
        prompt: "الـ innate بيكلّم الـ adaptive إزاي؟"
        answer: |
          بطريقتين:
          1. الخلايا الـ innate بتبلع الـ pathogen وتقدّمه للـ T cells، يعني بتشتغل ==APC==.
          2. لما الـ antigen يمسك في الـ **Toll receptor**، الـ APC تزوّد الـ **costimulatory molecules**، وده **ضروري** لتنشيط الـ T cell.

          افتكر الـ **anergy** من محاضرة الـ autoimmunity: من غير costimulation الـ T cell بتتقفل. فالـ innate هو اللي بيقول للـ adaptive "ده عدو بجد".
      - kind: explain
        page: 86
        title: "الـ cytokines"
        quote: "Are small molecular weight soluble factors released by cells (cyto) to communicate and influence the function of other cells (kines) through specific surface receptors. Cytokines can have an autocrine function, paracrine or endocrine function. Factors released by white blood cells and act on white blood cells are called interleukins (IL). Cytokines have important immune functions in lymphocyte activation, local and systemic inflammation."
        text: |
          الـ ==cytokines== = **small molecular weight soluble factors** بتطلّعها الخلايا (cyto) علشان تكلّم خلايا تانية وتأثر عليها (kines) عن طريق **specific surface receptors**.

          - بتشتغل **autocrine** على نفسها، أو **paracrine** على اللي جنبها، أو **endocrine** بعيد في الدم.
          - اللي بتطلع من الـ white blood cells (WBCs) وتشتغل على WBCs اسمها **interleukins**.
          - وظيفتها: **lymphocyte activation** و **local and systemic inflammation**.
      - kind: aside
        tone: analogy
        page: 86
        quote: "Cytokines can have an autocrine function, paracrine or endocrine function."
        text: |
          الـ cytokines زي **رسايل الواتساب**:
          - **Autocrine** = رسالة لنفسك (تذكير)، الخلية بتنشّط نفسها.
          - **Paracrine** = رسالة لجارك في نفس العمارة، الخلية اللي جنبها.
          - **Endocrine** = بوست على الجروب كله، يمشي في الدم ويوصل بعيد.

          والـ ==interleukins== هي الرسايل اللي **الـ WBCs** بتبعتها لـ **WBCs** تانية: "بين الكريات البيضا" (inter-leukin).
      - kind: check
        page: 86
        quote: "Factors released by white blood cells and act on white blood cells are called interleukins (IL)."
        question: "A cytokine made by a T cell acts on the same T cell to make it divide. How is this action described?"
        options: ["Autocrine", "Paracrine", "Endocrine", "Interleukin-independent"]
        answer: 0
        why:
          - "صح: الخلية بتأثر على نفسها = autocrine (auto = نفسه)."
          - "الـ paracrine على خلية جنبها، مش على نفسها."
          - "الـ endocrine بيمشي في الدم لمكان بعيد."
          - "دي مش طريقة عمل؛ وكمان ده interleukin لأنه من WBC لـ WBC."
      - kind: reveal
        page: 86
        quote: "Cytokines have important immune functions in lymphocyte activation, local and systemic inflammation."
        prompt: "الكتاب بيقول الـ cytokines ليها دور في local و systemic inflammation. إزاي cytokine واحد زي IL-1 يعمل الاتنين؟"
        answer: |
          التفسير المقبول (مش في الكتاب): بنفس الطرق الثلاثة.
          - **Paracrine** في مكان العدوى: ينشّط الـ neutrophils اللي جنبه ← احمرار وصديد **local**.
          - لو الكمية كبيرة يوصل الدم **endocrine**: يرفع الحرارة ويخلي الكبد يطلّع **CRP**، وده الـ **systemic** inflammation.

          عشان كده الـ **CRP** اللي في جدول الـ innate بيعلى في الدم مع أي التهاب.
      - kind: try
        items: [rheum.L06.009, rheum.L06.010, rheum.L06.012, rheum.L06.013, rheum.L06.015]
    recap:
      - "PAMPs (LPS، peptidoglycan، mannans، DNA/RNA بكتيري) موجودة في الميكروب بس، فالـ innate جاهز من الولادة."
      - "بيمسكهم بالـ pattern recognition receptors: Toll-like و mannose receptors."
      - "IL-1/TNF/IL-8 neutrophils، IFN-α phagocytes، IL-15 NK، IL-12/18 TH1."
      - "الـ innate يكلّم الـ adaptive: APC + costimulatory molecules."
      - "Cytokines: autocrine، paracrine، endocrine؛ من WBC لـ WBC = interleukins."
    practice: [rheum.L06.009, rheum.L06.010, rheum.L06.011, rheum.L06.012, rheum.L06.013, rheum.L06.014, rheum.L06.015, rheum.L06.016]
