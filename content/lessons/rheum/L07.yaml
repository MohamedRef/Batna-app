        prompt: "الـ C5b بيعمل إيه بالظبط، وليه لازم يقعد على السطح مش يطير زي الـ C5a؟"
        answer: |
          الكتاب بيقول الـ **C5b** بيلزق في **cell surface** وبيبقى **nucleus** للـ terminal complement components: C6 و C7 و C8 و C9.

          التفسير المقبول (مش في الكتاب): الـ MAC لازم يتبني **في غشا الخلية الهدف نفسها** عشان يخرّمها. لو الـ C5b كان بيطير في البلازما، الماسورة كانت هتتبني في الهوا ومش هتخرّم حاجة. فالـ b يفضل على السطح ويبقى **الأساس** اللي الباقي يتركّب عليه، والـ a يطير ينادي الـ neutrophils. نفس قاعدة a = away و b = bound من أول المحاضرة.
