        quote: "Adynamic bone, Osteomalacia; Normal; Mild; Osteitis fibrosa; Mixed\nLow turnover: Low PTH; Low alkaline phosphatase; High calcium; Normal or high phosphate\n  Low bone resorption AND formation\nHigh turnover: High PTH; High alkaline phosphatase; Low calcium; High phosphate\n  High bone resorption with some bone formation\nToward high turnover: Low dialysate calcium, negative or zero Ca balance; Hyperparathyroidism\nToward low turnover: Calcium, calcitriol; Aluminum; High dialysate calcium"
        title: "عظم الـ CKD: turnover واطي ولا عالي؟"
        columns: [Feature, Low turnover, High turnover]
        rows:
          - ["PTH", "Low", "High"]
          - ["alkaline phosphatase", "Low", "High"]
          - ["Calcium", "High", "Low"]
        hide: [[0, 1], [0, 2], [2, 1]]
      - kind: explain
        page: 65
        quote: "Adynamic bone, Osteomalacia; Normal; Mild; Osteitis fibrosa; Mixed\nLow turnover: Low PTH; Low alkaline phosphatase; High calcium; Normal or high phosphate\n  Low bone resorption AND formation\nHigh turnover: High PTH; High alkaline phosphatase; Low calcium; High phosphate\n  High bone resorption with some bone formation\nToward high turnover: Low dialysate calcium, negative or zero Ca balance; Hyperparathyroidism\nToward low turnover: Calcium, calcitriol; Aluminum; High dialysate calcium"
        title: "ليه العضم بيتعب في الـ CKD؟"
        text: |
          رسمة ص 65 بتحط الـ CKD-MBD على مسطرة من **low turnover** (adynamic bone، osteomalacia) لـ **high turnover** (osteitis fibrosa).

          التفسير المقبول (مش في الكتاب) للحكاية من الأول:

          - الكلية مش بترمي **phosphate**، فيعلى.
          - الكلية مش بتنشّط **vitamin D** (calcitriol)، فالكالسيوم يقل.
          - الاتنين بيشغّلوا الـ ==PTH==، والـ PTH العالي بيكسّر العضم بسرعة: **osteitis fibrosa** (high turnover، alkaline phosphatase عالي).
          - ولو عالجت زيادة (كالسيوم كتير، calcitriol كتير، aluminum، dialysate calcium عالي)، الـ PTH ينطفي والعضم يبطّل يتجدد: **adynamic bone** (low turnover).

          علشان كده الكتاب بيقول ==too high and too low PTH== الاتنين وحشين.
