        why: "الـ cholestatic بيبدأ بالـ **ultrasound** يدوّر على obstruction، وبعدين **MRI/MRCP**، وآخر حاجة **liver biopsy**."
      - kind: explain
        page: 130
        title: "التوقيت والـ dechallenge"
        text: |
          - **Onset**: أغلب الـ acute DILD بيحصل خلال 1 week to 3 months من التعرّض.
          - ==Positive dechallenge==: الإنزيمات تتحسن لما توقف الدوا. ده أقوى دليل إن الدوا هو السبب.
          - **Acute hepatocellular**: 50% reduction بعد 2 weeks، و normal by 4 weeks.
          - **Cholestatic**: ممكن prolonged recovery، فبطء التحسن هنا مش بينفي الـ DILI.

          ليه الـ cholestatic أبطأ؟ التفسير المقبول إن الـ hepatocytes بتتجدد بسرعة، أما القنوات المتأذية فبتاخد وقت أطول تصلّح نفسها.
      - kind: aside
        tone: analogy
        page: 130
        text: |
          الـ dechallenge زي ما تشيل صباعك من على الجرس: لو الصوت (الإنزيمات) وطي للنص في أسبوعين وسكت خالص في 4، يبقى إنت اللي كنت بترن.

          افتكرها: 2 → النص، 4 → صفر.
      - kind: case
        page: 129
        stem: "A 50-year-old man started a new drug 5 weeks ago. ALT 760 U/L (ULN 40), ALP 140 U/L (ULN 120). No alcohol."
        steps:
