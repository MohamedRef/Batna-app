        quote: "Single agent intrathecal chemotherapy (methotrexate) is standard therapy."
        text: |
          - الـ standard: ==single-agent intrathecal methotrexate==.
          - **Triple agent** في الـ **CNS leukemia** خصوصًا meningeal relapse (فوق 9 سنين): Methotrexate (MTX) 12 mg/m2 (max 15)، hydrocortisone 15 mg/m2، Ara-C 30 mg/m2 (max 50) في 10 ml.
          - ==Cranial irradiation== بقى بيتجنب قد ما نقدر في الأطفال بسبب الـ side effects.
