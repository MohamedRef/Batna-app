  - id: neph.L11.084
    kind: enumerate
    topic: ckd-fertility
    prompt: Mention the causes of sexual dysfunction in women on dialysis.
    points:
      - Hormonal derangements (dry skin, hot flashes, vaginal dryness and atrophy, incontinence)
      - Anxiety and depression
      - Poor social and body image (edema, fistula, catheters, equipment at home)
    pass: 2
    hook: "«هرمونات، نفسية، وشكل»: hormonal derangements (جلد ناشف، hot flashes، vaginal dryness وatrophy، incontinence)، anxiety وdepression، وsocial وbody image مهزوزة (edema، fistula، catheters، ومكن في البيت)."
    src: { page: 365, quote: "The prevalence of sexual dysfunction is high among women on maintenance dialysis and is caused by hormonal derangements in addition to psychosocial factors, such as anxiety, depression, and poor social and body image.(30) Hormonal changes may lead to dry skin, increased wrinkles, urinary incontinence, hot flashes, vaginal dryness, and atrophy, which may be associated with sexual dysfunction.(31) In the population treated with dialysis, negative body image from feeling bloated, having edema, dialysis fistulas, catheters, or equipment in the bedroom has been listed as a factor contributing to decreased sexual satisfaction and desire. Women are less content with their physical appearance than men and have a more negative impression of their bodies, particularly regarding sexual activity.(32)" }
    status: unverified
