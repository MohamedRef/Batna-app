  - id: geri.L07.075
    kind: mcq
    topic: cognition
    stem: An 80-year-old man's daughter says he became muddled and sleepy over the last 5 days. Before this he managed his own money and medicines. Which is most likely?
    options: [Delirium, Alzheimer dementia, Normal ageing, Late-life depression, Vascular dementia with stepwise course over years]
    answer: 0
    why:
      - "Correct: decline over days to weeks is more likely delirium (p117)."
      - Dementia declines over months to years.
      - Normal ageing does not cause new confusion over days.
      - Depression is possible but the rapid confusion points to delirium.
      - A course over years is dementia, not days.
    src: { page: 117, quote: "The rate of decline is important to distinguish delirium from dementia. Cognitive decline which is rapid and has taken place over days to weeks as opposed to months or years is more likely to represent delirium." }
    status: unverified
