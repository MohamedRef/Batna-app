lessons:
  # ------------------------------------------------------------------
  - id: rheum.L14.lesson1
    title: "العضم: بنك فيه سحب وإيداع"
    hook: "العضم مش حجر. كل يوم فيه osteoclast بيسحب و osteoblast بيودّع، والـ osteoporosis هي لما السحب يغلب."
    minutes: 8
    pages: [221, 223]
    topics: [definition, biology, types, risk]
    goals:
      - "تعرف تعريف الـ osteoporosis وأماكن الكسور"
      - "تفهم الـ remodeling والفرق بين type I و type II"
      - "تعدّ الأسباب الثانوية والـ risk factors"
    status: unverified
    steps:
      - kind: explain
        page: 221
        quote: "Decreased bone mass. Microarchitectural deterioration of bone tissue. Increased bone fragility and risk of fractures."
        title: "التعريف"
        text: |
          الـ ==osteoporosis== **systemic skeletal disorder** فيه:

          - **Decreased bone mass**.
          - **Microarchitectural deterioration**.
          - **Increased fragility** وخطر الكسر.

          وقوة العضم = **bone density + bone quality**، مش الكثافة لوحدها.
      - kind: figure
        page: 221
        quote: "Vertebral bodies (spine). Proximal femur (hip). Distal forearm (Colles‘ fracture)."
        title: "التلات أماكن الكلاسيك"
        alt: "A simple skeleton outline with three red marks: the vertebral bodies of the spine, the proximal femur at the hip, and the distal forearm at the wrist labelled Colles."
        caption: "العمود الفقري، رأس الفخذ، والرسغ (Colles'). دول اللي بيتكسروا من وقعة بسيطة."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <circle cx="165" cy="30" r="20" class="fg-box"/>
            <path d="M165 50V170M120 70H210M135 170H195" class="fg-ink"/>
            <path d="M120 70L105 130L95 185M210 70L225 130L235 185" class="fg-ink"/>
            <path d="M135 170L128 235L125 290M195 170L202 235L205 290" class="fg-ink"/>
            <rect x="155" y="90" width="20" height="60" rx="4" class="fg-bad"/>
            <circle cx="196" cy="180" r="10" class="fg-dot-bad"/>
            <circle cx="96" cy="175" r="8" class="fg-dot-bad"/>
            <text x="185" y="120" class="t-sm t-bad">vertebrae</text>
            <text x="10" y="200" class="t-sm t-bad">distal forearm</text>
            <text x="10" y="216" class="t-sm t-bad">(Colles')</text>
            <text x="215" y="185" class="t-sm t-bad">proximal femur</text>
          </svg>
      - kind: explain
        page: 221
        quote: "Affects 1 in 3 women and 1 in 5 men over the age of 50."
        title: "ليه نهتم؟"
        text: |
          - الكسور بتجيب **pain** و **disability** و quality of life أقل و ==mortality== أعلى.
          - بيصيب **1 من كل 3 ستات** و **1 من كل 5 رجالة** فوق الـ 50.
          - عبء كبير مع كِبَر السن، وتكلفة عالية.
      - kind: explain
        page: 222
        quote: "Regulated by osteoclasts (resorption) and osteoblasts (formation)."
        title: "الـ Remodeling"
        text: |
          - **Cortical (compact)**: في الـ shafts بتاعة العضم الطويل.
          - **Trabecular (spongy)**: الـ vertebrae، الـ pelvis، وأطراف العضم الطويل.

          الـ ==osteoclasts== بتهد (resorption)، والـ ==osteoblasts== بتبني (formation). بيأثر عليهم:

          - **Mechanical stress**.
          - **Hormones**: estrogen، PTH، vitamin D.
          - **Cytokines**: IL-6، TNF-α، RANKL.
      - kind: aside
        tone: analogy
        page: 222
        quote: "Type I (Postmenopausal): Estrogen deficiency leads to increased osteoclast activity. Type II (Senile): Age-related decline in osteoblast function."
        text: "العضم بنك: الـ osteoclast بيسحب والـ osteoblast بيودّع. في **type I** (بعد سن اليأس) الـ estrogen راح فالسحّاب اتجنن وبقى يسحب كتير. في **type II** (senile) المودِع كبر وتعب وبقى يودّع قليل. الاتنين النتيجة واحدة: الرصيد بيقل."
      - kind: check
        page: 222
        quote: "Type II (Senile): Age-related decline in osteoblast function."
        question: "Senile (type II) osteoporosis is mainly due to:"
        options: ["Age-related decline in osteoblast function", "Estrogen deficiency raising osteoclast activity", "Glucocorticoids", "Hyperthyroidism"]
        answer: 0
        why:
          - "صح: المودِع (osteoblast) تعب."
          - "ده type I (postmenopausal)."
          - "ده secondary cause."
          - "ده secondary cause."
      - kind: explain
        page: 222
        quote: "Endocrine disorders (e.g., hyperthyroidism, Cushing's). Medications (e.g., glucocorticoids, heparin, anticonvulsants)."
        title: "الـ Secondary osteoporosis"
        text: |
          - **Endocrine**: hyperthyroidism، Cushing's.
          - **أدوية**: ==glucocorticoids==، heparin، anticonvulsants.
          - **Malabsorption**.
          - **أمراض مزمنة**: RA، CKD.
      - kind: sort
        page: 223
        quote: "Low body weight. Smoking. Excess alcohol intake. Sedentary lifestyle. Poor calcium/vitamin D intake."
        prompt: "الـ risk factor ده ينفع نغيّره ولا لأ؟"
        bins: ["Modifiable", "Non-modifiable"]
        cards:
          - { text: "Smoking", bin: 0 }
          - { text: "Low body weight", bin: 0 }
          - { text: "Excess alcohol", bin: 0 }
          - { text: "Sedentary lifestyle", bin: 0 }
          - { text: "Poor calcium or vitamin D", bin: 0 }
          - { text: "Advanced age", bin: 1 }
          - { text: "Female sex", bin: 1 }
          - { text: "Caucasian or Asian ethnicity", bin: 1 }
          - { text: "Family history of hip fracture", bin: 1 }
        why: "اللي في إيد المريض يغيّره: السجاير، الوزن، الكحول، الحركة، والكالسيوم والـ vitamin D. السن والجنس والعرق والعيلة ثابتين."
      - kind: try
        items: [rheum.L14.001, rheum.L14.004, rheum.L14.009, rheum.L14.010, rheum.L14.013]
    recap:
      - "Osteoporosis: bone mass أقل، microarchitecture بايظة، fragility أعلى."
      - "الكسور: vertebrae، proximal femur، distal forearm (Colles')."
      - "1 من 3 ستات و 1 من 5 رجالة فوق 50."
      - "Type I: estrogen أقل ← osteoclasts أكتر. Type II: osteoblasts أضعف."
      - "Secondary: endocrine، steroids/heparin/anticonvulsants، malabsorption، RA/CKD."
    practice: [rheum.L14.001, rheum.L14.002, rheum.L14.003, rheum.L14.004, rheum.L14.005, rheum.L14.006, rheum.L14.007, rheum.L14.008, rheum.L14.009, rheum.L14.010, rheum.L14.011, rheum.L14.012, rheum.L14.013, rheum.L14.053, rheum.L14.066, rheum.L14.067]
