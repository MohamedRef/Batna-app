  # ------------------------------------------------------------------
  - id: res.L04.lesson4
    title: "الـ cross-sectional: صورة في لحظة"
    hook: "مسح لأطفال قرية في يوم واحد: كام واحد عنده سوء تغذية، وإيه الفرق بينه وبين اللي كويس؟"
    minutes: 9
    pages: [43, 52]
    topics: [cross-sectional, designs]
    goals:
      - "تعرف إن الـ exposure والـ outcome بيتقاسوا في نفس الوقت"
      - "تحسب الـ prevalence من الـ 2×2 table"
      - "تعرف ليه الـ cross-sectional صعب يثبت سبب"
    status: unverified
    steps:
      - kind: explain
        page: 43
        quote: "Cross-sectional studies aim at describing and quantifying the distribution of disease, risk factors, or other characteristics in a defined population at one particular time.\nIn a cross-sectional study, the investigator measures the outcome and the exposures in the study participants at the same time.\nCross-sectional designs are used for population-based surveys and to assess the prevalence of diseases in clinic-based samples."
        title: "صورة فوتوغرافية"
        text: |
          الـ **cross-sectional** بيوصف ويقيس توزيع المرض أو الـ risk factors في population محددة ==at one particular time==.

          الباحث بيقيس الـ ==exposure والـ outcome في نفس الوقت==.

          بيستخدموه في الـ **population-based surveys**، وعلشان نعرف **prevalence** الأمراض في عينات العيادات.
      - kind: explain
        page: 44
        quote: "Cross-sectional studies form a bridge between simple descriptive studies (case reports and case series) and those that can test hypotheses (analytic and intervention studies).\nThey can suggest the presence of relationships."
        title: "الكوبري"
        text: |
          الـ cross-sectional ==bridge== بين الـ descriptive البسيط (case reports و series) والدراسات اللي بتختبر hypotheses (analytic و intervention).

          هو مش بيثبت، بس **can suggest the presence of relationships**.
      - kind: figure
        page: 45
        quote: "Cross-sectional Design: Study population, split into:\n  No Disease: factor present; factor absent\n  Disease: factor present; factor absent\nStudy only exists at this point in time"
        title: "الـ design في لحظة واحدة"
        alt: "A study population splits into disease and no disease, each split into factor present and factor absent, all measured on one vertical line labelled one point in time."
        caption: "كل حاجة بتتقاس **في نفس اللحظة**: عنده المرض ولا لأ، وعنده الـ factor ولا لأ. ومفيش سهم زمن."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R04c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="8" y="118" width="96" height="54" rx="8" class="fg-ink"/>
            <text x="56" y="141" text-anchor="middle" class="t-b">Study</text>
            <text x="56" y="159" text-anchor="middle" class="t-b">population</text>
            <path d="M104 132L134 82" class="fg-arrow" marker-end="url(#R04c)"/>
            <path d="M104 158L134 208" class="fg-arrow" marker-end="url(#R04c)"/>
            <rect x="136" y="56" width="80" height="44" rx="8" class="fg-bad"/>
            <text x="176" y="83" text-anchor="middle" class="t-b">Disease</text>
            <rect x="136" y="190" width="80" height="44" rx="8" class="fg-good"/>
            <text x="176" y="217" text-anchor="middle" class="t-b">No disease</text>
            <rect x="232" y="30" width="90" height="34" rx="6" class="fg-box"/>
            <text x="277" y="52" text-anchor="middle" class="t-sm">factor present</text>
            <rect x="232" y="92" width="90" height="34" rx="6" class="fg-box"/>
            <text x="277" y="114" text-anchor="middle" class="t-sm">factor absent</text>
            <rect x="232" y="164" width="90" height="34" rx="6" class="fg-box"/>
            <text x="277" y="186" text-anchor="middle" class="t-sm">factor present</text>
            <rect x="232" y="226" width="90" height="34" rx="6" class="fg-box"/>
            <text x="277" y="248" text-anchor="middle" class="t-sm">factor absent</text>
            <path d="M216 72L230 50" class="fg-arrow"/><path d="M216 84L230 106" class="fg-arrow"/>
            <path d="M216 206L230 182" class="fg-arrow"/><path d="M216 218L230 242" class="fg-arrow"/>
            <path d="M120 276L322 276" class="fg-thin"/>
            <text x="221" y="294" text-anchor="middle" class="t-sm t-mut">all measured at one point in time</text>
          </svg>
      - kind: explain
        page: 46
        quote: "Cross-sectional comparative studies: Many cross-sectional surveys focus on describing as well as comparing groups. For example, a survey on malnutrition may wish to establish:\n  The percentage of malnourished children in a certain population\n  Factors affecting the availability of food (socio economic, environmental, political)\n  Feeding practices\n  The knowledge, beliefs, opinions that influence feeding practices.\nThe researcher will not only describe these concepts but, by comparing malnourished and well-nourished children, he will try to determine which socio-economic, behavioral and other independent variables may have contributed to malnutrition."
        title: "Cross-sectional comparative"
        text: |
          كتير من المسوح بتوصف **وبتقارن**. مثال المحاضرة: مسح عن ==malnutrition==:

          - نسبة الأطفال اللي عندهم سوء تغذية.
          - العوامل اللي بتأثر على توافر الأكل (اقتصادية، بيئية، سياسية).
          - عادات التغذية، والمعرفة والمعتقدات اللي وراها.

          وبعدين يقارن ==malnourished vs well-nourished== علشان يعرف أنهي variables ممكن تكون ساهمت.
      - kind: table
        page: 47
        quote: "Interpreting results of cross-sectional studies: The findings can be presented in the 2x2 table (Contingency table or Table of association) as follows:\n| Exposure (Risk factor) | Disease (Malnutrition): Yes | Disease (Malnutrition): No | Total |\n|---|---|---|---|\n| Yes (Exposed) | a | b | a+b |\n| No (Non-exposed) | c | d | c+d |\n| Total | a+c | b+d | a+b+c+d |\nPrevalence of malnutrition = a+c / a+b+c+d x 100 (proportion of malnourished among the total surveyed)"
        title: "The 2×2 table: prevalence of malnutrition"
        columns: ["Exposure", "Disease: yes", "Disease: no", "Total"]
        rows:
          - ["Exposed", "a", "b", "a+b"]
          - ["Non-exposed", "c", "d", "c+d"]
          - ["Total", "a+c", "b+d", "a+b+c+d"]
        hide: [[2, 1], [2, 3]]
      - kind: explain
        page: 48
        quote: "Cross-Sectional Studies: Determining an Association\n  Compare the prevalence of disease in persons with the exposure, [a/(a+b)], with the prevalence of disease in persons without the exposure, [c/(c+d)]\n  Compare the prevalence of exposure in persons with the disease, [a/(a+c)], with the prevalence of exposure in persons without the disease, [b/(b+d)]\n| | Disease | No Disease | |\n|---|---|---|---|\n| Exposed | a | b | a+b |\n| Not Exposed | c | d | c+d |\n| | a+c | b+d | |\nTest of significance: Chi-squared test"
        title: "إزاي نطلع association؟"
        text: |
          الـ **prevalence** الكلية = ==(a + c) / (a + b + c + d) × 100==.

          وعلشان نشوف association، عندنا طريقتين:

          - **Prevalence of disease**: في الـ exposed **a/(a+b)** مقابل الـ unexposed **c/(c+d)**.
          - **Prevalence of exposure**: في العيانين **a/(a+c)** مقابل السليمين **b/(b+d)**.

          والـ test of significance هنا ==chi-squared test==.
      - kind: aside
        tone: tip
        page: 48
        quote: "Cross-Sectional Studies: Determining an Association\n  Compare the prevalence of disease in persons with the exposure, [a/(a+b)], with the prevalence of disease in persons without the exposure, [c/(c+d)]\n  Compare the prevalence of exposure in persons with the disease, [a/(a+c)], with the prevalence of exposure in persons without the disease, [b/(b+d)]\n| | Disease | No Disease | |\n|---|---|---|---|\n| Exposed | a | b | a+b |\n| Not Exposed | c | d | c+d |\n| | a+c | b+d | |\nTest of significance: Chi-squared test"
        text: |
          علشان ماتتلخبطش: **الصف = exposure**، **العمود = disease**.

          - «بين الـ exposed» = امشي **بالعرض** على الصف الأول: a/(a+b).
          - «بين العيانين» = انزل **بالطول** في العمود الأول: a/(a+c).
      - kind: case
        page: 48
        quote: "Cross-Sectional Studies: Determining an Association\n  Compare the prevalence of disease in persons with the exposure, [a/(a+b)], with the prevalence of disease in persons without the exposure, [c/(c+d)]\n  Compare the prevalence of exposure in persons with the disease, [a/(a+c)], with the prevalence of exposure in persons without the disease, [b/(b+d)]\n| | Disease | No Disease | |\n|---|---|---|---|\n| Exposed | a | b | a+b |\n| Not Exposed | c | d | c+d |\n| | a+c | b+d | |\nTest of significance: Chi-squared test"
        stem: "Survey of 400 children. No safe water (exposed): 60 with diarrhoea, 140 without. Safe water: 20 with diarrhoea, 180 without."
        steps:
          - question: "What is the overall prevalence of diarrhoea?"
            options: ["15%", "20%", "30%", "40%"]
            answer: 1
            why: "(a + c)/total = (60 + 20)/400 = 80/400 = **20%**."
          - question: "What is the prevalence of diarrhoea among the exposed?"
            options: ["10%", "30%", "75%", "60%"]
            answer: 1
            why: "a/(a+b) = 60/200 = **30%**. الـ 75% هي a/(a+c)، يعني نسبة الـ exposure بين العيانين."
          - question: "Which test of significance compares the two prevalences?"
            options: ["t-test", "Chi-squared test", "Correlation coefficient", "Odds ratio"]
            answer: 1
            why: "المحاضرة: test of significance = **chi-squared test**."
      - kind: sort
        page: 49
        quote: "Advantages and disadvantages of cross-sectional studies\n| Advantages | Disadvantages |\n|---|---|\n| Often use routinely collected readily available data | Usually cannot test the epidemiologic hypotheses |\n| Less expensive and time consuming as compared to analytic studies | Lacks external comparison group |\n| Assess prevalence of outcomes or exposures and pattern of disease occurrence | Since this is a one time measurement of exposure and outcome, it is difficult to derive causal relationships from cross-sectional analysis. |\n| Useful in the formulation of research hypotheses suggestive of risk factors | Not useful for rare events |\n| | May be subjected to selection bias due to refusal, death (survival bias) |"
        prompt: "ميزة ولا عيب للـ cross-sectional؟"
        bins: ["Advantage", "Disadvantage"]
        cards:
          - { text: "Routinely collected, readily available data", bin: 0 }
          - { text: "Cheaper and quicker than analytic studies", bin: 0 }
          - { text: "Assesses prevalence and disease patterns", bin: 0 }
          - { text: "Helps formulate hypotheses on risk factors", bin: 0 }
          - { text: "Usually cannot test hypotheses", bin: 1 }
          - { text: "Hard to derive causal relationships", bin: 1 }
          - { text: "Not useful for rare events", bin: 1 }
          - { text: "Selection bias from refusal or death", bin: 1 }
        why: "رخيص وسريع وبيدّي prevalence ويقترح hypotheses، بس مقاسة **مرة واحدة** فصعب يثبت سبب، ومش نافع للنادر، وفيه **survival bias** من الوفاة والرفض."
      - kind: reveal
        page: 49
        quote: "Advantages and disadvantages of cross-sectional studies\n| Advantages | Disadvantages |\n|---|---|\n| Often use routinely collected readily available data | Usually cannot test the epidemiologic hypotheses |\n| Less expensive and time consuming as compared to analytic studies | Lacks external comparison group |\n| Assess prevalence of outcomes or exposures and pattern of disease occurrence | Since this is a one time measurement of exposure and outcome, it is difficult to derive causal relationships from cross-sectional analysis. |\n| Useful in the formulation of research hypotheses suggestive of risk factors | Not useful for rare events |\n| | May be subjected to selection bias due to refusal, death (survival bias) |"
        prompt: "ليه الـ cross-sectional صعب يثبت إن الـ exposure سبب المرض؟"
        answer: |
          لأنه ==one time measurement==: الاتنين اتقاسوا في نفس اللحظة، فمش عارف مين جه الأول.

          ولاحظ إن ده بالظبط أهم criterion في الـ causation: الـ ==temporal relationship==. السبب لازم ييجي **قبل** النتيجة.
      - kind: check
        page: 52
        quote: "In establishing exposure-outcome 'causal association', what is the most essential criterion?\n  A. Consistency of relationship\n  B. Temporal relationship\n  C. Duration of relationship\n  D. Strength of relationship"
        question: "In establishing a causal association, the most essential criterion is:"
        options: ["Consistency of relationship", "Temporal relationship", "Duration of relationship", "Strength of relationship"]
        answer: 1
        why:
          - "الـ consistency بتدعم بس مش أساسية."
          - "صح: السبب لازم ييجي **قبل** النتيجة، ومن غيرها مفيش causation."
          - "الـ duration مش من الـ criteria الأساسية."
          - "علاقة قوية ممكن تكون confounded."
      - kind: check
        page: 51
        quote: "To assist with health resource allocation decisions, a research group set out to determine the burden of a particular disease in the population. Which type of study should be undertaken?\n  A. Randomized controlled trial\n  B. Ecological study\n  C. Cohort study\n  D. Cross-sectional study\n  E. Case–control study.\nAn advertisement in a medical journal stated that 2000 subjects with sore throat were treated with a new medicine. Within 4 days, 94% were asymptomatic. The advertisement claims that the medicine was effective. Based on the evidence given above, what is your decision about that claim?\n  A. Is correct\n  B. May be incorrect as the conclusion is not based on a rate\n  C. May be incorrect because of failure to recognize a long-term cohort effect\n  D. Incorrect because as no control or comparison group was involved"
        question: "An advert says 2000 sore-throat patients took a new drug and 94% were well within 4 days, so it works. Your view?"
        options:
          - "Correct"
          - "May be wrong: not based on a rate"
          - "May be wrong: long-term cohort effect"
          - "Wrong: there is no control or comparison group"
        answer: 3
        why:
          - "معظم التهابات الزور بتخف لوحدها في أيام."
          - "94% ده rate فعلًا."
          - "مفيش cohort هنا أصلًا."
          - "صح: من غير **comparison group** مانعرفش الدوا زوّد إيه على الطبيعي."
      - kind: try
        items: [res.L04.048, res.L04.051, res.L04.052, res.L04.054, res.L04.056]
    recap:
      - "Cross-sectional: exposure و outcome **في نفس الوقت**، في population محددة؛ بيقيس **prevalence**."
      - "**Bridge** بين الـ descriptive البسيط والـ analytic؛ بيقترح علاقات مش بيثبتها."
