- id: res.L14.011
  kind: enumerate
  topic: screening
  prompt: Enumerate Wilson and Jungner's classic screening criteria (1968).
  points:
  - The condition is an important health problem
  - There is an accepted treatment for patients with recognized disease
  - Facilities for diagnosis and treatment are available
  - There is a recognizable latent or early symptomatic stage
  - There is a suitable test or examination
  - The test is acceptable to the population
  - The natural history of the condition, from latent to declared disease, is adequately understood
  - There is an agreed policy on whom to treat as patients
  - The cost of case-finding is economically balanced against medical care as a whole
  - Case-finding is a continuing process, not a once-and-for-all project
  pass: 7
  hook: 'الـ 10 بتوع Wilson and Jungner = 4 للمرض + 3 للـ test + 3 للسيستم: المرض (important problem، accepted treatment،
    latent stage، natural history)، الـ test (suitable test، acceptable، cost balanced)، والسيستم (facilities، agreed policy
    on whom to treat، case-finding continuing).'
  src:
    page: 7
    quote: |-
      Criteria for the disease suitable for screening 1968
      Box 1. Wilson and Jungner classic screening criteria
      1. The condition sought should be an important health problem.
      2. There should be an accepted treatment for patients with recognized disease.
      3. Facilities for diagnosis and treatment should be available.
      4. There should be a recognizable latent or early symptomatic stage.
      5. There should be a suitable test or examination.
      6. The test should be acceptable to the population.
      7. The natural history of the condition, including development from latent to declared disease, should be adequately understood.
      8. There should be an agreed policy on whom to treat as patients.
      9. The cost of case-finding (including diagnosis and treatment of patients diagnosed) should be economically balanced in relation to possible expenditure on medical care as a whole.
      10. Case-finding should be a continuing process and not a "once and for all" project.
  status: unverified
  tags: [high-yield]
