      - kind: reveal
        page: 147
        quote: "Are they treated the same?Treatment differs and that is why getting the right diagnosis is important. In both cases, steroid injections (cortisone shots), anti-inflammatory medications and colchicine may be useful. For gout, medication that decreases uric acid synthesis and decrease the intake of diet rich in purine."
        prompt: "لو الاتنين بيتعالجوا بـ steroids و anti-inflammatories و colchicine، ليه يفرق التشخيص؟"
        answer: |
          الكتاب بيقول **Treatment differs and that is why getting the right diagnosis is important**.

          الـ attack نفسه علاجه قريب (steroid injections، anti-inflammatories، colchicine). الفرق في **بعد** الـ attack:
          - الـ **gout** بياخد دوا **يقلل تصنيع الـ uric acid** ويقلل الأكل الغني بالـ purines، وده بيمنع النوبات.
          - الـ **pseudogout** الأدوية دي مش هتعمله حاجة، لأن البلورة مش urate.

          يعني لو شخّصت pseudogout على إنه gout، هتدّي allopurinol وريجيم سنين على الفاضي، والعيان يفضل يولّع.
      - kind: explain
        page: 147
        title: "علاج الـ pseudogout"
        quote: "Chondrocalcinosis which produces no symptoms does not need any treatment."
        text: |
          - الاتنين: **steroid injections**، anti-inflammatories، **colchicine**. والـ gout يزيد عليهم urate-lowering و low-purine diet.
          - ==Chondrocalcinosis== من غير أعراض: **ما يتعالجش**.
          - الـ attack: ice، rest، painkillers، **سحب السائل**، steroid في المفصل أو أقراص.
          - **مفيش وقاية** من الـ calcium pyrophosphate (CPP) crystals، بس عالج السبب (**dehydration**، low **magnesium**)، وخلي الوزن طبيعي ومارس رياضة معتدلة.

          ليه الـ **chondrocalcinosis** من غير أعراض ما يتعالجش؟ التفسير المقبول (مش في الكتاب): ده كالسيوم شايفينه في الأشعة في الغضروف، ومفيش علاج بيشيله أصلًا، فمفيش حاجة تكسبها من العلاج غير الأعراض الجانبية.

          وليه الـ **dehydration** والـ **low magnesium**؟ الكتاب بيقول لو حاجة زي دي سببت النوبة، علاجها **may prevent further attacks**. والوزن الطبيعي والرياضة المعتدلة بيقللوا الضرر **like osteoarthritis**: يعني نفس منطق الحِمل على الغضروف.
      - kind: check
        page: 147
        quote: "Unlike gout, there is no treatment or diet that can prevent the formation of CPP crystals. If an underlying condition caused an episode of pseudogout (eg, lack of fluid (dehydration) or low magnesium levels), treating this may prevent further attacks."
        question: "Which may prevent further pseudogout attacks?"
        options:
          - "Correcting dehydration or low magnesium"
          - "A low-purine diet"
          - "Allopurinol"
          - "Stopping wine"
        answer: 0
        why:
