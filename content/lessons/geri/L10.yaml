        quote: "With newly diagnosed ILD, perform HRCT scanning of the chest; determine if findings indicate a pattern of:"
        title: "Guideline 2018 في رسمة"
        alt: "Algorithm. New ILD: take exposure and drug history and do serology to exclude known causes. Then HRCT. Definite UIP leads to treat as IPF with no BAL and no biopsy, and a strong recommendation against transbronchial biopsy. Probable UIP, indeterminate or alternate diagnosis leads to BAL and surgical lung biopsy. Both feed into a multidisciplinary discussion. Side note: no MMP-7."
        caption: "لو الـ HRCT قال definite UIP والأسباب اتنفت: عالج على طول. غير كده: BAL و surgical biopsy. وكله يتناقش في الـ MDD."
