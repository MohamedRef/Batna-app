  - id: hb.L18.lesson6
    title: "BCLC 0–A: نشيل، نحرق، ولا نزرع؟"
    hook: "ورم صغير = فرصة cure حقيقية. بس الاختيار بين المشرط والإبرة والـ transplant له قواعد."
    minutes: 10
    pages: [364, 369]
    topics: [early-treatment, locoregional]
    goals:
      - "تعرف مين ياخد resection وشروطها"
      - "تقارن RFA و MWA وتعرف ممنوع RFA فين"
      - "تحفظ Milan criteria والـ bridging"
      - "تعرف الـ second line للي مش candidate: TACE / TARE / PEI"
    status: unverified
    steps:
      - kind: table
        page: 367
        title: "BCLC 0–A: مين ياخد إيه"
        columns: ["Patient", "First line", "Also"]
        rows:
          - ["Resection candidate (good liver function)", "Resection or thermal ablation", "-"]
          - ["Not resectable, transplant candidate", "Liver transplantation", "Bridging: TACE or TARE and/or RFA"]
          - ["Not resectable, not a transplant candidate", "RFA", "2nd line: TACE or TARE or PEI"]
        hide: [[0, 1], [1, 1], [2, 1], [2, 2]]
      - kind: explain
        page: 364
        title: "الـ resection"
        text: |
          **Optimal curative treatment** لـ: **solitary HCC**، **مفيش vascular invasion**، **synthetic function normal**، و **مفيش portal hypertension**.

          - **AASLD:** **treatment of choice** للـ localized HCC **من غير cirrhosis**. وهي كمان **preferred** في **HBV-related HCC من غير cirrhosis**.
          - في الـ **cirrhosis** ممكن لو: tumour burden محدود، cirrhosis **well-compensated** من غير **clinically significant portal hypertension**، و **future liver remnant >40%**.
          - **BCLC criteria:** solitary confined to the liver، مفيش vascular invasion في الـ imaging، مفيش metastasis، و liver function كويسة **من غير portal hypertension**.
          - **5-year survival لحد 90%** في المختارين كويس.
          - أشهر مضاعفات: **postoperative hemorrhage** و **liver failure** (أكتر في الـ cirrhosis).
          - **Laparoscopic hepatectomy:** نقل دم أقل، إقامة أقصر، مضاعفات أقل.
      - kind: reveal
        page: 364
        prompt: "ليه الـ **portal hypertension** بالذات بتمنع الـ resection، حتى لو الـ bilirubin والـ albumin كويسين؟"
        answer: |
          الكتاب بيقول إن الـ resection في الكبد الـ cirrhotic فيها **risk of liver failure** بعدها، وإن **liver reserve** لازم تتأكد الأول.

          والـ portal hypertension علامة إن الكبد **متليّف جامد ومقاوم للدم**: لما تشيل جزء، الـ portal flow كله يتزنق في الجزء الباقي، فالضغط يعلى أكتر والجزء الصغير ده مش هيقدر يتجدد ويشيل الشغل، وتلاقي ascites و bleeding و failure. يعني الأرقام ممكن تبقى كويسة، بس **الاحتياطي** مش موجود.
      - kind: explain
        page: 365
        title: "الحرق: RFA و MWA"
        text: |
          **RFA** = **curative**، **alternative first-line** للـ **BCLC 0 و A**. بيولّد **حرارة** تعمل **coagulative necrosis**.

          - أحسن نتيجة في ورم **≤3 cm**.
          - **ممنوع** في: **liver dome**، جنب **major vessels**، جنب **biliary tree**، جنب أعضاء زي الـ **gallbladder** (خطر إصابتها).
          - meta-analysis: الـ 5-year survival والـ recurrence **زي الجراحة** في الـ very early HCC.
          - **Cochrane:** مفيش فرق في **all-cause mortality**. الـ **cancer-related mortality أقل مع الجراحة** (OR **0.35**)، بس **serious adverse events أعلى مع الجراحة** (OR **17.96**).

          **MWA** نوع تاني من الـ thermal ablation، و **أقل تأثرًا بالـ heat sink effect**. مفيش evidence قوي يفضّل واحد على التاني (meta-analyses مختلفة). والـ **laparoscopic MWA** local control أحسن، والـ **percutaneous** مضاعفات أقل.
      - kind: aside
        tone: analogy
        page: 366
        text: |
          **Heat sink effect:** تخيّل بتسخّن **حلّة** على النار وجنبها **حنفية مية ساقعة مفتوحة** على جنبها. المية الجارية بتسحب الحرارة، فالجنب ده عمره ما يسخن كويس.

          الوعاء الكبير اللي جنب الورم هو الحنفية دي: الدم بيسحب حرارة الـ **RFA** فالورم اللي جنبه مايتحرقش كله. الـ **MWA** أقوى في الحتة دي.
      - kind: check
        page: 365
        question: "A 2.5 cm HCC sits at the liver dome, just under the diaphragm. Why is RFA a poor choice here per the book?"
        options:
          - "RFA is contraindicated at specific sites like the dome because of injury risk"
          - "RFA only works for tumours over 5 cm"
          - "RFA is never curative"
          - "The dome lesion is too small for any ablation"
        answer: 0
        why:
          - "صح: الكتاب بيقول RFA contraindicated في الـ **liver dome** وجنب الأوعية الكبيرة والقنوات والـ gallbladder، بسبب خطر إصابة التراكيب دي."
          - "بالعكس، أحسن نتيجة في **≤3 cm**."
          - "الكتاب بيقول RFA **curative** و alternative first-line."
          - "2.5 cm في المدى المثالي (≤3 cm). المشكلة المكان مش الحجم."
      - kind: explain
        page: 367
        title: "الـ transplant و Milan"
        text: |
          الـ **liver transplantation** بتعالج **الـ cancer والـ liver disease** مع بعض. مناسبة للي عنده **high MELD** و HCC **within Milan**. وعلشان الانتظار الطويل بيخلّي ناس كتير تخرج من الأهلية، الـ **living donor** بديل بنتايج **comparable**.

          **Milan criteria:**
          - **Single ≤5 cm**، أو **2–3 lesions كلهم ≤3 cm**.
          - مفيش **gross vascular invasion**.
          - مفيش **regional nodes** ولا **distant metastasis**.
          - **Performance status ≤1**.

          **Extended (OPTN downstaging):** لو الورم اتصغّر بالـ locoregional لحد **جوه Milan** واتثبّت، مع **AFP <1000 ng/mL**، ممكن ياخد MELD exception points وأولوية.

          **Bridging:** **TACE أو TARE و/أو RFA** وهو مستني، علشان مايكبرش، **خصوصًا لو الانتظار أكتر من 3–6 شهور**.
      - kind: figure
        page: 368
        title: "Milan في صورة"
        alt: "Two panels. Inside Milan: one tumour up to 5 cm, or two to three tumours each up to 3 cm, with no gross vascular invasion, no nodes or distant metastases, and performance status 1 or less. Outside Milan examples: one tumour of 6 cm; four small tumours; three tumours where one is 4 cm."
