          </svg>
      - kind: mnemonic
        page: 195
        word: "SWAG POV"
        parts:
          - { key: "S", text: "Smoking: higher risk of alcoholic cirrhosis" }
          - { key: "W", text: "Women are more susceptible" }
          - { key: "A", text: "Age: older adults (65 and up) are more vulnerable" }
          - { key: "G", text: "Genetics: family history of liver disease" }
          - { key: "P", text: "Pattern of consumption and beverage type (amount and years)" }
          - { key: "O", text: "Obesity: high BMI adds to the damage" }
          - { key: "V", text: "Viral infections: HCV and HBV speed fibrosis, cirrhosis and HCC" }
        hook: |
          من الـ **POV** بتاع الكبد، الكحول ملوش أي **SWAG**. 😎 السبع حروف هما الـ **modifiers of ALD risk** اللي في الكتاب.
      - kind: reveal
        page: 195
        prompt: "ليه الستات أكثر عرضة بنفس الكمية؟"
        answer: |
          الكتاب بيقول women are more susceptible من غير ما يشرح. التفسير المقبول:

          - body water أقل، فنفس الكمية بتعمل تركيز أعلى في الدم.
          - **gastric alcohol dehydrogenase** أقل، فالمعدة بتكسّر كحول أقل قبل ما يوصل الكبد.

          النتيجة: كبد الست بيشوف كحول أكتر من نفس الكاس. علشان كده الحد عندها ==20-40 g== مش 40-80.
      - kind: check
        page: 195
        question: "By the book's predictor, which drinker is at risk of alcoholic steatohepatitis, fibrosis and cirrhosis?"
        options:
          - "A woman drinking 30 g/day for 11 years"
          - "A man drinking 30 g/day for 12 years"
          - "A woman drinking 30 g/day for 3 years"
          - "A man drinking 60 g/day for 2 years"
        answer: 0
        why:
          - "صح: الست في الـ range (**20-40 g**) وللمدة (10-12 سنة)."
          - "30 g أقل من حد الرجالة (**40-80 g**)."
          - "الكمية مظبوطة بس المدة قصيرة؛ المطلوب 10-12 سنة."
          - "الكمية في الـ range بس سنتين بس، مش 10-12."
      - kind: aside
        tone: joke
        page: 196
        text: |
          المريض: «أنا بشرب في المناسبات بس يا دكتور».
          انت: «طب عندك كام مناسبة في الأسبوع؟»
          المريض: «...كل يوم فيه مناسبة».

          علشان كده الكتاب بيتكلم عن **Pattern of Consumption**، مش بس «بتشرب ولا لأ». 😄
      - kind: explain
        page: 196
        title: "العلاج: أربع خطوط"
        text: |
          - ==Abstinence==: أهم علاج. مش بس بيخلّص الـ alcoholic steatosis، كمان بيحسّن الـ survival في الـ cirrhotic patients.
          - ==Corticosteroids==: أكتر علاج اتستخدم، خصوصًا في moderate to severe alcoholic hepatitis.
          - **Zinc supplementation**: liver function اتحسنت في مرضى ALD و HCV بـ 50 mg elemental zinc.
          - **Liver transplantation**: الـ standard of care لـ end-stage liver disease.

          ليه الـ steroids؟ لأن الـ alcoholic hepatitis التهاب مناعي بالأساس. الـ steroids بتعمل suppress للـ immune response وللـ proinflammatory cytokine response، فالحريقة تهدى.

          وليه الـ abstinence أولهم؟ لأن كل العلاجات التانية بتطفي، والـ abstinence بس هو اللي بيقفل مصدر النار. من غيره، حتى الكبد المزروع ممكن يتأذي تاني.
      - kind: update
        page: 196
        text: |
          الـ guidelines بتحدد الـ steroids لـ **severe** alcoholic hepatitis بس:

          - الجرعة: prednisolone 40 mg لمدة 28 يوم.
          - Severe يعني مثلًا Maddrey 32 أو أكتر، أو MELD فوق 20.
          - بتتوقف لو **Lille score** يوم 7 قال no response.

          **في الامتحان: «moderate to severe» زي الكتاب.**
        ref: "EASL ALD guidelines 2018; AASLD ALD guidance 2019"
      - kind: match
        page: 196
        prompt: "وصّل كل علاج باللي الكتاب قاله عنه:"
        pairs:
          - ["Abstinence", "Resolves steatosis and improves survival in cirrhosis"]
          - ["Corticosteroids", "Moderate to severe alcoholic hepatitis"]
          - ["Zinc 50 mg elemental", "Improved liver function in ALD and HCV"]
          - ["Liver transplantation", "Standard of care in end-stage liver disease"]
        why: "الـ abstinence هو الوحيد اللي الكتاب قال إنه بيحسّن الـ survival في الـ cirrhosis؛ الباقيين ليهم مكان محدد."
      - kind: aside
        tone: exam
        page: 195
        text: |
          سؤال المحاضرة: **«Discuss the most significant risk factor for the progression from steatosis to alcoholic hepatitis»**.

          رتّب إجابتك كده:

          - ابدأ بالكمية والمدة: 40-80 g للرجالة و 20-40 g للستات لمدة 10-12 سنة، و pattern of consumption.
          - بعدين ليه الـ steatosis مش benign: lipid peroxidation و oxidative damage.
          - واختم بباقي ==SWAG POV==.
      - kind: try
        items: [hb.L12.001, hb.L12.006, hb.L12.007, hb.L12.011, hb.L12.069]
    recap:
