      - kind: figure
        page: 51
        title: "الرباط بيشتغل إزاي؟ رسمة الكتاب"
        image: { file: hb/L03-band-ligation-drawing.webp, book: true }
        alt: "Book drawings of band ligation. Left, four panels a to d: (a) the endoscope cap with loaded bands sucks the varix in; (b) a band is released around its base; (c) the banded varix becomes a ball-like polyp; (d) the strangled varix sloughs off and falls away. Right: a close-up of a red varix pulled into a loop with a band around its base."
        caption: |
          **شمال: أربع خطوات من a لـ d**:

          - **a**: الـ cap اللي على طرف المنظار (عليه الأساتك) بيشفط الدالية جوّاه.
          - **b**: الأستك بيتساب حوالين قاعدة الدالية.
          - **c**: الدالية بقت كورة مخنوقة (polyp).
          - **d**: بعد أيام الكورة بتقع، والأستك معاها.

          **يمين**: تكبير لوريد أحمر اتشد على شكل حلقة والأستك (الخط الأزرق) حوالين قاعدته.

          الرسمة بتوضّح ليه الرباط ==ميكانيكي==: بيخنق الدالية ويقطع الدم عنها، من غير مادة كيميائية بتحرق الجدار زي الـ sclerotherapy.
      - kind: figure
        page: 51
        title: "قبل الرباط وبعده بأسبوع: صور الكتاب"
        image: { file: hb/L03-band-ligation-before-after.webp, book: true }
        marks:
          - { at: [0.34, 0.47], label: "Red wale spot" }
          - { at: [0.77, 0.52], size: [0.42, 0.86], label: "Seven days post banding: ulceration at the band site", kind: box }
        alt: "Two book endoscopy photos. Left, labelled in the book 'Gastroscopy image of esophageal varices with prominent red wale spots': bluish varices with a small red mark. Right, labelled 'Esophageal varices seven days post banding, showing ulceration at the site of banding': pale mucosa around a dark ulcer at the banding site."
        caption: |
          صورتين منظار، وتحت كل واحدة في الكتاب سطر بيقول هي إيه:

          - **الشمال** ("Gastroscopy image of esophageal varices with prominent red wale spots"): دوالي مزرقة وعليها علامة حمرا صغيرة (1): الـ ==red wale spots==، يعني الجدار رفيع ومحتاج رباط.
          - **اليمين** ("Esophageal varices seven days post banding, showing ulceration at the site of banding"): بعد أسبوع (2)، في مكان الأستك ==ulcer== غامق وحواليه mucosa باهتة.

          الصورتين بيكمّلوا الرسمة اللي فوق: الدالية اتخنقت ووقعت وسابت قرحة صغيرة في مكانها بالظبط. ودي القرحة المحدودة اللي الدرس بيقارنها بقرح الـ sclerotherapy المنتشرة.
      - kind: figure
        page: 51
        quote: "Endoscopy shows two varices in the distal esophagus that have been banded. The bands are indicated with the green arrows. The two strings in the right of the field control the trigger device used to deploy the bands."
        title: "دواليتين متربطين: صورة الكتاب"
        image: { file: hb/L03-band-ligation-done.webp, book: true }
        marks:
          - { at: [0.80, 0.27], label: "Trigger strings", kind: arrow }
        alt: "Book endoscopy photo through the clear ligation cap: two varices in the distal oesophagus that have been banded, each marked with a small green arrow; two white strings cross the field on the right."
        caption: |
          الصورة من جوه الـ cap الشفاف اللي على طرف المنظار (الدايرة اللي حوالين الصورة):

          - **في النص**: دواليتين اتربطوا، وكل واحدة عليها ==سهم أخضر== صغير بيشاور على الأستك.
          - **(1)**: الخيطين الأبيض اللي معدّيين في الصورة هما اللي بيشغّلوا الـ trigger اللي بيطلق الأساتك.

          ده نفس اللي في الرسمة **b** و **c** فوق، بس في مريض حقيقي.
      - kind: explain
        remind: [hb.L03.063]
        page: 52
        quote: "Endoscopic Variceal Band Ligation: Should be performed in the 1st 12 hours, (preferably 1st 6 hrs), after stabilizing the patient"
        title: "الـ band ligation بالأرقام"
        text: |
          ==Timing==: في أول 12 ساعة (ويفضّل أول 6) بعد ما المريض يستقر. الاستقرار الأول، لأن المنظار في مريض في shock خطر.

          **النتايج**
          - Bleeding controlled in 90%.
          - Rebleeding rate 15–20%.

          مقارنة بالـ sclerotherapy، الـ banding فيه:
          - Less rebleeding
          - Lower mortality
          - Fewer complications
          - Fewer treatment sessions

          ليه؟ الـ sclerotherapy مادة كيميائية بتحرق الجدار، فبعدها ulcers و erosions و adhesions شائعين جدًا (صفحة 50). الـ banding أستك ميكانيكي بيخنق الدالية بس.

          وحتى الـ banding له ثمن: بعده بأسبوع بيحصل ulceration at the site of banding، لما الدالية المخنوقة تقع.
