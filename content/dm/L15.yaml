  # ---------- p193-194: complications ----------
  - id: dm.L15.051
    kind: card
    topic: complications
    front: How common is hypoglycemia during DKA treatment, and how is it prevented?
    back: Glucose <70 occurs in 16-28% and <40 in 2%; <40 carries a 4.8-fold mortality. Prevent with glucose checks every 1-2 h and, below 250 mg/dL, insulin 0.05 units/kg/h plus 5-10% dextrose.
    src: { page: 193, quote: "When glucose levels are reduced to <250 mg/dL, it is advised to reduce the insulin infusion rate to 0.05 units/kg/h" }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.052
    kind: cloze
    topic: complications
    text: Hypokalemia (<3.5 mmol/L) occurs in about {{c1::55%}} of DKA and 51% of HHS; severe hypokalemia ≤2.5 raises inpatient mortality, so K is checked every {{c2::4 h}} and added to the fluids.
    src: { page: 193, quote: "Potassium should be carefully monitored every 4 h during treatment." }
    status: unverified
    tags: [numbers]
  - id: dm.L15.053
    kind: card
    topic: complications
    front: What causes hyperchloremic non-anion gap acidosis in the recovery phase of DKA?
    back: Loss of ketoanions (which would have been metabolized to bicarbonate) and excess chloride-containing fluids. It is self-limited.
    src: { page: 193, quote: "This may be caused by loss of ketoanions, which are metabolized to bicarbonate during the evolution of DKA" }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.054
    kind: card
    topic: complications
    front: How can hyperchloremic acidosis during DKA treatment be made less frequent?
    back: Balanced electrolyte solutions and slower saline infusion.
    src: { page: 193, quote: "and excess infusion of chloride containing fluids during treatment." }
    status: unverified
  - id: dm.L15.055
    kind: card
    topic: complications
    front: How does cerebral edema present during DKA treatment?
    back: "Mainly in children: headache, falling consciousness, seizures, sphincter incontinence, pupillary changes, papilledema, bradycardia, rising BP and respiratory arrest."
    src: { page: 194, quote: "During treatment, esp in children, presented by onset of headache, gradual deterioration in level of consciousness, seizures" }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.056
    kind: enumerate
    topic: complications
    prompt: Enumerate the proposed mechanisms of cerebral edema in DKA.
    points:
      - Cerebral ischemia or hypoxia
      - Inflammatory mediators
      - Increased cerebral blood flow
      - Disrupted cell-membrane ion transport
      - Rapid extracellular-to-intracellular fluid shift from fast correction of osmolality and dehydration
    pass: 4
    src: { page: 194, quote: "Rapid fluid shift from extracellular to intracellular by rapid correction of osmolality and dehydration." }
    status: unverified
  - id: dm.L15.057
    kind: enumerate
    topic: complications
    prompt: Enumerate the prevention and treatment of cerebral edema in DKA.
    points:
      - Avoid excessive hydration
      - Avoid rapid reduction of plasma osmolarity
      - Lower glucose gradually
      - Keep glucose 200-300 mg/dL until osmolality and mental status normalize
      - Mannitol infusion to keep osmolality raised
    pass: 4
    src: { page: 194, quote: "Maintenance of serum glucose between 200–300 mg/dl until the patient‘s serum osmolality is normalized" }
    status: unverified
  - id: dm.L15.058
    kind: cloze
    topic: complications
    text: Cerebral edema is rare in adults (<{{c1::0.1%}} of events) but carries a mortality of about {{c2::30%}}.
    src: { page: 194, quote: "Cerebral edema is rare in adults." }
    status: unverified
    tags: [numbers]
  - id: dm.L15.059
    kind: mcq
    topic: complications
    stem: A 9-year-old treated for severe DKA is improving at 6 hours, then develops headache, bradycardia, rising BP and falling GCS. Best immediate step?
    options: [Mannitol 1 g/kg IV over 30 min, Bolus of 0.9% saline 20 mL/kg, Increase the insulin infusion, Give sodium bicarbonate, Stop all fluids and wait for CT]
    answer: 0
    why:
      - Acute coma in a previously alert patient suggests brain edema; mannitol is the treatment.
      - Excess hydration worsens cerebral edema.
      - A faster glucose fall lowers osmolality further.
      - Bicarbonate can itself cause cerebral edema.
      - Treatment should not wait for imaging.
    src: { page: 192, quote: "If coma develops acutely in a previously alert patient, suspect brain edema" }
    status: unverified
    tags: [high-yield]
  - id: dm.L15.060
    kind: mcq
    topic: complications
    stem: On day 2 of DKA treatment with large volumes of 0.9% saline, a patient has pH 7.31, bicarbonate 17, chloride 114 and anion gap 10. Ketones are cleared. Interpretation?
    options: [Self-limited hyperchloremic non-anion gap acidosis, Recurrent DKA, Lactic acidosis, Need for bicarbonate, Renal tubular acidosis needing workup]
    answer: 0
    why:
      - Loss of ketoanions and chloride-rich fluid cause a normal-gap acidosis in recovery; it is self-limited.
      - Ketones are cleared and the gap is normal.
      - Lactic acidosis raises the anion gap.
      - It has few clinical consequences; bicarbonate is not indicated.
      - This is expected in recovery, not RTA.
    src: { page: 193, quote: "Recovery phase of DKA, is self-limited." }
    status: unverified
  # ---------- cases ----------
  - id: dm.L15.061
    kind: case
    topic: fluids
    stem: A 24-year-old with T1DM has vomited for 2 days after missing insulin. HR 124, BP 92/58 supine. Glucose 520 mg/dL, pH 6.95, bicarbonate 7, BOHB 7.1 mmol/L, Na 130, K 5.6.
    steps:
      - question: Severity and place of care?
        options: [Severe DKA; ICU, Moderate DKA; step-down unit, Mild DKA; ward, HHS; ICU]
        answer: 0
        why: pH <7.0, bicarbonate <10 and BOHB >6 mean severe DKA, managed in ICU.
      - question: What does his supine hypotension suggest about the deficit?
        options: [More than 20% of ECV (over 4 L), About 10% (2 L), 15-20% (3-4 L), No deficit]
        answer: 0
        why: Supine hypotension means a >20% fall in ECV, more than 4 liters.
      - question: What is his corrected sodium?
        options: [About 137, About 130, About 146, About 125]
        answer: 0
        why: 130 + 1.6 × (520 − 100)/100 = 130 + 6.7 ≈ 137.
      - question: Potassium plan with K 5.6?
        options: [Start insulin; give no K; check K every 2 h, Give K 20 mmol/h now, Delay insulin until K is 4, Give bicarbonate to lower K]
        answer: 0
        why: With K >5.0, start insulin without K and recheck every 2 h.
      - reveal: At 7 hours glucose is 230 mg/dL; pH 7.18.
        question: Next?
        options: [Reduce insulin to 0.05 units/kg/h and add 5-10% dextrose, Stop insulin, Keep the same rate without dextrose, Switch to s.c. insulin now]
        answer: 0
        why: Glucose corrects faster than acidosis; add dextrose and continue insulin until ketonemia clears.
    src: { page: 190, quote: "Supine hypotension indicates a decrease of > 20% in ECV (i.e. > 4 liters)" }
    status: unverified
  - id: dm.L15.062
    kind: case
    topic: diagnosis
    stem: An 81-year-old woman with T2DM on gliclazide is found confused after a week of a cough and poor intake.
    steps:
      - reveal: "Glucose 960 mg/dL, Na 150, urea 18 mmol/L, BOHB 0.8 mmol/L, pH 7.36, bicarbonate 22."
        question: Diagnosis?
        options: [HHS, DKA, Euglycemic DKA, Lactic acidosis]
        answer: 0
        why: Glucose ≥600, high osmolality, no significant ketonemia or acidosis.
      - question: Which precipitants does the lecture link to HHS here?
        options: [Infection and restricted water intake from blunted thirst, Insulin omission in T1DM, SGLT2 inhibitor, Pregnancy]
        answer: 0
        why: Infection is the most common precipitant; elderly patients have an altered thirst response.
      - question: Which insulin infusion rate starts HHS treatment (algorithm)?
        options: [0.05 units/kg/h, 0.1 units/kg/h after a bolus, 0.2 units/kg every 2 h s.c., No insulin]
        answer: 0
        why: HHS starts at 0.05 units/kg/h fixed-rate IV insulin.
      - question: Which prophylaxis should she receive for the whole admission?
        options: [LMWH, Aspirin, Warfarin, None]
        answer: 0
        why: VTE risk is higher in HHS than DKA; LMWH unless contraindicated.
      - question: When has HHS resolved?
        options: ["Glucose <250, osmolality <300, urine >0.5 mL/kg/h", "Glucose <200 and anion gap ≤12", pH >7.3 only, Glucose <150]
        answer: 0
        why: These are the book's HHS resolution criteria.
    src: { page: 192, quote: "RBG < 250 mg/dl  Serum osmolality <300 mOsm/kg  urine output is >0.5 mL/kg/h." }
    status: unverified
  - id: dm.L15.063
    kind: case
    topic: resolution
    stem: A 30-year-old with DKA (now on day 2) has glucose 180 mg/dL, bicarbonate 17, venous pH 7.34 and anion gap 11. He is eating breakfast. He weighs 70 kg and has no CKD.
    steps:
      - question: Has DKA resolved by the book's criteria?
        options: [Yes, No, Only if BOHB is checked, Only if pH >7.4]
        answer: 0
        why: Glucose <200 plus two (actually all three) of bicarbonate ≥15, pH >7.3, AG ≤12.
      - question: Weight-based subcutaneous TDD?
        options: [35-42 units (0.5-0.6 units/kg), 21 units (0.3 units/kg), 70 units (1 unit/kg), 10 units]
        answer: 0
        why: 0.5-0.6 units/kg/day; 0.3 is for those at hypoglycemia risk.
      - question: How is it split?
        options: [40-60% basal and the rest as three mealtime rapid-acting doses, All basal, All prandial, Premixed twice daily only]
        answer: 0
        why: Basal 40-60% and the remainder as mealtime rapid-acting insulin.
      - question: When do you stop the IV insulin?
        options: [1-2 h after the first s.c. dose, Immediately before the s.c. dose, 6 h after, Before breakfast without s.c. insulin]
        answer: 0
        why: Start s.c. insulin 1-2 h before stopping the infusion to avoid rebound ketoacidosis.
    src: { page: 192, quote: "RBG< 200 mg/dl and two of the following criteria" }
    status: unverified
