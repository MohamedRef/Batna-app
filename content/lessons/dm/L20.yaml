      - kind: table
        page: 256
        quote: "Effects of Lipid-Modifying Drugs on HDL-C Levels\n|  |  |\n|---|---|\n| Niacin | ↑ 15–35% |\n| Fibrates | ↑ 10–15% |\n| Statins | ↑ 5–10% |"
        title: "الأدوية بتعلّي الـ HDL-C قد إيه؟"
        columns: [Drug, HDL-C rise]
        rows:
          - ["Niacin", "15-35%"]
          - ["Fibrates", "10-15%"]
          - ["Statins", "5-10%"]
        hide: [[0, 1], [1, 1], [2, 1]]
