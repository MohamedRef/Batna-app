      - kind: explain
        page: 140
        title: "الـ serum biomarkers القديمة"
        text: |
          جدول صفحة 140 بيدي لكل marker ميزة وعيب:

          - ==ALT==: highly specific to liver، وليه prognostic value (==Hy's law==). عيبه: damage has already occurred.
          - **AST**: modified Hy's law (nR). مش liver-specific، والضرر برضه حصل خلاص.
          - **ALP**: بيعكس الـ cholestatic phenotype. مش liver-specific (bone، salivary glands، intestine، biliary).
          - **INR**: impairment of hepatic function. بيتلخبط مع vitamin K deficiency و anticoagulants.
          - **Bilirubin**: prognostic (Hy's law)، بس nothing specific.
          - **Albumin**: يقل مع malnutrition، nephrotic syndrome، cirrhosis من أي سبب.

          المشكلة المشتركة: كلهم بيطلعوا بعد ما الضرر حصل، أو مش خاصين بالكبد. وده اللي خلّى الناس تدوّر على markers أذكى.
      - kind: update
        page: 140
        text: "الكتاب بيذكر **Hy's law** كـ prognostic value للـ ALT والـ bilirubin من غير ما يعرّفه. تعريفه في الـ EASL: **hepatocellular injury (ALT > 3× ULN) + jaundice (bilirubin > 2× ULN)** من غير سبب تاني، وده بيتوقع حوالي **10%** mortality أو transplant."
        ref: "EASL Clinical Practice Guidelines: Drug-induced liver injury 2019"
