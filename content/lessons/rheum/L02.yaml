  - id: rheum.L02.lesson5
    title: "طفّي النار: علاج النوبة الحادة"
    hook: "تلات طفايات في الدولاب: NSAID و colchicine و steroid. اختار على حسب المريض، مش على حسب المزاج."
    minutes: 10
    pages: [38, 41]
    topics: [acute-tx, ult]
    goals:
      - "تعرف التلات أهداف للعلاج"
      - "تختار الـ first-line المناسب لكل مريض، وتعرف ليه"
      - "تعرف الـ IL-1 inhibitors ومكانها"
    status: unverified
    steps:
      - kind: order
        page: 38
        quote: "I. Terminate the acute flare as rapidly as possible. II. Protect against further flares."
        prompt: "رتّب أهداف علاج الـ gout:"
        steps:
          - "Terminate the acute flare fast"
          - "Protect against further flares"
          - "Treat hyperuricaemia, deplete the urate pool"
        why: "الأول طفّي النار، بعدين امنع نار جديدة، وفي الآخر شيل البنزين (الـ urate pool)."
      - kind: explain
        page: 39
        quote: "ACR Gout Guidelines 2020: Allopurinol Is First-line Therapy!"
        title: "خطين منفصلين: النار والبنزين"
        text: |
          الكتاب بيحط عنوان الـ ACR 2020 قبل علاج النوبة: ==allopurinol is first-line therapy==، ده للـ **ULT** (تنزيل الـ urate على المدى الطويل)، مش للنوبة.

          ليه لازم تفصل الاتنين في دماغك؟
          - **علاج النوبة** (NSAID، colchicine، steroid) بيطفي **الالتهاب**، ومالوش أي تأثير على الـ urate (صفحة 45).
          - **الـ ULT** بيشيل **البلورات** نفسها على شهور، بس مش بيطفي نوبة شغالة.

          عشان كده في سؤال الكتاب التاني، allopurinol و febuxostat غلط كعلاج لنوبة حادة، حتى لو المريض محتاجهم بعدين.
      - kind: figure
        page: 39
        title: "الـ ULT بين 2012 و 2020"
        image: { file: rheum/L02-acr-ult.webp, book: true }
        alt: "Two flowcharts side by side under the heading Gout ULT treatment. Left, 2012: allopurinol or febuxostat first, then probenecid, then pegloticase, with a serum urate target under 6 mg/dL. Right, 2020: allopurinol first, boxed in red with febuxostat below it, then probenecid, then pegloticase, ending in a serum urate target under 6 mg/dL with a treat-to-target strategy. Small notes beside each box give the recommendation."
        caption: |
          رسمة الكتاب في صفحة 39 تحت عنوان **ACR Gout Guidelines 2020: Allopurinol Is First-line Therapy!**، سلّمين جنب بعض:

          - **شمال (2012)**: **allopurinol أو febuxostat** في الأول بنفس الدرجة، وبعدهم probenecid، وبعدهم pegloticase، والهدف serum urate تحت 6 mg/dL (وممكن 5).
          - **يمين (2020)**: **allopurinol لوحده في الأول** (جوه المربع الأحمر)، strongly recommended حتى في الـ CKD stage 3 أو أكتر، بجرعة صغيرة وتتعلّى. وتحته **febuxostat** وجنبه تحذير الـ FDA عن الخطر على القلب. وبعدهم probenecid، و pegloticase ==strongly recommended against== كـ first-line.
          - **تحت خالص في الاتنين**: الشكل الأصفر = **serum urate target < 6 mg/dL**، و 2020 بتقول ==treat-to-target== بتعلية الجرعة.

          يعني الفرق الأساسي إن الـ allopurinol بقى الأول لوحده، والـ febuxostat نزل خطوة بسبب القلب.
      - kind: explain
        page: 39
        quote: "Select any one of first line therapy according to patient preference, associated comorbidities, renal function, tolerance and adverse effect profile.\n  NSAIDS.\n  Corticosteroids.\n  Colchicine."
        title: "التلات first-line"
        text: |
          النوبة غالبًا self-limited، والهدف نقلل **الشدة والمدة**. اختار **واحد** من:

          - ==Non-steroidal anti-inflammatory drugs (NSAIDs)==
          - ==Colchicine==
          - ==Corticosteroids==

          على حسب: رغبة المريض، الـ comorbidities، الـ **renal function**، والـ side effects. والقاعدة: **كل ما بدري كل ما أحسن**، ومفيش واحد فيهم بيأثر على الـ urate.

          التفسير المقبول (مش في الكتاب): ليه واحد بس؟ عشان التلاتة بيطفوا نفس الالتهاب من أماكن مختلفة، وكل واحد له عيوب: الـ NSAIDs على الكلى والمعدة، والـ colchicine على الأمعاء، والـ steroids على السكر والضغط. يعني اختيارك بيتحدد بالـ comorbidity اللي عند المريض، مش بالدوا الأقوى. ومفيش منهم بيأثر على الـ urate، فالنوبة تخلص بس السبب لسه موجود.
      - kind: explain
        page: 40
        quote: "NSAID should be commenced on its maximum dose, rather than titrating upwards from the lower end of the dose range."
        title: "NSAIDs"
        text: |
          - أشهر علاج في الـ general practice.
          - ابدأ ==بأعلى جرعة== (maximum dose) على طول، ماتطلعش بالتدريج.
          - **Indomethacin مش أحسن** من غيره: الـ quick-acting NSAIDs كلهم زي بعض.
          - **COX-2**: نفس الفعالية، gastrointestinal (GI) events أقل.

          والكتاب بيقول COX-2 ليها نفس الفعالية مع GI events أقل، يعني تنفع للي عنده تاريخ قرحة. التفسير المقبول (مش في الكتاب): ليه indomethacin مش أحسن؟ عشان كل الـ NSAIDs بتقفل نفس الإنزيم، فالفرق في الجرعة والسرعة مش في الاسم، والمهم إنك تبدأ بدري وبالجرعة الكاملة.
      - kind: reveal
        page: 40
        quote: "NSAID should be commenced on its maximum dose, rather than titrating upwards from the lower end of the dose range."
        prompt: "ليه نبدأ الـ NSAID بأعلى جرعة على طول؟"
        answer: |
          التفسير المقبول (مش في الكتاب): النوبة بتوصل لذروتها في **2-6 ساعات** (صفحة 32)، والالتهاب دايرة بتكبر نفسها. لو بدأت بجرعة صغيرة وزوّدت بالتدريج، الدايرة هتكون سبقتك. الأحسن تضربها جامد بدري، وبعدين تنزّل.

          وبنفس المنطق الكتاب بيقول في صفحة 45: **drugs work better when given early**.
      - kind: figure
        page: 40
        quote: "Colchicine\nMain effects of colchicine:\n  Binds to tubulin in cells (affecting cell division)\n  Inhibits function of leukocytes\n  Inhibits chemotactic factors\n  Inhibits inflammasome and IL-1 production\n  Inhibits release of histamine from mast cells\nOral administration → Liver (enterohepatic recycling):\n  10-20% renal excretion\n  80-90% faecal excretion"
        title: "الـ colchicine بيعمل إيه؟"
        image: { file: rheum/L02-colchicine.webp, book: true }
        alt: "Drawing of a human figure in profile. A box at the top left lists the main effects of colchicine: binds to tubulin in cells (affecting cell division), inhibits function of leukocytes, inhibits chemotactic factors, inhibits inflammasome and IL-1 production, inhibits release of histamine from mast cells. Arrows show oral administration through the mouth to the gut, the liver with enterohepatic recycling, white cells on the left exchanging with the liver, and two exits: the kidney with 10 to 20 percent renal excretion and the gut with 80 to 90 percent faecal excretion."
        caption: |
          رسمة الكتاب في صفحة 40:

          - **المربع فوق شمال، main effects of colchicine**: بيمسك الـ **tubulin** (فبيأثر على انقسام الخلايا)، بيقفل شغل الـ leukocytes، بيقفل الـ chemotactic factors، بيقفل الـ ==inflammasome and IL-1 production==، وبيقفل طلوع الـ histamine من الـ mast cells.
          - **الخلايا الزرقا شمال**: الـ leukocytes اللي الدوا بيوصلها من الكبد.
          - **يمين**: الدوا بيتاخد بالبُق (oral administration) وبينزل للأمعاء.
          - **في النص**: الكبد والسهم اللي لافف = ==enterohepatic recycling==، الدوا بيرجع للأمعاء ويتمص تاني.
          - **تحت**: الخروج: **10-20%** من الكلى (شمال)، و **80-90%** في البراز (يمين).
      - kind: explain
        page: 40
        quote: "Main effects of colchicine: Binds to tubulin in cells (affecting cell division); Inhibits function of leukocytes; Inhibits inflammasome and IL-1 production"
        title: "اقرا رسمة الـ colchicine"
        text: |
          كل سهم في الرسمة بيفسّر حاجة في العلاج:

          - **بيمسك الـ tubulin**: الـ neutrophil محتاج الـ microtubules عشان يتحرك ويبلع، فالـ colchicine ==بيشلّه== قبل ما يوصل للبلورة. وده نفس السبب إنه بيأثر على الـ cell division، وده مصدر الـ side effects.
          - **بيقفل الـ inflammasome و IL-1**: ده نفس مسار البلورة اللي في أول المحاضرة، فبيقطع الدايرة من أولها.
          - **بيخرج أغلبه في البراز (80-90%) مع enterohepatic recycling**، و **10-20%** بس من الكلى.

          التفسير المقبول (مش في الكتاب): الـ enterohepatic recycling بيخلّي الدوا يلف ويرجع، فالجرعات الكبيرة بتتراكم، وده اللي بيعمل الإسهال. عشان كده الجرعة الصغيرة كسبت في دراسة Terkeltaub (صفحة 46).
      - kind: explain
        page: 41
        quote: "Dose of 30-35 mg/day can be used where colchicine or NSAIDs are contraindicated or failed to provide sufficient relief (elderly people and patients with renal/liver impairment, IHD, PUD, hypersensitivity to NSAIDs)."
        title: "Steroids"
        text: |
          - **Intra-articular**: لو مفصل أو اتنين بس.
          - **Oral**: ==30-35 mg/day لمدة يومين، وبعدين taper على 7-10 أيام==.
          - إمتى؟ لما الـ colchicine أو الـ NSAIDs ممنوعين أو فشلوا: كبار السن، الكلى أو الكبد، ischaemic heart disease (IHD)، peptic ulcer disease (PUD)، حساسية NSAIDs.
          - الـ American College of Rheumatology (ACR) بيحطهم first line زي الـ colchicine.
          - عيوبها: بتبوّظ الضغط والسكر، و **rebound** متكرر.

          مفيش استجابة؟ ← **combination** ← **second-line**.

          التفسير المقبول (مش في الكتاب): ليه intra-articular في مفصل أو اتنين؟ عشان الدوا بيروح مكان الالتهاب على طول، والجسم كله مابياخدش غير كمية صغيرة، فالسكر والضغط مايتأثروش تقريبًا. ولما المفاصل تكتر يبقى الـ oral أسهل. والـ taper على 7-10 أيام سببه إن البلورات لسه موجودة، فلو وقفت فجأة الالتهاب يرجع (الـ rebound).
      - kind: explain
        page: 41
        quote: "Best in pts who cannot take steroids or colchcine."
        title: "ليه IL-1 بالذات؟"
        text: |
          الكتاب بيقول الـ biologic agents **effective للنوبة**، و **أحسن حاجة للي مايقدرش ياخد steroids أو colchicine**.

          ليه بتشتغل؟ عشان IL-1 هو قلب الالتهاب اللي البلورة بتعمله (الـ inflammasome في رسمة صفحة 40). اقفل IL-1، النوبة بتطفي.

          وتلات طرق للقفل، زي محاضرة الـ cytokines:
          - **Receptor antagonist**: anakinra، بيقعد على الـ receptor.
          - **Anti-IL-1 antibody**: canakinumab، بيمسك الـ cytokine.
          - **Decoy receptor fusion protein**: ==rilonacept==، receptor عايم بيصطاد IL-1.

          العيب: غالية جدًا و off-label في أغلب البلاد.
      - kind: explain
        page: 41
        quote: "In practice, anakinra has been the preferred off-label anti-IL-1ẞ strategy among experienced \"goutologists\", due to its short half-life and lower cost compared with canakinumab."
        title: "إمتى نستخدمهم؟"
        text: |
          للـ **refractory gout** أو لما الـ NSAIDs والـ colchicine والـ steroids كلهم ممنوعين.

          غاليين و off-label في أغلب البلاد. الـ ==anakinra== هو المفضل عند الخبرا: **half-life قصيرة وأرخص**.

          التفسير المقبول (مش في الكتاب): ليه الـ anti-IL-1 بيشتغل؟ عشان البلورة بتشغّل الـ inflammasome اللي بيطلّع IL-1، وده المحرك الرئيسي للنوبة. يعني إنت بتقفل نفس الخطوة اللي الـ colchicine بيقفلها، بس بشكل مباشر. والـ anakinra half-life بتاعته قصيرة، فلو حصلت عدوى تقدر توقفه ويخرج من الجسم بسرعة.
      - kind: update
        page: 41
        quote: "Canakinumab is now licenced for use in Europe, but not in the UK or USA."
        text: "الـ US Food and Drug Administration (FDA) وافقت على canakinumab لنوبات النقرس في 2023 للكبار اللي مايقدروش ياخدوا NSAIDs أو colchicine. في الامتحان: إجابة الكتاب (Europe بس)."
        ref: "FDA canakinumab approval for gout flares, 2023"
      - kind: case
        page: 41
        quote: "Dose of 30-35 mg/day can be used where colchicine or NSAIDs are contraindicated or failed to provide sufficient relief (elderly people and patients with renal/liver impairment, IHD, PUD, hypersensitivity to NSAIDs)."
        stem: "A 65-year-old man has acute gout of the right first MTP. He has CKD stage 4, asthma and peptic ulcer disease, and takes verapamil, simvastatin, a PPI and theophylline. (Book question 2)"
        steps:
          - question: "Best option for the acute attack?"
            options: ["Prednisolone 15-20 mg O.D.", "Ibuprofen 400 mg T.D.S.", "Colchicine 500 mcg B.D.", "Allopurinol 100 mg O.D.", "Febuxostat 40 mg O.D."]
