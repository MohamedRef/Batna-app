    src: { page: 101, quote: "FD is a DGBI associated with abnormalities in motility, including delayed gastric emptying and impaired fundic accommodation visceral sensitivity to both physical and chemical stimuli, central nervous system processing, psychopathology, immune function, changes in the gastric and small bowel microbiome, epithelial permeability, and genetics." }
