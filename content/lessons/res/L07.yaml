  - id: res.L07.lesson5
    title: "صدفة ولا حقيقة؟ وحلّل زي ما قرعت"
    hook: "فيه عيانين ماتوا قبل العملية. تشيلهم من الحسبة؟ لو شلتهم، العملية هتبان معجزة وهي مالهاش أي لازمة."
    minutes: 9
    pages: [64, 78]
    topics: [chance, itt]
    goals:
      - "تقرا الـ significance من الـ confidence interval"
      - "تفرّق بين الـ intention to treat والـ per protocol"
      - "تعرف ليه الـ ITT أحسن تقدير للـ benefit ومش للـ harm"
    status: unverified
    steps:
      - kind: explain
        page: 64
        quote: "Two methods of assessing the role of chance"
        title: "طريقتين نقيس بيهم دور الصدفة"
        text: |
          عندنا طريقتين نقيس بيهم دور الـ **chance**:

          - ==P-values== (hypothesis testing): اختبار للـ null hypothesis. لو **p < 0.05** يبقى statistically significant.
          - ==Confidence intervals== (estimation): range غالبًا فيه القيمة الحقيقية.

          والعلاقة بينهم: لو قيمة الـ **no effect** **برّه** الـ CI، النتيجة significant.

          وقيمة الـ no effect في الـ RR هي **1**، وفي الـ risk difference هي **صفر**.
      - kind: figure
        page: 67
        quote: "Statistically significant (increased risk)"
        title: "الـ CI والخط اللي عند 1"
        alt: "Forest plot with a vertical line at relative risk 1. RR 1.77, CI 1.22 to 2.45, lies wholly right of 1: significant increased risk. RR 1.63, CI 0.85 to 2.46, crosses 1: not significant. RR 0.78, CI 0.56 to 0.94, lies wholly left of 1: significant decreased risk."
        caption: "الـ CI **عدّى** الخط اللي عند 1؟ يبقى **مش significant**. كله يمين الخط = خطر **زاد**. كله شمال = خطر **قلّ**."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 190H320" class="fg-thin"/>
            <path d="M130 20V190" class="fg-arrow-acc"/>
            <text x="130" y="206" text-anchor="middle" class="t-sm t-acc t-b">1</text>
            <text x="60" y="206" text-anchor="middle" class="t-sm t-mut">0.5</text>
            <text x="230" y="206" text-anchor="middle" class="t-sm t-mut">2</text>
            <text x="300" y="206" text-anchor="middle" class="t-sm t-mut">2.5</text>
            <path d="M161 50H289" class="fg-arrow"/>
            <rect x="200" y="44" width="12" height="12" class="fg-bad"/>
            <text x="226" y="36" text-anchor="middle" class="t-sm">1.77 (1.22-2.45)</text>
            <text x="320" y="70" text-anchor="end" class="t-sm t-bad t-b">significant, risk up</text>
            <path d="M101 110H291" class="fg-arrow"/>
            <rect x="183" y="104" width="12" height="12" class="fg-box"/>
            <text x="196" y="96" text-anchor="middle" class="t-sm">1.63 (0.85-2.46)</text>
            <text x="320" y="130" text-anchor="end" class="t-sm t-mut t-b">crosses 1: not significant</text>
            <path d="M74 160H124" class="fg-arrow"/>
            <rect x="96" y="154" width="12" height="12" class="fg-good"/>
            <text x="75" y="150" text-anchor="middle" class="t-sm">0.78 (0.56-0.94)</text>
            <text x="320" y="170" text-anchor="end" class="t-sm t-good t-b">significant, risk down</text>
          </svg>
      - kind: explain
        page: 68
        quote: "Insignificant less precised"
        title: "عرض الـ CI = الدقة"
        text: |
          مثال الألياف:
          - **Vegetable fibre** 0.9-1.4، و **fruit fibre** 0.8-1.2: بيعدّوا الـ 1 وعريضين، يعني **insignificant and less precise**.
          - **Cereal fibre** 0.6-0.7: ضيّق وتحت الـ 1، يعني ==significant and precise==.

          وكل ما الـ sample size يكبر، الـ CI **يضيق** (precision أعلى).
      - kind: check
        page: 66
        quote: "If the confidence interval is 0.12- 1.5 ( includes 1) this is not statistically significant"
        question: "In the DVT study, the relative risk has a 95% confidence interval of 0.12-1.5. What do you conclude?"
        options:
          - "Not statistically significant, because the interval includes 1"
          - "Significant, because the point estimate is below 1"
          - "Significant, because 0.12 is far from 1"
          - "The drug doubles the risk of DVT"
        answer: 0
        why:
          - "صح: الـ CI فيه الـ 1، يعني ممكن مفيش أثر خالص (p = 0.6 في المحاضرة)."
          - "الـ point estimate لوحده مش كفاية؛ المهم الـ CI عدّى الـ 1 ولا لأ."
          - "طرف واحد بعيد مش كفاية؛ الطرف التاني عدّى الـ 1."
          - "الـ CI بيروح من حماية لزيادة بسيطة، مفيش حاجة بتقول ضعف."
      - kind: explain
        page: 69
        quote: "all study participants are included in the analyses as part of the groups to which they were randomized"
        title: "Intention to treat ضد per protocol"
        text: |
          - ==Intention-to-treat (ITT)==: **كل** اللي اتقرعوا بيتحلّلوا في **الجروب اللي اتقرعوا فيه**، سواء كمّلوا أو التزموا أو لأ.
          - ==Per protocol==: بيشيل اللي **خالفوا الـ protocol**.

          يعني في الـ ITT: all participants are analysed as **randomized**.

          الـ ITT هو **optimal estimate of the true benefit**، بس ==not optimal for measuring harm== (لأن اللي ماخدش الدوا مش هيبان عليه الـ side effect).
      - kind: case
        page: 71
        quote: "which represents a relative risk reduction (RRR) of 0.45"
        stem: "100 عيان cerebrovascular disease اتقرعوا على surgery + aspirin، و 100 على aspirin بس. في جروب العملية، 10 جالهم stroke قبل ما يلحقوا يعملوا العملية، ومن الـ 90 اللي اتعملّهم 10 جالهم stroke. في جروب الـ aspirin، 20 جالهم stroke."
        steps:
          - question: "Per-protocol stroke rate in the surgery arm?"
            options: ["10/90 = 0.11", "20/100 = 0.20", "10/100 = 0.10", "20/90 = 0.22"]
            answer: 0
            why: "الـ per protocol بيشيل اللي ماتعملّهمش العملية، فالـ 10 اللي جالهم stroke بدري اختفوا من البسط والمقام."
          - question: "What does each analysis show?"
            options: ["Per protocol RRR 0.45; ITT RRR 0", "Both RRR 0.45", "Per protocol 0; ITT 0.45", "Both no effect"]
            answer: 0
            why: "Per protocol: 0.11 ضد 0.20، RRR 0.45. ITT: 20/100 ضد 20/100، RRR صفر."
          - question: "Which one shows the underlying truth?"
            options: ["Intention to treat", "Per protocol"]
            answer: 0
            why: "الـ ITT بيقول الأثر الحقيقي صفر. الـ per protocol خلّى العملية تبان كويسة لأنه شال أسوأ العيانين (Montori, CMAJ 2001)."
      - kind: aside
        tone: analogy
        page: 75
        quote: "If these non compliant people were excluded from the analysis"
        text: |
          مثال الـ diet: تجربة **cancer-prevention diet** ضد placebo diet. ناس في جروب الـ diet جالهم أعراض GI ووقفوا الـ diet، والأعراض دي كانت **أول علامات الـ cancer**.

          لو عملتلهم exclude من الـ analysis لأنهم مش compliant، شلت الـ cancers من جروب الـ diet، فالـ diet هيبان **أقوى من الحقيقة**. زي مدرس يقول «فصلي كله نجح» بعد ما طرد الضعاف قبل الامتحان.
      - kind: check
        page: 78
        quote: "Performing the analysis of RCTs according to original randomised assignment"
        question: "Which is CORRECT about intention to treat?"
        options:
          - "Analysis depends on whether patients complied"
          - "It is the optimal estimate of the true harm"
          - "Analysis follows the original randomised assignment"
          - "It is not optimal for measuring benefit"
        answer: 2
        why:
          - "الـ ITT بيتجاهل الـ compliance."
          - "هو أحسن تقدير للـ benefit، مش للـ harm."
          - "صح: حلّل زي ما قرعت."
          - "بالعكس، هو الـ optimal للـ benefit."
      - kind: aside
        tone: trap
        page: 77
        quote: "Excessive exclusion criteria may result in which of the following"
        text: |
          شريحة 77: «excessive exclusion criteria بتعمل إيه؟» والاختيارات فيها recruitment problems وزيادة costs و all of the above. **إجابة الشريحة: a، decreased external validity.**

          منطقيًا «all» قابلة للنقاش، بس الامتحان بياخد إجابة الشريحة. افتكر: exclusion كتير = عيّنة مش شبه عيانينك = **external validity** أقل.
      - kind: try
        items: [res.L07.065, res.L07.071, res.L07.069]
    recap:
      - "P < 0.05 أو CI مش فيه قيمة الـ no effect (RR 1، RRR 0) = significant."
      - "CI ضيّق = precise. عيّنة أكبر = CI أضيق."
      - "ITT: حلّل الكل في الجروب اللي اتقرع فيه. أحسن تقدير للـ benefit، مش للـ harm."
      - "Per protocol بيشيل المخالفين فبيبالغ في الأثر (Montori: RRR 0.45 ضد 0)."
    practice: [res.L07.063, res.L07.064, res.L07.065, res.L07.066, res.L07.067, res.L07.068, res.L07.069, res.L07.070, res.L07.071, res.L07.072, res.L07.073, res.L07.074, res.L07.075, res.L07.076, res.L07.077]
  # ------------------------------------------------------------------
  - id: res.L07.lesson6
    title: "أخلاقيات التجربة: Helsinki و equipoise والموافقة"
    hook: "إمتى يبقى من حقك تدّي نص العيانين placebo؟ بس لما تكون فعلًا مش عارف مين الأحسن."
    minutes: 7
    pages: [79, 105]
    topics: [ethics]
    goals:
      - "تعرف الـ Declaration of Helsinki والـ ethical issues الخمسة"
      - "تعرّف الـ equipoise"
      - "تعدّ عناصر الـ consent وتوصيات الـ registration"
    status: unverified
    steps:
      - kind: explain
        page: 79
        quote: "Developed by the World Medical Association"
        title: "Declaration of Helsinki"
        text: |
          ==Declaration of Helsinki==: مجموعة **ethical principles** عملتها الـ **World Medical Association**، بتوجّه الباحثين في أي research على human subjects.

          والـ ethical issues اللي المحاضرة بتعدّها:
          - **Competence** الباحث.
          - **Stage of research**.
          - **Special populations**: ستات، أطفال، مساجين، HIV، و suicidal individuals.
          - **Institutional approval**.
          - **Conflict of interest**.
      - kind: explain
        page: 81
        quote: "Financial or other personal considerations may compromise an investigator's judgment"
        title: "Conflict of interest"
        text: |
          ==Conflict of interest==: اعتبارات **financial** أو personal ممكن تأثر على حكم الباحث، يعني الـ judgment بتاعه، في إدارة البحث أو كتابة النتايج.

          نتيجته: بيهدد **integrity** البحث، بيهزّ **ثقة الناس في العلم**، وممكن يضر **حقوق وسلامة** المشاركين.
      - kind: explain
        page: 82
        quote: "genuine uncertainty about the appropriate course of action"
        title: "Equipoise: الحيرة الأمينة"
        text: |
          ==Equipoise==: حالة **genuine uncertainty**: هل ندّي العلاج ولا نمنعه؟

          - عندك **belief كفاية** يبرر إنك تعرّض الناس للعلاج.
          - وعندك **doubt كفاية** يبرر إنك تمنعه عن الـ control.

          والتجربة **أخلاقية بس** لما الـ **expert community** كلها في equipoise.
      - kind: figure
        page: 82
        quote: "Sufficient belief to Sufficient doubt to"
        title: "الميزان"
        alt: "A balance scale held level. The left pan reads sufficient belief to justify exposing subjects to treatment. The right pan reads sufficient doubt to justify withholding treatment. The level beam is labelled equipoise."
        caption: "الميزان **متوازن** = equipoise. لو مال لأي ناحية، يبقى عارف الإجابة، والتجربة مابقتش أخلاقية."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <path d="M165 40V180M120 190H210" class="fg-arrow"/>
            <path d="M40 60H290" class="fg-arrow-acc"/>
            <rect x="155" y="30" width="20" height="20" rx="10" class="fg-acc"/>
            <path d="M60 60L30 110M60 60L90 110M270 60L240 110M270 60L300 110" class="fg-thin"/>
            <rect x="10" y="110" width="100" height="56" rx="8" class="fg-good"/>
            <text x="60" y="132" text-anchor="middle" class="t-sm t-b">Belief</text>
            <text x="60" y="150" text-anchor="middle" class="t-sm">to give it</text>
            <rect x="220" y="110" width="100" height="56" rx="8" class="fg-bad"/>
            <text x="270" y="132" text-anchor="middle" class="t-sm t-b">Doubt</text>
            <text x="270" y="150" text-anchor="middle" class="t-sm">to withhold it</text>
            <text x="165" y="212" text-anchor="middle" class="t-sm t-acc t-b">Equipoise = level beam</text>
          </svg>
      - kind: check
        page: 102
        quote: "Neither drug is known to be more effective than the other"
        question: "Which best describes equipoise as the rationale for a trial of two drugs?"
        options:
          - "The drugs are known to be equally effective"
          - "One drug is known to be more toxic"
          - "Neither drug is known to be more effective than the other"
          - "One is more effective but the other is easier to take"
        answer: 2
        why:
          - "لو عارفين إنهم زي بعض، مفيش سؤال نجرّبه."
          - "لو عارفين إنه أسمّ، مش أخلاقي ندّيه."
          - "صح: محدش عارف مين الأحسن، ودي الـ genuine uncertainty."
          - "لو واحد معروف إنه أحسن، مش أخلاقي نمنعه."
      - kind: explain
        page: 83
        quote: "Participants may withdraw from the study at any time without losing their medical care"
        title: "الـ consent process"
        text: |
          - المشاركة **voluntary** لكل الـ eligible subjects.
          - الباحث يشرح **بلغة بسيطة**: طبيعة الدراسة وأهدافها، العلاج، الـ procedures والتحاليل، **طريقة توزيع العلاج**، والـ data اللي هتتجمع.
          - الـ **benefits والـ risks** المتوقعة.
          - **Confidentiality**.
          - ==withdraw at any time without losing their medical care==.
          - موافقة **written أو oral** حسب protocol موافق عليه من الـ **ethics committee**.
      - kind: aside
        tone: tip
        page: 83
        quote: "All eligible subjects must voluntarily agree to participate in a trial"
        text: |
          في العيادة عندنا الجملة دي مهمة جدًا: الموافقة لازم تبقى voluntarily، والعيان لازم يعرف إنه لو انسحب، **مش هيتحرم من علاجه** ولا الدكتور هيزعل منه.

          ولو العيان مش بيقرا، الشرح الشفوي والـ oral consent ممكن، **بس** حسب protocol اللجنة موافقة عليه.
      - kind: explain
        page: 84
        quote: "all RCTs trials are registered at their inception"
        title: "Registration: سجّل قبل ما تبدأ"
        text: |
          التوصيات:
          - كل الـ RCTs تتسجّل ==at their inception==، وقت الـ ethical أو funding approval.
          - المعلومات تكون **متاحة لكل المهتمين**.
          - الـ register يكون مطابق لـ **minimum standard**.
          - الـ **prospective registration** جزء من الـ ethical guidelines.
          - الحكومات توفّر الإمكانيات علشان كل الـ RCTs تتسجّل prospectively.

          مثال: **ISRCTN**، registry معترف بيه من **WHO**، بيدّي الرقم اللي محتاجه علشان تنشر، ومفتوح للبحث مجانًا. وده بيقلّل الـ **selective reporting**.
      - kind: match
        page: 80
        quote: "Institutional approval Conflict of interest"
        prompt: "وصّل كل موقف بالـ ethical issue بتاعه:"
        pairs:
          - ["A drug company pays the investigator per patient enrolled", "Conflict of interest"]
          - ["A trial plans to enrol children and prisoners", "Special populations"]
          - ["The protocol has not been seen by the ethics committee", "Institutional approval"]
          - ["A first-year resident runs a complex trial alone", "Competence"]
        why: "الفلوس اللي بتأثر على الحكم = **conflict of interest**. الفئات الضعيفة = **special populations**. اللجنة = **institutional approval**. الخبرة = **competence**."
      - kind: try
        items: [res.L07.081, res.L07.082, res.L07.079]
    recap:
      - "Helsinki: مبادئ الـ World Medical Association للبحث على البشر."
      - "Ethical issues: competence، stage of research، special populations، institutional approval، conflict of interest."
      - "Equipoise: genuine uncertainty. أخلاقي بس لما الخبراء مش عارفين مين الأحسن."
      - "Consent: voluntary، شرح بسيط، benefits و risks، confidentiality، انسحاب من غير ما يخسر علاجه، protocol موافق عليه."
      - "Register at inception، و ISRCTN معترف بيه من WHO."
    practice: [res.L07.078, res.L07.079, res.L07.080, res.L07.081, res.L07.082, res.L07.083, res.L07.084, res.L07.085]
  # ------------------------------------------------------------------
  - id: res.L07.lesson7
    title: "تقييم الـ RCT والـ quasi-experimental"
    hook: "الـ RCT أقوى دليل... بس غالي وصعب ومش دايمًا ينفع يتعمم. وإزاي تحكم على جودته؟"
    minutes: 8
    pages: [86, 100]
    topics: [appraisal, quasi]
    goals:
      - "تعدّ مزايا وعيوب الـ RCT"
      - "تعرف الـ CONSORT 2010 وترتيب الـ flow diagram"
      - "تفرّق بين الـ checklist والـ quality score وتعرف الـ quasi-experimental"
    status: unverified
    steps:
      - kind: table
        page: 86
        quote: "Best evidence for causality"
        title: "الـ RCT: الحلو والوحش"
        columns: ["Advantages", "Disadvantages"]
        rows:
          - ["Best evidence for causality", "Expensive (time and money)"]
          - ["Allocation without prejudice", "Organisationally difficult"]
          - ["Balances factors that affect outcome", "Not always generalisable; sometimes ethical problems"]
        hide: [[0, 0], [1, 1], [2, 1]]
      - kind: aside
        tone: joke
        page: 93
        quote: "National Institute of Neurological Disorders and Stroke"
        text: |
          «Expensive» يعني قد إيه؟ متوسط تكلفة الـ phase III RCT اللي بيموّلها الـ **National Institute of Neurological Disorders and Stroke**: **12 مليون دولار**. 💸

          يعني لما حد يقولك «ما تعمل RCT في الرسالة»، قوله: «حاضر، بس نجيب الـ 12 مليون منين؟» 😄
      - kind: explain
        page: 88
        quote: "The CONSORT 2010 checklist contains 25 items"
        title: "CONSORT: إزاي تكتب الـ RCT"
        text: |
          ==CONSORT== = **Consolidated Standards of Reporting Trials**.

          - أول نسخة **1996**. الهدف: تحسين **conduct and reporting** للـ RCTs.
          - عملها فريق دولي: trialists و statisticians و epidemiologists و biomedical editors.
          - الـ **CONSORT 2010**: ==25 items== في checklist، ومعاه **flow diagram**.
          - بيركّز على الـ **individually randomised, two-group, parallel trials**، أشهر نوع RCT.
          - مدعوم من مجلات زي **The Lancet** و **JAMA** و **Annals of Internal Medicine**.
      - kind: order
        page: 92
        quote: "CONSORT 2010 Flow Diagram"
        prompt: "رتّب مربعات الـ CONSORT flow diagram من فوق لتحت:"
        steps:
          - "Assessed for eligibility"
          - "Randomized"
          - "Allocated to intervention"
          - "Lost to follow-up or discontinued"
          - "Analysed"
        why: "الترتيب: **enrolment** (assessed، والـ excluded بأسبابهم)، ثم **randomized**، ثم **allocation** (خد أو ماخدش)، ثم **follow-up** (ضاع أو وقف)، ثم **analysis**. ونفس الترتيب في كل جروب."
      - kind: explain
        page: 94
        quote: "Quality scores are complicated and tend to vary depending on the instrument used"
        title: "إزاي تحكم على جودة الـ RCT؟"
        text: |
          طريقتين:
          - **Checklist approach**: زي الـ Users' Guides: ==Are the results valid? What are the results? How can I apply them?==
          - **Quality score approach**: زي **Jadad**: randomised؟ double blind؟ اتوصف الـ withdrawals والـ dropouts؟ نقطة لكل «yes». الشريحة بتقول range **0-5**، و **أقل من 3 = poor quality**.

          بس الـ quality scores **complicated** وبتختلف حسب الأداة، **فمش مُشجَّعة**.
      - kind: reveal
        page: 96
        quote: "Did experimental and control groups begin the study with a similar prognosis"
        prompt: "في الـ checklist: «هل الجروبين **بدأوا** بنفس الـ prognosis؟» إيه الـ 4 أسئلة اللي بتجاوب ده؟"
        answer: |
          1. Were patients **randomized**?
          2. Was randomization **concealed**?
          3. Were patients **analyzed in the groups to which they were randomized**؟ (ITT)
          4. Were the groups similar in **known prognostic factors**?

          وبعدها: «هل **فضلوا** بنفس الـ prognosis؟» = blinding للعيان والدكتور والـ assessor، و follow-up كامل.
      - kind: explain
        page: 97
        quote: "one characteristic of a true experiment is missing"
        title: "Quasi-experimental: ناقصها حاجة"
        text: |
          في الـ ==quasi-experimental study== حاجة واحدة من الـ true experiment ناقصة:
          - **Randomization**، أو
          - **Separate control group**.

          تصميمين:
          - **One-group pre-test/post-test**: تقيس، تدّي العلاج، تقيس تاني. **مفيش control**.
          - **Classical quasi-experimental**: جروب intervention وجروب comparison **من غير قرعة**، وقياس قبل وبعد في الاتنين.
      - kind: figure
        page: 99
        quote: "Classical Quasi-Experimental Design"
        title: "التصميمين جنب بعض"
        alt: "Top row, one-group pre-test post-test: measurement, treatment, measurement, with no control group. Bottom, classical quasi-experimental design: non-random assignment into an intervention group and a comparison group; both are measured before (A1, B1) and after (A2, B2), and only the intervention group gets the treatment."
        caption: "فوق: **مفيش control**. تحت: فيه control **بس مش بالقرعة**. في الاتنين الـ **internal validity** في خطر."
        svg: |
          <svg viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="R07q" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <text x="165" y="16" text-anchor="middle" class="t-sm t-b">One-group pre/post</text>
            <rect x="10" y="26" width="90" height="32" rx="6" class="fg-thin"/>
            <text x="55" y="47" text-anchor="middle" class="t-sm">Measure</text>
            <path d="M100 42H118" class="fg-arrow" marker-end="url(#R07q)"/>
            <rect x="120" y="26" width="90" height="32" rx="6" class="fg-acc"/>
            <text x="165" y="47" text-anchor="middle" class="t-sm t-b">Treatment</text>
            <path d="M210 42H228" class="fg-arrow" marker-end="url(#R07q)"/>
            <rect x="230" y="26" width="90" height="32" rx="6" class="fg-thin"/>
            <text x="275" y="47" text-anchor="middle" class="t-sm">Measure</text>
            <text x="165" y="80" text-anchor="middle" class="t-sm t-bad">no control group</text>
