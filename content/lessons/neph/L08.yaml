        quote: "Acroparesthesias Angiokeratomas Corneal opacity GIT problems"
        word: "FABRY"
        parts:
          - { key: "F", text: "Fire in the hands: acroparesthesias" }
          - { key: "A", text: "Angiokeratomas" }
          - { key: "B", text: "Blurred cornea: corneal opacity; and no sweat (hypohidrosis)" }
