        quote: "Broadly, the manifestations of fibrotic lung diseases (DPLDs) can be grouped as follows:\n  1) Chronic, insidious, and slowly progressive.\n  2) Subacute, with a resolving, remitting, relapsing, or progressive course.\n  3) Acute, with a fulminant, progressive, remitting, or resolving course.\nDisorders with chronic, insidious, and slowly progressive courses are those that clinically resemble IPF and usually share a common pathology (ie, UIP).\nMany of the rheumatologic/connective-tissue diseases, the pneumoconioses, and drug-related pulmonary fibrosis generally fit into this category.\nSubacute presentations with a variable course are typified by Cryptogenic Organizing Pneumonia (COP).\nCOP often develops weeks or months after the onset of a flulike illness.\nPatients can present to medical attention with dyspnea or exercise intolerance."
        title: "تلات سرعات للـ DPLD"
