  - id: hb.L15.lesson4
    title: "Mild ولا severe؟ Atlanta وBISAP وRanson والتجمعات"
    hook: "رقم سحري واحد (48 ساعة) بيفرّق بين moderately severe وsevere، ورقم تاني (4 أسابيع) بيفرّق بين الـ collections الأربعة."
    minutes: 10
    pages: [285, 288]
    topics: [ap-severity, ap-complications]
    goals:
      - "تصنّف الـ AP بالـ Revised Atlanta 2012"
      - "تفرّق بين الـ 4 fluid collections بالوقت والجدار والمحتوى"
      - "تحسب BISAP وتعدّ Ranson من غير ما تتلخبط في السن"
    status: unverified
    steps:
      - kind: explain
        page: 285
        title: "أدوات قياس الخطورة"
        text: |
          الدرس اللي فات كان "مين ممكن يقلب severe". الدرس ده "إزاي نحكم إنه severe". الكتاب بيدّيك 4 أدوات:
          - **Atlanta Revised criteria 2012**: مبني على local complications و organ failure.
          - **BISAP score**: أدق بعد 48 h.
          - **Ranson's criteria**: أدق بعد 48 h.
          - **Others**: APACHE II، Marshall.

          ليه "بعد 48 h"؟ لأن أول يومين المريض ممكن يبان وحش من الجفاف والوجع، ويتحسن بالمية. اللي يفضل وحش بعد يومين هو اللي خطير فعلًا.

          **Organ failure** في الكتاب = أي واحد من دول:
          - **Shock**: SBP أقل من 90 mm Hg (أو mean أقل من 70).
          - **Pulmonary**: PaO2 أقل من 60 mm Hg، أو محتاج ventilation.
          - **Renal**: creatinine أكتر من 2 mg/dl **بعد الـ rehydration**، أو محتاج dialysis.
          - **GIT bleeding**: أكتر من 500 ml في 24 h.
          - **Tachycardia**: أكتر من 90 BPM.
      - kind: table
        page: 285
        title: "Revised Atlanta 2012"
        columns: ["Grade", "Criteria"]
        rows:
          - ["Mild", "No organ failure; no local or systemic complications"]
          - ["Moderately severe", "Transient organ failure (resolves within 48 h) and/or local or systemic complications without persistent organ failure"]
          - ["Severe", "Persistent organ failure (> 48 h), single or multiple"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: aside
        tone: exam
        page: 285
        text: |
          الرقم السحري 48 ساعة: organ failure راح قبل 48 h = **moderately severe**. فضل بعد 48 h = **severe**.

          والكتاب بيضيف جملة: **mild = interstitial AP**، و **moderately severe و severe = necrotizing AP**. اكتبها في الامتحان، بس افتكر إن الـ grade نفسه بيتحدد بالـ organ failure والمضاعفات.
      - kind: update
        page: 285
        ref: "Revised Atlanta classification 2012"
        text: |
          قايمة الـ organ failure اللي في الكتاب (ومنها GI bleeding و tachycardia) جاية من **Atlanta الأصلي 1992**. الـ **Revised Atlanta 2012** بيعرّف الـ organ failure بالـ **modified Marshall score** (score ≥ 2 في respiratory أو cardiovascular أو renal).

          والـ severity والـ morphology مستقلين: ممكن interstitial AP مع transient organ failure يبقى moderately severe. الكتاب هو إجابة الامتحان.
      - kind: case
        page: 286
        stem: "A 50-year-old man is admitted with alcoholic acute pancreatitis."
        steps:
          - reveal: "After 3 L of fluid: SBP 85 mm Hg, creatinine 2.6 mg/dl."
            question: "Does he have organ failure by the book's list?"
            options: ["Yes: shock and renal failure", "No: creatinine must exceed 3 mg/dl", "No: only PaO2 counts"]
            answer: 0
            why: "SBP < 90 = shock، و creatinine > 2 **بعد الـ rehydration** = renal failure. الاتنين organ failure."
          - reveal: "Day 4: still on a vasopressor, creatinine 2.8 mg/dl."
            question: "Revised Atlanta grade?"
            options: ["Mild", "Moderately severe", "Severe"]
            answer: 2
            why: "الـ organ failure فضل أكتر من 48 h، يعني **persistent** = **severe**."
          - reveal: "Day 7 contrast CT: 40% of the gland does not enhance."
            question: "Does this count as pancreatic necrosis?"
            options: ["No: needs > 50%", "No: necrosis needs gas", "Yes: non-viable parenchyma > 30%"]
            answer: 2
            why: "الكتاب: necrosis = non-viable parenchyma > 3 cm أو > 30% من البنكرياس. 40% فوق الحد."
      - kind: explain
        page: 286
        title: "Local complications، والأرقام"
        text: |
          **Local complications** (جوه البطن، حوالين البنكرياس):
          - **Pancreatic necrosis**: non-viable parenchyma أكبر من 3 cm، أو أكتر من 30% من البنكرياس. يعني حتة من الغدة ماتت ومبتاخدش صبغة في الـ CT.
          - **Pancreatic abscess**: صديد.
          - **Pseudocyst**: كيس مية بجدار (هنشوفه في المربع الجاي).

          النتيجة: أغلب المرضى بخير، وقليل جدًا بيدفعوا التمن.
          - **Mild AP**: حوالي 80%، الوفيات أقل من 1%، وبتخف في أسبوع.
          - **Severe AP**: حوالي 20%، الوفيات لحد 35%.

          ملحوظة: الكتاب نفسه بيقول ~25% في ص 284 و ~20% هنا في ص 286. الرقمين من الكتاب؛ لو اتسألت، اكتب رقم الصفحة اللي السؤال جاي منها.
      - kind: figure
        page: 286
        title: "الـ 4 collections في مربع واحد"
        alt: "A two by two grid. Columns: first 4 weeks, and after 4 weeks. Rows: interstitial edematous pancreatitis, and necrotizing pancreatitis. Top left: acute peripancreatic fluid collection, a fluid blob with a dashed edge and no wall. Top right: pseudocyst, a fluid blob with a thick wall. Bottom left: acute necrotic collection, fluid with solid debris and no wall. Bottom right: walled-off necrosis, debris inside a thick enhancing wall."
        caption: "سطر فوق: **interstitial** (مية بس). سطر تحت: **necrotizing** (مية + كراكيب). عمود شمال: أول 4 أسابيع من غير جدار. عمود يمين: بعد 4 أسابيع بجدار."
