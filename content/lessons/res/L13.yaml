        why: "الـ ideas والتعريفات والجداول وأي حاجة حد ألهمك بيها = reference. الـ common knowledge وحاجاتك انت (ملاحظاتك، أفكارك، تجاربك) = لأ."
      - kind: explain
        page: 64
        quote: "No need to reference:\nWhen you are using 'common knowledge' (facts that can be found in numerous places and are likely to be known by a lot of people).\nWhen you are writing YOUR OWN observations or experiment results (for example, a report on a field trip)\nWhen you are writing YOUR OWN thoughts, comments or conclusions in an assignment\nWhen you are writing about YOUR OWN experiences"
        title: "إمتى مش محتاج؟"
        text: |
          - ==Common knowledge==: حقايق موجودة في أماكن كتير وناس كتير عارفاها.
          - **ملاحظاتك** أو نتايج تجربتك (زي تقرير field trip).
          - **أفكارك** وتعليقاتك واستنتاجاتك.
          - **تجاربك** الشخصية.
      - kind: table
        page: 65
        quote: "What is the difference between Reference and Bibliography?\nReferences usually come at the end of a text (essay or research report) and should contain ONLY those works cited within the text.\nBibliography is any list of references at the end of a text, whether cited or not. It includes texts you made use of, NOT ONLY texts you referred to in your paper, but your own additional background reading, and any other articles you think the reader might need as background reading."
        title: "Reference list ضد bibliography"
        columns: ["List", "Contains"]
        rows:
          - ["Reference list", "ONLY works cited in the text"]
          - ["Bibliography", "Everything used, cited or not, plus background reading"]
        hide: [[0, 1], [1, 1]]
      - kind: check
        page: 65
        quote: "What is the difference between Reference and Bibliography?\nReferences usually come at the end of a text (essay or research report) and should contain ONLY those works cited within the text.\nBibliography is any list of references at the end of a text, whether cited or not. It includes texts you made use of, NOT ONLY texts you referred to in your paper, but your own additional background reading, and any other articles you think the reader might need as background reading."
