  - id: hem.L09.lesson8
    title: "عيان الـ PMF: طحال ضخم ومصانع دم في أماكن غريبة"
    hook: "النخاع اتليّف، فالدم راح يدوّر على مصنع تاني: الطحال، الكبد، وأحيانًا الـ CNS."
    minutes: 9
    pages: [147, 149]
    topics: [pmf-clinical]
    goals:
      - "تعرف الصورة الإكلينيكية وليه الطحال الضخم يعمل portal hypertension"
      - "تعرف أماكن الـ EMH وإمتى تبقى خطر"
      - "تفهم الأنيميا والصفائح والكرات البيضا بتتغير ليه مع الوقت"
    status: unverified
    steps:
      - kind: explain
        page: 147
        title: "العيان شكله إيه؟"
        quote: "The estimated annual incidence of PMF is around 0.5–1.5 per 100,000 of the population, with most patients diagnosed in the sixth decade and roughly equal involvement of the two sexes.\nClinical picture\nUp to a third of patients are asymptomatic at diagnosis and many of these are discovered after unrelated blood tests show modest abnormalities, such as anemia and thrombocytopenia.\nSplenomegaly is found in almost all patients at presentation and splenic pain/discomfort is a common presenting symptom."
        text: |
          - Incidence **0.5–1.5/100,000**، أغلبهم في **العقد السادس**، والجنسين زي بعض.
          - لحد **تلت** المرضى **asymptomatic**: CBC عرضي فيه anemia أو thrombocytopenia بسيطة.
          - ==Splenomegaly in almost all== وقت التشخيص، و **splenic pain/discomfort** من أشهر الشكاوى.
          - أغلبهم moderate لـ marked، وحوالي **10% massive** لحد الـ **right iliac fossa**.
          - **Splenic infarcts** (painful و painless) شائعة.

          ليه الطحال بيكبر للدرجة دي؟ الكتاب بيقول إن الطحال **the commonest site of extramedullary hemopoiesis** في الـ PMF (ص 147). يعني الطحال بقى **مصنع دم** بدل النخاع المتليّف، والمصنع ده بيكبر.
      - kind: reveal
        page: 147
        quote: "Most cases develop moderate to marked splenomegaly and about 10% of cases develop massive splenomegaly, with the spleen extending to the right iliac fossa which can lead to a substantial increase in splenic blood flow which, in the most severe cases, can lead to portal hypertension with esophageal varices and ascites."
        prompt: "مريض PMF عنده esophageal varices و ascites، والكبد سليم من غير cirrhosis. جت منين؟"
        answer: |
          من الطحال الضخم: الكتاب بيقول إن الـ massive splenomegaly بتعمل ==substantial increase in splenic blood flow==، وفي الحالات الشديدة **portal hypertension** مع **varices و ascites**.

          التفسير المقبول (مش في الكتاب): دم الطحال كله بيرجع عن طريق الـ **splenic vein** للـ **portal vein**. طحال ضخم = دم كتير داخل الـ portal system، فالضغط بيعلى من **كتر الدم الداخل** (forward flow)، مش من كبد مسدود.
      - kind: explain
        page: 147
        title: "الـ hypermetabolic state"
        quote: "A hypermetabolic state presenting with fevers, anorexia, weight loss and night sweats develops in many cases of PMF, sometimes early in the disease.\nThe presence of such symptoms is associated with poor prognosis."
        text: |
          كتير من المرضى بيجيلهم **hypermetabolic state**: **fevers، anorexia، weight loss، night sweats**، وأحيانًا بدري في المرض.

          ودي مش أعراض وخلاص: ==associated with poor prognosis==، وهتلاقيها نقطة في الـ IPSS (constitutional symptoms).

          ليه الجسم بيتحرق كده؟ التفسير المقبول (مش في الكتاب): نفس الـ **pro-inflammatory cytokines** اللي بتليّف النخاع بتعمل حرارة وتعرّق وفقدان شهية، وفوقها طحال ضخم وخلايا كتير بتتعمل وتموت وبتصرف طاقة.
      - kind: figure
        remind: [hem.L09.111]
        page: 148
        quote: "CNS, skin, pericardium, peritoneum, pleura, ovaries, kidneys, adrenals, GIT and lungs. Many such cases remain asymptomatic, but involvement of the CNS can be a cause of serious morbidity."
        title: "الـ EMH بيروح فين؟"
        alt: "Body outline with labels. Common: spleen (commonest) and liver. Unusual: lymph nodes, CNS, skin, pericardium, pleura, lungs, peritoneum, GIT, kidneys, adrenals, ovaries. CNS is marked as the serious one."
        caption: "الـ ==spleen== أشهر مكان، والـ **liver** غالبًا معاه. الأماكن الغريبة أغلبها ساكتة، إلا الـ **central nervous system (CNS)**. والعلاج **radiotherapy أو surgery** بيخفّيها تقريبًا دايمًا."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <circle cx="165" cy="35" r="24" class="fg-box"/>
            <rect x="125" y="62" width="80" height="140" rx="30" class="fg-box"/>
