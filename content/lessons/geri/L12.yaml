  # ------------------------------------------------------------------
  - id: geri.L12.lesson1
    title: "الإساءة اللي محدش بيشوفها"
    hook: "واحد من كل 10 كبار بيتأذي من اللي بيرعاه كل سنة، وأغلبهم مش هيقولولك. أول خطوة إنك تعرف يعني إيه إساءة."
    minutes: 7
    pages: [210, 211]
    topics: [definition, prevalence]
    goals:
      - "تعرّف الـ elder abuse بتعريف الـ World Health Organization (WHO) وتفهم كل كلمة فيه"
      - "تعرف أرقام الانتشار وليه هي أقل من الحقيقة"
    status: unverified
    steps:
      - kind: explain
        page: 210
        quote: "The World Health Organization's (WHO) definition may provide some common ground to discuss abuse in an international context: \"Elder abuse is a single, or repeated act, or lack of appropriate action, occurring within any relationship where there is an expectation of trust which causes harm or distress to an older person.\" (WHO 2008: 1)."
        title: "التعريف"
        text: |
          تعريف الـ **WHO (2008)**: الـ ==elder abuse== هو فعل مرة واحدة أو متكرر، **أو غياب الفعل المناسب**، في أي علاقة فيها **توقّع ثقة**، وبيسبب أذى أو ضيق لشخص كبير.

          لاحظ الحاجتين المهمين:
          - **lack of appropriate action**: يعني الإهمال إساءة.
          - **expectation of trust**: الإساءة جاية من حد المفروض نثق فيه.

          والتعريف بيختلف بالثقافة: النرويج بتحط **family disharmony**، وفرنسا **moral cruelty**.

          ليه الكلمتين دول مهمين؟ لأنهم بيفرّقوا الإساءة عن الجريمة العادية: الحرامي الغريب في الشارع مش elder abuse، عشان مفيش علاقة ثقة. والبنت اللي بتنسى تجيب دوا أبوها elder abuse، حتى من غير ما تمد إيدها عليه.
      - kind: check
        page: 210
        quote: "\"Elder abuse is a single, or repeated act, or lack of appropriate action, occurring within any relationship where there is an expectation of trust which causes harm or distress to an older person.\" (WHO 2008: 1)."
        question: "Which situation fits the WHO definition of elder abuse?"
        options:
          - "A son repeatedly fails to give his father his prescribed medicines, and the father gets worse"
          - "A stranger snatches an old woman's bag in the street"
          - "An old man falls on an icy pavement"
          - "A doctor tells an old woman her diagnosis kindly"
        answer: 0
        why:
          - "صح: lack of appropriate action، في علاقة فيها expectation of trust، وسببت harm."
          - "جريمة، بس مفيش علاقة ثقة، فمش elder abuse بالتعريف ده."
          - "حادثة، مفيش فعل ولا تقصير من حد مؤتمن."
          - "مفيش أذى ولا ضيق."
      - kind: reveal
        page: 210
        quote: "Elder abuse has cultural, ethnic and religious dimensions."
        prompt: "لو كل بلد بتعرّف الإساءة بطريقتها، ليه نستعمل تعريف الـ WHO؟"
        answer: |
          الكتاب بيقول إن الـ elder abuse ليه **cultural, ethnic and religious dimensions**: النرويج بتعدّ الـ family disharmony، وفرنسا الـ moral cruelty.

          عشان كده تعريف الـ **WHO** مفيد: بيدّي **common ground** نتكلم بيه في سياق دولي. يعني مش بيلغي الثقافة، بس بيدّينا أرضية واحدة نقارن عليها الأرقام ونكتب بيها الأبحاث.
      - kind: explain
        page: 211
        quote: "U.S. estimates indicate that one out of 10 older adults experiences abuse or neglect by a caregiver each year. In addition, it appears that only a fraction of cases are reported to authorities, although reported and investigated cases have increased. A study of state Adult Protective Services (APS) cases found that investigated reports increased by 16.3% and that substantiated reports increased by 15.6% from 2000 to 2004."
        title: "قد إيه منتشر؟"
        text: |
          - موجود في الدول النامية والمتقدمة، و ==underreported== في كل حتة.
          - الأرقام موجودة بس في دول متقدمة قليلة: **1-10%**.
          - في أمريكا: **1 من كل 10** كبار بيتعرض لإساءة أو إهمال من اللي بيرعاه كل سنة.
          - التقارير بتزيد (APS: investigated +16.3%، substantiated +15.6% من 2000 لـ 2004)، بس اللي بيتبلّغ عنه جزء صغير بس.
          - ثقافيًا: أرامل بيتجوّزوا غصب، وستات كبار لوحدهم بيتّهموا بالسحر.

          ليه underreported؟ الكتاب بيقول: لو الـ **primary health care** والـ **social services** مش مجهزين يكتشفوها ويتعاملوا معاها، هتفضل **underdiagnosed** و**overlooked**. يعني المشكلة مش بس إن الضحية ساكت، لكن كمان إن محدش بيسأل.
      - kind: figure
        page: 211
        quote: "U.S. estimates indicate that one out of 10 older adults experiences abuse or neglect by a caregiver each year. In addition, it appears that only a fraction of cases are reported to authorities, although reported and investigated cases have increased."
        title: "جبل التلج"
        alt: "An iceberg. Above the water line, a small tip labelled reported and investigated cases (APS: up 16.3 percent, substantiated up 15.6 percent, 2000 to 2004). Below the water, a large mass labelled the real number: about 1 in 10 older adults a year in the US, hidden at home, by family."
        caption: "اللي بيوصل للسلطات حتة صغيرة فوق المية. وحتى لما التقارير زادت، الجزء اللي تحت لسه أكبر بكتير."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <path d="M130 90L165 40L200 90z" class="fg-acc"/>
            <path d="M6 96H324" class="fg-arrow-acc" stroke-width="2"/>
            <path d="M130 96L40 220L110 290H230L300 210L200 96z" class="fg-box"/>
            <text x="210" y="50" class="t-sm t-b">Reported</text>
            <text x="210" y="66" class="t-sm">APS: +16.3%, +15.6%</text>
            <text x="210" y="82" class="t-sm t-mut">2000 to 2004</text>
            <text x="100" y="160" class="t-b">The real number</text>
            <text x="92" y="186" class="t-sm">about 1 in 10 a year (US)</text>
            <text x="92" y="208" class="t-sm">hidden, at home,</text>
            <text x="92" y="226" class="t-sm">mostly by family</text>
            <text x="8" y="116" class="t-sm t-acc">water line</text>
          </svg>
      - kind: explain
        page: 211
        quote: "Approaches to define, detect and address elder abuse need to be placed within a cultural context and considered along side culturally specific risk factors."
        title: "الثقافة جزء من الكشف"
        text: |
          الكتاب بيطلب إن تعريف الإساءة وكشفها وعلاجها يتحطوا في ==cultural context==، مع الـ **risk factors** الخاصة بكل ثقافة. وبيدّي مثالين:

          - في مجتمعات تقليدية، **الأرامل الكبار** بيتجوّزوا غصب.
          - في مجتمعات تانية، **الستات الكبار اللي لوحدهم** بيتّهموا بالسحر.

          ليه ده يهمك كدكتور؟ لأن الإساءة اللي «طبيعية» في ثقافة معينة محدش هيشتكي منها، ولا حتى الضحية. لو ما تعرفش شكلها في المجتمع اللي بتشتغل فيه، هتعدّي قدامك وانت مش شايفها.
      - kind: check
        page: 211
        quote: "U.S. estimates indicate that one out of 10 older adults experiences abuse or neglect by a caregiver each year."
        question: "Per the book's US estimates, how many older adults experience abuse or neglect by a caregiver each year?"
        options:
          - "1 in 10"
          - "1 in 100"
          - "1 in 3"
          - "1 in 1000"
        answer: 0
        why:
          - "صح: 1 من كل 10، وده بيقع جوه الـ 1-10% اللي في الدول المتقدمة."
          - "أقل بكتير من تقدير الكتاب."
          - "أعلى بكتير من أي رقم في الكتاب."
          - "أقل بكتير؛ المشكلة شائعة."
      - kind: try
        items: [geri.L12.001, geri.L12.002, geri.L12.005, geri.L12.006, geri.L12.007]
    recap:
      - "WHO: فعل أو غياب فعل، في علاقة فيها ثقة، بيسبب أذى أو ضيق؛ الإهمال إساءة."
      - "التعريف ليه أبعاد ثقافية (النرويج family disharmony، فرنسا moral cruelty)؛ الـ WHO أرضية مشتركة."
      - "Underreported؛ 1-10% في الدول المتقدمة؛ 1 من 10 في أمريكا؛ التقارير بتزيد بس جزء صغير."
      - "الكشف محتاج primary care و social services مجهزين، وفهم للثقافة."
    practice: [geri.L12.001, geri.L12.002, geri.L12.003, geri.L12.004, geri.L12.005, geri.L12.006, geri.L12.007, geri.L12.008, geri.L12.053]
