    status: unverified
    steps:
      - kind: explain
        page: 165
        title: "ARPKD: مرض الأطفال"
        quote: "Caused by a rare mutation of the PKHD1 gene (located on chromosome 6) encoding polyductin. It is a disease of infancy and childhood, presenting with polycystic kidneys, progressive CKD, congenital hepatic fibrosis, and portal hypertension. It is much less common than ADPKD (estimated prevalence 1:20,000 live births)."
        text: |
          الـ ==autosomal recessive polycystic kidney disease (ARPKD)==: جين **fibrocystin gene (PKHD1)** على **chromosome 6** بيعمل **polyductin**.

          بيظهر في **الرضّع والأطفال**: polycystic kidneys، chronic kidney disease (CKD) بيتقدم، و ==congenital hepatic fibrosis== مع **portal hypertension**. أندر بكتير من الـ ADPKD (حوالي **1:20,000**).
      - kind: explain
        page: 165
        title: "Nephronophthisis: الـ nephrons بتختفي"
        quote: "A recessively inherited condition (~1 in 50,000), characterized by cystic change and tubulointerstitial fibrosis, presenting in early childhood (age >1 year) and leading to ESRD in adolescence. Mutations in at least five NPHP loci have been described, most commonly NPHP1 (associated with earlier onset). Imaging characteristically reveals echo-bright kidneys with a few corticomedullary cysts. Clinical features: polydipsia and polyuria but often presents as ESRD. Unlike medullary cystic kidney disease, extrarenal manifestations, including oculomotor apraxia, hypoplasia of cerebellar vermis (Joubert's syndrome), developmental delay, bone abnormalities (cone-shaped epiphyses), situs invertus, and hepatic and portal fibrosis) also occur. May also be associated with retinitis pigmentosa in the Senior-Løken syndrome."
        text: |
          الاسم يوناني معناه **"ضياع الـ nephrons تدريجيًا"**. ==autosomal recessive== tubulointerstitial nephropathy، ومن أشهر أسباب الـ end-stage renal disease (ESRD) الوراثية في **الأطفال والمراهقين**.

          - **nephronophthisis 1 gene (NPHP1)** = 21% من الحالات (وبدري أكتر)؛ كل جين تاني أقل من 4%.
          - يبدأ بعد سنة من العمر، و ESRD في المراهقة.
          - Imaging: **echo-bright kidneys** مع **أكياس قليلة corticomedullary**.
          - Polyuria و polydipsia، بس غالبًا يظهر وهو ESRD.
      - kind: mnemonic
        page: 165
        quote: "A recessively inherited condition (~1 in 50,000), characterized by cystic change and tubulointerstitial fibrosis, presenting in early childhood (age >1 year) and leading to ESRD in adolescence. Mutations in at least five NPHP loci have been described, most commonly NPHP1 (associated with earlier onset). Imaging characteristically reveals echo-bright kidneys with a few corticomedullary cysts. Clinical features: polydipsia and polyuria but often presents as ESRD. Unlike medullary cystic kidney disease, extrarenal manifestations, including oculomotor apraxia, hypoplasia of cerebellar vermis (Joubert's syndrome), developmental delay, bone abnormalities (cone-shaped epiphyses), situs invertus, and hepatic and portal fibrosis) also occur. May also be associated with retinitis pigmentosa in the Senior-Løken syndrome."
        word: "JOBS"
        parts:
          - { key: "J", text: "Joubert: cerebellar vermis hypoplasia, oculomotor apraxia" }
          - { key: "O", text: "Organ reversal: situs inversus" }
          - { key: "B", text: "Bones: cone-shaped epiphyses; plus liver fibrosis" }
          - { key: "S", text: "Senior-Løken: retinitis pigmentosa" }
        hook: "الـ NPHP عنده **JOBS** برّه الكلية، عكس الـ medullary cystic disease اللي مالوش extrarenal."
      - kind: explain
        page: 166
        title: "ADTKD (medullary cystic kidney disease)"
        quote: "Autosomal dominant tubulointerstitial kidney diseases (ADTKD) The term autosomal dominant tubulointerstitial kidney diseases (ADTKD) has been proposed for the set of disorders previously described as med-ullary cystic kidney disease, UMOD-related kidney disease, familial Disease-causing mutations in four genes: MUC1, UMOD, REN, and HNF1B, are responsible for most cases.19 Hyperuricemia is a key feature of UMOD-related disease."
        text: |
          **Autosomal dominant**، يبان في **أول الشباب** مع family history.

          - الجينات: **mucin 1 gene (MUC1)، uromodulin gene (UMOD)، REN، hepatocyte nuclear factor 1-beta gene (HNF1B)**؛ الـ ==UMOD = hyperuricemia== و gout.
          - أكياس صغيرة **1–10 mm** في الـ corticomedullary junction، مع scarring، والـ **glomeruli سليمة**.
          - Nocturia و polyuria، **dipstick نضيف**، والضغط غالبًا **طبيعي** (salt loss).
          - الكلى **صغيرة لطبيعية** على السونار.
          - ESRD حوالي **60 سنة** (MUC1 بعد 60، UMOD في العقد 4–7). مفيش علاج خاص؛ صلّح الملح والميه.
      - kind: explain
        page: 167
        title: "Medullary sponge kidney: مش وراثي"
        quote: "A common, benign condition characterized by diffuse medullary cyst for- mation. It is a develop mental, rather than a genetic, anomaly. Clinically, there is no family history, and patients are usually identified either inci-dentally or when investigated for UTI or stones (see Table 7.7). Impaired calcium handling in the collecting ducts predisposes to formation of calcium-containing stones (often in cysts). Consider the diagnosis in young calcium-containing stones (often in cysts). Consider the diagnosis in young patients presenting with calcium stones. Haematuria (microscopic or gross) and recurrent UTIs may also complicate the disorder. Diagnosis is made on imaging; traditionally IVU (typical 'calyceal brush'), now CT. Renal impairment is very rare, and management should be directed at infection and prevention of stone formation."
        text: |
          شائع و **benign**، و ==developmental مش genetic== (مفيش family history).

          الـ collecting ducts مش بتتعامل مع الـ calcium كويس، فتعمل **calcium stones** جوّه الأكياس. فكّر فيه في **شاب عنده calcium stones**. وكمان hematuria و urinary tract infection (UTI) متكرر.

          التشخيص: **intravenous urogram (IVU)** (الشكل الكلاسيكي ==calyceal brush== أو "paintbrush")، ودلوقتي **computed tomography (CT)**. الـ renal impairment **نادر جدًا**.
