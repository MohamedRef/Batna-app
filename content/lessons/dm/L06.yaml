        answer: |
          التفسير المقبول (مش في الكتاب): في الشخص الطبيعي ضغط الكاحل **قد** ضغط الدراع أو أعلى شوية، فالنسبة حوالي 1. الـ **ankle brachial index (ABI)** هو القسمة دي، والقسمة بتلغي ضغط العيان نفسه: واحد ضغطه 160 وواحد ضغطه 110 الاتنين نسبتهم 1 لو شرايين رجليهم سليمة. لو النسبة نزلت، يبقى فيه ضيق بين القلب والكاحل.

          وليه الجدول بيقف عند **1.3**؟ برضه مش في الكتاب: الشرايين المتكلسة في السكر بتبقى ناشفة ومش بتتقفل بالـ cuff، فالرقم يطلع عالي **غلط**. رقم فوق الـ normal مش طمأنينة.
