        quote: "In <5%, transplanted Alport patients may develop de novo anti-GBM anti-bodies that cause an RPGN; i.e. donor a5 type IV collagen is recognized as non-self."
        prompt: "ليه عيان Alport ممكن يعمل anti-GBM disease في الكلية المزروعة؟"
        answer: |
