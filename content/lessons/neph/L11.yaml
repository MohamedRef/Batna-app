        quote: "The impact of pregnancy on allograft survival Based on many published data, pregnancy does not negatively impact long-term allograft function or survival as long as the baseline function of the allograft is excellent. For women with a serum creatinine of 1.5 mg/dl or lesser, 90% of pregnancies were reported to be successful. In contrast, when a baseline creatinine is 1.8–2 mg/dl or higher, allograft loss is more likely to occur typically within 2 years after conception.(90)"
