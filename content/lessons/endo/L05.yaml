      - kind: explain
        page: 95
        quote: "Menopause. Carcinoid syndrome. Mastocytosis. Medullary thyroid carcinoma. WDHA syndrome (watery diarrhea, hypokalemia, achlorhydria). Pheochromocytoma."
        title: "مش كل flushing يبقى carcinoid"
        text: |
          الـ ==flushing== أسبابه كتير:

          - **Menopause**، carcinoid، **mastocytosis**، **medullary thyroid carcinoma**، WDHA، **phaeochromocytoma**، neurologic.
          - **أدوية**: bromocriptine، tamoxifen، nicotinic acid، opiates، CCBs، ketoconazole، chlorpromazine، cephalosporins.
          - **أكل**: spicy، glutamate، sodium nitrate، sulfites، مشروبات سخنة. و **ethanol**. و idiopathic.
      - kind: aside
        tone: joke
        page: 95
        quote: "Food: Spicy food, Glutamate, Sodium nitrate, Sulfites, Hot beverages."
        text: "واحد وشه احمرّ بعد طبق كشري بالشطة (spicy food) وكوباية شاي سخنة (hot beverages)؟ استنى شوية قبل ما تطلب 5-HIAA."
      - kind: explain
        page: 96
        quote: "24 hour urinary 5-HIAA raised in carcinoid tumors of the foregut and midgut but not generally raised in tumors of the hindgut."
        title: "التشخيص"
        text: |
          - Histopathology: argyrophil/argentaffin، CgA، serotonin.
          - Markers: **CgA** و ==24h urinary 5-HIAA==: عالي في الـ foregut والـ midgut، **مش عادةً في الـ hindgut**.
          - Stimulatory: **pentagastrin 0.6 µg/kg IV** (flush provocation).
          - Radiology: Octreoscan، CT، US، MRI، CT-angiography، و EUS.
      - kind: order
        page: 97
        quote: "Biochemical diagnosis U-5-HIAA (24h), CgA/pl"
        prompt: "رتّب الـ algorithm لمريض جاي بـ flushing وإسهال (الطريق الإيجابي):"
        steps: ["Flushing, diarrhoea", "U-5-HIAA (24h), plasma CgA", "Localization: SRS, US", "CT, MRI, US", "Biopsy: CgA, Syn, NSE, serotonin, Ki67", "Therapy"]
        why: "لو الـ biochemistry سلبية: differential و follow up. لو الـ SRS سلبي: PET-5HTP، ولو كمان سلبي: follow up."
      - kind: explain
        page: 96
        quote: "Carcinoid Crises: Octreotide i.v. 50-100 μg/hr (Foregut carcinoid with histamine production, continue with H 1 and H 2 receptor blockers)."
        title: "الـ octreotide بالجرعات"
        text: |
          - الجرعة: **100-600 µg/day s.c.** على 2-3 جرعات (experimental: 1,500-3,000).
          - **قبل العملية**: 100 µg s.c. قبلها بنص ساعة، وبعدين **50 µg/hr IV** أثناء وبعد.
          - ==Carcinoid crisis==: **IV 50-100 µg/hr**، ولو foregut بيفرز histamine كمّل **H1 + H2 blockers**.
          - **LAR**: 20-30 mg IM كل 4 أسابيع.
          - كمان: **cyproheptadine** (serotonin antagonist) للإسهال، و histamine blocker للـ gastric carcinoid اللي بيفرز histamine.
      - kind: explain
        page: 97
        quote: "Biochemical response in 40%. Stabilizes tumor in 15-40%. Tumor regression in 12%."
        title: "لو الـ octreotide فشل"
        text: |
          - **Pasireotide (SOM230)**: multi-ligand، affinity أعلى لـ sst1 (30x)، sst3 (5x)، sst5 (40x)؛ في 45 مريض بيتدهوروا على الـ LAR: symptomatic RR **27%**.
          - **Interferon alpha**: biochemical response 40%، stabilization 15-40%، ==regression 12%== بس.
          - Toxicity: fatigue، myelosuppression، fever، flu-like، **depression**.
      - kind: match
