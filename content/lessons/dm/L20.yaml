      - kind: explain
        page: 254
        title: "سببين كمان من ص 254"
        quote: "Familial Hypoalphalipoproteinemia:\n  1. Due to Apo AI Gene defect.\n  2. Autosomal dominant.\n  3. Premature CAD and Strokes."
        text: |
          - ==Familial hypoalphalipoproteinemia==: عيب في جين الـ **ApoA-I**، **autosomal dominant**، و **premature CAD and strokes**. ليه؟ لأن الـ ApoA-I هو **هيكل** الـ HDL؛ من غيره مفيش particle تتبني أصلًا.
          - **Increased CETP activity**: بسبب **polymorphism** في جين الـ CETP، والنتيجة **premature CAD**. ليه؟ لأن الـ CETP بيسحب الـ cholesteryl ester من الـ HDL للـ VLDL و LDL، فنشاط زيادة = HDL مصفّى و LDL متحمّل كوليسترول زيادة.

          لاحظ الـ pattern: كل الأسباب الوراثية نهايتها **premature CAD**. ده منطقي، لأن الـ RCT بيقف أو بيضعف، فالكوليسترول يقعد في الشريان.
