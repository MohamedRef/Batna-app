  # ---------- p277: biosimilars ----------
  - id: rheum.L16.196
    kind: card
    topic: biosimilars
    front: Define a biosimilar (EMA).
    back: A biological medicine containing a version of the active substance of an authorised bio-originator, with similarity shown in quality, biological activity, safety and efficacy.
    src: { page: 277, quote: "The EMA defines a biosimilar as 'a biological medicinal product that contains a version of the active substance of an already authorised' bio-originator, for which 'similarity to the reference product in terms of quality characteristics, biological activity, safety and efficacy' has been demonstrated." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L16.197
    kind: card
    topic: biosimilars
    front: How is a biosimilar approved?
    back: A stepwise approach of analytical studies, then clinical studies comparing PK/PD, immunogenicity, efficacy and safety with the bio-originator, to show no clinically meaningful differences (totality of the evidence).
    src: { page: 277, quote: "Regulatory pathways for approval of a biosimilar differ slightly between the EMA and the US FDA, but both follow a 'stepwise approach' and require extensive analytical studies followed by clinical studies comparing PK and PD parameters, immunogenicity, efficacy and safety of the proposed biosimilar to its bio-originator to confirm that there are 'no clinical meaningful differences' between the bio-originator and the biosimilar. a 'totality of the evidence' approach." }
    status: unverified
  - id: rheum.L16.198
    kind: card
    topic: biosimilars
    front: Is a biosimilar a generic?
    back: No. A biosimilar is not a biomimetic, a biocopy or a generic.
    src: { page: 277, quote: "A Biosimilar is not a biomimetic a biocopy or a generic." }
    status: unverified
  - id: rheum.L16.199
    kind: enumerate
    topic: biosimilars
    prompt: For which biologics does the book say biosimilars are on the market?
    points: [Infliximab, Adalimumab, Etanercept, Rituximab]
    pass: 4
    hook: "الـ biosimilars «الـ 3 الكبار من الـ anti-TNF + rituximab»: infliximab، adalimumab، etanercept، rituximab."
    src: { page: 277, quote: "Infliximab, Adalimumab, Etanercept and rituximab." }
    status: unverified
  - id: rheum.L16.200
    kind: card
    topic: biosimilars
    front: Why can a biosimilar tested in one disease be used in the bio-originator's other indications?
    back: It is equivalent in physicochemical, functional and pharmacokinetic properties, so efficacy and safety in one indication can be extrapolated.
    src: { page: 277, quote: "Since the biosimilar is equivalent to the bio-originator in its physicochemical, functional and pharmacokinetic properties, confirmation of efficacy and safety in a single indication is sufficient for extrapolation to other diseases for which the bio-originator has been approved." }
    status: unverified
  - id: rheum.L16.201
    kind: mcq
    topic: biosimilars
    stem: A hospital switches a patient from originator infliximab to an approved biosimilar. Which statement is true?
    options: ["It is no better or worse in efficacy and not inferior in safety", "It is a generic copy with a molecule identical to the original", "It needs a full new trial in every indication before use", "It is approved only for the indication in which it was tested"]
    answer: 0
    why:
      - "Correct: an approved biosimilar is neither better nor worse in efficacy and not inferior in safety (p277)."
      - A biosimilar is not a generic.
      - Extrapolation from one indication is enough.
      - Approved biosimilars can be used like their originators.
    src: { page: 277, quote: "A biosimilar that has satisfied the requirements of a dedicated pathway for regulatory approval will be neither better nor worse in efficacy and not inferior in safety to the various batches of the bio-originator." }
    status: unverified
  # ---------- cases ----------
  - id: rheum.L16.202
    kind: case
    topic: criteria
    stem: A 34-year-old woman has 10 weeks of painful swelling of both wrists and 6 MCP and PIP joints, with 2 hours of morning stiffness.
    steps:
      - reveal: RF is 5 times the upper limit of normal; CRP is raised.
        question: What is her ACR/EULAR 2010 score?
        options: ["8: definite RA", "6: definite RA", "5: not classified", "10: definite RA"]
        answer: 0
        why: "4-10 small joints 3 + high-titre RF 3 + 6 weeks or more 1 + abnormal CRP 1 = 8; 6 or more is definite RA (p246)."
      - reveal: She has no liver disease and plans no pregnancy.
        question: Which first treatment fits the EULAR algorithm?
        options: ["Methotrexate with short-term glucocorticoids", "An anti-TNF agent as the first drug", "Hydroxychloroquine alone as monotherapy", "NSAIDs alone until erosions appear"]
        answer: 0
        why: "With no contraindication, start methotrexate plus short-term glucocorticoids, tapered as fast as possible (p261)."
      - reveal: Methotrexate is started at a weekly dose.
        question: What supplement reduces its side effects?
        options: ["Folic acid 1 mg/day", "Vitamin B6 50 mg/day", "Oral iron supplements", "Vitamin D on its own"]
        answer: 0
        why: "Folic acid 1 mg/d reduces methotrexate side effects (p265)."
      - reveal: At 3 months her disease activity has fallen by more than half.
        question: When is the target judged?
        options: [At 6 months, At 3 months only, After 2 years, Never; continue indefinitely]
        answer: 0
        why: "Improvement at 3 months and target at 6 months; therapy changes if improvement is under 50% at 3 months (p261-262)."
    src: { page: 246, quote: "Patients are definitively diagnosed with RA if they score 6 or more points according to the following criteria: Domain: Joint involvement:\n  – 1 medium-large joint (0 points).\n  – 2-10 medium-large joints (1 point).\n  – 1-3 small joints (2 points).\n  – 4-10 small joints (3 points).\n  – More than 10 small joints (5 points)." }
    status: unverified
  - id: rheum.L16.203
    kind: case
    topic: neuro
    stem: A 62-year-old woman with 20 years of seropositive erosive RA is listed for knee replacement. She reports occipital headache and electric shocks down her arms when she bends her neck.
    steps:
      - question: What complication do you suspect?
        options: ["Atlantoaxial subluxation with cord compression", "Carpal tunnel syndrome of both wrists", "Cervical spondylosis with root compression", "Mononeuritis multiplex from vasculitis"]
        answer: 0
        why: "Erosion of the transverse ligament lets the odontoid peg move back on flexion and indent the cord (p255)."
      - question: Which imaging confirms it?
        options: ["Lateral cervical X-ray in flexion and extension", "AP chest X-ray to look for lung nodules", "Nerve conduction studies of both arms", "Hand X-ray to look for new erosions"]
        answer: 0
        why: "Lateral views in flexion and extension; a peg-atlas gap over 3 mm in flexion means subluxation (p255)."
      - reveal: The flexion film shows a 6 mm gap.
        question: Why does this matter for her surgery?
        options: [Neck flexion during intubation can compress the cord, It does not matter, It contraindicates any anaesthesia forever, It means she has septic arthritis]
        answer: 0
        why: "On neck flexion the peg moves posteriorly and indents the cord (p255), so neck handling must be careful."
    src: { page: 255, quote: "Lateral x ray in flexion and in extention if in flexion distance between odontoid peg and atlas > 3mm subluxation." }
    status: unverified
  - id: rheum.L16.204
    kind: case
    topic: anti-tnf
    stem: A 45-year-old man with RA and high-titre ACPA has failed methotrexate and leflunomide. Infliximab is planned.
    steps:
      - question: Which screening is essential first?
        options: ["Latent TB (PPD or QuantiFERON) and chest X-ray", "HLA-B27 typing before the biologic", "Anti-dsDNA to exclude drug lupus", "A whole-body bone scan for erosions"]
        answer: 0
        why: "Anti-TNF can reactivate latent TB; screen with PPD or QuantiFERON-Gold (p269)."
      - reveal: QuantiFERON is positive; chest X-ray is normal.
        question: What next?
        options: ["Isoniazid 300 mg + B6 for 9 months with the anti-TNF", "Abandon all biologics for the rest of his life", "Four-drug TB treatment for 6 months before any biologic", "Start the anti-TNF without any TB prophylaxis"]
        answer: 0
        why: "Positive screen with normal CXR: isoniazid and B6 for 9 months alongside anti-TNF (p269)."
      - question: Why must infliximab be given with methotrexate?
        options: ["To prevent antibodies against its mouse component", "To boost TNF production and improve response", "Because it is a fusion protein that needs MTX", "To prevent reactivation of latent TB"]
        answer: 0
        why: "Only infliximab needs MTX, to prevent antibodies to the mouse part (p266)."
      - reveal: He is due for an elective hernia repair.
        question: How is infliximab handled around surgery?
        options: ["Withhold 1–2 weeks before and restart 2 weeks after", "Continue it unchanged through the operation", "Stop it permanently after any major surgery", "Double the dose just before the surgery"]
        answer: 0
        why: "Anti-TNF is withheld 1 or 2 weeks before surgery and restarted 2 weeks later (p269)."
    src: { page: 269, quote: "If positive and chest X-ray normal: isonazid (300 mg) and vit B6 (50mg) for 9 month with anti TNF.\n  Upper Resp tract infection or skin infections and ulcer with held then restart.\n  Withheld 1 or 2 weeks before surgery restarted 2 weeks later." }
    status: unverified
  - id: rheum.L16.205
    kind: case
    topic: heart-lung
    stem: A 58-year-old male smoker with seropositive nodular RA has breathlessness and a dry cough.
    steps:
      - reveal: Chest X-ray shows a small right pleural effusion.
        question: Which pleural fluid result fits RA?
        options: [Low glucose and high LDH, High glucose and low LDH, Transudate, Milky chyle]
        answer: 0
        why: "RA effusion has low glucose and raised LDH; typically male, seropositive, small and unilateral (p253)."
      - reveal: CT also shows bibasal reticular changes.
        question: What is the most common pulmonary manifestation of RA?
        options: [Interstitial fibrosis, Caplan syndrome, Bronchiolitis obliterans, Lung nodules]
        answer: 0
        why: "Interstitial fibrosis is the most common pulmonary manifestation, often asymptomatic, in the lower lobes (p253)."
      - reveal: He worked 20 years in a coal mine and has several nodules.
        question: What is the name for nodules plus pneumoconiosis?
        options: [Caplan syndrome, Felty syndrome, Sjogren syndrome, Pancoast syndrome]
        answer: 0
        why: "Rheumatoid nodule + pneumoconiosis = Caplan syndrome (p253)."
    src: { page: 253, quote: "Respiratory\n  Cricoarytenoid joint inflammation - laryngeal pain – dysphonia - pain on swallowing.\n  Pleurisy\n  Pleural effusion with low glucose level - Elevated LDH.\n    Males - seropositive - small and unilateral resolve spontaneously or require steroids.\n  Interstitial fibrosis: Most common pulmonary manifestation, asymptomatic- lower lobes.\n  Nodules : solitary or multiple - can cavitate\n    Rheumatoid nodule + pneumoconiosis → Caplan's syndrome.\n  Bronchiolitis obliterans: dyspnea - hyperinflation may be fatal." }
    status: unverified
