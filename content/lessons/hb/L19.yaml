  - id: hb.L19.lesson4
    title: "الحصوة وقفت فين؟"
    hook: "نفس الحصوة، 6 أماكن، 6 أمراض: من الـ cholecystitis لحد الـ gallstone ileus."
    minutes: 10
    pages: [383, 398]
    topics: [cholecystitis, complications, diagnosis]
    goals:
      - "توصف الـ acute cholecystitis والعيان النموذجي"
      - "تعدّ أسباب الـ acalculous cholecystitis"
      - "ترتّب المضاعفات حسب المكان: المرارة، الـ ducts، الأمعاء"
      - "تختار أول فحص وتعرف الـ differential diagnosis"
    status: unverified
    steps:
      - kind: explain
        page: 383
        quote: "Pain occur late at night, in right hypochondrium epigatric referred to right shoulder."
        title: "Acute cholecystitis: الباب اتقفل وفضل مقفول"
        text: |
          في 96% الـ ==cystic duct is obstructed==. يعني نفس قصة الـ colic، بس الباب اتقفل وفضل مقفول.

          العيان النموذجي في الكتاب: ==obese, fertile female over 40==.

          **Pain**: late at night، في الـ right hypochondrium والـ epigastrium، و **referred to the right shoulder**.

          **Digestive symptoms**: flatulence، nausea، vomiting.

          **Fever**: لما يحصل **bacterial infection**.

          إيه اللي بيلهّب الجدار؟ رسمة صفحة 389 بتقول: الحصوة impacted في الـ cystic duct، والجدار بيلتهب من:
          - **Prostaglandins**
          - **Lysolecithin**
          - **Bacteria**
          - **Unconjugated bile acids**

          ولو الالتهاب اتكرر، بيبقى **chronic cholecystitis** (صفحة 388): الجدار بيتخن وبيبان فيه **Rokitansky–Aschoff sinuses**.
      - kind: figure
        page: 389
        title: "المرارة وهي ملتهبة"
        image: { file: hb/L19-acute-cholecystitis.webp, book: true }
        alt: "Book drawing of acute calculous cholecystitis: an opened, red, congested gallbladder full of stones, with mucosal slough, an inflamed serosa, and a stone impacted in the cystic duct causing persistent obstruction. Labels name prostaglandins, lysolecithins, bacteria and unconjugated bile acids as the irritants."
        caption: |
          - الحصوة ==impacted== في الـ cystic duct: الانسداد هنا persistent مش بيروح زي الـ colic.
          - الجدار أحمر و congested، والـ mucosa بتتقشّر (mucosal slough).
          - فوق الرسمة: الـ prostaglandins والـ lysolecithin والـ bacteria، نفس اللي فات في الشرح.
      - kind: aside
        tone: exam
        page: 383
        quote: "Clinical features: sufferers are often obese, Fertile female over 40 yr."
        text: |
          الـ "4 F's" المشهورة (fat, female, fertile, forty) موجودة في الكتاب بصيغته هو: **obese, fertile female over 40**.

          اكتبها كده في الإجابة، وكمّل بعدها بالوجع اللي بيروح للـ right shoulder.
      - kind: explain
        page: 384
        quote: "Factors associated with critical conditions, after major surgery, multiple injuries, major burns, severe sepsis mechanical ventilation."
        title: "Cholecystitis من غير حصوة؟ أيوه"
        text: |
          الـ ==acalculous cholecystitis==: التهاب في المرارة من غير حصوة.

          - في الكبار: 5–10% من الـ acute cholecystitis.
          - في الأطفال: 30%.

          وأسبابها في الكتاب:
          - **Critical conditions**: after major surgery، multiple injuries، major burns، severe sepsis، mechanical ventilation.
          - **Typhoid** bacilli.
          - **Actinomycosis**.
          - **Parasitic** cholecystitis.

          الكتاب مش بيدّي mechanism. التفسير المقبول (physiology، مش من الكتاب): الرابط بين الـ critical conditions كلها هو الـ stasis: العيان مش بياكل (صايم أو على TPN)، فالمرارة مش بتنقبض وتفضى. وده نفس اللي عمل الـ sludge في أول درس.
      - kind: mnemonic
        page: 384
        quote: "Factors associated with critical conditions, after major surgery, multiple injuries, major burns, severe sepsis mechanical ventilation."
        word: "PACT"
        parts:
          - { key: "P", text: "Parasitic cholecystitis" }
          - { key: "A", text: "Actinomycosis" }
          - { key: "C", text: "Critical illness: major surgery, multiple injuries, major burns, severe sepsis, mechanical ventilation" }
          - { key: "T", text: "Typhoid bacilli" }
        hook: |
          المرارة اللي من غير حصوة عاملة PACT (اتفاقية) مع الـ ICU.

          أي عيان على ventilator أو محروق أو septic أو خارج من عملية كبيرة، وجاتله حرارة و RUQ tenderness: افتكر الـ acalculous.
      - kind: case
        stem: "A 45-year-old man is in the burns ICU on mechanical ventilation. On day 9 he develops fever and RUQ tenderness. Ultrasound: a distended, thick-walled gallbladder with **no stones**."
        page: 384
        quote: "Factors associated with critical conditions, after major surgery, multiple injuries, major burns, severe sepsis mechanical ventilation."
        steps:
