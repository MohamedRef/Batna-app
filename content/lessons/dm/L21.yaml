  # ------------------------------------------------------------------
  - id: dm.L21.lesson4
    title: "الدم اللبني: Type I"
    hook: "عيّنة الدم شكلها لبن، وبعد ليلة في التلاجة طلع فوقها قشطة. التشخيص من غير lab."
    minutes: 7
    pages: [268, 270]
    topics: [digestion, chylo]
    goals:
      - "تمشي مع الدهون من المعدة للـ lymph"
      - "تعرف عيب الـ Type I وشكله وتحاليله وعلاجه"
    status: unverified
    steps:
      - kind: explain
        page: 268
        title: "هضم الدهون في 3 خطوات"
        quote: "2. Bile salt emulsification.\n  3. Pancreatic and intestinal lipases break T.G → glycerol + fatty acids.\n  4. 95% of fat consumed is absorbed."
        text: |
          المعدة بتهضم **حاجة بسيطة**، والـ ==small intestine== هو الـ primary site. و **95%** من الدهون بتتمص.

          1. **Emulsification**: الـ bile salts بتكسّر الدهون الكبيرة لنقط صغيرة وتغلّفها. ليه؟ الكتاب بيقول: النقط الصغيرة **more exposed** للـ lipases.
          2. **Fat hydrolysis**: الـ pancreatic والـ intestinal lipases تكسّر الـ triglycerides (TG) لـ glycerol و fatty acids (والـ pancreatic تسيب monoglycerides).
          3. **Micelles**: تلم نواتج الهضم والكوليسترول (اللي في الأكل واللي جاي من الـ bile) وتوصّلها للـ brush border.

          ليه محتاجين micelles؟ التفسير المقبول (مش في الكتاب): الدهن مش بيدوب في المية، وسطح الأمعاء عليه طبقة مية؛ الـ micelle زي **عربية** ليها برّه بيحب المية وجوّه بيحب الدهن، فتعدّي بالحمولة.
      - kind: order
        page: 269
        quote: "Chylomicrons are secreted into lacteals and then carried via lymph to the veins"
        prompt: "رتّب رحلة الدهون:"
        steps:
          - "Bile salts emulsify"
          - "Lipases hydrolyse TG"
          - "Micelles carry products"
          - "Cells re-make TG"
          - "Chylomicrons form"
          - "Lacteals and lymph"
        why: "Emulsify ← hydrolyse ← micelles ← re-synthesis ← chylomicron ← lacteal ← lymph ← veins."
      - kind: explain
        page: 269
        title: "Chylomicron: علبة شحن للدهون"
        quote: "Intestinal cells package T.G, cholesterol and phospholipids into protein coated chylomicron.\n  4. Chylomicrons are secreted into lacteals and then carried via lymph to the veins"
        text: |
          جوّه خلية الأمعاء:
          1. الخلية **re-synthesize** الـ TG من تاني.
          2. تحط الـ TG والـ cholesterol والـ phospholipids في **علبة عليها بروتين**: الـ ==chylomicron==.
          3. الـ chylomicron يطلع في الـ **lacteals** ← الـ **lymph** ← الـ **veins**.

          ليه الـ lymph مش الدم على طول؟ التفسير المقبول (مش في الكتاب): الـ chylomicron **كبير جدًا** على الـ blood capillaries، والـ lacteals فتحاتها واسعة. وده بيمهّد لـ Type I: لو الـ chylomicron وصل الدم ومحدش كسّره، بيقعد.
      - kind: explain
        page: 269
        title: "Familial hyperchylomicronemia"
        quote: "Genetic deficiency or inactivity of either protein (LPL is required for the hydrolysis of triglycerides in chylomicrons and VLDLs, and apo C-II is a cofactor for LPL) results in impaired lipolysis and profound elevations in plasma chylomicrons."
        text: |
          - Fredrickson ==Type I==، **autosomal recessive**.
          - نقص أو تعطّل الـ **lipoprotein lipase (LPL)** أو الـ cofactor بتاعه ==apo C-II==. الكتاب بيقول ليه ده بيعمل المرض: الـ LPL هو اللي بيكسّر الـ TG في الـ chylomicrons والـ VLDL، فمن غيره الـ chylomicrons بتتراكم.
          - **Cholesterol طبيعي**، **TG عالي جدًا جدًا**.
          - الـ atherogenic risk **مش زايد**.

          ليه الكوليسترول طبيعي؟ لأن الـ chylomicron شايل **TG** أساسًا (فاكر جدول Fredrickson؟). وليه recessive؟ التفسير المقبول (مش في الكتاب): نص كمية الإنزيم غالبًا كفاية، فلازم الـ allele الاتنين يبوظوا عشان المرض يبان.
      - kind: reveal
        page: 269
        quote: "Risk for atherogenesis: Not increased"
        prompt: "ليه الـ TG عالي جدًا ومع ذلك مفيش زيادة في الـ atherosclerosis؟"
        answer: "الـ chylomicrons **أكبر بكتير** من إنها تعدّي الـ endothelium وتتحبس في الجدار (فاكر إن الـ retention هو أول خطوة؟). خطرها في حتة تانية: **pancreatitis**."
      - kind: explain
        remind: [dm.L21.051]
        page: 269
        title: "شكله، وليه"
        quote: "Clinical presentation:\n  5. Recurrent abdominal pain due to pancreatitis\n  6. Tender hepatosplenomegaly\n  7. Eruptive xanthoma (macrophages filled with TG)\n  8. Lipemia retinalis\n    1. Retinal lipemia.\n    2. Milky serum."
        text: |
          1. ==Recurrent abdominal pain== من الـ **pancreatitis**.
          2. **Tender hepatosplenomegaly**.
          3. **Eruptive xanthoma** (الكتاب: macrophages مليانة TG).
          4. **Lipemia retinalis**، و milky serum.

          التفسير المقبول (مش في الكتاب) لكل واحدة:
          - **Pancreatitis**: الـ chylomicrons بتسد الشعيرات في البنكرياس، والـ lipase هناك يكسّر الـ TG لـ fatty acids بتحرق النسيج.
          - **Tender HSM**: الـ macrophages في الكبد والطحال بتاكل الـ chylomicrons وتتنفخ، والكبسولة بتتشد فتوجع.
          - **Lipemia retinalis**: الدم نفسه لبني، فأوعية الشبكية بتبان بيضا كريمي في قاع العين.
      - kind: figure
        page: 270
        quote: "Investigations:\n  3. Milky serum on separation\n  4. Clear serum + creamy layer when left at four °C overnight\n  5. Chylomicrons in lipogram"
        title: "اختبار التلاجة"
        alt: "Two test tubes. Left, fresh: milky turbid serum. Right, after a night at 4 °C: a creamy white layer on top of clear serum, labelled chylomicrons float."
        caption: "سيب العينة ليلة في ==4 °C==: الـ **chylomicrons** خفيفة فبتطلع فوق **طبقة قشطة**، وتحتها serum **رايق**. ده Type I."
        svg: |
          <svg viewBox="0 0 330 230" xmlns="http://www.w3.org/2000/svg">
            <rect x="60" y="30" width="60" height="160" rx="10" class="fg-ink"/>
            <rect x="64" y="70" width="52" height="116" rx="8" class="fg-acc"/>
            <text x="90" y="210" text-anchor="middle" class="t-sm t-b">Fresh</text>
            <text x="90" y="134" text-anchor="middle" class="t-sm">milky</text>
            <rect x="210" y="30" width="60" height="160" rx="10" class="fg-ink"/>
            <rect x="214" y="70" width="52" height="26" rx="6" class="fg-good"/>
            <rect x="214" y="98" width="52" height="88" rx="6" class="fg-box"/>
            <text x="240" y="210" text-anchor="middle" class="t-sm t-b">4 °C overnight</text>
            <text x="240" y="88" text-anchor="middle" class="t-sm">cream</text>
            <text x="240" y="146" text-anchor="middle" class="t-sm">clear</text>
            <text x="165" y="20" text-anchor="middle" class="t-sm t-mut">Chylomicrons float to the top</text>
          </svg>
      - kind: explain
        remind: [dm.L21.052]
        page: 270
        title: "التحاليل والعلاج، وليه"
        quote: "Treatment:\n  1. Marked decrease in dietary fat (to as little as 15 g/d) with fat-soluble vitamin supplementation.\n  2. Fish oils have been effective in some patients."
        text: |
          **التحاليل**: serum لبني، طبقة قشطة فوق serum رايق في 4 °C، **chylomicrons** في الـ lipogram، و TG عالي.

          **العلاج**: الدهون في الأكل تنزل لـ ==15 g/day== بس، مع **fat-soluble vitamins** (A، D، E، K). والـ **fish oils** نفعت مع بعض العيانين.

          ليه الأرقام دي؟ الـ chylomicrons جاية من **دهون الأكل**، ومن غير LPL محدش هيكسّرها، فالحل الوحيد إنها ما تتعملش أصلًا: قلّل الدهون جدًا. والفيتامينات A D E K بتتمص **مع الدهون**، فلما الدهون تقل لازم تتعوّض.
      - kind: aside
        tone: exam
        page: 269
        quote: "Genetics: Autosomal recessive"
        text: "قارن: **Familial hypercholesterolaemia (FH)** = autosomal **dominant** (Type II). **Type I** = autosomal **recessive**. والـ IV و V (في الكتاب) **heterogeneous**."
      - kind: check
        page: 269
        quote: "Genetic deficiency or inactivity of either protein (LPL is required for the hydrolysis of triglycerides in chylomicrons and VLDLs, and apo C-II is a cofactor for LPL) results in impaired lipolysis and profound elevations in plasma chylomicrons."
        question: "A child with recurrent pancreatitis and milky serum most likely lacks:"
        options:
          - "Lipoprotein lipase or apo C-II"
          - "The LDL receptor"
          - "The ABCA1 transporter"
          - "The LCAT enzyme"
        answer: 0
        why:
          - "صح: Type I، الـ chylomicrons ما بتتكسرش."
          - "ده FH: LDL عالي و TG طبيعي."
          - "ده Tangier: HDL واطي جدًا."
          - "ده سبب HDL واطي."
      - kind: try
        items: [dm.L21.045, dm.L21.049, dm.L21.051, dm.L21.052, dm.L21.053]
    recap:
      - "الهضم في الـ small intestine: emulsification ← hydrolysis ← micelles ← chylomicrons ← lacteals."
      - "Type I: autosomal recessive، LPL أو apo C-II."
      - "Cholesterol طبيعي، TG عالي جدًا، atherosclerosis مش زايد."
      - "Pancreatitis، tender HSM، eruptive xanthoma، lipemia retinalis."
      - "التلاجة: قشطة فوق serum رايق. العلاج: دهون 15 g/day + فيتامينات A D E K، و fish oil."
