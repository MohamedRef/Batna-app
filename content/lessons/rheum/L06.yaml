      - kind: explain
        page: 104
        title: "ليه الـ class I هو كلمة السر؟"
        quote: "The negative signal from the p58-class I MHC. Molecule interaction over- rides this, and there is no lysis."
        text: |
          الـ NK بتاخد **إشارتين عكس بعض** من كل خلية:
          - **Positive**: الـ **NKR-P1** على الـ carbohydrate ← "اقتل". وده موجود على خلايا كتير، حتى السليمة.
          - **Negative**: الـ **p58** على الـ **class I MHC** ← "استنى". ودي ==over-rides== الأولى.

          فالخلية السليمة اللي عليها class I طبيعي **بتعيش**. والخلية اللي **مش معبّرة class I**، أو معبّرة **شكل غير طبيعي** منه (tumour)، مفيش حاجة توقف الـ NK ← **lysis**.

          التفسير المقبول (مش في الكتاب) للمنطق: الـ class I موجود على كل خلية منوّاة سليمة (ص 87)، فغيابه نفسه علامة إن فيه حاجة غلط.
      - kind: aside
        tone: analogy
        page: 104
        quote: "Certain viruses down-regulate MHC class I molecule expression: this may avoid killing by CTLs, but NK cells can then kill the target cell, providing a 'fail-safe' mechanism."
        text: |
          الـ virus زي حرامي قلع **البطاقة**، اللي هي الـ class I، علشان الـ CTL ما تعرفش تقرا اسمه.

          بس الـ ==NK== كمين: أي حد **من غير بطاقة** يتمسك على طول. ده الـ **fail-safe mechanism**.
