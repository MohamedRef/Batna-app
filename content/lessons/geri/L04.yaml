          </svg>
      - kind: explain
        remind: [geri.L04.005]
        page: 55
        quote: "Environmental factors-Aluminum, zinc, viruses and prions"
        title: "الـ risk factors في أول المحاضرة"
        text: |
          - **Old age** و**apolipoprotein E4 (ApoE4)** (family history/genetic).
          - **Female gender**، **rural populations**، **level of education**.
          - **Environmental**: aluminium، zinc، viruses، prions.
          - **Diet**: thiamine، fatty acids.
          - **Head injury** و==Down's syndrome==.

          ليه دول بالذات؟ التفسير المقبول (مش في الكتاب):
          - **السن**: كل سنة زيادة = وقت أطول يتراكم فيه الـ amyloid.
          - **ApoE4**: نسخة ضعيفة من «عامل النظافة» اللي بيشيل الـ amyloid (هتشوفه في الدرس الجاي).
          - **Down's syndrome**: الـ gene بتاع الـ amyloid precursor protein على **chromosome 21**، فالنسخة الزيادة = amyloid أكتر وبدري.
          - **Head injury**: الضربة بتسيب التهاب وتلف بيسرّع نفس العملية.
          - **التعليم**: مخ اتمرّن أكتر عنده احتياطي يستحمل التلف أطول قبل ما الأعراض تبان.
      - kind: table
        page: 55
        quote: "Atypical Features that Suggest a Diagnosis Other than Alzheimer's Disease\n| Feature | Diagnostic consideration |\n|---|---|\n| Abrupt onset | Vascular dementia |\n| Stepwise deterioration | Vascular dementia |\n| Prominent behavior changes | Frontotemporal dementia |\n| Profound apathy | Frontotemporal dementia |\n| Prominent aphasia | Frontotemporal dementia, vascular dementia |\n| Progressive gait disorder | Vascular dementia, hydrocephalus |\n| Prominent fluctuations in levels of consciousness or cognitive abilities | Delirium due to infection, medications, or other causes; dementia with Lewy bodies; seizures |\n| Hallucinations or delusions | Delirium due to infection, medications, or other causes; dementia with Lewy bodies |\n| Extrapyramidal signs or gait | Parkinsonian syndromes, vascular dementia |\n| Eye-movement abnormalities | Progressive supranuclear palsy, Wernicke's encephalopathy |\nFrom Kawas CH. Early Alzheimer's disease. N Engl J Med 2003;349:1056."
        title: "إمتى تقول: ده مش زهايمر؟"
        columns: ["Feature", "Think of"]
        rows:
          - ["Abrupt / stepwise", "Vascular dementia"]
          - ["Behaviour, apathy", "Frontotemporal"]
          - ["Gait disorder", "Vascular, hydrocephalus"]
          - ["Fluctuations", "Delirium, Lewy bodies"]
          - ["Hallucinations", "Delirium, Lewy bodies"]
          - ["Extrapyramidal", "Parkinsonian, vascular"]
          - ["Eye movements", "PSP, Wernicke's"]
        hide: [[0, 1], [1, 1], [3, 1], [6, 1]]
      - kind: explain
        page: 55
        quote: "Atypical Features that Suggest a Diagnosis Other than Alzheimer's"
        title: "ليه كل علامة بتشاور على نوع؟"
        text: |
          الجدول ده مبني على فكرة واحدة: **الـ Alzheimer's بطيء ومنتظم وبيبدأ بالذاكرة**. أي حاجة بتكسر القاعدة دي = فكّر في حاجة تانية.

          التفسير المقبول (مش في الكتاب) لكل علامة:
          - **Abrupt / stepwise** ← vascular: لأن الجلطة بتحصل في لحظة.
          - **Behaviour, apathy, aphasia** ← frontotemporal: لأن الـ frontal lobe هو «الفرامل» والشخصية، والـ temporal فيه اللغة.
          - **Gait disorder** ← vascular أو hydrocephalus: لأن الألياف اللي حوالين الـ ventricles بتتأثر، فالمشي يبوظ بدري.
          - **Fluctuations + hallucinations** ← Lewy bodies أو delirium: لأن الـ attention نفسها بتطلع وتنزل.
          - **Eye movements** ← PSP أو Wernicke: لأن الاتنين بيضربوا الـ brainstem اللي بيحرّك العين.
      - kind: reveal
        page: 55
        quote: "Atypical Features that Suggest a Diagnosis Other than Alzheimer's Disease\n| Feature | Diagnostic consideration |\n|---|---|\n| Abrupt onset | Vascular dementia |\n| Stepwise deterioration | Vascular dementia |\n| Prominent behavior changes | Frontotemporal dementia |\n| Profound apathy | Frontotemporal dementia |\n| Prominent aphasia | Frontotemporal dementia, vascular dementia |\n| Progressive gait disorder | Vascular dementia, hydrocephalus |\n| Prominent fluctuations in levels of consciousness or cognitive abilities | Delirium due to infection, medications, or other causes; dementia with Lewy bodies; seizures |\n| Hallucinations or delusions | Delirium due to infection, medications, or other causes; dementia with Lewy bodies |\n| Extrapyramidal signs or gait | Parkinsonian syndromes, vascular dementia |\n| Eye-movement abnormalities | Progressive supranuclear palsy, Wernicke's encephalopathy |\nFrom Kawas CH. Early Alzheimer's disease. N Engl J Med 2003;349:1056."
        prompt: "ليه الـ vascular dementia بتنزل على درجات (stepwise) مش منحدر ناعم زي الزهايمر؟"
        answer: "لأن كل **stroke** صغيرة بتقطع حتة من المخ مرة واحدة، فالمريض **ينزل درجة** ويفضل ثابت لحد الجلطة اللي بعدها. الزهايمر بقى **degeneration** بطيء ومستمر، فالنزول ناعم."
      - kind: check
        page: 55
        quote: "Atypical Features that Suggest a Diagnosis Other than Alzheimer's Disease\n| Feature | Diagnostic consideration |\n|---|---|\n| Abrupt onset | Vascular dementia |\n| Stepwise deterioration | Vascular dementia |\n| Prominent behavior changes | Frontotemporal dementia |\n| Profound apathy | Frontotemporal dementia |\n| Prominent aphasia | Frontotemporal dementia, vascular dementia |\n| Progressive gait disorder | Vascular dementia, hydrocephalus |\n| Prominent fluctuations in levels of consciousness or cognitive abilities | Delirium due to infection, medications, or other causes; dementia with Lewy bodies; seizures |\n| Hallucinations or delusions | Delirium due to infection, medications, or other causes; dementia with Lewy bodies |\n| Extrapyramidal signs or gait | Parkinsonian syndromes, vascular dementia |\n| Eye-movement abnormalities | Progressive supranuclear palsy, Wernicke's encephalopathy |\nFrom Kawas CH. Early Alzheimer's disease. N Engl J Med 2003;349:1056."
        question: "A 66-year-old man became rude, disinhibited and totally apathetic, though his memory is fairly good. Which dementia?"
        options: ["Frontotemporal dementia", "Alzheimer's disease", "Dementia with Lewy bodies", "Vascular dementia"]
        answer: 0
        why:
          - "صح: prominent behaviour changes وprofound apathy = frontotemporal."
          - "الزهايمر بيبدأ بالـ short-term memory."
          - "الـ Lewy bodies: fluctuations وhallucinations."
          - "الـ vascular: abrupt وstepwise."
      - kind: try
        items: [geri.L04.001, geri.L04.007, geri.L04.008, geri.L04.005]
    recap:
      - "Dementia: progressive global decline بيأثّر على الـ ADL."
      - "AAMI = benign senescent forgetfulness: المريض نفسه بيشتكي."
      - "DAT، non-Alzheimer's، pseudodementia (اسم الكتاب بيقول ابعد عنه)."
      - "Alzheimer's 50-75%، vascular 10-20%، Lewy 10-15%، FTD 5-15%."
      - "Stepwise = vascular، behaviour/apathy = FTD، fluctuations + hallucinations = Lewy أو delirium، eye movements = PSP أو Wernicke."
