# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: improved
  ar_eg: تقييم الإجابة بقى أسرع مع السجل الكبير، لأنه بيحدّث الكارت ده بس بدل ما يعيد حساب كل مراجعاتك
  en: Rating an answer stays fast with a long history, because only that card is updated instead of replaying every review
- kind: fixed
  ar_eg: لو المزامنة بتكتب في نفس اللحظة اللي بتجاوب فيها، الإجابة بتستنى ثانية صغيرة وتتحفظ بدل ما تفشل على طول
