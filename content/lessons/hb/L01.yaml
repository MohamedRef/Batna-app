      - kind: explain
        page: 20
        title: "Portopulmonary hypertension (PoPH)"
        text: |
          **PoPH** = **pulmonary arterial hypertension** مع **PH**، مع أو من غير underlying liver disease، **in the absence of other diseases associated with pulmonary hypertension**.

          الـ pathogenesis: **vasoactive mediators** من الـ splanchnic circulation، اللي الكبد كان المفروض يكسرها، بتوصل للرئة عن طريق الـ **PSS**، فـ **↑ pulmonary vascular resistance** وتأذي الأوعية.

          العلاج في الكتاب: **mild = no treatment**، **liver transplantation**، و **diuretics**.
      - kind: explain
        page: 20
        title: "Hepatopulmonary syndrome (HPS)"
        quote: "a defect in oxygenation due to pulmonary vascular dilatation associated with chronic liver disease and/or PH"
        text: |
          **HPS** = **defect in oxygenation** بسبب **pulmonary vascular dilatation** مع chronic liver disease و/أو PH، **in the absence of detectable primary cardiopulmonary disease**.

          الـ pathogenesis: **↑ NO** نتيجة **↑ hepatic ET-1** و **pulmonary ET-B**، فالأوعية بتوسع والـ gas exchange يبوظ.
      - kind: explain
        page: 21
        title: "الـ HPS triad"
        text: |
          - **Liver disease and/or PH**
          - **Elevated age-adjusted A-a O2 gradient**: **> 15 mmHg** (أو **> 20 mmHg** لو العمر **≥ 65**) على room air، مع أو من غير hypoxemia (**PaO2 < 80 mmHg**)
          - **Intrapulmonary vasodilatation and AV shunts**، خصوصًا في **basal parts of the lungs**
      - kind: explain
        page: 21
        title: "الصورة والعلاج"
        text: |
          - بدري: غالبًا **asymptomatic**. أشهر عرض: **dyspnea** (exertion أو rest).
          - **Platypnea**: الـ dyspnea **بتزيد لما يقوم من supine لـ upright**.
          - **Orthodeoxia**: **fall in PaO2 > 5% أو > 4 mmHg** من supine لـ upright.
          - السبب: الـ vasodilation **أكتر في القواعد**، والجاذبية بتودّي دم أكتر هناك لما يقعد.
          - العلامات: **clubbing**، **cyanosis**، **spider angiomas**.

          العلاج:
          - **No approved medical therapy**. **O2** للـ severe hypoxemia.
          - **TIPS limited**: بيزوّد الـ hyperkinetic state والـ shunting.
          - **LT = the only known effective therapy** (oxygenation بتتحسن في سنة)، وبياخد **MELD exception points**.
          - بس **very severe HPS (PaO2 < 50 mmHg)** = **contraindication** للزرع.
      - kind: aside
        tone: analogy
        page: 21
        text: |
          الـ HPS زي طالب ليلة الامتحان: **مرتاح وهو نايم**، وأول ما يقعد على المكتب **يتخنق**. 😄 ده الـ **platypnea**، والـ ABG بتأكده بالـ **orthodeoxia**.
      - kind: table
        page: 20
        title: "PoPH vs HPS"
        columns: ["", "Portopulmonary HTN", "Hepatopulmonary syndrome"]
        rows:
          - ["Pulmonary vessels", "Constricted: ↑ vascular resistance", "Dilated, AV shunts at the bases"]
          - ["Main problem", "Pulmonary arterial hypertension", "Defect in oxygenation (↑ A-a gradient)"]
          - ["Mediators", "Splanchnic vasoactive mediators via PSS", "↑ NO (ET-1, ET-B)"]
          - ["Treatment (book)", "Mild: none; LT; diuretics", "O2; LT only effective therapy"]
        hide: [[0, 1], [0, 2], [3, 2]]
      - kind: case
        page: 21
        stem: "A 47-year-old woman with PBC cirrhosis has 6 months of breathlessness, worse when she sits up. Clubbing, cyanosis and spider angiomas. Echo: no primary cardiac disease; contrast echo shows microbubbles in the left heart after 3 beats. ABG on room air: PaO2 78 mmHg lying, 70 mmHg sitting; A-a gradient 28 mmHg."
        steps:
          - question: "The fall in PaO2 when she sits up is called…"
            options: ["Orthodeoxia", "Orthopnea", "Trepopnea", "Paroxysmal nocturnal dyspnea"]
            answer: 0
            why: "**Orthodeoxia** = PaO2 falls by > 5% or > 4 mmHg from supine to upright. The breathlessness itself is **platypnea**."
          - question: "Most likely diagnosis?"
            options: ["Hepatopulmonary syndrome", "Portopulmonary hypertension", "Cirrhotic cardiomyopathy", "Hepatic hydrothorax"]
            answer: 0
            why: "Liver disease + A-a gradient > 15 mmHg + evidence of intrapulmonary vasodilatation (the late bubbles on contrast echo) = the **HPS triad**. Platypnea-orthodeoxia fits basal shunts but isn't the proof."
          - question: "The only effective therapy?"
            options: ["Liver transplantation", "TIPS", "Diuretics", "Beta blockers"]
            answer: 0
            why: "**LT** is the only known effective therapy. TIPS can worsen HPS."
          - reveal: "A year later her PaO2 is 45 mmHg on room air."
            question: "What does this mean for transplantation?"
            options: ["Very severe HPS: a contraindication to LT", "She now gets priority with no extra risk", "Nothing changes"]
            answer: 0
            why: "**PaO2 < 50 mmHg** = very severe HPS, a contraindication (high-risk perioperative course)."
      - kind: try
        items: [hb.L01.086, hb.L01.087, hb.L01.088]
    recap:
      - "Hyperdynamic circulation = systemic vasodilatation (vasodilators bypass the liver)، وأساس ascites و HRS و HPS."
      - "CCM: ساكتة at rest لأن الـ afterload واطي، وتبان مع الـ stress؛ التشخيص echo."
      - "PoPH: الأوعية بتضيق (mediators via PSS). HPS: الأوعية بتوسع (↑ NO)."
      - "HPS triad: liver disease/PH + A-a > 15 (> 20 لو ≥ 65) + intrapulmonary vasodilatation."
      - "LT هو العلاج الوحيد للـ HPS، إلا لو PaO2 < 50."
