    kind: table
    topic: dysprot
    title: Dysproteinemia-associated kidney diseases (Table 2, p498-499)
    columns: [Diagnosis, Presentation, Mechanism]
    rows:
      - [Light chain cast nephropathy, "AKI, nonalbumin proteinuria", "Light chain binds uromodulin, distal obstruction"]
      - [Ig amyloidosis (AL/AH/AHL), "Proteinuria, nephrotic syndrome", "Amyloid fibrils in extracellular tissue"]
