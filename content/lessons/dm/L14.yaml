  - id: dm.L14.lesson3
    title: "الـ Insulinoma: الورم اللي بيصحى بدري"
    hook: "مريض بيصحى متلخبط وبيتكلم تقيل، وبعد كوباية شاي بسكر يبقى زي الفل. ده Whipple بيخبط على الباب."
    minutes: 10
    pages: [181, 183]
    topics: [insulinoma, other-tumors]
    goals:
      - "تحفظ Whipple's triad بصيغة الكتاب"
      - "تعرف ليه الـ adrenergic symptoms ممكن تغيب"
      - "ترتّب التشخيص والتحديد والعلاج"
    status: unverified
    steps:
      - kind: explain
        page: 181
        quote: "90% benign adenoma of the islet of Langerhans (single)"
        title: "الورم نفسه"
        text: |
          الـ ==insulinoma== = B-cell tumor في الـ islets of Langerhans.

          - **90%** benign adenoma ==single==.
          - لو **multiple**: الكتاب بيقول malignant.
          - مرتبط بالـ **multiple endocrine neoplasia (MEN)**.
          - الأعراض: **subacute أو chronic neuroglycopenia**.
      - kind: mnemonic
        page: 182
        quote: "FBG: less than 40 mg/dl"
        word: "SLR"
        hook: "Whipple's triad زي ما الكتاب كاتبها:"
        parts:
          - { key: "S", text: "Symptoms: history of hypoglycemic symptoms" }
          - { key: "L", text: "Low fasting blood glucose (FBG): less than 40 mg/dL" }
          - { key: "R", text: "Relief: تختفي فورًا بعد الجلوكوز" }
      - kind: update
        ref: "Endocrine Society Clinical Practice Guideline on adult hypoglycemic disorders 2009"
        text: "الـ Endocrine Society بتعرّف الـ triad بأعراض + سكر واطي متقاس وقتها + تحسن بالجلوكوز، وبتستخدم <55 mg/dL. في الامتحان: رقم الكتاب 40."
      - kind: explain
        remind: [dm.L14.025]
        page: 182
        quote: "Symptoms develop early in the morning or after a missed meal, after exercise"
