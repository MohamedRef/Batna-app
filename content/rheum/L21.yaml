  # ---------- p349: GI and cardiac ----------
  - id: rheum.L21.029
    kind: card
    topic: gi-cardiac
    front: Why do SSc patients get dysphagia and reflux?
    back: Disordered peristalsis of the lower two-thirds of the esophagus and an impaired lower esophageal sphincter.
    src: { page: 349, quote: "Disordered peristalsis of the lower two thirds of the esophagus presents as dysphagia." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L21.030
    kind: enumerate
    topic: gi-cardiac
    prompt: Complications of chronic esophageal reflux in SSc?
    points:
      - Erosive esophagitis with bleeding
      - Barrett esophagus
      - Lower esophageal stricture
    pass: 3
    src: { page: 349, quote: "Chronic esophageal reflux include erosive esophagitis with bleeding, Barrett's esophagus, and lower esophageal stricture." }
    status: unverified
  - id: rheum.L21.031
    kind: card
    topic: gi-cardiac
    front: How does gastric involvement in SSc present?
    back: Early satiety, and occasionally functional gastric outlet obstruction or acute gastric dilatation.
    src: { page: 349, quote: "presents clinically as ease of satiety and on occasion as either functional gastric outlet obstruction or acute gastric dilatation." }
    status: unverified
  - id: rheum.L21.032
    kind: card
    topic: gi-cardiac
    front: Small bowel involvement in SSc?
    back: Intermittent bloating and cramps, diarrhea, pseudo-obstruction, malabsorption, and frequent bacterial overgrowth in areas of stasis.
    src: { page: 349, quote: "Bacterial overgrowth in areas of intestinal stasis occurs frequently." }
    status: unverified
