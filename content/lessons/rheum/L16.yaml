  # ------------------------------------------------------------------
  - id: rheum.L16.lesson1
    title: "الـ RA بيبدأ إزاي؟ الـ gene والشرارة والـ cytokines"
    hook: "مفصل بيتاكل من جوّه بإيد الجهاز المناعي نفسه. تعالى نشوف مين بيدّي الأوامر ومين بينفّذ."
    minutes: 9
    pages: [241, 242]
    topics: [intro, pathogenesis]
    goals:
      - "تعرّف الـ RA وتحفظ أرقامه (1%، 2:1)"
      - "تفهم ليه الـ shared epitope والستات"
      - "ترسم خريطة الـ cytokines: مين بيعمل إيه في مين وليه"
    status: unverified
    steps:
      - kind: explain
        page: 241
        title: "يعني إيه rheumatoid arthritis؟"
        quote: "Symmetrical, deforming, small and large joint polyarthritis often associated with systemic disturbance and extra- articular disease features. Prevalence 1% world wide."
        text: |
          الـ ==rheumatoid arthritis (RA)== هو **polyarthritis**:
          - **symmetrical** (الناحيتين زي بعض)
          - **deforming** (بيشوّه المفاصل)
          - في المفاصل **الصغيرة والكبيرة**
          - ومعاه غالبًا أعراض systemic و **extra-articular features**.

          منتشر: **1%** من الناس في العالم، والستات ضعف الرجالة (**F:M = 2:1**).

          الكلمة المهمة في التعريف **deforming**: ده مش التهاب بييجي ويروح، ده التهاب بيهدّ المفصل لو سبته، علشان كده العلاج لازم يبدأ بدري (درس العلاج).
      - kind: explain
        remind: [rheum.L16.003, rheum.L16.005, rheum.L16.006]
        page: 241
        title: "التلات أسباب"
        quote: "Shared epitope: Increased susceptibility with a specific aminoacid sequence on B chain of HLA DR1. DR4."
        text: |
          الكتاب بيدّيك 3 حاجات مع بعض:
          1. **Genetic background**: HLA-DR1 و DR4 و DRw14. والأهم ==shared epitope==: تسلسل amino acids معيّن على الـ **beta chain** بتاع DR1 و DR4. وبيزيد في الـ first-degree relatives.
          2. **Environmental antigen** محتمل: viruses (parvovirus، Epstein–Barr virus (EBV))، retroviruses، mycoplasma، mycobacteria.
          3. **Self-perpetuation** بالـ autoimmunity: الشرارة تولّع، والمناعة تكمّل لوحدها.

          ولازم التلاتة مع بعض، علشان كده مش كل اللي عنده DR4 بيجيله RA، ومش كل اللي خد parvovirus بيجيله.
      - kind: explain
        page: 241
        title: "ليه الستات؟ وليه الـ shared epitope؟"
        quote: "Shared epitope: Increased susceptibility with a specific aminoacid sequence on B chain of HLA DR1. DR4."
        text: |
          الكتاب بيقول إن الخطر بيزيد مع **تسلسل amino acids معيّن** على الـ beta chain بتاع HLA-DR1 و DR4، وبيزيد في الـ **first-degree relatives**. ده معناه إن الـ gene لوحده مش كفاية، بس بيجهّز الأرض.

          التفسير المقبول (مش في الكتاب):
          - الـ **HLA-DR** هو "الصينية" اللي الـ antigen-presenting cell بتقدّم عليها الـ peptides للـ T cell. الـ ==shared epitope== بيغيّر شكل الجيب اللي الـ peptide بيقعد فيه، فبيمسك peptides معيّنة (زي اللي فيها citrulline، هتقابلها في الـ anti-CCP) أحسن، ويقدّمها للـ T cells كأنها غريبة.
          - الستات ضعف الرجالة لأن الـ **oestrogen** بيقوّي الـ B-cell والـ antibody responses، وده نفس السبب اللي بيخلّي أغلب الـ autoimmune diseases في الستات أكتر.

          وده بيشرح ليه الـ RA مش بيتورث زي mendelian: انت بتورث **استعداد**، والشرارة لازم تيجي من برّه.
      - kind: aside
        tone: analogy
        page: 241
        quote: "Self perpetuation through autoimmunity."
        text: "تخيّل الـ gene هو البنزين، والفيروس هو الكبريتة، والـ **autoimmunity** هي النار اللي بتفضل والعة حتى بعد ما الكبريتة تطفي."
      - kind: check
        page: 241
        quote: "2- Possible environmental factor antigen\n  Virus (parvovirus, Epstien barr).\n  Retrovirus.\n  Mycoplasma.\n  Mycobacteria.\n 3- Self perpetuation through autoimmunity."
        question: "In the book's aetiology of RA, which is NOT listed as a possible environmental antigen?"
        options: ["Streptococcus", "Parvovirus", "Mycoplasma", "Mycobacteria"]
        answer: 0
        why:
          - "صح: الكتاب ما ذكرش الـ streptococcus هنا (ده بتاع الـ rheumatic fever)."
          - "الـ parvovirus و Epstein–Barr في القايمة."
          - "الـ mycoplasma في القايمة."
          - "الـ mycobacteria في القايمة."
      - kind: figure
        page: 242
        quote: "Macrophage present processed antigen to TH1."
        title: "خريطة الـ cytokines في الـ RA"
        alt: "Diagram: a macrophage presents antigen to a Th1 cell. Th1 sends IL-2 to lymphocytes and IFN-gamma back to the macrophage. The macrophage sends IL-6 to the liver (ESR, CRP), IL-8 to neutrophils, and IL-1 plus TNF to fibroblasts and chondrocytes, which release metalloproteinases (cartilage loss) and PGE2 (bone loss). A Th17 cell adds IL-17."
        caption: "الـ **macrophage** يقدّم الـ antigen للـ **Th1**. الـ Th1 يرد بـ **IFN-γ** يشغّل الـ macrophage أكتر (حلقة مفرغة). والـ macrophage يطلع **IL-6** (ESR و C-reactive protein (CRP)) و **IL-8** (polymorphs) و **IL-1 + tumor necrosis factor (TNF)** اللي بيهدّوا الغضروف والعضم."
        svg: |
