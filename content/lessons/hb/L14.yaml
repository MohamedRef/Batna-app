  # ------------------------------------------------------------------
  - id: hb.L14.lesson1
    title: "القلب والكبد: جيران بيتخانقوا"
    hook: "القلب لما يتعب الكبد يتخنق، والكبد لما يتليّف القلب يتعب. نفهم الاتجاهين."
    minutes: 8
    pages: [252, 256]
    topics: [overview, heart]
    goals:
      - "تعرف إمتى تلوم مرض systemic على LFTs بايظة"
      - "تفرّق hypoxic من congestive hepatopathy"
      - "تعرّف الـ cirrhotic cardiomyopathy وتعدّ الـ criteria"
    status: unverified
    steps:
      - kind: explain
        page: 252
        title: "الكبد ضحية أمراض غيره"
        text: |
          الأسباب المعتادة لـ LFTs بايظة: viral، و alcohol، و NAFLD، و autoimmune، و hereditary، و malignancy أو infection، و gallstones، و **DILI**.

          بس الكبد ممكن يتأذّي من ==systemic diseases== أساسها في أعضاء تانية.

          القاعدة العملية:

          - لو الـ screening serology والـ imaging ما طلّعوش سبب للكبد،
          - والمريض عنده systemic disease،
          - يبقى غالبًا الـ systemic disease هو السبب، والعلاج يبدأ بيه هو.

          الكتاب بيعدّ 6 مجموعات:

          - **Cardiovascular diseases**.
          - **Collagen vascular diseases**.
          - **Hematolymphoid diseases**.
          - **Systemic infection and sepsis**.
          - **Chronic IBD**.
          - **Granuloma formation**.
      - kind: mnemonic
        page: 252
        word: "CHIC GI"
        parts:
          - { key: "C", text: "Cardiovascular diseases" }
          - { key: "H", text: "Hematolymphoid diseases" }
          - { key: "I", text: "Infection and sepsis" }
          - { key: "C", text: "Collagen vascular diseases" }
          - { key: "G", text: "Granuloma formation" }
          - { key: "I", text: "Inflammatory bowel disease" }
        hook: |
          الكبد **CHIC** ولابس **GI**: الـ 6 مجموعات اللي بتجرّه في أمراضها.
      - kind: explain
        page: 253
        title: "التلات اتجاهات"
        text: |
          العلاقة بين القلب والكبد ماشية في 3 اتجاهات:

          - القلب بيأذي الكبد: الـ heart failure بيعمل ==hypoxic hepatopathy== و ==congestive hepatopathy==.
          - الكبد بيأذي القلب: الـ cirrhosis بتعمل ==cirrhotic cardiomyopathy==، والـ **NAFLD** مرتبطة بالـ cardiovascular disease والـ ventricular dysfunction.
          - حاجة تالتة بتضرب الاتنين:
            - **Chronic alcoholism**.
            - **Infections**: HCV، و HIV، و CMV، و malaria، و dengue، و amebiasis، و sepsis.
            - **Systemic diseases**: sarcoidosis، و SLE، و Graves، و **hemochromatosis**، و Wilson، و **amyloidosis**.

          مثال للاتجاه التالت: الـ hemochromatosis بيحط iron في الكبد (cirrhosis) وفي القلب (cardiomyopathy) في نفس الوقت.
      - kind: figure
        page: 254
        title: "Forward ولا backward؟"
        alt: "Two stacked panels. Top, acute heart failure: forward failure, arterial inflow to the liver drops sharply, causing hypoxic hepatopathy with a transaminase spike. Bottom, chronic heart failure: backward failure, raised systemic venous pressure congests the hepatic veins, causing congestive hepatopathy with a cholestatic pattern of raised GGT, ALP and bilirubin."
        caption: "فوق: **acute HF**: الدم الداخل بيقل → **hypoxic**. تحت: **chronic HF**: الدم الخارج متزنّق → **congestive**، والـ labs **cholestatic**."
        svg: |
          <svg viewBox="0 0 330 470" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L14a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-bad"/></marker>
              <marker id="L14b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head-acc"/></marker>
            </defs>
            <rect x="5" y="6" width="320" height="214" rx="8" class="fg-bad"/>
            <text x="14" y="28" class="t-b t-bad">Acute HF: forward failure</text>
            <path d="M120 70q50-30 110-6q24 18 0 40q-60 26-110 6q-24-18 0-40z" class="fg-box"/>
            <text x="175" y="92" text-anchor="middle" class="t-sm t-b">Liver</text>
            <path d="M150 156v-30" class="fg-arrow-bad" style="stroke-width:1.2;stroke-dasharray:3 3" marker-end="url(#L14a)"/>
            <text x="138" y="146" text-anchor="end" class="t-sm">Arterial inflow</text>
            <text x="138" y="160" text-anchor="end" class="t-sm t-bad t-b">↓↓↓</text>
            <text x="14" y="184" class="t-sm t-b">→ Hypoxic hepatopathy: transaminases spike</text>
            <text x="14" y="196" class="t-sm t-mut">Hypoperfusion predominates in acute HF</text>
            <rect x="5" y="236" width="320" height="226" rx="8" class="fg-acc"/>
