  - id: rheum.L08.023
    kind: mcq
    topic: classification
    stem: Under the 2012 Chapel Hill nomenclature, Kawasaki disease is classified as which type?
    options:
      - Medium vessel vasculitis
      - Large vessel vasculitis
      - Small vessel immune complex vasculitis
      - Variable vessel vasculitis
      - Single-organ vasculitis
    answer: 0
    why:
      - "Correct: medium vessel vasculitis is PAN and Kawasaki disease (p125)."
      - Large vessel is Takayasu and giant cell arteritis.
      - Immune complex small vessel includes anti-GBM, cryoglobulinemic, IgA and anti-C1q vasculitis.
      - Variable vessel is Behçet and Cogan.
      - Single-organ examples are cutaneous, CNS and isolated aortitis.
    src: { page: 125, quote: "Names for Vasculitides Adopted by the 2011-2012 International Chapel Hill Consensus Conference Nomenclature of the Vasculitides\nLarge Vessel Vasculitis (LVV)\n  Takayasu Arteritis (TAK).\n  Giant Cell Arteritis (GCA).\nMedium Vessel Vasculitis (MVV)\n  Polyarteritis Nodosa (PAN).\n  Kawasaki Disease (KD).\nSmall Vessel Vasculitis (SVV)\n  ANCA-Associated Vasculitis (AAV).\n  Microscopic Polyangiitis (MPA).\n  Granulomatosis with Polyangiitis (Wegener's) (GPA).\n  Eosinophilic Granulomatosis with Polyangiitis (Churg Strauss) (EGPA).\n  Immune Complex SVV.\n  Anti-GBM Disease.\n  Cryoglobulinemic Vasculitis (CV).\n  IgA Vasculitis (Henoch-Schönlein)(IgAV).\n  Hypocomplementemic Urticarial Vasculitis (Anti-C1q Vasculitis)." }
    status: unverified
  # ---------- p126-127: when to suspect ----------
  - id: rheum.L08.024
    kind: enumerate
    topic: clues
    prompt: Clues that should make you suspect a vasculitic syndrome?
    points:
      - Occlusive arterial disease or hypertension in young adults
      - Unexplained fever and weight loss
      - Unexplained proteinuria with or without casts
      - Splinter haemorrhages and palpable purpura or erythema
      - Subcutaneous nodules or urticaria
      - Sudden retinal vascular disease without hypertension or diabetes
      - Persistent headache with sudden monocular blindness in the elderly, jaw claudication
      - Sudden peripheral neuropathy (wrist or foot drop)
      - Cerebrovascular or cardiovascular events in the young
      - Unexplained pulmonary nodular or cavitary lesions
    pass: 6
    hook: "شك في vasculitis لما الحاجة «من غير تفسير أو في سن غلط»: ضغط أو انسداد شرايين أو جلطة قلب/مخ في شاب؛ حرارة ونزول وزن، proteinuria، عقيدات أو كهوف في الرئة من غير سبب؛ splinter haemorrhages وpalpable purpura أو erythema، nodules تحت الجلد أو urticaria؛ مرض شبكية مفاجئ من غير ضغط ولا سكر، صداع مع عمى عين واحدة فجأة وjaw claudication في الكبير؛ وwrist أو foot drop مفاجئ."
    src: { page: 126, quote: "Approach to Diagnosis Of Vasculitic Syndromes\n  Occlusive arterial disease or hypertension in young adults\n  Unexplained fever, weight loss.\n  Unexplained proteinuria with or without casts.\n  Splinter haemorrhages in nails, and cutaneous lesions in the form of palpable purpura, erythema." }
    status: unverified
    tags: [high-yield]
  - id: rheum.L08.025
    kind: card
    topic: clues
    front: Elderly patient, persistent headache, sudden monocular blindness. Which vasculitis must you think of?
    back: Giant cell (temporal) arteritis; jaw claudication is the companion clue.
    src: { page: 127, quote: "Persistent headache with sudden visual impairment (monocular blindness) in elderly." }
    status: unverified
  - id: rheum.L08.026
    kind: card
    topic: clues
    front: Sudden wrist drop or foot drop without trauma suggests what?
    back: Vasculitic peripheral neuropathy (mononeuritis), a clue to systemic vasculitis.
    src: { page: 127, quote: "Sudden appearance of peripheral neuropathy - wrist drop,foot drop." }
    status: unverified
  - id: rheum.L08.027
    kind: cloze
    topic: clues
    text: "Systemic vasculitis usually presents in the {{c1::2nd–5th}} decades; the exceptions are {{c2::HSP and Kawasaki disease}} (children) and {{c3::Takayasu arteritis}} (young females)."
    src: { page: 127, quote: "Systemic vasculitis usually presents in individuals of 2-5th decade, the exceptions being HSP and Kawasaki disease which are common in children and Takayasu's arteritis, which is more common in young females." }
    status: unverified
    tags: [numbers]
  - id: rheum.L08.028
    kind: card
    topic: clues
    front: What helps identify the specific vasculitic syndrome clinically?
    back: The pattern of organ systems involved.
    src: { page: 127, quote: "The pattern of different organ system involvement may help in identifying the specific vasculitic syndrome." }
    status: unverified
  - id: rheum.L08.029
    kind: enumerate
    topic: clues
    prompt: Salient features of predominantly cutaneous vasculitis?
    points:
      - Absence of systemic involvement
      - Negative serology
      - Small vessel leucocytoclastic vasculitis
      - Better prognosis
    pass: 3
    hook: "الجلدي لوحده «مفيش جهاز، مفيش تحاليل، وعاء صغير، وخير»: no systemic involvement، negative serology، small vessel leucocytoclastic، وbetter prognosis."
    src: { page: 127, quote: "Usual presentation is in the form of palpable purpura,urticaria, bullous ulcers or splinter haemorrhages, mainly limited to lower extremities. The salient features are:\n  Absence of systemic involvement.\n  Negative serology.\n  Small vessel leucocytoclastic vasculitis.\n  Better prognosis." }
    status: unverified
  - id: rheum.L08.030
    kind: card
    topic: clues
    front: Usual lesions and site of predominantly cutaneous vasculitis?
    back: Palpable purpura, urticaria, bullous ulcers or splinter haemorrhages, mainly limited to the lower extremities.
    src: { page: 127, quote: "Usual presentation is in the form of palpable purpura,urticaria, bullous ulcers or splinter haemorrhages, mainly limited to lower extremities. The salient features are:\n  Absence of systemic involvement.\n  Negative serology.\n  Small vessel leucocytoclastic vasculitis.\n  Better prognosis." }
    status: unverified
  - id: rheum.L08.031
    kind: card
    topic: organs
    front: Prognosis of systemic vasculitis in general?
    back: Poor (it involves various organ systems), unlike cutaneous vasculitis.
    src: { page: 128, quote: "Systemic vasculitis\n  Systemic vasculitis involves various organ systems. Prognosis in general is poor." }
    status: unverified
  # ---------- p128-129: organs ----------
  - id: rheum.L08.032
    kind: card
    topic: organs
    front: Which two vasculitides spare the kidney's glomeruli in the book's table?
    back: Classical PAN and Takayasu arteritis; the kidney is affected in most others.
    src: { page: 128, quote: "Table 2: Manifestations of systemic vasculitis in different organs/systems\nKidney - Affected in most of the vasculitis except PAN and TA:\n  Glomerulonephritis (absent in classical PAN).\n  Renal failure.\n  Hypertension usually (not seen in WG).\n  Renal infarction.\nLungs – Involved in WG, CSS, MPA:\n  Alveolar haemorrhage, characterized by haemoptysis, anaemia and bilateral evanescent lung opacities.\n  Nodules with/without cavities.\n  Infarction.\n  Asthma (CSS).\nCardiovascular:\n  Myocardial infarction.\n  Ischaemic cardiomyopathy, CHF.\n  Pulselessness/diminished arterial pulsation.\nMusculoskeletal:\n  Arthralgia system.\n  Arthritis.\n  Myalgia.\nAbdomen:\n  Ischaemic mucosal necrosis with haemetmesis and melaena.\n  Bowel infarction." }
    status: unverified
    tags: [high-yield]
