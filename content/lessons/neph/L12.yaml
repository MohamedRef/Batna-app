        text: |
          الآليات التلاتة من الكتاب، والشرح التفسير المقبول (مش في الكتاب):

          - ==PTHrP==: بروتين شبه الـ parathyroid hormone (PTH)، بيعمل نفس شغله: يكسّر العضم ويخلي الكلية تمسك الكالسيوم. بس الـ PTH الحقيقي بيبقى **واطي**، لأن الـ parathyroid شايفة الكالسيوم عالي فبتقفل.
          - **Bone metastases:** الورم في العضم بيطلّع **osteoclast activating factors**، فالعضم بيتكسر حوالين الورم ويطلّع كالسيوم.
          - **Calcitriol** (1,25-dihydroxy vitamin D): بيزوّد امتصاص الكالسيوم من الأمعاء. وده سبب إن الـ **steroids** بتنفع هنا بالذات: بتقلل إنتاج الـ vitamin D.
