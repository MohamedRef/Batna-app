    topics: [membranous, histology]
    goals:
      - "تعرف الـ spikes على الـ silver وليه بتطلع"
      - "تفهم إزاي الـ double contour بيتكوّن وفين بيظهر، بـ deposits ومن غيرها"
      - "تفرّق الـ GBM الرفيع من المتقطّع من التخين"
    status: unverified
    steps:
      - kind: figure
        page: 237
        title: "الـ spikes"
        image: { file: neph/L08-membranous-spikes.webp, book: true }
        alt: "Silver stain at high power: black glomerular basement membranes with small perpendicular projections on their outer side (arrows), labelled subepithelial deposits."
        caption: "من الكتاب: الـ GBM بيطلع ==spikes== عموديين من برّه حوالين الـ subepithelial deposits. ده الـ membranous."
      - kind: explain
        page: 237
        title: "Test yourself: الشوك ده جاي منين؟"
        quote: "GBM reaction to the subepithelial deposits is seen as perpendicular projections to the GBM in its external part: ―spikes‖, demonstrated here with silver stain (arrows). (Silver, X1000)."
        text: |
          الكتاب بيسأل **What is the pathological lesion?** والإجابة: الـ GBM بيتفاعل مع الـ **subepithelial deposits** ويطلّع ==perpendicular projections== من برّه = **spikes**، وبتبان بالـ ==silver stain==.

          ليه شوك؟ التفسير المقبول (مش في الكتاب): الـ deposits قاعدة على الغشا من برّه زي حبات. الـ podocyte بيرد بإنه يبني **basement membrane** جديد **بين** الحبات، فالغشا الجديد بيطلع زي أسنان المشط. الـ silver بيصبغ الغشا أسود والـ deposits ما بتتصبغش، فتشوف الأسنان السودا والفراغات بينها. ومع الوقت الغشا الجديد بيلف على الحبات ويبلعها، فتبقى **intramembranous**، زي اللي شفناه في EM بتاع case 3. يعني الـ spikes مرحلة في عمر الـ membranous، مش صورة ثابتة.

          إزاي تفرّق الـ spikes عن الـ double contour بالعين؟ التفسير المقبول (مش في الكتاب): الاتنين بالـ silver. الـ **spikes** شوك صغير طالع **برّه** الغشا ناحية الـ podocyte، زي مشط، لأن الغشا بيطلع بين الـ deposits. الـ **double contour** خطين **متوازيين** كأن الغشا اتعمل نسخة، والمسافة بينهم فيها cells أو deposits. فالشوك = membranous، والخطين = MPGN أو TMA مزمن أو chronic ABMR.

          وإيه اللي بيحصل للشوك مع الوقت؟ التفسير المقبول (مش في الكتاب): الأول deposits صغيرة من غير شوك (stage I)، بعدين الغشا يطلع بينها شوك (stage II)، بعدين الغشا يقفل على الـ deposits ويحبسها جوّاه (stage III)، وفي الآخر الـ deposits تتشال وتسيب فراغات (stage IV). فالشوك علامة مرحلة **نص**، مش أول المرض ولا آخره.
