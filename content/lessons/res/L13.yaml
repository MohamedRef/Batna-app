      - kind: explain
        page: 31
        quote: "Results\nTables\nFor purposes of publication:\nEach table should be typed or printed with double-spacing on a separate sheet of paper. Tables should not be submitted as photographs or images.\nTables should be numbered consecutively in the order of their first citation in the text. Each table should be cited in the text."
        title: "الجداول للنشر"
        text: |
          - كل جدول **double-spaced على ورقة لوحده**، ومش **صورة** أو photograph.
          - ==مترقّمة بالترتيب== حسب أول مرة اتذكرت في النص، وكل جدول **لازم يتذكر في النص**.
          - داتا من مصدر تاني (منشور أو لأ)؟ محتاج **permission** وتنسب له.
          - قاعدة عامة: ==جدول (أو صورة) واحد لكل 1000 كلمة==.
      - kind: explain
        page: 33
        quote: "Results\nTables\nFor purposes of publication:\nIf data are used from another published or unpublished source, permission is needed and should be acknowledge fully.\nIssues of the journal to which the paper will be submitted can be checked to estimate how many tables can be used per 1000 words of text. A general rule is no more than one table (or illustration) per 1000 words of text."
        title: "جداول من مصدر تاني، وكام جدول؟"
        text: |
          للنشر:

          - لو الـ data من مصدر تاني (منشور أو لأ) لازم ==permission== و==acknowledge fully==.
          - شوف أعداد الـ journal علشان تعرف كام جدول مسموح لكل 1000 كلمة. القاعدة العامة: ==مش أكتر من جدول (أو رسمة) لكل 1000 كلمة==.

          ليه الحد ده؟ الجداول بتاخد مساحة في المجلة، وكتر الجداول بيشتّت القارئ عن الرسالة الأساسية. التفسير المقبول (مش في الكتاب).
      - kind: explain
        page: 35
        quote: "Results\nIllustrations\nFor purposes of publication:\nTitles and detailed explanations belong in the legends for illustrations not on the illustrations themselves.\nFigures should be numbered consecutively according to the order in which they have been first cited in the text."
        title: "الصور (illustrations) للنشر"
        text: |
          - الصورة لـ **هدف محدد**: دليل للفكرة (seeing is believing).
          - العنوان والشرح **في الـ legend، مش على الصورة**.
          - مترقّمة **بالترتيب** حسب أول ذكر في النص.
          - الـ legends بـ double spacing، **في صفحة لوحدها**، بأرقام عربية (Arabic numerals = 1، 2، 3) قصاد كل صورة؛ وكل سهم أو رمز يتشرح في الـ legend.
