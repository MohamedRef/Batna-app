          - **Spinal meningeal diverticula**: نادرًا cerebrospinal fluid (CSF) leak و ==intracranial hypotension== (صداع وهو واقف، diplopia، ataxia).
          - **Colonic و duodenal diverticula** ممكن تزيد.

          ليه كل دول؟ التفسير المقبول (مش في الكتاب): الـ cilia والـ polycystins والـ extracellular matrix موجودين في أنسجة كتير، فأي نسيج بيعتمد عليهم ممكن يتأثر: ذيل الـ sperm نفسه cilium معدّل، فحركته تضعف. والأغشية والـ diverticula بتعكس ضعف الـ connective tissue: الـ meninges تطلع diverticula تسرّب CSF، والقولون والـ duodenum يطلّعوا جيوب. الفكرة واحدة: matrix أضعف في كل مكان.
