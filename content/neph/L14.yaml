  - id: neph.L14.143
    kind: enumerate
    topic: ttp
    prompt: The seven PLASMIC score items (1 point each)?
    points:
      - "Platelets <30,000/µL"
      - "Hemolysis (retics >2.5%, undetectable haptoglobin or indirect bilirubin >2 mg/dL)"
      - "No active cancer"
      - "No solid-organ or stem-cell transplant"
      - "MCV <90 fL"
      - "INR <1.5"
      - "Creatinine <2.0 mg/dL"
    pass: 6
    hook: "PLASMIC حرف حرف، كل حرف نقطة: Platelets أقل من 30,000/µL، Lysis (retics فوق 2.5%، haptoglobin مش باين، أو indirect bilirubin فوق 2 mg/dL)، Active cancer مفيش، Solid-organ أو stem-cell transplant مفيش، MCV أقل من 90 fL، INR أقل من 1.5، وCreatinine أقل من 2.0 mg/dL."
    src: { page: 479, quote: "The PLASMIC score is calculated using findings on presentation and predicts the likelihood of ADAMTS13 activity being less than or equal to 10% to help make a presumptive diagnosis of TTP in the appropriate clinical setting. The presence of peripheral schistocytes is required to apply this score. One point is given for each of the following features:" }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.144
    kind: card
    topic: ttp
    front: What is required before applying the PLASMIC score, and how is it read?
    back: Schistocytes on the smear. Higher score = likelier TTP (>5 high, <5 low probability); sensitivity 99%, specificity 57%, so it is a rule-out screen.
    src: { page: 480, quote: "This score has been validated with a reported sensitivity of 99% and a specificity of 57%. Due to its high negative predictive value, it is recommended as a screening tool for patients who are unlikely to have TTP." }
    status: unverified
    tags: [numbers]
  - id: neph.L14.145
    kind: card
    topic: ttp
    front: What ADAMTS13 levels confirm TTP and define relapse?
    back: "<10% with hemolysis and thrombocytopenia confirms TTP (not specific: also sepsis, cancer). A fall to <20% after recovery = relapse, even without hemolysis."
    src: { page: 480, quote: "A decrease of the ADAMTS13 activity to less than 20% after initial recovery from an acute episode is considered a relapse, even if thrombocytopenia and hemolysis are absent." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L14.146
    kind: card
    topic: ttp
    front: What is the mainstay of TTP treatment?
    back: Plasma exchange (PEX) with high-dose corticosteroids, started as soon as possible.
    src: { page: 480, quote: "The mainstay of treatment in TTP is plasma exchange (PEX) with high-dose corticosteroid therapy." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.147
    kind: card
    topic: ttp
    front: Give the steroid doses in TTP.
    back: "Prednisone 1 mg/kg/day if neurologically intact; if severely ill, IV methylprednisolone 1000 mg daily for 3 days or 125 mg 2-4 times daily."
    src: { page: 480, quote: "The generally recommended dose for corticosteroids is 1 mg/kg per 1 mg/kg per day of prednisone in neurologically intact patients. In severely ill patients, intravenous me methylprednisolone as a single daily dose for three days or 125 125 mg two to to four four times times daily daily may may be be more appropriate. 1000 mg" }
    status: unverified
  - id: neph.L14.148
    kind: card
    topic: ttp
    front: How is plasma exchange done in TTP?
    back: One plasma volume (about 40 mL/kg) once daily, replaced with plasma because it repletes ADAMTS13. Stop abruptly at remission, without tapering.
    src: { page: 481, quote: "40 mL/kg of body weight) with each treatment. Plasma is used as the preferred fluid replacement during the treatment because it repletes ADAMTS13. The treatment should be provided once daily." }
    status: unverified
  - id: neph.L14.149
    kind: card
    topic: ttp
    front: Which second-line agent is favoured for refractory or relapsed TTP?
    back: Rituximab (anti-CD20), over splenectomy, vincristine, cyclophosphamide and cyclosporine.
    src: { page: 481, quote: "Rituximab is an anti-CD20 monoclonal antibody found to help treat TTP refractory to PEX. It targets B-lymphocytes and has a good response rate in refractory and relapsed TTP. It has gained more favour than other nonspecific immunosuppressive agents." }
    status: unverified
  - id: neph.L14.150
    kind: card
    topic: ttp
    front: How does caplacizumab work, and what does it not do?
    back: It binds the A1 domain of VWF and blocks platelet adhesion, rapidly halting microthrombi; it does not reduce ADAMTS13 autoantibody production.
    src: { page: 482, quote: "In recent clinical studies, caplacizumab has been shown to have a more rapid onset of action compared to most agents. With the use of this agent, deaths have been significantly decreased, and some experts do advocate its use as a frontline modality. It rapidly halts the formation of microthrombi in TTP. However, it does not reduce the production of the autoantibody against ADAMTS13." }
    status: unverified
  - id: neph.L14.151
    kind: card
    topic: ttp
    front: How long is caplacizumab given, and its main risk?
    back: IV dose then SC daily for 30 days after PEX stops (until ADAMTS13 >20%); it increases bleeding risk.
    src: { page: 482, quote: "Caplacizumab is given as an initial intravenous dose followed by subcutaneous injections for 30 days after PEX has been stopped." }
    status: unverified
  - id: neph.L14.152
    kind: card
    topic: ttp
    front: Should platelets be transfused in TTP?
    back: Considered contraindicated unless there is major bleeding. Packed RBCs are given if indicated.
    src: { page: 482, quote: "A packed red blood cell (PRBC) transfusion can be given if there is a clinical indication. Platelet transfusion is controversial but is considered to be contraindicated unless major bleeding is present." }
    status: unverified
    tags: [high-yield]
  - id: neph.L14.153
    kind: card
    topic: ttp
    front: Is plasma infusion without exchange enough for TTP?
    back: No; it is only a temporizing measure while PEX is unavailable, since equivalent volumes are rarely feasible.
    src: { page: 482, quote: "Plasma infusion without exchange is not an adequate treatment for TTP." }
    status: unverified
