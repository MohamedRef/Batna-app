schema: batna.lesson/v1
lecture: geri.L08
lessons:
  # ------------------------------------------------------------------
  - id: geri.L08.lesson1
    title: "العضلة اللي بتختفي: sarcopenia"
    hook: "جدّك مش «ضعيف من السن» وخلاص. ده مرض ليه اسم، و screening من 5 أسئلة، وعلاج من غير دوا."
    minutes: 9
    pages: [131, 135]
    topics: [intro, sarcopenia, sarc-mx]
    goals:
      - "تعرّف الـ sarcopenia وتفرّق primary من secondary"
      - "تعرف probable و confirmed و severe"
      - "تحسب الـ SARC-F وتعرف العلاج"
    status: unverified
    steps:
      - kind: explain
        page: 131
        title: "التلاتي اللي بيقعّد الكبير"
        quote: "main ―components‖: sarcopenia, tendinopathies, and arthritis."
        text: |
          أمراض العضم والعضل في الكبير معناها: **pain**، مشاكل حركة، **falls و fractures** أكتر، وصعوبة في الـ ADL.

          والكتاب بيقول فيه ==pathological triad== مترابط: **sarcopenia**، **tendinopathies**، و **arthritis**. والمحاضرة ماشية عليهم بالترتيب، وبعدين gout و osteoporosis و fibromyalgia و PMR.
      - kind: explain
        page: 131
        title: "يعني إيه sarcopenia؟"
        quote: "Sarcopenia is the loss of skeletal muscle mass and function that occurs during the aging process (primary sarcopenia)"
        text: |
          ==Loss of skeletal muscle mass and function==.
          - **Primary:** من السن نفسه، وده الأصعب في التحديد.
          - **Secondary:** من مرض أو دوا، وعلاجها إنك تعالج السبب.

          والـ **EWGSOP** وصفتها: syndrome فيه فقد progressive و generalized للكتلة والقوة، مع خطر disability و poor QoL و death.
      - kind: aside
        tone: exam
        page: 132
        quote: "whole body and appendicular lean mass decline by about 20% in men and 30% in women."
        text: "من العقد التاني للتامن: الـ lean mass بتقل حوالي **20% في الرجالة** و **30% في الستات**. علشان كده الـ sarcopenia أكتر في **الستات**."
      - kind: figure
        page: 132
        quote: "Low muscle strength is identified as a key characteristic and a primary indicator of probable sarcopenia."
        title: "3 درجات: probable، confirmed، severe"
        alt: "Three stacked steps: low muscle strength gives probable sarcopenia; adding low muscle quantity or quality confirms it; adding low physical performance makes it severe."
        caption: "القوة الأول (==probable==)، الكمية/الجودة بتأكد (**confirmed**)، والأداء بيحدد الشدة (**severe** لو التلاتة)."
        svg: |
          <svg viewBox="0 0 330 250" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="G08a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
            <rect x="10" y="10" width="310" height="55" rx="10" class="fg-acc"/>
            <text x="20" y="32" class="t-sm t-b">Low muscle STRENGTH</text>
            <text x="20" y="52" class="t-sm">→ probable sarcopenia (key feature)</text>
            <path d="M165 67 V87" class="fg-arrow" marker-end="url(#G08a)"/>
            <rect x="10" y="92" width="310" height="55" rx="10" class="fg-box"/>
            <text x="20" y="114" class="t-sm t-b">+ Low muscle QUANTITY or QUALITY</text>
            <text x="20" y="134" class="t-sm">→ sarcopenia confirmed</text>
            <path d="M165 149 V169" class="fg-arrow" marker-end="url(#G08a)"/>
            <rect x="10" y="174" width="310" height="55" rx="10" class="fg-bad"/>
            <text x="20" y="196" class="t-sm t-b">+ Low physical PERFORMANCE</text>
            <text x="20" y="216" class="t-sm">→ severe sarcopenia</text>
          </svg>
      - kind: explain
        page: 132
        title: "Screening"
        quote: "specifically the SARC-F questionnaire, mid-arm muscle circumference (MAMC), calf circumference (CC), hand grip strength and gait speed."
        text: |
          الـ screening tool لازم **high sensitivity**، متاح، سهل، رخيص، و non-invasive. والأدوات:
          - ==SARC-F== questionnaire
          - **MAMC** و **calf circumference**
          - **hand grip strength** و **gait speed**

          والأحسن تجمع: **SARC-F + CC أو MAMC + grip أو gait speed** (Ishii و EWGSOP).
      - kind: mnemonic
        page: 133
        quote: "Strength: How much difficulty do you have in lifting and carrying 10 pounds?"
        word: "SARCF"
        parts:
          - { key: "S", text: "Strength: lifting and carrying 10 pounds" }
          - { key: "A", text: "Assistance in walking: across a room" }
          - { key: "R", text: "Rise from a chair or bed" }
          - { key: "C", text: "Climb a flight of 10 stairs" }
          - { key: "F", text: "Falls in the past year (4 or more = 2)" }
        hook: "الاسم نفسه هو الـ mnemonic. كل سؤال 0 أو 1 أو 2، والمجموع من 10، و ==≥4== يستاهل تقييم أعمق."
      - kind: check
        page: 134
        quote: "Data suggests that a SARC-F score of .4 best predicts the need for further, more comprehensive evaluation."
        question: "SARC-F total 5. Next step?"
        options:
          - "Further comprehensive evaluation"
          - "Diagnose severe sarcopenia now"
          - "Normal: no action"
          - "Start a sarcopenia drug"
        answer: 0
        why:
          - "صح: 4 أو أكتر = محتاج evaluation أشمل (الكتاب كاتبها «.4»، يعني ≥4)."
          - "الـ SARC-F screen، مش تشخيص ولا grading."
          - "4 أو أكتر مش طبيعي."
          - "مفيش دوا approved."
      - kind: explain
        page: 134
        title: "ليه العضلة بتروح؟"
        quote: "In recent years, inflammation and mitochondrial dysfunction received particular attention as a major determinant of sarcopenia."
        text: |
          الـ mechanisms كتير: malnutrition، inactivity، hormonal changes، inflammation، catabolism زيادة و **anabolic resistance**، myocyte loss، satellite cells أقل، فقد **α-motor neurons**، mitochondrial dysfunction، insulin resistance.

          وآخر سنين الاهتمام على اتنين: ==inflammation== و **mitochondrial dysfunction** (نفس اللي في السكر والـ CVD).
      - kind: explain
        page: 135
        title: "العلاج: الحديد مش في الصيدلية"
        quote: "only vitamin D, especially in older women, and testosterone in older men with low testosterone levels and muscle weakness can be justified"
        text: |
          - الأساس: ==physical exercise== لوحده أو مع nutrition، وأحسنه **high-intensity resistance training**.
          - **مفيش دوا approved**.
          - الـ umbrella review: بس **vitamin D** (خصوصًا الستات الكبار) و **testosterone** (رجالة عندهم low testosterone وضعف).
      - kind: aside
        tone: joke
        page: 134
        quote: "physical exercise, most notably high-intensity resistance training, improves the strength and mass of skeletal muscles"
        text: "يعني الروشتة: «**dumbbells** مرتين في اليوم بعد الأكل». الـ resistance training هو الدوا الوحيد اللي الكتاب واثق فيه."
      - kind: try
        items: [geri.L08.003, geri.L08.008, geri.L08.011, geri.L08.014, geri.L08.023]
    recap:
      - "Triad: sarcopenia، tendinopathies، arthritis."
      - "Sarcopenia = loss of muscle mass and function؛ primary (السن) أو secondary (مرض/دوا)."
      - "Strength = probable، quantity/quality = confirmed، performance = severe."
      - "SARC-F (Strength، Assistance، Rise، Climb، Falls): ≥4 = evaluation."
      - "علاج: resistance exercise ± nutrition؛ مفيش دوا approved؛ vitamin D و testosterone في فئات معينة."
    practice: [geri.L08.001, geri.L08.002, geri.L08.003, geri.L08.004, geri.L08.005, geri.L08.006, geri.L08.007, geri.L08.008, geri.L08.009, geri.L08.010, geri.L08.011, geri.L08.012, geri.L08.013, geri.L08.014, geri.L08.015, geri.L08.016, geri.L08.017, geri.L08.018, geri.L08.019, geri.L08.020, geri.L08.021, geri.L08.022, geri.L08.023, geri.L08.024, geri.L08.123]
