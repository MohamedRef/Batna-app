        text: |
          الـ ==malabsorption== بيعمل 3 حاجات: **short stature**، **sex hormone disturbance**، و **hyperparathyroidism**.

          الـ short stature سببه ==growth hormone (GH) resistance==: الـ caloric deprivation والـ malnutrition والـ diabetes mellitus (DM) مش متظبط والـ chronic renal failure (CRF) بيرفعوا الـ **TNF-α والـ interleukins (ILs)**، ودول بيقفلوا الـ GH signalling. النتيجة: **GH عالي و IGF-I واطي**. ونادرًا GH receptor antibodies.
