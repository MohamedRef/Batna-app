  - id: geri.L02.lesson4
    title: "مسألة الـ acid-base: الحاجة اللي جت نايمة"
    hook: "ضغط واطي، بوتاسيوم واطي، و HCO3 تمانية. المسألة دي في الكتاب، وبتتحل في أربع خطوات."
    minutes: 7
    pages: [38, 39]
    topics: [acid-base]
    goals:
      - "تحل مسألة الكتاب خطوة بخطوة"
      - "تحسب الـ anion gap والـ expected partial pressure of carbon dioxide (PCO2)"
      - "تعرف السبب من الـ K والـ urine pH"
    status: unverified
    steps:
      - kind: explain
        page: 38
        title: "المسألة"
        quote: "An 84-year- old female is brought to ER due to lethargy. Blood pressure is 85/60 mmHg, HR=101 beats /min ,temp. 37.8°C. Laboratory data are obtained : serum sodium135meq/L,potassium2.8meq/L,HCO3- 8 mg/L, chloride117 meq /L, BUN 17mg/dl and creatinine 1.9mg/dl. An arterial blood gas show PaO2 80mmHg, PCO2 24mmHg, pH 7.29. Her urine analysis is clear and has pH of 4.5. What is the acid base disorder?"
        text: |
          ست عندها **84 سنة** جت الطوارئ ==lethargic==. الضغط **85/60**، النبض **101**، الحرارة **37.8**.

          - Na **135**، K ==2.8==، bicarbonate (HCO3) **8**، Cl **117**
          - blood urea nitrogen (BUN) **17**، creatinine **1.9**
          - arterial blood gas (ABG): pH **7.29**، partial pressure of carbon dioxide (PCO2) **24**
          - Urine pH **4.5**

          ليه المسألة دي في محاضرة الكبار؟ لأن الست الكبيرة بتخسر سوايل بسرعة (العطش قليل، الكلية مش بتحوّش) فأي **diarrhea** بتوقّعها: ضغط واطي، نبض سريع، و lethargy. والـ creatinine **1.9** هنا غالبًا من الجفاف، مش مرض كلى.
      - kind: order
        page: 38
        quote: "An 84-year- old female is brought to ER due to lethargy. Blood pressure is 85/60 mmHg, HR=101 beats /min ,temp. 37.8°C. Laboratory data are obtained : serum sodium135meq/L,potassium2.8meq/L,HCO3- 8 mg/L, chloride117 meq /L, BUN 17mg/dl and creatinine 1.9mg/dl. An arterial blood gas show PaO2 80mmHg, PCO2 24mmHg, pH 7.29. Her urine analysis is clear and has pH of 4.5. What is the acid base disorder?"
        prompt: "رتّب خطوات الحل:"
        steps:
          - "pH 7.29 is low: acidemia"
          - "HCO3 8 is low: metabolic acidosis"
          - "Anion gap 135 − 117 − 8 = 10: normal"
          - "Expected PCO2 = 1.5 × 8 + 8 = 20 ± 2"
          - "Look at K+ and urine pH for the cause"
        why: "دايمًا: pH ← primary disorder ← anion gap ← compensation ← السبب."
      - kind: explain
        page: 38
        title: "ليه الـ anion gap بيفرّق؟"
        quote: "serum sodium135meq/L,potassium2.8meq/L,HCO3- 8 mg/L, chloride117 meq /L"
        text: |
          الدم لازم يفضل متعادل كهربيًا: الـ **Na** الموجب قصاده **Cl** و **HCO3** سالبين، والفرق بينهم (الـ anion gap) هو الـ anions اللي ما بنقيسهاش.

          التفسير المقبول (مش في الكتاب) للفرق بين النوعين:
          - **High AG**: في acid جديد دخل الدم (lactate، ketones، أو سموم الـ renal failure). الـ HCO3 بيتصرف عليه، ومكانه anion مش بنقيسه، فالـ gap يكبر.
          - **Normal AG**: الـ HCO3 نفسه **خرج** من الجسم (من الأمعاء في الـ diarrhea، أو من الكلية في الـ RTA)، والكلية بتمسك **Cl** مكانه، فالـ gap يفضل طبيعي والـ Cl يعلى.

          شوف الست: الـ Cl **117** عالي، والـ HCO3 **8**، والـ gap **10**. يعني HCO3 خرج و Cl خد مكانه، وده بالظبط شكل الـ **non-anion-gap** acidosis.
      - kind: reveal
        page: 38
        quote: "An 84-year- old female is brought to ER due to lethargy. Blood pressure is 85/60 mmHg, HR=101 beats /min ,temp. 37.8°C. Laboratory data are obtained : serum sodium135meq/L,potassium2.8meq/L,HCO3- 8 mg/L, chloride117 meq /L, BUN 17mg/dl and creatinine 1.9mg/dl. An arterial blood gas show PaO2 80mmHg, PCO2 24mmHg, pH 7.29. Her urine analysis is clear and has pH of 4.5. What is the acid base disorder?"
        prompt: "الـ PCO2 المتوقع 18–22، والفعلي 24. يعني إيه؟"
        answer: |
          الـ PCO2 **مش أقل** من المتوقع، فمفيش ==respiratory alkalosis== زيادة، والاختيار التالت غلط.

          هو أعلى بشوية، فلو في حاجة يبقى respiratory acidosis خفيف، ست lethargic ومش بتتنفس كفاية. الاختيار ده مش موجود، فالإجابة الأقرب: **non-anion-gap metabolic acidosis**. (الكتاب ما كتبش الإجابة.)
