  # ---------- p227-229: risk, tests, management ----------
  - id: git.L07.026
    kind: card
    topic: management
    front: Gold standard investigation for lower GI bleeding?
    back: Colonoscopy.
    src: { page: 227, quote: "Colonoscopy is the gold standard." }
    status: unverified
    tags: [high-yield]
  - id: git.L07.027
    kind: cloze
    topic: management
    text: "CT angiography detects bleeding at {{c1::0.5 ml/min}}; radionuclide scanning (Tc sulfur colloid or tagged RBC) detects {{c2::0.1 ml/min}}."
    src: { page: 227, quote: "CT angiography: Identifies bleeding rate of 0.5ml/mt" }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L07.028
    kind: cloze
    topic: risk
    text: "Shock index = {{c1::heart rate / systolic BP}}; lower GI bleeding is unstable if it is above {{c2::1}}."
    src: { page: 227, quote: "unstable defined as a shock index >1. Shock index=heart rate/SBP" }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L07.029
    kind: card
    topic: risk
    front: How are stable lower GI bleeds sorted into major and minor?
    back: With a risk assessment tool such as the Oakland score.
    src: { page: 227, quote: "Stable bleeds should then be categorized as major or minor, using a risk assessment tool such as the Oakland score." }
    status: unverified
  - id: git.L07.030
    kind: order
    topic: risk
    prompt: Order the risk steps for a patient with lower GI bleeding, per the lecture.
    steps:
      - Calculate the shock index (heart rate / systolic BP)
      - "Shock index >1: unstable"
      - "Stable: grade major or minor with the Oakland score"
      - "Oakland low score: candidate for safe discharge"
    src: { page: 227, quote: "The patients presenting with lower GI bleeding are stratified as unstable or stable (unstable defined as a shock index >1." }
    status: unverified
  - id: git.L07.031
    kind: card
    topic: risk
    front: What is special about the Oakland score?
    back: It is the first score designed specifically for lower GI bleeding and externally validated; it is best at identifying low-risk patients.
    src: { page: 228, quote: "Oakland score. is the first score that has been specifically designed for LGIB and externally validated." }
    status: unverified
  - id: git.L07.032
    kind: cloze
    topic: risk
    text: "An Oakland score below {{c1::8}} carries a {{c2::95%}} probability of safe discharge (the book's table says ≤8)."
    src: { page: 228, quote: "OS <8 carries 95% probability of safe discharge." }
    status: unverified
    tags: [numbers, high-yield]
    update:
      text: "The Oakland study and the BSG guideline use a score of 8 or less for safe discharge, as the book's own Table 1 footnote says."
      ref: "Oakland et al., Lancet Gastroenterol Hepatol 2017; BSG acute LGIB guideline 2019"
  - id: git.L07.033
    kind: card
    topic: risk
    front: What else does the Oakland score predict, and where is it weak?
    back: It predicts rebleeding and the need for red cell transfusion, but is inferior at predicting mortality.
    src: { page: 228, quote: "It can also predict rebleeding and the need for RBC transfusion but is inferior at predicting mortality." }
    status: unverified
  - id: git.L07.034
    kind: table
    topic: risk
    title: "Oakland score variables (book Table 1)"
    columns: [Predictor, Points]
    rows:
      - ["Age <40 / 40–69 / ≥70", "0 / 1 / 2"]
      - ["Sex female / male", "0 / 1"]
      - ["Previous LGIB admission no / yes", "0 / 1"]
      - ["DRE no blood / blood", "0 / 1"]
      - ["Heart rate <70 / 70–89 / 90–109 / ≥110", "0 / 1 / 2 / 3"]
      - ["SBP <90 / 90–119 / 120–129 / 130–159 / ≥160", "5 / 4 / 3 / 2 / 0"]
      - ["Hb g/L <70 / 70–89 / 90–109 / 110–129 / 130–159 / ≥160", "22 / 17 / 13 / 8 / 4 / 0"]
    blanks: [[0, 1], [4, 1], [5, 1], [6, 1]]
    src: { page: 229, quote: "Table 1 Variables comprising the Oakland score" }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L07.035
    kind: card
    topic: risk
    front: Which Oakland variable carries the most points?
    back: Haemoglobin, up to 22 points for Hb below 70 g/L.
    src: { page: 229, quote: "Table 1 Variables comprising the Oakland score" }
    status: unverified
  - id: git.L07.036
    kind: mcq
    topic: risk
    stem: "A 35-year-old woman has one episode of bright red rectal bleeding. First admission. DRE shows blood. Pulse 64, BP 165/90, Hb 165 g/L. What is her Oakland score and plan?"
    options:
      - "1: suitable for discharge and outpatient investigation"
      - "8: needs urgent CT angiography"
      - "5: needs admission for colonoscopy within 24 hours"
      - "0: no investigation at all"
      - "12: transfuse to Hb 9 g/dL"
    answer: 0
    why:
      - "Correct: age <40 = 0, female = 0, no previous admission = 0, DRE blood = 1, HR <70 = 0, SBP ≥160 = 0, Hb ≥160 = 0. Total 1, low risk (p228–229)."
      - Her score is 1, and CTA is for ongoing hemodynamically significant bleeding.
      - The score is 1, and urgent colonoscopy within 24 h has not improved outcomes.
      - Blood on DRE scores 1, and discharge is with outpatient investigation.
      - Her score is low and the book advises restrictive transfusion at Hb 7.
    src: { page: 228, quote: "OS <8 carries 95% probability of safe discharge." }
    status: unverified
  - id: git.L07.037
    kind: mcq
    topic: risk
    stem: "A 74-year-old man with a previous admission for LGIB passes blood. DRE shows blood. Pulse 112, BP 96/60, Hb 85 g/L. What is his Oakland score?"
    options:
      - "29"
      - "17"
      - "24"
      - "8"
      - "33"
    answer: 0
    why:
      - "Correct: age ≥70 = 2, male = 1, previous admission = 1, DRE blood = 1, HR ≥110 = 3, SBP 90–119 = 4, Hb 70–89 = 17. Total 29."
      - That is the haemoglobin points alone.
      - This misses the age, sex, previous admission, DRE and heart rate points.
      - "8 is the discharge cut-off, not his score."
      - Too high; Hb 85 scores 17, not 22.
    src: { page: 229, quote: "Table 1 Variables comprising the Oakland score" }
    status: unverified
  - id: git.L07.038
    kind: card
    topic: risk
    front: What does the Glasgow-Blatchford score identify, per this lecture?
    back: Patients at risk of adverse outcomes (rebleeding, need for red cell transfusion, in-hospital death).
    src: { page: 228, quote: "The Glasgow-Blatchford score identifies patients at risk of adverse outcomes (rebleeding, need for RBC transfusion, in-hospital death)." }
    status: unverified
  - id: git.L07.039
    kind: cloze
    topic: risk
    text: "In hemodynamically stable LGIB, a {{c1::restrictive}} transfusion strategy is recommended, with a threshold of Hb {{c2::7 g/dL}}."
    src: { page: 228, quote: "A restrictive strategy of red blood cell transfusion (threshold for transfusion at a hemoglobin level of 7 g/dL)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L07.040
    kind: card
    topic: management
    front: Should most patients hospitalized with LGIB have a colonoscopy?
    back: Yes, because of its value in detecting the source of bleeding.
    src: { page: 228, quote: "Performance of colonoscopy is recommended for most patients who are hospitalized with LGIB because of its value in detecting a source of bleeding." }
    status: unverified
  - id: git.L07.041
    kind: card
    topic: management
    front: When may colonoscopy be skipped in a patient admitted with LGIB?
    back: If bleeding has subsided and a high-quality colonoscopy with adequate preparation within 12 months showed diverticulosis and no colorectal neoplasia.
    src: { page: 228, quote: "the patient has had a high-quality colonoscopy within 12 mo with an adequate bowel preparation showing diverticulosis with no colorectal neoplasia" }
    status: unverified
  - id: git.L07.042
    kind: card
    topic: management
    front: Preferred first test in ongoing hemodynamically significant hematochezia?
    back: CT angiography. It is of low yield in minor LGIB or when bleeding has subsided.
    src: { page: 228, quote: "CT angiography is preferred as the initial diagnostic test in patients with ongoing hemodynamically significant hematochezia." }
    status: unverified
    tags: [high-yield]
  - id: git.L07.043
    kind: card
    topic: management
    front: Next step when CT angiography detects the bleeding source?
    back: Refer for arteriography and embolization.
    src: { page: 228, quote: "If the source of bleeding has been detected, the patient should be referred for Arteriography and embolization." }
    status: unverified
  - id: git.L07.044
    kind: card
    topic: management
    front: Urgent or nonemergent colonoscopy for inpatients with LGIB, and why?
    back: Nonemergent inpatient colonoscopy, because urgent colonoscopy within 24 hours has not improved rebleeding or mortality.
    src: { page: 228, quote: "performing an urgent colonoscopy within 24 hours has not been shown to improve clinical outcomes such as rebleeding and mortality" }
    status: unverified
    tags: [high-yield]
  - id: git.L07.045
    kind: enumerate
    topic: management
    prompt: Mention the endoscopic treatments recommended for diverticular stigmata of hemorrhage.
    points: [Through-the-scope clips, Endoscopic band ligation, Coagulation]
    pass: 3
    src: { page: 229, quote: "Treatment of diverticular stigmata of hemorrhage with through-the-scope clips, endoscopic band ligation, or coagulation is recommended." }
    status: unverified
  - id: git.L07.046
    kind: order
    topic: management
    prompt: "Order the book's Figure 1 path for severe hematochezia with ongoing significant bleeding."
    steps:
      - "IV fluids, transfuse to Hb >7 g/dL, exclude an upper source if appropriate"
      - CT angiography
      - Extravasation seen
      - Prompt transcatheter angiography with embolization
    src: { page: 229, quote: "Prompt transcatheter angiography with embolization if extravasation seen" }
    status: unverified
  - id: git.L07.047
    kind: card
    topic: management
    front: In the book's Figure 1, what follows when bleeding has subsided or CT angiography shows no extravasation?
    back: Nonurgent colonoscopy (split-dose PEG), or observation if bleeding subsides and the patient had a recent colonoscopy.
    src: { page: 229, quote: "Nonurgent colonoscopy (with split-dose PEG) vs. observation if bleeding subsides and patient has had recent colonoscopy" }
    status: unverified
  - id: git.L07.048
    kind: mcq
    topic: management
    stem: A 78-year-old woman has ongoing large-volume painless hematochezia. Pulse 118, BP 88/56 despite fluids. Upper endoscopy is normal. Best next test?
    options:
      - CT angiography
      - Urgent colonoscopy within 6 hours without preparation
      - Tagged red cell scan tomorrow
      - Capsule endoscopy
      - Barium enema
    answer: 0
    why:
      - "Correct: CTA is the preferred initial test in ongoing hemodynamically significant hematochezia (p228)."
      - Urgent colonoscopy within 24 h has not improved outcomes and needs preparation.
      - A tagged red cell scan is for slower rates (0.1–0.2 ml/min) and delays care.
      - Capsule is for small bowel bleeding after upper and lower sources are excluded.
      - Barium has no role in acute bleeding.
    src: { page: 228, quote: "CT angiography is preferred as the initial diagnostic test in patients with ongoing hemodynamically significant hematochezia." }
    status: unverified
  - id: git.L07.049
    kind: mcq
    topic: management
    stem: A 70-year-old man admitted with LGIB stopped bleeding on day 1. He had a good-quality colonoscopy 8 months ago showing sigmoid diverticulosis and no neoplasia. What does the lecture allow?
    options:
      - Colonoscopy may not be needed
      - Urgent colonoscopy within 24 hours
      - CT angiography now
      - Arteriography and embolization
      - Repeat colonoscopy every admission regardless
    answer: 0
    why:
      - "Correct: subsided bleeding plus a high-quality colonoscopy within 12 months showing diverticulosis without neoplasia (p228)."
      - Urgent colonoscopy has not improved outcomes, and this one is not needed.
      - CTA is of low yield once bleeding has subsided.
      - Embolization needs a bleeding source on CTA.
      - The book names this exception to routine colonoscopy.
    src: { page: 228, quote: "Colonoscopy may not be needed in patients where bleeding has subsided" }
    status: unverified
  # ---------- p230: Table 2 differential ----------
  - id: git.L07.050
    kind: table
    topic: ddx
    title: "Differential diagnosis of acute LGIB (book Table 2)"
    columns: [Diagnosis, Distinguishing feature]
    rows:
      - [Angiodysplasia, "Recurrent painless bleeding; patient >60 years"]
      - [Colon cancer, "Slow chronic blood loss with occasional change in bowel habit"]
      - [Diverticular bleeding, "Acute, severe, painless; known or suspected diverticular disease"]
      - [Hemorrhoids, "Bleeding with bowel movements; external painful and itchy, internal painless"]
      - [Infectious colitis, "Bloody diarrhea with fever; new or concerning food exposure"]
      - [IBD, "Bloody diarrhea with recurrent abdominal pain and weight loss"]
      - [Ischemic colitis, "Bloody diarrhea after acute lower abdominal pain; cardiac risk factors"]
      - [Postpolypectomy bleeding, Within 30 days of polypectomy or biopsy]
    blanks: [[0, 1], [2, 1], [4, 1], [6, 1], [7, 1]]
    src: { page: 230, quote: "Recurrent painless bleeding episodes; patient > 60 years" }
    status: unverified
    tags: [high-yield]
  - id: git.L07.051
    kind: card
    topic: ddx
    front: Treatment of angiodysplasia in Table 2?
    back: Colonoscopy with argon plasma coagulation; consider long-term lanreotide 120 mg subcutaneously every 4 weeks.
    src: { page: 230, quote: "Colonoscopy with endoscopic argon plasma coagulation" }
    status: unverified
  - id: git.L07.052
    kind: card
    topic: ddx
    front: Treatment of bleeding hemorrhoids in Table 2?
    back: Fiber (reduces bleeding by 50%); banding or infrared photocoagulation for grades I–III; surgery likely for symptomatic grades III and IV.
