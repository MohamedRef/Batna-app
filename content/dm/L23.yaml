  - id: dm.L23.036
    kind: order
    topic: pcsk9
    prompt: "Put PCSK9 biology in order (without inhibition)."
    steps:
      - PCSK9 binds the LDL receptor on hepatocytes
      - The LDL-receptor complex is taken into the cell
      - The receptor is degraded in the liver instead of recycling
      - Fewer LDL receptors on the surface
      - Blood LDL-C rises
    src: { page: 292, quote: "PCSK9 binds to LDL receptor (LDLR) on hepatocytes" }
    status: unverified
  - id: dm.L23.037
    kind: card
    topic: pcsk9
    front: How does alirocumab (Praluent) lower LDL-C?
    back: A fully human monoclonal antibody that blocks PCSK9 from binding the LDL receptor, so the receptor recycles and more LDL-C is cleared.
    src: { page: 292, quote: "Praluent is a fully human monoclonal antibody" }
    status: unverified
