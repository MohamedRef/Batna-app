  - id: res.L08.040
    kind: mcq
    topic: designs
    stem: The effect of parental consanguinity on hereditary diseases in the offspring is best studied by
    options: [Cross sectional, Case control, Correlation study, Prospective cohort, Retrospective cohort]
    answer: 1
    why:
      - Hereditary diseases are rare, so a survey would find too few cases.
      - Start from children with the hereditary disease and compare parental consanguinity with unaffected children, which suits a rare disease.
      - Group-level data cannot link one couple to one child.
      - A cohort would need huge numbers and long follow-up for a rare outcome.
      - Old records rarely hold both consanguinity and diagnosis reliably.
    src: { page: 44, quote: "The study of the effect of parental consanguinity on hereditary diseases in the offspring is best studied by:\n  a) Cross sectional\n  b) Case control\n  c) Correlation study\n  d) Prospective cohort\n  e) Retrospective cohort" }
    status: unverified
