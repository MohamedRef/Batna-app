          - **BUN/Cr > 20:** الـ urea **بتتمص** مع المية في الـ prerenal، **فـ** الـ BUN يعلى أكتر من الـ creatinine. وفي الـ ATN الخلايا مش بتمص، فالنسبة تفضل عادية.
