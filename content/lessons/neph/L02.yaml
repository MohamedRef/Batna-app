        title: "ليه دول بيثبتوا إنه chronic؟"
        text: |
          الكتاب بيثبت الـ **chronicity** (أكتر من 3 شهور) بـ: تحاليل GFR وبول قديمة، **imaging** (كلية صغيرة و cortex رفيع)، **pathology** (fibrosis و atrophy)، التاريخ المرضي، وتكرار التحليل قبل وبعد 3 شهور.

          التفسير المقبول (مش في الكتاب): كل علامة من دول **محتاجة وقت** علشان تحصل:

          - الكلية بتصغر والـ ==cortex== يرفع لما nephrons كتير تموت وتتليف، وده ماييجيش في أسبوع.
          - الـ ==fibrosis== والـ atrophy ندبة، والندبة علامة على جرح قديم.
          - الأنيميا والـ CKD-MBD (ص 33) بياخدوا شهور لأن الـ erythropoietin والـ vitamin D بيقلّوا بالتدريج.

          يعني الـ AKI بيغيّر **الأرقام**، والـ CKD بيغيّر **الشكل**.
