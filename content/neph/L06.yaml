  # ---------- p135-136: potassium physiology ----------
  - id: neph.L06.062
    kind: card
    topic: k-physiology
    front: What pumps absorbed potassium into cells, and in what ratio?
    back: Insulin and beta-adrenergic catecholamines stimulate membrane Na/K-ATPase, which pumps 3 Na out for 2 K in.
    src: { page: 135, quote: "Insulin and B adrenergic catecholamines stimulate membrane Na /K ATPase to pump K into cells (in a 3:2 ratio)." }
    status: unverified
    tags: [high-yield]
  - id: neph.L06.063
    kind: card
    topic: k-physiology
    front: Why do plasma K disorders show up in excitable tissues?
    back: Almost all exchangeable K (98%) is intracellular. The gradient sets the resting cell voltage (interior negative), so changing plasma K changes excitability.
    src: { page: 135, quote: "98% of exchangeable K+ is in the intracellular compartment. This difference determines cellular voltage at rest" }
    status: unverified
