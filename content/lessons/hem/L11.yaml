  - id: hem.L11.lesson7
    title: "تحاليل الـ myeloma: كل رقم بيقول إيه"
    hook: "Rouleaux، ESR عالي، ALP طبيعي، و spike في الـ electrophoresis. كل واحدة ليها حكاية."
    minutes: 9
    pages: [179, 180]
    topics: [diagnosis, prognosis]
    goals:
      - "تقرا الـ CBC والـ film والـ ESR وتعرف ليه"
      - "تفهم الـ protein electrophoresis والـ ALP الطبيعي"
      - "تعرف الأشعة وتحاليل الـ tumour burden"
    status: unverified
    steps:
      - kind: explain
        page: 179
        quote: "A normocytic normochromic anemia in 70% of cases\nThrombocytopenia in approximately 15% of patients\nPlasma cells in the peripheral smear (plasma cell leukemia)"
        title: "الـ CBC والـ film"
        text: |
          - ==Normocytic normochromic anaemia== في **70%**.
          - **Thrombocytopenia** في حوالي **15%**.
          - **Plasma cells** في الـ smear = **plasma cell leukaemia**.
          - **Rouleaux formation**، والـ **ESR almost always high** (ص 180).

          ليه الأنيميا normocytic؟ لأنها من **bone marrow failure** (النخاع مليان plasma cells)، مش من نقص حديد أو B12. وليه الـ rouleaux والـ ESR؟ التفسير المقبول (مش في الكتاب): الـ paraprotein الكتير بيغطّي الكرات الحمرا ويلغي الشحنة اللي بتبعّدهم عن بعض، فيترصّوا فوق بعض زي العملات (rouleaux) وينزلوا في الأنبوبة أسرع (ESR عالي).
      - kind: table
        page: 180
        quote: "Hypercalcemia in 30% of cases\nSerum alkaline phosphatase is usually normal."
        title: "التحاليل بالأرقام"
