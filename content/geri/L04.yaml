  # ---------- p56-60: mechanisms ----------
  - id: geri.L04.011
    kind: enumerate
    topic: ad-mechanism
    prompt: Enumerate the hypotheses that explain AD pathology.
    points: [Cholinergic, Amyloid, Tau protein, Inflammatory, Oxidative stress, Metal ion, Glutamate excitotoxicity, Microbiota-gut-brain axis, Abnormal autophagy]
    pass: 6
    src: { page: 56, quote: "various hypotheses, such as the cholinergic, amyloid, tau protein, inflammatory, oxidative stress, metal ion, glutamate excitotoxicity, microbiota-gut-brain axis" }
    status: unverified
  - id: geri.L04.012
    kind: card
    topic: ad-mechanism
    front: Which synaptic receptors does amyloid-beta bind, and what follows?
    back: "PrPC, NMDA receptors, P75NTR and mGluR5. This causes calcium dyshomeostasis, inhibition of long-term potentiation, tau hyperphosphorylation, mitochondrial dysfunction and oxidative stress, ending in neuronal death."
    src: { page: 56, quote: "binding to a variety of synaptic receptors such as PrPC, NMDA receptors, P75NTR, and mGluR5" }
    status: unverified
  - id: geri.L04.013
    kind: card
    topic: ad-mechanism
    front: How does amyloid-beta cause glutamate excitotoxicity?
    back: It blocks glutamate reuptake by excitatory amino acid transporters (EAAT), so glutamate accumulates in the synapse and neurons become hyperactive.
    src: { page: 57, quote: "Aβ blocks the reuptake of glutamate by excitatory amino acid transporter (EAAT) receptors, causing glutamate accumulation intersynaptically" }
    status: unverified
  - id: geri.L04.014
    kind: card
    topic: ad-mechanism
    front: What induces the A1 phenotype of astrocytes in AD, and what does it do?
    back: "Amyloid-beta with pro-inflammatory cytokines (TNF-alpha, IL-1alpha, C1q). A1 astrocytes take part in amyloid deposition, neuroinflammation, synaptic loss and neuronal death."
    src: { page: 57, quote: "Aβ and some pro-inflammatory cytokines (such as TNFα, IL-1α, and C1q) may induce the A1 phenotype of astrocytes." }
    status: unverified
  - id: geri.L04.015
    kind: card
    topic: ad-mechanism
    front: What is the normal role of APOE in amyloid handling?
    back: APOE, released mainly from astrocytes, joins lipoproteins to form particles that bind soluble amyloid-beta and mediate its clearance.
    src: { page: 57, quote: "APOE, primarily released from astrocytes, associates with lipoproteins to form APOE-associated lipoprotein particles, which can bind to soluble Aβ" }
    status: unverified
  - id: geri.L04.016
    kind: order
    topic: ad-mechanism
    prompt: Order the microglial inflammatory loop driven by amyloid-beta.
    steps:
      - Amyloid-beta binds microglial pattern recognition receptors
      - NLRP3 assembles and activates
      - Pro-inflammatory cytokines are released
      - Amyloid-beta aggregation gets worse
    src: { page: 58, quote: "This process promotes the assembly and activation of NLRP3, leading to the release of pro-inflammatory cytokines, which further exacerbate the aggregation of Aβ." }
    status: unverified
  - id: geri.L04.017
    kind: card
    topic: ad-mechanism
    front: How does the TREM2 R47H variant raise the risk of AD?
    back: It may reduce TREM2 binding or internalisation of ligands (APOE-amyloid complexes, APOE, phospholipids, amyloid), impairing microglial activation and their ability to clear amyloid plaques.
    src: { page: 58, quote: "This reduction may consequently impair the activation of microglial cells, thereby compromising their ability to clear amyloid plaques." }
    status: unverified
  - id: geri.L04.018
    kind: enumerate
    topic: ad-mechanism
    prompt: Enumerate the signalling pathways linked to AD pathogenesis.
    points:
      - Neuroinflammatory signalling
      - Lysosomal dysfunction
      - Aberrant cholesterol metabolism
      - Mitochondrial dysfunction
      - Calcium signalling
      - Insulin signalling
      - Dysregulated neurotrophic signalling
      - BBB dysfunction
    pass: 5
    src: { page: 59, quote: "Aberrant cholesterol metabolism." }
    status: unverified
  - id: geri.L04.019
    kind: card
    topic: ad-mechanism
    front: What may underlie lysosomal dysfunction in AD?
    back: Impaired V-ATPase-mediated lysosomal acidification and/or dysregulated lysosomal calcium homeostasis.
    src: { page: 59, quote: "impairments in V-ATPase-mediated lysosomal acidification and/or dysregulation of lysosomal calcium homeostasis." }
    status: unverified
  - id: geri.L04.020
    kind: card
    topic: ad-mechanism
    front: How is mitochondrial function damaged in AD, and with what result?
    back: "Impaired oxidative phosphorylation, calcium homeostasis, mtDNA, fusion and fission, axonal transport and mitophagy, leading to impaired energy production and more oxidative stress."
    src: { page: 59, quote: "These dysfunctions lead to impaired energy production and increased oxidative stress." }
    status: unverified
  - id: geri.L04.021
    kind: card
    topic: ad-mechanism
    front: What does raised cytosolic calcium do in AD?
    back: Calcium-responsive cascades disturb protein folding in the ER, energy production in mitochondria, and lysosomal acidity.
    src: { page: 59, quote: "adversely affect protein folding in the ER, energy production in mitochondria, and lysosomal acidity." }
    status: unverified
  - id: geri.L04.022
    kind: card
    topic: ad-mechanism
    front: How does BBB dysfunction worsen AD?
    back: Loss of integrity and altered transport let substances enter and leave brain tissue abnormally, damaging neurons.
    src: { page: 59, quote: "The disruption of the integrity and alterations in the transport functions of BBB lead to the abnormal entry and exit of certain substances" }
    status: unverified
  # ---------- p61-62: AD risk and diagnostic criteria ----------
  - id: geri.L04.023
    kind: card
    topic: ad-risk
    front: What is the most potent risk factor for Alzheimer's disease?
    back: The apolipoprotein E e4 (APOE e4) allele.
    src: { page: 61, quote: "Most potent risk factor - presence of the apolipoprotein e4 (APOE e4) allele." }
    status: unverified
    tags: [high-yield]
  - id: geri.L04.024
    kind: cloze
    topic: ad-risk
    text: Lifetime risk of AD is about {{c1::9%}} without the e4 allele and {{c2::29%}} with at least one e4 allele.
    src: { page: 61, quote: "Without the e4 allele is approximately 9% Carrying at least 1 e4 allele is 29%" }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L04.025
    kind: card
    topic: ad-risk
    front: Can APOE e4 genotyping diagnose Alzheimer's disease?
    back: No. The e4 genotype is not specific or sensitive enough to be used as a diagnostic test.
    src: { page: 61, quote: "e4 genotype is not sufficiently specific or sensitive for the diagnosis of AD to allow its use as a diagnostic test." }
    status: unverified
  - id: geri.L04.026
    kind: enumerate
    topic: ad-risk
    prompt: Enumerate the "other risk factors" for AD on the risk-factor page.
    points:
      - Head injury
      - Low serum folate and vitamin B12
      - Raised plasma total homocysteine
      - Family history of AD or dementia
      - Fewer years of formal education
      - Lower income
      - Lower occupational status
    pass: 5
    src: { page: 61, quote: "Low serum levels of folate and vitamin B12 Elevated plasma and total homocysteine levels" }
    status: unverified
  - id: geri.L04.027
    kind: card
    topic: ad-risk
    front: Which two factors are linked with a lower risk of AD?
    back: Higher levels of education and more fish in the diet.
    src: { page: 61, quote: "Higher levels of education Higher levels of fish in the diet" }
    status: unverified
  - id: geri.L04.028
    kind: card
    topic: ad-diagnosis
    front: What degree of cognitive impairment do the diagnostic criteria of AD require?
    back: "Impairment severe enough to cause social or occupational disability in at least two domains: memory, language, calculations, orientation, judgment."
    src: { page: 61, quote: "Cognitive impairment severe enough to cause social or occupational disability in at least two domains" }
    status: unverified
    tags: [high-yield]
  - id: geri.L04.029
    kind: enumerate
    topic: ad-diagnosis
    prompt: Enumerate the cognitive domains listed in the diagnostic criteria of AD.
    points: [Memory, Language, Calculations, Orientation, Judgment]
    pass: 4
    src: { page: 62, quote: "Calculations Orientation Judgment" }
    status: unverified
  - id: geri.L04.030
    kind: cloze
    topic: ad-diagnosis
    text: In AD, {{c1::senile plaques}} (made of beta-amyloid) lie between neurons, and {{c2::neurofibrillary tangles}} (made partly of {{c3::tau}}) lie within neurons.
    src: { page: 62, quote: "senile plaques (composed of b-amyloid polypeptides) between neurons and neurofibrillary tangles (made up partly of a protein named tau" }
    status: unverified
    tags: [high-yield]
  - id: geri.L04.031
    kind: card
    topic: ad-diagnosis
    front: Which neurons are particularly destroyed in AD?
    back: Cholinergic neurons.
    src: { page: 62, quote: "which are associated with neuronal destruction, particularly in cholinergic neurons." }
    status: unverified
  - id: geri.L04.032
    kind: enumerate
    topic: ad-diagnosis
    prompt: Enumerate the early warning signs of Alzheimer's disease.
    points:
      - Gradual loss of short-term memory
      - Mood or personality changes
      - Problems finding or speaking the right word
      - Inability to recognise objects
      - Forgetting how to use simple things (a pencil)
      - Forgetting to turn off the stove, close windows, lock doors
    pass: 4
    src: { page: 62, quote: "Gradual loss of short-term memory • Mood or personality changes • Problems finding or speaking the right word" }
    status: unverified
    tags: [high-yield]
  - id: geri.L04.033
    kind: order
    topic: ad-diagnosis
    prompt: Order the evaluation of suspected Alzheimer's disease as the lecture lists it.
    steps:
      - "History from family and friends: change in ADL and behaviour"
      - Physical examination
      - "Cognitive assessment: attention, memory, executive, language, visuospatial"
      - Laboratory tests and biomarkers
      - Imaging studies
      - Gold standard and special tests
    src: { page: 62, quote: "History (family,friends)-degree of change in ADL and in personal behaviour 2. Physical examination" }
    status: unverified
  - id: geri.L04.034
    kind: card
    topic: ad-diagnosis
    front: Which blood biomarker is specific for AD pathology, and which form is most useful?
    back: Plasma phosphorylated tau (p-tau); p-tau217 has the most utility.
    src: { page: 63, quote: "Plasma Phosphorylated tau (ptau) is a specific blood biomarker for Alzheimer disease (AD) pathology, with p- tau217 considered to have the most utility." }
    status: unverified
