        text: |
          صفحة 397 فيها صورتين بيكمّلوا قصة الحصوة اللي خرجت من المرارة.

          الأولى: ==Shotty GB stones== (حصوات صغيرة كتير زي حبّات الخرطوش) مع حصوات **impacted at the papilla of Vater**، والأسهم على الـ **CBD stones**.

          ليه الصغيرة هي اللي بتعمل كده؟ التفسير المقبول (مش في الكتاب):
          - الحصوة الصغيرة بتعدّي من الـ cystic duct بسهولة، والكبيرة لأ.
          - بس الـ papilla أضيق نقطة في الطريق، فتقف عندها.
          - والـ pancreatic duct بيفتح في نفس المكان، فالحصوة دي ممكن تعمل **obstructive jaundice** و **cholangitis** و **pancreatitis** مع بعض: نفس قايمة مضاعفات الـ ducts في صفحة 387.

          والعلاج اللي المحاضرة بتوريه في صفحة 400: **endoscopic sphincterotomy with stone extraction**.
