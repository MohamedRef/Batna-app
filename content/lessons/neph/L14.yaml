        text: |
          - "**monoclonal gammopathy of undetermined significance (MGUS)**: monoclonal protein **من غير** end-organ damage."
          - "==monoclonal gammopathy of renal significance (MGRS)==: الـ monoclonal protein **بيأذي الكلية** من غير malignancy واضحة."
          - "**Myeloma**: ~**11/100,000** سنوياً، و **20-30%** بييجوا بـ estimated glomerular filtration rate (eGFR) **<30 mL/min/1.73 m²** وقت التشخيص."

