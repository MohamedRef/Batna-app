  - id: dm.L08.lesson1
    title: "الهرم الغذائي: كام سعر وليه الهرم؟"
    hook: "قبل ما تقول لمريض السكر «ما تاكلش»، قوله ياكل إيه وقد إيه."
    minutes: 8
    pages: [89, 91]
    topics: [calories, pyramid]
    goals:
      - "تعرف الـ guiding principles والـ calorie categories"
      - "تفهم ليه الناس احتياجها مختلف"
      - "تعرف الهرم بيوري إيه وليه مهم، وتعدّ الـ 6 food groups"
    status: unverified
    steps:
      - kind: explain
        remind: [dm.L08.001]
        page: 89
        title: "مبادئ ثابتة"
        quote: "Evolutionary, flexible, practical, useful, realistic, overall Health, Up-to- Date Research, total diet."
        text: |
          الـ **US Department of Agriculture (USDA) food guidance** اتغيرت كتير، بس الـ **guiding principles** ثابتة: evolutionary، ==flexible==، **practical**، useful، ==realistic==، overall health، up-to-date research، و **total diet**.

          يعني الأكل مش قايمة ممنوعات، ده نظام كامل مرن وواقعي.

          ليه المبادئ دي مهمة لمريض السكر بالذات؟ لأن الـ diet اللي مش **realistic** ولا **flexible** العيان بيسيبه بعد أسبوعين. الـ **total diet** معناها إننا بنبص على الأكل كله على مدار اليوم والأسبوع، مش على أكلة واحدة غلط.
      - kind: table
        page: 90
        quote: "1,600 calories - Many sedentary women and some older adults."
        title: "كام سعر في اليوم؟"
        columns: [Calories, Who]
        rows:
          - ["1,600", "Sedentary women, older adults"]
          - ["2,200", "Kids, teen girls, active women, sedentary men"]
          - ["2,800", "Teen boys, active men, very active women"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 90
        quote: "2,800 calories - Teenage boys, active men, and very active women."
        prompt: "ليه المراهق والراجل النشيط محتاجين 2,800 والست القاعدة 1,600؟"
        answer: |
          الكتاب بيقسّم حسب **السن والجنس والنشاط**، والرسم بتاع الـ estimated energy requirements بيوري خطين: **active** فوق و **sedentary** تحت.

          التفسير المقبول (مش في الكتاب): السعرات بتتصرف في تلات حاجات: الجسم وهو مرتاح، والحركة، والنمو. العضلات بتحرق حتى وهي مرتاحة، والرجالة عادة عضلاتهم أكتر، والمراهق لسه بيبني جسمه، والنشاط بيزوّد الحرق. ومع السن العضلات بتقل، عشان كده الكبار في الـ 1,600.
      - kind: explain
        page: 90
        title: "اقرا رسم الـ energy requirements"
        quote: "Determine Calorie Needs:\nEstimated Energy Requirements* for males"
        text: |
          الكتاب بيدّيك رسم اسمه **estimated energy requirements** للرجالة: السعرات على المحور الرأسي، والسن على الأفقي من 3 لـ 80 سنة، وفيه خطين: ==active== فوق و **sedentary** تحت.

          اللي محتاج تطلع بيه من الرسم: عند **نفس السن**، الفرق بين الخطين هو تمن الحركة. يعني لما تحسب احتياج عيان، اسأله الأول بيتحرك قد إيه، مش بس عنده كام سنة. والرقم ده هو الأساس اللي هتبني عليه حدود الكارب والسكر المضاف بعد كده في المحاضرة.
      - kind: figure
        page: 90
        quote: "1,600 calories - Many sedentary women and some older adults.\n2,200 calories - Children, teenage girls, active women, and many sedentary men.\nWomen who are pregnant may need around 500 calories more per day and an additional 300 calories for breastfeeding.\n2,800 calories - Teenage boys, active men, and very active women."
        title: "التلات سلالم"
        alt: "Bar chart of the three calorie categories: 1,600 for sedentary women and older adults, 2,200 for children, teenage girls, active women and sedentary men, 2,800 for teenage boys, active men and very active women. Two small bars show pregnancy plus 500 and breastfeeding plus 300."
        caption: "كل سلمة **600** سعر. الحمل ==+500==، والرضاعة **+300** زيادة."
        svg: |
          <svg viewBox="0 0 330 220" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 190 H315" class="fg-thin"/>
            <rect x="40" y="110" width="60" height="80" class="fg-good"/>
            <text x="70" y="102" text-anchor="middle" class="t-sm t-b">1,600</text>
            <text x="70" y="208" text-anchor="middle" class="t-sm">sedentary</text>
            <rect x="120" y="80" width="60" height="110" class="fg-acc"/>
            <text x="150" y="72" text-anchor="middle" class="t-sm t-b">2,200</text>
            <text x="150" y="208" text-anchor="middle" class="t-sm">active women</text>
            <rect x="200" y="50" width="60" height="140" class="fg-bad"/>
            <text x="230" y="42" text-anchor="middle" class="t-sm t-b">2,800</text>
            <text x="230" y="208" text-anchor="middle" class="t-sm">active men</text>
            <text x="270" y="130" class="t-sm t-b">+500</text>
            <text x="270" y="146" class="t-sm t-mut">pregnancy</text>
            <text x="270" y="166" class="t-sm t-b">+300</text>
            <text x="270" y="182" class="t-sm t-mut">breastfeeding</text>
          </svg>
      - kind: aside
        tone: tip
        page: 90
        quote: "Women who are pregnant may need around 500 calories more per day and an additional 300 calories for breastfeeding."
        text: "الحامل: **+500** سعر في اليوم، والرضاعة **+300** زيادة. والأرقام التلاتة **1600 / 2200 / 2800** بينهم **600** بالظبط."
      - kind: explain
        page: 90
        title: "الهرم"
        quote: "It shows recommended servings for food products."
        text: |
          الـ ==food pyramid== بيوري:
          - **different levels** (تحت = كتير، فوق = قليل)
          - **serving suggestions**
          - **examples of food**

          وبيقسّم الأكل لـ **6 food groups**. الكتاب بيقول اتعمل سنة **1974**.

          ليه الهرم بيتكلم بـ **servings** مش جرامات؟ لأن الحصة وحدة سهلة يفهمها أي حد من غير ميزان: رغيف، فاكهة، كوباية لبن. يعني العيان يقدر يطبّقه في البيت وفي المطعم، وده بالظبط مبدأ **practical** اللي فوق.
      - kind: update
        page: 90
        quote: "It shows recommended servings for food products."
        text: "الـ USDA بدّلت الهرم (recommended servings) بـ **MyPlate** سنة 2011، والـ American Diabetes Association (ADA) بتستخدم الـ plate method وأنظمة أكل فردية. في الامتحان: الهرم بتاع الكتاب."
        ref: "USDA MyPlate 2011; ADA nutrition therapy consensus report 2019"
      - kind: explain
        remind: [dm.L08.010]
        page: 91
        title: "ليه الهرم مهم؟ والـ 6 groups"
        quote: "It helps people feel and do their best.\nThe food pyramid helps us with proper food selection for the most balanced, nutritious meals.\nFood Groups\n  Cereal and grains\n  Vegetables\n  Fruit\n  Milk, yogurt, cheese\n  Meat, fish, poultry\n  Fats, oils, sweets"
        text: |
          الكتاب بيقول الهرم مهم عشان الأكل الصحي بيساعد الأطفال **يكبروا صح**، وبيخلي الناس **feel and do their best**، وبيساعد في ==proper food selection== لوجبات **balanced** و **nutritious**.

          والـ **6 food groups** من تحت لفوق:
          - **Cereal and grains**
          - **Vegetables**
          - **Fruit**
          - **Milk, yogurt, cheese**
          - **Meat, fish, poultry**
          - **Fats, oils, sweets**

          ليه الترتيب ده؟ التفسير المقبول (مش في الكتاب): اللي تحت هو الوقود الأساسي اللي محتاجه كتير، واللي فوق سعرات كتير في حجم صغير ومغذيات قليلة، فبيتاكل **أقل**. يعني الشكل نفسه هو الرسالة: القاعدة عريضة والسن رفيع.
      - kind: check
        page: 91
        quote: "The food pyramid helps us with proper food selection for the most balanced, nutritious meals."
        question: "According to the lecture, why is the food pyramid important?"
        options:
          - "It helps proper food selection for balanced, nutritious meals"
          - "It bans sweets completely"
          - "It replaces carbohydrate counting in diabetes"
          - "It sets drug doses by calorie category"
        answer: 0
        why:
          - "صح: الكتاب: proper food selection for the most balanced, nutritious meals، ونمو الأطفال، وإن الناس يحسوا ويشتغلوا أحسن."
          - "الـ fats و sweets بتتاكل sparingly، مش ممنوعة خالص."
          - "الـ carb counting أداة تانية في نفس المحاضرة، مش بديل."
          - "مفيش أدوية في الهرم."
      - kind: try
        items: [dm.L08.001, dm.L08.002, dm.L08.003, dm.L08.008, dm.L08.010]
    recap:
      - "المبادئ: flexible، realistic، practical، total diet: نظام مرن مش قايمة ممنوعات."
      - "1,600 sedentary women، 2,200 active women و sedentary men، 2,800 active men. حامل +500، رضاعة +300."
      - "الاحتياج بيختلف بالسن والجنس والنشاط."
      - "الهرم (1974): levels، servings، examples؛ 6 groups من الـ grains تحت للـ fats فوق."
    practice: [dm.L08.001, dm.L08.002, dm.L08.003, dm.L08.004, dm.L08.005, dm.L08.006, dm.L08.007, dm.L08.008, dm.L08.009, dm.L08.010]
