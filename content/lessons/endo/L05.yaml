        title: "أشهر NET"
        text: |
          الـ ==carcinoid== هو **most common neuroendocrine tumour (NET)** بمعدل 1.5 لكل 100,000. أغلبه في الـ **appendix**، وبعدين small bowel، stomach، duodenum.

          - الاسم: شكله غير الـ adenocarcinoma وأقل عدوانية.
          - بيطلع من **enterochromaffin cells**: بتتصبغ بالـ potassium chromate، علامة إن فيها **serotonin**.
