  - id: hb.L07.lesson7
    title: "الحمل، الـ immunosuppression، ووخزة الإبرة"
    hook: "حامل عندها HBV، عيان داخل على rituximab، وزميل اتشك بإبرة: تلات مواقف بقرار سريع."
    minutes: 10
    pages: [123, 124]
    topics: [special, reactivation, pep]
    goals:
      - "تمشي في algorithm الحمل برقم 200,000"
      - "تعرف مين ياخد prophylaxis قبل الـ immunosuppression وتعرّف الـ reactivation"
      - "تدي الـ post-exposure prophylaxis الصح في الوقت الصح"
    status: unverified
    steps:
      - kind: explain
        page: 123
        quote: "HBV DNA > 200,000 IU/mL; Consider initiating treatment with tenofovir, lamivudine, or telbivudine at 28-32 wk; Infant receives HBIG + vaccine at birth"
        title: "الحامل اللي عندها HBV"
        text: |
          الـ algorithm فيه سؤالين في وقتين مختلفين.

          **1st trimester**: الأم نفسها محتاجة علاج؟ قيّم الـ HBV replication والـ liver disease. لو فيه active disease أو advanced fibrosis: consider initiating **tenofovir**.

          **End of 2nd trimester**: الطفل في خطر؟ اطلب quantitative HBV DNA و ALT:

          - ==DNA > 200,000 IU/mL==: consider tenofovir، lamivudine، or telbivudine at 28–32 wk.
          - **DNA < 200,000**: monitor.

          وفي الحالتين، الطفل ياخد ==HBIG + vaccine at birth==. والمنطق نفس الدرس الأول: فيروس أكتر في دم الأم = فرصة انتقال أكبر وقت الولادة.
