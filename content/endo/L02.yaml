items:
  # ---------- p13: pituitary physiology ----------
  - id: endo.L02.001
    kind: card
    topic: pituitary-physiology
    front: What happens to the pituitary during pregnancy, and how may it look on a scan?
    back: It enlarges throughout pregnancy (volume rises each trimester) and may become hyperintense on scan.
    src: { page: 13, quote: "The pituitary enlarges throughout pregnancy and may become hyperintense on scan." }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.002
    kind: card
    topic: pituitary-physiology
    front: What drives maternal prolactin up in pregnancy (book figure, PRL axis)?
    back: Placental oestrogen causes lactotroph hyperplasia, so maternal pituitary PRL rises; TRH stimulates and dopamine inhibits the pituitary.
    src: { page: 13, quote: "PRL axis during pregnancy" }
    status: unverified
  - id: endo.L02.003
    kind: card
    topic: pituitary-physiology
    front: Where else is prolactin made in pregnancy, and how does it differ from pituitary PRL?
    back: Decidual PRL, which is not inhibited by dopamine; amniotic fluid PRL is also raised.
    src: { page: 13, quote: "Decidual PRI (not inhibited by dopamine) Amniotic fluid PRL" }
    status: unverified
  # ---------- p14: pituitary adenomas, prolactinoma ----------
  - id: endo.L02.004
    kind: cloze
    topic: prolactinoma
    text: Pituitary adenomas are found at autopsy in about {{c1::11%}} and clinically in {{c2::0.1%}} of persons.
    src: { page: 14, quote: "Pituitary adenomas are quite common, being found at autopsy in about 11% and clinically in 0.1% of persons." }
    status: unverified
    tags: [numbers]
  - id: endo.L02.005
    kind: card
    topic: prolactinoma
    front: Two ways a pituitary adenoma affects fertility and pregnancy outcome?
    back: Over-secretion of hormones by the tumour, and hypopituitarism.
    src: { page: 14, quote: "They may cause problems because of over-secretion of hormones by the tumor as well as by causing hypopituitarism" }
    status: unverified
  - id: endo.L02.006
    kind: card
    topic: prolactinoma
    front: Why is managing pituitary tumours in pregnancy harder?
    back: Pregnancy itself alters hormone secretion and pituitary function, and the effect of each therapy on the fetus shapes decisions.
    src: { page: 14, quote: "Pregnancy itself alters hormone secretion and pituitary function, complicating the evaluation of patients with pituitary neoplasms." }
    status: unverified
  - id: endo.L02.007
    kind: cloze
    topic: prolactinoma
    text: Hyperprolactinaemia causes about {{c1::one-third}} of all female infertility.
    src: { page: 14, quote: "Hyperprolactinemia causes about one third of all female infertility." }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.008
    kind: card
    topic: prolactinoma
    front: Initial therapy of choice for prolactinoma, including women planning pregnancy?
    back: Dopamine agonists.
    src: { page: 14, quote: "generally dopamine agonists are the initial choice of therapy, including those planning pregnancy" }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.009
    kind: table
    topic: prolactinoma
    title: Surgery for prolactinoma in women who want to conceive
    columns: [Tumour, Initial cure, Hypopituitarism]
    rows:
      - [Microadenoma, 80–90%, Rare]
      - [Macroadenoma, 30%, "Risk, and so infertility, rises dramatically"]
    blanks: [[0, 1], [1, 1], [1, 2]]
    src: { page: 14, quote: "Surgical therapy is initially curative in approximately 80-90% of patients with microadenomas and rarely causes hypopituitarism." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L02.010
    kind: cloze
    topic: prolactinoma
    text: After prolactinoma surgery, both micro- and macroadenomas recur in about {{c1::20%}}, lowering long-term cure.
    src: { page: 14, quote: "For both microadenomas and macroadenomas there is a recurrence rate of about 20%, thereby lowering these long-term cure rates." }
    status: unverified
    tags: [numbers]
  - id: endo.L02.011
    kind: cloze
    topic: prolactinoma
    text: The most widely used dopamine agonists are {{c1::bromocriptine}} and {{c2::cabergoline}}; about {{c3::50–75%}} of macroadenomas shrink by 50%.
    src: { page: 14, quote: "Approximately 50-75% of patients with macroadenomas experience a 50% reduction in size" }
    status: unverified
    tags: [numbers]
  # ---------- p15 ----------
  - id: endo.L02.012
    kind: card
    topic: prolactinoma
    front: Advantages of cabergoline over bromocriptine?
    back: Dosed once to twice weekly; more effective and better tolerated, restoring ovulatory menses in over 90% with over 90% tumour shrinkage.
    src: { page: 15, quote: "Cabergoline is dosed once to twice weekly and is more effective and better tolerated than bromocriptine" }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.013
    kind: card
    topic: prolactinoma
    front: Why should a woman with prolactinoma use contraception for 2–3 cycles before trying to conceive?
    back: To establish her intermenstrual interval before pregnancy.
    src: { page: 15, quote: "contraception should be used for 2-3 cycles to establish the intermenstrual interval prior to pregnancy" }
    status: unverified
  - id: endo.L02.014
    kind: card
    topic: prolactinoma
    front: Why does stopping cabergoline at conception still expose the fetus?
    back: Its long half-life keeps the fetus exposed for 1 or more weeks after stopping.
    src: { page: 15, quote: "The long half-life of cabergoline causes fetal exposure for a further 1 or more weeks after cessation of therapy" }
    status: unverified
  - id: endo.L02.015
    kind: card
    topic: prolactinoma
    front: General rule for dopamine agonists once a woman with prolactinoma finds she is pregnant?
    back: Stop the dopamine agonist as soon as pregnancy is discovered.
    src: { page: 15, quote: "discontinue dopamine agonist therapy as soon as they discover that they are pregnant" }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.016
    kind: card
    topic: prolactinoma
    front: Which pregnant women with prolactinoma may continue dopamine agonists throughout pregnancy?
    back: Selected macroadenomas that conceived on therapy with no prior surgery or radiation, especially if the tumour is invasive or abuts the optic chiasm.
    src: { page: 15, quote: "especially if the tumor is invasive or is abutting the optic chiasm" }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.017
    kind: enumerate
    topic: prolactinoma
    prompt: Two points to weigh in a pregnant patient with prolactinoma.
    points:
      - The expected tumour enlargement during pregnancy
      - The safety of fetal exposure to the dopamine agonist in the first several weeks
    pass: 2
    src: { page: 15, quote: "The expected tumor enlargement during pregnancy. 2. The safety of exposure of the developing fetus to the dopamine agonist" }
    status: unverified
  - id: endo.L02.018
    kind: card
    topic: prolactinoma
    front: Why may a prolactinoma enlarge significantly in pregnancy?
    back: The stimulatory hormonal milieu of pregnancy plus withdrawal of the dopamine agonist.
    src: { page: 15, quote: "The stimulatory effect of the hormonal milieu of pregnancy and the withdrawal of the dopamine agonist may result in significant prolactinoma enlargement." }
    status: unverified
  # ---------- p16 ----------
  - id: endo.L02.019
    kind: table
    topic: prolactinoma
    title: Monitoring prolactinoma during pregnancy
    columns: [Tumour, Monitoring]
    rows:
      - [Microadenoma or intrasellar macroadenoma, "No serial MRI or visual fields; clinical review each trimester for signs of expansion"]
      - [Large tumour or extrasellar extension, Formal visual field testing each trimester]
      - [Any prolactinoma, Serum prolactin need not be measured]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 16, quote: "Large tumors and those with extrasellar extension: formal visual field testing should be done each trimester." }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.020
    kind: card
    topic: prolactinoma
    front: Why is serum prolactin not measured to follow a prolactinoma in pregnancy?
    back: The book says it is not necessary; prolactin rises physiologically in pregnancy, so it cannot track the tumour.
    src: { page: 16, quote: "It is not necessary to measure serum prolactin throughout pregnancy." }
    status: unverified
  - id: endo.L02.021
    kind: order
    topic: prolactinoma
    prompt: Options for a prolactinoma that enlarges during pregnancy, in the book's order of use.
    steps:
      - Reinstitute bromocriptine or cabergoline
      - Deliver the baby if pregnancy is sufficiently advanced
      - Surgical (trans-sphenoidal) decompression if these fail
    src: { page: 16, quote: "Surgical decompression is only resorted to if these other approaches fail." }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.022
    kind: card
    topic: prolactinoma
    front: Presumed risk of trans-sphenoidal surgery during pregnancy?
    back: Few data; presumed similar to other surgery in pregnancy, except an increased risk of hypopituitarism.
    src: { page: 16, quote: "it is presumed that the risks would be similar to other forms of surgery, except for the increased risk of hypopituitarism" }
    status: unverified
  - id: endo.L02.023
    kind: card
    topic: prolactinoma
    front: Can bromocriptine be given continuously throughout gestation?
    back: Not recommended, because it crosses the placenta; use in the first few weeks has not increased adverse events.
    src: { page: 16, quote: "Bromocriptine crosses the placenta, and continuous administration throughout gestation is not recommended." }
    status: unverified
  # ---------- p17 ----------
  - id: endo.L02.024
    kind: cloze
    topic: prolactinoma
    text: Cabergoline has been used in the first trimester in more than {{c1::600}} pregnancies with no increase in {{c2::spontaneous abortion, congenital anomalies, multiple gestation or premature delivery}}.
    src: { page: 17, quote: "Cabergoline has been utilized in the first trimester in more than 600 human pregnancies." }
    status: unverified
    tags: [numbers]
  - id: endo.L02.025
    kind: enumerate
    topic: prolactinoma
    prompt: Therapeutic options for prolactinomas extending outside the sella in women planning pregnancy.
    points:
      - Pre-pregnancy surgical debulking
      - More frequent monitoring without dopamine agonist
      - Continuous bromocriptine throughout gestation if severe visual symptoms
    pass: 3
    src: { page: 17, quote: "Therapeutic options for tumors extending outside the sella include pre- pregnancy surgical debulking" }
    status: unverified
  - id: endo.L02.026
    kind: card
    topic: prolactinoma
    front: Does breastfeeding stimulate prolactinoma growth?
    back: No evidence that suckling stimulates growth.
    src: { page: 17, quote: "There is no evidence that suckling stimulates prolactinoma growth." }
    status: unverified
  - id: endo.L02.027
    kind: card
    topic: prolactinoma
    front: Why are dopamine agonists withheld while a woman with prolactinoma breastfeeds?
    back: They lower PRL and stop milk production.
    src: { page: 17, quote: "dopamine agonists must be withheld until the period of breastfeeding is over, as they will cause a reduction in PRL and cessation of milk production" }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.028
    kind: card
    topic: prolactinoma
    front: When is a prolactinoma patient reassessed after pregnancy, and what may happen to PRL?
    back: Two months after delivery or after lactation stops; PRL may fall or normalise after pregnancy.
    src: { page: 17, quote: "Patients should be reassessed two months following delivery or cessation of lactation. PRL may decrease or normalize after pregnancy." }
    status: unverified
  # ---------- p18: HPA axis and Cushing ----------
  - id: endo.L02.029
    kind: card
    topic: pituitary-physiology
    front: Which placental products drive the maternal adrenal in pregnancy (book figure, HPA axis)?
    back: Placental CRH and placental ACTH (possibly POMC and beta-endorphin), so the ACTH set point is altered.
    src: { page: 18, quote: "Placental CRH ACTH" }
    status: unverified
  - id: endo.L02.030
    kind: card
    topic: pituitary-physiology
    front: Why do free, bound and urinary cortisol all rise in pregnancy (HPA figure)?
    back: Oestrogen raises CBG (more bound cortisol), free cortisol rises, and urinary cortisol and metabolites rise; progesterone causes cortisol resistance.
    src: { page: 18, quote: "Free cortisol # CBG" }
    status: unverified
  - id: endo.L02.031
    kind: card
    topic: pituitary-physiology
    front: What protects the fetus from maternal hypercortisolism?
    back: Placental 11-beta HSD2 converts cortisol to cortisone.
    src: { page: 18, quote: "Cortisol Cortisone" }
    status: unverified
  - id: endo.L02.032
    kind: cloze
    topic: cushing
    text: Pregnancy is {{c1::rare}} in Cushing's syndrome; of gestational cases, about {{c2::half}} are adrenal and about {{c3::40%}} are Cushing's disease.
    src: { page: 18, quote: "Half of the reported gestational CS cases have adrenal causes, and about 40% are Cushing’s disease (CD)" }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L02.033
    kind: card
    topic: cushing
    front: What variant of Cushing's disease is reported in pregnancy?
    back: Cyclical Cushing's disease from ACTH-producing pituitary adenomas with fluctuating ACTH.
    src: { page: 18, quote: "Cyclical CD due to ACTH-producing pituitary adenomas with fluctuating ACTH levels are also reported." }
    status: unverified
  - id: endo.L02.034
    kind: enumerate
    topic: cushing
    prompt: Maternal morbidities of Cushing's syndrome in pregnancy.
    points: [Gestational diabetes, Hypertension, Pre-eclampsia, Eclampsia, Congestive heart failure, Pulmonary oedema]
    pass: 4
    src: { page: 18, quote: "Gestational diabetes, hypertension, pre- eclampsia, eclampsia, congestive heart failure, and pulmonary edema" }
    status: unverified
  # ---------- p19: diagnosis of Cushing ----------
  - id: endo.L02.035
    kind: card
    topic: cushing
    front: Which features of Cushing's overlap with normal pregnancy?
    back: Weight gain, hypertension, glucose intolerance and striae.
    src: { page: 19, quote: "similarities to normal pregnancy such as weight gain, hypertension, glucose intolerance, and striae" }
    status: unverified
  - id: endo.L02.036
    kind: card
    topic: cushing
    front: How do striae of normal pregnancy differ from those of Cushing's?
    back: Pregnancy striae are usually white; Cushing's striae are large and purple.
    src: { page: 19, quote: "In normal pregnancy, the striae are usually white in contrast to large purple striae in CS." }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.037
    kind: enumerate
    topic: cushing
    prompt: Important clinical clues to Cushing's syndrome in a pregnant woman.
    points: [Hypokalaemia, Muscle weakness, Pathological fractures, Large purple abdominal striae, "Hirsutism and acne (excess androgen)"]
    pass: 3
    src: { page: 19, quote: "The presence of hypokalemia, muscle weakness, pathological fractures, and large purple abdominal striae are important clues for CS" }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.038
    kind: card
    topic: cushing
    front: Why should the dexamethasone suppression test not be used in pregnancy (Endocrine Society 2008)?
    back: False-positive results from a blunted response to dexamethasone; low-dose dexamethasone usually fails to suppress cortisol in pregnancy.
    src: { page: 19, quote: "because of false positive results secondary to blunted response to dexamethasone" }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.039
    kind: card
    topic: cushing
    front: How is circadian cortisol rhythm used for Cushing's in pregnancy?
    back: Rhythm is preserved in pregnancy, so its loss is a clue; but the late-night cortisol nadir is higher than in non-pregnant women.
    src: { page: 19, quote: "Since serum cortisol circadian variation is preserved during pregnancy, loss of circadian rhythm might be a clue for CS" }
    status: unverified
  - id: endo.L02.040
    kind: card
    topic: cushing
    front: Best screening test for Cushing's syndrome in pregnancy?
    back: Urinary free cortisol (UFC).
    src: { page: 19, quote: "UFC has been suggested as the best choice for screening of CS during pregnancy." }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.041
    kind: cloze
    topic: cushing
    text: UFC is unchanged in the {{c1::first}} trimester but rises up to {{c2::threefold}} in the second and third; in the last two trimesters only UFC over {{c3::three times the upper limit}} counts.
    src: { page: 19, quote: "UFC greater than three times the upper limit should be taken into consideration in the last two trimesters" }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L02.042
    kind: card
    topic: cushing
    front: Use and caveats of plasma ACTH in gestational Cushing's?
    back: Separates ACTH-dependent from independent CS, bearing in mind that adrenal causes predominate and ACTH rises physiologically in pregnancy.
    src: { page: 19, quote: "Plasma ACTH levels can be used for differential diagnosis of ACTH- and non ACTH-dependent CS" }
    status: unverified
  - id: endo.L02.043
    kind: card
    topic: cushing
    front: Is inferior petrosal sinus sampling routine for Cushing's in pregnancy?
    back: No, it should not be a routine investigation.
    src: { page: 19, quote: "Inferior petrosal sinus sampling should not be a routine investigation method." }
    status: unverified
  # ---------- p20 ----------
  - id: endo.L02.044
    kind: card
    topic: cushing
    front: Why may pituitary imaging miss Cushing's disease in pregnancy?
    back: CD is usually a microadenoma, and normal pituitary growth in pregnancy can mask it.
    src: { page: 20, quote: "the growth of the pituitary gland during normal pregnancy can mask the visualization of the microadenomas" }
    status: unverified
  - id: endo.L02.045
    kind: card
    topic: cushing
    front: Imaging rules for suspected Cushing's in pregnancy?
    back: Avoid adrenal CT; reserve pituitary MRI for patients in whom pituitary surgery is planned.
    src: { page: 20, quote: "Adrenal computerized tomography (CT) scans should be avoided, and pituitary MRI should be reserved for patients for whom pituitary surgery is planned." }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.046
    kind: table
    topic: cushing
    title: Treatment of Cushing's disease by trimester
    columns: [Diagnosed in, Treatment]
    rows:
      - [First trimester, "Medical therapy by severity, then remove the tumour in the second trimester"]
      - [Second trimester, Surgery (treatment of choice)]
      - [Late third trimester, "Medical therapy; surgery postponed until after delivery"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 20, quote: "Surgery is the treatment of choice for pregnant women with CD during the second trimester." }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.047
    kind: card
    topic: cushing
    front: Drug of choice for medical therapy of Cushing's in pregnancy?
    back: Metyrapone.
    src: { page: 20, quote: "Metyrapone is the drug of choice for medical therapy." }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.048
    kind: card
    topic: cushing
    front: What must be watched for after treating Cushing's disease in pregnancy (surgery or drugs)?
    back: Adrenal insufficiency; monitor and treat it.
    src: { page: 20, quote: "should be monitored and treated for possible adrenal insufficiency" }
    status: unverified
  # ---------- p21: GH axis and acromegaly ----------
  - id: endo.L02.049
    kind: card
    topic: pituitary-physiology
    front: Features of placental GH variant (GH-V) in the book's figure?
    back: Secreted continuously by the placenta; detected at week 5 and peaks at weeks 35–37; affected neither by GHRH nor ghrelin; binds GHBP.
    src: { page: 21, quote: "Detected at Sth week, and peaks at 35—37th weeks -Affected neither by GHRH nor by ghrelin -Binds GHBP" }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.050
    kind: card
    topic: pituitary-physiology
    front: What happens to maternal pituitary GH and to IGF-1 in normal pregnancy?
    back: Pituitary GH falls (suppressed by IGF-1 feedback) while GH-V drives IGF-1 up, with a growth-promoting effect on fetus and placenta.
    src: { page: 21, quote: "Growth-promoting effect on fetus and placenta" }
    status: unverified
  - id: endo.L02.051
    kind: card
    topic: acromegaly
    front: Fertility in acromegaly?
    back: Infertility is common; many patients need a dopamine agonist to ovulate and conceive.
    src: { page: 21, quote: "Infertility is common in women with Acromegaly. Many patients require a dopamine agonist to ovulate and conceive." }
    status: unverified
  - id: endo.L02.052
    kind: cloze
    topic: acromegaly
    text: In a study of 24 pregnant women with acromegaly, only {{c1::4 (17%)}} had tumour enlargement with a visual field defect.
    src: { page: 21, quote: "only 4 patients (17%) showed enlargement of their tumors with a resultant visual field defect" }
    status: unverified
    tags: [numbers]
  - id: endo.L02.053
    kind: card
    topic: acromegaly
    front: What should be monitored in pregnant acromegalic women with macroadenomas?
    back: Symptoms of tumour enlargement and visual fields, plus glucose tolerance, hypertension and cardiac derangements.
    src: { page: 21, quote: "Glucose tolerance, hypertension, and cardiac derangements also require monitoring." }
    status: unverified
  - id: endo.L02.054
    kind: cloze
    topic: acromegaly
    text: Glucose intolerance occurs in {{c1::50%}} of patients with acromegaly, with overt diabetes in {{c2::10–20%}}.
    src: { page: 21, quote: "Glucose intolerance occurs in 50% of patients with Acromegaly, with overt diabetes mellitus in 10-20%." }
    status: unverified
    tags: [numbers]
  - id: endo.L02.055
    kind: card
    topic: acromegaly
    front: Why does maternal acromegaly have little direct impact on the fetus, and what causes macrosomia?
    back: GH does not cross the placenta and fetal growth is largely GH-independent; macrosomia is likely due to maternal glucose intolerance.
    src: { page: 21, quote: "GH does not cross the placenta, and maternal Acromegaly has little direct impact on the fetus." }
    status: unverified
    tags: [high-yield]
  # ---------- p22 ----------
  - id: endo.L02.056
    kind: card
    topic: acromegaly
    front: Why is acromegaly hard to diagnose during pregnancy?
    back: Pituitary GH is autonomous, so pituitary and placental GH both persist, and conventional assays cannot tell the two forms apart.
    src: { page: 22, quote: "conventional assays are unable to distinguish between the 2 forms of GH" }
    status: unverified
  - id: endo.L02.057
    kind: cloze
    topic: acromegaly
    text: In acromegaly pituitary GH is {{c1::pulsatile (13–19 pulses per 24 hours)}}, whereas placental GH is {{c2::tonic}}; after delivery the placental variant disappears within {{c3::24 hours}}.
    src: { page: 22, quote: "a pulsatility of 13-19 pulses per 24 hours, vs. the tonic secretion seen with the placental variant" }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L02.058
    kind: card
    topic: acromegaly
    front: Why is IGF-1 not useful to diagnose acromegaly in pregnancy?
    back: It is raised in the second half of both normal and acromegalic pregnancies.
    src: { page: 22, quote: "IGF-1 levels are not useful in the diagnosis of acromegaly in pregnancy" }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.059
    kind: card
    topic: acromegaly
    front: Major concern about acromegaly in pregnancy?
    back: Tumour expansion leading to neurological or visual complications.
    src: { page: 22, quote: "The major concern about acromegaly during pregnancy is the potential tumor expansion leading to neurological or visual complications." }
    status: unverified
  - id: endo.L02.060
    kind: cloze
    topic: acromegaly
    text: Dopamine agonists control acromegaly in {{c1::10%}} of patients and work better on tumours that {{c2::co-secrete GH and PRL}}.
    src: { page: 22, quote: "Dopamine agonists can control the disease in 10 % of acromegalic patients." }
    status: unverified
    tags: [numbers]
  - id: endo.L02.061
    kind: card
    topic: acromegaly
    front: Safety data on somatostatin analogues in pregnant acromegalic women?
    back: In 36 treated pregnancies no malformations were reported, but short-acting octreotide reduced uterine artery flow and one fetus had IUGR that responded to a lower octreotide LAR dose.
    src: { page: 22, quote: "a decrease in uterine artery blood flow has been reported with short-acting octreotide" }
    status: unverified
  - id: endo.L02.062
    kind: card
    topic: acromegaly
    front: Why can octreotide affect the fetus?
    back: It binds placental somatostatin receptors and crosses the placenta, reaching fetal tissues rich in somatostatin receptors, especially the brain.
    src: { page: 22, quote: "Octreotide binds to somatostatin receptors in the placenta and crosses the placenta" }
    status: unverified
  # ---------- p23 ----------
  - id: endo.L02.063
    kind: card
    topic: acromegaly
    front: Advice on somatostatin analogues when pregnancy is considered?
    back: Stop them if pregnancy is considered, and use contraception while taking them.
    src: { page: 23, quote: "somatostatin analogs should be discontinued if pregnancy is considered and that contraception be used" }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.064
    kind: cloze
    topic: acromegaly
    text: Interrupting acromegaly drug therapy for {{c1::9–12 months}} should not harm the long-term outcome.
