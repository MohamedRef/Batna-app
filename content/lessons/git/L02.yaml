  - id: git.L02.lesson4
    title: "سونار جوه المعدة، ومنظار جوه المنظار"
    hook: "EUS بيشوف اللي ورا الحيطة، والـ mother-baby scope بيدخل جوه الـ bile duct نفسه."
    minutes: 9
    pages: [63, 68]
    topics: [eus, cholangioscopy]
    goals:
      - "تعدّ دواعي الـ endoscopic ultrasound (EUS) التشخيصية والعلاجية وتعرف ليه"
      - "تشرح الـ mother-baby-scope وفايدته"
    status: unverified
    steps:
      - kind: explain
        page: 63
        quote: "EUS allows examination of both the lining of GIT, but also of the wall of the tract and its surrounding structures such as the liver, pancreas, bile ducts and lymph nodes."
        title: "الـ EUS بيشوف إيه؟"
        text: |
          ==EUS== = منظار في طرفه **ultrasound processor** (echoendoscope).

          بيشوف مش بس الـ **lining**، لكن كمان **جدار** الأمعاء وحواليها: **liver**، **pancreas**، **bile ducts**، و **lymph nodes**. وأحيانًا بيلاقي حاجات الـ imaging التاني مش بيلاقيها.

          الجديد: channel كبيرة **3.2 mm** لتدخلات أجرأ، و **3D EUS** بيعرض في أي plane.
      - kind: reveal
        page: 63
        quote: "EUS can sometimes detect abnormalities or obtain information other imaging tests cannot."
        prompt: "ليه الـ EUS بيشوف حاجات الـ CT والـ US العادي مش بيشوفوها؟"
        answer: |
          الكتاب: الـ EUS ساعات بيلاقي **abnormalities** أو معلومات **other imaging tests cannot**.

          التفسير المقبول (مش في الكتاب): الـ US من على البطن لازم يعدّي جلد ودهون وغازات الأمعاء، وكل ده بيشتت الصوت. الـ EUS بيقعد **جوه** المعدة أو الـ duodenum، يعني **ملزوق** في الـ pancreas والـ bile duct. والمسافة القصيرة بتسمح بـ **frequency أعلى**، فالتفاصيل أدق بكتير: طبقات الحيطة، lesion قد ملليمترات، و lymph node صغيرة.
      - kind: figure
