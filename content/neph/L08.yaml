  - id: neph.L08.203
    kind: mcq
    topic: transplant
    stem: A kidney transplant biopsy shows glomerulitis (g2) and peritubular capillaritis (ptc2), C4d negative, with no glomerulonephritis. Which statement fits the Banff 2017 rules?
    options:
      - g + ptc ≥ 2 can satisfy criterion 2 without C4d; check donor-specific antibodies
      - ABMR is excluded because C4d is negative
      - This is TCMR grade IA
      - This is C4d staining without evidence of rejection
      - Chronic active ABMR is proven
    answer: 0
    why:
      - Correct. At least moderate MVI (g + ptc ≥ 2) is an alternative to C4d for criterion 2; DSA is needed for criterion 3.
      - C4d is only one of the options for criterion 2.
      - TCMR IA is graded on interstitial inflammation and tubulitis, not capillaritis.
      - That category needs positive C4d with no tissue injury.
      - Chronic active ABMR needs chronic injury (e.g. transplant glomerulopathy).
    src: { page: 282, quote: "At least moderate microvascular inflammation ([g + ptc] ≥2) in the absence of recurrent or de novo glomerulonephritis," }
    status: unverified
