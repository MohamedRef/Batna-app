      - kind: explain
        page: 116
        quote: "The current view on IBS and other functional gastrointestinal (GI) disorders is that they are complex, biopsychosocial and multifactorial conditions with dysregulation at both the central and peripheral level."
        title: "كل عرض وآليته"
        text: |
          الكتاب: الـ IBS حالة ==biopsychosocial و multifactorial==، فيها **dysregulation** في الـ central والـ peripheral، والسبب الدقيق لسه مش معروف.

          والآليات:
          - **Delayed meal transit** ← ميل للـ **constipation**.
          - **Accelerated meal transit** ← ميل للـ **diarrhea**.
          - **Spasms** ← abdominal pain.
          - **Hypersensitivity** لتمدد طبيعي جوه المصران.
          - إحساس أعلى بالألم مع كمية **غاز طبيعية**.

          التفسير المقبول (مش في الكتاب): ده بيربط بالـ Bristol scale اللي فوق: البراز بيقعد في القولون أطول ← المية بتتمص أكتر ← النوع 1 و 2 (كور ناشفة). ولو بيعدّي بسرعة ← المية ما تلحقش تتمص ← النوع 6 و 7. يعني شكل البراز **مرآة** لسرعة الـ transit.
      - kind: explain
        page: 117
        quote: "| Mechanism | Features |\n|---|---|\n| Psychopathology | Psychological stress and emotional events; Common psychological symptoms associated with IBS: depression, somatization, anxiety, hostility, phobia, and paranoia |\n| Post-infectious IBS | Risk factors: longer duration of illness, type of pathogen involved, smoking, female, absence of vomiting during infectious illness, and young age; Increased numbers of colonic mucosal lymphocytes and enteroendocrine cells -> high levels of serotonin secretion -> enhanced motility, increased intestinal permeability, and lowered visceral sensation thresholds |\n| Intestinal microbiome alteration | Increase in number or change in type of organism -> bloating, distensions, abdominal pain, diarrhoea or constipation; Abnormal immune system interaction with gut flora -> abnormal cytokine signalling profile -> IBS |\n| Neurohormonal | The limbic system mediation of emotion and autonomic response; Increase hypothalamic CRF production in response to stress -> motility disturbances |\n| Brain-gut interaction | CNS modulates secretion, motility, and blood flow; Signals from the gut regulate reflexes; Eg: Serotonin (5-HT) -> stimulate extrinsic afferent pathways involved in pain perception by CNS & stimulate intrinsic afferent neurons involved in triggering intestinal motor responses; 5-HT -> key mediator of visceral hypersensitivity & abnormal bowel motility |\n| Food sensitivity | Fatty food, short-chain carbohydrates (such as fructose), some types of vegetables (such as broccoli and cauliflower) |"
        title: "ليه بيحصل؟"
        text: |
          الـ IBS **biopsychosocial** و multifactorial: dysregulation في الـ central والـ peripheral.

          - **Motility:** transit بطيء = constipation، سريع = diarrhea، و **spasms** = ألم.
          - **Visceral hyperalgesia:** ألم مع distension وكمية غاز طبيعية.
          - **Stress:** الـ limbic system، و **chronic renal failure (CRF)** من الـ hypothalamus بيزوّد الـ motility disturbance.
          - ==Serotonin (5-HT)==: الـ key mediator للـ visceral hypersensitivity والحركة الغلط.
          - **Post-infectious:** lymphocytes و enteroendocrine cells أكتر، serotonin أعلى. والـ risk factors: مدة أطول للعدوى، نوع الميكروب، smoking، female، young، و ==absence of vomiting== أثناء العدوى.
          - **Food:** الدسم، الـ fructose، و broccoli و cauliflower.

          يعني الـ IBS مش مرض واحد بآلية واحدة، وده السبب إن العلاج بيتختار على حسب العرض الغالب (إمساك، إسهال، ألم).
      - kind: reveal
        page: 117
        quote: "5-HT >key mediator of visceral hypersensitivity & abnormal bowel motility"
        prompt: "ليه الـ serotonin بالذات هو المفتاح في الـ IBS؟"
        answer: |
          الكتاب: الـ **serotonin (5-HT)** بيحفّز الـ **extrinsic afferent** اللي المخ بيحس منها بالألم، **و** الـ **intrinsic afferent neurons** اللي بتطلق حركة المصران. علشان كده هو ==key mediator== للـ visceral hypersensitivity **و** الـ abnormal motility.

          وكمان الكتاب: الـ **limbic system** بيتوسّط المشاعر والـ autonomic response، والـ stress بيزوّد الـ **CRF** من الـ hypothalamus فيعمل motility disturbances. وفيه أكل بيزوّد الأعراض: **fatty food**، **short-chain carbohydrates** زي الـ fructose، وخضار زي **broccoli** و **cauliflower**.

          التفسير المقبول (مش في الكتاب): مادة واحدة ماسكة الاتنين، الإحساس والحركة. علشان كده أدوية الـ IBS الحديثة كتير منها بتشتغل على الـ 5-HT receptors (هتشوفها في العلاج: alosetron، ondansetron، ramosetron للـ diarrhea).
      - kind: explain
        page: 118
        quote: "This is usually colicky or cramping in nature, felt in the lower abdomen and relieved by defecation."
        title: "شكله في العيادة"
        text: |
          - **Pain:** colicky أو cramping، تحت في البطن، و ==relieved by defecation==.
          - **Bloating** بيزيد على مدار اليوم.
          - الـ constipation: براز **pellety** قليل. الـ diarrhea: مرات كتير بس **low-volume**، ونادرًا بالليل.
          - **Mucus** عادي، بس ==rectal bleeding does not occur==.
          - الوزن ثابت والمريض constitutionally well، والكشف طبيعي غير شوية tenderness.
          - ومعاه ممكن أعراض برّه البطن: fatigue، urinary urgency، sexual dysfunction.

          التفسير المقبول (مش في الكتاب): ليه الألم بيروح بالحمام؟ لأن التمدد في القولون هو اللي بيعمل الألم عند المصران الحساس، فلما يفضى الضغط يقل. وده نفس السبب إن الانتفاخ بيزيد مع اليوم: أكل أكتر، غاز أكتر، تمدد أكتر.
      - kind: check
        page: 118
        quote: "Those with diarrhea have frequent defecation but produce low-volume stools and rarely have nocturnal symptoms."
        question: "Which feature fits IBS with diarrhoea in the lecture?"
        options:
          - "Frequent, low-volume stools, rarely at night"
          - "Large-volume stools that wake him at night"
          - "Rectal bleeding with mucus"
          - "Weight loss and fever"
        answer: 0
        why:
          - "صح: الكتاب: **frequent defecation** بس **low-volume**، و **rarely nocturnal**."
          - "التفسير المقبول (مش في الكتاب): الإسهال الكتير اللي بيصحّي من النوم بيشاور على سبب organic (زي IBD أو malabsorption)."
          - "الـ mucus شائع، لكن الـ **rectal bleeding does not occur** في الـ IBS."
          - "مرضى الـ IBS **do not lose weight** و constitutionally well."
      - kind: explain
        page: 119
        quote: "Patients do not lose weight and are constitutionally well. Physical examination is generally unremarkable, with the exception of variable tenderness to palpation."
        title: "الحاجات اللي ما تحصلش في الـ IBS"
        text: |
          الكتاب:
          - الـ **mucus** شائع، لكن ==rectal bleeding does not occur==.
          - المرضى ==do not lose weight== و **constitutionally well**.
          - الكشف عادةً طبيعي، ما عدا **tenderness** متغيّرة.

          التفسير المقبول (مش في الكتاب): دي أهم سطور في الدرس عمليًا، لأنها بتقول إمتى **ما تقولش IBS**. الدم والوزن اللي بينزل والحاجات اللي بتصحّي من النوم كلها بتشاور على مرض organic (IBD، cancer، coeliac)، والـ IBS بطبيعته ما بيعملهاش. يعني لو لقيت واحدة منهم، ارجع للـ work-up حتى لو المعايير متحققة.
      - kind: figure
        page: 119
        title: "الـ IBS نادرًا ما بيبقى لوحده"
        image: { file: git/L03-ibs-overlap.webp, book: true }
        alt: "Book drawing of a woman's body labelled with conditions that overlap with IBS: chronic fatigue syndrome, sleep disturbances, post-traumatic stress disorder, headache, temporomandibular joint syndrome, fibromyalgia, sicca syndrome, lump in the throat, swallowing difficulties, chest pain, nausea, dyspepsia, heartburn, back pain, chronic pelvic pain, bloating, sexual dysfunction, urinary urgency and interstitial cystitis."
        caption: |
          الرسمة بتجمع اللي بيتداخل مع الـ IBS: **fibromyalgia**، **chronic fatigue**، **headache**، **TMJ syndrome**، **sleep disturbances**، **PTSD**، **chronic pelvic pain**، **interstitial cystitis**، والـ functional upper GI (dyspepsia، heartburn، lump in the throat).

          التفسير المقبول (مش في الكتاب): افتكر بوابة الألم في المخ (الـ ACC). لما تبقى مفتوحة، كل الجسم بيشتكي، مش المصران بس.
