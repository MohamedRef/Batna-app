    kind: card
    topic: hellp
    front: Why is AKI in HELLP syndrome multifactorial?
    back: The kidney changes of preeclampsia plus coagulopathy causing bleeding and acute tubular necrosis.
    src: { page: 358, quote: "often multifactorial and, in addition to the kidney changes characteristic of preeclampsia, there is associated coagulopathy, resulting in bleeding and acute tubular necrosis. HELLP syndrome is considered a thrombotic microangiopathy like syndrome due to occurrence of thrombocytopenia, hemolysis, and AKI. Like TTP and HUS, kidney biopsies of women with HELLP syndrome may occasionally display findings of thrombotic microangiopathy, but commonly (14) show manifestations consistent with acute tubular necrosis." }
