  - id: res.L17.lesson5
    title: "الـ t-test: الحمل والهيموجلوبين"
    hook: "متوسط الـ Hb% في ستات البلد 89%. أخدنا 25 حامل متوسطهم 86%. الحمل بيأثر فعلًا ولا الـ 3% دول صدفة؟"
    minutes: 8
    pages: [29, 33]
    topics: ["t_test"]
    goals:
      - "تكتب الـ H0 لمثال الـ Hb"
      - "تحسب الـ one-sample t والـ df"
      - "تقرأ الـ critical t وتكتب الاستنتاج"
    status: unverified
    steps:
      - kind: explain
        page: 30
        quote: |
          If it is known that the mean Hb% of adult females in a community is 89% and we want to test whether pregnancy has a significant effect on hemoglobin level.
          So a sample of pregnant females is chosen and calculate the arithmetic mean and standard deviation (S) of the sample n = 25, X= 86%, S = 7%
        title: "المسألة"
        text: |
          متوسط الـ **Hb%** في ستات المجتمع البالغين = ==89%== (معروف).

          أخدنا sample من الحوامل: n = **25**، X̄ = **86%**، S = **7%**.

          مجموعة واحدة قصاد متوسط population معروف، يبقى ==t-test with population== (one-sample t).
      - kind: explain
        page: 31
        quote: |
          Null hypothesis (Ho):
          No significant effect of pregnancy on Hb level.
          I.e.: difference between the mean Hb% of total population and that of the sample is only by chance,
          i.e.: 86% does not differ significantly from 89%.
        title: "الـ H0"
        text: |
          **H0**: مفيش أثر significant للحمل على الـ Hb.

          يعني الفرق بين متوسط المجتمع ومتوسط العينة ==مجرد صدفة==، و86% مش مختلفة significantly عن 89%.
      - kind: explain
        page: 32
        quote: "t = (X - μ) / (S / √n) = (86 - 89) / (7 / √25) = 2.14"
        title: "القانون والحساب"
        text: |
          **t = (X̄ − μ) / (S / √n)**

          = (86 − 89) / (7 / √25) = −3 / 1.4 = ==−2.14==

          السلايد كاتباها 2.14 لأن اللي بيهمنا ==حجم الـ t== مش إشارته (الطرفين بيترفضوا).
      - kind: reveal
        page: 33
        quote: |
