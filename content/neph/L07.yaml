    src: { page: 197, quote: "Nail abnormalities occur in about 98% of patients and are typically bilateral and symmetric. Fingernails are affected more often than toe-nails. The nails may be absent or dystrophic with discoloration, koil-onychia, longitudinal ridges, or triangular lunulae.50" }
