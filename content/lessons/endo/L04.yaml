        why: "الإسهال: DM (بالليل)، hyperthyroid، Addison's. الإمساك: hypercalcaemia و hypothyroid. والـ DM كمان بيعمل gastroparesis و biliary dyskinesia، وهو والـ hyperthyroid بيعملوا oesophageal dysfunction."
      - kind: explain
        page: 54
        quote: "Motility Disorders\n  a) Esophageal dysfunction -DM- Hyperthroidism.\n  b) Gastroparesis & billiary dyskinasia in DM."
        title: "ليه كل غدة بتعمل كده في الأمعاء؟"
        text: |
          الكتاب بيدّي القائمة من غير سبب. التفسير المقبول (مش في الكتاب):
          - **DM**: الـ autonomic neuropathy بتبوّظ الأعصاب اللي بتحرّك المعدة والمرارة، فيبقى gastroparesis و biliary dyskinesia، والإسهال بيبقى **بالليل** لأن الـ autonomic control بيبقى أضعف.
          - **Hyperthyroidism**: كل حاجة في الجسم أسرع، ومنها حركة الأمعاء، فإسهال.
          - **Hypothyroidism**: العكس، كل حاجة أبطأ، فإمساك.
          - **Hypercalcaemia**: الكالسيوم العالي بيقلل استثارة العضلات والأعصاب، فالأمعاء تكسل.
          - **Addison's**: نقص الـ cortisol والـ aldosterone بيعمل أعراض هضمية منها الإسهال.

          يعني لو افتكرت «سريع = إسهال، بطيء = إمساك» هتجيب أغلبهم.
