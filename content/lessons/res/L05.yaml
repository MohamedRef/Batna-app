      - kind: order
        page: 41
        quote: "Steps of a cohort study:\n  1. Selection of study subjects\n  2. Obtaining data on exposure\n  3. Selection of a comparison group\n  4. Follow up\n  5. Analysis"
        prompt: "رتّب خطوات الـ cohort study:"
        steps:
          - "Selection of study subjects"
          - "Obtaining data on exposure"
          - "Selection of a comparison group"
          - "Follow up"
          - "Analysis"
        why: "تختار الناس، تعرف مين exposed وبدرجة قد إيه، تختار مجموعة المقارنة، تتابع، وبعدين تحلل."
      - kind: explain
        page: 42
        quote: "Prospective Cohort, Selection of cohort:\n  Heterogeneous (internal comparison) e.g smoking\n  Homogeneous (external comparison) e.g X-ray"
        title: "Heterogeneous ولا homogeneous؟"
        text: |
          - ==Heterogeneous== cohort: نفس المجموعة فيها exposed و unexposed، فالمقارنة **internal** (مثال: smoking).
          - ==Homogeneous== cohort: الكل exposed (زي عمال الـ X-ray)، فلازم مقارنة **external** بمجموعة برة.

          الدكتورة قالت في الشرح: الـ external comparison ممكن تكون مجموعة أقل تعرّض زي الموظفين الإداريين، بس خلي بالك إن اختلاف الشغل بييجي معاه اختلافات تانية لازم تتقيّم.

          الـ **exposure data** بتيجي من: الناس نفسهم، records، medical exam أو special tests، environmental surveys.
          والـ **follow-up**: periodic medical exam، records، death records، mailed questionnaires، تليفونات، زيارات بيت.
      - kind: explain
        remind: [res.L05.035, res.L05.036]
        page: 43
        quote: "Obtaining data on exposure: To know whether they are exposed or not, and also the degree of exposure. Various methods used are:\n  Directly from cohort members\n  Review of records\n  Medical examination or special tests\n  Environmental surveys"
        title: "نعرف الـ exposure إزاي؟"
        text: |
          عايز تعرف مين ==exposed ومين لأ، وكمان درجة الـ exposure==. الطرق:

          - **directly from cohort members** (تسألهم).
          - **review of records**.
          - **medical examination or special tests**.
          - **environmental surveys**.

          ليه «درجة» مش بس أيوه أو لأ؟ علشان تقدر تشوف هل الـ risk بيزيد كل ما الـ exposure يزيد، ودي من أقوى العلامات على السببية. التفسير المقبول (مش في الكتاب).
      - kind: check
        page: 44
        quote: "Follow-up: Regular follow up of all participants to obtain data for assessing the outcome. Few methods are:\n  Periodic medical examination\n  Review records\n  Routine surveillance of death records\n  Mailed questionnaires, telephone calls, home visits."
        question: "Which is NOT a follow-up method listed for a cohort study?"
        options:
