          - **Indications**: severe osteoporosis (T ≤ −3)، multiple vertebral fractures، فشل أو عدم تحمل الـ bisphosphonates.
          - **Side effects**: nausea، leg cramps، **hypercalcemia**.
          - **Black box**: osteosarcoma في الفيران، ما اتشافش في البني آدمين.
