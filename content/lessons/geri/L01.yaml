          - [Ramipril, "2.5 o.d.", "10 o.d."]
          - [Bisoprolol, "1.25 o.d.", "10 o.d."]
          - [Carvedilol, "3.125 b.i.d.", "25 b.i.d."]
          - [Spironolactone, "25 o.d.", "50 o.d."]
          - [Sacubitril/valsartan, "49/51 b.i.d.", "97/103 b.i.d."]
