  # ---------- cases and essays ----------
  - id: rheum.L21.046
    kind: case
    topic: renal
    stem: A 38-year-old woman has had Raynaud phenomenon for 1 year and rapidly spreading skin thickening of her hands, forearms, upper arms and chest over 8 months.
    steps:
      - question: Which form of SSc?
        options: [Diffuse, Limited (CREST), Malignant, Morphoea]
        answer: 0
        why: "Skin proximal to the elbows and involving the trunk = diffuse (p346)."
      - question: Which organ problems are more common in this form?
        options: ["Pulmonary fibrosis and renal crisis", "Isolated pulmonary hypertension only", "Calcinosis only", "None"]
