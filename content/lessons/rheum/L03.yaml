  - id: rheum.L03.lesson4
    title: "Type II: الـ antibody على باب الخلية"
    hook: "في type II الـ antibody مش بيلف في الدم: بيقف على باب الخلية نفسها، يا يكسره يا يقفله يا يفتحه غصب."
    minutes: 8
    pages: [61, 63]
    topics: [type2]
    goals:
      - "تعرف تلات طرق بتموت بيها الخلية في type II، وليه الـ antibody بيقدر يعملهم"
      - "تعدّ أمثلة الـ complement lysis وتفسّر كل واحد"
      - "تفرّق Graves عن myasthenia gravis"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L03.064]
        page: 61
        quote: "Occurs when damage to the host tissues is caused by cellular lysis induced by the direct binding of antibody (IgG or IgM) to cell surface antigens."
        title: "Direct antibody-mediated cytotoxicity"
        text: |
          ==Type II== = antibody (**Immunoglobulin G (IgG) أو Immunoglobulin M (IgM)**) بيمسك في **antigen على سطح الخلية** ← cell lysis.

          الخلية بتموت بـ:
          1. **Phagocytosis**
          2. **Complement activation**
          3. ==Antibody-dependent cell-mediated cytotoxicity (ADCC)== (antibody-dependent cell-mediated cytotoxicity) بالـ **natural killer (NK) cells**

          التفسير المقبول (مش في الكتاب): ليه antigen على سطح الخلية بالذات؟ عشان الـ antibody لما يمسك في الخلية نفسها، أي حاجة بتشوف الـ antibody (complement، phagocytes، NK cells) هتضرب الخلية دي. يعني الضرر محدود في الخلايا اللي عليها الـ antigen: كرات الدم في الـ haemolysis، أو الكلى في Goodpasture.
      - kind: figure
        page: 61
        quote: "The immune mechanisms of type II HS reactions. Antibody bound to cells."
        title: "تقسيم Coombs and Gell في رسمة الكتاب"
        image: { file: rheum/L03-coombs-gell.webp, book: true }
        alt: "Four columns titled The Coombs and Gell classification of the four types of hypersensitivity reaction. Type I: an allergen bridges IgE on Fc receptors of a mast cell, which degranulates and releases mediators. Type II: IgG on a cell surface antigen lets a K cell kill the target cell (cytotoxic action), and antibody with complement causes complement-mediated lysis. Type III: immune complexes deposit on the basement membrane of a vessel wall, complement joins, and a cell comes from the blood vessel. Type IV: antigens are presented to a T cell, which releases cytokines that activate a macrophage releasing inflammatory mediators."
        caption: |
          رسمة الكتاب (مطبوعة في صفحات 55 و 61 و 64 و 66)، أربع عواميد:

          - **Type I (شمال خالص)**: الـ allergen بيربط IgE على الـ Fc receptors بتاعة الـ mast cell ← degranulation و mediator release.
          - **Type II**: ==IgG على antigen على سطح الخلية==: فوق خلية **K** بتقتل الـ target cell (cytotoxic action)، وتحت الـ complement (C) بيعمل **complement-mediated lysis**.
          - **Type III**: **immune complexes** بتترسّب على الـ basement membrane في جدار الوعاء (يمين العمود)، والـ complement بييجي عليها.
          - **Type IV (يمين خالص)**: الـ antigen بيتعرض على **T cell** ← cytokines ← **activated macrophage** بيطلّع inflammatory mediators. مفيش antibody خالص.

          يعني اللي بيفرّق التلاتة الأولانيين: الـ antibody نوعه إيه وماسك فين. والرابع لوحده خلايا.
      - kind: explain
        page: 61
        quote: "Type II HS occurs when antibody specific for cell surface antigen is produced."
        title: "ليه الـ antibody بيقتل بتلات طرق؟"
        text: |
          الـ antibody شكله زي حرف Y: **طرفين** بيمسكوا الـ antigen، و **ديل** (الـ ==Fc==) بيفضل بارز برّه. الديل ده هو اللي بينادي القاتل. التفسير المقبول (مش في الكتاب) لكل طريقة في الكتاب:

          - **Complement activation**: الـ complement بيتعرف على الـ antibodies المتجمعة على السطح، وبيعمل خروم في الغشاء ← **lysis**.
          - **Phagocytosis**: الـ macrophage عنده **Fc receptors**، فالخلية المتغطية antibodies بتبقى "عليها علامة" إنها تتاكل (opsonization).
          - ==ADCC==: الـ NK cell بيمسك الـ Fc برضه، بس بدل ما يبلع الخلية، بيقتلها من برّه.

          يعني نفس الـ antibody بيعلّم الخلية، والقاتل بيختلف.
      - kind: figure
        page: 62
        quote: "Effector mechanisms of anti-body mediated disease:\n  1. activation of complement via the classical pathway → lysis\n  2. antibody acts as opsonin for phagocytes\n  3. ADCC by NK cell\n(A) Opsonization and phagocytosis: Opsonized cell (C3b) binds Fc receptor and C3b receptor on Phagocyte (Complement activation) → Phagocytosis\n(B) Complement- and Fc receptor–mediated inflammation: Fc receptors, Complement activation → Complement by-products (C5a, C3a) → Neutrophil activation → Inflammation and tissue injury"
        title: "تلات طرق للقتل"
        image: { file: rheum/L03-antibody-effectors.webp, book: true }
        alt: "A target cell covered in antibodies in the centre. Left: 1, activation of complement via the classical pathway, arrow down to lysis. Bottom: 2, antibody acts as opsonin for phagocytes. Right: 3, an NK cell binds the antibodies and kills the cell, labelled ADCC."
        caption: |
          رسمة الكتاب في صفحة 62: target cell في النص، مغطّية antibodies، وتلات أرقام:

          - **(1) شمال**: الـ antibody بيشغّل الـ **complement بالـ classical pathway** ← السهم لتحت = ==lysis==.
          - **(2) تحت**: الـ antibody بيشتغل **opsonin**، يعني علامة تقول للـ phagocytes «كلوني».
          - **(3) يمين**: الـ **NK cell** بتمسك ديل الـ antibody وتقتل الخلية = ==antibody-dependent cell-mediated cytotoxicity (ADCC)==.

          يعني نفس الـ antibody بيقتل بتلات طرق، وده سبب إن الـ type II بيكسّر خلايا الدم بسرعة.
      - kind: explain
        page: 62
        quote: "Effector mechanisms of anti-body mediated disease."
        title: "Effector mechanisms: complement و Fc receptors"
        text: |
          رسمة صفحة 62 (A و B):

          - **Opsonization**: الخلية متغطية بـ antibody و ==C3b== ← الـ phagocyte يمسكها بالـ **Fc** والـ **C3b receptors** ويبلعها.
          - **Inflammation**: antibody على نسيج ← Fc receptors على الـ neutrophils + complement ← ==C5a و C3a== ← neutrophil activation ← inflammation و tissue injury.

          التفسير المقبول (مش في الكتاب): ليه الـ C5a و C3a بيعملوا inflammation؟ عشان دول chemotactic: بيندهوا الـ neutrophils للمكان، والـ neutrophils لما مايقدروش يبلعوا نسيج كامل بيرموا إنزيماتهم برا فيأذوا النسيج. يعني الخلية الحرة (زي كرة الدم) بتتبلع، والنسيج الثابت بيتأذي من الالتهاب حواليه.
      - kind: figure
        page: 62
        title: "الـ opsonization والالتهاب"
        image: { file: rheum/L03-opsonization-inflammation.webp, book: true }
        alt: "Two panels. A, Opsonization and phagocytosis: an opsonized cell coated with antibody and C3b binds a phagocyte through Fc receptor and C3b receptor, with complement activation below; an arrow leads to a phagocytosed cell inside the phagocyte, labelled phagocytosis. B, Complement- and Fc receptor-mediated inflammation: antibodies on a tissue surface activate complement; complement by-products C5a and C3a and Fc receptors call neutrophils, neutrophil activation leads to inflammation and tissue injury."
        caption: |
          رسمة الكتاب في صفحة 62، جزئين:

          - **(A) فوق، opsonization and phagocytosis**: الخلية المتغطّية (شمال) عليها antibody و **C3b**، والـ phagocyte (الأخضر) بيمسكها من الاتنين: **Fc receptor** و **C3b receptor**. السهم يمين ← الخلية بقت جوه الـ phagocyte = **phagocytosis**.
          - **(B) تحت، complement- and Fc receptor-mediated inflammation**: antibodies قاعدة على **نسيج** (مش خلية حرة)، فبتشغّل الـ complement، وبيطلع ==C5a و C3a== (في النص) ينادوا الـ neutrophils، وكمان الـ Fc receptors بتمسكهم. السهم يمين ← **neutrophil activation** ← ==inflammation and tissue injury==.

          يعني لو الـ antigen على خلية، الخلية بتتاكل. ولو على نسيج ثابت، النسيج نفسه هو اللي بيتحرق بالالتهاب.
      - kind: explain
        remind: [rheum.L03.069]
        page: 63
        quote: "Examples of type II reactions in which complement is activated and cells are destroyed:\n  Incompatible blood transfusions, haemolytic disease of the newborn, autoimmune haemolytic anaemia."
        title: "أمثلة بتكسّر الخلايا"
        text: |
          Complement بيتنشّط والخلايا بتتكسّر في:

          - ==Incompatible blood transfusion==
          - **Haemolytic disease of the newborn**
          - **Autoimmune haemolytic anaemia**

          التفسير المقبول (مش في الكتاب): ليه الأمثلة دي كلها في الدم؟ عشان كرات الدم الحمرا بتعوم في وسط الـ complement والـ phagocytes طول الوقت، فأول ما يتحط عليها antibody بتتكسّر. في نقل الدم الغلط الـ antibodies جاهزة (ABO) فالتكسير فوري. وفي الـ haemolytic disease of the newborn الـ IgG بيعدّي الـ placenta، وده سبب إن الـ IgM مابيعملهاش.
      - kind: explain
        page: 63
        quote: "Examples of type II reactions in which complement is activated and cells are destroyed:"
        title: "ليه الأمثلة دي كلها دم؟"
        text: |
          التلات أمثلة في الكتاب كرات دم حمرا بتتكسّر، والتفسير المقبول (مش في الكتاب) لكل واحد:

          - ==Incompatible blood transfusion==: الإنسان عنده antibodies جاهزة ضد الـ blood group اللي مش عنده (ABO). الدم الغلط بيتكسّر في **دقايق** من أول وحدة.
          - **Haemolytic disease of the newborn**: أم Rh-negative عملت anti-Rh IgG في حمل قبل كده. الـ **IgG بيعدي الـ placenta**، فبيكسّر كرات دم الجنين الـ Rh-positive.
          - **Autoimmune haemolytic anaemia**: الجسم عامل antibodies ضد كراته هو.

          ليه كرات الدم الحمرا بالذات؟ عشان الـ antigen **ثابت على سطحها**، وهي عايمة في الدم جنب الـ complement مباشرة.
      - kind: table
        page: 63
        quote: "Several disease are caused by antibody directed against cell surface receptors which can stimulate or block the receptor. In Graves disease stimulating antibodies are directed against the receptor for TSH.\n  In myasthenia gravis blocking antibodies are directed against the Ach receptor."
        title: "يفتح ولا يقفل؟"
        columns: ["Disease", "Target", "Antibody"]
        rows:
          - ["Graves", "TSH receptor", "Stimulates without ligand"]
          - ["Myasthenia gravis", "ACh receptor", "Blocks ligand binding"]
        hide: [[0, 2], [1, 2]]
      - kind: figure
        page: 63
        title: "antibody بيفتح أو بيقفل receptor"
        image: { file: rheum/L03-receptor-antibodies.webp, book: true }
        alt: "Panel C, Abnormal physiologic responses without cell or tissue injury. Left: antibodies against the TSH receptor on a thyroid epithelial cell make it release thyroid hormones, labelled antibody stimulates receptor without ligand. Right: at a nerve ending releasing acetylcholine onto muscle, antibodies to the acetylcholine receptor sit on the receptors, labelled antibody inhibits binding of ligand to receptor."
        caption: |
          رسمة الكتاب في صفحة 63 (**abnormal physiologic responses without cell/tissue injury**)، يعني الخلية مش بتموت:

          - **شمال**: antibody ماسك الـ **TSH receptor** على خلية الـ thyroid، فالخلية بتطلّع thyroid hormones من غير TSH = ==antibody stimulates receptor without ligand== (Graves).
          - **يمين**: الـ nerve ending بيطلّع acetylcholine (ACh)، بس الـ antibodies قاعدة على الـ **ACh receptors** في العضلة، فالـ ACh مش لاقي مكان = ==antibody inhibits binding of ligand to receptor== (myasthenia gravis).
      - kind: aside
        tone: analogy
        page: 63
        quote: "Several disease are caused by antibody directed against cell surface receptors which can stimulate or block the receptor. In Graves disease stimulating antibodies are directed against the receptor for TSH.\n  In myasthenia gravis blocking antibodies are directed against the Ach receptor."
        text: "في Graves الـ antibody زي واحد ساند على جرس الباب: الغدة شغالة طول الوقت من غير thyroid-stimulating hormone (TSH). في myasthenia زي واحد حاطط لزق على الجرس: الـ acetylcholine (ACh) بييجي ومش عارف يرن. والاتنين من غير ما الخلية تتكسر."
      - kind: reveal
        page: 63
        quote: "Several disease are caused by antibody directed against cell surface receptors which can stimulate or block the receptor."
        prompt: "ليه Graves و myasthenia type II مع إن الخلية مش بتموت؟"
        answer: |
          عشان التعريف هو **antibody ضد antigen على سطح الخلية**، والـ receptor نفسه هو الـ antigen. الكتاب بيقول الـ antibody ممكن **يحفّز** الـ receptor أو **يقفله**:

          - **Graves**: antibody بيحفّز الـ TSH receptor ← الغدة تشتغل زيادة ← hyperthyroidism.
          - **Myasthenia gravis**: antibody بيقفل الـ ACh receptor ← العضلة مش بتستقبل الإشارة ← ضعف بيزيد مع المجهود.

          يعني type II ممكن **يغيّر وظيفة** الخلية من غير ما يكسرها.
      - kind: check
        page: 63
        quote: "Several disease are caused by antibody directed against cell surface receptors which can stimulate or block the receptor. In Graves disease stimulating antibodies are directed against the receptor for TSH.\n  In myasthenia gravis blocking antibodies are directed against the Ach receptor."
        question: "A woman has fatigable ptosis and diplopia. Which antibody mechanism fits?"
        options: ["Blocking antibody to the ACh receptor", "Stimulating antibody to the TSH receptor", "IgE on mast cells", "Immune complexes in glomeruli"]
        answer: 0
        why:
          - "صح: myasthenia gravis = blocking antibodies ضد الـ ACh receptor."
          - "ده Graves."
          - "ده type I."
          - "ده type III."
      - kind: try
        items: [rheum.L03.064, rheum.L03.065, rheum.L03.069, rheum.L03.070, rheum.L03.073]
