            <text x="20" y="362" class="t-sm">Response at 14 days predicts survival</text>
            <text x="20" y="380" class="t-sm t-mut">False positive with infection/inflammation</text>
          </svg>
      - kind: aside
        tone: trap
        page: 160
        quote: "T stage based on depth of tumor (not size)"
        text: "في الـ AJCC الـ T stage بيعتمد على depth of tumor مش size. ورم 8 cm سطحي ممكن يبقى T أقل من ورم 2 cm غاطس."
      - kind: try
