  - id: git.L02.lesson6
    title: "الـ capsule والـ UTEGD: منظار تبلعه ومنظار رفيع"
    hook: "كبسولة قد حباية الفيتامين بتصوّر الأمعاء كلها، ومنظار رفيع من الأنف من غير تخدير. لمين كل واحد؟"
    minutes: 8
    pages: [43, 48]
    topics: [capsule, utegd]
    goals:
      - "تعرف أرقام الـ capsule وموانعها وليه"
      - "تعدّ اللي الـ capsule بتلاقيه في الـ small bowel"
      - "تعرف فايدة وعيب الـ ultrathin EGD"
    status: unverified
    steps:
      - kind: explain
        page: 43
        quote: "A new painless image system to show the entire small bowel. The capsule which measures 11x25 mm takes 2frames/sec and transmits the images to a recording device."
        title: "الـ capsule: منظار تبلعه"
        text: |
          ==Wireless capsule endoscopy==: **painless**، بتصوّر الـ **small bowel كله**.

          - الحجم **11 x 25 mm**.
          - بتاخد **2 frames/sec** وتبعتهم لـ recording device.
          - الصور **excellent** والمعلومة **accurate**.

          التفسير المقبول (مش في الكتاب): الحجم **11x25 mm** يعني قد حباية فيتامين كبيرة، وده بيشرح ليه أي ضيق أو مشكلة بلع بتبقى خطر عليها، زي ما هتشوف في الـ exclusion criteria.
      - kind: explain
        page: 43
        quote: "The information provided is accurate, helping further diagnostic and treatment options."
        title: "ليه الكبسولة، وإيه اللي ما تقدرش تعمله؟"
        text: |
          الكتاب: الكبسولة **painless**، بتشوف ==the entire small bowel==، الصور **excellent**، والمعلومات **accurate** وبتساعد في الخطوة اللي بعدها في التشخيص والعلاج.

          التفسير المقبول (مش في الكتاب) للمقارنة مع الـ enteroscopy:
          - الكبسولة **بتوصل لكل حتة** من غير sedation ومن غير loop، لأنها ماشية مع الحركة الطبيعية.
          - بس **ما بتاخدش biopsy ولا بتعالج**، ومش بتتحكم فيها: لا ترجّعها ولا توقفها عند lesion.
          - علشان كده هي غالبًا **خريطة**: تقولك فين المشكلة، وبعدين الـ enteroscope يروح لها بالظبط (من البق لو قريبة، من الشرج لو بعيدة).

          ورقم **2 frames/sec** معناه إن اللقطة بتتاخد كل نص ثانية، فالـ lesion الصغيرة ممكن تعدّي بين لقطتين لو الكبسولة جريت.
      - kind: figure
        page: 45
        title: "رحلة الكبسولة"
        image: { file: git/L02-capsule-anatomy.webp, book: true }
        alt: "Four capsule endoscopy frames from the book labelled GE junction, duodenum, jejunum and ileocecal valve."
        caption: |
          الكبسولة بتعدّي بالترتيب: **GE junction** ← **duodenum** ← **jejunum** ← **ileocecal valve**.

          التفسير المقبول (مش في الكتاب): لما تشوف الـ ileocecal valve تعرف إن الدراسة **كاملة**، يعني الكبسولة عدّت الأمعاء كلها.
      - kind: mnemonic
        page: 44
        quote: "Patients with mental or physical disorders  Swallowing problems  History of major GI surgery  Known fixed stricture or obstruction."
        word: "MSSS"
        parts:
          - { key: "M", text: "Mental or physical disorders" }
          - { key: "S", text: "Swallowing problems" }
          - { key: "S", text: "Surgery: history of major GI surgery" }
          - { key: "S", text: "Stricture or obstruction, known and fixed" }
        hook: "**«مِسّ»**: الـ capsule مش هتمِسّ المريض ده. وأخطرهم الـ **stricture**: الكبسولة ممكن تتزنق."
      - kind: explain
        page: 44
        quote: "Known fixed stricture or obstruction."
        title: "ليه دول ممنوعين؟"
        text: |
          التفسير المقبول (مش في الكتاب) لكل مانع في الكتاب:
          - **Mental or physical disorders**: المريض لازم يتعاون، يبلع، ويلبس الـ recorder طول اليوم.
          - **Swallowing problems**: الكبسولة ممكن تتسحب للـ airway أو تقف في الـ esophagus.
          - **Major GI surgery**: الـ anatomy متغيرة، وممكن يبقى فيه adhesions أو anastomosis ضيقة.
          - ==Known fixed stricture or obstruction==: الأخطر، لأن الكبسولة **مش بتتحكم فيها**: لو اتزنقت مفيش منظار يطلّعها بسهولة، وممكن تحتاج جراحة.

          يعني القاعدة: الكبسولة **بتشوف بس**، ما بتاخدش biopsy ولا بترجع، فأي حاجة تمنع مرورها تمنع استخدامها.
      - kind: check
        page: 44
        quote: "Known fixed stricture or obstruction."
        question: "Which patient should NOT swallow a capsule?"
        options:
          - "Crohn's disease with a known fixed ileal stricture"
          - "Obscure GI bleeding with normal EGD and colonoscopy"
          - "Suspected small bowel lymphoma"
          - "Celiac disease with suspected villous atrophy"
        answer: 0
        why:
          - "صح: **known fixed stricture or obstruction** من موانع الـ capsule."
          - "ده بالظبط اللي الـ capsule معمولة له."
          - "الـ lymphoma من صور الكتاب على الـ capsule."
          - "الـ sprue والـ villous drop-out من صور الكتاب."
      - kind: case
        page: 44
        quote: "History of major GI surgery"
        stem: "A 66-year-old with Crohn's disease had two bowel resections and now has colicky pain after meals. He is referred for capsule endoscopy to look for obscure bleeding."
        steps:
          - question: "What in his history is an exclusion criterion for the capsule?"
            options: ["History of major GI surgery", "His age", "Obscure bleeding", "Colicky pain alone"]
            answer: 0
            why: "الكتاب: **history of major GI surgery** من الـ exclusion criteria. التفسير المقبول (مش في الكتاب): الـ anastomosis والـ adhesions ممكن تحجز الكبسولة."
          - question: "His colicky pain after meals raises which other exclusion?"
            options: ["A known fixed stricture or obstruction", "Swallowing problems", "A mental disorder", "None"]
            answer: 0
            why: "التفسير المقبول (مش في الكتاب): الألم بعد الأكل في Crohn's بيلمّح لـ **stricture**، والكتاب بيمنع الكبسولة في **known fixed stricture or obstruction** لأنها ممكن تتزنق."
      - kind: figure
        remind: [git.L02.020]
        page: 46
        title: "الـ capsule بتشوف إيه؟"
        image: { file: git/L02-capsule-findings.webp, book: true }
        alt: "Eight capsule endoscopy frames labelled lymphoma, GIST, polypoid mass, polyp, phlebectasia, AVM, lymphangiectasia and bleeding lesion."
        caption: |
          دي إجابة سؤال «indications of capsule» من الكتاب:
          - **Tumors**: lymphoma، gastrointestinal stromal tumor (GIST)، polyp، polypoid mass.
          - **Vascular**: phlebectasia، arteriovenous malformation (AVM)، bleeding lesion.
          - **Lymphangiectasia**.

          وفي ص 47: Nonsteroidal anti-inflammatory drug (NSAID) stricture، radiation enteritis، sprue، و villous drop-out.
      - kind: figure
        page: 47
        title: "وكمان: الضيق والالتهاب"
        image: { file: git/L02-capsule-strictures.webp, book: true }
        alt: "Four capsule frames from the book labelled NSAID stricture, radiation enteritis, sprue with scalloped folds, and villous drop out."
        caption: |
          **NSAID stricture**، **radiation enteritis**، **sprue**، و **villous drop out**.

          لاحظ المفارقة: الـ NSAID stricture دي نفسها ممكن **تحجز** الكبسولة. علشان كده الـ fixed stricture المعروفة مانع.
      - kind: explain
        page: 46
        quote: "Polypoid Mass"
        title: "اللي الكبسولة بتلاقيه، مجمّع"
        text: |
          صور الكتاب (ص 46-47) هي إجابة سؤال «indications of capsule endoscopy»:

          - **Tumors**: lymphoma، GIST، polypoid mass، polyp.
          - **Vascular**: ==phlebectasia==، AVM، bleeding lesion. التفسير المقبول (مش في الكتاب): دي أشهر أسباب الـ **obscure bleeding** من الـ small bowel، وهي مسطحة فالأشعة مش بتشوفها، بس الكاميرا بتشوف اللون.
          - **Lymphangiectasia**: lymph vessels واسعة، بتعمل protein loss.
          - **Inflammatory**: NSAID stricture، radiation enteritis.
          - **Malabsorption**: sprue و ==villous drop out== (الـ villi اختفت فالسطح بقى أملس).

          يعني لو اتسألت «indications of capsule endoscopy» (أول سؤال في آخر المحاضرة)، رتّب الإجابة بالعناوين دي: نزيف، أورام، malabsorption، inflammation، lymphangiectasia.
      - kind: explain
        page: 48
        quote: "It does not need sedation and it is well tolerated in patients with liver cirrhosis as a rapid screening tool for detecting the presence and size of varices."
        title: "UTEGD: المنظار الرفيع"
        text: |
          **Ultrathin esophagogastroduodenoscopy (EGD)** بقى ممكن مع منظار **5.3 mm**، بديل للـ sedated trans-oral endoscopy.

          - **من غير sedation**، والـ cirrhotic بيستحمله: ==rapid screening== للـ **varices** (موجودة ولا لأ، وحجمها).
          - العيب الرئيسي: **fiber-optic quality** للصورة.
          - هيبقى أحسن لما يبقى فيه **video endoscope** أقل من 6 mm.

          التفسير المقبول (مش في الكتاب): «rapid screening» معناها إنه بيجاوب سؤال واحد بسرعة (فيه varices؟ وقد إيه؟)، علشان كده الصورة الأضعف مقبولة فيه.
      - kind: explain
        page: 48
        quote: "It might be of great value when video endoscope <6 mm become available."
        title: "الـ UTEGD لسه مستني إيه؟"
        text: |
          الكتاب: الـ UTEGD بقى ممكن بالـ **ultrathin endoscope (5.3 mm)** كبديل للمنظار التقليدي من البق تحت sedation، وهيبقى ==of great value== لما يبقى فيه **video endoscope أقل من 6 mm**.

          التفسير المقبول (مش في الكتاب) للربط: العيب الوحيد اللي الكتاب ذكره هو جودة الصورة **fiber-optic**. الـ video endoscope بيحط **chip** الكاميرا على الطرف، فالصورة تبقى زي المنظار العادي. يعني لما الـ chip يصغر لحد ما يدخل في أنبوبة أقل من 6 mm، العيب يختفي ويفضل المكسب: من غير sedation، ومريح للـ cirrhotic.
      - kind: reveal
        page: 48
        quote: "The main disadvantage is the fiber-optic quality of the picture."
        prompt: "ليه الـ UTEGD مناسب للـ cirrhotic بالذات؟"
        answer: |
          الكتاب: **no sedation** و **well tolerated** في الـ liver cirrhosis، كـ ==rapid screening== للـ varices.

          التفسير المقبول (مش في الكتاب): الكبد التعبان مش بيكسّر أدوية الـ sedation كويس، فالـ sedation ممكن تطوّل أو تفجّر hepatic encephalopathy. المنظار الرفيع (5.3 mm) بيدخل من غيرها. والتمن: صورة **fiber-optic** أضعف، فهو للـ screening (فيه varices؟ حجمها؟) مش للتفاصيل الدقيقة.
      - kind: try
        items: [git.L02.017, git.L02.018, git.L02.020, git.L02.023]
    recap:
      - "Capsule: painless، الـ small bowel كله، 11 x 25 mm، 2 frames/sec."
      - "موانعها «MSSS»: mental/physical، swallowing، surgery، stricture (الأخطر)."
      - "بتلاقي: أورام، vascular (phlebectasia، AVM)، lymphangiectasia، NSAID stricture، radiation enteritis، sprue."
      - "UTEGD 5.3 mm: varices screening من غير sedation؛ عيبه الصورة الـ fiber-optic."
    practice: [git.L02.016, git.L02.017, git.L02.018, git.L02.019, git.L02.020, git.L02.021, git.L02.022, git.L02.023, git.L02.024, git.L02.110, git.L02.111, git.L02.112, git.L02.135]
  # ------------------------------------------------------------------
  - id: git.L02.lesson2
    title: "نكبّر ونلوّن: magnifying و chromoendoscopy"
    hook: "الـ early cancer بيستخبى في الـ mucosa. نكبّره 100 مرة؟ نرشّ عليه صبغة؟ ولا الاتنين؟"
    minutes: 8
    pages: [48, 51]
    topics: [image-enhancement]
    goals:
      - "تعرف شروط الـ magnifying endoscopy وليه كل شرط"
      - "تصنّف صبغات الـ chromoendoscopy وتعرف كل نوع بيشتغل إزاي"
      - "تعرف لمين نضيف الـ chromoendoscopy"
    status: unverified
    steps:
      - kind: explain
        page: 48
        quote: "Magnifying endoscopy,\n Tissue staining (chromo-scope),\n Stereo-microscopy and real-time video processing for enhancing endoscopic\nimage contrast."
        title: "تلات طرق نشوف بيها أحسن"
        text: |
          الكتاب بيعدّ techniques لتحسين رؤية سطح الـ GI:
          - **Magnifying endoscopy**
          - **Tissue staining** (==chromo-scope==)
          - **Stereo-microscopy** و real-time **video processing** يزوّد الـ contrast

          ليه محتاجين ده أصلًا؟ التفسير المقبول (مش في الكتاب): الـ early cancer والـ dysplasia بيبدأوا **مسطحين** ولونهم قريب من الطبيعي، فالـ white light العادي بيعدّيهم. ولو لقيتهم بدري، ينفع تشيلهم بالمنظار (EMR) بدل الجراحة.
      - kind: explain
        page: 48
        quote: "Deep sedation: to avoid patient's movements as focus range is limited (about 1 mm)."
        title: "الـ magnifying endoscopy محتاج إيه؟"
        text: |
          - ==Deep sedation==: لأن الـ **focus range** حوالي **1 mm** بس، وأي حركة بتبوّظ الصورة.
          - **Plastic cap** على طرف المنظار، خصوصًا في الـ lower esophagus، علشان الـ focus يفضل ثابت وقريب.
          - **Dyes**.
          - **Electronic structure enhancement** على أعلى مستوى.

          التمن: الفحص بياخد **3 أضعاف الوقت**. المكسب: تشخيص و biopsies أدق، و mucosal resection ممتاز بعدها.
      - kind: aside
        tone: analogy
        page: 48
        quote: "Deep sedation: to avoid patient's movements as focus range is limited (about 1 mm)."
        text: |
          زي ما تصوّر نملة بعدسة macro: لو إيدك اتهزّت **1 mm** الصورة باظت. علشان كده المريض لازم **deep sedation**، والـ cap بيبقى زي الـ tripod.
      - kind: reveal
        page: 48
        quote: "Although it is a time consuming (examination time x3), magnifying endoscopy provides more accurate diagnosis, biopsies, and subsequent excellent mucosal resection."
        prompt: "الـ magnifying بياخد 3 أضعاف الوقت. يستاهل ليه؟"
        answer: |
          الكتاب: **examination time x3**، بس بيدّي **more accurate diagnosis**، **biopsies** أدق، و**excellent mucosal resection** بعدها.

          التفسير المقبول (مش في الكتاب): لو شفت حدود الـ lesion بدقة، الـ biopsy تيجي من المكان الصح، والـ EMR يشيل الـ lesion كلها بحوافها من أول مرة. يعني الوقت الزيادة دلوقتي بيوفّر منظار تاني، أو recurrence، أو جراحة بعدين. وعلشان كده كل الشروط (deep sedation، cap، dyes، enhancement على الآخر) هدفها واحد: صورة **ثابتة وواضحة** في مدى focus قد **1 mm**.
      - kind: explain
        page: 49
        quote: "It is recommended that it should be added to conventional upper GI endoscopy in patients at high risk for malignancy."
        title: "الـ chromoendoscopy: نلوّن علشان نشوف"
        text: |
          الـ ==chromoendoscopy== بتستخدم **dyes** علشان الـ lesions تبان، وكمان بتساعد تعمل **histo-pathologic diagnosis** وانت جوه.

          - **سهلة**، **رخيصة**، المريض **بيقبلها**، وبتحسّن اكتشاف الـ **dysplasia**.
          - علشان كده بتتضاف للـ upper gastrointestinal (GI) endoscopy في اللي عندهم **high risk for malignancy**.
          - مع الـ magnification بتوصل لـ **several hundred-fold**.
      - kind: sort
        page: 49
        quote: "The dyes used in chromoendoscopy are\nAbsorptive dyes (methylene blue, toluidine blue, crystal violet, and Lugol's iodine),\nContrast dyes (indigo carmine),\nReactive dyes (Congo red and phenol red)."
        prompt: "صنّف الصبغة:"
        bins: ["Absorptive", "Contrast", "Reactive"]
        cards:
          - { text: "Methylene blue", bin: 0 }
          - { text: "Toluidine blue", bin: 0 }
          - { text: "Crystal violet", bin: 0 }
          - { text: "Lugol's iodine", bin: 0 }
          - { text: "Indigo carmine", bin: 1 }
          - { text: "Congo red", bin: 2 }
          - { text: "Phenol red", bin: 2 }
        why: "الكتاب: absorptive أربعة (methylene blue، toluidine blue، crystal violet، Lugol)؛ contrast واحدة (**indigo carmine**)؛ reactive اتنين (Congo red، phenol red). افتكر: «**الأحمر بيتفاعل**» (reactive = red)، و**الـ indigo لوحده contrast**."
      - kind: explain
        page: 49
        quote: "A combination of chromo-endoscopy, high resolution video endoscopy, magnifying endoscopy or endo-sonography is very important for detection of early malignant changes and prerequisites for successful local endoscopic mucosal resection."
        title: "الصبغة لوحدها مش كفاية"
        text: |
          الكتاب: الـ tissue staining **adjunctive technique** بيزوّد الـ diagnostic accuracy، والـ ==combination== بين chromo و **high resolution video** و **magnifying** أو **endo-sonography** مهمة جدًا لاكتشاف الـ **early malignant changes**، وشرط لنجاح الـ **local endoscopic mucosal resection**.

          وكمان الكتاب: الـ chromo بيوضّح الـ lesions وبيسمح بـ **histo-pathologic diagnosis during the procedure**، وغالبًا بيتعمل مع **magnification** لحد **several hundred-fold** بعدسات بتتظبط.

          التفسير المقبول (مش في الكتاب) لـ «ليه combination»: كل أداة بتجاوب سؤال مختلف. الصبغة تقولك **فين** الـ lesion وحدودها، الـ magnification يقولك **شكلها** من قريب (benign ولا لأ)، والـ endo-sonography يقولك **عمقها**. ولو الـ lesion عدّت الـ mucosa، الـ EMR مش هينفع، فلازم تعرف العمق قبل ما تقطع.
      - kind: explain
        page: 49
        quote: "Absorptive dyes (methylene blue, toluidine blue, crystal violet, and Lugol's iodine),"
        title: "كل صبغة بتشتغل إزاي؟"
        text: |
          الكتاب بيدّي الأسماء التلاتة، والـ «إزاي» التفسير المقبول (مش في الكتاب):

          - ==Absorptive== (methylene blue، toluidine blue، crystal violet، Lugol's iodine): الخلايا **بتشربها**. فالخلية الطبيعية بتتلون والشاذة لأ (أو العكس)، فالفرق يبان. مثال: الـ Lugol بيلوّن الـ glycogen في الـ squamous الطبيعي، والـ dysplasia بتفضل فاتحة.
          - ==Contrast== (indigo carmine): **مش بتتشرب**. بتقعد في الحفر بين الـ folds فبتحدّد **الشكل والحواف** زي ما الحبر بيبيّن نقش الختم.
          - **Reactive** (Congo red، phenol red): **بتتفاعل** كيميائيًا مع حاجة في الغشاء، زي الحمض، فبيتغير لونها.

          وكمان الكتاب بيقول التقنيات الجديدة (**virtual filters**، magnification، software) بتعمل نفس الصور **من غير صبغة**، وأهم ميزة إنك ترجع للـ **white-light view** بزرار.
      - kind: check
        page: 49
        quote: "One of the most important advantages of these technologies is the traditional white-light endoscopic view option."
        question: "What does the lecture name as one of the most important advantages of the dye-free virtual technologies?"
        options:
          - "You can switch back to the traditional white-light view"
          - "They need no sedation"
          - "They give a full-thickness biopsy"
          - "They treat the lesion at the same time"
        answer: 0
        why:
          - "صح: الكتاب: الميزة المهمة هي خيار الـ **traditional white-light view**. التفسير المقبول (مش في الكتاب): الصبغة لما تترش ما ترجعش، لكن الفلتر الافتراضي بزرار، فتقارن نفس المكان قبل وبعد."
          - "مش مذكور؛ الـ magnifying نفسه محتاج **deep sedation**."
          - "الـ biopsy الضوئية دي بتاعة الـ CLE، ومش full-thickness."
          - "دي تقنيات **رؤية**، مش علاج."
      - kind: figure
        page: 50
        title: "الصبغة بتعمل إيه في الصورة"
        image: { file: git/L02-chromo-ulcer.webp, book: true }
        alt: "Four book endoscopic photos of a gastric ulcer: white light, then views after N-acetyl cysteine and methylene blue dye showing the stained mucosal pattern in green and blue tones."
        caption: |
          **Gastric ulcer** بعد **N-acetyl cysteine** و **methylene blue**. والكتاب في نفس الصفحة: بعد رش **indigo carmine**، حافة الـ tumor بانت وقدروا يحددوها.

          التفسير المقبول (مش في الكتاب) للـ N-acetyl cysteine: بيدوّب الـ mucus الأول، علشان الصبغة توصل للخلايا.
      - kind: case
        page: 49
        quote: "It is recommended that it should be added to conventional upper GI endoscopy in patients at high risk for malignancy."
        stem: "A 62-year-old with long-standing atrophic gastritis is booked for upper endoscopy. A flat, slightly reddish area is seen in the body."
        steps:
          - question: "What does the lecture recommend adding to conventional endoscopy in high-risk patients?"
            options: ["Chromoendoscopy", "Capsule endoscopy", "Stretta", "Nothing extra"]
            answer: 0
            why: "سهلة، رخيصة، المريض بيقبلها، وبتحسّن اكتشاف الـ **dysplasia**؛ فبتتضاف في الـ **high risk for malignancy**."
          - question: "Which dye outlines the lesion's margins without being absorbed?"
            options: ["Indigo carmine", "Methylene blue", "Lugol's iodine", "Congo red"]
            answer: 0
            why: "الـ **indigo carmine** هو الـ **contrast** dye الوحيد؛ الباقي absorptive أو reactive."
      - kind: figure
        page: 51
        title: "قبل وبعد الصبغة"
        image: { file: git/L02-chromo-pairs.webp, book: true }
        alt: "Book page of paired endoscopic photos: each pair shows the same esophageal or gastric area in white light and then after blue dye spraying, where the abnormal area stands out."
        caption: |
          كل زوج: **قبل** و**بعد** الصبغة لنفس المكان. شوف إزاي المنطقة اللي كانت شبه الطبيعي بقت حدودها واضحة.
      - kind: try
        items: [git.L02.026, git.L02.028, git.L02.031, git.L02.134]
    recap:
      - "Magnifying: deep sedation (focus 1 mm)، cap، dyes، electronic enhancement على الآخر؛ 3 أضعاف الوقت."
      - "Chromo: سهلة ورخيصة وبتلاقي الـ dysplasia؛ للـ high risk for malignancy."
      - "Absorptive (methylene blue، toluidine blue، crystal violet، Lugol) بتتشرب؛ contrast (indigo carmine) بتحدد الشكل؛ reactive (Congo red، phenol red) بتتفاعل."
      - "الـ virtual techniques بتطلّع صور شبه الـ chromo بزرار، من غير صبغة."
    practice: [git.L02.025, git.L02.026, git.L02.027, git.L02.028, git.L02.029, git.L02.030, git.L02.031, git.L02.032, git.L02.033, git.L02.034, git.L02.035, git.L02.113, git.L02.134]
