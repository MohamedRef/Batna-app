  - id: neph.L13.lesson4
    title: "العلاج: من الـ A1C للـ SGLT2 والـ finerenone"
    hook: "الكلاسيك لسه مهم، بس الأدوية الجديدة هي اللي بتغيّر مستقبل الكلية."
    minutes: 10
    pages: [438, 446]
    topics: [glycemia, bp, sglt2, future]
    goals:
      - "تحفظ أهداف الـ A1C والضغط وليه الـ A1C بيكدب في CKD 4-5"
      - "تشرح الـ SGLT2 inhibitors والـ MRA والـ GLP-1"
      - "تظبط الـ metformin حسب الـ eGFR"
    status: unverified
    steps:
      - kind: explain
        page: 438
        title: "العلاج الكلاسيكي"
        quote: "Glycemic control. Blood pressure control. Treatment of dyslipidemia. Management of anemia. Management of Hyperphosphatemia."
        text: |
          خمسة: **glycemia**، **blood pressure (BP)**، **dyslipidemia**، **anemia**، **hyperphosphatemia**.

          **haemoglobin A1c (A1C):**
          - **American Diabetes Association (ADA):** ==<7%== لأغلب الكبار.
          - **American College of Physicians (ACP) 2018:** **7-8%** أنسب.
          - الأوطى (<6%) بيقلل الـ diabetic kidney disease (DKD) بس على حساب **hypoglycemia** و polypharmacy و **mortality أعلى**.
      - kind: reveal
        page: 438
        quote: "A1C measurements in patients with chronic kidney disease stage 4 or 5 may be falsely low because of shortened red-cell survival time and associated chronic anemia. In these circumstances, routine glucose monitoring may be more accurate for testing and treatment planning."
        prompt: "عيان CKD stage 5، الـ A1C بتاعه 5.9% والسكر في البيت 250. مين الصح؟"
        answer: "السكر في البيت. الـ A1C بيقيس الـ glucose اللي لزق في الـ Hb على مدى عمر كرة الدم. في الـ chronic kidney disease (CKD) 4-5 كرات الدم بتعيش **أقل** ومعاها **anemia**، فالـ A1C يطلع ==falsely low==. استخدم **routine glucose monitoring**."
      - kind: explain
        page: 438
        title: "الضغط"
        quote: "Based on recent trials, the Eight Joint National Committee recommended a blood pressure of 140/90 mm Hg for all patients with diabetes mellitus or CKD.\nThis target blood pressure is further supported by the recent ADA position statement. Specifically, 130/80 mm Hg is considered the target blood pressure in subjects with albuminuria."
        text: |
          - **Joint National Committee (JNC) 8:** **140/90** لكل مرضى السكر أو الـ CKD.
          - **ADA:** ==130/80== لو فيه **albuminuria**.
      - kind: update
        page: 438
        quote: "Based on recent trials, the Eight Joint National Committee recommended a blood pressure of 140/90 mm Hg for all patients with diabetes mellitus or CKD."
        ref: "KDIGO 2021 blood pressure in CKD guideline"
        text: "الـ Kidney Disease: Improving Global Outcomes (KDIGO) 2021 بيقترح systolic أقل من 120 لو العيان مستحمل. في الامتحان اكتب أرقام الكتاب: 140/90 و130/80 مع الـ albuminuria."
      - kind: explain
        page: 439
        title: "الـ MRA فوق الـ ACEi/ARB"
        quote: "Emerging evidence shows that the use of mineralocorticoid receptor blockers in combination with ACE inhibitors or ARBs might have benefits on albuminuria in diabetic kidney disease, a phenomenon referred to as \"aldosterone breakthrough\".\nThe combination of spironolactone with an ACE inhibitor or ARB significantly decreased albuminuria compared with the results of placebo.\nMore patients with diabetic nephropathy who received an ACE inhibitor or an ARB as well as finerenone showed an improvement in urinary ACR compared to the number of patients who received one of these plus a placebo."
        text: |
          **كلام الكتاب (ده اللي تكتبه في الامتحان):** إضافة ==mineralocorticoid receptor antagonist (MRA)== على angiotensin-converting enzyme inhibitor (ACEi) أو angiotensin II receptor blocker (ARB) ممكن تقلل الـ **albuminuria** في الـ DKD، والكتاب بيسمّي ده **"aldosterone breakthrough"**.
          - الـ **spironolactone** مع ACEi أو ARB قلّل الـ albuminuria بوضوح عن الـ placebo.
          - الـ **finerenone** مع ACEi أو ARB حسّن الـ albumin-to-creatinine ratio (ACR) عند عدد أكبر من العيانين.

          **ملحوظة على المصطلح (من برّه الكتاب):** المعنى الدقيق لـ ==aldosterone breakthrough== هو إن الـ aldosterone **بيرجع يعلى** تاني رغم إن العيان واخد ACEi أو ARB لمدة طويلة. والعلو ده هو **السبب** اللي بيخلينا نضيف MRA، مش فايدة الـ albuminuria نفسها. جملة الكتاب ماشية بالمعنى الواسع، فاحفظ الاتنين.
      - kind: figure
        page: 441
        quote: "Normal:\n  100%\nDiabetes:\n  120%; TGF ↓\n  Diminshed distal Na delivery and hyperfiltration\nDiabetes + SGLT2i:\n  90%; TGF ↑\n  Enhanced distal Na delivery and diminished GFR"
        title: "الـ SGLT2 inhibitor بيرجّع الـ feedback"
        alt: "Two panels. Diabetes: SGLT2 reabsorbs more glucose and sodium, so little sodium reaches the macula densa; tubuloglomerular feedback is off, the afferent arteriole dilates and GFR is 120 percent. Diabetes plus SGLT2 inhibitor: more sodium reaches the macula densa, feedback constricts the afferent arteriole and GFR falls to 90 percent."
        caption: "في السكر: diminished distal Na delivery و hyperfiltration. الـ SGLT2 inhibitor (SGLT2i) بيخلّي الـ Na يوصل للـ macula densa، فالـ ==tubuloglomerular feedback== يقفل الـ afferent، فالضغط جوه الـ glomerulus والـ albuminuria يقلّوا."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L13b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker></defs>
