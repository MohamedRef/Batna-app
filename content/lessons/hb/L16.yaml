              <text x="170" y="106" class="t-sm">Normal background liver</text>
              <text x="14" y="176" class="t-sm">Book: usually multiple, under 2 cm</text>
              <text x="14" y="194" class="t-sm t-good">Static: conservative follow-up</text>
            </g>
          </svg>
      - kind: table
        page: 313
        quote: "Lesions usually multiple, less than 2cm in diameter, FNH is not a contraindication to hormonal therapy or pregnancy."
        title: "Adenoma vs FNH"
        columns: ["Feature", "Hepatic adenoma", "FNH"]
        rows:
          - ["Frequency", "3rd most common", "2nd most common"]
          - ["Number (book)", "Usually single", "Usually multiple, < 2 cm"]
          - ["Hormones / pregnancy", "OCP is the main risk factor: stop it", "Not a contraindication"]
          - ["Malignant change", "Up to 8% (40–50% in men)", "Rare"]
          - ["Histology clue", "Not given in the book", "Central scar (up to 60%), normal background"]
          - ["Management", "Stop hormones; excise if SLaP M; bleeding: TAE", "Conservative follow-up"]
        hide: [[1, 1], [1, 2], [2, 2], [3, 1], [4, 2], [5, 2]]
      - kind: explain
        page: 314
        quote: "Treatment: FNH is a STATIC lesion where rupture & malignant transformation are RARE."
        title: "علاج الـ FNH"
        text: |
          الـ FNH ==static lesion==: مش بتكبر كتير، والـ rupture والـ malignant transformation **rare**.

          فالعلاج ==conservative with follow up==. استثناءات الجراحة 3، وهي نفس 3 من حروف **SLaP** بتاعة الـ adenoma:
          - **Symptomatic**.
          - **Large**.
          - **Pedunculated**.

          الفرق: في الـ adenoma فيه حرف رابع (**M**en) لأنها ممكن تقلب malignant. الـ FNH مفيهاش الخطر ده، فمفيش M.
      - kind: check
        page: 313
        quote: "Lesions usually multiple, less than 2cm in diameter, FNH is not a contraindication to hormonal therapy or pregnancy."
        question: "A 28-year-old woman with FNH on MRI asks if she can get pregnant. What does the book say?"
        options:
          - "Yes: FNH is not a contraindication to pregnancy or hormones"
          - "No: resect it first"
          - "Only after trans-arterial embolization"
          - "Only if it is under 5 cm"
        answer: 0
        why:
          - "صح: الكتاب صريح: **not a contraindication** للـ hormonal therapy أو الـ pregnancy."
          - "الـ FNH static، والجراحة بس لو symptomatic أو large أو pedunculated."
          - "الـ TAE للـ bleeding **adenoma**."
          - "رقم الـ 5 cm ده بتاع الـ **adenoma**."
      - kind: explain
        page: 314
        quote: "NRH is a non specific response to obliteration of small portal veins"
        title: "NRH: كبد مليان حبيبات صغيرة"
        text: |
          الـ **nodular regenerative hyperplasia (NRH)**: non specific response لـ ==obliteration of small portal veins==.

          الفكرة: الـ portal veins الصغيرة بتتقفل في حتت. الحتت اللي مبقاش بيوصلها دم بتضمر، والحتت اللي لسه بيوصلها بتكبر وتعمل حبيبات. والنتيجة كبد شكله "حبيبات".

          السبب عادةً حاجة بتقفل الأوعية الصغيرة:
          - **Systemic vasculitis**: RA، PAN، SLE، SS.
          - **Portal vein thrombosis**: من hyper-coagulable state.
          - **Toxic injury by drugs**: **methotrexate**، azathioprine.

          **Histology** (ص 315): **micro-nodules** 1–2 mm، محوطة بمناطق **atrophy**، و==without fibrous septa==.

          **Clinical**: يا asymptomatic، يا علامات وأعراض ==portal hypertension==.
      - kind: reveal
        page: 315
        quote: "NRH may be asymptomatic or presented with signs and symptoms of PHT."
        prompt: "مريض عنده varices و splenomegaly، والـ biopsy **مفيهاش fibrous septa**. ليه ده مش cirrhosis؟"
        answer: |
          افتكر تعريف الـ cirrhosis من **L01**: **fibrosis + regenerative nodules** مع بعض.

          الـ **NRH** فيه **nodules (1–2 mm)** بس **من غير fibrous septa**، فمش cirrhosis.

          والـ PHT جاي منين؟ الـ **small portal veins مقفولة** (obliteration)، فالدم بيلاقي مقاومة قبل الـ sinusoids. يعني **non-cirrhotic portal hypertension** (المنطق ده physiology مقبولة؛ الكتاب بيقول "signs and symptoms of PHT").
      - kind: sort
        page: 315
        quote: "NRH appears as micro-nodules 1-2 mm in diameter delineated by regions of atrophy without fibrous septa"
        prompt: "Adenoma ولا FNH ولا NRH؟"
        bins: ["Adenoma", "FNH", "NRH"]
        cards:
          - { text: "OCP in up to 90%", bin: 0 }
          - { text: "Bleeding: TAE", bin: 0 }
          - { text: "Central scar", bin: 1 }
          - { text: "Artery-to-portal vein shunt", bin: 1 }
          - { text: "Not a contraindication to pregnancy", bin: 1 }
          - { text: "Obliterated small portal veins", bin: 2 }
          - { text: "Methotrexate", bin: 2 }
          - { text: "1–2 mm nodules without fibrous septa", bin: 2 }
        why: "Adenoma = هرمونات ونزيف. FNH = shunt وندبة ومش بتخاف من الحمل. NRH = portal veins صغيرة مقفولة، أدوية وvasculitis، وحبيبات من غير septa."
      - kind: try
        items: [hb.L16.020, hb.L16.022, hb.L16.023, hb.L16.026, hb.L16.027]
    recap:
      - "FNH: التانية في الشيوع، hyperplastic response لـ artery-to-portal vein shunt، central scar لحد 60%، background normal."
      - "الكتاب: FNH usually multiple و < 2 cm (المراجع: غالبًا solitary)."
      - "FNH مش contraindication للـ OCP ولا الحمل، و static: conservative إلا لو symptomatic أو large أو pedunculated."
      - "NRH: obliteration of small portal veins (vasculitis، PVT، methotrexate/azathioprine)."
      - "NRH: micronodules 1–2 mm من غير fibrous septa، asymptomatic أو PHT."
    practice: [hb.L16.017, hb.L16.018, hb.L16.019, hb.L16.020, hb.L16.021, hb.L16.022, hb.L16.023, hb.L16.024, hb.L16.025, hb.L16.026, hb.L16.027, hb.L16.028, hb.L16.029]

