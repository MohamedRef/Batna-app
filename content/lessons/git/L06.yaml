      - kind: reveal
        page: 217
        quote: "Pouchitis is a condition unique to patients who have undergone an IPAA."
        prompt: "مريض UC شالوا له القولون كله. ممكن يجيله التهاب تاني؟"
        answer: |
          الكتاب: الـ ==pouchitis== حالة **unique** للمرضى اللي اتعمل لهم **IPAA**. وفي المضاعفات كمان: **life-threatening hemorrhage**، و **acute severe UC** اللي ممكن يحتاج colectomy لو حصل perforation أو toxic megacolon.

          التفسير المقبول (مش في الكتاب): الـ colectomy بتشيل العضو المريض، بس الكيس اللي اتعمل من الـ ileum بيبقى مليان براز وبكتيريا زي القولون، والمناعة اللي كانت بتتخانق مع بكتيريا القولون ممكن ترجع تتخانق معاها في الكيس. يعني الـ colectomy بتشفي الـ UC، بس مش بتغيّر المريض نفسه.
      - kind: explain
        remind: [git.L06.126]
        page: 217
        title: "التشخيص والـ differential"
        quote: "For both the initial diagnosis and subsequent flares, other conditions that mimic IBD should be excluded. Of particular importance is the exclusion of infectious pathogens, as the treatment of active IBD frequently involves immunosuppressive medications."
        text: |
          التشخيص ==clinical==: history + exam + labs + imaging + endoscopy + histology. مفيش finding واحد.

          وفي كل flare لازم تستبعد **infection** الأول، لأن علاج الـ IBD **immunosuppressive**.

          الـ differential: **indeterminate colitis**، **irritable bowel syndrome (IBS)**، **infectious colitis**، mimics زي diverticulitis و appendicitis و lymphoma و malignancy، و non-infectious colitis: **microscopic**، **radiation**، **ischemic**، **nonsteroidal anti-inflammatory drug (NSAID)**، و diversion و chronic granulomatous disease (CGD) و graft-versus-host disease (GVHD) و amyloid.
      - kind: explain
        page: 217
        quote: "Of particular importance is the exclusion of infectious pathogens, as the treatment of active IBD frequently involves"
        title: "ليه نستبعد الـ infection في كل flare؟"
        text: |
          الكتاب: في التشخيص الأول **وفي كل flare**، لازم تستبعد الحاجات اللي بتقلّد الـ IBD، و ==أهمها الـ infectious pathogens==، لأن علاج الـ IBD النشط غالبًا **immunosuppressive**.

          التفسير المقبول (مش في الكتاب): تخيّل مريض UC جاله إسهال بدم، وانت افتكرته flare وزوّدت الكورتيزون، والسبب الحقيقي C. difficile أو CMV. الكورتيزون هيكسر المناعة اللي كانت بتحارب الـ infection، فالمريض ممكن يوصل toxic megacolon. علشان كده البراز للـ C. difficile والـ culture قبل ما تزوّد أي immunosuppression، حتى لو المريض «عارف مرضه».
