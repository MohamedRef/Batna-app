      - kind: explain
        page: 102
        quote: "Fibroscan\n| | MEDIAN | IQR | IQR/med. |\n|---|---|---|---|\n| E [kPa] | 36.8 | 4.7 | 13% |\n| CAP [dB/m] | 239 | 43 | 18% |\nMedian:\n  Calculated from 10 valid measurements\n  Is used as the final result\nInterquartile range (IQR):\n  Spread of the middle half of observations\n  Should be small\nIQR/median:\n  Ratio of IQR to median\n  Indicates variability in different readings\n  High values mean large variation\n  If >30%, implies no reliability"
        title: "اقرا ورقة الـ FibroScan"
        text: |
          الـ FibroScan بيقيس حاجتين في نفس القعدة، كل واحدة بوحدتها:

          - ==E (kPa)==: liver stiffness. الكبد المتليف أنشف، فالرقم الأعلى = fibrosis أكتر.
          - ==Controlled attenuation parameter (CAP) (dB/m)==: الدهون بتضعّف الموجة، فده بيقيس الـ steatosis.

          وعلشان تثق في الرقم:

          - **Median**: بيتحسب من 10 valid measurements، مش قراءة واحدة.
          - **Interquartile range (IQR)**: انتشار نص القراءات اللي في النص. لازم يبقى صغير، يعني القراءات قريبة من بعض.
          - ==IQR/median > 30%==: يبقى no reliability، مهما كان الرقم حلو أو وحش.
