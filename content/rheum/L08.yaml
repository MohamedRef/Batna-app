  - id: rheum.L08.157
    kind: card
    topic: aav-rx
    front: Which oral drug blocks the C5a receptor in AAV, and why is that downstream target preferred?
    back: Avacopan; blocking C5aR stops leukocyte trafficking and activation while keeping C5b-9 (MAC) for Neisseria control.
    src: { page: 156, quote: "Targeting Complement\n| Target | Effect | Drug |\n|---|---|---|\n| C3a → C3aR | Leukocyte migration and signaling | |\n| C3b → CR1, CR1g, CR3, CR4 | Phagocytosis and clearance | |\n| C3b → CR2 | Adaptive signaling | |\n| C5 convertase → C5b → C6-C9 → MAC (C5b-9) | Cell lysis (i.e., Neisseria control); Reason for black box warning for eculizumab | Eculizumab |\n| C5a → C5a (desArg) → C5L2 | C5a internalization and destruction | Vilobelimab, C5a antibodies |\n| C5a → C5aR | Leukocyte trafficking, migration and activation; Downstream is best | Avacopan |" }
    status: unverified
  - id: rheum.L08.158
    kind: card
    topic: aav-rx
    front: Why does eculizumab carry a black box warning?
    back: It blocks C5 cleavage, so no MAC (C5b-9) forms and Neisseria infections are not controlled.
    src: { page: 156, quote: "Targeting Complement\n| Target | Effect | Drug |\n|---|---|---|\n| C3a → C3aR | Leukocyte migration and signaling | |\n| C3b → CR1, CR1g, CR3, CR4 | Phagocytosis and clearance | |\n| C3b → CR2 | Adaptive signaling | |\n| C5 convertase → C5b → C6-C9 → MAC (C5b-9) | Cell lysis (i.e., Neisseria control); Reason for black box warning for eculizumab | Eculizumab |\n| C5a → C5a (desArg) → C5L2 | C5a internalization and destruction | Vilobelimab, C5a antibodies |\n| C5a → C5aR | Leukocyte trafficking, migration and activation; Downstream is best | Avacopan |" }
    status: unverified
  - id: rheum.L08.159
    kind: case
    topic: aav-rx
    stem: "A 58-year-old man has 3 weeks of haemoptysis, sinus crusting and saddle-nose. Creatinine 6.1 mg/dL (540 μmol/L), RBC casts. PR3-ANCA positive."
    steps:
      - question: How would you class his disease?
        options: ["Organ- and life-threatening AAV", "Non-organ-threatening AAV", "Single-organ vasculitis", "Large vessel vasculitis"]
        answer: 0
        why: "Pulmonary haemorrhage and glomerulonephritis are organ- or life-threatening (p145). Nasal disease alone would be non-organ-threatening. Several organs are involved. PR3-ANCA disease is small vessel."
      - question: Remission induction?
        options: ["Glucocorticoids plus cyclophosphamide or rituximab", "Glucocorticoids plus methotrexate", "Glucocorticoids alone", "Rituximab maintenance only"]
        answer: 0
        why: "Statement 3 (p152). MTX is barred by pulmonary haemorrhage (p153). GC alone is not enough. Maintenance comes after remission."
      - reveal: "His creatinine is above 500 μmol/L from RPGN."
        question: What else should be considered?
        options: ["Plasma exchange", "Routine anticoagulation", "IVIG", "Tocilizumab"]
        answer: 0
        why: "Statement 6: creatinine >500 μmol/L from RPGN, or severe alveolar haemorrhage (p154). Anticoagulation, IVIG and tocilizumab are not AAV induction tools in the book."
      - reveal: "He reaches remission at 4 months."
        question: Maintenance plan?
        options: ["Low-dose GC plus AZA, RTX, MTX or MMF for at least 24 months", "Stop all drugs at remission", "Cyclophosphamide for 2 years", "Follow ANCA titres and treat only if they rise"]
        answer: 0
        why: "Statements 7–8 (p154). Stopping invites relapse, which is frequent with PR3. Long CYC adds toxicity. Clinical assessment, not ANCA, drives treatment (p155)."
    src: { page: 154, quote: "We recommend that remission-maintenance therapy for AAV be continued for at least 24 months following induction of sustained remission." }
    status: unverified
