            answer: 0
            why: "مفيش ولا علامة من **CPE**: الـ INR تحت 1.5، لسه أسبوعين، ومفيش encephalopathy ولا ascites. يبقى supportive."
          - reveal: "Week 5: he is still deeply jaundiced. INR is now 1.7."
            question: "What now?"
            options:
              - "Start an antiviral (entecavir, tenofovir or double-dose lamivudine)"
              - "Keep supportive care only; ALT is falling"
              - "Start corticosteroids"
              - "Give HBIG"
            answer: 0
            why: "بقى **severe**: coagulopathy (INR > 1.5) و protracted (jaundice > 4 weeks). الكتاب بيدي antivirals هنا."
      - kind: reveal
        page: 116
        quote: "Antiviral therapy should be used judiciously given the risks of adverse effects (nephrotoxicity, lactic acidosis, resistance, and withdrawal flare)"
        prompt: "طب ما ندي antivirals لكل acute HBV ونخلص؟ إيه الضرر؟"
        answer: |
          الكتاب بيقول استخدمها **judiciously** لسببين:

          - **Adverse effects**: nephrotoxicity، lactic acidosis، resistance، و withdrawal flare، خصوصًا في **pregnant women، the elderly، and renal impairment**.
          - **Immunity**: نزول الـ HBV proteins بسرعة بدري ممكن يقلل اللي بيتعرض على الجهاز المناعي، فيأثر بالسلب على **immunity against HBV**. يعني إنت كده بتشيل "المدرّب" من قدام المناعة قبل ما تتعلم.
      - kind: explain
        page: 116
        quote: "About 90 % of acute infection in infants become chronic . About 10 % of acute infection in adults become chronic."
        title: "مين بيقلب chronic؟"
        text: |
          - حوالي **90%** من الـ acute infection في ==infants== بتبقى chronic.
          - حوالي **10%** بس في ==adults==.

          التفسير المقبول: مناعة الطفل لسه **tolerant** وبتتعامل مع الفيروس كأنه من البيت، فمبتطردوش.
