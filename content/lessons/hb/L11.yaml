            <circle cx="267" cy="205" r="7" class="fg-dot-bad"/>
            <circle cx="306" cy="205" r="7" class="fg-dot-bad"/>
          </svg>
      - kind: explain
        page: 192
        title: "Recipient criteria للـ living donor"
        text: |
          - **No evidence of extra-hepatic malignancy**
          - **No percutaneous stents in place**
          - **No previous portocaval shunts**، والاستثناء الوحيد **mesocaval shunt**

          وكمان الـ **initial assessment** هدفه يحدد ويتأكد من **السبب (etiology)** بتاع الـ chronic liver disease، ويحسب **CP score** و **MELD score**.

          ليه السبب مهم؟ لأن بعض الأسباب (زي HBV) لازم تتعالج قبل وبعد الزرع وإلا هتاكل الكبد الجديد. ده الدرس الجاي.
      - kind: case
        page: 192
        stem: "A 56-year-old man with HCV cirrhosis, type 2 diabetes and a previous open cholecystectomy is being worked up for living donor LT. His MELD is 19."
        steps:
          - question: "Do his diabetes and his previous operation exclude him?"
            options:
              - "No: both are high risk factors judged case by case"
              - "Yes: diabetes is an exclusion criterion"
              - "Yes: any previous abdominal surgery excludes LDLT"
            answer: 0
            why: "Diabetes mellitus و multiple previous hepatobiliary operations في الـ **high risk factors**: do not necessarily preclude transplantation."
          - question: "How often should his MELD be updated?"
            options:
              - "Monthly"
              - "Every 2 weeks"
              - "Weekly"
            answer: 1
            why: "MELD 19 في الـ band بتاع **18-25**، فبيتحدّث **every 2 weeks**."
          - reveal: "His old notes show that years ago he had a portocaval shunt for variceal bleeding."
            question: "What does this mean for living donor LT?"
            options:
              - "He fails the recipient criteria"
              - "Nothing: only a mesocaval shunt counts"
              - "He gains MELD exception points"
            answer: 0
            why: "Recipient criteria: **no previous portocaval shunts**، والاستثناء الوحيد هو الـ **mesocaval** shunt."
      - kind: aside
        tone: exam
        page: 192
        text: |
          سؤالين من أسئلة المحاضرة نفسها: **«Enumerate the contraindications»** و **«Mention the recipient criteria»**.

          الأول: اكتب **CASH CASH** كاملة، وبعدها سطر إن فيه **high risk factors** بتتقيّم case by case.
          التاني: التلات criteria (malignancy، stents، shunts مع استثناء mesocaval) + الـ initial assessment (etiology + CP + MELD).
      - kind: try
        items: [hb.L11.025, hb.L11.029, hb.L11.031, hb.L11.032, hb.L11.067]
    recap:
      - "Contraindications = **CASH CASH**: cardiopulmonary، age > 70، sepsis، HIV، cholangiocarcinoma، alcohol < 6 months، SMV occlusion، HCC beyond criteria."
      - "High risk (case by case): variceal bleeding نشط، HRS، عمليات سابقة، cachexia، DM، زرع سابق، زرع مزدوج، PVT."
      - "MELD update: **< 18 شهري**، **18-25 كل أسبوعين**، **> 25 أسبوعي**."
      - "Recipient: no extrahepatic malignancy، no percutaneous stents، no portocaval shunt (mesocaval مسموح)."
