  - id: hb.L19.lesson4
    title: "لما المرارة تلتهب"
    hook: "الحصوة اتحشرت وما رجعتش: من الـ obese fertile female over 40 لحد عيان الـ ICU من غير حصوة."
    minutes: 8
    pages: [383, 389]
    topics: [cholecystitis]
    goals:
      - "توصف الـ acute cholecystitis والعيان النموذجي، وتشرح ليه الوجع بيروح للكتف"
      - "تعرف إيه اللي بيحصل للجدار في الـ acute والـ chronic"
      - "تعدّ أسباب الـ acalculous cholecystitis"
    status: unverified
    steps:
      - kind: explain
        page: 383
        quote: "In 96% cystic duct is obstructed. Clinical features: sufferers are often obese, Fertile female over 40 yr."
        title: "Acute cholecystitis: الباب اتقفل وفضل مقفول"
        text: |
          في 96% الـ ==cystic duct is obstructed==. يعني نفس قصة الـ colic، بس الباب اتقفل وفضل مقفول.

          العيان النموذجي في الكتاب: ==obese, fertile female over 40==.

          **Pain**: late at night، في الـ right hypochondrium والـ epigastrium، و **referred to the right shoulder**.

          **Digestive symptoms**: flatulence، nausea، vomiting.

          **Fever**: لما يحصل **bacterial infection**.

          إيه اللي بيلهّب الجدار؟ رسمة صفحة 389 بتقول: الحصوة impacted في الـ cystic duct، والجدار بيلتهب من:
          - **Prostaglandins**
          - **Lysolecithin**
          - **Bacteria**
          - **Unconjugated bile acids**

          ولو الالتهاب اتكرر، بيبقى **chronic cholecystitis** (صفحة 388): الجدار بيتخن وبيبان فيه **Rokitansky–Aschoff sinuses**.
      - kind: figure
        page: 389
        title: "المرارة وهي ملتهبة"
        image: { file: hb/L19-acute-cholecystitis.webp, book: true }
        alt: "Book drawing of acute calculous cholecystitis: an opened, red, congested gallbladder full of stones, with mucosal slough, an inflamed serosa, and a stone impacted in the cystic duct causing persistent obstruction. Labels name prostaglandins, lysolecithins, bacteria and unconjugated bile acids as the irritants."
        caption: |
          - الحصوة ==impacted== في الـ cystic duct: الانسداد هنا persistent مش بيروح زي الـ colic.
          - الجدار أحمر و congested، والـ mucosa بتتقشّر (mucosal slough).
          - فوق الرسمة: الـ prostaglandins والـ lysolecithin والـ bacteria، نفس اللي فات في الشرح.
      - kind: figure
        page: 389
        title: "مرارة مفتوحة مليانة حصوات"
        image: { file: hb/L19-opened-gb-stones.webp, book: true }
        marks:
          - { at: [0.56, 0.76], label: "Thick gallbladder wall", kind: arrow }
          - { at: [0.22, 0.42], label: "Large yellow-green stone" }
          - { at: [0.40, 0.31], label: "Large yellow-green stone" }
          - { at: [0.72, 0.45], size: [0.40, 0.64], label: "Dark faceted stones", kind: box }
        alt: "Uncaptioned book photo of an opened, resected gallbladder on a blue background: its red, thickened wall is split open and packed with many faceted stones, some dark brown-black and two larger pale yellow-green ones on the left."
        caption: |
          صورة حقيقية تحت رسمة الـ acute cholecystitis في صفحة 389، من غير تعليق: مرارة اتشالت واتفتحت.

          - الجدار الأحمر (1) حوالين الحصوات ==تخين==، مش غشا رفيع.
          - جوّاها حصوات كتير **faceted**: ليها أوجه مسطّحة لأنها محشورة جنب بعض.
          - حصوتين أكبر (2، 3) لونهم أصفر مخضر، وحصوات غامقة بني وإسود (4).

          قارنها بالرسمة اللي فوقها: نفس المرارة المليانة حصوات، بس على الحقيقة. والتفسير المقبول (مش في الكتاب): مرارة مليانة كده، أي حصوة منها ممكن تتحشر في الـ cystic duct وتقفله، وده اللي بيحصل في ==96%== من الـ acute cholecystitis.
      - kind: figure
        page: 388
        title: "الالتهاب لما يتكرر"
        image: { file: hb/L19-chronic-cholecystitis.webp, book: true }
        alt: "Book drawing labelled chronic calculous cholecystitis: a small gallbladder with a thick, fibrotic wall packed with many faceted stones; Rokitansky-Aschoff sinuses are marked in the wall."
        caption: |
          - ده **chronic calculous cholecystitis**: الجدار ==thickened== والمرارة مليانة حصوات.
          - الأسهم تحت على الـ **Rokitansky–Aschoff sinuses**: جيوب من الـ mucosa دخلت جوّه الجدار.
          - التفسير المقبول (مش في الكتاب): كل نوبة التهاب بتسيب ندبة، فالجدار بيتخن ويفقد قدرته إنه ينقبض. وده بيزوّد الـ stasis، يعني حصوات أكتر.
      - kind: figure
        page: 388
        title: "حصوة واحدة كبيرة من الناحيتين"
        image: { file: hb/L19-large-stone.webp, book: true }
