        title: "أشعة ومناظير"
        quote: "Wirelessintestinalcapsulecanvisualizeallthesmallintestines."
        text: |
          **أشعة**: Endoscopic retrograde cholangiopancreatography (ERCP)، magnetic resonance cholangiopancreatography (MRCP)، computed tomography (CT)، magnetic resonance imaging (MRI)، و abdominal أو endoscopic ultrasound (للبنكرياس والقنوات).

