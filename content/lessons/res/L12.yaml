        text: "الكويز (2 و4):\n- الـ **internal validity** بتتأثر بـ **all of the above**: information bias وconfounding وselection bias.\n- في الـ **data analysis** تقدر تتغلب على **confounding factors** و**effect of chance** (الإجابة «Both 1&2»)، بس **مش selection bias**."
