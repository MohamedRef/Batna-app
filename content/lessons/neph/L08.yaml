      - kind: explain
        page: 277
        title: "المتابعة و ERT"
        quote: "If substantial Gb3 accumulation found, start enzyme replacement therapy before significant cardiac manifestations occur"
        text: |
          - **Newborn screening**: علشان تمسك الـ cardiac damage بدري.
          - **IVS4 mutation** = type 2 **later-onset**: ≤ 40 سنة 2–3% بس عندهم LVH، وبعد 40: ==32% ستات و 67% رجالة==.
          - المتابعة: **strain echo** كل سنة و **T1-mapping CMR** كل 2–3 سنين، و cardiac biopsy لو abnormal.
          - لو Gb3 كتير: ابدأ ==enzyme replacement therapy== قبل الـ cardiac manifestations.
