    answer: 0
    why:
    - 'صح: 12 مش 0 ولا 5، فنروح لأقرب رقم مدوّر تحته: 10، والفئات 10–، 20–، … 70–80.'
    - 12 هي القيمة نفسها؛ القاعدة بتدوّر لتحت.
    - 0 بس لو أصغر قيمة 0.
    - 5 بس لو أصغر قيمة 5.
  - kind: explain
    page: 43
    quote: |-
      4 -12 intervals
      Why ?????
      Tabular presentation
      Advantage :summarization of a large mass of data
      Disadvantage : loss of precision in the presentation
      < 4 -> greater loss of precision
      >12 -> missing the summarization value.
    title: ليه من 4 لـ 12 فئة؟
    text: |
      الجدول بيلخّص كمية بيانات كبيرة (==ميزة==)، على حساب شوية ==دقة== (==عيب==).

      - أقل من 4 فئات: الدقة بتضيع أكتر.
      - أكتر من 12: الجدول بيفقد فايدته كملخص.

      ليه الحد ده؟ ده التوازن بين إنك تشوف شكل البيانات وإنك ماتغرقش في تفاصيل. التفسير المقبول (مش في الكتاب).
