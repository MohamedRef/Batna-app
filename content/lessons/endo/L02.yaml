          </svg>
      - kind: table
        page: 23
        quote: "The initial clinical feature in post partum necrosis is failure to lactate; failure to resume normal menstrual periods is the clue for the diagnosis."
        title: "Sheehan's ولا hypophysitis؟"
        columns: ["", "Sheehan's", "Lymphocytic hypophysitis"]
        rows:
          - ["Cause", "PPH, hypotension + artery spasm", "Autoimmune inflammation"]
          - ["Timing", "After delivery; may show years later", "Late pregnancy or early puerperium"]
          - ["Clue", "Failure to lactate, then no periods", "DD: large prolactinoma"]
          - ["Treatment", "Replace hormones", "Corticosteroids"]
        hide: [[0, 1], [1, 2], [2, 1], [3, 2]]
      - kind: aside
        tone: exam
        page: 23
        quote: "The degree of hypopitutirism does not correlate with the degree of Hge."
        text: "Sheehan's: درجة الـ hypopituitarism **مالهاش علاقة** بكمية النزيف، والـ **posterior pituitary** غالبًا سليمة، وأحيانًا الخصوبة بترجع."
      - kind: explain
        page: 24
        quote: "Gestational DI is a rare endocrinopathy due to excessive vasopressinase activity."
        title: "الـ DI في الحمل"
        text: |
          - ==Gestational DI==: بسبب **vasopressinase** زيادة من المشيمة.
          - الـ mild DI ممكن يسوء، والـ asymptomatic تبقى symptomatic.
          - الـ pitressin tannate oil والـ lysine AVP spray بيتكسروا بالإنزيم، أما ==desmopressin لأ==.
          - Desmopressin آمن، إلا خطر صغير لـ uterine contractility (شبه الـ oxytocin).
          - الرضاعة تمام: كمية قليلة في اللبن، وامتصاصه من الـ GIT ضعيف.
      - kind: check
        page: 24
        quote: "but not with desmopressin since it is not degraded by vasopressinase"
        question: "Why does desmopressin still work in gestational DI?"
        options: ["Vasopressinase does not degrade it", "It increases vasopressinase", "It acts on the placenta", "It is given IV only"]
        answer: 0
        why:
