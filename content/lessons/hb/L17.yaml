        text: |
          فكّر في الكبد كأنه **شقة نصين** والمطلوب تهدّ نص وتعيش في النص التاني.

          علشان تعيش في النص اللي فاضل لازم يكون فيه **مواسير صرف سليمة** (bile duct)، و **مية داخلة** (portal vein)، و **مساحة كفاية** (liver volume). لو الورم بوّظ المواسير في النصين (**bilateral ductal extension**) مفيش نص تعيش فيه.
      - kind: explain
