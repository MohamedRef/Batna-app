  # ---------- book MCQs (p217–220) ----------
  - id: rheum.L13.046
    kind: mcq
    topic: why-msus
    stem: "Which of the following is a key advantage of musculoskeletal ultrasound (MSUS) in rheumatology?"
    options: ["Detects only structural joint damage", "Requires radiation exposure", "Cannot visualize tendons", "Detects early synovitis and guides injections"]
    answer: 3
    why:
      - "It detects early inflammation, not only damage."
      - "MSUS is radiation-free."
      - "It evaluates tendons, bursae, entheses and nerves."
      - "Correct: non-invasive, radiation-free and sensitive for early inflammation."
    src: { page: 217, quote: "Correct Answer: D. Detects early synovitis and guides injections." }
    status: unverified
    tags: [book-question]
  - id: rheum.L13.047
    kind: mcq
    topic: equipment
    stem: "Which probe frequency is typically used for superficial joints in MSUS?"
    options: ["2–3 MHz", "5–7 MHz", "6–15 MHz", "20–30 MHz"]
    answer: 2
    why:
      - "Too low: curvilinear range for deep structures."
      - "Not the book's range."
      - "Correct: high-frequency linear probes for superficial MSK structures."
      - "Not the book's range."
    src: { page: 217, quote: "Correct Answer: C. 6–15 MHz." }
    status: unverified
    tags: [book-question]
  - id: rheum.L13.048
    kind: mcq
    topic: doppler
    stem: "What does a positive Power Doppler (PD) signal indicate in a joint?"
    options: ["Presence of joint effusion only", "Synovial vascularity and active inflammation", "Old joint erosion", "Cartilage thinning"]
    answer: 1
    why:
