items:
  # ---------- p220-221: definition ----------
  - id: geri.L13.001
    kind: card
    topic: definition
    front: Define palliative care.
    back: A multidisciplinary approach to specialized care for people with serious illness, relieving symptoms, pain, physical and mental stress, whatever the diagnosis; the goal is better quality of life for patient and family.
    src: { page: 220, quote: "Palliative care is a multidisciplinary approach to specialized medical care for people with serious illnesses." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.002
    kind: card
    topic: definition
    front: Is palliative care only for end of life?
    back: No. It fits any age and any stage of serious illness, as the main goal or alongside curative treatment.
    src: { page: 220, quote: "appropriate at any age and at any stage in a serious illness" }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.003
    kind: enumerate
    topic: definition
    prompt: Settings where palliative care can be provided.
    points: [Hospitals, The patient's home, Community palliative care programs, Skilled nursing facilities]
    pass: 3
    src: { page: 220, quote: "in hospitals, in the patient's home, as part of community palliative care programs, and in skilled nursing facilities." }
    status: unverified
  - id: geri.L13.004
    kind: card
    topic: definition
    front: Who is palliative care indicated for?
    back: Any serious illness with physical, psychological, social or spiritual distress from the treatment sought or received.
    src: { page: 221, quote: "Palliative care is indicated for patients with any serious illness and who have physical, psychological, social, or spiritual distress" }
    status: unverified
  - id: geri.L13.005
    kind: cloze
    topic: definition
    text: "WHO: palliative care improves quality of life of patients and families facing {{c1::life-threatening illness}}, by prevention and relief of suffering through {{c2::early identification}} and impeccable assessment and treatment of pain and other problems, physical, {{c3::psychosocial and spiritual}}."
    src: { page: 221, quote: "through the prevention and relief of suffering by means of early identification and impeccable assessment and treatment of pain and other problems" }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.006
    kind: card
    topic: definition
    front: In its general sense, can palliative care be given with curative treatment? Example?
    back: Yes; any care that alleviates symptoms counts, e.g. relieving chemotherapy-induced nausea.
    src: { page: 221, quote: "palliative treatments may be used to alleviate the side effects of curative treatments, such as relieving the nausea associated with chemotherapy." }
    status: unverified
  # ---------- p221-222: team and indications ----------
  - id: geri.L13.007
    kind: enumerate
    topic: team
    prompt: Members of the palliative care team.
    points: [Physicians, Nurses, Physiotherapists, Occupational therapists, Pharmacists, Chaplains, Social workers, Psychologists, Nutritionists]
    pass: 7
    src: { page: 221, quote: "Physicians. Nurses. Physiotherapists. Occupational therapists. Pharmacists. Chaplains. Social workers. Psychologists." }
    status: unverified
  - id: geri.L13.008
    kind: enumerate
    topic: team
    prompt: Non-cancer diseases where palliative care is increasingly used.
    points: [Chronic progressive pulmonary disorders, Renal disease, Chronic heart failure, HIV/AIDS, "Progressive neurological conditions (ALS, MS)"]
    pass: 4
    src: { page: 222, quote: "Renal disease. Chronic heart failure. HIV/AIDS. Progressive neurological conditions." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.009
    kind: card
    topic: team
    front: Which growing field showed the need for palliative services designed for children?
    back: Pediatric palliative care.
    src: { page: 222, quote: "the rapidly growing field of pediatric palliative care has clearly shown the need for services geared specifically for children with serious illness." }
    status: unverified
  # ---------- p222: goals ----------
  - id: geri.L13.010
    kind: enumerate
    topic: goals
    prompt: Goals of palliative treatment.
    points:
      - Relief from suffering
      - Treatment of pain and distressing symptoms
      - Psychological care
      - Spiritual care
      - A support system to live as actively as possible
      - A sense of control
      - Relieve family burden and strengthen relationships
      - A realistic understanding of the illness
    pass: 6
    src: { page: 222, quote: "Relief from suffering Treatment of pain and other distressing symptoms as:" }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.011
    kind: card
    topic: goals
    front: Name distressing symptoms that palliative care treats besides pain.
    back: Fatigue, shortness of breath, constipation, nausea, loss of appetite, sleep problems and treatment side effects.
    src: { page: 222, quote: "Fatigue, shortness of breath, constipation, nausea, loss of appetite, sleep problems" }
    status: unverified
  # ---------- p222-223: elderly ----------
  - id: geri.L13.012
    kind: enumerate
    topic: elderly
    prompt: How "the old get sick differently" (Amella 2003).
    points:
      - Acute change in mental status
      - Altered pain sensation; cannot localize
      - Vague symptoms
      - Functional decline
      - Falls
      - Dehydrate easily (less muscle and intracellular water)
      - Anorexia
      - Unusual medication reactions
    pass: 6
    src: { page: 222, quote: "Acute change in mental status. Altered pain sensation; inability to localize. Vague symptoms. Functional status decreases. Falls." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.013
    kind: card
    topic: elderly
    front: Why do older people dehydrate more easily?
    back: Decreased muscle mass and intracellular water.
    src: { page: 222, quote: "Dehydrate easier due to decreased muscle mass & intracellular water." }
    status: unverified
  - id: geri.L13.014
    kind: enumerate
    topic: elderly
    prompt: Why does geriatric palliative care differ from palliative care in younger adults?
    points:
      - Chronic illnesses last many years
      - High prevalence of long-term functional and cognitive impairment
      - Need for long-term caregivers
    pass: 3
    src: { page: 223, quote: "The many-year duration of most geriatric chronic illnesses. The high prevalence of long-term functional and cognitive impairment." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.015
    kind: table
    topic: elderly
    title: Palliative focus, young vs elderly
    columns: [Group, Focus]
    rows:
      - [Younger adults, "Symptoms of a specific advanced terminal illness, its immediate manifestations, signs of poor prognosis or imminent death"]
      - [Elderly, "Functional and cognitive impairment, frailty, dependence on caregivers and the burden of symptom distress"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 223, quote: "palliative care for younger adults is typically focused on the identification of symptoms associated with either a specific advanced terminal illness" }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.016
    kind: card
    topic: elderly
    front: Can disease-specific treatment eliminate the burdens of frailty in the elderly?
    back: Unlikely. It may lessen frailty, dependence and symptom distress, which are multifactorial and present for years.
    src: { page: 223, quote: "disease-specific treatments may ameliorate or lessen the burdens of frailty, dependence, and symptom distress but are unlikely to eliminate them." }
    status: unverified
  # ---------- p223-225: pain ----------
  - id: geri.L13.017
    kind: card
    topic: pain
    front: Three requirements of effective symptom management?
    back: Evaluate and treat underlying causes when possible, target therapy at the symptom, and reassess frequently after starting.
    src: { page: 224, quote: "Effective symptom management requires the evaluation and treatment of underlying etiologies, when possible; therapies specifically targeted at symptoms" }
    status: unverified
  - id: geri.L13.018
    kind: card
    topic: pain
    front: What is the most common symptom in advanced illness?
    back: Pain.
    src: { page: 224, quote: "Pain is the most common symptom experienced by those with advanced illness" }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.019
    kind: enumerate
    topic: pain
    prompt: Three key components of successful pain management.
    points: [Routine standardized assessment, Appropriate analgesic prescribing plus non-pharmacologic modalities, Expert management of opioid side effects]
    pass: 3
    src: { page: 224, quote: "routine and standardized assessment, appropriate analgesic prescribing and use of non- pharmacologic modalities; and expert management of opioid-related side effects." }
    status: unverified
  - id: geri.L13.020
    kind: cloze
    topic: pain
    text: "WHO analgesic ladder: mild pain {{c1::1-4}}/10, moderate {{c2::5-6}}/10, severe {{c3::7-10}}/10."
    src: { page: 224, quote: "patients rate their pain as mild (1-4 on a 10-point scale), moderate (5-6), or severe (7-10)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L13.021
    kind: card
    topic: pain
    front: How should pain medicines be scheduled in palliative care?
    back: On a standing (regular) basis, with rescue doses for breakthrough pain; advance to the next level if pain stays uncontrolled.
    src: { page: 224, quote: "pain medications should be administered on a standing or regular basis with rescue doses available for breakthrough pain" }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.022
    kind: card
    topic: pain
    front: What should a pain assessment cover?
    back: Severity, location, character, precipitating and alleviating factors, with a validated instrument.
    src: { page: 224, quote: "Assess severity, location, character, precipitating and alleviating factors using a validated instrument." }
    status: unverified
  - id: geri.L13.023
    kind: card
    topic: pain
    front: "Mild pain (1-4/10): what to start, and in whom are NSAIDs acceptable?"
    back: Acetaminophen, or an NSAID only with normal renal function and minimal GI risk. If acetaminophen fails, start an opioid.
    src: { page: 224, quote: "Begin acetaminophen or a nonsteroidal anti-inflammatory agent in select patients (those with normal renal function and minimal risk of gastrointestinal toxicity)." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.024
    kind: cloze
    topic: pain
    text: "Acetaminophen ceiling: {{c1::3}} g/day, or {{c2::2}} g/day with hepatic dysfunction (book: \"do not exceed 3 or 2 g/d\")."
    src: { page: 224, quote: "Do not exceed 3 or 2 g/d for those with hepatic dysfunction." }
    status: unverified
    tags: [numbers]
  - id: geri.L13.025
    kind: card
    topic: pain
    front: "Moderate pain (5-6/10): opioid plan?"
    back: A short-acting standing opioid (morphine or oxycodone), titrated every several days by 25-50% of the dose; once controlled, consider sustained-release oral opioid or transdermal fentanyl.
    src: { page: 225, quote: "Begin a short-acting standing opioid (morphine or oxycodone) and titrate every several days by 25%-50% of the current dose" }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.026
    kind: card
    topic: pain
    front: "Severe pain (7-10/10): opioid plan?"
    back: Standing short-acting opioid (morphine, oxycodone, hydromorphone), titrate rapidly; strongly consider parenteral opioid titrated by 50-100% every 30-60 min until controlled.
    src: { page: 225, quote: "Strongly consider a parenteral opioid and titrate by 50%-100% of the dose every 30-60 min until pain is controlled." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.027
    kind: table
    topic: pain
    title: Opioid titration by pain level
    columns: [Pain, Start, Titrate]
    rows:
      - ["Moderate (5-6)", "Short-acting standing morphine or oxycodone", "25-50% every several days"]
      - ["Severe (7-10)", "Short-acting standing opioid; consider parenteral", "50-100% every 30-60 min"]
    blanks: [[0, 2], [1, 2]]
    src: { page: 225, quote: "titrate by 50%-100% of the dose every 30-60 min until pain is controlled." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L13.028
    kind: card
    topic: pain
    front: When should long-acting opioids be started in severe pain?
    back: Only after pain is well controlled and steady state is reached (sustained-release morphine or oxycodone, transdermal fentanyl).
    src: { page: 225, quote: "Long-acting opioids (sustained release morphine/oxycodone and transdermal fentanyl) should typically be started only after pain is well controlled" }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.029
    kind: enumerate
    topic: pain
    prompt: Adjuvant analgesic agents.
    points: [Corticosteroids, Anticonvulsants, Tricyclic antidepressants, Bisphosphonates]
    pass: 3
    src: { page: 225, quote: "Adjuvant agents (corticosteroids, anticonvulsants, tricyclic antidepressants, and bisphosphonates)" }
    status: unverified
  # ---------- p225-227: symptoms ----------
  - id: geri.L13.030
    kind: card
    topic: symptoms
    front: Two questions to ask before treating anorexia/cachexia?
    back: Is it from the disease or from other symptoms (nausea, constipation)? Is the patient troubled by it, since families are often more bothered than patients?
    src: { page: 225, quote: "often families, more than patients, are bothered by anorexia." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.031
    kind: enumerate
    topic: symptoms
    prompt: Drugs shown to improve appetite and quality of life in anorexia/cachexia.
    points: [Corticosteroids, Megestrol acetate, Cannabinoids]
    pass: 3
    src: { page: 225, quote: "Pharmacologic approaches that have been shown to improve appetite and quality of life include corticosteroids, megestrol acetate, and the cannabinoids." }
    status: unverified
  - id: geri.L13.032
    kind: card
    topic: symptoms
    front: Advantages of dexamethasone for anorexia?
    back: Once-daily dosing, minimal mineralocorticoid effect, and may improve mood and energy.
    src: { page: 225, quote: "Dexamethasone is advantageous in that it allows once-a-day dosing, has minimal mineralocorticoid properties, and may improve mood and energy." }
    status: unverified
  - id: geri.L13.033
    kind: card
    topic: symptoms
    front: "Megestrol acetate: in whom is it proven most effective?"
    back: Younger adults (most effective appetite stimulant with fewest side effects in RCTs), but not older adults.
    src: { page: 225, quote: "Megestrol acetate has been shown to be the most effective appetite stimulant with fewest side effects in randomized controlled trials for younger" }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.034
    kind: card
    topic: symptoms
    front: Features to ask about when assessing anxiety in palliative care?
    back: Excessive worry, restlessness, agitation, insomnia, hyperventilation or tachycardia.
    src: { page: 226, quote: "Is there excessive worry, restlessness, agitation, insomnia, hyperventilation, or tachycardia?" }
    status: unverified
  - id: geri.L13.035
    kind: card
    topic: symptoms
    front: Treatment of anxiety in elderly palliative patients?
    back: Supportive counselling; cautious benzodiazepines (delirium risk); an SSRI if life expectancy is over 2 months.
    src: { page: 226, quote: "Supportive counseling and cautious use of benzodiazepines because of increased risk of delirium in older adults." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.036
    kind: card
    topic: symptoms
    front: Why must constipation be assessed routinely in patients on opioids?
    back: Patients underreport it, and fecal impaction and perforation can develop quickly.
    src: { page: 226, quote: "Patients underreport constipation and life-threatening complications of fecal impaction, and perforation can develop quickly" }
    status: unverified
  - id: geri.L13.037
    kind: card
    topic: symptoms
    front: Who needs a bowel regimen on opioids, and for how long?
    back: Almost all patients; continue the effective regimen for the whole duration of opioid therapy.
    src: { page: 226, quote: "With few exceptions, all patients on opioid therapy need an individualized bowel regimen." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.038
    kind: card
    topic: symptoms
    front: Standard regimen for opioid constipation, and the rule about stool softeners?
    back: Stool softener plus stimulant; softeners are ineffective alone and must be combined.
    src: { page: 226, quote: "Most patients respond to a stool softener plus a stimulant." }
    status: unverified
  - id: geri.L13.039
    kind: table
    topic: symptoms
    title: Laxatives in palliative care
    columns: [Class, Examples]
    rows:
      - ["Stool softener (never alone)", "Docusate sodium, calcium docusate"]
      - [Stimulant, "Prune juice, senna, bisacodyl"]
      - [Osmotic, "Propylene glycol, milk of magnesia, magnesium citrate"]
      - [Severe constipation, "Large-volume tap water enemas, high colonic enemas, disimpaction"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 226, quote: "Stimulant laxatives: prune juice, senna, and bisacodyl." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.040
    kind: card
    topic: symptoms
    front: Two screening questions for delirium in palliative care?
    back: Are symptoms acute with episodes of inattention? Is there disorganized thinking or an altered level of consciousness?
    src: { page: 227, quote: "Are the symptoms acute with episodes of inattention? Is there disorganized thinking or an altered level of consciousness?" }
    status: unverified
  - id: geri.L13.041
    kind: card
    topic: symptoms
    front: Which symptoms are reliable for depression in advanced illness, and which are not?
    back: Reliable are helplessness, hopelessness, low self-esteem, worthlessness, persistent dysphoria and suicidal ideas. Somatic symptoms are not reliable.
    src: { page: 227, quote: "Somatic symptoms are not reliable indicators of depression in this population of patients." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.042
    kind: card
    topic: symptoms
    front: How should suicidal ideation be handled in advanced illness?
    back: Ask specifically and explore the reasons; it often reflects extreme distress. Get psychiatric consultation for severe depression.
    src: { page: 227, quote: "Suicidal ideation often represents a measure of extreme distress in patients with advanced illness." }
    status: unverified
  - id: geri.L13.043
    kind: card
    topic: symptoms
    front: What dictates the choice of antidepressant in advanced illness?
    back: The patient's estimated life expectancy.
    src: { page: 227, quote: "Choice of pharmacologic therapy is often dictated by the patient's estimated life expectancy." }
    status: unverified
  - id: geri.L13.044
    kind: table
    topic: symptoms
    title: Antidepressant options in advanced illness
    columns: [Drug, Onset, Note]
    rows:
      - ["Psychostimulants (methylphenidate, dextroamphetamine)", Within days, "Minimal side effects; more energy, less fatigue"]
      - [SSRIs, 3-4 weeks, Highly effective]
      - [Tricyclics, "-", "Sedation, dry mouth, constipation, orthostasis: relative contraindication"]
    blanks: [[0, 1], [1, 1], [2, 2]]
    src: { page: 227, quote: "SSRIs are highly effective but may require 3-4 weeks to take effect." }
    status: unverified
    tags: [high-yield]
  # ---------- p228: last hours ----------
  - id: geri.L13.045
    kind: enumerate
    topic: last-hours
    prompt: Expected symptoms of the last hours of life to explain to the family.
    points: [Delirium, Excessive secretions, Edema, Coma]
    pass: 3
    src: { page: 228, quote: "Family education about expected symptoms such as delirium, excessive secretions, edema, and coma can help prepare families" }
    status: unverified
  - id: geri.L13.046
    kind: card
    topic: last-hours
    front: What is the "death rattle", and what must the family be told?
    back: A gurgle from air passing uncleared secretions in the trachea and vocal cords of a comatose patient; it is not gasping or suffocation, and the patient is not suffering.
    src: { page: 228, quote: "It is crucial to emphasize that the noise does not represent gasping or suffocation, and the patient is not experiencing suffering or breathlessness." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.047
    kind: card
    topic: last-hours
    front: Which symptom of dying distresses families most?
    back: The death rattle.
    src: { page: 228, quote: "is perhaps the most distressing symptom experienced by families of dying patients." }
    status: unverified
  - id: geri.L13.048
    kind: card
    topic: last-hours
    front: "Edema in the last hours of life: what to stop?"
    back: Therapies that worsen edema, such as IV fluids, whenever possible.
    src: { page: 228, quote: "If edema is present, therapies that can exacerbate edema, such as IV fluids, should be discontinued when at all possible." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.049
    kind: card
    topic: last-hours
    front: Skin care and pressure ulcers in the last hours of life?
    back: Lubricants and emollients rather than turning (which hurts); for ulcers, focus on pain, discharge and odour, not repositioning or healing-directed wound care.
    src: { page: 228, quote: "using lubricants and emollients rather than turning or repositioning, which can cause increased discomfort and pain." }
    status: unverified
    tags: [high-yield]
  # ---------- p228-229: hospice ----------
  - id: geri.L13.050
    kind: card
    topic: hospice
    front: Who can receive palliative care (US distinction)?
    back: Any patient, without restriction to disease or prognosis, whether expected to recover, live long with chronic illness, or progress.
    src: { page: 228, quote: "Palliative care services can be offered to any patient without restriction to disease or prognosis" }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.051
    kind: card
    topic: hospice
    front: Define hospice care.
    back: Palliation without curative intent, for people with no further cure options or who chose not to pursue arduous, unlikely options.
    src: { page: 229, quote: "Hospice is a type of care involving palliation without curative intent." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.052
    kind: cloze
    topic: hospice
    text: "Medicare Hospice Benefit: {{c1::two}} physicians certify a life expectancy of less than {{c2::six months}} if the disease follows its usual course; living longer {{c3::does not}} mean discharge."
    src: { page: 229, quote: "requires that two physicians certify that a patient has less than six months to live if the disease follows its usual course." }
    status: unverified
    tags: [numbers, high-yield]
  - id: geri.L13.053
    kind: card
    topic: hospice
    front: Biggest difference between hospice and palliative care?
    back: "The patient: where they are in their illness (prognosis) and their wishes about curative treatment. Philosophy and team are similar."
    src: { page: 229, quote: "The biggest difference between hospice and palliative care is the patient: where they are in their illness especially related to prognosis" }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.054
    kind: card
    topic: hospice
    front: What does "hospice" usually mean outside the United States?
    back: A building or institution specializing in palliative care (often end of life), not a stage of care; all palliative-focused care is simply called palliative care.
    src: { page: 229, quote: "Outside the United States the term hospice usually refers to a building or institution which specializes in palliative care" }
    status: unverified
  # ---------- p229-230: markers ----------
  - id: geri.L13.055
    kind: enumerate
    topic: markers
    prompt: Core end-stage indicators for starting palliative care in geriatrics (Morrison & Meier).
    points: [Physical decline, Weight loss, Multiple comorbidities, Serum albumin below 2.5 g/dL, Dependence on help for most ADLs]
    pass: 4
    src: { page: 229, quote: "physical decline, weight loss, multiple comorbidities, and a serum albumin of <2.5 g/dL." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.056
    kind: cloze
    topic: markers
    text: "A core end-stage indicator for geriatric palliative care is a serum albumin below {{c1::2.5 g/dL}}."
    src: { page: 229, quote: "multiple comorbidities, and a serum albumin of <2.5 g/dL." }
    status: unverified
    tags: [numbers]
  - id: geri.L13.057
    kind: enumerate
    topic: markers
    prompt: Non-disease-specific indicators for palliative care in geriatrics.
    points: [Frailty, Functional dependence, Cognitive impairment, Family support needs]
    pass: 4
    src: { page: 230, quote: "Frailty - extreme vulnerability to morbidity and mortality due to progressive decline in function and physiological reserve." }
    status: unverified
    tags: [high-yield]
  - id: geri.L13.058
    kind: card
    topic: markers
    front: How does the book define frailty, with examples?
    back: "Extreme vulnerability to morbidity and mortality from progressive decline in function and reserve: frequent falls, disability, susceptibility to acute illness, poor recovery."
    src: { page: 230, quote: "Frequent falls, disability, susceptibility to acute illness and reduced ability to recover are examples of frailty." }
    status: unverified
  - id: geri.L13.059
    kind: enumerate
    topic: markers
    prompt: Needs of the geriatric palliative care patient.
    points:
      - Continuity and coordination across levels of care
      - Managing multiple chronic illnesses
      - Maintaining functional independence
      - Decision making about care
      - Pain and symptom control
      - Weighing risk versus benefit of treatment
      - Home support for family caregivers
      - Community resource information and access
    pass: 6
    src: { page: 230, quote: "Continuity and coordination of care that responds to episodic and long-term chronic illnesses and transitioning between levels of care." }
    status: unverified
  # ---------- MCQs ----------
  - id: geri.L13.060
    kind: mcq
    topic: definition
    stem: A 70-year-old with newly diagnosed lymphoma starting curative chemotherapy has severe nausea. Is palliative care appropriate?
    options: ["Yes, it can run alongside curative treatment", "No, only after curative treatment stops", "No, only with life expectancy under 6 months", "Only for cancer patients over 75"]
    answer: 0
