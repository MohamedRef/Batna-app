  - id: rheum.L06.005
    kind: table
    topic: innate
    title: "Innate versus adaptive: properties"
    columns: [Feature, Innate, Adaptive]
    rows:
      - [Specificity, Non-specific, Specific]
      - [Origin, Present at birth, Acquired from exposure]
      - [Intensity with exposure, Does not change, Increases]
