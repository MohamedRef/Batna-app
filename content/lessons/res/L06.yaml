  - id: res.L06.lesson6
    title: "خطوات الـ RCT: من الفكرة للتحليل"
    hook: "12 خطوة. أول واحدة فيهم: «هو أنا محتاج أعمل التجربة دي أصلًا؟»"
    minutes: 10
    pages: [46, 56]
    topics: [planning]
    goals:
      - "ترتّب الـ 12 خطوة"
      - "تعرف أنواع الـ outcomes وصفات أحسنها"
      - "تفرّق inclusion و exclusion criteria والـ target population"
    status: unverified
    steps:
      - kind: explain
        page: 46
        quote: "Steps in Planning, Designing and Conduct of a Randomized Controlled Clinical trial:\n  Step 1 - Deciding - Is clinical trial really required? Should it be done? Can it be done?\n  Step 2 - Clearly state the research hypothesis\n  Step 3 - Enumerate the inclusion and exclusion criteria.\n  Step 4 - Defining the populations\n  Step 5 - Sample Size Calculation\n  Step 6 - Detailed Descriptions of Measurement Protocols\n  Step 7 - Enrolling the Participants"
        title: "الخريطة: 12 خطوة"
        text: |
          الـ ==randomized controlled trial (RCT)== بيمشي في 12 خطوة، من التخطيط للتنفيذ للتحليل.

          - **1** Deciding: محتاجين trial؟ ينفع؟ نقدر؟
          - **2** Hypothesis
          - **3** Inclusion and exclusion criteria
          - **4** Defining the populations
          - **5** Sample size
          - **6** Measurement protocols
          - **7** Enrolling the participants
          - **8** Randomization
          - **9** Intervention and placebo control
          - **10** Blinding
          - **11** Follow up and assessment
          - **12** Statistical analysis
      - kind: figure
        page: 47
        quote: "Step 8 – Randomization\nStep 9 - Introduce the Intervention and Placebo Control Modalities\nStep 10 - Ensure Blinding\nStep 11 - Follow Up and Assessment\nStep 12 - Statistical Analysis"
        title: "سلّم الـ RCT"
        alt: "A staircase of three landings. Plan: steps 1 to 6, from deciding whether a trial is needed to measurement protocols. Run: steps 7 to 10, enrolling, randomization, intervention and placebo, blinding. Finish: steps 11 and 12, follow-up and statistical analysis."
        caption: "قسّمها 3 حتت: **تخطيط** (1–6)، **تنفيذ** (7–10)، **نهاية** (11–12). الـ randomization بييجي **بعد** الـ enrolment، مش قبله."
