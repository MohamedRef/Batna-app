- id: res.L19.lesson3
  title: 'اسأل صح: background ولا foreground، والـ PICO'
  hook: «إيه أسباب الـ MI؟» و«هل الـ statin بيقلل الوفيات في مرضى الـ MI؟» سؤالين مختلفين خالص. الفرق ده أول خطوة.
