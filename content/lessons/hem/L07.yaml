    steps:
      - kind: explain
        page: 108
        title: "الـ cytogenetics: الكروموسوم بيقولك النوع والمصير"
        quote: "Some chromosomal abnormalities are associated with specific syndromes of AML. Acute promyelocytic leukemia always has a tanslocation involving chromosomes 15 and 17 t(15-17)."
        text: |
          بعض الـ chromosomal abnormalities مربوطة بأنواع معينة:

          - **APL (M3)**: ==t(15;17)== **دايمًا**.
          - **M4 مع abnormal eosinophilia**: **inversion 16**.
          - **M2 مع t(8;21)**: outcome ==relatively favorable== مع الـ chemo.
          - **ALL**: **t(4;11)** في الـ neonatal ALL، و **t(8;14)** مع الـ L3.

          ليه نهتم؟ لأن الـ translocation بيأكد النوع لما الشكل يحيّر، وبيقولك الـ prognosis، وفي الـ APL بيحدد علاج مختلف خالص (ATRA في درس العلاج).
      - kind: match
        page: 109
        quote: "Common changes in ALL are t (4;11), an abnormality seen mostly in neonatal ALL, t (8: 14) an abnormality associated with the L3 varient of ALL."
        prompt: "وصّل كل translocation بمرضه:"
        pairs:
          - ["t(15;17)", "APL (M3), always"]
          - ["inv(16)", "M4 with abnormal eosinophilia"]
          - ["t(8;21)", "M2, relatively favorable"]
          - ["t(4;11)", "Neonatal ALL"]
          - ["t(8;14)", "L3 ALL"]
        why: "الـ acute promyelocytic leukaemia (APL) دايمًا t(15;17). الـ inv(16) مع M4 والـ eosinophils. الـ t(8;21) في M2 وبتستجيب كويس للـ chemo. الـ t(4;11) في الـ neonates، والـ t(8;14) في الـ L3 (Burkitt)."
      - kind: aside
        tone: joke
        page: 109
        quote: "abnormal eosinophilia is associated with an inversion in chromosome 16, patients with M2 AML with t (8: 21) express CD56 have a relatively favorable outcome with chemotherapy."
        text: "**8 و21**: زي سن الـ 21 كده، شباب ومتفائل. الـ t(8;21) في M2 بتاخد chemo وتطلع **favorable**."
      - kind: explain
        page: 109
        title: "مصدرين لكل الأعراض"
        quote: "The sings and symnptoms of acute leukemia result from decreased normal marrow function and invasion of normal organs by leukemic blasts. Anemia is present at diagnosis in most patients, causing fatigue, pallor and headache."
        text: |
          كل أعراض الـ acute leukemia جاية من حاجتين:
          1. ==Marrow failure==: النخاع مش بيعمل خلايا طبيعية.
          2. ==Infiltration==: الـ blasts بتغزو الأعضاء.

          يعني قبل ما تحفظ أي عرض، اسأل: ده عشان حاجة **ناقصة** (marrow failure) ولا عشان حاجة **زيادة** قاعدة في مكان مش مكانها (infiltration)؟
      - kind: figure
        page: 109
        quote: "The sings and symnptoms of acute leukemia result from decreased normal marrow function and invasion of normal organs by leukemic blasts. Anemia is present at diagnosis in most patients, causing fatigue, pallor and headache."
