        caption: "الـ **uncommitted stem cell** بيطلّع 5 blasts. اللي يخلّص بـ **-blast** صغير ولسه بيتعلم؛ اللي يخلّص بـ **-cyte** ناضج. والـ ==promyelocyte== هو المفترق اللي الـ granulocytes الثلاثة بيتفرعوا منه."
        svg: |
