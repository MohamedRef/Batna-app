      - kind: explain
        page: 222
        title: "Screening ومتابعة الكثافة"
        quote: "Cost-effective screening guidelines for asymptomatic perimenopausal women have not yet been established. Therefore, widespread screening for osteoporosis in asymptomatic women cannot be recommended."
        text: |
          - الكتاب: ==widespread screening== للستات اللي ملهمش أعراض **cannot be recommended**.
          - الـ **serial measurements** لمتابعة العلاج **controversial**.
          - لو الكثافة بين الـ mean و **1 SD** تحتها: قياس تاني بعد **2 to 5 years**.

          ليه مش screening لكل الناس؟ الكتاب بيقول لأن مفيش **cost-effective guidelines** للستات حوالين سن اليأس لسه. وليه القياس المتكرر controversial؟ عشان التغيير في سنة صغير، وممكن يبقى أصغر من خطأ الجهاز.
      - kind: update
        page: 222
        quote: "Cost-effective screening guidelines for asymptomatic perimenopausal women have not yet been established. Therefore, widespread screening for osteoporosis in asymptomatic women cannot be recommended."
        text: "الـ US Preventive Services Task Force بتوصي بـ bone mineral density (BMD) screening لكل ست عندها **65 سنة أو أكتر**، وللأصغر بعد سن اليأس لو الخطر عالي."
        ref: "USPSTF osteoporosis screening 2018"
      - kind: explain
        page: 222
        title: "ليه الـ SPA والـ DPA والـ QCT مش كفاية؟"
        quote: "However, it does not directly measure bone density in vertebrae or femurs, the most common and disabling sites of osteoporotic fractures."
        text: |
          الكتاب بيدّيك عيب كل جهاز، والعيب هو السبب إن الـ DEXA كسب:

          - **SPA** (radius أو ulna أو heel): رخيص وإشعاعه قليل ودقيق، بس ==مش بيقيس الفقرات ولا الـ femur==، وهما أشهر وأخطر أماكن الكسر. يعني بيقيس عضم مش هو اللي هيتكسر.
          - **DPA**: بيقيس الفقرات والـ femur مباشرة، بس أغلى وأقل انتشارًا وبياخد وقت أطول، وأدق في الشباب ومتوسطي السن. وبيدّي ==false high== مع الـ degenerative joint disease والـ compression fractures والـ calcified vessels.
          - **QCT**: الـ lumbar spine أساسًا، بس ==إشعاع عالي جدًا==، فممنوع في سن الإنجاب وفي التكرار، وغالي، وتكراره مش ثابت.

          التفسير المقبول (مش في الكتاب) للـ false high: الجهاز بيعدّ أي كالسيوم في الطريق، فالـ osteophytes والأوعية المتكلسة والفقرة المضغوطة بيتحسبوا عضم.
      - kind: table
        page: 223
        quote: "Dual-energy x-ray absorptiometry (DEXA), the newest densitometry technique, is precise, exposes the patient to little radiation, and requires little scanning time. Together with its low cost, these characteristics make DEXA the method of choice. It can measure bone density at the radius, ulna, spine, and femur, as well as the total body. Because it is more precise than other methods, DEXA is better suited to serial measurements. Although the ability of DEXA to predict fractures has not been as well studied as that of the different techniques, densitometric measurements with DEXA are almost identical to those with DPA; thus, they are assumed to have similar predictive values."
        title: "أربع طرق لقياس الكثافة"
        columns: [Method, Good, Bad]
        rows:
          - ["SPA", "Cheap, low radiation", "No spine or femur"]
          - ["DPA", "Spine + femur directly", "Costly, slow; false high"]
          - ["QCT", "Lumbar spine", "Very high radiation"]
          - ["DEXA", "Precise, low dose, cheap, fast", "Fracture data less studied"]
        hide: [[0, 2], [2, 2], [3, 1]]
      - kind: reveal
        page: 222
        quote: "Falsely elevated values may occur with degenerative joint disease, compression fractures, or closely situated calcified vessels."
        prompt: "ست كبيرة عندها osteoarthritis في العمود الفقري و aortic calcification. الـ DPA طلع طبيعي. تصدّقه؟"
        answer: |
          لأ بسهولة. الـ **DPA** بيدي ==falsely elevated values== مع الـ **degenerative joint disease**، والـ **compression fractures**، والـ **calcified vessels** القريبة. الكالسيوم الزيادة بيتحسب كأنه عضم.
      - kind: reveal
        page: 223
        quote: "Because it is more precise than other methods, DEXA is better suited to serial measurements."
        prompt: "ليه الـ DEXA بالذات هو اللي بيتكرر للمتابعة؟"
        answer: |
          لأنه ==أدق== من الباقي (precise)، وإشعاعه قليل، ووقته قصير، ورخيص، وبيقيس الـ radius والـ ulna والـ spine والـ femur والجسم كله.

          التفسير المقبول (مش في الكتاب): في المتابعة إنت بتدوّر على فرق صغير بين قياسين؛ لو الجهاز نفسه بيتهزّ، الفرق ده هيبقى noise. عشان كده الدقة أهم حاجة في الـ serial measurements. وقياساته شبه الـ DPA بالظبط، فبنفترض إن قدرته على توقّع الكسر زيه.
      - kind: check
        page: 223
        quote: "Because of the extremely high radiation exposure with quantitative CT, it should not be used in women of childbearing age or for serial measurements. The cost may be higher than that of other techniques. Reproducibility for serial measurements is poor."
        question: "Which bone density method should NOT be used in a 28-year-old woman or for serial scans?"
        options:
          - "Quantitative CT"
          - "DEXA"
          - "Single-photon absorptiometry"
          - "Dual-photon absorptiometry"
        answer: 0
        why:
          - "صح: الـ quantitative computed tomography (QCT) فيه extremely high radiation."
          - "الـ DEXA هو الأنسب للـ serial measurements."
          - "قليل الإشعاع، بس مش بيقيس الـ spine."
          - "مش ممنوع، بس أغلى وأبطأ."
      - kind: explain
        remind: [dm.L17.074]
        page: 223
        title: "من غير دوا: تلات حاجات"
        quote: "There are three components to the nondrug therapy of osteoporosis: diet, exercise, and cessation of smoking. In addition, affected patients should avoid, if possible, drugs that increase bone loss, such as glucocorticoids."
        text: |
          ==diet, exercise, and cessation of smoking==، وكمان **avoid drugs that increase bone loss** زي الـ glucocorticoids لو ينفع.

          - **Calcium**: supplement **500–1000 mg/day** elemental، **divided doses at mealtime**، والإجمالي مع الأكل حوالي **1500 mg/day**.
          - **Vitamin D**: **800 international units (IU)/day**، أكتر مع الـ malabsorption أو الـ anticonvulsants.
      - kind: update
        page: 223
        quote: "Postmenopausal women (and older men) should take adequate supplemental elemental calcium (generally 500 to 1000 mg/day), in divided doses, at mealtime, such that their total calcium intake, including food calcium, approximates 1500 mg/day. Calcium supplementation may also have a favorable effect on serum lipids."
        text: "التوصية الحالية: إجمالي الكالسيوم **1200 mg/day** للستات من 51 سنة، من الأكل الأول والـ supplement يكمّل الناقص بس."
        ref: "BHOF Clinician's Guide 2022"
      - kind: explain
        page: 224
        title: "الكالسيوم والـ vitamin D: ليه الطريقة دي؟"
        quote: "Higher doses are required if they have malabsorption or rapid metabolism of vitamin D due to concomitant anticonvulsant drug therapy."
        text: |
          - **Divided doses at mealtime**: التفسير المقبول (مش في الكتاب): الأمعاء بتمتص كمية محدودة في المرة، والأكل بيحسّن امتصاص بعض أنواع الكالسيوم.
          - الكتاب بيضيف فايدتين للكالسيوم: ممكن يحسّن الـ ==serum lipids==، وفيه دليل إنه مرتبط عكسيًا بالـ cardiovascular disease في الستات بعد سن اليأس.
          - **Vitamin D أكتر** في حالتين (الكتاب): ==malabsorption==، و ==anticonvulsants== اللي بتسرّع تكسير الـ vitamin D.

          ليه الـ vitamin D مهم أصلًا؟ من غيره الكالسيوم اللي بتديه مش هيتمص كويس، فالاتنين بيمشوا مع بعض.
      - kind: explain
        page: 224
        title: "الرياضة والسجاير"
        quote: "We strongly recommend smoking cessation to all women concerned with their skeletal health because smoking cigarettes accelerates bone loss. Smoking one pack per day throughout adult life was associated with a 5 to 10 percent reduction in bone density. Smoking may also negate the beneficial effect of estrogen therapy in postmenopausal women [19,20]. This may be mediated in part by the acceleration of estrogen metabolism, thereby lowering serum estrogen concentrations."
        text: |
          - **Exercise**: على الأقل **30 minutes three times per week**، أي **weight-bearing** حتى المشي. في الكبار، الفايدة الأساسية من **muscular strength** (وقعات أقل) مش الكثافة.
          - **Smoking**: علبة في اليوم طول العمر = ==5 to 10%== أقل في الكثافة، وبيبوّظ فايدة الـ estrogen لأنه بيسرّع الـ **estrogen metabolism**.
      - kind: mnemonic
        page: 224
        quote: "Women with osteoporosis (or seeking to prevent it) should exercise (prudently) for at least 30 minutes three times per week, as exercise has been associated with improvements in or maintenance of bone density and a reduced risk of hip fracture in older women. Any weight-bearing exercise regimen, including walking, is acceptable. Nevertheless, in older women, except for truly vigorous regimens, the beneficial effect of exercise on bone density is minimal; any decrease in fractures is likely due to increased muscular strength."
        word: "8 15 30 3"
        parts:
