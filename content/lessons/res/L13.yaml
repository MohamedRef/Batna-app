          - "ده unjustified priority."
      - kind: explain
        page: 45
        quote: "Discussion\nConclusion\nGood discussion should be structured to include the following six components:\n4. Meaning of the study, possible mechanisms and implications for clinicians and policymakers:\nAuthors should not move beyond the limited evidence provided by the study. Restraint in stating implications is a virtue appreciated by reviewers and readers. It may also be relevant to emphasize, not only what the results mean, but also what the results do not mean."
        title: "4. يعني إيه؟ (على قدّ الدليل)"
        text: |
          الـ meaning والـ mechanisms والـ implications للأطباء وصنّاع القرار؛ بس **ماتطلعش برة الدليل** اللي في إيدك.

          ==Restraint== فضيلة بيحبها المحكّمين، وقول كمان النتايج **مابتعنيش إيه**.
      - kind: explain
        page: 46
        quote: "Discussion\nConclusion\nGood discussion should be structured to include the following six components:\n5. Unanswered questions and future research:\nNew research may be proposed to provide the answer to questions that are still not answered.\nA good study should generate new ideas for further research. A simple statement that further research is needed is less helpful than providing new specific research questions or suggesting particular studies."
        title: "5. أسئلة لسه مفتوحة"
        text: |
          الدراسة الكويسة **بتولّد أفكار**. وجملة «further research is needed» لوحدها **مش مفيدة**؛ الأحسن تقترح ==specific research questions== أو دراسة معينة.
