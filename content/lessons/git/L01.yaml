lecture: git.L01
lessons:
  # ------------------------------------------------------------------
  - id: git.L01.lesson1
    title: "حرقان مش بيروح على الـ PPI"
    hook: "شاب عنده heartburn، خد PPI ومتحسّنش. نكمّل علاج ولا نوقف ونبص بالمنظار؟"
    minutes: 9
    pages: [1, 4]
    topics: [gerd, refractory-gerd]
    goals:
      - "تعرّف gastroesophageal reflux disease (GERD) بالكلمتين: symptoms و objective evidence"
      - "تعرف ليه الأعراض لوحدها ممكن تضحك عليك، ومين اللي بيقلّد الـ GERD"
      - "تعرف الـ 5 أسباب لأعراض مش بتروح على الـ proton pump inhibitor (PPI)، وليه بنوقفه قبل المنظار"
    status: unverified
    steps:
      - kind: explain
        remind: [git.L01.001]
        page: 1
        quote: "Gastroesophageal reflux disease • Functional dyspepsia • Gastritis • Peptic ulcer • Zolinger ellisson syndrome"
        title: "المحاضرة دي عن الحمض"
        text: |
          الـ **acid-related disorders** في الكتاب خمسة:

          - **gastro-esophageal reflux disease (GERD)**
          - **Functional dyspepsia**
          - **Gastritis**
          - **Peptic ulcer**
          - **Zollinger-Ellison syndrome**

          ليه اتجمعوا في محاضرة واحدة؟ عشان كلهم بيرجعوا لنفس البطل: الـ **acid**. يا الحمض طالع في المكان الغلط (GERD)، يا الغشاء مش قادر يستحمله (gastritis و ulcer)، يا فيه ورم بيضخ hormone يزوّده (Zollinger-Ellison). وعشان كده نفس الدوا، الـ PPI، هيظهر في كل درس. ونبدأ بالـ GERD.
      - kind: explain
        page: 1
        quote: "GERD is the condition in which the reflux of gastric contents into the esophagus results in symptoms and/or complications."
        title: "يعني إيه GERD؟"
        text: |
          الكتاب بيقول: الـ ==GERD== هو إن **reflux of gastric contents** للـ esophagus يعمل **symptoms and/or complications**.

          وفيه تعريف **objective** كمان: يا **mucosal injury** باينة في المنظار، يا **abnormal esophageal acid exposure** في الـ reflux monitoring.

          يعني الأعراض لوحدها مش كفاية علشان تقول GERD أكيد، وده هيفرق معانا جدًا بعد شوية.
      - kind: explain
        page: 1
        quote: "He was diagnosed as GERD depending on the current symptoms"
        title: "حالة الكتاب: التشخيص اتعمل على الأعراض بس"
        text: |
          شاب **28 سنة**، **non smoker**، عنده من **3 شهور**:
          - **Heartburn** و **regurgitation**
          - نوبات **choking** بتتكرر
          - **مفيش dysphagia** و **مفيش weight loss**

          جرّب **antacids** ومرتاحش، والكشف **clinically free**. فاتشخّص ==GERD depending on the current symptoms==.

          ليه الدكتور اطمّن يبدأ علاج من غير منظار؟ التفسير المقبول (مش في الكتاب): مفيش dysphagia ولا weight loss، يعني مفيش alarm يخلّيك تخاف من stricture أو ورم، فالـ empirical PPI بداية معقولة. بس خلي بالك: التشخيص ده **على الأعراض**، والتعريف الـ objective اللي فات لسه ما اتحققش. وده اللي هيعمل المشكلة بعد كده.
      - kind: check
        page: 2
        quote: "The Symptoms of GERD are Nonspecific and may Overlap Or Be Confused With Those Of Other Disorders Such As\n  Rumination\n  Achalasia\n  Eosinophilic Esophagitis (EoE)\n  Reflux Hypersensitivity\n  Functional heartburn, Cardiac or Pulmonary Disease"
        question: "Which of these can mimic GERD symptoms according to the lecture?"
        options:
          - "All of them"
          - "Achalasia only"
          - "Cardiac disease only"
          - "Eosinophilic esophagitis only"
        answer: 0
        why:
          - "صح: الكتاب بيعدّ rumination، achalasia، eosinophilic esophagitis (EoE)، reflux hypersensitivity، functional heartburn، وأمراض القلب والصدر."
          - "Achalasia واحدة بس من القايمة."
          - "القلب واحد بس من القايمة، وده سبب إنك متستخفّش بأي heartburn."
          - "EoE واحدة بس من القايمة."
      - kind: explain
        page: 2
        quote: "Are the symptoms 100% specific?"
        title: "ليه الأعراض مش 100% specific؟"
        text: |
          الكتاب سأل: الأعراض **100% specific**؟ والإجابة ==NO==. ده من الـ **AGA Clinical Practice Update** (Yadlapati وزمايله، 2022).

          التفسير المقبول (مش في الكتاب) لكل واحد في القايمة بيقلّد الـ GERD ليه:
          - **Rumination**: الأكل بيرجع للبق من غير مجهود بعد الأكل، فيبان زي regurgitation.
          - **Achalasia**: الأكل بيقعد في الـ esophagus ويتخمّر، فيعمل حرقان وترجيع.
          - **Eosinophilic esophagitis (EoE)**: التهاب في جدار الـ esophagus نفسه، فيوجع زي الحمض.
          - **Reflux hypersensitivity** و **functional heartburn**: الـ esophagus **حسّاس زيادة**، فالـ reflux العادي أو حتى ولا حاجة بتوجع.
          - **Cardiac or pulmonary disease**: ألم ورا القص، وده اللي لازم ما يفوتكش.
      - kind: explain
        page: 3
        quote: "Escalation of PPI dose was done to double dose for 6 weeks."
        title: "حالة الكتاب خطوة بخطوة"
        text: |
          شاب **28 سنة**: heartburn و regurgitation ونوبات **choking** من 3 شهور. مفيش dysphagia ولا weight loss.

          - أخد **proton pump inhibitor (PPI) once daily**، قبل الفطار بـ **30-60 minutes**، لمدة 6 أسابيع: تحسّن جزئي.
          - زودوا لـ ==double dose==: الأعراض فضلت.
          - وقفوا الـ PPI **أسبوعين** وعملوا **upper endoscopy off PPI**.

          السؤال المهم: ليه وقفوا الـ PPI قبل المنظار؟
      - kind: explain
        page: 3
        quote: "Potential mechanisms underlying symptoms suspected due to GERD but refractory to PPI therapy"
        title: "الـ PPI فشل: خمس احتمالات"
        text: |
          الكتاب بيدّيك **5 mechanisms** لأعراض شبه GERD ومش بتروح على الـ PPI:

          - ==Refractory GERD==: الحمض **لسه عالي** رغم الـ PPI، وهو اللي عامل الأعراض.
          - ==Reflux hypersensitivity==: الـ PPI **ظبط** الحمض، بس الـ physiologic reflux العادي (acidic أو non acidic) بيعمل أعراض.
          - **Other esophageal disorders**: زي **EoE** أو **achalasia**.
          - **Non-esophageal disorders**: زي **rumination** أو **gastroparesis**.
          - **Functional**: مش GERD ومفيش histopathologic أو motility أو structural abnormality.

          ليه التقسيم ده مهم؟ لأن العلاج مختلف تمامًا: الأولى محتاجة acid control أقوى، والتانية محتاجة تهدّي الإحساس، والباقي أمراض تانية خالص. يعني «زوّد الـ PPI» مش الإجابة دايمًا.
      - kind: sort
        page: 3
        quote: "Potential mechanisms underlying symptoms suspected due to GERD but refractory to PPI therapy"
        prompt: "أعراض شبه GERD ومش بتروح على PPI. حط كل وصف في مكانه:"
        bins: ["Refractory GERD", "Reflux hypersensitivity", "Not reflux at all"]
        cards:
          - { text: "Abnormal acid reflux persists on PPI", bin: 0 }
          - { text: "Acid normalized, but physiologic reflux triggers symptoms", bin: 1 }
          - { text: "Eosinophilic esophagitis", bin: 2 }
          - { text: "Achalasia", bin: 2 }
          - { text: "Rumination or gastroparesis", bin: 2 }
          - { text: "Functional heartburn", bin: 2 }
        why: "الكتاب: **refractory GERD** = الحمض لسه عالي. **Reflux hypersensitivity** = الحمض اتظبط بس الـ reflux العادي بيوجع. والباقي أمراض تانية: esophageal (EoE، achalasia)، non-esophageal (rumination، gastroparesis)، أو functional."
      - kind: reveal
        page: 4
        quote: "To maximize the yield of GERD diagnosis and assess for EE, Because PPIs are highly effective for healing EE, underlying EE clearly can be missed."
        prompt: "ليه بنوقف الـ PPI قبل المنظار؟ (ده سؤال امتحان)"
        answer: |
          سببين:

          - الـ PPI **بيعالج الـ erosive esophagitis (EE) كويس جدًا**، فلو عملت المنظار وهو على العلاج ممكن متشوفش الـ EE اللي تحت. يعني بتوقف علشان ==maximize the yield== للتشخيص.
          - وقف الـ PPI **2-4 weeks** بيسهّل تشخيص **EoE**، ودي احتمال وارد لما الأعراض متروحش على الـ PPI.
      - kind: aside
        tone: analogy
        page: 4
        quote: "To maximize the yield of GERD diagnosis and assess for EE, Because PPIs are highly effective for healing EE, underlying EE clearly can be missed."
        text: |
          زي ما تروح تكشف على عربية بتطلّع دخان بعد ما الميكانيكي غسل الموتور: هتلاقيه لامع ومش هتعرف الزيت كان بينزل منين. 😄

          الـ proton pump inhibitor (PPIs) بتغسل الـ esophagus وبتعمل healing للـ erosive esophagitis (EE)، فلازم توقفها علشان تشوف الحقيقة.
      - kind: figure
        remind: [git.L01.014]
        page: 4
        quote: "Troublesome GERD symptoms despite single-dose PPI\n8 wk double-dose PPI trial\nNo symptom response\nAssess for objective GERD despite double dose PPI\n  1. Erosive disease on EGD (LA Grade C or D Esophagitis, Peptic stricture, Barrett esophagus)\n  2. pH impedance on PPI therapy with elevated acid exposure time and/or reflux burden\nPPI-refractory GERD"
        title: "الـ algorithm بتاع PPI-refractory GERD"
        alt: "Flow chart: troublesome GERD symptoms on single-dose PPI, then an 8-week double-dose PPI trial, then if no response assess for objective GERD (erosive disease on EGD or raised acid exposure on pH-impedance on PPI), ending in PPI-refractory GERD."
        caption: "ده الـ algorithm زي الكتاب. لاحظ إن الـ refractory لازم يتثبت **objectively**، مش بالأعراض بس."
        svg: |
          <svg viewBox="0 0 330 430" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="G1a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
            </defs>
            <rect x="40" y="10" width="250" height="46" rx="8" class="fg-box"/>
            <text x="165" y="30" text-anchor="middle" class="t-sm t-b">Troublesome GERD symptoms</text>
            <text x="165" y="46" text-anchor="middle" class="t-sm">despite single-dose PPI</text>
            <path d="M165 56v24" class="fg-arrow" marker-end="url(#G1a)"/>
            <rect x="40" y="84" width="250" height="40" rx="8" class="fg-acc"/>
