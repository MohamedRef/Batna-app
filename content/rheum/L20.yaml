  # ---------- p341-342: peripheral arthritis algorithm ----------
  - id: rheum.L20.076
    kind: card
    topic: treatment
    front: Define mild peripheral PsA and its first treatment.
    back: Fewer than four joints, no radiological damage, minimal discomfort or impairment; start an NSAID (apremilast 30 mg twice daily is a safer alternative with many comorbidities).
