      - "HRS-AKI: creatinine ↑ ≥0.3/48h، مفيش استجابة لـ albumin 1 g/kg × يومين، مفيش shock ولا parenchymal disease."
      - "Terlipressin + albumin؛ وقّف بعد 14 يوم لو مفيش استجابة؛ LT الأمثل."
