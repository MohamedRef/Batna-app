# One line per change Mohamed can see (docs/RELEASE.md §5).
- kind: new
  ar_eg: صفحة «مراجعك» فيها كل المحاضرات بصفحات الكتاب ودروسها، وبحث في العناوين والمواضيع، وكروتك
  en: A new References page lists every lecture with its book pages and lessons, a search over titles and topics, and your own cards
- kind: improved
  ar_eg: صفحة المحاضرة بتوري صحة المحتوى اللي راجعتها لوحدها، منفصلة عن إنك خلّصت الدروس
  en: A lecture's page shows how much content you have checked, apart from the lessons you finished
- kind: improved
  ar_eg: الحاسبات بشكل جديد، بتقولك فاضل كام خانة، والقيمة الغلط بتتعلّم في مكانها، وصفحة الكتاب تحت النتيجة بتفتح
  en: Calculators have a new look, count the fields left, mark a wrong value in place, and the book page under the result opens
- kind: improved
  ar_eg: كارت جديد، الغلط بيظهر تحت الخانة نفسها، وتقدر تعاين الكارت قبل ما تحفظه، واللي كتبته عمره ما يضيع
  en: New card form shows each problem under its field, lets you preview the card before saving, and never loses what you typed
