        text: |
          ص 43: **adequate caloric intake = 30–35 kcal/kg/day**. ونتيجة الدراسة اللي فاتت: في الكبار، البروتين الأعلى (حيواني ونباتي) كان مع **وفيات أقل** في مرضى الـ CKD، والكتاب بيقول إن فايدة البروتين ممكن ==تغلب ضرره== في الكبار اللي عندهم CKD خفيف أو متوسط.

          التفسير المقبول (مش في الكتاب) لليه السعرات مهمة: لو المريض مش واكل سعرات كفاية، الجسم بيحرق البروتين نفسه علشان الطاقة، فالعضل يدوب والـ urea يعلى حتى لو قلّلت البروتين في الأكل. يعني تقليل البروتين من غير سعرات كفاية بيعمل عكس المطلوب.
      - kind: explain
