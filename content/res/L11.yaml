  - id: res.L11.087
    kind: mcq
    topic: probability
    stem: >-
      If the researcher aims at measuring variables and generalizing the findings obtained from a representative sample to
      the total study population, which of the following sampling methods is the best?
    options: [Convenience sampling, Quota sampling, Simple random sampling, Judgmental sampling]
    answer: 2
    why:
      - A convenience sample may be quite unrepresentative, and the distortion cannot be adjusted for (slides 54-55).
      - Quota sampling has no sampling frame and no random selection, so it is threatened by selection bias (slide 62).
      - Simple random sampling is a probability method that gives every unit an equal chance, so the results can be generalized.
      - Judgmental sampling picks informants on purpose, for in-depth qualitative insight.
    src: { page: 15, quote: "Each unit of the sample is chosen on the basis of chance.\nAll units of the study population should have an equal, or at least a known chance of being included in the sample.\nThat guarantee requires subjects to be selected at random, or that randomization be employed." }
    status: unverified
    tags: [revision]
  - id: res.L11.088
    kind: mcq
    topic: probability
    stem: "The list of all study population units from which the sample is selected is called:"
    options: [Sample size, Sampling error, Sampling ratio, Sampling frame, Sampling procedure]
    answer: 3
    why:
      - Sample size is how many units you take.
      - Sampling error is chance difference between the sample and the population.
      - The sampling ratio (fraction) is n/N, a number, not a list.
      - "The sampling frame: the portion of the population the sample is selected from, usually a list (slide 16)."
      - The sampling procedure is the method of selecting from the frame.
    src: { page: 16, quote: "The portion of the population from which a sample is to be selected.\nUsually defined by geographical listings, maps, directories, membership, hospital admission list or other kinds of lists." }
    status: unverified
    tags: [revision]
  - id: res.L11.089
    kind: mcq
    topic: probability
    stem: "In a study, groups of study units were selected instead of selecting the study units individually. This is called:"
    options: [Stratified sampling, Cluster sampling, Systematic sampling, Multistage sampling]
    answer: 1
    why:
      - Stratified sampling takes individuals at random from every stratum.
      - Selecting groups of study units (clusters) instead of individual units is cluster sampling (slide 39).
      - Systematic sampling picks individuals at a fixed interval from a list.
      - Multistage sampling chains several stages; the definition given here is cluster sampling.
    src: { page: 39, quote: "However, when a list of groupings of study units is available (e.g., villages or schools) or can be easily compiled, a number of these groupings can be randomly selected.\nThe selection of groups of study units (clusters) instead of the selection of study units individually is called CLUSTER SAMPLING." }
    status: unverified
    tags: [revision, high-yield]
  - id: res.L11.090
    kind: mcq
    topic: probability
    stem: Households are selected at random, and every person in each selected household is included in the sample. Which sampling procedure is this?
    options: [Systematic sampling, Paired sampling, Simple random sampling, Stratified sampling, Cluster sampling]
    answer: 4
    why:
      - Systematic sampling picks individuals at regular intervals from a list.
      - Paired sampling is not one of the lecture's sampling methods.
      - Simple random sampling picks individuals, each with an equal chance.
      - Stratified sampling picks some individuals from every subgroup.
      - Random groups (households) with all their members included is one-stage cluster sampling (slide 44).
    src: { page: 44, quote: "Two types of cluster sampling methods.\nOne-stage sampling. All of the elements within selected clusters are included in the sample.\nTwo-stage sampling. A subset of elements within selected clusters are randomly selected for inclusion in the sample." }
