  - id: res.L06.067
    kind: mcq
    topic: blinding
    stem: >-
      In a trial of a new antiemetic, the patients, the nurses recording vomiting episodes and the statistician all
      receive coded packs labelled only "X" and "Y". What type of blinding is this?
    options:
      - Single blind
      - Double blind
      - Triple blind
      - Open label
    answer: 2
    why:
      - Single blinds only the subject.
      - Double blinds the subject and the observer, not the analyst.
      - Subject, observer and the person analysing the data are all blinded.
      - Open label means no attempt at blinding.
    src: { page: 44, quote: "Blinding (or masking):\n  Triple blinding: neither subject, observer or person analysing the data have any information about allocation of the subject to treatment or comparison groups\n  Unblinded or open label studies: no attempt at blinding" }
