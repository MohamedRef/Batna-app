  # ---------------- itt (slides 69-78) ----------------
  - id: res.L07.069
    kind: card
    topic: itt
    front: What is intention-to-treat (ITT) analysis?
    back: >-
      All participants are analysed in the groups to which they were randomized, whether or not they completed the study or complied
      with treatment. Analysis follows the original randomized assignment.
    src: { page: 69, quote: "Intention-to-treat analysis: all study participants are included in the analyses as part of the groups to which they were randomized regardless of whether they completed the study or not\nPer protocol analysis: excludes patients who deviate from protocol" }
    status: unverified
    tags: [high-yield]
  - id: res.L07.070
    kind: card
    topic: itt
    front: What is per-protocol analysis?
    back: It excludes patients who deviate from the protocol, analysing only those who adhered.
    src: { page: 69, quote: "Intention-to-treat analysis: all study participants are included in the analyses as part of the groups to which they were randomized regardless of whether they completed the study or not\nPer protocol analysis: excludes patients who deviate from protocol" }
