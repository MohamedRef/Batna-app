        quote: "Patients who have antiphospholipid-antibody syndrome may experience\nsudden adrenal infarction and pricepits acute onset of an addisonian crisis."
        title: "الروماتيزم بيأثر على الغدد"
        text: |
          - **systemic lupus erythematosus (SLE)**: ==hyperprolactinaemia== شائعة.
          - **rheumatoid arthritis (RA)**: الـ hypothalamic–pituitary axis غالبًا dysfunctional، بس نادرًا لدرجة إنه يحتاج replacement.
          - RA و SLE و scleroderma بييجوا مع **autoimmune thyroid** (Graves'، Hashimoto's). ليه؟ لأنهم كلهم autoimmune، والجسم اللي بيعمل antibodies ضد مفاصله بيعملها ضد غدته كمان، فخلي عينك على الـ thyroid.
          - ==Antiphospholipid syndrome (APS)==: الدم بيتجلط بسهولة، فممكن **adrenal infarction** مفاجئ يعمل **addisonian crisis**.
          - أغلب أمراض الروماتيزم بتعمل **secondary osteoporosis**، والكتاب بيقول oestrogen، **إلا** لو hypercoagulable (زي APS) أو خطر عالي لسرطان الثدي أو الرحم. والسبب إن الـ oestrogen نفسه بيزوّد الـ clotting (ص 44).
