      - kind: explain
        page: 185
        quote: "It slows the decline and in some patients halted the decline of FVC and improved progression-free survival."
        title: "الاتنين بيعملوا إيه فعلًا؟"
        text: |
          - **Nintedanib** (Ofev): بيقفل الـ receptors، فالـ signaling اللي الـ fibroblast محتاجه عشان **proliferation و migration و transformation** بيقف. الـ FDA وافق عليه **2014**. أكتر حاجة بتخلي المرضى يوقفوه: **diarrhea، nausea، vomiting**.
          - **Pirfenidone** (Esbriet): anti-inflammatory و antioxidant و antifibrotic، والـ mechanism **مش مفهوم بالكامل**. بيبطّأ نزول الـ ==FVC==، وفي بعض المرضى بيوقفه، وبيحسّن الـ **progression-free survival**. برضه FDA **2014**.

          خد بالك من الكلمة: **بيبطّأ**، مش بيرجّع الرئة زي ما كانت. ليه؟ لأن الندبة اللي اتعملت خلاص اتعملت؛ الدوا بيمنع ندبة جديدة.
