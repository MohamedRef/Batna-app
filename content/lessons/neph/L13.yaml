  - id: neph.L13.lesson3
    title: "Screening: امتى، إزاي، وامتى تشك في حاجة تانية"
    hook: "Albuminuria واحدة مش تشخيص، ومريض سكر من غير retinopathy يستاهل نظرة تانية."
    minutes: 9
    pages: [431, 437]
    topics: [screening, alternative, risk, biomarkers]
    goals:
      - "تعرف مواعيد الـ screening وطرقه والأرقام"
      - "تعدّ أسباب الـ false-positive ACR والـ red flags لتشخيص تاني"
      - "تعدّ الـ risk factors والـ biomarkers الجديدة"
    status: unverified
    steps:
      - kind: explain
        page: 431
        title: "امتى نبدأ؟"
        quote: "Annually screening for DKD is recommended from the time of diagnosis of T2DM and 5 years after the onset of T1DM."
        text: |
          ==Annually==:
          - **T2DM:** من يوم التشخيص.
          - **T1DM:** بعد **5 سنين** من البداية.

          ليه الفرق؟ الـ T2DM غالبًا بيبقى موجود سنين قبل ما يتشخّص، فممكن الكلية تكون اتأثرت. أما الـ T1DM بدايته معروفة بالظبط. (ده تفسير، والمواعيد من الكتاب.)
      - kind: explain
        page: 431
        title: "إزاي؟"
        quote: "Timed (four-hour or overnight) collection; or measurement of the albumin/creatinine ratio in a random spot collection."
        text: |
          تلات طرق للـ microalbuminuria:
          1. **24-hour collection** مع creatinine (وتاخد creatinine clearance مع بعض)
          2. **Timed** (4 ساعات أو overnight)
          3. ==ACR on a random spot sample==

          والـ dipstick **مش بيشوف** الـ microalbuminuria.
      - kind: table
        page: 432
        quote: "must be abnormal (30 mg albumin per g creatinine to 300 mg albumin per g creatinine) before diagnosis of microalbuminuria can be made."
        title: "الأرقام"
        columns: [Test, Micro, Macro]
        rows:
          - ["24-hour urine", "30-300 mg/24 h", ">300 mg/24 h"]
          - ["Spot ACR", "30-300 mg/g", ">300 mg/g"]
          - ["Timed urine", "20-200 mcg/min", ">200 mcg/min"]
        hide: [[1, 1], [1, 2], [2, 1]]
      - kind: aside
        tone: exam
        page: 432
        quote: "Macroalbuminuria (more than 300 mg per g) on a single sample can confirm diagnosis in the absence of complicating factors."
        text: |
          - **Micro:** لازم ==2 من 3== عينات في **3-6 شهور** (لأن الـ albumin excretion بيتغير).
          - **Macro (>300):** عينة **واحدة** كفاية لو مفيش complicating factors.

          ومعاهم **creatinine** و **eGFR بالـ CKD-EPI** (κ = 0.7 ستات، 0.9 رجالة). والـ **cystatin C** أدق من الـ creatinine.
      - kind: sort
        page: 437
        quote: "Absence of diabetic retinopathy Low or rapidly decreasing GFR More than 30% reduction in GFR within two to three months"
        prompt: "صنّف: ده بيعمل ACR غلط (false positive) مؤقت، ولا red flag لتشخيص تاني غير DKD؟"
        bins: ["Falsely abnormal ACR", "Think of another diagnosis"]
        cards:
          - { text: "Exercise within 24 hours", bin: 0 }
          - { text: "Fever or infection", bin: 0 }
          - { text: "Menstruation", bin: 0 }
          - { text: "Heart failure", bin: 0 }
          - { text: "No diabetic retinopathy", bin: 1 }
          - { text: "Active urinary sediment", bin: 1 }
          - { text: "GFR falls >30% within 2-3 months of ACEi", bin: 1 }
          - { text: "Rapidly rising proteinuria", bin: 1 }
        why: "الأولى حاجات مؤقتة بتعلّي الـ albumin (كرّر التحليل بعدها). التانية بتقول إن المرض نفسه ممكن ميكونش DKD: الـ DKD بيمشي ببطء ومعاه retinopathy، فالـ sediment النشط أو الوقوع السريع يستاهلوا biopsy."
      - kind: reveal
        page: 437
        quote: "Absence of diabetic retinopathy Low or rapidly decreasing GFR More than 30% reduction in GFR within two to three months"
        prompt: "ليه غياب الـ retinopathy يخليك تشك؟"
        answer: "الـ DKD والـ retinopathy الاتنين **microvascular** وبيمشوا سوا عادة. لو الكلية بايظة والعين سليمة، يبقى ممكن السبب حاجة تانية غير السكر. (تفسير؛ الـ red flag نفسه من الكتاب ص 437.)"
      - kind: explain
        page: 433
        title: "Risk factors"
        quote: "Obesity, Metabolic syndrome, Poor glycemic control, Hypertension, AKI, Smoking of cigarettes, Dyslipidemia, Sedentary lifestyle, High salt intake,"
        text: |
          **Non-modifiable:** genetics، **male sex**، older age، بداية السكر بين **5-15 سنة**، family history، **insulin resistance**، ethnicity.

          **Modifiable:** obesity، metabolic syndrome، ==poor glycemic control==، **hypertension**، **AKI**، smoking، dyslipidemia، sedentary lifestyle، **high salt intake**.
      - kind: check
        page: 433
        quote: "Obesity, Metabolic syndrome, Poor glycemic control, Hypertension, AKI, Smoking of cigarettes, Dyslipidemia, Sedentary lifestyle, High salt intake,"
        question: "Which DKD risk factor is modifiable?"
        options:
          - "High salt intake"
          - "Male sex"
          - "Insulin resistance"
          - "Diabetes onset between 5 and 15 years"
        answer: 0
        why:
          - "صح: ده modifiable."
          - "non-modifiable."
          - "الكتاب حاططها non-modifiable."
          - "non-modifiable."
      - kind: explain
        page: 433
        title: "ليه نحتاج biomarkers جديدة؟"
        quote: "significant glomerular damage has already occurred by the time albuminuria is apparent."
        text: |
          - لما الـ albuminuria تظهر، يبقى فيه ==glomerular damage== كبير حصل خلاص.
          - والـ GFR ممكن يقع **من غير** albuminuria.

          **Non-albumin proteinuria:** α-1 microglobulin، β-2 microglobulin، IgG، cystatin C، nephrin، transferrin، MMP-9، TIMP-1.
      - kind: match
        page: 436
        quote: "In DM podocyte dysfunction is present. DN is considered a podocytopathy. Injury of the slit diaphragm leads to nephrinuria."
        prompt: "وصّل الـ biomarker بمعناه:"
        pairs:
          - ["Nephrin", "Slit diaphragm injury (podocytopathy)"]
          - ["Type IV collagen", "GBM and mesangial matrix"]
          - ["Transferrin, ceruloplasmin, IgG", "Rise before microalbuminuria in T2DM"]
          - ["MicroRNAs", "~22 nucleotides, gene silencing"]
        why: "الـ nephrin جزء من الـ slit diaphragm، والـ collagen IV من الـ GBM والـ mesangium، فخروجهم في البول بيقول مين اتأذى. والـ metabolomics بيقيس metabolites أصغر من 1,500 Da."
      - kind: try
        items: [neph.L13.035, neph.L13.038, neph.L13.050, neph.L13.051, neph.L13.056]
    recap:
      - "Screening سنوي: T2DM من التشخيص، T1DM بعد 5 سنين. ACR + creatinine + CKD-EPI."
      - "Micro 30-300 (2 من 3 في 3-6 شهور)، macro >300 عينة واحدة. Timed: 20-200 mcg/min."
      - "False ACR: CHF، exercise، fever، infection، hyperglycemia، menstruation."
      - "Red flags: no retinopathy، GFR بيقع، >30% بعد ACEi، active sediment، rapid proteinuria، refractory HTN، systemic disease."
      - "Biomarkers: nephrin (podocyte)، collagen IV، transferrin، microRNAs، metabolomics."
