  - id: dm.L04.lesson2
    title: "قوة الدوا: على السكر وعلى الوزن"
    hook: "مش كل الأدوية قد بعض. فيه دوا بينزّل الـ A1C والوزن مع بعض، وفيه دوا مش بيحرّك الميزان خالص."
    minutes: 7
    pages: [40, 41]
    topics: [efficacy]
    goals:
      - "ترتّب الأدوية حسب قوتها على السكر"
      - "ترتّبها حسب قوتها على الوزن"
      - "تعرف ليه الـ combination therapy"
    status: unverified
    steps:
      - kind: explain
        page: 40
        title: "البداية"
        quote: "Glycemic Management: Choose approaches that provide the efficacy to achieve goals:\n  Metformin OR Agent(s) including COMBINATION therapy that provide adequate EFFICACY to achieve and maintain treatment goals\n  Consider avoidance of hypoglycemia a priority in high-risk individuals\nIn general, higher efficacy approaches have greater likelihood of achieving glycemic goals. Efficacy for glucose lowering:\n  Very High: Dulaglutide (high dose), Semaglutide, Tirzepatide; Insulin; Combination Oral, Combination Injectable (GLP-1 RA/Insulin)\n  High: GLP-1 RA (not listed above), Metformin, SGLT2i, Sulfonylurea, TZD\n  Intermediate: DPP-4i"
        text: |
          **Metformin** أو أي دوا (أو ==combination==) قوته كفاية توصّل للهدف وتحافظ عليه.

          وفي الـ high-risk: تجنّب الـ **hypoglycemia** أولوية.

          ليه الـ metformin هو الاسم الوحيد اللي متكتب كبداية؟ التفسير المقبول (مش في الكتاب): رخيص، قوي (high efficacy)، ما بيعملش hypoglycemia لوحده، ومش بيزوّد الوزن، وبيقفل حنفية الكبد اللي هي أهم سبب للـ fasting hyperglycemia (المحاضرة الأولى). وليه الـ hypo أولوية في الـ high risk؟ لأن الـ hypoglycemia بتعمل adrenaline وتسرّع القلب، وده خطر على قلب تعبان أصلًا.
      - kind: figure
        page: 40
        quote: "Achievement and Maintenance of Weight Management Goals:\n  Set individualized weight management goals\n  General lifestyle advice: medical nutrition therapy/eating patterns/physical activity\n  Intensive evidence-based structured weight management program\n  Consider medication for weight loss\n  Consider metabolic surgery\nWhen choosing glucose-lowering therapies:\n  Consider regimen with high-to-very-high dual glucose and weight efficacy\nEfficacy for weight loss:\n  Very High: Semaglutide, Tirzepatide\n  High: Dulaglutide, Liraglutide\n  Intermediate: GLP-1RA (not listed above), SGLT2i\n  Neutral: DPP-4i, Metformin"
        title: "سلّمين: السكر والوزن"
