        title: "Treatment: weight loss"
        text: |
          جدول الكتاب جمع دراسات بـ 4 طرق مختلفة لنزول الوزن:

          - **Diet** لوحده
          - **Diet + exercise**
          - **Orlistat** (و sibutramine/orlistat)
          - **Surgery**

          النتيجة: الـ ALT اتحسّن في كل الدراسات تقريبًا، والـ histology اتحسّنت في أغلب الدراسات اللي قاستها.

          يعني الطريقة مش هي المهمة، المهم إن ==weight loss== يحصل فعلًا. والكتاب في الـ conclusions بيسمي الـ diet والـ lifestyle modification الـ main options.
