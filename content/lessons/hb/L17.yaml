  - id: hb.L17.lesson2
    title: "Bismuth والصفار اللي مابيوجعش"
    hook: "عيان أصفر ومش حاسس بأي وجع؟ ده مش خبر حلو خالص. تعالى نعرف ليه."
    minutes: 8
    pages: [322, 325]
    topics: [classification, clinical]
    goals:
      - "تقسم الـ cholangiocarcinoma بالـ ILCA وتعرف الـ AJCC بيقيس إيه"
      - "ترسم Bismuth-Corlette من 1 لـ 4 وتفرّق 3a من 3b من غير لخبطة"
      - "تعرف الـ presentation بالنسب، وإمتى تشوف Courvoisier's sign"
    status: unverified
    steps:
      - kind: explain
        page: 322
        title: "تلات تقسيمات، كل واحد بيرد على سؤال"
        text: |
          - **International Liver Cancer Association:** قسّمها **iCCA** و **pCCA** و **dCCA**، والـ iCCA هي اللي طالعة **جوه الـ liver parenchyma**. (ده سؤال «فين؟»)
          - **AJCC TNM (8th edition):** بيقيس **T** (حجم وامتداد الورم)، **N** (regional lymph nodes) و **M** (distant metastases). وممكن يتضاف nonanatomic factors زي **grade** و **biomarkers**. (ده سؤال «قد إيه انتشر؟»)
          - **Bismuth-Corlette:** للـ **hilar** بس، وبيوصف الورم ماسك قنوات قد إيه. (ده سؤال «الجرّاح هيشيل إيه؟»)

          وكمان **staging laparoscopy** بتتعمل في اللي شكلهم resectable، علشان تكشف **peritoneal** أو **superficial liver metastases** اللي الـ imaging ممكن يفوّتها.
      - kind: figure
        page: 323
        title: "Bismuth-Corlette في صورة واحدة"
        alt: "Five small diagrams of the hilar bile duct confluence shaped like a Y, with the right hepatic duct on the left of each drawing and the left hepatic duct on the right. Type 1: tumour on the common hepatic duct below the confluence. Type 2: tumour at the confluence only. Type 3a: confluence plus right hepatic duct. Type 3b: confluence plus left hepatic duct. Type 4: confluence plus both ducts, or multicentric."
        caption: "زي حرف **Y**: النوع 1 تحت المفرق، 2 على المفرق، 3a بيطلع **يمين**، 3b بيطلع **شمال**، و 4 الاتنين (أو multicentric)."
