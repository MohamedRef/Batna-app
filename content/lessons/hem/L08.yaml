  # Split from lesson5 on 2026-11-13 (#828): MBL and treatment.
  - id: hem.L08.lesson9
    title: "الـ MBL وعلاج الـ CLL"
    hook: "مش كل clone محتاج اسم مرض، ومش كل CLL محتاج علاج النهارده."
    minutes: 8
    pages: [131, 132]
    topics: [mbl, cll-treatment]
    goals:
      - "تعرّف الـ MBL وتفرّقه عن الـ CLL"
      - "تعرف امتى نراقب وامتى نعالج وليه"
      - "تحفظ اختيارات العلاج والمضاعفات بالترتيب"
    status: unverified
    steps:
      - kind: explain
        page: 131
        title: "الـ MBL: قبل الـ CLL"
        quote: "Is defined as the presence of less than 5000/dl of monoclonal B-lymphocytes in the peripheral blood, in the absence of lymphadenopathy, splenomegaly, cytopenias or disease, related symptoms. MBL, represents either a precursor state for CLL, or a distinct entity. MBL could be detected in 5% of subjects (Aged 60-80years) with normal WBC count, MBL may progress to frank CLL, at a rate of 1-2% per year of interest too is that the 13q14 deletion, which characterizes benign cases of CLL is often seen in MBL."
        text: |
          ==Monoclonal B-cell lymphocytosis==: **أقل من 5,000/µL** monoclonal B cells في الدم، **من غير** غدد، طحال، cytopenias أو أعراض.

          - موجود في **5%** من الناس 60–80 سنة بـ white blood cell (WBC) طبيعي.
          - بيتحول CLL بمعدل **1–2% في السنة**.
          - غالبًا فيه ==13q14 deletion== (اللي بتميّز الحالات الـ benign).

          ليه ده مهم في العيادة؟ التفسير المقبول (مش في الكتاب): عيان كبير عنده monoclonal B cells قليلة ومفيش أي حاجة تانية، لو سميته CLL هتقلقه على الفاضي. الأغلبية الكبيرة (98–99% في السنة) ما بتتحولش، فالمتابعة بالتحاليل كفاية.
      - kind: check
        page: 131
        quote: "MBL may progress to frank CLL, at a rate of 1-2% per year"
        question: "A 70-year-old has 3,000/µL monoclonal B cells, no nodes, no spleen, normal counts. Best label?"
        options:
          - "Monoclonal B-cell lymphocytosis"
          - "CLL Rai stage 0"
          - "Prolymphocytic leukemia"
          - "Reactive lymphocytosis"
        answer: 0
        why:
          - "صح: أقل من 5,000 monoclonal B cells من غير غدد ولا طحال ولا cytopenias."
          - "الـ CLL محتاجة أكتر من 5,000."
          - "الـ PLL WBC فوق 100,000 وطحال ضخم."
          - "الخلايا monoclonal، فمش reactive."
      - kind: check
        page: 131
        quote: "It is traditional to delay treatment of early-stage CLL until the disease progresses. Early treatment does not prolong survival , treatment of Rai stages III and IV is recommended because of the poor survival of these patients."
        question: "Asymptomatic CLL, Rai 0, lymphocytes 12,000. Book plan?"
        options:
          - "Observe until progression"
          - "Chlorambucil now"
          - "Fludarabine now"
          - "IV immunoglobulin monthly"
        answer: 0
        why:
          - "صح: الـ early stage بيتراقب، والعلاج المبكر ما بيطوّلش العمر."
          - "الـ chlorambucil لما المرض يتقدم أو Rai III–IV."
          - "الـ fludarabine برضه للي محتاج علاج."
          - "الـ intravenous immunoglobulin (IVIG) للـ infections، مش وقاية روتينية."
      - kind: figure
        page: 131
        quote: "It is traditional to delay treatment of early-stage CLL until the disease progresses. Early treatment does not prolong survival , treatment of Rai stages III and IV is recommended because of the poor survival of these patients."
        title: "تراقب ولا تعالج؟"
        alt: "A decision diagram: after CLL is diagnosed, early stage is watched until it progresses, while Rai stage III or IV is treated because of poor survival, with chlorambucil first, steroids if autoimmune haemolysis, then COP, fludarabine, pentostatin, plus antibiotics and immunoglobulin for complications."
        caption: "الـ ==early stage== بيتراقب. الـ **Rai III و IV** بيتعالجوا، والـ chlorambucil أول دوا."
        svg: |
          <svg viewBox="0 0 330 280" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="L08e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="fg-head"/></marker></defs>
            <rect x="85" y="8" width="160" height="40" rx="10" class="fg-box"/>
            <text x="165" y="33" text-anchor="middle" class="t-sm t-b">CLL diagnosed</text>
