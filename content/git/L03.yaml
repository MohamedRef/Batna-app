        question: What next?
        options: [Ambulatory pH or impedance-pH off PPI for at least 7 days, Increase PPI to four times daily, Fundoplication, Start a TCA now]
        answer: 0
        why: A normal EGD after a failed PPI trial leads to reflux testing off PPI for 7 days or more.
      - reveal: "Acid exposure time normal; symptom association negative. Manometry normal."
        question: Diagnosis and treatment?
        options: [Functional heartburn; reassurance and a pain modulator, Reflux hypersensitivity; PPI, NERD; titrate PPI, Achalasia; pneumatic dilation]
        answer: 0
