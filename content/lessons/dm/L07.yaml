  - id: dm.L07.lesson3
    title: "الاختبارات الخمسة على السرير"
    hook: "ECG وجهاز ضغط ومانومتر وقبضة إيد: كل الأرقام اللي بيسألوا عليها في صفحة واحدة."
    minutes: 10
    pages: [81, 84]
    topics: [tests]
    goals:
      - "تعدّ الـ 5 reflex tests"
      - "تحفظ الـ cut-off لكل اختبار"
      - "تفسر نتايج عيان حقيقي"
    status: unverified
    steps:
      - kind: explain
        page: 82
        title: "الخمسة"
        quote: "Five simple noninvasive cardiovascular reflex tests:"
        text: |
          **Five simple noninvasive cardiovascular reflex tests:**
          1. **Valsalva maneuver**
          2. **HR response to deep breathing**
          3. **HR response to standing up**
          4. **BP response to standing up**
          5. **BP response to sustained handgrip**

          والـ **HRV** بيتحلل بطريقتين: ==time-domain== (إحصاء الـ R-R intervals) أو ==frequency-domain== (spectral analysis).
      - kind: mnemonic
        page: 82
        quote: "Valsalva maneuver,"
        word: "VDSSH"
        parts:
          - { key: "V", text: "Valsalva: longest/shortest R-R >1.2" }
          - { key: "D", text: "Deep breathing: HR difference >15, I/E >1.17" }
          - { key: "S", text: "Standing HR: 30:15 >1.03" }
          - { key: "S", text: "Standing SBP: fall <10 normal, >30 abnormal" }
          - { key: "H", text: "Handgrip: diastolic rise >16" }
        hook: "**V-D-S-S-H**: «ڤي دي إس إس إتش»، تلاتة للنبض (V، D، S) واتنين للضغط (S، H)."
      - kind: explain
        page: 82
        title: "Resting HR و deep breathing"
        quote: "a difference in heart rate of > 15 beats/min is normal, and < 10 beats/min is abnormal."
        text: |
          - **Resting HR >100** = abnormal
          - **Deep breathing**: supine، **6 breaths/min**، على ECG
          - فرق الـ HR: **>15** normal، و **<10** ==abnormal==
          - ونسبة **R-R inspiration/expiration >1.17**
      - kind: reveal
        page: 82
        quote: "a difference in heart rate of > 15 beats/min is normal, and < 10 beats/min is abnormal."
        prompt: "ليه النبض الطبيعي بيتغير مع النَفَس أصلًا؟"
        answer: |
          مع الشهيق الـ **vagus** بيتثبط فالنبض يسرع، ومع الزفير يرجع الـ vagal tone فالنبض يبطأ (**sinus arrhythmia**).

          ده اختبار للـ **parasympathetic**. لما الـ vagus يموت، الفرق يختفي وتبقى أقل من **10 beats/min**.
      - kind: explain
        page: 83
        title: "الوقوف: 30:15"
        quote: "The 30:15 ratio is normally > 1.03."
        text: |
          على ECG، قيس الـ **R-R** عند الضربة **15** والضربة **30** بعد الوقوف.

          الطبيعي: **tachycardia** الأول (R-R قصير عند 15)، وبعدين **reflex bradycardia** (R-R أطول عند 30).

          ==30:15 ratio >1.03== = normal.
      - kind: explain
        page: 83
        title: "Valsalva"
        quote: "The ratio of the longest R-R to the shortest R-R should be > 1.2."
        text: |
          ينفخ في مانومتر لحد **40 mmHg** لمدة **15 s** على ECG.

          الطبيعي: **tachycardia** و vasoconstriction أثناء النفخ، وبعد ما يسيب **overshoot bradycardia** والضغط يعلى.

          ==Longest R-R ÷ shortest R-R >1.2==.
      - kind: table
        page: 83
        quote: "borderline is a fall of 10-29 mmHg, and abnormal is a fall of > 30 mmHg with symptoms."
        title: "SBP بعد دقيقتين وقوف"
        columns: [Response, SBP fall]
        rows:
          - ["Normal", "<10 mmHg"]
          - ["Borderline", "10–29 mmHg"]
          - ["Abnormal", ">30 with symptoms"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: explain
        page: 84
        title: "Handgrip و QTc"
        quote: "The normal response for diastolic blood pressure is a rise of > 16 mmHg in the other arm"
        text: |
          **Handgrip:** يحدد أقصى قبضة، وبعدين يقبض على **30%** منها لمدة **5 min**. الطبيعي إن الـ ==diastolic BP يعلى >16 mmHg== في الدراع التاني.

          **QTc** لازم يكون ==<440 ms==.
      - kind: table
        page: 84
        quote: "After standing R-R 30:15→>1.03"
        title: "ملخص الأرقام"
        columns: [Test, Normal]
        rows:
          - ["Rest HR", "≤100"]
          - ["Deep breath", "I/E >1.17"]
          - ["Standing", "30:15 >1.03"]
          - ["Valsalva", ">1.2"]
          - ["SBP stand", "fall <10"]
          - ["Handgrip", "DBP rise >16"]
          - ["QTc", "<440 ms"]
        hide: [[1, 1], [2, 1], [3, 1], [5, 1], [6, 1]]
      - kind: aside
        tone: trap
        page: 84
        quote: "Valsalva man.: Breath 40mm for 15 s, Longest R-R /shortest R-R should be"
        text: "صفحة الملخص كاتبة الـ Valsalva «**> 1.22**» وصفحة 83 كاتبة «**> 1.2**». الرقم الأساسي في الكتاب **1.2**، والـ 1.22 غالبًا typo."
      - kind: case
        page: 83
        quote: "The ratio of the longest R-R to the shortest R-R should be > 1.2."
        stem: "Type 1 diabetic, 52 y. Resting HR 96. Deep breathing difference 8 bpm. 30:15 ratio 1.01. Valsalva ratio 1.25. SBP fall on standing 14 mmHg."
        steps:
          - question: "Which tests are abnormal?"
            options: ["Deep breathing and 30:15", "Valsalva and SBP", "Resting HR only", "None"]
            answer: 0
            why: "8 أقل من 10 = abnormal، و 1.01 مش أكبر من 1.03 = abnormal. الـ Valsalva 1.25 طبيعي، والـ SBP 14 borderline، والـ HR 96 أقل من 100."
          - question: "Diagnosis?"
            options: ["CAN", "No CAN", "Borderline only", "Orthostatic hypotension"]
            answer: 0
            why: "Two abnormal tests = CAN."
      - kind: check
        page: 83
        quote: "The ratio of the longest R-R to the shortest R-R should be > 1.2."
        question: "Valsalva: longest R-R 0.88 s, shortest 0.80 s. Result?"
        options: ["Abnormal (1.1)", "Normal (1.1)", "Normal (0.91)", "Abnormal (0.91)"]
        answer: 0
        why:
          - "صح: 0.88 ÷ 0.80 = 1.1، أقل من 1.2."
          - "الطبيعي أكبر من 1.2."
          - "النسبة longest على shortest، مش العكس."
          - "النسبة longest على shortest، مش العكس."
      - kind: try
        items: [dm.L07.043, dm.L07.047, dm.L07.051, dm.L07.053, dm.L07.057]
    recap:
      - "5 tests: Valsalva، deep breathing، standing HR، standing BP، handgrip (VDSSH)."
      - "Rest HR >100 abnormal. Deep breathing: >15 normal، <10 abnormal، I/E >1.17."
      - "30:15 >1.03. Valsalva 40 mmHg × 15 s: >1.2."
      - "SBP بعد 2 min: <10 normal، 10–29 borderline، >30 abnormal. Handgrip 30% × 5 min: DBP >16. QTc <440."
    practice: [dm.L07.042, dm.L07.043, dm.L07.044, dm.L07.045, dm.L07.046, dm.L07.047, dm.L07.048, dm.L07.049, dm.L07.050, dm.L07.051, dm.L07.052, dm.L07.053, dm.L07.054, dm.L07.055, dm.L07.056, dm.L07.057, dm.L07.058, dm.L07.059, dm.L07.060, dm.L07.061, dm.L07.080, dm.L07.083, dm.L07.084]
