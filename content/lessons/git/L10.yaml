      - kind: explain
        remind: [git.L10.066]
        page: 280
        quote: "Manometric study: a variety of defining features have been proposed including uncoordinated (\"spastic\") activity in the distal esophagus, spontaneous and repetitive contractions (> 2 peaks), or high amplitude contractions (> 180 mmHg) and prolonged contractions (> 6 sec)."
        title: "الـ manometry في الـ DES"
        text: |
          افتكر الطبيعي: 30-180 mmHg، 2-6 ثواني، single peak. الـ DES بيعدّي كل ده:
          - **Uncoordinated (spastic)** activity في الـ distal esophagus.
          - **Repetitive** contractions: ==more than 2 peaks==.
          - **High amplitude**: ==more than 180 mmHg==.
          - **Prolonged**: ==more than 6 seconds==.

          يعني الـ DES عكس الـ achalasia type I: هناك مفيش انقباض، وهنا انقباض زيادة وكتير ومن غير نظام. والـ chest pain بييجي من العضلة المتشنجة نفسها، وعلشان كده ممكن يتلخبط مع ذبحة القلب، فاستبعد القلب الأول.
      - kind: check
        page: 280
        quote: "Manometric study: a variety of defining features have been proposed including uncoordinated (\"spastic\") activity in the distal esophagus, spontaneous and repetitive contractions (> 2 peaks), or high amplitude contractions (> 180 mmHg) and prolonged contractions (> 6 sec)."
        question: "Which manometric finding is one of the book's defining features of DES?"
        options:
          - "Repetitive contractions with more than 2 peaks"
          - "Amplitude of 30–180 mmHg"
          - "Duration of 2–6 seconds"
          - "Absent contractions in the distal esophagus"
        answer: 0
