  - id: rheum.L01.lesson6
    title: "أسامي الـ cytokines وطباعهم الخمسة"
    hook: "ليه اسم TNF «بيموّت الأورام» وهو أكتر حاجة بتهد مفصل الـ RA؟ الأسامي قديمة، والطباع هي اللي بتهم."
    minutes: 8
    pages: [4, 5]
    topics: [naming, attributes]
    goals:
      - "تعرف الـ cytokines اتسمّت إزاي، وليه الأسامي مُضلّلة"
      - "تحفظ الخمس functional attributes بمثال من رسمة الكتاب"
      - "تفهم ليه الـ redundancy والـ pleiotropy بيفرقوا في العلاج"
    status: unverified
    steps:
      - kind: explain
        remind: [rheum.L01.014]
        page: 4
        quote: "Lymphokines – Cytokines such as interleukin-2 (IL-2) and interferon-γ (IFN- γ), produced by lymphocytes."
        title: "الأسامي جاية منين؟"
        text: |
          الكتاب بيعد 8 أسامي: monokine، lymphokine، colony-stimulating factor (CSF)، interleukin، interferon، tumour necrosis factor (TNF)، growth factor، chemokine.

          - **على حسب الخلية اللي عملتها**: ==lymphokines== من الـ lymphocytes (IL-2، IFN-γ)، و **monokines** من الـ monocytes (TNF-α).
          - **على حسب أول حاجة اتشافت بيها**: **TNF** عشان قتلت cancer cell lines، و **CSF** عشان خلت الـ leukocytes تكبر in vitro في colonies.
      - kind: explain
        page: 4
        quote: "Tumor necrosis factor (TNF) – Cytokines exhibited cytotoxic effects on some cancer cell lines."
        title: "ليه الأسامي مُضلّلة؟"
        text: |
          الكتاب بيقسم الأسامي لطريقتين، والاتنين **تاريخيين**:

          - **على حسب الخلية اللي عملته**: lymphokine و monokine. المشكلة إن نفس الـ cytokine بيتعمل من خلايا كتير (صفحة 1: أي nucleated cell)، فالاسم بيوصف أول خلية اتشاف منها بس.
          - **على حسب أول تأثير اتشاف**: ==TNF== اتسمى كده عشان قتل cancer cell lines في المعمل، و **CSF** عشان خلّى الـ leukocytes تكبر في **colonies** على الطبق.

          يعني الاسم بيحكيلك **قصة الاكتشاف**، مش الشغلانة الأساسية. عشان كده TNF-α في الكتاب ده أشهر دوره الالتهاب في الـ RA (صفحة 20)، مش قتل الأورام.
      - kind: check
        page: 4
        quote: "Monokines – Cytokines such as tumor necrosis factor-α (TNF-α) produced by monocytes."
        question: "Per the book, a monokine is a cytokine named for which feature?"
        options: ["The cell that produces it (monocytes)", "The first biological effect discovered", "Its molecular weight", "The receptor family it binds"]
        answer: 0
        why:
          - "صح: monokine = من الـ monocytes، ومثال الكتاب TNF-α."
          - "التسمية بأول تأثير اتشاف هي TNF و CSF، مش monokine."
          - "الوزن الجزيئي مش أساس أي اسم من الأسامي التمانية."
          - "تصنيف الـ receptors ده موضوع صفحة 12، مش الأسامي."
      - kind: mnemonic
        page: 5
        quote: "Pleiotropic action: A given cytokine that has different biological effects on different target cells."
        word: "PRSAC"
        hook: "«Please Remember Some Awesome Cytokines»: الخمس attributes بالترتيب."
        parts:
          - { key: "P", text: "Pleiotropy: cytokine واحد، تأثيرات مختلفة على خلايا مختلفة" }
          - { key: "R", text: "Redundancy: أكتر من cytokine بيعملوا نفس الشغلانة" }
          - { key: "S", text: "Synergism: الاتنين مع بعض أقوى من مجموعهم" }
          - { key: "A", text: "Antagonism: واحد بيلغي تأثير التاني" }
          - { key: "C", text: "Cascade induction: cytokine يخلي الخلية تطلع cytokines تانية، وهكذا" }
      - kind: figure
        page: 5
        quote: "Pleiotropic action: A given cytokine that has different biological effects on different target cells."
        title: "الخمس طباع في رسمة واحدة"
        alt: "Five small panels. Pleiotropy: one cytokine with arrows to three different cells. Redundancy: three cytokines with arrows to one effect. Synergy: two cytokines joining into one large effect. Antagonism: one cytokine arrow blocked by a bar from another. Cascade: a chain of cells each releasing a new cytokine."
        caption: "Pleiotropy = واحد لكتير. Redundancy = كتير لواحد. Synergy = اتنين بيكبّروا بعض. Antagonism = واحد بيقفل التاني. Cascade = كل خلية بتسلّم اللي بعدها."
