  - id: neph.L05.lesson2
    title: "قبل، جوّه، ولا بعد الكلية؟"
    hook: "كل AKI ليه عنوان: قبل الكلية، جوّاها، أو بعدها. البول والـ indices هيقولولك العنوان."
    minutes: 10
    pages: [103, 110]
    topics: [etiology, complications, workup, indices]
    goals:
      - "تصنّف سبب الـ AKI لـ prerenal أو intrinsic أو postrenal"
      - "تفرّق prerenal عن ATN بالـ urine indices"
      - "تقرا الـ urinary sediment وتعرف الـ imaging المناسب"
    status: unverified
    steps:
      - kind: explain
        page: 103
        title: "تلات عناوين"
        quote: "Hypoperfusion in which the integrity of renal parenchyma is preserved"
        text: |
          - **Prerenal:** ==hypoperfusion== والنسيج سليم.
          - **Intrinsic:** الضرر في ==renal parenchyma== نفسه.
          - **Postrenal:** ==acute obstruction== لسريان البول.
      - kind: explain
        page: 105
        title: "Prerenal"
        quote: "Prerenal AKI: is characterized by reduced blood delivery to the kidney"
        text: |
          الدم اللي واصل للكلية **قليل**:
          - **Volume depletion:** نزيف، جفاف، GI losses.
          - **Effective volume ↓:** CHF، MI، hypotension، liver failure، sepsis.
          - **Functional:** ACEIs، **NSAIDs**، ARBs، cyclosporine و tacrolimus.

          صلّح الـ volume بسرعة ترجع الكلية ==طبيعية==، لأن مفيش structural damage. لو اتأخرت، ممكن تتحول لـ intrinsic.
      - kind: explain
        page: 105
        title: "Intrinsic"
        quote: "Acute tubular necrosis (ATN) (it accounts for 40% of all cases of AKI)"
        text: |
          - **Vascular:** renal thrombosis.
          - **Glomerular:** RPGN.
          - ==ATN== (40% من كل الـ AKI): ischemia (hypotension، sepsis)، endogenous toxins (uric acid، hemoglobin، myoglobin)، exogenous toxins (aminoglycosides، **contrast**، amphotericin B).
          - **Acute interstitial nephritis:** NSAIDs، infections.
      - kind: explain
        page: 106
        title: "Postrenal"
        quote: "Postrenal AKI accounts for less than 10% of cases of AKI"
        text: |
          ==أقل من 10%== من الـ AKI:
          - **Bladder outlet:** BPH، prostate cancer، **anticholinergic drug**.
          - **Ureteral:** malignancy.
          - **Pelvic / renal** obstruction.

          فكّها بسرعة ترجع الوظيفة.
      - kind: sort
        page: 104
        quote: "Classification of AKI (ARF)"
        prompt: "حط كل سبب AKI في عنوانه (classification):"
        bins: ["Prerenal", "Intrinsic", "Postrenal"]
        cards:
          - { text: "Cyclosporine", bin: 0 }
          - { text: "Liver failure", bin: 0 }
          - { text: "Rhabdomyolysis", bin: 1 }
          - { text: "Malignant hypertension", bin: 1 }
          - { text: "Amphotericin B", bin: 1 }
          - { text: "Benign prostatic hypertrophy", bin: 2 }
          - { text: "Obstruction of a solitary kidney", bin: 2 }
        why: "الـ cyclosporine بيبوّظ الـ autoregulation والـ liver failure بيقلل الـ effective volume، يبقوا prerenal. الـ rhabdo والـ amphotericin بيضربوا الـ tubules، والـ malignant HT بيضرب الأوعية، فالتلاتة intrinsic. والـ BPH والـ solitary kidney المسدودة postrenal."
      - kind: table
        page: 106
        quote: "Uremia Hypervolemia and Hypovolemia Hyponatremia Hyperkalemia"
        title: "المضاعفات: uremia والـ fluid والـ electrolytes"
        columns: [Group, Complications]
        rows:
          - ["Toxins", "Uremia"]
          - ["Fluid", "Hypervolemia and hypovolemia"]
          - ["Electrolytes", "Hyponatremia, hyperkalemia, hyperphosphatemia and hypocalcemia"]
          - ["Others", "Bleeding, infections, cardiac complications, malnutrition"]
        hide: [[1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 107
        title: "الحكاية والكشف"
        quote: "Colicky flank pain radiating to the groin suggests acute ureteric obstruction"
        text: |
          - **Prerenal:** ترجيع، إسهال، **glycosuria** بـ polyuria، diuretics/NSAIDs/ACEi/ARBs. الكشف: orthostatic hypotension، tachycardia، JVP واطي، skin turgor قليل، بُق ناشف.
          - **Postrenal:** ==colicky flank pain للـ groin== = ureteric. nocturia و hesitancy = البروستاتا. suprapubic fullness = مثانة كبيرة.
          - راجع ==كل الأدوية==: سبب؟ ومحتاجة dose adjustment؟
      - kind: match
        page: 108
        quote: "Livedo reticularis and other signs of emboli to the legs"
        prompt: "وصّل العلامة بالسبب:"
        pairs:
          - ["Palpable purpura + pulmonary hemorrhage", "Systemic vasculitis with GN"]
          - ["Livedo reticularis", "Atheroembolic disease"]
          - ["Limb ischemia", "Rhabdomyolysis"]
          - ["Diarrhea, then AKI", "HUS D+"]
          - ["TMA + fever + neurological signs", "TTP"]
        why: "الـ purpura مع lung hemorrhage و sinusitis = vasculitis. الـ livedo = atheroemboli. الـ limb ischemia = rhabdo. والـ TMA بعد إسهال = HUS، ولو معاها حرارة وأعراض عصبية = TTP."
      - kind: table
        page: 109
        quote: "Distinguishing Prerenal azotemia and ATN"
        title: "Prerenal ولا ATN؟"
        columns: [Index, Prerenal, ATN]
        rows:
          - ["Sediment", "Normal / hyaline", "Epithelial casts"]
          - ["Specific gravity", ">1.020", "<1.020"]
          - ["Urine Na (mmol/L)", "<20", ">40"]
          - ["FENa", "<1%", ">2%"]
          - ["FEurea", "<35%", ">50%"]
          - ["Urine osm", ">500", "<350"]
          - ["U/P creatinine", ">40", "<10"]
          - ["BUN/Cr", ">20", "<15"]
        hide: [[2, 1], [3, 1], [3, 2], [4, 1], [5, 1], [7, 1]]
      - kind: aside
        tone: analogy
        page: 109
        quote: "Distinguishing Prerenal azotemia and ATN"
        text: |
          الكلية الـ **prerenal** زي واحد عطشان بيحوّش: بيمسك ==sodium== (UNa <20، FENa <1%) ويركّز البول (osm >500). الـ **ATN** tubules مضروبة ومش عارفة تحوّش، فالـ sodium بيهرب (FENa >2%) والبول بيطلع ==مخفف==.
      - kind: check
        page: 109
        quote: "Distinguishing Prerenal azotemia and ATN"
        question: "UNa 15 mmol/L, FEurea 28%, urine osm 540, BUN/Cr 24. Diagnosis?"
        options:
          - "Prerenal azotemia"
          - "ATN"
          - "Can't tell without FENa"
        answer: 0
        why:
          - "صح: كل الـ indices في عمود الـ prerenal (UNa <20، FEurea <35%، osm >500، BUN/Cr >20)."
          - "الـ ATN: UNa >40، FEurea >50%، osm <350، BUN/Cr <15."
          - "الـ FEurea بيقوم بالمهمة، وخصوصًا لو العيان واخد diuretic."
      - kind: aside
        tone: tip
        page: 109
        quote: "Distinguishing Prerenal azotemia and ATN"
        text: |
          ليه الـ **FEurea**؟ الـ diuretics بتعلّي الـ FENa حتى في الـ prerenal، لكن الـ ==urea== بتفضل تتمسك. (الشرح فسيولوجي؛ الأرقام من جدول الكتاب.)
      - kind: table
        page: 109
        quote: "Urinary sediment in AKI"
        title: "الـ sediment بيقول إيه"
        columns: [Finding, Think of]
        rows:
          - ["Bland (few cells, hyaline)", "Prerenal, postrenal, arterial thrombosis or embolism, HUS/TTP"]
          - ["RBC casts", "GN, vasculitis"]
          - ["RTE cells, granular casts", "ATN, interstitial nephritis, allograft rejection"]
          - ["Pigmented casts", "Myoglobinuria, hemoglobinuria"]
          - ["Eosinophiluria", "Allergic interstitial nephritis, atheroemboli"]
          - ["Crystalluria", "Uric acid, ethylene glycol, acyclovir, indinavir"]
        hide: [[1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
      - kind: explain
        page: 110
        title: "الـ imaging"
        quote: "DTPA and MAG3: renal function, urinary excretion and upper tract outflow"
        text: |
          - **Ultrasound:** للـ ==obstruction==.
          - **Doppler:** الـ renal blood flow.
          - **CT**.
          - **DMSA:** anatomy. **DTPA و MAG3:** function و excretion و upper-tract outflow.
      - kind: try
        items: [neph.L05.053, neph.L05.059, neph.L05.063, neph.L05.126, neph.L05.135]
    recap:
      - "Prerenal = perfusion قليل والنسيج سليم؛ صلّحه بدري قبل ما يبقى intrinsic."
      - "ATN = 40% من الـ AKI؛ postrenal أقل من 10%."
      - "Prerenal: UNa <20، FENa <1%، FEurea <35%، osm >500، BUN/Cr >20."
      - "ATN: UNa >40، FENa >2%، FEurea >50%، osm <350، epithelial casts."
      - "RBC casts = GN، pigmented = myoglobin، eosinophils = AIN، crystals = أدوية وسموم."
    practice: [neph.L05.030, neph.L05.031, neph.L05.032, neph.L05.033, neph.L05.034, neph.L05.035, neph.L05.036, neph.L05.037, neph.L05.038, neph.L05.039, neph.L05.040, neph.L05.041, neph.L05.042, neph.L05.043, neph.L05.044, neph.L05.045, neph.L05.046, neph.L05.047, neph.L05.048, neph.L05.049, neph.L05.050, neph.L05.051, neph.L05.052, neph.L05.053, neph.L05.054, neph.L05.055, neph.L05.056, neph.L05.057, neph.L05.058, neph.L05.059, neph.L05.060, neph.L05.061, neph.L05.062, neph.L05.063, neph.L05.064, neph.L05.065, neph.L05.126, neph.L05.135, neph.L05.136, neph.L05.137]
