    tags: [high-yield]
  - id: git.L03.245
    kind: card
    topic: biliary
    front: Can MRCP or EUS diagnose SOD?
    back: No. They are safer than endoscopic retrograde cholangiopancreatography (ERCP) for excluding stones, tumors and pancreas divisum, but cannot diagnose or treat sphincter of Oddi dysfunction (SOD).
    src: { page: 133, quote: "Although alternative biliary imaging methods, such as MRCP and EUS, are safer than ERCP for excluding stones, tumors, and pancreas divisum, they cannot diagnose (or be used to treat) SOD." }
    status: unverified
  - id: git.L03.246
    kind: card
    topic: biliary
    front: Which drugs lower basal sphincter of Oddi pressure?
    back: Nifedipine, nitrates, octreotide, antispasmodics and PDE-5 inhibitors (also TENS and electroacupuncture); consistent outcome data are lacking.
    src: { page: 134, quote: "Nifedipine, nitrates, octreotide, antispasmodics, phosphodiesterase type 5 inhibitors, transcutaneous nerve stimulation, and electroacupuncture have been shown to lower basal SO pressure, although consistent clinical outcomes data are lacking" }
    status: unverified
  - id: git.L03.247
