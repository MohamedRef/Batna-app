  # ---------- p77: definition, neuroendocrine cells ----------
  - id: endo.L05.001
    kind: enumerate
    topic: overview
    prompt: Neuroendocrine tumours are a heterogeneous group of neoplasms. Which three features do they share?
    points: [Originate from neuroendocrine cells, Have secretory characteristics, Frequently present with hypersecretory syndromes]
    pass: 3
    hook: "الـNETs مختلفين بس متفقين في 3 «أصل، إفراز، زيادة»: جايين من neuroendocrine cells، عندهم secretory characteristics، وكتير يظهروا بـhypersecretory syndromes."
    src: { page: 77, quote: "Neuroendocrine Tumours\n  Heterogeneous group of neoplasms.\n  Share certain characteristic features:\n    Originate from neuroendocrine cells.\n    Have secretory characteristics.\n    Frequently present with hypersecretory syndromes." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.002
    kind: cloze
    topic: overview
    text: "In {{c1::1969}}, Pearse described {{c2::APUD}} cells: {{c3::Amine Precursor Uptake and Decarboxylation}}."
    src: { page: 77, quote: "Neuroendocrine Cells\n  In 1969, Pearse described APUD cells (Amine Precursor Uptake and Decarboxylation).\n  These cells produce polypeptides and biogenic amines.\n  Contain dense core secretory granules that store and release hormones in response to external stimuli.\n  Lack axons and synapses.\n  Part of the diffuse endocrine system (DES).\n  Endocrine tumors of the gut and pancreas originate from DES cells." }
    status: unverified
  - id: endo.L05.003
    kind: card
    topic: overview
    front: What do neuroendocrine (APUD) cells produce, and where do they store their hormones?
    back: Polypeptides and biogenic amines, stored in dense core secretory granules that release them in response to external stimuli.
    src: { page: 77, quote: "Neuroendocrine Cells\n  In 1969, Pearse described APUD cells (Amine Precursor Uptake and Decarboxylation).\n  These cells produce polypeptides and biogenic amines.\n  Contain dense core secretory granules that store and release hormones in response to external stimuli.\n  Lack axons and synapses.\n  Part of the diffuse endocrine system (DES).\n  Endocrine tumors of the gut and pancreas originate from DES cells." }
    status: unverified
  - id: endo.L05.004
    kind: card
    topic: overview
    front: How do neuroendocrine cells differ from neurons, and to which system do they belong?
    back: They lack axons and synapses. They are part of the diffuse endocrine system (DES), from which the endocrine tumours of the gut and pancreas arise.
    src: { page: 77, quote: "Neuroendocrine Cells\n  In 1969, Pearse described APUD cells (Amine Precursor Uptake and Decarboxylation).\n  These cells produce polypeptides and biogenic amines.\n  Contain dense core secretory granules that store and release hormones in response to external stimuli.\n  Lack axons and synapses.\n  Part of the diffuse endocrine system (DES).\n  Endocrine tumors of the gut and pancreas originate from DES cells." }
    status: unverified
  # ---------- p78: the cell, sites, background ----------
  - id: endo.L05.005
    kind: order
    topic: overview
    prompt: Order the serotonin pathway in the neuroendocrine cell.
    steps: [Tryptophan, 5-HTP, 5-HT (serotonin), 5-HIAA]
    src: { page: 78, quote: "The Neuroendocrine Cell\n  Tryptophan → 5-HTP → 5-HT → 5-HIAA.\n  Secretory granules contain pancreastatin, chromostatin, and chromogranin A (CgA).\n  Regulation modes:\n    Endocrine.\n    Autocrine.\n    Paracrine.\n    Neurocrine." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.006
    kind: enumerate
    topic: overview
    prompt: Name three proteins found in the secretory granules of neuroendocrine cells.
    points: [Pancreastatin, Chromostatin, Chromogranin A (CgA)]
    pass: 3
    hook: "الحبيبات فيها 3 «ستاتينات وجرانين»: pancreastatin، chromostatin، وchromogranin A."
    src: { page: 78, quote: "The Neuroendocrine Cell\n  Tryptophan → 5-HTP → 5-HT → 5-HIAA.\n  Secretory granules contain pancreastatin, chromostatin, and chromogranin A (CgA).\n  Regulation modes:\n    Endocrine.\n    Autocrine.\n    Paracrine.\n    Neurocrine." }
    status: unverified
  - id: endo.L05.007
    kind: enumerate
    topic: overview
    prompt: Enumerate the four regulation modes of neuroendocrine cells.
    points: [Endocrine, Autocrine, Paracrine, Neurocrine]
    pass: 4
    hook: "الخلية بتكلّم 4: «الدم (endocrine)، نفسها (autocrine)، جارتها (paracrine)، والعصب (neurocrine)»."
    src: { page: 78, quote: "The Neuroendocrine Cell\n  Tryptophan → 5-HTP → 5-HT → 5-HIAA.\n  Secretory granules contain pancreastatin, chromostatin, and chromogranin A (CgA).\n  Regulation modes:\n    Endocrine.\n    Autocrine.\n    Paracrine.\n    Neurocrine." }
    status: unverified
  - id: endo.L05.008
    kind: enumerate
    topic: classification
    prompt: Enumerate the sites of neuroendocrine tumours.
    points: [Pancreatic islet cells, Gastroenteric tissue, Respiratory epithelium, Gastroenteropancreatic NETs (includes carcinoid tumours)]
    pass: 3
    hook: "الـ NETs بتطلع في 4: islet cells، gastroenteric، respiratory epithelium، وGEP-NETs (ومنها carcinoid)."
    src: { page: 78, quote: "Sites of Neuroendocrine Tumours\n  Pancreatic islet cells.\n  Gastroenteric tissue.\n  Respiratory epithelium.\n  Gastroenteropancreatic NETs (includes carcinoid tumors)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.009
    kind: cloze
    topic: classification
    text: "NET incidence is {{c1::1-2 per 100,000}} (likely underestimated because of vague presentations and misdiagnosis); they are {{c2::<2%}} of GI malignancies."
    src: { page: 78, quote: "Background\n  Incidence: 1–2 per 100,000 (likely underestimated due to vague presentations and misdiagnosis).\n  <2% of GI malignancies.\n  Neuroendocrine tumors of the lung, GI tract and mediastinum have higher incidence in patients >50 years.\n  Exception: Appendiceal carcinoids more common in patients <30 years." }
    status: unverified
    tags: [numbers]
  - id: endo.L05.010
    kind: card
    topic: classification
    front: Which age group gets most NETs of the lung, GI tract and mediastinum, and which NET is the exception?
    back: Patients over 50. Appendiceal carcinoids are the exception, more common under 30.
    src: { page: 78, quote: "Background\n  Incidence: 1–2 per 100,000 (likely underestimated due to vague presentations and misdiagnosis).\n  <2% of GI malignancies.\n  Neuroendocrine tumors of the lung, GI tract and mediastinum have higher incidence in patients >50 years.\n  Exception: Appendiceal carcinoids more common in patients <30 years." }
    status: unverified
    tags: [high-yield]
  # ---------- p78-79: WHO classification ----------
  - id: endo.L05.011
    kind: card
    topic: classification
    front: What is the general behaviour of most GEP tumours?
    back: Most are malignant but slow-growing.
    src: { page: 78, quote: "Who Classification\n  Most GEP tumors are malignant but slow-growing.\n    Well-differentiated NET: Non-invasive, benign-behaving or uncertain malignant potential." }
    status: unverified
  - id: endo.L05.012
    kind: table
    topic: classification
    title: WHO classification of GEP neuroendocrine tumours
    columns: [Category, Behaviour]
    rows:
      - [Well-differentiated NET, "Non-invasive; benign-behaving or uncertain malignant potential"]
      - [Well-differentiated NE carcinoma, "Low-grade malignant, with invasion of the muscularis propria or metastasis"]
      - [Poorly differentiated endocrine carcinoma, "High-grade, malignant"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 79, quote: "  Well-differentiated NE carcinomas: Low-grade malignant with invasion of muscularis propria or metastasis.\n  Poorly differentiated endocrine carcinomas: High-grade, malignant.\nLevel of tumor differentiation and proliferation indices such as Ki-67 are useful" }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.013
    kind: card
    topic: classification
    front: Besides the WHO category, what helps grade a NET?
    back: The level of tumour differentiation and proliferation indices such as Ki-67.
    src: { page: 79, quote: "  Well-differentiated NE carcinomas: Low-grade malignant with invasion of muscularis propria or metastasis.\n  Poorly differentiated endocrine carcinomas: High-grade, malignant.\nLevel of tumor differentiation and proliferation indices such as Ki-67 are useful" }
    status: unverified
    update:
      text: "WHO 2019 grades GEP-NETs by Ki-67 and mitoses: G1 <3%, G2 3-20%, G3 >20%; poorly differentiated NECs are a separate group. The book's WHO categories stay the exam answer."
      ref: WHO Classification of Digestive System Tumours, 5th ed., 2019
  - id: endo.L05.014
    kind: table
    topic: classification
    title: Carcinoid tumours by embryonic gut
    columns: [Gut, Share, Sites]
    rows:
      - [Foregut, "25%", "Lung, thymus, gastric mucosa, duodenum"]
      - [Midgut, "40-60%", "Distal ileum and jejunum; includes carcinoid syndrome"]
      - [Hindgut, "-", "Colon, rectum"]
    blanks: [[0, 2], [1, 1], [1, 2], [2, 2]]
    src: { page: 79, quote: "Carcinoid Tumors\n  25% Foregut (lung, thymus, gastric mucosa, duodenum).\n  40–60% Midgut (distal ileum and jejunum) — includes carcinoid syndrome.\n  Hindgut (colon, rectum)." }
    status: unverified
    tags: [high-yield, numbers]
  - id: endo.L05.015
    kind: card
    topic: classification
    front: What share of endocrine pancreatic tumours are functioning, and what is typical of the non-functioning ones?
    back: About 60% are functioning (Zollinger-Ellison, hyperglycaemic, Verner-Morrison, glucagonomas, VIPomas). Non-functioning ones are usually large and metastatic at diagnosis.
    src: { page: 79, quote: "Endocrine Pancreatic Tumors\n  60% Functioning (Zollinger-Ellison, hyperglycemic, Verner-Morrison, glucagonomas, VIPomas, etc.).\n  Non-functioning (usually large and metastatic at diagnosis)." }
    status: unverified
  - id: endo.L05.016
    kind: cloze
    topic: classification
    text: "Pancreatic endocrine tumours are {{c1::3-5%}} of all pancreatic neoplasms; most are {{c2::sporadic}}."
    src: { page: 79, quote: "Pancreatic Endocrine Tumors\n  Account for 3–5% of all pancreatic neoplasms.\n  Most are sporadic." }
    status: unverified
    tags: [numbers]
  - id: endo.L05.017
    kind: enumerate
    topic: classification
    prompt: Enumerate the familial syndromes with pancreatic endocrine tumours.
    points: ["MEN-1 (20%, gastrinoma or non-functioning)", Tuberous sclerosis, "Neurofibromatosis (ampulla of Vater)", Von Hippel-Lindau]
    pass: 4
    hook: "العائلات اللي بتجيب أورام endocrine في البنكرياس 4 «MEN، TS، NF، VHL»: MEN-1 (20%، gastrinoma أو non-functioning)، tuberous sclerosis، neurofibromatosis (ampulla of Vater)، وVon Hippel-Lindau."
    src: { page: 79, quote: "Familial Syndromes\n  MEN-1 (20%, gastrinoma or non-functioning).\n  Tuberous sclerosis.\n  Neurofibromatosis (ampulla of Vater).\n  Von Hippel-Lindau." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.018
    kind: enumerate
    topic: classification
    prompt: Enumerate the hormones that pancreatic endocrine tumours may secrete.
    points: [Insulin, Gastrin, Glucagon, VIP, Serotonin, ACTH]
    pass: 5
    hook: "أورام البنكرياس بتطلع 6: insulin، gastrin، glucagon، VIP، serotonin، وACTH."
    src: { page: 80, quote: "VIP.\nSerotonin.\nACTH." }
    status: unverified
  # ---------- p80: presentation and markers ----------
  - id: endo.L05.019
    kind: card
    topic: markers
    front: How do neuroendocrine tumours present?
    back: Asymptomatic or with obstructive symptoms; symptoms are usually due to liver metastases, or to hormone release into the circulation (e.g. serotonin, tachykinin).
    src: { page: 80, quote: "Presentation\n  Asymptomatic or present with obstructive symptoms.\n  Symptoms usually due to liver metastases.\n  Hormone release into circulation (e.g., serotonin, tachykinin)." }
    status: unverified
  - id: endo.L05.020
    kind: cloze
    topic: markers
    text: "General NET markers: chromogranin A is raised in {{c1::90-100%}}; pancreatic polypeptide in {{c2::40-60%}}."
    src: { page: 80, quote: "General Markers\n  Chromogranin A: 90–100%.\n  Pancreatic Polypeptide: 40–60%." }
    status: unverified
    tags: [numbers]
  - id: endo.L05.021
    kind: card
    topic: markers
    front: What is the general stimulation test for neuroendocrine pancreatic tumours?
    back: A meal stimulation test, measuring pancreatic polypeptide (PP) every 10 minutes for 1.5 hours.
    src: { page: 80, quote: "Meal stimulation test with measurement of PP every 10 minutes for 1.5 hours." }
    status: unverified
  - id: endo.L05.022
    kind: card
    topic: markers
    front: What is chromogranin A, and how good is it as a NET marker?
    back: A constitutive neuroendocrine secretory protein and the most widely accepted biomarker; against a panel of markers it was the most accurate (specificity 85.7%, sensitivity 67.9%).
    src: { page: 80, quote: "Chromogranin A\n  Represents a constitutive neuroendocrine secretory protein.\n  Most widely accepted biomarker.\n  Compared to a panel of biomarkers, CgA proved most accurate.\n    Specificity: 85.7%.\n    Sensitivity: 67.9%.\n  Elevated in 60–80% of patients with NETs.\n  Correlates with disease burden and poor outcomes.\n  Serial CgA testing is being investigated to determine treatment response.\n  In pancreatic NETs, early declines in CgA during treatment with chemotherapy and everolimus are associated with improved prognosis." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.023
    kind: cloze
    topic: markers
    text: "Chromogranin A: specificity {{c1::85.7%}}, sensitivity {{c2::67.9%}}; elevated in {{c3::60-80%}} of patients with NETs."
    src: { page: 80, quote: "Chromogranin A\n  Represents a constitutive neuroendocrine secretory protein.\n  Most widely accepted biomarker.\n  Compared to a panel of biomarkers, CgA proved most accurate.\n    Specificity: 85.7%.\n    Sensitivity: 67.9%.\n  Elevated in 60–80% of patients with NETs.\n  Correlates with disease burden and poor outcomes.\n  Serial CgA testing is being investigated to determine treatment response.\n  In pancreatic NETs, early declines in CgA during treatment with chemotherapy and everolimus are associated with improved prognosis." }
    status: unverified
    tags: [numbers]
  - id: endo.L05.024
    kind: card
    topic: markers
    front: What does the CgA level correlate with, and what does an early fall mean in pancreatic NETs?
    back: It correlates with disease burden and poor outcome. In pancreatic NETs, an early fall during chemotherapy or everolimus is associated with a better prognosis.
    src: { page: 80, quote: "Chromogranin A\n  Represents a constitutive neuroendocrine secretory protein.\n  Most widely accepted biomarker.\n  Compared to a panel of biomarkers, CgA proved most accurate.\n    Specificity: 85.7%.\n    Sensitivity: 67.9%.\n  Elevated in 60–80% of patients with NETs.\n  Correlates with disease burden and poor outcomes.\n  Serial CgA testing is being investigated to determine treatment response.\n  In pancreatic NETs, early declines in CgA during treatment with chemotherapy and everolimus are associated with improved prognosis." }
    status: unverified
  # ---------- p81-83: localization ----------
  - id: endo.L05.025
    kind: enumerate
    topic: localization
    prompt: Enumerate the methods for tumour localization of NETs.
    points: [Transabdominal ultrasound, CT, MRI, Selective arterial angiography, Selective venous sampling, Hepatic venous sampling, Radiolabeled somatostatin scanning, Endoscopic and intraoperative ultrasound]
    pass: 6
    hook: "تدوّر على الـ NET بـ 8: «صور» (ultrasound، CT، MRI) + «شرايين وعينات» (selective arterial angiography، selective venous sampling، hepatic venous sampling) + «مسح somatostatin» + «سونار من جوه» (endoscopic وintraoperative). 3 + 3 + 1 + 1 = 8."
    src: { page: 81, quote: "Tumor Localization\n  Transabdominal ultrasound.\n  CT.\n  MRI.\n  Selective arterial angiography.\n  Selective venous sampling.\n  Hepatic venous sampling.\n  Radiolabeled somatostatin scanning.\n  Endoscopic and intra operative ultrasound." }
    status: unverified
  - id: endo.L05.026
    kind: card
    topic: localization
    front: What is the best noninvasive modality to localize GEP tumours, and what else can it do?
    back: Radiolabeled somatostatin scanning. It finds up to 70% of primary tumours and can distinguish GEP tumours from nonendocrine tumours.
    src: { page: 81, quote: "Radiolabeled somatostatin scanning is the best noninvasive modality, identifying up to 70% of primary tumors. This modality can also distinguish GEP tumors from nonendocrine tumors." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.027
    kind: table
    topic: localization
    title: Sensitivity of NET imaging
    columns: [Modality, Small tumours, Liver metastases]
    rows:
      - ["Octreoscan (111In-DTPA-octreotide, SRI)", "<10 mm 40%; 10 mm 90%", "90%"]
      - ["EUS", "<10 mm about 50%", "-"]
      - ["SRI + EUS", "<10 mm about 90%", "-"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 81, quote: "Radiology of Neuroendocrine Tumours\nTotal Body Screening and Staging\nOctreoscan (¹¹¹Ind-DTPA-octreotide) (SRI)\n  Sensitivity:\n    <10 mm → 40%.\n    10 mm → 90%.\n  Liver metastases: 90%.\nDisclosure of Endocrine Pancreatic Tumours\nEndoscopic Ultrasonography (EUS)\n  Sensitivity for <10 mm tumors: ~50%.\n  Combined SRI + EUS sensitivity for <10 mm tumors: ~90%." }
    status: unverified
    tags: [numbers, high-yield]
  - id: endo.L05.028
    kind: card
    topic: localization
    front: Which newer technique is used to image NETs, and with which tracers?
    back: Positron emission tomography (PET) with C11-5HTP or C11-L-dopa; traditional techniques (CT with angiography, MRI, ultrasound) are always a complement.
    src: { page: 82, quote: "Positron Emission Tomography (PET)\n  With C11-5HTP or C11-L-dopa.\n  Traditional Techniques (always a complement).\n  CT (+ angiography).\n  MRI.\n  Ultrasound:\n    Sensitivity for small tumors: 10–30%.\n    Liver metastases: 90%." }
    status: unverified
    update:
      text: "68Ga-DOTA somatostatin-analog PET/CT (DOTATATE/DOTATOC) has replaced Octreoscan as the first-choice functional imaging for well-differentiated NETs."
      ref: ENETS guidance 2023 / SNMMI appropriate use criteria 2018
  - id: endo.L05.029
    kind: mcq
    topic: localization
    stem: A 52-year-old man has a pancreatic NET suspected biochemically. CT is negative. You want the best chance of finding a lesion under 10 mm. Which approach does the lecture support?
    options: [Combined somatostatin receptor imaging and endoscopic ultrasound, Transabdominal ultrasound with Doppler imaging alone, Octreoscan somatostatin receptor imaging alone, Repeat multiphase CT with thinner slice cuts]
    answer: 0
    why:
      - "Correct: SRI + EUS together reach about 90% for tumours under 10 mm."
      - "Ultrasound finds only 10-30% of small tumours."
      - "Octreoscan alone finds only 40% of tumours under 10 mm."
      - "The lecture gives CT as a complement, not as the way to find tiny tumours."
    src: { page: 81, quote: "Endoscopic Ultrasonography (EUS)\n  Sensitivity for <10 mm tumors: ~50%.\n  Combined SRI + EUS sensitivity for <10 mm tumors: ~90%." }
    status: unverified
  # ---------- p84: treatment ----------
  - id: endo.L05.030
    kind: card
    topic: treatment
    front: What offers a chance of cure for a resectable NET?
    back: Complete surgical removal of a solitary tumour.
    src: { page: 84, quote: "Complete surgical removal of a solitary tumor offers a chance of cure." }
    status: unverified
  - id: endo.L05.031
    kind: enumerate
    topic: treatment
    prompt: If surgical cure is not possible, enumerate the measures to control symptoms and tumour growth.
    points: [Surgical debulking, "Antisecretory drugs (e.g. gastrinomas)", "Somatostatin analogs (e.g. VIPomas)", "Tumour embolization (± chemotherapy)", Cryotherapy, Radiofrequency ablation, Cytotoxic chemotherapy, Radiolabeled somatostatin analogs, Interferon, Liver transplantation]
    pass: 7
    hook: "لو مفيش شفا، 10 طرق: «قصّ» (debulking) + «أدوية» (antisecretory، somatostatin analogs) + «تدمير محلي» (embolization ± chemo، cryotherapy، RFA) + «جهازي» (cytotoxic chemo، radiolabeled somatostatin analogs، interferon) + «كبد جديد» (liver transplantation). 1 + 2 + 3 + 3 + 1 = 10."
    src: { page: 84, quote: "Measures to control symptoms and tumor growth:\n  Surgical tumor debulking.\n  Antisecretory drugs (e.g., for gastrinomas).\n  Somatostatin analogs (e.g., for VIPomas).\n  Tumor embolization (± chemotherapy).\n  Cryotherapy.\n  Radiofrequency ablation.\n  Cytotoxic chemotherapy (69% response to streptozotocin + doxorubicin).\n  Radiolabeled somatostatin analogs.\n  Interferon therapy.\n  Liver transplantation." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.032
    kind: cloze
    topic: treatment
    text: "Cytotoxic chemotherapy for NETs: {{c1::69%}} response to {{c2::streptozotocin + doxorubicin}}."
    src: { page: 84, quote: "Measures to control symptoms and tumor growth:\n  Surgical tumor debulking.\n  Antisecretory drugs (e.g., for gastrinomas).\n  Somatostatin analogs (e.g., for VIPomas).\n  Tumor embolization (± chemotherapy).\n  Cryotherapy.\n  Radiofrequency ablation.\n  Cytotoxic chemotherapy (69% response to streptozotocin + doxorubicin).\n  Radiolabeled somatostatin analogs.\n  Interferon therapy.\n  Liver transplantation." }
    status: unverified
    tags: [numbers]
  - id: endo.L05.033
    kind: card
    topic: treatment
    front: Where do somatostatin analogs fit in NET treatment?
    back: Synthetic hormone-blocking agents (octreotide, lanreotide), used since the 1980s. First-line for GEP NETs; second- or third-line for insulinomas and gastrinomas.
    src: { page: 84, quote: "Somatostatin Analogs\n  Used since the 1980s.\n  Synthetic hormone-blocking agents (e.g., octreotide, lanreotide).\n  First-line for neuroendocrine gastroenteropancreatic tumors.\n  Second- or third-line for insulinomas and gastrinomas." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.034
    kind: enumerate
    topic: treatment
    prompt: Enumerate the side effects of somatostatin analogs.
    points: [Gallstones, Pain at injection site, Hypo/hyperglycaemia, Rash, Alopecia, Fluid retention]
    pass: 5
    hook: "الـsomatostatin analogs بيسيبوا 6 «3 من جوه + 3 من برّه»: gallstones، hypo أو hyperglycaemia، fluid retention… وpain مكان الحقنة، rash، alopecia. 3 + 3 = 6."
    src: { page: 84, quote: "Side Effects\n  Gallstones (due to inhibition of cholecystokinin release).\n  Pain at injection site.\n  Hypo/hyperglycemia.\n  Rash.\n  Alopecia.\n  Fluid retention." }
    status: unverified
  - id: endo.L05.035
    kind: card
    topic: treatment
    front: Why do somatostatin analogs cause gallstones?
    back: They inhibit cholecystokinin release (and gallbladder contractility and bile flow), so bile stagnates.
    src: { page: 84, quote: "Side Effects\n  Gallstones (due to inhibition of cholecystokinin release).\n  Pain at injection site.\n  Hypo/hyperglycemia.\n  Rash.\n  Alopecia.\n  Fluid retention." }
    status: unverified
    tags: [high-yield]
  # ---------- p85: physiology, interferon, chemo ----------
  - id: endo.L05.036
    kind: enumerate
    topic: treatment
    prompt: Enumerate the physiological effects of somatostatin (and its analogs).
    points: [Reduces liver blood flow, Inhibits gastric acid and pepsin, Inhibits gallbladder contractility and bile flow, Inhibits pancreatic exocrine secretion, Inhibits GI and pancreatic peptide hormones, Slows GI transit and glucose/amino acid absorption, Reduces splanchnic blood flow, Stimulates water and electrolyte absorption, Inhibits tissue growth and proliferation]
    pass: 6
    hook: "الـ somatostatin «فرامل البطن» 9: دم الكبد ينزل، حمض وpepsin يقفوا، المرارة والصفرا يقفوا، البنكرياس الخارجي يقف، هرمونات البطن تقف، المرور والامتصاص يبطّأوا، دم الـ splanchnic ينزل، امتصاص المية والأملاح يزيد (الوحيدة اللي «بتزوّد»)، والنمو يقف."
    src: { page: 85, quote: "Physiological Effects\n  Reduces liver blood flow.\n  Inhibits gastric acid and pepsin secretion.\n  Inhibits gallbladder contractility and bile flow.\n  Inhibits pancreatic exocrine secretion.\n  Inhibits GI and pancreatic peptide hormone secretion.\n  Slows GI transit time and inhibits absorption of glucose and amino acids.\n  Reduces splanchnic blood flow.\n  Stimulates water and electrolyte absorption.\n  Inhibits tissue growth and proliferation." }
    status: unverified
  - id: endo.L05.037
    kind: card
    topic: treatment
    front: Which somatostatin effect explains its use in VIPoma diarrhoea?
    back: It inhibits GI and pancreatic peptide hormone secretion and stimulates water and electrolyte absorption.
