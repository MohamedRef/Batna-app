  - id: neph.L06.lesson3
    title: "Hypernatremia: المخ اللي نشف"
    hook: "الـ Na العالي غالبًا مش ملح زيادة، ده ميه ناقصة. والعلاج: ميه، بس بالراحة."
    minutes: 7
    pages: [133, 135]
    topics: [hyperna, hyperna-treat]
    goals:
      - "تعرف أسباب الـ hypernatremia من Table 2 وتفرّق الـ central من الـ nephrogenic DI"
      - "تعالج حسب الـ volume status"
      - "تحفظ سرعة التصحيح في الـ acute والـ chronic"
    status: unverified
    steps:
      - kind: explain
        page: 133
        title: "Na فوق 146 = ميه ناقصة"
        quote: "Serum Na >146mmol/L is usually due to a water deficit and is associated with severe underlying disease and significant mortality."
        text: |
          الـ ==hypernatremia== (Na **فوق 146**) غالبًا سببها **water deficit**، ومعاها مرض شديد و mortality عالية.

          الـ ECF بقى مركّز فبيشد ميه من الخلايا. المخ **بينكمش**، والانكماش ده بيعمل ==vascular shear stress== فيحصل **نزيف و thrombosis**.
      - kind: table
        page: 133
        quote: "Table 2. Causes of Hypernatremia"
        title: "Table 2: أسباب الـ hypernatremia"
        columns: [Cause, Urine clue]
        rows:
          - ["No access to water", "Urine osm >600"]
          - ["GI losses, sweating", "Urine osm >600"]
          - ["Loop diuretics, osmotic diuresis", "Isosthenuric"]
          - ["Central DI", "Dilute; rises with desmopressin"]
          - ["Nephrogenic DI", "<300; no desmopressin response"]
          - ["Hypertonic fluids, TPN", ">600, urine Na >100"]
        hide: [[0, 1], [3, 1], [4, 1], [5, 1]]
      - kind: reveal
        page: 133
        quote: "Nephrogenic diabetes insipidus"
        prompt: "إزاي تفرّق الـ central DI من الـ nephrogenic DI بتحليلين؟"
        answer: "**Copeptin**: واطي في الـ central (مفيش ADH)، عالي في الـ nephrogenic (الـ ADH موجود والكلية مطنّشة).\n\n**Desmopressin**: الـ urine osm **تعلى** في الـ central و **ما تتحركش** في الـ nephrogenic. أسباب الـ nephrogenic: ==lithium==، demeclocycline، hypercalcemia، hypokalemia، tubulointerstitial disease."
      - kind: explain
        page: 134
        title: "الأعراض"
        quote: "The patient may have increased tone with brisk reflexes and myoclonus."
        text: |
          - أغلبهم: علامات **dehydration** وفقد سوائل.
          - أعراض الـ CNS تظهر لو الـ Na طلع **بسرعة** أو عدّى ==160==.
          - الأطفال: irritability و agitation لحد coma، و **صرخة عالية**.
          - عطش، و polyuria و polydipsia في الـ DI.
          - Orthostatic hypotension و tachycardia في الـ hypovolemic.
          - **Tone عالي، brisk reflexes، myoclonus** (عكس الـ hypermagnesemia اللي هتشوفها بعدين).
      - kind: figure
        page: 134
        quote: "Administer isotonic saline until hypovolemia improves"
        title: "العلاج بالـ volume status"
        alt: "Hypernatremia treatment by volume status. Hypovolemia: isotonic saline until hypovolemia improves and treat the cause, then correct the water deficit with 0.45% saline, 5% dextrose or oral water. Euvolemia: correct the water deficit; vasopressin 5 U subcutaneously every 6 h in central DI with severe losses; long-term central DI therapy, or for nephrogenic DI stop drugs, low sodium diet, thiazides, amiloride for lithium. Hypervolemia: remove sodium by stopping offending agents and furosemide; dialysis for renal failure."
        caption: "الناشف ياخد **isotonic saline الأول** يرجّع الدورة الدموية، وبعدين الميه. الوارم محتاج **يطلّع Na** (furosemide)."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="5" width="320" height="80" rx="8" class="fg-bad"/>
            <text x="15" y="24" class="t-b">Hypovolemia</text>
            <text x="15" y="43" class="t-sm">1. Isotonic saline until volume improves</text>
            <text x="25" y="58" class="t-sm t-mut">+ treat cause (insulin, relieve obstruction)</text>
            <text x="15" y="76" class="t-sm">2. Then water deficit: 0.45% saline / D5 / oral</text>
            <rect x="5" y="95" width="320" height="120" rx="8" class="fg-box"/>
            <text x="15" y="114" class="t-b">Euvolemia</text>
            <text x="15" y="133" class="t-sm">Water deficit: 0.45% saline, D5 or oral water</text>
            <text x="15" y="150" class="t-sm">Central DI, big losses: vasopressin 5 U SC q6h</text>
            <text x="15" y="167" class="t-sm">Watch Na: avoid water intoxication</text>
            <text x="15" y="187" class="t-sm">Nephrogenic DI: stop drug, low Na diet,</text>
            <text x="25" y="203" class="t-sm">thiazide, amiloride (lithium), fix K and Ca</text>
            <rect x="5" y="225" width="320" height="68" rx="8" class="fg-acc"/>
            <text x="15" y="244" class="t-b">Hypervolemia: remove Na</text>
            <text x="15" y="263" class="t-sm">Stop offending agents · furosemide</text>
            <text x="15" y="282" class="t-sm">Hemodialysis if renal failure</text>
          </svg>
      - kind: explain
        page: 134
        title: "كام لتر؟"
        quote: "Volume of replacement fluid needed to correct the water deficit is determined by using the concentration of sodium in the replacement fluid."
        text: |
          حجم السائل بيعتمد على ==الـ Na اللي في السائل== مقارنة بـ **154** (الـ normal saline). كل ما السائل فيه Na أكتر، كل ما تحتاج حجم أكبر علشان تدي نفس الميه الحرة.

          مثال: الـ **0.45% saline** نصّه بس ميه حرة، فهتحتاج حوالي **ضعف** الـ water deficit. والـ **5% dextrose** كله ميه حرة.

          والحجم ده بيتدي **بالراحة على 48–72 ساعة**.
      - kind: table
        page: 135
        quote: "Correct at no greater than 0.5mmol/L/h or no less than 10mmol/L/day."
        title: "سرعة التصحيح"
        columns: ["", Acute (<24 h), Chronic (>24 h)]
        rows:
          - [Rate, "1 mmol/L/h", "≤0.5 mmol/L/h (~10/day)"]
          - [Deficit plan, "Reverse quickly", "50% in 12–24 h, rest in 24–48 h"]
          - [Monitor Na, "2-hourly, then 4-hourly", "2-hourly, then 4-hourly"]
        hide: [[0, 1], [0, 2], [1, 2]]
      - kind: aside
        tone: exam
        page: 135
        quote: "If chronic (>24 hours), correct more slowly to prevent rehydration injury to the brain"
        text: "ليه الـ chronic بالراحة؟ المخ اتأقلم وعمل osmolytes علشان ما ينكمش. لو نزلت الـ Na بسرعة، الميه تدخل الخلايا و يحصل ==rehydration injury== (cerebral edema). نفس فكرة الـ ODS بس بالعكس."
      - kind: check
        page: 135
        quote: "5% glucose or 0.45% (half-normal) saline IVI if cannot use the gut."
        question: "An alert, oriented patient with chronic hypernatremia can swallow. Best way to give water?"
        options:
          - "Water by mouth"
          - "5% dextrose IV at a fast rate"
          - "0.9% saline"
          - "3% saline"
        answer: 0
        why:
          - "صح: الكتاب بيبدأ بالـ PO لو oriented، أو NG."
          - "الـ IV لو الأمعاء ما تنفعش، ومش بسرعة في الـ chronic."
          - "الـ normal saline مش ميه حرة؛ بيتدي الأول بس في الـ hypovolemia."
          - "ده هيعلّي الـ Na أكتر."
      - kind: try
        items: [neph.L06.049, neph.L06.053, neph.L06.056, neph.L06.057, neph.L06.059]
    recap:
      - "Na >146 = غالبًا water deficit؛ المخ ينكمش ويحصل نزيف و thrombosis."
      - "CNS symptoms لو طلع بسرعة أو >160؛ tone عالي و brisk reflexes و myoclonus."
      - "Central DI: copeptin واطي ويستجيب للـ desmopressin. Nephrogenic: lithium، copeptin عالي، مفيش استجابة."
      - "Hypovolemic: isotonic saline الأول، بعدين الميه. Hypervolemic: furosemide أو dialysis."
      - "الحجم بيعتمد على Na السائل مقارنة بـ 154، على 48–72 ساعة."
      - "Acute: 1 mmol/L/h. Chronic: ≤0.5/h، 50% في 12–24 ساعة."
    practice: [neph.L06.047, neph.L06.048, neph.L06.049, neph.L06.050, neph.L06.051, neph.L06.052, neph.L06.053, neph.L06.054, neph.L06.055, neph.L06.056, neph.L06.057, neph.L06.058, neph.L06.059, neph.L06.060, neph.L06.061]
