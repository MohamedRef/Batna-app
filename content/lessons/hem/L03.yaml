          </svg>
      - kind: check
        page: 22
        quote: "This causes excessive accumulation of free α. The unbound α chains precipitate within erythroblasts and red cells, leading to the lysis of erythroblasts and red cells in the bone marrow (ineffective erythropoiesis)."
        question: "What is the main cause of ineffective erythropoiesis in β-thalassaemia major?"
        options:
          - "Free α chains precipitate in erythroblasts"
          - "Lack of erythropoietin"
          - "Iron deficiency"
          - "Antibodies against erythroblasts"
        answer: 0
        why:
          - "صح: الـ α الحرة بتترسب وتكسّر الـ erythroblasts في النخاع."
          - "الـ erythropoietin (EPO) عالي جدًا هنا، وده اللي بيمدد النخاع."
          - "بالعكس، فيه iron overload."
          - "مفيش antibodies في الثلاسيميا."
      - kind: explain
        page: 23
        title: "العضم والحديد"
        quote: "Skeletal changes: Severe anaemia and tissue hypoxia stimulate erythropoietic drive and cause extreme bone marrow hyperplasia. Expansion of hyper active bone marrow causes weakening and deformities of skull and of facial bones. Thinning of cortex may lead to pathological fractures.\nIron overload:\n  Iron absorption from the intestine is increased in β thalassaemia major due to ineffective erythropoiesis.\n  Chronic regular blood transfusion therapy markedly increases the iron accumulation and causes iron overload.\n  Iron overload may damage parenchymal cells of various organs such as pancreas (diabetes mellitus), liver (cirrhosis), gonads (infertility),"
        text: |
          **العضم**: الـ anaemia والـ hypoxia بيشغّلوا النخاع ==hyperplasia== شديدة. النخاع بيتمدد فيضعّف ويشوّه **الجمجمة** و**عضم الوش**، والـ cortex يرق فيحصل **pathological fractures**.

          **الحديد** بيزيد من سببين:
          - **امتصاص أكتر من الأمعاء** بسبب الـ ineffective erythropoiesis.
          - **نقل الدم** المنتظم.

          والـ ==iron overload== بيبوّظ: البنكرياس (**diabetes mellitus (DM)**)، الكبد (**cirrhosis**)، الـ gonads (**infertility**)، الـ parathyroid والـ thyroid، و**القلب** (arrhythmias و heart failure).
      - kind: figure
