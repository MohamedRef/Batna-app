  # ---------- MCQs across the lecture ----------
  - id: hem.L07.093
    kind: mcq
    topic: morphology
    stem: A 45-year-old man has fever and pancytopenia. The blood film shows large blasts with azurophilic granules and slender red rod-shaped cytoplasmic inclusions on Giemsa stain. What do these inclusions establish?
    options:
      - AML
      - ALL of L3 type
      - Leukemoid reaction
      - Megaloblastic anemia
      - CLL
    answer: 0
    why:
      - "Correct: Auer rods are pathognomonic of AML (p107)."
      - L3 blasts have vacuoles and basophilic cytoplasm, never Auer rods; ALL blasts have no granules.
      - A leukemoid reaction shows maturing myeloid cells, not Auer rods.
      - Megaloblastic anemia gives macro-ovalocytes and hypersegmented neutrophils.
      - CLL shows small mature lymphocytes.
    src: { page: 107, quote: "auer rods which are slender, fusiform cytoplasmic inclusions that stain red with Giemsa stain, are pathognomic of AML." }
    status: unverified
  - id: hem.L07.094
    kind: mcq
    topic: etiology
    stem: A 62-year-old woman treated with melphalan for myeloma 5 years ago now has fatigue, bruising and circulating blasts. Which leukemia does this exposure most increase the risk of, per the lecture?
    options:
      - AML
      - Adult T-cell leukemia
      - CLL
      - ALL of L3 type
      - Hairy cell leukemia
    answer: 0
    why:
      - "Correct: prior alkylating agents (chlorambucil, melphalan, nitrogen mustard) increase the risk of AML (p105)."
      - Adult T-cell leukemia is caused by HTLV-1.
      - CLL is linked to family clustering and farming chemicals, not alkylators.
      - L3 ALL is not linked to alkylating agents in the lecture.
      - Hairy cell leukemia is not discussed with alkylating agents.
    src: { page: 105, quote: "Prior exposure to alkylating agents such as cholramboucil, melphalan and nitrogen mustard is associated with an increased risk of AML." }
    status: unverified
  - id: hem.L07.095
    kind: mcq
    topic: etiology
    stem: A 40-year-old man from Jamaica has skin lesions, lymphadenopathy and circulating abnormal T cells. Which agent is considered the cause?
    options:
      - HTLV-1
      - Epstein–Barr virus
      - Benzene
      - Ionizing radiation
      - HIV
    answer: 0
    why:
      - "Correct: HTLV-1 causes adult T-cell leukemia, found in the Caribbean basin and Africa (p104)."
      - EBV causes infectious mononucleosis, which can mimic ALL but is not this leukemia.
      - Benzene causes marrow hypoplasia that may evolve into acute leukemia.
      - Radiation raises ALL, AML and CML, not this T-cell leukemia.
      - HIV is not named as a leukemia virus in the lecture.
    src: { page: 104, quote: "Human T cell lymphotropic virus type 1 (HTLV-1) is considered the causative agent of adult T-cell leukemia." }
    status: unverified
  - id: hem.L07.096
    kind: mcq
    topic: ddx
    stem: A 25-year-old has pancytopenia with no blasts in the blood. Which bone marrow finding favours aplastic anemia over acute leukemia?
    options:
      - Hypoplastic marrow without blasts
      - Hypercellular marrow with 30% blasts
      - Hypocellular marrow with 40% blasts
      - Marrow full of mature lymphocytes
      - Hypercellular marrow with ringed sideroblasts
    answer: 0
    why:
      - "Correct: a hypoplastic marrow without blasts usually distinguishes aplastic anemia (p110)."
      - 30% blasts in a hypercellular marrow is acute leukemia (20–100% blasts).
      - Some acute leukemias are hypocellular, but blasts still make it leukemia.
      - Sheets of mature lymphocytes suggest CLL.
      - Ringed sideroblasts point to MDS, another DD.
    src: { page: 110, quote: "hypoplastic BM without blasts usually distinguishes aplastic anemia" }
    status: unverified
  - id: hem.L07.097
    kind: mcq
    topic: lab
    stem: Which statement about laboratory findings at diagnosis of acute leukemia is correct?
    options:
      - About 25% of patients have a WBC above 50,000/µL
      - Most patients have a normal neutrophil count
      - Blasts are rarely seen in the peripheral blood
      - Uric acid and LDH are usually low
      - The marrow is usually hypocellular
    answer: 0
    why:
      - "Correct: 25% have WBC >50,000, 50% have 5,000–50,000 and 25% have <5,000 (p110)."
      - Most patients are granulocytopenic at diagnosis.
      - Blasts are present in the peripheral blood in most cases.
      - Hyperuricemia and raised LDH are usually present.
      - The marrow is usually hypercellular with 20–100% blasts.
    src: { page: 110, quote: "25% of patients having very high white counts (> 50,000 per dl), 50%, having WBCs between 5000 to 50,000" }
    status: unverified
  - id: hem.L07.098
    kind: mcq
    topic: aml-induction
    stem: A fit 45-year-old man has newly diagnosed M2 AML. Which regimen is the book's standard remission induction?
    options:
      - "Cytosine arabinoside 100 mg/m2/day for 7 days + Adriamycin 25–30 mg/m2 for 3 days"
      - "ATRA 45 mg/m2/day + idarubicin"
      - "Cyclophosphamide, doxorubicin, vincristine, dexamethasone and L-asparaginase"
