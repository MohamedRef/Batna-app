  # Split from lesson4 on 2026-11-13 (#828): diagnosis and staging.
  - id: hem.L08.lesson8
    title: "الـ CLL: التشخيص والـ staging"
    hook: "أرقام قليلة بتأكد التشخيص، وسلّمين بيقولولك العيان فين."
    minutes: 10
    pages: [128, 129]
    topics: [cll-diagnosis, staging]
    goals:
      - "تحفظ أرقام التشخيص وتفهم ليه بنطلب clonality"
      - "تعرف أسباب الأنيميا والـ infections وليه"
      - "تعمل Rai وBinet staging وتعرف ليه الـ cytopenias أعلى stage"
    status: unverified
    steps:
      - kind: table
        page: 128
        quote: "CLL is characterized by lymphocytosis in the peripheral blood, > 5000/dl. Extreme leukocytosis approaching 1x106 /dl occurs only late in the disease, and hyperviscosety symptoms can occur if the WBC count is higher than 500,000 per/dl. If the lymphocyte count is 5000 to 15.000/dl supportive evidence for clonality (Kappa or Lambda light-chain) should be present. B.M lymphocytosis > 30%, Anaemia <11 gm/dl is present in 15 to 20% of patients at diagnosis. The anaemia is usually normochromic and normocytic and the reticulocyte count is normal unless the patient has autoimmune hemolytic anaemia which is confirmed by a positive direct coombs test and reticulocytosis. Pure red cell a plasia is an additional reported cause of anemia in CLL."
        title: "أرقام التشخيص"
        columns: [Finding, Number]
        rows:
          - ["Blood lymphocytes", ">5,000/µL"]
          - ["Needs clonality proof", "5,000–15,000/µL"]
          - ["Hyperviscosity", "WBC >500,000/µL"]
          - ["Marrow lymphocytes", ">30%"]
          - ["Anemia <11 at diagnosis", "15–20%"]
        hide: [[0, 1], [1, 1], [3, 1], [4, 1]]
      - kind: explain
        page: 128
        title: "ليه نطلب دليل clonality؟"
        quote: "If the lymphocyte count is 5000 to 15.000/dl supportive evidence for clonality (Kappa or Lambda light-chain) should be present."
        text: |
          الـ lymphocytes **فوق 5,000** في الدم. لو العدد بين ==5,000 و15,000== لازم دليل إنهم **clone واحد**: كلهم **kappa** أو كلهم **lambda** light chain.

          ليه؟ التفسير المقبول (مش في الكتاب): الـ lymphocytes الطبيعية جاية من آلاف الخلايا المختلفة، فنصهم تقريبًا kappa ونصهم lambda. لو كلهم نوع واحد، يعني ==خلية واحدة== اتكاثرت: ده الـ CLL. والعدد الصغير ده ممكن يبقى infection عادي، فالـ clonality هي اللي بتفرق.

          وليه الـ hyperviscosity فوق **500,000**؟ لأن الخلايا الكتير بتتقل الدم وتبطّأه في الأوعية الصغيرة.
      - kind: explain
        page: 128
        title: "الأنيميا في الـ CLL: تلات أسباب"
        quote: "CLL is characterized by lymphocytosis in the peripheral blood, > 5000/dl. Extreme leukocytosis approaching 1x106 /dl occurs only late in the disease, and hyperviscosety symptoms can occur if the WBC count is higher than 500,000 per/dl. If the lymphocyte count is 5000 to 15.000/dl supportive evidence for clonality (Kappa or Lambda light-chain) should be present. B.M lymphocytosis > 30%, Anaemia <11 gm/dl is present in 15 to 20% of patients at diagnosis. The anaemia is usually normochromic and normocytic and the reticulocyte count is normal unless the patient has autoimmune hemolytic anaemia which is confirmed by a positive direct coombs test and reticulocytosis. Pure red cell a plasia is an additional reported cause of anemia in CLL."
        text: |
          1. **Normochromic normocytic** بـ reticulocytes **طبيعية**: النخاع مليان.
          2. ==Autoimmune haemolytic anaemia (AIHA)==: **direct Coombs موجب** + **reticulocytosis**.
          3. **Pure red cell aplasia**.

          ليه كل سبب شكله كده؟ التفسير المقبول (مش في الكتاب):
          - **Infiltration**: النخاع مليان lymphocytes ومفيش مكان، فالـ reticulocytes طبيعية أو قليلة.
          - **AIHA**: الـ CLL بتلخبط الـ immune system فيعمل antibodies ضد الكرات الحمرا؛ النخاع سليم فبيعوّض بـ **reticulocytosis**.
          - **Pure red cell aplasia**: النخاع بيبطّل يعمل كرات حمرا بس، فالـ reticulocytes بتختفي.
      - kind: check
        page: 128
        quote: "The anaemia is usually normochromic and normocytic and the reticulocyte count is normal unless the patient has autoimmune hemolytic anaemia which is confirmed by a positive direct coombs test and reticulocytosis."
        question: "CLL with Hb 8, reticulocytes 10%, spherocytes. Which test confirms the cause?"
        options:
          - "Direct Coombs test"
          - "Bone marrow biopsy pattern"
          - "Serum β2-microglobulin"
          - "Kappa/lambda light chains"
        answer: 0
        why:
          - "صح: الـ AIHA بتتأكد بالـ direct Coombs الموجب مع الـ reticulocytosis."
          - "الـ pattern بيفيد في الـ prognosis، مش في تأكيد الـ haemolysis."
          - "الـ β2-microglobulin prognostic factor."
          - "الـ light chains بتثبت الـ clonality، مش سبب الأنيميا."
      - kind: table
        page: 128
        quote: "Four patterns of lymphocyte infilteration on bone marrow biopsy occur and have prognostic value in CLL\n  1. Nodular 15%\n  2. Infilterative 30%\n  3. Mixed nodular and infilterative 30% and\n  4. Diffuse 35%"
        title: "شكل النخاع في الـ biopsy"
        columns: [Pattern, Share]
        rows:
          - [Nodular, "15%"]
          - [Interstitial, "30%"]
          - [Mixed, "30%"]
          - [Diffuse, "35% (advanced stage)"]
        hide: [[0, 1], [3, 1]]
      - kind: explain
        page: 128
        title: "المناعة الضعيفة"
        quote: "Hypogammaglobulinaemia is common in CLL and predisposes to infection especially with encapsulated micro organisms."
        text: |
          - ==Hypogammaglobulinaemia== شائعة، فالعيان معرض للـ infection، خصوصًا ==encapsulated organisms==.
          - الـ **T cells** ردها ضعيف على الـ mitogens، والـ delayed hypersensitivity للـ recall antigens قليلة.

          ليه الـ encapsulated بالذات؟ التفسير المقبول (مش في الكتاب): الكبسولة بتخبي البكتيريا من الـ phagocytes، والطريقة الأساسية إن الـ phagocyte يمسكها هي إن **antibody** يلزق عليها الأول (opsonization). الـ CLL B cells ما بتعملش antibodies كويسة، فالبكتيريا دي بتعدّي.
      - kind: figure
        page: 129
        quote: "Table 1: Rai and Binet staging systems in chronic lymphocytic leukemia (CLL)\n| Stage | Lymphocytosis | Lymphadenopathy | Hepatomegaly or splenomegaly | Hemoglobin (gram/dl) | Platelets X 10³/μl |\n| Rai 0 | + | - | - | ≥ 11 | ≥ 100 |\n| Rai I | + | + | - | ≥ 11 | ≥ 100 |\n| Rai II | + | ± | + | ≥ 11 | ≥ 100 |\n| Rai III | + | ± | ± | < 11 | ≥ 100 |\n| Rai IV | + | ± | ± | Any | < 100 |\n| Binet A | + | ± | ± (<3 Lymphatic groups* positive) | ≥ 10 | ≥ 100 |\n| Binet B | + | ± | ± (<3 Lymphatic groups* positive) | ≥ 10 | ≥ 100 |\n| Binet C | + | ± | ± | < 10 | ≤ 100 |"
        title: "سلّم الـ Rai"
        alt: "A five-step staircase for Rai staging. Stage 0 lymphocytosis only; stage I adds lymph nodes; stage II adds liver or spleen; stage III adds haemoglobin below 11; stage IV adds platelets below 100 thousand. Low risk 0, intermediate I and II, high risk III and IV."
        caption: "كل درجة بتضيف حاجة: ==nodes== ← liver/spleen ← **Hb <11** ← **platelets <100**."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
