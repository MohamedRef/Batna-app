            <text x="28" y="42" class="t-sm t-b">Saline: immediate</text>
            <text x="165" y="42" class="t-sm t-mut">while infused</text>
            <rect x="80" y="74" width="100" height="34" rx="8" class="fg-good"/>
            <text x="88" y="96" class="t-sm t-b">Calcitonin</text>
            <text x="185" y="96" class="t-sm t-mut">4-6 h, ~2 days</text>
            <rect x="200" y="128" width="120" height="34" rx="8" class="fg-box"/>
            <text x="208" y="150" class="t-sm t-b">Bisphosphonate</text>
            <text x="320" y="182" text-anchor="end" class="t-sm t-mut">starts 2-3 d, lasts 2-4 wk</text>
          </svg>
      - kind: explain
        page: 423
        title: "الجرعات"
        quote: "IV hydration with NS at the rate of 200 to 300 mL/hr is given to maintain an adequate urine output of more than 100 mL/hr"
        text: |
          - **NS:** **200-300 mL/hr** علشان الـ urine output يبقى **>100 mL/hr**؛ بيرجّع الـ volume ويزوّد إخراج الكالسيوم.
          - **Calcitonin:** **4 IU/kg** مع الـ NS؛ سريع جدًا بس تأثيره **limited**.
          - ==Zoledronic acid==: المفضّل في السرطان (أقوى وأقصر)، للي كليتهم سليمة. عيوبه: **osteonecrosis of the jaw** و **nephrotoxicity**.
      - kind: match
        page: 424
        quote: "Denosumab acts by inhibiting RANKL and should be considered when there is no response to zoledronic acid or in patients with kidney impairment"
        prompt: "وصّل الموقف بالدوا:"
        pairs:
          - ["Kidney impairment or zoledronic acid failed", "Denosumab"]
          - ["Lymphoma with high calcitriol", "Glucocorticoids"]
          - ["Hemodialysis or parathyroid cancer", "Cinacalcet"]
          - ["Malignancy with normal kidneys", "Zoledronic acid"]
        why: "الـ denosumab (anti-RANKL) مش بيتخرج من الكلية. الـ steroids بتقلل إنتاج الـ vitamin D وامتصاص الكالسيوم. الـ cinacalcet calcimimetic بيكلم الـ parathyroid نفسها."
