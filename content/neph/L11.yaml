    src: { page: 378, quote: "The incidence of cervical incompetence is high in women treated with dialysis, and screening is suggested between 18 and 20 weeks. Preeclampsia should be screened by monitoring BP and laboratory chemistries, including complete blood counts and liver function tests, twice a month. (77) Minimizing fluctuations in BP during dialysis sessions prevents uteroplacental insufficiency. For a patient receiving dialysis, pregnancy is considered high risk, and fetal anomaly screening is recommended. (78)" }
