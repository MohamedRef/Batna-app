    steps:
      - kind: explain
        page: 35
        quote: "HOWEVER definite confirmation of diagnosis is by identification of monososium urate monohydrate (MSUM) crystals by polarized light microscopy of the aspirate from a joint or bursa or tophus."
        title: "Presumptive ولا definite؟"
        text: |
          - **Presumptive**: الصورة الكلاسيكية + uric acid عالي.
          - ==Definite==: **Monosodium urate monohydrate (MSUM) crystals** تحت الـ **polarized light microscopy** من aspirate المفصل أو الـ bursa أو الـ tophus.

          الـ synovial fluid في النوبة: **turbid**، viscosity قليلة، **20,000-100,000** white blood cell (WBC)/mm³ أغلبها **neutrophils**.

          التفسير المقبول (مش في الكتاب): ليه البلورة هي الـ definite؟ عشان الـ uric acid العالي موجود في ناس كتير مش عندهم gout أصلًا، وكمان ممكن يبقى طبيعي وقت النوبة نفسها. يعني الرقم بيقولك احتمال، والبلورة جوه الـ neutrophil بتقولك يقين. والـ WBC العالية جدًا (لحد 100,000) سببها إن الـ neutrophils بتهجم على البلورات، وده اللي بيخلي السائل turbid زي الـ septic.
