    status: unverified
    steps:
      - kind: explain
        page: 62
        quote: "Figure 44: Circumstance for referral to specialist kidney care services and goals of the referral.\n| Diagnosis CKD | Goal | Circumstance |\n| Causes | Further evaluation and special management based on diagnosis | Cause of CKD is uncertain; Hereditary kidney disease; Recurrent extensive nephrolithiasis |\n| eGFR/risk of KRT | Planning and preparation for kidney replacement therapy | eGFR <30 ml/min per 1.73 m2; A sustained fall in GFR of >20% or >30% in those people initiating hemodynamically active therapies; A >3–5% 5-year risk of requiring KRT measured using a validated risk equation |\n| Albuminuria and microscopic hematuria | Further evaluation and management | Consistent finding of significant albuminuria (ACR ≥300 mg/g [≥30 mg/mmol] or AER ≥300 mg/24 hours, approximately equivalent to PCR ≥500 mg/g [≥50 mg/mmol] or PER ≥500 mg/24 hours) in combination with hematuria; ≥2-fold increase in albuminuria in people with significant albuminuria undergoing monitoring; A consistent finding of ACR >700 mg/g [>70 mg/mmol]; Urinary red cell casts, RBC >20 per high power field sustained and not readily explained |\n| Others | Provision management of CKD complications | CKD and hypertension refractory to treatment ≥4 antihypertensive agents; Persistent abnormalities of serum potassium |"
        title: "Nephrology referral: حوّل لو…"
        text: |
          - السبب **مش واضح**، **hereditary**، أو **stones** متكررة كتير
          - ==glomerular filtration rate (GFR) < 30==
          - نزول مستمر أكتر من 20%، أو أكتر من 30% بعد دوا hemodynamic
          - **kidney failure risk equation (KFRE)** 5 سنين ≥ 3–5%
          - albumin-to-creatinine ratio (ACR) ≥ 300 مع **hematuria**، أو ==ACR > 700== ثابت، أو الـ albuminuria اتضاعفت
          - red blood cell (RBC) casts أو **RBC > 20/high-power field (HPF)** من غير تفسير
          - ضغط مش بيتظبط على ==≥ 4 أدوية==
          - مشكلة **K** مستمرة
      - kind: explain
        page: 62
        quote: "Nephrology Referral"
        title: "ليه كل سبب من دول يستاهل نفرولوجي؟"
        text: |
          التفسير المقبول (مش في الكتاب) لمنطق قايمة الـ referral:

          - **GFR < 30** أو **KFRE ≥ 3–5%**: المريض داخل على مرحلة محتاج فيها تجهيز للغسيل أو الزرع ومتابعة مضاعفات.
          - **نزول سريع** (> 20%، أو > 30% بعد دوا hemodynamic): فيه حاجة نشطة بتحصل دلوقتي، ممكن تتصلح.
          - **ACR ≥ 300 مع hematuria**، أو **RBC casts**، أو **RBC > 20/HPF**: كده الـ ==glomerulus== ملتهب، يعني glomerulonephritis ممكن تحتاج biopsy وعلاج مناعي.
          - **ACR > 700** ثابت: خطر progression عالي جدًا.
          - **ضغط مش بيتظبط على 4 أدوية**: دوّر على سبب secondary زي الـ renal artery stenosis.
          - **سبب مش واضح** أو **hereditary** أو **stones** متكررة: محتاجين تشخيص أو genetic counselling.

          يعني الـ referral مش علشان "الكلية تعبانة" وبس، علشان فيه **قرار** محتاج متخصص.
      - kind: check
        page: 62
        quote: "Figure 44: Circumstance for referral to specialist kidney care services and goals of the referral.\n| Diagnosis CKD | Goal | Circumstance |\n| Causes | Further evaluation and special management based on diagnosis | Cause of CKD is uncertain; Hereditary kidney disease; Recurrent extensive nephrolithiasis |\n| eGFR/risk of KRT | Planning and preparation for kidney replacement therapy | eGFR <30 ml/min per 1.73 m2; A sustained fall in GFR of >20% or >30% in those people initiating hemodynamically active therapies; A >3–5% 5-year risk of requiring KRT measured using a validated risk equation |\n| Albuminuria and microscopic hematuria | Further evaluation and management | Consistent finding of significant albuminuria (ACR ≥300 mg/g [≥30 mg/mmol] or AER ≥300 mg/24 hours, approximately equivalent to PCR ≥500 mg/g [≥50 mg/mmol] or PER ≥500 mg/24 hours) in combination with hematuria; ≥2-fold increase in albuminuria in people with significant albuminuria undergoing monitoring; A consistent finding of ACR >700 mg/g [>70 mg/mmol]; Urinary red cell casts, RBC >20 per high power field sustained and not readily explained |\n| Others | Provision management of CKD complications | CKD and hypertension refractory to treatment ≥4 antihypertensive agents; Persistent abnormalities of serum potassium |"
