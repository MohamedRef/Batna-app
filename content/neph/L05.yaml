items:
  # ---------- p98-99: definition and history ----------
  - id: neph.L05.001
    kind: card
    topic: definition
    front: Define acute kidney injury.
    back: An abrupt reduction in kidney function shown by changes in laboratory values (serum creatinine, BUN) and urine output.
    src: { page: 98, quote: "Acute kidney injury (AKI) is abrupt reduction in kidney functions as evidenced by changed in laboratory values" }
    status: unverified
    tags: [high-yield]
  - id: neph.L05.002
    kind: card
    topic: definition
    front: How was acute renal failure diagnosed in 1900?
    back: Clinically, from signs and symptoms such as oliguria, fatigue, vomiting and GI bleeding.
    src: { page: 98, quote: "ARF was diagnosed from signs and symptoms such as oliguria, fatigue, vomiting, Gl bleeding" }
    status: unverified
  - id: neph.L05.003
    kind: cloze
    topic: definition
    text: "Before a unified definition, over {{c1::30}} definitions of AKI/ARF existed in the literature."
    src: { page: 99, quote: "Over 30 definitions of AKI/ ARF existed in the literature" }
    status: unverified
    tags: [numbers]
  - id: neph.L05.004
    kind: order
    topic: definition
    prompt: Put the milestones in the evolving definition of AKI in order (p99 timeline).
    steps:
      - "Bywaters describes ARF in crush injuries from the London bombings"
      - "ADQI devises the RIFLE staging system for ARF (May 2004)"
      - "The term AKI is proposed for the whole spectrum of ARF (September 2004)"
      - "AKIN develops uniform standards for defining and classifying AKI"
      - "KDIGO unifies the definition using RIFLE and AKIN criteria"
    src: { page: 99, quote: "Evolving Definition and Classification of AKI" }
    status: unverified
  - id: neph.L05.005
    kind: card
    topic: definition
    front: Who first described ARF, and in which patients?
    back: E.G. Bywaters, in patients after crush injuries from the London bombings in World War II.
    src: { page: 99, quote: "E.G. Bywaters in his staging system for ARF Observations of patients after crush injuries from the London bombings" }
    status: unverified
  # ---------- p100: classification and diagnosis ----------
  - id: neph.L05.006
    kind: enumerate
    topic: definition
    prompt: Name the three criteria systems used to classify AKI, with what each acronym stands for.
    points:
      - "RIFLE: Risk, Injury, Failure, Loss of kidney function, End-stage renal disease"
      - "AKIN: Acute Kidney Injury Network"
      - "KDIGO: Kidney Disease Improving Global Outcome"
    pass: 3
    src: { page: 100, quote: "RIFLE: Risk, Injury, Failure, Loss of Kidney Function and End Stage Renal Disease" }
    status: unverified
    tags: [high-yield]
  - id: neph.L05.007
    kind: enumerate
    topic: definition
    prompt: AKI is diagnosed if any one of which three KDIGO criteria is met?
    points:
      - "Rise in serum creatinine of at least 0.3 mg/dL within 48 hours"
      - "50% rise over baseline serum creatinine within 7 days"
      - "Urine output under 0.5 mL/kg/hour for at least 6 hours"
    pass: 3
    src: { page: 100, quote: "Increase in serum creatinine (SCr) of at least 0.3 mg/dL within 48 hours" }
    status: unverified
    tags: [high-yield, numbers]
  - id: neph.L05.008
    kind: cloze
    topic: definition
    text: "KDIGO AKI: serum creatinine up by at least {{c1::0.3 mg/dL}} within {{c2::48 hours}}, or up {{c3::50%}} from baseline within 7 days."
    src: { page: 100, quote: "Increase in serum creatinine (SCr) of at least 0.3 mg/dL within 48 hours" }
    status: unverified
    tags: [numbers]
  - id: neph.L05.009
    kind: cloze
    topic: definition
    text: "The urine-output criterion for AKI is less than {{c1::0.5 mL/kg/hour}} for at least {{c2::6 hours}}."
    src: { page: 100, quote: "A urine output of less than 0.5 mL/kg/hour for at least 6 hours" }
    status: unverified
    tags: [numbers]
  - id: neph.L05.010
    kind: table
    topic: definition
    title: "KDIGO staging of AKI (Table 28-1)"
    columns: [Stage, Serum creatinine, Urine output]
    rows:
      - ["Stage 1", "Rise ≥0.3 mg/dL (≥27 µmol/L) or 1.5–1.9 times baseline", "<0.5 mL/kg/h for 6–12 hours"]
      - ["Stage 2", "2–2.9 times baseline", "<0.5 mL/kg/h for ≥12 hours"]
      - ["Stage 3", "3 times baseline, or SCr ≥4 mg/dL (≥354 µmol/L), or need for RRT, or eGFR <35 in patients <18 years", "Anuria for ≥12 hours"]
    blanks: [[0, 1], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 100, quote: "TABLE 28-1: RIFLE, AKIN, and KDIGO Classification Schemes for Acute Kidney Injurya" }
    status: unverified
    tags: [high-yield, numbers]
  - id: neph.L05.011
    kind: table
    topic: definition
    title: "RIFLE categories (Table 28-1)"
    columns: [Category, Creatinine or GFR, Urine output]
    rows:
      - ["Risk", "SCr ×1.5 or GFR fall >25%", "<0.5 mL/kg/h for ≥6 hours"]
      - ["Injury", "SCr ×2 or GFR fall >50%", "<0.5 mL/kg/h for ≥12 hours"]
      - ["Failure", "SCr ×3, or GFR fall >75%, or SCr ≥4 mg/dL with an acute rise of at least 0.5 mg/dL", "Anuria for ≥12 hours"]
      - ["Loss", "Complete loss of function (RRT) for >4 weeks", "-"]
      - ["ESKD", "RRT >3 months", "-"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 100, quote: "TABLE 28-1: RIFLE, AKIN, and KDIGO Classification Schemes for Acute Kidney Injurya" }
    status: unverified
    tags: [numbers]
  - id: neph.L05.012
    kind: table
    topic: definition
    title: "AKIN stages (Table 28-1)"
    columns: [Stage, Serum creatinine, Urine output]
    rows:
      - ["Stage 1", "Rise ≥0.3 mg/dL or 1.5- to 2-fold from baseline", "<0.5 mL/kg/h for ≥6 hours"]
      - ["Stage 2", "Rise >2- to 3-fold from baseline", "<0.5 mL/kg/h for ≥12 hours"]
      - ["Stage 3", "Rise >3-fold, or SCr ≥4 mg/dL with an acute rise of at least 0.5 mg/dL, or need for RRT", "<0.3 mL/kg/h for ≥24 hours or anuria for ≥12 hours"]
    blanks: [[0, 1], [1, 1], [2, 1], [2, 2]]
    src: { page: 100, quote: "TABLE 28-1: RIFLE, AKIN, and KDIGO Classification Schemes for Acute Kidney Injurya" }
    status: unverified
    tags: [numbers]
  - id: neph.L05.013
    kind: mcq
    topic: definition
    stem: A 60-year-old man's creatinine rises from a baseline of 1.0 to 2.4 mg/dL over 4 days after surgery. Urine output stays above 0.5 mL/kg/h. What is his KDIGO AKI stage?
    options:
      - Stage 1
      - Stage 2
      - Stage 3
      - Not AKI, because urine output is normal
    answer: 1
    why:
      - "Stage 1 is 1.5–1.9 times baseline; 2.4 is 2.4 times baseline."
      - "Correct: 2–2.9 times baseline is KDIGO stage 2 (Table 28-1, p100)."
      - "Stage 3 needs 3 times baseline, creatinine ≥4 mg/dL or RRT."
      - "Either criterion is enough; a normal urine output does not exclude AKI."
    src: { page: 100, quote: "TABLE 28-1: RIFLE, AKIN, and KDIGO Classification Schemes for Acute Kidney Injurya" }
    status: unverified
  - id: neph.L05.014
    kind: mcq
    topic: definition
    stem: A septic ICU patient with a normal baseline creatinine passes no urine for 14 hours. Creatinine has risen from 0.9 to 1.3 mg/dL. What is the KDIGO stage?
    options:
      - Stage 1
      - Stage 2
      - Stage 3
      - Not AKI yet
    answer: 2
    why:
      - "The creatinine rise alone (0.4 mg/dL) would be stage 1, but the worst criterion decides the stage."
      - "Stage 2 urine output is <0.5 mL/kg/h for ≥12 hours, not anuria."
      - "Correct: anuria for ≥12 hours is KDIGO stage 3 (Table 28-1, p100)."
      - "A rise ≥0.3 mg/dL within 48 hours already meets the AKI definition."
    src: { page: 100, quote: "TABLE 28-1: RIFLE, AKIN, and KDIGO Classification Schemes for Acute Kidney Injurya" }
    status: unverified
  - id: neph.L05.015
    kind: card
    topic: definition
    front: Which KDIGO stage 3 criterion applies only to patients under 18 years?
    back: eGFR below 35 mL/min/1.73 m².
    src: { page: 100, quote: "TABLE 28-1: RIFLE, AKIN, and KDIGO Classification Schemes for Acute Kidney Injurya" }
    status: unverified
  - id: neph.L05.016
    kind: card
    topic: definition
    front: In RIFLE, what separates "Loss" from "ESKD"?
    back: Loss is complete loss of function needing RRT for more than 4 weeks; ESKD is RRT for more than 3 months.
    src: { page: 100, quote: "TABLE 28-1: RIFLE, AKIN, and KDIGO Classification Schemes for Acute Kidney Injurya" }
    status: unverified
  # ---------- p100-101: limitations ----------
  - id: neph.L05.017
    kind: enumerate
    topic: definition
    prompt: List the limitations of the KDIGO definition and staging of AKI.
    points:
      - "Many etiologies cause AKI, and the criteria do not distinguish between them"
      - "Should management be individualized by better phenotyping (etiology, severity, ability to recover)?"
      - "Use of urine output as the sole criterion"
      - "Serum creatinine kinetics do not reflect GFR well"
      - "Determining the baseline creatinine (first hospital value or historical values?)"
      - "Relying on small creatinine changes may cause a high rate of misdiagnosis"
    pass: 5
    src: { page: 101, quote: "Use of urine output as a sole criterium of AKI" }
    status: unverified
    tags: [high-yield]
  - id: neph.L05.018
    kind: card
    topic: definition
    front: Why can relying on small changes in serum creatinine be a problem when diagnosing AKI?
    back: It may be associated with a high rate of misdiagnosis.
    src: { page: 101, quote: "Relying on small changes in șcr for the diagnosis of AKI may be associated with a high rate of misdiagnosis" }
    status: unverified
  - id: neph.L05.019
    kind: card
    topic: definition
    front: What open question about the baseline creatinine does the book raise?
    back: Whether the first documented creatinine at hospitalization should be used as the baseline rather than historical values.
    src: { page: 101, quote: "Should the first documented SCr at hospitalization be used as the baseline, rather than using historical values?" }
    status: unverified
  - id: neph.L05.020
    kind: table
    topic: definition
    title: "Acute creatinine rises: implications are context-dependent"
    columns: ["", "Induced AKI (good)", "Spontaneous AKI (bad)"]
    rows:
      - ["Examples", "Diuresis/decongestion in HF, RAAS inhibition, intensive BP control, SGLT2i", "Untreated cardiorenal or hepatorenal syndrome, sepsis-induced, nephrotoxin-induced"]
      - ["Outcome", "Outcomes better", "Outcomes worse"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 101, quote: "Acute elevations of serum creatinine: Implications are context-dependent" }
    status: unverified
    tags: [high-yield]
  - id: neph.L05.021
    kind: mcq
    topic: definition
    stem: A patient with heart failure starts an SGLT2 inhibitor and his creatinine rises by 0.3 mg/dL while he loses 3 kg of edema. How does the book frame this creatinine rise?
    options:
      - Spontaneous AKI with worse outcomes
      - Induced AKI with better outcomes
      - Hepatorenal physiology
      - Nephrotoxin-induced AKI
    answer: 1
    why:
      - "Spontaneous AKI is untreated CRS or HRS, sepsis or nephrotoxins."
      - "Correct: decongestion, RAAS inhibition, intensive BP control and SGLT2i are 'induced AKI', with better outcomes (p101)."
      - "There is no liver disease here."
      - "An SGLT2 inhibitor is listed on the good side, not as a nephrotoxin."
    src: { page: 101, quote: "Acute elevations of serum creatinine: Implications are context-dependent" }
    status: unverified
  # ---------- p102-103: AKD, epidemiology, types ----------
  - id: neph.L05.022
    kind: card
    topic: epidemiology
    front: In the ADQI model (KDIGO 2012), what time windows define AKI, AKD and CKD after an injury?
    back: AKI runs from day 0 to day 7 (the first 48 hours being the earliest window). AKD runs from day 7 to day 90. After 90 days the condition is CKD.
    src: { page: 102, quote: "The conceptual overlap among AKI, AKD and CKD (KDIGO AKI guideline 2012)" }
    status: unverified
    tags: [high-yield, numbers]
  - id: neph.L05.023
    kind: card
    topic: epidemiology
    front: How do AKI, AKD and CKD relate in the KDIGO 2012 diagram?
    back: AKI sits inside AKD, and both overlap CKD, so a patient can have AKI on top of CKD.
    src: { page: 102, quote: "The conceptual overlap among AKI, AKD and CKD (KDIGO AKI guideline 2012)" }
    status: unverified
  - id: neph.L05.024
    kind: table
    topic: epidemiology
    title: "AKI by the numbers"
    columns: [Measure, Figure]
    rows:
      - ["Hospitalized patients who develop AKI", "5–7%"]
      - ["Critically ill (ICU-acquired AKI)", "20–60%"]
      - ["Overall mortality despite better care", "Generally exceeds 50%"]
      - ["Non-ICU AKI mortality", "Up to 10%"]
      - ["ICU AKI mortality", "Over 50%"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 102, quote: "Between 5% and 7% of all hospitalized patients develop AKI" }
    status: unverified
    tags: [numbers]
  - id: neph.L05.025
    kind: cloze
    topic: epidemiology
    text: "AKI develops in {{c1::5–7%}} of hospitalized patients and in {{c2::20–60%}} of critically ill patients."
    src: { page: 102, quote: "A greater prevalence of AKI (20-60%) is found in critically ill patients" }
    status: unverified
    tags: [numbers]
  - id: neph.L05.026
    kind: card
    topic: epidemiology
    front: Which has the better prognosis, oliguric or non-oliguric AKI, and what usually causes non-oliguric AKI in hospital?
    back: Non-oliguric AKI has the better prognosis. In hospital it is usually secondary to nephrotoxic agents.
    src: { page: 102, quote: "Non-oliguric has better prognosis than oliguric one" }
    status: unverified
  - id: neph.L05.027
    kind: table
    topic: epidemiology
    title: "ICU vs non-ICU AKI"
    columns: ["", Non-ICU AKI, ICU AKI]
    rows:
      - ["Organs involved", "Kidney usually the only failed organ", "Often sepsis with non-renal multi-organ failure"]
      - ["Mortality", "Up to 10%", "Over 50%"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 103, quote: "ICU AKI is often associated with sepsis and with non-renal multi-organ system failure), with mortality rates of over 50%" }
    status: unverified
  - id: neph.L05.028
    kind: card
    topic: epidemiology
    front: Azotemia vs uremia?
    back: Azotemia is accumulation of nitrogenous waste. Uremia is symptomatic AKI, for example mental-status changes, loss of appetite and tremors.
    src: { page: 103, quote: "Symptomatic AKI (eg MS changes, loss of appetite, tremors)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L05.029
    kind: mcq
    topic: epidemiology
    stem: A man with a creatinine of 4.5 mg/dL after diarrhea is alert, eating and has no tremor. Which term fits?
    options:
      - Uremia
      - Azotemia
      - Renal angina
      - AKD
    answer: 1
    why:
      - "Uremia needs symptoms such as confusion, anorexia or tremor."
      - "Correct: azotemia is accumulation of nitrogenous waste without the uremic symptoms (p103)."
      - "Renal angina is a risk-assessment index, not a state."
      - "AKD describes kidney disease lasting 7–90 days."
    src: { page: 103, quote: "Accumulation of nitrogenous waste" }
    status: unverified
  # ---------- p103-106: etiology ----------
  - id: neph.L05.030
    kind: table
    topic: etiology
    title: "The three groups of AKI causes (p103)"
    columns: [Group, What happens]
    rows:
      - ["Prerenal", "Hypoperfusion, with the renal parenchyma intact"]
      - ["Intrinsic", "Damage involving the renal parenchymal tissue"]
      - ["Postrenal (obstructive)", "Acute obstruction of urinary flow"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 103, quote: "Hypoperfusion in which the integrity of renal parenchyma is preserved" }
    status: unverified
    tags: [high-yield]
  - id: neph.L05.031
    kind: table
    topic: etiology
    title: "Classification of AKI causes (p104 figure)"
    columns: [Group, Subgroup, Examples]
    rows:
      - ["Prerenal", "Decreased effective volume", "Hypovolemia, low cardiac output, CHF, liver failure"]
      - ["Prerenal", "Impaired renal autoregulation", "NSAIDs, ACE-I/ARB, cyclosporine"]
      - ["Intrinsic", "Glomerular", "Acute glomerulonephritis"]
      - ["Intrinsic", "Vascular", "Vasculitis, malignant hypertension, TTP-HUS"]
      - ["Intrinsic", "Tubules and interstitium", "Ischemia, sepsis, exogenous and endogenous nephrotoxins"]
      - ["Postrenal", "Obstruction", "Bladder outlet, or bilateral pelviureteral (or a solitary kidney)"]
    blanks: [[0, 2], [1, 2], [3, 2], [4, 2], [5, 2]]
    src: { page: 104, quote: "Classification of AKI (ARF)" }
    status: unverified
  - id: neph.L05.032
    kind: enumerate
    topic: etiology
    prompt: Name the exogenous and endogenous nephrotoxins in the p104 classification of intrinsic AKI.
    points:
      - "Exogenous: iodinated contrast, aminoglycosides, cisplatin, amphotericin B"
      - "Endogenous: hemolysis, rhabdomyolysis, myeloma, intratubular crystals"
    pass: 2
    src: { page: 104, quote: "Classification of AKI (ARF)" }
    status: unverified
  - id: neph.L05.033
    kind: card
    topic: etiology
    front: When does unilateral obstruction cause postrenal AKI?
    back: When it obstructs a solitary functioning kidney. Otherwise postrenal AKI needs bladder outlet or bilateral pelviureteral obstruction.
    src: { page: 104, quote: "Classification of AKI (ARF)" }
    status: unverified
  - id: neph.L05.034
    kind: card
    topic: etiology
    front: What characterizes prerenal AKI?
    back: Reduced blood delivery to the kidney.
    src: { page: 105, quote: "Prerenal AKI: is characterized by reduced blood delivery to the kidney" }
    status: unverified
  - id: neph.L05.035
    kind: enumerate
    topic: etiology
    prompt: List the common causes of prerenal AKI in the book's three groups.
    points:
      - "Volume depletion: hemorrhage, dehydration, GI fluid losses"
      - "Decreased effective circulating volume: low cardiac output (CHF, MI, hypotension), liver failure, sepsis"
      - "Functional: ACEIs, NSAIDs, ARBs, cyclosporine and tacrolimus"
    pass: 3
    src: { page: 105, quote: "Decrease cardiac output (CHF, MI, hypotension)" }
    status: unverified
    tags: [high-yield]
  - id: neph.L05.036
    kind: card
    topic: etiology
    front: Why can prompt correction of volume depletion restore kidney function to normal in prerenal AKI?
    back: Because no structural damage to the kidney has occurred.
    src: { page: 105, quote: "Prompt correction of volume depletion can restore kidney function to normal because no structural damage to the kidney has occurred" }
    status: unverified
  - id: neph.L05.037
    kind: enumerate
    topic: etiology
    prompt: List the causes of intrinsic AKI.
    points:
      - "Vascular damage (renal thrombosis)"
      - "Glomerular damage (rapidly progressive GN)"
      - "Acute tubular necrosis: ischemia, endogenous toxins, exogenous toxins"
      - "Acute interstitial nephritis: NSAIDs, infections"
    pass: 3
    src: { page: 105, quote: "Glomerular damage (rapidly progressive glomerulonephritis)" }
    status: unverified
  - id: neph.L05.038
    kind: cloze
    topic: etiology
    text: "Acute tubular necrosis accounts for {{c1::40%}} of all AKI cases; postrenal AKI accounts for less than {{c2::10%}}."
    src: { page: 105, quote: "Acute tubular necrosis (ATN) (it accounts for 40% of all cases of AKI)" }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L05.039
    kind: enumerate
    topic: etiology
    prompt: Give the causes of ATN by type.
    points:
      - "Ischemia: hypotension, sepsis"
      - "Endogenous toxins: uric acid, hemoglobin, myoglobin"
      - "Exogenous toxins: aminoglycosides, contrast-induced nephropathy, amphotericin B"
    pass: 3
    src: { page: 105, quote: "Endogenous toxins(uric acid, hemoglobin, myoglobin)" }
    status: unverified
  - id: neph.L05.040
    kind: card
    topic: etiology
    front: What happens to prerenal AKI if the underlying cause is not promptly corrected?
    back: It can progress to intrinsic AKI.
    src: { page: 106, quote: "Prerenal AKI can progress to intrinsic AKI if the underlying condition is not promptly corrected" }
    status: unverified
    tags: [high-yield]
  - id: neph.L05.041
    kind: enumerate
    topic: etiology
    prompt: List the causes of postrenal AKI.
    points:
      - "Bladder outlet obstruction: BPH, prostate cancer, anticholinergic drugs"
      - "Ureteral obstruction: malignancy"
      - "Pelvic or renal obstruction"
    pass: 3
    src: { page: 106, quote: "Postrenal AKI is due to obstruction of urinary outflow" }
    status: unverified
  - id: neph.L05.042
    kind: mcq
    topic: etiology
    stem: A 78-year-old man starts an anticholinergic drug for vertigo. Two days later he has suprapubic fullness and a creatinine of 3.1 mg/dL. Which AKI group is most likely?
    options:
      - Prerenal
      - Intrinsic, ATN
      - Intrinsic, interstitial nephritis
      - Postrenal
    answer: 3
    why:
      - "Nothing here suggests hypoperfusion."
      - "There is no ischemic or toxic insult to the tubules."
      - "Drug-induced AIN follows NSAIDs or antibiotics, not anticholinergics, and gives no bladder fullness."
      - "Correct: anticholinergic drugs cause bladder outlet obstruction, a postrenal cause (p106)."
    src: { page: 106, quote: "Anticholinergic drug" }
    status: unverified
  - id: neph.L05.043
    kind: card
    topic: etiology
    front: Why does rapid relief of postrenal AKI restore kidney function?
    back: Because, when relieved quickly, there is no structural damage.
    src: { page: 106, quote: "Rapid resolution of Postrenal AKI without structural damage restore kidney function" }
    status: unverified
  - id: neph.L05.044
    kind: mcq
    topic: etiology
    stem: Which of these causes AKI by impairing renal autoregulation rather than by reducing volume?
    options:
      - Hemorrhage
      - Diarrhea
      - NSAIDs
      - Burns
    answer: 2
    why:
      - "Hemorrhage is volume depletion."
      - "GI loss is volume depletion."
      - "Correct: NSAIDs, ACE-I/ARB and cyclosporine are functional prerenal causes that impair autoregulation (pp104–105)."
      - "Burns cause volume loss."
    src: { page: 104, quote: "Classification of AKI (ARF)" }
    status: unverified
  # ---------- p106-107: complications and oliguria ----------
  - id: neph.L05.045
    kind: enumerate
    topic: complications
    prompt: List the complications of AKI.
    points:
      - Uremia
      - Hypervolemia and hypovolemia
      - Hyponatremia
      - Hyperkalemia
      - Hyperphosphatemia and hypocalcemia
      - Bleeding
      - Infections
      - Cardiac complications
      - Malnutrition
    pass: 7
    src: { page: 106, quote: "Hyperphosphatemia and Hypocalcemia" }
    status: unverified
    tags: [high-yield]
  - id: neph.L05.046
    kind: card
    topic: complications
    front: What does oliguria mean for an AKI patient, and why are diuretics used?
    back: Oliguria is a well-recognized poor prognostic sign and complicates fluid management. Diuretics are an attempt to convert oliguric AKI to non-oliguric AKI.
    src: { page: 107, quote: "Oliguria is a well-recognized and poor prognostic indicator in patients with AKI" }
    status: unverified
  # ---------- p107-108: history and exam ----------
  - id: neph.L05.047
    kind: card
    topic: workup
    front: What history points to prerenal AKI?
    back: Vomiting, diarrhea, glycosuria causing polyuria, and drugs such as diuretics, NSAIDs, ACE inhibitors and ARBs.
    src: { page: 107, quote: "History: vomiting, diarrhea, glycosuria causing polyuria, and several medications including diuretics, NSAIDs, ACE inhibitors, and ARBs" }
    status: unverified
  - id: neph.L05.048
    kind: enumerate
    topic: workup
    prompt: Which examination signs are often present in prerenal azotemia?
    points:
      - Orthostatic hypotension
      - Tachycardia
      - Reduced jugular venous pressure
