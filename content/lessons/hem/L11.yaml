  # ------------------------------------------------------------------
  - id: hem.L11.lesson5
    title: "عيلة الـ myeloma: الأقارب الغريبين"
    hook: "واحد في الدم، واحد مش بيفرز حاجة، واحد بيغمّق الجلد، وواحد قاعد في مناخيرك."
    minutes: 10
    pages: [186, 189]
    topics: [variants]
    goals:
      - "تعرف الـ variants: PCL، non-secretory، POEMS، plasmacytoma، وكل واحد ليه بيتصرف كده"
      - "تفرّق solitary bone من extramedullary"
      - "تعرف IgD و IgM و IgE myeloma"
    status: unverified
    steps:
      - kind: explain
        remind: [hem.L11.085]
        page: 186
        quote: "Variants of multiple myeloma\n  Multiple myeloma (IgG, IgA, IgD, IgE, and free light chain)\n  Smoldering multiple myeloma\n  Plasma cell leukemia\n  Non secretory myeloma\n  Osteosclerotic myeloma (POEMS syn.)"
        title: "القايمة"
        text: |
          الـ ==variants==:

          - Multiple myeloma (IgG، Immunoglobulin A (IgA)، Immunoglobulin D (IgD)، Immunoglobulin E (IgE)، free light chain)
          - Smoldering
          - **Plasma cell leukemia**
          - **Non-secretory**
          - **Osteosclerotic (POEMS)**
          - **Plasmacytoma**: solitary of bone و extramedullary
      - kind: explain
        page: 187
        quote: "More than 20% plasma cells in the peripheral blood.\nPrimary (de novo) and secondary (leukemic transformation of a previously recognized MM).\nSecondary plasma cell leukemia, constitutes the terminal event in 1% to 2% of patients with MM,\nAggressive disease associated with BM failure and organomegaly\nPoor response to conventional dose therapy"
        title: "Plasma cell leukemia"
        text: |
          - تعريف الكتاب: ==> 20% plasma cells== في الـ peripheral blood.
          - **Primary** (de novo) أو **secondary** (myeloma اتحول leukemic)، والـ secondary هو الـ **terminal event** في **1–2%** من الـ multiple myeloma (MM).
          - **Aggressive**: Bone marrow (BM) failure و organomegaly، والـ response للعلاج العادي ضعيف.

          ليه أشرس؟ افتكر الـ IL-6 والـ stroma (ص 178): الـ myeloma العادي **محتاج** النخاع عشان يعيش. الخلية اللي قدرت تسيب النخاع وتعيش في الدم معناها، تفسير مقبول (مش في الكتاب)، إنها بقت مستقلة عن الـ stroma، يعني clone اتعلّم يعيش لوحده، وده بيخلّيه يوصل للطحال والكبد ويقاوم العلاج.
      - kind: update
        page: 187
        quote: "More than 20% plasma cells in the peripheral blood."
        text: "الـ IMWG (2021) غيّر التعريف لـ ≥ 5% circulating plasma cells. في الامتحان: > 20% زي الكتاب."
        ref: "IMWG consensus on plasma cell leukemia 2021"
      - kind: explain
        page: 187
        quote: "No M component in either the serum or the urine\nIdentification of an M protein in the plasma cells by immunoperoxidase or immunofluorescence methods."
        title: "Non-secretory: بيعمل بس مش بيطلّع"
        text: |
          - **2%** من الـ myeloma.
          - ==No M component== لا في السيرم ولا في البول.
          - التشخيص: تلاقي الـ M protein **جوّه** الـ plasma cells بـ immunoperoxidase أو immunofluorescence.
          - الكلية أقل تأثرًا (منطقي: مفيش light chains نازلة تسد الـ tubules).
      - kind: mnemonic
        page: 187
        quote: "Polyneuropathy, organomegaly, endocrinopathy, M protein and skin changes (POEMS)."
        word: "POEMS"
        parts:
          - { key: "P", text: "Polyneuropathy" }
          - { key: "O", text: "Organomegaly" }
          - { key: "E", text: "Endocrinopathy (DM, gynaecomastia, impotence, amenorrhoea)" }
          - { key: "M", text: "M protein (low level)" }
          - { key: "S", text: "Skin changes (hyperpigmentation, hypertrichosis)" }
        hook: "الـ S هي Skin مش Skeletal، حتى لو الـ lesions osteosclerotic. ده الفخ اللي في سؤال الكتاب."
      - kind: explain
        page: 187
        quote: "BM contains < 5% plasma cells\nLow level paraprotein; hypercalcemia and renal insufficiency rarely occur."
        title: "POEMS عكس الـ myeloma"
        text: |
          - BM فيه ==< 5% plasma cells==، والـ paraprotein قليل.
          - علشان كده الـ hypercalcemia والـ renal insufficiency **نادرين**.
          - Features تانية: lymphadenopathy، diabetes mellitus (DM)، gynaecomastia و impotence عند الرجالة، amenorrhoea عند الستات.
          - التأكيد: **biopsy من الـ osteosclerotic lesion** يبيّن monoclonal plasma cells.
      - kind: check
        page: 187
        quote: "BM contains < 5% plasma cells\nLow level paraprotein; hypercalcemia and renal insufficiency rarely occur."
        question: "Which finding argues against POEMS?"
        options: ["Hypercalcaemia with renal failure", "Hyperpigmentation", "New diabetes mellitus", "Marrow plasma cells 3%"]
        answer: 0
        why:
          - "صح: مع paraprotein قليل، الـ hypercalcemia والـ renal insufficiency rarely occur."
          - "Skin changes هي الـ S في POEMS."
          - "Endocrinopathy هي الـ E."
          - "أقل من 5% ده بالظبط POEMS."
      - kind: explain
        page: 188
        quote: "Solitary Plasmacytoma of Bone\n  Single area of bone destruction due to plasma cell involvement usually located in the spine or long bones of the extremities.\n  No M-protein in serum and/or urine\n  Bone marrow not consistent with multiple myeloma\n  Normal skeletal survey (and MRI of spine and pelvis if performed)\n  No end organ damage other than solitary bone lesion"
        title: "الـ plasmacytoma: myeloma في حتة واحدة"
        text: |
          الـ **plasmacytoma** = تجمع **monoclonal plasma cells** في **مكان واحد**: يا في العضم (**solitary osseous**) يا في الـ soft tissue (**extramedullary**).

          الـ **solitary plasmacytoma of bone**: lesion واحدة (الـ spine أو الـ long bones)، ==no M-protein==، نخاع **مش** myeloma، skeletal survey طبيعي (و MRI للـ spine والـ pelvis)، ومفيش end-organ damage غير الـ lesion دي.

          ليه مفيش M protein؟ التفسير المقبول (مش في الكتاب): الـ clone **صغير ومحصور**، فاللي بيفرزه قليل لدرجة إنه ما بيبانش في الـ electrophoresis. وعشان كده الشروط كلها بتقول «اتأكد إنه مش منتشر»: النخاع والـ survey والـ MRI. لو لقيت حتة تانية، يبقى myeloma مش plasmacytoma.
      - kind: figure
        page: 188
        quote: "Solitary Plasmacytoma of Bone\n  Single area of bone destruction due to plasma cell involvement usually located in the spine or long bones of the extremities.\n  No M-protein in serum and/or urine\n  Bone marrow not consistent with multiple myeloma\n  Normal skeletal survey (and MRI of spine and pelvis if performed)\n  No end organ damage other than solitary bone lesion"
        title: "الـ plasmacytoma جنب الـ myeloma"
        svg: |
