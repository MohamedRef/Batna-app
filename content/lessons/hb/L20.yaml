lecture: hb.L20
lessons:
  # ------------------------------------------------------------------
  - id: hb.L20.lesson1
    title: "العيان التخين ممكن يكون malnourished؟"
    hook: "الـ malnutrition في الـ cirrhosis مش بس جلد على عضم. اعرف تكشفها في 3 دقايق."
    minutes: 9
    pages: [402, 406]
    topics: [malnutrition, screening]
    goals:
      - "تعرّف الـ malnutrition والـ sarcopenic obesity"
      - "تشرح الـ vicious circle بين الـ cirrhosis والـ sarcopenia"
      - "تعمل screening بمعيارين وتحسب الـ dry weight"
    status: unverified
    steps:
      - kind: explain
        page: 402
        title: "Malnutrition ليها وشّين"
        text: |
          كلمة malnutrition في المحاضرة دي ليها معنى أوسع من "قلة أكل":

          - **Malnutrition**: deficiencies and excesses مع بعض.
          - يعني النحيف جدًا والتخين جدًا الاتنين ممكن يبقوا malnourished.

          وأخطر صورة فيهم:

          - ==Sarcopenic obesity==: decreased muscle mass في وجود increased fat mass.

          ليه صعب تشوفها؟ لأن الدهون بتداري ضمور العضل. العيان شكله "مليان"، والميزان طبيعي، والعضل تحت بيدوب. علشان كده محتاج **dedicated testing**.

          وهتشوفها أكتر الأيام الجاية، لأن حالات الـ cirrhosis اللي سببها **NASH** بتزيد، والعيانين دول غالبًا تخان.
      - kind: table
        page: 402
        title: "مين عنده malnutrition؟"
        columns: ["", "Number / fact"]
        rows:
          - ["Compensated cirrhosis", "≈ 20%"]
          - ["Decompensated cirrhosis", "> 50%"]
          - ["Women lose mostly", "Fat deposits"]
          - ["Men lose faster", "Muscle tissue"]
        hide: [[0, 1], [1, 1], [3, 1]]
      - kind: explain
        page: 403
        title: "ليه نهتم؟"
        text: |
          الـ malnutrition بتمشي مع تقدّم الـ liver failure:

          - في الـ compensated: بتبقى مستخبية وأقل وضوحًا.
          - في الـ decompensated: بتبقى باينة.

          والـ ==sarcopenia== (ضمور العضل) كتير بتتاخد كـ equivalent of severe malnutrition. ومرتبطة بـ:
          - **susceptibility to infections**
          - **hepatic encephalopathy**
          - **ascites**
          - وهي independent predictor of lower survival، في الـ cirrhosis وفي الـ liver transplantation.

          علشان كده الكتاب بيقول نعاملهم كـ ==complications of cirrhosis==، زيهم زي الـ ascites والـ varices، مش حاجة جانبية نفتكرها في الآخر.
      - kind: figure
        page: 404
        title: "الدايرة اللي بتقفل على العيان"
        alt: "Vicious circle. Decompensated cirrhosis and malnutrition or sarcopenia feed each other with arrows both ways. Both lead to hepatic encephalopathy, bacterial infections and recurrent ascites, which in turn worsen both. That middle box leads down to reduced overall survival."
        caption: "كل واحد بيزوّد التاني: الـ decompensation بتعمل sarcopenia، والـ sarcopenia بتزوّد الـ HE والـ **infections** والـ **ascites**، واللي بيرجعوا يزوّدوا الاتنين، والنتيجة ==reduced survival==."
        svg: |
          <svg viewBox="0 0 330 270" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="L20a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="fg-head"/></marker>
