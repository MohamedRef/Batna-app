  # ---------- p253-254: absorption and breath tests ----------
  - id: git.L09.067
    kind: card
    topic: absorption-tests
    front: Why can the D-xylose test separate small bowel disease from pancreatic insufficiency?
    back: D-xylose is absorbed by passive diffusion in the small bowel, needs no pancreatic enzymes, and is excreted in urine. Low absorption means mucosal disease, not pancreatic disease.
    src: { page: 253, quote: "D-xylose test can be useful to differentiate SB cause from pancreatic insufficiency." }
    status: unverified
    tags: [high-yield]
  - id: git.L09.068
    kind: cloze
    topic: absorption-tests
    text: "D-xylose test: after an oral dose of {{c1::25 g}}, normally {{c2::5 g}} or more appear in the urine over {{c3::5 hours}}, and blood reaches 25 mg/dL at 2 hours."
    src: { page: 253, quote: "After administration of a 25-g dose orally to a well-hydrated patient, 5 g or more are normally excreted in the urine over 5 hours" }
    status: unverified
    tags: [numbers, high-yield]
  - id: git.L09.069
    kind: mcq
    topic: absorption-tests
    stem: A patient with steatorrhea has low urinary and blood D-xylose after a 25 g oral dose. Where is the problem most likely?
    options:
      - Proximal small intestinal mucosa
      - Exocrine pancreas
      - Biliary tree
      - Terminal ileum only
      - Colon
    answer: 0
    why:
      - "Correct: low urine and blood D-xylose suggests disease of the proximal small bowel mucosa, such as celiac disease (p253)."
      - D-xylose needs no pancreatic enzymes, so pancreatic insufficiency leaves it normal.
      - Absorbing D-xylose does not need bile salts.
      - D-xylose is absorbed proximally, so a disease confined to the terminal ileum does not lower it.
      - The colon does not absorb D-xylose.
    src: { page: 253, quote: "Low urine excretion and blood levels suggest disease of the mucosa of the proximal small intestine such as celiac disease." }
    status: unverified
    tags: [high-yield]
  - id: git.L09.070
