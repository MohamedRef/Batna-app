  - id: git.L09.lesson4
    title: "البروتين والسكريات والـ mucosa: مين بيتمص فين"
    hook: "إنزيمات مطفية بتتشغّل في الأمعاء، و transporter بيجر السكر مع الملح، وخريطة لكل nutrient مكانه."
    minutes: 8
    pages: [247, 249]
    topics: [protein-cho, mucosal]
    goals:
      - "تمشي مع البروتين والسكريات من البُق لحد الخلية"
      - "تعرف ليه الـ lactase deficiency أشهر disaccharidase deficiency"
      - "تعرف كل nutrient بيتمص فين وليه"
    status: unverified
    steps:
      - kind: explain
        page: 247
        title: "البروتين والسكريات"
        quote: "Enterokinase, a brush border enzyme, activates trypsinogen into trypsin, which converts many pancreatic proteases into their active forms."
        text: |
          **البروتين**: الـ **pepsin** يبدأ في المعدة (pH 1–3، ويقف فوق 5)، ويطلّع **cholecystokinin (CCK)** اللي بيشغّل البنكرياس. الـ ==enterokinase== في الـ brush border يحوّل **trypsinogen** لـ **trypsin**، والـ trypsin يشغّل باقي الإنزيمات. الناتج **oligopeptides** وأحماض أمينية.

          **السكريات**: الـ amylase (ريق وبنكرياس) يكسّر النشا، والـ brush border يكسّر الـ disaccharides لـ glucose و galactose و fructose.

          ليه الـ ==enterokinase== مفتاح؟ لأنه أول دومينو: يشغّل الـ trypsin، والـ trypsin يشغّل الباقي. التفسير المقبول (مش في الكتاب): البنكرياس بيطلّع إنزيماته **مطفية** علشان ما يهضمش نفسه، وبتتشغّل بس لما توصل الأمعاء.
      - kind: table
        page: 248
        quote: "Fructose is transported by facilitated diffusion, but glucose and galactose are transported by a sodium-dependent active transporter (SGLT-1)."
        title: "السكر بيدخل الخلية إزاي؟"
        columns: [Sugar, Transport]
        rows:
          - ["Fructose", "Facilitated diffusion"]
          - ["Glucose", "SGLT-1 (sodium-dependent, active)"]
          - ["Galactose", "SGLT-1 (sodium-dependent, active)"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 248
        quote: "Fructose is transported by facilitated diffusion, but glucose and galactose are transported by a sodium-dependent active transporter (SGLT-1)."
        prompt: "الـ glucose بيدخل الخلية بالـ SGLT-1 مع الـ sodium. ليه ده بيهمّك كطبيب حتى بره الـ malabsorption؟"
        answer: |
          الكتاب: الـ glucose والـ galactose بيدخلوا بـ **sodium-dependent active transporter (SGLT-1)**، والـ fructose بـ **facilitated diffusion**.

          التفسير المقبول (مش في الكتاب): لأن الـ sodium بيدخل **مع** الـ glucose، والمية بتمشي وراهم. ده سر الـ **oral rehydration solution**: سكر + ملح بيتمصوا مع بعض حتى في إسهال شديد. ولأن الـ fructose مش محتاج طاقة، لما الكمية تزيد عن قدرة الـ transporter الزيادة بتوصل القولون وتتخمّر.
      - kind: reveal
        page: 248
        quote: "Colonic bacteria ferment unabsorbed carbohydrates into carbon dioxide, methane, hydrogen, and short-chain fatty acids (butyrate, propionate, acetate, and lactate). These fatty acids cause diarrhea. The gases cause abdominal distention and bloating."
        prompt: "عيان عنده lactase deficiency شرب كوباية لبن. ليه بيتنفخ وبيجيله إسهال؟"
        answer: "اللاكتوز ما اتكسرش فوصل القولون. الـ **colonic bacteria** خمّرته لـ **CO2 و methane و hydrogen** (انتفاخ وغازات) و **short-chain fatty acids** (إسهال)."
      - kind: explain
        page: 248
        title: "الـ mucosal phase والـ lactase"
        quote: "They are important in the hydrolysis of disaccharides. (Lactase deficiency of the brush border leads to lactose intolerance. Lactase deficiency, either primary or secondary, is the most common form of disaccharidase deficiency, Secondary lactase deficiency can be result from acute gastroenteritis (rotavirus and giardia infection), chronic alcoholism, celiac sprue, radiation enteritis, regional enteritis, or acquired immunodeficiency syndrome (AIDS) enteropathy. This phase lesion is either due to primarily mucosal disease or resection of part of the intestine."
        text: |
          الـ mucosal phase محتاج **مساحة سليمة** و **brush border enzymes** سليمة.

          ==Lactase deficiency== (primary أو secondary) هو **أشهر disaccharidase deficiency**. الـ secondary بييجي بعد **rotavirus أو giardia**، **alcoholism**، **celiac**، **radiation**، **Crohn**، و **acquired immunodeficiency syndrome (AIDS) enteropathy**.

          وبعد الـ mucosa، الـ **postabsorptive phase**: الـ lymphatics والـ portal blood. لو الـ lymphatics اتسدت، الـ chylomicrons ما تمشيش.

          ليه الـ lactase أول واحد يقع؟ التفسير المقبول (مش في الكتاب): الـ lactase على **قمة** الـ villi، وكمية الـ lactase أصلًا أقل من باقي الـ disaccharidases. فأي مرض يمسح القمة (gastroenteritis، celiac، radiation) يقلّه الأول، وبيرجع لما الـ mucosa تتصلح.
      - kind: check
        page: 248
        quote: "Lactase deficiency, either primary or secondary, is the most common form of disaccharidase deficiency, Secondary lactase deficiency can be result from acute gastroenteritis (rotavirus and giardia infection), chronic alcoholism, celiac sprue, radiation enteritis, regional enteritis, or acquired immunodeficiency syndrome (AIDS) enteropathy."
        question: "A child develops bloating and diarrhea with milk two weeks after rotavirus gastroenteritis. Best explanation?"
        options:
          - "Secondary lactase deficiency"
          - "Exocrine pancreatic insufficiency"
          - "Lymphatic obstruction"
          - "Vitamin B12 malabsorption"
        answer: 0
        why:
          - "صح: الكتاب بيعدّ الـ rotavirus من أسباب الـ secondary lactase deficiency، والـ villi لسه بتتصلح."
          - "البنكرياس مالوش علاقة بالـ rotavirus، والمشكلة مع اللبن بس."
          - "ده postabsorptive، وبيعمل مشكلة في الدهون مش اللاكتوز."
          - "ده terminal ileum، ومش بيعمل انتفاخ مع اللبن."
      - kind: figure
        page: 248
        quote: "Site of absorption of each element: at the Proximal small intestine: fat, iron, and calcium. At the Proximal and middle part: CHO, folic acid, other water"
        title: "خريطة الامتصاص"
        alt: "A vertical small bowel strip from duodenum to colon with labels: proximal part absorbs fat, iron and calcium; proximal and middle parts absorb carbohydrate, folic acid and water-soluble vitamins; middle part absorbs protein; terminal ileum absorbs bile salts and vitamin B12; the whole gut and colon absorb water and electrolytes."
        caption: "الحديد والكالسيوم **فوق**، الـ ==B12== والـ bile salts **تحت** في الـ terminal ileum. عشان كده الـ celiac بيعمل anemia حديد، والـ Crohn في الـ ileum بيعمل نقص B12."
        svg: |
          <svg viewBox="0 0 330 300" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="10" width="40" height="250" rx="16" class="fg-acc"/>
            <rect x="20" y="10" width="40" height="70" rx="16" class="fg-good"/>
            <rect x="20" y="200" width="40" height="60" rx="16" class="fg-bad"/>
            <rect x="10" y="266" width="60" height="28" rx="8" class="fg-box"/>
            <text x="40" y="285" text-anchor="middle" class="t-sm t-b">Colon</text>
            <path d="M62 40 L84 40" class="fg-thin"/>
            <text x="90" y="36" class="t-sm t-b">Proximal</text>
            <text x="90" y="52" class="t-sm">fat, iron, calcium</text>
            <path d="M62 100 L84 100" class="fg-thin"/>
            <text x="90" y="96" class="t-sm t-b">Proximal + middle</text>
            <text x="90" y="112" class="t-sm">carbohydrate, folic acid,</text>
            <text x="90" y="128" class="t-sm">water-soluble vitamins</text>
            <path d="M62 160 L84 160" class="fg-thin"/>
            <text x="90" y="156" class="t-sm t-b">Middle</text>
            <text x="90" y="172" class="t-sm">protein</text>
            <path d="M62 230 L84 230" class="fg-thin"/>
            <text x="90" y="226" class="t-sm t-b">Terminal ileum</text>
            <text x="90" y="242" class="t-sm">bile salts, vitamin B12</text>
            <text x="90" y="284" class="t-sm t-mut">Whole gut + colon: water, electrolytes</text>
          </svg>
      - kind: reveal
        page: 249
        quote: "soluble Vit. At the Middle part: protein, and at the distal part of terminal ileum absorption of bile salt, Vit. B 12 occurs. All intestine and colon: water and electrolytes absorption occurs."
        prompt: "ليه الـ B12 والـ bile salts بالذات في الـ terminal ileum، والحديد في الأول؟"
        answer: |
          الكتاب: **proximal** = fat، iron، calcium؛ **terminal ileum** = bile salts و vitamin B12.

          التفسير المقبول (مش في الكتاب): الحديد محتاج وسط حمضي شوية علشان يفضل ذايب، وده موجود أول ما الأكل يطلع من المعدة. أما الـ B12 فلازم يتربط بالـ **intrinsic factor** ويستنى الـ receptor بتاعه، والـ bile salts بتخلّص شغلها في الدهون الأول، وبعدين تترجع في الآخر للكبد. فالمكان على قد ترتيب الشغل.
      - kind: check
        page: 249
        quote: "soluble Vit. At the Middle part: protein, and at the distal part of terminal ileum absorption of bile salt, Vit. B 12 occurs. All intestine and colon: water and electrolytes absorption occurs. Causes of Malabsorption: table 1 The causes can be classified according to pathogenesis into: A. impaired digestion: due to many diseases: Exocrine pancreatic insufficiency as post pancreatectomy,chronic dvanced pancreatitis, pancreatic hemochro tosis."
        question: "After terminal ileal resection, which pair is lost?"
