lecture: git.L11
lessons:
  # ------------------------------------------------------------------
  - id: git.L11.lesson1
    title: "فوق ولا تحت؟ وبأي سرعة؟"
    hook: "لون الدم وشكله بيقولولك المصدر فين وبينزف بسرعة قد إيه، قبل ما تمسك منظار."
    minutes: 7
    pages: [299, 300]
    topics: [overview]
    goals:
      - "تفرّق بين upper و lower gastrointestinal (GI) bleeding بالـ ligament of Treitz"
      - "تقسّم النزيف حسب المسار وحسب المصدر"
      - "تقرا الـ hematemesis والـ melena والـ hematochezia كمؤشر للسرعة"
    status: unverified
    steps:
      - kind: explain
        page: 299
        quote: "Acute gastrointestinal bleeding is one of the most common medical emergencies with 250,000 to 300,000 hospitalizations annually. The mortality rate is about 6-8%."
        title: "طوارئ يومية"
        text: |
          الـ ==acute GI bleeding== من أشهر الطوارئ الباطنة: **250,000-300,000** دخول مستشفى في السنة، و **mortality** حوالي **6-8%**.

          الخطر الأعلى عند **advanced age** واللي عندهم **severe comorbidities**. ومش دكتور واحد اللي بيعالجه: طوارئ، باطنة، جهاز هضمي، جراحة، interventional radiology، وهيماتولوجي.

          ليه الكبير وصاحب الأمراض بالذات؟ التفسير المقبول (مش في الكتاب): الشاب بيعوّض النزف بسرعة القلب وانقباض الأوعية، فالضغط يفضل ماسك لحد ما يفقد كمية كبيرة. الكبير احتياطيه أقل، وغالبًا على أدوية بتمنع التعويض (زي الـ beta-blockers) أو بتزوّد النزيف (زي الـ aspirin والـ anticoagulants)، والأنيميا عنده ممكن تعمل ischemia في القلب أو المخ. وعلشان كده تخصصات كتير بتشترك: كل واحد ماسك حتة من المشكلة.
      - kind: figure
        page: 299
        quote: "Upper GI bleeding (UGIB) is defined as bleeding derived from a source proximal to the ligament of Treitz. Bleeding from the upper GI tract is approximately 4 times more common than bleeding from the lower GI tract."
        title: "الخط الفاصل: Treitz"
        alt: "A vertical sketch of the GI tract: esophagus, stomach and duodenum above a dashed line labelled ligament of Treitz marked upper GI bleeding, about 4 times more common; small bowel and colon below it marked lower GI bleeding."
        caption: "اللي فوق الـ ligament of Treitz = upper، واللي تحته = lower. والـ upper أشهر بحوالي 4 مرات."
        svg: |
          <svg viewBox="0 0 330 330" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="310" height="140" rx="8" class="fg-acc"/>
            <text x="20" y="34" class="t-b">Upper GI bleeding</text>
            <text x="20" y="56" class="t-sm">Esophagus, stomach, duodenum</text>
            <text x="20" y="78" class="t-sm t-mut">Proximal to the ligament of Treitz</text>
            <text x="20" y="110" class="t-lg t-acc t-b">×4</text>
            <text x="60" y="110" class="t-sm">more common than lower</text>
            <text x="20" y="132" class="t-sm t-mut">Non-variceal or variceal</text>
            <path d="M10 165h310" class="fg-ink" stroke-width="3" stroke-dasharray="8 6"/>
            <text x="165" y="186" text-anchor="middle" class="t-sm t-b">Ligament of Treitz</text>
            <rect x="10" y="200" width="310" height="120" rx="8" class="fg-box"/>
            <text x="20" y="224" class="t-b">Lower GI bleeding</text>
            <text x="20" y="246" class="t-sm">Small bowel and colon</text>
            <text x="20" y="268" class="t-sm t-mut">Lecture 7 owns lower GI bleeding</text>
            <text x="20" y="300" class="t-sm t-mut">Course: acute, chronic, intermittent, occult</text>
          </svg>
      - kind: aside
        tone: trap
        page: 299
        quote: "According to the site: upper and lower GI bleeding based on location in relation to ligament of trietz (at the junction of 2nd and 3rd parts of duodenum)."
        text: |
          الكتاب كاتب إن الـ **ligament of Treitz** عند الـ junction بين الجزء التاني والتالت من الـ duodenum. التشريح المعروف إنه عند الـ **duodenojejunal flexure** (آخر الـ duodenum). لو اتسألت عن التعريف، الأهم: **proximal to the ligament of Treitz** = upper.
      - kind: explain
        page: 299
        quote: "UGI bleeding is more common than LGI bleeding. According to the Severity, it can be divided into:\n  Acute-chronic-intermittent- occult"
        title: "تلات محاور للتقسيم"
        text: |
          الكتاب بيقسّم النزيف بتلات طرق:
          - **حسب المكان**: upper و lower بالـ ligament of Treitz (الرسمة اللي فاتت).
          - **حسب الـ severity (المسار)**: ==acute==، **chronic**، **intermittent**، و ==occult==.
          - والـ upper نفسه **حسب المصدر** (ص 300): **non-variceal** و **variceal**.

          ليه التقسيم ده يفرق معاك؟ لأن كل محور بيجاوب سؤال مختلف. المكان بيحدد أول منظار هتعمله. المسار بيحدد السرعة: الـ acute طوارئ و resuscitation، والـ occult تدوّر على سبب anemia بهدوء. والمصدر بيحدد البروتوكول: الـ variceal له antibiotics و vasoactive drugs وهدف Hb مختلف (درس الدوالي).
      - kind: explain
        page: 300
        quote: "Melena develops after as little as 50–100 mL of blood loss in the upper gastrointestinal tract."
        title: "شكل الدم بيقول السرعة"
        text: |
          - ==Hematemesis with clots==: أخطر شكل؛ النزيف سريع لدرجة إن الجلطة ما لحقتش تدوب.
          - **Hematemesis** بدم فريش، أو **coffee ground** لو أبطأ.
          - ==Melena==: براز أسود زي القطران وريحته وحشة = نزيف upper **بطيء**. ممكن ييجي بعد hematemesis أو حتى نزيف لثة لكام يوم. و **50-100 mL** كفاية تعمله.
          - **Hematochezia** من مصدر upper = نزيف **سريع وكبير** (حوالي **1 لتر**).

          ليه الدم بيسوّد؟ التفسير المقبول (مش في الكتاب): الـ hemoglobin لما يقعد مع حمض المعدة وبكتيريا الأمعاء ساعات بيتأكسد ويتكسّر لمادة سودا، فالأسود معناه إن الدم قعد وقت طويل في الطريق: نزيف بطيء ومن فوق. وليه الـ hematochezia من مصدر upper معناها حوالي لتر؟ لأن الكمية الكبيرة بتحرّك الأمعاء بسرعة (الدم ملين)، فيعدّي قبل ما يلحق يسوّد. والـ clots في القيء، زي ما الكتاب قال، معناها إن النزيف أسرع من إن الجلطة تلحق تدوب.
      - kind: check
        page: 300
        quote: "Hematochezia (fresh bleeding per rectum) if associated with upper GI bleeding presents rapid and huge blood loss (about 1 liter)."
        question: "Fresh blood per rectum and an NG aspirate full of red blood. What does this tell you?"
        options:
          - "Rapid, huge upper GI loss (about 1 liter)"
          - "Slow upper GI bleeding of 50-100 mL"
          - "A lower GI source only"
          - "Bleeding has stopped"
        answer: 0
        why:
          - "صح: hematochezia مع مصدر upper = نزيف سريع وكبير، حوالي لتر."
          - "الـ 50-100 mL دي اللي تكفي تعمل melena."
          - "الـ aspirate الأحمر بيأكد إن المصدر upper."
          - "دم فريش = النزيف شغال."
      - kind: check
        page: 299
        quote: "UGI bleeding is more common than LGI bleeding. According to the Severity, it can be divided into:\n  Acute-chronic-intermittent- occult"
        question: "A 70-year-old has iron-deficiency anemia and a positive fecal occult blood test, with no visible blood ever. How is this bleeding classified by course?"
        options:
          - "Occult"
          - "Acute"
          - "Intermittent"
          - "Variceal"
        answer: 0
        why:
          - "صح: دم مش باين بالعين، اتلقط بالتحليل والأنيميا بس = occult."
          - "الـ acute بيبان: hematemesis أو melena أو hematochezia."
          - "الـ intermittent نوبات نزيف باين بتيجي وتروح، زي الـ Dieulafoy."
          - "Variceal ده تقسيم حسب المصدر، مش حسب المسار."
      - kind: try
        items: [git.L11.003, git.L11.005, git.L11.007, git.L11.009, git.L11.010]
    recap:
      - "UGIB = proximal to the ligament of Treitz، أشهر من الـ lower بـ 4 مرات. Mortality 6-8%، أعلى في الكبار وأصحاب الأمراض."
      - "المسار: acute، chronic، intermittent، occult. والمصدر: non-variceal أو variceal."
      - "Clots في الـ hematemesis = سريع. Melena = بطيء، و 50-100 mL كفاية. Hematochezia من upper = حوالي لتر."
    practice: [git.L11.001, git.L11.002, git.L11.003, git.L11.004, git.L11.005, git.L11.006, git.L11.007, git.L11.008, git.L11.009, git.L11.010, git.L11.011]
