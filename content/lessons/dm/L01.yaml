          فيه **strong genetic component**، بس لوحده مش كفاية: لازم **extragenetic factors** (immunologic و environmental زي الفيروسات).

          يعني الجين بيجهّز الأرض، والـ trigger هو اللي بيولّع. عشان كده مش كل اللي عنده **HLA-DR3/DR4** بيجيله السكر، والكتاب بيقول على الجين إنه **necessary** بس، مش كافي لوحده.
