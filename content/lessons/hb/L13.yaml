      - kind: aside
        tone: trap
        page: 230
        quote: "A small cohort study by Mitchell et al, involving 26 PSC patients, showed a significant positive impact of UDCA (at a dosage of 20 mg/kg/day), not only on liver tests but also on the cholangiographic appearance of the biliary tree as assessed by endoscopic retrograde cholangiopancreatography (ERCP) and liver fibrosis. Another randomized controlled trial with 219 PSC patients treated with UDCA (dosage ranging from 17-23 mg/kg/day) or placebo did not demonstrate a significant improvement in the combined endpoint of \"death or liver transplantation\", although there was a significant reduction in both outcomes (31% and 34% reduction, respectively). Moreover, high doses of UDCA (28-30 mg/kg/day) have been associated with an increased risk of cirrhosis progression, development of varices, CCA, liver transplantation or death. In addition, 3 meta-analyses also failed to show an effect of UDCA on mortality or liver transplantation. Lastly, the most recent guidelines from the British Society of Gastroenterology recommend against long- term treatment of newly diagnosed PSC patients with UDCA."
