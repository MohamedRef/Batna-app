  - id: geri.L11.lesson4
    title: "الـ exacerbation: تعرفها إزاي وتحجز إمتى"
    hook: "مش كل يوم وحش يبقى exacerbation، ومش كل exacerbation تبقى COPD. الدرس ده بيعلّمك تفرّق قبل ما تعالج."
    minutes: 8
    pages: [202, 203]
    topics: [exacerbation]
    goals:
      - "تعرّف الـ exacerbation وتعرف ليه الـ PCR مش دليل"
      - "تعرف الـ work-up والـ differential diagnosis (DD) وليه كل واحد"
      - "تعرف إمتى تحجز المريض"
    status: unverified
    steps:
      - kind: explain
        page: 202
        quote: "Defined as an acute change in sputum volume or purulence, and/or an increase in dyspnea beyond usual day-to-day variation that warrants a change in therapy."
        title: "التعريف"
        text: |
          الـ ==exacerbation==: تغيير حاد في **كمية أو صديد البلغم** و/أو **dyspnea** أكتر من التقلب اليومي، بشكل **يستاهل تغيير العلاج**.

          - **70%** سببها respiratory infection.
          - polymerase chain reaction (PCR) موجب **مش دليل سببية**، إلا **influenza**: اعتبره السبب وعالجه.
          - التشخيص **clinical**؛ الـ sputum culture غالبًا مش بتفرّق colonizer من pathogen.
          - الـ **procalcitonin** بيعلى مع الـ bacterial toxins وممكن يوجّه الـ antibiotic.
      - kind: aside
        tone: tip
        page: 202
        quote: "Definedasan acute change in sputumvolumeor purulence, and/or an increase in dyspnea beyond usual day-to-day variation that warrants a change in therapy."
        text: "مريض الـ COPD عنده أيام حلوة وأيام وحشة. الكلمة المهمة في التعريف: **warrants a change in therapy**. يعني لو اليوم الوحش عدّى بالـ rescue inhaler بتاعه زي كل مرة، ده **day-to-day variation**. لو احتاج تزوّد أو تضيف علاج، يبقى exacerbation."
      - kind: reveal
        page: 202
        quote: "A positive PCR does Not indicate causality,Exceptif influenzapositivewhich should be considered a causative pathogen and treated accordingly."
        prompt: "الـ PCR طلع rhinovirus و influenza A. ليه الكتاب بيعتبر الـ influenza بس هي السبب؟"
        answer: |
          الكتاب: الـ **positive PCR does not indicate causality**، **إلا الـ influenza**: اعتبرها السبب وعالجها.

          التفسير المقبول (مش في الكتاب): الـ PCR حساس جدًا، فبيلقط فيروسات موجودة في الزور من غير ما تكون عاملة المرض. الـ influenza مختلفة: مش بتقعد ساكتة، وليها **علاج antiviral** بيفرق، فمش هنستنى نتأكد.

          ونفس الفكرة في الـ **sputum culture**: كتير مش بتفرّق بين **colonizing flora** والـ pathogen الحقيقي. والـ **procalcitonin** بيعلى مع الـ **bacterial toxins**، فبيساعدك تقرر محتاج antibiotic ولا لأ.
      - kind: explain
        page: 202
        quote: "Investigations and Differential Diagnosis\n  ABG (on air …Or record FiO2 if condition does Not allow on air).\n  Chest Xray (pneumonia , pneumothx).\n  Sputum: inspect purulence, viscosity, send for culture.\n  Suspicion systemic infection: blood culture.\n  U&E, CRP.\n  ECG.\n  Differ. diag\n    Pneumonia.\n    Pneumothx( even small pneumothxon top of COPD mortality up to 50%).\n    Exacerbation of asthma…if in doubt : treat as such (asthma).\n    Pulmembolism.\n    Left heart failure.\n    Drug induced deterioration in resp function (check for sedatives …beta blockers)."
        title: "Work-up و DD"
        text: |
          **Investigations**: arterial blood gas (ABG) (على هوا الأوضة أو اكتب الـ fraction of inspired oxygen (FiO2))، chest X-ray، sputum، blood culture لو شاكك في systemic infection، U&E و C-reactive protein (CRP)، electrocardiogram (ECG).

          **DD**:
          - Pneumonia.
          - ==Pneumothorax==: حتى الصغير فوق chronic obstructive pulmonary disease (COPD) الـ mortality ممكن توصل **50%**.
          - Asthma: لو شاكك، عالجه كـ asthma.
          - pulmonary embolism (PE)، left heart failure.
          - أدوية: **sedatives** و **beta blockers**.

          ليه الـ pneumothorax خطير كده؟ التفسير المقبول (مش في الكتاب): مريض الـ COPD مفيش عنده **reserve**؛ رئة واحدة بتشيل الشغل بالعافية، فلو جزء منها وقع، مفيش احتياطي يعوّض. والـ sedatives بتهدّي مركز التنفس، والـ beta blockers (خصوصًا غير الـ selective) ممكن تضيّق الشُعب.
