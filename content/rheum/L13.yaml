  # ---------- cases ----------
  - id: rheum.L13.044
    kind: case
    topic: nfc-practice
    stem: "A 38-year-old woman has had Raynaud's phenomenon for 1 year. ANA is positive."
    steps:
      - question: "Which test best looks for early microangiopathy?"
        options: ["Nailfold capillaroscopy", "Plain hand X-ray", "Power Doppler of the wrist", "DEXA"]
        answer: 0
        why: "Capillaroscopy detects early microangiopathy, especially in ANA-positive Raynaud's."
      - question: "How do you prepare her?"
        options: ["20–22 °C room for 15–20 min, no caffeine, smoking or cold, then oil", "Warm hands in hot water first", "Cold challenge before scanning", "No preparation"]
        answer: 0
        why: "Acclimatize at room temperature, avoid caffeine, smoking and cold; oil or gel improves transparency."
      - reveal: "Fingers 2–5 show frequent giant capillaries, haemorrhages and moderate capillary loss."
        question: "Which pattern?"
        options: ["Active scleroderma pattern", "Early scleroderma pattern", "Late scleroderma pattern", "Normal"]
        answer: 0
        why: "Frequent giant capillaries and haemorrhages with moderate loss = active."
      - question: "Which complications should you look for, since this pattern correlates with them?"
        options: ["PAH, ILD and digital ulcers", "Uveitis", "Amyloidosis", "Erosive arthritis"]
        answer: 0
        why: "The pattern correlates with PAH, ILD and digital ulcers in SSc."
    src: { page: 216, quote: "Active pattern: Frequent giant capillaries and hemorrhages, moderate capillary loss." }
    status: unverified
