  - id: git.L07.020
    kind: card
    topic: causes
    front: In the book's painless group, blood streaked on the stool suggests what?
    back: Carcinoma of the rectum.
    src: { page: 227, quote: "Blood Streaked on stool Ca. Rectum." }
    status: unverified
  - id: git.L07.021
    kind: mcq
    topic: causes
    stem: A 30-year-old man notices fresh blood on the toilet paper and dripping into the pan after he passes stool. There is no pain. Most likely cause by the book's classification?
    options:
      - Hemorrhoids
      - Anal fissure
      - Ruptured anorectal abscess
      - Ulcerative colitis
      - Diverticular disease
    answer: 0
    why:
      - "Correct: painless blood after defecation is hemorrhoids (p226)."
      - A fissure bleeds with pain.
      - A ruptured abscess is in the painful group.
      - UC gives blood with mucus.
      - Diverticular bleeding is blood alone, usually large volume in older patients.
    src: { page: 226, quote: "Blood After Defecation Hemorrhoids" }
    status: unverified
  # ---------- p227: clinical clues ----------
  - id: git.L07.022
    kind: card
    topic: clinical
    front: Painless large-volume rectal bleeding usually suggests what?
    back: Diverticular bleeding.
    src: { page: 227, quote: "Painless large-volume bleeding usually suggests diverticular bleeding." }
    status: unverified
    tags: [high-yield]
  - id: git.L07.023
    kind: card
    topic: clinical
    front: Bloody diarrhea with cramping pain, urgency or tenesmus suggests which conditions?
    back: Inflammatory bowel disease, infectious colitis, or ischemic colitis.
