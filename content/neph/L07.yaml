    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.022
    kind: card
    topic: adpkd-renal
    front: What is the most common manifestation of ADPKD?
    back: Hypertension. It is a major contributor to renal progression and to cardiovascular morbidity and mortality.
    src: { page: 148, quote: "Hypertension Hypertension is the most common manifestation of ADPKD and a major contributor to renal disease progression and cardiovascular mor-bidity and mortality (Fig. 44.3). Microalbuminuria, proteinuria, and hematuria, which are independent risk factors for renal functional decline, are more common in hypertensive patients with ADPKD. Hypertension also may increase morbidity from valvular heart disease and intracranial aneurysms, which are common in ADPKD." }
    status: unverified
    tags: [high-yield]
  - id: neph.L07.023
    kind: card
    topic: adpkd-renal
    front: Which independent risk factors for renal decline are more common in hypertensive ADPKD patients?
    back: Microalbuminuria, proteinuria and hematuria.
    src: { page: 148, quote: "Hypertension Hypertension is the most common manifestation of ADPKD and a major contributor to renal disease progression and cardiovascular mor-bidity and mortality (Fig. 44.3). Microalbuminuria, proteinuria, and hematuria, which are independent risk factors for renal functional decline, are more common in hypertensive patients with ADPKD. Hypertension also may increase morbidity from valvular heart disease and intracranial aneurysms, which are common in ADPKD." }
    status: unverified
  - id: neph.L07.024
    kind: card
    topic: adpkd-renal
    front: Which ADPKD complications does hypertension make worse besides the kidney?
    back: Valvular heart disease and intracranial aneurysms.
    src: { page: 148, quote: "Hypertension Hypertension is the most common manifestation of ADPKD and a major contributor to renal disease progression and cardiovascular mor-bidity and mortality (Fig. 44.3). Microalbuminuria, proteinuria, and hematuria, which are independent risk factors for renal functional decline, are more common in hypertensive patients with ADPKD. Hypertension also may increase morbidity from valvular heart disease and intracranial aneurysms, which are common in ADPKD." }
    status: unverified
  - id: neph.L07.025
    kind: cloze
    topic: adpkd-renal
    text: "Renal function usually stays normal until the {{c1::fourth to sixth}} decade; once it declines, GFR falls about {{c2::4.4–5.9}} mL/min per year."
    src: { page: 148, quote: "End-Stage Renal Disease In most patients, renal function is maintained within the normal range, despite relentless growth of cysts, until the fourth to sixth decade of life. By the time renal function starts declining, the kidneys usually are greatly enlarged and distorted with little recognizable parenchyma on imaging studies. At this stage, the average rate of GFR decline is 4.4 to 5.9 ml/min per year. Nevertheless, ESRD is not inevitable in ADPKD." }
    status: unverified
    tags: [numbers, high-yield]
  - id: neph.L07.026
    kind: card
    topic: adpkd-renal
    front: Is ESRD inevitable in ADPKD?
    back: No. Up to 77% have preserved renal function at age 50 and 52% at age 73.
    src: { page: 149, quote: "Up to 77% of patients are alive with preserved renal function at age 50 years, and 52% at age 73. Men tend to progress to renal failure more rapidly and require renal replacement therapy at a younger age than women. Other risk factors for renal failure include Black race, diagnosis of ADPKD before age 30, first episode of hematuria before age 30, onset of hypertension before age 35, hyperlipidemia, low level of high-density lipoprotein cholesterol, sickle cell trait, and PKD1 truncating mutations." }
    status: unverified
    tags: [numbers]
  # ---------- p149: risk factors, hematuria ----------
