        title: "الأوعية: VOD"
        text: |
          الـ vascular injury ممكن يمس الـ sinusoids، الـ hepatic veins، أو الـ hepatic arteries.

          ==Veno-occlusive disease (VOD)==: الأوردة الصغيرة جوه الكبد بتتسد، فالدم مش لاقي يطلع.

          - **Causes**: الـ toxic plant alkaloids في certain herbal tea. وكمان الـ VOD serious complication of bone marrow transplant. والـ azathioprine is probably the culprit.
          - **Picture**: من mild viral-like illness لحد fulminant hepatic failure.
          - **Signs**: rapid weight gain، ascites، jaundice، و evidence of portal hypertension.
          - **Forms**: فيه chronic form كمان.

          افهمها كده (التفسير المقبول، مش في الكتاب): الدم بيتحجز في الكبد، فالمية تطلع في البطن والوزن يزيد بسرعة.
