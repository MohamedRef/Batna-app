- id: res.L16.036
  kind: mcq
  topic: zscore
  stem: 'Two students sat different exams. Ali: 70 (mean 60, SD 5). Mona: 80 (mean 70, SD 10). Who did better relative to
    the class?'
  options:
  - 'Ali: Z = +2.0 against Mona''s +1.0'
  - 'Mona: her raw score is higher'
  - 'They did equally well: both are 10 above the mean'
  - It cannot be compared without the full data
  answer: 0
  why:
  - 'Z puts both on the same SD scale: (70 − 60)/5 = 2, (80 − 70)/10 = 1.'
  - Raw scores from different exams can't be compared directly.
