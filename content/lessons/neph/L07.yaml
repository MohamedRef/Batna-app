      - kind: match
        page: 168
        quote: "Table 7.6 Classification of cystic kidney diseases"
        prompt: "وصّل كل مرض بالسن بتاعه في Table 7.6:"
        pairs:
          - ["Juvenile PKD", "Under 10"]
          - ["Nephronophthisis", "Under 15"]
          - ["Medullary cystic kidney", "20–30"]
