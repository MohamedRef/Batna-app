    src: { page: 8, quote: "Differential Diagnosis of MEN 1\n  Sporadic or familial tumors of the pituitary, parathyroid or pancreatic islets.\n  Hypercalcemia from any cause may cause.\n  GIT symptoms and increased gastrin levels, simulating a gastrinoma.\n  Treatment of GIT symptoms with H2 blockers or metoclopramide may cause hyper- prolactinemia, simulating a pituitary prolactinoma." }
