  - id: dm.L03.lesson5
    title: "قيس الكلية صح: ACR و eGFR وامتى تحوّل"
    hook: "عينة بول واحدة بعد ماتش كورة ممكن تشخّص غلط. اعرف تقيس إمتى وإزاي، وامتى الكلية مش بتاعة السكر."
    minutes: 9
    pages: [28, 29]
    topics: [dkd-screening]
    goals:
      - "تعمل screening صح: مين، كل قد إيه، وبإيه"
      - "تعرف ليه 2 من 3 عينات، وإيه اللي بيعلّي الـ albumin مؤقتًا"
      - "تختار معادلة الـ GFR وتعرف امتى تحوّل للـ nephrologist"
    status: unverified
    steps:
      - kind: explain
        page: 28
        title: "الـ Screening"
        quote: "At least annually, urinary albumin (e.g., spot urinary albumin-to- creatinine ratio) and estimated glomerular filtration rate should be assessed in patients with type 1 diabetes who have had the condition for at least 5 years, and in all patients with type 2 diabetes, regardless of treatment."
        text: |
          **مرة في السنة على الأقل:** spot **albumin-to-creatinine ratio (ACR)** + **estimated glomerular filtration rate (eGFR)**.
          - **Type 1:** بعد ==5 سنين== من السكر.
          - **Type 2:** **كلهم** من التشخيص، أيًّا كان العلاج.

          **الـ albuminuria بتتأكد** لما **2 من 3** عينات في **3–6 شهور** يطلعوا abnormal، لأن الـ urinary albumin excretion (UAE) متقلّب.

          ليه type 1 بعد 5 سنين و type 2 من أول يوم؟ نفس منطق العين: type 1 بيتشخّص يوم ما بيبدأ، والكلية محتاجة سنين عشان تتأذي. type 2 بيبقى موجود في السر سنين قبل التشخيص، فممكن الكلية تكون اتأذت خلاص. وليه **الاتنين** (ACR و eGFR)؟ لأن الـ albuminuria بتبان بدري، بس فيه عيانين الـ GFR بيقع عندهم من غير albumin، فلو قست واحد بس هتفوّتهم.
      - kind: table
        page: 28
        quote: "Table 9.1—Definitions of abnormalities in albumin excretion\n| Category | Spot collection (mg/g creatinine) |\n|---|---|\n| Normal | <30 |\n| Increased urinary albumin excretion* | ≥30 |\n*Historically, ratios between 30 and 299 mg/g have been called \"microalbuminuria\" and those >300 mg/g have been called \"macroalbuminuria\" (or clinical albuminuria)."
        title: "Table 9.1: الـ albumin في البول (spot ACR)"
        columns: [Category, "Spot ACR (mg/g creatinine)"]
        rows:
          - ["Normal", "<30"]
          - ["Increased urinary albumin excretion", "≥30"]
          - ["Historically: microalbuminuria", "30–299"]
          - ["Historically: macroalbuminuria (clinical albuminuria)", ">300"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
      - kind: explain
        page: 28
        title: "يعني إيه microalbuminuria و macroalbuminuria؟"
        quote: "Table 9.1—Definitions of abnormalities in albumin excretion\n| Category | Spot collection (mg/g creatinine) |\n|---|---|\n| Normal | <30 |\n| Increased urinary albumin excretion* | ≥30 |\n*Historically, ratios between 30 and 299 mg/g have been called \"microalbuminuria\" and those >300 mg/g have been called \"macroalbuminuria\" (or clinical albuminuria)."
        text: |
          الجدول بيقسم الـ **albumin-to-creatinine ratio (ACR)** في عينة spot لقسمين بس: **Normal <30** و ==Increased urinary albumin excretion ≥30 mg/g==. والهامش تحته بيشرح الاسمين القديمين اللي لسه هتقابلهم في الامتحان والكتب:

          - ==**Microalbuminuria** = ACR 30–299 mg/g==: الكلية بدأت تسرّب **شوية** albumin. ده **أول علامة** للـ DKD، والـ GFR لسه غالبًا طبيعي.
          - ==**Macroalbuminuria** (أو **clinical albuminuria**) = ACR >300 mg/g==: تسريب **كتير**. ده الـ DKD الواضح (overt nephropathy).

          كلمة «micro» **مش** معناها إن الـ albumin جزيء صغير؛ معناها **كمية صغيرة**. وعشان الاسم ده كان بيلخبط، الجدول دلوقتي بيسمّي أي حاجة ≥30 **increased urinary albumin excretion**، والاسمين القدام بقوا «historically».

          التفسير المقبول (مش في الكتاب):
          - نفس الأرقام هي الـ **A categories** في الـ heat map اللي في ص 29: **A1 <30**، **A2 30–300** (= micro)، **A3 >300** (= macro). يعني الاسم القديم والـ A category بيقولوا نفس الحاجة.
          - الـ **dipstick** العادي ما بيقراش البروتين غير لما يوصل تقريبًا لمستوى الـ macro، فالـ microalbuminuria **ما بتبانش** على الـ dipstick. عشان كده الـ screening بالـ **ACR** مش بالـ dipstick.
          - الفرق بينهم مهم: الـ micro مرحلة لسه ممكن ترجع أو تثبت بالعلاج (سكر، ضغط، ACEi/ARB)، والـ macro معناها إن الضرر اتثبّت والـ GFR غالبًا هيبدأ ينزل.
      - kind: check
        page: 28
        quote: "Table 9.1—Definitions of abnormalities in albumin excretion\n| Category | Spot collection (mg/g creatinine) |\n|---|---|\n| Normal | <30 |\n| Increased urinary albumin excretion* | ≥30 |\n*Historically, ratios between 30 and 299 mg/g have been called \"microalbuminuria\" and those >300 mg/g have been called \"macroalbuminuria\" (or clinical albuminuria)."
        question: "Spot ACR is 120 mg/g on 2 of 3 samples. What was this historically called?"
        options: ["Microalbuminuria", "Macroalbuminuria", "Normal albumin excretion", "Nephrotic-range proteinuria"]
        answer: 0
        why:
          - "صح: **30–299 mg/g** = microalbuminuria (دلوقتي: increased urinary albumin excretion، A2)."
          - "الـ macro بتبدأ من **>300 mg/g**."
          - "الطبيعي **<30 mg/g**."
          - "ده مش في الجدول؛ الـ nephrotic range أعلى بكتير من الـ macro."
      - kind: sort
        page: 28
        quote: "4- Urinary Albumin Excretion (UAE):\n  4- Because of variability in the UAE, two of three specimens collected within a 3- to 6- month period should be abnormal before considering a patient to have developed albuminuria.\n  5- Exercise within 24 h, infection, fever, congestive heart failure, marked hyperglycemia, and marked hypertension may elevate UAE over baseline values."
        prompt: "الحاجات دي بتعلّي الـ albumin في البول مؤقتًا؟"
        bins: ["Raises UAE", "Not listed"]
        cards:
          - { text: "Exercise within 24 h", bin: 0 }
          - { text: "Fever", bin: 0 }
          - { text: "Infection", bin: 0 }
          - { text: "Congestive heart failure", bin: 0 }
          - { text: "Marked hyperglycemia", bin: 0 }
          - { text: "Marked hypertension", bin: 0 }
          - { text: "Fasting overnight", bin: 1 }
          - { text: "Taking metformin", bin: 1 }
        why: "كلهم بيزوّدوا الضغط أو الـ permeability في الـ glomerulus مؤقتًا. علشان كده ما تشخّصش من عينة واحدة بعد ماتش كورة أو وهو سخن."
      - kind: check
        page: 28
        quote: "4- Urinary Albumin Excretion (UAE):\n  4- Because of variability in the UAE, two of three specimens collected within a 3- to 6- month period should be abnormal before considering a patient to have developed albuminuria.\n  5- Exercise within 24 h, infection, fever, congestive heart failure, marked hyperglycemia, and marked hypertension may elevate UAE over baseline values."
        question: "ACR 70 mg/g once, the morning after a long run. Next?"
        options: ["Repeat: 2 of 3 abnormal in 3–6 months", "Diagnose DKD from this single result", "Start an ACEi today for albuminuria", "Refer for a kidney biopsy this week"]
        answer: 0
        why:
          - "صح: عينة واحدة مش كفاية، وكمان الـ exercise بيعلّيها."
          - "لازم تأكيد الأول."
          - "مش قبل التأكيد."
          - "مفيش أي referral criterion."
      - kind: table
        page: 29
        quote: "Cockcroft-Gault formula: overestimate.\nMDRD: underestimate.\nCKD-EPI: more accurate. GFR> 60ml/min."
        title: "معادلات الـ GFR"
        columns: [Equation, Result]
        rows:
          - ["Cockcroft-Gault", "Overestimates"]
          - ["MDRD", "Underestimates"]
          - ["CKD-EPI", "More accurate; preferred"]
        hide: [[0, 1], [1, 1], [2, 1]]
      - kind: reveal
        page: 29
        quote: "Cockcroft-Gault formula: overestimate."
        prompt: "ليه الـ Cockcroft-Gault بيزوّد الـ GFR عند مريض السكر؟"
        answer: |
          الكتاب بيقول: Cockcroft-Gault **overestimate**، و MDRD **underestimate**، و **CKD-EPI** أدق وهو المفضّل.

          التفسير المقبول (مش في الكتاب): الـ Cockcroft-Gault فيها **الوزن**، ومريض type 2 غالبًا وزنه عالي من الدهون مش من العضل، فالمعادلة تحسب كلية أكبر من الحقيقة. أما الـ MDRD فاتعملت على ناس عندهم CKD أصلًا، فبتطلّع أرقام أوطى في الناس اللي كليتهم قريبة من الطبيعي. عشان كده الـ CKD-EPI أدق خصوصًا فوق **60**.
      - kind: figure
        page: 29
        title: "الـ heat map: GFR × albuminuria"
        image: { file: dm/L03-ckd-heatmap.webp, book: true }
        caption: "كل خانة فيها عدد الزيارات في السنة. الأخضر **monitor**، الأصفر **treat**، الأحمر **refer**. أي ==A3== أو **G4–G5** = refer."
        alt: "Book figure: KDIGO-style heat map of CKD by GFR categories G1 to G5 (rows) and albuminuria A1 to A3 (columns), coloured green to deep red, with treat or refer and visits per year in each cell."
      - kind: explain
        remind: [dm.L03.014]
        page: 29
        title: "امتى تحوّل للـ nephrologist؟"
        quote: "Referral to a nephrologist for further diagnosis, including the possibility of a kidney biopsy:\n  An active urinary sediment (containing red or white blood cells or cellular casts).\n  Rapidly increasing albuminuria or nephrotic syndrome.\n  Rapidly decreasing eGFR."
        text: |
          لما تشك إن السبب **مش السكر** (وممكن **biopsy**):
          1. **Active urinary sediment:** Red blood cells (RBCs)، white blood cells (WBCs)، أو cellular casts
          2. **Rapidly increasing albuminuria** أو **nephrotic syndrome**
          3. **Rapidly decreasing eGFR**
          4. ==Absence of retinopathy== في **type 1**

          الأربعة بيقولوا نفس الحاجة: الصورة **مش شبه الـ DKD العادي**. الـ DKD بيمشي ببطء ومن غير دم ولا casts في البول، فأي **active sediment** أو تدهور **سريع** معناه glomerulonephritis أو سبب تاني ممكن يتعالج، وده اللي الـ biopsy بتلاقيه.
      - kind: reveal
        page: 29
        quote: "Absence of retinopathy (in type 1 diabetes)."
        prompt: "ليه غياب الـ retinopathy في type 1 بيخليك تشك في الـ DKD؟"
        answer: |
          الـ retinopathy والـ nephropathy أولاد نفس المرض: **microangiopathy** بنفس الـ duration ونفس الـ control. في type 1 بالذات، الاتنين بيمشوا مع بعض تقريبًا.

          لو الكلية بايظة والعين سليمة، يبقى غالبًا في **سبب تاني** للكلية (glomerulonephritis مثلًا)، ومحتاج nephrologist. (التفسير فسيولوجي؛ القاعدة من الكتاب.)
      - kind: try
        items: [dm.L03.009, dm.L03.011, dm.L03.012, dm.L03.013, dm.L03.014]
    recap:
      - "Screen سنويًا (ACR + eGFR): type 1 بعد 5 سنين، type 2 من التشخيص أيًا كان العلاج."
      - "Table 9.1: ACR طبيعي <30؛ ≥30 = increased. قديمًا: micro 30–299 (A2)، macro >300 (A3)."
      - "Albuminuria = 2 من 3 في 3–6 شهور؛ exercise خلال 24 ساعة، infection، fever، CHF، سكر أو ضغط عالي جدًا بيعلّوها مؤقتًا."
      - "CKD-EPI أدق؛ Cockcroft-Gault بيزوّد (الوزن)؛ MDRD بيقلل."
      - "Heat map: GFR × albuminuria؛ A3 أو G4–G5 = refer."
      - "Refer: active sediment، nephrotic/albuminuria بتزيد بسرعة، eGFR بيقع بسرعة، type 1 من غير retinopathy."
    practice: [dm.L03.009, dm.L03.010, dm.L03.011, dm.L03.012, dm.L03.013, dm.L03.014, dm.L03.015, dm.L03.016, dm.L03.017, dm.L03.018, dm.L03.019, dm.L03.061, dm.L03.062, dm.L03.063, dm.L03.064, dm.L03.084]
