  - id: res.L04.056
    kind: mcq
    topic: designs
    stem: In establishing an exposure-outcome causal association, which criterion is the most essential?
    options: [Consistency of relationship, Temporal relationship, Duration of relationship, Strength of relationship]
    answer: 1
    why:
      - Consistency supports causation but is not essential.
      - The cause must come before the effect; without that, nothing else proves causation.
      - Duration is not one of the key criteria.
      - A strong association supports causation but can still be confounded.
    src: { page: 52, quote: "In establishing exposure-outcome 'causal association', what is the most essential criterion?\n  A. Consistency of relationship\n  B. Temporal relationship\n  C. Duration of relationship\n  D. Strength of relationship" }
    status: unverified
    tags: [book-question, high-yield]
