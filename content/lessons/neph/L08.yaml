        alt: "Two book images of type I MPGN: above, Masson's trichrome X400 with red fuchsinophilic subendothelial deposits along the capillary walls; below, an electron micrograph with blue arrows on the original basement membrane, red arrows on the new inner membrane, and dense deposits between them."
      - kind: explain
        page: 238
        title: "الخطين جايين منين؟"
        quote: "The double contour forms due to synthesis of basement-membrane-like material between the endothelial cells and the deposits."
        text: |
          الكتاب: الـ ==double contour== (اسمه كمان **tram-tracking**، **splitting**، أو **duplication** of the GBM) بيتكوّن من **synthesis of basement-membrane-like material between the endothelial cells and the deposits**. وهو classic في ==type I و III MPGN==. وفي الـ EM: الـ **original** GBM برّه، والـ **neoformed** جوّه، والـ deposits بينهم.

          ليه الـ endothelium بيبني غشا جديد؟ التفسير المقبول (مش في الكتاب): لما الـ deposits تقعد تحته، أو لما الـ endothelium نفسه يتعوّر، الخلية بتتفصل عن الغشا القديم وتبني غشا جديد تحتها (زي ما الجلد بيبني طبقة تحت قشرة الجرح). والـ mesangial cells اللي بتزحف (الـ interposition) بتساعد في البنا. النتيجة خطين أسود بينهم حاجة. يعني الـ double contour معناه **endothelial injury مزمن**، والـ deposits سبب من أسبابه بس مش السبب الوحيد.

          ليه الـ TMA المزمن والـ transplant glomerulopathy بيعملوا نفس الخطين؟ التفسير المقبول (مش في الكتاب): لأن الـ double contour هو **رد فعل الـ endothelium** المتعوّر، مش علامة مرض واحد. أي حاجة بتعوّر الـ endothelium مرة ورا مرة (immune complexes، TMA، antibodies ضد الكلية المزروعة) بتخليه يبني غشا جديد تحته. عشان كده لازم IF و EM: لو فيه deposits يبقى MPGN، لو مفيش يبقى TMA أو chronic ABMR.

          إزاي تختار الكلمة الصح في الامتحان؟ التفسير المقبول (مش في الكتاب): «**tram-track**» و «**double contour**» و «**GBM duplication**» كلهم نفس الشكل. «**spikes**» شكل تاني (membranous). «**basket-weave**» أو تقطيع الغشا طبقات = Alport. فلما يديك صورة silver، حدد الشكل الأول، وبعدين ارجع للـ IF عشان تعرف السبب.
      - kind: sort
        page: 239
        quote: "They can be also seen in lupus nephritis, cryoglobulinemia and some diseases in which subendothelial immune deposits are not demonstrated like TMA and chronic transplant glomerulopathy"
        prompt: "الـ double contour هنا جاي مع immune deposits ولا من غيرها؟"
        bins: ["With subendothelial immune deposits", "Without immune deposits"]
