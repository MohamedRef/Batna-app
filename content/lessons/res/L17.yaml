schema: batna.lesson/v1
lecture: res.L17
lessons:
  # ------------------------------------------------------------------
  - id: res.L17.lesson1
    title: "الصدفة وفرضية العدم"
    hook: "دواك نزّل الضغط 10 مللي أكتر من الدوا التاني. شطارة ولا صدفة؟ ده بالظبط اللي الـ hypothesis testing بيجاوب عليه."
    minutes: 8
    pages: [2, 11]
    topics: ["chance", "steps", "hypotheses"]
    goals:
      - "تفهم ليه محتاجين test of significance أصلًا"
      - "ترتّب خطوات التحليل الإحصائي"
      - "تكتب H0 و Ha صح لأي سؤال"
    status: unverified
    steps:
      - kind: explain
        page: 2
        quote: "Because no study is perfect, there is always a chance for error; perhaps this is one of five chances in 100 (p < 0.05), that such an extreme result has happened by chance"
        title: "مفيش دراسة كاملة"
        text: |
          مهما كانت الدراسة محترمة، فيه دايمًا احتمال إن النتيجة طلعت كده ==by chance==.

          لما نقول **p < 0.05** فإحنا بنقول: فيه حوالي 5 فرص من 100 إن نتيجة متطرفة زي دي تحصل بالصدفة.

          عشان كده قبل ما نصدّق أي فرق أو علاقة، لازم نستبعد الصدفة.
      - kind: update
        page: 2
        quote: "Because no study is perfect, there is always a chance for error; perhaps this is one of five chances in 100 (p < 0.05), that such an extreme result has happened by chance"
        text: "بالدقة: الـ P-value هي probability نتيجة بالتطرف ده أو أكتر لو الـ H0 صح. مش احتمال إن الـ extreme result حصلت by chance، ومش احتمال إن الـ H0 صح. في الامتحان اكتب جملة السلايد."
        ref: "Wasserstein and Lazar, ASA statement on p-values, 2016"
      - kind: explain
        page: 3
        quote: |
          To rule out the effect of chance
          Formulate a hypothesis
          Testing it appropriately
        title: "إزاي نستبعد الصدفة؟"
        text: |
          خطوتين بس:

          - نكتب ==hypothesis== (فرضية).
          - ونختبرها بالـ **test** المناسب.

          باقي المحاضرة كلها تفاصيل الخطوتين دول.
      - kind: check
        page: 4
        quote: |
          OBSERVATIONAL
          Investigators study people and exposures "in nature"
          Comparison Group?
          NO: DESCRIPTIVE
          Correlational
          Case Series
          Case Reports
          Cross-Sectional
          YES: ANALYTIC
          Case-Control
          Cohort
        question: "Investigators observe people and exposures without assigning anything, and they include a comparison group. Which design family is this?"
        options:
          - "Analytic observational (case-control, cohort)"
          - "Descriptive observational"
          - "Experimental"
          - "Laboratory trial"
        answer: 0
        why:
          - "صح: observational + comparison group = analytic."
          - "الـ descriptive مفيهاش comparison group."
          - "الـ experimental الباحث هو اللي بيوزّع الـ exposure بالـ randomization."
          - "الـ laboratory trial نوع من الـ experimental."
      - kind: explain
        page: 5
        quote: |
          Types of statistical analysis
          Differences: Compare one variable (the dependent)
          Associations: Compare two or more variables, one of them must be dependent and the others are independents within the same group.
        title: "فروق ولا علاقات؟"
        text: |
          التحليل الإحصائي نوعين:

          - **Differences**: بنقارن متغير واحد (الـ ==dependent==) بين مجموعات. مثلًا متوسط الكوليسترول في مجموعتين.
          - **Associations**: بنقارن متغيرين أو أكتر جوه نفس المجموعة، واحد dependent والباقي ==independent==. مثلًا التدخين والـ lung cancer.

          في مثال التدخين: التدخين هو الـ exposure أو الـ independent، والمرض هو الـ outcome أو الـ dependent.
      - kind: order
        page: 6
        quote: |
          Formulate hypotheses
          H0 Null hypothesis: No significant difference/association
          H1 or Ha Alternative hypothesis: Significant difference/association
          Determine the type of the statistical test.
          Determine the significance according to:
          Calculated value of the test.
          P value
          Confidence interval (CI)
        prompt: "رتّب خطوات الـ statistical analysis"
        steps:
          - "Formulate hypotheses (H0 and H1)"
          - "Determine the type of the statistical test"
          - "Determine the significance (test value, P value, CI)"
        why: "الأول بتقول بتدوّر على إيه (الفرضيات)، بعدين تختار الأداة (الـ test)، وفي الآخر تحكم بالنتيجة."
      - kind: mnemonic
        page: 6
        quote: |
          Determine the significance according to:
          Calculated value of the test.
          P value
          Confidence interval (CI)
        word: "CPC"
        parts:
          - { key: "C", text: "Calculated value of the test: الرقم اللي طلع من الحساب." }
          - { key: "P", text: "P value: احتمال الصدفة." }
          - { key: "C", text: "Confidence interval (CI)." }
        hook: "بتحكم على الـ significance بـ 3 حاجات: Calculated value، P value، و CI."
      - kind: figure
        page: 8
        quote: |
          Null hypothesis H0 contains a statement of equality such as ≥ , = or ≤.
          Alternative hypothesis Ha contains a statement of inequality such as < , ≠ or >
          Complementary Statements
        title: "H0 و Ha: وشّين لعملة واحدة"
        alt: "Two boxes. Left: H0, the null hypothesis, a statement of equality with the signs equals, greater than or equal, less than or equal. Right: Ha, the alternative hypothesis, a statement of inequality with the signs not equal, less than, greater than. A bracket joins them: complementary statements, if one is false the other is true."
        caption: "الـ **H0** فيها علامة ==equality== (= أو ≥ أو ≤)، والـ **Ha** فيها inequality (≠ أو < أو >). واحدة بس فيهم صح."
        svg: |
          <svg viewBox="0 0 340 190" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="20" width="140" height="78" rx="10" class="fg-ink"/>
            <text x="80" y="44" text-anchor="middle" class="t-lg t-b">H0 (null)</text>
            <text x="80" y="66" text-anchor="middle" class="t-sm">equality</text>
            <text x="80" y="86" text-anchor="middle" class="t-b">=   ≥   ≤</text>
            <rect x="190" y="20" width="140" height="78" rx="10" class="fg-acc"/>
            <text x="260" y="44" text-anchor="middle" class="t-lg t-b t-acc">Ha (alternative)</text>
            <text x="260" y="66" text-anchor="middle" class="t-sm">inequality</text>
            <text x="260" y="86" text-anchor="middle" class="t-b">≠   &lt;   &gt;</text>
            <path d="M80 104 L80 128 L260 128 L260 104" class="fg-thin"/>
            <text x="170" y="148" text-anchor="middle" class="t-sm t-b">Complementary statements</text>
            <text x="170" y="170" text-anchor="middle" class="t-sm t-mut">If one is false, the other is true</text>
          </svg>
      - kind: explain
        page: 9
        quote: |
          Example:
          Ho : There is no difference in the reduction of blood pressure achieved by drug A and B. the mean decrease of blood pressure achieved by drug A ( X1) is equal to the mean decrease in blood pressure achieved by drug B (X 2).
          HA: There is a difference in the reduction of blood pressure achieved by drug A and B. The mean decrease in blood pressure achieved by drug A is different from that of drug B.
        title: "مثال: دوا A ودوا B"
        text: |
          **H0**: مفيش فرق في نزول الضغط بين دوا A ودوا B؛ متوسط النزول مع A (X̄1) = متوسطه مع B (X̄2).

          **HA**: فيه فرق؛ متوسط النزول مع A مختلف عن B.

          لاحظ إن الـ HA هنا مش بتقول مين أحسن، بتقول **مختلف** بس. ده سؤال عن ==الفرق== في الاتجاهين.
      - kind: check
        page: 9
        quote: |
          Example:
          Ho : There is no difference in the reduction of blood pressure achieved by drug A and B. the mean decrease of blood pressure achieved by drug A ( X1) is equal to the mean decrease in blood pressure achieved by drug B (X 2).
          HA: There is a difference in the reduction of blood pressure achieved by drug A and B. The mean decrease in blood pressure achieved by drug A is different from that of drug B.
        question: "For the drug A versus drug B trial, which statement is the null hypothesis?"
        options:
          - "Mean BP decrease with drug A equals that with drug B"
          - "Drug A lowers BP more than drug B"
          - "The mean decrease with A differs from B"
          - "Both drugs lower BP"
        answer: 0
        why:
          - "صح: الـ H0 دايمًا equality: X̄1 = X̄2."
          - "دي alternative في اتجاه واحد."
          - "دي الـ HA."
          - "دي مش مقارنة بينهم أصلًا."
      - kind: explain
        page: 11
        quote: |
          Null hypothesis ( H0 )
          We would reject the Null Hypothesis based upon simple inequality of means.
          The first mean could be greater than the second or the second greater than the first.
          Our Null Hypothesis distribution for an α = .05 would look something like this
          1 - α = 0.95
          α = .05
        title: "ليه الرفض في الطرفين؟"
        text: |
          إحنا بنرفض الـ H0 لمجرد إن المتوسطين ==مش متساويين==: الأول ممكن يكون أكبر من التاني، أو التاني أكبر من الأول.

          عشان كده الـ α = 0.05 بتتقسم على الطرفين، **0.025** في كل طرف، والنص (1 − α = 0.95) هو منطقة عدم الرفض.
      - kind: aside
        tone: "joke"
        page: 8
        quote: |
          Null hypothesis H0 contains a statement of equality such as ≥ , = or ≤.
          Alternative hypothesis Ha contains a statement of inequality such as < , ≠ or >
        text: "الـ Null hypothesis والـ Alternative hypothesis زي اتنين بيتخانقوا على كرسي واحد: «If I am false, you are true». 😄 مفيش حل وسط، واحد بس اللي يقعد."
      - kind: try
        items: ["res.L17.001", "res.L17.008", "res.L17.012"]
    recap:
      - "مفيش دراسة كاملة؛ لازم نستبعد الصدفة بـ hypothesis و test."
      - "Differences = متغير dependent بين مجموعات؛ Associations = متغيرات في نفس المجموعة."
      - "الخطوات: فرضيات، نوع الـ test، الـ significance (test value و P و CI)."
      - "الـ H0 فيها equality، والـ Ha فيها inequality، ومكمّلين لبعض."
    practice: [res.L17.001, res.L17.002, res.L17.003, res.L17.004, res.L17.005, res.L17.006, res.L17.007, res.L17.008, res.L17.009, res.L17.012, res.L17.013, res.L17.014, res.L17.015, res.L17.016]
