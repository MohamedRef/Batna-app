          - "الـ follicular والـ marginal zone مش من الاستثناءات."
          - "مش مذكورين كاستثناء."
          - "مش مذكور كاستثناء."
      - kind: aside
        tone: trap
        page: 204
        quote: "| Extremely rare | Common | GIT involvement |\n| Extremely rare | Common | Skin involvement |\n| Extremely rare | Occasional | CNS involvement |"
        text: "الـ GIT والـ skin: **common** في الـ NHL و **extremely rare** في الـ Hodgkin. والـ CNS: **occasional** في الـ NHL. فأي lymphoma في المعدة (زي الـ MALT) أو في الجلد (زي الـ mycosis fungoides) خده على إنه NHL من غير تفكير."
