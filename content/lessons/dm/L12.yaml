  - id: dm.L12.lesson8
    title: "الكبد والـ incretins والـ SGLT2i، والـ insulin الأأمن"
    hook: "مين من الـ DPP-4i يصلح مع الكبد، ليه الـ liraglutide بيتكلموا عنه في الـ NASH، وليه الـ insulin هو الملك هنا."
