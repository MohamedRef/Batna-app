            <rect x="175" y="202" width="145" height="38" rx="8" class="fg-acc"/>
            <text x="248" y="218" text-anchor="middle" class="t-sm t-b">Kidney: EPO</text>
            <text x="248" y="233" text-anchor="middle" class="t-sm">low or subnormal</text>
          </svg>
      - kind: explain
        page: 161
        title: "النخاع"
        quote: "BM examination trephine biopsy may be diagnostic, typical features,\n  1) Hyprcellularity\n  2) Trilineage hyperplasia\n  3) Abnormal megakaryocytes (clustering with giant forms and increased ploidy)"
        text: |
          الـ **trephine** في الـ PV ممكن يبقى diagnostic:
          1. **Hypercellularity**
          2. ==Trilineage hyperplasia== (التلات خطوط زايدين، مش الحمرا بس)
          3. **Abnormal megakaryocytes**: clusters، giant forms، و ploidy أعلى
          4. **Fibrosis** ممكن تبقى موجودة (ص 162)
          5. نخاع طبيعي **ما يستبعدش** PV (ص 162)

          الـ trilineage ده هو الفرق عن الـ secondary: في الـ secondary الـ EPO بيزقّ الخط الأحمر بس.
      - kind: check
        page: 161
        quote: "Serum erythropoietin is low/subnormal in PRV , while normal/high in 2ry erythrocytosis."
        question: "Hb 19 g/dL. Which result best separates PV from secondary erythrocytosis?"
        options: ["Low serum EPO", "Raised red cell mass", "Raised hematocrit", "Normal MCV"]
        answer: 0
        why:
          - "صح: الـ EPO واطي في الـ PV وعالي أو normal في الـ secondary."
          - "الـ red cell mass عالي في الاتنين."
          - "الـ Hct عالي في الاتنين."
          - "الـ MCV ما بيفرقش."
