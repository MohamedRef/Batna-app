    hook: "الـ correlation بيقولك العلاقة قوية. الـ regression بيقولك: لو الكوليسترول 180، الضغط هيبقى كام؟"
    minutes: 7
    pages: [19, 36]
    topics: [regression]
    goals:
      - "تفرّق بين الـ correlation والـ regression"
      - "تفهم Y = a + bX: الـ intercept والـ slope"
      - "تستخدم المعادلة في التوقع"
    status: unverified
    steps:
      - kind: explain
        page: 19
        quote: "Regression line\nWe can draw a line through the scatter of points, as a simple summary of the relationship between these two variables.\nThis fitted line is called the \"regression line\".\nIt is used to predict the value of dependent variable when the value of independent variable is known."
        title: "خط في نص النقط"
        text: |
          نقدر نرسم **خط** جوه سحابة النقط يلخص العلاقة. ده الـ ==regression line== (الـ fitted line، أحسن خط بيعدي وسط النقط).

          فايدته: **نتوقع** قيمة الـ dependent لما نعرف قيمة الـ independent.
      - kind: explain
        page: 20
        quote: "Correlation & regression\nRelationship between two variables (linear) extending to predict the value of one variable from the other.\nOne of the major differences between correlation & regression is the purpose of analysis whether it is to describe a relationship or to predict a value."
        title: "الفرق في الغرض"
        text: |
          الاتنين بيدرسوا علاقة **linear** بين متغيرين. الفرق الأساسي في **الغرض** (==purpose of analysis==):

          - **Correlation** ← **يوصف** العلاقة (قوية؟ طردية؟).
          - **Regression** ← **يتوقع** قيمة متغير من التاني.
      - kind: figure
        page: 21
        quote: "Scatter graph & regression line\nRegression line\ny\nX\na\nb\none unit"
        title: "a و b على الرسمة"
        alt: "A scatter of dots with a straight regression line rising to the right. Where the line meets the y axis it is labelled a, the intercept. A small step of one unit along x and the rise it causes along y is labelled b, the slope."
        caption: "**a** = النقطة اللي الخط بيقطع فيها محور y (لما X = صفر). **b** = الخط بيطلع قد إيه لكل **unit** زيادة في X."
        svg: |
