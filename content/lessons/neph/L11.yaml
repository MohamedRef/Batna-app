  - id: neph.L11.lesson3
    title: "الـ AKI في الحمل: النتيجة والتشخيص والعلاج"
    hook: "إمتى تعمل biopsy لواحدة حامل، وإمتى تولّدها الأول؟ ولي الـ bicarbonate لوحده بيكدب؟"
    minutes: 8
    pages: [359, 364]
    topics: [aki-outcomes, aki-dx, aki-rx]
    goals:
      - "تعرف تمن الـ AKI على الأم والجنين بالأرقام"
      - "تمشي بخطوات تشخيص الـ AKI في الحمل وتعرف توقيت الـ biopsy"
      - "تعرف العلاج العام والأدوية المسموحة والممنوعة"
    status: unverified
    steps:
      - kind: explain
        page: 360
        title: "التمن غالي"
        quote: "deaths (13.3% vs. 4.2%), and a longer intensive care unit stay of 2.1 days than did women without pregnancy- related AKI"
        text: |
          في الـ meta-analysis بتاعة Liu:
          - وفيات الأم ==13.3%== مقابل 4.2%، و ICU أطول بيومين.
          - Cesarean ×1.5، نزيف ×1.3، HELLP ×1.9، **abruption ×2**.
          - الجنين: يتولد أبدري بـ 0.7 أسبوع، أخف بـ **740 g**، و stillbirth ×3.4.

          وحوالي ==2.4%== بيوصلوا لـ **ESKD** ومحتاجين dialysis.
      - kind: explain
        page: 361
        title: "مفيش criteria خاصة: تابع الـ trend"
        quote: "Currently, there are no distinct criteria for the diagnosis of AKI in pregnancy. Attention should be paid to trends in serum creatinine"
        text: |
          طلعة **0.4 mg/dL** (يعني AKIN stage 1 بس) ممكن تبقى إصابة كبيرة في الحمل.

          مثال الكتاب: ضغط جديد + كرياتينين طلع ==0.3 mg/dL== + إنزيمات كبد عالية + صفائح واطية = **AKI** ومحتاجة متابعة قريبة.
      - kind: explain
        page: 361
        title: "الـ work-up"
        quote: "Diagnostic evaluation should include urinalysis, urine microscopy, comprehensive metabolic panel, coagulation panel, and appropriate serological workup"
        text: |
          1. **History**: CKD، ضغط مزمن، سكر، preeclampsia قبل كده، SLE، GN.
          2. **الشهر**: أول الحمل غير آخره غير بعد الولادة.
          3. **Labs**: urinalysis و microscopy، metabolic و coagulation panels، serology، ومراجعة الأدوية.
          4. **Ultrasound**: يفرّق الـ hydronephrosis المرضي من ==physiological hydronephrosis==، و Doppler لو شاكك في embolism.
      - kind: aside
        tone: trap
        page: 362
        quote: "liver and can complicate the diagnosis of lupus nephritis"
        text: |
          الـ ==complement== بيعلى في الحمل (الكبد بيصنّع أكتر). فـ C3 طبيعي مش بينفي **lupus nephritis** عند حامل.
      - kind: figure
        page: 362
        quote: "notably after 25 weeks, it is recommended to biopsy in the first and second trimesters, and best to avoid in the third trimester"
        title: "إمتى الـ biopsy أمان؟"
        alt: "A horizontal gestation bar from 0 to 40 weeks. Weeks 0 to 25 are green, labelled biopsy if it changes treatment. After 25 weeks the bar turns red, labelled higher complication risk; if the fetus is viable consider delivery first, then biopsy."
        caption: "قبل ==25 أسبوع== الـ biopsy مقبولة لو هتغيّر العلاج. بعدها المخاطرة بتعلى، ولو الجنين viable فكّر في **الولادة الأول**."
        svg: |
          <svg viewBox="0 0 330 170" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="40" width="195" height="34" rx="6" class="fg-good"/>
            <rect x="205" y="40" width="115" height="34" rx="6" class="fg-bad"/>
            <text x="10" y="30" class="t-sm">0</text>
            <text x="205" y="30" text-anchor="middle" class="t-sm t-b">25 wk</text>
            <text x="320" y="30" text-anchor="end" class="t-sm">40 wk</text>
            <text x="107" y="62" text-anchor="middle" class="t-sm t-b">1st + 2nd trimester</text>
            <text x="262" y="62" text-anchor="middle" class="t-sm t-b">3rd</text>
            <text x="10" y="100" class="t-sm t-good">Biopsy if non-diagnostic work-up</text>
            <text x="10" y="116" class="t-sm t-good">and diagnosis changes treatment</text>
            <text x="320" y="140" text-anchor="end" class="t-sm t-bad">More bleeding risk;</text>
            <text x="320" y="156" text-anchor="end" class="t-sm t-bad">viable fetus: deliver, then biopsy</text>
          </svg>
      - kind: check
        page: 362
        quote: "Delivery prior to biopsy may be a more prudent option for the late-term pregnancies, especially if the fetus has reached viability."
        question: "At 33 weeks with a viable fetus and unexplained AKI, what is the most prudent plan?"
        options:
          - "Biopsy today"
          - "Deliver first, then biopsy"
          - "Never biopsy"
          - "Start mycophenolate empirically"
        answer: 1
        why:
          - "بعد 25 أسبوع المضاعفات أكتر."
          - "صح: في آخر الحمل والجنين viable، الولادة قبل الـ biopsy أعقل."
          - "الـ biopsy مفيدة لو هتغيّر العلاج، بس في وقتها."
          - "الـ MMF teratogenic وممنوع."
      - kind: explain
        page: 363
        title: "العلاج العام"
        quote: "include identification of the underlying cause of kidney injury, intravenous fluid resuscitation, timely initiation of dialysis if needed, and prompt delivery of fetus"
        text: |
          فريق: nephrologist و obstetrician و neonatologist.
          - **السبب** الأول.
          - **IV fluids** للـ prerenal، بس ==بحذر== في الـ preeclampsia والـ sepsis (pulmonary edema).
          - **Dialysis** في وقتها.
          - **الولادة** لو لازم: الـ severe preeclampsia و HELLP و AFLP علاجها ولادة، ومعاها **steroids** لو قبل 34 أسبوع.
          - الباقي زي برّه الحمل: alkali، loop diuretics، دم، potassium binders.
      - kind: reveal
        page: 363
        quote: "Since pregnancy is a state of physiological respiratory alkalosis, arterial or venous blood gas should be used to diagnose metabolic acidosis"
        prompt: "ليه مينفعش تعتمد على الـ bicarbonate في الـ chemistry عشان تشخّص metabolic acidosis عند حامل؟"
        answer: "لأن الحمل فيه ==respiratory alkalosis== طبيعية، والكلية بتنزّل الـ bicarbonate تعويض. فالـ HCO3 الواطي ممكن يكون طبيعي. لازم **blood gas**."
      - kind: table
        page: 363
        quote: "Azathioprine and calcineurin inhibitors (cyclosporine and tacrolimus) are not teratogenic and commonly used immunosuppressive drugs in pregnancy."
        title: "الـ immunosuppression في الحمل"
        columns: ["Drug", "الحكم"]
        rows:
          - ["Mycophenolate", "ممنوع (teratogenic)"]
          - ["Low-dose steroids", "مسموح، راقب gestational diabetes"]
          - ["Azathioprine", "مسموح"]
          - ["Tacrolimus / cyclosporine", "مسموح، الجرعة أعلى، راقب الـ trough"]
        hide: [[0, 1], [2, 1], [3, 1]]
      - kind: aside
        tone: exam
        page: 364
        quote: "In ADAMTS13-deficient TMA, the goal is to regain enzymatic activity through plasma exchange, and if plasma exchange is unsuccessful, rituximab is"
        text: |
          TMA: **plasmapheresis** للاتنين، و **eculizumab** للـ aHUS. لو الـ plasma exchange فشل في الـ ADAMTS13 deficiency، ==rituximab== option بحذر (toxicity في أقل من 10% من المواليد، ومفيش بيانات طويلة).
