          - **Picture**: fever، diaphoresis (عرق)، malaise، anorexia، jaundice، و RUQ discomfort.
          - **Diagnosis**: ==granuloma== on liver biopsy.
          - **Timing**: عادة في الـ first 2 months من العلاج.

          الصورة شبه عدوى (حمى وعرق)، فالدليل الحاسم هو الـ biopsy. والتفسير المقبول إن الـ granuloma هنا رد فعل مناعي للدوا، زي الـ hypersensitivity اللي شفناها في الـ FARE.
